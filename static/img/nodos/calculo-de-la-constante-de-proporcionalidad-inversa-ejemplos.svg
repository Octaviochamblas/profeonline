<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Rapidez y Tiempo de viaje</text>
  <text x="35" y="85" class="text-step">A 60 km/h tarda 4 horas en llegar a destino:</text>
  <text x="35" y="115" class="text-step">Paso 1: Calcular producto k = v · t</text>
  <text x="35" y="140" class="math">k = 60 · 4 = 240 km (distancia total)</text>
  <text x="35" y="170" class="text-step">Paso 2: Hallar tiempo a 80 km/h</text>
  <g transform="translate(35, 185)">
    <text x="0" y="18" class="math">t =</text>
    <g transform="translate(25, 0)">
      <text x="15" y="12" class="math" text-anchor="middle">240</text>
      <line x1="0" y1="16" x2="30" y2="16" class="frac-line"/>
      <text x="15" y="30" class="math" text-anchor="middle">80</text>
    </g>
    <text x="65" y="18" class="math">= 3 horas</text>
  </g>
  <text x="35" y="235" class="res">k = 240 km, t = 3 h</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Rectángulo de área constante</text>
  <text x="365" y="85" class="text-step">Base = 8 cm, Altura = 6 cm:</text>
  <text x="365" y="115" class="text-step">Paso 1: Hallar constante k (Área)</text>
  <text x="365" y="140" class="math">k = 8 · 6 = 48 cm²</text>
  <text x="365" y="170" class="text-step">Paso 2: Si la base mide 12 cm, ¿cuánto la altura?</text>
  <g transform="translate(365, 185)">
    <text x="0" y="18" class="math">h =</text>
    <g transform="translate(25, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">48</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">12</text>
    </g>
    <text x="60" y="18" class="math">= 4 cm</text>
  </g>
  <text x="365" y="235" class="res">k = 48 cm², h = 4 cm</text>
</svg>
