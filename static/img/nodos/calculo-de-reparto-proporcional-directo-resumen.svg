<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .rule-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .err-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 17px; font-weight: bold; fill: #1d4ed8; }
      .err-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #991b1b; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="15" width="640" height="118" class="rule-box"/>
  <text x="40" y="40" class="title">MÉTODO DE LA CONSTANTE DE REPARTO</text>

  <g transform="translate(40, 50)">
    <text x="0" y="30" class="formula">k =</text>
    <g transform="translate(30, 0)">
      <text x="35" y="16" class="formula" text-anchor="middle">Total T</text>
      <line x1="0" y1="22" x2="70" y2="22" class="frac-line"/>
      <text x="35" y="40" class="formula" text-anchor="middle">∑ c<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
    </g>
    <text x="115" y="30" class="formula">⟹   Parte <tspan font-style="italic">i</tspan> = c<tspan baseline-shift="sub" font-size="70%">i</tspan> · k   (con ∑ Parte<tspan baseline-shift="sub" font-size="70%">i</tspan> = T)</text>
  </g>
  <text x="40" y="118" class="desc">A mayor índice de reparto corresponde proporcionalmente una mayor cuota del total.</text>

  <rect x="20" y="145" width="640" height="118" class="err-box"/>
  <text x="40" y="172" class="err-text">¡ERROR FRECUENTE A EVITAR!</text>
  <text x="40" y="200" class="desc">❌ Dividir el total entre el número de participantes en vez de dividirlo entre la suma de los índices c₁ + c₂ + ...</text>
  <text x="40" y="230" class="desc">❌ No verificar que la suma de las partes individuales coincida exactamente con el total repartido.</text>
</svg>
