<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Ejemplos Guiados — Construcción con 3 Variables</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-indigo)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Evaluación: (p ∧ q) → r</text>

    <rect x="44" y="135" width="320" height="40" rx="6" fill="#f1f5f9"/>
    <text x="56" y="160" fill="#0f172a" font-size="13" font-weight="800">3 variables ➔ 8 filas en total</text>

    <rect x="44" y="185" width="320" height="65" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="56" y="207" fill="#1e40af" font-size="11.5" font-weight="700">Vectores de la Evaluación:</text>
    <text x="56" y="225" fill="#334155" font-size="11.5">• p ∧ q = [V, V, F, F, F, F, F, F]ᵀ</text>
    <text x="56" y="242" fill="#334155" font-size="11.5">• (p ∧ q) → r = [V, F, V, V, V, V, V, V]ᵀ</text>

    <rect x="44" y="260" width="320" height="60" rx="10" fill="#2563eb"/>
    <text x="204" y="285" fill="#dbeafe" font-size="12.5" text-anchor="middle">Resultado (7 V y 1 F):</text>
    <text x="204" y="308" fill="#ffffff" font-size="17" font-weight="900" text-anchor="middle">CONTINGENCIA</text>
    <text x="204" y="350" fill="#475569" font-size="11.5" text-anchor="middle">Solo es falsa en la fila 2 (V, V, F).</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">Ley Distributiva: p ∨ (q ∧ r)</text>

    <rect x="436" y="135" width="320" height="40" rx="6" fill="#f1f5f9"/>
    <text x="448" y="160" fill="#0f172a" font-size="13" font-weight="800">Equivalencia Lógica Fundamental</text>

    <rect x="436" y="185" width="320" height="65" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="448" y="207" fill="#0f766e" font-size="11.5" font-weight="700">Comparación de Vectores:</text>
    <text x="448" y="225" fill="#334155" font-size="11">• p ∨ (q ∧ r) = [V, V, V, V, V, F, F, F]ᵀ</text>
    <text x="448" y="242" fill="#334155" font-size="11">• (p∨q) ∧ (p∨r) = [V, V, V, V, V, F, F, F]ᵀ</text>

    <rect x="436" y="260" width="320" height="60" rx="10" fill="#0d9488"/>
    <text x="596" y="285" fill="#ccfbf1" font-size="12.5" text-anchor="middle">Demostración por Tablas:</text>
    <text x="596" y="308" fill="#ffffff" font-size="17" font-weight="900" text-anchor="middle">EQUIVALENCIA COMPLETA (≡)</text>
    <text x="596" y="350" fill="#475569" font-size="11.5" text-anchor="middle">Ambas expresiones tienen idéntica tabla.</text>
  </g>

</svg>
