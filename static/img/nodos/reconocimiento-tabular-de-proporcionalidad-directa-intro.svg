<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #1d4ed8; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 6; }
      .th { fill: #1e40af; }
      .th-text { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
      .td-text { font-family: "Cambria Math", serif; font-size: 14px; fill: #0f172a; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="50" class="header-box"/>
  <text x="340" y="45" text-anchor="middle" class="title">RECONOCIMIENTO TABULAR DE PROPORCIÓN DIRECTA</text>
  <text x="340" y="60" text-anchor="middle" class="text-main">Una tabla es directamente proporcional si cada fila y/x arroja el mismo valor k</text>

  <!-- Tabla estructurada -->
  <rect x="20" y="85" width="640" height="175" class="card"/>

  <g transform="translate(60, 105)">
    <!-- Cabecera -->
    <rect x="0" y="0" width="100" height="30" class="th" rx="4"/>
    <text x="50" y="20" text-anchor="middle" class="th-text">x (Entrada)</text>
    <rect x="110" y="0" width="90" height="30" fill="#e2e8f0" rx="4"/>
    <text x="155" y="20" text-anchor="middle" class="td-text">2</text>
    <rect x="210" y="0" width="90" height="30" fill="#e2e8f0" rx="4"/>
    <text x="255" y="20" text-anchor="middle" class="td-text">4</text>
    <rect x="310" y="0" width="90" height="30" fill="#e2e8f0" rx="4"/>
    <text x="355" y="20" text-anchor="middle" class="td-text">6</text>
    <rect x="410" y="0" width="130" height="30" fill="#e2e8f0" rx="4"/>
    <text x="475" y="20" text-anchor="middle" class="td-text">10</text>

    <!-- Fila y -->
    <rect x="0" y="40" width="100" height="30" class="th" rx="4"/>
    <text x="50" y="60" text-anchor="middle" class="th-text">y (Salida)</text>
    <rect x="110" y="40" width="90" height="30" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="155" y="60" text-anchor="middle" class="td-text">10</text>
    <rect x="210" y="40" width="90" height="30" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="255" y="60" text-anchor="middle" class="td-text">20</text>
    <rect x="310" y="40" width="90" height="30" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="355" y="60" text-anchor="middle" class="td-text">30</text>
    <rect x="410" y="40" width="130" height="30" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="475" y="60" text-anchor="middle" class="td-text">50</text>

    <!-- Fila Cociente y/x -->
    <rect x="0" y="80" width="100" height="30" fill="#15803d" rx="4"/>
    <text x="50" y="100" text-anchor="middle" class="th-text">Cociente y/x</text>
    <rect x="110" y="80" width="90" height="30" fill="#dcfce7" stroke="#86efac" rx="4"/>
    <text x="155" y="100" text-anchor="middle" class="td-text" fill="#166534">k = 5</text>
    <rect x="210" y="80" width="90" height="30" fill="#dcfce7" stroke="#86efac" rx="4"/>
    <text x="255" y="100" text-anchor="middle" class="td-text" fill="#166534">k = 5</text>
    <rect x="310" y="80" width="90" height="30" fill="#dcfce7" stroke="#86efac" rx="4"/>
    <text x="355" y="100" text-anchor="middle" class="td-text" fill="#166534">k = 5</text>
    <rect x="410" y="80" width="130" height="30" fill="#dcfce7" stroke="#86efac" rx="4"/>
    <text x="475" y="100" text-anchor="middle" class="td-text" fill="#166534">k = 5 (Constante)</text>
  </g>
  <text x="340" y="240" text-anchor="middle" class="text-main" font-weight="600">✓ Todos los pares ordenados satisfacen y = 5 · x</text>
</svg>
