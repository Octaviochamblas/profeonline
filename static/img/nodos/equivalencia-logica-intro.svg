<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Equivalencia Lógica Fundamental (A ≡ B)</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-indigo)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Identidad Estricta de Vectores</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Dos fórmulas son equivalentes si comparten idéntica tabla de verdad.</text>

    <!-- Equivalence visual -->
    <rect x="44" y="165" width="138" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="113" y="193" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">Fórmula A</text>
    <text x="113" y="218" fill="#1d4ed8" font-size="15" font-weight="800" text-anchor="middle">p → q</text>

    <text x="204" y="208" fill="#4338ca" font-size="22" font-weight="900" text-anchor="middle">≡</text>

    <rect x="226" y="165" width="138" height="70" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="295" y="193" fill="#7e22ce" font-size="12" font-weight="700" text-anchor="middle">Fórmula B</text>
    <text x="295" y="218" fill="#6b21a8" font-size="15" font-weight="800" text-anchor="middle">¬p ∨ q</text>

    <rect x="44" y="255" width="320" height="115" rx="10" fill="#f1f5f9"/>
    <text x="56" y="280" fill="#334155" font-size="12.5" font-weight="700">Criterio Semántico:</text>
    <text x="56" y="304" fill="#475569" font-size="12">• A ≡ B si y solo si A ↔ B es una Tautología.</text>
    <text x="56" y="326" fill="#475569" font-size="12">• Tienen idéntico significado formal.</text>
    <text x="56" y="350" fill="#4338ca" font-size="12" font-weight="700">Permite sustitución salva veritate en cálculos.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Comprobación por Bicondicional</text>

    <rect x="440" y="145" width="95" height="35" fill="#0f172a" rx="4"/>
    <text x="487" y="168" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">A: p → q</text>

    <rect x="545" y="145" width="95" height="35" fill="#1e293b" rx="4"/>
    <text x="592" y="168" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">B: ¬p ∨ q</text>

    <rect x="650" y="145" width="105" height="35" fill="#4338ca" rx="4"/>
    <text x="702" y="168" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">A ↔ B</text>

    <rect x="440" y="190" width="315" height="32" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="487" y="211" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V</text>
    <text x="592" y="211" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V</text>
    <text x="702" y="211" fill="#059669" font-size="15" font-weight="900" text-anchor="middle">V  ✓</text>

    <rect x="440" y="226" width="315" height="32" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="487" y="247" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">F</text>
    <text x="592" y="247" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">F</text>
    <text x="702" y="247" fill="#059669" font-size="15" font-weight="900" text-anchor="middle">V  ✓</text>

    <rect x="440" y="262" width="315" height="32" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="487" y="283" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V</text>
    <text x="592" y="283" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V</text>
    <text x="702" y="283" fill="#059669" font-size="15" font-weight="900" text-anchor="middle">V  ✓</text>

    <rect x="440" y="298" width="315" height="32" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="487" y="319" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V</text>
    <text x="592" y="319" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V</text>
    <text x="702" y="319" fill="#059669" font-size="15" font-weight="900" text-anchor="middle">V  ✓</text>

    <text x="596" y="358" fill="#4338ca" font-size="11.5" font-weight="700" text-anchor="middle">Bicondicional tautológico ➔ A ≡ B.</text>
  </g>

</svg>
