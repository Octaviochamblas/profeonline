<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="175" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="87" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Ejemplos: Adición de Decimales Paso a Paso</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Alineación columnar, igualación de cifras con ceros y cálculo de sumas</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Suma Directa</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="86" fill="#38bdf8" font-family="monospace" font-size="12">  12.45</text>
        <text x="25" y="106" fill="#38bdf8" font-family="monospace" font-size="12">+  3.21</text>
        <line x1="25" y1="114" x2="185" y2="114" stroke="#334155" stroke-width="1.5"/>
        <text x="25" y="134" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">= 15.66 ✓</text>

        <text x="20" y="175" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">Sin reservas ✓</text>
        <text x="20" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cifras alineadas directamente.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Coma en posición fija</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Con Reservas</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <text x="25" y="86" fill="#38bdf8" font-family="monospace" font-size="12">  45.89</text>
        <text x="25" y="106" fill="#38bdf8" font-family="monospace" font-size="12">+  7.63</text>
        <line x1="25" y1="114" x2="185" y2="114" stroke="#334155" stroke-width="1.5"/>
        <text x="25" y="134" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">= 53.52 ✓</text>

        <text x="20" y="175" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">Reserva de Décimos</text>
        <text x="20" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">9+3=12 (va 1) | 8+6+1=15 (va 1).</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 5+7+1 = 13 (53.52)</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Distintas Cifras</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="86" fill="#fbbf24" font-family="monospace" font-size="12">  8.500</text>
        <text x="25" y="106" fill="#fbbf24" font-family="monospace" font-size="12">+ 1.275</text>
        <line x1="25" y1="114" x2="185" y2="114" stroke="#334155" stroke-width="1.5"/>
        <text x="25" y="134" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">= 9.775 ✓</text>

        <text x="20" y="175" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">Completar con Ceros</text>
        <text x="20" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">8.5 se escribe como 8.500.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Evita errores de orden</text>
      </g>
    </g>

</svg>
