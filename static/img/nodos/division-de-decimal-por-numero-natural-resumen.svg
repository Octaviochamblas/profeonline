<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="175" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="87" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: División de Decimal por Natural</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Condiciones de resto cero, adición de ceros decimales y verificación</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">MECANISMO DE DIVISIÓN POR UN NÚMERO NATURAL</text>
        <text x="325" y="48" fill="#34d399" font-family="monospace" font-size="13" text-anchor="middle">Dividendo = Divisor · Cociente + Resto</text>
        <text x="325" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Si sobra resto tras agotar cifras decimales, se agregan ceros para continuar dividiendo.</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Continuación con Ceros</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">En 5 : 4 ➔ 1 entero (sobra 1).</text>
        <text x="20" y="74" fill="#38bdf8" font-family="monospace" font-size="11">Poner '1,' y agregar 0 ➔ 10 : 4 = 2</text>
        <text x="20" y="96" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Sobra 2 ➔ 20 : 4 = 5  ⟹  1.25.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Comprobación</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Para validar el resultado obtenido:</text>
        <text x="20" y="74" fill="#fbbf24" font-family="monospace" font-size="11">Multiplicar Cociente · Divisor</text>
        <text x="20" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Debe restituir exactamente el dividendo.</text>
      </g>
    </g>

</svg>
