<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Panes y Costo total</text>
  <text x="35" y="85" class="text-step">1 pan = $250, 2 panes = $500, 3 panes = $750</text>
  <text x="35" y="115" class="text-step">Paso 1: Calcular cocientes y/x</text>
  <text x="35" y="140" class="math">250/1 = 250,  500/2 = 250,  750/3 = 250</text>
  <text x="35" y="170" class="text-step">Paso 2: Conclusión</text>
  <text x="35" y="195" class="math">Cociente constante k = 250 $/pan</text>
  <text x="35" y="235" class="res">Sí es Proporcionalidad Directa</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Edad y Estatura</text>
  <text x="365" y="85" class="text-step">Edad 10 años (130 cm), Edad 20 años (175 cm)</text>
  <text x="365" y="115" class="text-step">Paso 1: Calcular cocientes</text>
  <text x="365" y="140" class="math">130/10 = 13,   175/20 = 8,75</text>
  <text x="365" y="170" class="text-step">Paso 2: Al duplicar la edad, la estatura no se duplica</text>
  <text x="365" y="195" class="math">Cocientes distintos (13 ≠ 8,75)</text>
  <text x="365" y="235" class="res" style="fill: #dc2626;">No es Proporcionalidad Directa</text>
</svg>
