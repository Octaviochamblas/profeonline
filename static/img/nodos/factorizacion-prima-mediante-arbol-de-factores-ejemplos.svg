<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="lightShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Árboles de Factores Resueltos</text>
    <text x="0" y="74" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Bifurcaciones visuales para descomponer números en hojas primas circulares</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Árbol de 36</text>

        <rect x="15" y="65" width="190" height="110" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="110" y="85" fill="#0f172a" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">36</text>
        <text x="110" y="105" fill="#475569" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">↙    ↘</text>
        <text x="110" y="125" fill="#0f172a" font-family="monospace" font-size="12" text-anchor="middle">4   ×   9</text>
        <text x="110" y="145" fill="#475569" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">↙ ↘    ↙ ↘</text>
        <text x="110" y="165" fill="#059669" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">(2) (2)  (3) (3)</text>

        <text x="20" y="200" fill="#059669" font-family="monospace" font-size="13" font-weight="700">36 = 2² · 3²</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 4 hojas primas</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#059669"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Árbol de 90</text>

        <rect x="15" y="65" width="190" height="110" rx="6" fill="#ffffff" stroke="#059669"/>
        <text x="110" y="85" fill="#0f172a" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">90</text>
        <text x="110" y="105" fill="#475569" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">↙    ↘</text>
        <text x="110" y="125" fill="#0f172a" font-family="monospace" font-size="12" text-anchor="middle">9   ×   10</text>
        <text x="110" y="145" fill="#475569" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">↙ ↘    ↙ ↘</text>
        <text x="110" y="165" fill="#059669" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">(3) (3)  (2) (5)</text>

        <text x="20" y="200" fill="#059669" font-family="monospace" font-size="13" font-weight="700">90 = 2 · 3² · 5</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Primos en orden</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#d97706"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Árbol de 80</text>

        <rect x="15" y="65" width="190" height="110" rx="6" fill="#ffffff" stroke="#d97706"/>
        <text x="110" y="85" fill="#0f172a" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">80</text>
        <text x="110" y="105" fill="#475569" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">↙    ↘</text>
        <text x="110" y="125" fill="#0f172a" font-family="monospace" font-size="12" text-anchor="middle">8   ×   10</text>
        <text x="110" y="145" fill="#475569" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">↙ ↘    ↙ ↘</text>
        <text x="110" y="165" fill="#059669" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">(2) (4)  (2) (5)</text>

        <text x="20" y="200" fill="#059669" font-family="monospace" font-size="13" font-weight="700">80 = 2⁴ · 5</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 4 se divide en 2·2</text>
      </g>
    </g>

</svg>
