<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #1d4ed8; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 8; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; }
      .math-bold { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="15" width="640" height="48" class="header-box"/>
  <text x="340" y="36" text-anchor="middle" class="title">PORCENTAJE DE UN PORCENTAJE (ENCADENAMIENTO)</text>
  <text x="340" y="52" text-anchor="middle" class="text-main">Multiplicación sucesiva de los factores decimales o fraccionarios</text>

  <!-- Formula central -->
  <rect x="20" y="75" width="640" height="85" class="card"/>
  <rect x="35" y="85" width="610" height="65" class="badge-blue"/>

  <g transform="translate(65, 92)">
    <text x="0" y="34" class="formula"><tspan font-style="italic">a</tspan>% del <tspan font-style="italic">b</tspan>% de N =</text>
    <g transform="translate(160, 0)">
      <text x="18" y="18" class="formula" text-anchor="middle"><tspan font-style="italic">a</tspan></text>
      <line x1="0" y1="26" x2="36" y2="26" class="frac-line"/>
      <text x="18" y="46" class="formula" text-anchor="middle">100</text>
    </g>
    <text x="205" y="34" class="formula">·</text>
    <g transform="translate(220, 0)">
      <text x="18" y="18" class="formula" text-anchor="middle"><tspan font-style="italic">b</tspan></text>
      <line x1="0" y1="26" x2="36" y2="26" class="frac-line"/>
      <text x="18" y="46" class="formula" text-anchor="middle">100</text>
    </g>
    <text x="265" y="34" class="formula">· N =</text>
    <g transform="translate(325, 0)">
      <text x="30" y="18" class="formula" text-anchor="middle"><tspan font-style="italic">a</tspan> · <tspan font-style="italic">b</tspan></text>
      <line x1="0" y1="26" x2="60" y2="26" class="frac-line"/>
      <text x="30" y="46" class="formula" text-anchor="middle">100</text>
    </g>
    <text x="395" y="34" class="formula">% de N</text>
  </g>

  <!-- 2 Cards explicativas -->
  <rect x="20" y="172" width="310" height="92" class="card"/>
  <rect x="35" y="182" width="140" height="24" class="badge-green"/>
  <text x="105" y="198" text-anchor="middle" class="text-green">Multiplicación Decimal</text>
  <text x="35" y="226" class="text-main">20% del 50% de N:</text>
  <text x="35" y="248" class="math-bold">0,20 · 0,50 · N = 0,10 · N (el 10% de N)</text>

  <rect x="350" y="172" width="310" height="92" class="card"/>
  <rect x="365" y="182" width="140" height="24" class="badge-amber"/>
  <text x="435" y="198" text-anchor="middle" class="text-amber">¡No se Suman!</text>
  <text x="365" y="226" class="text-main">El 20% del 50%:</text>
  <text x="365" y="248" class="math-bold">Es el 10% (¡NO es el 70% ni el 30%!)</text>
</svg>
