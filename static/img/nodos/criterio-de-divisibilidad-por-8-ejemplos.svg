<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Análisis de las Tres Últimas Cifras</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Comprobación de divisibilidad por 8 en números grandes</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Evaluar 4.872.128</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Tres últimas cifras:</text>
        <text x="25" y="108" fill="#1d4ed8" font-family="monospace" font-size="13" font-weight="700">'128' (128 ÷ 8 = 16)</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">128 es divisible por 8.</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Fórmula rápida:</text>
        <text x="20" y="190" fill="#0f172a" font-family="monospace" font-size="11">4(1) + 2(2) + 8 = 16 (✓)</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Divisible por 8</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#ef4444"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Evaluar 95.342</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#ef4444"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Tres últimas cifras:</text>
        <text x="25" y="108" fill="#dc2626" font-family="monospace" font-size="13" font-weight="700">'342' (342 ÷ 8 = 42 r:6)</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">342 no es divisible por 8.</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">4(3) + 2(4) + 2 = 22</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">(22 no es múltiplo de 8).</text>
        <text x="20" y="230" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="600">❌ NO divisible (r = 6)</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Terminación '000'</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#10b981"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Ejemplo 54.000:</text>
        <text x="25" y="108" fill="#059669" font-family="monospace" font-size="13" font-weight="700">Termina en '000'</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Todo millar exacto</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">es divisible por 8</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">(54000 = 8 · 6750).</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Siempre divisible</text>
      </g>
    </g>

</svg>
