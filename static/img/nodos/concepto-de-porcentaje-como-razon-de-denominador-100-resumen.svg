<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .rule-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .err-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #1d4ed8; }
      .err-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #991b1b; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="15" width="640" height="118" class="rule-box"/>
  <text x="40" y="40" class="title">DEFINICIÓN CANÓNICA DEL PORCENTAJE</text>

  <g transform="translate(40, 50)">
    <text x="0" y="30" class="formula"><tspan font-style="italic">c</tspan>% =</text>
    <g transform="translate(35, 0)">
      <text x="25" y="16" class="formula" text-anchor="middle"><tspan font-style="italic">c</tspan></text>
      <line x1="0" y1="22" x2="50" y2="22" class="frac-line"/>
      <text x="25" y="40" class="formula" text-anchor="middle">100</text>
    </g>
    <text x="95" y="30" class="formula">= <tspan font-style="italic">c</tspan> ÷ 100 = <tspan font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="70%">decimal</tspan></text>
  </g>
  <text x="40" y="118" class="desc">Todo porcentaje es una razón geométrica de antecedente c y consecuente constante 100.</text>

  <rect x="20" y="145" width="640" height="118" class="err-box"/>
  <text x="40" y="172" class="err-text">¡ERROR FRECUENTE A EVITAR!</text>
  <text x="40" y="200" class="desc">❌ Confundir el porcentaje c% con la cantidad absoluta (ej: 20% de 50 no es 20 personas, es 10).</text>
  <text x="40" y="230" class="desc">❌ Olvidar que el porcentaje siempre se calcula respecto a un total de referencia determinado.</text>
</svg>
