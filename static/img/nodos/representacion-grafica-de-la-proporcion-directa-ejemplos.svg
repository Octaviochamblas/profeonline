<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Obtener k del gráfico</text>
  <text x="35" y="85" class="text-step">La recta pasa por (0,0) y por el punto (4, 18):</text>
  <text x="35" y="115" class="text-step">Paso 1: Identificar coordenadas (x=4, y=18)</text>
  <text x="35" y="140" class="math">k = y / x = 18 / 4 = 4,5</text>
  <text x="35" y="170" class="text-step">Paso 2: Escribir la función lineal</text>
  <text x="35" y="195" class="math">y = 4,5 · x</text>
  <text x="35" y="235" class="res">Pendiente k = 4,5</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Descartar recta no directa</text>
  <text x="365" y="85" class="text-step">Una recta pasa por (0, 10) y (2, 20):</text>
  <text x="365" y="115" class="text-step">Paso 1: Evaluar intersección con el eje Y</text>
  <text x="365" y="140" class="math">No pasa por (0, 0); corta en y = 10</text>
  <text x="365" y="170" class="text-step">Paso 2: Cocientes: 10/0 (indef), 20/2 = 10</text>
  <text x="365" y="195" class="math">Es función afín (y = 5x + 10)</text>
  <text x="365" y="235" class="res" style="fill: #dc2626;">Gráfico NO Proporcional Directo</text>
</svg>
