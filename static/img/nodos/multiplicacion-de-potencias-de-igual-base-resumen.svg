<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: Multiplicación de Igual Base</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Resumen operativo y generalización algebraica</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">SÍNTESIS DEL PRODUCTO DE IGUAL BASE</text>
        <text x="325" y="48" fill="#34d399" font-family="monospace" font-size="13" text-anchor="middle">a<tspan baseline-shift="super" font-size="70%">m</tspan> · a<tspan baseline-shift="super" font-size="70%">n</tspan> = a<tspan baseline-shift="super" font-size="70%">m+n</tspan>   |   a · a<tspan baseline-shift="super" font-size="70%">n</tspan> = a<tspan baseline-shift="super" font-size="70%">1+n</tspan>   |   a<tspan baseline-shift="super" font-size="70%">p</tspan> · a<tspan baseline-shift="super" font-size="70%">q</tspan> · a<tspan baseline-shift="super" font-size="70%">r</tspan> = a<tspan baseline-shift="super" font-size="70%">p+q+r</tspan></text>
        <text x="325" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Aplica de forma universal a bases reales y exponentes enteros, negativos o fraccionarios.</text>
      </g>
      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Regla Básica</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1. Conservar la base idéntica.</text>
        <text x="20" y="74" fill="#38bdf8" font-family="monospace" font-size="11">2. Sumar algebraicamente exp.</text>
        <text x="20" y="96" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">3. Simplificar la potencia.</text>
      </g>
      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">No Confundir con Suma</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">¡No aplica a sumas de potencias!</text>
        <text x="20" y="74" fill="#fbbf24" font-family="monospace" font-size="11">2<tspan baseline-shift="super" font-size="70%">3</tspan> + 2<tspan baseline-shift="super" font-size="70%">3</tspan> = 2 · 2<tspan baseline-shift="super" font-size="70%">3</tspan> = 2<tspan baseline-shift="super" font-size="70%">4</tspan> = 16</text>
        <text x="20" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">2<tspan baseline-shift="super" font-size="70%">3</tspan> + 2<tspan baseline-shift="super" font-size="70%">3</tspan> ≠ 2<tspan baseline-shift="super" font-size="70%">6</tspan> (64 ≠ 16).</text>
      </g>
    </g>

</svg>
