<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="0.02em">Ejemplos Guiados — Bicondicional (↔)</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-indigo)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Definición Geométrica (V ↔ V)</text>

    <rect x="44" y="135" width="320" height="48" rx="8" fill="#f1f5f9"/>
    <text x="56" y="164" fill="#0f172a" font-size="14" font-weight="800">"Triángulo equilátero  ↔  Triángulo equiángulo"</text>

    <rect x="44" y="195" width="150" height="55" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="56" y="217" fill="#065f46" font-size="12">Lados iguales:</text>
    <text x="56" y="238" fill="#059669" font-size="15" font-weight="800">Verdadero (V)</text>

    <rect x="214" y="195" width="150" height="55" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="226" y="217" fill="#065f46" font-size="12">Ángulos iguales:</text>
    <text x="226" y="238" fill="#059669" font-size="15" font-weight="800">Verdadero (V)</text>

    <rect x="44" y="265" width="320" height="65" rx="10" fill="#4338ca"/>
    <text x="204" y="290" fill="#e0e7ff" font-size="13" text-anchor="middle">Operación final: V ↔ V</text>
    <text x="204" y="318" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">RESULTADO = VERDADERO (V)</text>
    <text x="204" y="355" fill="#475569" font-size="12" text-anchor="middle">Ambas propiedades son matemáticamente equivalentes.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-rose)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">Bicondicional de Falsedades (F ↔ F)</text>

    <rect x="436" y="135" width="320" height="48" rx="8" fill="#f1f5f9"/>
    <text x="448" y="164" fill="#0f172a" font-size="15" font-weight="800">"( 2 &gt; 9 )  ↔  ( 10 &lt; 1 )"</text>

    <rect x="436" y="195" width="150" height="55" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="448" y="217" fill="#991b1b" font-size="12">Parte 1: 2 &gt; 9</text>
    <text x="448" y="238" fill="#dc2626" font-size="15" font-weight="800">Falso (F)</text>

    <rect x="606" y="195" width="150" height="55" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="618" y="217" fill="#991b1b" font-size="12">Parte 2: 10 &lt; 1</text>
    <text x="618" y="238" fill="#dc2626" font-size="15" font-weight="800">Falso (F)</text>

    <rect x="436" y="265" width="320" height="65" rx="10" fill="#059669"/>
    <text x="596" y="290" fill="#d1fae5" font-size="13" text-anchor="middle">Operación final: F ↔ F</text>
    <text x="596" y="318" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">RESULTADO = VERDADERO (V)</text>
    <text x="596" y="355" fill="#475569" font-size="12" text-anchor="middle">Coinciden en su falsedad, por ende el bicondicional es verdadero.</text>
  </g>

</svg>
