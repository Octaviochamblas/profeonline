<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #1e293b; }
      .title-text { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
      .subtitle-text { fill: #93c5fd; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .card-title { fill: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .card-desc { fill: #475569; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; line-height: 1.4; }
      .card-math { fill: #1e293b; font-family: 'Cambria Math', 'KaTeX_Main', serif; font-size: 15px; font-style: italic; font-weight: 600; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .step-num { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="360" rx="20" class="bg" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Dark Header Banner (High Contrast) -->
  <path d="M 0 20 Q 0 0 20 0 L 780 0 Q 800 0 800 20 L 800 72 L 0 72 Z" class="header-bg"/>
  <circle cx="36" cy="36" r="18" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="36" y="42" font-size="18" text-anchor="middle" fill="#60a5fa">📐</text>

  <text x="66" y="33" class="title-text">Asignación de Variables a Proposiciones</text>
  <text x="66" y="53" class="subtitle-text">Ejemplo de traducción y etiquetado de premisas</text>

  <!-- Body Content -->

    <g transform="translate(30, 92)">
      <!-- Enunciado Completo -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="740" height="55" rx="10" class="card-bg"/>
        <text x="20" y="34" class="card-title" fill="#1e293b">Texto: "Si llueve hoy, entonces el suelo estará mojado y suspenderán el partido"</text>
      </g>

      <!-- Step 1: p -->
      <g transform="translate(0, 68)" filter="url(#shadow)">
        <rect width="740" height="50" rx="10" class="card-bg"/>
        <rect x="0" y="0" width="6" height="50" rx="3" fill="#3b82f6"/>
        <rect x="20" y="12" width="30" height="26" rx="6" fill="#eff6ff"/>
        <text x="35" y="30" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">p</text>
        <text x="64" y="32" class="card-desc" font-weight="600">"Llueve hoy"</text>
      </g>

      <!-- Step 2: q -->
      <g transform="translate(0, 126)" filter="url(#shadow)">
        <rect width="740" height="50" rx="10" class="card-bg"/>
        <rect x="0" y="0" width="6" height="50" rx="3" fill="#10b981"/>
        <rect x="20" y="12" width="30" height="26" rx="6" fill="#f0fdf4"/>
        <text x="35" y="30" font-size="15" font-weight="800" fill="#15803d" text-anchor="middle">q</text>
        <text x="64" y="32" class="card-desc" font-weight="600">"El suelo estará mojado"</text>
      </g>

      <!-- Step 3: r -->
      <g transform="translate(0, 184)" filter="url(#shadow)">
        <rect width="740" height="50" rx="10" class="card-bg"/>
        <rect x="0" y="0" width="6" height="50" rx="3" fill="#a855f7"/>
        <rect x="20" y="12" width="30" height="26" rx="6" fill="#faf5ff"/>
        <text x="35" y="30" font-size="15" font-weight="800" fill="#7e22ce" text-anchor="middle">r</text>
        <text x="64" y="32" class="card-desc" font-weight="600">"Suspenderán el partido"</text>

        <rect x="560" y="10" width="160" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="640" y="30" class="badge-text" fill="#334155" text-anchor="middle">Fórmula: p → (q ∧ r)</text>
      </g>
    </g>

</svg>
