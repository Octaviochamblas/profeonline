<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Intersección de Listas de Múltiplos</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Construcción y comparación explícita de filas de múltiplos positivos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcm(6, 8)</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="85" fill="#94a3b8" font-family="monospace" font-size="11">M(6): 6, 12, 18, 24, 30</text>
        <text x="25" y="105" fill="#94a3b8" font-family="monospace" font-size="11">M(8): 8, 16, 24, 32, 40</text>
        <text x="25" y="130" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">Coincidencia: 24</text>

        <text x="20" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Múltiplos comunes:</text>
        <text x="20" y="200" fill="#38bdf8" font-family="monospace" font-size="12">{24, 48, 72, ...}</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ mcm(6, 8) = 24</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcm(8, 12)</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <text x="25" y="85" fill="#94a3b8" font-family="monospace" font-size="11">M(8):  8, 16, 24, 32, 40</text>
        <text x="25" y="105" fill="#94a3b8" font-family="monospace" font-size="11">M(12): 12, 24, 36, 48</text>
        <text x="25" y="130" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">Coincidencia: 24</text>

        <text x="20" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">24 es múltiplo de 8</text>
        <text x="20" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">y de 12 a la vez.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ mcm(8, 12) = 24</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcm(4, 5, 6)</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="85" fill="#94a3b8" font-family="monospace" font-size="10">M(4): ... 52, 56, 60, 64</text>
        <text x="25" y="105" fill="#94a3b8" font-family="monospace" font-size="10">M(5): ... 50, 55, 60, 65</text>
        <text x="25" y="130" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">M(6): ... 48, 54, 60 ➔ 60</text>

        <text x="20" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Tres números a la vez:</text>
        <text x="20" y="200" fill="#fbbf24" font-family="monospace" font-size="12">mcm(4, 5, 6) = 60</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Intersección triple</text>
      </g>
    </g>

</svg>
