<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #1e293b; }
      .title-text { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
      .subtitle-text { fill: #93c5fd; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .card-title { fill: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .card-desc { fill: #475569; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; line-height: 1.4; }
      .card-math { fill: #1e293b; font-family: 'Cambria Math', 'KaTeX_Main', serif; font-size: 15px; font-style: italic; font-weight: 600; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .step-num { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="340" rx="20" class="bg" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Dark Header Banner (High Contrast) -->
  <path d="M 0 20 Q 0 0 20 0 L 780 0 Q 800 0 800 20 L 800 72 L 0 72 Z" class="header-bg"/>
  <circle cx="36" cy="36" r="18" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="36" y="42" font-size="18" text-anchor="middle" fill="#60a5fa">📐</text>

  <text x="66" y="33" class="title-text">Checklist de Detección Rápida</text>
  <text x="66" y="53" class="subtitle-text">Reglas inmediatas para descartar expresiones no proposicionales</text>

  <!-- Body Content -->

    <g transform="translate(30, 92)">
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="355" height="100" rx="12" class="card-bg"/>
        <circle cx="36" cy="50" r="18" fill="#fee2e2"/>
        <text x="36" y="56" font-size="16" text-anchor="middle" fill="#ef4444">❓</text>
        <text x="68" y="40" class="card-title">¿Tiene signos ? o ¡ ! ?</text>
        <text x="68" y="64" class="card-desc">Si pregunta o exclama, NO es proposición.</text>
      </g>

      <g transform="translate(385, 0)" filter="url(#shadow)">
        <rect width="355" height="100" rx="12" class="card-bg"/>
        <circle cx="36" cy="50" r="18" fill="#fef3c7"/>
        <text x="36" y="56" font-size="16" text-anchor="middle" fill="#f59e0b">👉</text>
        <text x="68" y="40" class="card-title">¿Es una orden o verbo activo?</text>
        <text x="68" y="64" class="card-desc">"Calcula", "Dibuja", "Encuentra" no son V/F.</text>
      </g>

      <g transform="translate(0, 115)" filter="url(#shadow)">
        <rect width="355" height="100" rx="12" class="card-bg"/>
        <circle cx="36" cy="50" r="18" fill="#e0e7ff"/>
        <text x="36" y="56" font-size="16" text-anchor="middle" fill="#6366f1">𝓍</text>
        <text x="68" y="40" class="card-title">¿Contiene letras libres (x, y)?</text>
        <text x="68" y="64" class="card-desc">Ecuaciones sin cuantificar son abiertas.</text>
      </g>

      <g transform="translate(385, 115)" filter="url(#shadow)">
        <rect width="355" height="100" rx="12" class="card-bg"/>
        <circle cx="36" cy="50" r="18" fill="#f3e8ff"/>
        <text x="36" y="56" font-size="16" text-anchor="middle" fill="#a855f7">⭐</text>
        <text x="68" y="40" class="card-title">¿Es una opinión personal?</text>
        <text x="68" y="64" class="card-desc">Juicios subjetivos no admiten lógica formal.</text>
      </g>
    </g>

</svg>
