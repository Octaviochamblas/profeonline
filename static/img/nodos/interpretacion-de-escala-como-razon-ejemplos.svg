<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Interpretar 1 : 250.000</text>
  <text x="35" y="85" class="text-step">En un mapa con escala 1 : 250.000:</text>
  <text x="35" y="115" class="text-step">Paso 1: 1 cm en el mapa = 250.000 cm en la realidad</text>
  <text x="35" y="140" class="math">250.000 cm = 2.500 m = 2,5 km</text>
  <text x="35" y="170" class="text-step">Paso 2: Significado práctico</text>
  <text x="35" y="195" class="math">Cada centímetro representa 2,5 kilómetros</text>
  <text x="35" y="235" class="res">1 cm plano = 2,5 km reales</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Escala de Ampliación 10 : 1</text>
  <text x="365" y="85" class="text-step">En el plano de un microchip a escala 10 : 1:</text>
  <text x="365" y="115" class="text-step">Paso 1: El numerador es mayor que el denominador</text>
  <text x="365" y="140" class="math">10 cm en el dibujo = 1 cm real</text>
  <text x="365" y="170" class="text-step">Paso 2: Interpretación geométrica</text>
  <text x="365" y="195" class="math">El dibujo es 10 veces más grande que el objeto</text>
  <text x="365" y="235" class="res">Escala de Ampliación</text>
</svg>
