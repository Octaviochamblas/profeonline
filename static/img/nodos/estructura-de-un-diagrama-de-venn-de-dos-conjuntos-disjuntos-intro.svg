<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Venn de 2 Conjuntos Disjuntos</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">DIAGRAMAS VENN</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-rose)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Estructura de 3 Regiones</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Al no haber solape (A ∩ B = ∅), el espacio se divide en 3 zonas.</text>

    <!-- Visual Box -->
    <rect x="44" y="165" width="320" height="65" rx="10" fill="#fef2f2" stroke="#ef4444"/>
    <text x="204" y="208" fill="#dc2626" font-size="20" font-weight="900" text-anchor="middle">A ∩ B = ∅  (Círculos Separados)</text>

    <rect x="44" y="245" width="320" height="125" rx="10" fill="#f1f5f9"/>
    <text x="56" y="272" fill="#334155" font-size="12.5" font-weight="700">Las 3 Regiones Disjuntas:</text>
    <text x="56" y="295" fill="#475569" font-size="12">1. Solo A: Elementos exclusivos de A.</text>
    <text x="56" y="317" fill="#475569" font-size="12">2. Solo B: Elementos exclusivos de B.</text>
    <text x="56" y="342" fill="#dc2626" font-size="12" font-weight="700">3. Exterior: Ni A ni B, es decir (A ∪ B)ᶜ.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Diagrama Visual Canónico</text>

    <!-- Venn box -->
    <rect x="446" y="140" width="300" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="460" y="162" fill="#64748b" font-size="12" font-weight="900">U</text>

    <circle cx="520" cy="200" r="38" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="520" y="205" fill="#1e40af" font-size="14" font-weight="900" text-anchor="middle">A</text>

    <circle cx="640" cy="200" r="38" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="640" y="205" fill="#065f46" font-size="14" font-weight="900" text-anchor="middle">B</text>

    <text x="696" y="245" fill="#64748b" font-size="11" font-weight="700">(A∪B)ᶜ</text>

    <rect x="436" y="275" width="320" height="95" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="596" y="305" fill="#0f766e" font-size="12" font-weight="800" text-anchor="middle">Principio Aditivo Directo</text>
    <text x="596" y="330" fill="#042f2e" font-size="14" font-weight="900" text-anchor="middle">|U| = |A| + |B| + |(A ∪ B)ᶜ|</text>
    <text x="596" y="352" fill="#475569" font-size="11" text-anchor="middle">La unión es la suma exacta: |A ∪ B| = |A| + |B|</text>
  </g>

</svg>
