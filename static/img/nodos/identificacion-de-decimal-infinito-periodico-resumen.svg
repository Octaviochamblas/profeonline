<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="82" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: Decimal Infinito Periódico</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Fórmula de conversión a fracción generatriz con denominador de nueves</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">FÓRMULA GENERAL DE LA FRACCIÓN GENERATRIZ</text>
        <text x="325" y="48" fill="#34d399" font-family="monospace" font-size="13" text-anchor="middle">E.<tspan style="text-decoration: overline">p</tspan> = [ (Número completo) - (Parte Entera) ] / [ 99...9 ]</text>
        <text x="325" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Se colocan exactamente tantos nueves en el denominador como cifras tenga el período.</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Denominador Primitivo</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Fracción irreducible a/b es periódica pura</text>
        <text x="20" y="74" fill="#38bdf8" font-family="monospace" font-size="11">si MCD(b, 10) = 1 (sin 2 ni 5).</text>
        <text x="20" y="96" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Siempre resulta divisible por 9, 99, etc.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">El Caso Especial 0.<tspan style="text-decoration: overline">9</tspan></text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Por definición formal en ℝ:</text>
        <text x="20" y="74" fill="#fbbf24" font-family="monospace" font-size="11">0.<tspan style="text-decoration: overline">9</tspan> = 9/9 = 1.0  (¡Son idénticos!)</text>
        <text x="20" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Demostrado rigurosamente en límites.</text>
      </g>
    </g>

</svg>
