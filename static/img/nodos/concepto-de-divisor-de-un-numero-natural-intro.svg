<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">DIVISORES</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Concepto de Divisor de un Número Natural</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Un natural 'd' es divisor de 'a' si divide a 'a' exactamente sin dejar resto: a = d · c</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="26" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DEFINICIÓN FORMAL DE DIVISOR (FACTOR)</text>
        <text x="325" y="50" fill="#059669" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">d | a  ⟺  ∃ c ∈ ℕ : a = d · c  (a mod d = 0)</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Propiedades de los Divisores</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• El conjunto D(n) es FINITO.</text>
        <text x="20" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• El 1 es divisor universal: 1 | n para todo n.</text>
        <text x="20" y="100" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Todo número n es divisor de sí mismo (n | n).</text>
        <text x="20" y="122" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Cotas: 1 ≤ d ≤ n</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#d97706" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dualidad Múltiplo - Divisor</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Son conceptos estrictamente recíprocos:</text>
        <text x="20" y="78" fill="#d97706" font-family="monospace" font-size="13">"a es múltiplo de b" ⟺ "b es divisor de a"</text>
        <text x="20" y="105" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Ejemplo: 20 es múltiplo de 4 ⟺ 4 es divisor de 20.</text>
      </g>
    </g>

</svg>
