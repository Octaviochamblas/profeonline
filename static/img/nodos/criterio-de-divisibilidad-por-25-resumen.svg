<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Síntesis: Criterio de Divisibilidad por 25</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Cuadro comparativo de criterios de divisibilidad usuales en aritmética</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">TABLA MAESTRA DE CRITERIOS DE DIVISIBILIDAD</text>
        <text x="325" y="52" fill="#0f172a" font-family="monospace" font-size="11" text-anchor="middle">2: u par | 3: ∑∈M(3) | 4: du∈M(4) | 5: u∈{0,5} | 6: 2y3 | 8: cdu∈M(8) | 9: ∑∈M(9)</text>
        <text x="325" y="74" fill="#059669" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">10: u=0  |  11: (+ - + -)∈M(11)  |  25: du ∈ {00, 25, 50, 75}</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Clasificación por Tipo de Criterio</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Por terminación: 2, 4, 8, 5, 10, 25.</text>
        <text x="20" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Por suma digital: 3 y 9.</text>
        <text x="20" y="96" fill="#059669" font-family="system-ui, sans-serif" font-size="11">• Por suma alternada: 11.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#d97706" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Utilidad en Descomposición Prima</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Los criterios permiten factorizar números</text>
        <text x="20" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="11">rápidamente, calcular MCD / MCM y</text>
        <text x="20" y="96" fill="#0284c7" font-family="system-ui, sans-serif" font-size="11">simplificar fracciones algebraicas.</text>
      </g>
    </g>

</svg>
