<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">CRITERIO POR 11</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Criterio de Divisibilidad por 11</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Un número es divisible por 11 si la diferencia alternada de sus cifras es 0 o múltiplo de 11</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="26" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ENUNCIADO DE LA SUMA ALTERNADA</text>
        <text x="325" y="50" fill="#059669" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">11 | n  ⟺  (∑ Cifras Pos. Impar - ∑ Cifras Pos. Par) ∈ M(11)</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Fundamento: 10 ≡ -1 (mod 11)</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Las potencias de 10 alternan de signo:</text>
        <text x="20" y="78" fill="#475569" font-family="monospace" font-size="11">10¹ ≡ -1, 10² ≡ +1, 10³ ≡ -1, 10⁴ ≡ +1</text>
        <text x="20" y="100" fill="#1d4ed8" font-family="monospace" font-size="12">n ≡ d_0 - d_1 + d_2 - d_3 + ... (mod 11)</text>
        <text x="20" y="125" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Suma con signos alternados (+ - + -)</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#059669" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Ejemplo: 91.839</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Cifras impares (desde der.): 9 + 8 + 9 = 26</text>
        <text x="20" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Cifras pares (desde der.): 3 + 1 = 4</text>
        <text x="20" y="100" fill="#059669" font-family="monospace" font-size="12">Diferencia: 26 - 4 = 22  (22 = 11 · 2)</text>
        <text x="20" y="125" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 11 | 91.839 (91839 ÷ 11 = 8349)</text>
      </g>
    </g>

</svg>
