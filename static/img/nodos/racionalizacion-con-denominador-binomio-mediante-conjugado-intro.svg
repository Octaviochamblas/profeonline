<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">RACIONALIZACIÓN BINOMIAL</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Racionalización: Denominador Binomio y Conjugado</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Suma por su diferencia con fracciones verticales: (√a + √b)(√a - √b) = a - b</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Top Formula Box -->
      <g transform="translate(25, 18)">
        <rect width="650" height="75" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">LEI DEL CONJUGADO Y SUMA POR SU DIFERENCIA</text>

        <!-- Formula: k / (√a + √b) · (√a - √b) / (√a - √b) = k(√a - √b) / (a - b) -->
        <g transform="translate(130, 48)">
          <!-- k / (√a + √b) -->
          <text x="26" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">k</text>
          <line x1="0" y1="0" x2="52" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="26" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√a + √b</text>

          <text x="66" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">·</text>

          <!-- (√a - √b) / (√a - √b) -->
          <text x="106" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√a - √b</text>
          <line x1="80" y1="0" x2="132" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="106" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√a - √b</text>

          <text x="146" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">=</text>

          <!-- k(√a - √b) / (a - b) -->
          <text x="200" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">k(√a - √b)</text>
          <line x1="162" y1="0" x2="238" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="200" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">a - b</text>

          <text x="275" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">(a ≠ b)</text>
        </g>
      </g>

      <!-- Left Box: Conjugado -->
      <g transform="translate(25, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">El Binomio Conjugado</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cambiar el signo central de la suma o resta:</text>
        <text x="20" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• Conjugado de (√5 + √2) ➔ (√5 - √2)</text>
        <text x="20" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• Conjugado de (3 - √7) ➔ (3 + √7)</text>
        <text x="20" y="125" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Multiplicar arriba y abajo por él</text>
      </g>

      <!-- Right Box: Vertical Fraction Demo -->
      <g transform="translate(365, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Ejemplo: 1 / (√3 - 1)</text>

        <!-- Vertical math display -->
        <g transform="translate(30, 68)">
          <!-- 1 / (√3 - 1) -->
          <text x="24" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text>
          <line x1="0" y1="0" x2="48" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="24" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√3 - 1</text>

          <text x="60" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">·</text>

          <!-- (√3 + 1) / (√3 + 1) -->
          <text x="92" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√3 + 1</text>
          <line x1="72" y1="0" x2="112" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="92" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√3 + 1</text>

          <text x="124" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <!-- (√3 + 1) / (3 - 1) -->
          <text x="156" y="-6" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√3 + 1</text>
          <line x1="136" y1="0" x2="176" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="156" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3 - 1</text>

          <text x="188" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <!-- (√3 + 1) / 2 -->
          <text x="220" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√3 + 1</text>
          <line x1="200" y1="0" x2="240" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="220" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text>
        </g>

        <text x="20" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">En el denominador: (√3)² - 1² = 3 - 1 = 2.</text>
        <text x="20" y="134" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Denominador entero sin radicales</text>
      </g>
    </g>

</svg>
