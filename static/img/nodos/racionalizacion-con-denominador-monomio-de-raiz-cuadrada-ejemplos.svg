<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Ejemplos: Racionalización Cuadrática</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Fracciones matemáticas con numerador superior y denominador inferior</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>

        <!-- Header Fraction 6 / √<tspan style="text-decoration: overline">3</tspan> -->
        <g transform="translate(65, 30)">
          <text x="12" y="-5" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">6</text>
          <line x1="0" y1="0" x2="24" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="12" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">3</tspan></text>
        </g>

        <!-- Calculation Box -->
        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#34d399"/>
        <g transform="translate(25, 92)">
          <!-- (6·√<tspan style="text-decoration: overline">3</tspan>) / (√<tspan style="text-decoration: overline">3</tspan>·√<tspan style="text-decoration: overline">3</tspan>) -->
          <text x="25" y="-5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">6 · √<tspan style="text-decoration: overline">3</tspan></text>
          <line x1="0" y1="0" x2="50" y2="0" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="25" y="13" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">3</tspan> · √<tspan style="text-decoration: overline">3</tspan></text>

          <text x="62" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>

          <!-- 6√<tspan style="text-decoration: overline">3</tspan> / 3 -->
          <text x="85" y="-5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">6√<tspan style="text-decoration: overline">3</tspan></text>
          <line x1="72" y1="0" x2="98" y2="0" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="85" y="13" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>

          <text x="110" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>

          <text x="140" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2√<tspan style="text-decoration: overline">3</tspan> ✓</text>
        </g>

        <text x="20" y="175" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Simplificación 6/3</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">6 : 3 = 2 entero.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Resultado = 2√<tspan style="text-decoration: overline">3</tspan></text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>

        <!-- Header Fraction 10 / (3√<tspan style="text-decoration: overline">5</tspan>) -->
        <g transform="translate(65, 30)">
          <text x="18" y="-5" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">10</text>
          <line x1="0" y1="0" x2="36" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="18" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3√<tspan style="text-decoration: overline">5</tspan></text>
        </g>

        <!-- Calculation Box -->
        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <g transform="translate(25, 92)">
          <!-- 10√<tspan style="text-decoration: overline">5</tspan> / 15 -->
          <text x="20" y="-5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">10√<tspan style="text-decoration: overline">5</tspan></text>
          <line x1="0" y1="0" x2="40" y2="0" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="20" y="13" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3 · 5</text>

          <text x="52" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>

          <!-- 10√<tspan style="text-decoration: overline">5</tspan> / 15 -->
          <text x="75" y="-5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">10√<tspan style="text-decoration: overline">5</tspan></text>
          <line x1="60" y1="0" x2="90" y2="0" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="75" y="13" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">15</text>

          <text x="102" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>

          <!-- 2√<tspan style="text-decoration: overline">5</tspan> / 3 -->
          <text x="135" y="-5" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2√<tspan style="text-decoration: overline">5</tspan></text>
          <line x1="120" y1="0" x2="150" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="135" y="13" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        </g>

        <text x="20" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Simplificar por 5</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">10/15 reduce a 2/3.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ = 2√<tspan style="text-decoration: overline">5</tspan> / 3</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>

        <!-- Header Fraction √<tspan style="text-decoration: overline">2</tspan> / √<tspan style="text-decoration: overline">7</tspan> -->
        <g transform="translate(65, 30)">
          <text x="12" y="-5" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">2</tspan></text>
          <line x1="0" y1="0" x2="24" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="12" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">7</tspan></text>
        </g>

        <!-- Calculation Box -->
        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <g transform="translate(25, 92)">
          <!-- (√<tspan style="text-decoration: overline">2</tspan>·√<tspan style="text-decoration: overline">7</tspan>) / 7 -->
          <text x="28" y="-5" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">2</tspan> · √<tspan style="text-decoration: overline">7</tspan></text>
          <line x1="5" y1="0" x2="52" y2="0" stroke="#fbbf24" stroke-width="1.2"/>
          <text x="28" y="13" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">7</tspan> · √<tspan style="text-decoration: overline">7</tspan></text>

          <text x="68" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>

          <!-- √<tspan style="text-decoration: overline">14</tspan> / 7 -->
          <text x="110" y="-5" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">14</tspan></text>
          <line x1="95" y1="0" x2="125" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="110" y="13" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">7</text>
        </g>

        <text x="20" y="175" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Producto en Numerador</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">√<tspan style="text-decoration: overline">2 · 7</tspan> = √<tspan style="text-decoration: overline">14</tspan>.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ = √<tspan style="text-decoration: overline">14</tspan> / 7</text>
      </g>
    </g>

</svg>
