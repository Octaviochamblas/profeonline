<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #1e293b; }
      .title-text { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
      .subtitle-text { fill: #93c5fd; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .card-title { fill: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .card-desc { fill: #475569; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; line-height: 1.4; }
      .card-math { fill: #1e293b; font-family: 'Cambria Math', 'KaTeX_Main', serif; font-size: 15px; font-style: italic; font-weight: 600; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .step-num { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="360" rx="20" class="bg" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Dark Header Banner (High Contrast) -->
  <path d="M 0 20 Q 0 0 20 0 L 780 0 Q 800 0 800 20 L 800 72 L 0 72 Z" class="header-bg"/>
  <circle cx="36" cy="36" r="18" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="36" y="42" font-size="18" text-anchor="middle" fill="#60a5fa">📐</text>

  <text x="66" y="33" class="title-text">La Proposición Compuesta (Molecular)</text>
  <text x="66" y="53" class="subtitle-text">Construcción de enunciados complejos mediante operadores y conectivos lógicos</text>

  <!-- Body Content -->

    <g transform="translate(30, 92)">
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="740" height="85" rx="12" class="card-bg"/>
        <text x="24" y="34" class="card-title">¿Qué es una Proposición Compuesta?</text>
        <text x="24" y="58" class="card-desc">Es la unión de dos o más proposiciones simples mediante conectivos lógicos (y, o, si... entonces) o la negación de una proposición simple.</text>
      </g>

      <g transform="translate(0, 100)" filter="url(#shadow)">
        <!-- Box Conectivos -->
        <rect width="740" height="135" rx="12" class="card-bg"/>
        <text x="24" y="30" class="card-title" fill="#1e40af">Los 5 Conectivos Lógicos Fundamentales</text>

        <g transform="translate(24, 45)">
          <rect width="125" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="62" y="30" font-family="sans-serif" font-size="18" font-weight="800" fill="#1d4ed8" text-anchor="middle">¬ (NO)</text>
          <text x="62" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Negación</text>
        </g>

        <g transform="translate(165, 45)">
          <rect width="125" height="70" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
          <text x="62" y="30" font-family="sans-serif" font-size="18" font-weight="800" fill="#15803d" text-anchor="middle">∧ (Y)</text>
          <text x="62" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Conjunción</text>
        </g>

        <g transform="translate(306, 45)">
          <rect width="125" height="70" rx="8" fill="#fefce8" stroke="#fde047"/>
          <text x="62" y="30" font-family="sans-serif" font-size="18" font-weight="800" fill="#a16207" text-anchor="middle">∨ (O)</text>
          <text x="62" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Disyunción</text>
        </g>

        <g transform="translate(447, 45)">
          <rect width="125" height="70" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
          <text x="62" y="30" font-family="sans-serif" font-size="18" font-weight="800" fill="#7e22ce" text-anchor="middle">→ (SI...)</text>
          <text x="62" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Condicional</text>
        </g>

        <g transform="translate(588, 45)">
          <rect width="128" height="70" rx="8" fill="#fff1f2" stroke="#fecdd3"/>
          <text x="64" y="30" font-family="sans-serif" font-size="18" font-weight="800" fill="#be123c" text-anchor="middle">↔ (SI Y SOLO SI)</text>
          <text x="64" y="52" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Bicondicional</text>
        </g>
      </g>
    </g>

</svg>
