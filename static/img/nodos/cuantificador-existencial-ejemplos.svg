<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Ejemplos Guiados — Cuantificador Existencial</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Verificación por Testigo</text>

    <rect x="44" y="135" width="320" height="45" rx="8" fill="#f1f5f9"/>
    <text x="56" y="163" fill="#0f172a" font-size="13" font-weight="800">Dominio: U = ℕ | P(x): "x es primo y par"</text>

    <rect x="44" y="190" width="70" height="50" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="79" y="210" fill="#991b1b" font-size="11" text-anchor="middle">x = 1</text>
    <text x="79" y="230" fill="#dc2626" font-size="13" font-weight="800" text-anchor="middle">F</text>

    <rect x="124" y="190" width="70" height="50" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="159" y="210" fill="#065f46" font-size="11" text-anchor="middle">x = 2</text>
    <text x="159" y="230" fill="#059669" font-size="13" font-weight="900" text-anchor="middle">V ✓</text>

    <rect x="204" y="190" width="70" height="50" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="239" y="210" fill="#991b1b" font-size="11" text-anchor="middle">x = 3</text>
    <text x="239" y="230" fill="#dc2626" font-size="13" font-weight="800" text-anchor="middle">F</text>

    <rect x="284" y="190" width="80" height="50" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="324" y="210" fill="#991b1b" font-size="11" text-anchor="middle">x = 4</text>
    <text x="324" y="230" fill="#dc2626" font-size="13" font-weight="800" text-anchor="middle">F</text>

    <rect x="44" y="255" width="320" height="65" rx="10" fill="#0d9488"/>
    <text x="204" y="280" fill="#ccfbf1" font-size="12.5" text-anchor="middle">Disyunción: F ∨ V ∨ F ∨ F</text>
    <text x="204" y="306" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle">∃x ∈ ℕ, P(x) es VERDADERO</text>
    <text x="204" y="350" fill="#475569" font-size="11.5" text-anchor="middle">El elemento 2 es el testigo que valida la proposición.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-rose)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">Falsedad por Inexistencia</text>

    <rect x="436" y="135" width="320" height="45" rx="8" fill="#f1f5f9"/>
    <text x="448" y="163" fill="#0f172a" font-size="13" font-weight="800">Dominio: U = ℕ | P(x): "x + 5 = 2"</text>

    <rect x="436" y="190" width="320" height="55" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="448" y="212" fill="#991b1b" font-size="11.5" font-weight="700">Resolución de la ecuación:</text>
    <text x="448" y="233" fill="#dc2626" font-size="12.5" font-weight="800">x = 2 - 5 = -3  (No pertenece a ℕ)</text>

    <rect x="436" y="255" width="320" height="65" rx="10" fill="#ef4444"/>
    <text x="596" y="280" fill="#fee2e2" font-size="12" text-anchor="middle">Resultado en los Naturales:</text>
    <text x="596" y="306" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle">∃x ∈ ℕ, P(x) es FALSO</text>
    <text x="596" y="350" fill="#475569" font-size="11" text-anchor="middle">Ningún testigo en ℕ satisface la ecuación.</text>
  </g>

</svg>
