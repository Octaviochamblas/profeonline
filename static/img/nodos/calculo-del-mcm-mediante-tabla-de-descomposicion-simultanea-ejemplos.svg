<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Tablas Simultáneas Resueltas</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Ejecución paso a paso del algoritmo simultáneo para 2 y 3 números</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcm(12, 18)</text>

        <rect x="15" y="65" width="190" height="110" rx="6" fill="#0f172a" stroke="#3b82f6"/>
        <text x="45" y="85" fill="#f8fafc" font-family="monospace" font-size="12">12  18 | 2</text>
        <text x="45" y="105" fill="#f8fafc" font-family="monospace" font-size="12"> 6   9 | 2</text>
        <text x="45" y="125" fill="#f8fafc" font-family="monospace" font-size="12"> 3   9 | 3</text>
        <text x="45" y="145" fill="#f8fafc" font-family="monospace" font-size="12"> 1   3 | 3</text>
        <text x="45" y="165" fill="#f8fafc" font-family="monospace" font-size="12"> 1   1 | --</text>

        <text x="20" y="200" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">mcm = 2² · 3² = 36</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Multiplica columna derecha</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcm(15, 20)</text>

        <rect x="15" y="65" width="190" height="110" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="45" y="85" fill="#f8fafc" font-family="monospace" font-size="12">15  20 | 2</text>
        <text x="45" y="105" fill="#f8fafc" font-family="monospace" font-size="12">15  10 | 2</text>
        <text x="45" y="125" fill="#f8fafc" font-family="monospace" font-size="12">15   5 | 3</text>
        <text x="45" y="145" fill="#f8fafc" font-family="monospace" font-size="12"> 5   5 | 5</text>
        <text x="45" y="165" fill="#f8fafc" font-family="monospace" font-size="12"> 1   1 | --</text>

        <text x="20" y="200" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">mcm = 2² · 3 · 5 = 60</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 15 se baja en pasos 1 y 2</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcm(6, 8, 10)</text>

        <rect x="15" y="65" width="190" height="110" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="35" y="85" fill="#f8fafc" font-family="monospace" font-size="11">6  8 10 | 2</text>
        <text x="35" y="105" fill="#f8fafc" font-family="monospace" font-size="11">3  4  5 | 2</text>
        <text x="35" y="125" fill="#f8fafc" font-family="monospace" font-size="11">3  2  5 | 2 ➔ 3 1 5|3</text>
        <text x="35" y="145" fill="#f8fafc" font-family="monospace" font-size="11">1  1  5 | 5</text>
        <text x="35" y="165" fill="#f8fafc" font-family="monospace" font-size="11">1  1  1 | --</text>

        <text x="20" y="200" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">mcm = 2³ · 3 · 5 = 120</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 3 números simultáneos</text>
      </g>
    </g>

</svg>
