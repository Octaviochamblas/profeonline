<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 305" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="305" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="59.8" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="260.5" y="14" width="119.1" height="31.8"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 85.8)">
    <rect width="640" height="68.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">El signo menos de la resta opera como un factor -1 que multiplica y</tspan>
      <tspan x="25" y="41">distribuye a todos los sumandos del numerador que le sigue.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 163.8)">
    <rect width="640" height="122.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Omitir el paréntesis y dejar inalterados los signos posteriores del</tspan>
      <tspan x="25" y="57">numerador.</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="78">Cambiar los signos del denominador al restar en vez de los del</tspan>
      <tspan x="25" y="93">numerador.</tspan>
    </text>
  </g>
</svg>
