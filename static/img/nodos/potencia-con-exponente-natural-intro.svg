<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EXPONENTE NATURAL</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Potencia con Exponente Natural</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Multiplicación iterada de factores reales para n ∈ {1, 2, 3, ...}</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">POTENCIA CON EXPONENTE EN N</text>
        <text x="325" y="50" fill="#34d399" font-family="monospace" font-size="13.5" font-weight="700" text-anchor="middle">a<tspan baseline-shift="super" font-size="70%">n</tspan> = a · a · ... · a  (exactamente n veces, con n ∈ {1, 2, 3...})</text>
      </g>
      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Crecimiento Exponencial</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">El valor crece rápidamente:</text>
        <text x="20" y="78" fill="#38bdf8" font-family="monospace" font-size="12">2<tspan baseline-shift="super" font-size="70%">1</tspan>=2, 2<tspan baseline-shift="super" font-size="70%">2</tspan>=4, 2<tspan baseline-shift="super" font-size="70%">3</tspan>=8, 2<tspan baseline-shift="super" font-size="70%">4</tspan>=16, 2<tspan baseline-shift="super" font-size="70%">5</tspan>=32</text>
        <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cada paso multiplica por la base.</text>
        <text x="20" y="125" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Multiplicación acumulada</text>
      </g>
      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bases Negativas</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Signo determinado por paridad:</text>
        <text x="20" y="78" fill="#fbbf24" font-family="monospace" font-size="12">(-2)<tspan baseline-shift="super" font-size="70%">3</tspan> = -8   |   (-2)<tspan baseline-shift="super" font-size="70%">4</tspan> = +16</text>
        <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Impar conserva -, Par resulta +.</text>
        <text x="20" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Regla de los signos</text>
      </g>
    </g>

</svg>
