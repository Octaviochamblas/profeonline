<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Raíz cúbica</text>
  <text x="35" y="85" class="text-step">Calcular: log<tspan baseline-shift="sub" font-size="70%">2</tspan>(∛64)</text>
  <text x="35" y="112" class="text-step">Paso 1: Extraer fracción vertical 1/3</text>
  <g transform="translate(35, 122)">
    <text x="0" y="16" class="math">=</text>
    <text x="18" y="6" text-anchor="middle" class="math">1</text>
    <line x1="10" y1="12" x2="26" y2="12" class="frac-line"/>
    <text x="18" y="24" text-anchor="middle" class="math">3</text>
    <text x="32" y="16" class="math">· log<tspan baseline-shift="sub" font-size="70%">2</tspan>(64)</text>
  </g>
  <text x="35" y="175" class="text-step">Paso 2: Evaluar log<tspan baseline-shift="sub" font-size="70%">2</tspan>(64) = 6</text>
  <g transform="translate(35, 185)">
    <text x="0" y="16" class="math">=</text>
    <text x="18" y="6" text-anchor="middle" class="math">1</text>
    <line x1="10" y1="12" x2="26" y2="12" class="frac-line"/>
    <text x="18" y="24" text-anchor="middle" class="math">3</text>
    <text x="32" y="16" class="math">· 6 = 2</text>
  </g>
  <text x="35" y="235" class="res">Resultado = 2</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Raíz cuadrada decimal</text>
  <text x="365" y="85" class="text-step">Calcular: log(√<tspan style="text-decoration: overline">1000</tspan>)</text>
  <text x="365" y="112" class="text-step">Paso 1: Extraer fracción vertical 1/2</text>
  <g transform="translate(365, 122)">
    <text x="0" y="16" class="math">=</text>
    <text x="18" y="6" text-anchor="middle" class="math">1</text>
    <line x1="10" y1="12" x2="26" y2="12" class="frac-line"/>
    <text x="18" y="24" text-anchor="middle" class="math">2</text>
    <text x="32" y="16" class="math">· log(1000)</text>
  </g>
  <text x="365" y="175" class="text-step">Paso 2: Evaluar log(1000) = 3</text>
  <g transform="translate(365, 185)">
    <text x="0" y="16" class="math">=</text>
    <text x="18" y="6" text-anchor="middle" class="math">3</text>
    <line x1="10" y1="12" x2="26" y2="12" class="frac-line"/>
    <text x="18" y="24" text-anchor="middle" class="math">2</text>
    <text x="36" y="16" class="math">= 1,5</text>
  </g>
  <g transform="translate(365, 222)">
    <text x="0" y="16" class="res">Resultado = </text>
    <text x="95" y="6" text-anchor="middle" class="res">3</text>
    <line x1="86" y1="12" x2="104" y2="12" stroke="#15803d" stroke-width="1.5"/>
    <text x="95" y="24" text-anchor="middle" class="res">2</text>
  </g>
</svg>
