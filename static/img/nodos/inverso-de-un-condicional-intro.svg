<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Inverso de un Condicional (¬p → ¬q)</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-rose)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Negación de Ambos Términos</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Se niegan el antecedente y el consecuente sin cambiar el orden.</text>

    <!-- Inverse visual -->
    <rect x="44" y="165" width="138" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="113" y="193" fill="#1e40af" font-size="11.5" font-weight="700" text-anchor="middle">Directo: p → q</text>
    <text x="113" y="218" fill="#1d4ed8" font-size="16" font-weight="800" text-anchor="middle">p → q</text>

    <text x="204" y="208" fill="#64748b" font-size="20" font-weight="900" text-anchor="middle">➔</text>

    <rect x="226" y="165" width="138" height="70" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="295" y="193" fill="#991b1b" font-size="11.5" font-weight="700" text-anchor="middle">Inverso: ¬p → ¬q</text>
    <text x="295" y="218" fill="#dc2626" font-size="16" font-weight="800" text-anchor="middle">¬p → ¬q</text>

    <rect x="44" y="255" width="320" height="115" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="56" y="280" fill="#991b1b" font-size="12.5" font-weight="800">¡Alerta de Falacia Lógica!</text>
    <text x="56" y="304" fill="#7f1d1d" font-size="12">• p → q y ¬p → ¬q NO son equivalentes (≢).</text>
    <text x="56" y="326" fill="#7f1d1d" font-size="12">• Negar la causa no autoriza a negar el efecto.</text>
    <text x="56" y="350" fill="#b91c1c" font-size="12" font-weight="700">Falacia de negación del antecedente.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-purple)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Equivalencia con el Recíproco</text>

    <rect x="440" y="145" width="145" height="35" fill="#1d4ed8" rx="4"/>
    <text x="512" y="168" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">Inverso: ¬p → ¬q</text>

    <rect x="610" y="145" width="145" height="35" fill="#7e22ce" rx="4"/>
    <text x="682" y="168" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">Recíproco: q → p</text>

    <rect x="440" y="190" width="315" height="32" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="512" y="211" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V (F → F = V)</text>
    <text x="682" y="211" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V (V → V = V)</text>

    <rect x="440" y="226" width="315" height="32" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="512" y="247" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V (F → V = V)</text>
    <text x="682" y="247" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V (F → V = V)</text>

    <rect x="440" y="262" width="315" height="32" fill="#fef2f2" stroke="#fecaca" rx="4"/>
    <text x="512" y="283" fill="#dc2626" font-size="14" font-weight="900" text-anchor="middle">F (V → F = F)</text>
    <text x="682" y="283" fill="#dc2626" font-size="14" font-weight="900" text-anchor="middle">F (V → F = F)</text>

    <rect x="440" y="298" width="315" height="32" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="512" y="319" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V (V → V = V)</text>
    <text x="682" y="319" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V (F → F = V)</text>

    <text x="596" y="358" fill="#7e22ce" font-size="11.5" font-weight="700" text-anchor="middle">Inverso ≡ Recíproco (Mismo vector).</text>
  </g>

</svg>
