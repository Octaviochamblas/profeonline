<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Concepto y Visualización del MCM</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Comprobación directa de múltiplos compartidos en pares de números cotidianos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcm(4, 6)</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">M(4) = {4, 8, 12, 16...}</text>
        <text x="25" y="108" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">M(6) = {6, 12, 18...}</text>

        <text x="20" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">El primer múltiplo que</text>
        <text x="20" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">comparten es el 12.</text>
        <text x="20" y="190" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">mcm(4, 6) = 12</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Menor común múltiplo</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcm(3, 5)</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <text x="25" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">M(3) = {3, 6, 9, 12, 15...}</text>
        <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">M(5) = {5, 10, 15...}</text>

        <text x="20" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Como 3 y 5 son</text>
        <text x="20" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">primos relativos (coprimos),</text>
        <text x="20" y="190" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">mcm = 3 · 5 = 15</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Caso coprimos</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcm(6, 18)</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Relación divisor:</text>
        <text x="25" y="108" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">6 | 18 (6 divide a 18)</text>

        <text x="20" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Si a divide a b,</text>
        <text x="20" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">el mcm es siempre</text>
        <text x="20" y="190" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">mcm(6, 18) = 18</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ El mayor absorbe al menor</text>
      </g>
    </g>

</svg>
