<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 19px; font-weight: bold; fill: #1d4ed8; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 8; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; }
      .math-bold { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="15" width="640" height="48" class="header-box"/>
  <text x="340" y="36" text-anchor="middle" class="title">REPRESENTACIÓN DECIMAL DE UN PORCENTAJE</text>
  <text x="340" y="52" text-anchor="middle" class="text-main">Dividir entre 100 desplazando la coma decimal dos lugares a la izquierda</text>

  <!-- Formula central -->
  <rect x="20" y="75" width="640" height="85" class="card"/>
  <rect x="35" y="85" width="610" height="65" class="badge-blue"/>

  <text x="340" y="124" text-anchor="middle" class="formula"><tspan font-style="italic">c</tspan>% = <tspan font-style="italic">c</tspan> ÷ 100   ⟹   Correr la coma 2 lugares a la izquierda (← 2)</text>

  <!-- 2 Cards explicativas -->
  <rect x="20" y="172" width="310" height="92" class="card"/>
  <rect x="35" y="182" width="140" height="24" class="badge-green"/>
  <text x="105" y="198" text-anchor="middle" class="text-green">Ejemplos Comunes</text>
  <text x="35" y="226" class="text-main">Desplazamiento directo:</text>
  <text x="35" y="248" class="math-bold">45% = 0,45   |   8% = 0,08   |   120% = 1,2</text>

  <rect x="350" y="172" width="310" height="92" class="card"/>
  <rect x="365" y="182" width="140" height="24" class="badge-amber"/>
  <text x="435" y="198" text-anchor="middle" class="text-amber">Ceros a la Izquierda</text>
  <text x="365" y="226" class="text-main">Para números de 1 dígito:</text>
  <text x="365" y="248" class="math-bold">5% = 0,05 (¡No confundir con 0,5 que es 50%!)</text>
</svg>
