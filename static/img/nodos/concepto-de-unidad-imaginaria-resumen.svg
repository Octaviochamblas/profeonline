<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .rule-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .err-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #1d4ed8; }
      .err-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #991b1b; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="110" class="rule-box"/>
  <text x="40" y="48" class="title">SÍNTESIS: LA UNIDAD IMAGINARIA 'i'</text>
  <g class="formula">
    <text x="40" y="80" class="formula">i =</text>
    <path d="M 68,75 L 72,75 L 77,84 L 85,61 L 115,61" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="80" class="formula">−1</text>
    <text x="128" y="80" class="formula">⟺   i<tspan baseline-shift="super" font-size="70%">2</tspan> = −1</text>
  </g>
  <text x="40" y="110" class="desc">Permite construir el conjunto de los números complejos ℂ y resolver toda raíz de índice par negativa.</text>

  <rect x="20" y="145" width="640" height="115" class="err-box"/>
  <text x="40" y="172" class="err-text">¡ERROR FRECUENTE A EVITAR!</text>
  <text x="40" y="200" class="desc">❌ No tratar a 'i' como una variable algebraica ordinaria desconocida (ej: x); 'i' es una constante fija con i<tspan baseline-shift="super" font-size="70%">2</tspan> = −1.</text>
  <text x="40" y="230" class="desc">❌ No confundir: 'i' no pertenece a los números reales ℝ (i ∉ ℝ), sino al cuerpo ampliado ℂ.</text>
</svg>
