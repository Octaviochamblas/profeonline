<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 332" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="332" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="85.0" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="221.9" y="14" width="196.1" height="57.0"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 111.0)">
    <rect width="640" height="85.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">La ley de los exponentes para el producto establece que al</tspan>
      <tspan x="25" y="41">multiplicar dos o más potencias de la misma base se mantiene la base</tspan>
      <tspan x="25" y="58">y se suman todos los exponentes.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 206.0)">
    <rect width="640" height="107.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Multiplicar los exponentes (ej: x³ · x⁴ = x¹² es un error típico; lo</tspan>
      <tspan x="25" y="57">correcto es x⁷).</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="78">Olvidar que una variable sin exponente visible tiene exponente 1.</tspan>
    </text>
  </g>
</svg>
