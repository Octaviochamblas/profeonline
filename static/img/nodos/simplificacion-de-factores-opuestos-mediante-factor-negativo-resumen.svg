<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="280" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="58.0" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="242.9" y="14" width="154.2" height="20.1"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 84.0)">
    <rect width="640" height="68.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">Dos factores son opuestos si difieren exclusivamente en un cambio de</tspan>
      <tspan x="25" y="41">signo global; su cociente simplifica a la constante -1.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 162.0)">
    <rect width="640" height="92.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Cancelar (a - b) con (b - a) dejando +1 en lugar de -1.</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="63">Olvidar aplicar el signo menos resultante a todo el polinomio restante.</tspan>
    </text>
  </g>
</svg>
