<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 21px; font-weight: bold; fill: #1d4ed8; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 6; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; }
      .math-bold { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="50" class="header-box"/>
  <text x="340" y="45" text-anchor="middle" class="title">INTERPRETACIÓN DE i COMO √<tspan style="text-decoration: overline">−1</tspan></text>
  <text x="340" y="60" text-anchor="middle" class="text-main">Regla para simplificar raíces cuadradas con radicando real negativo</text>

  <!-- Formula central -->
  <rect x="20" y="85" width="640" height="75" class="card"/>
  <rect x="40" y="98" width="600" height="48" class="badge-blue"/>
  <g class="formula">
    <!-- √<tspan style="text-decoration: overline">−a</tspan> -->
    <path d="M 120,125 L 125,125 L 131,134 L 140,110 L 175,110" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="144" y="130" class="formula">−a</text>

    <text x="185" y="130" class="formula">=</text>

    <!-- √<tspan style="text-decoration: overline">a</tspan> -->
    <path d="M 205,125 L 210,125 L 216,134 L 225,110 L 250,110" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="229" y="130" class="formula">a</text>

    <text x="260" y="130" class="formula">·</text>

    <!-- √<tspan style="text-decoration: overline">−1</tspan> -->
    <path d="M 275,125 L 280,125 L 286,134 L 295,110 L 330,110" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="299" y="130" class="formula">−1</text>

    <text x="340" y="130" class="formula">=</text>

    <!-- √<tspan style="text-decoration: overline">a</tspan> · i -->
    <path d="M 360,125 L 365,125 L 371,134 L 380,110 L 405,110" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="384" y="130" class="formula">a</text>
    <text x="415" y="130" class="formula">· i    (para a &gt; 0)</text>
  </g>

  <!-- 2 Cards explicativas -->
  <rect x="20" y="175" width="310" height="85" class="card"/>
  <rect x="35" y="185" width="130" height="24" class="badge-green"/>
  <text x="100" y="201" text-anchor="middle" class="text-green">Raíces Exactas</text>
  <text x="35" y="228" class="text-main">Extrae el valor positivo e i:</text>
  <g>
    <path d="M 35,243 L 39,243 L 43,251 L 49,233 L 83,233" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="248" class="math-bold">−49</text>
    <text x="90" y="248" class="math-bold">=</text>
    <path d="M 103,243 L 107,243 L 111,251 L 117,233 L 142,233" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="248" class="math-bold">49</text>
    <text x="148" y="248" class="math-bold">· i = 7i</text>
  </g>

  <rect x="350" y="175" width="310" height="85" class="card"/>
  <rect x="365" y="185" width="130" height="24" class="badge-amber"/>
  <text x="430" y="201" text-anchor="middle" class="text-amber">Raíces Inexactas</text>
  <text x="365" y="228" class="text-main">Conserva el radical simplificado:</text>
  <g>
    <path d="M 365,243 L 369,243 L 373,251 L 379,233 L 413,233" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="382" y="248" class="math-bold">−12</text>
    <text x="420" y="248" class="math-bold">=</text>
    <path d="M 433,243 L 437,243 L 441,251 L 447,233 L 485,233" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="450" y="248" class="math-bold">4 · 3</text>
    <text x="492" y="248" class="math-bold">· i =</text>
    <text x="525" y="248" class="math-bold">2</text>
    <path d="M 536,243 L 540,243 L 544,251 L 550,233 L 565,233" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="553" y="248" class="math-bold">3</text>
    <text x="572" y="248" class="math-bold">· i</text>
  </g>
</svg>
