<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="lightShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Tablas de Factorización Resueltas</text>
    <text x="0" y="74" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Ejecución paso a paso del método de división sucesiva en números de varias cifras</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Factorizar 120</text>

        <rect x="15" y="65" width="190" height="110" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="65" y="85" fill="#0f172a" font-family="monospace" font-size="12">120 | 2</text>
        <text x="65" y="105" fill="#0f172a" font-family="monospace" font-size="12"> 60 | 2</text>
        <text x="65" y="125" fill="#0f172a" font-family="monospace" font-size="12"> 30 | 2</text>
        <text x="65" y="145" fill="#0f172a" font-family="monospace" font-size="12"> 15 | 3</text>
        <text x="65" y="165" fill="#0f172a" font-family="monospace" font-size="12">  5 | 5 ➔ 1</text>

        <text x="20" y="200" fill="#059669" font-family="monospace" font-size="13" font-weight="700">120 = 2³ · 3 · 5</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 5 divisiones exactas</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#059669"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Factorizar 315</text>

        <rect x="15" y="65" width="190" height="110" rx="6" fill="#ffffff" stroke="#059669"/>
        <text x="65" y="85" fill="#0f172a" font-family="monospace" font-size="12">315 | 3</text>
        <text x="65" y="105" fill="#0f172a" font-family="monospace" font-size="12">105 | 3</text>
        <text x="65" y="125" fill="#0f172a" font-family="monospace" font-size="12"> 35 | 5</text>
        <text x="65" y="145" fill="#0f172a" font-family="monospace" font-size="12">  7 | 7</text>
        <text x="65" y="165" fill="#0f172a" font-family="monospace" font-size="12">  1 | --</text>

        <text x="20" y="200" fill="#059669" font-family="monospace" font-size="13" font-weight="700">315 = 3² · 5 · 7</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ No tiene factor 2</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#d97706"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Factorizar 500</text>

        <rect x="15" y="65" width="190" height="110" rx="6" fill="#ffffff" stroke="#d97706"/>
        <text x="65" y="85" fill="#0f172a" font-family="monospace" font-size="12">500 | 2</text>
        <text x="65" y="105" fill="#0f172a" font-family="monospace" font-size="12">250 | 2</text>
        <text x="65" y="125" fill="#0f172a" font-family="monospace" font-size="12">125 | 5</text>
        <text x="65" y="145" fill="#0f172a" font-family="monospace" font-size="12"> 25 | 5</text>
        <text x="65" y="165" fill="#0f172a" font-family="monospace" font-size="12">  5 | 5 ➔ 1</text>

        <text x="20" y="200" fill="#059669" font-family="monospace" font-size="13" font-weight="700">500 = 2² · 5³</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Potencias de 2 y 5</text>
      </g>
    </g>

</svg>
