<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: Base Distinta de Uno</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Conjunto admisible de bases: b ∈ ℝ⁺ \ {1}</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 18)">
        <rect width="650" height="80" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">CONJUNTO DE VALIDEZ DE LA BASE</text>
        <text x="325" y="52" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">b ∈ ]0, 1[ ∪ ]1, +∞[   ⟺   b &gt; 0  y  b ≠ 1</text>
      </g>
      <g transform="translate(25, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Inyectividad de la Función</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">La condición b ≠ 1 garantiza que:</text>
        <text x="20" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">f(x) = b<tspan baseline-shift="super" font-size="70%">x</tspan> sea estrictamente monótona</text>
        <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Permitiendo la existencia de una función inversa.</text>
        <text x="20" y="122" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Biyección garantizada</text>
      </g>
      <g transform="translate(365, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Trampa Común PAES</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Al resolver log<tspan baseline-shift="sub" font-size="70%">x</tspan>(x) = 1:</text>
        <text x="20" y="74" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Se cumple para todo x &gt; 0 con x ≠ 1.</text>
        <text x="20" y="98" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700">¡x = 1 NO es solución porque log₁(1) no existe!</text>
        <text x="20" y="122" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Excluir siempre el 1 de la base</text>
      </g>
    </g>

</svg>
