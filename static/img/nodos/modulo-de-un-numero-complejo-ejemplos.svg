<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Trío pitagórico 3-4-5</text>
  <text x="35" y="85" class="text-step">Calcular |z| para: z = 3 − 4i</text>
  <text x="35" y="115" class="text-step">Paso 1: a = 3, b = −4</text>

  <g>
    <text x="35" y="142" class="math">|z| =</text>
    <path d="M 68,137 L 72,137 L 76,145 L 83,127 L 165,127" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="142" class="math">3<tspan baseline-shift="super" font-size="70%">2</tspan> + (−4)<tspan baseline-shift="super" font-size="70%">2</tspan></text>
  </g>

  <text x="35" y="170" class="text-step">Paso 2: Sumar cuadrados</text>
  <g>
    <text x="35" y="197" class="math">=</text>
    <path d="M 48,192 L 52,192 L 56,200 L 63,182 L 115,182" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="197" class="math">9 + 16</text>
    <text x="122" y="197" class="math">=</text>
    <path d="M 134,192 L 138,192 L 142,200 L 149,182 L 172,182" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="151" y="197" class="math">25</text>
    <text x="178" y="197" class="math">= 5</text>
  </g>
  <text x="35" y="235" class="res">Módulo |z| = 5</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Módulo de imaginario puro</text>
  <text x="365" y="85" class="text-step">Calcular |z| para: z = −7i</text>
  <text x="365" y="115" class="text-step">Paso 1: a = 0, b = −7</text>

  <g>
    <text x="365" y="142" class="math">|z| =</text>
    <path d="M 398,137 L 402,137 L 406,145 L 413,127 L 495,127" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="416" y="142" class="math">0<tspan baseline-shift="super" font-size="70%">2</tspan> + (−7)<tspan baseline-shift="super" font-size="70%">2</tspan></text>
  </g>

  <text x="365" y="170" class="text-step">Paso 2: Evaluar raíz</text>
  <g>
    <text x="365" y="197" class="math">=</text>
    <path d="M 378,192 L 382,192 L 386,200 L 393,182 L 445,182" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="396" y="197" class="math">0 + 49</text>
    <text x="452" y="197" class="math">=</text>
    <path d="M 464,192 L 468,192 L 472,200 L 479,182 L 502,182" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="481" y="197" class="math">49</text>
    <text x="508" y="197" class="math">= 7</text>
  </g>
  <text x="365" y="235" class="res">Módulo |z| = 7</text>
</svg>
