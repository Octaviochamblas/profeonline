<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Enunciado textual</text>
  <text x="35" y="85" class="text-step">"La razón entre autos y motos es 7 a 3"</text>
  <text x="35" y="115" class="text-step">Paso 1: Identificar primera magnitud</text>
  <text x="35" y="140" class="math">Autos = 7 (primer valor nombrado)</text>
  <text x="35" y="170" class="text-step">Paso 2: Extraer el antecedente</text>
  <g transform="translate(35, 185)">
    <text x="0" y="16" class="math">Razón =</text>
    <g transform="translate(55, 0)">
      <text x="10" y="12" class="math" fill="#dc2626" text-anchor="middle">7</text>
      <line x1="0" y1="16" x2="20" y2="16" class="frac-line"/>
      <text x="10" y="30" class="math" text-anchor="middle">3</text>
    </g>
  </g>
  <text x="35" y="235" class="res">Antecedente = 7 (Autos)</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Razón simplificada</text>
  <text x="365" y="85" class="text-step">Dada la razón 18 : 24</text>
  <text x="365" y="115" class="text-step">Paso 1: Identificar primer término</text>
  <text x="365" y="140" class="math">Antecedente original = 18</text>
  <text x="365" y="170" class="text-step">Paso 2: En forma simplificada 3 : 4</text>
  <text x="365" y="195" class="math">Antecedente simplificado = 3</text>
  <text x="365" y="235" class="res">Antecedente = 18 (o 3)</text>
</svg>
