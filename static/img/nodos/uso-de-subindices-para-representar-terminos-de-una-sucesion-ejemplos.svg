<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #334155; }
      .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #64748b; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #1d4ed8; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 8; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .badge-purple { fill: #f3e8ff; stroke: #d8b4fe; stroke-width: 1; rx: 6; }
      .badge-rose { fill: #ffe4e6; stroke: #fca5a5; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 600; fill: #92400e; }
      .text-purple { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 600; fill: #6b21a8; }
      .text-rose { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 600; fill: #9f1239; }
      .math-bold { font-family: "Cambria Math", "Times New Roman", serif; font-size: 13.5px; font-weight: bold; fill: #0f172a; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.8; }
      .frac-line-dark { stroke: #0f172a; stroke-width: 1.6; }
      .rule-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .err-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .err-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #991b1b; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 12.5px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="310" height="240" class="card"/>
  <text x="35" y="48" class="title">Ejemplo 1: Subíndices en lista</text>
  <g transform="translate(35,80)"><text x="0" y="20" class="math-bold">Sucesión: 4, 7, 10, 13, 16</text><text x="0" y="50" class="math-bold">a₁ = 4, a₂ = 7, a₃ = 10</text><text x="0" y="80" class="math-bold">a₄ = 13, a₅ = 16</text><text x="0" y="145" class="res">Subíndice = lugar en lista</text></g>
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <text x="365" y="48" class="title">Ejemplo 2: Términos adyacentes</text>
  <g transform="translate(365,80)"><text x="0" y="20" class="math-bold">Si a_k = 10 (k=3):</text><text x="0" y="50" class="math-bold">a_{k-1} = 7 (anterior)</text><text x="0" y="80" class="math-bold">a_{k+1} = 13 (posterior)</text><text x="0" y="145" class="res">k=3 ⟹ a₃ = 10</text></g>

</svg>
