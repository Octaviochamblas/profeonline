<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Síntesis: Regla de los 3 o Más Divisores</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Estrategia de demostración rápida de no-primalidad</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">TEOREMA DE IDENTIFICACIÓN DE COMPUESTOS</text>
        <text x="325" y="52" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">n es compuesto  ⟺  n &gt; 1  ∧  |D(n)| ≥ 3</text>
        <text x="325" y="74" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Exhibir un único divisor d ∈ (1, n) es suficiente para demostrar que es compuesto.</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Conteo por Exponentes</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Si n = p₁^a · p₂^b · ... ⟹</text>
        <text x="20" y="74" fill="#38bdf8" font-family="monospace" font-size="12">τ(n) = (a+1)(b+1)...</text>
        <text x="20" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Si τ(n) ≥ 3 ⟹ n es compuesto.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Filtro de Descarte Rápido</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1. Termina en par ≠ 2 ⟹ Compuesto.</text>
        <text x="20" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2. Termina en 5 (n &gt; 5) ⟹ Compuesto.</text>
        <text x="20" y="96" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">3. Suma de dígitos ∈ M(3) ⟹ Compuesto.</text>
      </g>
    </g>

</svg>
