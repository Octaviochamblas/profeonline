<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Conversión a binomial</text>
  <text x="35" y="85" class="text-step">Expresar el par ordenado (4, −5) en forma binómica</text>
  <text x="35" y="115" class="text-step">Paso 1: Primer elemento = parte real a</text>
  <text x="35" y="140" class="math">a = 4</text>
  <text x="35" y="170" class="text-step">Paso 2: Segundo elemento = parte imaginaria b</text>
  <text x="35" y="195" class="math">b = −5  ⟹  −5i</text>
  <text x="35" y="235" class="res">z = 4 − 5i</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Suma en forma binomial</text>
  <text x="365" y="85" class="text-step">Sumar z<tspan baseline-shift="sub" font-size="70%">1</tspan> = 2 + 3i  y  z<tspan baseline-shift="sub" font-size="70%">2</tspan> = 5 − 8i</text>
  <text x="365" y="115" class="text-step">Paso 1: Sumar partes reales</text>
  <text x="365" y="140" class="math">2 + 5 = 7</text>
  <text x="365" y="170" class="text-step">Paso 2: Sumar partes imaginarias</text>
  <text x="365" y="195" class="math">3i + (−8i) = −5i</text>
  <text x="365" y="235" class="res">z<tspan baseline-shift="sub" font-size="70%">1</tspan> + z<tspan baseline-shift="sub" font-size="70%">2</tspan> = 7 − 5i</text>
</svg>
