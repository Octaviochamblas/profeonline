<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Convertir 7,5% a decimal</text>
  <text x="35" y="85" class="text-step">Transformar 7,5% a número decimal:</text>
  <text x="35" y="115" class="text-step">Paso 1: Dividir entre 100</text>
  <text x="35" y="140" class="math">7,5 ÷ 100 = 0,075</text>
  <text x="35" y="170" class="text-step">Paso 2: Comprobar lugares decimales</text>
  <text x="35" y="195" class="math">La coma se movió dos posiciones a la izquierda</text>
  <text x="35" y="235" class="res">7,5% = 0,075</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Convertir 0,04 a porcentaje</text>
  <text x="365" y="85" class="text-step">Transformar el decimal 0,04 a porcentaje:</text>
  <text x="365" y="115" class="text-step">Paso 1: Multiplicar por 100% (→ 2 lugares)</text>
  <text x="365" y="140" class="math">0,04 · 100% = 4%</text>
  <text x="365" y="170" class="text-step">Paso 2: Verificación</text>
  <text x="365" y="195" class="math">4 centésimas = 4 por ciento</text>
  <text x="365" y="235" class="res">0,04 = 4%</text>
</svg>
