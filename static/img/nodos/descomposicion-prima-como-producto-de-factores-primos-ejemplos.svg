<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="lightShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Construcción de la Forma Canónica</text>
    <text x="0" y="74" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Escritura ordenada de números compuestos en producto de potencias primas</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Para n = 60</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="25" y="88" fill="#475569" font-family="system-ui, sans-serif" font-size="11">60 = 2 · 2 · 3 · 5</text>
        <text x="25" y="108" fill="#059669" font-family="monospace" font-size="13" font-weight="700">60 = 2² · 3 · 5</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Base 2 al cuadrado,</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">base 3 con exp 1,</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">base 5 con exp 1.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 3 primos distintos</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#059669"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Para n = 144</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#059669"/>
        <text x="25" y="88" fill="#475569" font-family="system-ui, sans-serif" font-size="11">144 = 16 · 9</text>
        <text x="25" y="108" fill="#059669" font-family="monospace" font-size="13" font-weight="700">144 = 2⁴ · 3²</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">144 es un cuadrado</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">perfecto (12²), todos</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">sus exp son pares.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Cuadrado perfecto</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#d97706"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Para n = 100</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#d97706"/>
        <text x="25" y="88" fill="#475569" font-family="system-ui, sans-serif" font-size="11">100 = 10² = (2·5)²</text>
        <text x="25" y="108" fill="#d97706" font-family="monospace" font-size="13" font-weight="700">100 = 2² · 5²</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Potencia de 10:</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">10^k = 2^k · 5^k.</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Mismos exponentes.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Potencia decimal</text>
      </g>
    </g>

</svg>
