<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">RECTA NUMÉRICA</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">La Recta Numérica de los Enteros</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Representación geométrica 1D con escala uniforme y origen en el cero</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Number Line Graphic -->
      <g transform="translate(30, 45)">
        <rect width="640" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>

        <!-- Axis line with arrows -->
        <line x1="40" y1="55" x2="600" y2="55" stroke="#94a3b8" stroke-width="2.5"/>
        <polygon points="605,55 595,50 595,60" fill="#94a3b8"/>
        <polygon points="35,55 45,50 45,60" fill="#94a3b8"/>

        <!-- Ticks and labels: -4, -3, -2, -1, 0, 1, 2, 3, 4 -->
        <!-- Center x=320 for 0, spacing=60px -->
        <!-- x positions: -4:80, -3:140, -2:200, -1:260, 0:320, 1:380, 2:440, 3:500, 4:560 -->

        <!-- Tick -4 -->
        <line x1="80" y1="47" x2="80" y2="63" stroke="#f87171" stroke-width="2"/>
        <text x="80" y="82" fill="#f87171" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">-4</text>

        <!-- Tick -3 -->
        <line x1="140" y1="47" x2="140" y2="63" stroke="#f87171" stroke-width="2"/>
        <text x="140" y="82" fill="#f87171" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">-3</text>

        <!-- Tick -2 -->
        <line x1="200" y1="47" x2="200" y2="63" stroke="#f87171" stroke-width="2"/>
        <text x="200" y="82" fill="#f87171" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">-2</text>

        <!-- Tick -1 -->
        <line x1="260" y1="47" x2="260" y2="63" stroke="#f87171" stroke-width="2"/>
        <text x="260" y="82" fill="#f87171" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">-1</text>

        <!-- Tick 0 -->
        <circle cx="320" cy="55" r="5" fill="#fbbf24"/>
        <line x1="320" y1="45" x2="320" y2="65" stroke="#fbbf24" stroke-width="3"/>
        <text x="320" y="84" fill="#fbbf24" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">0</text>
        <text x="320" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Origen</text>

        <!-- Tick 1 -->
        <line x1="380" y1="47" x2="380" y2="63" stroke="#34d399" stroke-width="2"/>
        <text x="380" y="82" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">1</text>

        <!-- Tick 2 -->
        <line x1="440" y1="47" x2="440" y2="63" stroke="#34d399" stroke-width="2"/>
        <text x="440" y="82" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">2</text>

        <!-- Tick 3 -->
        <line x1="500" y1="47" x2="500" y2="63" stroke="#34d399" stroke-width="2"/>
        <text x="500" y="82" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">3</text>

        <!-- Tick 4 -->
        <line x1="560" y1="47" x2="560" y2="63" stroke="#34d399" stroke-width="2"/>
        <text x="560" y="82" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">4</text>
      </g>

      <!-- Explanatory cards -->
      <g transform="translate(30, 175)">
        <rect width="310" height="75" rx="8" fill="#0f172a" stroke="#f87171"/>
        <text x="20" y="28" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">← Hacia la izquierda de 0</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Enteros negativos (ℤ⁻). Valores decrecientes.</text>
      </g>

      <g transform="translate(360, 175)">
        <rect width="310" height="75" rx="8" fill="#0f172a" stroke="#34d399"/>
        <text x="20" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Hacia la derecha de 0 →</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Enteros positivos (ℤ⁺). Valores crecientes.</text>
      </g>
    </g>

</svg>
