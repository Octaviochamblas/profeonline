<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Verificación y Búsqueda de Divisores</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Comprobación de divisores mediante división exacta y emparejamiento</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Divisores de 12</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Conjunto D(12):</text>
        <text x="25" y="108" fill="#1d4ed8" font-family="monospace" font-size="13" font-weight="700">{1, 2, 3, 4, 6, 12}</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Pares multiplicativos:</text>
        <text x="20" y="170" fill="#0f172a" font-family="monospace" font-size="11">1·12 = 2·6 = 3·4 = 12</text>
        <text x="20" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Total: 6 divisores.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Conjunto acotado</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#ef4444"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">¿Es 9 divisor de 40?</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#ef4444"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">División:</text>
        <text x="25" y="108" fill="#dc2626" font-family="monospace" font-size="13" font-weight="700">40 ÷ 9 = 4 (resto 4)</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">40 = 9 · 4 + 4</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">El resto no es cero.</text>
        <text x="20" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="11">No divide exactamente.</text>
        <text x="20" y="230" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="600">❌ 9 ∤ 40 (No es divisor)</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Número Primo</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#10b981"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Divisores de 13:</text>
        <text x="25" y="108" fill="#059669" font-family="monospace" font-size="13" font-weight="700">D(13) = {1, 13}</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Tiene exactamente</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">dos divisores distintos:</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">el 1 y él mismo.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Definición de primo</text>
      </g>
    </g>

</svg>
