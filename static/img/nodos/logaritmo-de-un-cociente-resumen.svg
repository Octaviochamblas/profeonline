<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .rule-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .err-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 17px; font-weight: bold; fill: #1d4ed8; }
      .err-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #991b1b; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="110" class="rule-box"/>
  <text x="40" y="48" class="title">REGLA FUNDAMENTAL DEL COCIENTE</text>
  <g transform="translate(40, 60)">
    <text x="0" y="20" class="formula">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(</text>
    <text x="46" y="8" text-anchor="middle" class="formula">x</text>
    <line x1="36" y1="14" x2="56" y2="14" class="frac-line"/>
    <text x="46" y="30" text-anchor="middle" class="formula">y</text>
    <text x="62" y="20" class="formula">) = log<tspan baseline-shift="sub" font-size="70%">b</tspan>(x) − log<tspan baseline-shift="sub" font-size="70%">b</tspan>(y)</text>
  </g>
  <text x="40" y="115" class="desc">Condiciones obligatorias: b &gt; 0, b ≠ 1 y argumentos x &gt; 0, y &gt; 0.</text>

  <rect x="20" y="145" width="640" height="115" class="err-box"/>
  <text x="40" y="172" class="err-text">¡ERROR FRECUENTE A EVITAR!</text>
  <text x="40" y="200" class="desc">❌ No dividir los operadores: log<tspan baseline-shift="sub" font-size="70%">b</tspan>(x) − log<tspan baseline-shift="sub" font-size="70%">b</tspan>(y) ≠ log<tspan baseline-shift="sub" font-size="70%">b</tspan>(x) / log<tspan baseline-shift="sub" font-size="70%">b</tspan>(y).</text>
  <text x="40" y="230" class="desc">❌ No alterar el orden: el denominador siempre es el que resta (− log<tspan baseline-shift="sub" font-size="70%">b</tspan>(y)).</text>
</svg>
