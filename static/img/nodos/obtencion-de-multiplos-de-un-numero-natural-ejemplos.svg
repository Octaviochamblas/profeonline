<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Cálculo de Múltiplos Específicos</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Determinación del k-ésimo múltiplo y búsqueda de múltiplos en rangos acotados</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">El 15° múlt. de 8</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Cálculo directo:</text>
        <text x="25" y="108" fill="#1d4ed8" font-family="monospace" font-size="13" font-weight="700">8 · 15 = 120</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Se multiplica la base (8)</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">por la posición (15).</text>
        <text x="20" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="11">No hace falta listar todos.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Resultado = 120</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Múltiplos en [30, 60]</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#10b981"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Múltiplos de 7:</text>
        <text x="25" y="108" fill="#059669" font-family="monospace" font-size="13" font-weight="700">{35, 42, 49, 56}</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">7·5 = 35  |  7·6 = 42</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">7·7 = 49  |  7·8 = 56</text>
        <text x="20" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Exactamente 4 múltiplos.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Total = 4 múltiplos</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Múltiplo de 11 &gt; 100</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#f59e0b"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">División techo:</text>
        <text x="25" y="108" fill="#d97706" font-family="monospace" font-size="13" font-weight="700">100 ÷ 11 = 9.09</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Tomar entero k = 10:</text>
        <text x="20" y="170" fill="#0f172a" font-family="monospace" font-size="12">11 · 10 = 110</text>
        <text x="20" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Primer múltiplo mayor a 100.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Resultado = 110</text>
      </g>
    </g>

</svg>
