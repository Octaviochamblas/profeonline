<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Síntesis: Conjunto de los Cardinales (ℕ₀)</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Comparación visual y propiedades fundamentales de ℕ vs ℕ₀</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Venn diagram representation inside summary -->
      <g transform="translate(25, 25)">
        <rect width="650" height="110" rx="8" fill="#0f172a" stroke="#334155"/>

        <!-- Outer rect for N0 -->
        <rect x="20" y="15" width="350" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="4"/>
        <text x="30" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ℕ₀ (Cardinales)</text>
        <text x="50" y="70" fill="#fbbf24" font-family="monospace" font-size="18" font-weight="700">0</text>

        <!-- Inner rect for N -->
        <rect x="110" y="25" width="240" height="60" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="125" y="45" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ℕ (Naturales)</text>
        <text x="135" y="70" fill="#f8fafc" font-family="monospace" font-size="14">1, 2, 3, 4, 5, ...</text>

        <!-- Right side note -->
        <text x="400" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Relación de Inclusión:</text>
        <text x="400" y="75" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="700">ℕ ⊂ ℕ₀ = ℕ ∪ {0}</text>
      </g>

      <!-- Points -->
      <g transform="translate(25, 150)">
        <rect width="650" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• Inclusión estricta:</text>
        <text x="160" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Todo natural es cardinal, pero el 0 es cardinal y no natural.</text>
        <text x="20" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• Cardinal de conjuntos:</text>
        <text x="180" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">La cardinalidad de cualquier conjunto finito es siempre un elemento de ℕ₀.</text>
        <text x="20" y="82" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• Neutro aditivo:</text>
        <text x="140" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">El cero permite resolver ecuaciones como x + 5 = 5 (x = 0 ∈ ℕ₀).</text>
      </g>
    </g>

</svg>
