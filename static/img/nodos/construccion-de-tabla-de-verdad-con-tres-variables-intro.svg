<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Construcción de Tabla con 3 Variables</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="752" height="310" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="24" y="80" width="752" height="6" fill="url(#grad-indigo)" rx="3"/>

    <text x="44" y="115" fill="#0f172a" font-size="17" font-weight="800">Flujo de Evaluación Sistemática en 8 Filas</text>

    <!-- Block 1 -->
    <rect x="44" y="135" width="220" height="145" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="154" y="162" fill="#1e40af" font-size="14" font-weight="800" text-anchor="middle">Paso 1: Entradas</text>
    <text x="60" y="190" fill="#334155" font-size="12">• p (4V, 4F)</text>
    <text x="60" y="210" fill="#334155" font-size="12">• q (2V, 2F, 2V, 2F)</text>
    <text x="60" y="230" fill="#334155" font-size="12">• r (1V, 1F alternado)</text>
    <text x="154" y="262" fill="#1d4ed8" font-size="11.5" font-weight="700" text-anchor="middle">8 combinaciones</text>

    <!-- Block 2 -->
    <rect x="284" y="135" width="220" height="145" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="394" y="162" fill="#0f766e" font-size="14" font-weight="800" text-anchor="middle">Paso 2: Paréntesis</text>
    <text x="300" y="190" fill="#334155" font-size="12">• Calcular bloques internos.</text>
    <text x="300" y="210" fill="#334155" font-size="12">• Ej: (p ∧ q), (q ∨ r).</text>
    <text x="300" y="230" fill="#334155" font-size="12">• Generar vectores intermedios.</text>
    <text x="394" y="262" fill="#0f766e" font-size="11.5" font-weight="700" text-anchor="middle">Subexpresiones</text>

    <!-- Block 3 -->
    <rect x="524" y="135" width="232" height="145" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="640" y="162" fill="#7e22ce" font-size="14" font-weight="800" text-anchor="middle">Paso 3: Operador Principal</text>
    <text x="540" y="190" fill="#334155" font-size="12">• Combinar los bloques.</text>
    <text x="540" y="210" fill="#334155" font-size="12">• Columna de respuesta final.</text>
    <text x="540" y="230" fill="#334155" font-size="12">• Vector de dimensión 8.</text>
    <text x="640" y="262" fill="#7e22ce" font-size="11.5" font-weight="700" text-anchor="middle">Clasificación Final</text>

    <text x="400" y="340" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle">El método columnar garantiza que no se omita ninguna de las 8 combinaciones posibles.</text>
  </g>

</svg>
