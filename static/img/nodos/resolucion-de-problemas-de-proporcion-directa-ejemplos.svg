<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Pintura y Superficie</text>
  <text x="35" y="85" class="text-step">5 litros cubren 40 m². ¿Cuántos para 120 m²?</text>
  <text x="35" y="115" class="text-step">Paso 1: Plantear proporción directa</text>
  <g transform="translate(35, 125)">
    <g transform="translate(0, 0)">
      <text x="10" y="12" class="math" text-anchor="middle">5</text>
      <line x1="0" y1="16" x2="20" y2="16" class="frac-line"/>
      <text x="10" y="30" class="math" text-anchor="middle">40</text>
    </g>
    <text x="28" y="18" class="math">=</text>
    <g transform="translate(45, 0)">
      <text x="10" y="12" class="math" text-anchor="middle">x</text>
      <line x1="0" y1="16" x2="20" y2="16" class="frac-line"/>
      <text x="10" y="30" class="math" text-anchor="middle">120</text>
    </g>
  </g>
  <text x="35" y="185" class="text-step">Paso 2: Despejar x en cruz</text>
  <text x="35" y="205" class="math">x = (5 · 120) / 40 = 600 / 40 = 15 L</text>
  <text x="35" y="235" class="res">Se necesitan 15 Litros</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Salario proporcional</text>
  <text x="365" y="85" class="text-step">Gana $180.000 en 6 días. ¿Cuánto en 14 días?</text>
  <text x="365" y="115" class="text-step">Paso 1: Calcular valor diario k</text>
  <text x="365" y="140" class="math">k = 180.000 / 6 = $30.000 / día</text>
  <text x="365" y="170" class="text-step">Paso 2: Multiplicar por 14 días</text>
  <text x="365" y="195" class="math">S = 30.000 · 14 = $420.000</text>
  <text x="365" y="235" class="res">Salario = $420.000</text>
</svg>
