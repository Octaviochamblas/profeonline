<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #1e293b; }
      .title-text { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
      .subtitle-text { fill: #93c5fd; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .card-title { fill: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .card-desc { fill: #475569; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; line-height: 1.4; }
      .card-math { fill: #1e293b; font-family: 'Cambria Math', 'KaTeX_Main', serif; font-size: 15px; font-style: italic; font-weight: 600; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .step-num { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="360" rx="20" class="bg" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Dark Header Banner (High Contrast) -->
  <path d="M 0 20 Q 0 0 20 0 L 780 0 Q 800 0 800 20 L 800 72 L 0 72 Z" class="header-bg"/>
  <circle cx="36" cy="36" r="18" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="36" y="42" font-size="18" text-anchor="middle" fill="#60a5fa">📐</text>

  <text x="66" y="33" class="title-text">Diccionario de Traducción Lógica</text>
  <text x="66" y="53" class="subtitle-text">Equivalencias entre expresiones del lenguaje cotidiano y operadores lógicos</text>

  <!-- Body Content -->

    <g transform="translate(30, 92)">
      <!-- Row 1: Conjunción -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="740" height="52" rx="10" class="card-bg"/>
        <rect x="0" y="0" width="6" height="52" rx="3" fill="#3b82f6"/>
        <text x="24" y="24" class="card-title">"pero", "sin embargo", "además", "aunque", "y"</text>
        <text x="24" y="42" class="card-desc">Indican que ambas afirmaciones se cumplen simultáneamente.</text>
        <rect x="620" y="11" width="100" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="670" y="30" class="badge-text" fill="#1d4ed8" text-anchor="middle">∧ (Conjunción)</text>
      </g>

      <!-- Row 2: Disyunción -->
      <g transform="translate(0, 60)" filter="url(#shadow)">
        <rect width="740" height="52" rx="10" class="card-bg"/>
        <rect x="0" y="0" width="6" height="52" rx="3" fill="#f59e0b"/>
        <text x="24" y="24" class="card-title">"o", "a menos que", "o bien"</text>
        <text x="24" y="42" class="card-desc">Indica que al menos una de las dos condiciones se cumple.</text>
        <rect x="620" y="11" width="100" height="30" rx="6" fill="#fffbeb" stroke="#fde68a"/>
        <text x="670" y="30" class="badge-text" fill="#b45309" text-anchor="middle">∨ (Disyunción)</text>
      </g>

      <!-- Row 3: Condicional -->
      <g transform="translate(0, 120)" filter="url(#shadow)">
        <rect width="740" height="52" rx="10" class="card-bg"/>
        <rect x="0" y="0" width="6" height="52" rx="3" fill="#a855f7"/>
        <text x="24" y="24" class="card-title">"si... entonces", "por lo tanto", "implica que", "es suficiente"</text>
        <text x="24" y="42" class="card-desc">El antecedente condiciona necesariamente la verdad del consecuente.</text>
        <rect x="620" y="11" width="100" height="30" rx="6" fill="#faf5ff" stroke="#e9d5ff"/>
        <text x="670" y="30" class="badge-text" fill="#7e22ce" text-anchor="middle">→ (Condicional)</text>
      </g>

      <!-- Row 4: Bicondicional -->
      <g transform="translate(0, 180)" filter="url(#shadow)">
        <rect width="740" height="52" rx="10" class="card-bg"/>
        <rect x="0" y="0" width="6" height="52" rx="3" fill="#10b981"/>
        <text x="24" y="24" class="card-title">"si y solo si", "es equivalente a", "es condición necesaria y suficiente"</text>
        <text x="24" y="42" class="card-desc">Ambas proposiciones comparten idéntico valor de verdad.</text>
        <rect x="620" y="11" width="100" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
        <text x="670" y="30" class="badge-text" fill="#15803d" text-anchor="middle">↔ (Bicondicional)</text>
      </g>
    </g>

</svg>
