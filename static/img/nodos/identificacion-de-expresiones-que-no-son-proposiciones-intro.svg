<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #1e293b; }
      .title-text { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
      .subtitle-text { fill: #93c5fd; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .card-title { fill: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .card-desc { fill: #475569; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; line-height: 1.4; }
      .card-math { fill: #1e293b; font-family: 'Cambria Math', 'KaTeX_Main', serif; font-size: 15px; font-style: italic; font-weight: 600; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .step-num { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="360" rx="20" class="bg" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Dark Header Banner (High Contrast) -->
  <path d="M 0 20 Q 0 0 20 0 L 780 0 Q 800 0 800 20 L 800 72 L 0 72 Z" class="header-bg"/>
  <circle cx="36" cy="36" r="18" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="36" y="42" font-size="18" text-anchor="middle" fill="#60a5fa">📐</text>

  <text x="66" y="33" class="title-text">¿Qué expresiones NO son proposiciones?</text>
  <text x="66" y="53" class="subtitle-text">Identificación de frases y fórmulas sin valor de verdad objetivo (V o F)</text>

  <!-- Body Content -->

    <g transform="translate(30, 92)">
      <!-- Card 1: Preguntas y Exclamaciones -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="230" height="235" rx="14" class="card-bg"/>
        <path d="M 0 14 Q 0 0 14 0 L 216 0 Q 230 0 230 14 L 230 38 L 0 38 Z" fill="#fee2e2"/>
        <rect x="12" y="10" width="18" height="18" rx="4" fill="#ef4444"/>
        <text x="21" y="23" class="badge-text" fill="#ffffff" text-anchor="middle">?</text>
        <text x="38" y="23" font-family="system-ui" font-size="12" font-weight="700" fill="#991b1b">Preguntas y Emociones</text>

        <text x="14" y="66" class="card-desc">No afirman hechos.</text>
        <text x="14" y="86" class="card-desc">Buscan información o</text>
        <text x="14" y="106" class="card-desc">manifiestan un deseo.</text>

        <rect x="14" y="130" width="202" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="22" y="156" font-family="sans-serif" font-size="13" fill="#334155">"¿Qué hora es?"</text>

        <rect x="14" y="180" width="202" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="22" y="206" font-family="sans-serif" font-size="13" fill="#334155">"¡Qué hermoso paisaje!"</text>
      </g>

      <!-- Card 2: Órdenes e Instrucciones -->
      <g transform="translate(255, 0)" filter="url(#shadow)">
        <rect width="230" height="235" rx="14" class="card-bg"/>
        <path d="M 0 14 Q 0 0 14 0 L 216 0 Q 230 0 230 14 L 230 38 L 0 38 Z" fill="#fef3c7"/>
        <rect x="12" y="10" width="18" height="18" rx="4" fill="#f59e0b"/>
        <text x="21" y="23" class="badge-text" fill="#ffffff" text-anchor="middle">!</text>
        <text x="38" y="23" font-family="system-ui" font-size="12" font-weight="700" fill="#92400e">Órdenes / Imperativos</text>

        <text x="14" y="66" class="card-desc">Son mandatos o</text>
        <text x="14" y="86" class="card-desc">algoritmos a ejecutar.</text>
        <text x="14" y="106" class="card-desc">No se juzgan V o F.</text>

        <rect x="14" y="130" width="202" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="22" y="156" font-family="sans-serif" font-size="13" fill="#334155">"Calcula el área"</text>

        <rect x="14" y="180" width="202" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="22" y="206" font-family="sans-serif" font-size="13" fill="#334155">"Resuelve el ejercicio"</text>
      </g>

      <!-- Card 3: Enunciados Abiertos -->
      <g transform="translate(510, 0)" filter="url(#shadow)">
        <rect width="230" height="235" rx="14" class="card-bg"/>
        <path d="M 0 14 Q 0 0 14 0 L 216 0 Q 230 0 230 14 L 230 38 L 0 38 Z" fill="#e0e7ff"/>
        <rect x="12" y="10" width="18" height="18" rx="4" fill="#6366f1"/>
        <text x="21" y="23" class="badge-text" fill="#ffffff" text-anchor="middle">x</text>
        <text x="38" y="23" font-family="system-ui" font-size="12" font-weight="700" fill="#3730a3">Enunciados Abiertos</text>

        <text x="14" y="66" class="card-desc">Tienen variables libres.</text>
        <text x="14" y="86" class="card-desc">Su verdad depende del</text>
        <text x="14" y="106" class="card-desc">valor que tome la variable.</text>

        <rect x="14" y="130" width="202" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="22" y="156" class="card-math">x + 2 = 10</text>

        <rect x="14" y="180" width="202" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="22" y="206" font-family="sans-serif" font-size="13" fill="#334155">"Él es un buen alumno"</text>
      </g>
    </g>

</svg>
