<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS GUIADOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Diferenciación entre ℕ y ℕ₀</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Comparación directa de pertenencia, operaciones con cero y conjuntos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Pertenencia de 0</text>

        <rect x="15" y="65" width="190" height="45" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="110" y="93" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">0 ∈ ℕ₀ (Verdadero)</text>

        <rect x="15" y="125" width="190" height="45" rx="6" fill="#0f172a" stroke="#f87171"/>
        <text x="110" y="153" fill="#f87171" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">0 ∈ ℕ (Falso)</text>

        <text x="20" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">El subíndice 0 indica</text>
        <text x="20" y="220" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">inclusión explícita del 0.</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Operaciones con 0</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="90" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Suma con neutro:</text>
        <text x="25" y="110" fill="#38bdf8" font-family="monospace" font-size="12">8 + 0 = 8 ∈ ℕ₀</text>

        <rect x="15" y="135" width="190" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="160" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Multiplicación por 0:</text>
        <text x="25" y="180" fill="#34d399" font-family="monospace" font-size="12">15 · 0 = 0 ∈ ℕ₀</text>

        <text x="20" y="225" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Clausura preservada en ℕ₀</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Resta y División</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="90" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Resta de iguales:</text>
        <text x="25" y="110" fill="#34d399" font-family="monospace" font-size="12">5 - 5 = 0 ∈ ℕ₀</text>

        <rect x="15" y="135" width="190" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="160" fill="#f87171" font-family="system-ui, sans-serif" font-size="11">División por cero:</text>
        <text x="25" y="180" fill="#f87171" font-family="monospace" font-size="12">5 / 0 = Indefinido</text>

        <text x="20" y="225" fill="#f87171" font-family="system-ui, sans-serif" font-size="11">¡Nunca dividir por 0!</text>
      </g>
    </g>

</svg>
