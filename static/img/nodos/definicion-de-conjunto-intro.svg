<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Definición de Conjunto Matemático</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">TEORÍA DE CONJUNTOS</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Colección Bien Definida</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Un conjunto agrupa elementos bajo un criterio objetivo.</text>

    <!-- Visual Box -->
    <rect x="44" y="165" width="320" height="65" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="56" y="190" fill="#1e40af" font-size="12" font-weight="700">Regla Fundamental:</text>
    <text x="56" y="215" fill="#1d4ed8" font-size="14" font-weight="900">Para todo x: x ∈ A  o  x ∉ A (Sin ambigüedad)</text>

    <rect x="44" y="245" width="320" height="125" rx="10" fill="#f1f5f9"/>
    <text x="56" y="272" fill="#334155" font-size="12.5" font-weight="700">Características Principales:</text>
    <text x="56" y="295" fill="#475569" font-size="12">• Los objetos del grupo se llaman elementos.</text>
    <text x="56" y="317" fill="#475569" font-size="12">• Se denotan con letras mayúsculas: A, B, C...</text>
    <text x="56" y="342" fill="#1d4ed8" font-size="12" font-weight="700">La pertenencia es estricta y determinista.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Objetividad vs Subjetividad</text>

    <rect x="436" y="140" width="320" height="70" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="448" y="165" fill="#065f46" font-size="12" font-weight="700">Conjunto Válido (Objetivo):</text>
    <text x="448" y="192" fill="#059669" font-size="12.5" font-weight="900">"Pares &lt; 10" ➔ {2, 4, 6, 8} ✓</text>

    <rect x="436" y="225" width="320" height="70" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="448" y="250" fill="#991b1b" font-size="12" font-weight="700">No es Conjunto (Subjetivo):</text>
    <text x="448" y="277" fill="#dc2626" font-size="12.5" font-weight="900">"Los números bonitos" ➔ No medible ✗</text>

    <rect x="436" y="310" width="320" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="596" y="335" fill="#1e40af" font-size="11.5" font-weight="700" text-anchor="middle">Criterio clave:</text>
    <text x="596" y="355" fill="#1d4ed8" font-size="12" font-weight="800" text-anchor="middle">La pertenencia es objetiva y universal.</text>
  </g>

</svg>
