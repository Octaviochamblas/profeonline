<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS GUIADOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Operaciones y Pertenencia en ℤ</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Resolución de restas y clasificación en los subconjuntos de ℤ</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Resta en ℤ</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="88" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Resta de menor a mayor:</text>
        <text x="25" y="108" fill="#34d399" font-family="monospace" font-size="12">3 - 8 = -5 ∈ ℤ</text>

        <rect x="15" y="130" width="190" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="153" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">En naturales era imposible:</text>
        <text x="25" y="173" fill="#f87171" font-family="monospace" font-size="12">-5 ∉ ℕ</text>

        <text x="20" y="215" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">ℤ soluciona la falta</text>
        <text x="20" y="235" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">de clausura de ℕ.</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Subconjuntos</text>

        <rect x="15" y="65" width="190" height="40" rx="6" fill="#0f172a" stroke="#f87171"/>
        <text x="25" y="90" fill="#f87171" font-family="monospace" font-size="12">-14 ∈ ℤ⁻ ⊂ ℤ</text>

        <rect x="15" y="115" width="190" height="40" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="140" fill="#fbbf24" font-family="monospace" font-size="12">0 ∈ ℤ (neutro)</text>

        <rect x="15" y="165" width="190" height="40" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="190" fill="#34d399" font-family="monospace" font-size="12">+29 ∈ ℤ⁺ ⊂ ℤ</text>

        <text x="20" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Partición exacta de ℤ</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Opuestos Aditivos</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="88" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Opuesto de 7:</text>
        <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="12">-7 , pues 7+(-7)=0</text>

        <rect x="15" y="130" width="190" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="153" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">Opuesto de -12:</text>
        <text x="25" y="173" fill="#38bdf8" font-family="monospace" font-size="12">-(-12) = 12</text>

        <text x="20" y="215" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Simetría respecto</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">al origen cero.</text>
      </g>
    </g>

</svg>
