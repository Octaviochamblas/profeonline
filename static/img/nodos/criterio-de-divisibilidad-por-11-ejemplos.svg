<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Suma Alternada para Divisibilidad por 11</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Cálculo paso a paso asignando signos alternados desde la derecha</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Evaluar 5.841</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Alternar signos:</text>
        <text x="25" y="108" fill="#1d4ed8" font-family="monospace" font-size="13" font-weight="700">1 - 4 + 8 - 5 = 0</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">El resultado es 0,</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">que es múltiplo de 11.</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">5841 ÷ 11 = 531.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Divisible por 11</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#ef4444"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Evaluar 4.825</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#ef4444"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Alternar signos:</text>
        <text x="25" y="108" fill="#dc2626" font-family="monospace" font-size="13" font-weight="700">5 - 2 + 8 - 4 = 7</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">El resultado es 7,</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">que no es múltiplo de 11.</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">El resto final es 7.</text>
        <text x="20" y="230" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="600">❌ NO divisible (r = 7)</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Incógnita 7X42</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#f59e0b"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">2 - 4 + X - 7:</text>
        <text x="25" y="108" fill="#d97706" font-family="monospace" font-size="12">X - 9 = 0 ⟹ X = 9</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Para que X - 9 = 0,</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">el dígito debe ser 9.</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Número: 7.942 (÷11 = 722).</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Solución X = 9</text>
      </g>
    </g>

</svg>
