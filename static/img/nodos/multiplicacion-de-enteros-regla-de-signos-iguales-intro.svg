<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">MULTIPLICACIÓN</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Multiplicación de Enteros: Signos Iguales</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">El producto de dos números con el mismo signo siempre es POSITIVO: (+)·(+)=(+) y (-)·(-)=(+)</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Two pillars -->
      <g transform="translate(25, 25)">
        <rect width="310" height="215" rx="8" fill="#0f172a" stroke="#34d399"/>
        <text x="20" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Positivo · Positivo = Positivo</text>
        <rect x="20" y="48" width="270" height="40" rx="6" fill="#1e293b" stroke="#34d399"/>
        <text x="155" y="73" fill="#34d399" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">(+a) · (+b) = +(a · b)</text>

        <text x="20" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ejemplo:</text>
        <text x="20" y="138" fill="#38bdf8" font-family="monospace" font-size="13">(+6) · (+7) = +42</text>
        <text x="20" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Suma reiterada hacia la derecha:</text>
        <text x="20" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">6 veces avanzar 7 unidades.</text>
        <text x="20" y="205" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Multiplicación estándar en ℕ</text>
      </g>

      <g transform="translate(365, 25)">
        <rect width="310" height="215" rx="8" fill="#0f172a" stroke="#fbbf24"/>
        <text x="20" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Negativo · Negativo = Positivo</text>
        <rect x="20" y="48" width="270" height="40" rx="6" fill="#1e293b" stroke="#fbbf24"/>
        <text x="155" y="73" fill="#fbbf24" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">(-a) · (-b) = +(a · b)</text>

        <text x="20" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ejemplo:</text>
        <text x="20" y="138" fill="#fbbf24" font-family="monospace" font-size="13">(-6) · (-7) = +42</text>
        <text x="20" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• El opuesto de retroceder es avanzar:</text>
        <text x="20" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Quitar una deuda equivale a ganar.</text>
        <text x="20" y="205" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Menos por menos da MÁS</text>
      </g>
    </g>

</svg>
