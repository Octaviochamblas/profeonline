<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">DIVISIÓN POR 0</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Indefinición de la División por Cero</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">La operación a ÷ 0 no está definida: no existe número real que satisfaga a / 0</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 25)">
        <rect width="310" height="215" rx="8" fill="#0f172a" stroke="#f87171"/>
        <text x="20" y="32" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Caso a ≠ 0 : a ÷ 0 (Imposible)</text>
        <rect x="20" y="48" width="270" height="40" rx="6" fill="#1e293b" stroke="#f87171"/>
        <text x="155" y="73" fill="#f87171" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">a / 0 = k ⟹ k · 0 = a</text>

        <text x="20" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Contradicción:</text>
        <text x="20" y="138" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Como k · 0 = 0 para todo k,</text>
        <text x="20" y="160" fill="#f87171" font-family="monospace" font-size="12">0 = a  (pero a ≠ 0)</text>
        <text x="20" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">¡No existe ningún número k!</text>
        <text x="20" y="205" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">❌ Operación indefinida</text>
      </g>

      <g transform="translate(365, 25)">
        <rect width="310" height="215" rx="8" fill="#0f172a" stroke="#fbbf24"/>
        <text x="20" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Caso a = 0 : 0 ÷ 0 (Indeterminado)</text>
        <rect x="20" y="48" width="270" height="40" rx="6" fill="#1e293b" stroke="#fbbf24"/>
        <text x="155" y="73" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">0 / 0 = k ⟹ k · 0 = 0</text>

        <text x="20" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Indeterminación:</text>
        <text x="20" y="138" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">k · 0 = 0 se cumple para</text>
        <text x="20" y="160" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">ABSOLUTAMENTE TODO número k.</text>
        <text x="20" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">No tiene un valor único asignable.</text>
        <text x="20" y="205" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⚠️ Indeterminación matemática</text>
      </g>
    </g>

</svg>
