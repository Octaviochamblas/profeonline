<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Obreros, Horas/día y Días</text>
  <text x="35" y="85" class="text-step">6 obreros trabajando 8 h/d tardan 10 días.</text>
  <text x="35" y="105" class="text-step">¿Cuántos días tardan 10 obreros a 6 h/d?</text>
  <text x="35" y="130" class="text-step">Paso 1: Plantear ecuación (ambas inversas)</text>
  <g transform="translate(35, 140)">
    <g transform="translate(0, 0)">
      <text x="10" y="12" class="math" text-anchor="middle">10</text>
      <line x1="0" y1="16" x2="20" y2="16" class="frac-line"/>
      <text x="10" y="30" class="math" text-anchor="middle">x</text>
    </g>
    <text x="28" y="18" class="math">=</text>
    <g transform="translate(45, 0)">
      <text x="10" y="12" class="math" text-anchor="middle">10</text>
      <line x1="0" y1="16" x2="20" y2="16" class="frac-line"/>
      <text x="10" y="30" class="math" text-anchor="middle">6</text>
    </g>
    <text x="73" y="18" class="math">·</text>
    <g transform="translate(85, 0)">
      <text x="10" y="12" class="math" text-anchor="middle">6</text>
      <line x1="0" y1="16" x2="20" y2="16" class="frac-line"/>
      <text x="10" y="30" class="math" text-anchor="middle">8</text>
    </g>
    <text x="113" y="18" class="math">=</text>
    <g transform="translate(125, 0)">
      <text x="10" y="12" class="math" text-anchor="middle">10</text>
      <line x1="0" y1="16" x2="20" y2="16" class="frac-line"/>
      <text x="10" y="30" class="math" text-anchor="middle">8</text>
    </g>
  </g>
  <text x="35" y="195" class="text-step">Paso 2: 10 / x = 10 / 8 ⟹ x = 8 días</text>
  <text x="35" y="235" class="res">Tardarán 8 días</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Transporte, Peso y Distancia</text>
  <text x="365" y="85" class="text-step">Llevar 5 ton a 200 km cuesta $80.000.</text>
  <text x="365" y="105" class="text-step">¿Cuánto cuesta llevar 8 ton a 300 km?</text>
  <text x="365" y="130" class="text-step">Paso 1: Ambas magnitudes son DIRECTAS con el costo</text>
  <g transform="translate(365, 140)">
    <g transform="translate(0, 0)">
      <text x="18" y="12" class="math" text-anchor="middle">80.000</text>
      <line x1="0" y1="16" x2="36" y2="16" class="frac-line"/>
      <text x="18" y="30" class="math" text-anchor="middle">x</text>
    </g>
    <text x="44" y="18" class="math">=</text>
    <g transform="translate(58, 0)">
      <text x="8" y="12" class="math" text-anchor="middle">5</text>
      <line x1="0" y1="16" x2="16" y2="16" class="frac-line"/>
      <text x="8" y="30" class="math" text-anchor="middle">8</text>
    </g>
    <text x="80" y="18" class="math">·</text>
    <g transform="translate(92, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">200</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">300</text>
    </g>
    <text x="125" y="18" class="math">=</text>
    <g transform="translate(138, 0)">
      <text x="10" y="12" class="math" text-anchor="middle">10</text>
      <line x1="0" y1="16" x2="20" y2="16" class="frac-line"/>
      <text x="10" y="30" class="math" text-anchor="middle">24</text>
    </g>
  </g>
  <text x="365" y="195" class="text-step">Paso 2: x = (80.000 · 24) / 10 = $192.000</text>
  <text x="365" y="235" class="res">Costo final = $192.000</text>
</svg>
