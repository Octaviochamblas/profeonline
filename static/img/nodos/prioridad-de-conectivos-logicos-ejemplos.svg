<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18.5" font-weight="800" letter-spacing="0.01em">Ejemplos de Precedencia — Sin Paréntesis vs Con Paréntesis</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Caso 1: Alcance de la Negación</text>

    <rect x="44" y="135" width="320" height="50" rx="8" fill="#f1f5f9"/>
    <text x="56" y="165" fill="#0f172a" font-size="17" font-weight="800">Expresión:  ¬p ∧ q</text>

    <rect x="44" y="200" width="320" height="65" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="56" y="224" fill="#065f46" font-size="12">Interpretación por jerarquía (¬ antes de ∧):</text>
    <text x="56" y="250" fill="#0f766e" font-size="17" font-weight="900">(¬p) ∧ q  ✓ Correcto</text>

    <rect x="44" y="280" width="320" height="90" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="56" y="304" fill="#991b1b" font-size="12" font-weight="700">Error Frecuente:</text>
    <text x="56" y="326" fill="#dc2626" font-size="13" font-weight="700">Pensar que equivale a ¬(p ∧ q) ✗</text>
    <text x="56" y="350" fill="#475569" font-size="11.5">Para afectar a la conjunción se REQUIEREN paréntesis.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="15.5" font-weight="800">Caso 2: Implicación vs Conjunción</text>

    <rect x="436" y="135" width="320" height="50" rx="8" fill="#f1f5f9"/>
    <text x="448" y="165" fill="#0f172a" font-size="17" font-weight="800">Expresión:  p ∧ q → r</text>

    <rect x="436" y="200" width="320" height="65" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="448" y="224" fill="#1e40af" font-size="12">Paso 1: Conjunción tiene prioridad (Tier 3)</text>
    <text x="448" y="250" fill="#1d4ed8" font-size="17" font-weight="900">(p ∧ q) → r  ✓ Correcto</text>

    <rect x="436" y="280" width="320" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="448" y="304" fill="#334155" font-size="12" font-weight="700">Conector Principal:</text>
    <text x="448" y="326" fill="#0f172a" font-size="13" font-weight="800">El condicional (→) es el dominante.</text>
    <text x="448" y="350" fill="#475569" font-size="11.5">No se debe evaluar como p ∧ (q → r).</text>
  </g>

</svg>
