<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Hallar parte B sabiendo parte A</text>
  <text x="35" y="85" class="text-step">Reparto en razón 3 : 5. Si A recibe $18.000:</text>
  <text x="35" y="115" class="text-step">Paso 1: Despejar k = 18.000 / 3 = $6.000</text>
  <text x="35" y="140" class="math">k = $6.000 (valor de cada parte)</text>
  <text x="35" y="170" class="text-step">Paso 2: Calcular parte B</text>
  <text x="35" y="195" class="math">B = 5 · k = 5 · 6.000 = $30.000</text>
  <text x="35" y="235" class="res">Parte B = $30.000</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Reconstruir el Total</text>
  <text x="365" y="85" class="text-step">En razón 2 : 4 : 7, la menor parte es $14.000:</text>
  <text x="365" y="115" class="text-step">Paso 1: Menor índice es 2 ⟹ 2k = 14.000</text>
  <text x="365" y="140" class="math">k = 14.000 / 2 = $7.000</text>
  <text x="365" y="170" class="text-step">Paso 2: Total = (2 + 4 + 7) · k = 13 · 7.000</text>
  <text x="365" y="195" class="math">Total = $91.000</text>
  <text x="365" y="235" class="res">Total repartido = $91.000</text>
</svg>
