<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Ejemplos: Racionalización con Conjugado</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Fracciones verticales aplicando suma por su diferencia</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>

        <!-- Header Fraction 6 / (√<tspan style="text-decoration: overline">5</tspan> - √<tspan style="text-decoration: overline">2</tspan>) -->
        <g transform="translate(65, 30)">
          <text x="25" y="-5" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">6</text>
          <line x1="0" y1="0" x2="50" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="25" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">5</tspan> - √<tspan style="text-decoration: overline">2</tspan></text>
        </g>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#34d399"/>
        <g transform="translate(25, 92)">
          <!-- 6(√<tspan style="text-decoration: overline">5</tspan>+√<tspan style="text-decoration: overline">2</tspan>) / 3 -->
          <text x="35" y="-5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">6(√<tspan style="text-decoration: overline">5</tspan> + √<tspan style="text-decoration: overline">2</tspan>)</text>
          <line x1="5" y1="0" x2="65" y2="0" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="35" y="13" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">5 - 2 = 3</text>

          <text x="80" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>

          <text x="135" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">2(√<tspan style="text-decoration: overline">5</tspan> + √<tspan style="text-decoration: overline">2</tspan>) ✓</text>
        </g>

        <text x="20" y="175" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">6 : 3 = 2</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">5 - 2 = 3 en denominador.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ = 2√<tspan style="text-decoration: overline">5</tspan> + 2√<tspan style="text-decoration: overline">2</tspan></text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>

        <!-- Header Fraction 4 / (3 + √<tspan style="text-decoration: overline">5</tspan>) -->
        <g transform="translate(65, 30)">
          <text x="20" y="-5" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text>
          <line x1="0" y1="0" x2="40" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="20" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3 + √<tspan style="text-decoration: overline">5</tspan></text>
        </g>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <g transform="translate(25, 92)">
          <!-- 4(3 - √<tspan style="text-decoration: overline">5</tspan>) / (9 - 5) -->
          <text x="35" y="-5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4(3 - √<tspan style="text-decoration: overline">5</tspan>)</text>
          <line x1="5" y1="0" x2="65" y2="0" stroke="#38bdf8" stroke-width="1.2"/>
          <text x="35" y="13" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3² - 5 = 4</text>

          <text x="80" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>

          <text x="130" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3 - √<tspan style="text-decoration: overline">5</tspan> ✓</text>
        </g>

        <text x="20" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Entero + Raíz</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">9 - 5 = 4; 4/4 se cancelan.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ = 3 - √<tspan style="text-decoration: overline">5</tspan></text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>

        <!-- Header Fraction 1 / (√<tspan style="text-decoration: overline">7</tspan> + √<tspan style="text-decoration: overline">3</tspan>) -->
        <g transform="translate(65, 30)">
          <text x="25" y="-5" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text>
          <line x1="0" y1="0" x2="50" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="25" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">7</tspan> + √<tspan style="text-decoration: overline">3</tspan></text>
        </g>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <g transform="translate(25, 92)">
          <!-- (√<tspan style="text-decoration: overline">7</tspan> - √<tspan style="text-decoration: overline">3</tspan>) / 4 -->
          <text x="45" y="-5" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">7</tspan> - √<tspan style="text-decoration: overline">3</tspan></text>
          <line x1="15" y1="0" x2="75" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="45" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">7 - 3 = 4</text>

          <text x="100" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✓</text>
        </g>

        <text x="20" y="175" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Denominador 4</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">7 - 3 = 4.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ = (√<tspan style="text-decoration: overline">7</tspan> - √<tspan style="text-decoration: overline">3</tspan>) / 4</text>
      </g>
    </g>

</svg>
