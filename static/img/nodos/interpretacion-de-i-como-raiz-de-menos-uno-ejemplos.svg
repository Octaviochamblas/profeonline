<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Raíz exacta</text>

  <g>
    <text x="35" y="87" class="text-step">Calcular:</text>
    <path d="M 85,82 L 89,82 L 93,90 L 99,72 L 135,72" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="87" class="text-step">−100</text>
  </g>

  <text x="35" y="115" class="text-step">Paso 1: Factorizar el signo negativo</text>

  <g>
    <text x="35" y="142" class="math">=</text>
    <path d="M 48,137 L 52,137 L 56,145 L 62,127 L 115,127" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="142" class="math">100 · −1</text>
    <text x="122" y="142" class="math">=</text>
    <path d="M 134,137 L 138,137 L 142,145 L 148,127 L 175,127" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="151" y="142" class="math">100</text>
    <text x="182" y="142" class="math">·</text>
    <path d="M 193,137 L 197,137 L 201,145 L 207,127 L 225,127" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="210" y="142" class="math">−1</text>
  </g>

  <text x="35" y="170" class="text-step">Paso 2: Sustituir raíz y unidad i</text>
  <text x="35" y="195" class="math">= 10 · i = 10i</text>
  <text x="35" y="235" class="res">Resultado = 10i</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Producto de raíces negativas</text>

  <g>
    <text x="365" y="87" class="text-step">Calcular:</text>
    <path d="M 418,82 L 422,82 L 426,90 L 432,72 L 452,72" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="435" y="87" class="text-step">−4</text>
    <text x="460" y="87" class="text-step">·</text>
    <path d="M 470,82 L 474,82 L 478,90 L 484,72 L 504,72" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="487" y="87" class="text-step">−9</text>
  </g>

  <text x="365" y="115" class="text-step">Paso 1: Convertir PRIMERO cada raíz a i</text>
  <text x="365" y="140" class="math">= (2i) · (3i)</text>
  <text x="365" y="170" class="text-step">Paso 2: Multiplicar: 6 · i<tspan baseline-shift="super" font-size="70%">2</tspan> = 6 · (−1)</text>
  <text x="365" y="195" class="math">= −6</text>
  <text x="365" y="235" class="res">Resultado = −6</text>
</svg>
