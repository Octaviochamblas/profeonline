<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Identificar relaciones</text>
  <text x="35" y="85" class="text-step">Incógnita: Días (D). Magnitudes: Obreros (O) y Obra (M):</text>
  <text x="35" y="115" class="text-step">Paso 1: Días vs Obreros (a más O, menos D)</text>
  <text x="35" y="135" class="math">Relación INVERSA (se invierte O₂ / O₁)</text>
  <text x="35" y="165" class="text-step">Paso 2: Días vs Obra (a más M, más D)</text>
  <text x="35" y="185" class="math">Relación DIRECTA (se mantiene M₁ / M₂)</text>
  <text x="35" y="235" class="res">Modelo: D₁/D₂ = (O₂/O₁) · (M₁/M₂)</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Planteamiento numérico</text>
  <text x="365" y="85" class="text-step">4 obreros hacen 100 m en 6 días. ¿6 obreros 150 m?</text>
  <text x="365" y="115" class="text-step">Paso 1: Estructurar proporción con Días</text>
  <g transform="translate(365, 125)">
    <g transform="translate(0, 0)">
      <text x="8" y="12" class="math" text-anchor="middle">6</text>
      <line x1="0" y1="16" x2="16" y2="16" class="frac-line"/>
      <text x="8" y="30" class="math" text-anchor="middle">x</text>
    </g>
    <text x="22" y="18" class="math">=</text>
    <g transform="translate(35, 0)">
      <text x="8" y="12" class="math" text-anchor="middle">6</text>
      <line x1="0" y1="16" x2="16" y2="16" class="frac-line"/>
      <text x="8" y="30" class="math" text-anchor="middle">4</text>
    </g>
    <text x="57" y="18" class="math">·</text>
    <g transform="translate(70, 0)">
      <text x="15" y="12" class="math" text-anchor="middle">100</text>
      <line x1="0" y1="16" x2="30" y2="16" class="frac-line"/>
      <text x="15" y="30" class="math" text-anchor="middle">150</text>
    </g>
    <text x="110" y="18" class="math">= 1</text>
  </g>
  <text x="365" y="185" class="text-step">Paso 2: Despejar x</text>
  <text x="365" y="205" class="math">6 / x = 1 ⟹ x = 6 días</text>
  <text x="365" y="235" class="res">Respuesta: 6 días</text>
</svg>
