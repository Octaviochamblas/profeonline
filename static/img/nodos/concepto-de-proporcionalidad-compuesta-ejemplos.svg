<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Obreros, Horas y Días</text>
  <text x="35" y="85" class="text-step">6 obreros, 8 h/d tardan 10 días.</text>
  <text x="35" y="105" class="text-step">¿Cuántos días tardan 10 obreros a 6 h/d?</text>
  <text x="35" y="130" class="math">• Obreros vs Días: Inversa ⟹ (10 / 6)</text>
  <text x="35" y="150" class="math">• Horas/día vs Días: Inversa ⟹ (6 / 8)</text>
  <g transform="translate(35, 165)">
    <text x="0" y="18" class="math">10 / x =</text>
    <g transform="translate(55, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">10</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">6</text>
    </g>
    <text x="85" y="18" class="math">·</text>
    <g transform="translate(95, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">6</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">8</text>
    </g>
    <text x="125" y="18" class="math">= 10 / 8</text>
  </g>
  <text x="35" y="235" class="res">Respuesta: x = 8 días</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Peso, Distancia y Costo</text>
  <text x="365" y="85" class="text-step">5 ton a 200 km cuestan $80.000.</text>
  <text x="365" y="105" class="text-step">¿Cuánto cuestan 8 ton a 300 km?</text>
  <text x="365" y="130" class="math">• Peso vs Costo: Directa ⟹ (8 / 5)</text>
  <text x="365" y="150" class="math">• Distancia vs Costo: Directa ⟹ (300 / 200)</text>
  <text x="365" y="180" class="math">x = 80.000 · (8 / 5) · (3 / 2)</text>
  <text x="365" y="205" class="math">x = 80.000 · 2,4 = $192.000</text>
  <text x="365" y="235" class="res">Costo final: $192.000</text>
</svg>
