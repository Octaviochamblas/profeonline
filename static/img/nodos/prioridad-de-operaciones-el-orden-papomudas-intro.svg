<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">PAPOMUDAS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Prioridad de Operaciones: PAPOMUDAS</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Jerarquía estricta para resolver operaciones combinadas de izquierda a derecha</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- 4 hierarchy tiers -->
      <g transform="translate(25, 20)">
        <rect width="650" height="50" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="30" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. PA - Paréntesis</text>
        <text x="200" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Paréntesis (), corchetes [], llaves {} (de adentro hacia afuera)</text>
      </g>

      <g transform="translate(25, 80)">
        <rect width="650" height="50" rx="8" fill="#0f172a" stroke="#a855f7"/>
        <text x="30" y="32" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. PO - Potencias</text>
        <text x="200" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Potencias y raíces cuadradas</text>
      </g>

      <g transform="translate(25, 140)">
        <rect width="650" height="50" rx="8" fill="#0f172a" stroke="#34d399"/>
        <text x="30" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3. MU-DA - Multiplicación y División</text>
        <text x="320" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Igual nivel: de IZQUIERDA a DERECHA</text>
      </g>

      <g transform="translate(25, 200)">
        <rect width="650" height="50" rx="8" fill="#0f172a" stroke="#fbbf24"/>
        <text x="30" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4. S - Adición y Sustracción</text>
        <text x="280" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Último nivel: de IZQUIERDA a DERECHA</text>
      </g>
    </g>

</svg>
