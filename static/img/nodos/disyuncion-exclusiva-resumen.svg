<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="0.02em">Síntesis — Disyunción Exclusiva (p ⊕ q)</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="752" height="255" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="24" y="80" width="752" height="6" fill="url(#grad-purple)" rx="3"/>

    <rect x="44" y="105" width="220" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="60" y="135" fill="#0f172a" font-size="15" font-weight="800">Símbolo y Operador</text>
    <text x="60" y="165" fill="#7e22ce" font-size="24" font-weight="900">p ⊕ q  /  p ⊻ q</text>
    <text x="60" y="195" fill="#475569" font-size="12.5">• Diferencia simétrica: A Δ B</text>
    <text x="60" y="215" fill="#475569" font-size="12.5">• Suma módulo 2 (XOR)</text>
    <text x="60" y="235" fill="#475569" font-size="12.5">• Opuesto del bicondicional</text>
    <rect x="56" y="250" width="196" height="50" rx="8" fill="#f3e8ff"/>
    <text x="154" y="280" fill="#7e22ce" font-size="13" font-weight="800" text-anchor="middle">Valores veritativos distintos</text>

    <rect x="284" y="105" width="220" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="300" y="135" fill="#0f172a" font-size="15" font-weight="800">Equivalencias</text>
    <rect x="296" y="150" width="196" height="40" rx="6" fill="#f1f5f9"/>
    <text x="308" y="175" fill="#0f172a" font-size="12.5" font-weight="700">p ⊕ q ≡ ¬(p ↔ q)</text>
    <rect x="296" y="198" width="196" height="40" rx="6" fill="#f1f5f9"/>
    <text x="308" y="223" fill="#0f172a" font-size="12.5" font-weight="700">p ⊕ p ≡ F (Autocontradicción)</text>
    <rect x="296" y="246" width="196" height="55" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="308" y="268" fill="#1e40af" font-size="12" font-weight="700">Conmutativa:</text>
    <text x="308" y="288" fill="#1d4ed8" font-size="13" font-weight="800">p ⊕ q ≡ q ⊕ p</text>

    <rect x="524" y="105" width="232" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="540" y="135" fill="#0f172a" font-size="15" font-weight="800">Checklist Rápido</text>
    <rect x="536" y="150" width="208" height="45" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="548" y="177" fill="#991b1b" font-size="13" font-weight="800">✗ V ⊕ V = FALSO</text>
    <rect x="536" y="202" width="208" height="45" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="548" y="229" fill="#065f46" font-size="13" font-weight="800">✓ V ⊕ F = VERDADERO</text>
    <rect x="536" y="254" width="208" height="45" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="548" y="281" fill="#991b1b" font-size="13" font-weight="800">✗ F ⊕ F = FALSO</text>
  </g>

</svg>
