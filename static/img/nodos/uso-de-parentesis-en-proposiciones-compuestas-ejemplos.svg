<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="0.02em">Ejemplos Guiados — Evaluación Anidada de Paréntesis</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="752" height="310" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="24" y="80" width="752" height="6" fill="url(#grad-blue)" rx="3"/>

    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Evaluación de Modus Ponens Anidado: [ ( p → q ) ∧ p ] → q</text>

    <!-- Step by step ladder -->
    <rect x="44" y="135" width="712" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="60" y="161" fill="#0f172a" font-size="14" font-weight="700">Paso 1: Evaluar el paréntesis más interno ( p → q )</text>
    <text x="600" y="161" fill="#1d4ed8" font-size="13" font-weight="800">Cálculo de la hipótesis</text>

    <rect x="44" y="185" width="712" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="60" y="211" fill="#1e40af" font-size="14" font-weight="700">Paso 2: Operar la conjunción del corchete: [ ( p → q ) ∧ p ]</text>
    <text x="600" y="211" fill="#1d4ed8" font-size="13" font-weight="800">Resultado intermedio</text>

    <rect x="44" y="235" width="712" height="42" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="60" y="261" fill="#065f46" font-size="14" font-weight="700">Paso 3: Evaluar el condicional externo hacia q</text>
    <text x="600" y="261" fill="#059669" font-size="13" font-weight="800">Conector Principal</text>

    <rect x="44" y="290" width="712" height="80" rx="10" fill="#0f172a"/>
    <text x="400" y="322" fill="#38bdf8" font-size="16" font-weight="800" text-anchor="middle">Resultado de la Tabla de Verdad: V , V , V , V</text>
    <text x="400" y="352" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">¡Es una TAUTOLOGÍA Clásica (Regla de Inferencia Modus Ponens)!</text>
  </g>

</svg>
