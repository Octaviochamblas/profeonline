<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">CRITERIO POR 10</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Criterio de Divisibilidad por 10</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Un número es divisible por 10 si y solo si su última cifra es CERO</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="26" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ENUNCIADO DEL CRITERIO POR 10</text>
        <text x="325" y="50" fill="#059669" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">10 | n  ⟺  Última cifra d_0 = 0  (n = 10 · k)</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Base del Sistema Decimal</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">En el sistema posicional en base 10:</text>
        <text x="20" y="78" fill="#1d4ed8" font-family="monospace" font-size="12">n = d_k·10^k + ... + d_1·10 + d_0</text>
        <text x="20" y="100" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Todos los términos salvo d_0 son múltiplos de 10.</text>
        <text x="20" y="125" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ n mod 10 = d_0</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#059669" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Doble Condición 2 y 5</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">10 = 2 · 5 (primos coprimos):</text>
        <text x="20" y="78" fill="#059669" font-family="monospace" font-size="13">10 | n  ⟺  (2 | n)  ∧  (5 | n)</text>
        <text x="20" y="102" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Ser par y terminar en 0 o 5 obliga a que u = 0.</text>
        <text x="20" y="125" fill="#0284c7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Coherencia aritmética absoluta</text>
      </g>
    </g>

</svg>
