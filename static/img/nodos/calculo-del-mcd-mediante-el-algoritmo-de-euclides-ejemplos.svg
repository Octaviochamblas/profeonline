<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Divisiones Euclídeas Sucesivas</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Reducción iterativa de pares (dividendo, divisor) mediante el residuo</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcd(252, 105)</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#3b82f6"/>
        <text x="25" y="85" fill="#94a3b8" font-family="monospace" font-size="11">252 = 105·2 + 42</text>
        <text x="25" y="105" fill="#94a3b8" font-family="monospace" font-size="11">105 = 42·2  + 21</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="11" font-weight="700"> 42 = 21·2  + 0 ➔ Fin</text>

        <text x="20" y="180" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">mcd = 21</text>
        <text x="20" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Último resto no nulo: 21.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Resuelto en 3 divisiones</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">mcd(480, 130)</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="85" fill="#94a3b8" font-family="monospace" font-size="11">480 = 130·3 + 90</text>
        <text x="25" y="105" fill="#94a3b8" font-family="monospace" font-size="11">130 = 90·1  + 40</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">90 = 40·2 + 10 ... ➔ 10</text>

        <text x="20" y="180" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">mcd = 10</text>
        <text x="20" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">40 = 10·4 + 0 (resto 0).</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Eficiencia superior</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Coprimos (89, 55)</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="85" fill="#94a3b8" font-family="monospace" font-size="11">89 = 55·1 + 34</text>
        <text x="25" y="105" fill="#94a3b8" font-family="monospace" font-size="11">55 = 34·1 + 21</text>
        <text x="25" y="128" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">34=21+13... 2=1·2+0</text>

        <text x="20" y="180" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">mcd = 1</text>
        <text x="20" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Último resto no nulo es 1.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Prueba de coprimalidad</text>
      </g>
    </g>

</svg>
