<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Verificación de Pertenencia a M(n)</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Métodos para verificar si un número dado es múltiplo de otro</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">¿Es 42 múlt. de 7?</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">División:</text>
        <text x="25" y="108" fill="#1d4ed8" font-family="monospace" font-size="13" font-weight="700">42 ÷ 7 = 6 (resto 0)</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Existe k = 6 tal que:</text>
        <text x="20" y="170" fill="#0f172a" font-family="monospace" font-size="12">7 · 6 = 42</text>
        <text x="20" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="11">División exacta.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ SÍ, 42 ∈ M(7)</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#ef4444"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">¿Es 38 múlt. de 5?</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#ef4444"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">División:</text>
        <text x="25" y="108" fill="#dc2626" font-family="monospace" font-size="13" font-weight="700">38 ÷ 5 = 7 (resto 3)</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">La división tiene</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">resto no nulo (r=3).</text>
        <text x="20" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="11">No hay k entero exacto.</text>
        <text x="20" y="230" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="600">❌ NO, 38 ∉ M(5)</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Múltiplos Comunes</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#10b981"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">M(3) ∩ M(4):</text>
        <text x="25" y="108" fill="#059669" font-family="monospace" font-size="12">{12, 24, 36, 48, ...}</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Los múltiplos comunes</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">de 3 y 4 coinciden con</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">los múltiplos de su mcm(12).</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ M(3)∩M(4) = M(12)</text>
      </g>
    </g>

</svg>
