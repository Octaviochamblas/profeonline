<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Resumen Visual — Cardinalidad de Potencia</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">CONJUNTOS BÁSICOS</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="752" height="255" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="24" y="80" width="752" height="6" fill="url(#grad-rose)" rx="3"/>

    <rect x="44" y="105" width="220" height="210" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <text x="60" y="135" fill="#991b1b" font-size="15" font-weight="800">1. Fórmula</text>
    <text x="60" y="165" fill="#dc2626" font-size="19" font-weight="900">|P(A)| = 2ⁿ</text>
    <text x="60" y="195" fill="#334155" font-size="12">• Total de subconjuntos.</text>
    <text x="60" y="215" fill="#334155" font-size="12">• n = número de miembros.</text>
    <rect x="56" y="245" width="196" height="55" rx="8" fill="#ffffff"/>
    <text x="154" y="268" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">Vacío:</text>
    <text x="154" y="288" fill="#dc2626" font-size="13" font-weight="800" text-anchor="middle">|P(∅)| = 2⁰ = 1</text>

    <rect x="284" y="105" width="220" height="210" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="300" y="135" fill="#1e40af" font-size="15" font-weight="800">2. Propios</text>
    <text x="300" y="165" fill="#1d4ed8" font-size="19" font-weight="900">2ⁿ - 1</text>
    <text x="300" y="195" fill="#334155" font-size="12">• Subconjuntos propios.</text>
    <text x="300" y="215" fill="#334155" font-size="12">• Se excluye el total A.</text>
    <rect x="296" y="245" width="196" height="55" rx="8" fill="#ffffff"/>
    <text x="394" y="268" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">Ejemplo n=3:</text>
    <text x="394" y="288" fill="#1d4ed8" font-size="13" font-weight="800" text-anchor="middle">2³ - 1 = 7 propios</text>

    <rect x="524" y="105" width="232" height="210" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="540" y="135" fill="#065f46" font-size="15" font-weight="800">3. Combinatoria</text>
    <text x="540" y="165" fill="#0f766e" font-size="18" font-weight="900">Σ C(n, k) = 2ⁿ</text>
    <text x="540" y="195" fill="#334155" font-size="12">• Suma por tamaños.</text>
    <text x="540" y="215" fill="#334155" font-size="12">• Teorema del binomio.</text>
    <rect x="536" y="245" width="208" height="55" rx="8" fill="#ffffff"/>
    <text x="640" y="268" fill="#065f46" font-size="12" font-weight="700" text-anchor="middle">Duplicación:</text>
    <text x="640" y="288" fill="#059669" font-size="12" font-weight="800" text-anchor="middle">+1 elemento duplica total</text>
  </g>

</svg>
