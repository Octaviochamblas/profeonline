<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">RACIONALIZACIÓN ENÉSIMA</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Racionalización: Raíz Enésima en Denominador</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Completar la potencia con exponente n - k en formato fraccionario vertical</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Top Formula Box -->
      <g transform="translate(25, 18)">
        <rect width="650" height="75" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">FACTOR RACIONALIZANTE DE ORDEN n (EXPONENTE n - k)</text>

        <!-- Formula: a / ⁿ√(bᵏ) · ⁿ√(bⁿ⁻ᵏ) / ⁿ√(bⁿ⁻ᵏ) = aⁿ√(bⁿ⁻ᵏ) / b -->
        <g transform="translate(170, 48)">
          <!-- a / ⁿ√(bᵏ) -->
          <text x="18" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">a</text>
          <line x1="0" y1="0" x2="36" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="18" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√(b<tspan baseline-shift="super" font-size="70%">k</tspan>)</text>

          <!-- · -->
          <text x="50" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">·</text>

          <!-- ⁿ√(bⁿ⁻ᵏ) / ⁿ√(bⁿ⁻ᵏ) -->
          <text x="85" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√(b<tspan baseline-shift="super" font-size="70%">n-k</tspan>)</text>
          <line x1="64" y1="0" x2="106" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="85" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√(b<tspan baseline-shift="super" font-size="70%">n-k</tspan>)</text>

          <!-- = -->
          <text x="122" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">=</text>

          <!-- a ⁿ√(bⁿ⁻ᵏ) / b -->
          <text x="165" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">a · <tspan baseline-shift="super" font-size="70%">n</tspan>√(b<tspan baseline-shift="super" font-size="70%">n-k</tspan>)</text>
          <line x1="138" y1="0" x2="192" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="165" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">b</text>
        </g>
      </g>

      <!-- Left Box -->
      <g transform="translate(25, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Ejemplo: 5 / ∛2</text>

        <!-- Vertical math display -->
        <g transform="translate(40, 68)">
          <!-- 5 / ∛2 -->
          <text x="12" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text>
          <line x1="0" y1="0" x2="24" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="12" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">3</tspan>√2</text>

          <text x="36" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">·</text>

          <!-- ∛4 / ∛4 -->
          <text x="56" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">3</tspan>√4</text>
          <line x1="46" y1="0" x2="66" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="56" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">3</tspan>√4</text>

          <text x="80" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <!-- 5∛4 / 2 -->
          <text x="115" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5 <tspan baseline-shift="super" font-size="70%">3</tspan>√4</text>
          <line x1="96" y1="0" x2="134" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="115" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text>
        </g>

        <text x="20" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Falta exponente 3 - 1 = 2 (2² = 4).</text>
        <text x="20" y="134" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ En denominador: ∛(2³) = 2</text>
      </g>

      <!-- Right Box -->
      <g transform="translate(365, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">¡Error Común!</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Multiplicar por la misma raíz ∛2:</text>

        <!-- Error math display -->
        <g transform="translate(45, 82)">
          <text x="12" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
          <line x1="0" y1="0" x2="24" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="12" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">3</tspan>√2</text>

          <text x="36" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">·</text>

          <text x="56" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">3</tspan>√2</text>
          <line x1="46" y1="0" x2="66" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="56" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">3</tspan>√2</text>

          <text x="80" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <text x="105" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">3</tspan>√2</text>
          <line x1="92" y1="0" x2="118" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="105" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">3</tspan>√4</text>

          <text x="145" y="5" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✗ ¡Sigue con raíz!</text>
        </g>

        <text x="20" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Los exponentes deben sumar exactamente n.</text>
      </g>
    </g>

</svg>
