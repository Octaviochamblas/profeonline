<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Cardinalidad de A × B</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">PROD. CARTESIANO</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Principio Multiplicativo</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">El tamaño del producto es el producto de los tamaños.</text>

    <!-- Visual Box -->
    <rect x="44" y="165" width="320" height="65" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="204" y="208" fill="#1d4ed8" font-size="20" font-weight="900" text-anchor="middle">|A × B| = |A| · |B|</text>

    <rect x="44" y="245" width="320" height="125" rx="10" fill="#f1f5f9"/>
    <text x="56" y="272" fill="#334155" font-size="12.5" font-weight="700">Propiedades Numéricas:</text>
    <text x="56" y="295" fill="#475569" font-size="12">• |A × B| = |B × A| (conmutatividad numérica).</text>
    <text x="56" y="317" fill="#475569" font-size="12">• Si |A| = 0 ó |B| = 0 ⟹ |A × B| = 0.</text>
    <text x="56" y="342" fill="#1d4ed8" font-size="12" font-weight="700">Para k conjuntos: |A₁ × ... × Aₖ| = ∏ |Aᵢ|.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">Modelo de Área / Cuadrícula</text>

    <rect x="446" y="140" width="300" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- 3x4 grid at absolute coords -->
    <rect x="500" y="150" width="180" height="95" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="545" y1="150" x2="545" y2="245" stroke="#93c5fd"/>
    <line x1="590" y1="150" x2="590" y2="245" stroke="#93c5fd"/>
    <line x1="635" y1="150" x2="635" y2="245" stroke="#93c5fd"/>
    <line x1="500" y1="181" x2="680" y2="181" stroke="#93c5fd"/>
    <line x1="500" y1="213" x2="680" y2="213" stroke="#93c5fd"/>
    <text x="485" y="202" fill="#1e40af" font-size="13" font-weight="900">m</text>
    <text x="590" y="142" fill="#0f766e" font-size="13" font-weight="900" text-anchor="middle">n</text>

    <rect x="436" y="275" width="320" height="95" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="596" y="305" fill="#0f766e" font-size="12" font-weight="800" text-anchor="middle">Área = Filas × Columnas</text>
    <text x="596" y="330" fill="#042f2e" font-size="13.5" font-weight="900" text-anchor="middle">Total de Celdas = m · n</text>
    <text x="596" y="352" fill="#475569" font-size="10.5" text-anchor="middle">Cada celda representa un único par (a, b).</text>
  </g>

</svg>
