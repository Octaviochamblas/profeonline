<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: Definición de Raíz Enésima</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Marco analítico de la radicación en el cuerpo real</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">SÍNTESIS DE LA RAÍZ ENÉSIMA</text>
        <text x="325" y="48" fill="#34d399" font-family="monospace" font-size="13" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√a = b   ⟺   b<tspan baseline-shift="super" font-size="70%">n</tspan> = a   |   Índice n ∈ N, n ≥ 2</text>
        <text x="325" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">La radicación busca la base de la potencia conociendo el resultado (radicando) y el exponente (índice).</text>
      </g>
      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Índice Par (n = 2, 4, 6...)</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Radicando a ≥ 0 (no negativo).</text>
        <text x="20" y="74" fill="#38bdf8" font-family="monospace" font-size="11">• Resultado b ≥ 0 (raíz principal).</text>
        <text x="20" y="96" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Raíces de negativos no son reales.</text>
      </g>
      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Índice Impar (n = 3, 5, 7...)</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Radicando a ∈ R sin restricciones.</text>
        <text x="20" y="74" fill="#fbbf24" font-family="monospace" font-size="11">• Signo(b) = Signo(a).</text>
        <text x="20" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Existe siempre en R.</text>
      </g>
    </g>

</svg>
