<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 16; }
      .header-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 30px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .header-sub { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 16px; fill: #64748b; text-anchor: middle; }
      .box-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; }
      .body-bold { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .body-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .formula { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #2563eb; }
      .banner { fill: #0f766e; rx: 12; }
      .banner-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="675" class="bg"/>

  <!-- Top Definition Banner -->
  <g transform="translate(60, 30)">
    <rect width="1080" height="90" rx="16" fill="#1e293b" filter="url(#shadow)"/>
    <text x="540" y="42" class="header-title" fill="#f8fafc">Cuadro Resumen: Proposiciones Matemáticas</text>
    <text x="540" y="70" class="header-sub" fill="#94a3b8">Enunciado declarativo p evaluado mediante la función de verdad v(p) ∈ {V, F}</text>
  </g>

  <!-- Left Card: Principios Lógicos -->
  <g transform="translate(60, 140)">
    <rect width="520" height="420" class="card" filter="url(#shadow)"/>

    <!-- Title -->
    <rect x="25" y="25" width="470" height="40" rx="8" fill="#eff6ff"/>
    <text x="260" y="50" class="box-title" fill="#1d4ed8" text-anchor: middle; dominant-baseline: central;>⚖️ 2 Principios Fundamentales</text>

    <!-- Principio 1 -->
    <g transform="translate(25, 85)">
      <rect width="470" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="30" class="body-bold" fill="#0f172a">1. Principio de No Contradicción</text>
      <text x="20" y="55" class="body-text">Una proposición no puede ser verdadera y falsa a la vez.</text>
      <rect x="20" y="70" width="430" height="35" rx="6" fill="#e2e8f0"/>
      <text x="235" y="93" class="formula" text-anchor="middle">v(p ∧ ¬p) = F   (siempre falso)</text>
    </g>

    <!-- Principio 2 -->
    <g transform="translate(25, 240)">
      <rect width="470" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="20" y="30" class="body-bold" fill="#0f172a">2. Principio del Tercero Excluido</text>
      <text x="20" y="55" class="body-text">Toda proposición es V o es F; no existe un tercer valor.</text>
      <rect x="20" y="70" width="430" height="35" rx="6" fill="#e2e8f0"/>
      <text x="235" y="93" class="formula" text-anchor="middle">v(p ∨ ¬p) = V   (tautología)</text>
    </g>
  </g>

  <!-- Right Card: Criterios de Identificación -->
  <g transform="translate(620, 140)">
    <rect width="520" height="420" class="card" filter="url(#shadow)"/>

    <!-- Title -->
    <rect x="25" y="25" width="470" height="40" rx="8" fill="#f0fdf4"/>
    <text x="260" y="50" class="box-title" fill="#15803d" text-anchor: middle; dominant-baseline: central;>📋 Lista de Verificación (Checklist)</text>

    <!-- Step 1 -->
    <g transform="translate(25, 85)">
      <circle cx="20" cy="20" r="14" fill="#22c55e"/>
      <text x="20" y="20" class="banner-text" font-size="14">1</text>
      <text x="45" y="18" class="body-bold">¿Es una oración declarativa?</text>
      <text x="45" y="38" class="body-text">Debe afirmar o negar un hecho (no pregunta, ni orden).</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(25, 160)">
      <circle cx="20" cy="20" r="14" fill="#22c55e"/>
      <text x="20" y="20" class="banner-text" font-size="14">2</text>
      <text x="45" y="18" class="body-bold">¿Carece de variables libres sin definir?</text>
      <text x="45" y="38" class="body-text">Expresiones como "x + 2 = 5" requieren especificar x.</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(25, 235)">
      <circle cx="20" cy="20" r="14" fill="#22c55e"/>
      <text x="20" y="20" class="banner-text" font-size="14">3</text>
      <text x="45" y="18" class="body-bold">¿Su valor de verdad es objetivo?</text>
      <text x="45" y="38" class="body-text">No debe depender de opiniones, gustos o perspectivas.</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(25, 310)">
      <circle cx="20" cy="20" r="14" fill="#3b82f6"/>
      <text x="20" y="20" class="banner-text" font-size="14">✓</text>
      <text x="45" y="18" class="body-bold" fill="#1d4ed8">Resultado:</text>
      <text x="45" y="38" class="body-text">Si cumple los 3 pasos, ¡es una Proposición Matemática!</text>
    </g>
  </g>

  <!-- Bottom Golden Rule Banner -->
  <g transform="translate(60, 580)">
    <rect width="1080" height="65" class="banner" filter="url(#shadow)"/>
    <text x="540" y="33" class="banner-text">💡 REGLA DE ORO: Que un enunciado sea FALSO no le quita su condición de proposición matemática válida.</text>
  </g>
</svg>
