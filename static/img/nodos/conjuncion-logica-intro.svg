<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="0.02em">Conjunción Lógica (p ∧ q) — Operador 'Y'</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="17" font-weight="800">Simultaneidad Estricta</text>
    <text x="44" y="138" fill="#475569" font-size="13">Solo es VERDADERA si AMBAS partes se cumplen.</text>

    <circle cx="155" cy="210" r="55" fill="#dbeafe" fill-opacity="0.6" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="235" cy="210" r="55" fill="#dbeafe" fill-opacity="0.6" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 195,168 A 55,55 0 0,1 195,252 A 55,55 0 0,1 195,168 Z" fill="#2563eb" fill-opacity="0.85"/>

    <text x="130" y="215" fill="#1e40af" font-size="16" font-weight="800">p</text>
    <text x="260" y="215" fill="#1e40af" font-size="16" font-weight="800">q</text>
    <text x="195" y="215" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">p ∧ q</text>

    <rect x="44" y="285" width="320" height="85" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="56" y="310" fill="#1e40af" font-size="13" font-weight="700">Equivalencia en lenguaje:</text>
    <text x="56" y="332" fill="#334155" font-size="12.5">• "p y q" / "p a la vez que q"</text>
    <text x="56" y="354" fill="#334155" font-size="12.5">• Partículas adversativas: "p pero q", "p sin embargo q"</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="17" font-weight="800">Tabla de Verdad Canónica</text>

    <rect x="440" y="140" width="85" height="35" fill="#0f172a" rx="5"/>
    <text x="482" y="163" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">p</text>
    <rect x="535" y="140" width="85" height="35" fill="#0f172a" rx="5"/>
    <text x="577" y="163" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">q</text>
    <rect x="630" y="140" width="115" height="35" fill="#1d4ed8" rx="5"/>
    <text x="687" y="163" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">p ∧ q</text>

    <rect x="440" y="180" width="305" height="36" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="482" y="204" fill="#059669" font-size="16" font-weight="800" text-anchor="middle">V</text>
    <text x="577" y="204" fill="#059669" font-size="16" font-weight="800" text-anchor="middle">V</text>
    <text x="687" y="204" fill="#059669" font-size="18" font-weight="900" text-anchor="middle">V  ✓ Único</text>

    <rect x="440" y="222" width="305" height="34" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="482" y="244" fill="#059669" font-size="15" font-weight="700" text-anchor="middle">V</text>
    <text x="577" y="244" fill="#dc2626" font-size="15" font-weight="700" text-anchor="middle">F</text>
    <text x="687" y="244" fill="#dc2626" font-size="16" font-weight="800" text-anchor="middle">F</text>

    <rect x="440" y="260" width="305" height="34" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="482" y="282" fill="#dc2626" font-size="15" font-weight="700" text-anchor="middle">F</text>
    <text x="577" y="282" fill="#059669" font-size="15" font-weight="700" text-anchor="middle">V</text>
    <text x="687" y="282" fill="#dc2626" font-size="16" font-weight="800" text-anchor="middle">F</text>

    <rect x="440" y="298" width="305" height="34" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="482" y="320" fill="#dc2626" font-size="15" font-weight="700" text-anchor="middle">F</text>
    <text x="577" y="320" fill="#dc2626" font-size="15" font-weight="700" text-anchor="middle">F</text>
    <text x="687" y="320" fill="#dc2626" font-size="16" font-weight="800" text-anchor="middle">F</text>

    <text x="592" y="360" fill="#0f766e" font-size="13" font-weight="700" text-anchor="middle">Propiedad: Un solo 'F' hace falsa a toda la conjunción.</text>
  </g>

</svg>
