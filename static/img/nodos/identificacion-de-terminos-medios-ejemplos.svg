<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Identificación central</text>
  <text x="35" y="85" class="text-step">En la proporción 2 : 7 = 6 : 21</text>
  <text x="35" y="115" class="text-step">Paso 1: Localizar los términos interiores</text>
  <text x="35" y="140" class="math">Medio 1 = 7, Medio 2 = 6</text>
  <text x="35" y="170" class="text-step">Paso 2: Calcular producto de medios</text>
  <text x="35" y="195" class="math">7 · 6 = 42</text>
  <text x="35" y="235" class="res">Medios = 7 y 6</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Medios iguales (continua)</text>
  <text x="365" y="85" class="text-step">En la proporción continua 4/x = x/9</text>
  <text x="365" y="115" class="text-step">Paso 1: Identificar ambos medios</text>
  <text x="365" y="140" class="math">Medio 1 = x, Medio 2 = x</text>
  <text x="365" y="170" class="text-step">Paso 2: Producto de medios</text>
  <text x="365" y="195" class="math">x · x = x²</text>
  <text x="365" y="235" class="res">Medios = x (media proporcional)</text>
</svg>
