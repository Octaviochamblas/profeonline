<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">CRITERIO POR 5</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Criterio de Divisibilidad por 5</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Un número es divisible por 5 si su última cifra (unidad) es 0 o 5</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="26" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ENUNCIADO DEL CRITERIO POR 5</text>
        <text x="325" y="50" fill="#059669" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">5 | n  ⟺  Última cifra d₀ ∈ {0, 5}</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Demostración Decimal</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Descomponiendo n = 10k + u:</text>
        <text x="20" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Como 10k = 5(2k) es SIEMPRE múltiplo de 5,</text>
        <text x="20" y="100" fill="#1d4ed8" font-family="monospace" font-size="12">n mod 5 = u mod 5</text>
        <text x="20" y="125" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 5 | n si y solo si 5 | u (u = 0 o u = 5)</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#059669" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Comprobación Visual Rápida</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• 4.879.620 ➔ Termina en 0 ⟹ SÍ</text>
        <text x="20" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• 831.575 ➔ Termina en 5 ⟹ SÍ</text>
        <text x="20" y="100" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• 62.483 ➔ Termina en 3 ⟹ NO (r = 3)</text>
        <text x="20" y="125" fill="#0284c7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Validación instantánea</text>
      </g>
    </g>

</svg>
