<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Síntesis: Inclusión de los Enteros en ℚ</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Reglas de conversión, denominador implícito y técnicas de homogeneización</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CONVERSIÓN DIRECTA: ENTERO A FRACCIÓN CON DENOMINADOR d</text>
        <text x="325" y="52" fill="#34d399" font-family="monospace" font-size="14" text-anchor="middle">z = (z · d) / d   (Ejemplo: 4 con denominador 7 ➔ 4 = 28/7)</text>
        <text x="325" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Esta propiedad permite sumar o restar enteros y fracciones sin necesidad de calcular MCM.</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Ventajas en el Cálculo</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Simplifica operaciones mixtas.</text>
        <text x="20" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Permite ubicar enteros en la recta racional.</text>
        <text x="20" y="96" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Cero es el racional neutro: 0 = 0/k.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Equivalencia Lógica</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">No hay diferencia numérica entre el</text>
        <text x="20" y="74" fill="#fbbf24" font-family="monospace" font-size="12">entero 5 y el racional 5/1.</text>
        <text x="20" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Son exactamente el mismo objeto matemático.</text>
      </g>
    </g>

</svg>
