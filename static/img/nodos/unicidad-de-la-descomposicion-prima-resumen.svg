<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="lightShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Síntesis: El Teorema Fundamental de la Aritmética</text>
    <text x="0" y="74" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Independencia del método: la descomposición prima es invariante y única</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#lightShadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">POSTULADO DE UNICIDAD FACTORIAL</text>
        <text x="325" y="52" fill="#0f172a" font-family="monospace" font-size="12" text-anchor="middle">n = ∏ p_i^{a_i} = ∏ q_j^{b_j}  ⟹  p_i = q_i,  a_i = b_i  (∀ i)</text>
        <text x="325" y="74" fill="#059669" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Los mismos números primos aparecen exactamente con los mismos exponentes en toda factorización.</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Consecuencias Directas</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• El MCD y MCM son únicos y exactos.</text>
        <text x="20" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• La cantidad de divisores es determinista.</text>
        <text x="20" y="96" fill="#059669" font-family="system-ui, sans-serif" font-size="11">Cualquier método válido conduce a la misma forma.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#d97706" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Libertad de Procedimiento</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Puedes usar árbol de factores o tabla.</text>
        <text x="20" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Puedes empezar dividiendo por 2, 3 ó 5.</text>
        <text x="20" y="96" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11">El resultado final siempre será idéntico.</text>
      </g>
    </g>

</svg>
