<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: División de Raíces</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Regla de cociente y simplificación fraccionaria vertical</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Top Banner -->
      <g transform="translate(25, 18)">
        <rect width="650" height="80" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">SÍNTESIS DE LA DIVISIÓN DE RAÍCES</text>

        <!-- Formula 1: ⁿ√a / ⁿ√b = ⁿ√(a / b) -->
        <g transform="translate(130, 52)">
          <text x="15" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√a</text>
          <line x1="0" y1="0" x2="30" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="15" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√b</text>

          <text x="45" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">=</text>

          <text x="80" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√(a / b)</text>
        </g>

        <!-- Divider line -->
        <line x1="325" y1="36" x2="325" y2="68" stroke="#334155" stroke-width="1.5"/>

        <!-- Formula 2: (p ⁿ√a) / (q ⁿ√b) = (p / q) ⁿ√(a / b) -->
        <g transform="translate(370, 52)">
          <text x="20" y="-6" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">p <tspan baseline-shift="super" font-size="70%">n</tspan>√a</text>
          <line x1="0" y1="0" x2="40" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="20" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">q <tspan baseline-shift="super" font-size="70%">n</tspan>√b</text>

          <text x="55" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">=</text>

          <!-- p / q -->
          <text x="75" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">p</text>
          <line x1="68" y1="0" x2="82" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="75" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">q</text>

          <text x="120" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√(a / b)</text>
        </g>
      </g>

      <!-- Bottom Box Left -->
      <g transform="translate(25, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Regla Mnemotécnica</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">"Mantén el índice, divide los radicandos"</text>
        <g transform="translate(60, 80)">
          <text x="12" y="-6" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√a</text>
          <line x1="0" y1="0" x2="24" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="12" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√b</text>

          <text x="38" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <text x="70" y="5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√(a / b)</text>
        </g>
        <text x="20" y="122" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Los índices NUNCA se dividen.</text>
      </g>

      <!-- Bottom Box Right -->
      <g transform="translate(365, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Condición de Existencia</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">El divisor jamás puede ser 0:</text>
        <text x="20" y="76" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">b ≠ 0  (y b &gt; 0 si n es par)</text>
        <text x="20" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Garantiza el valor real en ℝ.</text>
      </g>
    </g>

</svg>
