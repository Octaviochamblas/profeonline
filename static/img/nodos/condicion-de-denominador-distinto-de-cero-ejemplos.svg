<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Restricciones de Dominio y Denominador Nulo</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Detección de valores que indefinen expresiones racionales en la PAES</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cero Arriba vs Abajo</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#3b82f6"/>
        <text x="25" y="90" fill="#34d399" font-family="monospace" font-size="12">0 / 8 = 0  (Válido)</text>
        <text x="25" y="115" fill="#f87171" font-family="monospace" font-size="12">8 / 0 = Indefinido</text>
        <text x="25" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">8/0 NO es un número</text>

        <text x="20" y="180" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">Diferencia crítica</text>
        <text x="20" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">0 en numerador da 0.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Regla fundamental</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Expresión 5 / (x - 4)</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Condición de validez:</text>
        <text x="25" y="105" fill="#38bdf8" font-family="monospace" font-size="11.5">x - 4 ≠ 0  ➔  x ≠ 4</text>
        <text x="25" y="130" fill="#f87171" font-family="monospace" font-size="10.5">Si x = 4 ➔ 5/0 (Inval)</text>

        <text x="20" y="180" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">Dominio: ℝ excepto 4</text>
        <text x="20" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Se excluye el x = 4.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Restricción de dominio</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Expresión (2x)/(3x+6)</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Restricción inferior:</text>
        <text x="25" y="105" fill="#fbbf24" font-family="monospace" font-size="11">3x + 6 ≠ 0 ➔ 3x ≠ -6</text>
        <text x="25" y="130" fill="#fbbf24" font-family="monospace" font-size="11.5" font-weight="700">x ≠ -2</text>

        <text x="20" y="180" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">x ≠ -2 (Excluido)</text>
        <text x="20" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Para x = 0 es válido: 0/6=0.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Cero arriba no anula</text>
      </g>
    </g>

</svg>
