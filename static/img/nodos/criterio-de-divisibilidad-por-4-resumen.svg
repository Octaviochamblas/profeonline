<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Síntesis: Criterio de Divisibilidad por 4</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Tabla de terminaciones divisibles por 4 y regla de potencias de 2</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="26" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">RESUMEN DEL CRITERIO POR 4 (2²)</text>
        <text x="325" y="48" fill="#0f172a" font-family="monospace" font-size="9.5" text-anchor="middle">00, 04, 08, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60, 64, 68, 72, 76, 80, 84, 88, 92, 96</text>
        <text x="325" y="70" fill="#059669" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Si las dos últimas cifras están en esta lista, el número es divisible por 4.</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Familia de Potencias de 2</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Por 2 (2¹): mirar ÚLTIMA cifra.</text>
        <text x="20" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Por 4 (2²): mirar DOS últimas cifras.</text>
        <text x="20" y="96" fill="#059669" font-family="system-ui, sans-serif" font-size="11">• Por 8 (2³): mirar TRES últimas cifras.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#d97706" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cálculo Rápido: Mitad de la Mitad</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Un número es divisible por 4 si al</text>
        <text x="20" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="11">calcular su mitad, se obtiene otro número par:</text>
        <text x="20" y="96" fill="#0284c7" font-family="system-ui, sans-serif" font-size="11">Ejemplo: 132 ➔ mitad 66 (par) ⟹ 4 | 132.</text>
      </g>
    </g>

</svg>
