<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Doble Chequeo de Divisibilidad por 6</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Procedimiento en dos etapas para evaluar números compuestos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Evaluar 1.458</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">1. Par: u = 8 (✓)</text>
        <text x="25" y="108" fill="#1d4ed8" font-family="monospace" font-size="12">2. Suma: 1+4+5+8 = 18 (✓)</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Cumple ambas reglas:</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">es par y su suma es</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">múltiplo de 3.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Divisible por 6</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#ef4444"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Evaluar 7.341</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#ef4444"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">1. Paridad:</text>
        <text x="25" y="108" fill="#dc2626" font-family="monospace" font-size="13" font-weight="700">u = 1 (IMPAR)</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Falla el criterio del 2.</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Aunque su suma sea 15</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">(múlt. de 3), NO es par.</text>
        <text x="20" y="230" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="600">❌ NO divisible por 6</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Evaluar 8.512</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#f59e0b"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">1. Par: u = 2 (✓)</text>
        <text x="25" y="108" fill="#dc2626" font-family="monospace" font-size="12">2. Suma: 8+5+1+2=16 (✗)</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Es par pero su suma</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">16 no es múltiplo de 3.</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Falla el criterio del 3.</text>
        <text x="20" y="230" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="600">❌ NO divisible por 6</text>
      </g>
    </g>

</svg>
