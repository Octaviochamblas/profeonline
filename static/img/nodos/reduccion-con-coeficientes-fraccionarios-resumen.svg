<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 311" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="311" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="63.8" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="236.3" y="14" width="167.3" height="35.8"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 89.8)">
    <rect width="640" height="85.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">Para reducir términos con coeficientes fraccionarios, se calcula el</tspan>
      <tspan x="25" y="41">MCM de los denominadores, se amplifican los numeradores, se operan y</tspan>
      <tspan x="25" y="58">se simplifica la fracción final manteniendo el factor literal.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 184.8)">
    <rect width="640" height="107.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">❌ Sumar numeradores y denominadores en línea recta: a/b + c/d ≠</tspan>
      <tspan x="25" y="57">(a+c)/(b+d).</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="78">❌ Olvidar que un coeficiente entero k equivale a la fracción k/1.</tspan>
    </text>
  </g>
</svg>
