<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">RESTRICCIÓN</text>
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Restricción de Base Positiva: b > 0</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Las bases negativas o nulas generan indeterminación y números complejos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 18)">
        <rect width="650" height="75" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">CONDICIÓN DE BASE POSITIVA</text>
        <text x="325" y="54" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">En log<tspan baseline-shift="sub" font-size="70%">b</tspan>(a), la base DEBE cumplir estrictamente: b &gt; 0</text>
      </g>
      <g transform="translate(25, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">¿Por qué no b &lt; 0?</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Si la base fuera negativa, por ejemplo b = -2:</text>
        <text x="20" y="74" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700">(-2)<tspan baseline-shift="super" font-size="70%">1/2</tspan> = √(-2) ∉ ℝ</text>
        <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Las potencias fraccionarias caen fuera de los reales.</text>
        <text x="20" y="128" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✗ Discontinuidad total en ℝ</text>
      </g>
      <g transform="translate(365, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">¿Por qué no b = 0?</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Si la base fuera 0:</text>
        <text x="20" y="74" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700">0<tspan baseline-shift="super" font-size="70%">c</tspan> = 0  (si c &gt; 0)  o  0<tspan baseline-shift="super" font-size="70%">0</tspan> (indefinido)</text>
        <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Jamás podría generar argumentos positivos a ≠ 0.</text>
        <text x="20" y="128" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Por ende: b &gt; 0 siempre</text>
      </g>
    </g>

</svg>
