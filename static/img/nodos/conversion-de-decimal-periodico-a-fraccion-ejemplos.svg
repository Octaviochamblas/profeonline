<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Ejemplos: Decimal Periódico Puro a Fracción</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Cálculo paso a paso de fracciones generatrices con períodos de 1 y 2 dígitos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">0.<tspan style="text-decoration: overline">7</tspan></text>

        <rect x="15" y="65" width="190" height="75" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="88" fill="#38bdf8" font-family="monospace" font-size="11">Num: 7 - 0 = 7</text>
        <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="11">Denom: 1 nueve (9)</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">= 7/9 ✓</text>

        <text x="20" y="170" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">1 Cifra Periódica</text>
        <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Es irreductible.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 0.<tspan style="text-decoration: overline">7</tspan> = 7/9</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">0.<tspan style="text-decoration: overline">45</tspan></text>

        <rect x="15" y="65" width="190" height="75" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <text x="25" y="88" fill="#38bdf8" font-family="monospace" font-size="11">Num: 45 - 0 = 45</text>
        <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="11">Denom: 2 nueves (99)</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">45/99 (:9) = 5/11 ✓</text>

        <text x="20" y="170" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">2 Cifras Periódicas</text>
        <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Simplificar por 9.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 0.<tspan style="text-decoration: overline">45</tspan> = 5/11</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1.<tspan style="text-decoration: overline">36</tspan></text>

        <rect x="15" y="65" width="190" height="75" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="88" fill="#fbbf24" font-family="monospace" font-size="11">Num: 136 - 1 = 135</text>
        <text x="25" y="108" fill="#fbbf24" font-family="monospace" font-size="11">Denom: 99</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">135/99 (:9) = 15/11 ✓</text>

        <text x="20" y="170" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">Con Parte Entera</text>
        <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Se resta el 1 entero.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 1.<tspan style="text-decoration: overline">36</tspan> = 15/11</text>
      </g>
    </g>

</svg>
