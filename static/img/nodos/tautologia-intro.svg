<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Tautología — Verdad Lógica Universal</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-emerald)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Definición de Tautología</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Fórmula siempre verdadera bajo cualquier asignación.</text>

    <rect x="44" y="160" width="320" height="85" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="204" y="190" fill="#065f46" font-size="14" font-weight="800" text-anchor="middle">Vector Canónico Resultante:</text>
    <text x="204" y="225" fill="#059669" font-size="22" font-weight="900" text-anchor="middle">[V, V, ..., V]ᵀ (100% V)</text>

    <rect x="44" y="260" width="320" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="285" fill="#0f172a" font-size="13" font-weight="800">Propiedades de una Tautología:</text>
    <text x="56" y="308" fill="#475569" font-size="12">• Verdad puramente formal (no empírica).</text>
    <text x="56" y="328" fill="#475569" font-size="12">• Constituye una Ley Lógica o Teorema.</text>
    <text x="56" y="350" fill="#059669" font-size="12" font-weight="700">Validez garantizada en todo contexto.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Ejemplo Canónico: p ∨ ¬p</text>

    <rect x="446" y="145" width="90" height="35" fill="#0f172a" rx="5"/>
    <text x="491" y="168" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">p</text>
    <rect x="546" y="145" width="90" height="35" fill="#0f172a" rx="5"/>
    <text x="591" y="168" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">¬p</text>
    <rect x="646" y="145" width="105" height="35" fill="#059669" rx="5"/>
    <text x="698" y="168" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">p ∨ ¬p</text>

    <rect x="446" y="190" width="305" height="40" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="491" y="215" fill="#059669" font-size="16" font-weight="800" text-anchor="middle">V</text>
    <text x="591" y="215" fill="#dc2626" font-size="16" font-weight="800" text-anchor="middle">F</text>
    <text x="698" y="215" fill="#059669" font-size="18" font-weight="900" text-anchor="middle">V  ✓</text>

    <rect x="446" y="240" width="305" height="40" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="491" y="265" fill="#dc2626" font-size="16" font-weight="800" text-anchor="middle">F</text>
    <text x="591" y="265" fill="#059669" font-size="16" font-weight="800" text-anchor="middle">V</text>
    <text x="698" y="265" fill="#059669" font-size="18" font-weight="900" text-anchor="middle">V  ✓</text>

    <text x="592" y="325" fill="#065f46" font-size="13" font-weight="800" text-anchor="middle">Principio del Tercero Excluido</text>
    <text x="592" y="358" fill="#059669" font-size="11.5" font-weight="700" text-anchor="middle">Todas las filas son Verdaderas (100% V).</text>
  </g>

</svg>
