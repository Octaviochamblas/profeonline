<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">NÚMEROS PARES</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Definición Formal de Números Pares</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Enteros divisibles exactamente por 2: de la forma n = 2k con k ∈ ℤ</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="335" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="335" height="40" rx="12" fill="#1e293b" opacity="0.6"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Forma General Algebraica</text>

        <rect x="20" y="60" width="295" height="50" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="167" y="92" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">n = 2k ,  k ∈ ℤ</text>

        <text x="20" y="140" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Conjunto de los Pares (P):</text>
        <text x="20" y="165" fill="#94a3b8" font-family="monospace" font-size="12">P = {..., -4, -2, 0, 2, 4, 6, ...}</text>
        <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• El cero (0 = 2·0) es un número PAR.</text>
        <text x="20" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Existen infinitos pares negativos.</text>
        <text x="20" y="240" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Resto al dividir por 2 es siempre 0</text>
      </g>

      <g transform="translate(365, 0)">
        <rect width="335" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="335" height="40" rx="12" fill="#1e293b" opacity="0.6"/>
        <text x="20" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Propiedades de Clausura</text>

        <rect x="20" y="55" width="295" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="32" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Suma / Resta de Pares</text>
        <text x="32" y="100" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Par ± Par = Par  (2a ± 2b = 2(a ± b))</text>

        <rect x="20" y="125" width="295" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="32" y="148" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Multiplicación de Pares</text>
        <text x="32" y="170" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Par · Entero = Par  (2a · c = 2(ac))</text>

        <rect x="20" y="195" width="295" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="32" y="218" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Criterio de la Última Cifra</text>
        <text x="32" y="240" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">Terminan en 0, 2, 4, 6 u 8 en base 10.</text>
      </g>
    </g>

</svg>
