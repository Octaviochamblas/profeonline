<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #1e293b; }
      .title-text { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
      .subtitle-text { fill: #93c5fd; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .card-title { fill: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .card-desc { fill: #475569; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; line-height: 1.4; }
      .card-math { fill: #1e293b; font-family: 'Cambria Math', 'KaTeX_Main', serif; font-size: 15px; font-style: italic; font-weight: 600; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .step-num { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="370" rx="20" class="bg" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Dark Header Banner (High Contrast) -->
  <path d="M 0 20 Q 0 0 20 0 L 780 0 Q 800 0 800 20 L 800 72 L 0 72 Z" class="header-bg"/>
  <circle cx="36" cy="36" r="18" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="36" y="42" font-size="18" text-anchor="middle" fill="#60a5fa">📐</text>

  <text x="66" y="33" class="title-text">Matriz de Clasificación de Expresiones</text>
  <text x="66" y="53" class="subtitle-text">Paso a paso para distinguir proposiciones de enunciados no proposicionales</text>

  <!-- Body Content -->

    <g transform="translate(30, 92)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="740" height="68" rx="12" class="card-bg"/>
        <rect x="0" y="0" width="6" height="68" rx="3" fill="#ef4444"/>
        <text x="24" y="30" class="card-title">1. "¿El número 17 es primo?"</text>
        <text x="24" y="52" class="card-desc">Oración interrogativa que solicita información.</text>
        <rect x="520" y="18" width="200" height="32" rx="8" fill="#fef2f2" stroke="#fecaca"/>
        <text x="620" y="39" class="badge-text" fill="#b91c1c" text-anchor="middle">❌ NO ES PROPOSICIÓN</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 80)" filter="url(#shadow)">
        <rect width="740" height="68" rx="12" class="card-bg"/>
        <rect x="0" y="0" width="6" height="68" rx="3" fill="#f59e0b"/>
        <text x="24" y="30" class="card-title">2. "2x + 1 = 7"</text>
        <text x="24" y="52" class="card-desc">Enunciado abierto con variable libre x (su verdad depende del valor de x).</text>
        <rect x="520" y="18" width="200" height="32" rx="8" fill="#fffbeb" stroke="#fde68a"/>
        <text x="620" y="39" class="badge-text" fill="#b45309" text-anchor="middle">⚠️ ENUNCIADO ABIERTO</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 160)" filter="url(#shadow)">
        <rect width="740" height="68" rx="12" class="card-bg"/>
        <rect x="0" y="0" width="6" height="68" rx="3" fill="#10b981"/>
        <text x="24" y="30" class="card-title">3. "El número 17 es un número primo"</text>
        <text x="24" y="52" class="card-desc">Oración declarativa con valor de verdad objetivo (Verdadero, V).</text>
        <rect x="520" y="18" width="200" height="32" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
        <text x="620" y="39" class="badge-text" fill="#15803d" text-anchor="middle">✅ PROPOSICIÓN (V)</text>
      </g>
    </g>

</svg>
