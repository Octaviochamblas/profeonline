<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Costo vs Días y Personas</text>
  <text x="35" y="85" class="text-step">Incógnita: Costo total de alojamiento ($C$):</text>
  <text x="35" y="115" class="text-step">Paso 1: $C$ vs Días (manteniendo personas fijas)</text>
  <text x="35" y="140" class="math">A más días, más costo ⟹ DIRECTA</text>
  <text x="35" y="170" class="text-step">Paso 2: $C$ vs Personas (manteniendo días fijos)</text>
  <text x="35" y="195" class="math">A más personas, más costo ⟹ DIRECTA</text>
  <text x="35" y="235" class="res">Ambas razones entran directas</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Producción vs Máquinas</text>
  <text x="365" y="85" class="text-step">Incógnita: Unidades fabricadas ($U$):</text>
  <text x="365" y="115" class="text-step">Paso 1: $U$ vs Máquinas (a horas fijas)</text>
  <text x="365" y="140" class="math">Más máquinas producen más ⟹ DIRECTA</text>
  <text x="365" y="170" class="text-step">Paso 2: Razón correspondiente en la ecuación</text>
  <text x="365" y="195" class="math">Fracción directa: M₁ / M₂</text>
  <text x="365" y="235" class="res">Relación Directa confirmada</text>
</svg>
