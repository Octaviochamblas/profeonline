<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: Racionalización Cuadrática</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Resumen de fórmulas con fracciones verticales y denominador entero</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Top Banner -->
      <g transform="translate(25, 18)">
        <rect width="650" height="80" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">SÍNTESIS DE LA RACIONALIZACIÓN CUADRÁTICA</text>

        <!-- Formula 1: a/√b = a√b/b -->
        <g transform="translate(140, 52)">
          <text x="12" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">a</text>
          <line x1="0" y1="0" x2="24" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="12" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√b</text>

          <text x="38" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <text x="68" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">a√b</text>
          <line x1="52" y1="0" x2="84" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="68" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">b</text>
        </g>

        <!-- Divider line -->
        <line x1="325" y1="36" x2="325" y2="68" stroke="#334155" stroke-width="1.5"/>

        <!-- Formula 2: a/(k√b) = a√b/(k·b) -->
        <g transform="translate(380, 52)">
          <text x="15" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">a</text>
          <line x1="0" y1="0" x2="30" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="15" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">k√b</text>

          <text x="44" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <text x="80" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">a√b</text>
          <line x1="60" y1="0" x2="100" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="80" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">k · b</text>
        </g>
      </g>

      <!-- Bottom Box Left -->
      <g transform="translate(25, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Pasos Sistemáticos</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1. Multiplicar arriba y abajo por la raíz √b.</text>
        <text x="20" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2. En denominador: (√b)² = b (desaparece raíz).</text>
        <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">3. Simplificar coeficientes a y b.</text>
        <text x="20" y="122" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Equivalencia 100% garantizada</text>
      </g>

      <!-- Bottom Box Right -->
      <g transform="translate(365, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Caso Frecuente PAES</text>
        <g transform="translate(60, 68)">
          <text x="10" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text>
          <line x1="0" y1="0" x2="20" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="10" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√2</text>

          <text x="35" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <text x="65" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√2</text>
          <line x1="52" y1="0" x2="78" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="65" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text>
        </g>
        <text x="20" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Forma canónica obligatoria en respuestas.</text>
        <text x="20" y="124" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Nunca dejar raíces abajo</text>
      </g>
    </g>

</svg>
