<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: Racionalización Enésima</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Regla general del exponente complementario n - k</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Top Banner -->
      <g transform="translate(25, 18)">
        <rect width="650" height="80" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">SÍNTESIS DE LA RACIONALIZACIÓN ENÉSIMA</text>

        <!-- Formula -->
        <g transform="translate(195, 52)">
          <text x="18" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">a</text>
          <line x1="0" y1="0" x2="36" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="18" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√(b<tspan baseline-shift="super" font-size="70%">k</tspan>)</text>

          <text x="50" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">=</text>

          <text x="95" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">a · <tspan baseline-shift="super" font-size="70%">n</tspan>√(b<tspan baseline-shift="super" font-size="70%">n-k</tspan>)</text>
          <line x1="68" y1="0" x2="122" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="95" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">b</text>

          <text x="180" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">(con 1 ≤ k &lt; n)</text>
        </g>
      </g>

      <!-- Bottom Box Left -->
      <g transform="translate(25, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Algoritmo en 3 Pasos</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1. Expresar radicando como base prima b<tspan baseline-shift="super" font-size="70%">k</tspan>.</text>
        <text x="20" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2. Calcular exponente que falta: e = n - k.</text>
        <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">3. Amplificar por ⁿ√<tspan style="text-decoration: overline">bᵉ</tspan> / ⁿ√<tspan style="text-decoration: overline">bᵉ</tspan>.</text>
        <text x="20" y="122" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Denominador queda b entero</text>
      </g>

      <!-- Bottom Box Right -->
      <g transform="translate(365, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Comprobación de Potencia</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Suma de exponentes en el producto:</text>
        <text x="20" y="76" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700"><tspan baseline-shift="super" font-size="70%">n</tspan>√(b<tspan baseline-shift="super" font-size="70%">k</tspan>) · <tspan baseline-shift="super" font-size="70%">n</tspan>√(b<tspan baseline-shift="super" font-size="70%">n-k</tspan>) = <tspan baseline-shift="super" font-size="70%">n</tspan>√(b<tspan baseline-shift="super" font-size="70%">n</tspan>) = b</text>
        <text x="20" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">La raíz se elimina exactamente.</text>
      </g>
    </g>

</svg>
