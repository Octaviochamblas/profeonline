<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Etapa 1: Variar solo Obreros</text>
  <text x="35" y="85" class="text-step">3 obreros hacen 120 m en 8 días. ¿5 obreros 200 m?</text>
  <text x="35" y="115" class="text-step">Paso 1: Mantener fijos los 120 m</text>
  <text x="35" y="140" class="math">3 obreros = 8 días ⟹ 5 obreros = y' días</text>
  <text x="35" y="170" class="text-step">Paso 2: Proporción inversa de obreros</text>
  <text x="35" y="195" class="math">y' = (3 · 8) / 5 = 4,8 días</text>
  <text x="35" y="235" class="res">Valor intermedio: y' = 4,8 días</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Etapa 2: Variar la Obra a 200 m</text>
  <text x="365" y="85" class="text-step">Ahora con 5 obreros fijos: 120 m en 4,8 días</text>
  <text x="365" y="115" class="text-step">Paso 1: Proporción directa de obra</text>
  <text x="365" y="140" class="math">120 m / 4,8 días = 200 m / x días</text>
  <text x="365" y="170" class="text-step">Paso 2: Despejar x en cruz</text>
  <text x="365" y="195" class="math">x = (4,8 · 200) / 120 = 8 días</text>
  <text x="365" y="235" class="res">Resultado final: x = 8 días</text>
</svg>
