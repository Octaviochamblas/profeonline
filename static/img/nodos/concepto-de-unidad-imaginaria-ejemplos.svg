<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Ecuación cuadrática</text>
  <text x="35" y="85" class="text-step">Resolver en ℂ: x<tspan baseline-shift="super" font-size="70%">2</tspan> + 9 = 0</text>
  <text x="35" y="115" class="text-step">Paso 1: Despejar x<tspan baseline-shift="super" font-size="70%">2</tspan></text>
  <text x="35" y="140" class="math">x<tspan baseline-shift="super" font-size="70%">2</tspan> = −9</text>
  <text x="35" y="170" class="text-step">Paso 2: Aplicar raíz cuadrada con i</text>
  <g>
    <text x="35" y="197" class="math">x = ±</text>
    <path d="M 68,192 L 72,192 L 76,200 L 82,182 L 95,182" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="85" y="197" class="math">9</text>
    <text x="100" y="197" class="math">·</text>
    <path d="M 110,192 L 114,192 L 118,200 L 124,182 L 142,182" fill="none" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="127" y="197" class="math">−1</text>
    <text x="148" y="197" class="math">= ±3i</text>
  </g>
  <text x="35" y="235" class="res">Soluciones: x = 3i, x = −3i</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Expresar en forma bi</text>
  <text x="365" y="85" class="text-step">Identificar coeficiente imaginario en: −7i</text>
  <text x="365" y="115" class="text-step">Paso 1: Comparar con forma z = b · i</text>
  <text x="365" y="140" class="math">b = −7 ∈ ℝ</text>
  <text x="365" y="170" class="text-step">Paso 2: Clasificar naturaleza numérica</text>
  <text x="365" y="195" class="math">Es un imaginario puro</text>
  <text x="365" y="235" class="res">Coeficiente b = −7</text>
</svg>
