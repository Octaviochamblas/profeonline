<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 308" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="308" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="58.0" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="191.9" y="14" width="256.3" height="22.3"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 84.0)">
    <rect width="640" height="102.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">El cubo de la suma de dos cantidades es igual al cubo de la primera,</tspan>
      <tspan x="25" y="41">más el triple del cuadrado de la primera por la segunda, más el</tspan>
      <tspan x="25" y="58">triple de la primera por el cuadrado de la segunda, más el cubo de</tspan>
      <tspan x="25" y="75">la segunda.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 196.0)">
    <rect width="640" height="92.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Omitir los términos intermedios escribiendo (a + b)³ = a³ + b³.</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="63">Olvidar multiplicar por 3 los términos centrales.</tspan>
    </text>
  </g>
</svg>
