<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="lightShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Extracción de Factores Primos</text>
    <text x="0" y="74" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Diferenciación entre el conjunto total de divisores y los factores primos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Para n = 20</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="25" y="88" fill="#475569" font-family="system-ui, sans-serif" font-size="11">D(20) = {1, 2, 4, 5, 10, 20}</text>
        <text x="25" y="108" fill="#059669" font-family="monospace" font-size="12" font-weight="700">Primos: {2, 5}</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">1, 4, 10 y 20 no son</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">primos. Los únicos</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">factores primos son 2 y 5.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Factores primos: 2 y 5</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#059669"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Para n = 30</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#059669"/>
        <text x="25" y="88" fill="#475569" font-family="system-ui, sans-serif" font-size="11">D(30) = {1, 2, 3, 5, 6, 10, 15, 30}</text>
        <text x="25" y="108" fill="#059669" font-family="monospace" font-size="12" font-weight="700">Primos: {2, 3, 5}</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">30 es producto de</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">3 primos distintos:</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">30 = 2 · 3 · 5.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Factores primos: 2, 3, 5</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#d97706"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Para n = 27</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#d97706"/>
        <text x="25" y="88" fill="#475569" font-family="system-ui, sans-serif" font-size="11">D(27) = {1, 3, 9, 27}</text>
        <text x="25" y="108" fill="#d97706" font-family="monospace" font-size="12" font-weight="700">Primos: {3}</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">27 = 3³. Aunque tiene</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">4 divisores, solo tiene</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">UN único factor primo.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Factor primo único: 3</text>
      </g>
    </g>

</svg>
