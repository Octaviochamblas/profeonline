<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">ESTRUCTURA NORMALIZADA</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Concepto de Notación Científica</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Estructura formal normalizada: k · 10ⁿ con 1 ≤ |k| &lt; 10 y n ∈ Z</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FORMATO ESTÁNDAR DE NOTACIÓN CIENTÍFICA</text>
        <text x="325" y="50" fill="#34d399" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">k · 10<tspan baseline-shift="super" font-size="70%">n</tspan>   donde   1 ≤ |k| &lt; 10   y   n ∈ Z</text>
      </g>
      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Mantisa o Coeficiente (k)</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Debe tener una sola cifra entera no nula:</text>
        <text x="20" y="78" fill="#34d399" font-family="monospace" font-size="12">✓ 3,45 · 10<tspan baseline-shift="super" font-size="70%">6</tspan>   (3 está entre 1 y 10)</text>
        <text x="20" y="102" fill="#fbbf24" font-family="monospace" font-size="12">✗ 34,5 · 10<tspan baseline-shift="super" font-size="70%">5</tspan>   (34,5 ≥ 10 NO normalizado)</text>
        <text x="20" y="125" fill="#fbbf24" font-family="monospace" font-size="12">✗ 0,345 · 10<tspan baseline-shift="super" font-size="70%">7</tspan>  (0,345 &lt; 1 NO normalizado)</text>
      </g>
      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Orden de Magnitud (10ⁿ)</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">El exponente entero n indica el tamaño:</text>
        <text x="20" y="78" fill="#38bdf8" font-family="monospace" font-size="12">• n &gt; 0: Números grandes (|x| ≥ 10)</text>
        <text x="20" y="102" fill="#fbbf24" font-family="monospace" font-size="12">• n &lt; 0: Números pequeños (0 &lt; |x| &lt; 1)</text>
        <text x="20" y="125" fill="#34d399" font-family="monospace" font-size="12">• n = 0: Números entre 1 y 10 (10<tspan baseline-shift="super" font-size="70%">0</tspan> = 1)</text>
      </g>
    </g>

</svg>
