<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Construcción de Tabla con 2 Variables</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="752" height="310" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="24" y="80" width="752" height="6" fill="url(#grad-blue)" rx="3"/>

    <text x="44" y="115" fill="#0f172a" font-size="17" font-weight="800">Algoritmo Metodológico de Construcción en 3 Fases</text>

    <!-- Step 1 -->
    <rect x="44" y="135" width="712" height="45" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="54" y="143" width="28" height="28" rx="14" fill="#1d4ed8"/>
    <text x="68" y="162" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">1</text>
    <text x="96" y="163" fill="#1e40af" font-size="14" font-weight="800">Columnas Base:</text>
    <text x="235" y="163" fill="#334155" font-size="12.5">Variables p (VVFF) y q (VFVF) en 4 filas.</text>
    <text x="735" y="163" fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="end">4 CASOS BASE</text>

    <!-- Step 2 -->
    <rect x="44" y="190" width="712" height="45" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="54" y="198" width="28" height="28" rx="14" fill="#0f766e"/>
    <text x="68" y="217" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">2</text>
    <text x="96" y="218" fill="#0f766e" font-size="14" font-weight="800">Subexpresiones:</text>
    <text x="240" y="218" fill="#334155" font-size="12.5">Calcular negaciones (¬p) y bloques (p ∧ q).</text>
    <text x="735" y="218" fill="#0f766e" font-size="12" font-weight="700" text-anchor="end">INTERMEDIOS</text>

    <!-- Step 3 -->
    <rect x="44" y="245" width="712" height="45" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="54" y="253" width="28" height="28" rx="14" fill="#7e22ce"/>
    <text x="68" y="272" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">3</text>
    <text x="96" y="273" fill="#7e22ce" font-size="14" font-weight="800">Conector Principal:</text>
    <text x="260" y="273" fill="#334155" font-size="12.5">Operar la columna dominante final.</text>
    <text x="735" y="273" fill="#7e22ce" font-size="12" font-weight="700" text-anchor="end">VECTOR FINAL</text>

    <text x="400" y="340" fill="#0f766e" font-size="13" font-weight="700" text-anchor="middle">El vector final determina si la proposición es Tautología, Contradicción o Contingencia.</text>
  </g>

</svg>
