<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Método Sistemático de Pares de Divisores</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Búsqueda completa y ordenada de todos los factores de números naturales</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Divisores de 28</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">√<tspan style="text-decoration: overline">28</tspan> ≈ 5.29:</text>
        <text x="25" y="108" fill="#1d4ed8" font-family="monospace" font-size="13" font-weight="700">Probar d ≤ 5</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">1 · 28 = 28</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">2 · 14 = 28</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">4 · 7 = 28 (3, 5 fallan)</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ {1, 2, 4, 7, 14, 28}</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Divisores de 45</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#10b981"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">√<tspan style="text-decoration: overline">45</tspan> ≈ 6.7:</text>
        <text x="25" y="108" fill="#059669" font-family="monospace" font-size="13" font-weight="700">Probar d ≤ 6</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">1 · 45 = 45</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">3 · 15 = 45</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">5 · 9 = 45 (2, 4, 6 fallan)</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ {1, 3, 5, 9, 15, 45}</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cuadrado Perfecto</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#f59e0b"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">D(25) con √<tspan style="text-decoration: overline">25</tspan> = 5:</text>
        <text x="25" y="108" fill="#d97706" font-family="monospace" font-size="13" font-weight="700">1·25=25, 5·5=25</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">D(25) = {1, 5, 25}</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Los cuadrados perfectos</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">tienen número IMPAR de divisores.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 3 divisores (impar)</text>
      </g>
    </g>

</svg>
