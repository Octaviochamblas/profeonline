<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Diagrama de Venn de 3 Conjuntos</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">DIAGRAMAS VENN</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-indigo)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Estructura Canónica: 8 Regiones</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Tres círculos secantes dividen al universo en 8 regiones disjuntas.</text>

    <!-- Visual Box -->
    <rect x="44" y="165" width="320" height="65" rx="10" fill="#faf5ff" stroke="#a855f7"/>
    <text x="204" y="208" fill="#7e22ce" font-size="20" font-weight="900" text-anchor="middle">8 Regiones Átomicas (2³)</text>

    <rect x="44" y="245" width="320" height="125" rx="10" fill="#f1f5f9"/>
    <text x="56" y="272" fill="#334155" font-size="12.5" font-weight="700">Desglose de las 8 Regiones:</text>
    <text x="56" y="295" fill="#475569" font-size="12">• 3 de un solo conjunto (A, B, C).</text>
    <text x="56" y="317" fill="#475569" font-size="12">• 3 de exactamente dos (AB, AC, BC).</text>
    <text x="56" y="342" fill="#7e22ce" font-size="12" font-weight="700">1 central (A ∩ B ∩ C)  y  1 exterior.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Diagrama Simétrico Canónico</text>

    <!-- Venn box 3 circles -->
    <rect x="446" y="140" width="300" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="460" y="162" fill="#64748b" font-size="12" font-weight="900">U</text>

    <circle cx="570" cy="185" r="35" fill="#3b82f6" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="620" cy="185" r="35" fill="#10b981" fill-opacity="0.2" stroke="#059669" stroke-width="1.5"/>
    <circle cx="595" cy="225" r="35" fill="#f59e0b" fill-opacity="0.2" stroke="#d97706" stroke-width="1.5"/>

    <text x="550" y="175" fill="#1e40af" font-size="11" font-weight="900">A</text>
    <text x="640" y="175" fill="#065f46" font-size="11" font-weight="900">B</text>
    <text x="595" y="250" fill="#92400e" font-size="11" font-weight="900" text-anchor="middle">C</text>
    <text x="595" y="200" fill="#0f172a" font-size="9" font-weight="900" text-anchor="middle">ABC</text>

    <rect x="436" y="275" width="320" height="95" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="596" y="305" fill="#0f766e" font-size="12" font-weight="800" text-anchor="middle">Principio de Inclusión-Exclusión (3)</text>
    <text x="596" y="328" fill="#042f2e" font-size="11" font-weight="900" text-anchor="middle">|A∪B∪C| = ∑|A| - ∑|A∩B| + |A∩B∩C|</text>
    <text x="596" y="352" fill="#475569" font-size="11" text-anchor="middle">Sumar individuales, restar dobles, sumar triple.</text>
  </g>

</svg>
