<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #1e293b; }
      .title-text { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
      .subtitle-text { fill: #93c5fd; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .card-title { fill: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .card-desc { fill: #475569; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; line-height: 1.4; }
      .card-math { fill: #1e293b; font-family: 'Cambria Math', 'KaTeX_Main', serif; font-size: 15px; font-style: italic; font-weight: 600; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .step-num { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="360" rx="20" class="bg" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Dark Header Banner (High Contrast) -->
  <path d="M 0 20 Q 0 0 20 0 L 780 0 Q 800 0 800 20 L 800 72 L 0 72 Z" class="header-bg"/>
  <circle cx="36" cy="36" r="18" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="36" y="42" font-size="18" text-anchor="middle" fill="#60a5fa">📐</text>

  <text x="66" y="33" class="title-text">La Variable Proposicional</text>
  <text x="66" y="53" class="subtitle-text">Símbolos abstractos que representan proposiciones atómicas completas</text>

  <!-- Body Content -->

    <g transform="translate(30, 92)">
      <!-- Left Card: Abstracción -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="355" height="235" rx="14" class="card-bg"/>
        <path d="M 0 14 Q 0 0 14 0 L 341 0 Q 355 0 355 14 L 355 38 L 0 38 Z" fill="#eff6ff"/>
        <text x="16" y="24" class="card-title" fill="#1e40af">¿Qué representa una variable?</text>

        <text x="16" y="68" class="card-desc">Una letra como <tspan font-weight="700">p, q, r, s</tspan> reemplaza a toda</text>
        <text x="16" y="88" class="card-desc">una afirmación del lenguaje natural.</text>
        <text x="16" y="118" class="card-desc">Su valor NO es un número, sino un valor de verdad:</text>

        <rect x="16" y="140" width="323" height="65" rx="8" fill="#f8fafc" stroke="#bfdbfe"/>
        <text x="177" y="179" font-family="'Cambria Math', serif" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">p ∈ { Verdadero , Falso }</text>
      </g>

      <!-- Right Card: Convenciones -->
      <g transform="translate(385, 0)" filter="url(#shadow)">
        <rect width="355" height="235" rx="14" class="card-bg"/>
        <path d="M 0 14 Q 0 0 14 0 L 341 0 Q 355 0 355 14 L 355 38 L 0 38 Z" fill="#f0fdf4"/>
        <text x="16" y="24" class="card-title" fill="#166534">Convenciones de Uso</text>

        <g transform="translate(16, 56)">
          <rect width="24" height="24" rx="6" fill="#dcfce7"/>
          <text x="12" y="17" font-size="13" font-weight="800" fill="#15803d" text-anchor="middle">p</text>
          <text x="36" y="17" class="card-desc" font-weight="600">Primera proposición del problema.</text>
        </g>

        <g transform="translate(16, 96)">
          <rect width="24" height="24" rx="6" fill="#dcfce7"/>
          <text x="12" y="17" font-size="13" font-weight="800" fill="#15803d" text-anchor="middle">q</text>
          <text x="36" y="17" class="card-desc" font-weight="600">Segunda proposición del problema.</text>
        </g>

        <g transform="translate(16, 136)">
          <rect width="24" height="24" rx="6" fill="#dcfce7"/>
          <text x="12" y="17" font-size="13" font-weight="800" fill="#15803d" text-anchor="middle">r</text>
          <text x="36" y="17" class="card-desc" font-weight="600">Tercera proposición del problema.</text>
        </g>

        <g transform="translate(16, 176)">
          <rect width="24" height="24" rx="6" fill="#dcfce7"/>
          <text x="12" y="17" font-size="13" font-weight="800" fill="#15803d" text-anchor="middle">s</text>
          <text x="36" y="17" class="card-desc" font-weight="600">Cuarta proposición del problema.</text>
        </g>
      </g>
    </g>

</svg>
