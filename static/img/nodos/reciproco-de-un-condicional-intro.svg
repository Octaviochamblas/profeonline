<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Recíproco de un Condicional (q → p)</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-amber)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Intercambio de Roles</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">El antecedente pasa a ser consecuente y viceversa.</text>

    <!-- Switch visual -->
    <rect x="44" y="165" width="138" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="113" y="193" fill="#1e40af" font-size="11.5" font-weight="700" text-anchor="middle">Directo: p → q</text>
    <text x="113" y="218" fill="#1d4ed8" font-size="16" font-weight="800" text-anchor="middle">p → q</text>

    <text x="204" y="208" fill="#64748b" font-size="20" font-weight="900" text-anchor="middle">⇄</text>

    <rect x="226" y="165" width="138" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="295" y="193" fill="#92400e" font-size="11.5" font-weight="700" text-anchor="middle">Recíproco: q → p</text>
    <text x="295" y="218" fill="#b45309" font-size="16" font-weight="800" text-anchor="middle">q → p</text>

    <rect x="44" y="255" width="320" height="115" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="56" y="280" fill="#991b1b" font-size="12.5" font-weight="800">¡Alerta de Falacia Lógica!</text>
    <text x="56" y="304" fill="#7f1d1d" font-size="12">• p → q y q → p NO son equivalentes (≢).</text>
    <text x="56" y="326" fill="#7f1d1d" font-size="12">• Que p implique q no significa que q implique p.</text>
    <text x="56" y="350" fill="#b91c1c" font-size="12" font-weight="700">Falacia de afirmación del consecuente.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Comparación de Tablas</text>

    <rect x="440" y="145" width="70" height="35" fill="#0f172a" rx="4"/>
    <text x="475" y="168" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">p, q</text>

    <rect x="520" y="145" width="110" height="35" fill="#1d4ed8" rx="4"/>
    <text x="575" y="168" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">Directo: p→q</text>

    <rect x="640" y="145" width="115" height="35" fill="#b45309" rx="4"/>
    <text x="697" y="168" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">Recíproco: q→p</text>

    <rect x="440" y="190" width="315" height="30" fill="#f8fafc" stroke="#e2e8f0" rx="3"/>
    <text x="475" y="210" fill="#334155" font-size="13" text-anchor="middle">V, V</text>
    <text x="575" y="210" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V</text>
    <text x="697" y="210" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V</text>

    <rect x="440" y="224" width="315" height="30" fill="#fef2f2" stroke="#fecaca" rx="3"/>
    <text x="475" y="244" fill="#334155" font-size="13" text-anchor="middle">V, F</text>
    <text x="575" y="244" fill="#dc2626" font-size="14" font-weight="900" text-anchor="middle">F ✗</text>
    <text x="697" y="244" fill="#059669" font-size="14" font-weight="900" text-anchor="middle">V ✓ (F→V)</text>

    <rect x="440" y="258" width="315" height="30" fill="#fef2f2" stroke="#fecaca" rx="3"/>
    <text x="475" y="278" fill="#334155" font-size="13" text-anchor="middle">F, V</text>
    <text x="575" y="278" fill="#059669" font-size="14" font-weight="900" text-anchor="middle">V ✓ (F→V)</text>
    <text x="697" y="278" fill="#dc2626" font-size="14" font-weight="900" text-anchor="middle">F ✗</text>

    <rect x="440" y="292" width="315" height="30" fill="#f8fafc" stroke="#e2e8f0" rx="3"/>
    <text x="475" y="312" fill="#334155" font-size="13" text-anchor="middle">F, F</text>
    <text x="575" y="312" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V</text>
    <text x="697" y="312" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">V</text>

    <text x="596" y="358" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">[V, F, V, V]ᵀ ≠ [V, V, F, V]ᵀ (Distintos)</text>
  </g>

</svg>
