<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">DIVISIÓN EXACTA</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Divisibilidad como División Exacta</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Un número es divisible por otro si y solo si el resto de la división es CERO</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="26" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TEOREMA DEL ALGORITMO DE LA DIVISIÓN</text>
        <text x="325" y="50" fill="#059669" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">D = d · c + r   con   0 ≤ r &lt; d.   Es exacta ⟺ r = 0</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#059669" font-family="system-ui, sans-serif" font-size="13" font-weight="700">División Exacta (r = 0)</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• 72 ÷ 9 = 8 (resto 0)</text>
        <text x="20" y="78" fill="#059669" font-family="monospace" font-size="13">72 = 9 · 8 + 0</text>
        <text x="20" y="105" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 72 es divisible por 9</text>
        <text x="20" y="125" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Cociente 8 ∈ ℕ exacto.</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#dc2626" font-family="system-ui, sans-serif" font-size="13" font-weight="700">División Inexacta (r &gt; 0)</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• 75 ÷ 9 = 8 (resto 3)</text>
        <text x="20" y="78" fill="#dc2626" font-family="monospace" font-size="13">75 = 9 · 8 + 3</text>
        <text x="20" y="105" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="600">❌ 75 NO es divisible por 9</text>
        <text x="20" y="125" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Quedan 3 unidades sobrantes.</text>
      </g>
    </g>

</svg>
