<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Conmutación en Productos de Enteros</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Reorganización de factores para cálculo mental rápido y simplificación</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Verificar: (-9)·(-4)</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Ambos sentidos:</text>
        <text x="25" y="108" fill="#34d399" font-family="monospace" font-size="12">(-9)·(-4) = (-4)·(-9) = 36</text>

        <text x="20" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">La regla de signos</text>
        <text x="20" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">se mantiene idéntica</text>
        <text x="20" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">en ambos órdenes.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Conmutatividad válida</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Formar Ceros</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <text x="25" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">(-5) · 17 · (-2):</text>
        <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="12">[(-5) · (-2)] · 17</text>

        <text x="20" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Conmutar para juntar</text>
        <text x="20" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">el -5 con el -2:</text>
        <text x="20" y="195" fill="#34d399" font-family="monospace" font-size="12">10 · 17 = 170</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Mucho más fácil</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Producto con Cero</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">(-14) · 0:</text>
        <text x="25" y="108" fill="#fbbf24" font-family="monospace" font-size="12">(-14) · 0 = 0 · (-14) = 0</text>

        <text x="20" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">La conmutatividad se</text>
        <text x="20" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">cumple perfectamente</text>
        <text x="20" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">incluso con el cero.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Resultado = 0</text>
      </g>
    </g>

</svg>
