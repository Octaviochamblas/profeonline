<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Reparto inverso a 2, 3 y 4</text>
  <text x="35" y="85" class="text-step">Repartir $260.000 inversamente a 2, 3 y 4:</text>
  <text x="35" y="115" class="text-step">Paso 1: Invertir a 1/2, 1/3, 1/4. MCM = 12</text>
  <text x="35" y="140" class="math">12·(1/2)=6, 12·(1/3)=4, 12·(1/4)=3 (suma=13)</text>
  <text x="35" y="170" class="text-step">Paso 2: k = 260.000 / 13 = $20.000</text>
  <text x="35" y="195" class="math">6k = $120.000, 4k = $80.000, 3k = $60.000</text>
  <text x="35" y="235" class="res">Partes: $120k, $80k y $60k</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Premio inverso a faltas</text>
  <text x="365" y="85" class="text-step">Repartir bono de $90.000 con 1 y 2 faltas:</text>
  <text x="365" y="115" class="text-step">Paso 1: Invertir índices ⟹ 1/1 y 1/2 (MCM = 2)</text>
  <text x="365" y="140" class="math">2·(1) = 2, 2·(1/2) = 1 (Suma = 3)</text>
  <text x="365" y="170" class="text-step">Paso 2: k = 90.000 / 3 = $30.000</text>
  <text x="365" y="195" class="math">1 falta (2k) = $60.000 | 2 faltas (1k) = $30.000</text>
  <text x="365" y="235" class="res">Menos faltas ⟹ Mayor bono</text>
</svg>
