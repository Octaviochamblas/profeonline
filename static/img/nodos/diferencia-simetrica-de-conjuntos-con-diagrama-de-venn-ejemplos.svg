<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Ejemplos Guiados — Diferencia Simétrica</text>
  <rect x="640" y="16" width="136" height="28" rx="14" fill="#1e293b"/>
  <text x="708" y="35" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">OPERACIONES CONJUNTOS</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-amber)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Cálculo con Dos Fórmulas</text>

    <rect x="44" y="135" width="320" height="45" rx="8" fill="#f1f5f9"/>
    <text x="56" y="163" fill="#0f172a" font-size="12">A = {1, 2, 3, 4}  y  B = {3, 4, 5, 6}</text>

    <rect x="44" y="190" width="320" height="55" rx="8" fill="#fef3c7" stroke="#fde68a"/>
    <text x="56" y="212" fill="#92400e" font-size="11.5" font-weight="700">Fórmula 1 (Alas)  y  Fórmula 2 (Resta):</text>
    <text x="56" y="233" fill="#b45309" font-size="12.5" font-weight="800">{1, 2} ∪ {5, 6}  =  {1, 2, 3, 4, 5, 6} \ {3, 4}</text>

    <rect x="44" y="255" width="320" height="65" rx="10" fill="#f59e0b"/>
    <text x="204" y="280" fill="#fef3c7" font-size="12" text-anchor="middle">Resultado Idéntico:</text>
    <text x="204" y="306" fill="#ffffff" font-size="15" font-weight="900" text-anchor="middle">A △ B = {1, 2, 5, 6}  (|A △ B| = 4)</text>
    <text x="204" y="350" fill="#475569" font-size="11.5" text-anchor="middle">Ambas fórmulas conducen exactamente al mismo conjunto.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-indigo)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">Neutro e Inverso</text>

    <rect x="436" y="135" width="320" height="45" rx="8" fill="#f1f5f9"/>
    <text x="448" y="163" fill="#0f172a" font-size="12">Propiedades Algebraicas Clave</text>

    <rect x="436" y="190" width="320" height="55" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="448" y="212" fill="#7e22ce" font-size="11.5" font-weight="700">1. Inverso consigo mismo:</text>
    <text x="448" y="233" fill="#6b21a8" font-size="13" font-weight="800">A △ A = (A \ A) ∪ (A \ A) = ∅</text>

    <rect x="436" y="255" width="320" height="65" rx="10" fill="#6366f1"/>
    <text x="596" y="280" fill="#e0e7ff" font-size="12" text-anchor="middle">2. Elemento Neutro:</text>
    <text x="596" y="306" fill="#ffffff" font-size="15" font-weight="900" text-anchor="middle">A △ ∅ = A</text>
    <text x="596" y="350" fill="#475569" font-size="11" text-anchor="middle">Cada conjunto es su propio inverso algebraico.</text>
  </g>

</svg>
