<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="82" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Ejemplos: Identificación de Decimales Finitos</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Análisis de factores en el denominador y conversiones directas</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Fracción: 7/20</text>

        <rect x="15" y="65" width="190" height="75" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="88" fill="#38bdf8" font-family="monospace" font-size="11">20 = 2² · 5¹</text>
        <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="11">7 : 20 = 0.35</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">Resto: 0 (Finito) ✓</text>

        <text x="20" y="170" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">Decimal Finito ✓</text>
        <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Factores primos solo 2 y 5.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 2 cifras decimales</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Fracción: 9/24</text>

        <rect x="15" y="65" width="190" height="75" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <text x="25" y="88" fill="#38bdf8" font-family="monospace" font-size="11">9/24 = 3/8 (irreducible)</text>
        <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="11">8 = 2³  ➔  3:8 = 0.375</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">3/8 = 0.375 ✓</text>

        <text x="20" y="170" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">¡Simplificar primero!</text>
        <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">El 3 de 24=3·8 se cancela.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Resulta decimal finito</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#ef4444"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Contraejemplo: 5/6</text>

        <rect x="15" y="65" width="190" height="75" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="88" fill="#fbbf24" font-family="monospace" font-size="11">6 = 2 · 3 (aparece el 3)</text>
        <text x="25" y="108" fill="#fbbf24" font-family="monospace" font-size="11">5 : 6 = 0.8333...</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">= 0.8<tspan style="text-decoration: overline">3</tspan> (Infinito)</text>

        <text x="20" y="170" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">NO es finito</text>
        <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Factor 3 genera período.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Semi-periódico</text>
      </g>
    </g>

</svg>
