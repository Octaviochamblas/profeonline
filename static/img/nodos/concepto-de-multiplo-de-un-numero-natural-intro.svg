<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">MÚLTIPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Concepto de Múltiplo de un Número Natural</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Un número 'a' es múltiplo de 'b' si existe un natural 'k' tal que a = b · k</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <!-- Main Definition Card -->
      <g transform="translate(0, 0)">
        <rect width="335" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="335" height="40" rx="12" fill="#eff6ff"/>
        <text x="20" y="26" fill="#1e40af" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Definición Formal</text>

        <rect x="20" y="60" width="295" height="50" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="167" y="92" fill="#1d4ed8" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">M(n) = {n·k | k ∈ ℕ}</text>

        <text x="20" y="140" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Características Clave:</text>
        <text x="20" y="165" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Son infinitos: crecen sin límite.</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Todo número es múltiplo de sí mismo (n·1).</text>
        <text x="20" y="215" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• En ℕ₀, el 0 es múltiplo de todos (n·0 = 0).</text>
        <text x="20" y="242" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Conjunto infinito ordenado</text>
      </g>

      <!-- Right Card: Example Scale -->
      <g transform="translate(365, 0)">
        <rect width="335" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="335" height="40" rx="12" fill="#f0fdf4"/>
        <text x="20" y="26" fill="#065f46" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Múltiplos de 4 en la Recta</text>

        <rect x="20" y="60" width="295" height="50" rx="8" fill="#ffffff" stroke="#10b981"/>
        <text x="167" y="92" fill="#059669" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">M(4) = {4, 8, 12, 16, 20, ...}</text>

        <text x="20" y="140" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Saltos Uniformes de Longitud 4:</text>
        <text x="20" y="165" fill="#475569" font-family="system-ui, sans-serif" font-size="11">0 ➔ (+4) ➔ 4 ➔ (+4) ➔ 8 ➔ (+4) ➔ 12</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Cualquier punto alcanzable en saltos exactos</text>
        <text x="20" y="215" fill="#475569" font-family="system-ui, sans-serif" font-size="11">de tamaño 'n' es múltiplo de 'n'.</text>
        <text x="20" y="242" fill="#0284c7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Comprobación visual directa</text>
      </g>
    </g>

</svg>
