<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .math-term { font-family: "Cambria Math", "Times New Roman", serif; font-size: 19px; font-weight: bold; fill: #1d4ed8; }
      .frac-line { stroke: #1d4ed8; stroke-width: 2; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 6; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; }
      .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="50" class="header-box"/>
  <text x="340" y="45" text-anchor="middle" class="title">PROPIEDAD: LOGARITMO DE UNA RAÍZ</text>
  <text x="340" y="60" text-anchor="middle" class="text-main">La raíz se transforma en exponente fraccionario vertical que pasa multiplicando</text>

  <!-- Formula central -->
  <rect x="20" y="85" width="640" height="75" class="card"/>
  <rect x="40" y="95" width="600" height="55" class="badge-blue"/>
  <g transform="translate(130, 100)">
    <text x="0" y="28" class="math-term">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(</text>
    <!-- Raiz enesima de x^m -->
    <text x="45" y="16" font-size="12px" class="math-term">n</text>
    <text x="52" y="28" class="math-term">√x<tspan baseline-shift="super" font-size="70%">m</tspan>)</text>
    <text x="95" y="28" class="math-term">=</text>
    <!-- Fraccion m/n -->
    <text x="125" y="16" text-anchor="middle" class="math-term">m</text>
    <line x1="115" y1="22" x2="135" y2="22" class="frac-line"/>
    <text x="125" y="38" text-anchor="middle" class="math-term">n</text>
    <text x="145" y="28" class="math-term">· log<tspan baseline-shift="sub" font-size="70%">b</tspan>(x)</text>
  </g>

  <!-- 2 Cards explicativas -->
  <rect x="20" y="175" width="310" height="85" class="card"/>
  <rect x="35" y="185" width="130" height="24" class="badge-green"/>
  <text x="100" y="201" text-anchor="middle" class="text-green">Raíz Cuadrada</text>
  <g transform="translate(35, 222)">
    <text x="0" y="18" class="text-bold">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(√x) = </text>
    <text x="75" y="8" text-anchor="middle" class="text-bold">1</text>
    <line x1="68" y1="13" x2="82" y2="13" stroke="#0f172a" stroke-width="1.5"/>
    <text x="75" y="25" text-anchor="middle" class="text-bold">2</text>
    <text x="90" y="18" class="text-bold">· log<tspan baseline-shift="sub" font-size="70%">b</tspan>(x)</text>
  </g>

  <rect x="350" y="175" width="310" height="85" class="card"/>
  <rect x="365" y="185" width="130" height="24" class="badge-amber"/>
  <text x="430" y="201" text-anchor="middle" class="text-amber">Raíz Enésima General</text>
  <g transform="translate(365, 222)">
    <text x="0" y="18" class="text-bold">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(</text>
    <text x="36" y="8" font-size="10px" class="text-bold">n</text>
    <text x="42" y="18" class="text-bold">√x) = </text>
    <text x="85" y="8" text-anchor="middle" class="text-bold">1</text>
    <line x1="78" y1="13" x2="92" y2="13" stroke="#0f172a" stroke-width="1.5"/>
    <text x="85" y="25" text-anchor="middle" class="text-bold">n</text>
    <text x="100" y="18" class="text-bold">· log<tspan baseline-shift="sub" font-size="70%">b</tspan>(x)</text>
  </g>
</svg>
