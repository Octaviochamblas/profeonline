<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Síntesis: Algoritmo Óptimo para Hallar Divisores</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Procedimiento paso a paso para no olvidar ningún divisor</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ALGORITMO POR PARES COMPLEMENTARIOS</text>
        <text x="325" y="52" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">1. Calcular la parte entera de la raíz: k = ⌊√<tspan style="text-decoration: overline">n</tspan>⌋</text>
        <text x="325" y="74" fill="#059669" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">2. Para cada d ∈ {1, 2, ..., k}, si n mod d = 0, agregar d y (n/d) a la lista.</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cantidad Total de Divisores τ(n)</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">A partir de la descomposición prima:</text>
        <text x="20" y="74" fill="#1d4ed8" font-family="monospace" font-size="12">n = p₁^a · p₂^b ⟹ τ(n) = (a+1)(b+1)</text>
        <text x="20" y="96" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Permite verificar si encontramos todos.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#d97706" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Paridad de la Cantidad de Divisores</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Número general: τ(n) es PAR.</text>
        <text x="20" y="74" fill="#d97706" font-family="system-ui, sans-serif" font-size="11">• Cuadrado perfecto: τ(n) es IMPAR.</text>
        <text x="20" y="96" fill="#059669" font-family="system-ui, sans-serif" font-size="11">Propiedad evaluada frecuentemente en PAES.</text>
      </g>
    </g>

</svg>
