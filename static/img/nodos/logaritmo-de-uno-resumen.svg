<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: Logaritmo de Uno</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Identidad universal nula en expresiones logarítmicas</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 18)">
        <rect width="650" height="80" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">SÍNTESIS DE LA IDENTIDAD DE ARGUMENTO 1</text>
        <text x="325" y="52" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(1) = 0   (para todo b &gt; 0, b ≠ 1)</text>
      </g>
      <g transform="translate(25, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Simplificación Inmediata</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">En sumas o expresiones algebraicas:</text>
        <text x="20" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">E = log<tspan baseline-shift="sub" font-size="70%">2</tspan>(8) + log<tspan baseline-shift="sub" font-size="70%">5</tspan>(1) - log<tspan baseline-shift="sub" font-size="70%">3</tspan>(9)</text>
        <text x="20" y="98" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">E = 3 + 0 - 2 = 1</text>
        <text x="20" y="122" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Anula términos sumandos</text>
      </g>
      <g transform="translate(365, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cero como Exponente</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Recuerda siempre la razón:</text>
        <text x="20" y="74" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">"El único exponente que da 1 es 0"</text>
        <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">b<tspan baseline-shift="super" font-size="70%">0</tspan> = 1 para cualquier base b &gt; 0.</text>
        <text x="20" y="122" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Identidad universal</text>
      </g>
    </g>

</svg>
