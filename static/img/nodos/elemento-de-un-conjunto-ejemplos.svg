<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Ejemplos Guiados — Elementos</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">CONJUNTOS BÁSICOS</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Conteo de Elementos Directos</text>

    <rect x="44" y="135" width="320" height="45" rx="8" fill="#f1f5f9"/>
    <text x="56" y="163" fill="#0f172a" font-size="12.5" font-weight="800">Conjunto A = { 3, 7, 11, 15 }</text>

    <rect x="44" y="190" width="320" height="55" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="56" y="212" fill="#0f766e" font-size="11.5" font-weight="700">Miembros individuales:</text>
    <text x="56" y="233" fill="#042f2e" font-size="13" font-weight="800">3,  7,  11,  15  ➔ 4 elementos</text>

    <rect x="44" y="255" width="320" height="65" rx="10" fill="#0d9488"/>
    <text x="204" y="280" fill="#ccfbf1" font-size="12" text-anchor="middle">Verificación:</text>
    <text x="204" y="306" fill="#ffffff" font-size="15" font-weight="900" text-anchor="middle">7 ES ELEMENTO DE A</text>
    <text x="204" y="350" fill="#475569" font-size="11.5" text-anchor="middle">Cada número separado por coma es un elemento.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-indigo)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">Conjuntos como Elementos</text>

    <rect x="436" y="135" width="320" height="45" rx="8" fill="#f1f5f9"/>
    <text x="448" y="163" fill="#0f172a" font-size="12.5" font-weight="800">B = { ∅, {1}, {1, 2} }</text>

    <rect x="436" y="190" width="320" height="55" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="448" y="212" fill="#7e22ce" font-size="11.5" font-weight="700">Miembros de B:</text>
    <text x="448" y="233" fill="#6b21a8" font-size="13" font-weight="800">Elemento 1: ∅ | E2: {1} | E3: {1, 2}</text>

    <rect x="436" y="255" width="320" height="65" rx="10" fill="#6366f1"/>
    <text x="596" y="280" fill="#e0e7ff" font-size="12" text-anchor="middle">Resultado clave:</text>
    <text x="596" y="306" fill="#ffffff" font-size="15" font-weight="900" text-anchor="middle">{1} ES ELEMENTO DE B</text>
    <text x="596" y="350" fill="#475569" font-size="11" text-anchor="middle">El objeto {1} actúa como 1 elemento.</text>
  </g>

</svg>
