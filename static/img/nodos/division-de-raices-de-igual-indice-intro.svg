<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">DIVISIÓN DE RAÍCES</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">División de Raíces de Igual Índice</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Conservar el índice y dividir radicandos en formato fraccionario vertical</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Top Formula Box with vertical fraction -->
      <g transform="translate(25, 18)">
        <rect width="650" height="75" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">LEI DE COCIENTE DE RADICALES HOMOGÉNEOS</text>

        <!-- Formula: ⁿ√a / ⁿ√b = ⁿ√(a / b) -->
        <g transform="translate(220, 48)">
          <text x="15" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√a</text>
          <line x1="0" y1="0" x2="30" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="15" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√b</text>

          <text x="45" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">=</text>

          <!-- ⁿ√(a / b) -->
          <text x="80" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√(a / b)</text>

          <text x="160" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">(b ≠ 0, a ≥ 0, b &gt; 0 si n par)</text>
        </g>
      </g>

      <!-- Left Box -->
      <g transform="translate(25, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Cociente Simplificado</text>

        <!-- Vertical math display -->
        <g transform="translate(45, 68)">
          <!-- √50 / √2 -->
          <text x="12" y="-6" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√50</text>
          <line x1="0" y1="0" x2="24" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="12" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√2</text>

          <text x="36" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <text x="68" y="5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√(50 / 2)</text>

          <text x="105" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <text x="125" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">√25</text>

          <text x="148" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <text x="165" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">5 ✓</text>
        </g>

        <text x="20" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">El resultado es un número entero exacto.</text>
        <text x="20" y="134" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Agrupa bajo un solo techo</text>
      </g>

      <!-- Right Box -->
      <g transform="translate(365, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Distribución a Fracciones</text>

        <!-- Vertical math display -->
        <g transform="translate(50, 68)">
          <text x="25" y="5" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√(9 / 49)</text>

          <text x="65" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <!-- √9 / √49 -->
          <text x="90" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√9</text>
          <line x1="78" y1="0" x2="102" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="90" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√49</text>

          <text x="118" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <!-- 3 / 7 -->
          <text x="140" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text>
          <line x1="130" y1="0" x2="150" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="140" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">7</text>
        </g>

        <text x="20" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Extrae la raíz al numerador y denominador.</text>
        <text x="20" y="134" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Equivalencia bidireccional</text>
      </g>
    </g>

</svg>
