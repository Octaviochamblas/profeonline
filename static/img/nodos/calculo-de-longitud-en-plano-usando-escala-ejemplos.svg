<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Carretera de 45 km a 1 : 500.000</text>
  <text x="35" y="85" class="text-step">Distancia real = 45 km. Escala = 1 : 500.000:</text>
  <text x="35" y="115" class="text-step">Paso 1: Convertir 45 km a cm</text>
  <text x="35" y="135" class="math">45 km = 45.000 m = 4.500.000 cm</text>
  <text x="35" y="165" class="text-step">Paso 2: Dividir por N = 500.000</text>
  <text x="35" y="190" class="math">Distancia en plano = 4.500.000 / 500.000 = 9 cm</text>
  <text x="35" y="235" class="res">Mide 9 cm en el mapa</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Habitación de 6 m a 1 : 50</text>
  <text x="365" y="85" class="text-step">Largo real = 6 metros. Escala = 1 : 50:</text>
  <text x="365" y="115" class="text-step">Paso 1: Convertir 6 m a cm</text>
  <text x="365" y="135" class="math">6 m = 600 cm</text>
  <text x="365" y="165" class="text-step">Paso 2: Dividir por 50</text>
  <text x="365" y="190" class="math">Distancia en plano = 600 / 50 = 12 cm</text>
  <text x="365" y="235" class="res">Mide 12 cm en el plano</text>
</svg>
