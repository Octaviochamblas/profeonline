<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 20px; font-weight: bold; fill: #1d4ed8; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 6; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; }
      .note { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .arrow { stroke: #3b82f6; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6" />
    </marker>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="50" class="header-box"/>
  <text x="340" y="45" text-anchor="middle" class="title">PROPIEDAD: LOGARITMO DE UN PRODUCTO</text>
  <text x="340" y="60" text-anchor="middle" class="text-main">El logaritmo de una multiplicación se convierte en la suma de los logaritmos</text>

  <!-- Formula central -->
  <rect x="20" y="85" width="640" height="75" class="card"/>
  <rect x="40" y="98" width="600" height="48" class="badge-blue"/>
  <text x="340" y="130" text-anchor="middle" class="formula">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(x · y) = log<tspan baseline-shift="sub" font-size="70%">b</tspan>(x) + log<tspan baseline-shift="sub" font-size="70%">b</tspan>(y)</text>

  <!-- 2 Cards explicativas -->
  <rect x="20" y="175" width="310" height="85" class="card"/>
  <rect x="35" y="185" width="130" height="24" class="badge-green"/>
  <text x="100" y="201" text-anchor="middle" class="text-green">Sentido Expansivo</text>
  <text x="35" y="228" class="text-main">Desglosa un producto interno:</text>
  <text x="35" y="248" class="text-bold">log<tspan baseline-shift="sub" font-size="70%">2</tspan>(4 · 8) = log<tspan baseline-shift="sub" font-size="70%">2</tspan>(4) + log<tspan baseline-shift="sub" font-size="70%">2</tspan>(8)</text>

  <rect x="350" y="175" width="310" height="85" class="card"/>
  <rect x="365" y="185" width="130" height="24" class="badge-amber"/>
  <text x="430" y="201" text-anchor="middle" class="text-amber">Sentido Condensado</text>
  <text x="365" y="228" class="text-main">Agrupa sumas de igual base:</text>
  <text x="365" y="248" class="text-bold">log<tspan baseline-shift="sub" font-size="70%">6</tspan>(12) + log<tspan baseline-shift="sub" font-size="70%">6</tspan>(3) = log<tspan baseline-shift="sub" font-size="70%">6</tspan>(36) = 2</text>
</svg>
