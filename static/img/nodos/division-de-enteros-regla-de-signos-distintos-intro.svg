<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">DIVISIÓN</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">División de Enteros: Signos Distintos</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">El cociente de enteros con signos opuestos es NEGATIVO: (+) / (-) = (-) y (-) / (+) = (-)</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 25)">
        <rect width="310" height="215" rx="8" fill="#0f172a" stroke="#f87171"/>
        <text x="20" y="32" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Positivo ÷ Negativo = Negativo</text>
        <rect x="20" y="48" width="270" height="40" rx="6" fill="#1e293b" stroke="#f87171"/>
        <text x="155" y="73" fill="#f87171" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">(+a) ÷ (-b) = -(a ÷ b)</text>

        <text x="20" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ejemplo:</text>
        <text x="20" y="138" fill="#f87171" font-family="monospace" font-size="13">(+45) ÷ (-9) = -5</text>
        <text x="20" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Verificación multiplicativa:</text>
        <text x="20" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">(-5) · (-9) = +45.</text>
        <text x="20" y="205" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Resultado negativo</text>
      </g>

      <g transform="translate(365, 25)">
        <rect width="310" height="215" rx="8" fill="#0f172a" stroke="#f87171"/>
        <text x="20" y="32" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Negativo ÷ Positivo = Negativo</text>
        <rect x="20" y="48" width="270" height="40" rx="6" fill="#1e293b" stroke="#f87171"/>
        <text x="155" y="73" fill="#f87171" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">(-a) ÷ (+b) = -(a ÷ b)</text>

        <text x="20" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ejemplo:</text>
        <text x="20" y="138" fill="#f87171" font-family="monospace" font-size="13">(-48) ÷ (+6) = -8</text>
        <text x="20" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Verificación multiplicativa:</text>
        <text x="20" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">(-8) · (+6) = -48.</text>
        <text x="20" y="205" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Más entre menos da MENOS</text>
      </g>
    </g>

</svg>
