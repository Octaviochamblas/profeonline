<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Ejemplos: Raíz y Exponente Fraccionario</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Conversión y cálculo con exponentes fraccionarios y negativos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">8<tspan baseline-shift="super" font-size="70%">2/3</tspan></text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#34d399"/>
        <g transform="translate(25, 92)">
          <text x="25" y="5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">(<tspan baseline-shift="super" font-size="70%">3</tspan>√8)<tspan baseline-shift="super" font-size="70%">2</tspan></text>
          <text x="62" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>
          <text x="85" y="5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">2<tspan baseline-shift="super" font-size="70%">2</tspan></text>
          <text x="110" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>
          <text x="135" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4 ✓</text>
        </g>

        <text x="20" y="175" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Raíz Cúbica</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">∛8 = 2, luego 2² = 4.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ = 4</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700"><tspan baseline-shift="super" font-size="70%">5</tspan>√(x<tspan baseline-shift="super" font-size="70%">3</tspan>)</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <g transform="translate(25, 92)">
          <text x="20" y="5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">m=3, n=5</text>
          <text x="75" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>
          <text x="115" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">x<tspan baseline-shift="super" font-size="70%">3/5</tspan> ✓</text>
        </g>

        <text x="20" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Conversión</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Numerador=3, Denominador=5.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ x<tspan baseline-shift="super" font-size="70%">3/5</tspan></text>
      </g>

      <!-- Card 3: 4^(-1/2) with vertical fraction -->
      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4<tspan baseline-shift="super" font-size="70%">-1/2</tspan></text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <g transform="translate(25, 92)">
          <!-- 1 / √4 -->
          <text x="12" y="-5" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
          <line x1="0" y1="0" x2="24" y2="0" stroke="#fbbf24" stroke-width="1.2"/>
          <text x="12" y="13" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√4</text>

          <text x="38" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">=</text>

          <!-- 1 / 2 -->
          <text x="62" y="-5" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
          <line x1="52" y1="0" x2="72" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="62" y="13" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>

          <text x="95" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✓</text>
        </g>

        <text x="20" y="175" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Inversión y Raíz</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Exp. negativo invierte a 1/√4.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ = 1/2</text>
      </g>
    </g>

</svg>
