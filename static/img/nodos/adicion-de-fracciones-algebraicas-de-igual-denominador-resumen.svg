<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="320" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="87.2" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="272.7" y="14" width="94.6" height="59.2"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 113.2)">
    <rect width="640" height="85.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">Para sumar fracciones algebraicas con el mismo denominador se</tspan>
      <tspan x="25" y="41">mantiene el denominador común y se suman los numeradores reduciendo</tspan>
      <tspan x="25" y="58">los términos semejantes resultantes.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 208.2)">
    <rect width="640" height="92.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Sumar los denominadores entre sí (ej: a/x + b/x ≠ (a + b) / 2x).</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="63">Olvidar verificar si la fracción resultante se puede simplificar.</tspan>
    </text>
  </g>
</svg>
