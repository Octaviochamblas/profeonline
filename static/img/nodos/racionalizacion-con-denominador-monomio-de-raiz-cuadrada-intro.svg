<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">RACIONALIZACIÓN CUADRÁTICA</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Racionalización: Raíz Cuadrada en Denominador</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Amplificación por la raíz cuadrada: numerador arriba y denominador racional abajo</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Top Formula Box with vertical fractions -->
      <g transform="translate(25, 18)">
        <rect width="650" height="75" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TRANSFORMACIÓN DE MONOMIO CUADRÁTICO</text>

        <!-- Formula: a/√<tspan style="text-decoration: overline">b</tspan> · √<tspan style="text-decoration: overline">b</tspan>/√<tspan style="text-decoration: overline">b</tspan> = a√<tspan style="text-decoration: overline">b</tspan>/b -->
        <g transform="translate(195, 48)">
          <!-- a / √<tspan style="text-decoration: overline">b</tspan> -->
          <text x="12" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">a</text>
          <line x1="0" y1="0" x2="24" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="12" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">b</tspan></text>

          <!-- · -->
          <text x="38" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">·</text>

          <!-- √<tspan style="text-decoration: overline">b</tspan> / √<tspan style="text-decoration: overline">b</tspan> -->
          <text x="64" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">b</tspan></text>
          <line x1="50" y1="0" x2="78" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="64" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">b</tspan></text>

          <!-- = -->
          <text x="94" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">=</text>

          <!-- a · √<tspan style="text-decoration: overline">b</tspan> / (√<tspan style="text-decoration: overline">b</tspan>)² -->
          <text x="135" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">a · √<tspan style="text-decoration: overline">b</tspan></text>
          <line x1="110" y1="0" x2="160" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="135" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">(√<tspan style="text-decoration: overline">b</tspan>)²</text>

          <!-- = -->
          <text x="176" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">=</text>

          <!-- a√<tspan style="text-decoration: overline">b</tspan> / b -->
          <text x="210" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">a√<tspan style="text-decoration: overline">b</tspan></text>
          <line x1="192" y1="0" x2="228" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="210" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">b</text>

          <text x="270" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">(b &gt; 0)</text>
        </g>
      </g>

      <!-- Left Box -->
      <g transform="translate(25, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Ejemplo: 6 / √<tspan style="text-decoration: overline">3</tspan></text>

        <!-- Vertical math display -->
        <g transform="translate(45, 68)">
          <!-- 6 / √<tspan style="text-decoration: overline">3</tspan> -->
          <text x="10" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">6</text>
          <line x1="0" y1="0" x2="20" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="10" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">3</tspan></text>

          <!-- · -->
          <text x="32" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">·</text>

          <!-- √<tspan style="text-decoration: overline">3</tspan> / √<tspan style="text-decoration: overline">3</tspan> -->
          <text x="54" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">3</tspan></text>
          <line x1="42" y1="0" x2="66" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="54" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">3</tspan></text>

          <!-- = -->
          <text x="78" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <!-- 6√<tspan style="text-decoration: overline">3</tspan> / 3 -->
          <text x="106" y="-6" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">6√<tspan style="text-decoration: overline">3</tspan></text>
          <line x1="90" y1="0" x2="122" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="106" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text>

          <!-- = -->
          <text x="135" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <!-- 2√<tspan style="text-decoration: overline">3</tspan> -->
          <text x="165" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2√<tspan style="text-decoration: overline">3</tspan></text>
        </g>

        <text x="20" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Se divide 6 : 3 = 2, dejando el radical arriba.</text>
        <text x="20" y="134" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Denominador entero racional</text>
      </g>

      <!-- Right Box -->
      <g transform="translate(365, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Con Coeficiente: a / (k√<tspan style="text-decoration: overline">b</tspan>)</text>

        <!-- Vertical math display -->
        <g transform="translate(50, 68)">
          <!-- a / (k√<tspan style="text-decoration: overline">b</tspan>) -->
          <text x="15" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">a</text>
          <line x1="0" y1="0" x2="30" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="15" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">k√<tspan style="text-decoration: overline">b</tspan></text>

          <!-- · -->
          <text x="44" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">·</text>

          <!-- √<tspan style="text-decoration: overline">b</tspan> / √<tspan style="text-decoration: overline">b</tspan> -->
          <text x="68" y="-6" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">b</tspan></text>
          <line x1="56" y1="0" x2="80" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="68" y="14" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">b</tspan></text>

          <!-- = -->
          <text x="94" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">=</text>

          <!-- a√<tspan style="text-decoration: overline">b</tspan> / (k · b) -->
          <text x="135" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">a√<tspan style="text-decoration: overline">b</tspan></text>
          <line x1="110" y1="0" x2="160" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="135" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">k · b</text>
        </g>

        <text x="20" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Solo se multiplica por la raíz pura √<tspan style="text-decoration: overline">b</tspan>.</text>
        <text x="20" y="134" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ No amplificar por el coeficiente k</text>
      </g>
    </g>

</svg>
