<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .rule-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .err-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #1d4ed8; }
      .err-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #991b1b; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="110" class="rule-box"/>
  <text x="40" y="48" class="title">TEOREMA DE LA SUMA EN SERIES PROPORCIONALES</text>

  <g transform="translate(40, 60)">
    <text x="0" y="22" class="formula">k =</text>
    <g transform="translate(35, 0)">
      <text x="45" y="14" class="formula" text-anchor="middle">∑ Antecedentes</text>
      <line x1="0" y1="18" x2="90" y2="18" class="frac-line"/>
      <text x="45" y="34" class="formula" text-anchor="middle">∑ Consecuentes</text>
    </g>
    <text x="135" y="22" class="formula">⟹  Antecedente<tspan baseline-shift="sub" font-size="70%">i</tspan> = k · Consecuente<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  </g>
  <text x="40" y="110" class="desc">La constante k se preserva idéntica al sumar todos los numeradores y todos los denominadores.</text>

  <rect x="20" y="145" width="640" height="115" class="err-box"/>
  <text x="40" y="172" class="err-text">¡ERROR FRECUENTE A EVITAR!</text>
  <text x="40" y="200" class="desc">❌ No olvidar sumar TODOS los consecuentes correspondientes en el denominador.</text>
  <text x="40" y="230" class="desc">❌ Verificar que la suma de las partes individuales obtenidas coincida exactamente con la cantidad total inicial.</text>
</svg>
