<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 16; }
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 18px; fill: #64748b; text-anchor: middle; }
      .card-num { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #3b82f6; }
      .expr { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #1e293b; }
      .badge-yes { fill: #dcfce7; stroke: #86efac; stroke-width: 1.5; rx: 8; }
      .badge-no { fill: #fee2e2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .badge-yes-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #15803d; text-anchor: middle; dominant-baseline: central; }
      .badge-no-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #b91c1c; text-anchor: middle; dominant-baseline: central; }
      .reason-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #334155; }
      .reason-desc { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; fill: #64748b; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="675" class="bg"/>

  <text x="600" y="55" class="title">Ejemplos Prácticos: Identificación y Clasificación</text>
  <text x="600" y="85" class="subtitle">Análisis de 4 casos comunes para comprobar la validez proposicional</text>

  <!-- Panel 1 -->
  <g transform="translate(60, 115)">
    <rect width="520" height="240" class="card" filter="url(#shadow)"/>
    <text x="35" y="45" class="card-num">CASO 1</text>
    <text x="35" y="85" class="expr">"17 es un número primo"</text>

    <rect x="35" y="110" width="220" height="34" class="badge-yes"/>
    <text x="145" y="127" class="badge-yes-text">✓ SÍ ES PROPOSICIÓN</text>

    <text x="35" y="175" class="reason-title">Justificación formal:</text>
    <text x="35" y="200" class="reason-desc">Es una oración declarativa con valor de verdad <tspan font-weight="700" fill="#16a34a">Verdadero (V)</tspan>.</text>
    <text x="35" y="220" class="reason-desc">Cumple con ser objetiva e indiscutible.</text>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(620, 115)">
    <rect width="520" height="240" class="card" filter="url(#shadow)"/>
    <text x="35" y="45" class="card-num">CASO 2</text>
    <text x="35" y="85" class="expr">"3 + 5 = 10"</text>

    <rect x="35" y="110" width="220" height="34" class="badge-yes"/>
    <text x="145" y="127" class="badge-yes-text">✓ SÍ ES PROPOSICIÓN</text>

    <text x="35" y="175" class="reason-title">Justificación formal:</text>
    <text x="35" y="200" class="reason-desc">Es declarativa matemática con valor de verdad <tspan font-weight="700" fill="#dc2626">Falso (F)</tspan>.</text>
    <text x="35" y="220" class="reason-desc"><tspan font-weight="700">¡Importante!</tspan> Que sea falsa no le quita el carácter de proposición.</text>
  </g>

  <!-- Panel 3 -->
  <g transform="translate(60, 385)">
    <rect width="520" height="240" class="card" filter="url(#shadow)"/>
    <text x="35" y="45" class="card-num">CASO 3</text>
    <text x="35" y="85" class="expr">"¿Cuál es el valor de x?"</text>

    <rect x="35" y="110" width="220" height="34" class="badge-no"/>
    <text x="145" y="127" class="badge-no-text">✕ NO ES PROPOSICIÓN</text>

    <text x="35" y="175" class="reason-title">Justificación formal:</text>
    <text x="35" y="200" class="reason-desc">Es una oración interrogativa (pregunta).</text>
    <text x="35" y="220" class="reason-desc">No asevera ningún hecho ni posee valor de verdad V o F.</text>
  </g>

  <!-- Panel 4 -->
  <g transform="translate(620, 385)">
    <rect width="520" height="240" class="card" filter="url(#shadow)"/>
    <text x="35" y="45" class="card-num">CASO 4</text>
    <text x="35" y="85" class="expr">"x + 4 = 10"</text>

    <rect x="35" y="110" width="220" height="34" class="badge-no"/>
    <text x="145" y="127" class="badge-no-text">✕ NO ES PROPOSICIÓN</text>

    <text x="35" y="175" class="reason-title">Justificación formal:</text>
    <text x="35" y="200" class="reason-desc">Es un <tspan font-weight="700">enunciado abierto</tspan> con una variable libre <tspan font-style="italic">x</tspan>.</text>
    <text x="35" y="220" class="reason-desc">No se puede evaluar hasta fijar el valor numérico de <tspan font-style="italic">x</tspan>.</text>
  </g>
</svg>
