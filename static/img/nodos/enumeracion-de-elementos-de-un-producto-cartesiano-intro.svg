<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Métodos de Enumeración de A × B</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">PROD. CARTESIANO</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-purple)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">1. Diagrama de Árbol</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Ramificación por niveles para listar ordenadamente.</text>

    <!-- Visual Box -->
    <rect x="44" y="160" width="320" height="120" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>

    <text x="60" y="195" fill="#7e22ce" font-size="12" font-weight="800">Nivel 1 (A)</text>
    <text x="160" y="195" fill="#7e22ce" font-size="12" font-weight="800">Nivel 2 (B)</text>
    <text x="270" y="195" fill="#7e22ce" font-size="12" font-weight="800">Par Final</text>

    <line x1="85" y1="210" x2="155" y2="185" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="85" y1="210" x2="155" y2="235" stroke="#a855f7" stroke-width="1.5"/>

    <text x="65" y="215" fill="#0f172a" font-size="12" font-weight="800">a₁</text>
    <text x="165" y="188" fill="#0f172a" font-size="11">b₁ ➔ (a₁,b₁)</text>
    <text x="165" y="238" fill="#0f172a" font-size="11">b₂ ➔ (a₁,b₂)</text>

    <rect x="44" y="290" width="320" height="85" rx="8" fill="#f1f5f9"/>
    <text x="56" y="315" fill="#334155" font-size="12" font-weight="700">Ventaja del Árbol:</text>
    <text x="56" y="338" fill="#475569" font-size="11.5">Permite extenderse fácilmente a 3 o más conjuntos.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">2. Tabla de Doble Entrada</text>

    <rect x="446" y="140" width="300" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Table Grid -->
    <rect x="470" y="155" width="60" height="25" fill="#e2e8f0"/>
    <text x="500" y="172" fill="#475569" font-size="11" font-weight="800" text-anchor="middle">A \ B</text>

    <rect x="535" y="155" width="90" height="25" fill="#ccfbf1"/>
    <text x="580" y="172" fill="#0f766e" font-size="11" font-weight="800" text-anchor="middle">b₁</text>

    <rect x="630" y="155" width="90" height="25" fill="#ccfbf1"/>
    <text x="675" y="172" fill="#0f766e" font-size="11" font-weight="800" text-anchor="middle">b₂</text>

    <rect x="470" y="185" width="60" height="30" fill="#dbeafe"/>
    <text x="500" y="205" fill="#1e40af" font-size="11" font-weight="800" text-anchor="middle">a₁</text>

    <rect x="535" y="185" width="90" height="30" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="580" y="205" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">(a₁, b₁)</text>

    <rect x="630" y="185" width="90" height="30" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="675" y="205" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">(a₁, b₂)</text>

    <rect x="436" y="275" width="320" height="95" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="596" y="305" fill="#0f766e" font-size="12" font-weight="800" text-anchor="middle">Estructura Matricial</text>
    <text x="596" y="330" fill="#042f2e" font-size="13.5" font-weight="900" text-anchor="middle">Filas (A) × Columnas (B)</text>
    <text x="596" y="352" fill="#475569" font-size="10.5" text-anchor="middle">Garantiza que no se omita ni se repita ningún par.</text>
  </g>

</svg>
