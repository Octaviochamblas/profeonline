<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Tercera proporcional de 4 y 6</text>
  <text x="35" y="85" class="text-step">Plantear proporción continua: 4/6 = 6/x</text>
  <text x="35" y="115" class="text-step">Paso 1: Elevar al cuadrado el medio repetido</text>
  <text x="35" y="140" class="math">6² = 36</text>
  <text x="35" y="170" class="text-step">Paso 2: Dividir por el primer término 4</text>
  <g transform="translate(35, 185)">
    <text x="0" y="18" class="math">x =</text>
    <g transform="translate(30, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">36</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">4</text>
    </g>
    <text x="60" y="18" class="math">= 9</text>
  </g>
  <text x="35" y="235" class="res">Tercera proporcional x = 9</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Tercera proporcional de 8 y 12</text>
  <text x="365" y="85" class="text-step">Plantear proporción: 8/12 = 12/x</text>
  <text x="365" y="115" class="text-step">Paso 1: Elevar al cuadrado 12</text>
  <text x="365" y="140" class="math">12² = 144</text>
  <text x="365" y="170" class="text-step">Paso 2: Dividir por 8</text>
  <g transform="translate(365, 185)">
    <text x="0" y="18" class="math">x =</text>
    <g transform="translate(30, 0)">
      <text x="16" y="12" class="math" text-anchor="middle">144</text>
      <line x1="0" y1="16" x2="32" y2="16" class="frac-line"/>
      <text x="16" y="30" class="math" text-anchor="middle">8</text>
    </g>
    <text x="70" y="18" class="math">= 18</text>
  </g>
  <text x="365" y="235" class="res">Tercera proporcional x = 18</text>
</svg>
