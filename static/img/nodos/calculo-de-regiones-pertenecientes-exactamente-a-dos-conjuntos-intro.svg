<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Exactamente a Dos Conjuntos</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">CARDINALIDAD</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-amber)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Los 3 Pétalos de Doble Pertenencia</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Pertenecen a 2 conjuntos simultáneamente, pero NO al tercero.</text>

    <!-- Visual Box -->
    <rect x="44" y="165" width="320" height="65" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="204" y="195" fill="#92400e" font-size="12.5" font-weight="800" text-anchor="middle">|Solo AB| = |A ∩ B| - |A ∩ B ∩ C|</text>
    <text x="204" y="218" fill="#b45309" font-size="12" font-weight="800" text-anchor="middle">Total = (AB - t) + (AC - t) + (BC - t)</text>

    <rect x="44" y="245" width="320" height="125" rx="10" fill="#f1f5f9"/>
    <text x="56" y="272" fill="#334155" font-size="12.5" font-weight="700">Trampa Común en Problemas:</text>
    <text x="56" y="295" fill="#475569" font-size="12">• "Leen A y B": es la intersección total |A ∩ B|.</text>
    <text x="56" y="317" fill="#475569" font-size="12">• "Leen SOLO A y B": resta el centro triple.</text>
    <text x="56" y="342" fill="#b45309" font-size="12" font-weight="700">Suma total de dobles: ∑ |Aᵢ ∩ Aⱼ| - 3|A ∩ B ∩ C|.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="15" font-weight="800">Diagrama: Exactamente Dos</text>

    <rect x="446" y="140" width="300" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="460" y="162" fill="#64748b" font-size="12" font-weight="900">U</text>

    <circle cx="570" cy="185" r="35" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="620" cy="185" r="35" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="595" cy="225" r="35" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>

    <!-- Shaded petals (excluding center) -->
    <circle cx="595" cy="180" r="10" fill="#f59e0b" fill-opacity="0.6"/>
    <circle cx="580" cy="205" r="10" fill="#f59e0b" fill-opacity="0.6"/>
    <circle cx="610" cy="205" r="10" fill="#f59e0b" fill-opacity="0.6"/>
    <!-- Unshade center -->
    <circle cx="595" cy="198" r="8" fill="#ffffff" stroke="#7e22ce"/>

    <text x="595" y="172" fill="#92400e" font-size="9" font-weight="900" text-anchor="middle">AB</text>
    <text x="572" y="215" fill="#92400e" font-size="9" font-weight="900">AC</text>
    <text x="618" y="215" fill="#92400e" font-size="9" font-weight="900">BC</text>

    <rect x="436" y="275" width="320" height="95" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="596" y="305" fill="#0f766e" font-size="12" font-weight="800" text-anchor="middle">Corona de 3 Pétalos</text>
    <text x="596" y="330" fill="#042f2e" font-size="13.5" font-weight="900" text-anchor="middle">Exactamente 2 Conjuntos</text>
    <text x="596" y="352" fill="#475569" font-size="10.5" text-anchor="middle">El centro triple queda excluido de la suma.</text>
  </g>

</svg>
