<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">ÍNDICE PAR (EXISTENCIA)</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Existencia con Índice Par en ℝ</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Restricción de no negatividad: 2k√<tspan style="text-decoration: overline">a</tspan> ∈ ℝ ⟺ a ≥ 0</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CONDICIÓN DE EXISTENCIA REAL PARA ÍNDICE PAR</text>
        <text x="325" y="50" fill="#34d399" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">2k</tspan>√<tspan style="text-decoration: overline">a</tspan> ∈ R   ⟺   a ≥ 0   (k ∈ N)</text>
      </g>
      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Por qué a ≥ 0</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Todo número real al elevarse a par da ≥ 0:</text>
        <text x="20" y="78" fill="#38bdf8" font-family="monospace" font-size="12">(+3)<tspan baseline-shift="super" font-size="70%">2</tspan> = +9   y   (-3)<tspan baseline-shift="super" font-size="70%">2</tspan> = +9</text>
        <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Ningún real al cuadrado da -9.</text>
        <text x="20" y="125" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ b<tspan baseline-shift="super" font-size="70%">2k</tspan> ≥ 0 en R</text>
      </g>
      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Radicando Negativo</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Si a &lt; 0, la raíz NO pertenece a R:</text>
        <text x="20" y="78" fill="#fbbf24" font-family="monospace" font-size="12">√<tspan style="text-decoration: overline">-25</tspan> = 5i ∉ R   |   <tspan baseline-shift="super" font-size="70%">4</tspan>√<tspan style="text-decoration: overline">-16</tspan> ∉ R</text>
        <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">En el marco PAES se clasifica como NO REAL.</text>
        <text x="20" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Restricción de dominio</text>
      </g>
    </g>

</svg>
