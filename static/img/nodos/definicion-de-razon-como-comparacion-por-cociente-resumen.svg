<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .rule-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .err-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 19px; font-weight: bold; fill: #1d4ed8; }
      .err-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #991b1b; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="110" class="rule-box"/>
  <text x="40" y="48" class="title">SÍNTESIS: CONCEPTO DE RAZÓN</text>

  <g transform="translate(40, 60)">
    <text x="0" y="20" class="formula">Razón a : b =</text>
    <g transform="translate(115, 2)">
      <text x="10" y="14" class="formula" text-anchor="middle">a</text>
      <line x1="0" y1="18" x2="20" y2="18" class="frac-line"/>
      <text x="10" y="34" class="formula" text-anchor="middle">b</text>
    </g>
    <text x="145" y="20" class="formula">= k    (k: cuantas veces a contiene a b)</text>
  </g>
  <text x="40" y="110" class="desc">Es una comparación multiplicativa; el orden de los términos determina el sentido de la comparación.</text>

  <rect x="20" y="145" width="640" height="115" class="err-box"/>
  <text x="40" y="172" class="err-text">¡ERROR FRECUENTE A EVITAR!</text>
  <text x="40" y="200" class="desc">❌ No invertir los términos: la razón de hombres a mujeres (H/M) no es igual a la de mujeres a hombres (M/H).</text>
  <text x="40" y="230" class="desc">❌ No confundir razón (comparación entre 2 cantidades) con fracción parte-todo (a menos que b sea el total).</text>
</svg>
