<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Condensar resta</text>
  <text x="35" y="85" class="text-step">Calcular: log<tspan baseline-shift="sub" font-size="70%">3</tspan>(54) − log<tspan baseline-shift="sub" font-size="70%">3</tspan>(2)</text>
  <text x="35" y="112" class="text-step">Paso 1: Expresar como división vertical</text>
  <g transform="translate(35, 122)">
    <text x="0" y="16" class="math">= log<tspan baseline-shift="sub" font-size="70%">3</tspan>(</text>
    <text x="45" y="6" text-anchor="middle" class="math">54</text>
    <line x1="32" y1="12" x2="58" y2="12" class="frac-line"/>
    <text x="45" y="24" text-anchor="middle" class="math">2</text>
    <text x="62" y="16" class="math">)</text>
  </g>
  <text x="35" y="175" class="text-step">Paso 2: Simplificar argumento</text>
  <text x="35" y="198" class="math">= log<tspan baseline-shift="sub" font-size="70%">3</tspan>(27) = 3</text>
  <text x="35" y="235" class="res">Resultado = 3</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Expansión fraccionaria</text>
  <g transform="translate(365, 72)">
    <text x="0" y="14" class="text-step">Calcular: log<tspan baseline-shift="sub" font-size="70%">5</tspan>(</text>
    <text x="68" y="6" text-anchor="middle" class="text-step">25</text>
    <line x1="56" y1="10" x2="80" y2="10" stroke="#475569" stroke-width="1.5"/>
    <text x="68" y="22" text-anchor="middle" class="text-step">125</text>
    <text x="86" y="14" class="text-step">)</text>
  </g>
  <text x="365" y="112" class="text-step">Paso 1: Restar logaritmos</text>
  <text x="365" y="136" class="math">= log<tspan baseline-shift="sub" font-size="70%">5</tspan>(25) − log<tspan baseline-shift="sub" font-size="70%">5</tspan>(125)</text>
  <text x="365" y="168" class="text-step">Paso 2: Evaluar potencias</text>
  <text x="365" y="195" class="math">= 2 − 3 = −1</text>
  <text x="365" y="235" class="res">Resultado = −1</text>
</svg>
