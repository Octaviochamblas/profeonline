<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 19px; font-weight: bold; fill: #1d4ed8; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 8; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; }
      .math-bold { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .tag-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="15" width="640" height="48" class="header-box"/>
  <text x="340" y="36" text-anchor="middle" class="title">CONCEPTO DE PROPORCIONALIDAD COMPUESTA</text>
  <text x="340" y="52" text-anchor="middle" class="text-main">Intervienen tres o más magnitudes vinculadas simultáneamente (directas e inversas)</text>

  <!-- Formula central -->
  <rect x="20" y="75" width="640" height="85" class="card"/>
  <rect x="35" y="85" width="610" height="65" class="badge-blue"/>

  <g transform="translate(110, 90)">
    <!-- Fraccion A -->
    <g transform="translate(0, 0)">
      <text x="16" y="18" class="formula" text-anchor="middle">A₁</text>
      <line x1="0" y1="26" x2="32" y2="26" class="frac-line"/>
      <text x="16" y="46" class="formula" text-anchor="middle">A₂</text>
      <text x="16" y="58" class="tag-sub" text-anchor="middle">(Incógnita)</text>
    </g>

    <text x="50" y="34" class="formula">=</text>

    <!-- Fraccion B (Directa) -->
    <g transform="translate(80, 0)">
      <text x="16" y="18" class="formula" text-anchor="middle">B₁</text>
      <line x1="0" y1="26" x2="32" y2="26" class="frac-line"/>
      <text x="16" y="46" class="formula" text-anchor="middle">B₂</text>
      <text x="16" y="58" class="tag-sub" text-anchor="middle">(Directa)</text>
    </g>

    <text x="130" y="34" class="formula">·</text>

    <!-- Fraccion C (Inversa) -->
    <g transform="translate(155, 0)">
      <text x="16" y="18" class="formula" text-anchor="middle">C₂</text>
      <line x1="0" y1="26" x2="32" y2="26" class="frac-line"/>
      <text x="16" y="46" class="formula" text-anchor="middle">C₁</text>
      <text x="16" y="58" class="tag-sub" text-anchor="middle">(Inversa)</text>
    </g>

    <text x="205" y="34" class="formula">·</text>

    <!-- Fraccion D -->
    <g transform="translate(230, 0)">
      <text x="16" y="18" class="formula" text-anchor="middle">D₁</text>
      <line x1="0" y1="26" x2="32" y2="26" class="frac-line"/>
      <text x="16" y="46" class="formula" text-anchor="middle">D₂</text>
      <text x="16" y="58" class="tag-sub" text-anchor="middle">(Directa)</text>
    </g>

    <text x="285" y="34" class="formula">···</text>
  </g>

  <!-- 2 Cards explicativas -->
  <rect x="20" y="172" width="310" height="92" class="card"/>
  <rect x="35" y="182" width="140" height="24" class="badge-green"/>
  <text x="105" y="198" text-anchor="middle" class="text-green">Multi-Magnitud</text>
  <text x="35" y="226" class="text-main">Conecta ≥ 3 variables:</text>
  <text x="35" y="248" class="math-bold">Obreros, días, horas/día, obra, costo</text>

  <rect x="350" y="172" width="310" height="92" class="card"/>
  <rect x="365" y="182" width="140" height="24" class="badge-amber"/>
  <text x="435" y="198" text-anchor="middle" class="text-amber">Análisis por Pares</text>
  <text x="365" y="226" class="text-main">Se compara cada variable:</text>
  <text x="365" y="248" class="math-bold">Respecto a la incógnita por separado</text>
</svg>
