<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">DUALIDAD</text>
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Relación entre Logaritmo y Potencia</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Dualidad estructural: el logaritmo despeja el exponente de la potencia</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 18)">
        <rect width="650" height="75" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">LAS DOS CARAS DE LA MISMA ECUACIÓN</text>
        <text x="325" y="54" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Forma Potencia: b<tspan baseline-shift="super" font-size="70%">c</tspan> = a   ⟷   Forma Logarítmica: log<tspan baseline-shift="sub" font-size="70%">b</tspan>(a) = c</text>
      </g>
      <g transform="translate(25, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Identidades Fundamentales</text>
        <text x="20" y="54" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">• b<tspan baseline-shift="super" font-size="70%">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(a)</tspan> = a</text>
        <text x="20" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">• log<tspan baseline-shift="sub" font-size="70%">b</tspan>(b<tspan baseline-shift="super" font-size="70%">c</tspan>) = c</text>
        <text x="20" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">La exponencial y el logaritmo se cancelan mutuamente.</text>
        <text x="20" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Funciones inversas</text>
      </g>
      <g transform="translate(365, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Correspondencia de Roles</text>
        <text x="20" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5">• <tspan fill="#38bdf8" font-weight="700">Base:</tspan> Sigue siendo la base en ambos formatos.</text>
        <text x="20" y="76" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5">• <tspan fill="#fbbf24" font-weight="700">Exponente:</tspan> Pasa a ser el resultado del logaritmo.</text>
        <text x="20" y="100" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5">• <tspan fill="#34d399" font-weight="700">Potencia:</tspan> Pasa a ser el argumento del logaritmo.</text>
        <text x="20" y="130" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Misma relación matemática</text>
      </g>
    </g>

</svg>
