<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">TRICOTOMÍA</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ley de Tricotomía en los Enteros</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Para cualquier par de enteros a y b, se cumple exactamente una de tres relaciones</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Formula Banner -->
      <g transform="translate(25, 20)">
        <rect width="650" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ENUNCIADO FORMAL DE LA LEY DE TRICOTOMÍA</text>
        <text x="325" y="48" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">∀ a, b ∈ ℤ : (a &lt; b)  ⊻  (a = b)  ⊻  (a &gt; b)</text>
      </g>

      <!-- Three mutually exclusive cases -->
      <g transform="translate(25, 95)">
        <rect width="200" height="145" rx="8" fill="#0f172a" stroke="#f87171"/>
        <circle cx="30" cy="25" r="10" fill="#f87171"/>
        <text x="30" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
        <text x="50" y="30" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Caso: a &lt; b</text>
        <text x="20" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• 'a' está a la izquierda de 'b'</text>
        <text x="20" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Diferencia b - a &gt; 0</text>
        <text x="20" y="115" fill="#f8fafc" font-family="monospace" font-size="12">-4 &lt; 3</text>
      </g>

      <g transform="translate(250, 95)">
        <rect width="200" height="145" rx="8" fill="#0f172a" stroke="#fbbf24"/>
        <circle cx="30" cy="25" r="10" fill="#fbbf24"/>
        <text x="30" y="29" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
        <text x="50" y="30" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Caso: a = b</text>
        <text x="20" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Mismo punto en la recta</text>
        <text x="20" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Diferencia b - a = 0</text>
        <text x="20" y="115" fill="#f8fafc" font-family="monospace" font-size="12">-5 = -5</text>
      </g>

      <g transform="translate(475, 95)">
        <rect width="200" height="145" rx="8" fill="#0f172a" stroke="#34d399"/>
        <circle cx="30" cy="25" r="10" fill="#34d399"/>
        <text x="30" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
        <text x="50" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Caso: a &gt; b</text>
        <text x="20" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• 'a' está a la derecha de 'b'</text>
        <text x="20" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Diferencia a - b &gt; 0</text>
        <text x="20" y="115" fill="#f8fafc" font-family="monospace" font-size="12">8 &gt; -2</text>
      </g>
    </g>

</svg>
