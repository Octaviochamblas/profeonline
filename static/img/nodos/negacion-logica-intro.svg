<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18.5" font-weight="800" letter-spacing="0.01em">Negación Lógica — Conectivo Unario (¬p / ~p)</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Inversión de Valor de Verdad</text>
    <text x="44" y="140" fill="#475569" font-size="12.5">La negación invierte el valor veritativo al opuesto exacto.</text>

    <rect x="54" y="165" width="120" height="70" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="114" y="195" fill="#065f46" font-size="13.5" font-weight="700" text-anchor="middle">Proposición p</text>
    <text x="114" y="222" fill="#059669" font-size="18" font-weight="800" text-anchor="middle">VERDADERO (V)</text>

    <text x="204" y="208" fill="#64748b" font-size="22" font-weight="900" text-anchor="middle">⇄</text>

    <rect x="234" y="165" width="130" height="70" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="299" y="195" fill="#991b1b" font-size="13.5" font-weight="700" text-anchor="middle">Negación ¬p</text>
    <text x="299" y="222" fill="#dc2626" font-size="18" font-weight="800" text-anchor="middle">FALSO (F)</text>

    <rect x="44" y="255" width="320" height="115" rx="10" fill="#f1f5f9"/>
    <text x="56" y="280" fill="#334155" font-size="12.5" font-weight="700">Traducciones en Lenguaje Natural:</text>
    <text x="56" y="304" fill="#475569" font-size="12">• "No p" / "No ocurre que p"</text>
    <text x="56" y="326" fill="#475569" font-size="12">• "No es cierto que p" / "Es falso que p"</text>
    <text x="56" y="350" fill="#0f766e" font-size="12" font-weight="700">Regla: Invierte el valor absoluto del enunciado.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Tabla de Verdad Canónica</text>

    <rect x="446" y="145" width="145" height="40" fill="#0f172a" rx="6"/>
    <text x="518" y="171" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">p</text>

    <rect x="601" y="145" width="145" height="40" fill="#1d4ed8" rx="6"/>
    <text x="673" y="171" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">¬p</text>

    <rect x="446" y="195" width="145" height="45" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="518" y="224" fill="#059669" font-size="17" font-weight="800" text-anchor="middle">V</text>

    <rect x="601" y="195" width="145" height="45" fill="#fef2f2" stroke="#fecaca"/>
    <text x="673" y="224" fill="#dc2626" font-size="17" font-weight="800" text-anchor="middle">F</text>

    <rect x="446" y="245" width="145" height="45" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="518" y="274" fill="#dc2626" font-size="17" font-weight="800" text-anchor="middle">F</text>

    <rect x="601" y="245" width="145" height="45" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="673" y="274" fill="#059669" font-size="17" font-weight="800" text-anchor="middle">V</text>

    <rect x="446" y="305" width="300" height="65" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="460" y="328" fill="#1e40af" font-size="12" font-weight="700">Doble Negación (Ley de Involución):</text>
    <text x="460" y="352" fill="#1d4ed8" font-size="13" font-weight="800">¬(¬p) ≡ p (Vuelve al estado inicial)</text>
  </g>

</svg>
