<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Verificación de serie</text>
  <text x="35" y="85" class="text-step">Comprobar si 6/2 = 15/5 = 21/7 forman serie:</text>
  <text x="35" y="115" class="text-step">Paso 1: Calcular cada valor de razón</text>
  <text x="35" y="140" class="math">6/2 = 3,  15/5 = 3,  21/7 = 3</text>
  <text x="35" y="170" class="text-step">Paso 2: Conclusión</text>
  <text x="35" y="195" class="math">Comparten el valor k = 3</text>
  <text x="35" y="235" class="res">Sí forman una serie de razones</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Despejar incógnita en serie</text>
  <text x="365" y="85" class="text-step">Si x/3 = y/4 = z/5 = 10:</text>
  <text x="365" y="115" class="text-step">Paso 1: Multiplicar cada consecuente por k</text>
  <text x="365" y="140" class="math">x = 3 · 10 = 30</text>
  <text x="365" y="165" class="math">y = 4 · 10 = 40</text>
  <text x="365" y="190" class="math">z = 5 · 10 = 50</text>
  <text x="365" y="235" class="res">x = 30, y = 40, z = 50</text>
</svg>
