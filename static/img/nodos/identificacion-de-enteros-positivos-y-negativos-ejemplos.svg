<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS GUIADOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Modelación de Situaciones Reales con Signos</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Asignación de enteros positivos y negativos según el contexto físico</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <!-- Case 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Altitud / Profundidad</text>

        <rect x="15" y="45" width="190" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cima de volcán a 2.500 m:</text>
        <text x="25" y="95" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">+2500 ∈ ℤ⁺</text>

        <rect x="15" y="120" width="190" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="143" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Submarino a 150 m bajo mar:</text>
        <text x="25" y="170" fill="#f87171" font-family="monospace" font-size="13" font-weight="700">-150 ∈ ℤ⁻</text>

        <rect x="15" y="195" width="190" height="60" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="218" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Nivel del mar (origen):</text>
        <text x="25" y="242" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">0 (Referencia)</text>
      </g>

      <!-- Case 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Finanzas / Saldos</text>

        <rect x="15" y="45" width="190" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Abono de $50.000:</text>
        <text x="25" y="95" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">+50000 ∈ ℤ⁺</text>

        <rect x="15" y="120" width="190" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="143" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Deuda pendiente de $12.000:</text>
        <text x="25" y="170" fill="#f87171" font-family="monospace" font-size="13" font-weight="700">-12000 ∈ ℤ⁻</text>

        <rect x="15" y="195" width="190" height="60" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="218" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cuenta en cero:</text>
        <text x="25" y="242" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">$0 (Sin deuda)</text>
      </g>

      <!-- Case 3 -->
      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <text x="20" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Temperatura</text>

        <rect x="15" y="45" width="190" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sensación térmica cálida:</text>
        <text x="25" y="95" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">+31 °C ∈ ℤ⁺</text>

        <rect x="15" y="120" width="190" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
        <text x="25" y="143" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Helada en la cordillera:</text>
        <text x="25" y="170" fill="#f87171" font-family="monospace" font-size="13" font-weight="700">-8 °C ∈ ℤ⁻</text>

        <rect x="15" y="195" width="190" height="60" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="218" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Punto de congelación:</text>
        <text x="25" y="242" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">0 °C (Transición)</text>
      </g>
    </g>

</svg>
