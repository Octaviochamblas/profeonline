<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Ejemplos Guiados — Tabla de Disyunción</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Evaluación de Fila 2 (V ∨ F)</text>

    <rect x="44" y="135" width="320" height="45" rx="8" fill="#f1f5f9"/>
    <text x="56" y="163" fill="#0f172a" font-size="14.5" font-weight="800">" 8 es par  ∨  3 es par "</text>

    <rect x="44" y="190" width="150" height="55" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="119" y="212" fill="#065f46" font-size="11" text-anchor="middle">Premisa p: 8 es par</text>
    <text x="119" y="233" fill="#059669" font-size="14" font-weight="800" text-anchor="middle">Verdadero (V)</text>

    <rect x="214" y="190" width="150" height="55" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="289" y="212" fill="#991b1b" font-size="11" text-anchor="middle">Premisa q: 3 es par</text>
    <text x="289" y="233" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">Falso (F)</text>

    <rect x="44" y="255" width="320" height="65" rx="10" fill="#10b981"/>
    <text x="204" y="280" fill="#ecfdf5" font-size="12.5" text-anchor="middle">Resultado de tabla: V ∨ F</text>
    <text x="204" y="306" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">VERDADERO (V)</text>
    <text x="204" y="350" fill="#475569" font-size="11.5" text-anchor="middle">Basta que una premisa sea verdadera.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-rose)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">Evaluación de Fila 4 (F ∨ F)</text>

    <rect x="436" y="135" width="320" height="45" rx="8" fill="#f1f5f9"/>
    <text x="448" y="163" fill="#0f172a" font-size="14" font-weight="800">" 2 &gt; 5  ∨  10 &lt; 3 "</text>

    <rect x="436" y="190" width="150" height="55" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="511" y="212" fill="#991b1b" font-size="11" text-anchor="middle">Premisa p: 2 &gt; 5</text>
    <text x="511" y="233" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">Falso (F)</text>

    <rect x="606" y="190" width="150" height="55" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="681" y="212" fill="#991b1b" font-size="11" text-anchor="middle">Premisa q: 10 &lt; 3</text>
    <text x="681" y="233" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">Falso (F)</text>

    <rect x="436" y="255" width="320" height="65" rx="10" fill="#ef4444"/>
    <text x="596" y="280" fill="#fee2e2" font-size="12.5" text-anchor="middle">Resultado de tabla: F ∨ F</text>
    <text x="596" y="306" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">FALSO (F)</text>
    <text x="596" y="350" fill="#475569" font-size="11.5" text-anchor="middle">Único caso donde la disyunción falla.</text>
  </g>

</svg>
