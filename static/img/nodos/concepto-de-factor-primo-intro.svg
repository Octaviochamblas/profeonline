<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="lightShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">FACTORIZACIÓN</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Concepto de Factor Primo</text>
    <text x="0" y="74" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Un factor primo es un número primo que divide de forma exacta a un número dado</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#lightShadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="26" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DEFINICIÓN DE FACTOR PRIMO</text>
        <text x="325" y="50" fill="#059669" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">p es factor primo de n  ⟺  p ∈ ℙ  ∧  p | n  (p divide a n)</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Divisores vs Factores Primos</text>
        <text x="20" y="55" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11">Ejemplo con n = 12:</text>
        <text x="20" y="78" fill="#475569" font-family="monospace" font-size="12">• Divisores: D(12) = {1, 2, 3, 4, 6, 12}</text>
        <text x="20" y="102" fill="#059669" font-family="monospace" font-size="12">• Factores primos: {2, 3}</text>
        <text x="20" y="125" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Solo se seleccionan los primos de D(n)</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#d97706" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Propiedad Fundamental</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Todo compuesto n &gt; 1 tiene al menos</text>
        <text x="20" y="78" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11">un factor primo p ≤ √<tspan style="text-decoration: overline">n</tspan>.</text>
        <text x="20" y="102" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Los factores primos son los 'ladrillos'</text>
        <text x="20" y="125" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Generan multiplicativamente el número</text>
      </g>
    </g>

</svg>
