<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Lectura de Regiones — 2 Conjuntos</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">DIAGRAMAS VENN</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-emerald)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Traducción de Lenguaje Natural</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Mapeo riguroso de expresiones verbales a operaciones de conjuntos.</text>

    <!-- Visual Box -->
    <rect x="44" y="165" width="320" height="65" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text x="204" y="208" fill="#047857" font-size="20" font-weight="900" text-anchor="middle">Lenguaje  ⟺  Álgebra de Conjuntos</text>

    <rect x="44" y="245" width="320" height="125" rx="10" fill="#f1f5f9"/>
    <text x="56" y="272" fill="#334155" font-size="12.5" font-weight="700">Equivalencias Clave:</text>
    <text x="56" y="295" fill="#475569" font-size="12">• "Solo A" = A \ B  |  "Ambos" = A ∩ B.</text>
    <text x="56" y="317" fill="#475569" font-size="12">• "Al menos uno" = A ∪ B.</text>
    <text x="56" y="342" fill="#047857" font-size="12" font-weight="700">• "Exactamente uno" = A △ B  |  "Ninguno" = (A ∪ B)ᶜ.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Mapa de Regiones y Operaciones</text>

    <rect x="436" y="140" width="320" height="55" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="448" y="162" fill="#1e40af" font-size="11.5" font-weight="700">1. Al menos uno (Unión):</text>
    <text x="448" y="183" fill="#1d4ed8" font-size="12.5" font-weight="800">A ∪ B = Solo A + Solo B + Ambos</text>

    <rect x="436" y="205" width="320" height="55" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="448" y="227" fill="#7e22ce" font-size="11.5" font-weight="700">2. A lo sumo uno:</text>
    <text x="448" y="248" fill="#6b21a8" font-size="12.5" font-weight="800">|U| - |A ∩ B| = Solo A + Solo B + Ninguno</text>

    <rect x="436" y="270" width="320" height="55" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="448" y="292" fill="#0f766e" font-size="11.5" font-weight="700">3. Ni A ni B (Exterior):</text>
    <text x="448" y="313" fill="#042f2e" font-size="12.5" font-weight="800">(A ∪ B)ᶜ = Aᶜ ∩ Bᶜ (Leyes de De Morgan)</text>

    <text x="596" y="355" fill="#475569" font-size="10.5" text-anchor="middle">Cada frase activa una zona en las 4 regiones.</text>
  </g>

</svg>
