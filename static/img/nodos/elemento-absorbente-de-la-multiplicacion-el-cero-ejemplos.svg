<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Anulación por Multiplicación por Cero</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Aplicación en productos extensos y resolución de ecuaciones factorizadas</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Producto Simple</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Operación:</text>
        <text x="25" y="108" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">(-94) · 0 = 0</text>

        <text x="20" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cualquier entero,</text>
        <text x="20" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">sin importar cuán grande</text>
        <text x="20" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">o negativo sea, da 0.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Anulación directa</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Producto Largo</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <text x="25" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Expresión:</text>
        <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="11">(-3)·8·(-15)·0·42</text>

        <text x="20" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Basta que UN factor</text>
        <text x="20" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">sea cero para que TODA</text>
        <text x="20" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">la multiplicación sea 0.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Resultado = 0</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Ecuación (x-3)(x+5)=0</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Dos soluciones:</text>
        <text x="25" y="108" fill="#fbbf24" font-family="monospace" font-size="12">x - 3 = 0  ⟹  x = 3</text>

        <text x="20" y="150" fill="#fbbf24" font-family="monospace" font-size="12">x + 5 = 0  ⟹  x = -5</text>
        <text x="20" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Al menos uno de los</text>
        <text x="20" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">factores debe anularse.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ x ∈ {3, -5}</text>
      </g>
    </g>

</svg>
