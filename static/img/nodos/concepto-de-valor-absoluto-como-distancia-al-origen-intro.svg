<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">VALOR ABSOLUTO</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Valor Absoluto como Distancia al Origen</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Interpretación geométrica: magnitud no negativa de la separación hasta el cero</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Graphic showing distance to 0 -->
      <g transform="translate(25, 25)">
        <rect width="650" height="110" rx="8" fill="#0f172a" stroke="#38bdf8"/>

        <!-- Number line -->
        <line x1="50" y1="65" x2="600" y2="65" stroke="#94a3b8" stroke-width="2"/>

        <!-- -4 point -->
        <circle cx="150" cy="65" r="6" fill="#f87171"/>
        <text x="150" y="90" fill="#f87171" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">-4</text>

        <!-- 0 point -->
        <circle cx="325" cy="65" r="6" fill="#fbbf24"/>
        <text x="325" y="90" fill="#fbbf24" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">0</text>

        <!-- +4 point -->
        <circle cx="500" cy="65" r="6" fill="#34d399"/>
        <text x="500" y="90" fill="#34d399" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">+4</text>

        <!-- Distance arc left -->
        <path d="M 150 45 Q 237 20 325 45" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4"/>
        <text x="237" y="25" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Distancia = |-4| = 4</text>

        <!-- Distance arc right -->
        <path d="M 325 45 Q 412 20 500 45" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4"/>
        <text x="412" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Distancia = |+4| = 4</text>
      </g>

      <!-- Bottom explanation cards -->
      <g transform="translate(25, 150)">
        <rect width="310" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Propiedad de No Negatividad</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Una distancia física NUNCA es negativa.</text>
        <text x="20" y="74" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ |x| ≥ 0 para todo número x ∈ ℤ</text>
      </g>

      <g transform="translate(365, 150)">
        <rect width="310" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Distancia Nula</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• El único punto con distancia 0 es el origen:</text>
        <text x="20" y="74" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ |x| = 0  ⟺  x = 0</text>
      </g>
    </g>

</svg>
