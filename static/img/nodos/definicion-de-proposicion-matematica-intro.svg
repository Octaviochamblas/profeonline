<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 16; }
      .card-prop { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; rx: 16; }
      .card-noprop { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; rx: 16; }
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 18px; fill: #64748b; text-anchor: middle; }
      .section-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; }
      .text-prop { fill: #166534; }
      .text-noprop { fill: #991b1b; }
      .item-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 600; fill: #1e293b; }
      .item-desc { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 15px; fill: #475569; }
      .badge-v { fill: #22c55e; }
      .badge-f { fill: #ef4444; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .tag { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" class="bg"/>

  <!-- Header -->
  <text x="600" y="55" class="title">¿Qué es una Proposición Matemática?</text>
  <text x="600" y="85" class="subtitle">Es un enunciado declarativo que afirma o niega algo, teniendo un único valor de verdad objetivo (Verdadero o Falso).</text>

  <!-- Left Column: SÍ son Proposiciones -->
  <g transform="translate(60, 115)">
    <rect width="510" height="510" class="card-prop" filter="url(#shadow)"/>

    <!-- Header Left -->
    <circle cx="50" cy="50" r="22" fill="#22c55e"/>
    <text x="50" y="50" class="badge-text">✓</text>
    <text x="85" y="57" class="section-title text-prop">SÍ son Proposiciones Matemáticas</text>

    <!-- Subtitle Left -->
    <rect x="30" y="90" width="450" height="42" rx="8" fill="#dcfce7"/>
    <text x="255" y="116" class="tag" fill="#15803d">TIENEN UN VALOR DE VERDAD OBJETIVO Y EXCLUYENTE (V o F)</text>

    <!-- Item 1 -->
    <rect x="30" y="145" width="450" height="95" class="card"/>
    <circle cx="65" cy="192" r="18" class="badge-v"/>
    <text x="65" y="192" class="badge-text" font-size="16">V</text>
    <text x="95" y="180" class="item-title">"El número 8 es un número par"</text>
    <text x="95" y="208" class="item-desc">Afirmación declarativa comprobable: es <tspan font-weight="700" fill="#16a34a">Verdadera</tspan>.</text>

    <!-- Item 2 -->
    <rect x="30" y="255" width="450" height="95" class="card"/>
    <circle cx="65" cy="302" r="18" class="badge-f"/>
    <text x="65" y="302" class="badge-text" font-size="16">F</text>
    <text x="95" y="290" class="item-title">"3 + 5 = 10"</text>
    <text x="95" y="318" class="item-desc">Es una proposición válida, aunque sea <tspan font-weight="700" fill="#dc2626">Falsa</tspan>.</text>

    <!-- Item 3 -->
    <rect x="30" y="365" width="450" height="120" class="card"/>
    <circle cx="65" cy="425" r="18" fill="#3b82f6"/>
    <text x="65" y="425" class="badge-text" font-size="16">★</text>
    <text x="95" y="400" class="item-title">Regla de Oro:</text>
    <text x="95" y="426" class="item-desc">No puede ser Verdadera y Falsa al mismo tiempo</text>
    <text x="95" y="450" class="item-desc">(Principio de No Contradicción: <tspan font-weight="700">v(p) ∈ {V, F}</tspan>).</text>
  </g>

  <!-- Right Column: NO son Proposiciones -->
  <g transform="translate(630, 115)">
    <rect width="510" height="510" class="card-noprop" filter="url(#shadow)"/>

    <!-- Header Right -->
    <circle cx="50" cy="50" r="22" fill="#ef4444"/>
    <text x="50" y="50" class="badge-text">✕</text>
    <text x="85" y="57" class="section-title text-noprop">NO son Proposiciones Matemáticas</text>

    <!-- Subtitle Right -->
    <rect x="30" y="90" width="450" height="42" rx="8" fill="#fee2e2"/>
    <text x="255" y="116" class="tag" fill="#b91c1c">CARECEN DE UN VALOR DE VERDAD OBJETIVO O INDIVIDUAL</text>

    <!-- Item 1: Preguntas -->
    <rect x="30" y="145" width="450" height="75" class="card"/>
    <text x="50" y="180" class="item-title">❓ Preguntas:</text>
    <text x="160" y="180" class="item-desc">"¿Cuál es el valor de x?"</text>
    <text x="50" y="205" class="item-desc" font-style="italic" fill="#94a3b8">No afirman nada, solo solicitan información.</text>

    <!-- Item 2: Órdenes -->
    <rect x="30" y="230" width="450" height="75" class="card"/>
    <text x="50" y="265" class="item-title">❗ Órdenes / Mandatos:</text>
    <text x="235" y="265" class="item-desc">"¡Calcula la derivada!"</text>
    <text x="50" y="290" class="item-desc" font-style="italic" fill="#94a3b8">Son instrucciones, no tienen valor de verdad.</text>

    <!-- Item 3: Opiniones -->
    <rect x="30" y="315" width="450" height="75" class="card"/>
    <text x="50" y="350" class="item-title">💬 Opiniones subjetivas:</text>
    <text x="245" y="350" class="item-desc">"El álgebra es divertida"</text>
    <text x="50" y="375" class="item-desc" font-style="italic" fill="#94a3b8">Dependen del gusto personal de cada individuo.</text>

    <!-- Item 4: Enunciados abiertos -->
    <rect x="30" y="400" width="450" height="85" class="card"/>
    <text x="50" y="435" class="item-title">⚠️ Variables libres:</text>
    <text x="210" y="435" class="item-desc">"x + 4 = 10"</text>
    <text x="50" y="462" class="item-desc" font-style="italic" fill="#94a3b8">Enunciado abierto: no es proposición hasta definir el valor de x.</text>
  </g>
</svg>
