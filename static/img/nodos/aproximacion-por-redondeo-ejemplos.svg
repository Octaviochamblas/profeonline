<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Ejemplos: Aproximación por Redondeo</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Evaluación de la cifra descartada para decidir conservar o incrementar +1</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3.74 a décimas</text>

        <rect x="15" y="65" width="190" height="75" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="88" fill="#38bdf8" font-family="monospace" font-size="11">Retenida: 7</text>
        <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="11">Siguiente: 4 (&lt; 5)</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">= 3.7 ✓</text>

        <text x="20" y="170" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">Queda igual</text>
        <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Distancia a 3.7 es 0.04.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Redondeo = 3.7</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2.137 a centésimas</text>

        <rect x="15" y="65" width="190" height="75" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <text x="25" y="88" fill="#38bdf8" font-family="monospace" font-size="11">Retenida: 3</text>
        <text x="25" y="108" fill="#38bdf8" font-family="monospace" font-size="11">Siguiente: 7 (≥ 5)</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">3 + 1 = 4 ➔ 2.14 ✓</text>

        <text x="20" y="170" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">Sube en +1</text>
        <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Distancia a 2.14 es 0.003.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Redondeo = 2.14</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">8.97 a décimas</text>

        <rect x="15" y="65" width="190" height="75" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="88" fill="#fbbf24" font-family="monospace" font-size="11">Retenida: 9</text>
        <text x="25" y="108" fill="#fbbf24" font-family="monospace" font-size="11">Siguiente: 7 (≥ 5)</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">9 + 1 = 10 ➔ 9.0 ✓</text>

        <text x="20" y="170" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">Efecto Reserva</text>
        <text x="20" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">El 9 pasa a 0 y suma 1 al 8.</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Redondeo = 9.0</text>
      </g>
    </g>

</svg>
