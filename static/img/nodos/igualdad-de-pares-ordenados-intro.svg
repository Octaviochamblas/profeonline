<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Igualdad de Pares Ordenados</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">PROD. CARTESIANO</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-indigo)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Axioma de Igualdad</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Dos pares son idénticos si y solo si coinciden entrada por entrada.</text>

    <!-- Visual Box -->
    <rect x="44" y="165" width="320" height="65" rx="10" fill="#faf5ff" stroke="#a855f7"/>
    <text x="204" y="208" fill="#7e22ce" font-size="16" font-weight="900" text-anchor="middle">(a, b) = (c, d) ⟺ a = c ∧ b = d</text>

    <rect x="44" y="245" width="320" height="125" rx="10" fill="#f1f5f9"/>
    <text x="56" y="272" fill="#334155" font-size="12.5" font-weight="700">Implicaciones Algebraicas:</text>
    <text x="56" y="295" fill="#475569" font-size="12">• Desacopla 1 ecuación vectorial en 2 escalares.</text>
    <text x="56" y="317" fill="#475569" font-size="12">• Primera componente: a = c.</text>
    <text x="56" y="342" fill="#7e22ce" font-size="12" font-weight="700">• Segunda componente: b = d.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">Sistema de Ecuaciones 2x2</text>

    <rect x="446" y="140" width="300" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

    <rect x="466" y="155" width="120" height="38" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="526" y="179" fill="#1e40af" font-size="13" font-weight="800" text-anchor="middle">a = c</text>

    <rect x="606" y="155" width="120" height="38" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="666" y="179" fill="#0f766e" font-size="13" font-weight="800" text-anchor="middle">b = d</text>

    <text x="596" y="222" fill="#64748b" font-size="11.5" font-weight="700" text-anchor="middle">Ambas condiciones son simultáneas (AND)</text>
    <text x="596" y="242" fill="#0f172a" font-size="12" font-weight="800" text-anchor="middle">Basta que una falle para que (a,b) ≠ (c,d)</text>

    <rect x="436" y="275" width="320" height="95" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="596" y="305" fill="#0f766e" font-size="12" font-weight="800" text-anchor="middle">Bifurcación Algorítmica</text>
    <text x="596" y="330" fill="#042f2e" font-size="13.5" font-weight="900" text-anchor="middle">Ecuación 1 ∩ Ecuación 2</text>
    <text x="596" y="352" fill="#475569" font-size="10.5" text-anchor="middle">Resolución independiente de cada variable.</text>
  </g>

</svg>
