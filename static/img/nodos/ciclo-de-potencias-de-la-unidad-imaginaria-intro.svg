<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .badge-cell { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .math-val { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #1d4ed8; }
      .math-res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #15803d; }
      .desc-small { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .rule-banner { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; rx: 8; }
      .rule-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #166534; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="15" width="640" height="48" class="header-box"/>
  <text x="340" y="38" text-anchor="middle" class="title">CICLO DE POTENCIAS DE 'i' (PERÍODO 4)</text>
  <text x="340" y="52" text-anchor="middle" class="text-main">Las potencias enteras de la unidad imaginaria se repiten en un ciclo cerrado de 4 valores</text>

  <!-- 4 Cajas del ciclo -->
  <g transform="translate(20, 75)">
    <!-- r = 0 -->
    <rect x="0" y="0" width="150" height="100" class="card"/>
    <rect x="10" y="10" width="130" height="30" class="badge-cell"/>
    <text x="75" y="30" text-anchor="middle" class="math-val">i<tspan baseline-shift="super" font-size="70%">0</tspan> = 1</text>
    <text x="75" y="65" text-anchor="middle" class="desc-small">Resto r = 0</text>
    <text x="75" y="85" text-anchor="middle" class="math-res">Resultado = 1</text>

    <!-- r = 1 -->
    <rect x="163" y="0" width="150" height="100" class="card"/>
    <rect x="173" y="10" width="130" height="30" class="badge-cell"/>
    <text x="238" y="30" text-anchor="middle" class="math-val">i<tspan baseline-shift="super" font-size="70%">1</tspan> = i</text>
    <text x="238" y="65" text-anchor="middle" class="desc-small">Resto r = 1</text>
    <text x="238" y="85" text-anchor="middle" class="math-res">Resultado = i</text>

    <!-- r = 2 -->
    <rect x="326" y="0" width="150" height="100" class="card"/>
    <rect x="336" y="10" width="130" height="30" class="badge-cell"/>
    <text x="401" y="30" text-anchor="middle" class="math-val">i<tspan baseline-shift="super" font-size="70%">2</tspan> = −1</text>
    <text x="401" y="65" text-anchor="middle" class="desc-small">Resto r = 2</text>
    <text x="401" y="85" text-anchor="middle" class="math-res">Resultado = −1</text>

    <!-- r = 3 -->
    <rect x="490" y="0" width="150" height="100" class="card"/>
    <rect x="500" y="10" width="130" height="30" class="badge-cell"/>
    <text x="565" y="30" text-anchor="middle" class="math-val">i<tspan baseline-shift="super" font-size="70%">3</tspan> = −i</text>
    <text x="565" y="65" text-anchor="middle" class="desc-small">Resto r = 3</text>
    <text x="565" y="85" text-anchor="middle" class="math-res">Resultado = −i</text>
  </g>

  <!-- Banner algoritmo division por 4 -->
  <rect x="20" y="190" width="640" height="75" class="rule-banner"/>
  <text x="340" y="215" text-anchor="middle" class="rule-title">ALGORITMO: DIVIDIR EL EXPONENTE POR 4 Y TOMAR EL RESTO</text>
  <text x="340" y="245" text-anchor="middle" class="math-val">i<tspan baseline-shift="super" font-size="70%">k</tspan> = i<tspan baseline-shift="super" font-size="70%">4q + r</tspan> = (i<tspan baseline-shift="super" font-size="70%">4</tspan>)<tspan baseline-shift="super" font-size="70%">q</tspan> · i<tspan baseline-shift="super" font-size="70%">r</tspan> = 1<tspan baseline-shift="super" font-size="70%">q</tspan> · i<tspan baseline-shift="super" font-size="70%">r</tspan> = i<tspan baseline-shift="super" font-size="70%">r</tspan>    (r ∈ {0, 1, 2, 3})</text>
</svg>
