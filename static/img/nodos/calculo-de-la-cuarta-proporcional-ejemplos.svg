<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Cuarta proporcional de 3, 5 y 12</text>
  <text x="35" y="85" class="text-step">Plantear la proporción en orden: 3/5 = 12/x</text>
  <text x="35" y="115" class="text-step">Paso 1: Multiplicar medios</text>
  <text x="35" y="140" class="math">5 · 12 = 60</text>
  <text x="35" y="170" class="text-step">Paso 2: Dividir por el extremo conocido 3</text>
  <g transform="translate(35, 185)">
    <text x="0" y="18" class="math">x =</text>
    <g transform="translate(30, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">60</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">3</text>
    </g>
    <text x="60" y="18" class="math">= 20</text>
  </g>
  <text x="35" y="235" class="res">Cuarta proporcional x = 20</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Incógnita en otra posición</text>
  <text x="365" y="85" class="text-step">Hallar x en la proporción 8/x = 6/9</text>
  <text x="365" y="115" class="text-step">Paso 1: Multiplicar extremos conocidos</text>
  <text x="365" y="140" class="math">8 · 9 = 72</text>
  <text x="365" y="170" class="text-step">Paso 2: Dividir por el medio conocido 6</text>
  <g transform="translate(365, 185)">
    <text x="0" y="18" class="math">x =</text>
    <g transform="translate(30, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">72</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">6</text>
    </g>
    <text x="60" y="18" class="math">= 12</text>
  </g>
  <text x="365" y="235" class="res">Término x = 12</text>
</svg>
