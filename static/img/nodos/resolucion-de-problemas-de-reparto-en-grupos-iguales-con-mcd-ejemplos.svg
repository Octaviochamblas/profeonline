<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Problemas de Reparto Resueltos</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Determinación del tamaño de lote máximo y conteo de paquetes resultantes</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Corte de Cuerdas</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#34d399"/>
        <text x="25" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Cuerda A: 24 metros</text>
        <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Cuerda B: 36 metros</text>
        <text x="25" y="128" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">mcd(24, 36) = 12 m</text>

        <text x="20" y="180" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">Trozos de 12 m c/u</text>
        <text x="20" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total: 24/12 + 36/12</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ = 2 + 3 = 5 trozos</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bolsas de Fruta</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#38bdf8"/>
        <text x="25" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">48 manzanas, 72 peras</text>
        <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Bolsas idénticas máximas</text>
        <text x="25" y="128" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">mcd(48, 72) = 24</text>

        <text x="20" y="180" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">24 bolsas idénticas</text>
        <text x="20" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cada bolsa tendrá:</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 2 manz. y 3 peras</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Baldosas de Piso</text>

        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#fbbf24"/>
        <text x="25" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Habitación: 300 × 180 cm</text>
        <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Baldosas cuadradas máx</text>
        <text x="25" y="128" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">mcd(300, 180) = 60 cm</text>

        <text x="20" y="180" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">Lado baldosa: 60 cm</text>
        <text x="20" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total: (300/60)·(180/60)</text>
        <text x="20" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ = 5 · 3 = 15 baldosas</text>
      </g>
    </g>

</svg>
