<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Obreros y Tiempo</text>
  <text x="35" y="85" class="text-step">2 obreros = 12 días, 4 obreros = 6 días, 6 obreros = 4 días</text>
  <text x="35" y="115" class="text-step">Paso 1: Multiplicar obreros × días</text>
  <text x="35" y="140" class="math">2 · 12 = 24,   4 · 6 = 24,   6 · 4 = 24</text>
  <text x="35" y="170" class="text-step">Paso 2: Conclusión</text>
  <text x="35" y="195" class="math">Producto constante k = 24 obrero·días</text>
  <text x="35" y="235" class="res">Sí es Proporcionalidad Inversa</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Saldo y Gasto</text>
  <text x="365" y="85" class="text-step">Con $100.000: si gastas $20.000 quedan $80.000</text>
  <text x="365" y="115" class="text-step">Paso 1: Calcular producto gasto × saldo</text>
  <text x="365" y="140" class="math">20.000 · 80.000 = 1.600.000.000</text>
  <text x="365" y="170" class="text-step">Paso 2: Si gastas $40.000 quedan $60.000 (producto = 2.400.000.000)</text>
  <text x="365" y="195" class="math">Es suma constante (x + y = 100k), no producto</text>
  <text x="365" y="235" class="res" style="fill: #dc2626;">No es Proporcionalidad Inversa</text>
</svg>
