<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Uso de Contraejemplo en Universal</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-rose)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Asimetría de la Refutación</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Probar ∀ requiere infinitos casos; refutarlo exige solo 1.</text>

    <!-- Scale visual -->
    <rect x="44" y="165" width="145" height="65" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="116" y="190" fill="#1e40af" font-size="11" text-anchor="middle">Para Demostrar:</text>
    <text x="116" y="213" fill="#1d4ed8" font-size="13" font-weight="800" text-anchor="middle">100% de Casos</text>

    <rect x="204" y="165" width="160" height="65" rx="10" fill="#fef2f2" stroke="#ef4444"/>
    <text x="284" y="190" fill="#991b1b" font-size="11" text-anchor="middle">Para Refutar:</text>
    <text x="284" y="213" fill="#dc2626" font-size="13" font-weight="900" text-anchor="middle">SOLO 1 CASO (x₀)</text>

    <rect x="44" y="245" width="320" height="125" rx="10" fill="#f1f5f9"/>
    <text x="56" y="272" fill="#334155" font-size="12.5" font-weight="700">Requisitos del Contraejemplo:</text>
    <text x="56" y="295" fill="#475569" font-size="12">1. Pertenencia: x₀ ∈ U (debe estar en el dominio).</text>
    <text x="56" y="317" fill="#475569" font-size="12">2. Falsedad: P(x₀) = F (debe incumplir la condición).</text>
    <text x="56" y="342" fill="#991b1b" font-size="12" font-weight="700">Demuestra constructivamente: ∃x, ¬P(x).</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Ejemplo de Primalidad</text>

    <rect x="436" y="140" width="320" height="65" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="448" y="165" fill="#991b1b" font-size="12" font-weight="700">Afirmación Universal Falsa:</text>
    <text x="448" y="190" fill="#dc2626" font-size="14" font-weight="800">"Todo número primo es impar"</text>

    <rect x="436" y="215" width="320" height="65" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="448" y="240" fill="#065f46" font-size="12" font-weight="700">Contraejemplo Único:</text>
    <text x="448" y="265" fill="#059669" font-size="14.5" font-weight="900">p = 2  (Es primo Y es par)</text>

    <rect x="436" y="290" width="320" height="80" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="448" y="315" fill="#1e40af" font-size="11.5" font-weight="700">Veredicto lógico:</text>
    <text x="448" y="338" fill="#1d4ed8" font-size="13" font-weight="800">El caso p = 2 destruye la afirmación.</text>
    <text x="448" y="358" fill="#475569" font-size="10.5">No se requiere analizar más números primos.</text>
  </g>

</svg>
