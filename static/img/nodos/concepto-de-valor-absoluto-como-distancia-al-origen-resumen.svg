<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Síntesis: Valor Absoluto y Distancia</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Resumen de la definición geométrica y axiomas básicos de distancia</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 25)">
        <rect width="650" height="85" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">DEFINICIÓN GEOMÉTRICA FUNDAMENTAL</text>
        <text x="325" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">El valor absoluto |x| mide la distancia lineal entre 'x' y el origen '0'.</text>
      </g>

      <g transform="translate(25, 125)">
        <rect width="310" height="115" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Axioma de No Negatividad</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• ∀ x ∈ ℤ : |x| ≥ 0</text>
        <text x="20" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• |x| = 0 si y solo si x = 0</text>
        <text x="20" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Nunca puede dar un resultado negativo.</text>
      </g>

      <g transform="translate(365, 125)">
        <rect width="310" height="115" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Distancia entre Dos Puntos</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">La distancia entre 'a' y 'b' se define como:</text>
        <text x="20" y="74" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">d(a, b) = |a - b| = |b - a|</text>
        <text x="20" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Independiente del orden de resta.</text>
      </g>
    </g>

</svg>
