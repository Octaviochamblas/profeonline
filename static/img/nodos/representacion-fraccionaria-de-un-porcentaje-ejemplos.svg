<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Simplificar 75%</text>
  <text x="35" y="85" class="text-step">Expresar 75% como fracción irreductible:</text>
  <text x="35" y="115" class="text-step">Paso 1: Escribir como 75 / 100</text>
  <g transform="translate(35, 125)">
    <text x="0" y="18" class="math">75% =</text>
    <g transform="translate(40, 0)">
      <text x="15" y="12" class="math" text-anchor="middle">75</text>
      <line x1="0" y1="16" x2="30" y2="16" class="frac-line"/>
      <text x="15" y="30" class="math" text-anchor="middle">100</text>
    </g>
    <text x="80" y="18" class="math">⟹  (÷ 25) =</text>
    <g transform="translate(170, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">3</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">4</text>
    </g>
  </g>
  <text x="35" y="185" class="text-step">Paso 2: Significado</text>
  <text x="35" y="205" class="math">75% equivale a las tres cuartas partes (3/4)</text>
  <text x="35" y="235" class="res">75% = 3/4</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: De Fracción a Porcentaje</text>
  <text x="365" y="85" class="text-step">Convertir 2/5 a porcentaje:</text>
  <text x="365" y="115" class="text-step">Paso 1: Amplificar denominador a 100 (× 20)</text>
  <text x="365" y="140" class="math">(2 · 20) / (5 · 20) = 40 / 100</text>
  <text x="365" y="170" class="text-step">Paso 2: Leer porcentaje directo</text>
  <text x="365" y="195" class="math">40 / 100 = 40%</text>
  <text x="365" y="235" class="res">2/5 = 40%</text>
</svg>
