<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="82" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: Sustracción de Fracciones Homogéneas</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Algoritmo de cálculo, inverso aditivo y propiedades algebraicas</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">DEFINICIÓN MEDIANTE EL INVERSO ADITIVO</text>
        <text x="325" y="52" fill="#34d399" font-family="monospace" font-size="12.5" text-anchor="middle">a / d - b / d = a / d + (-b / d) = (a - b) / d</text>
        <text x="325" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Restar una fracción equivale a sumar su inverso aditivo o simétrico opuesto.</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">No Conmutativa</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">El orden de los términos importa:</text>
        <text x="20" y="74" fill="#38bdf8" font-family="monospace" font-size="11">a/d - b/d ≠ b/d - a/d</text>
        <text x="20" y="96" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Uno es el opuesto del otro.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cuidado con los Paréntesis</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Si restas una fracción negativa:</text>
        <text x="20" y="74" fill="#fbbf24" font-family="monospace" font-size="11">a/d - (-b/d) = (a + b)/d</text>
        <text x="20" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">El doble signo negativo se vuelve suma.</text>
      </g>
    </g>

</svg>
