<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">MATRIZ DE DECISIÓN</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Guía de Decisión: ¿MCM o MCD?</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Matriz comparativa para seleccionar la herramienta correcta según el objetivo del problema</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="310" height="225" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="155" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">USAR M.C.M.</text>
        <text x="155" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">(Buscar un número MAYOR o IGUAL)</text>

        <text x="20" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">• Coincidencia / Encuentro futuro</text>
        <text x="20" y="98" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">• Frecuencias y períodos repetitivos</text>
        <text x="20" y="121" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">• Mínima cantidad común requerida</text>
        <text x="20" y="144" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">• Emparejar compras (ej: salchichas y panes)</text>
        <rect x="20" y="170" width="270" height="35" rx="6" fill="#1e293b"/>
        <text x="155" y="192" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Resultado ≥ max(a, b)</text>
      </g>

      <g transform="translate(365, 20)">
        <rect width="310" height="225" rx="8" fill="#0f172a" stroke="#34d399"/>
        <text x="155" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">USAR M.C.D.</text>
        <text x="155" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">(Buscar un número MENOR o IGUAL)</text>

        <text x="20" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">• Repartos equitativos y divisiones</text>
        <text x="20" y="98" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">• Cortar objetos en partes iguales</text>
        <text x="20" y="121" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">• Máximo tamaño de porción posible</text>
        <text x="20" y="144" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11">• Baldosas máximas / Empaques óptimos</text>
        <rect x="20" y="170" width="270" height="35" rx="6" fill="#1e293b"/>
        <text x="155" y="192" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Resultado ≤ min(a, b)</text>
      </g>
    </g>

</svg>
