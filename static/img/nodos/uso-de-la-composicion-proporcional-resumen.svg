<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .rule-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .err-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #1d4ed8; }
      .err-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #991b1b; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="110" class="rule-box"/>
  <text x="40" y="48" class="title">PROPIEDAD DE COMPOSICIÓN</text>

  <g transform="translate(40, 60)">
    <g transform="translate(0, 0)">
      <text x="12" y="14" class="formula" text-anchor="middle">a</text>
      <line x1="0" y1="18" x2="24" y2="18" class="frac-line"/>
      <text x="12" y="34" class="formula" text-anchor="middle">b</text>
    </g>
    <text x="34" y="22" class="formula">=</text>
    <g transform="translate(54, 0)">
      <text x="12" y="14" class="formula" text-anchor="middle">c</text>
      <line x1="0" y1="18" x2="24" y2="18" class="frac-line"/>
      <text x="12" y="34" class="formula" text-anchor="middle">d</text>
    </g>
    <text x="90" y="22" class="formula">⟹</text>
    <g transform="translate(120, 0)">
      <text x="25" y="14" class="formula" text-anchor="middle">a + b</text>
      <line x1="0" y1="18" x2="50" y2="18" class="frac-line"/>
      <text x="25" y="34" class="formula" text-anchor="middle">b</text>
    </g>
    <text x="180" y="22" class="formula">=</text>
    <g transform="translate(200, 0)">
      <text x="25" y="14" class="formula" text-anchor="middle">c + d</text>
      <line x1="0" y1="18" x2="50" y2="18" class="frac-line"/>
      <text x="25" y="34" class="formula" text-anchor="middle">d</text>
    </g>
  </g>
  <text x="40" y="110" class="desc">Permite sustituir la suma conocida de dos incógnitas directamente en la proporción.</text>

  <rect x="20" y="145" width="640" height="115" class="err-box"/>
  <text x="40" y="172" class="err-text">¡ERROR FRECUENTE A EVITAR!</text>
  <text x="40" y="200" class="desc">❌ No olvidar sumar en AMBOS lados de la proporción (sumar solo en el lado izquierdo rompe la igualdad).</text>
  <text x="40" y="230" class="desc">❌ Mantener el mismo denominador de referencia en ambos miembros (ambos b y d, o ambos a y c).</text>
</svg>
