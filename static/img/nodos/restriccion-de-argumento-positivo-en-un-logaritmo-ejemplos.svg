<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Ejemplos: Argumento Positivo</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Evaluación de argumentos admisibles vs no admisibles</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#ef4444"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">log<tspan baseline-shift="sub" font-size="70%">2</tspan>(-8)</text>
        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#ef4444"/>
        <g transform="translate(25, 92)">
          <text x="75" y="5" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Arg: -8 &lt; 0</text>
          <text x="75" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">2<tspan baseline-shift="super" font-size="70%">c</tspan> &gt; 0 siempre</text>
        </g>
        <text x="20" y="175" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Negativo</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Fuera del dominio.</text>
        <text x="20" y="235" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✗ Indefinido en ℝ</text>
      </g>
      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#ef4444"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">log<tspan baseline-shift="sub" font-size="70%">10</tspan>(0)</text>
        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#ef4444"/>
        <g transform="translate(25, 92)">
          <text x="75" y="5" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Arg: a = 0</text>
          <text x="75" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">10<tspan baseline-shift="super" font-size="70%">c</tspan> jamás es 0</text>
        </g>
        <text x="20" y="175" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cero</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Asíntota vertical en x=0.</text>
        <text x="20" y="235" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✗ Indefinido</text>
      </g>
      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#10b981"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">log<tspan baseline-shift="sub" font-size="70%">2</tspan>(1/16)</text>
        <rect x="15" y="65" width="190" height="85" rx="6" fill="#0f172a" stroke="#34d399"/>
        <g transform="translate(25, 92)">
          <text x="20" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Arg =</text>
          <g transform="translate(48, 0)">
            <text x="10" y="-5" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">1</text>
            <line x1="0" y1="0" x2="20" y2="0" stroke="#34d399" stroke-width="1.2"/>
            <text x="10" y="13" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">16</text>
          </g>
          <text x="76" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">&gt; 0 ✓</text>
          <text x="125" y="5" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">= -4 ✓</text>
        </g>
        <text x="20" y="175" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Fracción Positiva</text>
        <text x="20" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1/16 &gt; 0 es válido.</text>
        <text x="20" y="235" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ = -4</text>
      </g>
    </g>

</svg>
