<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SUCESOR</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Concepto de Sucesor de un Número (n + 1)</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">El entero inmediatamente superior obtenido sumando una unidad: suc(n) = n + 1</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="335" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="335" height="40" rx="12" fill="#1e293b" opacity="0.6"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Fórmula del Sucesor</text>

        <rect x="20" y="60" width="295" height="50" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="167" y="92" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">suc(n) = n + 1</text>

        <text x="20" y="140" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Propiedades del Sucesor en ℤ:</text>
        <text x="20" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• En ℤ, TODO número entero tiene sucesor único.</text>
        <text x="20" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Geométricamente: 1 paso a la derecha.</text>
        <text x="20" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Alternancia de paridad: suc(par) = impar.</text>
        <text x="20" y="240" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ n &lt; suc(n) estrictamente</text>
      </g>

      <g transform="translate(365, 0)">
        <rect width="335" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="335" height="40" rx="12" fill="#1e293b" opacity="0.6"/>
        <text x="20" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">El Sucesor en Negativos</text>

        <rect x="20" y="55" width="295" height="60" rx="8" fill="#0f172a" stroke="#f87171"/>
        <text x="32" y="78" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Sucesor de -1 es 0</text>
        <text x="32" y="100" fill="#f8fafc" font-family="monospace" font-size="12">-1 + 1 = 0</text>

        <rect x="20" y="125" width="295" height="60" rx="8" fill="#0f172a" stroke="#f87171"/>
        <text x="32" y="148" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Sucesor de -8 es -7</text>
        <text x="32" y="170" fill="#f8fafc" font-family="monospace" font-size="12">-8 + 1 = -7  (¡NO es -9!)</text>

        <rect x="20" y="195" width="295" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="32" y="218" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Regla Mnemotécnica</text>
        <text x="32" y="240" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">Sumar 1 siempre acerca el negativo a cero.</text>
      </g>
    </g>

</svg>
