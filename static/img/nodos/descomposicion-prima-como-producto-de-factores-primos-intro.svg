<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="lightShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">FACTORIZACIÓN</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Descomposición en Factores Primos</text>
    <text x="0" y="74" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Expresión de un número compuesto como producto de potencias de números primos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#lightShadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="26" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FORMA CANÓNICA DE FACTORIZACIÓN PRIMA</text>
        <text x="325" y="50" fill="#059669" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">n = p₁^{a₁} · p₂^{a₂} · ... · p_k^{a_k}  (p_i ∈ ℙ, a_i ∈ ℕ)</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Notación con Exponentes</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">En lugar de escribir factores repetidos:</text>
        <text x="20" y="78" fill="#0f172a" font-family="monospace" font-size="12">72 = 2 · 2 · 2 · 3 · 3</text>
        <text x="20" y="102" fill="#059669" font-family="monospace" font-size="13" font-weight="700">➔ Forma Canónica: 72 = 2³ · 3²</text>
        <text x="20" y="125" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Exponentes indican multiplicidad</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#d97706" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Propiedades Esenciales</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Las bases p_i son primos distintos.</text>
        <text x="20" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Los exponentes a_i son enteros ≥ 1.</text>
        <text x="20" y="102" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11">• Si n es primo, su forma es p¹.</text>
        <text x="20" y="125" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Representación estándar y universal</text>
      </g>
    </g>

</svg>
