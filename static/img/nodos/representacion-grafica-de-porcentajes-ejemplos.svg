<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Graficar 40% en cuadrícula</text>
  <text x="35" y="85" class="text-step">En una cuadrícula de 100 casillas:</text>
  <text x="35" y="115" class="text-step">Paso 1: Cada casilla = 1%</text>
  <text x="35" y="140" class="math">40% = 40 casillas pintadas de 100</text>
  <text x="35" y="170" class="text-step">Paso 2: Fracción simplificada</text>
  <text x="35" y="195" class="math">40 / 100 = 4 / 10 = 2 / 5 del total</text>
  <text x="35" y="235" class="res">Pintar 4 filas completas de 10</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Gráfico circular de 25%</text>
  <text x="365" y="85" class="text-step">Representar 25% en un círculo:</text>
  <text x="365" y="115" class="text-step">Paso 1: Calcular el ángulo del sector</text>
  <text x="365" y="140" class="math">Ángulo = 0,25 · 360° = 90°</text>
  <text x="365" y="170" class="text-step">Paso 2: Interpretación geométrica</text>
  <text x="365" y="195" class="math">Un ángulo recto (exactamente 1/4 del círculo)</text>
  <text x="365" y="235" class="res">Sector de 90° = 1/4 de vuelta</text>
</svg>
