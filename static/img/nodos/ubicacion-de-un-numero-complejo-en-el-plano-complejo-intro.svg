<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #334155; }
      .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e40af; }
      .point-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #dc2626; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 3 3; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .vector { stroke: #dc2626; stroke-width: 2; marker-end: url(#arrow-red); }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="15" width="640" height="45" class="header-box"/>
  <text x="340" y="38" text-anchor="middle" class="title">PLANO COMPLEJO (PLANO DE ARGAND-GAUSS)</text>
  <text x="340" y="52" text-anchor="middle" class="text-main">Eje horizontal = Eje Real (Re) | Eje vertical = Eje Imaginario (Im)</text>

  <!-- Grafico del plano -->
  <g transform="translate(60, 75)">
    <!-- Ejes -->
    <line x1="20" y1="90" x2="260" y2="90" class="axis"/>
    <line x1="140" y1="10" x2="140" y2="170" class="axis"/>
    <text x="260" y="85" class="axis-label">Re</text>
    <text x="145" y="22" class="axis-label">Im</text>

    <!-- Punto z = 3 + 2i -> (140 + 60, 90 - 45) = (200, 45) -->
    <line x1="200" y1="90" x2="200" y2="45" class="grid-line"/>
    <line x1="140" y1="45" x2="200" y2="45" class="grid-line"/>
    <line x1="140" y1="90" x2="197" y2="47" class="vector"/>
    <circle cx="200" cy="45" r="4.5" fill="#dc2626"/>
    <text x="210" y="42" class="point-label">z = (a, b) = a + bi</text>
    <text x="200" y="105" text-anchor="middle" font-size="12px" fill="#475569">a</text>
    <text x="125" y="50" font-size="12px" fill="#475569">b</text>
  </g>

  <!-- Panel descriptivo derecho -->
  <rect x="360" y="75" width="300" height="185" class="card"/>
  <text x="375" y="102" font-weight="bold" fill="#1e3a8a">Cuadrantes del Plano:</text>
  <text x="375" y="128" class="text-main">• <tspan font-weight="bold">I Cuadrante:</tspan> a &gt; 0, b &gt; 0 (ej: 3 + 2i)</text>
  <text x="375" y="153" class="text-main">• <tspan font-weight="bold">II Cuadrante:</tspan> a &lt; 0, b &gt; 0 (ej: −4 + 3i)</text>
  <text x="375" y="178" class="text-main">• <tspan font-weight="bold">III Cuadrante:</tspan> a &lt; 0, b &lt; 0 (ej: −2 − 5i)</text>
  <text x="375" y="203" class="text-main">• <tspan font-weight="bold">IV Cuadrante:</tspan> a &gt; 0, b &lt; 0 (ej: 5 − i)</text>
  <text x="375" y="235" font-size="12px" fill="#15803d" font-weight="bold">Afijo: punto P(a, b) que representa a z.</text>
</svg>
