<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 327" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="327" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="79.4" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="179.7" y="14.0" width="280.6" height="51.4"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 105.4)">
    <rect width="640" height="85.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">Para multiplicar tres o más polinomios se multiplican los dos</tspan>
      <tspan x="25" y="41">primeros, el resultado se multiplica por el tercero, y así</tspan>
      <tspan x="25" y="58">sucesivamente hasta agotar todos los factores.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 200.4)">
    <rect width="640" height="107.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Intentar multiplicar los tres polinomios de forma simultánea mezclando</tspan>
      <tspan x="25" y="57">términos de los tres.</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="78">Distribuir un polinomio sobre los dos siguientes a la vez.</tspan>
    </text>
  </g>
</svg>
