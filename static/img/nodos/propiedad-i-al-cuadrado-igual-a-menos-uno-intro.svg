<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 24px; font-weight: bold; fill: #1d4ed8; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 6; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; }
      .math-bold { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="50" class="header-box"/>
  <text x="340" y="45" text-anchor="middle" class="title">PROPIEDAD FUNDAMENTAL: i<tspan baseline-shift="super" font-size="70%">2</tspan> = −1</text>
  <text x="340" y="60" text-anchor="middle" class="text-main">El axioma central que conecta el mundo imaginario con los números reales</text>

  <!-- Formula central -->
  <rect x="20" y="85" width="640" height="75" class="card"/>
  <rect x="40" y="98" width="600" height="48" class="badge-blue"/>
  <text x="340" y="130" text-anchor="middle" class="formula">i<tspan baseline-shift="super" font-size="70%">2</tspan> = −1</text>

  <!-- 2 Cards explicativas -->
  <rect x="20" y="175" width="310" height="85" class="card"/>
  <rect x="35" y="185" width="130" height="24" class="badge-green"/>
  <text x="100" y="201" text-anchor="middle" class="text-green">Cuadrado de (bi)</text>
  <text x="35" y="228" class="text-main">Genera un número real negativo:</text>
  <text x="35" y="248" class="math-bold">(b · i)<tspan baseline-shift="super" font-size="70%">2</tspan> = b<tspan baseline-shift="super" font-size="70%">2</tspan> · i<tspan baseline-shift="super" font-size="70%">2</tspan> = −b<tspan baseline-shift="super" font-size="70%">2</tspan></text>

  <rect x="350" y="175" width="310" height="85" class="card"/>
  <rect x="365" y="185" width="130" height="24" class="badge-amber"/>
  <text x="430" y="201" text-anchor="middle" class="text-amber">Regla de Signos</text>
  <text x="365" y="228" class="text-main">Multiplicar por i<tspan baseline-shift="super" font-size="70%">2</tspan> cambia el signo:</text>
  <text x="365" y="248" class="math-bold">(−i)<tspan baseline-shift="super" font-size="70%">2</tspan> = (−1)<tspan baseline-shift="super" font-size="70%">2</tspan> · i<tspan baseline-shift="super" font-size="70%">2</tspan> = 1 · (−1) = −1</text>
</svg>
