<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .rule-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .err-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #1d4ed8; }
      .err-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #991b1b; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="15" width="640" height="118" class="rule-box"/>
  <text x="40" y="40" class="title">FÓRMULA DIRECTA DE CÁLCULO</text>

  <g transform="translate(40, 50)">
    <text x="0" y="30" class="formula">Parte = Total ·</text>
    <g transform="translate(130, 0)">
      <text x="20" y="16" class="formula" text-anchor="middle"><tspan font-style="italic">c</tspan></text>
      <line x1="0" y1="22" x2="40" y2="22" class="frac-line"/>
      <text x="20" y="40" class="formula" text-anchor="middle">100</text>
    </g>
    <text x="185" y="30" class="formula">= Total · <tspan font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="70%">dec</tspan></text>
  </g>
  <text x="40" y="118" class="desc">La preposición "de" en matemáticas se traduce formalmente en una multiplicación.</text>

  <rect x="20" y="145" width="640" height="118" class="err-box"/>
  <text x="40" y="172" class="err-text">¡ERROR FRECUENTE A EVITAR!</text>
  <text x="40" y="200" class="desc">❌ Dividir el total directamente por c (ej: calcular 20% dividiendo por 20 en vez de multiplicar por 0,20).</text>
  <text x="40" y="230" class="desc">❌ Multiplicar por c sin dividir entre 100 al final.</text>
</svg>
