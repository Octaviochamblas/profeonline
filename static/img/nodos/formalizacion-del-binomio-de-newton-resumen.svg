<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 324" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="324" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="76.7" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="204.0" y="14" width="232.0" height="48.7"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 102.7)">
    <rect width="640" height="85.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">El Teorema del Binomio proporciona la fórmula cerrada para</tspan>
      <tspan x="25" y="41">desarrollar cualquier potencia entera positiva de un binomio</tspan>
      <tspan x="25" y="58">mediante combinatorias y potencias complementarias.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 197.7)">
    <rect width="640" height="107.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Olvidar que la expansión de grado n contiene exactamente n + 1 términos.</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="63">Elevar incorrectamente las potencias de b cuando b contiene un</tspan>
      <tspan x="25" y="78">coeficiente numérico.</tspan>
    </text>
  </g>
</svg>
