<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">AMPLIFICACIÓN</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Amplificación de Fracciones</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Multiplicación de numerador y denominador por un mismo entero k ≠ 0</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ALGORITMO DE AMPLIFICACIÓN</text>
        <text x="325" y="50" fill="#34d399" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">(a / b) · (k / k) = (a · k) / (b · k)   (con k ≠ 0)</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Multiplicar por 1 (Neutro)</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Como k/k = 1, multiplicar por k/k</text>
        <text x="20" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">NO cambia el valor de la fracción:</text>
        <text x="20" y="102" fill="#38bdf8" font-family="monospace" font-size="12">3/4 · (2/2) = 6/8 = 0.75</text>
        <text x="20" y="125" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Equivalencia matemática exacta</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Homogeneización de Denominadores</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Objetivo principal en la PAES:</text>
        <text x="20" y="78" fill="#fbbf24" font-family="monospace" font-size="11">1/3 y 1/4 ➔ MCM(3,4) = 12</text>
        <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Amplificar: 1/3 (x4) = 4/12, 1/4 (x3) = 3/12.</text>
        <text x="20" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Suma directa: 4/12 + 3/12 = 7/12</text>
      </g>
    </g>

</svg>
