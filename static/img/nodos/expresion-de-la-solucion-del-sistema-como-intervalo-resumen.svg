<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 310" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="310" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="79.4" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="265.2" y="14.0" width="109.6" height="51.4"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 105.4)">
    <rect width="640" height="68.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">La formalización del conjunto solución resume la intersección de</tspan>
      <tspan x="25" y="41">todas las ramas en un intervalo único o en el conjunto vacío.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 183.4)">
    <rect width="640" height="107.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Omitir el conjunto solución y entregar únicamente las inecuaciones</tspan>
      <tspan x="25" y="57">intermedias.</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="78">Escribir incorrectamente los símbolos de inclusión de los extremos.</tspan>
    </text>
  </g>
</svg>
