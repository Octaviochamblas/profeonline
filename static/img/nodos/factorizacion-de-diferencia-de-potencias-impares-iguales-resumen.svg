<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 312" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="312" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="79.6" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="138.7" y="14" width="362.6" height="51.6"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 105.6)">
    <rect width="640" height="85.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">La diferencia de potencias de igual exponente es divisible por (A -</tspan>
      <tspan x="25" y="41">B), dando como cociente un polinomio completo y homogéneo donde</tspan>
      <tspan x="25" y="58">todos los términos tienen signo positivo (+).</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 200.6)">
    <rect width="640" height="92.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Poner signos alternados en el cociente de una resta de potencias.</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="63">Omitir términos intermedios en la degradación de potencias.</tspan>
    </text>
  </g>
</svg>
