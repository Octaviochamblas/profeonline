<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">El Par Ordenado (a, b)</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">PROD. CARTESIANO</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Estructura Posicional</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Tupla de 2 elementos donde la posición fija el rol matemático.</text>

    <!-- Visual Box -->
    <rect x="44" y="165" width="320" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="204" y="198" fill="#1e40af" font-size="22" font-weight="900" text-anchor="middle">( a , b )</text>
    <text x="140" y="222" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">1° Componente</text>
    <text x="268" y="222" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">2° Componente</text>

    <rect x="44" y="250" width="320" height="120" rx="10" fill="#f1f5f9"/>
    <text x="56" y="275" fill="#334155" font-size="12.5" font-weight="700">Diferencia con Conjuntos:</text>
    <text x="56" y="298" fill="#475569" font-size="12">• Conjunto: {a, b} = {b, a} (sin orden).</text>
    <text x="56" y="320" fill="#475569" font-size="12">• Par: (a, b) ≠ (b, a) si a ≠ b (con orden).</text>
    <text x="56" y="345" fill="#1d4ed8" font-size="12" font-weight="700">Admite repetición: (a, a) es un par válido.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">Visualización en Cuadrícula</text>

    <rect x="446" y="135" width="300" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Axes -->
    <line x1="475" y1="240" x2="720" y2="240" stroke="#64748b" stroke-width="2"/>
    <line x1="475" y1="240" x2="475" y2="150" stroke="#64748b" stroke-width="2"/>

    <!-- Point (2, 4) -->
    <circle cx="535" cy="180" r="5" fill="#2563eb"/>
    <text x="545" y="175" fill="#1e40af" font-size="12" font-weight="900">(2, 4)</text>
    <line x1="535" y1="240" x2="535" y2="180" stroke="#93c5fd" stroke-dasharray="3,3"/>
    <line x1="475" y1="180" x2="535" y2="180" stroke="#93c5fd" stroke-dasharray="3,3"/>

    <!-- Point (4, 2) -->
    <circle cx="655" cy="210" r="5" fill="#0d9488"/>
    <text x="665" y="205" fill="#0f766e" font-size="12" font-weight="900">(4, 2)</text>
    <line x1="655" y1="240" x2="655" y2="210" stroke="#99f6e4" stroke-dasharray="3,3"/>
    <line x1="475" y1="210" x2="655" y2="210" stroke="#99f6e4" stroke-dasharray="3,3"/>

    <rect x="436" y="275" width="320" height="95" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="596" y="305" fill="#0f766e" font-size="12" font-weight="800" text-anchor="middle">No Conmutatividad Visual</text>
    <text x="596" y="330" fill="#042f2e" font-size="13.5" font-weight="900" text-anchor="middle">(2, 4) ≠ (4, 2)</text>
    <text x="596" y="352" fill="#475569" font-size="10.5" text-anchor="middle">Representan posiciones espaciales distintas.</text>
  </g>

</svg>
