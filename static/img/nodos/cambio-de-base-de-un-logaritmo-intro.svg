<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .math-term { font-family: "Cambria Math", "Times New Roman", serif; font-size: 20px; font-weight: bold; fill: #1d4ed8; }
      .frac-line { stroke: #1d4ed8; stroke-width: 2; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 6; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; }
      .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="50" class="header-box"/>
  <text x="340" y="45" text-anchor="middle" class="title">PROPIEDAD: CAMBIO DE BASE</text>
  <text x="340" y="60" text-anchor="middle" class="text-main">Permite reescribir cualquier logaritmo como el cociente vertical en una nueva base c</text>

  <!-- Formula central -->
  <rect x="20" y="85" width="640" height="75" class="card"/>
  <rect x="40" y="95" width="600" height="55" class="badge-blue"/>
  <g transform="translate(180, 100)">
    <text x="0" y="28" class="math-term">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(a) = </text>
    <!-- Fraccion log_c(a) / log_c(b) -->
    <text x="140" y="16" text-anchor="middle" class="math-term">log<tspan baseline-shift="sub" font-size="70%">c</tspan>(a)</text>
    <line x1="85" y1="22" x2="195" y2="22" class="frac-line"/>
    <text x="140" y="38" text-anchor="middle" class="math-term">log<tspan baseline-shift="sub" font-size="70%">c</tspan>(b)</text>
  </g>

  <!-- 2 Cards explicativas -->
  <rect x="20" y="175" width="310" height="85" class="card"/>
  <rect x="35" y="185" width="130" height="24" class="badge-green"/>
  <text x="100" y="201" text-anchor="middle" class="text-green">Base Decimal (10)</text>
  <g transform="translate(35, 222)">
    <text x="0" y="18" class="text-bold">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(a) = </text>
    <text x="95" y="8" text-anchor="middle" class="text-bold">log(a)</text>
    <line x1="68" y1="13" x2="122" y2="13" stroke="#0f172a" stroke-width="1.5"/>
    <text x="95" y="25" text-anchor="middle" class="text-bold">log(b)</text>
    <text x="135" y="18" class="text-bold">(calculadora)</text>
  </g>

  <rect x="350" y="175" width="310" height="85" class="card"/>
  <rect x="365" y="185" width="130" height="24" class="badge-amber"/>
  <text x="430" y="201" text-anchor="middle" class="text-amber">Base Natural (e)</text>
  <g transform="translate(365, 222)">
    <text x="0" y="18" class="text-bold">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(a) = </text>
    <text x="90" y="8" text-anchor="middle" class="text-bold">ln(a)</text>
    <line x1="68" y1="13" x2="112" y2="13" stroke="#0f172a" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" class="text-bold">ln(b)</text>
    <text x="125" y="18" class="text-bold">(cálculo analítico)</text>
  </g>
</svg>
