<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 338" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="338" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="58.0" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="198.9" y="14" width="242.2" height="20.1"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 84.0)">
    <rect width="640" height="102.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">El producto de dos monomios es otro monomio cuyo coeficiente es el</tspan>
      <tspan x="25" y="41">producto de los coeficientes originales y cuya parte literal</tspan>
      <tspan x="25" y="58">contiene todas las variables elevadas a la suma de sus respectivos</tspan>
      <tspan x="25" y="75">exponentes.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 196.0)">
    <rect width="640" height="122.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Multiplicar los exponentes de las letras (hacer x² · x³ = x⁶ en vez de</tspan>
      <tspan x="25" y="57">x⁵).</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="78">Sumar los coeficientes en lugar de multiplicarlos (hacer 3 · 4 = 7 en</tspan>
      <tspan x="25" y="93">vez de 12).</tspan>
    </text>
  </g>
</svg>
