<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Tabla de Verdad del Condicional (p → q)</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-amber)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Estructura Causal Asimétrica</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">El antecedente impone una condición al consecuente.</text>

    <rect x="44" y="160" width="320" height="85" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="204" y="190" fill="#991b1b" font-size="14" font-weight="800" text-anchor="middle">Fila 2 (Única Falsa — Promesa Rota):</text>
    <text x="204" y="225" fill="#dc2626" font-size="20" font-weight="900" text-anchor="middle">V  →  F  =  FALSO (F)</text>

    <rect x="44" y="260" width="320" height="110" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="56" y="285" fill="#065f46" font-size="13" font-weight="800">Filas 1, 3 y 4 (Verdaderas):</text>
    <text x="56" y="310" fill="#059669" font-size="15" font-weight="800">V→V = V  |  F→V = V  |  F→F = V</text>
    <text x="56" y="345" fill="#065f46" font-size="12">Vector resultante: v(p → q) = [V, F, V, V]ᵀ.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Tabla Canónica Completa</text>

    <rect x="440" y="140" width="85" height="35" fill="#0f172a" rx="5"/>
    <text x="482" y="163" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">p</text>
    <rect x="535" y="140" width="85" height="35" fill="#0f172a" rx="5"/>
    <text x="577" y="163" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">q</text>
    <rect x="630" y="140" width="115" height="35" fill="#b45309" rx="5"/>
    <text x="687" y="163" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">p → q</text>

    <rect x="440" y="180" width="305" height="34" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="482" y="202" fill="#059669" font-size="15" font-weight="700" text-anchor="middle">V</text>
    <text x="577" y="202" fill="#059669" font-size="15" font-weight="700" text-anchor="middle">V</text>
    <text x="687" y="202" fill="#059669" font-size="16" font-weight="800" text-anchor="middle">V</text>

    <rect x="440" y="218" width="305" height="36" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="4"/>
    <text x="482" y="242" fill="#059669" font-size="16" font-weight="800" text-anchor="middle">V</text>
    <text x="577" y="242" fill="#dc2626" font-size="16" font-weight="800" text-anchor="middle">F</text>
    <text x="687" y="242" fill="#dc2626" font-size="17" font-weight="900" text-anchor="middle">F  ✗ Único</text>

    <rect x="440" y="258" width="305" height="34" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="482" y="280" fill="#dc2626" font-size="15" font-weight="700" text-anchor="middle">F</text>
    <text x="577" y="280" fill="#059669" font-size="15" font-weight="700" text-anchor="middle">V</text>
    <text x="687" y="280" fill="#059669" font-size="16" font-weight="800" text-anchor="middle">V  (Vacuo)</text>

    <rect x="440" y="296" width="305" height="34" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
    <text x="482" y="318" fill="#dc2626" font-size="15" font-weight="700" text-anchor="middle">F</text>
    <text x="577" y="318" fill="#dc2626" font-size="15" font-weight="700" text-anchor="middle">F</text>
    <text x="687" y="318" fill="#059669" font-size="16" font-weight="800" text-anchor="middle">V  (Vacuo)</text>

    <text x="592" y="358" fill="#92400e" font-size="11.5" font-weight="700" text-anchor="middle">Falso únicamente cuando V → F.</text>
  </g>

</svg>
