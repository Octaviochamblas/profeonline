<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Síntesis: Criterio de Divisibilidad por 9</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Prueba del nueve, propiedades modulares y cálculo instantáneo de residuos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">REGLA DE LA RAÍZ DIGITAL MÓDULO 9</text>
        <text x="325" y="52" fill="#0f172a" font-family="monospace" font-size="14" text-anchor="middle">9 | n  ⟺  Raíz Digital de n = 9  (o suma iterada = 9)</text>
        <text x="325" y="74" fill="#059669" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Si se suman las cifras repetidamente hasta 1 dígito, debe resultar exactamente 9.</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Técnica de Cancelación de Nueves</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Al sumar, eliminar dígitos 9 y pares que</text>
        <text x="20" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="11">sumen 9 (1+8, 2+7, 3+6, 4+5):</text>
        <text x="20" y="96" fill="#059669" font-family="system-ui, sans-serif" font-size="11">Ej: 9.812.745 ➔ todo cancela ➔ 9 | n.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#d97706" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Invarianza ante Permutaciones</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Cualquier anagrama numérico de 'n'</text>
        <text x="20" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="11">tiene la misma divisibilidad por 9:</text>
        <text x="20" y="96" fill="#0284c7" font-family="system-ui, sans-serif" font-size="11">Si 9 | 1.458 ⟹ 9 | 8.541 ⟹ 9 | 5.814.</text>
      </g>
    </g>

</svg>
