<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="0.02em">Jerarquía y Prioridad de Conectivos Lógicos</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="752" height="310" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="24" y="80" width="752" height="6" fill="url(#grad-blue)" rx="3"/>

    <!-- Ladder of hierarchy -->
    <text x="44" y="115" fill="#0f172a" font-size="17" font-weight="800">Escala de Precedencia Estándar (De Mayor a Menor Jerarquía)</text>

    <!-- Tier 1: Parentesis -->
    <rect x="44" y="135" width="712" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="54" y="142" width="28" height="28" rx="14" fill="#1d4ed8"/>
    <text x="68" y="161" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">1</text>
    <text x="96" y="162" fill="#1e40af" font-size="15" font-weight="800">Delimitadores: ( ) , [ ] , { }</text>
    <text x="550" y="162" fill="#1d4ed8" font-size="13" font-weight="700">MÁXIMA PRIORIDAD (Fuerzan el orden)</text>

    <!-- Tier 2: Negacion -->
    <rect x="44" y="185" width="712" height="42" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="54" y="192" width="28" height="28" rx="14" fill="#0f766e"/>
    <text x="68" y="211" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">2</text>
    <text x="96" y="212" fill="#0f766e" font-size="15" font-weight="800">Negación: ¬ (o ~)</text>
    <text x="550" y="212" fill="#0f766e" font-size="13" font-weight="700">Afecta solo a la variable más próxima</text>

    <!-- Tier 3: Conjuncion & Disyuncion -->
    <rect x="44" y="235" width="712" height="42" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="54" y="242" width="28" height="28" rx="14" fill="#7e22ce"/>
    <text x="68" y="261" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">3</text>
    <text x="96" y="261" fill="#7e22ce" font-size="15" font-weight="800">Conjunción y Disyunción: ∧ , ∨ , ⊕</text>
    <text x="550" y="261" fill="#7e22ce" font-size="13" font-weight="700">Se evalúan antes de las implicaciones</text>

    <!-- Tier 4: Condicional y Bicondicional -->
    <rect x="44" y="285" width="712" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="54" y="292" width="28" height="28" rx="14" fill="#475569"/>
    <text x="68" y="311" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">4</text>
    <text x="96" y="311" fill="#334155" font-size="15" font-weight="800">Condicional y Bicondicional: → , ↔</text>
    <text x="550" y="311" fill="#475569" font-size="13" font-weight="700">Conectores principales de cierre</text>

    <text x="400" y="360" fill="#0f766e" font-size="13.5" font-weight="700" text-anchor="middle">Convención general: Sin paréntesis, la evaluación procede de mayor a menor jerarquía.</text>
  </g>

</svg>
