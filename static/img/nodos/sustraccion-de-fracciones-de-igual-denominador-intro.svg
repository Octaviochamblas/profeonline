<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="82" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">RESTA HOMOGÉNEA</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Sustracción con Igual Denominador</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Resta de porciones homogéneas: restar numeradores y conservar el denominador común</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FÓRMULA GENERAL DE LA SUSTRACCIÓN HOMOGÉNEA</text>
        <text x="325" y="50" fill="#34d399" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">a / d - b / d = (a - b) / d   (con d ≠ 0)</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Resta Directa de Numeradores</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">De 7 octavos quitamos 3 octavos:</text>
        <text x="20" y="78" fill="#38bdf8" font-family="monospace" font-size="12">7/8 - 3/8 = (7 - 3)/8 = 4/8</text>
        <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Al simplificar por 4: = 1/2.</text>
        <text x="20" y="125" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Conserva el tamaño de la parte</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Resultados Negativos</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Si el sustraendo es mayor al minuendo:</text>
        <text x="20" y="78" fill="#fbbf24" font-family="monospace" font-size="12">2/7 - 6/7 = (2 - 6)/7 = -4/7</text>
        <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">El resultado es un número racional negativo.</text>
        <text x="20" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Manejo riguroso del signo</text>
      </g>
    </g>

</svg>
