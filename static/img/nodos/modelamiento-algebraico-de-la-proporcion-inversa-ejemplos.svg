<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Modelar llenado de estanque</text>
  <text x="35" y="85" class="text-step">3 bombas tardan 8 horas en llenar un estanque:</text>
  <text x="35" y="115" class="text-step">Paso 1: Hallar constante k (bomba·horas)</text>
  <text x="35" y="140" class="math">k = 3 · 8 = 24 bomba·horas</text>
  <text x="35" y="170" class="text-step">Paso 2: Escribir la función modelo T(n)</text>
  <g transform="translate(35, 185)">
    <text x="0" y="18" class="math">T(n) =</text>
    <g transform="translate(45, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">24</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">n</text>
    </g>
  </g>
  <text x="35" y="235" class="res">Modelo: T(n) = 24 / n</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Predecir con el modelo</text>
  <text x="365" y="85" class="text-step">Usando T(n) = 24/n, ¿cuánto tardan 6 bombas?</text>
  <text x="365" y="115" class="text-step">Paso 1: Evaluar n = 6</text>
  <g transform="translate(365, 125)">
    <text x="0" y="18" class="math">T(6) =</text>
    <g transform="translate(45, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">24</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">6</text>
    </g>
    <text x="75" y="18" class="math">= 4 horas</text>
  </g>
  <text x="365" y="185" class="text-step">Paso 2: Interpretación</text>
  <text x="365" y="205" class="text-step">Al duplicar bombas (3 a 6), el tiempo se reduce a la mitad (8 a 4)</text>
  <text x="365" y="235" class="res">Tiempo = 4 horas</text>
</svg>
