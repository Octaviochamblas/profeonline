<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">EJEMPLOS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Ejemplos: Suma Digital para Divisibilidad por 9</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Cálculo de raíz digital y determinación de divisibilidad por 9</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <g transform="translate(0, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#3b82f6"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Evaluar 58.293</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#3b82f6"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Suma de cifras:</text>
        <text x="25" y="108" fill="#1d4ed8" font-family="monospace" font-size="13" font-weight="700">5+8+2+9+3 = 27</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">27 es múltiplo de 9</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">(9 · 3 = 27).</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">58293 ÷ 9 = 6477 (exacto).</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Divisible por 9</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#ef4444"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Evaluar 4.125</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#ef4444"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Suma de cifras:</text>
        <text x="25" y="108" fill="#dc2626" font-family="monospace" font-size="13" font-weight="700">4+1+2+5 = 12</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">12 es múltiplo de 3,</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">pero NO es múltiplo de 9.</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Resto = 12 - 9 = 3.</text>
        <text x="20" y="230" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="600">❌ NO divisible por 9</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
        <circle cx="35" cy="30" r="14" fill="#f59e0b"/>
        <text x="35" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
        <text x="60" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Incógnita 3A81</text>

        <rect x="15" y="65" width="190" height="55" rx="6" fill="#ffffff" stroke="#f59e0b"/>
        <text x="25" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">3 + A + 8 + 1 = 12 + A</text>
        <text x="25" y="108" fill="#d97706" font-family="monospace" font-size="12">12 + A ∈ M(9)</text>

        <text x="20" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="11">El siguiente múltiplo</text>
        <text x="20" y="170" fill="#475569" font-family="system-ui, sans-serif" font-size="11">de 9 es 18:</text>
        <text x="20" y="190" fill="#475569" font-family="system-ui, sans-serif" font-size="11">12 + A = 18 ⟹ A = 6.</text>
        <text x="20" y="230" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Solución única A = 6</text>
      </g>
    </g>

</svg>
