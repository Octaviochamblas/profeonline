<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="0.02em">Ejemplos de Negación en Aritmética y Álgebra</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <rect x="44" y="100" width="90" height="24" rx="12" fill="#ccfbf1"/>
    <text x="89" y="116" fill="#0f766e" font-size="11" font-weight="800" text-anchor="middle">EJEMPLO 1</text>
    <text x="44" y="148" fill="#0f172a" font-size="16" font-weight="800">Negación de Desigualdades</text>

    <rect x="44" y="165" width="320" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="188" fill="#64748b" font-size="12">Enunciado original p:</text>
    <text x="56" y="206" fill="#0f172a" font-size="15" font-weight="700">"x &gt; 5"   (x es mayor estricto que 5)</text>

    <text x="204" y="235" fill="#0d9488" font-size="18" font-weight="900" text-anchor="middle">↓ Negar (¬p)</text>

    <rect x="44" y="248" width="320" height="60" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="56" y="270" fill="#0f766e" font-size="12">Complemento estricto:</text>
    <text x="56" y="295" fill="#0f766e" font-size="17" font-weight="800">¬(x &gt; 5)  ≡  "x ≤ 5"</text>

    <text x="44" y="335" fill="#dc2626" font-size="12" font-weight="700">⚠ Error: Negar x &gt; 5 como x &lt; 5 (olvida el =).</text>
    <text x="44" y="355" fill="#16a34a" font-size="12" font-weight="700">✓ Correcto: El complemento de &gt; incluye al ≤.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <rect x="436" y="100" width="90" height="24" rx="12" fill="#dbeafe"/>
    <text x="481" y="116" fill="#1d4ed8" font-size="11" font-weight="800" text-anchor="middle">EJEMPLO 2</text>
    <text x="436" y="148" fill="#0f172a" font-size="16" font-weight="800">Negación de Cuantificadores</text>

    <rect x="436" y="165" width="320" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="448" y="188" fill="#64748b" font-size="12">Afirmación universal:</text>
    <text x="448" y="206" fill="#0f172a" font-size="14" font-weight="700">"Todos los primos son impares" (F)</text>

    <text x="596" y="235" fill="#2563eb" font-size="18" font-weight="900" text-anchor="middle">↓ Negar (¬)</text>

    <rect x="436" y="248" width="320" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="448" y="270" fill="#1e40af" font-size="12">Existencia de contraejemplo:</text>
    <text x="448" y="295" fill="#1d4ed8" font-size="14" font-weight="800">"Existe al menos un primo par" (V)</text>

    <rect x="436" y="325" width="320" height="50" rx="8" fill="#fefce8" stroke="#fef08a"/>
    <text x="448" y="346" fill="#854d0e" font-size="11.5" font-weight="700">Contraejemplo real: El número 2 es primo y par.</text>
    <text x="448" y="364" fill="#854d0e" font-size="11.5">Demuestra que la negación de 'todos' no es 'ninguno'.</text>
  </g>

</svg>
