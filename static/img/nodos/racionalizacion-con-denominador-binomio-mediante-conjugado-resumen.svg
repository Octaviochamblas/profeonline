<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: Racionalización con Conjugado</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Suma por su diferencia y simplificación en fracciones verticales</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Top Banner -->
      <g transform="translate(25, 18)">
        <rect width="650" height="80" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">SÍNTESIS DEL CONJUGADO BINOMIAL</text>

        <!-- Formula -->
        <g transform="translate(180, 52)">
          <text x="25" y="-6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">k</text>
          <line x1="0" y1="0" x2="50" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
          <text x="25" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">√<tspan style="text-decoration: overline">a</tspan> ± √<tspan style="text-decoration: overline">b</tspan></text>

          <text x="65" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">=</text>

          <text x="120" y="-6" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">k(√<tspan style="text-decoration: overline">a</tspan> ∓ √<tspan style="text-decoration: overline">b</tspan>)</text>
          <line x1="82" y1="0" x2="158" y2="0" stroke="#34d399" stroke-width="1.5"/>
          <text x="120" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">a - b</text>

          <text x="195" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">(a ≠ b)</text>
        </g>
      </g>

      <!-- Bottom Box Left -->
      <g transform="translate(25, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Regla del Signo Invertido</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Si el denominador tiene +, usar -.</text>
        <text x="20" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Si el denominador tiene -, usar +.</text>
        <text x="20" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Protege con paréntesis el numerador.</text>
        <text x="20" y="120" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Elimina raíces del denominador</text>
      </g>

      <!-- Bottom Box Right -->
      <g transform="translate(365, 115)">
        <rect width="310" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Término Entero al Cuadrado</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Si un término no tiene raíz:</text>
        <text x="20" y="74" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">(a - √<tspan style="text-decoration: overline">b</tspan>)(a + √<tspan style="text-decoration: overline">b</tspan>) = a² - b</text>
        <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Ejemplo: (3 - √<tspan style="text-decoration: overline">2</tspan>)(3 + √<tspan style="text-decoration: overline">2</tspan>) = 3² - 2 = 7.</text>
        <text x="20" y="120" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ El entero se eleva a la 2</text>
      </g>
    </g>

</svg>
