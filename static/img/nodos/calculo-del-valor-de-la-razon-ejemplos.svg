<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Valor decimal exacto</text>
  <text x="35" y="85" class="text-step">Calcular el valor de la razón 14 : 4</text>
  <text x="35" y="115" class="text-step">Paso 1: Escribir la división</text>
  <g transform="translate(35, 125)">
    <text x="0" y="18" class="math">k =</text>
    <g transform="translate(30, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">14</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">4</text>
    </g>
    <text x="60" y="18" class="math">=</text>
    <g transform="translate(75, 0)">
      <text x="10" y="12" class="math" text-anchor="middle">7</text>
      <line x1="0" y1="16" x2="20" y2="16" class="frac-line"/>
      <text x="10" y="30" class="math" text-anchor="middle">2</text>
    </g>
    <text x="105" y="18" class="math">= 3,5</text>
  </g>
  <text x="35" y="185" class="text-step">Paso 2: Interpretación</text>
  <text x="35" y="205" class="text-step">El antecedente es 3,5 veces el consecuente</text>
  <text x="35" y="235" class="res">Valor de la razón k = 3,5</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Razón menor que 1</text>
  <text x="365" y="85" class="text-step">Calcular el valor de la razón 3 : 8</text>
  <text x="365" y="115" class="text-step">Paso 1: Dividir 3 entre 8</text>
  <g transform="translate(365, 125)">
    <text x="0" y="18" class="math">k =</text>
    <g transform="translate(30, 0)">
      <text x="10" y="12" class="math" text-anchor="middle">3</text>
      <line x1="0" y1="16" x2="20" y2="16" class="frac-line"/>
      <text x="10" y="30" class="math" text-anchor="middle">8</text>
    </g>
    <text x="58" y="18" class="math">= 0,375</text>
  </g>
  <text x="365" y="185" class="text-step">Paso 2: Interpretación</text>
  <text x="365" y="205" class="text-step">El antecedente representa el 37,5% del consecuente</text>
  <text x="365" y="235" class="res">Valor de la razón k = 0,375</text>
</svg>
