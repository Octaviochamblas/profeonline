<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="lightShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Síntesis: Método de Tabla de Divisiones Sucesivas</text>
    <text x="0" y="74" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">El procedimiento más ordenado y confiable para factorizar números grandes</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#lightShadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">BUENAS PRÁCTICAS DEL MÉTODO DE TABLA</text>
        <text x="325" y="52" fill="#0f172a" font-family="monospace" font-size="12" text-anchor="middle">1. Solo PRIMOS a la derecha  |  2. Agotar cada primo antes de avanzar</text>
        <text x="325" y="74" fill="#059669" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Seguir el orden 2 ➔ 3 ➔ 5 ➔ 7 ➔ 11 garantiza que no olvides ningún factor.</text>
      </g>

      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Ventajas de la Tabla</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Estructura vertical limpia y compacta.</text>
        <text x="20" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• Reduce la probabilidad de errores.</text>
        <text x="20" y="96" fill="#059669" font-family="system-ui, sans-serif" font-size="11">Ideal para números de 3 o más dígitos.</text>
      </g>

      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#dc2626" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Error Prohibido</text>
        <text x="20" y="52" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11">❌ Colocar números compuestos a la derecha:</text>
        <text x="20" y="74" fill="#475569" font-family="monospace" font-size="11">120 | 4  o  120 | 6  (Inválido).</text>
        <text x="20" y="96" fill="#059669" font-family="system-ui, sans-serif" font-size="11">La columna derecha SOLO admite primos.</text>
      </g>
    </g>

</svg>
