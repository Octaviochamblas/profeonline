<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Hallar conjugado</text>
  <text x="35" y="85" class="text-step">Calcular z̄ para: z = −7 − 4i</text>
  <text x="35" y="115" class="text-step">Paso 1: Conservar la parte real idéntica</text>
  <text x="35" y="140" class="math">Re(z̄) = −7</text>
  <text x="35" y="170" class="text-step">Paso 2: Invertir el signo de la parte imag.</text>
  <text x="35" y="195" class="math">−(−4i) = +4i</text>
  <text x="35" y="235" class="res">z̄ = −7 + 4i</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Producto notable z · z̄</text>
  <text x="365" y="85" class="text-step">Calcular (3 + 2i)(3 − 2i)</text>
  <text x="365" y="115" class="text-step">Paso 1: Suma por diferencia a<tspan baseline-shift="super" font-size="70%">2</tspan> − (bi)<tspan baseline-shift="super" font-size="70%">2</tspan></text>
  <text x="365" y="140" class="math">= 3<tspan baseline-shift="super" font-size="70%">2</tspan> − (2i)<tspan baseline-shift="super" font-size="70%">2</tspan> = 9 − 4i<tspan baseline-shift="super" font-size="70%">2</tspan></text>
  <text x="365" y="170" class="text-step">Paso 2: Aplicar i<tspan baseline-shift="super" font-size="70%">2</tspan> = −1</text>
  <text x="365" y="195" class="math">= 9 − 4(−1) = 9 + 4 = 13</text>
  <text x="365" y="235" class="res">Resultado = 13 ∈ ℝ</text>
</svg>
