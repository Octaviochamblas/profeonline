<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 16px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Reparto de $90.000</text>
  <text x="35" y="85" class="text-step">Repartir en razón 2 : 3 : 4 (Total = $90.000)</text>
  <text x="35" y="115" class="text-step">Paso 1: Sumar consecuentes: 2 + 3 + 4 = 9</text>
  <g transform="translate(35, 125)">
    <text x="0" y="18" class="math">k =</text>
    <g transform="translate(30, 0)">
      <text x="25" y="12" class="math" text-anchor="middle">90.000</text>
      <line x1="0" y1="16" x2="50" y2="16" class="frac-line"/>
      <text x="25" y="30" class="math" text-anchor="middle">9</text>
    </g>
    <text x="88" y="18" class="math">= 10.000</text>
  </g>
  <text x="35" y="170" class="text-step">Paso 2: Multiplicar cada parte por k</text>
  <text x="35" y="195" class="math">$20.000, $30.000, $40.000</text>
  <text x="35" y="235" class="res">Partes: 20k, 30k, 40k</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Perímetro de triángulo</text>
  <text x="365" y="85" class="text-step">Lados en razón 3 : 4 : 5 con Perímetro = 48 cm</text>
  <text x="365" y="115" class="text-step">Paso 1: Suma consecuentes = 3 + 4 + 5 = 12</text>
  <g transform="translate(365, 125)">
    <text x="0" y="18" class="math">k =</text>
    <g transform="translate(30, 0)">
      <text x="12" y="12" class="math" text-anchor="middle">48</text>
      <line x1="0" y1="16" x2="24" y2="16" class="frac-line"/>
      <text x="12" y="30" class="math" text-anchor="middle">12</text>
    </g>
    <text x="60" y="18" class="math">= 4 cm</text>
  </g>
  <text x="365" y="170" class="text-step">Paso 2: Calcular lados</text>
  <text x="365" y="195" class="math">a = 12 cm, b = 16 cm, c = 20 cm</text>
  <text x="365" y="235" class="res">Lados: 12 cm, 16 cm, 20 cm</text>
</svg>
