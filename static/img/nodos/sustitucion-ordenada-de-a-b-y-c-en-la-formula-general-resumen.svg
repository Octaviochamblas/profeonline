<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 298" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 12px; }
      .hero-card { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; rx: 10px; }
      .def-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5px; rx: 8px; }
      .def-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .warn-box { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5px; rx: 8px; }
      .warn-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #9a3412; }
      .warn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; }
    </style>
  </defs>

  <rect width="700" height="298" class="bg"/>

  <!-- Top Hero Card (Formula LaTeX) -->
  <g transform="translate(30, 16)">
    <rect width="640" height="65.0" class="hero-card"/>
    <image href="data:image/svg+xml;base64," x="238.9" y="14" width="162.3" height="37.0"/>
  </g>

  <!-- Key Definition -->
  <g transform="translate(30, 91.0)">
    <rect width="640" height="85.0" class="def-box"/>
    <text class="def-text">
      <tspan x="25" y="24">La sustitución ordenada reemplaza meticulosamente cada coeficiente</tspan>
      <tspan x="25" y="41">entre paréntesis para proteger los signos negativos en -b, b² y el</tspan>
      <tspan x="25" y="58">producto -4ac.</tspan>
    </text>
  </g>

  <!-- Warning Box: Errores Frecuentes -->
  <g transform="translate(30, 186.0)">
    <rect width="640" height="92.0" class="warn-box"/>
    <text x="25" y="22" class="warn-title">⚠️ Errores frecuentes a evitar:</text>
    <text class="warn-text">
      <tspan x="25" y="42">Escribir -5² = -25 en el discriminante en vez de (-5)² = 25.</tspan>
    </text>
    <text class="warn-text">
      <tspan x="25" y="63">Olvidar el signo menos de la fórmula cuando b es positivo: -(+3) = -3.</tspan>
    </text>
  </g>
</svg>
