<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #334155; }
      .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .math-term { font-family: "Cambria Math", "Times New Roman", serif; font-size: 20px; font-weight: bold; fill: #1d4ed8; }
      .frac-line { stroke: #1d4ed8; stroke-width: 2; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 6; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="50" class="header-box"/>
  <text x="340" y="45" text-anchor="middle" class="title">PROPIEDAD: LOGARITMO DE UN COCIENTE</text>
  <text x="340" y="60" text-anchor="middle" class="text-main">El logaritmo de una división vertical se convierte en la resta de logaritmos</text>

  <!-- Formula central con fraccion vertical -->
  <rect x="20" y="85" width="640" height="75" class="card"/>
  <rect x="40" y="95" width="600" height="55" class="badge-blue"/>
  <g transform="translate(140, 100)">
    <text x="0" y="28" class="math-term">log<tspan baseline-shift="sub" font-size="70%">b</tspan>(</text>
    <!-- Fraccion x/y -->
    <text x="50" y="16" text-anchor="middle" class="math-term">x</text>
    <line x1="38" y1="22" x2="62" y2="22" class="frac-line"/>
    <text x="50" y="38" text-anchor="middle" class="math-term">y</text>
    <text x="68" y="28" class="math-term">) = log<tspan baseline-shift="sub" font-size="70%">b</tspan>(x) − log<tspan baseline-shift="sub" font-size="70%">b</tspan>(y)</text>
  </g>

  <!-- 2 Cards explicativas -->
  <rect x="20" y="175" width="310" height="85" class="card"/>
  <rect x="35" y="185" width="130" height="24" class="badge-green"/>
  <text x="100" y="201" text-anchor="middle" class="text-green">Sentido Expansivo</text>
  <text x="35" y="226" class="text-main">El numerador resta al denominador:</text>
  <g transform="translate(35, 233)">
    <text x="0" y="14" class="text-bold">log<tspan baseline-shift="sub" font-size="70%">2</tspan>(</text>
    <text x="32" y="6" text-anchor="middle" class="text-bold">8</text>
    <line x1="24" y1="10" x2="40" y2="10" stroke="#0f172a" stroke-width="1.5"/>
    <text x="32" y="22" text-anchor="middle" class="text-bold">4</text>
    <text x="44" y="14" class="text-bold">) = log<tspan baseline-shift="sub" font-size="70%">2</tspan>(8) − log<tspan baseline-shift="sub" font-size="70%">2</tspan>(4) = 1</text>
  </g>

  <rect x="350" y="175" width="310" height="85" class="card"/>
  <rect x="365" y="185" width="130" height="24" class="badge-amber"/>
  <text x="430" y="201" text-anchor="middle" class="text-amber">Sentido Condensado</text>
  <text x="365" y="226" class="text-main">Agrupa resta en fracción:</text>
  <g transform="translate(365, 233)">
    <text x="0" y="14" class="text-bold">log(50) − log(5) = log(</text>
    <text x="160" y="6" text-anchor="middle" class="text-bold">50</text>
    <line x1="148" y1="10" x2="172" y2="10" stroke="#0f172a" stroke-width="1.5"/>
    <text x="160" y="22" text-anchor="middle" class="text-bold">5</text>
    <text x="176" y="14" class="text-bold">) = log(10) = 1</text>
  </g>
</svg>
