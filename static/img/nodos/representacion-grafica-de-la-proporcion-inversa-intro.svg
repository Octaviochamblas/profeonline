<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #334155; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #1d4ed8; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 2,2; }
      .hyperbola { fill: none; stroke: #2563eb; stroke-width: 2.5; }
      .point { fill: #dc2626; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="640" height="45" class="header-box"/>
  <text x="340" y="42" text-anchor="middle" class="title">REPRESENTACIÓN GRÁFICA: HIPÉRBOLA EQUILÁTERA</text>

  <!-- Grafico a la izquierda -->
  <g transform="translate(40, 75)">
    <rect width="260" height="190" class="card"/>
    <!-- Grid -->
    <line x1="40" y1="40" x2="240" y2="40" class="grid"/>
    <line x1="40" y1="80" x2="240" y2="80" class="grid"/>
    <line x1="40" y1="120" x2="240" y2="120" class="grid"/>
    <line x1="100" y1="20" x2="100" y2="160" class="grid"/>
    <line x1="160" y1="20" x2="160" y2="160" class="grid"/>
    <line x1="220" y1="20" x2="220" y2="160" class="grid"/>

    <!-- Ejes -->
    <line x1="40" y1="160" x2="240" y2="160" class="axis"/>
    <line x1="40" y1="160" x2="40" y2="20" class="axis"/>
    <text x="245" y="165" class="text-main" font-weight="bold">x</text>
    <text x="35" y="15" class="text-main" font-weight="bold">y</text>

    <!-- Curva hiperbolica y = k/x -->
    <path d="M 55 30 Q 75 110 230 145" class="hyperbola"/>

    <!-- Puntos sobre la hipérbola -->
    <circle cx="65" cy="50" r="3.5" class="point"/>
    <circle cx="95" cy="95" r="3.5" class="point"/>
    <circle cx="180" cy="135" r="3.5" class="point"/>
  </g>

  <!-- Explicacion a la derecha -->
  <g transform="translate(320, 75)">
    <rect width="340" height="190" class="card"/>
    <rect x="15" y="15" width="200" height="24" class="badge-green"/>
    <text x="115" y="31" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Propiedades del Gráfico</text>

    <text x="15" y="60" class="text-main">• **Forma:** Es una **curva suave** llamada hipérbola.</text>
    <text x="15" y="85" class="text-main">• **Asíntotas:** Se acerca a los ejes pero **NUNCA los toca**.</text>
    <text x="15" y="110" class="text-main">• **No pasa por (0,0):** La división por cero no existe.</text>
    <text x="15" y="135" class="text-main">• Es una función **estrictamente decreciente** ($k &gt; 0$).</text>

    <g transform="translate(15, 155)">
      <text x="0" y="14" class="formula">Ecuación: y =</text>
      <g transform="translate(100, -6)">
        <text x="10" y="14" class="formula" text-anchor="middle">k</text>
        <line x1="0" y1="18" x2="20" y2="18" class="frac-line"/>
        <text x="10" y="34" class="formula" text-anchor="middle">x</text>
      </g>
    </g>
  </g>
</svg>
