<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: 3 Magnitudes combinadas</text>
  <text x="35" y="85" class="text-step">5 impresoras imprimen 1.000 libros en 4 días.</text>
  <text x="35" y="105" class="text-step">¿Cuántos días tardan 8 impresoras para 3.200 libros?</text>
  <text x="35" y="130" class="text-step">Paso 1: Plantear fórmula con Días (D):</text>
  <g transform="translate(35, 140)">
    <g transform="translate(0, 0)">
      <text x="8" y="12" class="math" text-anchor="middle">4</text>
      <line x1="0" y1="16" x2="16" y2="16" class="frac-line"/>
      <text x="8" y="30" class="math" text-anchor="middle">x</text>
    </g>
    <text x="22" y="18" class="math">=</text>
    <g transform="translate(35, 0)">
      <text x="8" y="12" class="math" text-anchor="middle">8</text>
      <line x1="0" y1="16" x2="16" y2="16" class="frac-line"/>
      <text x="8" y="30" class="math" text-anchor="middle">5</text>
    </g>
    <text x="57" y="18" class="math">·</text>
    <g transform="translate(70, 0)">
      <text x="18" y="12" class="math" text-anchor="middle">1000</text>
      <line x1="0" y1="16" x2="36" y2="16" class="frac-line"/>
      <text x="18" y="30" class="math" text-anchor="middle">3200</text>
    </g>
    <text x="115" y="18" class="math">=</text>
    <g transform="translate(130, 0)">
      <text x="8" y="12" class="math" text-anchor="middle">1</text>
      <line x1="0" y1="16" x2="16" y2="16" class="frac-line"/>
      <text x="8" y="30" class="math" text-anchor="middle">2</text>
    </g>
  </g>
  <text x="35" y="195" class="text-step">Paso 2: 4 / x = 1 / 2 ⟹ x = 8 días</text>
  <text x="35" y="235" class="res">Resultado: x = 8 días</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Simplificación previa</text>
  <text x="365" y="85" class="text-step">Simplificar factores antes de multiplicar:</text>
  <text x="365" y="115" class="text-step">Paso 1: Cancelar ceros y divisores comunes</text>
  <text x="365" y="140" class="math">(8/5) · (10/32) = (8/32) · (10/5)</text>
  <text x="365" y="170" class="text-step">Paso 2: Reducir fracciones</text>
  <text x="365" y="195" class="math">(1/4) · 2 = 2/4 = 1/2</text>
  <text x="365" y="235" class="res">Acelera el cálculo y evita errores</text>
</svg>
