<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Elemento de un Conjunto</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">CONJUNTOS BÁSICOS</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Concepto de Elemento</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Cada objeto individual que forma parte de un conjunto.</text>

    <!-- Visual Symbol Box -->
    <rect x="44" y="165" width="320" height="65" rx="10" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="204" y="208" fill="#0f766e" font-size="24" font-weight="900" text-anchor="middle">x  es elemento de  A</text>

    <rect x="44" y="245" width="320" height="125" rx="10" fill="#f1f5f9"/>
    <text x="56" y="272" fill="#334155" font-size="12.5" font-weight="700">Propiedades del Elemento:</text>
    <text x="56" y="295" fill="#475569" font-size="12">• Se denotan típicamente con minúsculas (a, b, x).</text>
    <text x="56" y="317" fill="#475569" font-size="12">• Pueden ser números, letras, puntos u otros conjuntos.</text>
    <text x="56" y="342" fill="#0f766e" font-size="12" font-weight="700">Un elemento es la unidad constitutiva del conjunto.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-indigo)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Distinción: Elemento vs Conjunto</text>

    <rect x="436" y="140" width="320" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="448" y="165" fill="#1e40af" font-size="12" font-weight="700">Elemento aislado:</text>
    <text x="448" y="192" fill="#1d4ed8" font-size="14" font-weight="900">5  (Objeto individual)</text>

    <rect x="436" y="225" width="320" height="70" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="448" y="250" fill="#7e22ce" font-size="12" font-weight="700">Conjunto unitario:</text>
    <text x="448" y="277" fill="#6b21a8" font-size="14" font-weight="900">{5}  (Contenedor con 1 elemento)</text>

    <rect x="436" y="310" width="320" height="60" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="596" y="335" fill="#991b1b" font-size="11.5" font-weight="700" text-anchor="middle">Principio ontológico:</text>
    <text x="596" y="355" fill="#dc2626" font-size="12" font-weight="800" text-anchor="middle">5 ≠ {5}  (Elemento vs Conjunto)</text>
  </g>

</svg>
