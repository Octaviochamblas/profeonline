<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="752" height="416" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ADICIÓN</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Adición de Enteros con el Mismo Signo</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Se suman los valores absolutos y se conserva el signo común de los sumandos</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <!-- Left Card: Positivos -->
      <g transform="translate(0, 0)">
        <rect width="335" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="335" height="40" rx="12" fill="#1e293b" opacity="0.6"/>
        <text x="20" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Positivo + Positivo ⟹ Positivo</text>

        <rect x="20" y="60" width="295" height="50" rx="8" fill="#0f172a" stroke="#34d399"/>
        <text x="167" y="92" fill="#34d399" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">(+a) + (+b) = +(a + b)</text>

        <text x="20" y="140" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Procedimiento:</text>
        <text x="20" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1. Sumar magnitudes: |+7| + |+5| = 12</text>
        <text x="20" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2. Mantener signo positivo: +12</text>
        <text x="20" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">3. En la recta: dos saltos a la derecha.</text>
        <text x="20" y="242" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ (+7) + (+5) = 12</text>
      </g>

      <!-- Right Card: Negativos -->
      <g transform="translate(365, 0)">
        <rect width="335" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="335" height="40" rx="12" fill="#1e293b" opacity="0.6"/>
        <text x="20" y="26" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Negativo + Negativo ⟹ Negativo</text>

        <rect x="20" y="60" width="295" height="50" rx="8" fill="#0f172a" stroke="#f87171"/>
        <text x="167" y="92" fill="#f87171" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">(-a) + (-b) = -(a + b)</text>

        <text x="20" y="140" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Procedimiento:</text>
        <text x="20" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1. Sumar magnitudes: |-4| + |-8| = 12</text>
        <text x="20" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2. Mantener signo negativo: -12</text>
        <text x="20" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">3. En la recta: dos saltos a la izquierda.</text>
        <text x="20" y="242" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ (-4) + (-8) = -12</text>
      </g>
    </g>

</svg>
