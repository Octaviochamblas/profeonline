<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Si el 20% es $15.000</text>
  <text x="35" y="85" class="text-step">El 20% de un sueldo son $15.000. Hallar el total:</text>
  <text x="35" y="115" class="text-step">Paso 1: Dividir por 0,20 (o multiplicar por 5)</text>
  <text x="35" y="140" class="math">Total = 15.000 ÷ 0,20 = 15.000 · 5</text>
  <text x="35" y="170" class="text-step">Paso 2: Calcular</text>
  <text x="35" y="195" class="math">Total = $75.000</text>
  <text x="35" y="235" class="res">El sueldo total es $75.000</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Si el 35% son 42 personas</text>
  <text x="365" y="85" class="text-step">42 personas representan el 35% del aforo:</text>
  <text x="365" y="115" class="text-step">Paso 1: Aplicar Total = (Parte · 100) / c</text>
  <text x="365" y="140" class="math">Total = (42 · 100) / 35 = 4.200 / 35</text>
  <text x="365" y="170" class="text-step">Paso 2: Dividir</text>
  <text x="365" y="195" class="math">Total = 120 personas</text>
  <text x="365" y="235" class="res">El aforo total es 120 personas</text>
</svg>
