<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Número de Filas con 2 Variables (2² = 4)</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Regla Exponencial Combinatoria</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Cada variable binaria duplica el espacio de estados.</text>

    <rect x="44" y="160" width="320" height="85" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="204" y="190" fill="#1e40af" font-size="14" font-weight="800" text-anchor="middle">Fórmula General de Filas:</text>
    <text x="204" y="225" fill="#1d4ed8" font-size="22" font-weight="900" text-anchor="middle">N = 2ⁿ  ➔  2² = 4 Filas</text>

    <rect x="44" y="260" width="320" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="285" fill="#0f172a" font-size="13" font-weight="800">Patrón Canónico de Alternancia:</text>
    <text x="56" y="308" fill="#475569" font-size="12">• Columna p: 2 verdades, 2 falsedades (VVFF).</text>
    <text x="56" y="328" fill="#475569" font-size="12">• Columna q: 1 verdad, 1 falsedad (VFVF).</text>
    <text x="56" y="350" fill="#0f766e" font-size="12" font-weight="700">Garantiza exhaustividad sin repeticiones.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Matriz Base de 4 Filas</text>

    <rect x="456" y="140" width="135" height="35" fill="#0f172a" rx="5"/>
    <text x="523" y="163" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">p (2 en 2)</text>
    <rect x="601" y="140" width="135" height="35" fill="#0f172a" rx="5"/>
    <text x="668" y="163" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">q (1 en 1)</text>

    <rect x="456" y="180" width="280" height="32" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
    <text x="523" y="202" fill="#1e40af" font-size="14" font-weight="800" text-anchor="middle">V</text>
    <text x="668" y="202" fill="#1e40af" font-size="14" font-weight="800" text-anchor="middle">V</text>

    <rect x="456" y="216" width="280" height="32" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="523" y="238" fill="#1e40af" font-size="14" font-weight="800" text-anchor="middle">V</text>
    <text x="668" y="238" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">F</text>

    <rect x="456" y="252" width="280" height="32" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="523" y="274" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">F</text>
    <text x="668" y="274" fill="#1e40af" font-size="14" font-weight="800" text-anchor="middle">V</text>

    <rect x="456" y="288" width="280" height="32" fill="#fef2f2" stroke="#fecaca" rx="4"/>
    <text x="523" y="310" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">F</text>
    <text x="668" y="310" fill="#dc2626" font-size="14" font-weight="800" text-anchor="middle">F</text>

    <text x="592" y="358" fill="#0f766e" font-size="11.5" font-weight="700" text-anchor="middle">Total de 4 combinaciones exhaustivas.</text>
  </g>

</svg>
