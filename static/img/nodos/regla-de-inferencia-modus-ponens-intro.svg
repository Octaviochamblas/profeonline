<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">Regla de Inferencia — Modus Ponens</text>
  <rect x="660" y="16" width="116" height="28" rx="14" fill="#1e293b"/>
  <text x="718" y="35" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.05em">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Modo Afirmativo de Deducción</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Si la regla es cierta y se cumple el antecedente, se concluye el consecuente.</text>

    <!-- Schema visual -->
    <rect x="44" y="165" width="320" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="56" y="190" fill="#1e40af" font-size="12.5" font-weight="700">Premisa 1: p → q  (Si p, entonces q)</text>
    <text x="56" y="215" fill="#1e40af" font-size="12.5" font-weight="700">Premisa 2: p      (Ocurre p)</text>

    <line x1="44" y1="245" x2="364" y2="245" stroke="#0f172a" stroke-width="2"/>

    <rect x="44" y="255" width="320" height="60" rx="10" fill="#10b981"/>
    <text x="204" y="280" fill="#ecfdf5" font-size="12" text-anchor="middle">Conclusión Necesaria:</text>
    <text x="204" y="304" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">∴  q  (Por lo tanto, q)</text>

    <text x="204" y="350" fill="#0f766e" font-size="12" font-weight="700" text-anchor="middle">Modo que al afirmar el antecedente, afirma.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-indigo)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16.5" font-weight="800">Estructura Tautológica</text>

    <rect x="436" y="135" width="320" height="45" rx="8" fill="#f1f5f9"/>
    <text x="448" y="163" fill="#0f172a" font-size="14.5" font-weight="800">Fórmula:  [ (p → q) ∧ p ]  →  q</text>

    <rect x="436" y="190" width="320" height="90" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="448" y="215" fill="#0f766e" font-size="12" font-weight="700">Evaluación en las 4 filas de la tabla:</text>
    <text x="448" y="238" fill="#334155" font-size="12">• Fila 1 (V, V): [V ∧ V] → V = V</text>
    <text x="448" y="260" fill="#334155" font-size="12">• Filas 2, 3, 4: F ➔ Salida = V (Vacuo)</text>

    <rect x="436" y="295" width="320" height="75" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="450" y="320" fill="#1e40af" font-size="12.5" font-weight="800">TAUTOLOGÍA: [V, V, V, V]ᵀ</text>
    <text x="450" y="348" fill="#1d4ed8" font-size="12.5" font-weight="700">Razonamiento Deductivo Válido</text>
  </g>

</svg>
