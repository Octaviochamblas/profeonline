<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="lightShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">CANTIDAD DIVISORES</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Cantidad de Divisores mediante Exponentes</text>
    <text x="0" y="74" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">Fórmula combinatoria τ(n): calcular el total de divisores sumando 1 a cada exponente y multiplicando</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#lightShadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="26" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FÓRMULA GENERAL DE LA CANTIDAD DE DIVISORES τ(n)</text>
        <text x="325" y="50" fill="#059669" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">n = p₁^{a₁} · ... · pₖ^{aₖ}  ⟹  τ(n) = (a₁ + 1)(a₂ + 1)...(aₖ + 1)</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Por qué se Suma 1</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Para cada factor primo pᵢ^{aᵢ},</text>
        <text x="20" y="78" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11">un divisor puede elegir la potencia de 0 a aᵢ:</text>
        <text x="20" y="102" fill="#059669" font-family="monospace" font-size="12">Opciones: {p⁰, p¹, p², ..., p^a} = a + 1</text>
        <text x="20" y="125" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Principio Multiplicativo de Conteo</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#d97706" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Ejemplo Rápido</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Sea n = 72 = 2³ · 3²:</text>
        <text x="20" y="78" fill="#0f172a" font-family="monospace" font-size="12">• Exponentes: a₁ = 3,  a₂ = 2</text>
        <text x="20" y="102" fill="#059669" font-family="monospace" font-size="13" font-weight="700">τ(72) = (3 + 1)(2 + 1) = 4 · 3 = 12</text>
        <text x="20" y="125" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ 72 tiene exactamente 12 divisores</text>
      </g>
    </g>

</svg>
