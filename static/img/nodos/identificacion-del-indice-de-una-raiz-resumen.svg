<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">SÍNTESIS</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Síntesis: Identificación del Índice</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Reglas de lectura y distinción con coeficientes</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 20)">
        <rect width="650" height="85" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">SÍNTESIS DEL ÍNDICE RADICAL</text>
        <text x="325" y="48" fill="#34d399" font-family="monospace" font-size="13" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√a   |   n ∈ {2, 3, 4, 5...}   |   √a ≡ <tspan baseline-shift="super" font-size="70%">2</tspan>√a</text>
        <text x="325" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">El índice determina el denominador del exponente fraccionario: <tspan baseline-shift="super" font-size="70%">n</tspan>√a = a<tspan baseline-shift="super" font-size="70%">1/n</tspan>.</text>
      </g>
      <g transform="translate(25, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Regla Mnemotécnica</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">¿No hay número en el gancho?</text>
        <text x="20" y="74" fill="#38bdf8" font-family="monospace" font-size="11">➔ El índice es 2 (raíz cuadrada).</text>
        <text x="20" y="96" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">No existe raíz de índice 1.</text>
      </g>
      <g transform="translate(365, 120)">
        <rect width="310" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Jerarquía Visual</text>
        <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">k<tspan baseline-shift="super" font-size="70%">n</tspan>√x = k · (<tspan baseline-shift="super" font-size="70%">n</tspan>√x)</text>
        <text x="20" y="74" fill="#fbbf24" font-family="monospace" font-size="11">k es factor multiplicativo externo.</text>
        <text x="20" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">n es el operador radical interior.</text>
      </g>
    </g>

</svg>
