<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="756" height="420" rx="16" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="753" height="417" rx="14.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">OBTENCIÓN</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Obtención de Divisores de un Número Natural</text>
    <text x="0" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Método de pares complementarios y prueba acotada hasta la raíz cuadrada √n</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="325" y="26" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TEOREMA DE LA COTA EFICIENTE √n</text>
        <text x="325" y="50" fill="#059669" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">Si d | n  ⟹  (n / d) | n. Basta probar d ≤ √n.</text>
      </g>

      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Ejemplo: Divisores de 36 (√36 = 6)</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• 1 ➔ 36 / 1 = 36 (Par: 1, 36)</text>
        <text x="20" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• 2 ➔ 36 / 2 = 18 (Par: 2, 18)</text>
        <text x="20" y="100" fill="#475569" font-family="system-ui, sans-serif" font-size="11">• 3 ➔ 12  |  4 ➔ 9  |  6 ➔ 6</text>
        <text x="20" y="125" fill="#059669" font-family="monospace" font-size="12">D(36) = {1, 2, 3, 4, 6, 9, 12, 18, 36}</text>
      </g>

      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="20" y="28" fill="#d97706" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Ventaja Algorítmica</text>
        <text x="20" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Para n = 100, solo se prueban divisores</text>
        <text x="20" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="11">desde 1 hasta 10 (√100 = 10).</text>
        <text x="20" y="100" fill="#0284c7" font-family="system-ui, sans-serif" font-size="11">Reduce las pruebas de 100 a solo 10.</text>
        <text x="20" y="125" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Ahorro computacional del 90%</text>
      </g>
    </g>

</svg>
