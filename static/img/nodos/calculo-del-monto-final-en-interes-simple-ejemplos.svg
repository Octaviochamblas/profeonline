<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .header-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #334155; }
      .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .formula { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; font-weight: bold; fill: #1d4ed8; }
      .badge-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 8; }
      .badge-green { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 6; }
      .badge-amber { fill: #fef3c7; stroke: #fde68a; stroke-width: 1; rx: 6; }
      .badge-purple { fill: #f3e8ff; stroke: #d8b4fe; stroke-width: 1; rx: 6; }
      .text-green { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #166534; }
      .text-amber { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #92400e; }
      .text-purple { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #6b21a8; }
      .math-bold { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .frac-line { stroke: #1d4ed8; stroke-width: 1.8; }
      .frac-line-dark { stroke: #0f172a; stroke-width: 1.6; }
      .rule-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .err-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8; }
      .err-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #991b1b; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #334155; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 13px; font-weight: bold; fill: #15803d; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge-blue"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Fórmula factorizada</text>
  <text x="35" y="85" class="text-main">$300.000 al 8% anual por 3 años:</text>
  <text x="35" y="115" class="text-muted">Paso 1: Factor = 1 + (0,08 · 3)</text>
  <text x="35" y="145" class="math-bold">Factor = 1 + 0,24 = 1,24</text>
  <text x="35" y="175" class="text-muted">Paso 2: Multiplicar C · Factor</text>
  <text x="35" y="200" class="math-bold">M = 300.000 · 1,24 = $372.000</text>
  <text x="35" y="238" class="res">Monto final acumulado: $372.000</text>

  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge-blue"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Suma directa</text>
  <text x="365" y="85" class="text-main">Préstamo $150.000 con interés $18.000:</text>
  <text x="365" y="115" class="text-muted">Paso 1: Identificar C = 150.000, I = 18.000</text>
  <text x="365" y="145" class="math-bold">M = 150.000 + 18.000</text>
  <text x="365" y="175" class="text-muted">Paso 2: Sumar ambas cantidades</text>
  <text x="365" y="200" class="math-bold">M = $168.000</text>
  <text x="365" y="238" class="res">Monto total a devolver: $168.000</text>

</svg>
