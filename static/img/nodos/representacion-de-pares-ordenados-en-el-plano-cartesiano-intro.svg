<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.01em">El Plano Cartesiano (X, Y)</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">PROD. CARTESIANO</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="80" width="360" height="6" fill="url(#grad-blue)" rx="3"/>
    <text x="44" y="115" fill="#0f172a" font-size="16" font-weight="800">Sistema Coordenado Bidimensional</text>
    <text x="44" y="138" fill="#475569" font-size="12.5">Correspondencia biunívoca entre pares de ℝ² y puntos del plano.</text>

    <!-- Visual Box -->
    <rect x="44" y="165" width="320" height="65" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="204" y="195" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">Punto P(x, y):</text>
    <text x="204" y="218" fill="#1d4ed8" font-size="14" font-weight="900" text-anchor="middle">x = Abscisa (Eje X) | y = Ordenada (Eje Y)</text>

    <rect x="44" y="245" width="320" height="125" rx="10" fill="#f1f5f9"/>
    <text x="56" y="272" fill="#334155" font-size="12.5" font-weight="700">Los 4 Cuadrantes:</text>
    <text x="56" y="295" fill="#475569" font-size="12">• I: (+, +) | II: (-, +)</text>
    <text x="56" y="317" fill="#475569" font-size="12">• III: (-, -) | IV: (+, -)</text>
    <text x="56" y="342" fill="#1d4ed8" font-size="12" font-weight="700">Origen de coordenadas: O = (0, 0).</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="416" y="80" width="360" height="310" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="416" y="80" width="360" height="6" fill="url(#grad-teal)" rx="3"/>
    <text x="436" y="115" fill="#0f172a" font-size="16" font-weight="800">Plano y Cuadrantes</text>

    <rect x="446" y="140" width="300" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Axes -->
    <line x1="460" y1="200" x2="730" y2="200" stroke="#64748b" stroke-width="1.5"/>
    <line x1="595" y1="145" x2="595" y2="255" stroke="#64748b" stroke-width="1.5"/>

    <text x="725" y="195" fill="#475569" font-size="11" font-weight="800">X</text>
    <text x="600" y="155" fill="#475569" font-size="11" font-weight="800">Y</text>

    <text x="660" y="175" fill="#2563eb" font-size="12" font-weight="800">I (+,+)</text>
    <text x="530" y="175" fill="#0d9488" font-size="12" font-weight="800">II (-,+)</text>
    <text x="530" y="235" fill="#d97706" font-size="12" font-weight="800">III (-,-)</text>
    <text x="660" y="235" fill="#7e22ce" font-size="12" font-weight="800">IV (+,-)</text>

    <!-- Origin -->
    <circle cx="595" cy="200" r="3" fill="#0f172a"/>
    <text x="585" y="213" fill="#0f172a" font-size="9" font-weight="800">(0,0)</text>

    <rect x="436" y="275" width="320" height="95" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="596" y="305" fill="#0f766e" font-size="12" font-weight="800" text-anchor="middle">Geometría Analítica</text>
    <text x="596" y="330" fill="#042f2e" font-size="13.5" font-weight="900" text-anchor="middle">Plano ℝ² = ℝ × ℝ</text>
    <text x="596" y="352" fill="#475569" font-size="10.5" text-anchor="middle">Base para graficar relaciones, funciones y curvas.</text>
  </g>

</svg>
