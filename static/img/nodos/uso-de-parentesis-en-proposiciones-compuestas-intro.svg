<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="60" fill="#0f172a"/>
  <text x="24" y="38" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="0.02em">Uso de Paréntesis en Proposiciones Compuestas</text>
  <rect x="650" y="16" width="126" height="28" rx="14" fill="#1e293b"/>
  <text x="713" y="35" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">LÓGICA FORMAL</text>


  <g filter="url(#shadow)">
    <rect x="24" y="80" width="752" height="310" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="24" y="80" width="752" height="6" fill="url(#grad-indigo)" rx="3"/>

    <text x="44" y="115" fill="#0f172a" font-size="17" font-weight="800">Desambiguación Semántica Mediante Paréntesis</text>
    <text x="44" y="138" fill="#475569" font-size="13">Los paréntesis eliminan ambigüedades y definen con precisión el árbol sintáctico de la fórmula.</text>

    <!-- Comparison 1 -->
    <rect x="44" y="165" width="340" height="135" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="60" y="195" fill="#1e40af" font-size="16" font-weight="800">Agrupación A:  ( p ∧ q ) ∨ r</text>
    <text x="60" y="225" fill="#334155" font-size="13">• Operación interna: p ∧ q (Conjunción)</text>
    <text x="60" y="250" fill="#334155" font-size="13">• Conector Principal: ∨ (Disyunción)</text>
    <rect x="60" y="265" width="308" height="24" rx="4" fill="#dbeafe"/>
    <text x="214" y="282" fill="#1d4ed8" font-size="12" font-weight="800" text-anchor="middle">Es verdadera si r = V, aun cuando p y q sean falsos.</text>

    <!-- Comparison 2 -->
    <rect x="416" y="165" width="340" height="135" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="432" y="195" fill="#0f766e" font-size="16" font-weight="800">Agrupación B:  p ∧ ( q ∨ r )</text>
    <text x="432" y="225" fill="#334155" font-size="13">• Operación interna: q ∨ r (Disyunción)</text>
    <text x="432" y="250" fill="#334155" font-size="13">• Conector Principal: ∧ (Conjunción)</text>
    <rect x="432" y="265" width="308" height="24" rx="4" fill="#ccfbf1"/>
    <text x="586" y="282" fill="#0f766e" font-size="12" font-weight="800" text-anchor="middle">Si p = F, la fórmula entera es FALSA.</text>

    <text x="400" y="340" fill="#dc2626" font-size="14" font-weight="900" text-anchor="middle">¡(p ∧ q) ∨ r  NO ES EQUIVALENTE A  p ∧ (q ∨ r)!</text>
    <text x="400" y="365" fill="#475569" font-size="12.5" text-anchor="middle">Cambiar los paréntesis cambia por completo la tabla de verdad.</text>
  </g>

</svg>
