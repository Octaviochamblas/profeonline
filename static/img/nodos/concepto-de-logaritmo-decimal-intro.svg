<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">BASE DECIMAL</text>
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Concepto de Logaritmo Decimal</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Logaritmo común en base 10: log(x) = log<tspan baseline-shift="sub" font-size="70%">10</tspan>(x), la base 10 se omite por convención</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 18)">
        <rect width="650" height="75" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">CONVENCIÓN DEL LOGARITMO DECIMAL</text>
        <text x="325" y="54" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">log(x) ≡ log<tspan baseline-shift="sub" font-size="70%">10</tspan>(x)   (la base 10 no se escribe)</text>
      </g>
      <g transform="translate(25, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Escala de Órdenes de Magnitud</text>
        <text x="20" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5">• log(10) = 1   (10¹ = 10)</text>
        <text x="20" y="72" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5">• log(100) = 2   (10² = 100)</text>
        <text x="20" y="94" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5">• log(1000) = 3   (10³ = 1000)</text>
        <text x="20" y="116" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5">• log(0,1) = -1   (10⁻¹ = 1/10)</text>
        <text x="20" y="136" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Cuenta ceros decimales</text>
      </g>
      <g transform="translate(365, 105)">
        <rect width="310" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Aplicaciones Reales</text>
        <text x="20" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Escalas logarítmicas de base 10:</text>
        <text x="20" y="74" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• Escala Richter (terremotos)</text>
        <text x="20" y="96" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• Escala de pH (química: pH = -log[H⁺])</text>
        <text x="20" y="118" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• Decibeles (acústica)</text>
        <text x="20" y="136" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Base estándar de cálculo</text>
      </g>
    </g>

</svg>
