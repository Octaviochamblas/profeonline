<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e3a8a; }
      .badge { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 6; }
      .text-step { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #1e40af; }
      .res { font-family: "Cambria Math", "Times New Roman", serif; font-size: 14px; font-weight: bold; fill: #15803d; }
      .frac-line { stroke: #1e40af; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="680" height="280" class="bg" rx="16"/>

  <!-- Caso 1 -->
  <rect x="20" y="20" width="310" height="240" class="card"/>
  <rect x="35" y="32" width="280" height="30" class="badge"/>
  <text x="175" y="52" text-anchor="middle" class="title">Ejemplo 1: Reparto en razón 2 : 3 : 5</text>
  <text x="35" y="85" class="text-step">Repartir $100.000 en razón 2 : 3 : 5:</text>
  <text x="35" y="115" class="text-step">Paso 1: Suma de índices = 2 + 3 + 5 = 10</text>
  <g transform="translate(35, 125)">
    <text x="0" y="18" class="math">k =</text>
    <g transform="translate(25, 0)">
      <text x="35" y="12" class="math" text-anchor="middle">100.000</text>
      <line x1="0" y1="16" x2="70" y2="16" class="frac-line"/>
      <text x="35" y="30" class="math" text-anchor="middle">10</text>
    </g>
    <text x="105" y="18" class="math">= $10.000</text>
  </g>
  <text x="35" y="185" class="text-step">Paso 2: Asignar cada parte</text>
  <text x="35" y="205" class="math">2k = $20.000, 3k = $30.000, 5k = $50.000</text>
  <text x="35" y="235" class="res">Partes: $20.000, $30.000 y $50.000</text>

  <!-- Caso 2 -->
  <rect x="350" y="20" width="310" height="240" class="card"/>
  <rect x="365" y="32" width="280" height="30" class="badge"/>
  <text x="505" y="52" text-anchor="middle" class="title">Ejemplo 2: Reparto proporcional a edades</text>
  <text x="365" y="85" class="text-step">Repartir $70.000 entre hermanos de 12 y 16 años:</text>
  <text x="365" y="115" class="text-step">Paso 1: Simplificar razón 12 : 16 ⟹ 3 : 4</text>
  <text x="365" y="135" class="text-step">Suma de partes = 3 + 4 = 7</text>
  <text x="365" y="165" class="math">k = 70.000 / 7 = $10.000</text>
  <text x="365" y="195" class="math">12 años: 3k = $30.000 | 16 años: 4k = $40.000</text>
  <text x="365" y="235" class="res">Comprobación: 30k + 40k = $70.000</text>
</svg>
