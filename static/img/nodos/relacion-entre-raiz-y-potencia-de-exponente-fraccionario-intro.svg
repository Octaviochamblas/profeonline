<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="756" height="420" rx="16" fill="#0b1120"/>
  <rect x="1" y="1" width="754" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">EXPONENTE FRACCIONARIO</text>

    <!-- Title and Subtitle -->
    <text x="0" y="52" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18.5" font-weight="700">Raíz y Exponente Fraccionario</text>
    <text x="0" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Unificación estructural: ⁿ√<tspan style="text-decoration: overline">aᵐ</tspan> = aᵐ/ⁿ (Numerador=potencia, Denominador=índice)</text>
  </g>

  <!-- Content Section -->

    <g transform="translate(28, 115)">
      <rect width="700" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
      <g transform="translate(25, 20)">
        <rect width="650" height="65" rx="8" fill="#0f172a" stroke="#38bdf8"/>
        <text x="325" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">EQUIVALENCIA RAÍZ - POTENCIA RACIONAL</text>
        <text x="325" y="50" fill="#34d399" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle"><tspan baseline-shift="super" font-size="70%">n</tspan>√(a<tspan baseline-shift="super" font-size="70%">m</tspan>) = (<tspan baseline-shift="super" font-size="70%">n</tspan>√<tspan style="text-decoration: overline">a</tspan>)<tspan baseline-shift="super" font-size="70%">m</tspan> = a<tspan baseline-shift="super" font-size="70%">m/n</tspan>   (a > 0, n ∈ N, n ≥ 2, m ∈ Z)</text>
      </g>
      <g transform="translate(25, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Estructura de la Fracción</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Numerador (m): Potencia de la base.</text>
        <text x="20" y="78" fill="#38bdf8" font-family="monospace" font-size="12">• Denominador (n): Índice de la raíz.</text>
        <text x="20" y="102" fill="#34d399" font-family="monospace" font-size="12">8<tspan baseline-shift="super" font-size="70%">2/3</tspan> = (<tspan baseline-shift="super" font-size="70%">3</tspan>√<tspan style="text-decoration: overline">8</tspan>)<tspan baseline-shift="super" font-size="70%">2</tspan> = 2<tspan baseline-shift="super" font-size="70%">2</tspan> = 4</text>
        <text x="20" y="125" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Permite aplicar leyes de potencias</text>
      </g>
      <g transform="translate(365, 100)">
        <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Orden de Evaluación Óptimo</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Siempre extraer la raíz PRIMERO:</text>
        <text x="20" y="78" fill="#fbbf24" font-family="monospace" font-size="12">(<tspan baseline-shift="super" font-size="70%">3</tspan>√<tspan style="text-decoration: overline">27</tspan>)<tspan baseline-shift="super" font-size="70%">2</tspan> = 3<tspan baseline-shift="super" font-size="70%">2</tspan> = 9   (Rápido)</text>
        <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11"><tspan baseline-shift="super" font-size="70%">3</tspan>√(27<tspan baseline-shift="super" font-size="70%">2</tspan>) = <tspan baseline-shift="super" font-size="70%">3</tspan>√<tspan style="text-decoration: overline">729</tspan> = 9 (Muy engorroso).</text>
        <text x="20" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Trabajar con números pequeños</text>
      </g>
    </g>

</svg>
