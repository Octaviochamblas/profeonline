name: Pipeline

# Etiquetado automático de PRs sensibles.
# - etiquetas: marca PRs que tocan superficie sensible con `seguridad:requiere-claude`.
#
# Historial: hasta 2026-08-04 este workflow incluía `audit-gate`, un check REQUERIDO
# que bloqueaba el merge sin auditoría de una IA distinta a la que construyó (label
# `audit:aprobado`). Se eliminó a pedido explícito del usuario junto con el required
# status check en la protección de `main`, para que los PRs se mergeen solo con CI
# verde, sin necesitar aprobación de otra IA o persona.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  etiquetas-sensibles:
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Etiquetar PRs que tocan superficie sensible
        run: |
          files=$(gh pr diff "$PR" --name-only)
          if echo "$files" | grep -qE 'api_video|config/settings/|core/middleware|permission|allauth'; then
            gh pr edit "$PR" --add-label 'seguridad:requiere-claude' || true
            echo "Etiquetado: seguridad:requiere-claude"
          else
            echo "Sin superficie sensible detectada."
          fi
