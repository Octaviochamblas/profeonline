semantic_id: MAT.ALG.RELACION_EXP_LOG.CONVERSION_EXP_LOG
resumen_inicial: La conversión de una ecuación exponencial a forma logarítmica aplica la equivalencia $b^{g(x)} = A \Longleftrightarrow g(x) = \log_b(A)$ ($A > 0, b > 0, b \neq 1$), permitiendo bajar y despejar la incógnita ubicada en el exponente.
explicacion_simple: "![La conversión de una ecuación exponencial a forma logarítmica aplica la equivalencia $b^{g(x)} = A \\Longleftrightarrow g(x) = \\log_b(A)$ ($A > 0, b > 0, b \\neq 1$), permitiendo bajar y despejar la incógnita ubicada en el exponente](/static/img/nodos/conversion-de-una-ecuacion-exponencial-a-forma-logaritmica-intro.svg)\n\n\nCuando tienes una ecuación donde la incógnita está atrapada en el exponente y las bases no se pueden igualar fácilmente:\n\n$$b^{\\mathbf{g(x)}} = \\mathbf{A} \\quad \\Longleftrightarrow \\quad \\mathbf{g(x) = \\log_b(A)}$$\n\n- **¿Cómo se hace el cambio?**\n  1. Deja la potencia sola en el lado izquierdo.\n  2. El exponente **baja al nivel de la ecuación**.\n  3. La base $b$ se convierte en la **base del logaritmo** del número $A$.\n- **Ejemplo guiado:**\n  $$5^{2x - 1} = 50 \\implies 2x - 1 = \\log_5(50) \\implies 2x = 1 + \\log_5(50) \\implies x = \\frac{1 + \\log_5(50)}{2}$$"
explicacion_formal: 'Sea una ecuación exponencial no homogénea $b^{g(x)} = A$ definida sobre $\mathbb{R}$ con $b \in \mathbb{R}^+ \setminus \{1\}$ y $A \in \mathbb{R}^+$.

  Aplicando el operador biyectivo continuo $\log_b: \mathbb{R}^+ \to \mathbb{R}$ a ambos miembros de la ecuación:

  $$\log_b\left(b^{g(x)}\right) = \log_b(A)$$

  Por la propiedad cancelativa $(\log_b \circ \exp_b)(g(x)) = g(x)$:

  $$g(x) = \log_b(A)$$


  **Condición de solubilidad real**:

  La ecuación posee soluciones reales si y solo si $A > 0$. Si $A \le 0$, el conjunto solución en $\mathbb{R}$ es vacío ($\mathcal{S} = \emptyset$).'
definiciones_clave: '- **Conversión logarítmica de ecuaciones**: Despeje del exponente mediante el operador logarítmico.

  - **Condición de positividad de la potencia**: Exigencia $A > 0$ para admitir logaritmos reales.'
propiedades_relaciones: '- **Base decimal o natural**: Si $10^x = A \implies x = \log(A)$; si $e^x = A \implies x = \ln(A)$.

  - **Aislamiento previo**: Cualquier coeficiente exterior $k \cdot b^{g(x)} = M$ debe simplificarse como $b^{g(x)} = M/k$ antes de convertir.'
ejemplo_guiado:
  enunciado: '![Ejemplo La conversión de una ecuación exponencial a forma logarítmica aplica la equivalencia $b^{g(x)} = A \Longleftrightarrow g(x) = \log_b(A)$ ($A > 0, b > 0, b \neq 1$), permitiendo bajar y despejar la incógnita ubicada en el exponente](/static/img/nodos/conversion-de-una-ecuacion-exponencial-a-forma-logaritmica-ejemplos.svg)



    Convierte a forma logarítmica y despeja la incógnita en:

    1) $2^{x + 3} = 15$

    2) $4 \cdot 3^{2t} = 48$

    3) $e^{5x} = 20$'
  pasos:
  - 'Paso 1: Para $2^{x + 3} = 15$:

    - Aplicar forma logarítmica: $x + 3 = \log_2(15)$.

    - Despejar: **$x = \log_2(15) - 3$**.'
  - 'Paso 2: Para $4 \cdot 3^{2t} = 48$:

    - Aislar la potencia dividiendo por 4: $3^{2t} = 12$.

    - Aplicar forma logarítmica: $2t = \log_3(12)$.

    - Despejar: **$t = \frac{\log_3(12)}{2}$**.'
  - 'Paso 3: Para $e^{5x} = 20$:

    - Aplicar logaritmo natural: $5x = \ln(20)$.

    - Despejar: **$x = \frac{\ln(20)}{5}$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma logarítmica equivalente a $7^{3x} = 40$?
  choices:
  - text: 3x = log₇(40)
    is_correct: true
  - text: 3x = 40 / 7
    is_correct: false
  - text: log₃ₓ(7) = 40
    is_correct: false
  - text: 7 = log₃ₓ(40)
    is_correct: false
  explanation: La alternativa correcta es '3x = log₇(40)'. La base 7 pasa a ser la base del logaritmo de 40.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la ecuación $e^{x - 1} = 8$, ¿cuál es el despeje exacto de x?
  choices:
  - text: x = 1 + ln(8)
    is_correct: true
  - text: x = ln(8) - 1
    is_correct: false
  - text: x = ln(9)
    is_correct: false
  - text: x = e⁸ + 1
    is_correct: false
  explanation: La alternativa correcta es 'x = 1 + ln(8)'. $x - 1 = \ln(8) \implies x = 1 + \ln(8)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar el término exponencial $b^{g(x)}$ dejando coeficiente 1.'
- 'Paso 2: Verificar que el miembro derecho sea estrictamente positivo ($A > 0$).'
- 'Paso 3: Aplicar la equivalencia $g(x) = \log_b(A)$.'
- 'Paso 4: Despejar la incógnita $x$ mediante operaciones algebraicas lineales.'
errores_correccion: '- **Error común:** Aplicar logaritmo antes de despejar la potencia (ej: en $3 \cdot 2^x = 12$, escribir $x = \log_2(12)$).

  - **Cómo corregirlo:** **Primero divide por el coeficiente**: $2^x = 12/3 = 4 \implies x = \log_2(4) = \mathbf{2}$.'
ejemplos:
- titulo: 'Ejemplo 1: Conversión directa'
  enunciado: 'La forma logarítmica de $5^x = 22$ es:'
  alternativas:
  - x = log₅(22)
  - x = log₂₂(5)
  - x = 22/5
  - x = √22
  respuesta: x = log₅(22)
  solucion_pasos:
  - 'Paso 1: $5^x = 22 \iff x = \log_5(22)$.'
- titulo: 'Ejemplo 2: Con base de Euler'
  enunciado: 'Convierte $e^{2t} = 9$ a forma logarítmica:'
  alternativas:
  - 2t = ln(9)
  - t = ln(9) / e
  - 2t = log(9)
  - e = ln(9) / 2
  respuesta: 2t = ln(9)
  solucion_pasos:
  - 'Paso 1: $2t = \ln(9)$.'
- titulo: 'Ejemplo 3: Despeje previo'
  enunciado: 'Despeja $x$ en $2 \cdot 10^x = 500$:'
  alternativas:
  - x = log(250)
  - x = log(500) / 2
  - x = 250
  - x = 2,5
  respuesta: x = log(250)
  solucion_pasos:
  - 'Paso 1: $10^x = 250 \implies x = \log(250)$.'
- titulo: 'Ejemplo 4: Exponente binomio'
  enunciado: 'Despeja $x$ en $3^{x + 4} = 8$:'
  alternativas:
  - x = log₃(8) - 4
  - x = log₃(8) + 4
  - x = log₃(4)
  - x = 8/3 - 4
  respuesta: x = log₃(8) - 4
  solucion_pasos:
  - 'Paso 1: $x + 4 = \log_3(8) \implies x = \log_3(8) - 4$.'
errores_frecuentes:
- No aislar la potencia antes de aplicar el logaritmo.
- Intentar aplicar logaritmos a constantes negativas o cero.
- Invertir la base y el argumento en el logaritmo resultante.
afirmaciones_verdaderas:
- Toda ecuación exponencial b^(g(x)) = A equivale a g(x) = log_b(A) para A > 0.
- La conversión a forma logarítmica es la técnica fundamental para despejar incógnitas en exponentes.
al_terminar_debes_poder: '**QUÉ:** Convertir ecuaciones exponenciales a forma logarítmica para despejar incógnitas.


  **CÓMO:** Aislando la base b^(g(x)) = A y formulando g(x) = log_b(A) con A > 0.


