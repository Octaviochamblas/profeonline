semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.BISECTRIZ_DEFINICION
resumen_inicial: La bisectriz de un ángulo es el rayo interior que parte desde su
  vértice y lo divide en dos ángulos consecutivos de exactamente igual medida.
explicacion_simple: '![Definición de Bisectriz](/static/img/nodos/definicion-de-bisectriz-de-un-angulo-intro.svg)


  La bisectriz es una línea que funciona como un corte perfecto por la mitad de un
  ángulo. Si tienes un ángulo de 80° y trazas su bisectriz desde la esquina (vértice),
  el ángulo queda dividido en dos partes gemelas e idénticas de 40° cada una.'
explicacion_formal: '### Definición formal

  La **bisectriz** de un ángulo $\angle AOB$ es el rayo interior $\vec{OD}$ que divide
  al ángulo en dos ángulos adyacentes de exactamente igual medida (congruentes):


  $$\vec{OD} = \operatorname{Bis}(\angle AOB) \iff \mu(\angle AOD) = \mu(\angle DOB)
  = \frac{1}{2} \mu(\angle AOB)$$


  $$\mu(\angle AOB) = 2 \cdot \mu(\angle AOD)$$


  ### Desglose simbólico y geométrico

  - $\vec{OD}$: Rayo bisector originado en el vértice $O$.

  - Lugar geométrico: La bisectriz es el conjunto de todos los puntos $P$ del plano
  equidistantes de los lados del ángulo: $d(P, \vec{OA}) = d(P, \vec{OB})$.

  - Eje de simetría local: Divide al ángulo en dos regiones simétricas especulares.


  ### Síntesis didáctica

  La bisectriz es el eje de simetría angular del ángulo y la herramienta geométrica
  clave para trazar el incentro y resolver divisiones angulares equitativas.'
definiciones_clave: '- **Bisectriz**: Rayo que biseca (divide en dos partes iguales)
  un ángulo.

  - **Eje de simetría**: Recta soporte de la bisectriz que refleja un lado del ángulo
  exactamente sobre el otro. '
propiedades_relaciones: '- **Unicidad**: Para todo ángulo no nulo y no extendido existe
  una única bisectriz interior.

  - **Equidistancia**: Todo punto $P$ perteneciente a la bisectriz equidista de las
  dos rectas que contienen los lados del ángulo ($d(P, OA) = d(P, OB)$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Bisectriz](/static/img/nodos/definicion-de-bisectriz-de-un-angulo-ejemplos.svg)


    Se tiene un ángulo $\angle AOB = 76^\circ$ y se traza su bisectriz $\vec{OP}$.
    Calcula la medida del ángulo $\angle AOP$.'
  pasos:
  - 'Paso 1: Recordar la definición formal de bisectriz: divide el ángulo en dos partes
    iguales.'
  - 'Paso 2: Plantear la fórmula $\angle AOP = \frac{\angle AOB}{2}$.'
  - 'Paso 3: Sustituir el valor conocido: $\angle AOP = \frac{76^\circ}{2}$.'
  - 'Paso 4: Realizar la división: $\angle AOP = 38^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué hace la bisectriz de un ángulo?
  choices:
  - text: Divide el ángulo en dos ángulos congruentes de igual medida
    is_correct: true
  - text: Suma 180° con el ángulo
    is_correct: false
  - text: Corta perpendicularmente al segmento opuesto
    is_correct: false
  - text: Duplica el valor del ángulo
    is_correct: false
  explanation: Por definición, divide el ángulo en dos ángulos congruentes de igual
    medida.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la bisectriz divide un ángulo y una de las mitades mide 28°, ¿cuánto
    mide el ángulo completo original?
  choices:
  - text: 56° (porque 2 × 28° = 56°)
    is_correct: true
  - text: 14°
    is_correct: false
  - text: 90°
    is_correct: false
  - text: 152°
    is_correct: false
  explanation: 'El ángulo original es el doble de la mitad: 2 × 28° = 56° (porque
    2 × 28° = 56°).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el ángulo total o una de sus partes bisecadas.'
- 'Paso 2: Aplicar la relación de igualdad $\alpha = \frac{\text{Total}}{2}$ o $\text{Total}
  = 2\alpha$.'
- 'Paso 3: Calcular el valor angular correspondiente.'
errores_correccion: No confundas la bisectriz de un ángulo con la mediatriz de un
  segmento.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\vec{OP}$ es bisectriz de un ángulo de $50^\circ$, ¿cuánto mide cada
    mitad?
  alternativas:
  - $25^\circ$
  - $50^\circ$
  - $100^\circ$
  respuesta: $25^\circ$
  solucion_pasos:
  - $\frac{50^\circ}{2} = 25^\circ$.
- titulo: Ejemplo 2
  enunciado: Si una mitad generada por la bisectriz mide $35^\circ$, ¿cuánto mide
    el ángulo total?
  alternativas:
  - $70^\circ$
  - $17.5^\circ$
  - $90^\circ$
  respuesta: $70^\circ$
  solucion_pasos:
  - $2   imes 35^\circ = 70^\circ$.
- titulo: ¿La bisectriz de un ángulo recto de 90° genera dos ángulos de 45°?
  respuesta: Sí
  solucion_pasos:
  - Sí, 90° / 2 = 45°.
- titulo: ¿Un rayo cualquiera que pase por el interior de un ángulo es siempre su
    bisectriz?
  respuesta: 'No'
  solucion_pasos:
  - No, solo es bisectriz si divide el ángulo en dos medidas exactamente iguales.
errores_frecuentes:
- Confundir la bisectriz con la mediatriz o con una recta secante cualquiera.
- Asumir que un rayo interior es bisectriz sin verificar que las dos medidas sean
  iguales.
- Multiplicar por 2 en lugar de dividir al buscar la mitad del ángulo.
- Dividir entre 2 al buscar el ángulo total en lugar de multiplicar por 2.
- Olvidar que la bisectriz debe partir obligatoriamente desde el vértice $O$.
afirmaciones_verdaderas:
- La bisectriz divide un ángulo en dos partes exactamente iguales.
- Cada mitad mide exactamente la mitad del ángulo completo.
al_terminar_debes_poder: '**QUÉ:** Definir y reconocer la bisectriz de un ángulo y
  su propiedad de simetría.


  **CÓMO:** Aplicando la relación $\angle AOP = \frac{\angle AOB}{2}$ e identificando
  las dos mitades congruentes.


  ![Resumen de Definición de Bisectriz](/static/img/nodos/definicion-de-bisectriz-de-un-angulo-resumen.svg)'
