semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.BISECTRIZ_DEFINICION
resumen_inicial: La bisectriz es el rayo que divide un ángulo en dos partes exactamente
  iguales, una herramienta central en construcciones de simetría y en el incentro.
explicacion_simple: 'Imagina doblar un pedazo de papel en forma de ángulo por la mitad
  exacta para que los dos bordes calcen perfecto. La línea del doblez es la bisectriz:
  parte el ángulo en dos partes iguales.'
explicacion_formal: 'La **bisectriz** de un ángulo $\angle AOB$ es la semirrecta $\vec{OC}$
  con origen en el vértice $O$ que divide la región interior del ángulo en dos ángulos
  adyacentes congruentes: $m(\angle AOC) = m(\angle COB) = \frac{m(\angle AOB)}{2}$.'
definiciones_clave: '- **Definición de bisectriz de un ángulo**: Elemento o relación
  angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en definición de bisectriz de un ángulo se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Un haz de luz láser incide sobre un espejo y se refleja de modo que la
    normal (perpendicular) actúa como bisectriz del ángulo de $80^\circ$ entre el
    haz incidente y el reflejado. Halla el ángulo de incidencia.
  pasos:
  - 'Paso 1: Aplicar la definición de bisectriz: divide la abertura total en dos ángulos
    de igual medida.'
  - 'Paso 2: Dividir el ángulo total entre 2: $\frac{80^\circ}{2} = 40^\circ$.'
  - 'Paso 3: Concluir que el ángulo de incidencia respecto a la normal es de $40^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de definición de bisectriz de
    un ángulo?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la normal es la bisectriz del ángulo de 80° entre haz incidente y reflejado,
    ¿cuánto mide el ángulo de incidencia?
  choices:
  - text: 40°
    is_correct: true
  - text: 80°
    is_correct: false
  - text: 160°
    is_correct: false
  - text: 20°
    is_correct: false
  explanation: La alternativa correcta es '40°', al dividir $80^\circ / 2 = 40^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en definición de bisectriz de un ángulo.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en definición de bisectriz
  de un ángulo sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 65^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 115°
  - 65°
  - 90°
  respuesta: 115°
  solucion_pasos:
  - Despejando $x = 180 - 65 = 115^\circ$.
- titulo: Ejemplo 2
  enunciado: En definición de bisectriz de un ángulo, si dos ángulos son suplementarios
    y uno mide 65°, ¿cuánto mide el otro?
  alternativas:
  - 115°
  - 25°
  - 360°
  respuesta: 115°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 65 = 115^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en definición de
    bisectriz de un ángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en definición de bisectriz de un
    ángulo es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de definición de bisectriz de un ángulo.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
