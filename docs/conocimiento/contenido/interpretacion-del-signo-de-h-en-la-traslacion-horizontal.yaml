errores_frecuentes:
  - 'Dada la función $g(x) = (x - 8)^2$, es correcto afirmar que su eje de simetría se encuentra en la recta $x = -8$.'
  - 'La suposición de que el signo dentro del paréntesis $(x - h)$ tiene el mismo sentido geométrico que en la traslación vertical.'
  - 'La suposición de que un signo positivo interno $(x + 5)$ significa que los valores de entrada se han incrementado en el gráfico final.'
  - 'La equivalencia errónea entre invertir el signo del binomio y cambiar la concavidad de la parábola.'
  - 'Afirmar que la anulación del paréntesis $x - h = 0$ ocurre únicamente cuando el coeficiente cuadrático $a = 1$.'
afirmaciones_verdaderas:
  - 'En $g(x) = a(x - h)^2$, la resta $(x - h)$ desplaza el gráfico a la derecha porque se requiere un valor de $x$ mayor en $h$ para lograr la misma imagen.'
  - 'La abscisa del vértice $h$ tiene siempre el signo opuesto al término constante que acompaña a la $x$ dentro del binomio al cuadrado.'
al_terminar_debes_poder: |
  QUÉ: Interpretar analítica y geométricamente la inversión de signo del parámetro $h$ en la traslación horizontal.
  CÓMO: Plantear $x - h = 0$, despejar la abscisa del vértice $x = h$ y justificar por qué $-h$ traslada a la derecha y $+h$ a la izquierda.
