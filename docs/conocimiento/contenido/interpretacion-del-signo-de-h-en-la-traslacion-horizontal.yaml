semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.SIGNO_TRASLACION_HORIZONTAL
resumen_inicial: La interpretación del signo de $h$ en la traslación horizontal establece que un factor $(x - h)$ con $h > 0$ desplaza la curva hacia la derecha, mientras que $(x + d) = (x - (-d))$ con $d > 0$ desplaza la curva hacia la izquierda.
explicacion_simple: "![La interpretación del signo de $h$ en la traslación horizontal establece que un factor $(x - h)$ con $h > 0$ desplaza la curva hacia la derecha, mientras que $(x + d) = (x - (-d))$ con $d > 0$ desplaza la curva hacia la izquierda](/static/img/nodos/interpretacion-del-signo-de-h-en-la-traslacion-horizontal-intro.svg)\n\n\n¿Por qué la traslación horizontal parece funcionar \"al revés\" de lo que dice el signo?\n\n- **El principio de compensación:**\n  - Imagina que en $y = x^2$ la curva toca el fondo cuando la base es $0$ ($x = 0$).\n  - En $(x - 5)^2$, para que la base dé $0$, necesitas que **$x = 5$** (tuviste que moverte a la **DERECHA** a $+5$).\n  - En $(x + 5)^2$, para que la base dé $0$, necesitas que **$x = -5$** (tuviste que moverte a la **IZQUIERDA** a $-5$).\n- **Regla mnemotécnica:**\n  - **Signo $-$ dentro del binomio:** muévete a la **DERECHA** ($+h$).\n  - **Signo $+$ dentro del binomio:** muévete a la **IZQUIERDA** ($-h$)."
explicacion_formal: 'Sea $f: \mathbb{R} \to \mathbb{R}$ y consideremos la familia $g_h(x) = f(x - h)$. La **condición de invariancia de fase** exige que para reproducir el estado funcional evaluado en $x_0$:

  $$x - h = x_0 \Longleftrightarrow x = x_0 + h$$


  **Análisis de signos vectoriales**:

  1. Si $h > 0 \implies x_0 + h > x_0$: Todo punto experimental se posterga en el eje real, exigiendo un desplazamiento en la dirección del versor positivo $+\hat{\imath}$ (**hacia la derecha**).

  2. Si $h < 0 \implies h = -|h| \implies x_0 - |h| < x_0$: Todo punto se adelanta en el eje real, exigiendo un desplazamiento en la dirección del versor negativo $-\hat{\imath}$ (**hacia la izquierda**).'
definiciones_clave: '- **Inversión de signo de argumento**: Propiedad matemática por la cual la adición interna retarda/adelanta la variable independiente.

  - **Desplazamiento de fase**: Magnitud algebraica $h$ en el dominio.'
propiedades_relaciones: '- **Dualidad con la traslación vertical**: La traslación horizontal $f(x - h)$ tiene signo invertido; la traslación vertical $f(x) + k$ conserva su signo directo.

  - **Conservación de ceros relativos**: La distancia entre raíces se mantiene idéntica tras cualquier traslación horizontal.'
ejemplo_guiado:
  enunciado: '![Ejemplo La interpretación del signo de $h$ en la traslación horizontal establece que un factor $(x - h)$ con $h > 0$ desplaza la curva hacia la derecha, mientras que $(x + d) = (x - (-d))$ con $d > 0$ desplaza la curva hacia la izquierda](/static/img/nodos/interpretacion-del-signo-de-h-en-la-traslacion-horizontal-ejemplos.svg)



    Justifica formalmente mediante el concepto de anulación de base hacia qué sentido se desplazan:

    1) $f(x) = (x - 8)^2$

    2) $g(x) = (x + 11)^2$'
  pasos:
  - 'Paso 1: Para $f(x) = (x - 8)^2$:

    - Igualar la base a cero: $x - 8 = 0 \implies x = +8$.

    - Como la base se anula en $x = +8$, la parábola se desplazó **8 unidades hacia la DERECHA**.'
  - 'Paso 2: Para $g(x) = (x + 11)^2$:

    - Igualar la base a cero: $x + 11 = 0 \implies x = -11$.

    - Como la base se anula en $x = -11$, la parábola se desplazó **11 unidades hacia la IZQUIERDA**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la función $f(x) = (x - 3)^2$ se traslada hacia la derecha y no hacia la izquierda?
  choices:
  - text: Porque para que la base se anule (x - 3 = 0) se requiere x = +3.
    is_correct: true
  - text: Porque el número 3 es positivo.
    is_correct: false
  - text: Porque a > 0.
    is_correct: false
  - text: Por una convención sin fundamento algebraico.
    is_correct: false
  explanation: La alternativa correcta es 'Porque para que la base se anule (x - 3 = 0) se requiere x = +3.'. El vértice ocurre donde la base es cero, lo que exige $x = +3$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola tiene su vértice en x = -4, ¿cómo debe ser el binomio al cuadrado?
  choices:
  - text: (x + 4)²
    is_correct: true
  - text: (x - 4)²
    is_correct: false
  - text: x² - 4
    is_correct: false
  - text: (x - 0)² - 4
    is_correct: false
  explanation: La alternativa correcta es '(x + 4)²'. Sustituyendo $h = -4$ en $(x - h)^2$ queda $(x - (-4))^2 = (x + 4)^2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar la expresión dentro del cuadrado $(x - h)$.'
- 'Paso 2: Plantear la ecuación lineal igualándola a cero: $x - h = 0$.'
- 'Paso 3: Despejar $x = h$.'
- 'Paso 4: Si el resultado es positivo ($x > 0$), concluir traslación a la derecha.'
- 'Paso 5: Si el resultado es negativo ($x < 0$), concluir traslación a la izquierda.'
errores_correccion: '- **Error común:** Asociar el signo positivo $+$ dentro del paréntesis con moverse hacia los números positivos (derecha).

  - **Cómo corregirlo:** Recuerda que **$(x + 4)$ se anula en $x = -4$**, por lo que se mueve a la **IZQUIERDA**.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de sentido por anulación'
  enunciado: En $f(x) = 2(x - 10)^2$, ¿hacia dónde se trasladó?
  alternativas:
  - 10 unidades a la derecha
  - 10 unidades a la izquierda
  - 2 unidades a la derecha
  - 10 unidades hacia arriba
  respuesta: 10 unidades a la derecha
  solucion_pasos:
  - 'Paso 1: $x - 10 = 0 \implies x = 10$ (derecha).'
- titulo: 'Ejemplo 2: Sentido con binomio de suma'
  enunciado: En $g(x) = -(x + 15)^2$, ¿hacia dónde se trasladó?
  alternativas:
  - 15 unidades a la izquierda
  - 15 unidades a la derecha
  - 15 unidades hacia abajo
  - No se trasladó
  respuesta: 15 unidades a la izquierda
  solucion_pasos:
  - 'Paso 1: $x + 15 = 0 \implies x = -15$ (izquierda).'
- titulo: 'Ejemplo 3: Construcción de la función'
  enunciado: Escribe la función de $y = x^2$ desplazada 1 unidad a la derecha.
  alternativas:
  - y = (x - 1)^2
  - y = (x + 1)^2
  - y = x^2 - 1
  - y = x^2 + 1
  respuesta: y = (x - 1)^2
  solucion_pasos:
  - 'Paso 1: Derecha $\implies h = 1 \implies (x - 1)^2$.'
- titulo: 'Ejemplo 4: Comparación de signos'
  enunciado: Si $f(x) = (x - a)^2$ tiene vértice en $(-5, 0)$, ¿cuánto vale $a$?
  alternativas:
  - '-5'
  - '5'
  - '0'
  - '25'
  respuesta: '-5'
  solucion_pasos:
  - 'Paso 1: $h = -5 \implies a = -5$.'
errores_frecuentes:
- Asumir que el signo dentro del paréntesis coincide con el signo del vector traslacional.
- Confundir la traslación en el eje X con una traslación en el eje Y.
- Despejar erróneamente la ecuación de la base igualada a cero.
afirmaciones_verdaderas:
- Un signo negativo dentro del binomio (x - h) con h > 0 representa una traslación hacia la derecha.
- La gráfica se traslada a la izquierda si el binomio toma la forma (x + d) con d > 0.
al_terminar_debes_poder: '**QUÉ:** Interpretar y predecir el sentido de la traslación horizontal según el signo de h.


  **CÓMO:** Igualando el binomio interior a cero para determinar si el desplazamiento es hacia la derecha (h > 0) o hacia la izquierda (h < 0).


