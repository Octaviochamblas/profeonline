semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.SIGNO_TRASLACION_HORIZONTAL
resumen_inicial: 'Interpretación del signo de h en la traslación horizontal: parábola,
  vértice, concavidad y formas de Traslaciones y transformaciones.'
explicacion_simple: El signo de $h$ es la fuente más común de confusión al trabajar
  con traslaciones horizontales, porque su efecto es "contraintuitivo" a primera vista.
explicacion_formal: '### Definición formal


  Dada $g(x)=(x-h)^2$: para $h>0$, la gráfica de $f(x)=x^2$ se desplaza $h$ unidades
  a la derecha; para $h<0$, se desplaza $|h|$ unidades a la izquierda. Es fundamental
  identificar $h$ reescribiendo el binomio en la forma $(x-h)$, no leyendo directamente
  el signo que aparece en la expresión.


  ### Desarrollo didáctico


  El punto clave es que $(x+3)$ debe reescribirse como $(x-(-3))$ para identificar
  $h=-3$; el signo "+" dentro del paréntesis corresponde a una traslación hacia la
  **izquierda**, no hacia la derecha como podría parecer intuitivamente.


  Para $g(x)=(x+2)^2$: reescribiendo, $h=-2$, por lo que la parábola se traslada $2$
  unidades hacia la izquierda, no hacia la derecha.'
definiciones_clave: '- **Interpretación del signo de h en la traslación horizontal**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  interpretación del signo de h en la traslación horizontal.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando interpretación
    del signo de h en la traslación horizontal.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a interpretación
    del signo de h en la traslación horizontal.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
