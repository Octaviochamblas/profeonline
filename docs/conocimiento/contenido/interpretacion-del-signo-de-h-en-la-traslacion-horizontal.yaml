semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.SIGNO_TRASLACION_HORIZONTAL
resumen_inicial: La interpretación del signo de $h$ explica por qué en $a(x - h)^2$ restar $h$ desplaza a la derecha y sumar $h$ desplaza a la izquierda.
explicacion_simple: |
  Muchas personas se confunden con el signo de $h$ en la fórmula $f(x) = a(x - h)^2$. Aquí te explicamos **POR QUÉ FUNCIONA AL REVÉS**:

  - Para que la nueva función dé exactamente **cero** (el vértice), el contenido dentro del paréntesis $(x - h)$ debe ser nulo:
    $$x - h = 0 \implies x = h$$
  - Por eso:
    - **Si ves $(x - 5)^2$**: Se anula en **$x = +5$** $\implies$ Traslación **5 unidades hacia la DERECHA**.
    - **Si ves $(x + 5)^2$**: Se anula en **$x = -5$** $\implies$ Traslación **5 unidades hacia la IZQUIERDA**.

  **Resumen mnemotécnico**:
  - Resta interna $(x - h) \implies$ Movimiento en el sentido **POSITIVO (+X, derecha)**.
  - Suma interna $(x + h) \implies$ Movimiento en el sentido **NEGATIVO (-X, izquierda)**.
explicacion_formal: |
  Sea la función madre $f(x) = ax^2$ con vértice en el origen $(0,0)$. La función trasladada $g(x) = a(x - h)^2$ preserva la misma imagen de salida $y$ evaluando el argumento corrido:

  $$g(x) = f(x - h)$$

  **Análisis algebraico del corrimiento de fase horizontal:**
  Para obtener la misma salida que producía $f$ en un punto de referencia $x_0$ ($f(x_0) = y_0$), la función $g$ requiere una entrada $x$ tal que:

  $$x - h = x_0 \implies x = x_0 + h$$

  - Si $h > 0$: El valor de entrada $x$ debe ser **mayor en $h$ unidades** que $x_0$, lo que geométricamente corre toda la curva a la derecha.
  - Si $h < 0$: Escribiendo $g(x) = a(x - (-|h|))^2 = a(x + |h|)^2$, la entrada requiere $x = x_0 - |h|$, corriendo la curva a la izquierda.
definiciones_clave: |
  - **Corrimiento de fase horizontal**: Fenómeno algebraico por el cual evaluar $f(x - h)$ exige incrementar en $h$ las abscisas para preservar los valores de imagen.
propiedades_relaciones: |
  - **Invariancia de distancias entre puntos**: El signo de $h$ determina el sentido vectorial de traslación $\vec{v} = (h, 0)$, conservando intactas todas las distancias relativas entre puntos del grafo.
ejemplo_guiado:
  enunciado: 'Explica mediante la anulación de la base por qué la función $g(x) = (x + 3)^2$ representa una traslación a la izquierda y calcula la posición de su vértice.'
  pasos:
    - 'Paso 1: Plantear la ecuación de anulación del binomio: $x + 3 = 0$.'
    - 'Paso 2: Despejar la variable $x$: $x = -3$.'
    - 'Paso 3: Concluir que para alcanzar el valor mínimo de la curva ($y=0$), $x$ debe ser $-3$.'
    - 'Paso 4: Declarar que el gráfico se desplazó 3 unidades a la izquierda hasta el vértice $V(-3, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la función $f(x) = (x - 9)^2$ desplaza la parábola a la derecha y no a la izquierda?'
    choices:
      - {text: 'Porque para anular el binomio a cero se requiere que la abscisa sea positiva $x = 9$', is_correct: true}
      - {text: 'Porque el signo negativo indica multiplicaciones positivas.', is_correct: false}
      - {text: 'Porque el exponente 2 vuelve negativo cualquier número.', is_correct: false}
      - {text: 'Porque el coeficiente principal es mayor que 9.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque para anular el binomio a cero se requiere que la abscisa sea positiva $x = 9$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En la función cuadrática $g(x) = -4(x + 10)^2$, ¿cuál es el signo y el valor de la abscisa del vértice $h$?'
    choices:
      - {text: '$h = -10$ (traslación a la izquierda)', is_correct: true}
      - {text: '$h = +10$ (traslación a la derecha).', is_correct: false}
      - {text: '$h = -4$ (traslación hacia abajo).', is_correct: false}
      - {text: '$h = 0$ (sin traslación).', is_correct: false}
    explanation: 'La alternativa correcta es ''$h = -10$ (traslación a la izquierda)''. $(x + 10) = (x - (-10)) \implies h = -10$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Observar el binomio dentro de la potencia cuadrática $(x \pm h)^2$.'
  - 'Paso 2: Igualar el binomio a cero: $x \pm h = 0$.'
  - 'Paso 3: Despejar $x$ para hallar el valor exacto de la abscisa del vértice $h$.'
  - 'Paso 4: Si $h > 0$, asociar a traslación a la derecha; si $h < 0$, asociar a traslación a la izquierda.'
errores_correccion: |
  - **Error común:** Memorizar mecánicamente que "menos es menos" aplicando un desplazamiento a la izquierda al ver $(x - 4)^2$.
  - **Cómo corregirlo:** Iguala **SIEMPRE EL PARÉNTESIS A CERO**: $x - 4 = 0 \implies x = +4$ (el signo de $x$ te indica la dirección real).
