procedimiento:
- 'Paso 1: Reescribe el binomio en la forma exacta $(x-h)$.'
- 'Paso 2: Si $h>0$, concluye que la traslación es hacia la derecha.'
- 'Paso 3: Si $h<0$, concluye que la traslación es hacia la izquierda.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en interpretación del signo de h en la traslación
  horizontal.
ejemplos:
- titulo: Interpretación con signo positivo dentro del paréntesis
  enunciado: ¿Hacia dónde se traslada la parábola $g(x)=(x+7)^2$ respecto a $f(x)=x^2$?
  solucion_pasos:
  - Reescribiendo, $(x+7)=(x-(-7))$, por lo que $h=-7$.
  - Se traslada $7$ unidades hacia la izquierda.
- titulo: Interpretación con signo negativo dentro del paréntesis
  enunciado: ¿Hacia dónde se traslada la parábola $g(x)=(x-9)^2$ respecto a $f(x)=x^2$?
  solucion_pasos:
  - El binomio ya tiene la forma $(x-h)$ con $h=9$.
  - Se traslada $9$ unidades hacia la derecha.
- titulo: ¿Un signo "+" dentro del paréntesis siempre corresponde a una traslación
    hacia la izquierda?
  enunciado: ¿Un signo "+" dentro del paréntesis siempre corresponde a una traslación
    hacia la izquierda?
  respuesta: Sí
  solucion_pasos:
  - $(x+k)$ con $k>0$ equivale a $(x-(-k))$, por lo que $h=-k<0$, correspondiente
    a una traslación hacia la izquierda.
- titulo: ¿El signo dentro del paréntesis se lee directamente igual al signo de $h$?
  enunciado: ¿El signo dentro del paréntesis se lee directamente igual al signo de
    $h$?
  respuesta: 'No'
  solucion_pasos:
  - Se debe reescribir el binomio como $(x-h)$ antes de leer correctamente el signo
    de $h$.
errores_frecuentes:
- Interpretar $(x+3)$ como traslación hacia la derecha por el signo "+" visible, sin
  reescribir correctamente.
- Confundir "traslación hacia la derecha" con "traslación hacia la izquierda" al leer
  el signo de $h$.
- Aplicar la misma lógica de signos usada en la traslación vertical, que funciona
  de manera distinta.
- No verificar el signo de $h$ tras la reescritura antes de concluir la dirección
  de la traslación.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  interpretación del signo de h en la traslación horizontal.
