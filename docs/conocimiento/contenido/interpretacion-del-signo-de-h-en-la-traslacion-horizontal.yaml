semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.SIGNO_TRASLACION_HORIZONTAL
resumen_inicial: 'El signo del parámetro $h$ en la forma $(x - h)^2$ rige la dirección del desplazamiento horizontal: si $h > 0$ desplaza a la derecha, y si $h < 0$ desplaza a la izquierda.'
explicacion_simple: |
  A primera vista, la regla de signos de la traslación horizontal parece al revés de lo esperado: cuando vemos un signo menos dentro del paréntesis, como en $(x - 3)^2$, la gráfica se mueve hacia la derecha (hacia los números positivos). Cuando vemos un signo más, como en $(x + 4)^2$, la gráfica se mueve hacia la izquierda (hacia los números negativos). Esto ocurre porque debemos buscar qué número $x$ hace cero al paréntesis.
explicacion_formal: |
  ### Definición formal
  En la transformación gráfica $g(x) = a(x - h)^2$, la **dirección del desplazamiento horizontal** respecto a la parábola origen $f(x) = ax^2$ viene determinada por el valor algebraico de $h$:
  - **Si $h > 0$**: La gráfica exhibe un binomio $(x - h)^2$ y se traslada $h$ unidades hacia la **derecha** (sentido positivo del eje $x$).
  - **Si $h < 0$**: La gráfica exhibe un binomio $(x - (-h))^2 = (x + |h|)^2$ y se traslada $|h|$ unidades hacia la **izquierda** (sentido negativo del eje $x$).

  ### Desglose simbólico
  - Cero del binomio: $(x - h) = 0 \implies x = h$.
  - En $g(x) = (x - 5)^2$, el cero del binomio ocurre en $x = +5 > 0$ (desplazamiento a la derecha).
  - En $g(x) = (x + 3)^2$, el cero del binomio ocurre en $x = -3 < 0$ (desplazamiento a la izquierda).

  ### Síntesis didáctica
  Para no dudar sobre la dirección de la traslación, basta con responder a la pregunta: *¿Para qué valor de $x$ la expresión al cuadrado se hace cero?* La respuesta a esa pregunta indica hacia qué posición exacta sobre el eje $x$ se ha corrido el vértice.
definiciones_clave: |
  - **Parámetro de desplazamiento $h$**: Constante que determina la posición del vértice sobre el eje $x$.
  - **Desplazamiento a la derecha**: Movimiento en sentido $+x$ producido por $h > 0$, visible como $(x - h)^2$.
  - **Desplazamiento a la izquierda**: Movimiento en sentido $-x$ producido por $h < 0$, visible como $(x + |h|)^2$.
propiedades_relaciones: |
  - **Simetría respecto al origen**: Las funciones $f_1(x) = (x - c)^2$ y $f_2(x) = (x + c)^2$ son imágenes especulares reflejadas respecto al eje $y$.
  - **Eje de simetría implícito**: El signo y magnitud de $h$ fijan directamente la recta del eje de simetría $x = h$.
ejemplo_guiado:
  enunciado: 'Analiza la dirección de la traslación horizontal y determina el vértice de las funciones $f(x) = (x - 6)^2$ y $g(x) = (x + 8)^2$ respecto a $y = x^2$.'
  pasos:
    - 'Paso 1: Para $f(x) = (x - 6)^2$, igualamos el binomio a cero: $x - 6 = 0 \implies x = 6$. Como $h = 6 > 0$, la gráfica se desplaza 6 unidades hacia la derecha, con vértice en $V(6, 0)$.'
    - 'Paso 2: Para $g(x) = (x + 8)^2$, reescribimos como $(x - (-8))^2$. Igualamos a cero: $x + 8 = 0 \implies x = -8$.'
    - 'Paso 3: Como $h = -8 < 0$, la gráfica se desplaza 8 unidades hacia la izquierda, con vértice en $V(-8, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la gráfica de $y = x^2$ se traslada 9 unidades hacia la izquierda sobre el eje $x$, ¿cuál es su expresión algebraica?'
    choices:
      - {text: '$y = (x + 9)^2$', is_correct: true}
      - {text: '$y = (x - 9)^2$', is_correct: false}
      - {text: '$y = x^2 - 9$', is_correct: false}
      - {text: '$y = x^2 + 9$', is_correct: false}
    explanation: 'La alternativa correcta es ''$y = (x + 9)^2$''. Desplazar 9 unidades a la izquierda corresponde a $h = -9$, lo que genera la expresión $(x - (-9))^2 = (x + 9)^2$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la función cuadrática $f(x) = -2(x - 3)^2 + 1$, ¿en qué dirección se ha desplazado horizontalmente el vértice respecto al origen?'
    choices:
      - {text: '3 unidades hacia la derecha', is_correct: true}
      - {text: '3 unidades hacia la izquierda', is_correct: false}
      - {text: '2 unidades hacia abajo', is_correct: false}
      - {text: '1 unidad hacia la izquierda', is_correct: false}
    explanation: 'La alternativa correcta es ''3 unidades hacia la derecha''. El término $(x - 3)$ da $h = 3 > 0$, representando una traslación de 3 unidades a la derecha.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Observar el signo dentro del paréntesis $(x \mp c)^2$.'
  - 'Paso 2: Igualar el contenido del paréntesis a cero: $x \mp c = 0 \implies x = h$.'
  - 'Paso 3: Si $h > 0$ (aparece como $-c$), concluir traslación a la derecha. Si $h < 0$ (aparece como $+c$), concluir traslación a la izquierda.'
errores_correccion: |
  - **Error 1:** Asociar la presencia del signo más interno $(x + c)^2$ con un movimiento hacia la derecha por ser el lado positivo. **Cómo corregirlo:** La traslación a la derecha exige $h > 0$, lo que genera el signo menos $(x - h)^2$. El signo más $(x + c)^2 = (x - (-c))^2$ implica $h = -c < 0$ (desplazamiento a la izquierda).
  - **Error 2:** Creer que el signo menos fuera del paréntesis $-(x - h)^2$ altera la dirección horizontal. **Cómo corregirlo:** El signo menos externo afecta la concavidad (abre hacia abajo), pero no modifica la dirección del desplazamiento horizontal dada por $h$.
ejemplos:
  - titulo: 'Dirección de traslación con signo positivo interno'
    enunciado: '¿Hacia dónde se desplaza la parábola $f(x) = x^2$ para formar $g(x) = (x + 5)^2$?'
    alternativas:
      - '5 unidades hacia la izquierda'
      - '5 unidades hacia la derecha'
      - '5 unidades hacia arriba'
    respuesta: '5 unidades hacia la izquierda'
    solucion_pasos:
      - '1. La expresión $(x + 5)^2$ equivale a $(x - (-5))^2$, luego $h = -5$.'
      - '2. Un valor $h = -5 < 0$ desplaza la curva 5 unidades a la izquierda.'
  - titulo: 'Dirección de traslación con signo negativo interno'
    enunciado: '¿Hacia dónde se desplaza $f(x) = x^2$ para formar $h(x) = (x - 10)^2$?'
    alternativas:
      - '10 unidades hacia la derecha'
      - '10 unidades hacia la izquierda'
      - '10 unidades hacia abajo'
    respuesta: '10 unidades hacia la derecha'
    solucion_pasos:
      - '1. En $(x - 10)^2$, el valor es $h = 10 > 0$.'
      - '2. El signo positivo de $h$ desplaza la parábola 10 unidades a la derecha.'
  - titulo: 'Determinación por cero de binomio'
    enunciado: '¿Igualar a cero el binomio $x + 4 = 0$ nos da la abscisa correcta $x = -4$ del vértice trasladado a la izquierda?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Resolver la ecuación lineal interna entrega directamente la abscisa $h = -4$.'
  - titulo: 'Efecto de h = 0'
    enunciado: 'Si $h = 0$, ¿la función cuadrática carece de traslación horizontal respecto al eje $y$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cuando $h = 0$, la expresión es $ax^2 + k$, manteniendo su vértice sobre el eje $y$.'
errores_frecuentes:
  - 'La función $g(x) = (x + 3)^2$ desplaza la parábola $y = x^2$ en 3 unidades hacia la derecha.'
  - 'La función $f(x) = (x - 4)^2$ ubica su vértice en el punto $V(-4, 0)$.'
  - 'El signo positivo dentro del paréntesis $(x + c)^2$ indica que la parábola abre hacia arriba.'
  - 'En la función $f(x) = -(x + 2)^2$, la parábola se desplaza 2 unidades hacia la derecha porque la concavidad es negativa.'
  - 'Un desplazamiento a la izquierda requiere cambiar el signo del coeficiente principal $a$.'
afirmaciones_verdaderas:
  - 'En la expresión $a(x - h)^2$, la resta $(x - h)$ con $h > 0$ desplaza la gráfica hacia la derecha, mientras que la suma $(x + |h|)$ desplaza hacia la izquierda.'
  - 'La abscisa del vértice trasladado corresponde exactamente a la solución de la ecuación lineal $x - h = 0$.'
al_terminar_debes_poder: 'Interpretar el signo del parámetro $h$ en la forma canónica para determinar sin vacilación la dirección del desplazamiento horizontal.'
