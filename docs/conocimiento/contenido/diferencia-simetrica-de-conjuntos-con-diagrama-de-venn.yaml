semantic_id: MAT.FUND.OPERACIONES_CONJUNTOS.DIFERENCIA_SIMETRICA
resumen_inicial: 'Definición, conmutatividad, estructura de grupo abeliano, representación en diagrama de Venn y cálculo de la diferencia simétrica ($A \bigtriangleup B$).'
explicacion_simple: |
  La **diferencia simétrica** (escrita con un triángulo: **$A \bigtriangleup B$** o **$A \oplus B$**) es la operación que reúne **todos los elementos que pertenecen a $A$ o a $B$, pero NO a ambos a la vez** (es la disyunción exclusiva lógica "o exclusivo"). En palabras sencillas, es juntar las dos medialunas exclusivas ("Solo $A$" + "Solo $B$") y quitar la intersección central. En un diagrama de Venn, se representa **sombreando las dos medialunas laterales y dejando en blanco el centro de cruce**.
explicacion_formal: |
  ### Definición formal
  En la teoría de conjuntos y el álgebra abstracta, la **diferencia simétrica** de dos conjuntos $A$ y $B$ se define como:
  $$A \bigtriangleup B = \{x \in \mathcal{U} \mid (x \in A \land x \notin B) \lor (x \in B \land x \notin A)\}$$
  Se expresa algebraicamente mediante dos formas canónicas equivalentes:
  1. **Unión de diferencias exclusivas**: $A \bigtriangleup B = (A \setminus B) \cup (B \setminus A)$.
  2. **Diferencia entre unión e intersección**: $A \bigtriangleup B = (A \cup B) \setminus (A \cap B)$.

  ### Desglose simbólico
  - Conectivo lógico subyacente: Disyunción exclusiva ($\oplus$ o $\veebar$).
  - Estructura de Grupo Abeliano: El par $(\mathcal{P}(\mathcal{U}), \bigtriangleup)$ es un grupo abeliano booleano:
    - Conmutatividad: $A \bigtriangleup B = B \bigtriangleup A$.
    - Asociatividad: $(A \bigtriangleup B) \bigtriangleup C = A \bigtriangleup (B \bigtriangleup C)$.
    - Elemento neutro: $A \bigtriangleup \emptyset = A$.
    - Elemento inverso (autoinversos / involución): $A \bigtriangleup A = \emptyset$.
  - Cardinalidad para conjuntos finitos: $|A \bigtriangleup B| = |A| + |B| - 2|A \cap B|$.

  ### Síntesis didáctica
  La diferencia simétrica mide la distancia conjuntista (métrica de Fréchet-Nikodym) entre conjuntos: $d(A, B) = |A \bigtriangleup B|$.
definiciones_clave: |
  - **Diferencia simétrica ($A \bigtriangleup B$)**: Conjunto de elementos que pertenecen exclusivamente a uno de los dos conjuntos, pero no a ambos.
  - **Disyunción exclusiva ($\oplus$)**: Operador lógico que es verdadero si y solo si exactamente una de las condiciones es verdadera.
  - **Grupo abeliano conjuntista**: Estructura algebraica formada por $(\mathcal{P}(\mathcal{U}), \bigtriangleup)$ con neutro $\emptyset$ e inversos propios.
propiedades_relaciones: |
  - **Criterio de igualdad**: $A = B \iff A \bigtriangleup B = \emptyset$.
  - **Conjuntos disjuntos**: Si $A \cap B = \emptyset$, entonces $A \bigtriangleup B = A \cup B$.
ejemplo_guiado:
  enunciado: 'Dados los conjuntos $A = \{1, 2, 3, 4\}$ y $B = \{3, 4, 5, 6\}$, calcula $A \bigtriangleup B$ mediante las dos fórmulas canónicas y determina su cardinalidad.'
  pasos:
    - 'Paso 1: Identificar los elementos de cada zona:
      - $A \cap B = \{3, 4\}$.
      - $A \setminus B = \{1, 2\}$.
      - $B \setminus A = \{5, 6\}$.'
    - 'Paso 2: Calcular mediante la primera fórmula $A \bigtriangleup B = (A \setminus B) \cup (B \setminus A)$:
      - $A \bigtriangleup B = \{1, 2\} \cup \{5, 6\} = \{1, 2, 5, 6\}$.'
    - 'Paso 3: Calcular mediante la segunda fórmula $A \bigtriangleup B = (A \cup B) \setminus (A \cap B)$:
      - $A \cup B = \{1, 2, 3, 4, 5, 6\}$.
      - $(A \cup B) \setminus \{3, 4\} = \{1, 2, 5, 6\}$.'
    - 'Paso 4: Comprobar la igualdad de ambos resultados.'
    - 'Paso 5: Calcular la cardinalidad: $|A \bigtriangleup B| = |A| + |B| - 2|A \cap B| = 4 + 4 - 2(2) = 8 - 4 = 4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula equivalente para calcular la diferencia simétrica $A \bigtriangleup B$ a partir de la unión y la intersección?'
    choices:
      - {text: '$(A \cup B) \setminus (A \cap B)$', is_correct: true}
      - {text: '$(A \cap B) \setminus (A \cup B)$', is_correct: false}
      - {text: '$(A \cup B) \cap (A \cap B)$', is_correct: false}
      - {text: '$(A \setminus B) \cap (B \setminus A)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(A \cup B) \setminus (A \cap B)$''. La unión total menos los elementos de la intersección compartida.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $|A| = 15$, $|B| = 20$ y $|A \cap B| = 5$, ¿cuál es la cardinalidad de la diferencia simétrica $|A \bigtriangleup B|$?'
    choices:
      - {text: '$25$ elementos ($15 + 20 - 2 \cdot 5$)', is_correct: true}
      - {text: '$30$ elementos', is_correct: false}
      - {text: '$35$ elementos', is_correct: false}
      - {text: '$5$ elementos', is_correct: false}
    explanation: 'La alternativa correcta es ''$25$ elementos ($15 + 20 - 2 \cdot 5$)''. Se resta dos veces la intersección: $35 - 10 = 25$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Determinar la unión $A \cup B$ y la intersección $A \cap B$ de ambos conjuntos.'
  - 'Paso 2: Retirar de la unión todos los elementos que forman parte de la intersección.'
  - 'Paso 3: Alternativamente, calcular "Solo $A$" ($A \setminus B$) y "Solo $B$" ($B \setminus A$) y unirlos.'
  - 'Paso 4: Escribir el conjunto resultante entre llaves.'
  - 'Paso 5: En el diagrama de Venn, sombrear ambas medialunas laterales, dejando sin sombrear la región central y la exterior.'
errores_correccion: |
  - **Error 1:** Incluir los elementos de la intersección $A \cap B$ en la diferencia simétrica. **Cómo corregirlo:** La diferencia simétrica representa el "o exclusivo"; los elementos que están en ambos se descartan obligatoriamente.
  - **Error 2:** Restar la intersección una sola vez en el cálculo de cardinalidad. **Cómo corregirlo:** Para la cardinalidad de $A \bigtriangleup B$ se debe restar $2|A \cap B|$ ($|A| + |B| - 2|A \cap B|$), ya que la intersección estaba sumada en $|A|$ y en $|B|$.
ejemplos:
  - titulo: 'Diferencia simétrica de conjuntos idénticos'
    enunciado: '¿Cuánto vale $A \bigtriangleup A$?'
    alternativas:
      - '$\emptyset$'
      - '$A$'
      - '$\mathcal{U}$'
    respuesta: '$\emptyset$'
    solucion_pasos:
      - '1. $(A \cup A) \setminus (A \cap A) = A \setminus A = \emptyset$.'
  - titulo: 'Diferencia simétrica con el vacío'
    enunciado: '¿Cuánto vale $A \bigtriangleup \emptyset$?'
    respuesta: '$A$'
    solucion_pasos:
      - 'El conjunto vacío es el elemento neutro de la diferencia simétrica.'
  - titulo: 'Conmutatividad'
    enunciado: '¿Se cumple que $A \bigtriangleup B = B \bigtriangleup A$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, a diferencia de la resta simple, la diferencia simétrica es estrictamente conmutativa.'
  - titulo: 'Diferencia simétrica de disjuntos'
    enunciado: 'Si $A = \{1, 2\}$ y $B = \{3, 4\}$, ¿cuál es $A \bigtriangleup B$?'
    respuesta: '$\{1, 2, 3, 4\}$'
    solucion_pasos:
      - 'Como $A \cap B = \emptyset$, $A \bigtriangleup B = A \cup B = \{1, 2, 3, 4\}$.'
errores_frecuentes:
  - 'La afirmación de que la diferencia simétrica incluye los elementos compartidos de la intersección.'
  - 'La afirmación de que la diferencia simétrica no es conmutativa ($A \bigtriangleup B \neq B \bigtriangleup A$).'
  - 'La afirmación de que la diferencia simétrica de un conjunto consigo mismo da el conjunto original ($A \bigtriangleup A = A$).'
  - 'La afirmación de que la cardinalidad de la diferencia simétrica se obtiene restando una sola vez la intersección.'
  - 'La afirmación de que en el diagrama de Venn la diferencia simétrica sombrea la región central.'
afirmaciones_verdaderas:
  - 'La diferencia simétrica $A \bigtriangleup B$ es el conjunto formado por los elementos que pertenecen a $A$ o a $B$, pero no a ambos a la vez ($A \bigtriangleup B = (A \cup B) \setminus (A \cap B)$).'
  - 'La diferencia simétrica es conmutativa y asociativa, teniendo al conjunto vacío como elemento neutro ($A \bigtriangleup \emptyset = A$) y cumpliendo que todo conjunto es su propio inverso ($A \bigtriangleup A = \emptyset$).'
al_terminar_debes_poder: |
  QUÉ: Definir, calcular y sombrear en diagramas de Venn la diferencia simétrica de conjuntos ($A \bigtriangleup B$).
  CÓMO: Unir las diferencias relativas $(A \setminus B) \cup (B \setminus A)$, aplicar el conectivo $\oplus$ y calcular cardinalidades deduciendo dos veces la intersección ($|A| + |B| - 2|A \cap B|$).
