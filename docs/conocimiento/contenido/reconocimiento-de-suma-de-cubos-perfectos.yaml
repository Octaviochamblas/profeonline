  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que el binomio esté compuesto por dos términos unidos por el
  signo $+$.'
- 'Paso 2: Extraer la raíz cúbica exacta del coeficiente numérico y dividir los exponentes
  de las variables por 3.'
- 'Paso 3: Definir las bases $A$ y $B$ comprobando que $A^3 + B^3$ recompone el binomio
  original.'
errores_correccion: '- **Error 1: Confundir la suma de cubos con la suma de cuadrados
  declarando que $x^3 + 8$ no se puede factorizar.** **Cómo corregirlo:** La suma
  de cuadrados $x^2 + y^2$ no es factorizable en $\mathbb{R}$, pero la suma de cubos
  $x^3 + y^3$ SIEMPRE se factoriza en $\mathbb{R}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $8a^3 + 1$ una suma de cubos perfectos?
  alternativas:
  - Sí, con bases $A = 2a$ y $B = 1$
  - No, porque 1 no es un cubo
  - No, porque $8a^3$ no es cubo
  respuesta: Sí, con bases $A = 2a$ y $B = 1$
  solucion_pasos:
  - 1. $\sqrt[3]{8a^3} = 2a$.
  - 2. $\sqrt[3]{1} = 1$.
- titulo: Ejemplo 2
  enunciado: Para la expresión $x^6 + 27y^3$, ¿cuáles son sus bases cúbicas $A$ y
    $B$?
  alternativas:
  - $A = x^2$ y $B = 3y$
  - $A = x^3$ y $B = 9y$
  - $A = x^2$ y $B = 9y$
  respuesta: $A = x^2$ y $B = 3y$
  solucion_pasos:
  - 1. $\sqrt[3]{x^6} = x^2$.
  - 2. $\sqrt[3]{27y^3} = 3y$.
- titulo: ¿Es $x^3 + 64$ una suma de cubos perfectos con bases $x$ y $4$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^3 + 4^3 = x^3 + 64$.
- titulo: ¿Un binomio con signo menos entre dos cubos representa una suma de cubos?
  respuesta: 'No'
  solucion_pasos:
  - No, requiere explícitamente el signo $+$; con signo minus es una diferencia de
    cubos.
errores_frecuentes:
- Declarar que la suma de cubos no es factorizable en los números reales por analogía
  con la suma de cuadrados.
- Dividir el exponente de las variables por 2 en lugar de calcular la raíz cúbica
  dividiendo por 3.
- Declarar que el número 1 no es un cubo perfecto ignorando que $1^3 = 1$.
- Sustituir el signo de adición central por una resta al identificar las bases.
- Identificar el coeficiente numérico $27$ como base $9$ por división por 3 en vez
  de raíz cúbica.
afirmaciones_verdaderas:
- Una suma de cubos $A^3 + B^3$ exige que las raíces cúbicas $A$ y $B$ sean exactas.
- A diferencia de la suma de cuadrados, la suma de cubos es siempre factorizable en
  el conjunto de los números reales.
al_terminar_debes_poder: Al terminar serás capaz de reconocer sumas de cubos perfectos
  e identificar sus bases $A$ y $B$.
