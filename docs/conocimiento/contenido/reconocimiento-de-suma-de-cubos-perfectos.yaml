semantic_id: MAT.ALG.FACTOR_CUBOS.RECONOCIMIENTO_SUMA_CUBOS
resumen_inicial: 'Reconocimiento de suma de cubos perfectos: concepto, método de descomposición
  y reglas en Factorización asociada a cubos.'
explicacion_simple: Si la suma de cuadrados era un espejismo que no se podía factorizar,
  la Suma de Cubos es una grata sorpresa. En la tercera dimensión, las reglas de los
  signos cambian y permiten que $a^3 + b^3$ se pueda romper en piezas más pequeñas.
explicacion_formal: '### Definición formal


  Al sacar raíz cúbica, el exponente se divide entre 3. Por ende, debe ser múltiplo
  de 3 para que sea exacto.


  ### Desarrollo didáctico


  Para reconocer una suma de cubos $A^3 + B^3$, debes hacer un simple ''control de
  calidad'':

  1. Son exactamente dos términos.

  2. Hay un signo ''más'' $(+)$ entre ellos.

  3. Ambos términos tienen raíz cúbica exacta.


  Ejemplo: $8x^3 + 27$.

  - ¿Son dos términos sumados? Sí.

  - La raíz cúbica de $8x^3$ se calcula sacando raíz cúbica a 8 (que es 2, pues $2
  \times 2 \times 2 = 8$) y raíz cúbica a $x^3$ (que es $x$). Por tanto, es $2x$.

  - La raíz cúbica de $27$ es 3 (pues $3 \times 3 \times 3 = 27$).


  Como ambos pasaron la prueba, estamos ante una Suma de Cubos y podemos prepararnos
  para aplicar su fórmula de factorización.'
definiciones_clave: '- **Reconocimiento de suma de cubos perfectos**: Técnica de factorización
  para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en reconocimiento de suma de cubos perfectos.'
