semantic_id: MAT.ALG.FACTOR_CUBOS.RECONOCIMIENTO_SUMA_CUBOS
resumen_inicial: El reconocimiento de suma de cubos perfectos consiste en verificar que un binomio esté compuesto por la adición
  de dos términos cuyos coeficientes poseen raíz cúbica exacta y cuyos exponentes son divisibles por 3.
explicacion_simple: "Para saber si un binomio es una **Suma de Cubos Perfectos** (ej: $8x^3 + 27$):\n- **3 CONDICIONES INNEGOCIABLES**:\n\
  \  1. **Dos términos con un signo más al centro**: Debe ser una **suma** ($+$). (¡A diferencia de los cuadrados, las sumas\
  \ de cubos SÍ se pueden factorizar!).\n  2. **Coeficientes numéricos cúbicos**: Números como $1, 8, 27, 64, 125, 216, 343,\
  \ 512, 729, 1000$, los cuales tienen raíz cúbica entera exacta ($\\sqrt[3]{8} = 2, \\sqrt[3]{27} = 3$).\n  3. **Exponentes\
  \ literales divisibles por 3**: Los exponentes de las letras deben ser múltiplos de 3 ($x^3, x^6, x^9, x^{12}$), permitiendo\
  \ extraer su raíz cúbica dividiendo el exponente entre 3 ($\\sqrt[3]{x^6} = x^2$).\n\n![Reconocimiento de suma de cubos](/static/img/nodos/reconocimiento-de-suma-de-cubos-perfectos-intro.svg)\n"
explicacion_formal: "### Definición formal\nSea la forma binómica $B(x) = C_1 x_1^{3\\alpha_1} \\dots x_m^{3\\alpha_m} + C_2\
  \ y_1^{3\\beta_1} \\dots y_k^{3\\beta_k} \\in \\mathbb{R}[x_1, \\dots, x_m, y_1, \\dots, y_k]$. Se define como una **suma\
  \ de cubos perfectos** sobre $\\mathbb{Q}$ si satisface:\n\n1. **Operador aditivo principal**: Los dos términos están unidos\
  \ por una adición estricta ($+$).\n2. **Cubos de coeficientes**: $C_1, C_2 \\in \\{k^3 \\mid k \\in \\mathbb{Q}^+\\}$ admiten\
  \ raíz cúbica exacta $\\sqrt[3]{C_1}, \\sqrt[3]{C_2} \\in \\mathbb{Q}$.\n3. **Divisibilidad de exponentes por 3**: Todos\
  \ los exponentes son de la forma $3k$ con $k \\in \\mathbb{N}$, satisfaciendo:\n\n   $$\\sqrt[3]{x_i^{3\\alpha_i}} = x_i^{\\\
  alpha_i} \\in \\mathbb{N}$$\n\n### Síntesis didáctica\nIdentificar una suma de cubos exige extraer las raíces cúbicas a\
  \ las componentes numéricas y dividir por 3 los exponentes de las letras para obtener las bases $A$ y $B$ de $A^3 + B^3$.\n"
definiciones_clave: '- **Suma de cubos perfectos**: Binomio de la forma $A^3 + B^3$ resultante de sumar dos cubos de monomios.

  - **Raíz cúbica de monomio**: Monomio $\sqrt[3]{C x^{3k}} = \sqrt[3]{C} x^k$ formado por la raíz cúbica del coeficiente
  y la tercera parte del exponente.

  - **Múltiplo de 3**: Condición matemática $e = 3k$ que asegura que la división del exponente entre 3 es un entero exacto.

  '
propiedades_relaciones: '- **Existencia en números reales**: A diferencia de la suma de cuadrados, la suma de cubos $A^3 +
  B^3$ **SIEMPRE ES FACTORIZABLE** en el cuerpo de los números reales $\mathbb{R}$.

  '
ejemplo_guiado:
  enunciado: Verifica si la expresión $64a^6 + 125b^3$ es una suma de cubos perfectos.
  pasos:
  - 'Paso 1: Verificamos el signo del binomio: Es una suma ($+$).'
  - 'Paso 2: Evaluamos la parte numérica: - $\sqrt[3]{64} = 4$ (exacto, $4^3 = 64$). - $\sqrt[3]{125} = 5$ (exacto, $5^3 =
    125$).'
  - 'Paso 3: Evaluamos los exponentes literales: - Para $a^6$: El exponente $6$ es divisible por $3$ ($6 \div 3 = 2 \implies
    a^2$). - Para $b^3$: El exponente $3$ es divisible por $3$ ($3 \div 3 = 1 \implies b^1$).'
  - 'Paso 4: Formamos las bases cúbicas $A$ y $B$: - $A = \sqrt[3]{64a^6} = \mathbf{4a^2}$. - $B = \sqrt[3]{125b^3} = \mathbf{5b}$.'
  - 'Conclusión: La expresión **sí es una suma de cubos perfectos**, equivalente a $(4a^2)^3 + (5b)^3$.'
  imagen: /static/img/nodos/reconocimiento-de-suma-de-cubos-perfectos-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la suma $x^3 + 27$ SÍ se puede factorizar sobre los números reales mientras que la suma $x^2 + 9$ no?
  choices:
  - text: Porque las sumas de potencias impares como los cubos admiten raíces reales reales de su base ($\sqrt[3]{-27} = -3$),
      permitiendo descomponer $A^3 + B^3$
    is_correct: true
  - text: Porque 27 es mayor que 9
    is_correct: false
  - text: Porque 27 no tiene raíz cuadrada
    is_correct: false
  - text: Ambas se factorizan igual
    is_correct: false
  explanation: La alternativa correcta es 'Porque las sumas de potencias impares como los cubos admiten raíces reales reales
    de su base ($\sqrt[3]{-27} = -3$), permitiendo descomponer $A^3 + B^3$'. Factorizabilidad de sumas de potencias impares.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuáles son las bases cúbicas $A$ y $B$ para la suma de cubos $27x^9 + 8y^3$?
  choices:
  - text: Las bases son $A = 3x^3$ y $B = 2y$, calculando $\sqrt[3]{27}=3, 9\div 3=3$ y $\sqrt[3]{8}=2, 3\div 3=1$
    is_correct: true
  - text: Las bases son $A = 9x^3$ y $B = 4y$
    is_correct: false
  - text: Las bases son $A = 3x^9$ y $B = 2y^3$
    is_correct: false
  - text: Las bases son $A = 27x$ y $B = 8y$
    is_correct: false
  explanation: La alternativa correcta es 'Las bases son $A = 3x^3$ y $B = 2y$, calculando $\sqrt[3]{27}=3, 9\div 3=3$ y $\sqrt[3]{8}=2,
    3\div 3=1$'. Raíz cúbica de coeficientes y división del exponente por 3.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que la expresión conste de exactamente 2 términos unidos por un signo de suma.'
- 'Paso 2: Calcular la raíz cúbica de los coeficientes numéricos de ambos términos.'
- 'Paso 3: Dividir por 3 los exponentes de todas las variables literales.'
- 'Paso 4: Identificar las dos bases cúbicas $A$ y $B$ de la estructura $A^3 + B^3$.'
errores_correccion: '- **Error 1:** Dividir el exponente de la variable por 2 en lugar de dividilo por 3 al extraer la raíz
  cúbica (escribir $\sqrt[3]{x^6} = x^3$). **Cómo corregirlo:** Para las raíces cúbicas **LOS EXPONENTES DE LAS VARIABLES
  SE DIVIDEN EXACTAMENTE POR 3 ($x^{6 \div 3} = x^2$)**.

  - **Error 2:** Declarar que una suma de cubos es un producto de cubos. **Cómo corregirlo:** Una suma de cubos **REPRESENTA
  UNA ADICIÓN DE DOS TÉRMINOS CÚBICOS Y FACTORIZA EN UN BINOMIO POR UN TRINOMIO**.

  '
ejemplos:
- titulo: Raíz cúbica de 8
  enunciado: Para $x^3 + 8$, ¿es la raíz del coeficiente 8 igual a 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2^3 = 8$.
- titulo: División de exponente 9
  enunciado: Para la variable $y^9$, ¿es su raíz cúbica $y^{9/3} = y^3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $9 \div 3 = 3$.
- titulo: Raíz de constante 1
  enunciado: En la suma $a^3 + 1$, ¿es la base constante $B = \sqrt[3]{1} = 1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $1^3 = 1$.
- titulo: Bases identificadas
  enunciado: Para $27x^3 + 64y^6$, ¿son las bases $A = 3x$ y $B = 4y^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(3x)^3 = 27x^3$ y $(4y^2)^3 = 64y^6$.
errores_frecuentes:
- Dividir el exponente de la variable por 2 en lugar de dividirlo por 3 al extraer la raíz cúbica.
- Extraer la raíz cuadrada en lugar de la raíz cúbica a los coeficientes numéricos.
- Declarar que la suma de cubos es un polinomio irreducible en el conjunto de los números reales.
- La verificación de que los exponentes literales sean divisibles por 3 no es ejecutada.
- Confundir la suma de cubos con el cubo de una suma $(A+B)^3$.
afirmaciones_verdaderas:
- Una suma de cubos perfectos consta de 2 términos sumados cuyos coeficientes y exponentes admiten raíz cúbica exacta.
- Para extraer la raíz cúbica de una variable, su exponente se divide exactamente por 3.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/reconocimiento-de-suma-de-cubos-perfectos-resumen.svg)


  QUÉ: Reconocer expresiones algebraicas que constituyen una suma de cubos identificando sus bases A y B.

  CÓMO: Verificar que existan 2 términos unidos por suma ($+$) con coeficientes de raíz cúbica exacta en $\mathbb{Q}^+$ y
  exponentes divisibles por 3 ($A = \sqrt[3]{C_1}x^\alpha, B = \sqrt[3]{C_2}y^\beta$).

  '
