procedimiento:
- 'Paso 1: Cuenta los términos. Deben ser dos.'
- 'Paso 2: Revisa el signo, debe ser positivo (+).'
- 'Paso 3: Verifica si los coeficientes numéricos pertenecen a la lista de cubos perfectos
  (1, 8, 27, 64, 125, 216.).'
- 'Paso 4: Verifica que los exponentes de las letras sean múltiplos de 3 (ej. $x^3,
  y^6, z^9$).'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en reconocimiento de suma de cubos perfectos.
ejemplos:
- titulo: Determina si $64m^6 + 1$ es una suma de cubos
  enunciado: Determina si $64m^6 + 1$ es una suma de cubos.
  solucion_pasos:
  - Tiene dos términos con signo más.
  - Raíz cúbica de 64 es 4. Raíz cúbica de $m^6$ es $m^2$.
  - Raíz cúbica de 1 es 1.
  - Cumple todos los requisitos. Es suma de cubos.
- titulo: Si el binomio es $1 + y^3$, cuenta como suma de cubos aunque el 1 esté primero
  enunciado: ¿Si el binomio es $1 + y^3$, cuenta como suma de cubos aunque el 1 esté
    primero?
  solucion_pasos:
  - El orden de los sumandos no altera la suma, y 1 es el cubo de 1.
  - 'Respuesta: Verdadero'
