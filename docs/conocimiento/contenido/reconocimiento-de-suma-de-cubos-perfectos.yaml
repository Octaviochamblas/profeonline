resumen_inicial: El reconocimiento de suma de cubos perfectos identifica binomios
  de la forma $a^3 + b^3$, donde ambos términos son cubos de bases algebraicas unidas
  por una adición.
explicacion_simple: Una suma de cubos es un binomio con signo más donde cada término
  se puede escribir como el cubo de una base. Por ejemplo, en $x^3 + 8$, el término
  $x^3$ es el cubo de $x$ y $8$ es el cubo de $2$, por lo que equivale a $x^3 + 2^3$.
explicacion_formal: 'Sea $P(x, y)$ un binomio en $\mathbb{R}[x, y]$. El **Reconocimiento
  de la Suma de Cubos Perfectos** verifica la existencia de bases $A, B$ tales que:


  $$P(x, y) = A^3 + B^3 \quad \text{con } A = \sqrt[3]{T_1} \text{ y } B = \sqrt[3]{T_2}$$


  **Desglose simbólico:**

  - $T_1 = A^3$: Primer término con exponente múltiplo de $3$ y coeficiente numérico
  cubo perfecto ($1, 8, 27, 64, 125, \dots$).

  - $+ $: Operador de adición central obligatorio entre ambos cubos.

  - $T_2 = B^3$: Segundo término con exponente múltiplo de $3$ y coeficiente numérico
  cubo perfecto.


  > **Complemento didáctico:** A diferencia de la suma de cuadrados (que no es factorizable
  en $\mathbb{R}$), la suma de cubos SIEMPRE admite factorización en los números reales.'
definiciones_clave: '- **Cubo perfecto**: Expresión numérica o algebraica obtenida
  al elevar una base entera o monomio al exponente $3$.

  - **Base del cubo**: La raíz cúbica exacta $\sqrt[3]{T}$ de cada término del binomio.'
propiedades_relaciones: '- **Factorizabilidad real**: $A^3 + B^3$ posee una raíz real
  en $A = -B$, garantizando la existencia de un factor lineal en $\mathbb{R}$.'
ejemplo_guiado:
  enunciado: Determine si la expresión $27x^3 + 64$ es una suma de cubos perfectos
    e identifique las bases $A$ y $B$.
  pasos:
  - 'Paso 1: Verificar la presencia de 2 términos unidos por una adición: $27x^3$
    y $64$ con signo $+$.'
  - 'Paso 2: Obtener la raíz cúbica del primer término $27x^3$: $\sqrt[3]{27x^3} =
    3x \implies A = 3x$.'
  - 'Paso 3: Obtener la raíz cúbica del segundo término $64$: $\sqrt[3]{64} = 4 \implies
    B = 4$.'
  - 'Paso 4: Comprobar que $(3x)^3 + (4)^3 = 27x^3 + 64$.'
  - 'Conclusión: La expresión representa una suma de cubos perfectos de bases $A =
    3x$ y $B = 4$.'
checkpoints:
