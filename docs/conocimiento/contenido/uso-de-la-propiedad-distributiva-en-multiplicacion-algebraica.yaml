semantic_id: MAT.ALG.LEYES_MULTIPLICACION.PROPIEDAD_DISTRIBUTIVA
resumen_inicial: 'El uso de la propiedad distributiva en la multiplicación algebraica establece que el producto de un factor por una suma o resta es igual a la suma o resta de los productos del factor por cada uno de los términos.'
explicacion_simple: |
  La **Propiedad Distributiva** es la llave fundamental para multiplicar monomios por polinomios y polinomios por polinomios:
  - **REGLA**: **El factor de afuera MULTIPLICA A CADA UNO de los términos de adentro del paréntesis**.
  - **Fórmula con suma**: $A \cdot (B + C) = \mathbf{A \cdot B + A \cdot C}$.
  - **Fórmula con resta**: $A \cdot (B - C) = \mathbf{A \cdot B - A \cdot C}$.
  - **Ejemplo**: Multiplicar $3x \cdot (2x^2 - 5x + 4)$:
    - Término 1: $3x \cdot 2x^2 = \mathbf{6x^3}$.
    - Término 2: $3x \cdot (-5x) = \mathbf{-15x^2}$.
    - Término 3: $3x \cdot 4 = \mathbf{+12x}$.
    - Resultado expandido: **$6x^3 - 15x^2 + 12x$**.
explicacion_formal: |
  ### Definición formal
  En el anillo de polinomios $\mathbb{R}[x_1, \dots, x_n]$, la multiplicación distribuye bilateralmente sobre la adición. Para todo trío de elementos $P, Q, R$:

  $$\text{Distributividad a izquierda: } P \cdot (Q + R) = P \cdot Q + P \cdot R$$
  $$\text{Distributividad a derecha: } (Q + R) \cdot P = Q \cdot P + R \cdot P$$

  ### Generalización a Polinomios Arbitrarios
  Sean $A(x) = \sum_{i=1}^m a_i x^i$ y $B(x) = \sum_{j=1}^n b_j x^j$ dos polinomios. La aplicación reiterada del axioma distributivo expande el producto cartesiano de los sumandos:

  $$A(x) \cdot B(x) = \sum_{i=1}^m \sum_{j=1}^n (a_i x^i) \cdot (b_j x^j)$$

  ### Síntesis didáctica
  La propiedad distributiva transforma un producto de expresiones agrupadas en una suma extendida de monomios reducibles.
definiciones_clave: |
  - **Propiedad distributiva de la multiplicación**: Axioma $A(B+C) = AB + AC$ que vincula el producto con la estructura aditiva.
  - **Expansión polinómica**: Eliminación de los paréntesis mediante la aplicación del producto término a término.
  - **Producto cartesiano de sumandos**: Multiplicación de todos los monomios del primer factor por todos los monomios del segundo factor.
propiedades_relaciones: |
  - **Respeto de signatura antecedente**: Si el factor multiplicador es negativo ($-A$), invierte los signos de todos los sumandos al distribuir.
  - **Inversa de la factorización**: La distributividad es el proceso inverso al factor común ($AB + AC = A(B+C)$).
ejemplo_guiado:
  enunciado: 'Aplica la propiedad distributiva para multiplicar el monomio $-4x^2$ por el trinomio $(3x^2 - 2x + 5)$.'
  pasos:
    - 'Paso 1: Planteamos la distribución término a término:
       $(-4x^2) \cdot (3x^2) + (-4x^2) \cdot (-2x) + (-4x^2) \cdot (5)$.'
    - 'Paso 2: Multiplicamos el primer término:
       $(-4x^2) \cdot (3x^2) = -12x^{2+2} = \mathbf{-12x^4}$.'
    - 'Paso 3: Multiplicamos el segundo término:
       $(-4x^2) \cdot (-2x) = +8x^{2+1} = \mathbf{+8x^3}$.'
    - 'Paso 4: Multiplicamos el tercer término:
       $(-4x^2) \cdot (5) = \mathbf{-20x^2}$.'
    - 'Paso 5: Consolidamos el polinomio expandido: $-12x^4 + 8x^3 - 20x^2$.'
    - 'Conclusión: El producto expandido es **$-12x^4 + 8x^3 - 20x^2$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué establece la propiedad distributiva de la multiplicación respecto a la suma en $A \cdot (B + C)$?'
    choices:
      - {text: 'Establece que el factor $A$ debe multiplicarse por cada uno de los sumandos internos ($A \cdot B + A \cdot C$)', is_correct: true}
      - {text: 'Establece que se debe sumar $A + B + C$', is_correct: false}
      - {text: 'Establece que el factor $A$ sólo multiplica a $B$ dejando a $C$ intacto', is_correct: false}
      - {text: 'Establece que los paréntesis no se pueden eliminar', is_correct: false}
    explanation: 'La alternativa correcta es ''Establece que el factor $A$ debe multiplicarse por cada uno de los sumandos internos ($A \cdot B + A \cdot C$)''. Axioma de distributividad.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de distribuir $2a \cdot (3a - 4)$?'
    choices:
      - {text: 'El resultado es $6a^2 - 8a$, multiplicando $2a \cdot 3a = 6a^2$ y $2a \cdot (-4) = -8a$', is_correct: true}
      - {text: 'El resultado es $6a^2 - 4$', is_correct: false}
      - {text: 'El resultado es $5a^2 - 8a$', is_correct: false}
      - {text: 'El resultado es $6a - 8$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $6a^2 - 8a$, multiplicando $2a \cdot 3a = 6a^2$ y $2a \cdot (-4) = -8a$''. Distributividad término a término.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el factor exterior y la cantidad de términos contenidos dentro del paréntesis.'
  - 'Paso 2: Multiplicar el factor exterior por el primer término del paréntesis aplicando ley de signos, coeficientes y potencias.'
  - 'Paso 3: Repetir el producto del factor exterior por el segundo término y subsecuentes respetando sus signos.'
  - 'Paso 4: Escribir el polinomio expandido y reducir términos semejantes si existieran.'
errores_correccion: |
  - **Error 1:** Multiplicar el factor exterior únicamente por el primer término dentro del paréntesis (escribir $2(x + 3) = 2x + 3$). **Cómo corregirlo:** La distributividad exige **MULTIPLICAR A TODOS LOS TÉRMINOS ($2 \cdot x + 2 \cdot 3 = 2x + 6$)**.
  - **Error 2:** Excluir la aplicación del signo del factor exterior al segundo término al distribuir un negativo (escribir $-3(x - 2) = -3x - 6$). **Cómo corregirlo:** Un factor negativo **INVIERTE LOS SIGNOS DE CADA TÉRMINO ($-3x + 6$)**.
ejemplos:
  - titulo: 'Distribución simple'
    enunciado: '¿Cuál es el desarrollo de $5(x + 2)$?'
    alternativas:
      - '$5x + 10$'
      - '$5x + 2$'
      - '$10x$'
    respuesta: '$5x + 10$'
    solucion_pasos:
      - '1. $5 \cdot x = 5x$.'
      - '2. $5 \cdot 2 = 10$.'
      - '3. Resultado: $5x + 10$.'
  - titulo: 'Distribución de negativo'
    enunciado: '¿Cuál es el desarrollo de $-2a(a - 4)$?'
    alternativas:
      - '$-2a^2 + 8a$'
      - '$-2a^2 - 8a$'
      - '$-2a^2 - 4$'
    respuesta: '$-2a^2 + 8a$'
    solucion_pasos:
      - '1. $(-2a) \cdot a = -2a^2$.'
      - '2. $(-2a) \cdot (-4) = +8a$.'
      - '3. Resultado: $-2a^2 + 8a$.'
  - titulo: 'Inversa del factor común'
    enunciado: '¿Es la expansión por propiedad distributiva la operación inversa al proceso de factor común?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, expandir elimina paréntesis y factorizar los crea.'
  - titulo: 'Distribución en trinomio'
    enunciado: 'Para $x(x^2 + x + 1)$, ¿es el producto igual a $x^3 + x^2 + x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, multiplicando $x$ por cada uno de los 3 términos.'
errores_frecuentes:
  - 'Multiplicar el factor exterior únicamente por el primer término dejando los demás términos sin multiplicar.'
  - 'La distribución del signo negativo del factor exterior a los términos posteriores no se aplica.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Sumar el factor exterior con los términos del paréntesis en lugar de multiplicarlo.'
  - 'Alterar los exponentes de las variables al distribuir coeficientes numéricos.'
afirmaciones_verdaderas:
  - 'La propiedad distributiva exige multiplicar el factor exterior por cada uno de los términos de la suma o resta interna.'
  - 'Distribuir un factor negativo invierte la signatura de todos los términos liberados del paréntesis.'
al_terminar_debes_poder: 'Aplicar la propiedad distributiva de la multiplicación sobre la adición y sustracción para expandir expresiones algebraicas.'
