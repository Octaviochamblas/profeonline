resumen_inicial: La uso de la propiedad distributiva en multiplicación algebraica
  aplica rigurosamente las leyes distributivas, de signos y de potencias en expresiones
  algebraicas.
explicacion_simple: Al trabajar con uso de la propiedad distributiva en multiplicación
  algebraica, multiplicamos los coeficientes numéricos, aplicamos la regla de signos
  y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Uso de la propiedad distributiva
  en multiplicación algebraica** viene dada por:


  $$\text{"el desarrollo a(b + c) = ab + ac"} \implies ab + ac$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Uso de la propiedad distributiva en multiplicación algebraica**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule uso de la propiedad distributiva en multiplicación algebraica
    para: ''el desarrollo a(b + c) = ab + ac''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es ab + ac.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar uso de la propiedad distributiva en multiplicación
    algebraica a 'el desarrollo a(b + c) = ab + ac'?
  choices:
  - text: ab + ac
    is_correct: true
  - text: a + bc
    is_correct: false
  - text: abc
    is_correct: false
  - text: a^2 + bc
    is_correct: false
  explanation: La alternativa correcta es 'ab + ac'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el desarrollo a(b + c) = ab + ac', ¿qué expresión
    resultante se obtuvo?
  choices:
  - text: ab + ac
    is_correct: true
  - text: a + bc
    is_correct: false
  - text: abc
    is_correct: false
  - text: a^2 + bc
    is_correct: false
  explanation: La alternativa correcta es 'ab + ac'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante uso de la propiedad distributiva en multiplicación algebraica.** **Cómo
  corregirlo:** Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de uso de la propiedad distributiva en multiplicación
    algebraica en 'el desarrollo a(b + c) = ab + ac'?
  alternativas:
  - ab + ac
  - a + bc
  - abc
  - a^2 + bc
  respuesta: ab + ac
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener ab + ac.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el desarrollo a(b + c) = ab + ac' por uso de la propiedad
    distributiva en multiplicación algebraica, ¿qué expresión resulta?
  alternativas:
  - ab + ac
  - a + bc
  - abc
  - a^2 + bc
  respuesta: ab + ac
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir ab + ac.
- titulo: ¿Es la multiplicación en 'el desarrollo a(b + c) = ab + ac' equivalente
    a ab + ac?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene ab + ac.
- titulo: ¿Da el producto de 'el desarrollo a(b + c) = ab + ac' un resultado igual
    a a + bc?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es ab + ac.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar uso de la propiedad
  distributiva en multiplicación algebraica.
- Omitir distribuir el monomio o término sobre todos los sumandos en uso de la propiedad
  distributiva en multiplicación algebraica.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La uso de la propiedad distributiva en multiplicación algebraica requiere sumar
  los exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la uso de la propiedad
  distributiva en multiplicación algebraica aplicando distributividad, ley de signos
  y suma de exponentes.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Multiplicación.
