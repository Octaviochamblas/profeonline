semantic_id: MAT.ALG.LEYES_MULTIPLICACION.PROPIEDAD_DISTRIBUTIVA
resumen_inicial: 'Uso de la propiedad distributiva en multiplicación algebraica: leyes,
  procedimiento y aplicación en Leyes fundamentales de la multiplicación algebraica.'
explicacion_simple: Multiplicar un factor por una suma exige considerar todos los
  términos que están dentro del paréntesis. La propiedad distributiva formaliza esa
  relación y permite desarrollarla.
explicacion_formal: '### Definición formal


  Dado un polinomio de $m$ términos $P = a_1 + a_2 + \dots + a_m$ y otro de $n$ términos
  $Q = b_1 + b_2 + \dots + b_n$, su producto se obtiene aplicando la propiedad distributiva
  a cada par de términos - $P \cdot Q = \sum_{i=1}^{m} \sum_{j=1}^{n} a_i b_j$, lo
  que genera exactamente $m \times n$ productos parciales antes de reducir términos
  semejantes.


  ### Desarrollo didáctico


  En polinomios ordenados, los últimos términos suelen ser los independientes. Omitir
  su producto pierde esa constante pura.


  Polinomio de 3 por polinomio de 4. $3 \times 4 = 12$ términos resultantes.


  $x \cdot y = xy$, $x \cdot -2 = -2x$, $1 \cdot y = y$, $1 \cdot -2 = -2$.'
definiciones_clave: '- **Uso de la propiedad distributiva en multiplicación algebraica**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a uso de la propiedad distributiva en multiplicación
  algebraica.'
ejemplo_guiado:
