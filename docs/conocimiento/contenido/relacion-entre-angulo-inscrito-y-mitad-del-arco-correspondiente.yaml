semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_INSCRITO_MITAD_ARCO
resumen_inicial: 'La medida de un ángulo inscrito es exactamente igual a la mitad de la medida angular del arco que subtiende y la mitad de su ángulo central correspondiente: β = α / 2 = med(AB) / 2.'
explicacion_simple: 'Este es el teorema rey de toda la geometría de la circunferencia:

  **Cualquier ángulo inscrito mide exactamente la MITAD del arco que subtiende (y la MITAD del ángulo del centro que mira al mismo arco)**.


  Piénsalo así: si te paras en el centro $O$ del estadio circular y miras hacia la portería ($A$ y $B$), tienes que abrir mucho la mirada (por ejemplo, $80^\circ$). Pero si te vas a sentar a la grada del fondo en la orilla ($V$) para mirar la misma portería, como estás el doble de lejos, ¡tu campo visual se reduce a la mitad!: **$80^\circ / 2 = 40^\circ$**.


  La fórmula de oro es: **$\beta = \frac{\alpha}{2} = \frac{\overset{\frown}{AB}}{2}$**, o al revés, **el ángulo del centro y el arco miden el DOBLE del ángulo inscrito**: **$\alpha = 2\beta$**.


  ![Teorema del ángulo inscrito](/static/img/nodos/relacion-entre-angulo-inscrito-y-mitad-del-arco-correspondiente-intro.svg)

  '
explicacion_formal: '### Teorema fundamental del ángulo inscrito

  Sea $\mathcal{C}(O, r)$ una circunferencia y sea $\angle AVB$ un ángulo inscrito que subtiende el arco $\overset{\frown}{AB}$. Sea $\angle AOB = \alpha$ el ángulo del centro correspondiente. Entonces:

  $$\angle AVB = \frac{\angle AOB}{2} = \frac{\text{med}(\overset{\frown}{AB})}{2} \iff \alpha = 2 \angle AVB$$


  ### Demostración geométrica (Caso canónico con diámetro)

  1. Supóngase primero que uno de los lados (ej. $\overline{VB}$) pasa por el centro $O$ (es un diámetro).

  2. Trácese el radio $\overline{OA}$. El triángulo $\triangle OVA$ es isósceles porque $OV = OA = r$.

  3. En consecuencia, sus ángulos basales son congruentes: $\angle OVA = \angle OAV = \beta$.

  4. Por el teorema del ángulo exterior en $\triangle OVA$, el ángulo central $\angle AOB$ es el ángulo exterior adyacente a $O$:

  $$\angle AOB = \angle OVA + \angle OAV = \beta + \beta = 2\beta \implies \beta = \frac{\angle AOB}{2}$$

  5. Los casos generales (donde el centro $O$ queda dentro o fuera de $\angle AVB$) se demuestran trazando el diámetro por $V$ y sumando o restando dos ángulos del caso canónico.


  > **Complemento didáctico:** ¡La regla del 2! ''Si voy de la orilla al centro, **multiplico por 2** ($2\times$). Si voy del centro a la orilla, **divido entre 2** ($/2$)''. Esta regla mnemotécnica te salvará en decenas de ejercicios de la PAES.

  '
definiciones_clave: '- **Teorema del ángulo inscrito**: Relación que fija la medida del ángulo inscrito como $\beta = \alpha / 2$.

  - **Triángulo isósceles radial ($\triangle OVA$)**: Base de la demostración mediante radios congruentes $r$.

  - **Ángulo central subtendido ($\alpha$)**: Ángulo con vértice en $O$ que abarca los mismos extremos $A$ y $B$.

  '
propiedades_relaciones: '- **Duplicación del arco**: $\text{med}(\overset{\frown}{AB}) = 2\beta$.

  - **Invarianza posicional**: La medida de $\beta$ no depende de la posición exacta de $V$ sobre el arco mayor.

  - **Ángulo obtuso**: Si el ángulo inscrito subtiende un arco mayor a $180^\circ$, su medida es obtusa ($> 90^\circ$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulo inscrito mitad de arco](/static/img/nodos/relacion-entre-angulo-inscrito-y-mitad-del-arco-correspondiente-ejemplos.svg)


    En una circunferencia, un arco $\overset{\frown}{AB}$ mide $84^\circ$. Un ángulo inscrito $\angle AVB$ subtiende dicho arco. Calcula la medida de $\angle AVB$ y la de su ángulo del centro correspondiente. Además, si otro ángulo inscrito mide $36^\circ$, calcula cuánto mide su arco subtendido.'
  pasos:
  - 'Paso 1: Identificar la medida del arco: $\overset{\frown}{AB} = 84^\circ$.'
  - 'Paso 2: Calcular el ángulo inscrito dividiendo entre 2: $\angle AVB = \frac{84^\circ}{2} = 42^\circ$.'
  - 'Paso 3: Calcular el ángulo del centro: Es igual a la medida del arco: $\angle AOB = 84^\circ$ (el doble del inscrito: $2 \cdot 42^\circ = 84^\circ$).'
  - 'Paso 4: Para el segundo caso con inscrito de $36^\circ$, duplicar para hallar el arco: $\text{Arco} = 2(36^\circ) = 72^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si el ángulo del centro mide 100°, ¿cuánto mide un ángulo inscrito que subtiende el mismo arco?
  choices:
  - text: 50°.
    is_correct: true
  - text: 100°.
    is_correct: false
  - text: 200°.
    is_correct: false
  - text: 25°.
    is_correct: false
  explanation: 'La alternativa correcta es ''50°.'' El ángulo inscrito es exactamente la mitad del ángulo central: $100^\circ / 2 = 50^\circ$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo inscrito mide 28°, ¿cuál es la medida angular del arco que subtiende?
  choices:
  - text: 56°.
    is_correct: true
  - text: 14°.
    is_correct: false
  - text: 28°.
    is_correct: false
  - text: 112°.
    is_correct: false
  explanation: 'La alternativa correcta es ''56°.'' El arco mide el doble del ángulo inscrito que lo subtiende: $2 \cdot 28^\circ = 56^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar si se conoce el arco (o ángulo central) o el ángulo inscrito.

  2. Si se conoce el arco/central $\alpha$, dividir entre 2 para hallar el inscrito: $\beta = \alpha / 2$.

  3. Si se conoce el inscrito $\beta$, multiplicar por 2 para hallar el arco/central: $\alpha = 2\beta$.

  4. Verificar que ambos compartan exactamente los mismos extremos $A$ y $B$.

  '
errores_correccion: '- **Error común 1:** Igualar el ángulo inscrito al ángulo del centro. **Corrección:** El inscrito siempre es la mitad del central cuando subtienden el mismo arco.

  - **Error común 2:** Dividir por 2 dos veces consecutivas. **Corrección:** La relación es una sola división entre 2: $\beta = \alpha / 2$.

  '
ejemplos:
- tipo: A
  titulo: Inscrito con arco de 70 grados
  enunciado: Un arco mide $70^\circ$. ¿Cuánto mide el ángulo inscrito que lo subtiende?
  alternativas:
  - text: $35^\circ$.
    is_correct: true
  - text: $70^\circ$.
    is_correct: false
  - text: $140^\circ$.
    is_correct: false
  - text: $17,5^\circ$.
    is_correct: false
  explicacion: 'El inscrito es la mitad: $70^\circ / 2 = 35^\circ$.'
- tipo: B
  titulo: Doble de medida
  enunciado: ¿Mide el ángulo del centro el doble que cualquier ángulo inscrito que subtienda su mismo arco?
  respuesta: Sí
  explicacion: Sí. Por el Teorema del Ángulo Inscrito, $\alpha = 2\beta$ de forma invariable.
errores_frecuentes:
- '''Olvidar dividir entre dos al calcular el ángulo inscrito a partir del central.'''
- '''Dividir entre dos en lugar de multiplicar por dos al buscar el arco a partir del inscrito.'''
- '''Asumir que el ángulo inscrito cambia si el vértice se desplaza a lo largo del mismo arco mayor.'''
afirmaciones_verdaderas:
- '''El ángulo inscrito mide la mitad de la medida angular del arco que subtiende ($\beta = \frac{\overset{\frown}{AB}}{2}$).'''
- '''El ángulo del centro mide exactamente el doble que un ángulo inscrito subtendido por el mismo arco ($\alpha = 2\beta$).'''
- '''Todo ángulo inscrito que subtiende un arco de $180^\circ$ mide $90^\circ$.'''
al_terminar_debes_poder: '**QUÉ:** Calcular medidas de ángulos inscritos, ángulos centrales y arcos correspondientes.


  **CÓMO:** Aplicando $\beta = \frac{\alpha}{2} = \frac{\overset{\frown}{AB}}{2}$ y $\alpha = 2\beta$.


