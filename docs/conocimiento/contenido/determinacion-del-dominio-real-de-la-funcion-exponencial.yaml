semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.DOMINIO
resumen_inicial: La determinación del dominio establece que la función exponencial acepta cualquier número real como exponente ($\text{Dom}(f) = \mathbb{R}$).
explicacion_simple: |
  Una de las grandes ventajas de la **función exponencial $f(x) = b^x$** es que **NO TIENE NINGUNA RESTRICCIÓN en su entrada $x$**:

  - Puedes evaluar exponentes **positivos** ($2^3 = 8$).
  - Puedes evaluar exponentes **cero** ($2^0 = 1$).
  - Puedes evaluar exponentes **negativos** ($2^{-2} = 1/4$).
  - Puedes evaluar exponentes **decimales o fraccionarios** ($2^{1/2} = \sqrt{2}$).

  Por lo tanto, el **dominio de la función exponencial son TODOS LOS NÚMEROS REALES ($\mathbb{R}$)**:
  $$\text{Dom}(f) = ]-\infty, +\infty[ = \mathbb{R}$$
explicacion_formal: |
  Dada la función exponencial estándar $f(x) = a \cdot b^x$ con $a \neq 0$ y $b \in \mathbb{R}^+ \setminus \{1\}$, la definición del **dominio maximal real** $\text{Dom}(f)$ establece:

  $$\text{Dom}(f) = \{x \in \mathbb{R} \mid b^x \in \mathbb{R}\} = \mathbb{R} = ]-\infty, +\infty[$$

  **Demostración de aplicabilidad universal de exponentes:**
  1. **Exponentes Enteros ($\mathbb{Z}$):** Para $n \in \mathbb{Z}^+$, $b^n = \underbrace{b \cdot b \cdots b}_{n \text{ veces}}$. Para $-n$, $b^{-n} = \frac{1}{b^n}$. Para $n = 0$, $b^0 = 1$.
  2. **Exponentes Racionales ($\mathbb{Q}$):** Para $p/q \in \mathbb{Q}$, $b^{p/q} = \sqrt[q]{b^p}$, bien definida en $\mathbb{R}$ pues $b > 0$.
  3. **Exponentes Irracionales ($\mathbb{R} \setminus \mathbb{Q}$):** Definida por el límite de sucesiones de aproximaciones racionales $\lim_{r_n \to x} b^{r_n}$.
definiciones_clave: |
  - **Dominio exponencial ($\text{Dom}(f)$)**: Conjunto de todos los números reales $\mathbb{R}$ que pueden ser ingresados en la posición del exponente de la función.
propiedades_relaciones: |
  - **Continuitad en todo $\mathbb{R}$**: La función exponencial no posee saltos, asíntotas verticales ni puntos de discontinuidad en ningún punto de su dominio real $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Determina el dominio de las funciones exponenciales $f(x) = 10^x$ y $g(x) = -4 \cdot (0.2)^x$ e indica si es posible evaluar $x = -\sqrt{5}$.'
  pasos:
    - 'Paso 1: Identificar la estructura de $f(x) = 10^x$: es una exponencial básica con $b = 10$. Su dominio es $\text{Dom}(f) = \mathbb{R}$.'
    - 'Paso 2: Identificar la estructura de $g(x)$: exponencial general con $a = -4, b = 0.2$. Su dominio es $\text{Dom}(g) = \mathbb{R}$.'
    - 'Paso 3: Evaluar la posibilidad para $x = -\sqrt{5}$: como $-\sqrt{5}$ es un número real irracional, sí pertenece al dominio.'
    - 'Paso 4: Concluir que ambas funciones están definidas para todo $x \in \mathbb{R}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el conjunto dominio de la función exponencial $f(x) = 7^x$ en el sistema de los números reales?'
    choices:
      - {text: 'Todos los números reales ($\mathbb{R}$)', is_correct: true}
      - {text: 'Únicamente los reales positivos ($\mathbb{R}^+$).', is_correct: false}
      - {text: 'Todos los enteros positivos ($\mathbb{Z}^+$).', is_correct: false}
      - {text: 'El intervalo acotado $]0, 7[$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Todos los números reales ($\mathbb{R}$)''. El exponente $x$ no posee restricciones en la función exponencial.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Existe algún valor real de $x$ para el cual la función $g(x) = 3 \cdot (0.5)^x$ NO esté definida?'
    choices:
      - {text: 'No, la función está definida sin ninguna restricción para todo $x \in \mathbb{R}$', is_correct: true}
      - {text: 'Sí, para valores de $x$ negativos.', is_correct: false}
      - {text: 'Sí, para $x = 0$.', is_correct: false}
      - {text: 'Sí, para valores irracionales.', is_correct: false}
    explanation: 'La alternativa correcta es ''No, la función está definida sin ninguna restricción para todo $x \in \mathbb{R}$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Verificar que la función cumpla la estructura exponencial $f(x) = a \cdot b^x$.'
  - 'Paso 2: Constatar que la base $b$ satisfaga $b > 0$ y $b \neq 1$.'
  - 'Paso 3: Declarar que no existen divisiones por cero ni raíces de índice par de números negativos en el exponente puro.'
  - 'Paso 4: Concluir que el dominio de la función es $\text{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$.'
errores_correccion: |
  - **Error común:** Confundir el dominio de la función exponencial (que son los números que entran en $x$, todos los reales $\mathbb{R}$) con su recorrido (que son las respuestas $y$, solo reales positivos).
  - **Cómo corregirlo:** Recuerda: **DOMINIO = TODO $\mathbb{R}$** (puedes elevar a cualquier número); **RECORRIDO = SOLO POSITIVOS** ($y > 0$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Dominio con exponente negativo.
    alternativas:
      - 'Dom(f) = \mathbb{R}, f(-2) = 1/25'
      - 'Dom(f) = \mathbb{R}^+, no se puede evaluar -2'
      - 'Dom(f) = ]0, +\infty['
    respuesta: 'Dom(f) = \mathbb{R}, f(-2) = 1/25'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Dominio con exponente decimal.
    alternativas:
      - 'Dom(f) = \mathbb{R}, f(0.5) = \sqrt{16} = 4'
      - 'Dom(f) = \mathbb{Z}'
      - 'Dom(f) = ]1, +\infty['
    respuesta: 'Dom(f) = \mathbb{R}, f(0.5) = \sqrt{16} = 4'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 6^x$, la afirmación de que su dominio se restringe únicamente a números reales positivos $x > 0$.'
  - 'La confusión entre el conjunto dominio $\text{Dom}(f) = \mathbb{R}$ y el conjunto recorrido $\text{Rec}(f) = \mathbb{R}^+$.'
  - 'La afirmación de que los exponentes negativos $x < 0$ producen indefinición en la función exponencial.'
  - 'La afirmación de que en $x = 0$ la función exponencial sufre una discontinuidad o indeterminación.'
  - 'La afirmación errónea de que el dominio depende del valor del parámetro de escala $a$.'
afirmaciones_verdaderas:
  - 'El dominio de la función exponencial básica $f(x) = b^x$ es el conjunto de todos los números reales $\mathbb{R}$.'
  - 'La función exponencial $f(x) = b^x$ es continua en todo su dominio $\mathbb{R}$ sin presentar discontinuidades ni asíntotas verticales.'
al_terminar_debes_poder: |
  QUÉ: Determinar y justificar el dominio real de la función exponencial $f(x) = a \cdot b^x$.
  CÓMO: Verificar la estructura $b^x$, comprobar la validez de elevar $b$ a cualquier exponente real y declarar $\text{Dom}(f) = \mathbb{R}$.
