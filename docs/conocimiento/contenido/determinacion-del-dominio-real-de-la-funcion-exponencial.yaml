semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.DOMINIO
resumen_inicial: La determinación del dominio de la función exponencial elemental $f(x) = a \cdot b^x$ establece que $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$, ya que una base positiva $b > 0$ puede elevarse a cualquier exponente real sin restricciones algebraicas.
explicacion_simple: "![La determinación del dominio de la función exponencial elemental $f(x) = a \\cdot b^x$ establece que $\\operatorname{Dom}(f) = \\mathbb{R} = ]-\\infty, +\\infty[$, ya que una base positiva $b > 0$ puede elevarse a cualquier exponente real sin restricciones algebraicas](/static/img/nodos/determinacion-del-dominio-real-de-la-funcion-exponencial-intro.svg)\n\n\nEl **dominio** de una función son todos los valores de $x$ que tienes permiso para poner dentro de la fórmula:\n\n- **En la función exponencial básica, ¡NO HAY NINGUNA PROHIBICIÓN!**\n  - Puedes poner números positivos ($2^3 = 8$).\n  - Puedes poner cero ($2^0 = 1$).\n  - Puedes poner números negativos ($2^{-3} = \\frac{1}{2^3} = \\frac{1}{8} = 0,125$).\n  - Puedes poner fracciones o decimales ($2^{1/2} = \\sqrt{2} \\approx 1,414$).\n- Por eso, el dominio de $f(x) = b^x$ es **TODO EL CONJUNTO DE LOS NÚMEROS REALES $\\mathbb{R}$** ($]-\\infty, +\\infty[$)."
explicacion_formal: 'Sea $b \in \mathbb{R}^+ \setminus \{1\}$. Por la construcción analítica de la exponenciación real mediante sucesiones de Cauchy o la función exponencial de base natural $b^x = \exp(x \ln(b))$, la aplicación está definida holomórficamente en todo el cuerpo real:

  $$\operatorname{Dom}(f) = \{x \in \mathbb{R} \mid b^x \in \mathbb{R}\} = \mathbb{R}$$


  **Análisis de clases de exponentes**:

  1. **Exponentes enteros negativos ($x = -n, n \in \mathbb{N}$)**: $b^{-n} = \frac{1}{b^n}$. Dado que $b > 0 \implies b^n > 0 \neq 0$, el denominador nunca se anula.

  2. **Exponentes racionales ($x = p/q, q \in \mathbb{N}^+$)**: $b^{p/q} = \sqrt[q]{b^p}$. Como $b^p > 0$, la raíz $q$-ésima existe unívocamente en $\mathbb{R}^+$ tanto para índices pares como impares.

  3. **Exponentes irracionales ($x = \alpha \in \mathbb{R} \setminus \mathbb{Q}$)**: $b^\alpha = \lim_{n \to \infty} b^{q_n}$ donde $\{q_n\} \to \alpha$, convergente por completitud de $\mathbb{R}$.'
definiciones_clave: '- **Dominio real**: Conjunto de todos los números reales para los cuales la función produce una salida real bien definida.

  - **Exponenciación real continua**: Extensión continua de la potenciación sobre el cuerpo de los números reales $\mathbb{R}$.'
propiedades_relaciones: '- **Continuidad uniforme en compactos**: La función es continua y diferenciable de clase $\mathcal{C}^\infty$ en todo $\mathbb{R}$.

  - **Sin asíntotas verticales**: A diferencia de las funciones racionales o logarítmicas, la función exponencial nunca se indetermina ni posee asíntotas verticales.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del dominio de la función exponencial elemental $f(x) = a \cdot b^x$ establece que $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$, ya que una base positiva $b > 0$ puede elevarse a cualquier exponente real sin restricciones algebraicas](/static/img/nodos/determinacion-del-dominio-real-de-la-funcion-exponencial-ejemplos.svg)



    Determina el dominio de las funciones exponenciales $f(x) = 5^x$ y $g(x) = -3 \cdot \left(\frac{1}{2}\right)^{x-4}$, justificando la ausencia de restricciones.'
  pasos:
  - 'Paso 1: Para $f(x) = 5^x$:

    - La base es $5 > 0$. Como no hay divisiones por cero ni raíces de índice par sobre variables en denominadores, $x$ puede tomar cualquier valor real.

    - $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$.'
  - 'Paso 2: Para $g(x) = -3 \cdot \left(\frac{1}{2}\right)^{x-4}$:

    - El exponente es un polinomio lineal $(x - 4)$, definido en todo $\mathbb{R}$.

    - La base $1/2 > 0$ es válida para cualquier potencia real.

    - $\operatorname{Dom}(g) = \mathbb{R} = ]-\infty, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función exponencial $f(x) = 7 \cdot 2^x$?
  choices:
  - text: ℝ (todos los números reales)
    is_correct: true
  - text: ℝ⁺ (solo los reales positivos)
    is_correct: false
  - text: '[0, +∞['
    is_correct: false
  - text: ℝ \ {0}
    is_correct: false
  explanation: La alternativa correcta es 'ℝ (todos los números reales)'. La variable en el exponente puede tomar cualquier valor real positivo, negativo o cero.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre al evaluar $f(x) = 3^x$ en el exponente negativo $x = -2$?
  choices:
  - text: 'Da un resultado real positivo válido: 3⁻² = 1/3² = 1/9'
    is_correct: true
  - text: Se indetermina porque el exponente es negativo
    is_correct: false
  - text: 'Da un número negativo: -9'
    is_correct: false
  - text: Da cero
    is_correct: false
  explanation: 'La alternativa correcta es ''Da un resultado real positivo válido: 3⁻² = 1/3² = 1/9''. Los exponentes negativos invierten la base pero producen números reales positivos bien definidos.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión que conforma el exponente de la función.'
- 'Paso 2: Verificar si el exponente contiene restricciones (denominadores con $x$ o raíces).'
- 'Paso 3: En funciones exponenciales básicas o polinómicas en el exponente, concluir $\operatorname{Dom}(f) = \mathbb{R}$.'
- 'Paso 4: Escribir el dominio en notación de intervalo $]-\infty, +\infty[$ o con el símbolo de conjunto $\mathbb{R}$.'
errores_correccion: '- **Error común:** Confundir el dominio con el recorrido, diciendo que el dominio es solo $\mathbb{R}^+$ (positivos).

  - **Cómo corregirlo:** En la $x$ (dominio) **puedes poner cualquier número real de $-\infty$ a $+\infty$**; es la salida $y$ (recorrido) la que es positiva.'
ejemplos:
- titulo: 'Ejemplo 1: Dominio de función elemental'
  enunciado: En $f(x) = 10^x$, ¿cuál es el dominio?
  alternativas:
  - R (todos los reales)
  - ']0, +inf['
  - '[0, +inf['
  - R \ {0}
  respuesta: R (todos los reales)
  solucion_pasos:
  - 'Paso 1: $\operatorname{Dom}(f) = \mathbb{R}$.'
- titulo: 'Ejemplo 2: Dominio con exponente trasladado'
  enunciado: ¿Cuál es el dominio de $g(x) = 4^{x+5}$?
  alternativas:
  - R
  - '[-5, +inf['
  - ']-5, +inf['
  - R \ {-5}
  respuesta: R
  solucion_pasos:
  - 'Paso 1: El exponente $x + 5$ está definido para todo $x \in \mathbb{R} \implies \operatorname{Dom}(g) = \mathbb{R}$.'
- titulo: 'Ejemplo 3: Evaluación en cero'
  enunciado: Al evaluar $x = 0$ en $h(x) = 8^x$, ¿pertenece al dominio?
  alternativas:
  - Sí, h(0) = 8⁰ = 1
  - No, 8⁰ no existe
  - No, da cero
  - Solo en complejos
  respuesta: Sí, h(0) = 8⁰ = 1
  solucion_pasos:
  - 'Paso 1: $h(0) = 1 \in \mathbb{R} \implies 0 \in \operatorname{Dom}(h)$.'
- titulo: 'Ejemplo 4: Comparación con función logarítmica'
  enunciado: A diferencia del logaritmo cuyo dominio es solo $\mathbb{R}^+$, ¿cuál es el dominio de la exponencial?
  alternativas:
  - Todo R
  - Solo R⁺
  - Solo R⁻
  - '[1, +inf['
  respuesta: Todo R
  solucion_pasos:
  - 'Paso 1: La función exponencial admite cualquier número real en su exponente.'
errores_frecuentes:
- Restringir el dominio a los números positivos confundiendo dominio con recorrido.
- Excluir el cero del dominio.
- Creer que los exponentes negativos producen números imaginarios.
afirmaciones_verdaderas:
- El dominio de la función exponencial elemental f(x) = a · bˣ es el conjunto completo de los números reales ℝ.
- La función exponencial está definida y es continua para todo valor real de x.
al_terminar_debes_poder: '**QUÉ:** Determinar el dominio real de la función exponencial.


  **CÓMO:** Demostrando que una base positiva b > 0 admite cualquier exponente real x ∈ ℝ sin restricciones algebraicas.


  ![Resumen La determinación del dominio de la función exponencial elemental $f(x) = a \cdot b^x$ establece que $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$, ya que una base positiva $b > 0$ puede elevarse a cualquier exponente real sin restricciones algebraicas](/static/img/nodos/determinacion-del-dominio-real-de-la-funcion-exponencial-resumen.svg)'
