semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.PARAMETRO_A_MAGNITUD
resumen_inicial: 'El análisis del valor absoluto $|a|$ en la función potencia $f(x) = a \cdot x^n$ describe la escala o abertura vertical: valores $|a| > 1$ dilatan verticalmente la curva cerrando las ramas hacia el eje $Y$, mientras que $0 < |a| < 1$ contraen verticalmente la curva ensanchando su abertura.'
explicacion_simple: "![El análisis del valor absoluto $|a|$ en la función potencia $f(x) = a \\cdot x^n$ describe la escala o abertura vertical: valores $|a| > 1$ dilatan verticalmente la curva cerrando las ramas hacia el eje $Y$, mientras que $0 < |a| < 1$ contraen verticalmente la curva ensanchando su abertura](/static/img/nodos/analisis-del-valor-absoluto-de-a-en-la-abertura-o-escala-vertical-de-la-grafica-intro.svg)\n\n\nEl tamaño numérico de $a$ (sin importar el signo, es decir, el **valor absoluto $|a|$**) controla qué tan **cerrada o abierta** está la gráfica:\n\n- **Si $|a| > 1$ (Número grande: $2, 5, 10, -8$):**\n  - La función crece con mucha fuerza hacia arriba o hacia abajo.\n  - La gráfica se estira verticalmente y **se vuelve MÁS ESTRECHA / CERRADA** (se pega al eje $Y$).\n- **Si $0 < |a| < 1$ (Fracción pequeña: $1/2, 0,1, 1/4$):**\n  - La función crece más lentamente.\n  - La gráfica se aplasta verticalmente y **se vuelve MÁS ANCHA / ABIERTA** (se aleja del eje $Y$).\n- **¡Truco\
  \ clave!** En funciones negativas compara el valor absoluto: $y = -10x^2$ es mucho más estrecha que $y = -0,5x^2$ porque $|-10| = 10 > |-0,5| = 0,5$."
explicacion_formal: "Sea $f(x) = a \\cdot x^n$ y $g(x) = x^n$. La derivada primera es $f'(x) = a \\cdot n x^{n-1}$, cuya magnitud mide la tasa de variación instantánea:\n$$|f'(x)| = |a| \\cdot n |x|^{n-1}$$\n\n**Efectos geométricos de la dilatación afín**:\n1. **Dilatación vertical ($|a| > 1$)**:\n   La distancia vertical entre la curva y el eje horizontal se amplifica por un factor $|a|$. A igualdad de abscisa $x_0$, $|f(x_0)| > |g(x_0)|$, reduciendo el ángulo de abertura apical.\n2. **Contracción vertical ($0 < |a| < 1$)**:\n   La curva se aproxima al eje $X$, aumentando el ángulo de abertura de las ramas.\n3. **Punto de calibración**:\n   En la abscisa unitaria $x = 1$, la curva alcanza exactamente la altura $|f(1)| = |a|$."
definiciones_clave: '- **Dilatación vertical**: Transformación $(x, y) \mapsto (x, ay)$ con $|a| > 1$ que estira la curva en el eje $Y$.

  - **Contracción vertical**: Transformación con $0 < |a| < 1$ que aplasta la curva ensanchando su perfil.'
propiedades_relaciones: '- **Invarianza de ceros**: El valor de $|a|$ no modifica el punto de paso por el origen $(0, 0)$.

  - **Calibración cartesiana**: El valor de $|a|$ es la distancia vertical del punto $(1, a)$ al eje $X$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis del valor absoluto $|a|$ en la función potencia $f(x) = a \cdot x^n$ describe la escala o abertura vertical: valores $|a| > 1$ dilatan verticalmente la curva cerrando las ramas hacia el eje $Y$, mientras que $0 < |a| < 1$ contraen verticalmente la curva ensanchando su abertura](/static/img/nodos/analisis-del-valor-absoluto-de-a-en-la-abertura-o-escala-vertical-de-la-grafica-ejemplos.svg)



    Dadas las funciones $f(x) = 5x^2$, $g(x) = x^2$ y $h(x) = \frac{1}{4}x^2$:

    1) Ordena las funciones de mayor a menor abertura (de la más ancha a la más estrecha).

    2) Compara las alturas alcanzadas en $x = 2$.

    3) Determina qué curva está más pegada al eje $Y$.'
  pasos:
  - 'Paso 1: Comparar valores absolutos:

    - $|a_f| = 5, \quad |a_g| = 1, \quad |a_h| = 1/4 = 0{,}25$.

    - A menor $|a|$, mayor abertura $\implies$ **$h(x)$ es la más ancha, luego $g(x)$, y $f(x)$ es la más estrecha**.'
  - 'Paso 2: Alturas en $x = 2$:

    - $f(2) = 5(4) = \mathbf{20}$.

    - $g(2) = 1(4) = \mathbf{4}$.

    - $h(2) = \frac{1}{4}(4) = \mathbf{1}$.'
  - 'Paso 3: La función **$f(x) = 5x^2$** crece más rápido y está más pegada al eje $Y$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes funciones cuadráticas tiene la gráfica MÁS CERRADA / ESTRECHA?
  choices:
  - text: f(x) = -8x² (porque |-8| = 8 es el mayor valor absoluto)
    is_correct: true
  - text: g(x) = 3x²
    is_correct: false
  - text: h(x) = 0,5x²
    is_correct: false
  - text: p(x) = -0,1x²
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = -8x² (porque |-8| = 8 es el mayor valor absoluto)'. A mayor valor absoluto $|a|$, más empinadas y estrechas son las ramas.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué efecto produce el coeficiente a = 1/5 en la gráfica de $f(x) = \frac{1}{5}x^4$ comparada con $y = x^4$?
  choices:
  - text: La ensancha y achata verticalmente (mayor abertura)
    is_correct: true
  - text: La hace más estrecha y empinada
    is_correct: false
  - text: La traslada 5 unidades a la derecha
    is_correct: false
  - text: La refleja hacia abajo
    is_correct: false
  explanation: La alternativa correcta es 'La ensancha y achata verticalmente (mayor abertura)'. Como $|a| = 1/5 < 1$, la gráfica experimenta una contracción vertical.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el valor absoluto $|a|$ del coeficiente principal de cada función.'
- 'Paso 2: Si $|a| > 1$, clasificar como dilatación vertical (ramas más estrechas y cercanas al eje $Y$).'
- 'Paso 3: Si $0 < |a| < 1$, clasificar como contracción vertical (ramas más abiertas y aplanadas).'
- 'Paso 4: Ordenar de menor a mayor $|a|$ para jerarquizar de mayor a menor abertura.'
errores_correccion: '- **Error común:** Comparar números negativos sin valor absoluto (ej: decir que $-2$ es más ancha que $-0,5$ porque $-2 < -0,5$).

  - **Cómo corregirlo:** La abertura **solo depende de la magnitud $|a|$**: $|-2| = 2 > |-0,5| = 0,5 \implies -2x^2$ es **MÁS ESTRECHA**.'
ejemplos:
- titulo: 'Ejemplo 1: Comparación con fracciones'
  enunciado: '¿Cuál función es más ancha: $f(x) = 2x^3$ o $g(x) = 0{,}3x^3$?'
  alternativas:
  - g(x) es más ancha porque |0,3| < |2|
  - f(x) es más ancha
  - Tienen la misma abertura
  - Depende del valor de x
  respuesta: g(x) es más ancha porque |0,3| < |2|
  solucion_pasos:
  - 'Paso 1: $|0{,}3| < 2 \implies g(x)$ tiene mayor abertura.'
- titulo: 'Ejemplo 2: Coeficientes negativos con valor absoluto'
  enunciado: Entre $f(x) = -10x^4$ y $g(x) = -2x^4$, ¿cuál es más estrecha?
  alternativas:
  - f(x) porque |-10| = 10 > |-2| = 2
  - g(x) porque -2 > -10
  - Son iguales
  - g(x) es más estrecha
  respuesta: f(x) porque |-10| = 10 > |-2| = 2
  solucion_pasos:
  - 'Paso 1: $|-10| = 10 > 2 \implies f(x)$ es más estrecha.'
- titulo: 'Ejemplo 3: Punto en x = 1'
  enunciado: Si $f(x) = ax^2$ pasa por $(1, 7)$, ¿cuánto vale $a$?
  alternativas:
  - a = 7
  - a = 49
  - a = 1/7
  - a = √7
  respuesta: a = 7
  solucion_pasos:
  - 'Paso 1: $f(1) = a(1)^2 = a = 7$.'
- titulo: 'Ejemplo 4: Orden de abertura'
  enunciado: 'Ordena de más estrecha a más ancha: $y_1 = 3x^2, \; y_2 = \frac{1}{2}x^2, \; y_3 = 9x^2$:'
  alternativas:
  - y₃, y₁, y₂
  - y₂, y₁, y₃
  - y₁, y₂, y₃
  - y₃, y₂, y₁
  respuesta: y₃, y₁, y₂
  solucion_pasos:
  - 'Paso 1: Magnitudes: $9 > 3 > 0{,}5 \implies$ más estrecha $y_3$, luego $y_1$, más ancha $y_2$.'
errores_frecuentes:
- No aplicar valor absoluto al comparar coeficientes negativos.
- Creer que la abertura depende del grado n y no del coeficiente a.
- Confundir la dilatación vertical con un desplazamiento horizontal.
afirmaciones_verdaderas:
- A mayor valor absoluto |a|, la gráfica de la función potencia es más estrecha y empinada.
- Valores 0 < |a| < 1 producen contracción vertical ensanchando la abertura de la curva.
al_terminar_debes_poder: '**QUÉ:** Analizar el efecto del valor absoluto |a| en la escala y abertura vertical de la gráfica.


  **CÓMO:** Comparando magnitudes |a| > 1 (más estrecha) y 0 < |a| < 1 (más ancha) para ordenar aberturas relativas.


