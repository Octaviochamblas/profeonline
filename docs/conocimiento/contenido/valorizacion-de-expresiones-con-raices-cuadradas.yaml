semantic_id: MAT.ALG.VALORIZACION.RAICES_CUADRADAS
resumen_inicial: La valorización de expresiones con raíces cuadradas consiste en evaluar expresiones que contienen radical $\sqrt{P(x)}$ sustituyendo las variables y calculando la raíz sobre el argumento acumulado no negativo.
explicacion_simple: "Cuando una expresión algebraica contiene **raíces cuadradas** ($\\sqrt{\\dots}$):\n- **Paso 1: Sustituir** la variable dentro del signo de la raíz.\n- **Paso 2: Resolver la operación completa DENTRO de la raíz** (el radicando).\n- **Paso 3: Extraer la raíz cuadrada principal** del número resultante (que debe ser $\\ge 0$).\n- **Paso 4**: Continuar con las operaciones externas.\n- **Ejemplo**: Valorizar $\\sqrt{2x + 1}$ para $x = 12$:\n  - Operación dentro de la raíz: $2(12) + 1 = 24 + 1 = 25$.\n  - Extracción de raíz: $\\sqrt{25} = \\mathbf{5}$.\n- ** Restricción clave en los Reales ($\\mathbb{R}$)**: El resultado de la operación DENTRO de una raíz cuadrada **no puede ser un número negativo** (ej: $\\sqrt{-9}$ no pertenece a $\\mathbb{R}$).\n\n![Valorización con Raíces Cuadradas](/static/img/nodos/valorizacion-de-expresiones-con-raices-cuadradas-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $R(x) = \sqrt{P(x)}$ una función radical donde $P(x) \in \mathbb{R}[x]$. La **valorización en el cuerpo de los números reales** $\mathbb{R}$ está bien definida únicamente para aquellos valores $x = c$ pertenecientes al dominio $\operatorname{Dom}(R) = \{x \in \mathbb{R} \mid P(x) \ge 0\}$:


  $$\operatorname{ev}_{x = c}(\sqrt{P(x)}) = \sqrt{P(c)} = y \in \mathbb{R}_{\ge 0} \iff y^2 = P(c) \quad \text{con } P(c) \ge 0$$


  ### Jerarquía del Signo Radical como Agrupador Interno

  El símbolo radical $\sqrt{\dots}$ actúa como un símbolo de vinculación parentética de máxima prioridad. Por ende:


  $$\sqrt{A + B} \neq \sqrt{A} + \sqrt{B}$$


  ### Restricción del Dominio Real

  Si $P(c) < 0$, la valorización $\sqrt{P(c)} \notin \mathbb{R}$ no posee una solución real (requiere el cuerpo complejo $\mathbb{C}$).


  ### Síntesis didáctica

  La valorización con raíces cuadradas es fundamental en el cálculo de distancias euclidianas en el plano cartesiano ($d = \sqrt{(x_2-x_1)^2 + (y_2-y_1)^2}$) y en la aplicación de la fórmula cuadrática.

  '
definiciones_clave: '- **Valorización radical**: Cálculo del valor principal de la raíz cuadrada $\sqrt{P(c)}$ tras evaluar la cantidad subradical.

  - **Radicando / Subradical**: Expresión $P(x)$ contenida dentro del símbolo de la raíz que debe ser no negativa en $\mathbb{R}$.

  - **Raíz principal ($\sqrt{y} \ge 0$)**: Único valor no negativo cuya elevación al cuadrado es igual al radicando $y$.

  '
propiedades_relaciones: '- **No distributividad sobre la suma**: $\sqrt{x^2 + y^2} \neq x + y$.

  - **Cancelación con cuadrado interno**: $\sqrt{x^2} = |x|$ para cualquier número real $x$.

  '
ejemplo_guiado:
  enunciado: Calcula el valor de la expresión $3\sqrt{x^2 + 7} - 2$ para $x = -3$.
  pasos:
  - 'Paso 1: Sustituimos $x = -3$ dentro de la raíz con paréntesis: $3\sqrt{(-3)^2 + 7} - 2$.'
  - 'Paso 2: Evaluamos la potencia interna $(-3)^2 = 9 \implies 3\sqrt{9 + 7} - 2$.'
  - 'Paso 3: Sumamos los valores del subradical: $9 + 7 = 16 \implies 3\sqrt{16} - 2$.'
  - 'Paso 4: Extraemos la raíz cuadrada principal: $\sqrt{16} = 4 \implies 3(4) - 2$.'
  - 'Paso 5: Multiplicamos y restamos: $12 - 2 = 10$.'
  - 'Conclusión: El valor numérico final es **$10$**.'
  imagen: /static/img/nodos/valorizacion-de-expresiones-con-raices-cuadradas-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición debe cumplir el valor del subradical $P(c)$ para que la valorización $\sqrt{P(c)}$ esté definida en los números reales $\mathbb{R}$?
  choices:
  - text: El valor del subradical debe ser mayor o igual a cero ($P(c) \ge 0$)
    is_correct: true
  - text: El valor del subradical debe ser estrictamente negativo
    is_correct: false
  - text: El valor del subradical debe ser un número primo
    is_correct: false
  - text: El valor del subradical debe ser una fracción
    is_correct: false
  explanation: La alternativa correcta es 'El valor del subradical debe ser mayor o igual a cero ($P(c) \ge 0$)'. Dominio de la raíz cuadrada real.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor numérico de $\sqrt{a^2 + b^2}$ para $a = 3$ y $b = 4$?
  choices:
  - text: El valor es $5$, obtenido al calcular $\sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5$
    is_correct: true
  - text: El valor es $7$
    is_correct: false
  - text: El valor es $25$
    is_correct: false
  - text: El valor es $12$
    is_correct: false
  explanation: La alternativa correcta es 'El valor es $5$, obtenido al calcular $\sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5$'. Suma subradical $9+16=25$, raíz 5.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar las variables por sus constantes numéricas dentro del símbolo de la raíz.'
- 'Paso 2: Calcular todas las potencias y operaciones internas del subradical hasta obtener un único número.'
- 'Paso 3: Verificar que la cantidad subradical sea no negativa ($\ge 0$).'
- 'Paso 4: Extraer la raíz cuadrada principal y multiplicar por el coeficiente externo.'
errores_correccion: '- **Error 1:** Distribuir la raíz cuadrada sobre la suma de términos (escribir $\sqrt{x^2 + 9} = x + 3$). **Cómo corregirlo:** La raíz **NO SE DISTRIBUYE SOBRE LA SUMA**; debe resolverse la suma completa dentro de la raíz antes de extraerla.

  - **Error 2:** Obtener una cantidad subradical negativa en los números reales (ej: intentar calcular $\sqrt{-16}$). **Cómo corregirlo:** Si el subradical da negativo, la expresión **NO POSEE VALORIZACIÓN REAL ($\notin \mathbb{R}$)**.

  '
ejemplos:
- titulo: Raíz cuadrada simple
  enunciado: ¿Cuál es el valor de $\sqrt{5x + 1}$ para $x = 3$?
  alternativas:
  - $4$
  - $16$
  - $8$
  respuesta: $4$
  solucion_pasos:
  - '1. Subradical: $5(3) + 1 = 15 + 1 = 16$.'
  - '2. Raíz: $\sqrt{16} = 4$.'
- titulo: Raíz con potencias
  enunciado: ¿Cuál es el valor de $\sqrt{x^2 + 16}$ para $x = -3$?
  alternativas:
  - $5$
  - $1$
  - $7$
  respuesta: $5$
  solucion_pasos:
  - '1. Subradical: $(-3)^2 + 16 = 9 + 16 = 25$.'
  - '2. Raíz: $\sqrt{25} = 5$.'
- titulo: No distributividad de la raíz
  enunciado: ¿Difiere el valor de $\sqrt{9 + 16} = \sqrt{25} = 5$ del valor de $\sqrt{9} + \sqrt{16} = 3 + 4 = 7$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5 \neq 7$, demostrando que la raíz no se distribuye sobre la suma.
- titulo: Subradical negativo fuera de los reales
  enunciado: Para $x = -5$, ¿carece de solución en los números reales la valorización de $\sqrt{x + 1} = \sqrt{-4}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt{-4} \notin \mathbb{R}$.
errores_frecuentes:
- Distribuir la raíz cuadrada sobre la suma de términos escribiendo \sqrt{a^2+b^2} = a + b.
- Intentar calcular la raíz cuadrada real de una cantidad subradical estrictamente negativa.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Extraer la raíz de los términos individuales antes de efectuar la adición del subradical.
- Multiplicar el coeficiente externo por el radicando antes de extraer la raíz cuadrada.
afirmaciones_verdaderas:
- La valorización de una expresión con raíz cuadrada exige calcular la operación completa del subradical antes de extraer la raíz.
- La raíz cuadrada de una suma no es igual a la suma de las raíces cuadradas individuales (\sqrt{A+B} \neq \sqrt{A} + \sqrt{B}).
al_terminar_debes_poder: '![Resumen de valorización con raíces cuadradas](/static/img/nodos/valorizacion-de-expresiones-con-raices-cuadradas-resumen.svg)


  QUÉ: Evaluar numéricamente expresiones algebraicas con radicales y raíces cuadradas.


  CÓMO: Calcular la totalidad de las operaciones del radicando interior hasta obtener un valor $k \geq 0$, y luego extraer la raíz cuadrada $\sqrt{k}$.'
