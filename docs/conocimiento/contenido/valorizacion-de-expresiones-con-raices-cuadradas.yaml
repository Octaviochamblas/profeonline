semantic_id: MAT.ALG.VALORIZACION.RAICES_CUADRADAS
resumen_inicial: 'Valorización de expresiones con raíces cuadradas: traducción, reglas
  y aplicación práctica en Valorización de expresiones algebraicas.'
explicacion_simple: A veces, las fórmulas matemáticas nos obligan a buscar el origen
  de un número. Si una sala cuadrada tiene un área de 25 metros, ¿cuánto mide su lado?
  La respuesta yace en la raíz cuadrada.
explicacion_formal: '### Definición formal


  El ''techo'' de la raíz encapsula toda la expresión subradical. Debes reducir todo
  a un solo número antes de aplicar la raíz. Separar raíces en sumas es un error fatal
  en matemáticas.


  ### Desarrollo didáctico


  Imagina la expresión $\sqrt{b^2 - 4ac}$. (Te sonará conocida.).

  Para valorizarla, digamos con $a=1, b=5, c=6$:

  1. Sustituimos dentro del ''techo'' de la raíz: $\sqrt{(5)^2 - 4(1)(6)}$.

  2. Resolvemos el interior usando jerarquía. Primero potencias y multiplicaciones:
  $\sqrt{25 - 24}$.

  3. Hacemos la resta: $\sqrt{1}$.

  4. Solo al final, cuando queda un solo número bajo el techo, extraemos la raíz:
  $1$.


  Regla de hierro: **Jamás** separes una suma o resta que está bajo una raíz en dos
  raíces diferentes. $\sqrt{16 + 9}$ es $\sqrt{25} = 5$. Si lo separas como $\sqrt{16}
  + \sqrt{9}$ obtendrías $4 + 3 = 7$, lo cual es matemáticamente falso.'
