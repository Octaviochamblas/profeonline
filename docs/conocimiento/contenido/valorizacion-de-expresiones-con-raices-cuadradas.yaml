resumen_inicial: La valorización de expresiones con raíces cuadradas calcula el resultado
  escalar sustituyendo números específicos en las variables correspondientes.
explicacion_simple: Al trabajar con valorización de expresiones con raíces cuadradas,
  reemplazamos las letras por los valores dados respetando el orden de operaciones
  (potencias, raíces, multiplicaciones y sumas).
explicacion_formal: 'Dada una expresión $E(X)$, su **Valorización de expresiones con
  raíces cuadradas** para los valores $X = V$ se formaliza por:


  $$\text{"la expresión sqrt(2x + 1) para x = 4"} \implies 3$$


  > **Complemento didáctico:** La evaluación rigurosa preserva la estructura de los
  operadores sobre el cuerpo de los números reales.'
definiciones_clave: '- **Valorización de expresiones con raíces cuadradas**: Cálculo
  numérico escalar tras reemplazar variables por números.'
propiedades_relaciones: '- **Jerarquía operacional**: Las potencias y raíces anteceden
  a los productos y adiciones.'
ejemplo_guiado:
  enunciado: 'Calcule valorización de expresiones con raíces cuadradas para: ''la
    expresión sqrt(2x + 1) para x = 4''.'
  pasos:
  - 'Paso 1: Sustituir las variables por sus valores respectivos.'
  - 'Paso 2: Resolver potencias o raíces presentes.'
  - 'Paso 3: Multiplicar y sumar para obtener el resultado final.'
  - 'Conclusión: El resultado es 3.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor numérico resultante al efectuar valorización de expresiones
    con raíces cuadradas en 'la expresión sqrt(2x + 1) para x = 4'?
  choices:
  - text: '3'
    is_correct: true
  - text: '9'
    is_correct: false
  - text: '5'
    is_correct: false
  - text: sqrt(7)
    is_correct: false
  explanation: La alternativa correcta es '3'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'la expresión sqrt(2x + 1) para x = 4', ¿cuál
    fue el valor obtenido?
  choices:
  - text: '3'
    is_correct: true
  - text: '9'
    is_correct: false
  - text: '5'
    is_correct: false
  - text: sqrt(7)
    is_correct: false
  explanation: La alternativa correcta es '3'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar las variables utilizando paréntesis.'
- 'Paso 2: Resolver operaciones según su jerarquía.'
- 'Paso 3: Obtener el valor escalar final.'
errores_correccion: '- **Error 1: Alterar la jerarquía de operaciones al ejecutar
  valorización de expresiones con raíces cuadradas.** **Cómo corregirlo:** Resolver
  potencias y raíces antes que las multiplicaciones y adiciones.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Qué valor se obtiene al calcular valorización de expresiones con raíces
    cuadradas en 'la expresión sqrt(2x + 1) para x = 4'?
  alternativas:
  - '3'
  - '9'
  - '5'
  - sqrt(7)
  respuesta: '3'
  solucion_pasos:
  - 1. Sustituir los valores dados.
  - 2. Calcular la expresión dando 3.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de la evaluación para valorización de expresiones
    con raíces cuadradas en 'la expresión sqrt(2x + 1) para x = 4'?
  alternativas:
  - '3'
  - '9'
  - '5'
  - sqrt(7)
  respuesta: '3'
  solucion_pasos:
  - 1. Aplicar la sustitución.
  - 2. Obtener 3.
- titulo: ¿Es el resultado de la valorización para 'la expresión sqrt(2x + 1) para
    x = 4' igual a 3?
  respuesta: Sí
  solucion_pasos:
  - Sí, evaluando paso a paso obtenemos 3.
- titulo: ¿Da la valorización de 'la expresión sqrt(2x + 1) para x = 4' un valor igual
    a 9?
  respuesta: 'No'
  solucion_pasos:
  - No, el valor correcto es 3.
errores_frecuentes:
- Alterar la jerarquía de operaciones al efectuar valorización de expresiones con
  raíces cuadradas.
- Omitir los paréntesis al sustituir términos en valorización de expresiones con raíces
  cuadradas.
- Multiplicar bases por exponentes en lugar de calcular la potencia.
- Sumar fracciones de distinto denominador sin igualarlas previamente.
- Declarar que la evaluación de una raíz cuadrada puede dar un radicando negativo
  real.
afirmaciones_verdaderas:
- La valorización respeta estrictamente la jerarquía operacional de potencias, productos
  y adiciones.
- Sustituir correctamente las variables permite calcular el valor escalar exacto de
  la expresión.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la valorización de expresiones
  con raíces cuadradas respetando el orden operacional sobre el conjunto numérico
  asignado.
