resumen_inicial: La aplicación de la regla operativa de monomio por polinomio aplica
  rigurosamente las leyes distributivas, de signos y de potencias en expresiones algebraicas.
explicacion_simple: Al trabajar con aplicación de la regla operativa de monomio por
  polinomio, multiplicamos los coeficientes numéricos, aplicamos la regla de signos
  y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Aplicación de la regla operativa
  de monomio por polinomio** viene dada por:


  $$\text{"el producto 2a^2(3a^3 - 5a + 4)"} \implies 6a^5 - 10a^3 + 8a^2$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Aplicación de la regla operativa de monomio por polinomio**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule aplicación de la regla operativa de monomio por polinomio para:
    ''el producto 2a^2(3a^3 - 5a + 4)''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es 6a^5 - 10a^3 + 8a^2.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar aplicación de la regla operativa de monomio
    por polinomio a 'el producto 2a^2(3a^3 - 5a + 4)'?
  choices:
  - text: 6a^5 - 10a^3 + 8a^2
    is_correct: true
  - text: 6a^6 - 10a^2 + 8a^2
    is_correct: false
  - text: 5a^5 - 3a^3 + 6a^2
    is_correct: false
  - text: 6a^5 - 5a + 4
    is_correct: false
  explanation: La alternativa correcta es '6a^5 - 10a^3 + 8a^2'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto 2a^2(3a^3 - 5a + 4)', ¿qué expresión
    resultante se obtuvo?
  choices:
  - text: 6a^5 - 10a^3 + 8a^2
    is_correct: true
  - text: 6a^6 - 10a^2 + 8a^2
    is_correct: false
  - text: 5a^5 - 3a^3 + 6a^2
    is_correct: false
  - text: 6a^5 - 5a + 4
    is_correct: false
  explanation: La alternativa correcta es '6a^5 - 10a^3 + 8a^2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante aplicación de la regla operativa de monomio por polinomio.** **Cómo corregirlo:**
  Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de aplicación de la regla operativa de monomio
    por polinomio en 'el producto 2a^2(3a^3 - 5a + 4)'?
  alternativas:
  - 6a^5 - 10a^3 + 8a^2
  - 6a^6 - 10a^2 + 8a^2
  - 5a^5 - 3a^3 + 6a^2
  - 6a^5 - 5a + 4
  respuesta: 6a^5 - 10a^3 + 8a^2
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener 6a^5 - 10a^3 + 8a^2.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto 2a^2(3a^3 - 5a + 4)' por aplicación de la regla
    operativa de monomio por polinomio, ¿qué expresión resulta?
  alternativas:
  - 6a^5 - 10a^3 + 8a^2
  - 6a^6 - 10a^2 + 8a^2
  - 5a^5 - 3a^3 + 6a^2
  - 6a^5 - 5a + 4
  respuesta: 6a^5 - 10a^3 + 8a^2
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir 6a^5 - 10a^3 + 8a^2.
- titulo: ¿Es la multiplicación en 'el producto 2a^2(3a^3 - 5a + 4)' equivalente a
    6a^5 - 10a^3 + 8a^2?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene 6a^5 - 10a^3 + 8a^2.
- titulo: ¿Da el producto de 'el producto 2a^2(3a^3 - 5a + 4)' un resultado igual
    a 6a^6 - 10a^2 + 8a^2?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es 6a^5 - 10a^3 + 8a^2.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar aplicación de la regla
  operativa de monomio por polinomio.
- Omitir distribuir el monomio o término sobre todos los sumandos en aplicación de
  la regla operativa de monomio por polinomio.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La aplicación de la regla operativa de monomio por polinomio requiere sumar los
  exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la aplicación de la regla
  operativa de monomio por polinomio aplicando distributividad, ley de signos y suma
  de exponentes.
