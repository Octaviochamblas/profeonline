semantic_id: MAT.ALG.MULT_MON_POL.REGLA_OPERATIVA
resumen_inicial: La aplicación de la regla operativa de monomio por polinomio consiste en ejecutar de forma metódica y estructurada la multiplicación de coeficientes y la adición de exponentes para cada sumando.
explicacion_simple: "Para resolver la multiplicación de un **monomio por un polinomio** con rapidez y sin errores, sigue esta **regla operativa metódica**:\n- Para **CADA TÉRMINO** del polinomio de adentro:\n  1. **Signo**: Multiplica los signos (ley de signos).\n  2. **Coeficiente**: Multiplica los números.\n  3. **Exponentes**: Conserva las variables y suma los exponentes de las letras iguales.\n- **Ejemplo estructurado**: $(-2x^2 y) \\cdot (5x^3 - 3x y^2 + 4)$:\n  - Término 1 ($+5x^3$): $(-) \\cdot (+) \\to \\mathbf{-}$, $2 \\cdot 5 \\to \\mathbf{10}$, $x^{2+3} y \\to \\mathbf{x^5 y} \\implies \\mathbf{-10x^5 y}$.\n  - Término 2 ($-3x y^2$): $(-) \\cdot (-) \\to \\mathbf{+}$, $2 \\cdot 3 \\to \\mathbf{6}$, $x^{2+1} y^{1+2} \\to \\mathbf{x^3 y^3} \\implies \\mathbf{+6x^3 y^3}$.\n  - Término 3 ($+4$): $(-) \\cdot (+) \\to \\mathbf{-}$, $2 \\cdot 4 \\to \\mathbf{8}$, $x^2 y \\to \\mathbf{x^2 y} \\implies \\mathbf{-8x^2 y}$.\n- **Resultado unificado**: **$-10x^5 y + 6x^3 y^3 - 8x^2 y$**.\n\
  \n![Regla Operativa Monomio por Polinomio](/static/img/nodos/aplicacion-de-la-regla-operativa-de-monomio-por-polinomio-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la multiplicación de un monomio multivariable $M = c \prod x_i^{\alpha_i}$ por un polinomio $P = \sum_{j=1}^m a_j \prod x_i^{\beta_{ji}}$. La **regla operativa algorítmica** formaliza la construcción secuencial del conjunto de productos parciales monómicos $P_j$:


  $$P_j = \left( \operatorname{sgn}(c \cdot a_j) \cdot |c \cdot a_j| \right) \prod_{i=1}^n x_i^{\alpha_i + \beta_{ji}}$$


  tal que la suma expandida ordenada satisfaga:


  $$M \cdot P = \sum_{j=1}^m P_j$$


  ### Estructuración del Algoritmo en Tres Fases Locales

  Para cada componente $j \in \{1, \dots, m\}$, el algoritmo aplica localmente:

  1. $\text{Fase } \sigma_j = \operatorname{sgn}(c) \cdot \operatorname{sgn}(a_j) \in \{-1, +1\}$.

  2. $\text{Fase } C_j = |c| \cdot |a_j| \in \mathbb{R}^+$.

  3. $\text{Fase } E_{ji} = \alpha_i + \beta_{ji} \in \mathbb{N}_0$.


  ### Síntesis didáctica

  Dividir cada multiplicación parcial en las tres fases locales (signo, número, letras) sistematiza el cálculo y reduce la tasa de error por distracción.

  '
definiciones_clave: '- **Regla operativa de monomio por polinomio**: Algoritmo secuencial que resuelve término a término la multiplicación aplicando fases de signo, coeficientes y potencias.

  - **Fases locales de cómputo ($\sigma_j, C_j, E_{ji}$)**: Triada operacional compuesta por la regla de signos, producto numérico y adición de exponentes.

  - **Secuencia algorítmica**: Proceso ordenado de izquierda a derecha sobre cada sumando del polinomio.

  '
propiedades_relaciones: '- **Invarianza por ordenamiento**: Aplicar la regla operativa sobre los términos ordenados decrecientemente genera el polinomio expandido ya ordenado.

  - **Estabilidad de grado parcial**: Cada producto parcial $P_j$ incrementa su grado absoluto en exactamente $\operatorname{deg}(M)$.

  '
ejemplo_guiado:
  enunciado: Aplica la regla operativa para multiplicar $(-3x^3 y^2) \cdot (4x^2 y - 2x + 7)$.
  pasos:
  - 'Paso 1: Evaluamos el término 1 ($+4x^2 y$): - Signo: $(-) \cdot (+) = -$. - Coeficiente: $3 \cdot 4 = 12$. - Exponentes $x$: $3 + 2 = 5$. - Exponentes $y$: $2 + 1 = 3$. - Producto parcial 1: $\mathbf{-12x^5 y^3}$.'
  - 'Paso 2: Evaluamos el término 2 ($-2x$): - Signo: $(-) \cdot (-) = +$. - Coeficiente: $3 \cdot 2 = 6$. - Exponentes $x$: $3 + 1 = 4$. - Exponentes $y$: $2 + 0 = 2$. - Producto parcial 2: $\mathbf{+6x^4 y^2}$.'
  - 'Paso 3: Evaluamos el término 3 ($+7$): - Signo: $(-) \cdot (+) = -$. - Coeficiente: $3 \cdot 7 = 21$. - Exponentes $x$: $3 + 0 = 3$. - Exponentes $y$: $2 + 0 = 2$. - Producto parcial 3: $\mathbf{-21x^3 y^2}$.'
  - 'Paso 4: Consolidamos el polinomio final: $-12x^5 y^3 + 6x^4 y^2 - 21x^3 y^2$.'
  - 'Conclusión: El producto resuelto es **$-12x^5 y^3 + 6x^4 y^2 - 21x^3 y^2$**.'
  imagen: /static/img/nodos/aplicacion-de-la-regla-operativa-de-monomio-por-polinomio-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las tres fases independientes que se deben ejecutar en cada multiplicación parcial según la regla operativa?
  choices:
  - text: Determinar el signo (ley de signos), multiplicar los coeficientes numéricos y sumar los exponentes de las letras iguales
    is_correct: true
  - text: Sumar los números, restar las letras y multiplicar los signos
    is_correct: false
  - text: Dividir los coeficientes, multiplicar las potencias y eliminar los signos
    is_correct: false
  - text: Multiplicar los exponentes, sumar las constantes y cambiar los signos del minuendo
    is_correct: false
  explanation: La alternativa correcta es 'Determinar el signo (ley de signos), multiplicar los coeficientes numéricos y sumar los exponentes de las letras iguales'. Fases locales de cómputo ($\sigma_j, C_j, E_{ji}$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de aplicar la regla operativa en $(-2a) \cdot (3a^2 - 4a + 1)$?
  choices:
  - text: El resultado es $-6a^3 + 8a^2 - 2a$, operando signo, número y exponente término a término
    is_correct: true
  - text: El resultado es $-6a^3 - 8a^2 + 2a$
    is_correct: false
  - text: El resultado es $-6a^2 + 8a - 2$
    is_correct: false
  - text: El resultado es $6a^3 - 8a^2 + 2a$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $-6a^3 + 8a^2 - 2a$, operando signo, número y exponente término a término'. $-2a(3a^2)=-6a^3$, $-2a(-4a)=+8a^2$, $-2a(1)=-2a$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el monomio a la izquierda del paréntesis conteniendo al polinomio.'
- 'Paso 2: Para el primer sumando, calcular: Ley de signos $\to$ Producto de coeficientes $\to$ Suma de exponentes.'
- 'Paso 3: Repetir exactamente las tres fases para cada uno de los sumandos siguientes de izquierda a derecha.'
- 'Paso 4: Unir los productos parciales obtenidos en un único polinomio expandido ordenado.'
errores_correccion: '- **Error 1:** Multiplicar los exponentes de las variables en lugar de sumarlos durante la fase de potencias. **Cómo corregirlo:** En la fase de variables **LOS EXPONENTES SE SUMAN ($x^a \cdot x^b = x^{a+b}$)**.

  - **Error 2:** Excluir la fase de signos al pasar del primer al segundo término del polinomio. **Cómo corregirlo:** La fase de signos **SE REPITE EN CADA TÉRMINO INDIVIDUALMENTE**.

  '
ejemplos:
- titulo: Regla operativa básica
  enunciado: ¿Cuál es el desarrollo de $3x \cdot (2x - 7)$?
  alternativas:
  - $6x^2 - 21x$
  - $6x - 21$
  - $6x^2 - 7$
  respuesta: $6x^2 - 21x$
  solucion_pasos:
  - '1. Término 1: $(+)(+) \to +$, $3 \cdot 2 = 6$, $x^{1+1} = x^2 \implies 6x^2$.'
  - '2. Término 2: $(+)(-) \to -$, $3 \cdot 7 = 21$, $x^1 \implies -21x$.'
  - '3. Resultado: $6x^2 - 21x$.'
- titulo: Regla operativa con tres términos
  enunciado: ¿Cuál es el desarrollo de $-a \cdot (a^2 - 3a + 4)$?
  alternativas:
  - $-a^3 + 3a^2 - 4a$
  - $-a^3 - 3a^2 + 4a$
  - $a^3 - 3a^2 + 4a$
  respuesta: $-a^3 + 3a^2 - 4a$
  solucion_pasos:
  - 1. $(-a) \cdot a^2 = -a^3$.
  - 2. $(-a) \cdot (-3a) = +3a^2$.
  - 3. $(-a) \cdot 4 = -4a$.
  - '4. Resultado: $-a^3 + 3a^2 - 4a$.'
- titulo: Ordenamiento sistemático
  enunciado: Si el polinomio dentro del paréntesis está ordenado decrecientemente, ¿sale el producto expandido ordenado decrecientemente?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el monomio suma la misma potencia a cada grado conservando el orden.
- titulo: Preservación de signo por fase
  enunciado: Para $(-4x) \cdot (-x^2 + 2)$, ¿da el primer producto $+4x^3$ y el segundo $-8x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-4)(-1)=+4$ y $(-4)(+2)=-8$.
errores_frecuentes:
- Multiplicar los exponentes de las potencias al aplicar la fase de variables.
- La ley de los signos no es aplicada en los términos secundarios del polinomio.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Sumar los coeficientes en lugar de multiplicarlos durante la fase de coeficientes.
- Perder las variables que tienen exponente 1 implícito.
afirmaciones_verdaderas:
- 'La regla operativa descompone la multiplicación en tres fases por término: signo, coeficiente y exponentes.'
- Si el polinomio del paréntesis está ordenado, la regla operativa produce un polinomio expandido automáticamente ordenado.
al_terminar_debes_poder: '![Resumen de regla operativa](/static/img/nodos/aplicacion-de-la-regla-operativa-de-monomio-por-polinomio-resumen.svg)


  QUÉ: Ejecutar de forma algorítmica y ordenada el producto de un monomio por un polinomio.


  CÓMO: Aplicar secuencialmente en cada término la regla de signos, la multiplicación de coeficientes numéricos y la suma de exponentes de variables idénticas.'
