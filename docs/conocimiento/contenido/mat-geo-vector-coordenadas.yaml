procedimiento:
- 'Paso 1: Identifica las coordenadas del origen y el extremo del vector.'
- 'Paso 2: Calcula vx=x_extremo-x_origen (la componente horizontal).'
- 'Paso 3: Calcula vy=y_extremo-y_origen (la componente vertical), y expresa el vector
  como (vx,vy).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con representación de un vector mediante coordenadas en el
  plano.
