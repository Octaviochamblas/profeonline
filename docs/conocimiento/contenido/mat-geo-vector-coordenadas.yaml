semantic_id: MAT.GEO.VECTORES_BASE.COORDENADAS_VECTOR
resumen_inicial: 'Representación de un vector mediante coordenadas en el plano: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Las coordenadas de un vector indican cuánto se avanza horizontalmente
  y cuánto verticalmente para ir de su origen a su extremo.
explicacion_formal: '![Coordenadas de un vector](/static/img/geometria/cartesiano-vectores/vector-coordenadas.svg)


  ### Definición formal


  Dado un vector $\vec{AB}$ con $A(x_A,y_A)$ y $B(x_B,y_B)$, sus componentes son $v_x=x_B-x_A$
  y $v_y=y_B-y_A$. Cuando el vector está anclado en el origen, sus componentes coinciden
  directamente con las coordenadas de su extremo.


  ### Desarrollo didáctico


  En la figura, el vector con origen en $(0,0)$ y extremo en $(4,3)$ tiene componentes
  $v_x=4$ y $v_y=3$, representándose como $\vec{v}=(4,3)$.'
definiciones_clave: '- **Representación de un vector mediante coordenadas en el plano**:
