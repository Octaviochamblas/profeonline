semantic_id: MAT.ALG.EC_CUADR_BASE.DEFINICION
resumen_inicial: Una ecuación de segundo grado o cuadrática es una igualdad polinómica donde el mayor exponente de la incógnita es exactamente 2.
explicacion_simple: |
  Una **ecuación de segundo grado** (o cuadrática) es una ecuación algebraica donde la incógnita (usualmente $x$) está elevada al cuadrado ($x^2$), y no hay potencias superiores como $x^3$ o $x^4$:

  - Forma estándar: $ax^2 + bx + c = 0$.
  - Ejemplo: $3x^2 - 5x + 2 = 0$.
  - **La regla de oro**: El término $x^2$ DEBE existir obligatoriamente ($a \neq 0$). Si $a = 0$, la ecuación deja de ser cuadrática y se convierte en lineal ($bx + c = 0$).
explicacion_formal: |
  Sea $x$ una variable en el cuerpo de los números reales $\mathbb{R}$. Una **ecuación polinómica de segundo grado con una incógnita** es cualquier igualdad condicional que adopta o puede ser transformada a la forma canónica:

  $$ax^2 + bx + c = 0 \quad \text{donde } a, b, c \in \mathbb{R} \quad \text{y } a \neq 0$$

  **Clasificación de términos:**
  - $ax^2$: Término cuadrático (grado 2).
  - $bx$: Término lineal (grado 1).
  - $c$: Término independiente (grado 0).
definiciones_clave: |
  - **Ecuación de segundo grado**: Igualdad algebraica polinómica cuyo grado absoluto con respecto a la incógnita es igual a 2.
propiedades_relaciones: |
  - **Número de soluciones en $\mathbb{R}$**: Toda ecuación cuadrática real posee a lo sumo dos soluciones en el conjunto de los números reales (Teorema Fundamental del Álgebra).
ejemplo_guiado:
  enunciado: 'Determina si la ecuación $4x^2 + 7 = 2x^2 - 3x + 1$ es de segundo grado reduciéndola a su forma canónica.'
  pasos:
    - 'Paso 1: Transponer todos los términos al lado izquierdo: $(4x^2 - 2x^2) + 3x + (7 - 1) = 0$.'
    - 'Paso 2: Reducir términos semejantes: $2x^2 + 3x + 6 = 0$.'
    - 'Paso 3: Identificar el coeficiente cuadrático principal: $a = 2 \neq 0$.'
    - 'Paso 4: Concluir que al ser el término cuadrático distinto de cero y de grado 2, la ecuación es de segundo grado.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la condición fundamental indispensable para que la expresión $ax^2 + bx + c = 0$ sea de segundo grado?'
    choices:
      - {text: 'El coeficiente cuadrático $a$ debe ser distinto de cero ($a \neq 0$).', is_correct: true}
      - {text: 'El término independiente $c$ debe ser positivo.', is_correct: false}
      - {text: 'El coeficiente lineal $b$ debe ser igual a 1.', is_correct: false}
      - {text: 'La variable $x$ debe tomar solo valores enteros.', is_correct: false}
    explanation: 'La alternativa correcta es ''El coeficiente cuadrático $a$ debe ser distinto de cero ($a \neq 0$).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si en la ecuación $ax^2 + bx + c = 0$ se cumple que $a = 0$ y $b \neq 0$, ¿qué tipo de ecuación resulta?'
    choices:
      - {text: 'Una ecuación lineal o de primer grado.', is_correct: true}
      - {text: 'Una ecuación cúbica de tercer grado.', is_correct: false}
      - {text: 'Una identidad matemática válida para todo $x$.', is_correct: false}
      - {text: 'Una paradoja matemática sin definición.', is_correct: false}
    explanation: 'La alternativa correcta es ''Una ecuación lineal o de primer grado.''. Al valer $a = 0$, se anula el término $ax^2$ quedando $bx + c = 0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Agrupar y transponer todos los términos algebraicos hacia un solo miembro de la ecuación.'
  - 'Paso 2: Reducir los términos semejantes cuadráticos, lineales e independientes.'
  - 'Paso 3: Ordenar la expresión en forma descendente según las potencias de la incógnita ($ax^2 + bx + c = 0$).'
  - 'Paso 4: Verificar que el mayor exponente de la incógnita sea 2 y que su coeficiente $a \neq 0$.'
errores_correccion: |
  - **Error común:** Clasificar una ecuación como "no cuadrática" cuando no está ordenada, o pensar que $a$ puede valer cero.
  - **Cómo corregirlo:** Transpone y simplifica la ecuación a su forma $ax^2 + bx + c = 0$ antes de verificar si $a \neq 0$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Identificación de ecuaciones cuadráticas.
    alternativas:
      - '$x^2 + 5x + 6 = 0$'
      - '$3x + 4 = 0$'
      - '$x^3 - 2x = 0$'
    respuesta: '$x^2 + 5x + 6 = 0$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Reducción algebraica a forma canónica.
    alternativas:
      - '$2x^2 - 1 = 0$'
      - '$0x^2 + 4x = 2$'
      - '$x^4 - x^2 = 0$'
    respuesta: '$2x^2 - 1 = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La expresión $0x^2 + 4x - 5 = 0$ representa una ecuación de segundo grado porque contiene explícitamente el símbolo $x^2$.'
  - 'Una ecuación cuadrática exige obligatoriamente que sus tres coeficientes $a$, $b$ y $c$ sean números enteros positivos.'
  - 'La ecuación $x^3 - 2x^2 + 1 = 0$ es de segundo grado porque contiene el término $2x^2$.'
  - 'Si el término independiente $c = 0$, la expresión pierde su grado cuadrático y se vuelve lineal.'
  - 'Toda ecuación de segundo grado posee exactamente tres soluciones reales distintas en el conjunto $\mathbb{R}$.'
afirmaciones_verdaderas:
  - 'Una ecuación es de segundo grado si y solo si su grado absoluto respecto a la incógnita es 2, exigiendo que $a \neq 0$.'
  - 'Los coeficientes $b$ y $c$ de una ecuación cuadrática pueden tomar el valor cero sin que la expresión deje de ser de segundo grado.'
al_terminar_debes_poder: |
  QUÉ: Definir y reconocer ecuaciones de segundo grado en forma canónica o desordenada.
  CÓMO: Simplificar expresiones algebraicas a la forma $ax^2 + bx + c = 0$ y verificar que el mayor exponente sea 2 con $a \neq 0$.
fuente: 'Texto escolar MINEDUC — Álgebra / Ecuaciones de Segundo Grado'
estado: publicado
