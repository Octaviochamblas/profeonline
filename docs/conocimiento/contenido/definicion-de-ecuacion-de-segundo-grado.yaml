  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ordena la ecuación de modo que todos los términos queden de un mismo lado,
  igualados a cero.'
- 'Paso 2: Identifica el mayor exponente presente en la incógnita.'
- 'Paso 3: Si ese mayor exponente es 2 (con coeficiente distinto de cero), la ecuación
  es de segundo grado.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en definición de ecuación de segundo grado.
ejemplos:
- titulo: Reconocimiento de una ecuación cuadrática
  enunciado: ¿Es $2x^2+x-6=0$ una ecuación de segundo grado?
  solucion_pasos:
  - El mayor exponente de $x$ presente es 2, con coeficiente $2 \neq 0$.
  - Sí, es una ecuación de segundo grado.
- titulo: Reconocimiento de una ecuación que no es cuadrática
  enunciado: ¿Es $4x+9=0$ una ecuación de segundo grado?
  solucion_pasos:
  - No hay ningún término con $x^2$ en la ecuación.
  - No, es una ecuación de primer grado.
- titulo: ¿Toda ecuación con un término $x^2$ es necesariamente de segundo grado?
  enunciado: ¿Toda ecuación con un término $x^2$ es necesariamente de segundo grado?
  respuesta: 'No'
  solucion_pasos:
  - Solo lo es si el coeficiente de $x^2$ es distinto de cero tras simplificar la
    ecuación.
- titulo: ¿Puede una ecuación de segundo grado tener término lineal igual a cero?
  enunciado: ¿Puede una ecuación de segundo grado tener término lineal igual a cero?
  respuesta: Sí
  solucion_pasos:
  - Basta con que el coeficiente $a$ del término cuadrático sea distinto de cero;
    $b$ puede ser cero.
errores_frecuentes:
- Clasificar como cuadrática una ecuación donde el término $x^2$ se cancela al simplificar
  (quedando coeficiente cero).
- Confundir el grado de la ecuación con la cantidad de términos que tiene.
- No ordenar la ecuación antes de identificar el mayor exponente presente.
- Creer que una ecuación de segundo grado necesariamente tiene los tres términos ($x^2$,
  $x$ y constante).
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando definición
  de ecuación de segundo grado.
