semantic_id: MAT.ALG.EC_CUADR_BASE.DEFINICION
resumen_inicial: Una ecuación de segundo grado (o cuadrática) es una igualdad polinómica
  cuyo mayor exponente en la incógnita es 2.
explicacion_simple: 'Una **ecuación cuadrática** o de segundo grado es una igualdad
  donde la incógnita $x$ aparece elevada al cuadrado ($x^2$) como su potencia máxima.

  - Ejemplo: $3x^2 - 5x + 2 = 0$.

  - Si no hay término con $x^2$, la ecuación pasa a ser de primer grado (lineal).

  - Si hubiera un término con $x^3$, sería de tercer grado (cúbica).'
explicacion_formal: 'Una ecuación polinómica de una variable $x$ se define como una
  **ecuación de segundo grado** si es equivalente a la forma reducida:


  $$P(x) = 0 \quad \text{con } \operatorname{deg}(P) = 2$$


  **Desglose de la fórmula:**

  - Grado polinómico 2: la máxima potencia entera no negativa de la incógnita $x$
  con coeficiente no nulo es $x^2$.'
definiciones_clave: '- **Ecuación cuadrática**: Igualdad algebraica polinómica cuyo
  grado absoluto con respecto a la incógnita es exactamente 2.

  - **Grado de una ecuación**: Máximo exponente al que se encuentra elevada la incógnita
  principal.'
propiedades_relaciones: '- **Número de raíces**: En el campo complejo, una ecuación
  de segundo grado posee siempre exactamente 2 raíces (contando multiplicidad).'
ejemplo_guiado:
  enunciado: Determina si la ecuación $(x + 3)^2 = x^2 + 5x - 4$ es una ecuación de
    segundo grado.
  pasos:
  - 'Paso 1: Desarrollar el cuadrado de binomio en el miembro izquierdo: $x^2 + 6x
    + 9 = x^2 + 5x - 4$.Paso 2: Restar $x^2$ a ambos lados de la igualdad: $6x + 9
    = 5x - 4$.Paso 3: Pasar los términos al miembro izquierdo: $6x - 5x + 9 + 4 =
    0 \implies x + 13 = 0$.Paso 4: Observar que los términos cuadráticos $x^2$ se
    cancelaron completamente y el mayor exponente restante es 1.Paso 5: Concluir que
    la ecuación reducida es lineal, por lo tanto NO es una ecuación de segundo grado.'
checkpoints:
- placement: after_explicacion_formal
  question: Al simplificar la ecuación $(x + 3)^2 = x^2 + 5x - 4$, ¿cuál es la ecuación
    reducida resultante?
  choices:
  - text: $x + 13 = 0$, demostrando que no es una ecuación de segundo grado.
    is_correct: true
  - text: $2x^2 + 11x + 5 = 0$, demostrando que es de segundo grado.
    is_correct: false
  - text: $x^2 + 6x + 9 = 0$
    is_correct: false
  - text: $x^2 - 13 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$x + 13 = 0$, demostrando que no es una
    ecuación de segundo grado.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la característica definitoria que otorga a una ecuación el carácter
    de 'segundo grado'?
  choices:
  - text: Que el mayor exponente de su incógnita sea 2 en su forma reducida.
    is_correct: true
  - text: Que tenga dos términos.
    is_correct: false
  - text: Que todos sus coeficientes sean números pares.
    is_correct: false
  - text: Que esté igualada a 2.
    is_correct: false
  explanation: La alternativa correcta es 'Que el mayor exponente de su incógnita
    sea 2 en su forma reducida.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Desarrollar todos los productos y paréntesis de la ecuación.'
- 'Paso 2: Agrupar y reducir términos semejantes en un solo miembro igualando a cero.'
- 'Paso 3: Identificar el mayor exponente de la variable en la expresión final.'
- 'Paso 4: Si el exponente máximo es 2 con coeficiente distinto de cero, es una ecuación
  cuadrática.'
errores_correccion: '- **Error común:** Declarar que una ecuación es cuadrática solo
  porque aparece un $x^2$ sin antes simplificar la expresión.

  - **Cómo corregirlo:** Se debe simplificar y reducir la ecuación completamente;
  si los términos $x^2$ se anulan entre sí, la ecuación no es cuadrática.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
