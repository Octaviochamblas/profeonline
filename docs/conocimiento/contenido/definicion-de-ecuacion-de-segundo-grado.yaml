semantic_id: MAT.ALG.EC_CUADR_BASE.DEFINICION
resumen_inicial: 'Definición de ecuación de segundo grado: concepto, discriminante,
  soluciones y modelamiento en Conceptos y formas de la ecuación cuadrática.'
explicacion_simple: Cuando la incógnita de una ecuación aparece elevada al cuadrado
  (y ese es su mayor exponente), ya no estamos frente a una ecuación lineal, sino
  frente a una ecuación de segundo grado.
explicacion_formal: '### Definición formal


  Una ecuación de segundo grado en la incógnita $x$ es toda igualdad de la forma $ax^2+bx+c=0$,
  donde $a,b,c \in \mathbb{R}$ y $a \neq 0$. El nombre "segundo grado" proviene de
  que el mayor exponente de $x$ presente en la ecuación es 2.


  ### Desarrollo didáctico


  Para reconocer una ecuación de segundo grado, basta con identificar si, tras ordenar
  todos los términos, aparece un término con $x^2$ con coeficiente distinto de cero.


  $3x^2-5x+2=0$ es una ecuación de segundo grado, porque el mayor exponente de $x$
  es 2 y su coeficiente ($3$) es distinto de cero. En cambio, $5x-7=0$ es de primer
  grado, pues no hay término cuadrático.'
definiciones_clave: '- **Definición de ecuación de segundo grado**: Elemento o técnica
  fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en definición
  de ecuación de segundo grado.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando definición de ecuación
    de segundo grado.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a definición de ecuación
    de segundo grado.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
