semantic_id: MAT.ALG.EC_CUADR_BASE.DEFINICION
resumen_inicial: Una ecuación de segundo grado o cuadrática es una igualdad algebraica condicional donde el mayor exponente de la incógnita es exactamente 2 y su coeficiente principal es no nulo ($a \neq 0$).
explicacion_simple: '![Una ecuación de segundo grado o cuadrática es una igualdad algebraica condicional donde el mayor exponente de la incógnita es exactamente 2 y su coeficiente principal es no nulo ($a \neq 0$)](/static/img/nodos/definicion-de-ecuacion-de-segundo-grado-intro.svg)



  Una **ecuación de segundo grado** (o cuadrática) es una balanza algebraica donde la letra incógnita (usualmente $x$) está elevada al cuadrado ($x^2$), y no hay potencias mayores como $x^3$ o $x^4$:

  - Su forma general es **$ax^2 + bx + c = 0$**.

  - El término con **$x^2$ DEBE existir obligatoriamente ($a \neq 0$)**.

  - Si el número que acompaña a $x^2$ fuera cero ($a = 0$), el término cuadrático desaparece y la ecuación se convierte en una ecuación lineal de primer grado ($bx + c = 0$).'
explicacion_formal: 'Sea $x$ una variable en el cuerpo de los números reales $\mathbb{R}$. Una **ecuación polinómica de segundo grado con una incógnita** es cualquier igualdad condicional que adopta o puede ser transformada mediante operaciones algebraicas válidas a la forma canónica:

  $$ax^2 + bx + c = 0 \quad \text{donde } a, b, c \in \mathbb{R} \quad \text{y } a \neq 0$$


  **Estructura de los términos polinómicos:**

  - $ax^2$: Término cuadrático o de segundo grado ($a$ es el coeficiente principal).

  - $bx$: Término lineal o de primer grado ($b$ es el coeficiente lineal).

  - $c$: Término independiente o de grado cero ($c$ es la constante libre).


  Por el Teorema Fundamental del Álgebra, toda ecuación cuadrática posee a lo sumo dos soluciones en el conjunto de los números reales $\mathbb{R}$.'
definiciones_clave: '- **Ecuación de segundo grado**: Igualdad polinómica cuyo grado absoluto respecto a la incógnita es 2.

  - **Coeficiente principal $a$**: Número real no nulo que multiplica a la incógnita elevada al cuadrado.'
propiedades_relaciones: '- **Grado invariante**: El grado de la ecuación no depende de la cantidad de términos sino del exponente máximo de la variable.

  - **Teorema de existencia de soluciones**: Admite dos soluciones reales distintas, una solución real doble o ninguna solución real (soluciones complejas conjugadas).'
ejemplo_guiado:
  enunciado: '![Ejemplo Una ecuación de segundo grado o cuadrática es una igualdad algebraica condicional donde el mayor exponente de la incógnita es exactamente 2 y su coeficiente principal es no nulo ($a \neq 0$)](/static/img/nodos/definicion-de-ecuacion-de-segundo-grado-ejemplos.svg)



    Determina si la ecuación $4x^2 + 7 = 2x^2 - 3x + 1$ es de segundo grado reduciéndola a su forma canónica.'
  pasos:
  - 'Paso 1: Transponer todos los términos al miembro izquierdo: $(4x^2 - 2x^2) + 3x + (7 - 1) = 0$.'
  - 'Paso 2: Reducir términos semejantes: $2x^2 + 3x + 6 = 0$.'
  - 'Paso 3: Identificar el exponente mayor de la variable: el exponente es 2.'
  - 'Paso 4: Identificar el coeficiente cuadrático: $a = 2 \neq 0$.'
  - 'Paso 5: Concluir que es una ecuación de segundo grado formal.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental indispensable para que la expresión $ax^2 + bx + c = 0$ sea una ecuación de segundo grado?
  choices:
  - text: El coeficiente cuadratico a debe ser distinto de cero (a != 0).
    is_correct: true
  - text: El termino independiente c debe ser positivo.
    is_correct: false
  - text: El coeficiente lineal b debe ser igual a 1.
    is_correct: false
  - text: La variable x debe tomar solo valores enteros.
    is_correct: false
  explanation: La alternativa correcta es 'El coeficiente cuadratico a debe ser distinto de cero (a != 0).'. Si $a = 0$ se elimina el término cuadrático.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en la ecuación $ax^2 + bx + c = 0$ se cumple que $a = 0$ y $b \neq 0$, ¿qué tipo de ecuación resulta?
  choices:
  - text: Una ecuacion lineal o de primer grado.
    is_correct: true
  - text: Una ecuacion cubica de tercer grado.
    is_correct: false
  - text: Una identidad matematica valida para todo x.
    is_correct: false
  - text: Una ecuacion cuadratica incompleta.
    is_correct: false
  explanation: La alternativa correcta es 'Una ecuacion lineal o de primer grado.'. Al valer $a = 0$, se anula el término $ax^2$ quedando $bx + c = 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Agrupar y transponer todos los términos algebraicos hacia un solo miembro de la ecuación.'
- 'Paso 2: Reducir los términos semejantes cuadráticos, lineales e independientes.'
- 'Paso 3: Ordenar la expresión en forma descendente según las potencias de la incógnita ($ax^2 + bx + c = 0$).'
- 'Paso 4: Verificar que el mayor exponente de la incógnita sea 2 y que su coeficiente $a \neq 0$.'
errores_correccion: '- **Error común:** Clasificar una ecuación como "no cuadrática" antes de simplificarla o pensar que $0x^2 + 4x = 0$ es cuadrática.

  - **Cómo corregirlo:** Transpone y simplifica la ecuación a su forma $ax^2 + bx + c = 0$ antes de verificar si $a \neq 0$.'
ejemplos:
- titulo: 'Ejemplo 1: Reconocimiento directo'
  enunciado: ¿Cuál de las siguientes igualdades es una ecuación de segundo grado?
  alternativas:
  - 5x^2 - 3x + 1 = 0
  - 3x + 7 = 0
  - x^3 - 2x^2 + 4 = 0
  - 0x^2 + 6x - 2 = 0
  respuesta: 5x^2 - 3x + 1 = 0
  solucion_pasos:
  - 'Paso 1: $5x^2 - 3x + 1 = 0$ tiene grado 2 y $a = 5 \neq 0$.'
- titulo: 'Ejemplo 2: Cancelación de término cuadrático'
  enunciado: Al reducir $x^2 + 4x - 5 = x^2 + 2$, ¿qué grado tiene la ecuación resultante?
  alternativas:
  - 'Grado 1 (Lineal: 4x - 7 = 0)'
  - Grado 2 (Cuadrática)
  - Grado 0
  - Grado 4
  respuesta: 'Grado 1 (Lineal: 4x - 7 = 0)'
  solucion_pasos:
  - 'Paso 1: Al restar $x^2$ en ambos lados se cancela el término cuadrático, quedando $4x - 7 = 0$.'
- titulo: 'Ejemplo 3: Producto que genera grado cuadrático'
  enunciado: ¿Qué tipo de ecuación es $(x - 3)(x + 2) = 0$?
  alternativas:
  - Ecuación cuadrática o de segundo grado
  - Ecuación lineal de primer grado
  - Ecuación racional
  - Ecuación constante
  respuesta: Ecuación cuadrática o de segundo grado
  solucion_pasos:
  - 'Paso 1: Desarrollando: $x^2 - x - 6 = 0$, que es de segundo grado con $a = 1$.'
- titulo: 'Ejemplo 4: Ecuación con incógnita en denominador'
  enunciado: La igualdad $\frac{x^2 - 4}{x - 2} = 0$ con $x \neq 2$, ¿es una ecuación cuadrática?
  alternativas:
  - No, es una ecuación racional que al simplificar resulta lineal x + 2 = 0
  - Sí, porque tiene x^2 en el numerador
  - Es una ecuación cúbica
  - No tiene solución
  respuesta: No, es una ecuación racional que al simplificar resulta lineal x + 2 = 0
  solucion_pasos:
  - 'Paso 1: $\frac{(x-2)(x+2)}{x-2} = x + 2 = 0$ (grado 1).'
errores_frecuentes:
- Creer que la presencia del símbolo x^2 garantiza grado 2 sin verificar que a != 0.
- Confundir ecuaciones cúbicas que contienen términos cuadráticos con ecuaciones de segundo grado.
- Olvidar que los coeficientes b y c sí pueden ser iguales a cero.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si y solo si su grado polinómico respecto a la incógnita es 2 con a != 0.
- Toda ecuación cuadrática real posee a lo sumo dos soluciones reales.
al_terminar_debes_poder: '**QUÉ:** Definir y reconocer ecuaciones de segundo grado en forma canónica o desordenada.


  **CÓMO:** Simplificando expresiones a la forma ax² + bx + c = 0 y verificando que el coeficiente cuadrático sea no nulo (a ≠ 0).


