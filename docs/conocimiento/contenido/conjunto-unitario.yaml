semantic_id: MAT.FUND.CONJUNTOS_BASICOS.CONJUNTO_UNITARIO
resumen_inicial: Definición, características y propiedades de los conjuntos unitarios (*singleton*) como aquellos que poseen exactamente un elemento.
explicacion_simple: '![Infografía: Conjunto unitario o singulete y su cardinalidad](/static/img/nodos/conjunto-unitario-intro.svg)


  Un **conjunto unitario** (o *singleton*) es cualquier conjunto que tiene **exactamente un solo elemento** (su tamaño o cardinalidad es uno: $|A| = 1$). Por ejemplo, el conjunto de los números primos pares es **$\{2\}$** (porque el 2 es el único primo par), y el conjunto que contiene la solución de la ecuación $2x = 8$ es **$\{4\}$**. Es muy importante recordar que el conjunto unitario **$\{x\}$ NO es lo mismo que el elemento $x$ solo**.

  '
explicacion_formal: '### Definición formal

  En la teoría de conjuntos, un conjunto $A$ es un **conjunto unitario (o *singleton*)** si y solo si su cardinalidad es exactamente igual a 1:

  $$|A| = 1 \quad \iff \quad \exists x \, (A = \{x\})$$

  En la lógica de predicados de primer orden con igualdad, la condición de unitariedad para un conjunto definido por comprensión $A = \{t \in \mathcal{U} \mid P(t)\}$ se expresa como existencia y unicidad:

  $$\exists x \in \mathcal{U} \, (P(x) \land \forall y \in \mathcal{U} \, (P(y) \to y = x))$$


  ### Desglose simbólico

  - Estructura general: $S = \{a\}$.

  - Cardinalidad: $|S| = 1$.

  - Subconjuntos de un conjunto unitario: $\mathcal{P}(\{a\}) = \{\emptyset, \{a\}\}$ ($2^1 = 2$ subconjuntos).


  > **Complemento didáctico:** El conjunto unitario es el bloque atómico elemental no vacío de la teoría de conjuntos, permitiendo empaquetar un objeto individual bajo la estructura formal de conjunto.

  '
definiciones_clave: '- **Conjunto unitario (*singleton*)**: Conjunto constituido por un único elemento ($|A| = 1$).

  - **Cuantificador de unicidad ($\exists!$)**: Operador que afirma la existencia de exactamente un elemento que satisface una condición.

  - **Empaquetamiento conjuntista**: Operación conceptual de asignar llaves a un objeto ($x \mapsto \{x\}$).

  '
propiedades_relaciones: '- **Construcción de Von Neumann para los ordinales**: El número natural $1$ se define axiomáticamente como el conjunto unitario que contiene al vacío: $1 = \{\emptyset\}$.

  - **Conjunto potencia**: El conjunto potencia de cualquier unitario siempre contiene exactamente dos subconjuntos: el vacío y el propio conjunto unitario.

  '
ejemplo_guiado:
  enunciado: '![Diagrama: Primalidad par y subconjuntos de un singulete](/static/img/nodos/conjunto-unitario-ejemplos.svg)


    Demuestra que el conjunto $U = \{x \in \mathbb{R} \mid x^2 - 6x + 9 = 0\}$ es un conjunto unitario y determina su único elemento.'
  pasos:
  - 'Paso 1: Analizar la ecuación cuadrática del predicado: $x^2 - 6x + 9 = 0$.'
  - 'Paso 2: Factorizar como un trinomio cuadrado perfecto: $(x - 3)^2 = 0$.'
  - 'Paso 3: Resolver para $x$: $x - 3 = 0 \implies x = 3$ (raíz real doble única).'
  - 'Paso 4: Escribir el conjunto por extensión: $U = \{3\}$.'
  - 'Paso 5: Contar sus elementos: Al tener una única solución real ($|U| = 1$), se concluye formalmente que $U$ es un conjunto unitario.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la cardinalidad exacta de cualquier conjunto unitario?
  choices:
  - text: Exactamente $1$
    is_correct: true
  - text: $0$
    is_correct: false
  - text: $2$
    is_correct: false
  - text: Infinito
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente $1$'. Un conjunto unitario posee un único elemento por definición.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál de los siguientes conjuntos es un conjunto unitario?
  choices:
  - text: $\{\emptyset\}$
    is_correct: true
  - text: $\emptyset$
    is_correct: false
  - text: $\{1, 2\}$
    is_correct: false
  - text: $\{x \in \mathbb{R} \mid x^2 = 4\}$
    is_correct: false
  explanation: La alternativa correcta es '$\{\emptyset\}$'. Contiene exactamente un elemento (el conjunto vacío), teniendo cardinalidad 1.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver la condición o ecuación definitoria del conjunto.'
- 'Paso 2: Contar el número de soluciones o elementos distintos que pertenecen al dominio.'
- 'Paso 3: Si se obtiene exactamente un elemento $a$, escribir el conjunto en la forma $\{a\}$.'
- 'Paso 4: Declarar que el conjunto es unitario y que su cardinalidad es $1$.'
errores_correccion: '- **Error 1:** Creer que $\{\emptyset\}$ es el conjunto vacío. **Cómo corregirlo:** $\{\emptyset\}$ es un conjunto unitario (tiene un elemento adentro: el vacío). El conjunto vacío es $\emptyset$ sin llaves adicionales.

  - **Error 2:** Creer que $\{5, 5, 5\}$ tiene 3 elementos. **Cómo corregirlo:** Los elementos repetidos colapsan en una sola instancia: $\{5, 5, 5\} = \{5\}$, siendo formalmente un conjunto unitario.

  '
ejemplos:
- titulo: Único primo par
  enunciado: ¿Es $\{x \in \mathbb{P} \mid x \text{ es par}\}$ un conjunto unitario?
  alternativas:
  - Sí, es $\{2\}$
  - No, es vacío
  - No, tiene infinitos elementos
  respuesta: Sí, es $\{2\}$
  solucion_pasos:
  - 1. El único primo par es el 2.
  - 2. El conjunto es $\{2\}$, de cardinalidad 1.
- titulo: Conjunto con elementos repetidos
  enunciado: ¿Cuál es la cardinalidad de $\{a, a, a\}$?
  respuesta: $2$
  solucion_pasos:
  - Colapsa a $\{a\}$, por lo que es un conjunto unitario.
  alternativas:
  - $2$
  - $0$
  - $1$
  - $4$
- titulo: Subconjuntos de un unitario
  enunciado: ¿Cuántos subconjuntos tiene el conjunto $\{9\}$?
  respuesta: $2$ subconjuntos ($\emptyset$ y $\{9\}$)
  solucion_pasos:
  - $|\mathcal{P}(\{9\})| = 2^1 = 2$.
  alternativas:
  - $2$ subconjuntos ($\emptyset$ y $\{9\}$)
  - $1$ subconjunto
  - $3$ subconjuntos
  - $4$ subconjuntos
- titulo: Distinción de tipo
  enunciado: ¿Es idéntico el elemento $x$ al conjunto unitario $\{x\}$?
  respuesta: $1$
  solucion_pasos:
  - No, $x$ es un elemento y $\{x\}$ es un conjunto que contiene a $x$.
  alternativas:
  - $1$
  - $0$
  - $2$
  - No tiene elementos
errores_frecuentes:
- La afirmación de que el conjunto $\{\emptyset\}$ carece de elementos y es idéntico a $\emptyset$.
- La afirmación de que un conjunto con elementos repetidos como $\{4, 4\}$ tiene cardinalidad dos.
- La afirmación de que un conjunto unitario tiene un solo subconjunto.
- La afirmación de que el número $0$ es idéntico al conjunto unitario $\{0\}$.
- La afirmación de que una ecuación con dos soluciones distintas define un conjunto unitario.
afirmaciones_verdaderas:
- Un conjunto unitario es aquel que contiene exactamente un único elemento y posee cardinalidad igual a $1$ ($|A| = 1$).
- El conjunto $\{\emptyset\}$ es un conjunto unitario cuyo único elemento miembro es el conjunto vacío.
al_terminar_debes_poder: 'QUÉ: Definir, identificar y caracterizar conjuntos unitarios (*singletons*).

  CÓMO: Verificar que la cardinalidad sea exactamente $1$ y distinguir el conjunto unitario $\{x\}$ del elemento $x$ y del vacío $\emptyset$.


  ![Cuadro resumen: Singulete, potencia e identidad de elementos](/static/img/nodos/conjunto-unitario-resumen.svg)

  '
