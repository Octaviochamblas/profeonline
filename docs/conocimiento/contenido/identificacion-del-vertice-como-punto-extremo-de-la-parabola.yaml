semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.VERTICE_CONCEPTO
resumen_inicial: El vértice de la parábola es el punto extremo $(x_v, y_v)$ donde la función cuadrática alcanza su valor máximo o mínimo global.
explicacion_simple: |
  El **vértice** es el punto más importante de la parábola:

  - Es el **punto de inflexión o giro** de la curva.
  - Si la parábola se abre hacia arriba ($a > 0$), el vértice es su punto más bajo (**mínimo**).
  - Si la parábola se abre hacia abajo ($a < 0$), el vértice es su punto más alto (**máximo**).
  - Se representa como un par ordenado de coordenadas **$V(h, k)$** o **$V(x_v, y_v)$**.
  - **Dato clave**: Por el vértice pasa exactamente la línea vertical que divide a la parábola en dos partes idénticas (el eje de simetría).
explicacion_formal: |
  Sea la función cuadrática $f(x) = ax^2 + bx + c$. El **vértice $V \in \mathbb{R}^2$** es el único punto crítico donde la derivada de la función se anula:

  $$f'(x_v) = 2a x_v + b = 0 \iff x_v = -\frac{b}{2a}$$

  **Propiedades globales del vértice:**
  - Si $a > 0 \implies f(x) \ge f(x_v), \forall x \in \mathbb{R}$, constituyendo un mínimo absoluto.
  - Si $a < 0 \implies f(x) \le f(x_v), \forall x \in \mathbb{R}$, constituyendo un máximo absoluto.
  - Las coordenadas del vértice se expresan como $V\left(-\frac{b}{2a}, f\left(-\frac{b}{2a}\right)\right)$.
definiciones_clave: |
  - **Vértice de la parábola**: Punto extremo $(x_v, y_v)$ del plano cartesiano donde la parábola alcanza su máximo o mínimo y cambia de monotonía.
propiedades_relaciones: |
  - **Punto de simetría axial**: Cualquier par de puntos $(x_1, y)$ y $(x_2, y)$ con la misma ordenada satisfacen $x_v = \frac{x_1 + x_2}{2}$.
ejemplo_guiado:
  enunciado: 'Identifica el papel que cumple el vértice $V(2, -5)$ en la función cuadrática cóncava hacia arriba $f(x) = x^2 - 4x - 1$.'
  pasos:
    - 'Paso 1: Identificar las coordenadas del vértice: $x_v = 2$ y $y_v = -5$.'
    - 'Paso 2: Evaluar la concavidad: como $a = 1 > 0$, la parábola se abre hacia arriba.'
    - 'Paso 3: Concluir el rol del vértice: al abrirse hacia arriba, $V(2, -5)$ es el punto mínimo absoluto de la curva.'
    - 'Paso 4: Declarar que la menor altura que alcanza la función es $y = -5$ en $x = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad define geométricamente al vértice de cualquier parábola de función cuadrática?'
    choices:
      - {text: 'Es el punto extremo donde la curva cambia de dirección y alcanza su máximo o mínimo global', is_correct: true}
      - {text: 'Es el punto exacto donde la curva siempre cruza al eje Y.', is_correct: false}
      - {text: 'Es la primera raíz donde la función se anula.', is_correct: false}
      - {text: 'Es un punto aislado fuera de la curva de la parábola.', is_correct: false}
    explanation: 'La alternativa correcta es ''Es el punto extremo donde la curva cambia de dirección y alcanza su máximo o mínimo global''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si una parábola cóncava hacia abajo posee su vértice en $V(-1, 8)$, ¿cuál es el valor máximo de la función?'
    choices:
      - {text: 'El valor máximo es $y = 8$', is_correct: true}
      - {text: 'El valor máximo es $x = -1$.', is_correct: false}
      - {text: 'El valor máximo es $y = -1$.', is_correct: false}
      - {text: 'No es posible determinar el valor máximo.', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor máximo es $y = 8$''. La coordenada vertical del vértice $y_v$ representa el valor extremo.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reconocer el rol del vértice como el punto de giro de la parábola.'
  - 'Paso 2: Identificar la concavidad de la función a través del signo de $a$.'
  - 'Paso 3: Declarar el vértice como un mínimo global si $a > 0$ o como un máximo global si $a < 0$.'
  - 'Paso 4: Asociar la coordenada horizontal $x_v$ con el eje de simetría y la coordenada vertical $y_v$ con el valor extremo.'
errores_correccion: |
  - **Error común:** Confundir la coordenada horizontal de entrada $x_v$ con el valor máximo o mínimo de la función $y_v$.
  - **Cómo corregirlo:** La posición ocurre en **$x = x_v$**; el valor del máximo o mínimo es la **ALTURA $y = y_v$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Vértice como mínimo.
    alternativas:
      - 'Mínimo global en V(3, 2)'
      - 'Máximo global en V(3, 2)'
      - 'Punto de corte en X'
    respuesta: 'Mínimo global en V(3, 2)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Vértice como máximo.
    alternativas:
      - 'Máximo global en V(-2, 10)'
      - 'Mínimo global en V(-2, 10)'
      - 'Origen de coordenadas'
    respuesta: 'Máximo global en V(-2, 10)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = x^2 - 4$, es correcto afirmar que su vértice es el punto de corte con el eje X.'
  - 'La gráfica de una función cuadrática cóncava hacia abajo alcanza un valor mínimo global en su vértice.'
  - 'La equivalencia errónea entre las componentes del punto $V(h, k)$ asignando $h$ como la altura extrema de la función.'
  - 'La suposición de que el vértice debe ser siempre un punto de coordenadas positivas.'
  - 'La creencia de que si $b = 0$, la parábola no tiene vértice en el plano cartesiano.'
afirmaciones_verdaderas:
  - 'El vértice $V(x_v, y_v)$ es el único punto del plano cartesiano donde la parábola alcanza su máximo o mínimo valor de salida.'
  - 'La abscisa del vértice $x_v = -b/(2a)$ marca el punto de cambio entre el intervalo donde la función es creciente y decreciente.'
al_terminar_debes_poder: |
  QUÉ: Identificar y definir el vértice como el punto extremo máximo o mínimo de una parábola.
  CÓMO: Reconocer $V(x_v, y_v)$, determinar si es máximo o mínimo según el signo de $a$ y separarlo del eje de simetría.
