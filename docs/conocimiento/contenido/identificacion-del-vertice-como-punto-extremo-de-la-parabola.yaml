semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.VERTICE_CONCEPTO
resumen_inicial: El vértice $V(x_v, y_v)$ es el punto singular más importante de la parábola, correspondiendo al extremo global absoluto donde la función cuadrática alcanza su valor mínimo ($a > 0$) o máximo ($a < 0$) y cambia su monotonía.
explicacion_simple: "![El vértice $V(x_v, y_v)$ es el punto singular más importante de la parábola, correspondiendo al extremo global absoluto donde la función cuadrática alcanza su valor mínimo ($a > 0$) o máximo ($a < 0$) y cambia su monotonía](/static/img/nodos/identificacion-del-vertice-como-punto-extremo-de-la-parabola-intro.svg)\n\n\nEl **vértice** es el \"corazón\" o la punta de la parábola:\n\n- **¿Qué pasa en el vértice?** Es el punto exacto donde la curva **da la vuelta**:\n  - Si la parábola venía cayendo, toca el vértice (el fondo) y **empieza a subir** (punto **mínimo**).\n  - Si venía subiendo, llega al vértice (la cima) y **empieza a caer** (punto **máximo**).\n- **Sus dos coordenadas:**\n  - **$x_v$ (la abscisa):** te dice **DÓNDE o CUÁNDO** se alcanza la cima o el fondo.\n  - **$y_v$ (la ordenada):** te dice **CUÁNTO MIDE** esa altura máxima o ese costo mínimo."
explicacion_formal: "Sea $f: \\mathbb{R} \\to \\mathbb{R}$ con $f(x) = ax^2 + bx + c$ ($a \\neq 0$). El **vértice** $V(x_v, y_v) \\in \\mathbb{R}^2$ es el único punto crítico estacionario del espacio funcional:\n$$f'(x_v) = 2ax_v + b = 0 \\Longleftrightarrow x_v = -\\frac{b}{2a}$$\n\n**Propiedades analíticas del vértice**:\n1. **Extremalidad global estricta**:\n   - Si $a > 0 \\implies y_v = \\min_{x \\in \\mathbb{R}} f(x)$ ($f(x) \\ge y_v, \\; \\forall x$).\n   - Si $a < 0 \\implies y_v = \\max_{x \\in \\mathbb{R}} f(x)$ ($f(x) \\le y_v, \\; \\forall x$).\n2. **Punto de cambio de monotonía**: En $x_v$, la derivada $f'(x)$ cambia de signo unívocamente."
definiciones_clave: '- **Punto crítico / Vértice**: Punto $(x_v, y_v)$ donde la recta tangente es horizontal ($m = 0$).

  - **Extremo absoluto**: Cota superior o inferior inalcanzable por fuera del vértice en todo el dominio $\mathbb{R}$.'
propiedades_relaciones: '- **Pertenencia al eje de simetría**: El vértice pertenece a la recta vertical $x = x_v$.

  - **Forma canónica de vértice**: $f(x) = a(x - x_v)^2 + y_v$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El vértice $V(x_v, y_v)$ es el punto singular más importante de la parábola, correspondiendo al extremo global absoluto donde la función cuadrática alcanza su valor mínimo ($a > 0$) o máximo ($a < 0$) y cambia su monotonía](/static/img/nodos/identificacion-del-vertice-como-punto-extremo-de-la-parabola-ejemplos.svg)



    Dada la función $f(x) = (x - 3)^2 + 4$, identifica las coordenadas del vértice, justifica si es un punto máximo o mínimo y determina dónde cambia de monotonía.'
  pasos:
  - 'Paso 1: La función está en forma canónica de vértice $a(x - h)^2 + k$ con $a = 1, h = 3, k = 4$.

    - Coordenadas del vértice: $V(3, 4)$.'
  - 'Paso 2: Como $a = 1 > 0$ (positivo), la parábola abre hacia arriba ($\cup$), por lo que $V(3, 4)$ es un **punto mínimo absoluto**.'
  - 'Paso 3: Cambio de monotonía:

    - La función es estrictamente decreciente en $]-\infty, 3]$.

    - Alcanza su valor mínimo $y = 4$ en $x = 3$.

    - Es estrictamente creciente en $[3, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué propiedad diferencial fundamental se cumple en el vértice de cualquier parábola?
  choices:
  - text: La recta tangente es horizontal con pendiente m = 0 (f'(x_v) = 0).
    is_correct: true
  - text: La función se vuelve discontinua.
    is_correct: false
  - text: El discriminante se hace igual a cero.
    is_correct: false
  - text: La recta tangente es vertical.
    is_correct: false
  explanation: La alternativa correcta es 'La recta tangente es horizontal con pendiente m = 0 (f'(x_v) = 0).'. En el vértice la curva alcanza su extremo suave y la pendiente instantánea es cero.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola tiene vértice en (-2, 7) y abre hacia abajo, ¿cuál es el valor máximo que puede tomar la función?
  choices:
  - text: y = 7 (alcanzado en x = -2)
    is_correct: true
  - text: y = -2
    is_correct: false
  - text: y = +∞
    is_correct: false
  - text: y = 0
    is_correct: false
  explanation: La alternativa correcta es 'y = 7 (alcanzado en x = -2)'. La ordenada $y_v = 7$ representa la cota superior absoluta de la función.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la función en forma canónica o general.'
- 'Paso 2: Identificar las coordenadas del vértice $V(x_v, y_v)$.'
- 'Paso 3: Analizar el signo de $a$ para clasificar el vértice como mínimo ($a > 0$) o máximo ($a < 0$).'
- 'Paso 4: Indicar los intervalos de crecimiento y decrecimiento a partir de $x_v$.'
errores_correccion: '- **Error común:** Confundir la posición donde ocurre el extremo ($x_v$) con el valor del extremo ($y_v$).

  - **Cómo corregirlo:** La **pregunta "¿cuándo/dónde?" se responde con $x_v$**, y la **pregunta "¿cuánto?" se responde con $y_v$**.'
ejemplos:
- titulo: 'Ejemplo 1: Vértice en forma canónica directa'
  enunciado: En $f(x) = 2(x + 5)^2 - 8$, ¿cuál es el vértice y su tipo?
  alternativas:
  - V(-5, -8), punto mínimo
  - V(5, -8), punto máximo
  - V(-5, 8), punto mínimo
  - V(5, 8), punto máximo
  respuesta: V(-5, -8), punto mínimo
  solucion_pasos:
  - 'Paso 1: $h = -5, k = -8, a = 2 > 0 \implies V(-5, -8)$ mínimo.'
- titulo: 'Ejemplo 2: Vértice de campana invertida'
  enunciado: Para $g(x) = -(x - 1)^2 + 6$, ¿cuál es el valor extremo?
  alternativas:
  - Valor máximo y = 6 en x = 1
  - Valor mínimo y = 6 en x = 1
  - Valor máximo y = 1 en x = 6
  - Valor mínimo y = -6
  respuesta: Valor máximo y = 6 en x = 1
  solucion_pasos:
  - 'Paso 1: $a = -1 < 0 \implies$ máximo absoluto en $y = 6$ cuando $x = 1$.'
- titulo: 'Ejemplo 3: Cambio de monotonía'
  enunciado: Si $f(x) = x^2 - 6x + 5$ tiene vértice en $x = 3$, ¿dónde es creciente?
  alternativas:
  - '[3, +inf['
  - ']-inf, 3]'
  - '[5, +inf['
  - En todo R
  respuesta: '[3, +inf['
  solucion_pasos:
  - 'Paso 1: Como $a > 0$, la parábola baja hasta $x = 3$ y sube en $[3, +\infty[$.'
- titulo: 'Ejemplo 4: Vértice en el origen'
  enunciado: ¿Qué tipo de vértice tiene la función $h(x) = 4x^2$?
  alternativas:
  - V(0, 0), mínimo absoluto
  - V(0, 0), máximo absoluto
  - V(4, 0), mínimo
  - No tiene vértice
  respuesta: V(0, 0), mínimo absoluto
  solucion_pasos:
  - 'Paso 1: $V(0, 0)$ con $a = 4 > 0 \implies$ mínimo en el origen.'
errores_frecuentes:
- Confundir las coordenadas x e y del vértice.
- Asumir que un vértice con coordenadas negativas es siempre un mínimo.
- Olvidar cambiar el signo de h al leer la forma canónica a(x - h)² + k.
afirmaciones_verdaderas:
- El vértice es el único punto donde la función cuadrática alcanza su extremo global absoluto.
- En el vértice se produce el cambio de sentido de crecimiento de la parábola.
al_terminar_debes_poder: '**QUÉ:** Identificar y caracterizar el vértice como punto extremo de una parábola.


  **CÓMO:** Determinando sus coordenadas (x_v, y_v), su naturaleza (máximo o mínimo) y los intervalos de monotonía asociados.


