semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.VERTICE_CONCEPTO
resumen_inicial: 'Identificación del vértice como punto extremo de la parábola: parábola,
  vértice, concavidad y formas de El vértice, el eje de simetría y el recorrido.'
explicacion_simple: Entre todos los puntos de una parábola, hay uno especial que marca
  el punto de "quiebre" entre su tramo decreciente y su tramo creciente (o viceversa).
explicacion_formal: '### Definición formal


  El vértice de la gráfica de $f(x)=ax^2+bx+c$ es el punto donde la función alcanza
  su valor extremo (mínimo si $a>0$, máximo si $a<0$). Es el único punto de la parábola
  donde la curva cambia de decreciente a creciente, o de creciente a decreciente.


  ### Desarrollo didáctico


  Visualmente, el vértice es fácil de identificar en cualquier gráfica: es el punto
  donde la curva "toca fondo" (si abre hacia arriba) o "toca techo" (si abre hacia
  abajo).


  En la parábola de $f(x)=x^2-4x+3$, el vértice es el punto más bajo de la curva,
  ubicado en $(2,-1)$, donde la función deja de decrecer y comienza a crecer.'
definiciones_clave: '- **Identificación del vértice como punto extremo de la parábola**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  identificación del vértice como punto extremo de la parábola.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando identificación
    del vértice como punto extremo de la parábola.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a identificación
    del vértice como punto extremo de la parábola.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
