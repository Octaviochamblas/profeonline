procedimiento:
- 'Paso 1: Observa la gráfica (o los datos) de la función cuadrática.'
- 'Paso 2: Identifica el punto donde la curva cambia de dirección (de decreciente
  a creciente, o viceversa).'
- 'Paso 3: Ese punto es el vértice de la parábola.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en identificación del vértice como punto extremo
  de la parábola.
ejemplos:
- titulo: Identificación del vértice como mínimo
  enunciado: ¿Qué tipo de punto extremo tiene la parábola de $f(x)=x^2-6x+5$, que
    abre hacia arriba?
  solucion_pasos:
  - Al abrir hacia arriba, la parábola tiene un punto más bajo.
  - Su vértice es un mínimo.
- titulo: Identificación del vértice como máximo
  enunciado: ¿Qué tipo de punto extremo tiene la parábola de $f(x)=-2x^2+8x$, que
    abre hacia abajo?
  solucion_pasos:
  - Al abrir hacia abajo, la parábola tiene un punto más alto.
  - Su vértice es un máximo.
- titulo: ¿Toda parábola tiene exactamente un vértice?
  enunciado: ¿Toda parábola tiene exactamente un vértice?
  respuesta: Sí
  solucion_pasos:
  - Es el único punto extremo de la curva, sin importar la orientación de la parábola.
- titulo: ¿El vértice puede estar en cualquier tramo, no solo en el punto más extremo?
  enunciado: ¿El vértice puede estar en cualquier tramo, no solo en el punto más extremo?
  respuesta: 'No'
  solucion_pasos:
  - Por definición, el vértice es exclusivamente el punto extremo (máximo o mínimo)
    de la parábola.
errores_frecuentes:
- Confundir el vértice con cualquier otro punto de la gráfica que no sea el extremo.
- Asumir que toda parábola tiene un mínimo, sin considerar el caso en que abre hacia
  abajo (máximo).
- Confundir el concepto de vértice con el de intersección con el eje $y$.
- No relacionar el vértice con el cambio de dirección (de decreciente a creciente
  o viceversa) de la función.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  identificación del vértice como punto extremo de la parábola.
