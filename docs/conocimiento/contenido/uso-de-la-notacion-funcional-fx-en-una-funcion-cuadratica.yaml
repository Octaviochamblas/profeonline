semantic_id: MAT.ALG.FUNC_CUADR_BASE.NOTACION_FUNCIONAL
resumen_inicial: El uso de la notación funcional $f(x)$ en una función cuadrática representa la regla de correspondencia que asigna a cada preimagen real $x$ una imagen única $y = f(x) = ax^2 + bx + c$, generando pares ordenados $(x, f(x))$ sobre la parábola.
explicacion_simple: "![El uso de la notación funcional $f(x)$ en una función cuadrática representa la regla de correspondencia que asigna a cada preimagen real $x$ una imagen única $y = f(x) = ax^2 + bx + c$, generando pares ordenados $(x, f(x))$ sobre la parábola](/static/img/nodos/uso-de-la-notacion-funcional-fx-en-una-funcion-cuadratica-intro.svg)\n\n\nLa notación **$f(x)$** se lee *\"f de x\"* y es el nombre de la salida (la coordenada $y$):\n- **$x$ es la entrada (preimagen):** el número que tú eliges.\n- **$f(x)$ es la salida (imagen):** el resultado de hacer la cuenta.\n- *Ejemplo:* Si $f(x) = 2x^2 - 3x + 1$ y quieres calcular $f(4)$:\n  $$f(4) = 2(4)^2 - 3(4) + 1 = 2(16) - 12 + 1 = 32 - 12 + 1 = 21$$\n- Esto significa que cuando $x = 4$, la $y = 21$, formando el punto **$(4, 21)$** en la parábola."
explicacion_formal: "Sea $f: \\mathbb{R} \\to \\mathbb{R}$ la función cuadrática $f(x) = ax^2 + bx + c$. La **evaluación funcional paramétrica** en un punto $x_0 \\in \\mathbb{R}$ define el valor escalar:\n$$f(x_0) = a(x_0)^2 + b(x_0) + c$$\n\n**Propiedades de la evaluación funcional**:\n1. **Unicidad de la imagen**: Por definición de función, $\\forall x_0 \\in \\mathbb{R}, \\exists ! y_0 \\in \\mathbb{R}$ tal que $y_0 = f(x_0)$.\n2. **Evaluación de expresiones compuestas**: Para una expresión algebraica $g(t)$:\n   $$f(g(t)) = a[g(t)]^2 + b[g(t)] + c$$\n3. **Identificación de preimágenes**: Resolver $f(x) = k$ equivale a hallar las raíces de la ecuación cuadrática $ax^2 + bx + (c - k) = 0$."
definiciones_clave: '- **Notación funcional $f(x)$**: Simbolismo que explicita la dependencia de la variable $y$ respecto a la variable independiente $x$.

  - **Evaluación funcional**: Sustitución sistemática de $x$ por un valor numérico o algebraico.'
propiedades_relaciones: '- **Puntos simétricos**: Si dos preimágenes $x_1, x_2$ equidistan del eje de simetría ($x_1 + x_2 = 2x_v$), entonces tienen exactamente la misma imagen: $f(x_1) = f(x_2)$.

  - **Jerarquía de operaciones**: Primero se calcula la potencia $(x_0)^2$, luego los productos y finalmente las adiciones.'
ejemplo_guiado:
  enunciado: '![Ejemplo El uso de la notación funcional $f(x)$ en una función cuadrática representa la regla de correspondencia que asigna a cada preimagen real $x$ una imagen única $y = f(x) = ax^2 + bx + c$, generando pares ordenados $(x, f(x))$ sobre la parábola](/static/img/nodos/uso-de-la-notacion-funcional-fx-en-una-funcion-cuadratica-ejemplos.svg)



    Dada la función cuadrática $f(x) = -2x^2 + 6x - 1$, calcula:

    1) La imagen de $x = -3$ ($f(-3)$)

    2) Las preimágenes de $y = 3$ ($f(x) = 3$)'
  pasos:
  - 'Paso 1: Evaluar $f(-3)$ usando paréntesis protectores:

    $f(-3) = -2(-3)^2 + 6(-3) - 1 = -2(9) - 18 - 1 = -18 - 18 - 1 = -37$.

    - El punto en la gráfica es $(-3, -37)$.'
  - 'Paso 2: Hallar preimágenes de $3$ resolviendo $f(x) = 3$:

    $-2x^2 + 6x - 1 = 3 \implies -2x^2 + 6x - 4 = 0$.

    - Dividir por $-2$: $x^2 - 3x + 2 = 0$.

    - Factorizar: $(x - 1)(x - 2) = 0 \implies x_1 = 1, \; x_2 = 2$.

    - Interpretación: La función alcanza la altura $y = 3$ en dos preimágenes: $x = 1$ y $x = 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: Dada la función $f(x) = 3x^2 - 2x + 4$, ¿cuál es el valor de f(-2)?
  choices:
  - text: '20'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '-12'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: La alternativa correcta es '20'. $f(-2) = 3(-2)^2 - 2(-2) + 4 = 3(4) + 4 + 4 = 12 + 4 + 4 = 20$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa el par ordenado (a, f(a)) en el plano cartesiano?
  choices:
  - text: Un punto que pertenece exactamente a la gráfica de la parábola.
    is_correct: true
  - text: El vértice de la parábola.
    is_correct: false
  - text: El punto de corte con el eje X.
    is_correct: false
  - text: La pendiente de la recta tangente.
    is_correct: false
  explanation: La alternativa correcta es 'Un punto que pertenece exactamente a la gráfica de la parábola.'. Cada par $(a, f(a))$ es un punto de la curva.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión de correspondencia $f(x) = ax^2 + bx + c$.'
- 'Paso 2: Para calcular una imagen $f(k)$, sustituir cada aparición de $x$ por $(k)$.'
- 'Paso 3: Resolver la potencia $(k)^2$ respetando la ley de signos.'
- 'Paso 4: Multiplicar por los coeficientes $a$ y $b$, y sumar la constante $c$.'
- 'Paso 5: Registrar la coordenada $(k, f(k))$.'
errores_correccion: '- **Error común:** Calcular $-2^2$ en vez de $(-2)^2$ al evaluar $f(-2)$ en $x^2$.

  - **Cómo corregirlo:** La base completa se eleva al cuadrado: **$(-2)^2 = +4$**.'
ejemplos:
- titulo: 'Ejemplo 1: Evaluación en cero'
  enunciado: En $f(x) = 5x^2 - 7x + 9$, ¿cuánto vale f(0)?
  alternativas:
  - '9'
  - '0'
  - '-7'
  - '5'
  respuesta: '9'
  solucion_pasos:
  - 'Paso 1: $f(0) = 5(0)^2 - 7(0) + 9 = 9$.'
- titulo: 'Ejemplo 2: Evaluación con coeficiente principal negativo'
  enunciado: Si $g(x) = -x^2 + 4x$, ¿cuánto vale g(3)?
  alternativas:
  - '3'
  - '21'
  - '-3'
  - '-21'
  respuesta: '3'
  solucion_pasos:
  - 'Paso 1: $g(3) = -(3)^2 + 4(3) = -9 + 12 = 3$.'
- titulo: 'Ejemplo 3: Preimagen conocida'
  enunciado: Si $f(x) = x^2 - 5$, ¿qué valores de x satisfacen $f(x) = 11$?
  alternativas:
  - x = 4 y x = -4
  - Solo x = 4
  - x = 16
  - x = 6
  respuesta: x = 4 y x = -4
  solucion_pasos:
  - 'Paso 1: $x^2 - 5 = 11 \implies x^2 = 16 \implies x = \pm 4$.'
- titulo: 'Ejemplo 4: Evaluación de binomio'
  enunciado: Para $f(x) = x^2 + 1$, ¿a qué equivale f(x + 1)?
  alternativas:
  - x^2 + 2x + 2
  - x^2 + 2
  - x^2 + x + 2
  - x^2 + 1
  respuesta: x^2 + 2x + 2
  solucion_pasos:
  - 'Paso 1: $f(x + 1) = (x + 1)^2 + 1 = x^2 + 2x + 1 + 1 = x^2 + 2x + 2$.'
errores_frecuentes:
- Elevar números negativos al cuadrado obteniendo resultados negativos.
- Confundir la preimagen x con la imagen f(x).
- Multiplicar por a antes de elevar al cuadrado (violar el orden de operaciones PEMDAS).
afirmaciones_verdaderas:
- Evaluar f(k) equivale a calcular la ordenada del punto (k, f(k)) en la parábola.
- El valor f(0) coincide exactamente con el término independiente c.
al_terminar_debes_poder: '**QUÉ:** Utilizar con soltura la notación funcional f(x) para evaluar funciones cuadráticas.


  **CÓMO:** Sustituyendo valores numéricos y algebraicos en f(x) = ax² + bx + c y respetando el orden de operaciones.


