semantic_id: MAT.ALG.FUNC_CUADR_BASE.NOTACION_FUNCIONAL
resumen_inicial: 'La notación funcional $f(x)$ asigna una regla cuadrática a cada valor de entrada $x$, donde $f(k)$ representa la imagen numérica obtenida al sustituir $x$ por $k$.'
explicacion_simple: |
  El símbolo $f(x)$ denota el valor de salida de la función para un número de entrada $x$. Al evaluar una función cuadrática para un valor concreto $k$, reemplazamos cada variable $x$ en la fórmula por $k$, utilizando paréntesis para asegurar que la elevación al cuadrado afecte correctamente a los números negativos y a los coeficientes que los multiplican.
explicacion_formal: |
  ### Definición formal
  Dada la función cuadrática $f(x) = ax^2 + bx + c$, la **evaluación funcional** en un valor $x = k$ se define mediante la sustitución directa:
  $$f(k) = a(k)^2 + b(k) + c$$
  El resultado $f(k)$ es la **imagen** del elemento $k$ (preimagen) bajo la función $f$.

  ### Desglose simbólico
  - $f$: Nombre de la función o regla de correspondencia.
  - $x$: Variable de entrada o argumento.
  - $f(x)$: Expresión simbólica de la salida o variable dependiente $y$.
  - $f(k)$: Valor numérico final obtenido al procesar $k$ en la fórmula cuadrática.

  ### Síntesis didáctica
  La notación $f(x)$ no denota multiplicación entre $f$ y $x$. Funciona como una máquina donde $k$ entra en $x$, y la máquina ejecuta la secuencia operacional de potencia, multiplicaciones y sumas para devolver $f(k)$.
definiciones_clave: |
  - **Notación funcional $f(x)$**: Simbología matemática que nombra la relación de asignación entre cada preimagen $x$ y su imagen $y = f(x)$.
  - **Evaluación funcional $f(k)$**: Proceso de calcular el valor numérico de la función sustituyendo la variable $x$ por un valor fijo $k$.
  - **Paréntesis de protección**: Uso de $(k)$ en la sustitución para garantizar que la jerarquía de operaciones y la ley de los signos se apliquen correctamente.
propiedades_relaciones: |
  - **Asignación única**: Cada entrada $k$ del dominio posee una única imagen $f(k)$.
  - **Efecto de la potencia par**: Dado que $(k)^2 = (-k)^2$, las preimágenes simétricas alrededor del eje de simetría producen la misma imagen $f(h + d) = f(h - d)$.
ejemplo_guiado:
  enunciado: 'Dada la función cuadrática $f(x) = -2x^2 + 4x + 1$, calcula de forma paso a paso los valores de $f(3)$ y $f(-2)$.'
  pasos:
    - 'Paso 1: Para $f(3)$, sustituimos $x = 3$ utilizando paréntesis: $f(3) = -2(3)^2 + 4(3) + 1$.'
    - 'Paso 2: Resolvemos la potencia $3^2 = 9$ y luego las multiplicaciones: $f(3) = -2(9) + 12 + 1 = -18 + 12 + 1 = -5$.'
    - 'Paso 3: Para $f(-2)$, sustituimos $x = -2$: $f(-2) = -2(-2)^2 + 4(-2) + 1 = -2(4) - 8 + 1 = -8 - 8 + 1 = -15$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si $f(x) = x^2 - 6x + 5$, ¿cuál es el significado correcto de la notación $f(0)$?'
    choices:
      - {text: 'El valor de salida de la función cuando la entrada es $x = 0$, resultando $f(0) = 5$', is_correct: true}
      - {text: 'La multiplicación de la expresión por cero, resultando $f(0) = 0$', is_correct: false}
      - {text: 'El valor de la constante $a$ de la función', is_correct: false}
      - {text: 'La pendiente de la recta en el origen', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor de salida de la función cuando la entrada es $x = 0$, resultando $f(0) = 5$''. Al evaluar $f(0) = 0^2 - 6(0) + 5 = 5$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para la función cuadrática $h(x) = -x^2 + 3$, ¿cuál es el valor numérico de $h(-4)$?'
    choices:
      - {text: '$-13$', is_correct: true}
      - {text: '$19$', is_correct: false}
      - {text: '$-19$', is_correct: false}
      - {text: '$13$', is_correct: false}
    explanation: 'La alternativa correcta es ''$-13$''. Calculamos $h(-4) = -(-4)^2 + 3 = -(16) + 3 = -13$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la estructura funcional $f(x) = ax^2 + bx + c$ de manera clara.'
  - 'Paso 2: Reemplazar cada instancia de la variable $x$ por el valor $k$ escrito entre paréntesis: $f(k) = a(k)^2 + b(k) + c$.'
  - 'Paso 3: Calcular primero la potencia $(k)^2$, luego efectuar los productos por los coeficientes $a$ y $b$, y finalmente sumar/restar el término independiente $c$.'
errores_correccion: |
  - **Error 1:** Escribir $-3^2 = 9$ al evaluar $f(x) = -x^2$ en $x = 3$. **Cómo corregirlo:** La expresión $-x^2$ significa $-(x^2)$. Para $x = 3$, resulta $-(3)^2 = -9$.
  - **Error 2:** Multiplicar el coeficiente antes de elevar al cuadrado en $a(k)^2$. **Cómo corregirlo:** La jerarquía de operaciones exige resolver primero las potencias y luego los productos: en $2(5)^2$, primero se calcula $5^2 = 25$ y luego $2 \cdot 25 = 50$.
ejemplos:
  - titulo: 'Evaluación con término lineal y constante'
    enunciado: 'Si $f(x) = 2x^2 - x + 4$, ¿cuál es el valor de $f(-1)$?'
    alternativas:
      - '$7$'
      - '$5$'
      - '$3$'
    respuesta: '$7$'
    solucion_pasos:
      - '1. Sustituimos $x = -1$ en la función: $f(-1) = 2(-1)^2 - (-1) + 4$.'
      - '2. Calculamos la potencia $(-1)^2 = 1$: $f(-1) = 2(1) + 1 + 4 = 2 + 1 + 4 = 7$.'
  - titulo: 'Comparación de imágenes simétricas'
    enunciado: 'Para $f(x) = (x - 2)^2 + 1$, ¿cuál es la relación entre $f(1)$ y $f(3)$?'
    alternativas:
      - '$f(1) = 2$ y $f(3) = 2$, por lo que son iguales'
      - '$f(1) = 1$ y $f(3) = 9$, por lo que son distintos'
      - '$f(1) = 0$ y $f(3) = 4$, por lo que son inversos'
    respuesta: '$f(1) = 2$ y $f(3) = 2$, por lo que son iguales'
    solucion_pasos:
      - '1. $f(1) = (1 - 2)^2 + 1 = (-1)^2 + 1 = 1 + 1 = 2$.'
      - '2. $f(3) = (3 - 2)^2 + 1 = (1)^2 + 1 = 1 + 1 = 2$.'
      - '3. Ambas preimágenes equidistan del eje de simetría $x = 2$, obteniendo $f(1) = f(3) = 2$.'
  - titulo: 'Notación de producto vs notación de función'
    enunciado: 'En la notación $f(x) = x^2$, ¿el lado izquierdo representa el producto algebraico de la variable $f$ por la variable $x$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. El símbolo $f(x)$ denota la evaluación de la función $f$ en el argumento $x$, no un producto de dos factores.'
  - titulo: 'Uso de paréntesis en sustituciones negativas'
    enunciado: 'Al evaluar $f(x) = 3x^2$ en $x = -2$, ¿es correcto escribir $f(-2) = 3(-2)^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Los paréntesis aíslan la base negativa $-2$, asegurando que $(-2)^2 = 4$ y resultando $3 \cdot 4 = 12$.'
errores_frecuentes:
  - 'El símbolo $f(x)$ equivale matemáticamente al producto algebraico $f \cdot x$.'
  - 'En la expresión $-x^2$, al sustituir $x = 4$ el resultado numérico es $+16$.'
  - 'En la evaluación $3(2)^2$, la operación correcta consiste en multiplicar $3 \cdot 2 = 6$ y luego elevar al cuadrado obteniendo $36$.'
  - 'La expresión $f(a + b)$ en una función cuadrática equivale a la suma $f(a) + f(b)$.'
  - 'Al evaluar $f(-x)$ en una función cuadrática se obtiene siempre el opuesto aditivo $-f(x)$.'
afirmaciones_verdaderas:
  - 'El valor $f(0)$ en una función cuadrática $f(x) = ax^2 + bx + c$ coincide siempre con el término independiente $c$.'
  - 'La notación $y = f(x)$ indica que $y$ es la variable dependiente cuyo valor se calcula a través de la regla aplicada a $x$.'
al_terminar_debes_poder: 'Evaluar cualquier función cuadrática para entradas numéricas reales o algebraicas aplicando correctamente la jerarquía de operaciones y los signos.'
