semantic_id: MAT.ALG.FUNC_CUADR_BASE.NOTACION_FUNCIONAL
resumen_inicial: El uso de la notación funcional $f(x)$ relaciona la variable independiente de entrada $x$ con la variable dependiente de salida $y = f(x)$.
explicacion_simple: |
  La **notación funcional $f(x)$** (se lee *"f de x"*) es una manera limpia y precisa de nombrar el resultado de aplicar una fórmula:

  - La letra $y$ es exactamente lo mismo que $f(x)$:
    $$y = f(x) = ax^2 + bx + c$$
  - Si tienes $f(x) = x^2 - 3x$, escribir $f(4)$ significa:
    *"Remplaza la letra $x$ por el número $4$ en toda la fórmula"*:
    $$f(4) = (4)^2 - 3(4) = 16 - 12 = 4$$
  - Esto forma el par ordenado de coordenadas **$(x, y) = (4, 4)$** para graficar en el plano.
explicacion_formal: |
  Sea la regla de correspondencia $f: D \subseteq \mathbb{R} \to \mathbb{R}$. La **notación funcional $y = f(x)$** define el par ordenado del grafo de la función en $\mathbb{R}^2$:

  $$G(f) = \{(x, y) \in \mathbb{R}^2 \mid y = f(x) = ax^2 + bx + c\}$$

  **Operador de sustitución funcional:**
  - $x \in \mathbb{R}$: Variable independiente de entrada (abscisa).
  - $f(x) \in \mathbb{R}$: Variable dependiente de salida (ordenada o imagen de $x$).
  - $f(g(x))$: Composición o evaluación con expresiones algebraicas compuestas.
definiciones_clave: |
  - **Notación funcional ($f(x)$)**: Simbología matemática que asigna la imagen única de salida $y$ correspondiente a una preimagen de entrada $x$.
propiedades_relaciones: |
  - **Unicidad de imagen por test de la recta vertical**: Como $f(x)$ es una función bien definida, cualquier recta vertical $x = x_0$ corta a la gráfica de la parábola en un único punto $(x_0, f(x_0))$.
ejemplo_guiado:
  enunciado: 'Si $f(x) = 2x^2 - x + 3$, calcula el valor de $f(a + 1)$ evaluando la expresión compuesta.'
  pasos:
    - 'Paso 1: Reemplazar cada ocurrencia de $x$ por $(a + 1)$ entre paréntesis: $f(a + 1) = 2(a + 1)^2 - (a + 1) + 3$.'
    - 'Paso 2: Desarrollar el cuadrado del binomio: $(a + 1)^2 = a^2 + 2a + 1$.'
    - 'Paso 3: Distribuir coeficientes: $2(a^2 + 2a + 1) - a - 1 + 3 = 2a^2 + 4a + 2 - a + 2$.'
    - 'Paso 4: Reducir términos semejantes: $f(a + 1) = 2a^2 + 3a + 4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué par ordenado de coordenadas $(x, y)$ se genera en la gráfica si al evaluar $f(3)$ en una función cuadrática se obtiene $f(3) = 7$?'
    choices:
      - {text: 'El par ordenado $(3, 7)$', is_correct: true}
      - {text: 'El par ordenado $(7, 3)$.', is_correct: false}
      - {text: 'El par ordenado $(3, 3)$.', is_correct: false}
      - {text: 'El par ordenado $(0, 7)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El par ordenado $(3, 7)$''. La entrada es $x = 3$ y la salida $y = f(3) = 7$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Dada $f(x) = x^2 + 2x$, ¿cuál es el resultado simplificado de $f(-x)$?'
    choices:
      - {text: '$f(-x) = x^2 - 2x$', is_correct: true}
      - {text: '$f(-x) = -x^2 - 2x$', is_correct: false}
      - {text: '$f(-x) = -x^2 + 2x$', is_correct: false}
      - {text: '$f(-x) = x^2 + 2x$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(-x) = x^2 - 2x$''. Sustituyendo $f(-x) = (-x)^2 + 2(-x) = x^2 - 2x$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la expresión de la regla funcional $f(x)$.'
  - 'Paso 2: Colocar paréntesis en cada posición donde aparece la variable independiente $x$.'
  - 'Paso 3: Insertar el número o expresión dada dentro de los paréntesis.'
  - 'Paso 4: Desarrollar potencias, multiplicaciones y reducciones algebraicas para entregar la imagen o expresión final.'
errores_correccion: |
  - **Error común:** Evaluar $f(-2)$ como $-2^2$ obteniendo $-4$ en lugar de $(-2)^2 = +4$.
  - **Cómo corregirlo:** Pon **SIEMPRE PARENTESIS AL SUSTITUIR** el valor de entrada $x$; todo número negativo al cuadrado resulta **POSITIVO**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Evaluación funcional de constantes.
    alternativas:
      - '$f(-1) = 8$'
      - '$f(-1) = 2$'
      - '$f(-1) = 4$'
    respuesta: '$f(-1) = 8$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Evaluación con expresión binomia.
    alternativas:
      - '$f(k) = k^2 - 4k + 5$'
      - '$f(k) = k^2 + 5$'
      - '$f(k) = -4k + 5$'
    respuesta: '$f(k) = k^2 - 4k + 5$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La suposición de que el símbolo funcional $f(x)$ es una variable algebraica multiplicada $f \cdot x$.'
  - 'El intercambio de las componentes del punto cartesiano escribiendo $(f(x), x)$ en lugar de $(x, f(x))$.'
  - 'La falta de sustitución de la variable de entrada $x$ en todos los términos donde figura dentro de la función.'
  - 'La equiparación de la evaluación de la imagen $f(x_0)$ con el cálculo de los ceros de la función $f(x) = 0$.'
  - 'La aplicación de potencias sobre números negativos sin utilizar paréntesis calculando $-3^2 = -9$ en lugar de $(-3)^2 = 9$.'
afirmaciones_verdaderas:
  - 'La notación $y = f(x)$ indica que $y$ es la imagen única de salida producida al evaluar la preimagen $x$ en la función cuadrática.'
  - 'Evaluar $f(x_0)$ genera el punto ordenado $(x_0, f(x_0))$ que pertenece a la curva de la parábola en el plano cartesiano.'
al_terminar_debes_poder: |
  QUÉ: Aplicar la notación funcional $f(x)$ para calcular imágenes simples y compuestas en funciones cuadráticas.
  CÓMO: Reemplazar $x$ entre paréntesis por valores o expresiones, calcular el resultado y asociar el punto $(x, f(x))$.
fuente: 'Texto escolar MINEDUC — Álgebra / Función Cuadrática'
