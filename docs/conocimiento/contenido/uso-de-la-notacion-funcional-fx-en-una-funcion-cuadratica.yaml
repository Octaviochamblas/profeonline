semantic_id: MAT.ALG.FUNC_CUADR_BASE.NOTACION_FUNCIONAL
resumen_inicial: 'Uso de la notación funcional f(x) en una función cuadrática: parábola,
  vértice, concavidad y formas de Definición y elementos básicos.'
explicacion_simple: 'La notación $f(x)$ para una función cuadrática funciona exactamente
  igual que para cualquier otra función: nombra el valor que la función produce al
  recibir a $x$ como entrada.'
explicacion_formal: '### Definición formal


  Dada $f(x)=ax^2+bx+c$, la notación $f(k)$ denota el valor $a k^2+bk+c$, obtenido
  al sustituir cada aparición de $x$ por el número $k$. El símbolo $f(x)$ no representa
  "$f$ multiplicado por $x$", sino el nombre completo del valor de salida.


  ### Desarrollo didáctico


  Al evaluar $f(k)$, conviene sustituir con paréntesis en cada lugar donde aparecía
  $x$, para preservar correctamente los signos y exponentes durante el cálculo.


  Si $f(x)=2x^2-3x+1$, entonces $f(2)=2(2)^2-3(2)+1=8-6+1=3$.'
definiciones_clave: '- **Uso de la notación funcional f(x) en una función cuadrática**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  uso de la notación funcional f(x) en una función cuadrática.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando uso de la notación
    funcional f(x) en una función cuadrática.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a uso
    de la notación funcional f(x) en una función cuadrática.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
