procedimiento:
- 'Paso 1: Identifica la regla completa de la función cuadrática $f(x)=ax^2+bx+c$.'
- 'Paso 2: Sustituye cada aparición de $x$ por el valor solicitado, usando paréntesis.'
- 'Paso 3: Calcula el resultado siguiendo el orden de las operaciones.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en uso de la notación funcional f(x) en una función
  cuadrática.
ejemplos:
- titulo: Evaluación en un valor positivo
  enunciado: Si $f(x)=x^2-4x+3$, calcula $f(5)$.
  solucion_pasos:
  - $f(5)=(5)^2-4(5)+3=25-20+3$.
  - $f(5)=8$.
- titulo: Evaluación en un valor negativo
  enunciado: Si $f(x)=-2x^2+x-1$, calcula $f(-3)$.
  solucion_pasos:
  - $f(-3)=-2(-3)^2+(-3)-1=-2(9)-3-1$.
  - $f(-3)=-22$.
- titulo: ¿$f(x)$ significa $f$ multiplicado por $x$?
  enunciado: ¿$f(x)$ significa $f$ multiplicado por $x$?
  respuesta: 'No'
  solucion_pasos:
  - Es el nombre completo del valor que la función $f$ produce al evaluar en $x$,
    no una multiplicación.
- titulo: ¿Es necesario usar paréntesis al sustituir un valor negativo en la regla
    de la función?
  enunciado: ¿Es necesario usar paréntesis al sustituir un valor negativo en la regla
    de la función?
  respuesta: Sí
  solucion_pasos:
  - Los paréntesis preservan el signo del valor sustituido durante las operaciones
    de potenciación y multiplicación.
errores_frecuentes:
- Omitir elevar al cuadrado el valor completo (incluyendo el signo) al sustituir un
  número negativo.
- Interpretar $f(x)$ como una multiplicación en vez de como notación de evaluación.
- Cometer errores en el orden de las operaciones al calcular $f(k)$.
- No sustituir $x$ en todos los términos de la regla, dejando alguno sin evaluar.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  uso de la notación funcional f(x) en una función cuadrática.
