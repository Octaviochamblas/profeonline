procedimiento:
- 'Paso 1: En general, en educación media no se exige memorizar el desarrollo puro,
  pero sí saber cómo construirlo multiplicando $(a+b+c)^2 \\\\\\cdot (a+b+c)$ o reconocer
  identidades.'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en concepto de cubo de trinomio.
ejemplos:
- titulo: Problema avanzado
  enunciado: Si $a+b+c=0$, entonces ¿a qué es igual $a^3+b^3+c^3$?
  solucion_pasos:
  - Usamos la identidad de Gauss o la expansión del cubo.
  - Se deduce que $a^3+b^3+c^3 = 3abc$.
- titulo: Si sumamos $a^3 + b^3 + c^3$ y sabemos que $(a+b+c) = 0$, la identidad de
    Gauss para cubos n
  enunciado: 'Si sumamos $a^3 + b^3 + c^3$ y sabemos que $(a+b+c) = 0$, la identidad
    de Gauss para cubos nos dice que esa suma es igual a:


    Opciones: A) $3abc$ · B) $0$ · C) $(abc)^3$ · D) $-3abc$'
  solucion_pasos:
  - 'Propiedad conocida de olimpiadas: si $a+b+c=0$, $a^3+b^3+c^3 = 3abc$.'
  - 'Respuesta: $3abc$'
- titulo: 'Respecto de «Concepto de cubo de trinomio»: ¿La siguiente formulación es
    correcta? «La expan'
  enunciado: 'Respecto de «Concepto de cubo de trinomio»: ¿La siguiente formulación
    es correcta? «La expansión de $(a+b+c)^3$ genera 27 términos antes de agrupar»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La expansión de $(a+b+c)^3$
    genera 27 términos antes de agrupar.'
- titulo: 'Respecto de «Concepto de cubo de trinomio»: ¿La siguiente conclusión es
    correcta? «Creer que'
  enunciado: 'Respecto de «Concepto de cubo de trinomio»: ¿La siguiente conclusión
    es correcta? «Creer que es $a^3+b^3+c^3$ solamente»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La expansión de $(a+b+c)^3$
    genera 27 términos antes de agrupar.'
errores_frecuentes:
- Creer que es $a^3+b^3+c^3$ solamente.
- Para «Si sumamos $a^3 + b^3 + c^3$ y sabemos que $(a+b+c) = 0$, la identidad de
  Gauss para cubos nos dice que esa suma es igual a:», la respuesta correcta es $0$.
- Para «Si sumamos $a^3 + b^3 + c^3$ y sabemos que $(a+b+c) = 0$, la identidad de
  Gauss para cubos nos dice que esa suma es igual a:», la respuesta correcta es $(abc)^3$.
- $-3abc$.
- La afirmación «$3abc$» no es válida en este contenido.
