semantic_id: MAT.ALG.FACTOR_CUADRADOS.RECONOCIMIENTO_TRINOMIO_CUADRADO
resumen_inicial: 'El reconocimiento del trinomio cuadrado perfecto consiste en comprobar que un trinomio de tres términos posea dos cuadrados perfectos positivos en los extremos y que el término central coincida exactamente con el doble producto de sus raíces.'
explicacion_simple: |
  Para saber si un polinomio de 3 términos es un **Trinomio Cuadrado Perfecto (TCP)** (ej: $x^2 + 6x + 9$):
  - **3 PRUEBAS DE VERIFICACIÓN DE UN TCP**:
    1. **Dos términos extremos que son Cuadrados Perfectos Positivos**:
       - $1.er \text{ término}: x^2 \implies \text{Raíz } A = \sqrt{x^2} = \mathbf{x}$.
       - $3.er \text{ término}: 9 \implies \text{Raíz } B = \sqrt{9} = \mathbf{3}$.
    2. **Prueba del Doble Producto Central**:
       - Multiplica las dos raíces y duplícalas: $2 \cdot A \cdot B = 2 \cdot x \cdot 3 = \mathbf{6x}$.
    3. **Coincidencia con el Término Central**:
       - ¡Compara $6x$ con el término central de la expresión original ($6x$)!
       - Como coinciden exactamente, ¡confirmas que **SÍ es un Trinomio Cuadrado Perfecto**!
explicacion_formal: |
  ### Definición formal
  Sea la función polinómica trinomial $T(x) = c_1 x^{2\alpha} + c_2 x^\alpha y^\beta + c_3 y^{2\beta} \in \mathbb{R}[x, y]$. Se define formalmente como un **Trinomio Cuadrado Perfecto (TCP)** si y sólo si satisface la condición del discriminante monomial nulo $\Delta = 0$ y la identidad de coeficientes:

  1. **Positividad y cuadraticidad de los extremos**:
     $$c_1 > 0 \land c_3 > 0 \quad \text{con } \sqrt{c_1}, \sqrt{c_3} \in \mathbb{Q}^+$$
  2. **Ecuación del término central (Doble Producto)**:
     $$c_2 = \pm 2 \sqrt{c_1 c_3}$$

  lo cual reescribe el trinomio en la forma canónica $A^2 \pm 2AB + B^2$.

  ### Síntesis didáctica
  Un trinomio es un cuadrado perfecto si el término central es idéntico a multiplicar por 2 las raíces cuadradas de los dos extremos.
definiciones_clave: |
  - **Trinomio Cuadrado Perfecto (TCP)**: Polinomio de 3 términos de la forma $A^2 \pm 2AB + B^2$ que resulta de elevar al cuadrado un binomio.
  - **Prueba del doble producto**: Comprobación obligatoria $2 \cdot A \cdot B$ para verificar la presencia del término central.
  - **Raíces extremas ($A, B$)**: Valores $\sqrt{A^2}$ y $\sqrt{B^2}$ extraídos de los términos cuadráticos positivos.
propiedades_relaciones: |
  - **Relación con el cuadrado de binomio**: Todo TCP es el producto expandido de $(A+B)^2$ o $(A-B)^2$.
ejemplo_guiado:
  enunciado: 'Verifica si el trinomio $4x^2 - 20x + 25$ cumple las condiciones para ser un Trinomio Cuadrado Perfecto.'
  pasos:
    - 'Paso 1: Identificamos los dos términos extremos cuadráticos:
       - Extremo 1: $4x^2 \implies A = \sqrt{4x^2} = \mathbf{2x}$.
       - Extremo 2: $25 \implies B = \sqrt{25} = \mathbf{5}$.'
    - 'Paso 2: Calculamos el doble producto de las raíces $A$ y $B$:
       $2 \cdot A \cdot B = 2 \cdot (2x) \cdot (5) = \mathbf{20x}$.'
    - 'Paso 3: Comparamos el doble producto calculado ($20x$) con la magnitud del término central del polinomio ($-20x$).'
    - 'Paso 4: Verificamos que la magnitud $20x$ coincide exactamente con el término central.'
    - 'Conclusión: El trinomio **sí es un Trinomio Cuadrado Perfecto**, equivalente a $(2x - 5)^2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué el trinomio $x^2 + 10x + 16$ NO es un Trinomio Cuadrado Perfecto a pesar de tener extremos cuadráticos $x^2$ y $16$?'
    choices:
      - {text: 'Porque las raíces de los extremos son $A=x$ y $B=4$, cuyo doble producto es $2 \cdot x \cdot 4 = 8x$, el cual NO coincide con el término central $10x$', is_correct: true}
      - {text: 'Porque 16 no tiene raíz cuadrada', is_correct: false}
      - {text: 'Porque los tres términos son positivos', is_correct: false}
      - {text: 'Sí es un Trinomio Cuadrado Perfecto', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque las raíces de los extremos son $A=x$ y $B=4$, cuyo doble producto es $2 \cdot x \cdot 4 = 8x$, el cual NO coincide con el término central $10x$''. Fallo en la prueba del doble producto $2AB \neq 10x$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el trinomio $9a^2 + 12ab + 4b^2$, ¿cuál es el valor del doble producto que confirma que se trata de un TCP?'
    choices:
      - {text: 'Es $12ab$, calculado como $2 \cdot (3a) \cdot (2b) = 12ab$', is_correct: true}
      - {text: 'Es $6ab$', is_correct: false}
      - {text: 'Es $36ab$', is_correct: false}
      - {text: 'Es $24ab$', is_correct: false}
    explanation: 'La alternativa correcta es ''Es $12ab$, calculado como $2 \cdot (3a) \cdot (2b) = 12ab$''. $2 \cdot \sqrt{9a^2} \cdot \sqrt{4b^2} = 2 \cdot 3a \cdot 2b = 12ab$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Reordenar el trinomio si es necesario de forma que los dos términos cuadráticos queden en los extremos.'
  - 'Paso 2: Extraer la raíz cuadrada del primer término extremo ($A$) y del último ($B$).'
  - 'Paso 3: Multiplicar $2 \cdot A \cdot B$ para obtener el doble producto teórico.'
  - 'Paso 4: Comparar el valor calculado con el término central del polinomio original para confirmar el TCP.'
errores_correccion: |
  - **Error 1:** Declarar que cualquier trinomio con dos extremos cuadráticos es un TCP sin verificar el término central. **Cómo corregirlo:** Se debe **REALIZAR SIEMPRE LA PRUEBA DEL DOBLE PRODUCTO ($2 \cdot A \cdot B$) PARA CONFIRMAR LA COINCIDENCIA CON EL TÉRMINO CENTRAL**.
  - **Error 2:** Tratar de evaluar un trinomio cuyo último término es negativo como un TCP (evaluar $x^2 + 6x - 9$). **Cómo corregirlo:** Los dos términos extremos cuadráticos **DEBEN SER ESTRICTAMENTE POSITIVOS PARA TENER RAÍZ REAL**.
ejemplos:
  - titulo: 'Extremos cuadráticos'
    enunciado: 'Para $x^2 + 14x + 49$, ¿son $A = x$ y $B = 7$ las raíces cuadradas de los extremos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\sqrt{x^2}=x$ y $\sqrt{49}=7$.'
  - titulo: 'Doble producto en TCP'
    enunciado: '¿Coincide $2 \cdot x \cdot 7 = 14x$ con el término central de $x^2 + 14x + 49$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $2 \cdot x \cdot 7 = 14x$.'
  - titulo: 'Término extremo negativo'
    enunciado: 'En $x^2 + 4x - 4$, ¿impide el signo negativo en $-4$ que la expresión sea un TCP?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, los extremos deben ser positivos.'
  - titulo: 'TCP con coeficientes'
    enunciado: 'Para $25m^2 - 30m + 9$, ¿es el doble producto $2 \cdot (5m) \cdot (3) = 30m$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $2 \cdot 5m \cdot 3 = 30m$.'
errores_frecuentes:
  - 'Dar por sentado que un trinomio es cuadrado perfecto sin calcular el doble producto de las raíces.'
  - 'Aceptar términos extremos negativos al intentar identificar la estructura de un TCP.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intercambiar el producto $A \cdot B$ con el doble producto $2 \cdot A \cdot B$.'
  - 'No reordenar los términos del trinomio antes de extraer las raíces cuadradas.'
afirmaciones_verdaderas:
  - 'Un Trinomio Cuadrado Perfecto exige que el término central coincida con el doble producto de las raíces extremas.'
  - 'Los dos términos cuadráticos extremos del trinomio deben ser números o monomios con signo positivo.'
al_terminar_debes_poder: 'Reconocer si un trinomio es un Trinomio Cuadrado Perfecto ejecutando la prueba del doble producto $2AB$.'
