    is_correct: false
  explanation: La alternativa correcta es 'El término central debe ser igual al doble
    producto de las raíces de los extremos ($2AB$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el trinomio $4x^2 - 20x + 25$, ¿cuál es el valor del doble producto
    $2AB$ calculando $A = 2x$ y $B = 5$?
  choices:
