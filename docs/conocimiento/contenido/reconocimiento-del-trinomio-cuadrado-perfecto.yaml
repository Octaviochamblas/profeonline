semantic_id: MAT.ALG.FACTOR_CUADRADOS.RECONOCIMIENTO_TRINOMIO_CUADRADO
resumen_inicial: 'Reconocimiento del trinomio cuadrado perfecto: concepto, método
  de descomposición y reglas en Factorización asociada a cuadrados.'
explicacion_simple: 'Hay un espejismo en el desierto del álgebra que confunde a muchos
  estudiantes: ven un $x^2 + 25$ y su instinto les grita que escriban $(x+5)(x+5)$.
  Sin embargo, al multiplicarlo de vuelta. aparece un intruso. La suma de cuadrados
  es una bóveda que no se puede abrir con los números reales.'
explicacion_formal: '### Definición formal


  Porque al expandirlo se genera un término central $+8x$.


  ### Desarrollo didáctico


  Intentemos factorizar falsamente $x^2 + 9$.


  Si crees que es $(x+3)(x+3)$, al expandirlo usando la propiedad distributiva obtienes:
  $x^2 + 3x + 3x + 9 = x^2 + 6x + 9$.

  Apareció un $+6x$ de la nada. Por tanto, $(x+3)^2$ NO es igual a $x^2 + 9$.


  ¿Y si pruebas $(x-3)(x-3)$? Obtienes $x^2 - 6x + 9$.

  ¿Y si pruebas $(x+3)(x-3)$? Esa es una suma por diferencia, que da $x^2 - 9$ (y
  nosotros queríamos $+9$.).


  Conclusión: No existe forma en el conjunto de los Números Reales de que dos binomios
  al multiplicarse cancelen el término del medio y dejen el último positivo. Por ello,
  decimos que $a^2 + b^2$ es "prima" o **no factorizable en los Reales**. (Solo se
  puede factorizar usando números Complejos Imaginarios, lo cual está fuera del temario
  PAES).'
definiciones_clave: '- **Reconocimiento del trinomio cuadrado perfecto**: Técnica
  de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en reconocimiento del trinomio cuadrado perfecto.'
ejemplo_guiado:
  enunciado: Factoriza la expresión algebraica aplicando los criterios de reconocimiento
    del trinomio cuadrado perfecto.
  pasos:
