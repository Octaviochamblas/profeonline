procedimiento:
- 'Paso 1: Identifica si los términos son cuadrados perfectos.'
- 'Paso 2: Observa el signo que los separa.'
- 'Paso 3: Si el signo es $+$, decreta que el polinomio no es factorizable en los
  números Reales (queda exactamente igual).'
- 'Paso 4: No te dejes engañar y evita inventar factorizaciones.'
- El binomio al cuadrado desarrolla 3 términos, no 2.
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en reconocimiento del trinomio cuadrado perfecto.
ejemplos:
- titulo: Cuál es la factorización de $4x^2 + 16$
  enunciado: ¿Cuál es la factorización de $4x^2 + 16$?
  solucion_pasos:
  - 'Se puede extraer el factor común 4: $4(x^2 + 4)$.'
  - Observamos el paréntesis $(x^2 + 4)$. Es una suma de cuadrados.
  - No se puede seguir factorizando.
  - 'Resultado final: $4(x^2 + 4)$.'
- titulo: Factoriza $m^2 + 100$.
  solucion_pasos:
  - Al ser una suma de cuadrados, se mantiene igual en el dominio de los Reales.
- titulo: 'Respecto de «Reconocimiento del trinomio cuadrado perfecto»: ¿Es correcta
    esta caracterizaci'
  enunciado: 'Respecto de «Reconocimiento del trinomio cuadrado perfecto»: ¿Es correcta
    esta caracterización? «A diferencia de $a^2 - b^2$, la expresión $a^2 + b^2$ NO
    posee una factorización con coeficientes Reales»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: A diferencia de $a^2 - b^2$,
    la expresión $a^2 + b^2$ NO posee una factorización con coeficientes Reales.'
- titulo: 'Respecto de «Reconocimiento del trinomio cuadrado perfecto»: ¿Es válida
    esta afirmación? «As'
  enunciado: 'Respecto de «Reconocimiento del trinomio cuadrado perfecto»: ¿Es válida
    esta afirmación? «Asumir impulsivamente que $x^2 + y^2 = (x+y)^2$. ¡Falso! Falta
    el $+2xy$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: A diferencia de $a^2 - b^2$,
    la expresión $a^2 + b^2$ NO posee una factorización con coeficientes Reales.'
errores_frecuentes:
- Asumir impulsivamente que $x^2 + y^2 = (x+y)^2$. ¡Falso! Falta el $+2xy$.
- Confundir la imposibilidad de factorizar la suma de cuadrados con no poder extraer
  un factor común numérico previo.
- Para «¿Por qué $(x+4)(x+4)$ no es la factorización de $x^2 + 16$», la respuesta
  correcta es Porque falta multiplicar los exponentes.
- Porque los signos deberían ser negativos.
- Porque $(x+4)$ está mal calculado.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_poder: Descomponer en factores irreducibles expresiones algebraicas
  aplicando reconocimiento del trinomio cuadrado perfecto.
