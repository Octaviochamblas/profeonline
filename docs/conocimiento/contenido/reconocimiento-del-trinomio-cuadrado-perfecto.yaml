procedimiento:
- 'Paso 1: Ordenar el trinomio de forma decreciente según los exponentes de una variable.'
- 'Paso 2: Extraer las raíces cuadradas $A$ y $B$ de los términos extremos.'
- 'Paso 3: Multiplicar $2 \cdot A \cdot B$ y comprobar que el resultado coincida con
  el término central.'
errores_correccion: '- **Error 1: Considerar un trinomio como TCP evaluando solo los
  extremos sin verificar el doble producto central.** **Cómo corregirlo:** La coincidencia
  del término central con $2AB$ es OBLIGATORIA; sin ella, no es un TCP.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $x^2 + 10x + 25$ un Trinomio Cuadrado Perfecto?
  alternativas:
  - Sí, porque $A=x, B=5$ y $2(x)(5)=10x$
  - No, porque 25 no es múltiplo de 2
  - No, porque faltan coeficientes
  respuesta: Sí, porque $A=x, B=5$ y $2(x)(5)=10x$
  solucion_pasos:
  - 1. $\sqrt{x^2}=x, \sqrt{25}=5$.
  - 2. Doble producto $2(x)(5) = 10x$, coincide con el término central.
- titulo: Ejemplo 2
  enunciado: ¿Es el trinomio $x^2 + 5x + 9$ un TCP en $\mathbb{R}$?
  alternativas:
  - No, porque $2(x)(3) = 6x \neq 5x$
  - Sí, con $A=x, B=3$
  - Sí, porque 9 es cuadrado perfecto
  respuesta: No, porque $2(x)(3) = 6x \neq 5x$
  solucion_pasos:
  - 1. Las raíces serían $x$ y $3$.
  - 2. Doble producto $2(x)(3)=6x$, pero el trinomio tiene $5x$. No es TCP.
- titulo: En un Trinomio Cuadrado Perfecto $ax^2 + bx + c$, ¿es su discriminante $\Delta
    = b^2 - 4ac$ igual a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, la condición $\Delta = 0$ caracteriza algebraicante a un TCP.
- titulo: ¿Un trinomio cuyo término independiente sea negativo puede ser un TCP en
    el campo de los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, $B^2$ debe ser positivo en $\mathbb{R}$ para tener raíz cuadrada real.
errores_frecuentes:
- Aceptar un trinomio como TCP verificando únicamente que dos términos tengan raíz
  cuadrada sin comprobar $2AB$.
- Declarar que el doble producto puede ser reemplazado por el triple producto de las
  raíces.
- Aceptar términos extremos con signo negativo en el campo real sin factorizar el
  signo menos.
- Declarar que el término central debe ser siempre positivo en un TCP.
- Declarar que todo trinomio de la forma $x^2 + (a+b)x + ab$ es automáticamente un
  Trinomio Cuadrado Perfecto.
afirmaciones_verdaderas:
- Un Trinomio Cuadrado Perfecto requiere que el término central sea en valor absoluto
  el doble producto de las raíces de los extremos.
- El discriminante de cualquier trinomio de segundo grado que sea cuadrado perfecto
  es cero ($\Delta = 0$).
al_terminar_debes_poder: Al terminar serás capaz de verificar si un trinomio de tres
  términos cumple la estructura de un Trinomio Cuadrado Perfecto.
