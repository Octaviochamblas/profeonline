resumen_inicial: El reconocimiento del trinomio cuadrado perfecto (TCP) identifica
  expresiones de 3 términos de la forma $A^2 \pm 2AB + B^2$, donde dos términos son
  cuadrados perfectos y el restante equivale al doble producto de sus bases.
explicacion_simple: 'Para saber si un trinomio como $x^2 + 6x + 9$ es un TCP, busca
  dos términos que tengan raíz cuadrada exacta ($\sqrt{x^2}=x$ y $\sqrt{9}=3$). Luego
  multiplica esas dos raíces por 2: $2 \cdot x \cdot 3 = 6x$. Si coincide con el término
  del medio, ¡es un TCP!'
explicacion_formal: 'Un trinomio $P(x) = c_1 x^2 + c_2 x + c_3$ es un **Trinomio Cuadrado
  Perfecto (TCP)** si existen $A, B \in \mathbb{R}[x]$ tales que:


  $$P(x) = A^2 \pm 2AB + B^2$$


  **Desglose simbólico:**

  - $A^2, B^2$: Términos extremos positivos con raíz cuadrada exacta $A = \sqrt{A^2}$
  y $B = \sqrt{B^2}$.

  - $\pm 2AB$: Término central cuyo valor absoluto es EXACTAMENTE el doble producto
  de las bases $|c_2| = 2 \cdot A \cdot B$.


  > **Complemento didáctico:** Es la condición necesaria y suficiente para que un
  trinomio de segundo grado se pueda representar como el cuadrado de un binomio único.'
definiciones_clave: '- **Trinomio Cuadrado Perfecto (TCP)**: Polinomio de tres términos
  que proviene de elevar un binomio al cuadrado.

  - **Doble producto central**: Término $2AB$ que valida la simetría del trinomio.'
propiedades_relaciones: '- **Discriminante nulo**: Todo TCP de la forma $ax^2 + bx
  + c$ cumple que su discriminante $\Delta = b^2 - 4ac = 0$.'
ejemplo_guiado:
  enunciado: Verifique si el trinomio $4x^2 - 20x + 25$ constituye un Trinomio Cuadrado
    Perfecto.
  pasos:
  - 'Paso 1: Identificar los términos cuadrados perfectos extremos: $T_1 = 4x^2$ y
    $T_3 = 25$.'
  - 'Paso 2: Extraer la primera base: $A = \sqrt{4x^2} = 2x$.'
  - 'Paso 3: Extraer la segunda base: $B = \sqrt{25} = 5$.'
  - 'Paso 4: Calcular el doble producto de las bases: $2 \cdot A \cdot B = 2(2x)(5)
    = 20x$.'
  - 'Paso 5: Comparar con el término central: El término central es $-20x$, cuyo valor
    absoluto coincide con $20x$.'
  - 'Conclusión: El trinomio es un TCP de la forma $A^2 - 2AB + B^2$ con $A = 2x$
    y $B = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación matemática debe cumplirse entre el término central y las
    raíces de los términos extremos en un TCP?
  choices:
