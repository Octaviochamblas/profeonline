semantic_id: MAT.ALG.FUNC_CUADR_MODELO.TRAYECTORIA_PROYECTIL
resumen_inicial: La resolución de problemas de proyectiles modela la altura $h(t) = -\frac{1}{2}g t^2 + v_0 t + h_0$ analizando su trayectoria parabólica en el tiempo.
explicacion_simple: |
  Cuando lanzas una pelota, una piedra o disparas un proyectil al aire, la gravedad lo empuja hacia abajo creando una **trayectoria parabólica**:

  $$h(t) = -5t^2 + v_0 t + h_0$$

  - **Los 3 datos clave del modelo de movimiento**:
    1. **$h_0$ (Altura inicial)**: La altura desde donde se lanza a los $0$ segundos ($h(0) = h_0$).
    2. **$v_0$ (Velocidad inicial)**: El impulso vertical hacia arriba.
    3. **$-5t^2$ (Efecto de la gravedad)**: Aproximación de $-\frac{1}{2}g \approx -4.9 \approx -5$ en $\text{m/s}^2$.

  **Preguntas típicas de proyectiles**:
  - *"¿Altura máxima?"*: Se calcula la ordenada del vértice **$k = h(t_v)$**.
  - *"¿Tiempo en alcanzar la altura máxima?"*: Se calcula la abscisa del vértice **$t_v = -\frac{v_0}{2a}$**.
  - *"¿Cuándo cae al suelo?"*: Se resuelve la ecuación **$h(t) = 0$**.
explicacion_formal: |
  Sea el movimiento balístico uniforme de un objeto puntual bajo la acción de la aceleración gravitacional constante $g \approx 9.8 \text{ m/s}^2$ (o $10 \text{ m/s}^2$). La **ecuación de posición vertical $h(t)$** constituye un modelo cuadrático clásico:

  $$h(t) = -\frac{1}{2}g t^2 + v_0 t + h_0 \quad \text{con } t \ge 0$$

  **Análisisbalístico mediante propiedades cuadráticas:**
  - **Altura Inicial:** $h(0) = h_0$ (Corte con el eje Y vertical).
  - **Apogeo (Altura Máxima):** Se alcanza en el instante crítico $t_{apogeo} = \frac{v_0}{g}$, con altura máxima $h_{máx} = h_0 + \frac{v_0^2}{2g}$.
  - **Tiempo de Impacto (Vuelo):** Solución positiva a la ecuación cuadrática $-\frac{1}{2}g t^2 + v_0 t + h_0 = 0$.
definiciones_clave: |
  - **Apogeo del proyectil**: Punto más alto de la trayectoria parabólica equivalente al vértice $V(t_{apogeo}, h_{máx})$.
propiedades_relaciones: |
  - **Simetría del vuelo desde el suelo**: Si el proyectil se lanza desde el suelo ($h_0 = 0$), el tiempo de subida es exactamente igual al tiempo de bajada: $t_{subida} = t_{bajada} = \frac{v_0}{g}$.
ejemplo_guiado:
  enunciado: 'Un balón se patea desde el suelo con velocidad inicial $v_0 = 30 \text{ m/s}$ y su altura es $h(t) = -5t^2 + 30t$. Calcula el apogeo, el tiempo para alcanzarlo y el tiempo total en el aire.'
  pasos:
    - 'Paso 1: Identificar coeficientes: $a = -5, b = 30, c = 0$.'
    - 'Paso 2: Calcular el tiempo del apogeo (abscisa del vértice): $t_v = -\frac{30}{2(-5)} = 3$ segundos.'
    - 'Paso 3: Calcular la altura máxima (ordenada del vértice): $h_{máx} = h(3) = -5(3)^2 + 30(3) = -45 + 90 = 45$ metros.'
    - 'Paso 4: Resolver $h(t) = 0 \implies -5t(t - 6) = 0 \implies t = 6$ segundos. El tiempo total de vuelo es 6 s.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Un objeto lanzado desde una plataforma a 20 metros de altura sigue la ecuación $h(t) = -5t^2 + 20t + 20$. ¿Desde qué altura fue lanzado el objeto?'
    choices:
      - {text: 'Desde 20 metros de altura ($h(0) = 20$)', is_correct: true}
      - {text: 'Desde 0 metros de altura.', is_correct: false}
      - {text: 'Desde 5 metros de altura.', is_correct: false}
      - {text: 'Desde 40 metros de altura.', is_correct: false}
    explanation: 'La alternativa correcta es ''Desde 20 metros de altura ($h(0) = 20$)''. La altura inicial $h_0$ es la constante $c = 20$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En la trayectoria de un objeto $h(t) = -5t^2 + 40t$, ¿en qué instante el objeto alcanza su apogeo o altura máxima?'
    choices:
      - {text: 'A los 4 segundos ($t = 4$)', is_correct: true}
      - {text: 'A los 8 segundos ($t = 8$).', is_correct: false}
      - {text: 'A los 40 segundos ($t = 40$).', is_correct: false}
      - {text: 'A los 5 segundos ($t = 5$).', is_correct: false}
    explanation: 'La alternativa correcta es ''A los 4 segundos ($t = 4$)''. $t_v = -40/(2 \cdot (-5)) = 40/10 = 4$ s.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la función cinemática del proyectil $h(t) = -at^2 + bt + c$.'
  - 'Paso 2: Aislar la altura inicial $h_0 = c = h(0)$.'
  - 'Paso 3: Calcular el tiempo del punto más alto mediante la abscisa del vértice $t_v = -\frac{b}{2a}$.'
  - 'Paso 4: Evaluar la altura máxima $h(t_v)$ y calcular el instante de caída al suelo resolviendo $h(t) = 0$.'
errores_correccion: |
  - **Error común:** Confundir la altura del objeto $h(t)$ con el tiempo transcurrido $t$.
  - **Cómo corregirlo:** La variable independiente **$t$ MIDE SEGUNDOS (tiempo)**; la variable de salida **$h(t)$ MIDE METROS (altura)**.
