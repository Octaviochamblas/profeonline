semantic_id: MAT.ALG.FUNC_CUADR_MODELO.TRAYECTORIA_PROYECTIL
resumen_inicial: La resolución de problemas de trayectoria de proyectiles modela el movimiento bajo aceleración gravitatoria constante mediante la función cuadrática $h(t) = -\frac{1}{2}gt^2 + v_0 t + h_0$, calculando la altura máxima en el vértice y el tiempo de vuelo en las raíces.
explicacion_simple: "![La resolución de problemas de trayectoria de proyectiles modela el movimiento bajo aceleración gravitatoria constante mediante la función cuadrática $h(t) = -\\frac{1}{2}gt^2 + v_0 t + h_0$, calculando la altura máxima en el vértice y el tiempo de vuelo en las raíces](/static/img/nodos/resolucion-de-problemas-de-trayectoria-de-proyectiles-usando-funciones-cuadraticas-intro.svg)\n\n\nCuando lanzas un proyectil (una pelota, un cohete o una piedra) al aire, su altura sigue una parábola invertida perfecta:\n$$h(t) = -5t^2 + v_0 t + h_0$$\n\n- **¿Qué significa cada número?**\n  - El **$-5t^2$** es la gravedad terrestre frenando y haciendo caer al proyectil.\n  - El **$v_0$** es la velocidad con la que salió disparado hacia arriba.\n  - El **$h_0$** es la altura inicial desde donde se lanzó (un acantilado, un edificio o el suelo).\n- **Las 2 preguntas clásicas:**\n  - **¿Altura máxima?** Se calcula con el **vértice**: $t_v = -\\frac{b}{2a}$ y luego evalúas $h(t_v)$.\n  -\
  \ **¿Cuándo choca contra el suelo?** Se resuelve igualando la función a cero: **$h(t) = 0$**."
explicacion_formal: "Por las ecuaciones diferenciales de Newton para un campo gravitacional uniforme unidimensional $\\ddot{h}(t) = -g$, la **altura balística instantánea** $h: [0, t_{\\text{impacto}}] \\to \\mathbb{R}^+$ es:\n$$h(t) = -\\frac{1}{2}gt^2 + v_0 t + h_0, \\quad (g > 0, \\; a = -\\frac{g}{2} < 0)$$\n\n**Resolución de parámetros críticos**:\n1. **Tiempo a la cúspide (velocidad vertical nula)**:\n   $$\\dot{h}(t_v) = -gt_v + v_0 = 0 \\Longleftrightarrow t_v = \\frac{v_0}{g} = -\\frac{b}{2a}$$\n2. **Altura máxima absoluta**:\n   $$h_{\\text{máx}} = h(t_v) = h_0 + \\frac{v_0^2}{2g}$$\n3. **Tiempo total de permanencia en el aire ($h(t) = 0$)**:\n   $$t_{\\text{vuelo}} = \\frac{v_0 + \\sqrt{v_0^2 + 2gh_0}}{g}$$"
definiciones_clave: '- **Trayectoria parabólica temporal**: Modelo $h(t)$ que asocia a cada instante de tiempo $t$ la elevación vertical del objeto.

  - **Instante de culminación**: Abscisa del vértice $t_v$ donde la velocidad instantánea se anula.'
propiedades_relaciones: '- **Simetría temporal**: Si $h_0 = 0$, el tiempo de subida es idéntico al tiempo de bajada: $t_{\text{impacto}} = 2 t_v$.

  - **Aceleración constante negativa**: El término cuadrático siempre es negativo ($a = -\frac{1}{2}g < 0$).'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de problemas de trayectoria de proyectiles modela el movimiento bajo aceleración gravitatoria constante mediante la función cuadrática $h(t) = -\frac{1}{2}gt^2 + v_0 t + h_0$, calculando la altura máxima en el vértice y el tiempo de vuelo en las raíces](/static/img/nodos/resolucion-de-problemas-de-trayectoria-de-proyectiles-usando-funciones-cuadraticas-ejemplos.svg)



    Un proyectil es lanzado verticalmente desde un edificio de 20 metros con una velocidad inicial de 30 m/s. Su altura en metros tras $t$ segundos es $h(t) = -5t^2 + 30t + 20$.

    1) ¿En qué segundo alcanza su altura máxima y cuánto mide?

    2) ¿A los cuántos segundos impacta contra el suelo?'
  pasos:
  - 'Paso 1: Identificar coeficientes: $a = -5, b = 30, c = 20$.'
  - 'Paso 2: Calcular el tiempo a la altura máxima ($t_v$):

    $t_v = -\frac{b}{2a} = -\frac{30}{2(-5)} = \frac{30}{10} = 3\text{ segundos}$.'
  - 'Paso 3: Calcular la altura máxima evaluando $h(3)$:

    $h_{\text{máx}} = -5(3)^2 + 30(3) + 20 = -45 + 90 + 20 = 65\text{ metros}$.'
  - 'Paso 4: Calcular el impacto en el suelo ($h(t) = 0$):

    $-5t^2 + 30t + 20 = 0 \implies t^2 - 6t - 4 = 0$.

    Aplicar fórmula general: $t = \frac{6 \pm \sqrt{36 - 4(1)(-4)}}{2} = \frac{6 \pm \sqrt{52}}{2} = 3 \pm \sqrt{13}$.

    - Como el tiempo debe ser positivo ($t > 0$): $t = 3 + \sqrt{13} \approx 3 + 3{,}61 = 6{,}61\text{ segundos}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Una flecha sigue la trayectoria $h(t) = -5t^2 + 40t$. ¿Cuál es su altura máxima?
  choices:
  - text: 80 metros (alcanzada a los 4 segundos)
    is_correct: true
  - text: 40 metros
    is_correct: false
  - text: 160 metros
    is_correct: false
  - text: 8 metros
    is_correct: false
  explanation: La alternativa correcta es '80 metros (alcanzada a los 4 segundos)'. $t_v = 4\text{ s} \implies h(4) = -5(16) + 40(4) = -80 + 160 = 80\text{ m}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una pelota lanzada desde el suelo ($h_0 = 0$) tarda 3 segundos en alcanzar su altura máxima, ¿cuánto tiempo total dura su vuelo hasta volver al suelo?
  choices:
  - text: 6 segundos (por simetría temporal)
    is_correct: true
  - text: 3 segundos
    is_correct: false
  - text: 9 segundos
    is_correct: false
  - text: 4,5 segundos
    is_correct: false
  explanation: 'La alternativa correcta es ''6 segundos (por simetría temporal)''. Al salir desde el suelo, el tiempo de subida es igual al tiempo de bajada: $2 \times 3 = 6\text{ s}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la función de altura $h(t) = at^2 + bt + c$.'
- 'Paso 2: Para la altura máxima, calcular $t_v = -\frac{b}{2a}$ y evaluar $h(t_v)$.'
- 'Paso 3: Para el impacto en el suelo, resolver la ecuación cuadrática $h(t) = 0$.'
- 'Paso 4: Descartar soluciones de tiempo negativas y enunciar la respuesta contextual con unidades.'
errores_correccion: '- **Error común:** Dar la respuesta en segundos cuando la pregunta pide "la altura máxima" en metros.

  - **Cómo corregirlo:** El tiempo son los **segundos ($t_v$)**; la altura máxima es la **evaluación en metros ($h(t_v)$)**.'
ejemplos:
- titulo: 'Ejemplo 1: Tiempo a la cumbre'
  enunciado: En $h(t) = -5t^2 + 50t$, ¿en qué segundo alcanza la cúspide?
  alternativas:
  - 5 segundos
  - 10 segundos
  - 125 segundos
  - 2,5 segundos
  respuesta: 5 segundos
  solucion_pasos:
  - 'Paso 1: $t_v = -50/(2(-5)) = 5\text{ segundos}$.'
- titulo: 'Ejemplo 2: Altura máxima'
  enunciado: En $h(t) = -5t^2 + 50t$, ¿cuál es la elevación máxima?
  alternativas:
  - 125 metros
  - 250 metros
  - 50 metros
  - 5 metros
  respuesta: 125 metros
  solucion_pasos:
  - 'Paso 1: $h(5) = -5(25) + 50(5) = -125 + 250 = 125\text{ metros}$.'
- titulo: 'Ejemplo 3: Tiempo total de vuelo'
  enunciado: ¿A los cuántos segundos toca el suelo $h(t) = -5t^2 + 50t$?
  alternativas:
  - 10 segundos
  - 5 segundos
  - 20 segundos
  - 125 segundos
  respuesta: 10 segundos
  solucion_pasos:
  - 'Paso 1: $-5t(t - 10) = 0 \implies t = 10\text{ segundos}$.'
- titulo: 'Ejemplo 4: Lanzamiento con altura inicial'
  enunciado: Si $h(t) = -5t^2 + 20t + 25$, ¿a qué altura inicial se lanzó?
  alternativas:
  - 25 metros
  - 20 metros
  - 5 metros
  - 0 metros
  respuesta: 25 metros
  solucion_pasos:
  - 'Paso 1: $h(0) = 25\text{ metros}$.'
errores_frecuentes:
- Aceptar raíces negativas de tiempo en problemas balísticos.
- Confundir la velocidad inicial con el tiempo de vuelo.
- Olvidar sumar la altura inicial h₀ al evaluar el vértice.
afirmaciones_verdaderas:
- La altura máxima de un proyectil corresponde a la ordenada del vértice de h(t).
- El tiempo en que el proyectil toca el suelo es la raíz positiva de la ecuación h(t) = 0.
al_terminar_debes_poder: '**QUÉ:** Resolver problemas de balística y cinemática de proyectiles mediante funciones cuadráticas.


  **CÓMO:** Calculando el vértice para la altura máxima h(t_v) y resolviendo h(t) = 0 para el tiempo total de vuelo.


