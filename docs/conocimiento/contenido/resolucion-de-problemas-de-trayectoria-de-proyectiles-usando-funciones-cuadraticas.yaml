errores_frecuentes:
  - 'Dada la ecuación $h(t) = -5t^2 + 20t + 15$, es correcto afirmar que el objeto fue lanzado desde el suelo.'
  - 'La confusión entre el tiempo de vuelo total $t_{caída}$ y el tiempo en alcanzar la altura máxima $t_{apogeo}$.'
  - 'La suposición de que la aceleración de gravedad invierte su signo a positivo durante el ascenso del objeto.'
  - 'La falta de eliminación de la solución de tiempo negativa al resolver la ecuación de impacto $h(t) = 0$.'
  - 'Afirmar que en la altura máxima la velocidad vertical del objeto es diferente de cero.'
afirmaciones_verdaderas:
  - 'En el modelo de proyectiles $h(t) = -at^2 + bt + c$, el apogeo o altura máxima se alcanza en el tiempo del vértice $t = -b/(2a)$.'
  - 'La constante $c$ de la ecuación cinemática representa la altura inicial $h_0$ desde la cual fue lanzado el objeto en $t = 0$.'
al_terminar_debes_poder: |
  QUÉ: Resolver problemas aplicados de movimiento de proyectiles usando modelos cuadráticos.
  CÓMO: Isolar $h_0$, calcular el tiempo de apogeo $t_v = -b/(2a)$, evaluar la altura máxima y calcular el tiempo de caída resolviendo $h(t) = 0$.
