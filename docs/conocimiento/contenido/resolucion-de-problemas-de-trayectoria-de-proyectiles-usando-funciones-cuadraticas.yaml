semantic_id: MAT.ALG.FUNC_CUADR_MODELO.TRAYECTORIA_PROYECTIL
resumen_inicial: 'Los problemas de trayectoria de proyectiles se resuelven analizando la función cuadrática $h(t) = -at^2 + v_0 t + h_0$ para calcular su altura máxima, tiempo de cima y tiempo de impacto.'
explicacion_simple: |
  Cuando se lanza una pelota o proyectil al aire, su movimiento describe una trayectoria en forma de parábola que abre hacia abajo. La función de altura $h(t)$ nos permite responder a tres preguntas clásicas: desde qué altura fue lanzada (evaluando $t = 0$), en qué segundo alcanza su altura máxima y cuánto vale esa altura (calculando las coordenadas del vértice), y en qué segundo toca el suelo (hallando la raíz donde $h(t) = 0$).
explicacion_formal: |
  ### Definición formal
  El movimiento parabólico libre de un proyectil bajo aceleración de gravedad constante se modela mediante la función cuadrática de posición temporal $h: [0, t_{\text{impacto}}] \to \mathbb{R}^+$:
  $$h(t) = -a t^2 + v_0 t + h_0, \quad a > 0$$

  ### Desglose simbólico
  - $h_0 = h(0)$: **Altura inicial** desde la cual se dispara el proyectil ($c = h_0$).
  - $v_0$: **Velocidad inicial** de disparo vertical ($b = v_0$).
  - $-a$: Coeficiente de desaceleración gravitatoria (típicamente $-5$ o $-4.9$).
  - $t_{\text{máx}} = -\frac{v_0}{2(-a)} = \frac{v_0}{2a}$: **Tiempo de cima** para alcanzar la altura máxima.
  - $h_{\text{máx}} = h(t_{\text{máx}})$: **Altura máxima** alcanzada sobre el suelo (ordenada del vértice).
  - $t_{\text{impacto}}$: Solución positiva de la ecuación $h(t) = 0$ (tiempo total de vuelo).

  ### Síntesis didáctica
  Distinguir preguntas temporales de preguntas de altura: *¿Cuándo alcanza la máxima altura?* $\implies$ Pedir el tiempo del vértice $t_{\text{máx}}$. *¿Cuál es la altura máxima?* $\implies$ Pedir la ordenada $h_{\text{máx}}$. *¿Cuándo cae al suelo?* $\implies$ Resolver $h(t) = 0$.
definiciones_clave: |
  - **Altura máxima $h_{\text{máx}}$**: Cota máxima vertical $k$ alcanzada en el vértice de la parábola.
  - **Tiempo de cima $t_{\text{máx}}$**: Instante temporal $h = -\frac{b}{2a}$ en el que la velocidad vertical se anula.
  - **Tiempo de impacto $t_{\text{impacto}}$**: Instante positivo en que el proyectil toca el suelo ($h(t) = 0$).
propiedades_relaciones: |
  - **Simetría del lanzamiento desde el suelo**: Si $h_0 = 0$, el tiempo de impacto total es exactamente el doble del tiempo de cima: $t_{\text{impacto}} = 2 t_{\text{máx}}$.
  - **Descartes de raíces negativas**: En la ecuación $h(t) = 0$, la raíz negativa se descarta por carecer de sentido físico temporal ($t \ge 0$).
ejemplo_guiado:
  enunciado: 'Un cohete de juguete es lanzado verticalmente según la función $h(t) = -5t^2 + 40t + 10$, donde $h$ está en metros y $t$ en segundos. Determina: A) La altura inicial. B) El tiempo para alcanzar la altura máxima y el valor de dicha altura. C) El tiempo en que regresa al suelo.'
  pasos:
    - 'Paso 1: Altura inicial: evaluamos $t = 0 \implies h(0) = -5(0)^2 + 40(0) + 10 = 10\text{ metros}$.'
    - 'Paso 2: Tiempo de cima: $t_{\text{máx}} = -\frac{b}{2a} = -\frac{40}{2(-5)} = 4\text{ segundos}$.'
    - 'Paso 3: Altura máxima: sustituimos $t = 4 \implies h(4) = -5(4)^2 + 40(4) + 10 = -80 + 160 + 10 = 90\text{ metros}$.'
    - 'Paso 4: Tiempo de suelo: resolvemos $-5t^2 + 40t + 10 = 0 \implies t^2 - 8t - 2 = 0$.'
    - 'Paso 5: Aplicamos fórmula general: $t = \frac{8 \pm \sqrt{64 - 4(1)(-2)}}{2} = \frac{8 \pm \sqrt{72}}{2} \approx \frac{8 + 8.49}{2} \approx 8.24\text{ segundos}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'La altura en metros de una piedra lanzada al aire viene dada por $h(t) = -5t^2 + 30t$. ¿A los cuántos segundos alcanza su altura máxima y cuánto vale dicha altura?'
    choices:
      - {text: 'Alcanza su altura máxima de 45 metros a los 3 segundos', is_correct: true}
      - {text: 'Alcanza su altura máxima de 30 metros a los 5 segundos', is_correct: false}
      - {text: 'Alcanza su altura máxima de 90 metros a los 6 segundos', is_correct: false}
      - {text: 'Alcanza su altura máxima de 45 metros a los 6 segundos', is_correct: false}
    explanation: 'La alternativa correcta es ''Alcanza su altura máxima de 45 metros a los 3 segundos''. El tiempo de cima es $t = -\frac{30}{2(-5)} = 3\text{ s}$, y la altura es $h(3) = -5(9) + 30(3) = 45\text{ m}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una pelota es lanzada desde el suelo ($h_0 = 0$) y tarda 4 segundos en alcanzar su altura máxima, ¿cuánto tiempo total transcurre hasta que vuelve a tocar el suelo?'
    choices:
      - {text: '8 segundos', is_correct: true}
      - {text: '4 segundos', is_correct: false}
      - {text: '16 segundos', is_correct: false}
      - {text: '2 segundos', is_correct: false}
    explanation: 'La alternativa correcta es ''8 segundos''. Al lanzarse desde el suelo ($h_0 = 0$), por simetría el tiempo total de vuelo es el doble del tiempo de subida: $2 \cdot 4 = 8\text{ s}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los coeficientes $a$, $b$ y $c$ de la función de altura $h(t) = -at^2 + v_0 t + h_0$.'
  - 'Paso 2: Para hallar el instante de máxima altura, calcular la abscisa del vértice $t_{\text{máx}} = -\frac{b}{2a}$.'
  - 'Paso 3: Para hallar la altura máxima, evaluar $h(t_{\text{máx}})$.'
  - 'Paso 4: Para hallar el tiempo de caída o impacto, resolver la ecuación $h(t) = 0$ y tomar la solución positiva $t > 0$.'
errores_correccion: |
  - **Error 1:** Responder con el tiempo de subida $t_{\text{máx}}$ cuando la pregunta pide la altura máxima $h_{\text{máx}}$. **Cómo corregirlo:** El tiempo $t$ es la variable independiente (en segundos). Para saber la altura física (en metros) se debe evaluar la función $h(t_{\text{máx}})$.
  - **Error 2:** Considerar válida la raíz negativa al resolver $h(t) = 0$. **Cómo corregirlo:** El tiempo en la realidad física corre hacia adelante ($t \ge 0$). Las raíces negativas representan instantes anteriores al lanzamiento y se descartan.
ejemplos:
  - titulo: 'Cálculo de altura inicial'
    enunciado: 'En la función de trayectoria $h(t) = -4.9t^2 + 14.7t + 20$, ¿cuál es la altura del edificio desde donde se disparó el objeto?'
    alternativas:
      - '20 metros'
      - '14.7 metros'
      - '4.9 metros'
    respuesta: '20 metros'
    solucion_pasos:
      - '1. La altura inicial corresponde al instante $t = 0$.'
      - '2. $h(0) = -4.9(0)^2 + 14.7(0) + 20 = 20$ metros.'
  - titulo: 'Cálculo de tiempo de cima'
    enunciado: '¿En qué segundo alcanza la máxima altura el proyectil $h(t) = -5t^2 + 50t$?'
    alternativas:
      - '5 segundos'
      - '10 segundos'
      - '2.5 segundos'
    respuesta: '5 segundos'
    solucion_pasos:
      - '1. $t = -\frac{b}{2a} = -\frac{50}{2(-5)} = 5$ segundos.'
  - titulo: 'Simetría de vuelo desde el origen'
    enunciado: 'Si un objeto se lanza desde el suelo y toca el suelo a los 12 segundos, ¿su altura máxima ocurrió a los 6 segundos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por simetría parabólica con $h_0 = 0$, la cima ocurre exactamente en el punto medio del tiempo total de vuelo ($12 / 2 = 6$ s).'
  - titulo: 'Unicidad de la cima'
    enunciado: '¿Un proyectil con trayectoria cuadrática alcanza la altura máxima en más de un instante?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Toda parábola posee un único vértice, por lo que la altura máxima se alcanza en un solo instante $t_{\text{máx}}$.'
errores_frecuentes:
  - 'La altura máxima que alcanza un proyectil $h(t) = -5t^2 + 20t + 5$ se calcula evaluando $h(0)$.'
  - 'El tiempo en que un proyectil toca el suelo es igual a la abscisa del vértice $t = -\frac{b}{2a}$.'
  - 'Si la solución a la ecuación de impacto $h(t) = 0$ da $t_1 = -1$ y $t_2 = 6$, el objeto toca el suelo a los $-1$ segundos.'
  - 'La velocidad inicial de un proyectil en $h(t) = -5t^2 + 30t + 10$ viene dada por el término $-5$.'
  - 'Un proyectil lanzado desde una altura de 50 metros toca el suelo en $t = 0$.'
afirmaciones_verdaderas:
  - 'La altura máxima de un proyectil corresponde a la ordenada del vértice $k = h(t_{\text{máx}})$ de la función cuadrática de trayectoria.'
  - 'El instante en que un proyectil toca el suelo se obtiene resolviendo la ecuación $h(t) = 0$ y seleccionando la raíz temporal positiva.'
