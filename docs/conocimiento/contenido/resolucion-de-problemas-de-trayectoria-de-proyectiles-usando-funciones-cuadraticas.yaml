procedimiento:
- 'Paso 1: Identifica la función de altura $h(t)$ dada o planteada en el problema.'
- 'Paso 2: Determina qué se pregunta (altura máxima, tiempo en el suelo, instante
  con altura específica).'
- 'Paso 3: Aplica la herramienta correspondiente (vértice, ceros, o resolución de
  ecuación) según la pregunta.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en resolución de problemas de trayectoria de proyectiles
  usando funciones cuadráticas.
ejemplos:
- titulo: Cálculo de la altura inicial
  enunciado: Con $h(t)=-4{,}9t^2+15t+1$, ¿cuál es la altura desde la que se lanza
    el proyectil?
  solucion_pasos:
  - La altura inicial corresponde a $h(0)$.
  - $h(0)=1$ m.
- titulo: Cálculo del tiempo en que toca el suelo
  enunciado: Con $h(t)=-5t^2+20t$, ¿en qué instante el proyectil toca el suelo?
  solucion_pasos:
  - 'Se resuelve $-5t^2+20t=0$, factorizando: $-5t(t-4)=0$.'
  - Descartando $t=0$, el proyectil toca el suelo a los $4$ segundos.
- titulo: ¿El coeficiente cuadrático en un modelo de trayectoria de proyectil es siempre
    negativo?
  enunciado: ¿El coeficiente cuadrático en un modelo de trayectoria de proyectil es
    siempre negativo?
  respuesta: Sí
  solucion_pasos:
  - Representa el efecto de la gravedad frenando el ascenso, por lo que el término
    $-\frac{1}{2}g$ siempre es negativo.
- titulo: ¿La velocidad inicial $v_0$ puede ser negativa en este modelo?
  enunciado: ¿La velocidad inicial $v_0$ puede ser negativa en este modelo?
  respuesta: Sí
  solucion_pasos:
  - Si el objeto se lanza hacia abajo en vez de hacia arriba, la velocidad inicial
    se representa con un valor negativo.
errores_frecuentes:
- Confundir la altura inicial $h_0$ con la altura máxima alcanzada por el proyectil.
- Aceptar como válida una solución de tiempo negativo.
- No verificar si la pregunta pide el instante en que toca el suelo o cuándo alcanza
  una altura intermedia (que puede tener dos soluciones).
- Cometer errores de signo al identificar el coeficiente cuadrático negativo del modelo.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
