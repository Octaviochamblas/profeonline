semantic_id: MAT.ALG.FUNC_CUADR_MODELO.TRAYECTORIA_PROYECTIL
resumen_inicial: 'Resolución de problemas de trayectoria de proyectiles usando funciones
  cuadráticas: parábola, vértice, concavidad y formas de Modelamiento y aplicaciones.'
explicacion_simple: El movimiento vertical de cualquier objeto lanzado (una pelota,
  un cohete de juguete, una piedra) sigue una trayectoria parabólica descrita por
  una función cuadrática del tiempo.
explicacion_formal: '### Definición formal


  La función $h(t)=-\dfrac{1}{2}gt^2+v_0t+h_0$ modela la altura de un proyectil en
  el instante $t$, donde $g$ es la aceleración de gravedad, $v_0$ la velocidad inicial
  (positiva si es hacia arriba) y $h_0$ la altura desde la que se lanza. Es una función
  cuadrática en $t$, con coeficiente principal negativo.


  ### Desarrollo didáctico


  A partir de la función de altura, se pueden responder distintas preguntas: la altura
  máxima (vértice), cuándo toca el suelo (cero positivo), o en qué instante alcanza
  una altura específica (igualando $h(t)$ a ese valor).


  Con $h(t)=-5t^2+20t+2$ (en metros), la altura inicial es $h(0)=2$ m, y se puede
  calcular en qué instante alcanza, por ejemplo, $17$ m resolviendo $-5t^2+20t+2=17$.'
definiciones_clave: '- **Resolución de problemas de trayectoria de proyectiles usando
  funciones cuadráticas**: Elemento o parámetro esencial en la representación de la
  función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  resolución de problemas de trayectoria de proyectiles usando funciones cuadráticas.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando resolución
    de problemas de trayectoria de proyectiles usando funciones cuadráticas.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a resolución
    de problemas de trayectoria de proyectiles usando funciones cuadráticas.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
