semantic_id: MAT.GEO.PARALELOGRAMOS.ROMBO_LADOS_CONGRUENTES
resumen_inicial: El rombo es el paralelogramo equilátero cuyos cuatro lados son congruentes y sus diagonales son perpendiculares y bisectrices.
explicacion_simple: 'El rombo es como un diamante: **sus cuatro lados miden exactamente lo mismo** ($s$). Esto lo convierte en un paralelogramo equilátero.


  Aunque sus esquinas están inclinadas (dos son agudas y dos son obtusas), sus diagonales guardan dos propiedades increíbles: 1) Se cruzan formando una cruz perfecta con ángulos de **$90^\circ$** (son perpendiculares), y 2) Cada diagonal corta a las esquinas exactamente por la mitad (son bisectrices). Además, el área de un rombo se calcula muy fácilmente multiplicando sus dos diagonales y dividiendo por dos: **$A = \frac{D \cdot d}{2}$**.


  ![Cuatro lados congruentes en el rombo](/static/img/nodos/propiedad-de-cuatro-lados-congruentes-en-el-rombo-intro.svg)

  '
explicacion_formal: '### Definición formal del rombo

  Un **rombo** es un paralelogramo cuyos cuatro lados son congruentes entre sí (equilátero):

  $$\overline{AB} \cong \overline{BC} \cong \overline{CD} \cong \overline{DA} \iff s_1 = s_2 = s_3 = s_4 = s$$


  ### Teorema de las diagonales del rombo

  En todo paralelogramo, las diagonales son perpendiculares entre sí si y solo si el paralelogramo es un rombo:

  $$\mathcal{ABCD} \text{ es rombo} \iff \overline{AC} \perp \overline{BD} \iff d_1 \perp d_2$$


  ### Propiedades métricas y angulares fundamentales

  1. **Perpendicularidad:** $\angle(\overline{AC}, \overline{BD}) = 90^\circ$.

  2. **Bisectrices angulares:** Cada diagonal es bisectriz de los dos ángulos interiores opuestos que conecta.

  3. **Relación pitagórica entre lado y diagonales:**

  Al dimidiarse perpendicularmente, forman 4 triángulos rectángulos cuyos catetos son las semidiagonales $\frac{D}{2}$ y $\frac{d}{2}$:

  $$s^2 = \left(\frac{D}{2}\right)^2 + \left(\frac{d}{2}\right)^2 = \frac{D^2 + d^2}{4} \implies s = \frac{1}{2}\sqrt{D^2 + d^2}$$

  4. **Área del rombo:**

  $$A = \frac{D \cdot d}{2}$$


  > **Complemento didáctico:** El rombo se reconoce de inmediato por sus diagonales perpendiculares en cruz. Recuerda siempre que cada triángulo interior tiene catetos $\frac{D}{2}$ y $\frac{d}{2}$, e hipotenusa igual al lado $s$. Con este triángulo resuelves cualquier problema de rombos en la PAES.

  '
definiciones_clave: '- **Rombo**: Paralelogramo equilátero con cuatro lados congruentes.

  - **Diagonales perpendiculares**: Diagonales que forman un ángulo de intersección de $90^\circ$.

  - **Diagonal mayor ($D$) y menor ($d$)**: Diagonales de distinta longitud presentes en todo rombo no cuadrado.

  '
propiedades_relaciones: '- **Perímetro del rombo**: $P = 4s$.

  - **Ejes de simetría**: Las dos diagonales son ejes de simetría axial de la figura.

  - **Circunferencia inscrita**: El rombo admite circunferencia inscrita cuyo centro coincide con el cruce de sus diagonales.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de rombo](/static/img/nodos/propiedad-de-cuatro-lados-congruentes-en-el-rombo-ejemplos.svg)


    Las diagonales de un rombo miden $D = 8$ cm y $d = 6$ cm. Calcula el área del rombo, la longitud de cada uno de sus lados y su perímetro.'
  pasos:
  - 'Paso 1: Calcular el área mediante la fórmula rombal: $A = \frac{D \cdot d}{2} = \frac{8 \cdot 6}{2} = \frac{48}{2} = 24\text{ cm}^2$.'
  - 'Paso 2: Hallar las semidiagonales (catetos del triángulo interior): $\frac{D}{2} = 4$ cm y $\frac{d}{2} = 3$ cm.'
  - 'Paso 3: Aplicar el Teorema de Pitágoras para hallar el lado $s$: $s^2 = 4^2 + 3^2 = 16 + 9 = 25 \implies s = \sqrt{25} = 5$ cm.'
  - 'Paso 4: Calcular el perímetro: $P = 4s = 4 \cdot 5 = 20$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué ángulo se cruzan las diagonales de un rombo?
  choices:
  - text: Se cruzan perpendicularmente en un ángulo de 90°.
    is_correct: true
  - text: Se cruzan siempre en un ángulo de 45°.
    is_correct: false
  - text: Se cruzan en ángulos paralelos de 180°.
    is_correct: false
  - text: No se puede saber si no es un cuadrado.
    is_correct: false
  explanation: La alternativa correcta es 'Se cruzan perpendicularmente en un ángulo de 90°.' Las diagonales del rombo son perpendiculares entre sí.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si las diagonales de un rombo miden 10 cm y 12 cm, ¿cuál es su área?
  choices:
  - text: 60 cm².
    is_correct: true
  - text: 120 cm².
    is_correct: false
  - text: 30 cm².
    is_correct: false
  - text: 44 cm².
    is_correct: false
  explanation: 'La alternativa correcta es ''60 cm².'' Aplicando la fórmula del área del rombo: $A = \frac{D \cdot d}{2} = \frac{10 \cdot 12}{2} = 60\text{ cm}^2$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Recordar que el rombo tiene cuatro lados congruentes ($P = 4s$).

  2. Para calcular el área dadas las diagonales: $A = (D \cdot d) / 2$.

  3. Para hallar el lado conociendo las diagonales, extraer semidiagonales y aplicar Pitágoras: $s = \sqrt{(D/2)^2 + (d/2)^2}$.

  4. Utilizar que cada diagonal biseca a los ángulos de los vértices.

  '
errores_correccion: '- **Error común 1:** Asumir que las diagonales de un rombo tienen la misma longitud. **Corrección:** En el rombo general las diagonales son distintas ($D \neq d$); solo son iguales si el rombo es un cuadrado.

  - **Error común 2:** Olvidar dividir entre 2 en la fórmula del área y responder $D \cdot d$. **Corrección:** $D \cdot d$ es el área de un rectángulo exterior; el rombo ocupa exactamente la mitad.

  '
ejemplos:
- tipo: A
  titulo: Área de rombo
  enunciado: Un rombo tiene diagonales que miden $14\text{ cm}$ y $10\text{ cm}$. ¿Cuál es su área?
  alternativas:
  - text: $70\text{ cm}^2$.
    is_correct: true
  - text: $140\text{ cm}^2$.
    is_correct: false
  - text: $35\text{ cm}^2$.
    is_correct: false
  - text: $48\text{ cm}^2$.
    is_correct: false
  explicacion: $A = \frac{14 \cdot 10}{2} = 70\text{ cm}^2$.
- tipo: B
  titulo: Perpendicularidad en rombos
  enunciado: ¿Las diagonales de cualquier rombo son perpendiculares entre sí?
  respuesta: Sí
  explicacion: Sí. En todo rombo las diagonales se cortan en un ángulo exacto de $90^\circ$.
errores_frecuentes:
- '''Creer que las diagonales del rombo son de igual longitud.'''
- '''Olvidar dividir entre 2 las diagonales antes de aplicar el Teorema de Pitágoras para hallar el lado.'''
- '''Confundir el rombo con el romboide creyendo que el rombo tiene lados contiguos desiguales.'''
afirmaciones_verdaderas:
- '''En todo rombo, sus cuatro lados tienen la misma medida métrica.'''
- '''Las diagonales de un rombo son estrictamente perpendiculares entre sí.'''
- '''El área de un rombo equivale al semiproducto de sus diagonales: $A = \frac{D \cdot d}{2}$.'''
al_terminar_debes_poder: '**QUÉ:** Resolver problemas métricos y de áreas en rombos relacionando lados, diagonales y ángulos.


  **CÓMO:** Empleando $A = \frac{D \cdot d}{2}$, $s = \sqrt{(D/2)^2 + (d/2)^2}$ y $d_1 \perp d_2$.


  ![Síntesis de lados en el rombo](/static/img/nodos/propiedad-de-cuatro-lados-congruentes-en-el-rombo-resumen.svg)

  '
