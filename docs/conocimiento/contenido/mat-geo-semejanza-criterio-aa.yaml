semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.CRITERIO_AA
resumen_inicial: 'Criterio de semejanza AA: dos ángulos correspondientes congruentes:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: Así como existen criterios abreviados de congruencia, existen
  criterios abreviados de semejanza, que requieren mucha menos información que verificar
  las seis condiciones completas. El primero y más simple es el criterio AA.
explicacion_formal: '![Criterio de semejanza AA](/static/img/geometria/congruencia-semejanza/semejanza-criterio-aa.svg)


  ### Definición formal


  Si en $\triangle ABC$ y $\triangle A''B''C''$ se cumple $\angle A=\angle A''$ y
  $\angle B=\angle B''$, entonces $\triangle ABC\sim\triangle A''B''C''$.


  ### Desarrollo didáctico


  Basta con dos ángulos iguales, porque el tercer ángulo queda automáticamente determinado
  por la suma de 180°: si dos ángulos coinciden, el tercero también debe coincidir,
  garantizando que los tres ángulos sean iguales y, por lo tanto, los triángulos semejantes.'
