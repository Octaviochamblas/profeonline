semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.ADICION_DISTINTO_DENOMINADOR
resumen_inicial: La adición de fracciones de distinto denominador requiere homogenizarlas al m.c.m. de los denominadores antes de sumar sus numeradores.
explicacion_simple: 'No podemos sumar directamente fracciones que tienen distintos números abajo porque representan trozos de diferente tamaño. Primero debemos amplificar las fracciones para que compartan el mismo denominador (usando el m.c.m.), y luego sumamos los numeradores como de costumbre.


  ![Adición de fracciones de distinto denominador](/static/img/nodos/adicion-de-fracciones-de-distinto-denominador-intro.svg)'
explicacion_formal: 'Para $\frac{a}{b}, \frac{c}{d} \in \mathbb{Q}$ con $M = \operatorname{mcm}(b, d)$, la **Adición Heterogénea General** se expresa formalmente como:


  $$\frac{a}{b} + \frac{c}{d} = \frac{a \cdot \left(\frac{M}{b}\right) + c \cdot \left(\frac{M}{d}\right)}{M} = \frac{a \cdot d + b \cdot c}{b \cdot d}$$


  **Desglose de la fórmula:**

  - $M = \operatorname{mcm}(b, d)$: Mínimo común denominador.

  - $\frac{a \cdot d + b \cdot c}{b \cdot d}$: Fórmula directa derivada de usar el producto $b \cdot d$ como denominador común.


  > **Complemento didáctico:** Usar el m.c.m. en lugar del producto $b \cdot d$ evita trabajar con números innecesariamente grandes y simplifica el resultado final.'
definiciones_clave: '- **Adición de fracciones heterogéneas**: Suma de fracciones con denominadores distintos previa homogenización al m.c.m.'
propiedades_relaciones: '- **Invarianza por m.c.m.**: Usar el $\operatorname{mcm}(b, d)$ minimiza los valores de los numeradores en la suma.'
ejemplo_guiado:
  enunciado: 'Calcule la suma $\frac{1}{4} + \frac{2}{3}$ utilizando el mínimo común denominador.


    ![Ejemplo Adición de fracciones de distinto denominador](/static/img/nodos/adicion-de-fracciones-de-distinto-denominador-ejemplos.svg)'
  pasos:
  - 'Paso 1: Calcular $\operatorname{mcm}(4, 3) = 12$.'
  - 'Paso 2: Amplificar la primera fracción por 3: $\frac{1 \cdot 3}{4 \cdot 3} = \frac{3}{12}$.'
  - 'Paso 3: Amplificar la segunda fracción por 4: $\frac{2 \cdot 4}{3 \cdot 4} = \frac{8}{12}$.'
  - 'Paso 4: Sumar las fracciones homogéneas: $\frac{3 + 8}{12} = \frac{11}{12}$.'
  - 'Conclusión: $\frac{1}{4} + \frac{2}{3} = \frac{11}{12}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula directa para sumar a/b + c/d usando productos cruzados?
  choices:
  - text: (a · d + b · c) / (b · d)
    is_correct: true
  - text: (a + c) / (b + d)
    is_correct: false
  - text: (a · c) / (b · d)
    is_correct: false
  - text: (a - c) / b
    is_correct: false
  explanation: La alternativa correcta es '(a · d + b · c) / (b · d)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 1/4 + 2/3, ¿cuál fue la suma homogenizada a doceavos?
  choices:
  - text: 11/12
    is_correct: true
  - text: 3/7
    is_correct: false
  - text: 8/12
    is_correct: false
  - text: 5/12
    is_correct: false
  explanation: La alternativa correcta es '11/12'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar el denominador común mediante el $\operatorname{mcm}(b, d)$.'
- 'Paso 2: Amplificar cada numerador por el factor correspondiente ($M/b$ y $M/d$).'
- 'Paso 3: Sumar los numeradores obtenidos y simplificar el resultado.'
errores_correccion: '- **Error 1: Sumar numeradores arriba y denominadores abajo (ej: $\frac{1}{4} + \frac{2}{3} = \frac{3}{7}$).** **Cómo corregirlo:** La suma exige obligatoriamente HOMOGENIZAR denominadores primero.


  - **Error 2: Olvidar amplificar los numeradores al cambiar los denominadores.** **Cómo corregirlo:** Si se cambia el denominador a 12, cada numerador debe multiplicarse por su factor de amplificación.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule 1/2 + 1/3.
  alternativas:
  - 5/6
  - 2/5
  - 2/6
  respuesta: 5/6
  solucion_pasos:
  - $\frac{1 \cdot 3 + 1 \cdot 2}{6} = \frac{3+2}{6} = \frac{5}{6}$.
- titulo: Ejemplo 2
  enunciado: Calcule 2/5 + 3/10.
  alternativas:
  - 7/10
  - 5/15
  - 5/10
  respuesta: 7/10
  solucion_pasos:
  - 'mcm(5,10)=10. Amplificado: $2/5 = 4/10 \implies 4/10 + 3/10 = 7/10$.'
- titulo: ¿Se requiere homogenizar denominadores para sumar fracciones de distinto denominador?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un requisito indispensable de la adición en $\mathbb{Q}$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al cálculo de la operación con fracciones y su simplificación irreductible.
  - texto: No se puede calcular
    es_correcta: false
    retroalimentacion: Incorrecto, las operaciones en el cuerpo ℚ están bien definidas siempre que no se divida por cero.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa la suma/resta de numeradores o los productos cruzados aplicados.
- titulo: ¿Es 1/3 + 1/6 igual a 1/2?
  respuesta: Sí
  solucion_pasos:
  - Sí, $1/3 = 2/6 \implies 2/6 + 1/6 = 3/6 = 1/2$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al cálculo de la operación con fracciones y su simplificación irreductible.
  - texto: No se puede calcular
    es_correcta: false
    retroalimentacion: Incorrecto, las operaciones en el cuerpo ℚ están bien definidas siempre que no se divida por cero.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa la suma/resta de numeradores o los productos cruzados aplicados.
errores_frecuentes:
- Sumar fracciones de distinto denominador se realiza sumando directamente numeradores y denominadores.
- El mínimo común denominador se obtiene multiplicando los numeradores entre sí.
- Sumar $1/2 + 1/3$ produce la fracción $2/5$.
- No es necesario amplificar el numerador cuando se cambia el denominador de una fracción.
- La adición de fracciones de distinto denominador da como resultado un número entero siempre.
afirmaciones_verdaderas:
- Para sumar fracciones de distinto denominador se deben homogenizar previamente mediante el m.c.m.
- La fórmula general de adición heterogénea es $\frac{a}{b} + \frac{c}{d} = \frac{a \cdot d + b \cdot c}{b \cdot d}$.
al_terminar_debes_poder: '**QUÉ:** Sumar fracciones con denominadores distintos mediante homogeneización o producto cruzado.


  **CÓMO:** Calculando el mínimo común múltiplo $M = \text{mcm}(b, d)$ para amplificar cada fracción a denominador común $M$, o aplicando la fórmula cruzada $\frac{a}{b} + \frac{c}{d} = \frac{a \cdot d + b \cdot c}{b \cdot d}$.


  ![Resumen Adición de fracciones de distinto denominador](/static/img/nodos/adicion-de-fracciones-de-distinto-denominador-resumen.svg)'
