semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.ADICION_DISTINTO_DENOMINADOR
resumen_inicial: "Para sumar fracciones con distinto denominador, se homogenizan a un denominador común (mediante el m.c.m.) y luego se suman los nuevos numeradores."
explicacion_simple: |
  Si quieres sumar $\frac{1}{2}$ pizza con $\frac{1}{3}$ pizza, no puedes decir que tienes 2 tercios ni 2 medios, porque los trozos son de tamaños distintos. Lo que haces es cortar ambas pizzas en trozos del mismo tamaño (sextos): $\frac{1}{2}$ equivale a 3 sextos ($\frac{3}{6}$) y $\frac{1}{3}$ equivale a 2 sextos ($\frac{2}{6}$). Ahora que los trozos miden lo mismo, los juntas: $3 + 2 = 5$ sextos ($\frac{5}{6}$). El truco consiste siempre en **buscar un denominador común antes de sumar**.
explicacion_formal: |
  Formalmente, dadas dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$ con $b, d \in \mathbb{Z}^+$ y $b \neq d$:

  1. Se determina el Mínimo Común Múltiplo de los denominadores: $M = \text{mcm}(b, d)$.
  2. Se amplifica cada fracción al denominador común $M$:
  $$\frac{a}{b} = \frac{a \cdot (M/b)}{M} \quad \text{y} \quad \frac{c}{d} = \frac{c \cdot (M/d)}{M}$$
  3. Se realiza la suma sobre el denominador común $M$:
  $$\frac{a}{b} + \frac{c}{d} = \frac{a \cdot (M/b) + c \cdot (M/d)}{M}$$

  Fórmula alternativa del producto cruzado: $\frac{a}{b} + \frac{c}{d} = \frac{a \cdot d + b \cdot c}{b \cdot d}$.
definiciones_clave: |
  - **Adición de distinto denominador**: Suma que requiere previa homogenización a un común denominador $M$.
  - **Mínimo Común Denominador ($M$)**: Valor $M = \text{mcm}(b, d)$ usado para minimizar los cálculos numéricos.
  - **Factores de amplificación**: Cocientes $\frac{M}{b}$ y $\frac{M}{d}$ para adaptar cada numerador.
propiedades_relaciones: |
  - **Conmutatividad**: $\frac{a}{b} + \frac{c}{d} = \frac{c}{d} + \frac{a}{b}$.
  - **Asociatividad**: $(\frac{a}{b} + \frac{c}{d}) + \frac{e}{f} = \frac{a}{b} + (\frac{c}{d} + \frac{e}{f})$.
  - **Equivalencia de métodos**: Usar $M = \text{mcm}(b, d)$ o la fórmula directa $\frac{a \cdot d + b \cdot c}{b \cdot d}$ produce siempre la misma fracción simplificada.
ejemplo_guiado:
  enunciado: "Calcula la suma $\\frac{3}{4} + \\frac{2}{5}$ utilizando el m.c.m. de los denominadores y simplifica el resultado si corresponde."
  pasos:
    - "Calcular el m.c.m. de los denominadores $4$ y $5$: $\\text{mcm}(4, 5) = 20$."
    - "Amplificar la primera fracción por $5$: $\\frac{3 \\cdot 5}{4 \\cdot 5} = \\frac{15}{20}$."
    - "Amplificar la segunda fracción por $4$: $\\frac{2 \\cdot 4}{5 \\cdot 4} = \\frac{8}{20}$."
    - "Sumar los numeradores homogenizados: $\\frac{15 + 8}{20} = \\frac{23}{20}$."
    - 'Verificar irreductibilidad: $\text{MCD}(23, 20) = 1$, el resultado final es $\frac{23}{20}$ (o $1\frac{3}{20}$).'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el primer paso obligatorio para sumar dos fracciones con denominadores diferentes $\\frac{a}{b} + \\frac{c}{d}$?"
    choices:
      - {text: "Homogenizar ambas fracciones a un denominador común calculando el m.c.m. entre $b$ y $d$.", is_correct: true}
      - {text: "Sumar los numeradores $a+c$ y sumar los denominadores $b+d$ directamente.", is_correct: false}
      - {text: "Multiplicar los dos numeradores entre sí.", is_correct: false}
      - {text: "Restar el menor denominador del mayor.", is_correct: false}
    explanation: "La correcta es Homogenizar ambas fracciones a un denominador común calculando el m.c.m. entre $b$ y $d$.: iguala las unidades fraccionarias para poder acumular los numeradores."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Al resolver $\\frac{1}{6} + \\frac{3}{8}$, ¿cuál es el resultado simplificado?"
    choices:
      - {text: "$\\frac{13}{24}$", is_correct: true}
      - {text: "$\\frac{4}{14}$", is_correct: false}
      - {text: "$\\frac{20}{48}$", is_correct: false}
      - {text: "$\\frac{1}{2}$", is_correct: false}
    explanation: "La correcta es \\frac{13}{24}: $\\text{mcm}(6, 8) = 24$; amplificando resulta $\\frac{4}{24} + \\frac{9}{24} = \\frac{13}{24}$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Hallar $M = \text{mcm}(b, d)$ de los denominadores $b$ y $d$."
  - "Paso 2: Dividir $M$ entre cada denominador original para obtener el factor de amplificación."
  - 'Paso 3: Amplificar los numeradores correspondientes y formar la suma $\frac{a \cdot (M/b) + c \cdot (M/d)}{M}$.'
  - "Paso 4: Simplificar la fracción resultante a su forma irreductible."
errores_correccion: |
  El error cometido con mayor frecuencia por los estudiantes es sumar directo hacia al lado: hacer $\frac{a}{b} + \frac{c}{d} = \frac{a+c}{b+d}$. ¡Esto viola las reglas básicas de las fracciones! **Nunca sumes denominadores**.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Suma $\\frac{2}{3} + \\frac{1}{4}$."
    alternativas:
      - "$\\frac{11}{12}$"
      - "$\\frac{3}{7}$"
      - "$\\frac{2}{12}$"
    respuesta: "$\\frac{11}{12}$"
    solucion_pasos:
      - "$\\text{mcm}(3, 4) = 12$."
      - "Homogenizamos: $\\frac{2}{3} = \\frac{8}{12}$ y $\\frac{1}{4} = \\frac{3}{12}$."
      - "Sumamos: $\\frac{8 + 3}{12} = \\frac{11}{12}$."
  - titulo: "Ejemplo 2"
    enunciado: "Para preparar una mezcla, se juntan $\\frac{1}{5}$ L de pintura azul y $\\frac{3}{10}$ L de pintura blanca. ¿Cuántos litros de mezcla se obtienen?"
    alternativas:
      - "$\\frac{1}{2} L (o \\frac{5}{10} L).$"
      - "$\\frac{4}{15} L.$"
      - "$\\frac{4}{5} L.$"
    respuesta: "$\\frac{1}{2} L (o \\frac{5}{10} L).$"
    solucion_pasos:
      - "$\\text{mcm}(5, 10) = 10$."
      - "Homogenizamos $\\frac{1}{5} = \\frac{2}{10}$."
      - "Suma: $\\frac{2}{10} + \\frac{3}{10} = \\frac{5}{10} = \\frac{1}{2}$ L."
  - titulo: "¿La fórmula del producto cruzado $\\frac{a \\cdot d + b \\cdot c}{b \\cdot d}$ da el mismo resultado que usar el m.c.m.?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, aunque al usar $b \\cdot d$ a veces es necesario simplificar la fracción resultante al final."
  - titulo: "¿Se puede aplicar este procedimiento para sumar tres o más fracciones de distinto denominador?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, calculando el m.c.m. de todos los denominadores involucrados simultáneamente."
errores_frecuentes:
  - "Sumar los numeradores y los denominadores directamente en línea recta ($\frac{a+c}{b+d}$)."
  - "Olvidar amplificar los numeradores al cambiar el denominador por el m.c.m."
  - "Cometer errores aritméticos al calcular el mínimo común múltiplo."
  - "Multiplicar las fracciones en lugar de sumarlas."
  - "No reducir la fracción resultante a su versión irreductible."
afirmaciones_verdaderas:
  - "Para sumar fracciones de distinto denominador es imprescindible homogenizarlas previamente a un denominador común."
  - "La suma $\\frac{a}{b} + \\frac{c}{d}$ se puede calcular como $\\frac{a \\cdot d + b \\cdot c}{b \\cdot d}$."
al_terminar_debes_ponder: |
  Debes ser capaz de sumar cualquier par o conjunto de fracciones de distinto denominador utilizando el m.c.m. o productos cruzados y simplificar el resultado.
