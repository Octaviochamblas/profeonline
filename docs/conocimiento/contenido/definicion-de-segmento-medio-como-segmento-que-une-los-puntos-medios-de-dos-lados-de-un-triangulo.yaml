  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar los puntos medios de dos lados del triángulo ($M_1$ y $M_2$).'
- 'Paso 2: Unir ambos puntos medios mediante un segmento rectilíneo.'
- 'Paso 3: Nombrar el segmento medio con las letras de los puntos medios correspondientes.'
- 'Paso 4: Si se requiere el triángulo medial completo, unir los tres puntos medios.'
errores_correccion: No confundas el segmento medio (une 2 puntos medios) con la transversal
  de gravedad (une 1 vértice con 1 punto medio).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si los puntos $D$ y $E$ son los puntos medios de los lados $AB$ y $AC$
    respectivamente en el triángulo $ABC$, ¿cómo se denomina el segmento $DE$?
  alternativas:
  - Segmento medio o base media
  - Transversal de gravedad
  - Simetral
  respuesta: Segmento medio o base media
  solucion_pasos:
  - Por definición, el segmento que une los puntos medios de dos lados es el segmento
    medio.
- titulo: Ejemplo 2
  enunciado: ¿Los extremos de un segmento medio pueden ser vértices del triángulo?
  alternativas:
  - No, sus extremos siempre son puntos medios sobre los lados
  - Sí, siempre pasa por el vértice superior
  - Solo en triángulos equiláteros
  respuesta: No, sus extremos siempre son puntos medios sobre los lados
  solucion_pasos:
  - Los extremos son puntos medios de los lados y están en el interior de los segmentos
    de los lados, no en los vértices.
- titulo: ¿Un triángulo tiene exactamente tres segmentos medios?
  respuesta: Sí
  solucion_pasos:
  - Sí, combinando los 3 lados de 2 en 2 se obtienen exactamente 3 segmentos medios.
- titulo: ¿El segmento medio une un vértice con el lado opuesto?
  respuesta: 'No'
  solucion_pasos:
  - No, el que une un vértice con el lado opuesto es la transversal de gravedad, altura
    o bisectriz.
errores_frecuentes:
- Confundir el segmento medio con la transversal de gravedad (mediana).
- Creer que el segmento medio une un vértice con un punto medio.
- Confundir el segmento medio con la simetral de un lado.
- Pensar que solo existe un segmento medio por triángulo.
- Olvidar que los puntos deben ser exactamente los puntos medios.
afirmaciones_verdaderas:
- El segmento medio une los puntos medios de dos lados de un triángulo.
- Todo triángulo posee exactamente tres segmentos medios que forman el triángulo medial.
al_terminar_debes_poder: '**QUÉ:** Definir e identificar los segmentos medios (bases
  medias) de un triángulo.


  **CÓMO:** Ubicando los puntos medios de los lados ($M_1, M_2$) y trazando el segmento
  que los conecta ($\overline{M_1 M_2}$).


  ![Resumen de Segmento Medio](/static/img/nodos/definicion-de-segmento-medio-como-segmento-que-une-los-puntos-medios-de-dos-lados-de-un-triangulo-resumen.svg)

  '
