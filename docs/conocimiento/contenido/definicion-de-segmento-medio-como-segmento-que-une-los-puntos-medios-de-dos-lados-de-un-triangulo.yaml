semantic_id: MAT.GEO.SEGMENTO_MEDIO.DEFINICION
resumen_inicial: El segmento medio (o base media) de un triángulo es el segmento de
  recta que une los puntos medios de dos de sus lados.
explicacion_simple: '![Segmento Medio](/static/img/nodos/definicion-de-segmento-medio-como-segmento-que-une-los-puntos-medios-de-dos-lados-de-un-triangulo-intro.svg)


  Para trazar un segmento medio:


  - **Marcas la mitad de dos lados**: Encuentras el punto medio de un lado ($M_c$)
  y el punto medio de otro lado ($M_b$).

  - **Trazas la línea que los une**: Conectas esos dos puntos medios con una regla.

  - **Existen 3 en total**: Como el triángulo tiene 3 lados, puedes formar 3 parejas
  de puntos medios y por ende 3 segmentos medios.

  '
explicacion_formal: '### Definición formal

  En un triángulo $\Delta ABC$, un **segmento medio** (o base media) es el segmento
  rectilíneo $\overline{M_c M_b}$ cuyos extremos son los puntos medios de dos de sus
  lados:


  $$\overline{M_c M_b} \quad \text{donde} \quad M_c = \frac{A+B}{2} \in \overline{AB}
  \quad \land \quad M_b = \frac{A+C}{2} \in \overline{AC}$$


  ### Desglose simbólico y geométrico

  - $M_c, M_b$: Puntos medios de los lados laterales $\overline{AB}$ y $\overline{AC}$.

  - Tres segmentos medios: $\{\overline{M_b M_c}, \overline{M_a M_c}, \overline{M_a
  M_b}\}$.

  - Triángulo medial: Los tres segmentos medios forman los lados del triángulo medial
  interior $\Delta M_a M_b M_c$.


  ### Síntesis didáctica

  El segmento medio conecta los puntos medios de dos lados, formando una estructura
  proporcional y paralela al tercer lado.'
definiciones_clave: '- **Segmento medio (Base media)**: Segmento que une los puntos
  medios de dos lados de un triángulo.

  - **Puntos medios ($M_a, M_b, M_c$)**: Puntos que dividen exactamente por la mitad
  a los lados $BC, AC, AB$.

  - **Triángulo medial**: Triángulo formado al unir los tres puntos medios de los
  lados de un triángulo original.

  '
propiedades_relaciones: '- **Extremos en puntos medios**: $M_c = \text{P.M.}(\overline{AB})$
  y $M_b = \text{P.M.}(\overline{AC})$.

  - **Tres segmentos medios**: En todo triángulo existen exactamente 3 segmentos medios
  distintos.

  - **Triángulo medial inscrito**: Los tres segmentos medios forman los lados del
  triángulo medial $\Delta M_a M_b M_c$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Segmento Medio](/static/img/nodos/definicion-de-segmento-medio-como-segmento-que-une-los-puntos-medios-de-dos-lados-de-un-triangulo-ejemplos.svg)


    En un triángulo $ABC$, el lado $AB$ mide $10\text{ cm}$ y el lado $AC$ mide $14\text{
    cm}$. Se ubica el punto medio $M_c$ sobre $AB$ y el punto medio $M_b$ sobre $AC$,
    y se traza el segmento $\overline{M_c M_b}$. ¿A qué distancia de $A$ se encuentra
    cada extremo del segmento medio?

    '
  pasos:
  - 'Paso 1: Recordar la definición de punto medio: divide el lado exactamente en
    dos partes iguales.'
  - 'Paso 2: Calcular la distancia de $A$ a $M_c$: $AM_c = \frac{AB}{2} = \frac{10}{2}
    = 5\text{ cm}$.'
  - 'Paso 3: Calcular la distancia de $A$ a $M_b$: $AM_b = \frac{AC}{2} = \frac{14}{2}
    = 7\text{ cm}$.'
  - 'Paso 4: Concluir que el extremo $M_c$ se ubica a $5\text{ cm}$ de $A$ y el extremo
    $M_b$ a $7\text{ cm}$ de $A$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué puntos une exactamente un segmento medio en un triángulo?
  choices:
  - text: Los puntos medios de dos lados del triángulo
    is_correct: true
  - text: Un vértice con el punto medio del lado opuesto
    is_correct: false
  - text: Los tres vértices del triángulo
    is_correct: false
  - text: El ortocentro con el circuncentro
    is_correct: false
  explanation: El segmento medio une los puntos medios de dos lados del triángulo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántos segmentos medios se pueden trazar en total en cualquier triángulo?
  choices:
  - text: Exactamente 3 segmentos medios
    is_correct: true
  - text: 1 segmento medio
    is_correct: false
  - text: 6 segmentos medios
