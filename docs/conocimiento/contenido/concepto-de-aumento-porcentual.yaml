procedimiento:
- 'Paso 1: Identifica el porcentaje de aumento ($A\%$).'
- 'Paso 2: Suma ese aumento al $100\%$ base (ej. $100 + 15 = 115\%$).'
- 'Paso 3: Multiplica la cantidad original por el factor decimal correspondiente (ej. $1.15$)
  para hallar el valor final en un solo paso.'
errores_correccion: Evita confundir los datos de entrada al operar con concepto de aumento
  porcentual.
ejemplos:
- titulo: Aumento de precio
  enunciado: Un pasaje de bus de $10.000 sube un 15% en temporada alta. ¿Cuál es el nuevo
    precio?
  solucion_pasos:
  - 'Método 1 paso: Nuevo precio es $100\% + 15\% = 115\%$.'
  - 'Decimal asociado: $1.15$.'
  - 'Multiplicamos: $10.000 \cdot 1.15 = 11.500$.'
  - El nuevo precio es $11.500.
- titulo: Ejemplo 2
  enunciado: Un sueldo de $500.000 sube un 10%. ¿Cuál es el nuevo sueldo?
  alternativas:
  - '550.000'
  - '510.000'
  - '600.000'
  respuesta: '550.000'
  solucion_pasos:
  - 500.000 por 1,10 es igual a 550.000.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el factor multiplicador de un aumento del 8%?
  alternativas:
  - 1,08
  - 0,08
  - '8'
  respuesta: 1,08
  solucion_pasos:
  - 100 más 8 es 108%, o sea 1,08.
- titulo: ¿Un aumento del 50% se calcula multiplicando por 1,5?
  respuesta: Sí
  solucion_pasos:
  - Porque 100% más 50% es igual a 150%, es decir 1,5.
errores_frecuentes:
- Calcular el 15% y responder que ese es el nuevo precio, olvidando sumar el valor original.
- Creer que aumentar un 100% significa que el valor queda igual (aumentar un 100% significa
  doblar el precio, pasando a 200%).
- Calcular solo el porcentaje de aumento y responder eso como si fuera el nuevo precio, olvidando
  sumar el valor original.
- Creer que aumentar un 100% significa que el valor queda igual, cuando en realidad significa
  duplicarlo.
- Confundir el factor de un aumento del 5% (1,05) con el de un 50% (1,5).
afirmaciones_verdaderas:
- La propiedad de concepto de aumento porcentual preserva la consistencia lógica.
- El factor multiplicador de un aumento porcentual siempre es mayor que 1.
al_terminar_debes_poder: Resolver problemas aplicados que involucren concepto de aumento porcentual.
