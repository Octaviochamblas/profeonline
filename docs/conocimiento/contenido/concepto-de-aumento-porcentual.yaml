semantic_id: MAT.NUM.VARIACION_PORCENTUAL.AUMENTO_CONCEPTO
estado: publicado
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES
resumen_inicial: El aumento porcentual consiste en incrementar una cantidad base $V_i$
  sumando un porcentaje proporcional de sí misma, lo que equivale a multiplicar por
  el factor de crecimiento $F = 1 + \frac{a}{100}$.
explicacion_simple: 'Cuando una cantidad experimenta un aumento porcentual, su valor
  final supera al inicial porque se le suma una fracción de sí misma. Por ejemplo,
  si un precio de $\$10.000$ sube un $15\%$, no se suman 15 pesos, sino el $15\%$ de
  $\$10.000$ ($\$1.500$), resultando en $\$11.500$. El cálculo rápido se realiza multiplicando
  directamente por $1 + 0,15 = 1,15$.


  ![concepto-de-aumento-porcentual](/static/img/nodos/concepto-de-aumento-porcentual-intro.svg)

  '
explicacion_formal: 'Para un valor inicial $V_i > 0$ y una tasa de incremento $a >
  0$, el **Aumento Porcentual** se define como el valor final $V_f$ obtenido tras
  sumar la variación absoluta $\Delta V = \left(\frac{a}{100}\right) \cdot V_i$ a
  la base:


  $$V_f = V_i + \left(\frac{a}{100} \cdot V_i\right) = V_i \cdot \left(1 + \frac{a}{100}\right)
  = V_i \cdot F_{\text{aum}}$$


  Donde $F_{\text{aum}} = 1 + a_{\text{dec}} > 1$ es el **factor multiplicador de
  crecimiento**.'
definiciones_clave: '- **Aumento porcentual**: Incremento proporcional a la cantidad
  base mediante el factor $F = 1 + \frac{a}{100}$.

  - **Factor de crecimiento**: Número decimal estrictamente mayor a 1 que condensa
  la suma del 100% original más el porcentaje de alza.'
propiedades_relaciones: '- **Magnitud final**: $V_f > V_i$ siempre que la tasa de
  aumento $a > 0$.

  - **Linealidad**: Duplicar el valor inicial manteniendo la tasa de aumento duplica
  exactamente el monto del incremento.'
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/concepto-de-aumento-porcentual-resumen.svg)


  QUÉ: Definir y calcular aumentos porcentuales sobre cantidades base. CÓMO: Multiplicando
  el valor inicial $V_i$ por el factor de crecimiento $F = 1 + \frac{a}{100}$ para
  obtener directamente el valor final $V_f = V_i \cdot (1 + a_{\text{dec}})$.'
