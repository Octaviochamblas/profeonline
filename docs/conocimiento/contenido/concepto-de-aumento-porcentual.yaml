procedimiento:
- 'Paso 1: Identificar el valor inicial $V_i$ y la tasa de aumento porcentual $a\%$.'
- 'Paso 2: Calcular el factor decimal de crecimiento $F = 1 + \frac{a}{100}$.'
- 'Paso 3: Multiplicar $V_f = V_i \cdot F$ para obtener el nuevo valor incrementado.'
ejemplo_guiado:
  enunciado: Un sueldo de $\$500.000$ recibe un reajuste salarial del $12\%$. Calcule
    el nuevo sueldo mensual.
  pasos:
  - 'Paso 1: Identificar el valor inicial $V_i = 500.000$ y la tasa $a = 12\%$.'
  - 'Paso 2: Determinar el factor multiplicador: $F = 1 + 0,12 = 1,12$.'
  - 'Paso 3: Multiplicar el sueldo inicial por el factor: $V_f = 500.000 \cdot 1,12
    = 560.000$.'
  - 'Conclusión: El nuevo sueldo mensual tras el reajuste es de $\$560.000$.'
  imagen: /static/img/nodos/concepto-de-aumento-porcentual-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el factor multiplicador correspondiente a un aumento del $25\%$?
  choices:
  - text: $1,25$
    is_correct: true
  - text: $0,25$
    is_correct: false
  - text: $0,75$
    is_correct: false
  - text: $2,50$
    is_correct: false
  explanation: El factor de aumento es $F = 1 + \frac{25}{100} = 1 + 0,25 = 1,25$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una cuenta de $\$40.000$ sube un $5\%$, ¿cuál es el nuevo monto?
  choices:
  - text: $\$42.000$
    is_correct: true
  - text: $\$40.200$
    is_correct: false
  - text: $\$45.000$
    is_correct: false
  - text: $\$48.000$
    is_correct: false
  explanation: $V_f = 40.000 \cdot (1 + 0,05) = 40.000 \cdot 1,05 = 42.000$.
  reinforcement_section: Ejemplo guiado
errores_correccion: '- **Error 1: Sumar el porcentaje como si fuese dinero plano (ej:
  $500.000 + 12 = 500.012$).** **Cómo corregirlo:** Recordar que el porcentaje representa
  una fracción relativa sobre la base ($12\% \text{ de } 500.000 = 60.000$).

  - **Error 2: Olvidar sumar la base inicial.** **Cómo corregirlo:** El factor multiplicador
  $(1 + a_{\text{dec}})$ asegura sumar el 100% original en una sola operación.'
ejemplos:
- titulo: Aumento en matrícula escolar
  enunciado: Un colegio con $800$ estudiantes matriculados aumenta su capacidad en
    un $15\%$ para el próximo año. ¿Cuántos alumnos podrá recibir en total?
  alternativas:
  - $920$ estudiantes
  - $815$ estudiantes
  - $950$ estudiantes
  - $880$ estudiantes
  respuesta: $920$ estudiantes
  solucion_pasos:
  - Identificar la base $V_i = 800$ y el aumento $a = 15\%$.
  - 'Calcular el factor de crecimiento: $F = 1 + 0,15 = 1,15$.'
  - 'Multiplicar: $V_f = 800 \cdot 1,15 = 920$ estudiantes.'
- titulo: Recargo por entrega a domicilio
  enunciado: Una compra de $\$20.000$ tiene un recargo del $8\%$ por despacho express.
    ¿Cuál es el total a pagar?
  alternativas:
  - $\$21.600$
  - $\$20.800$
  - $\$22.400$
  - $\$21.200$
  respuesta: $\$21.600$
  solucion_pasos:
  - 'Calcular el factor de recargo: $1 + 0,08 = 1,08$.'
  - 'Multiplicar: $20.000 \cdot 1,08 = 21.600$ pesos.'
- titulo: ¿Un aumento del $100\%$ duplica la cantidad inicial?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $F = 1 + \frac{100}{100} = 1 + 1 = 2$, por lo que $V_f = 2 \cdot V_i$.
- titulo: ¿Un aumento del $0\%$ modifica el valor inicial?
  respuesta: 'No'
  solucion_pasos:
  - No, porque $F = 1 + 0 = 1$, por lo que $V_f = V_i \cdot 1 = V_i$.
errores_frecuentes:
- Confundir el valor del aumento (la ganancia o reajuste) con el valor final total.
- Calcular el aumento sobre el valor final en lugar del valor base inicial.
- Multiplicar por $0,a$ en lugar de $(1 + 0,a)$ al buscar el valor final.
afirmaciones_verdaderas:
- El factor multiplicativo de un aumento porcentual siempre es estrictamente mayor
  que 1.
- Un aumento del $a\%$ equivale a calcular el $(100 + a)\%$ de la cantidad original.
