semantic_id: MAT.NUM.VARIACION_PORCENTUAL.AUMENTO_CONCEPTO
resumen_inicial: 'Concepto de aumento porcentual: concepto y propiedades fundamentales en
  Variaciones porcentuales.'
explicacion_simple: Cuando te suben el sueldo, el nuevo monto es tu sueldo antiguo MÁS un
  pedacito extra. Un aumento porcentual es sumar un porcentaje sobre un 100% que ya tenías.
explicacion_formal: "El **aumento porcentual** ocurre cuando una cantidad inicial crece. \n\
  Existen dos formas matemáticas de calcular un valor después de un aumento del $A\\%$:\n\n\
  **Método de 2 pasos (Suma):**\n1. Calculas de cuánto es el aumento: $Valor \\cdot (A / 100)$\n\
  2. Se lo sumas al valor original: $Valor + Aumento$\n\n**Método de 1 paso (Factor de variación):**\n\
  Como tienes el 100% original y le sumas un $A\\%$, en realidad pasas a tener el $(100 +\
  \ A)\\%$ del valor.\n- Si algo aumenta un $20\\%$, el nuevo precio es el $120\\%$ del original.\n\
  - Multiplicas el original por la fracción $120/100$ (o el decimal $1.20$)."
definiciones_clave: '- **Concepto de aumento porcentual**: Elemento central dentro del estudio
  de Variaciones porcentuales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a concepto de aumento porcentual.'
ejemplo_guiado:
  enunciado: Un producto que costaba $8.000 sube un 25%. Calcula el nuevo precio usando el
    factor multiplicador.
  pasos:
  - Identifico que un aumento del 25% significa quedar con el 125% del valor original.
  - 'Calculo el factor multiplicador: 100 más 25 es igual a 125, es decir 1,25.'
  - 'Multiplico: 8.000 por 1,25 es igual a 10.000. El nuevo precio es 10.000 pesos.'
