resumen_inicial: El aumento porcentual suma una fracción equivalente $(1 + p)$ al
  valor inicial $V_i$, incrementando su magnitud hasta un nuevo valor final $V_f =
  V_i \cdot (1 + p)$ ($p = P/100$).
explicacion_simple: Un aumento porcentual significa que una cantidad original crece
  agregándole un porcentaje extra de sí misma. Para calcular el resultado directamente
  de una sola vez, multiplicamos el valor original por $1$ más el porcentaje expresado
  en decimal (por ejemplo, multiplicar por $1,15$ para un aumento del 15%).
explicacion_formal: 'Para un valor inicial $V_i > 0$ y una tasa de incremento $P\%$,
  el **Aumento Porcentual** se define mediante el factor multiplicativo de crecimiento
  $F_{aum} = 1 + \frac{P}{100}$:


  $$V_f = V_i + \left(\frac{P}{100} \cdot V_i\right) = V_i \cdot \left(1 + \frac{P}{100}\right)
  = V_i \cdot (1 + p)$$


  **Factor multiplicativo:**

  - Para $P\% = 20\% \implies F_{aum} = 1 + 0,20 = 1,20$ (el valor final es el $120\%$
  del inicial).'
definiciones_clave: '- **Aumento porcentual**: Incremento proporcional expresado por
  el factor $F_{aum} = 1 + \frac{P}{100}$.'
propiedades_relaciones: '- **Factor de crecimiento**: $F_{aum} > 1$ para todo aumento
  con $P > 0$.'
ejemplo_guiado:
  enunciado: Un sueldo de \$500.000 recibe un aumento del $8\%$. Calcule el nuevo
    sueldo.
  pasos:
  - 'Paso 1: Determinar el factor de aumento: $F = 1 + 0,08 = 1,08$.'
  - 'Paso 2: Multiplicar el valor inicial por el factor: $V_f = 500.000 \cdot 1,08$.'
  - 'Paso 3: Resolver el producto: $500.000 \cdot 1,08 = 540.000$.'
  - 'Conclusión: El nuevo sueldo es \$540.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el factor multiplicativo Faum para calcular el valor final con
    un aumento del P%?
  choices:
  - text: Faum = 1 + (P / 100)
    is_correct: true
  - text: Faum = 1 - (P / 100)
    is_correct: false
  - text: Faum = P / 100
    is_correct: false
  - text: Faum = 100 · P
    is_correct: false
  explanation: La alternativa correcta es 'Faum = 1 + (P / 100)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el sueldo de $500.000 con aumento del 8%, ¿cuál
    fue el nuevo sueldo?
  choices:
  - text: 540.000 $
    is_correct: true
  - text: 508.000 $
    is_correct: false
  - text: 580.000 $
    is_correct: false
  - text: 548.000 $
    is_correct: false
  explanation: La alternativa correcta es '540.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir y calcular un aumento
  porcentual multiplicando el valor inicial por el factor de crecimiento $F_{aum}
  = 1 + \frac{P}{100}$.
semantic_id: MAT.NUM.VARIACION_PORCENTUAL.AUMENTO_CONCEPTO
procedimiento:
- 'Paso 1: Identificar la tasa de variación $P\%$ y determinar si es aumento ($1 +
  p$) o descuento ($1 - p$).'
- 'Paso 2: Multiplicar el valor inicial por el factor multiplicativo correspondiente.'
- 'Paso 3: Resolver numéricamente y verificar que el resultado final responda a la
  situación planteada.'
errores_correccion: '- **Error 1: Sumar o restar porcentajes sucesivos directamente
  (pensar que $-20\%$ y $-10\%$ dan $-30\%$).** **Cómo corregirlo:** Los porcentajes
  sucesivos se MULTIPLICAN por sus factores decimales ($0,80 \cdot 0,90 = 0,72 \implies
  -28\%$).


  - **Error 2: Usar el valor final como denominador al calcular la variación porcentual.**
  **Cómo corregirlo:** El denominador para el cambio relativo es SIEMPRE el valor
  inicial $V_i$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.VARIACION_PORCENTUAL.AUMENTO_CONCEPTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de factores de variación porcentual.
- titulo: Ejemplo 2
  enunciado: Verificación de factor multiplicativo.
  alternativas:
  - Cumple el factor
  - No cumple
  - Indeterminado
  respuesta: Cumple el factor
  solucion_pasos:
  - Demostración formal por $1 \pm p$.
- titulo: ¿Equivale el IVA en Chile a multiplicar el neto por 1,19?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $1 + 0,19 = 1,19$.
- titulo: ¿Altera el orden en que se aplican dos descuentos sucesivos el precio final?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa del producto de factores.
errores_frecuentes:
- Sumar directamente dos porcentajes de descuento sucesivos aplicados sobre un mismo
  producto.
- Utilizar el precio final como el denominador de referencia al calcular la variación
  porcentual relativa.
- Dividir por 0,19 para extraer el Impuesto al Valor Agregado (IVA) de un precio Bruto.
- Un descuento del $20\%$ seguido de un aumento del $20\%$ devuelve el producto a
  su precio original.
- Restar el número entero del porcentaje al precio sin convertirlo a su factor decimal
  $1 - d$.
afirmaciones_verdaderas:
- El aumento o descuento porcentual se calcula directamente multiplicando el valor
  inicial por el factor $(1 \pm p)$.
- Dos descuentos sucesivos del $a\%$ y $b\%$ equivalen al factor acumulado $(1 - a/100)(1
  - b/100)$.
