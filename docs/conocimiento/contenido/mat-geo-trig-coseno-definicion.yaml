semantic_id: MAT.GEO.TRIGONOMETRIA_BASICA.COSENO_DEFINICION
resumen_inicial: 'Definición del coseno de un ángulo agudo como razón cateto adyacente
  / hipotenusa: conceptos, teoremas, propiedades geométricas y cálculo en Perímetros,
  Áreas y Teoremas.'
explicacion_simple: 'Junto al seno, la segunda razón trigonométrica fundamental de
  un ángulo agudo es el coseno, que involucra el otro cateto: el adyacente.'
explicacion_formal: '![Definición del coseno](/static/img/geometria/areas-pitagoras/trig-coseno-definicion.svg)


  ### Definición formal


  Dado un ángulo agudo $\alpha$ en un triángulo rectángulo, $\cos(\alpha)=\frac{\text{cateto
  adyacente a }\alpha}{\text{hipotenusa}}$.


  ### Desarrollo didáctico


  En un triángulo rectángulo con cateto adyacente a α de 4 cm e hipotenusa de 5 cm,
  $\cos(\alpha)=\frac{4}{5}=0,8$. El cateto adyacente es el que sí toca al ángulo
  α (sin ser la hipotenusa), a diferencia del cateto opuesto usado en el seno.'
definiciones_clave: '- **Definición del coseno de un ángulo agudo como razón cateto
  adyacente / hipotenusa**: Elemento o propiedad fundamental en el estudio de perímetros,
  áreas y teoremas.'
