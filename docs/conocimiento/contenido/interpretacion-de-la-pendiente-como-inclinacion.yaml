semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_INCLINACION
resumen_inicial: 'Interpretación de la pendiente como inclinación: conceptos, representación
  y propiedades en Función constante y función lineal.'
explicacion_simple: Cuanto más grande (en valor absoluto) es la pendiente, más empinada
  se ve la recta; cuanto más cercana a cero, más se acerca a la horizontal.
explicacion_formal: '### Definición formal


  Para dos rectas no verticales con pendientes $m_1$ y $m_2$, se cumple que $|m_1|
  > |m_2|$ si y solo si la primera recta forma un ángulo mayor con la horizontal que
  la segunda. El caso límite $|m| \to \infty$ corresponde a una recta vertical (sin
  pendiente definida), y $m=0$ corresponde a una recta horizontal.


  ### Desarrollo didáctico


  Piensa en subir una cuesta: una pendiente de $m=5$ es una subida empinada (subes
  5 metros por cada metro que avanzas), mientras que $m=0{,}1$ es casi plana (subes
  apenas 0,1 metros por cada metro).


  Comparando $y=5x$ con $y=0{,}5x$: ambas pasan por el origen, pero la primera sube
  mucho más rápido que la segunda al mismo avance horizontal, por lo que se ve visualmente
  más inclinada.'
definiciones_clave: '- **Interpretación de la pendiente como inclinación**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a interpretación de la pendiente como inclinación.'
