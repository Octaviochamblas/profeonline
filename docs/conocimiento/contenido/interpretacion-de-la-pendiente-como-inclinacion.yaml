semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_INCLINACION
resumen_inicial: La pendiente cuantifica geométricamente el ángulo y la magnitud de inclinación que posee una recta respecto al eje horizontal.
explicacion_simple: |
  Imagina que caminas sobre una colina recta:

  - La **pendiente** es el número que mide la inclinación.
  - Si la pendiente es pequeña ($m = 0{,}2$), la caminata es casi plana.
  - Si la pendiente es grande ($m = 5$), la caminata es empinada y casi vertical.
  - El valor absoluto $|m|$ indica qué tan inclinada o parada está la recta en el gráfico.
explicacion_formal: |
  Dada la recta $y = mx + b$, su ángulo de inclinación $\alpha$ medido en sentido antihorario desde el semi-eje positivo $X$ satisface la ecuación trigonométrica:

  $$m = \tan(\alpha)$$

  **Clasificación de inclinación:**
  - Ángulo agudo ($0^\circ < \alpha < 90^\circ$): Pendiente positiva $m > 0$.
  - Ángulo obtuso ($90^\circ < \alpha < 180^\circ$): Pendiente negativa $m < 0$.
  - Recta horizontal ($\alpha = 0^\circ$): Pendiente nula $m = 0$.
definiciones_clave: |
  - **Ángulo de inclinación ($\alpha$)**: Ángulo formado entre la recta y la dirección positiva del eje de las abscisas ($X$).
propiedades_relaciones: |
  - **Límite vertical**: A medida que $\alpha \to 90^\circ$, $|m| = |\tan(\alpha)| \to +\infty$, aproximándose a una recta vertical.
ejemplo_guiado:
  enunciado: "Compara la inclinación de las rectas $L_1: y = 2x$ y $L_2: y = 5x$ y determina cuál es más empinada."
  pasos:
    - 'Paso 1: Identificar la pendiente de $L_1$: $m_1 = 2$.'
    - 'Paso 2: Identificar la pendiente de $L_2$: $m_2 = 5$.'
    - 'Paso 3: Comparar sus valores absolutos: $|m_2| = 5 > |m_1| = 2$.'
    - 'Paso 4: Concluir que la recta $L_2$ posee mayor inclinación y es más empinada que $L_1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Dadas las rectas $L_1: y = 2x$ y $L_2: y = 5x$, ¿cuál posee una trayectoria más inclinada (empinada)?"
    choices:
      - {text: "La recta $L_2$, porque $|m_2| = 5 > |m_1| = 2$", is_correct: true}
      - {text: "La recta $L_1$, porque tiene menor número", is_correct: false}
      - {text: "Ambas tienen exactamente la misma inclinación", is_correct: false}
      - {text: "La recta $L_1$ es vertical y $L_2$ es horizontal", is_correct: false}
    explanation: "La alternativa correcta es 'La recta $L_2$, porque $|m_2| = 5 > |m_1| = 2$'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué valor de pendiente $m$ corresponde a un ángulo de inclinación de $45^\\circ$?"
    choices:
      - {text: "$m = 1$", is_correct: true}
      - {text: "$m = 45$", is_correct: false}
      - {text: "$m = 0$", is_correct: false}
      - {text: "$m = 1/2$", is_correct: false}
    explanation: "La alternativa correcta es '$m = 1$'. $m = \\tan(45^\\circ) = 1$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Obtener el valor de la pendiente $m$ de la ecuación o puntos.'
  - 'Paso 2: Calcular el valor absoluto $|m|$.'
  - 'Paso 3: Relacionarlo con el ángulo de inclinación $\alpha = \arctan(m)$.'
  - 'Paso 4: Describir la pendiente como más o menos empinada según el valor de $|m|$.'
errores_correccion: |
  - **Error común:** Pensar que una pendiente negativa pequeña como $m = -10$ es "menos empinada" que $m = 2$.
  - **Cómo corregirlo:** La empinadura la determina el **VALOR ABSOLUTO** $|m|$; $|-10| = 10 > 2$, por lo que la recta de pendiente $-10$ es muchísimo más empinada.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La inclinación de una recta de pendiente $m$ se mide mediante el valor de la ordenada al origen $b$.'
  - 'A mayor valor absoluto de la pendiente $|m|$, menor es la inclinación de la recta con respecto al eje horizontal.'
  - 'Una recta con ángulo de inclinación de $90^\circ$ posee una pendiente positiva igual a $1$.'
  - 'La inclinación de una recta se calcula dividiendo el ángulo de elevación entre 360 grados.'
  - 'Dos rectas paralelas poseen pendientes inversas y de signo contrario.'
afirmaciones_verdaderas:
  - 'La pendiente $m$ se relaciona con el ángulo de inclinación $\alpha$ que forma la recta con el eje $X$ positivo mediante la relación $m = \tan(\alpha)$.'
  - 'A mayor valor absoluto de $|m|$, más inclinada (vertical) es la trayectoria de la recta en el plano.'
al_terminar_debes_poder: |
  QUÉ: Relacionar geométricamente el valor numérico de la pendiente con la inclinación de la recta.
  CÓMO: Comparar pendientes $|m|$, asociar $m = \tan(\alpha)$ al ángulo de elevación y describir la inclinación gráfica.
