semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_INCLINACION
resumen_inicial: La pendiente $m$ equivale a la tangente trigonométrica del ángulo
  de inclinación $\theta$ formado con el eje positivo $X$.
explicacion_simple: 'Geométricamente, la **pendiente** $m$ controla qué tan ''empinada''
  está la recta en el plano:

  - Cuanto mayor es el valor absoluto de $m$, más empinada es la inclinación de la
  recta.

  - Se relaciona directamente con la trigonometría mediante la fórmula $m = \tan(\theta)$,
  donde $\theta$ es el ángulo formado entre la recta y la horizontal.'
explicacion_formal: 'Dado el ángulo de inclinación $\theta \in [0^\circ, 180^\circ[
  \setminus \{90^\circ\}$ medido en sentido antihorario desde el eje positivo $X$:


  $$m = \tan(\theta)$$


  **Desglose de la fórmula:**

  - $\theta = 0^\circ \implies m = 0$ (recta horizontal).

  - $0^\circ < \theta < 90^\circ \implies m > 0$ (inclinación aguda / creciente).

  - $90^\circ < \theta < 180^\circ \implies m < 0$ (inclinación obtusa / decreciente).'
definiciones_clave: '- **Ángulo de inclinación ($\theta$)**: Ángulo medido desde el
  semieje positivo $X$ hasta la recta en sentido contrario a los punteros del reloj.'
propiedades_relaciones: '- **Relación trigonométrica**: La pendiente es exactamente
  la tangente del ángulo de inclinación $m = \tan(\theta)$.'
ejemplo_guiado:
  enunciado: Halla el ángulo de inclinación $\theta$ para una recta que tiene pendiente
    $m = 1$ y para una recta que tiene pendiente $m = \sqrt{3}$.
  pasos:
  - 'Paso 1: Para $m = 1$: resolver $\tan(\theta) = 1 \implies \theta = \arctan(1)
    = 45^\circ$.Paso 2: Para $m = \sqrt{3}$: resolver $\tan(\theta) = \sqrt{3} \implies
    \theta = \arctan(\sqrt{3}) = 60^\circ$.Paso 3: Notar que a mayor pendiente ($m
    = \sqrt{3} \approx 1{,}73$), mayor es el ángulo de inclinación ($60^\circ > 45^\circ$).'
checkpoints:
- placement: after_explicacion_formal
  question: Si una recta tiene un ángulo de inclinación de $\theta = 60^\circ$ con
    el eje positivo X, ¿cuál es el valor exacto de su pendiente $m$?
  choices:
  - text: $m = \sqrt{3}$
    is_correct: true
  - text: $m = 1$
    is_correct: false
  - text: $m = \frac{\sqrt{3}}{3}$
    is_correct: false
  - text: $m = 0$
    is_correct: false
  explanation: La alternativa correcta es '$m = \sqrt{3}$'. (Puesto que $\tan(60^\circ)
    = \sqrt{3}$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre con la inclinación visual de la recta a medida que el valor
    positivo de $m$ se hace cada vez más grande?
  choices:
  - text: La recta se vuelve más vertical (más empinada).
    is_correct: true
  - text: La recta se vuelve más horizontal.
    is_correct: false
  - text: La recta se convierte en un punto.
    is_correct: false
  - text: La recta cambia de signo.
    is_correct: false
  explanation: La alternativa correcta es 'La recta se vuelve más vertical (más empinada).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la ecuación $m = \tan(\theta)$.'
- 'Paso 2: Sustituir el valor de la pendiente $m$.'
- 'Paso 3: Aplicar la función arcotangente $\theta = \arctan(m)$ para hallar el ángulo.'
errores_correccion: '- **Error común:** Confundir el ángulo medido con el eje vertical
  Y en lugar del eje positivo X.

  - **Cómo corregirlo:** El ángulo $\theta$ se mide SIEMPRE desde el semieje positivo
  $X$ hacia arriba (sentido antihorario).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
