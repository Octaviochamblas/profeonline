semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PENDIENTE_INCLINACION
resumen_inicial: La pendiente $m$ equivale a la tangente trigonométrica del ángulo de inclinación $\theta$ que forma la recta con el eje positivo $X$ ($m = \tan(\theta)$).
explicacion_simple: '![La pendiente $m$ equivale a la tangente trigonométrica del ángulo de inclinación $\theta$ que forma la recta con el eje positivo $X$ ($m = \tan(\theta)$)](/static/img/nodos/interpretacion-de-la-pendiente-como-inclinacion-intro.svg)



  El ángulo de inclinación $\theta$ es el ángulo medido desde el eje $X$ positivo en sentido contrario a las manecillas del reloj hasta llegar a la recta:

  - Si el ángulo es **agudo** ($0^\circ < \theta < 90^\circ$), la tangente es positiva $\implies m > 0$ (recta que sube).

  - Si el ángulo es **obtuso** ($90^\circ < \theta < 180^\circ$), la tangente es negativa $\implies m < 0$ (recta que baja).

  - Si la recta es **horizontal** ($\theta = 0^\circ$), $\tan(0^\circ) = 0 \implies m = 0$.

  - Si la recta es **vertical** ($\theta = 90^\circ$), $\tan(90^\circ)$ no existe $\implies m$ indefinida.'
explicacion_formal: 'Sea $\theta \in [0^\circ, 180^\circ[ \setminus \{90^\circ\}$ el ángulo de inclinación de la recta respecto al semieje positivo de abscisas. La relación fundamental con la pendiente es:

  $$m = \tan(\theta)$$


  **Tabla de valores notables:**

  - $\theta = 0^\circ \implies m = \tan(0^\circ) = 0$

  - $\theta = 30^\circ \implies m = \tan(30^\circ) = \frac{\sqrt{3}}{3} \approx 0.577$

  - $\theta = 45^\circ \implies m = \tan(45^\circ) = 1$

  - $\theta = 60^\circ \implies m = \tan(60^\circ) = \sqrt{3} \approx 1.732$

  - $\theta = 120^\circ \implies m = \tan(120^\circ) = -\sqrt{3}$

  - $\theta = 135^\circ \implies m = \tan(135^\circ) = -1$

  - $\theta = 150^\circ \implies m = \tan(150^\circ) = -\frac{\sqrt{3}}{3}$'
definiciones_clave: "- **Ángulo de inclinación ($\theta$)**: Ángulo geométrico positivo formado con el eje horizontal de referencia.\n- **Tangente de inclinación**: Función trigonométrica que vincula directamente el ángulo geométrico con la pendiente algebraica."
propiedades_relaciones: '- **Cálculo inverso**: $\theta = \arctan(m)$ si $m \ge 0$, y $\theta = 180^\circ + \arctan(m)$ si $m < 0$.

  - **Crecimiento monotónico de inclinación**: A mayor ángulo en $]0^\circ, 90^\circ[$, mayor pendiente.'
ejemplo_guiado:
  enunciado: '![Ejemplo La pendiente $m$ equivale a la tangente trigonométrica del ángulo de inclinación $\theta$ que forma la recta con el eje positivo $X$ ($m = \tan(\theta)$)](/static/img/nodos/interpretacion-de-la-pendiente-como-inclinacion-ejemplos.svg)



    Determina el ángulo de inclinación $\theta$ de una recta cuya pendiente es $m = \sqrt{3}$ y de otra cuya pendiente es $m = -1$.'
  pasos:
  - 'Paso 1: Para $m = \sqrt{3}$: resolver $\tan(\theta) = \sqrt{3}$.'
  - 'Paso 2: Identificar el ángulo notable agudo: $\theta = 60^\circ$.'
  - 'Paso 3: Para $m = -1$: resolver $\tan(\theta) = -1$.'
  - 'Paso 4: Dado que es negativa, el ángulo es obtuso en el segundo cuadrante: $\theta = 180^\circ - 45^\circ = 135^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una recta forma un ángulo de $45^\circ$ con el eje positivo X, ¿cuál es su pendiente?
  choices:
  - text: m = 1
    is_correct: true
  - text: m = 0.5
    is_correct: false
  - text: m = 45
    is_correct: false
  - text: m = -1
    is_correct: false
  explanation: La alternativa correcta es 'm = 1'. $m = \tan(45^\circ) = 1$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: "Una recta con ángulo de inclinación obtuso ($\theta = 120^\\circ$) tiene pendiente:"
  choices:
  - text: Negativa
    is_correct: true
  - text: Positiva
    is_correct: false
  - text: Cero
    is_correct: false
  - text: Indefinida
    is_correct: false
  explanation: La alternativa correcta es 'Negativa'. En el segundo cuadrante la tangente es negativa.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el ángulo $\theta$ medido desde el semieje positivo $X$ hacia la recta en sentido antihorario.'
- 'Paso 2: Aplicar la relación trigonométrica $m = \tan(\theta)$.'
- 'Paso 3: Si $\theta < 90^\circ$, la pendiente es positiva; si $\theta > 90^\circ$, la pendiente es negativa.'
- 'Paso 4: Evaluar la tangente del ángulo notable correspondiente.'
errores_correccion: '- **Error común:** Medir el ángulo respecto al eje vertical $Y$ o en sentido horario.

  - **Cómo corregirlo:** El ángulo de inclinación **siempre se mide desde el semieje positivo $X$** en sentido antihorario.'
ejemplos:
- titulo: 'Ejemplo 1: Ángulo nulo'
  enunciado: Si una recta es paralela al eje X (ángulo de 0 grados), ¿cuál es su pendiente?
  alternativas:
  - m = 0
  - m = 1
  - m = -1
  - Indefinida
  respuesta: m = 0
  solucion_pasos:
  - 'Paso 1: $m = \tan(0^\circ) = 0$.'
- titulo: 'Ejemplo 2: Recta a 135 grados'
  enunciado: ¿Cuál es la pendiente de una recta que forma un ángulo de $135^\circ$ con el eje X?
  alternativas:
  - '-1'
  - '1'
  - -\sqrt{3}
  - -1/2
  respuesta: '-1'
  solucion_pasos:
  - 'Paso 1: $m = \tan(135^\circ) = -\tan(45^\circ) = -1$.'
- titulo: 'Ejemplo 3: Pendiente infinita/indefinida'
  enunciado: ¿Qué ocurre con la pendiente cuando el ángulo de inclinación es de $90^\circ$ (recta vertical)?
  alternativas:
  - La pendiente no está definida
  - m = 0
  - m = 1
  - m = 90
  respuesta: La pendiente no está definida
  solucion_pasos:
  - 'Paso 1: $\tan(90^\circ)$ no existe en los reales por división por cero.'
- titulo: 'Ejemplo 4: Ángulo de 30 grados'
  enunciado: Calcula la pendiente de una recta inclinada a $30^\circ$.
  alternativas:
  - \sqrt{3}/3
  - \sqrt{3}
  - 1/2
  - '1'
  respuesta: \sqrt{3}/3
  solucion_pasos:
  - 'Paso 1: $m = \tan(30^\circ) = \frac{\sqrt{3}}{3}$.'
errores_frecuentes:
- Confundir el valor de la pendiente m con el valor del ángulo en grados.
- Medir el ángulo de inclinación respecto al eje Y.
- Olvidar que ángulos mayores a 90° generan pendientes negativas.
afirmaciones_verdaderas:
- La pendiente m es igual a la tangente del ángulo de inclinación formado con el eje X positivo.
- Un ángulo agudo produce pendiente positiva y un ángulo obtuso produce pendiente negativa.
al_terminar_debes_poder: '**QUÉ:** Interpretar y relacionar geométricamente la pendiente con el ángulo de inclinación.


  **CÓMO:** Utilizando la identidad trigonométrica m = tan(θ) y reconociendo el comportamiento de ángulos agudos, obtusos y nulos.


  ![Resumen La pendiente $m$ equivale a la tangente trigonométrica del ángulo de inclinación $\theta$ que forma la recta con el eje positivo $X$ ($m = \tan(\theta)$)](/static/img/nodos/interpretacion-de-la-pendiente-como-inclinacion-resumen.svg)'
