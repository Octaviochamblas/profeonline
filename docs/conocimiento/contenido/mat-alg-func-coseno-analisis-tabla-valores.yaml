semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.TABLA_VALORES
resumen_inicial: 'Construcción de una tabla de valores para la función coseno: círculo
  unitario, amplitud, período y transformaciones de Análisis de la función coseno.'
explicacion_simple: A diferencia del seno, el coseno comienza en su valor máximo,
  lo que produce un patrón distinto aunque relacionado.
explicacion_formal: '### Definición formal


  Evaluando $f(x)=\cos(x)$ en los ángulos cuadrantales dentro de un período completo:
  $f(0)=1$, $f(\pi/2)=0$, $f(\pi)=-1$, $f(3\pi/2)=0$, $f(2\pi)=1$. Estos cinco puntos
  son suficientes para trazar la forma general de un período de la curva.


  ### Desarrollo didáctico


  Al agregar los ángulos notables intermedios, como $\pi/6$ ($f\approx0{,}87$) o $\pi/4$
  ($f\approx0{,}71$), se afina la forma de la curva entre los puntos cuadrantales.'
definiciones_clave: '- **Construcción de una tabla de valores para la función coseno**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a construcción de una tabla de valores para la función coseno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    construcción de una tabla de valores para la función coseno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de construcción de una tabla de valores para la función
    coseno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
