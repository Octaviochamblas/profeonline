semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.TABLA_VALORES
resumen_inicial: 'Construcción de una tabla de valores notables para la función coseno $f(x) = \cos(x)$ en el intervalo principal $[0, 2\pi]$.'
explicacion_simple: |
  Para dibujar la curva del coseno a mano o entender cómo cambia su altura paso a paso, se construye una tabla con los ángulos más importantes (los ángulos notables y cuadrantales). Comenzamos en $0$ con una altura máxima de $1$, bajamos gradualmente a $0$ en $\frac{\pi}{2}$, caemos a $-1$ en $\pi$, volvemos a subir a $0$ en $\frac{3\pi}{2}$ y finalmente regresamos a la cima de $1$ en $2\pi$. Organizar estos puntos en una tabla permite ubicar con precisión los pares $(x, y)$ sobre el plano cartesiano.
explicacion_formal: |
  ### Definición formal
  La **tabla de valores fundamentales de la función coseno** sistematiza los pares ordenados $(x, f(x)) = (x, \cos x)$ para los ángulos notables y cuadrantales en un período completo $x \in [0, 2\pi]$:

  $$\begin{array}{|c|c|c|c|c|c|c|c|c|c|}
  \hline
  x \text{ (rad)} & 0 & \frac{\pi}{6} & \frac{\pi}{4} & \frac{\pi}{3} & \frac{\pi}{2} & \pi & \frac{3\pi}{2} & 2\pi \\
  \hline
  x \text{ (deg)} & 0^\circ & 30^\circ & 45^\circ & 60^\circ & 90^\circ & 180^\circ & 270^\circ & 360^\circ \\
  \hline
  \cos(x) & 1 & \frac{\sqrt{3}}{2} & \frac{\sqrt{2}}{2} & \frac{1}{2} & 0 & -1 & 0 & 1 \\
  \hline
  \text{Decimal} & 1.0 & \approx 0.866 & \approx 0.707 & 0.5 & 0 & -1.0 & 0 & 1.0 \\
  \hline
  \end{array}$$

  ### Desglose simbólico
  - Decrecimiento en I C y II C ($0$ a $\pi$): $f(x)$ disminuye de $1$ a $-1$.
  - Crecimiento en III C y IV C ($\pi$ a $2\pi$): $f(x)$ aumenta de $-1$ a $1$.

  ### Síntesis didáctica
  La tabla de valores del coseno exhibe una secuencia exactamente invertida respecto al seno en el primer cuadrante. Muestra los puntos estructurales clave: la cresta inicial en $(0,1)$, los ceros en $\left(\frac{\pi}{2}, 0\right)$ y $\left(\frac{3\pi}{2}, 0\right)$, el valle en $(\pi, -1)$ y el retorno a la cima en $(2\pi, 1)$.
definiciones_clave: |
  - **Tabla de valores**: Matriz de datos que relaciona cada ángulo en radianes $x$ con su abscisa $y = \cos x$.
  - **Puntos característicos**: Pares ordenados $(0,1)$, $\left(\frac{\pi}{2}, 0\right)$, $(\pi, -1)$, $\left(\frac{3\pi}{2}, 0\right)$ y $(2\pi, 1)$ que estructuran la onda cosenoidal.
  - **Valores aproximados**: Expresiones decimales útiles para ubicar puntos en el gráfico cartesiano.
propiedades_relaciones: |
  - **Simetría cuadrantal**: Los valores absolutos registrados en el primer cuadrante ($\frac{\sqrt{3}}{2}, \frac{\sqrt{2}}{2}, \frac{1}{2}$) se repiten en los demás cuadrantes con sus respectivos signos cartesiano.
  - **Continuidad de monotonía**: Decrece en forma continua en todo el intervalo $[0, \pi]$ y crece en $[\pi, 2\pi]$.
ejemplo_guiado:
  enunciado: 'Construye los pares ordenados $(x, y)$ de la tabla para los ángulos $x = \frac{\pi}{6}$ y $x = \frac{11\pi}{6}$ y compara sus valores.'
  pasos:
    - 'Paso 1: Evaluar la función en $x = \frac{\pi}{6}$ ($30^\circ$): $\cos\left(\frac{\pi}{6}\right) = \frac{\sqrt{3}}{2}$. Par ordenado: $A\left(\frac{\pi}{6}, \frac{\sqrt{3}}{2}\right)$.'
    - 'Paso 2: Evaluar la función en $x = \frac{11\pi}{6}$ ($330^\circ$): ángulo de referencia $x_r = 2\pi - \frac{11\pi}{6} = \frac{\pi}{6}$. Como en IV C $x > 0 \implies \cos\left(\frac{11\pi}{6}\right) = \frac{\sqrt{3}}{2}$. Par ordenado: $B\left(\frac{11\pi}{6}, \frac{\sqrt{3}}{2}\right)$.'
    - 'Paso 3: Comparar las ordenadas: ambos pares tienen exactamente la misma altura $y = \frac{\sqrt{3}}{2} \approx 0.866$.'
    - 'Paso 4: Concluir que la gráfica es simétrica con respecto a los ejes verticales que contienen sus picos.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la tabla de valores de la función coseno base $f(x) = \cos x$, ¿cuáles son los pares ordenados de la cresta inicial y del valle mínimo?'
    choices:
      - {text: 'Cresta inicial $(0, 1)$ y Valle $(\pi, -1)$', is_correct: true}
      - {text: 'Cresta inicial $(0, 0)$ y Valle $\left(\frac{\pi}{2}, -1\right)$', is_correct: false}
      - {text: 'Cresta inicial $\left(\frac{\pi}{2}, 1\right)$ y Valle $\left(\frac{3\pi}{2}, -1\right)$', is_correct: false}
      - {text: 'Cresta inicial $(2\pi, 0)$ y Valle $(\pi, 1)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Cresta inicial $(0, 1)$ y Valle $(\pi, -1)$''. El coseno comienza en su valor máximo $1$ en $x = 0$ y cae a su mínimo $-1$ en $x = \pi$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la tabla de valores, ¿cuál es el valor numérico de $\cos\left(\frac{\pi}{3}\right)$?'
    choices:
      - {text: '$\frac{1}{2}$', is_correct: true}
      - {text: '$\frac{\sqrt{3}}{2}$', is_correct: false}
      - {text: '$\frac{\sqrt{2}}{2}$', is_correct: false}
      - {text: '$0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{1}{2}$''. $\frac{\pi}{3}$ equivale a $60^\circ$, cuyo coseno vale exacto $\frac{1}{2} = 0.5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Listar en la primera fila los ángulos principales en radianes dentro del intervalo deseado.'
  - 'Paso 2: Calcular el valor del coseno para cada ángulo usando la definición del círculo unitario.'
  - 'Paso 3: Registrar los resultados en fracciones radicales exactas ($\frac{\sqrt{3}}{2}, \frac{\sqrt{2}}{2}, \frac{1}{2}$).'
  - 'Paso 4: Graficar los puntos $(x, y)$ sobre las coordenadas cartesianas para trazar la curva cosenoidal.'
errores_correccion: |
  - **Error 1:** Asignar $y = 0$ en $x = 0$ al construir la tabla del coseno. **Cómo corregirlo:** La función coseno empieza en su punto más alto $(0,1)$; la función que inicia en el origen $(0,0)$ es la función seno.
  - **Error 2:** Creer que el valor en $x = \pi$ es $0$. **Cómo corregirlo:** En $x = \pi$ ($180^\circ$) el punto en el círculo unitario es $(-1,0)$, por lo que la abscisa es $\cos(\pi) = -1$.
ejemplos:
  - titulo: 'Par ordenado del punto medio en la tabla'
    enunciado: '¿Cuál es el par ordenado $(x, y)$ de la función coseno en $x = \pi$?'
    alternativas:
      - '$(\pi, -1)$'
      - '$(\pi, 0)$'
      - '$(\pi, 1)$'
    respuesta: '$(\pi, -1)$'
    solucion_pasos:
      - '1. $\cos(\pi) = -1$.'
      - '2. El par ordenado en la tabla es $(\pi, -1)$.'
  - titulo: 'Valor para pi cuartos'
    enunciado: '¿Qué valor le corresponde a $x = \frac{\pi}{4}$ en la tabla de la función coseno?'
    alternativas:
      - '$\frac{\sqrt{2}}{2}$'
      - '$\frac{1}{2}$'
      - '$\frac{\sqrt{3}}{2}$'
    respuesta: '$\frac{\sqrt{2}}{2}$'
    solucion_pasos:
      - '1. $\frac{\pi}{4} = 45^\circ$.'
      - '2. $\cos\left(\frac{\pi}{4}\right) = \frac{\sqrt{2}}{2} \approx 0.707$.'
  - titulo: 'Cero en pi medios'
    enunciado: '¿La tabla de valores marca $y = 0$ para $x = \frac{\pi}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en $x = \frac{\pi}{2}$ ($90^\circ$) la abscisa es nula: $\cos\left(\frac{\pi}{2}\right) = 0$.'
  - titulo: 'Monotonía en el primer cuadrante'
    enunciado: '¿En la tabla de valores del coseno los resultados disminuyen de $1$ a $0$ al pasar de $x = 0$ a $x = \frac{\pi}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $1 > \frac{\sqrt{3}}{2} > \frac{\sqrt{2}}{2} > \frac{1}{2} > 0$, mostrando decrecimiento estricto.'
errores_frecuentes:
  - 'La afirmación de que el par ordenado inicial de la función coseno es $(0, 0)$.'
  - 'La afirmación de que en $x = \pi$ el valor de la función coseno es cero.'
  - 'La afirmación de que en $x = \frac{\pi}{2}$ la función coseno alcanza su máximo positivo.'
  - 'La afirmación de que la tabla de valores del coseno exige usar ángulos medidos solo en grados sexagesimales.'
  - 'La afirmación de que los valores de la función coseno aumentan en el primer cuadrante.'
afirmaciones_verdaderas:
  - 'La tabla de valores del coseno base muestra los puntos clave $(0,1)$, $\left(\frac{\pi}{2}, 0\right)$, $(\pi, -1)$, $\left(\frac{3\pi}{2}, 0\right)$ y $(2\pi, 1)$.'
  - 'Los valores de la función coseno disminuyen estrictamente en los cuadrantes I y II desde $1$ hasta $-1$ y aumentan en los cuadrantes III y IV desde $-1$ hasta $1$.'
al_terminar_debes_poder: |
  QUÉ: Construir e interpretar la tabla de valores notables de la función coseno $f(x) = \cos x$.
  CÓMO: Asignar a cada ángulo característico $x$ su abscisa $y = \cos x$ para estructurar los pares ordenados de la onda.
