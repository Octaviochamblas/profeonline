resumen_inicial: El producto de binomios lineales no mónicos $(ax + b)(cx + d)$ es
  la generalización donde el término común $x$ posee coeficientes numéricos $a$ y
  $c$ distintos de 1, resultando en $ac x^2 + (ad + bc)x + bd$.
explicacion_simple: Cuando los paréntesis tienen números multiplicando a la $x$, como
  $(2x + 3)(5x + 4)$, multiplicas los coeficientes de las $x$ ($2 \cdot 5 = 10 \to
  10x^2$), sumas los productos cruzados ($(2 \cdot 4 + 3 \cdot 5)x = (8 + 15)x = 23x$),
  y multiplicas los números finales ($3 \cdot 4 = 12$). El resultado es $10x^2 + 23x
  + 12$.
explicacion_formal: 'Para cualesquiera coeficientes $a, b, c, d \in \mathbb{R}$ con
  $a, c \neq 0$, el **Producto de Binomios Lineales Generales** $(ax + b)(cx + d)$
  se expande mediante la regla de FOIL/distributiva generalizada:


  $$(ax + b)(cx + d) = (ac)x^2 + (ad + bc)x + bd$$


  **Desglose simbólico:**

  - $(ac)x^2$: Producto de los términos primeros (coeficientes de la potencia cuadrática).

  - $(ad + bc)x$: Suma de los productos cruzados exteriores $(ad)$ e interiores $(bc)$
  para el término lineal.

  - $bd$: Producto de los términos independientes finales.


  > **Complemento didáctico:** Es el fundamento del método de factorización por agrupar/as
  de trinomios no mónicos $Ax^2 + Bx + C$.'
definiciones_clave: '- **Binomios no mónicos**: Binomios cuyo coeficiente principal
  de la variable es distinto de 1 ($a \neq 1, c \neq 1$).

  - **Productos cruzados ($ad + bc$)**: Combinación lineal que determina el coeficiente
  central.'
propiedades_relaciones: '- **Método AC**: La relación entre $(ac)$ y $bd$ satisface
  $(ac)(bd) = (ad)(bc)$, clave para la factorización inversa.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(3x + 2)(4x + 5)$ aplicando la regla de binomios
    lineales no mónicos.
  pasos:
  - 'Paso 1: Identificar coeficientes $a = 3, b = 2, c = 4, d = 5$.'
  - 'Paso 2: Calcular el producto de los coeficientes cuadráticos: $ac = 3 \cdot 4
    = 12 \to 12x^2$.'
  - 'Paso 3: Calcular los productos cruzados: $ad = 3 \cdot 5 = 15$ y $bc = 2 \cdot
    4 = 8$.'
  - 'Paso 4: Sumar los productos cruzados para el término lineal: $(15 + 8)x = 23x$.'
  - 'Paso 5: Calcular el producto independiente: $bd = 2 \cdot 5 = 10$.'
  - 'Paso 6: Ensamblar la expresión: $12x^2 + 23x + 10$.'
  - 'Conclusión: El resultado final es $12x^2 + 23x + 10$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula general para el coeficiente del término lineal $x$
    en el producto $(ax + b)(cx + d)$?
  choices:
  - text: $ad + bc$
    is_correct: true
  - text: $ac + bd$
    is_correct: false
  - text: $a + b + c + d$
    is_correct: false
  - text: $abcd$
    is_correct: false
  explanation: La alternativa correcta es '$ad + bc$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expansión de $(3x + 2)(4x + 5)$, ¿cuál es el coeficiente del término
    central $x$?
  choices:
  - text: $23$, resultante de $15 + 8$
    is_correct: true
  - text: $12$
    is_correct: false
  - text: $10$
    is_correct: false
  - text: $20$
    is_correct: false
  explanation: La alternativa correcta es '$23$, resultante de $15 + 8$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los coeficientes de $x$ para obtener el término cuadrático
  $(ac)x^2$.'
- 'Paso 2: Multiplicar los términos exteriores $ad$ e interiores $bc$, y sumarlos
  para obtener $(ad + bc)x$.'
- 'Paso 3: Multiplicar las constantes finales para obtener el término independiente
  $bd$.'
errores_correccion: '- **Error 1: Olvidar los productos cruzados y sumar solo $b +
  d$ para el término central.** **Cómo corregirlo:** En binomios no mónicos, el término
  central requiere multiplicar cada constante por el coeficiente de la $x$ opuesta
  ($(ad + bc)x$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle $(2x + 1)(3x + 4)$.
  alternativas:
  - $6x^2 + 11x + 4$
  - $6x^2 + 5x + 4$
  - $6x^2 + 10x + 4$
  respuesta: $6x^2 + 11x + 4$
  solucion_pasos:
  - 1. $ac = 2 \cdot 3 = 6 \to 6x^2$.
  - '2. Cruzados: $2(4) + 1(3) = 8 + 3 = 11 \to 11x$.'
  - '3. $bd = 1(4) = 4$. Resultado: $6x^2 + 11x + 4$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(5x - 2)(2x + 3)$?
  alternativas:
  - $10x^2 + 11x - 6$
  - $10x^2 - 11x - 6$
  - $10x^2 + 15x - 6$
  respuesta: $10x^2 + 11x - 6$
  solucion_pasos:
  - 1. $ac = 5 \cdot 2 = 10 \to 10x^2$.
  - '2. Cruzados: $5(3) + (-2)(2) = 15 - 4 = 11 \to 11x$.'
  - '3. $bd = (-2)(3) = -6$. Resultado: $10x^2 + 11x - 6$.'
- titulo: ¿Es $12x^2 - 14x - 10$ la expansión de $(4x + 2)(3x - 5)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $4(3) = 12$, $4(-5) + 2(3) = -20 + 6 = -14$, $2(-5) = -10$.
- titulo: ¿El término cuadrático en $(3x + 1)(3x + 2)$ es igual a $3x^2$?
  respuesta: 'No'
  solucion_pasos:
  - No, $ac = 3 \cdot 3 = 9$, por lo que el término es $9x^2$.
errores_frecuentes:
- Sumar únicamente los términos constantes $b + d$ para obtener el término central
  en binomios no mónicos.
- Declarar que $(2x + 3)(5x + 4)$ equivale a $10x^2 + 12$ omitiendo la suma de productos
  cruzados.
- Multiplicar los coeficientes de $x$ pero no elevar la variable al cuadrado.
- Declarar que el producto de binomios no mónicos resulta en un binomio.
- Asignar el coeficiente $a + c$ al término cuadrático en lugar del producto $a \cdot
  c$.
afirmaciones_verdaderas:
- El coeficiente del término cuadrático equivale al producto de los coeficientes de
  la variable $ac$.
- El término lineal depende de la suma de los productos cruzados exterior e interior
  $ad + bc$.
al_terminar_debes_poder: Al terminar serás capaz de desarrollar el producto de cualquier
  par de binomios lineales no mónicos $(ax + b)(cx + d)$.
