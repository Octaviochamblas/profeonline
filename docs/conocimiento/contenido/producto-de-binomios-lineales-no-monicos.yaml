semantic_id: MAT.ALG.TERMINO_COMUN.CASO_GENERAL_LINEAL
resumen_inicial: 'El producto de binomios lineales no mónicos consiste en expandir $(ax+b)(cx+d)$ mediante la regla general reduciendo los términos cruzados al coeficiente central $(ad+bc)x$ y constante $bd$.'
explicacion_simple: |
  Cuando los binomios tienen la variable con **coeficientes numéricos mayores a 1** (ej: $(2x + 3) \cdot (4x + 5)$):
  - **FÓRMULA GENERAL DE BINOMIOS LINEALES**:
    $$(ax + b)(cx + d) = \mathbf{(ac)x^2 + (ad + bc)x + bd}$$
  - **Procedimiento en tres partes**:
    1. **Término Cuadrático**: Multiplica los dos primeros coeficientes: $(a \cdot c)x^2$.
    2. **Término Lineal (Productos cruzados)**: Multiplica extremos $(a \cdot d)$ y medios $(b \cdot c)$ y suma los resultados: $\mathbf{(ad + bc)x}$.
    3. **Término Constante**: Multiplica los dos números del final: $\mathbf{b \cdot d}$.
  - **Ejemplo**: $(2x + 3) \cdot (4x + 5)$:
    - Término cuadrático: $2 \cdot 4 = \mathbf{8x^2}$.
    - Término lineal (cruzados): $(2 \cdot 5) + (3 \cdot 4) = 10 + 12 = \mathbf{+22x}$.
    - Término constante: $3 \cdot 5 = \mathbf{+15}$.
    - Polinomio final: **$8x^2 + 22x + 15$**.
explicacion_formal: |
  ### Definición formal
  Sean $B_1 = (a x + b)$ y $B_2 = (c x + d)$ dos binomios lineales en $\mathbb{R}[x]$ con coeficientes principales $a, c \neq 0$ ($a, c \neq 1$, no mónicos). La **multiplicación de binomios lineales generales** es la forma bilinear cuadrática dada por:

  $$(ax + b)(cx + d) = (a \cdot c)x^2 + (a \cdot d + b \cdot c)x + (b \cdot d)$$

  ### Representación Matricial y Forma Cuadrática
  El sistema de productos parciales puede formalizarse mediante el producto vectorial de coeficientes:

  $$\begin{pmatrix} a \\ b \end{pmatrix} \otimes \begin{pmatrix} c \\ d \end{pmatrix} = \begin{pmatrix} ac & ad \\ bc & bd \end{pmatrix}$$

  donde la traza secundaria antidiagonal $ad + bc$ consolida el coeficiente del término lineal $x$.

  ### Síntesis didáctica
  Este caso general sienta las bases del método de factorización de trinomios no mónicos $Ax^2 + Bx + C$ mediante descomposición por aspa simple.
definiciones_clave: |
  - **Binomios lineales no mónicos**: Binomios de grado 1 cuyos coeficientes principales $a$ y $c$ son distintos de 1.
  - **Productos cruzados ($ad$ y $bc$)**: Multiplicaciones efectuadas entre los términos extremos ($a \cdot d$) y los términos medios ($b \cdot c$).
  - **Traza central del trinomio ($B = ad+bc$)**: Suma de los productos cruzados que determina el coeficiente lineal de la forma general $Ax^2 + Bx + C$.
propiedades_relaciones: |
  - **Reducción al caso mónico**: Si $a=c=1$, la fórmula se reduce al caso mónico estándar $(1 \cdot 1)x^2 + (1 \cdot d + b \cdot 1)x + bd = x^2 + (b+d)x + bd$.
  - **Estructura de coeficientes**: El coeficiente principal es $A = ac$, el central es $B = ad+bc$ y la constante es $C = bd$.
ejemplo_guiado:
  enunciado: 'Multiplica los binomios lineales no mónicos $(3x - 2) \cdot (5x + 4)$ aplicando la fórmula general de productos cruzados.'
  pasos:
    - 'Paso 1: Identificamos los 4 coeficientes: $a = 3$, $b = -2$, $c = 5$, $d = 4$.'
    - 'Paso 2: Calculamos el término cuadrático $(ac)x^2$:
       (3 \cdot 5)x^2 = \mathbf{15x^2}$.'
    - 'Paso 3: Calculamos los productos cruzados para el término lineal $(ad + bc)x$:
       - Extremos: $3 \cdot 4 = 12$.
       - Medios: $(-2) \cdot 5 = -10$.
       - Suma cruzada: $12 + (-10) = +2 \implies \mathbf{+2x}$.'
    - 'Paso 4: Calculamos el término constante $(bd)$:
       (-2) \cdot 4 = \mathbf{-8}$.'
    - 'Paso 5: Consolidamos el trinomio: $15x^2 + 2x - 8$.'
    - 'Conclusión: El producto expandido es **$15x^2 + 2x - 8$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se calcula el coeficiente del término lineal $x$ al multiplicar dos binomios lineales no mónicos de la forma $(ax+b)(cx+d)$?'
    choices:
      - {text: 'Sumando los productos cruzados de extremos y medios ($ad + bc$)', is_correct: true}
      - {text: 'Multiplicando únicamente los primeros coeficientes ($a \cdot c$)', is_correct: false}
      - {text: 'Sumando todos los coeficientes ($a + b + c + d$)', is_correct: false}
      - {text: 'Multiplicando únicamente las constantes ($b \cdot d$)', is_correct: false}
    explanation: 'La alternativa correcta es ''Sumando los productos cruzados de extremos y medios ($ad + bc$)''. Traza central del trinomio $B = ad+bc$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el trinomio expandido de $(2x + 1) \cdot (3x + 4)$?'
    choices:
      - {text: 'El resultado es $6x^2 + 11x + 4$, calculando cuadrático $2 \cdot 3 = 6x^2$, cruzados $(2 \cdot 4)+(1 \cdot 3) = 8+3 = 11x$ y constantes $1 \cdot 4 = 4$', is_correct: true}
      - {text: 'El resultado es $6x^2 + 4$', is_correct: false}
      - {text: 'El resultado es $6x^2 + 7x + 4$', is_correct: false}
      - {text: 'El resultado es $5x^2 + 11x + 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $6x^2 + 11x + 4$, calculando cuadrático $2 \cdot 3 = 6x^2$, cruzados $(2 \cdot 4)+(1 \cdot 3) = 8+3 = 11x$ y constantes $1 \cdot 4 = 4$''. $6x^2 + (8+3)x + 4 = 6x^2 + 11x + 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Multiplicar los coeficientes de los términos de mayor grado para obtener el coeficiente principal $A = ac$.'
  - 'Paso 2: Multiplicar el primer término por el último (extremos $ad$) y el segundo por el tercero (medios $bc$).'
  - 'Paso 3: Sumar algebraicamente ambos productos cruzados para obtener el coeficiente lineal $B = ad+bc$.'
  - 'Paso 4: Multiplicar las constantes para obtener el término independiente $C = bd$ y escribir $Ax^2 + Bx + C$.'
errores_correccion: |
  - **Error 1:** Excluir los productos cruzados al multiplicar binomios no mónicos (escribir $(2x+3)(4x+5) = 8x^2 + 15$). **Cómo corregirlo:** Se deben **CALCULAR LOS PRODUCTOS CRUZADOS EXTREMOS Y MEDIOS ($(2 \cdot 5) + (3 \cdot 4) = 22x$)**.
  - **Error 2:** Sumar los coeficientes principales en lugar de multiplicarlos (escribir $(2x+1)(3x+1) = 5x^2 + \dots$). **Cómo corregirlo:** El coeficiente principal **SE MULTIPLICA ($2 \cdot 3 = 6 \implies 6x^2$)**.
ejemplos:
  - titulo: 'Caso no mónico simple'
    enunciado: '¿Cuál es el trinomio de $(3x + 1) \cdot (2x + 5)$?'
    alternativas:
      - '$6x^2 + 17x + 5$'
      - '$6x^2 + 5$'
      - '$5x^2 + 17x + 5$'
    respuesta: '$6x^2 + 17x + 5$'
    solucion_pasos:
      - '1. Cuadrático: $3 \cdot 2 = 6x^2$.'
      - '2. Cruzados: $(3 \cdot 5) + (1 \cdot 2) = 15 + 2 = 17x$.'
      - '3. Constante: $1 \cdot 5 = 5$.'
      - '4. Resultado: $6x^2 + 17x + 5$.'
  - titulo: 'No mónico con resta'
    enunciado: '¿Cuál es el desarrollo de $(4x - 1) \cdot (2x + 3)$?'
    alternativas:
      - '$8x^2 + 10x - 3$'
      - '$8x^2 - 3$'
      - '$8x^2 - 10x - 3$'
    respuesta: '$8x^2 + 10x - 3$'
    solucion_pasos:
      - '1. $4 \cdot 2 = 8x^2$.'
      - '2. $(4 \cdot 3) + (-1 \cdot 2) = 12 - 2 = +10x$.'
      - '3. $(-1)(3) = -3$.'
      - '4. Resultado: $8x^2 + 10x - 3$.'
  - titulo: 'Coeficiente principal'
    enunciado: 'Para $(5x + 2)(3x - 4)$, ¿es el término cuadrático de mayor grado $15x^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $5 \cdot 3 = 15x^2$.'
  - titulo: 'Suma de productos cruzados'
    enunciado: 'En $(2x - 3)(3x - 1)$, ¿se suman los cruzados $(-2) + (-9) = -11x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $2(-1) + (-3)(3) = -2 - 9 = -11x$.'
errores_frecuentes:
  - 'La suma de productos cruzados de extremos y medios no se realiza al calcular el término lineal.'
  - 'Sumar los coeficientes principales de la variable en lugar de multiplicarlos.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'La regla de signos en los productos cruzados intermedios no es aplicada.'
  - 'Multiplicar los exponentes de las variables al calcular el término cuadrático.'
afirmaciones_verdaderas:
  - 'La multiplicación de binomios lineales no mónicos $(ax+b)(cx+d)$ produce el trinomio $(ac)x^2 + (ad+bc)x + bd$.'
  - 'El coeficiente del término lineal es la suma de los productos de los términos extremos e internos.'
al_terminar_debes_poder: 'Expandir el producto de binomios lineales no mónicos calculando el término cuadrático, los productos cruzados y la constante.'
