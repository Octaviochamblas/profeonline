semantic_id: MAT.ALG.TERMINO_COMUN.CASO_GENERAL_LINEAL
resumen_inicial: 'Producto de binomios lineales no mónicos: fórmula, regla de expansión
  y aplicaciones en Producto de binomios con término común.'
explicacion_simple: ¿Y si los coeficientes de $x$ no son $1$? ¿Y si ni siquiera son
  iguales? Aún hay una forma sistemática de resolverlo.
explicacion_formal: "### Definición formal\n\nPara todo $a, b, c, d$, el producto\
  \ $(ax+b)(cx+d)$ se expande por distributividad como $(ac)x^2 + (ad+bc)x + bd$:\
  \ el coeficiente cuadrático es el producto de los coeficientes líderes, el coeficiente\
  \ lineal es la suma de los dos productos cruzados, y el término independiente es\
  \ el producto de los términos constantes.\n\n### Desarrollo didáctico\n\nEl caso\
  \ general de binomios lineales con término común se da cuando el término que se\
  \ repite no es simplemente una letra suelta (como ''$x$''), sino un término que\
  \ incluye un coeficiente numérico (como ''$3x$'' o ''$5y$'').\n\nPor ejemplo, $(ax+b)(ax+c)$.\
  \ La lógica sigue siendo exactamente la misma que la fórmula básica, pero debes\
  \ tener cuidado con las multiplicaciones.\n\n**Pasos en el caso general:**\nTomemos\
  \ $(3x + 2)(3x - 7)$:\n1. **Cuadrado del común:** El término común es $3x$. Su cuadrado\
  \ es $(3x)^2 = 9x^2$. (No olvides elevar también el coeficiente numérico.).\n2.\
  \ **Suma por el común:** Los no comunes son $+2$ y $-7$. La suma algebraica es $(2\
  \ - 7) = -5$. Ahora multiplicamos eso por el término común: $-5(3x) = -15x$.\n3.\
  \ **Producto:** Multiplicamos los no comunes: $(+2)(-7) = -14$.\n\nResultado final:\
  \ $9x^2 - 15x - 14$. \nEste caso nos recuerda que el \"término común\" actúa como\
  \ un bloque inseparable durante los primeros dos pasos de la regla."
definiciones_clave: '- **Producto de binomios lineales no mónicos**: Producto notable
  con estructura fija de desarrollo directo.'
propiedades_relaciones: '- **Reglas de expansión**: Fórmulas de productos notables
  y simetrías algebraicas de producto de binomios lineales no mónicos.'
ejemplo_guiado:
  enunciado: Expande o simplifica la expresión aplicando la regla de producto de binomios
