procedimiento:
- 'Paso 1: Para calcular $(ax+b)(cx+d)$ mentalmente:'
- 'Paso 2: Multiplica los primeros coeficientes para el $x^2$.'
- 'Paso 3: Calcula ''los extremos por los medios'' (producto cruzado) y súmalos: $(ax
  \\\\\\cdot d) + (b \\\\\\cdot cx)$.'
- 'Paso 4: Multiplica los últimos términos (los independientes) para el final.'
- 'F: $12x^2$. O: $3x$. I: $8x$. L: $2$. Suma de cruzados: $3x + 8x = 11x$. Total:
  $12x^2 + 11x + 2$.'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en producto de binomios lineales no mónicos.
ejemplos:
- titulo: Usando patrón general
  enunciado: Desarrolla $(2x + 3)(4x - 1)$.
  solucion_pasos:
  - 'Término en $x^2$: $2 \\\\\\cdot 4 = 8x^2$.'
  - 'Productos cruzados: $(2)(-1) = -2$; $(3)(4) = 12$. Suma: $10$. Así que $+10x$.'
  - 'Últimos: $(3)(-1) = -3$.'
  - 'Resultado: $8x^2 + 10x - 3$.'
- titulo: Si $(5x - 3)(2x + 7) = Ax^2 + Bx + C$, ¿cuál es el valor de $A + B + C$
  enunciado: 'Si $(5x - 3)(2x + 7) = Ax^2 + Bx + C$, ¿cuál es el valor de $A + B +
    C$?


    Opciones: A) $18$ · B) $10$ · C) $39$ · D) $29$'
  solucion_pasos:
  - 'F: $10x^2 \Rightarrow A=10$. Cruzados: $(5)(7) + (-3)(2) = 35 - 6 = 29 \Rightarrow
    B=29$. L: $(-3)(7) = -21 \Rightarrow C=-21$. $A+B+C = 10 + 29 - 21 = 39 - 21 =
    18$. Espera. Evaluando en $x=1$, obtenemos $(5(1)-3)(2(1)+7) = (2)(9) = 18$. La
    respuesta A) 8 era incorrecta, debe ser 18. Espera, arreglaré las alternativas
    en el choice. ¡Ah! Voy a poner 18.'
  - 'Respuesta: $18$'
- titulo: 'Respecto de «Producto de binomios lineales no mónicos»: ¿La siguiente formulación
    es correct'
  enunciado: 'Respecto de «Producto de binomios lineales no mónicos»: ¿La siguiente
    formulación es correcta? «El producto de dos binomios lineales generales $(ax+b)(cx+d)$
    no es estrictamente un ''producto notable'' tradicional, pero tiene un patrón
    fijo: **$(ax+b)(cx+d) = (ac)x^2 + (ad+bc)x + bd$** Esto es la aplicación formal
    del método FOIL (Firsts, Outers, Inners, Lasts)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El producto de dos binomios
    lineales generales $(ax+b)(cx+d)$ no es estrictamente un ''producto notable''
    tradicional, pero tiene un patrón fijo: **$(ax+b)(cx+d) = (ac)x^2 + (ad+bc)x +
    bd$** Esto es la aplicación formal del método FOIL (Firsts, Outers, Inners, Lasts).'
- titulo: 'Respecto de «Producto de binomios lineales no mónicos»: ¿La siguiente conclusión
    es correcta'
  enunciado: 'Respecto de «Producto de binomios lineales no mónicos»: ¿La siguiente
    conclusión es correcta? «Multiplicar solo los primeros y los últimos, obteniendo
    $(ax)(cx) + (b)(d)$, omitiendo completamente los términos cruzados»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El producto de dos binomios
    lineales generales $(ax+b)(cx+d)$ no es estrictamente un ''producto notable''
    tradicional, pero tiene un patrón fijo: **$(ax+b)(cx+d) = (ac)x^2 + (ad+bc)x +
    bd$** Esto es la aplicación formal del método FOIL (Firsts, Outers, Inners, Lasts).'
errores_frecuentes:
- Multiplicar solo los primeros y los últimos, obteniendo $(ax)(cx) + (b)(d)$, omitiendo
  completamente los términos cruzados.
- $12x^2 + 10x + 2$.
- $12x^2 + 8x + 2$.
- $7x^2 + 11x + 2$.
- Para «Si $(5x - 3)(2x + 7) = Ax^2 + Bx + C$, ¿cuál es el valor de $A + B + C$»,
  la respuesta correcta es $10$.
afirmaciones_verdaderas:
- Los productos notables permiten obtener desarrollos algebraicos sin multiplicar
  término a término.
al_terminar_debes_ponder: Reconocer y expandir expresiones utilizando producto de
  binomios lineales no mónicos.
