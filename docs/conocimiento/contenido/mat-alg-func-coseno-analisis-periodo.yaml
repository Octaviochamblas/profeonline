semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.PERIODO
resumen_inicial: 'Identificación del período fundamental de la función coseno: círculo
  unitario, amplitud, período y transformaciones de Análisis de la función coseno.'
explicacion_simple: Al igual que el seno, el coseno repite su patrón de valores exactamente
  cada $2\pi$ unidades a lo largo del eje $x$.
explicacion_formal: '### Definición formal


  Para $f(x)=\cos(x)$, el periodo es $T=2\pi$, ya que sumar $2\pi$ al ángulo corresponde
  a dar una vuelta completa en el círculo unitario, regresando al mismo punto y, por
  lo tanto, a la misma coordenada $x$.


  ### Desarrollo didáctico


  $\cos(0)=1$ y $\cos(0+2\pi)=\cos(2\pi)=1$: coinciden. Lo mismo ocurre en cualquier
  punto: $\cos(\pi)=-1$ y $\cos(\pi+2\pi)=\cos(3\pi)=-1$.'
definiciones_clave: '- **Identificación del período fundamental de la función coseno**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación del período fundamental de la función coseno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación del período fundamental de la función coseno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación del período fundamental de la función
    coseno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
