semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.PERIODO
resumen_inicial: 'Identificación del período fundamental $T = 2\pi$ de la función coseno base y su fórmula de cálculo $T = \frac{2\pi}{|B|}$.'
explicacion_simple: |
  Decir que una función es **periódica** significa que se repite exactamente igual cada cierto tramo del eje horizontal. La distancia más corta que debe recorrer la función coseno para completar una onda entera y volver a empezar se llama **período fundamental**. En la función coseno base, este período mide exactamente $2\pi$ radianes (o $360^\circ$). Si la función tiene una frecuencia diferente dentro del coseno (como $\cos(Bx)$), el nuevo período se calcula dividiendo $2\pi$ entre el número $|B|$.
explicacion_formal: |
  ### Definición formal
  La función coseno fundamental $f(x) = \cos(x)$ es **periódica** de período mínimo (o período fundamental) $T = 2\pi$ porque satisface la relación analítica para todo $x \in \mathbb{R}$:
  $$\cos(x + 2\pi) = \cos(x)$$

  Para la función coseno general $f(x) = A\cos(Bx + C) + D$ (con $B \neq 0$), el período viene dado por la fórmula de escalamiento horizontal:
  $$T = \frac{2\pi}{|B|}$$

  ### Desglose simbólico
  - $T$: Longitud de la menor ventana horizontal en la que la función realiza un ciclo completo.
  - $B$: Frecuencia angular o coeficiente de compresión/dilatación horizontal.
    - Si $|B| > 1 \implies$ Compresión horizontal $\implies$ Período más corto.
    - Si $0 < |B| < 1 \implies$ Dilatación horizontal $\implies$ Período más largo.

  ### Síntesis didáctica
  El período $T$ indica la velocidad de oscilación de la onda cosenoidal. Un período de $2\pi$ implica que una vuelta completa alrededor del círculo unitario se traduce en exactamente un ciclo de la gráfica cartesiana.
definiciones_clave: |
  - **Período fundamental ($T$)**: Menor constante positiva $T > 0$ tal que $f(x + T) = f(x)$ para todo $x$.
  - **Frecuencia angular ($B$)**: Parámetro numérico que modifica la velocidad de oscilación horizontal.
  - **Ciclo completo**: Tramo continuo de la gráfica que abarca un descenso de cresta a valle y retorno a la cresta.
propiedades_relaciones: |
  - **Invariancia frente a amplitud o desfases**: El valor del período $T$ depende **exclusivamente del parámetro $B$**; no se altera por cambios en $A$, $C$ o $D$.
  - **Relación con la frecuencia ($f$)**: La frecuencia $f = \frac{1}{T} = \frac{|B|}{2\pi}$ mide la cantidad de ciclos por unidad de longitud.
ejemplo_guiado:
  enunciado: 'Calcula el período fundamental $T$ de la función cosenoidal $g(x) = 2\cos(6x - \frac{\pi}{2}) + 3$.'
  pasos:
    - 'Paso 1: Identificar los parámetros de la función: $A = 2$, $B = 6$, $C = -\frac{\pi}{2}$ y $D = 3$.'
    - 'Paso 2: Reconocer que el parámetro que determina el período es únicamente el coeficiente $B = 6$.'
    - 'Paso 3: Aplicar la fórmula del período fundamental: $T = \frac{2\pi}{|B|} = \frac{2\pi}{6}$.'
    - 'Paso 4: Simplificar la fracción: $T = \frac{\pi}{3}$. La función realiza una onda completa cada $\frac{\pi}{3}$ unidades de longitud.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el período fundamental de la función coseno base $f(x) = \cos(x)$?'
    choices:
      - {text: '$T = 2\pi$', is_correct: true}
      - {text: '$T = \pi$', is_correct: false}
      - {text: '$T = \frac{\pi}{2}$', is_correct: false}
      - {text: '$T = 4\pi$', is_correct: false}
    explanation: 'La alternativa correcta es ''$T = 2\pi$''. La onda cosenoidal base completa un ciclo entero en una distancia horizontal de $2\pi$ radianes ($360^\circ$).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el período $T$ de la función $f(x) = \cos(4x)$?'
    choices:
      - {text: '$T = \frac{\pi}{2}$', is_correct: true}
      - {text: '$T = \pi$', is_correct: false}
      - {text: '$T = 2\pi$', is_correct: false}
      - {text: '$T = 4\pi$', is_correct: false}
    explanation: 'La alternativa correcta es ''$T = \frac{\pi}{2}$''. Aplicando la fórmula: $T = \frac{2\pi}{4} = \frac{\pi}{2}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el coeficiente $B$ que multiplica a la variable $x$ dentro del argumento del coseno.'
  - 'Paso 2: Tomar el valor absoluto de dicho coeficiente $|B|$.'
  - 'Paso 3: Aplicar el cociente $T = \frac{2\pi}{|B|}$.'
  - 'Paso 4: Simplificar la fracción para obtener el período exacto en radianes.'
errores_correccion: |
  - **Error 1:** Creer que el período del coseno base es $\pi$ (confundiéndolo con la tangente). **Cómo corregirlo:** La función coseno requiere un giro completo de $2\pi$ para retornar a la misma altura con la misma dirección de pendiente.
  - **Error 2:** Alterar el cálculo del período al cambiar la amplitud $A$ o el desplazamiento $D$. **Cómo corregirlo:** El período está controlado de manera exclusiva por el parámetro de frecuencia horizontal $B$.
ejemplos:
  - titulo: 'Período con dilatación horizontal'
    enunciado: '¿Cuál es el período de la función $h(x) = \cos\left(\frac{x}{3}\right)$?'
    alternativas:
      - '$6\pi$'
      - '$3\pi$'
      - '$2\pi$'
    respuesta: '$6\pi$'
    solucion_pasos:
      - '1. El coeficiente de $x$ es $B = \frac{1}{3}$.'
      - '2. $T = \frac{2\pi}{1/3} = 6\pi$.'
  - titulo: 'Período en grados sexagesimales'
    enunciado: '¿A cuántos grados equivale el período fundamental de la función coseno base?'
    alternativas:
      - '$360^\circ$'
      - '$180^\circ$'
      - '$90^\circ$'
    respuesta: '$360^\circ$'
    solucion_pasos:
      - '1. $T = 2\pi \text{ rad}$.'
      - '2. $2\pi \text{ rad} = 360^\circ$.'
  - titulo: 'Constancia de repetición'
    enunciado: '¿Se cumple la igualdad $\cos(x + 4\pi) = \cos(x)$ para todo $x$ real?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $4\pi$ es dos veces el período fundamental $2\pi$, por lo que la función se repite idénticamente.'
  - titulo: 'Independencia de la amplitud'
    enunciado: '¿La función $f(x) = 50\cos(x)$ tiene el mismo período $2\pi$ que la función base?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, cambiar la amplitud de 1 a 50 altera la altura pero no la longitud del ciclo.'
errores_frecuentes:
  - 'La afirmación de que el período fundamental de la función coseno base es igual a $\pi$.'
  - 'La afirmación de que aumentar la amplitud $A$ provoca que el período de la cosenoide se vuelva más largo.'
  - 'La afirmación de que el período de $f(x) = \cos(2x)$ es igual a $4\pi$.'
  - 'La afirmación de que el parámetro $C$ de desfase horizontal altera la longitud del período fundamental.'
  - 'La afirmación de que una función cosenoidal puede tener un período negativo.'
afirmaciones_verdaderas:
  - 'El período fundamental de la función coseno base $f(x) = \cos(x)$ es exactamente $T = 2\pi$ radianes ($360^\circ$).'
  - 'Para cualquier función cosenoidal de la forma $f(x) = A\cos(Bx + C) + D$, el período fundamental se calcula mediante $T = \frac{2\pi}{|B|}$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y calcular el período fundamental $T$ de cualquier función cosenoidal.
  CÓMO: Aplicar la fórmula $T = \frac{2\pi}{|B|}$ utilizando el coeficiente de frecuencia horizontal $B$.
