semantic_id: MAT.GEO.AREAS_TRIANGULOS.FORMULA_DOS_LADOS_ANGULO
resumen_inicial: 'Fórmula del área con dos lados y ángulo comprendido: A = ½ab·sen(C):
  conceptos, teoremas, propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: Si conoces dos lados de un triángulo y el ángulo que forman entre
  ellos, no necesitas la altura ni el tercer lado para calcular su área.
explicacion_formal: '![Área con dos lados y ángulo comprendido](/static/img/geometria/areas-pitagoras/areas-triangulos-formula-dos-lados-angulo.svg)


  ### Definición formal


  Dado un triángulo con dos lados $a$ y $b$, y el ángulo $C$ comprendido entre ellos,
  el área se calcula como

  $A=\frac{1}{2}ab\,\text{sen}(C)$.


  ### Desarrollo didáctico


  Esta fórmula equivale a la fórmula base por altura, ya que $b\,\text{sen}(C)$ representa
  exactamente la

  altura relativa al lado $a$, sin necesidad de calcularla por separado.'
definiciones_clave: '- **Fórmula del área con dos lados y ángulo comprendido: A =
  ½ab·sen(C)**: Elemento o propiedad fundamental en el estudio de perímetros, áreas
  y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a fórmula del área con dos lados y ángulo comprendido:
  a = ½ab·sen(c).'
