procedimiento:
- 'Paso 1: Observa el signo de la razón de homotecia k.'
- 'Paso 2: Si k es positivo, la homotecia es directa.'
- 'Paso 3: Verifica que cada punto imagen esté del mismo lado del centro que su punto
  original.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con homotecia directa con razón positiva.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de homotecia directa con razón positiva para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando homotecia directa con razón positiva.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de homotecia directa con razón positiva
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de homotecia directa con razón positiva.
- titulo: ¿Se cumple siempre la propiedad principal de homotecia directa con razón
    positiva en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede homotecia directa con razón positiva asumir un valor negativo cuando
    representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en homotecia directa con razón positiva.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en homotecia directa
  con razón positiva.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en homotecia directa
  con razón positiva.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de homotecia
  directa con razón positiva.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
al_terminar_debes_poder: Identificar, calcular y aplicar las propiedades de homotecia
  directa con razón positiva en problemas geométricos.
