semantic_id: MAT.GEO.HOMOTECIA.DIRECTA
resumen_inicial: 'Homotecia directa con razón positiva: conceptos, teoremas, propiedades
  geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Según el signo de la razón k, las homotecias se dividen en dos
  tipos con comportamientos visuales muy distintos; el primero es la homotecia directa.
explicacion_formal: '![Homotecia directa (razón positiva)](/static/img/geometria/congruencia-semejanza/homotecia-directa.svg)


  ### Definición formal


  Si $k>0$, la homotecia se llama directa: para cada punto $P$, su imagen $P''=O+k(P-O)$
  se ubica en el mismo rayo (semirrecta) que parte de $O$ y pasa por $P$.


  ### Desarrollo didáctico


  En una homotecia directa, la figura imagen conserva la misma orientación que la
  original (no se invierte); solo cambia de tamaño según el valor de $k$ (ampliándose
  si $k>1$, reduciéndose si $0<k<1$).'
definiciones_clave: '- **Homotecia directa con razón positiva**: Elemento o propiedad
  fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a homotecia directa con razón positiva.'
ejemplo_guiado:
  enunciado: En la aplicación de homotecia directa con razón positiva, se establece
    una razón $k = 4.0$ entre dos figuras homólogas de longitud original $L = 25\text{
    cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de homotecia directa con razón positiva.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 4.0 \cdot 25$.'
  - Concluir que la medida obtenida en homotecia directa con razón positiva es $L'
    = 100.0\text{ cm}$.
