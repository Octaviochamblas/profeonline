semantic_id: MAT.ALG.MODELAMIENTO_AFIN.PREDICCION_MODELO_AFIN
resumen_inicial: La predicción de valores mediante un modelo afín consiste en sustituir valores futuros en la variable independiente para estimar resultados o despejar la entrada necesaria para alcanzar una meta.
explicacion_simple: '![La predicción de valores mediante un modelo afín consiste en sustituir valores futuros en la variable independiente para estimar resultados o despejar la entrada necesaria para alcanzar una meta](/static/img/nodos/prediccion-de-valores-mediante-modelo-afin-intro.svg)



  Una vez que tienes la fórmula del modelo afín $f(x) = mx + n$, puedes usarla para responder dos tipos de preguntas cruciales:


  1. **Predicción hacia adelante (evaluar):** *Si el consumo es $x = 20$, ¿cuánto pagaré?* $\implies$ Reemplazas $x$ en la fórmula y calculas $y$.

  2. **Planificación hacia atrás (despejar):** *Si mi presupuesto es de $\$15.000$, ¿cuánto puedo consumir?* $\implies$ Igualas $f(x) = 15.000$ y despejas la incógnita $x = \frac{15.000 - n}{m}$.'
explicacion_formal: 'Dado un modelo afín calibrado $f(x) = mx + n$ ($m \neq 0$) válido en un dominio físico $D \subseteq \mathbb{R}$:

  1. **Inferencia directa (Predicción / Interpolación / Extrapolación)**:

  $$y^* = f(x^*) = mx^* + n, \quad x^* \in D$$

  2. **Inferencia inversa (Control / Meta / Planificación)**:

  $$f(x) = y_{\text{meta}} \Longleftrightarrow x = f^{-1}(y_{\text{meta}}) = \frac{y_{\text{meta}} - n}{m}$$


  **Límites de validez del modelo:**

  - **Extrapolación prudente**: Las predicciones para valores de $x$ muy alejados del rango de calibración pierden precisión si las condiciones del entorno cambian.'
definiciones_clave: '- **Inferencia directa**: Estimación del valor de salida evaluando una entrada dada en el modelo.

  - **Inferencia inversa**: Cálculo de la preimagen requerida para obtener una imagen predeterminada.'
propiedades_relaciones: '- **Exactitud del modelo**: La precisión de la predicción depende de la estabilidad de la tasa constante $m$.

  - **Restricción de soluciones reales**: La solución $x$ debe tener sentido físico (ej: tiempo $t \ge 0$, cantidades enteras no negativas).'
ejemplo_guiado:
  enunciado: '![Ejemplo La predicción de valores mediante un modelo afín consiste en sustituir valores futuros en la variable independiente para estimar resultados o despejar la entrada necesaria para alcanzar una meta](/static/img/nodos/prediccion-de-valores-mediante-modelo-afin-ejemplos.svg)



    Un plan de internet móvil cuesta $C(x) = 350x + 4.990$, donde $x$ son los gigas adicionales consumidos.

    1) Predice el costo total si se consumen $14\text{ gigas}$ extras.

    2) Si un usuario dispone de $\$11.990$, ¿cuántos gigas adicionales como máximo puede consumir?'
  pasos:
  - 'Paso 1: Predicción directa: evaluar en $x = 14$: $C(14) = 350(14) + 4.990 = 4.900 + 4.990 = \$9.890$.'
  - 'Paso 2: Planificación inversa: igualar el costo a $\$11.990$: $350x + 4.990 = 11.990$.'
  - 'Paso 3: Restar el cargo fijo: $350x = 11.990 - 4.990 = 7.000$.'
  - 'Paso 4: Despejar la cantidad de gigas: $x = \frac{7.000}{350} = 20\text{ gigas}$.'
  - 'Paso 5: Concluir que con $\$11.990$ puede consumir exactamente $20\text{ gigas}$ adicionales.'
checkpoints:
- placement: after_explicacion_formal
  question: En el modelo de vaciado de una piscina $V(t) = 8000 - 400t$ ($t$ en horas), ¿en cuántas horas se vaciará completamente (V = 0)?
  choices:
  - text: 20 horas
    is_correct: true
  - text: 80 horas
    is_correct: false
  - text: 40 horas
    is_correct: false
  - text: 10 horas
    is_correct: false
  explanation: La alternativa correcta es '20 horas'. $8000 - 400t = 0 \implies 400t = 8000 \implies t = 20$ horas.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para $f(x) = 150x + 1200$, ¿cuál es la predicción del valor de salida cuando la entrada es $x = 30$?
  choices:
  - text: '5700'
    is_correct: true
  - text: '4500'
    is_correct: false
  - text: '4650'
    is_correct: false
  - text: '5850'
    is_correct: false
  explanation: La alternativa correcta es '5700'. $f(30) = 150(30) + 1200 = 4500 + 1200 = 5700$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar el tipo de pregunta (predicción directa de salida o cálculo inverso de entrada).'
- 'Paso 2: Si se pide predecir el resultado, sustituir el valor de $x$ en la fórmula y operar.'
- 'Paso 3: Si se pide calcular la meta o recurso, igualar la función al valor objetivo y despejar $x$.'
- 'Paso 4: Comprobar la coherencia física y contextual del resultado obtenido.'
errores_correccion: '- **Error común:** Confundir evaluar la función con resolver una ecuación cuando se da un presupuesto o meta.

  - **Cómo corregirlo:** Si te dan la **entrada** (horas, km, unidades), **evalúas** $f(x)$; si te dan la **salida** (dinero total, volumen final), **igualas y despejas** $x$.'
ejemplos:
- titulo: 'Ejemplo 1: Estimación de costo'
  enunciado: Si $C(x) = 750x + 3.000$, ¿cuál es el costo estimado para $x = 8$ unidades?
  alternativas:
  - $9.000
  - $6.000
  - $8.500
  - $10.000
  respuesta: $9.000
  solucion_pasos:
  - 'Paso 1: $C(8) = 750(8) + 3000 = 6000 + 3000 = \$9.000$.'
- titulo: 'Ejemplo 2: Meta de ahorro'
  enunciado: Un fondo de ahorro tiene $A(m) = 40.000m + 200.000$. ¿En cuántos meses se alcanzará $\$1.000.000$?
  alternativas:
  - 20 meses
  - 25 meses
  - 15 meses
  - 18 meses
  respuesta: 20 meses
  solucion_pasos:
  - 'Paso 1: $40000m + 200000 = 1000000 \implies 40000m = 800000 \implies m = 20$ meses.'
- titulo: 'Ejemplo 3: Extrapolación de temperatura'
  enunciado: Si $T(t) = 3t + 18$, ¿cuál será la temperatura a los 12 minutos?
  alternativas:
  - 54 °C
  - 36 °C
  - 48 °C
  - 60 °C
  respuesta: 54 °C
  solucion_pasos:
  - 'Paso 1: $T(12) = 3(12) + 18 = 36 + 18 = 54^\circ\text{C}$.'
- titulo: 'Ejemplo 4: Límite de presupuesto'
  enunciado: Con $C(x) = 250x + 1000$ y un presupuesto de $\$4.500$, ¿cuál es el número máximo de unidades?
  alternativas:
  - 14 unidades
  - 18 unidades
  - 12 unidades
  - 16 unidades
  respuesta: 14 unidades
  solucion_pasos:
  - 'Paso 1: $250x + 1000 = 4500 \implies 250x = 3500 \implies x = 14$ unidades.'
errores_frecuentes:
- Sustituir el valor de la meta en la variable x en lugar de igualar la función.
- Olvidar restar el intercepto al despejar la incógnita x.
- Obtener cantidades negativas en contextos donde solo se admiten valores positivos.
afirmaciones_verdaderas:
- La predicción directa consiste en evaluar preimágenes en el modelo afín para estimar valores futuros de salida.
- La resolución de metas requiere resolver una ecuación de primer grado despejando la variable independiente.
al_terminar_debes_poder: '**QUÉ:** Realizar predicciones directas y cálculos inversos de planificación utilizando modelos afines.


  **CÓMO:** Evaluando el modelo f(x) = mx + n para proyecciones y despejando x = (y - n)/m para la consecución de objetivos.


