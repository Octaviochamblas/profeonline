semantic_id: MAT.ALG.MODELAMIENTO_AFIN.PREDICCION_MODELO_AFIN
resumen_inicial: 'Predicción de valores mediante modelo afín: conceptos, representación
  y propiedades en Modelamiento lineal y afín.'
explicacion_simple: Una vez que tienes la fórmula completa, puedes "adelantarte en
  el tiempo" (o en cualquier otra variable) y calcular resultados que todavía no has
  observado directamente.
explicacion_formal: '### Definición formal


  Dado un modelo $f(x)=mx+n$ ajustado a datos observados, predecir el valor de la
  magnitud dependiente para un valor $x_0$ (usualmente fuera del rango observado)
  consiste en calcular $f(x_0)=mx_0+n$, bajo el supuesto de que la tasa de cambio
  $m$ se mantiene constante también en ese nuevo valor.


  ### Desarrollo didáctico


  La predicción es simplemente evaluar la fórmula ya construida en el nuevo valor
  solicitado; la parte importante es tener la fórmula correcta antes de predecir.


  Si $P(t)=1200t+50000$ modela la población desde el año 2020 ($t=0$), predecir la
  población en 2030 significa evaluar $P(10)=1200(10)+50000=62000$ habitantes.'
definiciones_clave: '- **Predicción de valores mediante modelo afín**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a predicción de valores mediante modelo afín.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a predicción de valores
    mediante modelo afín.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a predicción de valores mediante
    modelo afín.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
