  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar qué variable se entrega como dato (entrada $x$ o salida $y$).'
- 'Paso 2: Si entregan la entrada $x$, evaluar $f(x)$ sustituyendo directamente.'
- 'Paso 3: Si entregan la salida $y$, resolver la ecuación $m x + n = y$ para despejar
  $x$.'
- 'Paso 4: Interpretar el resultado obtenido con sus unidades contextuales.'
errores_correccion: '- **Error común:** Evaluar la variable entregada en la posición
  equivocada (reemplazar la salida en la $x$).

  - **Cómo corregirlo:** Si el dato dado es el resultado total (ejemplo: pesos o volumen
  final), debes igualar la función completa a ese dato y despejar $x$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una tasa de cambio constante m indica que el proceso se puede modelar con
    una función afín?
  respuesta: Sí
  solucion_pasos:
  - Sí, la razón incremental constante caracteriza a los modelos afines y lineales.
- titulo: ¿El cargo fijo n representa la salida en el momento inicial x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, f(0) = n es el intercepto o condición de partida.
errores_frecuentes:
- Confundir la tasa de cambio $m$ (unidades compuestas) con el valor acumulado inicial
  $n$ (unidades simples).
- Agregar un cargo fijo $n$ en situaciones de proporcionalidad directa donde no existe
  valor inicial.
- Multiplicar la variable $x$ por el cargo fijo $n$ en lugar de multiplicarla por
  la tarifa unitaria $m$.
- Confundir el crecimiento lineal (suma constante por año) con el crecimiento exponencial
  (porcentaje constante por año).
- Sustituir el valor de la salida $y$ en el lugar de la entrada $x$ al realizar una
  predicción en el modelo.
afirmaciones_verdaderas:
- La pendiente $m$ en un modelo afín contextual representa la tasa de cambio unitaria
  constante $\frac{\Delta y}{\Delta x}$.
- El intercepto $n$ representa la condición inicial, costo base o valor de partida
  del sistema cuando la variable de entrada vale cero ($x = 0$).
al_terminar_debes_poder: Al finalizar este recurso podrás identificar tasas de cambio
  constantes, construir modelos lineales y afines contextuales e interpretar pendiente
  e intercepto para realizar predicciones.
