semantic_id: MAT.ALG.MODELAMIENTO_AFIN.PREDICCION_MODELO_AFIN
resumen_inicial: La predicción de valores mediante un modelo afín utiliza la fórmula $f(x) = mx + b$ para calcular estados futuros o resolver condiciones inversas.
explicacion_simple: |
  Una vez que tienes la fórmula afín $f(x) = mx + b$ de un problema, puedes hacer dos tipos de **predicciones**:

  1. **Calcular la salida dada la entrada**: Reemplazas el valor $x$ en la fórmula y calculas $y$.
     - Ejemplo: ¿Cuánto pagaré por $12$ km? $\implies$ evalúas $f(12)$.
  2. **Calcular la entrada dada la salida**: Igualas la fórmula a una meta $y$ y despejas $x$.
     - Ejemplo: Si pagué $\$10.000$, ¿cuántos km viajé? $\implies$ resuelves $mx + b = 10.000$.
explicacion_formal: |
  Dada la función afín $f: D \subseteq \mathbb{R} \to \mathbb{R}$ con $f(x) = mx + b$ ($m \neq 0$), el proceso de **predicción analítica** abarca dos tipos de problemas:

  1. **Interpolación / Extrapolación directa (evaluación)**:
     $$y_{\text{predicho}} = f(x_{\text{dado}}) = m \cdot x_{\text{dado}} + b$$

  2. **Inversión contextual (resolución de ecuación)**:
     $$x_{\text{necesario}} = f^{-1}(y_{\text{meta}}) = \frac{y_{\text{meta}} - b}{m}$$
definiciones_clave: |
  - **Predicción mediante modelo afín**: Estimación cuantitativa de estados no observados del sistema mediante la evaluación directa o inversión de la función afín.
propiedades_relaciones: |
  - **Validez de la extrapolación**: Las predicciones para valores de $x$ muy alejados del rango de datos originales deben interpretarse con cautela respetando el dominio del fenómeno real.
ejemplo_guiado:
  enunciado: 'El saldo restante en una tarjeta de transporte tras $n$ viajes es $S(n) = 20.000 - 800n$ pesos. a) Predice el saldo tras $15$ viajes. b) Determina cuántos viajes se realizaron si el saldo es $\$5.600$.'
  pasos:
    - 'Paso 1: Para a), evaluar en $n = 15$: $S(15) = 20.000 - 800(15) = 20.000 - 12.000 = 8.000$ pesos.'
    - 'Paso 2: Para b), igualar $S(n) = 5.600$: $20.000 - 800n = 5.600$.'
    - 'Paso 3: Despejar $n$: $800n = 20.000 - 5.600 = 14.400 \implies n = \frac{14.400}{800} = 18$ viajes.'
    - 'Paso 4: Concluir que tras $15$ viajes quedan $\$8.000$ y que $\$5.600$ de saldo corresponden a $18$ viajes.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el saldo $S(n) = 20.000 - 800n$, ¿cuál es el saldo restante tras 15 viajes?'
    choices:
      - {text: '$8.000 pesos', is_correct: true}
      - {text: '$12.000 pesos', is_correct: false}
      - {text: '$5.600 pesos', is_correct: false}
      - {text: '$10.000 pesos', is_correct: false}
    explanation: 'La alternativa correcta es ''$8.000 pesos''. $S(15) = 20.000 - 800(15) = 20.000 - 12.000 = 8.000$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En el mismo saldo $S(n) = 20.000 - 800n$, si quedan $5.600 pesos de saldo, ¿cuántos viajes se realizaron?'
    choices:
      - {text: '18 viajes', is_correct: true}
      - {text: '15 viajes', is_correct: false}
      - {text: '20 viajes', is_correct: false}
      - {text: '25 viajes', is_correct: false}
    explanation: 'La alternativa correcta es ''18 viajes''. $20.000 - 800n = 5.600 \implies 800n = 14.400 \implies n = 18$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Asegurar que la fórmula del modelo afín $f(x) = mx + b$ esté correctamente construida.'
  - 'Paso 2: Identificar si se pide evaluar una entrada $x$ o despejar una salida $y$.'
  - 'Paso 3: Si se pide salida, sustituir $x$ en la fórmula y operar; si se pide entrada, resolver $mx + b = y$.'
  - 'Paso 4: Redactar la conclusión expresando las unidades del problema.'
errores_correccion: |
  - **Error común:** Confundir la variable de entrada con la de salida al realizar la sustitución en la fórmula.
  - **Cómo corregirlo:** Lee atentamente qué magnitud representa $x$ (ej. viajes) y cuál representa $y$ (ej. pesos) antes de reemplazar.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de modelamiento afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de modelamiento afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Para predecir el valor de salida en un modelo afín $f(x) = mx + b$ se debe igualar la pendiente a cero.'
  - 'Reemplazar una entrada $x = 10$ en el modelo $S(n) = 20.000 - 800n$ exige restar $20.000$ antes de multiplicar.'
  - 'Calcular la variable de entrada dada una salida $y$ en un modelo afín genera siempre dos soluciones numéricas distintas.'
  - 'Las predicciones realizadas con un modelo afín son siempre infinitamente válidas para cualquier valor de $x$ real.'
  - 'Evaluar $f(x) = mx + b$ en un valor futuro equivale a calcular la ordenada al origen de la función cuadrática.'
afirmaciones_verdaderas:
  - 'Predicciones en un modelo afín $f(x) = mx + b$ involucran evaluar $f(x_{\text{dado}})$ para hallar salidas o resolver $mx + b = y_{\text{meta}}$ para determinar la entrada requerida.'
  - 'La validez de las predicciones obtenidas por extrapolación depende de las restricciones contextuales del dominio del problema.'
al_terminar_debes_poder: |
  QUÉ: Realizar predicciones e interpretaciones inversas a partir de un modelo afín dado.
  CÓMO: Evaluar $f(x)$ para datos de entrada o despejar $x$ en la ecuación $mx + b = y$ según la consulta planteada.
