procedimiento:
- 'Paso 1: Asegúrate de tener la fórmula completa del modelo afín, con $m$ y $n$ determinados.'
- 'Paso 2: Identifica el valor de $x$ para el cual se desea predecir (usualmente un
  tiempo futuro).'
- 'Paso 3: Sustituye ese valor en la fórmula y calcula el resultado.'
- 'Paso 4: Interpreta el resultado en el contexto del problema.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar predicción de valores mediante modelo afín.
ejemplos:
- titulo: Predicción de costo futuro
  enunciado: Si $C(x)=200x+5000$ modela el costo de producción según las unidades
    $x$, predice el costo de producir 30 unidades.
  solucion_pasos:
  - Se evalúa $C(30) = 200(30)+5000$.
  - $C(30) = 6000+5000 = 11000$.
  - El costo de producir 30 unidades es \$11.000.
- titulo: Predicción de población futura
  enunciado: Si $P(t)=80t+3000$ modela la población de un pueblo según los años $t$,
    predice la población en $t=15$.
  solucion_pasos:
  - Se evalúa $P(15) = 80(15)+3000$.
  - $P(15) = 1200+3000 = 4200$.
- titulo: ¿Predecir con un modelo afín asume que la tasa de cambio se mantiene constante?
  enunciado: ¿Predecir con un modelo afín asume que la tasa de cambio se mantiene
    constante?
  respuesta: Sí
  solucion_pasos:
  - Es la hipótesis central del modelo lineal/afín aplicado a predicciones.
- titulo: ¿Las predicciones de un modelo afín son siempre exactas en la realidad?
  enunciado: ¿Las predicciones de un modelo afín son siempre exactas en la realidad?
  respuesta: 'No'
  solucion_pasos:
  - Son estimaciones basadas en el supuesto de tasa constante; la realidad puede desviarse
    de ese patrón, especialmente lejos del rango observado.
errores_frecuentes:
- Sustituir el valor de $x$ en la fórmula incorrecta o incompleta.
- Confundir la predicción con la interpretación de los parámetros del modelo.
- No verificar si el valor solicitado está dentro de un rango razonable para el modelo.
- Olvidar interpretar el resultado numérico en el contexto original del problema.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando predicción
  de valores mediante modelo afín.
