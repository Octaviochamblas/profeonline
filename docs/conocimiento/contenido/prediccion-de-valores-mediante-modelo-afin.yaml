semantic_id: MAT.ALG.MODELAMIENTO_AFIN.PREDICCION_MODELO_AFIN
resumen_inicial: Predecir valores mediante un modelo afín consiste en sustituir una
  variable conocida en la ecuación para interpolar o extrapolar resultados futuros
  o pasados.
explicacion_simple: 'Una vez que tenemos la fórmula afín de un modelo (por ejemplo
  el costo de producción $C(x) = 150x + 4.000$):

  - **Para predecir el costo** de fabricar $200$ unidades, reemplazamos $x = 200$
  en la fórmula.

  - **Para predecir cuántas unidades se fabricaron** si el costo total fue $\$10.000$,
  igualamos $150x + 4.000 = 10.000$ y despejamos $x$.'
explicacion_formal: 'Dada la función modelo $f: \operatorname{Dom}(f) \to \operatorname{Rec}(f)$
  con $f(x) = m x + n$:

  1. **Extrapolación directa (evaluación)**: $y_{\text{pred}} = f(x_{\text{dado}})
  = m x_{\text{dado}} + n$.

  2. **Extrapolación inversa (preimagen)**: $x_{\text{pred}} = f^{-1}(y_{\text{dado}})
  = \frac{y_{\text{dado}} - n}{m}$.


  **Desglose de la fórmula:**

  - Utilización analítica de la recta modelo para estimar comportamientos fuera o
  dentro del rango de datos muestreados.'
definiciones_clave: '- **Predicción / Extrapolación**: Estimación de un valor futuro
  o no observado mediante la evaluación de la función modelo.'
propiedades_relaciones: '- **Validez del dominio**: Las predicciones son confiables
  solo dentro del rango realista del dominio del fenómeno.'
ejemplo_guiado:
  enunciado: El nivel de agua de un embalse disminuye según el modelo $H(t) = -0{,}4t
    + 12$ (donde $H$ es altura en metros y $t$ es días). Predice la altura en el día
    $15$ y determina cuántos días tardará en vaciarse por completo ($H = 0$).
  pasos:
  - 'Paso 1: Para la altura en el día $15$: evaluar $H(15) = -0{,}4(15) + 12 = -6
    + 12 = 6\text{ metros}$.Paso 2: Para el vaciado completo ($H = 0$): igualar $-0{,}4t
    + 12 = 0$.Paso 3: Despejar $t$: $-0{,}4t = -12 \implies t = \frac{-12}{-0{,}4}
    = 30\text{ días}$.Paso 4: Concluir que al día $15$ habrá $6\text{ m}$ de agua
    y se vaciará completamente al día $30$.'
