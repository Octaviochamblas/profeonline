semantic_id: MAT.GEO.POLIEDROS_PRISMAS.PRISMA_CARAS_LATERALES
resumen_inicial: 'Identificación de las caras laterales de un prisma recto: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'Las caras laterales de un prisma son como sus ''paredes'': las
  superficies rectangulares que unen la base superior con la inferior.'
explicacion_formal: '![Caras laterales de un prisma recto](/static/img/geometria/espacio-cuerpos/prisma-caras-laterales.svg)


  ### Definición formal


  Las caras laterales de un prisma recto son las caras rectangulares (distintas de
  las bases) que conectan cada arista de una base con la arista correspondiente de
  la otra base. El número de caras laterales es igual al número de lados de la base.


  ### Desarrollo didáctico


  En la figura, las caras resaltadas (que no son ni la base superior ni la inferior)
  son caras laterales del prisma: conectan los vértices de una base con los de la
  otra. Un prisma de base cuadrada tiene 4 caras laterales; uno de base hexagonal
  tendría 6.'
