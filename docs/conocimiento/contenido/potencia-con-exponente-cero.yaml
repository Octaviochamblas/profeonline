semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_CERO
resumen_inicial: Todo número real distinto de cero elevado a la potencia cero es igual
  a uno ($a^0 = 1$ para $a \neq 0$).
explicacion_simple: 'Cualquier número (positivo, negativo o fracción), salvo el cero,
  elevado a $0$ da siempre $1$:

  - $5^0 = 1$

  - $(-8)^0 = 1$

  - $\left(\frac{2}{7}\right)^0 = 1$

  Esto surge de dividir una potencia por sí misma: $\frac{a^n}{a^n} = a^{n-n} = a^0
  = 1$.'
explicacion_formal: Para todo $a \in \mathbb{R} \setminus \{0\}$, se define $a^0 =
  1$. Esta definición mantiene la consistencia con las leyes de exponentes, en particular
  la división de potencias de igual base $\frac{a^n}{a^n} = a^{n-n} = a^0 = 1$.
definiciones_clave: '- **Propiedad del exponente cero**: $a^0 = 1$ para $a \neq 0$.'
propiedades_relaciones: '- **Independencia de la base no nula**: No importa cuán grande
  o pequeño sea el número $a \neq 0$, $a^0$ siempre es $1$.'
ejemplo_guiado:
  enunciado: Calcula A) $250^0$ y B) $(-15)^0$.
  pasos:
  - 'Para A: $250 \neq 0$, por lo que $250^0 = 1$.'
  - 'Para B: $(-15) \neq 0$, por lo que $(-15)^0 = 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\left(\frac{3}{4}\right)^0$?
  choices:
  - text: '1'
    is_correct: true
  - text: '0'
    is_correct: false
  - text: 3/4
    is_correct: false
  - text: Indefinido
    is_correct: false
  explanation: 'La correcta es: 1. Cualquier base distinta de cero elevada a cero
    es igual a 1.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $-5^0$ (atención a los paréntesis)?
  choices:
  - text: '-1'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '0'
    is_correct: false
  - text: '-5'
    is_correct: false
  explanation: 'La correcta es: -1. Como no hay paréntesis, la base es 5 ($5^0 = 1$),
    y el signo negativo se conserva: $-(5^0) = -1$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que la base sea distinta de cero.'
- 'Paso 2: Si el exponente es 0, reemplazar la potencia completa por 1.'
- 'Paso 3: Si hay un signo negativo fuera de paréntesis, aplicar la negación al final.'
errores_correccion: No digas que $a^0 = 0$. Multiplicar cero factores da como elemento
  neutro el $1$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $(-100)^0$.
  alternativas:
  - '1'
  - '-1'
  - '0'
  respuesta: '1'
  solucion_pasos:
  - La base es $-100 \neq 0$. Por lo tanto, $(-100)^0 = 1$.
errores_frecuentes:
- Pensar que $a^0 = 0$.
afirmaciones_verdaderas:
- $a^0 = 1$ para todo número real $a \neq 0$.
al_terminar_debes_poder: Evaluar instantáneamente potencias con exponente cero.
fuente: Texto escolar MINEDUC.
estado: publicado
