semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_CERO
resumen_inicial: Todo número real distinto de cero elevado a la potencia cero es igual a uno ($a^0 = 1$ para $a \neq 0$).
explicacion_simple: '![Potencia con exponente cero](/static/img/nodos/potencia-con-exponente-cero-intro.svg)


  Cualquier número (positivo, negativo, fracción o raíz), siempre que no sea cero, da como resultado $1$ cuando se eleva a $0$. Esto ocurre porque equivale a dividir un número por sí mismo: por ejemplo, $5^2 / 5^2 = 5^{2-2} = 5^0 = 1$. Pero mucho ojo con los paréntesis: $(-8)^0 = 1$, pero $-8^0 = -1$ porque el signo negativo queda afuera.'
explicacion_formal: 'Para todo número real $a \in \mathbb{R} \setminus \{0\}$, la **Potencia con Exponente Cero** se define como:


  $$a^0 = 1 \quad (a \neq 0)$$


  **Demostración mediante el cociente de potencias de igual base:**

  Sea $n \in \mathbb{N}$ y $a \neq 0$:

  $$\frac{a^n}{a^n} = a^{n-n} = a^0$$

  Como cualquier número no nulo dividido por sí mismo es igual a $1$:

  $$\frac{a^n}{a^n} = 1 \implies a^0 = 1$$


  > **Restricción fundamental:** La expresión $0^0$ carece de definición algebraica unívoca y constituye una forma indeterminada.'
definiciones_clave: '- **Exponente cero**: Superíndice $0$ que asigna el valor $1$ a cualquier base no nula.

  - **Condición de existencia**: La base $a$ debe ser estrictamente distinta de cero ($a \neq 0$).'
propiedades_relaciones: '- **Signos y paréntesis**: $(-a)^0 = 1$ mientras que $-a^0 = -(a^0) = -1$ para $a \neq 0$.

  - **Expresiones compuestas**: Para cualquier expresión no nula $E \neq 0$, $(E)^0 = 1$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de potencias con exponente cero](/static/img/nodos/potencia-con-exponente-cero-ejemplos.svg)


    Calcule el valor de $(-8)^0$, $-8^0$ y $\left(\frac{3}{7} + \sqrt{5}\right)^0$.'
  pasos:
  - 'Paso 1: Evaluar $(-8)^0$: La base es $-8$ (no nula) encerrada en paréntesis. Por teorema, $(-8)^0 = 1$.'
  - 'Paso 2: Evaluar $-8^0$: Sin paréntesis, el exponente $0$ solo afecta a $8$. Desarrollo: $-(8^0) = -(1) = -1$.'
  - 'Paso 3: Evaluar $\left(\frac{3}{7} + \sqrt{5}\right)^0$: La expresión entre paréntesis es un número real positivo no nulo. Al elevarse a $0$, su resultado es exactamente $1$.'
  - 'Conclusión: $(-8)^0 = 1$, $-8^0 = -1$ y $\left(\frac{3}{7} + \sqrt{5}\right)^0 = 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué $a^0 = 1$ para todo $a \neq 0$?
  choices:
  - text: Porque proviene de dividir una potencia por sí misma ($\frac{a^n}{a^n} = a^{n-n} = a^0 = 1$)
    is_correct: true
  - text: Porque todo producto por cero da uno
    is_correct: false
  - text: Porque el exponente cero suma uno
    is_correct: false
  - text: Es una convención sin justificación
    is_correct: false
  explanation: La alternativa correcta es 'Porque proviene de dividir una potencia por sí misma ($\frac{a^n}{a^n} = a^{n-n} = a^0 = 1$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es la diferencia entre $(-8)^0$ y $-8^0$?
  choices:
  - text: $(-8)^0 = 1$ porque el signo está dentro de la base, mientras que $-8^0 = -1$ porque el signo queda fuera
    is_correct: true
  - text: Ambos dan $-1$
    is_correct: false
  - text: Ambos dan $+1$
    is_correct: false
  - text: Ambos dan $0$
    is_correct: false
  explanation: La alternativa correcta es '$(-8)^0 = 1$ porque el signo está dentro de la base, mientras que $-8^0 = -1$ porque el signo queda fuera'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la base sea distinta de cero ($a \neq 0$).'
- 'Paso 2: Identificar si el signo negativo forma parte de la base (con paréntesis) o es un operador externo (sin paréntesis).'
- 'Paso 3: Aplicar $a^0 = 1$ y anteponer el signo exterior si correspondiera.'
errores_correccion: '- **Error 1: Creer que $a^0 = 0$.** **Cómo corregirlo:** La potencia cero NO es multiplicación por cero; proviene del cociente $\frac{a^n}{a^n} = 1$. Por lo tanto, $a^0 = 1$.

  - **Error 2: Afirmar que $-5^0 = 1$.** **Cómo corregirlo:** Sin paréntesis el signo no se eleva: $-5^0 = -(5^0) = -1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $(-100)^0$?
  alternativas:
  - $1$
  - $-1$
  - $0$
  respuesta: $1$
  solucion_pasos:
  - Base no nula con paréntesis elevada a cero $\implies 1$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $-12^0$?
  alternativas:
  - $-1$
  - $+1$
  - $0$
  respuesta: $-1$
  solucion_pasos:
  - $-(12^0) = -(1) = -1$.
- titulo: ¿Es (3/4)⁰ igual a 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, toda fracción no nula elevada a 0 es igual a 1.
  alternativas:
  - texto: Sí, cualquier base no nula elevada a 0 es 1
    es_correcta: true
    retroalimentacion: ¡Correcto! $\left(\frac{3}{4}\right)^0 = 1$.
  - texto: No, es igual a 0
    es_correcta: false
    retroalimentacion: Incorrecto, la potencia cero da 1.
  - texto: No, es igual a 3/4
    es_correcta: false
    retroalimentacion: Incorrecto, eso sería con exponente 1.
- titulo: ¿Es 0⁰ igual a 1?
  respuesta: 'No'
  solucion_pasos:
  - No, $0^0$ es una forma indeterminada y no está definida en los reales.
  alternativas:
  - texto: No, 0⁰ está indeterminado en los números reales
    es_correcta: true
    retroalimentacion: ¡Correcto! La base debe ser distinta de cero para que valga 1.
  - texto: Sí, porque todo número elevado a 0 es 1
    es_correcta: false
    retroalimentacion: Incorrecto, la regla exige $a \neq 0$.
  - texto: Sí, porque 0 elevado a cualquier cosa es 0
    es_correcta: false
    retroalimentacion: Incorrecto, ese conflicto de reglas crea la indeterminación.
errores_frecuentes:
- Asumir que $a^0 = 0$.
- Olvidar que $-a^0 = -1$ por falta de paréntesis.
- Intentar calcular $0^0 = 1$ sin notar la indeterminación.
- Confundir $5x^0 = 5(1) = 5$ con $(5x)^0 = 1$.
- Creer que números negativos no pueden elevarse al exponente cero.
afirmaciones_verdaderas:
- Para todo $a \in \mathbb{R} \setminus \{0\}$, $a^0 = 1$.
- La expresión $(-a)^0 = 1$, mientras que $-a^0 = -1$ para $a \neq 0$.
- La expresión $0^0$ no tiene un valor real definido y se considera indeterminada.
al_terminar_debes_poder: '![Síntesis de potencia con exponente cero](/static/img/nodos/potencia-con-exponente-cero-resumen.svg)


  QUÉ: Aplicar el teorema del exponente cero en números y expresiones algebraicas.


  CÓMO: Evaluando $a^0 = 1$ para cualquier base no nula $a \neq 0$, distinguiendo el signo exterior en expresiones sin paréntesis $-a^0 = -1$, y reconociendo a $0^0$ como una forma indeterminada.'
