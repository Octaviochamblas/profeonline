semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_PAR_DEFINICION
resumen_inicial: Una función es par si al evaluar en $-x$ se obtiene el mismo valor original, satisfaciendo $f(-x) = f(x)$.
explicacion_simple: |
  Una **función par** es aquella que "se come" o elimina los signos menos:

  - Si ingresas $4$ y obtienes $16$ ($f(4) = 16$).
  - Al ingresar $-4$, obtienes **exactamente el mismo valor $16$** ($f(-4) = 16$).
  - **Simetría visual**: Su gráfica es como un espejo reflejado respecto al **eje vertical $Y$** (el lado izquierdo es idéntico al derecho).
  - Ejemplo clásico: $f(x) = x^2$ o $f(x) = |x|$.
explicacion_formal: |
  Sea $f: D \subseteq \mathbb{R} \to \mathbb{R}$ una función con dominio simétrico ($x \in D \implies -x \in D$). $f$ es una **función par** si y solo si satisface la identidad algebraica:

  $$f(-x) = f(x) \quad \forall x \in D$$

  **Propiedad gráfica:**
  La gráfica $G_f$ es simétrica respecto a la recta vertical del eje de las ordenadas ($x = 0$), cumpliendo que $(a, b) \in G_f \iff (-a, b) \in G_f$.
definiciones_clave: |
  - **Función par**: Relación funcional que satisface la propiedad de simetría $f(-x) = f(x)$ para todo elemento del dominio.
propiedades_relaciones: |
  - **No inyectividad de funciones pares**: Toda función par cuyo dominio contenga elementos no nulos NO es inyectiva en su dominio global (puesto que $f(a) = f(-a)$ con $a \neq -a$).
ejemplo_guiado:
  enunciado: 'Demuestra algebraicamente si la función $f(x) = 3x^4 - 2x^2 + 7$ es par.'
  pasos:
    - 'Paso 1: Evaluar la función en $(-x)$: $f(-x) = 3(-x)^4 - 2(-x)^2 + 7$.'
    - 'Paso 2: Desarrollar potencias pares: como $(-x)^4 = x^4$ y $(-x)^2 = x^2$, se obtiene $3x^4 - 2x^2 + 7$.'
    - 'Paso 3: Comparar con la función original $f(x)$.'
    - 'Paso 4: Como $f(-x) = f(x)$, se concluye que la función es par.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la relación algebraica fundamental que define a una función par $f(x)$?'
    choices:
      - {text: '$f(-x) = f(x)$', is_correct: true}
      - {text: '$f(-x) = -f(x)$', is_correct: false}
      - {text: '$f(x) = 0$', is_correct: false}
      - {text: '$f(-x) = 1/f(x)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(-x) = f(x)$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Respecto a qué eje del plano cartesiano es simétrica la gráfica de una función par?'
    choices:
      - {text: 'Respecto al eje vertical de las ordenadas (eje Y).', is_correct: true}
      - {text: 'Respecto al origen de coordenadas $(0,0)$.', is_correct: false}
      - {text: 'Respecto al eje horizontal de las abscisas (eje X).', is_correct: false}
      - {text: 'Respecto a la recta $y = x$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Respecto al eje vertical de las ordenadas (eje Y).''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reemplazar la variable $x$ por $(-x)$ en la regla de asignación de la función.'
  - 'Paso 2: Simplificar las potencias y valores absolutos según sus reglas de signos.'
  - 'Paso 3: Comparar el resultado algebraico directamente con la fórmula inicial $f(x)$.'
  - 'Paso 4: Si las fórmulas resultan idénticas, declarar que la función es par.'
errores_correccion: |
  - **Error común:** Confundir la función par con funciones que solo evalúan números pares.
  - **Cómo corregirlo:** La paridad funcional describe la **SIMETRÍA REFLEXIVA $f(-x) = f(x)$**, no la divisibilidad de números enteros por 2.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones especiales.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones especiales.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una función par es aquella que solo acepta como dominio números pares positivos.'
  - 'La gráfica de una función par es simétrica respecto al origen de coordenadas $(0,0)$.'
  - 'Toda función par es inyectiva de forma global en todo el conjunto de los números reales.'
  - 'Una función afín con pendiente $m = 3$ y término independiente $b = 2$ es un ejemplo de función par.'
  - 'Evaluar una función par en un número negativo produce un resultado negativo de forma obligatoria.'
afirmaciones_verdaderas:
  - 'Una función $f$ es par si y solo si cumple la propiedad $f(-x) = f(x)$ para todo elemento $x$ de su dominio.'
  - 'La gráfica de una función par es simétrica respecto al eje vertical de las ordenadas (eje $Y$).'
al_terminar_debes_poder: |
  QUÉ: Definir y comprobar la paridad de funciones en representaciones algebraicas y gráficas.
  CÓMO: Verificar la igualdad $f(-x) = f(x)$ y comprobar la simetría especular respecto al eje $Y$.
