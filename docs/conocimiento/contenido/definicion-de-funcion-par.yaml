  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Sustituye $-x$ en cada aparición de la variable de la función.'
- 'Paso 2: Simplifica la expresión resultante.'
- 'Paso 3: Compara el resultado con la fórmula original de $f(x)$.'
- 'Paso 4: Si son idénticas, la función es par.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar definición de función par.
ejemplos:
- titulo: Verificación de función par
  enunciado: Determina si $f(x)=x^4-3$ es par.
  solucion_pasos:
  - $f(-x)=(-x)^4-3=x^4-3$.
  - Coincide exactamente con $f(x)$.
  - Es par.
- titulo: Función que no es par
  enunciado: Determina si $f(x)=x^2+x$ es par.
  solucion_pasos:
  - $f(-x)=(-x)^2+(-x)=x^2-x$.
  - No coincide con $f(x)=x^2+x$.
  - No es par.
- titulo: ¿Toda función constante es par?
  enunciado: ¿Toda función constante es par?
  respuesta: Sí
  solucion_pasos:
  - $f(-x)=c=f(x)$ para toda constante $c$, cumpliendo la definición.
- titulo: ¿La condición $f(-x)=f(x)$ debe cumplirse solo para algunos valores de $x$?
  enunciado: ¿La condición $f(-x)=f(x)$ debe cumplirse solo para algunos valores de
    $x$?
  respuesta: 'No'
  solucion_pasos:
  - Debe cumplirse para todo $x$ del dominio, no solo para algunos valores particulares.
errores_frecuentes:
- Verificar la condición de paridad con solo un valor numérico en vez de algebraicamente
  para todo $x$.
- Confundir función par con función que solo tiene exponentes pares en su fórmula
  (no siempre es equivalente si hay términos mixtos).
- Olvidar elevar correctamente potencias impares al sustituir $-x$, perdiendo el signo
  negativo.
- Confundir "función par" con "número par".
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando definición
  de función par.
