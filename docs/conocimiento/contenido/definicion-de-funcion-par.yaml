semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_PAR_DEFINICION
resumen_inicial: Una función es par si al evaluar un número negativo $-x$ devuelve
  exactamente el mismo valor que evaluar $x$, cumpliendo $f(-x) = f(x)$.
explicacion_simple: 'Una **función par** ignora el signo del número que entra:

  - Tanto $x = 3$ como $x = -3$ dan la misma salida: $f(-3) = f(3)$.

  - Ejemplo principal: $f(x) = x^2$, donde $(-3)^2 = 9$ y $3^2 = 9$.

  - Su gráfica es **simétrica respecto al eje vertical $Y$** (el eje $Y$ actúa como
  un espejo plano).'
explicacion_formal: 'Una función real $f: D \to \mathbb{R}$ con dominio simétrico
  ($x \in D \implies -x \in D$) es **par** si y solo si:


  $$f(-x) = f(x) \quad \forall x \in D$$


  **Desglose de la fórmula:**

  - Invariancia algebraica ante la inversión del signo del argumento de entrada.'
definiciones_clave: '- **Función par**: Función real que satisface la identidad de
  simetría $f(-x) = f(x)$.

  - **Dominio simétrico**: Condición del dominio donde para cada punto $x$, su opuesto
  $-x$ también pertenece al dominio.'
propiedades_relaciones: '- **Simetría axial con el eje $Y$**: El reflejo de la curva
  respecto al eje de las ordenadas coincide con la curva original.'
ejemplo_guiado:
  enunciado: Demuestra algebraicamente si la función $f(x) = x^4 - 3x^2 + 5$ es una
    función par.
  pasos:
  - 'Paso 1: Evaluar $f(-x)$ reemplazando $x$ por $(-x)$: $f(-x) = (-x)^4 - 3(-x)^2
    + 5$.Paso 2: Desarrollar las potencias pares: $(-x)^4 = x^4$ y $(-x)^2 = x^2$.Paso
    3: Reemplazar los resultados: $f(-x) = x^4 - 3x^2 + 5$.Paso 4: Comparar $f(-x)$
    con $f(x)$: se observa que $f(-x) = f(x)$.Paso 5: Concluir que la función $f(x)
    = x^4 - 3x^2 + 5$ es PAR.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar $f(-x)$ en la función $f(x) = x^4 - 3x^2 + 5$, ¿cuál es el
    resultado obtenido?
  choices:
  - text: $f(-x) = x^4 - 3x^2 + 5 = f(x)$, demostrando que es par.
    is_correct: true
  - text: $f(-x) = -x^4 + 3x^2 - 5 = -f(x)$, demostrando que es impar.
    is_correct: false
  - text: $f(-x) = 0$
    is_correct: false
  - text: No se puede evaluar por tener potencias pares e impares.
    is_correct: false
  explanation: La alternativa correcta es '$f(-x) = x^4 - 3x^2 + 5 = f(x)$, demostrando
    que es par.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Respecto a qué eje del plano cartesiano son simétricas las gráficas de
    las funciones pares?
  choices:
  - text: Respecto al eje vertical $Y$ (eje de ordenadas).
    is_correct: true
  - text: Respecto al eje horizontal $X$ (eje de abscisas).
    is_correct: false
  - text: Respecto al origen de coordenadas $(0,0)$.
    is_correct: false
  - text: Respecto a la recta $y = x$.
    is_correct: false
  explanation: La alternativa correcta es 'Respecto al eje vertical $Y$ (eje de ordenadas).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar $x$ por $(-x)$ usando paréntesis en la fórmula de la función.'
- 'Paso 2: Simplificar los signos aplicando las reglas de potencias.'
- 'Paso 3: Comparar la expresión resultante con la función original $f(x)$.'
- 'Paso 4: Si coinciden de forma idéntica, declarar que la función es par.'
errores_correccion: '- **Error común:** Creer que la función lineal $f(x) = 2x$ es
  par porque el $2$ es un número par.

  - **Cómo corregirlo:** La paridad de una FUNCIÓN se refiere a la identidad $f(-x)
  = f(x)$, no a los números pares de los coeficientes.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de simetrías y funciones especiales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de simetrías y funciones especiales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función par cumple la identidad de simetría f(-x) = f(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de función par con simetría en el eje Y.
- titulo: ¿La función parte entera [x] devuelve el mayor entero menor o igual a x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de la función piso o parte entera.
errores_frecuentes:
- Confundir las funciones pares (simetría eje Y) con las funciones impares (simetría
  respecto al origen).
- Asumir que toda función real debe ser obligatoriamente par o impar, ignorando el
  caso sin paridad.
- Creer que una función impar o par debe tener coeficientes pares o impares respectivamente.
- 'Calcular la parte entera de números negativos truncando decimales en lugar de redondear
  al entero menor (ej: $[-1{,}2] = -2$).'
- Unir los escalones horizontales de la función parte entera con líneas verticales
  en lugar de dejarlos discontinuos.
afirmaciones_verdaderas:
- Una función es par si $f(-x) = f(x)$ (simétrica respecto al eje $Y$) e impar si
  $f(-x) = -f(x)$ (simétrica respecto al origen $(0,0)$).
- La función parte entera $f(x) = [x]$ asigna a cada real el mayor entero menor o
  igual a $x$, generando una gráfica escalonada discontinua.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y clasificar
  simetrías de funciones pares e impares, así como graficar y aplicar la función parte
  entera en contextos de cobro por tramos y finanzas.
