semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_PAR_DEFINICION
resumen_inicial: 'Definición de función par: conceptos, representación y propiedades
  en Simetrías y funciones especiales.'
explicacion_simple: 'Hay funciones donde no importa si entras con un número o con
  su opuesto: siempre obtienes exactamente el mismo resultado. Esa característica
  define a las funciones pares.'
explicacion_formal: '### Definición formal


  Una función $f$ con dominio simétrico respecto al origen (si $x \in \text{Dom}(f)$,
  entonces $-x \in \text{Dom}(f)$) es par si $f(-x) = f(x)$ para todo $x \in \text{Dom}(f)$.


  ### Desarrollo didáctico


  Para verificar algebraicamente, se sustituye $-x$ en la fórmula de la función y
  se simplifica, comparando el resultado con la fórmula original.


  Si $f(x)=x^2$: $f(-x)=(-x)^2=x^2=f(x)$. Se confirma que es par. En cambio, para
  $g(x)=x^3$: $g(-x)=(-x)^3=-x^3 \neq g(x)$, por lo que no es par.'
definiciones_clave: '- **Definición de función par**: Elemento central en el estudio
  de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a definición de función par.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a definición de función
    par.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a definición de función par.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
