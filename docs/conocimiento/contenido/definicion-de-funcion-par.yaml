semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.FUNCION_PAR_DEFINICION
resumen_inicial: Una función es par si su dominio es simétrico respecto al origen y satisface $f(-x) = f(x)$ para todo $x$, lo que equivale geométricamente a una simetría respecto al eje vertical $Y$.
explicacion_simple: '![Una función es par si su dominio es simétrico respecto al origen y satisface $f(-x) = f(x)$ para todo $x$, lo que equivale geométricamente a una simetría respecto al eje vertical $Y$](/static/img/nodos/definicion-de-funcion-par-intro.svg)



  Una función es **par** cuando meter un número negativo o su positivo da **exactamente el mismo resultado**:

  $$f(-x) = f(x)$$


  Por ejemplo, para $f(x) = x^2$:

  - Si evalúas en $x = 3$, obtienes $3^2 = 9$.

  - Si evalúas en $x = -3$, obtienes $(-3)^2 = 9$.


  ¡Ambos dan $9$! En el gráfico, el eje vertical $Y$ actúa como un espejo perfecto.'
explicacion_formal: 'Sea $f: D \to \mathbb{R}$ una función con dominio simétrico ($x \in D \implies -x \in D$). Se define que $f$ es una **función par** si y solo si:

  $$f(-x) = f(x), \quad \forall x \in D$$


  **Propiedades analíticas:**

  - **Invarianza par**: Los polinomios con únicamente potencias de exponente par ($x^0, x^2, x^4, \dots$) son funciones pares.

  - **Suma y producto**: La suma de funciones pares es par; el producto de dos funciones pares es par.

  - **Derivada**: La derivada de una función par derivable es una función impar ($f''(-x) = -f''(x)$).'
definiciones_clave: '- **Función par**: Aplicación que satisface $f(-x) = f(x)$ para todo elemento del dominio.

  - **Dominio simétrico**: Conjunto $D \subseteq \mathbb{R}$ tal que $\forall x \in D \implies -x \in D$.'
propiedades_relaciones: '- **Simetría axial**: Su gráfica es invariante bajo reflexión respecto a la recta $x = 0$ (eje $Y$).

  - **Pares simétricos**: Si $(a, b) \in \text{Graf}(f)$, entonces $(-a, b) \in \text{Graf}(f)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una función es par si su dominio es simétrico respecto al origen y satisface $f(-x) = f(x)$ para todo $x$, lo que equivale geométricamente a una simetría respecto al eje vertical $Y$](/static/img/nodos/definicion-de-funcion-par-ejemplos.svg)



    Demuestra algebraicamente si la función $f(x) = 3x^4 - 2x^2 + 7$ es una función par en $\mathbb{R}$.'
  pasos:
  - 'Paso 1: Verificar el dominio: $\text{Dom}(f) = \mathbb{R}$, el cual es simétrico respecto al origen.'
  - 'Paso 2: Evaluar la función en $-x$: $f(-x) = 3(-x)^4 - 2(-x)^2 + 7$.'
  - 'Paso 3: Aplicar propiedades de potencias: $(-x)^4 = x^4$ y $(-x)^2 = x^2$.'
  - 'Paso 4: Simplificar la expresión: $f(-x) = 3x^4 - 2x^2 + 7$.'
  - 'Paso 5: Comparar con la función original: como $f(-x) = f(x)$, concluir que $f$ es una función par.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición algebraica que define a una función par?
  choices:
  - text: f(-x) = f(x) para todo x en el dominio.
    is_correct: true
  - text: f(-x) = -f(x) para todo x en el dominio.
    is_correct: false
  - text: f(x) = -f(x).
    is_correct: false
  - text: f(0) = 0.
    is_correct: false
  explanation: La alternativa correcta es 'f(-x) = f(x) para todo x en el dominio.'. Absorbe el signo negativo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $f$ es una función par y $f(5) = -18$, ¿cuánto vale $f(-5)$?
  choices:
  - text: '-18'
    is_correct: true
  - text: '18'
    is_correct: false
  - text: '0'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: La alternativa correcta es '-18'. Al ser par, $f(-5) = f(5) = -18$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que el dominio de la función sea simétrico respecto al origen.'
- 'Paso 2: Sustituir cada aparición de $x$ por $(-x)$ usando paréntesis obligatorios.'
- 'Paso 3: Desarrollar las potencias y simplificar signos.'
- 'Paso 4: Comprobar si la expresión simplificada coincide exactamente con la fórmula original $f(x)$.'
errores_correccion: '- **Error común:** Olvidar que el término constante (ej: $+7$) tiene exponente par ($7x^0$) y pensar que afecta la paridad.

  - **Cómo corregirlo:** Las constantes no cambian de signo al evaluar $f(-x)$, por lo que **preservan la paridad par**.'
ejemplos:
- titulo: 'Ejemplo 1: Polinomio par canónico'
  enunciado: ¿Es $f(x) = x^6 + 4$ una función par?
  alternativas:
  - Sí, porque f(-x) = (-x)^6 + 4 = x^6 + 4 = f(x)
  - No, porque tiene un 4 sumando
  - No, es impar
  - Solo para positivos
  respuesta: Sí, porque f(-x) = (-x)^6 + 4 = x^6 + 4 = f(x)
  solucion_pasos:
  - 'Paso 1: $(-x)^6 = x^6$, luego $f(-x) = f(x)$.'
- titulo: 'Ejemplo 2: Valor absoluto'
  enunciado: Para $g(x) = |2x|$, ¿es par?
  alternativas:
  - Sí, porque |-2x| = |2x|
  - No, las funciones modulares no tienen paridad
  - Es impar
  - Solo si x = 0
  respuesta: Sí, porque |-2x| = |2x|
  solucion_pasos:
  - 'Paso 1: $g(-x) = |2(-x)| = |-2x| = |2x| = g(x)$.'
- titulo: 'Ejemplo 3: Racional par'
  enunciado: ¿Es par $h(x) = \frac{1}{x^2 + 1}$?
  alternativas:
  - Sí, porque (-x)^2 + 1 = x^2 + 1
  - No, porque es una fracción
  - Es impar
  - No está definida en los reales
  respuesta: Sí, porque (-x)^2 + 1 = x^2 + 1
  solucion_pasos:
  - 'Paso 1: $h(-x) = \frac{1}{(-x)^2 + 1} = \frac{1}{x^2 + 1} = h(x)$.'
- titulo: 'Ejemplo 4: Falla de dominio simétrico'
  enunciado: Si $f(x) = x^2$ está definida solo en $[-2, 5]$, ¿es par?
  alternativas:
  - No, porque su dominio no es simétrico respecto al cero
  - Sí, porque la fórmula es x^2
  - Es impar
  - Solo en [-2, 2]
  respuesta: No, porque su dominio no es simétrico respecto al cero
  solucion_pasos:
  - 'Paso 1: Para $x = 5 \in D$, $-5 \notin D$, violando el dominio simétrico.'
errores_frecuentes:
- No verificar la simetría del dominio.
- Cometer errores de signo al no usar paréntesis en (-x)^n.
- Confundir la paridad de funciones con los números pares e impares.
afirmaciones_verdaderas:
- Una función es par si f(-x) = f(x) para todo elemento de su dominio simétrico.
- La gráfica de toda función par es simétrica respecto al eje de ordenadas Y.
al_terminar_debes_poder: '**QUÉ:** Definir, demostrar y evaluar la paridad par en funciones reales.


  **CÓMO:** Comprobando la simetría del dominio y verificando algebraicamente la identidad f(-x) = f(x).


  ![Resumen Una función es par si su dominio es simétrico respecto al origen y satisface $f(-x) = f(x)$ para todo $x$, lo que equivale geométricamente a una simetría respecto al eje vertical $Y$](/static/img/nodos/definicion-de-funcion-par-resumen.svg)'
