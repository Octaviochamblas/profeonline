semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.SECTOR_CIRCULAR_DEFINICION
resumen_inicial: El sector circular es la región del círculo delimitada por dos radios y el arco comprendido entre ellos, con forma de rebanada.
explicacion_simple: 'Un **sector circular** es la típica rebanada o porción de pizza que cortas desde el centro del círculo. Sus límites son muy fáciles de reconocer: está encerrado por **dos radios rectos** que salen del centro y por el **arco curvo** exterior.


  Tiene dos fórmulas fundamentales que debes dominar: 1) **Área del sector:** Es la fracción del círculo completo: **$A = \frac{\alpha}{360^\circ} \cdot \pi r^2$**. 2) **Perímetro del sector:** Tienes que sumar los dos radios más el arco: **$P = 2r + \text{arco}$**.


  No lo confundas con el ''segmento circular'': el sector llega hasta el centro (como una cuña), mientras que el segmento circular es solo la orilla cortada por una cuerda recta.


  ![Definición de sector circular](/static/img/nodos/definicion-de-sector-circular-como-region-delimitada-por-dos-radios-y-un-arco-intro.svg)

  '
explicacion_formal: '### Definición formal de sector circular

  Sea $\mathcal{K}(O, r)$ un círculo euclidiano y sean $\overline{OA}$ y $\overline{OB}$ dos radios que forman un ángulo central de apertura $\alpha$. Se define el **sector circular** $\mathcal{S}(O, r, \alpha)$ como la porción del plano encerrada entre dichos radios y el arco $\overset{\frown}{AB}$:

  $$\mathcal{S} = \{ P(r'', \theta'') \mid 0 \le r'' \le r, \ 0 \le \theta'' \le \alpha \}$$


  ### Área superficial del sector

  La medida de área del sector es proporcional a la apertura angular $\alpha$:

  $$A_{\text{sector}} = \left(\frac{\alpha}{360^\circ}\right) \cdot \pi r^2 = \frac{s \cdot r}{2}$$

  Nótese la analogía notable de la segunda expresión $\frac{s \cdot r}{2}$ con el área de un triángulo (base por altura dividido entre 2).


  ### Perímetro total del sector

  El contorno cerrado de un sector circular se compone de dos segmentos lineales radiales y un arco curvo:

  $$P_{\text{sector}} = r + r + s = 2r + \left(\frac{\alpha}{360^\circ}\right) 2\pi r = 2r + \frac{\alpha \pi r}{180^\circ}$$


  > **Complemento didáctico:** En preguntas de perímetros de sectores circulares, el 80% de los errores ocurre porque los estudiantes calculan solo la longitud del arco y se olvidan de sumarle los dos radios laterales. Grábate esto: ''el sector es una cuña cerrada: lleva el arco más 2 radios'' ($P = 2r + s$).

  '
definiciones_clave: '- **Sector circular**: Región 2D delimitada por dos radios y el arco comprendido entre ellos.

  - **Área del sector ($A_s$)**: Superficie encerrada dada por $A_s = \frac{\alpha}{360^\circ} \pi r^2$.

  - **Perímetro del sector ($P_s$)**: Contorno perimetral total dado por $P_s = 2r + s$.

  - **Segmento circular**: Región circular delimitada por una cuerda y un arco (sin radios al centro).

  '
propiedades_relaciones: '- **Casos canónicos:** Cuadrante circular ($\alpha = 90^\circ \implies A = \frac{\pi r^2}{4}$), semicírculo ($\alpha = 180^\circ \implies A = \frac{\pi r^2}{2}$).

  - **Fórmula análoga al triángulo:** $A = \frac{s \cdot r}{2}$, donde el arco $s$ actúa como base y el radio $r$ como altura.

  - **Sector mayor y menor:** Salvo en el semicírculo, dos radios definen un sector menor ($\alpha < 180^\circ$) y un sector mayor o reentrante ($\alpha > 180^\circ$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de sector circular](/static/img/nodos/definicion-de-sector-circular-como-region-delimitada-por-dos-radios-y-un-arco-ejemplos.svg)


    Un sector circular tiene un radio de $r = 6\text{ cm}$ y un ángulo del centro de $\alpha = 90^\circ$. Calcula su área superficial y su perímetro total cerrado.'
  pasos:
  - 'Paso 1: Calcular la fracción del círculo: $\frac{90^\circ}{360^\circ} = \frac{1}{4}$ (es un cuadrante).'
  - 'Paso 2: Calcular el área total del círculo: $A_{\text{total}} = \pi (6)^2 = 36\pi\text{ cm}^2$.'
  - 'Paso 3: Calcular el área del sector: $A = \frac{1}{4} \cdot 36\pi = 9\pi\text{ cm}^2$.'
  - 'Paso 4: Calcular la longitud del arco: $s = \frac{1}{4} \cdot (2\pi \cdot 6) = \frac{12\pi}{4} = 3\pi\text{ cm}$.'
  - 'Paso 5: Sumar los dos radios para el perímetro total: $P = 2r + s = 2(6) + 3\pi = 12 + 3\pi\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los elementos geométricos que delimitan a un sector circular?
  choices:
  - text: Dos radios que parten del centro y el arco comprendido entre ellos.
    is_correct: true
  - text: Una cuerda secante y el arco comprendido entre sus extremos.
    is_correct: false
  - text: Dos cuerdas paralelas y la distancia entre ellas.
    is_correct: false
  - text: El diámetro completo y una recta tangente exterior.
    is_correct: false
  explanation: La alternativa correcta es 'Dos radios que parten del centro y el arco comprendido entre ellos.' Por definición, el sector circular es una cuña delimitada por dos radios y un arco.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la expresión para el perímetro total de un sector circular de radio r y longitud de arco s?
  choices:
  - text: P = 2r + s.
    is_correct: true
  - text: P = r + s.
    is_correct: false
  - text: P = 2r · s.
    is_correct: false
  - text: P = (s · r) / 2.
    is_correct: false
  explanation: La alternativa correcta es 'P = 2r + s.' Se deben sumar los dos bordes radiales rectos ($r + r = 2r$) más el arco curvado ($s$).
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el radio $r$ y el ángulo central $\alpha$.

  2. Calcular la fracción angular: $\alpha / 360^\circ$.

  3. Para el área, multiplicar la fracción por $\pi r^2$: $A = (\alpha / 360^\circ) \pi r^2$.

  4. Para el perímetro, calcular el arco $s = (\alpha / 360^\circ) 2\pi r$ y sumarle $2r$: $P = 2r + s$.

  '
errores_correccion: '- **Error común 1:** Olvidar sumar los dos radios al calcular el perímetro del sector. **Corrección:** El perímetro encierra la figura completa, por lo que $P = 2r + s$.

  - **Error común 2:** Confundir sector circular con segmento circular. **Corrección:** El sector tiene forma de rebanada de pizza (llega al centro); el segmento está delimitado por una cuerda recta.

  '
ejemplos:
- tipo: A
  titulo: Área de sector de 60°
  enunciado: En un círculo de radio $12\text{ cm}$, ¿cuál es el área de un sector de $60^\circ$?
  alternativas:
  - text: $24\pi\text{ cm}^2$.
    is_correct: true
  - text: $144\pi\text{ cm}^2$.
    is_correct: false
  - text: $12\pi\text{ cm}^2$.
    is_correct: false
  - text: $36\pi\text{ cm}^2$.
    is_correct: false
  explicacion: $\frac{60^\circ}{360^\circ} \cdot \pi(12)^2 = \frac{1}{6} \cdot 144\pi = 24\pi\text{ cm}^2$.
- tipo: B
  titulo: Sector vs Segmento
  enunciado: ¿Es el segmento circular lo mismo que un sector circular?
  respuesta: 'No'
  explicacion: No. El sector circular está delimitado por dos radios y un arco, mientras que el segmento circular está delimitado por una cuerda y un arco.
errores_frecuentes:
- '''Olvidar sumar los dos radios al calcular el perímetro del sector circular.'''
- '''Confundir sector circular (cuña con radios) con segmento circular (delimitado por cuerda).'''
- '''Usar la fórmula de perímetro en lugar de la de área al calcular la superficie del sector.'''
afirmaciones_verdaderas:
- '''El sector circular es la región delimitada por dos radios y el arco comprendido entre ellos.'''
- '''El área de un sector circular es proporcional a su ángulo del centro ($A = \frac{\alpha}{360^\circ} \pi r^2$).'''
- '''El perímetro de un sector circular cerrado es igual a la suma de dos radios más el arco ($P = 2r + s$).'''
al_terminar_debes_poder: '**QUÉ:** Calcular áreas y perímetros de sectores circulares distinguiéndolos de otros elementos circulares.


  **CÓMO:** Empleando $A = \frac{\alpha}{360^\circ} \pi r^2$ y $P = 2r + \frac{\alpha \pi r}{180^\circ}$.


  ![Síntesis de sector circular](/static/img/nodos/definicion-de-sector-circular-como-region-delimitada-por-dos-radios-y-un-arco-resumen.svg)

  '
