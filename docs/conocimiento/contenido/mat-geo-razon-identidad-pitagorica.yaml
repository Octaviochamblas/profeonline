semantic_id: MAT.GEO.TRIG_IDENTIDADES.PITAGORICA_FUNDAMENTAL
resumen_inicial: 'Identidad pitagórica fundamental: seno cuadrado más coseno cuadrado
  igual a uno: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  en el Triángulo Rectángulo.'
explicacion_simple: Esta identidad es una consecuencia directa del teorema de Pitágoras
  aplicado a un triángulo rectángulo con hipotenusa igual a 1.
explicacion_formal: '![Identidad pitagórica fundamental](/static/img/geometria/trigonometria/razon-identidad-pitagorica.svg)


  ### Definición formal


  En un triángulo rectángulo con hipotenusa igual a 1, el cateto opuesto a $\theta$
  mide $\sin\theta$ y el cateto adyacente mide $\cos\theta$. Por el teorema de Pitágoras:
  $(\sin\theta)^2+(\cos\theta)^2=1^2$, es decir, $\sin^2\theta+\cos^2\theta=1$.


  ### Desarrollo didáctico


  Esta identidad permite calcular el coseno a partir del seno (o viceversa): si $\sin\theta=0{,}6$,
  entonces $\cos^2\theta=1-0{,}36=0{,}64$, por lo que $\cos\theta=0{,}8$ (para un
  ángulo agudo, donde el coseno es positivo).'
definiciones_clave: '- **Identidad pitagórica fundamental: seno cuadrado más coseno
  cuadrado igual a uno**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
