semantic_id: MAT.NUM.DIVISIBILIDAD.OBTENCION_MULTIPLOS
resumen_inicial: 'Los múltiplos de $n$ se obtienen multiplicando $n$ secuencialmente
  por la serie de enteros: $0, n, 2n, 3n, \dots$.'
explicacion_simple: Para generar la lista de múltiplos de un número cualquiera, tomamos
  ese número y lo vamos multiplicando en orden por los enteros $0, 1, 2, 3, 4, 5$,
  y así sucesivamente. De esta forma construimos la tabla de multiplicar infinita
  del número de forma ordenada.
explicacion_formal: 'Para un entero dado $n \in \mathbb{Z}$, la **Generación Secuencial
  de Múltiplos** se obtiene evaluando el producto por la sucesión de enteros no negativos
  $\mathbb{N}_0$:


  $$M^+(n) = \{ n \cdot k \mid k \in \mathbb{N}_0 \} = \{ 0, n, 2n, 3n, 4n, \ldots
  \}$$


  **Desglose de la fórmula:**

  - $n \cdot 0 = 0$: Primer múltiplo (el elemento nulo).

  - $n \cdot 1 = n$: Segundo múltiplo (el propio número base).

  - $n \cdot k$: Término general para el $k$-ésimo múltiplo de la sucesión.


  > **Complemento didáctico:** La diferencia entre dos múltiplos consecutivos de $n$
  es siempre constante e igual a $n$ unidades ($(k+1)n - kn = n$).'
definiciones_clave: '- **Sucesión de múltiplos**: Serie ordenada construida al multiplicar
  la base por la sucesión de enteros.'
propiedades_relaciones: '- **Patrón aditivo**: Cada múltiplo se obtiene sumando la
  base $n$ al múltiplo anterior ($m_{k+1} = m_k + n$).'
ejemplo_guiado:
  enunciado: Obtenga los primeros 5 múltiplos no negativos del número $8$.
  pasos:
  - 'Paso 1: Multiplicar 8 por $k = 0$: $8 \cdot 0 = 0$.'
  - 'Paso 2: Multiplicar 8 por $k = 1$: $8 \cdot 1 = 8$.'
  - 'Paso 3: Multiplicar 8 por $k = 2, 3, 4$: $8 \cdot 2 = 16$, $8 \cdot 3 = 24$,
    $8 \cdot 4 = 32$.'
  - 'Conclusión: La lista de los primeros 5 múltiplos no negativos de 8 es $\{0, 8,
    16, 24, 32\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula el quinto múltiplo positivo del número 6?
  choices:
  - text: Multiplicando 6 · 5 = 30
    is_correct: true
  - text: Sumando 6 + 5 = 11
    is_correct: false
  - text: Dividiendo 6 / 5
    is_correct: false
  - text: Elevando 6 a la quinta potencia
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando 6 · 5 = 30'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el patrón constante de diferencia entre
    múltiplos consecutivos de 8?
  choices:
  - text: 8 unidades
    is_correct: true
  - text: 1 unidad
    is_correct: false
  - text: 16 unidades
    is_correct: false
  - text: 0 unidades
    is_correct: false
  explanation: La alternativa correcta es '8 unidades'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar el número base $n$.'
- 'Paso 2: Multiplicar $n$ progresivamente por los enteros $0, 1, 2, 3, 4, \ldots$.'
- 'Paso 3: Ordenar los productos resultantes para formar la lista de múltiplos.'
errores_correccion: '- **Error 1: Omitir el número $n$ al listar sus múltiplos.**
  **Cómo corregirlo:** $n \cdot 1 = n$, por lo que todo número es el segundo múltiplo
  no negativo de sí mismo.


  - **Error 2: Sumar números arbitrarios en lugar de multiplicar por la constante
  $n$.** **Cómo corregirlo:** La secuencia avanza sumando siempre la misma base $n$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuáles son los tres primeros múltiplos positivos de 12?
  alternativas:
  - '{12, 24, 36}'
  - '{1, 2, 3}'
  - '{12, 13, 14}'
  respuesta: '{12, 24, 36}'
  solucion_pasos:
  - $12 \cdot 1 = 12$, $12 \cdot 2 = 24$, $12 \cdot 3 = 36$.
- titulo: Ejemplo 2
  enunciado: Halle el múltiplo de 7 que se encuentra entre 40 y 50.
  alternativas:
  - '42'
  - '45'
  - '48'
  respuesta: '42'
  solucion_pasos:
  - $7 \cdot 6 = 42$, que pertenece al rango $[40, 50]$.
- titulo: ¿Se pueden obtener infinitos múltiplos para cualquier entero positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, la serie de enteros es infinita.
- titulo: ¿Es el número 25 un múltiplo de 10?
  respuesta: 'No'
  solucion_pasos:
  - 'No, $25 : 10 = 2.5$, que no es entero.'
errores_frecuentes:
- Para obtener los múltiplos de un número se debe sumar la cifra 1 en cada paso.
- Los múltiplos de un número terminan cuando se llega a multiplicar por 10.
- El primer múltiplo no negativo de todo entero es siempre el número 1.
- La diferencia entre dos múltiplos consecutivos de $n$ cambia según el tamaño del
  número.
- Multiplicar por cero produce un múltiplo que no pertenece al conjunto de múltiplos.
afirmaciones_verdaderas:
- Los múltiplos de $n$ se obtienen al multiplicar $n$ por la sucesión de enteros.
- La distancia entre dos múltiplos consecutivos del número $n$ es siempre $n$.
al_terminar_debes_poder: Al terminar serás capaz de calcular y generar la lista de
  múltiplos de cualquier entero, multiplicándolo ordenadamente por los números naturales
  o enteros.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
