semantic_id: MAT.GEO.MEDICION_ANGULAR.SISTEMA_SEXAGESIMAL
resumen_inicial: El sistema sexagesimal es el sistema de medición angular estándar
  que divide una circunferencia completa en 360 partes iguales llamadas grados sexagesimales
  (°).
explicacion_simple: '![Sistema Sexagesimal](/static/img/nodos/sistema-sexagesimal-de-medicion-angular-en-grados-intro.svg)


  El transportador que usas en el colegio funciona con el sistema sexagesimal. Una
  vuelta entera alrededor de un punto mide 360 grados ($360^\circ$). Media vuelta
  mide $180^\circ$ y una esquina perfecta (ángulo recto) mide $90^\circ$.'
explicacion_formal: '### Definición formal

  El **sistema sexagesimal** divide a la circunferencia completa en 360 partes iguales
  denominadas **grados sexagesimales** ($^\circ$). La medida de un grado es la fracción
  $\frac{1}{360}$ de una revolución:


  $$1^\circ = \frac{1}{360} \text{ de una vuelta completa} \iff 360^\circ = 1 \text{
  revolución}$$


  ### Desglose simbólico y geométrico

  - $^\circ$: Símbolo de grado sexagesimal.

  - Ángulo recto: $90^\circ = \frac{360^\circ}{4}$.

  - Ángulo extendido: $180^\circ = \frac{360^\circ}{2}$.


  ### Síntesis didáctica

  El sistema sexagesimal es el estándar más común en la educación y la vida cotidiana
  gracias a la alta divisibilidad del número 360 entre múltiplos enteros.'
definiciones_clave: '- **Grado sexagesimal ($1^\circ$)**: Unidad fundamental de medida
  angular sexagesimal.

  - **Ángulo completo ($360^\circ$)**: Medida angular de una rotación de una vuelta
  completa. '
propiedades_relaciones: '- **Cuadrantes sexagesimales**: El plano se divide en 4 cuadrantes
  de $90^\circ$ cada uno ($I: 0^\circ - 90^\circ$, $II: 90^\circ - 180^\circ$, $III:
  180^\circ - 270^\circ$, $IV: 270^\circ - 360^\circ$).

  - **Fracciones de giro**: Cualquier fracción de vuelta $f$ se calcula como $\theta
  = f \times 360^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Fracciones Sexagesimales](/static/img/nodos/sistema-sexagesimal-de-medicion-angular-en-grados-ejemplos.svg)


    Una rueda realiza un giro de $\frac{3}{4}$ de vuelta completa. ¿Cuál es la medida
    del ángulo de rotación en grados sexagesimales?'
  pasos:
  - 'Paso 1: Recordar que una vuelta completa equivale a $360^\circ$.'
  - 'Paso 2: Plantear el producto de la fracción por el total: $\theta = \frac{3}{4}
    \times 360^\circ$.'
  - 'Paso 3: Simplificar: $\frac{360^\circ}{4} = 90^\circ$.'
  - 'Paso 4: Multiplicar: $3 \times 90^\circ = 270^\circ$.'
  - 'Paso 5: Concluir que el ángulo recorrido es de $270^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En cuántas partes iguales divide a una circunferencia completa el sistema
    sexagesimal?
  choices:
  - text: En 360 partes iguales (grados sexagesimales)
    is_correct: true
  - text: En 100 partes iguales
    is_correct: false
  - text: En 400 partes iguales
    is_correct: false
  - text: En 180 partes iguales
    is_correct: false
  explanation: El sistema sexagesimal divide la circunferencia en 360 partes iguales
    (grados sexagesimales).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos grados sexagesimales equivale un tercio de vuelta completa
    (1/3 de vuelta)?
  choices:
  - text: 120° (porque 360° / 3 = 120°)
    is_correct: true
  - text: 60°
    is_correct: false
  - text: 90°
    is_correct: false
  - text: 180°
    is_correct: false
  explanation: Dividiendo 360° entre 3 se obtiene 120° (porque 360° / 3 = 120°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la fracción de rotación o giro solicitada.'
- 'Paso 2: Multiplicar la fracción por la constante de vuelta completa $360^\circ$.'
- 'Paso 3: Simplificar y expresar el resultado con el símbolo de grados ($^\circ$).'
errores_correccion: No confundas el sistema sexagesimal (base 360) con sistemas decimales
  o centesimales (base 400 o 100).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántos grados sexagesimales mide un cuarto de vuelta completa?
  alternativas:
  - $90^\circ$
  - $45^\circ$
  - $180^\circ$
  respuesta: $90^\circ$
  solucion_pasos:
  - $\frac{360^\circ}{4} = 90^\circ$.
- titulo: Ejemplo 2
  enunciado: ¿Cuántas vueltas completas representan $720^\circ$?
  alternativas:
  - 2 vueltas
  - 3 vueltas
  - 1 vuelta y media
  respuesta: 2 vueltas
  solucion_pasos:
  - $\frac{720^\circ}{360^\circ} = 2$ vueltas completas.
- titulo: ¿Una vuelta completa equivale a 360° en el sistema sexagesimal?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición fundamental del sistema sexagesimal.
- titulo: ¿Un ángulo recto en el sistema sexagesimal mide 100°?
  respuesta: 'No'
  solucion_pasos:
  - No, mide exactamente 90° (un cuarto de 360°).
errores_frecuentes:
- Confundir la base 360 con la base centesimal 400.
- Omitir el símbolo de grado ($^\circ$).
- Creer que $180^\circ$ es una vuelta completa (es solo media vuelta).
- Confundir grados sexagesimales con gradianes.
- Equivocarse en la división fraccionaria de $360^\circ$.
afirmaciones_verdaderas:
- Una circunferencia completa tiene $360^\circ$ sexagesimales.
- El ángulo recto mide $90^\circ$ y el llano $180^\circ$.
al_terminar_debes_poder: '**QUÉ:** Comprender y utilizar el grado sexagesimal como
  unidad de medida angular.


  **CÓMO:** Calculando ángulos a partir de fracciones de giros completos de $360^\circ$.


  ![Resumen del Sistema Sexagesimal](/static/img/nodos/sistema-sexagesimal-de-medicion-angular-en-grados-resumen.svg)'
