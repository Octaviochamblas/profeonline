semantic_id: MAT.GEO.MEDICION_ANGULAR.SISTEMA_SEXAGESIMAL
resumen_inicial: El sistema sexagesimal subdivide el grado en 60 minutos y cada minuto
  en 60 segundos, aportando alta precisión en astronomía, geodesia y navegación.
explicacion_simple: Al igual que una hora se divide en 60 minutos y cada minuto en
  60 segundos, un grado de ángulo se divide en 60 minutos de arco (') y cada minuto
  en 60 segundos de arco ('') para medir aberturas pequeñísimas.
explicacion_formal: El **sistema sexagesimal** divide la circunferencia en $360^\circ$.
  Cada grado se subdivide en $60$ minutos de arco ($1^\circ = 60'$) y cada minuto
  en $60$ segundos de arco ($1' = 60''$), permitiendo alta precisión en coordenadas
  astronómicas y geográficas.
definiciones_clave: '- **Sistema sexagesimal de medición angular en grados**: Elemento
  o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en sistema sexagesimal de medición angular en grados se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Un instrumento topográfico mide un ángulo azimutal de $42^\circ 45'$.
    Expresa dicha medida únicamente en minutos de arco enteros.
  pasos:
  - 'Paso 1: Convertir la parte en grados a minutos sabiendo que $1^\circ = 60''$:
    $42 \cdot 60 = 2520''$.'
  - 'Paso 2: Sumar los 45 minutos de arco restantes: $2520'' + 45''$.'
  - 'Paso 3: Concluir que la medida total es de $2565''$ de arco.'
checkpoints:
