  question: ¿Cuál es el principio geométrico central de sistema sexagesimal de medición
    angular en grados?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos minutos de arco equivalen 42° 45'?
  choices:
  - text: 2565'
    is_correct: true
  - text: 2520'
    is_correct: false
  - text: 2400'
    is_correct: false
  - text: 4245'
    is_correct: false
  explanation: La alternativa correcta es '2565'', calculada como $42 \cdot 60 + 45
    = 2565'$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en sistema sexagesimal de medición angular
  en grados.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en sistema sexagesimal
  de medición angular en grados sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 20^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 160°
  - 20°
  - 90°
  respuesta: 160°
  solucion_pasos:
  - Despejando $x = 180 - 20 = 160^\circ$.
- titulo: Ejemplo 2
  enunciado: En sistema sexagesimal de medición angular en grados, si dos ángulos
    son suplementarios y uno mide 20°, ¿cuánto mide el otro?
  alternativas:
  - 160°
  - 70°
  - 360°
  respuesta: 160°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 20 = 160^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en sistema sexagesimal
    de medición angular en grados?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en sistema sexagesimal de medición
    angular en grados es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de sistema sexagesimal de medición angular en
  grados.
