semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.LEY_TRICOTOMIA
resumen_inicial: 'Aplicación de la ley de tricotomía en los números reales: relaciones
  de orden, intervalos y resolución en Relación de orden y símbolos de desigualdad.'
explicacion_simple: La comparación fundamental en álgebra requiere que sepamos si
  una cantidad es mayor, menor o igual a otra.
explicacion_formal: '### Definición formal

  Para cualquier par de números reales $a$ y $b$, se cumple exactamente una de las
  siguientes relaciones: $a < b$, $a = b$, o $a > b$.


  ### Desarrollo didáctico

  Esta propiedad es fundamental para la resolución de desigualdades, ya que descarta
  cualquier ambigüedad al comparar dos valores reales.'
definiciones_clave: '- **Aplicación de la ley de tricotomía en los números reales**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a aplicación de la ley de tricotomía en
  los números reales.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de aplicación de
    la ley de tricotomía en los números reales.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de aplicación de la ley de tricotomía en los
    números reales, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
