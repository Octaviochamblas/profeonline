procedimiento:
- Identificar los dos números reales a comparar.
- Evaluar la diferencia entre ambos valores.
- Concluir cuál de las tres relaciones de tricotomía se cumple.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en aplicación de la ley de
  tricotomía en los números reales.
