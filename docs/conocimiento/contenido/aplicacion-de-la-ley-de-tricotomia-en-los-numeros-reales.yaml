semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.LEY_TRICOTOMIA
resumen_inicial: 'La ley de tricotomía establece que para cualquier par de números
  reales $a$ y $b$, se cumple exactamente una de tres relaciones posibles: $a < b$,
  $a = b$ o $a > b$.'
explicacion_simple: 'Si tomas dos números reales cualesquiera $a$ y $b$, la **ley
  de tricotomía** garantiza que solo una de las siguientes tres situaciones puede
  ser cierta:

  1. El primer número es estrictamente menor que el segundo ($a < b$).

  2. Ambos números son idénticos ($a = b$).

  3. El primer número es estrictamente mayor que el segundo ($a > b$).

  Es imposible que ocurran dos de estas opciones al mismo tiempo.'
explicacion_formal: 'Para todo par de números reales $a, b \in \mathbb{R}$, la **ley
  de tricotomía** es el axioma de orden total formal formulado como:


  $$(a < b) \quad \veebar \quad (a = b) \quad \veebar \quad (a > b)$$


  **Desglose de la fórmula:**

  - El símbolo $\veebar$ representa la disyunción exclusiva: una y solo una de las
  tres proposiciones es verdadera en $\mathbb{R}$.'
definiciones_clave: '- **Ley de tricotomía**: Axioma fundamental que clasifica la
  comparación de dos números reales en tres casos mutuamente excluyentes.

  - **Disyunción exclusiva**: Conector lógico donde la verdad de una opción excluye
  categóricamente a las demás.'
propiedades_relaciones: '- **Exclusión mutua**: Si $a < b$ es verdadero, entonces
  $a = b$ es falso y $a > b$ es falso.'
ejemplo_guiado:
  enunciado: Aplica la ley de tricotomía para comparar los números reales $a = \frac{7}{4}$
    y $b = 1{,}75$.
  pasos:
  - 'Paso 1: Convertir la fracción a decimal: $\frac{7}{4} = 1{,}75$.Paso 2: Evaluar
    el caso 1 ($a < b$): $1{,}75 < 1{,}75$ (FALSO).Paso 3: Evaluar el caso 2 ($a =
    b$): $1{,}75 = 1{,}75$ (VERDADERO).Paso 4: Evaluar el caso 3 ($a > b$): $1{,}75
    > 1{,}75$ (FALSO).Paso 5: Concluir por tricotomía que la única relación válida
    es $a = b$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la ley de tricotomía para dos números reales $a$ y $b$?
  choices:
  - text: 'Se cumple una y solo una de las tres relaciones: $a < b$, $a = b$ o $a
      > b$.'
    is_correct: true
  - text: Se pueden cumplir dos relaciones al mismo tiempo.
    is_correct: false
  - text: Siempre $a > b$ para cualquier número real.
    is_correct: false
  - text: Que la suma $a + b$ debe ser igual a tres.
    is_correct: false
  explanation: 'La alternativa correcta es ''Se cumple una y solo una de las tres
    relaciones: $a < b$, $a = b$ o $a > b$.''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al aplicar la tricotomía a $a = \frac{7}{4}$ y $b = 1{,}75$, ¿cuál de
    las tres relaciones es la única verdadera?
  choices:
  - text: $a = b$
    is_correct: true
  - text: $a < b$
    is_correct: false
  - text: $a > b$
    is_correct: false
  - text: $a + b < 0$
    is_correct: false
  explanation: La alternativa correcta es '$a = b$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar ambos números reales en la misma representación (ambos en fracción
  o ambos en decimal).'
- 'Paso 2: Calcular la resta $a - b$.'
- 'Paso 3: Si $a - b < 0$, se cumple $a < b$. Si $a - b = 0$, se cumple $a = b$. Si
  $a - b > 0$, se cumple $a > b$.'
- 'Paso 4: Declarar la única opción verdadera descartando las otras dos.'
errores_correccion: '- **Error común:** Afirmar que es posible que $a < b$ y $a =
  b$ sean simultáneamente ciertos.

  - **Cómo corregirlo:** La tricotomía es EXCLUSIVA. Si los números son iguales, NO
  es cierto que uno sea estrictamente menor que el otro.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de orden.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de orden.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El conjunto de los números reales es un conjunto ordenado?
  respuesta: Sí
  solucion_pasos:
  - Sí, permite comparar cualquier par de números reales.
- titulo: ¿La frase 'a lo sumo' se traduce con el símbolo menor o igual que?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'a lo sumo' establece una cota superior inclusiva ($\\le$).
errores_frecuentes:
- Creer que el número con mayor valor absoluto negativo es el número mayor.
- Confundir la orientación de los símbolos mayor que ($>$) y menor que ($<$).
- Pensar que las desigualdades no estrictas ($\ge, \le$) prohíben la igualdad exacta.
- Traducir frases de cota como 'al menos' excluyendo el número límite.
- Tratar una desigualdad numérica cerrada como si tuviera una variable por despejar.
afirmaciones_verdaderas:
- 'La ley de tricotomía garantiza que para dos números reales $a$ y $b$ se cumple
  una y solo una de las tres opciones: $a < b$, $a = b$ o $a > b$.'
- La expresión 'como máximo $k$' se traduce mediante la desigualdad no estricta $x
  \le k$.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar la relación de orden
  en $\mathbb{R}$, emplear los símbolos de desigualdad e interpretar restricciones
  verbales.
fuente: Texto escolar MINEDUC — Álgebra / Desigualdades e Inecuaciones
