semantic_id: MAT.GEO.CIRCULO_TEOREMAS.POTENCIA_PUNTO_CALCULO
resumen_inicial: El Teorema de la Potencia Unificada vincula todas las relaciones métricas del círculo, demostrando que d² - r², PT² (tangente), PA · PB (secante) y PC · PD (cuerdas) son exactamente el mismo valor constante.
explicacion_simple: '¿Te has preguntado por qué el Teorema de las Cuerdas, el de las Secantes y el de la Tangente se parecen tanto? ¡Porque **todos son la misma cosa vista desde distintos ángulos**!


  El concepto que une a todos los teoremas métricos del círculo es la **potencia de un punto**:

  - Si el punto $P$ está afuera, **$d^2 - r^2$** es igual al **cuadrado de la tangente ($PT^2$)** y al **producto de cualquier secante ($PA \cdot PB$)**:

  $$\mathcal{P}(P) = PT^2 = PA \cdot PB = d^2 - r^2$$

  - Si el punto $P$ está adentro, el producto de los trozos de cualquier cuerda es igual a **$r^2 - d^2$**:

  $$|\mathcal{P}(P)| = PA \cdot PB = r^2 - d^2$$


  Esto te da un superpoder matemático en la PAES: si te dan los trozos de una secante, ¡puedes averiguar la distancia al centro $d$ o el radio $r$ al instante!


  ![Cálculo unificado de potencia](/static/img/nodos/calculo-de-potencia-de-un-punto-usando-cuerdas-secantes-o-tangentes-intro.svg)

  '
explicacion_formal: '### Teorema general de la potencia de un punto

  Sea $\mathcal{C}(O, r)$ una circunferencia y sea $P$ un punto del plano a distancia $d = d(P, O)$. Para cualquier recta secante que pase por $P$ e interseque a $\mathcal{C}$ en los puntos orientados $A$ y $B$, el producto escalar con signo de los vectores satisface:

  $$\vec{PA} \cdot \vec{PB} = d^2 - r^2 = \mathcal{P}(P)$$


  ### Equivalencias métricas fundamentales

  1. **Desde punto exterior ($d > r$):**

  $$\mathcal{P}(P) = PT^2 = PA \cdot PB = PC \cdot PD = d^2 - r^2$$

  Esto permite despejar directamente la distancia al centro $d = \sqrt{PT^2 + r^2} = \sqrt{PA \cdot PB + r^2}$.


  2. **Desde punto interior ($d < r$):**

  Como los vectores $\vec{PA}$ y $\vec{PB}$ tienen sentidos opuestos, su producto escalar es negativo:

  $$\vec{PA} \cdot \vec{PB} = - (PA \cdot PB) = d^2 - r^2 \iff PA \cdot PB = r^2 - d^2 = |\mathcal{P}(P)|$$

  El producto de los segmentos de cualquier cuerda que pase por $P$ es constante e igual a la diferencia $r^2 - d^2$.


  > **Complemento didáctico:** ¡El puente de oro de la geometría! Si un ejercicio te da los segmentos de una secante ($PA$ y $PB$) y te pide la distancia al centro $d$, no te asustes: simplemente iguala $PA \cdot PB = d^2 - r^2$ y despeja $d$ con una raíz cuadrada. ¡Así de directo y elegante!

  '
definiciones_clave: '- **Potencia unificada**: Principio invariante que engloba a los teoremas de cuerdas, secantes y tangentes.

  - **Media geométrica tangencial**: Relación $PT = \sqrt{d^2 - r^2}$.

  - **Producto de cuerda interior**: Igualdad $PA \cdot PB = r^2 - d^2$.

  '
propiedades_relaciones: '- **Despeje de distancia $d$**: $d = \sqrt{PA \cdot PB + r^2}$ (para $P$ exterior).

  - **Despeje de radio $r$**: $r = \sqrt{d^2 - PA \cdot PB}$ (para $P$ exterior).

  - **Independencia de la inclinación**: Cualquier secante que pase por $P$ arroja exactamente el mismo valor constante de producto.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de cálculo de potencia unificada](/static/img/nodos/calculo-de-potencia-de-un-punto-usando-cuerdas-secantes-o-tangentes-ejemplos.svg)


    Desde un punto exterior $P$ se traza una secante a una circunferencia de radio $r = 6\text{ cm}$. El segmento exterior es $PA = 9\text{ cm}$ y la cuerda interior es $AB = 7\text{ cm}$. Calcula el segmento total $PB$, la potencia del punto $\mathcal{P}(P)$, la longitud del segmento tangente $PT$ y la distancia $d$ desde el punto $P$ hasta el centro $O$.'
  pasos:
  - 'Paso 1: Calcular el segmento total de la secante: $PB = PA + AB = 9 + 7 = 16\text{ cm}$.'
  - 'Paso 2: Calcular el producto de la secante: $\mathcal{P}(P) = PA \cdot PB = 9 \cdot 16 = 144$.'
  - 'Paso 3: Calcular el segmento tangente aplicando $PT^2 = \mathcal{P}(P)$: $PT = \sqrt{144} = 12\text{ cm}$.'
  - 'Paso 4: Calcular la distancia al centro mediante la potencia: $d^2 - r^2 = 144 \implies d^2 - 6^2 = 144 \implies d^2 - 36 = 144$.'
  - 'Paso 5: Despejar $d$: $d^2 = 180 \implies d = \sqrt{180} = 6\sqrt{5} \approx 13,42\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si desde un punto exterior P se traza una tangente que mide PT = 8 cm a un círculo de radio r = 6 cm, ¿cuál es la distancia d desde P al centro?
  choices:
  - text: 10 cm.
    is_correct: true
  - text: 14 cm.
    is_correct: false
  - text: 2 cm.
    is_correct: false
  - text: 48 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''10 cm.'' Por la potencia: $d^2 - r^2 = PT^2 \implies d^2 - 36 = 64 \implies d^2 = 100 \implies d = 10\text{ cm}$ (el clásico trío pitagórico 6-8-10).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un punto interior P a distancia d = 4 cm del centro de una circunferencia de radio r = 5 cm, ¿cuánto vale el producto PA · PB de cualquier cuerda que pase por P?
  choices:
  - text: 9 cm².
    is_correct: true
  - text: 1 cm².
    is_correct: false
  - text: 41 cm².
    is_correct: false
  - text: 20 cm².
    is_correct: false
  explanation: 'La alternativa correcta es ''9 cm².'' Para un punto interior: $PA \cdot PB = r^2 - d^2 = 5^2 - 4^2 = 25 - 16 = 9$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Determinar si el punto $P$ es exterior o interior.

  2. Si es exterior, igualar las expresiones: $\mathcal{P}(P) = PT^2 = PA \cdot PB = d^2 - r^2$.

  3. Si es interior, igualar el producto de cuerdas al valor absoluto: $PA \cdot PB = r^2 - d^2$.

  4. Sustituir los datos conocidos y despejar la magnitud solicitada (distancia al centro $d$, radio $r$, tangente $PT$ o segmentos de secante).

  '
errores_correccion: '- **Error común 1:** Confundir la fórmula de punto interior con la de exterior. **Corrección:** Afuera es $d^2 - r^2$; adentro es $r^2 - d^2$.

  - **Error común 2:** No relacionar el teorema de secantes con el Teorema de Pitágoras del triángulo rectángulo radio-tangente. **Corrección:** Ambos son manifestaciones idénticas de la potencia.

  '
ejemplos:
- tipo: A
  titulo: Cálculo de tangente usando distancia y radio
  enunciado: Un punto $P$ exterior dista $d = 13\text{ cm}$ del centro de una circunferencia de radio $r = 5\text{ cm}$. ¿Cuánto mide el segmento tangente $PT$?
  alternativas:
  - text: $12\text{ cm}$.
    is_correct: true
  - text: $8\text{ cm}$.
    is_correct: false
  - text: $144\text{ cm}$.
    is_correct: false
  - text: $18\text{ cm}$.
    is_correct: false
  explicacion: $PT = \sqrt{d^2 - r^2} = \sqrt{13^2 - 5^2} = \sqrt{169 - 25} = \sqrt{144} = 12\text{ cm}$.
- tipo: B
  titulo: Equivalencia universal
  enunciado: ¿Es el producto del segmento exterior por el total de una secante igual a la diferencia $d^2 - r^2$?
  respuesta: Sí
  explicacion: Sí. Por el Teorema de la Potencia, $PA \cdot PB = d^2 - r^2$ de forma universal para todo punto exterior.
errores_frecuentes:
- '''Restar $d^2 - r^2$ para un punto interior obteniendo un resultado negativo sin considerar el valor absoluto $r^2 - d^2$.'''
- '''Olvidar que $PT = \sqrt{d^2 - r^2}$ requiere calcular la raíz cuadrada final.'''
- '''Confundir el radio $r$ con el diámetro $2r$ al calcular $d^2 - r^2$.'''
afirmaciones_verdaderas:
- '''Para todo punto exterior se cumple la equivalencia $\mathcal{P}(P) = PT^2 = PA \cdot PB = d^2 - r^2$.'''
- '''Para todo punto interior el producto de segmentos de cuerda es constante e igual a $r^2 - d^2$.'''
- '''La potencia permite calcular distancias al centro y radios a partir de longitudes de cuerdas y secantes.'''
al_terminar_debes_poder: '**QUÉ:** Calcular y vincular la potencia de un punto mediante cuerdas, secantes, tangentes y distancias al centro.


  **CÓMO:** Aplicando las equivalencias $\mathcal{P}(P) = PT^2 = PA \cdot PB = d^2 - r^2$ y $PA \cdot PB = r^2 - d^2$.


  ![Síntesis de cálculo de potencia unificada](/static/img/nodos/calculo-de-potencia-de-un-punto-usando-cuerdas-secantes-o-tangentes-resumen.svg)

  '
