semantic_id: MAT.ALG.ECUACION_BASE.CONJUNTO_SOLUCION
resumen_inicial: 'Concepto de conjunto solución de una ecuación: propiedades, resolución
  y modelamiento en Ecuación de primer grado: conceptos y propiedades.'
explicacion_simple: Una vez que atrapas al culpable (la solución), debes encerrarlo
  en una celda. En matemáticas formales, esa celda se llama 'Conjunto Solución'.
explicacion_formal: '### Definición formal


  Las llaves en teoría de conjuntos sirven para listar elementos discretos y exactos.


  ### Desarrollo didáctico


  Aunque decir ''$x = 5$'' es correcto, la notación formal universitaria (y usada
  en pruebas estandarizadas como PAES) es colocar ese 5 en un conjunto.


  - Si la ecuación es lineal y su respuesta es 5, escribimos: $S = \{5\}$.

  - Si la ecuación es cuadrática y tiene dos respuestas, ej. 3 y -3, escribimos: $S
  = \{-3, 3\}$.

  - Si una ecuación absurda (ej. $x = x + 1$) resulta NO tener solución, decimos que
  su conjunto solución es el Conjunto Vacío. Se escribe $S = \emptyset$ o $S = \{\}$.


  Las llaves $\{ \}$ indican que estamos enumerando elementos específicos, a diferencia
  de los corchetes $[ ]$ que indican un intervalo completo.'
definiciones_clave: '- **Concepto de conjunto solución de una ecuación**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a concepto de conjunto solución de una ecuación.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando concepto de conjunto
    solución de una ecuación.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de concepto de conjunto
    solución de una ecuación.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
