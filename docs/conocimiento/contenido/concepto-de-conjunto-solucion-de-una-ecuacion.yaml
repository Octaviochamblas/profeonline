semantic_id: MAT.ALG.ECUACION_BASE.CONJUNTO_SOLUCION
resumen_inicial: El conjunto solución es la agrupación formal que contiene a todos los valores de la incógnita que satisfacen una ecuación.
explicacion_simple: |
  El **conjunto solución** (denotado habitualmente con la letra $S$) es la representación formal entre llaves $\{ \}$ que reúne a todas las soluciones verdaderas de una ecuación.

  Para una ecuación lineal de primer grado con solución única, el conjunto solución contiene un solo elemento, por ejemplo $S = \{4\}$.

  Si la ecuación carece de solución en el universo real, su conjunto solución se expresa como el conjunto vacío $S = \emptyset$.
explicacion_formal: |
  ### Definición formal
  Para una ecuación $A(x) = B(x)$ definida sobre el universo de los números reales $\mathbb{R}$, el **conjunto solución** $S$ se define mediante comprensión como:

  $$S = \{x \in \mathbb{R} \mid A(x) = B(x)\}$$

  ### Desglose de la fórmula
  - $S = \{x \in \mathbb{R} \mid \dots\}$: Notación de conjunto por comprensión en el dominio de los números reales.
  - Si posee solución única $x = c$, el conjunto es singleton $S = \{c\}$.
  - Si es una identidad universal, $S = \mathbb{R}$.
  - Si es una contradicción o imposibilidad, $S = \emptyset$.

  ### Síntesis didáctica
  La cardinalidad del conjunto solución $|S|$ permite clasificar las ecuaciones en compatibles determinadas ($|S| = 1$), compatibles indeterminadas ($|S| = \infty$) e incompatibles ($|S| = 0$).
definiciones_clave: |
  - **Conjunto solución ($S$)**: Estructura que reúne formalmente todos los valores que satisfacen la igualdad.
  - **Conjunto vacío ($\emptyset$)**: Representación del conjunto solución cuando la ecuación no admite soluciones reales.
propiedades_relaciones: |
  - **Cardinalidad**: Determina la cantidad de soluciones de la ecuación ($|S| = 1$ en ecuaciones lineales no triviales).
  - **Diferencia entre $0$ y $\emptyset$**: El número $0$ es un elemento ($S = \{0\}$), mientras que $\emptyset$ denota ausencia de elementos.
ejemplo_guiado:
  enunciado: 'Determina el conjunto solución $S$ para la ecuación lineal $3x + 9 = 0$ y exprésalo en notación de conjuntos.'
  pasos:
    - 'Paso 1: Resolver la ecuación lineal: $3x = -9 \implies x = -3$.'
    - 'Paso 2: Verificar la solución: $3(-3) + 9 = -9 + 9 = 0$.'
    - 'Paso 3: Expresar el conjunto solución reuniendo el valor entre llaves: $S = \{-3\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se expresa formalmente el conjunto solución $S$ de la ecuación $3x + 9 = 0$?'
    choices:
      - {text: '$S = \{-3\}$', is_correct: true}
      - {text: '$S = \{3\}$', is_correct: false}
      - {text: '$S = \emptyset$', is_correct: false}
      - {text: '$S = \mathbb{R}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$S = \{-3\}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una ecuación lineal carece de solución en el conjunto de los números reales, ¿cómo se denota su conjunto solución?'
    choices:
      - {text: '$S = \emptyset$ (conjunto vacío)', is_correct: true}
      - {text: '$S = \{0\}$', is_correct: false}
      - {text: '$S = \{-1\}$', is_correct: false}
      - {text: '$S = \infty$', is_correct: false}
    explanation: 'La alternativa correcta es ''$S = \emptyset$ (conjunto vacío)''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Resolver algebraicamente la ecuación despejando la variable.'
  - 'Paso 2: Verificar si la solución obtenida pertenece al dominio de definición exigido.'
  - 'Paso 3: Encerrar las soluciones válidas entre llaves $\{ \}$ para construir el conjunto $S$.'
  - 'Paso 4: Escribir $S = \emptyset$ en caso de inconsistencia o $S = \mathbb{R}$ en caso de identidad.'
errores_correccion: |
  - **Error 1:** Confundir el conjunto solución vacío $S = \emptyset$ con el conjunto formado por el número cero $S = \{0\}$. **Cómo corregirlo:** Si la solución es el número cero ($x = 0$), **EL CONJUNTO ES $S = \{0\}$; SI NO EXISTE NINGUNA SOLUCIÓN, EL CONJUNTO ES $S = \emptyset$**.
  - **Error 2:** Omitir las llaves de notación al escribir el conjunto solución (escribir solo $S = 3$ en lugar de $S = \{3\}$). **Cómo corregirlo:** La notación de conjuntos **EXIGE ENCERRAR LOS ELEMENTOS ENTRE LLAVES $\{ \}$**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es el conjunto solución de la ecuación $5x = 0$?'
    alternativas:
      - '$S = \{0\}$'
      - '$S = \emptyset$'
      - '$S = \{5\}$'
    respuesta: '$S = \{0\}$'
    solucion_pasos:
      - '1. Despejar $x$: $x = \frac{0}{5} = 0$.'
      - '2. El número $0$ es la solución $\implies S = \{0\}$.'
  - titulo: 'Ejemplo 2'
    enunciado: '¿Cuál es el conjunto solución de la contradicción $0 \cdot x = 8$?'
    alternativas:
      - '$S = \emptyset$'
      - '$S = \{8\}$'
      - '$S = \{0\}$'
    respuesta: '$S = \emptyset$'
    solucion_pasos:
      - '1. La igualdad $0 = 8$ es imposible $\implies$ no existen soluciones.'
      - '2. Por lo tanto, $S = \emptyset$.'
  - titulo: 'Identidad y conjunto solución'
    enunciado: '¿El conjunto solución de la identidad $x + 1 = 1 + x$ es todo el conjunto de los números reales $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, se verifica universalmente para cualquier valor $x \in \mathbb{R}$.'
  - titulo: 'Conjunto solución singleton'
    enunciado: '¿Una ecuación lineal no trivial $ax + b = 0$ produce un conjunto solución con exactamente un elemento?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, posee cardinalidad $|S| = 1$.'
errores_frecuentes:
  - 'El conjunto solución $S = \{0\}$ de la ecuación $5x = 0$ equivale al conjunto solución vacío $S = \emptyset$.'
  - 'La notación formal del conjunto solución de $3x + 9 = 0$ prescinde de llaves escribiéndose $S = -3$.'
  - 'Los valores excluidos del dominio de definición de una expresión se incluyen dentro de su conjunto solución.'
  - 'El conjunto solución de una identidad universal como $x + 1 = 1 + x$ es el conjunto vacío $S = \emptyset$.'
  - 'El conjunto solución de una ecuación lineal con dos variables equivale a un número real escalar único.'
afirmaciones_verdaderas:
  - 'El conjunto solución $S$ reúne a todos los valores de la variable que satisfacen la ecuación.'
  - 'Si una ecuación no admite soluciones reales, su conjunto solución es el conjunto vacío $S = \emptyset$.'
al_terminar_debes_poder: |
  QUÉ: Expresar e interpretar el conjunto solución de una ecuación de primer grado.
  CÓMO: Notar formalmente las soluciones entre llaves $\{ \}$, distinguiendo casos de solución única $S = \{c\}$, infinitas soluciones $S = \mathbb{R}$ y sin solución $S = \emptyset$.
fuente: 'Texto escolar MINEDUC — Álgebra 7° Básico / Ecuaciones Lineales.'
