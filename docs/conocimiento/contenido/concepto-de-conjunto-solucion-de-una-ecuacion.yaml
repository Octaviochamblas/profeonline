semantic_id: MAT.ALG.ECUACION_BASE.CONJUNTO_SOLUCION
resumen_inicial: El conjunto solución es el conjunto formado por todos los valores
  de la incógnita que satisfacen la ecuación.
explicacion_simple: 'El **conjunto solución** (que se denota con la letra $S$) es
  la lista formal encerrada entre llaves que reúne a todas las soluciones verdaderas
  de una ecuación.

  Para una ecuación de primer grado común, el conjunto solución contiene un único
  elemento, por ejemplo $S = \{4\}$.

  Si la ecuación no tiene solución, el conjunto solución es el conjunto vacío $S =
  \emptyset$.'
explicacion_formal: 'Para una ecuación $A(x) = B(x)$ sobre el universo $\mathbb{R}$,
  el **conjunto solución** $S$ se define mediante comprensión como:


  $$S = \{x \in \mathbb{R} \mid A(x) = B(x)\}$$


  **Desglose de la fórmula:**

  - $S = \{x \in \mathbb{R} \mid \dots\}$: Notación de conjunto por comprensión en
  los números reales.

  - Si la ecuación tiene solución única $x = c$, entonces $S = \{c\}$.

  - Si la ecuación es una identidad, $S = \mathbb{R}$.

  - Si la ecuación es una contradicción, $S = \emptyset$.'
definiciones_clave: '- **Conjunto solución ($S$)**: Conjunto de todos los elementos
  del universo que convierten la ecuación en una igualdad verdadera.

  - **Conjunto vacío ($\emptyset$)**: Notación utilizada cuando la ecuación no posee
  solución alguna en $\mathbb{R}$.'
propiedades_relaciones: '- **Clasificación por cardinalidad**: $|S| = 1$ (solución
  única), $|S| = 0$ (sin solución), $|S| = \infty$ (infinitas soluciones).'
ejemplo_guiado:
  enunciado: Determina el conjunto solución $S$ para la ecuación lineal $3x + 9 =
    0$ y exprésalo en notación de conjuntos.
  pasos:
  - 'Paso 1: Resolver la ecuación: $3x = -9 \implies x = -3$.Paso 2: Verificar la
    solución: $3(-3) + 9 = -9 + 9 = 0$.Paso 3: Escribir el conjunto solución encerrando
    el elemento entre llaves: $S = \{-3\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se expresa el conjunto solución $S$ de la ecuación $3x + 9 = 0$?
  choices:
  - text: $S = \{-3\}$
    is_correct: true
  - text: $S = \{3\}$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  - text: $S = \mathbb{R}$
    is_correct: false
  explanation: La alternativa correcta es '$S = \{-3\}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una ecuación carece de solución en los números reales, ¿cómo se representa
    su conjunto solución?
  choices:
  - text: $S = \emptyset$ (conjunto vacío)
    is_correct: true
  - text: $S = \{0\}$
    is_correct: false
  - text: $S = \{-1\}$
    is_correct: false
  - text: $S = \infty$
    is_correct: false
  explanation: La alternativa correcta es '$S = \emptyset$ (conjunto vacío)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver la ecuación y encontrar sus soluciones.'
- 'Paso 2: Verificar cuáles de los valores encontrados pertenecen al dominio de definición.'
- 'Paso 3: Encerrar las soluciones válidas entre llaves $\{ \}$ para denotar el conjunto
  $S$.'
errores_correccion: '- **Error común:** Confundir el conjunto solución vacío $S =
  \emptyset$ con el conjunto que contiene al cero $S = \{0\}$.

  - **Cómo corregirlo:** Si la solución de la ecuación es el número cero ($x = 0$),
  el conjunto es $S = \{0\}$. Si no hay solución, es $S = \emptyset$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de igualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de igualdades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar la misma cantidad en ambos miembros preserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Una ecuación se cumple para todos los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una ecuación condicional solo se cumple para valores específicos.
errores_frecuentes:
- Confundir la definición de una igualdad numérica con la de una expresión algebraica.
- Asumir que las identidades solo son válidas para números enteros positivos.
- Confundir los miembros de una ecuación con sus términos individuales.
- Sumar o restar una cantidad en un solo lado de la ecuación al intentar despejar.
- Dividir ambos miembros de la ecuación entre cero.
afirmaciones_verdaderas:
- Una ecuación es una igualdad condicionada que se verifica solo para determinados
  valores de la incógnita.
- Aplicar las propiedades aditiva y multiplicativa en ambos miembros de una ecuación
  genera ecuaciones equivalentes.
al_terminar_debes_poder: Al finalizar este recurso podrás definir conceptos fundamentales
  de ecuaciones de primer grado y aplicar las propiedades de la igualdad.
