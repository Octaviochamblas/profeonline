procedimiento:
- 'Paso 1: Resuelve la ecuación para obtener la(s) solución(es).'
- 'Paso 2: Escribe la letra mayúscula $S$ y un signo igual.'
- 'Paso 3: Abre llaves $\{$.'
- 'Paso 4: Escribe tus respuestas dentro, separadas por comas (si hay más de una).'
- 'Paso 5: Cierra llaves $\}$.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en concepto de conjunto solución de una ecuación.
ejemplos:
- titulo: Expresa la solución de $2x - 4 = 0$ como conjunto solución
  enunciado: Expresa la solución de $2x - 4 = 0$ como conjunto solución.
  solucion_pasos:
  - 'Resolvemos: $2x = 4 \rightarrow x = 2$.'
  - 'Formateamos como conjunto: $S = \{2\}$.'
- titulo: Si una ecuación no tiene solución, ¿cómo se escribe su conjunto solución?
  solucion_pasos:
  - O también S = {}. Simboliza que el conjunto está vacío de respuestas.
- titulo: 'Respecto de «Concepto de conjunto solución de una ecuación»: ¿Es correcta
    esta caracterizaci'
  enunciado: 'Respecto de «Concepto de conjunto solución de una ecuación»: ¿Es correcta
    esta caracterización? «El Conjunto Solución, denotado usualmente con una $S$,
    es el grupo de todos los valores que hacen verdadera la ecuación, encerrados entre
    llaves $\{ \}$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El Conjunto Solución, denotado
    usualmente con una $S$, es el grupo de todos los valores que hacen verdadera la
    ecuación, encerrados entre llaves $\{ \}$.'
- titulo: 'Respecto de «Concepto de conjunto solución de una ecuación»: ¿Es válida
    esta afirmación? «Us'
  enunciado: 'Respecto de «Concepto de conjunto solución de una ecuación»: ¿Es válida
    esta afirmación? «Usar paréntesis redondos () o corchetes [] en lugar de llaves
    {}. En matemáticas esto significa ''intervalo'' y es un grave error conceptual
    en ecuaciones»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El Conjunto Solución, denotado
    usualmente con una $S$, es el grupo de todos los valores que hacen verdadera la
    ecuación, encerrados entre llaves $\{ \}$.'
errores_frecuentes:
- Usar paréntesis redondos () o corchetes [] en lugar de llaves {}. En matemáticas
  esto significa 'intervalo' y es un grave error conceptual en ecuaciones.
- Escribir $\{ \emptyset \}$ (esto es un conjunto que contiene al conjunto vacío,
  no está vacío).
- Que la solución está entre 0 y 4.
- Para «¿Qué indican las llaves $\{ \}$ al escribir un Conjunto Solución como $S =
  \{4\}$», la respuesta correcta es Que es un intervalo abierto.
- Que el número 4 es negativo.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_poder: Resolver ecuaciones y sistemas lineales aplicando concepto
  de conjunto solución de una ecuación.
