semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_CENTRO_DEFINICION
resumen_inicial: 'Definición de ángulo del centro en una circunferencia: conceptos,
  teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Al unir el centro de una circunferencia con dos puntos de ella
  mediante radios, se forma un ángulo especial llamado ángulo del centro.
explicacion_formal: '![Ángulo del centro en la circunferencia](/static/img/geometria/circunferencia-circulo/circulo-angulo-centro-definicion.svg)


  ### Definición formal


  Un ángulo del centro (o ángulo central) es un ángulo cuyo vértice coincide con el
  centro $O$ de una circunferencia y cuyos lados son dos radios $OA$ y $OB$. El arco
  $AB$ comprendido entre los extremos de los radios se llama arco correspondiente
  al ángulo del centro.


  ### Desarrollo didáctico


  En la figura, $O$ es el centro de la circunferencia y $A$, $B$ son puntos sobre
  ella. El ángulo $\angle AOB$, formado por los radios $OA$ y $OB$, es un ángulo del
  centro. A cada ángulo del centro le corresponde un único arco (el arco $AB$ que
  ''ve'' el ángulo).'
