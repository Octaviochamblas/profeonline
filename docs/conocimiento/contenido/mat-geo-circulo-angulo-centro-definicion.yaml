procedimiento:
- 'Paso 1: Ubica el centro O de la circunferencia y verifica que sea el vértice del
  ángulo.'
- 'Paso 2: Identifica los dos radios que forman los lados del ángulo (OA y OB).'
- 'Paso 3: Reconoce el arco AB correspondiente, comprendido entre los extremos de
  ambos radios.'
