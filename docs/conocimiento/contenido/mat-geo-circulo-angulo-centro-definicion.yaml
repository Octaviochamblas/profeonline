- titulo: ¿Se cumple siempre la propiedad principal de definición de ángulo del centro
    en una circunferencia en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
