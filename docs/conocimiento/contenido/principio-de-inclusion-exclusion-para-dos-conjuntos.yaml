semantic_id: MAT.FUND.CARDINALIDAD_CONJUNTOS.INCLUSION_EXCLUSION_DOS_CONJUNTOS
resumen_inicial: 'Fórmula fundamental, demostración y aplicaciones del Principio de Inclusión-Exclusión para dos conjuntos finitos: $|A \cup B| = |A| + |B| - |A \cap B|$.'
explicacion_simple: 'El **Principio de Inclusión-Exclusión para dos conjuntos** es la fórmula maestra para contar elementos cuando dos grupos tienen elementos en común:

  $$|A \cup B| = |A| + |B| - |A \cap B|$$

  ¿Por qué restamos la intersección? Porque al sumar todos los elementos de $A$ y luego todos los de $B$, los elementos compartidos (los que están en ambos a la vez) **se sumaron dos veces**. Al restar $|A \cap B|$ una vez, corregimos el doble conteo y obtenemos la cantidad exacta de elementos distintos en la unión.


  ![principio-de-inclusion-exclusion-para-dos-conjuntos](/static/img/nodos/principio-de-inclusion-exclusion-para-dos-conjuntos-intro.svg)'
explicacion_formal: '### Definición formal

  En la combinatoria enumerativa y la teoría de la probabilidad, el **Principio de Inclusión-Exclusión para dos conjuntos** establece que para cualesquiera dos conjuntos finitos $A$ y $B$:

  $$|A \cup B| = |A| + |B| - |A \cap B|$$

  Demostración formal mediante descomposición disyunta:

  Sabemos que $A \cup B = (A \setminus B) \cup (B \setminus A) \cup (A \cap B)$ con las tres regiones disjuntas dos a dos. Por el principio aditivo:

  $$|A \cup B| = |A \setminus B| + |B \setminus A| + |A \cap B|$$

  Como $|A| = |A \setminus B| + |A \cap B| \implies |A \setminus B| = |A| - |A \cap B|$, y análogamente $|B \setminus A| = |B| - |A \cap B|$, sustituyendo se obtiene:

  $$|A \cup B| = (|A| - |A \cap B|) + (|B| - |A \cap B|) + |A \cap B| = |A| + |B| - |A \cap B|$$


  ### Desglose simbólico

  - Despeje de la intersección: $|A \cap B| = |A| + |B| - |A \cup B|$.

  - Despeje de componentes individuales: $|A| = |A \cup B| + |A \cap B| - |B|$.

  - Desigualdad de Boole-Fréchet: $|A \cup B| \leq |A| + |B|$ (con igualdad si y solo si $A \cap B = \emptyset$).


  ### Síntesis didáctica

  La fórmula compensa exactamente el sobreconteo generado por la no vaciedad de la intersección.

  '
definiciones_clave: '- **Principio de Inclusión-Exclusión**: Teorema combinatorio que relaciona las cardinalidades de la unión, los conjuntos individuales y su intersección.

  - **Sobreconteo**: Contabilización múltiple de elementos compartidos que requiere corrección sustractiva.

  - **Desigualdad de Boole**: Cota superior $|A \cup B| \leq |A| + |B|$.

  '
propiedades_relaciones: '- **Probabilidad de la unión**: $P(A \cup B) = P(A) + P(B) - P(A \cap B)$.

  - **Diferencia simétrica**: $|A \bigtriangleup B| = |A \cup B| - |A \cap B| = |A| + |B| - 2|A \cap B|$.

  '
ejemplo_guiado:
  enunciado: 'En una clase de $35$ alumnos, $20$ estudian inglés ($I$), $18$ estudian francés ($F$) y $7$ estudian ambos idiomas ($I \cap F$). Calcula cuántos alumnos estudian al menos uno de los dos idiomas ($|I \cup F|$).


    ![Ejemplo principio-de-inclusion-exclusion-para-dos-conjuntos](/static/img/nodos/principio-de-inclusion-exclusion-para-dos-conjuntos-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar los datos dados: - $|I| = 20$. - $|F| = 18$. - $|I \cap F| = 7$.'
  - 'Paso 2: Plantear la fórmula de inclusión-exclusión: - $|I \cup F| = |I| + |F| - |I \cap F|$.'
  - 'Paso 3: Sustituir los valores numéricos: - $|I \cup F| = 20 + 18 - 7$.'
  - 'Paso 4: Realizar el cálculo: - $20 + 18 = 38$. - $38 - 7 = 31$.'
  - 'Paso 5: Concluir que $31$ alumnos estudian al menos uno de los dos idiomas (y $35 - 31 = 4$ no estudian ninguno).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué en la fórmula $|A \cup B| = |A| + |B| - |A \cap B|$ se resta el término $|A \cap B|$?
  choices:
  - text: Porque al sumar $|A|$ y $|B|$, los elementos comunes de la intersección se contabilizaron dos veces
    is_correct: true
