  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las cantidades dadas en el problema ($|A|$, $|B|$, $|A \cap B|$ o $|A \cup B|$).'
- 'Paso 2: Seleccionar la incógnita a despejar en la ecuación $|A \cup B| = |A| + |B| - |A \cap B|$.'
- 'Paso 3: Sustituir los valores conocidos y operar algebraicamente.'
- 'Paso 4: Verificar que el resultado sea no negativo y no exceda la cota universal $|\mathcal{U}|$.'
errores_correccion: '- **Error 1:** Sumar directamente $|A| + |B|$ sin deducir la intersección común. **Cómo corregirlo:** La adición simple solo funciona en conjuntos disjuntos; si hay elementos comunes, la resta de $|A \cap B|$ es obligatoria.

  - **Error 2:** Restar dos veces la intersección al calcular la unión. **Cómo corregirlo:** Restar dos veces elimina a los elementos comunes por completo (dando la diferencia simétrica); para la unión se debe restar exactamente una sola vez.

  '
ejemplos:
- titulo: Cálculo de unión con solapamiento
  enunciado: Si $|A| = 15, |B| = 20, |A \cap B| = 6$, ¿cuánto vale $|A \cup B|$?
  alternativas:
  - $29$
  - $35$
  - $23$
  respuesta: $29$
  solucion_pasos:
  - 1. $|A \cup B| = 15 + 20 - 6 = 29$.
- titulo: Despeje de intersección
  enunciado: Si $|A| = 10, |B| = 12, |A \cup B| = 18$, ¿cuál es $|A \cap B|$?
  respuesta: $4$
  solucion_pasos:
  - $|A \cap B| = 10 + 12 - 18 = 4$.
  alternativas:
  - texto: $4$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad y cálculo cardinal.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el principio de conteo entrega un valor determinado y exacto.
  - texto: No se puede determinar con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del enunciado bastan para despejar la incógnita.
- titulo: Caso disjunto
  enunciado: Si $|A \cap B| = 0$, ¿qué produce la fórmula de inclusión-exclusión?
  respuesta: $|A \cup B| = |A| + |B|$
  solucion_pasos:
  - Coincide con el principio aditivo de conjuntos disjuntos.
  alternativas:
  - texto: $|A \cup B| = |A| + |B|$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad y cálculo cardinal.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el principio de conteo entrega un valor determinado y exacto.
  - texto: No se puede determinar con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del enunciado bastan para despejar la incógnita.
- titulo: Diferencia simétrica a partir de la fórmula
  enunciado: Si $|A| = 15, |B| = 20, |A \cap B| = 5$, ¿cuánto vale $|A \bigtriangleup B|$?
  respuesta: $25$
  solucion_pasos:
  - $|A| + |B| - 2|A \cap B| = 35 - 10 = 25$.
  alternativas:
