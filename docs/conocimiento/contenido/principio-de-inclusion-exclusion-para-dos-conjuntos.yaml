    retroalimentacion: Incorrecto, los datos del enunciado bastan para despejar la incógnita.
errores_frecuentes:
- La afirmación de que la unión de conjuntos siempre es igual a la suma de sus cardinalidades sin deducir elementos comunes.
- La afirmación de que el término de intersección $|A \cap B|$ se suma en lugar de restarse en la fórmula.
- La afirmación de que la cardinalidad de la intersección puede ser un valor negativo.
- La afirmación de que la fórmula de inclusión-exclusión solo es válida si los conjuntos tienen la misma cantidad de miembros.
- La afirmación de que la deducción duplicada de la intersección produce la cardinalidad de la unión.
afirmaciones_verdaderas:
- El Principio de Inclusión-Exclusión para dos conjuntos finitos establece que $|A \cup B| = |A| + |B| - |A \cap B|$.
- La cardinalidad de la intersección de dos conjuntos finitos puede despejarse como $|A \cap B| = |A| + |B| - |A \cup B|$.
al_terminar_debes_poder: 'QUÉ: Enunciar, demostrar y aplicar el Principio de Inclusión-Exclusión para dos conjuntos ($|A \cup B| = |A| + |B| - |A \cap B|$).

  CÓMO: Resolver incógnitas cardinales (unión o intersección), corregir el doble conteo de elementos y aplicar la desigualdad de Boole.


  ![Resumen principio-de-inclusion-exclusion-para-dos-conjuntos](/static/img/nodos/principio-de-inclusion-exclusion-para-dos-conjuntos-resumen.svg)'
