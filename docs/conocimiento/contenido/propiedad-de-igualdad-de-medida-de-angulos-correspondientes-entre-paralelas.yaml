semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.CORRESPONDIENTES_IGUALDAD
resumen_inicial: Los ángulos correspondientes ocupan posiciones idénticas en cada
  intersección de paralelas con una transversal, demostrando el paralelismo entre
  rectas.
explicacion_simple: Si miras la esquina superior derecha del primer cruce de calles
  y la comparas con la esquina superior derecha del segundo cruce idéntico, verás
  que miden exactamente lo mismo.
explicacion_formal: Los **ángulos correspondientes** ocupan la misma posición relativa
  en cada intersección formada por una transversal que corta a dos rectas paralelas
  $L_1 \parallel L_2$, siendo congruentes entre sí.
definiciones_clave: '- **Propiedad de igualdad de medida de ángulos correspondientes
  entre paralelas**: Elemento o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en propiedad de igualdad de medida de ángulos correspondientes entre paralelas se
  mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Dos cables de alta tensión paralelos son cruzados por un tirante metálico.
    Los ángulos correspondientes en ambas torres miden $5x - 10^\circ$ y $75^\circ$.
    Calcula $x$ justificando por congruencia.
  pasos:
  - 'Paso 1: Igualar ambos ángulos correspondientes por paralelismo: $5x - 10 = 75$.'
  - 'Paso 2: Sumar 10 a ambos lados: $5x = 85$.'
  - 'Paso 3: Dividir entre 5: $x = 17^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de propiedad de igualdad de medida
    de ángulos correspondientes entre paralelas?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $5x - 10^\circ = 75^\circ$, ¿cuál es el valor de x?
  choices:
  - text: 17°
    is_correct: true
  - text: 13°
    is_correct: false
  - text: 15°
    is_correct: false
  - text: 20°
    is_correct: false
  explanation: La alternativa correcta es '17°', obtenida al resolver $5x = 85 \implies
    x = 17^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en propiedad de igualdad de medida de ángulos
  correspondientes entre paralelas.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en propiedad de igualdad
  de medida de ángulos correspondientes entre paralelas sean coherentes y tengan sentido
  geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 128^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 52°
  - 128°
  - 90°
  respuesta: 52°
  solucion_pasos:
  - Despejando $x = 180 - 128 = 52^\circ$.
- titulo: Ejemplo 2
  enunciado: En propiedad de igualdad de medida de ángulos correspondientes entre
    paralelas, si dos ángulos son suplementarios y uno mide 128°, ¿cuánto mide el
    otro?
  alternativas:
  - 52°
  - 42°
  - 360°
  respuesta: 52°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 128 = 52^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en propiedad de
    igualdad de medida de ángulos correspondientes entre paralelas?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en propiedad de igualdad de medida
    de ángulos correspondientes entre paralelas es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de propiedad de igualdad de medida de ángulos
  correspondientes entre paralelas.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
