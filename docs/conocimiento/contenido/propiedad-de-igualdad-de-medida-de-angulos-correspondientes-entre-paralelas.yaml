semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.CORRESPONDIENTES_IGUALDAD
resumen_inicial: Si dos rectas paralelas son cortadas por una transversal, los ángulos
  correspondientes tienen exactamente la misma medida angular (son congruentes).
explicacion_simple: '![Igualdad de Ángulos Correspondientes](/static/img/nodos/propiedad-de-igualdad-de-medida-de-angulos-correspondientes-entre-paralelas-intro.svg)


  Debido a que las dos rectas paralelas van exactamente en la misma dirección, la
  transversal las corta con la misma inclinación exacta. Así, el ángulo en la esquina
  superior derecha del primer cruce mide exactamente lo mismo que el de la esquina
  superior derecha del segundo cruce.'
explicacion_formal: '### Teorema formal (Postulado de Euclides)

  Si dos rectas paralelas $L_1$ y $L_2$ son intersecadas por una transversal $T$,
  los ángulos correspondientes tienen exactamente la **misma medida**:


  $$L_1 \parallel L_2 \implies \alpha = \beta \quad (\text{Ángulos Correspondientes})$$


  ### Desglose simbólico y geométrico

  - Invariancia por traslación: Al trasladar el vértice superior sobre la transversal
  hasta el vértice inferior, los ángulos coinciden de forma idéntica.

  - Criterio de paralelismo: $L_1 \parallel L_2 \iff \text{Ángulos correspondientes
  congruentes}$.


  ### Síntesis didáctica

  La congruencia de ángulos correspondientes es el criterio directo más utilizado
  para demostrar paralelismo entre líneas en geometría escolar y aplicada.'
definiciones_clave: '- **Postulado de paralelismo**: Principio fundamental que establece
  $\alpha = \beta$ para todo par correspondiente en rectas paralelas.

  - **Criterio de correspondencia**: Si un par de ángulos correspondientes son congruentes,
  entonces $L_1 \parallel L_2$. '
propiedades_relaciones: '- **Demostración de otros teoremas**: A partir de la igualdad
  de correspondientes se demuestran los teoremas de alternos internos, alternos externos
  y colaterales.

  - **Ecuaciones de congruencia**: Permite formular igualdades directas entre expresiones
  con incógnitas. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Igualdad de Correspondientes](/static/img/nodos/propiedad-de-igualdad-de-medida-de-angulos-correspondientes-entre-paralelas-ejemplos.svg)


    Dos ángulos correspondientes entre rectas paralelas están dados por $\alpha =
    3x + 15^\circ$ y $\beta = 5x - 25^\circ$. Determina el valor de $x$ y la medida
    de los ángulos.'
  pasos:
  - 'Paso 1: Por postulado de correspondientes en paralelas, igualar: $5x - 25^\circ
    = 3x + 15^\circ$.'
  - 'Paso 2: Agrupar términos con $x$: $5x - 3x = 15^\circ + 25^\circ$.'
  - 'Paso 3: Resolver: $2x = 40^\circ \implies x = 20^\circ$.'
  - 'Paso 4: Calcular la medida del ángulo: $3(20^\circ) + 15^\circ = 60^\circ + 15^\circ
    = 75^\circ$.'
  - 'Paso 5: Comprobar: $5(20^\circ) - 25^\circ = 100^\circ - 25^\circ = 75^\circ$.
    Ambos miden $75^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo son las medidas de dos ángulos correspondientes cuando las rectas
    son paralelas?
  choices:
  - text: Iguales (congruentes)
    is_correct: true
  - text: Suplementarios (suman 180°)
    is_correct: false
  - text: Complementarios (suman 90°)
    is_correct: false
  - text: Siempre miden 90°
    is_correct: false
  explanation: Por postulado geométrico, los ángulos correspondientes son iguales
    (congruentes).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo correspondiente mide 83° en rectas paralelas, ¿cuánto mide
    el otro ángulo correspondiente?
  choices:
  - text: 83° (por ser iguales los ángulos correspondientes entre paralelas)
    is_correct: true
  - text: 97°
    is_correct: false
  - text: 180°
    is_correct: false
  - text: 7°
    is_correct: false
  explanation: Por el postulado de correspondencia entre paralelas, su medida es 83°
    (por ser iguales los ángulos correspondientes entre paralelas).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las rectas paralelas $L_1 \parallel L_2$.'
- 'Paso 2: Confirmar que los dos ángulos están en posición correspondiente.'
- 'Paso 3: Formular la igualdad $\alpha_1 = \alpha_2$.'
- 'Paso 4: Resolver algebraicamente para obtener la incógnita.'
errores_correccion: No confundas ángulos correspondientes (que son iguales) con ángulos
  colaterales (que suman 180°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si dos ángulos correspondientes entre paralelas miden $2x$ y $80^\circ$,
    ¿cuánto vale $x$?
  alternativas:
  - $40^\circ$
  - $80^\circ$
  - $50^\circ$
  respuesta: $40^\circ$
  solucion_pasos:
  - $2x = 80^\circ \implies x = 40^\circ$.
- titulo: Ejemplo 2
  enunciado: Si un ángulo correspondiente mide $105^\circ$, ¿cuánto mide su pareja
    correspondiente?
  alternativas:
  - $105^\circ$
  - $75^\circ$
  - $90^\circ$
  respuesta: $105^\circ$
  solucion_pasos:
  - Mide exactamente lo mismo por ser correspondiente: $105^\circ$.
- titulo: ¿Dos ángulos correspondientes entre paralelas son siempre congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, por postulado euclidiano de paralelismo son congruentes.
- titulo: ¿Los ángulos correspondientes suman 180°?
  respuesta: 'No'
  solucion_pasos:
  - No, son iguales entre sí; solo sumarían 180° si fueran ángulos rectos de 90°.
errores_frecuentes:
- Igualar a $180^\circ$ en vez de igualar las expresiones entre sí.
- Aplicar la igualdad cuando las rectas no son paralelas.
- Confundir ángulos correspondientes con colaterales internos.
- Equivocarse en la transposición de términos algebraicos.
- Suponer medidas sin verificar la posición correspondiente.
afirmaciones_verdaderas:
- Los ángulos correspondientes entre rectas paralelas son siempre congruentes.
- La congruencia de correspondientes fundamenta los criterios de paralelismo.
al_terminar_debes_poder: '**QUÉ:** Aplicar el postulado de congruencia de ángulos
  correspondientes para calcular valores angulares desconocidos.


  **CÓMO:** Igualando las expresiones algebraicas $\alpha_1 = \alpha_2$ bajo la condición
  $L_1 \parallel L_2$.


  ![Resumen de Igualdad de Correspondientes](/static/img/nodos/propiedad-de-igualdad-de-medida-de-angulos-correspondientes-entre-paralelas-resumen.svg)'
