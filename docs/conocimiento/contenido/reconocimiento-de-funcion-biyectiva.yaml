semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.BIYECTIVA_RECONOCIMIENTO
resumen_inicial: Reconocer una función biyectiva en gráficos requiere verificar que
  cumpla los criterios de la línea vertical y de la línea horizontal con cobertura
  total.
explicacion_simple: 'Para saber si un gráfico o relación es **biyectiva**:

  - **En diagramas sagitales:** De cada elemento de $A$ sale una sola flecha, y a
  cada elemento de $B$ llega EXACTAMENTE UNA flecha.

  - **En gráficas cartesianas:** Las rectas horizontales cortan a la curva en EXACTAMENTE
  UN PUNTO a lo largo de todo el codominio.'
explicacion_formal: 'Dada la gráfica $G(f) \subset A \times B$, la relación establece
  una **biyección** si y solo si la proyección ortogonal dual satisface:


  $$\forall y \in B, \quad |G(f) \cap (A \times \{y\})| = 1$$


  **Desglose of la fórmula:**

  - Cada altura $y$ del codominio interseca a la gráfica en un único par ordenado
  $(x, y)$.'
definiciones_clave: '- **Correspondencia biunívoca**: Relación uno a uno perfecta
  entre todos los elementos del dominio y del codominio.'
propiedades_relaciones: '- **Invertibilidad gráfica**: La curva biyectiva puede reflejarse
  respecto a la bisectriz $y = x$ generando una función válida.'
ejemplo_guiado:
  enunciado: 'Analiza si la función exponencial $f: \mathbb{R} \to ]0, +\infty[$ dada
    por $f(x) = 2^x$ es biyectiva.'
  pasos:
  - 'Paso 1: Verificar inyectividad: si $2^{x_1} = 2^{x_2} \implies x_1 = x_2$ (INYECTIVA,
    rectas horizontales cortan en a lo sumo 1 punto).Paso 2: Verificar sobreyectividad:
    el recorrido de $2^x$ son todos los reales positivos $]0, +\infty[$, que coincide
    con el codominio declarado (SOBREYECTIVA).Paso 3: Concluir que $f(x) = 2^x$ con
    codominio $]0, +\infty[$ es BIYECTIVA.'
checkpoints:
- placement: after_explicacion_formal
  question: 'Al analizar la función $f: \mathbb{R} \to ]0, +\infty[$ dada por $f(x)
    = 2^x$, ¿cuál es su clasificación?'
  choices:
  - text: Es una función biyectiva.
    is_correct: true
  - text: Es inyectiva pero no sobreyectiva.
    is_correct: false
  - text: No es una función.
    is_correct: false
  - text: Es una función constante.
    is_correct: false
  explanation: La alternativa correcta es 'Es una función biyectiva.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un diagrama sagital entre conjuntos de igual número de elementos finitos,
    ¿qué caracteriza a una función biyectiva?
  choices:
  - text: A cada elemento del conjunto de llegada llega exactamente una flecha.
    is_correct: true
  - text: A algunos elementos les llegan dos flechas y a otros ninguna.
    is_correct: false
  - text: No hay flechas trazadas.
    is_correct: false
  - text: Todas las flechas salen del mismo punto.
    is_correct: false
  explanation: La alternativa correcta es 'A cada elemento del conjunto de llegada
    llega exactamente una flecha.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar el test de la línea vertical para asegurar que es función.'
- 'Paso 2: Comprobar el test de la línea horizontal para validar inyectividad.'
- 'Paso 3: Comprobar que el recorrido cubra todo el codominio para validar sobreyectividad.'
- 'Paso 4: Concluir si la gráfica representa una función biyectiva.'
errores_correccion: '- **Error común:** Decir que $f(x) = 2^x$ no es biyectiva sin
  revisar su codominio declarado.

  - **Cómo corregirlo:** Como el codominio se declaró como $]0, +\infty[$, coincide
  con su recorrido y resulta sobreyectiva y biyectiva.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de tipos de funciones y función inversa.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de tipos de funciones y función inversa.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función debe ser biyectiva para admitir función inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema fundamental de invertibilidad.
- titulo: ¿Las gráficas de f y su inversa son simétricas respecto a la recta y = x?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de reflexión especular de pares ordenados (x, y) a (y, x).
errores_frecuentes:
- Confundir el criterio de la línea horizontal (para inyectividad) con el criterio
  de la línea vertical (para ser función).
- Confundir la notación de función inversa $f^{-1}(x)$ con el recíproco o potencia
  $\frac{1}{f(x)}$.
- Intentar calcular la inversa de una función que no es biyectiva en los conjuntos
  considerados.
- Olvidar intercambiar las variables $x$ e $y$ al finalizar el algoritmo de despeje
  algebraico.
- Creer que la simetría gráfica de la función inversa es respecto al eje Y en lugar
  de la recta bisectriz $y = x$.
afirmaciones_verdaderas:
- Una función admite función inversa $f^{-1}$ si y solo si es biyectiva en sus conjuntos
  de definición.
- Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas respecto a
  la recta bisectriz del primer cuadrante $y = x$.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e identificar
  funciones inyectivas, sobreyectivas y biyectivas, calculando y verificando algebraicamente
  y gráficamente la función inversa.
