semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.BIYECTIVA_RECONOCIMIENTO
resumen_inicial: El reconocimiento gráfico de una función biyectiva establece que toda recta horizontal trazada a la altura de cualquier elemento del codominio $B$ debe cortar a la gráfica en exactamente un punto.
explicacion_simple: '![El reconocimiento gráfico de una función biyectiva establece que toda recta horizontal trazada a la altura de cualquier elemento del codominio $B$ debe cortar a la gráfica en exactamente un punto](/static/img/nodos/reconocimiento-de-funcion-biyectiva-intro.svg)



  Para saber si una gráfica representa una función biyectiva:

  1. Toma cualquier nivel horizontal $y$ dentro del conjunto de llegada $B$.

  2. Traza una línea horizontal imaginaria en esa altura.

  3. **Criterio de Biyectividad:** La línea debe cortar a la gráfica **en exactamente UN punto** (ni cero veces, ni dos veces; exactamente una vez).


  Si esto ocurre para todos los niveles de $B$, la función es **biyectiva**.'
explicacion_formal: 'Dada una función $f: A \to B$, el criterio de reconocimiento gráfico de biyectividad unifica los dos teoremas de corte:

  $$f \text{ es biyectiva} \Longleftrightarrow \forall y_0 \in B, \; |(\,\mathbb{R} \times \{y_0\}\,) \cap \text{Graf}(f)| = 1$$


  **Desglose:**

  - **Existencia ($\ge 1$ corte)**: Garantiza la sobreyectividad (no hay niveles vacíos en $B$).

  - **Unicidad ($\le 1$ corte)**: Garantiza la inyectividad (no hay niveles cortados más de una vez).'
definiciones_clave: '- **Criterio de corte único**: Condición geométrica donde cada recta horizontal en $B$ intersecta a la curva una única vez.

  - **Correspondencia biunívoca gráfica**: Geometría donde a cada altura $y$ le corresponde una única coordenada horizontal $x$.'
propiedades_relaciones: '- **Monotonía y continuidad**: Toda función continua y estrictamente monótona en un intervalo $[a, b]$ es biyectiva sobre $[f(a), f(b)]$.

  - **Reflexión invertible**: Su gráfica puede reflejarse sobre $y = x$ dando otra función válida.'
ejemplo_guiado:
  enunciado: '![Ejemplo El reconocimiento gráfico de una función biyectiva establece que toda recta horizontal trazada a la altura de cualquier elemento del codominio $B$ debe cortar a la gráfica en exactamente un punto](/static/img/nodos/reconocimiento-de-funcion-biyectiva-ejemplos.svg)



    Determina si la gráfica de $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = 2x + 6$ es biyectiva mediante el criterio de corte horizontal.'
  pasos:
  - 'Paso 1: Observar que la gráfica es una recta con pendiente $m = 2 > 0$.'
  - 'Paso 2: Tomar una altura cualquiera $y_0 \in \mathbb{R}$ y trazar la recta horizontal $y = y_0$.'
  - 'Paso 3: Resolver $2x + 6 = y_0 \implies x = \frac{y_0 - 6}{2}$ (solución real única).'
  - 'Paso 4: Constatar que para cualquier $y_0 \in \mathbb{R}$ la recta horizontal corta en exactamente un punto $\left(\frac{y_0 - 6}{2}, y_0\right)$.'
  - 'Paso 5: Concluir que $f$ es biyectiva en $\mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántas veces debe cortar toda recta horizontal dentro del codominio B para que la función sea biyectiva?
  choices:
  - text: Exactamente en 1 punto.
    is_correct: true
  - text: En 2 o mas puntos.
    is_correct: false
  - text: En a lo mas 2 puntos.
    is_correct: false
  - text: En 0 puntos.
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente en 1 punto.'. Combina inyectividad (<=1) y sobreyectividad (>=1).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué tipo de rectas en el plano cartesiano representan siempre funciones biyectivas de $\mathbb{R}$ en $\mathbb{R}$?
  choices:
  - text: Cualquier recta oblicua (no horizontal ni vertical, m != 0).
    is_correct: true
  - text: Las rectas horizontales y = c.
    is_correct: false
  - text: Las rectas verticales x = k.
    is_correct: false
  - text: Solo las que pasan por el origen.
    is_correct: false
  explanation: La alternativa correcta es 'Cualquier recta oblicua (no horizontal ni vertical, m != 0).'. Poseen $m \neq 0$ y cubren todo $\mathbb{R}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Delimitar el codominio $B$ en el eje vertical $Y$.'
- 'Paso 2: Trazar rectas horizontales imaginarias a través de todo el rango de $B$.'
- 'Paso 3: Verificar que cada recta horizontal corte a la curva en exactamente un punto.'
- 'Paso 4: Concluir la biyectividad de la función.'
errores_correccion: '- **Error común:** Confundir la prueba de biyectividad con la prueba de existencia de función (recta vertical).

  - **Cómo corregirlo:** La recta **vertical** evalúa si es función; la recta **horizontal en $B$ con corte único** evalúa si es **biyectiva**.'
ejemplos:
- titulo: 'Ejemplo 1: Función afín'
  enunciado: '¿Es biyectiva $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = -x + 5$?'
  alternativas:
  - Sí, toda recta horizontal en R la corta en exactamente un punto
  - No, porque la pendiente es negativa
  - No, porque corta al eje Y en 5
  - Solo en el origen
  respuesta: Sí, toda recta horizontal en R la corta en exactamente un punto
  solucion_pasos:
  - 'Paso 1: Es una recta oblicua continua, luego corta exactamente una vez a toda horizontal.'
- titulo: 'Ejemplo 2: Parábola en R'
  enunciado: La gráfica de $y = x^2$ en $\mathbb{R} \to \mathbb{R}$ corta a $y = 4$ en 2 puntos y a $y = -1$ en 0 puntos. ¿Es biyectiva?
  alternativas:
  - No, no cumple el criterio de corte único
  - Sí, porque es simétrica
  - Solo para x > 0
  - Solo para x < 0
  respuesta: No, no cumple el criterio de corte único
  solucion_pasos:
  - 'Paso 1: Falla tanto el número máximo como el mínimo de cortes, no es biyectiva.'
- titulo: 'Ejemplo 3: Rama de parábola'
  enunciado: 'Para $f: [0, +\infty[ \to [0, +\infty[$ con $f(x) = x^2$, ¿es biyectiva?'
  alternativas:
  - Sí, cada horizontal y >= 0 corta exactamente 1 vez a la rama derecha
  - No, las parábolas nunca son biyectivas
  - Solo en x = 0
  - Solo para enteros
  respuesta: Sí, cada horizontal y >= 0 corta exactamente 1 vez a la rama derecha
  solucion_pasos:
  - 'Paso 1: En el dominio restringido, cada nivel $y \ge 0$ tiene una única preimagen $x = \sqrt{y}$.'
- titulo: 'Ejemplo 4: Función cúbica canónica'
  enunciado: ¿Es $f(x) = x^3$ biyectiva en $\mathbb{R} \to \mathbb{R}$?
  alternativas:
  - Sí, es estrictamente creciente y corta exactamente 1 vez a toda horizontal
  - No, porque tiene un punto de inflexión en (0, 0)
  - Solo para positivos
  - Solo para negativos
  respuesta: Sí, es estrictamente creciente y corta exactamente 1 vez a toda horizontal
  solucion_pasos:
  - 'Paso 1: Toda horizontal $y = c$ intersecta en el único punto $(\sqrt[3]{c}, c)$.'
errores_frecuentes:
- No verificar la unicidad del corte.
- Evaluar rectas fuera del codominio declarado.
- Confundir la prueba de biyectividad con la de inyectividad pura.
afirmaciones_verdaderas:
- Una función es biyectiva si y solo si toda recta horizontal en su codominio corta a la gráfica exactamente una vez.
- Toda recta oblicua y = mx + n con m != 0 es una función biyectiva de R en R.
al_terminar_debes_poder: '**QUÉ:** Reconocer funciones biyectivas a partir de su comportamiento gráfico.


  **CÓMO:** Comprobando el criterio de intersección única con cualquier recta horizontal dentro del codominio B.


  ![Resumen El reconocimiento gráfico de una función biyectiva establece que toda recta horizontal trazada a la altura de cualquier elemento del codominio $B$ debe cortar a la gráfica en exactamente un punto](/static/img/nodos/reconocimiento-de-funcion-biyectiva-resumen.svg)'
