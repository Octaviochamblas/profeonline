semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.BIYECTIVA_RECONOCIMIENTO
resumen_inicial: 'Reconocimiento de función biyectiva: conceptos, representación y
  propiedades en Tipos de funciones y función inversa.'
explicacion_simple: Reconocer una biyección exige pasar dos pruebas seguidas; si falla
  cualquiera de las dos, ya no hay biyección.
explicacion_formal: '### Definición formal


  Dada $f\colon A \to B$, se determina inyectividad verificando que toda recta horizontal
  corte la gráfica en a lo más un punto, y sobreyectividad verificando que toda recta
  horizontal corte la gráfica en al menos un punto. Si ambas condiciones se cumplen
  para todo $y \in B$, cada recta horizontal corta la gráfica en exactamente un punto,
  y $f$ es biyectiva.


  ### Desarrollo didáctico


  En la práctica, conviene verificar primero la condición más restrictiva o más fácil
  de descartar; si una función ya no es inyectiva, no hace falta seguir revisando
  la sobreyectividad.


  Para $f\colon \mathbb{R} \to \mathbb{R}$, $f(x)=x^3$: cada recta horizontal corta
  la curva exactamente en un punto (ni cero ni dos), confirmando que es biyectiva.'
definiciones_clave: '- **Reconocimiento de función biyectiva**: Elemento central en
  el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a reconocimiento de función biyectiva.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a reconocimiento de
    función biyectiva.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a reconocimiento de función biyectiva.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
