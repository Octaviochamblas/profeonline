semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.BIYECTIVA_RECONOCIMIENTO
resumen_inicial: Reconocer una función biyectiva implica identificar visual o algebraicamente la coincidencia entre la inyectividad y la sobreyectividad.
explicacion_simple: |
  Para **reconocer si una función es biyectiva**:

  1. **En un gráfico**: Toda línea horizontal debe cruzar a la curva **exactamente una vez** (no cero veces, ni dos veces).
  2. **En un diagrama de flechas**: De cada elemento de la izquierda sale 1 flecha, y a cada elemento de la derecha llega **exactamente 1 flecha**.
  3. **En álgebra**: La función afín $f(x) = mx + b$ ($m \neq 0$) definida de $\mathbb{R} \to \mathbb{R}$ es **SIEMPRE BIYECTIVA**.
explicacion_formal: |
  Dada la función $f: A \to B$, el **reconocimiento de biyectividad** exige verificar de forma analítica o gráfica la validez simultánea de:

  1. **Inyectividad**: $\deg^+(y) \le 1, \quad \forall y \in B$
  2. **Sobreyectividad**: $\deg^+(y) \ge 1, \quad \forall y \in B$
  3. **Biyectividad**: $\deg^+(y) = 1, \quad \forall y \in B$

  donde $\deg^+(y)$ es el número de preimágenes del elemento $y$.
definiciones_clave: |
  - **Reconocimiento de biyectividad**: Comprobación del cumplimiento simultáneo de las pruebas de inyectividad y sobreyectividad en representaciones gráficas o algebraicas.
propiedades_relaciones: |
  - **Funciones polinómicas de grado impar**: Las funciones estrictamente monótonas de grado impar como $f(x) = x^3$ son biyectivas de $\mathbb{R} \to \mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Reconoce si las siguientes funciones definidas de $\mathbb{R} \to \mathbb{R}$ son biyectivas: a) $f(x) = -3x + 2$, b) $g(x) = x^2 - 4$.'
  pasos:
    - 'Paso 1: Analizar $f(x) = -3x + 2$: es una función afín con $m = -3 \neq 0 \implies$ es inyectiva y sobreyectiva en $\mathbb{R} \implies f$ es biyectiva.'
    - 'Paso 2: Analizar $g(x) = x^2 - 4$: es una parábola. Una línea horizontal $y = 0$ la corta en dos puntos $x = 2$ y $x = -2$ (no inyectiva) y no toma valores menores a $-4$ (no sobreyectiva).'
    - 'Paso 3: Concluir que $f$ SÍ es biyectiva y $g$ NO es biyectiva en $\mathbb{R}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes funciones definidas de $\mathbb{R} \to \mathbb{R}$ es BIYECTIVA?'
    choices:
      - {text: '$f(x) = -3x + 2$', is_correct: true}
      - {text: '$g(x) = x^2 - 4$', is_correct: false}
      - {text: '$h(x) = 5$', is_correct: false}
      - {text: '$k(x) = |x|$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = -3x + 2$''. Toda función afín no horizontal en $\mathbb{R} \to \mathbb{R}$ es biyectiva.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En un diagrama sagital, ¿cómo se reconoce visualmente una función biyectiva?'
    choices:
      - {text: 'A cada elemento del conjunto de llegada llega exactamente una sola flecha.', is_correct: true}
      - {text: 'A algunos elementos del conjunto de llegada llegan 3 flechas.', is_correct: false}
      - {text: 'Sobran elementos sin flechas en el conjunto de llegada.', is_correct: false}
      - {text: 'Del conjunto de partida salen 2 flechas por elemento.', is_correct: false}
    explanation: 'La alternativa correcta es ''A cada elemento del conjunto de llegada llega exactamente una sola flecha.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Verificar que no existan dos o más preimágenes para una misma imagen (inyectividad).'
  - 'Paso 2: Verificar que todo el conjunto de llegada contenga imágenes asignadas (sobreyectividad).'
  - 'Paso 3: Validar que en el gráfico cada recta horizontal intersecte a la curva en exactamente un punto.'
  - 'Paso 4: Declarar si la función es o no biyectiva.'
errores_correccion: |
  - **Error común:** Pensar que la función constante $f(x) = c$ es biyectiva.
  - **Cómo corregirlo:** La función constante NO es inyectiva (todas las entradas dan el mismo número) ni sobreyectiva (solo cubre un valor del codominio).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función biyectiva.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función biyectiva.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Toda función polinómica de grado par es siempre biyectiva en el dominio de los números reales.'
  - 'La función constante $f(x) = 7$ es biyectiva porque no cambia de valor.'
  - 'Una recta horizontal corta a la gráfica de una función biyectiva en dos o más puntos distintos.'
  - 'Reconocer una función biyectiva requiere únicamente evaluar si su pendiente es positiva.'
  - 'En un diagrama sagital biyectivo pueden existir elementos en el conjunto de llegada que no reciban ninguna flecha.'
afirmaciones_verdaderas:
  - 'Una función $f: A \to B$ es biyectiva si cada elemento de $B$ es imagen de exactamente un único elemento de $A$.'
  - 'Las funciones afines de la forma $f(x) = mx + b$ con $m \neq 0$ definidas de $\mathbb{R} \to \mathbb{R}$ son siempre biyectivas.'
al_terminar_debes_poder: |
  QUÉ: Reconocer e identificar funciones biyectivas en representaciones algebraicas, gráficas y tabulares.
  CÓMO: Comprobar la intersección de una sola vez con rectas horizontales y validar la igualdad $\text{Rec}(f) = \text{Codom}(f)$.
fuente: 'Texto escolar MINEDUC — Álgebra / Tipos de Funciones y Función Inversa'
