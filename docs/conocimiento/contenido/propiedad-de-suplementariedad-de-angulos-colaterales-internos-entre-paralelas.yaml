semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.COLATERALES_INTERNOS_SUPLEMENTARIOS
resumen_inicial: Si dos rectas paralelas son cortadas por una transversal, los ángulos
  colaterales internos son suplementarios (suman exactamente 180°).
explicacion_simple: '![Suplementariedad de Colaterales Internos](/static/img/nodos/propiedad-de-suplementariedad-de-angulos-colaterales-internos-entre-paralelas-intro.svg)


  A diferencia de los alternos que son iguales, los dos ángulos interiores que están
  al mismo lado de la secante forman una combinación de uno cerrado (agudo) y uno
  abierto (obtuso). Al juntarlos, completan exactamente una línea recta de 180°.'
explicacion_formal: '### Teorema formal

  Si dos rectas paralelas $L_1$ y $L_2$ son cortadas por una transversal $T$, los
  ángulos colaterales internos son estrictamente **suplementarios** (su suma es igual
  a $180^\circ$):


  $$L_1 \parallel L_2 \implies \alpha + \beta = 180^\circ \quad (\text{Colaterales
  Internos})$$


  ### Desglose simbólico y geométrico

  - Demostración: $\alpha$ es correspondiente con el suplemento adyacente de $\beta$
  sobre la recta inferior.

  - Ecuación de despeje: $\beta = 180^\circ - \alpha$.


  ### Síntesis didáctica

  Este teorema garantiza que en cualquier banda de rectas paralelas cortadas por una
  transversal, la suma de los ángulos interiores del mismo lado siempre totaliza $180^\circ$.'
definiciones_clave: '- **Suplementariedad colateral**: Propiedad fundamental de sumar
  $180^\circ$ para ángulos colaterales en paralelas.

  - **Criterio de paralelismo**: Si dos ángulos colaterales internos suman $180^\circ$,
  entonces las rectas son paralelas. '
propiedades_relaciones: '- **Planteo de ecuaciones suplementarias**: Ecuaciones de
  la forma $\alpha(x) + \beta(x) = 180^\circ$.

  - **Paralelogramos y trapecios**: Esta propiedad explica por qué los ángulos internos
  consecutivos adyacentes a un lado no paralelo en un trapecio suman $180^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Suplementariedad de Colaterales](/static/img/nodos/propiedad-de-suplementariedad-de-angulos-colaterales-internos-entre-paralelas-ejemplos.svg)


    Dos ángulos colaterales internos entre rectas paralelas miden $\alpha = 2x + 10^\circ$
    y $\beta = 3x + 20^\circ$. Determina el valor de $x$ y la medida de cada ángulo.'
  pasos:
  - 'Paso 1: Por teorema de colaterales internos entre paralelas, plantear la suma:
    $(2x + 10^\circ) + (3x + 20^\circ) = 180^\circ$.'
  - 'Paso 2: Reducir términos semejantes: $5x + 30^\circ = 180^\circ$.'
  - 'Paso 3: Despejar $5x = 150^\circ \implies x = 30^\circ$.'
  - 'Paso 4: Calcular $\alpha$: $2(30^\circ) + 10^\circ = 70^\circ$.'
  - 'Paso 5: Calcular $\beta$: $3(30^\circ) + 20^\circ = 110^\circ$. Comprobar: $70^\circ
    + 110^\circ = 180^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto suman dos ángulos colaterales internos entre rectas paralelas?
  choices:
  - text: Exactamente 180° (son suplementarios)
    is_correct: true
  - text: Exactamente 90° (son complementarios)
    is_correct: false
  - text: Exactamente 360°
    is_correct: false
  - text: Son de igual medida siempre
    is_correct: false
  explanation: Por teorema geométrico, suman exactamente 180° (son suplementarios).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo colateral interno mide 58° en rectas paralelas, ¿cuánto mide
    el otro ángulo colateral interno?
  choices:
  - text: 122° (porque 180° - 58° = 122°)
    is_correct: true
  - text: 58°
    is_correct: false
  - text: 32°
    is_correct: false
  - text: 142°
    is_correct: false
  explanation: Por ser suplementarios, 180° - 58° = 122°, por lo que el otro mide
    122° (porque 180° - 58° = 122°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las rectas paralelas $L_1 \parallel L_2$.'
- 'Paso 2: Comprobar que los ángulos son colaterales internos (mismo lado de $T$,
  región interior).'
- 'Paso 3: Plantear la ecuación de suplementariedad $\alpha + \beta = 180^\circ$.'
- 'Paso 4: Resolver la ecuación y verificar la suma.'
errores_correccion: Recuerda que los colaterales internos NO son iguales; su suma
  es 180°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si dos ángulos colaterales internos miden $70^\circ$ y $x$, ¿cuánto vale
    $x$?
  alternativas:
  - $110^\circ$
  - $70^\circ$
  - $20^\circ$
  respuesta: $110^\circ$
  solucion_pasos:
  - $x = 180^\circ - 70^\circ = 110^\circ$.
- titulo: Ejemplo 2
  enunciado: Si los ángulos colaterales internos miden $x$ y $2x$, ¿cuánto vale $x$?
  alternativas:
  - $60^\circ$
  - $90^\circ$
  - $45^\circ$
  respuesta: $60^\circ$
  solucion_pasos:
  - $x + 2x = 180^\circ \implies 3x = 180^\circ \implies x = 60^\circ$.
- titulo: ¿Los ángulos colaterales internos suman 180° si las rectas son paralelas?
  respuesta: Sí
  solucion_pasos:
  - Sí, por teorema euclidiano siempre son suplementarios.
- titulo: ¿Los ángulos colaterales internos siempre son iguales entre sí?
  respuesta: 'No'
  solucion_pasos:
  - No, suman 180°; solo son iguales si ambos miden 90° (rectas perpendiculares).
errores_frecuentes:
- Igualar los dos ángulos colaterales internos entre sí en lugar de sumarlos a $180^\circ$.
- Confundir la propiedad de suplementariedad con la de complementariedad ($90^\circ$).
- Aplicar la propiedad en rectas secantes no paralelas.
- Olvidar agrupar términos semejantes al resolver ecuaciones algebraicas.
- Asumir que uno es siempre el doble del otro sin justificación.
afirmaciones_verdaderas:
- Los ángulos colaterales internos entre paralelas suman exactamente $180^\circ$.
- Si dos ángulos colaterales internos son suplementarios, las rectas son paralelas.
al_terminar_debes_poder: '**QUÉ:** Aplicar la suplementariedad de ángulos colaterales
  internos para calcular medidas angulares y resolver ecuaciones.


  **CÓMO:** Formulando la ecuación $\alpha + \beta = 180^\circ$ bajo la condición
  de paralelismo $L_1 \parallel L_2$.


  ![Resumen de Suplementariedad de Colaterales Internos](/static/img/nodos/propiedad-de-suplementariedad-de-angulos-colaterales-internos-entre-paralelas-resumen.svg)'
