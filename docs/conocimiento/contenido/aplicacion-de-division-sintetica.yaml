semantic_id: MAT.ALG.TEOREMA_FACTOR.DIVISION_SINTETICA
resumen_inicial: 'Aplicación de división sintética: concepto, método de descomposición
  y reglas en Teorema del factor y división sintética.'
explicacion_simple: Hemos descubierto que si $(x-c)$ es un factor, podemos "sacarlo"
  del polinomio. ¿Pero cómo lo extraemos matemáticamente para ver qué queda de residuo?
  En lugar de hacer una división larga y tediosa con 'x' por todas partes, Paolo Ruffini
  nos legó un método sintético y veloz que solo usa los números.
explicacion_formal: '### Definición formal


  Dado $P(x) = a_nx^n + \dots + a_1x + a_0$ y un divisor lineal $(x-c)$, la división
  sintética calcula los coeficientes $b_{n-1}, b_{n-2}, \dots, b_0$ del polinomio
  cociente y el resto $r$ mediante la recurrencia $b_{n-1}=a_n$, $b_{k-1} = a_k +
  c \cdot b_k$ para $k=n-1,\dots,0$, donde el último valor obtenido es el resto $r
  = P(c)$.


  ### Desarrollo didáctico


  Vamos a dividir $2x^3 - 3x^2 - 4x + 5$ entre $(x - 2)$.

  La ''raíz'' de $(x-2)$ es $2$. Ese será nuestro valor de referencia (lo ponemos
  a la izquierda de una línea vertical).


  Escribimos solo los coeficientes en fila:  `2  -3  -4   5`


  Pasos del algoritmo:

  1. Bajar el primer número directo: Baja el `2`.

  2. Multiplicar por la raíz: $2 \times 2 = 4$. Lo ponemos debajo del siguiente número
  ($-3$).

  3. Sumar la columna: $-3 + 4 = 1$. (Tenemos nuestro nuevo número abajo).

  4. Repetir: Multiplicar $1 \times 2 = 2$. Lo ponemos debajo del $-4$.

  5. Sumar columna: $-4 + 2 = -2$.

  6. Repetir: Multiplicar $-2 \times 2 = -4$. Lo ponemos debajo del $5$.

  7. Sumar columna: $5 - 4 = 1$.


  Nuestra fila inferior final es: `2   1  -2  |  1`

  ¿Qué significa? El último número ($1$) es el resto. (Como el resto no es 0, $(x-2)$
  no era factor exacto).

  Los números anteriores `2, 1, -2` son los coeficientes del polinomio respuesta,
  reducidos en un grado (eran grado 3, ahora son grado 2): $2x^2 + 1x - 2$.'
definiciones_clave: '- **Aplicación de división sintética**: Técnica de factorización
  para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en aplicación de división sintética.'
