resumen_inicial: La división sintética es un método abreviado para dividir un polinomio
  $P(x)$ por un divisor de la forma $(x - c)$ utilizando únicamente sus coeficientes
  numéricos.
explicacion_simple: Es un procedimiento rápido para dividir polinomios sin escribir
  las variables. Se disponen los coeficientes en una tabla, se baja el primer término,
  se multiplica por la raíz $c$ y se suma con el siguiente coeficiente.
explicacion_formal: 'Sea $P(x) = a_n x^n + a_{n-1} x^{n-1} + \dots + a_1 x + a_0$
  con $a_n \neq 0$.


  La **División Sintética** (o Esquema de Ruffini) determina el cociente $Q(x) = b_{n-1}
  x^{n-1} + \dots + b_0$ y el resto $R$ al dividir por $(x - c)$ mediante la relación
  recursiva de coeficientes:


  $$b_{n-1} = a_n$$

  $$b_k = a_{k+1} + c \cdot b_{k+1} \quad \text{para } k = n-2, n-3, \dots, 0$$

  $$R = a_0 + c \cdot b_0$$


  **Requisito de Estructura:** El polinomio dividendo debe escribirse en orden descendente
  estricto de potencias, completando con coeficiente $0$ cualquier término ausente.'
definiciones_clave: '- **División Sintética**: Algoritmo numérico condensado para
  la división de polinomios entre binomios lineales de la forma $(x - c)$.

  - **Coeficientes del cociente**: Los valores numéricos obtenidos en la fila inferior
  de la tabla antes del último término.'
propiedades_relaciones: '- **Eficiencia algorítmica**: Reduce significativamente las
  operaciones algebraicas al eliminar el manejo explícito de exponentes y variables
  durante la división.'
ejemplo_guiado:
  enunciado: Use división sintética para dividir $P(x) = 2x^3 - 7x^2 + 5$ por $(x
    - 3)$.
  pasos:
  - 'Paso 1: Ordenar y completar $P(x)$ con término de grado 1: $P(x) = 2x^3 - 7x^2
    + 0x + 5$. Coeficientes: $[2, -7, 0, 5]$. Raíz $c = 3$.'
  - 'Paso 2: Disponer la tabla. Bajar el primer coeficiente $2$.'
  - 'Paso 3: Multiplicar $2 \cdot 3 = 6$. Sumar con $-7$: $-7 + 6 = -1$.'
  - 'Paso 4: Multiplicar $-1 \cdot 3 = -3$. Sumar con $0$: $0 + (-3) = -3$.'
  - 'Paso 5: Multiplicar $-3 \cdot 3 = -9$. Sumar con $5$: $5 + (-9) = -4$.'
  - 'Paso 6: Concluir que el cociente es $Q(x) = 2x^2 - x - 3$ y el residuo es $R
    = -4$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al dividir $x^3 - 2x^2 + 4x - 8$ por $(x - 2)$ usando división sintética,
    ¿cuál es el resto $R$?
  choices:
  - text: $R = 0$
    is_correct: true
  - text: $R = 4$
    is_correct: false
  - text: $R = -8$
    is_correct: false
  - text: $R = 12$
    is_correct: false
  explanation: 'Coeficientes: $[1, -2, 4, -8]$, $c = 2$. Bajar 1. Multiplicar $1 \cdot
    2 = 2 \implies -2 + 2 = 0$. Multiplicar $0 \cdot 2 = 0 \implies 4 + 0 = 4$. Multiplicar
    $4 \cdot 2 = 8 \implies -8 + 8 = 0$. Se concluye que $R = 0$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué paso es fundamental realizar en los coeficientes del dividendo antes
    de iniciar la división sintética?
  choices:
  - text: Completar los términos faltantes con coeficientes iguales a cero
    is_correct: true
  - text: Cambiar el signo a todos los coeficientes del dividendo
    is_correct: false
  - text: Dividir todos los coeficientes por el primer término constante
    is_correct: false
  - text: Ordenar el polinomio de menor a mayor grado de exponente
    is_correct: false
  explanation: Para evitar desalineación de potencias, la regla fundamental es Completar
    los términos faltantes con coeficientes iguales a cero.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el polinomio dividendo en orden decreciente de grado, agregando
  $0$ en los términos faltantes.'
- 'Paso 2: Colocar los coeficientes en una fila y la raíz $c$ del divisor $(x - c)$
  a la izquierda.'
- 'Paso 3: Bajar el coeficiente líder $a_n$ a la fila inferior.'
- 'Paso 4: Multiplicar el valor inferior por $c$, escribir la respuesta bajo el siguiente
  coeficiente y sumar verticalmente de forma iterativa.'
errores_correccion: '- **Error 1: Omitir la inserción de ceros en grados faltantes
  del dividendo.** **Cómo corregirlo:** Escribir explícitamente $0$ para todo exponente
  ausente antes de armar la tabla.'
ejemplos:
- titulo: División de un polinomio incompleto
  enunciado: Divida $x^3 - 8$ por $(x - 2)$ mediante división sintética.
  respuesta: Cociente $Q(x) = x^2 + 2x + 4$, Residuo $R = 0$.
  solucion_pasos:
  - '1. Coeficientes completados: $[1, 0, 0, -8]$, raíz $c = 2$.'
  - '2. Operación de tabla: Fila inferior $[1, 2, 4, 0]$.'
  - 3. Cociente $Q(x) = x^2 + 2x + 4$ y $R = 0$.
- titulo: ¿Es aplicable la división sintética si el divisor es de segundo grado $(x^2
    - 1)$?
  respuesta: No directamente
  solucion_pasos:
  - No directamente; la división sintética estándar requiere divisores lineales de
    primer grado de la forma $(x - c)$.
- titulo: ¿El grado del polinomio cociente es un grado menor que el polinomio dividendo?
  respuesta: Sí
  solucion_pasos:
  - Sí, al dividir un polinomio de grado $n$ por un binomio lineal, el cociente siempre
    resulta de grado $n - 1$.
errores_frecuentes:
- Ausencia del coeficiente $0$ en potencias intermedias no presentes en el dividendo
  original.
- Empleo de $-c$ en la estructura cuando el divisor lineal presenta la forma $(x -
  c)$.
- Resta en las columnas verticales en lugar de realizar sumas algebraicas directas.
- Conservación del mismo grado del dividendo en el polinomio cociente resultante.
- Disposición de coeficientes en orden incompleto o ascendente de exponentes.
afirmaciones_verdaderas:
- La división sintética solo se aplica directamente cuando el divisor es un binomio
  lineal de la forma $(x - c)$.
- El grado del cociente obtenido mediante división sintética es siempre $n - 1$, siendo
  $n$ el grado del dividendo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la división sintética
  para hallar rápidamente el cociente y el resto al dividir polinomios por binomios
  lineales.
