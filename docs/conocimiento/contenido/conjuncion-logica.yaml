semantic_id: MAT.FUND.CONECTIVOS_LOGICOS.CONJUNCION
resumen_inicial: 'Definición, tabla de verdad y propiedades de la conjunción lógica ($p \land q$), que es verdadera únicamente cuando ambas proposiciones son verdaderas.'
explicacion_simple: |
  La **conjunción** es el conectivo lógico que une dos afirmaciones con la palabra "y" (en símbolos: **$p \land q$**). Funciona con una regla muy estricta: para que la frase completa sea **Verdadera**, **ambas partes deben ser verdaderas al mismo tiempo**. Si al menos una de las dos partes es falsa, toda la conjunción se vuelve **Falsa**. Por ejemplo, si te dicen "Tengo un lápiz y tengo un cuaderno", la frase solo es verdad si realmente tienes las dos cosas.

  ![Introducción didáctica: Conjunción lógica](/static/img/nodos/conjuncion-logica-intro.svg)
explicacion_formal: |
  ### Definición formal
  En el cálculo proposicional, la **conjunción lógica** es un operador binario $\land: \mathcal{P} \times \mathcal{P} \to \mathcal{P}$ definido por la función veritativa booleana de producto lógico $f_\land: \{V, F\}^2 \to \{V, F\}$ tal que:
  $$v(p \land q) = \begin{cases} V & \text{si } v(p) = V \text{ y } v(q) = V \\ F & \text{en cualquier otro caso} \end{cases}$$
  En álgebra booleana sobre $\{0, 1\}$, se expresa como el producto aritmético: $v(p \land q) = v(p) \cdot v(q) = \min(v(p), v(q))$.

  ### Desglose simbólico
  - Símbolos equivalentes: $p \land q$, $p \cdot q$, $p \ \& \ q$.
  - Tabla de verdad canónica:
    $$\begin{array}{|c|c|c|} \hline p & q & p \land q \\ \hline V & V & V \\ V & F & F \\ F & V & F \\ F & F & F \\ \hline \end{array}$$
  - Propiedad de Idempotencia: $p \land p \equiv p$.
  - Propiedad Conmutativa: $p \land q \equiv q \land p$.
  - Propiedad Asociativa: $(p \land q) \land r \equiv p \land (q \land r)$.

  ### Síntesis didáctica
  La conjunción actúa como un filtro simultáneo exigente: basta que uno de los componentes atómicos sea falso ($F$) para que toda la expresión resulte falsa.
definiciones_clave: |
  - **Conjunción lógica ($p \land q$)**: Conectivo binario que produce valor verdadero si y solo si ambos operandos son verdaderos.
  - **Operador conjuntor ($\land$)**: Símbolo matemático que formaliza partículas como "y", "pero", "además", "sin embargo", "aunque".
  - **Neutro de la conjunción**: La constante tautológica $V$ actúa como elemento neutro ($p \land V \equiv p$).
propiedades_relaciones: |
  - **Elemento absorbente**: La falsedad $F$ es el elemento absorbente de la conjunción ($p \land F \equiv F$).
  - **Dualidad con la disyunción**: Por las Leyes de De Morgan, $\neg(p \land q) \equiv \neg p \lor \neg q$.
ejemplo_guiado:
  enunciado: |
    Sean las proposiciones $p$: "$8$ es un número par" y $q$: "$8$ es menor que $5$". Determina el valor de verdad de la conjunción $p \land q$.

    ![Ejemplos prácticos: Conjunción lógica](/static/img/nodos/conjuncion-logica-ejemplos.svg)
  pasos:
    - 'Paso 1: Evaluar el valor de verdad de $p$: Como $8 = 2 \times 4$, el $8$ es par, por lo tanto $v(p) = V$.'
    - 'Paso 2: Evaluar el valor de verdad de $q$: Como $8 > 5$, la afirmación $8 < 5$ es falsa, por lo tanto $v(q) = F$.'
    - 'Paso 3: Aplicar la tabla de verdad de la conjunción: $v(p \land q) = v(V \land F)$.'
    - 'Paso 4: Concluir el resultado: Dado que uno de los componentes es falso, el valor de verdad final es $v(p \land q) = F$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En cuál de las siguientes combinaciones la conjunción $p \land q$ resulta Verdadera ($V$)?'
    choices:
      - {text: 'Cuando $v(p) = V$ y $v(q) = V$', is_correct: true}
      - {text: 'Cuando $v(p) = V$ y $v(q) = F$', is_correct: false}
      - {text: 'Cuando $v(p) = F$ y $v(q) = V$', is_correct: false}
      - {text: 'Cuando $v(p) = F$ y $v(q) = F$', is_correct: false}
    explanation: 'La alternativa correcta es ''Cuando $v(p) = V$ y $v(q) = V$''. La conjunción exige simultaneidad de verdad en ambos operandos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la proposición $p \land q$ es verdadera, ¿qué se puede deducir necesariamente sobre $p$ y $q$?'
    choices:
      - {text: 'Que ambas proposiciones $p$ y $q$ son verdaderas', is_correct: true}
      - {text: 'Que al menos una de las dos proposiciones es falsa', is_correct: false}
      - {text: 'Que $p$ es verdadera y $q$ es falsa', is_correct: false}
      - {text: 'Que ninguna de las dos proposiciones tiene valor de verdad', is_correct: false}
    explanation: 'La alternativa correcta es ''Que ambas proposiciones $p$ y $q$ son verdaderas''. La única fila donde $p \land q$ es $V$ ocurre cuando tanto $p$ como $q$ son $V$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos proposiciones que componen la conjunción ($p$ y $q$).'
  - 'Paso 2: Evaluar individualmente el valor de verdad de $p$ y de $q$.'
  - 'Paso 3: Si ambos valores son $V$, asignar $V$ a la conjunción $p \land q$.'
  - 'Paso 4: Si al menos uno de los valores es $F$, asignar $F$ a la conjunción.'
errores_correccion: |
  - **Error 1:** Afirmar que una conjunción es verdadera si al menos una de las dos partes es verdadera. **Cómo corregirlo:** La condición de "al menos una verdadera" corresponde a la disyunción inclusiva ($\lor$); la conjunción ($\land$) exige rigurosamente que ambas partes sean verdaderas.
  - **Error 2:** Creer que palabras adversativas como "pero" o "sin embargo" no representan conjunciones. **Cómo corregirlo:** En la lógica formal, partículas como "pero", "sin embargo" o "además" cumplen la función semántica exacta de la conjunción ($\land$).
ejemplos:
  - titulo: 'Conjunción en aritmética'
    enunciado: '¿Cuál es el valor de verdad de "$2 < 5 \land 10 > 3$"?'
    alternativas:
      - 'Verdadero ($V$)'
      - 'Falso ($F$)'
      - 'Indeterminado'
    respuesta: 'Verdadero ($V$)'
    solucion_pasos:
      - '1. $2 < 5$ es $V$.'
      - '2. $10 > 3$ es $V$.'
      - '3. $V \land V = V$.'
  - titulo: 'Conjunción con un operando falso'
    enunciado: '¿Cuál es el valor de verdad de "$4 \text{ es impar} \land 6 \text{ es par}$"?'
    alternativas:
      - 'Falso ($F$)'
      - 'Verdadero ($V$)'
      - 'Nulo'
    respuesta: 'Falso ($F$)'
    solucion_pasos:
      - '1. "$4$ es impar" es $F$.'
      - '2. "$6$ es par" es $V$.'
      - '3. $F \land V = F$.'
  - titulo: 'Conmutatividad de la conjunción'
    enunciado: '¿Es $p \land q$ lógicamente equivalente a $q \land p$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Sí, por la ley conmutativa de la conjunción lógica.'
  - titulo: 'Conjunción con una contradicción'
    enunciado: '¿Cuál es el valor de verdad de $p \land \neg p$?'
    alternativas:
      - 'Falso ($F$)'
      - 'Verdadero ($V$)'
      - 'Depende del valor de $p$'
    respuesta: 'Falso ($F$)'
    solucion_pasos:
      - '1. Es una contradicción universal ($F$) por el principio de no contradicción.'
errores_frecuentes:
  - 'La afirmación de que una conjunción resulta verdadera cuando solo una de sus proposiciones componentes es verdadera.'
  - 'La afirmación de que la palabra "pero" se formaliza lógicamente con una disyunción.'
  - 'La afirmación de que la tabla de verdad de la conjunción contiene tres combinaciones verdaderas y una falsa.'
  - 'La afirmación de que la conjunción $p \land q$ no cumple la propiedad conmutativa.'
  - 'La afirmación de que la fórmula $p \land \neg p$ puede ser verdadera si $p$ es una proposición compuesta.'
afirmaciones_verdaderas:
  - 'La conjunción lógica $p \land q$ es verdadera únicamente cuando ambas proposiciones componentes $p$ y $q$ son simultáneamente verdaderas.'
  - 'La conjunción cumple las propiedades algebraica de conmutatividad ($p \land q \equiv q \land p$), asociatividad e idempotencia ($p \land p \equiv p$).'
al_terminar_debes_poder: |
  QUÉ: Definir, evaluar y formalizar la conjunción lógica ($p \land q$).
  CÓMO: Aplicar la regla de verdad simultánea ($V \land V = V$) y traducir términos como "y", "pero" y "además" al operador $\land$.

  ![Cuadro resumen: Conjunción lógica](/static/img/nodos/conjuncion-logica-resumen.svg)
