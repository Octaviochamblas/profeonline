resumen_inicial: 'Identificación de ternas pitagóricas básicas: (3, 4, 5), (5, 12,
  13), (8, 15, 17): conceptos, teoremas, propiedades geométricas y cálculo en Perímetros,
  Áreas y Teoremas.'
explicacion_simple: Algunos conjuntos de tres números enteros aparecen una y otra
  vez como lados de triángulos rectángulos; memorizar los más comunes agiliza mucho
  la resolución de problemas.
explicacion_formal: '![Terna pitagórica 3-4-5](/static/img/geometria/areas-pitagoras/pitagoras-ternas.svg)


  ### Definición formal


  Una terna pitagórica $(a,b,c)$ cumple $a^2+b^2=c^2$ con $a$, $b$, $c$ enteros positivos.
  Las básicas son (3,4,5), (5,12,13) y (8,15,17), y cualquier múltiplo entero de ellas
  (como 6,8,10) también es una terna pitagórica válida.


  ### Desarrollo didáctico


  Verificar (5,12,13): $5^2+12^2=25+144=169=13^2$. Al multiplicar por 2 se obtiene
  la terna (10,24,26), que también cumple: $10^2+24^2=100+576=676=26^2$.'
