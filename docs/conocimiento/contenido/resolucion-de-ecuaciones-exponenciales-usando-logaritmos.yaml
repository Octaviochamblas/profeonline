semantic_id: MAT.ALG.RELACION_EXP_LOG.RESOLUCION_EXP_LOGARITMOS
resumen_inicial: La resolución de ecuaciones exponenciales usando logaritmos constituye el método general para resolver ecuaciones $a^{f(x)} = b^{g(x)}$ donde las bases no pueden igualarse algebraicamente, aplicando logaritmos naturales $\ln$ a ambos miembros para linealizar los exponentes.
explicacion_simple: "![La resolución de ecuaciones exponenciales usando logaritmos constituye el método general para resolver ecuaciones $a^{f(x)} = b^{g(x)}$ donde las bases no pueden igualarse algebraicamente, aplicando logaritmos naturales $\\ln$ a ambos miembros para linealizar los exponentes](/static/img/nodos/resolucion-de-ecuaciones-exponenciales-usando-logaritmos-intro.svg)\n\n\n¿Qué haces si te piden resolver $2^x = 7$? ¡El 7 no es potencia de 2 ($2^2 = 4, 2^3 = 8$)!\n\n**El método universal de los logaritmos:**\n1. **Aplica $\\ln$ (logaritmo natural) a ambos lados de la ecuación:**\n   $$\\ln(2^x) = \\ln(7)$$\n2. **Baja el exponente multiplicando al frente (regla del sombrero):**\n   $$x \\cdot \\ln(2) = \\ln(7)$$\n3. **Despeja la incógnita $x$:**\n   $$x = \\frac{\\ln(7)}{\\ln(2)} \\approx \\frac{1{,}9459}{0{,}6931} \\approx \\mathbf{2{,}807}$$\n- ¡Este método resuelve ABSOLUTAMENTE CUALQUIER ecuación exponencial del universo!"
explicacion_formal: 'Sean $a, b \in \mathbb{R}^+ \setminus \{1\}$ y sean $f, g: \mathbb{R} \to \mathbb{R}$ funciones afines. Dada la ecuación trascendente:

  $$a^{f(x)} = b^{g(x)}$$

  Aplicando el isomorfismo logarítmico $\ln: \mathbb{R}^+ \to \mathbb{R}$ a ambos miembros:

  $$\ln\left(a^{f(x)}\right) = \ln\left(b^{g(x)}\right)$$

  Por la propiedad del logaritmo de una potencia:

  $$f(x) \cdot \ln(a) = g(x) \cdot \ln(b)$$

  Al ser $\ln(a)$ y $\ln(b)$ constantes reales no nulas, la ecuación trascendente queda transformada en una **ecuación polinómica lineal estándar en $x$**:

  $$x \cdot [f''(x)\ln(a) - g''(x)\ln(b)] = g(0)\ln(b) - f(0)\ln(a)$$'
definiciones_clave: '- **Linealización logarítmica**: Transformación de una igualdad de potencias en una ecuación lineal mediante logaritmos.

  - **Solución exacta vs aproximada**: Expresión analítica con cocientes de $\ln$ frente a su aproximación decimal.'
propiedades_relaciones: '- **Invarianza de base logarítmica**: Se obtiene idéntico resultado usando $\ln$ o $\log_{10}$ gracias a la fórmula de cambio de base: $\frac{\ln(A)}{\ln(B)} = \frac{\log(A)}{\log(B)}$.

  - **Cuidado con la distribución**: En $(x + 1)\ln(3)$, se debe distribuir: $x\ln(3) + \ln(3)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de ecuaciones exponenciales usando logaritmos constituye el método general para resolver ecuaciones $a^{f(x)} = b^{g(x)}$ donde las bases no pueden igualarse algebraicamente, aplicando logaritmos naturales $\ln$ a ambos miembros para linealizar los exponentes](/static/img/nodos/resolucion-de-ecuaciones-exponenciales-usando-logaritmos-ejemplos.svg)



    Resuelve algebraicamente las siguientes ecuaciones exponenciales dando su valor exacto y aproximado:

    1) $5^x = 18$

    2) $2^{x + 1} = 3^{x - 1}$'
  pasos:
  - 'Paso 1: Para $5^x = 18$:

    - Aplicar $\ln$: $\ln(5^x) = \ln(18) \implies x \ln(5) = \ln(18)$.

    - Despejar: **$x = \frac{\ln(18)}{\ln(5)} \approx 1{,}796$**.'
  - 'Paso 2: Para $2^{x + 1} = 3^{x - 1}$:

    - Aplicar $\ln$: $(x + 1)\ln(2) = (x - 1)\ln(3)$.

    - Distribuir: $x\ln(2) + \ln(2) = x\ln(3) - \ln(3)$.

    - Agrupar términos con $x$: $\ln(2) + \ln(3) = x\ln(3) - x\ln(2)$.

    - Factorizar $x$: $\ln(6) = x(\ln(3) - \ln(2)) = x\ln(3/2)$.

    - Despejar: **$x = \frac{\ln(6)}{\ln(1{,}5)} \approx 4{,}419$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la solución exacta de la ecuación $3^x = 20$?
  choices:
  - text: x = ln(20) / ln(3)
    is_correct: true
  - text: x = ln(20) - ln(3)
    is_correct: false
  - text: x = 20/3
    is_correct: false
  - text: x = ln(20/3)
    is_correct: false
  explanation: 'La alternativa correcta es ''x = ln(20) / ln(3)''. Al aplicar logaritmo natural: $x \ln(3) = \ln(20) \implies x = \frac{\ln(20)}{\ln(3)}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué no se debe simplificar $\frac{\ln(8)}{\ln(2)}$ como $\ln(4)$?
  choices:
  - text: Porque el cociente de logaritmos no es el logaritmo del cociente (ln(8)/ln(2) = 3)
    is_correct: true
  - text: Porque da 4
    is_correct: false
  - text: Porque 8 no es divisible por 2
    is_correct: false
  - text: Porque ln solo se usa con e
    is_correct: false
  explanation: La alternativa correcta es 'Porque el cociente de logaritmos no es el logaritmo del cociente (ln(8)/ln(2) = 3)'. $\frac{\ln(8)}{\ln(2)} = \log_2(8) = 3$, mientras que $\ln(4) \approx 1{,}386$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar los términos exponenciales en los miembros de la igualdad.'
- 'Paso 2: Aplicar el logaritmo natural $\ln$ (o decimal) a ambos miembros.'
- 'Paso 3: Bajar los exponentes multiplicando al frente mediante la propiedad de la potencia.'
- 'Paso 4: Distribuir constantes logarítmicas, agrupar todos los términos con la incógnita $x$ y despejar.'
errores_correccion: '- **Error común:** Olvidar colocar paréntesis al bajar binomios (ej: $x + 1 \cdot \ln(3)$ en vez de $(x + 1)\ln(3)$).

  - **Cómo corregirlo:** Pon **SIEMPRE paréntesis a todo el exponente**: $\mathbf{(x + 1)} \cdot \ln(3) = x\ln(3) + \ln(3)$.'
ejemplos:
- titulo: 'Ejemplo 1: Bases distintas básicas'
  enunciado: 'Despeja $x$ en $4^x = 11$:'
  alternativas:
  - x = ln(11) / ln(4)
  - x = ln(11) - ln(4)
  - x = 11/4
  - x = ln(11/4)
  respuesta: x = ln(11) / ln(4)
  solucion_pasos:
  - 'Paso 1: $x\ln(4) = \ln(11) \implies x = \frac{\ln(11)}{\ln(4)}$.'
- titulo: 'Ejemplo 2: Exponente con coeficiente'
  enunciado: 'Resuelve $2^{3x} = 5$:'
  alternativas:
  - x = ln(5) / (3 ln(2))
  - x = ln(5) / ln(6)
  - x = 5/6
  - x = 3 ln(5) / ln(2)
  respuesta: x = ln(5) / (3 ln(2))
  solucion_pasos:
  - 'Paso 1: $3x \ln(2) = \ln(5) \implies x = \frac{\ln(5)}{3\ln(2)}$.'
- titulo: 'Ejemplo 3: Bases distintas con binomio'
  enunciado: 'Resuelve $10^{x - 2} = 7$:'
  alternativas:
  - x = 2 + log(7)
  - x = log(7) - 2
  - x = log(5)
  - x = 7/10 + 2
  respuesta: x = 2 + log(7)
  solucion_pasos:
  - 'Paso 1: $x - 2 = \log(7) \implies x = 2 + \log(7)$.'
- titulo: 'Ejemplo 4: Factorización de incógnita'
  enunciado: 'En $5^x = 2^x \cdot 3$, el valor de $x$ es:'
  alternativas:
  - x = ln(3) / ln(2,5)
  - x = ln(3) / ln(10)
  - x = 3
  - x = ln(3) - ln(2,5)
  respuesta: x = ln(3) / ln(2,5)
  solucion_pasos:
  - 'Paso 1: $(5/2)^x = 3 \implies (2{,}5)^x = 3 \implies x = \frac{\ln(3)}{\ln(2{,}5)}$.'
errores_frecuentes:
- No colocar paréntesis en binomios que bajan del exponente.
- Dividir argumentos en vez de dividir logaritmos completos.
- Intentar restar logaritmos para despejar una multiplicación.
afirmaciones_verdaderas:
- La aplicación de logaritmos a ambos lados resuelve ecuaciones exponenciales con cualquier par de bases positivas.
- El cociente ln(A)/ln(B) es igual a log_B(A) por la fórmula de cambio de base.
al_terminar_debes_poder: '**QUÉ:** Resolver ecuaciones exponenciales generales utilizando logaritmos.


  **CÓMO:** Aplicando ln a ambos miembros, bajando exponentes algebraicos y despejando la incógnita lineal.


  ![Resumen La resolución de ecuaciones exponenciales usando logaritmos constituye el método general para resolver ecuaciones $a^{f(x)} = b^{g(x)}$ donde las bases no pueden igualarse algebraicamente, aplicando logaritmos naturales $\ln$ a ambos miembros para linealizar los exponentes](/static/img/nodos/resolucion-de-ecuaciones-exponenciales-usando-logaritmos-resumen.svg)'
