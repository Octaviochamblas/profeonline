semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.DIAMETRO_DOBLE_RADIO
resumen_inicial: 'Relación entre diámetro y radio como d = 2r: conceptos, teoremas,
  propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Con el radio y el diámetro ya definidos por separado, es momento
  de establecer la relación numérica precisa que los conecta.
explicacion_formal: '![Relación entre diámetro y radio: d = 2r](/static/img/geometria/circunferencia-circulo/circulo-diametro-doble-radio.svg)


  ### Definición formal


  Si $r$ es el radio de una circunferencia, su diámetro es $d=2r$. Equivalentemente,
  $r=\frac{d}{2}$.


  ### Desarrollo didáctico


  Esto se debe a que el diámetro está formado por dos radios consecutivos y opuestos
  entre sí (uno a cada lado del centro), cada uno de longitud $r$, sumando en total
  $2r$.'
definiciones_clave: '- **Relación entre diámetro y radio como d = 2r**: Elemento o
  propiedad fundamental en el estudio de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación entre diámetro y radio como d = 2r.'
