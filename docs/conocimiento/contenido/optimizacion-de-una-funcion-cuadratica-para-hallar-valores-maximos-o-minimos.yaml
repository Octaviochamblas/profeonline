semantic_id: MAT.ALG.FUNC_CUADR_MODELO.OPTIMIZACION
resumen_inicial: 'Optimización de una función cuadrática para hallar valores máximos
  o mínimos: parábola, vértice, concavidad y formas de Modelamiento y aplicaciones.'
explicacion_simple: Cuando un problema pregunta por el "mejor" resultado posible (el
  área máxima, el costo mínimo, la ganancia máxima), la respuesta siempre está en
  el vértice de la función cuadrática que modela la situación.
explicacion_formal: '### Definición formal


  Dada $f(x)=ax^2+bx+c$, el valor óptimo (máximo o mínimo) de la función es su valor
  en el vértice, $f\left(-\dfrac{b}{2a}\right)$. Si $a>0$, ese valor es el mínimo
  global; si $a<0$, es el máximo global de la función.


  ### Desarrollo didáctico


  El procedimiento de optimización consiste en plantear la función, identificar el
  signo de $a$ para saber si se busca máximo o mínimo, calcular la coordenada $x$
  del vértice, y evaluar la función en ese punto.


  Para $A(x)=-x^2+20x$ (área de un corral con perímetro fijo), el vértice está en
  $x=-\dfrac{20}{-2}=10$, y $A(10)=-100+200=100$; el área máxima posible es $100 \text{
  m}^2$.'
definiciones_clave: '- **Optimización de una función cuadrática para hallar valores
  máximos o mínimos**: Elemento o parámetro esencial en la representación de la función
  cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  optimización de una función cuadrática para hallar valores máximos o mínimos.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando optimización
    de una función cuadrática para hallar valores máximos o mínimos.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a optimización
    de una función cuadrática para hallar valores máximos o mínimos.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
