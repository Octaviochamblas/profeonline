procedimiento:
- 'Paso 1: Plantea la función que modela la cantidad a optimizar.'
- 'Paso 2: Identifica si se busca un máximo ($a<0$) o un mínimo ($a>0$).'
- 'Paso 3: Calcula la coordenada $x$ del vértice mediante $x=-b/(2a)$.'
- 'Paso 4: Evalúa la función en ese valor para obtener el valor óptimo.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en optimización de una función cuadrática para hallar
  valores máximos o mínimos.
ejemplos:
- titulo: Optimización de un área máxima
  enunciado: Con $A(x)=-2x^2+40x$, determina el área máxima posible.
  solucion_pasos:
  - $x=-\dfrac{40}{2(-2)}=10$.
  - $A(10)=-200+400=200$.
  - El área máxima es $200$ unidades cuadradas.
- titulo: Optimización de un costo mínimo
  enunciado: Con $C(x)=3x^2-24x+100$, determina el costo mínimo posible.
  solucion_pasos:
  - $x=-\dfrac{-24}{2(3)}=4$.
  - $C(4)=48-96+100=52$.
  - El costo mínimo es $52$.
- titulo: ¿Se necesita calcular el vértice completo (ambas coordenadas) para hallar
    el valor óptimo?
  enunciado: ¿Se necesita calcular el vértice completo (ambas coordenadas) para hallar
    el valor óptimo?
  respuesta: Sí
  solucion_pasos:
  - Se necesita la coordenada $x$ para saber dónde ocurre, y la coordenada $y$ (el
    valor de la función) para saber cuánto vale ese óptimo.
- titulo: ¿El signo de $a$ determina si se busca un máximo o un mínimo?
  enunciado: ¿El signo de $a$ determina si se busca un máximo o un mínimo?
  respuesta: Sí
  solucion_pasos:
  - Si $a<0$ el vértice es un máximo; si $a>0$, es un mínimo.
errores_frecuentes:
- Reportar solo la coordenada $x$ del vértice como respuesta, sin calcular el valor
  óptimo de la función.
- Declarar si se busca un máximo o un mínimo según el signo de $a$.
- Cometer errores algebraicos al calcular $-b/(2a)$, especialmente con signos negativos.
- No verificar que el valor de $x$ obtenido esté dentro del dominio válido según el
  contexto del problema.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
