semantic_id: MAT.ALG.FUNC_CUADR_MODELO.OPTIMIZACION
resumen_inicial: La optimización cuadrática aplica la teoría del vértice para calcular máximos o mínimos globales en problemas de economía, ingeniería y geometría.
explicacion_simple: |
  **Optimizar** significa encontrar la mejor opción posible: la **mayor ganancia**, el **menor costo**, el **área más grande** o el **tiempo óptimo**.

  - Como la gráfica de una función cuadrática $f(x) = ax^2 + bx + c$ es una parábola, la optimización **SE RESUELVE SIEMPRE CON EL VÉRTICE $V(h, k)$**:

  1. **Si buscas MAXIMIZAR (hacer lo más grande posible)**:
     - El modelo tendrá $a < 0$ (cóncava hacia abajo $\cap$).
     - La respuesta al óptimo es la **ordenada del vértice $k = f(h)$**.
  2. **Si buscas MINIMIZAR (hacer lo más pequeño posible)**:
     - El modelo tendrá $a > 0$ (cóncava hacia arriba $\cup$).
     - La respuesta al óptimo es la **ordenada del vértice $k = f(h)$**.
explicacion_formal: |
  Sea la función objetivo diferenciable $f: D_{ctx} \to \mathbb{R}$ con $f(x) = ax^2 + bx + c$. El **Problema de Optimización Cuadrática Global** busca resolver la extremalización:

  $$\max_{x \in D_{ctx}} f(x) \quad \text{o} \quad \min_{x \in D_{ctx}} f(x)$$

  **Demostración por cálculo diferencial del punto crítico:**
  La condición necesaria de primer orden exige que la primera derivada sea nula:

  $$f'(x) = 2ax + b = 0 \iff x^* = -\frac{b}{2a}$$

  - La condición de segundo orden confirma el carácter del óptimo: $f''(x^*) = 2a$.
    - Si $a < 0 \implies f''(x^*) < 0$: $x^*$ es el **maximizador global estricto** con valor óptimo $f(x^*) = k$.
    - Si $a > 0 \implies f''(x^*) > 0$: $x^*$ es el **minimizador global estricto** con valor óptimo $f(x^*) = k$.
definiciones_clave: |
  - **Optimización cuadrática**: Proceso matemático para determinar el argumento crítico $x^*$ y la magnitud extrema $f(x^*)$ alcanzada en el vértice de la parábola.
propiedades_relaciones: |
  - **Unicidad del óptimo global**: Toda función cuadrática bien definida sobre $\mathbb{R}$ posee un único punto óptimo global absoluto (sin máximos ni mínimos locales secundarios).
ejemplo_guiado:
  enunciado: 'Un granjero quiere construir un cerco rectangular de área máxima con 80 metros de cerca. Optimiza la función de área $A(x) = -x^2 + 40x$ para hallar las dimensiones y el área máxima.'
  pasos:
    - 'Paso 1: Identificar coeficientes de $A(x) = -x^2 + 40x$: $a = -1, b = 40, c = 0$.'
    - 'Paso 2: Hallar la dimensión óptima $x^*$ (ancho): $x^* = -\frac{40}{2(-1)} = 20$ metros.'
    - 'Paso 3: Hallar la segunda dimensión (largo): $\text{largo} = 40 - x^* = 40 - 20 = 20$ metros (un cuadrado).'
    - 'Paso 4: Calcular el área máxima sustituyendo $x^* = 20$: $A(20) = -(20)^2 + 40(20) = -400 + 800 = 400 \text{ m}^2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un proceso de optimización donde los costos de producción son $C(x) = 2x^2 - 16x + 50$, ¿cuál es la cantidad producida $x^*$ que minimiza el costo total?'
    choices:
      - {text: 'Exactamente 4 unidades producidas ($x^* = 4$)', is_correct: true}
      - {text: 'Exactamente 8 unidades producidas ($x^* = 8$).', is_correct: false}
      - {text: 'Exactamente 18 unidades producidas ($x^* = 18$).', is_correct: false}
      - {text: 'Exactamente 50 unidades producidas ($x^* = 50$).', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente 4 unidades producidas ($x^* = 4$)''. $x^* = -b/(2a) = -(-16)/(2 \cdot 2) = 16/4 = 4$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Para la misma función de costos $C(x) = 2x^2 - 16x + 50$ cuyo mínimo ocurre en $x^* = 4$, ¿cuál es el costo mínimo absoluto alcanzado?'
    choices:
      - {text: 'El costo mínimo es de $18 ($C(4) = 18$)', is_correct: true}
      - {text: 'El costo mínimo es de $4 ($C(4) = 4$).', is_correct: false}
      - {text: 'El costo mínimo es de $50 ($C(4) = 50$).', is_correct: false}
      - {text: 'El costo mínimo es de $32 ($C(4) = 32$).', is_correct: false}
    explanation: 'La alternativa correcta es ''El costo mínimo es de $18 ($C(4) = 18$)''. Evaluando $C(4) = 2(4)^2 - 16(4) + 50 = 32 - 64 + 50 = 18$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Plantear o verificar la función cuadrática objetivo $f(x) = ax^2 + bx + c$.'
  - 'Paso 2: Comprobar la dirección de optimización (maximizar si $a < 0$, minimizar si $a > 0$).'
  - 'Paso 3: Calcular el argumento óptimo de control $x^* = -\frac{b}{2a}$.'
  - 'Paso 4: Sustituir $x^*$ en la función objetivo para obtener el valor óptimo absoluto $f(x^*) = k$.'
errores_correccion: |
  - **Error común:** Intentar resolver $f(x) = 0$ (hallar ceros) cuando la pregunta pedía optimizar (hallar el máximo o mínimo).
  - **Cómo corregirlo:** Para **OPTIMIZAR** se calcula el **VÉRTICE $x^* = -b/(2a)$**; los ceros solo indican cuándo se anula la función.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Maximización de ganancias.
    alternativas:
      - 'Ganancia máxima de $900 vendiendo a $30'
      - 'Ganancia máxima de $30 vendiendo a $900'
      - 'Ganancia nula en x = 30'
    respuesta: 'Ganancia máxima de $900 vendiendo a $30'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Minimización de consumo de combustible.
    alternativas:
      - 'Consumo mínimo de 6 L/100km a 80 km/h'
      - 'Consumo mínimo de 80 L/100km a 6 km/h'
      - 'Consumo constante'
    respuesta: 'Consumo mínimo de 6 L/100km a 80 km/h'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Igualar la función a cero en lugar de calcular las coordenadas del vértice al resolver un problema de optimización.'
  - 'La confusión entre la variable de control $x^*$ que produce el óptimo y el valor óptimo extremo $f(x^*)$.'
  - 'La búsqueda de maximizar una función cuadrática cóncava hacia arriba que se extiende ilimitadamente al infinito.'
  - 'La falta de verificación de si el argumento óptimo $x^*$ cae dentro del dominio contextual restringido del problema.'
  - 'Afirmar que un problema de optimización cuadrática puede tener múltiples máximos locales en la misma parábola.'
afirmaciones_verdaderas:
  - 'La optimización de una función cuadrática se realiza calculando la abscisa del vértice $x^* = -b/(2a)$ y su correspondiente valor extremo $f(x^*)$.'
  - 'Una función cuadrática cóncava hacia abajo ($a < 0$) posee un único máximo absoluto global en su vértice.'
al_terminar_debes_poder: |
  QUÉ: Resolver problemas de optimización calculando los valores máximos o mínimos de una función cuadrática.
  CÓMO: Plantear $f(x)$, aislar $a, b$, calcular el argumento crítico $x^* = -b/(2a)$, evaluar la imagen óptima $f(x^*)$ e interpretar.
