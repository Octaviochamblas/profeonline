semantic_id: MAT.ALG.GENERALIZACIONES_PRODUCTOS.TERMINO_GENERAL
resumen_inicial: La identificación del término general en una expansión binomial consiste en determinar directamente la posición
  o el monomio $T_{k+1} = \binom{n}{k} a^{n-k} b^k$ sin necesidad de expandir el polinomio completo.
explicacion_simple: "Cuando quieres encontrar **un solo término específico** (por ejemplo, \"el cuarto término\" o \"el término\
  \ independiente\") en una potencia muy grande como $(x + 2)^{10}$:\n- **FÓRMULA DEL TÉRMINO GENERAL ($T_{k+1}$)**:\n  $$T_{k+1}\
  \ = \\mathbf{\\binom{n}{k} a^{n-k} b^k}$$\n- **REGLA CLAVE DE LA POSICIÓN ($k = \\text{Posición} - 1$)**:\n  - Si te piden\
  \ el **1.er término** $\\implies k = 0$.\n  - Si te piden el **3.er término** $\\implies k = 2$.\n  - Si te piden el **5.º\
  \ término** $\\implies k = 4$.\n  - Para la posición $p$, el valor del parámetro en la fórmula es siempre **$k = p - 1$**.\n\
  - **Ejemplo**: Hallar el **3.er término** de $(x + 3)^5$:\n  - $n = 5$, Posición $3 \\implies k = 3 - 1 = \\mathbf{2}$.\n\
  \  - $T_3 = \\binom{5}{2} x^{5-2} (3)^2 = 10 \\cdot x^3 \\cdot 9 = \\mathbf{90x^3}$.\n  - ¡Encontraste el 3.er término sin\
  \ tener que calcular los otros 5!\n\n![Identificación del término general](/static/img/nodos/identificacion-del-termino-general-en-una-expansion-binomial-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la sumatoria de Newton $(a + b)^n = \sum_{k=0}^{n} \binom{n}{k} a^{n-k} b^k$ en $\mathbb{R}[x]$. Se define la **función
  término general** $T: \{1, 2, \dots, n+1\} \to \mathbb{R}[x]$ que asigna a la posición posicional $p = k+1$ la componente
  monómica $k$-ésima:


  $$\mathbf{T_{k+1} = \binom{n}{k} a^{n-k} b^k} \quad \text{donde } k = 0, 1, \dots, n$$


  ### Cálculo de Términos Específicos por Ecuación de Exponente

  Para determinar el término que contiene una potencia dada $x^m$, o el **término independiente** ($x^0$), se iguala el exponente
  resultante de la variable a $m$ para despejar unívocamente el entero $k$:


  $$\operatorname{exp}_x(T_{k+1}) = m \implies k \in \mathbb{N}_0 \quad (0 \le k \le n)$$


  Si el valor despejado de $k$ no es un entero en $[0, n]$, se concluye que la expansión no contiene dicho término.


  ### Síntesis didáctica

  La fórmula $T_{k+1}$ permite acceder quirúrgicamente a cualquier coeficiente de $(a+b)^n$ mediante la sustitución del parámetro
  $k = \text{Posición} - 1$.

  '
definiciones_clave: '- **Fórmula del término general ($T_{k+1} = \binom{n}{k} a^{n-k} b^k$)**: Expresión analítica que proporciona
  la componente monómica posicional $k+1$.

  - **Índice de posición ($k = p - 1$)**: Desfasaje de una unidad entre la posición ordinal deseada $p$ y el índice combinatorio
  $k$.

  - **Término independiente ($x^0$)**: Componente monómica cuya potencia resultante de la variable es de grado 0.

  '
propiedades_relaciones: '- **Desfasaje posicional**: El primer término ($p=1$) usa $k=0$; el último término ($p=n+1$) usa
  $k=n$.

  - **Término central**: Si $n$ es par, existe un único término central en la posición $p = \frac{n}{2} + 1$ ($k = \frac{n}{2}$).

  '
ejemplo_guiado:
  enunciado: Encuentra el 4.º término en la expansión binomial de $(x^2 - 2)^6$.
  pasos:
  - 'Paso 1: Identificamos $a = x^2$, $b = -2$, $n = 6$.'
  - 'Paso 2: Como nos piden el 4.º término ($p=4$), calculamos $k = 4 - 1 = \mathbf{3}$.'
  - 'Paso 3: Aplicamos la fórmula $T_{3+1} = T_4 = \binom{6}{3} (x^2)^{6-3} (-2)^3$.'
  - 'Paso 4: Calculamos el coeficiente binomial $\binom{6}{3}$: $\binom{6}{3} = \frac{6!}{3! 3!} = \frac{720}{6 \cdot 6} =
    \mathbf{20}$.'
  - 'Paso 5: Evaluamos las potencias de las componentes: - $(x^2)^3 = \mathbf{x^6}$. - $(-2)^3 = \mathbf{-8}$.'
  - 'Paso 6: Multiplicamos los tres factores: $T_4 = 20 \cdot x^6 \cdot (-8) = \mathbf{-160x^6}$.'
  - 'Conclusión: El 4.º término de la expansión es **$-160x^6$**.'
  imagen: /static/img/nodos/identificacion-del-termino-general-en-una-expansion-binomial-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Si se desea calcular el 5.º término de la expansión binomial de $(a+b)^8$, ¿qué valor debe asignarse al parámetro
    $k$ en la fórmula $T_{k+1} = \binom{n}{k} a^{n-k} b^k$?
  choices:
  - text: Debe asignarse $k = 4$, por la regla del desfasaje posicional $k = \text{Posición} - 1 = 5 - 1 = 4$
    is_correct: true
  - text: Debe asignarse $k = 5$
    is_correct: false
  - text: Debe asignarse $k = 8$
    is_correct: false
  - text: Debe asignarse $k = 3$
    is_correct: false
  explanation: La alternativa correcta es 'Debe asignarse $k = 4$, por la regla del desfasaje posicional $k = \text{Posición}
    - 1 = 5 - 1 = 4$'. Desfasaje de una unidad $k = p-1$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el 2.º término en la expansión de $(x + 4)^4$?
  choices:
  - text: El 2.º término es $16x^3$, calculando para $k=1 \implies \binom{4}{1} x^3 (4)^1 = 4 \cdot x^3 \cdot 4 = 16x^3$
    is_correct: true
  - text: El 2.º término es $4x^3$
    is_correct: false
  - text: El 2.º término es $96x^2$
    is_correct: false
  - text: El 2.º término es $x^4$
    is_correct: false
  explanation: La alternativa correcta es 'El 2.º término es $16x^3$, calculando para $k=1 \implies \binom{4}{1} x^3 (4)^1
    = 4 \cdot x^3 \cdot 4 = 16x^3$'. $T_2 = \binom{4}{1} x^3 4^1 = 16x^3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las componentes $a$ y $b$ del binomio y el exponente $n$.'
- 'Paso 2: Determinar el índice $k$ restando 1 a la posición solicitada ($k = p - 1$).'
- 'Paso 3: Calcular el coeficiente binomial $\binom{n}{k} = \frac{n!}{k!(n-k)!}$.'
- 'Paso 4: Elevar $a^{n-k}$ y $b^k$, multiplicar todos los factores y simplificar el monomio final.'
errores_correccion: '- **Error 1:** Utilizar $k = p$ directamente para calcular el término de la posición $p$ (usar $k=4$
  para el 4.º término). **Cómo corregirlo:** El valor del parámetro $k$ **LLEVA UN DESFASAJES DE UNA UNIDAD ($k = p - 1 \implies
  k=3$)**.

  - **Error 2:** Excluir el signo negativo de b al elevar la componente a la potencia k. **Cómo corregirlo:** La componente
  $b$ **CONSERVA SU SIGNO NEGATIVO ($-2)^k$**.

  '
ejemplos:
- titulo: Cálculo de k posicional
  enunciado: Para hallar el 6.º término de una expansión binomial, ¿debemos usar $k = 5$?
  respuesta: Sí
  solucion_pasos:
  - 1. $k = 6 - 1 = 5$.
- titulo: Primer término con k=0
  enunciado: ¿Corresponde el 1.er término $T_1$ a la asignación de $k = 0$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $T_{0+1} = T_1$.
- titulo: Signo negativo en potencia impar
  enunciado: En el 4.º término de $(x - y)^5$, ¿produce $k=3$ un signo negativo debido a $(-y)^3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-1)^3 = -1$.
- titulo: Término central en exponente par
  enunciado: Para $(a+b)^6$, ¿es el 4.º término ($k=3$) el término central?
  respuesta: Sí
  solucion_pasos:
  - Sí, $k = 6/2 = 3 \implies T_4$.
errores_frecuentes:
- Utilizar el valor de la posición p directamente como parámetro k omitiendo el desfasaje k = p - 1.
- La elevación del signo negativo de la segunda componente b al exponente k no se realiza.
- Invertir los exponentes de a y b escribiendo a^k y b^(n-k).
- Intercambiar el número total de términos n+1 con el valor máximo de k.
- Olvidar elevar el coeficiente numérico de la variable dentro del monomio.
afirmaciones_verdaderas:
- La fórmula del término general es $T_{k+1} = \binom{n}{k} a^{n-k} b^k$, donde $k = \text{Posición} - 1$.
- Permite calcular quirúrgicamente cualquier término o coeficiente sin necesidad de expandir el polinomio completo.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/identificacion-del-termino-general-en-una-expansion-binomial-resumen.svg)


  QUÉ: Identificar y calcular cualquier término específico $T_{k+1}$ en una expansión binomial aplicando la fórmula del término
  general.

  CÓMO: Evaluar $T_{k+1} = \binom{n}{k} a^{n-k} b^k$ utilizando el desfasaje $k = \text{Posición} - 1$ e incorporando el signo
  correspondiente de la componente $b$.

  '
