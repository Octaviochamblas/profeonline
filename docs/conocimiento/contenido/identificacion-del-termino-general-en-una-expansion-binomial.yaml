procedimiento:
- 'Paso 1: Identificar $n, a, b$ y fijar $k = m - 1$ para buscar el término ordinal
  $m$.'
- 'Paso 2: Sustituir en $T_{k+1} = \binom{n}{k} a^{n-k} b^k$.'
- 'Paso 3: Evaluar el coeficiente binomial y las potencias numéricas para obtener
  el monomio simplificado.'
errores_correccion: '- **Error 1: Usar $k = m$ en lugar de $k = m - 1$ al buscar el
  $m$-ésimo término.** **Cómo corregirlo:** Debido a que el primer término arranca
  en $k=0$, el término de posición $m$ requiere sustituir $k = m - 1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Halle el tercer término ($T_3$) de $(x + 3)^5$.
  alternativas:
  - $90x^3$
  - $10x^3$
  - $270x^3$
  respuesta: $90x^3$
  solucion_pasos:
  - 1. $n=5, k=2$.
  - 2. $\binom{5}{2} x^{5-2} (3)^2 = 10 \cdot x^3 \cdot 9 = 90x^3$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el índice $k$ para encontrar el término independiente de $x$
    en $(x + \frac{1}{x})^8$?
  alternativas:
  - $k = 4$
  - $k = 8$
  - $k = 2$
  respuesta: $k = 4$
  solucion_pasos:
  - 1. $x^{8-k}(x^{-1})^k = x^{8-2k} = x^0 \implies 8 - 2k = 0 \implies k = 4$.
- titulo: ¿Permite la fórmula del término general calcular cualquier sumando sin expandir
    los demás?
  respuesta: Sí
  solucion_pasos:
  - Sí, calcula directamente el monomio $T_{k+1}$ de forma aislada.
- titulo: ¿El primer término $T_1$ de la expansión de $(a + b)^n$ corresponde al valor
    $k=1$?
  respuesta: 'No'
  solucion_pasos:
  - No, el primer término $T_1 = T_{0+1}$ corresponde al valor $k=0$.
errores_frecuentes:
- Usar $k=m$ en lugar de $k=m-1$ al calcular el $m$-ésimo término de una expansión.
- Declarar que el primer término de una expansión binomial se obtiene con $k=1$.
- Mantener la constante numérica $b$ en grado 1 al calcular el término en lugar de
  elevarla a la potencia $k$.
- Asignar la potencia $k$ a la variable $a$ y la potencia $n-k$ a la variable $b$.
- Declarar que no es posible calcular un término aislado sin expandir todo el binomio.
afirmaciones_verdaderas:
- El término ubicado en la posición ordinal $m$ se obtiene evaluando el índice $k
  = m - 1$ en la fórmula general.
- La fórmula del término general permite encontrar el término independiente reduciendo
  exponentes a cero.
al_terminar_debes_poder: Al terminar serás capaz de determinar cualquier término específico
  $T_{k+1}$ en una expansión binomial aplicando la fórmula del término general.
