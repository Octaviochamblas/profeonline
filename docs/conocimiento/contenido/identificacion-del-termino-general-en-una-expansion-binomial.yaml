resumen_inicial: La identificación del término general en una expansión binomial permite
  calcular directamente un término específico $T_{k+1}$ sin necesidad de desarrollar
  todo el polinomio.
explicacion_simple: Si te piden hallar solo el término número 5 de $(x + 2)^{10}$,
  no necesitas calcular los 11 términos. Usas la fórmula del término general $T_{k+1}
  = \binom{n}{k} a^{n-k} b^k$. Como buscas el término 5, usas $k=4$, aplicas la fórmula
  y obtienes directamente la respuesta.
explicacion_formal: 'En la expansión binomial $(a + b)^n = \sum_{k=0}^n T_{k+1}$,
  el **Término General** ubicado en la posición ordinal $(k+1)$-ésima (para $0 \le
  k \le n$) se define estrictamente por:


  $$T_{k+1} = \binom{n}{k} a^{n-k} b^k$$


  **Desglose simbólico:**

  - $T_{k+1}$: Término ubicado en el lugar ordinal $k+1$ (ej. para el 1er término
  $k=0$, para el 5to término $k=4$).

  - $\binom{n}{k}$: Coeficiente combinatorio de la posición $k$.

  - $a^{n-k}$: Exponente del primer elemento disminuido en el índice de posición $k$.

  - $b^k$: Exponente del segundo elemento igual al índice de posición $k$.


  > **Complemento didáctico:** Herramienta indispensable en PAES para encontrar el
  término independiente ($x^0$) o el coeficiente de una potencia específica sin calcular
  la expansión completa.'
definiciones_clave: '- **Fórmula del término general**: $T_{k+1} = \binom{n}{k} a^{n-k}
  b^k$.

  - **Desfase de índice $k$**: El término de lugar $m$ utiliza el índice de sumatoria
  $k = m - 1$.'
propiedades_relaciones: '- **Cálculo de término independiente**: Se determina resolviendo
  la ecuación de exponentes $n-k = 0$ o la condición de grado deseado.'
ejemplo_guiado:
  enunciado: Determine el cuarto término ($T_4$) en la expansión de $(x + 2)^7$.
  pasos:
  - 'Paso 1: Identificar $n = 7, a = x, b = 2$.'
  - 'Paso 2: Para hallar el término 4 ($T_4 = T_{3+1}$), fijar $k = 3$.'
  - 'Paso 3: Calcular el coeficiente binomial: $\binom{7}{3} = \frac{7!}{3!4!} = \frac{7
    \cdot 6 \cdot 5}{3 \cdot 2 \cdot 1} = 35$.'
  - 'Paso 4: Calcular la parte literal y numérica: $a^{7-3}b^3 = x^4 \cdot 2^3 = 8x^4$.'
  - 'Paso 5: Multiplicar coeficiente y parte numérica: $35 \cdot 8x^4 = 280x^4$.'
  - 'Conclusión: El cuarto término de la expansión es $280x^4$.'
checkpoints:
