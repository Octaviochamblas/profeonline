semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.CIRCUNFERENCIA_DEFINICION
resumen_inicial: La circunferencia es el conjunto de todos los puntos del plano que se encuentran a una distancia constante de un punto fijo llamado centro.
explicacion_simple: 'Imagina que clavas un alfiler en una mesa, atas una cuerda estirada y giras un lápiz alrededor dando una vuelta completa. El trazo que deja el lápiz es una **circunferencia**.


  Es exclusivamente la **línea curva del contorno**, como un anillo o una pulsera. No incluye la parte de adentro (el relleno). Todos y cada uno de los puntos que forman esa línea están a la misma distancia exacta del centro: esa distancia fija se llama **radio** ($r$). Como es una línea curva, la circunferencia es una figura de una sola dimensión (1D) y se mide por su longitud o perímetro: **$P = 2\pi r$**.


  ![Definición de circunferencia](/static/img/nodos/definicion-de-circunferencia-como-linea-curva-cerrada-formada-por-puntos-equidistantes-de-un-centro-intro.svg)

  '
explicacion_formal: '### Definición geométrica como lugar geométrico

  Sea $O \in \mathbb{R}^2$ un punto coplanar denominado **centro** y sea $r \in \mathbb{R}^+$ un número real positivo denominado **radio**. Se define la **circunferencia** $\mathcal{C}(O, r)$ como el lugar geométrico de todos los puntos $P(x, y)$ del plano euclidiano cuya distancia euclidiana a $O$ es estrictamente constante e igual a $r$:

  $$\mathcal{C}(O, r) = \{ P \in \mathbb{R}^2 \mid d(P, O) = r \}$$


  ### Ecuación en coordenadas cartesianas

  Si el centro tiene coordenadas $O(h, k)$, la condición de distancia euclidiana $\sqrt{(x - h)^2 + (y - k)^2} = r$ conduce a la **ecuación canónica ordinaria**:

  $$(x - h)^2 + (y - k)^2 = r^2$$


  ### Métrica y dimensión

  - **Dimensión topológica:** 1 (es una variedad unidimensional conexa y compacta sin borde).

  - **Longitud lineal (perímetro):** $\mathcal{L}(\mathcal{C}) = 2\pi r = \pi d$.

  - **Área bidimensional:** Su medida de Lebesgue bidimensional es estrictamente nula ($\text{Área}(\mathcal{C}) = 0$), pues es una curva sin grosor ni región interior.


  > **Complemento didáctico:** La analogía perfecta para la PAES es: la circunferencia es el anillo (solo el borde de metal con longitud $2\pi r$), mientras que el círculo es la moneda completa (con superficie y área $\pi r^2$). ¡Nunca digas ''el área de la circunferencia''!

  '
definiciones_clave: '- **Circunferencia**: Conjunto de puntos del plano que equidistan de un punto fijo central.

  - **Radio ($r$)**: Distancia euclidiana constante desde el centro hasta cualquier punto de la circunferencia.

  - **Centro ($O$)**: Punto fijo interior coplanar de referencia equidistante del borde.

  - **Perímetro ($P$)**: Longitud lineal completa de la curva dada por $P = 2\pi r$.

  '
propiedades_relaciones: '- **Partición del plano**: Divide al plano en tres regiones disjuntas: interior ($d < r$), la propia circunferencia ($d = r$) y el exterior ($d > r$).

  - **Simetría radial infinita**: Admite infinitos ejes de simetría axial (cualquier recta secante que pase por el centro).

  - **Invarianza métrica**: Si se traslada o rota en el plano, la distancia $r$ se preserva inmutable.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos guiados de circunferencia](/static/img/nodos/definicion-de-circunferencia-como-linea-curva-cerrada-formada-por-puntos-equidistantes-de-un-centro-ejemplos.svg)


    Una circunferencia tiene centro en el origen $O(0, 0)$ y radio $r = 5\text{ cm}$. Determina analíticamente si el punto $A(3, 4)$ y el punto $B(2, 3)$ pertenecen a la circunferencia.'
  pasos:
  - 'Paso 1: Calcular la distancia de $A(3, 4)$ al centro $O(0, 0)$: $d(A, O) = \sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5\text{ cm}$.'
  - 'Paso 2: Comparar con el radio: Como $d(A, O) = 5 = r$, el punto $A$ satisface la ecuación y pertenece a la circunferencia ($A \in \mathcal{C}$).'
  - 'Paso 3: Calcular la distancia de $B(2, 3)$ al centro $O(0, 0)$: $d(B, O) = \sqrt{2^2 + 3^2} = \sqrt{4 + 9} = \sqrt{13} \approx 3{,}6\text{ cm}$.'
  - 'Paso 4: Comparar con el radio: Como $\sqrt{13} < 5$, el punto $B$ no pertenece a la circunferencia; es un punto interior ($B \notin \mathcal{C}$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la definición geométrica rigurosa de una circunferencia?
  choices:
  - text: El conjunto de todos los puntos del plano que equidistan de un centro fijo.
    is_correct: true
  - text: La región interior plana delimitada por un contorno circular.
    is_correct: false
  - text: El segmento recto que une dos extremos pasando por el centro.
    is_correct: false
  - text: La superficie bidimensional medida por la fórmula pi por radio al cuadrado.
    is_correct: false
  explanation: La alternativa correcta es 'El conjunto de todos los puntos del plano que equidistan de un centro fijo.' Por definición euclidiana, es el lugar geométrico unidimensional de puntos con distancia constante $r$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un punto P satisface d(P, O) < r, ¿cuál es su posición respecto a la circunferencia de centro O y radio r?
  choices:
  - text: Es un punto interior a la circunferencia (pertenece al círculo pero no a la curva).
    is_correct: true
  - text: Pertenece estrictamente a la circunferencia.
    is_correct: false
  - text: Es un punto exterior a la circunferencia.
    is_correct: false
  - text: Es tangente a la circunferencia.
    is_correct: false
  explanation: La alternativa correcta es 'Es un punto interior a la circunferencia (pertenece al círculo pero no a la curva).' Para pertenecer a la circunferencia se exige igualdad estricta $d(P, O) = r$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar las coordenadas del centro $O(h, k)$ y el valor del radio $r$.

  2. Para comprobar pertenencia, calcular la distancia euclidiana del punto al centro: $d = \sqrt{(x - h)^2 + (y - k)^2}$.

  3. Evaluar la condición: si $d = r$ pertenece; si $d < r$ es interior; si $d > r$ es exterior.

  4. Para calcular su longitud o perímetro, aplicar $P = 2\pi r$.

  '
errores_correccion: '- **Error común 1:** Decir que la circunferencia tiene área. **Corrección:** La circunferencia es una línea curva (1D), solo tiene longitud o perímetro; el círculo (2D) es el que tiene área.

  - **Error común 2:** Incluir los puntos interiores como parte de la circunferencia. **Corrección:** Los puntos interiores forman el círculo; la circunferencia es solo la frontera exterior.

  '
ejemplos:
- tipo: A
  titulo: Perímetro de la circunferencia
  enunciado: Una circunferencia tiene un radio de $7\text{ cm}$. ¿Cuál es su longitud o perímetro exacto en términos de $\pi$?
  alternativas:
  - text: $14\pi\text{ cm}$.
    is_correct: true
  - text: $49\pi\text{ cm}$.
    is_correct: false
  - text: $7\pi\text{ cm}$.
    is_correct: false
  - text: $28\pi\text{ cm}$.
    is_correct: false
  explicacion: 'Por la fórmula de longitud: $P = 2\pi r = 2\pi(7) = 14\pi\text{ cm}$.'
- tipo: B
  titulo: Área de la circunferencia
  enunciado: ¿Tiene la circunferencia como curva una superficie o área medible mayor que cero?
  respuesta: 'No'
  explicacion: No. La circunferencia es un lugar geométrico unidimensional (línea curva). La región con área superficial es el círculo.
errores_frecuentes:
- '''Confundir la circunferencia (línea 1D) con el círculo (superficie 2D).'''
- '''Calcular el área $\pi r^2$ cuando se solicita la longitud de la circunferencia.'''
- '''Creer que el centro pertenece a la propia circunferencia.'''
afirmaciones_verdaderas:
- '''La circunferencia es una línea curva cerrada cuyos puntos equidistan de un centro común.'''
- '''Todos los puntos de la circunferencia satisfacen la relación $d(P, O) = r$.'''
- '''La longitud perimetral de una circunferencia de radio $r$ es $P = 2\pi r$.'''
al_terminar_debes_poder: '**QUÉ:** Definir y caracterizar la circunferencia como lugar geométrico unidimensional en el plano.


  **CÓMO:** Verificando la condición de equidistancia $d(P, O) = r$ y aplicando la métrica perimetral $P = 2\pi r$.


  ![Síntesis de circunferencia](/static/img/nodos/definicion-de-circunferencia-como-linea-curva-cerrada-formada-por-puntos-equidistantes-de-un-centro-resumen.svg)

  '
