  enunciado: 'Respecto de «Uso de la propiedad aditiva de la igualdad (sumar o restar
    lo mismo en ambos miembros)»: ¿La siguiente conclusión es correcta? «Sumar una
    cantidad a un lado y restar esa misma cantidad al otro lado (rompe la balanza)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Si sumas o restas exactamente
    la misma cantidad en el Primer Miembro y en el Segundo Miembro de una ecuación,
    la igualdad se mantiene (la balanza no pierde su equilibrio).'
errores_frecuentes:
- Sumar una cantidad a un lado y restar esa misma cantidad al otro lado (rompe la
  balanza).
- Para «El famoso atajo de 'pasar un término sumando al otro lado restando' es en
  realidad una aplicación rápida de:», la respuesta correcta es La propiedad distributiva.
- La cancelación de inversos.
- La transposición mágica de Euler.
- $x - 4 + 4 = 15 - 4$.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
