  enunciado: 'Respecto de «Uso de la propiedad aditiva de la igualdad (sumar o restar
    lo mismo en ambos miembros)»: ¿La siguiente formulación es correcta? «Si sumas
    o restas exactamente la misma cantidad en el Primer Miembro y en el Segundo Miembro
    de una ecuación, la igualdad se mantiene (la balanza no pierde su equilibrio)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Si sumas o restas exactamente
    la misma cantidad en el Primer Miembro y en el Segundo Miembro de una ecuación,
    la igualdad se mantiene (la balanza no pierde su equilibrio).'
- titulo: Respecto de «Uso de la propiedad aditiva de la igualdad (sumar o restar
