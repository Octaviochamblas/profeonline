procedimiento:
- 'Paso 1: Identifica qué término está sumando o restando a la incógnita y te estorba.'
- 'Paso 2: Aplica la operación inversa (si hay un $+5$, debes restar $5$) en AMBOS
  miembros de la ecuación simultáneamente.'
- 'Paso 3: Simplifica los cálculos de ambos lados. En un lado, el término estorboso
  desaparecerá.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en uso de la propiedad aditiva de la igualdad (sumar o restar lo mismo
  en ambos miembros).
ejemplos:
- titulo: 'Resuelve usando la propiedad aditiva: $y + 7 = 12$'
  enunciado: 'Resuelve usando la propiedad aditiva: $y + 7 = 12$.'
  solucion_pasos:
  - Estorba el +7. Debemos restar 7.
  - 'Restamos 7 a ambos lados: $y + 7 - 7 = 12 - 7$.'
  - 'Simplificamos: $y + 0 = 5$.'
  - $y = 5$.
- titulo: Si tengo $x - 10 = 0$, ¿qué operación debo hacer en ambos lados para despejar
    x?
  solucion_pasos:
  - Para eliminar el -10, sumamos 10 a la izquierda y a la derecha.
- titulo: Respecto de «Uso de la propiedad aditiva de la igualdad (sumar o restar
