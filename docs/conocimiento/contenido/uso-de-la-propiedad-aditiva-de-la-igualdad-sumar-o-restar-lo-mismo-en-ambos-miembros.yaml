semantic_id: MAT.ALG.ECUACION_BASE.PROPIEDAD_ADITIVA
resumen_inicial: La propiedad aditiva de la igualdad establece que al sumar o restar una misma cantidad en ambos miembros, la equivalencia de la ecuación se conserva.
explicacion_simple: |
  La propiedad aditiva funciona exactamente como una balanza en perfecto equilibrio.

  Si se añade o retira una masa idéntica de ambos platos simultáneamente, la balanza mantiene su nivel sin desequilibrarse.

  En álgebra, esta propiedad nos permite sumar o restar un mismo número o término en ambos miembros de una ecuación para aislar la incógnita sin alterar su conjunto solución.
explicacion_formal: |
  ### Definición formal
  Para cualesquiera expresiones $A, B, C \in \mathbb{R}$, la **propiedad aditiva de la igualdad** establece la equivalencia lógica:

  $$A = B \iff A \pm C = B \pm C$$

  ### Desglose de la fórmula
  - $A = B$: Igualdad original entre dos miembros.
  - $A \pm C = B \pm C$: Adición o sustracción simultánea de la misma expresión $C$ en el primer y segundo miembro.

  ### Síntesis didáctica
  La regla procedimental de transposición de términos ("lo que está sumando en un miembro pasa restando al otro") es la aplicación directa de la propiedad aditiva al sumar el opuesto aditivo en ambos lados.
definiciones_clave: |
  - **Propiedad aditiva de la igualdad**: Principio uniforme que autoriza a sumar o restar la misma cantidad a ambos miembros manteniendo la igualdad.
  - **Opuesto aditivo**: Cantidad $-C$ que al sumarse con $C$ produce el elemento neutro de la adición ($C + (-C) = 0$).
propiedades_relaciones: |
  - **Invarianza del conjunto solución**: Aplicar la propiedad aditiva genera siempre una ecuación equivalente con el mismo conjunto solución $S$.
  - **Eliminación de términos**: Permite anular un sumando en un miembro sumando su inverso aditivo.
ejemplo_guiado:
  enunciado: 'Aplica formalmente la propiedad aditiva de la igualdad para resolver la ecuación $x + 7 = 12$ restando $7$ en ambos miembros.'
  pasos:
    - 'Paso 1: Escribir la ecuación original: $x + 7 = 12$.'
    - 'Paso 2: Aplicar la propiedad aditiva restando $7$ en ambos miembros: $(x + 7) - 7 = 12 - 7$.'
    - 'Paso 3: Cancelar $7 - 7 = 0$ en el primer miembro: $x + 0 = 5 \implies x = 5$.'
    - 'Paso 4: Verificar en la ecuación original: $5 + 7 = 12$, comprobando la veracidad de la igualdad.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué enunciado expresa correctamente la propiedad aditiva de la igualdad para la relación $A = B$?'
    choices:
      - {text: '$A + C = B + C$ para cualquier expresión real $C$.', is_correct: true}
      - {text: '$A \cdot C = B + C$ para cualquier expresión real $C$.', is_correct: false}
      - {text: '$A + C = B - C$ para cualquier expresión real $C$.', is_correct: false}
      - {text: '$A - B = C$ para cualquier expresión real $C$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$A + C = B + C$ para cualquier expresión real $C$.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al aplicar la propiedad aditiva restando $7$ a ambos miembros de $x + 7 = 12$, ¿cuál es el valor deducido para $x$?'
    choices:
      - {text: '$x = 5$', is_correct: true}
      - {text: '$x = 19$', is_correct: false}
      - {text: '$x = 7$', is_correct: false}
      - {text: '$x = -5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 5$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el término constante o algebraico que se desea eliminar de un miembro.'
  - 'Paso 2: Determinar el opuesto aditivo de dicho término (si es $+C$, usar $-C$; si es $-C$, usar $+C$).'
  - 'Paso 3: Escribir la adición o sustracción de ese término opuesto en AMBOS miembros de la ecuación.'
  - 'Paso 4: Reducir los términos semejantes resultantes en cada miembro para despejar la incógnita.'
errores_correccion: |
  - **Error 1:** Sumar o restar una cantidad en un solo miembro de la ecuación olvidando operarla en el otro. **Cómo corregirlo:** Para preservar la equivalencia, **LA PROPIEDAD ADITIVA DEBE APLICARSE RIGUROSAMENTE EN AMBOS MIEMBROS DE FORMA SIMULTÁNEA**.
  - **Error 2:** Sumar en lugar de restar al intentar eliminar un término positivo. **Cómo corregirlo:** Para anular un término $+C$ se debe aplicar su **OPUESTO ADITIVO $-C$ EN AMBOS MIEMBROS**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Qué operación en ambos miembros resuelve la ecuación $x - 9 = 4$ mediante la propiedad aditiva?'
    alternativas:
      - 'Sumar $9$ a ambos miembros'
      - 'Restar $9$ a ambos miembros'
      - 'Sumar $4$ a ambos miembros'
    respuesta: 'Sumar $9$ a ambos miembros'
    solucion_pasos:
      - '1. Opuesto de $-9$ es $+9$.'
      - '2. Aplicar aditiva: $(x - 9) + 9 = 4 + 9 \implies x = 13$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al aplicar la propiedad aditiva sumando $-2x$ a ambos miembros de $5x = 2x + 15$, ¿qué ecuación equivalente resulta?'
    alternativas:
      - '$3x = 15$'
      - '$7x = 15$'
      - '$3x = -15$'
    respuesta: '$3x = 15$'
    solucion_pasos:
      - '1. Restar $2x$: $5x - 2x = (2x + 15) - 2x$.'
      - '2. Reducir: $3x = 15$.'
  - titulo: 'Preservación de la solución'
    enunciado: '¿La ecuación $x + 3 = 8$ tiene la misma solución que $(x + 3) - 3 = 8 - 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por propiedad aditiva se generan ecuaciones equivalentes.'
  - titulo: 'Opuesto aditivo'
    enunciado: '¿Sumar $-x$ a ambos miembros anula la variable $x$ del miembro que la contenía?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $x + (-x) = 0$.'
errores_frecuentes:
  - 'Al restar $7$ en la ecuación $x + 7 = 12$, la sustracción se aplica solo en el primer miembro produciendo $x = 12$.'
  - 'Para anular el término $+7$ en $x + 7 = 12$, la propiedad aditiva exige sumar $+7$ en ambos miembros produciendo $x + 14 = 19$.'
  - 'La transposición del término $+7$ en $x + 7 = 12$ se realiza sin aplicar la adición del opuesto aditivo en el segundo miembro.'
  - 'La aplicación de la propiedad aditiva altera el conjunto solución original de la ecuación.'
  - 'La eliminación del sumando $+7$ en $x + 7 = 12$ se obtiene dividiendo ambos miembros entre $7$.'
afirmaciones_verdaderas:
  - 'La propiedad aditiva garantiza que sumar o restar una misma cantidad a ambos miembros mantiene la equivalencia de la igualdad.'
  - 'La regla procedimental de transposición de términos es una consecuencia directa de la propiedad aditiva de la igualdad.'
al_terminar_debes_poder: |
  QUÉ: Aplicar la propiedad aditiva de la igualdad en la resolución de ecuaciones lineales.
  CÓMO: Añadir o sustraer el opuesto aditivo de un término en ambos miembros simultáneamente para simplificar y despejar la incógnita.
