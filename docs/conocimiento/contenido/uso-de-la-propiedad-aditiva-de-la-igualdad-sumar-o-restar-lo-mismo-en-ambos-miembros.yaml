semantic_id: MAT.ALG.ECUACION_BASE.PROPIEDAD_ADITIVA
resumen_inicial: 'Uso de la propiedad aditiva de la igualdad (sumar o restar lo mismo
  en ambos miembros): propiedades, resolución y modelamiento en Ecuación de primer
  grado: conceptos y propiedades.'
explicacion_simple: Llegamos a la relación algebraica negra que nos permite resolver
  problemas algebraicos. El 'despeje' no es un truco místico de 'pasar al otro lado
  cambiando de signo'. Es simplemente la aplicación de la regla de oro de la balanza.
explicacion_formal: '### Definición formal


  El atajo oculta el hecho de que en realidad estás aplicando la misma operación a
  la balanza completa.


  ### Desarrollo didáctico


  Visualiza una balanza en equilibrio:

  $x - 3 = 5$


  Queremos descubrir el valor de la $x$. Nos estorba el $-3$. ¿Cómo lo eliminamos?

  Agregándole $+3$.

  Pero, regla de oro: si pones $+3$ a la izquierda, debes poner $+3$ a la derecha
  para no romper la balanza.


  Matemáticamente:

  $x - 3 \mathbf{+ 3} = 5 \mathbf{+ 3}$

  El $-3$ y el $+3$ se anulan (dan $0$).

  $x = 8$.


  Esto es lo que tu profesor te enseñó como ''pasar al otro lado cambiando el signo''.
  Es un atajo genial, pero la verdad absoluta debajo de ese atajo es la **Propiedad
  Aditiva de la Igualdad**.'
definiciones_clave: '- **Uso de la propiedad aditiva de la igualdad (sumar o restar
  lo mismo en ambos miembros)**: Herramienta matemática para determinar valores desconocidos
  que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a uso de la propiedad aditiva de la igualdad
  (sumar o restar lo mismo en ambos miembros).'
