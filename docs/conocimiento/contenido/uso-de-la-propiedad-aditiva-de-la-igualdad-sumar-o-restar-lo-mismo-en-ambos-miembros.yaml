semantic_id: MAT.ALG.ECUACION_BASE.PROPIEDAD_ADITIVA
resumen_inicial: La propiedad aditiva establece que si se suma o resta una misma cantidad
  en ambos miembros de una igualdad, la igualdad se mantiene.
explicacion_simple: 'Imagina una balanza equilibrada.

  Si añades o quitas un peso idéntico de ambos platos al mismo tiempo, la balanza
  se mantendrá en perfecto equilibrio.

  Esta es la **propiedad aditiva**: nos permite sumar o restar cualquier término en
  ambos lados de una ecuación para aislar la incógnita sin alterar la igualdad.'
explicacion_formal: 'Para todas las expresiones $A, B, C \in \mathbb{R}$, la **propiedad
  aditiva de la igualdad** establece:


  $$A = B \iff A \pm C = B \pm C$$


  **Desglose de la fórmula:**

  - $A = B$: Igualdad inicial equivalente.

  - $A \pm C = B \pm C$: Adición o sustracción de la misma cantidad $C$ en el primer
  y segundo miembro simultáneamente.'
definiciones_clave: '- **Propiedad aditiva de la igualdad**: Ley que permite sumar
  o restar la misma expresión a ambos miembros preservando la equivalencia de la ecuación.

  - **Ecuaciones equivalentes**: Ecuaciones que poseen exactamente el mismo conjunto
  solución.'
propiedades_relaciones: '- **Fundamento de la transposición**: La famosa regla de
  ''lo que está sumando pasa restando'' es una consecuencia directa de aplicar la
  propiedad aditiva en ambos lados.'
ejemplo_guiado:
  enunciado: Aplica formalmente la propiedad aditiva para resolver la ecuación $x
    + 7 = 12$ restando $7$ en ambos miembros.
  pasos:
  - 'Paso 1: Escribir la ecuación inicial: $x + 7 = 12$.Paso 2: Aplicar la propiedad
    aditiva restando $7$ en ambos miembros: $(x + 7) - 7 = 12 - 7$.Paso 3: Cancelar
    $7 - 7 = 0$ en el primer miembro: $x + 0 = 5 \implies x = 5$.Paso 4: Verificar
    en la ecuación original: $5 + 7 = 12$ (se cumple la igualdad).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la propiedad aditiva de la igualdad para la ecuación $A
    = B$?
  choices:
  - text: Que $A + C = B + C$ para cualquier expresión $C$.
    is_correct: true
  - text: Que $A \cdot C = B + C$.
    is_correct: false
  - text: Que $A + C = B - C$.
    is_correct: false
  - text: Que $A - B = C$.
    is_correct: false
  explanation: La alternativa correcta es 'Que $A + C = B + C$ para cualquier expresión
    $C$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al aplicar la propiedad aditiva restando $7$ a ambos lados de $x + 7 =
    12$, ¿cuál es el valor deducido para $x$?
  choices:
  - text: $x = 5$
    is_correct: true
  - text: $x = 19$
    is_correct: false
  - text: $x = 7$
    is_correct: false
  - text: $x = -5$
    is_correct: false
  explanation: La alternativa correcta es '$x = 5$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el término numérico que acompaña a la incógnita.'
- 'Paso 2: Seleccionar el opuesto aditivo de dicho término (si está sumando, restar;
  si está restando, sumar).'
- 'Paso 3: Escribir la adición o sustracción de ese valor en AMBOS miembros de la
  ecuación.'
- 'Paso 4: Simplificar los términos semejantes en ambos lados.'
errores_correccion: '- **Error común:** Sumar o restar la cantidad en un solo lado
  de la ecuación.

  - **Cómo corregirlo:** La propiedad aditiva exige operarse en AMBOS miembros para
  mantener el equilibrio de la igualdad.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de igualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de igualdades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar la misma cantidad en ambos miembros preserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Una ecuación se cumple para todos los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una ecuación condicional solo se cumple para valores específicos.
errores_frecuentes:
- Confundir la definición de una igualdad numérica con la de una expresión algebraica.
- Asumir que las identidades solo son válidas para números enteros positivos.
- Confundir los miembros de una ecuación con sus términos individuales.
- Sumar o restar una cantidad en un solo lado de la ecuación al intentar despejar.
- Dividir ambos miembros de la ecuación entre cero.
afirmaciones_verdaderas:
- Una ecuación es una igualdad condicionada que se verifica solo para determinados
  valores de la incógnita.
- Aplicar las propiedades aditiva y multiplicativa en ambos miembros de una ecuación
  genera ecuaciones equivalentes.
al_terminar_debes_poder: Al finalizar este recurso podrás definir conceptos fundamentales
  de ecuaciones de primer grado y aplicar las propiedades de la igualdad.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Primer Grado
