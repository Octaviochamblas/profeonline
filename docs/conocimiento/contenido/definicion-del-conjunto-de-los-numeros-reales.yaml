semantic_id: MAT.NUM.REALES.DEFINICION
resumen_inicial: 'El conjunto de los números reales $\mathbb{R}$ es la estructura
  numérico-geométrica continua formada por la unión disjunta de los racionales y los
  irracionales: $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$.'
explicacion_simple: El conjunto de los números reales abarca absolutamente todos los
  números que podemos ubicar sobre la recta numérica continua. Incluye los números
  enteros, las fracciones, los números decimales periódicos y también los números
  irracionales con decimales infinitos sin patrón como $\pi$ o $\sqrt{2}$.
explicacion_formal: 'El conjunto de los **Números Reales** $(\mathbb{R}, +, \cdot,
  \le)$ se define axiómaticamente como el único **Cuerpo Ordenado Completo** (satisface
  el Axioma del Supremo):


  $$\mathbb{R} = \mathbb{Q} \cup \mathbb{I} \quad \text{con } \mathbb{Q} \cap \mathbb{I}
  = \emptyset$$


  **Desglose de la estructura:**

  - Completitud de Dedekind/Cantor: Todo subconjunto no vacío acotado superiormente
  en $\mathbb{R}$ posee supremo en $\mathbb{R}$ (no deja ''huecos'' en la recta numérica).

  - Densidad y continuidad: A cada punto de la recta le corresponde un único número
  real, y a cada número real le corresponde un único punto continuo.


  > **Complemento didáctico:** La completitud es lo que diferencia a $\mathbb{R}$
  de $\mathbb{Q}$; los números racionales dejan infinitos huecos que son ''llenados''
  por los números irracionales.'
definiciones_clave: '- **Números Reales ($\mathbb{R}$)**: Sistema numérico continuo
  formado por la unión de $\mathbb{Q}$ e $\mathbb{I}$, modelo de la recta matemática
  continua.'
propiedades_relaciones: '- **Completitud y orden**: Es un cuerpo ordenado completo
  sin huecos ni saltos discretos en su recta orientada.'
ejemplo_guiado:
  enunciado: 'Clasifique los siguientes números en el conjunto $\mathbb{R}$: $-5$,
    $\frac{3}{4}$, $\sqrt{2}$ y $\pi$.'
  pasos:
  - 'Paso 1: Analizar $-5$: es un número entero $\in \mathbb{Z} \subset \mathbb{Q}
    \subset \mathbb{R}$.'
  - 'Paso 2: Analizar $\frac{3}{4}$: es una fracción de enteros $\in \mathbb{Q} \subset
    \mathbb{R}$.'
  - 'Paso 3: Analizar $\sqrt{2}$: es una raíz no exacta $\in \mathbb{I} \subset \mathbb{R}$.'
  - 'Paso 4: Analizar $\pi$: es una constante trascendente $\in \mathbb{I} \subset
    \mathbb{R}$.'
  - 'Conclusión: Todos ellos pertenece al conjunto de los números reales $\mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la definición conjuntista básica de los números reales R?
  choices:
  - text: La unión disjunta de los racionales y los irracionales (R = Q U I)
    is_correct: true
  - text: La resta de los enteros menos los naturales
    is_correct: false
  - text: La intersección de Q e I
    is_correct: false
  - text: Solo los números decimales positivos
    is_correct: false
  explanation: La alternativa correcta es 'La unión disjunta de los racionales y los
    irracionales (R = Q U I)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuántos de los números dados (-5, 3/4, sqrt(2),
    pi) pertenecen a R?
  choices:
  - text: Los 4 números pertenecen a R
    is_correct: true
  - text: Solo los dos primeros
    is_correct: false
  - text: Solo pi y sqrt(2)
    is_correct: false
  - text: Ninguno
    is_correct: false
  explanation: La alternativa correcta es 'Los 4 números pertenecen a R'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Evaluar la naturaleza de un número (entero, racional fraccionario o irracional).'
- 'Paso 2: Comprobar su ubicación válida sobre el eje de la recta continua.'
- 'Paso 3: Clasificar el número como elemento perteneciente al conjunto de los números
  reales $\mathbb{R}$.'
errores_correccion: '- **Error 1: Creer que los números reales no incluyen a los enteros
  ni a los naturales.** **Cómo corregirlo:** Los reales $\mathbb{R}$ contienen a TODOS
  los conjuntos numéricos anteriores ($\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q}
  \subset \mathbb{R}$).


  - **Error 2: Pensar que las raíces de números negativos pertenecen a $\mathbb{R}$.**
  **Cómo corregirlo:** La raíz cuadrada de un negativo (como $\sqrt{-4}$) NO es real;
  pertenece al conjunto complejo $\mathbb{C}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es el número cero un elemento perteneciente a los números reales?
  alternativas:
  - Sí, 0 pertenece a Z, a Q y a R
  - No, el 0 es imaginario
  - Solo a los naturales
  respuesta: Sí, 0 pertenece a Z, a Q y a R
  solucion_pasos:
  - $0 \in \mathbb{Z} \subset \mathbb{R}$.
- titulo: Ejemplo 2
  enunciado: ¿Es la expresión $\sqrt{-9}$ un número real?
  alternativas:
  - No, las raíces pares de negativos no pertenecen a R
  - Sí, es igual a -3
  - Sí, es igual a 3
  respuesta: No, las raíces pares de negativos no pertenecen a R
  solucion_pasos:
  - $\sqrt{-9} = 3i \notin \mathbb{R}$ (es un número imaginario puro).
- titulo: ¿Forman Q e I una partición completa del conjunto de los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\mathbb{Q} \cup \mathbb{I} = \mathbb{R}$ y $\mathbb{Q} \cap \mathbb{I} =
    \emptyset$.
- titulo: ¿Es todo número racional un número real?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la inclusión $\mathbb{Q} \subset \mathbb{R}$.
errores_frecuentes:
- El conjunto de los números reales está formado exclusivamente por números decimales
  infinitos no periódicos.
- La raíz cuadrada de un entero negativo se clasifica como un número real negativo.
- Los números enteros se encuentran fuera del conjunto de los números reales.
- La intersección entre los números racionales e irracionales contiene únicamente
  al número 1.
- Los números reales dejan espacios vacíos en la recta numérica que son llenados por
  los naturales.
afirmaciones_verdaderas:
- El conjunto de los números reales $\mathbb{R}$ es la unión disjunta de los números
  racionales $\mathbb{Q}$ y los irracionales $\mathbb{I}$.
- Todo número natural, entero, racional o irracional es un número real.
al_terminar_debes_poder: Al terminar serás capaz de definir y caracterizar el conjunto
  de los números reales $\mathbb{R}$, reconociendo su estructura como la unión disjunta
  de racionales e irracionales.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
