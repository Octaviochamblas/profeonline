semantic_id: MAT.NUM.REALES.DEFINICION
resumen_inicial: 'El conjunto de los números reales ($\mathbb{R}$) es la unión del conjunto
  de los números racionales ($\mathbb{Q}$) y el conjunto de los números irracionales ($\mathbb{I}$):
  $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$.'
explicacion_simple: 'Los **números reales** abarcan a absolutamente todos los números que
  se pueden representar como puntos en la recta numérica continua:

  - Enteros: $-3, 0, 5$.

  - Fracciones/Decimales finitos o periódicos: $1/2, 0{,}75, 0{,}333...$

  - Irracionales: $\sqrt{2}, \pi, e$.

  Todos ellos forman el universo de los números reales ($\mathbb{R}$).'
explicacion_formal: 'El conjunto de los números reales $\mathbb{R}$ es un cuerpo ordenado
  y completo que resulta de la unión disjunta del conjunto de los números racionales $\mathbb{Q}$
  e irracionales $\mathbb{I}$: $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$ con $\mathbb{Q} \cap
  \mathbb{I} = \emptyset$.'
definiciones_clave: '- **Conjunto de los Reales ($\mathbb{R}$)**: Unión completa $\mathbb{Q}
  \cup \mathbb{I}$.'
propiedades_relaciones: '- **Completesa de la recta**: A cada punto de la recta real le corresponde
  un único número real y viceversa.'
ejemplo_guiado:
  enunciado: Indica si los números A) $-4$, B) $\frac{3}{5}$ y C) $\sqrt{7}$ pertenecen al
    conjunto de los números reales $\mathbb{R}$.
  pasos:
  - $-4 \in \mathbb{Z} \subset \mathbb{R}$ (Sí pertenece).
  - $\frac{3}{5} \in \mathbb{Q} \subset \mathbb{R}$ (Sí pertenece).
  - $\sqrt{7} \in \mathbb{I} \subset \mathbb{R}$ (Sí pertenece).
  - Concluir que los tres números pertenecen a $\mathbb{R}$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define analíticamente el conjunto de los números reales R?
  choices:
  - text: R = Q ∪ I (unión de racionales e irracionales)
    is_correct: true
  - text: R = Q ∩ I
    is_correct: false
  - text: R = N ∪ Z
    is_correct: false
  - text: R es el conjunto de las fracciones únicamente
    is_correct: false
  explanation: 'La correcta es: R = Q ∪ I (unión de racionales e irracionales). La unión de
    ambos conjuntos completa los reales.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Existe algún número real que no sea ni racional ni irracional?
  choices:
  - text: No, todo número real es o bien racional o bien irracional
    is_correct: true
  - text: Sí, los números negativos
    is_correct: false
  - text: Sí, el cero
    is_correct: false
  - text: Sí, los números decimales
    is_correct: false
  explanation: 'La correcta es: No, todo número real es o bien racional o bien irracional.
    Puesto que $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$ y $\mathbb{Q} \cap \mathbb{I} = \emptyset$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si el número es racional o irracional.'
- 'Paso 2: Como ambos pertenecen a $\mathbb{R}$, concluir su pertenencia al conjunto real.'
errores_correccion: No pienses que los irracionales no son reales. Los irracionales son una
  parte fundamental de los reales.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\pi \in \mathbb{R}$?
  alternativas:
  - Sí
  - 'No'
  respuesta: Sí
  solucion_pasos:
  - $\pi \in \mathbb{I} \subset \mathbb{R}$.
- titulo: Ejemplo 2
  enunciado: ¿A qué conjunto pertenece el número -7?
  alternativas:
  - Z ⊂ R
  - Solo a N
  - No es un número real
  respuesta: Z ⊂ R
  solucion_pasos:
  - -7 es un entero, y todo entero es también un número real.
- titulo: Ejemplo 3
  enunciado: ¿Cuál de los siguientes NO es un número real?
  alternativas:
  - √-4 (raíz de un número negativo)
  - √4
  - -3/5
  respuesta: √-4 (raíz de un número negativo)
  solucion_pasos:
  - La raíz cuadrada de un número negativo no está definida en los números reales.
- titulo: ¿0,777... (periódico) pertenece a R?
  respuesta: Sí
  solucion_pasos:
  - Es racional, y todo número racional es también real.
errores_frecuentes:
- Excluir a los números irracionales del conjunto de los números reales.
- Creer que los números irracionales no forman parte de los números reales.
- Pensar que existen números reales que no son ni racionales ni irracionales.
- Confundir el conjunto de los números reales con solo los números positivos.
- Creer que un número decimal siempre es irracional, sin verificar si tiene periodo.
afirmaciones_verdaderas:
- $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$.
- Todo número real es racional o irracional, pero nunca ambos a la vez.
al_terminar_debes_poder: Comprender la estructura del conjunto de los números reales como
  la unión de racionales e irracionales.
fuente: Texto escolar MINEDUC.
estado: publicado
