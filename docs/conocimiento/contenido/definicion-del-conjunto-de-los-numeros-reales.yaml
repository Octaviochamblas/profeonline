guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.02.01'
  title: 'Definición del conjunto de los números reales'
  description: 'Comprende el conjunto de los números reales (R) como la totalidad de números expresables en la recta numérica continua.'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'definicion-del-conjunto-de-los-numeros-reales'
semantic_id: 'MAT.NUM.REALES.DEFINICION'
titulo: 'Definición del conjunto de los números reales'
objetivo: 'Definir el conjunto de los números reales $\mathbb{R}$ y comprender su correspondencia biunívoca con los puntos de la recta numérica.'
introduccion: 'Para medir cualquier magnitud física continua (como distancias, tiempos, temperaturas o masas), la matemática utiliza el conjunto de los **números reales** ($\mathbb{R}$). Este conjunto engloba a todos los números conocidos en la aritmética escolar hasta este punto: desde los enteros hasta las fracciones y las raíces irracionales como $\sqrt{2}$ o $\pi$. A cada punto de una recta infinita le corresponde exactamente un número real, y a cada número real le corresponde un único punto en dicha recta.'
resumen: 'El conjunto de los **números reales** ($\mathbb{R}$) es la unión disjunta de los números racionales ($\mathbb{Q}$) y los números irracionales ($\mathbb{I}$): $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$. Todo número real tiene una representación decimal (finita, periódica o infinita no periódica) y ocupa una posición continua y densa en la recta numérica.'
requisitos:
  - 'Definición y propiedades de los números racionales $\mathbb{Q}$.'
  - 'Definición y propiedades de los números irracionales $\mathbb{I}$.'
objetivos:
  - 'Definir formalmente el conjunto de los números reales $\mathbb{R}$.'
  - 'Asociar el conjunto $\mathbb{R}$ a la recta numérica continua y completa.'
que_aprenderas:
  - 'La estructura completa del conjunto $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$.'
  - 'El concepto de la recta numérica continua sin vacíos o fisuras.'
  - 'Cómo clasificar cualquier número conocido dentro del conjunto de los reales.'
al_terminar_debes_poder:
  - 'Identificar si un número dado pertenece al conjunto de los números reales $\mathbb{R}$.'
  - 'Explicar por qué la unión de racionales e irracionales completa la recta numérica.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: '¿Cuál es la definición matemática del conjunto de los números reales $\mathbb{R}$?'
    choices:
      - {text: 'Es la intersección entre los números naturales y los enteros.', is_correct: false}
      - {text: 'Es el conjunto formado por la unión de los números racionales $\mathbb{Q}$ e irracionales $\mathbb{I}$.', is_correct: true}
      - {text: 'Es únicamente el conjunto de las fracciones positivas.', is_correct: false}
      - {text: 'Es el conjunto de todos los números que no tienen decimales.', is_correct: false}
    explanation: 'La correcta es: Es el conjunto formado por la unión de los números racionales $\mathbb{Q}$ e irracionales $\mathbb{I}$. Formalmente $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: '¿Qué propiedad geométrica caracteriza al conjunto de los números reales en relación con la recta numérica?'
    choices:
      - {text: 'Deja espacios vacíos entre cada número entero.', is_correct: false}
      - {text: 'Existe una correspondencia uno a uno (biunívoca) entre cada número real y cada punto de la recta.', is_correct: true}
      - {text: 'Solo permite ubicar números enteros y fracciones sencillas.', is_correct: false}
      - {text: 'Los números reales se ubican únicamente en el semieje positivo.', is_correct: false}
    explanation: 'La correcta es: Existe una correspondencia uno a uno (biunívoca) entre cada número real y cada punto de la recta. Esta propiedad se conoce como la continuidad de la recta real.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Evaluar la naturaleza de un número dado (si es entero, fracción, decimal o radical).'
  - 'Paso 2: Comprobar si se puede clasificar en $\mathbb{Q}$ (racional) o en $\mathbb{I}$ (irracional).'
  - 'Paso 3: Si pertenece a $\mathbb{Q}$ o a $\mathbb{I}$, concluir que el número es un número real ($\in \mathbb{R}$).'
errores_frecuentes:
  - 'Creer que los números reales solo incluyen los enteros y decimales finitos, excluyendo las raíces irracionales.'
  - 'Confundir un número no real (como la raíz cuadrada de un número negativo $\sqrt{-4}$) con un número real irracional.'
errores_correccion: 'Es un error común pensar que $\sqrt{-9}$ es un número irracional real. Recuerda: las raíces pares de números negativos no son números reales (pertenecen al conjunto de los números complejos $\mathbb{C}$). Los irracionales son números reales positivos o negativos cuyo radicando en raíz par es positivo.'
ejemplos:
  - titulo: 'Pertenencia al conjunto R'
    enunciado: 'Indica cuál de los siguientes elementos NO pertenece al conjunto de los números reales $\mathbb{R}$.'
    alternativas:
      - '$-\sqrt{5}$'
      - '$\frac{22}{7}$'
      - '$\sqrt{-16}$'
      - '$0$'
    respuesta: '$\sqrt{-16}$'
    solucion_pasos:
      - '$-\sqrt{5}$ es un número irracional negativo, luego $-\sqrt{5} \in \mathbb{I} \subset \mathbb{R}$.'
      - '$\frac{22}{7}$ es una fracción racional, luego $\frac{22}{7} \in \mathbb{Q} \subset \mathbb{R}$.'
      - '$0$ es un entero, luego $0 \in \mathbb{Z} \subset \mathbb{R}$.'
      - '$\sqrt{-16}$ es la raíz cuadrada de un número negativo, la cual no tiene solución en el campo real. Por ende, $\sqrt{-16} \notin \mathbb{R}$.'
  - titulo: 'Clasificación completa en los reales'
    enunciado: 'Dado el conjunto de números $S = \{-3, 0{,}75, \sqrt{2}, \pi, \sqrt{16}\}$, ¿cuántos de ellos son números reales?'
    alternativas:
      - 'Solo 2'
      - 'Solo 3'
      - 'Solo 4'
      - 'Todos (los 5 elementos)'
    respuesta: 'Todos (los 5 elementos)'
    solucion_pasos:
      - '$-3 \in \mathbb{Z} \subset \mathbb{R}$.'
      - '$0{,}75 = \frac{3}{4} \in \mathbb{Q} \subset \mathbb{R}$.'
      - '$\sqrt{2} \in \mathbb{I} \subset \mathbb{R}$.'
      - '$\pi \in \mathbb{I} \subset \mathbb{R}$.'
      - '$\sqrt{16} = 4 \in \mathbb{N} \subset \mathbb{R}$.'
      - 'Por lo tanto, todos los 5 elementos del conjunto $S$ pertenecen a $\mathbb{R}$.'
comprobacion_rapida:
  - afirmacion: 'Todo número entero es también un número real.'
    respuesta: true
    explicacion: 'Correcto. $\mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$.'
  - afirmacion: 'La unión del conjunto de los números racionales $\mathbb{Q}$ con el de los irracionales $\mathbb{I}$ forma el conjunto $\mathbb{R}$.'
    respuesta: true
    explicacion: 'Correcto. Es la definición conjuntista de los números reales.'
  - afirmacion: 'La raíz cuadrada de $-25$ ($\sqrt{-25}$) es un número real irracional.'
    respuesta: false
    explicacion: 'Falso. No existe ningún número real que al elevarse al cuadrado dé $-25$. $\sqrt{-25} = 5i$ es un número imaginario.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales.'
estado: 'publicado'
