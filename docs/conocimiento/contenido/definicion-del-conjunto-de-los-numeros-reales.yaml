semantic_id: MAT.NUM.REALES.DEFINICION
resumen_inicial: El conjunto de los números reales ($\mathbb{R}$) es el sistema numérico continuo formado por la unión de todos los números racionales y todos los números irracionales.
explicacion_simple: '![Definición del conjunto de los números reales](/static/img/nodos/definicion-del-conjunto-de-los-numeros-reales-intro.svg)


  Los números reales ($\mathbb{R}$) son todos los números que podemos ubicar en la recta numérica continua. Agrupan tanto a los números que se pueden escribir como fracción (enteros, positivos, negativos, decimales finitos y periódicos en $\mathbb{Q}$) como a los números con infinitos decimales aperiódicos (como $\sqrt{2}, \pi, e, \phi$ en $\mathbb{I}$).'
explicacion_formal: 'El conjunto de los **Números Reales** $\mathbb{R}$ se define como el cuerpo conmutativo ordenado y completo que resulta de la unión disjunta de los números racionales $\mathbb{Q}$ y los números irracionales $\mathbb{I}$:


  $$\mathbb{R} = \mathbb{Q} \cup \mathbb{I} \quad \text{con} \quad \mathbb{Q} \cap \mathbb{I} = \emptyset$$


  **Estructura axiomática de los reales:**

  - **Cuerpo algebraico:** Cumple todas las propiedades de clausura, conmutatividad, asociatividad, distributividad y existencia de inversos aditivos y multiplicativos (excepto división por cero).

  - **Orden total:** Satisface la ley de tricotomía ($a < b$, $a = b$ o $a > b$).

  - **Axioma de completitud (Axioma del Supremo):** Todo subconjunto no vacío de $\mathbb{R}$ acotado superiormente posee un supremo en $\mathbb{R}$. Esto garantiza que la recta real no tiene ''agujeros''.


  > **Complemento didáctico:** Expresiones como $\frac{a}{0}$ (indefinición) o $\sqrt{-4}$ (número imaginario $2i$) **NO** pertenecen al conjunto de los números reales $\mathbb{R}$.'
definiciones_clave: '- **Números reales ($\mathbb{R}$)**: Conjunto $\mathbb{Q} \cup \mathbb{I}$ que abarca la totalidad del continuo numérico.

  - **Axioma de completitud**: Propiedad analítica que distingue a $\mathbb{R}$ de $\mathbb{Q}$, llenando todos los puntos de la recta.

  - **Número no real**: Expresiones fuera de $\mathbb{R}$, como divisiones por cero o raíces pares de números negativos.'
propiedades_relaciones: '- **Inclusión jerárquica**: $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$ e $\mathbb{I} \subset \mathbb{R}$.

  - **Partición canónica**: $\mathbb{R} \setminus \mathbb{Q} = \mathbb{I}$ y $\mathbb{R} \setminus \mathbb{I} = \mathbb{Q}$.

  - **Continuo unidimensional**: Biyección total entre los números reales y los puntos geométricos de la recta.'
ejemplo_guiado:
  enunciado: '![Ejemplos de definición de números reales](/static/img/nodos/definicion-del-conjunto-de-los-numeros-reales-ejemplos.svg)


    Clasifique los números $-5$, $\sqrt{7}$ y $\sqrt{-4}$, indicando si pertenecen o no al conjunto de los números reales $\mathbb{R}$ y a qué subconjunto específico corresponden.'
  pasos:
  - 'Paso 1: Evaluar $-5$: Es un número entero negativo. Se puede escribir como $\frac{-5}{1} \in \mathbb{Q}$. Como $\mathbb{Q} \subset \mathbb{R}$, $-5 \in \mathbb{R}$ (Real Racional).'
  - 'Paso 2: Evaluar $\sqrt{7}$: Como $7$ es un número primo, su raíz cuadrada tiene infinitos decimales no periódicos ($\sqrt{7} \in \mathbb{I}$). Al ser $\mathbb{I} \subset \mathbb{R}$, $\sqrt{7} \in \mathbb{R}$ (Real Irracional).'
  - 'Paso 3: Evaluar $\sqrt{-4}$: Es una raíz de índice par ($2$) con radicando negativo. No existe ningún número real cuyo cuadrado sea negativo ($x^2 = -4$ no tiene solución en $\mathbb{R}$).'
  - 'Paso 4: Concluir para $\sqrt{-4}$: $\sqrt{-4} = 2i \notin \mathbb{R}$ (es un número imaginario que pertenece a los números complejos $\mathbb{C}$).'
  - 'Conclusión: $-5 \in \mathbb{R}$ (racional), $\sqrt{7} \in \mathbb{R}$ (irracional) y $\sqrt{-4} \notin \mathbb{R}$ (no real).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes expresiones NO representa un número real?
  choices:
  - text: $\sqrt{-9}$ (raíz cuadrada de un número negativo)
    is_correct: true
  - text: $-\sqrt{9}$ (el opuesto de tres)
    is_correct: false
  - text: $\sqrt[3]{-8}$ (raíz cúbica de menos ocho)
    is_correct: false
  - text: $\frac{0}{5}$ (el número cero)
    is_correct: false
  explanation: La alternativa correcta es '$\sqrt{-9}$ (raíz cuadrada de un número negativo)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\sqrt{7}$ pertenece a los números reales $\mathbb{R}$?
  choices:
  - text: Porque es un número irracional y todos los irracionales pertenecen a los reales
    is_correct: true
  - text: Porque es un número entero positivo
    is_correct: false
  - text: Porque se puede escribir como fracción exacta
    is_correct: false
  - text: Porque es un decimal finito
    is_correct: false
  explanation: La alternativa correcta es 'Porque es un número irracional y todos los irracionales pertenecen a los reales'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar si la expresión está matemáticamente definida en $\mathbb{R}$ (descartar divisiones por cero y raíces pares de números negativos).'
- 'Paso 2: Clasificar el número dentro de los racionales ($\mathbb{Q}$) si es entero, fraccionario o decimal periódico, o dentro de los irracionales ($\mathbb{I}$) si proviene de raíces no exactas o constantes trascendentes.'
- 'Paso 3: Concluir su pertenencia unívoca al conjunto de los números reales $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$.'
errores_correccion: '- **Error 1: Creer que las raíces cúbicas de números negativos no son reales.** **Cómo corregirlo:** Las raíces de índice IMPAR de negativos SÍ son reales (ej: $\sqrt[3]{-8} = -2 \in \mathbb{R}$ porque $(-2)^3 = -8$). Solo las raíces de índice PAR de negativos no son reales.

  - **Error 2: Pensar que los números irracionales están fuera de los reales.** **Cómo corregirlo:** Los irracionales son parte fundamental e intrínseca de los números reales ($\mathbb{I} \subset \mathbb{R}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Pertenece el número $-\frac{22}{7}$ al conjunto de los números reales?
  alternativas:
  - Sí, es un número real racional porque es cociente de dos enteros
  - No, porque los números negativos no son reales
  - No, porque es un número imaginario
  respuesta: Sí, es un número real racional porque es cociente de dos enteros
  solucion_pasos:
  - $-\frac{22}{7} \in \mathbb{Q} \subset \mathbb{R}$.
- titulo: Ejemplo 2
  enunciado: ¿Es $\sqrt{-16}$ un número real?
  alternativas:
  - No, es un número imaginario (4i) y no pertenece a R
  - Sí, es igual a -4
  - Sí, es un número irracional
  respuesta: No, es un número imaginario (4i) y no pertenece a R
  solucion_pasos:
  - Las raíces cuadradas de números negativos no tienen solución en $\mathbb{R} \implies \sqrt{-16} \notin \mathbb{R}$.
- titulo: ¿Es todo número irracional un número real?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\mathbb{I} \subset \mathbb{R}$, todos los irracionales son números reales.
  alternativas:
  - texto: Sí, todos los irracionales pertenecen a los reales
    es_correcta: true
    retroalimentacion: ¡Correcto! $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$.
  - texto: No, son conjuntos completamente separados
    es_correcta: false
    retroalimentacion: Incorrecto, $\mathbb{I}$ está contenido dentro de $\mathbb{R}$.
  - texto: Solo las raíces cuadradas
    es_correcta: false
    retroalimentacion: Incorrecto, incluye trascendentes como $\pi$ y $e$.
- titulo: ¿Es la división 5 / 0 un número real?
  respuesta: 'No'
  solucion_pasos:
  - No, la división por cero no está definida en ningún sistema numérico.
  alternativas:
  - texto: No, la división por cero está indefinida
    es_correcta: true
    retroalimentacion: ¡Correcto! No existe como número real.
  - texto: Sí, es igual a infinito
    es_correcta: false
    retroalimentacion: Incorrecto, el infinito es un concepto límite, no un número real.
  - texto: Sí, es igual a cero
    es_correcta: false
    retroalimentacion: Incorrecto, $0/5 = 0$, pero $5/0$ no existe.
errores_frecuentes:
- Confundir un número irracional con un número imaginario o no real.
- Afirmar que $\sqrt{-25} = -5$ sin advertir que $(-5)^2 = +25$.
- Pensar que $\frac{0}{4}$ no es un número real cuando en realidad es el real $0$.
- Creer que los números decimales periódicos pertenecen a los irracionales.
- Asumir que $\pi$ no se puede ubicar en la recta numérica.
afirmaciones_verdaderas:
- El conjunto de los números reales es la unión de los racionales y los irracionales ($\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$).
- Cualquier punto en la recta numérica corresponde a un único número real.
- Las raíces de índice par de números negativos no son números reales.
al_terminar_debes_poder: '![Síntesis de definición de números reales](/static/img/nodos/definicion-del-conjunto-de-los-numeros-reales-resumen.svg)


  QUÉ: Definir e identificar formalmente el conjunto de los números reales ($\mathbb{R}$).


  CÓMO: Reconociendo la unión exhaustiva y disjunta $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$ con $\mathbb{Q} \cap \mathbb{I} = \emptyset$, verificando las condiciones de existencia de las expresiones numéricas y descartando cantidades no reales como raíces pares de negativos y divisiones por cero.'
fuente: Texto escolar MINEDUC — Matemática 8° Básico / 1° Medio / PAES.
