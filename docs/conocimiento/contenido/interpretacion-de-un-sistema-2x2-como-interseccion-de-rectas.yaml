procedimiento:
- Toma una ecuación del sistema.
- Encuentra al menos dos puntos (pares x,y) que la satisfagan (por ejemplo, si x=0
  cuánto vale y, y viceversa).
- Dibuja esos puntos en el plano y únelos con una recta.
- Repite el proceso para la segunda ecuación.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en interpretación de un sistema 2x2 como intersección de rectas.
ejemplos:
- titulo: $2x + y = 5$ y $(x,y)$
  enunciado: Justifica el procedimiento adecuado para el caso $2x + y = 5$ y $(x,y)$.
  solucion_pasos:
  - "Aquí es donde el álgebra de letras se convierte en geometría visual. \nToda ecuación\
    \ lineal con dos variables (como $2x + y = 5$) es, en realidad, las instrucciones\
    \ para dibujar una línea recta perfecta en un gráfico de coordenadas $(x,y)$."
  - Toma una ecuación del sistema.
