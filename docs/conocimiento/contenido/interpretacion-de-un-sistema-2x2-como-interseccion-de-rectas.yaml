semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.INTERPRETACION_RECTAS
resumen_inicial: 'Interpretación de un sistema 2x2 como intersección de rectas: propiedades,
  resolución y modelamiento en Representación y clasificación de sistemas 2x2.'
explicacion_simple: Si tomas todos los pares de números que hacen que $2x + y = 5$
  sea verdad, y pones un puntito por cada uno, verás que forman una recta continua.
explicacion_formal: '### Definición formal


  El conjunto solución de una ecuación lineal $ax+by=c$ (con $a, b$ no ambos nulos)
  es geométricamente una recta en el plano cartesiano. Por tanto, el conjunto solución
  de un sistema de dos ecuaciones lineales corresponde a la intersección de las dos
  rectas asociadas, cuya cardinalidad (un punto, ninguno o infinitos) depende de su
  posición relativa.


  ### Desarrollo didáctico


  Si tomas todos los pares de números que hacen que $2x + y = 5$ sea verdad, y pones
  un puntito por cada uno, verás que forman una recta continua.

  Por lo tanto, un sistema de dos ecuaciones 2x2 son simplemente **dos líneas rectas
  dibujadas en el mismo mapa**.'
definiciones_clave: '- **Interpretación de un sistema 2x2 como intersección de rectas**:
  Herramienta matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a interpretación de un sistema 2x2 como intersección
  de rectas.'
