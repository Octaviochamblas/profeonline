semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.INTERPRETACION_RECTAS
resumen_inicial: Cada ecuación lineal de primer grado $ax + by = c$ representa una línea recta en el plano cartesiano; la solución del sistema es el punto geométrico de intersección entre ambas rectas.
explicacion_simple: |
  Cualquier ecuación lineal de dos variables $ax + by = c$ se puede graficar en el plano cartesiano $xOy$ como una línea recta continua.

  Cuando agrupamos dos ecuaciones lineales en un sistema $2 \times 2$, estamos graficando simultáneamente dos rectas en el plano.

  Si las dos rectas se cruzan en un punto $(x, y)$, las coordenadas cartesianas de ese punto de intersección constituyen precisamente la solución única del sistema de ecuaciones.
explicacion_formal: |
  ### Definición formal
  Dada la ecuación lineal $a_i x + b_i y = c_i$, su forma afín explícita equivale a la recta $L_i: y = -\frac{a_i}{b_i} x + \frac{c_i}{b_i}$ con pendiente $m_i = -\frac{a_i}{b_i}$ ($b_i \neq 0$).

  La **solución geométrica del sistema 2x2** corresponde a la intersección puntual del conjunto topológico:

  $$(x_0, y_0) = L_1 \cap L_2 \iff \begin{cases} a_1 x_0 + b_1 y_0 = c_1 \\ a_2 x_0 + b_2 y_0 = c_2 \end{cases}$$

  ### Desglose de la fórmula
  - $m_1, m_2$: Pendientes geométricas de las rectas $L_1$ y $L_2$.
  - $(x_0, y_0)$: Punto de contacto compartido por las dos rectas en el plano $\mathbb{R}^2$.

  ### Síntesis didáctica
  La existencia y cantidad de soluciones algebraicas está estrictamente ligada al comportamiento relativo de las dos rectas asociadas.
definiciones_clave: |
  - **Representación gráfica de un sistema 2x2**: Trazado cartesiano de las dos rectas asociadas a las ecuaciones del sistema.
  - **Punto de intersección**: Coordenada única $(x_0, y_0)$ que pertenece simultáneamente a ambas rectas cartesianas.
propiedades_relaciones: |
  - **Correspondencia algebraico-geométrica**: Un punto de intersección único equivale a una solución única; la ausencia de cruce equivale a la incompatibilidad.
  - **Pendientes distintas**: Si $m_1 \neq m_2$, las rectas son secantes y garantizan un punto de corte único.
ejemplo_guiado:
  enunciado: 'Expresa en forma explícita las rectas del sistema $\begin{cases} x + y = 4 \\ 2x - y = 2 \end{cases}$, determina sus pendientes y calcula su punto geométrico de intersección.'
  pasos:
    - 'Paso 1: Expresar la primera recta en forma explícita despejando $y$: $L_1: y = -x + 4$ (pendiente $m_1 = -1$).'
    - 'Paso 2: Expresar la segunda recta en forma explícita despejando $y$: $L_2: y = 2x - 2$ (pendiente $m_2 = 2$).'
    - 'Paso 3: Igualar las ecuaciones explícitas: $-x + 4 = 2x - 2 \implies 6 = 3x \implies x = 2$.'
    - 'Paso 4: Calcular la coordenada $y$: $y = 2(2) - 2 = 2$.'
    - 'Paso 5: Concluir que las rectas $L_1$ y $L_2$ se cortan en el punto del plano $(x, y) = (2, 2)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué representa geométricamente en el plano cartesiano la solución única $(x, y)$ de un sistema de ecuaciones 2x2?'
    choices:
      - {text: 'El punto exacto de intersección entre las dos rectas asociadas a las ecuaciones.', is_correct: true}
      - {text: 'El área del triángulo comprendido entre las rectas y los ejes.', is_correct: false}
      - {text: 'La distancia euclidiana más corta hacia el origen.', is_correct: false}
      - {text: 'El punto de origen $(0,0)$ del plano cartesiano.', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto exacto de intersección entre las dos rectas asociadas a las ecuaciones.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al graficar las rectas $y = -x + 4$ y $y = 2x - 2$, ¿en qué punto del plano cartesiano se intersecan?'
    choices:
      - {text: '$(2, 2)$', is_correct: true}
      - {text: '$(4, 2)$', is_correct: false}
      - {text: '$(0, 4)$', is_correct: false}
      - {text: '$(1, 3)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(2, 2)$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Despejar la variable $y$ en ambas ecuaciones para obtener sus formas afines explícitas $y = mx + n$.'
  - 'Paso 2: Calcular las pendientes $m_1$ y $m_2$ observando si son distintas ($m_1 \neq m_2$).'
  - 'Paso 3: Trazar las dos rectas en el plano cartesiano identificando sus puntos de paso.'
  - 'Paso 4: Determinar las coordenadas del punto de cruce $(x_0, y_0)$ donde ambas rectas se cortan.'
errores_correccion: |
  - **Error 1:** Confundir el punto de intersección de las rectas entre sí con los cortes individuales de cada recta con los ejes coordenados. **Cómo corregirlo:** La solución del sistema **CORRESPONDE EXCLUSIVAMENTE AL PUNTO COMPARTIDO $(x_0, y_0)$ DONDE LAS DOS RECTAS SE SECTAN ENTRE SÍ, NO DONDE CORTAN AL EJE X O AL EJE Y**.
  - **Error 2:** Invertir el orden de las coordenadas $(x, y)$ al leer la intersección en el gráfico. **Cómo corregirlo:** La primera componente del par ordenado **CORRESPONDE AL EJE HORIZONTAL $x$ Y LA SEGUNDA AL EJE VERTICAL $y$ (ESCRIBIR $(x, y)$)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Las rectas $y = x + 1$ e $y = -x + 3$ se intersecan en un punto. Determina sus coordenadas.'
    alternativas:
      - '$(1, 2)$'
      - '$(2, 1)$'
      - '$(0, 3)$'
    respuesta: '$(1, 2)$'
    solucion_pasos:
      - '1. Igualar: $x + 1 = -x + 3 \implies 2x = 2 \implies x = 1$.'
      - '2. Sustituir: $y = 1 + 1 = 2$. Punto: $(1, 2)$.'
  - titulo: 'Ejemplo 2'
    enunciado: '¿Cuál es la pendiente de la recta asociada a la ecuación $2x + y = 5$?'
    alternativas:
      - '$m = -2$'
      - '$m = 2$'
      - '$m = 5$'
    respuesta: '$m = -2$'
    solucion_pasos:
      - '1. Despejar $y$: $y = -2x + 5$.'
      - '2. El coeficiente de $x$ es $m = -2$.'
  - titulo: 'Rectas secantes'
    enunciado: '¿Un sistema con solución única se representa en el gráfico mediante dos rectas secantes?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, dos rectas secantes se cortan en un único punto.'
  - titulo: 'Pendientes distintas'
    enunciado: '¿Tener pendientes distintas ($m_1 \neq m_2$) garantiza que dos rectas se cortarán en un punto?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en el plano dos rectas no paralelas siempre se intersecan.'
errores_frecuentes:
  - 'En el plano cartesiano, la solución $(x, y) = (2, 2)$ representa la intersección de cada recta con el eje de las ordenadas en lugar del punto de cruce entre ambas rectas.'
  - 'Al leer las coordenadas del punto de intersección $(2, 2)$ en el plano cartesiano, se invierte el orden declarando la componente vertical como la primera variable.'
  - 'Dos rectas del plano que poseen pendientes distintas $m_1 \neq m_2$ son paralelas disjuntas y carecen de un punto de intersección común.'
  - 'Al expresar la ecuación $2x + y = 5$ en su forma explícita $y = mx + n$, la pendiente se calcula como $m = 2$ en lugar de $m = -2$.'
  - 'La intersección puntual $(x_0, y_0)$ entre dos rectas secantes depende de la posición del punto de origen $(0, 0)$ del plano.'
afirmaciones_verdaderas:
  - 'Cada ecuación de primer grado con dos incógnitas representa una recta en el plano cartesiano.'
  - 'El punto de intersección entre las dos rectas asociadas a un sistema 2x2 corresponde a su solución algebraica $(x, y)$.'
al_terminar_debes_poder: |
  QUÉ: Interpretar geométricamente un sistema de ecuaciones lineales 2x2 como la intersección de dos rectas en el plano cartesiano.
  CÓMO: Transformar las ecuaciones a su forma explícita $y = mx + n$, graficar las rectas y ubicar el punto de contacto $(x_0, y_0)$.
