semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.INTERPRETACION_RECTAS
resumen_inicial: Cada ecuación lineal $ax + by = c$ representa una recta en el plano
  cartesiano; la solución del sistema es el punto geométrico de intersección.
explicacion_simple: 'Cualquier ecuación lineal de dos variables $ax + by = c$ se puede
  graficar en el plano cartesiano como una línea recta.

  Cuando juntamos dos ecuaciones en un sistema 2x2, estamos graficando dos rectas
  al mismo tiempo.

  Si las rectas se cortan en un punto $(x, y)$, las coordenadas de ese punto son precisamente
  la solución del sistema de ecuaciones.'
explicacion_formal: 'Dada la ecuación lineal $a_i x + b_i y = c_i$, su forma afín
  explícita es la recta $L_i: y = -\frac{a_i}{b_i} x + \frac{c_i}{b_i}$ con pendiente
  $m_i = -\frac{a_i}{b_i}$ ($b_i \neq 0$).

  La **solución geométrica del sistema 2x2** corresponde a la intersección del espacio
  topológico:


  $$(x_0, y_0) = L_1 \cap L_2 \iff \begin{cases} a_1 x_0 + b_1 y_0 = c_1 \\ a_2 x_0
  + b_2 y_0 = c_2 \end{cases}$$


  **Desglose de la fórmula:**

  - $m_1, m_2$: Pendientes de las rectas asociadas a la primera y segunda ecuación.'
definiciones_clave: '- **Representación gráfica de un sistema 2x2**: Trazado de las
  dos rectas asociadas en el plano cartesiano $xOy$.

  - **Punto de intersección**: Coordenada única $(x_0, y_0)$ compartida por ambas
  rectas.'
propiedades_relaciones: '- **Correspondencia algebraico-geométrica**: El número de
  puntos de intersección entre las rectas determina el número de soluciones del sistema.'
ejemplo_guiado:
  enunciado: Expresa en forma explícita las rectas del sistema $\begin{cases} x +
    y = 4 \\ 2x - y = 2 \end{cases}$, determina sus pendientes y calcula su punto
    geométrico de intersección.
  pasos:
  - 'Paso 1: Expresar la primera recta en forma afín explícita: $L_1: y = -x + 4$
    (pendiente $m_1 = -1$).Paso 2: Expresar la segunda recta en forma afín explícita:
    $L_2: y = 2x - 2$ (pendiente $m_2 = 2$).Paso 3: Igualar las ecuaciones explícitas:
    $-x + 4 = 2x - 2 \implies 6 = 3x \implies x = 2$.Paso 4: Calcular $y$: $y = 2(2)
    - 2 = 2$.Paso 5: Concluir que las rectas $L_1$ y $L_2$ se intersectan en el punto
    del plano $(x, y) = (2, 2)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa geométricamente en el plano cartesiano la solución única
    $(x, y)$ de un sistema de ecuaciones 2x2?
  choices:
  - text: El punto exacto de intersección entre las dos rectas asociadas a las ecuaciones.
    is_correct: true
  - text: El área comprendida entre las dos rectas y el eje $x$.
    is_correct: false
  - text: La distancia más corta entre los dos ejes coordenados.
    is_correct: false
  - text: El punto de origen $(0,0)$ del plano cartesiano.
    is_correct: false
  explanation: La alternativa correcta es 'El punto exacto de intersección entre las
    dos rectas asociadas a las ecuaciones.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al graficar las rectas $y = -x + 4$ y $y = 2x - 2$, ¿en qué punto del
    plano cartesiano se cortan?
  choices:
  - text: $(2, 2)$
    is_correct: true
  - text: $(4, 2)$
    is_correct: false
  - text: $(0, 4)$
    is_correct: false
  - text: $(1, 3)$
    is_correct: false
  explanation: La alternativa correcta es '$(2, 2)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Despejar la variable $y$ en ambas ecuaciones para obtener la forma explícita
  $y = mx + n$.'
- 'Paso 2: Trazar la primera recta $L_1$ ubicando dos puntos del plano.'
- 'Paso 3: Trazar la segunda recta $L_2$ ubicando dos puntos del plano.'
- 'Paso 4: Identificar las coordenadas del punto de corte $(x_0, y_0)$ entre ambas
  rectas.'
errores_correccion: '- **Error común:** Pensar que la solución del sistema es el punto
  donde la recta corta al eje $x$ o al eje $y$.

  - **Cómo corregirlo:** La solución es el punto de intersección ENTRE LAS DOS RECTAS,
  no con los ejes coordenados.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de clasificación.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de clasificación.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un sistema con solución única se representa por dos rectas secantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, se cortan en un único punto del plano.
- titulo: ¿Dos rectas paralelas representan un sistema sin solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, al no tener puntos en común no existe solución.
errores_frecuentes:
- Confundir las condiciones de proporcionalidad para solución única y sin solución.
- Asumir que la lectura gráfica sustituye la comprobación algebraica en las ecuaciones.
- Olvidar incluir el término constante al evaluar la condición de infinitas soluciones.
- Invertir los ejes $x$ e $y$ al leer las coordenadas de intersección del gráfico.
- Confundir la igualdad de pendientes con la coincidencia total de las rectas.
afirmaciones_verdaderas:
- Un sistema 2x2 es compatible determinado si las rectas asociadas tienen pendientes
  distintas y se cortan en un único punto.
- Si las razones de los coeficientes de $x$ e $y$ son iguales pero distintas a la
  razón de las constantes, el sistema es incompatible.
al_terminar_debes_poder: Al finalizar este recurso podrás clasificar sistemas 2x2
  e interpretar sus soluciones desde la perspectiva geométrica y paramétrica.
