    pones un puntito por cada uno, verás que forman una recta continua.

    Por lo tanto, un sistema de dos ecuaciones 2x2 son simplemente **dos líneas rectas
    dibujadas en el mismo mapa**.'
  - Encuentra al menos dos puntos (pares x,y) que la satisfagan (por ejemplo, si x=0
