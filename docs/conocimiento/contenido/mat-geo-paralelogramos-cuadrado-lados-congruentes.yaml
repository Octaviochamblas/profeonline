semantic_id: MAT.GEO.PARALELOGRAMOS.CUADRADO_LADOS_CONGRUENTES
resumen_inicial: 'Propiedad de cuatro lados congruentes en el cuadrado: conceptos,
  teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: El cuadrado es uno de los casos particulares más conocidos de
  paralelogramo, con una propiedad adicional muy característica respecto a sus lados.
explicacion_formal: '![Cuatro lados congruentes en el cuadrado](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-cuadrado-lados-congruentes.svg)


  ### Definición formal


  Un cuadrado es un paralelogramo con $AB=BC=CD=DA$; es decir, sus cuatro lados tienen
  exactamente la misma longitud.


  ### Desarrollo didáctico


  A diferencia del paralelogramo general (que solo garantiza lados OPUESTOS iguales),
  el cuadrado va más allá: TODOS sus lados son iguales, no solo los opuestos. Esta
  propiedad, junto con tener los cuatro ángulos rectos, define completamente al cuadrado.'
definiciones_clave: '- **Propiedad de cuatro lados congruentes en el cuadrado**: Elemento
  o propiedad fundamental en el estudio de polígonos y cuadriláteros.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a propiedad de cuatro lados congruentes en el
  cuadrado.'
