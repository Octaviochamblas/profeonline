semantic_id: MAT.ALG.FUNDAMENTOS.CONCEPTO_VARIABLE
resumen_inicial: 'Una variable es un símbolo algebraico que representa un elemento no especificado perteneciente a un conjunto de números denominado dominio.'
explicacion_simple: |
  - Una **variable** es como una caja que puede guardar distintos números en diferentes momentos.
  - En la fórmula del costo de un viaje en taxi $C = 500 + 300k$, la letra $k$ es una variable porque depende de la cantidad de kilómetros recorridos:
    - Si viajas $2$ km, $k = 2 \implies C = 500 + 600 = \$1.100$.
    - Si viajas $5$ km, $k = 5 \implies C = 500 + 1500 = \$2.000$.
  - El valor de la variable cambia libremente dentro de los valores permitidos (su dominio).

  ![Concepto de Variable](/static/img/nodos/concepto-de-variable-intro.svg)
explicacion_formal: |
  ### Definición conjuntista formal
  Sea $D \subseteq \mathbb{R}$ un conjunto numérico no vacío. Una **variable** $x$ es un símbolo que representa un elemento arbitrario de $D$, donde $D$ constituye el **dominio de variación** de la variable:

  $$x \in D \implies f: D \longrightarrow \mathbb{R}, \quad x \longmapsto f(x)$$

  ### Tipología de variables
  1. **Variable independiente ($x$):** Aquella a la que se le asignan valores libremente dentro de su dominio de definición.
  2. **Variable dependiente ($y$):** Aquella cuyo valor queda unívocamente determinado por el valor que adopte la variable independiente ($y = f(x)$).

  ### Restricciones de dominio
  Una variable real no puede adoptar valores que originen indeterminaciones matemáticas:
  - Denominadores nulos: en $f(x) = \frac{1}{x-3}$, la variable satisface $x \in \mathbb{R} \setminus \{3\}$.
  - Raíces de índice par negativas: en $g(x) = \sqrt{x}$, la variable satisface $x \ge 0$.
definiciones_clave: |
  - **Variable**: Símbolo que puede adoptar diferentes valores numéricos dentro de un dominio específico.
  - **Dominio de la variable**: Conjunto de todos los números reales admisibles para los cuales la expresión está definida.
  - **Variable independiente**: Variable cuyo valor se fija de manera arbitraria en un modelo o función.
propiedades_relaciones: |
  - **Variación continua vs discreta**: Una variable puede ser continua ($x \in \mathbb{R}$) o discreta ($n \in \mathbb{N}$).
  - **Diferencia entre variable e incógnita**: Una variable toma múltiples valores en un dominio funcional; una incógnita representa valores específicos fijos a determinar en una ecuación.
ejemplo_guiado:
  enunciado: 'Para la fórmula del área de un círculo $A = \pi r^2$, determina cuál es la variable independiente, cuál es la variable dependiente y cuál es el dominio admisible de $r$.'
  imagen: '/static/img/nodos/concepto-de-variable-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los símbolos: $\pi$ es una constante numérica fija ($\,\approx 3,1416$).'
    - 'Paso 2: El radio $r$ puede tomar diferentes medidas de longitud, por lo que es la **variable independiente**.'
    - 'Paso 3: El área $A$ cambia en función del radio elegido, por lo que es la **variable dependiente**.'
    - 'Paso 4: Dado que una longitud geométrica real debe ser positiva, el dominio de la variable es **$r \in \mathbb{R}^+$ ($r > 0$)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué distingue conceptualmente a una variable de una constante en una expresión matemática?'
    choices:
      - text: 'La variable puede adoptar distintos valores numéricos de un dominio, mientras que la constante mantiene un valor fijo'
        is_correct: true
      - text: 'La variable siempre es igual a 0'
        is_correct: false
      - text: 'La constante solo puede escribirse con números enteros negativos'
        is_correct: false
      - text: 'Las variables no pueden sumarse ni multiplicarse'
        is_correct: false
    explanation: 'La alternativa correcta es ''La variable puede adoptar distintos valores numéricos de un dominio, mientras que la constante mantiene un valor fijo''. Es la definición cardinal de variable.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la expresión $f(x) = \frac{5}{x - 4}$, ¿cuál es el dominio de valores admisibles para la variable real $x$?'
    choices:
      - text: 'Todos los números reales excepto el 4 ($x \in \mathbb{R} \setminus \{4\}$)'
        is_correct: true
      - text: 'Únicamente el número 4 ($x = 4$)'
        is_correct: false
      - text: 'Solo los números enteros positivos'
        is_correct: false
      - text: 'Ningún número real'
        is_correct: false
    explanation: 'La alternativa correcta es ''Todos los números reales excepto el 4 ($x \in \mathbb{R} \setminus \{4\}$)''. Si $x = 4$, el denominador se anula ($4 - 4 = 0$), lo que produce una división indefinida.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las cantidades que cambian en el modelo matemático.'
  - 'Paso 2: Denotar cada cantidad variable mediante un símbolo literal ($x, y, t, r$).'
  - 'Paso 3: Establecer el dominio de definición identificando restricciones algebraicas (divisiones por cero, raíces pares).'
  - 'Paso 4: Distinguir la variable de entrada (independiente) de la de salida (dependiente).'
errores_correccion: |
  - **Error 1:** Evaluar una variable en un valor que divide por cero. **Cómo corregirlo:** Siempre verificar el **dominio de definición** de la variable antes de sustituir valores numéricos.
  - **Error 2:** Confundir variable con incógnita. **Cómo corregirlo:** En $y = 2x$, $x$ es una **variable** (adopta infinitos valores); en $2x = 10$, $x$ es una **incógnita** (solo vale $5$).
ejemplos:
  - titulo: 'Variable independiente en función de costo'
    enunciado: 'En la función de costo total $C(n) = 1500n + 3000$, donde $n$ es el número de artículos producidos, ¿cuál es la variable independiente?'
    alternativas:
      - 'La cantidad de artículos $n$'
      - 'El costo fijo de $\\$3.000$'
      - 'El costo total $C$'
    respuesta: 'La cantidad de artículos $n$'
    solucion_pasos:
      - '1. $n$ es la cantidad que se elige libremente.'
      - '2. $C$ depende de $n$, por lo que $n$ es la variable independiente.'
  - titulo: 'Restricción de dominio'
    enunciado: '¿Para qué valor de la variable $x$ no está definida la expresión $\frac{7}{2x - 10}$?'
    alternativas:
      - '$x = 5$'
      - '$x = 0$'
      - '$x = 10$'
    respuesta: '$x = 5$'
    solucion_pasos:
      - '1. El denominador se anula cuando $2x - 10 = 0$.'
      - '2. Despejando: $2x = 10 \implies x = 5$.'
  - titulo: 'Naturaleza dinámica de la variable'
    enunciado: '¿Puede una variable independiente tomar múltiples valores numéricos dentro de su dominio de definición?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Por definición, una variable recorre los elementos de su dominio.'
      - '2. No está fijada a un único valor numérico.'
  - titulo: 'Dominio universal irrestricto'
    enunciado: '¿Puede cualquier variable real tomar siempre el valor 0 sin importar la expresión donde se encuentre?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Si la variable está en un denominador como $\frac{1}{x}$, $x = 0$ está prohibido.'
      - '2. El dominio restringe los valores admisibles.'
errores_frecuentes:
  - 'Evaluar la variable en un valor prohibido que genera una división por cero en la expresión.'
  - 'Tratar a una variable en una función como si fuera una incógnita con un único valor estático.'
  - 'Olvidar que las variables en contextos geométricos reales exigen dominios positivos ($x > 0$).'
  - 'Confundir la variable independiente ($x$) con la variable dependiente ($y = f(x)$).'
  - 'Asumir que cambiar el nombre de la variable ($x$ por $t$) altera la gráfica o el valor de la función.'
afirmaciones_verdaderas:
  - 'Una variable es un símbolo que representa cualquier elemento perteneciente a su dominio de definición.'
  - 'En una función $y = f(x)$, $x$ es la variable independiente e $y$ es la variable dependiente.'
al_terminar_debes_poder: |
  ![Resumen de Concepto de Variable](/static/img/nodos/concepto-de-variable-resumen.svg)

  QUÉ: Comprender el concepto formal de variable matemática, determinar su dominio admisible y diferenciar variables independientes de dependientes.
  CÓMO: Identificando las cantidades dinámicas ($x \in D$), analizando restricciones operativas ($x \neq 0$) y modelando relaciones funcionales $y = f(x)$.
