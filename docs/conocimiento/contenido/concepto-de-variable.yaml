semantic_id: MAT.ALG.FUNDAMENTOS.CONCEPTO_VARIABLE
resumen_inicial: 'El concepto de variable define a una letra o símbolo capaz de asumir distintos valores numéricos dentro de un conjunto determinado denominado dominio de definición.'
explicacion_simple: |
  Una **variable** es como una caja vacía con una etiqueta en una fórmula matemática:
  - En lugar de guardar siempre la misma cantidad, puedes **cambiar el número que pones dentro de la caja**.
  - Si tienes la expresión del costo de $x$ entradas a un cine $C(x) = 4.000x$:
    - Si $x = 1$, la caja vale $1 \implies 4.000 \cdot 1 = \$4.000$.
    - Si $x = 3$, la caja vale $3 \implies 4.000 \cdot 3 = \$12.000$.
  - La letra $x$ es la **variable** porque su valor *varía* según la cantidad de entradas compradas.
  - El conjunto de números que se permite poner dentro de la variable se llama **dominio**.
explicacion_formal: |
  ### Definición formal
  Una **variable** es un símbolo alfabético $x$ que representa un elemento no especificado de un conjunto no vacío $D \subseteq \mathbb{R}$, denominado **dominio de la variable**:

  $$\forall x \in D, \quad x \mapsto f(x) \in \mathbb{R}$$

  ### Clasificación según la relación de dependencia
  1. **Variable Independiente ($x$)**: Símbolo cuyo valor se asigna libremente dentro del conjunto dominio $D$.
  2. **Variable Dependiente ($y$)**: Símbolo cuyo valor queda unívocamente determinado por la evaluación de la variable independiente a través de una función o regla $y = f(x)$.

  ### Síntesis didáctica
  Una variable es el representante genérico de una clase de números. Su presencia permite transformar un cálculo específico en una función o modelo capaz de evaluar infinitos datos.
definiciones_clave: |
  - **Variable**: Símbolo numéricamente indeterminado que toma valores dentro de un conjunto específico.
  - **Dominio de definición ($D$)**: Conjunto de todos los números reales válidos que puede asumir una variable.
  - **Variable independiente vs dependiente**: Variable de entrada ($x$) asignada libremente frente a la variable de salida ($y$) condicionada por el modelo.
propiedades_relaciones: |
  - **Restricciones del dominio**: Algunas variables tienen dominios acotados (ej: en el área de un círculo $A(r) = \pi r^2$, la variable radio exige $r > 0$).
  - **Evaluación funcional**: Asignar un elemento del dominio a la variable convierte la expresión en un valor numérico escalar único.
ejemplo_guiado:
  enunciado: 'En la función del perímetro de un cuadrado $P(l) = 4l$, identifica la variable del modelo, indica su dominio práctico y calcula el perímetro para un lado de $l = 6.5$ cm.'
  pasos:
    - 'Paso 1: Identificamos la letra simbólica que cambia: $l$ es la **variable independiente** (longitud del lado).'
    - 'Paso 2: Como una longitud física no puede ser negativa ni nula, el dominio práctico son los reales positivos: $D = \{l \in \mathbb{R} \mid l > 0\}$.'
    - 'Paso 3: Evaluamos la variable sustituyendo $l = 6,5$ en la fórmula: $P(6,5) = 4 \cdot 6,5$.'
    - 'Paso 4: Multiplicamos: $P(6,5) = 26$ cm. La variable es **$l$**, su dominio es **$l > 0$** y el perímetro es **$26$ cm**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué es formalmente una variable en una expresión o función matemática?'
    choices:
      - {text: 'Un símbolo alfabético que puede asumir diferentes valores dentro de un conjunto dominio determinado', is_correct: true}
      - {text: 'Un número fijo e inmutable que nunca cambia de valor', is_correct: false}
      - {text: 'El signo operacional de la multiplicación', is_correct: false}
      - {text: 'La unidad de medida utilizada para pesar objetos', is_correct: false}
    explanation: 'La alternativa correcta es ''Un símbolo alfabético que puede asumir diferentes valores dentro de un conjunto dominio determinado''. Definición de variable.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la fórmula de cobro de un taxi $C(d) = 500 + 800d$, donde $d$ representa la distancia en km y $C$ el costo total, ¿cuál es la variable independiente y cuál la dependiente?'
    choices:
      - {text: 'La distancia $d$ es la variable independiente y el costo $C$ es la variable dependiente', is_correct: true}
      - {text: 'El costo $C$ es la variable independiente y la distancia $d$ es la dependiente', is_correct: false}
      - {text: 'El número 500 es la variable independiente y 800 la dependiente', is_correct: false}
      - {text: 'Ambas letras son constantes fijas numéricas', is_correct: false}
    explanation: 'La alternativa correcta es ''La distancia $d$ es la variable independiente y el costo $C$ es la variable dependiente''. El costo $C$ depende de la distancia $d$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las letras o símbolos que varían en la expresión o problema.'
  - 'Paso 2: Determinar si la variable es de entrada (independiente) o de salida (dependiente).'
  - 'Paso 3: Definir el conjunto de números válidos (dominio $D$) que puede tomar la variable.'
  - 'Paso 4: Asignar valores del dominio a la variable para calcular o graficar los resultados correspondientes.'
errores_correccion: |
  - **Error 1:** Tratar a una variable como si fuera una constante inmutable fija. **Cómo corregirlo:** La variable representa **CUALQUIER número del conjunto dominio**, por lo que su valor cambia según la evaluación.
  - **Error 2:** Asignar valores a una variable que quedan fuera de su dominio válido (ej: distancias negativas o denominadores igual a cero). **Cómo corregirlo:** Se deben respetar las **restricciones del dominio de definición**.
ejemplos:
  - titulo: 'Identificación de variable en fórmula'
    enunciado: 'En la fórmula del área de un círculo $A = \pi r^2$, ¿cuál es la variable?'
    alternativas:
      - 'El radio $r$'
      - 'El número $\pi$'
      - 'El exponente $2$'
    respuesta: 'El radio $r$'
    solucion_pasos:
      - '1. $\pi$ y $2$ son constantes numéricas.'
      - '2. El radio $r$ puede cambiar $\implies$ es la variable.'
  - titulo: 'Dominio de variable física'
    enunciado: 'Si $t$ representa el tiempo en segundos transcurrido en un experimento, ¿su dominio incluye números negativos?'
    alternativas:
      - 'No, el dominio del tiempo físico transcurrido es $t \ge 0$'
      - 'Sí, incluye todos los reales negativos'
      - 'No, sólo incluye los números del 1 al 10'
    respuesta: 'No, el dominio del tiempo físico transcurrido es $t \ge 0$'
    solucion_pasos:
      - '1. El tiempo cronometrado no puede ser negativo.'
      - '2. El dominio es $t \ge 0$.'
  - titulo: 'Evaluación de variable'
    enunciado: 'Si la variable $x$ toma el valor $5$ en la expresión $2x + 1$, ¿el resultado es $11$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $2(5) + 1 = 10 + 1 = 11$.'
  - titulo: 'Variable dependiente'
    enunciado: 'En $y = 3x$, ¿el valor de $y$ varía en función del valor asignado a $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $y$ es la variable dependiente de $x$.'
errores_frecuentes:
  - 'Una variable en álgebra debe conservar exactamente el mismo valor numérico en todos los problemas.'
  - 'El dominio de definición de una variable incluye operaciones con división por cero.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'La variable dependiente puede asignarse libremente sin importar la regla del modelo.'
  - 'Cambiar el símbolo de una variable altera la estructura matemática del modelo.'
afirmaciones_verdaderas:
  - 'Una variable es un símbolo alfabético que representa un elemento arbitrario de un conjunto dominio.'
  - 'La variable independiente recibe asignación libre de valores, mientras que la variable dependiente queda condicionada por la regla matemática.'
al_terminar_debes_poder: 'Definir el concepto de variable y diferenciar variables independientes y dependientes evaluándolas dentro de su dominio de definición.'
