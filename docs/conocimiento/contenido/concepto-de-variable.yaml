resumen_inicial: Una variable es un símbolo literal que representa un elemento no
  especificado perteneciente a un conjunto numérico determinado denominado dominio.
explicacion_simple: 'Una variable es una letra cuyo valor numérico puede cambiar o
  ''variar'' según las condiciones del problema. Por ejemplo, si en la fórmula del
  perímetro de un cuadrado $P = 4s$, la letra $s$ es la medida del lado: si el lado
  vale $3$, el perímetro es $12$; si el lado vale $5$, el perímetro es $20$. La letra
  $s$ varía libremente.'
explicacion_formal: 'Sea $D \subset \mathbb{R}$ un conjunto no vacío denominado **Dominio
  de la Variable**. Una **Variable** $x$ es un símbolo al que se le puede atribuir
  cualquier valor individual $v \in D$:


  $$x \in D \implies \exists v \in D \quad / \quad x = v$$


  > **Complemento didáctico:** La variable es la entidad abstracta fundamental sobre
  la cual se definen las funciones y las transformaciones analíticas.'
definiciones_clave: '- **Variable**: Símbolo susceptible de tomar distintos valores
  de un conjunto dominio.

  - **Dominio**: Conjunto de valores numéricos admisibles que la variable puede tomar.'
propiedades_relaciones: '- **Variabilidad funcional**: En $y = f(x)$, $x$ representa
  la variable independiente e $y$ representa la variable dependiente.'
ejemplo_guiado:
  enunciado: En la función $y = 2x + 1$, identifique el comportamiento de las variables
    $x$ e $y$ al tomar $x \in \{1, 2, 3\}$.
  pasos:
  - 'Paso 1: Si $x = 1 \implies y = 2(1) + 1 = 3$.'
  - 'Paso 2: Si $x = 2 \implies y = 2(2) + 1 = 5$.'
  - 'Paso 3: Si $x = 3 \implies y = 2(3) + 1 = 7$.'
  - 'Conclusión: La variable $x$ cambia en su dominio y la variable $y$ varía en consecuencia
    en su codominio.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué caracteriza fundamentalmente al concepto de variable en álgebra?
  choices:
  - text: Que es un símbolo que puede asumir diferentes valores dentro de un conjunto
      dominio determinado
    is_correct: true
  - text: Que su valor es un número fijo e inmutable que nunca cambia
    is_correct: false
  - text: Que siempre es igual a cero
    is_correct: false
  - text: Que únicamente se usa para medir ángulos en grados
    is_correct: false
  explanation: La alternativa correcta es 'Que es un símbolo que puede asumir diferentes
    valores dentro de un conjunto dominio determinado'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para y = 2x + 1, ¿qué rol desempeñó la letra x?
  choices:
  - text: La variable independiente a la que se le asignaron valores del dominio {1,
      2, 3}
    is_correct: true
  - text: Una constante fija
    is_correct: false
  - text: El coeficiente numérico
    is_correct: false
  - text: El término independiente
    is_correct: false
  explanation: La alternativa correcta es 'La variable independiente a la que se le
    asignaron valores del dominio {1, 2, 3}'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las letras que representan magnitudes no fijas.'
- 'Paso 2: Definir el conjunto de valores o dominio admisibles para la letra.'
- 'Paso 3: Analizar la variación de la expresión al cambiar los valores de la variable.'
errores_correccion: '- **Error 1: Confundir una variable con una constante desconocida
  (parámetro).** **Cómo corregirlo:** La variable varía continuamente en un rango;
  el parámetro constante tiene un valor fijo en un problema específico.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En la fórmula del área de un círculo A = pi * r^2, ¿cuál es la variable
    independiente?
  alternativas:
  - El radio r
  - La constante pi
  - El número 2
  - La letra A
  respuesta: El radio r
  solucion_pasos:
  - 1. El radio r puede tomar cualquier valor positivo; es la variable independiente
    del círculo.
- titulo: Ejemplo 2
  enunciado: Si el dominio de la variable x es los números enteros positivos menores
    que 4, ¿qué valores puede tomar x?
  alternativas:
  - '{1, 2, 3}'
  - '{0, 1, 2, 3, 4}'
  - '{1, 2, 3, 4}'
  - Infinitos números
  respuesta: '{1, 2, 3}'
  solucion_pasos:
  - 1. Los enteros positivos menores que 4 son exactamente 1, 2 y 3.
- titulo: ¿Puede una variable tomar valores negativos si su dominio es los números
    reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, el conjunto de los números reales incluye valores negativos.
- titulo: ¿Permanece inmutable el valor de una variable a lo largo de la evaluación
    de una función?
  respuesta: 'No'
  solucion_pasos:
  - No, por definición una variable asume distintos valores dentro de su conjunto
    dominio.
errores_frecuentes:
- Declarar que una variable sólo puede tomar un único número como respuesta válida.
- Declarar la variable independiente con la variable dependiente de una función.
- Declarar que las variables no pueden tener valores fraccionarios o decimales.
- Omitir el conjunto dominio de definición de la variable.
- Declarar el concepto de variable con el de incógnita puntual de una ecuación.
afirmaciones_verdaderas:
- Una variable representa una cantidad capaz de asumir diferentes valores dentro de
  un conjunto determinado.
- El dominio de una variable especifica el conjunto de números reales admisibles para
  ser sustituidos.
al_terminar_debes_poder: Al terminar serás capaz de definir y manipular el concepto
  de variable y su dominio de definición en expresiones algebraicas.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Fundamentos.
