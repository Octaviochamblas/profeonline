semantic_id: MAT.ALG.FUNDAMENTOS.CONCEPTO_VARIABLE
resumen_inicial: 'Concepto de variable: concepto y propiedades en Fundamentos y notación
  algebraica.'
explicacion_simple: Imagina una caja de regalo adecuado. Cuando la abres a las 8 am
  tiene un peluche, pero a las 9 am tiene un reloj. La caja es la misma, pero su contenido
  cambia. Eso es exactamente una variable en matemáticas.
explicacion_formal: "### Definición formal\n\nLa naturaleza de la variable es 'variar',\
  \ permitiendo ser reemplazada por múltiples valores en el dominio.\n\n### Desarrollo\
  \ didáctico\n\nLa variable es el motor de las funciones. \nEn la expresión que calcula\
  \ el perímetro de un cuadrado $P = 4L$, la letra $L$ es la variable.\n- Si dibujas\
  \ un cuadradito en tu cuaderno, $L$ puede valer 2 cm.\n- Si pintas un cuadrado en\
  \ la calle, $L$ puede valer 5 metros.\n\nLa variable es lo que le da 'vida' a las\
  \ fórmulas matemáticas. Permite que una misma fórmula de física calcule la caída\
  \ de una pluma o la órbita de un planeta con solo reemplazar el valor de $t$ (tiempo)\
  \ o $m$ (masa).\n\nEn una ecuación simple (ej. $x + 2 = 5$), la variable solo puede\
  \ tomar un valor específico que la hace verdadera ($x=3$). Ahí la variable está\
  \ 'atrapada' y se le llama incógnita. Pero en una función (ej. $y = x + 2$), la\
  \ variable $x$ es libre de valer 1, 10 o 1000, y la $y$ cambiará en respuesta."
definiciones_clave: '- **Concepto de variable**: Elemento fundamental del lenguaje
  algebraico.'
propiedades_relaciones: '- **Propiedades de Concepto de variable**: Reglas de notación
