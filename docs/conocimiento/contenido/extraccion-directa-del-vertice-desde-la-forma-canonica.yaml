    is_correct: false
  explanation: 'La alternativa correcta es: Determinar el signo del coeficiente principal
    a para establecer la concavidad en formas de la función cuadrática. El signo del
    coeficiente a define si la parábola abre hacia arriba o hacia abajo.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la fórmula para hallar el eje de simetría o la abscisa del vértice
    en extracción directa del vértice desde la forma canónica?
  choices:
  - text: Calcular h = -b / (2a) para obtener la coordenada x del vértice y el eje
