semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.EXTRACCION_VERTICE
resumen_inicial: 'Extracción directa del vértice desde la forma canónica: parábola,
  vértice, concavidad y formas de Formas de la función cuadrática.'
explicacion_simple: 'La principal ventaja práctica de la forma canónica es que el
  vértice no requiere ningún cálculo adicional: simplemente se lee de la expresión.'
explicacion_formal: '### Definición formal


  Dada $f(x)=a(x-h)^2+k$, el vértice de la parábola es el punto $(h,k)$. Esto se debe
  a que $(x-h)^2 \geq 0$ para todo $x$, alcanzando su valor mínimo (cero) exactamente
  cuando $x=h$, momento en que $f(x)=k$.


  ### Desarrollo didáctico


  Extraer el vértice es un proceso de lectura directa: se identifica $h$ (con su signo
  correcto, reescribiendo el binomio si es necesario) y $k$, y el vértice es el par
  ordenado $(h,k)$.


  En $f(x)=3(x-5)^2+2$: el vértice es $(5,2)$.'
definiciones_clave: '- **Extracción directa del vértice desde la forma canónica**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  extracción directa del vértice desde la forma canónica.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando extracción
    directa del vértice desde la forma canónica.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a extracción
    directa del vértice desde la forma canónica.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
checkpoints:
