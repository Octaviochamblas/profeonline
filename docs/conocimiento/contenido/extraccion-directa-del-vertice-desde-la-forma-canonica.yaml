    la abscisa del vértice.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la función esté en forma canónica $a(x-h)^2+k$.'
- 'Paso 2: Identifica $h$, reescribiendo el binomio si es necesario para leer su signo
  correctamente.'
- 'Paso 3: Identifica $k$.'
- 'Paso 4: El vértice es el punto $(h,k)$.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en extracción directa del vértice desde la forma
  canónica.
ejemplos:
- titulo: Extracción con vértice de coordenadas positivas
  enunciado: Determina el vértice de $f(x)=2(x-4)^2+7$.
  solucion_pasos:
  - $h=4$, $k=7$.
  - El vértice es $(4,7)$.
- titulo: Extracción con vértice de coordenada negativa
  enunciado: Determina el vértice de $f(x)=-(x+6)^2-3$.
  solucion_pasos:
  - 'Reescribiendo $(x+6)$ como $(x-(-6))$: $h=-6$.'
  - $k=-3$.
  - El vértice es $(-6,-3)$.
- titulo: ¿Se necesita calcular algo adicional para hallar el vértice desde la forma
    canónica?
  enunciado: ¿Se necesita calcular algo adicional para hallar el vértice desde la
    forma canónica?
  respuesta: 'No'
  solucion_pasos:
  - El vértice se lee directamente como el par $(h,k)$, sin fórmulas ni cálculos adicionales.
- titulo: ¿El coeficiente $a$ forma parte de las coordenadas del vértice?
  enunciado: ¿El coeficiente $a$ forma parte de las coordenadas del vértice?
  respuesta: 'No'
  solucion_pasos:
  - El coeficiente $a$ determina la concavidad y la abertura de la parábola, pero
    no interviene en las coordenadas del vértice.
errores_frecuentes:
- Leer el vértice como $(-h,k)$ en vez de $(h,k)$, invirtiendo el signo de $h$ incorrectamente.
- Confundir el orden de las coordenadas, reportando $(k,h)$ en vez de $(h,k)$.
- Incluir el coeficiente $a$ como parte de las coordenadas del vértice.
- No reescribir correctamente el binomio cuando aparece con signo positivo, como $(x+3)$.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  extracción directa del vértice desde la forma canónica.
