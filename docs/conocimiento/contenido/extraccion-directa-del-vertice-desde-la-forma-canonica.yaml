semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.EXTRACCION_VERTICE
resumen_inicial: La extracción directa del vértice lee el par ordenado $V(h, k)$ directamente de $f(x) = a(x - h)^2 + k$ sin cálculos intermediarios.
explicacion_simple: |
  La mayor ventaja de la **forma canónica $f(x) = a(x - h)^2 + k$** es que te regala el vértice en bandeja de plata:

  - **Regla de lectura instantánea**:
    - Cambias el signo del número dentro del paréntesis para obtener **$h$**.
    - Mantienes el número de afuera exactamente con su signo para obtener **$k$**.
    - Armas el punto **$V(h, k)$**.

  **Ejemplos de lectura directa**:
  - $f(x) = 3(x - 5)^2 + 4 \implies V(5, 4)$
  - $f(x) = -2(x + 1)^2 - 8 \implies V(-1, -8)$
  - $f(x) = (x - 7)^2 \implies V(7, 0)$
explicacion_formal: |
  Dada la función cuadrática expresada en forma canónica $f(x) = a(x - h)^2 + k$, el mapa de lectura directa $\Phi: \text{Canónica} \to \mathbb{R}^2$ mapea los coeficientes al **vértice cartesiano $V$**:

  $$\Phi(a(x - h)^2 + k) = V(h, k)$$

  **Demostración analítica de mínimos/máximos:**
  Dado que $(x - h)^2 \ge 0, \forall x \in \mathbb{R}$, con igualdad única en $x = h$:
  - Si $a > 0$: $f(x) = a(x - h)^2 + k \ge a(0) + k = k$, alcanzando el mínimo único en $(h, k)$.
  - Si $a < 0$: $f(x) = a(x - h)^2 + k \le a(0) + k = k$, alcanzando el máximo único en $(h, k)$.
definiciones_clave: |
  - **Extracción directa del vértice**: Técnica de inspección visual que identifica las coordenadas $V(h, k)$ a partir de los coeficientes de la forma canónica sin operaciones algebraicas.
propiedades_relaciones: |
  - **Intersección de la parábola con su eje de simetría**: El punto extraído $V(h, k)$ es la única solución al sistema formado por la parábola $y = a(x-h)^2 + k$ y su eje $x = h$.
ejemplo_guiado:
  enunciado: 'Extrae directamente el vértice de la función $f(x) = -4(x + 3)^2 + 10$ e indica si es un máximo o un mínimo.'
  pasos:
    - 'Paso 1: Observar el término $(x + 3)^2$: al invertir su signo se obtiene $h = -3$.'
    - 'Paso 2: Observar el término libre $+10$: manteniendo su signo se obtiene $k = 10$.'
    - 'Paso 3: Formar el par ordenado del vértice: $V(-3, 10)$.'
    - 'Paso 4: Evaluar $a = -4 < 0$: al abrirse hacia abajo, $V(-3, 10)$ es un valor máximo.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son las coordenadas del vértice extraídas directamente de la función $f(x) = (x - 6)^2 - 2$?'
    choices:
      - {text: '$V(6, -2)$', is_correct: true}
      - {text: '$V(-6, -2)$.', is_correct: false}
      - {text: '$V(6, 2)$.', is_correct: false}
      - {text: '$V(-2, 6)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$V(6, -2)$''. Invirtiendo el signo de $-6$ da $h = 6$, y manteniendo $-2$ da $k = -2$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué vértice corresponde a la función cuadrática $f(x) = -3(x + 1)^2$?'
    choices:
      - {text: '$V(-1, 0)$', is_correct: true}
      - {text: '$V(1, 0)$.', is_correct: false}
      - {text: '$V(-1, -3)$.', is_correct: false}
      - {text: '$V(0, -1)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$V(-1, 0)$''. Al no haber término libre sumando afuera, $k = 0$, y de $(x+1)$ se extrae $h = -1$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Verificar que la función esté expresada en la forma $f(x) = a(x - h)^2 + k$.'
  - 'Paso 2: Leer el número sumado o restado a la $x$ dentro del cuadrado y cambiarle el signo para fijar la abscisa $h$.'
  - 'Paso 3: Leer el término libre fuera del cuadrado conservando exactamente su signo para fijar la ordenada $k$.'
  - 'Paso 4: Escribir el punto resultante en notación cartesiana $V(h, k)$.'
errores_correccion: |
  - **Error común:** Cambiarle el signo a la constante de afuera $k$ por inercia al cambiar el signo de $h$.
  - **Cómo corregirlo:** Recuerda la regla mnemotécnica: **EL DE ADENTRO CAMBIA DE SIGNO ($h$), EL DE AFUERA SE QUEDA IGUAL ($k$)**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Extracción con h negativo y k positivo.
    alternativas:
      - 'Vértice en (-8, 12)'
      - 'Vértice en (8, 12)'
      - 'Vértice en (-8, -12)'
    respuesta: 'Vértice en (-8, 12)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Extracción en parábola trasladada únicamente en X.
    alternativas:
      - 'Vértice en (4, 0)'
      - 'Vértice en (-4, 0)'
      - 'Vértice en (0, 4)'
    respuesta: 'Vértice en (4, 0)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = (x - 2)^2 + 5$, es correcto afirmar que su vértice es el punto $V(-2, 5)$.'
  - 'La suposición de que el término libre $k$ de la forma canónica debe cambiar de signo al formar el par ordenado del vértice.'
  - 'El intercambio de las posiciones del vértice declarando $V(k, h)$ al realizar la inspección visual.'
  - 'La creencia de que se debe desarrollar primero el cuadrado del binomio para poder calcular el vértice.'
  - 'Afirmar que el coeficiente cuadrático $a$ se debe sumar a la ordenada $k$ para hallar la altura del vértice.'
afirmaciones_verdaderas:
  - 'Al extraer el vértice de la forma canónica $f(x) = a(x - h)^2 + k$, el signo interno del paréntesis se invierte para $h$ mientras que $k$ conserva su signo.'
  - 'Si la función no presenta término constante libre fuera del binomio al cuadrado, la ordenada de su vértice es automáticamente $k = 0$.'
al_terminar_debes_poder: |
  QUÉ: Extraer directamente las coordenadas del vértice $V(h, k)$ desde la forma canónica por inspección.
  CÓMO: Invertir el signo del término interno para $h$, mantener el término libre externo para $k$ y redactar $V(h, k)$.
