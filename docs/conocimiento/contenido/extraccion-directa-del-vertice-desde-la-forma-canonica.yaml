semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.EXTRACCION_VERTICE
resumen_inicial: La extracción directa del vértice desde la forma canónica $f(x) = a(x - h)^2 + k$ permite obtener las coordenadas del punto extremo $V(h, k)$ por simple inspección, tomando el opuesto del término interior del binomio y la constante exterior.
explicacion_simple: "![La extracción directa del vértice desde la forma canónica $f(x) = a(x - h)^2 + k$ permite obtener las coordenadas del punto extremo $V(h, k)$ por simple inspección, tomando el opuesto del término interior del binomio y la constante exterior](/static/img/nodos/extraccion-directa-del-vertice-desde-la-forma-canonica-intro.svg)\n\n\nExtraer el vértice desde la forma canónica es el truco más rápido de toda la geometría analítica:\n\n**Regla de oro de los signos:**\n1. **Para la primera coordenada ($x$):** Cambia el signo de lo que está adentro del paréntesis.\n   - Si dice $(x - 7) \\implies$ pones **$+7$**.\n   - Si dice $(x + 4) \\implies$ pones **$-4$**.\n2. **Para la segunda coordenada ($y$):** Mantén exactamente el signo del número que está afuera.\n   - Si dice $+9 \\implies$ pones **$+9$**.\n   - Si dice $-15 \\implies$ pones **$-15$**.\n- ¡Listo! En 2 segundos tienes tu vértice **$V(h, k)$** sin hacer ningún cálculo."
explicacion_formal: 'Dada la representación canónica de Jordan $f(x) = a(x - h)^2 + k$, el **mapeo de extracción del punto crítico** $\Psi: \mathcal{F}_{\text{can}} \to \mathbb{R}^2$ se define formalmente como:

  $$\Psi\left(a(x - h)^2 + k\right) = (h, k)$$


  **Demostración de consistencia analítica**:

  - Condición de primer orden: $f''(x) = 2a(x - h) = 0 \implies x_v = h$.

  - Condición de evaluación: $y_v = f(h) = a(h - h)^2 + k = a(0) + k = k$.

  - Por consiguiente, el par ordenado es idéntico a $V(h, k)$ sin necesidad de manipulación algebraica intermedia.'
definiciones_clave: '- **Inspección canónica**: Lectura inmediata de invariantes geométricos a partir de la estructura algebraica de la expresión.

  - **Extracción de vértice**: Identificación de $(h, k)$ a partir de $a(x - h)^2 + k$.'
propiedades_relaciones: '- **Cero operaciones requeridas**: No requiere resolver discriminantes ni cocientes $-b/(2a)$.

  - **Inversión de signo unívoca**: Solo la componente horizontal sufre inversión de signo algebraico.'
ejemplo_guiado:
  enunciado: '![Ejemplo La extracción directa del vértice desde la forma canónica $f(x) = a(x - h)^2 + k$ permite obtener las coordenadas del punto extremo $V(h, k)$ por simple inspección, tomando el opuesto del término interior del binomio y la constante exterior](/static/img/nodos/extraccion-directa-del-vertice-desde-la-forma-canonica-ejemplos.svg)



    Extrae el vértice por simple inspección para las siguientes funciones cuadráticas:

    1) $f(x) = 6(x - 9)^2 + 14$

    2) $g(x) = -4(x + 5)^2 - 2$

    3) $h(x) = 3x^2 + 7$'
  pasos:
  - 'Paso 1: Para $f(x) = 6(x - 9)^2 + 14$:

    - Dentro del paréntesis: $(x - 9) \implies h = 9$.

    - Fuera del paréntesis: $+14 \implies k = 14$.

    - Vértice: $V(9, 14)$.'
  - 'Paso 2: Para $g(x) = -4(x + 5)^2 - 2$:

    - Dentro del paréntesis: $(x + 5) \implies h = -5$.

    - Fuera del paréntesis: $-2 \implies k = -2$.

    - Vértice: $V(-5, -2)$.'
  - 'Paso 3: Para $h(x) = 3(x - 0)^2 + 7$:

    - Dentro del paréntesis: $x = (x - 0) \implies h = 0$.

    - Fuera del paréntesis: $+7 \implies k = 7$.

    - Vértice: $V(0, 7)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el vértice de $f(x) = -2(x - 11)^2 + 4$?
  choices:
  - text: V(11, 4)
    is_correct: true
  - text: V(-11, 4)
    is_correct: false
  - text: V(11, -4)
    is_correct: false
  - text: V(4, 11)
    is_correct: false
  explanation: La alternativa correcta es 'V(11, 4)'. El binomio $(x - 11)$ da $h = 11$ y el término constante da $k = 4 \implies V(11, 4)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En $f(x) = (x + 8)^2$, ¿cuáles son las coordenadas del vértice?
  choices:
  - text: V(-8, 0)
    is_correct: true
  - text: V(8, 0)
    is_correct: false
  - text: V(0, 8)
    is_correct: false
  - text: V(0, -8)
    is_correct: false
  explanation: La alternativa correcta es 'V(-8, 0)'. Al no haber constante sumada afuera, $k = 0$, dando $V(-8, 0)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar el binomio al cuadrado $(x - h)^2$.'
- 'Paso 2: Invertir el signo del número interior para fijar la abscisa $h$.'
- 'Paso 3: Tomar el número exterior sumado o restado para fijar la ordenada $k$.'
- 'Paso 4: Escribir el vértice $V(h, k)$.'
errores_correccion: '- **Error común:** Cambiar el signo del número de afuera $k$.

  - **Cómo corregirlo:** **Solo se cambia el signo del número que está DENTRO del paréntesis ($h$)**; el de afuera ($k$) se deja tal como está.'
ejemplos:
- titulo: 'Ejemplo 1: Extracción canónica estándar'
  enunciado: Extrae el vértice de $f(x) = 3(x - 2)^2 + 5$.
  alternativas:
  - V(2, 5)
  - V(-2, 5)
  - V(2, -5)
  - V(-2, -5)
  respuesta: V(2, 5)
  solucion_pasos:
  - 'Paso 1: $h = 2, k = 5 \implies V(2, 5)$.'
- titulo: 'Ejemplo 2: Extracción con binomio sumado'
  enunciado: Extrae el vértice de $g(x) = -(x + 6)^2 - 1$.
  alternativas:
  - V(-6, -1)
  - V(6, -1)
  - V(-6, 1)
  - V(6, 1)
  respuesta: V(-6, -1)
  solucion_pasos:
  - 'Paso 1: $h = -6, k = -1 \implies V(-6, -1)$.'
- titulo: 'Ejemplo 3: Extracción con k nulo'
  enunciado: ¿Qué vértice tiene $h(x) = -7(x - 4)^2$?
  alternativas:
  - V(4, 0)
  - V(-4, 0)
  - V(0, 4)
  - V(4, -7)
  respuesta: V(4, 0)
  solucion_pasos:
  - 'Paso 1: $h = 4, k = 0 \implies V(4, 0)$.'
- titulo: 'Ejemplo 4: Extracción con h nulo'
  enunciado: ¿Qué vértice tiene $f(x) = 5x^2 - 18$?
  alternativas:
  - V(0, -18)
  - V(-18, 0)
  - V(0, 18)
  - V(5, -18)
  respuesta: V(0, -18)
  solucion_pasos:
  - 'Paso 1: $h = 0, k = -18 \implies V(0, -18)$.'
errores_frecuentes:
- Cambiar el signo de k por equivocación.
- Olvidar cambiar el signo de h.
- Invertir el orden de las componentes escribiendo V(k, h).
afirmaciones_verdaderas:
- En f(x) = a(x - h)² + k, el vértice se obtiene de forma inmediata como V(h, k).
- La coordenada x del vértice es el valor que anula la base del cuadrado (x - h = 0).
al_terminar_debes_poder: '**QUÉ:** Extraer directamente el vértice de una función cuadrática desde su forma canónica.


  **CÓMO:** Leyendo el opuesto del término interno h y la constante aditiva k para formular V(h, k).


