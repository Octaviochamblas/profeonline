semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.EXTRACCION_VERTICE
resumen_inicial: 'La forma canónica $f(x) = a(x - h)^2 + k$ permite extraer el vértice $V(h, k)$ de manera insustituible mediante inspección directa sin necesidad de desarrollar la expresión.'
explicacion_simple: |
  La mayor ventaja de tener una función cuadrática escrita en forma canónica es que no requiere realizar cálculos complicados para hallar el vértice. Las coordenadas del punto más alto o más bajo de la curva se leen directamente mirando la fórmula: la abscisa es el número dentro del paréntesis con el signo cambiado ($h$), y la ordenada es el número fuera del paréntesis tal como está ($k$).
explicacion_formal: |
  ### Definición formal
  La **inspección directa del vértice** a partir de la forma canónica $f(x) = a(x - h)^2 + k$ establece que las coordenadas del extremo $V \in \mathbb{R}^2$ vienen dadas de forma única e inmediata por el operador de posición:
  $$V = (h, k)$$

  ### Desglose simbólico
  - Dada $f(x) = a(x - h)^2 + k \implies \text{Vértice } V = (h, k)$.
  - Abscisa del vértice: $h$ (obtenida al igualar el binomio interno a cero: $x - h = 0 \implies x = h$).
  - Ordenada del vértice: $k = f(h) = a(h - h)^2 + k = a(0) + k = k$.

  ### Síntesis didáctica
  Desarrollar la forma canónica a la forma general para luego calcular $h = -\frac{b}{2a}$ es un camino innecesario y propenso a errores algebraicos. La forma canónica ya ha completado los cuadrados por nosotros, exponiendo directamente el vértice en los valores $(h, k)$.
definiciones_clave: |
  - **Extracción directa**: Lectura inmediata de propiedades geométricas a partir de la sintaxis del modelo algebraico.
  - **Igualación del binomio a cero**: Método conceptual $x - h = 0 \implies x = h$ para hallar la abscisa del vértice sin memorizar signos.
  - **Cota vertical $k$**: Salida resultante al anularse el término cuadrático $(x - h)^2 = 0$.
propiedades_relaciones: |
  - **Resguardo de concavidad**: La extracción del vértice $V(h, k)$ es independiente del signo de $a$. Sin importar si $a > 0$ o $a < 0$, las coordenadas del vértice son siempre $(h, k)$.
  - **Lectura del eje de simetría**: Al extraer $V(h, k)$, la recta del eje de simetría se obtiene inmediatamente como $x = h$.
ejemplo_guiado:
  enunciado: 'Aplica el método de extracción directa para hallar las coordenadas del vértice y la ecuación del eje de simetría de las funciones $f(x) = -3(x - 5)^2 + 12$ y $g(x) = 4(x + 2)^2 - 7$.'
  pasos:
    - 'Paso 1: Para $f(x) = -3(x - 5)^2 + 12$, igualamos el término interno a cero: $x - 5 = 0 \implies h = 5$.'
    - 'Paso 2: Leemos la constante externa $k = 12$. El vértice es $V(5, 12)$ y el eje de simetría es $x = 5$.'
    - 'Paso 3: Para $g(x) = 4(x + 2)^2 - 7$, igualamos el término interno a cero: $x + 2 = 0 \implies h = -2$.'
    - 'Paso 4: Leemos la constante externa $k = -7$. El vértice es $V(-2, -7)$ y el eje de simetría es $x = -2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son las coordenadas del vértice extraídas directamente de la función $h(x) = -2(x - 9)^2 - 3$?'
    choices:
      - {text: '$V(9, -3)$', is_correct: true}
      - {text: '$V(-9, -3)$', is_correct: false}
      - {text: '$V(9, 3)$', is_correct: false}
      - {text: '$V(-2, -3)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$V(9, -3)$''. De $(x - 9)$ extraemos $h = 9$, y la constante externa es $k = -3$, formando el punto $V(9, -3)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una parábola dada en forma canónica es $p(x) = (x + 6)^2 + 4$, ¿cuál es su vértice y hacia dónde abren sus ramas?'
    choices:
      - {text: 'Vértice en $V(-6, 4)$ y abre hacia arriba', is_correct: true}
      - {text: 'Vértice en $V(6, 4)$ y abre hacia abajo', is_correct: false}
      - {text: 'Vértice en $V(-6, -4)$ y abre hacia arriba', is_correct: false}
      - {text: 'Vértice en $V(6, -4)$ y abre hacia abajo', is_correct: false}
    explanation: 'La alternativa correcta es ''Vértice en $V(-6, 4)$ y abre hacia arriba''. De $(x + 6)$ obtenemos $h = -6$, $k = 4$, y al ser $a = 1 > 0$, abre hacia arriba.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar que la función cuadrática se encuentra presentada en forma canónica $a(x - h)^2 + k$.'
  - 'Paso 2: Igualar el binomio interno a cero ($x - h = 0$) para obtener la abscisa $h$.'
  - 'Paso 3: Tomar el término libre externo $k$ con su propio signo para obtener la ordenada.'
  - 'Paso 4: Escribir el par ordenado del vértice en la forma $V(h, k)$.'
errores_correccion: |
  - **Error 1:** Desarrollar completamente la expresión $a(x - h)^2 + k$ para buscar $a, b, c$ y aplicar $-\frac{b}{2a}$. **Cómo corregirlo:** Desarrollar el binomio es innecesario. La forma canónica expone el vértice directamente en la sintaxis $(h, k)$.
  - **Error 2:** Intercambiar la posición de las coordenadas escribiendo $V(k, h)$. **Cómo corregirlo:** La primera componente del par ordenado es siempre la abscisa $h$ (del binomio en $x$) y la segunda es la ordenada $k$ (la constante libre).
ejemplos:
  - titulo: 'Extracción directa en parábola desplazada'
    enunciado: '¿Cuál es el vértice de $f(x) = 5(x - 1)^2 - 8$?'
    alternativas:
      - '$V(1, -8)$'
      - '$V(-1, -8)$'
      - '$V(1, 8)$'
    respuesta: '$V(1, -8)$'
    solucion_pasos:
      - '1. Igualamos $x - 1 = 0 \implies h = 1$.'
      - '2. La constante es $k = -8$.'
      - '3. El vértice extraído directamente es $V(1, -8)$.'
  - titulo: 'Extracción con binomio positivo'
    enunciado: '¿Cuáles son las coordenadas del vértice de $g(x) = -x^2 + 10$?'
    alternativas:
      - '$V(0, 10)$'
      - '$V(10, 0)$'
      - '$V(-1, 10)$'
    respuesta: '$V(0, 10)$'
    solucion_pasos:
      - '1. Reescribimos $g(x) = -(x - 0)^2 + 10$.'
      - '2. Extraemos $h = 0$ y $k = 10$, resultando $V(0, 10)$.'
  - titulo: 'Velocidad de extracción en forma canónica'
    enunciado: '¿Es posible determinar las coordenadas del vértice de $f(x) = -7(x + 3)^2 - 2$ sin realizar multiplicaciones algebraicas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por inspección directa de la forma canónica, el vértice se lee de inmediato como $V(-3, -2)$.'
  - titulo: 'Vértice sobre el eje de las ordenadas'
    enunciado: 'Si una función en forma canónica es $f(x) = 2x^2 + 5$, ¿su vértice se ubica sobre el eje $y$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser $h = 0$, el vértice es $V(0, 5)$, el cual yace sobre el eje de las ordenadas.'
errores_frecuentes:
  - 'El vértice extraído de $f(x) = 3(x - 4)^2 + 7$ tiene coordenadas $V(-4, 7)$.'
  - 'Para hallar el vértice en la forma canónica es obligatorio desarrollar el cuadrado de binomio y usar $h = -\frac{b}{2a}$.'
  - 'El signo del coeficiente $a$ altera la fórmula de extracción directa del vértice haciéndola $V(-h, -k)$.'
  - 'En la función $f(x) = (x + 2)^2$, la ordenada del vértice es $k = 2$.'
  - 'La abscisa del vértice en forma canónica se obtiene dividiendo el término $k$ por el coeficiente $a$.'
afirmaciones_verdaderas:
  - 'De la forma canónica $f(x) = a(x - h)^2 + k$ se extrae el vértice $V(h, k)$ mediante lectura directa, invirtiendo el signo del término en $x$ y conservando la constante $k$.'
  - 'El método de inspección directa del vértice en forma canónica no requiere realizar desarrollos polinomiales.'
al_terminar_debes_poder: 'Extraer instantáneamente el vértice $V(h, k)$ por inspección directa de cualquier función en forma canónica.'
