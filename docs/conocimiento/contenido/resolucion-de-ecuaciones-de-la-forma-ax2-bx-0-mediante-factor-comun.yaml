semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_BINOMIA
resumen_inicial: La resolución de una ecuación cuadrática de la forma $ax^2 + bx = 0$ mediante factor común consiste en extraer $x$ como factor común ($x(ax + b) = 0$), produciendo siempre las raíces $x_1 = 0$ y $x_2 = -b/a$.
explicacion_simple: "![La resolución de una ecuación cuadrática de la forma $ax^2 + bx = 0$ mediante factor común consiste en extraer $x$ como factor común ($x(ax + b) = 0$), produciendo siempre las raíces $x_1 = 0$ y $x_2 = -b/a$](/static/img/nodos/resolucion-de-ecuaciones-de-la-forma-ax2-bx-0-mediante-factor-comun-intro.svg)\n\n\nPara resolver **$ax^2 + bx = 0$** (cuando no hay número suelto):\n1. Como los dos términos tienen la letra $x$, **sacas la $x$ hacia afuera**: **$x(ax + b) = 0$**.\n2. Aplicas la propiedad del producto cero:\n   - La $x$ de afuera te da la primera solución: **$x_1 = 0$** (¡siempre es cero!).\n   - El paréntesis de adentro te da la segunda: $ax + b = 0 \\implies$ **$x_2 = -\\frac{b}{a}$**.\n3. **¡Prohibido dividir por $x$!** Si divides por $x$ para \"hacerla más corta\", borras la solución $x = 0$ y pierdes la mitad de los puntos."
explicacion_formal: 'Dada la ecuación incompleta binomia $ax^2 + bx = 0$ con $a \neq 0, b \neq 0$:


  **Factorización analítica por factor común monomial**:

  $$x(ax + b) = 0$$


  Por la propiedad del producto cero en dominios de integridad:

  $$x = 0 \quad \lor \quad ax + b = 0$$

  $$x_1 = 0, \quad x_2 = -\frac{b}{a}$$


  **Conjunto solución formal**:

  $$\mathcal{S} = \left\{ 0, -\frac{b}{a} \right\}$$


  **Propiedades analíticas:**

  - **Dos raíces reales distintas**: Como $b \neq 0$, $-\frac{b}{a} \neq 0$, garantizando $\text{Card}(\mathcal{S}) = 2$.

  - **Discriminante positivo estricto**: $\Delta = b^2 - 4a(0) = b^2 > 0$.

  - **Simetría**: La parábola pasa por el origen $(0, 0)$ y por $(-b/a, 0)$.'
definiciones_clave: '- **Factor común monomial**: Extracción de la variable de menor grado presente en todos los términos del polinomio.

  - **Raíz nula trivial**: Solución $x = 0$ inherente a toda ecuación polinómica sin término independiente.'
propiedades_relaciones: '- **Pérdida de soluciones por simplificación ilegal**: Si se divide por $x$, se asume implícitamente $x \neq 0$, eliminando la raíz cero del conjunto solución.

  - **Suma de soluciones**: $x_1 + x_2 = 0 + (-b/a) = -b/a$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de una ecuación cuadrática de la forma $ax^2 + bx = 0$ mediante factor común consiste en extraer $x$ como factor común ($x(ax + b) = 0$), produciendo siempre las raíces $x_1 = 0$ y $x_2 = -b/a$](/static/img/nodos/resolucion-de-ecuaciones-de-la-forma-ax2-bx-0-mediante-factor-comun-ejemplos.svg)



    Resuelve la ecuación cuadrática $3x^2 - 15x = 0$ mediante factorización por factor común.'
  pasos:
  - 'Paso 1: Identificar los términos: $3x^2$ y $-15x$, ambos divisibles por $3x$.'
  - 'Paso 2: Extraer el factor común $3x$: $3x(x - 5) = 0$.'
  - 'Paso 3: Aplicar la propiedad del producto cero: $3x = 0 \lor x - 5 = 0$.'
  - 'Paso 4: Despejar cada factor: $x_1 = 0$ y $x_2 = 5$.'
  - 'Paso 5: Concluir el conjunto solución: $\mathcal{S} = \{0, 5\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las soluciones de la ecuación $2x^2 + 8x = 0$?
  choices:
  - text: x = 0 y x = -4
    is_correct: true
  - text: x = 0 y x = 4
    is_correct: false
  - text: x = 2 y x = -8
    is_correct: false
  - text: Solo x = -4
    is_correct: false
  explanation: La alternativa correcta es 'x = 0 y x = -4'. Factorizando $2x(x + 4) = 0 \implies x = 0 \lor x = -4$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué es un error simplificar $6x^2 = 18x$ dividiendo directamente entre $6x$ para obtener $x = 3$?
  choices:
  - text: Porque al dividir por x se elimina y pierde la raiz x = 0.
    is_correct: true
  - text: Porque 18/6 no es 3.
    is_correct: false
  - text: Porque no se puede dividir entre 6.
    is_correct: false
  - text: Porque la respuesta correcta era x = -3.
    is_correct: false
  explanation: La alternativa correcta es 'Porque al dividir por x se elimina y pierde la raiz x = 0.'. La división por variables puede omitir soluciones nulas.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ordenar la ecuación en la forma $ax^2 + bx = 0$.'
- 'Paso 2: Extraer la incógnita $x$ (y el máximo común divisor numérico si se desea) como factor común.'
- 'Paso 3: Plantear el producto $x(ax + b) = 0$.'
- 'Paso 4: Igualar a cero el factor externo obteniendo $x_1 = 0$.'
- 'Paso 5: Igualar a cero el factor binomio $ax + b = 0$ y despejar $x_2 = -\frac{b}{a}$.'
errores_correccion: '- **Error común:** Dividir ambos lados por $x$ ($5x^2 = 20x \implies 5x = 20 \implies x = 4$) perdiendo $x = 0$.

  - **Cómo corregirlo:** **Factoriza siempre**: $5x(x - 4) = 0 \implies x = 0 \lor x = 4$.'
ejemplos:
- titulo: 'Ejemplo 1: Factor común simple'
  enunciado: Resuelve $x^2 - 8x = 0$.
  alternativas:
  - x = 0 y x = 8
  - x = 8 y x = -8
  - Solo x = 8
  - x = 0 y x = -8
  respuesta: x = 0 y x = 8
  solucion_pasos:
  - 'Paso 1: $x(x - 8) = 0 \implies x = 0 \lor x = 8$.'
- titulo: 'Ejemplo 2: Coeficiente no unitario'
  enunciado: Resuelve $4x^2 + 12x = 0$.
  alternativas:
  - x = 0 y x = -3
  - x = 0 y x = 3
  - x = 3 y x = -3
  - Solo x = -3
  respuesta: x = 0 y x = -3
  solucion_pasos:
  - 'Paso 1: $4x(x + 3) = 0 \implies x_1 = 0, x_2 = -3$.'
- titulo: 'Ejemplo 3: Raíz fraccionaria'
  enunciado: Resuelve $5x^2 - 2x = 0$.
  alternativas:
  - x = 0 y x = 2/5
  - x = 0 y x = -2/5
  - x = 2/5 y x = -2/5
  - Solo x = 2/5
  respuesta: x = 0 y x = 2/5
  solucion_pasos:
  - 'Paso 1: $x(5x - 2) = 0 \implies x = 0 \lor x = 2/5$.'
- titulo: 'Ejemplo 4: Coeficiente negativo'
  enunciado: Resuelve $-2x^2 + 14x = 0$.
  alternativas:
  - x = 0 y x = 7
  - x = 0 y x = -7
  - x = 7 y x = -7
  - Solo x = 7
  respuesta: x = 0 y x = 7
  solucion_pasos:
  - 'Paso 1: $-2x(x - 7) = 0 \implies x = 0 \lor x = 7$.'
errores_frecuentes:
- Dividir por x perdiendo la raíz cero.
- Equivocar el signo al despejar ax + b = 0.
- Usar la fórmula cuadrática completa innecesariamente.
afirmaciones_verdaderas:
- La ecuación ax² + bx = 0 se resuelve factorizando por x y siempre tiene a 0 como raíz.
- El conjunto solución de ax² + bx = 0 está formado por {0, -b/a}.
al_terminar_debes_poder: '**QUÉ:** Resolver ecuaciones cuadráticas incompletas de la forma ax² + bx = 0 usando factor común.


  **CÓMO:** Extrayendo x como factor común x(ax + b) = 0 y determinando las dos soluciones x = 0 y x = -b/a.


