semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_BINOMIA
resumen_inicial: 'Resolución de ecuaciones de la forma ax² + bx = 0 mediante factor
  común: concepto, discriminante, soluciones y modelamiento en Resolución por factorización.'
explicacion_simple: Cuando una ecuación cuadrática le falta el término independiente,
  la $x$ que comparten ambos términos restantes se puede extraer como factor común,
  y desde ahí resolver es directo.
explicacion_formal: '### Definición formal


  Dada la ecuación $ax^2+bx=0$ con $a\neq0$ y $b\neq0$, se factoriza extrayendo el
  factor común $x$: $x(ax+b)=0$. Por la propiedad del producto nulo, las soluciones
  son $x=0$ y $x=-\dfrac{b}{a}$.


  ### Desarrollo didáctico


  Este método es mucho más rápido que aplicar la fórmula general, ya que no requiere
  calcular ningún discriminante: basta con factorizar por término común.


  Para $3x^2-12x=0$: factorizando, $3x(x-4)=0$, por lo que $3x=0$ o $x-4=0$, dando
  $x=0$ o $x=4$.'
definiciones_clave: '- **Resolución de ecuaciones de la forma ax² + bx = 0 mediante
  factor común**: Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en resolución
  de ecuaciones de la forma ax² + bx = 0 mediante factor común.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando resolución de ecuaciones
    de la forma ax² + bx = 0 mediante factor común.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a resolución de ecuaciones
    de la forma ax² + bx = 0 mediante factor común.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
