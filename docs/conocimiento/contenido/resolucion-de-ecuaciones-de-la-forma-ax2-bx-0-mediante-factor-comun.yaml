semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_BINOMIA
resumen_inicial: 'La resolución de $a x^2 + b x = 0$ se realiza factorizando la incógnita
  $x$ como factor común: $x(a x + b) = 0$, dando $x_1 = 0$ y $x_2 = -\frac{b}{a}$.'
explicacion_simple: "Para resolver **ecuaciones cuadráticas incompletas binomias ($a\
  \ x^2 + b x = 0$)**:\n1. Factorizamos la variable $x$ que se repite en ambos términos:\
  \ $x(a x + b) = 0$.\n2. Aplicamos producto nulo:\n   - Primera solución: **$x_1\
  \ = 0$** (siempre es cero).\n   - Segunda solución: despejamos $a x + b = 0 \\implies\
  \ a x = -b \\implies **x_2 = -\\frac{b}{a}**$.\n- Ejemplo: $2x^2 - 10x = 0 \\implies\
  \ x(2x - 10) = 0 \\implies x_1 = 0$ y $2x - 10 = 0 \\implies x_2 = 5$."
explicacion_formal: 'La **factorización por monomio común de la binomia cuadrática**
  es el algoritmo:


  $$a x^2 + b x = 0 \implies x(a x + b) = 0 \implies \begin{cases} x_1 = 0 \\ x_2
  = -\frac{b}{a} \end{cases}$$


  **Desglose de la fórmula:**

  - Identificación del divisor común mayor $x$ que reduce la cuadrática a una raíz
  nula y una lineal de primer grado.'
definiciones_clave: '- **Factorización por factor común**: Extracción del monomio
  de menor potencia $x$ compartido por todos los términos.'
propiedades_relaciones: '- **Presencia constante del cero**: $x = 0$ es la solución
  característica universal de todas las ecuaciones de la forma $a x^2 + b x = 0$.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación cuadrática $3x^2 + 15x = 0$ mediante factorización
    por factor común.
  pasos:
  - 'Paso 1: Extraer la variable $x$ (o $3x$) como factor común: $x(3x + 15) = 0$.Paso
    2: Igualar el primer factor a cero: $x_1 = 0$.Paso 3: Igualar el segundo factor
    a cero y despejar: $3x + 15 = 0 \implies 3x = -15 \implies x_2 = -5$.Paso 4: Concluir
    que el conjunto solución es $S = \{-5, 0\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver la ecuación cuadrática $3x^2 + 15x = 0$, ¿cuáles son sus dos
    soluciones reales?
  choices:
  - text: $x_1 = 0$ y $x_2 = -5$
    is_correct: true
  - text: $x_1 = 0$ y $x_2 = 5$
    is_correct: false
  - text: $x_1 = 3$ y $x_2 = 15$
    is_correct: false
  - text: $x_1 = -3$ y $x_2 = -5$
    is_correct: false
  explanation: La alternativa correcta es '$x_1 = 0$ y $x_2 = -5$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué es un error grave simplificar la ecuación $3x^2 + 15x = 0$ dividiendo
    entre $x$ desde el principio?
  choices:
  - text: Porque al dividir por $x$ se elimina y pierde la solución $x = 0$.
    is_correct: true
  - text: Porque altera el coeficiente 15.
    is_correct: false
  - text: Porque se transforma en una ecuación cuadrática compleja.
    is_correct: false
  - text: Porque no se pueden dividir letras.
    is_correct: false
  explanation: La alternativa correcta es 'Porque al dividir por $x$ se elimina y
    pierde la solución $x = 0$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asegurar que el lado derecho sea cero ($a x^2 + b x = 0$).'
- 'Paso 2: Extraer el factor común $x$.'
- 'Paso 3: Declarar la primera solución $x_1 = 0$.'
- 'Paso 4: Despejar la segunda solución lineal $a x + b = 0 \implies x_2 = -b/a$.'
errores_correccion: '- **Error común:** Cancelar $x$ a ambos lados (hacer $3x^2 =
  -15x \implies 3x = -15 \implies x = -5$).

  - **Cómo corregirlo:** Al cancelar $x$ ''mataste'' la primera raíz $x = 0$. NUNCA
  dividas por $x$; en su lugar, factoriza siempre.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de resolución por factorización.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de resolución por factorización.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La propiedad del producto nulo exige que A * B = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, exige que el miembro derecho sea exactamente cero.
- titulo: ¿Toda ecuación incompleta ax^2 + bx = 0 admite la solución x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, al factorizar x(ax + b) = 0 se obtiene siempre x_1 = 0.
errores_frecuentes:
- Intentar aplicar la propiedad del producto nulo a una ecuación igualada a un número
  distinto de cero.
- Dividir una ecuación cuadrática entre la incógnita $x$ perdiendo la solución fundamental
  $x = 0$.
- Olvidar anteponer el doble signo $\pm$ al extraer raíz cuadrada en la resolución
  de $x^2 = k$.
- Confundir los números de los factores $(x+m)(x+n)$ con las soluciones reales de
  la ecuación (que tienen signos invertidos).
- Violar la jerarquía de operaciones al verificar raíces calculando multiplicaciones
  antes que potencias.
afirmaciones_verdaderas:
- La propiedad del producto nulo establece que $A \cdot B = 0 \iff A = 0 \lor B =
  0$.
- Toda ecuación incompleta binomia $a x^2 + b x = 0$ se resuelve por factor común
  $x(a x + b) = 0$ produciendo siempre la raíz $x = 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones cuadráticas
  completas e incompletas mediante factorización de monomio común, trinomios simples,
  trinomios generales y verificación de raíces.
