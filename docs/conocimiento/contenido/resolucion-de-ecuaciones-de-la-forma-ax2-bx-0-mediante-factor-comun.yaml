procedimiento:
- 'Paso 1: Verifica que la ecuación tenga la forma $ax^2+bx=0$, sin término independiente.'
- 'Paso 2: Factoriza extrayendo $x$ como factor común: $x(ax+b)=0$.'
- 'Paso 3: Aplica la propiedad del producto nulo, igualando cada factor a cero.'
- 'Paso 4: Resuelve cada ecuación resultante para obtener las dos soluciones.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en resolución de ecuaciones de la forma ax² + bx = 0 mediante factor común.
ejemplos:
- titulo: Resolución con factor común simple
  enunciado: Resuelve $x^2-5x=0$.
  solucion_pasos:
  - 'Factorizando: $x(x-5)=0$.'
  - $x=0$ o $x=5$.
- titulo: Resolución con coeficiente principal distinto de 1
  enunciado: Resuelve $4x^2+8x=0$.
  solucion_pasos:
  - 'Factorizando: $4x(x+2)=0$.'
  - $x=0$ o $x=-2$.
- titulo: ¿Una ecuación incompleta binomia tiene siempre $x=0$ como una de sus soluciones?
  enunciado: ¿Una ecuación incompleta binomia tiene siempre $x=0$ como una de sus
    soluciones?
  respuesta: Sí
  solucion_pasos:
  - Al factorizar $x(ax+b)=0$, uno de los factores es siempre $x$, dando la solución
    $x=0$.
- titulo: ¿Es necesario aplicar la fórmula general para resolver una ecuación incompleta
    binomia?
  enunciado: ¿Es necesario aplicar la fórmula general para resolver una ecuación incompleta
    binomia?
  respuesta: 'No'
  solucion_pasos:
  - Factorizar por término común es un método más directo y rápido para este tipo
    de ecuación.
errores_frecuentes:
- Olvidar la solución $x=0$ al resolver la ecuación, reportando solo la otra raíz.
- Dividir por $x$ en vez de factorizar, lo que elimina indebidamente la solución $x=0$.
- Factorizar incorrectamente el término común, dejando un factor con signo equivocado.
- Aplicar la fórmula general innecesariamente cuando la factorización es más directa.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando resolución
  de ecuaciones de la forma ax² + bx = 0 mediante factor común.
