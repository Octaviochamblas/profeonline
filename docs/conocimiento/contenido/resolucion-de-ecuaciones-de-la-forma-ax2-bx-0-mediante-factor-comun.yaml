semantic_id: MAT.ALG.EC_CUADR_RESOL_FACTOR.INCOMPLETA_BINOMIA
resumen_inicial: La resolución de $ax^2 + bx = 0$ mediante factor común aísla la variable $x$, obteniendo de forma inmediata la solución $x_1 = 0$ y $x_2 = -b/a$.
explicacion_simple: |
  Para resolver ecuaciones cuadráticas incompletas binomias (donde falta la constante $c$, es decir $ax^2 + bx = 0$):

  1. Ambas partes del lado izquierdo contienen la letra $x$. Por eso, **extraes la $x$ como factor común**:
     $$x(ax + b) = 0$$
  2. Aplicas la regla del producto igual a cero:
     - **Primera solución**: $x_1 = 0$ (siempre es cero).
     - **Segunda solución**: Igualas el paréntesis a cero $ax + b = 0 \implies x_2 = -\frac{b}{a}$.
  - **Ejemplo**: $4x^2 - 12x = 0 \implies x(4x - 12) = 0 \implies x_1 = 0 \quad \text{y} \quad 4x = 12 \implies x_2 = 3$.
explicacion_formal: |
  Sea la ecuación cuadrática incompleta binomia $ax^2 + bx = 0$ con $a, b \in \mathbb{R} \setminus \{0\}$. La aplicación del axioma de distributividad a la izquierda permite la extracción del factor común algebraico $x$:

  $$ax^2 + bx = 0 \iff x(ax + b) = 0$$

  **Demostración del conjunto solución $S$:**
  Por la propiedad del producto nulo:
  $$x = 0 \quad \lor \quad ax + b = 0 \implies x_1 = 0 \quad \text{y} \quad x_2 = -\frac{b}{a}$$
  $$S = \left\{0, -\frac{b}{a}\right\}$$
definiciones_clave: |
  - **Factorización por factor común**: Proceso de transformar la suma de términos $ax^2 + bx$ en el producto $x(ax + b)$ extrayendo la variable común $x$.
propiedades_relaciones: |
  - **Invariancia de la solución nula**: Independientemente de los valores numéricos de los coeficientes $a$ y $b$, la solución $x = 0$ pertenece obligatoriamente al conjunto solución de toda ecuación binomia $ax^2 + bx = 0$.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación cuadrática incompleta $5x^2 + 15x = 0$ mediante factorización por factor común.'
  pasos:
    - 'Paso 1: Extraer el factor común $5x$ (o simplemente $x$): $5x(x + 3) = 0$.'
    - 'Paso 2: Igualar el primer factor a cero: $5x = 0 \implies x_1 = 0$.'
    - 'Paso 3: Igualar el segundo factor binomio a cero: $x + 3 = 0 \implies x_2 = -3$.'
    - 'Paso 4: Escribir el conjunto solución: $S = \{0, -3\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la ecuación cuadrática incompleta $ax^2 + bx = 0$ siempre incluye al número $0$ dentro de sus soluciones?'
    choices:
      - {text: 'Porque al extraer $x$ como factor común queda $x(ax + b) = 0$, haciendo que $x = 0$ sea raíz.', is_correct: true}
      - {text: 'Porque el coeficiente cuadrático $a$ vale cero.', is_correct: false}
      - {text: 'Porque el discriminante de la ecuación es siempre negativo.', is_correct: false}
      - {text: 'Porque la constante independiente $c$ es igual a 1.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque al extraer $x$ como factor común queda $x(ax + b) = 0$, haciendo que $x = 0$ sea raíz.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el conjunto solución de la ecuación $3x^2 - 18x = 0$?'
    choices:
      - {text: '$S = \{0, 6\}$', is_correct: true}
      - {text: '$S = \{0, -6\}$', is_correct: false}
      - {text: '$S = \{6\}$', is_correct: false}
      - {text: '$S = \{-6, 6\}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$S = \{0, 6\}$''. Factorizando $3x(x - 6) = 0$ se obtienen las raíces $0$ y $6$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Transponer términos para dejar la ecuación binomia reducida e igualada a cero ($ax^2 + bx = 0$).'
  - 'Paso 2: Extraer la incógnita $x$ (y opcionalmente el M.C.D. numérico de $a$ y $b$) como factor común.'
  - 'Paso 3: Escribir la expresión factorizada $x(ax + b) = 0$.'
  - 'Paso 4: Declarar $x_1 = 0$ y despejar $x_2 = -\frac{b}{a}$ desde el paréntesis.'
errores_correccion: |
  - **Error común:** Cancelar la $x$ dividiendo toda la ecuación por $x$ (ej. de $2x^2 = 8x$ obtener $2x = 8 \implies x = 4$ perdiendo $x = 0$).
  - **Cómo corregirlo:** **NUNCA SIMPLIFIQUES O CANCELES LA VARIABLE $x$** dividiendo; extrae el factor común y conserva la solución $x = 0$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Coeficiente positivo y negativo.
    alternativas:
      - '$S = \{0, 4\}$'
      - '$S = \{-4, 4\}$'
      - '$S = \{4\}$'
    respuesta: '$S = \{0, 4\}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Coeficiente fraccionario.
    alternativas:
      - '$S = \{0, -5/2\}$'
      - '$S = \{0, 5/2\}$'
      - '$S = \{-5/2\}$'
    respuesta: '$S = \{0, -5/2\}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dividir ambos miembros de $5x^2 = 10x$ entre $x$ es una simplificación algebraica que no elimina soluciones.'
  - 'El conjunto solución de la ecuación binomia $x^2 + 6x = 0$ es únicamente el número $x = -6$.'
  - 'La extracción de factor común en $ax^2 + bx = 0$ requiere el uso de la fórmula general cuadrática.'
  - 'Si el coeficiente $b$ es negativo en $ax^2 - bx = 0$, la solución nula $x = 0$ deja de pertenecer al conjunto solución.'
  - 'Una ecuación cuadrática sin término independiente tiene siempre dos soluciones reales no nulas distintas.'
afirmaciones_verdaderas:
  - 'Factorizar $ax^2 + bx = 0$ por factor común da $x(ax + b) = 0$, garantizando que $x_1 = 0$ sea siempre solución.'
  - 'La segunda raíz de la ecuación binomia $ax^2 + bx = 0$ se obtiene resolviendo la ecuación de primer grado $ax + b = 0$, resultando $x_2 = -\frac{b}{a}$.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones cuadráticas incompletas binomias $ax^2 + bx = 0$ mediante factorización por factor común.
  CÓMO: Extraer $x$ como factor común $x(ax + b) = 0$, obtener $x_1 = 0$ y despejar $x_2 = -b/a$ sin cancelar variables.
