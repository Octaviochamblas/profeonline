semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.POTENCIA_DE_COCIENTE
resumen_inicial: 'La potencia de un cociente distribuye el exponente sobre el numerador y el denominador: $\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$ para $b \neq 0$.'
explicacion_simple: '![Potencia de un cociente](/static/img/nodos/potencia-de-un-cociente-intro.svg)


  Cuando tienes una fracción o división adentro de un paréntesis elevada a un exponente, ese exponente se reparte tanto al numerador (arriba) como al denominador (abajo). Por ejemplo, $(2/5)^3 = 2^3 / 5^3 = 8/125$. Si el exponente es negativo, como $(2/3)^{-2}$, la fracción se da vuelta primero y luego se distribuye: $(3/2)^2 = 9/4$. ¡Es fundamental simplificar la fracción antes de elevarla para trabajar con números más chicos!'
explicacion_formal: 'Sean $a, b \in \mathbb{R}$ con $b \neq 0$ y $n \in \mathbb{R}$. El **Teorema de Distributividad de la Potenciación sobre el Cociente** establece que:


  $$\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$$


  **Demostración para $n \in \mathbb{N}$:**

  $$\left(\frac{a}{b}\right)^n = \underbrace{\frac{a}{b} \cdot \frac{a}{b} \cdot \dots \cdot \frac{a}{b}}_{n \text{ factores}} = \frac{\overbrace{a \cdot a \dots a}^{n \text{ factores}}}{\underbrace{b \cdot b \dots b}_{n \text{ factores}}} = \frac{a^n}{b^n}$$


  **Propiedad de inversión con exponente negativo ($a, b \neq 0$):**

  $$\left(\frac{a}{b}\right)^{-n} = \frac{1}{\left(\frac{a}{b}\right)^n} = \frac{1}{\frac{a^n}{b^n}} = \frac{b^n}{a^n} = \left(\frac{b}{a}\right)^n$$


  **Distribución en fracciones algebraicas compuestas:**

  $$\left(\frac{k \cdot x^p}{m \cdot y^q}\right)^n = \frac{k^n \cdot x^{p \cdot n}}{m^n \cdot y^{q \cdot n}}$$'
definiciones_clave: '- **Potencia de un cociente**: Elevación independiente del dividendo y divisor al mismo grado exponencial.

  - **Inversión fraccionaria**: Propiedad que transforma $(\frac{a}{b})^{-n}$ en $(\frac{b}{a})^n$.'
propiedades_relaciones: '- **Simplificación previa recomendada**: $\left(\frac{10}{15}\right)^3 = \left(\frac{2}{3}\right)^3 = \frac{8}{27}$ (evita calcular $1000 / 3375$).

  - **Paréntesis indispensables**: $\left(\frac{a}{b}\right)^n \neq \frac{a^n}{b}$ y $\neq \frac{a}{b^n}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de potencia de un cociente](/static/img/nodos/potencia-de-un-cociente-ejemplos.svg)


    Calcule y exprese en forma irreducible las potencias $\left(\frac{2}{5}\right)^3$, $\left(\frac{x^3}{2}\right)^4$ y $\left(-\frac{3}{2}\right)^{-3}$.'
  pasos:
  - 'Paso 1: Evaluar $\left(\frac{2}{5}\right)^3$: Distribuir exponente $3$: $\frac{2^3}{5^3} = \frac{8}{125}$.'
  - 'Paso 2: Evaluar $\left(\frac{x^3}{2}\right)^4$: Distribuir exponente $4$: $\frac{(x^3)^4}{2^4} = \frac{x^{12}}{16}$.'
  - 'Paso 3: Evaluar $\left(-\frac{3}{2}\right)^{-3}$: Invertir la fracción cambiando signo del exponente: $\left(-\frac{2}{3}\right)^3$. Distribuir con signo impar: $-\frac{2^3}{3^3} = -\frac{8}{27}$.'
  - 'Conclusión: Los resultados son $\frac{8}{125}$, $\frac{x^{12}}{16}$ y $-\frac{8}{27}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\left(\frac{3}{4}\right)^2$?
  choices:
  - text: $\frac{9}{16}$ (distribuyendo el cuadrado a $3^2$ y $4^2$)
    is_correct: true
  - text: $\frac{9}{4}$
    is_correct: false
  - text: $\frac{3}{16}$
    is_correct: false
  - text: $\frac{6}{8}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{9}{16}$ (distribuyendo el cuadrado a $3^2$ y $4^2$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se resolvió $\left(-\frac{3}{2}\right)^{-3}$?
  choices:
  - text: Invirtiendo la fracción a $\left(-\frac{2}{3}\right)^3$ y elevando a $-\frac{8}{27}$
    is_correct: true
  - text: Cambiando el signo a positivo $+\frac{27}{8}$
    is_correct: false
  - text: Multiplicando por $-3$
    is_correct: false
  - text: Restando los términos
    is_correct: false
  explanation: La alternativa correcta es 'Invirtiendo la fracción a $\left(-\frac{2}{3}\right)^3$ y elevando a $-\frac{8}{27}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar la fracción interior a su forma irreductible si es posible.'
- 'Paso 2: Si el exponente es negativo, invertir la fracción y convertir el exponente a positivo: $(\frac{b}{a})^n$.'
- 'Paso 3: Distribuir el exponente independientemente al numerador y al denominador: $\frac{a^n}{b^n}$, aplicando reglas de signos de paridad.'
errores_correccion: '- **Error 1: Elevar solo el numerador (pensar que $(3/5)^2 = 9/5$).** **Cómo corregirlo:** El paréntesis abarca toda la fracción; DEBE elevarse también el denominador: $\frac{3^2}{5^2} = \frac{9}{25}$.

  - **Error 2: Invertir y olvidar cambiar el signo del exponente.** **Cómo corregirlo:** Al invertir la base, el exponente pasa a ser positivo: $(2/3)^{-4} = (3/2)^4 = 81/16$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $\left(\frac{1}{3}\right)^4$?
  alternativas:
  - $\frac{1}{81}$
  - $\frac{1}{12}$
  - $\frac{4}{81}$
  respuesta: $\frac{1}{81}$
  solucion_pasos:
  - $\left(\frac{1}{3}\right)^4 = \frac{1^4}{3^4} = \frac{1}{81}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\left(\frac{2}{5}\right)^{-2}$?
  alternativas:
  - $\frac{25}{4}$
  - $-\frac{4}{25}$
  - $\frac{4}{25}$
  respuesta: $\frac{25}{4}$
  solucion_pasos:
  - $\left(\frac{2}{5}\right)^{-2} = \left(\frac{5}{2}\right)^2 = \frac{25}{4}$.
- titulo: ¿Es (4/3)³ igual a 64/27?
  respuesta: Sí
  solucion_pasos:
  - Sí, $4^3 / 3^3 = 64 / 27$.
  alternativas:
  - texto: Sí, $\frac{4^3}{3^3} = \frac{64}{27}$
    es_correcta: true
    retroalimentacion: ¡Correcto! El exponente 3 eleva a 4 y a 3.
  - texto: No, es igual a 12/9
    es_correcta: false
    retroalimentacion: Incorrecto, no es multiplicación por 3.
  - texto: No, es igual a 64/3
    es_correcta: false
    retroalimentacion: Incorrecto, falta elevar el denominador.
- titulo: ¿Es (-1/2)⁴ igual a -1/16?
  respuesta: 'No'
  solucion_pasos:
  - No, el exponente 4 es par, por lo que $(-1/2)^4 = +1/16$.
  alternativas:
  - texto: No, el exponente 4 es par y el resultado es +1/16
    es_correcta: true
    retroalimentacion: ¡Correcto! Toda potencia de base negativa con exponente par es positiva.
  - texto: Sí, conserva el signo negativo
    es_correcta: false
    retroalimentacion: Incorrecto, solo los exponentes impares conservan el signo negativo.
  - texto: No, es igual a -1/8
    es_correcta: false
    retroalimentacion: Incorrecto, $2^4 = 16$.
errores_frecuentes:
- Elevar solo el numerador olvidando el denominador.
- Multiplicar la fracción por el exponente en vez de elevar.
- No invertir la fracción al operar exponentes negativos.
- Calcular potencias de fracciones sin simplificarlas previamente.
- Asignar signo negativo a fracciones negativas con exponentes pares.
afirmaciones_verdaderas:
- Para toda fracción $\frac{a}{b}$ con $b \neq 0$, $(\frac{a}{b})^n = \frac{a^n}{b^n}$.
- La inversión de base fraccionaria $(\frac{a}{b})^{-n} = (\frac{b}{a})^n$ es válida para $a, b \neq 0$.
- La distribución del exponente sobre el cociente conserva la paridad de signos de la base.
al_terminar_debes_poder: '![Síntesis de potencia de un cociente](/static/img/nodos/potencia-de-un-cociente-resumen.svg)


  QUÉ: Aplicar la ley distributiva de la potencia sobre divisiones y fracciones.


  CÓMO: Distribuyendo el exponente al numerador y denominador $\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$ ($b \neq 0$), invirtiendo la fracción ante exponentes negativos $(\frac{a}{b})^{-n} = (\frac{b}{a})^n$, y simplificando previamente la fracción para optimizar el cálculo.'
