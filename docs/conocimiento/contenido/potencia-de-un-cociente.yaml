semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.POTENCIA_DE_COCIENTE
resumen_inicial: La potencia de un cociente es igual al cociente entre la potencia del dividendo
  y la del divisor ($\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$ para $b \neq 0$).
explicacion_simple: 'Cuando tienes una división o fracción dentro de un paréntesis elevada
  a un exponente, el exponente se distribuye al numerador y al denominador:

  $$\left(\frac{4}{2}\right)^3 = \frac{4^3}{2^3} = \frac{64}{8} = 8$$

  Comprobando directamente: $\left(\frac{4}{2}\right)^3 = 2^3 = 8$.'
explicacion_formal: 'Para todo $a \in \mathbb{R}$, $b \in \mathbb{R} \setminus \{0\}$ y $n
  \in \mathbb{R}$, se cumple:

  $$\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$$'
definiciones_clave: '- **Distributividad sobre el cociente**: Repartición del exponente entre
  dividendo y divisor.'
propiedades_relaciones: '- **Equivalencia con producto**: $\left(\frac{a}{b}\right)^n = (a
  \cdot b^{-1})^n = a^n \cdot b^{-n} = \frac{a^n}{b^n}$.'
ejemplo_guiado:
  enunciado: Desarrolla y simplifica $\left(\frac{2x^2}{3}\right)^3$.
  pasos:
  - 'Distribuir el exponente $3$ al numerador $(2x^2)$ y al denominador $3$: $\frac{(2x^2)^3}{3^3}$.'
  - 'Desarrollar el numerador: $2^3 \cdot (x^2)^3 = 8x^6$.'
  - 'Desarrollar el denominador: $3^3 = 27$.'
  - 'Formar la fracción resultante: $\frac{8x^6}{27}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la expresión $\left(\frac{x}{5}\right)^2$?
  choices:
  - text: x^2 / 25
    is_correct: true
  - text: x^2 / 5
    is_correct: false
  - text: 2x / 10
    is_correct: false
  - text: x^2 / 10
    is_correct: false
  explanation: 'La correcta es: x^2 / 25. Elevamos numerador y denominador: $\frac{x^2}{5^2}
    = \frac{x^2}{25}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $\left(\frac{3}{2}\right)^4$.
  choices:
  - text: 81/16
    is_correct: true
  - text: 12/8
    is_correct: false
  - text: 81/2
    is_correct: false
  - text: 3/16
    is_correct: false
  explanation: 'La correcta es: 81/16. $\frac{3^4}{2^4} = \frac{81}{16}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el numerador y el denominador dentro del paréntesis.'
- 'Paso 2: Elevar el numerador al exponente exterior.'
- 'Paso 3: Elevar el denominador al exponente exterior.'
- 'Paso 4: Simplificar la fracción resultante.'
errores_correccion: No olvides aplicar la potencia al denominador. $\left(\frac{x}{3}\right)^2$
  es $\frac{x^2}{9}$, no $\frac{x^2}{3}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\left(\frac{1}{3}\right)^3$.
  alternativas:
  - 1/27
  - 1/9
  - 3/27
  respuesta: 1/27
  solucion_pasos:
  - $\frac{1^3}{3^3} = \frac{1}{27}$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale (a/2)^3?
  alternativas:
  - a^3/8
  - a^3/6
  - a/8
  respuesta: a^3/8
  solucion_pasos:
  - 'Se eleva numerador y denominador: a^3 y 2^3=8.'
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de (10/5)^2?
  alternativas:
  - '4'
  - '2'
  - '20'
  respuesta: '4'
  solucion_pasos:
  - (10/5)^2 = 2^2 = 4.
- titulo: ¿Es (6/3)^2 igual a 6^2/3?
  respuesta: 'No'
  solucion_pasos:
  - 'Debe elevarse también el denominador: 6^2/3^2 = 36/9 = 4.'
errores_frecuentes:
- Olvidar elevar el denominador.
- Elevar solo el numerador de la fracción y omitir el denominador.
- Aplicar la distributividad de la potencia a una resta de fracciones.
- Olvidar simplificar la fracción resultante después de elevar numerador y denominador.
- Confundir la potencia de un cociente con la potencia de un producto, sumando en vez de dividiendo
  las bases.
afirmaciones_verdaderas:
- $\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$ para $b \neq 0$.
- La propiedad (a/b)^n=a^n/b^n requiere que el denominador b sea distinto de cero.
al_terminar_debes_poder: Distribuir correctamente los exponentes en divisiones y fracciones.
fuente: Texto escolar MINEDUC.
estado: publicado
