semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.POTENCIA_DE_COCIENTE
resumen_inicial: 'La potencia de una división o cociente $\left(\frac{a}{b}\right)^n$
  es igual a la división de las potencias del dividendo y del divisor: $\left(\frac{a}{b}\right)^n
  = \frac{a^n}{b^n}$ ($b \neq 0$).'
explicacion_simple: Cuando tenemos una división o fracción dentro de un paréntesis
  elevada a un exponente, el exponente se distribuye y eleva de manera independiente
  tanto a la parte de arriba como a la parte de abajo.
explicacion_formal: 'Para todo $a, b \in \mathbb{R}$ ($b \neq 0$) y exponente $n \in
  \mathbb{R}$, la **Distributividad sobre el Cociente** asegura:


  $$\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$$


  **Demostración:**

  $$\left(\frac{a}{b}\right)^n = \left(a \cdot b^{-1}\right)^n = a^n \cdot \left(b^{-1}\right)^n
  = a^n \cdot b^{-n} = \frac{a^n}{b^n}$$


  > **Complemento didáctico:** Esta regla es la versión distribuida en fracciones
  de la ley de potencias de base racional.'
definiciones_clave: '- **Potencia de un cociente**: Regla $\left(\frac{a}{b}\right)^n
  = \frac{a^n}{b^n}$ que distribuye el exponente entre dividendo y divisor.'
propiedades_relaciones: '- **Distributividad sobre cociente**: $(a/b)^n = a^n / b^n$
  para $b \neq 0$.'
ejemplo_guiado:
  enunciado: Desarrolle y simplifique $\left(\frac{4}{2}\right)^3$.
  pasos:
  - 'Paso 1: Aplicar distributividad: $\frac{4^3}{2^3}$.'
  - 'Paso 2: Calcular numeradores y denominadores: $4^3 = 64$ y $2^3 = 8$.'
  - 'Paso 3: Dividir los resultados: $\frac{64}{8} = 8$.'
  - 'Conclusión: $\left(\frac{4}{2}\right)^3 = 8$ (verificable haciendo $2^3 = 8$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se distribuye el exponente n en la potencia de un cociente (a /
    b)^n?
  choices:
  - text: Se distribuye elevando tanto dividendo a^n como divisor b^n
    is_correct: true
  - text: Eleva solo a y deja b intacto
    is_correct: false
  - text: Se restan dividendo y divisor
    is_correct: false
  - text: Se multiplica por 2
    is_correct: false
  explanation: La alternativa correcta es 'Se distribuye elevando tanto dividendo
    a^n como divisor b^n'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (4/2)^3, ¿cuál fue el resultado final?
  choices:
  - text: '8'
    is_correct: true
  - text: '64'
    is_correct: false
  - text: '6'
    is_correct: false
  - text: '16'
    is_correct: false
  explanation: La alternativa correcta es '8'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que el divisor $b$ sea distinto de cero.'
- 'Paso 2: Distribuir el exponente al dividendo ($a^n$) y al divisor ($b^n$).'
- 'Paso 3: Calcular la fracción o cociente resultante $\frac{a^n}{b^n}$.'
errores_correccion: '- **Error 1: Elevar solo el dividendo en $\left(\frac{x}{2}\right)^3$
  escribiendo $\frac{x^3}{2}$.** **Cómo corregirlo:** Se DEBE elevar el denominador
  a la potencia: $\frac{x^3}{2^3} = \frac{x^3}{8}$.


  - **Error 2: Aplicar la regla con denominador cero.** **Cómo corregirlo:** La división
  por cero $b=0$ no está definida en $\mathbb{R}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $\left(\frac{10}{5}\right)^4$.
  alternativas:
  - '16'
  - '2'
  - '8'
  respuesta: '16'
  solucion_pasos:
  - $\left(\frac{10}{5}\right)^4 = 2^4 = 16$.
- titulo: Ejemplo 2
  enunciado: Desarrolle $\left(\frac{x}{3}\right)^2$.
  alternativas:
  - x^2 / 9
  - x^2 / 3
  - 2x / 6
  respuesta: x^2 / 9
  solucion_pasos:
  - $\frac{x^2}{3^2} = \frac{x^2}{9}$.
- titulo: ¿Es (a/b)^n igual a a^n / b^n para b ≠ 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, por propiedad de potencia de un cociente.
- titulo: ¿Se aplica la potencia al denominador cuando la división está entre paréntesis?
  respuesta: Sí
  solucion_pasos:
  - Sí, el paréntesis encierra la división completa.
errores_frecuentes:
- Elevar únicamente la parte superior de la división dejando el denominador sin el
  exponente.
- La expresión $\left(\frac{x}{4}\right)^2$ equivale a $\frac{x^2}{4}$ conservando
  el divisor 4.
- Dividir el exponente por el denominador en lugar de elevar la base.
- Aplicar la regla de la potencia de un cociente cuando el denominador es igual a
  cero.
- Invertir los términos de la fracción al aplicar la potencia con exponente positivo.
afirmaciones_verdaderas:
- 'La potencia de un cociente se distribuye en numerador y denominador: $\left(\frac{a}{b}\right)^n
  = \frac{a^n}{b^n}$ ($b \neq 0$).'
- Esta propiedad preserva la relación de equivalencia con el desarrollo directo del
  cociente.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la potencia de un cociente
  $\left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}$, elevando adecuadamente dividendo
  y divisor.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
