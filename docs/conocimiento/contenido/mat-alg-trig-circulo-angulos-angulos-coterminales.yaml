semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.ANGULOS_COTERMINALES
resumen_inicial: 'Identificación de ángulos coterminales en grados o radianes: círculo
  unitario, amplitud, período y transformaciones de Círculo unitario y sistemas de
  medida.'
explicacion_simple: Un mismo punto del círculo unitario puede alcanzarse dando distinta
  cantidad de vueltas, lo que da origen a familias de ángulos que comparten la misma
  posición final.
explicacion_formal: '### Definición formal


  Los ángulos $\theta$ y $\theta+360°k$ (con $k\in\mathbb{Z}$) son coterminales, ya
  que sumar o restar vueltas completas no cambia la posición final del lado terminal.
  En radianes, la relación equivalente es $\theta+2\pi k$.


  ### Desarrollo didáctico


  El ángulo $30°$ es coterminal con $390°$ ($30°+360°$), con $-330°$ ($30°-360°$),
  y con $750°$ ($30°+2\cdot360°$). Todos comparten el mismo lado terminal y, por lo
  tanto, el mismo punto en el círculo unitario.'
definiciones_clave: '- **Identificación de ángulos coterminales en grados o radianes**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación de ángulos coterminales en grados o radianes.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación de ángulos coterminales en grados o radianes.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación de ángulos coterminales en grados o
    radianes.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
