semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.ANGULOS_COTERMINALES
resumen_inicial: 'Identificación de ángulos coterminales que comparten exactamente el mismo lado inicial y terminal tras dar uno o más giros completos.'
explicacion_simple: |
  Si un bailarín sobre una pista de hielo hace un giro de $30^\circ$, su cuerpo apunta en cierta dirección. Si luego hace un giro completo de $360^\circ$ más los $30^\circ$ iniciales ($390^\circ$), terminará apuntando exactamente en la misma dirección. En trigonometría, dos ángulos que se detienen exactamente en la misma posición final se llaman **ángulos coterminales**. Como el círculo tiene $360^\circ$ (o $2\pi \text{ rad}$), puedes encontrar infinitos ángulos coterminales sumando o restando vueltas completas.
explicacion_formal: |
  ### Definición formal
  Dos ángulos $\alpha$ y $\beta$ en posición estándar son **coterminales** si y solo si comparten el mismo lado terminal. Analíticamente, la diferencia entre dos ángulos coterminales es un múltiplo entero exacto de una vuelta completa ($360^\circ$ o $2\pi \text{ rad}$):
  $$\alpha - \beta = k \cdot 360^\circ = k \cdot (2\pi \text{ rad}) \quad (k \in \mathbb{Z})$$

  ### Desglose simbólico
  - $\alpha, \beta$: Ángulos orientados en posición estándar.
  - $k \in \mathbb{Z}$: Número entero de vueltas o giros completos ($k > 0$ giro antihorario, $k < 0$ giro horario).
  - Condición de coincidencia: Si $\alpha$ y $\beta$ son coterminales $\implies P_{\alpha}(x,y) = P_{\beta}(x,y)$ en el círculo unitario.

  ### Síntesis didáctica
  Los ángulos coterminales poseen valores trigonométricos idénticos. Esto permite simplificar cualquier ángulo gigante (como $750^\circ$) o negativo (como $-300^\circ$) restando o sumando giros de $360^\circ$ hasta reducirlo a un ángulo equivalente comprendido entre $0^\circ$ y $360^\circ$.
definiciones_clave: |
  - **Ángulos coterminales**: Ángulos en posición estándar que coinciden exactamente en la posición de sus lados terminales.
  - **Número de vueltas ($k$)**: Cantidad de giros de $360^\circ$ ($2\pi \text{ rad}$) que diferencian a dos ángulos coterminales.
  - **Reducción al primer giro**: Procedimiento para expresar un ángulo coterminal en el intervalo base $[0^\circ, 360^\circ[$.
propiedades_relaciones: |
  - **Identidad trigonométrica de coterminales**:
    - $\sin(\theta + k \cdot 360^\circ) = \sin(\theta)$
    - $\cos(\theta + k \cdot 360^\circ) = \cos(\theta)$
  - **Infinitud de coterminales**: Para cualquier ángulo dado existen infinitos ángulos coterminales positivos y negativos.
ejemplo_guiado:
  enunciado: 'Determina si los ángulos $\alpha = 750^\circ$ y $\beta = 30^\circ$ son coterminales, halla el número de vueltas $k$ que los separa y escribe las coordenadas de su punto sobre el círculo unitario.'
  pasos:
    - 'Paso 1: Calcular la diferencia entre ambos ángulos: $\alpha - \beta = 750^\circ - 30^\circ = 720^\circ$.'
    - 'Paso 2: Dividir la diferencia por el valor de un giro completo ($360^\circ$): $\frac{720^\circ}{360^\circ} = 2$.'
    - 'Paso 3: Como el resultado es un entero exacto ($k = 2$), los ángulos son **coterminales** (difieren en 2 vueltas completas).'
    - 'Paso 4: Su punto común en el círculo unitario es $P(\cos 30^\circ, \sin 30^\circ) = \left(\frac{\sqrt{3}}{2}, \frac{1}{2}\right)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición algebraica deben cumplir dos ángulos $\alpha$ y $\beta$ para ser coterminales?'
    choices:
      - {text: 'Su diferencia debe ser un múltiplo entero de $360^\circ$ ($2\pi \text{ rad}$)', is_correct: true}
      - {text: 'Su suma debe ser igual a $90^\circ$', is_correct: false}
      - {text: 'Su producto debe dar igual a $1$', is_correct: false}
      - {text: 'Su diferencia debe ser menor a $45^\circ$', is_correct: false}
    explanation: 'La alternativa correcta es ''Su diferencia debe ser un múltiplo entero de $360^\circ$ ($2\pi \text{ rad}$)''. Define analíticamente la coincidencia de lados terminales.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el ángulo en el primer giro ($0^\circ \le \theta < 360^\circ$) que es coterminal con $\theta = -60^\circ$?'
    choices:
      - {text: '$300^\circ$', is_correct: true}
      - {text: '$120^\circ$', is_correct: false}
      - {text: '$240^\circ$', is_correct: false}
      - {text: '$60^\circ$', is_correct: false}
    explanation: 'La alternativa correcta es ''$300^\circ$''. Sumando un giro completo: $-60^\circ + 360^\circ = 300^\circ$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Restar los dos ángulos a comparar $\alpha - \beta$.'
  - 'Paso 2: Dividir la diferencia entre $360^\circ$ (o entre $2\pi \text{ rad}$).'
  - 'Paso 3: Verificar si el resultado de la división es un número entero $k \in \mathbb{Z}$.'
  - 'Paso 4: Concluir que los ángulos son coterminales si $k$ es entero y comparten las mismas razones trigonométricas.'
errores_correccion: |
  - **Error 1:** Creer que dos ángulos son coterminales si suman $360^\circ$. **Cómo corregirlo:** La condición exige que su **diferencia** (resta) sea un múltiplo de $360^\circ$, no su suma. Dos ángulos que suman $360^\circ$ son suplementarios en el círculo, no coterminales.
  - **Error 2:** Pensar que ángulos coterminales tienen razones trigonométricas diferentes por tener valores numéricos distintos. **Cómo corregirlo:** Al compartir exactamente el mismo lado terminal en el círculo unitario, sus razones trigonométricas (seno, coseno, tangente) son idénticas.
ejemplos:
  - titulo: 'Verificación de coterminales'
    enunciado: '¿Son $\alpha = 400^\circ$ y $\beta = 40^\circ$ ángulos coterminales?'
    alternativas:
      - 'Sí, pues $400^\circ - 40^\circ = 360^\circ$ (1 vuelta)'
      - 'No, pues $400^\circ$ es mayor a una vuelta'
      - 'No, pues están en cuadrantes diferentes'
    respuesta: 'Sí, pues $400^\circ - 40^\circ = 360^\circ$ (1 vuelta)'
    solucion_pasos:
      - '1. Restamos los ángulos: $400^\circ - 40^\circ = 360^\circ$.'
      - '2. La diferencia es exactamente 1 vuelta completa.'
      - '3. Son ángulos coterminales.'
  - titulo: 'Coterminal negativo'
    enunciado: '¿Es $\theta = -300^\circ$ coterminal con $\theta = 60^\circ$?'
    alternativas:
      - 'Sí, pues $60^\circ - (-300^\circ) = 360^\circ$'
      - 'No, el signo negativo lo impide'
      - 'No, la diferencia debe ser $180^\circ$'
    respuesta: 'Sí, pues $60^\circ - (-300^\circ) = 360^\circ$'
    solucion_pasos:
      - '1. Restamos: $60^\circ - (-300^\circ) = 60^\circ + 300^\circ = 360^\circ$.'
      - '2. Difieren en 1 giro completo, por lo que son coterminales.'
  - titulo: 'Igualdad de valores de seno'
    enunciado: 'Si dos ángulos son coterminales, ¿tienen exactamente el mismo valor de seno?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al compartir la misma posición terminal sobre el círculo unitario, sus ordenadas coinciden.'
  - titulo: 'Diferencia en radianes'
    enunciado: '¿Los ángulos $\frac{\pi}{4}$ y $\frac{9\pi}{4}$ son coterminales?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\frac{9\pi}{4} - \frac{\pi}{4} = \frac{8\pi}{4} = 2\pi \text{ rad}$ (1 giro completo).'
errores_frecuentes:
  - 'La afirmación de que dos ángulos son coterminales si la suma de sus medidas equivale a $360^\circ$.'
  - 'La afirmación de que los ángulos coterminales poseen valores de coseno diferentes.'
  - 'La afirmación de que un ángulo negativo jamás puede ser coterminal con un ángulo positivo.'
  - 'La afirmación de que la sustracción de $360^\circ$ a un ángulo modifica la posición de su lado terminal.'
  - 'La afirmación de que existen únicamente dos ángulos coterminales para cada medida dada.'
afirmaciones_verdaderas:
  - 'Dos ángulos en posición estándar son coterminales si su diferencia es un múltiplo entero de $360^\circ$ ($2\pi \text{ rad}$).'
  - 'Los ángulos coterminales comparten el mismo lado terminal en el círculo unitario y tienen razones trigonométricas idénticas.'
al_terminar_debes_poder: |
  QUÉ: Identificar y calcular ángulos coterminales positivos y negativos.
  CÓMO: Comprobar que su diferencia es múltiplo entero de $360^\circ$ ($2\pi \text{ rad}$) y reducir ángulos a su giro principal.
