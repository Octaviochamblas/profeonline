semantic_id: MAT.GEO.TEOREMA_TALES.RECIPROCO_PARALELISMO
resumen_inicial: 'Para justificar formalmente si dos rectas son paralelas en un triángulo, se calculan por separado las razones de los segmentos determinados en ambos lados y se aplica el Recíproco del Teorema de Tales si los valores coinciden.'
explicacion_simple: |
  ![Justificación y Demostración de Paralelismo](/static/img/nodos/uso-del-reciproco-del-teorema-de-tales-para-justificar-paralelismo-intro.svg)

  Divides los trozos del lado izquierdo y los trozos del lado derecho por separado: si da el mismo número, las líneas son paralelas; si da distinto, no lo son.
explicacion_formal: |
  ### Algoritmo formal de verificación de paralelismo
  Dados los puntos $D \in \overline{AB}$ y $E \in \overline{AC}$ con longitudes numéricas conocidas:

  1. **Calcular la razón lateral izquierda**:
     $$r_1 = \frac{\|\overline{AD}\|}{\|\overline{DB}\|}$$

  2. **Calcular la razón lateral derecha**:
     $$r_2 = \frac{\|\overline{AE}\|}{\|\overline{EC}\|}$$

  3. **Comparar los valores obtenidos**:
     - Si $r_1 = r_2 \implies \overline{DE} \parallel \overline{BC}$ (Paralelismo formalmente demostrado).
     - Si $r_1 \neq r_2 \implies \overline{DE} \not\parallel \overline{BC}$ (Rectas secantes no paralelas).

  ### Desglose simbólico y geométrico
  - Prueba analítica: Simplificar fracciones a su forma irreducible $\frac{p}{q}$ antes de comparar para evitar errores de redondeo decimal.

  ### Síntesis didáctica
  Este método constituye una herramienta de control de calidad en arquitectura, carpintería y nivelación de obras civiles.
definiciones_clave: |
  - **Teorema de Tales**: Teorema de proporcionalidad geométrica determinado por un haz de rectas paralelas cortadas por secantes.
  - **Segmentos homólogos**: Segmentos correspondientes delimitados por las mismas rectas paralelas en distintas transversales.
  - **Recíproco de Tales**: Teorema que demuestra el paralelismo de dos rectas a partir de la igualdad de razones entre segmentos.
  - **Modelamiento de sombras**: Aplicación geométrica para calcular alturas inaccesibles mediante la sombra solar proyectada.
propiedades_relaciones: |
  - **Proporcionalidad directa**: $\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$.
  - **Semejanza en triángulos**: Si $DE \parallel BC \implies \Delta ADE \sim \Delta ABC \implies \frac{AD}{AB} = \frac{DE}{BC}$.
  - **Ecuación de sombras**: $\frac{H}{h} = \frac{S}{s} \implies H = h \cdot \frac{S}{s}$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Justificación y Demostración de Paralelismo](/static/img/nodos/uso-del-reciproco-del-teorema-de-tales-para-justificar-paralelismo-ejemplos.svg)

    Aplica el Teorema de Tales o su recíproco para determinar la medida desconocida o justificar la relación de paralelismo.
  pasos:
  - 'Paso 1: Identificar las rectas paralelas y las rectas transversales en la figura.'
  - 'Paso 2: Plantear la proporción geométrica emparejando correctamente los segmentos homólogos.'
  - 'Paso 3: Sustituir los valores numéricos conocidos en la ecuación de proporcionalidad.'
  - 'Paso 4: Resolver mediante producto cruzado y despejar la incógnita algebraica.'
  - 'Paso 5: Registrar la solución final acompañada de su correspondiente unidad métrica.'
checkpoints:
- placement: after_explicacion_formal
  question: 'Si en un triángulo $AD = 3$, $DB = 6$, $AE = 4$ y $EC = 8$, ¿se puede justificar que $\overline{DE} \parallel \overline{BC}$?'
  choices:
  - text: 'Sí, porque ambas razones valen $\frac{3}{6} = \frac{4}{8} = 0{,}5$'
    is_correct: true
  - text: 'No, porque los segmentos del lado derecho son mayores que los del izquierdo'
    is_correct: false
  - text: 'No, porque la razón de proporcionalidad debe ser igual a $1$ para haber paralelismo'
    is_correct: false
  - text: 'Solo si se conoce además la medida de las bases $\overline{DE}$ y $\overline{BC}$'
    is_correct: false
  explanation: 'Sí, porque ambas razones valen $\frac{3}{6} = \frac{4}{8} = 0{,}5$, cumpliendo exactamente el Recíproco del Teorema de Tales.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'Si $AD = 2$, $DB = 5$, $AE = 3$ y $EC = 7$, ¿son paralelas las rectas $\overline{DE}$ y $\overline{BC}$?'
  choices:
  - text: 'No, porque $\frac{2}{5} = 0{,}4 \neq \frac{3}{7} \approx 0{,}428$'
    is_correct: true
  - text: 'Sí, porque la diferencia entre ambas razones es insignificante ($0{,}028$)'
    is_correct: false
  - text: 'Sí, porque al multiplicar cruzado $2 \cdot 5 = 10$ y $3 \cdot 7 = 21$ ambos productos son positivos'
    is_correct: false
  - text: 'Solo si se demuestra que el triángulo es rectángulo en el vértice $A$'
    is_correct: false
  explanation: 'No, porque $\frac{2}{5} = 0{,}4 \neq \frac{3}{7} \approx 0{,}428$, por lo que las razones no coinciden y las rectas no son paralelas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer las rectas dadas y los segmentos determinados en cada transversal.'
- 'Paso 2: Calcular por separado las razones laterales $r_1 = \frac{AD}{DB}$ y $r_2 = \frac{AE}{EC}$.'
- 'Paso 3: Simplificar ambas razones a fracciones irreducibles para comparar con exactitud.'
- 'Paso 4: Si $r_1 = r_2$, concluir formalmente que las rectas son paralelas por el Recíproco de Tales.'
- 'Paso 5: Si $r_1 \neq r_2$, justificar que las rectas no son paralelas (son secantes).'
errores_correccion: 'En triángulos, recuerda que para relacionar las bases paralelas DE y BC debes usar la longitud del lado total AB ($AD/AB$), nunca el segmento parcial inferior DB.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'En un triángulo con $AD = 2$, $DB = 5$, $AE = 3$ y $EC = 7$, ¿se puede afirmar que $\overline{DE} \parallel \overline{BC}$?'
  alternativas:
  - 'No, porque $\frac{2}{5} = 0{,}4 \neq \frac{3}{7} \approx 0{,}428$'
  - 'Sí, porque todos los segmentos dados son números enteros positivos'
  - 'Sí, porque la diferencia entre ambas razones es menor a $0{,}1$'
  - 'Solo si se conoce adicionalmente el ángulo comprendido en el vértice $A$'
  respuesta: 'No, porque $\frac{2}{5} = 0{,}4 \neq \frac{3}{7} \approx 0{,}428$'
  solucion_pasos:
  - 'Calculamos la primera razón: $\frac{AD}{DB} = \frac{2}{5} = 0{,}4$.'
  - 'Calculamos la segunda razón: $\frac{AE}{EC} = \frac{3}{7} \approx 0{,}428$.'
  - 'Como $0{,}4 \neq 0{,}428$, las razones son distintas y por el Recíproco de Tales las rectas no son paralelas.'
- titulo: Ejemplo 2
  enunciado: ¿En un triángulo con DE || BC se puede afirmar que AD/DB = DE/BC?
  alternativas:
  - No, para relacionar las bases DE y BC se debe usar el lado completo AD/AB
  - Sí, siempre es correcto usar AD/DB con las bases
  - Solo si el triángulo es equilátero
  respuesta: No, para relacionar las bases DE y BC se debe usar el lado completo AD/AB
  solucion_pasos:
  - 'La razón entre las bases paralelas $DE/BC$ proviene de la semejanza de triángulos $\Delta ADE \sim \Delta ABC$, por lo que la proporción correcta es $DE/BC = AD/AB$.'
- titulo: ¿El Recíproco del Teorema de Tales permite demostrar que dos rectas son paralelas?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, si se comprueba que los segmentos determinados están en la misma proporción, el recíproco garantiza que las rectas son estrictamente paralelas.'
- titulo: ¿Las sombras para medir una altura con el Teorema de Tales pueden medirse a distintas horas del día?
  respuesta: 'No'
  solucion_pasos:
  - 'No, deben medirse estrictamente a la misma hora para que el ángulo de inclinación solar sea exactamente el mismo y los rayos sean paralelos.'
errores_frecuentes:
- 'Usar el segmento inferior DB en vez del lado total AB al calcular las bases paralelas DE y BC.'
- 'Invertir el orden de los segmentos al plantear la proporción (ej: mezclar arriba/abajo con abajo/arriba).'
- 'Olvidar sumar los segmentos parciales cuando el problema proporciona la longitud total.'
- 'Medir las sombras a diferentes horas del día al modelar alturas con rayos solares.'
- 'No verificar el paralelismo antes de aplicar el Teorema directo de Tales.'
afirmaciones_verdaderas:
- 'Tres o más rectas paralelas cortadas por transversales determinan segmentos correspondientes proporcionales.'
- 'Si una recta corta dos lados de un triángulo en segmentos proporcionales, entonces es paralela al tercer lado.'
al_terminar_debes_poder: |
  **QUÉ:** Enunciar, aplicar y justificar problemas geométricos usando el Teorema de Tales y su recíproco.

  **CÓMO:** Planteando proporciones entre segmentos homólogos ($\frac{a}{b} = \frac{c}{d}$), resolviendo con producto cruzado y modelando sombras solares.

  ![Resumen del Teorema de Tales](/static/img/nodos/uso-del-reciproco-del-teorema-de-tales-para-justificar-paralelismo-resumen.svg)
