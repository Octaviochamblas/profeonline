semantic_id: MAT.GEO.MEDICION_ANGULAR.SISTEMA_CENTESIMAL
resumen_inicial: El sistema centesimal (o goniométrico) divide la circunferencia completa
  en 400 partes iguales llamadas gradianes o gones (g), por lo que un ángulo recto
  mide exactamente 100g.
explicacion_simple: '![Sistema Centesimal](/static/img/nodos/sistema-centesimal-de-medicion-angular-en-gradianes-intro.svg)


  El sistema centesimal se inventó en Francia para adaptar los ángulos al sistema
  métrico decimal. En vez de dividir una vuelta en 360 partes, la divide en 400 partes
  llamadas **gradianes** ($^\text{g}$). Así, cada esquina recta mide exactamente $100^\text{g}$,
  lo que facilita mucho los cálculos decimales en topografía e ingeniería.'
explicacion_formal: '### Definición formal

  El **sistema centesimal** (o de gradianes, $\text{grad}$ o $\text{g}$) divide a
  la circunferencia completa en 400 partes iguales denominadas **grados centesimales**
  o **gradianes**:


  $$1^{\text{g}} = \frac{1}{400} \text{ de una vuelta completa} \iff 400^{\text{g}}
  = 1 \text{ revolución}$$


  $$\text{Ángulo recto} = 100^{\text{g}} \quad \land \quad \text{Ángulo extendido}
  = 200^{\text{g}}$$


  ### Desglose simbólico y geométrico

  - $^{\text{g}}$ o $\text{gon}$: Símbolo de gradian o grado centesimal.

  - Subunidades decimales: $1^{\text{g}} = 100^{\text{c}}$ (minutos centesimales)
  y $1^{\text{c}} = 100^{\text{cc}}$ (segundos centesimales).


  ### Síntesis didáctica

  El sistema centesimal se diseñó durante la Revolución Francesa para unificar la
  medición angular con el sistema métrico decimal, siendo de amplio uso en topografía
  y geodesia.'
definiciones_clave: '- **Gradián o Gon ($1^\text{g}$)**: La cuatrocentésima parte
  de una vuelta completa ($1/400$).

  - **Ángulo recto centesimal ($100^\text{g}$)**: Exactamente un cuarto de vuelta. '
propiedades_relaciones: '- **Estructura decimal pura**: Las subdivisiones coinciden
  con los decimales estándar ($45^\text{g} 25^\text{c} 50^\text{s} = 45{,}2550^\text{g}$).

  - **Uso en topografía**: Es el sistema tradicional utilizado en instrumentos topográficos
  como teodolitos y taquímetros. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Sistema Centesimal](/static/img/nodos/sistema-centesimal-de-medicion-angular-en-gradianes-ejemplos.svg)


    Un teodolito mide un ángulo de $\frac{3}{5}$ de ángulo recto en el sistema centesimal.
    ¿Cuántos gradianes mide este ángulo?'
  pasos:
  - 'Paso 1: Recordar que en el sistema centesimal un ángulo recto mide $100^\text{g}$.'
  - 'Paso 2: Plantear el producto: $\theta = \frac{3}{5} \times 100^\text{g}$.'
  - 'Paso 3: Simplificar: $\frac{100}{5} = 20^\text{g}$.'
  - 'Paso 4: Multiplicar: $3 \times 20^\text{g} = 60^\text{g}$.'
  - 'Paso 5: Concluir que el ángulo mide $60^\text{g}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos gradianes (g) mide un ángulo recto en el sistema centesimal?
  choices:
  - text: Exactamente 100 gradianes (100g)
    is_correct: true
  - text: Exactamente 90 gradianes
    is_correct: false
  - text: Exactamente 400 gradianes
    is_correct: false
  - text: Exactamente 200 gradianes
    is_correct: false
  explanation: En el sistema centesimal un ángulo recto mide exactamente 100 gradianes
    (100g).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos gradianes equivale media vuelta completa (ángulo llano)?
  choices:
  - text: 200 gradianes (porque 400g / 2 = 200g)
    is_correct: true
  - text: 180 gradianes
    is_correct: false
  - text: 100 gradianes
    is_correct: false
  - text: 400 gradianes
    is_correct: false
  explanation: Como la vuelta entera tiene 400g, media vuelta equivale a 200 gradianes
    (porque 400g / 2 = 200g).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la fracción de vuelta o de ángulo recto.'
- 'Paso 2: Multiplicar por $400^\text{g}$ para vueltas completas o por $100^\text{g}$
  para fracciones de ángulo recto.'
- 'Paso 3: Expresar el resultado con el superíndice $^\text{g}$.'
errores_correccion: No confundas el sistema centesimal (recto = 100g, vuelta = 400g)
  con el sexagesimal (recto = 90°, vuelta = 360°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántos gradianes mide una vuelta completa?
  alternativas:
  - $400^{\text{g}}$
  - $360^{\text{g}}$
  - $100^{\text{g}}$
  respuesta: $400^{\text{g}}$
  solucion_pasos:
  - Una vuelta completa equivale a $400^{\text{g}}$ en el sistema centesimal.
- titulo: Ejemplo 2
  enunciado: ¿Cuántos gradianes mide medio ángulo recto en el sistema centesimal?
  alternativas:
  - $50^{\text{g}}$
  - $45^{\text{g}}$
  - $25^{\text{g}}$
  respuesta: $50^{\text{g}}$
  solucion_pasos:
  - $\frac{100^{\text{g}}}{2} = 50^{\text{g}}$.
- titulo: ¿El sistema centesimal divide la circunferencia en 400 partes iguales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición fundamental del sistema centesimal.
- titulo: ¿Un ángulo recto mide 90g en el sistema centesimal?
  respuesta: 'No'
  solucion_pasos:
  - No, mide $100^{\text{g}}$ ($90^\circ$ es en el sistema sexagesimal).
errores_frecuentes:
- Asumir que el ángulo recto mide $90^\text{g}$.
- Confundir la notación $^\text{g}$ con gramos.
- Creer que una vuelta completa son $100^\text{g}$ en lugar de $400^\text{g}$.
- Olvidar que sus subunidades son de base 100 ($1^\text{g} = 100^\text{c}$).
- Mezclar cálculos sexagesimales y centesimales sin convertir.
afirmaciones_verdaderas:
- Una circunferencia completa tiene $400^\text{g}$ centesimales.
- El ángulo recto mide $100^\text{g}$ y el llano $200^\text{g}$.
al_terminar_debes_poder: '**QUÉ:** Comprender la estructura y unidades del sistema
  centesimal de medición angular.


  **CÓMO:** Calculando ángulos en gradianes ($^\text{g}$) basados en una rotación
  total de $400^\text{g}$.


  ![Resumen del Sistema Centesimal](/static/img/nodos/sistema-centesimal-de-medicion-angular-en-gradianes-resumen.svg)'
