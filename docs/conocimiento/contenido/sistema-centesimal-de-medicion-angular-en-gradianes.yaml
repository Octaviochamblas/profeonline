semantic_id: MAT.GEO.MEDICION_ANGULAR.SISTEMA_CENTESIMAL
resumen_inicial: 'Comprensión Didáctica y Aplicación Práctica de Sistema centesimal
  de medición angular en gradianes: Importancia de su Medida y Relaciones en Geometría
  Plana.'
explicacion_simple: Al trabajar con sistema centesimal de medición angular en gradianes,
  analizamos la relación entre aberturas angulares y cómo se aplican las reglas geométricas
  para encontrar valores desconocidos.
explicacion_formal: En la teoría geométrica de sistema centesimal de medición angular
  en gradianes, se aplican teoremas y relaciones algebraicas sobre rectas y vértices
  para estructurar demostraciones e igualdades angulares precisas.
definiciones_clave: '- **Sistema centesimal de medición angular en gradianes**: Elemento
  o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en sistema centesimal de medición angular en gradianes se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: En el sistema centesimal (gradianes o gons), un ángulo recto se divide
    en 100 grados centesimales ($100^g$). ¿Cuántos grados centesimales equivalen a
    una vuelta completa de $360^\circ$?
  pasos:
  - 'Paso 1: Identificar que 1 ángulo recto ($90^\circ$) equivale a $100^g$.'
  - 'Paso 2: Una vuelta completa ($360^\circ$) contiene 4 ángulos rectos: $4 \cdot
    100^g$.'
  - 'Paso 3: Concluir que un giro completo equivale a $400^g$ en el sistema centesimal.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de sistema centesimal de medición
    angular en gradianes?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos grados centesimales (gons) equivale una vuelta completa de
    360°?
  choices:
  - text: 400g
    is_correct: true
  - text: 100g
    is_correct: false
  - text: 360g
    is_correct: false
  - text: 200g
    is_correct: false
  explanation: La alternativa correcta es '400g', al multiplicar 4 ángulos rectos
