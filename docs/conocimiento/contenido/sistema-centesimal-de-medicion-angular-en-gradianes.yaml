  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en sistema centesimal de medición angular en
  gradianes.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en sistema centesimal
  de medición angular en gradianes sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 62^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 118°
  - 62°
  - 90°
  respuesta: 118°
  solucion_pasos:
  - Despejando $x = 180 - 62 = 118^\circ$.
- titulo: Ejemplo 2
  enunciado: En sistema centesimal de medición angular en gradianes, si dos ángulos
    son suplementarios y uno mide 62°, ¿cuánto mide el otro?
  alternativas:
  - 118°
  - 28°
  - 360°
  respuesta: 118°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 62 = 118^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en sistema centesimal
    de medición angular en gradianes?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en sistema centesimal de medición
    angular en gradianes es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de sistema centesimal de medición angular en
  gradianes.
