procedimiento:
- Identifica si la incógnita está en el denominador (fraccionaria real) o solo hay
  números en el denominador (coeficientes fraccionarios).
- Encuentra el Mínimo Común Múltiplo (MCM) de todos los denominadores.
- Multiplica toda la ecuación por ese MCM para eliminar los denominadores.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en definición de ecuación fraccionaria de primer grado.
ejemplos:
- titulo: $x$ y $\frac{Herencia}{x}$
  enunciado: Determina qué debe hacerse en $x$ y $\frac{Herencia}{x}$ y fundamenta
    cada transformación.
  solucion_pasos:
  - Imagina que estás repartiendo una herencia, pero el número de herederos ($x$)
    es desconocido. La cantidad que le toca a cada uno es $\frac{Herencia}{x}$. Aquí,
    la variable está en el denominador (denominador).
  - Identifica si la incógnita está en el denominador (fraccionaria real) o solo hay
    números en el denominador (coeficientes fraccionarios).
- titulo: $x$
  enunciado: Analiza el caso $x$ y explica cómo se aplica el criterio estudiado.
  solucion_pasos:
  - Una ecuación fraccionaria es aquella que contiene fracciones donde la incógnita
    ($x$) aparece en el denominador, o bien, es una ecuación con coeficientes fraccionarios
    complejos.
  - Encuentra el Mínimo Común Múltiplo (MCM) de todos los denominadores.
- titulo: 'Respecto de «Definición de ecuación fraccionaria de primer grado»: ¿Se
    ajusta a la definició'
  enunciado: 'Respecto de «Definición de ecuación fraccionaria de primer grado»: ¿Se
    ajusta a la definición esta afirmación? «Una ecuación fraccionaria es aquella
    que contiene fracciones donde la incógnita ($x$) aparece en el denominador, o
    bien, es una ecuación con coeficientes fraccionarios complejos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una ecuación fraccionaria es
    aquella que contiene fracciones donde la incógnita ($x$) aparece en el denominador,
    o bien, es una ecuación con coeficientes fraccionarios complejos.'
- titulo: 'Respecto de «Definición de ecuación fraccionaria de primer grado»: ¿Es
    compatible con el pro'
  enunciado: 'Respecto de «Definición de ecuación fraccionaria de primer grado»: ¿Es
    compatible con el procedimiento esta afirmación? «Puede omitirse esta condición
    sin cambiar el resultado: «Identifica si la incógnita está en el denominador (fraccionaria
    real) o solo hay números en el denominador (coeficientes fraccionarios)»»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una ecuación fraccionaria es
    aquella que contiene fracciones donde la incógnita ($x$) aparece en el denominador,
    o bien, es una ecuación con coeficientes fraccionarios complejos.'
errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Identifica si la incógnita
  está en el denominador (fraccionaria real) o solo hay números en el denominador
  (coeficientes fraccionarios)».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Encuentra el Mínimo
  Común Múltiplo (MCM) de todos los denominadores».'
- La definición sigue cumpliéndose aunque no se considere que una ecuación fraccionaria
  es aquella que contiene fracciones donde la incógnita ($x$) aparece en el denominador,
  o bien, es una ecuación con coeficientes fraccionarios complejos.
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Identifica
  si la incógnita está en el denominador (fraccionaria real) o solo hay números en
  el denominador (coeficientes fraccionarios)».
- La comprobación del resultado vuelve innecesaria la condición «Encuentra el Mínimo
  Común Múltiplo (MCM) de todos los denominadores».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
