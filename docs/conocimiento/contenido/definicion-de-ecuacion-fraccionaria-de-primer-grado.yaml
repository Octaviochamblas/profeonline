semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.DEFINICION
resumen_inicial: Una ecuación fraccionaria es aquella donde la incógnita figura en el denominador de al menos una de sus fracciones.
explicacion_simple: |
  Una ecuación fraccionaria se distingue esencialmente porque la variable o incógnita (como $x$) aparece ubicada en el denominador de una o más fracciones.

  Esta característica exige fijar atención en las restricciones del dominio: la incógnita jamás puede tomar un valor numérico que provoque que algún denominador se anule (sea igual a cero).

  Si la variable solo figura en los numeradores (por ejemplo $\frac{x}{3} = 5$), se trata de una ecuación con coeficientes fraccionarios, no de una ecuación fraccionaria.
explicacion_formal: |
  ### Definición formal
  Una **ecuación fraccionaria de primer grado** es una proposición abierta de la forma canónica:

  $$\frac{P(x)}{Q(x)} = 0 \quad \text{con } Q(x) \neq 0 \quad \text{y } \operatorname{gr}(P) = 1$$

  ### Desglose de la fórmula
  - $Q(x)$: Polinomio denominador no constante que contiene a la incógnita $x$.
  - $Q(x) \neq 0$: Restricción de existencia necesaria que define el dominio de definición de la ecuación en el cuerpo $\mathbb{R}$.

  ### Síntesis didáctica
  Identificar las restricciones del denominador es el paso inicial obligatorio antes de despejar la ecuación por multiplicación por el m.c.m.
definiciones_clave: |
  - **Ecuación fraccionaria**: Ecuación donde la variable incógnita figura en el denominador de al menos una fracción.
  - **Dominio de definición**: Conjunto de valores reales para los cuales todos los denominadores de la ecuación resultan estrictamente distintos de cero.
propiedades_relaciones: |
  - **Diferencia conceptual**: La expresión $\frac{x}{3} = 5$ es una ecuación entera con coeficiente fraccionario, mientras que $\frac{3}{x} = 5$ es una ecuación fraccionaria.
  - **Exclusión de indeterminado**: Las soluciones candidatas que anulan $Q(x)$ quedan excluidas del conjunto solución $S$.
ejemplo_guiado:
  enunciado: 'Dada la ecuación $\frac{6}{x - 2} = 3$, justifica por qué es una ecuación fraccionaria, determina la restricción de su denominador y halla la solución para $x$.'
  pasos:
    - 'Paso 1: Confirmar que la incógnita $x$ figura en el denominador $x - 2$, clasificándola como ecuación fraccionaria.'
    - 'Paso 2: Exigir que el denominador sea distinto de cero para determinar la restricción: $x - 2 \neq 0 \implies x \neq 2$.'
    - 'Paso 3: Multiplicar ambos miembros por $(x - 2)$: $6 = 3(x - 2) \implies 6 = 3x - 6$.'
    - 'Paso 4: Trasponer $-6$ sumando y despejar $x$: $3x = 12 \implies x = 4$.'
    - 'Paso 5: Comprobar que $x = 4$ cumple la restricción ($4 \neq 2$) y satisface $\frac{6}{4 - 2} = \frac{6}{2} = 3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la condición estructural que define a una ecuación fraccionaria?'
    choices:
      - {text: 'Que la variable incógnita figure en el denominador de al menos una fracción.', is_correct: true}
      - {text: 'Que los coeficientes numéricos sean fracciones simples.', is_correct: false}
      - {text: 'Que la variable esté elevada al cuadrado en el numerador.', is_correct: false}
      - {text: 'Que carezca de solución en los números reales.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que la variable incógnita figure en el denominador de al menos una fracción.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para la ecuación fraccionaria $\frac{6}{x - 2} = 3$, ¿cuál es la restricción del denominador y la solución final obtenida?'
    choices:
      - {text: 'Restricción $x \neq 2$ y solución $x = 4$.', is_correct: true}
      - {text: 'Restricción $x \neq 4$ y solución $x = 2$.', is_correct: false}
      - {text: 'Restricción $x \neq 0$ y solución $x = 6$.', is_correct: false}
      - {text: 'Sin restricciones y solución $x = 3$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Restricción $x \neq 2$ y solución $x = 4$.''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar la ecuación para verificar si la variable aparece en algún denominador.'
  - 'Paso 2: Igualar a cero cada denominador que contenga a la incógnita para determinar los valores prohibidos del dominio.'
  - 'Paso 3: Establecer las restricciones del dominio en la forma $x \neq k$.'
  - 'Paso 4: Multiplicar ambos miembros por el m.c.m. de los denominadores para eliminar las fracciones y resolver la ecuación entera resultante.'
errores_correccion: |
  - **Error 1:** Confundir una ecuación con coeficientes fraccionarios ($\frac{1}{2}x = 4$) con una ecuación fraccionaria ($\frac{2}{x} = 4$). **Cómo corregirlo:** Para ser una **ECUACIÓN FRACCIONARIA, LA VARIABLE DEBE ESTAR EN EL DENOMINADOR; SI LA VARIABLE ESTÁ EN EL NUMERADOR ES UNA ECUACIÓN ENTERA**.
  - **Error 2:** Omitir el establecimiento de restricciones de dominio antes de eliminar denominadores. **Cómo corregirlo:** Las restricciones **DEBEN ESTABLECERSE AL INICIO PUES DETERMINAN LOS VALORES PERMITIDOS DEL CONJUNTO SOLUCIÓN**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál de las siguientes ecuaciones es fraccionaria?'
    alternativas:
      - '$\frac{5}{x + 1} = 2$'
      - '$\frac{x + 1}{5} = 2$'
      - '$\frac{3}{4}x = 9$'
    respuesta: '$\frac{5}{x + 1} = 2$'
    solucion_pasos:
      - '1. En $\frac{5}{x + 1} = 2$, la incógnita $x$ está en el denominador.'
      - '2. Por lo tanto, es una ecuación fraccionaria.'
  - titulo: 'Ejemplo 2'
    enunciado: '¿Cuál es la restricción de dominio para la ecuación $\frac{4}{2x - 8} = 1$?'
    alternativas:
      - '$x \neq 4$'
      - '$x \neq 8$'
      - '$x \neq 0$'
    respuesta: '$x \neq 4$'
    solucion_pasos:
      - '1. Igualar denominador a cero: $2x - 8 = 0 \implies 2x = 8 \implies x = 4$.'
      - '2. Restricción: $x \neq 4$.'
  - titulo: 'Denominador constante'
    enunciado: '¿La ecuación $\frac{x}{7} = 3$ posee restricciones de dominio en los números reales?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el denominador es la constante $7 \neq 0$.'
  - titulo: 'Variables en numeradores y denominadores'
    enunciado: '¿La expresión $\frac{x + 2}{x - 1} = 5$ es una ecuación fraccionaria?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues contiene la variable en el denominador $x - 1$.'
errores_frecuentes:
  - 'La expresión $\frac{x}{3} = 5$ constituye una ecuación fraccionaria al poseer una fracción en su estructura.'
  - 'La ecuación fraccionaria $\frac{6}{x - 2} = 3$ está bien definida sobre todo el conjunto de los números reales sin restricción de dominio.'
  - 'Al multiplicar por el m.c.m. la ecuación $\frac{6}{x-2} = 3$, el término entero $3$ se mantiene inalterado sin multiplicarse por $(x-2)$.'
  - 'Una solución obtenida de la resolución $x = 2$ en $\frac{6}{x-2} = 3$ es una solución válida del conjunto solución.'
  - 'Al suprimir los denominadores en $\frac{x+1}{x-2} = 3$, los paréntesis en el numerador se omiten resultando en $x + 1 = 3x - 2$.'
afirmaciones_verdaderas:
  - 'En una ecuación fraccionaria, la variable incógnita se encuentra en el denominador de al menos una fracción.'
  - 'Establecer las restricciones de dominio $Q(x) \neq 0$ es indispensable para validar el conjunto solución final.'
al_terminar_debes_poder: |
  QUÉ: Identificar y definir ecuaciones fraccionarias de primer grado.
  CÓMO: Reconocer la presencia de la incógnita en los denominadores, establecer las restricciones del dominio $Q(x) \neq 0$ y diferenciarla de ecuaciones con coeficientes fraccionarios.
fuente: 'Texto escolar MINEDUC — Álgebra 1° Medio / Ecuaciones Fraccionarias.'
