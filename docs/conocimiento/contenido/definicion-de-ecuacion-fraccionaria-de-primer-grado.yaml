semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.DEFINICION
resumen_inicial: 'Definición de ecuación fraccionaria de primer grado: propiedades,
  resolución y modelamiento en Ecuaciones fraccionarias de primer grado.'
explicacion_simple: Imagina que estás repartiendo una herencia, pero el número de
  herederos ($x$) es desconocido. La cantidad que le toca a cada uno es $\frac{Herencia}{x}$.
  Aquí, la variable está en el denominador (denominador).
explicacion_formal: '### Definición formal


  Una ecuación en la variable $x$ es fraccionaria si, expresada en su forma más simple,
  contiene al menos un término $\frac{p(x)}{q(x)}$ donde $q(x)$ no es una constante
  (la incógnita aparece en el denominador), lo que exige $q(x) \neq 0$ como restricción
  adicional sobre las soluciones válidas.


  ### Desarrollo didáctico


  Imagina que estás repartiendo una herencia, pero el número de herederos ($x$) es
  desconocido. La cantidad que le toca a cada uno es $\frac{Herencia}{x}$. Aquí, la
  variable está en el denominador (denominador).


  Resolverlas implica siempre un objetivo inicial: **eliminar los denominadores**.
  A los matemáticos no les gusta trabajar con pisos. El objetivo es aplanar la ecuación
  para llevarla a la forma lineal clásica que ya sabes resolver.'
definiciones_clave: '- **Definición de ecuación fraccionaria de primer grado**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a definición de ecuación fraccionaria de primer
  grado.'
