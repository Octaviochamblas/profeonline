semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.DEFINICION
resumen_inicial: Una ecuación fraccionaria es aquella donde la incógnita figura en
  el denominador de al menos una de sus fracciones.
explicacion_simple: 'Una ecuación fraccionaria se distingue por tener la letra incognita
  (como $x$) en la parte inferior (denominador) de una o más fracciones.

  Esto significa que debemos prestar especial atención a las restricciones del dominio:
  la incógnita jamás puede tomar un valor que haga que algún denominador sea igual
  a cero.'
explicacion_formal: 'Una **ecuación fraccionaria de primer grado** es una proposición
  abierta de la forma:


  $$\frac{P(x)}{Q(x)} = 0 \quad \text{con } Q(x) \neq 0 \quad \text{y } \operatorname{gr}(P)
  = 1$$


  **Desglose de la fórmula:**

  - $Q(x)$: Polinomio denominador que contiene a la incógnita $x$.

  - $Q(x) \neq 0$: Restricción de existencia obligatoria que define el dominio permitido
  de la ecuación en $\mathbb{R}$.'
definiciones_clave: '- **Ecuación fraccionaria**: Ecuación donde la variable incógnita
  aparece en uno o más denominadores.

  - **Dominio de la ecuación fraccionaria**: Conjunto de números reales para los cuales
  todos los denominadores son no nulos.'
propiedades_relaciones: '- **Diferencia con coeficientes fraccionarios**: Una ecuación
  como $\frac{x}{3} = 5$ tiene coeficiente fraccionario pero NO es fraccionaria. Una
  ecuación como $\frac{3}{x} = 5$ SÍ es una ecuación fraccionaria.'
ejemplo_guiado:
  enunciado: Dada la ecuación $\frac{6}{x - 2} = 3$, justifica por qué es una ecuación
    fraccionaria, determina la restricción de su denominador y halla la solución para
    $x$.
  pasos:
  - 'Paso 1: Confirmar que la incógnita $x$ está en el denominador $x - 2$, por lo
    que es una ecuación fraccionaria.'
  - 'Paso 2: Exigir que el denominador sea distinto de cero: $x - 2 \neq 0 \implies
    x \neq 2$.Paso 3: Multiplicar por $(x - 2)$: $6 = 3(x - 2) \implies 6 = 3x - 6$.Paso
    4: Trasponer $-6$ sumando: $3x = 12 \implies x = 4$.Paso 5: Comprobar que $x =
    4$ cumple la restricción $4 \neq 2$ y satisface $\frac{6}{4 - 2} = \frac{6}{2}
    = 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define a una ecuación fraccionaria?
  choices:
  - text: Que la variable incógnita aparece en el denominador de al menos una fracción.
    is_correct: true
  - text: Que los coeficientes numéricos sean fracciones simples.
    is_correct: false
  - text: Que la variable esté elevada al cuadrado en el numerador.
    is_correct: false
  - text: Que no tenga solución en los números reales.
    is_correct: false
  explanation: La alternativa correcta es 'Que la variable incógnita aparece en el
    denominador de al menos una fracción.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la ecuación fraccionaria $\frac{6}{x - 2} = 3$, ¿cuál es la restricción
    del denominador y la solución final?
  choices:
  - text: Restricción $x \neq 2$ y solución $x = 4$.
    is_correct: true
  - text: Restricción $x \neq 4$ y solución $x = 2$.
    is_correct: false
  - text: Restricción $x \neq 0$ y solución $x = 6$.
    is_correct: false
  - text: Sin restricciones y solución $x = 3$.
    is_correct: false
  explanation: La alternativa correcta es 'Restricción $x \neq 2$ y solución $x =
    4$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los denominadores que contienen a la incógnita.'
- 'Paso 2: Igualar a cero cada denominador con incógnita para hallar los valores prohibidos
  del dominio.'
- 'Paso 3: Declarar la condición $x \neq \text{valores prohibidos}$.'
- 'Paso 4: Multiplicar la ecuación por el m.c.m. de los denominadores para convertirla
  en una ecuación lineal entera.'
errores_correccion: '- **Error común:** Confundir una ecuación con coeficientes fraccionarios
  (como $\frac{1}{2}x = 4$) con una ecuación fraccionaria verdadera (como $\frac{2}{x}
  = 4$).

  - **Cómo corregirlo:** Para ser ECUACIÓN FRACCIONARIA, la letra de la incógnita
  debe estar abajo en el DENOMINADOR.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de ecuaciones fraccionarias.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de ecuaciones fraccionarias.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución que anula el denominador debe ser descartada?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una solución extraña fuera del dominio.
- titulo: ¿Multiplicar por el m.c.m. elimina los denominadores de la ecuación?
  respuesta: Sí
  solucion_pasos:
  - Sí, convierte la ecuación fraccionaria en una entera equivalente.
errores_frecuentes:
- Confundir una ecuación con coeficientes fraccionarios con una ecuación fraccionaria
  con la variable en el denominador.
- Olvidar restringir del dominio los valores que anulan el denominador antes de despejar.
- Multiplicar por el m.c.m. solo los términos con fracción omitiendo los números independientes
  enteros.
- Aceptar soluciones extrañas que anulan el denominador original de la ecuación.
- Olvidar colocar paréntesis en los numeradores al eliminar los denominadores.
afirmaciones_verdaderas:
- En las ecuaciones fraccionarias la variable incógnita aparece en el denominador
  de al menos una fracción.
- Multiplicar una ecuación fraccionaria por el m.c.m. de sus denominadores la transforma
  en una ecuación entera equivalente en el dominio permitido.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, despejar y
  verificar ecuaciones fraccionarias de primer grado descartando soluciones extrañas
  no permitidas.
