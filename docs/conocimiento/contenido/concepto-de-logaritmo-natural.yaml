semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.LOGARITMO_NATURAL
resumen_inicial: Un logaritmo natural o neperiano es aquel cuya base es la constante irracional
  $e \approx 2{,}71828$, denotándose por $\ln(x) = \log_e(x)$.
explicacion_simple: 'El logaritmo natural usa como base el famoso número de Euler $e \approx
  2{,}71828$.

  Se escribe con el símbolo **$\ln$** (ele-ene):

  - $\ln(e) = 1$ porque $e^1 = e$.

  - $\ln(1) = 0$ porque $e^0 = 1$.

  - $\ln(e^5) = 5$.

  Es la función inversa de la función exponencial $e^x$.'
explicacion_formal: 'El logaritmo natural $\ln: \mathbb{R}^+ \to \mathbb{R}$ es la función
  inversa de la función exponencial natural $f(x) = e^x$. Se define por $\ln(x) = \log_e(x)
  = \int_1^x \frac{1}{t} dt$.'
definiciones_clave: '- **Logaritmo natural / neperiano ($\ln$)**: Logaritmo en base $e$.'
propiedades_relaciones: '- **Cancelación natural**: $\ln(e^x) = x$ y $e^{\ln(x)} = x$ para
  $x > 0$.'
ejemplo_guiado:
  enunciado: Calcula el valor de $\ln(e^3)$.
  pasos:
  - 'Reconocer la notación $\ln$ como logaritmo en base $e$: $\log_e(e^3)$.'
  - Aplicar la propiedad de cancelación $\log_b(b^x) = x$.
  - 'Obtener como resultado directo el exponente: $3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la base de la función $\ln(x)$?
  choices:
  - text: El número de Euler e (≈ 2,71828)
    is_correct: true
  - text: El número 10
    is_correct: false
  - text: El número 1
    is_correct: false
  - text: El número pi (π)
    is_correct: false
  explanation: 'La correcta es: El número de Euler e (≈ 2,71828). Por definición de logaritmo
    natural.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $e^{\ln(7)}$.
  choices:
  - text: '7'
    is_correct: true
  - text: e
    is_correct: false
  - text: '1'
    is_correct: false
  - text: 7e
    is_correct: false
  explanation: 'La correcta es: 7. Por la propiedad de cancelación $e^{\ln(x)} = x$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la notación $\ln(x)$ como logaritmo en base $e$.'
- 'Paso 2: Aplicar las propiedades de cancelación con la función exponencial $e^x$.'
errores_correccion: No confundas $\ln(x)$ con $\log(x)$. $\ln$ es base $e$, mientras que $\log$
  es base $10$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\ln(1)$.
  alternativas:
  - '0'
  - '1'
  - e
  respuesta: '0'
  solucion_pasos:
  - $\ln(1) = 0$ pues $e^0 = 1$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de ln(e^7)?
  alternativas:
  - '7'
  - e
  - e^7
  respuesta: '7'
  solucion_pasos:
  - Por cancelación, ln(e^x) = x.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de e elevado a ln(9)?
  alternativas:
  - '9'
  - e
  - ln(9)
  respuesta: '9'
  solucion_pasos:
  - Por cancelación, e elevado a ln(x) es igual a x.
- titulo: ¿Es correcto que ln(x) y log(x) representan la misma base?
  respuesta: 'No'
  solucion_pasos:
  - ln usa base e, mientras que log usa base 10.
errores_frecuentes:
- Confundir la base $e$ del logaritmo natural con la base $10$.
- Confundir el logaritmo natural (base e) con el logaritmo decimal (base 10).
- Pensar que ln(x) representa una multiplicación en vez de una operación logarítmica.
- Aplicar la propiedad de cancelación de ln con una base distinta de e.
- Olvidar que el argumento de ln, al igual que en cualquier logaritmo, debe ser estrictamente
  positivo.
afirmaciones_verdaderas:
- $\ln(x) = \log_e(x)$.
- El logaritmo natural y la función exponencial e^x son funciones inversas entre sí.
al_terminar_debes_poder: Evaluar logaritmos naturales y aplicar sus propiedades de cancelación.
fuente: Texto escolar MINEDUC.
estado: publicado
