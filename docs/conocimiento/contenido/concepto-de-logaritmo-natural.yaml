    is_correct: true
  - text: $2$
    is_correct: false
  - text: $e^{-2}$
    is_correct: false
  - text: $1$
    is_correct: false
  explanation: La alternativa correcta es '$-2$ (porque $\frac{1}{e^2} = e^{-2}$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer la notación $\ln(x)$ como logaritmo en base $e$.'
- 'Paso 2: Expresar el argumento como potencia de $e$: $x = e^k$.'
- 'Paso 3: Aplicar la identidad de cancelación $\ln(e^k) = k$.'
errores_correccion: "- **Error 1: Confundir $\\ln(x)$ con $\\log(x)$.** **Cómo corregirlo:** $\\ln(x)$ es base $e \approx 2,718$, mientras que $\\log(x)$ es base 10.\n- **Error 2: Pensar que $\\ln(e) = e$.** **Cómo corregirlo:** Como es el logaritmo de la base, $\\ln(e) = 1$ ($e^1 = e$)."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\ln(e^7)$?
  alternativas:
  - $7$
  - $e^7$
  - $1$
  respuesta: $7$
  solucion_pasos:
  - $\ln(e^7) = 7$ por cancelación directa.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale $e^{\ln(12)}$?
  alternativas:
  - $12$
  - $e^{12}$
  - $\ln(12)$
  respuesta: $12$
  solucion_pasos:
  - $e^{\ln(x)} = x \implies e^{\ln(12)} = 12$.
- titulo: ¿Es ln(e³) = 3?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la función logaritmo natural y la exponencial $e^x$ se cancelan.
  alternativas:
  - texto: Sí, ln(e³) = 3
    es_correcta: true
    retroalimentacion: ¡Correcto! Cancelación de funciones inversas.
  - texto: No, es e
    es_correcta: false
    retroalimentacion: Incorrecto, el resultado es el exponente 3.
  - texto: No, es 3e
    es_correcta: false
    retroalimentacion: Incorrecto, $\ln(e) = 1$, dando $3 \times 1 = 3$.
- titulo: ¿Es ln(1/e) = -1?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\frac{1}{e} = e^{-1} \implies \ln(e^{-1}) = -1$.
  alternativas:
  - texto: Sí, 1/e = e⁻¹ dando -1
    es_correcta: true
    retroalimentacion: ¡Correcto! Potencia inversa en base e.
  - texto: No, es 1
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente es negativo.
  - texto: No, no existe
    es_correcta: false
    retroalimentacion: Incorrecto, $1/e > 0$ es positivo y válido.
errores_frecuentes:
- Confundir la base $e$ con la base 10.
- Creer que $\ln(e) = 0$.
- Olvidar que $e^{\ln(x)} = x$.
- Tratar al número $e$ como una variable en lugar de una constante matemática.
afirmaciones_verdaderas:
- El logaritmo natural $\ln(x)$ es el logaritmo en base $e \approx 2,71828...$
- Las identidades $\ln(e^x) = x$ y $e^{\ln(x)} = x$ reflejan su condición de operaciones inversas.
- Cumple exactamente las mismas propiedades operativas que cualquier logaritmo en base real.
al_terminar_debes_poder: '![Síntesis de logaritmo natural](/static/img/nodos/concepto-de-logaritmo-natural-resumen.svg)


  QUÉ: Comprender y operar con el logaritmo natural $\ln(x)$ en base $e$.


  CÓMO: Reconociendo la base de Euler $e$, aplicando las identidades de cancelación $\ln(e^x) = x$ y $e^{\ln(x)} = x$, y utilizando sus propiedades algebraicas.'
