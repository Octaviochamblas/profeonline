semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.LOGARITMO_NATURAL
resumen_inicial: El logaritmo natural o neperiano es aquel cuya base es el número irracional de Euler $e \approx 2,71828...$, denotándose como $\ln(x) = \log_e(x)$.
explicacion_simple: "![Concepto de logaritmo natural](/static/img/nodos/concepto-de-logaritmo-natural-intro.svg)\n\nEl **logaritmo natural** (o neperiano) es un logaritmo muy especial que utiliza como base el número de Euler $e \approx 2,71828...$:\n- Se escribe **$\\ln(x)$** en lugar de $\\log_e(x)$.\n- Es la operación inversa directa de la exponencial $e^x$:\n  - $\\ln(e) = 1$\n  - $\\ln(e^5) = 5$\n  - $\\ln(1) = 0$\n- Es fundamental en el estudio del crecimiento continuo de poblaciones, finanzas e interés compuesto."
explicacion_formal: 'Se define el **logaritmo natural o neperiano**, denotado por $\ln(x)$, como el logaritmo cuya base es la constante matemática trascendente $e$:


  $$\ln(x) \equiv \log_e(x) \quad (\forall x > 0)$$

  donde $e = \lim_{n \to \infty} \left(1 + \frac{1}{n}\right)^n \approx 2,718281828... \in \mathbb{I}$.


  **Identidades Fundamentales de $\ln(x)$:**

  1. **Cancelación inversa:** $\ln(e^x) = x$ para todo $x \in \mathbb{R}$, y $e^{\ln(x)} = x$ para todo $x > 0$.

  2. **Valores clave:** $\ln(e) = 1$ y $\ln(1) = 0$.

  3. **Despeje exponencial:** $e^{kt} = A \iff kt = \ln(A)$.'
definiciones_clave: '- **Logaritmo natural ($\ln(x)$)**: Logaritmo en base $e$.

  - **Número de Euler ($e$)**: Constante irracional aproximada a $2,71828...$

  - **Crecimiento continuo**: Modelo exponencial $N(t) = N_0 e^{kt}$ cuya inversa es $\ln$.'
propiedades_relaciones: '- **Mismas leyes algebraicas**: Comparte todas las propiedades de producto, cociente y potencia de los logaritmos.

  - **Cambio de base**: $\log_b(a) = \frac{\ln(a)}{\ln(b)}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de logaritmo natural](/static/img/nodos/concepto-de-logaritmo-natural-ejemplos.svg)


    Calcule y simplifique las expresiones $\ln(e)$, $\ln(e^5)$ y $\ln\left(\frac{1}{e^2}\right)$.'
  pasos:
  - 'Paso 1: Para $\ln(e)$: Por ser el logaritmo de su base, $\ln(e) = 1$.'
  - 'Paso 2: Para $\ln(e^5)$: Por cancelación directa $\ln(e^x) = x$, se obtiene $5$.'
  - 'Paso 3: Para $\ln\left(\frac{1}{e^2}\right)$: Expresar $\frac{1}{e^2} = e^{-2} \implies \ln(e^{-2}) = -2$.'
  - 'Conclusión: Los valores son $1$, $5$ y $-2$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la base de la función logaritmo natural $\ln(x)$?
  choices:
