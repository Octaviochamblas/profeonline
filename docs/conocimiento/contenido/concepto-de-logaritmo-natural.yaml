    is_correct: false
  - text: El número 1
    is_correct: false
  explanation: La alternativa correcta es 'El número irracional $e \approx 2,71828...$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿a qué equivale $\ln\left(\frac{1}{e^2}\right)$?
  choices:
