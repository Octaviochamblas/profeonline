resumen_inicial: El logaritmo natural (o neperiano) es aquel cuya base es el número
  irracional de Euler $e \approx 2,71828$, denotándose por la sigla $\ln(a) \equiv
  \log_e(a)$.
explicacion_simple: El logaritmo natural es un logaritmo muy especial usado en la
  ciencia y economía cuya base es el famoso número de Euler $e$. Se escribe siempre
  con las letras $\ln$ en lugar de $\log$.
explicacion_formal: 'Para todo argumento $a > 0$, el **Logaritmo Natural $\ln(a)$**
  se define con base constante de Euler $e$:


  $$\ln(a) = c \iff \log_e(a) = c \iff e^c = a$$


  **Propiedades particulares:**

  - $\ln(1) = 0$.

  - $\ln(e) = 1$.

  - $\ln(e^x) = x$ y $e^{\ln(x)} = x$.'
definiciones_clave: '- **Logaritmo natural**: Notación $\ln(a)$ cuya base es el número
  de Euler $e \approx 2,71828$.'
propiedades_relaciones: '- **Base e de Euler**: $\ln(a) \equiv \log_e(a)$.'
ejemplo_guiado:
  enunciado: Evalúe los valores de $\ln(e)$, $\ln(1)$ y $\ln(e^4)$.
  pasos:
  - 'Paso 1: Para $\ln(e)$, como es el logaritmo de la base $e \implies \ln(e) = 1$.'
  - 'Paso 2: Para $\ln(1)$, el logaritmo de $1$ en cualquier base es $0 \implies \ln(1)
    = 0$.'
  - 'Paso 3: Para $\ln(e^4)$, la función $\ln$ cancela la base $e \implies \ln(e^4)
    = 4$.'
  - 'Conclusión: $\ln(e) = 1$, $\ln(1) = 0$ y $\ln(e^4) = 4$.'
