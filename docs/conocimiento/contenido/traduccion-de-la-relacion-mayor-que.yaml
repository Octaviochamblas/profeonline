semantic_id: MAT.ALG.LENGUAJE_RELACIONES.MAYOR_QUE
resumen_inicial: 'Traducción de la relación mayor que: traducción, reglas y aplicación
  práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: Hasta ahora hemos sido los reyes de la igualdad. Todo era perfecto
  y estaba en equilibrio. Pero en la vida real, las cosas rara vez son iguales. Bienvenido
  al mundo de las inecuaciones.
explicacion_formal: '### Definición formal


  La regla visual del símbolo es que la parte más ancha (la abertura) enfrenta a la
  expresión más grande, mientras el vértice (la punta) apunta al menor.


  ### Desarrollo didáctico


  Palabras clave:

  - A es mayor que B: $A > B$

  - Es superior a

  - Supera a

  - Más que


  Ejemplos:

  - ''El salario de un gerente es mayor que el de un analista'': $G > A$

  - ''El doble de un número es superior a cien'': $2x > 100$


  ¿Por qué es importante el sentido? Porque, a diferencia de la igualdad, si inviertes
  los lados tienes que invertir el símbolo. Si $A > B$, entonces obligatoriamente
  $B < A$.'
definiciones_clave: '- **Traducción de la relación mayor que**: Herramienta clave
  para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de la relación mayor que.'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de traducción
    de la relación mayor que.
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a traducción de la relación mayor
    que.
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
