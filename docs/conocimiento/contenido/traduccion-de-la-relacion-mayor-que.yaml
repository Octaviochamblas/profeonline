semantic_id: MAT.ALG.LENGUAJE_RELACIONES.MAYOR_QUE
resumen_inicial: 'La traducción de la relación mayor que consiste en representar simbólicamente la desigualdad estricta $A > B$ donde la primera expresión supera estrictamente en magnitud a la segunda.'
explicacion_simple: |
  En matemáticas, el símbolo **$>$** significa **"es mayor que"**:
  - Frases verbales: *"$A$ es mayor que $B$"*, *"$A$ es estrictamente mayor que $B$"*, *"$A$ supera a $B$"*.
  - Traducción: **$A > B$**.
  - **Regla del símbolo $>$**: La boca abierta del símbolo abre siempre hacia el número o expresión MAYOR; la punta señala al MENOR.
  - Ejemplos:
    - "Un número $x$ es mayor que $10$" $\implies **x > 10**$.
    - "El doble de $a$ es mayor que el triple de $b$" $\implies **2a > 3b**$.
    - "El cuadrado de $n$ supera a $15$" $\implies **n^2 > 15**$.
explicacion_formal: |
  ### Definición formal
  La **relación de orden estricto mayor que** es una relación binaria no simétrica $> \subset \mathbb{R} \times \mathbb{R}$ definida sobre el cuerpo ordenado de los reales $\mathbb{R}$:

  $$\forall A, B \in \mathbb{R}, \quad A > B \iff A - B > 0 \iff (A - B) \in \mathbb{R}^+$$

  ### Propiedades de las Inecuaciones con Orden Estricto ($>$)
  1. **Propiedad Transitiva**: Si $A > B$ y $B > C$, entonces $A > C$.
  2. **Invarianza Aditiva**: Si $A > B$, entonces $A + c > B + c$ para todo $c \in \mathbb{R}$.
  3. **Inversión por Multiplicador Negativo**: Si $A > B$ y $c < 0$, al multiplicar por $c$ se invierte el sentido de la desigualdad:
     $$A > B \land c < 0 \implies A \cdot c < B \cdot c$$

  ### Síntesis didáctica
  La relación mayor que define intervalos abiertos en la recta real y constituye el fundamento del planteamiento de inecuaciones lineales y no lineales.
definiciones_clave: |
  - **Desigualdad estricta mayor que ($>$)**: Relación de orden que establece que la cantidad a la izquierda es estrictamente superior en valor a la derecha.
  - **Sentido de la desigualdad**: Orientación del símbolo ($>$ vs $<$) que se invierte al multiplicar por constantes negativas.
  - **Intervalo abierto $]B, +\infty[$**: Conjunto solución real constituido por todos los números mayores que el límite $B$.
propiedades_relaciones: |
  - **Asimetría estricta**: Si $A > B$, es imposible que $B > A$ o que $A = B$ (Ley de Tricotomía).
  - **Ley de Tricotomía**: Para cualesquiera dos reales $A$ y $B$, se cumple exactamente una de las condiciones: $A > B$, $A = B$ o $A < B$.
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "El triple de un número $x$ aumentado en cuatro es mayor que el quíntuple del mismo número disminuido en ocho".'
  pasos:
    - 'Paso 1: Traducimos el primer miembro (izquierdo): "El triple de $x$ aumentado en cuatro" $\implies 3x + 4$.'
    - 'Paso 2: Traducimos la relación de orden: "es mayor que" $\implies >$.'
    - 'Paso 3: Traducimos el segundo miembro (derecho): "El quíntuple de $x$ disminuido en ocho" $\implies 5x - 8$.'
    - 'Paso 4: Unimos los componentes: $3x + 4 > 5x - 8$.'
    - 'Conclusión: La inecuación traducida es **$3x + 4 > 5x - 8$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad ocurre con el sentido del símbolo $>$ en una inecuación $A > B$ al multiplicar ambos miembros por una constante negativa $c < 0$?'
    choices:
      - {text: 'El sentido del símbolo de desigualdad se invierte pasando de mayor que a menor que ($A \cdot c < B \cdot c$)', is_correct: true}
      - {text: 'El sentido del símbolo se mantiene exactamente igual', is_correct: false}
      - {text: 'El símbolo se transforma en un signo de igualdad', is_correct: false}
      - {text: 'La inecuación se anula y el resultado es cero', is_correct: false}
    explanation: 'La alternativa correcta es ''El sentido del símbolo de desigualdad se invierte pasando de mayor que a menor que ($A \cdot c < B \cdot c$)''. Inversión de signo negativo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cómo se traduce al lenguaje algebraico "El cuadrado de un número $n$ es mayor que el doble de $n$"? '
    choices:
      - {text: 'Se traduce como la inecuación $n^2 > 2n$', is_correct: true}
      - {text: 'Se traduce como la inecuación $2n > n^2$', is_correct: false}
      - {text: 'Se traduce como la inecuación $n^2 \ge 2n$', is_correct: false}
      - {text: 'Se traduce como la ecuación $n^2 = 2n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se traduce como la inecuación $n^2 > 2n$''. Cuadrado $n^2$ mayor que $>$ doble $2n$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la expresión que se ubica antes de las palabras "es mayor que" (miembro izquierdo).'
  - 'Paso 2: Escribir el símbolo de orden estricto $>$.'
  - 'Paso 3: Identificar la expresión que se ubica después de las palabras "es mayor que" (miembro derecho).'
  - 'Paso 4: Comprobar la restricción estricta (no incluye la igualdad $=$ salvo que diga "mayor o igual").'
errores_correccion: |
  - **Error 1:** Incluir el signo igual $\ge$ cuando la frase dice "es mayor que" (estricto). **Cómo corregirlo:** "Mayor que" es **desigualdad ESTRICTA ($>$)**; no lleva la barra de igual abajo.
  - **Error 2:** Apuntar el símbolo al revés (escribir $A < B$ para "A es mayor que B"). **Cómo corregirlo:** La apertura ancha del símbolo **apunta siempre a la cantidad MAYOR ($A > B$)**.
ejemplos:
  - titulo: 'Desigualdad mayor que básica'
    enunciado: '¿Cuál es la traducción de "Un número $x$ es mayor que quince"?'
    alternativas:
      - '$x > 15$'
      - '$x < 15$'
      - '$x \ge 15$'
    respuesta: '$x > 15$'
    solucion_pasos:
      - '1. Expresión 1: $x$.'
      - '2. Relación: mayor que $>$.'
      - '3. Resultado: $x > 15$.'
  - titulo: 'Inversión por negativo'
    enunciado: 'Dada la inecuación $x > 4$, si multiplicamos por $-2$, ¿se invierte el símbolo a $-2x < -8$?'
    alternativas:
      - 'Sí, multiplicar por un número negativo invierte la desigualdad'
      - 'No, el símbolo se mantiene como $-2x > -8$'
      - 'No, el resultado da $2x = 8$'
    respuesta: 'Sí, multiplicar por un número negativo invierte la desigualdad'
    solucion_pasos:
      - '1. Al multiplicar por $-2 < 0$, $>$ se convierte en $<$.'
      - '2. Inecuación equivalente: $-2x < -8$.'
  - titulo: 'Tricotomía'
    enunciado: 'Si sabemos que $a > b$, ¿es imposible que $a = b$ o que $a < b$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la ley de tricotomía de los reales.'
  - titulo: 'Mayor que entre expresiones'
    enunciado: 'La frase "El triple de $m$ es mayor que $m + 10$", ¿se traduce como $3m > m + 10$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, miembro izquierdo $3m >$ miembro derecho $(m+10)$.'
errores_frecuentes:
  - 'Escribir el símbolo mayor o igual \ge al traducir la frase de orden estricto mayor que.'
  - 'Apuntar la abertura ancha del símbolo hacia la cantidad menor en lugar de la mayor.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Mantener el sentido de la desigualdad al multiplicar ambos miembros por un valor negativo.'
  - 'Intercambiar el símbolo mayor que con el símbolo de división.'
afirmaciones_verdaderas:
  - 'La traducción de la relación mayor que utiliza el símbolo de desigualdad estricta > con apertura hacia la cantidad mayor.'
  - 'Multiplicar ambos miembros de una desigualdad estricta por un número negativo invierte el sentido del símbolo.'
al_terminar_debes_poder: 'Traducir enunciados de orden estricto mayor que al lenguaje algebraico mediante el símbolo de desigualdad >.'
