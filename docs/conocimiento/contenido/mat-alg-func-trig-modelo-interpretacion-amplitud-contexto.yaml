semantic_id: MAT.ALG.FUNC_TRIG_MODELO.INTERPRETACION_AMPLITUD_CONTEXTO
resumen_inicial: 'Interpretación contextual de la amplitud $|A|$ como la mitad de la variación total o desviación máxima respecto al valor de equilibrio.'
explicacion_simple: |
  En un problema real, la **amplitud** ($|A|$) representa la fuerza, intensidad o magnitud de la fluctuación alrededor del valor central. Si estás modelando la marea de un río, la amplitud es cuántos metros sube el agua por encima del nivel normal. Si estás modelando la temperatura, la amplitud representa cuántos grados sube el calor en la hora más calurosa del día respecto a la media. La amplitud siempre se mide en las mismas unidades que la variable que se está estudiando (metros, grados, voltios, etc.).
explicacion_formal: |
  ### Definición formal
  En un modelo trigonométrico real $y(t) = A\sin(Bt + C) + D$ o $y(t) = A\cos(Bt + C) + D$, la **amplitud contextual $|A|$** es una constante física no negativa dada por:
  $$\text{Amplitud Contextual} = |A| = \frac{y_{\max} - y_{\min}}{2}$$
  y representa la **desviación máxima absoluta** que experimenta la variable dependiente $y$ con respecto a su nivel de equilibrio central $D$.

  ### Desglose simbólico
  - Unidades físicas: Posee exactamente las **mismas unidades de medida** que la variable dependiente $y$ (ejemplo: $\text{m}$, $^\circ\text{C}$, $\text{Voltios}$, $\text{Presión en mmHg}$).
  - Rango de variación total: El rango completo de oscilación de pico a pico es el doble de la amplitud: $\Delta y = 2|A|$.

  ### Síntesis didáctica
  La amplitud mide "qué tan extrema" es la oscilación. Una mayor amplitud implica una variación más pronunciada respecto al equilibrio, pero no altera el tiempo que tarda la onda en completar un ciclo.
definiciones_clave: |
  - **Amplitud contextual ($|A|$)**: Máxima variación o separación de la variable dependiente respecto a su estado promedio.
  - **Oscilación total pico a pico ($2|A|$)**: Diferencia total comprendida entre la máxima cresta y el mínimo valle.
  - **Nivel de equilibrio ($D$)**: Referencia física central a partir de la cual se mide la amplitud.
propiedades_relaciones: |
  - **Relación con la energía física**: En fenómenos ondulatorios como el sonido o la luz, la energía transportada por la onda es directamente proporcional al cuadrado de la amplitud ($E \propto |A|^2$).
  - **Independencia del período temporal**: Cambiar la amplitud no afecta el tiempo del período $T$ del fenómeno.
ejemplo_guiado:
  enunciado: 'La presión arterial de un paciente se modela mediante $P(t) = 20\cos\left(\frac{5\pi}{3}t\right) + 100$, donde $P$ está en $\text{mmHg}$ y $t$ en segundos. Interpreta el significado contextual del número $20$.'
  pasos:
    - 'Paso 1: Identificar el parámetro correspondiente en el modelo: el coeficiente que multiplica al coseno es $A = 20$.'
    - 'Paso 2: Reconocer que la amplitud es $|A| = 20 \text{ mmHg}$.'
    - 'Paso 3: Identificar la presión media dada por $D = 100 \text{ mmHg}$.'
    - 'Paso 4: Interpretar contextualmente: La presión arterial oscila $20 \text{ mmHg}$ por encima y por debajo de la presión promedio de $100 \text{ mmHg}$, alcanzando una máxima sistólica de $120 \text{ mmHg}$ ($100+20$) y una mínima diastólica de $80 \text{ mmHg}$ ($100-20$).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la temperatura diaria de un invernadero se modela con $T(t) = 8\sin\left(\frac{\pi}{12}t\right) + 22$ (en $^\circ\text{C}$), ¿qué significa físicamente el número $8$?'
    choices:
      - {text: 'La temperatura varía hasta $8^\circ\text{C}$ por encima y por debajo de la media de $22^\circ\text{C}$', is_correct: true}
      - {text: 'La temperatura mínima del día es de $8^\circ\text{C}$', is_correct: false}
      - {text: 'El ciclo de temperatura se repite cada $8$ horas', is_correct: false}
      - {text: 'La temperatura promedio a lo largo de las $24$ horas es de $8^\circ\text{C}$', is_correct: false}
    explanation: 'La alternativa correcta es ''La temperatura varía hasta $8^\circ\text{C}$ por encima y por debajo de la media de $22^\circ\text{C}$''. El parámetro $A = 8$ es la amplitud contextual.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En un estanque de cultivo, el nivel de oxígeno oscila entre un mínimo de $4 \text{ mg/L}$ y un máximo de $10 \text{ mg/L}$. ¿Cuál es la amplitud contextual de la oscilación?'
    choices:
      - {text: '$3 \text{ mg/L}$', is_correct: true}
      - {text: '$6 \text{ mg/L}$', is_correct: false}
      - {text: '$7 \text{ mg/L}$', is_correct: false}
      - {text: '$14 \text{ mg/L}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$3 \text{ mg/L}$''. La amplitud es la semidistancia: $|A| = \frac{10 - 4}{2} = \frac{6}{2} = 3 \text{ mg/L}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer el coeficiente $A$ multiplicativo de la función trigonométrica.'
  - 'Paso 2: Tomar la magnitud escalar positiva $|A|$.'
  - 'Paso 3: Asignar a $|A|$ las unidades físicas de la variable dependiente $y$.'
  - 'Paso 4: Redactar la interpretación contextual declarando que la variable oscila una magnitud $|A|$ por encima y por debajo del nivel de equilibrio $D$.'
errores_correccion: |
  - **Error 1:** Interpretar la amplitud como la diferencia total entre la cresta máxima y el valle mínimo. **Cómo corregirlo:** La diferencia entre el máximo y el mínimo ($y_{\max} - y_{\min}$) es la variación total (doble de la amplitud). La amplitud es exactamente la **mitad** de esa diferencia.
  - **Error 2:** Asignar a la amplitud unidades de tiempo (como horas o segundos). **Cómo corregirlo:** La amplitud mide la magnitud del eje vertical $Y$, por lo que lleva las unidades de la variable dependiente (grados, metros, etc.), no de tiempo.
ejemplos:
  - titulo: 'Amplitud de marea'
    enunciado: 'En la función de marea $h(t) = 2.5\sin(Bt) + 5$ en metros, ¿cuál es la amplitud contextual?'
    alternativas:
      - '$2.5$ metros'
      - '$5$ metros'
      - '$7.5$ metros'
    respuesta: '$2.5$ metros'
    solucion_pasos:
      - '1. El coeficiente es $A = 2.5$.'
      - '2. La amplitud es $2.5$ metros, indicando que el agua sube o baja $2.5$ metros respecto a los $5$ metros promedio.'
  - titulo: 'Variación pico a pico'
    enunciado: 'Si la amplitud de oscilación de un voltaje es de $110$ voltios, ¿cuál es la variación total de pico a pico?'
    alternativas:
      - '$220$ voltios'
      - '$110$ voltios'
      - '$55$ voltios'
    respuesta: '$220$ voltios'
    solucion_pasos:
      - '1. Variación total $= 2 \times \text{Amplitud} = 2 \times 110 = 220$ voltios.'
  - titulo: 'Conservación de unidades'
    enunciado: '¿La amplitud en un modelo de nivel sonoro expresado en decibeles se mide en decibeles?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, mantiene rigurosamente las unidades de la variable de salida.'
  - titulo: 'Independencia temporal'
    enunciado: '¿Aumentar la amplitud de una marea modifica el número de horas que tarda en subir y bajar?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el tiempo depende exclusivamente del período $T$ (frecuencia $B$).'
errores_frecuentes:
  - 'La afirmación de que la amplitud contextual en un modelo físico se mide en unidades de tiempo como segundos u horas.'
  - 'La afirmación de que la amplitud equivale a la diferencia total entre el valor más alto y el más bajo.'
  - 'La afirmación de que la amplitud representa el valor de equilibrio central alrededor del cual oscila el sistema.'
  - 'La afirmación de que una amplitud mayor provoca que el fenómeno se repita en menos tiempo.'
  - 'La afirmación de que el valor de la amplitud puede ser un número negativo si la función se invierte.'
afirmaciones_verdaderas:
  - 'La amplitud contextual $|A|$ en un modelo trigonométrico representa la desviación máxima de la variable estudiada respecto de su valor central de equilibrio $D$.'
  - 'La amplitud se expresa exactamente en las mismas unidades de medida que la variable dependiente del modelo y equivale a la mitad del rango total de oscilación $\frac{y_{\max} - y_{\min}}{2}$.'
al_terminar_debes_poder: |
  QUÉ: Interpretar el significado físico y contextual de la amplitud $|A|$ en modelos trigonométricos del mundo real.
  CÓMO: Explicar $|A|$ como la máxima fluctuación respecto al nivel medio $D$, expresándola en las unidades de la variable dependiente.
