procedimiento:
- 'Paso 1: Identifica el valor máximo $M$ y el valor mínimo $m$ del fenómeno.'
- 'Paso 2: Calcula la amplitud como $a=(M-m)/2$.'
- 'Paso 3: Interpreta $a$ como la variación máxima respecto al promedio, en las unidades
  del contexto.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en interpretación contextual
  de la amplitud en un modelo trigonométrico.
ejemplos:
- titulo: Cálculo de la amplitud a partir de datos
  enunciado: La altura de una marea varía entre $0{,}5$ m y $2{,}5$ m. Calcula la
    amplitud del modelo.
  solucion_pasos:
  - 'Se aplica la fórmula: $a=(2{,}5-0{,}5)/2=1$.'
  - La amplitud es $1$ metro.
- titulo: Interpretación de la amplitud en contexto
  enunciado: Si un modelo de temperatura tiene amplitud $8°$C y promedio $20°$C, ¿cuáles
    son la temperatura máxima y mínima?
  solucion_pasos:
  - 'Se suma y resta la amplitud al promedio: $20+8=28$ y $20-8=12$.'
  - La temperatura máxima es $28°$C y la mínima es $12°$C.
- titulo: ¿La amplitud puede calcularse sin conocer tanto el máximo como el mínimo?
  enunciado: ¿Es posible calcular la amplitud de un fenómeno conociendo únicamente
    su valor máximo?
  respuesta: 'No'
  solucion_pasos:
  - Se necesitan tanto el máximo como el mínimo para calcular correctamente la amplitud.
- titulo: ¿La amplitud representa la variación total del fenómeno?
  enunciado: ¿La amplitud representa la variación total (de mínimo a máximo) del fenómeno?
  respuesta: 'No'
  solucion_pasos:
  - Representa la mitad de esa variación total, no la variación completa.
errores_frecuentes:
- Declarar la amplitud con la variación total (máximo menos mínimo), sin dividir por
  $2$.
- No identificar correctamente cuál valor es el máximo y cuál el mínimo.
- Declarar la amplitud con la línea media del modelo.
- Omitir incluir las unidades correctas del contexto al interpretar la amplitud.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  interpretación contextual de la amplitud en un modelo trigonométrico.
