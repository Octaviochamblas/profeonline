semantic_id: MAT.ALG.FUNC_TRIG_MODELO.INTERPRETACION_AMPLITUD_CONTEXTO
resumen_inicial: 'Interpretación contextual de la amplitud en un modelo trigonométrico:
  círculo unitario, amplitud, período y transformaciones de Modelamiento trigonométrico
  y extensiones.'
explicacion_simple: 'En un modelo aplicado, la amplitud no es solo un número abstracto:
  representa cuánto se aleja el fenómeno de su valor promedio en cada dirección.'
explicacion_formal: '### Definición formal


  Si un fenómeno alcanza un valor máximo $M$ y un valor mínimo $m$, la amplitud del
  modelo correspondiente es $a=(M-m)/2$. Representa cuánto se aleja el fenómeno de
  su promedio, tanto hacia arriba como hacia abajo.


  ### Desarrollo didáctico


  Si la temperatura de una ciudad varía entre $10°$C (mínima) y $30°$C (máxima), la
  amplitud del modelo es $(30-10)/2=10°$C: la temperatura se aleja $10$ grados del
  promedio en cada dirección.'
definiciones_clave: '- **Interpretación contextual de la amplitud en un modelo trigonométrico**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a interpretación contextual de la amplitud en un modelo trigonométrico.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    interpretación contextual de la amplitud en un modelo trigonométrico.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de interpretación contextual de la amplitud en un modelo
    trigonométrico.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
