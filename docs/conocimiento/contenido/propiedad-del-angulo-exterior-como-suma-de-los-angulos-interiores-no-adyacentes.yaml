semantic_id: MAT.GEO.TRIANGULOS_ANGULOS.ANGULO_EXTERIOR_NO_ADYACENTES
resumen_inicial: La medida de cualquier ángulo exterior de un triángulo es estrictamente
  igual a la suma de las medidas de los dos ángulos interiores no adyacentes a él.
explicacion_simple: '![Ángulo Exterior y No Adyacentes](/static/img/nodos/propiedad-del-angulo-exterior-como-suma-de-los-angulos-interiores-no-adyacentes-intro.svg)


  Para saber cuánto mide un ángulo de afuera en una esquina, no necesitas calcular
  el ángulo de adentro de esa esquina: simplemente **suma los otros dos ángulos de
  adentro** que están enfrente ($\alpha'' = \beta + \gamma$).'
explicacion_formal: '### Teorema del ángulo exterior

  En cualquier triángulo, la medida de todo ángulo exterior es exactamente igual a
  la suma de las medidas de los dos ángulos interiores no adyacentes a él:


  $$\alpha'' = \beta + \gamma \quad \land \quad \beta'' = \alpha + \gamma \quad \land
  \quad \gamma'' = \alpha + \beta$$


  ### Desglose simbólico y geométrico

  - $\alpha''$: Ángulo exterior en el vértice $A$.

  - $\beta, \gamma$: Ángulos interiores remotos (no adyacentes a $\alpha''$).

  - Deducción formal: Como $\alpha'' = 180^\circ - \alpha$ y $\alpha + \beta + \gamma
  = 180^\circ \implies 180^\circ - \alpha = \beta + \gamma$, se concluye $\alpha''
  = \beta + \gamma$.

  - Desigualdad del ángulo exterior: $\alpha'' > \beta$ y $\alpha'' > \gamma$.


  ### Síntesis didáctica

  Este teorema vincula directamente el ángulo exterior con los vértices remotos, simplificando
  cálculos sin requerir determinar previamente el ángulo interior adyacente.'
definiciones_clave: '- **Ángulo exterior**: Ángulo suplementario al interior generado
  prolongando un lado.

  - **Ángulos interiores no adyacentes**: Los dos ángulos interiores ubicados en los
  vértices distintos al del ángulo exterior.

  - **Teorema del ángulo exterior**: $\alpha'' = \beta + \gamma$. '
propiedades_relaciones: '- **Desigualdad del ángulo exterior**: Un ángulo exterior
  es estrictamente mayor que cualquiera de los dos interiores no adyacentes por separado
  ($\alpha'' > \beta$ y $\alpha'' > \gamma$).

  - **Ahorro de pasos**: Permite calcular ángulos exteriores directamente en problemas
  de olimpiadas y pruebas estandarizadas. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Exterior No Adyacentes](/static/img/nodos/propiedad-del-angulo-exterior-como-suma-de-los-angulos-interiores-no-adyacentes-ejemplos.svg)


    En un triángulo $\triangle ABC$, los ángulos interiores en $B$ y $C$ miden $\beta
    = 48^\circ$ y $\gamma = 62^\circ$. Calcula directamente la medida del ángulo exterior
    $\alpha''$ en el vértice $A$.'
  pasos:
  - 'Paso 1: Identificar los ángulos interiores no adyacentes a $A$: son $\beta =
    48^\circ$ y $\gamma = 62^\circ$.'
  - 'Paso 2: Aplicar el teorema del ángulo exterior: $\alpha'' = \beta + \gamma$.'
  - 'Paso 3: Sustituir los valores numéricos: $\alpha'' = 48^\circ + 62^\circ$.'
  - 'Paso 4: Efectuar la suma: $\alpha'' = 110^\circ$.'
  - 'Paso 5: Comprobar por suplemento: $\alpha = 180^\circ - 110^\circ = 70^\circ$,
    y $70^\circ + 48^\circ + 62^\circ = 180^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la medida de un ángulo exterior de un triángulo según
    este teorema?
  choices:
  - text: A la suma de los dos ángulos interiores no adyacentes
    is_correct: true
  - text: A la resta de los ángulos interiores
    is_correct: false
  - text: Al doble del ángulo interior adyacente
    is_correct: false
  - text: Siempre a 180°
    is_correct: false
  explanation: Por el teorema del ángulo exterior, su valor equivale exactamente a
    la suma de los dos ángulos interiores no adyacentes.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los ángulos interiores en A y B son 35° y 75°, ¿cuánto mide el ángulo
    exterior en C?
  choices:
  - text: 110° (porque 35° + 75° = 110°)
    is_correct: true
  - text: 70°
    is_correct: false
  - text: 145°
    is_correct: false
  - text: 105°
    is_correct: false
  explanation: Sumando los dos no adyacentes se obtiene 110° (porque 35° + 75° = 110°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el vértice del ángulo exterior que se desea calcular.'
- 'Paso 2: Identificar los dos ángulos interiores opuestos (no adyacentes).'
- 'Paso 3: Sumar sus medidas directamente para obtener el ángulo exterior: $\text{Ext}
  = \text{Int}_1 + \text{Int}_2$.'
errores_correccion: 'No sumes el ángulo interior de la misma esquina: debes sumar
  los dos interiores opuestos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo $\beta = 30^\circ$ y $\gamma = 80^\circ$, ¿cuánto
    mide $\alpha'$?
  alternativas:
  - $110^\circ$
  - $70^\circ$
  - $150^\circ$
  respuesta: $110^\circ$
  solucion_pasos:
  - $\alpha' = \beta + \gamma = 30^\circ + 80^\circ = 110^\circ$.
- titulo: Ejemplo 2
  enunciado: En un triángulo isósceles con $\alpha = 40^\circ$ en el vértice principal,
    ¿cuánto mide el ángulo exterior en una de las bases?
  alternativas:
  - $110^\circ$
  - $140^\circ$
  - $70^\circ$
  respuesta: $110^\circ$
  solucion_pasos:
  - Los ángulos de la base son $(180^\circ - 40^\circ)/2 = 70^\circ$. El exterior
    en una base es $\beta' = 40^\circ + 70^\circ = 110^\circ$.
- titulo: ¿Un ángulo exterior de un triángulo es igual a la suma de los dos interiores
    no adyacentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema clásico de la geometría euclidiana.
- titulo: ¿Un ángulo exterior puede ser menor que cualquiera de los dos interiores
    no adyacentes?
  respuesta: 'No'
  solucion_pasos:
  - No, por ser la suma de dos números positivos, siempre es estrictamente mayor que
    cada sumando individual.
errores_frecuentes:
- Sumar el ángulo interior adyacente en vez de los dos no adyacentes.
- Restar los ángulos no adyacentes en lugar de sumarlos.
- Olvidar que un ángulo exterior y su interior adyacente suman $180^\circ$.
- Creer que el teorema solo aplica en triángulos rectángulos.
- Confundir la notación $\alpha'$ con la derivada o con un número primo.
afirmaciones_verdaderas:
- La medida de un ángulo exterior es igual a la suma de los dos interiores no adyacentes.
- Todo ángulo exterior es estrictamente mayor que cualquiera de los interiores opuestos.
al_terminar_debes_poder: '**QUÉ:** Calcular medidas angulares aplicando la propiedad
  del ángulo exterior.


  **CÓMO:** Sumando directamente los dos ángulos interiores no adyacentes ($\alpha''
  = \beta + \gamma$).


  ![Resumen de la Propiedad del Ángulo Exterior](/static/img/nodos/propiedad-del-angulo-exterior-como-suma-de-los-angulos-interiores-no-adyacentes-resumen.svg)'
