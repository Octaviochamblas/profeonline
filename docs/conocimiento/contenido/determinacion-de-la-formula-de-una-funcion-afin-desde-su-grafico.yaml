semantic_id: MAT.ALG.FUNCION_AFIN.FORMULA_DESDE_GRAFICO
resumen_inicial: 'Para hallar la fórmula $f(x) = m x + n$ desde un gráfico: se lee
  el corte $n$ en el eje $Y$ y se calcula la pendiente $m$ con otro punto conocido.'
explicacion_simple: 'Si te dan el dibujo de una recta en el plano cartesiano y debes
  hallar su fórmula $f(x) = m x + n$:

  1. Mira la altura donde la recta cruza el eje vertical $Y$: ese valor es $n$.

  2. Busca otro punto claro de la recta $(x_1, y_1)$.

  3. Calcula la pendiente con la fórmula $m = \frac{y_1 - n}{x_1 - 0}$.

  4. Escribe la función final ensamblando $m$ y $n$.'
explicacion_formal: 'Dada la recta $G(f)$ que corta al eje $Y$ en $(0, n)$ y pasa
  por el punto $P_1(x_1, y_1)$ con $x_1 \neq 0$:


  $$n = y|_{x=0} \quad \land \quad m = \frac{y_1 - n}{x_1} \implies f(x) = \left(\frac{y_1
  - n}{x_1}\right)x + n$$


  **Desglose de la fórmula:**

  - Reconstrucción algebraico-geométrica unívoca de los coeficientes de la recta a
  partir de dos lecturas gráficas directas.'
definiciones_clave: '- **Reconstrucción de fórmula**: Obtención de los parámetros
  $(m, n)$ por inspección de coordenadas de la recta.'
propiedades_relaciones: '- **Lectura del intercepto**: El punto $(0, n)$ proporciona
  de inmediato la constante $n$ reduciendo el problema a hallar solo $m$.'
ejemplo_guiado:
  enunciado: Una recta corta al eje $Y$ en $(0, 4)$ y pasa por el punto $(2, 10)$.
    Determina su fórmula algebraica $f(x)$.
  pasos:
  - 'Paso 1: Leer el coeficiente de posición directamente del corte con el eje $Y$:
    $n = 4$.Paso 2: Usar el punto $(2, 10)$ y $(0, 4)$ para calcular la pendiente:
    $m = \frac{10 - 4}{2 - 0} = \frac{6}{2} = 3$.Paso 3: Ensamblar los parámetros
    en $f(x) = m x + n$: $f(x) = 3x + 4$.Paso 4: Concluir que la fórmula requerida
    es $f(x) = 3x + 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: A partir de una recta que corta al eje Y en $(0, 4)$ y pasa por $(2, 10)$,
    ¿cuál es la fórmula de $f(x)$?
  choices:
  - text: $f(x) = 3x + 4$
    is_correct: true
  - text: $f(x) = 4x + 3$
    is_correct: false
  - text: $f(x) = 6x + 4$
    is_correct: false
  - text: $f(x) = 2x + 10$
    is_correct: false
  explanation: La alternativa correcta es '$f(x) = 3x + 4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una gráfica cruza el eje Y en $(0, -2)$ y el eje X en $(3, 0)$, ¿cuál
    es su pendiente $m$?
  choices:
  - text: $m = \frac{2}{3}$
    is_correct: true
  - text: $m = -\frac{2}{3}$
    is_correct: false
  - text: $m = \frac{3}{2}$
    is_correct: false
  - text: $m = 6$
    is_correct: false
  explanation: La alternativa correcta es '$m = \frac{2}{3}$'. (Puesto que $m = \frac{0
    - (-2)}{3 - 0} = \frac{2}{3}$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la intersección con el eje $Y$ y registrar $n$.'
- 'Paso 2: Elegir un segundo punto con coordenadas enteras de la recta $(x_1, y_1)$.'
- 'Paso 3: Calcular $m = \frac{y_1 - n}{x_1}$.'
- 'Paso 4: Escribir $f(x) = m x + n$.'
errores_correccion: '- **Error común:** Intercambiar $m$ y $n$ al armar la fórmula
  (escribir $f(x) = 4x + 3$ en lugar de $3x + 4$).

  - **Cómo corregirlo:** Recuerda que la pendiente $m$ va SIEMPRE multiplicando a
  la $x$, y el coeficiente $n$ va como término independiente suelto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de función afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función afín f(x) = mx + n con n != 0 pasa por el origen (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - No, porque f(0) = n != 0.
- titulo: ¿El coeficiente de posición n indica la ordenada de corte con el eje Y?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta corta al eje Y en el punto (0, n).
errores_frecuentes:
- Confundir el coeficiente de posición $n$ (corte con el eje $Y$) con la intersección
  con el eje $X$.
- Asumir que la pendiente es siempre el primer número escrito en la fórmula sin verificar
  si acompaña a la variable $x$.
- Responder la intersección con un eje entregando solo un número suelto en lugar del
  par ordenado correspondiente.
- Confundir 'el cero de una función' (resolver $f(x)=0$) con 'evaluar en cero' (calcular
  $f(0)$).
- Cometer errores de signo al restar coordenadas negativas al aplicar la fórmula punto-pendiente.
afirmaciones_verdaderas:
- La función afín $f(x) = m x + n$ corta al eje vertical $Y$ en el punto $(0, n)$
  y al eje horizontal $X$ en $\left(-\frac{n}{m}, 0\right)$.
- La gráfica de una función afín es paralela a la gráfica de la función lineal $g(x)
  = m x$ trasladada verticalmente $n$ unidades.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y graficar
  funciones afines, identificando pendiente, coeficiente de posición, intersecciones
  con los ejes, ceros y fórmulas desde dos puntos.
