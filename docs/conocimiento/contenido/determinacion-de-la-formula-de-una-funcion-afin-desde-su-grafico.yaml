errores_frecuentes:
  - 'El coeficiente de posición $b$ se determina observando el punto donde la recta cruza el eje horizontal $X$.'
  - 'La pendiente de una gráfica se calcula sumando las coordenadas del punto de origen y dividiendo por 2.'
  - 'Si una recta cruza a los ejes en $(0, 3)$ y $(3, 0)$, su pendiente es positiva igual a $m = 1$.'
  - 'Una recta que desciende de izquierda a derecha posee una fórmula con coeficiente de posición negativo obligatorio.'
  - 'La fórmula de una función afín deducida del gráfico depende de los colores utilizados en los ejes cartesianos.'
afirmaciones_verdaderas:
  - 'Deducir la fórmula de una función afín desde su gráfica requiere identificar el intercepto vertical $(0, b)$ y aplicar un segundo punto para hallar $m = \frac{\Delta y}{\Delta x}$.'
  - 'Si la recta intersecta a los ejes en $(0, b)$ y $(a, 0)$, la pendiente de la función afín es $m = -\frac{b}{a}$.'
al_terminar_debes_poder: |
  QUÉ: Deducir la ecuación algebraica de una función afín a partir de su representación gráfica.
  CÓMO: Leer la ordenada al origen $b$, determinar la pendiente $m$ con un segundo punto y redactar la fórmula $f(x) = mx + b$.
