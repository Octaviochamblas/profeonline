semantic_id: MAT.ALG.FUNCION_AFIN.FORMULA_DESDE_GRAFICO
resumen_inicial: Determinar la fórmula de una función afín desde su gráfica consiste en leer el coeficiente de posición $n$ en el corte con el eje $Y$ y calcular la pendiente $m = \frac{\Delta y}{\Delta x}$ con otro punto claro.
explicacion_simple: '![Determinar la fórmula de una función afín desde su gráfica consiste en leer el coeficiente de posición $n$ en el corte con el eje $Y$ y calcular la pendiente $m = \frac{\Delta y}{\Delta x}$ con otro punto claro](/static/img/nodos/determinacion-de-la-formula-de-una-funcion-afin-desde-su-grafico-intro.svg)



  Para encontrar la ecuación $y = mx + n$ mirando un dibujo en el plano cartesiano:

  1. **Encuentra $n$:** Mira dónde la recta cruza el eje vertical $Y$. La altura de ese punto es $n$.

  2. **Encuentra $m$:** Elige otro punto exacto de la cuadrícula por donde pase la recta. Cuenta cuántas unidades sube/baja ($\Delta y$) y cuántas unidades avanza a la derecha ($\Delta x$). La pendiente es $m = \frac{\Delta y}{\Delta x}$.

  3. **Arma la fórmula:** Escribe $f(x) = mx + n$.'
explicacion_formal: 'Dada la gráfica cartesiana de una recta $\mathcal{L}$ no vertical:

  1. **Extracción del intercepto vertical**: Identificar el punto $P_1(0, n) = \mathcal{L} \cap \text{Eje } Y \implies n = y(P_1)$.

  2. **Extracción de un punto secundario**: Localizar $P_2(x_2, y_2) \in \mathcal{L}$ con $x_2 \neq 0$.

  3. **Cálculo de pendiente**: $m = \frac{y_2 - n}{x_2 - 0} = \frac{y_2 - n}{x_2}$.

  4. **Reconstrucción analítica**: $f(x) = \left(\frac{y_2 - n}{x_2}\right)x + n$.'
definiciones_clave: '- **Reconstrucción funcional**: Proceso inverso de deducir la expresión algebraica a partir de la geometría del plano.

  - **Puntos reticulares**: Coordenadas de números enteros identificables con total exactitud en la cuadrícula.'
propiedades_relaciones: '- **Unicidad de la recta**: Una recta queda unívocamente determinada por su intercepto y su pendiente.

  - **Verificación cruzada**: Sustituir un tercer punto del gráfico en la fórmula obtenida para comprobar su validez.'
ejemplo_guiado:
  enunciado: '![Ejemplo Determinar la fórmula de una función afín desde su gráfica consiste en leer el coeficiente de posición $n$ en el corte con el eje $Y$ y calcular la pendiente $m = \frac{\Delta y}{\Delta x}$ con otro punto claro](/static/img/nodos/determinacion-de-la-formula-de-una-funcion-afin-desde-su-grafico-ejemplos.svg)



    Una recta en el plano corta al eje Y en el punto $(0, -2)$ y pasa por el punto $(3, 7)$. Determina la fórmula de la función afín.'
  pasos:
  - 'Paso 1: Extraer el coeficiente de posición del corte con el eje Y: $n = -2$.'
  - 'Paso 2: Usar las coordenadas de los dos puntos: $P_1(0, -2)$ y $P_2(3, 7)$.'
  - 'Paso 3: Calcular la pendiente: $m = \frac{7 - (-2)}{3 - 0} = \frac{7 + 2}{3} = \frac{9}{3} = 3$.'
  - 'Paso 4: Escribir la fórmula en la forma $f(x) = mx + n$: $f(x) = 3x - 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una recta corta al eje Y en $(0, 5)$ y pasa por $(2, 9)$, ¿cuál es su fórmula?
  choices:
  - text: f(x) = 2x + 5
    is_correct: true
  - text: f(x) = 5x + 2
    is_correct: false
  - text: f(x) = 4x + 5
    is_correct: false
  - text: f(x) = -2x + 5
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 2x + 5'. $n = 5$ y $m = \frac{9 - 5}{2 - 0} = \frac{4}{2} = 2$, luego $f(x) = 2x + 5$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Una recta pasa por $(0, -4)$ y $(4, 0)$. ¿Cuál es su fórmula?
  choices:
  - text: f(x) = x - 4
    is_correct: true
  - text: f(x) = -x - 4
    is_correct: false
  - text: f(x) = 4x - 4
    is_correct: false
  - text: f(x) = x + 4
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = x - 4'. $n = -4$ y $m = \frac{0 - (-4)}{4 - 0} = \frac{4}{4} = 1 \implies f(x) = x - 4$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el punto de corte con el eje vertical $Y$ y registrar $n$.'
- 'Paso 2: Identificar las coordenadas de un segundo punto claro $(x_2, y_2)$ sobre la cuadrícula.'
- 'Paso 3: Calcular la pendiente mediante la fórmula $m = \frac{y_2 - n}{x_2}$.'
- 'Paso 4: Escribir la fórmula final $f(x) = mx + n$.'
errores_correccion: '- **Error común:** Equivocarse en el signo de la pendiente al observar rectas que descienden.

  - **Cómo corregirlo:** Si la recta cae al avanzar hacia la derecha, la pendiente **debe ser estrictamente negativa** ($m < 0$).'
ejemplos:
- titulo: 'Ejemplo 1: Recta decreciente'
  enunciado: La gráfica corta al eje Y en $(0, 6)$ y pasa por $(2, 0)$. ¿Cuál es su fórmula?
  alternativas:
  - f(x) = -3x + 6
  - f(x) = 3x + 6
  - f(x) = -6x + 2
  - f(x) = -2x + 6
  respuesta: f(x) = -3x + 6
  solucion_pasos:
  - 'Paso 1: $n = 6$.'
  - 'Paso 2: $m = \frac{0 - 6}{2 - 0} = -3 \implies f(x) = -3x + 6$.'
- titulo: 'Ejemplo 2: Pendiente fraccionaria desde gráfica'
  enunciado: Una recta corta al eje Y en $(0, 1)$ y pasa por $(3, 3)$. ¿Cuál es su ecuación?
  alternativas:
  - f(x) = (2/3)x + 1
  - f(x) = (3/2)x + 1
  - f(x) = 2x + 1
  - f(x) = (2/3)x + 3
  respuesta: f(x) = (2/3)x + 1
  solucion_pasos:
  - 'Paso 1: $n = 1$.'
  - 'Paso 2: $m = \frac{3 - 1}{3 - 0} = \frac{2}{3} \implies f(x) = \frac{2}{3}x + 1$.'
- titulo: 'Ejemplo 3: Corte negativo en ambos ejes'
  enunciado: La recta corta en $(0, -3)$ y $(-3, 0)$. ¿Cuál es su fórmula?
  alternativas:
  - f(x) = -x - 3
  - f(x) = x - 3
  - f(x) = -x + 3
  - f(x) = -3x - 3
  respuesta: f(x) = -x - 3
  solucion_pasos:
  - 'Paso 1: $n = -3$.'
  - 'Paso 2: $m = \frac{0 - (-3)}{-3 - 0} = \frac{3}{-3} = -1 \implies f(x) = -x - 3$.'
- titulo: 'Ejemplo 4: Identificación visual rápida'
  enunciado: Si una recta pasa por $(0, 4)$ y cada vez que avanza 1 en X sube 5 en Y, ¿cuál es su ecuación?
  alternativas:
  - f(x) = 5x + 4
  - f(x) = 4x + 5
  - f(x) = (1/5)x + 4
  - f(x) = 5x - 4
  respuesta: f(x) = 5x + 4
  solucion_pasos:
  - 'Paso 1: $m = 5$, $n = 4 \implies f(x) = 5x + 4$.'
errores_frecuentes:
- Invertir la pendiente calculando Delta x / Delta y.
- Olvidar el signo negativo en pendientes decrecientes.
- Tomar puntos aproximados fuera de los vértices de la cuadrícula.
afirmaciones_verdaderas:
- La fórmula de una función afín se deduce leyendo n en el corte con el eje Y y calculando la pendiente con otro punto claro.
- Dos puntos cualesquiera de la gráfica son suficientes para determinar completamente su ecuación.
al_terminar_debes_poder: '**QUÉ:** Deducir y escribir la fórmula algebraica de una función afín a partir de su representación gráfica.


  **CÓMO:** Extrayendo el intercepto n en el eje Y y calculando la pendiente m mediante el cociente de desplazamientos m = Δy/Δx.


