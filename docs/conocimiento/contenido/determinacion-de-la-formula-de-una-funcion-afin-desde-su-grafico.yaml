procedimiento:
- 'Paso 1: Identifica el punto donde la recta corta al eje $y$; su ordenada es $n$.'
- 'Paso 2: Identifica un segundo punto claramente visible en la gráfica.'
- 'Paso 3: Calcula la pendiente $m$ usando el punto de corte y el segundo punto.'
- 'Paso 4: Escribe la fórmula $f(x) = mx + n$ con los valores obtenidos.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar determinación de la fórmula de una función afín desde su gráfico.
ejemplos:
- titulo: Reconstrucción con dos puntos claros
  enunciado: Un gráfico corta al eje $y$ en $(0,-3)$ y pasa por $(4,5)$. Determina
    la fórmula.
  solucion_pasos:
  - $n=-3$.
  - $m = \frac{5-(-3)}{4-0} = \frac{8}{4} = 2$.
  - $f(x) = 2x - 3$.
- titulo: Reconstrucción con pendiente negativa
  enunciado: Un gráfico corta al eje $y$ en $(0,6)$ y pasa por $(3,0)$. Determina
    la fórmula.
  solucion_pasos:
  - $n=6$.
  - $m = \frac{0-6}{3-0} = -2$.
  - $f(x) = -2x + 6$.
- titulo: ¿Basta con conocer un solo punto del gráfico para determinar la fórmula
    completa?
  enunciado: ¿Basta con conocer un solo punto del gráfico para determinar la fórmula
    completa?
  respuesta: 'No'
  solucion_pasos:
  - Se necesitan al menos dos datos (usualmente el intercepto y otro punto) para determinar
    $m$ y $n$.
- titulo: ¿El punto de corte con el eje $y$ entrega directamente el valor de $n$?
  enunciado: ¿El punto de corte con el eje $y$ entrega directamente el valor de $n$?
  respuesta: Sí
  solucion_pasos:
  - La ordenada de ese punto es exactamente el coeficiente de posición.
errores_frecuentes:
- Confundir el punto de corte con el eje $x$ con el del eje $y$ al leer $n$.
- Calcular mal la pendiente por errores en el orden de resta de coordenadas.
- Leer coordenadas aproximadas o incorrectas del gráfico.
- Olvidar escribir la fórmula final combinando ambos parámetros.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando determinación
  de la fórmula de una función afín desde su gráfico.
