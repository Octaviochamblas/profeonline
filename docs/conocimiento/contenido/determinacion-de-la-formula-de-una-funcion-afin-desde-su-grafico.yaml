semantic_id: MAT.ALG.FUNCION_AFIN.FORMULA_DESDE_GRAFICO
resumen_inicial: 'Determinación de la fórmula de una función afín desde su gráfico:
  conceptos, representación y propiedades en Función afín.'
explicacion_simple: Si conoces el dibujo de la recta, puedes reconstruir exactamente
  su fórmula leyendo dos datos clave directamente del gráfico.
explicacion_formal: '### Definición formal


  Dada la gráfica de una recta no vertical, su fórmula $f(x)=mx+n$ se reconstruye
  identificando $n$ como la ordenada del punto de corte con el eje $y$, y calculando
  $m = \dfrac{y_2-y_1}{x_2-x_1}$ usando dos puntos cualesquiera visibles en la gráfica.


  ### Desarrollo didáctico


  El proceso combina dos lecturas: una directa (el intercepto $n$) y una calculada
  (la pendiente $m$, usando la fórmula de dos puntos).


  Si el gráfico corta al eje $y$ en $(0,4)$ y pasa también por $(2,10)$: $n=4$, y
  $m=\frac{10-4}{2-0}=3$. La fórmula es $f(x)=3x+4$.'
definiciones_clave: '- **Determinación de la fórmula de una función afín desde su
  gráfico**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a determinación de la fórmula de una función
  afín desde su gráfico.'
ejemplo_guiado:
