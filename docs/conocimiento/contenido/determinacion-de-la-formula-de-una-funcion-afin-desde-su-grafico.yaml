semantic_id: MAT.ALG.FUNCION_AFIN.FORMULA_DESDE_GRAFICO
resumen_inicial: Deducir la fórmula de una función afín a partir de su gráfico exige leer la ordenada de corte $(0, b)$ y calcular la pendiente con un segundo punto.
explicacion_simple: |
  Para hallar la fórmula $f(x) = mx + b$ mirando un gráfico:

  1. Encuentra dónde la recta **cruza el eje vertical $Y$**: la altura de ese punto es $b$.
  2. Elige otro punto claro $(x, y)$ por donde pase la línea recta.
  3. Mide cuánto subes/bajas ($\Delta y$) y cuánto avanzas ($\Delta x$) desde el corte $Y$ hasta ese punto para hallar $m = \frac{\Delta y}{\Delta x}$.
  4. Arma la fórmula $f(x) = mx + b$.
explicacion_formal: |
  Sea la gráfica de una recta no vertical en el plano cartesiano. La **recuperación analítica** de la función afín $f(x) = mx + b$ se realiza mediante:

  1. **Lectura directa de la ordenada al origen**:
     $$G_f \cap \text{eje } Y = \{(0, b)\} \implies b = \text{ordenada del intercepto}$$

  2. **Cálculo de la pendiente desde un punto secundario** $P(x_0, y_0) \in G_f$ con $x_0 \neq 0$:
     $$m = \frac{y_0 - b}{x_0 - 0} = \frac{y_0 - b}{x_0}$$
definiciones_clave: |
  - **Deducción gráfica**: Proceso de identificación de parámetros geométricos ($b$ y $m$) mediante la observación precisa de puntos notables en la gráfica.
propiedades_relaciones: |
  - **Cortes con los ejes**: Si se leen los puntos de corte $(0, b)$ y $(a, 0)$, la pendiente queda directamente como $m = -\frac{b}{a}$.
ejemplo_guiado:
  enunciado: "Una recta en el plano cartesiano corta al eje $Y$ en el punto $(0, 2)$ y pasa por el punto $(4, 5)$. Encuentra la fórmula de la función afín."
  pasos:
    - 'Paso 1: Leer la intersección con el eje $Y$: pasa por $(0, 2) \implies b = 2$.'
    - 'Paso 2: Usar el punto secundario $P(4, 5)$ para calcular la variación: $\Delta y = 5 - 2 = 3$ y $\Delta x = 4 - 0 = 4$.'
    - 'Paso 3: Calcular la pendiente: $m = \frac{\Delta y}{\Delta x} = \frac{3}{4} = 0{,}75$.'
    - 'Paso 4: Escribir la función afín: $f(x) = \frac{3}{4}x + 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Una recta corta al eje $Y$ en $(0, 2)$ y pasa por $(4, 5)$. ¿Cuál es la fórmula de la función afín?"
    choices:
      - {text: "$f(x) = \\frac{3}{4}x + 2$", is_correct: true}
      - {text: "$f(x) = \\frac{4}{3}x + 2$", is_correct: false}
      - {text: "$f(x) = 2x + 5$", is_correct: false}
      - {text: "$f(x) = 3x + 4$", is_correct: false}
    explanation: "La alternativa correcta es '$f(x) = \\frac{3}{4}x + 2$'. $b = 2$ y $m = \\frac{5 - 2}{4 - 0} = \\frac{3}{4}$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Si la recta corta al eje $Y$ en $(0, -1)$ y desciende de izquierda a derecha con pendiente $-2$, ¿cuál es su expresión?"
    choices:
      - {text: "$f(x) = -2x - 1$", is_correct: true}
      - {text: "$f(x) = -x - 2$", is_correct: false}
      - {text: "$f(x) = 2x - 1$", is_correct: false}
      - {text: "$f(x) = -2x + 1$", is_correct: false}
    explanation: "La alternativa correcta es '$f(x) = -2x - 1$'. $b = -1$ y $m = -2$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Localizar el punto de corte de la recta con el eje $Y$ y registrar su ordenada $b$.'
  - 'Paso 2: Identificar las coordenadas $(x_0, y_0)$ de un segundo punto claro en la cuadrícula.'
  - 'Paso 3: Calcular la pendiente $m = \frac{y_0 - b}{x_0}$.'
  - 'Paso 4: Ensamblar la fórmula $f(x) = mx + b$.'
errores_correccion: |
  - **Error común:** Leer el corte en el eje horizontal $X$ y usarlo directamente como el valor de $b$.
  - **Cómo corregirlo:** El valor de $b$ es EXCLUSIVAMENTE la altura de corte en el eje vertical $Y$ ($(0, b)$).
