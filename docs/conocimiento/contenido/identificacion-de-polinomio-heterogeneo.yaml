resumen_inicial: Un polinomio es heterogéneo cuando sus términos monómicos poseen
  grados absolutos diferentes entre sí.
explicacion_simple: A diferencia de los homogéneos, un polinomio heterogéneo es aquel
  donde los términos tienen distintas sumas de exponentes. Por ejemplo, en $3x^4 -
  2x^2y + 5y$, el primer término es de grado $4$, el segundo es de grado $3$ ($2+1$)
  y el tercero de grado $1$. Como no todos son iguales, el polinomio es heterogéneo.
explicacion_formal: 'Un polinomio multivariable $P(x_1, \dots, x_m) = \sum_{k=1}^n
  T_k$ es **Heterogéneo** si y solo si existen al menos dos términos $T_i, T_j$ tales
  que:


  $$\exists i, j \in \{1, \dots, n\} \quad / \quad G.A.(T_i) \neq G.A.(T_j)$$


  > **Complemento didáctico:** La heterogeneidad es la propiedad genérica de la mayoría
  de los polinomios en el álgebra elemental, careciendo de invarianza de escala.'
definiciones_clave: '- **Polinomio heterogéneo**: Expresión donde al menos dos términos
  poseen grados absolutos distintos.'
propiedades_relaciones: '- **Complementariedad**: Un polinomio no nulo con más de
  un término es heterogéneo si y solo si no es homogéneo.'
ejemplo_guiado:
  enunciado: Demuestre que el polinomio $P(x,y) = 7x^3y^2 - 4x^2y + 9$ es heterogéneo.
  pasos:
  - 'Paso 1: Grado del término 1 ($7x^3y^2$): $3 + 2 = 5$.'
  - 'Paso 2: Grado del término 2 ($-4x^2y$): $2 + 1 = 3$.'
  - 'Paso 3: Grado del término 3 ($+9$): $0$.'
  - 'Paso 4: Comparar grados: $5 \neq 3 \neq 0$.'
  - 'Conclusión: Dado que los términos poseen grados absolutos diferentes, el polinomio
    es heterogéneo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuándo se clasifica a un polinomio como heterogéneo?
  choices:
  - text: Cuando al menos dos de sus términos poseen distintos grados absolutos
    is_correct: true
  - text: Cuando todos sus coeficientes son enteros negativos
    is_correct: false
  - text: Cuando no tiene variables en su estructura
    is_correct: false
  - text: Cuando el número de términos es par
    is_correct: false
  explanation: La alternativa correcta es 'Cuando al menos dos de sus términos poseen
    distintos grados absolutos'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 7x^3y^2 - 4x^2y + 9, ¿cuáles fueron los grados
    de sus términos que demostraron su heterogeneidad?
  choices:
  - text: 5, 3 y 0
    is_correct: true
  - text: 3, 2 y 1
    is_correct: false
  - text: 4, 4 y 4
    is_correct: false
  - text: 7, -4 y 9
    is_correct: false
  explanation: La alternativa correcta es '5, 3 y 0'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el grado absoluto de cada término individual.'
- 'Paso 2: Comprobar si existe alguna discrepancia entre los grados calculados.'
- 'Paso 3: Si los grados difieren, declarar que el polinomio es heterogéneo.'
errores_correccion: '- **Error 1: Afirmar que un polinomio con términos de igual coeficiente
  es homogéneo aun cuando sus grados difieran.** **Cómo corregirlo:** La homogeneidad
  depende de los exponentes (grados), no de los coeficientes numéricos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es heterogéneo el polinomio Q(x, y) = 2x^4y - 3x^2y^2 + 5x?
  alternativas:
  - Sí, porque sus términos tienen grados 5, 4 y 1 respectivamente
  - No, es homogéneo
  - No, es un trinomio nulo
  - Indeterminado
  respuesta: Sí, porque sus términos tienen grados 5, 4 y 1 respectivamente
  solucion_pasos:
  - '1. Grado término 1: 4 + 1 = 5.'
  - '2. Grado término 2: 2 + 2 = 4.'
  - '3. Grado término 3: 1.'
  - 4. Como 5 != 4 != 1, es heterogéneo.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de los siguientes polinomios es heterogéneo?
  alternativas:
  - x^3 + x^2 + 1
  - x^3 + y^3
  - 2x^2y + 3xy^2
  - x^4 - y^4
  respuesta: x^3 + x^2 + 1
  solucion_pasos:
  - 1. x^3 + x^2 + 1 tiene términos de grados 3, 2 y 0 (heterogéneo).
  - 2. Los demás son homogéneos.
- titulo: ¿Es el polinomio 5x^3 - 2x + 4 un polinomio heterogéneo?
  respuesta: Sí
  solucion_pasos:
  - Sí, sus términos poseen grados absolutos 3, 1 y 0.
- titulo: ¿Puede un polinomio ser simultáneamente homogéneo y heterogéneo?
  respuesta: 'No'
  solucion_pasos:
  - No, son clasificaciones mutuamente excluyentes basadas en la igualdad o diferencia
    de sus grados.
errores_frecuentes:
- Declarar homogéneo a un polinomio heterogéneo confundiendo los coeficientes con
  los exponentes.
- Declarar que tener signos positivos y negativos alternados hace que un polinomio
  sea heterogéneo.
- Declarar la heterogeneidad basándose en el número de variables en lugar de los grados
  de los términos.
- Evaluar el grado únicamente del primer término al clasificar la homogeneidad.
- Declarar un polinomio heterogéneo con un polinomio incompleto.
afirmaciones_verdaderas:
- Un polinomio es heterogéneo si posee al menos dos términos con grados absolutos
  diferentes.
- La presencia de un término independiente no nulo junto a términos de grado positivo
  convierte al polinomio en heterogéneo.
al_terminar_debes_poder: Al terminar serás capaz de identificar un polinomio heterogéneo
  constatando la existencia de grados absolutos diferentes entre sus términos.
