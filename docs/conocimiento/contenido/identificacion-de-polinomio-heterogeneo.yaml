semantic_id: MAT.ALG.POLINOMIOS.POLINOMIO_HETEROGENEO
resumen_inicial: 'Identificación de polinomio heterogéneo: concepto y propiedades
  en Grado, ordenamiento e igualdad de polinomios.'
explicacion_simple: 'En el mundo real, los equipos suelen estar formados por personas
  de diferentes pesos y estaturas. En el álgebra, la inmensa mayoría de los polinomios
  son así: diversos y desiguales.'
explicacion_formal: "### Definición formal\n\nHeterogéneo indica variedad en el 'peso'\
  \ de los términos. Si no son todos idénticos en grado, es heterogéneo.\n\n### Desarrollo\
  \ didáctico\n\nHetero significa 'diferente' o 'desigual'. \n- Polinomio: $x^3 -\
  \ 5x^2 + 6$\n  - Vagón 1 ($x^3$): Grado 3.\n  - Vagón 2 ($-5x^2$): Grado 2.\n  -\
  \ Vagón 3 ($+6$): Grado 0.\nLos grados son 3, 2 y 0. Son diferentes. Por tanto,\
  \ es un polinomio heterogéneo.\n\nCasi todos los polinomios de una sola variable\
  \ que incluyen un término numérico suelto (independiente) son heterogéneos automáticamente,\
  \ a menos que consten *solamente* del término independiente."
definiciones_clave: '- **Identificación de polinomio heterogéneo**: Elemento fundamental
  del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Identificación de polinomio heterogéneo**:
  Reglas de notación y clasificación en grado, ordenamiento e igualdad de polinomios.'
ejemplo_guiado:
  enunciado: Identifica o calcula los elementos correspondientes a identificación
    de polinomio heterogéneo en una expresión dada.
  pasos:
  - Analizar la expresión algebraica dada.
  - Aplicar los criterios de identificación de polinomio heterogéneo.
  - Efectuar la clasificación o cálculo de grados/coeficientes según corresponda.
  - Escribir la respuesta final de forma ordenada.
