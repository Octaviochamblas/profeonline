semantic_id: MAT.ALG.POLINOMIOS.POLINOMIO_HETEROGENEO
resumen_inicial: 'Un polinomio es heterogéneo cuando sus términos monomios componentes poseen grados absolutos diferentes entre sí.'
explicacion_simple: |
  - Un polinomio es **heterogéneo** cuando **no todos sus términos tienen el mismo grado**.
  - Es el caso más común en álgebra:
    - En $P(x) = 3x^3 - 5x + 8$, los grados de sus términos son $3$, $1$ y $0$. Como son diferentes, es **heterogéneo**.
    - En $Q(x, y) = 4x^3y^2 - 5x^2y + 7$, los grados son $5$, $3$ y $0$. Como no coinciden, es **heterogéneo**.
  - Si un polinomio no es homogéneo, automáticamente es heterogéneo.

  ![Polinomio Heterogéneo](/static/img/nodos/identificacion-de-polinomio-heterogeneo-intro.svg)
explicacion_formal: |
  ### Definición formal
  Un polinomio $P(x_1, \dots, x_n) \in \mathbb{K}[x_1, \dots, x_n]$ es **heterogéneo** si y solo si su soporte no es equigradual; es decir, existen al menos dos monomios $T_i, T_j$ en su forma reducida tales que:

  $$\exists T_i, T_j \in \operatorname{supp}(P) \quad \text{con} \quad \operatorname{GA}(T_i) \neq \operatorname{GA}(T_j)$$

  ### Propiedades
  1. **Complementariedad:** La clase de polinomios heterogéneos es el complemento directo de los polinomios homogéneos dentro del anillo de polinomios.
  2. **Polinomios de una sola variable:** Todo polinomio en $\mathbb{K}[x]$ con dos o más términos irreducibles es estrictamente heterogéneo.
  3. **No escalabilidad:** En un polinomio heterogéneo, no existe un único exponente $k$ tal que $P(tx, ty) = t^k P(x, y)$.
definiciones_clave: |
  - **Polinomio heterogéneo**: Polinomio cuyos términos presentan al menos dos grados absolutos distintos.
  - **Disparidad de grados**: Condición de que $\min(\operatorname{GA}(T_i)) < \max(\operatorname{GA}(T_i))$.
  - **Componentes homogéneas**: Monomios agrupados por niveles de igual grado dentro de un polinomio heterogéneo.
propiedades_relaciones: |
  - **Descomposición canónica**: Todo polinomio heterogéneo $P$ de grado $n$ se descompone como $P = H_n + H_{n-1} + \dots + H_0$, donde cada $H_k$ es un polinomio homogéneo de grado $k$.
  - **Comportamiento asintótico**: Cuando las variables crecen indefinidamente, el comportamiento de un polinomio heterogéneo queda dominado por su componente homogénea de mayor grado.
ejemplo_guiado:
  enunciado: 'Determina si el polinomio multivariable $P(x, y) = 5x^3y^2 - 2x^2y^2 + 8xy - 3$ es homogéneo o heterogéneo justificando con los grados de cada término.'
  imagen: '/static/img/nodos/identificacion-de-polinomio-heterogeneo-ejemplos.svg'
  pasos:
    - 'Paso 1: Calculamos el grado de $5x^3y^2$: $3 + 2 = **5$**.'
    - 'Paso 2: Calculamos el grado de $-2x^2y^2$: $2 + 2 = **4$**.'
    - 'Paso 3: Calculamos el grado de $8xy$: $1 + 1 = **2$**.'
    - 'Paso 4: Calculamos el grado de $-3$: **$0$**.'
    - 'Paso 5: Comparamos los grados: $\{5, 4, 2, 0\}$. Al existir grados distintos ($5 \neq 4 \neq 2 \neq 0$), **$P(x, y)$ es heterogéneo**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la función cuadrática $f(x) = ax^2 + bx + c$ ($a, b, c \neq 0$) es un polinomio heterogéneo?'
    choices:
      - text: 'Porque sus términos tienen grados 2, 1 y 0, los cuales son distintos entre sí'
        is_correct: true
      - text: 'Porque tiene 3 coeficientes diferentes'
        is_correct: false
      - text: 'Porque su gráfica es una parábola'
        is_correct: false
      - text: 'Porque es de segundo grado'
        is_correct: false
    explanation: 'La alternativa correcta es ''Porque sus términos tienen grados 2, 1 y 0, los cuales son distintos entre sí''. Al tener términos con grados diferentes, es heterogéneo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes afirmaciones sobre polinomios heterogéneos es VERDADERA?'
    choices:
      - text: 'Basta que dos términos tengan grados absolutos diferentes para que todo el polinomio sea heterogéneo'
        is_correct: true
      - text: 'Todos los términos deben tener obligatoriamente grados diferentes'
        is_correct: false
      - text: 'No pueden contener términos independientes'
        is_correct: false
      - text: 'Son polinomios que no tienen grado'
        is_correct: false
    explanation: 'La alternativa correcta es ''Basta que dos términos tengan grados absolutos diferentes para que todo el polinomio sea heterogéneo''. La existencia de al menos un grado distinto rompe la homogeneidad.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular el grado absoluto de cada uno de los monomios del polinomio.'
  - 'Paso 2: Comparar la lista de grados obtenidos.'
  - 'Paso 3: Si se encuentra al menos una discrepancia entre los grados, clasificar como polinomio heterogéneo.'
  - 'Paso 4: Identificar el grado máximo como el grado global del polinomio.'
errores_correccion: |
  - **Error 1:** Asumir que en un polinomio heterogéneo todos los términos deben tener grados distintos. **Cómo corregirlo:** Pueden existir términos con igual grado (ej. $x^2y + xy^2 + x$ tiene grados 3, 3, 1), y **sigue siendo heterogéneo** por el grado 1.
  - **Error 2:** Creer que un polinomio heterogéneo no tiene grado definido. **Cómo corregirlo:** Su grado es el **máximo grado absoluto** de sus monomios.
ejemplos:
  - titulo: 'Polinomio heterogéneo en dos variables'
    enunciado: '¿Es $P(x, y) = 3x^4y - 2x^2y^2 + 5$ un polinomio heterogéneo?'
    alternativas:
      - 'Sí, sus términos tienen grados 5, 4 y 0'
      - 'No, es homogéneo'
      - 'No es un polinomio'
    respuesta: 'Sí, sus términos tienen grados 5, 4 y 0'
    solucion_pasos:
      - '1. $\operatorname{GA}(3x^4y) = 4 + 1 = 5$.'
      - '2. $\operatorname{GA}(-2x^2y^2) = 2 + 2 = 4$.'
      - '3. $\operatorname{GA}(5) = 0$.'
      - '4. Los grados son distintos $\implies$ Heterogéneo.'
  - titulo: 'Polinomio en una variable'
    enunciado: '¿Es el binomio $x^5 - x^2$ un polinomio heterogéneo?'
    alternativas:
      - 'Sí, porque sus términos tienen grados 5 y 2'
      - 'No, porque tiene una sola variable'
      - 'No, porque no tiene término independiente'
    respuesta: 'Sí, porque sus términos tienen grados 5 y 2'
    solucion_pasos:
      - '1. Grado de $x^5 = 5$.'
      - '2. Grado de $-x^2 = 2$.'
      - '3. $5 \neq 2 \implies$ Heterogéneo.'
  - titulo: 'Universalidad en polinomios de una variable'
    enunciado: '¿Son todos los polinomios de una sola variable con dos o más términos heterogéneos?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Si tuvieran el mismo grado se sumarían como términos semejantes.'
      - '2. Al tener $\ge 2$ términos no semejantes en una variable, sus grados son forzosamente distintos.'
  - titulo: 'Escalamiento en heterogéneos'
    enunciado: '¿Cumple un polinomio heterogéneo la propiedad $P(tx, ty) = t^k P(x, y)$ para una constante $k$ única?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Cada término escala con una potencia de $t$ diferente según su propio grado.'
      - '2. No se puede factorizar una potencia común $t^k$.'
errores_frecuentes:
  - 'Creer que para ser heterogéneo todos los términos deben tener grados estrictamente diferentes.'
  - 'Confundir polinomios heterogéneos con expresiones que contienen diferentes tipos de variables.'
  - 'Suponer que un polinomio heterogéneo carece de grado absoluto definido.'
  - 'Olvidar que los polinomios de una sola variable con más de un término son siempre heterogéneos.'
  - 'Clasificar un polinomio como homogéneo ignorando el grado cero de la constante independiente.'
afirmaciones_verdaderas:
  - 'Un polinomio es heterogéneo cuando sus términos poseen al menos dos grados absolutos distintos.'
  - 'Todo polinomio de una variable con dos o más términos irreducibles es estrictamente heterogéneo.'
al_terminar_debes_poder: |
  ![Resumen de Polinomio Heterogéneo](/static/img/nodos/identificacion-de-polinomio-heterogeneo-resumen.svg)

  QUÉ: Identificar y justificar la condición de heterogeneidad en polinomios analizando la discrepancia de grados entre sus términos.
  CÓMO: Calculando los grados monomios y verificando la existencia de al menos dos términos con grados desiguales ($\operatorname{GA}(T_i) \neq \operatorname{GA}(T_j)$).
