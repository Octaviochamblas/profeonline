procedimiento:
- 'Paso 1: Calcula el grado absoluto de cada término.'
- 'Paso 2: Compara los resultados.'
- 'Paso 3: En el momento en que encuentres al menos dos términos con grados diferentes,
  puedes detenerte y clasificarlo como Heterogéneo.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar identificación de polinomio heterogéneo.
ejemplos:
- titulo: Buscando la diferencia
  enunciado: Clasifica el polinomio a^2b + ab^2 - a^3b^2.
  solucion_pasos:
  - 'T1: a^2b (Grado 3).'
  - 'T2: ab^2 (Grado 3).'
  - 'T3: -a^3b^2 (Grado 5).'
  - T1 y T2 son iguales, pero T3 es diferente. Por ende, es Heterogéneo.
- titulo: Un sistema de ecuaciones requiere una lista de 'Polinomios Heterogéneos'
    para entrenar una r
  enunciado: 'Un sistema de ecuaciones requiere una lista de ''Polinomios Heterogéneos''
    para entrenar una red neuronal en reconocimiento de asimetrías. Un programador
    carga el polinomio $8x^2y^2 - 4x^3y + 2xy^3$. La red lo expulsa del entrenamiento.
    ¿Por qué el polinomio fue rechazado? (v1)


    Opciones: A) Porque todos sus términos suman exactamente grado $4$ ($2+2, 3+1,
    1+3$), convirtiéndolo en un polinomio homogéneo. · B) Porque tiene más de dos
    letras. · C) Porque falta el término con grado cero. · D) Porque los coeficientes
    son todos números pares.'
  solucion_pasos:
  - Al analizar los grados de los términos vemos que todos pesan 4. No hay asimetría
    de grados. Al ser homogéneo, incumple la regla del sistema.
  - 'Respuesta: Porque todos sus términos suman exactamente grado $4$ ($2+2, 3+1,
    1+3$), convirtiéndolo en un polinomio homogéneo.'
- titulo: 'Respecto de «Identificación de polinomio heterogéneo»: ¿Se ajusta a la
    definición esta afirm'
  enunciado: 'Respecto de «Identificación de polinomio heterogéneo»: ¿Se ajusta a
    la definición esta afirmación? «Un **Polinomio Heterogéneo** es aquel en el que
    **sus términos NO tienen el mismo grado absoluto**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un **Polinomio Heterogéneo**
    es aquel en el que **sus términos NO tienen el mismo grado absoluto**.'
- titulo: 'Respecto de «Identificación de polinomio heterogéneo»: ¿Es compatible con
    el procedimiento e'
  enunciado: 'Respecto de «Identificación de polinomio heterogéneo»: ¿Es compatible
    con el procedimiento esta afirmación? «Creer que heterogéneo significa que tiene
    letras distintas (variables diferentes). La heterogeneidad se mide en el grado
    total, no en la variedad de letras»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un **Polinomio Heterogéneo**
    es aquel en el que **sus términos NO tienen el mismo grado absoluto**.'
errores_frecuentes:
- Creer que heterogéneo significa que tiene letras distintas (variables diferentes).
  La heterogeneidad se mide en el grado total, no en la variedad de letras.
- Revisar solo los dos primeros términos, ver que coinciden, y asumir que es homogéneo
  sin revisar hasta el final.
- Cuando está compuesto por dos o más variables (letras) diferentes en su estructura.
- Cuando sus coeficientes son números fraccionarios o irracionales.
- Cuando carece de un término independiente.
afirmaciones_verdaderas:
- La notación de identificación de polinomio heterogéneo sigue las convenciones del
  lenguaje algebraico.
al_terminar_debes_ponder: Identificar y operar con conceptos relativos a identificación
