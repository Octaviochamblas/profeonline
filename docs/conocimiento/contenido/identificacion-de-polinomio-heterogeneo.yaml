semantic_id: MAT.ALG.POLINOMIOS.POLINOMIO_HETEROGENEO
resumen_inicial: 'La identificación de polinomio heterogéneo consiste en verificar que al menos dos de sus términos algebraicos componentes posean grados absolutos diferentes entre sí.'
explicacion_simple: |
  Un polinomio es **heterogéneo** si sus términos **NO tienen todos la misma "potencia total" (grado absoluto)**:
  - "Hetero" significa "diferente" o "distinto".
  - Es el caso más común en álgebra.
  - Ejemplo: En $P(x,y) = 5x^3 - 2x^2 y + 7$:
    - Término $5x^3 \implies$ Grado $3$.
    - Término $-2x^2 y \implies$ Grado $2 + 1 = 3$.
    - Término $+7 \implies$ Grado $0$.
  - Como el último término tiene grado $0$ y los anteriores grado $3$, los términos **tienen grados distintos $\implies$ es un polinomio heterogéneo**.
explicacion_formal: |
  ### Definición formal
  Un polinomio $P(x_1, \dots, x_k) = \sum_{i=1}^n M_i \in \mathbb{R}[x_1, \dots, x_k]$ es **heterogéneo** si y solo si existen al menos dos monomios constituyentes no nulos $M_i$ y $M_j$ ($i \neq j$) cuyos grados absolutos no son iguales:

  $$\exists i, j \in \{1, \dots, n\} \quad \text{tal que} \quad \operatorname{grabs}(M_i) \neq \operatorname{grabs}(M_j)$$

  ### Ruptura de la Escala de Euler
  Para un polinomio heterogéneo $P(x_1, \dots, x_k)$, no existe ninguna potencia escalar uniforme $d \in \mathbb{R}$ que satisfaga la condición de escalamiento de Euler para todo $\lambda$:

  $$P(\lambda x_1, \dots, \lambda x_k) \neq \lambda^d \cdot P(x_1, \dots, x_k)$$

  ### Síntesis didáctica
  La heterogeneidad es la propiedad estándar de las funciones polinómicas que contienen términos de grados mixtos o independientes.
definiciones_clave: |
  - **Polinomio heterogéneo**: Polinomio en el cual sus términos poseen diferentes grados absolutos entre sí.
  - **Grados mixtos**: Presencia de monomios con distintas dimensiones de potencia dentro de una misma expresión.
  - **No homogeneidad**: Ausencia de invarianza bajo escalamiento uniforme de variables.
propiedades_relaciones: |
  - **Inclusión del término independiente**: Todo polinomio que contenga términos de grado positivo y un término independiente constante no nulo ($a_0 \neq 0$) es **necesariamente heterogéneo**.
  - **Suma de homogéneos de distinto grado**: La adición de dos polinomios homogéneos de distinto grado absoluto resulta en un polinomio heterogéneo.
ejemplo_guiado:
  enunciado: 'Determina si el polinomio $P(x,y) = 4x^3 y^2 - 9x y + 2$ es homogéneo o heterogéneo justificando la respuesta mediante los grados absolutos de cada término.'
  pasos:
    - 'Paso 1: Calculamos el grado del 1.er término $4x^3 y^2$: Sumamos exponentes $3 + 2 = 5$.'
    - 'Paso 2: Calculamos el grado del 2.º término $-9x y$: Sumamos exponentes $1 + 1 = 2$.'
    - 'Paso 3: Calculamos el grado del 3.er término $+2$: Al ser constante sin letras, su grado es $0$.'
    - 'Paso 4: Comparamos los grados absolutos obtenidos: $\{5, 2, 0\}$. Al ser valores diferentes ($5 \neq 2 \neq 0$), la expresión es heterogénea.'
    - 'Conclusión: **Es un polinomio heterogéneo**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición define a un polinomio algebraico como heterogéneo?'
    choices:
      - {text: 'Tener al menos dos términos algebraicos componentes con grados absolutos diferentes', is_correct: true}
      - {text: 'Tener todos sus coeficientes numéricos con signos negativos', is_correct: false}
      - {text: 'Tener exactamente una sola variable en toda la expresión', is_correct: false}
      - {text: 'Poseer únicamente términos cuadráticos', is_correct: false}
    explanation: 'La alternativa correcta es ''Tener al menos dos términos algebraicos componentes con grados absolutos diferentes''. Definición de heterogeneidad.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la presencia de un término independiente constante no nulo ($a_0 \neq 0$) en un polinomio de grado 2 como $x^2 + 3x + 5$ lo convierte en heterogéneo?'
    choices:
      - {text: 'Porque el término constante tiene grado $0$, mientras que los otros términos tienen grado $2$ y $1$', is_correct: true}
      - {text: 'Porque el número 5 es un número primo', is_correct: false}
      - {text: 'Porque no se pueden sumar números con letras', is_correct: false}
      - {text: 'Porque la variable $x$ cambia de signo', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque el término constante tiene grado $0$, mientras que los otros términos tienen grado $2$ y $1$''. Presenta grados mixtos $2, 1, 0$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular el grado absoluto de cada monomio constituyente del polinomio.'
  - 'Paso 2: Comparar los grados absolutos resultantes.'
  - 'Paso 3: Si se encuentra al menos un par de términos con grados distintos, clasificar el polinomio como heterogéneo.'
  - 'Paso 4: En caso contrario (si todos son iguales), clasificar como homogéneo.'
errores_correccion: |
  - **Error 1:** Afirmar que un polinomio en una sola variable como $x^3 + x^2 + x$ es homogéneo porque sólo usa la letra $x$. **Cómo corregirlo:** La homogeneidad **compara los GRADOS ABSOLUTOS de los términos**, no el nombre de las letras ($3 \neq 2 \neq 1 \implies$ heterogéneo).
  - **Error 2:** Clasificar un polinomio de un solo término (monomio) como heterogéneo. **Cómo corregirlo:** Para ser heterogéneo **se requieren al menos dos términos** con grados distintos.
ejemplos:
  - titulo: 'Reconocimiento de polinomio heterogéneo'
    enunciado: '¿Es $2x^4 - 7x^2 + 3$ un polinomio heterogéneo?'
    alternativas:
      - 'Sí, sus términos tienen grados 4, 2 y 0 (diferentes)'
      - 'No, es homogéneo'
      - 'No, es un monomio'
    respuesta: 'Sí, sus términos tienen grados 4, 2 y 0 (diferentes)'
    solucion_pasos:
      - '1. Grados de los términos: $4, 2, 0$.'
      - '2. Al ser distintos, es heterogéneo.'
  - titulo: 'Heterogeneidad en polinomio de dos variables'
    enunciado: 'En la expresión $x^3 y + x y^2$, ¿es el polinomio heterogéneo?'
    alternativas:
      - 'Sí, el primer término tiene grado 4 ($3+1$) y el segundo grado 3 ($1+2$)'
      - 'No, es homogéneo de grado 5'
      - 'No, es un binomio mónico'
    respuesta: 'Sí, el primer término tiene grado 4 ($3+1$) y el segundo grado 3 ($1+2$)'
    solucion_pasos:
      - '1. Grado de $x^3 y \to 3+1=4$. Grado de $x y^2 \to 1+2=3$.'
      - '2. $4 \neq 3 \implies$ Heterogéneo.'
  - titulo: 'Suma de grados mixtos'
    enunciado: '¿Es heterogéneo cualquier polinomio ordenado completo de grado mayor o igual a 1?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, contiene potencias descendentes con grados distintos.'
  - titulo: 'Heterogeneidad por término constante'
    enunciado: '¿Convierte el término $+9$ a la expresión $x^2 + y^2 + 9$ en un polinomio heterogéneo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $x^2$ e $y^2$ tienen grado 2 y $+9$ tiene grado 0.'
errores_frecuentes:
  - 'Un polinomio es homogéneo si todas sus letras son exactamente la misma variable independientemente de sus exponentes.'
  - 'Los polinomios heterogéneos no pueden ser sumados o restados entre sí en álgebra.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Un polinomio de un solo término (monomio) se clasifica como heterogéneo si tiene más de dos variables.'
  - 'La heterogeneidad de un polinomio depende del valor de sus coeficientes numéricos.'
afirmaciones_verdaderas:
  - 'Un polinomio es heterogéneo si sus términos algebraicos presentan grados absolutos distintos.'
  - 'Todo polinomio de una variable con términos de distintos exponentes es heterogéneo.'
