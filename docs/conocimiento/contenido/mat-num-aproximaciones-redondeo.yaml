semantic_id: MAT.NUM.APROXIMACIONES.REDONDEO
resumen_inicial: 'El redondeo aproxima un número a la posición decimal $k$ eligiendo
  el valor más cercano: si la cifra siguiente es $\ge 5$ se suma 1 a la posición $k$,
  y si es $< 5$ la cifra $k$ se mantiene.'
explicacion_simple: 'Redondear un número significa buscar el número más cercano con
  la cantidad de decimales deseada. Para hacerlo, miramos la primera cifra que vamos
  a descartar: si es un 5, 6, 7, 8 o 9, le sumamos 1 a la última cifra que conservamos;
  si es 0, 1, 2, 3 o 4, dejamos esa cifra exactamente igual.'
explicacion_formal: 'Sea $x = a_0, a_1 a_2 \dots a_k a_{k+1} \dots$, la **Aproximación
  por Redondeo a la $k$-ésima posición decimal** se rige por la regla de decisión:


  $$\text{Red}(x, k) = \begin{cases} a_0, a_1 \dots a_k & \text{si } a_{k+1} < 5 \\
  a_0, a_1 \dots (a_k + 1) \cdot 10^{-k} & \text{si } a_{k+1} \ge 5 \end{cases}$$


  **Desglose del algoritmo:**

  - $a_{k+1}$: Cifra de evaluación (la primera eliminada tras el corte de precisión
  $k$).

  - Minimización del error absoluto: El redondeo garantiza que $|x - \text{Red}(x,
  k)| \le \frac{1}{2} \cdot 10^{-k}$.


  > **Complemento didáctico:** El redondeo es el método de aproximación estándar utilizado
  en el comercio, las ciencias experimentales y las calculadoras.'
definiciones_clave: '- **Aproximación por redondeo**: Método óptimo de aproximación
  que minimiza el error absoluto eligiendo la cota más cercana según si $a_{k+1} \ge
  5$ o $< 5$.'
propiedades_relaciones: '- **Criterio de minimización de error**: $|x - \text{Red}(x,k)|
  \le \frac{1}{2} \cdot 10^{-k}$.'
ejemplo_guiado:
  enunciado: Redondee a las centésimas los números $6,423$ y $6,428$.
  pasos:
  - 'Paso 1: Para $6,423$, la cifra a evaluar es la milésima ($3$). Como $3 < 5$,
    la centésima ($2$) se conserva $\implies 6,42$.'
  - 'Paso 2: Para $6,428$, la cifra a evaluar es la milésima ($8$). Como $8 \ge 5$,
    se suma 1 a la centésima ($2+1=3$) $\implies 6,43$.'
  - 'Conclusión: $6,423 \to 6,42$ y $6,428 \to 6,43$ por redondeo a las centésimas.'
checkpoints:
- placement: after_explicacion_formal
  question: En el redondeo a las décimas, ¿qué se hace si la cifra de las centésimas
    es mayor o igual a 5?
  choices:
  - text: Se le suma 1 a la cifra de las décimas
    is_correct: true
  - text: Se deja la cifra de las décimas exactamente igual
    is_correct: false
  - text: Se le resta 1 a las décimas
    is_correct: false
  - text: Se multiplica por 10
    is_correct: false
  explanation: La alternativa correcta es 'Se le suma 1 a la cifra de las décimas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 6,428 redondeado a las centésimas, ¿cuál fue
    el resultado?
  choices:
  - text: 6,43
    is_correct: true
  - text: 6,42
    is_correct: false
  - text: 6,40
    is_correct: false
  - text: 6,50
    is_correct: false
  explanation: La alternativa correcta es '6,43'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la cifra en la posición decimal de corte $k$.'
- 'Paso 2: Observar la cifra inmediatamente siguiente ($a_{k+1}$).'
- 'Paso 3: Si $a_{k+1} \ge 5$, sumar 1 a la cifra $k$. Si $a_{k+1} < 5$, mantener
  la cifra $k$ y descartar las siguientes.'
errores_correccion: '- **Error 1: Observar dos o más cifras hacia la derecha en lugar
  de solo la primera descartada.** **Cómo corregirlo:** El redondeo evalúa ÚNICAMENTE
  la cifra inmediatamente siguiente a la de corte ($a_{k+1}$).


  - **Error 2: Sumar 1 a la cifra cuando el siguiente dígito es menor que 5.** **Cómo
  corregirlo:** Si la cifra descartada es $0, 1, 2, 3$ o $4$, la cifra mantenida NO
  sufre ningún cambio.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Redondee 3,74 a las décimas.
  alternativas:
  - 3,7
  - 3,8
  - 4,0
  respuesta: 3,7
  solucion_pasos:
  - La centésima es $4 < 5 \implies 3,7$.
- titulo: Ejemplo 2
  enunciado: Redondee 8,96 a las décimas.
  alternativas:
  - 9,0
  - 8,9
  - 9,6
  respuesta: 9,0
  solucion_pasos:
  - La centésima es $6 \ge 5 \implies 8,9 + 0,1 = 9,0$.
- titulo: ¿Es el redondeo de 1,45 a la décima igual a 1,5?
  respuesta: Sí
  solucion_pasos:
  - Sí, la centésima es $5 \ge 5 \implies 1,5$.
- titulo: ¿Es 2,137 redondeado a las centésimas igual a 2,14?
  respuesta: Sí
  solucion_pasos:
  - Sí, la milésima es $7 \ge 5 \implies 2,14$.
errores_frecuentes:
- Redondear requiere examinar la suma de todos los decimales eliminados en conjunto.
- Si la primera cifra descartada es igual a 4 se debe incrementar en 1 la cifra retenida.
- El redondeo de $4,19$ a las décimas da como resultado $4,1$.
- Redondear un decimal negativo invierte las reglas y resta 10 a la parte entera.
- El redondeo entrega el mismo resultado exacto que el truncamiento en todos los casos.
afirmaciones_verdaderas:
- El redondeo incrementa en 1 la cifra $k$ si la primera cifra descartada es $\ge
  5$, y la mantiene si es $< 5$.
- Es el método de aproximación que minimiza el valor absoluto del error de aproximación.
al_terminar_debes_poder: Al terminar serás capaz de redondear cualquier número a la
  posición decimal deseada, aplicando el criterio de evaluación de la cifra posterior
  ($a_{k+1} \ge 5$ o $< 5$).
