procedimiento:
- 'Paso 1: Identifica todas las familias (grupos de términos semejantes) distintas
  que hay en el polinomio.'
- 'Paso 2: Agrupa los términos de cada familia: subráyalos del mismo color o lista
  mentalmente.'
- 'Paso 3: Reduce cada familia de forma independiente.'
- 'Paso 4: Escribe la expresión final con los resultados de cada familia, conectados
  por sus signos.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en reducción de un polinomio con diversas clases de términos.
ejemplos:
- titulo: La bodega algebraica
  enunciado: 'Reduce: 5x + 2y - 3x + y - 4.'
  solucion_pasos:
  - 'Familia x: 5x - 3x = 2x.'
  - 'Familia y: 2y + y = 3y.'
  - 'Constante: -4.'
  - 'Resultado: 2x + 3y - 4.'
- titulo: Un físico modelo la energía total de un sistema como $E = 4k^2 + 7k - 2k^2
    - 3k + 5k^2 - 2k
  enunciado: 'Un físico modelo la energía total de un sistema como $E = 4k^2 + 7k
    - 2k^2 - 3k + 5k^2 - 2k - 10$. ¿Cuál es la expresión simplificada de la energía?
    (v1)


    Opciones: A) $7k^2 + 2k - 10$ · B) $7k^2 - 2k - 10$ · C) $11k^2 - 10$ · D) $7k^2
    + 12k - 10$'
  solucion_pasos:
  - 'Familia $k^2$: $4-2+5=7k^2$. Familia $k$: $7-3-2=2k$. Constante: $-10$. Resultado:
    $7k^2+2k-10$.'
  - 'Respuesta: $7k^2 + 2k - 10$'
- titulo: 'Respecto de «Reducción de un polinomio con diversas clases de términos»:
    ¿Describe adecuadam'
  enunciado: 'Respecto de «Reducción de un polinomio con diversas clases de términos»:
    ¿Describe adecuadamente el concepto esta frase? «Cuando un polinomio contiene
    **Diversas Clases** de términos, se agrupa y reduce cada familia por separado,
    produciendo un polinomio final simplificado con uno o más términos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Cuando un polinomio contiene
    **Diversas Clases** de términos, se agrupa y reduce cada familia por separado,
    produciendo un polinomio final simplificado con uno o más términos.'
- titulo: 'Respecto de «Reducción de un polinomio con diversas clases de términos»:
    ¿Se puede aceptar e'
  enunciado: 'Respecto de «Reducción de un polinomio con diversas clases de términos»:
    ¿Se puede aceptar esta afirmación? «Mezclar los coeficientes de diferentes familias
    (ej. sumar el 3 de $3x$ con el 2 de $2y$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Cuando un polinomio contiene
    **Diversas Clases** de términos, se agrupa y reduce cada familia por separado,
    produciendo un polinomio final simplificado con uno o más términos.'
errores_frecuentes:
- Mezclar los coeficientes de diferentes familias (ej. sumar el 3 de $3x$ con el 2
  de $2y$).
- Omitir términos que son únicos en su familia (ej. ignorar el término constante $-4$).
- Todos los términos son semejantes y se reduce a $8x^6$.
- Para «Al reducir el polinomio $3x^2 + 4x - x^2 + 2x$, ¿qué familias de términos
  existen y cómo se reducen? (v1)», la respuesta correcta es Solo hay una familia
  porque todos tienen $x$.
- Para «Al reducir el polinomio $3x^2 + 4x - x^2 + 2x$, ¿qué familias de términos
  existen y cómo se reducen? (v1)», la respuesta correcta es No se pueden reducir
  porque tienen exponentes distintos.
afirmaciones_verdaderas:
- La reducción en reducción de un polinomio con diversas clases de términos conserva
  los exponentes de la parte literal.
al_terminar_debes_ponder: Operar y reducir expresiones algebraicas utilizando reducción
  de un polinomio con diversas clases de términos.
