semantic_id: MAT.ALG.REDUCCION_OPERATIVA.DIVERSAS_CLASES
resumen_inicial: 'Reducción de un polinomio con diversas clases de términos: procedimiento
  y reglas en Reducción de términos semejantes.'
explicacion_simple: Una bodega real tiene manzanas, peras y naranjas. Puedes contar
  las manzanas juntas, las peras juntas, y las naranjas juntas, pero nunca mezclas
  la cuenta. En álgebra, una expresión puede tener términos de tipo $x$, términos
  de tipo $y$ y términos de tipo $x^2$, y cada familia se reduce por separado.
explicacion_formal: '### Definición formal


  Cada grupo de semejantes se trata de forma independiente.


  ### Desarrollo didáctico


  Simplifica: $3a + 5b - a + 2b$.


  Familia $a$: $3a - a = 2a$.

  Familia $b$: $5b + 2b = 7b$.

  Resultado final: $2a + 7b$.


  Ejemplo más complejo: $4x^2 + 3x - 2x^2 + x - 5$.

  - Familia $x^2$: $4x^2 - 2x^2 = 2x^2$.

  - Familia $x$: $3x + x = 4x$.

  - Familia constante: $-5$ (única, no hay otros números solos).

  - Resultado: $2x^2 + 4x - 5$.'
definiciones_clave: '- **Reducción de un polinomio con diversas clases de términos**:
  Operación o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a reducción de un polinomio con diversas clases de términos.'
ejemplo_guiado:
