resumen_inicial: 'Dos variables $x$ e $y$ son inversamente proporcionales si al multiplicar
  una de ellas por una constante $\alpha > 0$, la otra variable queda dividida por
  ese mismo factor $\alpha$, manteniendo su producto constante: $x \cdot y = k$.'
explicacion_simple: Dos magnitudes son inversamente proporcionales cuando una aumenta
  y la otra disminuye en la misma proporción. Si duplicamos la velocidad de un viaje,
  el tiempo que tardamos en llegar se reduce exactamente a la mitad.
explicacion_formal: 'Dos variables $x, y > 0$ se definen como **Inversamente Proporcionales**
  si su producto multiplicativo es constante:


  $$x \cdot y = k \quad (k \text{ constante } > 0)$$


  **Propiedad de escala recíproca:**

  Para todo factor de escala $\alpha > 0$, si $x \to \alpha \cdot x \implies y \to
  \frac{y}{\alpha}$.'
definiciones_clave: '- **Variables inversamente proporcionales**: Magnitudes cuyo
  producto multiplicativo $x \cdot y = k$ permanece constante.'
propiedades_relaciones: '- **Variación inversa simultánea**: Al multiplicar $x$ por
  $\alpha$, $y$ se divide por $\alpha$.'
ejemplo_guiado:
  enunciado: Si $4$ trabajadores tardan $10\text{ días}$ en pintar una casa, ¿son
    el número de trabajadores y el tiempo inversamente proporcionales?
  pasos:
  - 'Paso 1: Calcular el producto inicial: $4 \cdot 10 = 40\text{ trabajador-días}$.'
  - 'Paso 2: Si duplicamos a $8$ trabajadores, tardan la mitad del tiempo ($5\text{
    días}$): $8 \cdot 5 = 40$.'
  - 'Paso 3: Verificar que el producto $k = 40$ no varía.'
  - 'Conclusión: El número de trabajadores y el tiempo son inversamente proporcionales.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición matemática caracteriza a dos variables x e y inversamente
    proporcionales?
  choices:
  - text: Su producto multiplicativo x · y es constante (x · y = k)
    is_correct: true
  - text: Su cociente y / x es constante
    is_correct: false
  - text: Su suma es siempre cero
    is_correct: false
  - text: Su diferencia es fija
    is_correct: false
  explanation: La alternativa correcta es 'Su producto multiplicativo x · y es constante
    (x · y = k)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado de los pintores, ¿qué ocurre con los días de trabajo
    si duplicamos el número de trabajadores?
  choices:
  - text: El tiempo se reduce a la mitad manteniendo el producto k = 40
    is_correct: true
  - text: El tiempo se duplica a 20 días
    is_correct: false
  - text: El tiempo permanece en 10 días
    is_correct: false
  - text: El tiempo se hace cero
    is_correct: false
  explanation: La alternativa correcta es 'El tiempo se reduce a la mitad manteniendo
    el producto k = 40'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir y reconocer variables
  inversamente proporcionales verificando la constancia de su producto $x \cdot y
  = k$.
semantic_id: MAT.NUM.PROP_INVERSA.CONCEPTO_VARIABLES
procedimiento:
- 'Paso 1: Verificar que el producto $x \cdot y = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = \frac{k}{x}$ o la hipérbola decreciente.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Aplicar la regla de tres directa multiplicando cruzado
  en un problema inverso.** **Cómo corregirlo:** En la proporción inversa se multiplican
  los datos de la misma fila ($x_1 \cdot y_1 = x_2 \cdot y_2$).


  - **Error 2: Usar el cociente $y / x$ en lugar del producto $x \cdot y$ para calcular
  $k$.** **Cómo corregirlo:** La proporcionalidad inversa conserva el PRODUCTO $k
  = x \cdot y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_INVERSA.CONCEPTO_VARIABLES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad inversa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de producto.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por producto constante x · y.
- titulo: ¿Es la gráfica de una proporción inversa una recta?
  respuesta: 'No'
  solucion_pasos:
  - No, es una curva suave llamada rama de hipérbola.
- titulo: ¿Permite la constante k = x · y resolver ecuaciones inversas?
  respuesta: Sí
  solucion_pasos:
  - Sí, despejando $y = k / x$ o $x = k / y$.
errores_frecuentes:
- Aplicar la regla de tres directa para resolver problemas cuya naturaleza es inversamente
  proporcional.
- Dividir la variable dependiente entre la independiente ($y / x$) pretendiendo obtener
  la constante de proporción inversa.
- Graficar una proporcionalidad inversa mediante una línea recta que toca el origen
  $(0,0)$.
- Declarar que si una variable disminuye al aumentar otra, siempre son inversamente
  proporcionales sin comprobar $x \cdot y = k$.
- Omitir que el producto de los datos $x_1 \cdot y_1$ debe ser igual al producto $x_2
  \cdot y_2$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son inversamente proporcionales si su producto es constante:
  $x \cdot y = k$.'
- El gráfico de una relación de proporcionalidad inversa en el primer cuadrante es
  una rama de hipérbola decreciente.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
