semantic_id: MAT.NUM.PROP_INVERSA.CONCEPTO_VARIABLES
resumen_inicial: 'Concepto de variables inversamente proporcionales: concepto y propiedades
  fundamentales en Proporcionalidad inversa.'
explicacion_simple: Imagina que debes pintar tu casa. Si lo haces solo, demorarás
  10 días. Si llamas a un amigo que trabaja igual que tú, ¡demorarán la mitad! A más
  manos, menos tiempo. Este sube y baja perfectamente coordinado es la proporción
  inversa.
explicacion_formal: 'Hablamos de **proporcionalidad inversa** cuando dos magnitudes
  numéricas están vinculadas de modo que el aumento de una provoca la disminución
  proporcional de la otra.


  Matemáticamente, si $x$ e $y$ son inversamente proporcionales, el producto entre
  ellas es constante:

  $$x \cdot y = k$$

  Si $x$ se duplica, $y$ se reduce a la mitad. Si $x$ se divide por 3, $y$ se triplica.
  Es un balancín perfecto.'
definiciones_clave: '- **Concepto de variables inversamente proporcionales**: Elemento
  central dentro del estudio de Proporcionalidad inversa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a concepto de variables inversamente proporcionales.'
