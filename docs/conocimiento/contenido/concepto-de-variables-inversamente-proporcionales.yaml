semantic_id: MAT.NUM.PROP_INVERSA.CONCEPTO_VARIABLES
resumen_inicial: 'Dos variables $x$ e $y$ son inversamente proporcionales si su producto $x \cdot y$ se mantiene constante ($k > 0$), de modo que al multiplicar una por un factor $n$, la otra se divide exactamente por ese mismo factor.'
explicacion_simple: |
  Dos cantidades son inversamente proporcionales cuando cambian en sentidos opuestos pero bajo la misma escala multiplicativa. Si duplicas la primera cantidad, la segunda se reduce a la mitad. Si triplicas la primera, la segunda se reduce a la tercera parte. La clave fundamental es que al multiplicar cada par de datos ($x \cdot y$), obtienes siempre el mismo número constante $k$. Un ejemplo clásico es la relación entre la velocidad de un auto y el tiempo que tarda en llegar a su destino.
explicacion_formal: |
  ### Definición formal
  Dos variables cuantitativas $x, y \in \mathbb{R}^+$ están en **relación de proporcionalidad inversa** si existe una constante real no nula $k > 0$ tal que para todo par de valores correspondientes $(x_i, y_i)$:
  $$x_i \cdot y_i = k \quad \iff \quad y_i = \frac{k}{x_i}$$

  ### Criterio del factor recíproco
  Si la variable independiente $x$ se multiplica por una constante $n > 0$ (pasando a $n \cdot x$), la variable dependiente $y$ responde transformándose en:
  $$y' = \frac{k}{n \cdot x} = \frac{1}{n} \cdot \left(\frac{k}{x}\right) = \frac{y}{n}$$
  demostrando que la variable dependiente queda dividida por el mismo factor $n$.

  ### Distinción con el decrecimiento aditivo
  Una relación donde una variable disminuye al aumentar otra por resta (ej: $y = 100 - x$) **NO** constituye una proporcionalidad inversa, pues el producto $x \cdot (100 - x) = 100x - x^2$ no es constante.

  ### Síntesis didáctica
  - Producto constante: $x \cdot y = k$.
  - Escalamiento recíproco: Multiplicar por $n \implies$ resultado dividido por $n$.
definiciones_clave: |
  - **Variables inversamente proporcionales**: Pareja de magnitudes cuyo producto multiplicativo $x \cdot y$ resulta en una constante fija $k$.
  - **Factor recíproco $1/n$**: Escalar inversamente proporcional por el cual disminuye una variable cuando la otra se multiplica por $n$.
  - **Relación de compensación**: Principio numérico donde el aumento de una magnitud exige la reducción proporcional de la otra.
propiedades_relaciones: |
  - **Igualdad de productos cruzados rectos**: Para cualquier par de estados $(x_1, y_1)$ y $(x_2, y_2)$, se cumple que $x_1 \cdot y_1 = x_2 \cdot y_2$.
  - **Proporción de razones inversas**: La razón entre dos valores independientes $\frac{x_1}{x_2}$ es igual a la razón invertida de sus dependientes $\frac{y_2}{y_1}$.
ejemplo_guiado:
  enunciado: 'Un grupo de $4$ trabajadores tarda $12\text{ horas}$ en pintar una casa. Determina el tiempo que tardarán $8$ trabajadores manteniendo el mismo ritmo y comprueba si las variables son inversamente proporcionales.'
  pasos:
    - 'Paso 1: Calculamos el producto constante del primer estado: $k = x_1 \cdot y_1 = 4 \cdot 12 = 48\text{ trabajador-horas}$.'
    - 'Paso 2: Observamos que la cantidad de trabajadores se duplicó ($x_2 = 8 = 2 \cdot 4$).'
    - 'Paso 3: Calculamos el nuevo tiempo dividiendo la constante entre el nuevo número de trabajadores: $y_2 = \frac{48}{8} = 6\text{ horas}$.'
    - 'Paso 4: Verificamos el nuevo producto: $8 \cdot 6 = 48$. Como el tiempo se redujo a la mitad ($12 \to 6$), las variables son **inversamente proporcionales**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ocurre con la variable dependiente $y$ si la variable independiente $x$ se triplica ($3x$) en una proporcionalidad inversa?'
    choices:
      - {text: 'La variable $y$ se divide entre 3 ($y / 3$), conservando el producto constante $k$', is_correct: true}
      - {text: 'La variable $y$ se triplica también ($3y$)', is_correct: false}
      - {text: 'La variable $y$ se resta en 3 unidades', is_correct: false}
      - {text: 'La variable $y$ se convierte en cero', is_correct: false}
    explanation: 'La alternativa correcta es ''La variable $y$ se divide entre 3 ($y / 3$), conservando el producto constante $k$''. En la proporción inversa, si $x$ se multiplica por $n$, $y$ se divide por $n$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $6$ grifos iguales llenan una piscina en $10\text{ horas}$, ¿cuántas horas tardarán $15$ grifos idénticos?'
    choices:
      - {text: '$4\text{ horas}$, pues la constante es $k = 6 \cdot 10 = 60$, y $60 \div 15 = 4$', is_correct: true}
      - {text: '$25\text{ horas}$, aplicando regla de tres directa por error', is_correct: false}
      - {text: '$1\text{ hora}$, dividiendo $15 / 10$', is_correct: false}
      - {text: '$90\text{ horas}$, multiplicando $6 \cdot 15$', is_correct: false}
    explanation: 'La alternativa correcta es ''$4\text{ horas}$, pues la constante es $k = 6 \cdot 10 = 60$, y $60 \div 15 = 4$''. $k = 60$; para 15 grifos: $y = 60 / 15 = 4\text{ h}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos variables cuantitativas $x$ e $y$ del problema.'
  - 'Paso 2: Multiplicar los valores de cada par $(x_i, y_i)$ para obtener el producto $x_i \cdot y_i$.'
  - 'Paso 3: Verificar si el producto se mantiene constante ($x \cdot y = k$).'
  - 'Paso 4: Concluir la existencia de proporcionalidad inversa y aplicar $y = \frac{k}{x}$ para resolver incógnitas.'
errores_correccion: |
  - **Error 1:** Creer que dos variables son inversamente proporcionales solo porque una aumenta y la otra disminuye (ej: la edad de una persona y sus años de vida restantes). **Cómo corregirlo:** La proporcionalidad inversa exige que **el producto $x \cdot y$ sea estrictamente constante** en todas las mediciones.
  - **Error 2:** Dividir $y$ entre $x$ en lugar de multiplicar $x \cdot y$ para verificar la constancia. **Cómo corregirlo:** La división $y / x$ corresponde a la proporción directa; la proporción inversa exige la **multiplicación $x \cdot y = k$**.
ejemplos:
  - titulo: 'Proporcionalidad inversa en velocidad y tiempo'
    enunciado: 'A $60\text{ km/h}$ un auto tarda $2\text{ horas}$ ($k=120$). A $120\text{ km/h}$ tarda $1\text{ hora}$ ($k=120$). ¿Son inversamente proporcionales?'
    alternativas:
      - 'Sí, pues $60 \cdot 2 = 120 \cdot 1 = 120$'
      - 'No, son directamente proporcionales'
      - 'No, la constante cambia'
    respuesta: 'Sí, pues $60 \cdot 2 = 120 \cdot 1 = 120$'
    solucion_pasos:
      - '1. Evaluamos $60 \cdot 2 = 120$.'
      - '2. Evaluamos $120 \cdot 1 = 120 \implies$ Proporcionalidad inversa.'
  - titulo: 'Decrecimiento restado no proporcional'
    enunciado: 'Si $y = 50 - x$, para $x=10 \implies y=40$ ($k=400$) y para $x=20 \implies y=30$ ($k=600$). ¿Es proporción inversa?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Los productos $400$ y $600$ no son iguales.'
  - titulo: 'Reparto de trabajo laboral'
    enunciado: 'Si 3 operarios hacen un trabajo en 8 días ($k=24$), ¿6 operarios lo harán en 4 días?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $6 \cdot 4 = 24$. Se duplican operarios y se reduce el tiempo a la mitad.'
  - titulo: 'Presión y volumen de un gas'
    enunciado: 'Según la Ley de Boyle, a temperatura constante, si el volumen de un gas se reduce a la mitad, ¿su presión se duplica?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Presión y volumen son inversamente proporcionales ($P \cdot V = k$).'
errores_frecuentes:
  - 'Si una variable disminuye al aumentar otra, se concluye automáticamente la existencia de proporcionalidad inversa.'
  - 'Dividir las variables en lugar de calcular su producto multiplicativo $x \cdot y$.'
  - 'Aplicar la regla de tres simple directa por error en problemas de proporción inversa.'
  - 'El producto de los pares de datos $x_1 \cdot y_1$ puede ser diferente al producto $x_2 \cdot y_2$.'
  - 'Considerar que la constante de proporcionalidad $k$ puede ser negativa en magnitudes de medida física.'
afirmaciones_verdaderas:
  - 'Dos variables $x$ e $y$ son inversamente proporcionales si y solo si su producto $x \cdot y = k$ permanece constante.'
  - 'Al multiplicar la variable independiente por $n$, la variable dependiente resulta dividida exactamente entre $n$.'
al_terminar_debes_poder: 'Identificar variables inversamente proporcionales comprobando la constancia del producto $x \cdot y = k$.'
