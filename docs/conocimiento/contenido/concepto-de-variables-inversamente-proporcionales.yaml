procedimiento:
- 'Paso 1: Identifica las dos variables del problema.'
- 'Paso 2: Comprueba si al aumentar una (ej. al doble), la otra lógicamente disminuye
  en la misma proporción (a la mitad).'
- 'Paso 3: Si esto se cumple, son variables inversamente proporcionales.'
errores_correccion: Evita confundir los datos de entrada al operar con concepto de
  variables inversamente proporcionales.
ejemplos:
- titulo: Variables de velocidad y tiempo
  enunciado: ¿Son la velocidad a la que viajas y el tiempo que demoras en llegar proporcionales?
  solucion_pasos:
  - Si viajas al doble de velocidad, te demorarás la mitad del tiempo en recorrer
    la misma distancia.
  - Como una sube y la otra baja proporcionalmente, son inversamente proporcionales.
- titulo: ¿Si una sube y la otra baja, siempre es proporción inversa?
  respuesta: 'No'
  solucion_pasos:
  - 'El peso de una vela y el tiempo que lleva encendida: a más tiempo, menos peso.
    Pero si lleva 1 hora y pesa 50g, a las 2 horas no pesará 25g (depende de cuánto
    peso inicial tenía y cuánto se consume por hora). Es una función lineal decreciente,
    no una proporción inversa.'
errores_frecuentes:
- Confundir proporción inversa con cualquier relación donde una variable disminuye
  mientras la otra aumenta (ej. restar de un total fijo).
- Intentar resolverlo con una regla de tres directa.
- Asumir que la suma es constante en lugar del producto.
afirmaciones_verdaderas:
- La propiedad de concepto de variables inversamente proporcionales preserva la consistencia
  lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren concepto de
  variables inversamente proporcionales.
