semantic_id: MAT.NUM.RAZONES_PROPORCIONES.PROP_INVERSA_CONCEPTO
resumen_inicial: Dos variables $x$ e $y$ son inversamente proporcionales si su producto es constante ($x \cdot y = k$ con $k > 0$), de modo que al multiplicar $x$ por un factor $n$, la variable $y$ se divide exactamente por el mismo factor $n$ ($y = \frac{k}{x}$).
explicacion_simple: "![Concepto de proporcionalidad inversa](/static/img/nodos/concepto-de-variables-inversamente-proporcionales-intro.svg)\n\nDos magnitudes son **inversamente proporcionales** cuando están conectadas por una multiplicación fija de sentido contrario:\n- Si una cantidad **se duplica ($\\times 2$) o triplica ($\\times 3$)**, la otra **se reduce a la mitad ($\\div 2$) o a la tercera parte ($\\div 3$)**.\n- Su producto siempre da el **mismo número constante $k$**:\n$$x \\cdot y = k \\iff y = \\frac{k}{x}$$\n- **Ejemplo clásico:** Obreros y tiempo de construcción:\n  - $2$ obreros tardan $12$ días ($2 \\cdot 12 = 24$).\n  - $4$ obreros (el doble) tardan $6$ días (la mitad, $4 \\cdot 6 = 24$).\n  - $6$ obreros (el triple) tardan $4$ días ($6 \\cdot 4 = 24$).\n- **Cuidado:** No toda relación donde 'uno sube y el otro baja' es inversa (ej: si tienes $\\$\\$100.00$0$ y gastas $\\$\\$20.00$0$, te quedan $\\$\\$80.00$0$; es una suma fija $x + y = 100.000$, no un producto fijo)."
explicacion_formal: 'Sean $x, y$ dos variables reales positivas ($x, y \in \mathbb{R}^+$). Se define que $y$ es **inversamente proporcional** a $x$ si existe una constante positiva $k \in \mathbb{R}^+$ tal que:


  $$x \cdot y = k \iff y = \frac{k}{x} \quad (\forall x > 0)$$


  **Propiedad de Escalamiento Recíproco:**

  Para cualquier factor escalar $n > 0$:

  $$f(n \cdot x) = \frac{k}{n \cdot x} = \frac{1}{n} \cdot \left(\frac{k}{x}\right) = \frac{1}{n} \cdot f(x)$$

  lo que confirma que al multiplicar el argumento por $n$, la función evalúa exactamente a su valor anterior dividido por $n$.'
definiciones_clave: '- **Proporcionalidad inversa**: Relación funcional donde el producto $x \cdot y = k$ es constante.

  - **Constante de proporcionalidad inversa ($k$)**: Producto invariante $k = x \cdot y$.

  - **Escalamiento recíproco**: Propiedad donde multiplicar $x$ por $n$ divide a $y$ por $n$.'
propiedades_relaciones: '- **Simetría**: Si $y$ es inversamente proporcional a $x$, entonces $x$ es inversamente proporcional a $y$ ($x = \frac{k}{y}$).

  - **Monotonía estrictamente decreciente**: Para $k > 0$, a mayor $x$ corresponde siempre un menor $y$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de proporcionalidad inversa](/static/img/nodos/concepto-de-variables-inversamente-proporcionales-ejemplos.svg)


    Determine si la relación entre obreros y días de trabajo ($2$ obreros = $12$ días, $4$ obreros = $6$ días, $6$ obreros = $4$ días) es inversamente proporcional, y analice si la relación entre dinero gastado y dinero sobrante de un presupuesto fijo de $\\$100.000$ lo es.'
  pasos:
  - 'Paso 1: Para los obreros: Calcular productos $2 \cdot 12 = 24$, $4 \cdot 6 = 24$, $6 \cdot 4 = 24$.'
  - 'Paso 2: Como el producto es constante ($k = 24$), sí es una relación inversamente proporcional.'
  - 'Paso 3: Para el presupuesto: Gastar $\\$20.000$ deja $\\$80.000$ ($20.000 \cdot 80.000 = 1.600.000.000$).'
  - 'Paso 4: Gastar $\\$40.000$ deja $\\$60.000$ ($40.000 \cdot 60.000 = 2.400.000.000$). Como los productos difieren, no es inversa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición matemática obligatoria para que dos variables $x$ e $y$ sean inversamente proporcionales?
  choices:
  - text: Que su producto $x \cdot y = k$ sea constante
    is_correct: true
  - text: Que su cociente $\frac{y}{x} = k$ sea constante
    is_correct: false
  - text: Que su suma $x + y = k$ sea constante
    is_correct: false
  - text: Que su resta $x - y = k$ sea constante
    is_correct: false
  explanation: La alternativa correcta es 'Que su producto $x \cdot y = k$ sea constante'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la relación entre obreros y días es inversamente proporcional?
  choices:
  - text: Porque al duplicar los obreros (de 2 a 4), los días se reducen exactamente a la mitad (de 12 a 6) con producto constante 24
    is_correct: true
  - text: Porque la suma de obreros y días siempre da 14
    is_correct: false
  - text: Porque los días disminuyen a cero
    is_correct: false
  - text: Porque los obreros son números pares
    is_correct: false
  explanation: La alternativa correcta es 'Porque al duplicar los obreros (de 2 a 4), los días se reducen exactamente a la mitad (de 12 a 6) con producto constante 24'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos variables involucradas en el problema y tabular sus pares $(x_1, y_1), (x_2, y_2)$.'
- 'Paso 2: Calcular el producto $x_i \cdot y_i$ para cada par de datos.'
- 'Paso 3: Si todos los productos dan el mismo número $k$, concluir que la relación es inversamente proporcional.'
errores_correccion: '- **Error 1: Creer que si una sube y la otra baja, automáticamente es inversa.** **Cómo corregirlo:** Se DEBE verificar que el PRODUCTO $x \cdot y$ sea estrictamente constante.

  - **Error 2: Dividir las variables como si fuera directa.** **Cómo corregirlo:** La proporcionalidad inversa se caracteriza por la MULTIPLICACIÓN constante ($x \cdot y = k$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $y$ es inversamente proporcional a $x$ con $k = 48$, ¿cuánto vale $y$ cuando $x = 6$?
  alternativas:
  - $8$
  - $288$
  - $42$
  respuesta: $8$
  solucion_pasos:
  - $y = \frac{k}{x} = \frac{48}{6} = 8$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de las siguientes relaciones describe una proporcionalidad inversa?
  alternativas:
  - Velocidad de un vehículo vs tiempo empleado en recorrer una distancia fija
  - Horas de estudio vs nota obtenida
  - Kilos de pan vs costo total
  respuesta: Velocidad de un vehículo vs tiempo empleado en recorrer una distancia fija
  solucion_pasos:
  - $v \cdot t = d$ con distancia constante $d$ es un modelo $x \cdot y = k$.
- titulo: ¿Es el producto x · y constante en una proporción inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x \cdot y = k$ es la definición formal de la proporcionalidad inversa.
  alternativas:
  - texto: Sí, el producto define la constante de proporcionalidad inversa k
    es_correcta: true
    retroalimentacion: ¡Correcto! Definición fundamental.
  - texto: No, el cociente es constante
    es_correcta: false
    retroalimentacion: Incorrecto, el cociente constante corresponde a la proporción directa.
  - texto: No, la suma es constante
    es_correcta: false
    retroalimentacion: Incorrecto, la suma constante define relaciones aditivas complementarias.
- titulo: ¿Si una variable se triplica, la otra se divide por 3 en proporción inversa?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, la variación es exactamente recíproca: $\times 3 \implies \div 3$.'
  alternativas:
  - texto: Sí, escala en el factor recíproco 1/3 para mantener el producto constante
    es_correcta: true
    retroalimentacion: ¡Correcto! Propiedad de reciprocidad.
  - texto: No, se triplica también
    es_correcta: false
    retroalimentacion: Incorrecto, eso ocurriría en proporción directa.
  - texto: No, se le resta 3
    es_correcta: false
    retroalimentacion: Incorrecto, la relación es multiplicativa.
errores_frecuentes:
- Confundir relaciones aditivas decrecientes con proporcionalidad inversa.
- Dividir en lugar de multiplicar para comprobar la constante.
- Olvidar que $x = 0$ no pertenece al dominio de la proporción inversa.
- Aplicar regla de tres directa cruzada en problemas inversos.
afirmaciones_verdaderas:
- Dos variables son inversamente proporcionales si su producto $x \cdot y$ es una constante fija $k$.
- La relación se modela algebraicamente como $y = \frac{k}{x}$.
- Al multiplicar una variable por $n$, la otra se divide por $n$.
al_terminar_debes_poder: '![Síntesis de proporcionalidad inversa](/static/img/nodos/concepto-de-variables-inversamente-proporcionales-resumen.svg)


  QUÉ: Comprender e identificar relaciones de proporcionalidad inversa entre dos variables.


  CÓMO: Verificando la constancia del producto $x \cdot y = k$ y comprobando que al multiplicar una magnitud por $n$, la otra se divida exactamente por $n$ ($y = \frac{k}{x}$).'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
