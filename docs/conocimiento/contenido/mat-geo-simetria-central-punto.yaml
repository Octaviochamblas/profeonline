procedimiento:
- 'Paso 1: Identifica el centro de simetría O y el punto P que se desea transformar.'
- 'Paso 2: Reconoce que P'' debe ubicarse de modo que O sea el punto medio exacto
  entre P y P''.'
- 'Paso 3: Calcula P'' usando la fórmula del punto medio despejada: P''=(2xO-xP, 2yO-yP).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con simetría central respecto de un punto.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de simetría central respecto de un punto para determinar
    la medida solicitada.
  alternativas:
