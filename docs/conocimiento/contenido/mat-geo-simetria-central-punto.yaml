semantic_id: MAT.GEO.SIMETRIAS.CENTRAL_PUNTO
resumen_inicial: 'Simetría central respecto de un punto: conceptos, teoremas, propiedades
  geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'En una simetría central, el punto de referencia (centro) actúa
  como un ''espejo puntual'': cada punto se refleja exactamente al otro lado, a la
  misma distancia.'
explicacion_formal: '![Simetría central respecto de un punto](/static/img/geometria/isometrias/simetria-central-punto.svg)


  ### Definición formal


  Dado un punto fijo $O$ (el centro de simetría), la simetría central transforma cada
  punto $P$ en $P''$ tal que $O$ es el punto medio de $PP'': $O=\left(\frac{x_P+x_{P''''$}}{2},\frac{y_P+y_{P''}}{2}\right)$.


  ### Desarrollo didáctico


  En la figura, el punto $O(1,1)$ es el centro de simetría. El punto $P(-2,3)$ tiene
  como imagen $P''(4,-1)$, verificándose que $O$ es exactamente el punto medio de
  $PP''$.'
definiciones_clave: '- **Simetría central respecto de un punto**: Elemento o propiedad
  fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a simetría central respecto de un punto.'
