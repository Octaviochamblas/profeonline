semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_5
resumen_inicial: "Un número es divisible por 5 si su última cifra es 0 o 5."
explicacion_simple: |
  Cuentas monedas de 5 pesos y haces montones: el total siempre termina en 0 o en 5 (5,
  10, 15, 20, 25...). Todos esos totales son múltiplos de 5. Esto te da una regla muy
  simple: si un número termina en 0 o 5, se puede dividir exactamente por 5. Con $1.485$
  se puede, pero con $1.486$ no.
explicacion_formal: |
  Para $N=10\cdot d+u$: como $10$ es divisible por $5$, el término $10\cdot d$ siempre lo
  es. La divisibilidad de $N$ por 5 depende solo de la última cifra $u$, que debe ser $0$
  o $5$ (las únicas cifras de una posición múltiplos de 5).
definiciones_clave: |
  **Cifra de las unidades**: la última cifra. Para divisibilidad por 5, debe ser $0$ o
  $5$.
propiedades_relaciones: |
  Un número que termina en 5 es impar y aun así divisible por 5; ser divisible por 5 no
  implica ser par (eso es un criterio distinto, el del 2).
ejemplo_guiado:
  enunciado: "Determina si 3.140 es divisible por 5."
  pasos:
    - "La última cifra de 3.140 es $0$."
    - "Es una de las cifras válidas (0 o 5)."
    - "Conclusión: 3.140 es divisible por 5."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuáles son las únicas cifras finales que hacen a un número divisible por 5?"
    choices:
      - {text: "0 y 5", is_correct: true}
      - {text: "Solo 5", is_correct: false}
      - {text: "0, 5 y 10", is_correct: false}
      - {text: "Cualquier cifra par", is_correct: false}
    explanation: "La correcta es 0 y 5: son las únicas cifras de una posición que son múltiplos de 5."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 928 divisible por 5?"
    choices:
      - {text: "No, termina en 8", is_correct: true}
      - {text: "Sí, termina en cifra par", is_correct: false}
      - {text: "Sí, porque es un número grande", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es No, termina en 8: la última cifra debe ser 0 o 5, y 8 no lo es."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar la última cifra (la cifra de las unidades) del número dado."
  - "Paso 2: Comprobar si esa cifra es 0 o 5."
  - "Paso 3: Si la cifra es 0 o 5, el número es divisible por 5. En caso contrario, no lo es."
errores_correccion: |
  Un error frecuente es creer que solo los números que terminan en 5 son divisibles por
  5, olvidando los que terminan en 0. Otro error es confundir este criterio con el del 2
  y pensar que un número divisible por 5 debe ser par.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determina si el número 6.275 es divisible por 5."
    alternativas:
      - "Sí, termina en 5"
      - "No, termina en cifra inválida"
      - "No se puede determinar"
    respuesta: "Sí, termina en 5"
    solucion_pasos:
      - "Identificamos la última cifra del número 6.275, que es $5$."
      - "Comprobamos si es 0 o 5. Efectivamente, es $5$."
      - "Conclusión: El número 6.275 es divisible por 5."
  - titulo: "Ejemplo 2"
    enunciado: "Determina si el número 409 es divisible por 5."
    alternativas:
      - "No, termina en 9"
      - "Sí, termina en cifra válida"
      - "No se puede determinar"
    respuesta: "No, termina en 9"
    solucion_pasos:
      - "Identificamos la última cifra de 409, que es $9$."
      - "Comprobamos si es 0 o 5. No es ninguna de las dos cifras."
      - "Conclusión: El número 409 no es divisible por 5 (al dividir por 5 sobra 4)."
  - titulo: "¿Es divisible por 5 el número 1.000.000?"
    respuesta: "Sí"
    solucion_pasos:
      - "Miramos la última cifra del número 1.000.000, que es $0$."
      - "Como termina en 0, cumple con el criterio."
      - "Conclusión: El número 1.000.000 es divisible por 5."
  - titulo: "¿Es divisible por 5 el número 343?"
    respuesta: "No"
    solucion_pasos:
      - "Miramos la última cifra de 343, que es $3$."
      - "Como 3 no es ni 0 ni 5, el número no cumple el criterio."
      - "Conclusión: 343 no es divisible por 5."
errores_frecuentes:
  - "Creer que solo los números que terminan en 5 son divisibles por 5, olvidando que los que terminan en 0 también lo son."
  - "Pensar que un número impar no puede ser divisible por 5 (los números que terminan en 5 son impares y divisibles por 5)."
  - "Confundir el criterio del 5 con el del 2 y pensar que un número divisible por 5 debe ser par."
  - "Realizar la división larga cuando solo basta con mirar el último dígito."
  - "Creer que la cantidad de dígitos influye en la divisibilidad."
al_terminar_debes_poder: |
  Determinar la divisibilidad por 5 de cualquier número observando solo su última cifra.
fuente: "Matemática 7° Básico Tomo 1 — Teoría de Números"
estado: publicado
