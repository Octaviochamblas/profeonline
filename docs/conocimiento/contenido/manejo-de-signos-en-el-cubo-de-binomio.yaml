resumen_inicial: El manejo de signos en el cubo de binomio rige la determinación del
  signo de cada uno de los cuatro términos según los signos iniciales de la suma o
  resta.
explicacion_simple: Para no equivocarte con los signos en cubos de binomios, recuerda
  que si ambos términos son positivos $(a + b)^3$ todos son positivos $(++++)$. Si
  es una resta $(a - b)^3$ alternan $(+-+-)$. Si ambos son negativos $(-a - b)^3$
  todos son negativos $(----)$.
explicacion_formal: 'Sea la expansión general del cubo de un binomio arbitrario $(s_1
  A + s_2 B)^3$ con $s_1, s_2 \in \{+1, -1\}$:


  1. **$(+A + B)^3 = A^3 + 3A^2B + 3AB^2 + B^3$** $\to$ Signos: $(+, +, +, +)$

  2. **$(+A - B)^3 = A^3 - 3A^2B + 3AB^2 - B^3$** $\to$ Signos: $(+, -, +, -)$

  3. **$(-A + B)^3 = -A^3 + 3A^2B - 3AB^2 + B^3$** $\to$ Signos: $(-, +, -, +)$

  4. **$(-A - B)^3 = -A^3 - 3A^2B - 3AB^2 - B^3$** $\to$ Signos: $(-, -, -, -)$


  > **Complemento didáctico:** La paridad de la potencia sobre el signo determina
  directamente la polaridad de cada sumando en $\mathbb{R}$.'
definiciones_clave: '- **Paridad de exponentes**: $(-) \text{ impar} = -$ y $(-) \text{
  par} = +$.

  - **Factorización del signo menos**: $(-a - b)^3 = [-(a + b)]^3 = -(a + b)^3$.'
propiedades_relaciones: '- **Negatividad global**: Al elevar $(-a - b)^3$, el factor
  $-1$ al cubo resulta $-1$, haciendo negativos los cuatro términos.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(-x - 2)^3$ factorizando el signo menos y verifique
    que los cuatro términos son negativos.
  pasos:
  - 'Paso 1: Factorizar $-1$: $(-x - 2)^3 = [-(x + 2)]^3 = (-1)^3 \cdot (x + 2)^3
    = -(x + 2)^3$.'
  - 'Paso 2: Desarrollar el cubo suma interno: $(x + 2)^3 = x^3 + 6x^2 + 12x + 8$.'
  - 'Paso 3: Distribuir el signo menos exterior: $-(x^3 + 6x^2 + 12x + 8) = -x^3 -
    6x^2 - 12x - 8$.'
  - 'Conclusión: El desarrollo completo tiene los cuatro términos negativos: $-x^3
    - 6x^2 - 12x - 8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los signos de los cuatro términos al desarrollar $(-A - B)^3$?
  choices:
  - text: 'Todos negativos: ($-,-,-,-$)'
    is_correct: true
  - text: 'Alternados: ($+,-,+,-$)'
    is_correct: false
  - text: 'Todos positivos: ($+,+,+,+$)'
    is_correct: false
  - text: Dos positivos y dos negativos
    is_correct: false
  explanation: 'La alternativa correcta es ''Todos negativos: ($-,-,-,-$)''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de $(-x - 2)^3$, ¿por qué la distribución de signo convirtió
    todos los términos a negativos?
  choices:
  - text: Porque $(-1)^3 = -1$, multiplicando por $-1$ la suma completa $(x + 2)^3$
    is_correct: true
  - text: Porque se cancelaron las potencias pares
    is_correct: false
  - text: Por la ley del inverso aditivo
    is_correct: false
  - text: Por convención arbitraria
    is_correct: false
  explanation: La alternativa correcta es 'Porque $(-1)^3 = -1$, multiplicando por
    $-1$ la suma completa $(x + 2)^3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los signos de cada elemento $s_1 A$ y $s_2 B$.'
- 'Paso 2: Aplicar la paridad de exponente en cada término: impar $\to$ conserva signo
  original, par $\to$ vuelve positivo.'
- 'Paso 3: Escribir el polinomio con el patrón de signos correspondiente.'
errores_correccion: '- **Error 1: Asignar signos alternados a $(-a - b)^3$ creyendo
  que es una diferencia.** **Cómo corregirlo:** La expresión $(-a - b)^3$ equivale
  a $-(a + b)^3$, por lo que TODOS sus cuatro términos son NEGATIVOS.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle el cubo de la expresión $(-m - 3)^3$.
  alternativas:
  - $-m^3 - 9m^2 - 27m - 27$
  - $-m^3 + 9m^2 - 27m + 27$
  - $m^3 + 9m^2 + 27m + 27$
  respuesta: $-m^3 - 9m^2 - 27m - 27$
  solucion_pasos:
  - '1. Factorizando signo: $-(m + 3)^3$.'
  - 2. $-(m^3 + 9m^2 + 27m + 27) = -m^3 - 9m^2 - 27m - 27$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(-2x + 1)^3$?
  alternativas:
  - $-8x^3 + 12x^2 - 6x + 1$
  - $-8x^3 - 12x^2 - 6x - 1$
  - $8x^3 - 12x^2 + 6x - 1$
  respuesta: $-8x^3 + 12x^2 - 6x + 1$
  solucion_pasos:
  - 1. $(-2x)^3 = -8x^3$.
  - 2. $3(-2x)^2(1) = +12x^2$.
  - 3. $3(-2x)(1^2) = -6x$.
  - '4. $1^3 = +1$. Resultado: $-8x^3 + 12x^2 - 6x + 1$.'
- titulo: ¿Es $(-a - b)^3 = -(a + b)^3$ una identidad algebraica válida?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-1)^3 = -1$, lo que permite extraer el signo negativo de todo el cubo.
- titulo: ¿El desarrollo de $(-x + y)^3$ produce los mismos signos que $(x - y)^3$?
  respuesta: 'No'
  solucion_pasos:
  - No, sus signos son exactamente opuestos término a término debido a la imparidad
    del cubo.
errores_frecuentes:
- Declarar que $(-a - b)^3$ es igual a $(a + b)^3$ con todos los términos positivos.
- Asignar signo positivo al primer término $-A^3$ en el cubo de una expresión con
  primer elemento negativo.
- Declarar que los signos de $(-x + y)^3$ son idénticos a los de $(x - y)^3$.
- Ignorar el signo negativo al elevar $(-1)^3$ al extraer factores.
- Declarar que la paridad del exponente no altera los signos del producto.
afirmaciones_verdaderas:
- El cubo de un binomio donde ambos términos son negativos produce un polinomio de
  cuatro términos negativos.
- La identidad $(-a - b)^3 = -(a + b)^3$ demuestra que la negación de los dos términos
  niega la expansión completa.
al_terminar_debes_poder: Al terminar serás capaz de determinar los signos exactos
  del cubo de un binomio para cualquier combinación de signos iniciales.
