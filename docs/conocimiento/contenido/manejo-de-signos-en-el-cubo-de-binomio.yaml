procedimiento:
- 'Paso 1: Si tienes demasiados negativos, puedes factorizar un $-1$ y elevarlo al
  cubo para limpiar la expresión.'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en manejo de signos en el cubo de binomio.
ejemplos:
- titulo: Inversión de orden
  enunciado: Calcula $(2 - x)^3$.
  solucion_pasos:
  - 'Aplicamos la fórmula de diferencia: $(2)^3 - 3(2)^2(x) + 3(2)(x)^2 - (x)^3$.'
  - $8 - 12x + 6x^2 - x^3$.
- titulo: Es cierto que $(a-b)^3 = -(b-a)^3$
  enunciado: '¿Es cierto que $(a-b)^3 = -(b-a)^3$?


    Opciones: A) Sí, porque la diferencia al cubo preserva el signo negativo que se
    factoriza al invertir el orden. · B) No, son exactamente iguales sin el signo
    menos. · C) Solo si $a=b$. · D) No se puede saber.'
  solucion_pasos:
  - 'Al elevar a potencia impar, el factor $-1$ sale de la potencia: $((-1)(b-a))^3
    = (-1)^3(b-a)^3 = -(b-a)^3$.'
  - 'Respuesta: Sí, porque la diferencia al cubo preserva el signo negativo que se
    factoriza al invertir el orden.'
- titulo: 'Respecto de «Manejo de signos en el cubo de binomio»: ¿Describe adecuadamente
    el concepto es'
  enunciado: 'Respecto de «Manejo de signos en el cubo de binomio»: ¿Describe adecuadamente
    el concepto esta frase? «Propiedades de signos útiles para cubos: - $(-a-b)^3
    = -(a+b)^3$ - $(a-b)^3 = -(b-a)^3$ (A diferencia del cuadrado, la asimetría se
    mantiene.)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Propiedades de signos útiles
    para cubos: - $(-a-b)^3 = -(a+b)^3$ - $(a-b)^3 = -(b-a)^3$ (A diferencia del cuadrado,
    la asimetría se mantiene.)'
- titulo: 'Respecto de «Manejo de signos en el cubo de binomio»: ¿Se puede aceptar
    esta afirmación? «Cr'
  enunciado: 'Respecto de «Manejo de signos en el cubo de binomio»: ¿Se puede aceptar
    esta afirmación? «Creer que $(a-b)^3 = (b-a)^3$ asumiendo que los cubos se comportan
    igual que los cuadrados»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Propiedades de signos útiles
    para cubos: - $(-a-b)^3 = -(a+b)^3$ - $(a-b)^3 = -(b-a)^3$ (A diferencia del cuadrado,
    la asimetría se mantiene.)'
errores_frecuentes:
- Creer que $(a-b)^3 = (b-a)^3$ asumiendo que los cubos se comportan igual que los
  cuadrados.
- No, son exactamente iguales sin el signo menos.
- Solo si $a=b$.
- Para «¿Es cierto que $(a-b)^3 = -(b-a)^3$», la respuesta correcta es No se puede
  saber.
- La afirmación «Sí, porque la diferencia al cubo preserva el signo negativo que se
  factoriza al invertir el orden» no es válida en este contenido.
