semantic_id: MAT.GEO.TRIG_CUADRANTES.ANGULO_REFERENCIA
resumen_inicial: 'Cálculo del ángulo de referencia para ángulos no agudos: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: 'Para calcular razones trigonométricas de ángulos mayores a 90°,
  conviene relacionarlos con un ángulo agudo equivalente: el ángulo de referencia,
  que siempre se mide respecto del eje x, nunca del eje y.'
explicacion_formal: '![Ángulo de referencia](/static/img/geometria/trigonometria/trigcuad-angulo-referencia.svg)


  ### Definición formal


  Si $\theta$ está en el cuadrante II, su ángulo de referencia es $\alpha=180°-\theta$.
  Si está en el cuadrante III, $\alpha=\theta-180°$. Si está en el cuadrante IV, $\alpha=360°-\theta$.
  Si está en el cuadrante I, $\alpha=\theta$.


  ### Desarrollo didáctico


  En la figura, $\theta=150°$ está en el segundo cuadrante, y su ángulo de referencia
  es $\alpha=180°-150°=30°$, medido entre el lado terminal y el semieje negativo de
  las x (el eje más cercano).'
definiciones_clave: '- **Cálculo del ángulo de referencia para ángulos no agudos**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo del ángulo de referencia para ángulos
  no agudos.'
ejemplo_guiado:
  enunciado: Para evaluar la razón o relación en cálculo del ángulo de referencia
    para ángulos no agudos, se considera un triángulo rectángulo con cateto $a = 1378\text{
    cm}$ e hipotenusa $c = 4135\text{ cm}$. Calcula el valor de la función trigonométrica.
  pasos:
  - Aplicar la definición trigonométrica de cálculo del ángulo de referencia para
    ángulos no agudos.
  - Sustituir los lados $a = 1378$ y $c = 4135$.
  - Calcular el valor exacto o aproximado de la razón.
