procedimiento:
- 'Paso 1: Determina el cuadrante en que se ubica el ángulo θ.'
- 'Paso 2: Aplica la fórmula correspondiente a ese cuadrante (180°-θ, θ-180°, 360°-θ,
  o θ mismo si está en el cuadrante I).'
- 'Paso 3: El resultado es el ángulo de referencia, siempre un ángulo agudo entre
  0° y 90°.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
