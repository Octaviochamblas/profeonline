semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.DILATACION_VERTICAL
resumen_inicial: 'La dilatación o estiramiento vertical de una función potencia $f(x) = a x^n$ ocurre cuando la magnitud del coeficiente satisface $|a| > 1$, provocando que la gráfica se cierre y crezca más empinada.'
explicacion_simple: |
  La dilatación vertical equivale a agarrar la gráfica de la función potencia de sus extremos superior e inferior y tirarla con fuerza hacia arriba y hacia abajo para estirarla. Cuando el número que multiplica a la potencia es mayor que 1 en valor absoluto (por ejemplo $a = 4$ o $a = -5$), cada altura $y$ se multiplica por ese número grande. Como consecuencia, las ramas de la gráfica se vuelven mucho más delgadas, estrechas y empinadas, pegándose más rápido al eje vertical $y$.
explicacion_formal: |
  ### Definición formal
  La **dilatación o alargamiento vertical** de la función potencia $f(x) = a x^n$ por un factor de escala $c > 1$ se define por la transformación analítica:
  $$g(x) = c \cdot f(x) = (c \cdot a) x^n \implies |c \cdot a| > 1$$

  ### Mapeo de pares ordenados y cambio de velocidad
  - Para todo punto $(x_0, y_0) \in \operatorname{Graf}(f)$, el punto dilatado correspondiente es $(x_0, c \cdot y_0) \in \operatorname{Graf}(g)$.
  - **Aceleración de Pendiente**: La derivada primera se multiplica por la constante $c > 1$: $g'(x) = c \cdot f'(x)$. Esto implica que para cualquier abscisa $x \neq 0$, la velocidad de variación de la gráfica es estrictamente mayor.

  ### Síntesis didáctica
  Efecto visual de la dilatación ($|a| > 1$):
  - La gráfica se **alarga verticalmente** y se **estrecha horizontalmente**.
  - Las ramas de la gráfica se cierran comprimiéndose hacia el eje de las ordenadas $y$.
definiciones_clave: |
  - **Dilatación vertical $|a| > 1$**: Deformación escalar donde las ordenadas de la curva se multiplican por un factor de magnitud mayor a la unidad.
  - **Alargamiento o estiramiento**: Efecto visual por el cual la gráfica crece a mayor velocidad ganando altura más rápido.
  - **Estrechamiento de ramas**: Cierre progresivo de la curva hacia la recta vertical $x = 0$.
propiedades_relaciones: |
  - **Conservación del Vértice**: El origen $(0, 0)$ permanece invariante pues $|a| \cdot 0^n = 0$.
  - **Invariancia del Dominio y Recorrido**: No altera la estructura del conjunto dominio ni la cota cero del conjunto recorrido.
ejemplo_guiado:
  enunciado: 'Compara la gráfica de la función potencia base $f(x) = x^2$ con su versión dilatada verticalmente $g(x) = 5x^2$, evaluando los puntos en $x = 1$ y $x = 2$, e interpretando el cambio de apertura.'
  pasos:
    - 'Paso 1: Para $f(x) = x^2$: $f(1) = 1$ y $f(2) = 4$. Puntos: $(1, 1)$ y $(2, 4)$.'
    - 'Paso 2: Para $g(x) = 5x^2$: $g(1) = 5(1) = 5$ y $g(2) = 5(4) = 20$. Puntos: $(1, 5)$ y $(2, 20)$.'
    - 'Paso 3: Observamos que las alturas $y$ de $g(x)$ son exactamente 5 veces mayores que las de $f(x)$ para las mismas abscisas.'
    - 'Paso 4: Conclusión: Como $|a| = 5 > 1$, la gráfica de $g(x)$ está dilatada verticalmente, siendo más estrecha y verticalizada que $f(x)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué transformación geométrica sufre la gráfica de la función potencia $f(x) = x^3$ al convertirse en $g(x) = 6x^3$?'
    choices:
      - {text: 'Sufre una dilatación vertical por un factor de 6, haciendo que su gráfica se alargue verticalmente y crezca más empinada', is_correct: true}
      - {text: 'Sufre una contracción vertical, volviéndose más ancha y achatada', is_correct: false}
      - {text: 'Se traslada 6 unidades hacia la derecha', is_correct: false}
      - {text: 'Se traslada 6 unidades hacia abajo', is_correct: false}
    explanation: 'La alternativa correcta es ''Sufre una dilatación vertical por un factor de 6, haciendo que su gráfica se alargue verticalmente y crezca más empinada''. Al ser la magnitud del coeficiente $|a| = 6 > 1$, las ordenadas se multiplican por 6.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cómo afecta la dilatación vertical dada por $a = -4$ en la función $f(x) = -4x^2$ a la forma visual de su parábola respecto a $y = -x^2$?'
    choices:
      - {text: 'La parábola se estrecha y cierra sus ramas hacia el eje vertical $y$, cayendo 4 veces más rápido hacia $-\infty$', is_correct: true}
      - {text: 'La parábola se ensancha y abre sus ramas hacia los lados', is_correct: false}
      - {text: 'La parábola desplaza su vértice a la coordenada $(0, -4)$', is_correct: false}
      - {text: 'La parábola pasa a abrir hacia arriba', is_correct: false}
    explanation: 'La alternativa correcta es ''La parábola se estrecha y cierra sus ramas hacia el eje vertical $y$, cayendo 4 veces más rápido hacia $-\infty$''. La magnitud $|a| = |-4| = 4 > 1$ produce una dilatación que estrecha la parábola.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el coeficiente multiplicativo $a$ en la función potencia $f(x) = a x^n$.'
  - 'Paso 2: Calcular el valor absoluto o magnitud del coeficiente $|a|$.'
  - 'Paso 3: Comprobar que $|a| > 1$.'
  - 'Paso 4: Declarar que la función presenta una dilatación o estiramiento vertical por un factor de $|a|$, cerrando sus ramas hacia el eje $y$.'
errores_correccion: |
  - **Error 1:** Creer que un coeficiente negativo como $a = -3$ produce contracción por ser un número menor que 1 ($-3 < 1$). **Cómo corregirlo:** La dilatación/contracción depende del **valor absoluto** $|a|$. Como $|-3| = 3 > 1$, la función sufre una **dilatación vertical** (reflejada hacia abajo).
  - **Error 2:** Confundir la dilatación vertical con una traslación vertical. **Cómo corregirlo:** La dilatación es una **multiplicación** por $a$ que cambia la inclinación de las ramas sin mover el vértice $(0, 0)$. La traslación es una **suma** que mueve el vértice a $(0, k)$.
ejemplos:
  - titulo: 'Dilatación en parábola'
    enunciado: '¿La gráfica de $f(x) = 4x^2$ es más estrecha que la de $g(x) = x^2$?'
    alternativas:
      - 'Sí, por tener $|a| = 4 > 1$'
      - 'No, es más ancha'
      - 'No, son idénticas'
    respuesta: 'Sí, por tener $|a| = 4 > 1$'
    solucion_pasos:
      - '1. Magnitud del coeficiente $|a| = 4 > 1$.'
      - '2. Presenta dilatación vertical, siendo más estrecha.'
  - titulo: 'Dilatación con coeficiente negativo'
    enunciado: '¿La función $h(x) = -8x^3$ sufre dilatación vertical?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Calculamos $|a| = |-8| = 8 > 1$, confirmando dilatación vertical.'
  - titulo: 'Invariancia del origen en dilatación'
    enunciado: '¿El punto $(0, 0)$ sigue perteneciendo a $f(x) = 10x^4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(0) = 10(0)^4 = 0$. La dilatación no desplaza el origen.'
  - titulo: 'Multiplicador de altura'
    enunciado: 'Si $f(x) = x^2$ vale 9 en $x = 3$, ¿$g(x) = 3x^2$ vale 27 en $x = 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(3) = 3(9) = 27$. La altura $y$ se triplica.'
errores_frecuentes:
  - 'La función potencia $f(x) = -4x^2$ sufre una contracción vertical porque $-4 < 1$.'
  - 'Una dilatación vertical desplaza el vértice de la función fuera del origen $(0, 0)$.'
  - 'Al dilatar verticalmente una función potencia, sus ramas se abren ensanchándose hacia los lados.'
  - 'El coeficiente $a = 2$ en $f(x) = 2x^3$ suma 2 unidades a todas las ordenadas de la curva.'
  - 'Las dilataciones verticales alteran el dominio real de las funciones potencia.'
afirmaciones_verdaderas:
  - 'La dilatación vertical de una función potencia ocurre cuando la magnitud de su coeficiente satisface $|a| > 1$, multiplicando las alturas de la gráfica por un factor $|a|$.'
  - 'Geométricamente, la dilatación vertical alarga la curva y estrecha sus ramas comprimiéndolas hacia el eje de las ordenadas $y$.'
