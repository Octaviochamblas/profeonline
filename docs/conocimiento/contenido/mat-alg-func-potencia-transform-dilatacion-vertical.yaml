semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.DILATACION_VERTICAL
resumen_inicial: 'Análisis de la dilatación vertical cuando |a| > 1: forma general
  $f(x) = a x^n$, simetría, dominio y recorrido en Traslaciones y escalas.'
explicacion_simple: Multiplicar la función por un número mayor que $1$ en valor absoluto
  "estira" la curva, haciéndola crecer más rápido en cada dirección.
explicacion_formal: '### Definición formal


  Para $f(x)=a\cdot g(x)$ con $|a|>1$, cada punto $(x_0,y_0)$ de $g$ se transforma
  en $(x_0,a\cdot y_0)$, con $|a\cdot y_0|>|y_0|$. Visualmente, la curva se "estira"
  alejándose del eje $x$ más rápido que la curva original.


  ### Desarrollo didáctico


  Comparando $g(x)=x^2$ con $f(x)=4x^2$: en $x=2$, $g(2)=4$ pero $f(2)=16$. La curva
  de $f$ alcanza valores mucho mayores para el mismo $x$, dando la apariencia de estar
  más "angosta" o dilatada verticalmente.'
definiciones_clave: '- **Análisis de la dilatación vertical cuando |a| > 1**: Función
  de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a análisis de la dilatación vertical cuando |a| > 1.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de análisis de la dilatación vertical cuando |a| > 1.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de análisis de la dilatación
    vertical cuando |a| > 1.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar análisis de la dilatación vertical cuando |a| > 1?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en traslaciones y escalas
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en traslaciones y escalas. El exponente
    n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en análisis de la dilatación vertical cuando |a| > 1?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Compara el valor absoluto del coeficiente $a$ con $1$.'
- 'Paso 2: Si $|a|>1$, reconoce que la curva se dilata verticalmente respecto a $x^n$.'
- 'Paso 3: Calcula puntos específicos para confirmar el crecimiento más rápido.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en análisis de la dilatación vertical cuando |a| > 1.
ejemplos:
- titulo: Identificación de una dilatación vertical
  enunciado: ¿Es $f(x)=6x^2$ una dilatación vertical de $g(x)=x^2$?
  solucion_pasos:
  - Se compara $|6|>1$.
  - Sí, es una dilatación vertical.
- titulo: Comparación numérica de dilatación
  enunciado: Compara $f(3)$ con $g(3)$ para $f(x)=5x^2$ y $g(x)=x^2$.
  solucion_pasos:
  - Se calcula $g(3)=9$ y $f(3)=45$.
  - $f(3)$ es $5$ veces mayor que $g(3)$, confirmando la dilatación.
- titulo: ¿Una dilatación vertical cambia la posición del vértice de $f(x)=ax^2$?
  enunciado: ¿Una dilatación vertical desplaza la posición del vértice de la curva
    básica $x^2$?
  respuesta: 'No'
  solucion_pasos:
  - El vértice permanece en el origen; solo cambia qué tan rápido crece la curva.
- titulo: ¿Toda dilatación vertical implica un coeficiente mayor que $1$ en valor
    absoluto?
  enunciado: ¿Una dilatación vertical siempre corresponde a $|a|>1$?
  respuesta: Sí
  solucion_pasos:
  - Es la condición que distingue la dilatación de la contracción vertical, donde
    $0<|a|<1$.
errores_frecuentes:
- Declarar dilatación con contracción, invirtiendo la condición sobre $|a|$.
- Suponer que la dilatación vertical desplaza el vértice de la curva.
- No comparar el valor absoluto de $a$, sino solo su signo.
- Declarar esta transformación con una traslación vertical.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  análisis de la dilatación vertical cuando |a| > 1.
