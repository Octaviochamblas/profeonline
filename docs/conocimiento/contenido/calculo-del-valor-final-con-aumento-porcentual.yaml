resumen_inicial: 'El valor final tras un aumento porcentual $p\%$ se calcula directamente
  multiplicando el valor inicial $V_i$ por el factor de crecimiento: $V_f = V_i \cdot
  \left(1 + \frac{p}{100}\right)$.'
explicacion_simple: Para encontrar el valor final que resulta de aumentar un porcentaje
  sin necesidad de hacer dos operaciones separadas, tomamos el valor inicial y lo
  multiplicamos por $(1 + p/100)$.
explicacion_formal: 'Para todo $V_i > 0$ sujeto a un incremento de $p\%$, el **Valor
  Final con Aumento $V_f$** se determina mediante el producto directo:


  $$V_f = V_i \cdot (1 + d) \quad \text{donde } d = \frac{p}{100}$$


  **Ejemplo de factor:**

  - Un recargo del $19\% \implies V_f = V_i \cdot 1,19$.'
definiciones_clave: '- **Valor final con aumento**: Producto $V_f = V_i \cdot \left(1
  + \frac{p}{100}\right)$.'
propiedades_relaciones: '- **Factor $1+d$**: Escalador directo para calcular recargos
  e incrementos.'
ejemplo_guiado:
  enunciado: Calcule el precio final de un producto de \$40.000 con un recargo del
    $15\%$.
  pasos:
  - 'Paso 1: Identificar el factor de recargo: $1 + 0,15 = 1,15$.'
  - 'Paso 2: Multiplicar $V_f = 40.000 \cdot 1,15 = 46.000$.'
  - 'Conclusión: El precio final con recargo es \$46.000.'
checkpoints:
