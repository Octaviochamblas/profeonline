  explanation: La alternativa correcta es '46.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el valor final $V_f =
  V_i \cdot (1 + d)$ tras aplicar un incremento o recargo porcentual.
semantic_id: MAT.NUM.VARIACION_PORCENTUAL.VALOR_FINAL_AUMENTO
procedimiento:
- 'Paso 1: Identificar la tasa de variación $P\%$ y determinar si es aumento ($1 +
  p$) o descuento ($1 - p$).'
- 'Paso 2: Multiplicar el valor inicial por el factor multiplicativo correspondiente.'
- 'Paso 3: Resolver numéricamente y verificar que el resultado final responda a la
  situación planteada.'
errores_correccion: '- **Error 1: Sumar o restar porcentajes sucesivos directamente
  (pensar que $-20\%$ y $-10\%$ dan $-30\%$).** **Cómo corregirlo:** Los porcentajes
  sucesivos se MULTIPLICAN por sus factores decimales ($0,80 \cdot 0,90 = 0,72 \implies
  -28\%$).


  - **Error 2: Usar el valor final como denominador al calcular la variación porcentual.**
  **Cómo corregirlo:** El denominador para el cambio relativo es SIEMPRE el valor
  inicial $V_i$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.VARIACION_PORCENTUAL.VALOR_FINAL_AUMENTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de factores de variación porcentual.
- titulo: Ejemplo 2
  enunciado: Verificación de factor multiplicativo.
  alternativas:
  - Cumple el factor
  - No cumple
  - Indeterminado
  respuesta: Cumple el factor
  solucion_pasos:
  - Demostración formal por $1 \pm p$.
- titulo: ¿Equivale el IVA en Chile a multiplicar el neto por 1,19?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $1 + 0,19 = 1,19$.
- titulo: ¿Altera el orden en que se aplican dos descuentos sucesivos el precio final?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa del producto de factores.
errores_frecuentes:
- Sumar directamente dos porcentajes de descuento sucesivos aplicados sobre un mismo
  producto.
- Utilizar el precio final como el denominador de referencia al calcular la variación
  porcentual relativa.
- Dividir por 0,19 para extraer el Impuesto al Valor Agregado (IVA) de un precio Bruto.
- Un descuento del $20\%$ seguido de un aumento del $20\%$ devuelve el producto a
  su precio original.
- Restar el número entero del porcentaje al precio sin convertirlo a su factor decimal
  $1 - d$.
afirmaciones_verdaderas:
- El aumento o descuento porcentual se calcula directamente multiplicando el valor
  inicial por el factor $(1 \pm p)$.
- Dos descuentos sucesivos del $a\%$ y $b\%$ equivalen al factor acumulado $(1 - a/100)(1
  - b/100)$.
