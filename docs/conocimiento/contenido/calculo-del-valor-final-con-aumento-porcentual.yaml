procedimiento:
- 'Paso 1: Determinar el factor multiplicativo $F = 1 + \frac{a}{100}$.'
- 'Paso 2: Si se busca el valor final, multiplicar $V_f = V_i \cdot F$.'
- 'Paso 3: Si se busca el valor original de partida, dividir $V_i = \frac{V_f}{F}$.'
ejemplo_guiado:
  enunciado: Un producto cuesta $\$36.000$ tras haber sufrido un aumento del $20\%$.
    ¿Cuál era su precio original antes del alza?
  pasos:
  - 'Paso 1: Identificar el precio final $V_f = 36.000$ y la tasa de aumento $a =
    20\%$.'
  - 'Paso 2: Determinar el factor de aumento: $F = 1 + 0,20 = 1,20$.'
  - 'Paso 3: Aplicar la fórmula inversa dividiendo por el factor: $V_i = \frac{36.000}{1,20}$.'
  - 'Paso 4: Resolver la división: $\frac{36.000}{1,20} = 30.000$.'
  - 'Conclusión: El precio original antes del aumento era de $\$30.000$.'
  imagen: /static/img/nodos/calculo-del-valor-final-con-aumento-porcentual-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: 'Para calcular el valor inicial a partir de un valor final que aumentó
    un $15\%$, se debe:'
  choices:
  - text: Dividir el valor final por $1,15$
    is_correct: true
  - text: Multiplicar el valor final por $0,85$
    is_correct: false
  - text: Restar el $15\%$ al valor final
    is_correct: false
  - text: Multiplicar el valor final por $1,15$
    is_correct: false
  explanation: 'El cálculo inverso exige dividir por el factor de crecimiento: $V_i
    = \frac{V_f}{1,15}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un servicio cuesta $\$44.000$ con un recargo del $10\%$. ¿Cuál era el costo
    sin recargo?
  choices:
  - text: $\$40.000$
    is_correct: true
  - text: $\$39.600$
    is_correct: false
  - text: $\$40.400$
    is_correct: false
  - text: $\$42.000$
    is_correct: false
  explanation: $V_i = \frac{44.000}{1,10} = 40.000$ pesos.
  reinforcement_section: Ejemplo guiado
errores_correccion: '- **Error 1: Restar el porcentaje al valor final para volver
  al original (ej: $36.000 - 20\% = 28.800$).** **Cómo corregirlo:** El $20\%$ de
  $36.000$ es mayor que el $20\%$ de $30.000$. La única operación exacta es dividir
  por $1,20$.

  - **Error 2: Multiplicar por $0,a$ al buscar el valor final.** **Cómo corregirlo:**
  Recordar que $1 + a_{\text{dec}}$ incluye la base del 100%.'
ejemplos:
- titulo: Aumento salarial programado
  enunciado: Un sueldo de $\$600.000$ recibe un incremento del $8\%$. ¿Cuál es el nuevo
    monto líquido?
  alternativas:
  - $\$648.000$
  - $\$608.000$
  - $\$650.000$
  - $\$640.000$
  respuesta: $\$648.000$
  solucion_pasos:
  - 'Factor de aumento: $1 + 0,08 = 1,08$.'
  - 'Multiplicar: $V_f = 600.000 \cdot 1,08 = 648.000$ pesos.'
- titulo: Recuperar valor previo al reajuste
  enunciado: Una cuenta de $\$77.000$ incluye un reajuste por mora del $10\%$. ¿Cuál
    era el valor antes del recargo?
  alternativas:
  - $\$70.000$
  - $\$69.300$
  - $\$67.000$
  - $\$72.000$
  respuesta: $\$70.000$
  solucion_pasos:
  - 'Dividir por el factor: $V_i = \frac{77.000}{1,10} = 70.000$ pesos.'
- titulo: ¿Si una cantidad sube 50%, para volver a la base se debe dividir por 1,5?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $V_i = \frac{V_f}{1,50}$ revierte algebraicamente la multiplicación
    por $1,50$.
- titulo: ¿Restar el 20% a un valor incrementado en 20% devuelve el valor original?
  respuesta: 'No'
  solucion_pasos:
  - No, porque $1,20 \cdot 0,80 = 0,96$, dejando un valor $4\%$ inferior al original.
errores_frecuentes:
- Restar el porcentaje al valor final para recuperar el valor inicial.
- Dividir por $(1 - a)$ en lugar de dividir por $(1 + a)$ para el cálculo inverso.
- Confundir el factor de aumento $1,a$ con la tasa decimal $0,a$.
afirmaciones_verdaderas:
- El valor original se recupera exactamente dividiendo el valor final entre $(1 +
  a_{\text{dec}})$.
- El factor $1 + a/100$ permite calcular el valor final en una sola multiplicación.
