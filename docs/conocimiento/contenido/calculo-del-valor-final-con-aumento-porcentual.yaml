semantic_id: MAT.NUM.VARIACION_PORCENTUAL.VALOR_FINAL_AUMENTO
estado: publicado
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES
resumen_inicial: El valor final con aumento porcentual se obtiene mediante el producto
  directo $V_f = V_i \cdot (1 + a_{\text{dec}})$, y de forma inversa, el valor inicial
  se recupera con $V_i = \frac{V_f}{1 + a_{\text{dec}}}$.
explicacion_simple: 'Para calcular directamente el valor final tras un aumento, multiplicamos
  el valor original por su factor decimal: para $+10\%$ por $1,10$; para $+25\%$ por
  $1,25$. Si conocemos el valor final con aumento y queremos saber cuánto costaba
  antes, dividimos el valor final entre ese mismo factor decimal.


  ![calculo-del-valor-final-con-aumento-porcentual](/static/img/nodos/calculo-del-valor-final-con-aumento-porcentual-intro.svg)

  '
explicacion_formal: 'Para un valor inicial $V_i$ y una tasa de aumento $a > 0$, la
  relación funcional directa e inversa entre $V_i$ y $V_f$ viene dada por:


  $$V_f = V_i \cdot \left(1 + \frac{a}{100}\right) = V_i \cdot (1 + a_{\text{dec}})$$


  $$V_i = \frac{V_f}{1 + \frac{a}{100}} = \frac{V_f}{1 + a_{\text{dec}}}$$


  Donde $(1 + a_{\text{dec}})$ es el factor de proporcionalidad directa que vincula
  ambos estados.'
definiciones_clave: '- **Cálculo directo de $V_f$**: Multiplicación del valor base
  por $(1 + a_{\text{dec}})$.

  - **Cálculo inverso de $V_i$**: División del valor incrementado por $(1 + a_{\text{dec}})$.'
propiedades_relaciones: '- **Biyección y reversibilidad**: Dividir entre $(1 + a_{\text{dec}})$
  deshace de forma exacta el aumento aplicado.

  - **Asimetría porcentual**: Para anular un aumento del $20\%$, no se debe restar
  el $20\%$ al valor final, sino dividir por $1,20$ (lo que equivale a descontar un
  $16,\overline{6}\%$).'
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/calculo-del-valor-final-con-aumento-porcentual-resumen.svg)


  QUÉ: Calcular valores finales e iniciales en situaciones de aumento porcentual.
  CÓMO: Aplicando $V_f = V_i \cdot (1 + a_{\text{dec}})$ para cálculo directo y $V_i
  = \frac{V_f}{1 + a_{\text{dec}}}$ para recuperación del valor original.'
