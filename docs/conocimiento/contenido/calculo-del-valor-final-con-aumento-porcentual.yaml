procedimiento:
- 'Paso 1: Escribe el porcentaje de aumento como un decimal (dividiendo por 100).'
- 'Paso 2: Súmale 1 entero a ese decimal. Este es tu factor multiplicador.'
- 'Paso 3: Multiplica el Valor Inicial por este factor.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del valor final
  con aumento porcentual.
ejemplos:
- titulo: Precio con IVA
  enunciado: Un monitor cuesta $100.000 neto. Si el IVA es del 19%, ¿cuál es el precio bruto
    (final)?
  solucion_pasos:
  - 'Convertimos 19% a decimal: $0.19$.'
  - 'Sumamos 1: El factor es $1.19$.'
  - 'Multiplicamos: $100.000 \cdot 1.19 = 119.000$.'
  - El precio final es $119.000.
- titulo: Ejemplo 2
  enunciado: Un producto de $30.000 sube un 12%. ¿Cuál es el precio final?
  alternativas:
  - '33.600'
  - '30.120'
  - '3.600'
  respuesta: '33.600'
  solucion_pasos:
  - 30.000 por 1,12 es igual a 33.600.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el factor multiplicador de un aumento del 7%?
  alternativas:
  - 1,07
  - 0,07
  - '7'
  respuesta: 1,07
  solucion_pasos:
  - 1 más 0,07 es igual a 1,07.
- titulo: ¿El factor multiplicador de un aumento siempre es mayor que 1?
  respuesta: Sí
  solucion_pasos:
  - Porque se está sumando una cantidad positiva al 100% original.
errores_frecuentes:
- Confundir el factor de aumento del 5% ($1.05$) con el del 50% ($1.5$).
- Multiplicar solo por $0.19$ (obteniendo el valor del impuesto y olvidando sumar el 1 inicial).
- Confundir el factor de un aumento del 5% (1,05) con el de un 50% (1,5).
- Multiplicar solo por el decimal del porcentaje, 0,19, y olvidar sumar el 1 inicial, obteniendo
  solo el valor del aumento.
- Aplicar el factor multiplicador sobre un valor que ya incluye el aumento, duplicando el
  efecto.
afirmaciones_verdaderas:
- La propiedad de cálculo del valor final con aumento porcentual preserva la consistencia
  lógica.
- El factor multiplicador para calcular el valor final tras un aumento siempre se obtiene
  sumando 1 al porcentaje en decimal.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del valor final
  con aumento porcentual.
