semantic_id: MAT.NUM.VARIACION_PORCENTUAL.VALOR_FINAL_AUMENTO
resumen_inicial: 'Cálculo del valor final con aumento porcentual: concepto y propiedades fundamentales
  en Variaciones porcentuales.'
explicacion_simple: Si trabajas en comercio, no tienes tiempo para calcular el impuesto (IVA)
  y luego sumarlo al producto a mano en la calculadora en dos pasos. Tienes que saber hacerlo
  multiplicando por un solo número mágico.
explicacion_formal: 'Profundizamos el concepto del factor de variación.

  La fórmula para hallar el Valor Final tras un aumento del $A\%$ es:


  $\text{Valor Final} = \text{Valor Inicial} \cdot \left( 1 + \frac{A}{100} \right)$


  Ese paréntesis $(1 + A/100)$ se conoce como **factor multiplicador**.

  - Si el IVA es $19\%$, el factor es $1 + 0.19 = 1.19$. Si multiplicas el precio neto por
  $1.19$, obtienes inmediatamente el precio con IVA incluido.

  - Si hay un aumento inflacionario del $4\%$, el factor es $1 + 0.04 = 1.04$. (¡Cuidado con
  poner $1.4$, eso sería un $40\%$!).'
definiciones_clave: '- **Cálculo del valor final con aumento porcentual**: Elemento central
  dentro del estudio de Variaciones porcentuales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo del valor final con aumento porcentual.'
ejemplo_guiado:
  enunciado: Un artículo cuesta $50.000 netos. Si se le aplica un aumento del 19% (IVA), calcula
    el precio final con el factor multiplicador.
  pasos:
  - 'Convierto el 19% a decimal: 0,19.'
  - 'Sumo 1 para obtener el factor multiplicador: 1 más 0,19 es igual a 1,19.'
  - 'Multiplico: 50.000 por 1,19 es igual a 59.500. Ese es el precio final.'
