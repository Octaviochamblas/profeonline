semantic_id: MAT.FUND.LOGICA_BASICA.PROPOSICION_COMPUESTA
resumen_inicial: Identificación y formalización de proposiciones compuestas formadas por la unión de proposiciones simples mediante conectivos lógicos o negación.
explicacion_simple: 'Una **proposición compuesta** (o molecular) es una afirmación construida al combinar dos o más proposiciones simples mediante palabras de enlace llamadas **conectivos lógicos** (como "y", "o", "si... entonces", "si y solo si") o al aplicar una **negación** ("no", "es falso que"). Por ejemplo, "$6$ es par **y** $6$ es múltiplo de $3$" es una proposición compuesta. Su verdad o falsedad depende directamente de los valores de verdad de las partes que la forman y del conectivo que las une.


  ![Proposición compuesta y conectivos lógicos](/static/img/nodos/proposicion-compuesta-intro.svg)

  '
explicacion_formal: '### Definición formal

  En el cálculo proposicional, una **proposición compuesta (o molecular)** es una fórmula proposicional bien formada $\Phi$ obtenida por la aplicación inductiva de al menos un conectivo u operador lógico sobre una o más proposiciones simples $p_1, p_2, \dots, p_n$:

  $$\Phi = \omega(p_1, p_2, \dots, p_n) \quad \text{donde } \omega \in \{\neg, \land, \lor, \to, \leftrightarrow, \oplus\}$$

  El valor de verdad global $v(\Phi)$ es una función determinística de los valores atómicos $v(p_i)$ evaluados a través de las tablas de verdad de los conectivos intervinientes.


  ### Desglose simbólico

  - Conectivo unario de negación: $\neg p$ ("no $p$").

  - Conectivo binario de conjunción: $p \land q$ ("$p$ y $q$").

  - Conectivo binario de disyunción inclusiva: $p \lor q$ ("$p$ o $q$").

  - Conectivo binario condicional: $p \to q$ ("si $p$, entonces $q$").

  - Conectivo binario bicondicional: $p \leftrightarrow q$ ("$p$ si y solo si $q$").


  > **Complemento didáctico:** Toda proposición que contenga al menos un operador lógico ($\neg, \land, \lor, \to, \leftrightarrow$) es por definición una proposición compuesta. La cantidad de filas en su tabla de verdad para $n$ variables atómicas distintas es exactamente $2^n$.

  '
definiciones_clave: '- **Proposición compuesta / molecular**: Estructura lógica estructurada a partir de proposiciones simples y conectivos lógicos.

  - **Conectivo lógico**: Operador formal ($\neg, \land, \lor, \to, \leftrightarrow$) que vincula o modifica proposiciones.

  - **Principio de composicionalidad veritativa**: Regla por la cual el valor de verdad del compuesto se deduce exclusivamente del valor de sus partes atómicas.

  '
propiedades_relaciones: '- **Función de verdad de orden $n$**: Una proposición compuesta con $n$ variables proposicionales independientes genera una tabla de verdad de $2^n$ combinaciones posibles.

  - **Jerarquía de operadores**: Por convención, la negación $\neg$ posee mayor precedencia que la conjunción $\land$ y la disyunción $\lor$, las cuales a su vez preceden al condicional $\to$ y bicondicional $\leftrightarrow$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de proposiciones compuestas](/static/img/nodos/proposicion-compuesta-ejemplos.svg)


    Identifica las proposiciones simples y el conectivo lógico presente en el enunciado: "Si un polígono tiene $4$ lados, entonces es un cuadrilátero".'
  pasos:
  - 'Paso 1: Identificar el antecedente simple: $p$: "Un polígono tiene $4$ lados".'
  - 'Paso 2: Identificar el consecuente simple: $q$: "El polígono es un cuadrilátero".'
  - 'Paso 3: Identificar la estructura de enlace: La construcción "Si... entonces..." corresponde al conectivo condicional ($\to$).'
  - 'Paso 4: Escribir la formalización simbólica compuesta: $p \to q$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de los siguientes enunciados representa una proposición compuesta formal?
  choices:
  - text: El número $14$ es par y es múltiplo de $7$
    is_correct: true
  - text: El número $14$ es un número natural
    is_correct: false
  - text: El triángulo tiene tres ángulos interiores
    is_correct: false
  - text: $25 > 10$
    is_correct: false
  explanation: La alternativa correcta es 'El número $14$ es par y es múltiplo de $7$'. Es una proposición compuesta que une dos afirmaciones mediante la conjunción "y" ($p \land q$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una proposición compuesta contiene $3$ variables proposicionales simples distintas ($p, q, r$), ¿cuántas filas tiene su tabla de verdad?
  choices:
  - text: $8$ filas ($2^3$)
    is_correct: true
  - text: $6$ filas
    is_correct: false
  - text: $3$ filas
    is_correct: false
  - text: $16$ filas
    is_correct: false
  explanation: La alternativa correcta es '$8$ filas ($2^3$)'. El número de combinaciones en la tabla de verdad es $2^n = 2^3 = 8$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado y aislar las oraciones atómicas o proposiciones simples componentes.'
- 'Paso 2: Asignar una variable proposicional ($p, q, r, \dots$) a cada proposición simple distinta.'
- 'Paso 3: Identificar los términos de enlace lingüísticos ("y", "o", "si... entonces", "si y solo si", "no").'
- 'Paso 4: Traducir los enlaces a sus símbolos de conectivos lógicos ($\land, \lor, \to, \leftrightarrow, \neg$) para estructurar la fórmula proposicional.'
errores_correccion: '- **Error 1:** Creer que una proposición compuesta requiere al menos dos proposiciones simples distintas. **Cómo corregirlo:** La negación de una única proposición simple (como $\neg p$: "El $3$ no es par") es por definición una proposición compuesta.

  - **Error 2:** Confundir conectores del lenguaje cotidiano con operadores lógicos en frases de relación. **Cómo corregirlo:** En "El punto $A$ y el punto $B$ determinan una recta", la "y" une objetos geométricos en una relación atómica simple indivisible.

  '
ejemplos:
- titulo: Conjunción lógica de dos afirmaciones
  enunciado: ¿Es "$10 > 5$ y $10 < 20$" una proposición compuesta?
  alternativas:
  - Sí, es una conjunción de dos proposiciones
  - No, es una sola desigualdad doble
  - No, carece de conectivos lógicos
  respuesta: Sí, es una conjunción de dos proposiciones
  solucion_pasos:
  - '1. Proposición $p$: $10 > 5$.'
  - '2. Proposición $q$: $10 < 20$.'
  - '3. Conectivo "y": $p \land q$, constituyendo una proposición compuesta.'
- titulo: Disyunción inclusiva
  enunciado: '¿Cómo se simboliza "Llueve o hace frío" con $p$: "Llueve" y $q$: "Hace frío"?'
  alternativas:
  - $p \lor q$
  - $p \land q$
  - $p \to q$
  respuesta: $p \lor q$
  solucion_pasos:
  - 1. La palabra "o" corresponde a la disyunción inclusiva ($\lor$).
  - 2. La fórmula es $p \lor q$.
- titulo: Negación como proposición compuesta
  enunciado: ¿La expresión "No es verdad que $5 = 8$" es una proposición compuesta?
  respuesta: Sí
  solucion_pasos:
  - Sí, pues la negación $\neg$ aplicada a la proposición atómica genera una proposición compuesta.
- titulo: Bicondicional de equivalencia
  enunciado: ¿El enunciado "$x = 2$ si y solo si $2x = 4$" es una proposición compuesta?
  respuesta: Sí
  solucion_pasos:
  - Sí, contiene el conectivo bicondicional $\leftrightarrow$.
errores_frecuentes:
- La afirmación de que una proposición compuesta exige obligatoriamente la presencia de dos o más variables distintas.
- La afirmación de que el valor de verdad de una proposición compuesta es independiente del valor de sus proposiciones simples.
- La afirmación de que la tabla de verdad de una fórmula con dos variables proposicionales posee 2 filas.
- La afirmación de que la negación de una proposición simple se clasifica como una proposición simple.
- La afirmación de que los conectivos lógicos pueden operar sobre expresiones que no son proposiciones.
afirmaciones_verdaderas:
- Una proposición compuesta o molecular resulta de combinar proposiciones simples mediante uno o más conectivos lógicos ($\neg, \land, \lor, \to, \leftrightarrow$).
- El valor de verdad de una proposición compuesta queda unívocamente determinado por los valores de verdad de sus proposiciones atómicas y la tabla de verdad de sus conectivos.
al_terminar_debes_poder: '![Resumen de tabla de verdad 2ⁿ](/static/img/nodos/proposicion-compuesta-resumen.svg)


  QUÉ: Identificar, descomponer y estructurar proposiciones compuestas a partir de proposiciones simples y conectivos lógicos.

  CÓMO: Reconocer los conectores lingüísticos ($\land, \lor, \to, \leftrightarrow, \neg$), aislar las proposiciones atómicas y formular la expresión simbólica compuesta.

  '
