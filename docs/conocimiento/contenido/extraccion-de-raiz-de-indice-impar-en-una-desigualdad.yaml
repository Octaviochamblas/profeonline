semantic_id: MAT.ALG.DESIG_PROPIEDADES.RAIZ_INDICE_IMPAR
resumen_inicial: 'Extracción de raíz de índice impar en una desigualdad: relaciones
  de orden, intervalos y resolución en Propiedades de las desigualdades.'
explicacion_simple: A diferencia de las raíces de índice par, las raíces de índice
  impar se pueden aplicar a números tanto positivos como negativos. Esta operación
  siempre conserva el sentido de la desigualdad original.
explicacion_formal: '### Definición formal

  Si $a < b$ y $n$ es un número natural impar, entonces $\sqrt[n]{a} < \sqrt[n]{b}$.


  ### Desarrollo didáctico

  La función raíz de índice impar, $f(x) = \sqrt[n]{x}$ donde $n$ es impar, está definida
  para todos los números reales y es una función estrictamente creciente en todo su
  dominio. Esto garantiza que sin importar si los números involucrados son positivos
  o negativos, el orden relativo se mantendrá intacto tras aplicar la raíz.'
definiciones_clave: '- **Extracción de raíz de índice impar en una desigualdad**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a extracción de raíz de índice impar en
  una desigualdad.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de extracción de
    raíz de índice impar en una desigualdad.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de extracción de raíz de índice impar en una
    desigualdad, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
