semantic_id: MAT.ALG.DESIG_PROPIEDADES.RAIZ_INDICE_IMPAR
resumen_inicial: Extraer raíz de índice impar en ambos miembros de una desigualdad
  conserva siempre el sentido original de la desigualdad.
explicacion_simple: 'La extracción de raíces de índice impar (como la raíz cúbica
  $\sqrt[3]{x}$ o raíz quinta $\sqrt[5]{x}$) es una operación totalmente segura en
  todos los números reales.

  Si $a < b$, al extraer la raíz cúbica a ambos lados se obtiene $\sqrt[3]{a} < \sqrt[3]{b}$,
  conservando la relación de orden sin importar si los números son positivos o negativos.'
explicacion_formal: 'Para todas las constantes $a, b \in \mathbb{R}$ y cualquier índice
  impar $k = 2m + 1$ con $m \in \mathbb{N}$:


  $$a < b \iff \sqrt[2m+1]{a} < \sqrt[2m+1]{b}$$

  $$a \ge b \iff \sqrt[2m+1]{a} \ge \sqrt[2m+1]{b}$$


  **Desglose de la fórmula:**

  - La función radicación impar $f(x) = x^{1/(2m+1)}$ es estrictamente creciente y
  biyectiva en todo $\mathbb{R}$.'
definiciones_clave: '- **Radicación de índice impar**: Extracción de raíces $\sqrt[3]{},
  \sqrt[5]{}$ válidas para todo número real positivo, negativo o cero.

  - **Biyectividad continua**: Propiedad que preserva rigurosamente el orden de los
  números reales.'
propiedades_relaciones: '- **Preservación incondicional**: A diferencia de las raíces
  pares, las raíces impares NUNCA invierten el sentido de la desigualdad.'
ejemplo_guiado:
  enunciado: Dadas las desigualdades $-27 < 8$ y $8 < 125$, extrae la raíz cúbica
    (índice impar $n = 3$) en ambas y comprueba la conservación del sentido.
  pasos:
  - 'Paso 1: Extraer raíz cúbica a $-27 < 8$: $\sqrt[3]{-27} = -3$ y $\sqrt[3]{8}
    = 2 \implies -3 < 2$ (se conserva $<$).Paso 2: Extraer raíz cúbica a $8 < 125$:
    $\sqrt[3]{8} = 2$ y $\sqrt[3]{125} = 5 \implies 2 < 5$ (se conserva $<$).Paso
    3: Concluir que la radicación impar mantiene intacto el orden en todos los reales.'
checkpoints:
- placement: after_explicacion_formal
  question: Al extraer la raíz cúbica a la desigualdad $-27 < 8$, ¿cuál es la relación
    de orden obtenida?
  choices:
  - text: $-3 < 2$
    is_correct: true
  - text: $-3 > 2$
    is_correct: false
  - text: $3 < 2$
    is_correct: false
  - text: $-3 = 2$
    is_correct: false
  explanation: La alternativa correcta es '$-3 < 2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre con el sentido de la desigualdad al extraer raíces de índice
    impar en $\mathbb{R}$?
  choices:
  - text: Se mantiene inalterado sin importar el signo de los números.
    is_correct: true
  - text: Se invierte si los números son negativos.
    is_correct: false
  - text: Se transforma en una igualdad.
    is_correct: false
  - text: Solo se puede aplicar si ambos números son impares.
    is_correct: false
  explanation: La alternativa correcta es 'Se mantiene inalterado sin importar el
    signo de los números.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el índice de la raíz sea impar ($n = 3, 5, 7, \dots$).'
- 'Paso 2: Extraer la raíz a ambos miembros.'
- 'Paso 3: Mantener exactamente el mismo operador de desigualdad.'
errores_correccion: '- **Error común:** Creer que las raíces impares no se pueden
  aplicar a números negativos.

  - **Cómo corregirlo:** La raíz cúbica de un número negativo EXISTE en los números
  reales (ejemplo: $\sqrt[3]{-8} = -2$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
- Invertir el sentido de la desigualdad al sumar o restar un número negativo.
- Olvidar invertir el sentido del símbolo al multiplicar o dividir por una cantidad
  negativa.
- Extraer raíz cuadrada a términos negativos en una desigualdad de números reales.
- Tomar recíprocos en números de distinto signo invirtiendo el símbolo incorrectamente.
- Mantener el mismo símbolo al elevar al cuadrado desigualdades formadas por números
  negativos.
afirmaciones_verdaderas:
- Sumar o restar una misma cantidad en ambos miembros conserva siempre el sentido
  de la desigualdad.
- Multiplicar o dividir ambos miembros por un escalar estrictamente negativo exige
  invertir la orientación del símbolo de la desigualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar rigurosamente las
  propiedades de las desigualdades al sumar, multiplicar, dividir y tomar potencias
  o raíces.
fuente: Texto escolar MINEDUC — Álgebra / Propiedades de Desigualdades
