semantic_id: MAT.GEO.CIRCULO_RECTAS.EXTERIOR
resumen_inicial: Una recta exterior es aquella que no tiene ningún punto en común con la circunferencia, situándose a una distancia del centro mayor que el radio.
explicacion_simple: 'Imagina una pelota apoyada en el suelo y una vara larga tendida en el piso a un metro de distancia. La vara pasa de largo sin rozar ni tocar jamás a la pelota. Esa vara representa una **recta exterior**.


  En el plano, una recta es exterior cuando **no toca ni corta a la circunferencia en ningún punto** (cero puntos de contacto). La forma matemática de saberlo con total seguridad es medir la distancia más corta desde el centro de la circunferencia hasta la recta: si esa distancia ($d$) es **mayor que el radio ($r$)**, la recta queda totalmente afuera ($d > r$).


  ![Definición de recta exterior](/static/img/nodos/definicion-de-recta-exterior-a-una-circunferencia-como-recta-sin-puntos-de-interseccion-intro.svg)

  '
explicacion_formal: '### Definición geométrica conjuntista

  Sea $\mathcal{C}(O, r)$ una circunferencia en el plano euclidiano $\mathbb{R}^2$ con centro $O$ y radio $r$. Una recta coplanar $\mathcal{L}$ se define como **recta exterior** a $\mathcal{C}$ si y solo si su intersección es el conjunto vacío:

  $$\mathcal{L} \text{ es exterior a } \mathcal{C} \iff \mathcal{L} \cap \mathcal{C} = \emptyset \iff |\mathcal{L} \cap \mathcal{C}| = 0$$


  ### Criterio métrico de distancia punto-recta

  Sea $d(O, \mathcal{L}) = \min_{P \in \mathcal{L}} d(O, P)$ la distancia euclidiana perpendicular desde el centro $O$ a la recta $\mathcal{L}$:

  $$\mathcal{L} \text{ es exterior} \iff d(O, \mathcal{L}) > r$$


  ### Criterio algebraico (Discriminante del sistema)

  Al resolver analíticamente el sistema formado por la ecuación de la recta $Ax + By + C = 0$ y la circunferencia $(x - h)^2 + (y - k)^2 = r^2$, se obtiene una ecuación de segundo grado en una variable cuyo discriminante cumple estrictamente:

  $$\Delta = b^2 - 4ac < 0 \implies \text{No existen soluciones reales}$$


  > **Complemento didáctico:** Para clasificar rápidamente una recta respecto a una circunferencia en la PAES, calcula la distancia del centro a la recta ($d$) y compárala con el radio ($r$): si $d > r$, la recta es exterior (0 cortes); si $d = r$, es tangente (1 corte); y si $d < r$, es secante (2 cortes).

  '
definiciones_clave: '- **Recta exterior**: Recta que no comparte ningún punto con la circunferencia.

  - **Distancia del centro a la recta ($d$)**: Longitud del segmento perpendicular trazado desde $O$ hasta $\mathcal{L}$.

  - **Intersección vacía ($\emptyset$)**: Ausencia absoluta de puntos comunes entre dos conjuntos geométricos.

  '
propiedades_relaciones: '- **Puntos estrictamente exteriores**: Para todo punto $P \in \mathcal{L}$, se cumple $d(P, O) > r$.

  - **Fórmula de distancia punto-recta**: Con centro $(h, k)$ y recta $Ax + By + C = 0$, $d = \frac{|Ah + Bk + C|}{\sqrt{A^2 + B^2}} > r$.

  - **No delimita regiones circulares**: Al no intersecar a la circunferencia, no forma cuerdas ni sectores.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de recta exterior](/static/img/nodos/definicion-de-recta-exterior-a-una-circunferencia-como-recta-sin-puntos-de-interseccion-ejemplos.svg)


    Una circunferencia tiene centro en $O(0, 0)$ y radio $r = 5\text{ cm}$. Determina si la recta vertical de ecuación $x = 8$ es exterior a dicha circunferencia.'
  pasos:
  - 'Paso 1: Identificar el radio de la circunferencia: $r = 5\text{ cm}$.'
  - 'Paso 2: Calcular la distancia perpendicular del centro $O(0, 0)$ a la recta vertical $x = 8$: $d = |8 - 0| = 8\text{ cm}$.'
  - 'Paso 3: Comparar la distancia con el radio: $8\text{ cm} > 5\text{ cm}$, es decir, $d > r$.'
  - 'Paso 4: Concluir posición relativa: Como $d > r$, la recta no tiene puntos de intersección y es estrictamente exterior a la circunferencia.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos puntos en común tienen una recta exterior y una circunferencia?
  choices:
  - text: Cero puntos de intersección.
    is_correct: true
  - text: Un único punto de contacto.
    is_correct: false
  - text: Dos puntos de corte.
    is_correct: false
  - text: Infinitos puntos de intersección.
    is_correct: false
  explanation: La alternativa correcta es 'Cero puntos de intersección.' Por definición, una recta exterior tiene intersección vacía con la circunferencia ($\mathcal{L} \cap \mathcal{C} = \emptyset$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una circunferencia tiene radio r = 6 cm y una recta dista d = 9 cm de su centro, ¿cuál es la posición relativa de la recta?
  choices:
  - text: Es una recta exterior.
    is_correct: true
  - text: Es una recta tangente.
    is_correct: false
  - text: Es una recta secante.
    is_correct: false
  - text: Es una recta diametral.
    is_correct: false
  explanation: La alternativa correcta es 'Es una recta exterior.' Como $d = 9 > r = 6$, la recta no toca a la circunferencia.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Obtener las coordenadas del centro $O(h, k)$ y la longitud del radio $r$.

  2. Calcular la distancia perpendicular $d$ desde el centro hasta la recta.

  3. Comparar la distancia $d$ con el radio $r$.

  4. Si $d > r$, concluir que la recta es exterior (0 puntos de corte y $\Delta < 0$).

  '
errores_correccion: '- **Error común 1:** Confundir recta exterior con recta tangente. **Corrección:** La tangente toca en 1 punto ($d = r$); la exterior pasa de largo sin tocar ($d > r$).

  - **Error común 2:** Olvidar aplicar el valor absoluto en la fórmula de distancia punto-recta. **Corrección:** La distancia siempre es una magnitud no negativa ($d > 0$).

  '
ejemplos:
- tipo: A
  titulo: Distancia y radio exterior
  enunciado: La distancia del centro de una circunferencia a una recta es de $11\text{ cm}$ y el radio mide $7\text{ cm}$. ¿Cómo se clasifica la recta?
  alternativas:
  - text: Recta exterior.
    is_correct: true
  - text: Recta secante.
    is_correct: false
  - text: Recta tangente.
    is_correct: false
  - text: Recta colineal.
    is_correct: false
  explicacion: Como $d = 11 > r = 7$, la recta es exterior a la circunferencia.
- tipo: B
  titulo: Intersección de recta exterior
  enunciado: ¿Puede una recta exterior intersecar a una circunferencia en algún punto real del plano?
  respuesta: 'No'
  explicacion: No. Por definición, la intersección entre una recta exterior y la circunferencia es estrictamente el conjunto vacío ($\emptyset$).
errores_frecuentes:
- '''Creer que una recta exterior toca a la circunferencia en su punto más cercano.'''
- '''Confundir la condición $d > r$ con $d < r$.'''
- '''Asumir que si la recta es exterior, el discriminante del sistema es positivo.'''
afirmaciones_verdaderas:
- '''Una recta exterior no comparte ningún punto con la circunferencia ($\mathcal{L} \cap \mathcal{C} = \emptyset$).'''
- '''La distancia del centro de la circunferencia a una recta exterior es estrictamente mayor que el radio ($d > r$).'''
- '''El sistema algebraico entre una recta exterior y una circunferencia tiene discriminante negativo ($\Delta < 0$).'''
al_terminar_debes_poder: '**QUÉ:** Identificar y clasificar rectas exteriores a una circunferencia mediante criterios métricos y algebraicos.


  **CÓMO:** Verificando las condiciones $d(O, \mathcal{L}) > r$ y $\mathcal{L} \cap \mathcal{C} = \emptyset$.


