resumen_inicial: El reconocimiento del trinomio cuadrático no mónico identifica expresiones
  de la forma $ax^2 + bx + c$, caracterizadas por un coeficiente principal $a$ distinto
  de $0$ y de $1$.
explicacion_simple: Un trinomio no mónico (o compuesto) es aquel donde el $x^2$ viene
  acompañado por un número distinto de 1, como en $6x^2 + 11x + 4$. Aquí el número
  delante del $x^2$ es $6$, lo que requiere un método especial para factorizar.
explicacion_formal: 'Un polinomio $P(x) = ax^2 + bx + c$ es un **Trinomio Cuadrático
  No Mónico (o Compuesto)** si sus coeficientes en $\mathbb{R}$ satisfacen las restricciones
  de no trivialidad:


  $$a \in \mathbb{R} \setminus \{0, 1\} \quad \text{con } b, c \in \mathbb{R}$$


  **Desglose simbólico:**

  - $a \neq 1$: Coeficiente principal no unitario.

  - $a \cdot c$: Producto clave (número de ac) que reemplaza la búsqueda simple de
  $q$.

  - $b$: Coeficiente del término lineal que representa la suma objetivo de la división
  por agrupación o amplificación.


  > **Complemento didáctico:** La presencia de $a \neq 1$ impide la búsqueda directa
  del par sobre $c$; exige considerar el producto compuesto $a \cdot c$.'
definiciones_clave: '- **Trinomio no mónico**: Polinomio de segundo grado cuyo coeficiente
  cuadrático $a \neq 1$.

  - **Producto compuesto $a \cdot c$**: Valor escalar que sustituye al término independiente
  en la búsqueda de pares.'
propiedades_relaciones: '- **Transformación por amplificación**: Al multiplicar y
  dividir por $a$, el trinomio no mónico se convierte temporalmente en un trinomio
  mónico de variable $u = ax$.'
ejemplo_guiado:
  enunciado: Determine si el polinomio $6x^2 + 11x + 4$ es un trinomio no mónico e
    identifique sus coeficientes $a, b, c$ y el producto $a \cdot c$.
  pasos:
  - 'Paso 1: Contar los términos: Posee 3 términos ($6x^2, 11x, 4$).'
  - 'Paso 2: Observar el coeficiente cuadrático $a$: $a = 6$. Como $6 \neq 1$, es
    NO mónico.'
  - 'Paso 3: Identificar los coeficientes: $a = 6$, $b = 11$, $c = 4$.'
  - 'Paso 4: Calcular el producto compuesto $a \cdot c$: $6 \cdot 4 = 24$.'
  - 'Conclusión: Es un trinomio no mónico con producto clave $a \cdot c = 24$ y suma
    $b = 11$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué caracteriza fundamentalmente a un trinomio cuadrático no mónico frente
    a uno mónico?
  choices:
  - text: Que el coeficiente del término cuadrático $a$ es distinto de $1$ y de $0$
    is_correct: true
  - text: Que tiene 4 términos en lugar de 3
    is_correct: false
  - text: Que carece de término independiente $c$
    is_correct: false
  - text: Que la variable $x$ está elevada al cubo
    is_correct: false
  explanation: La alternativa correcta es 'Que el coeficiente del término cuadrático
    $a$ es distinto de $1$ y de $0$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el trinomio no mónico $6x^2 + 11x + 4$, ¿cuál es el valor del producto
    clave $a \cdot c$?
  choices:
  - text: $24$
    is_correct: true
  - text: $11$
    is_correct: false
  - text: $10$
    is_correct: false
  - text: $44$
    is_correct: false
  explanation: La alternativa correcta es '$24$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los coeficientes $a, b, c$ del trinomio ordenado.'
- 'Paso 2: Confirmar que $a \neq 1$ para clasificarlo como trinomio no mónico.'
- 'Paso 3: Calcular el producto numérico compuesto $a \cdot c$ que servirá para la
  búsqueda del par numérico.'
errores_correccion: '- **Error 1: Buscar un par numérico que multiplique únicamente
  $c$ en un trinomio no mónico.** **Cómo corregirlo:** En trinomios con $a \neq 1$,
  el par numérico DEBE multiplicar al producto compuesto $a \cdot c$, no solo a $c$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Para el trinomio $2x^2 + 7x + 3$, identifique $a, b, c$ y el producto
    $a \cdot c$.
  alternativas:
  - $a=2, b=7, c=3$ y $a \cdot c = 6$
  - $a=1, b=7, c=3$ y $a \cdot c = 3$
  - $a=2, b=7, c=6$ y $a \cdot c = 12$
  respuesta: $a=2, b=7, c=3$ y $a \cdot c = 6$
  solucion_pasos:
  - 1. Coeficiente de $x^2$ es 2.
  - 2. $a \cdot c = 2 \cdot 3 = 6$.
- titulo: Ejemplo 2
  enunciado: ¿Es $5x^2 - 13x + 6$ un trinomio cuadrático no mónico?
  alternativas:
  - Sí, porque $a = 5 \neq 1$
  - No, porque $b$ es negativo
  - No, porque es mónico
  respuesta: Sí, porque $a = 5 \neq 1$
  solucion_pasos:
  - 1. $a = 5 \neq 1$, luego es no mónico con $a \cdot c = 30$.
- titulo: En el trinomio $3x^2 - 5x - 2$, ¿el producto clave $a \cdot c$ es igual
    a $-6$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a \cdot c = 3 \cdot (-2) = -6$.
- titulo: ¿Un trinomio cuadrático con $a = 1$ se puede clasificar como no mónico?
  respuesta: 'No'
  solucion_pasos:
  - No, si $a = 1$ es por definición un trinomio mónico simple.
errores_frecuentes:
- Intentar aplicar la búsqueda de pares sobre $c$ ignorando el coeficiente principal
  $a \neq 1$.
- Declarar que el término $a \cdot c$ se obtiene sumando $a$ con $c$ en lugar de multiplicarlos.
- Declarar que la presencia de $a \neq 1$ impide la factorización del trinomio en
  $\mathbb{R}$.
- Sustituir el producto clave $a \cdot c$ por el valor numérico del discriminante
  $b^2 - 4ac$.
- Ignorar los signos negativos de $a$ o $c$ al calcular el producto $a \cdot c$.
afirmaciones_verdaderas:
- Un trinomio no mónico tiene un coeficiente principal $a$ distinto de $1$.
- La búsqueda del par numérico en un trinomio no mónico requiere que el producto sea
  igual a $a \cdot c$.
al_terminar_debes_poder: Al terminar serás capaz de reconocer trinomios cuadráticos
  no mónicos y calcular su producto clave $a \cdot c$.
