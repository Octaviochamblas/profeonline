semantic_id: MAT.ALG.FACTOR_TRINOMIOS.RECONOCIMIENTO_COMPUESTO
resumen_inicial: El reconocimiento del trinomio cuadrático no mónico consiste en identificar expresiones de la forma $ax^2
  + bx + c$ donde el coeficiente cuadrático $a$ es distinto de 0 y 1, requiriendo métodos de amplificación o división de término
  central.
explicacion_simple: "Un **trinomio cuadrático no mónico** (ej: $3x^2 + 10x + 8$):\n- **CARACTERÍSTICAS DISTINTIVAS**:\n  1.\
  \ **Forma $ax^2 + bx + c$**: Posee tres términos de segundo, primer y cero grado.\n  2. **Coeficiente principal $a \\neq\
  \ 1$ y $a \\neq 0$**: El término $x^2$ tiene un número multiplicándolo distinto de 1 (en $3x^2 + 10x + 8$, el coeficiente\
  \ es **$a = 3$**).\n  3. **Imposibilidad de factorizar directamente por suma/producto simple**: No se pueden buscar sólo\
  \ dos números que multipliquen $8$ y sumen $10$ porque el $3$ modifica la multiplicación distributiva.\n- **Estrategia requerida**:\
  \ Se debe multiplicar $a \\cdot c$ ($3 \\cdot 8 = \\mathbf{24}$) para hallar la parejita adecuada.\n\n![Reconocimiento del\
  \ trinomio no mónico](/static/img/nodos/reconocimiento-del-trinomio-cuadratico-no-monico-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea el polinomio de segundo grado $P(x) \in \mathbb{R}[x]$. Se define como un **trinomio cuadrático no mónico** si adopta
  la forma general:


  $$P(x) = ax^2 + bx + c \quad \text{con } a, b, c \in \mathbb{R}$$


  donde satisface las restricciones de parámetro:

  - **Condición no mónica**: $a \in \mathbb{R} \setminus \{0, 1\}$.

  - **Grado cuadrático estricto**: $\operatorname{grado}(P) = 2$.


  ### Producto Clave $a \cdot c$

  En la descomposición de un trinomio no mónico en binomios $(mx + n)(px + q) = mpx^2 + (mq + np)x + nq$, se observa que:

  - Coeficiente cuadrático: $a = mp$.

  - Coeficiente constante: $c = nq$.

  - Producto de coeficientes extremos: $a \cdot c = (mp)(nq) = (mq)(np)$.

  - Coeficiente lineal: $b = mq + np$.


  Por tanto, el problema se reduce a hallar dos enteros que **multipliquen $a \cdot c$** y **sumen $b$**.


  ### Síntesis didáctica

  Reconocer la presencia de un coeficiente $a \neq 1$ alerta sobre la necesidad de multiplicar $a \cdot c$ antes de buscar
  el par numérico divisor.

  '
definiciones_clave: '- **Trinomio no mónico**: Polinomio de segundo grado $ax^2 + bx + c$ cuyo coeficiente principal $a$ es
  diferente de 1.

  - **Producto clave $a \cdot c$**: Multiplicación del coeficiente cuadrático por el constante que rige la búsqueda del par
  numérico.

  - **Método del producto $ac$**: Técnica que transforma la factorización de $ax^2+bx+c$ en un problema de agrupación de 4
  términos.

  '
propiedades_relaciones: '- **Generalización del caso mónico**: Si $a=1$, el producto $a \cdot c$ se reduce a $1 \cdot c =
  c$, coincidiendo con el método de trinomios mónicos.

  '
ejemplo_guiado:
  enunciado: Identifica los parámetros $a, b, c$ y calcula el producto clave $a \cdot c$ para el trinomio $6x^2 + 11x - 10$.
  pasos:
  - 'Paso 1: Identificamos el coeficiente del término cuadrático $x^2$: $a = \mathbf{6}$ (¡es no mónico porque $6 \neq 1$!).'
  - 'Paso 2: Identificamos el coeficiente del término lineal $x$: $b = \mathbf{11}$.'
  - 'Paso 3: Identificamos el término independiente constante: $c = \mathbf{-10}$.'
  - 'Paso 4: Calculamos el producto clave $a \cdot c$: $a \cdot c = 6 \cdot (-10) = \mathbf{-60}$.'
  - 'Conclusión: Es un trinomio no mónico con $a=6, b=11, c=-10$ y producto clave **$a \cdot c = -60$**.'
  imagen: /static/img/nodos/reconocimiento-del-trinomio-cuadratico-no-monico-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: En el trinomio no mónico $ax^2 + bx + c$, ¿cuál es la ecuación fundamental que debe satisfacer el par numérico
    $(r, s)$ para permitir la descomposición?
  choices:
  - text: El par debe multiplicar el producto de los extremos ($r \cdot s = a \cdot c$) y sumar el coeficiente lineal ($r
      + s = b$)
    is_correct: true
  - text: El par debe multiplicar $b$ y sumar $c$
    is_correct: false
  - text: El par debe multiplicar $a$ y sumar $b$
    is_correct: false
  - text: El par debe ser siempre igual a 1
    is_correct: false
  explanation: 'La alternativa correcta es ''El par debe multiplicar el producto de los extremos ($r \cdot s = a \cdot c$)
    y sumar el coeficiente lineal ($r + s = b$)''. Ecuaciones del método $ac$: $r \cdot s = ac$ y $r + s = b$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para el trinomio $2x^2 + 7x + 3$, ¿cuál es el producto clave $a \cdot c$ y el valor de $b$ que rigen la búsqueda
    del par numérico?
  choices:
  - text: El producto clave es $a \cdot c = 2 \cdot 3 = 6$ y la suma requerida es $b = 7$
    is_correct: true
  - text: El producto clave es 3 y la suma es 2
    is_correct: false
  - text: El producto clave es 14 y la suma es 3
    is_correct: false
  - text: El producto clave es 5 y la suma es 6
    is_correct: false
  explanation: La alternativa correcta es 'El producto clave es $a \cdot c = 2 \cdot 3 = 6$ y la suma requerida es $b = 7$'.
    $a \cdot c = 2 \cdot 3 = 6, b = 7$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que el trinomio sea de segundo grado $ax^2 + bx + c$.'
- 'Paso 2: Verificar que el coeficiente $a$ de $x^2$ sea distinto de 1.'
- 'Paso 3: Multiplicar el coeficiente principal $a$ por el término libre $c$ para hallar $a \cdot c$.'
- 'Paso 4: Formular las condiciones de búsqueda: multiplicar $a \cdot c$ y sumar $b$.'
errores_correccion: '- **Error 1:** Buscar dos números que multipliquen sólo $c$ ignorando el coeficiente $a$. **Cómo corregirlo:**
  En trinomios no mónicos **LOS NÚMEROS DEBEN MULTIPLICAR EL PRODUCTO $a \cdot c$, NO SÓLO EL TÉRMINO LIBRE $c$**.

  - **Error 2:** Excluir el signo negativo al calcular el producto $a \cdot c$ cuando $c < 0$. **Cómo corregirlo:** El producto
  **DEBE INCLUIR EL SIGNO DE $c$ ($6 \cdot (-10) = -60$)**.

  '
ejemplos:
- titulo: Reconocimiento de a
  enunciado: Para $5x^2 - 3x + 2$, ¿es $a = 5$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el coeficiente de $x^2$ es 5.
- titulo: Cálculo de ac
  enunciado: Para $4x^2 + 5x + 1$, ¿es el producto clave $a \cdot c = 4 \cdot 1 = 4$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $4 \cdot 1 = 4$.
- titulo: Cálculo de ac con signo negativo
  enunciado: Para $3x^2 + 2x - 8$, ¿es el producto $a \cdot c = 3 \cdot (-8) = -24$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3 \cdot (-8) = -24$.
- titulo: Condición de suma
  enunciado: En $2x^2 + 9x + 10$, ¿deben los números sumar $b = 9$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el coeficiente lineal es 9.
errores_frecuentes:
- Ignorar el coeficiente principal a tratando de buscar números que multipliquen únicamente c.
- Los signos negativos de a o c no son considerados al calcular el producto multiplicativo clave a * c.
- Intercambiar el valor del parámetro lineal b con el producto ac.
- Declarar que un trinomio no mónico puede factorizarse directamente poniendo (x + r)(x + s).
- Olvidar multiplicar a por c antes de buscar los divisores.
afirmaciones_verdaderas:
- En un trinomio no mónico $ax^2 + bx + c$, se deben hallar dos números que multipliquen $a \cdot c$ y sumen $b$.
- El coeficiente principal $a \neq 1$ impide el uso del método directo de trinomios mónicos.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/reconocimiento-del-trinomio-cuadratico-no-monico-resumen.svg)


  QUÉ: Reconocer trinomios cuadráticos no mónicos ax² + bx + c y calcular su producto clave a · c.

  CÓMO: Identificar el coeficiente principal $a \in \mathbb{R} \setminus \{0, 1\}$ y calcular el producto de los extremos
  $a \cdot c$ para formular las ecuaciones $r \cdot s = ac$ y $r + s = b$.

  '
