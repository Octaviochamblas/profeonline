semantic_id: MAT.ALG.FRACCIONES_SUMA.SIMPLIFICACION_FINAL
resumen_inicial: Una vez reducido el numerador de la suma, se debe factorizar para intentar simplificar factores comunes con
  el denominador.
explicacion_simple: 'El paso final al sumar fracciones algebraicas consiste en verificar si la respuesta se puede simplificar
  aún más.


  Después de haber reducido el numerador a un único polinomio, intentamos factorizarlo mediante factor común, diferencia de
  cuadrados o trinomios.


  Si al factorizar el numerador aparece un paréntesis igual a uno de los factores del denominador común m.c.m., los cancelamos
  para obtener la suma de fracciones irreducible.


  ![Simplificación final de una suma de fracciones](/static/img/nodos/simplificacion-final-de-una-suma-de-fracciones-algebraicas-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la fracción suma reducida $\frac{N(x)}{M(x)}$, se factoriza el numerador $N(x) = P(x) \cdot C(x)$ y el denominador
  común $M(x) = Q(x) \cdot C(x)$:


  $$\frac{N(x)}{M(x)} = \frac{P(x) \cdot C(x)}{Q(x) \cdot C(x)} = \frac{P(x)}{Q(x)} \quad \text{para } C(x) \neq 0$$


  ### Desglose de la fórmula

  - $C(x)$: Factor común emergente tras la adición entre el numerador reducido $N(x)$ y el denominador m.c.m. $M(x)$.

  - $\frac{P(x)}{Q(x)}$: Resultado final irreducible de la suma de fracciones algebraicas.


  ### Síntesis didáctica

  Factorizar el numerador final permite descubrir cancelaciones ocultas con los factores del denominador común.

  '
definiciones_clave: '- **Simplificación final de la suma**: Proceso de factorización posterior a la adición para reducir la
  fracción resultante al mínimo.

  - **Fracción suma irreducible**: Resultado de una adición algebraica que no contiene factores divisores compartidos.

  '
propiedades_relaciones: '- **Comprobación de irreductibilidad**: $\operatorname{MCD}(P(x), Q(x)) = 1$.

  - **Preservación de dominio**: Las restricciones del dominio continúan vigentes aunque se cancele el factor común final
  $C(x)$.

  '
ejemplo_guiado:
  enunciado: Resuelve la suma $\frac{x}{x^2 - 4} + \frac{2}{x^2 - 4}$, reduce el numerador, aplica la simplificación final
    y evalúa para $x = 5$.
  pasos:
  - 'Paso 1: Sumar numeradores sobre el denominador común: $\frac{x + 2}{x^2 - 4}$.'
  - 'Paso 2: Factorizar el denominador $x^2 - 4 = (x - 2)(x + 2)$.'
  - 'Paso 3: Expresar la fracción: $\frac{x + 2}{(x - 2)(x + 2)}$.'
  - 'Paso 4: Cancelar el factor común $(x + 2)$ en numerador y denominador: $\frac{1}{x - 2}$ para $x \notin \{-2, 2\}$.'
  - 'Paso 5: Evaluar la fracción irreducible para $x = 5$: $\frac{1}{5 - 2} = \frac{1}{3}$.'
  imagen: /static/img/nodos/simplificacion-final-de-una-suma-de-fracciones-algebraicas-ejemplos.svg
