procedimiento:
- 'Paso 1: Asegúrate de que el numerador final esté completamente reducido.'
- 'Paso 2: Busca algún método para factorizar ese numerador (factor común, diferencia
  de cuadrados, trinomio).'
- 'Paso 3: Si uno de los factores coincide con parte o la totalidad del denominador,
  cancélalos.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en simplificación final de una suma de fracciones algebraicas.
ejemplos:
- titulo: Suma y simplifica $\frac{2x}{x+3} + \frac{6}{x+3}$
  enunciado: Suma y simplifica $\frac{2x}{x+3} + \frac{6}{x+3}$.
  solucion_pasos:
  - 'Suma: $\frac{2x + 6}{x+3}$.'
  - 'Factoriza el numerador sacando factor común 2: $\frac{2(x+3)}{x+3}$.'
  - Cancela el factor $(x+3)$ de arriba y abajo.
  - 'Resultado final: $2$.'
- titulo: Suma $\frac{m^2}{m+1} + \frac{m}{m+1}$.
  solucion_pasos:
  - 'Suma m^2+m en el numerador. Factor común m: m(m+1). Se cancela el m+1 del denominador.'
- titulo: 'Respecto de «Simplificación final de una suma de fracciones algebraicas»:
    ¿Describe adecuada'
  enunciado: 'Respecto de «Simplificación final de una suma de fracciones algebraicas»:
    ¿Describe adecuadamente el concepto esta frase? «Después de sumar y reducir el
    numerador, intenta factorizarlo»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Después de sumar y reducir el
    numerador, intenta factorizarlo.'
- titulo: 'Respecto de «Simplificación final de una suma de fracciones algebraicas»:
    ¿Se puede aceptar'
  enunciado: 'Respecto de «Simplificación final de una suma de fracciones algebraicas»:
    ¿Se puede aceptar esta afirmación? «Terminar el ejercicio sin revisar si se podía
    factorizar el numerador»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Después de sumar y reducir el
    numerador, intenta factorizarlo.'
errores_frecuentes:
- Terminar el ejercicio sin revisar si se podía factorizar el numerador.
- Tachar sumandos en lugar de factorizar (ej. en $\frac{x^2+2}{2}$, tachar los 2).
- Multiplicar por -1.
- Voltear la fracción.
- Para «Para poder simplificar una fracción después de haber sumado sus partes, el
  paso intermedio absolutamente obligatorio es:», la respuesta correcta es Restar
  los exponentes.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando simplificación
  final de una suma de fracciones algebraicas.
