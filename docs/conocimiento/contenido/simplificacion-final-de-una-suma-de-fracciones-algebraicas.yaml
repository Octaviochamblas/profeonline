procedimiento:
- 'Paso 1: Sumar numeradores y reducir todos los términos semejantes.'
- 'Paso 2: Factorizar completamente el polinomio resultante en el numerador.'
- 'Paso 3: Mantener el denominador en su forma factorizada m.c.m.'
- 'Paso 4: Cancelar los factores comunes que aparezcan en el numerador y denominador.'
- 'Paso 5: Escribir la suma final en su forma irreducible indicando el dominio.'
errores_correccion: '- **Error 1:** Dar por terminada la suma dejando un numerador factorizable que comparte términos con
  el denominador. **Cómo corregirlo:** Se debe **FACTORIZAR OBLIGATORIAMENTE EL NUMERADOR FINAL Y CANCELAR LOS FACTORES COMUNES
  CON EL DENOMINADOR COMÚN**.

  - **Error 2:** Eliminar la restricción del dominio al cancelar un factor común final. **Cómo corregirlo:** Las restricciones
  **SE MANTIENEN VIGENTES INCLUSO PARA LOS VALORES QUE ANULAN LOS FACTORES CANCELADOS**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la forma irreducible de la suma $\frac{x}{x+1} + \frac{1}{x+1}$?
  alternativas:
  - $1$
  - $\frac{x+1}{x+1}$
  - $0$
  respuesta: $1$
  solucion_pasos:
  - '1. Sumar numeradores: $\frac{x+1}{x+1}$.'
  - 2. Cancelar el factor común $(x+1)$.
  - '3. Resultado irreducible: $1$.'
- titulo: Ejemplo 2
  enunciado: Al simplificar la suma $\frac{2x^2}{x(x+2)} + \frac{4x}{x(x+2)}$, ¿cuál es el resultado?
  alternativas:
  - $2$
  - $\frac{2x}{x+2}$
  - $2x$
  respuesta: $2$
  solucion_pasos:
  - '1. Numerador: $2x^2 + 4x = 2x(x+2)$.'
  - '2. Fracción: $\frac{2x(x+2)}{x(x+2)} = 2$.'
- titulo: Irreductibilidad final
  enunciado: ¿El resultado de una adición de fracciones debe ser expresado en su forma irreducible?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la norma estándar para entregar la respuesta más simple.
- titulo: Preservación de restricciones
  enunciado: ¿Se conservan las restricciones del dominio para factores cancelados en el último paso?
  respuesta: Sí
  solucion_pasos:
  - Sí, las restricciones garantizan la equivalencia de dominios originales.
errores_frecuentes:
- Al simplificar completamente la fracción $\frac{x+2}{(x-2)(x+2)}$, la cancelación del numerador deja $0$ resultando $0$.
- La cancelación del factor común $(x+1)$ en la suma $\frac{x+1}{x+1}$ elimina a $x = -1$ del conjunto de restricciones.
- En la fracción $\frac{x^2+4}{x+2}$, la simplificación directa de términos sumandos da como resultado $x+2$.
- Al simplificar $\frac{2x(x+3)}{x(x+3)}$, el cociente numérico final equivale a $0$.
- Una fracción suma se considera irreducible aunque su numerador y denominador compartan el factor común $(x-1)$.
afirmaciones_verdaderas:
- La simplificación final exige factorizar el numerador reducido para eliminar divisores comunes con el m.c.m.
- El resultado de una adición de fracciones es una fracción o polinomio en su menor expresión equivalente.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/simplificacion-final-de-una-suma-de-fracciones-algebraicas-resumen.svg)


  QUÉ: Simplificar al máximo el resultado de una adición de fracciones algebraicas.

  CÓMO: Factorizar el numerador unificado resultante y cancelar los términos compartidos con el denominador m.c.m. para obtener
  una expresión irreducible ($\frac{P(x) \cdot C(x)}{Q(x) \cdot C(x)} = \frac{P(x)}{Q(x)}$).

  '
