semantic_id: MAT.ALG.FRACCIONES_SUMA.SIMPLIFICACION_FINAL
resumen_inicial: Una vez reducido el numerador de la suma, se debe factorizar para
  intentar simplificar factores comunes con el denominador.
explicacion_simple: 'El paso final al sumar fracciones algebraicas es verificar si
  la respuesta se puede simplificar aún más.

  Después de haber reducido el numerador a un solo polinomio, intentamos factorizarlo.

  Si al factorizar el numerador aparece un paréntesis igual a uno de los factores
  del denominador común, los cancelamos para obtener la fracción suma irreducible
  más simple posible.'
explicacion_formal: 'Dada la fracción suma reducida $\frac{N(x)}{M(x)}$, se factoriza
  el numerador $N(x) = P(x) \cdot C(x)$ y el denominador común $M(x) = Q(x) \cdot
  C(x)$:


  $$\frac{N(x)}{M(x)} = \frac{P(x) \cdot C(x)}{Q(x) \cdot C(x)} = \frac{P(x)}{Q(x)}
  \quad \text{para } C(x) \neq 0$$


  **Desglose de la fórmula:**

  - $C(x)$: Factor común emergente tras la adición entre el numerador reducido $N(x)$
  y el denominador m.c.m. $M(x)$.

  - $\frac{P(x)}{Q(x)}$: Resultado final irreducible de la suma de fracciones algebraicas.'
definiciones_clave: '- **Simplificación final de la suma**: Proceso de factorización
  posterior a la adición para reducir la fracción resultante al mínimo.

  - **Fracción suma irreducible**: Resultado de una adición algebraica que no contiene
  factores divisores compartidos.'
propiedades_relaciones: '- **Comprobación de irreductibilidad**: $\operatorname{gcd}(P(x),
  Q(x)) = 1$.

  - **Preservación de dominio**: Las restricciones del dominio continúan vigentes
  aunque se cancele el factor común final $C(x)$.'
ejemplo_guiado:
  enunciado: Resuelve la suma $\frac{x}{x^2 - 4} + \frac{2}{x^2 - 4}$, reduce el numerador,
    aplica la simplificación final y evalúa para $x = 5$.
  pasos:
  - 'Paso 1: Sumar numeradores sobre el denominador común: $\frac{x + 2}{x^2 - 4}$.Paso
    2: Factorizar el denominador $x^2 - 4 = (x - 2)(x + 2)$.Paso 3: Expresar la fracción:
    $\frac{x + 2}{(x - 2)(x + 2)}$.Paso 4: Cancelar el factor común $(x + 2)$ en numerador
    y denominador: $\frac{1}{x - 2}$ para $x \notin \{-2, 2\}$.Paso 5: Evaluar la
    fracción irreducible para $x = 5$: $\frac{1}{5 - 2} = \frac{1}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma simplificada irreducible de la suma $\frac{x}{x^2 -
    4} + \frac{2}{x^2 - 4}$?
  choices:
  - text: $\frac{1}{x - 2}$
    is_correct: true
  - text: $\frac{x + 2}{x - 2}$
    is_correct: false
  - text: $\frac{1}{x + 2}$
    is_correct: false
  - text: $\frac{x + 2}{x^2 - 4}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{1}{x - 2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la suma simplificada $\frac{1}{x - 2}$ para $x = 5$, ¿cuál
    es el resultado obtenido?
  choices:
  - text: $\frac{1}{3}$
    is_correct: true
  - text: $\frac{1}{5}$
    is_correct: false
  - text: $3$
    is_correct: false
  - text: $\frac{1}{7}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{1}{3}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Sumar numeradores y reducir todos los términos semejantes.'
- 'Paso 2: Factorizar completamente el polinomio resultante en el numerador.'
- 'Paso 3: Mantener el denominador en su forma factorizada m.c.m.'
- 'Paso 4: Cancelar los factores comunes que aparezcan en el numerador y denominador.'
- 'Paso 5: Escribir la suma final en su forma irreducible indicando el dominio.'
errores_correccion: '- **Error común:** Dar por terminada la suma dejando un numerador
  factorizable que comparte términos con el denominador.

  - **Cómo corregirlo:** Intenta SIEMPRE factorizar el numerador final obtenido. Si
  comparte algún paréntesis con el denominador, cancélalo para entregar la respuesta
  mínima.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de adición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de adición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se conserva el denominador común al sumar?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla fundamental de la adición racional.
- titulo: ¿Se pueden sumar los denominadores entre sí?
  respuesta: 'No'
  solucion_pasos:
  - No, jamás se suman los denominadores.
errores_frecuentes:
- Sumar denominadores al realizar la adición de fracciones algebraicas.
- Sumar numeradores de fracciones con distinto denominador sin homogeneizar.
- Olvidar multiplicar el numerador por el factor de amplificación correspondiente.
- Dejar paréntesis sin expandir en el numerador impidiendo la reducción de términos
  semejantes.
- No verificar si el numerador final se puede factorizar para simplificar con el denominador.
afirmaciones_verdaderas:
- Para sumar fracciones algebraicas de igual denominador se suman los numeradores
  y se conserva el denominador común.
- El uso del m.c.m. como denominador común minimiza el grado de los numeradores amplificados.
al_terminar_debes_poder: Al finalizar este recurso podrás realizar la adición de fracciones
  algebraicas de igual y distinto denominador expresando el resultado en su forma
  simplificada.
