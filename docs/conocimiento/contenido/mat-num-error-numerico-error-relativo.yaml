semantic_id: MAT.NUM.ERROR_NUMERICO.ERROR_RELATIVO
resumen_inicial: 'El error relativo es la razón entre el error absoluto y el valor
  exacto real: $E_r = \frac{|V_{\text{real}} - V_{\text{aprox}}|}{|V_{\text{real}}|}$.'
explicacion_simple: El error relativo mide la importancia o precisión real del error
  en proporción al tamaño del número que estamos midiendo. No es lo mismo equivocarse
  por 1 metro al medir un lápiz que equivocarse por 1 metro al medir una carretera;
  el error relativo evalúa esa diferencia de escala dividiendo el error entre el total.
explicacion_formal: 'Sea $x \in \mathbb{R} \setminus \{0\}$ el valor exacto no nulo
  y $\bar{x}$ una aproximación, el **Error Relativo $E_r$** se define como el cociente
  adimensional:


  $$E_r = \frac{E_a}{|x|} = \frac{|x - \bar{x}|}{|x|}$$


  **Desglose de la fórmula:**

  - $E_a = |x - \bar{x}|$: Error absoluto en el numerador.

  - $|x|$: Valor absoluto del valor exacto de referencia en el denominador ($x \neq
  0$).

  - Adimensionalidad: Al dividir unidades iguales, $E_r$ carece de unidades físicas
  (es un número puro en $\mathbb{R}^+$).


  > **Complemento didáctico:** Mientras menor sea el error relativo $E_r$, mayor será
  la **precisión** y calidad de la aproximación.'
definiciones_clave: '- **Error relativo**: Indicador adimensional de precisión $E_r
  = \frac{E_a}{|x|}$ que compara el error absoluto frente a la magnitud del valor
  real.'
propiedades_relaciones: '- **Adimensionalidad**: $E_r$ es independiente de las unidades
  de medida empleadas.'
ejemplo_guiado:
  enunciado: Calcule el error relativo si el valor exacto es $x = 50$ y el valor aproximado
    es $\bar{x} = 49$.
  pasos:
  - 'Paso 1: Calcular el error absoluto: $E_a = |50 - 49| = 1$.'
  - 'Paso 2: Dividir el error absoluto entre el valor absoluto del valor real: $\frac{1}{|50|}
    = \frac{1}{50}$.'
  - 'Paso 3: Convertir la fracción a decimal: $1 : 50 = 0,02$.'
  - 'Conclusión: El error relativo es $0,02$ (adimensional).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el error relativo Er?
  choices:
  - text: Er = Ea / |x| (error absoluto dividido por el valor absoluto del valor real)
    is_correct: true
  - text: Er = Ea · x
    is_correct: false
  - text: Er = x / Ea
    is_correct: false
  - text: Er = Ea + x
    is_correct: false
  explanation: La alternativa correcta es 'Er = Ea / |x| (error absoluto dividido
    por el valor absoluto del valor real)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado con x = 50 y x_barra = 49 (Ea = 1), ¿cuál fue el
    error relativo resultante?
  choices:
  - text: 0,02
    is_correct: true
  - text: '1'
    is_correct: false
  - text: 0,5
    is_correct: false
  - text: '50'
    is_correct: false
  explanation: La alternativa correcta es '0,02'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener el error absoluto $E_a = |x - \bar{x}|$.'
- 'Paso 2: Dividir $E_a$ entre el valor absoluto del valor exacto $|x|$.'
- 'Paso 3: Expresar el resultado como un número decimal o fracción adimensional.'
errores_correccion: '- **Error 1: Dividir entre el valor aproximado en lugar de dividir
  entre el valor real ($E_r = \frac{E_a}{\bar{x}}$).** **Cómo corregirlo:** La base
  de comparación teórica es SIEMPRE el valor real exacto $x$.


  - **Error 2: Asignar unidades de medida al error relativo.** **Cómo corregirlo:**
  El error relativo es un cociente de unidades idénticas y por ende es ADIMENSIONAL.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $E_a = 0,4$ y el valor real es $x = 8$, calcule $E_r$.
  alternativas:
  - 0,05
  - 0,5
  - 3,2
  respuesta: 0,05
  solucion_pasos:
  - $E_r = 0,4 / 8 = 0,05$.
- titulo: Ejemplo 2
  enunciado: 'Compare la precisión: medir 10 cm con error de 1 cm vs medir 100 cm
    con error de 1 cm.'
  alternativas:
  - La segunda medición es más precisa porque Er = 1/100 = 0,01 < 0,10
  - Ambas tienen la misma precisión
  - La primera es más precisa
  respuesta: La segunda medición es más precisa porque Er = 1/100 = 0,01 < 0,10
  solucion_pasos:
  - $E_{r1} = 1/10 = 0,10$ y $E_{r2} = 1/100 = 0,01$. A menor error relativo, mayor
    precisión.
- titulo: ¿Carece el error relativo de unidades de medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un número adimensional.
- titulo: ¿Es mejor una aproximación si su error relativo se acerca a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, $E_r \to 0$ implica máxima precisión.
errores_frecuentes:
- Dividir el error absoluto por el valor aproximado en lugar de dividirlo entre el
  valor real.
- El error relativo conserva las unidades físicas como metros o kilogramos del valor
  original.
- Un error absoluto de 1 metro representa siempre la misma precisión sin importar
  el total medido.
- El error relativo de una aproximación perfecta es igual a 1.
- Calcular el error relativo requiere multiplicar el valor real por la constante 100.
afirmaciones_verdaderas:
- El error relativo $E_r = E_a / |x|$ mide la precisión proporcional de la aproximación
  respecto al valor real.
- El error relativo es una magnitud adimensional independiente de la unidad de medida
  utilizada.
al_terminar_debes_poder: "Al terminar serás capaz de calcular el error relativo $E_r\
  \ = \frac{E_a}{|x|}$, evaluando la precisión de una aproximación de forma adimensional\
  \ respecto a la escala del valor exacto."
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
