semantic_id: MAT.NUM.ERROR_NUMERICO.ERROR_RELATIVO
resumen_inicial: El error relativo es la razón entre el error absoluto y el valor real exacto, proporcionando una medida adimensional de la calidad o precisión de la aproximación.
explicacion_simple: '![Cálculo del error relativo](/static/img/nodos/calculo-del-error-relativo-intro.svg)


  Un error de $1\text{ cm}$ no significa lo mismo si medimos un tornillo de $2\text{ cm}$ que si medimos una carretera de $10\text{ km}$. El error relativo soluciona este problema dividiendo el error absoluto entre el valor real; al cancelarse las unidades de medida, obtenemos un número puro que nos indica la verdadera precisión de la estimación sin importar la escala.'
explicacion_formal: 'Sea $x_{\text{real}} \in \mathbb{R} \setminus \{0\}$ y $x_{\text{aprox}} \in \mathbb{R}$, el **Error Relativo** $E_{\text{rel}}$ se define mediante el cociente:


  $$E_{\text{rel}} = \frac{E_{\text{abs}}}{|x_{\text{real}}|} = \frac{|x_{\text{real}} - x_{\text{aprox}}|}{|x_{\text{real}}|}$$


  **Desglose formal de la fórmula:**

  - **$E_{\text{abs}}$:** Error absoluto en el numerador.

  - **$|x_{\text{real}}|$:** Valor absoluto del valor real de referencia en el denominador ($x_{\text{real}} \neq 0$).

  - **Magnitud adimensional:** Las unidades del numerador y denominador se cancelan, permitiendo la comparación universal de precisión.


  > **Complemento didáctico:** A menor error relativo, mayor es la calidad y exactitud de la aproximación. Un error relativo cercano a cero ($E_{\text{rel}} \to 0$) representa máxima precisión.'
definiciones_clave: '- **Error relativo**: Razón adimensional $\frac{E_{\text{abs}}}{|x_{\text{real}}|}$ que pondera el error según la magnitud real.

  - **Adimensionalidad**: Propiedad matemática de no depender de ninguna unidad de medida específica.

  - **Calidad de aproximación**: Métrica inversa del error relativo (menor error relativo implica mayor calidad).'
propiedades_relaciones: '- **Independencia de escala**: Permite comparar la precisión entre magnitudes astronómicas y microscópicas.

  - **No negatividad**: $E_{\text{rel}} \ge 0$.

  - **Invarianza ante cambio de unidades**: Medir en metros o centímetros arroja exactamente el mismo error relativo.'
ejemplo_guiado:
  enunciado: '![Ejemplos de error relativo](/static/img/nodos/calculo-del-error-relativo-ejemplos.svg)


    Si el valor real es $10\text{ m}$ y el valor aproximado es $9,5\text{ m}$, calcule el error relativo de la medición.'
  pasos:
  - 'Paso 1: Calcular el error absoluto: $E_{\text{abs}} = |10 - 9,5| = 0,5\text{ m}$.'
  - 'Paso 2: Identificar el valor real: $|x_{\text{real}}| = 10\text{ m}$.'
  - "Paso 3: Calcular el cociente del error relativo:\n  $$E_{\\text{rel}} = \\frac{0,5\\text{ m}}{10\\text{ m}} = 0,05 = \\frac{1}{20}$$"
  - 'Conclusión: El error relativo es $0,05$ (o $\frac{1}{20}$, sin unidades de medida).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué el error relativo no lleva unidades de medida (es adimensional)?
  choices:
  - text: Porque se cancelan las unidades del error absoluto con las del valor real en la división
    is_correct: true
  - text: Porque el error absoluto no tiene unidades
    is_correct: false
  - text: Porque el valor real siempre es un número entero
    is_correct: false
  - text: Porque siempre se divide por 100
    is_correct: false
  explanation: La alternativa correcta es 'Porque se cancelan las unidades del error absoluto con las del valor real en la división'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $10\text{ m}$ y $9,5\text{ m}$, ¿cuál fue el valor del error relativo?
  choices:
  - text: $0,05$
    is_correct: true
  - text: $0,5\text{ m}$
    is_correct: false
  - text: $0,005$
    is_correct: false
  - text: $0,95$
    is_correct: false
  explanation: La alternativa correcta es '$0,05$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el error absoluto $E_{\text{abs}} = |x_{\text{real}} - x_{\text{aprox}}|$.'
- 'Paso 2: Dividir el error absoluto entre el valor absoluto del valor real ($|x_{\text{real}}|$).'
- 'Paso 3: Simplificar la fracción resultante o expresarla en notación decimal pura sin unidades.'
errores_correccion: '- **Error 1: Dividir el error absoluto por el valor aproximado en vez del valor real.** **Cómo corregirlo:** La referencia en el denominador DEBE ser SIEMPRE el valor REAL exacto ($|x_{\text{real}}|$).

  - **Error 2: Agregar unidades de medida al error relativo (ej: escribir $0,05\text{ m}$).** **Cómo corregirlo:** El error relativo es un número puro adimensional; las unidades se cancelan.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el error relativo si $x_{\text{real}} = 8$ y $x_{\text{aprox}} = 7,6$.
  alternativas:
  - $0,05$
  - $0,4$
  - $0,04$
  respuesta: $0,05$
  solucion_pasos:
  - $E_{\text{abs}} = |8 - 7,6| = 0,4$. $E_{\text{rel}} = \frac{0,4}{8} = 0,05$.
- titulo: Ejemplo 2
  enunciado: 'Compare: Medición 1 ($x_{\text{real}}=10$, $E_{\text{abs}}=1$) vs Medición 2 ($x_{\text{real}}=100$, $E_{\text{abs}}=1$). ¿Cuál es más precisa?'
  alternativas:
  - La Medición 2 es más precisa porque $E_{\text{rel}} = \frac{1}{100} = 0,01 < 0,10$
  - La Medición 1 es más precisa
  - Ambas tienen la misma precisión porque tienen el mismo error absoluto
  respuesta: La Medición 2 es más precisa porque $E_{\text{rel}} = \frac{1}{100} = 0,01 < 0,10$
  solucion_pasos:
  - $E_{\text{rel}_1} = \frac{1}{10} = 0,10$; $E_{\text{rel}_2} = \frac{1}{100} = 0,01$. A menor error relativo, mayor precisión.
- titulo: ¿Carece el error relativo de unidades de medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un cociente adimensional.
  alternativas:
  - texto: Sí, es completamente adimensional
    es_correcta: true
    retroalimentacion: ¡Correcto! Al dividir magnitudes con la misma unidad, estas se cancelan.
  - texto: No, se mide en la misma unidad que el error absoluto
    es_correcta: false
    retroalimentacion: Incorrecto, las unidades se simplifican en el cociente.
  - texto: Solo si se expresa como fracción
    es_correcta: false
    retroalimentacion: Incorrecto, tanto en fracción como en decimal es adimensional.
- titulo: ¿Es mejor una aproximación si su error relativo se acerca a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, un menor error relativo representa una mayor fidelidad y calidad de la aproximación.
  alternativas:
  - texto: Sí, menor error relativo implica mayor precisión
    es_correcta: true
    retroalimentacion: ¡Correcto! $E_{\text{rel}} = 0$ corresponde a una exactitud total.
  - texto: No, debe ser cercano a 1
    es_correcta: false
    retroalimentacion: Incorrecto, un error relativo de 1 implicaría un 100% de discrepancia.
  - texto: El error relativo no mide la calidad
    es_correcta: false
    retroalimentacion: Incorrecto, el error relativo es el estándar cuantitativo de precisión.
errores_frecuentes:
- Dividir el error absoluto entre el valor aproximado en lugar de dividir por el valor real.
- Asignar unidades de medida al error relativo.
- Comparar la calidad de dos mediciones basándose únicamente en el error absoluto sin calcular el relativo.
- Creer que un error relativo alto corresponde a una medición de alta calidad.
- Calcular el error relativo cuando el valor real es cero sin tomar las precauciones de indeterminación.
afirmaciones_verdaderas:
- El error relativo es el cociente entre el error absoluto y el valor absoluto del valor real.
- El error relativo es una magnitud adimensional independiente de la unidad de medida utilizada.
- Entre dos aproximaciones, aquella con menor error relativo es la más precisa y de mejor calidad.
al_terminar_debes_poder: '![Síntesis de cálculo del error relativo](/static/img/nodos/calculo-del-error-relativo-resumen.svg)


  QUÉ: Calcular el error relativo para evaluar cuantitativamente la precisión de una estimación.


  CÓMO: Dividiendo el error absoluto entre el valor absoluto del valor real ($E_{\text{rel}} = \frac{|x_{\text{real}} - x_{\text{aprox}}|}{|x_{\text{real}}|}$), obteniendo un valor adimensional que permite comparar la calidad de mediciones en distintas escalas.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
