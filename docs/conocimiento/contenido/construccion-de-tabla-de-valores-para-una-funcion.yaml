semantic_id: MAT.ALG.FUNCION_REPRESENTACION.TABLA_VALORES
resumen_inicial: La construcción de una tabla de valores organiza de forma clara pares de datos $(x, y)$ calculados al evaluar la regla funcional en un conjunto de entradas seleccionadas.
explicacion_simple: |
  Una **tabla de valores** es como una ficha de registro de la función:

  1. Eliges un grupo de valores de entrada para $x$ (por ejemplo: $-2, -1, 0, 1, 2$).
  2. Evalúas cada uno en la fórmula de la función para calcular $y = f(x)$.
  3. Colocas las entradas en la primera columna y sus respuestas en la segunda columna.
explicacion_formal: |
  Sea $f: D \to \mathbb{R}$ una función real. Una **tabla de valores** es la matriz discreta de orden $n \times 2$ dada por:

  $$\begin{array}{|c|c|}
  \hline
  x & y = f(x) \\
  \hline
  x_1 & f(x_1) \\
  x_2 & f(x_2) \\
  \vdots & \vdots \\
  x_n & f(x_n) \\
  \hline
  \end{array} \quad \text{con } x_i \in D$$

  **Desglose de la tabla:**
  - $x_i$: Muestra representativa de preimágenes del dominio $D$.
  - $f(x_i)$: Imágenes pareadas de cada preimagen.
definiciones_clave: |
  - **Tabla de valores**: Formato tabular para desplegar relaciones cuantitativas entre la variable independiente y dependiente.
propiedades_relaciones: |
  - **Puntos clave a incluir**: Es conveniente incluir siempre el valor $x = 0$ (intercepto con eje $Y$) y valores positivos y negativos del dominio.
ejemplo_guiado:
  enunciado: "Construye una tabla de valores para la función $f(x) = 2x - 3$ utilizando los valores de entrada $x \\in \\{-1, 0, 2\\}$."
  pasos:
    - 'Paso 1: Evaluar en $x = -1$: $f(-1) = 2(-1) - 3 = -2 - 3 = -5$.'
    - 'Paso 2: Evaluar en $x = 0$: $f(0) = 2(0) - 3 = -3$.'
    - 'Paso 3: Evaluar en $x = 2$: $f(2) = 2(2) - 3 = 4 - 3 = 1$.'
    - 'Paso 4: Presentar la tabla resultante con los pares ordenados $(-1, -5)$, $(0, -3)$ y $(2, 1)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Para la función $f(x) = 2x - 3$, ¿cuáles son las salidas correspondientes a $x = -1, 0, 2$?"
    choices:
      - {text: "$y = -5, -3, 1$", is_correct: true}
      - {text: "$y = 5, 3, -1$", is_correct: false}
      - {text: "$y = -1, 0, 2$", is_correct: false}
      - {text: "$y = -2, 0, 4$", is_correct: false}
    explanation: "La alternativa correcta es '$y = -5, -3, 1$'. $f(-1) = -5$, $f(0) = -3$ y $f(2) = 1$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué representa cada fila $(x_i, y_i)$ de una tabla de valores en el plano cartesiano?"
    choices:
      - {text: "Las coordenadas del punto de la gráfica de la función.", is_correct: true}
      - {text: "La pendiente de la recta tangente.", is_correct: false}
      - {text: "El área bajo la curva.", is_correct: false}
      - {text: "La asíntota vertical.", is_correct: false}
    explanation: "La alternativa correcta es 'Las coordenadas del punto de la gráfica de la función.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Seleccionar un conjunto de valores de prueba para la variable independiente $x$.'
  - 'Paso 2: Sustituir cada $x$ en la fórmula de la función $f(x)$.'
  - 'Paso 3: Calcular el resultado $y$ respetando jerarquía de operaciones.'
  - 'Paso 4: Disponer los valores en una tabla con dos columnas ($x$ e $y$).'
errores_correccion: |
  - **Error común:** Colocar valores fuera del dominio de la función en la columna de las $x$.
  - **Cómo corregirlo:** Antes de tabular, comprueba que cada valor de $x$ elegido sea permitido por las restricciones del dominio.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de representación de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de representación de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Construir una tabla de valores exige seleccionar obligatoriamente solo números enteros positivos en la variable $X$.'
  - 'En una tabla de valores, los resultados $y = f(x)$ se ubican en la primera columna y las entradas $x$ en la segunda.'
  - 'Para construir la tabla de $f(x) = 2x + 1$, basta elegir un único punto $x = 0$ para determinar toda la curva.'
  - 'Si en una tabla dos entradas distintas producen el mismo valor de salida $y$, la tabla queda invalidada como función.'
  - 'Los valores calculados en la tabla de valores representan las pendientes locales de la gráfica en cada punto.'
afirmaciones_verdaderas:
  - 'Construir una tabla de valores consiste en seleccionar valores dentro del dominio de $x$, evaluarlos en $f(x)$ y registrar los pares $(x, y)$ resultantes.'
  - 'La tabla de valores proporciona puntos discretos que sirven como guía para trazar la representación gráfica de la función.'
al_terminar_debes_poder: |
  QUÉ: Construir tablas de valores tabulares para funciones de variable real.
  CÓMO: Seleccionar un conjunto representativo de entradas $x \in \text{Dom}(f)$, calcular cada $f(x)$ y organizar los pares $(x, y)$ en una estructura ordenada.
