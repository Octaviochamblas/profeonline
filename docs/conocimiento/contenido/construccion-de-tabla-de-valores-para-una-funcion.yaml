semantic_id: MAT.ALG.FUNCION_REPRESENTACION.TABLA_VALORES
resumen_inicial: Una tabla de valores organiza de manera sistemática parejas de entradas
  $x$ con sus correspondientes salidas $y = f(x)$.
explicacion_simple: 'Para construir una **tabla de valores**:

  1. Seleccionamos un conjunto de valores de prueba para la variable $x$ dentro del
  dominio (por ejemplo $x = -1, 0, 1, 2$).

  2. Evaluamos cada $x$ en la fórmula de la función para calcular su resultado $f(x)$.

  3. Anotamos cada pareja en dos filas (o dos columnas) enfrentando la entrada $x$
  con su salida $y$.'
explicacion_formal: 'La **tabla de valores** para la función $f: A \to B$ sobre un
  subconjunto discreto $A_k = \{x_1, x_2, \dots, x_n\} \subset \operatorname{Dom}(f)$
  se estructura como la matriz de asignaciones:


  $$T(f) = \begin{pmatrix} x_1 & x_2 & \dots & x_n \\ f(x_1) & f(x_2) & \dots & f(x_n)
  \end{pmatrix}$$


  **Desglose de la fórmula:**

  - Fila 1: Preimágenes $x_i$ elegidas deliberadamente.

  - Fila 2: Imágenes únicas $y_i = f(x_i)$ evaluadas.'
definiciones_clave: '- **Tabla de valores**: Formato de representación tabular de
  asignaciones puntuales $(x, f(x))$.'
propiedades_relaciones: '- **Visualización discreta**: Muestra una muestra finita
  de puntos pertenecientes a la relación funcional.'
ejemplo_guiado:
  enunciado: Construye la tabla de valores para la función $f(x) = 3x - 1$ evaluando
    en $x \in \{-1, 0, 2\}$.
  pasos:
  - 'Paso 1: Evaluar $x = -1$: $f(-1) = 3(-1) - 1 = -3 - 1 = -4$.Paso 2: Evaluar $x
    = 0$: $f(0) = 3(0) - 1 = 0 - 1 = -1$.Paso 3: Evaluar $x = 2$: $f(2) = 3(2) - 1
    = 6 - 1 = 5$.Paso 4: Formar la tabla: $|x: -1, 0, 2| \implies |f(x): -4, -1, 5|$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al construir la tabla de valores para $f(x) = 3x - 1$ en $x = -1$, ¿cuál
    es la imagen obtenida?
  choices:
  - text: $f(-1) = -4$
    is_correct: true
  - text: $f(-1) = -2$
    is_correct: false
  - text: $f(-1) = 2$
    is_correct: false
  - text: $f(-1) = 4$
    is_correct: false
  explanation: La alternativa correcta es '$f(-1) = -4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa la segunda fila o columna en una tabla de valores de una
    función?
  choices:
  - text: Las imágenes resultantes de evaluar $f(x)$.
    is_correct: true
  - text: El dominio de la función.
    is_correct: false
  - text: Las preimágenes arbitrarias elegidas.
    is_correct: false
  - text: La suma de los números del eje X.
    is_correct: false
  explanation: La alternativa correcta es 'Las imágenes resultantes de evaluar $f(x)$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar valores representativos para la variable independiente $x$.'
- 'Paso 2: Evaluar cada número en la función $f(x)$.'
- 'Paso 3: Disponer los resultados en la tabla organizando las parejas $(x, f(x))$.'
errores_correccion: '- **Error común:** Colocar valores en $f(x)$ sin haber respetado
  la regla de signos de la función.

  - **Cómo corregirlo:** Revisa cada evaluación individualmente antes de registrarla
  en la tabla.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de representación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de representación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El criterio de la línea vertical sirve para identificar si un gráfico representa
    a una función?
  respuesta: Sí
  solucion_pasos:
  - Sí, si ninguna recta vertical corta al gráfico en más de un punto, es función.
- titulo: ¿El dominio de una función se lee sobre el eje horizontal X en su gráfica?
  respuesta: Sí
  solucion_pasos:
  - Sí, el dominio es el ancho continuo proyectado en el eje X.
errores_frecuentes:
- Invertir el orden de las componentes en los pares ordenados escribiendo $(y, x)$
  en vez de $(x, y)$.
- Trazar las flechas en un diagrama sagital en sentido contrario, del codominio al
  dominio.
- Confundir el criterio de la línea vertical (usado para probar funciones) con el
  de la línea horizontal (usado para inyectividad).
- Leer los valores del eje vertical $Y$ para determinar el dominio o los del eje $X$
  para hallar el recorrido.
- Usar la coordenada $x$ de un vértice en lugar de la coordenada $y$ para determinar
  el mínimo del recorrido en una gráfica.
afirmaciones_verdaderas:
- Una relación representada gráficamente es una función si y solo si cualquier línea
  vertical corta a su gráfico a lo sumo en un punto.
- El dominio se determina en el gráfico proyectando el trazo sobre el eje horizontal
  $X$, mientras que el recorrido se obtiene proyectándolo sobre el eje vertical $Y$.
al_terminar_debes_poder: Al finalizar este recurso podrás representar funciones mediante
  tablas, pares ordenados, diagramas sagitales y gráficos en el plano cartesiano,
  identificando dominio y recorrido.
