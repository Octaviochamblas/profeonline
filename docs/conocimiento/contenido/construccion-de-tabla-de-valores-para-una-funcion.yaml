semantic_id: MAT.ALG.FUNCION_REPRESENTACION.TABLA_VALORES
resumen_inicial: Construir una tabla de valores consiste en seleccionar valores de entrada en el dominio y calcular sus respectivas imágenes mediante la regla funcional.
explicacion_simple: '![Construir una tabla de valores consiste en seleccionar valores de entrada en el dominio y calcular sus respectivas imágenes mediante la regla funcional](/static/img/nodos/construccion-de-tabla-de-valores-para-una-funcion-intro.svg)



  Para construir una tabla de valores de una función:

  1. Eliges varios valores sencillos para $x$ (es recomendable incluir números negativos, el cero y números positivos, como $-2, -1, 0, 1, 2$).

  2. Reemplazas cada número $x$ en la fórmula de la función para calcular su resultado $y = f(x)$.

  3. Escribes los pares ordenados $(x, y)$ en filas o columnas organizadas.


  Esta tabla es el paso previo ideal para dibujar la gráfica de la función con precisión.'
explicacion_formal: 'Dada una función $f: \text{Dom}(f) \to \mathbb{R}$, una **tabla de valores** es una representación tabular discreta generada a partir de un conjunto finito de puntos de muestreo $\{x_1, x_2, \dots, x_n\} \subset \text{Dom}(f)$:

  $$\begin{array}{|c|c|c|c|c|}

  \hline

  x & x_1 & x_2 & \dots & x_n \\

  \hline

  y = f(x) & f(x_1) & f(x_2) & \dots & f(x_n) \\

  \hline

  \end{array}$$


  **Criterios para una tabla eficaz:**

  - **Cobertura del dominio**: Incluir valores a la izquierda y a la derecha del origen o del vértice.

  - **Puntos clave**: Incluir cortes con los ejes ($x = 0$ y puntos donde $f(x) = 0$).'
definiciones_clave: '- **Tabla de valores**: Disposición estructurada que empareja preimágenes seleccionadas con sus imágenes calculadas.

  - **Punto de muestreo**: Valor numérico de entrada elegido para explorar el comportamiento de la curva.'
propiedades_relaciones: '- **Pares ordenados**: Cada columna $(x_k, y_k)$ representa un punto a ubicar en el plano cartesiano.

  - **Detección de patrones**: Permite observar crecimiento, decrecimiento o simetría numérica.'
ejemplo_guiado:
  enunciado: '![Ejemplo Construir una tabla de valores consiste en seleccionar valores de entrada en el dominio y calcular sus respectivas imágenes mediante la regla funcional](/static/img/nodos/construccion-de-tabla-de-valores-para-una-funcion-ejemplos.svg)



    Construye una tabla de valores para la función afín $f(x) = 2x - 3$ usando los valores $x \in \{-1, 0, 1, 2, 3\}$.'
  pasos:
  - 'Paso 1: Evaluar en $x = -1$: $f(-1) = 2(-1) - 3 = -2 - 3 = -5$.'
  - 'Paso 2: Evaluar en $x = 0$: $f(0) = 2(0) - 3 = -3$.'
  - 'Paso 3: Evaluar en $x = 1$: $f(1) = 2(1) - 3 = -1$.'
  - 'Paso 4: Evaluar en $x = 2$: $f(2) = 2(2) - 3 = 1$.'
  - 'Paso 5: Evaluar en $x = 3$: $f(3) = 2(3) - 3 = 3$.'
  - 'Paso 6: Organizar los pares obtenidos: $(-1, -5), (0, -3), (1, -1), (2, 1), (3, 3)$.'
