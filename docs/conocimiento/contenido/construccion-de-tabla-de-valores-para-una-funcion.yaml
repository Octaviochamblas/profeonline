procedimiento:
- 'Paso 1: Seleccionar un conjunto de valores de prueba para $x$ dentro del dominio admisible.'
- 'Paso 2: Sustituir cada valor de $x$ en la fórmula de la función para calcular su imagen $y = f(x)$.'
- 'Paso 3: Registrar los resultados en una tabla organizada de dos filas o dos columnas.'
- 'Paso 4: Escribir los pares ordenados $(x, y)$ listos para su graficación en el plano cartesiano.'
errores_correccion: '- **Error común:** Evaluar solo valores enteros positivos ($1, 2, 3$), perdiendo la forma de la curva en los negativos.

  - **Cómo corregirlo:** Incluir siempre preimágenes simétricas alrededor del origen (ej: $-2, -1, 0, 1, 2$) para capturar asíntotas, vértices o cambios de signo.'
ejemplos:
- titulo: 'Ejemplo 1: Función lineal'
  enunciado: Si construyes una tabla para $f(x) = -3x + 2$, ¿cuál es el valor de $y$ para $x = -2$?
  alternativas:
  - '8'
  - '-4'
  - '-8'
  - '4'
  respuesta: '8'
  solucion_pasos:
  - 'Paso 1: $f(-2) = -3(-2) + 2$.'
  - 'Paso 2: $6 + 2 = 8$.'
- titulo: 'Ejemplo 2: Función cuadrática simétrica'
  enunciado: En la tabla de $f(x) = x^2 - 1$, ¿qué valores de $y$ corresponden a $x = -3$ y $x = 3$?
  alternativas:
  - Ambos dan y = 8
  - y = -10 e y = 8
  - y = 8 e y = -8
  - y = 10 e y = 10
  respuesta: Ambos dan y = 8
  solucion_pasos:
  - 'Paso 1: $f(-3) = (-3)^2 - 1 = 9 - 1 = 8$.'
  - 'Paso 2: $f(3) = 3^2 - 1 = 9 - 1 = 8$.'
- titulo: 'Ejemplo 3: Función valor absoluto'
  enunciado: Para $g(x) = |x - 2|$, ¿cuál es la imagen correspondiente a $x = 0$ en la tabla?
  alternativas:
  - '2'
  - '-2'
  - '0'
  - '4'
  respuesta: '2'
  solucion_pasos:
  - 'Paso 1: $g(0) = |0 - 2| = |-2| = 2$.'
- titulo: 'Ejemplo 4: Identificación de pares'
  enunciado: Si $f(x) = 4 - 2x$, ¿cuál de los siguientes pares ordenados pertenece a su tabla?
  alternativas:
  - (3, -2)
  - (3, 2)
  - (2, 4)
  - (-1, 2)
  respuesta: (3, -2)
  solucion_pasos:
  - 'Paso 1: Evaluar en $x = 3$: $f(3) = 4 - 2(3) = 4 - 6 = -2$.'
  - 'Paso 2: El par ordenado generado es $(3, -2)$.'
errores_frecuentes:
- Cometer errores de signos al elevar números negativos al cuadrado.
- Elegir valores fuera del dominio (como dividir por cero).
- Invertir las casillas colocando las imágenes en la fila de preimágenes.
afirmaciones_verdaderas:
- Una tabla de valores es un registro ordenado de pares $(x, f(x))$ obtenido al evaluar puntos del dominio.
- Permite planificar la escala adecuada de los ejes cartesiano antes de trazar la gráfica.
al_terminar_debes_poder: '**QUÉ:** Construir tablas de valores completas y precisas para funciones reales.


  **CÓMO:** Seleccionando preimágenes representativas en el dominio y calculando paso a paso sus imágenes correspondientes.


