semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO
resumen_inicial: Las inecuaciones con valor absoluto son desigualdades que involucran la distancia de una variable respecto al origen o a un punto dado.
explicacion_simple: |
  El valor absoluto $|x|$ mide la distancia de $x$ hasta el cero en la recta numérica.

  - Decir $|x| < 3$ significa "los puntos cuya distancia a cero es menor que 3" (entre $-3$ y $3$).
  - Decir $|x| > 3$ significa "los puntos cuya distancia a cero es mayor que 3" (a la izquierda de $-3$ o a la derecha de $3$).
explicacion_formal: |
  Para $k > 0$, una inecuación con valor absoluto se resuelve mediante las siguientes propiedades de equivalencia:

  1. $|E(x)| < k \iff -k < E(x) < k$
  2. $|E(x)| > k \iff E(x) < -k \ \lor \ E(x) > k$

  **Desglose de la fórmula:**
  - $E(x)$: Expresión algebraica en función de $x$.
  - $k$: Constante real positiva.
definiciones_clave: |
  - **Inecuación con valor absoluto**: Desigualdad que contiene la variable dentro de barras de valor absoluto $| \cdot |$.
propiedades_relaciones: |
  - **Interpretación geométrica**: $|x - a| < r$ representa el conjunto de puntos distantes menos de $r$ del centro $a$.
ejemplo_guiado:
  enunciado: Resuelve la inecuación $|x - 2| < 5$ y expresa su conjunto solución.
  pasos:
    - 'Paso 1: Aplicar la propiedad para menor que: $-5 < x - 2 < 5$.'
    - 'Paso 2: Sumar 2 en los tres miembros de la desigualdad: $-5 + 2 < x < 5 + 2$.'
    - 'Paso 3: Simplificar: $-3 < x < 7$.'
    - 'Paso 4: Escribir la solución en notación de intervalo: $S = ]-3, 7[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: ¿Cuál es el conjunto solución de la inecuación $|x - 2| < 5$?
    choices:
      - {text: '$S = ]-3, 7[$', is_correct: true}
      - {text: '$S = [-3, 7]$', is_correct: false}
      - {text: '$S = ]-\infty, -3[ \cup ]7, +\infty[$', is_correct: false}
      - {text: '$S = \emptyset$', is_correct: false}
    explanation: La alternativa correcta es '$S = ]-3, 7[$'.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: ¿Qué propiedad se utiliza para resolver la inecuación $|E| > k$ con $k > 0$?
    choices:
      - {text: $E < -k \ \lor \ E > k$, is_correct: true}
      - {text: $-k < E < k$, is_correct: false}
      - {text: $E = k$, is_correct: false}
      - {text: $E > k$ únicamente., is_correct: false}
    explanation: La alternativa correcta es '$E < -k \ \lor \ E > k$'. Genera dos regiones exteriores separadas.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la forma de la inecuación ($<, \le, >, \ge$) y el signo de la constante $k$.'
  - 'Paso 2: Descomponer el valor absoluto según la propiedad correspondiente.'
  - 'Paso 3: Resolver las inecuaciones lineales simples resultantes.'
  - 'Paso 4: Expresar la solución final como intervalo o unión de intervalos.'
errores_correccion: |
  - **Error común:** Quitar las barras de valor absoluto sin desglosar en dos casos o en una doble desigualdad.
  - **Cómo corregirlo:** Las barras $| \cdot |$ NO se borran simplemente; deben sustituirse por la propiedad de equivalencia adecuada.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de inecuaciones con valor absoluto.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de inecuaciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Resolver $|x + 4| < 7$ consiste en eliminar las barras obteniendo simplemente $x + 4 < 7$.'
  - 'El valor absoluto de una expresión algebraica siempre invierte el signo de la variable interna.'
  - 'La desigualdad $|x| > 5$ equivale a la condición simultánea con conjunción $-5 > x > 5$.'
  - 'Una inecuación con valor absoluto posee exactamente dos números reales como solución puntual.'
  - 'La propiedad $|x| \le k \iff -k \le x \le k$ se aplica de forma idéntica cuando $k$ es un número negativo.'
afirmaciones_verdaderas:
  - 'Las inecuaciones con valor absoluto relacionan la distancia de una expresión algebraica respecto al origen mediante propiedades equivalentes.'
  - 'Dependiendo de la dirección del operador y del signo de la constante, la solución se desglosa en una intersección de desigualdades o en una unión de intervalos.'
al_terminar_debes_poder: |
  QUÉ: Resolver inecuaciones lineales que contienen valor absoluto y expresar su solución.
  CÓMO: Identificar la propiedad equivalente aplicable según el operador ($<, \le, >, \ge$), desglosar las desigualdades lineales y expresar la solución en intervalos.
fuente: 'Texto escolar MINEDUC — Álgebra / Inecuaciones con Valor Absoluto'
estado: publicado
