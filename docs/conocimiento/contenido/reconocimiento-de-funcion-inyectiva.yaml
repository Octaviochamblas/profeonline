semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INYECTIVA_RECONOCIMIENTO
resumen_inicial: 'El reconocimiento gráfico de una función inyectiva se realiza mediante el criterio de la recta horizontal: ninguna recta horizontal puede cortar a la curva en más de un punto.'
explicacion_simple: '![El reconocimiento gráfico de una función inyectiva se realiza mediante el criterio de la recta horizontal: ninguna recta horizontal puede cortar a la curva en más de un punto](/static/img/nodos/reconocimiento-de-funcion-inyectiva-intro.svg)



  Para saber si una función es inyectiva mirando su dibujo en el plano:

  1. Imagina una **línea horizontal** (como una regla paralela al eje $X$).

  2. Muévela de arriba hacia abajo por toda la gráfica.

  3. **Criterio:** Si la línea horizontal toca a la curva en **2 o más puntos al mismo tiempo**, la función **NO es inyectiva**.

  4. Si en todas las alturas toca en **a lo más 1 punto**, la función **SÍ es inyectiva**.'
explicacion_formal: 'Sea $\text{Graf}(f) = \{(x, f(x)) \in \mathbb{R}^2 \mid x \in \text{Dom}(f)\}$ la gráfica de la función $f$. El **Criterio de la Recta Horizontal** se formula formalmente como:

  $$f \text{ es inyectiva} \Longleftrightarrow \forall c \in \mathbb{R}, \; |(\,\mathbb{R} \times \{c\}\,) \cap \text{Graf}(f)| \le 1$$


  **Interpretación y aplicaciones:**

  - **Corte múltiple**: Si para algún $c$ la intersección contiene 2 o más puntos $(x_1, c), (x_2, c)$, se tiene $f(x_1) = f(x_2) = c$ con $x_1 \neq x_2$ (falla inyectividad).

  - **Criterio de la derivada**: Si $f$ es derivable y $f''(x) > 0$ (o $f''(x) < 0$) para todo $x$, la función es estrictamente monótona e inyectiva.'
definiciones_clave: '- **Criterio de la recta horizontal**: Método visual para determinar inyectividad a partir de la gráfica.

  - **Puntos de corte múltiple**: Intersecciones que revelan preimágenes distintas asociadas a una misma imagen.'
propiedades_relaciones: '- **Diferencia con la recta vertical**: La recta vertical evalúa si la relación es **función**; la horizontal evalúa si es **inyectiva**.

  - **Funciones periódicas**: Las funciones trigonométricas en $\mathbb{R}$ no son inyectivas al ser cortadas infinitas veces por rectas horizontales.'
ejemplo_guiado:
  enunciado: '![Ejemplo El reconocimiento gráfico de una función inyectiva se realiza mediante el criterio de la recta horizontal: ninguna recta horizontal puede cortar a la curva en más de un punto](/static/img/nodos/reconocimiento-de-funcion-inyectiva-ejemplos.svg)



    Aplica el criterio de la recta horizontal para determinar si la parábola $y = (x - 2)^2 + 1$ es inyectiva en $\mathbb{R}$.'
  pasos:
  - 'Paso 1: Identificar el vértice de la parábola: $V(2, 1)$, que abre hacia arriba.'
  - 'Paso 2: Trazar la recta horizontal $y = 5$.'
  - 'Paso 3: Resolver $(x - 2)^2 + 1 = 5 \implies (x - 2)^2 = 4 \implies x - 2 = \pm 2$.'
  - 'Paso 4: Obtener las preimágenes: $x_1 = 4$ y $x_2 = 0$. La recta horizontal corta en $(0, 5)$ y $(4, 5)$ (2 puntos).'
  - 'Paso 5: Concluir que la función NO es inyectiva en $\mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué evalúa el criterio de la recta horizontal en una gráfica cartesiana?
  choices:
  - text: Evalua si la funcion es inyectiva (a lo mas un punto de corte).
    is_correct: true
  - text: Evalua si la curva es una funcion valida.
    is_correct: false
  - text: Calcula el dominio de la funcion.
    is_correct: false
  - text: Determina el signo de la pendiente.
    is_correct: false
  explanation: La alternativa correcta es 'Evalua si la funcion es inyectiva (a lo mas un punto de corte).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una recta horizontal corta a una gráfica en 3 puntos distintos, ¿qué se puede afirmar?
  choices:
  - text: Que la funcion no es inyectiva.
    is_correct: true
  - text: Que la relacion no es una funcion.
    is_correct: false
  - text: Que la funcion es biyectiva.
    is_correct: false
  - text: Que la funcion es constante.
    is_correct: false
  explanation: La alternativa correcta es 'Que la funcion no es inyectiva.'. Existen 3 preimágenes con la misma imagen.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Analizar la gráfica de la función en su dominio correspondiente.'
- 'Paso 2: Trazar rectas horizontales imaginarias $y = c$ para diferentes valores de $c$.'
- 'Paso 3: Contar el número de intersecciones entre cada recta horizontal y la gráfica.'
- 'Paso 4: Si existe alguna recta que corte en 2 o más puntos, concluir que no es inyectiva; si todas cortan en $\le 1$ punto, es inyectiva.'
errores_correccion: '- **Error común:** Usar la recta vertical para justificar que una función es inyectiva.

  - **Cómo corregirlo:** La recta **vertical** comprueba que sea **función**; la recta **horizontal** es la que comprueba la **inyectividad**.'
ejemplos:
- titulo: 'Ejemplo 1: Recta inclinada'
  enunciado: ¿Es inyectiva la recta $y = -2x + 4$ según el criterio gráfico?
  alternativas:
  - Sí, cualquier recta horizontal la corta exactamente en 1 punto
  - No, porque tiene pendiente negativa
  - No, corta a los dos ejes coordenados
  - Solo en el primer cuadrante
  respuesta: Sí, cualquier recta horizontal la corta exactamente en 1 punto
  solucion_pasos:
  - 'Paso 1: Al ser una recta no horizontal, toda línea $y = c$ la intersecta una sola vez.'
- titulo: 'Ejemplo 2: Función constante'
  enunciado: ¿Es inyectiva la función constante $f(x) = 5$?
  alternativas:
  - No, la recta horizontal y = 5 la corta en infinitos puntos
  - Sí, porque es una línea recta
  - Sí, porque no tiene curvas
  - Solo en x = 5
  respuesta: No, la recta horizontal y = 5 la corta en infinitos puntos
  solucion_pasos:
  - 'Paso 1: Todos los puntos tienen $y = 5$, fallando rotundamente la inyectividad.'
- titulo: 'Ejemplo 3: Gráfica con ondas'
  enunciado: ¿Es inyectiva una función con forma de onda senoidal en $\mathbb{R}$?
  alternativas:
  - No, las rectas horizontales cortan infinitas veces las crestas y valles
  - Sí, porque es suave y continua
  - Sí, porque tiene simetría
  - Solo entre 0 y 1
  respuesta: No, las rectas horizontales cortan infinitas veces las crestas y valles
  solucion_pasos:
  - 'Paso 1: Las oscilaciones repiten las mismas alturas $y$, no es inyectiva.'
- titulo: 'Ejemplo 4: Función exponencial'
  enunciado: ¿Es inyectiva la gráfica de $f(x) = e^x$?
  alternativas:
  - Sí, es estrictamente creciente y cada horizontal corta en a lo más 1 punto
  - No, porque nunca corta al eje X
  - No, porque crece muy rápido
  - Solo para valores enteros
  respuesta: Sí, es estrictamente creciente y cada horizontal corta en a lo más 1 punto
  solucion_pasos:
  - 'Paso 1: Para $y > 0$ corta 1 vez; para $y \le 0$ corta 0 veces ($\le 1$ punto), es inyectiva.'
errores_frecuentes:
- Confundir la prueba de la recta horizontal con la de la recta vertical.
- No verificar todos los niveles horizontales de la gráfica.
- Creer que cortar en 0 puntos invalida la inyectividad (la condición exige a lo más 1 corte).
afirmaciones_verdaderas:
- Una función es inyectiva si ninguna recta horizontal intersecta su gráfica en más de un punto.
- Toda función monótona estricta pasa la prueba de la recta horizontal.
al_terminar_debes_poder: '**QUÉ:** Reconocer e identificar funciones inyectivas a partir de su representación gráfica.


  **CÓMO:** Aplicando el criterio de la recta horizontal y verificando que el número máximo de intersecciones sea menor o igual a uno.


  ![Resumen El reconocimiento gráfico de una función inyectiva se realiza mediante el criterio de la recta horizontal: ninguna recta horizontal puede cortar a la curva en más de un punto](/static/img/nodos/reconocimiento-de-funcion-inyectiva-resumen.svg)'
