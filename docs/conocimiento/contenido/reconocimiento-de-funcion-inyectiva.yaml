semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INYECTIVA_RECONOCIMIENTO
resumen_inicial: El reconocimiento de una función inyectiva evalúa si a cada elemento del recorrido le corresponde una única preimagen exclusiva.
explicacion_simple: |
  Para **reconocer si una función es inyectiva**:

  - **Criterio visual**: Traza líneas horizontales invisibles en la gráfica. Si alguna línea horizontal toca a la curva en **$2$ o más puntos**, la función **NO es inyectiva**.
  - **Ejemplo**: Una gráfica en forma de "U" (parábola) falla la prueba porque la línea horizontal cruza en dos lados.
  - **Regla de oro**: Una línea recta inclinada (función lineal o afín) **SIEMPRE es inyectiva**.
explicacion_formal: |
  Sea la gráfica $G_f \subset \mathbb{R}^2$ de una función $f$. El **criterio geométrico de inyectividad** establece:

  $$f \text{ es inyectiva} \iff \forall c \in \mathbb{R}, \quad |G_f \cap \{(x, c) \mid x \in \mathbb{R}\}| \le 1$$

  **Enfoque de monotonía:**
  Si $f$ es una función continua en un intervalo $I$ y es estrictamente creciente ($\forall x_1 < x_2 \implies f(x_1) < f(x_2)$) o estrictamente decreciente, entonces $f$ es inyectiva en $I$.
definiciones_clave: |
  - **Prueba de la línea horizontal**: Método geométrico donde se trazan rectas paralelas al eje $X$ para determinar si intersectan la curva en a lo sumo un punto.
propiedades_relaciones: |
  - **Monotonía y unicidad**: Las funciones estrictamente monótonas garantizan la inyectividad ya que no pueden volver a subir o bajar repitiendo valores de salida.
ejemplo_guiado:
  enunciado: 'Determina si las funciones $f(x) = x^3$ y $g(x) = x^2 - 2$ son inyectivas mediante el análisis de monotonía y gráfico.'
  pasos:
    - 'Paso 1: Analizar $f(x) = x^3$: es estrictamente creciente en todo $\mathbb{R}$ ($x_1 < x_2 \implies x_1^3 < x_2^3$). Toda línea horizontal la cruza 1 sola vez $\implies f$ es inyectiva.'
    - 'Paso 2: Analizar $g(x) = x^2 - 2$: la recta horizontal $y = 2$ la corta en $x = 2$ y $x = -2$ ($g(2) = g(-2) = 2$).'
    - 'Paso 3: Concluir que $f(x) = x^3$ SÍ es inyectiva y $g(x) = x^2 - 2$ NO es inyectiva en $\mathbb{R}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ocurre en la prueba de la línea horizontal si una función NO es inyectiva?'
    choices:
      - {text: 'Al menos una línea horizontal corta a la gráfica en 2 o más puntos.', is_correct: true}
      - {text: 'Todas las líneas horizontales cortan a la gráfica en 1 punto.', is_correct: false}
      - {text: 'Ninguna línea vertical toca a la gráfica.', is_correct: false}
      - {text: 'La gráfica es totalmente horizontal.', is_correct: false}
    explanation: 'La alternativa correcta es ''Al menos una línea horizontal corta a la gráfica en 2 o más puntos.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes funciones definidas en $\mathbb{R}$ es INYECTIVA?'
    choices:
      - {text: '$f(x) = x^3$', is_correct: true}
      - {text: '$g(x) = x^2 - 2$', is_correct: false}
      - {text: '$h(x) = |x|$', is_correct: false}
      - {text: '$k(x) = 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = x^3$''. La función cúbica es estrictamente creciente en todo $\mathbb{R}$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Examinar la representación gráfica o algebraica de la función.'
  - 'Paso 2: Aplicar el criterio de la línea horizontal o la prueba de la igualdad de preimágenes.'
  - 'Paso 3: Comprobar si existen salidas repetidas para diferentes entradas.'
  - 'Paso 4: Declarar si la función es o no inyectiva.'
errores_correccion: |
  - **Error común:** Confundir la función valor absoluto $f(x) = |x|$ como inyectiva.
  - **Cómo corregirlo:** $f(x) = |x|$ NO es inyectiva porque $f(5) = 5$ y $f(-5) = 5$ entregan la misma respuesta.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función inyectiva.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función inyectiva.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La función valor absoluto $f(x) = |x|$ es inyectiva porque solo devuelve números positivos.'
  - 'Una línea horizontal que intersecta a una gráfica en tres puntos confirma que la función es inyectiva.'
  - 'Toda función polinómica de grado 2 es siempre inyectiva en el dominio de los números reales.'
  - 'Las funciones constantes $f(x) = c$ son inyectivas porque su pendiente es nula.'
  - 'El criterio de la línea vertical se utiliza para evaluar si una curva representa una función inyectiva.'
afirmaciones_verdaderas:
  - 'Una función es inyectiva si ninguna recta horizontal en el plano cartesiano intersecta a su gráfica en más de un punto.'
  - 'Toda función estrictamente creciente o estrictamente decreciente en un intervalo es inyectiva en dicho intervalo.'
al_terminar_debes_poder: |
  QUÉ: Reconocer e identificar funciones inyectivas en representaciones gráficas y algebraicas.
  CÓMO: Aplicar el criterio de la línea horizontal y verificar que ninguna imagen contenga múltiples preimágenes.
