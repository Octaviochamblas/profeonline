semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INYECTIVA_RECONOCIMIENTO
resumen_inicial: 'Reconocimiento de función inyectiva: conceptos, representación y
  propiedades en Tipos de funciones y función inversa.'
explicacion_simple: Así como la línea vertical detecta si algo es función, otra línea
  (la horizontal) revela si esa función es inyectiva.
explicacion_formal: '### Definición formal


  Sea $f$ una función con gráfica $G_f$. $f$ es inyectiva si y solo si para todo $b
  \in \mathbb{R}$, la recta horizontal $y=b$ interseca a $G_f$ en a lo más un punto.
  Esto es la traducción gráfica directa de la condición algebraica de inyectividad.


  ### Desarrollo didáctico


  Cada recta horizontal $y=b$ representa "todos los puntos con la misma imagen $b$".
  Si la curva tiene dos puntos con esa altura, dos valores distintos de $x$ comparten
  esa imagen, violando la inyectividad.


  Una parábola falla el criterio (una recta horizontal por encima del vértice la corta
  en dos puntos), mientras que una recta con pendiente distinta de cero, o una curva
  estrictamente creciente o decreciente en todo su dominio, lo cumple.'
definiciones_clave: '- **Reconocimiento de función inyectiva**: Elemento central en
  el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a reconocimiento de función inyectiva.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a reconocimiento de
    función inyectiva.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a reconocimiento de función inyectiva.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    reconocimiento de función inyectiva?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en tipos de funciones y función inversa
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en tipos de funciones y función inversa. Es la
    condición de existencia y unicidad en reconocimiento de función inyectiva.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en reconocimiento de función
    inyectiva, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Imagina o traza rectas horizontales a lo largo de todo el recorrido visible
  de la curva.'
- 'Paso 2: Cuenta cuántas veces cada recta horizontal corta la curva.'
- 'Paso 3: Si alguna recta corta la curva en más de un punto, la función no es inyectiva.'
- 'Paso 4: Si toda recta horizontal corta la curva en a lo más un punto, la función
  es inyectiva.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar reconocimiento de función inyectiva.
ejemplos:
- titulo: Aplicación a una parábola
  enunciado: Aplica el criterio de la línea horizontal a $f(x)=x^2$.
  solucion_pasos:
  - Para $y=4$, tanto $x=2$ como $x=-2$ satisfacen la ecuación.
  - Una recta horizontal en $y=4$ corta la curva en dos puntos.
  - No es inyectiva.
- titulo: Aplicación a una recta con pendiente distinta de cero
  enunciado: Aplica el criterio de la línea horizontal a $f(x)=-3x+2$.
  solucion_pasos:
  - Cualquier recta horizontal $y=b$ corta a esta recta en exactamente un punto.
  - Es inyectiva.
- titulo: ¿Una función constante cumple el criterio de la línea horizontal?
  enunciado: ¿Una función constante cumple el criterio de la línea horizontal?
  respuesta: 'No'
  solucion_pasos:
  - La recta horizontal correspondiente al valor constante coincide con toda la gráfica,
    cortándola en infinitos puntos.
- titulo: ¿El criterio de la línea horizontal verifica inyectividad o existencia de
    función?
  enunciado: ¿El criterio de la línea horizontal verifica inyectividad o existencia
    de función?
  respuesta: Inyectividad
  solucion_pasos:
  - El criterio de la línea vertical verifica si es función; el de la línea horizontal
    verifica inyectividad.
errores_frecuentes:
- Confundir el criterio de la línea horizontal con el de la línea vertical.
- Aplicar el criterio solo a una parte de la curva, sin revisar todo el recorrido.
- Concluir inyectividad basándose en la apariencia general sin verificar rigurosamente
  cada altura.
- Creer que toda parábola completa es inyectiva por ser una curva "simple".
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando reconocimiento
  de función inyectiva.
