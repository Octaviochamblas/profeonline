semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INYECTIVA_RECONOCIMIENTO
resumen_inicial: Reconocer una función inyectiva implica verificar que ninguna imagen
  pertenezca a más de una preimagen en tablas, diagramas o gráficos.
explicacion_simple: 'Para saber si una función es **inyectiva**:

  - **En diagramas sagitales:** A cada elemento del conjunto de llegada le llega A
  LO SUMO UNA flecha.

  - **En tablas de valores:** La fila/columna de resultados $f(x)$ NO TIENE números
  repetidos.

  - **En parábolas cuadráticas $f(x) = x^2$ en $\mathbb{R}$:** NO ES inyectiva porque
  $f(2) = 4$ y $f(-2) = 4$ (el $4$ recibe dos flechas).'
explicacion_formal: 'Dada la función $f: A \to B$, $f$ **NO es inyectiva** si se demuestra
  la existencia de un contraejemplo:


  $$\exists a, b \in A \quad \text{con } a \neq b \quad \text{tal que } f(a) = f(b)$$


  **Desglose de la fórmula:**

  - Prueba de no inyectividad mediante la exhibición explícita de dos preimágenes
  distintas que comparten la misma imagen.'
definiciones_clave: '- **Contraejemplo de inyectividad**: Par de entradas $a \neq
  b$ que satisfacen $f(a) = f(b)$.'
propiedades_relaciones: '- **Restricción de dominio**: Una función cuadrática $f(x)
  = x^2$ restringida al dominio $[0, +\infty[$ pasa a ser inyectiva.'
ejemplo_guiado:
  enunciado: Determina si la función $f(x) = x^2 + 1$ definida en $\mathbb{R}$ es
    inyectiva buscando un contraejemplo.
  pasos:
  - 'Paso 1: Probar con $x_1 = 3$ y $x_2 = -3$ (dos números distintos de $\mathbb{R}$).Paso
    2: Evaluar $f(3) = 3^2 + 1 = 9 + 1 = 10$.Paso 3: Evaluar $f(-3) = (-3)^2 + 1 =
    9 + 1 = 10$.Paso 4: Notar que $3 \neq -3$ pero $f(3) = f(-3) = 10$.Paso 5: Concluir
    que $f(x) = x^2 + 1$ en todo $\mathbb{R}$ NO es inyectiva.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar $f(3) = 10$ y $f(-3) = 10$ en $f(x) = x^2 + 1$ sobre $\mathbb{R}$,
    ¿qué se concluye respecto a su inyectividad?
  choices:
  - text: NO es inyectiva porque dos preimágenes distintas ($3$ y $-3$) comparten
      la misma imagen ($10$).
    is_correct: true
  - text: SÍ es inyectiva porque 10 es un número entero positivo.
    is_correct: false
  - text: Es sobreyectiva pero no función.
    is_correct: false
  - text: Es una función constante.
    is_correct: false
  explanation: La alternativa correcta es 'NO es inyectiva porque dos preimágenes
    distintas ($3$ y $-3$) comparten la misma imagen ($10$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se puede transformar la función cuadrática $f(x) = x^2 + 1$ para
    que resulte ser inyectiva?
  choices:
  - text: Restringiendo su dominio únicamente a los reales no negativos $[0, +\infty[$.
    is_correct: true
  - text: Cambiando la variable $x$ por $y$.
    is_correct: false
  - text: Sumando un número más grande.
    is_correct: false
  - text: Dividiendo por cero.
    is_correct: false
  explanation: La alternativa correcta es 'Restringiendo su dominio únicamente a los
    reales no negativos $[0, +\infty[$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Analizar la fórmula o gráfica de la función.'
- 'Paso 2: Buscar si existen valores opuestos (como $x$ y $-x$) que produzcan el mismo
  resultado.'
- 'Paso 3: Si se encuentra algún resultado repetido, declarar que no es inyectiva.'
- 'Paso 4: Si no hay repeticiones posibles (como en funciones afines o cúbicas), declarar
  que es inyectiva.'
errores_correccion: '- **Error común:** Creer que la función cuadrática $f(x) = x^2$
  es siempre inyectiva.

  - **Cómo corregirlo:** $f(x) = x^2$ en $\mathbb{R}$ NO es inyectiva porque cualquier
  número positivo y su negativo dan el mismo cuadrado.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de tipos de funciones y función inversa.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de tipos de funciones y función inversa.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función debe ser biyectiva para admitir función inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema fundamental de invertibilidad.
- titulo: ¿Las gráficas de f y su inversa son simétricas respecto a la recta y = x?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de reflexión especular de pares ordenados (x, y) a (y, x).
errores_frecuentes:
- Confundir el criterio de la línea horizontal (para inyectividad) con el criterio
  de la línea vertical (para ser función).
- Confundir la notación de función inversa $f^{-1}(x)$ con el recíproco o potencia
  $\frac{1}{f(x)}$.
- Intentar calcular la inversa de una función que no es biyectiva en los conjuntos
  considerados.
- Olvidar intercambiar las variables $x$ e $y$ al finalizar el algoritmo de despeje
  algebraico.
- Creer que la simetría gráfica de la función inversa es respecto al eje Y en lugar
  de la recta bisectriz $y = x$.
afirmaciones_verdaderas:
- Una función admite función inversa $f^{-1}$ si y solo si es biyectiva en sus conjuntos
  de definición.
- Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas respecto a
  la recta bisectriz del primer cuadrante $y = x$.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e identificar
  funciones inyectivas, sobreyectivas y biyectivas, calculando y verificando algebraicamente
  y gráficamente la función inversa.
