semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.LEY_SENOS_ENUNCIADO
resumen_inicial: 'Enunciado de la ley de senos para triángulos oblicuángulos: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: En triángulos que no son rectángulos, no se pueden usar directamente
  las razones trigonométricas del triángulo rectángulo, por lo que se necesitan herramientas
  específicas como la ley de senos.
explicacion_formal: '![Ley de senos](/static/img/geometria/trigonometria/oblicu-ley-senos-enunciado.svg)


  ### Definición formal


  En un triángulo de lados $a$, $b$, $c$ opuestos a los ángulos $A$, $B$, $C$ respectivamente,
  se cumple $\dfrac{a}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C}$.


  ### Desarrollo didáctico


  En la figura, el lado $a$ (BC) es opuesto al ángulo $A$, el lado $b$ (CA) es opuesto
  al ángulo $B$, y el lado $c$ (AB) es opuesto al ángulo $C$. La ley de senos permite
  relacionar cualquier par de estos lados con los senos de sus respectivos ángulos
  opuestos, sin necesidad de que el triángulo sea rectángulo.'
definiciones_clave: '- **Enunciado de la ley de senos para triángulos oblicuángulos**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a enunciado de la ley de senos para triángulos
  oblicuángulos.'
ejemplo_guiado:
  enunciado: Para analizar enunciado de la ley de senos para triángulos oblicuángulos,
    considera un ángulo $\alpha = 61^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1150^\circ = 61^\circ$.
  pasos:
  - Identificar la propiedad de enunciado de la ley de senos para triángulos oblicuángulos
    referida a $\alpha = 61^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1150 = 61 \implies x = 61 - 1150$.'
  - Concluir que la medida calculada para enunciado de la ley de senos para triángulos
    oblicuángulos es $x = -1089^\circ$.
