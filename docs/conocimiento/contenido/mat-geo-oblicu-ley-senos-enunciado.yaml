- titulo: ¿Se cumple siempre la propiedad principal de enunciado de la ley de senos
    para triángulos oblicuángulos en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
