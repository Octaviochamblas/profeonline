semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.FRACCIONES_EQUIVALENTES_CONCEPTO
resumen_inicial: Dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$ son equivalentes si representan exactamente la misma cantidad o punto en la recta numérica.
explicacion_simple: 'Dos fracciones son equivalentes cuando expresan la misma porción o valor del todo, aunque se escriban utilizando números diferentes en sus numeradores y denominadores. Es como cortar un pastel por la mitad o en cuatro cuartos y tomar dos: en ambos casos estamos comiendo exactamente la misma cantidad de pastel.


  ![Concepto de fracciones equivalentes](/static/img/nodos/concepto-de-fracciones-equivalentes-intro.svg)'
explicacion_formal: 'Dos fracciones $\frac{a}{b}, \frac{c}{d} \in \mathbb{Q}$ pertenecen a la misma **Clase de Equivalencia** si y solo si satisfacen la relación de equivalencia:


  $$\frac{a}{b} \sim \frac{c}{d} \iff a \cdot d = b \cdot c \iff \frac{a}{b} - \frac{c}{d} = 0$$


  **Desglose de la fórmula:**

  - $a \cdot d = b \cdot c$: Condición de igualdad en los productos cruzados.

  - Clase de equivalencia $[\frac{a}{b}]$: Conjunto de todas las representaciones fraccionarias de un mismo número racional en $\mathbb{Q}$.


  > **Complemento didáctico:** Un número racional es formalmente una clase de equivalencia completa compuesta por infinitas fracciones equivalentes.'
definiciones_clave: '- **Fracciones equivalentes**: Fracciones de diferente escritura que representan exactamente la misma cantidad numérica.

  - **Clase de equivalencia**: Conjunto de todas las fracciones que evalúan a un mismo racional.'
propiedades_relaciones: '- **Invarianza de valor**: Si $\frac{a}{b} \sim \frac{c}{d}$, su representación decimal es exactamente la misma.'
ejemplo_guiado:
  enunciado: 'Demuestre que las fracciones $\frac{2}{3}$ y $\frac{4}{6}$ son equivalentes comparando sus valores decimales y multiplicando en cruz.


    ![Ejemplo Concepto de fracciones equivalentes](/static/img/nodos/concepto-de-fracciones-equivalentes-ejemplos.svg)'
  pasos:
  - 'Paso 1: Calcular la expresión decimal de $\frac{2}{3}$: $2 : 3 = 0,666...$'
  - 'Paso 2: Calcular la expresión decimal de $\frac{4}{6}$: $4 : 6 = 0,666...$'
  - 'Paso 3: Verificar mediante productos cruzados: $2 \cdot 6 = 12$ y $3 \cdot 4 = 12$.'
  - 'Conclusión: Como $12 = 12$, las fracciones $\frac{2}{3}$ y $\frac{4}{6}$ son equivalentes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición de productos cruzados define que dos fracciones a/b y c/d sean equivalentes?
  choices:
  - text: a · d = b · c
    is_correct: true
  - text: a · b = c · d
    is_correct: false
  - text: a + d = b + c
    is_correct: false
  - text: a · c = b · d
    is_correct: false
  explanation: La alternativa correcta es 'a · d = b · c'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué 2/3 y 4/6 son equivalentes?
  choices:
  - text: Porque su producto cruzado 2 · 6 = 3 · 4 = 12 y representan la misma cantidad decimal
    is_correct: true
  - text: Porque 2 + 4 = 6
    is_correct: false
  - text: Porque ambas tienen el mismo denominador
    is_correct: false
  - text: Es una coincidencia
    is_correct: false
  explanation: La alternativa correcta es 'Porque su producto cruzado 2 · 6 = 3 · 4 = 12 y representan la misma cantidad decimal'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar el numerador de la primera fracción por el denominador de la segunda ($a \cdot d$).'
- 'Paso 2: Multiplicar el denominador de la primera fracción por el numerador de la segunda ($b \cdot c$).'
- 'Paso 3: Comprobar si ambos productos son idénticos para confirmar la equivalencia.'
errores_correccion: '- **Error 1: Creer que escribir números más grandes significa que la fracción vale más.** **Cómo corregirlo:** $\frac{50}{100} = \frac{1}{2}$; el valor numérico es idéntico a pesar de tener cifras mayores.


  - **Error 2: Sumar el mismo número al numerador y denominador creyendo que mantiene la equivalencia.** **Cómo corregirlo:** $\frac{1+2}{2+2} = \frac{3}{4} \neq \frac{1}{2}$; la equivalencia exige multiplicación/división, NUNCA suma.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es la fracción 3/5 equivalente a 9/15?
  alternativas:
  - Sí, porque 3 · 15 = 45 y 5 · 9 = 45
  - No, porque 9 es mayor que 3
  - Solo si se restan
  respuesta: Sí, porque 3 · 15 = 45 y 5 · 9 = 45
  solucion_pasos:
  - 'Productos cruzados: $3 \cdot 15 = 45$ y $5 \cdot 9 = 45$. Son equivalentes.'
- titulo: Ejemplo 2
  enunciado: ¿Son equivalentes las fracciones 1/2 y 2/3?
  alternativas:
  - No, porque 1 · 3 = 3 y 2 · 2 = 4 (distintos)
  - Sí, se diferencian en 1
  - Sí, ambas son propias
  respuesta: No, porque 1 · 3 = 3 y 2 · 2 = 4 (distintos)
  solucion_pasos:
  - $1 \cdot 3 = 3 \neq 4 = 2 \cdot 2$. No son equivalentes.
- titulo: ¿Representan dos fracciones equivalentes el mismo punto en la recta numérica?
  respuesta: Sí
  solucion_pasos:
  - Sí, corresponden al mismo valor numérico racional.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde con precisión a las reglas de equivalencia, simplificación o conversión analizadas.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el algoritmo matemático entrega un resultado único y bien definido.
  - texto: No es posible determinar la equivalencia
    es_correcta: false
    retroalimentacion: Incorrecto, los teoremas y algoritmos de fracciones permiten resolver unívocamente.
- titulo: ¿Es la fracción 5/10 equivalente a 1/2?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5 \cdot 2 = 10 \cdot 1 = 10$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde con precisión a las reglas de equivalencia, simplificación o conversión analizadas.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el algoritmo matemático entrega un resultado único y bien definido.
  - texto: No es posible determinar la equivalencia
    es_correcta: false
    retroalimentacion: Incorrecto, los teoremas y algoritmos de fracciones permiten resolver unívocamente.
errores_frecuentes:
- Dos fracciones equivalentes representan valores numéricos distintos en la recta numérica.
- Sumar una misma constante al numerador y denominador de una fracción genera una fracción equivalente.
- Una fracción con cifras más grandes es siempre mayor que una fracción con cifras pequeñas.
- Las fracciones equivalentes solo pueden crearse a partir de números enteros pares.
- Multiplicar en cruz dos fracciones equivalentes entrega como resultado el número cero.
afirmaciones_verdaderas:
- Dos fracciones son equivalentes si representan exactamente el mismo valor numérico o punto racional.
- La condición $a \cdot d = b \cdot c$ es suficiente y necesaria para la equivalencia entre $\frac{a}{b}$ y $\frac{c}{d}$.
al_terminar_debes_poder: '**QUÉ:** Comprender, identificar y generar fracciones equivalentes reconociendo que representan el mismo número racional.


  **CÓMO:** Comprobando la igualdad de productos cruzados $a \cdot d = b \cdot c$ ($b, d \neq 0$) y reconociendo su misma ubicación sobre la recta numérica real $\frac{a}{b} = \frac{c}{d} \in \mathbb{Q}$.


  ![Resumen Concepto de fracciones equivalentes](/static/img/nodos/concepto-de-fracciones-equivalentes-resumen.svg)'
