semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.FRACCIONES_EQUIVALENTES_CONCEPTO
resumen_inicial: "Las fracciones equivalentes son aquellas que representan exactamente la misma cantidad numérica o porción del entero, aunque sus numeradores y denominadores sean distintos."
explicacion_simple: |
  Imagina que compras dos pizzas idénticas. La primera la cortas en 2 partes iguales y te comes 1 trozo ($\frac{1}{2}$). La segunda la cortas en 4 partes iguales y te comes 2 trozos ($\frac{2}{4}$). Al final, ¿en qué caso comiste más pizza? En ninguno: comiste exactamente la misma cantidad de pizza en ambos casos. Decimos entonces que $\frac{1}{2}$ y $\frac{2}{4}$ son **fracciones equivalentes**: tienen números distintos pero valen exactamente lo mismo.
explicacion_formal: |
  Formalmente, dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$ (con $b, d \neq 0$) se definen como **fracciones equivalentes**, denotado $\frac{a}{b} \sim \frac{c}{d}$ o simplemente $\frac{a}{b} = \frac{c}{d}$, si y solo si satisfacen la igualdad de sus productos cruzados:
  $$a \cdot d = b \cdot c$$

  En la recta numérica, dos fracciones equivalentes ocupan exactamente el mismo punto de coordenada real. Asimismo, forman una clase de equivalencia en el conjunto $\mathbb{Q}$, donde cada número racional representa al conjunto infinito de todas sus fracciones equivalentes.
definiciones_clave: |
  - **Fracciones equivalentes**: Fracciones que representan la misma razón cuantitativa o el mismo valor en $\mathbb{R}$.
  - **Igualdad de productos cruzados**: Criterio fundamental $a \cdot d = b \cdot c$ para comprobar equivalencia.
  - **Clase de equivalencia**: Conjunto formado por todas las fracciones que representan un mismo número racional.
propiedades_relaciones: |
  - **Relación de equivalencia**: La relación de equivalencia entre fracciones cumple las propiedades reflexiva ($\frac{a}{b} = \frac{a}{b}$), simétrica ($\frac{a}{b} = \frac{c}{d} \implies \frac{c}{d} = \frac{a}{b}$) y transitiva.
  - **Representante canónico**: Cada clase de equivalencia contiene una única fracción irreductible con denominador positivo que la representa.
  - **Conservación de la porción**: Amplificar o simplificar una fracción no altera la proporción física o abstracta que representa del entero.
ejemplo_guiado:
  enunciado: "Comprueba si las fracciones $\\frac{3}{5}$ y $\\frac{12}{20}$ son equivalentes aplicando el criterio de productos cruzados y simplificación."
  pasos:
    - "Aplicar el criterio de productos cruzados $a \\cdot d = b \\cdot c$: calcular $3 \\cdot 20$ y $5 \\cdot 12$."
    - "Efectuar las multiplicaciones: $3 \\cdot 20 = 60$ y $5 \\cdot 12 = 60$."
    - "Comparar los resultados: como $60 = 60$, se verifica formalmente que $\\frac{3}{5} = \\frac{12}{20}$ son fracciones equivalentes."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué criterio algebraico determina de manera necesaria y suficiente si dos fracciones $\\frac{a}{b}$ y $\\frac{c}{d}$ son equivalentes?"
    choices:
      - {text: 'El producto cruzado del primer numerador por el segundo denominador debe ser igual al producto del primer denominador por el segundo numerador ($a \cdot d = b \cdot c$).', is_correct: true}
      - {text: "La suma de numeradores debe ser igual a la suma de denominadores ($a + c = b + d$).", is_correct: false}
      - {text: "El numerador $a$ debe ser obligatoriamente igual al numerador $c$.", is_correct: false}
      - {text: "Ambas fracciones deben ser siempre impropias.", is_correct: false}
    explanation: 'La correcta es El producto cruzado del primer numerador por el segundo denominador debe ser igual al producto del primer denominador por el segundo numerador ($a \cdot d = b \cdot c$).: la igualdad de productos cruzados define la equivalencia en $\mathbb{Q}$.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cuál de las siguientes fracciones es equivalente a $\\frac{4}{7}$?"
    choices:
      - {text: "$\\frac{12}{21}$", is_correct: true}
      - {text: "$\\frac{8}{21}$", is_correct: false}
      - {text: "$\\frac{12}{14}$", is_correct: false}
      - {text: "$\\frac{16}{21}$", is_correct: false}
    explanation: 'La correcta es \frac{12}{21}: multiplicando numerador y denominador de $\frac{4}{7}$ por $3$ se obtiene $\frac{4 \cdot 3}{7 \cdot 3} = \frac{12}{21}$ ($4 \cdot 21 = 84 = 7 \cdot 12$).'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Tomar dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$."
  - 'Paso 2: Calcular el primer producto cruzado $a \cdot d$.'
  - 'Paso 3: Calcular el segundo producto cruzado $b \cdot c$.'
  - 'Paso 4: Si $a \cdot d = b \cdot c$, las fracciones son equivalentes; de lo contrario, representan valores distintos.'
errores_correccion: |
  Un error frecuente es sumar la misma cantidad al numerador y al denominador creyendo que genera una fracción equivalente (por ejemplo, pensar que $\frac{1}{2} = \frac{1+2}{2+2} = \frac{3}{4}$). La equivalencia se obtiene únicamente por **multiplicación o división** por un mismo número, nunca por suma o resta.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Son las fracciones $\\frac{2}{3}$ y $\\frac{10}{15}$ equivalentes?"
    alternativas:
      - "Sí, porque $2 \\cdot 15 = 30$ y $3 \\cdot 10 = 30$."
      - "No, porque 10 y 15 son números mucho más grandes que 2 y 3."
      - "No, porque una es propia y la otra es impropia."
    respuesta: "Sí, porque $2 \\cdot 15 = 30$ y $3 \\cdot 10 = 30$."
    solucion_pasos:
      - "Calculamos el producto cruzado $2 \\cdot 15 = 30$."
      - "Calculamos el otro producto cruzado $3 \\cdot 10 = 30$."
      - "Al ser ambos iguales a 30, las fracciones son equivalentes."
  - titulo: "Ejemplo 2"
    enunciado: "En un examen, Juan respondió correctamente 18 de 24 preguntas, mientras que María respondió correctamente 15 de 20 preguntas. ¿Lograron el mismo rendimiento proporcional?"
    alternativas:
      - "$Sí, porque \\frac{18}{24} y \\frac{15}{20} son fracciones equivalentes que representan el 75% del examen.$"
      - "No, Juan tuvo mejor rendimiento porque respondió más preguntas en total."
      - "No, María tuvo peor rendimiento."
    respuesta: "$Sí, porque \\frac{18}{24} y \\frac{15}{20} son fracciones equivalentes que representan el 75% del examen.$"
    solucion_pasos:
      - "Comprobamos productos cruzados: $18 \\cdot 20 = 360$ y $24 \\cdot 15 = 360$."
      - "Como $360 = 360$, ambas fracciones son equivalentes a $\\frac{3}{4}$ (75% del examen)."
  - titulo: "¿Se ubican dos fracciones equivalentes exactamente en el mismo punto de la recta numérica?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, representan exactamente el mismo valor decimal y número racional."
  - titulo: "¿Es válido sumar 5 al numerador y 5 al denominador para obtener una fracción equivalente?"
    respuesta: "No"
    solucion_pasos:
      - "No, la suma altera la razón cuantitativa. La equivalencia solo se conserva multiplicando o dividiendo por el mismo factor nonulo."
errores_frecuentes:
  - "Creer que sumar o restar el mismo número a numerador y denominador mantiene la equivalencia."
  - "Confundir productos cruzados ($a \\cdot d = b \\cdot c$) con sumar en cruz."
  - "Pensar que dos fracciones con números distintos nunca pueden representar la misma cantidad."
  - "Olvidar verificar que los denominadores sean distintos de cero al evaluar equivalencia."
  - "Creer que una fracción amplificada representa un trozo físico más grande del entero."
afirmaciones_verdaderas:
  - "Dos fracciones equivalentes representan exactamente el mismo valor numérico y ocupan el mismo punto en la recta numérica."
  - "Si $a \\cdot d = b \\cdot c$, entonces las fracciones $\\frac{a}{b}$ y $\\frac{c}{d}$ son equivalentes."
al_terminar_debes_ponder: |
  Debes ser capaz de identificar y verificar si dos fracciones son equivalentes mediante productos cruzados o simplificación, y comprender su igualdad en la recta numérica.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
