semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.DESIGUALDAD_NUMERICA
resumen_inicial: Una desigualdad numérica es una proposición matemática formada por
  constantes sin incógnitas que es absolutamente verdadera o falsa.
explicacion_simple: 'Una **desigualdad numérica** compara dos números conocidos mediante
  un símbolo de orden (como $7 > 2$ o $-3 \ge 5$).

  A diferencia de las inecuaciones con letras, una desigualdad numérica no tiene nada
  que despejar; es simplemente una afirmación directa de la que podemos decir inmediatamente
  si es VERDADERA o FALSA.'
explicacion_formal: 'Una **desigualdad numérica** es una proposición cerrada de la
  forma:


  $$A \ R \ B \quad \text{donde } A, B \in \mathbb{R} \quad \text{y } R \in \{<, >,
  \le, \ge\}$$


  **Desglose de la fórmula:**

  - $A, B$: Constantes numéricas reales sin variables.

  - $v(A \ R \ B) \in \{\text{Verdadero}, \text{Falso}\}$: Valor de verdad determinable
  unívocamente.'
definiciones_clave: '- **Desigualdad numérica**: Proposición cerrada formada exclusivamente
  por números constantes y un símbolo de desigualdad.

  - **Valor de verdad**: Calificación lógica de una proposición numérica como absolutamente
  Verdadera o Falsa.'
propiedades_relaciones: '- **Cierre proposicional**: No depende de variables ni de
  dominios de incógnita.'
ejemplo_guiado:
  enunciado: Determina el valor de verdad de la desigualdad numérica $3(4 - 6) \ge
    -10$.
  pasos:
  - 'Paso 1: Evaluar el miembro izquierdo: $3(4 - 6) = 3(-2) = -6$.Paso 2: Escribir
    la desigualdad simplificada: $-6 \ge -10$.Paso 3: Comparar en la recta numérica:
    $-6$ está a la derecha de $-10$, luego $-6 > -10$ es verdadero.Paso 4: Concluir
    que la desigualdad numérica $3(4 - 6) \ge -10$ es **VERDADERA**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué caracteriza a una desigualdad numérica frente a una inecuación algebraico-literal?
  choices:
  - text: Que está compuesta exclusivamente por constantes numéricas y su valor de
      verdad es determinable de inmediato.
    is_correct: true
  - text: Que siempre contiene una o más incógnitas por despejar.
    is_correct: false
  - text: Que carece de valor de verdad en los números reales.
    is_correct: false
  - text: Que solo se puede expresar mediante gráficos.
    is_correct: false
  explanation: La alternativa correcta es 'Que está compuesta exclusivamente por constantes
    numéricas y su valor de verdad es determinable de inmediato.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al simplificar el miembro izquierdo de $3(4 - 6) \ge -10$, ¿cuál es el
    valor numérico obtenido y su veracidad?
  choices:
  - text: $-6$, siendo la desigualdad $-6 \ge -10$ Verdadera.
    is_correct: true
  - text: $6$, siendo la desigualdad $6 \ge -10$ Falsa.
    is_correct: false
  - text: $-2$, siendo la desigualdad $-2 \ge -10$ Falsa.
    is_correct: false
  - text: $-10$, siendo la desigualdad no válida.
    is_correct: false
  explanation: La alternativa correcta es '$-6$, siendo la desigualdad $-6 \ge -10$
    Verdadera.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver las operaciones aritméticas del primer miembro.'
- 'Paso 2: Resolver las operaciones aritméticas del segundo miembro.'
- 'Paso 3: Comparar ambos resultados finales usando las propiedades de la recta numérica.'
- 'Paso 4: Declarar la desigualdad como Verdadera o Falsa.'
errores_correccion: '- **Error común:** Intentar ''despejar'' una desigualdad numérica
  que no contiene variables.

  - **Cómo corregirlo:** En desigualdades numéricas solo debes CALCULAR los resultados
  de cada lado y comprobar si la relación se cumple.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de orden.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de orden.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El conjunto de los números reales es un conjunto ordenado?
  respuesta: Sí
  solucion_pasos:
  - Sí, permite comparar cualquier par de números reales.
- titulo: ¿La frase 'a lo sumo' se traduce con el símbolo menor o igual que?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'a lo sumo' establece una cota superior inclusiva ($\\le$).
errores_frecuentes:
- Creer que el número con mayor valor absoluto negativo es el número mayor.
- Confundir la orientación de los símbolos mayor que ($>$) y menor que ($<$).
- Pensar que las desigualdades no estrictas ($\ge, \le$) prohíben la igualdad exacta.
- Traducir frases de cota como 'al menos' excluyendo el número límite.
- Tratar una desigualdad numérica cerrada como si tuviera una variable por despejar.
afirmaciones_verdaderas:
- 'La ley de tricotomía garantiza que para dos números reales $a$ y $b$ se cumple
  una y solo una de las tres opciones: $a < b$, $a = b$ o $a > b$.'
- La expresión 'como máximo $k$' se traduce mediante la desigualdad no estricta $x
  \le k$.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar la relación de orden
  en $\mathbb{R}$, emplear los símbolos de desigualdad e interpretar restricciones
  verbales.
fuente: Texto escolar MINEDUC — Álgebra / Desigualdades e Inecuaciones
