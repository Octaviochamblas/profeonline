semantic_id: MAT.NUM.RAZONES_PROPORCIONES.TERCERA_PROPORCIONAL
resumen_inicial: 'La tercera proporcional es el extremo desconocido $x$ en una proporción continua entre dos términos dados $a$ y $b$: $\frac{a}{b} = \frac{b}{x} \implies x = \frac{b^2}{a}$ ($a \neq 0$).'
explicacion_simple: "![Tercera proporcional](/static/img/nodos/calculo-de-la-tercera-proporcional-intro.svg)\n\nLa **tercera proporcional** se calcula cuando nos dan solo **dos números** ($a$ y $b$) y el segundo término se **repite en el medio**:\n- Se plantea la proporción continua: $\\frac{a}{b} = \\frac{b}{x}$.\n- Para despejar $x$, elevamos el segundo término al cuadrado y dividimos por el primero:\n$$x = \\frac{b^2}{a}$$\n- **Ejemplo:** Tercera proporcional entre $4$ y $6$:\n  - Planteamos $\\frac{4}{6} = \\frac{6}{x}$.\n  - $x = \\frac{6^2}{4} = \\frac{36}{4} = 9$.\n  - Comprobación: $\\frac{4}{6} = \\frac{2}{3}$ y $\\frac{6}{9} = \\frac{2}{3}$ (¡iguales!)."
explicacion_formal: 'Dados dos elementos $a, b \in \mathbb{R}$ con $a \neq 0$ y $b \neq 0$, se define formalmente como **tercera proporcional** de $a$ y $b$ al valor $x \in \mathbb{R}$ que completa la proporción continua:


  $$\frac{a}{b} = \frac{b}{x}$$


  **Deducción y Fórmula:**

  Aplicando el producto cruzado $a \cdot x = b \cdot b = b^2$:


  $$x = \frac{b^2}{a}$$


  **Diferencia Conceptual:**

  - **Cuarta proporcional**: Requiere 3 datos distintos $\implies \frac{a}{b} = \frac{c}{x} \implies x = \frac{bc}{a}$.

  - **Tercera proporcional**: Requiere 2 datos (el 2° se repite) $\implies \frac{a}{b} = \frac{b}{x} \implies x = \frac{b^2}{a}$.'
definiciones_clave: '- **Tercera proporcional ($x$)**: Cuarto término en una proporción continua donde el 2° término se repite como medio.

  - **Término repetido ($b$)**: Actúa como consecuente de la primera razón y antecedente de la segunda.

  - **Fórmula directa**: $x = \frac{b^2}{a}$.'
propiedades_relaciones: '- **No conmutatividad**: La tercera proporcional de $(a, b)$ es $\frac{b^2}{a}$, mientras que la de $(b, a)$ es $\frac{a^2}{b}$.

  - **Progresión geométrica**: Los términos $a, b, x$ forman los tres primeros términos de una progresión geométrica de razón $r = \frac{b}{a}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de tercera proporcional](/static/img/nodos/calculo-de-la-tercera-proporcional-ejemplos.svg)


    Calcule la tercera proporcional entre $4$ y $6$, y luego entre $8$ y $12$.'
  pasos:
  - 'Paso 1: Para $4$ y $6$: Plantear en orden $\frac{4}{6} = \frac{6}{x}$.'
  - 'Paso 2: Elevar al cuadrado el segundo término: $6^2 = 36$.'
  - 'Paso 3: Dividir por el primer término: $x = \frac{36}{4} = 9$.'
  - 'Paso 4: Para $8$ y $12$: Plantear $\frac{8}{12} = \frac{12}{x}$.'
  - 'Paso 5: Calcular $x = \frac{12^2}{8} = \frac{144}{8} = 18$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la tercera proporcional $x$ entre $a$ y $b$?
  choices:
  - text: $x = \frac{b^2}{a}$
    is_correct: true
  - text: $x = \frac{a^2}{b}$
    is_correct: false
  - text: $x = \sqrt{a \cdot b}$
    is_correct: false
  - text: $x = 2b - a$
    is_correct: false
  explanation: La alternativa correcta es '$x = \frac{b^2}{a}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la tercera proporcional entre 4 y 6 es 9?
  choices:
  - text: Porque al plantear $\frac{4}{6} = \frac{6}{9}$, ambas razones equivalen a $\frac{2}{3}$
    is_correct: true
  - text: Porque 4 + 6 - 1 = 9
    is_correct: false
  - text: Porque 9 es el siguiente número impar
    is_correct: false
  - text: Porque 6 x 4 = 24 y 24 / 9 no da exacto
    is_correct: false
  explanation: La alternativa correcta es 'Porque al plantear $\frac{4}{6} = \frac{6}{9}$, ambas razones equivalen a $\frac{2}{3}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el primer término ($a$) y el segundo término ($b$).'
- 'Paso 2: Plantear la proporción continua $\frac{a}{b} = \frac{b}{x}$.'
- 'Paso 3: Calcular el cuadrado del segundo término $b^2$ y dividirlo por el primero: $x = \frac{b^2}{a}$.'
errores_correccion: "- **Error 1: Invertir la fórmula ($\frac{a}{b^2}$ en vez de $\frac{b^2}{a}$).** **Cómo corregirlo:** La incógnita $x$ está en el denominador final, por lo que $x = \\frac{b^2}{a}$.\n- **Error 2: Confundir con la cuarta proporcional.** **Cómo corregirlo:** La tercera proporcional solo tiene 2 datos de entrada; el 2° se repite en el medio."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la tercera proporcional entre $2$ y $8$?
  alternativas:
  - $32$
  - $16$
  - $64$
  respuesta: $32$
  solucion_pasos:
  - $x = \frac{8^2}{2} = \frac{64}{2} = 32$.
- titulo: Ejemplo 2
  enunciado: Halle la tercera proporcional entre $9$ y $6$.
  alternativas:
  - $4$
  - $3$
  - $2$
  respuesta: $4$
  solucion_pasos:
  - $x = \frac{6^2}{9} = \frac{36}{9} = 4$.
- titulo: ¿Es 25 la tercera proporcional entre 4 y 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x = \frac{10^2}{4} = \frac{100}{4} = 25$.
  alternativas:
  - texto: Sí, porque 10² / 4 = 100 / 4 = 25
    es_correcta: true
    retroalimentacion: ¡Correcto! Proporción continua $4/10 = 10/25 = 0,4$.
  - texto: No, es 20
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo con $b^2/a$ da 25.
  - texto: No, es 16
    es_correcta: false
    retroalimentacion: Incorrecto, $10^2 = 100$, y $100/4 = 25$.
- titulo: ¿Cambia la tercera proporcional si se invierte el orden de los datos a (b, a)?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{b^2}{a} \neq \frac{a^2}{b}$ a menos que $a = b$.
  alternativas:
  - texto: Sí, el orden de los datos es estrictamente determinante
    es_correcta: true
    retroalimentacion: ¡Correcto! No es conmutativo.
  - texto: No, da el mismo número
    es_correcta: false
    retroalimentacion: Incorrecto, por ejemplo entre (2, 8) da 32, pero entre (8, 2) da 0,5.
  - texto: No, solo cambia el signo
    es_correcta: false
    retroalimentacion: Incorrecto, cambia el valor numérico absoluto.
errores_frecuentes:
- Invertir el orden de los términos en la fórmula ($a^2/b$).
- Confundir tercera proporcional con media proporcional.
- Olvidar elevar al cuadrado el segundo término.
- Asumir que la operación es conmutativa.
afirmaciones_verdaderas:
- La tercera proporcional completa una proporción continua a partir de dos términos dados.
- Se calcula mediante la fórmula $x = \frac{b^2}{a}$.
- Los términos $a, b, x$ forman los tres primeros términos de una progresión geométrica.
al_terminar_debes_poder: '![Síntesis de tercera proporcional](/static/img/nodos/calculo-de-la-tercera-proporcional-resumen.svg)


  QUÉ: Calcular la tercera proporcional entre dos cantidades dadas en una proporción continua.


  CÓMO: Planteando $\frac{a}{b} = \frac{b}{x}$ y despejando el extremo desconocido mediante la fórmula $x = \frac{b^2}{a}$.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
