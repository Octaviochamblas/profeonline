resumen_inicial: La tercera proporcional es el término extremo desconocido $x$ en
  una proporción continua $\frac{a}{b} = \frac{b}{x}$, despejándose como $x = \frac{b^2}{a}$.
explicacion_simple: En una proporción donde los dos números del centro son iguales
  ($a/b = b/x$), el cuarto término $x$ se llama tercera proporcional y se encuentra
  elevando al cuadrado el término medio $b$ y dividiéndolo por el primer extremo $a$.
explicacion_formal: 'Para dos datos $a, b \in \mathbb{R}$ ($a, b \neq 0$), la **Tercera
  Proporcional $x$** es el término faltante en la proporción continua de tres elementos
  distinguidos:


  $$\frac{a}{b} = \frac{b}{x} \implies a \cdot x = b^2 \implies x = \frac{b^2}{a}$$


  **Diferencia funcional:**

  - Cuarta proporcional: Involucra 4 datos distintos ($a, b, c, x$).

  - Tercera proporcional: Involucra 3 datos donde el medio se repite ($a, b, b, x$).'
definiciones_clave: '- **Tercera proporcional**: Término $x = \frac{b^2}{a}$ en la
  proporción continua $\frac{a}{b} = \frac{b}{x}$.'
propiedades_relaciones: '- **Proporción continua**: Estructura con medios idénticos
  $b$ y extremo $x = b^2 / a$.'
ejemplo_guiado:
  enunciado: Calcule la tercera proporcional $x$ entre $8$ y $12$.
  pasos:
  - 'Paso 1: Plantear la proporción continua con $a=8$ y $b=12$: $\frac{8}{12} = \frac{12}{x}$.'
  - 'Paso 2: Aplicar el producto cruzado: $8 \cdot x = 12^2 = 144$.'
  - 'Paso 3: Despejar $x$ dividiendo por $8$: $x = \frac{144}{8} = 18$.'
  - 'Conclusión: La tercera proporcional es $x = 18$ (comprobación: $8/12 = 12/18
    = 2/3$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula la tercera proporcional x en la proporción continua a/b
    = b/x?
  choices:
  - text: 'Elevando al cuadrado el término medio b y dividiendo por a: x = b^2 / a'
    is_correct: true
  - text: Restando x = b^2 - a
    is_correct: false
  - text: Sumando x = 2b + a
    is_correct: false
  - text: Dividiendo x = a / b^2
    is_correct: false
  explanation: 'La alternativa correcta es ''Elevando al cuadrado el término medio
    b y dividiendo por a: x = b^2 / a''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para a = 8 y b = 12, ¿cuál fue la tercera proporcional
    x?
  choices:
  - text: 18 (porque 144 / 8 = 18)
    is_correct: true
  - text: '24'
    is_correct: false
  - text: '16'
    is_correct: false
  - text: '36'
    is_correct: false
  explanation: La alternativa correcta es '18 (porque 144 / 8 = 18)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la tercera proporcional
  $x = \frac{b^2}{a}$ en proporciones continuas.
semantic_id: MAT.NUM.PROPORCIONES.TERCERA_PROPORCIONAL
procedimiento:
- 'Paso 1: Identificar los términos extremos $(a, d)$ y medios $(b, c)$ en la proporción
  $a/b = c/d$.'
- 'Paso 2: Aplicar la propiedad o regla requerida (producto cruzado, cuarta/media/tercera
  proporcional o composición/descomposición).'
- 'Paso 3: Resolver algebraicamente y verificar la igualdad de las razones resultantes.'
errores_correccion: '- **Error 1: Multiplicar numeradores con numeradores en lugar
  del producto cruzado ($a \cdot c = b \cdot d$).** **Cómo corregirlo:** El producto
  cruzado combina EXTREMOS con MEDIOS ($a \cdot d = b \cdot c$).


  - **Error 2: Confundir la media proporcional con la media aritmética (promedio).**
  **Cómo corregirlo:** La media proporcional es una media GEOMÉTRICA ($x = \sqrt{ab}$),
  no un promedio sumar/dividir.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROPORCIONES.TERCERA_PROPORCIONAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de proporciones.
- titulo: Ejemplo 2
  enunciado: Verificación de igualdad cruzada.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración por producto cruzado a · d = b · c.
- titulo: ¿Es a · d = b · c válido para toda proporción?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema Fundamental de las Proporciones.
- titulo: ¿Permite la composición mantener la equivalencia de razones?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(a+b)/b = (c+d)/d$ conserva la razón equivalente.
errores_frecuentes:
- Multiplicar los numeradores entre sí al aplicar la prueba del producto cruzado en
  una proporción.
- Declarar la posición de los términos medios con los términos extremos en una proporción
  escrita en fila.
- Calcular la media proporcional utilizando el promedio aritmético sumar y dividir
  entre dos.
- Invertir únicamente uno de los dos lados de la igualdad al aplicar la composición
  proporcional.
- Restar los términos extremos en lugar de despejar la cuarta proporcional por división.
afirmaciones_verdaderas:
- Una proporción es la igualdad entre dos razones $\frac{a}{b} = \frac{c}{d}$ que
  satisface el producto cruzado $a \cdot d = b \cdot c$.
- La media proporcional entre dos números positivos $a$ y $b$ equivale a su media
  geométrica $x = \sqrt{a \cdot b}$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
