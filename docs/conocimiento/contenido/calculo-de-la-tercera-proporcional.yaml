semantic_id: MAT.NUM.PROPORCIONES.TERCERA_PROPORCIONAL
resumen_inicial: 'La tercera proporcional de dos números $a$ y $b$ es el cuarto término $c$ de una proporción continua $\frac{a}{b} = \frac{b}{c}$, dada por la fórmula $c = \frac{b^2}{a}$.'
explicacion_simple: |
  Cuando tienes dos números $a$ y $b$ (por ejemplo, 4 y 6) y quieres formar una proporción continua ($\frac{4}{6} = \frac{6}{c}$), el número nuevo $c$ que queda al final se llama **tercera proporcional**. Para calcularlo, elevas al cuadrado el segundo número ($6^2 = 36$) y lo divides entre el primero ($36 \div 4 = 9$). Por lo tanto, la tercera proporcional de 4 y 6 es 9.
explicacion_formal: |
  ### Definición formal
  En una **proporción geométrica continua**:
  $$\frac{a}{b} = \frac{b}{c} \quad (a, b \neq 0)$$
  el cuarto término $c$ recibe el nombre de **tercera proporcional** del par ordenado de números $(a, b)$.

  ### Fórmula de cálculo analítico
  Aplicando el Teorema Fundamental de las Proporciones:
  $$a \cdot c = b \cdot b \implies a \cdot c = b^2 \implies c = \frac{b^2}{a}$$

  ### Diferencia con la cuarta proporcional
  Mientras que la cuarta proporcional requiere de tres números distintos en la entrada ($a, b, c \implies x = \frac{b \cdot c}{a}$), la tercera proporcional se calcula a partir de **solo dos números dados ($a, b$)** al repetir el segundo número en los medios.

  ### Síntesis didáctica
  - Ecuación continua: $\frac{a}{b} = \frac{b}{c}$.
  - Algoritmo de cálculo: $c = \frac{b^2}{a}$.
definiciones_clave: |
  - **Tercera proporcional $c$**: Término extremo final $c = \frac{b^2}{a}$ de una proporción continua.
  - **Segundo número $b$**: Cantidad dada en la segunda posición que se duplica como término medio.
  - **Secuencia ordenada $(a, b)$**: Par de datos de entrada donde el orden determina cuál actúa de divisor.
propiedades_relaciones: |
  - **Inversión de roles**: Si se pide la tercera proporcional del par $(b, a)$ en lugar de $(a, b)$, la fórmula cambia a $c' = \frac{a^2}{b}$.
  - **Progresión geométrica**: Los tres términos $a, b, c$ forman los tres primeros elementos de una progresión geométrica de razón $r = \frac{b}{a}$.
ejemplo_guiado:
  enunciado: 'Calcula la tercera proporcional de los números $a = 8$ y $b = 12$ tomados en ese orden.'
  pasos:
    - 'Paso 1: Planteamos la proporción continua repitiendo el segundo número $12$ al centro: $\frac{8}{12} = \frac{12}{c}$.'
    - 'Paso 2: Aplicamos el producto cruzado: $8 \cdot c = 12 \cdot 12$.'
    - 'Paso 3: Elevamos al cuadrado el segundo término: $12^2 = 144 \implies 8c = 144$.'
    - 'Paso 4: Despejamos $c$ dividiendo por el primer término: $c = \frac{144}{8} = 18$. La tercera proporcional es **18**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la tercera proporcional $c$ entre dos números $a$ y $b$ en la proporción $\frac{a}{b} = \frac{b}{c}$?'
    choices:
      - {text: '$c = \frac{b^2}{a}$, elevando al cuadrado el segundo número y dividiéndolo por el primero', is_correct: true}
      - {text: '$c = \sqrt{a \cdot b}$, sacando la raíz cuadrada del producto', is_correct: false}
      - {text: '$c = \frac{a^2}{b}$, invirtiendo los roles de los números', is_correct: false}
      - {text: '$c = a \cdot b^2$, multiplicando directo sin dividir', is_correct: false}
    explanation: 'La alternativa correcta es ''$c = \frac{b^2}{a}$, elevando al cuadrado el segundo número y dividiéndolo por el primero''. De $a \cdot c = b^2$ despejamos $c = \frac{b^2}{a}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la tercera proporcional de los números $2$ y $6$?'
    choices:
      - {text: '$18$, mediante la operación $c = \frac{6^2}{2} = \frac{36}{2} = 18$', is_correct: true}
      - {text: '$12$, multiplicando $2 \cdot 6$', is_correct: false}
      - {text: '$3$, dividiendo $6 / 2$', is_correct: false}
      - {text: '$9$, haciendo $6 / 2$ al cuadrado', is_correct: false}
    explanation: 'La alternativa correcta es ''$18$, mediante la operación $c = \frac{6^2}{2} = \frac{36}{2} = 18$''. Elevamos $6^2 = 36$ y dividimos entre $2$, obteniendo $18$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer número $a$ y el segundo número $b$ en el par ordenado.'
  - 'Paso 2: Formular la proporción continua $\frac{a}{b} = \frac{b}{c}$.'
  - 'Paso 3: Elevar al cuadrado el segundo número ($b^2$).'
  - 'Paso 4: Dividir el cuadrado $b^2$ entre el primer número $a$ para obtener la tercera proporcional $c = \frac{b^2}{a}$.'
errores_correccion: |
  - **Error 1:** Elevar al cuadrado el primer número en lugar del segundo (ej: calcular la tercera de 4 y 6 como $\frac{4^2}{6} = \frac{16}{6}$). **Cómo corregirlo:** En la proporción $\frac{a}{b} = \frac{b}{c}$, el término que se repite y se eleva al cuadrado es **el SEGUNDO número $b$**: $c = \frac{b^2}{a}$.
  - **Error 2:** Confundir la tercera proporcional con la media proporcional. **Cómo corregirlo:** La media proporcional busca el término del centro ($b = \sqrt{ac}$); la tercera proporcional busca el **término final de la serie ($c = \frac{b^2}{a}$)**.
ejemplos:
  - titulo: 'Tercera proporcional de números enteros'
    enunciado: '¿La tercera proporcional de $5$ y $10$ es igual a $20$?'
    alternativas:
      - 'Sí, pues $c = 10^2 / 5 = 100 / 5 = 20$'
      - 'No, es 15'
      - 'No, es 50'
    respuesta: 'Sí, pues $c = 10^2 / 5 = 100 / 5 = 20$'
    solucion_pasos:
      - '1. Elevamos al cuadrado el 2.º número: $10^2 = 100$.'
      - '2. Dividimos por el 1.º: $c = 100 / 5 = 20$.'
  - titulo: 'Tercera proporcional fraccionaria'
    enunciado: '¿La tercera proporcional de $3$ y $5$ equivale a $25/3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $c = 5^2 / 3 = 25/3$.'
  - titulo: 'Verificación en proporción continua'
    enunciado: '¿El número $32$ es la tercera proporcional de $8$ y $16$ porque $\frac{8}{16} = \frac{16}{32} = 0.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Mantiene la razón $0.5$ constante.'
  - titulo: 'Inversión de orden de entrada'
    enunciado: '¿La tercera proporcional del par $(10, 5)$ es $2.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $c = 5^2 / 10 = 25 / 10 = 2.5$.'
errores_frecuentes:
  - 'Elevar al cuadrado el primer término $a$ en lugar del término medio $b$.'
  - 'La fórmula de la tercera proporcional $c$ se calcula mediante la raíz cuadrada del producto $a \cdot b$.'
  - 'En la tercera proporcional se requieren tres números de entrada distintos en lugar de un par.'
  - 'Invertir el orden de los datos asignando el divisor al segundo número.'
  - 'En la tercera proporcional se requieren tres números de entrada distintos en lugar de un par.'
