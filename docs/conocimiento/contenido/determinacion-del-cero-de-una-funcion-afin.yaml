semantic_id: MAT.ALG.FUNCION_AFIN.CERO_FUNCION
resumen_inicial: El cero o raíz de una función afín es el valor de entrada $x_0$ para el cual la salida se anula ($f(x_0) = 0$).
explicacion_simple: |
  El **cero de una función** (también llamado raíz) es el número $x$ que hace que la función devuelva cero:

  1. Tomas la fórmula $f(x) = mx + b$.
  2. La igualas a cero: $mx + b = 0$.
  3. Despejas $x$: $x = -\frac{b}{m}$.

  Ese valor $x_0 = -\frac{b}{m}$ es la solución o raíz de la función.
explicacion_formal: |
  Sea $f: \mathbb{R} \to \mathbb{R}$ una función afín dada por $f(x) = mx + b$ con $m \neq 0$. El **cero o raíz** de $f$ es el elemento $x_0 \in \text{Dom}(f)$ tal que:

  $$f(x_0) = 0 \iff m x_0 + b = 0 \iff x_0 = -\frac{b}{m}$$

  **Interpretación algebraica vs geométrica:**
  - **Algebraica**: Solución única de la ecuación de primer grado $mx + b = 0$.
  - **Geométrica**: Abscisa del punto donde la recta cruza al eje horizontal $X$, es decir, el punto $(x_0, 0)$.
definiciones_clave: |
  - **Cero de una función (raíz)**: Valor del dominio cuya imagen mediante la función es exactamente cero ($f(x_0) = 0$).
propiedades_relaciones: |
  - **Unicidad de la raíz**: Toda función afín con pendiente no nula ($m \neq 0$) posee exactamente un único cero real.
ejemplo_guiado:
  enunciado: "Encuentra el cero de la función afín $f(x) = 2x - 10$ e interpreta su significado geométrico."
  pasos:
    - 'Paso 1: Plantear la ecuación $f(x) = 0 \implies 2x - 10 = 0$.'
    - 'Paso 2: Sumar $10$ a ambos lados: $2x = 10$.'
    - 'Paso 3: Dividir entre $2$: $x = \frac{10}{2} = 5$.'
    - 'Paso 4: Concluir que el cero de la función es $x_0 = 5$ y que la recta cruza al eje $X$ en $(5, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el cero de la función afín $f(x) = 2x - 10$?'
    choices:
      - {text: '$x = 5$', is_correct: true}
      - {text: '$x = -5$', is_correct: false}
      - {text: '$x = 10$', is_correct: false}
      - {text: '$x = -10$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 5$''. $2x - 10 = 0 \implies 2x = 10 \implies x = 5$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si una función afín tiene su cero en $x = -3$, ¿cuál es el punto de intersección con el eje $X$?'
    choices:
      - {text: '$(-3, 0)$', is_correct: true}
      - {text: '$(0, -3)$', is_correct: false}
      - {text: '$(3, 0)$', is_correct: false}
      - {text: '$(0, 3)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(-3, 0)$''. La raíz o cero $x_0$ entrega la primera componente del punto $(x_0, 0)$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Igualar la expresión de la función afín a cero: $mx + b = 0$.'
  - 'Paso 2: Transponer el término independiente $b$: $mx = -b$.'
  - 'Paso 3: Despejar $x$ dividiendo entre la pendiente: $x = -\frac{b}{m}$.'
  - 'Paso 4: Verificar que al evaluar $f(-\frac{b}{m})$ el resultado sea $0$.'
errores_correccion: |
  - **Error común:** Confundir el cero de la función ($x = -\frac{b}{m}$) con evaluar la función en cero ($f(0) = b$).
  - **Cómo corregirlo:** El CERO DE LA FUNCIÓN es **buscar la entrada $x$ que hace $y = 0$**; evaluar en cero es reemplazar $x = 0$ para hallar $y = b$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El cero de la función afín $f(x) = mx + b$ se obtiene calculando la imagen $f(0) = b$.'
  - 'La función afín $f(x) = 4x + 8$ posee su cero en el valor $x = 2$.'
  - 'El cero de una función representa el punto de corte con el eje vertical de las ordenadas.'
  - 'Una función afín con pendiente decreciente no posee cero real en el conjunto $\mathbb{R}$.'
  - 'El cero de la función afín es siempre igual al coeficiente de posición $b$.'
afirmaciones_verdaderas:
  - 'El cero o raíz de una función afín $f(x) = mx + b$ ($m \neq 0$) es la solución única de la ecuación $mx + b = 0$, dada por $x_0 = -\frac{b}{m}$.'
  - 'Geométricamente, el cero de la función representa la abscisa del punto de corte de la recta con el eje horizontal $X$.'
al_terminar_debes_poder: |
  QUÉ: Calcular el cero o raíz de una función afín de variable real.
  CÓMO: Plantear y resolver la ecuación lineal $mx + b = 0$, obteniendo la abscisa $x_0 = -\frac{b}{m}$.
