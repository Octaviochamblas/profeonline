semantic_id: MAT.ALG.FUNCION_AFIN.CERO_FUNCION
resumen_inicial: El cero o raíz de una función afín es el valor numérico $x_0 = -\frac{n}{m}$
  que anula la función ($f(x_0) = 0$).
explicacion_simple: 'El **cero de una función** (también llamado raíz) es la entrada
  $x$ que hace que la salida $y$ sea cero.

  - Para hallarlo en $f(x) = m x + n$, resolvemos la ecuación de primer grado $m x
  + n = 0$.

  - La solución $x_0 = -\frac{n}{m}$ es la primera componente del punto donde la recta
  cruza el eje $X$.'
explicacion_formal: 'Dada la función afín $f(x) = m x + n$, el **cero o raíz de $f$**
  es el valor $x_0 \in \operatorname{Dom}(f)$ tal que:


  $$f(x_0) = 0 \iff m x_0 + n = 0 \iff x_0 = -\frac{n}{m}$$


  **Desglose de la fórmula:**

  - Solución única de la ecuación de primer grado asociada al núcleo o kernel de la
  transformación afín.'
definiciones_clave: '- **Cero / Raíz ($x_0$)**: Valor numérico real que satisface
  la condición $f(x_0) = 0$.'
propiedades_relaciones: '- **Relación con intersección $X$**: El cero es la coordenada
  de abscisa $x_0$ del punto de intersección $(x_0, 0)$.'
ejemplo_guiado:
  enunciado: Calcula el cero de la función afín $f(x) = -4x + 20$ y verifica tu respuesta
    evaluando $f(x_0)$.
  pasos:
  - 'Paso 1: Plantear la ecuación $f(x) = 0 \implies -4x + 20 = 0$.Paso 2: Trasponer
    el término constante: $-4x = -20$.Paso 3: Dividir entre $-4$: $x_0 = \frac{-20}{-4}
    = 5$.Paso 4: Comprobar la evaluación: $f(5) = -4(5) + 20 = -20 + 20 = 0$ (VERIFICADO).Paso
    5: Concluir que el cero de la función es $x_0 = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver la ecuación $-4x + 20 = 0$, ¿cuál es el cero de la función
    $f(x) = -4x + 20$?
  choices:
  - text: $x_0 = 5$
    is_correct: true
  - text: $x_0 = -5$
    is_correct: false
  - text: $x_0 = 20$
    is_correct: false
  - text: $x_0 = 4$
    is_correct: false
  explanation: La alternativa correcta es '$x_0 = 5$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué resultado numérico se obtiene siempre al evaluar la función en su
    cero $f(x_0)$?
  choices:
  - text: Siempre da exactamente cero ($f(x_0) = 0$).
    is_correct: true
  - text: Da la pendiente $m$.
    is_correct: false
  - text: Da el coeficiente de posición $n$.
    is_correct: false
  - text: Da un resultado indeterminado.
    is_correct: false
  explanation: La alternativa correcta es 'Siempre da exactamente cero ($f(x_0) =
    0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Igualar la expresión de la función afín a cero.'
- 'Paso 2: Despejar la variable $x$ mediante operaciones algebraicas equivalentes.'
- 'Paso 3: Declarar el número obtenido como el cero $x_0$ de la función.'
errores_correccion: '- **Error común:** Confundir ''el cero de la función'' (hallar
  $x$ tal que $f(x)=0$) con ''evaluar la función en cero'' (calcular $f(0)$).

  - **Cómo corregirlo:** ''Evaluar en cero'' da el corte con el eje Y ($n$). ''El
  cero de la función'' es la $x$ que da resultado cero (corte con el eje X).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de función afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función afín f(x) = mx + n con n != 0 pasa por el origen (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - No, porque f(0) = n != 0.
- titulo: ¿El coeficiente de posición n indica la ordenada de corte con el eje Y?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta corta al eje Y en el punto (0, n).
errores_frecuentes:
- Confundir el coeficiente de posición $n$ (corte con el eje $Y$) con la intersección
  con el eje $X$.
- Asumir que la pendiente es siempre el primer número escrito en la fórmula sin verificar
  si acompaña a la variable $x$.
- Responder la intersección con un eje entregando solo un número suelto en lugar del
  par ordenado correspondiente.
- Confundir 'el cero de una función' (resolver $f(x)=0$) con 'evaluar en cero' (calcular
  $f(0)$).
- Cometer errores de signo al restar coordenadas negativas al aplicar la fórmula punto-pendiente.
afirmaciones_verdaderas:
- La función afín $f(x) = m x + n$ corta al eje vertical $Y$ en el punto $(0, n)$
  y al eje horizontal $X$ en $\left(-\frac{n}{m}, 0\right)$.
- La gráfica de una función afín es paralela a la gráfica de la función lineal $g(x)
  = m x$ trasladada verticalmente $n$ unidades.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y graficar
  funciones afines, identificando pendiente, coeficiente de posición, intersecciones
  con los ejes, ceros y fórmulas desde dos puntos.
