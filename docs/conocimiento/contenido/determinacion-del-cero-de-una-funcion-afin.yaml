semantic_id: MAT.ALG.FUNCION_AFIN.CERO_FUNCION
resumen_inicial: 'Determinación del cero de una función afín: conceptos, representación
  y propiedades en Función afín.'
explicacion_simple: El "cero" de una función no es lo mismo que evaluarla en cero;
  es exactamente lo opuesto, el valor de entrada que produce una salida igual a cero.
explicacion_formal: '### Definición formal


  Un número $c$ es un cero de la función $f$ si $f(c) = 0$. Para $f(x) = mx+n$ con
  $m \neq 0$, resolver $mx+n=0$ da $c = -\dfrac{n}{m}$, que es el único cero de la
  función afín (por ser lineal en $x$, la ecuación tiene solución única).


  ### Desarrollo didáctico


  El procedimiento es idéntico al de encontrar la intersección con el eje $x$: se
  iguala la función a cero y se despeja la incógnita.


  Si $f(x) = -5x + 25$: se resuelve $-5x+25=0$, obteniendo $x=5$. El cero de la función
  es $5$, y se cumple $f(5)=0$.'
definiciones_clave: '- **Determinación del cero de una función afín**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a determinación del cero de una función afín.'
ejemplo_guiado:
