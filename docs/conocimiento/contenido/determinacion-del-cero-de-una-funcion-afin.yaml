semantic_id: MAT.ALG.FUNCION_AFIN.CERO_FUNCION
resumen_inicial: El cero o raíz de una función afín es el valor numérico de la preimagen $x_0 = -\frac{n}{m}$ que satisface $f(x_0) = 0$.
explicacion_simple: '![El cero o raíz de una función afín es el valor numérico de la preimagen $x_0 = -\frac{n}{m}$ que satisface $f(x_0) = 0$](/static/img/nodos/determinacion-del-cero-de-una-funcion-afin-intro.svg)



  El **cero de una función** (también llamado **raíz**) es el número $x$ que hace que la función dé como resultado cero:

  $$f(x) = 0$$


  Para calcularlo:

  1. Tomas la fórmula $mx + n$ y la igualas a $0$.

  2. Despejas la $x$: $x_0 = -\frac{n}{m}$.


  Por ejemplo, para $f(x) = 3x - 12$, resolvemos $3x - 12 = 0 \implies 3x = 12 \implies x = 4$. El cero es el número $4$.'
explicacion_formal: 'Dada una función afín $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = mx + n$ ($m \neq 0$), el **cero** o **raíz** de $f$ es el único elemento $x_0 \in \mathbb{R}$ tal que:

  $$f(x_0) = 0 \Longleftrightarrow mx_0 + n = 0 \Longleftrightarrow x_0 = -\frac{n}{m}$$


  **Distinción terminológica rigurosa:**

  - **Cero / Raíz**: Es un valor escalar numérico real ($x_0 \in \mathbb{R}$).

  - **Punto de intersección**: Es un par ordenado del plano cartesiano ($(x_0, 0) \in \mathbb{R}^2$).'
definiciones_clave: '- **Cero de la función**: Preimagen cuya imagen es idéntica a cero.

  - **Raíz algebraica**: Solución de la ecuación polinómica $P(x) = 0$.'
propiedades_relaciones: '- **Cambio de signo**: En $x_0$, la función afín cambia de signo (de positiva a negativa o viceversa).

  - **Inyectividad**: Al ser inyectiva, no puede tener más de una raíz real.'
ejemplo_guiado:
  enunciado: '![Ejemplo El cero o raíz de una función afín es el valor numérico de la preimagen $x_0 = -\frac{n}{m}$ que satisface $f(x_0) = 0$](/static/img/nodos/determinacion-del-cero-de-una-funcion-afin-ejemplos.svg)



    Determina el cero de la función afín $f(x) = -4x + 28$ y comprueba algebraicamente el resultado.'
  pasos:
  - 'Paso 1: Plantear la ecuación $f(x) = 0 \implies -4x + 28 = 0$.'
  - 'Paso 2: Despejar $x$: $-4x = -28 \implies x = \frac{-28}{-4} = 7$.'
  - 'Paso 3: Comprobar evaluando en $x = 7$: $f(7) = -4(7) + 28 = -28 + 28 = 0$.'
  - 'Paso 4: Concluir formalmente que el cero de la función es $x_0 = 7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el cero de la función afín $f(x) = 6x + 18$?
  choices:
  - text: '-3'
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '18'
    is_correct: false
  - text: (-3, 0)
    is_correct: false
  explanation: La alternativa correcta es '-3'. $6x + 18 = 0 \implies 6x = -18 \implies x = -3$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el cero de la función $f(x) = ax - 10$ es $x = 2$, ¿cuánto vale $a$?
  choices:
  - text: '5'
    is_correct: true
  - text: '-5'
    is_correct: false
  - text: '20'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: La alternativa correcta es '5'. $f(2) = 0 \implies 2a - 10 = 0 \implies 2a = 10 \implies a = 5$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Igualar la expresión de la función a cero: $mx + n = 0$.'
- 'Paso 2: Despejar la incógnita $x$ aplicando operaciones inversas.'
- 'Paso 3: Calcular el valor numérico $x_0 = -\frac{n}{m}$.'
- 'Paso 4: Reportar la respuesta como el valor escalar $x = x_0$.'
errores_correccion: '- **Error común:** Dar la respuesta en formato de par ordenado $(x_0, 0)$ cuando se pregunta por el cero o raíz.

  - **Cómo corregirlo:** El **cero** es un **número** ($x = x_0$); el **punto de corte** es el par ordenado ($(x_0, 0)$).'
ejemplos:
- titulo: 'Ejemplo 1: Raíz fraccionaria'
  enunciado: Halla el cero de $f(x) = 3x - 5$.
  alternativas:
  - 5/3
  - -5/3
  - 3/5
  - '-5'
  respuesta: 5/3
  solucion_pasos:
  - 'Paso 1: $3x - 5 = 0 \implies 3x = 5 \implies x = \frac{5}{3}$.'
- titulo: 'Ejemplo 2: Pendiente negativa'
  enunciado: ¿Cuál es la raíz de $g(x) = 8 - 2x$?
  alternativas:
  - '4'
  - '-4'
  - '8'
  - '-8'
  respuesta: '4'
  solucion_pasos:
  - 'Paso 1: $8 - 2x = 0 \implies 2x = 8 \implies x = 4$.'
- titulo: 'Ejemplo 3: Raíz nula en función afín trasladada'
  enunciado: Si $f(x) = 2x + k$ tiene como raíz a $x = -4$, ¿cuál es el valor de $k$?
  alternativas:
  - '8'
  - '-8'
  - '4'
  - '-4'
  respuesta: '8'
  solucion_pasos:
  - 'Paso 1: $2(-4) + k = 0 \implies -8 + k = 0 \implies k = 8$.'
- titulo: 'Ejemplo 4: Fracción algebraica'
  enunciado: Calcula el cero de $h(x) = \frac{2x - 6}{5}$.
  alternativas:
  - '3'
  - '-3'
  - '6'
  - '15'
  respuesta: '3'
  solucion_pasos:
  - 'Paso 1: $\frac{2x - 6}{5} = 0 \implies 2x - 6 = 0 \implies x = 3$.'
errores_frecuentes:
- Confundir el cero de la función f(x)=0 con la evaluación en cero f(0).
- Entregar un par ordenado en vez de un valor numérico escalar.
- Cometer errores de signo en el despeje algebraico.
afirmaciones_verdaderas:
- El cero o raíz de una función afín es el valor real x que satisface f(x) = 0.
- Toda función afín f(x) = mx + n con m != 0 posee exactamente una raíz real x = -n/m.
al_terminar_debes_poder: '**QUÉ:** Calcular y verificar el cero o raíz de funciones afines.


  **CÓMO:** Igualando la regla a cero, despejando la variable x = -n/m y distinguiendo el valor escalar del punto geométrico.


  ![Resumen El cero o raíz de una función afín es el valor numérico de la preimagen $x_0 = -\frac{n}{m}$ que satisface $f(x_0) = 0$](/static/img/nodos/determinacion-del-cero-de-una-funcion-afin-resumen.svg)'
