semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.CLAUSURA_ADICION
resumen_inicial: "La propiedad de clausura o cierre de la adición establece que la suma de dos números racionales cualesquiera da como resultado siempre otro número racional."
explicacion_simple: |
  Imagina que los números racionales (las fracciones) son un club cerrado. La **propiedad de clausura** significa que si tomas dos fracciones cualesquiera de ese club y las sumas, el resultado que obtienes NUNCA se va del club: siempre es otra fracción. Por ejemplo, al sumar $\frac{1}{2} + \frac{1}{3} = \frac{5}{6}$, el resultado $\frac{5}{6}$ sigue siendo una fracción. En matemática se dice que el conjunto de los racionales es 'cerrado' bajo la suma.
explicacion_formal: |
  Formalmente, el conjunto de los números racionales $\mathbb{Q}$ satisface el axioma de **clausura o cierre algebraico** respecto de la operación de adición $+$, expresado simbólicamente como:
  $$\forall q_1, q_2 \in \mathbb{Q}, \quad (q_1 + q_2) \in \mathbb{Q}$$

  Demostración: sean $q_1 = \frac{a}{b}$ y $q_2 = \frac{c}{d}$ con $a, c \in \mathbb{Z}$ y $b, d \in \mathbb{Z} \setminus \{0\}$. Su suma es:
  $q_1 + q_2 = \frac{a \cdot d + b \cdot c}{b \cdot d}$
  Dado que $\mathbb{Z}$ es cerrado bajo la multiplicación y adición de enteros, el numerador $N = a \cdot d + b \cdot c \in \mathbb{Z}$ y el denominador $D = b \cdot d \in \mathbb{Z} \setminus \{0\}$. Por lo tanto, $\frac{N}{D} \in \mathbb{Q}$.
definiciones_clave: |
  - **Propiedad de clausura (Cierre)**: Axioma por el cual la aplicación del operador suma $+$ a elementos de $\mathbb{Q}$ genera exclusivamente elementos pertenecientes a $\mathbb{Q}$.
  - **Conjunto algebraicamente cerrado**: Estructura donde las operaciones binarias no producen elementos externos al conjunto.
  - **Operador binario $+: \mathbb{Q} \times \mathbb{Q} \to \mathbb{Q}$**: Función que asigna a cada par ordenado de racionales un único resultado racional.
propiedades_relaciones: |
  - **Estructura de Grupo Abeliano**: La clausura de la adición es el primer axioma necesario para que $(\mathbb{Q}, +)$ constituya un grupo abeliano.
  - **Diferencia con otros conjuntos**: La clausura aditiva también se cumple en $\mathbb{Z}$ y $\mathbb{R}$, pero NO en conjuntos restringidos como los números racionales entre $0$ y $1$ (pues $\frac{3}{4} + \frac{3}{4} = \frac{3}{2} > 1$).
  - **Invarianza de formato**: Aplica sin importar si los racionales se expresan como fracciones, decimales finitos o periódicos.
ejemplo_guiado:
  enunciado: "Demuestra analíticamente que la suma de los racionales $q_1 = \\frac{3}{4}$ y $q_2 = -\\frac{5}{6}$ pertenece al conjunto $\\mathbb{Q}$."
  pasos:
    - 'Expresar la suma de los dos números racionales: $\frac{3}{4} + \left(-\frac{5}{6}\right)$.'
    - 'Homogenizar mediante el m.c.m.(4, 6) = 12: $\frac{9}{12} + \left(-\frac{10}{12}\right) = \frac{9 - 10}{12} = -\frac{1}{12}$.'
    - 'Verificar la definición de $\mathbb{Q}$: el numerador $-1$ es un entero ($-1 \in \mathbb{Z}$) y el denominador $12$ es un entero no nulo ($12 \in \mathbb{Z} \setminus \{0\}$).'
    - 'Concluir: la suma $-\frac{1}{12}$ pertenece al conjunto $\mathbb{Q}$, demostrando la clausura.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué afirma la propiedad de clausura de la adición en el conjunto de los números racionales $\\mathbb{Q}$?"
    choices:
      - {text: "Que la suma de dos números racionales cualesquiera da como resultado siempre otro número racional.", is_correct: true}
      - {text: "Que la suma de dos racionales da como resultado un entero positivo obligatoriamente.", is_correct: false}
      - {text: "Que el orden de los sumandos no altera el resultado final.", is_correct: false}
      - {text: "Que la suma de cualquier racional con cero da como resultado cero.", is_correct: false}
    explanation: "La correcta es Que la suma de dos números racionales cualesquiera da como resultado siempre otro número racional.: define el cierre algebraico del conjunto bajo la suma."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Si sumas la fracción $\\frac{7}{8}$ con el decimal $0.25$, ¿por qué el resultado se mantiene en $\\mathbb{Q}$?"
    choices:
      - {text: "Porque $0.25 = \\frac{1}{4} \\in \\mathbb{Q}$ y la suma $\\frac{7}{8} + \\frac{1}{4} = \\frac{9}{8} \\in \\mathbb{Q}$ cumple la clausura.", is_correct: true}
      - {text: "Porque al sumar un decimal con una fracción el resultado se vuelve irracional.", is_correct: false}
      - {text: "Porque la suma siempre da un número entero.", is_correct: false}
      - {text: "No se mantiene en $\\mathbb{Q}$ porque $0.25$ no es una fracción.", is_correct: false}
    explanation: "La correcta es Porque $0.25 = \\frac{1}{4} \\in \\mathbb{Q}$ y la suma $\\frac{7}{8} + \\frac{1}{4} = \\frac{9}{8} \\in \\mathbb{Q}$ cumple la clausura.: ambos operandos son racionales y su suma es una fracción $\\frac{9}{8} \\in \\mathbb{Q}$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identificar los dos números racionales operandos $q_1, q_2 \in \mathbb{Q}$.'
  - "Paso 2: Expresar ambos números como fracciones con numeradores enteros y denominadores enteros no nulos."
  - 'Paso 3: Realizar la suma mediante la fórmula $\frac{a \cdot d + b \cdot c}{b \cdot d}$.'
  - "Paso 4: Comprobar que el resultado final es un cociente entre enteros no nulo, confirmando la clausura."
errores_correccion: |
  Un error de concepto es pensar que la suma de dos fracciones podría producir un número irracional (como $\sqrt{2}$ o $\pi$). **La suma de racionales JAMÁS produce un irracional**; la clausura garantiza que el resultado es 100% un número racional.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Es la suma $\\frac{2}{5} + \\frac{3}{5} = 1$ una demostración válida de clausura en $\\mathbb{Q}$?"
    alternativas:
      - 'Sí, porque $1 = \frac{1}{1}$, lo cual es un número racional.'
      - "No, porque 1 es un entero y no una fracción."
      - "No, porque el resultado debe dar decimal."
    respuesta: "Sí, porque $1 = \\frac{1}{1}$, lo cual es un número racional."
    solucion_pasos:
      - 'Sumamos: $\frac{2}{5} + \frac{3}{5} = \frac{5}{5} = 1$.'
      - 'Todo entero $n$ es racional ya que $n = \frac{n}{1} \in \mathbb{Q}$.'
      - "Se cumple la clausura."
  - titulo: "Ejemplo 2"
    enunciado: "Si $a, b \\in \\mathbb{Q}$, ¿qué se puede afirmar sobre la expresión $a + b + \\frac{1}{2}$?"
    alternativas:
      - 'Pertenece a $\mathbb{Q}$ por la clausura repetida de la adición.'
      - "Es un número irracional."
      - 'Solo pertenece a $\mathbb{Q}$ si $a$ y $b$ son positivos.'
    respuesta: "Pertenece a $\\mathbb{Q}$ por la clausura repetida de la adición."
    solucion_pasos:
      - '$a+b \in \mathbb{Q}$ por clausura.'
      - 'Al sumar $\frac{1}{2} \in \mathbb{Q}$, el resultado final permanece en $\mathbb{Q}$.'
  - titulo: "¿Se cumple la propiedad de clausura aditiva para el subconjunto de las fracciones propias positivas?"
    respuesta: "No"
    solucion_pasos:
      - 'No, porque por ejemplo $\frac{2}{3} + \frac{2}{3} = \frac{4}{3} > 1$, el resultado ya no es una fracción propia.'
  - titulo: "¿Se cumple la clausura de la adición para todos los racionales negativos?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, la suma de dos racionales negativos da siempre como resultado otro racional negativo."
errores_frecuentes:
  - 'Creer que los números enteros no forman parte del conjunto de los racionales $\mathbb{Q}$.'
  - "Confundir la propiedad de clausura con la propiedad conmutativa."
  - 'Pensar que al sumar decimales periódicos el resultado se sale de $\mathbb{Q}$.'
  - "Asumir que un subconjunto acotado de racionales cumple automáticamente la clausura."
  - "Creer que la clausura depende de que las fracciones tengan el mismo denominador."
afirmaciones_verdaderas:
  - "La suma de dos números racionales cualesquiera es siempre otro número racional (clausura aditiva)."
  - 'El conjunto $\mathbb{Q}$ es cerrado bajo la operación de adición.'
al_terminar_debes_poder: |
  Debes ser capaz de explicar la propiedad de clausura aditiva en $\mathbb{Q}$ y justificar formalmente por qué la suma de racionales permanece en el conjunto.
