semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.CLAUSURA_ADICION
resumen_inicial: 'La propiedad de clausura aditiva establece que la suma de cualesquiera dos números racionales es siempre otro número racional: $\forall q_1, q_2 \in \mathbb{Q}, \, q_1 + q_2 \in \mathbb{Q}$.'
explicacion_simple: 'La propiedad de clausura o cierre significa que el conjunto de los números racionales es un sistema ''cerrado'' para la suma. Al sumar dos números racionales cualesquiera, jamás obtendremos un número extraño o fuera del conjunto; el resultado siempre será obligatoriamente otro número racional.


  ![Clausura de Q en la adición](/static/img/nodos/clausura-de-q-en-la-adicion-intro.svg)'
explicacion_formal: 'El conjunto $(\mathbb{Q}, +)$ satisface el axioma de **Clausura o Cerradura Aditiva**:


  $$\forall \frac{a}{b}, \frac{c}{d} \in \mathbb{Q}, \quad \frac{a}{b} + \frac{c}{d} = \frac{a \cdot d + b \cdot c}{b \cdot d} \in \mathbb{Q}$$


  **Desglose de la fórmula:**

  - $a \cdot d + b \cdot c \in \mathbb{Z}$: Numerador resultante que pertenece al conjunto de los enteros.

  - $b \cdot d \in \mathbb{Z} \setminus \{0\}$: Denominador resultante que es un entero no nulo por clausura en $\mathbb{Z}$.

  - $\frac{a \cdot d + b \cdot c}{b \cdot d} \in \mathbb{Q}$: La fracción resultante cumple estrictamente la definición formal del conjunto $\mathbb{Q}$.


  > **Complemento didáctico:** Es Imposible sumar dos fracciones y obtener como resultado un número irracional como $\pi$ o $\sqrt{2}$.'
definiciones_clave: '- **Clausura aditiva en $\mathbb{Q}$**: Propiedad de estabilidad algebraica por la cual $+ : \mathbb{Q} \times \mathbb{Q} \to \mathbb{Q}$ es una operación bien definida.'
propiedades_relaciones: '- **Estructura de Grupo Abeliano**: La clausura aditiva constituye el primer axioma del grupo aditivo $(\mathbb{Q}, +)$.'
ejemplo_guiado:
  enunciado: 'Verifique la clausura aditiva calculando la suma $\frac{3}{5} + \frac{1}{2}$ y comprobando que pertenece a $\mathbb{Q}$.


    ![Ejemplo Clausura de Q en la adición](/static/img/nodos/clausura-de-q-en-la-adicion-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar que $\frac{3}{5} \in \mathbb{Q}$ y $\frac{1}{2} \in \mathbb{Q}$.'
  - 'Paso 2: Sumar homogenizando a décimos: $\frac{3 \cdot 2 + 1 \cdot 5}{10} = \frac{6 + 5}{10} = \frac{11}{10}$.'
  - 'Paso 3: Verificar la pertenencia: $11, 10 \in \mathbb{Z}$ con $10 \neq 0 \implies \frac{11}{10} \in \mathbb{Q}$.'
  - 'Conclusión: La suma dio un número racional, confirmando la clausura aditiva.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué garantiza la propiedad de clausura de la adición en el conjunto Q?
  choices:
  - text: Que la suma de dos números racionales da como resultado SIEMPRE otro número racional
    is_correct: true
  - text: Que el resultado siempre es un número entero par
    is_correct: false
  - text: Que la suma puede dar un número irracional
    is_correct: false
  - text: Que el resultado siempre es igual a 0
    is_correct: false
  explanation: La alternativa correcta es 'Que la suma de dos números racionales da como resultado SIEMPRE otro número racional'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3/5 + 1/2 = 11/10, ¿por qué 11/10 confirma la clausura aditiva?
  choices:
  - text: Porque 11 y 10 son enteros con 10 != 0, demostrando que 11/10 pertenece a Q
    is_correct: true
  - text: Porque 11/10 da como resultado un entero exacto
    is_correct: false
  - text: Porque 11 es primo
    is_correct: false
  - text: Porque se convirtió en un número negativo
    is_correct: false
  explanation: La alternativa correcta es 'Porque 11 y 10 son enteros con 10 != 0, demostrando que 11/10 pertenece a Q'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar dos elementos $q_1, q_2 \in \mathbb{Q}$.'
- 'Paso 2: Realizar la adición $q_1 + q_2$ obteniendo la fracción equivalente $\frac{a \cdot d + b \cdot c}{b \cdot d}$.'
- 'Paso 3: Verificar que el resultado sea una fracción de numerador y denominador entero no nulo perteniente a $\mathbb{Q}$.'
errores_correccion: '- **Error 1: Pensar que la suma de dos fracciones puede dar un número irracional.** **Cómo corregirlo:** $\mathbb{Q}$ es cerrado bajo la suma; la suma de dos racionales es SIEMPRE racional.


  - **Error 2: Creer que si la suma da un entero se rompe la clausura aditiva en $\mathbb{Q}$.** **Cómo corregirlo:** Los enteros PERTENECEN a $\mathbb{Q}$ ($z = \frac{z}{1}$), por lo que un resultado entero es racional.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Pertenece el resultado de 4/7 + (-3/7) al conjunto de los números racionales Q?
  alternativas:
  - Sí, 1/7 pertenece a Q
  - No, pertenece solo a los irracionales
  - Solo si es positivo
  respuesta: Sí, 1/7 pertenece a Q
  solucion_pasos:
  - $4/7 + (-3/7) = 1/7 \in \mathbb{Q}$.
- titulo: Ejemplo 2
  enunciado: Si $q_1, q_2 \in \mathbb{Q}$, ¿qué se puede afirmar sobre $q_1 + q_2$?
  alternativas:
  - Que q1 + q2 pertenece obligatoriamente a Q
  - Que puede ser irracional
  - Que no se puede calcular
  respuesta: Que q1 + q2 pertenece obligatoriamente a Q
  solucion_pasos:
  - Por el axioma de clausura aditiva en $\mathbb{Q}$.
- titulo: ¿Es el conjunto Q cerrado bajo la operación de adición?
  respuesta: Sí
  solucion_pasos:
  - Sí, cumple la propiedad de clausura o cerradura aditiva.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde a la aplicación rigurosa de las propiedades algebraicas en el cuerpo ℚ.
  - texto: No se cumple en ℚ
    es_correcta: false
    retroalimentacion: Incorrecto, el conjunto de los racionales cumple estrictamente esta propiedad axiomática.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa el desarrollo algebraico y los términos involucrados.
- titulo: ¿Es 1/2 + 1/2 = 1 una demostración que contradice la clausura en Q?
  respuesta: 'No'
  solucion_pasos:
  - No, $1 = 1/1 \in \mathbb{Q}$, por ende confirma la clausura.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde a la aplicación rigurosa de las propiedades algebraicas en el cuerpo ℚ.
  - texto: No se cumple en ℚ
    es_correcta: false
    retroalimentacion: Incorrecto, el conjunto de los racionales cumple estrictamente esta propiedad axiomática.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa el desarrollo algebraico y los términos involucrados.
errores_frecuentes:
- La suma de dos números racionales produce en ciertos casos un número irracional.
- Sumar dos fracciones negativas genera un resultado fuera del conjunto de los racionales.
- La propiedad de clausura exige que el resultado de la suma sea un número entero par.
- El conjunto de los racionales no es cerrado para la adición de fracciones impropias.
- La adición de fracciones de distinto denominador rompe la clausura aditiva en $\mathbb{Q}$.
afirmaciones_verdaderas:
- El conjunto de los números racionales $\mathbb{Q}$ es cerrado bajo la operación de adición.
- Para todo par de elementos $q_1, q_2 \in \mathbb{Q}$, la suma $q_1 + q_2$ pertenece a $\mathbb{Q}$.
al_terminar_debes_poder: '**QUÉ:** Justificar y aplicar el axioma de clausura o cerradura de los números racionales bajo la adición y la sustracción.


  **CÓMO:** Demostrando que para todo $\frac{a}{b}, \frac{c}{d} \in \mathbb{Q}$ ($b, d \neq 0$), la suma $\frac{a}{b} + \frac{c}{d} = \frac{ad + bc}{bd}$ produce siempre una razón de enteros con denominador no nulo, concluyendo que $\mathbb{Q}$ es cerrado.


  ![Resumen Clausura de Q en la adición](/static/img/nodos/clausura-de-q-en-la-adicion-resumen.svg)'
