semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.CRITERIO_LLA_MAYOR
resumen_inicial: 'Criterio de congruencia LLA mayor: dos lados y el ángulo opuesto
  al lado mayor: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia,
  Semejanza y Homotecia.'
explicacion_simple: 'A diferencia de LAL, existe un caso especial donde el ángulo
  conocido no está comprendido entre los dos lados, pero aun así garantiza congruencia:
  cuando ese ángulo es opuesto al lado mayor de los dos conocidos.'
explicacion_formal: '![Criterio de congruencia LLA mayor](/static/img/geometria/congruencia-semejanza/congruencia-criterio-lla-mayor.svg)


  ### Definición formal


  Si en $\triangle ABC$ y $\triangle A''B''C''$ se cumple $AB=A''B''$, $BC=B''C''$
  (con $BC>AB$) y $\angle A=\angle A''$ (el ángulo opuesto al lado mayor BC), entonces
  $\triangle ABC\cong\triangle A''B''C''$.


  ### Desarrollo didáctico


  A diferencia de un caso general "lado-lado-ángulo no comprendido" (que en general
  NO garantiza congruencia, por la ambigüedad conocida como caso ambiguo), cuando
  el ángulo conocido es específicamente el opuesto al lado mayor de los dos, la ambigüedad
  desaparece y sí se garantiza congruencia.'
definiciones_clave: '- **Criterio de congruencia LLA mayor: dos lados y el ángulo
  opuesto al lado mayor**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a criterio de congruencia lla mayor: dos lados
  y el ángulo opuesto al lado mayor.'
ejemplo_guiado:
  enunciado: 'Para analizar criterio de congruencia lla mayor: dos lados y el ángulo
    opuesto al lado mayor, considera un ángulo $\alpha = 114^\circ$ ubicado en la
    posición dada. Determina el valor de la medida asociada sabiendo que $x + 1089^\circ
    = 114^\circ$.'
  pasos:
  - 'Identificar la propiedad de criterio de congruencia lla mayor: dos lados y el
    ángulo opuesto al lado mayor referida a $\alpha = 114^\circ$.'
  - 'Plantear la ecuación de cálculo: $x + 1089 = 114 \implies x = 114 - 1089$.'
  - 'Concluir que la medida calculada para criterio de congruencia lla mayor: dos
    lados y el ángulo opuesto al lado mayor es $x = -975^\circ$.'
