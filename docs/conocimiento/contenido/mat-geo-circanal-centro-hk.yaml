procedimiento:
- 'Paso 1: Identifica la ecuación en la forma (x-h)²+(y-k)²=r².'
- 'Paso 2: Reconoce que el centro es el punto (h,k), notando que los signos dentro
  de los paréntesis se invierten respecto de la ecuación.'
- 'Paso 3: El radio se obtiene calculando la raíz cuadrada del término de la derecha.'
