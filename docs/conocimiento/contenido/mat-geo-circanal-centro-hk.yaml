semantic_id: MAT.GEO.CIRCUNFERENCIA_ANALITICA.CENTRO_HK
resumen_inicial: 'Reconocimiento de la ecuación canónica de circunferencia con centro
  en (h, k): conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica
  Ampliada.'
explicacion_simple: Cuando el centro de una circunferencia no coincide con el origen,
  su ecuación incluye desplazamientos que reflejan las coordenadas de ese centro.
explicacion_formal: '![Circunferencia con centro (h,k)](/static/img/geometria/analitica/circanal-centro-hk.svg)


  ### Definición formal


  Un punto $(x,y)$ pertenece a la circunferencia de centro $(h,k)$ y radio $r$ si
  su distancia a ese centro es exactamente $r$: $\sqrt{(x-h)^2+(y-k)^2}=r$, es decir,
  $(x-h)^2+(y-k)^2=r^2$.


  ### Desarrollo didáctico


  La ecuación $(x-2)^2+(y-3)^2=9$ representa una circunferencia con centro $(2,3)$
  y radio $3$ (ya que $9=3^2$).'
definiciones_clave: '- **Reconocimiento de la ecuación canónica de circunferencia
  con centro en (h, k)**: Elemento o propiedad fundamental en el estudio de geometría
  analítica ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a reconocimiento de la ecuación canónica de
  circunferencia con centro en (h, k).'
