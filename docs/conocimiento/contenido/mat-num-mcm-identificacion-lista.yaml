semantic_id: MAT.NUM.MINIMO_COMUN_MULTIPLO.IDENTIFICACION_LISTA
resumen_inicial: "El método de listas calcula el MCM escribiendo los múltiplos de cada número hasta encontrar el menor que se repite en todas las listas."
explicacion_simple: |
  Imagina que estás organizando una carrera de autitos en una pista de juguete. El auto
  azul da una vuelta completa cada 3 minutos, y el auto rojo cada 5 minutos. Si salen
  juntos, ¿en qué minuto volverán a cruzar la meta al mismo tiempo? Escribiendo las listas
  de tiempos de cada auto y comparándolas, verás de inmediato el primer número en que
  coinciden.
explicacion_formal: |
  Los múltiplos positivos de $n$ se obtienen como $M(n)=\{n\cdot1,n\cdot2,n\cdot3,\ldots\}$.
  Para calcular el MCM entre $8$ y $12$: $M(8)=\{8,16,24,32,40,48,\ldots\}$,
  $M(12)=\{12,24,36,48,\ldots\}$; la intersección es $\{24,48,\ldots\}$, y el MCM es el
  menor: $24$. Este método es ideal para números pequeños, pero se vuelve tedioso con
  números grandes o tres o más términos.
definiciones_clave: |
  **Intersección de listas de múltiplos**: conjunto de números que aparecen en todas las
  listas de múltiplos a la vez; el MCM es el menor elemento de esa intersección.
propiedades_relaciones: |
  Cuantos más números se comparan simultáneamente, más larga debe ser cada lista antes de
  encontrar una coincidencia común a todas.
ejemplo_guiado:
  enunciado: "Calcula el MCM entre 6 y 9 listando sus múltiplos."
  pasos:
    - "Múltiplos de 6: $\\{6,12,18,24,\\ldots\\}$. Múltiplos de 9: $\\{9,18,27,\\ldots\\}$."
    - "El primer múltiplo común es 18."
    - "Conclusión: $\\text{MCM}(6,9)=18$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué representa la intersección de las listas de múltiplos de dos números?"
    choices:
      - {text: "El conjunto de múltiplos comunes a ambos", is_correct: true}
      - {text: "El conjunto de divisores comunes", is_correct: false}
      - {text: "La suma de todos los múltiplos", is_correct: false}
      - {text: "Solo el primer múltiplo de cada número", is_correct: false}
    explanation: "La correcta es El conjunto de múltiplos comunes a ambos: el MCM es el menor elemento de esa intersección."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el MCM entre 4 y 6?"
    choices:
      - {text: "12", is_correct: true}
      - {text: "24", is_correct: false}
      - {text: "2", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 12: múltiplos de 4 son $4,8,12,\\ldots$ y de 6 son $6,12,\\ldots$; el primero en común es 12."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Escribe el conjunto de múltiplos positivos para el primer número multiplicándolo por 1, 2, 3, etc.'
  - 'Paso 2: Escribe el conjunto de múltiplos positivos para el segundo número (y terceros, si los hay).'
  - 'Paso 3: Observa ambas listas y encierra en un círculo todos los números que aparezcan en ambas listas.'
  - 'Paso 4: Selecciona el menor de los números encerrados. Este valor es el MCM.'
errores_correccion: |
  Un error frecuente es listar los divisores en lugar de los múltiplos. Otro error es
  detener la lista demasiado pronto, antes de encontrar la primera coincidencia real.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Calcula el MCM entre $4$ y $10$ listando sus múltiplos.'
    alternativas:
      - "20"
      - "40"
      - "14"
    respuesta: "20"
    solucion_pasos:
      - 'Paso a: Escribimos los múltiplos de $4$: $\{4, 8, 12, 16, 20, 24, 28, 32, 36, 40, \dots\}$.'
      - 'Paso b: Escribimos los múltiplos de $10$: $\{10, 20, 30, 40, 50, \dots\}$.'
      - 'Paso c: Identificamos los múltiplos comunes: $20$ y $40$ aparecen en ambas listas.'
      - 'Paso d: Seleccionamos el menor de ellos: $20$. Por tanto, $\text{MCM}(4, 10) = 20$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Encuentra el MCM de los números $3$, $4$ y $6$ listando sus múltiplos.'
    alternativas:
      - "12"
      - "24"
      - "72"
    respuesta: "12"
    solucion_pasos:
      - 'Paso a: Listamos múltiplos de $3$: $\{3, 6, 9, 12, 15, 18, 21, 24, \dots\}$.'
      - 'Paso b: Listamos múltiplos de $4$: $\{4, 8, 12, 16, 20, 24, 28, \dots\}$.'
      - 'Paso c: Listamos múltiplos de $6$: $\{6, 12, 18, 24, 30, \dots\}$.'
      - 'Paso d: Buscamos múltiplos que estén en las tres listas simultáneamente: el $12$ y el $24$ cumplen esto. El menor es $12$. Así, $\text{MCM}(3, 4, 6) = 12$.'
  - titulo: 'Si listamos los múltiplos de $5$ y $9$, ¿es el número $45$ el menor múltiplo común que encontraremos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Los múltiplos de $5$ son: $5, 10, 15, 20, 25, 30, 35, 40, 45, 50, \dots$.'
      - 'Los múltiplos de $9$ son: $9, 18, 27, 36, 45, 54, \dots$.'
      - 'El primer número que se repite en ambas listas es el $45$.'
      - 'Como no hay ningún número menor que se repita, el MCM es $45$.'
  - titulo: 'Para encontrar el MCM de $6$ y $12$, ¿debemos listar los múltiplos de $6$ más allá de $12$?'
    respuesta: 'No'
    solucion_pasos:
      - 'Los múltiplos de $6$ son: $6, 12, 18, \dots$.'
      - 'Los múltiplos de $12$ son: $12, 24, 36, \dots$.'
      - 'El número $12$ es en sí mismo un múltiplo de $6$.'
      - 'Dado que $12$ es el primer múltiplo de la lista de $12$ y ya aparece en la lista de $6$, no es necesario seguir listando números mayores, pues ya encontramos el menor múltiplo común, que es $12$.'
errores_frecuentes:
  - 'Listar los divisores del número en lugar de los múltiplos.'
  - 'Detener la lista de múltiplos demasiado pronto antes de encontrar una coincidencia.'
  - 'Cometer errores en las tablas de multiplicar al generar las listas.'
  - 'Olvidar verificar que el múltiplo seleccionado esté presente en todas las listas cuando se calcula el MCM de tres o más números.'
  - 'Elegir un múltiplo común que no sea el menor.'
al_terminar_debes_poder: |
  Calcular el MCM de dos o más números mediante el método de comparación de listas de
  múltiplos.
fuente: 'Teoría de Números'
estado: publicado
