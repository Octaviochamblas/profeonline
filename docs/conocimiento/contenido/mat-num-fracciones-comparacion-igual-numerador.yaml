semantic_id: MAT.NUM.FRACCIONES_COMPARACION.IGUAL_NUMERADOR
resumen_inicial: "Al comparar fracciones positivas que tienen el mismo numerador, es mayor aquella fracción que posee el menor denominador."
explicacion_simple: |
  Imagina que tienes 2 chocolates iguales. En el primer caso, cortas el chocolate en 3 partes y te sirves 2 trozos ($\frac{2}{3}$). En el segundo caso, cortas el chocolate en 8 partes y te sirves 2 trozos ($\frac{2}{8}$). ¿En cuál de los dos casos comiste más chocolate? Obviamente en $\frac{2}{3}$, porque al dividir el chocolate en menos partes (solo 3), cada trozo individual es mucho más grande. Por eso, con numeradores iguales, **a menor denominador, más grande es la fracción**.
explicacion_formal: |
  Formalmente, dadas dos fracciones positivas $\frac{a}{b}$ y $\frac{a}{c}$ con igual numerador positivo $a \in \mathbb{Z}^+$ y denominadores $b, c \in \mathbb{Z}^+$:
  $$\frac{a}{b} > \frac{a}{c} \iff b < c$$

  La relación de orden entre las fracciones es **inversamente proporcional** a la relación de orden entre sus denominadores. Esto se demuestra considerando que $\frac{a}{b} = a \cdot \frac{1}{b}$ y $\frac{a}{c} = a \cdot \frac{1}{c}$. Dado que $b < c \implies \frac{1}{b} > \frac{1}{c}$, al multiplicar por la constante positiva $a$ se preserva la desigualdad estricta $a \cdot \frac{1}{b} > a \cdot \frac{1}{c}$.
definiciones_clave: |
  - **Comparación de igual numerador**: Criterio inverso que establece que $\frac{a}{b} > \frac{a}{c} \iff b < c$ para $a, b, c > 0$.
  - **Relación de orden inverso**: Comportamiento por el cual un mayor denominador produce una porción unitaria $\frac{1}{b}$ más pequeña.
  - **Numerador constante ($a$)**: Factor común que escala la comparación de las unidades fraccionarias $\frac{1}{b}$ vs $\frac{1}{c}$.
propiedades_relaciones: |
  - **Proporcionalidad inversa**: Con numerador fijo, la magnitud de la fracción decrece a medida que el denominador aumenta.
  - **Sensibilidad de partes**: Dividir una misma cantidad entre más receptores disminuye la cuota individual que le corresponde a cada uno.
  - **Comparación de unidades fraccionarias**: Es el caso base ($a = 1$) donde $\frac{1}{b} > \frac{1}{c} \iff b < c$.
ejemplo_guiado:
  enunciado: "Compara las fracciones $\\frac{5}{6}$ y $\\frac{5}{12}$, justifica cuál es mayor usando el criterio de igual numerador y verifica el resultado mediante decimales."
  pasos:
    - "Verificar que ambas fracciones compartan el mismo numerador positivo: $a = 5$."
    - "Comparar los denominadores: $b = 6$ y $c = 12$. Observamos que $6 < 12$."
    - "Aplicar la regla de igual numerador: como $6 < 12$, la fracción con menor denominador es mayor, concluyendo que $\\frac{5}{6} > \\frac{5}{12}$."
    - 'Verificar convirtiendo a decimales: $5 \div 6 \approx 0.833$ y $5 \div 12 \approx 0.416$. Como $0.833 > 0.416$, se confirma la conclusión.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Si dos fracciones positivas $\\frac{a}{b}$ y $\\frac{a}{c}$ tienen exactamente el mismo numerador $a > 0$, ¿cuál de ellas representa un valor numérico mayor?"
    choices:
      - {text: 'Es mayor la fracción que tenga el menor denominador ($b < c \implies \frac{a}{b} > \frac{a}{c}$).', is_correct: true}
      - {text: "Es mayor la fracción que tenga el mayor denominador.", is_correct: false}
      - {text: "Ambas fracciones son siempre iguales independientemente de sus denominadores.", is_correct: false}
      - {text: "La mayor es siempre la que tenga denominador par.", is_correct: false}
    explanation: 'La correcta es Es mayor la fracción que tenga el menor denominador ($b < c \implies \frac{a}{b} > \frac{a}{c}$).: al dividir entre menos partes ($b < c$), el tamaño de cada porción es más grande.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Ordena de menor a mayor las fracciones: $\\frac{7}{20}$, $\\frac{7}{4}$ y $\\frac{7}{10}$."
    choices:
      - {text: "$\\frac{7}{20} < \\frac{7}{10} < \\frac{7}{4}$", is_correct: true}
      - {text: "$\\frac{7}{4} < \\frac{7}{10} < \\frac{7}{20}$", is_correct: false}
      - {text: "$\\frac{7}{10} < \\frac{7}{20} < \\frac{7}{4}$", is_correct: false}
      - {text: "$\\frac{7}{20} < \\frac{7}{4} < \\frac{7}{10}$", is_correct: false}
    explanation: "La correcta es \\frac{7}{20} < \\frac{7}{10} < \\frac{7}{4}: a mayor denominador menor es la fracción, por lo que los denominadores $20 > 10 > 4$ invierten el orden a $\\frac{7}{20} < \\frac{7}{10} < \\frac{7}{4}$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Comprobar que los numeradores sean exactamente iguales y positivos."
  - "Paso 2: Comparar los denominadores $b$ y $c$."
  - 'Paso 3: Invertir la relación de desigualdad de los denominadores para obtener el orden de las fracciones ($b < c \implies \frac{a}{b} > \frac{a}{c}$).'
errores_correccion: |
  El error más común es aplicar la lógica habitual de los números enteros y pensar que a mayor denominador, mayor es la fracción. Recuerda siempre: **el denominador divide**, por lo que un denominador más grande achica los trozos.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál fracción es mayor: $\\frac{3}{5}$ o $\\frac{3}{8}$?"
    alternativas:
      - "$\\frac{3}{5} es mayor porque 5 < 8.$"
      - "$\\frac{3}{8} es mayor porque 8 > 5.$"
      - "Son iguales porque ambos numeradores son 3."
    respuesta: "$\\frac{3}{5} es mayor porque 5 < 8.$"
    solucion_pasos:
      - "Numeradores iguales a 3."
      - "Comparamos denominadores: $5 < 8$."
      - "La fracción con menor denominador es la mayor: $\\frac{3}{5} > \\frac{3}{8}$."
  - titulo: "Ejemplo 2"
    enunciado: "Dos herencias de igual monto se reparten: la primera entre 4 herederos (cada uno recibe $\\frac{1}{4}$) y la segunda entre 10 herederos (cada uno recibe $\\frac{1}{10}$). ¿Qué heredero recibe más?"
    alternativas:
      - "$El de la primera herencia (\\frac{1}{4} > \\frac{1}{10}).$"
      - "$El de la segunda herencia (\\frac{1}{10} > \\frac{1}{4}).$"
      - "Ambos reciben lo mismo."
    respuesta: "$El de la primera herencia (\\frac{1}{4} > \\frac{1}{10}).$"
    solucion_pasos:
      - "Comparamos unidades fraccionarias de igual numerador (1): $\\frac{1}{4}$ y $\\frac{1}{10}$."
      - "Como $4 < 10$, $\\frac{1}{4} > \\frac{1}{10}$."
  - titulo: "¿Es $\\frac{1}{2}$ estrictamente mayor que $\\frac{1}{100}$?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, al ser $2 < 100$, medio entero es inmensamente mayor que un centésimo del entero."
  - titulo: "¿Se mantiene esta misma regla de igual numerador para comparar unidades fraccionarias de la forma $\\frac{1}{b}$?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, las unidades fraccionarias son el caso base con numerador 1 donde la regla se cumple perfectamente."
errores_frecuentes:
  - "Creer que la fracción con mayor denominador es automáticamente la mayor."
  - "Confundir la regla de igual numerador con la de igual denominador."
  - "No invertir el signo de desigualdad de los denominadores al establecer el orden de las fracciones."
  - "Olvidar que la regla requiere numeradores idénticos."
  - "Asumir que si la diferencia de denominadores es muy grande, la regla deja de cumplirse."
afirmaciones_verdaderas:
  - "Al comparar dos fracciones positivas con igual numerador, la fracción con el denominador más pequeño representa el número mayor."
  - "Para todo $a, b, c > 0$, si $b < c$, se cumple que $\\frac{a}{b} > \\frac{a}{c}$."
al_terminar_debes_ponder: |
  Debes ser capaz de comparar inmediatamente fracciones de igual numerador identificando que el menor denominador produce la mayor fracción.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
