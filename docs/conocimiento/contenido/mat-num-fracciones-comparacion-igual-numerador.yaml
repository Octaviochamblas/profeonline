semantic_id: MAT.NUM.FRACCIONES_COMPARACION.IGUAL_NUMERADOR
resumen_inicial: 'Para comparar fracciones positivas con el mismo numerador, es mayor
  la que tenga el MENOR denominador: $\frac{a}{b} > \frac{a}{c} \iff b < c$ (con $a,
  b, c > 0$).'
explicacion_simple: Cuando dos fracciones positivas tienen exactamente el mismo número
  en el numerador, estamos tomando la misma cantidad de partes. Sin embargo, la fracción
  con el número de abajo más pequeño cortó el entero en menos pedazos, por lo que
  cada pedazo es más grande y la fracción resultará ser mayor.
explicacion_formal: 'Dadas dos fracciones positivas $\frac{a}{b}, \frac{a}{c} \in
  \mathbb{Q}^+$ con numerador común $a > 0$, la **Regla de Inversión Denominadora**
  establece la relación de orden inverso:


  $$\frac{a}{b} > \frac{a}{c} \iff b < c$$


  **Desglose de la fórmula:**

  - $a > 0$: Numerador positivo constante.

  - $b < c$: Denominador menor que implica divisiones de la unidad de mayor dimensión
  fraccionaria ($\frac{1}{b} > \frac{1}{c}$).


  > **Complemento didáctico:** Si dividimos una pizza en 2 partes (medios), cada trozo
  es mayor que si la dividimos en 8 partes (octavos); por eso $\frac{1}{2} > \frac{1}{8}$.'
definiciones_clave: '- **Comparación de fracciones con igual numerador**: Criterio
  donde la magnitud es inversamente proporcional al tamaño del denominador.'
propiedades_relaciones: '- **Relación inversa**: A mayor denominador, menor es el
  valor de la fracción para numeradores positivos.'
ejemplo_guiado:
  enunciado: Compare las fracciones $\frac{5}{6}$ y $\frac{5}{12}$ indicando cuál
    es la fracción de mayor valor.
  pasos:
  - 'Paso 1: Observar los numeradores: ambos son iguales a $5$ (numerador constante
    positivo).'
  - 'Paso 2: Comparar los denominadores: $6$ y $12$.'
  - 'Paso 3: Aplicar el criterio de inversión: como $6 < 12$, los sextos son piezas
    más grandes que los doceavos.'
  - 'Conclusión: La fracción de menor denominador es la mayor: $\frac{5}{6} > \frac{5}{12}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al comparar dos fracciones positivas con el mismo numerador, ¿cuál de
    ellas representa el mayor valor?
  choices:
  - text: La que tiene el MENOR denominador
    is_correct: true
  - text: La que tiene el mayor denominador
    is_correct: false
  - text: Ambas son idénticas siempre
    is_correct: false
  - text: La que tiene el denominador par
    is_correct: false
  explanation: La alternativa correcta es 'La que tiene el MENOR denominador'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado entre 5/6 y 5/12, ¿cuál fue la fracción mayor y por
    qué?
  choices:
  - text: 5/6, porque su denominador 6 es menor que 12
    is_correct: true
  - text: 5/12, porque 12 es mayor que 6
    is_correct: false
  - text: Son iguales porque los numeradores valen 5
    is_correct: false
  - text: 5/12 porque es simplificable
    is_correct: false
  explanation: La alternativa correcta es '5/6, porque su denominador 6 es menor que
    12'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que los numeradores de las fracciones positivas sean idénticos.'
- 'Paso 2: Comparar los denominadores de ambas fracciones.'
- 'Paso 3: Declarar mayor a la fracción que tenga el denominador más pequeño.'
errores_correccion: '- **Error 1: Creer que la fracción con mayor denominador es la
  mayor.** **Cómo corregirlo:** En numeradores iguales positivos, mayor denominador
  implica cortes más pequeños ($\frac{1}{2} > \frac{1}{100}$).


  - **Error 2: Aplicar la regla inversa sin verificar que el numerador sea positivo
  constante.** **Cómo corregirlo:** La regla exige que los numeradores sean idénticos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Ordene de menor a mayor: 4/9, 4/3, 4/7.'
  alternativas:
  - 4/9 < 4/7 < 4/3
  - 4/3 < 4/7 < 4/9
  - 4/7 < 4/9 < 4/3
  respuesta: 4/9 < 4/7 < 4/3
  solucion_pasos:
  - 'Denominadores: $9 > 7 > 3 \implies$ orden de fracciones: $4/9 < 4/7 < 4/3$.'
- titulo: Ejemplo 2
  enunciado: ¿Es 2/5 mayor que 2/3?
  alternativas:
  - No, porque 5 > 3 y a mayor denominador menor es la fracción
  - Sí, porque 5 > 3
  - Son iguales
  respuesta: No, porque 5 > 3 y a mayor denominador menor es la fracción
  solucion_pasos:
  - $5 > 3 \implies 2/5 < 2/3$.
- titulo: ¿Es 1/4 mayor que 1/8?
  respuesta: Sí
  solucion_pasos:
  - Sí, los cuartos son trozos mayores que los octavos.
- titulo: ¿Es 3/10 mayor que 3/5?
  respuesta: 'No'
  solucion_pasos:
  - No, $10 > 5 \implies 3/10 < 3/5$.
errores_frecuentes:
- Para fracciones positivas de igual numerador es mayor la que posee el mayor denominador.
- Tener numeradores iguales garantiza que las dos fracciones son numéricamente equivalentes.
- Aumentar el denominador de una fracción positiva sin cambiar el numerador agranda
  la fracción.
- La comparación de numeradores iguales solo se puede realizar en números pares.
- La fracción $1/100$ es mayor que la fracción $1/2$.
afirmaciones_verdaderas:
- Entre dos fracciones positivas con igual numerador es mayor aquella con menor denominador.
- El valor de una fracción positiva es inversamente proporcional a la magnitud de
  su denominador.
al_terminar_debes_poder: Al terminar serás capaz de comparar fracciones de igual numerador,
  reconociendo que a menor denominador corresponde una fracción de mayor valor.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
