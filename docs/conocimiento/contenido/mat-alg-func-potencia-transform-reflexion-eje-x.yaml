semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.REFLEXION_EJE_X
resumen_inicial: 'La reflexión respecto del eje $x$ en una función potencia ocurre al invertir el signo de su coeficiente $a$, transformando $f(x) = a x^n$ en $g(x) = -a x^n$.'
explicacion_simple: |
  Reflejar una gráfica respecto del eje $x$ es equivalente a mirarla frente a un espejo colocado sobre el suelo del plano cartesiano. Todo lo que apuntaba hacia arriba pasa a apuntar exactamente hacia abajo en la misma proporción, y viceversa. En las funciones potencia, esta reflexión especular vertical se logra invirtiendo el signo del número multiplicativo $a$. Por ejemplo, si tenemos la copa en U de $x^2$ que abre hacia arriba, $-x^2$ refleja la copa hacia abajo.
explicacion_formal: |
  ### Definición formal
  La **reflexión respecto del eje $x$** de una función potencia $f(x) = a x^n$ es la transformación geométrica isométrica definida por la negación de la variable dependiente $y$:
  $$g(x) = -f(x) = -a x^n$$

  ### Mapeo de pares ordenados
  - Para todo punto $(x_0, y_0) \in \operatorname{Graf}(f)$, el punto reflejado correspondiente en la nueva curva es $(x_0, -y_0) \in \operatorname{Graf}(g)$.
  - **Invariancia de Abscisas**: Las coordenadas horizontales $x$ permanecen inalteradas, pero todas las ordenadas sufren un cambio exacto de signo $y \to -y$.

  ### Síntesis didáctica
  Inversión de cuadrantes y orientación:
  - En exponentes pares: Una gráfica que abre hacia arriba en los cuadrantes I y II ($a > 0$) pasa a abrir hacia abajo en los cuadrantes III y IV ($-a < 0$).
  - En exponentes impares: Una gráfica creciente de cuadrantes III a I ($a > 0$) pasa a ser decreciente de cuadrantes II a IV ($-a < 0$).
definiciones_clave: |
  - **Reflexión especular $g(x) = -f(x)$**: Transformación isométrica por reflexión axial a través del eje horizontal $x = 0$.
  - **Inversión del coeficiente $-a$**: Cambio de signo multiplicativo que invierte la orientación vertical de la función.
  - **Invariancia del eje $x$**: Propiedad por la cual todos los puntos sobre el eje $x$ ($y = 0$) permanecen fijos tras la reflexión.
propiedades_relaciones: |
  - **Inversión de Cotas y Recorrido**:
    - Para exponente par y $a > 0$: El recorrido se invierte de $[0, +\infty[$ a $]-\infty, 0]$.
    - El mínimo absoluto global en $(0, 0)$ se convierte en un máximo absoluto global en $(0, 0)$.
  - **Inversión de Monotonía**: Los tramos crecientes se vuelven decrecientes y viceversa.
ejemplo_guiado:
  enunciado: 'Refleja la función potencia $f(x) = 3x^4$ respecto del eje $x$, escribe su fórmula resultante $g(x)$, y compara sus coordenadas en $x = 2$ y su conjunto recorrido.'
  pasos:
    - 'Paso 1: Multiplicamos por $-1$ la función completa: $g(x) = -f(x) = -3x^4$.'
    - 'Paso 2: Evaluamos $f(2) = 3(2)^4 = 48$. Punto original: $(2, 48)$.'
    - 'Paso 3: Evaluamos $g(2) = -3(2)^4 = -48$. Punto reflejado: $(2, -48)$. Se invirtió el signo de $y$.'
    - 'Paso 4: El recorrido de $f(x)$ era $[0, +\infty[$ (abría hacia arriba). El de $g(x)$ es $]-\infty, 0]$ (abre hacia abajo).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula algebraica de la función resultante de reflejar respecto del eje $x$ a la función potencia $f(x) = -5x^3$?'
    choices:
      - {text: '$g(x) = 5x^3$', is_correct: true}
      - {text: '$g(x) = -5(-x)^3$', is_correct: false}
      - {text: '$g(x) = \frac{1}{-5x^3}$', is_correct: false}
      - {text: '$g(x) = -5x^3 - 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = 5x^3$''. La reflexión respecto del eje $x$ multiplica por $-1$ a la función completa: $g(x) = -(-5x^3) = 5x^3$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el punto $(2, 16)$ pertenece a la gráfica de $f(x) = x^4$, ¿qué punto pertenece obligatoriamente a la gráfica reflejada $g(x) = -x^4$?'
    choices:
      - {text: 'El punto de coordenadas $(2, -16)$', is_correct: true}
      - {text: 'El punto de coordenadas $(-2, 16)$', is_correct: false}
      - {text: 'El punto de coordenadas $(-2, -16)$', is_correct: false}
      - {text: 'El punto de coordenadas $(0, -16)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto de coordenadas $(2, -16)$''. La reflexión respecto del eje $x$ mantiene intacta la abscisa $x = 2$ e invierte la ordenada $y = 16$ a $y = -16$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la función potencia original $f(x) = a x^n$.'
  - 'Paso 2: Multiplicar por $-1$ toda la expresión: $g(x) = -a x^n$.'
  - 'Paso 3: Conservar las abscisas $x$ e invertir los signos de las ordenadas $y \to -y$.'
  - 'Paso 4: Actualizar el conjunto recorrido y los tramos de monotonía.'
errores_correccion: |
  - **Error 1:** Confundir la reflexión respecto del eje $x$ (negación externa $-f(x)$) con la reflexión respecto del eje $y$ (negación interna $f(-x)$). **Cómo corregirlo:** Para reflejar respecto del eje $x$, se le cambia el signo al **coeficiente $a$ por fuera**. Para el eje $y$, se le cambia el signo a la variable $x$ por dentro.
  - **Error 2:** Creer que la reflexión respecto al eje $x$ mueve la posición del punto $(0, 0)$. **Cómo corregirlo:** Los puntos sobre el eje $x$ tienen ordenada $y = 0$, por lo que $-0 = 0$. El punto $(0, 0)$ permanece invariante en la reflexión.
ejemplos:
  - titulo: 'Formulación de reflexión en potencia par'
    enunciado: '¿La reflexión de $f(x) = 2x^2$ respecto del eje $x$ es $g(x) = -2x^2$?'
    alternativas:
      - 'Sí, $g(x) = -2x^2$'
      - 'No, $g(x) = 2(-x)^2$'
      - 'No, $g(x) = \frac{1}{2x^2}$'
    respuesta: 'Sí, $g(x) = -2x^2$'
    solucion_pasos:
      - '1. Invertimos el signo de $a = 2 \implies -2$.'
      - '2. La función reflejada es $g(x) = -2x^2$.'
  - titulo: 'Transformación de mínimo a máximo'
    enunciado: '¿El mínimo absoluto en $(0, 0)$ de $f(x) = x^4$ se convierte en un máximo absoluto en $g(x) = -x^4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La curva que abría hacia arriba pasa a abrir hacia abajo con máximo en $(0, 0)$.'
  - titulo: 'Inversión de recorrido'
    enunciado: '¿El recorrido de $f(x) = 4x^6$ pasa de $[0, +\infty[$ a $]-\infty, 0]$ tras reflejarse respecto al eje $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Las ordenadas positivas pasan a ser no positivas $]-\infty, 0]$.'
  - titulo: 'Invariancia del origen'
    enunciado: '¿La gráfica reflejada $g(x) = -a x^n$ sigue pasando por el origen $(0, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En $x = 0$, $g(0) = -a(0)^n = 0$.'
errores_frecuentes:
  - 'La reflexión respecto del eje $x$ de la función $f(x) = 3x^2$ se escribe $g(x) = 3(-x)^2$.'
  - 'Reflejar una función respecto al eje $x$ desplaza su vértice a la recta $x = -1$.'
  - 'La función reflejada $g(x) = -x^4$ mantiene el mismo conjunto recorrido $[0, +\infty[$.'
  - 'Un signo menos en el coeficiente altera el dominio de la función potencia.'
  - 'Las ordenadas de los puntos reflejados mantienen el mismo signo de la función original.'
afirmaciones_verdaderas:
  - 'La reflexión de una función potencia respecto del eje $x$ invierte el signo del coeficiente $a$, transformando $f(x) = a x^n$ en $g(x) = -a x^n$.'
  - 'La reflexión respecto al eje $x$ invierte todas las ordenadas $y \to -y$, transformando mínimos absolutos en máximos absolutos e invirtiendo los tramos de monotonía.'
