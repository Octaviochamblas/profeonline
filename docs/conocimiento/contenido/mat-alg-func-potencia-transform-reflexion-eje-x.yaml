semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.REFLEXION_EJE_X
resumen_inicial: 'Análisis de la reflexión respecto del eje X por cambio de signo
  de a: forma general $f(x) = a x^n$, simetría, dominio y recorrido en Traslaciones
  y escalas.'
explicacion_simple: Multiplicar toda la función por $-1$ invierte el signo de cada
  valor de salida, produciendo un reflejo de la curva original respecto al eje horizontal.
explicacion_formal: '### Definición formal


  Para $f(x)=-g(x)$, se cumple $f(x_0)=-g(x_0)$ para todo $x_0$: si $(x_0,y_0)$ pertenece
  a la gráfica de $g$, entonces $(x_0,-y_0)$ pertenece a la gráfica de $f$. Geométricamente,
  esto invierte la curva respecto al eje $x$, como si se doblara el plano sobre ese
  eje.


  ### Desarrollo didáctico


  Si $g(x)=2x^2$ pasa por $(3,18)$, entonces $f(x)=-2x^2$ pasa por $(3,-18)$. La forma
  de copa de $g$ (abriendo hacia arriba) se convierte en una forma de copa invertida
  (abriendo hacia abajo) en $f$.'
definiciones_clave: '- **Análisis de la reflexión respecto del eje X por cambio de
  signo de a**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a análisis de la reflexión respecto del eje x por cambio de
  signo de a.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de análisis de la reflexión respecto del eje x por cambio de signo de a.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de análisis de la reflexión
    respecto del eje x por cambio de signo de a.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar análisis de la reflexión respecto del eje x por cambio de signo
    de a?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en traslaciones y escalas
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en traslaciones y escalas. El exponente
    n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en análisis de la reflexión respecto del eje x por cambio de
    signo de a?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el signo del coeficiente $a$ en la función original y en la
  reflejada.'
- 'Paso 2: Verifica que ambos coeficientes tengan signos opuestos.'
- 'Paso 3: Confirma que cada punto de la gráfica original se refleja cambiando el
  signo de su coordenada $y$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en análisis de la reflexión respecto del eje x por cambio de signo
  de a.
ejemplos:
- titulo: Identificación de una reflexión respecto al eje $x$
  enunciado: ¿Es $f(x)=-5x^3$ la reflexión de $g(x)=5x^3$ respecto al eje $x$?
  solucion_pasos:
  - Se compara: $f(x)=-g(x)$.
  - Sí, es exactamente su reflexión respecto al eje $x$.
- titulo: Verificación numérica de una reflexión
  enunciado: Si $g(2)=8$ para $g(x)=x^3$, ¿cuál es $f(2)$ para $f(x)=-x^3$?
  solucion_pasos:
  - Se aplica $f(x)=-g(x)$.
  - Se obtiene $f(2)=-8$.
- titulo: ¿La reflexión respecto al eje $x$ cambia el dominio de la función?
  enunciado: ¿Reflejar una función respecto al eje $x$ cambia su dominio?
  respuesta: 'No'
  solucion_pasos:
  - El dominio permanece igual; solo se invierte el signo de los valores de salida.
- titulo: ¿La reflexión respecto al eje $x$ invierte la monotonía de la función?
  enunciado: ¿Una función creciente se vuelve decreciente al reflejarla respecto al
    eje $x$?
  respuesta: Sí
  solucion_pasos:
  - Al invertir el signo de todos los valores, el crecimiento se transforma en decrecimiento
    y viceversa.
errores_frecuentes:
- Declarar la reflexión respecto al eje $x$ con una reflexión respecto al eje $y$.
- Suponer que la reflexión cambia el dominio de la función.
- No aplicar el cambio de signo a todos los valores de la función, solo a algunos.
- Declarar esta transformación con una traslación vertical.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  análisis de la reflexión respecto del eje x por cambio de signo de a.
