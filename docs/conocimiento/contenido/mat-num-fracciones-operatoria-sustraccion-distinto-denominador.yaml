semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.SUSTRACCION_DISTINTO_DENOMINADOR
resumen_inicial: "Para restar fracciones con distinto denominador, se homogenizan a un denominador común (mediante el m.c.m.) y luego se restan los nuevos numeradores."
explicacion_simple: |
  Imagina que tienes en una jarra $\frac{3}{4}$ de litro de jugo y le te sirves un vaso con $\frac{2}{3}$ de litro. Para saber cuánto jugo queda en la jarra, tienes que restar $\frac{3}{4} - \frac{2}{3}$. Como los cuartos y los tercios tienen distinto tamaño, homogenizas a doceavos: $\frac{3}{4}$ son 9 doceavos ($\frac{9}{12}$) y $\frac{2}{3}$ son 8 doceavos ($\frac{8}{12}$). Al restar $9 - 8$, descubres que en la jarra queda exactamente 1 doceavo de litro ($\frac{1}{12}$).
explicacion_formal: |
  Formalmente, dadas dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$ con $b, d \in \mathbb{Z}^+$ y $b \neq d$:

  1. Se determina el Mínimo Común Múltiplo de los denominadores: $M = \text{mcm}(b, d)$.
  2. Se amplifican ambas fracciones al denominador común $M$:
  $$\frac{a}{b} = \frac{a \cdot (M/b)}{M} \quad \text{y} \quad \frac{c}{d} = \frac{c \cdot (M/d)}{M}$$
  3. Se efectúa la resta de numeradores sobre el denominador común $M$:
  $$\frac{a}{b} - \frac{c}{d} = \frac{a \cdot (M/b) - c \cdot (M/d)}{M}$$

  Fórmula alternativa del producto cruzado: $\frac{a}{b} - \frac{c}{d} = \frac{a \cdot d - b \cdot c}{b \cdot d}$.
definiciones_clave: |
  - **Sustracción de distinto denominador**: Resta que exige convertir previamente las fracciones a un común denominador $M$.
  - **Mínimo Común Denominador ($M$)**: Menor entero positivo divisible por ambos denominadores.
  - **Diferencia de numeradores homogenizados**: Resultado $a \cdot (M/b) - c \cdot (M/d)$ obtenido tras igualar la escala.
propiedades_relaciones: |
  - **No conmutatividad**: $\frac{a}{b} - \frac{c}{d} \neq \frac{c}{d} - \frac{a}{b}$.
  - **Gestión de signos**: Si $a \cdot d < b \cdot c$, la diferencia es un número racional negativo.
  - **Conexión con la adición**: Restar $\frac{c}{d}$ equivale a sumar su inverso aditivo $-\frac{c}{d}$.
ejemplo_guiado:
  enunciado: "Resta las fracciones $\\frac{5}{6} - \\frac{3}{8}$ utilizando el m.c.m. de los denominadores."
  pasos:
    - "Calcular el m.c.m. de $6$ y $8$: $\\text{mcm}(6, 8) = 24$."
    - "Amplificar $\\frac{5}{6}$ por $4$: $\\frac{5 \\cdot 4}{6 \\cdot 4} = \\frac{20}{24}$."
    - "Amplificar $\\frac{3}{8}$ por $3$: $\\frac{3 \\cdot 3}{8 \\cdot 3} = \\frac{9}{24}$."
    - "Restar numeradores: $\\frac{20 - 9}{24} = \\frac{11}{24}$."
    - 'Verificar irreductibilidad: $\gcd(11, 24) = 1$, la respuesta final es $\frac{11}{24}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el resultado de aplicar la fórmula de productos cruzados a la resta $\\frac{a}{b} - \\frac{c}{d}$?"
    choices:
      - {text: '\frac{a \cdot d - b \cdot c}{b \cdot d}', is_correct: true}
      - {text: '\frac{a - c}{b - d}', is_correct: false}
      - {text: '\frac{a \cdot c}{b \cdot d}', is_correct: false}
      - {text: '\frac{a + d}{b + c}', is_correct: false}
    explanation: 'La correcta es \frac{a \cdot d - b \cdot c}{b \cdot d}: representa la resta de numeradores tras homogenizar al denominador común $b \cdot d$.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Al efectuar la resta $\\frac{4}{5} - \\frac{1}{2}$, ¿cuál es la fracción resultante?"
    choices:
      - {text: "\\frac{3}{10}", is_correct: true}
      - {text: "\\frac{3}{3}", is_correct: false}
      - {text: "\\frac{8}{10}", is_correct: false}
      - {text: "\\frac{1}{10}", is_correct: false}
    explanation: "La correcta es \\frac{3}{10}: homogenizando a décimos ($10$), tenemos $\\frac{8}{10} - \\frac{5}{10} = \\frac{3}{10}$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Calcular $M = \text{mcm}(b, d)$ entre los denominadores $b$ y $d$."
  - 'Paso 2: Calcular el factor de amplificación para cada fracción ($M \div b$ y $M \div d$).'
  - 'Paso 3: Amplificar los numeradores y efectuar la resta: $\frac{a \cdot (M/b) - c \cdot (M/d)}{M}$.'
  - "Paso 4: Reducir la fracción resultante a su forma irreductible."
errores_correccion: |
  Un error habitual es restar los denominadores (por ejemplo, hacer $\frac{5}{6} - \frac{1}{3} = \frac{4}{3}$). Recuerda: **los denominadores jamás se restan directamente**, primero se igualan mediante amplificación.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcula $\\frac{7}{10} - \\frac{2}{5}$."
    alternativas:
      - "\\frac{3}{10}"
      - "\\frac{5}{5}"
      - "\\frac{5}{10}"
    respuesta: "\\frac{3}{10}"
    solucion_pasos:
      - "$\\text{mcm}(10, 5) = 10$."
      - "Homogenizamos $\\frac{2}{5} = \\frac{4}{10}$."
      - "Restamos: $\\frac{7 - 4}{10} = \\frac{3}{10}$."
  - titulo: "Ejemplo 2"
    enunciado: "Un estanque lleno en sus $\\frac{5}{6}$ partes pierde agua hasta quedar en sus $\\frac{1}{4}$ partes. ¿Qué fracción del estanque se vació?"
    alternativas:
      - "\\frac{7}{12}"
      - "\\frac{4}{2}"
      - "\\frac{4}{12}"
    respuesta: "\\frac{7}{12}"
    solucion_pasos:
      - "$\\text{mcm}(6, 4) = 12$."
      - "Homogenizamos: $\\frac{5}{6} = \\frac{10}{12}$ y $\\frac{1}{4} = \\frac{3}{12}$."
      - "Resta: $\\frac{10 - 3}{12} = \\frac{7}{12}$."
  - titulo: "¿Se puede obtener un resultado negativo al restar dos fracciones de distinto denominador?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, si el minuendo homogenizado es menor que el sustraendo homogenizado, por ejemplo $\\frac{1}{3} - \\frac{1}{2} = -\\frac{1}{6}$."
  - titulo: "¿Se conserva la misma regla para restar números mixtos de distinto denominador previo paso a impropias?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, convirtiendo primero los números mixtos a fracciones impropias y homogenizando sus denominadores."
errores_frecuentes:
  - "Restar los numeradores y los denominadores directamente en línea recta."
  - "Invertir los términos restando el minuendo del sustraendo y alterando el signo."
  - "Olvidar amplificar el numerador al transformar la fracción al m.c.m."
  - "Sumar en lugar de restar."
  - "No simplificar la fracción resultante."
afirmaciones_verdaderas:
  - "Para restar fracciones de distinto denominador se debe buscar un común denominador mediante el m.c.m. antes de operar los numeradores."
  - "La resta de fracciones no es conmutativa."
al_terminar_debes_ponder: |
  Debes ser capaz de restar cualquier par de fracciones de distinto denominador utilizando la homogenización por m.c.m. o productos cruzados.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
