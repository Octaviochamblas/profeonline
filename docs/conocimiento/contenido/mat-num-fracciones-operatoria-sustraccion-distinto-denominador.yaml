semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.SUSTRACCION_DISTINTO_DENOMINADOR
resumen_inicial: La sustracción de fracciones de distinto denominador homogeniza las
  fracciones al m.c.m. de los denominadores y resta los nuevos numeradores.
explicacion_simple: Para restar dos fracciones que tienen denominadores diferentes,
  primero debemos transformar ambas fracciones a un denominador común utilizando amplificaciones
  (con el m.c.m.). Una vez que ambas tienen el mismo número abajo, restamos los numeradores
  de arriba.
explicacion_formal: 'Para $\frac{a}{b}, \frac{c}{d} \in \mathbb{Q}$ con $M = \operatorname{mcm}(b,
  d)$, la **Sustracción Heterogénea General** se expresa como:


  $$\frac{a}{b} - \frac{c}{d} = \frac{a \cdot \left(\frac{M}{b}\right) - c \cdot \left(\frac{M}{d}\right)}{M}
  = \frac{a \cdot d - b \cdot c}{b \cdot d}$$


  **Desglose de la fórmula:**

  - $M = \operatorname{mcm}(b, d)$: Denominador común homogenizador.

  - $a \cdot d - b \cdot c$: Numerador resultante de la diferencia cruzada en $\mathbb{Z}$.


  > **Complemento didáctico:** El orden en el numerador $a \cdot d - b \cdot c$ debe
  respetarse estrictamente porque la resta en $\mathbb{Z}$ no es conmutativa.'
definiciones_clave: '- **Sustracción de fracciones heterogéneas**: Diferencia entre
  fracciones de distinto denominador mediante m.c.m.'
propiedades_relaciones: '- **No conmutatividad**: $\frac{a}{b} - \frac{c}{d} \neq
  \frac{c}{d} - \frac{a}{b}$.'
ejemplo_guiado:
  enunciado: Calcule la diferencia $\frac{3}{4} - \frac{2}{5}$.
  pasos:
  - 'Paso 1: Hallar $\operatorname{mcm}(4, 5) = 20$.'
  - 'Paso 2: Amplificar $\frac{3}{4}$ por 5: $\frac{3 \cdot 5}{4 \cdot 5} = \frac{15}{20}$.'
  - 'Paso 3: Amplificar $\frac{2}{5}$ por 4: $\frac{2 \cdot 4}{5 \cdot 4} = \frac{8}{20}$.'
  - 'Paso 4: Restar los numeradores: $\frac{15 - 8}{20} = \frac{7}{20}$.'
  - 'Conclusión: $\frac{3}{4} - \frac{2}{5} = \frac{7}{20}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para restar a/b - c/d con denominadores distintos?
  choices:
  - text: (a · d - b · c) / (b · d)
    is_correct: true
  - text: (a - c) / (b - d)
    is_correct: false
  - text: (a · c) / (b · d)
    is_correct: false
  - text: (a - c) / (b · d)
    is_correct: false
  explanation: La alternativa correcta es '(a · d - b · c) / (b · d)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3/4 - 2/5, ¿cuál fue la resta resultante?
  choices:
  - text: 7/20
    is_correct: true
  - text: 1/1
    is_correct: false
  - text: 23/20
    is_correct: false
  - text: 1/20
    is_correct: false
  explanation: La alternativa correcta es '7/20'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el m.c.m. de los denominadores diferentes.'
- 'Paso 2: Amplificar los numeradores respetando el orden del minuendo y sustraendo.'
- 'Paso 3: Restar los numeradores obtenidos y simplificar.'
errores_correccion: '- **Error 1: Restar numeradores y denominadores en línea recta
  (ej: $\frac{3}{4} - \frac{2}{5} = \frac{1}{-1}$).** **Cómo corregirlo:** Se debe
  homogenizar denominadores obligatoriamente.


  - **Error 2: Invertir el orden de los productos en la resta cruzada.** **Cómo corregirlo:**
  Se debe calcular estrictamente $a \cdot d - b \cdot c$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule 5/6 - 1/3.
  alternativas:
  - 1/2 (tras simplificar 3/6)
  - 4/3
  - 4/6
  respuesta: 1/2 (tras simplificar 3/6)
  solucion_pasos:
  - mcm=6. $5/6 - 2/6 = 3/6 = 1/2$.
- titulo: Ejemplo 2
  enunciado: Calcule 1/2 - 3/4.
  alternativas:
  - -1/4
  - 1/4
  - -2/4
  respuesta: -1/4
  solucion_pasos:
  - $2/4 - 3/4 = -1/4$.
- titulo: ¿Se requiere homogenizar denominadores para restar fracciones de distinto
    denominador?
  respuesta: Sí
  solucion_pasos:
  - Sí, la resta heterogénea exige la homogenización previa.
- titulo: ¿Es 7/10 - 2/5 igual a 3/10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2/5 = 4/10 \implies 7/10 - 4/10 = 3/10$.
errores_frecuentes:
- Restar fracciones heterogéneas se realiza restando los numeradores y restando los
  denominadores.
- Invertir la posición del minuendo y sustraendo en la resta de fracciones da el mismo
  resultado.
- El resultado de $3/4 - 1/2$ es la fracción $2/2 = 1$.
- Restar denominadores distintos produce un denominador negativo en el resultado.
- No es necesario amplificar las fracciones para realizar su resta heterogénea.
afirmaciones_verdaderas:
- La sustracción de fracciones heterogéneas requiere homogenizar los denominadores
  antes de restar los numeradores.
- La regla directa de resta cruzada es $\frac{a}{b} - \frac{c}{d} = \frac{a \cdot
  d - b \cdot c}{b \cdot d}$.
al_terminar_debes_poder: Al terminar serás capaz de efectuar sustracciones de fracciones
  de distinto denominador, homogenizándolas al m.c.m. de sus denominadores antes de
  restar sus numeradores.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
