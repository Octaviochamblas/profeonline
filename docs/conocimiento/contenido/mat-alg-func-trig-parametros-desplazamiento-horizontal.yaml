semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.DESPLAZAMIENTO_HORIZONTAL
resumen_inicial: 'Identificación del desfase o traslación horizontal de la gráfica trigonométrica mediante el cociente $-\frac{C}{B}$.'
explicacion_simple: |
  El **desfase** o traslación horizontal es el desplazamiento de la onda hacia la izquierda o hacia la derecha sobre el eje horizontal. Si tienes una función como $y = \sin(Bx + C)$, el inicio del ciclo ya no ocurre en cero, sino en el punto donde la expresión dentro del paréntesis vale cero ($Bx + C = 0$). Despejando $x$, descubres que la onda se ha movido una distancia de **$-\frac{C}{B}$**. Si el resultado es positivo, la gráfica se corrió a la derecha; si es negativo, se corrió a la izquierda.
explicacion_formal: |
  ### Definición formal
  En la función trigonométrica general $f(x) = A\sin(Bx + C) + D$ o $g(x) = A\cos(Bx + C) + D$, el **desfase (o desplazamiento de fase horizontal)** $x_0$ representa la traslación rígida paralela al eje X dada por la raíz del argumento angular:
  $$Bx + C = 0 \implies x_0 = -\frac{C}{B}$$

  Para visualizarlo directamente en la ecuación, se factoriza el coeficiente $B$:
  $$f(x) = A\sin\left(B\left(x - \left(-\frac{C}{B}\right)\right)\right) + D$$

  ### Desglose simbólico
  - Si $x_0 = -\frac{C}{B} > 0$: Traslación horizontal hacia la **derecha**.
  - Si $x_0 = -\frac{C}{B} < 0$: Traslación horizontal hacia la **izquierda**.
  - Si $C = 0$: Sin desfase horizontal (inicio en la posición estándar).

  ### Síntesis didáctica
  Es crucial no confundir la constante $C$ con el desfase real. La constante $C$ es el término de desfase angular, pero la distancia geométrica real desplazada en la gráfica cartesiana es el cociente $x_0 = -\frac{C}{B}$.
definiciones_clave: |
  - **Desfase / Desplazamiento de fase ($-\frac{C}{B}$)**: Distancia horizontal que se traslada la gráfica desde su posición estándar.
  - **Argumento angular ($Bx + C$)**: Expresión interna cuya anulación determina el punto de origen del ciclo.
  - **Forma factorizada de fase**: Expresión de la forma $A\sin(B(x - x_0)) + D$ donde $x_0$ indica directamente el desfase.
propiedades_relaciones: |
  - **Desplazamiento de puntos clave**: Todos los ceros, crestas y valles de la función base se trasladan exactamente en la misma cantidad $x_0 = -\frac{C}{B}$.
  - **Conservación de la forma**: El desfase es una transformación isométrica rígida horizontal; no altera la amplitud $|A|$, el período $T$ ni la forma de la onda.
ejemplo_guiado:
  enunciado: 'Calcula el desfase horizontal y la dirección de traslación de la función $f(x) = 2\sin(3x - \pi) + 1$.'
  pasos:
    - 'Paso 1: Identificar los parámetros del argumento: $B = 3$ y $C = -\pi$.'
    - 'Paso 2: Igualar el argumento a cero para hallar el inicio del ciclo: $3x - \pi = 0$.'
    - 'Paso 3: Despejar $x$: $3x = \pi \implies x_0 = \frac{\pi}{3}$.'
    - 'Paso 4: Comprobar con la fórmula: $x_0 = -\frac{C}{B} = -\frac{-\pi}{3} = \frac{\pi}{3}$. Como es positivo, la gráfica se traslada $\frac{\pi}{3}$ unidades hacia la **derecha**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el desfase horizontal de la función senoidal $f(x) = \sin\left(2x + \frac{\pi}{2}\right)$ y hacia qué dirección se desplaza?'
    choices:
      - {text: 'Se desplaza $\frac{\pi}{4}$ unidades hacia la izquierda', is_correct: true}
      - {text: 'Se desplaza $\frac{\pi}{2}$ unidades hacia la derecha', is_correct: false}
      - {text: 'Se desplaza $\pi$ unidades hacia la izquierda', is_correct: false}
      - {text: 'Se desplaza $2$ unidades hacia la derecha', is_correct: false}
    explanation: 'La alternativa correcta es ''Se desplaza $\frac{\pi}{4}$ unidades hacia la izquierda''. Aplicando $x_0 = -\frac{C}{B} = -\frac{\pi/2}{2} = -\frac{\pi}{4}$, el signo negativo indica movimiento a la izquierda.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la función factorizada $g(x) = 4\cos\left(3\left(x - \frac{\pi}{6}\right)\right)$, ¿dónde comienza su ciclo base sobre el eje X?'
    choices:
      - {text: 'En $x = \frac{\pi}{6}$ (desplazada a la derecha)', is_correct: true}
      - {text: 'En $x = -\frac{\pi}{6}$ (desplazada a la izquierda)', is_correct: false}
      - {text: 'En el origen $x = 0$', is_correct: false}
      - {text: 'En $x = \frac{\pi}{3}$', is_correct: false}
    explanation: 'La alternativa correcta es ''En $x = \frac{\pi}{6}$ (desplazada a la derecha)''. En la forma factorizada $A\cos(B(x - x_0))$, el desfase es $x_0 = \frac{\pi}{6}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los coeficientes $B$ y $C$ dentro del argumento trigonométrico $(Bx + C)$.'
  - 'Paso 2: Calcular el cociente $x_0 = -\frac{C}{B}$ o igualar el argumento a cero y despejar $x$.'
  - 'Paso 3: Analizar el signo del resultado: si $x_0 > 0$ se traslada a la derecha; si $x_0 < 0$ se traslada a la izquierda.'
  - 'Paso 4: Sumar $x_0$ a las posiciones de los puntos clave base para ubicarlos en la nueva gráfica.'
errores_correccion: |
  - **Error 1:** Afirmar que el desfase es directamente el valor de la constante $C$ sin dividir entre $B$. **Cómo corregirlo:** Si la función es $\sin(2x - \pi)$, el desfase no es $\pi$, sino $\frac{\pi}{2}$, ya que el factor 2 afecta la escala horizontal.
  - **Error 2:** Confundir el signo de la traslación pensando que un signo positivo dentro del paréntesis desfasará a la derecha. **Cómo corregirlo:** La expresión $(x - x_0)$ muestra que un signo $+C$ dentro de $(Bx+C)$ desposta el ciclo a la izquierda (desfase negativo).
ejemplos:
  - titulo: 'Desfase a la derecha'
    enunciado: '¿Hacia qué lado se desplaza la función $f(x) = \cos(x - \pi)$?'
    alternativas:
      - 'Hacia la derecha $\pi$ unidades'
      - 'Hacia la izquierda $\pi$ unidades'
      - 'Hacia arriba $\pi$ unidades'
    respuesta: 'Hacia la derecha $\pi$ unidades'
    solucion_pasos:
      - '1. Igualamos el argumento a cero: $x - \pi = 0 \implies x = \pi$.'
      - '2. Como $x_0 = \pi > 0$, se traslada $\pi$ unidades a la derecha.'
  - titulo: 'Desfase con coeficiente B'
    enunciado: '¿Cuál es el desfase de la función $g(x) = \sin(2x - 4)$?'
    alternativas:
      - '$2$ unidades a la derecha'
      - '$4$ unidades a la derecha'
      - '$2$ unidades a la izquierda'
    respuesta: '$2$ unidades a la derecha'
    solucion_pasos:
      - '1. $x_0 = -\frac{-4}{2} = 2$.'
      - '2. El desfase cartesiano real es de 2 unidades a la derecha.'
  - titulo: 'Forma factorizada directa'
    enunciado: 'En la expresión $y = \sin\left(5\left(x + \frac{\pi}{2}\right)\right)$, ¿el desfase es $-\frac{\pi}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en la forma factorizada $B(x - x_0)$, el término $x_0 = -\frac{\pi}{2}$ muestra traslación a la izquierda.'
  - titulo: 'Conservación del período'
    enunciado: '¿El desfase horizontal cambia la amplitud o el período de la onda?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el desfase es un movimiento rígido que no altera la forma ni el tamaño de la onda.'
errores_frecuentes:
  - 'La afirmación de que la constante $C$ dentro de $A\sin(Bx + C)$ es por sí sola la magnitud del desplazamiento cartesiano horizontal.'
  - 'La afirmación de que una función con argumento $(x + \frac{\pi}{2})$ se desplaza hacia la derecha.'
  - 'La afirmación de que el desfase horizontal altera la distancia entre crestas y valles de la onda.'
  - 'La afirmación de que el desfase horizontal modifica el valor de la línea media vertical $D$.'
  - 'La afirmación de que si $B > 1$, el desfase horizontal se calcula multiplicando $C \cdot B$.'
afirmaciones_verdaderas:
  - 'El desfase o desplazamiento horizontal de la función trigonométrica general equivale al cociente $x_0 = -\frac{C}{B}$, trasladando la onda a la derecha si $x_0 > 0$ o a la izquierda si $x_0 < 0$.'
  - 'La traslación horizontal provocada por el desfase es una transformación rígida que no modifica la amplitud $|A|$ ni la longitud del período $T$.'
al_terminar_debes_poder: |
  QUÉ: Determinar y calcular el desfase o desplazamiento horizontal de cualquier función trigonométrica.
  CÓMO: Evaluar el cociente $x_0 = -\frac{C}{B}$ o igualar el argumento a cero ($Bx + C = 0$) para despejar la posición inicial del ciclo.
