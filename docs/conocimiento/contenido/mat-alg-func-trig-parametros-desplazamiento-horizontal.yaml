semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.DESPLAZAMIENTO_HORIZONTAL
resumen_inicial: 'Identificación del desfase o traslación horizontal de la función
  trigonométrica: círculo unitario, amplitud, período y transformaciones de Parámetros
  y transformaciones de funciones periódicas.'
explicacion_simple: El parámetro $c$, también llamado desfase, mueve toda la curva
  a lo largo del eje horizontal, sin cambiar su forma ni su tamaño.
explicacion_formal: '### Definición formal


  La función $f(x)=g(x-c)$, donde $g(x)=a\sin(bx)+d$, traslada horizontalmente la
  gráfica de $g$ en $c$ unidades. Es fundamental que el parámetro $b$ esté factorizado
  fuera del paréntesis para leer correctamente $c$.


  ### Desarrollo didáctico


  $f(x)=\sin(2(x-\pi/4))$ tiene desfase $c=\pi/4$: se desplaza $\pi/4$ unidades a
  la derecha respecto a $\sin(2x)$. Si la expresión fuera $\sin(2x-\pi/2)$, primero
  habría que factorizar: $2x-\pi/2=2(x-\pi/4)$, llegando al mismo resultado.'
definiciones_clave: '- **Identificación del desfase o traslación horizontal de la
  función trigonométrica**: Función periódica fundamentada en las coordenadas del
  círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación del desfase o traslación horizontal de la función trigonométrica.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación del desfase o traslación horizontal de la función trigonométrica.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación del desfase o traslación horizontal
    de la función trigonométrica.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
