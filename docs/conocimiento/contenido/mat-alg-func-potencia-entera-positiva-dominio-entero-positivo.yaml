semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.DOMINIO_ENTERO_POSITIVO
resumen_inicial: 'El conjunto dominio de toda función potencia de exponente entero positivo $f(x) = a x^n$ ($n \in \mathbb{Z}^+$) es el conjunto completo de los números reales $\operatorname{Dom}(f) = \mathbb{R}$.'
explicacion_simple: |
  Cuando el exponente $n$ de una función potencia es un número entero positivo (como $x^2, x^3, x^4$), no existe ninguna restricción o peligro matemático al calcularla. Podemos ingresar cualquier número real en la variable $x$: números positivos, cero o números negativos enteros y decimales. Todos ellos se pueden elevar a potencias enteras positivas y multiplicarse por $a$ sin generar indefiniciones. Por eso, su dominio es siempre todos los números reales $\mathbb{R}$.
explicacion_formal: |
  ### Definición formal
  Para toda función potencia $f: \operatorname{Dom}(f) \to \mathbb{R}$ definida por $f(x) = a \cdot x^n$ con $a \in \mathbb{R} \setminus \{0\}$ y exponente **$n \in \mathbb{Z}^+$**, el **dominio máximo de definición real** es irrestricto y equivale a:
  $$\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$$

  ### Justificación analítica de la ausencia de restricciones
  1. **Ausencia de Denominadores Variables**: No existe división por la variable $x$, lo que evita indefinicaciones por división por cero ($x \neq 0$ no es necesario).
  2. **Ausencia de Radicales de Índice Par**: Al ser $n$ un entero directo, no existen raíces cuadradas ni de índice par sobre la variable que exijan la restricción de positividad ($x \ge 0$).
  3. **Continuidad Polinomial**: Al ser la función potencia de exponente entero positivo un monomio polinomial puro, es continua y derivable en todo el espacio euclidiano $\mathbb{R}$.

  ### Síntesis didáctica
  Diferenciar dominios según el signo del exponente:
  - Exponente entero positivo ($n \in \mathbb{Z}^+$) $\implies \operatorname{Dom}(f) = \mathbb{R}$.
  - Exponente entero negativo ($n \in \mathbb{Z}^-$) $\implies \operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$.
definiciones_clave: |
  - **Dominio irrestricto $\mathbb{R}$**: Conjunto de todos los números reales aceptados como entradas válidas de la función.
  - **Continuidad en todo $\mathbb{R}$**: Propiedad de la curva de ser dibujable sin saltos ni interrupciones.
  - **Ausencia de restricciones de existencia**: Inexistencia de operaciones prohibidas (división por cero o raíces negativas).
propiedades_relaciones: |
  - **Invariancia por el parámetro $a$**: El coeficiente $a \neq 0$ modifica la escala vertical pero no altera el dominio de la función, el cual permanece siendo $\mathbb{R}$.
  - **Compatibilidad con composiciones polinomiales**: Al ser el dominio $\mathbb{R}$, se puede evaluar cualquier expresión real $P(x)$ dentro de la base obteniendo $f(P(x)) = a [P(x)]^n$.
ejemplo_guiado:
  enunciado: 'Determina el dominio de definición real de las siguientes funciones potencia justificando analíticamente tu respuesta: A) $f(x) = 5x^6$, B) $g(x) = -0.25 x^3$, C) $h(x) = \sqrt{2} \cdot x^7$.'
  pasos:
    - 'Paso 1: Para $f(x) = 5x^6$, el exponente es $n = 6 \in \mathbb{Z}^+$. No hay denominadores ni raíces sobre $x$. Dominio: $\operatorname{Dom}(f) = \mathbb{R}$.'
    - 'Paso 2: Para $g(x) = -0.25 x^3$, el exponente es $n = 3 \in \mathbb{Z}^+$. No hay restricciones de signo ni de cero. Dominio: $\operatorname{Dom}(g) = \mathbb{R}$.'
    - 'Paso 3: Para $h(x) = \sqrt{2} \cdot x^7$, el coeficiente $a = \sqrt{2}$ es constante irracional, pero el exponente en la variable es $n = 7 \in \mathbb{Z}^+$. Dominio: $\operatorname{Dom}(h) = \mathbb{R}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el dominio de definición real de la función potencia $f(x) = -8 x^5$ con exponente entero positivo?'
    choices:
      - {text: 'El conjunto completo de los números reales $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$', is_correct: true}
      - {text: 'El conjunto de los reales positivos $]0, +\infty[$', is_correct: false}
      - {text: 'El conjunto de los reales sin el cero $\mathbb{R} \setminus \{0\}$', is_correct: false}
      - {text: 'El intervalo cerrado $[0, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto completo de los números reales $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$''. Las funciones potencia de exponente entero positivo no poseen ninguna restricción de existencia en $\mathbb{R}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la presencia de un coeficiente negativo como $a = -3$ en la función $f(x) = -3 x^4$ no restringe el dominio de la variable $x$?'
    choices:
      - {text: 'Porque el coeficiente $a$ multiplica el resultado por fuera y no introduce divisiones por cero ni raíces de índice par sobre $x$, conservando $\operatorname{Dom}(f) = \mathbb{R}$', is_correct: true}
      - {text: 'Porque los coeficientes negativos obligan a que $x$ sea positivo', is_correct: false}
      - {text: 'Porque el dominio cambia a los números reales negativos', is_correct: false}
      - {text: 'Porque el exponente 4 elimina el coeficiente negativo', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque el coeficiente $a$ multiplica el resultado por fuera y no introduce divisiones por cero ni raíces de índice par sobre $x$, conservando $\operatorname{Dom}(f) = \mathbb{R}$''. Las transformaciones escalares de $a$ no afectan el dominio.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el exponente $n$ de la función potencia $f(x) = a x^n$.'
  - 'Paso 2: Comprobar que $n$ sea un número entero positivo ($n \in \mathbb{Z}^+$).'
  - 'Paso 3: Verificar que no existan denominadores variables ni radicales sobre la variable $x$.'
  - 'Paso 4: Declarar que el conjunto dominio de definición real es $\operatorname{Dom}(f) = \mathbb{R}$.'
errores_correccion: |
  - **Error 1:** Restringir el dominio a reales positivos $[0, +\infty[$ cuando el exponente es par (ej: en $f(x) = x^2$). **Cómo corregirlo:** En $f(x) = x^2$ se pueden ingresar números negativos ($(-3)^2 = 9$). El recorrido es acotado a los positivos, pero el dominio son todos los reales $\mathbb{R}$.
  - **Error 2:** Excluir al cero del dominio en funciones con exponente entero positivo. **Cómo corregirlo:** La evaluación $f(0) = a \cdot 0^n = 0$ está perfectamente definida para $n > 0$. El cero solo se excluye si el exponente es negativo ($n < 0$).
ejemplos:
  - titulo: 'Dominio en potencia par'
    enunciado: '¿Cuál es el dominio de $f(x) = 2x^4$?'
    alternativas:
      - '$\mathbb{R}$'
      - '$[0, +\infty[$'
      - '$\mathbb{R} \setminus \{0\}$'
    respuesta: '$\mathbb{R}$'
    solucion_pasos:
      - '1. El exponente $n = 4$ es entero positivo.'
      - '2. El dominio es $\operatorname{Dom}(f) = \mathbb{R}$.'
  - titulo: 'Dominio en potencia impar'
    enunciado: '¿La función $g(x) = -x^3$ tiene como dominio a todos los números reales $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Para $n = 3 \in \mathbb{Z}^+$, $\operatorname{Dom}(g) = \mathbb{R}$.'
  - titulo: 'Evaluación de abscisa negativa'
    enunciado: '¿Se puede evaluar $x = -5$ en la función potencia $h(x) = 3x^5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $h(-5) = 3(-5)^5 = 3(-3125) = -9375 \in \mathbb{R}$.'
  - titulo: 'Invariancia por coeficiente decimal'
    enunciado: '¿El dominio de $p(x) = 0.001 x^{10}$ es el conjunto $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Los parámetros decimales en $a$ no restringen el dominio $\mathbb{R}$.'
errores_frecuentes:
  - 'El dominio de una función potencia de exponente par como $f(x) = x^2$ se limita a $[0, +\infty[$.'
  - 'Una función potencia de exponente entero positivo no se puede evaluar para números negativos.'
  - 'El punto $x = 0$ no pertenece al dominio de $f(x) = x^3$.'
  - 'Un coeficiente negativo como $a = -4$ restringe el dominio a los números reales negativos.'
  - 'El dominio de las funciones potencia de exponente entero positivo es $\mathbb{R} \setminus \{0\}$.'
afirmaciones_verdaderas:
  - 'El dominio de cualquier función potencia de exponente entero positivo $f(x) = a x^n$ ($n \in \mathbb{Z}^+$) es el conjunto completo de los números reales $\mathbb{R}$.'
  - 'A diferencia del recorrido que puede estar acotado según la paridad y el signo de $a$, el dominio para $n \in \mathbb{Z}^+$ nunca tiene restricciones.'
al_terminar_debes_poder: 'Declarar y fundamentar que el dominio de las funciones potencia con exponente entero positivo es todo $\mathbb{R}$.'
