procedimiento:
- 'Paso 1: Verifica que el exponente $n$ sea un entero positivo.'
- 'Paso 2: Si se cumple, concluye que el dominio es todo $\mathbb{R}$, sin restricciones
  adicionales.'
- 'Paso 3: Si la función incluye una expresión algebraica más compleja en la base,
  verifica que también esté definida para todo $x$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en determinación del dominio real para exponentes enteros positivos.
ejemplos:
- titulo: Determinación del dominio de $x^2$
  enunciado: Determina el dominio de $f(x)=x^2$.
  solucion_pasos:
  - El exponente $2$ es un entero positivo.
  - El dominio es todo $\mathbb{R}$.
- titulo: Determinación del dominio de $-3x^5$
  enunciado: Determina el dominio de $f(x)=-3x^5$.
  solucion_pasos:
  - El exponente $5$ es un entero positivo, y el coeficiente $-3$ no afecta el dominio.
  - El dominio es todo $\mathbb{R}$.
- titulo: ¿El dominio de $f(x)=x^4$ excluye algún valor negativo?
  enunciado: ¿El dominio de $f(x)=x^4$ excluye los valores negativos de $x$?
  respuesta: 'No'
  solucion_pasos:
  - Cualquier número real, positivo o negativo, puede elevarse a un exponente entero
    positivo sin problema.
- titulo: ¿El dominio depende del valor del coeficiente $a$?
  enunciado: ¿El dominio de $f(x)=a\cdot x^n$ (con $n$ entero positivo) depende del
    valor de $a$?
  respuesta: 'No'
  solucion_pasos:
  - El coeficiente $a$ solo escala los resultados; no introduce ninguna restricción
    sobre el dominio.
errores_frecuentes:
- Suponer que el dominio se restringe por analogía con funciones de exponente negativo
  o fraccionario.
- Excluir $x=0$ innecesariamente, cuando sí pertenece al dominio en este caso.
- Declarar esta condición con la del recorrido, que sí puede restringirse según la
  paridad de $n$.
- Omitir verificar el dominio cuando la base es una expresión algebraica más compleja
  que $x$ solo.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  determinación del dominio real para exponentes enteros positivos.
