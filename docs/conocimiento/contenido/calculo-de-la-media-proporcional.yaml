semantic_id: MAT.NUM.PROPORCIONES.MEDIA_PROPORCIONAL
resumen_inicial: 'La media proporcional (o media geométrica) entre dos cantidades positivas $a$ y $c$ es el término medio repetido $x$ en una proporción continua: $\frac{a}{x} = \frac{x}{c} \implies x = \sqrt{a \cdot c}$.'
explicacion_simple: "![Media proporcional](/static/img/nodos/calculo-de-la-media-proporcional-intro.svg)\n\nLa **media proporcional** (también llamada media geométrica) se aplica cuando los dos términos del centro son **iguales**:\n- Se plantea la proporción continua: $\\frac{a}{x} = \\frac{x}{c}$.\n- Multiplicando en cruz tenemos: $x \\cdot x = a \\cdot c \\implies x^2 = a \\cdot c$.\n- Para hallar $x$, extraemos la **raíz cuadrada**:\n$$x = \\sqrt{a \\cdot c}$$\n- **Ejemplo:** La media proporcional entre $4$ y $9$:\n  - $x^2 = 4 \\cdot 9 = 36$.\n  - $x = \\sqrt{36} = 6$.\n  - Comprobación: $\\frac{4}{6} = \\frac{6}{9} = \\frac{2}{3}$ (¡ambas valen lo mismo!)."
explicacion_formal: 'Sean $a, c \in \mathbb{R}^+$ dos reales positivos. Se define formalmente como **media proporcional** (o media geométrica) entre $a$ y $c$ al valor $x \in \mathbb{R}^+$ que satisface la proporción continua:


  $$\frac{a}{x} = \frac{x}{c}$$


  **Deducción y Fórmula:**

  Aplicando el Teorema Fundamental:

  $$x^2 = a \cdot c$$

  Tomando la raíz cuadrada aritmética principal (positiva):


  $$x = \sqrt{a \cdot c}$$


  **Interpretación Geométrica:**

  En geometría euclidiana, la media proporcional $x = \sqrt{a \cdot c}$ representa el lado de un cuadrado cuya área es idéntica a la de un rectángulo de lados $a$ y $c$ ($x^2 = a \cdot c$). También corresponde a la altura sobre la hipotenusa en el Teorema de Euclides.'
definiciones_clave: '- **Media proporcional ($x$)**: Término medio repetido en la proporción continua $\frac{a}{x} = \frac{x}{c}$.

  - **Media geométrica**: Valor $x = \sqrt{a \cdot c}$ entre dos números reales positivos.

  - **Proporción continua**: Proporción donde los términos medios son idénticos.'
propiedades_relaciones: '- **Positividad**: En magnitudes físicas y geométricas, $x > 0$.

  - **Desigualdad de medias**: $\sqrt{a \cdot c} \le \frac{a + c}{2}$ (la media geométrica es siempre menor o igual a la media aritmética).'
ejemplo_guiado:
  enunciado: '![Ejemplos de media proporcional](/static/img/nodos/calculo-de-la-media-proporcional-ejemplos.svg)


    Calcule la media proporcional entre $4$ y $9$, y luego entre $2$ y $50$.'
  pasos:
  - 'Paso 1: Para $4$ y $9$: Plantear la proporción continua $\frac{4}{x} = \frac{x}{9}$.'
  - 'Paso 2: Producto cruzado: $x^2 = 4 \cdot 9 = 36$.'
  - 'Paso 3: Extraer raíz cuadrada: $x = \sqrt{36} = 6$.'
  - 'Paso 4: Para $2$ y $50$: $x^2 = 2 \cdot 50 = 100$.'
  - 'Paso 5: Extraer raíz cuadrada: $x = \sqrt{100} = 10$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la media proporcional entre dos números $a$ y $c$?
  choices:
  - text: $x = \sqrt{a \cdot c}$
    is_correct: true
  - text: $x = \frac{a + c}{2}$
    is_correct: false
  - text: $x = (a \cdot c)^2$
    is_correct: false
  - text: $x = \frac{a \cdot c}{2}$
    is_correct: false
  explanation: La alternativa correcta es '$x = \sqrt{a \cdot c}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la media proporcional entre 4 y 9 es 6 y no 6,5?
  choices:
  - text: Porque se calcula con la raíz del producto $\sqrt{36} = 6$ (media geométrica), no con el promedio
    is_correct: true
  - text: Porque 6,5 no es un número entero
    is_correct: false
  - text: Porque 6 es divisible por 3
    is_correct: false
  - text: Porque 4 + 9 = 13
    is_correct: false
  explanation: La alternativa correcta es 'Porque se calcula con la raíz del producto $\sqrt{36} = 6$ (media geométrica), no con el promedio'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los dos números extremos dados: $a \cdot c$.'
- 'Paso 2: Extraer la raíz cuadrada principal del producto obtenido: $x = \sqrt{a \cdot c}$.'
- 'Paso 3: Verificar que $\frac{a}{x} = \frac{x}{c}$ dé el mismo valor de razón simplificado.'
errores_correccion: "- **Error 1: Calcular la media aritmética $\frac{a+c}{2}$ en vez de la geométrica.** **Cómo corregirlo:** La media PROPORCIONAL es multiplicativa: $x = \\sqrt{a \\cdot c}$.\n- **Error 2: Olvidar sacar la raíz cuadrada ($x = 36$).** **Cómo corregirlo:** $36$ es $x^2$; el valor de $x$ es $\\sqrt{36} = 6$."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la media proporcional entre $3$ y $27$?
  alternativas:
  - $9$
  - $15$
  - $81$
  respuesta: $9$
  solucion_pasos:
  - $x = \sqrt{3 \cdot 27} = \sqrt{81} = 9$.
- titulo: Ejemplo 2
  enunciado: Halle la media proporcional entre $8$ y $18$.
  alternativas:
  - $12$
  - $13$
  - $144$
  respuesta: $12$
  solucion_pasos:
  - $x = \sqrt{8 \cdot 18} = \sqrt{144} = 12$.
- titulo: ¿Es 10 la media proporcional entre 5 y 20?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt{5 \cdot 20} = \sqrt{100} = 10$.
  alternativas:
  - texto: Sí, porque 5 · 20 = 100 y la raíz cuadrada de 100 es 10
    es_correcta: true
    retroalimentacion: ¡Correcto! Proporción continua $5/10 = 10/20 = 0,5$.
  - texto: No, es 12,5
    es_correcta: false
    retroalimentacion: Incorrecto, 12,5 es el promedio aritmético $(5+20)/2$.
  - texto: No, es 100
    es_correcta: false
    retroalimentacion: Incorrecto, falta extraer la raíz cuadrada.
- titulo: ¿Requiere la media proporcional solo dos datos iniciales?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque los dos términos medios de la proporción continua son idénticos.
  alternativas:
  - texto: Sí, porque los medios se repiten (a/x = x/c)
    es_correcta: true
    retroalimentacion: ¡Correcto! Proporción continua.
  - texto: No, siempre se necesitan tres números
    es_correcta: false
    retroalimentacion: Incorrecto, tres números se usan en la cuarta proporcional.
  - texto: No, se necesita un solo número
    es_correcta: false
    retroalimentacion: Incorrecto, se requieren los dos extremos $a$ y $c$.
errores_frecuentes:
- Sumar y dividir por 2 en vez de multiplicar y sacar raíz cuadrada.
- Olvidar extraer la raíz cuadrada al final.
- Intentar calcular la media proporcional entre números de signos opuestos.
- Confundir media proporcional con tercera proporcional.
afirmaciones_verdaderas:
- La media proporcional entre dos números positivos $a$ y $c$ es $x = \sqrt{a \cdot c}$.
- Corresponde al término medio repetido en una proporción continua $\frac{a}{x} = \frac{x}{c}$.
- Es equivalente al concepto geométrico de media geométrica.
al_terminar_debes_poder: '![Síntesis de media proporcional](/static/img/nodos/calculo-de-la-media-proporcional-resumen.svg)


  QUÉ: Calcular e interpretar la media proporcional (o geométrica) entre dos números reales positivos.


  CÓMO: Planteando la proporción continua $\frac{a}{x} = \frac{x}{c}$ y calculando la raíz cuadrada del producto de los extremos $x = \sqrt{a \cdot c}$.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
