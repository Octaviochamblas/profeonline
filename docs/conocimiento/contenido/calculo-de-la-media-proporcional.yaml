semantic_id: MAT.NUM.PROPORCIONES.MEDIA_PROPORCIONAL
resumen_inicial: 'La media proporcional (o media geométrica) de dos números positivos $a$ y $c$ es el término repetido $b$ que satisface la proporción continua $\frac{a}{b} = \frac{b}{c}$, dada por $b = \sqrt{a \cdot c}$.'
explicacion_simple: |
  En una proporción continua, los dos números del centro son exactamente iguales: $\frac{a}{b} = \frac{b}{c}$. Ese número repetido $b$ se llama **media proporcional** (o media geométrica) entre $a$ y $c$. Para encontrarlo, multiplicas los dos extremos $a$ y $c$, y luego le sacas la raíz cuadrada al resultado ($b = \sqrt{a \cdot c}$). Por ejemplo, la media proporcional entre 4 y 9 es $\sqrt{4 \cdot 9} = \sqrt{36} = 6$.
explicacion_formal: |
  ### Definición formal
  En una **proporción geométrica continua** (donde los términos medios son idénticos):
  $$\frac{a}{b} = \frac{b}{c} \quad (a, c > 0)$$
  el término central repetido $b$ recibe el nombre de **media proporcional (o media geométrica)** entre los extremos $a$ y $c$.

  ### Fórmula de cálculo analítico
  Aplicando el Teorema Fundamental de las Proporciones:
  $$b \cdot b = a \cdot c \implies b^2 = a \cdot c \implies b = \sqrt{a \cdot c}$$

  ### Significado geométrico
  En geometría euclidiana, la media proporcional $b = \sqrt{a \cdot c}$ representa la longitud del lado de un cuadrado cuyo área es exactamente igual a la superficie de un rectángulo de lados $a$ y $c$ (Teorema de la Altura en triángulos rectángulos).

  ### Síntesis didáctica
  - Ecuación continua: $\frac{a}{b} = \frac{b}{c}$.
  - Algoritmo de cálculo: $b = \sqrt{a \cdot c}$.
definiciones_clave: |
  - **Media proporcional $b$**: Término medio repetido $b = \sqrt{a \cdot c}$ de una proporción continua.
  - **Proporción continua**: Proporción geométrica en la cual los dos términos medios son numéricamente idénticos.
  - **Media geométrica**: Concepto equivalente de la media proporcional en estadística y geometría.
propiedades_relaciones: |
  - **Independencia del orden de extremos**: Como la multiplicación es conmutativa ($a \cdot c = c \cdot a$), la media proporcional entre $a$ y $c$ es idéntica a la media proporcional entre $c$ y $a$.
  - **Acotación**: La media proporcional de dos números reales positivos distintos siempre es estrictamente menor que su media aritmética ($\sqrt{a \cdot c} < \frac{a + c}{2}$).
ejemplo_guiado:
  enunciado: 'Calcula la media proporcional exacta entre los números positivos $a = 3$ y $c = 12$.'
  pasos:
    - 'Paso 1: Planteamos la proporción continua con la media proporcional $b$ repetida al centro: $\frac{3}{b} = \frac{b}{12}$.'
    - 'Paso 2: Aplicamos el producto cruzado igualando los medios y extremos: $b \cdot b = 3 \cdot 12$.'
    - 'Paso 3: Resolvemos la multiplicación de los extremos: $b^2 = 36$.'
    - 'Paso 4: Extraemos la raíz cuadrada positiva final: $b = \sqrt{36} = 6$. La media proporcional es **6**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para determinar la media proporcional $b$ entre dos números positivos $a$ y $c$?'
    choices:
      - {text: '$b = \sqrt{a \cdot c}$, mediante la raíz cuadrada del producto de los dos extremos', is_correct: true}
      - {text: '$b = \frac{a + c}{2}$, calculando el promedio aritmético', is_correct: false}
      - {text: '$b = a \cdot c$, multiplicando los dos valores sin raíz', is_correct: false}
      - {text: '$b = a^2 + c^2$, sumando los cuadrados', is_correct: false}
    explanation: 'La alternativa correcta es ''$b = \sqrt{a \cdot c}$, mediante la raíz cuadrada del producto de los dos extremos''. De la proporción continua $\frac{a}{b} = \frac{b}{c}$ se deduce $b^2 = a \cdot c \implies b = \sqrt{a \cdot c}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la media proporcional entre los números $2$ y $8$?'
    choices:
      - {text: '$4$, pues $\sqrt{2 \cdot 8} = \sqrt{16} = 4$', is_correct: true}
      - {text: '$5$, que es la media aritmética', is_correct: false}
      - {text: '$16$, que es el producto directo', is_correct: false}
      - {text: '$10$, sumando $2 + 8$', is_correct: false}
    explanation: 'La alternativa correcta es ''$4$, pues $\sqrt{2 \cdot 8} = \sqrt{16} = 4$''. Multiplicamos $2 \cdot 8 = 16$ y extraemos la raíz cuadrada positiva.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los dos números extremos $a$ y $c$ dados en el problema.'
  - 'Paso 2: Plantear la ecuación de la proporción continua $\frac{a}{b} = \frac{b}{c}$.'
  - 'Paso 3: Multiplicar los dos extremos entre sí ($a \cdot c$).'
  - 'Paso 4: Extraer la raíz cuadrada positiva del producto obtenido: $b = \sqrt{a \cdot c}$.'
errores_correccion: |
  - **Error 1:** Confundir la media proporcional con la media aritmética (ej: calcular la media de 4 y 9 como $\frac{4 + 9}{2} = 6.5$). **Cómo corregirlo:** La media proporcional es una **media geométrica**: se multiplica y se extrae raíz cuadrada ($b = \sqrt{4 \cdot 9} = \sqrt{36} = 6$).
  - **Error 2:** Olvidar extraer la raíz cuadrada tras multiplicar los extremos (ej: responder que la media proporcional entre 2 y 8 es 16). **Cómo corregirlo:** El producto $a \cdot c$ entrega $b^2$; debes hacer el paso final de **extraer la raíz cuadrada $\sqrt{16} = 4$**.
ejemplos:
  - titulo: 'Media proporcional con cuadrados perfectos'
    enunciado: '¿La media proporcional entre $9$ y $16$ es igual a $12$?'
    alternativas:
      - 'Sí, pues $\sqrt{9 \cdot 16} = \sqrt{144} = 12$'
      - 'No, es 12.5'
      - 'No, es 144'
    respuesta: 'Sí, pues $\sqrt{9 \cdot 16} = \sqrt{144} = 12$'
    solucion_pasos:
      - '1. Producto: $9 \cdot 16 = 144$.'
      - '2. Raíz cuadrada: $\sqrt{144} = 12$.'
  - titulo: 'Media proporcional entre números iguales'
    enunciado: '¿La media proporcional entre $7$ y $7$ es el propio número $7$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt{7 \cdot 7} = \sqrt{49} = 7$.'
  - titulo: 'Media proporcional con una fracción'
    enunciado: '¿La media proporcional entre $1/2$ y $1/8$ es $1/4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt{(1/2)(1/8)} = \sqrt{1/16} = 1/4$.'
  - titulo: 'Verificación en proporción continua'
    enunciado: '¿El número $10$ es la media proporcional entre $5$ y $20$ porque $\frac{5}{10} = \frac{10}{20} = 0.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Forma la proporción continua válida.'
errores_frecuentes:
  - 'Sumar los números y dividirlos entre 2 aplicando la fórmula de la media aritmética.'
  - 'El valor final de la media proporcional es directamente el producto de los dos extremos sin aplicar raíz.'
  - 'Asignar dos números diferentes a los términos medios en una proporción continua.'
  - 'Intentar calcular la media proporcional entre dos números de signos opuestos sin considerar el conjunto complejo.'
  - 'Dividir el producto entre 2 en lugar de calcular la raíz cuadrada.'
