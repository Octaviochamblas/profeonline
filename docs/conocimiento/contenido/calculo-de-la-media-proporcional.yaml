resumen_inicial: La media proporcional (o media geométrica) entre dos números positivos
  $a$ y $b$ es el valor $x$ que ocupa los dos medios repetidos en la proporción $\frac{a}{x}
  = \frac{x}{b}$, siendo $x = \sqrt{a \cdot b}$.
explicacion_simple: Cuando los dos términos del centro de una proporción son idénticos
  ($a/x = x/b$), ese número repetido $x$ se llama media proporcional y se calcula
  multiplicando ambos extremos y sacando la raíz cuadrada del resultado.
explicacion_formal: 'Para dos números reales positivos $a, b > 0$, la **Media Proporcional
  $x$** es la solución positiva de la proporción continua:


  $$\frac{a}{x} = \frac{x}{b} \implies x^2 = a \cdot b \implies x = \sqrt{a \cdot
  b}$$


  **Relación geométrica:**

  - Corresponde exactamente a la media geométrica escalar entre las cantidades $a$
  y $b$.'
definiciones_clave: '- **Media proporcional**: Valor $x = \sqrt{a \cdot b}$ que repite
  el medio en $\frac{a}{x} = \frac{x}{b}$.'
propiedades_relaciones: '- **Media geométrica**: $x = \sqrt{a \cdot b}$ para $a, b
  > 0$.'
ejemplo_guiado:
  enunciado: Calcule la media proporcional entre $4$ y $9$.
  pasos:
  - 'Paso 1: Plantear la proporción continua: $\frac{4}{x} = \frac{x}{9}$.'
  - 'Paso 2: Aplicar el producto cruzado: $x^2 = 4 \cdot 9 = 36$.'
  - 'Paso 3: Extraer la raíz cuadrada positiva: $x = \sqrt{36} = 6$.'
  - 'Conclusión: La media proporcional es $x = 6$ (comprobación: $4/6 = 6/9 = 2/3$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula la media proporcional x entre dos números positivos a
    y b?
  choices:
  - text: 'Mediante la raíz cuadrada del producto de los extremos: x = sqrt(a · b)'
    is_correct: true
  - text: Mediante el promedio aritmético (a + b) / 2
    is_correct: false
  - text: Restando x = b - a
    is_correct: false
  - text: Elevando al cuadrado (a · b)^2
    is_correct: false
  explanation: 'La alternativa correcta es ''Mediante la raíz cuadrada del producto
    de los extremos: x = sqrt(a · b)''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para a = 4 y b = 9, ¿cuál fue la media proporcional
    x?
  choices:
  - text: 6 (porque sqrt(36) = 6)
    is_correct: true
  - text: 6,5
    is_correct: false
  - text: '13'
    is_correct: false
  - text: '36'
    is_correct: false
  explanation: La alternativa correcta es '6 (porque sqrt(36) = 6)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la media proporcional
  $x = \sqrt{a \cdot b}$ entre dos números positivos.
semantic_id: MAT.NUM.PROPORCIONES.MEDIA_PROPORCIONAL
procedimiento:
- 'Paso 1: Identificar los términos extremos $(a, d)$ y medios $(b, c)$ en la proporción
  $a/b = c/d$.'
- 'Paso 2: Aplicar la propiedad o regla requerida (producto cruzado, cuarta/media/tercera
  proporcional o composición/descomposición).'
- 'Paso 3: Resolver algebraicamente y verificar la igualdad de las razones resultantes.'
errores_correccion: '- **Error 1: Multiplicar numeradores con numeradores en lugar
  del producto cruzado ($a \cdot c = b \cdot d$).** **Cómo corregirlo:** El producto
  cruzado combina EXTREMOS con MEDIOS ($a \cdot d = b \cdot c$).


  - **Error 2: Confundir la media proporcional con la media aritmética (promedio).**
  **Cómo corregirlo:** La media proporcional es una media GEOMÉTRICA ($x = \sqrt{ab}$),
  no un promedio sumar/dividir.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROPORCIONES.MEDIA_PROPORCIONAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de proporciones.
- titulo: Ejemplo 2
  enunciado: Verificación de igualdad cruzada.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración por producto cruzado a · d = b · c.
- titulo: ¿Es a · d = b · c válido para toda proporción?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema Fundamental de las Proporciones.
- titulo: ¿Permite la composición mantener la equivalencia de razones?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(a+b)/b = (c+d)/d$ conserva la razón equivalente.
errores_frecuentes:
- Multiplicar los numeradores entre sí al aplicar la prueba del producto cruzado en
  una proporción.
- Declarar la posición de los términos medios con los términos extremos en una proporción
  escrita en fila.
- Calcular la media proporcional utilizando el promedio aritmético sumar y dividir
  entre dos.
- Invertir únicamente uno de los dos lados de la igualdad al aplicar la composición
  proporcional.
- Restar los términos extremos en lugar de despejar la cuarta proporcional por división.
afirmaciones_verdaderas:
- Una proporción es la igualdad entre dos razones $\frac{a}{b} = \frac{c}{d}$ que
  satisface el producto cruzado $a \cdot d = b \cdot c$.
- La media proporcional entre dos números positivos $a$ y $b$ equivale a su media
  geométrica $x = \sqrt{a \cdot b}$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
