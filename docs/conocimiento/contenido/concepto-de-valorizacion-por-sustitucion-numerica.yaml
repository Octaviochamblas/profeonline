semantic_id: MAT.ALG.VALORIZACION.CONCEPTO_SUSTITUCION
resumen_inicial: 'Concepto de valorización por sustitución numérica: traducción, reglas
  y aplicación práctica en Valorización de expresiones algebraicas.'
explicacion_simple: Hasta ahora, las letras eran fantasmas. Sabíamos que escondían
  un número, pero no cuál. Ha llegado el momento de arrancarles la máscara. En la
  valorización, por fin sabremos el valor real de la expresión.
explicacion_formal: "### Definición formal\n\nAl sustituir todas las variables por\
  \ sus valores concretos, eliminamos el componente simbólico y pasamos a aritmética\
  \ pura.\n\n### Desarrollo didáctico\n\nImagina que tienes la expresión $3x + 5$.\
  \ Esto es un 'molde' algebraico.\nSi te dicen 'Valora la expresión para $x = 2$',\
  \ tu trabajo es quirúrgico:\n1. Borras la $x$.\n2. Pones un $(2)$ en su lugar.\n\
  3. Calculas: $3(2) + 5 = 6 + 5 = 11$.\n\nEl valor numérico de esa expresión, cuando\
  \ la variable vale 2, es 11. \nRegla de oro de la sustitución: **Cada vez que reemplaces\
  \ una letra por un número, pon ese número entre paréntesis**. Esto te salvará la\
  \ vida cuando haya signos negativos o exponentes."
definiciones_clave: '- **Concepto de valorización por sustitución numérica**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de concepto de valorización por sustitución numérica.'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de concepto de
    valorización por sustitución numérica.
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a concepto de valorización por
    sustitución numérica.
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
