semantic_id: MAT.ALG.VALORIZACION.CONCEPTO_SUSTITUCION
resumen_inicial: 'El concepto de valorización por sustitución numérica consiste en reemplazar las variables o letras de una expresión algebraica por valores numéricos dados y calcular el resultado aplicando el orden de las operaciones.'
explicacion_simple: |
  La **valorización de una expresión algebraica** consiste en transformar una expresión con letras en un cálculo puramente numérico:
  - **Paso 1: Sustituir** cada letra o variable por su valor asignado (usando paréntesis obligatorios).
  - **Paso 2: Resolver** la operación numérica resultante siguiendo la jerarquía estricta (PARÉNTESIS, POTENCIAS, MULTIPLICACIONES/DIVISIONES, SUMAS/RESTAS).
  - **Ejemplo**: Valorizar la expresión $3x + 5$ para $x = 4$:
    - Reemplazamos $x$ por $4 \implies 3(4) + 5$.
    - Multiplicamos $3 \cdot 4 = 12$.
    - Sumamos $12 + 5 = 17$.
    - El valor numérico de la expresión es **$17$**.
explicacion_formal: |
  ### Definición formal
  Sea $E(x_1, x_2, \dots, x_n) \in \mathbb{R}[x_1, \dots, x_n]$ una función o expresión polinómica sobre $n$ variables reales. El **homomorfismo de evaluación** (o valorización) $\mathrm{ev}_{(c_1, \dots, c_n)}: \mathbb{R}[x_1, \dots, x_n] \to \mathbb{R}$ asigna a la expresión un valor numérico único $V \in \mathbb{R}$ mediante la sustitución puntual de la n-tupla de constantes $(c_1, \dots, c_n) \in \mathbb{R}^n$:

  $$\mathrm{ev}_{(c_1, \dots, c_n)}(E) = E(c_1, c_2, \dots, c_n) = V$$

  ### Jerarquía Operatoria Estricta (PEMDAS)
  1. Paréntesis y agrupaciones internas.
  2. Potencias y radicación.
  3. Multiplicaciones y divisiones (de izquierda a derecha).
  4. Adiciones y sustracciones (de izquierda a derecha).

  ### Síntesis didáctica
  La valorización numérica conecta las expresiones abstractas del álgebra con aplicaciones prácticas como fórmulas de física, geometría e intereses financieros.
definiciones_clave: |
  - **Valorización numérica**: Proceso aritmético de calcular el valor final de una expresión algebraica al asignar números a sus variables.
  - **Sustitución puntual**: Reemplazo directo de cada símbolo de variable por su constante correspondiente.
  - **Jerarquía operatoria**: Prioridad estricta de las operaciones matemáticas para obtener un valor unívoco.
propiedades_relaciones: |
  - **Unicidad del valor**: Para una tupla de valores asignados fijada, la valorización de una expresión algebraica bien definida produce un único resultado numérico.
  - **Invarianza algebraica**: Dos expresiones algebraicamente equivalentes (ej: $2(x+1)$ y $2x+2$) producen el mismo valor numérico para cualquier $x$.
ejemplo_guiado:
  enunciado: 'Calcula el valor numérico de la expresión $2a^2 - 3b + 1$ para $a = 3$ y $b = 4$.'
  pasos:
    - 'Paso 1: Sustituimos las variables $a$ por $(3)$ y $b$ por $(4)$: $2(3)^2 - 3(4) + 1$.'
    - 'Paso 2: Resolvemos la potencia $3^2 = 9 \implies 2(9) - 3(4) + 1$.'
    - 'Paso 3: Realizamos las multiplicaciones de izquierda a derecha: $18 - 12 + 1$.'
    - 'Paso 4: Realizamos la resta y la suma final: $18 - 12 = 6 \implies 6 + 1 = 7$.'
    - 'Conclusión: El valor numérico de la expresión es **$7$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué paso se debe realizar en primer lugar al valorizar una expresión algebraica?'
    choices:
      - {text: 'Sustituir cada variable por su valor numérico correspondiente utilizando paréntesis', is_correct: true}
      - {text: 'Sumar todos los coeficientes numéricos de la expresión', is_correct: false}
      - {text: 'Multiplicar todas las variables sin importar sus valores', is_correct: false}
      - {text: 'Eliminar las variables y dejar solo los números constantes', is_correct: false}
    explanation: 'La alternativa correcta es ''Sustituir cada variable por su valor numérico correspondiente utilizando paréntesis''. Primer paso de sustitución.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor numérico de la expresión $5x - 2y$ para $x = 2$ y $y = 3$?'
    choices:
      - {text: 'El valor numérico es $4$, obtenido mediante $5(2) - 2(3) = 10 - 6 = 4$', is_correct: true}
      - {text: 'El valor numérico es $16$', is_correct: false}
      - {text: 'El valor numérico es $10$', is_correct: false}
      - {text: 'El valor numérico es $-4$', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor numérico es $4$, obtenido mediante $5(2) - 2(3) = 10 - 6 = 4$''. Sustitución y cálculo $10 - 6 = 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la expresión algebraica reemplazando cada variable por su valor numérico entre paréntesis.'
  - 'Paso 2: Calcular las potencias y raíces involucradas.'
  - 'Paso 3: Ejecutar las multiplicaciones y divisiones de izquierda a derecha.'
  - 'Paso 4: Resolver las sumas y restas finales para obtener el resultado numérico unívoco.'
errores_correccion: |
  - **Error 1:** Multiplicar la variable por el coeficiente ANTES de resolver la potencia (escribir $2 \cdot 3 = 6 \implies 6^2 = 36$ para $2x^2$ con $x=3$). **Cómo corregirlo:** La jerarquía exige **elevar al cuadrado PRIMERO ($3^2 = 9$)** y luego multiplicar por 2 ($2 \cdot 9 = 18$).
  - **Error 2:** Yuxtaponer los números sin multiplicar (escribir $34$ para $3x$ con $x=4$). **Cómo corregirlo:** El coeficiente y la variable **SE MULTIPLICAN ($3 \cdot 4 = 12$)**, no se pegan las cifras.
ejemplos:
  - titulo: 'Valorización lineal simple'
    enunciado: '¿Cuál es el valor de $4x + 7$ para $x = 3$?'
    alternativas:
      - '$19$'
      - '$43$'
      - '$28$'
    respuesta: '$19$'
    solucion_pasos:
      - '1. Sustitución: $4(3) + 7$.'
      - '2. Producto: $12 + 7 = 19$.'
  - titulo: 'Valorización con potencias'
    enunciado: '¿Cuál es el valor de $x^2 + 2x$ para $x = 5$?'
    alternativas:
      - '$35$'
      - '$45$'
      - '$25$'
    respuesta: '$35$'
    solucion_pasos:
      - '1. Sustitución: $5^2 + 2(5)$.'
      - '2. Operaciones: $25 + 10 = 35$.'
  - titulo: 'Unicidad del resultado'
    enunciado: 'Para $a = 2$ y $b = 3$, ¿es la valorización de $a + b$ siempre igual a $5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la unicidad del homomorfismo de evaluación.'
  - titulo: 'Expresiones equivalentes'
    enunciado: '¿Producen las expresiones $2(x + 1)$ y $2x + 2$ el mismo valor numérico $10$ para $x = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $2(4+1) = 2(5) = 10$ y $2(4) + 2 = 8 + 2 = 10$.'
errores_frecuentes:
  - 'Multiplicar el coeficiente numérico por la variable antes de resolver la potencia en expresiones como ax^2.'
  - 'Yuxtaponer las cifras escribiendo 34 al sustituir x por 4 en la expresión 3x.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Alterar la jerarquía operatoria resolviendo la suma antes que la multiplicación.'
  - 'Declarar que la valorización numérica de una expresión produce múltiples resultados para los mismos datos.'
afirmaciones_verdaderas:
  - 'La valorización numérica consiste en sustituir cada variable por una constante y aplicar el orden de las operaciones.'
  - 'La jerarquía operatoria exige resolver las potencias antes de efectuar las multiplicaciones por los coeficientes.'
al_terminar_debes_poder: 'Valorizar expresiones algebraicas sustituyendo variables por números dados y respetando la jerarquía de las operaciones para hallar el resultado exacto.'
