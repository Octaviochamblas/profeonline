resumen_inicial: La valorización de una expresión algebraica consiste en reemplazar
  sus variables literales por números específicos para calcular su valor numérico
  resultante.
explicacion_simple: 'Valorizar una expresión es como darle números concretos a las
  letras para resolver la cuenta. Si tenemos $3x + 2$ y nos dicen que $x = 4$, reemplazamos
  la $x$ por $4$ y hacemos la operación: $3(4) + 2 = 12 + 2 = 14$. La expresión valía
  $14$ para ese valor de $x$.'
explicacion_formal: 'Sea $E(x_1, \dots, x_m)$ una expresión algebraica y $v = (v_1,
  \dots, v_m) \in \mathbb{R}^m$ un punto del dominio. La **Valorización** $V_v(E)$
  es el homomorfismo de evaluación en $v$:


  $$V_v(E) = E(v_1, v_2, \dots, v_m) \in \mathbb{R}$$


  > **Complemento didáctico:** La valorización transforma una forma abstracta simbólica
  en un valor escalar particular respetando el orden operacional.'
definiciones_clave: '- **Valorización numérica**: Cálculo del valor resultante tras
  sustituir variables por constantes.

  - **Evaluación funcional**: Asignación $x \to v$ para obtener $f(v)$.'
propiedades_relaciones: '- **Preservación operacional**: Las propiedades aritméticas
  de las operaciones determinan el cálculo final.'
ejemplo_guiado:
  enunciado: Valorice la expresión $E(a, b) = 4a - 2b + 5$ para $a = 3$ y $b = 1$.
  pasos:
  - 'Paso 1: Reemplazar $a$ por $3$ y $b$ por $1$ en la expresión: $4(3) - 2(1) +
    5$.'
  - 'Paso 2: Calcular los productos: $12 - 2 + 5$.'
  - 'Paso 3: Realizar las sumas y restas de izquierda a derecha: $10 + 5 = 15$.'
  - 'Conclusión: El valor numérico de la expresión es $15$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste la valorización por sustitución numérica en una expresión
    algebraica?
  choices:
  - text: En reemplazar las variables literales por números asignados y resolver las
      operaciones resultantes
    is_correct: true
  - text: En eliminar los coeficientes numéricos de la expresión
    is_correct: false
  - text: En transformar las letras en nuevos exponentes
    is_correct: false
  - text: En igualar la expresión a cero de forma obligatoria
    is_correct: false
  explanation: La alternativa correcta es 'En reemplazar las variables literales por
    números asignados y resolver las operaciones resultantes'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4a - 2b + 5 con a = 3 y b = 1, ¿cuál fue el
    valor numérico obtenido?
  choices:
  - text: '15'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '10'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: La alternativa correcta es '15'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los valores asignados a cada variable.'
- 'Paso 2: Sustituir cada variable por su valor numérico correspondiente utilizando
  paréntesis.'
- 'Paso 3: Resolver las operaciones respetando la jerarquía operacional.'
errores_correccion: '- **Error 1: Pegar los números al sustituir (reemplazar $x=3$
  en $4x$ como $43$).** **Cómo corregirlo:** La expresión $4x$ representa la multiplicación
  $4 \cdot x$, por lo que $x=3$ da $4(3) = 12$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al valorizar la expresión 5x + 3 para x = 2, ¿qué resultado se obtiene?
  alternativas:
  - '13'
  - '52'
  - '10'
  - '15'
  respuesta: '13'
  solucion_pasos:
  - '1. Sustituir x por 2: 5(2) + 3.'
  - '2. Calcular: 10 + 3 = 13.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de 2a - b para a = 4 y b = 3?
  alternativas:
  - '5'
  - '11'
  - '2'
  - '8'
  respuesta: '5'
  solucion_pasos:
  - '1. Sustituir: 2(4) - 3.'
  - '2. Calcular: 8 - 3 = 5.'
- titulo: ¿Es el valor de 3x + 1 para x = 0 igual a 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, 3(0) + 1 = 0 + 1 = 1.
- titulo: ¿Cambia el valor numérico resultante si se sustituyen números distintos
    en la misma variable?
  respuesta: Sí
  solucion_pasos:
  - Sí, el valor numérico depende de las constantes asignadas a las variables.
errores_frecuentes:
- Concatenar el coeficiente con el valor sustituido formando un número decimal en
  lugar de multiplicar.
- Sumar antes de multiplicar al resolver la jerarquía operacional en la evaluación.
- Declarar que la sustitución de cero anula todos los términos de la expresión.
- Omitir sustituir una variable que aparece repetida en varios términos.
- Declarar que el resultado de valorizar debe contener letras.
afirmaciones_verdaderas:
- Valorizar es calcular el resultado escalar tras reemplazar las letras por números
  fijos.
- La jerarquía de operaciones exige resolver primero las multiplicaciones antes de
  las adiciones.
al_terminar_debes_poder: Al terminar serás capaz de valorizar cualquier expresión
  algebraica reemplazando variables por constantes y calculando el resultado.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Valorización.
estado: publicado
