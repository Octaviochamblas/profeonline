semantic_id: MAT.ALG.FUNC_TRIG_MODELO.TANGENTE_CONCEPTO
resumen_inicial: 'Concepto de función tangente como extensión de las funciones trigonométricas
  básicas: círculo unitario, amplitud, período y transformaciones de Modelamiento
  trigonométrico y extensiones.'
explicacion_simple: Además del seno y el coseno, existe una tercera función trigonométrica
  fundamental que se construye como el cociente entre ambas.
explicacion_formal: '### Definición formal


  Para todo ángulo $\theta$ tal que $\cos(\theta)\neq0$, se define $\tan(\theta)=\dfrac{\sin(\theta)}{\cos(\theta)}$.
  Geométricamente, representa la razón entre la coordenada $y$ y la coordenada $x$
  del punto asociado a $\theta$ en el círculo unitario.


  ### Desarrollo didáctico


  $\tan(\pi/4)=\dfrac{\sin(\pi/4)}{\cos(\pi/4)}=\dfrac{\sqrt{2}/2}{\sqrt{2}/2}=1$.
  $\tan(0)=\dfrac{0}{1}=0$. $\tan(\pi/2)$ no está definida, porque $\cos(\pi/2)=0$.'
definiciones_clave: '- **Concepto de función tangente como extensión de las funciones
  trigonométricas básicas**: Función periódica fundamentada en las coordenadas del
  círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a concepto de función tangente como extensión de las funciones trigonométricas
  básicas.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    concepto de función tangente como extensión de las funciones trigonométricas básicas.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de concepto de función tangente como extensión de las
    funciones trigonométricas básicas.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
