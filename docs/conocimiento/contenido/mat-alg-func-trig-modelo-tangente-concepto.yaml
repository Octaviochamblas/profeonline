semantic_id: MAT.ALG.FUNC_TRIG_MODELO.TANGENTE_CONCEPTO
resumen_inicial: 'Concepto de la función tangente $f(x) = \tan(x)$ como el cociente de senos y cosenos o razón entre la ordenada y la abscisa.'
explicacion_simple: |
  Además del seno y el coseno, existe una tercera función trigonométrica fundamental: la **función tangente**, escrita como $f(x) = \tan(x)$. En el círculo unitario, la tangente equivale a dividir la coordenada vertical entre la coordenada horizontal: $\tan(x) = \frac{\sin(x)}{\cos(x)}$. A diferencia del seno y el coseno (que están atrapados entre $-1$ y $1$), la tangente no tiene techo ni piso: puede crecer hacia infinito positivo o caer hacia infinito negativo. Además, como no se puede dividir por cero, se rompe en los puntos donde el coseno vale cero.
explicacion_formal: |
  ### Definición formal
  La **función tangente fundamental** es la función real de variable real $f: \mathbb{R} \setminus \left\{\frac{\pi}{2} + k\pi : k \in \mathbb{Z}\right\} \to \mathbb{R}$ definida analíticamente por la razón trigonométrica:
  $$f(x) = \tan(x) = \frac{\sin(x)}{\cos(x)}$$

  ### Desglose simbólico
  - Dominio: $\operatorname{Dom}(\tan) = \mathbb{R} \setminus \left\{\frac{\pi}{2} + k\pi : k \in \mathbb{Z}\right\}$ (se excluyen los ceros del coseno).
  - Recorrido: $\operatorname{Rec}(\tan) = \mathbb{R} = (-\infty, +\infty)$ (sin acotación).
  - Período fundamental: $T = \pi$ radianes ($180^\circ$).

  ### Síntesis didáctica
  Geométricamente, la tangente representa la **pendiente de la recta** que forma el lado terminal del ángulo con el eje X. Puesto que las pendientes pueden tomar cualquier valor real, su recorrido abarca todo $\mathbb{R}$.
definiciones_clave: |
  - **Función tangente ($\tan x$)**: Cociente analítico entre la función seno y la función coseno.
  - **Pendiente del lado terminal**: Interpretación geométrica de $\tan(x)$ como la inclinación $\frac{\Delta y}{\Delta x}$.
  - **Período de la tangente ($T = \pi$)**: Longitud del ciclo de repetición fundamental de la función tangente.
propiedades_relaciones: |
  - **Simetría impar**: La función tangente es impar: $\tan(-x) = \frac{\sin(-x)}{\cos(-x)} = \frac{-\sin(x)}{\cos(x)} = -\tan(x)$.
  - **Identidad con la secante**: Estándar analítico $1 + \tan^2(x) = \sec^2(x)$.
ejemplo_guiado:
  enunciado: 'Calcula el valor exacto de la función tangente en los ángulos $x = 0$, $x = \frac{\pi}{4}$ y $x = \frac{\pi}{3}$.'
  pasos:
    - 'Paso 1: Evaluar en $x = 0$: $\tan(0) = \frac{\sin(0)}{\cos(0)} = \frac{0}{1} = 0$.'
    - 'Paso 2: Evaluar en $x = \frac{\pi}{4}$ ($45^\circ$): $\tan\left(\frac{\pi}{4}\right) = \frac{\sin(\pi/4)}{\cos(\pi/4)} = \frac{\sqrt{2}/2}{\sqrt{2}/2} = 1$.'
    - 'Paso 3: Evaluar en $x = \frac{\pi}{3}$ ($60^\circ$): $\tan\left(\frac{\pi}{3}\right) = \frac{\sin(\pi/3)}{\cos(\pi/3)} = \frac{\sqrt{3}/2}{1/2} = \sqrt{3} \approx 1.732$.'
    - 'Paso 4: Concluir que los valores crecen rápidamente al acercarse el ángulo a $90^\circ$ ($\frac{\pi}{2}$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el recorrido (conjunto imagen) de la función tangente fundamental $f(x) = \tan(x)$?'
    choices:
      - {text: 'El conjunto de todos los números reales $\mathbb{R} = (-\infty, +\infty)$', is_correct: true}
      - {text: 'El intervalo cerrado $[-1, 1]$', is_correct: false}
      - {text: 'El intervalo positivo $[0, +\infty[$', is_correct: false}
      - {text: 'El conjunto $\mathbb{R} \setminus \{0\}$', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto de todos los números reales $\mathbb{R} = (-\infty, +\infty)$''. La tangente no está acotada.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el período fundamental $T$ de la función tangente $f(x) = \tan(x)$?'
    choices:
      - {text: '$T = \pi$ radianes ($180^\circ$)', is_correct: true}
      - {text: '$T = 2\pi$ radianes ($360^\circ$)', is_correct: false}
      - {text: '$T = \frac{\pi}{2}$ radianes ($90^\circ$)', is_correct: false}
      - {text: '$T = 4\pi$ radianes', is_correct: false}
    explanation: 'La alternativa correcta es ''$T = \pi$ radianes ($180^\circ$)''. A diferencia del seno y el coseno, la tangente se repite cada $\pi$ radianes.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Expresar la tangente como el cociente de senos y cosenos: $\tan(x) = \frac{\sin x}{\cos x}$.'
  - 'Paso 2: Evaluar por separado $\sin x$ y $\cos x$ en el ángulo deseado.'
  - 'Paso 3: Si $\cos x = 0$, declarar que la tangente está indefinida en ese ángulo.'
  - 'Paso 4: Si $\cos x \neq 0$, efectuar la división de valores para obtener $\tan x$.'
errores_correccion: |
  - **Error 1:** Afirmar que el recorrido de la función tangente está acotado en $[-1, 1]$ como el seno y el coseno. **Cómo corregirlo:** La tangente representa una razón de pendientes y su recorrido abarca la totalidad de la recta real $\mathbb{R} = (-\infty, +\infty)$.
  - **Error 2:** Creer que el período de la tangente es $2\pi$. **Cómo corregirlo:** La función tangente completa un ciclo en una longitud de $\pi$ radianes ($180^\circ$), por lo que su período es $T = \pi$.
ejemplos:
  - titulo: 'Cero de la tangente'
    enunciado: '¿Cuánto vale $\tan(0)$?'
    alternativas:
      - '$0$'
      - '$1$'
      - 'Indefinido'
    respuesta: '$0$'
    solucion_pasos:
      - '1. $\tan(0) = \frac{\sin(0)}{\cos(0)} = \frac{0}{1} = 0$.'
  - titulo: 'Tangente de pi cuartos'
    enunciado: '¿Cuál es el valor de $\tan\left(\frac{\pi}{4}\right)$?'
    alternativas:
      - '$1$'
      - '$\sqrt{3}$'
      - '$\frac{\sqrt{3}}{3}$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. $\sin\left(\frac{\pi}{4}\right) = \cos\left(\frac{\pi}{4}\right) = \frac{\sqrt{2}}{2}$.'
      - '2. El cociente de cantidades iguales es $1$.'
  - titulo: 'Indefinición en pi medios'
    enunciado: '¿La expresión $\tan\left(\frac{\pi}{2}\right)$ carece de valor en los números reales?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\cos\left(\frac{\pi}{2}\right) = 0$, produciendo una división por cero no definida.'
  - titulo: 'Simetría impar'
    enunciado: '¿Se cumple la identidad $\tan(-x) = -\tan(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al ser cociente entre seno (impar) y coseno (par), la tangente es una función impar.'
errores_frecuentes:
  - 'La afirmación de que el recorrido de la función tangente está acotado en el intervalo cerrado $[-1, 1]$.'
  - 'La afirmación de que el período fundamental de la función tangente es igual a $2\pi$.'
  - 'La afirmación de que la función tangente está definida para todos los números reales sin ninguna restricción.'
  - 'La afirmación de que en $x = \frac{\pi}{2}$ la función tangente toma el valor numérico de 1.'
  - 'La afirmación de que la tangente es una función par que elimina el signo negativo de sus argumentos.'
afirmaciones_verdaderas:
  - 'La función tangente $f(x) = \tan(x)$ se define como la razón $\frac{\sin(x)}{\cos(x)}$ y posee un recorrido no acotado igual a todos los números reales $\mathbb{R}$.'
  - 'El período fundamental de la función tangente base es $T = \pi$ radianes ($180^\circ$) y se indefine en todos los puntos donde $\cos(x) = 0$.'
al_terminar_debes_poder: |
  QUÉ: Definir e interpretar la función tangente $f(x) = \tan(x)$ como cociente trigonométrico $\frac{\sin x}{\cos x}$.
  CÓMO: Explicar su recorrido ilimitado $\mathbb{R}$, su período $T = \pi$ y la inasistencia de valor en los ceros del coseno.
