semantic_id: MAT.NUM.ENTEROS_CONJUNTO.VALOR_ABSOLUTO_OPUESTOS
resumen_inicial: "Dos números opuestos, como $3$ y $-3$, están a la misma distancia del cero, así que su valor absoluto siempre es igual: $|a|=|-a|$."
explicacion_simple: |
  Los números opuestos son parejas como 3 y -3, o 7 y -7: mismo número pero con signos contrarios.
  Son como un reflejo en el espejo — están a la misma distancia del cero pero en lados distintos de
  la recta. Por eso su valor absoluto es siempre idéntico: $|3|=|-3|=3$.
explicacion_formal: |
  Para todo entero $a$, se cumple $|a| = |-a|$, porque $a$ y $-a$ están a la misma distancia del
  origen. Si $|x| = k$ con $k > 0$, entonces existen exactamente dos soluciones: $x = k$ o $x = -k$.
definiciones_clave: |
  **Números opuestos**: pareja $a$ y $-a$, con signos contrarios e igual magnitud. **Simetría del
  valor absoluto**: $|a| = |-a|$ para cualquier entero $a$.
propiedades_relaciones: |
  Si $|a| = |b|$, no se puede concluir que $a = b$: también puede ocurrir que $a = -b$. El cero es
  su propio opuesto ($-0 = 0$), por lo que $|0|$ tiene una única solución.
ejemplo_guiado:
  enunciado: "¿Qué valores de $x$ cumplen $|x| = 14$?"
  pasos:
    - "Se reconoce que $|x|=14$ representa una distancia de 14 unidades al cero."
    - "Se identifican los dos puntos a 14 unidades del cero: uno a la derecha y otro a la izquierda."
    - "Resultado: $x = 14$ o $x = -14$."
checkpoints:
  - placement: after_explicacion_formal
    question: "Si $|x| = 9$, ¿cuántas soluciones distintas tiene $x$?"
    choices:
      - {text: "Ninguna", is_correct: false}
      - {text: "Una", is_correct: false}
      - {text: "Dos", is_correct: true}
      - {text: "Infinitas", is_correct: false}
    explanation: "La correcta es Dos, porque $x=9$ o $x=-9$ cumplen $|x|=9$ por la simetría del valor absoluto."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿qué valores de $x$ cumplen $|x| = 21$?"
    choices:
      - {text: "Solo $x = 21$", is_correct: false}
      - {text: "$x = 21$ o $x = -21$", is_correct: true}
      - {text: "Solo $x = -21$", is_correct: false}
      - {text: "No tiene solución", is_correct: false}
    explanation: "La correcta es $x = 21$ o $x = -21$: ambos están a 21 unidades del cero."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar si dos números tienen la misma magnitud numérica pero signos contrarios."
  - "Paso 2: Aplicar el operador de valor absoluto a ambos números por separado."
  - "Paso 3: Comprobar que ambos resultados son idénticos y positivos (o cero si el número es cero)."
errores_correccion: |
  Un error frecuente es pensar que si $|a|=|b|$ entonces $a=b$: se olvida el caso $a=-b$, que
  también cumple la igualdad. Otro error es creer que el cero no tiene opuesto porque "no tiene
  signo"; el cero sí tiene opuesto, y es él mismo ($-0=0$).

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Demuestre mediante valor absoluto que $10$ y $-10$ son números opuestos."
    solucion_pasos:
      - "Se calcula el valor absoluto de $10$: $|10| = 10$."
      - "Se calcula el valor absoluto de $-10$: $|-10| = 10$."
      - "Como $|10| = |-10|$, se confirma que tienen la misma distancia al origen."
      - "Al tener signos distintos y misma distancia, son opuestos."
  - titulo: "Ejemplo 2"
    enunciado: "¿Cuál es el valor de $x$ si $|x| = 25$?"
    solucion_pasos:
      - "Se reconoce que el valor absoluto representa una distancia de 25 unidades al cero."
      - "Se identifican los dos puntos en la recta a 25 unidades del cero: uno a la derecha y otro a la izquierda."
      - "Resultado: $x$ puede ser $25$ o $-25$."
  - titulo: "¿Es verdad que $|{-8}| = |8|$?"
    respuesta: "Sí"
    solucion_pasos:
      - "$|8| = 8$ porque $8$ es positivo."
      - "$|-8| = 8$ porque el valor absoluto de un negativo es su opuesto positivo."
      - "Ambos resultados son iguales: la propiedad $|a| = |-a|$ se cumple."
  - titulo: "¿Pueden existir dos enteros distintos con el mismo valor absoluto?"
    respuesta: "Sí"
    solucion_pasos:
      - "Los números opuestos $a$ y $-a$ tienen el mismo valor absoluto: $|a| = |-a|$."
      - "Por ejemplo, $|7| = |-7| = 7$, siendo $7$ y $-7$ dos enteros distintos."
      - "Esto ocurre para todo entero no nulo: siempre existe otro entero (su opuesto) con igual valor absoluto."
errores_frecuentes:
  - "El opuesto de un número negativo también es negativo."
  - "Si $|a| = |b|$, entonces $a = b$ (olvidando que también puede ser $a = -b$)."
  - "El cero no tiene opuesto porque no tiene signo."
  - "Los números opuestos son siempre diferentes en valor absoluto."
  - "$|-5|$ es mayor que $|5|$ porque el signo negativo 'agrega' algo al número."
al_terminar_debes_poder: |
  Reconocer parejas de números opuestos y resolver ecuaciones simples de la forma $|x|=k$
  identificando ambas soluciones cuando corresponda.

fuente: "Matemática 7º Básico Tomo 1 p.208"
estado: publicado
