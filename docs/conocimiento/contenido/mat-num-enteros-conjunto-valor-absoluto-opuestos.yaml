semantic_id: MAT.NUM.ENTEROS_CONJUNTO.VALOR_ABSOLUTO_OPUESTOS
resumen_inicial: 'Los números opuestos $a$ y $-a$ tienen exactamente el mismo valor
  absoluto: $|-a| = |a|$.'
explicacion_simple: Dos números opuestos (como $5$ y $-5$) se encuentran situados
  a exactamente la misma distancia del cero en la recta numérica, uno a la derecha
  y otro a la izquierda. Por ello, el valor absoluto de dos números opuestos es exactamente
  igual.
explicacion_formal: 'Para todo entero $a \in \mathbb{Z}$, la **Propiedad de Simetría
  del Valor Absoluto** establece la identidad métrica:


  $$|-a| = |a| \quad \forall a \in \mathbb{Z}$$


  **Desglose de la fórmula:**

  - $a$ y $-a$: Par de enteros opuestos aditivos ($a + (-a) = 0$).

  - $|-a|$: Distancia del opuesto aditivo al origen $0$.

  - $|a|$: Distancia del número original al origen $0$.


  > **Complemento didáctico:** La simetría respecto al origen en la recta numérica
  implica que invertir el signo de un número no modifica su distancia al centro.'
definiciones_clave: '- **Números opuestos aditivos**: Par de enteros $a$ y $-a$ situados
  a lados contrarios del cero a igual distancia.

  - **Simetría métrica**: Identidad $|-a| = |a|$ que refleja la distancia equivalente
  al origen.'
propiedades_relaciones: '- **Ecuaciones con módulo**: Si $|x| = k$ (con $k > 0$),
  existen dos soluciones: $x = k$ o $x = -k$.'
ejemplo_guiado:
  enunciado: Halle todas las soluciones enteras para la ecuación $|x| = 6$ utilizando
    la propiedad de opuestos.
  pasos:
  - 'Paso 1: Identificar que la distancia buscada al cero es de 6 unidades.'
  - 'Paso 2: Aplicar simetría: tanto el entero positivo $6$ como el negativo $-6$
    distan 6 unidades de 0.'
  - 'Conclusión: Las dos soluciones son $x = 6$ y $x = -6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué los números opuestos a y -a tienen el mismo valor absoluto?
  choices:
  - text: Porque se encuentran a la misma distancia del origen cero en la recta
    is_correct: true
  - text: Porque ambos son enteros positivos
    is_correct: false
  - text: Porque su suma es diferente de cero
    is_correct: false
  - text: Es una coincidencia sin demostración
    is_correct: false
  explanation: La alternativa correcta es 'Porque se encuentran a la misma distancia
    del origen cero en la recta'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la ecuación |x| = 6 del ejemplo guiado, ¿cuántas soluciones enteras
    existen?
  choices:
  - text: Dos soluciones (x = 6 y x = -6)
    is_correct: true
  - text: Una sola solución (x = 6)
    is_correct: false
  - text: Ninguna solución
    is_correct: false
  - text: Infinitas soluciones
    is_correct: false
  explanation: La alternativa correcta es 'Dos soluciones (x = 6 y x = -6)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el número dado $a$.'
- 'Paso 2: Reconocer su opuesto aditivo $-a$.'
- 'Paso 3: Aplicar $|-a| = |a|$ para simplificar expresiones o resolver ecuaciones.'
errores_correccion: '- **Error 1: Pensar que $|-a|$ da un resultado diferente a $|a|$.**
  **Cómo corregirlo:** Ambos miden la misma distancia al cero ($|-a| = |a|$).


  - **Error 2: Creer que si $|x| = 5$, entonces $x$ solo puede ser el entero positivo
  $5$.** **Cómo corregirlo:** La ecuación admite dos soluciones opuestas: $x = 5$
  o $x = -5$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $|a| = 11$, ¿cuánto vale $|-a|$?
  alternativas:
  - '11'
  - '-11'
  - '0'
  respuesta: '11'
  solucion_pasos:
  - Por propiedad de opuestos, $|-a| = |a| = 11$.
- titulo: Ejemplo 2
  enunciado: Resuelva $|x - 3| = 0$.
  alternativas:
  - x = 3
  - x = -3
  - x = 0
  respuesta: x = 3
  solucion_pasos:
  - Como la distancia es 0, la única solución es $x - 3 = 0 \implies x = 3$.
- titulo: ¿Es cierto que |-8| y |8| son iguales a 8?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos números distan exactamente 8 unidades del cero.
- titulo: ¿La ecuación |x| = -3 tiene soluciones reales?
  respuesta: 'No'
  solucion_pasos:
  - No, el valor absoluto no puede ser igual a una distancia negativa.
errores_frecuentes:
- El valor absoluto del opuesto de un número $|-a|$ da como resultado un número negativo.
- Si $|x| = 9$, la única solución posible para la variable $x$ es el entero positivo
  $+9$.
- Dos números opuestos en la recta numérica tienen distancias distintas respecto al
  cero.
- La propiedad $|-a| = |a|$ solo se cumple cuando el número $a$ es un entero par.
- El valor absoluto de la resta $|a - b|$ es diferente al valor absoluto de la resta
  invertida $|b - a|$.
afirmaciones_verdaderas:
- Para cualquier entero $a$, se cumple estrictamente que $|-a| = |a|$.
- Dos números opuestos en la recta numérica están situados a la misma distancia del
  cero.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la propiedad de los números
  opuestos $|-a| = |a|$, resolviendo ecuaciones de valor absoluto al considerar ambas
  soluciones simétricas.
