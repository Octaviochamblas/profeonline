semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_SEMIINSCRITO_MITAD_ARCO
resumen_inicial: 'La medida de un ángulo semiinscrito es igual a la mitad de la medida angular del arco que encierra entre sus lados: γ = med(TA) / 2.'
explicacion_simple: 'Aunque un ángulo semiinscrito tiene un lado por fuera de la circunferencia (la recta tangente), ¡se comporta matemáticamente **exactamente igual que un ángulo inscrito normal**!


  Su medida en grados es siempre la **mitad del arco** que queda atrapado entre la tangente y la cuerda: **$\gamma = \frac{\overset{\frown}{TA}}{2}$**.


  Por ejemplo, si la cuerda delimita un arco de **$140^\circ$**, el ángulo semiinscrito que lo abraza mide la mitad: **$140^\circ / 2 = 70^\circ$**. Y al revés, el arco que encierra mide el doble del ángulo: **$\overset{\frown}{TA} = 2\gamma$**.


  ![Medida del ángulo semiinscrito](/static/img/nodos/relacion-entre-angulo-semiinscrito-y-mitad-del-arco-correspondiente-intro.svg)

  '
explicacion_formal: '### Teorema del ángulo semiinscrito

  Sea $\mathcal{L}_T$ la recta tangente a la circunferencia $\mathcal{C}(O, r)$ en $T$ y sea $\overline{TA}$ una cuerda. La medida angular del ángulo semiinscrito $\gamma$ es estrictamente la mitad de la medida del arco subtendido $\overset{\frown}{TA}$:

  $$\gamma = \frac{\text{med}(\overset{\frown}{TA})}{2} \iff \text{med}(\overset{\frown}{TA}) = 2\gamma$$


  ### Demostración geométrica mediante perpendicularidad radial

  1. Trácese el radio $\overline{OT}$. Por el teorema de perpendicularidad radio-tangente: $\overline{OT} \perp \mathcal{L}_T$ (el ángulo total es de $90^\circ$).

  2. Trácese el radio $\overline{OA}$, formando el triángulo isósceles $\triangle OTA$ con $OT = OA = r$.

  3. En $\triangle OTA$, el ángulo central es $\angle TOA = \alpha = \text{med}(\overset{\frown}{TA})$.

  4. Como los ángulos de la base son iguales: $\angle OTA = \frac{180^\circ - \alpha}{2} = 90^\circ - \frac{\alpha}{2}$.

  5. El ángulo semiinscrito $\gamma$ es el complemento de $\angle OTA$ respecto a la perpendicular de $90^\circ$:

  $$\gamma = 90^\circ - \angle OTA = 90^\circ - \left(90^\circ - \frac{\alpha}{2}\right) = \frac{\alpha}{2} = \frac{\text{med}(\overset{\frown}{TA})}{2}$$


  > **Complemento didáctico:** Recuerda esta equivalencia directa para la PAES: un ángulo semiinscrito y un ángulo inscrito que subtienden el mismo arco $\overset{\frown}{TA}$ **miden exactamente lo mismo**. Si calculas uno, ¡tienes el otro de inmediato!

  '
definiciones_clave: '- **Teorema del ángulo semiinscrito**: Fórmula $\gamma = \overset{\frown}{TA} / 2$.

  - **Equivalencia inscrito-semiinscrito**: Igualdad de medidas ante un mismo arco subtendido.

  - **Doble del arco**: $\overset{\frown}{TA} = 2\gamma$.

  '
propiedades_relaciones: '- **Ángulo suplementario adyacente**: El otro ángulo semiinscrito que forma la recta tangente mide $180^\circ - \gamma = \frac{360^\circ - \overset{\frown}{TA}}{2}$.

  - **Límite tangencial**: El ángulo semiinscrito es el caso límite de un ángulo inscrito cuando uno de los extremos del arco coincide con el vértice ($V \to T$).

  - **Caso de $90^\circ$**: Si $\overset{\frown}{TA} = 180^\circ$ (semicircunferencia), $\gamma = 90^\circ$ (recto).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de cálculo de ángulo semiinscrito](/static/img/nodos/relacion-entre-angulo-semiinscrito-y-mitad-del-arco-correspondiente-ejemplos.svg)


    Una recta es tangente a una circunferencia en $T$. Se traza la cuerda $\overline{TA}$ delimitando un arco menor de $124^\circ$. Calcula la medida del ángulo semiinscrito $\gamma$ y la del ángulo semiinscrito suplementario que se forma al otro lado de la recta tangente.'
  pasos:
  - 'Paso 1: Aplicar el teorema al arco menor $\overset{\frown}{TA} = 124^\circ$: $\gamma = \frac{124^\circ}{2}$.'
  - 'Paso 2: Calcular la medida del ángulo semiinscrito: $\gamma = 62^\circ$.'
  - 'Paso 3: Calcular el ángulo semiinscrito suplementario: Como están sobre una recta, suman $180^\circ$: $\gamma'' = 180^\circ - 62^\circ = 118^\circ$ (o calculando la mitad del arco mayor: $\frac{360^\circ - 124^\circ}{2} = \frac{236^\circ}{2} = 118^\circ$).'
checkpoints:
- placement: after_explicacion_formal
  question: Si el arco subtendido por una cuerda y una recta tangente mide 110°, ¿cuánto mide el ángulo semiinscrito correspondiente?
  choices:
  - text: 55°.
    is_correct: true
  - text: 110°.
    is_correct: false
  - text: 220°.
    is_correct: false
  - text: 70°.
    is_correct: false
  explanation: 'La alternativa correcta es ''55°.'' El ángulo semiinscrito es la mitad del arco que encierra: $110^\circ / 2 = 55^\circ$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo semiinscrito mide 43°, ¿cuál es la medida angular del arco que encierra?
  choices:
  - text: 86°.
    is_correct: true
  - text: 43°.
    is_correct: false
  - text: 21,5°.
    is_correct: false
  - text: 137°.
    is_correct: false
  explanation: 'La alternativa correcta es ''86°.'' El arco mide el doble del ángulo semiinscrito: $2 \cdot 43^\circ = 86^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el punto de tangencia $T$ y el arco $\overset{\frown}{TA}$ encerrado por el ángulo.

  2. Para calcular el ángulo semiinscrito, dividir la medida del arco entre 2: $\gamma = \frac{\overset{\frown}{TA}}{2}$.

  3. Para calcular el arco a partir del ángulo semiinscrito, multiplicar por 2: $\overset{\frown}{TA} = 2\gamma$.

  4. Si se solicita el ángulo del otro lado de la tangente, restar de $180^\circ$.

  '
errores_correccion: '- **Error común 1:** Asumir que el ángulo semiinscrito es igual al arco. **Corrección:** Es la MITAD del arco, exactamente como un ángulo inscrito.

  - **Error común 2:** Confundir el arco menor con el arco mayor al elegir el ángulo correspondiente. **Corrección:** Observar hacia qué lado de la tangente abre el ángulo.

  '
ejemplos:
- tipo: A
  titulo: Cálculo de ángulo semiinscrito
  enunciado: Un ángulo semiinscrito subtiende un arco de $76^\circ$. ¿Cuánto mide el ángulo?
  alternativas:
  - text: $38^\circ$.
    is_correct: true
  - text: $76^\circ$.
    is_correct: false
  - text: $152^\circ$.
    is_correct: false
  - text: $104^\circ$.
    is_correct: false
  explicacion: $\gamma = 76^\circ / 2 = 38^\circ$.
- tipo: B
  titulo: Igualdad con ángulo inscrito
  enunciado: ¿Mide lo mismo un ángulo semiinscrito que un ángulo inscrito que subtienda exactamente su mismo arco?
  respuesta: Sí
  explicacion: Sí. Ambos miden exactamente la mitad del arco correspondiente ($\frac{\overset{\frown}{TA}}{2}$).
errores_frecuentes:
- '''Olvidar dividir entre dos el arco al calcular el ángulo semiinscrito.'''
- '''Restar de $90^\circ$ en lugar de dividir por dos el arco.'''
- '''Creer que por tener un lado tangente, su fórmula es diferente a la de un ángulo inscrito.'''
afirmaciones_verdaderas:
- '''El ángulo semiinscrito mide la mitad del arco comprendido entre la tangente y la cuerda ($\gamma = \frac{\overset{\frown}{TA}}{2}$).'''
- '''Un ángulo semiinscrito y un ángulo inscrito que subtienden el mismo arco son congruentes.'''
- '''El arco encerrado por un ángulo semiinscrito mide el doble de la medida de dicho ángulo ($2\gamma$).'''
al_terminar_debes_poder: '**QUÉ:** Calcular medidas de ángulos semiinscritos y arcos subtendidos.


  **CÓMO:** Aplicando $\gamma = \frac{\overset{\frown}{TA}}{2}$ y $\overset{\frown}{TA} = 2\gamma$.


  ![Síntesis de ángulo semiinscrito mitad de arco](/static/img/nodos/relacion-entre-angulo-semiinscrito-y-mitad-del-arco-correspondiente-resumen.svg)

  '
