semantic_id: MAT.FUND.RAZONAMIENTO_LOGICO.CONDICIONAL_RECIPROCO
resumen_inicial: Definición, tabla de verdad y análisis de no equivalencia del recíproco de un condicional ($q \to p$) respecto al condicional directo ($p \to q$).
explicacion_simple: 'El **recíproco** (o condicional recíproco) se obtiene simplemente intercambiando el orden de las proposiciones: en lugar de "Si $p$, entonces $q$" ($p \to q$), escribimos **"Si $q$, entonces $p$" ($q \to p$)**. Es fundamental saber que **un condicional y su recíproco NO significan lo mismo**. Por ejemplo: "Si un animal es un perro, entonces es un mamífero" es verdadero; pero su recíproco: "Si un animal es un mamífero, entonces es un perro" es completamente falso (puede ser un gato o una ballena).


  ![Infografía: Recíproco de un Condicional](/static/img/nodos/reciproco-de-un-condicional-intro.svg)'
explicacion_formal: "### Definición formal\nDado un condicional directo $\\Phi = p \\to q$, su **proposición recíproca** es la fórmula obtenida por la permutación de sus términos constituyentes:\n$$\\text{Recíproco}(p \\to q) = q \\to p$$\nEn el cálculo proposicional clásico, el condicional directo y su recíproco **no son lógicamente equivalentes**:\n$$p \\to q \\not\\equiv q \\to p$$\ndado que la fórmula $(p \\to q) \\leftrightarrow (q \\to p)$ no es una tautología sino una contingencia.\n\n### Desglose simbólico\n- Vector de salida directo: $\\mathbf{v}(p \\to q) = [V, F, V, V]^T$.\n- Vector de salida recíproco: $\\mathbf{v}(q \\to p) = [V, V, F, V]^T$.\n- Discrepancia en asignaciones intermedias:\n  - Fila 2 ($V, F$): Directo = $F$, Recíproco = $V$.\n  - Fila 3 ($F, V$): Directo = $V$, Recíproco = $F$.\n\n> **Complemento didáctico:** La conjunción simultánea de un condicional y su recíproco constituye formalmente el conectivo bicondicional: $(p \\to q) \\land (q \\to p) \\equiv p \\leftrightarrow\
  \ q$.\n"
definiciones_clave: '- **Recíproco de un condicional ($q \to p$)**: Proposición condicional formada al intercambiar antecedente y consecuente.

  - **Falacia de afirmación del consecuente**: Error deductivo que consiste en asumir que la verdad de $p \to q$ y $q$ garantiza la verdad de $p$.

  - **No conmutatividad condicional**: Propiedad del condicional por la cual la permutación de operandos altera la tabla de verdad.

  '
propiedades_relaciones: '- **Equivalencia con el inverso**: El recíproco $q \to p$ es lógicamente equivalente al inverso $\neg p \to \neg q$ por la ley del contrarrecíproco.

  - **Condición suficiente vs necesaria**: En $p \to q$, $p$ es suficiente para $q$; en $q \to p$, $p$ pasa a ser condición necesaria.

  '
ejemplo_guiado:
  enunciado: 'Dado el enunciado condicional directo: "Si un número entero termina en $0$, entonces es divisible por $5$", formula su recíproco y analiza el valor de verdad de ambos.


    ![Diagrama: Recíproco de un Condicional](/static/img/nodos/reciproco-de-un-condicional-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar las partes del condicional directo: - Antecedente $p$: "Un número entero termina en $0$". - Consecuente $q$: "El número es divisible por $5$".'
  - 'Paso 2: Evaluar el condicional directo $p \to q$: Todo número terminado en $0$ ($10, 20, 30\dots$) es múltiplo de $5$. Por lo tanto, el directo es **Verdadero ($V$)**.'
  - 'Paso 3: Formular el recíproco permutando las proposiciones ($q \to p$): "Si un número entero es divisible por $5$, entonces termina en $0$".'
  - 'Paso 4: Evaluar el recíproco $q \to p$: Existen números divisibles por $5$ que no terminan en $0$, como el $15$ o el $25$ (contraejemplos). Por lo tanto, el recíproco es **Falso ($F$)**.'
  - 'Paso 5: Concluir que el condicional directo y su recíproco poseen valores de verdad independientes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la relación lógica formal entre un condicional $p \to q$ y su recíproco $q \to p$?
  choices:
  - text: No son lógicamente equivalentes ($p \to q \not\equiv q \to p$)
    is_correct: true
  - text: Son siempre lógicamente equivalentes
    is_correct: false
  - text: El recíproco es siempre una contradicción
    is_correct: false
  - text: El recíproco es la negación de $p \to q$
    is_correct: false
  explanation: La alternativa correcta es 'No son lógicamente equivalentes ($p \to q \not\equiv q \to p$)'. Sus tablas de verdad discrepan en las filas 2 y 3.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el recíproco de la proposición "Si un polígono es un cuadrado, entonces es un rectángulo"?
  choices:
  - text: Si un polígono es un rectángulo, entonces es un cuadrado
    is_correct: true
  - text: Si un polígono no es un cuadrado, entonces no es un rectángulo
    is_correct: false
  - text: Si un polígono no es un rectángulo, entonces no es un cuadrado
    is_correct: false
  - text: Un polígono es un cuadrado si y solo si es un rectángulo
    is_correct: false
  explanation: La alternativa correcta es 'Si un polígono es un rectángulo, entonces es un cuadrado'. Se forma intercambiando antecedente y consecuente.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el antecedente $p$ y el consecuente $q$ del condicional directo original $p \to q$.'
- 'Paso 2: Permutar las posiciones: colocar $q$ como nuevo antecedente y $p$ como nuevo consecuente.'
- 'Paso 3: Escribir la nueva fórmula condicional: $q \to p$.'
- 'Paso 4: Si se requiere evaluar verdad, analizar de forma independiente el recíproco sin asumir el valor del directo.'
errores_correccion: '- **Error 1:** Asumir que si un teorema condicional es verdadero, su recíproco es automáticamente verdadero. **Cómo corregirlo:** El recíproco debe ser demostrado de forma independiente; en matemáticas muchos teoremas verdaderos poseen recíprocos falsos.

  - **Error 2:** Confundir el recíproco ($q \to p$) con el contrarrecíproco ($\neg q \to \neg p$). **Cómo corregirlo:** El recíproco solo intercambia el orden sin negar; el contrarrecíproco intercambia el orden Y niega ambas proposiciones.

  '
ejemplos:
- titulo: Formulación de recíproco
  enunciado: ¿Cuál es el recíproco de "Si llueve, entonces el suelo está mojado"?
  alternativas:
  - Si el suelo está mojado, entonces llueve
  - Si no llueve, entonces el suelo no está mojado
  - Si el suelo no está mojado, entonces no llueve
  respuesta: Si el suelo está mojado, entonces llueve
  solucion_pasos:
  - '1. Antecedente: "llueve". Consecuente: "el suelo está mojado".'
  - '2. Permutando: "Si el suelo está mojado, entonces llueve".'
- titulo: Vector de verdad del recíproco
  enunciado: ¿El vector de salida canónico de $q \to p$ es $[V, V, F, V]^T$?
  respuesta: Sí
  solucion_pasos:
  - Sí, tiene su único valor falso en la fila 3 donde $q=V$ y $p=F$.
- titulo: Conjunción con el directo
  enunciado: ¿La fórmula $(p \to q) \land (q \to p)$ es equivalente al bicondicional $p \leftrightarrow q$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el bicondicional es la conjunción de los dos condicionales recíprocos.
- titulo: Equivalencia con el inverso
  enunciado: ¿Es el recíproco $q \to p$ equivalente al inverso $\neg p \to \neg q$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\neg p \to \neg q \equiv \neg(\neg q) \to \neg(\neg p) \equiv q \to p$.
errores_frecuentes:
- La afirmación de que el condicional recíproco $q \to p$ es lógicamente equivalente al condicional directo $p \to q$.
- La afirmación de que la verdad de una implicación garantiza de forma automática la verdad de su recíproco.
- La afirmación de que para formar el recíproco se deben negar ambas proposiciones componentes.
- La afirmación de que la tabla de verdad del recíproco tiene el valor falso ubicado en la fila 2.
- La afirmación de que el recíproco de una tautología es siempre una contradicción.
afirmaciones_verdaderas:
- El recíproco de un condicional $p \to q$ es la proposición $q \to p$, obtenida al permutar antecedente y consecuente.
- Un condicional y su recíproco no son lógicamente equivalentes en general ($p \to q \not\equiv q \to p$) y poseen vectores de verdad distintos.
al_terminar_debes_poder: '![Cuadro resumen: Recíproco de un Condicional](/static/img/nodos/reciproco-de-un-condicional-resumen.svg)


  QUÉ: Identificar, formular y contrastar el recíproco de un condicional ($q \to p$).

  CÓMO: Permutar antecedente y consecuente, evaluar su tabla de verdad $[V, V, F, V]^T$ y evitar la falacia de afirmación del consecuente.'
