semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.OBTUSO
resumen_inicial: Un ángulo obtuso es aquel cuya medida es estrictamente mayor que
  90° y menor que 180°, con una abertura mayor a la de un ángulo recto.
explicacion_simple: '![Ángulo Obtuso](/static/img/nodos/angulo-obtuso-con-medida-mayor-que-90-y-menor-que-180-intro.svg)


  Imagina un libro abierto de par en par sobre una mesa o la inclinación de un sillón
  reclinable. La abertura es visiblemente más ancha que la esquina de un cuadrado
  (90°), pero sin llegar a quedar totalmente plano (180°). Eso es un ángulo obtuso.'
explicacion_formal: '### Definición formal

  Un ángulo $\angle AOB$ es **obtuso** si su medida angular $\alpha$ es estrictamente
  mayor que un ángulo recto ($90^\circ$) y estrictamente menor que un ángulo extendido
  ($180^\circ$):


  $$90^\circ < \mu(\angle AOB) < 180^\circ \iff \frac{\pi}{2} < \alpha < \pi \text{
  rad}$$


  ### Desglose simbólico y geométrico

  - $\alpha \in (90^\circ, 180^\circ)$: Intervalo abierto de medidas angulares obtusas.

  - Signos trigonométricos: $\sin \alpha > 0$ y $\cos \alpha < 0$ (segundo cuadrante).

  - Suplemento agudo: Su suplemento $\beta = 180^\circ - \alpha$ es siempre un ángulo
  agudo.


  ### Síntesis didáctica

  Los ángulos obtusos caracterizan a los triángulos obtusángulos y a las esquinas
  externas de diversos polígonos convexos en el plano.'
definiciones_clave: '- **Ángulo obtuso**: Ángulo con medida en el intervalo abierto
  $(90^\circ, 180^\circ)$.

  - **Triángulo obtusángulo**: Triángulo que posee un ángulo obtuso y dos ángulos
  agudos. '
propiedades_relaciones: '- **Convexidad**: Todo ángulo obtuso pertenece a la familia
  de los ángulos convexos ($<180^\circ$).

  - **Suplemento**: El suplemento de un ángulo obtuso $\theta$ es siempre un ángulo
  agudo ($180^\circ - \theta$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Obtuso](/static/img/nodos/angulo-obtuso-con-medida-mayor-que-90-y-menor-que-180-ejemplos.svg)


    En un triángulo obtusángulo, uno de sus ángulos interiores mide $\theta = 125^\circ$.
    Clasifica este ángulo y calcula su ángulo suplementario.'
  pasos:
  - 'Paso 1: Comprobar que $90^\circ < 125^\circ < 180^\circ$, lo que clasifica a
    $\theta$ como ángulo obtuso.'
  - 'Paso 2: Plantear la ecuación del suplemento: $\theta + \beta = 180^\circ$.'
  - 'Paso 3: Calcular $\beta = 180^\circ - 125^\circ = 55^\circ$.'
  - 'Paso 4: Concluir que el suplemento es un ángulo agudo de $55^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes medidas corresponde a un ángulo obtuso?
  choices:
  - text: Un ángulo de 135°
    is_correct: true
  - text: Un ángulo de 90°
    is_correct: false
  - text: Un ángulo de 180°
    is_correct: false
  - text: Un ángulo de 45°
    is_correct: false
  explanation: Por cumplir 90° < 135° < 180°, un ángulo de 135° es un ángulo obtuso.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántos ángulos obtusos puede tener como máximo un triángulo?
  choices:
  - text: Como máximo un ángulo obtuso
    is_correct: true
  - text: Puede tener dos ángulos obtusos
    is_correct: false
  - text: Los tres ángulos pueden ser obtusos
    is_correct: false
  - text: Ningún triángulo puede tener ángulos obtusos
    is_correct: false
  explanation: Dado que los ángulos interiores suman 180°, un triángulo solo puede
    tener como máximo un ángulo obtuso.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Medir o despejar algebraicamente el valor de $\theta$ en grados.'
- 'Paso 2: Comprobar la desigualdad estricta $90^\circ < \theta < 180^\circ$.'
- 'Paso 3: Clasificar como ángulo obtuso.'
errores_correccion: No confundas ángulos mayores a 180° (cóncavos) con ángulos obtusos
  (entre 90° y 180°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes ángulos es obtuso?
  alternativas:
  - $110^\circ$
  - $90^\circ$
  - $180^\circ$
  respuesta: $110^\circ$
  solucion_pasos:
  - $110^\circ$ es mayor que $90^\circ$ y menor que $180^\circ$, por lo tanto es obtuso.
- titulo: Ejemplo 2
  enunciado: Si el suplemento de $\alpha$ mide $30^\circ$, ¿cuánto mide $\alpha$ y
    cómo se clasifica?
  alternativas:
  - $150^\circ$, ángulo obtuso
  - $60^\circ$, ángulo agudo
  - $150^\circ$, ángulo cóncavo
  respuesta: $150^\circ$, ángulo obtuso
  solucion_pasos:
  - $\alpha = 180^\circ - 30^\circ = 150^\circ$, el cual es obtuso.
- titulo: ¿Un ángulo de 180° es obtuso?
  respuesta: 'No'
  solucion_pasos:
  - No, 180° es un ángulo extendido o llano.
- titulo: ¿El suplemento de un ángulo obtuso es siempre agudo?
  respuesta: Sí
  solucion_pasos:
  - Sí, si $\theta > 90^\circ$, entonces $180^\circ - \theta < 90^\circ$ (agudo).
errores_frecuentes:
- Incluir los valores extremos de $90^\circ$ o $180^\circ$ como obtusos.
- Confundir ángulos obtusos con ángulos cóncavos ($>180^\circ$).
- Intentar construir un triángulo con dos ángulos obtusos.
- Creer que al recortar la longitud de los rayos un ángulo obtuso se vuelve agudo.
- Olvidar que un ángulo obtuso siempre es convexo.
afirmaciones_verdaderas:
- Un ángulo obtuso mide más de $90^\circ$ y menos de $180^\circ$.
- En un triángulo obtusángulo solo existe un ángulo obtuso.
al_terminar_debes_poder: '**QUÉ:** Identificar, clasificar y calcular medidas de ángulos
  obtusos en polígonos y figuras geométricas.


  **CÓMO:** Verificando la condición $90^\circ < \theta < 180^\circ$ y aplicando propiedades
  de suplementariedad.


  ![Resumen de Ángulo Obtuso](/static/img/nodos/angulo-obtuso-con-medida-mayor-que-90-y-menor-que-180-resumen.svg)'
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
