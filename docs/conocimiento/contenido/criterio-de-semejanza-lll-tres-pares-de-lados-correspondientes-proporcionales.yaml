semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.CRITERIO_LLL
resumen_inicial: 'El Criterio de Semejanza LLL (Lado-Lado-Lado) establece que si los tres pares de lados homólogos de dos triángulos son proporcionales en una misma razón $k$, entonces los triángulos son semejantes.'
explicacion_simple: |
  ![Criterio de Semejanza LLL (Lado - Lado - Lado)](/static/img/nodos/criterio-de-semejanza-lll-tres-pares-de-lados-correspondientes-proporcionales-intro.svg)

  Si divides los 3 lados del triángulo grande por los 3 lados del chico (ordenados de menor a mayor) y da el mismo número, los triángulos son semejantes.
explicacion_formal: |
  ### Teorema formal (Criterio LLL)
  Sean dos triángulos con lados ordenados $a \le b \le c$ y $a' \le b' \le c'$. Si:

  $$\frac{a'}{a} = \frac{b'}{b} = \frac{c'}{c} = k \quad (k > 0)$$

  Entonces:

  $$\Delta ABC \sim \Delta A'B'C'$$

  ### Desglose simbólico y geométrico
  - Demostración por Teorema del Coseno:
    $$\cos(A') = \frac{b'^2 + c'^2 - a'^2}{2b'c'} = \frac{k^2 b^2 + k^2 c^2 - k^2 a^2}{2 (kb)(kc)} = \frac{b^2 + c^2 - a^2}{2bc} = \cos(A) \implies \angle A' \cong \angle A$$
  - Como los tres cosenos coinciden, todos los ángulos homólogos son congruentes.

  ### Síntesis didáctica
  Ordenar siempre los lados de menor a mayor antes de formar las tres fracciones de prueba.
definiciones_clave: |
  - **Semejanza geométrica**: Relación entre figuras que poseen la misma forma con ángulos congruentes y lados proporcionales.
  - **Razón de semejanza (k)**: Factor numérico constante resultante del cociente entre longitudes homólogas ($k = L^\prime/L$).
  - **Criterios de semejanza**: Condiciones mínimas suficientes para garantizar la semejanza de triángulos (AA, LLL, LAL).
  - **Relación dimensional**: Comportamiento de magnitudes geométricas bajo escala: $1D \to k$, $2D \to k^2$, $3D \to k^3$.
propiedades_relaciones: |
  - **Invarianza angular**: $\angle_i \cong \angle_i^\prime \quad \forall i$.
  - **Proporción de perímetros**: $\frac{P^\prime}{P} = k$.
  - **Proporción de áreas**: $\frac{A^\prime}{A} = k^2$.
  - **Proporción de volúmenes**: $\frac{V^\prime}{V} = k^3$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Criterio de Semejanza LLL (Lado - Lado - Lado)](/static/img/nodos/criterio-de-semejanza-lll-tres-pares-de-lados-correspondientes-proporcionales-ejemplos.svg)

    Aplica las propiedades y criterios de semejanza para determinar las medidas desconocidas y justificar la relación geométrica.
  pasos:
  - 'Paso 1: Identificar las figuras dadas y verificar el cumplimiento de los criterios de semejanza (AA, LLL o LAL).'
  - 'Paso 2: Establecer la correspondencia de vértices, ángulos homólogos y lados correspondientes.'
  - 'Paso 3: Calcular la razón de semejanza lineal $k = L^\prime / L$ a partir de los datos numéricos conocidos.'
  - 'Paso 4: Aplicar el factor de escala adecuado según la dimensión de la magnitud: lineal ($k$), superficial ($k^2$) o volumétrica ($k^3$).'
  - 'Paso 5: Expresar el resultado final con su respectiva unidad de medida.'
checkpoints:
