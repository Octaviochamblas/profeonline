semantic_id: MAT.ALG.RELACION_EXP_LOG.CONVERSION_LOG_EXP
resumen_inicial: La conversión de una ecuación logarítmica a forma exponencial aplica la equivalencia $\log_b(g(x)) = c \Longleftrightarrow g(x) = b^c$, eliminando el operador trascendente para resolver ecuaciones polinómicas equivalentes.
explicacion_simple: "![La conversión de una ecuación logarítmica a forma exponencial aplica la equivalencia $\\log_b(g(x)) = c \\Longleftrightarrow g(x) = b^c$, eliminando el operador trascendente para resolver ecuaciones polinómicas equivalentes](/static/img/nodos/conversion-de-una-ecuacion-logaritmica-a-forma-exponencial-intro.svg)\n\n\nPara librarte de un logaritmo en una ecuación, solo tienes que **pasarlo a su forma exponencial**:\n\n$$\\log_{\\mathbf{b}}(\\mathbf{g(x)}) = \\mathbf{c} \\quad \\Longleftrightarrow \\quad \\mathbf{g(x) = b^c}$$\n\n- **¿Cómo se hace?**\n  1. Asegúrate de que el logaritmo esté completamente solo en un miembro.\n  2. La base $b$ empuja hacia el otro lado y levanta a $c$ al exponente: **$g(x) = b^c$**.\n  3. Resuelves la ecuación polinómica normal resultante.\n- **Ejemplo guiado:**\n  $$\\log_2(3x - 1) = 5 \\implies 3x - 1 = 2^5 = 32 \\implies 3x = 33 \\implies \\mathbf{x = 11}$$"
explicacion_formal: 'Sea una ecuación logarítmica aislada $\log_b(g(x)) = c$ con $b \in \mathbb{R}^+ \setminus \{1\}$ y $c \in \mathbb{R}$.

  Aplicando la aplicación exponencial directa $\exp_b: \mathbb{R} \to \mathbb{R}^+$ a ambos miembros de la ecuación:

  $$\exp_b(\log_b(g(x))) = \exp_b(c)$$

  Por la propiedad cancelativa $(\exp_b \circ \log_b)(g(x)) = g(x)$ para $g(x) > 0$:

  $$g(x) = b^c$$


  **Garantía automática de existencia**:

  Como $b^c > 0$ para todo $c \in \mathbb{R}$, la igualdad $g(x) = b^c$ impone intrínsecamente que el argumento sea estrictamente positivo, asegurando la consistencia del dominio.'
definiciones_clave: '- **Conversión exponencial de ecuaciones**: Transformación de un logaritmo en potencia mediante la base homóloga.

  - **Eliminación del operador trascendente**: Paso de una ecuación logarítmica a un modelo algebraico estándar.'
propiedades_relaciones: '- **Aislamiento previo obligatorio**: En $a \log_b(g(x)) + k = d$, se debe despejar $\log_b(g(x)) = \frac{d - k}{a}$ antes de convertir.

  - **Logaritmo natural y decimal**: $\ln(g(x)) = c \iff g(x) = e^c$ y $\log(g(x)) = c \iff g(x) = 10^c$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La conversión de una ecuación logarítmica a forma exponencial aplica la equivalencia $\log_b(g(x)) = c \Longleftrightarrow g(x) = b^c$, eliminando el operador trascendente para resolver ecuaciones polinómicas equivalentes](/static/img/nodos/conversion-de-una-ecuacion-logaritmica-a-forma-exponencial-ejemplos.svg)



    Convierte a forma exponencial y resuelve las siguientes ecuaciones:

    1) $\log_3(2x + 5) = 4$

    2) $2\ln(x - 1) = 6$

    3) $\log(x^2 - 19) = 2$'
  pasos:
  - 'Paso 1: Para $\log_3(2x + 5) = 4$:

    - Pasar a exponencial: $2x + 5 = 3^4 = 81$.

    - Despejar: $2x = 76 \implies \mathbf{x = 38}$.'
  - 'Paso 2: Para $2\ln(x - 1) = 6$:

    - Aislar el logaritmo: $\ln(x - 1) = 3$.

    - Pasar a exponencial: $x - 1 = e^3 \implies \mathbf{x = 1 + e^3 \approx 21{,}085}$.'
  - 'Paso 3: Para $\log(x^2 - 19) = 2$:

    - Base 10 implícita: $x^2 - 19 = 10^2 = 100$.

    - Despejar: $x^2 = 119 \implies \mathbf{x = \pm \sqrt{119}}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma exponencial equivalente a $\log_4(5x - 1) = 3$?
  choices:
  - text: 5x - 1 = 4³ (5x - 1 = 64)
    is_correct: true
  - text: 5x - 1 = 4 · 3
    is_correct: false
  - text: 5x - 1 = 3⁴
    is_correct: false
  - text: 4^(5x - 1) = 3
    is_correct: false
  explanation: La alternativa correcta es '5x - 1 = 4³ (5x - 1 = 64)'. La base 4 se eleva al resultado 3 para liberar el argumento.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En $\ln(x) = 0$, ¿cuánto vale x al convertir a forma exponencial?
  choices:
  - text: x = e⁰ = 1
    is_correct: true
  - text: x = 0
    is_correct: false
  - text: x = e
    is_correct: false
  - text: x = -1
    is_correct: false
  explanation: La alternativa correcta es 'x = e⁰ = 1'. Cualquier base elevada a la potencia cero es igual a 1.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar el logaritmo con coeficiente 1 en un miembro de la igualdad.'
- 'Paso 2: Formular la potencia equivalente $g(x) = b^c$.'
- 'Paso 3: Calcular el valor numérico de la potencia $b^c$.'
- 'Paso 4: Resolver algebraicamente la ecuación polinómica resultante para despejar $x$.'
errores_correccion: '- **Error común:** Multiplicar la base por el resultado en vez de elevarla (ej: $g(x) = b \cdot c$).

  - **Cómo corregirlo:** La base **se eleva a la potencia $c$**: $g(x) = \mathbf{b^c}$.'
ejemplos:
- titulo: 'Ejemplo 1: Conversión lineal directa'
  enunciado: 'Resuelve $\log_2(x - 6) = 4$:'
  alternativas:
  - x = 22
  - x = 14
  - x = 16
  - x = 10
  respuesta: x = 22
  solucion_pasos:
  - 'Paso 1: $x - 6 = 2^4 = 16 \implies x = 22$.'
- titulo: 'Ejemplo 2: Con logaritmo decimal'
  enunciado: 'Resuelve $\log(2x) = 3$:'
  alternativas:
  - x = 500
  - x = 15
  - x = 1000
  - x = 30
  respuesta: x = 500
  solucion_pasos:
  - 'Paso 1: $2x = 10^3 = 1000 \implies x = 500$.'
- titulo: 'Ejemplo 3: Despeje previo con factor'
  enunciado: 'Resuelve $3\log_5(x) = 6$:'
  alternativas:
  - x = 25
  - x = 10
  - x = 125
  - x = 15
  respuesta: x = 25
  solucion_pasos:
  - 'Paso 1: $\log_5(x) = 2 \implies x = 5^2 = 25$.'
- titulo: 'Ejemplo 4: Con base natural'
  enunciado: 'Resuelve $\ln(x + 2) = 1$:'
  alternativas:
  - x = e - 2 (≈ 0,718)
  - x = e + 2
  - x = 2e
  - x = 1
  respuesta: x = e - 2 (≈ 0,718)
  solucion_pasos:
  - 'Paso 1: $x + 2 = e^1 = e \implies x = e - 2$.'
errores_frecuentes:
- Multiplicar la base por el exponente.
- Olvidar aislar el logaritmo antes de aplicar la potencia.
- Confundir la base 10 implícita con base e.
afirmaciones_verdaderas:
- La conversión a forma exponencial g(x) = bᶜ elimina el operador logarítmico.
- Esta técnica es aplicable a cualquier base admisible b > 0 con b ≠ 1.
al_terminar_debes_poder: '**QUÉ:** Convertir ecuaciones logarítmicas a forma exponencial para su resolución.


  **CÓMO:** Aislando el término log_b(g(x)) = c y formulando la ecuación algebraica g(x) = bᶜ.


