semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.EXPONENTE_POSITIVO_NEGATIVO
resumen_inicial: 'La distinción entre exponentes positivos y negativos en funciones potencia establece que para $n > 0$ la función es continua en todo $\mathbb{R}$ pasando por el origen $(0, 0)$, mientras que para $n < 0$ la función está indefinida en $x = 0$, presentando asíntota vertical $\mathcal{A}_V: x = 0$ y asíntota horizontal $\mathcal{A}_H: y = 0$.'
explicacion_simple: "![La distinción entre exponentes positivos y negativos en funciones potencia establece que para $n > 0$ la función es continua en todo $\\mathbb{R}$ pasando por el origen $(0, 0)$, mientras que para $n < 0$ la función está indefinida en $x = 0$, presentando asíntota vertical $\\mathcal{A}_V: x = 0$ y asíntota horizontal $\\mathcal{A}_H: y = 0$](/static/img/nodos/distincion-entre-exponentes-positivos-y-negativos-en-funciones-potencia-intro.svg)\n\n\nEl **signo del exponente $n$** cambia radicalmente cómo se comporta la función cerca del cero y en el infinito:\n\n- **Exponente POSITIVO ($n > 0$, como $x^2, x^3$):**\n  - **En $x = 0$:** $f(0) = a \\cdot 0^n = \\mathbf{0}$ (¡pasa siempre por el origen $(0, 0)$!).\n  - **Continuidad:** Es suave y continua en todo $\\mathbb{R}$ sin cortes ni huecos.\n  - **En el infinito:** Crece sin límite hacia $\\pm\\infty$.\n- **Exponente NEGATIVO ($n < 0$, como $x^{-1} = 1/x, x^{-2} = 1/x^2$):**\n  - **En $x = 0$:** ¡División por cero!\
  \ $f(0)$ **NO EXISTE**.\n  - **Asíntota Vertical en $x = 0$ (el eje $Y$):** La curva se dispara al infinito pegada al eje $Y$.\n  - **Asíntota Horizontal en $y = 0$ (el eje $X$):** Cuando $x$ es gigante, $1/x^n$ se acerca a cero."
explicacion_formal: "Sea $f(x) = a \\cdot x^n$ con $a \\in \\mathbb{R}^*$ y $n \\in \\mathbb{Z}^*$.\n\n**Análisis asintótico y de dominios comparados**:\n1. **Régimen $n \\in \\mathbb{Z}^+$ (Exponente Positivo)**:\n   - $\\operatorname{Dom}(f) = \\mathbb{R}$.\n   - $\\lim_{x \\to 0} f(x) = f(0) = 0 \\implies (0, 0) \\in \\operatorname{Gr}(f)$.\n   - $\\lim_{x \\to +\\infty} |f(x)| = +\\infty$ (divergencia polinómica no acotada).\n2. **Régimen $n \\in \\mathbb{Z}^-$ (Exponente Negativo, sea $n = -k$ con $k > 0$)**:\n   - $\\operatorname{Dom}(f) = \\mathbb{R} \\setminus \\{0\\} = ]-\\infty, 0[ \\cup ]0, +\\infty[$.\n   - $\\lim_{x \\to 0} |f(x)| = \\lim_{x \\to 0} \\left|\\frac{a}{x^k}\\right| = +\\infty \\implies \\mathcal{A}_V: x = 0$.\n   - $\\lim_{x \\to \\pm\\infty} f(x) = \\lim_{x \\to \\pm\\infty} \\frac{a}{x^k} = 0 \\implies \\mathcal{A}_H: y = 0$."
definiciones_clave: '- **Comportamiento en el origen**: Continuidad $f(0) = 0$ ($n > 0$) frente a discontinuidad infinita ($n < 0$).

  - **Asíntotas hiperbólicas**: Par de rectas ortogonales $x = 0$ e $y = 0$ características de $n < 0$.'
propiedades_relaciones: '- **Dualidad de límites**: Para $n > 0$, cero da cero e infinito da infinito; para $n < 0$, cero da infinito e infinito da cero.

  - **Dominio perforado**: En $n < 0$, el cero está estrictamente excluido del dominio: $\mathbb{R} \setminus \{0\}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La distinción entre exponentes positivos y negativos en funciones potencia establece que para $n > 0$ la función es continua en todo $\mathbb{R}$ pasando por el origen $(0, 0)$, mientras que para $n < 0$ la función está indefinida en $x = 0$, presentando asíntota vertical $\mathcal{A}_V: x = 0$ y asíntota horizontal $\mathcal{A}_H: y = 0$](/static/img/nodos/distincion-entre-exponentes-positivos-y-negativos-en-funciones-potencia-ejemplos.svg)



    Compara analíticamente las funciones $f(x) = 2x^3$ y $g(x) = 2x^{-3} = \frac{2}{x^3}$:

    1) Dominio de ambas funciones.

    2) Comportamiento en $x = 0$.

    3) Límite cuando $x \to +\infty$.

    4) Existencia de asíntotas.'
  pasos:
  - 'Paso 1: Dominios:

    - $f(x)$: $\operatorname{Dom}(f) = \mathbb{R}$.

    - $g(x)$: $\operatorname{Dom}(g) = \mathbb{R} \setminus \{0\}$.'
  - 'Paso 2: Comportamiento en $x = 0$:

    - $f(0) = 2(0)^3 = \mathbf{0}$ (pasa por $(0, 0)$).

    - $g(0) = 2/0^3 \implies$ **No definido (asíntota vertical $x = 0$)**.'
  - 'Paso 3: Límite cuando $x \to +\infty$:

    - $\lim_{x \to +\infty} f(x) = \mathbf{+\infty}$ (crece sin cota).

    - $\lim_{x \to +\infty} g(x) = \lim_{x \to +\infty} \frac{2}{x^3} = \mathbf{0}$ (se pega al eje $X$).'
  - 'Paso 4: $f(x)$ no tiene asíntotas; $g(x)$ tiene asíntota vertical en $x = 0$ y horizontal en $y = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función $f(x) = 4x^{-5}$?
  choices:
  - text: ℝ \ {0} (todos los reales excepto el cero)
    is_correct: true
  - text: ℝ (todos los reales)
    is_correct: false
  - text: ']0, +∞['
    is_correct: false
  - text: '[-5, +∞['
    is_correct: false
  explanation: La alternativa correcta es 'ℝ \ {0} (todos los reales excepto el cero)'. Como $4x^{-5} = 4/x^5$, el denominador no puede ser cero.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué recta representa la asíntota horizontal de cualquier función potencia con exponente negativo $f(x) = a x^{-k}$?
  choices:
  - text: y = 0 (el eje X)
    is_correct: true
  - text: x = 0 (el eje Y)
    is_correct: false
  - text: y = a
    is_correct: false
  - text: No tiene asíntota horizontal
    is_correct: false
  explanation: La alternativa correcta es 'y = 0 (el eje X)'. Cuando $x \to \pm\infty$, la fracción $a/x^k$ tiende a 0.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el signo del exponente $n$.'
- 'Paso 2: Si $n > 0$, establecer $\operatorname{Dom} = \mathbb{R}$, paso por $(0, 0)$ y divergencia en el infinito sin asíntotas.'
- 'Paso 3: Si $n < 0$, establecer $\operatorname{Dom} = \mathbb{R} \setminus \{0\}$, asíntota vertical $x = 0$ y asíntota horizontal $y = 0$.'
- 'Paso 4: Trazar la gráfica respetando la continuidad o la estructura asintótica.'
errores_correccion: '- **Error común:** Evaluar en $x = 0$ una función con exponente negativo (ej: decir que $1/0^2 = 0$).

  - **Cómo corregirlo:** La división por cero **NO EXISTE**: en $n < 0$ el valor $x = 0$ **es una ASÍNTOTA VERTICAL**.'
ejemplos:
- titulo: 'Ejemplo 1: Evaluación en el origen'
  enunciado: ¿Cuánto vale $f(0)$ para $f(x) = 6x^5$?
  alternativas:
  - '0'
  - '6'
  - No existe
  - '30'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $f(0) = 6(0)^5 = 0$.'
- titulo: 'Ejemplo 2: Límite en infinito para exponente negativo'
  enunciado: 'Calcula $\lim_{x \to +\infty} 8x^{-2}$:'
  alternativas:
  - '0'
  - +infinito
  - '8'
  - 1/8
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $\frac{8}{x^2} \to 0$ cuando $x \to +\infty$.'
- titulo: 'Ejemplo 3: Dominio de exponente positivo'
  enunciado: ¿Cuál es el dominio de $g(x) = -3x^4$?
  alternativas:
  - R (todos los reales)
  - R \ {0}
  - '[0, +inf['
  - ']-inf, 0]'
  respuesta: R (todos los reales)
  solucion_pasos:
  - 'Paso 1: Las potencias positivas están definidas en todo $\mathbb{R}$.'
- titulo: 'Ejemplo 4: Asíntotas en exponente negativo'
  enunciado: ¿Cuáles son las asíntotas de $h(x) = \frac{1}{x^2}$?
  alternativas:
  - x = 0 e y = 0
  - Solo x = 0
  - Solo y = 0
  - x = 1 e y = 1
  respuesta: x = 0 e y = 0
  solucion_pasos:
  - 'Paso 1: Asíntota vertical en $x = 0$ y horizontal en $y = 0$.'
errores_frecuentes:
- Intentar evaluar funciones con exponente negativo en x = 0.
- Asumir que las potencias positivas tienen asíntotas horizontales.
- Confundir la exclusión del cero en el dominio con la exclusión del cero en el recorrido.
afirmaciones_verdaderas:
- Las funciones potencia con exponente positivo son continuas en todo ℝ y pasan por el origen (0, 0).
- Las funciones potencia con exponente negativo presentan discontinuidad asintótica en x = 0 y asíntota horizontal en y = 0.
al_terminar_debes_poder: '**QUÉ:** Distinguir el comportamiento funcional entre exponentes positivos y negativos.


  **CÓMO:** Contrastando la continuidad en ℝ y paso por (0, 0) de n > 0 frente a las asíntotas x = 0 e y = 0 de n < 0.


