semantic_id: MAT.GEO.TRIGONOMETRIA_BASICA.SENO_DEFINICION
resumen_inicial: 'Definición del seno de un ángulo agudo como razón cateto opuesto
  / hipotenusa: conceptos, teoremas, propiedades geométricas y cálculo en Perímetros,
  Áreas y Teoremas.'
explicacion_simple: En un triángulo rectángulo, cada ángulo agudo tiene asociadas
  tres razones fijas entre sus lados; la primera y más usada es el seno.
explicacion_formal: '![Definición del seno](/static/img/geometria/areas-pitagoras/trig-seno-definicion.svg)


  ### Definición formal


  Dado un ángulo agudo $\alpha$ en un triángulo rectángulo, $\text{sen}(\alpha)=\frac{\text{cateto
  opuesto a }\alpha}{\text{hipotenusa}}$.


  ### Desarrollo didáctico


  En un triángulo rectángulo con cateto opuesto a α de 3 cm e hipotenusa de 5 cm,
  $\text{sen}(\alpha)=\frac{3}{5}=0,6$. Este valor no depende del tamaño del triángulo,
  solo de la medida del ángulo α, ya que todos los triángulos semejantes con ese ángulo
  tienen la misma razón.'
definiciones_clave: '- **Definición del seno de un ángulo agudo como razón cateto
  opuesto / hipotenusa**: Elemento o propiedad fundamental en el estudio de perímetros,
  áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
