procedimiento:
- 'Paso 1: Verifica que los ángulos inscritos compartan el mismo arco subtendido (el
  arco que no contiene a ninguno de los vértices).'
- 'Paso 2: Aplica que ambos ángulos miden la mitad de ese mismo arco.'
- 'Paso 3: Concluye que ambos ángulos inscritos son iguales entre sí, sin importar
  la posición de sus vértices.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
