  el mismo arco.'
ejemplo_guiado:
  enunciado: Para analizar igualdad de ángulos inscritos que subtienden el mismo arco,
    considera un ángulo $\alpha = 168^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1051^\circ = 168^\circ$.
  pasos:
  - Identificar la propiedad de igualdad de ángulos inscritos que subtienden el mismo
    arco referida a $\alpha = 168^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1051 = 168 \implies x = 168 - 1051$.'
  - Concluir que la medida calculada para igualdad de ángulos inscritos que subtienden
    el mismo arco es $x = -883^\circ$.
