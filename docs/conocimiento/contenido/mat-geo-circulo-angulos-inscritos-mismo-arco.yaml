semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULOS_INSCRITOS_MISMO_ARCO
resumen_inicial: 'Igualdad de ángulos inscritos que subtienden el mismo arco: conceptos,
  teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Si varios observadores ubicados en distintos puntos de una circunferencia
  miran el mismo arco, todos ven ese arco bajo el mismo ángulo.
explicacion_formal: '![Ángulos inscritos que subtienden el mismo arco son iguales](/static/img/geometria/circunferencia-circulo/circulo-angulos-inscritos-mismo-arco.svg)


  ### Definición formal


  Si $\angle AC_1B$ y $\angle AC_2B$ son ángulos inscritos que subtienden el mismo
  arco $AB$ (con $C_1$ y $C_2$ puntos distintos de la circunferencia, ambos fuera
  del arco $AB$), entonces $m(\angle AC_1B)=m(\angle AC_2B)$.


  ### Desarrollo didáctico


  Esto se debe a que ambos ángulos inscritos miden la mitad del mismo arco $AB$: si
  el arco $AB$ mide 80°, entonces tanto $\angle AC_1B$ como $\angle AC_2B$ miden $\frac{80°}{2}=40°$,
  sin importar la posición exacta de $C_1$ o $C_2$ sobre el arco mayor.'
definiciones_clave: '- **Igualdad de ángulos inscritos que subtienden el mismo arco**:
  Elemento o propiedad fundamental en el estudio de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
