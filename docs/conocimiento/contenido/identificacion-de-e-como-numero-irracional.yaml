semantic_id: MAT.NUM.IRRACIONALES.EULER
resumen_inicial: El número de Euler e es una constante matemática irracional y trascendente, base de los logaritmos naturales y modelo fundamental de los procesos de crecimiento continuo.
explicacion_simple: '![Identificación de e como irracional](/static/img/nodos/identificacion-de-e-como-numero-irracional-intro.svg)


  El número de Euler ($e \approx 2,71828...$) es una de las constantes más importantes de toda la matemática. Surge naturalmente al estudiar fenómenos de crecimiento continuo (como el interés compuesto o el crecimiento de poblaciones). Es un número irracional trascendente que se ubica en la recta numérica estrictamente entre el $2$ y el $3$.'
explicacion_formal: 'La constante fundamental **Número de Euler** ($e$) se define rigurosamente mediante el límite del interés compuesto continuo o mediante su serie factorial:


  $$e = \lim_{n \to \infty} \left(1 + \frac{1}{n}\right)^n = \sum_{k=0}^{\infty} \frac{1}{k!} = 1 + \frac{1}{1!} + \frac{1}{2!} + \frac{1}{3!} + \cdots \approx 2,718281828459...$$


  **Propiedades analíticas y fundamentales de $e$:**

  - **Irracionalidad:** Demostrada por Leonhard Euler en 1737 mediante fracciones continuas simples. $e \in \mathbb{I}$.

  - **Trascendencia:** Demostrada por Charles Hermite en 1873. $e$ no es solución de ninguna ecuación polinómica con coeficientes enteros.

  - **Base del Logaritmo Natural:** $\ln(x) = \log_e(x)$, donde $\ln(e) = 1$ y $\ln(1) = 0$.

  - **Propiedad del Cálculo:** La función exponencial $f(x) = e^x$ es la única cuya derivada es idéntica a sí misma: $\frac{d}{dx}(e^x) = e^x$.


  > **Complemento didáctico:** Se encuentra acotado entre $2 < e < 3$. En la fórmula más célebre de las matemáticas (Identidad de Euler), une las 5 constantes capitales: $e^{i\pi} + 1 = 0$.'
definiciones_clave: '- **Constante $e$ (Euler)**: Límite $\lim_{n \to \infty} (1 + 1/n)^n \approx 2,71828...$.

  - **Logaritmo natural ($\ln$)**: Función logarítmica que utiliza el número $e$ como base ($\log_e$).

  - **Crecimiento exponencial continuo**: Modelo $M(t) = M_0 \cdot e^{rt}$ que describe procesos biológicos y financieros continuos.'
propiedades_relaciones: '- **Acotamiento entero**: $2 < e < 3$.

  - **Identidad de Euler**: $e^{i\pi} + 1 = 0$.

  - **Potencias enteras**: $e^n \in \mathbb{I}$ para todo entero $n \neq 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplos con el número de Euler](/static/img/nodos/identificacion-de-e-como-numero-irracional-ejemplos.svg)


    Evalúe la expresión $\ln(e)$ y determine si $e^2$ y $2 < e < 3$ corresponden a propiedades de los números irracionales.'
  pasos:
  - 'Paso 1: Evaluar $\ln(e)$: Por definición del logaritmo natural, $\log_e(e) = 1 \in \mathbb{Z} \subset \mathbb{Q}$.'
  - 'Paso 2: Analizar $e^2$: Al ser $e$ una constante trascendente, elevarla a un exponente entero no nulo conserva la irracionalidad: $e^2 \in \mathbb{I}$.'
  - 'Paso 3: Verificar el acotamiento: Como $e \approx 2,71828...$, cumple estrictamente la desigualdad $2 < 2,718... < 3$.'
  - 'Conclusión: $\ln(e) = 1$ (racional), $e^2$ es irracional y $e$ se ubica estrictamente entre 2 y 3.'
