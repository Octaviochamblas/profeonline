guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.01.05'
  title: 'Identificación de e como número irracional'
  description: 'Comprende el número de Euler (e) como la constante fundamental del crecimiento continuo y su naturaleza irracional.'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'identificacion-de-e-como-numero-irracional'
semantic_id: 'MAT.NUM.IRRACIONALES.EULER'
titulo: 'Identificación de e como número irracional'
objetivo: 'Interpretar el número de Euler $e$ como la base natural del crecimiento continuo y reconocer su carácter de número irracional y trascendente.'
introduccion: 'Cuando un proceso de crecimiento (como el interés compuesto o la reproducción de bacterias) se divide en intervalos cada vez más pequeños hasta hacerse continuo, los resultados no crecen hacia el infinito sin límite, sino que convergen hacia una constante fundamental de la naturaleza: el número de Euler $e \approx 2{,}718281828459\dots$. Al igual que $\pi$, $e$ es una constante exacta que posee infinitos decimales no periódicos y es un número irracional.'
resumen: 'El número $e$ (número de Euler) es la base de los logaritmos naturales ($\ln$) y la constante que gobierna el crecimiento y decrecimiento continuo ($e \approx 2{,}71828$). $e$ es un número irracional y trascendente, lo que significa que no puede escribirse como fracción $\frac{a}{b}$ de enteros ni como raíz de una ecuación polinómica con coeficientes enteros.'
requisitos:
  - 'Concepto de porcentaje y crecimiento exponencial.'
  - 'Definición general de números irracionales.'
objetivos:
  - 'Reconocer al número $e$ como la constante matemática asociada al crecimiento continuo.'
  - 'Diferenciar el valor simbólico exacto de $e$ respecto a sus aproximaciones decimales ($2{,}718$).'
que_aprenderas:
  - 'El origen del número $e$ a partir del límite de la sucesión $\left(1 + \frac{1}{n}\right)^n$ cuando $n \to \infty$.'
  - 'La naturaleza irracional de $e$ y su presencia en modelos exponenciales y logarítmicos.'
  - 'Cómo trabajar de forma exacta con expresiones que contienen $e$.'
al_terminar_debes_poder:
  - 'Identificar situaciones de crecimiento o decrecimiento continuo modeladas por $e$.'
  - 'Distinguir entre el valor exacto representado por $e$ y aproximaciones numéricas como $2{,}72$.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: '¿Qué tipo de número es el número de Euler $e$?'
    choices:
      - {text: 'Un número entero positivo igual a $3$.', is_correct: false}
      - {text: 'Un número racional equivalente a la fracción $\frac{2718}{1000}$.', is_correct: false}
      - {text: 'Un número irracional y trascendente con expansión decimal infinita no periódica.', is_correct: true}
      - {text: 'Un número racional periódico con período $1828$.', is_correct: false}
    explanation: 'La correcta es: Un número irracional y trascendente con expansión decimal infinita no periódica. Aunque en $2{,}718281828...$ parezca repetirse el bloque $1828$ al inicio, este patrón se rompe inmediatamente después y no es periódico.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: 'A medida que el número de períodos $n$ aumenta hacia el infinito en la expresión $\left(1 + \frac{1}{n}\right)^n$, ¿a qué valor se aproxima dicha expresión?'
    choices:
      - {text: 'Se aproxima exactamente a $2$.', is_correct: false}
      - {text: 'Crece indefinidamente hacia el infinito.', is_correct: false}
      - {text: 'Se aproxima al número irracional $e \approx 2{,}71828\dots$', is_correct: true}
      - {text: 'Se aproxima a $\pi$.', is_correct: false}
    explanation: 'La correcta es: Se aproxima al número irracional $e \approx 2{,}71828\dots$. Esta sucesión es la definición formal clásica del número de Euler descubierta por Jacob Bernoulli y Leonhard Euler.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Reconocer expresiones o modelos matemáticos que involucren crecimiento o decrecimiento continuo ($y = A \cdot e^{kt}$) o logaritmos naturales ($\ln x$).'
  - 'Paso 2: Mantener la letra $e$ como símbolo exacto durante todas las simplificaciones algebraicas.'
  - 'Paso 3: Si el problema solicita un resultado numérico final concreto, utilizar la aproximación $e \approx 2{,}718$ o la tecla $e^x$ de la calculadora.'
errores_frecuentes:
  - 'Confundir las primeras cifras de $e = 2{,}718281828\dots$ creyendo que $1828$ es un período infinito.'
  - 'Tratar a $e$ como una variable desconocida (como $x$ o $y$) en lugar de reconocerlo como una constante fija.'
errores_correccion: 'Es un error muy común mirar $e = 2{,}718281828459045\dots$ y pensar que 1828 es un período que se repite para siempre. No es un período: los dígitos inmediatamente siguientes son 459045..., lo que demuestra que la secuencia no mantiene ninguna periodicidad y confirma que $e$ es irracional.'
ejemplos:
  - titulo: 'Evaluación exacta de funciones exponenciales'
    enunciado: 'Una población de bacterias crece según la función $P(t) = 500 \cdot e^{0{,}1 t}$, donde $t$ es el tiempo en horas. ¿Cuál es la cantidad EXACTA de bacterias al cabo de $10$ horas?'
    alternativas:
      - '$500 \cdot e \text{ bacterias}$'
      - '$1359 \text{ bacterias}$'
      - '$5000 \text{ bacterias}$'
      - '$500 \cdot 2{,}71 \text{ bacterias}$'
    respuesta: '$500 \cdot e \text{ bacterias}$'
    solucion_pasos:
      - 'Sustituimos $t = 10$ en la función de población: $P(10) = 500 \cdot e^{0{,}1 \cdot 10} = 500 \cdot e^1 = 500e$.'
      - 'El valor exacto es $500e$ bacterias (expresado simbólicamente con la constante irracional $e$).'
      - '$1359$ es una aproximación ($500 \cdot 2{,}71828 \approx 1359{,}14$), pero no el valor exacto.'
  - titulo: 'Operaciones con la constante e'
    enunciado: '¿Cuál de los siguientes números es un número RACIONAL?'
    alternativas:
      - '$e + 2$'
      - '$\ln(e)$ (Logaritmo natural de $e$)'
      - '$e^2$'
      - '$\frac{e}{2}$'
    respuesta: '$\ln(e)$ (Logaritmo natural de $e$)'
    solucion_pasos:
      - '$e + 2$, $e^2$ y $\frac{e}{2}$ resultan en valores irracionales al operar el número irracional $e$.'
      - 'Por definición de logaritmo natural, $\ln(e) = \log_e(e) = 1$.'
      - 'Como $1 \in \mathbb{Z} \subset \mathbb{Q}$, $\ln(e)$ es un número racional.'
comprobacion_rapida:
  - afirmacion: 'El número $e$ es una constante matemática cuyo valor aproximado es $2{,}71828$.'
    respuesta: true
    explicacion: 'Correcto. $e \approx 2{,}71828$ es la base de los logaritmos naturales.'
  - afirmacion: 'El logaritmo natural de $e$ ($\ln e$) es un número irracional.'
    respuesta: false
    explicacion: 'Falso. $\ln(e) = 1$, el cual es un entero y por ende un número racional.'
  - afirmacion: 'Al igual que $\pi$, el número $e$ no se puede expresar exactamente como una fracción de enteros.'
    respuesta: true
    explicacion: 'Correcto. Tanto $e$ como $\pi$ son números irracionales y trascendentes.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales e irracionales.'
estado: 'publicado'
