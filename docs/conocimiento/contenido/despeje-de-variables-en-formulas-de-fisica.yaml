semantic_id: MAT.ALG.ECUACIONES_LITERALES.DESPEJE_FORMULA_FISICA
resumen_inicial: Despejar variables en física relaciona magnitudes como velocidad,
  tiempo, aceleración o masa aislando la incógnita requerida.
explicacion_simple: 'En física se utilizan ecuaciones literales para describir leyes
  naturales, como la fórmula del movimiento $v = \frac{d}{t}$ o la ley de Newton $F
  = m \cdot a$.

  Cuando necesitamos calcular una magnitud específica (como el tiempo $t$ o la masa
  $m$), aplicamos el despeje algebraico para aislar esa letra en un lado de la ecuación.'
explicacion_formal: 'Dada la ecuación del movimiento rectilíneo uniforme $d = v \cdot
  t$, el **despeje del tiempo** $t$ y de la velocidad $v$ se expresa como:


  $$t = \frac{d}{v} \quad (v \neq 0) \quad \text{y} \quad v = \frac{d}{t} \quad (t
  \neq 0)$$


  **Desglose de la fórmula:**

  - $d$: Distancia recorrida.

  - $v$: Velocidad constante no nula.

  - $t$: Tiempo transcurrido no nulo.'
definiciones_clave: '- **Despeje en física**: Aislamiento algebraico de una magnitud
  física en una fórmula de la ciencia.

  - **Fórmula física**: Ecuación literal que modela fenómenos físicos mediante variables
  dimensionales.'
propiedades_relaciones: '- **Valores no nulos de divisores**: Las magnitudes físicas
  en el denominador (como tiempo $t$ o velocidad $v$) exigen la condición de no nulidad
  ($t \neq 0, v \neq 0$).'
ejemplo_guiado:
  enunciado: Dada la fórmula del movimiento uniformemente acelerado $v_f = v_i + a
    \cdot t$, despeja la aceleración $a$ en función de la velocidad inicial $v_i$,
    velocidad final $v_f$ y tiempo $t$.
  pasos:
  - 'Paso 1: Escribir la fórmula original: $v_f = v_i + a \cdot t$.Paso 2: Trasponer
    la velocidad inicial $v_i$ restando al primer miembro: $v_f - v_i = a \cdot t$.Paso
    3: Trasponer el tiempo $t$ dividiendo al primer miembro: $a = \frac{v_f - v_i}{t}$.Paso
    4: Concluir la fórmula despejada para la aceleración: $a = \frac{v_f - v_i}{t}$
    para $t \neq 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar el tiempo $t$ en la fórmula de distancia $d = v \cdot t$,
    ¿cuál es la expresión obtenida para $v \neq 0$?
  choices:
  - text: $t = \frac{d}{v}$
    is_correct: true
  - text: $t = d \cdot v$
    is_correct: false
  - text: $t = \frac{v}{d}$
    is_correct: false
  - text: $t = d - v$
    is_correct: false
  explanation: La alternativa correcta es '$t = \frac{d}{v}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al despejar la aceleración $a$ en $v_f = v_i + a \cdot t$, ¿cuál es la
    fórmula resultante?
  choices:
  - text: $a = \frac{v_f - v_i}{t}$
    is_correct: true
  - text: $a = \frac{v_f + v_i}{t}$
    is_correct: false
  - text: $a = (v_f - v_i) \cdot t$
    is_correct: false
  - text: $a = \frac{t}{v_f - v_i}$
    is_correct: false
  explanation: La alternativa correcta es '$a = \frac{v_f - v_i}{t}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la variable física que se requiere despejar.'
- 'Paso 2: Trasponer los términos sumandos o restando al otro miembro.'
- 'Paso 3: Pasar dividiendo la variable multiplicativa acompañante.'
- 'Paso 4: Declarar las restricciones físicas de no nulidad en el denominador.'
errores_correccion: '- **Error común:** Tratar las variables con subíndices (como
  $v_f$ y $v_i$) como si fueran la misma letra.

  - **Cómo corregirlo:** Las variables con distintos subíndices (como $v_f$ y $v_i$)
  representan cantidades DISTINTAS. No las sumes ni las canceles como semejantes.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de despeje.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de despeje.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se pueden usar las reglas comunes de transposición en ecuaciones literales?
  respuesta: Sí
  solucion_pasos:
  - Sí, los parámetros se comportan exactamente igual que los números.
- titulo: ¿Dividir entre un parámetro exige la condición de ser distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la indefinición por cero.
errores_frecuentes:
- Confundir la incógnita a despejar con las letras que actúan como parámetros.
- Olvidar factorizar la incógnita cuando aparece en más de un término.
- Sumar o trasponer parámetros cambiando su operación equivocadamente.
- Dividir entre un parámetro sin aclarar la restricción de ser no nulo.
- Tratar las variables físicas con subíndices como si fueran términos idénticos.
afirmaciones_verdaderas:
- Una ecuación literal expresa la incógnita en función de constantes simbólicas o
  parámetros.
- Si la incógnita figura en múltiples términos, debe agruparse y factorizarse para
  realizar su despeje.
al_terminar_debes_poder: Al finalizar este recurso podrás despejar cualquier variable
  en ecuaciones literales y fórmulas científicas indicando sus restricciones.
