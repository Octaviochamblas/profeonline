procedimiento:
- Identifica la variable objetivo.
- Despeja sumandos enteros primero (transponiéndolos al lado opuesto).
- Despeja fcantidades involucradas multiplicativos o divisores al final.
- Revisa que las unidades tengan sentido.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en despeje de variables en fórmulas de física.
ejemplos:
- titulo: $t$ y $V_f - V_i = a \cdot t$
  enunciado: Justifica el procedimiento adecuado para el caso $t$ y $V_f - V_i = a
    \cdot t$.
  solucion_pasos:
  - 'Si necesitas calcular el tiempo ($t$) necesario para alcanzar una velocidad:

    1. El término $V_i$ está sumando a nuestro bloque objetivo. Lo mandamos restando:
    $V_f - V_i = a \cdot t$.

    2. La aceleración ($a$) está multiplicando al tiempo. La mandamos a dividir todo
    el bloque izquierdo: $t = \frac{V_f - V_i}{a}$.'
  - Identifica la variable objetivo.
- titulo: $V_i$
  enunciado: Determina qué debe hacerse en $V_i$ y fundamenta cada transformación.
  solucion_pasos:
  - La clave en fórmulas físicas es reconocer los 'bloques' enteros de términos. No
    puedes arrancar la 'a' si antes no te deshiciste del término independiente $V_i$.
  - Despeja sumandos enteros primero (transponiéndolos al lado opuesto).
- titulo: 'Respecto de «Despeje de variables en fórmulas de física»: ¿La siguiente
    formulación es corre'
  enunciado: 'Respecto de «Despeje de variables en fórmulas de física»: ¿La siguiente
    formulación es correcta? «En física, despejar bien es indispensable»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En física, despejar bien es
    indispensable.'
- titulo: 'Respecto de «Despeje de variables en fórmulas de física»: ¿La siguiente
    conclusión es correc'
  enunciado: 'Respecto de «Despeje de variables en fórmulas de física»: ¿La siguiente
    conclusión es correcta? «Puede omitirse esta condición sin cambiar el resultado:
    «Identifica la variable objetivo»»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En física, despejar bien es
    indispensable.'
errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Identifica la variable
  objetivo».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Despeja sumandos
  enteros primero (transponiéndolos al lado opuesto)».'
- 'La definición sigue cumpliéndose aunque no se considere que en física, despejar
  bien es indispensable. Imagina la fórmula de movimiento rectilíneo: $V_f = V_i +
  a \cdot t$.'
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Revisa
  que las unidades tengan sentido».
- La comprobación del resultado vuelve innecesaria la condición «Identifica la variable
  objetivo».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
