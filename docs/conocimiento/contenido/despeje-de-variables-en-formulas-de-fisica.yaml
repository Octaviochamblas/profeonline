semantic_id: MAT.ALG.ECUACIONES_LITERALES.DESPEJE_FORMULA_FISICA
resumen_inicial: Despejar variables en física relaciona magnitudes como velocidad, tiempo, aceleración o masa aislando algebraicamente la incógnita requerida.
explicacion_simple: |
  En física se utilizan ecuaciones literales para expresar leyes naturales, como la relación del movimiento $v = \frac{d}{t}$ o la ley de movimiento de Newton $F = m \cdot a$.

  Cuando necesitamos calcular una magnitud específica (como el tiempo $t$ o la masa $m$), aplicamos el despeje algebraico aislando esa variable en uno de los miembros de la igualdad.

  Es fundamental recordar que variables con subíndices (como $v_i$ y $v_f$) representan magnitudes distintas que no deben confundirse ni sumarse como términos semejantes.
explicacion_formal: |
  ### Definición formal
  Dada la ecuación del movimiento uniformemente acelerado $v_f = v_i + a \cdot t$, el **despeje de la aceleración** $a$ y del **tiempo** $t$ se realiza según:

  $$v_f - v_i = a \cdot t \implies a = \frac{v_f - v_i}{t} \quad (t \neq 0) \quad \text{y} \quad t = \frac{v_f - v_i}{a} \quad (a \neq 0)$$

  ### Desglose de la fórmula
  - $v_i, v_f$: Velocidades inicial y final en el sistema físico.
  - $a$: Aceleración constante aislada en el primer miembro.
  - $t$: Tiempo transcurrido no nulo ($t \neq 0$).

  ### Síntesis didáctica
  Toda magnitud física ubicada en un divisor debe acompañarse de su restricción de no-nulidad ($t \neq 0$).
definiciones_clave: |
  - **Despeje en física**: Aislamiento algebraico equivalente de una variable dimensional en una ecuación científica.
  - **Variable con subíndice**: Notación literal utilizada para diferenciar estados de una misma magnitud (ej. velocidad inicial $v_i$ vs velocidad final $v_f$).
propiedades_relaciones: |
  - **Incompatibilidad de subíndices**: La expresión $v_f - v_i$ no puede simplificarse a cero ni a $v$, pues corresponden a estados físicos independientes.
  - **Restricción de tiempo positivo**: En cinemática, el tiempo $t$ satisface $t > 0$.
ejemplo_guiado:
  enunciado: 'Dada la fórmula $v_f = v_i + a \cdot t$, despeja la aceleración $a$ en función de la velocidad inicial $v_i$, velocidad final $v_f$ y el tiempo $t$.'
  pasos:
    - 'Paso 1: Identificar la variable objetivo a despejar: la aceleración $a$.'
    - 'Paso 2: Trasponer la velocidad inicial $v_i$ restando al miembro opuesto: $v_f - v_i = a \cdot t$.'
    - 'Paso 3: Trasponer el tiempo $t$ dividiendo al miembro opuesto declarando $t \neq 0$: $a = \frac{v_f - v_i}{t}$.'
    - 'Paso 4: Presentar la relación despejada para la aceleración: $a = \frac{v_f - v_i}{t}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al despejar el tiempo $t$ en la fórmula de distancia $d = v \cdot t$, ¿cuál es la expresión obtenida para $v \neq 0$?'
    choices:
      - {text: '$t = \frac{d}{v}$', is_correct: true}
      - {text: '$t = d \cdot v$', is_correct: false}
      - {text: '$t = \frac{v}{d}$', is_correct: false}
      - {text: '$t = d - v$', is_correct: false}
    explanation: 'La alternativa correcta es ''$t = \frac{d}{v}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al despejar la aceleración $a$ en $v_f = v_i + a \cdot t$, ¿cuál es la fórmula resultante?'
    choices:
      - {text: '$a = \frac{v_f - v_i}{t}$', is_correct: true}
      - {text: '$a = \frac{v_f + v_i}{t}$', is_correct: false}
      - {text: '$a = (v_f - v_i) \cdot t$', is_correct: false}
      - {text: '$a = \frac{t}{v_f - v_i}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = \frac{v_f - v_i}{t}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Determinar con precisión cuál magnitud física con su subíndice es la variable a aislar.'
  - 'Paso 2: Trasponer los términos aditivos independientes de la variable objetivo.'
  - 'Paso 3: Pasar dividiendo los factores multiplicativos que acompañan a la variable aislada.'
  - 'Paso 4: Declarar las restricciones de no-nulidad para las magnitudes divisoras.'
errores_correccion: |
  - **Error 1:** Tratar variables con subíndices (como $v_f$ y $v_i$) como si fueran términos semejantes cancelables ($v_f - v_i = 0$). **Cómo corregirlo:** Las variables con distintos subíndices **REPRESENTAN MAGNITUDES FÍSICAS DISTINTAS Y NO PUEDEN CANCELARSE NI SUMARSE ($v_f \neq v_i$)**.
  - **Error 2:** Trasponer dividiendo el tiempo $t$ dividiendo solo a $v_f$ sin restar $v_i$ (escribir $a = \frac{v_f}{t} - v_i$). **Cómo corregirlo:** La velocidad inicial $v_i$ **DEBE TRASPONERSE RESTANDO PRIMERO A TODO EL MIEMBRO ANTES DE PASAR A DIVIDIR EL TIEMPO $t$ ($a = \frac{v_f - v_i}{t}$)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'En la ley de Ohm $V = I \cdot R$, despeja la corriente $I$.'
    alternativas:
      - '$I = \frac{V}{R}$'
      - '$I = V \cdot R$'
      - '$I = V - R$'
    respuesta: '$I = \frac{V}{R}$'
    solucion_pasos:
      - '1. Trasponer $R \neq 0$ dividiendo.'
      - '2. $I = \frac{V}{R}$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'En la fórmula de la densidad $d = \frac{m}{V}$, despeja el volumen $V$.'
    alternativas:
      - '$V = \frac{m}{d}$'
      - '$V = m \cdot d$'
      - '$V = \frac{d}{m}$'
    respuesta: '$V = \frac{m}{d}$'
    solucion_pasos:
      - '1. Multiplicar por $V$: $d \cdot V = m$.'
      - '2. Dividir por $d \neq 0$: $V = \frac{m}{d}$.'
  - titulo: 'Subíndices independientes'
    enunciado: '¿La velocidad inicial $v_i$ y la velocidad final $v_f$ representan magnitudes numéricas distintas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues representan estados de velocidad en instantes de tiempo diferentes.'
  - titulo: 'Tiempo no nulo'
    enunciado: '¿El tiempo $t$ en un denominador de cinemática requiere ser distinto de cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues la división por cero no existe.'
errores_frecuentes:
  - 'En la fórmula cinemática $v_f = v_i + a \cdot t$, el término $v_f - v_i$ se simplifica a cero al considerar erróneamente ambas velocidades como iguales.'
  - 'Al despejar el tiempo $t$ en la ecuación $v_f = v_i + a \cdot t$, la aceleración $a$ se pasa dividiendo solo a la velocidad inicial $v_i$ produciendo $t = v_f - \frac{v_i}{a}$.'
  - 'En las fórmulas físicas, los símbolos en minúscula como $m$ (masa) y en mayúscula como $M$ (masa molar) representan exactamente la misma cantidad y son cancelables.'
  - 'Al despejar el tiempo $t$ en $d = v \cdot t$, la división entre la velocidad $v$ no exige la declaración de ser no nula $v \neq 0$.'
  - 'Al despejar la corriente $I$ en la ley de Ohm $V = I \cdot R$, la resistencia $R$ se traspone restando produciendo $I = V - R$.'
afirmaciones_verdaderas:
  - 'Variables con subíndices diferentes representan magnitudes físicas distintas y no pueden agruparse como semejantes.'
  - 'El despeje de una magnitud en una fórmula científica requiere respetar la prioridad de las operaciones inversas.'
al_terminar_debes_poder: |
  QUÉ: Despejar variables en fórmulas de la física y ciencias naturales.
  CÓMO: Identificar la magnitud a aislar respetando subíndices, trasponer sumandos, pasar divisores conservando la prioridad de operaciones y fijar restricciones de no-nulidad.
