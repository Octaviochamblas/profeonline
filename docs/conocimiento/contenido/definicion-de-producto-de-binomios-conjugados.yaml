procedimiento:
- 'Paso 1: Para verificar si dos factores forman una suma por diferencia (son conjugados):'
- 'Paso 2: Revisa que ambos binomios tengan los mismos valores absolutos (las mismas
  letras y números).'
- 'Paso 3: Asegúrate de que un término tenga el mismo signo en ambos paréntesis.'
- 'Paso 4: Asegúrate de que el otro término tenga signos contrarios (uno positivo
  y uno negativo).'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en definición de producto de binomios conjugados.
ejemplos:
- titulo: Identificando conjugados
  enunciado: ¿Son $(3x + 2y)$ y $(3x - 2y)$ conjugados?
  solucion_pasos:
  - Ambos tienen los términos $3x$ y $2y$.
  - El término $3x$ es positivo en ambos.
  - El término $2y$ es positivo en el primero y negativo en el segundo.
  - Sí son conjugados.
- titulo: Sean $u$ y $v$ dos binomios conjugados tales que $u = (2x + 3)$. Si $u \cdot
    v = 4x^2 - 9$
  enunciado: 'Sean $u$ y $v$ dos binomios conjugados tales que $u = (2x + 3)$. Si
    $u \cdot v = 4x^2 - 9$, entonces la expresión $u + v$ es igual a:


    Opciones: A) $4x$ · B) $6$ · C) $4x + 6$ · D) $0$'
  solucion_pasos:
  - $u = 2x+3$, luego $v = 2x-3$. Su suma es $(2x+3) + (2x-3) = 4x$.
  - 'Respuesta: $4x$'
- titulo: 'Respecto de «Definición de producto de binomios conjugados»: ¿Se ajusta
    a la definición esta'
  enunciado: 'Respecto de «Definición de producto de binomios conjugados»: ¿Se ajusta
    a la definición esta afirmación? «Dos binomios son conjugados cuando contienen
    exactamente los mismos términos, pero difieren únicamente en el signo que los
    separa en medio»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Dos binomios son conjugados
    cuando contienen exactamente los mismos términos, pero difieren únicamente en
    el signo que los separa en medio.'
- titulo: 'Respecto de «Definición de producto de binomios conjugados»: ¿Es compatible
    con el procedimi'
  enunciado: 'Respecto de «Definición de producto de binomios conjugados»: ¿Es compatible
    con el procedimiento esta afirmación? «Creer que $(a-b)$ y $(b-a)$ son conjugados.
    ¡No lo son! Son inversos aditivos. Los conjugados deben mantener un término idéntico»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Dos binomios son conjugados
    cuando contienen exactamente los mismos términos, pero difieren únicamente en
    el signo que los separa en medio.'
errores_frecuentes:
- Creer que $(a-b)$ y $(b-a)$ son conjugados. ¡No lo son! Son inversos aditivos. Los
  conjugados deben mantener un término idéntico.
- $(x + 5)$ y $(5 - x)$.
- $(x - 5)$ y $(x - 5)$.
- Porque el término independiente se vuelve cero.
- Para «Si multiplicas dos binomios conjugados usando distribución paso a paso, ¿por
  qué el resultado es un binomio y no un trinomio», la respuesta correcta es Porque
  los cuadrados se cancelan.
