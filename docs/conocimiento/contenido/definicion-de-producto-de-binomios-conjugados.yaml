resumen_inicial: 'El producto de binomios conjugados $(a + b)(a - b)$ es un producto
  notable equivalente a la diferencia de los cuadrados de sus términos: $a^2 - b^2$.'
explicacion_simple: 'Cuando multiplicas dos binomios que tienen los mismos términos
  pero uno suma y el otro resta, como $(a + b)(a - b)$, los dos términos del medio
  ($ab$ y $-ab$) se cancelan exactamente. Por eso el resultado final es simplemente
  el cuadrado del primero menos el cuadrado del segundo: $a^2 - b^2$.'
explicacion_formal: 'Para cualesquiera $a, b \in \mathbb{R}$, el **Producto de Binomios
  Conjugados** $(a + b)(a - b)$ se define como la expansión binómica cancelativa:


  $$(a + b)(a - b) = a^2 - ab + ba - b^2 = a^2 - b^2$$


  **Desglose simbólico:**

  - $a^2$: Cuadrado del término común (aquel que conserva el mismo signo en ambos
  binomios).

  - $-ab + ba = 0$: Cancelación por simetría aditiva de los términos cruzados rectangulares.

  - $-b^2$: Resta del cuadrado del término simétrico (aquel que cambia de signo entre
  binomios).


  > **Complemento didáctico:** La identidad demuestra que la multiplicación de binomios
  opuestos anula la presencia del término lineal o intermedio.'
definiciones_clave: '- **Binomios conjugados**: Par de binomios $(a+b)$ y $(a-b)$
  que difieren únicamente en el signo del segundo término.

  - **Diferencia de cuadrados**: Expresión $a^2 - b^2$ resultante de multiplicar binomios
  conjugados.'
propiedades_relaciones: '- **Factorización directa**: La diferencia de cuadrados $a^2
  - b^2$ se factoriza siempre como $(a + b)(a - b)$.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(x + 4)(x - 4)$ aplicando la definición de producto
    de binomios conjugados.
  pasos:
  - 'Paso 1: Identificar el término común $a = x$ y el término simétrico $b = 4$.'
  - 'Paso 2: Calcular el cuadrado del término común: $a^2 = x^2$.'
  - 'Paso 3: Calcular el cuadrado del término simétrico: $b^2 = 4^2 = 16$.'
  - 'Paso 4: Restar ambos cuadrados: $x^2 - 16$.'
  - 'Conclusión: El producto de $(x + 4)(x - 4)$ es $x^2 - 16$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de desarrollar el producto $(a + b)(a - b)$?
  choices:
  - text: $a^2 - b^2$
    is_correct: true
  - text: $a^2 + b^2$
    is_correct: false
  - text: $a^2 - 2ab + b^2$
    is_correct: false
  - text: $a^2 + 2ab - b^2$
    is_correct: false
  explanation: La alternativa correcta es '$a^2 - b^2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de $(x + 4)(x - 4)$, ¿qué ocurrió con los términos cruzados
    $+4x$ y $-4x$?
  choices:
  - text: Se cancelaron mutuamente sumando cero ($+4x - 4x = 0$)
    is_correct: true
  - text: Se sumaron dando $+8x$
    is_correct: false
  - text: Se multiplicaron dando $-16x^2$
    is_correct: false
  - text: Se restaron dando $-8x$
    is_correct: false
  explanation: La alternativa correcta es 'Se cancelaron mutuamente sumando cero ($+4x
    - 4x = 0$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar al cuadrado el término de igual signo $a \to a^2$.'
- 'Paso 2: Elevar al cuadrado el término de signos opuestos $b \to b^2$.'
- 'Paso 3: Escribir la resta entre ambos cuadrados: $a^2 - b^2$.'
errores_correccion: '- **Error 1: Incluir un término central $2ab$ en el producto
  de suma por diferencia.** **Cómo corregirlo:** Recordar que al multiplicar un binomio
  suma por un binomio diferencia los términos cruzados se anulan ($ab - ab = 0$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle el producto $(y + 7)(y - 7)$.
  alternativas:
  - $y^2 - 49$
  - $y^2 + 49$
  - $y^2 - 14y - 49$
  respuesta: $y^2 - 49$
  solucion_pasos:
  - '1. Término común al cuadrado: $y^2$.'
  - '2. Término simétrico al cuadrado: $7^2 = 49$.'
  - '3. Diferencia: $y^2 - 49$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el producto de $(3x + 2)(3x - 2)$?
  alternativas:
  - $9x^2 - 4$
  - $9x^2 + 4$
  - $9x^2 - 12x - 4$
  respuesta: $9x^2 - 4$
  solucion_pasos:
  - 1. $(3x)^2 = 9x^2$.
  - 2. $2^2 = 4$.
  - '3. Resultado: $9x^2 - 4$.'
- titulo: ¿Es la expresión $m^2 - 25$ el resultado de $(m + 5)(m - 5)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(m + 5)(m - 5) = m^2 - 5^2 = m^2 - 25$.
- titulo: ¿El producto de binomios conjugados genera un trinomio de tres términos?
  respuesta: 'No'
  solucion_pasos:
  - No, genera un binomio de dos términos (diferencia de cuadrados).
errores_frecuentes:
- El producto $(a + b)(a - b)$ equivale a la suma de cuadrados $a^2 + b^2$.
- Agregar un término central $+2ab$ al resultado del producto de suma por diferencia.
- Declarar que $(x + 3)(x - 3)$ es idéntico a $x^2 + 9$.
- Asignar signo negativo al primer término obteniendo $-a^2 - b^2$.
- Declarar que la cancelación de términos cruzados solo ocurre con números enteros.
afirmaciones_verdaderas:
- El producto de dos binomios conjugados resulta siempre en una diferencia de cuadrados
  $a^2 - b^2$.
- Los términos cruzados de la multiplicación distributiva se anulan por tener el mismo
  valor y signos opuestos.
al_terminar_debes_poder: Al terminar serás capaz de desarrollar el producto de binomios
  conjugados $(a + b)(a - b)$ obteniendo directamente la diferencia de cuadrados $a^2
  - b^2$.
