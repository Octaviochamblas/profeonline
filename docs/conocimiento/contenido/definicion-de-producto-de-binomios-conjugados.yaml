semantic_id: MAT.ALG.SUMA_DIFERENCIA.DEFINICION_CONJUGADOS
resumen_inicial: 'Definición de producto de binomios conjugados: fórmula, regla de
  expansión y aplicaciones en Producto de suma por diferencia.'
explicacion_simple: ¿Qué tienen de especial dos binomios que son casi iguales pero
  difieren solo en un signo? A esta pareja le llamamos 'conjugados'.
explicacion_formal: "### Definición formal\n\nPara ser conjugados, deben tener los\
  \ mismos términos y diferir solo en el signo central.\n\n### Desarrollo didáctico\n\
  \nLa \"suma por su diferencia\" ocurre cuando multiplicamos dos binomios que son\
  \ exactamente iguales en sus términos, pero uno es una suma y el otro es una resta.\
  \ \n\nMatemáticamente se escribe como: $(a+b)(a-b)$. En álgebra, a la expresión\
  \ $(a-b)$ se le llama el **conjugado** de $(a+b)$, y viceversa.\n\n**¿De dónde sale\
  \ su nombre y regla?**\nSi multiplicamos ambos binomios aplicando la propiedad distributiva:\n\
  $(a+b)(a-b) = a(a) + a(-b) + b(a) + b(-b)$\n$= a^2 - ab + ab - b^2$\n\nNota lo que\
  \ sucede en el medio: los términos cruzados $-ab$ y $+ab$ son idénticos pero con\
  \ signos opuestos, por lo que **se cancelan mutuamente** (dan cero). Lo único que\
  \ sobrevive de toda la expansión son los cuadrados de los extremos.\n\n**Fórmula:**\
  \ $(a+b)(a-b) = a^2 - b^2$"
definiciones_clave: '- **Definición de producto de binomios conjugados**: Producto
