semantic_id: MAT.GEO.TRIG_FUNDAMENTAL.TANGENTE_DEFINICION
resumen_inicial: 'Definición de tangente de un ángulo agudo como cateto opuesto sobre
  cateto adyacente: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  en el Triángulo Rectángulo.'
explicacion_simple: A diferencia del seno y el coseno, la tangente compara los dos
  catetos entre sí, sin involucrar la hipotenusa.
explicacion_formal: '![Definición de tangente](/static/img/geometria/trigonometria/trig-tangente-definicion.svg)


  ### Definición formal


  En un triángulo rectángulo con ángulo agudo $\theta$, la tangente se define como
  $\tan\theta=\dfrac{\text{cateto opuesto}}{\text{cateto adyacente}}$. A diferencia
  del seno y el coseno, la tangente no involucra la hipotenusa.


  ### Desarrollo didáctico


  En la figura, el ángulo $\theta$ está en el vértice $B$. El cateto opuesto es $AC$
  y el cateto adyacente es $AB$. Por lo tanto, $\tan\theta=\dfrac{AC}{AB}$.'
definiciones_clave: '- **Definición de tangente de un ángulo agudo como cateto opuesto
  sobre cateto adyacente**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
