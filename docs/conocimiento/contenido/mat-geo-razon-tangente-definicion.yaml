procedimiento:
- 'Paso 1: Identifica el ángulo agudo θ y ubica el vértice donde se encuentra.'
- 'Paso 2: Identifica el cateto opuesto y el cateto adyacente a θ (sin involucrar
  la hipotenusa).'
- 'Paso 3: Calcula tanθ como el cociente entre la longitud del cateto opuesto y la
  del cateto adyacente.'
