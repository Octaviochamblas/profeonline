semantic_id: MAT.NUM.PROPORCIONES.COMPOSICION_PROPORCIONAL
resumen_inicial: La composición en proporciones establece que si $\frac{a}{b} = \frac{c}{d}$,
  entonces $\frac{a+b}{b} = \frac{c+d}{d}$ o $\frac{a+b}{a} = \frac{c+d}{c}$.
explicacion_simple: 'Si le sumas a cada numerador su respectivo denominador en una proporción,
  la nueva igualdad se sigue manteniendo:

  $$\frac{a}{b} = \frac{c}{d} \implies \frac{a+b}{b} = \frac{c+d}{d}$$

  Ejemplo: De $\frac{1}{2} = \frac{3}{6}$, sumando denominadores arriba obtenemos $\frac{1+2}{2}
  = \frac{3+6}{6} \implies \frac{3}{2} = \frac{9}{6} = 1{,}5$.'
explicacion_formal: Dada la proporción $\frac{a}{b} = \frac{c}{d}$, sumando 1 a ambos lados
  se obtiene $\frac{a}{b} + 1 = \frac{c}{d} + 1 \implies \frac{a+b}{b} = \frac{c+d}{d}$, propiedad
  denominada composición proporcional.
definiciones_clave: '- **Composición de proporciones**: Transformación por adición de antecedentes
  y consecuentes $\frac{a+b}{b} = \frac{c+d}{d}$.'
propiedades_relaciones: '- **Preservación de igualdad**: Mantiene el valor proporcional ajustado
  a $k+1$.'
ejemplo_guiado:
  enunciado: Aplica la propiedad de composición a la proporción $\frac{2}{5} = \frac{6}{15}$.
  pasos:
  - 'Sumar el denominador al numerador en ambos lados: $\frac{2+5}{5} = \frac{6+15}{15}$.'
  - 'Efectuar las sumas: $\frac{7}{5} = \frac{21}{15}$.'
  - 'Verificar la igualdad por producto cruzado: $7 \cdot 15 = 105$ y $5 \cdot 21 = 105$.'
  - Concluir que la composición $\frac{7}{5} = \frac{21}{15}$ es válida.
checkpoints:
- placement: after_explicacion_formal
  question: Si $\frac{a}{b} = \frac{c}{d}$, ¿cuál es la expresión equivalente por composición
    proporcional?
  choices:
  - text: (a + b) / b = (c + d) / d
    is_correct: true
  - text: (a - b) / b = (c + d) / d
    is_correct: false
  - text: a + c = b + d
    is_correct: false
  - text: a · b = c · d
    is_correct: false
  explanation: 'La correcta es: (a + b) / b = (c + d) / d. Propiedad de composición proporcional.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Dada $\frac{3}{4} = \frac{9}{12}$, aplica composición sumando el denominador al
    numerador.
  choices:
  - text: 7/4 = 21/12
    is_correct: true
  - text: 3/7 = 9/21
    is_correct: false
  - text: -1/4 = -3/12
    is_correct: false
  - text: 12/4 = 21/12
    is_correct: false
  explanation: 'La correcta es: 7/4 = 21/12. $(3+4)/4 = 7/4$ y $(9+12)/12 = 21/12$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la proporción $\frac{a}{b} = \frac{c}{d}$.'
- 'Paso 2: Sumar a cada numerador su propio denominador.'
- 'Paso 3: Escribir la nueva proporción equivalente $\frac{a+b}{b} = \frac{c+d}{d}$.'
errores_correccion: No sumes los numeradores entre sí. Debes sumar el denominador propio a
  su correspondiente numerador.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\frac{1}{3} = \frac{4}{12}$, halla la composición.
  alternativas:
  - 4/3 = 16/12
  - 1/4 = 4/16
  respuesta: 4/3 = 16/12
  solucion_pasos:
  - $\frac{1+3}{3} = \frac{4+12}{12} \implies \frac{4}{3} = \frac{16}{12}$.
- titulo: Ejemplo 2
  enunciado: Si 5/8 = 10/16, ¿cuál es la composición?
  alternativas:
  - 13/8 = 26/16
  - 5/13 = 10/26
  - 3/8 = 6/16
  respuesta: 13/8 = 26/16
  solucion_pasos:
  - (5 más 8) dividido entre 8 es 13/8, y (10 más 16) dividido entre 16 es 26/16.
- titulo: ¿La propiedad de composición mantiene válida la proporción original?
  respuesta: Sí
  solucion_pasos:
  - El resultado sigue siendo una proporción verdadera.
- titulo: ¿La composición proporcional resta el denominador al numerador?
  respuesta: 'No'
  solucion_pasos:
  - La composición suma el denominador al numerador; restar corresponde a la descomposición.
errores_frecuentes:
- Sumar términos de razones distintas entre sí.
- Sumar los numeradores de ambas fracciones entre sí en vez de sumar cada numerador con su
  propio denominador.
- Aplicar composición a razones que no forman una proporción válida.
- Olvidar mantener el mismo denominador original al escribir la nueva proporción.
- Confundir la propiedad de composición con la de descomposición, restando en vez de sumar.
afirmaciones_verdaderas:
- $\frac{a}{b} = \frac{c}{d} \implies \frac{a+b}{b} = \frac{c+d}{d}$.
- La propiedad de composición se puede verificar comprobando que el producto cruzado de la
  nueva proporción también se cumple.
al_terminar_debes_poder: Aplicar la propiedad de composición proporcional para transformar
  igualdades de razones.
fuente: Texto escolar MINEDUC.
estado: publicado
