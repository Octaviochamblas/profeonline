semantic_id: MAT.NUM.PROPORCIONES.COMPOSICION_PROPORCIONAL
resumen_inicial: 'La propiedad de la composición proporcional establece que si $\frac{a}{b} = \frac{c}{d}$, entonces se cumple la igualdad de las sumas compuestas: $\frac{a+b}{b} = \frac{c+d}{d}$ y $\frac{a+b}{a} = \frac{c+d}{c}$.'
explicacion_simple: |
  La composición proporcional es un truco algebraico que te permite sumar el denominador al numerador en ambos lados de una proporción sin alterar la igualdad. Si sabes que $\frac{a}{b} = \frac{c}{d}$, sumar 1 a ambos lados produce $\frac{a}{b} + 1 = \frac{c}{d} + 1 \implies \frac{a+b}{b} = \frac{c+d}{d}$. Por ejemplo, de $\frac{2}{3} = \frac{4}{6}$, componiendo obtenemos $\frac{2+3}{3} = \frac{4+6}{6} \implies \frac{5}{3} = \frac{10}{6}$, lo cual es totalmente cierto ($1.666...$).
explicacion_formal: |
  ### Definición formal
  Dada la proporción geométrica $\frac{a}{b} = \frac{c}{d}$ con $a, b, c, d \neq 0$:
  - La **composición por suma respecto al consecuente** establece:
    $$\frac{a + b}{b} = \frac{c + d}{d}$$
  - La **composición por suma respecto al antecedente** establece:
    $$\frac{a + b}{a} = \frac{c + d}{c}$$

  ### Demostración analítica
  Sumando la unidad escalar ($1$) a ambos miembros de la ecuación original:
  $$\frac{a}{b} + 1 = \frac{c}{d} + 1 \implies \frac{a}{b} + \frac{b}{b} = \frac{c}{d} + \frac{d}{d} \implies \frac{a + b}{b} = \frac{c + d}{d}$$

  ### Aplicación en resolución de sistemas de ecuaciones
  Es útil para resolver problemas donde se conoce la suma de dos variables $x + y = S$ y su razón $\frac{x}{y} = \frac{m}{n}$:
  $$\frac{x + y}{y} = \frac{m + n}{n} \implies \frac{S}{y} = \frac{m + n}{n} \implies y = \frac{S \cdot n}{m + n}$$

  ### Síntesis didáctica
  - Operación: Sumar el denominador al numerador en ambos lados de la proporción.
definiciones_clave: |
  - **Composición proporcional**: Propiedad que transforma una proporción sumando los términos de cada razón.
  - **Suma de componentes $a + b$**: Término compuesto resultante de adicionar el antecedente y el consecuente.
  - **Transformación equivalente**: Operación algebraica que preserva la validez de la igualdad de razones.
propiedades_relaciones: |
  - **Composición de numeradores y denominadores**: También se cumple que $\frac{a + c}{b + d} = \frac{a}{b} = \frac{c}{d}$.
  - **Combinación con la descomposición**: Al combinar la composición y la descomposición por división, se obtiene $\frac{a + b}{a - b} = \frac{c + d}{c - d}$.
ejemplo_guiado:
  enunciado: 'Se sabe que la razón entre dos números $x$ e $y$ es $\frac{x}{y} = \frac{3}{5}$ y que su suma es $x + y = 40$. Halla los valores de $x$ e $y$ usando composición proporcional.'
  pasos:
    - 'Paso 1: Aplicamos la composición por suma respecto al consecuente en la proporción dada: $\frac{x + y}{y} = \frac{3 + 5}{5}$.'
    - 'Paso 2: Sustituimos el dato conocido de la suma $x + y = 40$: $\frac{40}{y} = \frac{8}{5}$.'
    - 'Paso 3: Despejamos el consecuente $y$ aplicando producto cruzado: $8y = 40 \cdot 5 = 200 \implies y = \frac{200}{8} = 25$.'
    - 'Paso 4: Calculamos $x$ restando de la suma total: $x = 40 - 25 = 15$. Verificación: $\frac{15}{25} = \frac{3}{5}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué igualdad se deduce de la proporción $\frac{a}{b} = \frac{c}{d}$ mediante la propiedad de composición proporcional respecto al consecuente?'
    choices:
      - {text: '$\frac{a + b}{b} = \frac{c + d}{d}$, sumando el denominador al numerador en ambos lados', is_correct: true}
      - {text: '$\frac{a \cdot b}{b} = \frac{c \cdot d}{d}$, multiplicando los términos', is_correct: false}
      - {text: '$\frac{a - b}{b} = \frac{c + d}{d}$, mezclando una resta con una suma', is_correct: false}
      - {text: '$a + b = c + d$, igualando directamente las sumas', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{a + b}{b} = \frac{c + d}{d}$, sumando el denominador al numerador en ambos lados''. Se obtiene sumando 1 a ambos lados de la igualdad.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $\frac{a}{b} = \frac{2}{7}$ y $a + b = 36$, ¿cuál es el valor de la variable $b$ por composición?'
    choices:
      - {text: '$28$, mediante el cálculo $\frac{36}{b} = \frac{2 + 7}{7} = \frac{9}{7} \implies 9b = 252 \implies b = 28$', is_correct: true}
      - {text: '$8$, que es el valor de a', is_correct: false}
      - {text: '$18$, dividiendo en partes iguales', is_correct: false}
      - {text: '$14$, sumando $7 + 7$', is_correct: false}
    explanation: 'La alternativa correcta es ''$28$, mediante el cálculo $\frac{36}{b} = \frac{2 + 7}{7} = \frac{9}{7} \implies 9b = 252 \implies b = 28$''. Planteamos $\frac{36}{b} = \frac{9}{7} \implies b = 28$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la proporción inicial $\frac{a}{b} = \frac{c}{d}$.'
  - 'Paso 2: Sumar el denominador al numerador en ambos miembros de la ecuación: $\frac{a + b}{b} = \frac{c + d}{d}$.'
  - 'Paso 3: Reemplazar el valor numérico conocido de la suma $(a + b)$ en la ecuación.'
  - 'Paso 4: Aplicar el producto cruzado para despejar el término desconocido.'
errores_correccion: |
  - **Error 1:** Sumar el denominador únicamente en el lado izquierdo de la proporción sin sumarlo en el lado derecho. **Cómo corregirlo:** La composición exige **sumar el denominador correspondiente en AMBOS miembros** de la igualdad ($\frac{a+b}{b} = \frac{c+d}{d}$).
  - **Error 2:** Creer que la suma $a + b$ debe ser igual a la suma $c + d$. **Cómo corregirlo:** Las sumas individuales pueden ser diferentes; lo que se mantiene estrictamente igual es la **razón entre las sumas y sus denominadores**.
ejemplos:
  - titulo: 'Composición de una proporción simple'
    enunciado: 'A partir de $\frac{1}{4} = \frac{3}{12}$, ¿la composición entrega la proporción válida $\frac{5}{4} = \frac{15}{12}$?'
    alternativas:
      - 'Sí, pues $(1+4)/4 = 5/4$ y $(3+12)/12 = 15/12$'
      - 'No, es falsa'
      - 'No, las fracciones son distintas'
    respuesta: 'Sí, pues $(1+4)/4 = 5/4$ y $(3+12)/12 = 15/12$'
    solucion_pasos:
      - '1. Lado izquierdo: $(1+4)/4 = 5/4 = 1.25$.'
      - '2. Lado derecho: $(3+12)/12 = 15/12 = 1.25 \implies$ Válida.'
  - titulo: 'Despeje con suma de variables'
    enunciado: 'Si $\frac{x}{y} = \frac{2}{3}$ y $x + y = 20$, ¿se cumple que $y = 12$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $20/y = 5/3 \implies 5y = 60 \implies y = 12$.'
  - titulo: 'Composición respecto al antecedente'
    enunciado: 'De $\frac{a}{b} = \frac{c}{d}$, ¿es válida la relación $\frac{a+b}{a} = \frac{c+d}{c}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por la composición respecto al antecedente.'
  - titulo: 'Composición con decimales'
    enunciado: 'De $\frac{0.5}{1.5} = \frac{1}{3}$, ¿la composición $\frac{2}{1.5} = \frac{4}{3}$ es correcta?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(0.5+1.5)/1.5 = 2/1.5 = 4/3$.'
errores_frecuentes:
  - 'Sumar el denominador en el primer miembro de la igualdad pero restar en el segundo.'
  - 'Igualar las sumas numéricas directas $a + b = c + d$ sin conservar la estructura de fracción.'
  - 'Sumar los numeradores entre sí y los denominadores entre sí creyendo que esa es la única composición.'
  - 'El valor numérico conocido de la suma se omite al aplicar la regla de composición.'
  - 'Dividir entre la suma $a + b$ en lugar de conservar el denominador original $b$.'
afirmaciones_verdaderas:
  - 'La composición proporcional establece que si $\frac{a}{b} = \frac{c}{d}$, entonces se cumple $\frac{a+b}{b} = \frac{c+d}{d}$.'
  - 'La composición proporcional permite resolver sistemas donde se conoce la suma de dos variables y su relación de razón.'
al_terminar_debes_poder: 'Aplicar la propiedad de composición proporcional $\frac{a+b}{b} = \frac{c+d}{d}$ para simplificar y despejar sistemas de razones.'
