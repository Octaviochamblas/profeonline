procedimiento:
- 'Paso 1: Escribir la proporción original $\frac{x}{y} = \frac{a}{b}$.'
- 'Paso 2: Aplicar la propiedad de composición sumando denominadores a numeradores: $\frac{x+y}{y} = \frac{a+b}{b}$.'
- 'Paso 3: Sustituir el valor conocido de la suma $(x+y)$ y despejar la variable $y$ mediante producto cruzado.'
errores_correccion: "- **Error 1: Sumar en un solo miembro ($\frac{x+y}{y} = \frac{a}{b}$).** **Cómo corregirlo:** La adición del consecuente se debe realizar en AMBOS miembros: $\\frac{x+y}{y} = \\frac{a+b}{b}$.\n- **Error 2: Cambiar el denominador.** **Cómo corregirlo:** El denominador se mantiene intacto tras la suma."
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\frac{a}{b} = \frac{3}{4}$ y $a + b = 28$, ¿cuánto vale $a$?
  alternativas:
  - $12$
  - $16$
  - $21$
  respuesta: $12$
  solucion_pasos:
  - $\frac{a+b}{b} = \frac{3+4}{4} \implies \frac{28}{b} = \frac{7}{4} \implies b = 16$. Luego $a = 28 - 16 = 12$.
- titulo: Ejemplo 2
  enunciado: ¿Qué resulta al componer $\frac{2}{3} = \frac{4}{6}$ respecto a sus antecedentes?
  alternativas:
  - $\frac{5}{2} = \frac{10}{4}$
  - $\frac{5}{3} = \frac{10}{6}$
  - $\frac{1}{2} = \frac{2}{4}$
  respuesta: $\frac{5}{2} = \frac{10}{4}$
  solucion_pasos:
  - $\frac{2+3}{2} = \frac{5}{2}$ y $\frac{4+6}{4} = \frac{10}{4}$.
- titulo: ¿Es equivalente componer una proporción a sumar 1 en ambos miembros?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la demostración matemática formal de la propiedad.
  alternativas:
  - texto: Sí, sumando 1 a ambos lados se obtiene exactamente la fórmula
    es_correcta: true
    retroalimentacion: ¡Correcto! Demostración rigurosa.
  - texto: No, es multiplicar por 2
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es aditiva.
  - texto: No, solo aplica para números enteros
    es_correcta: false
    retroalimentacion: Incorrecto, es válido para todos los números reales.
- titulo: ¿Permite la composición resolver problemas donde se conoce la suma de las partes?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el método algebraico estándar para incorporar la suma de incógnitas.
  alternativas:
  - texto: Sí, convierte el sistema de ecuaciones en una proporción simple de una variable
    es_correcta: true
    retroalimentacion: ¡Correcto! Desacopla el sistema.
  - texto: No, solo sirve para restas
    es_correcta: false
    retroalimentacion: Incorrecto, para restas se usa la descomposición.
  - texto: No, requiere tres ecuaciones
    es_correcta: false
    retroalimentacion: Incorrecto, resuelve el sistema con una sola ecuación.
errores_frecuentes:
- Sumar solo en el numerador izquierdo y olvidar el derecho.
- Confundir composición (suma) con descomposición (resta).
- Cambiar los denominadores de referencia durante el proceso.
- Cometer errores al despejar la incógnita tras sustituir la suma.
afirmaciones_verdaderas:
- La composición de una proporción establece que $\frac{a+b}{b} = \frac{c+d}{d}$.
- Equivale algebraicamente a sumar 1 en ambos miembros de la igualdad.
- Permite resolver sistemas proporcionales conociendo la suma de las variables.
al_terminar_debes_poder: '![Síntesis de composición proporcional](/static/img/nodos/uso-de-la-composicion-proporcional-resumen.svg)


  QUÉ: Aplicar la propiedad de composición de proporciones para resolver sistemas con sumas conocidas.


  CÓMO: Transformando la proporción en $\frac{x+y}{y} = \frac{a+b}{b}$, sustituyendo la suma $x+y$ y despejando la incógnita mediante producto cruzado.'
