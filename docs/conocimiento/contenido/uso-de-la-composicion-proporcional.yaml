semantic_id: MAT.NUM.RAZONES_PROPORCIONES.COMPOSICION_PROPORCIONAL
resumen_inicial: 'La composición de una proporción establece que al sumar a cada antecedente su respectivo consecuente, la proporción se mantiene invariante: $\frac{a}{b} = \frac{c}{d} \implies \frac{a+b}{b} = \frac{c+d}{d}$ (o sobre $a$ y $c$).'
explicacion_simple: "![Composición proporcional](/static/img/nodos/uso-de-la-composicion-proporcional-intro.svg)\n\nLa **composición de una proporción** consiste en **sumar el denominador al numerador** en ambos lados:\n$$\\frac{a}{b} = \\frac{c}{d} \\implies \\frac{a + b}{b} = \\frac{c + d}{d}$$\n- **¿Por qué funciona?** Porque equivale a sumar $1$ a ambos miembros de la ecuación ($+1$).\n- **¿Para qué sirve?** Es la herramienta ideal para resolver problemas donde conocemos la **suma de dos incógnitas**:\n  - Si sabemos que $\\frac{x}{y} = \\frac{2}{5}$ y que $x + y = 35$:\n  - Aplicamos composición: $\\frac{x + y}{y} = \\frac{2 + 5}{5} \\implies \\frac{35}{y} = \\frac{7}{5}$.\n  - Despejamos $y = \\frac{35 \\cdot 5}{7} = 25$, y por tanto $x = 10$."
explicacion_formal: '**Teorema de Composición de Proporciones:**

  Sea la proporción $\frac{a}{b} = \frac{c}{d}$ con $b, d \neq 0$. Entonces se verifican las siguientes identidades de composición:


  1. **Composición respecto a consecuentes:**

  $$\frac{a + b}{b} = \frac{c + d}{d}$$


  2. **Composición respecto a antecedentes ($a, c \neq 0$):**

  $$\frac{a + b}{a} = \frac{c + d}{c}$$


  **Demostración:**

  Sumando $1$ a ambos miembros de la igualdad inicial:

  $$\frac{a}{b} + 1 = \frac{c}{d} + 1 \iff \frac{a + b}{b} = \frac{c + d}{d} \quad \blacksquare$$'
definiciones_clave: '- **Composición proporcional**: Transformación por adición de denominadores a numeradores.

  - **Suma de términos**: Estructura $a + b$ y $c + d$.

  - **Invarianza de igualdad**: Preservación de la equivalencia matemática tras sumar 1.'
propiedades_relaciones: '- **Combinación con alternancia**: $\frac{a + b}{c + d} = \frac{b}{d} = \frac{a}{c}$.

  - **Despeje simultáneo**: Permite desacoplar sistemas lineales de 2 incógnitas con razones.'
ejemplo_guiado:
  enunciado: '![Ejemplos de composición proporcional](/static/img/nodos/uso-de-la-composicion-proporcional-ejemplos.svg)


    Encuentre los valores de $x$ e $y$ sabiendo que $\frac{x}{y} = \frac{2}{5}$ y que $x + y = 35$, y verifique la composición en la proporción $\frac{3}{4} = \frac{6}{8}$.'
  pasos:
  - 'Paso 1: Para el sistema con $x+y=35$: Aplicar composición $\frac{x+y}{y} = \frac{2+5}{5}$.'
  - 'Paso 2: Sustituir la suma conocida: $\frac{35}{y} = \frac{7}{5}$.'
  - 'Paso 3: Despejar $y$: $y = \frac{35 \cdot 5}{7} = 25$.'
  - 'Paso 4: Calcular $x$: $x = 35 - 25 = 10$.'
  - 'Paso 5: Para la verificación: $\frac{3+4}{4} = \frac{7}{4} = 1,75$ y $\frac{6+8}{8} = \frac{14}{8} = 1,75$ (¡coinciden!).'
checkpoints:
- placement: after_explicacion_formal
  question: Si $\frac{a}{b} = \frac{c}{d}$, ¿cuál es la forma correcta de componer respecto a los consecuentes?
  choices:
