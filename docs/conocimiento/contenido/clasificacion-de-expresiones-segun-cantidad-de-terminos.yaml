resumen_inicial: La clasificación de expresiones algebraicas según la cantidad de
  términos las clasifica en monomios (1), binomios (2), trinomios (3) y multinomios
  o polinomios de $n$ términos.
explicacion_simple: 'Clasificar una expresión por su número de términos es como contar
  cuántos vagones tiene un tren. Primero juntamos los términos que sean idénticos
  o semejantes. Luego contamos cuántos bloques separados por $+$ o $-$ nos quedan:
  $1$ bloque es monomio, $2$ es binomio, $3$ es trinomio, y $4$ o más se llama multinomio
  o polinomio de $n$ términos.'
explicacion_formal: 'Sea $P = \sum_{k=1}^n T_k$ un polinomio reducido donde $\forall
  i \neq j, \text{Lit}(T_i) \neq \text{Lit}(T_j)$. La **Clasificación por Número de
  Términos** $N(P) = n$ se define por:


  $$N(P) = \begin{cases} 1 & \implies \text{Monomio} \\ 2 & \implies \text{Binomio}
  \\ 3 & \implies \text{Trinomio} \\ n \ge 4 & \implies \text{Multinomio / Polinomio
  de } n \text{ términos} \end{cases}$$


  > **Complemento didáctico:** La clasificación por número de términos fija el marco
  de aplicabilidad de algoritmos de simplificación y productos notables.'
definiciones_clave: '- **Monomio**: 1 término.

  - **Binomio**: 2 términos no semejantes.

  - **Trinomio**: 3 términos no semejantes.

  - **Multinomio**: 4 o más términos no semejantes.'
propiedades_relaciones: '- **Reducción previa**: La clasificación exige reducir totalmente
  los términos semejantes antes de realizar el conteo.'
ejemplo_guiado:
  enunciado: Clasifique la expresión $E(x) = 4x^3 - 2x + 7x^3 + 5 - x$.
  pasos:
  - 'Paso 1: Agrupar términos semejantes:

    - Términos en $x^3$: $4x^3 + 7x^3 = 11x^3$.

    - Términos en $x^1$: $-2x - x = -3x$.

    - Constante: $+5$.'
  - 'Paso 2: Escribir la expresión reducida: $11x^3 - 3x + 5$.'
  - 'Paso 3: Contar el número de términos resultantes: $3$ términos.'
  - 'Conclusión: Al tener $3$ términos irreducibles, la expresión es un **Trinomio**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué paso es estrictamente obligatorio realizar ANTES de contar el número
    de términos para clasificar una expresión?
  choices:
  - text: Reducir totalmente todos los términos semejantes que existan en la expresión
    is_correct: true
  - text: Multiplicar todos los coeficientes por dos
    is_correct: false
  - text: Reemplazar las variables por el número cero
    is_correct: false
  - text: Cambiar los signos negativos a positivos
    is_correct: false
  explanation: La alternativa correcta es 'Reducir totalmente todos los términos semejantes
    que existan en la expresión'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4x^3 - 2x + 7x^3 + 5 - x, ¿cuál fue su clasificación
    final tras reducir?
  choices:
  - text: Trinomio (3 términos)
    is_correct: true
  - text: Multinomio de 5 términos
    is_correct: false
  - text: Binomio (2 términos)
    is_correct: false
  - text: Monomio (1 término)
    is_correct: false
  explanation: La alternativa correcta es 'Trinomio (3 términos)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar y sumar/restar los términos semejantes.'
- 'Paso 2: Escribir la expresión simplificada final.'
- 'Paso 3: Asignar la categoría (monomio, binomio, trinomio o multinomio) según la
  cantidad de términos.'
errores_correccion: '- **Error 1: Clasificar $x + x + x + x$ como multinomio de 4
  términos.** **Cómo corregirlo:** Al reducir $x + x + x + x = 4x$, se obtiene un
  monomio de 1 solo término.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se clasifica la expresión reducida 9x^4 - 2x^2 + 5x - 1?
  alternativas:
  - Multinomio / Polinomio de 4 términos
  - Trinomio
  - Binomio
  - Monomio
  respuesta: Multinomio / Polinomio de 4 términos
  solucion_pasos:
  - '1. Contar términos no semejantes: 4 términos.'
  - '2. Clasificación: Multinomio de 4 términos.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la clasificación de 6ab - 6ab + 3?
  alternativas:
  - Monomio
  - Binomio
  - Trinomio
  - Nulo
  respuesta: Monomio
  solucion_pasos:
  - '1. Reducir: 6ab - 6ab = 0.'
  - 2. Queda la constante 3 (1 solo término -> Monomio).
- titulo: ¿Es la expresión reducida x^3 - y^3 un binomio?
  respuesta: Sí
  solucion_pasos:
  - Sí, posee exactamente 2 términos irreducibles.
- titulo: ¿Cambia la clasificación por número de términos si reordenamos los elementos
    del polinomio?
  respuesta: 'No'
  solucion_pasos:
  - No, el número de términos irreducibles se conserva sin importar el orden.
errores_frecuentes:
- Contar los términos directamente sin reducir los términos semejantes previos.
- Declarar la cantidad de variables con la cantidad de términos del polinomio.
- Declarar que los términos independientes no se cuentan al clasificar la expresión.
- Declarar que un polinomio de 4 términos se llama trinomio.
- Declarar el grado absoluto de la expresión con el número de sus términos.
afirmaciones_verdaderas:
- La clasificación según el número de términos requiere simplificar la expresión previamente.
- Las expresiones se dividen en monomios (1), binomios (2), trinomios (3) y multinomios
  (4 o más).
al_terminar_debes_poder: Al terminar serás capaz de clasificar cualquier expresión
  algebraica según su número de términos reduciendo previamente los términos semejantes.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Expresiones Algebraicas.
