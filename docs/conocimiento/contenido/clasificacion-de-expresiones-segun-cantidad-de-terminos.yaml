procedimiento:
- 'Paso 1: Simplifica o reduce el polinomio si tiene partes semejantes.'
- 'Paso 2: Subraya cada pedazo de la expresión, cortando el subrayado justo ANTES
  de cada signo + o - que esté ''libre'' al aire (no encerrado en escudos).'
- 'Paso 3: Cuenta cuántas líneas de subrayado hiciste.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar clasificación de expresiones según cantidad de términos.
ejemplos:
- titulo: Esquivando trampas
  enunciado: 'Determina el número de términos de la expresión: a - (b+c) + d/4'
  solucion_pasos:
  - 'Término 1: ''a''. Luego viene un menos libre. Corte.'
  - 'Término 2: ''-(b+c)''. El signo más interior no cuenta porque está protegido.
    Luego viene un más libre. Corte.'
  - 'Término 3: ''+ d/4''.'
  - 'Total: 3 términos.'
- titulo: Una fórmula de corrección de vuelo está dada por $E = 1000 - \frac{v+w}{t}
    + 4(a-b)$. El com
  enunciado: 'Una fórmula de corrección de vuelo está dada por $E = 1000 - \frac{v+w}{t}
    + 4(a-b)$. El computador de vuelo reserva en memoria un ''registro'' de cálculo
    para cada término matemático individual e independiente que conforma la fórmula.
    ¿Cuántos registros de memoria utilizará la computadora para evaluar el lado derecho
    de la ecuación? (v1)


    Opciones: A) 3 registros de memoria. · B) 7 registros de memoria. · C) 5 registros
    de memoria. · D) 1 registro de memoria.'
  solucion_pasos:
  - Analizamos $1000 - \frac{{v+w}}{{t}} + 4(a-b)$. El primer corte es tras el 1000
    (T1). El segundo corte es tras la fracción compleja que agrupa $v+w$ sobre $t$
    (T2). El tercer bloque es la multiplicación del 4 por el paréntesis protegido
    (T3). Son 3 términos gruesos.
  - 'Respuesta: 3 registros de memoria.'
