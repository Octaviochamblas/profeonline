semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.CONDICION_BASE
resumen_inicial: La condición de base positiva y distinta de uno ($b > 0, b \neq 1$) en una función exponencial garantiza su continuidad y existencia en todo $\mathbb{R}$ evitando números complejos y funciones constantes degeneradas.
explicacion_simple: "![La condición de base positiva y distinta de uno ($b > 0, b \\neq 1$) en una función exponencial garantiza su continuidad y existencia en todo $\\mathbb{R}$ evitando números complejos y funciones constantes degeneradas](/static/img/nodos/condicion-de-base-positiva-y-distinta-de-uno-en-una-funcion-exponencial-intro.svg)\n\n\n¿Por qué la base $b$ tiene que ser estrictamente positiva y no puede ser 1?\n\n- **1. ¿Por qué $b$ no puede ser negativa ($b < 0$)?**\n  - Si tuvieras $f(x) = (-4)^x$ y quieres evaluar en $x = \\frac{1}{2}$:\n    $$(-4)^{1/2} = \\sqrt{-4} = 2i \\notin \\mathbb{R}$$\n  - ¡Te saldrían números imaginarios! La gráfica se rompería en pedacitos y no se podría dibujar en el plano real.\n- **2. ¿Por qué $b$ no puede ser cero ($b = 0$)?**\n  - $0^x = 0$ para todo $x > 0$, pero para $x < 0$ daría $0^{-2} = \\frac{1}{0}$ (indefinido).\n- **3. ¿Por qué $b$ no puede ser uno ($b = 1$)?**\n  - $1^x = 1$ para todo $x$. Es una recta horizontal fija, no una curva\
  \ exponencial."
explicacion_formal: "Sea la exponencial general $f(x) = b^x = e^{x \\ln(b)}$. Para que $f$ sea un morfismo continuo y diferenciable $f: \\mathbb{R} \\to \\mathbb{R}^+$ sobre el cuerpo ordenado conexo $\\mathbb{R}$, se requiere:\n\n1. **Condición de existencia en $\\mathbb{R}$ ($b > 0$)**:\n   El logaritmo natural $\\ln(b)$ está definido en $\\mathbb{R}$ si y solo si $b \\in \\mathbb{R}^+ = ]0, +\\infty[$. Para $b \\le 0$, la función multivaluada compleja $z \\mapsto b^z$ no posee una rama real continua sobre $\\mathbb{R}$.\n2. **Condición de no degeneración ($b \\neq 1$)**:\n   Si $b = 1 \\implies \\ln(1) = 0 \\implies f'(x) = 0 \\cdot 1^x = 0$, la función degenera en la constante trivial $f(x) = 1$, perdiendo la inyectividad y la invertibilidad logarítmica."
definiciones_clave: '- **Base admisible**: Elemento $b \in ]0, 1[ \cup ]1, +\infty[$.

  - **Función degenerada**: Función que colapsa a una constante $y = 1$ al anularse la tasa de cambio.'
propiedades_relaciones: '- **Bifurcación de comportamiento en $b = 1$**: El valor $b = 1$ separa el régimen de decaimiento ($0 < b < 1$) del régimen de crecimiento ($b > 1$).

  - **Invertibilidad asegurada**: $b > 0, b \neq 1$ garantiza la existencia unívoca de la función logaritmo $\log_b(x)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La condición de base positiva y distinta de uno ($b > 0, b \neq 1$) en una función exponencial garantiza su continuidad y existencia en todo $\mathbb{R}$ evitando números complejos y funciones constantes degeneradas](/static/img/nodos/condicion-de-base-positiva-y-distinta-de-uno-en-una-funcion-exponencial-ejemplos.svg)



    Analiza la validez como función exponencial en los números reales para las siguientes bases:

    1) $b = \frac{2}{3}$

    2) $b = -5$

    3) $b = 1$

    4) $b = 0$'
  pasos:
  - 'Paso 1: Para $b = 2/3$:

    - $2/3 > 0$ y $2/3 \neq 1$. **Es una base válida** (función decreciente en $\mathbb{R}$).'
  - 'Paso 2: Para $b = -5$:

    - $-5 < 0$. **No es válida** porque genera números complejos para exponentes no enteros.'
  - 'Paso 3: Para $b = 1$:

    - $b = 1$. **No es válida** porque genera la función constante $y = 1$.'
  - 'Paso 4: Para $b = 0$:

    - $b = 0$. **No es válida** porque no está definida para exponentes negativos ($0^{-1} = 1/0$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el conjunto exacto de valores permitidos para la base b de una función exponencial real?
  choices:
  - text: ']0, 1[ ∪ ]1, +∞[ (todos los reales positivos excepto el 1)'
    is_correct: true
  - text: '[0, +∞['
    is_correct: false
  - text: ℝ (todos los reales)
    is_correct: false
  - text: ']1, +∞[ únicamente'
    is_correct: false
  explanation: La alternativa correcta es ']0, 1[ ∪ ]1, +∞[ (todos los reales positivos excepto el 1)'. La base debe ser positiva ($b > 0$) y excluir al uno ($b \neq 1$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la función f(x) = (-2)ˣ no está definida en todo ℝ?
  choices:
  - text: Porque para exponentes como x = 1/2 produce √(-2), que no es un número real
    is_correct: true
  - text: Porque el número 2 es par
    is_correct: false
  - text: Porque no se puede elevar a potencias positivas
    is_correct: false
  - text: Porque es una función constante
    is_correct: false
  explanation: La alternativa correcta es 'Porque para exponentes como x = 1/2 produce √(-2), que no es un número real'. Las raíces de radicando negativo pertenecen a los complejos $\mathbb{C}$, no a $\mathbb{R}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor numérico de la base $b$ de la función.'
- 'Paso 2: Comprobar la desigualdad de positividad estricta $b > 0$.'
- 'Paso 3: Comprobar la condición de no degeneración $b \neq 1$.'
- 'Paso 4: Concluir si la función exponencial está bien definida sobre el cuerpo real $\mathbb{R}$.'
errores_correccion: '- **Error común:** Pensar que las fracciones como $b = 0,5$ no están permitidas.

  - **Cómo corregirlo:** Las bases entre 0 y 1 ($0 < b < 1$) **son totalmente válidas** y corresponden a **decaimiento exponencial**.'
ejemplos:
- titulo: 'Ejemplo 1: Base decimal admisible'
  enunciado: ¿Es válida la base en $f(x) = (0{,}75)^x$?
  alternativas:
  - Sí, porque 0,75 > 0 y 0,75 ≠ 1
  - No, porque es menor que 1
  - No, porque es decimal
  - Solo para x enteros
  respuesta: Sí, porque 0,75 > 0 y 0,75 ≠ 1
  solucion_pasos:
  - 'Paso 1: $0{,}75 \in ]0, 1[ \implies$ base exponencial válida.'
- titulo: 'Ejemplo 2: Base negativa rechazada'
  enunciado: ¿Por qué se rechaza $g(x) = (-9)^x$?
  alternativas:
  - Porque su base es negativa (b < 0)
  - Porque 9 es un cuadrado perfecto
  - Porque es creciente
  - Porque no tiene asíntota
  respuesta: Porque su base es negativa (b < 0)
  solucion_pasos:
  - 'Paso 1: $b = -9 < 0 \implies$ no es una función exponencial real.'
- titulo: 'Ejemplo 3: Base cero rechazada'
  enunciado: ¿Qué problema presenta $h(x) = 0^x$?
  alternativas:
  - No está definida para x negativos (0⁻¹ = 1/0 indefinido)
  - Da siempre 1
  - Es una parábola
  - Es continua
  respuesta: No está definida para x negativos (0⁻¹ = 1/0 indefinido)
  solucion_pasos:
  - 'Paso 1: $0^{-1} = 1/0$ produce división por cero.'
- titulo: 'Ejemplo 4: Base irracional'
  enunciado: ¿Es válida la función $f(x) = \pi^x$?
  alternativas:
  - Sí, porque π ≈ 3,1416 > 0 y π ≠ 1
  - No, π es irracional
  - Solo para x racionales
  - No tiene dominio real
  respuesta: Sí, porque π ≈ 3,1416 > 0 y π ≠ 1
  solucion_pasos:
  - 'Paso 1: $\pi > 0$ y $\pi \neq 1 \implies$ exponencial válida.'
errores_frecuentes:
- Excluir bases fraccionarias pensando erróneamente que solo se permiten números enteros.
- Aceptar bases negativas justificando que para exponentes enteros sí existen.
- Olvidar que b = 1 degenera la función exponencial en una constante.
afirmaciones_verdaderas:
- La base b de una función exponencial real debe pertenecer estrictamente a ]0, 1[ ∪ ]1, +∞[.
- Una base negativa no puede generar una función continua sobre todo el dominio ℝ.
al_terminar_debes_poder: '**QUÉ:** Justificar y verificar la condición de base b > 0 y b ≠ 1 en la función exponencial.


  **CÓMO:** Explicando por qué las bases negativas generan números complejos y la base 1 colapsa a una función constante.


  ![Resumen La condición de base positiva y distinta de uno ($b > 0, b \neq 1$) en una función exponencial garantiza su continuidad y existencia en todo $\mathbb{R}$ evitando números complejos y funciones constantes degeneradas](/static/img/nodos/condicion-de-base-positiva-y-distinta-de-uno-en-una-funcion-exponencial-resumen.svg)'
