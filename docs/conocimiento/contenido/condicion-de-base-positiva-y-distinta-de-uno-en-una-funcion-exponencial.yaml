semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.CONDICION_BASE
resumen_inicial: La condición de la base exige que $b > 0$ y $b \neq 1$ para asegurar que la función exponencial esté bien definida en todos los números reales.
explicacion_simple: |
  Para que una función sea considerada **exponencial válida $f(x) = b^x$**, la base $b$ debe cumplir **DOS CONDICIONES RIGUROSAS**:

  1. **La base debe ser estrictamente positiva ($b > 0$)**:
     - Si fuera negativa (ej. $b = -4$), al evaluar $x = 1/2$ tendríamos $\sqrt{-4}$, ¡un número no real!
  2. **La base no puede ser igual a uno ($b \neq 1$)**:
     - Si $b = 1$, tendríamos $f(x) = 1^x = 1$ para todo $x$, lo cual es una **función constante aburrida (línea horizontal)** y no una curva exponencial.
explicacion_formal: |
  Sea el conjunto de bases exponenciales admisibles $\mathcal{B} = \mathbb{R}^+ \setminus \{1\} = ]0, 1[ \, \cup \, ]1, +\infty[$. La restricción $b \in \mathcal{B}$ se fundamenta en dos demostraciones de invalidez funcional:

  **Demostración de restricciones:**
  1. **Si $b \le 0$ (Invalidez de Dominio Real):** Para $b < 0$, la función $f(x) = b^x$ no está definida de forma continua sobre $\mathbb{R}$, produciendo indeterminaciones en números fraccionarios con denominador par (ej. $(-2)^{1/2} \notin \mathbb{R}$). Si $b = 0$, $0^x$ se indetermina en $x \le 0$.
  2. **Si $b = 1$ (Degeneración en Función Constante):** $f(x) = 1^x = 1, \, \forall x \in \mathbb{R}$. Pierde el comportamiento asintótico, la inyectividad y la relación de inversa con los logaritmos.
definiciones_clave: |
  - **Dominio de bases exponenciales ($\mathcal{B}$)**: Conjunto $\mathbb{R}^+ \setminus \{1\}$ de reales estrictamente positivos distintos de uno que garantizan la existencia de la función exponencial.
propiedades_relaciones: |
  - **Continuidad y biyectividad**: La restricción $b \in \mathbb{R}^+ \setminus \{1\}$ es la condición mínima necesaria para que $f(x) = b^x$ sea una función continua y biyectiva de $\mathbb{R}$ en $\mathbb{R}^+$.
ejemplo_guiado:
  enunciado: 'Evalúa si las bases $b_1 = 4$, $b_2 = -3$ y $b_3 = 1$ definen funciones exponenciales reales válidas.'
  pasos:
    - 'Paso 1: Analizar $b_1 = 4$: cumple $4 > 0$ y $4 \neq 1$. Es una **base exponencial válida**.'
    - 'Paso 2: Analizar $b_2 = -3$: viola la positividad (es menor que cero). **No es una base exponencial válida**.'
    - 'Paso 3: Analizar $b_3 = 1$: viola la restricción $b \neq 1$ (degenera en función constante). **No es una base exponencial válida**.'
    - 'Paso 4: Concluir que solo $b_1 = 4$ define una función exponencial continua.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la expresión $f(x) = (-5)^x$ NO constituye una función exponencial válida sobre los números reales?'
    choices:
      - {text: 'Porque la base es negativa ($b = -5 < 0$), generando valores no reales para exponentes fraccionarios', is_correct: true}
      - {text: 'Porque el exponente es una variable independiente.', is_correct: false}
      - {text: 'Porque las potencias negativas siempre dan como resultado cero.', is_correct: false}
      - {text: 'Porque se convierte en una función lineal creciente.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque la base es negativa ($b = -5 < 0$), generando valores no reales para exponentes fraccionarios''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál de los siguientes valores de base $b$ define correctamente una función exponencial real?'
    choices:
      - {text: '$b = 0.5$', is_correct: true}
      - {text: '$b = 1$.', is_correct: false}
      - {text: '$b = -2$.', is_correct: false}
      - {text: '$b = 0$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$b = 0.5$''. Cumple $0.5 > 0$ y $0.5 \neq 1$ (base de decrecimiento exponencial).'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la constante que actúa como base de la variable exponencial.'
  - 'Paso 2: Verificar la condición de positividad estricta $b > 0$.'
  - 'Paso 3: Verificar que la base no sea neutra multiplicativa $b \neq 1$.'
  - 'Paso 4: Declarar la validez de la función si satisface $b \in ]0, 1[ \cup ]1, +\infty[$.'
errores_correccion: |
  - **Error común:** Pensar que $b = 1$ es una base exponencial porque se puede elevar a cualquier potencia.
  - **Cómo corregirlo:** Si $b = 1$, la función es $f(x) = 1$, una **LÍNEA RECTA CONSTANTE**, por lo que se excluye de las funciones exponenciales.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Base fraccionaria válida.
    alternativas:
      - 'Base válida b = 1/3 (0 < 1/3 < 1)'
      - 'Base inválida por ser fracción'
      - 'Función lineal de pendiente 1/3'
    respuesta: 'Base válida b = 1/3 (0 < 1/3 < 1)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Invalidez de base nula.
    alternativas:
      - 'Base inválida (b = 0 no cumple b > 0)'
      - 'Base válida de crecimiento'
      - 'Base válida de decrecimiento'
    respuesta: 'Base inválida (b = 0 no cumple b > 0)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la expresión $f(x) = 1^x$, es correcto afirmar que constituye una función exponencial creciente.'
  - 'La afirmación errónea de que bases negativas $b < 0$ están bien definidas para todo exponente $x \in \mathbb{R}$.'
  - 'La afirmación de que la base de una función exponencial puede tomar el valor cero sin generar indeterminaciones.'
  - 'La consideración de que bases fraccionarias como $b = \frac{1}{2}$ son inválidas por ser menores que 1.'
  - 'Afirmar que la restricción de la base $b > 0$ exige que el exponente $x$ sea también estrictamente positivo.'
afirmaciones_verdaderas:
  - 'La base de una función exponencial debe pertenecer al conjunto $\mathbb{R}^+ \setminus \{1\}$, descartando bases negativas, nulas o iguales a uno.'
  - 'La base $b = 1$ se excluye de la definición exponencial porque $1^x = 1$ produce una función constante sin comportamiento curvo.'
al_terminar_debes_poder: |
  QUÉ: Verificar la validez de la base $b$ en una función exponencial $f(x) = b^x$.
  CÓMO: Comprobar las dos desigualdades fundamentales $b > 0$ y $b \neq 1$, justificando la exclusión de bases negativas, nulas o unitarias.
fuente: 'Texto escolar MINEDUC — Álgebra / Funciones Exponenciales'
