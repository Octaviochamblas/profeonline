semantic_id: MAT.ALG.MCM_ALGEBRAICO.FACTORIZACION_POLINOMIOS
resumen_inicial: El cálculo del m.c.m. entre polinomios mediante factorización consiste en descomponer los polinomios en factores
  primos e integrar el producto de todos los factores (comunes y no comunes) elevados a su mayor exponente.
explicacion_simple: "Para hallar el **m.c.m. entre polinomios** (ej: $P(x) = x^2 - 9$ y $Q(x) = x^2 - 6x + 9$):\n- **MÉTODO\
  \ DE FACTORIZACIÓN EN 3 PASOS**:\n  1. **Factoriza por completo cada uno de los polinomios**:\n     - $P(x) = x^2 - 9 =\
  \ \\mathbf{(x + 3)(x - 3)}$ (¡Diferencia de cuadrados!).\n     - $Q(x) = x^2 - 6x + 9 = \\mathbf{(x - 3)^2}$ (¡Trinomio\
  \ cuadrado perfecto!).\n  2. **Reúne TODOS los factores binómicos (comunes y no comunes)**:\n     - El factor $(x - 3)$\
  \ aparece en ambos.\n     - El factor $(x + 3)$ sólo aparece en $P(x)$, ¡se incluye igual!\n  3. **Selecciona la potencia\
  \ de MAYOR exponente**:\n     - Para $(x - 3)$: los exponentes son $1$ y $2 \\implies$ mayor exponente = **$2$** ($(x -\
  \ 3)^2$).\n     - Para $(x + 3)$: exponente único = **$1$** ($(x + 3)$).\n     - **m.c.m. final**: $\\mathbf{(x + 3)(x -\
  \ 3)^2}$.\n\n![Cálculo del m.c.m. de polinomios por factorización](/static/img/nodos/calculo-del-mcm-entre-polinomios-mediante-factorizacion-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $P_1(x), P_2(x), \dots, P_k(x) \in \mathbb{K}[x]$ polinomios no nulos sobre el Dominio de Factorización Única (DFU)
  $\mathbb{K}[x]$. Dada la descomposición canónica de cada polinomio en producto de factores primos irreducibles $P_i(x) =
  c_i \prod_{j=1}^m [F_j(x)]^{e_{i,j}}$, el **m.c.m. polinomial por factorización** es la estructura:


  $$\operatorname{mcm}(P_1, P_2, \dots, P_k) = \operatorname{mcm}(|c_1|, \dots, |c_k|) \cdot \prod_{j=1}^m [F_j(x)]^{\max_i(e_{i,j})}$$


  ### Exponente Máximo e Inclusión de Factores No Comunes

  Si un factor irreducible $F_m(x)$ figura en un único polinomio $P_r(x)$ con exponente $e_{r,m}$ y tiene exponente 0 en los
  demás, $\max(e_{1,m}, \dots, e_{r,m}, \dots, 0) = e_{r,m} > 0$, demostrando que **todos los factores primos no comunes quedan
  obligatoriamente incorporados en el m.c.m.**.


  ### Síntesis didáctica

  Descomponer totalmente los polinomios permite armar el m.c.m. multiplicando todos los factores compartidos y no compartidos
  a sus respectivas potencias máximas.

  '
definiciones_clave: '- **m.c.m. de polinomios por factorización**: Algoritmo para encontrar el mínimo múltiplo común mediante
  la descomposición en factores primos.

  - **Factores no comunes polinómicos**: Paréntesis o binomios primos que pertenecen a un solo polinomio y que deben incluirse
  en el m.c.m.

  - **Exponentes máximos de binomios ($\max(e_j)$)**: Potencia más alta a la cual está elevado un paréntesis o factor primo
  en cualquiera de los polinomios.

  '
propiedades_relaciones: '- **Divisibilidad de binomios**: El m.c.m. de dos polinomios es divisible exactamente por cada uno
  de los factores binómicos originales $P_i(x)$.

  '
ejemplo_guiado:
  enunciado: Calcula el m.c.m. entre los polinomios $P(x) = x^3 - 4x$ y $Q(x) = x^2 - 4x + 4$.
  pasos:
  - 'Paso 1: Factorizamos completamente el polinomio $P(x)$: - $P(x) = x(x^2 - 4) = \mathbf{x(x + 2)(x - 2)}$.'
  - 'Paso 2: Factorizamos completamente el polinomio $Q(x)$: - $Q(x) = \mathbf{(x - 2)^2}$.'
  - 'Paso 3: Reunimos todos los factores presentes (comunes y no comunes): - Factor $x$ (en $P(x)$) $\implies$ **se incluye**.
    - Factor $(x + 2)$ (en $P(x)$) $\implies$ **se incluye**. - Factor $(x - 2)$ (en $P(x)$ y $Q(x)$) $\implies$ **se incluye**.'
  - 'Paso 4: Asignamos a cada factor su **mayor exponente**: - Para $x$: exponente $1 \implies x^1$. - Para $(x + 2)$: exponente
    $1 \implies (x + 2)^1$. - Para $(x - 2)$: exponentes $1$ y $2 \implies$ mayor exponente es **$2$** ($(x - 2)^2$).'
  - 'Paso 5: Multiplicamos los factores: $x(x + 2)(x - 2)^2$.'
  - 'Conclusión: El m.c.m. entre los dos polinomios es **$x(x + 2)(x - 2)^2$**.'
  imagen: /static/img/nodos/calculo-del-mcm-entre-polinomios-mediante-factorizacion-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el m.c.m. entre los polinomios $A(x) = x^2 - 1$ y $B(x) = x^2 + 2x + 1$?
  choices:
  - text: El m.c.m. es $(x - 1)(x + 1)^2$, factorizando $A(x)=(x+1)(x-1)$ y $B(x)=(x+1)^2$, reuniendo todos los factores con
      su mayor exponente
    is_correct: true
  - text: El m.c.m. es $(x + 1)$
    is_correct: false
  - text: El m.c.m. es $(x - 1)(x + 1)$
    is_correct: false
  - text: El m.c.m. es $(x^2 - 1)^2$
    is_correct: false
  explanation: La alternativa correcta es 'El m.c.m. es $(x - 1)(x + 1)^2$, factorizando $A(x)=(x+1)(x-1)$ y $B(x)=(x+1)^2$,
    reuniendo todos los factores con su mayor exponente'. $A(x)=(x+1)(x-1), B(x)=(x+1)^2 \implies \operatorname{mcm}=(x-1)(x+1)^2$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos polinomios no tienen ningún factor primo en común (son primos entre sí), ¿cuál es su m.c.m.?
  choices:
  - text: Su m.c.m. es el producto directo de ambos polinomios $A(x) \cdot B(x)$
    is_correct: true
  - text: Su m.c.m. es 1
    is_correct: false
  - text: Su m.c.m. es 0
    is_correct: false
  - text: No existe m.c.m.
    is_correct: false
  explanation: La alternativa correcta es 'Su m.c.m. es el producto directo de ambos polinomios $A(x) \cdot B(x)$'. Si $\operatorname{MCD}(A,B)
    = 1 \implies \operatorname{mcm}(A,B) = A(x) \cdot B(x)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente cada uno de los polinomios expresándolos en producto de factores primos irreducibles.'
- 'Paso 2: Elaborar una lista con todos los factores numéricos y binómicos que figuren en al menos uno de los polinomios.'
- 'Paso 3: Seleccionar para cada factor de la lista la potencia con el mayor exponente observado.'
- 'Paso 4: Multiplicar todos los factores elegidos para obtener el m.c.m. polinomial.'
errores_correccion: '- **Error 1:** Excluir del m.c.m. los factores que sólo aparecen en un polinomio. **Cómo corregirlo:**
  El m.c.m. **DEBE LLEVAR OBLIGATORIAMENTE TODOS LOS FACTORES QUE APAREZCAN EN CUALQUIERA DE LOS POLINOMIOS**.

  - **Error 2:** Tomar el menor exponente de un paréntesis compartido en lugar del mayor. **Cómo corregirlo:** Para formar
  el m.c.m. **SE DEBE SELECCIONAR LA POTENCIA CON EL MAYOR EXPONENTE OBSERVADO**.

  '
ejemplos:
- titulo: Diferencia de cuadrados y TCP
  enunciado: Para $x^2 - 4$ y $x^2 - 4x + 4$, ¿es el m.c.m. $(x + 2)(x - 2)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(x+2)(x-2)$ y $(x-2)^2 \implies (x+2)(x-2)^2$.
- titulo: Factor común exterior
  enunciado: Para $x^2 + x$ y $x^2 - 1$, ¿es el m.c.m. $x(x + 1)(x - 1)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x(x+1)$ y $(x+1)(x-1) \implies x(x+1)(x-1)$.
- titulo: Polinomios primos entre sí
  enunciado: Para $x + 1$ y $x - 2$, ¿es su m.c.m. $(x + 1)(x - 2)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el producto directo.
- titulo: Coeficiente numérico externo
  enunciado: Para $2(x - 3)$ y $3(x - 3)^2$, ¿es el m.c.m. $6(x - 3)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\operatorname{mcm}(2,3)=6$ y $(x-3)^2$.
errores_frecuentes:
- Excluir factores no comunes en la expresión final del m.c.m. polinomial.
- Seleccionar la potencia de menor exponente en lugar de la de mayor exponente para los factores compartidos.
- La factorización de los polinomios hasta sus componentes primos irreducibles no es ejecutada antes de comparar.
- Intercambiar las reglas de selección de factores del m.c.m. con las del M.C.D.
- Olvidar incluir los coeficientes numéricos exteriores en el m.c.m.
afirmaciones_verdaderas:
- El m.c.m. entre polinomios incluye todos los factores primos comunes y no comunes a su mayor exponente.
- Si dos polinomios no comparten ningún factor primo, su m.c.m. es igual a su producto directo.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/calculo-del-mcm-entre-polinomios-mediante-factorizacion-resumen.svg)


  QUÉ: Calcular el m.c.m. entre polinomios factorizándolos completamente e integrando todos sus factores.

  CÓMO: Factorizar totalmente cada polinomio hasta sus componentes primos irreducibles $F_j(x)$ e integrar todos los factores
  comunes y no comunes elevados a su máxima potencia ($\prod [F_{\text{todos}}]^{\max(e_i)}$).

  '
