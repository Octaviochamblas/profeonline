semantic_id: MAT.ALG.MCM_ALGEBRAICO.FACTORIZACION_POLINOMIOS
resumen_inicial: El m.c.m. entre polinomios mediante factorización se obtiene descomponiendo
  los polinomios en factores irreductibles y multiplicando todos los factores a su
  mayor exponente.
explicacion_simple: 'Para calcular el Mínimo Común Múltiplo entre dos o más polinomios
  utilizando factorización:

  1. Factorizamos completamente cada polinomio en producto de factores simples (líneas,
  trinomios, o monomios).

  2. Hacemos una lista de todos los factores resultantes (comunes y no comunes).

  3. Tomamos cada factor de la lista elevado al mayor exponente con el que figura
  entre las factorizaciones.

  4. Multiplicamos esos factores para formar el polinomio m.c.m. final.'
explicacion_formal: 'Sean $P(x)$ y $Q(x)$ dos polinomios descompuestos en factores
  irreductibles sobre $\mathbb{R}[x]$:


  $$P(x) = c_P \cdot \prod_{k} f_k(x)^{\alpha_k}, \quad Q(x) = c_Q \cdot \prod_{k}
  f_k(x)^{\beta_k}$$


  El **m.c.m. entre polinomios** es el polinomio mónico de menor grado $M(x)$ dado
  por:


  $$M(x) = \operatorname{lcm}(|c_P|, |c_Q|) \cdot \prod_{f_k \text{ en algún polinomio}}
  f_k(x)^{\max(\alpha_k, \beta_k)}$$


  **Desglose de la fórmula:**

  - $\operatorname{lcm}(|c_P|, |c_Q|)$: M.C.M. numérico de los coeficientes principales
  factorizados fuera de los paréntesis.

  - $f_k(x)$: Factores polinomiales irreductibles (por ejemplo $(x-a)$, $(x+b)$).

  - $\max(\alpha_k, \beta_k)$: Exponente máximo asignado a cada factor polinomial
  entre todos los polinomios.'
definiciones_clave: '- **m.c.m. de polinomios**: Polinomio de menor grado divisible
  por cada uno de los polinomios dados.

  - **Factores polinomiales no comunes**: Paréntesis que aparecen en la factorización
  de solo algunos polinomios y que deben incluirse en el m.c.m.'
propiedades_relaciones: '- **Mínimo Común Denominador Polinomial**: El m.c.m. de los
  denominadores polinomiales se usa como denominador común para sumar o restar fracciones
  algebraicas compuestas.

  - **Divisibilidad polinomial**: Cada polinomio original divide al m.c.m. polinomial
  sin dejar resto.'
ejemplo_guiado:
  enunciado: Calcula el m.c.m. entre los polinomios $P(x) = x^2 - 4$ y $Q(x) = x^2
    - 4x + 4$. Determina la expresión m.c.m. ($(x + 2)(x - 2)^2$) y evalúa su valor
    para $x = 5$.
  pasos:
  - 'Paso 1: Factorizar $P(x) = x^2 - 4 = (x + 2)(x - 2)$ mediante diferencia de cuadrados.'
  - 'Paso 2: Factorizar $Q(x) = x^2 - 4x + 4 = (x - 2)^2$ mediante cuadrado de binomio.'
  - 'Paso 3: Reunir todos los factores distintos: $(x + 2)$ y $(x - 2)$. Asignar a
    cada uno su mayor exponente: para $(x + 2)$ es $1$, para $(x - 2)$ es $2$. El
    m.c.m. es $(x + 2)(x - 2)^2$.'
  - 'Paso 4: Evaluar para $x = 5$: $(5 + 2) \cdot (5 - 2)^2 = 7 \cdot (3)^2 = 7 \cdot
    9 = 63$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el m.c.m. entre los polinomios $x^2 - 4$ y $x^2 - 4x + 4$?
  choices:
  - text: $(x + 2)(x - 2)^2$
    is_correct: true
  - text: $x - 2$
    is_correct: false
  - text: $(x + 2)(x - 2)$
    is_correct: false
  - text: $(x + 2)^2(x - 2)^2$
    is_correct: false
  explanation: La alternativa correcta es '$(x + 2)(x - 2)^2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar el m.c.m. $(x + 2)(x - 2)^2$ para $x = 5$, ¿cuál es el resultado
    numérico?
  choices:
  - text: $63$
    is_correct: true
  - text: $21$
    is_correct: false
  - text: $147$
    is_correct: false
  - text: $35$
    is_correct: false
  explanation: La alternativa correcta es '$63$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente cada uno de los polinomios dados.'
- 'Paso 2: Calcular el m.c.m. numérico de los coeficientes extraídos fuera de los
  paréntesis.'
- 'Paso 3: Hacer una lista con todos los paréntesis (factores polinomiales) distintos.'
- 'Paso 4: Elevar cada paréntesis al mayor exponente con el que aparezca en los polinomios
  factorizados y multiplicarlos.'
errores_correccion: '- **Error común:** Tomar el menor exponente en lugar del mayor
  al calcular el m.c.m. entre factores polinomiales repetidos como $(x-2)$ y $(x-2)^2$.

  - **Cómo corregirlo:** Recuerda que el m.c.m. debe poder ser dividido por $(x-2)^2$,
  por ende debe tener la mayor potencia disponible.'
ejemplos:
- titulo: 'Ejemplo 1: Polinomios con factor común monomio y binomio'
  enunciado: Calcula el m.c.m. entre $2x + 4$ y $x^2 - 4$.
  alternativas:
  - $2(x + 2)(x - 2)$
  - $x + 2$
  - $(x + 2)(x - 2)$
  respuesta: $2(x + 2)(x - 2)$
  solucion_pasos:
  - '1. Factorizar $2x + 4 = 2(x + 2)$.2. Factorizar $x^2 - 4 = (x + 2)(x - 2)$.3.
    Factores: número $2$, binomios $(x + 2)$ y $(x - 2)$.4. m.c.m. = $2(x + 2)(x -
    2)$.'
- titulo: 'Ejemplo 2: m.c.m. de trinomios factorizados'
  enunciado: Determina el m.c.m. de $x^2 + 3x + 2$ y $x^2 + 4x + 3$.
  alternativas:
  - $(x + 1)(x + 2)(x + 3)$
  - $x + 1$
  - $(x + 2)(x + 3)$
  respuesta: $(x + 1)(x + 2)(x + 3)$
  solucion_pasos:
  - '1. Factorizar $x^2 + 3x + 2 = (x + 1)(x + 2)$.2. Factorizar $x^2 + 4x + 3 = (x
    + 1)(x + 3)$.3. Factores distintos: $(x + 1)$, $(x + 2)$, $(x + 3)$, cada uno
    con exponente 1.4. m.c.m. = $(x + 1)(x + 2)(x + 3)$.'
- titulo: ¿El m.c.m. entre $x - 1$ y $x + 1$ es el producto $(x - 1)(x + 1) = x^2
    - 1$?
  respuesta: Sí
  solucion_pasos:
  - Sí. Al ser factores lineales irreductibles distintos, el m.c.m. es el producto
    de ambos.
- titulo: ¿Es necesario factorizar totalmente los polinomios antes de armar el m.c.m.?
  respuesta: Sí
  solucion_pasos:
  - Sí. Si los polinomios no están totalmente factorizados se corre el riesgo de no
    detectar factores comunes ocultos.
errores_frecuentes:
- El m.c.m. entre $x^2 - 9$ y $x + 3$ es $x + 3$.
- Para hallar el m.c.m. entre dos polinomios basta con multiplicar los términos independientes.
- El m.c.m. entre $(x + 1)^2$ y $(x + 1)^3$ es $(x + 1)^2$.
- Los factores que aparecen en un solo polinomio no se escriben en el m.c.m.
- El m.c.m. de $x^2 - 1$ y $x - 1$ es $(x - 1)^2(x + 1)$.
afirmaciones_verdaderas:
- El m.c.m. entre polinomios se obtiene reuniendo todos los factores irreductibles
  (comunes y no comunes) elevados a sus mayores exponentes.
- El m.c.m. polinomial es divisible exactamente por cada uno de los polinomios originales.
al_terminar_debes_poder: Al finalizar este recurso podrás calcular el m.c.m. entre
  polinomios mediante factorización completa e identificar los múltiplos comunes de
  menor grado.
