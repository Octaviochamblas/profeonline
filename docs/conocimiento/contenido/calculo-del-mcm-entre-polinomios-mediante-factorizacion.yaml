procedimiento:
- 'Paso 1: Factoriza completamente cada uno de los polinomios.'
- 'Paso 2: Haz una lista mental (o escrita) de todos los factores (paréntesis) distintos
  que veas.'
- 'Paso 3: Asígnale a cada paréntesis el exponente más alto que tenga en el grupo.'
- 'Paso 4: Multiplica todos estos paréntesis. Deja el resultado expresado (factorizado).'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en cálculo del m.c.m. entre polinomios mediante factorización.
ejemplos:
- titulo: Halla el MCM de $2x+4$ y $x^2-4$
  enunciado: Halla el MCM de $2x+4$ y $x^2-4$.
  solucion_pasos:
  - 'Factorizamos: $2x+4 = 2(x+2)$.'
  - 'Factorizamos: $x^2-4 = (x+2)(x-2)$.'
  - 'Lista de factores distintos: el número ''2'', el paréntesis $(x+2)$ y el paréntesis
    $(x-2)$.'
  - Mayor exponente de cada uno es 1.
  - 'MCM: $2(x+2)(x-2)$.'
- titulo: MCM entre $(x-1)^3$ y $(x-1)(x+5)$.
  solucion_pasos:
  - 'Factores: (x-1) y (x+5). Mayor de (x-1) es 3. Mayor de (x+5) es 1.'
- titulo: 'Respecto de «Cálculo del m.c.m. entre polinomios mediante factorización»:
    ¿Describe adecuada'
  enunciado: 'Respecto de «Cálculo del m.c.m. entre polinomios mediante factorización»:
    ¿Describe adecuadamente el concepto esta frase? «Para hallar el MCM de varios
    polinomios, primero se factorizan completamente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para hallar el MCM de varios
    polinomios, primero se factorizan completamente.'
- titulo: 'Respecto de «Cálculo del m.c.m. entre polinomios mediante factorización»:
    ¿Se puede aceptar'
  enunciado: 'Respecto de «Cálculo del m.c.m. entre polinomios mediante factorización»:
    ¿Se puede aceptar esta afirmación? «Confundir la regla del MCD y tomar solo los
    factores comunes (lo que arruina el MCM)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para hallar el MCM de varios
    polinomios, primero se factorizan completamente.'
errores_frecuentes:
- Confundir la regla del MCD y tomar solo los factores comunes (lo que arruina el
  MCM).
- Si hay factores numéricos externos (ej. un 3 y un 6), olvidarse de sacar el MCM
  numérico de esos números (que sería 6).
- Para «Al buscar el MCM de polinomios factorizados, ¿qué factores se deben incluir»,
  la respuesta correcta es Solo los factores comunes al menor exponente.
- Para «Al buscar el MCM de polinomios factorizados, ¿qué factores se deben incluir»,
  la respuesta correcta es Solo los factores no comunes.
- Las raíces sin repetir.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando cálculo
  del m.c.m. entre polinomios mediante factorización.
