semantic_id: MAT.ALG.RELACION_EXP_LOG.COMPOSICION_LOG_EXP
resumen_inicial: 'La composición de la potencia con el logaritmo de su misma base cancela la operación logarítmica recuperando el argumento original: $b^{\log_b(x)} = x$.'
explicacion_simple: |
  Si elevamos una base $b$ a una potencia cuyo exponente es un logaritmo de esa misma base, como $2^{\log_2(x)}$, la potencia y el logaritmo se eliminan mutuamente. Es la operación inversa dual: elevar a la base $b$ deshace el logaritmo en base $b$, liberando directamente el número o la variable del argumento $x$. Esta regla requiere obligatoriamente que $x$ sea un número positivo ($x > 0$).
explicacion_formal: |
  ### Definición formal
  Para una base $b \in \mathbb{R}^+ \setminus \{1\}$, la **propiedad de composición cancelatoria a derecha** de la función exponencial $f(x) = b^x$ sobre la función logarítmica $g(x) = \log_b(x)$ establece la identidad funcional:
  $$(f \circ g)(x) = f(g(x)) = b^{\log_b(x)} = x, \quad \forall x \in \mathbb{R}^+ = ]0, +\infty[$$

  ### Desglose simbólico
  - Campo de validez restringido: Válido exclusivamente para **argumentos estrictamente positivos $x > 0$**, dado que la función interna $\log_b(x)$ exige $x \in \operatorname{Dom}(g) = ]0, +\infty[$.
  - Casos particulares canónicos:
    - Base decimal: $10^{\log_{10}(x)} = 10^{\log(x)} = x, \quad \forall x > 0$.
    - Base natural: $e^{\log_e(x)} = e^{\ln(x)} = x, \quad \forall x > 0$.
  - Aplicación en resolución de ecuaciones: Aplicar la base $b$ a ambos miembros de la ecuación $\log_b(P(x)) = K \implies b^{\log_b(P(x))} = b^K \implies P(x) = b^K$.

  ### Síntesis didáctica
  Procedimiento de "exponenciación de una ecuación": Para eliminar la palabra logaritmo $\log_b$ de un miembro aislado, se eleva la base $b$ a ambos lados de la igualdad, cancelando el operador logarítmico.
definiciones_clave: |
  - **Composición $(f \circ g)(x) = b^{\log_b(x)}$**: Evaluación de la función exponencial en la salida de la función logarítmica.
  - **Cancelación por exponenciación**: Proceso de elevar a la base $b$ para anular el logaritmo $\log_b$.
  - **Restricción de positividad $x > 0$**: Requisito indispensable dictado por el dominio del logaritmo interno.
propiedades_relaciones: |
  - **Dualidad con $\log_b(b^x) = x$**: Mientras que $\log_b(b^x) = x$ se define en todo $\mathbb{R}$, $b^{\log_b(x)} = x$ requiere estrictamente $x > 0$.
  - **Simplificación de coeficientes interiores**: Expresiones del tipo $b^{k \log_b(x)}$ deben reestructurarse primero como $b^{\log_b(x^k)} = x^k$.
ejemplo_guiado:
  enunciado: 'Aplica la propiedad de composición $b^{\log_b(x)} = x$ para simplificar las siguientes expresiones y resolver la incógnita: A) $3^{\log_3(15)}$, B) $e^{\ln(x^2 + 4)}$, C) Despeja $x$ en $\ln(x) = 5$.'
  pasos:
    - 'Paso 1: Para $3^{\log_3(15)}$, la base $3$ y el logaritmo $\log_3$ se cancelan por composición, resultando $15$.'
    - 'Paso 2: Para $e^{\ln(x^2 + 4)}$, la base $e$ y el logaritmo natural $\ln$ se cancelan por composición, resultando $x^2 + 4$ (pues $x^2 + 4 > 0$).'
    - 'Paso 3: Para despejar $x$ en $\ln(x) = 5$, exponenciamos en base $e$ ambos miembros: $e^{\ln(x)} = e^5$.'
    - 'Paso 4: Por composición $e^{\ln(x)} = x$, obteniendo directamente $x = e^5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el resultado numérico exacto de evaluar la expresión compuesta $10^{\log(45)}$?'
    choices:
      - {text: '$45$, porque la base 10 de la potencia y el logaritmo decimal se cancelan mutuamente por composición', is_correct: true}
      - {text: '$450$, multiplicando $10 \cdot 45 = 450$', is_correct: false}
      - {text: '$10$, conservando la base decimal', is_correct: false}
      - {text: '$1$, porque todo número elevado a logaritmo da 1', is_correct: false}
    explanation: 'La alternativa correcta es ''$45$, porque la base 10 de la potencia y el logaritmo decimal se cancelan mutuamente por composición''. La propiedad $b^{\log_b(x)} = x$ entrega directamente el argumento 45.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al simplificar la expresión $e^{2 \ln(x)}$ para $x > 0$, ¿qué resultado algebraico se obtiene?'
    choices:
      - {text: '$x^2$, reingresando el coeficiente 2 como exponente $e^{\ln(x^2)} = x^2$', is_correct: true}
      - {text: '$2x$, multiplicando por el coeficiente 2', is_correct: false}
      - {text: '$e^{2x}$, multiplicando los exponentes', is_correct: false}
      - {text: '$x + 2$, sumando los valores', is_correct: false}
    explanation: 'La alternativa correcta es ''$x^2$, reingresando el coeficiente 2 como exponente $e^{\ln(x^2)} = x^2$''. Antes de cancelar la base $e$ y $\ln$, el coeficiente 2 debe subirse como exponente del argumento.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Verificar que la base de la potencia coincida con la base del logaritmo ubicado en su exponente ($b^{\log_b}$).'
  - 'Paso 2: Si el logaritmo en el exponente tiene un coeficiente $k \cdot \log_b(x)$, reingresarlo primero como exponente del argumento: $\log_b(x^k)$.'
  - 'Paso 3: Aplicar la cancelación de la base $b$ con el operador $\log_b$.'
  - 'Paso 4: Escribir el argumento simplificado asegurando que sea positivo.'
errores_correccion: |
  - **Error 1:** Cancelar la base $b$ cuando el logaritmo tiene un coeficiente por delante (ej: en $e^{3\ln(x)}$ escribir $3x$). **Cómo corregirlo:** Se debe reingresar primero el coeficiente dentro del argumento: $e^{\ln(x^3)} = x^3$. La cancelación directa exige que el coeficiente del logaritmo sea exactamente 1.
  - **Error 2:** Aplicar la identidad a un argumento negativo o nulo. **Cómo corregirlo:** La expresión $b^{\log_b(x)} = x$ presupone $x > 0$. Para $x \le 0$, el logaritmo interno $\log_b(x)$ no existe en $\mathbb{R}$.
ejemplos:
  - titulo: 'Cancelación exponencial básica'
    enunciado: '¿A qué equivale $2^{\log_2(9)}$?'
    alternativas:
      - '$9$'
      - '$18$'
      - '$2$'
    respuesta: '$9$'
    solucion_pasos:
      - '1. La base 2 y el logaritmo en base 2 son coincidentes.'
      - '2. Por composición dual: $2^{\log_2(9)} = 9$.'
  - titulo: 'Cancelación con base e y coeficiente'
    enunciado: '¿La expresión $e^{-\ln(x)}$ es equivalente a $\frac{1}{x}$ para $x > 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Pasamos $-1$ al exponente del argumento: $e^{\ln(x^{-1})} = x^{-1} = \frac{1}{x}$.'
  - titulo: 'Despeje por exponenciación'
    enunciado: 'Para resolver $\log_3(x) = 4$, ¿exponenciar en base 3 entrega $3^{\log_3(x)} = 3^4 \implies x = 81$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Elevar 3 a ambos lados cancela el logaritmo entregando $x = 3^4 = 81$.'
  - titulo: 'Cancelación en base decimal'
    enunciado: '¿La simplificación de $10^{\log(x^3 + 2)}$ es igual a $x^3 + 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dado que es base 10, $10^{\log_{10}(x^3 + 2)} = x^3 + 2$.'
errores_frecuentes:
  - 'La expresión $b^{\log_b(x)}$ es igual a $b$ para todo $x$.'
  - 'En la expresión $e^{2\ln(x)}$, se cancelan inmediatamente la base $e$ y el $\ln$ obteniendo $2x$.'
  - 'La propiedad de composición $b^{\log_b(x)} = x$ es válida para números negativos $x < 0$.'
  - 'Elevar $10$ a la potencia $\log(x)$ es igual a multiplicar $10 \cdot \log(x)$.'
  - 'La expresión $2^{\log_3(x)}$ se simplifica como $x$ cancelando los números 2 y 3.'
afirmaciones_verdaderas:
  - 'La propiedad de composición $b^{\log_b(x)} = x$ cancela la función logarítmica mediante la potencia de su misma base para todo argumento positivo $x > 0$.'
  - 'Para aplicar la cancelación en $b^{k \log_b(x)}$, es obligatorio reingresar primero el coeficiente $k$ como exponente del argumento obteniendo $x^k$.'
al_terminar_debes_poder: 'Aplicar la composición $b^{\log_b(x)} = x$ para simplificar expresiones exponenciales compuestas y despejar logaritmos.'
