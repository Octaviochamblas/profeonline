semantic_id: MAT.ALG.RELACION_EXP_LOG.COMPOSICION_LOG_EXP
resumen_inicial: 'Aplicación de la composición b^(log_b x) para recuperar x: conceptos,
  asíntotas, propiedades e inversidad en Relación de funciones inversas.'
explicacion_simple: 'Igual que en el caso anterior, pero en orden inverso: ahora el
  logaritmo es quien "deshace" la potencia de su misma base.'
explicacion_formal: '### Definición formal


  Si $f(x)=\log_b(x)$ y $g(x)=b^x$ son funciones inversas, entonces $f(g(x))=x$ para
  todo $x\in\mathbb{R}$. Esto se escribe como $\log_b(b^x)=x$, válido para cualquier
  $x$ real, incluso negativo o fraccionario.


  ### Desarrollo didáctico


  $\log_4(4^6)=6$: el exponente $6$ ya representa la potencia a la que está elevado
  $4$, así que el logaritmo simplemente recupera ese valor. Lo mismo ocurre con $\log_2(2^{-3})=-3$.'
definiciones_clave: '- **Aplicación de la composición b^(log_b x) para recuperar x**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a aplicación de la composición b^(log_b x) para recuperar x.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de aplicación
    de la composición b^(log_b x) para recuperar x.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de aplicación de la composición
    b^(log_b x) para recuperar x.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    aplicación de la composición b^(log_b x) para recuperar x?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en relación de funciones
      inversas
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en relación de funciones inversas. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en aplicación de la composición b^(log_b x) para recuperar x?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la base del logaritmo y la base de la potencia sean iguales.'
- 'Paso 2: Si coinciden, el resultado es directamente el exponente de la potencia.'
- 'Paso 3: Si no coinciden, no se puede aplicar esta simplificación directa.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en aplicación
  de la composición b^(log_b x) para recuperar x.
ejemplos:
- titulo: Aplicación directa con bases iguales
  enunciado: Simplifica $\log_7(7^9)$.
  solucion_pasos:
  - Se verifica que ambas bases coinciden ($7$).
  - 'El resultado es directamente el exponente: $9$.'
- titulo: Aplicación en una expresión algebraica
  enunciado: Simplifica $\log_3(3^{2x+1})$.
  solucion_pasos:
  - Se verifica que ambas bases coinciden ($3$).
  - 'El resultado es directamente el exponente: $2x+1$.'
- titulo: ¿Se cumple $\log_b(b^x)=x$ para cualquier $x$ real, incluso negativo?
  enunciado: ¿La propiedad $\log_b(b^x)=x$ es válida cuando $x$ es un número negativo?
  respuesta: Sí
  solucion_pasos:
  - A diferencia del dominio de $\log_b$, el exponente $x$ puede tomar cualquier valor
    real.
- titulo: ¿Esta propiedad es la misma que $b^{\log_b(x)}=x$?
  enunciado: ¿$\log_b(b^x)=x$ y $b^{\log_b(x)}=x$ son exactamente la misma propiedad?
  respuesta: 'No'
  solucion_pasos:
  - Son dos composiciones distintas de las mismas funciones inversas, aplicadas en
    orden diferente.
errores_frecuentes:
- Declarar $\log_b(b^x)=x$ con $b^{\log_b(x)}=x$, invirtiendo el orden de composición.
- Aplicar la propiedad cuando las bases del logaritmo y de la potencia no coinciden.
- Afirmar que el dominio de esta composición se restringe igual que el del logaritmo
  puro.
- No verificar que la base cumpla $b>0$, $b\neq1$ antes de simplificar.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando aplicación de la composición b^(log_b x) para recuperar x.
