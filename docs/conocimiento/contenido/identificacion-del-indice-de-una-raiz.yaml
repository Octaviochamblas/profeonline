semantic_id: MAT.NUM.RAICES_CONCEPTO.INDICE_IDENTIFICACION
resumen_inicial: El índice de una raíz es el número ubicado en el gancho del radical
  que especifica la cantidad de veces que debe multiplicarse la respuesta.
explicacion_simple: 'El índice es el número pequeño en el símbolo del radical:

  - En $\sqrt[3]{64}$, el índice es $3$.

  - En $\sqrt[5]{x}$, el índice es $5$.

  - En la **raíz cuadrada** ($\sqrt{9}$), el índice $2$ **no se escribe** por convención.'
explicacion_formal: En la notación $\sqrt[n]{a}$, $n \in \mathbb{N}, n \ge 2$ recibe
  el nombre de índice. Si no se escribe índice de forma explícita ($\sqrt{a}$), por
  convención internacional se asume $n = 2$.
definiciones_clave: '- **Índice ($n$)**: Grado de la raíz. Indica la potencia a la
  que debe elevarse el resultado.'
propiedades_relaciones: '- **Índice 2 por omisión**: $\sqrt{a} = \sqrt[2]{a}$.'
ejemplo_guiado:
  enunciado: 'Indica el índice de cada una de las raíces: A) $\sqrt[4]{16}$ y B) $\sqrt{49}$.'
  pasos:
  - 'Para A: $\sqrt[4]{16}$, el superíndice sobre el radical es $4$, luego el índice
    es $4$.'
  - 'Para B: $\sqrt{49}$, no hay número en el radical, luego por convención el índice
    es $2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el índice de la raíz en la expresión $\sqrt{100}$?
  choices:
  - text: '2'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '100'
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: 'La correcta es: 2. Por convención, una raíz sin índice escrito es
    una raíz cuadrada (índice 2).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el índice en $\sqrt[7]{x+1}$?
  choices:
  - text: '7'
    is_correct: true
  - text: x+1
    is_correct: false
  - text: '1'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: 'La correcta es: 7. El número 7 ubicado sobre el gancho del radical
    es el índice.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Mirar la parte superior izquierda del símbolo radical $\sqrt{}$.'
- 'Paso 2: Si hay un número $n$, ese es el índice.'
- 'Paso 3: Si no hay ningún número, el índice es 2.'
errores_correccion: No pienses que si no hay número escrito el índice es 1. ¡No existen
  las raíces de índice 1! El índice por omisión es **2**.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el índice en $\sqrt[3]{27}$?
  alternativas:
  - '3'
  - '27'
  - '2'
  respuesta: '3'
  solucion_pasos:
  - El índice escrito es 3.
errores_frecuentes:
- Asumir que si no hay índice escrito vale 1 en lugar de 2.
afirmaciones_verdaderas:
- $\sqrt{x} = \sqrt[2]{x}$.
al_terminar_debes_poder: Identificar el índice explícito e implícito en cualquier
  raíz.
fuente: Texto escolar MINEDUC.
estado: publicado
