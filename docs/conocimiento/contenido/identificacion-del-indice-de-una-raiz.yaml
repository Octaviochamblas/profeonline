procedimiento:
- 'Paso 1: Observar el ángulo o gancho del símbolo radical $\sqrt{}$.'
- 'Paso 2: Si contiene un número entero $n$, ese número es el índice.'
- 'Paso 3: Si el gancho está vacío, el índice es $n = 2$.'
errores_correccion: '- **Error 1: Asumir índice 1 o 0 cuando no hay número escrito.** **Cómo corregirlo:** La raíz cuadrada $\sqrt{x}$ tiene índice $2$.

  - **Error 2: Confundir un coeficiente multiplicativo grande con el índice ($3\sqrt{x}$ vs $\sqrt[3]{x}$).** **Cómo corregirlo:** El índice es de menor tamaño tipográfico y se ubica estrictamente dentro del gancho.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el índice de $\sqrt[4]{16}$?
  alternativas:
  - $4$
  - $16$
  - $2$
  respuesta: $4$
  solucion_pasos:
  - El número en el gancho es 4 $\implies n = 4$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el índice de $\sqrt{49}$?
  alternativas:
  - $2$
  - $1$
  - $49$
  respuesta: $2$
  solucion_pasos:
  - Por convenio, $\sqrt{x}$ tiene índice $n = 2$.
- titulo: ¿Es el índice de ∛64 igual a 3?
  respuesta: Sí
  solucion_pasos:
  - Sí, el número 3 está en el gancho radical $\implies n = 3$.
  alternativas:
  - texto: Sí, el índice es 3
    es_correcta: true
    retroalimentacion: ¡Correcto! Es una raíz cúbica.
  - texto: No, es 64
    es_correcta: false
    retroalimentacion: Incorrecto, 64 es el radicando.
  - texto: No, es 4
    es_correcta: false
    retroalimentacion: Incorrecto, 4 es la raíz (resultado).
- titulo: ¿Es 5√x lo mismo que ⁵√x?
  respuesta: 'No'
  solucion_pasos:
  - No, $5\sqrt{x} = 5 \cdot \sqrt[2]{x}$ (multiplica por 5) mientras que $\sqrt[5]{x} = x^{1/5}$ (raíz quinta).
  alternativas:
  - texto: No, 5√x es 5 por raíz cuadrada y ⁵√x es raíz quinta
    es_correcta: true
    retroalimentacion: ¡Correcto! Uno es factor externo y el otro es el grado de la raíz.
  - texto: Sí, representan la misma operación
    es_correcta: false
    retroalimentacion: Incorrecto, los órdenes de magnitud y resultados son distintos.
  - texto: Sí, solo cambia el tamaño de la letra
    es_correcta: false
    retroalimentacion: Incorrecto, matemáticamente son operadores diferentes.
errores_frecuentes:
- Creer que $\sqrt{x}$ tiene índice 1.
- Confundir coeficientes que multiplican a la raíz con el índice.
- Olvidar que el índice define el denominador del exponente fraccionario.
- Tratar el índice como una potencia del radicando.
- Confundir la lectura de raíces de orden superior ($\sqrt[4]{x}, \sqrt[5]{x}$).
afirmaciones_verdaderas:
- El índice de una raíz es siempre un número natural mayor o igual a dos.
- La ausencia de índice escrito denota obligatoriamente una raíz cuadrada ($n = 2$).
- El índice radical determina la cantidad de soluciones complejas y las reglas de paridad en $\mathbb{R}$.
al_terminar_debes_poder: '![Síntesis de identificación del índice](/static/img/nodos/identificacion-del-indice-de-una-raiz-resumen.svg)


  QUÉ: Identificar y diferenciar con precisión el índice de cualquier expresión radical.


  CÓMO: Localizando la posición del número en el gancho radical $\sqrt[n]{a}$, aplicando el convenio $n = 2$ en caso de ausencia y distinguiéndolo de coeficientes multiplicativos externos.'
