semantic_id: MAT.NUM.RAICES_CONCEPTO.INDICE_IDENTIFICACION
resumen_inicial: El índice de una raíz es el número entero $n \ge 2$ ubicado en la
  apertura del símbolo radical que indica la orden o grado de la raíz.
explicacion_simple: El índice es el número pequeñito que está parado sobre el gancho
  de la raíz. Nos dice cuántas veces hay que multiplicar la respuesta por sí misma.
  Si no hay ningún número escrito sobre el gancho, el índice es implícitamente un
  2 (raíz cuadrada).
explicacion_formal: 'En la expresión $\sqrt[n]{a}$, el **Índice $n$** se define como
  el grado ordinal de la radicación:


  $$n \in \mathbb{N}, \quad n \ge 2$$


  **Convención de omitting el 2:**

  - Raíz cuadrada: $\sqrt{a} \equiv \sqrt[2]{a}$ (el índice $2$ no se escribe explícitamente).

  - Índice explícito para $n \ge 3$: $\sqrt[3]{a}, \sqrt[4]{a}, \dots$'
definiciones_clave: '- **Índice de una raíz**: Número entero $n \ge 2$ que determina
  el grado de la operación radical.'
propiedades_relaciones: '- **Ubicación en el radical**: Se posiciona en la apertura
  o v del símbolo $\sqrt[n]{}$.'
ejemplo_guiado:
  enunciado: Identifique el índice en las expresiones $\sqrt[3]{64}$, $\sqrt{49}$
    y $\sqrt[5]{x}$.
  pasos:
  - 'Paso 1: En $\sqrt[3]{64}$, el número pequeño en la abertura es $3 \implies$ índice
    $3$.'
  - 'Paso 2: En $\sqrt{49}$, no hay número explícito en la abertura $\implies$ índice
    implícito $2$.'
  - 'Paso 3: En $\sqrt[5]{x}$, el número pequeño es $5 \implies$ índice $5$.'
  - 'Conclusión: Los índices son $3$, $2$ e $5$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el índice implícito de una raíz cuadrada sqrt(a) cuando no lleva
    número escrito?
  choices:
  - text: El índice es implícitamente el número 2
    is_correct: true
  - text: El índice es el número 1
    is_correct: false
  - text: El índice es cero
    is_correct: false
  - text: No tiene índice
    is_correct: false
  explanation: La alternativa correcta es 'El índice es implícitamente el número 2'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt[3]{64}, ¿cuál es el índice?
  choices:
  - text: El índice es 3
    is_correct: true
  - text: El índice es 64
    is_correct: false
  - text: El índice es 4
    is_correct: false
  - text: El índice es 2
    is_correct: false
  explanation: La alternativa correcta es 'El índice es 3'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar la abertura superior izquierda del símbolo radical.'
- 'Paso 2: Si hay un número entero $n$, ese es el índice de la raíz.'
- 'Paso 3: Si la raíz no tiene número en la abertura, asignar como índice el número
  $2$.'
errores_correccion: '- **Error 1: Creer que una raíz sin número escrito tiene índice
  1 ($\sqrt{x} = \sqrt[1]{x}$).** **Cómo corregirlo:** La raíz cuadrada no escrita
  tiene SIEMPRE índice $2$ ($\sqrt{x} = \sqrt[2]{x}$).


  - **Error 2: Confundir el índice con un coeficiente que multiplica a la raíz.**
  **Cómo corregirlo:** $3\sqrt{x}$ multiplica a la raíz por 3, mientras $\sqrt[3]{x}$
  es la raíz cúbica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el índice en $\sqrt[4]{81}$?
  alternativas:
  - '4'
  - '81'
  - '3'
  respuesta: '4'
  solucion_pasos:
  - El índice es el número $4$ en la abertura del radical.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el índice en $\sqrt{100}$?
  alternativas:
  - '2'
  - '1'
  - '10'
  respuesta: '2'
  solucion_pasos:
  - La raíz cuadrada sin número explícito tiene índice $2$.
- titulo: ¿Es el índice de sqrt[5]{a} igual al número 5?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5$ es el superíndice radical.
- titulo: ¿Puede el índice de una raíz ser menor que 2?
  respuesta: 'No'
  solucion_pasos:
  - No, el dominio del índice es $n \in \mathbb{N}, n \ge 2$.
errores_frecuentes:
- Una raíz cuadrada sin número visible en el símbolo posee un índice igual a 1.
- El número grande ubicado dentro del símbolo radical representa el índice de la raíz.
- Multiplicar una raíz por el entero 3 es notacionalmente idéntico a una raíz cúbica.
- El índice de una raíz admite valores enteros negativos en el conjunto real.
- Las raíces de índice par no poseen número de índice explícito en ningún caso.
afirmaciones_verdaderas:
- El índice es el número entero $n \ge 2$ que señala el grado de la raíz.
- Por convención, el índice 2 de la raíz cuadrada no se escribe explícitamente ($\sqrt{a}
  = \sqrt[2]{a}$).
al_terminar_debes_poder: Al terminar serás capaz de identificar el índice de cualquier
  raíz $\sqrt[n]{a}$, reconociendo la convención implícita del índice 2 en las raíces
  cuadradas.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
