semantic_id: MAT.NUM.RAICES_CONCEPTO.INDICE_IDENTIFICACION
resumen_inicial: El índice de una raíz es el número natural $n \ge 2$ ubicado en la apertura del radical $\sqrt[n]{a}$; si no hay número explícito, el índice es por convenio $n = 2$.
explicacion_simple: '![Identificación del índice de una raíz](/static/img/nodos/identificacion-del-indice-de-una-raiz-intro.svg)


  El **índice** es el número pequeño que se ubica en el ángulo o ''gancho'' del símbolo radical ($\sqrt[n]{a}$). Indica el grado de la raíz (cuántas veces debe multiplicarse la base por sí misma para obtener el radicando). **Regla universal:** Si ves una raíz sin ningún número en el gancho (como $\sqrt{25}$), el índice es automáticamente **$2$** (raíz cuadrada). ¡Nunca asumas que es $1$ ni $0$!'
explicacion_formal: "En la notación matemática estándar de un radical $\\sqrt[n]{a}$, el parámetro $n$ recibe el nombre de **Índice Radical**.\n\n**Propiedades formales del índice:**\n1. **Dominio del índice:** $n \\in \\mathbb{N}$ con $n \\ge 2$ ($n \\in \\{2, 3, 4, 5, \\dots\\}$).\n2. **Convenio de omisión:** Cuando $n = 2$, el símbolo se escribe $\\sqrt{a}$ por economía tipográfica (raíz cuadrada).\n3. **Distinción con coeficientes multiplicativos:**\n   - En $k\\sqrt[n]{a}$, $k$ es un coeficiente escalar que multiplica a la raíz ($k \\cdot \\sqrt[n]{a}$).\n   - En $\\sqrt[n]{a}$, $n$ es el operador de grado que determina la potencia fraccionaria $a^{1/n}$."
definiciones_clave: '- **Índice ($n$)**: Grado del radical, natural $\ge 2$.

  - **Convenio de raíz cuadrada**: $\sqrt{x} \equiv \sqrt[2]{x}$.

  - **Coeficiente externo ($k$)**: Factor multiplicativo que antecede al radical.'
propiedades_relaciones: '- **Exponente fraccionario**: El índice $n$ es el denominador del exponente fraccionario: $\sqrt[n]{a} = a^{1/n}$.

  - **No existencia de $n=1$**: No existe operador radical de índice $1$ (sería la función identidad $x^1 = x$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de identificación del índice](/static/img/nodos/identificacion-del-indice-de-una-raiz-ejemplos.svg)


    Identifique el índice y el coeficiente externo en las expresiones $\sqrt{25}$, $\sqrt[5]{32}$ y $4\sqrt[3]{x}$.'
  pasos:
  - 'Paso 1: Analizar $\sqrt{25}$: No hay número en el gancho $\implies$ Índice $n = 2$. Coeficiente $= 1$.'
  - 'Paso 2: Analizar $\sqrt[5]{32}$: Hay un $5$ en el gancho $\implies$ Índice $n = 5$. Coeficiente $= 1$.'
  - 'Paso 3: Analizar $4\sqrt[3]{x}$: El $4$ antecede al símbolo (coeficiente $= 4$) y el $3$ está en el gancho $\implies$ Índice $n = 3$.'
  - 'Conclusión: Los índices son $2$, $5$ y $3$ respectivamente.'
