semantic_id: MAT.ALG.ECUACIONES_LITERALES.DEFINICION
resumen_inicial: Una ecuación literal es aquella que utiliza letras para representar tanto la incógnita principal como las
  constantes o parámetros.
explicacion_simple: 'En una ecuación numérica convencional, las constantes son números explícitos (por ejemplo $3x - 5 = 7$).


  En una **ecuación literal**, algunas o todas las constantes conocidas están representadas por letras simbólicas (como $a
  x + b = c$).


  Es esencial discriminar entre la letra que representa la incógnita (la variable a despejar) y las letras que representan
  parámetros (constantes numéricas no especificadas).


  ![Definición de ecuación literal](/static/img/nodos/definicion-de-ecuacion-literal-intro.svg)

  '
explicacion_formal: '### Definición formal

  Una **ecuación literal de primer grado** es una proposición abierta cuya forma canónica es:


  $$a x + b = c \quad \text{donde } x \text{ es la incógnita y } a, b, c \text{ son parámetros reales con } a \neq 0$$


  ### Desglose de la fórmula

  - $x$: Variable principal o incógnita que se desea despejar.

  - $a, b, c$: Parámetros o constantes simbólicas que representan valores reales fijos en el contexto de la ecuación.


  ### Síntesis didáctica

  La solución de una ecuación literal se expresa mediante una fórmula algebraica paramétrica en lugar de una cantidad numérica
  absoluta.

  '
definiciones_clave: '- **Ecuación literal**: Ecuación donde los coeficientes numéricos o constantes independientes están simbolizados
  por letras.

  - **Parámetro**: Símbolo literal que representa una constante conocida fija en una fórmula o ecuación.

  '
propiedades_relaciones: '- **Resultado paramétrico**: La solución final $x = \frac{c - b}{a}$ expresa la incógnita como función
  de los parámetros $a, b, c$.

  - **Restricción de coeficiente no nulo**: Trasponer el parámetro divisor $a$ exige explícitamente la condición de existencia
  $a \neq 0$.

  '
ejemplo_guiado:
  enunciado: Dada la ecuación literal $a x - b = c$, identifica la incógnita $x$ y los parámetros, y halla la expresión paramétrica
    que representa a $x$.
  pasos:
  - 'Paso 1: Identificar la incógnita principal a despejar ($x$) y los parámetros constantes ($a, b, c$ con $a \neq 0$).'
  - 'Paso 2: Trasponer el parámetro $-b$ sumando al segundo miembro: $a x = c + b$.'
  - 'Paso 3: Trasponer el parámetro coeficiente $a$ dividiendo al segundo miembro: $x = \frac{c + b}{a}$.'
  - 'Paso 4: Concluir que la solución paramétrica de la ecuación es $x = \frac{c + b}{a}$.'
  imagen: /static/img/nodos/definicion-de-ecuacion-literal-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué propiedad estructural caracteriza a una ecuación literal?
  choices:
  - text: Que los coeficientes numéricos o términos independientes están representados por letras llamadas parámetros.
    is_correct: true
  - text: Que carece por completo de variable o incógnita a despejar.
    is_correct: false
  - text: Que se resuelve únicamente mediante estimaciones o construcciones geométricas.
    is_correct: false
  - text: Que solo puede aplicarse a ecuaciones polinomiales de grado superior.
    is_correct: false
  explanation: La alternativa correcta es 'Que los coeficientes numéricos o términos independientes están representados por
    letras llamadas parámetros.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la ecuación literal $a x - b = c$ con $a \neq 0$, ¿cuál es la expresión solución obtenida para $x$?
  choices:
  - text: $x = \frac{c + b}{a}$
    is_correct: true
  - text: $x = \frac{c - b}{a}$
    is_correct: false
  - text: $x = a(c + b)$
    is_correct: false
  - text: $x = c + b - a$
    is_correct: false
  explanation: La alternativa correcta es '$x = \frac{c + b}{a}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar de forma explícita cuál letra representa la incógnita a despejar.'
- 'Paso 2: Tratar las demás letras (parámetros) respetando las propiedades algebraicas aplicables a números reales.'
- 'Paso 3: Trasponer los términos independientes de la incógnita hacia el segundo miembro.'
- 'Paso 4: Dividir entre el parámetro que multiplica a la incógnita declarando la restricción de no-nulidad.'
errores_correccion: '- **Error 1:** Confundir los parámetros con la incógnita principal e intentar despejar la letra equivocada.
  **Cómo corregirlo:** Identificar **EN EL ENUNCIADO LA VARIABLE PRINCIPAL A DESPEJAR Y CONSIDERAR A LAS DEMÁS LETRAS COMO
  PARÁMETROS CONSTANTES**.

  - **Error 2:** Tratar los parámetros como variables cambiantes al momento de simplificar expresiones. **Cómo corregirlo:**
  Los parámetros **ACTÚAN COMO VALORES NUMÉRICOS FIJOS Y OBEDECEN LAS REGLAS TRADICIONALES DE LA ARITMÉTICA Y EL ÁLGEBRA**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: En la ecuación $m x + n = p$, ¿cuál es la solución para la incógnita $x$?
  alternativas:
  - $x = \frac{p - n}{m}$
  - $x = \frac{p + n}{m}$
  - $x = m(p - n)$
  respuesta: $x = \frac{p - n}{m}$
  solucion_pasos:
  - '1. Trasponer $+n$: $m x = p - n$.'
  - '2. Despejar $m \neq 0$: $x = \frac{p - n}{m}$.'
- titulo: Ejemplo 2
  enunciado: En la ecuación literal $a x = b$, ¿qué condición sobre $a$ permite el despeje $x = \frac{b}{a}$?
  alternativas:
  - $a \neq 0$
  - $a > b$
  - $a = 1$
  respuesta: $a \neq 0$
  solucion_pasos:
  - 1. Para dividir por $a$, este parámetro debe ser distinto de cero.
  - '2. Condición: $a \neq 0$.'
- titulo: Reglas de transposición
  enunciado: ¿Las reglas de transposición de términos para parámetros son idénticas a las de los coeficientes numéricos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los parámetros representan números reales.
- titulo: Restricción de divisores
  enunciado: ¿Dividir entre un parámetro exige declarar explícitamente que dicho parámetro es no nulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar divisiones entre cero.
errores_frecuentes:
- Confundir las letras que representan parámetros con la incógnita principal a despejar.
- Tratar los parámetros constantes como variables independientes que alteran las propiedades del despeje.
- Al despejar la incógnita en $m x + n = p$, trasponer el término $+n$ multiplicando al segundo miembro en lugar de restando.
- Omitir la declaración obligatoria de no-nulidad ($a \neq 0$) al trasponer un parámetro que pasa dividiendo.
- Asumir erróneamente que la solución final de una ecuación literal debe ser un número entero escalar sin letras.
afirmaciones_verdaderas:
- Una ecuación literal expresa la incógnita en función de constantes simbólicas o parámetros.
- Si la incógnita figura en múltiples términos, debe agruparse y factorizarse para realizar su despeje.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/definicion-de-ecuacion-literal-resumen.svg)


  QUÉ: Definir e identificar ecuaciones literales de primer grado.

  CÓMO: Distinguir la incógnita principal de los parámetros constantes ($a x + b = c$), aplicar las reglas de transposición
  algebraica y expresar la solución en función de los parámetros ($x = \frac{c - b}{a}$) declarando la restricción $a \neq
  0$.

  '
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / Ecuaciones Literales.
