semantic_id: MAT.ALG.ECUACIONES_LITERALES.DEFINICION
resumen_inicial: Una ecuación literal es aquella que contiene letras para representar
  tanto la incógnita como las constantes o parámetros.
explicacion_simple: 'En una ecuación numérico ordinaria, los números son constantes
  conocidas (como $3x - 5 = 7$).

  En una **ecuación literal**, algunas o todas las constantes conocidas están representadas
  por letras (como $a x + b = c$).

  Es crucial diferenciar entre la letra que representa la incógnita (la variable a
  despejar) y las letras que representan parámetros (valores conocidos).'
explicacion_formal: 'Una **ecuación literal de primer grado** se define como una proposición
  abierta de la forma:


  $$a x + b = c \quad \text{donde } x \text{ es la incógnita y } a, b, c \text{ son
  parámetros reales con } a \neq 0$$


  **Desglose de la fórmula:**

  - $x$: Variable principal o incógnita que se desea despejar.

  - $a, b, c$: Parámetros o constantes simbólicas conocidas en el contexto de la ecuación.'
definiciones_clave: '- **Ecuación literal**: Ecuación donde los coeficientes o constantes
  están simbolizados por letras.

  - **Parámetro**: Letra constante que representa un valor dado o fijo pero no especificado
  numéricamente.'
propiedades_relaciones: '- **Resultado paramétrico**: La solución de una ecuación
  literal no es un número absoluto, sino una expresión algebraica que depende de los
  parámetros (ejemplo: $x = \frac{c - b}{a}$).'
ejemplo_guiado:
  enunciado: Dada la ecuación literal $a x - b = c$, identifica la incógnita $x$ y
    los parámetros, y halla la expresión paramétrica que representa a $x$.
  pasos:
  - 'Paso 1: Identificar la incógnita a despejar ($x$) y los parámetros constantes
    ($a, b, c$ con $a \neq 0$).'
  - 'Paso 2: Trasponer la constante $-b$ sumando al segundo miembro: $a x = c + b$.Paso
    3: Trasponer el parámetro $a$ dividiendo al segundo miembro: $x = \frac{c + b}{a}$.Paso
    4: Concluir que la solución paramétrica es $x = \frac{c + b}{a}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué diferencia a una ecuación literal de una ecuación numérica convencional?
  choices:
  - text: Que los coeficientes o términos independientes están representados por letras
      llamadas parámetros.
    is_correct: true
  - text: Que carece por completo de incógnita.
    is_correct: false
  - text: Que se resuelve únicamente mediante aproximaciones gráficas.
    is_correct: false
  - text: Que solo se aplica a ecuaciones cuadráticas.
    is_correct: false
  explanation: La alternativa correcta es 'Que los coeficientes o términos independientes
    están representados por letras llamadas parámetros.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la ecuación literal $a x - b = c$ con $a \neq 0$, ¿cuál es la solución
    paramétrica de $x$?
  choices:
  - text: $x = \frac{c + b}{a}$
    is_correct: true
  - text: $x = \frac{c - b}{a}$
    is_correct: false
  - text: $x = a(c + b)$
    is_correct: false
  - text: $x = c + b - a$
    is_correct: false
  explanation: La alternativa correcta es '$x = \frac{c + b}{a}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Distinguir claramente cuál letra es la incógnita a despejar.'
- 'Paso 2: Tratar las demás letras (parámetros) con las mismas reglas algebraicas
  que a los números comunes.'
- 'Paso 3: Trasponer los términos con parámetros independientes al segundo miembro.'
- 'Paso 4: Dividir entre el parámetro coeficiente de la incógnita.'
errores_correccion: '- **Error común:** Confundir los parámetros con la incógnita
  principal intentando despejar una letra equivocada.

  - **Cómo corregirlo:** Lee atentamente el enunciado del problema para confirmar
  cuál letra es la INCÓGNITA ($x$) y cuáles son constantes.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de despeje.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de despeje.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se pueden usar las reglas comunes de transposición en ecuaciones literales?
  respuesta: Sí
  solucion_pasos:
  - Sí, los parámetros se comportan exactamente igual que los números.
- titulo: ¿Dividir entre un parámetro exige la condición de ser distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la indefinición por cero.
errores_frecuentes:
- Confundir la incógnita a despejar con las letras que actúan como parámetros.
- Olvidar factorizar la incógnita cuando aparece en más de un término.
- Sumar o trasponer parámetros cambiando su operación equivocadamente.
- Dividir entre un parámetro sin aclarar la restricción de ser no nulo.
- Tratar las variables físicas con subíndices como si fueran términos idénticos.
afirmaciones_verdaderas:
- Una ecuación literal expresa la incógnita en función de constantes simbólicas o
  parámetros.
- Si la incógnita figura en múltiples términos, debe agruparse y factorizarse para
  realizar su despeje.
al_terminar_debes_poder: Al finalizar este recurso podrás despejar cualquier variable
  en ecuaciones literales y fórmulas científicas indicando sus restricciones.
