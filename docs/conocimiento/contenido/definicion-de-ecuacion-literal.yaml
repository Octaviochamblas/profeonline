semantic_id: MAT.ALG.ECUACIONES_LITERALES.DEFINICION
resumen_inicial: 'Definición de ecuación literal: propiedades, resolución y modelamiento
  en Ecuaciones literales y despeje.'
explicacion_simple: 'Por ejemplo: $ax + b = c$.'
explicacion_formal: "### Definición formal\n\nUna ecuación literal en la incógnita\
  \ $x$ es una igualdad $f(x, p_1, p_2, \\dots, p_k) = 0$ donde, además de $x$, intervienen\
  \ parámetros $p_1, \\dots, p_k$ tratados como constantes durante el despeje; su\
  \ solución se expresa como una fórmula $x = g(p_1, \\dots, p_k)$ en función de esos\
  \ parámetros, no como un número fijo.\n\n### Desarrollo didáctico\n\nPor ejemplo:\
  \ $ax + b = c$. \n¿Quién es la incógnita aquí? Generalmente se asume que las últimas\
  \ letras del abecedario ($x$, $y$, $z$) son las incógnitas, y las primeras ($a$,\
  \ $b$, $c$) son constantes representadas mediante parámetros.\n\nResolver una ecuación\
  \ literal significa despejar la 'x', pero tu respuesta final no será un número como\
  \ '7', sino una fórmula que depende de las otras letras, por ejemplo: $x = \\frac{c\
  \ - b}{a}$."
definiciones_clave: '- **Definición de ecuación literal**: Herramienta matemática
  para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a definición de ecuación literal.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando definición de ecuación
    literal.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de definición de ecuación
    literal.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla fundamental para mantener la igualdad al resolver definición
    de ecuación literal?
  choices:
  - text: Aplicar las propiedades aditiva y multiplicativa para despejar la incógnita
      en ecuaciones literales y despeje
    is_correct: true
  - text: Sumar una cantidad en un miembro y restarla en el otro
    is_correct: false
  - text: Multiplicar un solo lado de la igualdad por cero
    is_correct: false
  - text: Cambiar el signo de los coeficientes sin moverlos de miembro
    is_correct: false
  explanation: 'La alternativa correcta es: Aplicar las propiedades aditiva y multiplicativa
    para despejar la incógnita en ecuaciones literales y despeje. Es la regla de la
    igualdad en definición de ecuación literal.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al obtener el valor de la incógnita en definición de ecuación literal,
    ¿qué paso final se recomienda?
  choices:
  - text: Verificar la solución sustituyendo el valor hallado en la ecuación original
    is_correct: true
  - text: Igualar la solución a cero inmediatamente
    is_correct: false
  - text: Borrar los términos constantes de la ecuación
    is_correct: false
  - text: Dividir el resultado final entre la variable
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar la solución sustituyendo el
    valor hallado en la ecuación original. Garantiza que no se hayan cometido errores
    aritméticos en definición de ecuación literal.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Identifica claramente cuál es la incógnita que debes despejar (usualmente 'x').
- Trata mentalmente a todas las demás letras como si fueran números comunes y corrientes.
- Aplica las mismas reglas de la balanza (transposición) que usarías con números.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en definición de ecuación literal.
ejemplos:
- titulo: $ax + b = c$
  enunciado: Determina qué debe hacerse en $ax + b = c$ y fundamenta cada transformación.
  solucion_pasos:
  - "Por ejemplo: $ax + b = c$. \n¿Quién es la incógnita aquí? Generalmente se asume\
    \ que las últimas letras del abecedario ($x$, $y$, $z$) son las incógnitas, y\
    \ las primeras ($a$, $b$, $c$) son constantes representadas mediante parámetros."
  - Identifica claramente cuál es la incógnita que debes despejar (usualmente 'x').
- titulo: $a$
  enunciado: Analiza el caso $a$ y explica cómo se aplica el criterio estudiado.
  solucion_pasos:
  - Una ecuación literal es una ecuación que tiene una presencia de varios parámetros.
    En lugar de coeficientes numéricos como el 5 o el 8, está llena de parámetros
    como $a$, $b$, $m$ o $k$.
  - Trata mentalmente a todas las demás letras como si fueran números comunes y corrientes.
- titulo: 'Respecto de «Definición de ecuación literal»: ¿Se ajusta a la definición
    esta afirmación? «U'
  enunciado: 'Respecto de «Definición de ecuación literal»: ¿Se ajusta a la definición
    esta afirmación? «Una ecuación literal es una ecuación que tiene una presencia
    de varios parámetros»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una ecuación literal es una
    ecuación que tiene una presencia de varios parámetros.'
- titulo: 'Respecto de «Definición de ecuación literal»: ¿Es compatible con el procedimiento
    esta afirm'
  enunciado: 'Respecto de «Definición de ecuación literal»: ¿Es compatible con el
    procedimiento esta afirmación? «Puede omitirse esta condición sin cambiar el resultado:
    «Identifica claramente cuál es la incógnita que debes despejar (usualmente ''x'')»»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una ecuación literal es una
    ecuación que tiene una presencia de varios parámetros.'
errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Identifica claramente
  cuál es la incógnita que debes despejar (usualmente ''x'')».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Trata mentalmente
  a todas las demás letras como si fueran números comunes y corrientes».'
- La definición sigue cumpliéndose aunque no se considere que una ecuación literal
  es una ecuación que tiene una presencia de varios parámetros. En lugar de coeficientes
  numéricos como el 5 o el 8, está llena de parámetros como $a$, $b$, $m$ o $k$.
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Identifica
  claramente cuál es la incógnita que debes despejar (usualmente 'x')».
- La comprobación del resultado vuelve innecesaria la condición «Trata mentalmente
  a todas las demás letras como si fueran números comunes y corrientes».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_ponder: Resolver ecuaciones y sistemas lineales aplicando definición
  de ecuación literal.
