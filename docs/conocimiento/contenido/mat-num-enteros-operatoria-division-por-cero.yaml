semantic_id: MAT.NUM.ENTEROS_OPERATORIA.DIVISION_POR_CERO
resumen_inicial: "La división por cero no está definida: no existe ningún número entero que sea el resultado de dividir por cero."
explicacion_simple: |
  Si tienes 12 manzanas y las quieres repartir en partes iguales entre 0 personas, ¿cuántas
  le tocan a cada una? La pregunta no tiene sentido, porque no hay nadie a quien
  repartirle. En matemáticas, dividir por cero es una operación prohibida: no está
  definida. No existe ningún número que pueda ser una respuesta válida.
explicacion_formal: |
  $a\div b=c$ significa buscar $c$ tal que $c\cdot b=a$. Si $b=0$ y $a\neq0$: se busca $c$
  tal que $c\cdot0=a$, pero cualquier número por $0$ da $0$, así que no existe solución. Si
  $a=0$ y $b=0$: cualquier $c$ cumple $c\cdot0=0$, así que la respuesta no es única
  (indeterminado). En ambos casos, la expresión no está definida.
definiciones_clave: |
  **Indefinido**: una expresión que no tiene ningún valor numérico como resultado.
  **Indeterminado**: caso especial ($0\div0$) donde cualquier número cumpliría la
  igualdad, por lo que tampoco hay una respuesta única.
propiedades_relaciones: |
  $0$ dividido por cualquier entero distinto de cero SÍ está definido y da $0$ ($0\div a=0$
  si $a\neq0$). Lo que nunca está definido es dividir POR cero.
ejemplo_guiado:
  enunciado: "¿Está definida la expresión $(-25) \\div 0$?"
  pasos:
    - "El divisor es $0$."
    - "Se busca $c$ tal que $c\\cdot0=-25$, pero cualquier número por $0$ da $0$, nunca $-25$."
    - "No existe solución: la expresión no está definida."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el resultado de dividir un entero distinto de cero por cero?"
    choices:
      - {text: "El mismo entero", is_correct: false}
      - {text: "Cero", is_correct: false}
      - {text: "No está definido", is_correct: true}
      - {text: "Uno", is_correct: false}
    explanation: "La correcta es No está definido: no existe ningún número que multiplicado por cero dé el dividendo original."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo razonamiento del ejemplo guiado, ¿está definida $18 \\div 0$?"
    choices:
      - {text: "No, no está definida", is_correct: true}
      - {text: "Sí, es $0$", is_correct: false}
      - {text: "Sí, es $18$", is_correct: false}
      - {text: "Sí, es $1$", is_correct: false}
    explanation: "La correcta es No, no está definida: ningún número multiplicado por cero da $18$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identifica el divisor de la operación (el número por el cual se divide).'
  - 'Paso 2: Si el divisor es $0$, detén el cálculo inmediatamente.'
  - 'Paso 3: Declara la expresión como "no definida" o "indeterminada", y aclara que no tiene un resultado numérico en Z.'
errores_correccion: |
  Un error frecuente es creer que dividir por cero da cero o da el mismo dividendo. Otro
  error es confundir "dividir cero por un número" (que sí está definido y da $0$) con
  "dividir un número por cero" (que nunca está definido).
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Determina el resultado de la operación $(-18) \div 0$.'
    alternativas:
      - "No está definido"
      - "$0$"
      - "$-18$"
    respuesta: "No está definido"
    solucion_pasos:
      - 'Paso a: Identificamos el dividendo ($-18$) y el divisor ($0$).'
      - 'Paso b: Como el divisor es cero, la operación de dividir por cero no está permitida en matemáticas.'
      - 'Paso c: Concluimos que el resultado "no está definido".'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve la expresión combinada $\frac{14 - 14}{10 \cdot 0}$.'
    alternativas:
      - "Indeterminada ($0/0$)"
      - "$0$"
      - "$1$"
    respuesta: "Indeterminada ($0/0$)"
    solucion_pasos:
      - 'Paso a: Evaluamos el numerador: $14 - 14 = 0$.'
      - 'Paso b: Evaluamos el denominador: $10 \cdot 0 = 0$.'
      - 'Paso c: La expresión resultante es $\frac{0}{0}$. Al ser el denominador (divisor) igual a cero, la expresión está indefinida.'
  - titulo: '¿Es el número cero el resultado de dividir cualquier número entero por cero?'
    respuesta: 'No'
    solucion_pasos:
      - 'Dividir por cero no da como resultado cero.'
      - 'Por ejemplo, para $7 \div 0$, no hay ningún número que multiplicado por $0$ dé $7$.'
      - 'La operación simplemente carece de definición matemática.'
  - titulo: '¿Se puede calcular el valor de $0 \div 5$ en los números enteros?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Aquí el divisor es $5$ (diferente de cero) y el dividendo es $0$.'
      - 'Buscamos un número $c$ tal que $c \cdot 5 = 0$. El único número es $0$.'
      - 'Por lo tanto, $0 \div 5 = 0$ y sí está perfectamente definido.'
errores_frecuentes:
  - 'Pensar que la división por cero da como resultado cero (ej: $8 \div 0 = 0$).'
  - 'Creer que dividir por cero da como resultado el mismo dividendo (ej: $15 \div 0 = 15$).'
  - 'Confundir dividir cero por un número ($0 \div a = 0$) con dividir un número por cero ($a \div 0$, no definido).'
  - 'Tratar la expresión indeterminada $0 \div 0$ como si fuera igual a 1 (creyendo erróneamente que cualquier número dividido por sí mismo es 1).'
  - 'Intentar simplificar expresiones fraccionarias cancelando factores que valen cero en el denominador.'
al_terminar_debes_poder: |
  Reconocer que cualquier división por cero no está definida, y distinguir ese caso del de
  dividir cero por un número distinto de cero (que sí está definido y da $0$).
fuente: "Matemática 7° Básico Tomo 1 — Enteros, p. 49"
estado: publicado
