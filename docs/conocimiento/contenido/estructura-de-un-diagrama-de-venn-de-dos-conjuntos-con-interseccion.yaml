semantic_id: MAT.FUND.DIAGRAMAS_VENN.DIAGRAMA_DOS_CONJUNTOS_INTERSECTADOS
resumen_inicial: 'Estructura canónica de un diagrama de Venn para dos conjuntos con intersección ($A \cap B \neq \emptyset$), generando 4 regiones disjuntas.'
explicacion_simple: |
  El **diagrama de Venn de dos conjuntos con intersección** es el modelo más famoso y utilizado en matemáticas. Consiste en **dos círculos que se cruzan parcialmente**, encerrados en un rectángulo universal $\mathcal{U}$. Este esquema divide al universo exactamente en **$4$ regiones disjuntas**:
  1. **"Solo $A$"** ($A \setminus B$): elementos que están en $A$ pero no en $B$.
  2. **"Ambos a la vez"** ($A \cap B$): la zona central compartida donde se cruzan los dos círculos.
  3. **"Solo $B$"** ($B \setminus A$): elementos que están en $B$ pero no en $A$.
  4. **"Ninguno de los dos"** ($(A \cup B)^c$): la zona exterior dentro del rectángulo.
explicacion_formal: |
  ### Definición formal
  En la lógica visual de Venn, el **diagrama estándar de orden 2** es la subdivisión topológica del plano generada por dos curvas de Jordan simples secantes $C_A, C_B \subset \mathcal{U}$:
  $$A \cap B \neq \emptyset \quad \land \quad A \setminus B \neq \emptyset \quad \land \quad B \setminus A \neq \emptyset$$
  Esta disposición define de forma exhaustiva una partición de $\mathcal{U}$ en exactamente $2^2 = 4$ átomos booleanos (regiones disjuntas):
  1. $R_{10} = A \cap B^c = A \setminus B$ (Solo $A$).
  2. $R_{11} = A \cap B$ (Intersección central).
  3. $R_{01} = A^c \cap B = B \setminus A$ (Solo $B$).
  4. $R_{00} = A^c \cap B^c = (A \cup B)^c$ (Región exterior).

  ### Desglose simbólico
  - Ecuación de conservación de cardinalidad total:
    $$|\mathcal{U}| = |A \setminus B| + |A \cap B| + |B \setminus A| + |(A \cup B)^c|$$
  - Descomposición de conjuntos individuales:
    $$|A| = |A \setminus B| + |A \cap B| \implies |A \setminus B| = |A| - |A \cap B|$$
    $$|B| = |B \setminus A| + |A \cap B| \implies |B \setminus A| = |B| - |A \cap B|$$

  ### Síntesis didáctica
  La regla de oro para resolver problemas en diagramas de Venn es **comenzar siempre rellenando la intersección central ($A \cap B$)** y restar ese valor a los totales de cada círculo para hallar las zonas exclusivas.
definiciones_clave: |
  - **Diagrama de Venn estándar de 2 conjuntos**: Representación gráfica con dos círculos secantes que genera 4 regiones booleanas disjuntas.
  - **Intersección central ($A \cap B$)**: Región compartida por ambos círculos.
  - **Regiones exclusivas ($A \setminus B$ y $B \setminus A$)**: Zonas de pertenencia única a uno de los dos conjuntos.
propiedades_relaciones: |
  - **Principio de inclusión-exclusión**: $|A \cup B| = |A| + |B| - |A \cap B|$.
  - **Diferencia simétrica en el diagrama**: $A \bigtriangleup B = (A \setminus B) \cup (B \setminus A)$ (suma de las dos zonas laterales).
ejemplo_guiado:
  enunciado: 'En un grupo de $40$ personas ($\mathcal{U}$), $25$ leen novelas ($N$), $18$ leen poesía ($P$) y $10$ leen ambos géneros ($N \cap P$). Distribuye los datos en las 4 regiones del diagrama de Venn y determina cuántas personas no leen ninguno de los dos géneros.'
  pasos:
    - 'Paso 1: Colocar primero el dato de la intersección central:
      - $|N \cap P| = 10$.'
    - 'Paso 2: Calcular la región "Solo novelas" ($N \setminus P$):
      - $|N \setminus P| = |N| - |N \cap P| = 25 - 10 = 15$.'
    - 'Paso 3: Calcular la región "Solo poesía" ($P \setminus N$):
      - $|P \setminus N| = |P| - |N \cap P| = 18 - 10 = 8$.'
    - 'Paso 4: Calcular el total de personas en la unión ($N \cup P$):
      - $|N \cup P| = 15 + 10 + 8 = 33$ (o bien $25 + 18 - 10 = 33$).'
    - 'Paso 5: Calcular la región exterior "Ninguno" ($(N \cup P)^c$):
      - $|(N \cup P)^c| = |\mathcal{U}| - |N \cup P| = 40 - 33 = 7$ personas.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En cuántas regiones disjuntas divide al universo $\mathcal{U}$ un diagrama de Venn de dos conjuntos con intersección?'
    choices:
      - {text: 'Exactamente $4$ regiones disjuntas ($2^2$)', is_correct: true}
      - {text: '$3$ regiones', is_correct: false}
      - {text: '$2$ regiones', is_correct: false}
      - {text: '$5$ regiones', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente $4$ regiones disjuntas ($2^2$)''. Solo A, Ambos, Solo B y Ninguno.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $|A| = 20$ y la intersección $|A \cap B| = 7$, ¿cuántos elementos contiene la región exclusiva "Solo $A$" ($A \setminus B$)?'
    choices:
      - {text: '$13$ elementos ($20 - 7$)', is_correct: true}
      - {text: '$27$ elementos', is_correct: false}
      - {text: '$7$ elementos', is_correct: false}
      - {text: '$20$ elementos', is_correct: false}
    explanation: 'La alternativa correcta es ''$13$ elementos ($20 - 7$)''. Al total del conjunto A se le debe restar la intersección compartida.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Dibujar el rectángulo universal $\mathcal{U}$ y dos círculos secantes rotulados $A$ y $B$.'
  - 'Paso 2: Registrar en primer lugar la cantidad o elementos de la intersección central $A \cap B$.'
  - 'Paso 3: Calcular y ubicar "Solo $A$" restando $|A \cap B|$ del total $|A|$.'
  - 'Paso 4: Calcular y ubicar "Solo $B$" restando $|A \cap B|$ del total $|B|$.'
  - 'Paso 5: Sumar las tres regiones interiores para obtener $|A \cup B|$ y restar de $|\mathcal{U}|$ para ubicar la región exterior.'
errores_correccion: |
  - **Error 1:** Colocar el total de $A$ directamente en la zona lateral izquierda. **Cómo corregirlo:** La zona lateral es "Solo $A$" ($|A| - |A \cap B|$); el total de $A$ abarca la medialuna lateral más la zona central.
  - **Error 2:** Sumar directamente $|A| + |B|$ para calcular el total de personas en la unión. **Cómo corregirlo:** Al sumar los totales se cuenta dos veces a la gente de la intersección; la fórmula correcta es $|A \cup B| = |A| + |B| - |A \cap B|$.
ejemplos:
  - titulo: 'Distribución de idiomas'
    enunciado: 'Si 15 personas hablan inglés, 12 francés y 5 ambos, ¿cuántas hablan solo inglés?'
    alternativas:
      - '$10$ personas'
      - '$15$ personas'
      - '$7$ personas'
    respuesta: '$10$ personas'
    solucion_pasos:
      - '1. Solo inglés $= 15 - 5 = 10$.'
  - titulo: 'Diferencia simétrica'
    enunciado: 'En el problema anterior, ¿cuántas personas hablan exactamente un solo idioma?'
    respuesta: '$17$ personas ($10$ solo inglés $+ 7$ solo francés)'
    solucion_pasos:
      - 'Solo francés $= 12 - 5 = 7$. Total exclusivo $= 10 + 7 = 17$.'
  - titulo: 'Total en la unión'
    enunciado: '¿Cuál es la cardinalidad de la unión de dos conjuntos con $|A|=20, |B|=15, |A \cap B|=5$?'
    respuesta: '$30$'
    solucion_pasos:
      - '$|A \cup B| = 20 + 15 - 5 = 30$.'
  - titulo: 'Región exterior'
    enunciado: 'Si $|\mathcal{U}| = 50$ y $|A \cup B| = 30$, ¿cuántos hay en la región exterior?'
    respuesta: '$20$'
    solucion_pasos:
      - '$|(A \cup B)^c| = 50 - 30 = 20$.'
errores_frecuentes:
  - 'La afirmación de que la región lateral izquierda contiene la totalidad de elementos del conjunto $A$ sin la deducción de la intersección.'
  - 'La afirmación de que un diagrama de dos conjuntos secantes divide al universo en tres regiones.'
  - 'La afirmación de que la cardinalidad de la unión de conjuntos solapados es la suma directa de sus totales.'
  - 'La afirmación de que la región exterior a la unión no puede calcularse restando la unión del universo.'
  - 'La afirmación de que comenzar a llenar los datos por los extremos es más eficiente que empezar por la intersección central.'
afirmaciones_verdaderas:
  - 'El diagrama de Venn de dos conjuntos con intersección divide al universo $\mathcal{U}$ en exactamente $4$ regiones disjuntas: $A \setminus B$, $A \cap B$, $B \setminus A$ y $(A \cup B)^c$.'
  - 'La cardinalidad exclusiva de la región "Solo $A$" se obtiene restando la intersección central del total del conjunto ($|A \setminus B| = |A| - |A \cap B|$).'
al_terminar_debes_poder: |
