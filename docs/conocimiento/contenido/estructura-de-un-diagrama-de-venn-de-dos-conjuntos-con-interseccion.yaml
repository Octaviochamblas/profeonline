semantic_id: MAT.FUND.DIAGRAMAS_VENN.DIAGRAMA_DOS_CONJUNTOS_INTERSECTADOS
resumen_inicial: Estructura canónica de un diagrama de Venn para dos conjuntos con intersección ($A \cap B \neq \emptyset$), generando 4 regiones disjuntas.
explicacion_simple: '![Infografía: Diagrama canónico de dos conjuntos secantes y 4 regiones](/static/img/nodos/estructura-de-un-diagrama-de-venn-de-dos-conjuntos-con-interseccion-intro.svg)


  El **diagrama de Venn de dos conjuntos con intersección** es el modelo más famoso y utilizado en matemáticas. Consiste en **dos círculos que se cruzan parcialmente**, encerrados en un rectángulo universal $\mathcal{U}$. Este esquema divide al universo exactamente en **$4$ regiones disjuntas**:

  1. **"Solo $A$"** ($A \setminus B$): elementos que están en $A$ pero no en $B$.

  2. **"Ambos a la vez"** ($A \cap B$): la zona central compartida donde se cruzan los dos círculos.

  3. **"Solo $B$"** ($B \setminus A$): elementos que están en $B$ pero no en $A$.

  4. **"Ninguno de los dos"** ($(A \cup B)^c$): la zona exterior dentro del rectángulo.

  '
explicacion_formal: "### Definición formal\nEn la lógica visual de Venn, el **diagrama estándar de orden 2** es la subdivisión topológica del plano generada por dos curvas de Jordan simples secantes $C_A, C_B \\subset \\mathcal{U}$:\n$$A \\cap B \\neq \\emptyset \\quad \\land \\quad A \\setminus B \\neq \\emptyset \\quad \\land \\quad B \\setminus A \\neq \\emptyset$$\nEsta disposición define de forma exhaustiva una partición de $\\mathcal{U}$ en exactamente $2^2 = 4$ átomos booleanos (regiones disjuntas):\n1. $R_{10} = A \\cap B^c = A \\setminus B$ (Solo $A$).\n2. $R_{11} = A \\cap B$ (Intersección central).\n3. $R_{01} = A^c \\cap B = B \\setminus A$ (Solo $B$).\n4. $R_{00} = A^c \\cap B^c = (A \\cup B)^c$ (Región exterior).\n\n### Desglose simbólico\n- Ecuación de conservación de cardinalidad total:\n  $$|\\mathcal{U}| = |A \\setminus B| + |A \\cap B| + |B \\setminus A| + |(A \\cup B)^c|$$\n- Descomposición de conjuntos individuales:\n  $$|A| = |A \\setminus B| + |A \\cap B| \\implies\
  \ |A \\setminus B| = |A| - |A \\cap B|$$\n  $$|B| = |B \\setminus A| + |A \\cap B| \\implies |B \\setminus A| = |B| - |A \\cap B|$$\n\n### Síntesis didáctica\nLa regla de oro para resolver problemas en diagramas de Venn es **comenzar siempre rellenando la intersección central ($A \\cap B$)** y restar ese valor a los totales de cada círculo para hallar las zonas exclusivas.\n"
definiciones_clave: '- **Diagrama de Venn estándar de 2 conjuntos**: Representación gráfica con dos círculos secantes que genera 4 regiones booleanas disjuntas.

  - **Intersección central ($A \cap B$)**: Región compartida por ambos círculos.

  - **Regiones exclusivas ($A \setminus B$ y $B \setminus A$)**: Zonas de pertenencia única a uno de los dos conjuntos.

  '
propiedades_relaciones: '- **Principio de inclusión-exclusión**: $|A \cup B| = |A| + |B| - |A \cap B|$.

  - **Diferencia simétrica en el diagrama**: $A \bigtriangleup B = (A \setminus B) \cup (B \setminus A)$ (suma de las dos zonas laterales).

  '
ejemplo_guiado:
  enunciado: '![Diagrama: Distribución de lectores en novelas y poesía con diferencia simétrica](/static/img/nodos/estructura-de-un-diagrama-de-venn-de-dos-conjuntos-con-interseccion-ejemplos.svg)


    En un grupo de $40$ personas ($\mathcal{U}$), $25$ leen novelas ($N$), $18$ leen poesía ($P$) y $10$ leen ambos géneros ($N \cap P$). Distribuye los datos en las 4 regiones del diagrama de Venn y determina cuántas personas no leen ninguno de los dos géneros.'
  pasos:
  - 'Paso 1: Colocar primero el dato de la intersección central: - $|N \cap P| = 10$.'
  - 'Paso 2: Calcular la región "Solo novelas" ($N \setminus P$): - $|N \setminus P| = |N| - |N \cap P| = 25 - 10 = 15$.'
  - 'Paso 3: Calcular la región "Solo poesía" ($P \setminus N$): - $|P \setminus N| = |P| - |N \cap P| = 18 - 10 = 8$.'
  - 'Paso 4: Calcular el total de personas en la unión ($N \cup P$): - $|N \cup P| = 15 + 10 + 8 = 33$ (o bien $25 + 18 - 10 = 33$).'
  - 'Paso 5: Calcular la región exterior "Ninguno" ($(N \cup P)^c$): - $|(N \cup P)^c| = |\mathcal{U}| - |N \cup P| = 40 - 33 = 7$ personas.'
