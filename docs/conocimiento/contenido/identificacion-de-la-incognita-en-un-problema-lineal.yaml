semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.IDENTIFICACION_INCOGNITA
resumen_inicial: Identificar la incógnita en un problema verbal consiste en asignar
  una variable a la cantidad desconocida que se desea determinar.
explicacion_simple: 'Para resolver un problema matemático escrito en palabras, el
  primer paso fundamental es definir con claridad la incógnita.

  Leemos la pregunta final del problema y asignamos una letra (como $x$) a esa cantidad
  desconocida (por ejemplo: ''sea $x$ la cantidad de dinero inicial'' o ''sea $x$
  la edad de Pedro'').

  Declarar la unidad de medida (pesos, años, metros, etc.) ayuda a evitar confusiones
  posteriores.'
explicacion_formal: 'Sea un problema verbal expresado en lenguaje natural. El **proceso
  de abstracción lineal** define la variable $x$ como:


  $$x \in \mathbb{R} \quad \text{tal que } x \text{ representa la cantidad desconocida
  con dimensión o unidad } U$$


  **Desglose de la fórmula:**

  - $x$: Variable de asignación que simboliza el valor cuantitativo buscado.

  - $U$: Dominio físico o financiero asociado al problema (por ejemplo $U = \text{años},
  U = \text{pesos}, U = \text{metros}$).'
definiciones_clave: '- **Identificación de la incógnita**: Declaración formal de la
  cantidad desconocida del enunciado y su asignación simbólica a una variable.

  - **Definición de variable contextual**: Especificación precisa de lo que representa
  $x$ incluyendo sus unidades de medida.'
propiedades_relaciones: '- **Punto de partida del modelamiento**: Sin una incógnita
  claramente definida es imposible construir la ecuación lineal correspondiente.'
ejemplo_guiado:
  enunciado: En una tienda, un cuaderno cuesta $\$1.500$ más que un lápiz. Si entre
    ambos productos se pagaron $\$4.500$, define la incógnita $x$ adecuada para determinar
    el precio del lápiz.
  pasos:
  - 'Paso 1: Leer la pregunta del problema: se desea hallar el precio del lápiz.'
  - 'Paso 2: Declarar la incógnita: sea $x = \text{precio del lápiz en pesos (\$)}$.'
  - 'Paso 3: Expresar las demás cantidades en función de $x$: el cuaderno cuesta $x
    + 1500$.'
  - 'Paso 4: Escribir la suma total: $x + (x + 1500) = 4500 \implies 2x + 1500 = 4500$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el primer paso indispensable al abordar la resolución verbal
    de un problema algebraico?
  choices:
  - text: Definir con claridad qué cantidad desconocida representa la variable $x$.
    is_correct: true
  - text: Restar los números del enunciado al azar.
    is_correct: false
  - text: Dividir el precio total entre diez.
    is_correct: false
  - text: Escribir directamente la solución numérica sin ecuación.
    is_correct: false
  explanation: La alternativa correcta es 'Definir con claridad qué cantidad desconocida
    representa la variable $x$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $x$ representa el precio del lápiz en el problema del cuaderno que
    cuesta $\$1.500$ más, ¿cómo se expresa el precio del cuaderno?
  choices:
  - text: $x + 1500$
    is_correct: true
  - text: $1500x$
    is_correct: false
  - text: $x - 1500$
    is_correct: false
  - text: $\frac{x}{1500}$
    is_correct: false
  explanation: La alternativa correcta es '$x + 1500$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado del problema completo prestando atención a la pregunta
  final.'
- 'Paso 2: Asignar una letra variable (por ejemplo $x$) a la magnitud desconocida
  requerida.'
- 'Paso 3: Escribir explícitamente el significado de $x$ especificando sus unidades.'
- 'Paso 4: Traducir las otras cantidades del texto en función de la variable $x$ declarada.'
errores_correccion: '- **Error común:** Empezar a hacer operaciones aritméticas sueltas
  sin definir qué representa la letra $x$.

  - **Cómo corregirlo:** Escribe siempre primero al inicio de tu hoja: ''Sea $x =
  \dots$'' indicando exactamente qué mide esa variable.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El primer paso para resolver un problema verbal es definir la incógnita?
  respuesta: Sí
  solucion_pasos:
  - Sí, declarar la variable $x$ es indispensable.
- titulo: ¿Pueden existir soluciones matemáticas que se descarten por ser incompatibles
    con el contexto real?
  respuesta: Sí
  solucion_pasos:
  - Sí, como edades o cantidades de objetos negativas.
errores_frecuentes:
- Operar números del enunciado al azar sin definir la incógnita $x$.
- Olvidar los paréntesis al traducir frases como 'el triple de un número aumentado
  en 5'.
- Dar por terminado el problema al despejar $x$ sin responder la pregunta específica
  del enunciado.
- Omitir las unidades de medida en la respuesta final del problema.
- Aceptar soluciones negativas o decimales incompatibles con la realidad física del
  contexto.
afirmaciones_verdaderas:
- El modelamiento lineal traduce relaciones del lenguaje verbal a una ecuación de
  primer grado.
- Las soluciones obtenidas al modelar deben ser verificadas frente a las restricciones
  físicas del contexto real.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar la incógnita,
  plantear, resolver e interpretar problemas contextualizados mediante ecuaciones
  lineales.
