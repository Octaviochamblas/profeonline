semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.IDENTIFICACION_INCOGNITA
resumen_inicial: Identificar la incógnita en un problema verbal consiste en asignar una variable a la cantidad desconocida que se requiere determinar.
explicacion_simple: |
  Para resolver un problema matemático redactado en palabras, el primer paso decisivo consiste en definir formalmente la incógnita.

  Examinamos la pregunta central del enunciado y asignamos un símbolo literal (como $x$) a esa cantidad desconocida (por ejemplo: "sea $x$ el costo del lápiz en pesos" o "sea $x$ la edad actual de Pedro en años").

  Especificar explícitamente la unidad de medida (pesos, años, metros, etc.) evita confusiones dimensionales durante el planteamiento y resolución.
explicacion_formal: |
  ### Definición formal
  Sea un problema verbal presentado en lenguaje natural. El **proceso de abstracción lineal** define la variable $x$ mediante la asignación:

  $$x \in \mathbb{R} \quad \text{tal que } x \text{ representa la cantidad desconocida en la unidad } U$$

  ### Desglose de la fórmula
  - $x$: Símbolo algebraico que representa la cantidad numérica desconocida requerida.
  - $U$: Dimensión o unidad del contexto físico, financiero o geométrico (por ejemplo $U = \text{años}, U = \text{pesos}, U = \text{metros}$).

  ### Síntesis didáctica
  Definir $x$ con precisión constituye el cimiento matemático sobre el cual se traducen los demás términos del problema.
definiciones_clave: |
  - **Identificación de la incógnita**: Asignación formal de un símbolo literal a la magnitud desconocida formulada en la pregunta.
  - **Definición de variable contextual**: Declaración explícita del significado cuantitativo de $x$ incluyendo sus unidades de medida.
propiedades_relaciones: |
  - **Punto de partida del modelamiento**: Sin una incógnita explícitamente definida resulta imposible estructurar una ecuación lineal equivalente.
  - **Consistencia dimensional**: Todas las expresiones algebraicas derivadas deben guardar coherencia con la unidad $U$ definida para $x$.
ejemplo_guiado:
  enunciado: 'En una librería, un cuaderno cuesta $\$1.500$ más que un lápiz. Si entre ambos productos se pagaron $\$4.500$, define la incógnita $x$ adecuada para determinar el precio del lápiz.'
  pasos:
    - 'Paso 1: Leer la pregunta del problema: se exige hallar el costo o precio del lápiz.'
    - 'Paso 2: Declarar la incógnita de forma precisa: sea $x = \text{precio del lápiz en pesos (\$)}$.'
    - 'Paso 3: Expresar las demás magnitudes en función de $x$: el precio del cuaderno equivale a $x + 1500$.'
    - 'Paso 4: Estructurar la suma total: $x + (x + 1500) = 4500 \implies 2x + 1500 = 4500$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el primer paso indispensable al abordar el modelamiento algebraico de un problema verbal?'
    choices:
      - {text: 'Definir con claridad qué cantidad desconocida representa la variable $x$ especificando su unidad de medida.', is_correct: true}
      - {text: 'Efectuar operaciones aritméticas arbitrarias entre los datos numéricos del texto.', is_correct: false}
      - {text: 'Dividir la cantidad total entre el número de oraciones del enunciado.', is_correct: false}
      - {text: 'Escribir un valor numérico estimado sin plantear una ecuación.', is_correct: false}
    explanation: 'La alternativa correcta es ''Definir con claridad qué cantidad desconocida representa la variable $x$ especificando su unidad de medida.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $x$ representa el precio del lápiz en el problema planteado, ¿cómo se expresa el precio del cuaderno que cuesta $\$1.500$ más?'
    choices:
      - {text: '$x + 1500$', is_correct: true}
      - {text: '$1500x$', is_correct: false}
      - {text: '$x - 1500$', is_correct: false}
      - {text: '$\frac{x}{1500}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x + 1500$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer analíticamente el enunciado completo identificando el objetivo fijado en la pregunta final.'
  - 'Paso 2: Asignar un símbolo variable ($x$) a la cantidad principal requerida por la pregunta.'
  - 'Paso 3: Redactar por escrito el significado de $x$ especificando sus unidades de medida ($U$).'
  - 'Paso 4: Expresar los demás datos e incógnitas secundarias del texto en función del símbolo $x$.'
errores_correccion: |
  - **Error 1:** Realizar cálculos numéricos al azar sin declarar explícitamente qué representa la variable $x$. **Cómo corregirlo:** Declarar siempre **AL INICIO DEL PROBLEMA EL SIGNIFICADO DE LA VARIABLE EN LA FORMA "Sea $x = \text{descripción de la magnitud con unidad}"**.
  - **Error 2:** Confundir la unidad de medida con la variable (por ejemplo escribir $x = \text{pesos}$ en lugar de $x = \text{cantidad de pesos}$). **Cómo corregirlo:** La variable **DEBE REPRESENTAR UN VALOR NUMÉRICO CANTIDAD Y NO ÚNICAMENTE EL NOMBRE DE LA UNIDAD DE MEDIDA**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'En un problema sobre edades donde la edad de Ana supera en $4$ años a la de Beatriz, ¿cuál es la definición adecuada para hallar la edad de Beatriz?'
    alternativas:
      - 'Sea $x = \text{edad de Beatriz en años}$'
      - 'Sea $x = \text{años de Ana}$'
      - 'Sea $x = 4$'
    respuesta: 'Sea $x = \text{edad de Beatriz en años}$'
    solucion_pasos:
      - '1. Asignar $x$ a la edad requerida de Beatriz.'
      - '2. La edad de Ana se expresa como $x + 4$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Si $x$ representa el ancho de un terreno rectangular en metros, y el largo mide el triple del ancho, ¿cómo se expresa el largo?'
    alternativas:
      - '$3x$'
      - '$x + 3$'
      - '$\frac{x}{3}$'
    respuesta: '$3x$'
    solucion_pasos:
      - '1. Ancho $= x$.'
      - '2. El triple del ancho $= 3 \cdot x = 3x$.'
  - titulo: 'Primer paso de modelamiento'
    enunciado: '¿Definir la incógnita $x$ con su respectiva unidad de medida debe preceder al planteamiento de la ecuación?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es el paso inicial obligatorio del algoritmo de modelamiento.'
  - titulo: 'Expresiones derivadas'
    enunciado: '¿Todas las demás cantidades desconocidas del enunciado deben expresarse en función de la incógnita $x$ elegida?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, para mantener la ecuación en una sola variable.'
errores_frecuentes:
  - 'En un problema verbal, la resolución inicia efectuando cálculos numéricos con los datos sin declarar formalmente qué representa la variable $x$.'
  - 'La definición inicial de la variable $x$ como $x = \text{pesos}$ prescinde de especificar la cantidad desconocida y su significado contextual.'
  - 'Al modelar un enunciado verbal se introducen variables múltiples innecesarias ($x, y, z$) en lugar de expresarlas en función de una única incógnita.'
  - 'La incógnita $x$ en un problema de edades se define como una constante fija como $x = 4$ en vez de representar la edad desconocida en años.'
  - 'Al definir $x$ como la edad de Beatriz, la edad de Ana que la supera en $4$ años se expresa de forma multiplicativa como $4x$.'
afirmaciones_verdaderas:
  - 'Identificar e indicar el significado de la incógnita $x$ con su unidad es el primer paso obligatorio del modelamiento lineal.'
  - 'Todas las demás magnitudes desconocidas del problema deben traducirse algebraicamente en función de la variable $x$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y definir la incógnita en un problema verbal contextualizado.
  CÓMO: Leer la pregunta del enunciado, asignar la variable $x$ con su unidad de medida y expresar los demás datos desconocidos en función de $x$.
