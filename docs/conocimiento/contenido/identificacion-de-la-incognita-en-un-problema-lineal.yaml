semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.IDENTIFICACION_INCOGNITA
resumen_inicial: 'Identificación de la incógnita en un problema lineal: propiedades,
  resolución y modelamiento en Modelamiento con ecuaciones lineales.'
explicacion_simple: 'Si el problema dice ''¿Cuántos años tiene Juan?'', entonces defines:
  $x = \text{edad de Juan}$.'
explicacion_formal: '### Definición formal


  En el modelamiento algebraico de un problema verbal, la incógnita $x$ se define
  como la cantidad desconocida que el enunciado solicita explícitamente (usualmente
  en la pregunta final); todas las demás cantidades del problema se expresan como
  funciones lineales de esa misma $x$.


  ### Desarrollo didáctico


  Si el problema dice ''¿Cuántos años tiene Juan?'', entonces defines: $x = \text{edad
  de Juan}$.

  Si el problema habla de varios sujetos (''La edad de Pedro es el doble que la de
  Juan''), debes usar ESA misma $x$ como base para construir a los demás. Entonces
  Pedro sería $2x$.


  criterio recomendado: Asigna la $x$ al elemento más pequeño o básico del problema.
  Si sabes cuánto vale la base, sabes cuánto valen los demás.'
definiciones_clave: '- **Identificación de la incógnita en un problema lineal**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a identificación de la incógnita en un problema
  lineal.'
