semantic_id: MAT.GEO.TEOREMA_TALES.RECIPROCO_ENUNCIADO
resumen_inicial: 'El Recíproco del Teorema de Tales establece que si una recta corta a dos lados de un triángulo determinando segmentos proporcionales ($\frac{AD}{DB} = \frac{AE}{EC}$), entonces dicha recta es necesariamente paralela al tercer lado.'
explicacion_simple: |
  ![Enunciado del Recíproco del Teorema de Tales](/static/img/nodos/enunciado-del-reciproco-del-teorema-de-tales-intro.svg)

  Si mides los trozos de los lados y descubres que guardan la misma proporción, tienes la garantía absoluta de que la línea que los une es perfectamente paralela a la base.
explicacion_formal: |
  ### Teorema formal (Recíproco de Tales)
  Sea $\Delta ABC$ un triángulo en $\mathbb{R}^2$, y sean $D \in \overline{AB}$ y $E \in \overline{AC}$ dos puntos en sus lados. Si se cumple:

  $$\frac{\|\overline{AD}\|}{\|\overline{DB}\|} = \frac{\|\overline{AE}\|}{\|\overline{EC}\|}$$

  Entonces la recta $\overleftrightarrow{DE}$ es estrictamente paralela a la recta $\overleftrightarrow{BC}$:

  $$\overleftrightarrow{DE} \parallel \overleftrightarrow{BC}$$

  ### Desglose simbólico y geométrico
  - Demostración por contradicción (Reductio ad absurdum):
    1. Supóngase que $\overleftrightarrow{DE}$ no es paralela a $\overleftrightarrow{BC}$.
    2. Trácese por $D$ la única paralela a $\overleftrightarrow{BC}$, que cortará a $\overline{AC}$ en un punto $E' \neq E$.
    3. Por el Teorema directo de Tales: $\frac{AD}{DB} = \frac{AE'}{E'C}$.
    4. Igualando con la hipótesis: $\frac{AE}{EC} = \frac{AE'}{E'C} \implies E = E'$, contradiciendo que $E' \neq E$.
    5. Por tanto, $\overleftrightarrow{DE} \parallel \overleftrightarrow{BC}$.

  ### Síntesis didáctica
  El recíproco transforma mediciones estáticas de longitud en demostraciones rigurosas de paralelismo espacial.
definiciones_clave: |
  - **Teorema de Tales**: Teorema de proporcionalidad geométrica determinado por un haz de rectas paralelas cortadas por secantes.
  - **Segmentos homólogos**: Segmentos correspondientes delimitados por las mismas rectas paralelas en distintas transversales.
  - **Recíproco de Tales**: Teorema que demuestra el paralelismo de dos rectas a partir de la igualdad de razones entre segmentos.
  - **Modelamiento de sombras**: Aplicación geométrica para calcular alturas inaccesibles mediante la sombra solar proyectada.
propiedades_relaciones: |
  - **Proporcionalidad directa**: $\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$.
  - **Semejanza en triángulos**: Si $DE \parallel BC \implies \Delta ADE \sim \Delta ABC \implies \frac{AD}{AB} = \frac{DE}{BC}$.
  - **Ecuación de sombras**: $\frac{H}{h} = \frac{S}{s} \implies H = h \cdot \frac{S}{s}$.
