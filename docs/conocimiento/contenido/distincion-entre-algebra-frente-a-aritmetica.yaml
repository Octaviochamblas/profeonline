semantic_id: MAT.ALG.FUNDAMENTOS.DISTINCION_ARITMETICA
resumen_inicial: 'Distinción entre Álgebra frente a Aritmética: concepto y propiedades
  en Fundamentos y notación algebraica.'
explicacion_simple: Si la Aritmética es tomar una fotografía de un solo instante numérico,
  el Álgebra es grabar un video de todo lo que podría pasar. Ambas ramas operan parecido,
  pero sus alcances son muy diferentes.
explicacion_formal: '### Definición formal


  La generalización a través de literales es lo que separa estructuralmente al álgebra
  de la aritmética clásica.


  ### Desarrollo didáctico


  Piensa en el precio de una entrada al cine.

  - **Aritmética:** ''Compré 3 entradas a 5.000 pesos cada una. Total = $3 \cdot 5000
  = 15000$ pesos''. Se aplica a este cine, hoy.

  - **Álgebra:** ''Compré 3 entradas a un precio $p$. Total = $3p$''. Esta expresión
  $3p$ sirve para cuando haya ofertas, cuando suba la inflación, o para un cine en
  otro país.


  En la aritmética las cantidades tienen valores absolutos y determinados. En el álgebra,
  son valores relativos, variables o sujetos a descubrimiento.'
definiciones_clave: '- **Distinción entre Álgebra frente a Aritmética**: Elemento
  fundamental del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Distinción entre Álgebra frente a Aritmética**:
  Reglas de notación y clasificación en fundamentos y notación algebraica.'
