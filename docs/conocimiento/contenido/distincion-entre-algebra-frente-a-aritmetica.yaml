errores_frecuentes:
- Creer que la Aritmética no usa reglas o fórmulas (sí las usa, pero para números
  conocidos).
- Asumir que un cálculo algebraico siempre da una letra como resultado (puede dar
  un número exacto si se conocen o se anulan las variables).
- El Álgebra solo usa sumas y la Aritmética solo usa multiplicaciones.
- La Aritmética permite fracciones pero el Álgebra solo admite números enteros.
- El Álgebra se resuelve sin operaciones aritméticas básicas.
afirmaciones_verdaderas:
- La notación de distinción entre álgebra frente a aritmética sigue las convenciones
  del lenguaje algebraico.
