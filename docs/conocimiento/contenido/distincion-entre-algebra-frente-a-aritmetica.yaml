procedimiento:
- 'Paso 1: Observa la expresión matemática.'
- 'Paso 2: Si solo ves números explícitos y operaciones directas (5 + 8 / 2), es Aritmética.'
- 'Paso 3: Si ves letras representando partes de la operación (5x + 8 / y), es Álgebra.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar distinción entre álgebra frente a aritmética.
ejemplos:
- titulo: Comparación directa
  enunciado: 'Clasifica como Aritmética o Álgebra: a) 4 + 7 = 11, b) a + b = c'
  solucion_pasos:
  - a) 4 + 7 = 11. Solo usa números conocidos absolutos. Es Aritmética.
  - b) a + b = c. Usa letras para generalizar la suma. Es Álgebra.
- titulo: Dos analistas de datos discuten cómo programar el descuento de productos
    en una base de dato
  enunciado: 'Dos analistas de datos discuten cómo programar el descuento de productos
    en una base de datos de supermercado. El analista A propone restar $\$500$ al
    precio de hoy del champú. El analista B propone establecer una celda que tome
    el precio ''$P$'' de cualquier producto y lo multiplique por $0.8$ para aplicar
    un $20\%$ general. ¿Qué enfoques usaron respectivamente? (v1)


    Opciones: A) El analista A usó un enfoque aritmético y el B un enfoque algebraico.
    · B) Ambos usaron un enfoque aritmético. · C) Ambos usaron un enfoque algebraico.
    · D) El analista A usó un enfoque algebraico y el B un enfoque aritmético.'
  solucion_pasos:
  - El caso A es un cálculo numérico específico. El caso B generaliza sobre una variable
    $P$, lo cual es álgebra.
  - 'Respuesta: El analista A usó un enfoque aritmético y el B un enfoque algebraico.'
