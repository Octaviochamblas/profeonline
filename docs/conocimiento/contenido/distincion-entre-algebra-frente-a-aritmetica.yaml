resumen_inicial: La distinción entre álgebra y aritmética radica en que la aritmética
  opera con números determinados concretos, mientras que el álgebra opera con cantidades
  generales representadas por letras.
explicacion_simple: La aritmética responde a preguntas específicas con números concretos,
  como '¿cuánto es $7 + 4$?'. El álgebra va más lejos y responde a preguntas generales
  sobre cualquier número, como '¿qué pasa cuando sumas dos números cualesquiera?'.
  El álgebra es la generalización de la aritmética.
explicacion_formal: 'Sea $N \subset \mathbb{R}$ el dominio aritmético de constantes
  fijas. La **Transición de la Aritmética al Álgebra** representa el paso de la evaluación
  puntual $f(c)$ a la construcción funcional $f(X)$ sobre un espacio de variables
  $X$:


  $$\text{Aritmética: } c_1 + c_2 = c_3 \quad \xrightarrow{\text{Abstracción}} \quad
  \text{Álgebra: } x + y = z$$


  > **Complemento didáctico:** La aritmética proporciona los algoritmos numéricos
  particulares; el álgebra proporciona el marco estructural que justifica dichos algoritmos.'
definiciones_clave: '- **Aritmética**: Cálculo con números numéricamente explícitos
  y fijos.

  - **Álgebra**: Manipulación simbólica con variables e indeterminadas.'
propiedades_relaciones: '- **Especialización**: Sustituir todas las variables de un
  enunciado algebraico por constantes produce una proposición aritmética.'
ejemplo_guiado:
  enunciado: Compare el enunciado aritmético $5 \cdot 2 = 10$ con su generalización
    algebraica $5x = y$.
  pasos:
  - 'Paso 1: Analizar $5 \cdot 2 = 10$: evalúa dos números fijos ($5$ y $2$) dando
    un resultado único ($10$) $\to$ Aritmética.'
  - 'Paso 2: Analizar $5x = y$: relaciona la variable de entrada $x$ con el quíntuplo
    de salida $y$ para cualquier valor $\to$ Álgebra.'
  - 'Conclusión: La aritmética calcula un caso particular; el álgebra modela la relación
    de proporcionalidad general.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la diferencia fundamental entre el enfoque aritmético y el enfoque
    algebraico?
  choices:
  - text: La aritmética opera con números fijos específicos, mientras que el álgebra
      opera con variables simbólicas generales
    is_correct: true
  - text: La aritmética no usa números positivos
    is_correct: false
  - text: El álgebra prohibe la multiplicación
    is_correct: false
  - text: La aritmética sólo se usa para fracciones
    is_correct: false
  explanation: La alternativa correcta es 'La aritmética opera con números fijos específicos,
    mientras que el álgebra opera con variables simbólicas generales'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿qué representa la igualdad 5x = y en comparación
    con 5 * 2 = 10?
  choices:
  - text: La generalización algebraica de calcular el quíntuplo de cualquier número
      x
    is_correct: true
  - text: Una operación aritmética fija
    is_correct: false
  - text: Un error de cálculo
    is_correct: false
  - text: Un número primo
    is_correct: false
  explanation: La alternativa correcta es 'La generalización algebraica de calcular
    el quíntuplo de cualquier número x'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si los elementos del enunciado son números fijos o variables
  literales.'
- 'Paso 2: Determinar si se busca un resultado puntual o una regla general.'
- 'Paso 3: Clasificar el procedimiento como aritmético o algebraico.'
errores_correccion: '- **Error 1: Tratar la expresión $a + b$ como inacabada por no
  dar un número único de respuesta.** **Cómo corregirlo:** En álgebra, $a + b$ es
  en sí misma la respuesta que representa la suma de dos cantidades generales.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes operaciones corresponde al campo de la aritmética
    pura?
  alternativas:
  - 12 + 15 = 27
  - 2x + 3y
  - a^2 + b^2 = c^2
  - f(x) = x + 1
  respuesta: 12 + 15 = 27
  solucion_pasos:
  - 1. 12 + 15 = 27 involucra únicamente constantes numéricas explícitas sin letras.
    Es aritmética.
- titulo: Ejemplo 2
  enunciado: Si sustituimos x = 3 en la expresión algebraica 4x, obtenemos 12. ¿Qué
    transición se ejecutó?
  alternativas:
  - De una expresión algebraica general a una evaluación aritmética particular
  - De aritmética a geometría
  - De una ecuación a una suma
  - Indeterminado
  respuesta: De una expresión algebraica general a una evaluación aritmética particular
  solucion_pasos:
  - 1. Reemplazar variables por números concretos especializa el álgebra en aritmética.
- titulo: ¿Es la aritmética un caso particular del álgebra en el que las variables
    toman valores constantes fijos?
  respuesta: Sí
  solucion_pasos:
  - Sí, fijar las variables en números específicos convierte las expresiones algebraicas
    en operaciones aritméticas.
- titulo: ¿Requiere una expresión algebraica como x + y dar obligatoriamente un número
    concreto como resultado inmediato?
  respuesta: 'No'
  solucion_pasos:
  - No, la expresión x + y es en sí misma una representación simbólica válida y completa.
errores_frecuentes:
- Declarar incompleta una expresión algebraica como a + b por no reducirse a un único
  número.
- Declarar la evaluación numérica de una variable con la eliminación del concepto
  algebraico.
- Declarar que las reglas de los signos en aritmética no aplican en el álgebra.
- Declarar que la aritmética es superior al álgebra en nivel de abstracción.
- Intentar a la letra x como si fuera siempre una multiplicación en notación aritmética.
afirmaciones_verdaderas:
- La aritmética trabaja con cantidades conocidas y fijas; el álgebra trabaja con cantidades
  generales y variables.
- Sustituir números en las variables de una fórmula algebraica transforma la expresión
  en una evaluación aritmética.
al_terminar_debes_poder: Al terminar serás capaz de diferenciar el cálculo aritmético
  puntual de la representación algebraica general.
