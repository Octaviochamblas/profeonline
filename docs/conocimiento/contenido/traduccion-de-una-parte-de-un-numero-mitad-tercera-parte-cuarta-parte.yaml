semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.PARTE_NUMERO
resumen_inicial: La traducción de una parte de un número consiste en expresar simbólicamente la división de una variable o cantidad entre un divisor entero constante (mitad, tercera parte, cuarta parte, quinta parte, etc.).
explicacion_simple: "Una **parte de un número** expresa la división o fraccionamiento de esa cantidad mediante una **división**:\n- En álgebra, una parte se escribe como una **fracción donde la variable va arriba en el numerador** y el divisor va abajo:\n  - **La mitad** de un número $x \\implies \\mathbf{\\frac{x}{2}}$ (o $\\frac{1}{2}x$, dividir por 2).\n  - **La tercera parte** de un número $x \\implies \\mathbf{\\frac{x}{3}}$ (o $\\frac{1}{3}x$, dividir por 3).\n  - **La cuarta parte** de un número $x \\implies \\mathbf{\\frac{x}{4}}$ (o $\\frac{1}{4}x$, dividir por 4).\n  - **La quinta parte** de un número $x \\implies \\mathbf{\\frac{x}{5}}$ (o $\\frac{1}{5}x$, dividir por 5).\n- **¡Cuidado con la trampa!** No confundas multiplicadores como \"el triple\" ($3x$) con fraccionadores como \"la tercera parte\" ($\\frac{x}{3}$). \"Múltiplo\" multiplica; \"parte\" divide.\n\n![Partes Fraccionarias de un Número](/static/img/nodos/traduccion-de-una-parte-de-un-numero-mitad-tercera-parte-cuarta-parte-intro.svg)\n"
explicacion_formal: '### Definición formal

  La traducción de la **$n$-ésima parte** mapea una cantidad variable $x \in \mathbb{R}$ y un divisor entero constante $n \in \mathbb{Z}^+$ ($n \ge 2$) en el cociente fraccionario escalar $D_n(x) \in \mathbb{R}(x)$:


  $$D_n(x) = \frac{x}{n} = \frac{1}{n} \cdot x = n^{-1} \cdot x$$


  ### Tabla de Correspondencia Numérica de Partes y Fracciones


  $$\begin{array}{|c|c|c|c|}

  \hline

  \text{\textbf{Término verbal}} & \text{\textbf{Divisor ($n$)}} & \text{\textbf{Forma fraccionaria}} & \text{\textbf{Forma operador}} \\

  \hline

  \text{La mitad de } x & 2 & \frac{x}{2} & \frac{1}{2}x \\

  \text{La tercera parte de } x & 3 & \frac{x}{3} & \frac{1}{3}x \\

  \text{La cuarta parte de } x & 4 & \frac{x}{4} & \frac{1}{4}x \\

  \text{La quinta parte de } x & 5 & \frac{x}{5} & \frac{1}{5}x \\

  \text{La décima parte de } x & 10 & \frac{x}{10} & \frac{1}{10}x \\

  \hline

  \end{array}$$


  ### Síntesis didáctica

  Las partes de un número representan coeficientes escalares racionales $c \in \mathbb{Q}$. Son indispensables en el planteamiento de proporciones, porcentajes y problemas de repartición aditiva.

  '
definiciones_clave: '- **Parte de un número**: Expresión $\frac{x}{n}$ que resulta de dividir la variable $x$ entre un entero constante $n$.

  - **Divisor fraccionario ($n$)**: Número entero en el denominador que indica en cuántas partes iguales se divide la cantidad.

  - **Coeficiente racional ($\frac{1}{n}$)**: Factor escalar multiplicativo equivalente a la división por $n$.

  '
propiedades_relaciones: '- **Equivalencia de notación**: Escribir $\frac{x}{n}$ es exactamente idéntico a escribir $\frac{1}{n}x$. Ambas representaciones son válidas y equivalentes.

  - **Inversión respecto a los múltiplos**: La $n$-ésima parte es el inverso multiplicativo del $n$-ésimo múltiplo ($D_n(x) = \frac{1}{M_n(x)}$ en operadores).

  '
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "La suma entre la tercera parte de un número $x$ y la quinta parte de otro número $y$".'
  pasos:
  - 'Paso 1: Traducimos "La tercera parte de un número $x$": Dividir entre $3 \implies \frac{x}{3}$.'
  - 'Paso 2: Traducimos "La quinta parte de otro número $y$": Dividir entre $5 \implies \frac{y}{5}$.'
  - 'Paso 3: Unimos ambas partes mediante la operación de adición $\implies +$.'
  - 'Conclusión: La expresión algebraica traducida es **$\frac{x}{3} + \frac{y}{5}$** (o $\frac{1}{3}x + \frac{1}{5}y$).'
  imagen: /static/img/nodos/traduccion-de-una-parte-de-un-numero-mitad-tercera-parte-cuarta-parte-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cómo se representa algebraicamente el enunciado "La cuarta parte de una cantidad $m$"? '
  choices:
  - text: 'Se representa dividiendo la variable entre 4: $\frac{m}{4}$ (o $\frac{1}{4}m$)'
    is_correct: true
  - text: 'Se representa multiplicando la variable por 4: $4m$'
    is_correct: false
  - text: 'Se representa restando 4 a la variable: $m - 4$'
    is_correct: false
  - text: 'Se representa elevando la variable a 4: $m^4$'
    is_correct: false
  explanation: 'La alternativa correcta es ''Se representa dividiendo la variable entre 4: $\frac{m}{4}$ (o $\frac{1}{4}m$)''. Cuarta parte equivale a dividir por 4.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la diferencia traducida entre "El triple de $x$" y "La tercera parte de $x$"?
  choices:
  - text: '"El triple" es la multiplicación por 3 ($3x$), mientras que "la tercera parte" es la división entre 3 ($\frac{x}{3}$)'
    is_correct: true
  - text: Ambas frases se traducen como la misma expresión $3x$
    is_correct: false
  - text: '"El triple" suma 3 y "la tercera parte" resta 3'
    is_correct: false
  - text: '"El triple" eleva al cubo y "la tercera parte" calcula la raíz cúbica'
    is_correct: false
  explanation: La alternativa correcta es '"El triple" es la multiplicación por 3 ($3x$), mientras que "la tercera parte" es la división entre 3 ($\frac{x}{3}$)'. Múltiplo vs Parte.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el término ordinal que expresa fraccionamiento ("mitad", "tercera parte", "cuarta parte", "quinta parte").'
- 'Paso 2: Determinar el número divisor entero asociado ($2, 3, 4, 5$).'
- 'Paso 3: Escribir la variable en el numerador de una fracción y el número divisor en el denominador ($\frac{x}{n}$).'
- 'Paso 4: Si la parte afecta a una expresión compuesta, colocar la expresión completa en el numerador ($\frac{A + B}{n}$).'
errores_correccion: '- **Error 1:** Escribir el producto $3x$ al traducir "la tercera parte de $x$". **Cómo corregirlo:** "La tercera parte" **divide por 3 ($\frac{x}{3}$)**; "el triple" multiplica por 3 ($3x$).

  - **Error 2:** Colocar el divisor en el numerador (escribir $\frac{3}{x}$ para "la tercera parte de $x$"). **Cómo corregirlo:** La variable **va en el NUTERADOR ($\frac{x}{3}$)**; si pones la letra abajo estarías traduciendo $3$ dividido entre $x$.

  '
ejemplos:
- titulo: Mitad y tercera parte
  enunciado: ¿Cuál es la traducción de "La mitad de $a$ más la tercera parte de $b$"?
  alternativas:
  - $\frac{a}{2} + \frac{b}{3}$
  - $2a + 3b$
  - $\frac{2}{a} + \frac{3}{b}$
  respuesta: $\frac{a}{2} + \frac{b}{3}$
  solucion_pasos:
  - 1. Mitad de $a \to \frac{a}{2}$.
  - 2. Tercera parte de $b \to \frac{b}{3}$.
  - '3. Suma: $\frac{a}{2} + \frac{b}{3}$.'
- titulo: Parte de una suma
  enunciado: ¿Cuál es la traducción de "La mitad de la suma entre $x$ y $6$"?
  alternativas:
  - $\frac{x + 6}{2}$
  - $\frac{x}{2} + 6$
  - $2(x + 6)$
  respuesta: $\frac{x + 6}{2}$
  solucion_pasos:
  - 1. La suma es $(x + 6)$.
  - 2. La mitad de esa suma es $\frac{x + 6}{2}$.
- titulo: Notación equivalente
  enunciado: ¿Es la expresión $\frac{x}{5}$ idéntica a $\frac{1}{5}x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la multiplicación de fracciones $\frac{1}{5} \cdot \frac{x}{1} = \frac{x}{5}$.
- titulo: Cuarta parte
  enunciado: La traducción de "La cuarta parte de $n$", ¿es $\frac{n}{4}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, dividir entre 4 representa la cuarta parte.
errores_frecuentes:
- Escribir la multiplicación 3x al traducir la frase la tercera parte de un número.
- Colocar la variable en el denominador escribiendo 3/x al traducir la tercera parte de x.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Representar la mitad de un número como la raíz cuadrada del mismo.
- La fracción completa no se aplica al dividir una resta compuesta entre dos.
afirmaciones_verdaderas:
- La traducción de una parte de una cantidad divide a la variable entre su respectivo divisor entero.
- Las expresiones x/n y (1/n)x son representaciones matemáticamente equivalentes.
al_terminar_debes_poder: '![Resumen de parte de un número](/static/img/nodos/traduccion-de-una-parte-de-un-numero-mitad-tercera-parte-cuarta-parte-resumen.svg)


  QUÉ: Traducir partes fraccionarias de una cantidad (mitad, tercera parte, cuarta parte) a notación algebraica.


  CÓMO: Representar la división de la variable por la constante natural correspondiente en formato apilado $\frac{x}{n}$ o mediante multiplicación por la fracción unitaria $\frac{1}{n}x$.'
