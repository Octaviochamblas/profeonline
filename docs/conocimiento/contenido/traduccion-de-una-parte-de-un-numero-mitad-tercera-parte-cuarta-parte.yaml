resumen_inicial: La traducción de una parte de un número en lenguaje algebraico vincula
  enunciados verbales con expresiones matemáticas precisas.
explicacion_simple: Para expresar una parte de un número, identificamos las letras
  que representan los números y usamos el símbolo matemático adecuado.
explicacion_formal: 'Sea $x, y \in \mathbb{R}$. La **Traducción de Una parte de un
  número** establece la asignación:


  $$\text{"la quinta parte de un número y"} \implies y / 5$$


  > **Complemento didáctico:** Esta traducción permite formalizar algebraicamente
  enunciados verbales en el dominio real.'
definiciones_clave: '- **Una parte de un número**: Representación simbólica en lenguaje
  algebraico.'
propiedades_relaciones: '- **Coherencia operacional**: y / 5 conserva el significado
  semántico del enunciado.'
ejemplo_guiado:
  enunciado: 'Traduzca a lenguaje algebraico: ''la quinta parte de un número y''.'
  pasos:
  - 'Paso 1: Identificar las cantidades y variables.'
  - 'Paso 2: Aplicar la operación correspondiente.'
  - 'Conclusión: La expresión exacta es y / 5.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la representación algebraica de 'la quinta parte de un número
    y'?
  choices:
  - text: y / 5
    is_correct: true
  - text: y - 5
    is_correct: false
  - text: 5y
    is_correct: false
  - text: y^5
    is_correct: false
  explanation: La alternativa correcta es 'y / 5'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'la quinta parte de un número y', ¿cuál fue
    la expresión obtenida?
  choices:
  - text: y / 5
    is_correct: true
  - text: y - 5
    is_correct: false
  - text: 5y
    is_correct: false
  - text: y^5
    is_correct: false
  explanation: La alternativa correcta es 'y / 5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado identificando variables.'
- 'Paso 2: Escribir los operadores correspondientes.'
- 'Paso 3: Verificar el resultado.'
errores_correccion: '- **Error 1: Invertir términos al traducir una parte de un número.**
  **Cómo corregirlo:** Mantener el orden sintáctico adecuado de los operandos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se expresa algebraicamente 'la quinta parte de un número y'?
  alternativas:
  - y / 5
  - y - 5
  - 5y
  - y^5
  respuesta: y / 5
  solucion_pasos:
  - 1. Analizar las variables.
  - 2. Traducir al símbolo y / 5.
- titulo: Ejemplo 2
  enunciado: ¿Qué expresión traduce de forma correcta el enunciado de una parte de
    un número 'la quinta parte de un número y'?
  alternativas:
  - y / 5
  - y - 5
  - 5y
  - y^5
  respuesta: y / 5
  solucion_pasos:
  - 1. Revisar la operación principal.
  - 2. Confirmar que la opción correcta es y / 5.
- titulo: ¿Representa y / 5 el enunciado 'la quinta parte de un número y'?
  respuesta: Sí
  solucion_pasos:
  - Sí, coincide exactamente con el enunciado verbal.
- titulo: ¿Es la suma directa equivalente a y / 5?
  respuesta: 'No'
  solucion_pasos:
  - No, cada operador matemático tiene un significado único.
errores_frecuentes:
- Invertir el orden de los elementos al traducir la frase de una parte de un número.
- Multiplicar en lugar de dividir o restar según corresponda en una parte de un número.
- Representar la adición de términos mediante la elevación a exponentes en una parte
  de un número.
- Reemplazar variables por valores constantes específicos sin razón lógica.
- Omitir delimitadores de agrupamiento en expresiones compuestas de una parte de un
  número.
afirmaciones_verdaderas:
- La expresión y / 5 representa la traducción fiel de una parte de un número.
- Las variables permiten modelar cualquier caso en una parte de un número.
al_terminar_debes_poder: Al terminar serás capaz de traducir enunciados sobre una
  parte de un número construyendo la expresión algebraica y / 5 de manera correcta.
