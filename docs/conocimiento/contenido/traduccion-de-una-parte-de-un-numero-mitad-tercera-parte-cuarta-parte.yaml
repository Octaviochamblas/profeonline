semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.PARTE_NUMERO
resumen_inicial: 'Traducción de una parte de un número (mitad, tercera parte, cuarta
  parte, …): traducción, reglas y aplicación práctica en Lenguaje algebraico: operaciones
  y múltiplos.'
explicacion_simple: En español existe una diferencia sutil pero catastrófica entre
  'El doble' y 'La mitad'. Uno te hace rico, el otro te quita dinero. El lenguaje
  algebraico debe captar estas sutilezas sin margen de error.
explicacion_formal: "### Definición formal\n\nLa palabra 'parte' invoca un fraccionamiento,\
  \ una división de la entidad.\n\n### Desarrollo didáctico\n\nAnálisis comparativo\
  \ para no perder claridad:\n- 'Doble' $\\rightarrow$ Multiplica por 2 ($2x$). \n\
  - 'Mitad' o 'media parte' $\\rightarrow$ Divide por 2 ($\\frac{x}{2}$).\n\n- 'Tercero'\
  \ o 'El triple' $\\rightarrow$ Multiplica por 3 ($3x$).\n- 'Tercera parte' $\\rightarrow$\
  \ Divide por 3 ($\\frac{x}{3}$).\n\n- 'Cuádruple' $\\rightarrow$ Multiplica por\
  \ 4 ($4x$).\n- 'Cuarta parte' $\\rightarrow$ Divide por 4 ($\\frac{x}{4}$).\n\n\
  La palabra adecuado que indica que la constante va al sótano (al denominador) es\
  \ la palabra **'parte'**."
definiciones_clave: '- **Traducción de una parte de un número (mitad, tercera parte,
  cuarta parte, …)**: Herramienta clave para pasar del lenguaje natural al lenguaje
  algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de una parte de un número (mitad, tercera parte, cuarta
  parte, …).'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de traducción
    de una parte de un número (mitad, tercera parte, cuarta parte, …).
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a traducción de una parte de
    un número (mitad, tercera parte, cuarta parte, …).
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
