semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.SENTIDO_POSITIVO
resumen_inicial: 'Convenio de signos para giros angulares: rotación antihoraria es positiva ($+\theta$) y rotación horaria es negativa ($-\theta$).'
explicacion_simple: |
  En matemáticas y física existe una regla universal para saber hacia dónde gira un ángulo. Si el lado terminal gira en sentido contrario a las agujas del reloj (hacia arriba desde el eje horizontal positivo), se dice que la rotación es **positiva** ($+\theta$). Si el rayo gira a favor de las agujas del reloj (hacia abajo), la rotación es **negativa** ($-\theta$). Por ejemplo, girar $+90^\circ$ te lleva al semieje positivo de las $y$, mientras que girar $-90^\circ$ te lleva al semieje negativo de las $y$.
explicacion_formal: |
  ### Definición formal
  El **sentido de rotación angular** en el plano cartesiano define la orientación del ángulo $\theta$ según el convenio goniométrico estándar:
  - **Rotación Positiva ($\theta > 0$)**: Rotación en sentido **antihorario** (counterclockwise), desde el semieje $+X$ hacia el semieje $+Y$.
  - **Rotación Negativa ($\theta < 0$)**: Rotación en sentido **horario** (clockwise), desde el semieje $+X$ hacia el semieje $-Y$.

  ### Desglose simbólico
  - $+\theta$: Ángulo orientado en sentido antihorario.
  - $-\theta$: Ángulo orientado en sentido horario.
  - $\theta_{\text{pos}} = 360^\circ - |\theta_{\text{neg}}|$: Relación entre ángulos equivalentes de sentidos opuestos dentro de un giro completo.

  ### Síntesis didáctica
  El signo del ángulo no indica una longitud negativa, sino la dirección del movimiento de rotación. Permite diferenciar inmediatamente si se partió hacia arriba (I cuadrante) o hacia abajo (IV cuadrante) desde el eje positivo $X$.
definiciones_clave: |
  - **Sentido antihorario (positivo)**: Giro en dirección opuesta al avance de las agujas del reloj ($\theta > 0$).
  - **Sentido horario (negativo)**: Giro en la misma dirección del avance de las agujas del reloj ($\theta < 0$).
  - **Ángulo orientado**: Ángulo dotado de magnitud y signo de dirección de rotación.
propiedades_relaciones: |
  - **Paridad trigonométrica del signo**:
    - El coseno absorbe el signo negativo (función par): $\cos(-\theta) = \cos(\theta)$.
    - El seno preserva el signo negativo (función impar): $\sin(-\theta) = -\sin(\theta)$.
ejemplo_guiado:
  enunciado: 'Un rayo gira desde el semieje $+X$ una cantidad de $60^\circ$ a favor de las agujas del reloj. Expresa el ángulo con su signo correspondiente e identifica su posición cuadrantal equivalente positiva.'
  pasos:
    - 'Paso 1: Dado que la rotación se realiza a favor de las agujas del reloj (sentido horario), el signo asignado es negativo: $\theta = -60^\circ$.'
    - 'Paso 2: Calcular el ángulo equivalente en sentido positivo sumando un giro completo de $360^\circ$: $\theta_{\text{pos}} = -60^\circ + 360^\circ = 300^\circ$.'
    - 'Paso 3: Evaluar la posición: $270^\circ < 300^\circ < 360^\circ$.'
    - 'Paso 4: El ángulo cae en el **Cuarto Cuadrante (IV C)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué dirección de giro corresponde a un ángulo con signo positivo ($\theta > 0$)?'
    choices:
      - {text: 'Sentido antihorario (contrario a las agujas del reloj)', is_correct: true}
      - {text: 'Sentido horario (a favor de las agujas del reloj)', is_correct: false}
      - {text: 'Cualquier dirección indistintamente', is_correct: false}
      - {text: 'Dirección rectilínea sobre el eje Y', is_correct: false}
    explanation: 'La alternativa correcta es ''Sentido antihorario (contrario a las agujas del reloj)''. Es el convenio universal de signos en trigonometría.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el ángulo positivo equivalente a una rotación de $-90^\circ$?'
    choices:
      - {text: '$270^\circ$', is_correct: true}
      - {text: '$90^\circ$', is_correct: false}
      - {text: '$180^\circ$', is_correct: false}
      - {text: '$360^\circ$', is_correct: false}
    explanation: 'La alternativa correcta es ''$270^\circ$''. Sumando un giro completo: $-90^\circ + 360^\circ = 270^\circ$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el lado inicial del ángulo en el semieje $+X$.'
  - 'Paso 2: Observar la dirección de la rotación.'
  - 'Paso 3: Asignar signo positivo $+$ si la rotación es antihoraria o signo negativo $-$ si es horaria.'
  - 'Paso 4: Para hallar el equivalente positivo de un ángulo negativo $-\theta$, sumar $360^\circ$ (o $2\pi$ rad).'
errores_correccion: |
  - **Error 1:** Creer que un ángulo negativo representa una imposibilidad matemática. **Cómo corregirlo:** En trigonometría los ángulos miden rotación orientada; un signo negativo indica únicamente que el giro se efectuó en sentido horario.
  - **Error 2:** Confundir el sentido antihorario con la dirección de las manecillas del reloj. **Cómo corregirlo:** Recuerda que las agujas del reloj avanzan hacia la derecha por arriba; el sentido antihorario gira hacia la izquierda por arriba (hacia el semieje $+Y$).
ejemplos:
  - titulo: 'Rotación de 90 grados antihoraria'
    enunciado: 'Un rayo gira $90^\circ$ en sentido contrario a las manecillas del reloj. ¿Cuál es la medida orientada del ángulo?'
    alternativas:
      - '$+90^\circ$'
      - '$-90^\circ$'
      - '$270^\circ$'
    respuesta: '$+90^\circ$'
    solucion_pasos:
      - '1. Giro antihorario implica signo positivo.'
      - '2. La medida es $+90^\circ$, llegando al semieje $+Y$.'
  - titulo: 'Equivalente positivo de ángulo negativo'
    enunciado: '¿Cuál es el ángulo positivo equivalente a $\theta = -45^\circ$?'
    alternativas:
      - '$315^\circ$'
      - '$225^\circ$'
      - '$135^\circ$'
    respuesta: '$315^\circ$'
    solucion_pasos:
      - '1. Sumamos $360^\circ$ al ángulo negativo.'
      - '2. $-45^\circ + 360^\circ = 315^\circ$.'
  - titulo: 'Giro horario en el cuarto cuadrante'
    enunciado: '¿Un giro de $-30^\circ$ ubica al lado terminal en el cuarto cuadrante?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al bajar $30^\circ$ desde $+X$, el rayo ingresa directamente al IV Cuadrante.'
  - titulo: 'Signo de rotación nula'
    enunciado: '¿Un ángulo de $0^\circ$ carece de sentido de giro por no realizar rotación?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en $0^\circ$ el lado terminal y el lado inicial coinciden exactamente sin desplazar rotación.'
errores_frecuentes:
  - 'La afirmación de que el sentido de giro horario asigna un signo positivo al ángulo.'
  - 'La afirmación de que los ángulos negativos son magnitudes geométricamente inexistentes.'
  - 'La afirmación de que un ángulo de $-180^\circ$ llega a una posición distinta que uno de $+180^\circ$.'
  - 'La afirmación de que el sentido antihorario significa girar hacia abajo desde el semieje positivo X.'
  - 'La afirmación de que la incorporación de $360^\circ$ a un ángulo negativo altera la posición de su lado terminal.'
afirmaciones_verdaderas:
  - 'La rotación en sentido antihorario asigna un signo positivo al ángulo ($\theta > 0$).'
  - 'Sumar $360^\circ$ a un ángulo negativo da como resultado un ángulo positivo que comparte exactamente la misma posición terminal.'
al_terminar_debes_poder: |
  QUÉ: Identificar y asignar el signo correcto a la rotación de un ángulo según su dirección de giro.
  CÓMO: Reconocer la convención positiva antihoraria y negativa horaria, calculando giros equivalentes en $360^\circ$.
