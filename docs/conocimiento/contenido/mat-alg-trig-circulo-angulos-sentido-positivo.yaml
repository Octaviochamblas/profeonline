semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.SENTIDO_POSITIVO
resumen_inicial: 'Interpretación del sentido positivo de giro en el círculo unitario:
  círculo unitario, amplitud, período y transformaciones de Círculo unitario y sistemas
  de medida.'
explicacion_simple: 'La dirección en que se gira el lado terminal de un ángulo no
  es indiferente: existe una convención que asigna signo a cada sentido de rotación.'
explicacion_formal: '### Definición formal


  Por convención, un ángulo $\theta>0$ corresponde a una rotación en sentido antihorario
  (contrario a las manecillas del reloj) desde el lado inicial; un ángulo $\theta<0$
  corresponde a una rotación en sentido horario. El valor absoluto de $\theta$ indica
  la magnitud del giro, independiente del sentido.


  ### Desarrollo didáctico


  Un giro de $90°$ en sentido antihorario lleva el lado terminal desde el semieje
  positivo $x$ hasta el semieje positivo $y$. Un giro de $-90°$ (sentido horario)
  lleva el lado terminal desde el semieje positivo $x$ hasta el semieje negativo $y$:
  llegan a puntos distintos.'
definiciones_clave: '- **Interpretación del sentido positivo de giro en el círculo
  unitario**: Función periódica fundamentada en las coordenadas del círculo unitario
  o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a interpretación del sentido positivo de giro en el círculo unitario.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    interpretación del sentido positivo de giro en el círculo unitario.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de interpretación del sentido positivo de giro en el círculo
    unitario.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
