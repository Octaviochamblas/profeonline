procedimiento:
- 'Paso 1: Determina el signo del ángulo dado.'
- 'Paso 2: Si es positivo, gira el lado terminal en sentido antihorario.'
- 'Paso 3: Si es negativo, gira el lado terminal en sentido horario.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en interpretación del sentido
  positivo de giro en el círculo unitario.
ejemplos:
- titulo: Identificación del sentido de un ángulo positivo
  enunciado: ¿En qué sentido se mide un ángulo de $60°$?
  solucion_pasos:
  - El signo positivo indica sentido antihorario.
  - Se gira en sentido antihorario desde el semieje positivo $x$.
- titulo: Identificación del sentido de un ángulo negativo
  enunciado: ¿En qué sentido se mide un ángulo de $-45°$?
  solucion_pasos:
  - El signo negativo indica sentido horario.
  - Se gira en sentido horario desde el semieje positivo $x$.
- titulo: ¿Un ángulo de $90°$ y uno de $-90°$ terminan en el mismo punto del círculo
    unitario?
  enunciado: ¿Un ángulo de $90°$ y uno de $-90°$ determinan el mismo punto sobre el
    círculo unitario?
  respuesta: 'No'
  solucion_pasos:
  - Uno termina en $(0,1)$ y el otro en $(0,-1)$, puntos distintos.
- titulo: ¿El sentido antihorario corresponde siempre a ángulos positivos?
  enunciado: ¿Por convención, el sentido antihorario siempre corresponde a ángulos
    con signo positivo?
  respuesta: Sí
  solucion_pasos:
  - Es la convención estándar universal en trigonometría.
errores_frecuentes:
- Declarar el sentido antihorario con el horario al interpretar el signo del ángulo.
- Suponer que un ángulo positivo y su opuesto negativo terminan en el mismo punto.
- No aplicar la convención de signos al construir el ángulo en el plano.
- Omitir que el valor absoluto solo indica la magnitud, no el sentido de la rotación.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  interpretación del sentido positivo de giro en el círculo unitario.
