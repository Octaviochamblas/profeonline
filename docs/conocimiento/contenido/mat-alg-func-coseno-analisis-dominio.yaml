semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.DOMINIO
resumen_inicial: 'Determinación del dominio de la función coseno $f(x) = \cos(x)$ compuesto por la totalidad de los números reales $\mathbb{R}$.'
explicacion_simple: |
  El **dominio** de una función representa todos los valores de entrada ($x$) que se le pueden entregar sin que la función falle o se rompa. Puesto que podemos dar vueltas infinitas al círculo unitario tanto en sentido positivo (hacia la derecha) como en sentido negativo (hacia la izquierda), no existe ninguna restricción para el ángulo $x$. Por esta razón, el dominio de la función coseno es el conjunto de todos los números reales, desde menos infinito hasta más infinito ($-\infty, \infty$).
explicacion_formal: |
  ### Definición formal
  El **dominio de la función coseno base** $f(x) = \cos(x)$ se define formalmente en el análisis real como el conjunto de todos los números reales:
  $$\operatorname{Dom}(f) = \{x \in \mathbb{R}\} = \mathbb{R} = (-\infty, +\infty)$$
  ya que para cualquier ángulo $x \in \mathbb{R}$ existe un único valor bien definido $y = \cos(x)$ en el plano cartesiano.

  ### Desglose simbólico
  - $\mathbb{R}$: Conjunto universal de los números reales.
  - Ausencia de restricciones algebraicas:
    - No hay divisiones por cero: $\cos(x)$ no se expresa como un cociente con denominador nulo.
    - No hay raíces pares de números negativos.
    - No hay restricciones de logaritmos.

  ### Síntesis didáctica
  Que el dominio sea todo $\mathbb{R}$ significa que la función coseno existe para cualquier valor de entrada. No importa si el argumento es un número entero gigante, una fracción de $\pi$, un número irracional o un número negativo; el coseno siempre entregará una respuesta definida.
definiciones_clave: |
  - **Dominio ($\operatorname{Dom}$)**: Conjunto de todos los valores reales de entrada para los cuales la función está matemáticamente definida.
  - **Dominio ilimitado**: Ausencia de barreras verticales o huecos en el eje horizontal $X$.
  - **Continuidad en $\mathbb{R}$**: Propiedad funcional por la cual no existen asíntotas ni saltos de definición.
propiedades_relaciones: |
  - **Compatibilidad de unidades**: Aunque $x$ se interpreta habitualmente como radianes, computacional y funcionalmente representa cualquier número escalar real.
  - **Extensión a transformaciones**: En funciones de la forma $f(x) = A\cos(Bx + C) + D$, el dominio continúa siendo estrictamente todo $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Determina si los valores $x_1 = -500\pi$ y $x_2 = \sqrt{3}$ pertenecen al dominio de la función $f(x) = \cos(x)$ y justifica.'
  pasos:
    - 'Paso 1: Recordar el dominio formal de la función coseno base: $\operatorname{Dom}(f) = \mathbb{R}$.'
    - 'Paso 2: Evaluar $x_1 = -500\pi$: como es un múltiplo entero de $\pi$, pertenece al conjunto de los números reales ($\mathbb{R}$). Pertenece al dominio.'
    - 'Paso 3: Evaluar $x_2 = \sqrt{3}$: como es un número irracional real, pertenece al conjunto de los números reales ($\mathbb{R}$). Pertenece al dominio.'
    - 'Paso 4: Concluir que ambos valores forman parte del dominio de la función y producen resultados numéricos bien definidos.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el dominio exacto de la función coseno fundamental $f(x) = \cos(x)$?'
    choices:
      - {text: 'El conjunto de todos los números reales $\mathbb{R} = (-\infty, +\infty)$', is_correct: true}
      - {text: 'El intervalo cerrado $[-1, 1]$', is_correct: false}
      - {text: 'El intervalo semiabierto $[0, 2\pi[$', is_correct: false}
      - {text: 'Únicamente los números reales positivos $\mathbb{R}^+$', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto de todos los números reales $\mathbb{R} = (-\infty, +\infty)$''. La función coseno está definida para cualquier argumento real.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Presenta la función coseno $f(x) = \cos(x)$ alguna restricción o asíntota vertical en su dominio?'
    choices:
      - {text: 'No, no presenta restricciones ni asíntotas en todo $\mathbb{R}$', is_correct: true}
      - {text: 'Sí, tiene asíntotas en los múltiplos de $\pi$', is_correct: false}
      - {text: 'Sí, tiene una indeterminación en $x = \frac{\pi}{2}$', is_correct: false}
      - {text: 'Sí, sólo está definida para ángulos entre $0^\circ$ y $90^\circ$', is_correct: false}
    explanation: 'La alternativa correcta es ''No, no presenta restricciones ni asíntotas en todo $\mathbb{R}$''. Es continua y derivable en todo el plano real.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la estructura del argumento de la función coseno.'
  - 'Paso 2: Comprobar la ausencia de indeterminaciones algebraicas (división por cero o raíces pares negativas).'
  - 'Paso 3: Concluir que la variable independiente $x$ puede asumir cualquier número real.'
  - 'Paso 4: Escribir el dominio como $\operatorname{Dom}(f) = \mathbb{R} = (-\infty, +\infty)$.'
errores_correccion: |
  - **Error 1:** Confundir el dominio (entradas en el eje X) con el recorrido (salidas en el eje Y $[-1,1]$). **Cómo corregirlo:** El dominio se refiere a los ángulos aceptados en el eje $X$ ($\mathbb{R}$), mientras que $[-1,1]$ es el recorrido o rango de la función.
  - **Error 2:** Creer que el dominio del coseno se limita únicamente a un ciclo $[0, 2\pi]$. **Cómo corregirlo:** Un ciclo $[0, 2\pi]$ se usa para graficar un período, pero el dominio matemático abarca la totalidad de la recta real $\mathbb{R}$.
ejemplos:
  - titulo: 'Dominio para ángulos negativos'
    enunciado: '¿Está definido el valor de $f(-100)$ en la función $f(x) = \cos(x)$?'
    alternativas:
      - 'Sí, pues $-100 \in \mathbb{R}$'
      - 'No, el coseno no acepta negativos'
      - 'No, debe ser menor a $-2\pi$'
    respuesta: 'Sí, pues $-100 \in \mathbb{R}$'
    solucion_pasos:
      - '1. $-100$ es un número real.'
      - '2. Dado que $\operatorname{Dom}(f) = \mathbb{R}$, $-100$ pertenece al dominio.'
  - titulo: 'Dominio en trasformación lineal'
    enunciado: '¿Cuál es el dominio de la función transformada $g(x) = 4\cos(3x + \pi) - 2$?'
    alternativas:
      - 'Todos los números reales $\mathbb{R}$'
      - 'El intervalo $[-4, 4]$'
      - 'El intervalo $[0, 2\pi]$'
    respuesta: 'Todos los números reales $\mathbb{R}$'
    solucion_pasos:
      - '1. Las transformaciones de amplitud o fase no imponen restricciones al eje X.'
      - '2. El dominio sigue siendo $\mathbb{R}$.'
  - titulo: 'Pertenencia de cero al dominio'
    enunciado: '¿El número $0$ pertenece al dominio de la función coseno?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\cos(0) = 1$ está perfectamente definido.'
  - titulo: 'Dominio de funciones irracionales en el argumento'
    enunciado: '¿Un valor irracional como $x = \sqrt{2}\pi$ pertenece al dominio de la función coseno?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\sqrt{2}\pi \in \mathbb{R}$.'
errores_frecuentes:
  - 'La afirmación de que el dominio de la función coseno está restringido al intervalo $[-1, 1]$.'
  - 'La afirmación de que el dominio del coseno se compone únicamente del intervalo de un ciclo $[0, 2\pi]$.'
  - 'La afirmación de que la función coseno no acepta números reales negativos como argumento.'
  - 'La afirmación de que la función coseno se indefine para valores gigantescos de $x$.'
  - 'La afirmación de que el dominio del coseno cambia si el ángulo se mide en grados en lugar de radianes.'
afirmaciones_verdaderas:
  - 'El dominio de la función coseno base $f(x) = \cos(x)$ es el conjunto de todos los números reales $\mathbb{R} = (-\infty, +\infty)$.'
  - 'La función coseno carece de discontinuidades, saltos o asíntotas verticales en todo su dominio real.'
al_terminar_debes_poder: |
  QUÉ: Determinar y fundamentar el dominio de la función coseno $f(x) = \cos(x)$.
  CÓMO: Identificar la ausencia de restricciones algebraicas en el argumento angular para establecer que $\operatorname{Dom}(f) = \mathbb{R}$.
