      de soluciones reales
    is_correct: true
  - text: Sumando las constantes b y c
    is_correct: false
  - text: Dividiendo c entre a directamente
    is_correct: false
  - text: Ignorando el término independiente c
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar el signo del discriminante b^2
    - 4ac para determinar la cantidad de soluciones reales. El discriminante indica
    si hay 2, 1 o 0 soluciones reales.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que todos los términos estén de un mismo lado de la igualdad,
  con cero del otro lado.'
- 'Paso 2: Ordena los términos de mayor a menor exponente: primero $x^2$, luego $x$,
  luego la constante.'
- 'Paso 3: Identifica cada coeficiente en su posición correspondiente dentro de $ax^2+bx+c=0$.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en reconocimiento de la forma general ax² + bx + c = 0.
ejemplos:
- titulo: Identificación de la forma general
  enunciado: Escribe en forma general la ecuación $7x^2+2x-1=0$.
  solucion_pasos:
  - Ya está en forma general.
  - $a=7$, $b=2$, $c=-1$.
- titulo: Reordenamiento a la forma general
  enunciado: Escribe en forma general la ecuación $-1+3x^2=0$.
  solucion_pasos:
  - Reordenando los términos de mayor a menor exponente se obtiene $3x^2-1=0$.
  - Esto equivale a $3x^2+0x-1=0$.
- titulo: ¿La forma general siempre debe tener los tres términos escritos explícitamente?
  enunciado: ¿La forma general siempre debe tener los tres términos escritos explícitamente?
  respuesta: 'No'
  solucion_pasos:
  - Un coeficiente puede valer cero (por ejemplo $b=0$), aunque conceptualmente sigue
    estando presente en la forma $ax^2+bx+c=0$.
- titulo: ¿El orden de los términos afecta el valor de los coeficientes identificados?
  enunciado: ¿El orden de los términos afecta el valor de los coeficientes identificados?
  respuesta: 'No'
  solucion_pasos:
  - Los coeficientes dependen del término al que acompañan, no del orden en que se
    escriban, siempre que se identifiquen correctamente.
errores_frecuentes:
- Confundir la posición de los coeficientes al no ordenar primero la ecuación.
- Omitir el signo negativo de un coeficiente al transcribirlo desde la ecuación.
- Asumir que $b$ o $c$ deben ser distintos de cero para que la ecuación esté en forma
  general.
- No trasladar todos los términos a un mismo lado de la igualdad antes de identificar
  los coeficientes.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_ponder: Resolver y analizar ecuaciones cuadráticas utilizando reconocimiento
  de la forma general ax² + bx + c = 0.
