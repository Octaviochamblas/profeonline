semantic_id: MAT.ALG.EC_CUADR_BASE.FORMA_GENERAL
resumen_inicial: La forma general canónica de una ecuación de segundo grado es $a
  x^2 + b x + c = 0$, donde $a \neq 0$.
explicacion_simple: 'Toda ecuación cuadrática puede ordenarse en su **forma general
  o estándar**:

  $$a x^2 + b x + c = 0$$

  - **$a x^2$**: término cuadrático (debe existir siempre, $a \neq 0$).

  - **$b x$**: término lineal.

  - **$c$**: término independiente (constante).

  - Todos los términos quedan a la izquierda y el miembro derecho es igual a $0$.'
explicacion_formal: 'La **forma general o canónica** de una ecuación cuadrática en
  una variable $x \in \mathbb{R}$ se representa mediante la trinomia estandarizada:


  $$a x^2 + b x + c = 0 \quad \text{con } a, b, c \in \mathbb{R} \quad \land \quad
  a \neq 0$$


  **Desglose de la fórmula:**

  - Estructura polinómica decreciente por grados de potencia: $x^2 \to x^1 \to x^0$.'
definiciones_clave: '- **Forma general (canónica)**: Expresión $a x^2 + b x + c =
  0$ igualada a cero y ordenada en potencias decrecientes de $x$.

  - **Término cuadrático ($a x^2$)**: Componente de grado 2 de la ecuación.'
propiedades_relaciones: '- **Unicidad de coeficientes**: Una vez ordenada la ecuación
  en forma general con $a > 0$, los coeficientes $(a, b, c)$ quedan determinados de
  forma única salvo escalar multiplicativo.'
ejemplo_guiado:
  enunciado: Expresa la ecuación $4x - 3 = 2x^2 + 5$ en su forma general $a x^2 +
    b x + c = 0$ de modo que el coeficiente $a$ sea positivo.
  pasos:
  - 'Paso 1: Escribir la ecuación dada: $4x - 3 = 2x^2 + 5$.Paso 2: Trasponer todos
    los términos al miembro derecho para mantener $2x^2$ con signo positivo: $0 =
    2x^2 - 4x + 5 + 3$.Paso 3: Sumar los términos independientes: $2x^2 - 4x + 8 =
    0$.Paso 4: Identificar los coeficientes ordenados: $a = 2$, $b = -4$, $c = 8$.Paso
    5: Concluir que la forma general es $2x^2 - 4x + 8 = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al ordenar la ecuación $4x - 3 = 2x^2 + 5$ en forma general con $a > 0$,
    ¿cuál es la ecuación obtenida?
  choices:
  - text: $2x^2 - 4x + 8 = 0$
    is_correct: true
  - text: $2x^2 + 4x + 2 = 0$
    is_correct: false
  - text: $2x^2 - 4x + 2 = 0$
    is_correct: false
  - text: $4x - 2x^2 + 8 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$2x^2 - 4x + 8 = 0$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la forma general $a x^2 + b x + c = 0$, ¿a qué debe ser igual el miembro
    de la derecha?
  choices:
  - text: Debe estar obligatoriamente igualado a cero ($0$).
    is_correct: true
  - text: Debe estar igualado a 1.
    is_correct: false
  - text: Debe estar igualado a x.
    is_correct: false
  - text: Puede ser cualquier constante distinta de cero.
    is_correct: false
  explanation: La alternativa correcta es 'Debe estar obligatoriamente igualado a
    cero ($0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Mover todos los términos a un solo lado del signo igual.'
- 'Paso 2: Agrupar los términos de grado 2, grado 1 y grado 0.'
- 'Paso 3: Ordenar en el formato $a x^2 + b x + c = 0$.'
- 'Paso 4: Verificar que el lado derecho sea exactamente cero.'
errores_correccion: '- **Error común:** Extraer los coeficientes $a, b, c$ sin haber
  igualado a cero la ecuación previamente.

  - **Cómo corregirlo:** NUNCA identifiques coeficientes si la ecuación tiene términos
  al lado derecho del signo igual.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
