semantic_id: MAT.ALG.EC_CUADR_BASE.FORMA_GENERAL
resumen_inicial: 'Reconocimiento de la forma general ax² + bx + c = 0: concepto, discriminante,
  soluciones y modelamiento en Conceptos y formas de la ecuación cuadrática.'
explicacion_simple: Toda ecuación de segundo grado, sin importar qué tan desordenada
  se vea al principio, puede reescribirse en un único formato estándar de tres términos.
explicacion_formal: '### Definición formal


  La forma general de una ecuación de segundo grado es $ax^2+bx+c=0$, con $a,b,c \in
  \mathbb{R}$ y $a \neq 0$. Los tres coeficientes ($a$, $b$, $c$) determinan completamente
  la ecuación y, por tanto, sus soluciones.


  ### Desarrollo didáctico


  Reconocer la forma general implica ubicar, en orden, el término cuadrático, el término
  lineal y el término constante, todos igualados a cero en un mismo lado de la igualdad.


  En $5x^2-3x+8=0$, la forma general ya está presente: el coeficiente cuadrático es
  $5$, el lineal es $-3$ y el término independiente es $8$.'
definiciones_clave: '- **Reconocimiento de la forma general ax² + bx + c = 0**: Elemento
  o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en reconocimiento
  de la forma general ax² + bx + c = 0.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando reconocimiento de
    la forma general ax² + bx + c = 0.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a reconocimiento de la
    forma general ax² + bx + c = 0.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
checkpoints:
