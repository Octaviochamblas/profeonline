semantic_id: MAT.ALG.EC_CUADR_BASE.FORMA_GENERAL
resumen_inicial: El reconocimiento de la forma general $ax^2 + bx + c = 0$ iguala la expresión a cero y la ordena en potencias decrecientes de la variable.
explicacion_simple: |
  La **forma general (o canónica)** de una ecuación de segundo grado es la estructura estándar más organizada para trabajar con ecuaciones cuadráticas:

  $$ax^2 + bx + c = 0$$

  - **Igualada a cero**: El lado derecho debe ser estrictamente igual a $0$.
  - **Orden descendente**: Primero va el término cuadrático $ax^2$, luego el término lineal $bx$ y finalmente la constante $c$.
  - **Ejemplo**: Si tienes $5x - 2 = x^2$, al pasar todo a la izquierda te queda $-x^2 + 5x - 2 = 0$, o multiplicando por $-1$: $x^2 - 5x + 2 = 0$.
explicacion_formal: |
  Dada una ecuación polinómica de segundo grado en la incógnita $x$, la **forma general canónica** se define como el polinomio ordenado en forma decreciente igualado al elemento neutro aditivo:

  $$ax^2 + bx + c = 0 \quad \text{donde } a, b, c \in \mathbb{R}, \ a \neq 0$$

  **Identificación analítica de los elementos:**
  - $a$: Coeficiente principal o cuadrático (multiplica a $x^2$).
  - $b$: Coeficiente lineal (multiplica a $x^1$).
  - $c$: Término independiente o constante (multiplica a $x^0$).
definiciones_clave: |
  - **Forma general (o canónica)**: Representación de una ecuación cuadrática en que todos los términos se ubican a un lado del signo igual de forma descendente ($ax^2 + bx + c = 0$).
propiedades_relaciones: |
  - **Normalización**: Cualquier ecuación cuadrática equivalente obtenida multiplicando toda la expresión por una constante $k \neq 0$ ($kax^2 + kbx + kc = 0$) conserva exactamente el mismo conjunto solución.
ejemplo_guiado:
  enunciado: 'Expresa la ecuación $3x(x - 2) = 4 - 5x$ en su forma general e identifica los valores de $a$, $b$ y $c$.'
  pasos:
    - 'Paso 1: Aplicar la propiedad distributiva en el miembro izquierdo: $3x^2 - 6x = 4 - 5x$.'
    - 'Paso 2: Transponer todos los términos al lado izquierdo: $3x^2 - 6x + 5x - 4 = 0$.'
    - 'Paso 3: Reducir términos semejantes: $3x^2 - 1x - 4 = 0$.'
    - 'Paso 4: Identificar los coeficientes: $a = 3$, $b = -1$, $c = -4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición debe cumplir el lado derecho de una ecuación cuadrática para estar escrita en su forma general?'
    choices:
      - {text: 'Debe estar igualado estrictamente a cero ($= 0$).', is_correct: true}
      - {text: 'Debe estar igualado a 1.', is_correct: false}
      - {text: 'Debe contener la constante $c$.', is_correct: false}
      - {text: 'Debe tener solo números enteros positivos.', is_correct: false}
    explanation: 'La alternativa correcta es ''Debe estar igualado estrictamente a cero ($= 0$).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En la ecuación expresada en forma general $3x^2 - x - 4 = 0$, ¿cuáles son los valores de los coeficientes $a$, $b$ y $c$?'
    choices:
      - {text: '$a = 3$, $b = -1$, $c = -4$', is_correct: true}
      - {text: '$a = 3$, $b = 1$, $c = 4$', is_correct: false}
      - {text: '$a = 3$, $b = 0$, $c = -4$', is_correct: false}
      - {text: '$a = -4$, $b = -1$, $c = 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = 3$, $b = -1$, $c = -4$''. El coeficiente de $-x$ es $-1$ y el término constante es $-4$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Resolver los paréntesis, productos y potencias en ambos lados de la igualdad.'
  - 'Paso 2: Transponer todos los términos a un solo lado del signo de igualdad para dejar cero en el otro lado.'
  - 'Paso 3: Reducir los términos semejantes cuadráticos, lineales e independientes.'
  - 'Paso 4: Ordenar los términos en la secuencia $ax^2 + bx + c = 0$ e identificar los coeficientes $a$, $b$ y $c$.'
errores_correccion: |
  - **Error común:** Extraer los coeficientes $a, b, c$ cuando la ecuación aún no está igualada a cero (ej. en $x^2 + 3x = 10$, asumir $c = 10$).
  - **Cómo corregirlo:** Si la ecuación no está igualada a cero, **TRANSPONE TODOS LOS TÉRMINOS PRIMERO** (ej. $x^2 + 3x - 10 = 0 \implies c = -10$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Expresión en forma general de una ecuación.
    alternativas:
      - '$x^2 - 4x + 3 = 0$'
      - '$x^2 = 4x - 3$'
      - '$x^2 - 4x = -3$'
    respuesta: '$x^2 - 4x + 3 = 0$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Identificación de la estructura canónica.
    alternativas:
      - '$2x^2 + 5x - 7 = 0$'
      - '$2x^2 + 5x = 7$'
      - '$2x^2 = -5x + 7$'
    respuesta: '$2x^2 + 5x - 7 = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En la expresión $x^2 - 5x = 6$, el término independiente $c$ es directamente el número $6$.'
  - 'La forma general exige que el coeficiente cuadrático $a$ sea siempre un número positivo mayor que 1.'
  - 'Una ecuación de la forma $ax^2 + c = bx$ se encuentra escrita correctamente en su forma general canónica.'
  - 'La permutación de los miembros de una ecuación altera el conjunto de sus raíces reales.'
  - 'La ponderación de una ecuación igualada a cero por el número $-1$ altera el grado algebraico de la expresión.'
afirmaciones_verdaderas:
  - 'La forma general o canónica de una ecuación cuadrática se caracteriza por estar igualada a cero y ordenada en potencias decrecientes de la incógnita ($ax^2 + bx + c = 0$).'
  - 'Para extraer correctamente los coeficientes $a$, $b$ y $c$ de una ecuación cuadrática, esta debe encontrarse previamente reducida e igualada a cero.'
al_terminar_debes_poder: |
  QUÉ: Reconocer y transformar ecuaciones de segundo grado a la forma general $ax^2 + bx + c = 0$.
  CÓMO: Desarrollar productos, transponer términos para igualar a cero, reducir términos semejantes y ordenar en grado descendente.
fuente: 'Texto escolar MINEDUC — Álgebra / Ecuaciones de Segundo Grado'
