semantic_id: MAT.ALG.EC_CUADR_BASE.FORMA_GENERAL
resumen_inicial: 'La forma general o canónica de la ecuación cuadrática expresa el trinomio ordenado en potencias decrecientes de la incógnita e igualado a cero: $ax^2 + bx + c = 0$ con $a \neq 0$.'
explicacion_simple: '![La forma general o canónica de la ecuación cuadrática expresa el trinomio ordenado en potencias decrecientes de la incógnita e igualado a cero: $ax^2 + bx + c = 0$ con $a \neq 0$](/static/img/nodos/reconocimiento-de-la-forma-general-ax2-bx-c-0-intro.svg)



  La **forma general** es la manera estándar y ordenada en que los matemáticos escriben las ecuaciones cuadráticas:

  $$ax^2 + bx + c = 0$$


  Tiene dos reglas de oro:

  1. **Está igualada a cero:** todo lo que estaba en el lado derecho se pasó al lado izquierdo.

  2. **Está ordenada de mayor a menor exponente:** primero el término con $x^2$, luego el término con $x$, y al final el número suelto sin $x$.


  Tener la ecuación en su forma general es el paso previo obligatorio para aplicar la fórmula cuadrática o factorizar.'
explicacion_formal: 'La **forma general canónica** de una ecuación cuadrática es la representación normalizada en la que el polinomio de segundo grado está expresado en base canónica e igualado al elemento nulo:

  $$P(x) = ax^2 + bx + c = 0, \quad a \in \mathbb{R} \setminus \{0\}, \; b, c \in \mathbb{R}$$


  **Ventajas analíticas de la forma general:**

  - **Identificación unívoca de parámetros**: Permite leer de forma directa la terna de coeficientes $(a, b, c)$.

  - **Cálculo del discriminante**: Habilita la evaluación inmediata de $\Delta = b^2 - 4ac$.

  - **Aplicación de fórmulas cerradas**: Permite sustituir directamente en la fórmula resolvente $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$.'
definiciones_clave: '- **Forma canónica / general**: Estructura $ax^2 + bx + c = 0$ donde todos los monomios están agrupados en un solo miembro.

  - **Terna de coeficientes $(a, b, c)$**: Conjunto ordenado de constantes reales que parametrizan la ecuación.'
propiedades_relaciones: '- **Equivalencia por escalamiento**: Multiplicar o dividir toda la ecuación por una constante $k \neq 0$ no altera sus soluciones ($kax^2 + kbx + kc = 0$).

  - **Forma mónic**: Si se divide por $a$, se obtiene la forma normalizada mónic $x^2 + px + q = 0$ con $p = b/a$ y $q = c/a$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La forma general o canónica de la ecuación cuadrática expresa el trinomio ordenado en potencias decrecientes de la incógnita e igualado a cero: $ax^2 + bx + c = 0$ con $a \neq 0$](/static/img/nodos/reconocimiento-de-la-forma-general-ax2-bx-c-0-ejemplos.svg)



    Reconoce los coeficientes $a$, $b$ y $c$ de la ecuación $8 - 3x + 2x^2 = 0$ ordenándola previamente en su forma general.'
  pasos:
  - 'Paso 1: Reordenar los términos en potencias decrecientes de $x$: término cuadrático $2x^2$, término lineal $-3x$ y término independiente $+8$.'
  - 'Paso 2: Escribir la forma canónica: $2x^2 - 3x + 8 = 0$.'
  - 'Paso 3: Identificar el coeficiente cuadrático: $a = 2$.'
  - 'Paso 4: Identificar el coeficiente lineal con su signo: $b = -3$.'
  - 'Paso 5: Identificar el término independiente: $c = 8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los coeficientes a, b y c en la ecuación cuadrática $3x^2 - 7x + 2 = 0$?
  choices:
  - text: a = 3, b = -7, c = 2
    is_correct: true
  - text: a = 3, b = 7, c = 2
    is_correct: false
  - text: a = 3x^2, b = -7x, c = 2
    is_correct: false
  - text: a = 2, b = -7, c = 3
    is_correct: false
  explanation: La alternativa correcta es 'a = 3, b = -7, c = 2'. Los coeficientes son solo los factores numéricos con sus signos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la forma general de la ecuación $5x - 2 = 4x^2$?
  choices:
  - text: 4x^2 - 5x + 2 = 0 (o -4x^2 + 5x - 2 = 0)
    is_correct: true
  - text: 4x^2 + 5x - 2 = 0
    is_correct: false
  - text: 5x - 4x^2 - 2 = 0
    is_correct: false
  - text: 4x^2 - 5x - 2 = 0
    is_correct: false
  explanation: La alternativa correcta es '4x^2 - 5x + 2 = 0 (o -4x^2 + 5x - 2 = 0)'. Al transponer todos los términos a un miembro e igualar a 0.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Transponer todos los términos de la ecuación hacia el miembro izquierdo de modo que el miembro derecho quede igual a 0.'
- 'Paso 2: Reducir todos los términos semejantes.'
- 'Paso 3: Escribir los monomios ordenados en potencias decrecientes: primero $x^2$, luego $x$ y finalmente el número sin $x$.'
- 'Paso 4: Extraer los valores numéricos de los coeficientes $a$, $b$ y $c$ conservando sus signos respectivos.'
errores_correccion: '- **Error común:** Escribir los coeficientes incluyendo la letra $x$ (ej: $a = 3x^2, b = -7x$).

  - **Cómo corregirlo:** Los coeficientes $a$, $b$ y $c$ son **exclusivamente números reales**; la incógnita $x$ no forma parte del coeficiente.'
ejemplos:
- titulo: 'Ejemplo 1: Ordenamiento canónico'
  enunciado: ¿Cuál es la forma general ordenada de $-6x + 9x^2 - 4 = 0$?
  alternativas:
  - 9x^2 - 6x - 4 = 0
  - -6x + 9x^2 - 4 = 0
  - 9x^2 + 6x - 4 = 0
  - -4 - 6x + 9x^2 = 0
  respuesta: 9x^2 - 6x - 4 = 0
  solucion_pasos:
  - 'Paso 1: Se colocan en orden descendente: $9x^2 - 6x - 4 = 0$.'
- titulo: 'Ejemplo 2: Ecuación no igualada a cero'
  enunciado: Expresa en forma general la ecuación $2x^2 + 3x = 10$.
  alternativas:
  - 2x^2 + 3x - 10 = 0
  - 2x^2 + 3x + 10 = 0
  - 2x^2 - 3x - 10 = 0
  - 10 - 2x^2 - 3x = 0
  respuesta: 2x^2 + 3x - 10 = 0
  solucion_pasos:
  - 'Paso 1: Se resta $10$ en ambos miembros: $2x^2 + 3x - 10 = 0$.'
- titulo: 'Ejemplo 3: Coeficiente cuadrático negativo'
  enunciado: En $-x^2 + 4x - 1 = 0$, ¿cuánto valen a, b y c?
  alternativas:
  - a = -1, b = 4, c = -1
  - a = 1, b = 4, c = 1
  - a = -1, b = -4, c = -1
  - a = 0, b = 4, c = -1
  respuesta: a = -1, b = 4, c = -1
  solucion_pasos:
  - 'Paso 1: Delante de $-x^2$ hay un $-1$ implícito, luego $a = -1, b = 4, c = -1$.'
- titulo: 'Ejemplo 4: Ecuación con coeficientes fraccionarios'
  enunciado: En $\frac{x^2}{3} - \frac{x}{2} + 5 = 0$, ¿cuáles son los coeficientes?
  alternativas:
  - a = 1/3, b = -1/2, c = 5
  - a = 3, b = -2, c = 5
  - a = 1, b = -1, c = 5
  - a = 1/3, b = 1/2, c = 5
  respuesta: a = 1/3, b = -1/2, c = 5
  solucion_pasos:
  - 'Paso 1: $a = \frac{1}{3}, b = -\frac{1}{2}, c = 5$.'
errores_frecuentes:
- Extraer coeficientes sin haber igualado a cero la ecuación.
- Olvidar los signos negativos que acompañan a b o a c.
- Incluir las potencias de x en la respuesta de los coeficientes.
afirmaciones_verdaderas:
- La forma general ax² + bx + c = 0 exige que todos los términos estén en un miembro y el otro miembro sea 0.
- Los coeficientes a, b y c son números reales fijos donde a no puede ser 0.
al_terminar_debes_poder: '**QUÉ:** Reconocer, ordenar y expresar ecuaciones cuadráticas en su forma general canónica ax² + bx + c = 0.


  **CÓMO:** Transponiendo todos los términos a un miembro, reduciendo términos semejantes y ordenando en potencias decrecientes de la incógnita.


  ![Resumen La forma general o canónica de la ecuación cuadrática expresa el trinomio ordenado en potencias decrecientes de la incógnita e igualado a cero: $ax^2 + bx + c = 0$ con $a \neq 0$](/static/img/nodos/reconocimiento-de-la-forma-general-ax2-bx-c-0-resumen.svg)'
