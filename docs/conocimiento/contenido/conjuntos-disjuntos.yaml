semantic_id: MAT.FUND.RELACIONES_CONJUNTOS.CONJUNTOS_DISJUNTOS
resumen_inicial: Definición, características y condición algebraica ($A \cap B = \emptyset$) de los conjuntos disjuntos o mutuamente excluyentes.
explicacion_simple: '![Infografía: Conjuntos disjuntos, intersección vacía y suma aditiva](/static/img/nodos/conjuntos-disjuntos-intro.svg)


  Dos conjuntos son **disjuntos** (o mutuamente excluyentes) cuando **no tienen absolutamente ningún elemento en común**. Es decir, su intersección es el conjunto vacío: **$A \cap B = \emptyset$**. Por ejemplo, el conjunto de los números pares $P = \{2, 4, 6\}$ y el conjunto de los números impares $I = \{1, 3, 5\}$ son **disjuntos**, porque ningún número entero puede ser par e impar al mismo tiempo. En un diagrama de Venn, los conjuntos disjuntos se dibujan como dos círculos completamente separados, sin tocarse.

  '
explicacion_formal: '### Definición formal

  En la teoría de conjuntos y la probabilidad axiomática, dos conjuntos $A$ y $B$ son **disjuntos (o mutuamente disjuntos)** si y solo si su intersección es el conjunto vacío:

  $$A \cap B = \emptyset \quad \iff \quad \forall x \, \neg(x \in A \land x \in B)$$

  Para una familia arbitraria de conjuntos $\{A_i\}_{i \in I}$, se dice que son **disjuntos dos a dos (o disjuntos por pares)** si:

  $$\forall i, j \in I \, (i \neq j \implies A_i \cap A_j = \emptyset)$$


  ### Desglose simbólico

  - Condición algebraica: $A \cap B = \emptyset$.

  - Principio de Adición exacta: Si $A$ y $B$ son finitos y disjuntos, entonces $|A \cup B| = |A| + |B|$.

  - Diferencia de conjuntos disjuntos: $A \setminus B = A$ y $B \setminus A = B$.

  - Inclusión en el complemento: $A \cap B = \emptyset \iff A \subseteq B^c$.


  > **Complemento didáctico:** La disyunción de conjuntos representa la exclusión mutua categórica, fundamental para el cálculo de probabilidades de eventos incompatibles.

  '
definiciones_clave: '- **Conjuntos disjuntos**: Dos conjuntos cuya intersección carece de elementos ($A \cap B = \emptyset$).

  - **Disjuntos dos a dos (mutuamente disjuntos)**: Familia de conjuntos donde cualquier par de miembros distintos tiene intersección vacía.

  - **Eventos mutuamente excluyentes**: Denominación equivalente en teoría de probabilidades.

  '
propiedades_relaciones: '- **Diferencia simétrica de disjuntos**: Si $A \cap B = \emptyset$, entonces $A \bigtriangleup B = A \cup B$.

  - **Intersección con el vacío**: Todo conjunto $A$ es disjunto con el conjunto vacío ($A \cap \emptyset = \emptyset$).

  '
ejemplo_guiado:
  enunciado: '![Diagrama: Disyunción por propiedades y resta de conjuntos disjuntos](/static/img/nodos/conjuntos-disjuntos-ejemplos.svg)


    Determina si los conjuntos $A = \{x \in \mathbb{N} \mid x < 5\}$ y $B = \{x \in \mathbb{N} \mid x \text{ es múltiplo de } 5\}$ son disjuntos.'
  pasos:
  - 'Paso 1: Escribir el conjunto $A$ por extensión: $A = \{1, 2, 3, 4\}$.'
  - 'Paso 2: Escribir los primeros elementos del conjunto $B$ por extensión: $B = \{5, 10, 15, 20, \dots\}$.'
  - 'Paso 3: Calcular la intersección $A \cap B$ buscando elementos compartidos: - Ningún elemento de $\{1, 2, 3, 4\}$ es múltiplo de 5.'
  - 'Paso 4: Comprobar el resultado: $A \cap B = \emptyset$.'
  - 'Paso 5: Concluir formalmente que los conjuntos $A$ y $B$ son **disjuntos**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición algebraica necesaria y suficiente para que dos conjuntos $A$ y $B$ sean disjuntos?
  choices:
  - text: Que su intersección sea el conjunto vacío ($A \cap B = \emptyset$)
    is_correct: true
  - text: Que su unión sea el conjunto universal ($A \cup B = \mathcal{U}$)
    is_correct: false
  - text: Que tengan exactamente la misma cantidad de elementos ($|A| = |B|$)
    is_correct: false
  - text: Que uno de ellos sea subconjunto del otro ($A \subseteq B$)
    is_correct: false
  explanation: La alternativa correcta es 'Que su intersección sea el conjunto vacío ($A \cap B = \emptyset$)'. Es la definición formal de conjuntos disjuntos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $A$ y $B$ son conjuntos finitos y disjuntos con $|A| = 7$ y $|B| = 5$, ¿cuál es la cardinalidad de su unión $|A \cup B|$?
  choices:
  - text: $12$
    is_correct: true
  - text: $2$
    is_correct: false
  - text: $35$
    is_correct: false
  - text: $0$
    is_correct: false
  explanation: 'La alternativa correcta es ''$12$''. Al ser disjuntos ($|A \cap B| = 0$), se aplica la suma directa: $|A \cup B| = 7 + 5 = 12$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar los elementos de ambos conjuntos $A$ y $B$.'
- 'Paso 2: Calcular la intersección $A \cap B$ buscando elementos comunes.'
- 'Paso 3: Si se encuentra al menos un elemento compartido, declarar que NO son disjuntos.'
- 'Paso 4: Si no existe ningún elemento común ($A \cap B = \emptyset$), declarar formalmente que $A$ y $B$ son disjuntos.'
errores_correccion: '- **Error 1:** Afirmar que dos conjuntos son disjuntos porque tienen cardinalidades diferentes. **Cómo corregirlo:** La condición de ser disjuntos depende de la naturaleza de los elementos (que no se repitan entre conjuntos), no de su cantidad.

  - **Error 2:** Creer que $A \setminus B = \emptyset$ para conjuntos disjuntos. **Cómo corregirlo:** Si son disjuntos, quitarle $B$ a $A$ no le quita nada, por lo que $A \setminus B = A$.

  '
ejemplos:
- titulo: Pares e impares
  enunciado: ¿Son disjuntos los números enteros pares y los impares?
  alternativas:
  - Sí, su intersección es vacía
  - No, el cero es común
  - No, ambos son enteros
  respuesta: Sí, su intersección es vacía
  solucion_pasos:
  - 1. Ningún entero puede ser par e impar a la vez.
  - 2. La intersección es $\emptyset$, luego son disjuntos.
- titulo: Diferencia de conjuntos disjuntos
  enunciado: Si $A \cap B = \emptyset$, ¿cuánto vale $A \setminus B$?
  respuesta: $A$
  solucion_pasos:
  - Al no compartir elementos con $B$, $A \setminus B = A$.
  alternativas:
  - $A$
  - $\emptyset$
  - $B$
  - $A \cap B$
- titulo: Inclusión en el complemento
  enunciado: Si $A$ y $B$ son disjuntos dentro de $\mathcal{U}$, ¿se cumple que $A \subseteq B^c$?
  respuesta: Sí
  solucion_pasos:
  - Sí, al no estar en $B$, todos los elementos de $A$ residen en el complemento $B^c$.
- titulo: Disyunción con el conjunto vacío
  enunciado: ¿Es el conjunto vacío disjunto con cualquier conjunto $A$?
  respuesta: Sí
  solucion_pasos:
  - Sí, pues $A \cap \emptyset = \emptyset$ para todo $A$.
errores_frecuentes:
- La afirmación de que dos conjuntos con distinta cardinalidad son automáticamente conjuntos disjuntos.
- La afirmación de que la unión de dos conjuntos disjuntos produce el conjunto vacío.
- La afirmación de que la diferencia $A \setminus B$ de dos conjuntos disjuntos es igual al conjunto vacío.
- La afirmación de que dos conjuntos disjuntos no pueden pertenecer al mismo conjunto universal.
- La afirmación de que un conjunto no vacío puede ser disjunto consigo mismo.
afirmaciones_verdaderas:
- Dos conjuntos $A$ y $B$ son disjuntos si y solo si su intersección es el conjunto vacío ($A \cap B = \emptyset$).
- Para dos conjuntos finitos disjuntos, la cardinalidad de la unión es exactamente igual a la suma de sus cardinalidades ($|A \cup B| = |A| + |B|$).
al_terminar_debes_poder: 'QUÉ: Definir, verificar y operar con conjuntos disjuntos ($A \cap B = \emptyset$).

  CÓMO: Comprobar la ausencia de elementos compartidos, aplicar el principio aditivo de cardinalidad y relacionarlos con el complemento ($A \subseteq B^c$).


  ![Cuadro resumen: Conjuntos disjuntos, cardinalidad y complemento](/static/img/nodos/conjuntos-disjuntos-resumen.svg)

  '
