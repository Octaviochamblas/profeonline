semantic_id: MAT.ALG.DESIG_PROPIEDADES.INVERSION_SENTIDO_NEGATIVO
resumen_inicial: 'Inversión del sentido de la desigualdad al operar con cantidad negativa:
  relaciones de orden, intervalos y resolución en Propiedades de las desigualdades.'
explicacion_simple: Al resolver inecuaciones o trabajar con desigualdades, una de
  las propiedades más importantes es la multiplicación o división por un número negativo.
  A diferencia de las ecuaciones, en las desigualdades esta operación altera el sentido
  de la relación de orden.
explicacion_formal: '### Definición formal

  Si $a < b$ y $c < 0$, entonces $a \cdot c > b \cdot c$.

  Si $a \leq b$ y $c < 0$, entonces $a \cdot c \geq b \cdot c$.


  ### Desarrollo didáctico

  Esta propiedad asegura que la relación de orden se mantenga consistente dentro de
  la recta numérica. Cuando multiplicamos por un número negativo, estamos reflejando
  los valores respecto al origen, lo que invierte el orden relativo entre ellos. Por
  ello, es mandatorio cambiar $<$ por $>$, o $\leq$ por $\geq$, y viceversa.'
definiciones_clave: '- **Inversión del sentido de la desigualdad al operar con cantidad
  negativa**: Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a inversión del sentido de la desigualdad
  al operar con cantidad negativa.'
ejemplo_guiado:
