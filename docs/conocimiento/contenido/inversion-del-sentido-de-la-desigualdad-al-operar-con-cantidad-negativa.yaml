semantic_id: MAT.ALG.DESIG_PROPIEDADES.INVERSION_SENTIDO_NEGATIVO
resumen_inicial: La inversión del sentido es la propiedad por la cual los operadores
  de orden se transforman en sus opuestos al multiplicar o dividir por números negativos.
explicacion_simple: 'Esta propiedad resume la regla fundamental de transformación:

  - El símbolo menor que ($<$) se invierte a mayor que ($>$).

  - El símbolo mayor que ($>$) se invierte a menor que ($<$).

  - El símbolo menor o igual ($\le$) se invierte a mayor o igual ($\ge$).

  - El símbolo mayor o igual ($\ge$) se invierte a menor o igual ($\le$).

  Esta inversión ocurre EXCLUSIVAMENTE cuando multiplicamos o dividimos por números
  negativos.'
explicacion_formal: 'Sea el operador $R \in \{<, >, \le, \ge\}$ y su operador dual
  invertido $R^{\text{inv}} \in \{>, <, \ge, \le\}$. Para $c < 0$:


  $$a \ R \ b \iff (a \cdot c) \ R^{\text{inv}} \ (b \cdot c) \quad \land \quad \left(\frac{a}{c}\right)
  \ R^{\text{inv}} \ \left(\frac{b}{c}\right)$$


  **Tabla de inversión formal:**

  - $< \implies >$

  - $> \implies <$

  - $\le \implies \ge$

  - $\ge \implies \le$'
definiciones_clave: '- **Operador dual invertido**: Relación de orden opuesta obtenida
  tras operar con escalares negativos.'
propiedades_relaciones: '- **Doble inversión**: Invertir una desigualdad dos veces
  consecutivas mediante multiplicaciones por negativos regresa el símbolo a su sentido
  original.'
ejemplo_guiado:
  enunciado: Muestra la doble inversión de la desigualdad $-2 \le 4$ multiplicando
    primero por $-1$ y luego nuevamente por $-1$.
  pasos:
  - 'Paso 1: Escribir la desigualdad inicial: $-2 \le 4$.Paso 2: Primera multiplicación
    por $-1$: $2 \ge -4$ (el sentido $\le$ se invierte a $\ge$).Paso 3: Segunda multiplicación
    por $-1$: $-2 \le 4$ (el sentido $\ge$ vuelve a invertirse a $\le$).Paso 4: Concluir
    que la doble inversión restaura el orden inicial.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué se transforma el símbolo mayor o igual ($\ge$) al multiplicar
    ambos lados de la desigualdad por $-1$?
  choices:
  - text: En el símbolo menor o igual ($\le$).
    is_correct: true
  - text: En el símbolo estrictamente menor que ($<$).
    is_correct: false
  - text: Se mantiene como mayor o igual ($\ge$).
    is_correct: false
  - text: En una igualdad ($=$).
    is_correct: false
  explanation: La alternativa correcta es 'En el símbolo menor o igual ($\le$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al aplicar una primera multiplicación por $-1$ a $-2 \le 4$, ¿cuál es
    la desigualdad invertida resultante?
  choices:
  - text: $2 \ge -4$
    is_correct: true
  - text: $2 \le -4$
    is_correct: false
  - text: $-2 \ge 4$
    is_correct: false
  - text: $2 = -4$
    is_correct: false
  explanation: La alternativa correcta es '$2 \ge -4$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el operador de orden original ($<, >, \le, \ge$).'
- 'Paso 2: Operar la multiplicación o división por el número negativo.'
- 'Paso 3: Reemplazar el operador por su dual invertido exactamente según la tabla
  de inversión.'
errores_correccion: '- **Error común:** Invertir la relación de orden al sumar o restar
  un número negativo.

  - **Cómo corregirlo:** La inversión ocurre ÚNICAMENTE en la MULTIPLICACIÓN o DIVISIÓN
  por números negativos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
  - 'Al multiplicar la inecuación $-4x > 12$ por el escalar $-1$, el símbolo de desigualdad se mantiene dando $-4x(-1) > 12(-1)$.'
  - 'Operar aditivamente sumando una cantidad negativa a ambos miembros exige dar vuelta al sentido del símbolo de la desigualdad.'
  - 'La regla de cambio de sentido aplica al restar una constante positiva $c > 0$ a ambos lados de la inecuación.'
  - 'Al dividir $-2x \le -8$ entre $-2$, la inecuación resultante se escribe como $x \le 4$.'
  - 'La inversión del operador de orden al multiplicar por una cantidad negativa invalida la veracidad de la proposición en $\mathbb{R}$.'
afirmaciones_verdaderas:
  - 'Multiplicar o dividir ambos miembros de una desigualdad por una cantidad negativa invierte la orientación del símbolo de la relación.'
  - 'Las operaciones aditivas de suma y resta conservan el sentido de la desigualdad independientemente del signo de la constante.'
al_terminar_debes_poder: |
  QUÉ: Aplicar el principio general de inversión de sentido al operar con cantidades negativas en desigualdades.
  CÓMO: Distinguir entre operaciones multiplicativas (que invierten el símbolo) y aditivas (que conservan el símbolo), resolviendo inecuaciones lineales en $\mathbb{R}$.
