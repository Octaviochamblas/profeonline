semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_BINOMIO_CONJUGADO
resumen_inicial: 'La racionalización de un denominador binomio que contiene raíces cuadradas se realiza amplificando por su binomio conjugado, aplicando el producto notable suma por su diferencia: $(\sqrt{a} + \sqrt{b})(\sqrt{a} - \sqrt{b}) = a - b$.'
explicacion_simple: "![Racionalización con denominador binomio mediante conjugado](/static/img/nodos/racionalizacion-con-denominador-binomio-mediante-conjugado-intro.svg)\n\nCuando en el denominador tienes una suma o resta de dos términos con raíces cuadradas (como $\\sqrt{5} - \\sqrt{2}$ o $3 + \\sqrt{5}$):\n- **¿Qué es el conjugado?** Es exactamente el mismo binomio pero con el **signo del medio cambiado**:\n  - El conjugado de $(\\sqrt{5} - \\sqrt{2})$ es $(\\sqrt{5} + \\sqrt{2})$.\n  - El conjugado de $(3 + \\sqrt{5})$ es $(3 - \\sqrt{5})$.\n- **¿Por qué funciona?** Al multiplicar por el conjugado, aplicas el producto notable **suma por su diferencia**:\n$$(\\sqrt{a} + \\sqrt{b})(\\sqrt{a} - \\sqrt{b}) = (\\sqrt{a})^2 - (\\sqrt{b})^2 = a - b$$\n¡Todas las raíces desaparecen mágicamente del denominador, dejando una simple resta de números enteros!"
explicacion_formal: 'Sean $a, b \in \mathbb{R}^+_0$ con $a \neq b$ y $k \in \mathbb{R}$. Para una fracción con denominador binomio $\frac{k}{\sqrt{a} \pm \sqrt{b}}$, se define su **Factor Racionalizante Binomial** como el binomio conjugado $\sqrt{a} \mp \sqrt{b}$.


  **Teorema de la Suma por su Diferencia en Radicales:**

  $$\frac{k}{\sqrt{a} + \sqrt{b}} = \frac{k}{\sqrt{a} + \sqrt{b}} \cdot \frac{\sqrt{a} - \sqrt{b}}{\sqrt{a} - \sqrt{b}} = \frac{k(\sqrt{a} - \sqrt{b})}{(\sqrt{a})^2 - (\sqrt{b})^2} = \frac{k(\sqrt{a} - \sqrt{b})}{a - b}$$


  $$\frac{k}{\sqrt{a} - \sqrt{b}} = \frac{k}{\sqrt{a} - \sqrt{b}} \cdot \frac{\sqrt{a} + \sqrt{b}}{\sqrt{a} + \sqrt{b}} = \frac{k(\sqrt{a} + \sqrt{b})}{(\sqrt{a})^2 - (\sqrt{b})^2} = \frac{k(\sqrt{a} + \sqrt{b})}{a - b}$$


  **Caso Mixto (Entero $\pm$ Raíz):**

  $$\frac{k}{c \pm \sqrt{b}} \cdot \frac{c \mp \sqrt{b}}{c \mp \sqrt{b}} = \frac{k(c \mp \sqrt{b})}{c^2 - b} \quad (c^2 \neq b)$$'
definiciones_clave: '- **Binomio conjugado**: Par de binomios $(x + y)$ y $(x - y)$ que difieren únicamente en el signo de su segundo término.

  - **Suma por su diferencia**: Producto notable $(x + y)(x - y) = x^2 - y^2$.

  - **Eliminación de términos cruzados**: Cancelación del término mixto $2xy$ que ocurriría si se elevara al cuadrado como binomio.'
propiedades_relaciones: '- **Simetría del conjugado**: El conjugado del conjugado es el binomio original.

  - **Diferencia de cuadrados con enteros**: $(3 + \sqrt{5})(3 - \sqrt{5}) = 3^2 - (\sqrt{5})^2 = 9 - 5 = 4$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de racionalización con conjugado](/static/img/nodos/racionalizacion-con-denominador-binomio-mediante-conjugado-ejemplos.svg)


    Racionalice las expresiones $\frac{6}{\sqrt{5} - \sqrt{2}}$, $\frac{4}{3 + \sqrt{5}}$ y $\frac{1}{\sqrt{7} + \sqrt{3}}$.'
  pasos:
  - 'Paso 1: Racionalizar $\frac{6}{\sqrt{5} - \sqrt{2}}$: Multiplicar por $(\sqrt{5} + \sqrt{2}) \implies \frac{6(\sqrt{5} + \sqrt{2})}{5 - 2} = \frac{6(\sqrt{5} + \sqrt{2})}{3} = 2(\sqrt{5} + \sqrt{2}) = 2\sqrt{5} + 2\sqrt{2}$.'
  - 'Paso 2: Racionalizar $\frac{4}{3 + \sqrt{5}}$: Multiplicar por $(3 - \sqrt{5}) \implies \frac{4(3 - \sqrt{5})}{3^2 - 5} = \frac{4(3 - \sqrt{5})}{9 - 5} = \frac{4(3 - \sqrt{5})}{4} = 3 - \sqrt{5}$.'
  - 'Paso 3: Racionalizar $\frac{1}{\sqrt{7} + \sqrt{3}}$: Multiplicar por $(\sqrt{7} - \sqrt{3}) \implies \frac{\sqrt{7} - \sqrt{3}}{7 - 3} = \frac{\sqrt{7} - \sqrt{3}}{4}$.'
  - 'Conclusión: Las formas racionalizadas son $2\sqrt{5} + 2\sqrt{2}$, $3 - \sqrt{5}$ y $\frac{\sqrt{7} - \sqrt{3}}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el conjugado de $(\sqrt{3} + 1)$?
  choices:
  - text: $(\sqrt{3} - 1)$
    is_correct: true
  - text: $(-\sqrt{3} - 1)$
    is_correct: false
  - text: $(3 + 1)$
    is_correct: false
  - text: $(\sqrt{3} + 1)$
    is_correct: false
  explanation: La alternativa correcta es '$(\sqrt{3} - 1)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $(3 + \sqrt{5})(3 - \sqrt{5}) = 4$?
  choices:
  - text: Porque $3^2 - (\sqrt{5})^2 = 9 - 5 = 4$
    is_correct: true
  - text: Porque $3 - 5 = -2$
    is_correct: false
  - text: Porque se cancelan los $3$
    is_correct: false
  - text: Porque $3 \times 5 = 15$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $3^2 - (\sqrt{5})^2 = 9 - 5 = 4$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el binomio del denominador y formar su conjugado cambiando el signo central ($+ \leftrightarrow -$).'
- 'Paso 2: Multiplicar el numerador y el denominador por el binomio conjugado, protegiendo con paréntesis.'
- 'Paso 3: Desarrollar el denominador mediante suma por su diferencia $(x^2 - y^2)$, calcular el entero resultante y simplificar la fracción.'
errores_correccion: '- **Error 1: Multiplicar por el mismo binomio sin cambiar el signo ($(\sqrt{a} + \sqrt{b})^2 = a + 2\sqrt{ab} + b$).** **Cómo corregirlo:** Si no cambias el signo, surge el doble producto $2\sqrt{ab}$ y la raíz NO se elimina. Usar siempre el signo opuesto.

  - **Error 2: Olvidar elevar al cuadrado los términos enteros ($(3 - \sqrt{2})(3 + \sqrt{2}) = 3 - 2 = 1$).** **Cómo corregirlo:** El entero también se eleva al cuadrado: $3^2 - 2 = 9 - 2 = 7$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la expresión racionalizada de $\frac{2}{\sqrt{3} - 1}$?
  alternativas:
  - $\sqrt{3} + 1$
  - $2(\sqrt{3} + 1)$
  - $\frac{\sqrt{3} + 1}{2}$
  respuesta: $\sqrt{3} + 1$
  solucion_pasos:
  - $\frac{2(\sqrt{3} + 1)}{3 - 1} = \frac{2(\sqrt{3} + 1)}{2} = \sqrt{3} + 1$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale $\frac{1}{\sqrt{5} + \sqrt{3}}$ racionalizado?
  alternativas:
  - $\frac{\sqrt{5} - \sqrt{3}}{2}$
  - $\sqrt{5} - \sqrt{3}$
  - $\frac{\sqrt{5} + \sqrt{3}}{2}$
  respuesta: $\frac{\sqrt{5} - \sqrt{3}}{2}$
  solucion_pasos:
  - $\frac{\sqrt{5} - \sqrt{3}}{5 - 3} = \frac{\sqrt{5} - \sqrt{3}}{2}$.
- titulo: ¿Es 1 / (√2 + 1) igual a √2 - 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{1}{\sqrt{2} + 1} \cdot \frac{\sqrt{2} - 1}{\sqrt{2} - 1} = \frac{\sqrt{2} - 1}{2 - 1} = \sqrt{2} - 1$.
  alternativas:
  - texto: Sí, 1 / (√2 + 1) = √2 - 1
    es_correcta: true
    retroalimentacion: ¡Correcto! Denominador 2 - 1 = 1.
  - texto: No, es igual a (√2 - 1) / 2
    es_correcta: false
    retroalimentacion: Incorrecto, el denominador es $2 - 1^2 = 1$.
  - texto: No, es igual a √2 + 1
    es_correcta: false
    retroalimentacion: Incorrecto, falta el cambio de signo del conjugado.
- titulo: ¿Es (√7 + √2)(√7 - √2) igual a 5?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(\sqrt{7})^2 - (\sqrt{2})^2 = 7 - 2 = 5$.
  alternativas:
  - texto: Sí, 7 - 2 = 5
    es_correcta: true
    retroalimentacion: ¡Correcto! Diferencia de cuadrados exacta.
  - texto: No, es igual a √5
    es_correcta: false
    retroalimentacion: Incorrecto, las raíces se cancelan completamente al elevarse al cuadrado.
  - texto: No, es igual a 9
    es_correcta: false
    retroalimentacion: Incorrecto, los términos se restan, no se suman.
errores_frecuentes:
- Multiplicar por el mismo binomio en lugar del conjugado.
- Olvidar elevar al cuadrado los términos constantes sin raíz.
- No proteger los numeradores con paréntesis al distribuir.
- Errores de signo en la resta del denominador $a - b$.
- Olvidar simplificar el factor común con el denominador resultante.
afirmaciones_verdaderas:
- Para racionalizar un binomio con raíces cuadradas se amplifica por su binomio conjugado.
- El producto notable $(\sqrt{a}+\sqrt{b})(\sqrt{a}-\sqrt{b}) = a - b$ elimina todos los radicales del denominador.
- Si un término del binomio es entero, se eleva al cuadrado como $c^2$ en la diferencia de cuadrados.
al_terminar_debes_poder: '![Síntesis de racionalización con conjugado](/static/img/nodos/racionalizacion-con-denominador-binomio-mediante-conjugado-resumen.svg)


  QUÉ: Racionalizar fracciones cuyo denominador sea un binomio con raíces cuadradas.


  CÓMO: Amplificando la fracción por el binomio conjugado $\sqrt{a} \mp \sqrt{b}$, aplicando la suma por su diferencia $(\sqrt{a})^2 - (\sqrt{b})^2 = a - b$ en el denominador y simplificando la expresión final.'
