semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_BINOMIO_CONJUGADO
resumen_inicial: 'La racionalización de un denominador binomio que contiene raíces cuadradas elimina los radicales multiplicando por su expresión conjugada para aplicar la suma por su diferencia: $(\sqrt{a} + \sqrt{b})(\sqrt{a} - \sqrt{b}) = a - b$.'
explicacion_simple: |
  Cuando el denominador tiene dos términos sumándose o restándose con raíces cuadradas (como $\sqrt{5} + \sqrt{2}$ o $3 - \sqrt{2}$), no puedes racionalizar término por término. Para eliminar las raíces, utilizas el "conjugado" del binomio, que es la misma expresión pero cambiando el signo del medio. Al multiplicar un binomio por su conjugado, aprovechas la propiedad de suma por su diferencia $(x + y)(x - y) = x^2 - y^2$, lo que eleva cada término al cuadrado de forma independiente y destruye ambas raíces cuadradas a la vez.
explicacion_formal: |
  ### Definición formal
  La **racionalización de un denominador binomio** con raíces cuadradas utiliza el **expresado binomio conjugado** para transformar denominadores de la forma $\sqrt{a} \pm \sqrt{b}$ (o $c \pm \sqrt{b}$) en números enteros o racionales:
  $$\frac{N}{\sqrt{a} + \sqrt{b}} = \frac{N}{\sqrt{a} + \sqrt{b}} \cdot \frac{\sqrt{a} - \sqrt{b}}{\sqrt{a} - \sqrt{b}} = \frac{N(\sqrt{a} - \sqrt{b})}{\left(\sqrt{a}\right)^2 - \left(\sqrt{b}\right)^2} = \frac{N(\sqrt{a} - \sqrt{b})}{a - b}$$

  ### Definición de Binomios Conjugados
  1. El conjugado del binomio $(\sqrt{a} + \sqrt{b})$ es $(\sqrt{a} - \sqrt{b})$.
  2. El conjugado del binomio $(\sqrt{a} - \sqrt{b})$ es $(\sqrt{a} + \sqrt{b})$.
  3. El producto de dos binomios conjugados genera siempre la **suma por su diferencia**:
     $$(\sqrt{a} + \sqrt{b})(\sqrt{a} - \sqrt{b}) = (\sqrt{a})^2 - (\sqrt{b})^2 = a - b$$

  ### Síntesis didáctica
  - Factor racionalizante: La expresión conjugada del denominador (cambiando únicamente el signo central).
  - Denominador resultante: $a - b$ (o $c^2 - b$), libre de radicales irracionales.
definiciones_clave: |
  - **Binomio conjugado**: Par de binomios que poseen los mismos términos pero unidos por signos opuestos ($+\text{ frente a } -$).
  - **Suma por su diferencia**: Producto notable $(x+y)(x-y) = x^2 - y^2$ que permite elevar cada término al cuadrado por separado.
  - **Diferencia de cuadrados en denominadores**: Resultado entero $a - b$ obtenido tras multiplicar el denominador por su conjugado.
propiedades_relaciones: |
  - **Racionalización de expresiones compuestas**: Técnica fundamental para simplificar fracciones algebraicas en cálculo, límites e identidades trigonométricas.
  - **Dominio de validez**: Exige $a \ge 0, b \ge 0$ con $a \neq b$ para evitar denominadores nulos.
ejemplo_guiado:
  enunciado: 'Racionaliza el denominador de la fracción $K = \frac{6}{\sqrt{5} - \sqrt{2}}$ multiplicando por su binomio conjugado.'
  pasos:
    - 'Paso 1: Identificamos el binomio del denominador $\sqrt{5} - \sqrt{2}$ y determinamos su conjugado cambiando el signo central: $\sqrt{5} + \sqrt{2}$.'
    - 'Paso 2: Amplificamos la fracción multiplicando numerador y denominador por el conjugado: $K = \frac{6}{\sqrt{5} - \sqrt{2}} \cdot \frac{\sqrt{5} + \sqrt{2}}{\sqrt{5} + \sqrt{2}}$.'
    - 'Paso 3: Desarrollamos el producto en el denominador aplicando suma por su diferencia: $(\sqrt{5})^2 - (\sqrt{2})^2 = 5 - 2 = 3$.'
    - 'Paso 4: Escribimos la fracción racionalizada $K = \frac{6(\sqrt{5} + \sqrt{2})}{3}$ y simplificamos los números enteros dividiendo $6 / 3 = 2 \implies K = 2(\sqrt{5} + \sqrt{2}) = 2\sqrt{5} + 2\sqrt{2}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el factor racionalizante necesario para eliminar las raíces en la fracción $\frac{N}{\sqrt{a} + \sqrt{b}}$?'
    choices:
      - {text: 'El binomio conjugado $\frac{\sqrt{a} - \sqrt{b}}{\sqrt{a} - \sqrt{b}}$, pues el producto genera la diferencia de cuadrados $(\sqrt{a})^2 - (\sqrt{b})^2 = a - b$', is_correct: true}
      - {text: 'El mismo binomio $\frac{\sqrt{a} + \sqrt{b}}{\sqrt{a} + \sqrt{b}}$ sin cambiar el signo', is_correct: false}
      - {text: 'La suma al cuadrado $(\sqrt{a} + \sqrt{b})^2$', is_correct: false}
      - {text: 'La multiplicación de las raíces $\frac{\sqrt{a \cdot b}}{\sqrt{a \cdot b}}$', is_correct: false}
    explanation: 'La alternativa correcta es ''El binomio conjugado $\frac{\sqrt{a} - \sqrt{b}}{\sqrt{a} - \sqrt{b}}$, pues el producto genera la diferencia de cuadrados $(\sqrt{a})^2 - (\sqrt{b})^2 = a - b$''. El producto por el conjugado elimina ambas raíces mediante $a - b$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de racionalizar la expresión $\frac{3}{3 - \sqrt{6}}$?'
    choices:
      - {text: '$3 + \sqrt{6}$, pues $\frac{3(3 + \sqrt{6})}{9 - 6} = \frac{3(3 + \sqrt{6})}{3} = 3 + \sqrt{6}$', is_correct: true}
      - {text: '$3 - \sqrt{6}$, sin cambiar el signo', is_correct: false}
      - {text: '$\frac{3 + \sqrt{6}}{6}$, restando mal los cuadrados', is_correct: false}
      - {text: '$9 + \sqrt{6}$, multiplicando sin simplificar', is_correct: false}
    explanation: 'La alternativa correcta es ''$3 + \sqrt{6}$, pues $\frac{3(3 + \sqrt{6})}{9 - 6} = \frac{3(3 + \sqrt{6})}{3} = 3 + \sqrt{6}$''. El producto por el conjugado da $3^2 - (\sqrt{6})^2 = 9 - 6 = 3$, simplificándose con el 3 del numerador.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el binomio del denominador con raíces cuadradas (ej: $\sqrt{a} + \sqrt{b}$).'
  - 'Paso 2: Escribir el binomio conjugado invirtiendo el signo central (ej: $\sqrt{a} - \sqrt{b}$).'
  - 'Paso 3: Multiplicar numerador y denominador por la expresión conjugada.'
  - 'Paso 4: Aplicar en el denominador el producto notable de suma por su diferencia $(\sqrt{a})^2 - (\sqrt{b})^2 = a - b$ y simplificar.'
errores_correccion: |
  - **Error 1:** Elevar al cuadrado el binomio del denominador multiplicando por la misma expresión (ej: $(\sqrt{a} + \sqrt{b})^2 = a + 2\sqrt{ab} + b$, lo cual NO elimina la raíz). **Cómo corregirlo:** Para eliminar las raíces debes multiplicar por el **conjugado** $(\sqrt{a} - \sqrt{b})$, formando una suma por su diferencia sin término medio doble: $(\sqrt{a})^2 - (\sqrt{b})^2 = a - b$.
  - **Error 2:** Racionalizar término por término individualmente en el denominador. **Cómo corregirlo:** Las raíces cuadradas conectadas por suma o resta se deben tratar como un bloque binomio indivisible mediante su conjugado.
ejemplos:
  - titulo: 'Racionalización binomio con raíces simples'
    enunciado: '¿La racionalización de $\frac{1}{\sqrt{3} - \sqrt{2}}$ resulta en $\sqrt{3} + \sqrt{2}$?'
    alternativas:
      - 'Sí, pues el denominador es $(\sqrt{3})^2 - (\sqrt{2})^2 = 3 - 2 = 1$'
      - 'No, resulta en $\sqrt{3} - \sqrt{2}$'
      - 'No, resulta en $\frac{\sqrt{3} + \sqrt{2}}{5}$'
    respuesta: 'Sí, pues el denominador es $(\sqrt{3})^2 - (\sqrt{2})^2 = 3 - 2 = 1$'
    solucion_pasos:
      - '1. Conjugado: $\sqrt{3} + \sqrt{2}$.'
      - '2. Denominador: $3 - 2 = 1 \implies \frac{\sqrt{3} + \sqrt{2}}{1} = \sqrt{3} + \sqrt{2}$.'
  - titulo: 'Racionalización binomio entero y raíz'
    enunciado: '¿Al racionalizar $\frac{2}{2 + \sqrt{2}}$ se obtiene $2 - \sqrt{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Conjugado $2 - \sqrt{2} \implies \frac{2(2 - \sqrt{2})}{4 - 2} = \frac{2(2 - \sqrt{2})}{2} = 2 - \sqrt{2}$.'
  - titulo: 'Producto por el conjugado'
    enunciado: '¿El producto de los binomios $(\sqrt{7} + \sqrt{3})(\sqrt{7} - \sqrt{3})$ es igual al entero $4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(\sqrt{7})^2 - (\sqrt{3})^2 = 7 - 3 = 4$.'
  - titulo: 'Preservación de equivalencia'
    enunciado: '¿Amplificar por el conjugado mantiene la equivalencia del valor numérico de la fracción?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Se multiplica por la fracción unitaria $\frac{\text{Conjugado}}{\text{Conjugado}} = 1$.'
errores_frecuentes:
  - 'Racionalizar el binomio del denominador $(\sqrt{a} + \sqrt{b})$ multiplicando por el mismo binomio $(\sqrt{a} + \sqrt{b})$.'
  - 'Al multiplicar un binomio por su conjugado $(\sqrt{a} + \sqrt{b})(\sqrt{a} - \sqrt{b})$, la respuesta es un trinomio con término medio doble.'
  - 'Racionalizar término a término individualmente una suma de raíces en el denominador.'
  - 'Cambiar el signo interno de los radicandos al buscar el binomio conjugado.'
  - 'Restar los radicandos dentro de una sola raíz al multiplicar por el conjugado.'
afirmaciones_verdaderas:
  - 'La racionalización de un denominador binomio $\sqrt{a} \pm \sqrt{b}$ requiere amplificar la fracción por su conjugado $\sqrt{a} \mp \sqrt{b}$ para formar una suma por su diferencia.'
  - 'El producto de dos binomios conjugados con raíces cuadradas $(\sqrt{a} + \sqrt{b})(\sqrt{a} - \sqrt{b})$ destruye ambos radicales entregando la diferencia de enteros $a - b$.'
