resumen_inicial: La racionalización de un denominador binomio con raíces cuadradas
  $\frac{a}{\sqrt{b} \pm \sqrt{c}}$ se logra amplificando por su conjugado $(\sqrt{b}
  \mp \sqrt{c})$, aplicando la suma por diferencia $(x+y)(x-y) = x^2 - y^2$ para eliminar
  los radicales del denominador.
explicacion_simple: Cuando en el denominador hay una suma o resta de raíces cuadradas,
  no basta con multiplicar por una sola raíz. Debemos multiplicar arriba y abajo por
  la misma expresión pero con el signo cambiado del medio (el conjugado), aprovechando
  que la suma por diferencia destruye los dos cuadrados.
explicacion_formal: 'Para todo $a \in \mathbb{R}$ y $b, c > 0$ con $b \neq c$, la
  **Racionalización por Conjugado Binomio** utiliza la identidad algebraica de la
  suma por su diferencia:


  $$\frac{a}{\sqrt{b} + \sqrt{c}} = \frac{a}{\sqrt{b} + \sqrt{c}} \cdot \frac{\sqrt{b}
  - \sqrt{c}}{\sqrt{b} - \sqrt{c}} = \frac{a(\sqrt{b} - \sqrt{c})}{\left(\sqrt{b}\right)^2
  - \left(\sqrt{c}\right)^2} = \frac{a(\sqrt{b} - \sqrt{c})}{b - c}$$


  **Definición de conjugado:**

  - El conjugado del binomio $(x + y)$ es el binomio $(x - y)$.

  - Producto de conjugados: $(\sqrt{b} + \sqrt{c})(\sqrt{b} - \sqrt{c}) = b - c \in
  \mathbb{Q}$.


  > **Complemento didáctico:** Si el denominador es $\sqrt{b} - \sqrt{c}$, su conjugado
  es $\sqrt{b} + \sqrt{c}$, obteniendo en el denominador el valor entero $(b - c)$.'
definiciones_clave: '- **Racionalización por conjugado**: Técnica de amplificación
  por el binomio de signo opuesto $(\sqrt{b} \mp \sqrt{c})$ fundamentada en $(x+y)(x-y)
  = x^2 - y^2$.'
propiedades_relaciones: '- **Suma por su diferencia**: $(\sqrt{b} + \sqrt{c})(\sqrt{b}
  - \sqrt{c}) = b - c$.'
ejemplo_guiado:
  enunciado: Racionalice la expresión $\frac{4}{\sqrt{5} - \sqrt{3}}$.
  pasos:
  - 'Paso 1: Identificar el binomio del denominador $\sqrt{5} - \sqrt{3}$ y su conjugado
    $\sqrt{5} + \sqrt{3}$.'
  - 'Paso 2: Amplificar la fracción por el conjugado: $\frac{4(\sqrt{5} + \sqrt{3})}{(\sqrt{5}
    - \sqrt{3})(\sqrt{5} + \sqrt{3})}$.'
  - 'Paso 3: Aplicar la suma por diferencia en el denominador: $(\sqrt{5})^2 - (\sqrt{3})^2
    = 5 - 3 = 2$.'
  - 'Paso 4: Simplificar el coeficiente exterior $4$ con el denominador $2$: $\frac{4(\sqrt{5}
    + \sqrt{3})}{2} = 2(\sqrt{5} + \sqrt{3})$.'
  - 'Conclusión: El resultado racionalizado es $2\sqrt{5} + 2\sqrt{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué producto notorio se aprovecha al amplificar un denominador binomio
    por su conjugado?
  choices:
  - text: La suma por su diferencia (x + y)(x - y) = x^2 - y^2
    is_correct: true
  - text: El cuadrado de binomio
    is_correct: false
  - text: El cubo de una suma
    is_correct: false
  - text: La regla de tres simple
    is_correct: false
  explanation: La alternativa correcta es 'La suma por su diferencia (x + y)(x - y)
    = x^2 - y^2'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4 / (sqrt(5) - sqrt(3)), ¿cuál fue la expresión
    racionalizada y simplificada?
  choices:
  - text: 2 · (sqrt(5) + sqrt(3))
    is_correct: true
  - text: 4 · (sqrt(5) - sqrt(3))
    is_correct: false
  - text: sqrt(5) + sqrt(3)
    is_correct: false
  - text: 8 / 2
    is_correct: false
  explanation: La alternativa correcta es '2 · (sqrt(5) + sqrt(3))'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de racionalizar denominadores binomios
  $\frac{a}{\sqrt{b} \pm \sqrt{c}}$, amplificando por su conjugado $(\sqrt{b} \mp
  \sqrt{c})$ y aplicando la suma por diferencia.
semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_BINOMIO_CONJUGADO
procedimiento:
- 'Paso 1: Identificar la estructura del denominador (monomio de raíz cuadrada, monomio
  $n$-ésimo o binomio).'
- 'Paso 2: Determinar el factor de amplificación conveniente (raíz idéntica, raíz
  de exponente complementario o conjugado).'
- 'Paso 3: Amplificar la fracción (numerador y denominador) por dicho factor.'
- 'Paso 4: Simplificar los radicales del denominador y reducir los coeficientes resultantes.'
errores_correccion: '- **Error 1: Multiplicar solo el denominador olvidando el numerador.**
  **Cómo corregirlo:** La racionalización es una AMPLIFICACIÓN de fracción; se DEBE
  multiplicar numerador y denominador por el mismo factor.


  - **Error 2: Amplificar un binomio $(\sqrt{a} + \sqrt{b})$ por la misma suma en
  lugar del conjugado.** **Cómo corregirlo:** El cuadrado de binomio deja el término
  $2\sqrt{ab}$; se debe amplificar por el CONJUGADO $(\sqrt{a} - \sqrt{b})$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de racionalización para MAT.NUM.RACIONALIZACION.DENOMINADOR_BINOMIO_CONJUGADO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del procedimiento de racionalización.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia numéríca.
  alternativas:
  - Conserva el valor
  - Altera el valor
  - Indeterminado
  respuesta: Conserva el valor
  solucion_pasos:
  - Demostración por amplificación por el elemento neutro 1.
- titulo: ¿Elimina la racionalización el valor irracional del denominador?
  respuesta: Sí
  solucion_pasos:
  - Sí, transforma el denominador en un número entero racional.
- titulo: ¿Altera la racionalización el valor cuantitativo de la fracción?
  respuesta: 'No'
  solucion_pasos:
  - No, es una amplificación equivalente por el número 1.
errores_frecuentes:
- Multiplicar únicamente la raíz del denominador sin modificar el numerador de la
  fracción.
- Amplificar un denominador de raíz $n$-ésima por la misma raíz sin usar el exponente
  complementario.
- Usar el cuadrado de binomio para racionalizar una suma de raíces cuadradas.
- La racionalización de $\frac{1}{\sqrt{2}}$ equivale al entero 2 tras eliminar la
  raíz.
- Cambiar los signos de los numeradores al aplicar el conjugado del denominador.
afirmaciones_verdaderas:
- La racionalización consiste en transformar una fracción con radicales en el denominador
  a una fracción equivalente con denominador racional.
- Amplificar por el factor de racionalización no altera el valor de la fracción por
  ser equivalente a multiplicar por 1.
