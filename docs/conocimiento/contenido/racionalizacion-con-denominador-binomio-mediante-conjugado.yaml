semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_BINOMIO_CONJUGADO
resumen_inicial: Para racionalizar un binomio con raíces cuadradas ($\sqrt{a} \pm
  \sqrt{b}$), se amplifica por su binomio conjugado ($\sqrt{a} \mp \sqrt{b}$) para
  aplicar suma por diferencia ($(x+y)(x-y) = x^2 - y^2$).
explicacion_simple: 'Cuando en el denominador hay una suma o resta con raíces (ejemplo
  $\sqrt{5} + \sqrt{2}$):

  1. Multiplicas arriba y abajo por su **conjugado** (la misma expresión cambiando
  el signo central: $\sqrt{5} - \sqrt{2}$).

  2. Abajo aplicas **suma por diferencia**: $(\sqrt{5} + \sqrt{2})(\sqrt{5} - \sqrt{2})
  = (\sqrt{5})^2 - (\sqrt{2})^2 = 5 - 2 = 3$.

  3. Desaparecen todas las raíces del denominador.'
explicacion_formal: 'Para $\sqrt{a} \pm \sqrt{b}$ en el denominador con $a, b \ge
  0$ y $a \neq b$, el conjugado es $\sqrt{a} \mp \sqrt{b}$. Por producto notable $(x+y)(x-y)
  = x^2 - y^2$:

  $$\frac{A}{\sqrt{a} + \sqrt{b}} = \frac{A(\sqrt{a} - \sqrt{b})}{(\sqrt{a} + \sqrt{b})(\sqrt{a}
  - \sqrt{b})} = \frac{A(\sqrt{a} - \sqrt{b})}{a - b}$$'
definiciones_clave: '- **Binomio conjugado**: Expresión binomia que difiere únicamente
  en el signo de su término central.'
propiedades_relaciones: '- **Suma por diferencia**: $(\sqrt{a} + \sqrt{b})(\sqrt{a}
  - \sqrt{b}) = a - b$.'
ejemplo_guiado:
  enunciado: Racionaliza el denominador de $\frac{6}{\sqrt{5} - \sqrt{2}}$.
  pasos:
  - Identificar el denominador $\sqrt{5} - \sqrt{2}$ y su conjugado $\sqrt{5} + \sqrt{2}$.
  - Amplificar la fracción por $\frac{\sqrt{5} + \sqrt{2}}{\sqrt{5} + \sqrt{2}}$.
  - 'Desarrollar el denominador: $(\sqrt{5})^2 - (\sqrt{2})^2 = 5 - 2 = 3$.'
  - 'Desarrollar la fracción: $\frac{6(\sqrt{5} + \sqrt{2})}{3}$.'
  - 'Simplificar entre 3: $2(\sqrt{5} + \sqrt{2}) = 2\sqrt{5} + 2\sqrt{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el conjugado del binomio $\sqrt{7} + 2$?
  choices:
  - text: \sqrt{7} - 2
    is_correct: true
  - text: -\sqrt{7} - 2
    is_correct: false
  - text: \sqrt{7} + 2
    is_correct: false
  - text: 7 - 2
    is_correct: false
  explanation: 'La correcta es: \sqrt{7} - 2. Se invierte el signo que une a ambos
    términos.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Racionaliza $\frac{2}{\sqrt{3} + 1}$.
  choices:
  - text: \sqrt{3} - 1
    is_correct: true
  - text: \sqrt{3} + 1
    is_correct: false
  - text: 2(\sqrt{3} - 1)
    is_correct: false
  - text: \sqrt{3}/2
    is_correct: false
  explanation: 'La correcta es: \sqrt{3} - 1. Denominador: $3 - 1 = 2$. Luego $\frac{2(\sqrt{3}
    - 1)}{2} = \sqrt{3} - 1$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el binomio del denominador.'
- 'Paso 2: Escribir su conjugado cambiando el signo central ($+ \leftrightarrow -$).'
- 'Paso 3: Amplificar numerador y denominador por el binomio conjugado.'
- 'Paso 4: Aplicar la diferencia de cuadrados en el denominador ($(\sqrt{a})^2 - (\sqrt{b})^2
  = a - b$).'
- 'Paso 5: Simplificar si es posible.'
errores_correccion: No multipliques por la misma expresión sin cambiar el signo. $(\sqrt{a}
  + \sqrt{b})^2 = a + 2\sqrt{ab} + b$, lo cual **no elimina** la raíz central.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Racionaliza $\frac{1}{\sqrt{3} - \sqrt{2}}$.
  alternativas:
  - \sqrt{3} + \sqrt{2}
  - \sqrt{3} - \sqrt{2}
  - '1'
  respuesta: \sqrt{3} + \sqrt{2}
  solucion_pasos:
  - 'Denominador: $3 - 2 = 1 \implies \sqrt{3} + \sqrt{2}$.'
errores_frecuentes:
- Olvidar cambiar el signo al formar el binomio conjugado.
afirmaciones_verdaderas:
- El conjugado de $\sqrt{a} + \sqrt{b}$ es $\sqrt{a} - \sqrt{b}$.
al_terminar_debes_poder: Racionalizar binomios con raíces mediante el método del
  conjugado.
fuente: Texto escolar MINEDUC.
estado: publicado
