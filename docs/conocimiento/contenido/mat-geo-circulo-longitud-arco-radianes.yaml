semantic_id: MAT.GEO.CIRCULO_METRICA.LONGITUD_ARCO_RADIANES
resumen_inicial: 'Cálculo de longitud de arco en radianes usando s = θr: conceptos,
  teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Cuando el ángulo central se mide en radianes (en vez de grados),
  la fórmula de longitud de arco se simplifica considerablemente.
explicacion_formal: '![Longitud de arco en radianes: s = θr](/static/img/geometria/circunferencia-circulo/circulo-longitud-arco-radianes.svg)


  ### Definición formal


  Si $\theta$ está expresado en radianes, la longitud del arco correspondiente es
  simplemente $s=\theta r$, sin necesidad de dividir entre 360° ni multiplicar por
  2π (esos factores ya están incorporados en la definición del radián).


  ### Desarrollo didáctico


  Un arco con ángulo central de $\frac{\pi}{2}$ radianes (equivalente a 90°) en una
  circunferencia de radio 8 cm mide $s=\frac{\pi}{2}\times8=4\pi\approx12,57$ cm,
  coincidiendo exactamente con el resultado obtenido usando la fórmula en grados.'
