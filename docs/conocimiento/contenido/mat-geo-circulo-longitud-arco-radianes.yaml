procedimiento:
- 'Paso 1: Verifica que el ángulo central esté expresado en radianes (si está en grados,
  conviértelo primero: radianes=grados×π/180).'
- 'Paso 2: Multiplica el ángulo (en radianes) por el radio.'
- 'Paso 3: Ese producto es la longitud del arco.'
