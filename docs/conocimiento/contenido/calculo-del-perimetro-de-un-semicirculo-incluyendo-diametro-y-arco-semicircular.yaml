semantic_id: MAT.GEO.CIRCULO_METRICA.PERIMETRO_SEMICIRCULO
resumen_inicial: El perímetro de un semicírculo cerrado comprende la suma del arco curvo semicircular y el diámetro recto de la base, expresándose como P = πr + 2r = r(π + 2).
explicacion_simple: '¡Cuidado, que esta es la trampa número uno de la geometría en las pruebas de selección! Si te piden el perímetro de un **semicírculo cerrado**, no basta con calcular la curva: tienes que sumar **el contorno completo de toda la figura cerrada**.


  Un semicírculo cerrado tiene dos bordes:

  1. El borde curvo de arriba (la mitad de la circunferencia): **$\pi r$**.

  2. El borde recto de abajo (el diámetro que lo cierra): **$2r$** (o $d$).


  Por lo tanto, su perímetro total es la suma de ambos: **$P = \pi r + 2r = r(\pi + 2)$**. Si solo calculas $\pi r$, la figura quedaría abierta como un puente sin suelo.


  ![Perímetro de un semicírculo cerrado](/static/img/nodos/calculo-del-perimetro-de-un-semicirculo-incluyendo-diametro-y-arco-semicircular-intro.svg)

  '
explicacion_formal: '### Descomposición de la frontera topológica

  Sea $\mathcal{S} = \{(x, y) \in \mathbb{R}^2 : x^2 + y^2 \le r^2, y \ge 0\}$ la región cerrada correspondiente al semicírculo. La frontera $\partial\mathcal{S}$ está compuesta por la unión disjunta de dos variedades unidimensionales:

  1. El arco semicircular curvo $\Gamma_{\text{curva}}$ de longitud $L_{\text{curva}} = \frac{2\pi r}{2} = \pi r$.

  2. El segmento de base diametral recta $\Gamma_{\text{recta}} = [-r, r] \times \{0\}$ de longitud $L_{\text{base}} = 2r$.


  ### Ecuación métrica del perímetro total cerrado

  El perímetro total es la suma de las longitudes de ambos bordes:

  $$P_{\text{semi}} = L_{\text{curva}} + L_{\text{base}} = \pi r + 2r = r(\pi + 2)$$


  ### En función del diámetro

  Sustituyendo $r = \frac{d}{2}$:

  $$P_{\text{semi}} = \pi\left(\frac{d}{2}\right) + d = \frac{\pi d}{2} + d = d\left(\frac{\pi}{2} + 1\right) = d\left(\frac{\pi + 2}{2}\right)$$


  > **Complemento didáctico:** Aprende a distinguir la redacción con lupa: si el problema dice ''longitud de la semicircunferencia'', la respuesta es solo la curva $\pi r$. Pero si dice ''perímetro del semicírculo'', la figura es una región cerrada y DEBES sumar obligatoriamente el diámetro: $P = \pi r + 2r$. ¡No dejes escapar este puntaje!

  '
definiciones_clave: '- **Perímetro de semicírculo cerrado**: Suma del arco curvo semicircular y el segmento rectilíneo de la base.

  - **Arco semicircular**: Mitad de la circunferencia de longitud $\pi r$.

  - **Base diametral**: Segmento que une los dos extremos del arco pasando por el centro ($2r$).

  '
propiedades_relaciones: '- **Factorización canónica**: $P = r(\pi + 2)$. Con $\pi \approx 3,14$, $P \approx 5,14 \cdot r$.

  - **Relación con el perímetro completo**: $P_{\text{semi}} = \frac{P_{\text{círculo}}}{2} + d$.

  - **Diferencia conceptual**: Semicircunferencia (1D abierta, $\pi r$) vs Semicírculo cerrado (2D con frontera cerrada, $\pi r + 2r$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de perímetro de semicírculo cerrado](/static/img/nodos/calculo-del-perimetro-de-un-semicirculo-incluyendo-diametro-y-arco-semicircular-ejemplos.svg)


    Se desea cercar un jardín con forma de semicírculo cerrado cuyo radio mide $r = 10\text{ m}$. Calcula la longitud exacta de cerca necesaria y halla el perímetro de un semicírculo de diámetro $d = 14\text{ cm}$.'
  pasos:
  - 'Paso 1: Calcular la longitud del arco curvo del jardín: $L_{\text{arco}} = \pi r = 10\pi\text{ m}$.'
  - 'Paso 2: Calcular la base recta (diámetro): $d = 2r = 2(10) = 20\text{ m}$.'
  - 'Paso 3: Sumar ambos componentes para el jardín: $P = 10\pi + 20\text{ m}$ (o $10(\pi + 2)\text{ m}$).'
  - 'Paso 4: Para el segundo semicírculo con $d = 14\text{ cm}$ ($r = 7\text{ cm}$): $P = \pi(7) + 14 = 7\pi + 14\text{ cm} = 7(\pi + 2)\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el perímetro total de un semicírculo cerrado de radio r?
  choices:
  - text: P = πr + 2r.
    is_correct: true
  - text: P = πr.
    is_correct: false
  - text: P = 2πr.
    is_correct: false
  - text: P = πr + r.
    is_correct: false
  explanation: La alternativa correcta es 'P = πr + 2r.' El contorno cerrado comprende el arco semicircular ($\pi r$) más el diámetro de la base ($2r$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el radio de un semicírculo cerrado es de 5 cm, ¿cuál es su perímetro expresado en forma factorizada?
  choices:
  - text: 5(π + 2) cm.
    is_correct: true
  - text: 5π cm.
    is_correct: false
  - text: 10π cm.
    is_correct: false
  - text: 5(π + 1) cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''5(π + 2) cm.'' Factorizando $r = 5$: $P = 5\pi + 2(5) = 5\pi + 10 = 5(\pi + 2)$ cm.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Determinar el radio $r$ y el diámetro $d = 2r$.

  2. Calcular la longitud de la parte curva: $L_{\text{curva}} = \pi r$.

  3. Calcular la longitud de la base recta: $L_{\text{base}} = 2r$.

  4. Sumar ambas partes y reportar el resultado: $P = \pi r + 2r = r(\pi + 2)$.

  '
errores_correccion: '- **Error común 1:** Olvidar sumar el diámetro y responder solo $\pi r$. **Corrección:** $\pi r$ es solo el arco superior; un semicírculo cerrado incluye su base recta ($2r$).

  - **Error común 2:** Sumar solo un radio en lugar de dos radios. **Corrección:** La base que une los extremos pasa por el centro y mide un diámetro completo ($2r$).

  '
ejemplos:
- tipo: A
  titulo: Perímetro semicircular con radio 8
  enunciado: ¿Cuál es el perímetro de una placa metálica en forma de semicírculo cerrado con radio $8\text{ cm}$?
  alternativas:
  - text: $8\pi + 16\text{ cm}$.
    is_correct: true
  - text: $8\pi\text{ cm}$.
    is_correct: false
  - text: $16\pi\text{ cm}$.
    is_correct: false
  - text: $8\pi + 8\text{ cm}$.
    is_correct: false
  explicacion: Arco $= 8\pi$ y diámetro $= 2(8) = 16$. Total $P = 8\pi + 16\text{ cm}$.
- tipo: B
  titulo: Suma del diámetro
  enunciado: ¿Incluye el perímetro de un semicírculo cerrado la longitud de su base recta diametral?
  respuesta: Sí
  explicacion: Sí. Al ser una figura geométrica cerrada, su perímetro incluye necesariamente el diámetro que la delimita por la base.
errores_frecuentes:
- '''Calcular solo el arco curvo $\pi r$ olvidando añadir el diámetro base $2r$.'''
- '''Sumar solo el radio $r$ a la curva en lugar del diámetro completo $2r$.'''
- '''Confundir semicircunferencia (abierta) con semicírculo (región plana cerrada).'''
afirmaciones_verdaderas:
- '''El perímetro de un semicírculo cerrado es igual a $\pi r + 2r$.'''
- '''La parte recta de la frontera de un semicírculo cerrado equivale exactamente a un diámetro ($2r$).'''
- '''En forma factorizada, el perímetro del semicírculo cerrado se escribe como $r(\pi + 2)$.'''
al_terminar_debes_poder: '**QUÉ:** Calcular el perímetro de semicírculos cerrados sumando arco curvo y diámetro.


  **CÓMO:** Aplicando la relación $P = \pi r + 2r = r(\pi + 2)$.


