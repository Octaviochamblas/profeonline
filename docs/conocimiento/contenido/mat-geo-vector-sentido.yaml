procedimiento:
- 'Paso 1: Identifica la dirección (línea) sobre la que se ubica el vector.'
- 'Paso 2: Observa hacia cuál de los dos lados de esa línea apunta la punta de la
  flecha.'
- 'Paso 3: Compara con otro vector de la misma dirección para determinar si tienen
  el mismo sentido o sentido opuesto.'
