semantic_id: MAT.GEO.VECTORES_BASE.SENTIDO
resumen_inicial: 'Concepto de sentido de un vector indicado por la flecha: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: El sentido de un vector responde a la pregunta '¿hacia cuál de
  los dos lados apunta la flecha?', dentro de una misma línea de dirección.
explicacion_formal: '![Sentido de un vector](/static/img/geometria/cartesiano-vectores/vector-sentido.svg)


  ### Definición formal


  Mientras la dirección de un vector describe la recta (o línea) sobre la que se ubica,
  el sentido indica hacia cuál de los dos lados posibles de esa recta apunta la flecha.
  Dos vectores paralelos (misma dirección) pueden tener el mismo sentido o sentido
  opuesto.


  ### Desarrollo didáctico


  En la figura, los vectores $\vec{v}$ y $-\vec{v}$ comparten exactamente la misma
  dirección (son paralelos), pero tienen sentido opuesto: uno apunta hacia arriba-derecha
  y el otro hacia abajo-izquierda.'
