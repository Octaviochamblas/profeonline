procedimiento:
- 'Paso 1: Observa la dirección del giro entre el punto original y su imagen.'
- 'Paso 2: Compara esa dirección con el movimiento de las manecillas de un reloj.'
- 'Paso 3: Si coincide con las manecillas, el sentido es horario; si es contrario,
  es antihorario.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con identificación del sentido de rotación.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de identificación del sentido de rotación para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando identificación del sentido de rotación.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de identificación del sentido de rotación
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de identificación del sentido de rotación.
- titulo: ¿Se cumple siempre la propiedad principal de identificación del sentido
    de rotación en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación del sentido de rotación asumir un valor negativo cuando
    representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en identificación del sentido de rotación.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en identificación
  del sentido de rotación.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en identificación
  del sentido de rotación.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de identificación
  del sentido de rotación.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
al_terminar_debes_poder: Identificar, calcular y aplicar las propiedades de identificación
