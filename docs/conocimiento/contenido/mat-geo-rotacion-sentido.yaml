semantic_id: MAT.GEO.ROTACION_PLANO.SENTIDO_ROTACION
resumen_inicial: 'Identificación del sentido de rotación: conceptos, teoremas, propiedades
  geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'El sentido de rotación indica ''hacia qué lado gira'' la figura:
  en el mismo sentido que las manecillas del reloj, o en sentido contrario.'
explicacion_formal: '![Sentido de rotación](/static/img/geometria/isometrias/rotacion-sentido.svg)


  ### Definición formal


  El sentido de rotación describe si el giro se realiza en sentido horario (igual
  al de las manecillas de un reloj) o antihorario (contrario a las manecillas de un
  reloj). Por convención matemática, el sentido antihorario corresponde a ángulos
  positivos, y el horario a ángulos negativos.


  ### Desarrollo didáctico


  En la figura, la flecha curva indica el sentido de rotación: si apunta en sentido
  contrario a las manecillas del reloj, la rotación es antihoraria (ángulo positivo);
  si apunta en el mismo sentido que las manecillas, es horaria (ángulo negativo).'
definiciones_clave: '- **Identificación del sentido de rotación**: Elemento o propiedad
  fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del sentido de rotación.'
ejemplo_guiado:
