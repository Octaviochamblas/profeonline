    obtenida?
  choices:
  - text: En la ecuación original presentada en la formulación inicial del problema.
    is_correct: true
  - text: En el último paso intermedio posterior a la reducción de términos semejantes.
    is_correct: false
  - text: Únicamente en el segundo miembro de la ecuación simplificada.
    is_correct: false
