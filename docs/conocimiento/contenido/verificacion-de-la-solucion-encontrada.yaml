semantic_id: MAT.ALG.RESOLUCION_LINEAL.VERIFICACION_SOLUCION
resumen_inicial: La verificación de una solución consiste en sustituir el valor obtenido
  en la ecuación original y comprobar que ambos miembros se igualen.
explicacion_simple: 'La **verificación** es la prueba definitiva para saber si resolviste
  bien una ecuación.

  Consiste en tomar el número obtenido como respuesta y colocarlo en lugar de la $x$
  en la **ecuación original** (la primera que te dieron).

  Calculamos el resultado del primer miembro y del segundo miembro por separado. Si
  ambos resultados son idénticos, ¡tienes la certeza de que tu respuesta es 100% correcta!'
explicacion_formal: 'Dada la ecuación $A(x) = B(x)$ y la solución encontrada $x =
  c$, el **algoritmo de verificación** requiere comprobar:


  $$\text{Evaluar: } A(c) \quad \text{y} \quad B(c)$$


  $$\text{Comprobar: } A(c) = B(c) \implies c \text{ es solución verificada}$$

  $$\text{Si } A(c) \neq B(c) \implies c \text{ es un resultado erróneo (revisar proceso)}$$'
definiciones_clave: '- **Verificación de la ecuación**: Prueba de comprobación que
  valida la exactitud del cálculo mediante sustitución directa.

  - **Identidad numérica resultante**: El valor numérico final compartido por ambos
  miembros tras evaluar la solución.'
propiedades_relaciones: '- **Detección de errores**: Permite descubrir fallos de signos,
  transposición o aritmética cometidos durante la resolución.'
ejemplo_guiado:
  enunciado: Verifica si el valor $x = 4$ es la solución correcta para la ecuación
    $3(x + 2) = 2x + 10$.
  pasos:
  - 'Paso 1: Sustituir $x = 4$ en el primer miembro de la ecuación original: $3(4
    + 2) = 3(6) = 18$.Paso 2: Sustituir $x = 4$ en el segundo miembro de la ecuación
    original: $2(4) + 10 = 8 + 10 = 18$.Paso 3: Comparar ambos miembros: $18 = 18$.Paso
    4: Concluir que $x = 4$ está verificado como la solución correcta de la ecuación.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En cuál de las expresiones debe sustituirse el valor de $x$ para verificar
    una ecuación?
  choices:
  - text: En la ecuación original dada al inicio del problema.
    is_correct: true
  - text: En el paso intermedio después de trasponer los términos.
    is_correct: false
  - text: Únicamente en el segundo miembro de la ecuación.
    is_correct: false
  - text: En una ecuación equivalente inventada.
    is_correct: false
  explanation: La alternativa correcta es 'En la ecuación original dada al inicio
    del problema.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al verificar la solución $x = 4$ en $3(x + 2) = 2x + 10$, ¿cuál es el
    valor numérico confirmado en ambos lados?
  choices:
  - text: $18$
    is_correct: true
  - text: $14$
    is_correct: false
  - text: $20$
    is_correct: false
  - text: $12$
    is_correct: false
  explanation: La alternativa correcta es '$18$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar el valor de la solución obtenida $x = c$.'
- 'Paso 2: Reemplazar $x$ por $c$ en el primer miembro de la ECUACIÓN ORIGINAL y calcular
  el número final.'
- 'Paso 3: Reemplazar $x$ por $c$ en el segundo miembro de la ECUACIÓN ORIGINAL y
  calcular el número final.'
- 'Paso 4: Verificar que ambos números finales sean exactamente iguales.'
errores_correccion: '- **Error común:** Hacer la verificación en un paso intermedio
  donde se cometió un error de signo previo.

  - **Cómo corregirlo:** Haz la sustitución SIEMPRE en la ecuación inicial para asegurar
  que no arrastras errores anteriores.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de transposición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de transposición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un término que suma pasa restando al otro miembro?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de transposición de términos.
- titulo: ¿Un coeficiente multiplicativo cambia de signo al pasar dividiendo?
  respuesta: 'No'
  solucion_pasos:
  - No, la división conserva el signo del número que divide.
errores_frecuentes:
- Trasponer un término sumando sin invertir su signo al pasar al otro miembro.
- Cambiar el signo de un coeficiente multiplicativo al trasponerlo dividiendo.
- Multiplicar solo el primer término del paréntesis al aplicar la propiedad distributiva.
- Olvidar cambiar el signo del segundo término al eliminar un paréntesis precedido
  por signo negativo.
- Sumar términos semejantes en el mismo miembro cambiando sus signos como si hubieran
  cruzado el igual.
afirmaciones_verdaderas:
- La transposición de términos traslada sumandos aplicando la operación inversa (opuesto
  aditivo).
- La verificación de una ecuación sustituye el valor obtenido en la ecuación original
  para confirmar la igualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones lineales
  aplicando transposición de términos, paréntesis y verificación de soluciones.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Primer Grado
