semantic_id: MAT.ALG.RESOLUCION_LINEAL.VERIFICACION_SOLUCION
resumen_inicial: 'Verificación de la solución encontrada: propiedades, resolución
  y modelamiento en Resolución de ecuaciones lineales.'
explicacion_simple: 'Las ecuaciones tienen algo maravilloso que casi ningún otro tema
  de matemáticas tiene: te permiten ''revisar tu propio examen'' antes de entregarlo.
  Si haces la comprobación, sabrás con 100% de certeza si tu nota es un 7.'
explicacion_formal: '### Definición formal


  Un error temprano corrompe la ecuación. Comprobar en una ecuación corrompida te
  dará un falso positivo.


  ### Desarrollo didáctico


  Paso 1: Resuelves la ecuación.

  Supón que resolviste $3x - 2 = x + 6$ y concluiste que $x = 4$.


  Paso 2: La prueba de fuego.

  Tomas tu $4$ y lo metes en la ecuación inicial. Nunca en los pasos intermedios,
  siempre en la original por si arrastraste un error.


  Lado Izquierdo: $3(4) - 2 = 12 - 2 = 10$.

  Lado Derecho: $(4) + 6 = 10$.


  Paso 3: Compara.

  ¿Es $10 = 10$? Sí. Tu respuesta es correcta y absoluta.

  ¿Qué pasa si hubiera dado $8 = 10$? Significaría que te equivocaste despejando,
  algún signo falló y debes revisar tu procedimiento.'
definiciones_clave: '- **Verificación de la solución encontrada**: Herramienta matemática
  para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a verificación de la solución encontrada.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando verificación de
    la solución encontrada.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de verificación de la
    solución encontrada.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla fundamental para mantener la igualdad al resolver verificación
    de la solución encontrada?
  choices:
  - text: Aplicar las propiedades aditiva y multiplicativa para despejar la incógnita
      en resolución de ecuaciones lineales
    is_correct: true
  - text: Sumar una cantidad en un miembro y restarla en el otro
    is_correct: false
  - text: Multiplicar un solo lado de la igualdad por cero
    is_correct: false
  - text: Cambiar el signo de los coeficientes sin moverlos de miembro
    is_correct: false
  explanation: 'La alternativa correcta es: Aplicar las propiedades aditiva y multiplicativa
    para despejar la incógnita en resolución de ecuaciones lineales. Es la regla de
    la igualdad en verificación de la solución encontrada.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al obtener el valor de la incógnita en verificación de la solución encontrada,
    ¿qué paso final se recomienda?
  choices:
  - text: Verificar la solución sustituyendo el valor hallado en la ecuación original
    is_correct: true
  - text: Igualar la solución a cero inmediatamente
    is_correct: false
  - text: Borrar los términos constantes de la ecuación
    is_correct: false
  - text: Dividir el resultado final entre la variable
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar la solución sustituyendo el
    valor hallado en la ecuación original. Garantiza que no se hayan cometido errores
    aritméticos en verificación de la solución encontrada.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Termina de resolver la ecuación y obtén tu posible solución.'
- 'Paso 2: Copia la ecuación ORIGINAL.'
- 'Paso 3: Sustituye la incógnita en todos los lados por tu número, usando paréntesis.'
- 'Paso 4: Calcula el valor de cada lado de manera independiente (no cruces números
  de un lado a otro).'
- 'Paso 5: Si los dos números finales son iguales, has verificado exitosamente.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en verificación de la solución encontrada.
ejemplos:
- titulo: Verifica si $x = -2$ es solución de $5x + 3 = -7$
  enunciado: Verifica si $x = -2$ es solución de $5x + 3 = -7$.
  solucion_pasos:
  - 'Sustituimos -2 en la ecuación: $5(-2) + 3$.'
  - 'Calculamos lado izquierdo: $-10 + 3 = -7$.'
  - 'Comparamos con el lado derecho: $-7$.'
  - $-7 = -7$. La solución es correcta.
- titulo: Si al verificar $x=1$ en una ecuación obtengo $5 = 6$, ¿qué concluyo?
  solucion_pasos:
  - La balanza está desequilibrada. Hay un error en el despeje.
- titulo: 'Respecto de «Verificación de la solución encontrada»: ¿Es correcta esta
    caracterización? «La'
  enunciado: 'Respecto de «Verificación de la solución encontrada»: ¿Es correcta esta
    caracterización? «La verificación consiste en sustituir el valor obtenido como
    respuesta en el lugar de la incógnita en la ecuación ORIGINAL»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La verificación consiste en
    sustituir el valor obtenido como respuesta en el lugar de la incógnita en la ecuación
    ORIGINAL.'
- titulo: 'Respecto de «Verificación de la solución encontrada»: ¿Es válida esta afirmación?
    «Verificar'
  enunciado: 'Respecto de «Verificación de la solución encontrada»: ¿Es válida esta
    afirmación? «Verificar el resultado en el segundo o tercer paso de la resolución
    (si te equivocaste en el primer paso, ¡la verificación dirá que está bien siendo
    un resultado malo!). Siempre usar la primera línea»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La verificación consiste en
    sustituir el valor obtenido como respuesta en el lugar de la incógnita en la ecuación
    ORIGINAL.'
errores_frecuentes:
- Verificar el resultado en el segundo o tercer paso de la resolución (si te equivocaste
  en el primer paso, ¡la verificación dirá que está bien siendo un resultado malo!).
  Siempre usar la primera línea.
- Porque es la única que tiene letras.
- Para practicar más la multiplicación.
- Para «¿Por qué es crucial realizar la verificación sustituyendo en la ecuación ORIGINAL
  del problema y no en un paso intermedio del despeje», la respuesta correcta es Porque
  los pasos intermedios siempre son incorrectos.
- Obtiene $-2 = 2$, por lo que concluye que hay un error.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_ponder: Resolver ecuaciones y sistemas lineales aplicando verificación
  de la solución encontrada.
