semantic_id: MAT.ALG.RESOLUCION_LINEAL.VERIFICACION_SOLUCION
resumen_inicial: La verificación de una solución consiste en sustituir el valor obtenido en la ecuación original y comprobar
  que ambos miembros adquieran el mismo valor numérico.
explicacion_simple: 'La **verificación** es la prueba matemática definitiva para confirmar si la resolución de una ecuación
  es correcta.


  Consiste en reemplazar el valor numérico obtenido en la variable de la **ecuación original** (la formulación inicial dada
  en el enunciado).


  Calculamos el resultado del primer miembro y del segundo miembro de forma independiente: si ambos valores resultan ser numéricamente
  idénticos, la solución queda comprobada.


  ![Verificación de la solución](/static/img/nodos/verificacion-de-la-solucion-encontrada-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la ecuación $A(x) = B(x)$ y la solución candidata $x = c$, el **algoritmo de verificación** requiere evaluar y comprobar
  la igualdad:


  $$\text{Evaluar separadamente: } A(c) \quad \text{y} \quad B(c)$$


  $$\text{Comprobar: } A(c) = B(c) \implies c \text{ es una solución verificada}$$


  $$\text{Si } A(c) \neq B(c) \implies c \text{ constituye una solución incorrecta}$$


  ### Desglose de la fórmula

  - $A(c)$: Evaluación del primer miembro mediante sustitución del valor $c$.

  - $B(c)$: Evaluación del segundo miembro mediante sustitución del valor $c$.


  ### Síntesis didáctica

  La verificación debe realizarse estrictamente sobre la expresión original del problema para evitar arrastrar posibles errores
  cometidos durante las transformaciones algebraicas intermedias.

  '
definiciones_clave: '- **Verificación de la ecuación**: Algoritmo de comprobación por sustitución que valida numéricamente
  el resultado obtenido.

  - **Identidad numérica resultante**: Valor numérico coincidente al que se reducen ambos miembros tras evaluar la solución.

  '
propiedades_relaciones: '- **Detección de errores**: Revela fallos operacionales de signos, distributiva o transposición cometidos
  durante la resolución.

  - **Autonomía matemática**: Otorga certeza absoluta sobre la validez de la solución obtenida sin requerir pautas externas.

  '
ejemplo_guiado:
  enunciado: Verifica si el valor candidato $x = 4$ es la solución correcta para la ecuación lineal $3(x + 2) = 2x + 10$.
  pasos:
  - 'Paso 1: Sustituir $x = 4$ en el primer miembro de la ecuación original: $3(4 + 2) = 3(6) = 18$.'
  - 'Paso 2: Sustituir $x = 4$ en el segundo miembro de la ecuación original: $2(4) + 10 = 8 + 10 = 18$.'
  - 'Paso 3: Comparar los valores numéricos obtenidos en ambos miembros: $18 = 18$.'
  - 'Paso 4: Concluir que $x = 4$ está verificado como la solución correcta de la ecuación.'
  imagen: /static/img/nodos/verificacion-de-la-solucion-encontrada-ejemplos.svg
checkpoints:
