  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar la solución candidata obtenida $x = c$.'
- 'Paso 2: Sustituir $x$ por $c$ en el primer miembro de la ECUACIÓN ORIGINAL y calcular su valor numérico.'
- 'Paso 3: Sustituir $x$ por $c$ en el segundo miembro de la ECUACIÓN ORIGINAL y calcular su valor numérico.'
- 'Paso 4: Comprobar la equivalencia: si los resultados coinciden ($A(c) = B(c)$), la solución es correcta; si difieren, existe
  un error.'
errores_correccion: '- **Error 1:** Realizar la sustitución de verificación en una ecuación intermedia simplificada donde
  se cometió un error de signo. **Cómo corregirlo:** La comprobación **DEBE HACERSE SIEMPRE EN LA ECUACIÓN ORIGINAL PARA ASEGURAR
  QUE NO SE ARRASTREN ERRORES ALGEBRAICOS INTERMEDIOS**.

  - **Error 2:** Alterar la estructura de la ecuación o transponer términos durante la verificación. **Cómo corregirlo:**
  La verificación **SÓLO REQUIERE EVALUAR ARITMÉTICAMENTE CADA MIEMBRO DE FORMA INDEPENDIENTE SIN MOVER TÉRMINOS**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al verificar $x = 5$ en la ecuación $4x - 3 = 17$, ¿se confirma que es la solución correcta?
  alternativas:
  - Sí, porque $4(5) - 3 = 20 - 3 = 17$
  - No, porque da $23$
  - No, porque el segundo miembro es cero
  respuesta: Sí, porque $4(5) - 3 = 20 - 3 = 17$
  solucion_pasos:
  - '1. Primer miembro: $4(5) - 3 = 17$.'
  - '2. Segundo miembro: $17$.'
  - 3. Puesto que $17 = 17$, la solución está verificada.
- titulo: Ejemplo 2
  enunciado: Verifica si $x = 2$ satisface la ecuación $5(x + 1) = 3x + 9$.
  alternativas:
  - Sí, pues $5(3) = 15$ y $3(2) + 9 = 15$
  - No, pues el primer miembro da $10$
  - No, pues el segundo miembro da $12$
  respuesta: Sí, pues $5(3) = 15$ y $3(2) + 9 = 15$
  solucion_pasos:
  - '1. Primer miembro: $5(2 + 1) = 5(3) = 15$.'
  - '2. Segundo miembro: $3(2) + 9 = 6 + 9 = 15$.'
  - 3. Como $15 = 15$, la solución es correcta.
- titulo: Independencia de miembros
  enunciado: ¿En la verificación se calcula cada miembro por separado sin transponer términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una evaluación aritmética independiente de cada lado.
- titulo: Diferencia de valores
  enunciado: ¿Obtener $12 = 15$ al evaluar un candidato a solución indica que el valor no es solución de la ecuación?
  respuesta: Sí
  solucion_pasos:
  - Sí, indica que la proposición resultante es falsa y el candidato es incorrecto.
errores_frecuentes:
- Realizar la sustitución de verificación en una ecuación intermedia simplificada que arrastra errores de signo.
- Efectuar transposición de términos durante la verificación en lugar de realizar una evaluación aritmética directa.
- Evaluar únicamente el primer miembro omitiendo el cálculo del segundo miembro.
- Modificar el signo de un candidato a solución negativo al momento de sustituirlo en la ecuación original.
- Confundir el valor de la solución $x = c$ con el resultado numérico idéntico alcanzado en la comprobación ($A(c) = B(c)$).
afirmaciones_verdaderas:
- Verificar una solución implica evaluar independientemente ambos miembros de la ecuación original.
- Si tras la sustitución ambos miembros adquieren el mismo valor numérico, la solución es válida.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/verificacion-de-la-solucion-encontrada-resumen.svg)


  QUÉ: Verificar numéricamente la solución de una ecuación lineal de primer grado.

  CÓMO: Sustituir el valor de la incógnita en la ecuación original y calcular independientemente ambos miembros comprobando
  su equivalencia numérica ($A_{\text{orig}}(c) \equiv B_{\text{orig}}(c)$).

  '
