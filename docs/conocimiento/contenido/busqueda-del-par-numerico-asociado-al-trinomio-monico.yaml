procedimiento:
- 'Paso 1: Detecta el patrón de signos: $(+)x^2 (-)x (+)$.'
- 'Paso 2: Escribe tus paréntesis con signos negativos pre-colocados: $(x - \quad)(x
  - \quad)$.'
- 'Paso 3: Busca dos números positivos que multiplicados den el 3er término y sumados
  den el valor numérico (sin signo) del 2do término.'
- 'Paso 4: Pon esos números en los espacios vacíos.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en búsqueda del par numérico asociado al trinomio mónico.
ejemplos:
- titulo: Factoriza $x^2 - 9x + 20$
  enunciado: Factoriza $x^2 - 9x + 20$.
  solucion_pasos:
  - Signos son $(-)$ y $(+)$. Ambos números serán negativos.
  - Multiplicados dan 20, sumados dan 9.
  - Los números son 4 y 5.
  - 'Resultado: $(x - 4)(x - 5)$.'
- titulo: En $y^2 - 10y + 16$, ¿cuál es la factorización?
  solucion_pasos:
  - 2 y 8 suman 10 y multiplican 16. Ambos van con signo menos.
- titulo: 'Respecto de «Búsqueda del par numérico asociado al trinomio mónico»: ¿Se
    ajusta a la definic'
  enunciado: 'Respecto de «Búsqueda del par numérico asociado al trinomio mónico»:
    ¿Se ajusta a la definición esta afirmación? «En un trinomio $x^2 - px + q$ (donde
    $q$ es positivo y el central es negativo), la factorización resultará siempre
    en $(x - a)(x - b)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En un trinomio $x^2 - px + q$
    (donde $q$ es positivo y el central es negativo), la factorización resultará siempre
    en $(x - a)(x - b)$.'
- titulo: 'Respecto de «Búsqueda del par numérico asociado al trinomio mónico»: ¿Es
    compatible con el p'
  enunciado: 'Respecto de «Búsqueda del par numérico asociado al trinomio mónico»:
    ¿Es compatible con el procedimiento esta afirmación? «Poner un signo positivo
    y uno negativo. Si lo haces, la multiplicación daría negativo, lo cual contradice
    el 3er término»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En un trinomio $x^2 - px + q$
    (donde $q$ es positivo y el central es negativo), la factorización resultará siempre
    en $(x - a)(x - b)$.'
errores_frecuentes:
- Poner un signo positivo y uno negativo. Si lo haces, la multiplicación daría negativo,
  lo cual contradice el 3er término.
- Equivocarse en la suma de números negativos, tratándolos como una resta.
- Para «Si en $x^2 + bx + c$, la letra 'c' es positiva y 'b' es negativa, ¿qué puedes
  deducir de los números que buscas», la respuesta correcta es Ambos son positivos.
- Para «Si en $x^2 + bx + c$, la letra 'c' es positiva y 'b' es negativa, ¿qué puedes
  deducir de los números que buscas», la respuesta correcta es Uno positivo y uno
  negativo.
- Para «Si en $x^2 + bx + c$, la letra 'c' es positiva y 'b' es negativa, ¿qué puedes
  deducir de los números que buscas», la respuesta correcta es Uno de ellos es cero.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
