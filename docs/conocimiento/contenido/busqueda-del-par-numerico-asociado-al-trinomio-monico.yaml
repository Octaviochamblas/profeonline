semantic_id: MAT.ALG.FACTOR_TRINOMIOS.PAR_NUMERICO_SIMPLE
resumen_inicial: La búsqueda del par numérico asociado al trinomio mónico consiste en hallar dos enteros $r$ y $s$ que satisfagan
  simultáneamente las ecuaciones $r \cdot s = q$ (producto) y $r + s = p$ (suma).
explicacion_simple: "Para factorizar $x^2 + px + q$ (ej: $x^2 + 7x + 12$):\n- **SISTEMA DE BÚSQUEDA DEL PAR NUMÉRICO ($r,\
  \ s$)**:\n  1. **Buscamos el PRODUCTO ($r \\cdot s = q$)**:\n     - Debes buscar dos números que **multiplicados den $12$**.\n\
  \     - Posibilidades: $(1, 12), (2, 6), (3, 4)$.\n  2. **Buscamos la SUMA ($r + s = p$)**:\n     - Esos mismos dos números\
  \ deben **sumar $7$**.\n     - Probamos: $1 + 12 = 13$, $2 + 6 = 8$, $3 + 4 = \\mathbf{7}$.\n  3. **¡Encontraste el Par\
  \ Numérico!**:\n     - El par es **$r = 3$ y $s = 4$** (¡porque $3 \\cdot 4 = 12$ y $3 + 4 = 7$!).\n- **Regla de los Signos\
  \ del Par**:\n  - Si $q > 0$: $r$ y $s$ tienen el **mismo signo** (ambos $+$ o ambos $-$).\n  - Si $q < 0$: $r$ y $s$ tienen\
  \ **signos opuestos** (uno $+$ y uno $-$).\n\n![Búsqueda del par numérico](/static/img/nodos/busqueda-del-par-numerico-asociado-al-trinomio-monico-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea el trinomio cuadrático mónico $P(x) = x^2 + px + q \in \mathbb{Z}[x]$. El problema de la **búsqueda del par numérico
  entero** $(r, s) \in \mathbb{Z}^2$ equivale a la resolución del sistema no lineal de ecuaciones diofánticas:


  $$\begin{cases} r \cdot s = q & \text{(Ecuación de producto)} \\ r + s = p & \text{(Ecuación de suma)} \end{cases}$$


  ### Análisis de Signos de la Pareja $(r, s)$

  El dominio de soluciones se restringe unívocamente mediante el signo de $q$ y $p$:

  - **Caso 1 ($q > 0, p > 0$)**: $r > 0 \land s > 0$ (ambos positivos).

  - **Caso 2 ($q > 0, p < 0$)**: $r < 0 \land s < 0$ (ambos negativos).

  - **Caso 3 ($q < 0, p > 0$)**: Signos distintos, el mayor en valor absoluto es positivo.

  - **Caso 4 ($q < 0, p < 0$)**: Signos distintos, el mayor en valor absoluto es negativo.


  ### Síntesis didáctica

  Probar ordenadamente los divisores enteros del término independiente $q$ hasta que su suma algebraica coincida con el coeficiente
  $p$ permite hallar la parejita $(r, s)$.

  '
definiciones_clave: '- **Par numérico ($r, s$)**: Par ordenado de números reales o enteros que satisfacen $r + s = p$ y $r
  \cdot s = q$.

  - **Divisores del término independiente**: Conjunto de parejas de enteros cuyo producto da el término libre $q$.

  - **Suma algebraica ($r + s$)**: Adición que considera los signos relativos para coincidir con el coeficiente del término
  lineal $p$.

  '
propiedades_relaciones: '- **Simetría del par**: El orden del par es indistinto ($r$ y $s$ son intercambiables en la adición
  y multiplicación).

  '
ejemplo_guiado:
  enunciado: Encuentra el par numérico $(r, s)$ para factorizar el trinomio $x^2 - 5x - 14$.
  pasos:
  - 'Paso 1: Identificamos los parámetros: $p = -5$ y $q = -14$.'
  - 'Paso 2: Como $q = -14 < 0$, los números $r$ y $s$ deben tener **signos opuestos**.'
  - 'Paso 3: Listamos las parejas que multiplicadas dan $-14$: - $(1, -14) \implies \text{Suma } = 1 - 14 = -13$. - $(-1,
    14) \implies \text{Suma } = -1 + 14 = 13$. - $(2, -7) \implies \text{Suma } = 2 - 7 = \mathbf{-5}$ (¡coincide exactamente
    con $p$!). - $(-2, 7) \implies \text{Suma } = -2 + 7 = 5$.'
  - 'Paso 4: Seleccionamos el par que suma $-5$: $r = 2$ y $s = -7$.'
  - 'Conclusión: El par numérico es **$r = 2$ y $s = -7$** (puesto que $2 \cdot (-7) = -14$ y $2 + (-7) = -5$).'
  imagen: /static/img/nodos/busqueda-del-par-numerico-asociado-al-trinomio-monico-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el par numérico $(r, s)$ necesario para factorizar el trinomio $x^2 - 9x + 20$?
  choices:
  - text: El par numérico es $r = -4$ y $s = -5$, porque $(-4) \cdot (-5) = +20$ y $(-4) + (-5) = -9$
    is_correct: true
  - text: El par numérico es $r = 4$ y $s = 5$
    is_correct: false
  - text: El par numérico es $r = -10$ y $s = 1$
    is_correct: false
  - text: El par numérico es $r = 20$ y $s = -1$
    is_correct: false
  explanation: La alternativa correcta es 'El par numérico es $r = -4$ y $s = -5$, porque $(-4) \cdot (-5) = +20$ y $(-4)
    + (-5) = -9$'. Producto $q=+20$, suma $p=-9 \implies (-4, -5)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $q = -18$ y $p = +3$, ¿qué signos deben tener los números $r$ y $s$ y cuál es el par correcto?
  choices:
  - text: Tienen signos opuestos, siendo el par correcto $r = +6$ y $s = -3$, porque $(+6) \cdot (-3) = -18$ y $(+6) + (-3)
      = +3$
    is_correct: true
  - text: 'Ambos son positivos: $r = 9$ y $s = 2$'
    is_correct: false
  - text: 'Tienen signos opuestos: $r = -6$ y $s = +3$'
    is_correct: false
  - text: 'Ambos son negativos: $r = -6$ y $s = -3$'
    is_correct: false
  explanation: La alternativa correcta es 'Tienen signos opuestos, siendo el par correcto $r = +6$ y $s = -3$, porque $(+6)
    \cdot (-3) = -18$ y $(+6) + (-3) = +3$'. Signos opuestos con suma positiva $\implies (+6, -3)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Listar todas las parejas de números enteros cuyo producto sea igual a $q$.'
- 'Paso 2: Evaluar los signos de las parejas según si $q$ es positivo o negativo.'
- 'Paso 3: Calcular la suma de cada pareja de números.'
- 'Paso 4: Seleccionar la pareja cuya suma algebraica sea exactamente igual al coeficiente $p$.'
errores_correccion: '- **Error 1:** Invertir la regla buscando dos números que sumen $q$ y multipliquen $p$. **Cómo corregirlo:**
  La regla **EXIGE MULTIPLICAR $q$ (término constante) Y SUMAR $p$ (término lineal)**.

  - **Error 2:** Asignar mal los signos cuando $q < 0$ (elegir $-7$ y $+2$ para sumar $+5$). **Cómo corregirlo:** Cuando el
  resultado de la suma debe ser positivo, **EL NÚMERO DE MAYOR VALOR ABSOLUTO DEBE LLEVAR EL SIGNO POSITIVO (+7 y -2)**.

  '
ejemplos:
- titulo: Producto positivo, suma positiva
  enunciado: Para $q = 12$ y $p = 7$, ¿es el par $(3, 4)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3 \cdot 4 = 12$ y $3 + 4 = 7$.
- titulo: Producto positivo, suma negativa
  enunciado: Para $q = 15$ y $p = -8$, ¿es el par $(-3, -5)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-3)(-5) = 15$ y $-3 - 5 = -8$.
- titulo: Producto negativo, suma positiva
  enunciado: Para $q = -12$ y $p = 1$, ¿es el par $(4, -3)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $4(-3) = -12$ y $4 - 3 = 1$.
- titulo: Producto negativo, suma negativa
  enunciado: Para $q = -20$ y $p = -1$, ¿es el par $(-5, 4)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-5)(4) = -20$ y $-5 + 4 = -1$.
errores_frecuentes:
- Invertir las condiciones de búsqueda tratando de sumar el término independiente y multiplicar el coeficiente lineal.
- Erración en los signos de los números enteros al calcular la suma de parejas con signo negativo.
- Elegir una pareja que cumple el producto pero no satisface la suma algebraica requerida.
- Ignorar que dos números negativos dan un producto positivo.
- Olvidar probar todas las combinaciones de factores de q.
afirmaciones_verdaderas:
- El par numérico $(r, s)$ de un trinomio mónico debe multiplicar $q$ y sumar $p$.
- Si el término independiente $q$ es negativo, las dos componentes del par numérico tienen signos opuestos.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/busqueda-del-par-numerico-asociado-al-trinomio-monico-resumen.svg)


  QUÉ: Encontrar el par numérico (r, s) para cualquier trinomio mónico satisfaciendo simultáneamente r · s = q y r + s = p.

  CÓMO: Listar los pares de divisores de $q$ respetando la regla de signos ($q > 0 \implies$ mismo signo; $q < 0 \implies$
  signos opuestos) y seleccionar la pareja cuya suma algebraica sea idéntica a $p$.

  '
