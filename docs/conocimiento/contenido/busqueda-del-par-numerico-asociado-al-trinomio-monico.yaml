semantic_id: MAT.ALG.FACTOR_TRINOMIOS.PAR_NUMERICO_SIMPLE
resumen_inicial: 'Búsqueda del par numérico asociado al trinomio mónico: concepto,
  método de descomposición y reglas en Factorización de trinomios cuadráticos.'
explicacion_simple: 'A veces la pista principal está en los signos. Si el tercer término
  es positivo, nos grita: "Los dos números tienen el mismo signo.". Pero si el término
  del medio es negativo. bueno, blanco y en botella: Ambos números deben ser negativos.'
explicacion_formal: '### Definición formal


  Producto positivo exige signos iguales. Suma negativa exige que esos signos iguales
  sean negativos.


  ### Desarrollo didáctico


  Estudiemos $x^2 - 7x + 12$.

  - Queremos que multiplicados den $+12$.

  - Queremos que sumados den $-7$.


  Para que la multiplicación sea positiva, pueden ser dos positivos o dos negativos.
  Pero como al sumarlos dan $-7$ (un número negativo), la única forma es que AMBOS
  sean negativos.


  Filtremos los pares que multiplican 12 y pongámosles signos negativos:

  - $(-1) \cdot (-12) = 12 \rightarrow$ Suma: $-13$ (No).

  - $(-2) \cdot (-6) = 12 \rightarrow$ Suma: $-8$ (No).

  - $(-3) \cdot (-4) = 12 \rightarrow$ Suma: $-7$ (Sí.).


  Nuestra factorización es $(x - 3)(x - 4)$. Un truco útil es simplemente buscar los
  números positivos que sumen el valor del medio y luego ponerles el signo menos a
  ambos.'
definiciones_clave: '- **Búsqueda del par numérico asociado al trinomio mónico**:
  Técnica de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en búsqueda del par numérico asociado al trinomio
  mónico.'
