resumen_inicial: La búsqueda del par numérico asociado al trinomio mónico consiste
  en encontrar dos números enteros $r, s$ que sumados den el coeficiente lineal $p$
  y multiplicados den el término independiente $q$.
explicacion_simple: 'Para factorizar $x^2 + 5x + 6$, buscas dos números $r$ y $s$
  que cumplan dos reglas al mismo tiempo: 1) Multiplicados den $6$ ($r \cdot s = 6$),
  y 2) Sumados den $5$ ($r + s = 5$). Los números son $2$ y $3$.'
explicacion_formal: 'Dado el trinomio mónico $x^2 + px + q$, la **Búsqueda del Par
  Numérico** exige resolver el sistema simétrico de ecuaciones diofánticas en $\mathbb{R}$:


  $$\begin{cases} r + s = p \\ r \cdot s = q \end{cases}$$


  **Desglose simbólico:**

  - $q > 0 \implies r$ y $s$ tienen el **mismo signo** (ambos positivos si $p>0$,
  ambos negativos si $p<0$).

  - $q < 0 \implies r$ y $s$ tienen **signos opuestos** (el de mayor valor absoluto
  adopta el signo de $p$).


  > **Complemento didáctico:** La descomposición en factores primos del término independiente
  $q$ limita de forma finita los pares candidatos a evaluar.'
definiciones_clave: '- **Par numérico de Vieta**: Par de enteros $(r, s)$ que satisface
  la suma $p$ y el producto $q$.

  - **Criterio de signos**: Regla lógica que deduce los signos de $r$ y $s$ según
  los signos de $p$ y $q$.'
propiedades_relaciones: '- **Relación con Vieta**: El par numérico coincide con el
  opuesto aditivo de las raíces de la ecuación $x^2 + px + q = 0$.'
ejemplo_guiado:
  enunciado: Encuentre el par numérico $(r, s)$ para el trinomio mónico $x^2 - 8x
    + 15$.
  pasos:
  - 'Paso 1: Identificar $p = -8$ y $q = 15$.'
  - 'Paso 2: Analizar los signos: Como $q = 15 > 0$, los números $r$ y $s$ tienen
    el mismo signo. Como $p = -8 < 0$, ambos números deben ser negativos.'
  - 'Paso 3: Listar los pares de factores que multiplican 15: $(-1, -15)$ y $(-3,
    -5)$.'
  - 'Paso 4: Probar la suma de cada par: $(-1) + (-15) = -16$ y $(-3) + (-5) = -8$.'
  - 'Paso 5: Seleccionar el par que suma $p = -8$: El par correcto es $r = -3$ y $s
    = -5$.'
  - 'Conclusión: El par numérico buscado es $(-3, -5)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si el término independiente $q$ es negativo ($q < 0$), ¿qué se puede afirmar
    sobre los signos del par numérico $(r, s)$?
  choices:
  - text: Tienen signos opuestos (uno positivo y uno negativo)
    is_correct: true
  - text: Tienen ambos signo positivo obligatoriamente
    is_correct: false
  - text: Tienen ambos signo negativo obligatoriamente
    is_correct: false
  - text: Ambos números deben ser cero
    is_correct: false
  explanation: La alternativa correcta es 'Tienen signos opuestos (uno positivo y
    uno negativo)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para el trinomio $x^2 - 8x + 15$, ¿cuál es el par numérico $(r, s)$ que
    cumple $r+s=-8$ y $r \cdot s=15$?
  choices:
  - text: $(-3, -5)$
    is_correct: true
  - text: $(3, 5)$
    is_correct: false
  - text: $(-1, -15)$
    is_correct: false
  - text: $(3, -5)$
    is_correct: false
  explanation: La alternativa correcta es '$(-3, -5)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los valores numéricos de $p$ y $q$.'
- 'Paso 2: Determinar si el par tiene signos iguales ($q>0$) o signos contrarios ($q<0$).'
- 'Paso 3: Evaluar las parejas de factores de $q$ hasta encontrar la que sume exactamente
  $p$.'
errores_correccion: '- **Error 1: Buscar números que multiplicados den $p$ y sumados
  den $q$.** **Cómo corregirlo:** La regla exige lo contrario: multiplicados deben
  dar el independiente $q$ y sumados el lineal $p$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Encuentre el par numérico para $x^2 + 2x - 24$.
  alternativas:
  - $(6, -4)$
  - $(-6, 4)$
  - $(12, -2)$
  respuesta: $(6, -4)$
  solucion_pasos:
  - 1. $q = -24 \to$ signos contrarios.
  - 2. $6 \cdot (-4) = -24$ y $6 + (-4) = 2$.
- titulo: Ejemplo 2
  enunciado: ¿Qué par numérico satisface $r+s=9$ y $r \cdot s=20$?
  alternativas:
  - $(4, 5)$
  - $(-4, -5)$
  - $(10, 2)$
  respuesta: $(4, 5)$
  solucion_pasos:
  - 1. $4 \cdot 5 = 20$ y $4 + 5 = 9$.
- titulo: Para el trinomio $x^2 - 5x - 14$, ¿el par numérico correcto es $(-7, 2)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-7) \cdot 2 = -14$ y $(-7) + 2 = -5$.
- titulo: ¿Existe un par numérico entero que sume $4$ y multiplique $7$?
  respuesta: 'No'
  solucion_pasos:
  - No, las únicas parejas de factores enteros de 7 son $(1, 7)$, cuya suma es 8.
errores_frecuentes:
- Invertir las condiciones buscando números que multipliquen $p$ y sumen $q$.
- Ignorar el signo negativo de $q$ produciendo dos números con el mismo signo.
- Asignar el signo de $p$ al número de menor valor absoluto cuando $q$ es negativo.
- Declarar que la suma del par numérico debe dar 0 en trinomios mónicos.
- Probar divisores que no pertenecen a los factores del término independiente $q$.
afirmaciones_verdaderas:
- El par numérico $(r, s)$ debe cumplir simultáneamente $r + s = p$ y $r \cdot s =
  q$.
- Si $q$ es positivo y $p$ es negativo, ambos componentes del par numérico son estrictamente
  negativos.
al_terminar_debes_poder: Al terminar serás capaz de encontrar el par numérico $(r,
  s)$ de un trinomio mónico respetando las leyes de signos.
