semantic_id: MAT.GEO.PITAGORAS.ENUNCIADO
resumen_inicial: 'El teorema de Pitágoras establece que en todo triángulo rectángulo, el área del cuadrado construido sobre la hipotenusa es igual a la suma de las áreas de los cuadrados construidos sobre los catetos: $c^2 = a^2 + b^2$.'
explicacion_simple: |
  ![Teorema de Pitágoras](/static/img/nodos/enunciado-del-teorema-de-pitagoras-el-cuadrado-de-la-hipotenusa-es-igual-a-la-suma-de-los-cuadrados-de-los-catetos-intro.svg)

  El teorema de Pitágoras es la regla más famosa de la geometría:

  - **Solo funciona con ángulo recto**: Requiere que el triángulo tenga una esquina perfecta de $90^\circ$.
  - **Suma de cuadrados**: Si dibujas un cuadrado sobre cada uno de los dos lados que forman la $L$ (catetos) y sumas sus áreas, obtienes exactamente el área del cuadrado sobre el lado largo inclinado (hipotenusa).
  - **La fórmula mágica**: $\text{Cateto}^2 + \text{Cateto}^2 = \text{Hipotenusa}^2$.
explicacion_formal: |
  ### Teorema formal de Pitágoras (Euclides I.47)
  En cualquier triángulo rectángulo $\Delta ABC$ en el plano euclidiano $\mathbb{R}^2$ con ángulo recto en el vértice $C$ ($\gamma = 90^\circ$), el cuadrado de la longitud de la hipotenusa $c$ es estrictamente igual a la suma de los cuadrados de las longitudes de los catetos $a$ y $b$:

  $$c^2 = a^2 + b^2 \iff AB^2 = BC^2 + AC^2$$

  ### Desglose simbólico y geométrico
  - $a = BC$: Longitud del cateto opuesto al vértice $A$.
  - $b = AC$: Longitud del cateto opuesto al vértice $B$.
  - $c = AB$: Longitud de la hipotenusa (lado opuesto al ángulo recto de $90^\circ$).
  - Interpretación geométrica de áreas: Si $Q_a, Q_b, Q_c$ son los cuadrados euclidianos construidos exteriormente sobre los lados, entonces $\operatorname{Área}(Q_c) = \operatorname{Área}(Q_a) + \operatorname{Área}(Q_b)$.

  ### Síntesis didáctica
  El teorema de Pitágoras define la métrica fundamental del espacio euclidiano plano, permitiendo relacionar de forma cuadrática e invariante las tres longitudes de un triángulo rectángulo.
definiciones_clave: |
  - **Hipotenusa ($c$)**: Lado de mayor longitud en un triángulo rectángulo, ubicado frente al ángulo recto.
  - **Catetos ($a, b$)**: Los dos lados perpendiculares entre sí que delimitan el ángulo recto de $90^\circ$.
  - **Teorema de Pitágoras**: Proposición geométrica que afirma la equivalencia $c^2 = a^2 + b^2$.
propiedades_relaciones: |
  - **Condición necesaria y suficiente**: $\Delta ABC$ es rectángulo en $C \iff c^2 = a^2 + b^2$.
  - **Desigualdad estricta**: $c > a$ y $c > b$, pero $c < a + b$ (por desigualdad triangular).
  - **Invariancia métrica**: Se cumple en cualquier posición u orientación del triángulo en el plano.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Enunciado de Pitágoras](/static/img/nodos/enunciado-del-teorema-de-pitagoras-el-cuadrado-de-la-hipotenusa-es-igual-a-la-suma-de-los-cuadrados-de-los-catetos-ejemplos.svg)

    En un triángulo rectángulo, los catetos miden $a = 3\text{ cm}$ y $b = 4\text{ cm}$. Construye los cuadrados sobre cada lado, calcula sus áreas y comprueba que la suma de las áreas de los catetos iguala el área del cuadrado de la hipotenusa.
  pasos:
  - 'Paso 1: Calcular el área del cuadrado sobre el primer cateto: $\operatorname{Área}_a = 3^2 = 9\text{ cm}^2$.'
  - 'Paso 2: Calcular el área del cuadrado sobre el segundo cateto: $\operatorname{Área}_b = 4^2 = 16\text{ cm}^2$.'
  - 'Paso 3: Sumar ambas áreas: $9 + 16 = 25\text{ cm}^2$.'
  - 'Paso 4: Extraer la raíz cuadrada para hallar la hipotenusa: $c = \sqrt{25} = 5\text{ cm}$.'
  - 'Paso 5: Verificar que $5^2 = 25\text{ cm}^2$, confirmando que $3^2 + 4^2 = 5^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación matemática que expresa el teorema de Pitágoras para un triángulo rectángulo de catetos a, b e hipotenusa c?
  choices:
  - text: $c^2 = a^2 + b^2$
    is_correct: true
  - text: $c = a + b$
    is_correct: false
  - text: $c^2 = a^2 - b^2$
    is_correct: false
  - text: $a^2 = b^2 + c^2$
    is_correct: false
  explanation: 'El teorema de Pitágoras establece que el cuadrado de la hipotenusa es igual a la suma de los cuadrados de los catetos ($c^2 = a^2 + b^2$).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los cuadrados construidos sobre los catetos tienen áreas de 9 cm² y 16 cm², ¿cuál es el área del cuadrado construido sobre la hipotenusa?
  choices:
  - text: $25\text{ cm}^2$
    is_correct: true
  - text: $7\text{ cm}^2$
    is_correct: false
  - text: $5\text{ cm}^2$
    is_correct: false
  - text: $144\text{ cm}^2$
    is_correct: false
  explanation: 'El área es $25\text{ cm}^2$, ya que sumando las áreas de los catetos se obtiene $9 + 16 = 25\text{ cm}^2$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el triángulo rectángulo y localizar el ángulo recto de $90^\circ$.'
- 'Paso 2: Reconocer los catetos $a$ y $b$ (los lados que forman el ángulo recto) y la hipotenusa $c$ (lado opuesto).'
- 'Paso 3: Elevar al cuadrado ambos catetos: $a^2$ y $b^2$.'
- 'Paso 4: Sumar los resultados para obtener el cuadrado de la hipotenusa: $c^2 = a^2 + b^2$.'
errores_correccion: 'No sumes las longitudes antes de elevarlas al cuadrado: $(a+b)^2 \neq a^2 + b^2$. Eleva cada cateto al cuadrado primero y luego suma.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si los catetos de un triángulo rectángulo miden $6\text{ cm}$ y $8\text{ cm}$, ¿cuál es el valor de $c^2$?
  alternativas:
  - $100\text{ cm}^2$
  - $14\text{ cm}^2$
  - $28\text{ cm}^2$
  respuesta: $100\text{ cm}^2$
  solucion_pasos:
  - '$c^2 = 6^2 + 8^2 = 36 + 64 = 100\text{ cm}^2$.'
- titulo: Ejemplo 2
  enunciado: ¿El teorema de Pitágoras se puede aplicar en un triángulo equilátero directamente sobre sus lados exteriores?
  alternativas:
  - 'No, solo se aplica en triángulos rectángulos (con un ángulo de 90°)'
  - Sí, en cualquier triángulo
  - Solo si todos los lados son pares
  respuesta: 'No, solo se aplica en triángulos rectángulos (con un ángulo de 90°)'
  solucion_pasos:
  - 'El teorema de Pitágoras exige estrictamente la presencia de un ángulo recto de $90^\circ$.'
- titulo: ¿El cuadrado de la hipotenusa es igual a la suma de los cuadrados de los catetos?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, es el postulado fundamental del Teorema de Pitágoras.'
- titulo: ¿En un triángulo rectángulo la hipotenusa es igual a la suma directa de los catetos (c = a + b)?
  respuesta: 'No'
  solucion_pasos:
  - 'No, por desigualdad triangular siempre se cumple $c < a + b$. La relación es cuadrática: $c = \sqrt{a^2 + b^2}$.'
errores_frecuentes:
- 'Sumar los lados sin elevar al cuadrado: creer erróneamente que $c = a + b$.'
- 'Aplicar el teorema en triángulos oblicuángulos (acutángulos u obtusángulos) sin trazar una altura.'
- 'Confundir un cateto con la hipotenusa al plantear la ecuación.'
- 'Olvidar extraer la raíz cuadrada al final para obtener la longitud lineal de $c$.'
- 'Elevar al cuadrado el signo de suma.'
afirmaciones_verdaderas:
- 'En todo triángulo rectángulo, el cuadrado de la hipotenusa es igual a la suma de los cuadrados de los catetos.'
- 'El área del cuadrado construido sobre la hipotenusa es igual a la suma de las áreas de los cuadrados sobre los catetos.'
al_terminar_debes_poder: |
  **QUÉ:** Enunciar e interpretar geométrica y algebraicamente el teorema de Pitágoras.

  **CÓMO:** Planteando la relación cuadrática $c^2 = a^2 + b^2$ y verificando la equivalencia de áreas cuadradas en el plano.

  ![Resumen de Enunciado de Pitágoras](/static/img/nodos/enunciado-del-teorema-de-pitagoras-el-cuadrado-de-la-hipotenusa-es-igual-a-la-suma-de-los-cuadrados-de-los-catetos-resumen.svg)
