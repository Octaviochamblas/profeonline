semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNCENTRO_RECTANGULO
resumen_inicial: En todo triángulo rectángulo, el circuncentro ($O$) se ubica exactamente
  en el punto medio de la hipotenusa. Por lo tanto, el circunradio es igual a la mitad
  de la hipotenusa ($R = c/2$).
explicacion_simple: '![Circuncentro en Rectángulo](/static/img/nodos/ubicacion-del-circuncentro-en-el-punto-medio-de-la-hipotenusa-de-un-triangulo-rectangulo-intro.svg)


  En un triángulo rectángulo (con un ángulo recto de $90^\circ$):


  - **Está justo en la mitad del lado más largo**: El circuncentro $O$ se ubica exactamente
  en el **punto medio de la hipotenusa**.

  - **El radio es la mitad de la hipotenusa**: El circunradio vale $R = \frac{c}{2}$.

  - **Teorema de Tales**: Si inscribes el triángulo en un círculo, la hipotenusa es
  el diámetro exacto del círculo.

  - **Distancia al vértice recto**: La distancia desde la esquina de $90^\circ$ hasta
  el punto medio de la hipotenusa también mide $R = \frac{c}{2}$.

  '
explicacion_formal: '### Teorema de Tales sobre el circuncentro

  En todo triángulo rectángulo $\Delta ABC$ ($\gamma = 90^\circ$), el circuncentro
  $O$ coincide exactamente con el **punto medio de la hipotenusa** y el circunradio
  mide la mitad de dicha hipotenusa:


  $$\gamma = 90^\circ \implies O \equiv M_{AB} = \frac{A + B}{2} \quad \land \quad
  R = \frac{c}{2}$$


  ### Desglose simbólico y geométrico

  - Hipotenusa como diámetro: La hipotenusa $\overline{AB}$ es el diámetro exacto
  de la circunferencia circunscrita ($c = 2R$).

  - Mediana a la hipotenusa: La transversal de gravedad $m_c = CO$ mide exactamente
  el radio: $m_c = R = c/2$.


  ### Síntesis didáctica

  El teorema de Tales en el triángulo rectángulo fija el circuncentro en el punto
  medio de la hipotenusa, garantizando que la mediana hacia ella mide la mitad de
  la hipotenusa.'
definiciones_clave: '- **Teorema de Tales**: Teorema por el cual un triángulo inscrito
  en una semicircunferencia es rectángulo.

  - **Punto medio de la hipotenusa**: Ubicación exacta del circuncentro $O$ en triángulos
  rectángulos.

  - **Mediana a la hipotenusa**: Segmento desde el vértice recto hasta el punto medio
  de la hipotenusa ($m_c = c/2$).

  '
propiedades_relaciones: '- **Posición del circuncentro**: $O = M_{\text{hipotenusa}}$.

  - **Circunradio**: $R = \frac{c}{2}$.

  - **Mediana relativa a la hipotenusa**: $m_c = OC = OA = OB = R = \frac{c}{2}$.

  - **Distancia ortocentro-circuncentro**: $d(H, O) = R = \frac{c}{2}$ (pues $H =
  C$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Circuncentro en Rectángulo](/static/img/nodos/ubicacion-del-circuncentro-en-el-punto-medio-de-la-hipotenusa-de-un-triangulo-rectangulo-ejemplos.svg)


    En un triángulo rectángulo, los catetos miden $a = 5\text{ cm}$ y $b = 12\text{
    cm}$. Determina la posición del circuncentro $O$, calcula la longitud del circunradio
    $R$ y la distancia desde el ortocentro hasta el circuncentro.

    '
  pasos:
  - 'Paso 1: Calcular la hipotenusa por Pitágoras: $c = \sqrt{5^2 + 12^2} = \sqrt{25
    + 144} = \sqrt{169} = 13\text{ cm}$.'
  - 'Paso 2: Ubicar el circuncentro: en el triángulo rectángulo, $O$ está en el punto
    medio de la hipotenusa.'
  - 'Paso 3: Calcular el circunradio: $R = \frac{c}{2} = \frac{13}{2} = 6.5\text{
    cm}$.'
  - 'Paso 4: Calcular la distancia $HO$: como el ortocentro $H$ está en el vértice
    recto, la distancia $HO$ es la mediana $m_c = R = 6.5\text{ cm}$.'
  - 'Paso 5: Concluir que $O$ está en el punto medio de la hipotenusa, $R = 6.5\text{
    cm}$ y $HO = 6.5\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubica exactamente el circuncentro en un triángulo rectángulo?
  choices:
  - text: En el punto medio de la hipotenusa
    is_correct: true
  - text: En el vértice del ángulo recto
    is_correct: false
  - text: En el interior del triángulo
    is_correct: false
  - text: En el exterior del triángulo
    is_correct: false
  explanation: El circuncentro se ubica exactamente en el punto medio de la hipotenusa
    en todo triángulo rectángulo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un triángulo rectángulo cuya hipotenusa mide 18 cm, ¿cuánto mide el
    circunradio R?
  choices:
  - text: $9\text{ cm}$
    is_correct: true
  - text: $18\text{ cm}$
    is_correct: false
  - text: $36\text{ cm}$
    is_correct: false
  - text: $4.5\text{ cm}$
    is_correct: false
  explanation: El circunradio mide $9\text{ cm}$, ya que es la mitad de la hipotenusa
    ($18 / 2 = 9\text{ cm}$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la hipotenusa $c$ del triángulo rectángulo (lado opuesto al
  ángulo de $90^\circ$).'
- 'Paso 2: Si no se conoce $c$, calcularla mediante Pitágoras: $c = \sqrt{a^2 + b^2}$.'
- 'Paso 3: Situar el circuncentro $O$ en el punto medio exacto de la hipotenusa.'
- 'Paso 4: Calcular el circunradio dividiendo la hipotenusa entre 2: $R = \frac{c}{2}$.'
errores_correccion: No confundas el circuncentro (punto medio de la hipotenusa) con
  el ortocentro (vértice del ángulo recto).
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo rectángulo de catetos $3\text{ cm}$ y $4\text{ cm}$,
    ¿cuánto mide la distancia desde el vértice del ángulo recto hasta el circuncentro?
  alternativas:
  - $2.5\text{ cm}$
  - $5\text{ cm}$
  - $3.5\text{ cm}$
  respuesta: $2.5\text{ cm}$
  solucion_pasos:
  - Hipotenusa $c = \sqrt{3^2 + 4^2} = 5\text{ cm}$.
  - 'La distancia del vértice recto al circuncentro es la mediana a la hipotenusa:
    $m_c = \frac{c}{2} = \frac{5}{2} = 2.5\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: Si el circunradio de un triángulo rectángulo es $7\text{ cm}$, ¿cuánto
    mide su hipotenusa?
  alternativas:
  - $14\text{ cm}$
  - $7\text{ cm}$
  - $3.5\text{ cm}$
  respuesta: $14\text{ cm}$
  solucion_pasos:
  - Hipotenusa $c = 2R = 2 \times 7 = 14\text{ cm}$.
- titulo: ¿En un triángulo rectángulo el circuncentro está ubicado sobre el perímetro
    del triángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, está exactamente sobre el lado de la hipotenusa (en su punto medio).
- titulo: ¿El ortocentro y el circuncentro coinciden en el triángulo rectángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, el ortocentro está en el vértice recto y el circuncentro está en el punto
    medio de la hipotenusa.
errores_frecuentes:
- Confundir la posición de $O$ (hipotenusa) con la de $H$ (vértice recto).
- Calcular el circunradio dividiendo un cateto por 2 en vez de la hipotenusa.
- Olvidar que la mediana hacia la hipotenusa mide $c/2$.
- Creer que el circuncentro de un triángulo rectángulo queda en el interior.
- Aplicar $R = c/2$ a triángulos que no son rectángulos.
afirmaciones_verdaderas:
- En todo triángulo rectángulo el circuncentro coincide con el punto medio de la hipotenusa.
- La longitud del circunradio en un triángulo rectángulo es igual a la mitad de la
  longitud de su hipotenusa.
al_terminar_debes_poder: '**QUÉ:** Determinar la ubicación del circuncentro y calcular
  el circunradio en triángulos rectángulos.


  **CÓMO:** Reconociendo que el circuncentro se ubica en el punto medio de la hipotenusa
  ($O = M_{\text{hip}}$) y aplicando $R = \frac{c}{2} = m_c$.


  ![Resumen de Circuncentro en Rectángulo](/static/img/nodos/ubicacion-del-circuncentro-en-el-punto-medio-de-la-hipotenusa-de-un-triangulo-rectangulo-resumen.svg)

  '
