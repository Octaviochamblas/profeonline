procedimiento:
- 'Paso 1: Si ves una expansión con solo 2 términos al cubo, está mala. Debe tener
  4 términos.'
- 'Forma correcta: $(2+1)^3 = 27$. Forma errónea: $2^3+1 = 9$. Diferencia $27-9 =
  18$.'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en detección de error por omisión de términos mixtos.
ejemplos:
- titulo: Análisis de afirmaciones
  enunciado: Un estudiante dice que para calcular el volumen de un cubo de lado $(x+2)$
    basta con calcular $x^3 + 8$. ¿Por qué falla?
  solucion_pasos:
  - 'El volumen es el lado al cubo: $(x+2)^3$.'
  - Al desarrollar correctamente se obtiene $x^3 + 6x^2 + 12x + 8$.
  - El estudiante omitió el volumen de los bloques rectangulares interiores.
- titulo: Al desarrollar $(x+1)^3$ un estudiante responde $x^3+1$. La diferencia numérica
    entre su res
  enunciado: 'Al desarrollar $(x+1)^3$ un estudiante responde $x^3+1$. La diferencia
    numérica entre su respuesta y la respuesta correcta para $x=2$ es:


    Opciones: A) $18$ · B) $12$ · C) $6$ · D) $27$'
  solucion_pasos:
  - 'Forma correcta: $(2+1)^3 = 27$. Forma errónea: $2^3+1 = 9$. Diferencia $27-9
    = 18$.'
  - 'Respuesta: $18$'
- titulo: 'Respecto de «Detección de error por omisión de términos mixtos»: ¿La siguiente
    formulación e'
  enunciado: 'Respecto de «Detección de error por omisión de términos mixtos»: ¿La
    siguiente formulación es correcta? «El error $(a+b)^3 = a^3 + b^3$ omite dos términos
    completos: $3a^2b$ y $3ab^2$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El error $(a+b)^3 = a^3 + b^3$
    omite dos términos completos: $3a^2b$ y $3ab^2$.'
- titulo: 'Respecto de «Detección de error por omisión de términos mixtos»: ¿La siguiente
    conclusión es'
  enunciado: 'Respecto de «Detección de error por omisión de términos mixtos»: ¿La
    siguiente conclusión es correcta? «Confundir la expansión de $(a+b)^3$ con la
    factorización de suma de cubos $a^3+b^3$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El error $(a+b)^3 = a^3 + b^3$
    omite dos términos completos: $3a^2b$ y $3ab^2$.'
errores_frecuentes:
- Confundir la expansión de $(a+b)^3$ con la factorización de suma de cubos $a^3+b^3$.
- Para «Al desarrollar $(x+1)^3$ un estudiante responde $x^3+1$. La diferencia numérica
  entre su respuesta y la respuesta correcta para $x=2$ es:», la respuesta correcta
  es $12$.
- Para «Al desarrollar $(x+1)^3$ un estudiante responde $x^3+1$. La diferencia numérica
  entre su respuesta y la respuesta correcta para $x=2$ es:», la respuesta correcta
  es $6$.
- Para «Al desarrollar $(x+1)^3$ un estudiante responde $x^3+1$. La diferencia numérica
  entre su respuesta y la respuesta correcta para $x=2$ es:», la respuesta correcta
  es $27$.
- La afirmación «$18$» no es válida en este contenido.
