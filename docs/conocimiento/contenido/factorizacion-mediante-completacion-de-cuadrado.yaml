semantic_id: MAT.ALG.FACTOR_CUADRADOS.COMPLETACION_CUADRADO
resumen_inicial: 'La factorización mediante completación de cuadrado consiste en sumar y restar un término numérico o algebraico adecuado para transformar un trinomio en un Trinomio Cuadrado Perfecto combinado con una diferencia de cuadrados.'
explicacion_simple: |
  Cuando tienes una expresión de la forma $x^2 + bx$ (o un trinomio que no es un Trinomio Cuadrado Perfecto perfecto) y quieres factorizarla:
  - **TÉCNICA DE COMPLETACIÓN DE CUADRADO**:
    1. **Toma el coeficiente central de $x$ ($b$)**:
       - En $x^2 + 6x$, el número central es **$6$**.
    2. **Divídelo por 2 y elévalo al cuadrado**:
       - $\left(\frac{6}{2}\right)^2 = 3^2 = \mathbf{9}$.
    3. **Suma y Resta ese número ($+9 - 9$)**:
       - $x^2 + 6x = (x^2 + 6x \mathbf{+ 9}) \mathbf{- 9}$.
    4. **Transforma en Trinomio Cuadrado Perfecto y Resta**:
       - El bloque $(x^2 + 6x + 9)$ se convierte en **$(x + 3)^2$**.
       - La expresión queda: $\mathbf{(x + 3)^2 - 9}$.
    5. **¡Factoriza la Diferencia de Cuadrados resultante!**:
       - $(x + 3)^2 - 3^2 = ((x+3) + 3)((x+3) - 3) = \mathbf{(x + 6)(x)}$.
explicacion_formal: |
  ### Definición formal
  Sea la función cuadrática mónica $P(x) = x^2 + bx + c \in \mathbb{R}[x]$. El método de **completación de cuadrado** aplica el mapa de reestructuración algebraica basado en la identidad del neutro aditivo $0 = \left(\frac{b}{2}\right)^2 - \left(\frac{b}{2}\right)^2$:

  $$P(x) = \left( x^2 + bx + \left(\frac{b}{2}\right)^2 \right) + c - \left(\frac{b}{2}\right)^2 = \left( x + \frac{b}{2} \right)^2 - \left[ \left(\frac{b}{2}\right)^2 - c \right]$$

  ### Transformación en Diferencia de Cuadrados
  Definiendo $k^2 = \left(\frac{b}{2}\right)^2 - c \ge 0$, la expresión se reduce a la diferencia de cuadrados en $\mathbb{R}[x]$:

  $$P(x) = \left( x + \frac{b}{2} \right)^2 - k^2 = \left( x + \frac{b}{2} + k \right) \left( x + \frac{b}{2} - k \right)$$

  ### Síntesis didáctica
  Completar el cuadrado es una poderosa estrategia algebraica que convierte cualquier cuadrática en la diferencia entre un cuadrado de binomio y una constante, permitiendo su factorización inmediata.
definiciones_clave: |
  - **Completación de cuadrado**: Técnica algebraica que suma y resta $\left(\frac{b}{2}\right)^2$ para formar un TCP.
  - **Término completador ($\left(\frac{b}{2}\right)^2$)**: Cantidad exacta requerida para convertir $x^2 + bx$ en el trinomio cuadrado perfecto $\left(x + \frac{b}{2}\right)^2$.
  - **Neutro aditivo ($+K - K = 0$)**: Principio que exige restar la misma cantidad sumada para no alterar el valor de la expresión original.
propiedades_relaciones: |
  - **Factorización sobre $\mathbb{R}$**: Si $\left(\frac{b}{2}\right)^2 - c \ge 0$, la expresión es factorizable en el cuerpo de los números reales $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Factoriza el polinomio $x^2 + 8x + 12$ mediante el método de completación de cuadrado.'
  pasos:
    - 'Paso 1: Identificamos el coeficiente lineal de $x$: $b = 8$.'
    - 'Paso 2: Calculamos el término completador: $\left(\frac{8}{2}\right)^2 = 4^2 = \mathbf{16}$.'
    - 'Paso 3: Sumamos y restamos 16 en la expresión original:
       $x^2 + 8x + 16 + 12 - 16$.'
    - 'Paso 4: Agrupamos el TCP y simplificamos la constante:
       $(x^2 + 8x + 16) - 4 \implies \mathbf{(x + 4)^2 - 4}$.'
    - 'Paso 5: Factorizamos la diferencia de cuadrados $(x + 4)^2 - 2^2$:
       $((x + 4) + 2)((x + 4) - 2) = \mathbf{(x + 6)(x + 2)}$.'
    - 'Conclusión: La factorización completada es **$(x + 6)(x + 2)$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué número debe sumarse y restarse para completar el cuadrado en el polinomio $x^2 + 10x + 9$?'
    choices:
      - {text: 'Debe sumarse y restarse 25, calculado como $\left(\frac{10}{2}\right)^2 = 5^2 = 25$', is_correct: true}
      - {text: 'Debe sumarse y restarse 10', is_correct: false}
      - {text: 'Debe sumarse y restarse 100', is_correct: false}
      - {text: 'Debe sumarse y restarse 5', is_correct: false}
    explanation: 'La alternativa correcta es ''Debe sumarse y restarse 25, calculado como $\left(\frac{10}{2}\right)^2 = 5^2 = 25$''. Término completador $\left(\frac{b}{2}\right)^2 = \left(\frac{10}{2}\right)^2 = 25$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al completar el cuadrado en $x^2 - 6x + 5$, obtenemos la forma $(x - 3)^2 - 4$. ¿Cuál es la factorización en dos factores lineales?'
    choices:
      - {text: 'Es $(x - 5)(x - 1)$, calculando $((x - 3) + 2)((x - 3) - 2) = (x - 1)(x - 5)$', is_correct: true}
      - {text: 'Es $(x - 3)^2 - 2$', is_correct: false}
      - {text: 'Es $(x + 5)(x + 1)$', is_correct: false}
      - {text: 'Es $(x - 3)(x - 4)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Es $(x - 5)(x - 1)$, calculando $((x - 3) + 2)((x - 3) - 2) = (x - 1)(x - 5)$''. Diferencia de cuadrados $((x-3)+2)((x-3)-2) = (x-1)(x-5)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el coeficiente del término de primer grado ($b$).'
  - 'Paso 2: Calcular el cuadrado de la mitad de dicho coeficiente: $\left(\frac{b}{2}\right)^2$.'
  - 'Paso 3: Sumar y restar esa cantidad dentro del polinomio para conservar la igualdad.'
  - 'Paso 4: Formar el TCP $(x + \frac{b}{2})^2$ y factorizar la diferencia de cuadrados final.'
errores_correccion: |
  - **Error 1:** Sumar la cantidad $\left(\frac{b}{2}\right)^2$ sin restarla a la vez. **Cómo corregirlo:** Para mantener el valor de la expresión **SE DEBE SUMAR Y RESTAR LA MISMA CANTIDAD EXPRESA ($+K - K = 0$)**.
  - **Error 2:** Excluir la división por 2 del coeficiente $b$ antes de elevarlo al cuadrado. **Cómo corregirlo:** El término completador **EXIGE DIVIDIR POR 2 Y LUEGO ELEVAR AL CUADRADO ($\left(\frac{b}{2}\right)^2$)**.
ejemplos:
  - titulo: 'Cálculo de término completador'
    enunciado: 'Para $x^2 + 4x$, ¿es $\left(\frac{4}{2}\right)^2 = 4$ la cantidad a sumar y restar?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(4/2)^2 = 4$.'
  - titulo: 'Formación de TCP'
    enunciado: '¿Forman $x^2 + 4x + 4$ el cuadrado de binomio $(x + 2)^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es el TCP.'
  - titulo: 'Diferencia de cuadrados resultante'
    enunciado: 'En $(x + 2)^2 - 9$, ¿es el resultado de factorizar $(x + 5)(x - 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(x+2+3)(x+2-3) = (x+5)(x-1)$.'
  - titulo: 'Coeficiente lineal impar'
    enunciado: 'Para $x^2 + 3x$, ¿es el término completador la fracción $\left(\frac{3}{2}\right)^2 = \frac{9}{4}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(3/2)^2 = 9/4$.'
errores_frecuentes:
  - 'Sumar el término completador sin restarlo en la misma expresión alterando su valor numérico.'
  - 'Elevar al cuadrado el coeficiente lineal sin dividirlo previamente por 2.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Restar mal la constante sobrante al armar la diferencia de cuadrados.'
  - 'La realización de la diferencia de cuadrados final tras completar el trinomio no se ejecuta.'
afirmaciones_verdaderas:
  - 'La completación de cuadrado suma y resta $\left(\frac{b}{2}\right)^2$ para convertir una cuadrática en un TCP.'
  - 'El método reduce la expresión a una diferencia de cuadrados factorizable sobre los números reales.'
