resumen_inicial: La factorización mediante completación de cuadrado es la técnica
  que suma y resta un término adecuado $\left(\frac{b}{2}\right)^2$ para transformar
  un trinomio en la diferencia de cuadrados $(x + k)^2 - d^2$.
explicacion_simple: Si un trinomio como $x^2 + 6x + 5$ no es un trinomio cuadrado
  perfecto, tomas el número del medio ($6$), lo divides por 2 ($3$) y lo elevas al
  cuadrado ($9$). Sumas y restas $9$ para crear el TCP $(x^2 + 6x + 9) - 4 = (x +
  3)^2 - 2^2$, y luego usas diferencia de cuadrados.
explicacion_formal: 'Dado un trinomio mónico de segundo grado $P(x) = x^2 + bx + c$,
  la **Completación de Cuadrado** aplica la adición del neutro aditivo $0 = k^2 -
  k^2$ con $k = \frac{b}{2}$:


  $$P(x) = \left(x^2 + bx + \left(\frac{b}{2}\right)^2\right) + c - \left(\frac{b}{2}\right)^2
  = \left(x + \frac{b}{2}\right)^2 - \left[\left(\frac{b}{2}\right)^2 - c\right]$$


  **Desglose simbólico:**

  - $\left(\frac{b}{2}\right)^2$: Término de completación para formar el TCP en $x$.

  - $\left(x + \frac{b}{2}\right)^2$: Binomio al cuadrado perfecto constituido.

  - $d^2 = \left(\frac{b}{2}\right)^2 - c$: Constante resultante que convierte la
  expresión en la diferencia de cuadrados $(x + k)^2 - d^2 = (x + k + d)(x + k - d)$.


  > **Complemento didáctico:** Permite factorizar cualquier trinomio de segundo grado
  con raíces reales aunque no sea un TCP inicial.'
definiciones_clave: '- **Completación de cuadrado**: Algoritmo algebraico que transforma
  un trinomio mediante la suma y resta de $(b/2)^2$.

  - **Factorización por diferencia secundaria**: Aplicación final de $A^2 - B^2$ sobre
  la estructura completada.'
propiedades_relaciones: '- **Condición de factorizabilidad real**: Requiere que la
  constante resultante $d^2 = \left(\frac{b}{2}\right)^2 - c \ge 0$.'
ejemplo_guiado:
  enunciado: Factorice el trinomio $x^2 + 6x + 5$ mediante el método de completación
    de cuadrado.
  pasos:
  - 'Paso 1: Identificar el coeficiente del término lineal $b = 6$.'
  - 'Paso 2: Calcular el término de completación: $k = \frac{6}{2} = 3 \implies k^2
    = 3^2 = 9$.'
  - 'Paso 3: Sumar y restar 9 en el trinomio: $(x^2 + 6x + 9) + 5 - 9$.'
  - 'Paso 4: Factorizar el TCP y operar constantes: $(x + 3)^2 - 4 = (x + 3)^2 - 2^2$.'
  - 'Paso 5: Aplicar diferencia de cuadrados: $[(x + 3) + 2][(x + 3) - 2] = (x + 5)(x
    + 1)$.'
  - 'Conclusión: La expresión factorizada es $(x + 5)(x + 1)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para determinar el valor constante que debe sumarse
    y restarse al completar cuadrados en $x^2 + bx + c$?
  choices:
  - text: $\left(\frac{b}{2}\right)^2$
    is_correct: true
  - text: $\left(\frac{b}{4}\right)^2$
    is_correct: false
  - text: $2b^2$
    is_correct: false
  - text: $\frac{b^2}{2}$
    is_correct: false
  explanation: La alternativa correcta es '$\left(\frac{b}{2}\right)^2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la completación de cuadrado para $x^2 + 6x + 5$, ¿cuál es la estructura
    de diferencia de cuadrados intermedia obtenida?
  choices:
  - text: $(x + 3)^2 - 2^2$
    is_correct: true
  - text: $(x + 6)^2 - 9^2$
    is_correct: false
  - text: $(x + 3)^2 + 4$
    is_correct: false
  - text: $(x - 3)^2 - 2^2$
    is_correct: false
  explanation: La alternativa correcta es '$(x + 3)^2 - 2^2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir por 2 el coeficiente del término lineal $b$ y elevarlo al cuadrado
  $\left(\frac{b}{2}\right)^2$.'
- 'Paso 2: Sumar y restar dicho valor para estructurar un TCP entre paréntesis.'
- 'Paso 3: Reducir las constantes libres y factorizar la diferencia de cuadrados resultante.'
errores_correccion: '- **Error 1: Sumar $\left(\frac{b}{2}\right)^2$ sin restarlo
  en la misma expresión alterando el valor cuantitativo del polinomio.** **Cómo corregirlo:**
  Para mantener el valor algebraico, se DEBE sumar y restar exactamente el mismo número
  ($+k^2 - k^2 = 0$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al completar cuadrados en $x^2 + 8x + 12$, ¿cuál es el valor $k^2$ que
    se debe sumar y restar?
  alternativas:
  - $16$, porque $(8/2)^2 = 16$
  - $64$, porque $8^2 = 64$
  - $4$, porque $8/2 = 4$
  respuesta: $16$, porque $(8/2)^2 = 16$
  solucion_pasos:
  - 1. $b = 8 \implies b/2 = 4 \implies 4^2 = 16$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la forma factorizada final de $x^2 + 4x - 5$ por completación
    de cuadrado?
  alternativas:
  - $(x + 5)(x - 1)$
  - $(x + 2)^2 - 9$
  - $(x - 5)(x + 1)$
  respuesta: $(x + 5)(x - 1)$
  solucion_pasos:
  - 1. $(x^2 + 4x + 4) - 5 - 4 = (x + 2)^2 - 9 = (x + 2 + 3)(x + 2 - 3) = (x + 5)(x
    - 1)$.
- titulo: ¿Se puede aplicar completación de cuadrado a cualquier trinomio cuadrático
    de la forma $x^2 + bx + c$?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un método algebraico universal.
- titulo: Si tras completar cuadrados se obtiene $(x + k)^2 + d^2$ con $d^2 > 0$,
    ¿posee el trinomio raíces reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una suma de cuadrados no es factorizable en los números reales $\mathbb{R}$.
errores_frecuentes:
- Sumar el valor de completación $\left(\frac{b}{2}\right)^2$ sin restarlo simultáneamente
  alterando la expresión.
- Dividir el término cuadrático $x^2$ por 2 al intentar calcular la completación.
- Declarar que la completación de cuadrado concluye con la forma $(x + k)^2 - d^2$
  sin descomponer la diferencia de cuadrados.
- Declarar que la completación de cuadrado solo funciona si los coeficientes son números
  enteros pares.
- Restar el término constante $c$ antes de haber calculado el valor de completación.
afirmaciones_verdaderas:
- La completación de cuadrado requiere sumar y restar $\left(\frac{b}{2}\right)^2$
  para conservar la equivalencia cuantitativa.
- El método transforma el trinomio en una diferencia de cuadrados de la forma $(x
  + k)^2 - d^2$.
al_terminar_debes_poder: Al terminar serás capaz de factorizar trinomios cuadráticos
  mediante la técnica de completación de cuadrado.
