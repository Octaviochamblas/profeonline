procedimiento:
- 'Paso 1: Revisa el polinomio (usualmente 4 términos) buscando 3 que formen un TCP
  (dos cuadrados positivos y un doble producto).'
- 'Paso 2: Agrúpalos en paréntesis, asegurando dejar el cuarto término restando fuera.'
- 'Paso 3: Factoriza el TCP para convertirlo en un binomio al cuadrado.'
- 'Paso 4: Aplica la regla de diferencia de cuadrados al binomio al cuadrado y al
  término externo restante.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en factorización mediante completación de cuadrado.
ejemplos:
- titulo: Factoriza $m^2 - 6m + 9 - 16n^2$
  enunciado: Factoriza $m^2 - 6m + 9 - 16n^2$.
  solucion_pasos:
  - El bloque $m^2 - 6m + 9$ es un TCP.
  - 'Lo factorizamos: $(m-3)^2 - 16n^2$.'
  - 'Aplicamos diferencia de cuadrados: raíces son $(m-3)$ y $4n$.'
  - 'Final: $(m - 3 + 4n)(m - 3 - 4n)$.'
- titulo: Factoriza $25 - x^2 - 2xy - y^2$.
  solucion_pasos:
  - 'Aquí el TCP es negativo. Extraemos el menos: $25 - (x^2 + 2xy + y^2)$. Factorizamos
    a $25 - (x+y)^2$. Aplicando diferencia: $(5 + x + y)(5 - (x+y))$. Resuelto.'
- titulo: 'Respecto de «Factorización mediante completación de cuadrado»: ¿Es correcta
    esta caracteriza'
  enunciado: 'Respecto de «Factorización mediante completación de cuadrado»: ¿Es correcta
    esta caracterización? «Esta técnica avanzada requiere identificar 3 términos que
    conformen un TCP y aislarlos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Esta técnica avanzada requiere
    identificar 3 términos que conformen un TCP y aislarlos.'
- titulo: 'Respecto de «Factorización mediante completación de cuadrado»: ¿Es válida
    esta afirmación? «'
  enunciado: 'Respecto de «Factorización mediante completación de cuadrado»: ¿Es válida
    esta afirmación? «No darse cuenta de que si los signos del TCP están todos negativos
    (ej. $-x^2 - 2xy - y^2$), se debe extraer un signo ''-'' primero»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Esta técnica avanzada requiere
    identificar 3 términos que conformen un TCP y aislarlos.'
errores_frecuentes:
- No darse cuenta de que si los signos del TCP están todos negativos (ej. $-x^2 -
  2xy - y^2$), se debe extraer un signo '-' primero.
- Agrupar por pares en polinomios de 4 términos sin detenerse a ver que hay un TCP
  de 3 términos.
- Suma de cubos y factor común.
- Para «¿Qué combinación de métodos se utiliza cuando un polinomio de 4 términos no
  puede factorizarse por agrupación en pares pero tiene tres términos que son un cuadrado
  perfecto», la respuesta correcta es Solo Trinomio Cuadrado Perfecto.
- Para «¿Qué combinación de métodos se utiliza cuando un polinomio de 4 términos no
  puede factorizarse por agrupación en pares pero tiene tres términos que son un cuadrado
  perfecto», la respuesta correcta es Diferencia de Cuadrados dos veces.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_ponder: Descomponer en factores irreducibles expresiones algebraicas
  aplicando factorización mediante completación de cuadrado.
