semantic_id: MAT.ALG.FACTOR_CUADRADOS.COMPLETACION_CUADRADO
resumen_inicial: 'Factorización mediante completación de cuadrado: concepto, método
  de descomposición y reglas en Factorización asociada a cuadrados.'
explicacion_simple: Llegó el momento del jefe final en el mundo de los cuadrados.
  A veces los métodos no trabajan solos, sino en equipo. Hay ejercicios donde tendrás
  que usar tu radar para detectar un Trinomio Cuadrado Perfecto escondido, empacarlo,
  y luego darte cuenta de que se formó una épica Diferencia de Cuadrados.
explicacion_formal: "### Definición formal\n\nLos 3 términos se vuelven un cuadrado,\
  \ y con el 4to término (que es cuadrado negativo) forman la diferencia.\n\n### Desarrollo\
  \ didáctico\n\nConsidera la expresión de 4 términos: $x^2 + 2xy + y^2 - z^2$.\n\n\
  Si intentas \"factorizar por agrupación\" (pares) vas a fracasar miserablemente.\n\
  Pero mira los primeros 3 términos: $x^2 + 2xy + y^2$. Es un TCP de manual.\n\n1.\
  \ Aislamos el TCP y lo factorizamos:\n   $(x^2 + 2xy + y^2) - z^2$\n   $= (x+y)^2\
  \ - z^2$\n\n2. Sorpresa. Ahora la expresión entera tiene la forma de un gran bloque\
  \ al cuadrado menos otro bloque al cuadrado. Es una **Diferencia de Cuadrados Especial**.\n\
  \n3. La raíz del primer bloque es $(x+y)$. La raíz del segundo es $z$.\n\n4. Sumamos\
  \ y restamos esas raíces:\n   $[(x+y) + z] [(x+y) - z]$\n\nResultado final: $(x\
  \ + y + z)(x + y - z)$.\nEs una de las maniobras algebraicas más satisfactorias\
  \ que existen."
definiciones_clave: '- **Factorización mediante completación de cuadrado**: Técnica
  de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en factorización mediante completación de cuadrado.'
ejemplo_guiado:
  enunciado: Factoriza la expresión algebraica aplicando los criterios de factorización
    mediante completación de cuadrado.
  pasos:
