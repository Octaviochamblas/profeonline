semantic_id: MAT.ALG.FUNC_TRIG_MODELO.AJUSTE_MODELO
resumen_inicial: 'Evaluación de la validez de un modelo trigonométrico para predecir datos reales y análisis del margen de error o dominio de aplicabilidad.'
explicacion_simple: |
  Ningún modelo matemático es perfecto; es una herramienta simplificada para entender la realidad. Para saber si una función trigonométrica creada (como $y(t) = A\sin(Bt+C)+D$) es **válida y confiable**, probamos introduciendo valores de tiempo pasados y comparando el resultado que calcula la fórmula con lo que realmente ocurrió en la vida real. Si la diferencia es pequeña, el modelo es bueno y sirve para **predecir** lo que ocurrirá en el futuro. También debemos cuidar que el modelo no se use fuera de sus límites razonables (como predecir el clima de aquí a 100 años).
explicacion_formal: |
  ### Definición formal
  La **evaluación del ajuste y validez de un modelo trigonométrico** $y_{\text{mod}}(t) = A\sin(Bt + C) + D$ frente a un conjunto de observaciones empíricas $\{(t_i, y_i)\}_{i=1}^n$ consiste en analizar el residuo de error:
  $$e_i = y_i - y_{\text{mod}}(t_i)$$
  y verificar la validez del modelo mediante métricas de error (como la Desviación Máxima o la Suma de Cuadrados de los Residuos) y la pertinencia del dominio de validez física $t \in [t_{\text{inicio}}, t_{\text{fin}}]$.

  ### Desglose simbólico
  - $y_i$: Dato real observado empíricamente en el instante $t_i$.
  - $y_{\text{mod}}(t_i)$: Valor predicho por la función matemática ajustada.
  - Dominio de validez: Rango temporal donde las condiciones físicas de periodicidad permanecen estables.

  ### Síntesis didáctica
  Evaluar un modelo exige dos pasos: 1) numérico (calcular cuánto se aleja la fórmula de la realidad), y 2) conceptual (comprobar si las suposiciones de periodicidad se siguen manteniendo en el futuro).
definiciones_clave: |
  - **Ajuste del modelo**: Grado de concordancia entre los valores predichos por la función trigonométrica y los datos reales observados.
  - **Residuo de error ($e_i$)**: Diferencia cuantitativa $y_{\text{observado}} - y_{\text{predicho}}$.
  - **Predicción extrapolada**: Estimación de valores futuros fuera del rango de datos originales medidos.
propiedades_relaciones: |
  - **Límites de aplicabilidad**: Factores ambientales (como cambio climático, desgaste de piezas o fricción) pueden alterar los parámetros $A, B, D$ con el tiempo, haciendo perder validez al modelo.
  - **Interpolación vs Extrapolación**: El modelo suele ser más preciso para estimar datos intermedios (interpolación) que para predecir un futuro lejano (extrapolación).
ejemplo_guiado:
  enunciado: 'Un modelo predice que la marea estará a $h_{\text{mod}}(4) = 5.2$ metros a las $4$ horas. El instrumento de medición registra un nivel real de $5.0$ metros. Calcula el error absoluto y evalúa si el modelo es razonablemente preciso si se tolera un error menor a $0.5$ metros.'
  pasos:
    - 'Paso 1: Identificar el valor observado real: $h_{\text{real}} = 5.0$ metros.'
    - 'Paso 2: Identificar el valor predicho por el modelo: $h_{\text{predicho}} = 5.2$ metros.'
    - 'Paso 3: Calcular el error absoluto: $|e| = |h_{\text{real}} - h_{\text{predicho}}| = |5.0 - 5.2| = |-0.2| = 0.2$ metros.'
    - 'Paso 4: Comparar con la tolerancia establecida: como $0.2 \text{ m} < 0.5 \text{ m}$, se concluye que el modelo posee un ajuste válido y preciso.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se determina empíricamente la precisión de un modelo trigonométrico frente a datos reales?'
    choices:
      - {text: 'Evaluando la función en los instantes medidos y comparando los valores predichos contra los observados', is_correct: true}
      - {text: 'Aumentando la amplitud de la función al doble', is_correct: false}
      - {text: 'Cambiando la función seno por una función cuadrática', is_correct: false}
      - {text: 'Comprobando únicamente que la función sea continua en $\mathbb{R}$', is_correct: false}
    explanation: 'La alternativa correcta es ''Evaluando la función en los instantes medidos y comparando los valores predichos contra los observados''. La validez exige confrontación empírica.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función modelo predice una temperatura de $25^\circ\text{C}$ a mediodía, pero el termómetro real marca $24.5^\circ\text{C}$, ¿cuál es la magnitud del error de predicción?'
    choices:
      - {text: '$0.5^\circ\text{C}$', is_correct: true}
      - {text: '$1.0^\circ\text{C}$', is_correct: false}
      - {text: '$25^\circ\text{C}$', is_correct: false}
      - {text: '$49.5^\circ\text{C}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$0.5^\circ\text{C}$''. $|e| = |24.5 - 25| = |-0.5| = 0.5^\circ\text{C}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sustituir los valores conocidos de $t$ en la función trigonométrica para calcular la predicción $y_{\text{mod}}(t)$.'
  - 'Paso 2: Restar el valor predicho del valor real observado para obtener el residuo de error.'
  - 'Paso 3: Tomar el valor absoluto del error $|e|$.'
  - 'Paso 4: Validar si la magnitud del error se encuentra dentro de los márgenes de tolerancia aceptados para el estudio.'
errores_correccion: |
  - **Error 1:** Asumir que un modelo trigonométrico perfectamente ajustado a 3 datos seguirá siendo exacto de forma indefinida en el futuro. **Cómo corregirlo:** Las condiciones reales pueden cambiar; todo modelo posee un dominio de aplicabilidad y requiere re-calibración periódica.
  - **Error 2:** Descartar un modelo útil por errores mínimos de redondeo numérico. **Cómo corregirlo:** En ciencias aplicadas, un modelo es válido si el error de predicción se encuentra dentro de una tolerancia aceptable definida.
ejemplos:
  - titulo: 'Evaluación de predicción'
    enunciado: 'Un modelo predice $100$ clientes y llegan $98$. ¿El error del modelo es de 2 clientes?'
    alternativas:
      - 'Sí, el error es $|98 - 100| = 2$ personas'
      - 'No, el error es del 50%'
      - 'No, el modelo falló totalmente'
    respuesta: 'Sí, el error es $|98 - 100| = 2$ personas'
    solucion_pasos:
      - '1. $|e| = |98 - 100| = 2$.'
      - '2. La discrepancia es de 2 clientes.'
  - titulo: 'Interpolación precisa'
    enunciado: '¿Probar el modelo en un punto intermedio entre datos conocidos ayuda a validar su ajuste?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la comprobación en puntos no usados en la calibración confirma la capacidad de predicción.'
  - titulo: 'Re-calibración de parámetros'
    enunciado: '¿Si el clima sufre una alteración drástica los parámetros $A, D$ del modelo deben reajustarse?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, alteraciones del entorno exigen recalibrar la amplitud o la línea media.'
  - titulo: 'Tolerancia de error'
    enunciado: '¿Un modelo con error del 1% es considerado un modelo altamente válido?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, un error del 1% indica un nivel de ajuste superior al 99%.'
errores_frecuentes:
  - 'La afirmación de que un modelo trigonométrico ajustado a datos pasados es una verdad absoluta infalible para el futuro lejano.'
  - 'La afirmación de que si un modelo presenta una discrepancia mínima del 0.1%, debe desecharse por no ser exactamente cero.'
  - 'La afirmación de que la validez de un modelo no requiere ser contrastada contra mediciones reales empíricas.'
  - 'La afirmación de que las desviaciones de predicción se calculan multiplicando el valor real por la amplitud.'
  - 'La afirmación de que un modelo trigonométrico puede predecir comportamientos que no son periódicos.'
afirmaciones_verdaderas:
  - 'La validez y ajuste de un modelo trigonométrico se determinan comparando cuantitativamente sus predicciones algebraicas contra mediciones reales empíricas.'
  - 'Todo modelo trigonométrico contextual posee un dominio de aplicabilidad delimitado, requiriendo re-calibración de sus parámetros si las condiciones físicas del entorno cambian.'
al_terminar_debes_poder: |
  QUÉ: Evaluar la validez, ajuste y capacidad de predicción de un modelo trigonométrico frente a datos reales.
  CÓMO: Calcular el residuo de error $|y_{\text{real}} - y_{\text{predicho}}|$ y analizar los límites del dominio de aplicabilidad del fenómeno.
