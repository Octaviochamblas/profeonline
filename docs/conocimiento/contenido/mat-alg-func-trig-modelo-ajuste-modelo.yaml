semantic_id: MAT.ALG.FUNC_TRIG_MODELO.AJUSTE_MODELO
resumen_inicial: 'Evaluación de la validez de un modelo trigonométrico para predecir
  datos: círculo unitario, amplitud, período y transformaciones de Modelamiento trigonométrico
  y extensiones.'
explicacion_simple: Con la amplitud, el periodo y la línea media ya calculados por
  separado, el último paso es combinarlos con el desfase correcto para obtener el
  modelo completo.
explicacion_formal: '### Definición formal


  Dado un conjunto de datos con máximo $M$, mínimo $m$, periodo $T$ y el instante
  donde ocurre un máximo o mínimo conocido, se calcula: $a=(M-m)/2$, $d=(M+m)/2$,
  $b=2\pi/T$, y se elige seno o coseno según el comportamiento inicial, ajustando
  $c$ para que el modelo coincida con los datos.


  ### Desarrollo didáctico


  Si la temperatura máxima ($28°$C) ocurre a las $15$ horas, mínima ($12°$C) a las
  $3$ horas, y el ciclo dura $24$ horas: $a=8$, $d=20$, $b=2\pi/24=\pi/12$. Como el
  máximo ocurre en $t=15$ (no en $t=0$), se usa coseno con desfase $c=15$: $T(t)=8\cos(\pi(t-15)/12)+20$.'
definiciones_clave: '- **Evaluación de la validez de un modelo trigonométrico para
  predecir datos**: Función periódica fundamentada en las coordenadas del círculo
  unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a evaluación de la validez de un modelo trigonométrico para predecir datos.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    evaluación de la validez de un modelo trigonométrico para predecir datos.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de evaluación de la validez de un modelo trigonométrico
    para predecir datos.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
