procedimiento:
- 'Paso 1: Calcula la amplitud y la línea media a partir del máximo y el mínimo.'
- 'Paso 2: Calcula $b$ a partir del periodo observado.'
- 'Paso 3: Elige seno o coseno según el comportamiento en el instante de referencia,
  y ajusta el desfase $c$.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en evaluación de la validez
  de un modelo trigonométrico para predecir datos.
ejemplos:
- titulo: Ajuste completo con datos de marea
  enunciado: La marea alcanza su máximo de $2$ m a las $6$ horas, y su mínimo de $0$
    m a las $0$ horas, con periodo $12$ horas. Construye el modelo.
  solucion_pasos:
  - Se calcula $a=(2-0)/2=1$, $d=(2+0)/2=1$, $b=2\pi/12=\pi/6$.
  - Como el máximo ocurre en $t=6$, se usa $h(t)=\cos(\pi(t-6)/6)+1$.
- titulo: Verificación del modelo construido
  enunciado: Verifica que el modelo del ejemplo anterior da $h(0)=0$.
  solucion_pasos:
  - 'Se evalúa: $h(0)=\cos(\pi(0-6)/6)+1=\cos(-\pi)+1=-1+1=0$.'
  - Se confirma que el modelo coincide con el dato observado.
- titulo: ¿Es necesario verificar el modelo construido con los datos originales?
  enunciado: ¿Se debe verificar el modelo construido evaluándolo en los puntos de
    datos conocidos?
  respuesta: Sí
  solucion_pasos:
  - Es un paso de control necesario para confirmar que el ajuste fue correcto.
- titulo: ¿Existe una única forma correcta de escribir un modelo ajustado?
  enunciado: ¿Existe una única expresión algebraica correcta para modelar un fenómeno
    periódico dado?
  respuesta: 'No'
  solucion_pasos:
  - Pueden existir varias formas equivalentes, usando seno o coseno con distintos
    desfases, que representan el mismo fenómeno.
errores_frecuentes:
- No verificar el modelo construido evaluándolo en los datos originales.
- Elegir mal entre seno y coseno según el comportamiento inicial del fenómeno.
- Calcular incorrectamente alguno de los cuatro parámetros por separado.
- Omitir ajustar el signo de $a$ si el fenómeno comienza en su mínimo en vez de su
  máximo.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  evaluación de la validez de un modelo trigonométrico para predecir datos.
