semantic_id: MAT.ALG.DESIG_PROPIEDADES.DIVISION_NEGATIVA
resumen_inicial: 'División de una desigualdad por una cantidad negativa: relaciones
  de orden, intervalos y resolución en Propiedades de las desigualdades.'
explicacion_simple: De forma análoga a la multiplicación, cuando se requiere dividir
  una desigualdad por un número negativo para despejar una incógnita, la relación
  de orden sufre una alteración fundamental.
explicacion_formal: '### Definición formal

  Sean $a, b, c \in \mathbb{R}$, con $c < 0$. Si $a \leq b$, entonces $\frac{a}{c}
  \geq \frac{b}{c}$. Si $a \geq b$, entonces $\frac{a}{c} \leq \frac{b}{c}$.


  ### Desarrollo didáctico

  Dividir por un número negativo es lo mismo que multiplicar por una fracción negativa.
  En ambos casos se induce una reflexión en la recta numérica, provocando que los
  números mayores pasen a ser los menores y viceversa.'
definiciones_clave: '- **División de una desigualdad por una cantidad negativa**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a división de una desigualdad por una cantidad
  negativa.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de división de una
    desigualdad por una cantidad negativa.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de división de una desigualdad por una cantidad
    negativa, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
