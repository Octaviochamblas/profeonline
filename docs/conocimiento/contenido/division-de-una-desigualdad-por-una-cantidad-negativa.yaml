- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
- Dada la desigualdad $a < b$ y un escalar $c < 0$, la división por $c$ produce la relación de orden $\frac{a}{c} < \frac{b}{c}$.
- Al despejar la inecuación $-3x < 15$ dividiendo por $-3$, el resultado obtenido es la desigualdad $x < -5$.
- Dividir una desigualdad entre un divisor negativo equivale a restar una constante negativa conservando la dirección del símbolo.
- La regla de inversión del símbolo al dividir por $c < 0$ aplica únicamente cuando el dividendo es un entero positivo.
- Al despejar $-x \ge 4$, el conjunto solución se expresa como la desigualdad $x \ge -4$.
afirmaciones_verdaderas:
- Dividir ambos miembros de una desigualdad por un escalar $c < 0$ invierte la orientación del símbolo de la desigualdad.
- Si $a \ge b$ y $c < 0$, entonces la división satisface $\frac{a}{c} \le \frac{b}{c}$.
al_terminar_debes_poder: '**QUÉ:** Dividir una desigualdad entre un divisor negativo $c < 0$.


  **CÓMO:** Dividiendo ambos miembros entre $c < 0$ e invirtiendo el sentido de la desigualdad ($\frac{a}{c} > \frac{b}{c}$).


  ![Resumen División de una desigualdad por una cantidad negativa](/static/img/nodos/division-de-una-desigualdad-por-una-cantidad-negativa-resumen.svg)'
