semantic_id: MAT.ALG.DESIG_PROPIEDADES.DIVISION_NEGATIVA
resumen_inicial: Dividir ambos miembros de una desigualdad por un número negativo exige invertir el sentido de la desigualdad.
explicacion_simple: '![División de una desigualdad por una cantidad negativa](/static/img/nodos/division-de-una-desigualdad-por-una-cantidad-negativa-intro.svg)


  Al igual que ocurre con la multiplicación, si divides ambos lados de una desigualdad por un número negativo (como entre $-2$ o $-5$), **DEBES INVERTIR LA DIRECCIÓN DEL SÍMBOLO**.

  Por ejemplo, si tenemos $-4x < 12$ y dividimos entre $-4$, el símbolo $<$ cambia a $>$ para dar $x > -3$.'
explicacion_formal: 'Para todas las constantes $a, b, c \in \mathbb{R}$ con $c < 0$:


  $$a < b \iff \frac{a}{c} > \frac{b}{c} \quad (c < 0)$$

  $$a \ge b \iff \frac{a}{c} \le \frac{b}{c} \quad (c < 0)$$


  **Desglose de la fórmula:**

  - La división por $c < 0$ equivale a la multiplicación por el recíproco negativo $\frac{1}{c} < 0$, obligando a la inversión de sentido.'
definiciones_clave: '- **Divisor negativo ($c < 0$)**: Escalar divisor menor que cero que invierte el sentido de la desigualdad al ejecutarse.'
propiedades_relaciones: '- **Clave en el despeje de inecuaciones**: Al pasar un coeficiente negativo a dividir, el símbolo de la inecuación se da vuelta.'
ejemplo_guiado:
  enunciado: '![Ejemplo División de una desigualdad por una cantidad negativa](/static/img/nodos/division-de-una-desigualdad-por-una-cantidad-negativa-ejemplos.svg)


    Resuelve la inecuación $-3x < 15$ dividiendo ambos miembros entre $-3$ e invirtiendo el sentido del símbolo.'
  pasos:
  - 'Paso 1: Escribir la inecuación inicial: $-3x < 15$.Paso 2: Dividir ambos miembros entre el divisor negativo $-3$: $\frac{-3x}{-3}$ y $\frac{15}{-3}$.Paso 3: Invertir el símbolo $<$ a $>$: $x > \frac{15}{-3}$.Paso 4: Calcular la división: $x > -5$.Paso 5: Comprobar para $x = 0 > -5$: $-3(0) = 0 < 15$ (se satisface la inecuación original).'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar $x$ en la inecuación $-3x < 15$ dividiendo por $-3$, ¿cuál es el resultado correcto?
  choices:
  - text: $x > -5$
    is_correct: true
  - text: $x < -5$
    is_correct: false
  - text: $x > 5$
    is_correct: false
  - text: $x < 5$
    is_correct: false
  explanation: La alternativa correcta es '$x > -5$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al pasar a dividir un coeficiente negativo en una inecuación, ¿qué acción es obligatoria sobre el operador de orden?
  choices:
  - text: Invertir la orientación del símbolo de la desigualdad.
    is_correct: true
  - text: Mantener exactamente el mismo símbolo.
    is_correct: false
  - text: Convertir el símbolo en un igual.
    is_correct: false
  - text: Cambiar el signo de la variable $x$.
    is_correct: false
  explanation: La alternativa correcta es 'Invertir la orientación del símbolo de la desigualdad.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el coeficiente divisor que acompaña a la incógnita es negativo.'
- 'Paso 2: Dividir ambos miembros entre ese número negativo.'
- 'Paso 3: Dar vuelta al símbolo de la desigualdad ($< \implies >, > \implies <$).'
- 'Paso 4: Simplificar la fracción resultante.'
errores_correccion: '- **Error común:** Pasar a dividir el número negativo y olvidar dar vuelta al símbolo ($x < -5$ en vez de $x > -5$).

  - **Cómo corregirlo:** Cada vez que pases a dividir un número con signo menos, VOLTEA de inmediato el símbolo de la inecuación.'
ejemplos:
