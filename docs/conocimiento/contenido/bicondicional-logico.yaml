semantic_id: MAT.FUND.CONECTIVOS_LOGICOS.BICONDICIONAL
resumen_inicial: 'Definición, tabla de verdad y propiedades del bicondicional lógico ($p \leftrightarrow q$), que es verdadero cuando ambas proposiciones tienen el mismo valor de verdad.'
explicacion_simple: |
  El **bicondicional** (escrito en símbolos como **$p \leftrightarrow q$**) representa la frase "si y solo si" (o doble implicación). Funciona como un detector de coincidencia total: la proposición completa es **Verdadera** cuando **ambas partes tienen exactamente el mismo valor de verdad** (ambas verdaderas o ambas falsas). Si una parte es verdadera y la otra falsa, el bicondicional se vuelve **Falso**. Por ejemplo, "Un polígono es un triángulo si y solo si tiene exactamente tres lados".

  ![Introducción didáctica: Bicondicional lógico](/static/img/nodos/bicondicional-logico-intro.svg)
explicacion_formal: |
  ### Definición formal
  En el cálculo proposicional, el **bicondicional lógico** (o coimplicación) es un operador binario $\leftrightarrow: \mathcal{P} \times \mathcal{P} \to \mathcal{P}$ definido por la función veritativa booleana de equivalencia $f_\leftrightarrow: \{V, F\}^2 \to \{V, F\}$ tal que:
  $$v(p \leftrightarrow q) = \begin{cases} V & \text{si } v(p) = v(q) \\ F & \text{si } v(p) \neq v(q) \end{cases}$$
  Formalmente corresponde a la conjunción de dos implicaciones condicionales mutuas:
  $$p \leftrightarrow q \equiv (p \to q) \land (q \to p)$$

  ### Desglose simbólico
  - Símbolos equivalentes: $p \leftrightarrow q$, $p \Leftrightarrow q$, $p \equiv q$.
  - Tabla de verdad canónica:
    $$\begin{array}{|c|c|c|} \hline p & q & p \leftrightarrow q \\ \hline V & V & V \\ V & F & F \\ F & V & F \\ F & F & V \\ \hline \end{array}$$
  - Propiedad Conmutativa: $p \leftrightarrow q \equiv q \leftrightarrow p$.
  - Propiedad Reflexiva: $p \leftrightarrow p \equiv V$ (tautología).

  ### Síntesis didáctica
  El bicondicional expresa una condición necesaria y suficiente recíproca. Es verdadero cuando los dos miembros coinciden en valor ($V \leftrightarrow V = V$ y $F \leftrightarrow F = V$).
definiciones_clave: |
  - **Bicondicional ($p \leftrightarrow q$)**: Conectivo binario que formaliza la equivalencia lógica y la doble implicación ("si y solo si").
  - **Condición necesaria y suficiente**: Relación mutua donde la verdad de $p$ garantiza la verdad de $q$ y viceversa.
  - **Identidad veritativa**: Principio de verdad del bicondicional bajo asignaciones veritativas idénticas.
propiedades_relaciones: |
  - **Negación del bicondicional**: $\neg(p \leftrightarrow q) \equiv p \oplus q$ (es equivalente a la disyunción exclusiva).
  - **Transitividad**: Si $p \leftrightarrow q$ y $q \leftrightarrow r$ son verdaderos, entonces $p \leftrightarrow r$ es verdadero.
ejemplo_guiado:
  enunciado: |
    Sean las proposiciones $p$: "$2 + 3 = 5$" y $q$: "$4 \times 2 = 8$". Determina el valor de verdad del bicondicional $p \leftrightarrow q$.

    ![Ejemplos prácticos: Bicondicional lógico](/static/img/nodos/bicondicional-logico-ejemplos.svg)
  pasos:
    - 'Paso 1: Evaluar el valor de verdad de $p$: Como $2 + 3 = 5$, $v(p) = V$.'
    - 'Paso 2: Evaluar el valor de verdad de $q$: Como $4 \times 2 = 8$, $v(q) = V$.'
    - 'Paso 3: Aplicar la tabla de verdad del bicondicional: $v(p \leftrightarrow q) = v(V \leftrightarrow V)$.'
    - 'Paso 4: Concluir el resultado: Dado que ambos operandos coinciden en ser verdaderos ($v(p) = v(q) = V$), el bicondicional es Verdadero: $v(p \leftrightarrow q) = V$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Bajo cuáles asignaciones de verdad el bicondicional $p \leftrightarrow q$ resulta Verdadero ($V$)?'
    choices:
      - {text: 'Cuando ambas proposiciones tienen el mismo valor de verdad ($V \leftrightarrow V$ y $F \leftrightarrow F$)', is_correct: true}
      - {text: 'Únicamente cuando ambas proposiciones son verdaderas', is_correct: false}
      - {text: 'Únicamente cuando ambas proposiciones son falsas', is_correct: false}
      - {text: 'Cuando una proposición es verdadera y la otra es falsa', is_correct: false}
    explanation: 'La alternativa correcta es ''Cuando ambas proposiciones tienen el mismo valor de verdad ($V \leftrightarrow V$ y $F \leftrightarrow F$)''. El bicondicional premia la coincidencia veritativa.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $p$ es una proposición con valor $F$ y $q$ tiene valor $F$, ¿cuál es el valor de verdad de $p \leftrightarrow q$?'
    choices:
      - {text: 'Verdadero ($V$)', is_correct: true}
      - {text: 'Falso ($F$)', is_correct: false}
      - {text: 'Indeterminado', is_correct: false}
      - {text: 'Contradictorio', is_correct: false}
    explanation: 'La alternativa correcta es ''Verdadero ($V$)''. Como ambos valores son iguales ($F = F$), la equivalencia $F \leftrightarrow F$ es verdadera.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos proposiciones simples $p$ y $q$.'
  - 'Paso 2: Evaluar el valor de verdad individual de $p$ y de $q$.'
  - 'Paso 3: Si $v(p) = v(q)$ (ambas $V$ o ambas $F$), asignar $V$ al bicondicional $p \leftrightarrow q$.'
  - 'Paso 4: Si $v(p) \neq v(q)$ (una $V$ y otra $F$), asignar $F$ al bicondicional.'
errores_correccion: |
  - **Error 1:** Afirmar que $F \leftrightarrow F$ es Falso. **Cómo corregirlo:** El bicondicional evalúa equivalencia; dos proposiciones falsas tienen el mismo valor de verdad, por lo que $F \leftrightarrow F$ es formalmente Verdadero ($V$).
  - **Error 2:** Confundir el condicional simple ($p \to q$) con el bicondicional ($p \leftrightarrow q$). **Cómo corregirlo:** El condicional requiere solo implicación en un sentido; el bicondicional exige doble implicación bidireccional ($(p \to q) \land (q \to p)$).
ejemplos:
  - titulo: 'Bicondicional de dos falsedades'
    enunciado: '¿Cuál es el valor de verdad de "$3 = 7 \leftrightarrow 5 > 9$"?'
    alternativas:
      - 'Verdadero ($V$)'
      - 'Falso ($F$)'
      - 'Indeterminado'
    respuesta: 'Verdadero ($V$)'
    solucion_pasos:
      - '1. $3 = 7$ es $F$.'
      - '2. $5 > 9$ es $F$.'
      - '3. $F \leftrightarrow F = V$.'
  - titulo: 'Bicondicional con valores opuestos'
    enunciado: '¿Cuál es el valor de verdad de "$2 < 3 \leftrightarrow 10 = 20$"?'
    alternativas:
      - 'Falso ($F$)'
      - 'Verdadero ($V$)'
      - 'Nulo'
    respuesta: 'Falso ($F$)'
    solucion_pasos:
      - '1. $2 < 3$ es $V$.'
      - '2. $10 = 20$ es $F$.'
      - '3. $V \leftrightarrow F = F$.'
  - titulo: 'Conmutatividad del bicondicional'
    enunciado: '¿Es $p \leftrightarrow q$ equivalente a $q \leftrightarrow p$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Sí, el bicondicional es una operación estrictamente conmutativa.'
  - titulo: 'Tautología reflexiva'
    enunciado: '¿La proposición $p \leftrightarrow p$ es siempre verdadera?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Sí, toda proposición tiene el mismo valor que ella misma ($V \leftrightarrow V = V$ y $F \leftrightarrow F = V$).'
errores_frecuentes:
  - 'La afirmación de que el bicondicional $p \leftrightarrow q$ es falso cuando ambas proposiciones son falsas.'
  - 'La afirmación de que el bicondicional no es una operación conmutativa.'
  - 'La afirmación de que la locución "si y solo si" representa un condicional unidireccional simple.'
  - 'La afirmación de que la fórmula $p \leftrightarrow \neg p$ resulta en una tautología.'
  - 'La afirmación de que el bicondicional coincide en tabla de verdad con la disyunción exclusiva.'
afirmaciones_verdaderas:
  - 'El bicondicional lógico $p \leftrightarrow q$ es verdadero si y solo si ambas proposiciones componentes tienen exactamente el mismo valor de verdad ($v(p) = v(q)$).'
  - 'El bicondicional es lógicamente equivalente a la conjunción de dos condicionales recíprocos: $(p \to q) \land (q \to p)$.'
al_terminar_debes_poder: |
  QUÉ: Comprender, evaluar y formalizar el bicondicional lógico ($p \leftrightarrow q$).
  CÓMO: Aplicar el criterio de identidad veritativa ($V \leftrightarrow V = V, F \leftrightarrow F = V$) y descomponerlo en implicaciones mutuas.

