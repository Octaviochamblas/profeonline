semantic_id: MAT.GEO.TEOREMA_COSENOS.APLICACION
resumen_inicial: 'Aplicación del teorema del coseno para calcular el tercer lado o
  un ángulo de un triángulo cualquiera: conceptos, teoremas, propiedades geométricas
  y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: 'El teorema del coseno tiene dos usos principales: calcular un
  lado cuando se conocen los otros dos lados y el ángulo entre ellos, o calcular un
  ángulo cuando se conocen los tres lados.'
explicacion_formal: '![Aplicación del teorema del coseno](/static/img/geometria/areas-pitagoras/cosenos-aplicacion.svg)


  ### Definición formal


  Para calcular un lado: se sustituyen los dos lados conocidos y el ángulo comprendido
  directamente en $a^2=b^2+c^2-2bc\cos(A)$. Para calcular un ángulo conociendo los
  tres lados: se despeja $\cos(A)=\frac{b^2+c^2-a^2}{2bc}$ y luego se aplica el arcocoseno.


  ### Desarrollo didáctico


  Con $b=8$, $c=5$ y ángulo $A=60°$: $a^2=8^2+5^2-2(8)(5)\cos(60°)=64+25-80(0,5)=89-40=49$,
  por lo que $a=7$. Para el caso inverso, con $a=7$, $b=8$, $c=5$: $\cos(A)=\frac{64+25-49}{80}=\frac{40}{80}=0,5$,
  por lo que $A=\arccos(0,5)=60°$.'
