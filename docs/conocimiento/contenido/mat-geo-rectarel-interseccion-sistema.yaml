semantic_id: MAT.GEO.RECTA_RELACIONES.INTERSECCION_SISTEMA
resumen_inicial: 'Determinación del punto de intersección entre dos rectas mediante
  sistemas de ecuaciones: conceptos, teoremas, propiedades geométricas y cálculo en
  Geometría Analítica Ampliada.'
explicacion_simple: El punto de intersección de dos rectas es aquel que satisface
  simultáneamente ambas ecuaciones, por lo que se puede encontrar resolviendo el sistema
  formado por ellas.
explicacion_formal: '![Intersección de dos rectas](/static/img/geometria/analitica/rectarel-interseccion-sistema.svg)


  ### Definición formal


  Igualando $m_1x+b_1=m_2x+b_2$, se despeja $x=\dfrac{b_2-b_1}{m_1-m_2}$ (si $m_1\neq
  m_2$), y luego se sustituye en cualquiera de las dos ecuaciones para obtener $y$.


  ### Desarrollo didáctico


  Para $y=x$ e $y=-x+4$: igualando, $x=-x+4$, por lo que $2x=4$, $x=2$. Sustituyendo,
  $y=2$. El punto de intersección es $(2,2)$.'
