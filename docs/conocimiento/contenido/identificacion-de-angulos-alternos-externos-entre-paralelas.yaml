semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.ALTERNOS_EXTERNOS_IDENTIFICACION
resumen_inicial: Los ángulos alternos entre rectas paralelas cortadas por una transversal
  son de igual medida, permitiendo trasladar ángulos a lo largo de líneas paralelas.
explicacion_simple: Imagina las vías paralelas de un tren cruzadas por un camino.
  Los ángulos que se forman en lados opuestos del camino y por dentro de las vías
  son iguales entre sí, como la forma de una letra 'Z'.
explicacion_formal: Cuando dos rectas paralelas $L_1 \parallel L_2$ son cortadas por
  una transversal $T$, los **ángulos alternos internos** (y alternos externos) situados
  en lados opuestos de la transversal son congruentes entre sí.
definiciones_clave: '- **Identificación de ángulos alternos externos entre paralelas**:
  Elemento o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en identificación de ángulos alternos externos entre paralelas se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: En dos rieles paralelos cortados por una transversal oblicua, se ubican
    dos ángulos alternos externos fuera de la franja de los rieles y en lados opuestos.
    Si uno mide $125^\circ$, halla el otro.
  pasos:
  - 'Paso 1: Localizar los ángulos en la región exterior a lados opuestos de la transversal.'
  - 'Paso 2: Aplicar el Teorema de los Ángulos Alternos Externos (son congruentes
    entre paralelas).'
  - 'Paso 3: Concluir que el otro ángulo alterno externo mide $125^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de identificación de ángulos
    alternos externos entre paralelas?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo alterno externo mide 125°, ¿cuánto mide su alterno externo
    correspondiente entre paralelas?
  choices:
  - text: 125°
    is_correct: true
  - text: 55°
    is_correct: false
  - text: 180°
    is_correct: false
  - text: 62.5°
    is_correct: false
  explanation: La alternativa correcta es '125°', por ser alternos externos e iguales.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en identificación de ángulos alternos externos
  entre paralelas.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en identificación
  de ángulos alternos externos entre paralelas sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 107^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 73°
  - 107°
  - 90°
  respuesta: 73°
  solucion_pasos:
  - Despejando $x = 180 - 107 = 73^\circ$.
- titulo: Ejemplo 2
  enunciado: En identificación de ángulos alternos externos entre paralelas, si dos
    ángulos son suplementarios y uno mide 107°, ¿cuánto mide el otro?
  alternativas:
  - 73°
  - 63°
  - 360°
  respuesta: 73°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 107 = 73^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en identificación
    de ángulos alternos externos entre paralelas?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en identificación de ángulos alternos
    externos entre paralelas es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de identificación de ángulos alternos externos
  entre paralelas.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
