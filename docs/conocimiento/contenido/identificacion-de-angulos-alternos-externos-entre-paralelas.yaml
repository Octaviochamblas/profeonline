semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.ALTERNOS_EXTERNOS_IDENTIFICACION
resumen_inicial: Los ángulos alternos externos son aquellos situados en la región
  exterior (fuera de las dos paralelas) y en lados opuestos de la recta transversal.
explicacion_simple: '![Identificación de Alternos Externos](/static/img/nodos/identificacion-de-angulos-alternos-externos-entre-paralelas-intro.svg)


  Son los ángulos que quedan completamente "afuera" de las dos líneas paralelas y
  en lados contrarios de la recta secante: uno está arriba a la derecha y el otro
  está abajo a la izquierda.'
explicacion_formal: '### Definición formal

  Dadas dos rectas paralelas $L_1 \parallel L_2$ cortadas por una transversal $T$,
  los **ángulos alternos externos** son aquellos ubicados en la región exterior a
  las paralelas (no contenidos en la franja interna) y en semiplanos opuestos respecto
  a la transversal $T$:


  $$\operatorname{Alt\_Ext}(L_1, L_2, T) = \{(\alpha, \beta) \mid \text{exteriores
  a } L_1, L_2 \land \text{semiplanos opuestos respecto a } T\}$$


  ### Desglose simbólico y geométrico

  - Región externa: Zona del plano por encima de la recta superior y por debajo de
  la recta inferior.

  - Lados contrarios: Uno a cada lado de la secante transversal.

  - Vértices independientes en cada intersección.


  ### Síntesis didáctica

  Los ángulos alternos externos completan la simetría exterior del sistema de paralelas
  y transversal en los extremos opuestos de la figura.'
definiciones_clave: '- **Región exterior**: Zonas del plano situadas por encima de
  $L_1$ o por debajo de $L_2$.

  - **Alternancia exterior**: Distribución a lados opuestos de la secante $T$ en regiones
  externas. '
propiedades_relaciones: '- **Dos parejas exteriores**: Se forman los pares $(\angle
  1, \angle 7)$ y $(\angle 2, \angle 8)$.

  - **Relación con opuestos por el vértice**: Cada alterno externo es el opuesto por
  el vértice de un alterno interno. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Alternos Externos](/static/img/nodos/identificacion-de-angulos-alternos-externos-entre-paralelas-ejemplos.svg)


    En una configuración de $L_1 \parallel L_2$ y transversal $T$, se numeran los
    ángulos del 1 al 8. Si $\angle 1$ es el ángulo exterior superior derecho, identifica
    su alterno externo.'
  pasos:
  - 'Paso 1: Identificar la posición de $\angle 1$: región exterior superior, lado
    derecho de $T$.'
  - 'Paso 2: Buscar en la recta inferior un ángulo que esté en la región exterior
    inferior.'
  - 'Paso 3: Elegir el lado opuesto respecto a la transversal: lado izquierdo de $T$.'
  - 'Paso 4: Identificar que dicho ángulo corresponde a $\angle 7$.'
  - 'Paso 5: Concluir que $\angle 1$ y $\angle 7$ son alternos externos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubican los ángulos alternos externos?
  choices:
  - text: En la región exterior de las paralelas y en lados opuestos de la transversal
    is_correct: true
  - text: En la franja interior y al mismo lado de la transversal
    is_correct: false
  - text: En el mismo punto de corte
    is_correct: false
  - text: Uno en el interior y otro en el exterior
    is_correct: false
  explanation: Por definición se ubican en la región exterior de las paralelas y en
    lados opuestos de la transversal.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el ángulo 2 es el ángulo exterior superior izquierdo, ¿cuál es su ángulo
    alterno externo?
  choices:
  - text: El ángulo 8 (exterior inferior derecho)
    is_correct: true
  - text: El ángulo 7 (exterior inferior izquierdo)
    is_correct: false
  - text: El ángulo 6 (interior izquierdo)
    is_correct: false
  - text: El ángulo 1 (exterior superior derecho)
    is_correct: false
  explanation: El alterno externo correspondiente a 2 es el ángulo 8 (exterior inferior
    derecho).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las rectas paralelas $L_1 \parallel L_2$ y la transversal $T$.'
- 'Paso 2: Descartar los cuatro ángulos interiores.'
- 'Paso 3: Emparejar un ángulo exterior superior con el ángulo exterior inferior situado
  al lado contrario de $T$.'
errores_correccion: No confundas alternos externos (lados opuestos) con colaterales
  externos (mismo lado de la transversal).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la pareja de ángulos alternos externos correspondiente a $\angle
    2$ (superior izquierdo)?
  alternativas:
  - $\angle 8$ (inferior derecho)
  - $\angle 7$ (inferior izquierdo)
  - $\angle 6$ (interior izquierdo)
  respuesta: $\angle 8$ (inferior derecho)
  solucion_pasos:
  - Está en el exterior inferior y al lado opuesto (derecho): $\angle 8$.
- titulo: Ejemplo 2
  enunciado: ¿Cuántos pares de ángulos alternos externos se forman en total?
  alternativas:
  - 2 pares
  - 4 pares
  - 1 par
  respuesta: 2 pares
  solucion_pasos:
  - Los 4 ángulos exteriores se agrupan en exactamente 2 parejas de alternos externos.
- titulo: ¿Los ángulos alternos externos están en regiones exteriores?
  respuesta: Sí
  solucion_pasos:
  - Sí, están fuera del espacio delimitado entre las paralelas.
- titulo: ¿Un ángulo interior puede ser alterno externo?
  respuesta: 'No'
  solucion_pasos:
  - No, los alternos externos están obligatoriamente en la zona exterior.
errores_frecuentes:
- Confundir ángulos alternos externos con ángulos colaterales externos.
- Elegir ángulos que están dentro de la franja interior.
- Emparejar ángulos del mismo vértice de intersección.
- Olvidar que deben estar en semiplanos contrarios respecto a $T$.
- Asumir que son suplementarios en vez de iguales.
afirmaciones_verdaderas:
- Los ángulos alternos externos se ubican fuera de las paralelas y a lados opuestos
  de la secante.
- Hay exactamente 2 pares de ángulos alternos externos.
al_terminar_debes_poder: '**QUÉ:** Identificar y diferenciar parejas de ángulos alternos
  externos en rectas cortadas por una transversal.


  **CÓMO:** Reconociendo la región exterior y verificando la alternancia respecto
  a la recta transversal $T$.


  ![Resumen de Identificación de Alternos Externos](/static/img/nodos/identificacion-de-angulos-alternos-externos-entre-paralelas-resumen.svg)'
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
