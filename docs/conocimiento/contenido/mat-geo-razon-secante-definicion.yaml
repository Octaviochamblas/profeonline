semantic_id: MAT.GEO.TRIG_RECIPROCAS.SECANTE_DEFINICION
resumen_inicial: 'Definición de secante de un ángulo agudo como hipotenusa sobre cateto
  adyacente: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  en el Triángulo Rectángulo.'
explicacion_simple: 'La secante es el coseno ''puesto al revés'': en vez de cateto
  adyacente sobre hipotenusa, es hipotenusa sobre cateto adyacente.'
explicacion_formal: '![Definición de secante](/static/img/geometria/trigonometria/razon-secante-definicion.svg)


  ### Definición formal


  La secante de $\theta$ se define como $\sec\theta=\dfrac{\text{hipotenusa}}{\text{cateto
  adyacente}}$, es decir, el recíproco (inverso multiplicativo) del coseno: $\sec\theta=\dfrac{1}{\cos\theta}$.


  ### Desarrollo didáctico


  Si $\cos\theta=0{,}8$ (es decir, cateto adyacente=4, hipotenusa=5), entonces $\sec\theta=\dfrac{5}{4}=1{,}25$,
  el recíproco exacto de $0{,}8$.'
definiciones_clave: '- **Definición de secante de un ángulo agudo como hipotenusa
  sobre cateto adyacente**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
