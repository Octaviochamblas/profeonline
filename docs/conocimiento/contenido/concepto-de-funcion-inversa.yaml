semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_CONCEPTO
resumen_inicial: La función inversa $f^{-1}$ deshace la acción de $f$, intercambiando
  el dominio y recorrido ($f(x) = y \iff f^{-1}(y) = x$).
explicacion_simple: 'La **función inversa** (denotada $f^{-1}$) es la regla que hace
  el camino de regreso:

  - Si la función $f$ toma el número $3$ y lo convierte en $8$ ($f(3) = 8$), la función
  inversa $f^{-1}$ toma el $8$ y lo devuelve al $3$ ($f^{-1}(8) = 3$).

  - El dominio de la inversa es el recorrido de la función original, y viceversa.'
explicacion_formal: 'Dada una función biyectiva $f: A \to B$, la **función inversa**
  $f^{-1}: B \to A$ se define unívocamente por la relación de equivalencia:


  $$f^{-1}(y) = x \iff f(x) = y \quad \forall x \in A, \forall y \in B$$


  **Desglose de la fórmula:**

  - Mapeo recíproco que satisface $\operatorname{Dom}(f^{-1}) = \operatorname{Rec}(f)
  = B$ y $\operatorname{Rec}(f^{-1}) = \operatorname{Dom}(f) = A$.'
definiciones_clave: '- **Función Inversa ($f^{-1}$)**: Función que invierte las parejas
  de asignación de la función directa $f$.

  - **Intercambio de conjuntos**: El dominio de $f^{-1}$ es el recorrido de $f$, y
  el recorrido de $f^{-1}$ es el dominio de $f$.'
propiedades_relaciones: '- **Involución de la inversa**: $(f^{-1})^{-1} = f$.'
ejemplo_guiado:
  enunciado: Si la función $f(x) = 2x + 3$ asigna al elemento $x = 4$ la imagen $y
    = 11$, determina el valor de $f^{-1}(11)$.
  pasos:
  - 'Paso 1: Evaluar $f(4)$: $f(4) = 2(4) + 3 = 8 + 3 = 11$.Paso 2: Aplicar la definición
    de función inversa: $f(x) = y \iff f^{-1}(y) = x$.Paso 3: Sustituir $x = 4$ e
    $y = 11$: como $f(4) = 11 \implies f^{-1}(11) = 4$.Paso 4: Concluir que la función
    inversa devuelve la salida $11$ a su entrada original $4$.'
checkpoints:
- placement: after_explicacion_formal
  question: Sabiendo que $f(4) = 11$, ¿cuál es el valor de $f^{-1}(11)$ por definición
    de función inversa?
  choices:
  - text: $f^{-1}(11) = 4$
    is_correct: true
  - text: $f^{-1}(11) = \frac{1}{11}$
    is_correct: false
  - text: $f^{-1}(11) = -11$
    is_correct: false
  - text: $f^{-1}(11) = 25$
    is_correct: false
  explanation: La alternativa correcta es '$f^{-1}(11) = 4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la relación entre el dominio de $f^{-1}$ y la función original
    $f$?
  choices:
  - text: El dominio de $f^{-1}$ es exactamente igual al recorrido de $f$.
    is_correct: true
  - text: El dominio de $f^{-1}$ es el opuesto del dominio de $f$.
    is_correct: false
  - text: El dominio de $f^{-1}$ es el conjunto vacío.
    is_correct: false
  - text: No existe relación entre ambos.
    is_correct: false
  explanation: La alternativa correcta es 'El dominio de $f^{-1}$ es exactamente igual
    al recorrido de $f$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el par de asignación $(x, y)$ de la función directa $f(x) =
  y$.'
- 'Paso 2: Invertir las posiciones intercambiando entrada y salida $(y, x)$.'
- 'Paso 3: Escribir la evaluación inversa $f^{-1}(y) = x$.'
errores_correccion: '- **Error común:** Confundir la notación $f^{-1}(x)$ con la potencia
  exponencial o inverso multiplicativo $\frac{1}{f(x)}$.

  - **Cómo corregirlo:** La notación $f^{-1}(x)$ NO ES un exponente de potencia; representa
  la FUNCIÓN INVERSA recíproca.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de tipos de funciones y función inversa.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de tipos de funciones y función inversa.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función debe ser biyectiva para admitir función inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema fundamental de invertibilidad.
- titulo: ¿Las gráficas de f y su inversa son simétricas respecto a la recta y = x?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de reflexión especular de pares ordenados (x, y) a (y, x).
errores_frecuentes:
- Confundir el criterio de la línea horizontal (para inyectividad) con el criterio
  de la línea vertical (para ser función).
- Confundir la notación de función inversa $f^{-1}(x)$ con el recíproco o potencia
  $\frac{1}{f(x)}$.
- Intentar calcular la inversa de una función que no es biyectiva en los conjuntos
  considerados.
- Olvidar intercambiar las variables $x$ e $y$ al finalizar el algoritmo de despeje
  algebraico.
- Creer que la simetría gráfica de la función inversa es respecto al eje Y en lugar
  de la recta bisectriz $y = x$.
afirmaciones_verdaderas:
- Una función admite función inversa $f^{-1}$ si y solo si es biyectiva en sus conjuntos
  de definición.
- Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas respecto a
  la recta bisectriz del primer cuadrante $y = x$.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e identificar
  funciones inyectivas, sobreyectivas y biyectivas, calculando y verificando algebraicamente
  y gráficamente la función inversa.
