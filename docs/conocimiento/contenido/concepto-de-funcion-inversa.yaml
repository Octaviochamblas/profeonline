semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_CONCEPTO
resumen_inicial: 'Concepto de función inversa: conceptos, representación y propiedades
  en Tipos de funciones y función inversa.'
explicacion_simple: Si una función es una máquina que transforma entradas en salidas,
  su inversa es la máquina que deshace exactamente esa transformación, devolviendo
  la salida a su entrada original.
explicacion_formal: '### Definición formal


  Dada $f\colon A \to B$ biyectiva, su inversa $f^{-1}\colon B \to A$ se define por
  $f^{-1}(y) = x \iff f(x)=y$. Esta función existe y es única precisamente porque
  la biyectividad garantiza que cada $y \in B$ tiene exactamente un $x$ asociado.


  ### Desarrollo didáctico


  Intercambiar los roles de entrada y salida es la idea central: donde $f$ decía "de
  $x$ obtengo $y$", $f^{-1}$ dice "de $y$ recupero $x$".


  Si $f(x)=2x$ (duplicar), su inversa es $f^{-1}(x)=\frac{x}{2}$ (dividir por dos):
  aplicar una después de la otra deshace completamente la transformación.'
definiciones_clave: '- **Concepto de función inversa**: Elemento central en el estudio
  de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a concepto de función inversa.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a concepto de función
    inversa.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a concepto de función inversa.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
