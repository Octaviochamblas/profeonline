semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_CONCEPTO
resumen_inicial: 'La función inversa $f^{-1}$ es la función que revierte la transformación efectuada por $f$, intercambiando entradas y salidas: $f(x) = y \Longleftrightarrow f^{-1}(y) = x$.'
explicacion_simple: '![La función inversa $f^{-1}$ es la función que revierte la transformación efectuada por $f$, intercambiando entradas y salidas: $f(x) = y \Longleftrightarrow f^{-1}(y) = x$](/static/img/nodos/concepto-de-funcion-inversa-intro.svg)



  Imagina que una función $f$ es una máquina que toma un número $x$ y le aplica una regla para convertirlo en $y$:

  - La **función inversa $f^{-1}$** es la máquina que hace el camino de regreso: toma el resultado $y$ y te devuelve el número original $x$.

  - **Intercambio de roles:** Lo que era entrada ahora es salida, y lo que era salida ahora es entrada.

  - **¡Cuidado con la notación!** $f^{-1}(x)$ **NO significa $\frac{1}{f(x)}$**; el $-1$ es un símbolo que indica *operación inversa*.'
explicacion_formal: 'Dada una función biyectiva $f: A \to B$, la **función inversa** $f^{-1}: B \to A$ es la única aplicación que satisface:

  $$f(x) = y \Longleftrightarrow f^{-1}(y) = x, \quad \forall x \in A, \, \forall y \in B$$


  **Propiedades fundamentales de los conjuntos:**

  - $\text{Dom}(f^{-1}) = \text{Rec}(f) = B$.

  - $\text{Rec}(f^{-1}) = \text{Dom}(f) = A$.

  - **Involución**: $(f^{-1})^{-1} = f$.

  - **Pares ordenados invertidos**: $(a, b) \in \text{Graf}(f) \Longleftrightarrow (b, a) \in \text{Graf}(f^{-1})$.'
definiciones_clave: '- **Función inversa $f^{-1}$**: Regla funcional que deshace la asignación de $f$.

  - **Involución**: Propiedad por la cual la inversa de la inversa es la función original.'
propiedades_relaciones: '- **Composición identidad**: $(f \circ f^{-1})(y) = y$ y $(f^{-1} \circ f)(x) = x$.

  - **Inversión de pares**: Cada par $(x, y)$ se convierte en $(y, x)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La función inversa $f^{-1}$ es la función que revierte la transformación efectuada por $f$, intercambiando entradas y salidas: $f(x) = y \Longleftrightarrow f^{-1}(y) = x$](/static/img/nodos/concepto-de-funcion-inversa-ejemplos.svg)



    Sea $f = \{(1, 5), (2, 8), (3, 11), (4, 14)\}$.

    1) Escribe por extensión la función inversa $f^{-1}$.

    2) Determina $f^{-1}(11)$ y $\text{Dom}(f^{-1})$.'
  pasos:
  - 'Paso 1: Intercambiar las coordenadas $(x, y) \to (y, x)$ de cada par ordenado.'
  - 'Paso 2: Escribir $f^{-1} = \{(5, 1), (8, 2), (11, 3), (14, 4)\}$.'
  - 'Paso 3: Evaluar $f^{-1}(11)$: buscar el par cuya primera componente es $11 \to (11, 3)$, luego $f^{-1}(11) = 3$.'
  - 'Paso 4: Determinar el dominio de la inversa: $\text{Dom}(f^{-1}) = \{5, 8, 11, 14\}$, que corresponde exactamente al recorrido de $f$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $f(4) = 19$, ¿cuál es el valor de $f^{-1}(19)$?
  choices:
  - text: '4'
    is_correct: true
  - text: '19'
    is_correct: false
  - text: 1/19
    is_correct: false
  - text: '-4'
    is_correct: false
  explanation: 'La alternativa correcta es ''4''. La función inversa devuelve la preimagen original correspondiente: $f^{-1}(19) = 4$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué relación existe entre el dominio de $f^{-1}$ y los conjuntos de $f$?
  choices:
  - text: El dominio de f^(-1) es exactamente el recorrido de f.
    is_correct: true
  - text: El dominio de f^(-1) es el dominio de f.
    is_correct: false
  - text: El dominio de f^(-1) siempre son todos los reales.
    is_correct: false
  - text: No tienen ninguna relacion.
    is_correct: false
  explanation: La alternativa correcta es 'El dominio de f^(-1) es exactamente el recorrido de f.'. Se invierten dominio y recorrido.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la asignación directa $f: x \mapsto y$.'
- 'Paso 2: Invertir el sentido de la asignación $f^{-1}: y \mapsto x$.'
- 'Paso 3: Establecer que el dominio de $f^{-1}$ es el recorrido de $f$ y su recorrido es el dominio de $f$.'
- 'Paso 4: Invertir las coordenadas de cualquier punto $(a, b) \to (b, a)$.'
errores_correccion: '- **Error común:** Confundir la función inversa $f^{-1}(x)$ con el recíproco o inverso multiplicativo $\frac{1}{f(x)}$.

  - **Cómo corregirlo:** $f^{-1}$ es la **inversa funcional** (la operación que regresa al punto de partida), mientras que $\frac{1}{f(x)}$ es una **división numérica**.'
ejemplos:
- titulo: 'Ejemplo 1: Evaluación inversa'
  enunciado: Si $f(x) = 2x + 1$ y $f(3) = 7$, ¿cuánto vale $f^{-1}(7)$?
  alternativas:
  - '3'
  - '7'
  - 1/7
  - '-3'
  respuesta: '3'
  solucion_pasos:
  - 'Paso 1: Como $f(3) = 7$, por definición $f^{-1}(7) = 3$.'
- titulo: 'Ejemplo 2: Intercambio de pares'
  enunciado: Si $(5, -2)$ pertenece a la gráfica de $f$, ¿qué punto pertenece a $f^{-1}$?
  alternativas:
  - (-2, 5)
  - (5, -2)
  - (-5, 2)
  - (2, -5)
  respuesta: (-2, 5)
  solucion_pasos:
  - 'Paso 1: Se intercambian las coordenadas: $(5, -2) \to (-2, 5)$.'
- titulo: 'Ejemplo 3: Dominio de la inversa'
  enunciado: Si $\text{Rec}(f) = [2, 10]$, ¿cuál es el dominio de $f^{-1}$?
  alternativas:
  - '[2, 10]'
  - '[-10, -2]'
  - '[1/10, 1/2]'
  - Todos los reales
  respuesta: '[2, 10]'
  solucion_pasos:
  - 'Paso 1: $\text{Dom}(f^{-1}) = \text{Rec}(f) = [2, 10]$.'
- titulo: 'Ejemplo 4: Distinción notacional'
  enunciado: ¿Es $f^{-1}(x)$ equivalente a $\frac{1}{f(x)}$?
  alternativas:
  - No, f^(-1) es la inversa funcional y 1/f es el inverso multiplicativo
  - Sí, son exactamente lo mismo
  - Solo cuando f(x) = x
  - Solo para números negativos
  respuesta: No, f^(-1) es la inversa funcional y 1/f es el inverso multiplicativo
  solucion_pasos:
  - 'Paso 1: El superíndice $-1$ denota operador funcional inverso, no exponente algebraico.'
errores_frecuentes:
- Confundir f^(-1)(x) con 1/f(x).
- Olvidar intercambiar el orden de las coordenadas en los pares ordenados.
- Intentar definir inversa de una función no biyectiva.
afirmaciones_verdaderas:
- La función inversa f^(-1) asigna a cada imagen y su preimagen original x tal que f(x) = y.
- El dominio de la función inversa coincide con el recorrido de la función original.
al_terminar_debes_poder: '**QUÉ:** Comprender el concepto, notación y propiedades fundamentales de la función inversa.


  **CÓMO:** Intercambiando los roles de dominio y recorrido y asociando preimágenes e imágenes mediante f(x) = y ⟺ f^(-1)(y) = x.


