semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.INVERSA_CONCEPTO
resumen_inicial: El concepto de función inversa representa el proceso de deshacer la transformación realizada por la función original, devolviendo el valor inicial.
explicacion_simple: |
  La **función inversa** es como el botón de "Deshacer":

  - Si la función $f$ toma el número $3$ y lo convierte en $10$ ($f(3) = 10$).
  - La función inversa $f^{-1}$ toma la respuesta $10$ y te devuelve el punto de partida $3$ ($f^{-1}(10) = 3$).
  - Para que exista esta máquina de deshacer perfecta, la función debe ser **biyectiva** (cada entrada tiene una única salida y viceversa).
explicacion_formal: |
  Dada una función biyectiva $f: A \to B$, la **función inversa** $f^{-1}: B \to A$ es la relación unívoca que satisface:

  $$f^{-1}(y) = x \iff f(x) = y \quad \forall x \in A, \ \forall y \in B$$

  **Identidades fundamentales de la composición:**
  - $(f^{-1} \circ f)(x) = f^{-1}(f(x)) = x \quad \forall x \in A$
  - $(f \circ f^{-1})(y) = f(f^{-1}(y)) = y \quad \forall y \in B$
definiciones_clave: |
  - **Función inversa ($f^{-1}$)**: Regla funcional que invierte el sentido del mapeo original relacionando cada elemento del codominio con su preimagen única.
propiedades_relaciones: |
  - **Involutividad**: La inversa de la función inversa es la función original: $(f^{-1})^{-1} = f$.
ejemplo_guiado:
  enunciado: 'Si una función duplica un número y le suma 1 ($f(x) = 2x + 1$), explica intuitivamente y formalmente qué hace su función inversa.'
  pasos:
    - 'Paso 1: Intuitivamente, para deshacer "multiplicar por 2 y sumar 1", primero restas 1 y luego divides por 2.'
    - 'Paso 2: Escribir la inversa propuesta: $f^{-1}(x) = \frac{x - 1}{2}$.'
    - 'Paso 3: Probar con un ejemplo: $f(4) = 2(4) + 1 = 9$.'
    - 'Paso 4: Verificar la inversa: $f^{-1}(9) = \frac{9 - 1}{2} = \frac{8}{2} = 4$, devolviendo el valor de origen $4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si $f(3) = 10$, ¿cuál es el valor de $f^{-1}(10)$?'
    choices:
      - {text: '$f^{-1}(10) = 3$', is_correct: true}
      - {text: '$f^{-1}(10) = 10$', is_correct: false}
      - {text: '$f^{-1}(10) = 1/3$', is_correct: false}
      - {text: '$f^{-1}(10) = -3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f^{-1}(10) = 3$''. La función inversa devuelve la preimagen original $x = 3$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué resultado se obtiene al componer una función con su propia inversa $(f \circ f^{-1})(x)$?'
    choices:
      - {text: 'El mismo valor de entrada $x$ (la función identidad).', is_correct: true}
      - {text: 'El valor cero $0$.', is_correct: false}
      - {text: 'El cuadrado de la entrada $x^2$.', is_correct: false}
      - {text: 'El número 1.', is_correct: false}
    explanation: 'La alternativa correcta es ''El mismo valor de entrada $x$ (la función identidad).''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Comprender la asignación directa $f: x \mapsto y$.'
  - 'Paso 2: Formular la asignación invertida $f^{-1}: y \mapsto x$.'
  - 'Paso 3: Verificar que a cada elemento $y$ del recorrido le corresponda exactamente un elemento $x$ del dominio.'
  - 'Paso 4: Comprobar que $(f^{-1} \circ f)(x) = x$.'
errores_correccion: |
  - **Error común:** Pensar que la inversa de $f(x)$ significa elevar la función a la potencia $-1$ (es decir $\frac{1}{f(x)}$).
  - **Cómo corregirlo:** La notación $f^{-1}$ representa la **FUNCIÓN INVERSA** (intercambio de roles $x \leftrightarrow y$), no el exponente $-1$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función inversa.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función inversa.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La función inversa de $f(x)$ es el recíproco algebraico dado por $\frac{1}{f(x)}$.'
  - 'Si $f(3) = 10$, entonces el valor de la función inversa es $f^{-1}(10) = \frac{1}{10}$.'
  - 'Toda función matemática real posee siempre una función inversa sin importar sus propiedades.'
  - 'La composición de una función con su inversa $(f^{-1} \circ f)(x)$ da como resultado cero.'
  - 'La notación $f^{-1}(x)$ significa elevar el valor de $x$ a la potencia $-1$.'
afirmaciones_verdaderas:
  - 'La función inversa $f^{-1}$ deshace la transformación realizada por $f$, satisfaciendo $f^{-1}(y) = x \iff f(x) = y$.'
  - 'La composición de una función biyectiva con su inversa produce la función identidad: $(f \circ f^{-1})(x) = x$ y $(f^{-1} \circ f)(x) = x$.'
al_terminar_debes_poder: |
  QUÉ: Definir y explicar el concepto fundamental de función inversa.
  CÓMO: Interpretar $f^{-1}$ como el proceso inverso de asignación $y \mapsto x$ y verificar la condición de identidad en la composición.
fuente: 'Texto escolar MINEDUC — Álgebra / Tipos de Funciones y Función Inversa'
