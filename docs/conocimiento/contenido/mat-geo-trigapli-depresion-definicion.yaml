procedimiento:
- 'Paso 1: Ubica al observador en un punto elevado y traza la horizontal a la altura
  de sus ojos.'
- 'Paso 2: Traza la línea de mira desde el observador hasta el objeto (que está por
  debajo de la horizontal).'
- 'Paso 3: El ángulo entre la horizontal y la línea de mira, medido hacia abajo, es
  el ángulo de depresión.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con concepto de ángulo de depresión medido hacia abajo desde
  la horizontal.
