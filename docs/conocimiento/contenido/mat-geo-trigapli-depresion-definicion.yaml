semantic_id: MAT.GEO.TRIG_APLICACIONES.DEPRESION_DEFINICION
resumen_inicial: 'Concepto de ángulo de depresión medido hacia abajo desde la horizontal:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría en el Triángulo
  Rectángulo.'
explicacion_simple: 'Cuando alguien mira hacia un objeto que está más abajo que sus
  ojos (un bote desde un faro, una persona desde un edificio), se forma un ángulo
  entre la horizontal y la línea de mira: ese es el ángulo de depresión.'
explicacion_formal: '![Ángulo de depresión](/static/img/geometria/trigonometria/trigapli-depresion-definicion.svg)


  ### Definición formal


  Sea un observador situado en un punto elevado y un objeto ubicado por debajo del
  nivel de sus ojos. El ángulo de depresión $\theta$ es el ángulo agudo entre la recta
  horizontal que pasa por el observador y la línea de mira (recta que une al observador
  con el objeto).


  ### Desarrollo didáctico


  En la figura, el observador está arriba y traza una horizontal punteada hacia la
  derecha. La línea de mira baja hacia el objeto. El ángulo $\theta$ entre la horizontal
  y la línea de mira es el ángulo de depresión. Como la horizontal del observador
  y la horizontal del suelo son paralelas, el ángulo de depresión es igual al ángulo
  de elevación medido desde el objeto hacia el observador (ángulos alternos internos).'
definiciones_clave: '- **Concepto de ángulo de depresión medido hacia abajo desde
  la horizontal**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a concepto de ángulo de depresión medido hacia
  abajo desde la horizontal.'
