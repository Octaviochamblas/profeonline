semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_CENTRO_ARCO
resumen_inicial: 'La medida angular de un arco de circunferencia es por definición exactamente igual a la medida de su ángulo del centro correspondiente: med(AB) = ∠AOB = α.'
explicacion_simple: '¿Cómo se mide un arco en grados? ¡Muy sencillo! La medida angular de un arco es **exactamente idéntica** a la abertura del ángulo del centro que lo produce.


  Si las manecillas del reloj en el centro forman un ángulo de **$60^\circ$**, el arco que queda entre las puntas de las manecillas mide **$60^\circ$**. Si el ángulo central se abre a **$90^\circ$**, el arco mide **$90^\circ$**. Si las manecillas forman una línea recta ($180^\circ$), el arco es una semicircunferencia y mide **$180^\circ$**.


  Es una igualdad de uno a uno en grados sexagesimales: **$\text{med}(\overset{\frown}{AB}) = \angle AOB = \alpha$**.


  ![Igualdad entre ángulo del centro y arco](/static/img/nodos/relacion-de-igualdad-entre-la-medida-del-angulo-del-centro-y-la-medida-del-arco-correspondiente-intro.svg)

  '
explicacion_formal: '### Postulado de medida de arcos circulares

  En el sistema axiomático euclidiano, la medida angular de un arco menor $\overset{\frown}{AB}$ se define como la medida del ángulo central $\angle AOB$ que lo subtiende:

  $$\text{med}(\overset{\frown}{AB}) = \angle AOB = \alpha$$


  ### Distinción fundamental: Medida angular vs Longitud lineal

  Es indispensable no confundir la medida angular con la longitud métrica del arco:

  - **Medida angular** ($\text{med}(\overset{\frown}{AB})$): Se mide en grados sexagesimales ($^\circ$) o radianes ($\text{rad}$) y es independiente del radio $r$.

  - **Longitud lineal** ($s$): Se mide en unidades métricas ($\text{cm}$, $\text{m}$) y depende linealmente del radio: $s = \frac{\alpha}{360^\circ} \cdot 2\pi r$.

  Dos circunferencias concéntricas de radios distintos pueden tener arcos de la misma medida angular ($60^\circ$), pero longitudes lineales diferentes ($s_1 < s_2$).


  > **Complemento didáctico:** En la PAES, cuando te digan ''el arco $AB$ mide $80^\circ$'', automáticamente sabes que el ángulo del centro correspondiente mide $80^\circ$. ¡No tienes que multiplicar ni dividir por 2! La medida en grados del arco y del centro es siempre la misma.

  '
definiciones_clave: '- **Medida angular de un arco ($\text{med}(\overset{\frown}{AB})$)**: Grados sexagesimales del arco equivalentes a la rotación de su ángulo central.

  - **Arco de $360^\circ$**: Medida angular de la circunferencia completa.

  - **Postulado de igualdad**: $\text{med}(\overset{\frown}{AB}) = \angle AOB$.

  '
propiedades_relaciones: '- **Aditividad de arcos adyacentes**: Si $C$ está sobre el arco $\overset{\frown}{AB}$, $\text{med}(\overset{\frown}{AB}) = \text{med}(\overset{\frown}{AC}) + \text{med}(\overset{\frown}{CB})$.

  - **Arco de la semicircunferencia**: $\text{med}(\overset{\frown}{AB}) = 180^\circ \iff \overline{AB}$ es diámetro.

  - **Arco del cuadrante**: $\text{med}(\overset{\frown}{AB}) = 90^\circ \iff \overline{OA} \perp \overline{OB}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de igualdad centro-arco](/static/img/nodos/relacion-de-igualdad-entre-la-medida-del-angulo-del-centro-y-la-medida-del-arco-correspondiente-ejemplos.svg)


    Un ángulo del centro $\angle AOB$ mide $115^\circ$. ¿Cuánto mide el arco menor $\overset{\frown}{AB}$ y cuánto mide el arco mayor complementario?'
  pasos:
  - 'Paso 1: Aplicar la relación de igualdad para el arco menor: $\text{med}(\overset{\frown}{AB}) = \angle AOB = 115^\circ$.'
  - 'Paso 2: Reconocer la suma de la circunferencia completa: La vuelta completa mide $360^\circ$.'
  - 'Paso 3: Calcular el arco mayor complementario: $\text{Arco mayor} = 360^\circ - 115^\circ = 245^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si un ángulo del centro mide 64°, ¿cuál es la medida angular del arco que subtiende?
  choices:
  - text: 64°.
    is_correct: true
  - text: 32°.
    is_correct: false
  - text: 128°.
    is_correct: false
  - text: 116°.
    is_correct: false
  explanation: La alternativa correcta es '64°.' La medida angular del arco es idéntica a la medida del ángulo central que lo subtiende.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el arco menor AB mide 130°, ¿cuánto mide el arco mayor complementario en esa misma circunferencia?
  choices:
  - text: 230°.
    is_correct: true
  - text: 50°.
    is_correct: false
  - text: 65°.
    is_correct: false
  - text: 260°.
    is_correct: false
  explanation: 'La alternativa correcta es ''230°.'' Toda la circunferencia suma $360^\circ$: $360^\circ - 130^\circ = 230^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar si el ángulo proporcionado es un ángulo del centro.

  2. Igualar directamente la medida del arco en grados a la del ángulo del centro: $\overset{\frown}{AB} = \alpha$.

  3. Si se solicita el arco mayor opuesto, restar de $360^\circ$: $\text{Arco mayor} = 360^\circ - \alpha$.

  '
errores_correccion: '- **Error común 1:** Dividir entre dos el ángulo del centro creyendo que es un ángulo inscrito. **Corrección:** El central es IGUAL al arco; el inscrito es la MITAD del arco.

  - **Error común 2:** Confundir grados con centímetros. **Corrección:** Los grados representan apertura angular; los centímetros representan longitud métrica.

  '
ejemplos:
- tipo: A
  titulo: Arco correspondiente a ángulo central
  enunciado: En una circunferencia, el ángulo del centro $\angle AOB$ mide $48^\circ$. ¿Cuál es la medida angular del arco $\overset{\frown}{AB}$?
  alternativas:
  - text: $48^\circ$.
    is_correct: true
  - text: $24^\circ$.
    is_correct: false
  - text: $96^\circ$.
    is_correct: false
  - text: $132^\circ$.
    is_correct: false
  explicacion: 'Por la relación fundamental: $\text{med}(\overset{\frown}{AB}) = \angle AOB = 48^\circ$.'
- tipo: B
  titulo: Igualdad en grados
  enunciado: ¿Es la medida angular en grados de un arco siempre igual a la de su ángulo del centro?
  respuesta: Sí
  explicacion: Sí. Es la definición canónica de medida de arco en geometría euclidiana.
errores_frecuentes:
- '''Dividir entre dos la medida del ángulo del centro creyendo que es la mitad del arco.'''
- '''Duplicar el ángulo del centro al calcular el arco.'''
- '''Confundir la medida en grados de un arco con su longitud en centímetros.'''
afirmaciones_verdaderas:
- '''La medida angular de un arco es exactamente igual a la de su ángulo del centro correspondiente.'''
- '''La suma de las medidas angulares del arco menor y el arco mayor que comparten extremos es $360^\circ$.'''
- '''Un ángulo del centro de $180^\circ$ subtiende un arco de semicircunferencia de $180^\circ$.'''
