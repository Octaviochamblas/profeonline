semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.GRAFICA_PAR
resumen_inicial: La gráfica de una función potencia con exponente par positivo $f(x) = a \cdot x^{2k}$ ($k \in \mathbb{Z}^+, a \neq 0$) tiene forma de copa o parábola generalizada en U, con vértice en el origen $(0, 0)$, simetría axial respecto al eje $Y$ y una base que se aplana progresivamente a mayor valor del grado $2k$.
explicacion_simple: "![La gráfica de una función potencia con exponente par positivo $f(x) = a \\cdot x^{2k}$ ($k \\in \\mathbb{Z}^+, a \\neq 0$) tiene forma de copa o parábola generalizada en U, con vértice en el origen $(0, 0)$, simetría axial respecto al eje $Y$ y una base que se aplana progresivamente a mayor valor del grado $2k$](/static/img/nodos/grafica-de-una-funcion-potencia-con-exponente-par-positivo-intro.svg)\n\n\nCuando el exponente es un número **par positivo ($2, 4, 6, 8...$)**, la gráfica siempre tiene **forma de copa en U**:\n\n- **¿Cómo es su forma?**\n  - Tiene su punto más bajo (o más alto) en el **vértice $(0, 0)$**.\n  - Si $a > 0$: Los dos brazos **abren hacia arriba $\\cup$** (cuadrantes I y II).\n  - Si $a < 0$: Los dos brazos **abren hacia abajo $\\cap$** (cuadrantes III y IV).\n- **¿Qué pasa a mayor exponente?**\n  - Comparada con $x^2$, la curva $x^4$ o $x^6$ tiene el **fondo más aplanado** entre $-1$ y $1$, y luego sube de forma **mucho más vertical y empinada**\
  \ para $|x| > 1$."
explicacion_formal: "Sea $f: \\mathbb{R} \\to \\mathbb{R}$ definida por $f(x) = a \\cdot x^{2k}$ con $k \\in \\mathbb{Z}^+$ y $a \\in \\mathbb{R}^*$.\n\n**Propiedades topológicas y diferenciales**:\n1. **Puntos críticos y curvatura**:\n   $$f'(x) = 2ka \\cdot x^{2k-1} \\implies f'(0) = 0$$\n   $$f''(x) = 2k(2k-1)a \\cdot x^{2k-2} \\implies f''(x) \\text{ conserva el signo de } a \\text{ para todo } x \\neq 0$$\n   El origen $(0, 0)$ es el único extremo relativo y absoluto global (mínimo si $a > 0$, máximo si $a < 0$).\n2. **Aplanamiento subunitaro**:\n   Para todo $x \\in ]-1, 1[ \\setminus \\{0\\}$, si $k_1 < k_2 \\implies |x|^{2k_2} < |x|^{2k_1}$, demostrando el aplanamiento basal hacia el eje $X$.\n3. **Crecimiento superunitario**:\n   Para todo $|x| > 1$, si $k_1 < k_2 \\implies |x|^{2k_2} > |x|^{2k_1}$."
definiciones_clave: '- **Parábola generalizada**: Familia de curvas de grado par $x^{2k}$ caracterizadas por convexidad uniforme.

  - **Aplanamiento basal**: Fenómeno geométrico donde potencias de orden superior se aproximan asintóticamente a cero en $]-1, 1[$.'
propiedades_relaciones: '- **Puntos pivote invariantes**: Para $a = 1$, todas las curvas pasan por $(-1, 1)$, $(0, 0)$ y $(1, 1)$.

  - **Convexidad estricta**: Si $a > 0$, la función es estrictamente convexa en todo $\mathbb{R}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La gráfica de una función potencia con exponente par positivo $f(x) = a \cdot x^{2k}$ ($k \in \mathbb{Z}^+, a \neq 0$) tiene forma de copa o parábola generalizada en U, con vértice en el origen $(0, 0)$, simetría axial respecto al eje $Y$ y una base que se aplana progresivamente a mayor valor del grado $2k$](/static/img/nodos/grafica-de-una-funcion-potencia-con-exponente-par-positivo-ejemplos.svg)



    Analiza y grafica la función $f(x) = 2x^4$:

    1) Halla los puntos para $x = -2, -1, 0, 1, 2$.

    2) Describe la concavidad y orientación de sus ramas.

    3) Compara su rapidez de crecimiento con $g(x) = 2x^2$ para $x = 3$.'
  pasos:
  - 'Paso 1: Puntos evaluados:

    - $f(-2) = 2(16) = \mathbf{32} \implies (-2, 32)$.

    - $f(-1) = 2(1) = \mathbf{2} \implies (-1, 2)$.

    - $f(0) = \mathbf{0} \implies (0, 0)$ (vértice).

    - $f(1) = \mathbf{2} \implies (1, 2)$.

    - $f(2) = \mathbf{32} \implies (2, 32)$.'
  - 'Paso 2: Como $a = 2 > 0$, la gráfica es una **copa en U abierta hacia arriba**, convexa, simétrica al eje $Y$ con recorrido $[0, +\infty[$.'
  - 'Paso 3: En $x = 3$:

    - $f(3) = 2(81) = \mathbf{162}$.

    - $g(3) = 2(9) = \mathbf{18}$.

    - La potencia de grado 4 crece **9 veces más rápido** en $x = 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma general de la gráfica de cualquier función potencia con exponente par positivo?
  choices:
  - text: Curva en forma de copa en U simétrica al eje Y
    is_correct: true
  - text: Curva en forma de S simétrica al origen
    is_correct: false
  - text: Hipérbola con dos ramas separadas
    is_correct: false
  - text: Línea recta diagonal
    is_correct: false
  explanation: La alternativa correcta es 'Curva en forma de copa en U simétrica al eje Y'. Toda función $a x^{2k}$ presenta ramas simétricas respecto al eje de ordenadas con vértice en $(0, 0)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el intervalo ]-1, 1[, ¿cuál curva está más pegada al eje X: $y = x^2$ o $y = x^6$?'
  choices:
  - text: y = x⁶ (tiene mayor aplanamiento basal)
    is_correct: true
  - text: y = x²
    is_correct: false
  - text: Están a la misma altura
    is_correct: false
  - text: Depende del signo de x
    is_correct: false
  explanation: La alternativa correcta es 'y = x⁶ (tiene mayor aplanamiento basal)'. Para $|x| < 1$, elevar a un exponente par mayor reduce más la magnitud ($0{,}5^6 = 0{,}0156$ vs $0{,}5^2 = 0{,}25$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el exponente $n$ sea un entero par positivo ($2, 4, 6...$).'
- 'Paso 2: Ubicar el vértice en el origen cartesiano $(0, 0)$.'
- 'Paso 3: Determinar el sentido de apertura según el signo de $a$ ($a > 0 \implies$ arriba, $a < 0 \implies$ abajo).'
- 'Paso 4: Trazar la copa en U respetando la simetría especular respecto al eje $Y$.'
errores_correccion: '- **Error común:** Creer que $x^4$ tiene dos ''ondulaciones'' o mínimos locales como un polinomio completo.

  - **Cómo corregirlo:** La función monomio $f(x) = a x^4$ **es suave y tiene un ÚNICO mínimo global en $(0, 0)$** sin oscilaciones intermedias.'
ejemplos:
- titulo: 'Ejemplo 1: Orientación de ramas'
  enunciado: 'La gráfica de $f(x) = -3x^4$ abre hacia:'
  alternativas:
  - Abajo (cuadrantes III y IV)
  - Arriba (cuadrantes I y II)
  - Hacia la derecha
  - Hacia la izquierda
  respuesta: Abajo (cuadrantes III y IV)
  solucion_pasos:
  - 'Paso 1: Par con $a = -3 < 0 \implies$ ramas hacia abajo.'
- titulo: 'Ejemplo 2: Vértice de potencia par'
  enunciado: ¿Cuáles son las coordenadas del vértice de $g(x) = 5x^8$?
  alternativas:
  - (0, 0)
  - (0, 5)
  - (5, 0)
  - (1, 5)
  respuesta: (0, 0)
  solucion_pasos:
  - 'Paso 1: El vértice de $f(x) = ax^n$ canónica siempre está en $(0, 0)$.'
- titulo: 'Ejemplo 3: Puntos de paso unitarios'
  enunciado: 'La gráfica de $y = -2x^6$ contiene a los puntos:'
  alternativas:
  - (-1, -2) y (1, -2)
  - (-1, 2) y (1, 2)
  - (-1, -2) y (1, 2)
  - (0, -2) y (1, 0)
  respuesta: (-1, -2) y (1, -2)
  solucion_pasos:
  - 'Paso 1: $f(1) = -2(1) = -2$ y $f(-1) = -2(1) = -2$.'
- titulo: 'Ejemplo 4: Comparación gráfica'
  enunciado: ¿Qué diferencia visual clave existe entre $y = x^2$ e $y = x^4$?
  alternativas:
  - y = x⁴ es más plana cerca de x = 0 y más empinada para |x| > 1
  - y = x⁴ es más ancha en todas partes
  - y = x⁴ no pasa por (0, 0)
  - y = x⁴ tiene asíntota vertical
  respuesta: y = x⁴ es más plana cerca de x = 0 y más empinada para |x| > 1
  solucion_pasos:
  - 'Paso 1: Mayor grado par incrementa el aplanamiento en $]-1, 1[$ y la verticalidad fuera de él.'
errores_frecuentes:
- Confundir la gráfica par con una hipérbola.
- Trazar una curva no simétrica respecto al eje Y.
- Olvidar que el vértice está en el origen (0, 0).
afirmaciones_verdaderas:
- Toda función potencia con exponente par positivo genera una curva en forma de U simétrica al eje Y.
- El origen (0, 0) es el vértice y punto extremo absoluto de la función.
al_terminar_debes_poder: '**QUÉ:** Graficar y caracterizar funciones potencia con exponente par positivo.


  **CÓMO:** Identificando la forma de copa en U, el vértice (0, 0), la simetría axial en x = 0 y el aplanamiento basal.


