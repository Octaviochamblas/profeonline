semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.CAMBIO_BASE
resumen_inicial: La propiedad de cambio de base permite transformar un logaritmo $\log_b(a)$
  a una nueva base $c$ mediante el cociente $\frac{\log_c(a)}{\log_c(b)}$.
explicacion_simple: 'Si necesitas calcular un logaritmo en una base incómoda o usar
  la calculadora (que solo tiene base 10 o base $e$), puedes cambiarlo a cualquier
  nueva base dividiendo:

  $$\log_b(a) = \frac{\log(a)}{\log(b)}$$

  Ejemplo: $\log_8(32) = \frac{\log_2(32)}{\log_2(8)} = \frac{5}{3}$.'
explicacion_formal: 'Para todo $a > 0$, $b > 0, b \neq 1$ y cualquier nueva base $c
  > 0, c \neq 1$, se cumple la fórmula de cambio de base:

  $$\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$$'
definiciones_clave: '- **Fórmula de cambio de base**: Herramienta algebraica para
  reescribir logaritmos en términos de bases comunes (10 o $e$).'
propiedades_relaciones: '- **Inverso logarítmico**: $\log_b(a) = \frac{1}{\log_a(b)}$.'
ejemplo_guiado:
  enunciado: Calcula el valor exacto de $\log_9(27)$ usando cambio de base 3.
  pasos:
  - Elegir la nueva base $c = 3$ (ya que 9 y 27 son potencias de 3).
  - 'Aplicar la fórmula: $\frac{\log_3(27)}{\log_3(9)}$.'
  - 'Calcular numerador: $\log_3(27) = 3$.'
  - 'Calcular denominador: $\log_3(9) = 2$.'
  - 'Obtener el resultado final: $\frac{3}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente de $\log_4(7)$ cambiada a base 10?
  choices:
  - text: \log(7) / \log(4)
    is_correct: true
  - text: \log(4) / \log(7)
    is_correct: false
  - text: \log(7 - 4)
    is_correct: false
  - text: \log(28)
    is_correct: false
  explanation: 'La correcta es: \log(7) / \log(4). El argumento 7 va arriba y la base
    original 4 va abajo.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el valor de $\log_{16}(64)$.
  choices:
  - text: 3/2
    is_correct: true
  - text: '4'
    is_correct: false
  - text: 2/3
    is_correct: false
  - text: '12'
    is_correct: false
  explanation: 'La correcta es: 3/2. Cambiando a base 2: $\frac{\log_2(64)}{\log_2(16)}
    = \frac{6}{4} = \frac{3}{2}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar una nueva base conveniente $c$ (usualmente 10, $e$ o una base
  común a las potencias).'
- 'Paso 2: Escribir en el numerador el logaritmo del argumento original en la nueva
  base: $\log_c(a)$.'
- 'Paso 3: Escribir en el denominador el logaritmo de la base original en la nueva
  base: $\log_c(b)$.'
- 'Paso 4: Calcular la fracción obtenida.'
errores_correccion: No inviertas el orden de la división. El argumento original siempre
  va en el numerador y la base antigua en el denominador.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\log_{25}(125)$.
  alternativas:
  - 3/2
  - '5'
  - 2/3
  respuesta: 3/2
  solucion_pasos:
  - 'En base 5: $\frac{\log_5(125)}{\log_5(25)} = \frac{3}{2}$.'
errores_frecuentes:
- Poner la base antigua en el numerador y el argumento en el denominador.
afirmaciones_verdaderas:
- $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$.
al_terminar_debes_ponder: Transformar logaritmos a nuevas bases para su cálculo o
  simplificación.
fuente: Texto escolar MINEDUC.
estado: publicado
