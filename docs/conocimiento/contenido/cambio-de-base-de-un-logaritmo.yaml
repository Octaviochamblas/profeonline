resumen_inicial: 'El cambio de base permite reescribir un logaritmo $\log_b(a)$ en
  términos de una nueva base $c > 0, c \neq 1$ mediante el cociente de logaritmos:
  $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$.'
explicacion_simple: Si necesitamos calcular un logaritmo en una base incómoda, podemos
  cambiarlo a cualquier otra base (como la base 10 de las calculadoras) dividiendo
  el logaritmo del argumento entre el logaritmo de la base vieja en esa nueva base.
explicacion_formal: 'Para todo $a > 0$, base original $b > 0, b \neq 1$ y nueva base
  $c > 0, c \neq 1$, el **Cambio de Base** establece:


  $$\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$$


  **Demostración:**

  Sea $x = \log_b(a) \implies b^x = a$.

  Aplicando logaritmo en base $c$ a ambos lados: $\log_c(b^x) = \log_c(a)$.

  Por propiedad de potencia: $x \cdot \log_c(b) = \log_c(a) \implies x = \frac{\log_c(a)}{\log_c(b)}$.


  > **Complemento didáctico:** Permite evaluar cualquier logaritmo en una calculadora
  científica utilizando logaritmos decimales $\frac{\log(a)}{\log(b)}$ o naturales
  $\frac{\ln(a)}{\ln(b)}$.'
definiciones_clave: '- **Cambio de base**: Fórmula $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$
  que permite transicionar a cualquier base $c$ válida.'
propiedades_relaciones: '- **Inversión de base y argumento**: $\log_b(a) = \frac{1}{\log_a(b)}$.'
ejemplo_guiado:
  enunciado: Calcule $\log_8(32)$ aplicando cambio de base a base $2$.
  pasos:
  - 'Paso 1: Aplicar la fórmula de cambio de base a base $c=2$: $\frac{\log_2(32)}{\log_2(8)}$.'
  - 'Paso 2: Calcular los logaritmos en base $2$: $\log_2(32) = 5$ y $\log_2(8) =
    3$.'
  - 'Paso 3: Formar la fracción resultante: $\frac{5}{3}$.'
  - 'Conclusión: $\log_8(32) = \frac{5}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para cambiar un logaritmo log_b(a) a una nueva base
    c válida?
  choices:
  - text: log_b(a) = log_c(a) / log_c(b)
    is_correct: true
  - text: log_b(a) = log_c(b) / log_c(a)
    is_correct: false
  - text: log_b(a) = log_c(a) · log_c(b)
    is_correct: false
  - text: log_b(a) = log_c(a - b)
    is_correct: false
  explanation: La alternativa correcta es 'log_b(a) = log_c(a) / log_c(b)'.
  reinforcement_section: Explicación formal
