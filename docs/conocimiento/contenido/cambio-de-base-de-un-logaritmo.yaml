semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.CAMBIO_BASE
resumen_inicial: 'La propiedad de cambio de base permite calcular o transformar un logaritmo en base $b$ a una nueva base $c$ mediante la división: $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$.'
explicacion_simple: |
  Las calculadoras científicas estándar solo traen botones para logaritmo decimal $\log$ (base 10) y logaritmo natural $\ln$ (base $e$). Si necesitas calcular un logaritmo en otra base como $\log_8(32)$, puedes usar la fórmula del cambio de base. Eliges una nueva base fácil (como la base 10), colocas el logaritmo del argumento ($32$) en el numerador y el logaritmo de la base vieja ($8$) en el denominador: $\log_8(32) = \frac{\log_{10}(32)}{\log_{10}(8)} = \frac{5}{3}$.
explicacion_formal: |
  ### Definición formal
  La **fórmula de cambio de base de logaritmos** establece que para cualesquiera bases reales válidas $b, c > 0$ ($b, c \neq 1$) y todo argumento positivo $a \in \mathbb{R}^+$:
  $$\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$$

  ### Demostración analítica
  Sea $x = \log_b(a)$. Por la definición de forma exponencial:
  1. $b^x = a$.
  2. Aplicamos el logaritmo en una nueva base arbitraria $c$ a ambos lados de la igualdad:
     $$\log_c\left(b^x\right) = \log_c(a)$$
  3. Aplicamos la propiedad del logaritmo de una potencia bajando el exponente $x$:
     $$x \cdot \log_c(b) = \log_c(a)$$
  4. Despejamos la variable $x$:
     $$x = \frac{\log_c(a)}{\log_c(b)}$$
  5. Sustituyendo $x = \log_b(a)$: $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$.

  ### Corolario del producto cruzado e inversión de base
  $$\log_b(a) \cdot \log_a(b) = 1 \implies \log_b(a) = \frac{1}{\log_a(b)}$$

  ### Síntesis didáctica
  - Numerador de la nueva fracción: Logaritmo en base $c$ del **argumento original $a$**.
  - Denominador de la nueva fracción: Logaritmo en base $c$ de la **base antigua $b$**.
definiciones_clave: |
  - **Cambio de base**: Fórmula de conversión que expresa un logaritmo como el cociente de dos logaritmos en una base conveniente.
  - **Nueva base $c$**: Base seleccionada libremente (comúnmente $10$ o $e$) para efectuar el cálculo.
  - **Identidad de base invertida $\log_b(a) = \frac{1}{\log_a(b)}$**: Relación recíproca obtenida al intercambiar el argumento por la base.
propiedades_relaciones: |
  - **Uso en cálculo numérico y calculadoras**: Es la herramienta indispensable para calcular logaritmos de bases arbitrarias usando el botón `LOG` o `LN`.
  - **Regla de la cadena logarítmica**: $\log_b(a) \cdot \log_c(b) \cdot \log_d(c) = \log_d(a)$.
ejemplo_guiado:
  enunciado: 'Calcula el valor exacto del logaritmo $\log_8(32)$ aplicando un cambio de base conveniente a base 2.'
  pasos:
    - 'Paso 1: Identificamos la base antigua $b = 8$, el argumento $a = 32$ y elegimos la nueva base conveniente $c = 2$ (ya que 8 y 32 son potencias de 2).'
    - 'Paso 2: Aplicamos la fórmula del cambio de base: $\log_8(32) = \frac{\log_2(32)}{\log_2(8)}$.'
    - 'Paso 3: Calculamos el logaritmo del numerador buscando $2^c = 32 \implies \log_2(32) = 5$.'
    - 'Paso 4: Calculamos el logaritmo del denominador buscando $2^c = 8 \implies \log_2(8) = 3$. Sustituimos para obtener la fracción irreducible: $\log_8(32) = \frac{5}{3}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula correcta para cambiar la base de un logaritmo $\log_b(a)$ a una nueva base $c$?'
    choices:
      - {text: '$\frac{\log_c(a)}{\log_c(b)}$, dividiendo el logaritmo del argumento entre el logaritmo de la base antigua en la nueva base $c$', is_correct: true}
      - {text: '$\log_c(a) \cdot \log_c(b)$, multiplicando los dos logaritmos', is_correct: false}
      - {text: '$\frac{\log_c(b)}{\log_c(a)}$, invirtiendo el numerador y el denominador', is_correct: false}
      - {text: '$\log_c(a - b)$, restando la base del argumento', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{\log_c(a)}{\log_c(b)}$, dividiendo el logaritmo del argumento entre el logaritmo de la base antigua en la nueva base $c$''. El argumento $a$ va en el numerador y la base $b$ en el denominador.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la representación equivalente de $\log_4(9)$ expresado mediante logaritmos decimales (base 10)?'
    choices:
      - {text: '$\frac{\log(9)}{\log(4)}$', is_correct: true}
      - {text: '$\frac{\log(4)}{\log(9)}$', is_correct: false}
      - {text: '$\log(9) \cdot \log(4)$', is_correct: false}
      - {text: '$\log(9 - 4)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{\log(9)}{\log(4)}$''. Aplicando cambio a base 10, el argumento 9 va arriba y la base 4 va abajo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la base antigua $b$ y el argumento $a$ en la expresión $\log_b(a)$.'
  - 'Paso 2: Seleccionar una nueva base $c$ conveniente (potencia común o base decimal $10$).'
  - 'Paso 3: Formar la fracción colocando el logaritmo del argumento en el numerador $\log_c(a)$ y la base en el denominador $\log_c(b)$.'
  - 'Paso 4: Calcular de forma independiente ambos logaritmos y simplificar la fracción resultante.'
errores_correccion: |
  - **Error 1:** Invertir la posición del argumento y la base en la fracción (ej: escribir $\log_b(a) = \frac{\log_c(b)}{\log_c(a)}$). **Cómo corregirlo:** Recuerda que el **argumento $a$** (que estaba arriba en la notación) se mantiene en el **numerador**, y la **base $b$** (que estaba subíndice abajo) pasa al **denominador**.
  - **Error 2:** Restar o multiplicar los logaritmos al cambiar de base (ej: $\log_b(a) = \log_c(a) - \log_c(b)$). **Cómo corregirlo:** El cambio de base es estrictamente una **división** de logaritmos: $\frac{\log_c(a)}{\log_c(b)}$.
ejemplos:
  - titulo: 'Cálculo de logaritmo con base potencia'
    enunciado: '¿El valor de $\log_{27}(81)$ es igual a $\frac{4}{3}$ usando cambio a base 3?'
    alternativas:
      - 'Sí, pues $\frac{\log_3(81)}{\log_3(27)} = \frac{4}{3}$'
      - 'No, es igual a 3'
      - 'No, es igual a 1/3'
    respuesta: 'Sí, pues $\frac{\log_3(81)}{\log_3(27)} = \frac{4}{3}$'
    solucion_pasos:
      - '1. Cambiamos a base 3: $\frac{\log_3(81)}{\log_3(27)}$.'
      - '2. Evaluamos $\log_3(81) = 4$ y $\log_3(27) = 3 \implies \frac{4}{3}$.'
  - titulo: 'Recíproco por inversión de base'
    enunciado: '¿Es verdad que $\log_2(5) \cdot \log_5(2) = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por el corolario del producto cruzado $\log_b(a) = \frac{1}{\log_a(b)}$.'
  - titulo: 'Uso de calculadora decimal'
    enunciado: '¿Para ingresar $\log_3(7)$ en una calculadora sin base 3 se debe presionar $\frac{\log(7)}{\log(3)}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la aplicación directa para calculadoras con base 10.'
  - titulo: 'Cambio a base natural'
    enunciado: '¿La expresión $\log_b(a)$ es equivalente a $\frac{\ln(a)}{\ln(b)}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Se puede elegir la base neperiana $c = e$ como nueva base.'
errores_frecuentes:
  - 'Colocar el logaritmo de la base antigua en el numerador y el del argumento en el denominador.'
  - 'El cambio de base de un logaritmo se realiza restando los logaritmos en la nueva base.'
  - 'Multiplicar los logaritmos en la nueva base en lugar de dividirlos.'
  - 'Cambiar la base del logaritmo modificando únicamente el subíndice sin alterar el argumento.'
  - 'La fórmula del cambio de base altera el valor numérico final expresado por el logaritmo.'
afirmaciones_verdaderas:
  - 'La fórmula del cambio de base establece que $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$ para cualquier nueva base válida $c > 0, c \neq 1$.'
  - 'La relación recíproca entre logaritmos de bases cruzadas determina que $\log_b(a) = \frac{1}{\log_a(b)}$.'
al_terminar_debes_poder: 'Aplicar la fórmula de cambio de base $\frac{\log_c(a)}{\log_c(b)}$ para simplificar o evaluar logaritmos de bases arbitrarias.'
