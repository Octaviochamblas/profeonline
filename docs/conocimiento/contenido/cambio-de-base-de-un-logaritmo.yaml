semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.CAMBIO_BASE
resumen_inicial: 'El cambio de base permite calcular cualquier logaritmo dividiendo el logaritmo del argumento por el logaritmo de la base original en una nueva base $c$: $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$.'
explicacion_simple: "![Propiedad de cambio de base](/static/img/nodos/cambio-de-base-de-un-logaritmo-intro.svg)\n\nCuando necesitas calcular un logaritmo que no puedes resolver directamente (como $\\log_4(32)$) o usar una calculadora:\n- Puedes cambiarlo a cualquier base común $c$ formando una fracción vertical:\n  - El **argumento** $a$ va arriba en el numerador: $\\log_c(a)$.\n  - La **base original** $b$ va abajo en el denominador: $\\log_c(b)$.\n- En base 10: $\\log_b(a) = \frac{\\log(a)}{\\log(b)}$.\n- En base natural: $\\log_b(a) = \frac{\\ln(a)}{\\ln(b)}$."
explicacion_formal: 'Sean $a, b, c \in \mathbb{R}^+$ con $b \neq 1$ y $c \neq 1$. El **teorema del cambio de base** establece que:


  $$\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$$


  **Demostración Analítica:**

  1. Sea $x = \log_b(a) \implies b^x = a$.

  2. Aplicando el operador logaritmo en base $c$ a ambos lados: $\log_c(b^x) = \log_c(a)$.

  3. Por la propiedad de la potencia: $x \cdot \log_c(b) = \log_c(a)$.

  4. Despejando $x$: $x = \frac{\log_c(a)}{\log_c(b)}$.

  5. Sustituyendo $x$: $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$. $\blacksquare$'
definiciones_clave: '- **Cambio de base**: Identidad fraccionaria $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$.

  - **Nueva base ($c$)**: Base auxiliar seleccionada para facilitar el cálculo ($c=10$, $c=e$, o una potencia común).

  - **Regla de la cadena logarítmica**: $\log_b(a) \cdot \log_a(c) = \log_b(c)$.'
propiedades_relaciones: '- **Inversión de base**: $\log_b(a) = \frac{1}{\log_a(b)}$.

  - **Uso en calculadoras**: Permite calcular logaritmos en cualquier base usando las teclas $\log$ y $\ln$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de cambio de base](/static/img/nodos/cambio-de-base-de-un-logaritmo-ejemplos.svg)


    Calcule el valor exacto de $\log_4(32)$ y simplifique el producto $\log_2(3) \cdot \log_3(8)$.'
  pasos:
  - 'Paso 1: Para $\log_4(32)$: Cambiar a base 2 (común a 4 y 32): $\frac{\log_2(32)}{\log_2(4)}$.'
  - 'Paso 2: Calcular cada valor: $\frac{5}{2} = 2,5$.'
  - 'Paso 3: Para $\log_2(3) \cdot \log_3(8)$: Cambiar a base 10: $\frac{\log(3)}{\log(2)} \cdot \frac{\log(8)}{\log(3)}$.'
  - 'Paso 4: Cancelar $\log(3)$ y simplificar: $\frac{\log(8)}{\log(2)} = \log_2(8) = 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula correcta para cambiar $\log_b(a)$ a base 10?
  choices:
  - text: $\frac{\log(a)}{\log(b)}$ (argumento arriba, base abajo)
    is_correct: true
  - text: $\frac{\log(b)}{\log(a)}$
    is_correct: false
  - text: $\log(a) - \log(b)$
    is_correct: false
  - text: $\log(a \cdot b)$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{\log(a)}{\log(b)}$ (argumento arriba, base abajo)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\log_4(32) = 2,5$?
  choices:
  - text: Porque $\frac{\log_2(32)}{\log_2(4)} = \frac{5}{2} = 2,5$
    is_correct: true
  - text: Porque $32 / 4 = 8$
    is_correct: false
  - text: Porque $4 \times 2,5 = 10$
    is_correct: false
  - text: Porque $2^5 = 10$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $\frac{\log_2(32)}{\log_2(4)} = \frac{5}{2} = 2,5$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar una nueva base $c$ adecuada (potencia común, base 10 o base $e$).'
- 'Paso 2: Escribir la fracción vertical $\frac{\log_c(a)}{\log_c(b)}$ con el argumento $a$ en el numerador y la base $b$ en el denominador.'
- 'Paso 3: Calcular o simplificar los logaritmos superior e inferior para hallar el resultado.'
errores_correccion: "- **Error 1: Invertir la fracción ($\\log_b(a) = \frac{\\log(b)}{\\log(a)}$).** **Cómo corregirlo:** La base $b$ está abajo en el logaritmo original, por lo que **permanece abajo en el denominador**: $\frac{\\log_c(a)}{\\log_c(b)}$.\n- **Error 2: Usar bases distintas en numerador y denominador.** **Cómo corregirlo:** La nueva base $c$ debe ser idéntica arriba y abajo."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\log_8(16)$?
  alternativas:
  - $4/3$
  - $2$
  - $3/4$
  respuesta: $4/3$
  solucion_pasos:
  - 'Cambiando a base 2: $\frac{\log_2(16)}{\log_2(8)} = \frac{4}{3}$.'
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale $\log_5(7) \cdot \log_7(5)$?
  alternativas:
  - $1$
  - $35$
  - $0$
  respuesta: $1$
  solucion_pasos:
  - 'Por la propiedad del producto inverso: $\log_b(a) \cdot \log_a(b) = 1$.'
- titulo: ¿Es log_9(27) = 3/2?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, cambiando a base 3: $\frac{\log_3(27)}{\log_3(9)} = \frac{3}{2} = 1,5$.'
  alternativas:
  - texto: Sí, log₃(27)/log₃(9) = 3/2
    es_correcta: true
    retroalimentacion: ¡Correcto! Cambio a base 3 común.
  - texto: No, es 3
    es_correcta: false
    retroalimentacion: Incorrecto, $9^3 = 729$, no $27$.
  - texto: No, es 1/3
    es_correcta: false
    retroalimentacion: Incorrecto, $9^{1,5} = 27$.
- titulo: ¿Es log_b(a) = ln(a) / ln(b) una igualdad verdadera?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el cambio de base al logaritmo natural base e.
  alternativas:
  - texto: Sí, cambio exacto a base natural e
    es_correcta: true
    retroalimentacion: ¡Correcto! Fórmula universal en cálculo.
  - texto: No, solo se puede cambiar a base 10
    es_correcta: false
    retroalimentacion: Incorrecto, la base c puede ser cualquier real positivo distinto de 1.
  - texto: No, es ln(b) / ln(a)
    es_correcta: false
    retroalimentacion: Incorrecto, el argumento siempre va en el numerador.
errores_frecuentes:
- Invertir numerador y denominador al aplicar la fórmula.
- Usar bases diferentes en el numerador y en el denominador.
- Confundir el cambio de base con la resta de logaritmos.
- Olvidar que las bases deben ser estrictamente positivas y distintas de 1.
afirmaciones_verdaderas:
- El cambio de base permite calcular cualquier logaritmo mediante el cociente $\frac{\log_c(a)}{\log_c(b)}$.
- El argumento se sitúa en el numerador y la base original en el denominador.
- Es la base del cálculo computacional de logaritmos en calculadoras científicas.
al_terminar_debes_poder: '![Síntesis de cambio de base](/static/img/nodos/cambio-de-base-de-un-logaritmo-resumen.svg)


  QUÉ: Aplicar el teorema del cambio de base para resolver y simplificar logaritmos en cualquier base.


  CÓMO: Expresando $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$ eligiendo una base común $c$, o transformando a bases estándar decimal ($\\log$) y natural ($\\ln$).'
