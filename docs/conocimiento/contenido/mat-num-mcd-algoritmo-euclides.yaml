semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.ALGORITMO_EUCLIDES
resumen_inicial: 'El algoritmo de Euclides halla el M.C.D. mediante divisiones sucesivas:
  $\operatorname{MCD}(a, b) = \operatorname{MCD}(b, r)$ hasta obtener residuo 0.'
explicacion_simple: El algoritmo de Euclides es un método eficiente para encontrar
  el M.C.D. de números grandes. Dividimos el número mayor entre el menor; si el residuo
  no es cero, dividimos el divisor anterior entre este nuevo residuo, y repetimos
  el proceso hasta que el residuo sea cero. El último residuo distinto de cero es
  el M.C.D.
explicacion_formal: 'Dado el par $a, b \in \mathbb{N}$ con $a > b$, el **Algoritmo
  de Divisiones Sucesivas de Euclides** genera la secuencia de residuos $r_1, r_2,
  \dots, r_k$:


  $$a = b \cdot q_1 + r_1, \quad b = r_1 \cdot q_2 + r_2, \quad \dots, \quad r_{k-2}
  = r_{k-1} \cdot q_k + r_k$$


  $$\text{Si } r_k = 0 \implies \operatorname{MCD}(a, b) = r_{k-1}$$


  **Desglose de la fórmula:**

  - Identidad fundamental: $\operatorname{MCD}(a, b) = \operatorname{MCD}(b, r_1)
  = \operatorname{MCD}(r_1, r_2) = \dots = r_{k-1}$.

  - Condición de término: El algoritmo finaliza al obtener un residuo nulo $r_k =
  0$.


  > **Complemento didáctico:** El M.C.D. es el último resto no nulo del proceso, lo
  que permite trabajar con números gigantes sin necesidad de factorizar.'
definiciones_clave: '- **Algoritmo de Euclides**: Procedimiento de reducción por residuos
  sucesivos para obtener el M.C.D.

  - **Último resto no nulo**: El valor $r_{k-1}$ que constituye el M.C.D. final.'
ejemplo_guiado:
  enunciado: Calcule el $\operatorname{MCD}(105, 45)$ utilizando el algoritmo de división
    euclidiana.
  pasos:
  - 'Paso 1: Dividir 105 entre 45: $105 = 45 \cdot 2 + 15$ (residuo $r_1 = 15 \neq
    0$).'
  - 'Paso 2: Dividir 45 entre el residuo 15: $45 = 15 \cdot 3 + 0$ (residuo $r_2 =
    0$).'
  - 'Paso 3: Identificar el último resto distinto de cero: el residuo anterior fue
    $15$.'
  - 'Conclusión: $\operatorname{MCD}(105, 45) = 15$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor que representa el M.C.D. al finalizar el algoritmo de
    Euclides?
  choices:
  - text: El último resto distinto de cero antes de obtener el residuo nulo
    is_correct: true
  - text: El último cociente obtenido
    is_correct: false
  - text: El número cero
    is_correct: false
  - text: La suma de todos los restos
    is_correct: false
  explanation: La alternativa correcta es 'El último resto distinto de cero antes
    de obtener el residuo nulo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 105 y 45, ¿cuál fue el M.C.D. resultante?
  choices:
  - text: '15'
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '45'
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: La alternativa correcta es '15'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el número mayor entre el número menor obteniendo el resto $r_1$.'
- 'Paso 2: Si $r_1 \neq 0$, dividir el divisor anterior entre $r_1$ obteniendo $r_2$.'
- 'Paso 3: Repetir las divisiones de divisor por resto hasta obtener un resto igual
  a 0.'
- 'Paso 4: Declarar como M.C.D. el último resto no nulo obtenido.'
errores_correccion: '- **Error 1: Confundir el M.C.D. con el cociente final en lugar
  del residuo.** **Cómo corregirlo:** El M.C.D. es el ÚLTIMO RESTO no nulo, NO el
  cociente de la división.


  - **Error 2: Invertir el orden dividiendo el menor por el mayor.** **Cómo corregirlo:**
  En la primera división se divide el número mayor entre el menor.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el M.C.D.(252, 105) con el algoritmo de Euclides.
  alternativas:
  - '21'
  - '7'
  - '42'
  respuesta: '21'
  solucion_pasos:
  - '$252 = 105 \cdot 2 + 42$. $105 = 42 \cdot 2 + 21$. $42 = 21 \cdot 2 + 0$. Último
    resto no nulo: 21.'
- titulo: Ejemplo 2
  enunciado: ¿Por qué es útil el algoritmo de Euclides para números grandes?
  alternativas:
  - Porque no requiere encontrar la descomposición prima de los números
  - Porque siempre da 1
  - Porque convierte los números a negativos
  respuesta: Porque no requiere encontrar la descomposición prima de los números
  solucion_pasos:
  - Evita tener que factorizar números grandes en factores primos.
- titulo: ¿Satisface el algoritmo de Euclides la propiedad MCD(a, b) = MCD(b, r)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la propiedad que sostiene matemáticamente el algoritmo.
- titulo: ¿Es el residuo cero el M.C.D. en el algoritmo de Euclides?
  respuesta: 'No'
  solucion_pasos:
  - No, el M.C.D. es el resto ANTERIOR al resto cero.
errores_frecuentes:
- El M.C.D. en el algoritmo de Euclides es el último cociente obtenido en la división
  final.
- El algoritmo de Euclides exige que los dos números sean números primos.
- Dividir el número menor por el mayor es el primer paso del algoritmo de Euclides.
- El proceso de divisiones de Euclides continúa de forma infinita sin detenerse.
- El valor del residuo final cero es el máximo común divisor de la pareja.
afirmaciones_verdaderas:
- El algoritmo de Euclides determina el M.C.D. mediante divisiones de divisores por
  restos sucesivos.
- El M.C.D. corresponde exactamente al último resto no nulo generado antes de la división
  exacta.
al_terminar_debes_poder: Al terminar serás capaz de calcular el M.C.D. mediante el
  algoritmo de divisiones sucesivas de Euclides, reconociendo el último resto no nulo
  como el resultado.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
