semantic_id: MAT.NUM.REALES.ORDEN
resumen_inicial: 'El orden en $\mathbb{R}$ es un orden total que permite comparar
  cualesquiera dos reales $a, b$: o bien $a < b$, $a = b$ o $a > b$ (Ley de Tricotomía).'
explicacion_simple: Dados dos números reales cualesquiera, siempre es posible saber
  cuál es mayor, cuál es menor o si son totalmente iguales. En la recta numérica,
  el número que esté ubicado más hacia la derecha es siempre el número mayor.
explicacion_formal: 'El conjunto $(\mathbb{R}, \le)$ satisface las propiedades de
  un **Orden Total Estricto** mediante la **Ley de Tricotomía**:


  $$\forall a, b \in \mathbb{R}, \quad (a < b) \lor (a = b) \lor (a > b) \quad \text{de
  forma mutuamente excluyente}$$


  **Desglose de propiedades:**

  - Transitividad: $a < b \wedge b < c \implies a < c$.

  - Monotonía con la suma: $a < b \implies a + c < b + c$ para todo $c \in \mathbb{R}$.

  - Monotonía con el producto: $a < b \wedge c > 0 \implies a \cdot c < b \cdot c$,
  pero si $c < 0 \implies a \cdot c > b \cdot c$.


  > **Complemento didáctico:** Multiplicar una desigualdad real por un número negativo
  **invierte** la dirección del signo de desigualdad ($<$ pasa a $>$).'
definiciones_clave: '- **Ley de Tricotomía**: Axioma por el cual dos números reales
  siempre cumplen $a < b$, $a = b$ o $a > b$.

  - **Inversión por factor negativo**: Regla donde $a < b \wedge c < 0 \implies a
  \cdot c > b \cdot c$.'
propiedades_relaciones: '- **Leyes de desigualdad**: Inversión de signo al multiplicar
  o dividir por un factor negativo $c < 0$.'
ejemplo_guiado:
  enunciado: Compare los números reales $a = \sqrt{7}$ y $b = 2,6$ determinando cuál
    es el mayor.
  pasos:
  - 'Paso 1: Elevar al cuadrado ambas expresiones positivas para comparar: $a^2 =
    (\sqrt{7})^2 = 7$.'
  - 'Paso 2: Calcular el cuadrado de $b$: $b^2 = (2,6)^2 = 6,76$.'
  - 'Paso 3: Comparar los cuadrados obtenidos: $7 > 6,76 \implies a^2 > b^2$.'
  - 'Conclusión: Como ambos son positivos y $7 > 6,76$, se deduce que $\sqrt{7} >
    2,6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con el signo de una desigualdad entre reales si multiplicamos
    ambos lados por un número negativo c < 0?
  choices:
  - text: El sentido de la desigualdad se invierte (de < pasa a >)
    is_correct: true
  - text: El sentido de la desigualdad se mantiene igual
    is_correct: false
  - text: La desigualdad se transforma en una igualdad
    is_correct: false
  - text: El resultado da cero siempre
    is_correct: false
  explanation: La alternativa correcta es 'El sentido de la desigualdad se invierte
    (de < pasa a >)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado entre sqrt(7) y 2,6, ¿cuál fue la desigualdad final
    hallada?
  choices:
  - text: sqrt(7) > 2,6 (porque 7 > 6,76)
    is_correct: true
  - text: sqrt(7) < 2,6
    is_correct: false
  - text: Son iguales
    is_correct: false
  - text: No se pueden comparar
    is_correct: false
  explanation: La alternativa correcta es 'sqrt(7) > 2,6 (porque 7 > 6,76)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar ambos números reales en una misma representación (decimal o elevas
  al cuadrado si son radicales positivos).'
- 'Paso 2: Aplicar la Ley de Tricotomía para establecer si $a < b$, $a = b$ o $a >
  b$.'
- 'Paso 3: Recordar que en la recta numérica, el número más a la derecha es el mayor.'
errores_correccion: '- **Error 1: Olvidar invertir el signo de desigualdad al multiplicar
  por un número negativo.** **Cómo corregirlo:** Si $-x < 3$, al multiplicar por $-1$
  resulta $x > -3$.


  - **Error 2: Comparar raíces cuadradas sin elevar al cuadrado o estimar decimales.**
  **Cómo corregirlo:** Elevar al cuadrado $a^2$ y $b^2$ para $a,b > 0$ es el método
  algebraico más seguro para comparar radicales.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Compare $\pi$ y $3,14$.
  alternativas:
  - pi > 3,14 (3,14159... > 3,14000...)
  - pi < 3,14
  - pi = 3,14
  respuesta: pi > 3,14 (3,14159... > 3,14000...)
  solucion_pasos:
  - $\pi \approx 3,14159... > 3,14$.
- titulo: Ejemplo 2
  enunciado: Si $x < y$, ¿qué se afirma de $-2x$ y $-2y$?
  alternativas:
  - -2x > -2y (se invierte el sentido)
  - -2x < -2y
  - -2x = -2y
  respuesta: -2x > -2y (se invierte el sentido)
  solucion_pasos:
  - Multiplicar por $-2 < 0$ invierte la desigualdad.
- titulo: ¿Se cumple la Ley de Tricotomía para todo par de números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, dados $a, b \in \mathbb{R}$, se cumple $a<b$, $a=b$ o $a>b$.
- titulo: ¿Es sqrt(10) mayor que 3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10 > 9 \implies \sqrt{10} > 3$.
errores_frecuentes:
- Multiplicar los lados de una desigualdad por un factor negativo mantiene inalterado
  el signo de orden.
- La Ley de Tricotomía permite que dos números reales sean simultáneamente $a < b$
  y $a > b$.
- El número pi es numéricamente menor que el decimal finito 3,14.
- Comparar dos números reales negativos declara como mayor al que tiene mayor valor
  absoluto.
- Las raíces cuadradas de enteros impares no se pueden ordenar con decimales.
afirmaciones_verdaderas:
- 'La Ley de Tricotomía establece que para cualesquiera dos reales $a, b$ se cumple
  exactamente una de las relaciones: $a<b$, $a=b$ o $a>b$.'
- Multiplicar o dividir una desigualdad por un número negativo invierte la dirección
  de la desigualdad.
al_terminar_debes_poder: Al terminar serás capaz de comparar y ordenar números reales
  (racionales e irracionales), aplicando la Ley de Tricotomía y las propiedades de
  conservación e inversión de desigualdades.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
