semantic_id: MAT.NUM.REALES.ORDEN
resumen_inicial: 'El conjunto de los números reales es totalmente ordenado: dados dos reales
  $a$ y $b$, se cumple exactamente una de las tres relaciones: $a < b$, $a = b$ o $a > b$
  (Ley de Tricotomía).'
explicacion_simple: 'Para comparar dos números reales y saber cuál es mayor:

  - En la recta numérica, **el número que está más a la derecha siempre es el MAYOR**.

  - Ejemplo: $3 > -5$ porque $3$ está a la derecha de $-5$.

  - Ejemplo: $\sqrt{5} > 2$ porque $\sqrt{5} \approx 2{,}236$ está a la derecha de $2$.'
explicacion_formal: Para todo $a, b \in \mathbb{R}$, el orden $<$ satisface las propiedades
  de tricotomía ($a < b \lor a = b \lor a > b$), transitividad ($a < b \land b < c \implies
  a < c$), monotonía de la adición ($a < b \implies a+c < b+c$) y monotonía del producto por
  un positivo ($a < b \land c > 0 \implies ac < bc$).
definiciones_clave: '- **Ley de Tricotomía**: Todo par de reales cumple estrictamente una
  relación: menor, igual o mayor.'
propiedades_relaciones: '- **Inversión por negativo**: Si $a < b$ y $c < 0$, entonces $a \cdot
  c > b \cdot c$.'
ejemplo_guiado:
  enunciado: Compara los números reales $a = \sqrt{3}$ y $b = \frac{7}{4}$.
  pasos:
  - 'Obtener las aproximaciones decimales de ambos números:'
  - $a = \sqrt{3} \approx 1{,}732$.
  - $b = \frac{7}{4} = 1{,}750$.
  - 'Comparar las cifras decimales: $1{,}732 < 1{,}750$.'
  - Concluir que $\sqrt{3} < \frac{7}{4}$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la Ley de Tricotomía para dos números reales cualesquiera $a$ y
    $b$?
  choices:
  - text: 'Cumplen exactamente una relación: a < b, a = b o a > b'
    is_correct: true
  - text: a y b son siempre iguales
    is_correct: false
  - text: a es siempre mayor que b
    is_correct: false
  - text: Pueden ser menores y mayores simultáneamente
    is_correct: false
  explanation: 'La correcta es: Cumplen exactamente una relación: a < b, a = b o a > b. Es
    la ley de tricotomía.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Compara $-5$ y $-\sqrt{20}$.
  choices:
  - text: -5 < -\sqrt{20} (porque -5 está más a la izquierda que -4,47)
    is_correct: true
  - text: -5 > -\sqrt{20}
    is_correct: false
  - text: -5 = -\sqrt{20}
    is_correct: false
  - text: No se pueden comparar
    is_correct: false
  explanation: 'La correcta es: -5 < -\sqrt{20} (porque -5 está más a la izquierda que -4,47).
    Como $-5 = -\sqrt{25}$ y $-25 < -20$, tenemos $-5 < -\sqrt{20}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar ambos números en la misma representación (decimales o cuadrados).'
- 'Paso 2: Comparar sus magnitudes considerando su signo.'
- 'Paso 3: Determinar cuál se ubica más a la derecha en la recta real.'
errores_correccion: 'Recuerda que en los números negativos, el que tiene mayor valor absoluto
  es el MENOR (está más a la izquierda): $-10 < -2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Compara $\sqrt{2}$ y $1{,}5$.
  alternativas:
  - \sqrt{2} < 1,5
  - \sqrt{2} > 1,5
  - \sqrt{2} = 1,5
  respuesta: \sqrt{2} < 1,5
  solucion_pasos:
  - $\sqrt{2} \approx 1{,}414 < 1{,}500$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es mayor, -3 o -8?
  alternativas:
  - '-3'
  - '-8'
  - Son iguales
  respuesta: '-3'
  solucion_pasos:
  - -3 tiene menor valor absoluto, por lo que está más a la derecha en la recta.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el resultado de comparar √5 y 2,5?
  alternativas:
  - √5 < 2,5
  - √5 > 2,5
  - √5 = 2,5
  respuesta: √5 < 2,5
  solucion_pasos:
  - √5 ≈ 2,236, que es menor que 2,5.
- titulo: ¿Si a < b y se multiplica ambos lados por -1, se mantiene a < b?
  respuesta: 'No'
  solucion_pasos:
  - 'Al multiplicar por un número negativo, la desigualdad cambia de sentido: -a > -b.'
errores_frecuentes:
- Invertir el sentido de desigualdad en números negativos.
- Comparar solo los valores absolutos de dos números negativos sin considerar el signo.
- Creer que un número irracional no se puede comparar con uno racional.
- Pensar que multiplicar ambos lados de una desigualdad por un número negativo mantiene el
  sentido de la desigualdad.
- Olvidar aproximar decimalmente una raíz al compararla con una fracción.
afirmaciones_verdaderas:
- $\mathbb{R}$ es un conjunto totalmente ordenado.
- Entre dos números reales negativos, es mayor el que tiene menor valor absoluto.
al_terminar_debes_poder: Ordenar y comparar números reales utilizando diversas estrategias
  algebraicas.
fuente: Texto escolar MINEDUC.
estado: publicado
