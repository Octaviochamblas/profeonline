semantic_id: MAT.GEO.CIRCULO_TEOREMAS.SECANTES_PRODUCTO
resumen_inicial: 'Teorema de las secantes como igualdad de productos entre segmento
  exterior y segmento total: conceptos, teoremas, propiedades geométricas y cálculo
  en Circunferencia y Círculo.'
explicacion_simple: Al igual que ocurre con las cuerdas dentro del círculo, dos secantes
  trazadas desde un punto exterior cumplen una relación de productos entre sus segmentos.
explicacion_formal: '![Teorema de las secantes: PA×PB = PC×PD](/static/img/geometria/circunferencia-circulo/circulo-teorema-secantes-producto.svg)


  ### Definición formal


  Si desde un punto exterior $P$ se trazan dos secantes que cortan la circunferencia
  en $A,B$ y $C,D$ respectivamente (siendo $A$ y $C$ los puntos cercanos), se cumple
  $PA\times PB=PC\times PD$. Se demuestra mediante semejanza de los triángulos $PAD$
  y $PCB$ (ángulo en $P$ compartido y ángulos inscritos iguales).


  ### Desarrollo didáctico


  Si $PA=3$ cm, $PB=8$ cm y $PC=4$ cm, entonces $3\times8=4\times PD$, de donde $PD=\frac{24}{4}=6$
  cm. Este teorema es análogo al de las cuerdas, pero con el punto de referencia fuera
  de la circunferencia.'
definiciones_clave: '- **Teorema de las secantes como igualdad de productos entre
