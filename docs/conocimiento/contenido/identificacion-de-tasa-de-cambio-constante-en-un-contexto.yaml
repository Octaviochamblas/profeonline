semantic_id: MAT.ALG.MODELAMIENTO_AFIN.IDENTIFICACION_TASA_CONSTANTE
resumen_inicial: Una tasa de cambio constante indica que la variable dependiente incrementa
  o disminuye en una cantidad fija por cada unidad de cambio en la variable independiente.
explicacion_simple: 'Para saber si un problema contextual se puede modelar con una
  función afín o lineal, debemos buscar una **tasa de cambio constante**.

  Por ejemplo, si un servicio de taxi cobra $\$500$ fijos más $\$300$ por cada kilómetro
  recorrido:

  - Cada kilómetro extra agrega SIEMPRE los mismos $\$300$.

  - Esos $\$300/\text{km}$ son la **tasa constante (la pendiente $m$)**, y la tarifa
  base de $\$500$ es el **valor inicial (el intercepto $n$)**.'
explicacion_formal: 'Un proceso de variación entre $x$ e $y$ responde a una **tasa
  de cambio constante $m$** si y solo si el cociente de diferencias incrementales
  es invariante:


  $$m = \frac{\Delta y}{\Delta x} = \text{constante} \implies y(x) = m x + n$$


  **Desglose de la fórmula:**

  - $m$: Tasa de cambio unitaria constante (variación del sistema por unidad de $x$).

  - $n$: Condición inicial o valor de partida del sistema en $x = 0$.'
definiciones_clave: '- **Tasa de cambio constante ($m$)**: Magnitud fija de incremento
  o decrecimiento por unidad de la variable independiente.

  - **Modelabilidad lineal/afín**: Condición de un problema que permite representarlo
  mediante $f(x) = m x + n$.'
propiedades_relaciones: '- **Diferencias finitas constantes**: En una tabla de datos
  con pasos uniformes en $x$, las diferencias entre salidas consecutivas son constantes.'
ejemplo_guiado:
  enunciado: Un estanque se vacía a una tasa constante de $15\text{ litros}$ por minuto.
    Si inicialmente contenía $300\text{ litros}$, identifica la tasa de cambio y escribe
    la función del volumen $V(t)$.
  pasos:
  - 'Paso 1: Identificar el cambio por unidad de tiempo: pierde $15\text{ L/min} \implies$
    tasa de cambio $m = -15$.Paso 2: Identificar el estado inicial en $t = 0$: $n
    = 300\text{ L}$.Paso 3: Construir la función en el tiempo $t$: $V(t) = -15t +
    300$.Paso 4: Concluir que la tasa constante de $-15\text{ L/min}$ modela el vaciado
    afín del estanque.'
checkpoints:
- placement: after_explicacion_formal
  question: En el contexto de un estanque que se vacía a $15\text{ L/min}$ partiendo
    de $300\text{ L}$, ¿cuál es la función $V(t)$ del volumen restante?
  choices:
  - text: $V(t) = -15t + 300$
    is_correct: true
  - text: $V(t) = 15t + 300$
    is_correct: false
  - text: $V(t) = 300t - 15$
    is_correct: false
  - text: $V(t) = -300t + 15$
    is_correct: false
  explanation: La alternativa correcta es '$V(t) = -15t + 300$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa el signo negativo en la tasa de cambio $m = -15\text{
    L/min}$?
  choices:
  - text: Que el volumen disminuye (se vacía) a medida que transcurre el tiempo.
    is_correct: true
  - text: Que el tiempo retrocede.
    is_correct: false
  - text: Que el estanque está roto.
    is_correct: false
  - text: Que la capacidad total es negativa.
    is_correct: false
  explanation: La alternativa correcta es 'Que el volumen disminuye (se vacía) a medida
    que transcurre el tiempo.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos variables del problema (ejemplo: tiempo $t$ y volumen
  $V$).'
- 'Paso 2: Detectar la cantidad fija que varía por cada unidad de la variable independiente.'
- 'Paso 3: Asignar signo positivo si aumenta o negativo si disminuye para establecer
  la pendiente $m$.'
- 'Paso 4: Formular la función $f(x) = m x + n$ incorporando el valor inicial $n$.'
errores_correccion: '- **Error común:** Confundir la tasa de cambio $m$ con el valor
  acumulado inicial $n$.

  - **Cómo corregirlo:** La tasa de cambio $m$ lleva siempre las unidades compuestas
  (ejemplo: $\text{litros/minuto}$ o $\text{pesos/km}$), mientras que $n$ lleva unidades
  simples (ejemplo: $\text{litros}$ o $\text{pesos}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una tasa de cambio constante m indica que el proceso se puede modelar con
    una función afín?
  respuesta: Sí
  solucion_pasos:
  - Sí, la razón incremental constante caracteriza a los modelos afines y lineales.
- titulo: ¿El cargo fijo n representa la salida en el momento inicial x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, f(0) = n es el intercepto o condición de partida.
errores_frecuentes:
- Confundir la tasa de cambio $m$ (unidades compuestas) con el valor acumulado inicial
  $n$ (unidades simples).
- Agregar un cargo fijo $n$ en situaciones de proporcionalidad directa donde no existe
  valor inicial.
- Multiplicar la variable $x$ por el cargo fijo $n$ en lugar de multiplicarla por
  la tarifa unitaria $m$.
- Confundir el crecimiento lineal (suma constante por año) con el crecimiento exponencial
  (porcentaje constante por año).
- Sustituir el valor de la salida $y$ en el lugar de la entrada $x$ al realizar una
  predicción en el modelo.
afirmaciones_verdaderas:
- La pendiente $m$ en un modelo afín contextual representa la tasa de cambio unitaria
  constante $\frac{\Delta y}{\Delta x}$.
- El intercepto $n$ representa la condición inicial, costo base o valor de partida
  del sistema cuando la variable de entrada vale cero ($x = 0$).
al_terminar_debes_poder: Al finalizar este recurso podrás identificar tasas de cambio
  constantes, construir modelos lineales y afines contextuales e interpretar pendiente
  e intercepto para realizar predicciones.
