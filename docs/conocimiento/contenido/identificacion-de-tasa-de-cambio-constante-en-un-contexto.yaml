procedimiento:
- 'Paso 1: Lee el enunciado buscando frases que indiquen una razón fija ("por cada",
  "a razón de").'
- 'Paso 2: Verifica que esa razón no cambie a lo largo del contexto descrito.'
- 'Paso 3: Si la tasa es constante, el fenómeno puede modelarse con una función afín.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar identificación de tasa de cambio constante en un contexto.
ejemplos:
- titulo: Identificación de tasa constante en un texto
  enunciado: 'Un texto dice: "El taxímetro sube \$400 por cada kilómetro recorrido".
    Identifica la tasa constante.'
  solucion_pasos:
  - La frase "por cada kilómetro" señala una tasa fija.
  - La tasa constante es \$400 por kilómetro.
- titulo: Detección de ausencia de tasa constante
  enunciado: 'Un texto dice: "La velocidad del auto aumenta cada vez más rápido a
    medida que pasa el tiempo". ¿Hay tasa de cambio constante?'
  solucion_pasos:
  - La frase indica que el cambio se acelera, no que sea constante.
  - No hay tasa constante; no corresponde un modelo afín simple.
- titulo: ¿Toda relación entre dos magnitudes tiene una tasa de cambio constante?
  enunciado: ¿Toda relación entre dos magnitudes tiene una tasa de cambio constante?
  respuesta: 'No'
  solucion_pasos:
  - Muchas relaciones (como el crecimiento acelerado) no cumplen esta condición y
    requieren otros modelos.
- titulo: ¿La frase "aumenta siempre en la misma cantidad" indica tasa constante?
  enunciado: ¿La frase "aumenta siempre en la misma cantidad" indica tasa constante?
  respuesta: Sí
  solucion_pasos:
  - Esa expresión describe exactamente la condición de tasa de cambio constante necesaria
    para un modelo afín.
errores_frecuentes:
- Confundir "aumenta rápido" con "aumenta a tasa constante", sin verificar si la razón
  realmente no cambia.
- Modelar con función afín situaciones donde la tasa de cambio varía con el tiempo.
- No distinguir entre un valor fijo inicial y una tasa de cambio en el enunciado.
- Ignorar unidades al identificar la tasa (confundir \$/km con \$ totales).
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando identificación
  de tasa de cambio constante en un contexto.
