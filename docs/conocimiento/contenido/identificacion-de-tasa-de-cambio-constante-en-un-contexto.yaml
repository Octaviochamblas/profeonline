semantic_id: MAT.ALG.MODELAMIENTO_AFIN.IDENTIFICACION_TASA_CONSTANTE
resumen_inicial: Identificar una tasa de cambio constante en un contexto consiste en reconocer que la magnitud dependiente varía en una cantidad fija por cada unidad de la variable independiente.
explicacion_simple: '![Identificar una tasa de cambio constante en un contexto consiste en reconocer que la magnitud dependiente varía en una cantidad fija por cada unidad de la variable independiente](/static/img/nodos/identificacion-de-tasa-de-cambio-constante-en-un-contexto-intro.svg)



  Para saber si una situación de la vida cotidiana se puede modelar con una línea recta (función lineal o afín), debes buscar si hay un **ritmo de cambio constante**:

  - Si un auto consume siempre $0,08\text{ litros por cada kilómetro}$, el cambio es constante.

  - Si un trabajador gana $\$15.000$ fijos por cada hora trabajada, el cambio es constante.


  Cada vez que a intervalos iguales les corresponde la misma variación de cantidad, **el modelo es lineal o afín**.'
explicacion_formal: 'Sea $y = f(t)$ una magnitud dependiente del tiempo o de otra variable $t$. La relación presenta **tasa de cambio constante** si y solo si la razón de incrementos es invariante:

  $$\frac{\Delta y}{\Delta t} = \frac{y(t_2) - y(t_1)}{t_2 - t_1} = k = \text{constante}, \quad \forall t_1 \neq t_2$$


  **Distinción con otros modelos:**

  - **Modelo lineal/afín**: La variación absoluta es fija ($\Delta y = k \cdot \Delta t$, suma una cantidad fija).

  - **Modelo exponencial**: La variación relativa o porcentual es fija (se multiplica por un factor fijo).

  - **Modelo cuadrático**: La tasa de cambio no es constante, sino que crece linealmente (aceleración constante).'
definiciones_clave: '- **Tasa de cambio constante**: Cociente invariante entre las variaciones de dos magnitudes vinculadas.

  - **Comportamiento lineal**: Dinámica donde la variable de salida varía en progresión aritmética regular.'
propiedades_relaciones: '- **Pendiente como tasa**: En la ecuación $y = mt + n$, la tasa constante es exactamente la pendiente $m = k$.

  - **Homogeneidad de incrementos**: Intervalos iguales $\Delta t$ producen siempre variaciones $\Delta y = m \Delta t$ iguales.'
ejemplo_guiado:
  enunciado: '![Ejemplo Identificar una tasa de cambio constante en un contexto consiste en reconocer que la magnitud dependiente varía en una cantidad fija por cada unidad de la variable independiente](/static/img/nodos/identificacion-de-tasa-de-cambio-constante-en-un-contexto-ejemplos.svg)



    Un estanque tiene inicialmente $200\text{ litros}$ de agua. Si una manguera vierte agua a razón constante de $25\text{ litros por minuto}$, verifica que la tasa es constante y escribe la función que modela el volumen $V(t)$ tras $t$ minutos.'
  pasos:
  - 'Paso 1: Identificar la variación fija por minuto: $\frac{\Delta V}{\Delta t} = 25\text{ L/min}$ (constante).'
  - 'Paso 2: Identificar el volumen inicial: $V(0) = 200\text{ L}$.'
  - 'Paso 3: Establecer la pendiente $m = 25$ y el coeficiente de posición $n = 200$.'
  - 'Paso 4: Escribir la función afín: $V(t) = 25t + 200$.'
  - 'Paso 5: Comprobar: en $t = 4\text{ min}$, $V(4) = 25(4) + 200 = 300\text{ L}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes situaciones describe una tasa de cambio constante apta para modelarse con una función lineal o afín?
  choices:
  - text: Un estanque que se llena a razon fija de 10 litros por minuto.
    is_correct: true
  - text: Una poblacion de bacterias que se duplica cada 3 horas.
    is_correct: false
  - text: El dinero en una cuenta bancaria que rinde un 5% de interes compuesto anual.
    is_correct: false
  - text: Un vehiculo que frena aumentando su deceleracion a cada segundo.
    is_correct: false
  explanation: La alternativa correcta es 'Un estanque que se llena a razon fija de 10 litros por minuto.'. Presenta una variación aditiva constante de 10 L/min.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una vela de $30\text{ cm}$ se consume a razón de $2.5\text{ cm por hora}$, ¿cuál es la tasa de cambio de su altura?
  choices:
  - text: -2.5 cm/h
    is_correct: true
  - text: 2.5 cm/h
    is_correct: false
  - text: 30 cm/h
    is_correct: false
  - text: -30 cm/h
    is_correct: false
  explanation: La alternativa correcta es '-2.5 cm/h'. Al consumirse o disminuir la longitud, la tasa de cambio es negativa.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos variables involucradas en el problema con sus respectivas unidades de medida.'
- 'Paso 2: Comprobar que la variación de la variable dependiente sea una cantidad fija por unidad de cambio de la variable independiente.'
- 'Paso 3: Determinar el signo de la tasa (positivo si aumenta, negativo si disminuye o se consume).'
- 'Paso 4: Asignar este valor como la pendiente $m$ del modelo funcional.'
errores_correccion: '- **Error común:** Modelar situaciones de crecimiento porcentual (ej: aumenta un $10\%$ anual) con una función afín.

  - **Cómo corregirlo:** Si la tasa es un **porcentaje sobre el valor acumulado**, el modelo es **exponencial**. Solo es afín/lineal si la cantidad que se suma o resta es un número **fijo y constante**.'
ejemplos:
- titulo: 'Ejemplo 1: Tasa de llenado'
  enunciado: Un camión aljibe descarga $50\text{ litros cada 2 minutos}$. ¿Cuál es la tasa de cambio unitaria?
  alternativas:
  - 25 litros por minuto
  - 50 litros por minuto
  - 100 litros por minuto
  - 0.04 litros por minuto
  respuesta: 25 litros por minuto
  solucion_pasos:
  - 'Paso 1: $\frac{\Delta V}{\Delta t} = \frac{50}{2} = 25\text{ L/min}$.'
- titulo: 'Ejemplo 2: Descenso de temperatura'
  enunciado: La temperatura en una montaña baja $0.6^\circ\text{C}$ por cada $100\text{ m}$ de altitud. ¿Cuál es la tasa por metro?
  alternativas:
  - -0.006 °C por metro
  - -0.6 °C por metro
  - -60 °C por metro
  - 0.006 °C por metro
  respuesta: -0.006 °C por metro
  solucion_pasos:
  - 'Paso 1: $m = \frac{-0.6}{100} = -0.006^\circ\text{C/m}$.'
- titulo: 'Ejemplo 3: Discriminación de modelo'
  enunciado: Una suscripción cuesta $\$5.000$ fijos al mes más $\$200$ por canción descargada. ¿Es de tasa constante?
  alternativas:
  - Sí, la tasa constante es de $200 por canción
  - No, porque tiene un cargo fijo
  - No, es exponencial
  - Solo si no se descargan canciones
  respuesta: Sí, la tasa constante es de $200 por canción
  solucion_pasos:
  - 'Paso 1: Cada canción adicional cuesta exactamente lo mismo ($\$200$), luego la tasa es constante.'
- titulo: 'Ejemplo 4: Velocidad constante'
  enunciado: Un corredor avanza a un ritmo constante de $4\text{ metros por segundo}$. ¿Qué representa este valor?
  alternativas:
  - La pendiente m de la función de distancia d(t) = 4t
  - El coeficiente de posición n
  - El tiempo total
  - La aceleración
  respuesta: La pendiente m de la función de distancia d(t) = 4t
  solucion_pasos:
  - 'Paso 1: La velocidad constante es la tasa de cambio y por ende la pendiente $m = 4$.'
errores_frecuentes:
- Confundir tasas porcentuales con tasas de cambio constante fijas.
- Olvidar el signo negativo en tasas de disminución o consumo.
- No homogenizar las unidades de tiempo o distancia antes de calcular la tasa.
afirmaciones_verdaderas:
- Una tasa de cambio constante caracteriza exclusivamente a los modelos lineales y afines.
- La tasa de cambio unitaria corresponde a la pendiente m de la recta en el plano cartesiano.
al_terminar_debes_poder: '**QUÉ:** Identificar y calcular tasas de cambio constantes en situaciones y contextos cotidianos.


  **CÓMO:** Verificando la invariancia del cociente Δy/Δx y estableciendo su correspondencia con la pendiente m del modelo.


