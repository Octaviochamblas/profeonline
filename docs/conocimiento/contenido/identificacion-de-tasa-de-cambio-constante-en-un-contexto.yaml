semantic_id: MAT.ALG.MODELAMIENTO_AFIN.IDENTIFICACION_TASA_CONSTANTE
resumen_inicial: 'Identificación de tasa de cambio constante en un contexto: conceptos,
  representación y propiedades en Modelamiento lineal y afín.'
explicacion_simple: 'Antes de escribir cualquier fórmula, hay que detectar la señal
  clave: ¿la magnitud cambia siempre en la misma proporción por cada unidad de la
  otra? Si sí, ya sabes que necesitas una función afín.'
explicacion_formal: '### Definición formal


  Una relación entre dos magnitudes $x$ e $y$ admite un modelo afín $y=mx+n$ si y
  solo si, para cualquier incremento $\Delta x$, el incremento correspondiente $\Delta
  y$ satisface $\Delta y = m \cdot \Delta x$ con $m$ constante, independiente del
  punto de partida.


  ### Desarrollo didáctico


  En un enunciado verbal, la tasa de cambio constante suele aparecer como frases del
  tipo "por cada", "cada", "a razón de", seguidas de un número fijo.


  Si un texto dice "el estanque sube 3 cm por cada minuto que pasa", esa frase señala
  directamente una tasa constante de 3 cm/minuto, la pendiente $m$ del modelo afín
  que describe la altura del agua.'
definiciones_clave: '- **Identificación de tasa de cambio constante en un contexto**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a identificación de tasa de cambio constante
  en un contexto.'
