semantic_id: MAT.GEO.POLIEDROS_PRISMAS.TETRAEDRO_REGULAR
resumen_inicial: 'Identificación del tetraedro regular: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: El tetraedro regular es como una pirámide de base triangular donde
  absolutamente todas las caras (incluida la base) son triángulos equiláteros idénticos.
explicacion_formal: '![Tetraedro regular](/static/img/geometria/espacio-cuerpos/tetraedro-regular.svg)


  ### Definición formal


  El tetraedro regular es uno de los cinco sólidos platónicos. Tiene 4 caras (todas
  triángulos equiláteros congruentes), 4 vértices y 6 aristas. En cada vértice concurren
  exactamente 3 caras.


  ### Desarrollo didáctico


  En la figura, el tetraedro está formado por 4 triángulos: una base y tres caras
  laterales, todas del mismo tamaño y forma. Es el poliedro regular con menor número
  de caras posible (no puede existir un poliedro regular con solo 2 o 3 caras).'
definiciones_clave: '- **Identificación del tetraedro regular**: Elemento o propiedad
  fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del tetraedro regular.'
