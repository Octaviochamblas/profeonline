semantic_id: MAT.ALG.MCD_ALGEBRAICO.MCD_MONOMIOS
resumen_inicial: 'El cálculo del M.C.D. entre monomios consiste en combinar el M.C.D. de los coeficientes numéricos con el M.C.D. de las partes literales para formar el producto monómico total.'
explicacion_simple: |
  Para calcular el **M.C.D. total** entre dos o más monomios completos (ej: $12x^3y^2$ y $18x^2y^4z$):
  - **FÓRMULA DE INTEGRACIÓN**:
    $$\mathbf{\text{M.C.D. Total} = (\text{M.C.D. numérico}) \cdot (\text{M.C.D. literal})}$$
  - **Integración en 3 Pasos**:
    1. **Calcula el M.C.D. numérico de los coeficientes ($12$ y $18$)**:
       - $\operatorname{MCD}(12, 18) = \mathbf{6}$.
    2. **Calcula el M.C.D. literal de las variables comunes con menor exponente**:
       - Letra $x$: $\min(3, 2) \implies \mathbf{x^2}$.
       - Letra $y$: $\min(2, 4) \implies \mathbf{y^2}$.
       - Letra $z$: sólo en el segundo $\implies$ ¡se descarta!
       - Parte literal: $\mathbf{x^2y^2}$.
    3. **Multiplica ambos resultados**:
       - $\mathbf{\text{M.C.D. Total} = 6x^2y^2}$.
explicacion_formal: |
  ### Definición formal
  Sean $M_1, M_2, \dots, M_k \in \mathbb{Z}[x_1, x_2, \dots, x_n]$ monomios representados como $M_i = c_i \prod_{j=1}^n x_j^{e_{i,j}}$ con $c_i \in \mathbb{Z} \setminus \{0\}$. El **Máximo Común Divisor monómico total** se define como el producto cartesiano del M.C.D. del grupo de coeficientes y el M.C.D. del retículo de partes literales:

  $$\operatorname{MCD}(M_1, M_2, \dots, M_k) = \operatorname{MCD}(|c_1|, |c_2|, \dots, |c_k|) \cdot \prod_{j=1}^n x_j^{\min_i(e_{i,j})}$$

  ### Propiedad de Divisibilidad Exacta
  El monomio resultante $D = \operatorname{MCD}(M_1, \dots, M_k)$ satisface que para cada $M_i$, la división $\frac{M_i}{D}$ es un monomio exacto con coeficientes enteros y exponentes no negativos ($\frac{M_i}{D} \in \mathbb{Z}[x_1, \dots, x_n]$).

  ### Síntesis didáctica
  Integrar el M.C.D. de los coeficientes positivos con las letras compartidas de menor exponente produce el monomio divisor de mayor tamaño algebraico.
definiciones_clave: |
  - **M.C.D. entre monomios**: Monomio de máximo valor numérico y grado que divide exactamente a cada monomio dado.
  - **Monomio divisor exacto**: Monomio cuyo cociente con cada uno de los monomios del conjunto no contiene variables en el denominador ni fracciones.
  - **Producto de integración**: Multiplicación de la constante entera del M.C.D. numérico por las variables del M.C.D. literal.
propiedades_relaciones: |
  - **Factorización de expresiones algebraicas**: El M.C.D. entre monomios constituye el Factor Común Monomio ideal para simplificar polinomios.
ejemplo_guiado:
  enunciado: 'Calcula el M.C.D. entre los tres monomios $M_1 = 24x^4y^3z^2$, $M_2 = -36x^3y^5$ y $M_3 = 60x^2y^2w^4$.'
  pasos:
    - 'Paso 1: Calculamos el M.C.D. numérico de los coeficientes en valor absoluto ($24, 36, 60$):
       - $24 = 2^3 \cdot 3$.
       - $36 = 2^2 \cdot 3^2$.
       - $60 = 2^2 \cdot 3 \cdot 5$.
       - $\operatorname{MCD}(24, 36, 60) = 2^2 \cdot 3 = \mathbf{12}$.'
    - 'Paso 2: Calculamos el M.C.D. literal de las variables comunes:
       - $x$: presente en los tres, menores exponentes $4, 3, 2 \implies \mathbf{x^2}$.
       - $y$: presente en los tres, menores exponentes $3, 5, 2 \implies \mathbf{y^2}$.
       - $z$ y $w$: no están en los tres $\implies$ **se descartan**.'
    - 'Paso 3: Unimos la parte numérica y la parte literal:
       $\text{M.C.D. Total} = 12 \cdot x^2y^2 = \mathbf{12x^2y^2}$.'
    - 'Conclusión: El M.C.D. entre los tres monomios es **$12x^2y^2$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el M.C.D. entre los monomios $16a^3b^2$ y $24a^2b^4c$?'
    choices:
      - {text: 'El M.C.D. es $8a^2b^2$, combinando $\operatorname{MCD}(16,24)=8$ y la parte literal $a^{\min(3,2)}b^{\min(2,4)} = a^2b^2$', is_correct: true}
      - {text: 'El M.C.D. es $48a^3b^4c$', is_correct: false}
      - {text: 'El M.C.D. es $8a^3b^4$', is_correct: false}
      - {text: 'El M.C.D. es $4a^2b^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''El M.C.D. es $8a^2b^2$, combinando $\operatorname{MCD}(16,24)=8$ y la parte literal $a^{\min(3,2)}b^{\min(2,4)} = a^2b^2$''. $\operatorname{MCD}(16, 24) = 8$ y menores exponentes $a^2b^2$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si al dividir un monomio de la lista por el M.C.D. obtenido el resultado da una fracción o deja letras en el denominador, ¿qué indica este hecho?'
    choices:
      - {text: 'Indica que se cometió un error al calcular el M.C.D., ya que la división por el M.C.D. debe ser siempre exacta y entera', is_correct: true}
      - {text: 'Indica que el M.C.D. está bien calculado', is_correct: false}
      - {text: 'Indica que el M.C.D. es negativo', is_correct: false}
      - {text: 'Es un resultado normal', is_correct: false}
    explanation: 'La alternativa correcta es ''Indica que se cometió un error al calcular el M.C.D., ya que la división por el M.C.D. debe ser siempre exacta y entera''. Definición de divisor exacto en $\mathbb{Z}[x_1, \dots, x_n]$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular el M.C.D. numérico de los coeficientes usando sus valores absolutos.'
  - 'Paso 2: Seleccionar las variables que aparezcan en todos los monomios elevadas a su menor exponente.'
  - 'Paso 3: Multiplicar el coeficiente del M.C.D. numérico por las variables del M.C.D. literal.'
  - 'Paso 4: Verificar que la expresión final divida exactamente a cada uno de los monomios originales.'
errores_correccion: |
  - **Error 1:** Multiplicar los coeficientes numéricos en lugar de hallar su M.C.D. **Cómo corregirlo:** Para la parte numérica **SE DEBE HALLAR EL M.C.D. MEDIANTE FACTORES PRIMOS O DIVISORES (no multiplicar los números)**.
  - **Error 2:** Incluir letras que no son comunes a todos los monomios. **Cómo corregirlo:** La parte literal del M.C.D. **SOLO ADMITE VARIABLES COMPARTIDAS POR LA TOTALIDAD DE LOS MONOMIOS**.
ejemplos:
  - titulo: 'M.C.D. completo'
    enunciado: 'Para $10x^2y$ y $15xy^3$, ¿es el M.C.D. igual a $5xy$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\operatorname{MCD}(10,15)=5$ y letras $xy$.'
  - titulo: 'Variable descartada'
    enunciado: 'Entre $6a^2b$ y $9a^3$, ¿se elimina la letra $b$ dando $3a^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $b$ no está en el segundo monomio.'
  - titulo: 'Coeficientes primarios'
    enunciado: 'Para $7x^3$ y $5x^2$, ¿es el M.C.D. $1x^2 = x^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\operatorname{MCD}(7,5)=1$.'
  - titulo: 'Comprobación de división'
    enunciado: 'Al dividir $12x^2y^2 \div 6x^2y^2$, ¿da el entero 2 sin variables?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la división es exacta.'
errores_frecuentes:
  - 'Multiplicar los coeficientes numéricos en lugar de calcular su M.C.D.'
  - 'Incluir variables no comunes en el monomio M.C.D. final.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Seleccionar el mayor exponente de las variables comunes como en el m.c.m.'
  - 'Asignar un signo negativo al M.C.D. cuando hay monomios con coeficientes negativos.'
afirmaciones_verdaderas:
  - 'El M.C.D. entre monomios se obtiene multiplicando el M.C.D. numérico de los coeficientes por el M.C.D. de las partes literales.'
  - 'Todo monomio original dividido entre su M.C.D. produce una expresión monómica exacta.'
al_terminar_debes_poder: 'Calcular el M.C.D. completo entre dos o más monomios combinando coeficientes y variables.'
