procedimiento:
- 'Paso 1: Calcula el MCD aritmético de los coeficientes numéricos.'
- 'Paso 2: Identifica las letras que aparecen en todos los monomios.'
- 'Paso 3: Asigna a cada letra común el exponente más pequeño que posea en el grupo.'
- 'Paso 4: Une el número y las letras para formar el monomio MCD.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en cálculo del m.c.d. entre monomios.
ejemplos:
- titulo: Halla el MCD de $15a^3 b^2$, $25a^2 b^4$ y $35a^4 b^3$
  enunciado: Halla el MCD de $15a^3 b^2$, $25a^2 b^4$ y $35a^4 b^3$.
  solucion_pasos:
  - 'MCD numérico de 15, 25 y 35: Es 5.'
  - 'Letras comunes: ''a'' y ''b''.'
  - 'Menores exponentes: ''a'' es 2, ''b'' es 2.'
  - 'Resultado final: $5a^2 b^2$.'
- titulo: MCD de $12x^3 y$ y $8x^2 y z$.
  solucion_pasos:
  - 'Números: MCD de 12 y 8 es 4. Letras comunes: x, y. Menor de x es 2. Menor de
    y es 1. z no va.'
- titulo: 'Respecto de «Cálculo del M.C.D. entre monomios»: ¿Es correcta esta caracterización?
    «El MCD'
  enunciado: 'Respecto de «Cálculo del M.C.D. entre monomios»: ¿Es correcta esta caracterización?
    «El MCD de dos o más monomios es un nuevo monomio compuesto por el MCD aritmético
    de sus coeficientes, multiplicado por las variables comunes elevadas a su menor
    exponente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El MCD de dos o más monomios
    es un nuevo monomio compuesto por el MCD aritmético de sus coeficientes, multiplicado
    por las variables comunes elevadas a su menor exponente.'
- titulo: 'Respecto de «Cálculo del M.C.D. entre monomios»: ¿Es válida esta afirmación?
    «Sacar el MCD d'
  enunciado: 'Respecto de «Cálculo del M.C.D. entre monomios»: ¿Es válida esta afirmación?
    «Sacar el MCD de los coeficientes y el MCM de las letras (combinar reglas opuestas)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El MCD de dos o más monomios
    es un nuevo monomio compuesto por el MCD aritmético de sus coeficientes, multiplicado
    por las variables comunes elevadas a su menor exponente.'
errores_frecuentes:
- Sacar el MCD de los coeficientes y el MCM de las letras (combinar reglas opuestas).
- Olvidarse de que este procedimiento de 'MCD de monomios' es la base exacta del método
  de 'Factor Común'.
- El Mínimo Común Múltiplo.
- Para «El MCD que calculamos para un conjunto de monomios es matemáticamente equivalente
  a:», la respuesta correcta es El producto de los monomios.
- El residuo de su división.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando cálculo
  del m.c.d. entre monomios.
