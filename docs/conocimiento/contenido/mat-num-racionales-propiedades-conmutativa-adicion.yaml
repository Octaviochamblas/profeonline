semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.CONMUTATIVA_ADICION
resumen_inicial: 'La propiedad conmutativa de la adición establece que el orden de
  los sumandos racionales no altera la suma: $q_1 + q_2 = q_2 + q_1$.'
explicacion_simple: En la adición de fracciones, la propiedad conmutativa significa
  que no importa qué número racional pongamos primero y cuál después; el resultado
  final de la suma será exactamente el mismo en ambos órdenes.
explicacion_formal: 'Para cualesquiera dos racionales $q_1 = \frac{a}{b}$ y $q_2 =
  \frac{c}{d}$ en $\mathbb{Q}$, la **Conmutatividad Aditiva** exige:


  $$q_1 + q_2 = q_2 + q_1 \iff \frac{a \cdot d + b \cdot c}{b \cdot d} = \frac{c \cdot
  b + d \cdot a}{d \cdot b}$$


  **Desglose de la fórmula:**

  - $a \cdot d + b \cdot c = c \cdot b + d \cdot a$: Conmutatividad del producto y
  la suma en los enteros $\mathbb{Z}$.


  > **Complemento didáctico:** Esta propiedad aplica a la suma, pero **NO** a la sustracción
  de racionales ($q_1 - q_2 \neq q_2 - q_1$).'
definiciones_clave: '- **Conmutatividad aditiva**: Invarianza del resultado frente
  al cambio de orden de los sumandos.'
propiedades_relaciones: '- **Invarianza del orden**: $q_1 + q_2 = q_2 + q_1$.'
ejemplo_guiado:
  enunciado: Demuestre la propiedad conmutativa aditiva sumando $\frac{1}{3} + \frac{2}{5}$
    y $\frac{2}{5} + \frac{1}{3}$.
  pasos:
  - 'Paso 1: Sumar en el primer orden: $\frac{1}{3} + \frac{2}{5} = \frac{5 + 6}{15}
    = \frac{11}{15}$.'
  - 'Paso 2: Sumar en el segundo orden: $\frac{2}{5} + \frac{1}{3} = \frac{6 + 5}{15}
    = \frac{11}{15}$.'
  - 'Paso 3: Comparar ambos resultados: $\frac{11}{15} = \frac{11}{15}$.'
  - 'Conclusión: Se cumple que $\frac{1}{3} + \frac{2}{5} = \frac{2}{5} + \frac{1}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la propiedad conmutativa de la adición en Q?
  choices:
  - text: Que q1 + q2 = q2 + q1 (el orden de los sumandos no altera la suma)
    is_correct: true
  - text: Que q1 + q2 = 0 siempre
    is_correct: false
  - text: Que q1 · q2 = q1 + q2
    is_correct: false
  - text: Que solo se aplica a números positivos
    is_correct: false
  explanation: La alternativa correcta es 'Que q1 + q2 = q2 + q1 (el orden de los
    sumandos no altera la suma)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el resultado idéntico obtenido en ambos
    órdenes de la suma?
  choices:
  - text: 11/15
    is_correct: true
  - text: 3/8
    is_correct: false
  - text: '1'
    is_correct: false
  - text: 2/15
    is_correct: false
  explanation: La alternativa correcta es '11/15'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la suma $q_1 + q_2$.'
- 'Paso 2: Calcular la suma en orden inverso $q_2 + q_1$.'
- 'Paso 3: Comprobar que ambos valores son exactamente iguales.'
errores_correccion: '- **Error 1: Pensar que la conmutatividad aplica a la sustracción
  ($q_1 - q_2 = q_2 - q_1$).** **Cómo corregirlo:** La resta NO es conmutativa; $\frac{3}{4}
  - \frac{1}{4} = \frac{2}{4}$ pero $\frac{1}{4} - \frac{3}{4} = -\frac{2}{4}$.


  - **Error 2: Cambiar el signo de los números al conmutar.** **Cómo corregirlo:**
  Conmutar solo cambia la posición de los sumandos conservando sus signos originales.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $1/4 + 2/3 = 11/12$, ¿cuánto vale $2/3 + 1/4$?
  alternativas:
  - 11/12
  - -11/12
  - 5/12
  respuesta: 11/12
  solucion_pasos:
  - Por la propiedad conmutativa aditiva $2/3 + 1/4 = 1/4 + 2/3 = 11/12$.
- titulo: Ejemplo 2
  enunciado: ¿Es la resta de fracciones una operación conmutativa?
  alternativas:
  - No, el orden altera el resultado de la resta
  - Sí, da siempre el mismo resultado
  - Solo si ambas son positivas
  respuesta: No, el orden altera el resultado de la resta
  solucion_pasos:
  - $a - b \neq b - a$ en general.
- titulo: ¿Se cumple q1 + q2 = q2 + q1 para cualquier par de números racionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un axioma de la adición en $\mathbb{Q}$.
- titulo: ¿Es 1/5 + 3/5 igual a 3/5 + 1/5?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambas dan 4/5.
errores_frecuentes:
- Cambiar la secuencia de ubicación de los sumandos altera el valor final de la adición
  de fracciones.
- La propiedad conmutativa es perfectamente aplicable a la sustracción de fracciones
  racionales.
- Conmutar una suma exige cambiar el signo de todos los términos involucrados.
- La conmutatividad aditiva en $\mathbb{Q}$ solo es válida cuando las fracciones tienen
  igual denominador.
- Sumar cero a una fracción invierte el orden conmutativo de su numerador.
afirmaciones_verdaderas:
- 'La adición en $\mathbb{Q}$ cumple la propiedad conmutativa: $q_1 + q_2 = q_2 +
  q_1$.'
- La sustracción en $\mathbb{Q}$ no satisface la propiedad conmutativa.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la propiedad conmutativa
  aditiva en $\mathbb{Q}$, reordenando sumandos sin alterar el resultado final de
  la suma.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
