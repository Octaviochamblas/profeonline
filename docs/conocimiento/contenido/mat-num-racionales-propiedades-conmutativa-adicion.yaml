semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.CONMUTATIVA_ADICION
resumen_inicial: La propiedad conmutativa de la adición establece que el orden en
  que se suman dos números racionales no altera la suma total.
explicacion_simple: 'La **propiedad conmutativa** de la suma nos dice que ''el orden
  de los factores no altera la suma''. Si tienes $\frac{1}{3}$ de litro de agua y
  le agregas $\frac{1}{2}$ litro, obtendrás exactamente la misma cantidad total que
  si a $\frac{1}{2}$ litro le agregas $\frac{1}{3}$ de litro. En ambos casos el resultado
  es $\frac{5}{6}$. Sumar en un sentido o en el sentido inverso da el mismo resultado
  exacto.

  '
explicacion_formal: 'Formalmente, la adición sobre el conjunto de los números racionales
  $\mathbb{Q}$ satisface la **propiedad conmutativa**:

  $$\forall q_1, q_2 \in \mathbb{Q}, \quad q_1 + q_2 = q_2 + q_1$$


  Demostración: sean $q_1 = \frac{a}{b}$ y $q_2 = \frac{c}{d}$ con $a, c \in \mathbb{Z}$
  y $b, d \in \mathbb{Z} \setminus \{0\}$.

  1. Lado izquierdo: $q_1 + q_2 = \frac{a \cdot d + b \cdot c}{b \cdot d}$.

  2. Lado derecho: $q_2 + q_1 = \frac{c \cdot b + d \cdot a}{d \cdot b}$.

  Puesto que la multiplicación y la adición en $\mathbb{Z}$ son conmutativas ($a \cdot
  d = d \cdot a$, $b \cdot c = c \cdot b$ y $b \cdot d = d \cdot b$), se concluye
  que ambos numeradores y denominadores son idénticos, por lo que $q_1 + q_2 = q_2
  + q_1$.

  '
definiciones_clave: '- **Propiedad conmutativa de la adición**: Invarianza del resultado
  de la suma $q_1 + q_2 = q_2 + q_1$ ante permuta del orden de los sumandos.

  - **Conmutador aditivo**: Condición de simetría $q_1 + q_2 - (q_2 + q_1) = 0$.

  - **Sumandos permutables**: Racionales cuya posición secuencial puede reordenarse
  libremente.

  '
propiedades_relaciones: '- **Facilitación de cálculos mentales**: Permite agrupar
  estratégicamente fracciones de igual denominador en sumas múltiples (por ejemplo
  $\frac{1}{5} + \frac{2}{3} + \frac{4}{5} = (\frac{1}{5} + \frac{4}{5}) + \frac{2}{3}
  = 1 + \frac{2}{3} = \frac{5}{3}$).

  - **Ausencia de conmutatividad en la sustracción**: La resta en $\mathbb{Q}$ NO
  es conmutativa ($\frac{a}{b} - \frac{c}{d} \neq \frac{c}{d} - \frac{a}{b}$ salvo
  si las fracciones son iguales).

  - **Estructura de Grupo Conmutativo**: Es una de las propiedades axiomáticas que
  definen a $(\mathbb{Q}, +)$ como un grupo abeliano.

  '
ejemplo_guiado:
  enunciado: Verifica la propiedad conmutativa de la adición calculando de dos formas
    distintas la suma entre $q_1 = \frac{2}{7}$ y $q_2 = \frac{3}{4}$.
  pasos:
  - 'Forma 1 ($q_1 + q_2$): calcular $\frac{2}{7} + \frac{3}{4}$.'
  - 'Homogenizar a $28$: $\frac{2 \cdot 4}{28} + \frac{3 \cdot 7}{28} = \frac{8 +
    21}{28} = \frac{29}{28}$.'
  - 'Forma 2 ($q_2 + q_1$): calcular $\frac{3}{4} + \frac{2}{7}$.'
  - 'Homogenizar a $28$: $\frac{3 \cdot 7}{28} + \frac{2 \cdot 4}{28} = \frac{21 +
    8}{28} = \frac{29}{28}$.'
  - 'Concluir: como $\frac{29}{28} = \frac{29}{28}$, se comprueba que $\frac{2}{7}
    + \frac{3}{4} = \frac{3}{4} + \frac{2}{7}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué postula la propiedad conmutativa para dos números racionales $q_1$
    y $q_2$ respecto de la suma?
  choices:
  - text: Que $q_1 + q_2 = q_2 + q_1$, es decir, cambiar el orden de los sumandos
      no altera la suma.
    is_correct: true
  - text: Que $q_1 + q_2 = q_1 \cdot q_2$.
    is_correct: false
  - text: Que $q_1 + q_2 = 0$.
    is_correct: false
  - text: Que la suma siempre debe ser un número entero positivo.
    is_correct: false
  explanation: 'La correcta es Que $q_1 + q_2 = q_2 + q_1$, es decir, cambiar el orden
    de los sumandos no altera la suma.: establece la invariabilidad de la adición
    ante la permutación.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si sabes que $\frac{5}{9} + \frac{4}{11} = \frac{91}{99}$, ¿cuál es el
    valor de $\frac{4}{11} + \frac{5}{9}$ sin necesidad de volver a calcular?
  choices:
  - text: \$\frac{91}{99}$
    is_correct: true
  - text: -\$\frac{91}{99}$
    is_correct: false
  - text: \$\frac{99}{91}$
    is_correct: false
  - text: No se puede saber sin volver a hacer el cálculo.
    is_correct: false
  explanation: 'La alternativa correcta es: \$\frac{91}{99}$. La correcta es \frac{91}{99}:
    por la propiedad conmutativa, $\frac{4}{11} + \frac{5}{9} = \frac{5}{9} + \frac{4}{11}
    = \frac{91}{99}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los dos sumandos racionales $q_1$ y $q_2$.'
- 'Paso 2: Resolver la suma en el orden original $q_1 + q_2$.'
- 'Paso 3: Resolver la suma invirtiendo el orden $q_2 + q_1$.'
- 'Paso 4: Comparar ambos resultados finales e igualarlos para verificar la propiedad.'
errores_correccion: 'Un error grave es asumir que la resta también cumple esta propiedad
  y pensar que $\frac{a}{b} - \frac{c}{d} = \frac{c}{d} - \frac{a}{b}$. **La resta
  NO es conmutativa** (invertir el orden de una resta le cambia el signo al resultado).

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es verdadero que $-\frac{3}{5} + \frac{1}{2} = \frac{1}{2} + \left(-\frac{3}{5}\right)$?
  alternativas:
  - Sí, es verdadero por la propiedad conmutativa de la adición.
  - No, porque los números negativos invierten la regla.
  - No, el resultado tiene signo contrario.
  respuesta: Sí, es verdadero por la propiedad conmutativa de la adición.
  solucion_pasos:
  - 'Lado izquierdo: $-\frac{6}{10} + \frac{5}{10} = -\frac{1}{10}$.'
  - 'Lado derecho: $\frac{5}{10} + \left(-\frac{6}{10}\right) = -\frac{1}{10}$.'
  - Se cumple la conmutatividad.
- titulo: Ejemplo 2
  enunciado: Simplifica la suma $\frac{1}{8} + \frac{5}{6} + \frac{7}{8}$ utilizando
    la conmutatividad.
  alternativas:
  - 1\$\frac{5}{6}$ (o \$\frac{11}{6}$).
  - 2\$\frac{1}{6}$.
  - \$\frac{13}{22}$.
  respuesta: 1\$\frac{5}{6}$ (o \$\frac{11}{6}$).
  solucion_pasos:
  - 'Reordenamos sumando primero las de igual denominador: $\left(\frac{1}{8} + \frac{7}{8}\right)
    + \frac{5}{6}$.'
  - $\frac{8}{8} + \frac{5}{6} = 1 + \frac{5}{6} = 1\frac{5}{6} = \frac{11}{6}$.
- titulo: ¿Se aplica la propiedad conmutativa de la adición al sumar tres o más fracciones
    racionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, se pueden permutar todos los sumandos en cualquier orden deseado sin alterar
    el total.
- titulo: ¿Es conmutativa la adición de números mixtos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $A_1\frac{b_1}{c_1} + A_2\frac{b_2}{c_2} = A_2\frac{b_2}{c_2} + A_1\frac{b_1}{c_1}$.
errores_frecuentes:
- Intentar aplicar la propiedad conmutativa a la sustracción de fracciones.
- Creer que la conmutatividad solo funciona con fracciones de igual denominador.
- Olvidar mantener el signo negativo del sumando al permutar su posición.
- Confundir la propiedad conmutativa con la asociativa (que involucra agrupamiento
  por paréntesis).
- Pensar que permutar los sumandos altera la fracción irreductible resultante.
afirmaciones_verdaderas:
- La suma de dos números racionales no depende del orden de los sumandos (propiedad
  conmutativa).
- Para todo $q_1, q_2 \in \mathbb{Q}$, se verifica que $q_1 + q_2 = q_2 + q_1$.
al_terminar_debes_poder: 'Debes ser capaz de aplicar la propiedad conmutativa aditiva
  para agilizar cálculos de sumas múltiples con fracciones y justificar su validez.

  '
