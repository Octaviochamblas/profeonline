    de la gráfica?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Compara los valores absolutos de los coeficientes $a$ de dos funciones
  potencia con igual exponente.'
- 'Paso 2: Identifica cuál tiene mayor valor absoluto.'
- 'Paso 3: Concluye que esa gráfica está más comprimida verticalmente que la de menor
  valor absoluto.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en análisis del valor absoluto de a en la abertura o escala vertical
  de la gráfica.
ejemplos:
- titulo: Comparación de magnitudes con exponente par
  enunciado: Compara la "apertura" de $f(x)=4x^2$ y $g(x)=x^2$.
  solucion_pasos:
  - $|4|>|1|$, así que $f$ crece más rápido que $g$ para el mismo valor de $x$.
  - La gráfica de $f$ está más comprimida hacia el eje $y$ que la de $g$.
- titulo: Comparación de magnitudes con coeficiente fraccionario
  enunciado: Compara la "apertura" de $f(x)=0{,}2x^3$ y $g(x)=3x^3$.
  solucion_pasos:
  - $|0{,}2|<|3|$, así que $f$ crece más lento que $g$.
  - La gráfica de $f$ está más expandida (más "ancha") que la de $g$.
- titulo: ¿La magnitud de $a$ afecta el dominio de la función?
  enunciado: ¿Cambiar la magnitud del coeficiente $a$ modifica el dominio de la función
    potencia?
  respuesta: 'No'
  solucion_pasos:
  - El dominio depende del exponente $n$, no de la magnitud de $a$.
- titulo: ¿Un coeficiente $a$ con $|a|=1$ produce la gráfica más "básica" de $x^n$?
  enunciado: ¿La función $f(x)=1\cdot x^n$ corresponde exactamente a la gráfica básica
    de $x^n$ sin compresión ni expansión?
  respuesta: Sí
  solucion_pasos:
  - Con $|a|=1$ no hay compresión ni expansión adicional respecto a la curva de referencia
    $x^n$.
errores_frecuentes:
- Confundir el efecto de la magnitud de $a$ con el efecto de su signo.
- Suponer que un coeficiente fraccionario siempre "achica" el dominio, en vez de solo
  afectar la forma de la curva.
- No comparar los valores absolutos correctamente al determinar cuál curva es más
  "angosta".
- Olvidar que esta comparación solo tiene sentido entre funciones con el mismo exponente
  $n$.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  análisis del valor absoluto de a en la abertura o escala vertical de la gráfica.
