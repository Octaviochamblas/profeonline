semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.PARAMETRO_A_MAGNITUD
resumen_inicial: 'Análisis del valor absoluto de a en la abertura o escala vertical
  de la gráfica: forma general $f(x) = a x^n$, simetría, dominio y recorrido en Definición
  y análisis de parámetros.'
explicacion_simple: Además del signo, el tamaño del coeficiente $a$ determina qué
  tan "cerrada" o "abierta" se ve la curva respecto al eje $x$.
explicacion_formal: '### Definición formal


  Para $f(x)=a\cdot x^n$ con $|a_1|>|a_2|$, los valores de $|a_1\cdot x^n|$ son mayores
  que $|a_2\cdot x^n|$ para todo $x\neq0$. Geométricamente, esto produce una curva
  más "angosta" (comprimida verticalmente) para valores mayores de $|a|$, y más "ancha"
  (expandida) para valores menores.


  ### Desarrollo didáctico


  Compara $f(x)=5x^2$ con $g(x)=0{,}5x^2$: en $x=2$, $f(2)=20$ mientras $g(2)=2$.
  La curva de $f$ sube mucho más rápido que la de $g$, dando la impresión de estar
  más "comprimida" cerca del eje $y$.'
definiciones_clave: '- **Análisis del valor absoluto de a en la abertura o escala
  vertical de la gráfica**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n
  \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a análisis del valor absoluto de a en la abertura o escala vertical
  de la gráfica.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de análisis del valor absoluto de a en la abertura o escala vertical de la gráfica.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de análisis del valor absoluto
    de a en la abertura o escala vertical de la gráfica.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar análisis del valor absoluto de a en la abertura o escala vertical
    de la gráfica?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en definición y análisis de parámetros
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en definición y análisis de parámetros.
    El exponente n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
