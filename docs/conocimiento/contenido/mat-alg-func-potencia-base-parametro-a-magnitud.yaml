semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.PARAMETRO_A_MAGNITUD
resumen_inicial: 'El valor absoluto del coeficiente $|a|$ en la función potencia $f(x) = a x^n$ regula la escala vertical: $|a| > 1$ produce una dilatación (estrechando la gráfica hacia el eje $y$), mientras que $0 < |a| < 1$ produce una contracción (ensanchando la gráfica hacia el eje $x$).'
explicacion_simple: |
  El tamaño numérico del parámetro $a$ (sin importar su signo) actúa como un control de elasticidad sobre la gráfica de la función potencia $f(x) = a x^n$. Si el valor absoluto es grande ($|a| > 1$, como en $5x^2$), las respuestas se multiplican por 5, estirando la curva verticalmente y haciéndola ver más delgada o cerrada hacia el eje vertical. Si el valor absoluto es una fracción pequeña entre 0 y 1 ($0 < |a| < 1$, como en $0.2x^2$), las salidas se reducen a la quinta parte, aplastando la curva verticalmente y haciéndola ver más ancha o abierta.
explicacion_formal: |
  ### Definición formal
  La **magnitud o valor absoluto del coeficiente** $|a| \in \mathbb{R}^+$ en la función potencia $f(x) = a x^n$ representa el factor constante de estiramiento o compresión vertical de la gráfica respecto a la curva base $y = x^n$:
  1. **Dilatación Vertical ($|a| > 1$)**: Cada ordenada $y$ se multiplica por un factor mayor que 1. Gráficamente, las ramas se aproximan velozmente al eje $y$ (estrechamiento de la curva).
  2. **Contracción Vertical ($0 < |a| < 1$)**: Cada ordenada $y$ se multiplica por una fracción comprendida entre 0 y 1. Gráficamente, las ramas se alejan del eje $y$ aplanándose hacia el eje $x$ (aplastamiento de la curva).
  3. **Escala Unitaria ($|a| = 1$)**: Conserva la apertura original de la función canónica mónizable $y = x^n$.

  ### Desglose analítico de puntos a la altura $x = 1$
  Para cualquier exponente $n$:
  - En la curva canónica $y = x^n$, la ordenada en $x = 1$ es $y = 1$.
  - En la curva transformada $y = a x^n$, la ordenada en $x = 1$ se desplaza a $y = a$.
  - La distancia vertical desde el eje $x$ hasta la curva en $x = 1$ es exactamente $|a|$.

  ### Síntesis didáctica
  Relación de abertura para parábolas ($n = 2$):
  - Mayor $|a| \implies$ Parábola más **estrecha** o cerrada.
  - Menor $|a|$ (más cercano a cero) $\implies$ Parábola más **ancha** o abierta.
definiciones_clave: |
  - **Magnitud del coeficiente $|a|$**: Valor numérico sin signo del parámetro multiplicativo.
  - **Dilatación vertical ($|a| > 1$)**: Alargamiento vertical que acerca las ramas al eje $y$.
  - **Contracción vertical ($0 < |a| < 1$)**: Compresión vertical que aplasta las ramas hacia el eje $x$.
propiedades_relaciones: |
  - **Invariancia del vértice o punto de inflexión**: La escala vertical multiplicativa por $|a|$ preserva el punto $(0, 0)$ intacto ($f(0) = a \cdot 0^n = 0$).
  - **Monotonía de la tasa de cambio**: A mayor $|a|$, mayor es el valor absoluto de la pendiente $|f'(x)| = |a \cdot n \cdot x^{n-1}|$ para todo $x \neq 0$.
ejemplo_guiado:
  enunciado: 'Ordena de menor a mayor abertura (de la más estrecha a la más ancha) las siguientes parábolas dadas por funciones potencia: $f(x) = \frac{1}{4}x^2$, $g(x) = -6x^2$, $h(x) = 2x^2$, $p(x) = -0.1x^2$.'
  pasos:
    - 'Paso 1: Calculamos el valor absoluto $|a|$ de cada función: $|a_f| = |1/4| = 0.25$, $|a_g| = |-6| = 6$, $|a_h| = |2| = 2$, $|a_p| = |-0.1| = 0.1$.'
    - 'Paso 2: Recordamos que a **mayor $|a|$**, la curva es **más estrecha** (menor abertura); a **menor $|a|$**, la curva es **más ancha** (mayor abertura).'
    - 'Paso 3: Orden de $|a|$ de mayor a menor: $|a_g| = 6 > |a_h| = 2 > |a_f| = 0.25 > |a_p| = 0.1$.'
    - 'Paso 4: Conclusión (de más estrecha a más ancha): $g(x) = -6x^2$ (más estrecha), $h(x) = 2x^2$, $f(x) = \frac{1}{4}x^2$, $p(x) = -0.1x^2$ (más ancha).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si comparamos las gráficas de las funciones potencia $f(x) = 8x^3$ y $g(x) = 0.2x^3$, ¿cómo se diferencia la forma de sus curvas?'
    choices:
      - {text: 'La gráfica de $f(x) = 8x^3$ está dilatada verticalmente (más estrecha y pegada al eje $y$), mientras que $g(x) = 0.2x^3$ está contraída verticalmente (más aplanada)', is_correct: true}
      - {text: 'La gráfica de $g(x) = 0.2x^3$ es más alta y estrecha que la de $f(x)$', is_correct: false}
      - {text: 'Ambas gráficas son idénticas porque tienen el mismo exponente 3', is_correct: false}
      - {text: 'La gráfica de $f(x)$ abre hacia abajo y la de $g(x)$ abre hacia arriba', is_correct: false}
    explanation: 'La alternativa correcta es ''La gráfica de $f(x) = 8x^3$ está dilatada verticalmente (más estrecha y pegada al eje $y$), mientras que $g(x) = 0.2x^3$ está contraída verticalmente (más aplanada)''. A mayor $|a|$, mayor es el estiramiento vertical.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Entre las funciones potencia $f(x) = -10x^2$ y $g(x) = 3x^2$, ¿cuál de las dos parábolas es más cerrada o estrecha respecto a su eje de simetría?'
    choices:
      - {text: 'La función $f(x) = -10x^2$, porque posee un mayor valor absoluto $|a| = |-10| = 10 > 3$', is_correct: true}
      - {text: 'La función $g(x) = 3x^2$, porque su número 3 es positivo', is_correct: false}
      - {text: 'Ambas tienen exactamente la misma abertura', is_correct: false}
      - {text: 'Ninguna, las parábolas siempre tienen la misma abertura estándar', is_correct: false}
    explanation: 'La alternativa correcta es ''La función $f(x) = -10x^2$, porque posee un mayor valor absoluto $|a| = |-10| = 10 > 3$''. La abertura o estrechamiento depende de la magnitud $|a|$, ignorando el signo negativo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Obtener el valor absoluto $|a|$ del coeficiente multiplicativo en cada función potencia.'
  - 'Paso 2: Comparar $|a|$ con el valor 1.'
  - 'Paso 3: Si $|a| > 1$, clasificar la gráfica como dilatada verticalmente (curva más pegada al eje $y$).'
  - 'Paso 4: Si $0 < |a| < 1$, clasificar la gráfica como contraída o comprimida verticalmente (curva más aplanada hacia el eje $x$).'
errores_correccion: |
  - **Error 1:** Considerar el signo negativo al determinar la abertura (ej: decir que $a = -10$ es menor que $a = 2$ y por lo tanto es más ancha). **Cómo corregirlo:** La abertura depende del valor absoluto $|a|$. Puesto que $|-10| = 10 > 2$, la curva $y = -10x^2$ es mucho más estrecha que $y = 2x^2$. El signo solo indica que abre hacia abajo.
  - **Error 2:** Creer que un coeficiente pequeño como $a = 0.1$ estrecha la gráfica. **Cómo corregirlo:** Coeficientes con $|a| < 1$ reducen los valores de $y$, por lo que la gráfica se aplasta y se ensancha horizontalmente.
ejemplos:
  - titulo: 'Comparación por valor absoluto'
    enunciado: '¿La parábola $f(x) = -5x^2$ es más estrecha que $g(x) = 3x^2$?'
    alternativas:
      - 'Sí, porque $|-5| = 5 > 3$'
      - 'No, porque $-5 < 3$'
      - 'Tienen la misma abertura'
    respuesta: 'Sí, porque $|-5| = 5 > 3$'
    solucion_pasos:
      - '1. Calculamos $|-5| = 5$ y $|3| = 3$.'
      - '2. Como $5 > 3$, la curva de $f(x)$ está más estrechada hacia el eje $y$.'
  - titulo: 'Contracción vertical'
    enunciado: '¿La función $h(x) = \frac{1}{3}x^4$ está contraída verticalmente respecto a $y = x^4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $|a| = \frac{1}{3} < 1$, la gráfica sufre una contracción vertical (se aplasta).'
  - titulo: 'Dilatación en exponente impar'
    enunciado: '¿La curva $p(x) = 10x^3$ crece más empinada cerca de $x = 1$ que $q(x) = x^3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En $x = 1$, $p(1) = 10$ mientras que $q(1) = 1$, siendo 10 veces más empinada.'
  - titulo: 'Abertura de funciones con igual $|a|$'
    enunciado: '¿Las funciones $f(x) = 4x^2$ y $g(x) = -4x^2$ tienen exactamente la misma abertura?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Tienen el mismo valor absoluto $|a| = 4$, por lo que su forma y abertura son idénticas, diferenciándose solo en su orientación arriba/abajo.'
errores_frecuentes:
  - 'Un coeficiente negativo como $a = -8$ genera una parábola más ancha que $a = 2$ por ser un número menor.'
  - 'El parámetro $a$ altera la posición del origen $(0, 0)$ trasladándolo verticalmente.'
  - 'Una contracción vertical con $a = 0.5$ alarga la gráfica hacia arriba.'
  - 'Todas las funciones potencia con el mismo exponente $n$ poseen exactamente la misma gráfica.'
  - 'El valor $|a| > 1$ ensancha la curva de la función potencia.'
afirmaciones_verdaderas:
  - 'La escala vertical y la abertura de la función potencia dependen exclusivamente de la magnitud $|a|$: a mayor $|a|$ la gráfica se estrecha hacia el eje $y$, y a menor $|a|$ se aplasta hacia el eje $x$.'
  - 'Las funciones $f(x) = a x^n$ y $g(x) = -a x^n$ poseen exactamente la misma magnitud $|a|$ y por lo tanto la misma abertura, diferenciándose únicamente en su reflexión vertical.'
al_terminar_debes_poder: |
  QUÉ: Analizar el efecto de la magnitud $|a|$ en la dilatación o contracción vertical de la gráfica.
  CÓMO: Comparar $|a| > 1$ (estiramiento vertical y estrechamiento respecto al eje Y) y $0 < |a| < 1$ (compresión vertical).
