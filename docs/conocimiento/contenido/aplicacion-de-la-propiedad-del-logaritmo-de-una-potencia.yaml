semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.POTENCIA
resumen_inicial: 'La propiedad del logaritmo de una potencia (regla del sombrero) establece que el exponente del argumento baja multiplicando por delante como un factor escalar: $\log_b(x^k) = k \cdot \log_b(x)$ ($x > 0, k \in \mathbb{R}$).'
explicacion_simple: "![La propiedad del logaritmo de una potencia (regla del sombrero) establece que el exponente del argumento baja multiplicando por delante como un factor escalar: $\\log_b(x^k) = k \\cdot \\log_b(x)$ ($x > 0, k \\in \\mathbb{R}$)](/static/img/nodos/aplicacion-de-la-propiedad-del-logaritmo-de-una-potencia-intro.svg)\n\n\nEsta propiedad es conocida popularmente como la **\"regla del sombrero\"**: cualquier exponente que esté arriba del argumento **se cae hacia adelante multiplicando**:\n\n$$\\log_b(x^{\\mathbf{k}}) = \\mathbf{k} \\cdot \\log_b(x)$$\n\n- **¿Para qué sirve?**\n  - Para bajar exponentes difíciles y volverlos multiplicaciones normales.\n  - $\\log_2(8^{\\mathbf{4}}) = \\mathbf{4} \\cdot \\log_2(8) = 4 \\cdot 3 = \\mathbf{12}$.\n- **¡También funciona con raíces!** (Recuerda que $\\sqrt[n]{x} = x^{1/n}$):\n  $$\\log_b(\\sqrt[n]{x}) = \\mathbf{\\frac{1}{n}} \\log_b(x)$$\n  - $\\log_3(\\sqrt{27}) = \\frac{1}{2} \\log_3(27) = \\frac{1}{2} \\cdot 3 = \\mathbf{\\\
  frac{3}{2}}$."
explicacion_formal: 'Sean $x \in \mathbb{R}^+, b \in \mathbb{R}^+ \setminus \{1\}$ y $k \in \mathbb{R}$. Sea $u = \log_b(x) \iff x = b^u$.

  Elevando ambos miembros a la potencia $k$:

  $$x^k = (b^u)^k = b^{k \cdot u}$$

  Aplicando el operador $\log_b$ a ambos miembros:

  $$\log_b(x^k) = \log_b\left(b^{k \cdot u}\right) = k \cdot u$$

  Sustituyendo $u = \log_b(x)$:

  $$\log_b(x^k) = k \cdot \log_b(x)$$


  **Corolario para radicales ($\k = 1/n$)**:

  $$\log_b(\sqrt[n]{x^m}) = \log_b\left(x^{m/n}\right) = \frac{m}{n} \log_b(x)$$'
definiciones_clave: '- **Regla del sombrero / Logaritmo de potencia**: Factorización del exponente $k$ como multiplicador escalar exterior.

  - **Linealización de potencias**: Reducción de grados exponenciales a productos lineales.'
propiedades_relaciones: '- **Subida y bajada de coeficientes**: $k \cdot \log_b(x) = \log_b(x^k)$.

  - **Distinción de paréntesis**: $[\log_b(x)]^k \neq \log_b(x^k)$. Solo el exponente que afecta directamente al argumento puede bajar.'
ejemplo_guiado:
  enunciado: '![Ejemplo La propiedad del logaritmo de una potencia (regla del sombrero) establece que el exponente del argumento baja multiplicando por delante como un factor escalar: $\log_b(x^k) = k \cdot \log_b(x)$ ($x > 0, k \in \mathbb{R}$)](/static/img/nodos/aplicacion-de-la-propiedad-del-logaritmo-de-una-potencia-ejemplos.svg)



    Calcula y simplifica aplicando la propiedad de la potencia:

    1) $\log_5(125^6)$

    2) $\log_2(\sqrt[4]{32})$

    3) Si $\log(x) = 1{,}5$, calcula $\log(x^4)$'
  pasos:
  - 'Paso 1: Para $\log_5(125^6)$:

    - Bajar el exponente 6: $6 \cdot \log_5(125)$.

    - Como $\log_5(125) = 3$: $6 \cdot 3 = \mathbf{18}$.'
  - 'Paso 2: Para $\log_2(\sqrt[4]{32})$:

    - Convertir raíz a potencia fraccionaria: $\log_2(32^{1/4}) = \frac{1}{4} \log_2(32)$.

    - Como $\log_2(32) = 5$: $\frac{1}{4} \cdot 5 = \mathbf{\frac{5}{4}}$.'
  - 'Paso 3: Para $\log(x^4)$:

    - Bajar el exponente: $4 \cdot \log(x)$.

    - Sustituir $\log(x) = 1{,}5$: $4 \cdot 1{,}5 = \mathbf{6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la simplificación de $\log_3(x^5)$?
  choices:
  - text: 5 · log₃(x)
    is_correct: true
  - text: '[log₃(x)]⁵'
    is_correct: false
  - text: log₃(5x)
    is_correct: false
  - text: x · log₃(5)
    is_correct: false
  explanation: La alternativa correcta es '5 · log₃(x)'. Por la regla de la potencia, el exponente 5 baja multiplicando al frente del logaritmo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué equivale $\log(\sqrt[3]{y})$?
  choices:
  - text: (1/3) · log(y)
    is_correct: true
  - text: 3 · log(y)
    is_correct: false
  - text: log(y/3)
    is_correct: false
  - text: √[log(y)]
    is_correct: false
  explanation: La alternativa correcta es '(1/3) · log(y)'. Como $\sqrt[3]{y} = y^{1/3}$, el exponente $1/3$ baja multiplicando por delante.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente $k$ que afecta al argumento $x$.'
- 'Paso 2: Si hay radicales, reescribirlos como exponentes fraccionarios $\sqrt[n]{x} = x^{1/n}$.'
- 'Paso 3: Bajar el exponente multiplicando al frente: $k \cdot \log_b(x)$.'
- 'Paso 4: Evaluar el logaritmo base y realizar la multiplicación aritmética.'
errores_correccion: '- **Error común:** Bajar un exponente que afecta a todo el logaritmo (ej: $[\log(x)]^2 = 2\log(x)$).

  - **Cómo corregirlo:** La regla **solo aplica si el exponente está dentro del argumento**: $\log(x^2) = 2\log(x)$, pero $[\log(x)]^2 = \log(x) \cdot \log(x)$.'
ejemplos:
- titulo: 'Ejemplo 1: Exponente entero positivo'
  enunciado: 'Calcula $\log_2(8^5)$:'
  alternativas:
  - '15'
  - '40'
  - '8'
  - '13'
  respuesta: '15'
  solucion_pasos:
  - 'Paso 1: $5 \cdot \log_2(8) = 5 \cdot 3 = 15$.'
- titulo: 'Ejemplo 2: Raíz cuadrada'
  enunciado: 'Calcula $\log_5(\sqrt{125})$:'
  alternativas:
  - 3/2
  - '3'
  - 2/3
  - 1/2
  respuesta: 3/2
  solucion_pasos:
  - 'Paso 1: $\log_5(125^{1/2}) = \frac{1}{2} \log_5(125) = \frac{1}{2} \cdot 3 = 3/2$.'
- titulo: 'Ejemplo 3: Exponente negativo fraccionario'
  enunciado: 'Simplifica $\log_b\left(\frac{1}{\sqrt{x}}\right)$:'
  alternativas:
  - -1/2 · log_b(x)
  - 1/2 · log_b(x)
  - -2 · log_b(x)
  - log_b(-√x)
  respuesta: -1/2 · log_b(x)
  solucion_pasos:
  - 'Paso 1: $1/\sqrt{x} = x^{-1/2} \implies -\frac{1}{2} \log_b(x)$.'
- titulo: 'Ejemplo 4: Subida de coeficiente'
  enunciado: 'Escribe $3\log(2)$ como un solo logaritmo:'
  alternativas:
  - log(8)
  - log(6)
  - log(5)
  - '8'
  respuesta: log(8)
  solucion_pasos:
  - 'Paso 1: $3\log(2) = \log(2^3) = \log(8)$.'
errores_frecuentes:
- Confundir log(xᵏ) con [log(x)]ᵏ.
- Olvidar multiplicar el exponente fraccionario por el valor del logaritmo al simplificar raíces.
- Sumar el exponente en vez de multiplicarlo.
afirmaciones_verdaderas:
- El logaritmo de una potencia es igual al producto del exponente por el logaritmo del argumento.
- 'Los radicales se extraen del logaritmo dividiendo por el índice de la raíz: log(ⁿ√x) = (1/n) log(x).'
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad del logaritmo de una potencia y de una raíz.


  **CÓMO:** Utilizando la regla log_b(xᵏ) = k · log_b(x) para extraer exponentes y simplificar radicales.


