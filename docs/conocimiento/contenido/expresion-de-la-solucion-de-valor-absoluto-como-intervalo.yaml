semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.INTERPRETACION_INTERVALO
resumen_inicial: Expresar la solución de una inecuación con valor absoluto como intervalo requiere convertir la desigualdad continua o la unión de regiones a notación de corchetes.
explicacion_simple: '![Expresión de la solución de valor absoluto como intervalo](/static/img/nodos/expresion-de-la-solucion-de-valor-absoluto-como-intervalo-intro.svg)


  Las inecuaciones con valor absoluto dan lugar a dos formas principales de solución:


  1. Para $|x| < k$, los valores quedan atrapados entre $-k$ y $k$, lo que se escribe como el **intervalo acotado** $]-k, k[$.

  2. Para $|x| > k$, los valores se escapan hacia los extremos exteriores, lo que se escribe como la **unión de dos intervalos** $]-\infty, -k[ \cup ]k, +\infty[$.'
explicacion_formal: 'Sea $k > 0$:


  1. $|E(x)| \le k \iff -k \le E(x) \le k \implies S = [-k, k]$ (Intervalo acotado).

  2. $|E(x)| \ge k \iff E(x) \le -k \ \lor \ E(x) \ge k \implies S = ]-\infty, -k] \cup [k, +\infty[$ (Unión de semirrectas).


  **Desglose de la fórmula:**

  - Operador de menor ($\le$): Produce intersección y genera un único intervalo continuo.

  - Operador de mayor ($\ge$): Produce disyunción y genera la unión $\cup$ de dos intervalos disjuntos.

  '
definiciones_clave: '- **Notación de intervalo con valor absoluto**: Representación mediante corchetes de los conjuntos de soluciones continuos o disjuntos derivados de desigualdades absolutas.

  '
propiedades_relaciones: '- **Forma conjuntiva vs disyuntiva**: Las desigualdades del tipo $<$ producen intervalos acotados; las desigualdades del tipo $>$ producen uniones de semirrectas.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Expresión de la solución de valor absoluto como intervalo](/static/img/nodos/expresion-de-la-solucion-de-valor-absoluto-como-intervalo-ejemplos.svg)


    Expresa la solución de la inecuación $|x| \ge 4$ en notación de intervalo.'
  pasos:
  - 'Paso 1: Aplicar la propiedad disyuntiva para $|x| \ge 4$: $x \le -4 \ \lor \ x \ge 4$.'
  - 'Paso 2: Escribir la primera rama como intervalo: $x \le -4 \implies ]-\infty, -4]$.'
  - 'Paso 3: Escribir la segunda rama como intervalo: $x \ge 4 \implies [4, +\infty[$.'
  - 'Paso 4: Unir ambos intervalos: $S = ]-\infty, -4] \cup [4, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la notación de intervalo correcta para la solución de $|x| \ge 4$?
  choices:
  - text: $S = ]-\infty, -4] \cup [4, +\infty[$
    is_correct: true
  - text: $S = [-4, 4]$
    is_correct: false
  - text: $S = ]-4, 4[$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-\infty, -4] \cup [4, +\infty[$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la notación de intervalo correcta para la solución de $|x| < 3$?
  choices:
  - text: $S = ]-3, 3[$
    is_correct: true
  - text: $S = ]-\infty, -3[ \cup ]3, +\infty[$
    is_correct: false
  - text: $S = [-3, 3]$
    is_correct: false
  - text: $S = ]0, 3[$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-3, 3[$'. Es un intervalo acotado abierto.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver las inecuaciones lineales resultantes del desglose del valor absoluto.'
- 'Paso 2: Determinar si las ramas forman un único intervalo ($<, \le$) o una unión de intervalos ($>, \ge$).'
- 'Paso 3: Asignar corchetes abiertos ($<, >$) o cerrados ($\le, \ge$).'
- 'Paso 4: Redactar la expresión final en notación de intervalos.'
errores_correccion: '- **Error común:** Escribir un único intervalo $[-4, 4]$ para una inecuación de mayor que $|x| \ge 4$.

  - **Cómo corregirlo:** Recuerda que las desigualdades con mayor que ($>$) se abren hacia los extremos exteriores, requiriendo el símbolo de unión $\cup$.

  '
ejemplos:
- titulo: 'Ejemplo 1: Intervalo cerrado simple'
  enunciado: Expresa como intervalo la solución de $|x - 1| \leq 3$.
  alternativas:
  - $[-2, 4]$
  - $]-2, 4[$
  - $]-\infty, -2] \cup [4, +\infty[$
  - $[1, 3]$
  respuesta: $[-2, 4]$
  solucion_pasos:
  - 'Paso 1: $-3 \le x - 1 \le 3 \implies -2 \le x \le 4$.'
  - 'Paso 2: $S = [-2, 4]$.'
- titulo: 'Ejemplo 2: Unión de semirrectas'
  enunciado: Expresa como intervalo la solución de $|x| > 6$.
  alternativas:
  - $]-\infty, -6[ \cup ]6, +\infty[$
  - $]-6, 6[$
  - $[-6, 6]$
  - $[6, +\infty[$
  respuesta: $]-\infty, -6[ \cup ]6, +\infty[$
  solucion_pasos:
  - 'Paso 1: $x < -6 \lor x > 6$.'
  - 'Paso 2: $S = ]-\infty, -6[ \cup ]6, +\infty[$.'
- titulo: 'Ejemplo 3: Intervalo abierto acotado'
  enunciado: Expresa como intervalo la solución de $|2x| < 8$.
  alternativas:
  - $]-4, 4[$
  - $[-4, 4]$
  - $]-\infty, -4[ \cup ]4, +\infty[$
  - $]0, 4[$
  respuesta: $]-4, 4[$
  solucion_pasos:
  - 'Paso 1: $-8 < 2x < 8 \implies -4 < x < 4$.'
  - 'Paso 2: $S = ]-4, 4[$.'
- titulo: 'Ejemplo 4: Caso sin solución'
  enunciado: ¿Cómo se anota en lenguaje de intervalos la solución de $|x| < -1$?
  alternativas:
  - $S = \emptyset$
  - $S = [0, 0]$
  - $S = ]-\infty, -1[$
  - $S = \mathbb{R}$
  respuesta: $S = \emptyset$
  solucion_pasos:
  - 'Paso 1: No existen soluciones reales.'
  - 'Paso 2: $S = \emptyset$.'
errores_frecuentes:
- La solución de la inecuación $|x| < 4$ expresada como intervalo es $]-\infty, -4[ \cup ]4, +\infty[$.
- Desglosar la desigualdad $|x| \ge 3$ genera el intervalo acotado continuo $[-3, 3]$.
- La solución del tipo disyuntivo $x \le -2$ o $x \ge 5$ se escribe en un único intervalo continuo como $[-2, 5]$.
- Expresar $|x - 1| \le 2$ en notación de intervalo requiere incluir el símbolo de infinito en ambos extremos.
- La unión de dos intervalos disjuntos $]-\infty, -1] \cup [7, +\infty[$ se simplifica a $]-1, 7[$.
afirmaciones_verdaderas:
- Las inecuaciones del tipo $|x| \le k$ generan soluciones en forma de un único intervalo acotado $[-k, k]$.
- Las inecuaciones del tipo $|x| \ge k$ generan soluciones en forma de unión de dos intervalos inconexos $]-\infty, -k] \cup [k, +\infty[$.
al_terminar_debes_poder: '**QUÉ:** Formalizar el conjunto solución de una inecuación con valor absoluto en notación de intervalo.


  **CÓMO:** Expresando el resultado como intervalo simple acotado (tipo menor) o como unión de dos intervalos disjuntos con el símbolo $\cup$ (tipo mayor).


  ![Resumen Expresión de la solución de valor absoluto como intervalo](/static/img/nodos/expresion-de-la-solucion-de-valor-absoluto-como-intervalo-resumen.svg)'
