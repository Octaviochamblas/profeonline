semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.INTERPRETACION_INTERVALO
resumen_inicial: La solución de una inecuación con valor absoluto se resume en notación
  de intervalo acotado o como unión de dos intervalos disjuntos.
explicacion_simple: 'Para presentar la solución final de cualquier inecuación con
  valor absoluto:

  - Las de tipo menor que ($|X| < k$) producen **un único intervalo acotado** como
  $]a, b[$ o $[a, b]$.

  - Las de tipo mayor que ($|X| > k$) producen **la unión de dos intervalos no acotados**
  como $]-\infty, a[ \ \cup \ ]b, +\infty[$.'
explicacion_formal: 'El **mapeo formal de conjuntos solución de valor absoluto a intervalos**
  se clasifica en:


  $$|P(x)| < k \implies S = ]a, b[ \quad (\text{Intervalo acotado continuo})$$

  $$|P(x)| > k \implies S = ]-\infty, a[ \ \cup \ ]b, +\infty[ \quad (\text{Unión
  de intervalos disjuntos})$$'
definiciones_clave: '- **Notación de intervalo en valor absoluto**: Estructuración
  formal de la solución según la naturaleza acotada o separada del operador.'
propiedades_relaciones: '- **Complementariedad**: El conjunto solución de $|P(x)|
  > k$ es el complemento del conjunto solución de $|P(x)| \le k$.'
ejemplo_guiado:
  enunciado: Compara las expresiones de solución como intervalo para $|x| < 3$ y $|x|
    > 3$.
  pasos:
  - 'Paso 1: Para $|x| < 3$: la solución es $-3 < x < 3 \implies S_1 = ]-3, 3[$ (intervalo
    acotado continuo).Paso 2: Para $|x| > 3$: la solución es $x < -3 \lor x > 3 \implies
    S_2 = ]-\infty, -3[ \ \cup \ ]3, +\infty[$ (unión de dos intervalos).Paso 3: Notar
    la complementariedad geométrica entre ambas soluciones.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué formato de intervalo adopta la solución de la inecuación $|x| < 3$?
  choices:
  - text: Un único intervalo acotado $]-3, 3[$.
    is_correct: true
  - text: Una unión de dos intervalos $]-\infty, -3[ \ \cup \ ]3, +\infty[$.
    is_correct: false
  - text: El conjunto vacío.
    is_correct: false
  - text: Un solo punto puntual.
    is_correct: false
  explanation: La alternativa correcta es 'Un único intervalo acotado $]-3, 3[$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué formato de intervalo adopta la solución de la inecuación $|x| > 3$?
  choices:
  - text: La unión de dos intervalos disjuntos $]-\infty, -3[ \ \cup \ ]3, +\infty[$.
    is_correct: true
  - text: Un único intervalo acotado $]-3, 3[$.
    is_correct: false
  - text: Todos los números reales positivos únicamente.
    is_correct: false
  - text: El conjunto vacío.
    is_correct: false
  explanation: La alternativa correcta es 'La unión de dos intervalos disjuntos $]-\infty,
    -3[ \ \cup \ ]3, +\infty[$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver la inecuación de valor absoluto.'
- 'Paso 2: Identificar si dio un intervalo acotado o dos ramas separadas.'
- 'Paso 3: Escribir los límites en corchetes abiertos $]$ ó cerrados $[$.'
- 'Paso 4: Usar $\cup$ si hay dos ramas disjuntas.'
errores_correccion: '- **Error común:** Olvidar el símbolo de unión $\cup$ entre las
  dos ramas de una inecuación $|X| > k$.

  - **Cómo corregirlo:** Si la solución está dividida en dos tramos separados, se
  DEBE colocar la unión $\cup$ entre ambos intervalos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones con valor absoluto.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de valor absoluto.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una inecuación del tipo |X| < k con k > 0 se convierte en la desigualdad
    doble -k < X < k?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de acotamiento de distancias.
- titulo: ¿Es cierto que |P(x)| < -5 no tiene solución en los números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el valor absoluto es siempre mayor o igual a cero ($S = \\emptyset$).
errores_frecuentes:
- Quitar las barras de valor absoluto sin descomponer en la propiedad correspondiente.
- Confundir la propiedad de 'menor que' ($|X| < k \implies -k < X < k$) con la de
  'mayor que' ($|X| > k \implies X < -k \lor X > k$).
- Intentar despejar algebraicamente una inecuación de valor absoluto comparada con
  una constante negativa en vez de usar la lógica inmediata.
- Olvidar colocar el símbolo de unión $\cup$ al unir las dos ramas de una inecuación
  del tipo $|X| > k$.
- Usar corchetes abiertos en la solución de inecuaciones no estrictas de valor absoluto
  ($|X| \le k$).
afirmaciones_verdaderas:
- La inecuación $|X| < k$ con $k > 0$ equivale a la desigualdad acotada $-k < X <
  k$, cuyo conjunto solución es un único intervalo continuo.
- Dado que el valor absoluto es siempre no negativo, la inecuación $|P(x)| < c$ con
  $c < 0$ carece de solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver inecuaciones con
  valor absoluto de tipo menor que, mayor que y comparaciones con constantes negativas.
fuente: Texto escolar MINEDUC — Álgebra / Inecuaciones con Valor Absoluto
