semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.INTERPRETACION_INTERVALO
resumen_inicial: Expresar la solución de una inecuación con valor absoluto como intervalo requiere convertir la desigualdad continua o la unión de regiones a notación de corchetes.
explicacion_simple: |
  Las inecuaciones con valor absoluto dan lugar a dos formas principales de solución:

  1. Para $|x| < k$, los valores quedan atrapados entre $-k$ y $k$, lo que se escribe como el **intervalo acotado** $]-k, k[$.
  2. Para $|x| > k$, los valores se escapan hacia los extremos exteriores, lo que se escribe como la **unión de dos intervalos** $]-\infty, -k[ \cup ]k, +\infty[$.
explicacion_formal: |
  Sea $k > 0$:

  1. $|E(x)| \le k \iff -k \le E(x) \le k \implies S = [-k, k]$ (Intervalo acotado).
  2. $|E(x)| \ge k \iff E(x) \le -k \ \lor \ E(x) \ge k \implies S = ]-\infty, -k] \cup [k, +\infty[$ (Unión de semirrectas).

  **Desglose de la fórmula:**
  - Operador de menor ($\le$): Produce intersección y genera un único intervalo continuo.
  - Operador de mayor ($\ge$): Produce disyunción y genera la unión $\cup$ de dos intervalos disjuntos.
definiciones_clave: |
  - **Notación de intervalo con valor absoluto**: Representación mediante corchetes de los conjuntos de soluciones continuos o disjuntos derivados de desigualdades absolutas.
propiedades_relaciones: |
  - **Forma conjuntiva vs disyuntiva**: Las desigualdades del tipo $<$ producen intervalos acotados; las desigualdades del tipo $>$ producen uniones de semirrectas.
ejemplo_guiado:
  enunciado: Expresa la solución de la inecuación $|x| \ge 4$ en notación de intervalo.
  pasos:
    - 'Paso 1: Aplicar la propiedad disyuntiva para $|x| \ge 4$: $x \le -4 \ \lor \ x \ge 4$.'
    - 'Paso 2: Escribir la primera rama como intervalo: $x \le -4 \implies ]-\infty, -4]$.'
    - 'Paso 3: Escribir la segunda rama como intervalo: $x \ge 4 \implies [4, +\infty[$.'
    - 'Paso 4: Unir ambos intervalos: $S = ]-\infty, -4] \cup [4, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: ¿Cuál es la notación de intervalo correcta para la solución de $|x| \ge 4$?
    choices:
      - {text: '$S = ]-\infty, -4] \cup [4, +\infty[$', is_correct: true}
      - {text: '$S = [-4, 4]$', is_correct: false}
      - {text: '$S = ]-4, 4[$', is_correct: false}
      - {text: '$S = \emptyset$', is_correct: false}
    explanation: La alternativa correcta es '$S = ]-\infty, -4] \cup [4, +\infty[$'.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: ¿Cuál es la notación de intervalo correcta para la solución de $|x| < 3$?
    choices:
      - {text: '$S = ]-3, 3[$', is_correct: true}
      - {text: '$S = ]-\infty, -3[ \cup ]3, +\infty[$', is_correct: false}
      - {text: '$S = [-3, 3]$', is_correct: false}
      - {text: '$S = ]0, 3[$', is_correct: false}
    explanation: La alternativa correcta es '$S = ]-3, 3[$'. Es un intervalo acotado abierto.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Resolver las inecuaciones lineales resultantes del desglose del valor absoluto.'
  - 'Paso 2: Determinar si las ramas forman un único intervalo ($<, \le$) o una unión de intervalos ($>, \ge$).'
  - 'Paso 3: Asignar corchetes abiertos ($<, >$) o cerrados ($\le, \ge$).'
  - 'Paso 4: Redactar la expresión final en notación de intervalos.'
errores_correccion: |
  - **Error común:** Escribir un único intervalo $[-4, 4]$ para una inecuación de mayor que $|x| \ge 4$.
  - **Cómo corregirlo:** Recuerda que las desigualdades con mayor que ($>$) se abren hacia los extremos exteriores, requiriendo el símbolo de unión $\cup$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de inecuaciones con valor absoluto.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de inecuaciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La solución de la inecuación $|x| < 4$ expresada como intervalo es $]-\infty, -4[ \cup ]4, +\infty[$.'
  - 'Desglosar la desigualdad $|x| \ge 3$ genera el intervalo acotado continuo $[-3, 3]$.'
  - 'La solución del tipo disyuntivo $x \le -2$ o $x \ge 5$ se escribe en un único intervalo continuo como $[-2, 5]$.'
  - 'Expresar $|x - 1| \le 2$ en notación de intervalo requiere incluir el símbolo de infinito en ambos extremos.'
  - 'La unión de dos intervalos disjuntos $]-\infty, -1] \cup [7, +\infty[$ se simplifica a $]-1, 7[$.'
afirmaciones_verdaderas:
  - 'Las inecuaciones del tipo $|x| \le k$ generan soluciones en forma de un único intervalo acotado $[-k, k]$.'
  - 'Las inecuaciones del tipo $|x| \ge k$ generan soluciones en forma de unión de dos intervalos inconexos $]-\infty, -k] \cup [k, +\infty[$.'
al_terminar_debes_poder: |
  QUÉ: Traducir y expresar las soluciones de inecuaciones con valor absoluto en notación formal de intervalos.
  CÓMO: Asociar formas conjuntivas ($|x| < k$) a intervalos acotados y formas disyuntivas ($|x| > k$) a la unión de dos semirrectas.
