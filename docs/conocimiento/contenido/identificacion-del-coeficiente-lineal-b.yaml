semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_B
resumen_inicial: El coeficiente lineal $b$ es el número real (con su signo) que multiplica
  a la incógnita elevada a la primera potencia ($x$).
explicacion_simple: "Para identificar el **coeficiente lineal $b$**:\n- Busca el término\
  \ que contiene a la $x$ simple (sin exponente elevado).\n- El número con su signo\
  \ que acompaña a $x$ es $b$.\n- Ejemplos:\n  - En $2x^2 + 8x - 5 = 0 \\implies b\
  \ = 8$.\n  - En $4x^2 - x + 9 = 0 \\implies b = -1$.\n  - En $3x^2 - 16 = 0 \\implies\
  \ b = 0$ (si no aparece el término con $x$, el coeficiente es $0$)."
explicacion_formal: 'En la expresión $a x^2 + b x + c$, el coeficiente $b$ es el **factor
  lineal multiplicativo** del polinomio de grado 1:


  $$b \in \mathbb{R} \quad \text{tal que } b x = P_1(x)$$


  **Desglose de la fórmula:**

  - Si la ecuación carece de término de grado 1 en su forma reducida $\implies b =
  0$.'
definiciones_clave: '- **Coeficiente lineal ($b$)**: Número real que multiplica al
  monomio de primer grado $x^1$.'
propiedades_relaciones: '- **Anulación de $b$**: Cuando $b = 0$, la ecuación se denomina
  incompleta pura o binomia pura.'
ejemplo_guiado:
  enunciado: Identifica el coeficiente lineal $b$ en la ecuación $5x^2 - x = 12$.
  pasos:
  - 'Paso 1: Igualar a cero trasponiendo el 12: $5x^2 - x - 12 = 0$.Paso 2: Localizar
    el término de primer grado con la variable $x$: $-x$.Paso 3: Interpretar $-x$
    como $(-1) \cdot x$.Paso 4: Concluir que el coeficiente lineal es $b = -1$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la ecuación $5x^2 - x - 12 = 0$, ¿cuál es el valor del coeficiente
    lineal $b$?
  choices:
  - text: $b = -1$
    is_correct: true
  - text: $b = 5$
    is_correct: false
  - text: $b = -12$
    is_correct: false
  - text: $b = 0$
    is_correct: false
  explanation: La alternativa correcta es '$b = -1$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la ecuación cuadrática $3x^2 - 16 = 0$, ¿cuál es el valor del coeficiente
    lineal $b$?
  choices:
  - text: $b = 0$, porque no existe término con $x$.
    is_correct: true
  - text: $b = -16$
    is_correct: false
  - text: $b = 3$
    is_correct: false
  - text: $b = 1$
    is_correct: false
  explanation: La alternativa correcta es '$b = 0$, porque no existe término con $x$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asegurar que la ecuación esté ordenada e igualada a cero.'
- 'Paso 2: Ubicar el término que contiene la variable $x$ a la primera potencia.'
- 'Paso 3: Extraer el valor numérico con su signo correspondiente.'
- 'Paso 4: Si el término no aparece en la ecuación reducida, asignar $b = 0$.'
errores_correccion: '- **Error común:** Confundir el coeficiente lineal $b$ con el
  término independiente $c$.

  - **Cómo corregirlo:** El coeficiente $b$ acompaña SIEMPRE a la letra $x$. El término
  $c$ es un número suelto sin letra $x$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
