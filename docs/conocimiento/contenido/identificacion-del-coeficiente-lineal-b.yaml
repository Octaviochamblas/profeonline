semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_B
resumen_inicial: 'Identificación del coeficiente lineal b: concepto, discriminante,
  soluciones y modelamiento en Conceptos y formas de la ecuación cuadrática.'
explicacion_simple: El coeficiente $b$ es el número que acompaña al término con $x$
  elevado a la primera potencia, distinto del término cuadrático y del término constante.
explicacion_formal: '### Definición formal


  En la forma general $ax^2+bx+c=0$, el coeficiente $b$ es el número real que multiplica
  al término de primer grado, $x$. A diferencia de $a$, no existe restricción sobre
  su valor: $b$ puede ser cualquier número real, incluido cero.


  ### Desarrollo didáctico


  Para identificar $b$, se localiza el término con $x$ elevado a la primera potencia
  (sin exponente visible) y se lee el número que lo multiplica, respetando su signo.
  Si ese término no aparece explícitamente, $b=0$.


  En $2x^2-7x+3=0$, el coeficiente $b$ es $-7$. En $5x^2+9=0$, no hay término lineal,
  por lo que $b=0$.'
definiciones_clave: '- **Identificación del coeficiente lineal b**: Elemento o técnica
  fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en identificación
  del coeficiente lineal b.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando identificación del
    coeficiente lineal b.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a identificación del coeficiente
    lineal b.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
