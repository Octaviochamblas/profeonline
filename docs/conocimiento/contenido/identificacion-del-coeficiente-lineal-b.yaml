semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_B
resumen_inicial: La identificación del coeficiente lineal $b$ reconoce el valor numérico (con su signo) que multiplica a la potencia de primer grado $x^1$.
explicacion_simple: |
  El **coeficiente lineal $b$** es el número que acompaña y multiplica a la variable $x$ de primer grado (elevada a 1):

  - En $2x^2 + 7x - 5 = 0$, el coeficiente lineal es $b = 7$.
  - En $4x^2 - x + 3 = 0$, el término $-x$ tiene coeficiente implícito $b = -1$.
  - En $3x^2 - 9 = 0$, **no hay término con $x$**; por lo tanto, el coeficiente lineal es $b = 0$.
  - **Igual que con $a$**: El coeficiente $b$ **ES SOLO EL NÚMERO**, sin la letra $x$.
explicacion_formal: |
  Dada la ecuación cuadrática reducida $ax^2 + bx + c = 0$, el **coeficiente lineal $b$** es el multiplicador o escalar del término de primer grado:

  $$b = \text{coef}(x^1) \in \mathbb{R}$$

  **Propiedades de presencia:**
  - Si $b \neq 0$, la ecuación posee término lineal explícito.
  - Si $b = 0$, la ecuación adopta la forma incompleta pura o monomia $ax^2 + c = 0$, lo que implica que el eje de simetría de la parábola asociada coincide con el eje $Y$.
definiciones_clave: |
  - **Coeficiente lineal $b$**: Factor numérico constante que multiplica a la incógnita de primer grado $x$.
propiedades_relaciones: |
  - **Relación con la suma de raíces (Vieta)**: En toda ecuación cuadrática con raíces reales $x_1$ y $x_2$, el coeficiente $b$ determina la suma de las soluciones mediante la fórmula $x_1 + x_2 = -\frac{b}{a}$.
ejemplo_guiado:
  enunciado: 'Identifica el coeficiente lineal $b$ en las ecuaciones: a) $5x^2 - \frac{x}{2} + 4 = 0$, b) $x^2 - 16 = 0$.'
  pasos:
    - 'Paso 1: Para $5x^2 - \frac{x}{2} + 4 = 0$, reescribir $-\frac{x}{2}$ como $-\frac{1}{2} \cdot x$.'
    - 'Paso 2: Concluir que el coeficiente lineal es $b = -\frac{1}{2}$.'
    - 'Paso 3: Para $x^2 - 16 = 0$, notar la ausencia del término con $x$.'
    - 'Paso 4: Concluir que al no existir término lineal, el coeficiente es $b = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor del coeficiente lineal $b$ en la ecuación $6x^2 - x + 11 = 0$?'
    choices:
      - {text: '$b = -1$', is_correct: true}
      - {text: '$b = 1$', is_correct: false}
      - {text: '$b = 6$', is_correct: false}
      - {text: '$b = -x$', is_correct: false}
    explanation: 'La alternativa correcta es ''$b = -1$''. El término $-x$ tiene como factor numérico implícito $-1$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el coeficiente lineal $b$ en la ecuación incompleta pura $4x^2 - 25 = 0$?'
    choices:
      - {text: '$b = 0$', is_correct: true}
      - {text: '$b = -25$', is_correct: false}
      - {text: '$b = 4$', is_correct: false}
      - {text: '$b = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$b = 0$''. Al no figurar el término de primer grado $x$, su coeficiente vale $0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reducir y transponer la ecuación cuadrática a la forma general $ax^2 + bx + c = 0$.'
  - 'Paso 2: Buscar el término algebraico que contiene la incógnita elevada a la primera potencia ($x$).'
  - 'Paso 3: Si el término existe, extraer el factor numérico que lo multiplica incluyendo su signo.'
  - 'Paso 4: Si el término con $x$ no aparece en la ecuación reducida, asignar $b = 0$.'
errores_correccion: |
  - **Error común:** Confundir el coeficiente lineal $b$ con el término independiente $c$ cuando la ecuación está desordenada.
  - **Cómo corregirlo:** El coeficiente $b$ **SIEMPRE MULTIPLICA A LA $x$**; el término $c$ es el número solo sin variable.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Coeficiente lineal negativo.
    alternativas:
      - '$b = -7$'
      - '$b = 7$'
      - '$b = -7x$'
    respuesta: '$b = -7$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Coeficiente nulo en ecuación pura.
    alternativas:
      - '$b = 0$'
      - '$b = 1$'
      - '$b = -9$'
    respuesta: '$b = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En la ecuación $3x^2 - 8x + 2 = 0$, el coeficiente lineal es la expresión completa $-8x$.'
  - 'En la ecuación $x^2 - 9 = 0$, el coeficiente lineal $b$ es igual a $-9$.'
  - 'Si el coeficiente lineal $b = 0$, la ecuación se anula y deja de tener soluciones reales.'
  - 'El coeficiente lineal $b$ debe ser siempre un número entero diferente de cero.'
  - 'En la expresión desordenada $4 + 2x^2 - 5x = 0$, el coeficiente $b$ es la constante inicial $4$.'
afirmaciones_verdaderas:
  - 'El coeficiente lineal $b$ es el multiplicador constante de la variable de primer grado $x$, pudiendo valer cero en ecuaciones incompletas.'
  - 'En ecuaciones de la forma $ax^2 - x + c = 0$ y $ax^2 + c = 0$, el coeficiente $b$ toma los valores $-1$ y $0$ respectivamente.'
al_terminar_debes_poder: |
  QUÉ: Identificar y extraer correctamente el coeficiente lineal $b$ en ecuaciones de segundo grado.
  CÓMO: Ubicar el término de primer grado $x$, separar el factor numérico constante con su signo o asignar $b = 0$ si este término ausenta.
