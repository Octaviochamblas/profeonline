semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_B
resumen_inicial: El coeficiente lineal $b$ es la constante numérica real que multiplica a la incógnita de primer grado ($x$) en la forma general $ax^2 + bx + c = 0$, siendo $b = 0$ si el término lineal no está presente.
explicacion_simple: '![El coeficiente lineal $b$ es la constante numérica real que multiplica a la incógnita de primer grado ($x$) en la forma general $ax^2 + bx + c = 0$, siendo $b = 0$ si el término lineal no está presente](/static/img/nodos/identificacion-del-coeficiente-lineal-b-intro.svg)



  El **coeficiente lineal $b$** es el número que acompaña a la $x$ con exponente 1 ($x^1$ o simplemente $x$):

  - En $3x^2 + 7x - 4 = 0$, el coeficiente lineal es **$b = 7$**.

  - En $2x^2 - 9x + 5 = 0$, el coeficiente lineal es **$b = -9$** (¡lleva el signo menos!).

  - Si ves solo $+x$, entonces **$b = 1$**; si ves $-x$, entonces **$b = -1$**.

  - **¡Atención!** Si en la ecuación NO aparece ninguna $x$ suelta (por ejemplo en $5x^2 - 20 = 0$), significa que **$b = 0$**.'
explicacion_formal: 'En la forma canónica $ax^2 + bx + c = 0$, el coeficiente lineal $b$ corresponde a la primera derivada evaluada en el origen:

  $$b = P''(0) \in \mathbb{R}$$


  **Propiedades algebraicas y geométricas:**

  - **Eje de simetría de la parábola**: La recta vertical que divide simétricamente a la gráfica es $x_v = -\frac{b}{2a}$. Si $b = 0$, el eje de simetría es exactamente el eje $Y$ ($x = 0$).

  - **Suma de las raíces (Relaciones de Cardano-Vieta)**: La suma de las soluciones de la ecuación cuadrática satisface $x_1 + x_2 = -\frac{b}{a}$.

  - **Pendiente en el corte con el eje Y**: $b$ representa la pendiente de la recta tangente a la parábola en el punto de intercepto $(0, c)$.'
definiciones_clave: '- **Coeficiente lineal $b$**: Factor constante que multiplica a la incógnita en grado 1.

  - **Ecuación pura**: Ecuación cuadrática donde el coeficiente lineal es nulo ($b = 0$).'
propiedades_relaciones: '- **Simetría de raíces**: Si $b = 0$ y existen soluciones reales, estas son números opuestos simétricos ($x_1 = -x_2$).

  - **Traslación horizontal**: El valor de $b$ determina el desplazamiento horizontal del vértice respecto al eje de ordenadas.'
ejemplo_guiado:
  enunciado: '![Ejemplo El coeficiente lineal $b$ es la constante numérica real que multiplica a la incógnita de primer grado ($x$) en la forma general $ax^2 + bx + c = 0$, siendo $b = 0$ si el término lineal no está presente](/static/img/nodos/identificacion-del-coeficiente-lineal-b-ejemplos.svg)



    Determina el coeficiente lineal $b$ en las siguientes ecuaciones:

    1) $4x^2 - x + 11 = 0$

    2) $3x^2 - 27 = 0$

    3) $x(2x - 5) = 8$'
  pasos:
  - 'Paso 1: En $4x^2 - x + 11 = 0$: el término lineal es $-1x \implies b = -1$.'
  - 'Paso 2: En $3x^2 - 27 = 0$: no figura término en $x$, por lo que $b = 0$.'
  - 'Paso 3: En $x(2x - 5) = 8$: desarrollar $2x^2 - 5x - 8 = 0 \implies$ el término lineal es $-5x \implies b = -5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto vale el coeficiente lineal b en la ecuación cuadrática $2x^2 - 18 = 0$?
  choices:
  - text: b = 0
    is_correct: true
  - text: b = -18
    is_correct: false
  - text: b = 2
    is_correct: false
  - text: b = 1
    is_correct: false
  explanation: La alternativa correcta es 'b = 0'. Al no figurar término en $x$, su coeficiente es cero ($0x$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la ecuación $6x^2 - x - 2 = 0$, ¿cuál es el valor de b?
  choices:
  - text: b = -1
    is_correct: true
  - text: b = 1
    is_correct: false
  - text: b = -x
    is_correct: false
  - text: b = 6
    is_correct: false
  explanation: La alternativa correcta es 'b = -1'. El monomio $-x$ tiene coeficiente numérico $-1$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Llevar la ecuación a su forma canónica reducida $ax^2 + bx + c = 0$.'
- 'Paso 2: Buscar el término que contiene la variable $x$ con exponente 1.'
- 'Paso 3: Extraer su coeficiente numérico con su signo algebraico.'
- 'Paso 4: Si dicho término no figura en la ecuación reducida, asignar $b = 0$.'
errores_correccion: '- **Error común:** Decir que en $x^2 - 9 = 0$ el coeficiente es $b = -9$.

  - **Cómo corregirlo:** $-9$ no tiene $x$, por lo que es el **término independiente $c = -9$**; como no hay término con $x$, **$b = 0$**.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficiente lineal negativo explícito'
  enunciado: ¿Cuál es el valor de b en $5x^2 - 8x + 3 = 0$?
  alternativas:
  - '-8'
  - '8'
  - '5'
  - -8x
  respuesta: '-8'
  solucion_pasos:
  - 'Paso 1: El término lineal es $-8x$, por lo tanto $b = -8$.'
- titulo: 'Ejemplo 2: Ecuación sin término lineal'
  enunciado: En $4x^2 - 100 = 0$, ¿cuánto vale b?
  alternativas:
  - '0'
  - '-100'
  - '4'
  - '10'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: No hay término con $x$, por lo que $b = 0$.'
- titulo: 'Ejemplo 3: Coeficiente lineal fraccionario'
  enunciado: En $x^2 + \frac{3}{7}x - 2 = 0$, ¿cuánto vale b?
  alternativas:
  - 3/7
  - '-2'
  - '1'
  - 7/3
  respuesta: 3/7
  solucion_pasos:
  - 'Paso 1: El factor de $x$ es la fracción $\frac{3}{7}$.'
- titulo: 'Ejemplo 4: Ecuación desordenada'
  enunciado: En $7 - 4x + 3x^2 = 0$, ¿cuánto vale b?
  alternativas:
  - '-4'
  - '7'
  - '3'
  - '4'
  respuesta: '-4'
  solucion_pasos:
  - 'Paso 1: El término lineal es $-4x$, luego $b = -4$.'
errores_frecuentes:
- Confundir el término independiente c con el coeficiente lineal b.
- Olvidar que b puede valer cero en ecuaciones incompletas puras.
- Incluir la incógnita x en el valor numérico de b.
afirmaciones_verdaderas:
- El coeficiente lineal b es el número real que acompaña a x en la forma general.
- Si una ecuación cuadrática no tiene término lineal, entonces b = 0.
al_terminar_debes_poder: '**QUÉ:** Identificar y extraer con exactitud el coeficiente lineal b de una ecuación cuadrática.


  **CÓMO:** Localizando el monomio de grado 1 en la forma canónica y reconociendo b = 0 ante su ausencia.


