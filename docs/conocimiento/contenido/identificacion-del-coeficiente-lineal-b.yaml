procedimiento:
- 'Paso 1: Ordena la ecuación en forma general si aún no lo está.'
- 'Paso 2: Localiza el término con $x$ elevado a la primera potencia.'
- 'Paso 3: Lee el número que lo multiplica, incluyendo su signo; si no aparece ese
  término, $b=0$.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en identificación del coeficiente lineal b.
ejemplos:
- titulo: Identificación directa del coeficiente b
  enunciado: Identifica el coeficiente $b$ en $4x^2+11x-2=0$.
  solucion_pasos:
  - El término lineal es $11x$.
  - $b=11$.
- titulo: Identificación de coeficiente b nulo
  enunciado: Identifica el coeficiente $b$ en $6x^2-24=0$.
  solucion_pasos:
  - No hay término con $x$ a la primera potencia.
  - $b=0$.
- titulo: ¿El coeficiente $b$ debe ser distinto de cero para que la ecuación sea cuadrática?
  enunciado: ¿El coeficiente $b$ debe ser distinto de cero para que la ecuación sea
    cuadrática?
  respuesta: 'No'
  solucion_pasos:
  - Solo se exige que $a$ sea distinto de cero; $b$ puede valer cero sin afectar el
    carácter cuadrático.
- titulo: ¿El signo del coeficiente $b$ se determina por el signo del término que
    acompaña?
  enunciado: ¿El signo del coeficiente $b$ se determina por el signo del término que
    acompaña?
  respuesta: Sí
  solucion_pasos:
  - El signo que precede al término lineal forma parte del coeficiente $b$.
errores_frecuentes:
- Olvidar identificar $b=0$ cuando el término lineal no aparece explícitamente en
  la ecuación.
- Confundir el coeficiente $b$ con el coeficiente $a$ o con el término independiente
  $c$.
- Omitir el signo negativo del término lineal al leer el coeficiente $b$.
- No reordenar la ecuación antes de identificar $b$, tomando por error otro término.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando identificación
  del coeficiente lineal b.
