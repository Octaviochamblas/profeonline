procedimiento:
- 'Paso 1: Identificar la estructura y los datos dados para detección de solución
  extraña por restricción del denominador.'
- 'Paso 2: Aplicar la regla de resolución o eliminación correspondiente a detección
  de solución extraña por restricción del denominador.'
- 'Paso 3: Obtener la solución de la incógnita y verificar su validez en la ecuación
  original.'
errores_correccion: Al resolver detección de solución extraña por restricción del
  denominador, evita trasponer términos sin cambiar su signo.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Resuelve la ecuación $4x = 20$.
  alternativas:
  - x = 5
  - x = 1
  - x = 2
  respuesta: x = 5
  solucion_pasos:
  - 'Dividir entre 4: $x = \frac{20}{4} = 5$.'
- titulo: Ejemplo 2
  enunciado: Despeja x en $x - 5 = 12$.
  alternativas:
  - x = 17
  - x = 7
  - x = 12
  respuesta: x = 17
  solucion_pasos:
  - 'Sumar 5 a ambos lados: $x = 12 + 5$.'
- titulo: ¿Sumar el mismo número a ambos miembros conserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la propiedad aditiva fundamental de las igualdades.
- titulo: ¿Un sistema de ecuaciones sin solución se grafica como rectas secantes?
  respuesta: 'No'
  solucion_pasos:
  - No, las rectas secantes tienen solución única; las paralelas no tienen solución.
errores_frecuentes:
- Omitir cambiar el signo de un término al trasponerlo al otro miembro.
- Multiplicar o dividir por una expresión literal que puede ser igual a cero.
- Aceptar soluciones extrañas en ecuaciones fraccionarias.
- Declarar la solución de un sistema 2x2 con una sola incógnita aislada.
- No verificar el resultado en las ecuaciones originales.
afirmaciones_verdaderas:
- Las operaciones inversas aplicadas en ambos miembros conservan la equivalencia de
  la ecuación.
- La solución de un sistema 2x2 representa la intersección de sus rectas componentes.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver y plantear problemas
  de detección de solución extraña por restricción del denominador con rigor.
