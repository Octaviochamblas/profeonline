procedimiento:
- Obtén tu solución numérica tras resolver la ecuación plana.
- Revísala contra la 'lista de restricciones del dominio' de restricciones que calculaste
  al principio.
- Si coincide con una restricción, declárala como solución extraña y descártala.
- Si no coincide, es una solución válida.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en detección de solución extraña por restricción del denominador.
ejemplos:
