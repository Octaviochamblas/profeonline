semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.SOLUCION_EXTRANEA
resumen_inicial: 'Detección de solución extraña por restricción del denominador: propiedades,
  resolución y modelamiento en Ecuaciones fraccionarias de primer grado.'
explicacion_simple: Pero resulta que al principio del problema, tú habías anotado
  que la restricción era $x \neq 5$.
explicacion_formal: '### Definición formal


  Una solución $x=k$ obtenida al resolver la ecuación polinomial resultante (tras
  eliminar denominadores) es extraña si $k$ anula algún denominador de la ecuación
  fraccionaria original; en tal caso debe descartarse aunque satisfaga la ecuación
  polinomial transformada, pues no pertenece al dominio de la ecuación de partida.


  ### Desarrollo didáctico


  Pero resulta que al principio del problema, tú habías anotado que la restricción
  era $x \neq 5$.


  Ese resultado $x=5$ se llama **solución extraña** o espuria. Se generó como un efecto
  secundario al multiplicar toda la ecuación por polinomios (el MCM) que escondían
  un cero. Es como un espejismo. La solución no sirve. Si era la única que obtuviste,
  la respuesta final es: **No hay solución** (Conjunto Vacío).'
definiciones_clave: '- **Detección de solución extraña por restricción del denominador**:
  Herramienta matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a detección de solución extraña por restricción
  del denominador.'
