semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.SOLUCION_EXTRANEA
resumen_inicial: Una solución extraña es un valor algebraico obtenido al resolver la ecuación entera que anula algún denominador
  de la ecuación fraccionaria original, debiendo ser descartada.
explicacion_simple: 'Al multiplicar una ecuación fraccionaria por el m.c.m. de sus denominadores, se transforma la igualdad
  en una ecuación entera.


  Sin embargo, esta manipulación algebraica puede introducir falsas soluciones denominadas **soluciones extrañas**.


  Una solución extraña es aquel valor numérico que resuelve perfectamente la ecuación entera simplificada, pero que al sustituirse
  en la ecuación fraccionaria original provoca una división por cero (anula algún denominador).


  Por esta razón, siempre debemos contrastar los candidatos obtenidos contra las restricciones del dominio: todo valor prohibido
  se descarta inmediatamente del conjunto solución ($S$).


  ![Detección de solución extraña](/static/img/nodos/deteccion-de-solucion-extrana-por-restriccion-del-denominador-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada una ecuación fraccionaria con conjunto de valores prohibidos $V_p = \{x \in \mathbb{R} \mid \exists i : Q_i(x) = 0\}$
  y sea $x = c$ una raíz obtenida tras resolver la ecuación entera enterizada por multiplicación por $M(x)$:


  $$\text{Si } c \in V_p \implies c \notin \operatorname{Dom} \implies c \text{ es una solución extraña}$$


  $$S = \{c \in \mathbb{R} \mid c \text{ satisface la ecuación enterizada}\} \setminus V_p$$


  ### Desglose de la fórmula

  - $c \in V_p$: El candidato anula al menos un denominador original $Q_i(c) = 0$.

  - $S = \emptyset$: Si la única raíz obtenida resulta ser una solución extraña, la ecuación carece de solución real (es incompatible).


  ### Síntesis didáctica

  Multiplicar por una expresión algebraica $M(x)$ que contiene a la variable no es una operación estrictamente equivalente
  para los valores donde $M(x) = 0$, lo que genera soluciones espurias que deben ser filtradas.

  '
definiciones_clave: '- **Solución extraña**: Valor que satisface la ecuación polinomial entera resultante pero anula un denominador
  de la ecuación fraccionaria original.

  - **Ecuación incompatible**: Ecuación cuyo conjunto solución es el conjunto vacío ($S = \emptyset$) al descartarse todas
  sus soluciones candidatas.

  '
propiedades_relaciones: '- **No equivalencia en raíces del m.c.m.**: Multiplicar por $M(x)$ introduce como candidatos a todas
  las raíces de $M(x) = 0$.

  - **Invalidez de división por cero**: Ninguna operación matemática puede validar una fracción con denominador nulo en $\mathbb{R}$.

  '
ejemplo_guiado:
  enunciado: Resuelve la ecuación fraccionaria $\frac{x}{x - 3} = \frac{3}{x - 3} + 2$, establece las restricciones de dominio,
    detecta si existe alguna solución extraña y determina el conjunto solución $S$.
  imagen: /static/img/nodos/deteccion-de-solucion-extrana-por-restriccion-del-denominador-ejemplos.svg
  pasos:
  - 'Paso 1: Establecer la restricción de dominio: el denominador $x - 3 \neq 0 \implies x \neq 3$, por lo que $V_p = \{3\}$.'
  - 'Paso 2: Multiplicar ambos miembros por el m.c.m. $(x - 3)$: $x = 3 + 2(x - 3)$.'
  - 'Paso 3: Aplicar la propiedad distributiva: $x = 3 + 2x - 6 \implies x = 2x - 3$.'
  - 'Paso 4: Trasponer términos semejantes: $3 = 2x - x \implies x = 3$.'
  - 'Paso 5: Contrastar el candidato $x = 3$ con la restricción $V_p = \{3\}$: puesto que $3 \in V_p$, el valor $x = 3$ anula
    los denominadores y constituye una solución extraña.'
  - 'Paso 6: Descartar la solución extraña y concluir que la ecuación no tiene solución real: $S = \emptyset$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué debe descartarse un valor candidato $x = c$ que anula un denominador de la ecuación original?
  choices:
  - text: Porque la división por cero no está definida en $\mathbb{R}$, convirtiéndola en una solución extraña.
    is_correct: true
  - text: Porque las soluciones deben ser obligatoriamente números pares.
    is_correct: false
  - text: Porque el m.c.m. solo admite números primos como soluciones.
    is_correct: false
  - text: Porque la ecuación se transforma en una identidad cuadrática.
    is_correct: false
  explanation: La alternativa correcta es 'Porque la división por cero no está definida en $\mathbb{R}$, convirtiéndola en
    una solución extraña.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la ecuación $\frac{x}{x - 3} = \frac{3}{x - 3} + 2$, tras descartar la solución extraña $x = 3$, ¿cuál es
    su conjunto solución $S$?
  choices:
  - text: $S = \emptyset$ (sin solución)
    is_correct: true
  - text: $S = \{3\}$
    is_correct: false
  - text: $S = \{0\}$
    is_correct: false
  - text: $S = \mathbb{R}$
    is_correct: false
  explanation: La alternativa correcta es '$S = \emptyset$ (sin solución)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar y listar los valores prohibidos que anulan cualquier denominador de la ecuación inicial ($V_p$).'
- 'Paso 2: Multiplicar la ecuación por el m.c.m. de los denominadores para obtener la ecuación entera.'
- 'Paso 3: Resolver algebraicamente la ecuación entera y determinar los valores candidatos para la incógnita.'
- 'Paso 4: Comparar cada candidato con el conjunto de valores prohibidos $V_p$.'
- 'Paso 5: Descartar cualquier candidato que pertenezca a $V_p$ como solución extraña y definir el conjunto solución legítimo
  $S$.'
errores_correccion: '- **Error 1:** Aceptar como solución válida un valor que anula un denominador de la ecuación fraccionaria
  inicial. **Cómo corregirlo:** Toda raíz que coincida con un valor prohibido **ES UNA SOLUCIÓN EXTRAÑA Y DEBE SER DESCARTADA
  DEL CONJUNTO SOLUCIÓN ($S = \emptyset$)**.

  - **Error 2:** Descartar soluciones válidas confundiéndolas con valores prohibidos del numerador. **Cómo corregirlo:** Solo
  se descartan valores que **ANULEN LOS DENOMINADORES; SI UN VALOR ANULA EL NUMERADOR PERO NO EL DENOMINADOR, ES UNA SOLUCIÓN
  TOTALMENTE VÁLIDA**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al resolver $\frac{x}{x - 3} = \frac{3}{x - 3} + 2$, se obtiene algebraicamente $x = 3$. ¿Cuál es el conjunto
    solución real?
  alternativas:
  - $S = \emptyset$
  - $S = \{3\}$
  - $S = \{0\}$
  respuesta: $S = \emptyset$
  solucion_pasos:
  - '1. Restricción: $x \neq 3$.'
  - 2. El candidato obtenido es $x = 3$.
  - 3. Como anula el denominador, es una solución extraña $\implies S = \emptyset$.
- titulo: Ejemplo 2
  enunciado: Resuelve la ecuación $\frac{2x}{x - 2} = \frac{4}{x - 2} + 1$.
  alternativas:
  - No tiene solución ($S = \emptyset$) por solución extraña $x = 2$
  - Solución única $x = 2$
  - Solución $x = 4$
  respuesta: No tiene solución ($S = \emptyset$) por solución extraña $x = 2$
  solucion_pasos:
  - '1. Restricción: $x \neq 2$.'
  - '2. Multiplicar por $(x - 2)$: $2x = 4 + (x - 2) \implies 2x = x + 2 \implies x = 2$.'
  - 3. Al ser $x = 2$ un valor prohibido, se descarta $\implies S = \emptyset$.
- titulo: Solución no prohibida
  enunciado: ¿Si una ecuación con restricción $x \neq 3$ entrega como solución $x = 5$, la solución es legítima?
  respuesta: Sí
  solucion_pasos:
  - Sí, pues $5 \neq 3$ y pertenece al dominio permitido.
- titulo: Candidato nulo
  enunciado: ¿Un candidato $x = 0$ que no anula ningún denominador puede ser una solución válida?
  respuesta: Sí
  solucion_pasos:
  - Sí, el cero es un número real admisible si ningún denominador es $x = 0$.
errores_frecuentes:
- Aceptar como solución válida una raíz candidata que anula algún denominador de la ecuación fraccionaria original.
- Concluir que el conjunto solución es $S = \{c\}$ en lugar de $S = \emptyset$ tras descartar la solución extraña.
- Descartar una solución válida como $x = 0$ confundiéndola con una indeterminación de división por cero.
- Evaluar la validez de la solución únicamente en la ecuación entera multiplicada por el m.c.m. en lugar de en la ecuación
  fraccionaria original.
- Asumir que toda ecuación fraccionaria posee obligatoriamente soluciones extrañas.
afirmaciones_verdaderas:
- Una solución extraña satisface la ecuación entera enterizada pero anula algún denominador de la ecuación fraccionaria inicial.
- Si todas las soluciones candidatas resultan ser soluciones extrañas, el conjunto solución de la ecuación es vacío ($S =
  \emptyset$).
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/deteccion-de-solucion-extrana-por-restriccion-del-denominador-resumen.svg)


  QUÉ: Detectar y descartar soluciones extrañas en ecuaciones fraccionarias de primer grado.

  CÓMO: Contrastar los valores numéricos obtenidos contra el conjunto de valores prohibidos $V_p$ y declarar el conjunto solución
  legítimo $S$, distinguiendo casos de inconsistencia $S = \emptyset$.

  '
