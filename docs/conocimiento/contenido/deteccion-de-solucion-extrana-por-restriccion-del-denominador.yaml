    efecto secundario al multiplicar toda la ecuación por polinomios (el MCM) que
    escondían un cero. Es como un espejismo. La solución no sirve. Si era la única
    que obtuviste, la respuesta final es: **No hay solución** (Conjunto Vacío).'
  - Obtén tu solución numérica tras resolver la ecuación plana.
- titulo: $x=5$
  enunciado: Determina qué debe hacerse en $x=5$ y fundamenta cada transformación.
  solucion_pasos:
  - A veces, la matemática te juega una broma. Realizas todos los pasos perfectos
    para resolver una ecuación fraccionaria, aplanas los denominadores, resuelves,
    y obtienes $x=5$.
  - Revísala contra la 'lista de restricciones del dominio' de restricciones que calculaste
