semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.PARAMETRO_BASE
resumen_inicial: 'La identificación de la base $b$ en la función exponencial $f(x) = a \cdot b^x$ determina unívocamente la monotonía del modelo: si $b > 1$ la función es estrictamente creciente (crecimiento exponencial) y si $0 < b < 1$ es estrictamente decreciente (decaimiento exponencial).'
explicacion_simple: "![La identificación de la base $b$ en la función exponencial $f(x) = a \\cdot b^x$ determina unívocamente la monotonía del modelo: si $b > 1$ la función es estrictamente creciente (crecimiento exponencial) y si $0 < b < 1$ es estrictamente decreciente (decaimiento exponencial)](/static/img/nodos/identificacion-de-la-base-b-en-la-funcion-exponencial-intro.svg)\n\n\nLa **base $b$** es el motor que decide hacia dónde viaja la curva exponencial:\n\n- **Caso 1: Si $b > 1$ (ej: $2^x, 3^x, (1,5)^x$):**\n  - Es una curva de **CRECIMIENTO EXPONENCIAL**.\n  - La gráfica sube cada vez más empinada hacia la derecha ($\\nearrow$).\n  - Modela poblaciones de bacterias, propagación de virus o intereses compuestos.\n- **Caso 2: Si $0 < b < 1$ (ej: $(0,5)^x, (1/3)^x, (0,8)^x$):**\n  - Es una curva de **DECAIMIENTO EXPONENCIAL**.\n  - La gráfica cae hacia la derecha acercándose al suelo ($\\searrow$).\n  - Modela desintegración radiactiva, enfriamiento de un café o pérdida de valor de\
  \ un auto."
explicacion_formal: "Sea $f(x) = a \\cdot b^x$ con $a > 0$ y $b \\in \\mathbb{R}^+ \\setminus \\{1\\}$. La derivada de primer orden es:\n$$f'(x) = a \\ln(b) b^x$$\n\n**Teorema de Monotonía según la Base**:\n1. **Régimen de Crecimiento ($b > 1$)**:\n   $$\\ln(b) > 0 \\implies f'(x) > 0, \\; \\forall x \\in \\mathbb{R} \\Longleftrightarrow f \\text{ es estrictamente creciente}$$\n   $$\\lim_{x \\to +\\infty} f(x) = +\\infty, \\quad \\lim_{x \\to -\\infty} f(x) = 0$$\n2. **Régimen de Decaimiento ($0 < b < 1$)**:\n   $$\\ln(b) < 0 \\implies f'(x) < 0, \\; \\forall x \\in \\mathbb{R} \\Longleftrightarrow f \\text{ es estrictamente decreciente}$$\n   $$\\lim_{x \\to +\\infty} f(x) = 0, \\quad \\lim_{x \\to -\\infty} f(x) = +\\infty$$"
definiciones_clave: '- **Crecimiento exponencial**: Proceso donde la velocidad de aumento es directamente proporcional al valor actual ($b > 1$).

  - **Decaimiento / Decaimiento exponencial**: Proceso donde la magnitud disminuye a una tasa porcentual constante ($0 < b < 1$).'
propiedades_relaciones: '- **Simetría de bases recíprocas**: La función con base $1/b$ es la reflexión respecto al eje $Y$ de la función con base $b$: $\left(\frac{1}{b}\right)^x = b^{-x} = f(-x)$.

  - **Aceleración de curvatura**: A mayor base $b > 1$, más rápido crece la función.'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación de la base $b$ en la función exponencial $f(x) = a \cdot b^x$ determina unívocamente la monotonía del modelo: si $b > 1$ la función es estrictamente creciente (crecimiento exponencial) y si $0 < b < 1$ es estrictamente decreciente (decaimiento exponencial)](/static/img/nodos/identificacion-de-la-base-b-en-la-funcion-exponencial-ejemplos.svg)



    Clasifica la monotonía de las siguientes funciones exponenciales identificando su base $b$:

    1) $f(x) = 3 \cdot (1{,}2)^x$

    2) $g(x) = 5 \cdot \left(\frac{2}{7}\right)^x$'
  pasos:
  - 'Paso 1: Para $f(x) = 3 \cdot (1{,}2)^x$:

    - La base es $b = 1{,}2$.

    - Como $b = 1{,}2 > 1$, la función es **estrictamente creciente** (crecimiento exponencial del 20% por unidad de $x$).'
  - 'Paso 2: Para $g(x) = 5 \cdot \left(\frac{2}{7}\right)^x$:

    - La base es $b = \frac{2}{7} \approx 0{,}2857$.

    - Como $0 < b < 1$, la función es **estrictamente decreciente** (decaimiento exponencial).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué comportamiento gráfico presenta la función $f(x) = 100 \cdot (0{,}92)^x$?
  choices:
  - text: Es estrictamente decreciente (porque b = 0,92 < 1)
    is_correct: true
  - text: Es estrictamente creciente (porque 0,92 es positivo)
    is_correct: false
  - text: Es una función lineal
    is_correct: false
  - text: Es oscilante
    is_correct: false
  explanation: La alternativa correcta es 'Es estrictamente decreciente (porque b = 0,92 < 1)'. Como la base está entre 0 y 1 ($0 < 0,92 < 1$), la función decrece continuamente.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una población de insectos se triplica cada semana, ¿cuál es la base b de su modelo exponencial?
  choices:
  - text: b = 3 (crecimiento con factor 3)
    is_correct: true
  - text: b = 1/3
    is_correct: false
  - text: b = 2
    is_correct: false
  - text: b = 3x
    is_correct: false
  explanation: La alternativa correcta es 'b = 3 (crecimiento con factor 3)'. Triplicarse significa multiplicar por 3 en cada período de tiempo.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la base $b$ dentro de la expresión $f(x) = a \cdot b^x$.'
- 'Paso 2: Comparar el valor de $b$ con el número 1.'
- 'Paso 3: Si $b > 1$, clasificar como crecimiento exponencial estrictamente creciente.'
- 'Paso 4: Si $0 < b < 1$, clasificar como decaimiento exponencial estrictamente decreciente.'
errores_correccion: '- **Error común:** Creer que $b = 0,8$ es creciente porque $0,8$ es un número positivo.

  - **Cómo corregirlo:** Para que sea creciente debe ser **MAYOR QUE 1** ($b > 1$); si está entre 0 y 1 ($0 < b < 1$), **es DECRECIENTE**.'
ejemplos:
- titulo: 'Ejemplo 1: Base mayor a 1'
  enunciado: ¿Cómo es la gráfica de $f(x) = 5^x$?
  alternativas:
  - Estrictamente creciente
  - Estrictamente decreciente
  - Constante
  - Parabólica
  respuesta: Estrictamente creciente
  solucion_pasos:
  - 'Paso 1: $b = 5 > 1 \implies$ creciente.'
- titulo: 'Ejemplo 2: Base fraccionaria menor a 1'
  enunciado: En $g(x) = (0{,}25)^x$, ¿cuál es el comportamiento?
  alternativas:
  - Estrictamente decreciente hacia la derecha
  - Estrictamente creciente
  - Oscilante
  - Vertical
  respuesta: Estrictamente decreciente hacia la derecha
  solucion_pasos:
  - 'Paso 1: $b = 0{,}25 < 1 \implies$ decreciente.'
- titulo: 'Ejemplo 3: Factor de duplicación'
  enunciado: Si una magnitud se duplica cada hora ($b = 2$), ¿qué función la describe con 50 unidades iniciales?
  alternativas:
  - f(t) = 50 · 2ᵗ
  - f(t) = 2 · 50ᵗ
  - f(t) = 50 + 2t
  - f(t) = 100ᵗ
  respuesta: f(t) = 50 · 2ᵗ
  solucion_pasos:
  - 'Paso 1: $a = 50, b = 2 \implies f(t) = 50 \cdot 2^t$.'
- titulo: 'Ejemplo 4: Desintegración radiactiva'
  enunciado: Si una sustancia pierde la mitad de su masa cada año ($b = 1/2$), ¿cómo es su función?
  alternativas:
  - Decaimiento exponencial
  - Crecimiento exponencial
  - Lineal decreciente
  - Cuadrática
  respuesta: Decaimiento exponencial
  solucion_pasos:
  - 'Paso 1: $b = 1/2 < 1 \implies$ decaimiento exponencial.'
errores_frecuentes:
- Asumir que toda base positiva genera crecimiento.
- Confundir la base b con la variable x.
- Olvidar que las funciones exponenciales son estrictamente monótonas sin máximos ni mínimos.
afirmaciones_verdaderas:
- Si b > 1, la función exponencial es estrictamente creciente en todo su dominio.
- Si 0 < b < 1, la función exponencial es estrictamente decreciente en todo su dominio.
al_terminar_debes_poder: '**QUÉ:** Identificar la base b y clasificar la monotonía de la función exponencial.


  **CÓMO:** Evaluando si b > 1 (crecimiento exponencial) o 0 < b < 1 (decaimiento exponencial).


  ![Resumen La identificación de la base $b$ en la función exponencial $f(x) = a \cdot b^x$ determina unívocamente la monotonía del modelo: si $b > 1$ la función es estrictamente creciente (crecimiento exponencial) y si $0 < b < 1$ es estrictamente decreciente (decaimiento exponencial)](/static/img/nodos/identificacion-de-la-base-b-en-la-funcion-exponencial-resumen.svg)'
