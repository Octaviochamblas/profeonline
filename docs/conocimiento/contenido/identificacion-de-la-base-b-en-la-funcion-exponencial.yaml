semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.PARAMETRO_BASE
resumen_inicial: La identificación de la base $b$ clasifica la función como de crecimiento si $b > 1$ o de decrecimiento si $0 < b < 1$.
explicacion_simple: |
  La **base $b$** en $f(x) = a \cdot b^x$ es el factor constante que indica la rapidez y el tipo de comportamiento de la función:

  - **Si $b > 1$ (ej. $b = 2$, $b = 3$, $b = 1.2$)**:
    - Es un **crecimiento exponencial**.
    - Conforme $x$ aumenta, la gráfica **sube muy rápido** hacia arriba.
  - **Si $0 < b < 1$ (ej. $b = 0.5 = 1/2$, $b = 0.8$)**:
    - Es un **decrecimiento o decaimiento exponencial**.
    - Conforme $x$ aumenta, la gráfica **baja acercándose a cero**.
explicacion_formal: |
  Dada la función exponencial $f(x) = a \cdot b^x$ con $a > 0$ y $b \in \mathbb{R}^+ \setminus \{1\}$, la **base $b$** rige el comportamiento monotónico del operador:

  **Clasificación de la monotonía por la base $b$:**
  1. **Monotonía Estrictamente Creciente ($b > 1$):**
     $$\forall x_1, x_2 \in \mathbb{R}, \, x_1 < x_2 \implies b^{x_1} < b^{x_2}$$
     Tasa instantánea $f'(x) = a \cdot b^x \cdot \ln(b) > 0$ dado que $\ln(b) > 0$.
  2. **Monotonía Estrictamente Decreciente ($0 < b < 1$):**
     $$\forall x_1, x_2 \in \mathbb{R}, \, x_1 < x_2 \implies b^{x_1} > b^{x_2}$$
     Tasa instantánea $f'(x) = a \cdot b^x \cdot \ln(b) < 0$ dado que $\ln(b) < 0$.
definiciones_clave: |
  - **Base exponencial ($b$)**: Número real positivo distinto de uno que sostiene al exponente $x$ y determina el ritmo de crecimiento o decrecimiento de la función.
propiedades_relaciones: |
  - **Reciprocidad de bases**: Las bases recíprocas $b$ y $1/b$ (por ejemplo $2^x$ y $(1/2)^x = 2^{-x}$) producen gráficas simétricas respecto del eje Y vertical.
ejemplo_guiado:
  enunciado: 'Identifica la base $b$ en las funciones $f(x) = 5 \cdot (1/4)^x$ y $g(x) = 2 \cdot (1.8)^x$ y clasifica cada una como creciente o decreciente.'
  pasos:
    - 'Paso 1: Identificar la base de $f(x)$: $b = 1/4 = 0.25$.'
    - 'Paso 2: Como $0 < 0.25 < 1$, $f(x)$ es una **función exponencial decreciente**.'
    - 'Paso 3: Identificar la base de $g(x)$: $b = 1.8$.'
    - 'Paso 4: Como $1.8 > 1$, $g(x)$ es una **función exponencial creciente**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una función exponencial tiene base $b = 0.85$, ¿cuál es el comportamiento gráfico de su curva a medida que $x$ aumenta?'
    choices:
      - {text: 'Es estrictamente decreciente porque la base cumple $0 < 0.85 < 1$', is_correct: true}
      - {text: 'Es estrictamente creciente porque $0.85$ es un número positivo.', is_correct: false}
      - {text: 'Es una línea recta horizontal constante.', is_correct: false}
      - {text: 'Es una parábola cóncava hacia abajo.', is_correct: false}
    explanation: 'La alternativa correcta es ''Es estrictamente decreciente porque la base cumple $0 < 0.85 < 1$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Dada la función exponencial $f(x) = (4/3)^x$, ¿por qué se clasifica como una función creciente?'
    choices:
      - {text: 'Porque la fracción $4/3 = 1.33...$ es estrictamente mayor que 1', is_correct: true}
      - {text: 'Porque las fracciones siempre son decrecientes.', is_correct: false}
      - {text: 'Porque el numerador es mayor que el exponente.', is_correct: false}
      - {text: 'Porque no tiene coeficiente multiplicativo $a$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque la fracción $4/3 = 1.33...$ es estrictamente mayor que 1''. Toda base mayor que 1 genera crecimiento.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el término de la potencia y aislar el número que sirve de base $b$.'
  - 'Paso 2: Comparar el valor numérico de la base $b$ con el número de referencia 1.'
  - 'Paso 3: Si $b > 1$, clasificar como crecimiento exponencial.'
  - 'Paso 4: Si $0 < b < 1$, clasificar como decrecimiento exponencial.'
errores_correccion: |
  - **Error común:** Creer que toda fracción (ej. $4/3$) genera decrecimiento simplemente por ser una fracción.
  - **Cómo corregirlo:** Transforma la fracción a decimal: $4/3 \approx 1.33 > 1$ (crece). Solo decrece si la fracción es **PROPIA ($0 < b < 1$)**, como $1/3 \approx 0.33$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Base mayor que 1.
    alternativas:
      - 'b = 7, función creciente'
      - 'b = 7, función decreciente'
      - 'b = 1, función constante'
    respuesta: 'b = 7, función creciente'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Base entre 0 y 1.
    alternativas:
      - 'b = 0.2, función decreciente'
      - 'b = 0.2, función creciente'
      - 'b = 0.2, función parabólica'
    respuesta: 'b = 0.2, función decreciente'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = (5/2)^x$, la afirmación de que es decreciente por tener la base expresada en forma de fracción.'
  - 'La afirmación de que el crecimiento o decrecimiento depende exclusivamente del signo del coeficiente $a$.'
  - 'La consideración de que cuando la base $b$ es muy grande, la asíntota horizontal desaparece.'
  - 'Equiparar la base $b = 1/2$ en $f(x) = (1/2)^x$ con tener un coeficiente negativo en $-2^x$.'
  - 'La falta de verificación de si la base fraccionaria es impropia ($b > 1$) o propia ($0 < b < 1$).'
afirmaciones_verdaderas:
  - 'La base $b$ rige la monotonía de $f(x) = b^x$: si $b > 1$ la función es creciente y si $0 < b < 1$ la función es decreciente.'
  - 'Las funciones de bases recíprocas $f(x) = b^x$ y $g(x) = (1/b)^x$ son reflejadas una de la otra con respecto al eje Y.'
al_terminar_debes_poder: |
  QUÉ: Identificar la base $b$ y clasificar la monotonía de la función exponencial.
  CÓMO: Aislar $b$, comparar con $1$ y categorizar la curva como de crecimiento ($b > 1$) o decrecimiento ($0 < b < 1$).
fuente: 'Texto escolar MINEDUC — Álgebra / Funciones Exponenciales'
