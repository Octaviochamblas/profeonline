semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SISTEMA_INCONSISTENTE
resumen_inicial: 'Sistema inconsistente: sin solución (rectas paralelas): propiedades,
  resolución y modelamiento en Representación y clasificación de sistemas 2x2.'
explicacion_simple: Si dibujas esto en un gráfico, obtendrás **dos líneas perfectamente
  paralelas**, como las rectas paralelas. Tienen la misma inclinación, pero están
  separadas.
explicacion_formal: '### Definición formal


  Un sistema $a_1x+b_1y=c_1$, $a_2x+b_2y=c_2$ es incompatible (sin solución) si y
  solo si sus pendientes coinciden pero sus términos independientes no son proporcionales,
  $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq$ \frac{c_1}{c_2}$: las rectas asociadas
  son paralelas y no se intersectan.


  ### Desarrollo didáctico


  Si dibujas esto en un gráfico, obtendrás **dos líneas perfectamente paralelas**,
  como las rectas paralelas. Tienen la misma inclinación, pero están separadas.

  ¿En qué punto se cruzan las rectas paralelas? Nunca. Por lo tanto, el sistema **No
  tiene solución** (Conjunto Vacío).


  Si intentas forzar una respuesta con álgebra, las letras se eliminarán, pero llegarás
  a una contradicción matemática como $0 = 5$.'
