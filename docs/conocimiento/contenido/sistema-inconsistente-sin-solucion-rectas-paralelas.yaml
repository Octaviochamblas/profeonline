semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SISTEMA_INCONSISTENTE
resumen_inicial: Un sistema es incompatible o inconsistente cuando carece de solución,
  lo que corresponde a dos rectas paralelas no coincidentes.
explicacion_simple: 'Un sistema es **incompatible** (o inconsistente) cuando es imposible
  encontrar un par $(x, y)$ que cumpla ambas ecuaciones a la vez.

  Geométricamente, las dos rectas tienen la misma inclinación (misma pendiente) pero
  cortan al eje $y$ en puntos diferentes.

  Son **rectas paralelas** que corren lado a lado y jamás se cortan en ningún punto
  del plano.'
explicacion_formal: 'El sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2
  y = c_2 \end{cases}$ es **incompatible o inconsistente** si y solo si sus coeficientes
  cumplen:


  $$\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$$


  $$\text{Geometría: } L_1 \parallel L_2 \text{ (paralelas no coincidentes) } \implies
  L_1 \cap L_2 = \emptyset$$


  $$\text{Conjunto solución: } S = \emptyset$$'
definiciones_clave: '- **Sistema incompatible / inconsistente**: Sistema lineal que
  no posee ninguna solución en los números reales ($S = \emptyset$).

  - **Rectas paralelas no coincidentes**: Rectas que poseen igual pendiente ($m_1
  = m_2$) pero distinta ordenada al origen ($n_1 \neq n_2$).'
propiedades_relaciones: '- **Proporcionalidad parcial**: Las razones de los coeficientes
  de $x$ e $y$ son iguales entre sí, pero diferentes de la razón de las constantes
  independientes.'
ejemplo_guiado:
  enunciado: Clasifica el sistema $\begin{cases} 2x + 5y = 8 \\ 2x + 5y = 14 \end{cases}$
    analizando la razón de sus coeficientes y determina si posee alguna solución.
  pasos:
  - 'Paso 1: Calcular la razón de los coeficientes de $x$: $\frac{a_1}{a_2} = \frac{2}{2}
    = 1$.Paso 2: Calcular la razón de los coeficientes de $y$: $\frac{b_1}{b_2} =
    \frac{5}{5} = 1$.Paso 3: Calcular la razón de las constantes: $\frac{c_1}{c_2}
    = \frac{8}{14} = \frac{4}{7}$.Paso 4: Comprobar que $\frac{a_1}{a_2} = \frac{b_1}{b_2}
    \neq \frac{c_1}{c_2}$ ($1 = 1 \neq \frac{4}{7}$).Paso 5: Concluir que el sistema
    es **incompatible** (inconsistente), carece de solución ($S = \emptyset$) y sus
    rectas asociadas son paralelas.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición entre las razones de coeficientes define a un sistema incompatible
    o sin solución?
  choices:
  - text: $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$
    is_correct: true
  - text: $\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$
    is_correct: false
  - text: $\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$
    is_correct: false
  - text: $a_1 b_2 - a_2 b_1 \neq 0$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq
    \frac{c_1}{c_2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para el sistema $\begin{cases} 2x + 5y = 8 \\ 2x + 5y = 14 \end{cases}$,
    ¿cuál es su conjunto solución $S$?
  choices:
  - text: $S = \emptyset$ (conjunto vacío, sin solución)
    is_correct: true
  - text: $S = \{(2, 5)\}$
    is_correct: false
  - text: $S = \{(8, 14)\}$
    is_correct: false
  - text: $S = \mathbb{R}^2$
    is_correct: false
  explanation: La alternativa correcta es '$S = \emptyset$ (conjunto vacío, sin solución)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular las razones $\frac{a_1}{a_2}$, $\frac{b_1}{b_2}$ y $\frac{c_1}{c_2}$.'
- 'Paso 2: Verificar si $\frac{a_1}{a_2} = \frac{b_1}{b_2}$.'
- 'Paso 3: Verificar si la constante $\frac{c_1}{c_2}$ es distinta de las dos anteriores.'
- 'Paso 4: Si se cumple la condición, clasificar como Incompatible / Inconsistente
  ($S = \emptyset$, rectas paralelas).'
errores_correccion: '- **Error común:** Confundir un sistema sin solución ($S = \emptyset$)
  con un sistema cuya solución es el punto de origen $(0, 0)$.

  - **Cómo corregirlo:** Si la solución es $(0, 0)$, el sistema SÍ tiene solución.
  Si las rectas son paralelas, NO tiene solución alguna ($S = \emptyset$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de clasificación.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de clasificación.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un sistema con solución única se representa por dos rectas secantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, se cortan en un único punto del plano.
- titulo: ¿Dos rectas paralelas representan un sistema sin solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, al no tener puntos en común no existe solución.
errores_frecuentes:
- Confundir las condiciones de proporcionalidad para solución única y sin solución.
- Asumir que la lectura gráfica sustituye la comprobación algebraica en las ecuaciones.
- Olvidar incluir el término constante al evaluar la condición de infinitas soluciones.
- Invertir los ejes $x$ e $y$ al leer las coordenadas de intersección del gráfico.
- Confundir la igualdad de pendientes con la coincidencia total de las rectas.
afirmaciones_verdaderas:
- Un sistema 2x2 es compatible determinado si las rectas asociadas tienen pendientes
  distintas y se cortan en un único punto.
- Si las razones de los coeficientes de $x$ e $y$ son iguales pero distintas a la
  razón de las constantes, el sistema es incompatible.
al_terminar_debes_poder: Al finalizar este recurso podrás clasificar sistemas 2x2
  e interpretar sus soluciones desde la perspectiva geométrica y paramétrica.
fuente: Texto escolar MINEDUC — Álgebra / Clasificación de Sistemas 2x2
