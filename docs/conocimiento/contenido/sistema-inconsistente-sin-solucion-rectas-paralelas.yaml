procedimiento:
- Compara las pendientes de las rectas (coeficientes de x e y).
- Si las pendientes son idénticas, pero los resultados (términos independientes) son
  diferentes y no proporcionales, son paralelas.
- Concluye que el sistema no tiene solución.
- Si resuelves con álgebra, llegarás a un absurdo matemático como $0=8$.
errores_correccion: 'Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en sistema inconsistente: sin solución (rectas paralelas).'
ejemplos:
- titulo: $x+y=5$ y $x+y=10$
  enunciado: Resuelve o interpreta $x+y=5$ y $x+y=10$ usando las condiciones de este
