    (ej: $x+y=5$ y al mismo tiempo $x+y=10$. ¿Cómo dos números van a sumar 5 y 10
    a la vez?).'
  - Compara las pendientes de las rectas (coeficientes de x e y).
- titulo: $0 = 5$
