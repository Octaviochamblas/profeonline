semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SISTEMA_INCONSISTENTE
resumen_inicial: Un sistema es incompatible o inconsistente cuando carece de solución en el dominio real, lo que geométricamente corresponde a dos rectas paralelas no coincidentes.
explicacion_simple: |
  Un sistema de ecuaciones lineales $2 \times 2$ se clasifica como **incompatible** (o **inconsistente**) cuando resulta matemáticamente imposible hallar un par de valores $(x, y)$ que satisfaga simultáneamente ambas ecuaciones.

  Geométricamente, las dos rectas asociadas poseen exactamente la misma inclinación (misma pendiente $m_1 = m_2$), pero cortan al eje vertical en puntos distintos ($n_1 \neq n_2$).

  Por lo tanto, se trata de dos **rectas paralelas disjuntas** que corren en la misma dirección y jamás se intersecan en ningún punto del plano cartesiano ($S = \emptyset$).
explicacion_formal: |
  ### Definición formal
  El sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$ es **incompatible o inconsistente** si y solo si las razones de los coeficientes de las variables son iguales entre sí pero distintas a la razón de los términos independientes:

  $$\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$$

  $$\text{Geometría: } L_1 \parallel L_2 \text{ (paralelas disjuntas no coincidentes) } \implies L_1 \cap L_2 = \emptyset$$

  $$\text{Conjunto solución: } S = \emptyset$$

  ### Síntesis didáctica
  Las rectas poseen pendientes idénticas $m_1 = m_2 = -a_1/b_1$, pero ordenadas al origen distintas $n_1 \neq n_2$, tornando la intersección vacía.
definiciones_clave: |
  - **Sistema incompatible / inconsistente**: Sistema lineal que no posee ningún par ordenado como solución real ($S = \emptyset$).
  - **Rectas paralelas no coincidentes**: Rectas coplanares que mantienen una distancia constante entre sí y carecen de puntos comunes.
propiedades_relaciones: |
  - **Proporcionalidad parcial de coeficientes**: $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$ es la condición matemática necesaria y suficiente para la inconsistencia.
  - **Determinante nulo con constantes no proporcionales**: $\Delta = a_1 b_2 - a_2 b_1 = 0$, pero $\Delta_x \neq 0$ o $\Delta_y \neq 0$.
ejemplo_guiado:
  enunciado: 'Clasifica el sistema $\begin{cases} 2x + 5y = 8 \\ 2x + 5y = 14 \end{cases}$ analizando la razón de sus coeficientes y determina si posee alguna solución real.'
  pasos:
    - 'Paso 1: Calcular la razón entre los coeficientes de $x$: $\frac{a_1}{a_2} = \frac{2}{2} = 1$.'
    - 'Paso 2: Calcular la razón entre los coeficientes de $y$: $\frac{b_1}{b_2} = \frac{5}{5} = 1$.'
    - 'Paso 3: Calcular la razón entre las constantes independientes: $\frac{c_1}{c_2} = \frac{8}{14} = \frac{4}{7}$.'
    - 'Paso 4: Comprobar la proporcionalidad parcial: $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$ ($1 = 1 \neq \frac{4}{7}$).'
    - 'Paso 5: Concluir que el sistema es **incompatible** (inconsistente), carece de solución ($S = \emptyset$) y sus rectas asociadas son paralelas.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición entre las razones de coeficientes y constantes caracteriza a un sistema incompatible o sin solución?'
    choices:
      - {text: '$\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$', is_correct: true}
      - {text: '$\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$', is_correct: false}
      - {text: '$\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$', is_correct: false}
      - {text: '$a_1 b_2 - a_2 b_1 \neq 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para el sistema $\begin{cases} 2x + 5y = 8 \\ 2x + 5y = 14 \end{cases}$, ¿cuál es su conjunto solución $S$?'
    choices:
      - {text: '$S = \emptyset$ (conjunto vacío, sin solución)', is_correct: true}
      - {text: '$S = \{(2, 5)\}$', is_correct: false}
      - {text: '$S = \{(8, 14)\}$', is_correct: false}
      - {text: '$S = \mathbb{R}^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$S = \emptyset$ (conjunto vacío, sin solución)''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los coeficientes $a_1, a_2$ de $x$, $b_1, b_2$ de $y$ y las constantes $c_1, c_2$.'
  - 'Paso 2: Calcular y comparar las fracciones $\frac{a_1}{a_2}$ y $\frac{b_1}{b_2}$.'
  - 'Paso 3: Si $\frac{a_1}{a_2} = \frac{b_1}{b_2}$, calcular la razón de las constantes $\frac{c_1}{c_2}$.'
  - 'Paso 4: Si $\frac{c_1}{c_2}$ resulta distinta a las razones anteriores, clasificar el sistema como Incompatible / Inconsistente.'
  - 'Paso 5: Declarar $S = \emptyset$ e indicar que la representación geométrica corresponde a dos rectas paralelas.'
errores_correccion: |
  - **Error 1:** Confundir la ausencia de solución ($S = \emptyset$) con tener como solución al punto de origen $(0, 0)$. **Cómo corregirlo:** El par $(0, 0)$ **ES UNA SOLUCIÓN VÁLIDA CONCRETA (PUNTO DEL ORIGEN); UN SISTEMA INCOMPATIBLE CARECE POR COMPLETO DE PUNTOS EN COMÚN Y SU CONJUNTO SOLUCIÓN ES EL VACÍO ($S = \emptyset$)**.
  - **Error 2:** Asumir que si el sistema no se puede resolver por reducción de forma sencilla carece de solución. **Cómo corregirlo:** La ausencia de solución **DEBE SER PROBADA VERIFICANDO LA CONDICIÓN DE PARALELISMO $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$ O LLEGANDO A UNA CONTRADICCIÓN COMO $0 = 6$**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿El sistema $\begin{cases} x + y = 3 \\ x + y = 7 \end{cases}$ tiene solución en $\mathbb{R}^2$?'
    alternativas:
      - 'No, pues $\frac{1}{1} = \frac{1}{1} \neq \frac{3}{7}$, $S = \emptyset$'
      - 'Sí, la solución es $(3, 7)$'
      - 'Sí, infinitas soluciones'
    respuesta: 'No, pues $\frac{1}{1} = \frac{1}{1} \neq \frac{3}{7}$, $S = \emptyset$'
    solucion_pasos:
      - '1. Al restar ambas ecuaciones se obtiene $0 = -4$, una contradicción.'
      - '2. La contradicción demuestra que $S = \emptyset$.'
  - titulo: 'Ejemplo 2'
    enunciado: '¿Para qué valor de $k$ el sistema $\begin{cases} 4x + 2y = 10 \\ kx + y = 1 \end{cases}$ es incompatible?'
    alternativas:
      - '$k = 2$'
      - '$k = 4$'
      - '$k = 1$'
    respuesta: '$k = 2$'
    solucion_pasos:
      - '1. Exigir $\frac{4}{k} = \frac{2}{1} \neq \frac{10}{1}$.'
      - '2. $\frac{4}{k} = 2 \implies 2k = 4 \implies k = 2$.'
  - titulo: 'Rectas paralelas disjuntas'
    enunciado: '¿Un sistema incompatible se representa gráficamente por dos rectas paralelas que no se cortan?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al no intersectarse carecen de soluciones.'
  - titulo: 'Contradicción algebraica'
    enunciado: '¿Obtener una contradicción como $0 = 5$ al resolver indica que el sistema es inconsistente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, confirma algebraicamente que no existe intersección.'
errores_frecuentes:
  - 'En un sistema incompatible $2 \times 2$, el conjunto solución vacío $S = \emptyset$ se confunde declarando que la solución es el origen $(0, 0)$.'
  - 'Un sistema de ecuaciones lineales $2 \times 2$ se clasifica como incompatible comprobando únicamente que $\frac{a_1}{a_2} = \frac{b_1}{b_2}$ sin verificar la desigualdad $\frac{c_1}{c_2}$.'
  - 'En el plano cartesiano, dos rectas paralelas no coincidentes correspondientes a un sistema incompatible se cruzan en un punto infinitamente lejano.'
  - 'Al restar dos ecuaciones paralelas que producen una contradicción $0 = -6$, se concluye que el sistema posee soluciones reales.'
  - 'Un sistema $2 \times 2$ con determinante principal nulo $\Delta = 0$ es de forma obligatoria un sistema compatible determinado.'
afirmaciones_verdaderas:
  - 'Un sistema 2x2 es incompatible o inconsistente si y solo si $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$.'
  - 'Geométricamente, un sistema sin solución se representa por dos rectas paralelas no coincidentes que jamás se cortan.'
al_terminar_debes_poder: |
  QUÉ: Identificar y clasificar un sistema de ecuaciones 2x2 como incompatible o inconsistente.
  CÓMO: Comprobar la proporcionalidad parcial $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$, declarar el conjunto solución vacío $S = \emptyset$ e interpretar sus rectas como paralelas.
fuente: 'Texto escolar MINEDUC — Álgebra 1° Medio / Clasificación de Sistemas 2x2.'
