semantic_id: MAT.GEO.SIMETRIAS.AXIAL_RECTA
resumen_inicial: 'Simetría axial respecto de una recta: conceptos, teoremas, propiedades
  geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'La simetría axial funciona como un espejo: la recta de simetría
  (eje) refleja cada punto hacia el lado opuesto, a la misma distancia perpendicular.'
explicacion_formal: '![Simetría axial respecto de una recta](/static/img/geometria/isometrias/simetria-axial-recta.svg)


  ### Definición formal


  Dada una recta $L$ (el eje), la simetría axial transforma cada punto $P$ en $P''$
  tal que $L$ es la mediatriz del segmento $PP''$: la recta $L$ es perpendicular a
  $PP''$ y pasa exactamente por su punto medio.


  ### Desarrollo didáctico


  En la figura, la recta diagonal (eje de simetría) actúa como espejo: el punto $P$
  y su imagen $P''$ están a la misma distancia perpendicular de la recta, uno a cada
  lado.'
definiciones_clave: '- **Simetría axial respecto de una recta**: Elemento o propiedad
  fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a simetría axial respecto de una recta.'
