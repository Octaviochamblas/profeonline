procedimiento:
- 'Paso 1: Identifica la recta L que actuará como eje de simetría.'
- 'Paso 2: Traza la perpendicular desde el punto P hacia la recta L.'
- 'Paso 3: Ubica P'' sobre esa perpendicular, al otro lado de L, a la misma distancia
  que P.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con simetría axial respecto de una recta.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de simetría axial respecto de una recta para determinar
