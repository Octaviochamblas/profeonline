resumen_inicial: La extracción del factor común resultante es el paso final de la
  agrupación donde el binomio idéntico se extrae como factor global para obtener el
  producto de dos binomios $(Q)(F_1 + F_2)$.
explicacion_simple: 'Cuando tienes la expresión intermedia $a(x + y) + b(x + y)$,
  ves que $(x + y)$ es el factor común polinomio de los dos bloques. Lo extraes al
  frente y agrupas lo que estaba afuera ($a$ y $b$) en su propio paréntesis: $(x +
  y)(a + b)$. ¡Esa es la solución final!'
explicacion_formal: 'Dada la expresión intermedia en bloques $P = F_1 \cdot Q + F_2
  \cdot Q$, la **Extracción del Factor Común Resultante** aplica la propiedad distributiva
  para aislar el factor común $Q$:


  $$P = Q \cdot (F_1 + F_2)$$


  **Desglose simbólico:**

  - $Q = (x + y)$: Binomio común resultante extraído de ambos bloques.

  - $(F_1 + F_2) = (a + b)$: Binomio compuesto por la suma de los factores monomiales
  extraídos en la fase por grupos.

  - $Q(F_1 + F_2)$: Expresión completamente factorizada representada como un producto
  de dos factores primos.


  > **Complemento didáctico:** Concluye el proceso transformando la suma de bloques
  en una estructura multiplicativa irreducible.'
definiciones_clave: '- **Factor común resultante**: Paréntesis idéntico extraído como
  factor global en la fase final.

  - **Factorización completa por agrupación**: Representación $P = (A + B)(C + D)$.'
propiedades_relaciones: '- **Conmutatividad de factores**: Por propiedad conmutativa
  del producto, $(x+y)(a+b) = (a+b)(x+y)$.'
ejemplo_guiado:
  enunciado: Concluya la factorización de la expresión $2x^2(x - 2) + 3(x - 2)$ extrayendo
    el factor común resultante.
  pasos:
  - 'Paso 1: Identificar la expresión intermedia: $2x^2(x - 2) + 3(x - 2)$.'
  - 'Paso 2: Reconocer el factor común polinomio repetido: $Q = (x - 2)$.'
  - 'Paso 3: Identificar los factores externos que acompañan a $Q$: $F_1 = 2x^2$ y
    $F_2 = 3$.'
  - 'Paso 4: Extraer $Q$ y agrupar los factores externos entre paréntesis: $(x - 2)(2x^2
    + 3)$.'
  - 'Conclusión: La expresión completamente factorizada es $(x - 2)(2x^2 + 3)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la estructura formal final que se obtiene al extraer el factor
    común resultante?
  choices:
  - text: Un producto de dos factores entre paréntesis $(Q)(F_1 + F_2)$
    is_correct: true
  - text: Una suma de cuatro monomios independientes
    is_correct: false
  - text: Un solo monomio de grado elevado
    is_correct: false
  - text: Una división de polinomios
    is_correct: false
  explanation: La alternativa correcta es 'Un producto de dos factores entre paréntesis
    $(Q)(F_1 + F_2)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al extraer el factor común resultante de $2x^2(x - 2) + 3(x - 2)$, ¿cuál
    es el producto final?
  choices:
  - text: $(x - 2)(2x^2 + 3)$
    is_correct: true
  - text: $(x - 2)(2x^2 - 3)$
    is_correct: false
  - text: $(x + 2)(2x^2 + 3)$
    is_correct: false
  - text: $(6x^2)(x - 2)$
    is_correct: false
  explanation: La alternativa correcta es '$(x - 2)(2x^2 + 3)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el paréntesis común $Q$ que se repite en los bloques de la
  expresión intermedia.'
- 'Paso 2: Abrir un segundo paréntesis y colocar los coeficientes o monomios externos
  $F_1 + F_2$.'
- 'Paso 3: Escribir el producto de ambos paréntesis como el resultado final.'
errores_correccion: '- **Error 1: Escribir un signo de suma entre los dos paréntesis
  finales produciendo $(x - 2) + (2x^2 + 3)$.** **Cómo corregirlo:** La factorización
  exige transformar la suma en un PRODUCTO; los paréntesis DEBEN quedar multiplicándose:
  $(x - 2)(2x^2 + 3)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Concluya la factorización de $a^2(a + 1) + 1(a + 1)$.
  alternativas:
  - $(a + 1)(a^2 + 1)$
  - $(a + 1)(a^2)$
  - $(a + 1) + (a^2 + 1)$
  respuesta: $(a + 1)(a^2 + 1)$
  solucion_pasos:
  - '1. Factor común polinomio: $(a + 1)$.'
  - '2. Factores externos: $a^2$ y $1$.'
  - '3. Resultado: $(a + 1)(a^2 + 1)$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la expresión factorizada de $5x(x - 2) - 3(x - 2)$?
  alternativas:
  - $(x - 2)(5x - 3)$
  - $(x - 2)(5x + 3)$
  - $(x + 2)(5x - 3)$
  respuesta: $(x - 2)(5x - 3)$
  solucion_pasos:
  - '1. Factor común: $(x - 2)$.'
  - '2. Factores externos: $5x$ y $-3$.'
  - '3. Resultado: $(x - 2)(5x - 3)$.'
- titulo: ¿Es $(m + n)(x + y)$ equivalente a $(x + y)(m + n)$ por la conmutatividad
    del producto?
  respuesta: Sí
  solucion_pasos:
  - Sí, el orden de los factores no altera el producto final.
- titulo: ¿Es válida una factorización si los paréntesis finales quedan separados
    por una resta?
  respuesta: 'No'
  solucion_pasos:
  - No, si quedan separados por resta o suma, no es una expresión factorizada.
errores_frecuentes:
- Colocar signos de suma o resta entre los dos paréntesis de la respuesta final.
- Elevar al cuadrado el paréntesis común resultativo al extraerlo como factor global.
- Reemplazar por 0 el residuo en el paréntesis de factores externos cuando un bloque
  no tiene coeficiente escrito.
- Declarar que los factores finales pueden simplificarse sumando variables de distinto
  tipo.
- Multiplicar los paréntesis de la respuesta final deshaciendo la factorización obtenida.
afirmaciones_verdaderas:
- La extracción del factor común resultante produce una expresión en forma de producto
  $(A + B)(C + D)$.
- El orden de los dos paréntesis factorizados finales se puede intercambiar libremente
  por la conmutatividad del producto.
al_terminar_debes_poder: Al terminar serás capaz de extraer el factor común resultante
  para completar la factorización por agrupación.
