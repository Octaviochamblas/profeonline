semantic_id: MAT.FUND.TABLAS_VERDAD.FILAS_DOS_VARIABLES
resumen_inicial: 'Cálculo y justificación combinatoria del número de filas en una tabla de verdad con $2$ variables proposicionales ($2^2 = 4$ filas).'
explicacion_simple: |
  Para saber cuántas filas debe tener una tabla de verdad, usamos la regla de las potencias de dos: **$2^n$**, donde $n$ es la cantidad de variables diferentes. Si una fórmula tiene **$2$ variables** (por ejemplo, $p$ y $q$), el cálculo es **$2^2 = 2 \times 2 = 4$ filas**. Esto se debe a que la primera variable puede ser $V$ o $F$ ($2$ opciones) y la segunda variable también puede ser $V$ o $F$ ($2$ opciones), generando un total de $4$ combinaciones distintas.

  ![Infografía: Número de Filas con Dos Variables](/static/img/nodos/numero-de-filas-en-una-tabla-de-verdad-con-dos-variables-intro.svg)
explicacion_formal: |
  ### Definición formal
  El número de asignaciones de valuación (filas) en una tabla de verdad para un conjunto de variables proposicionales $\mathcal{V}_n = \{p_1, p_2, \dots, p_n\}$ con $n=2$ viene dado por la cardinalidad del producto cartesiano del espacio veritativo bivalente $\mathbb{V} = \{V, F\}$:
  $$N_{\text{filas}} = |\mathbb{V}^2| = |\mathbb{V} \times \mathbb{V}| = 2^2 = 4$$
  donde el conjunto de interpretaciones es $\mathbb{V}^2 = \{(V,V), (V,F), (F,V), (F,F)\}$.

  ### Desglose simbólico
  - Base $2$: Representa el principio de bivalencia (solo existen dos valores posibles: $V$ y $F$).
  - Exponente $n=2$: Cantidad de variables proposicionales independientes ($p$ y $q$).
  - Distribución canónica de columnas:
    - Columna 1 ($p$): $2^{2-1} = 2$ valores $V$ seguidos de $2$ valores $F$ ($V, V, F, F$).
    - Columna 2 ($q$): $2^{2-2} = 1$ valor $V$ alternando con $1$ valor $F$ ($V, F, V, F$).

  ### Síntesis didáctica
  La fórmula $2^2 = 4$ garantiza que todas las posibilidades lógicas del universo de dos proposiciones queden contempladas sin omisiones ni duplicados.
definiciones_clave: |
  - **Número de filas ($2^n$)**: Total de combinaciones veritativas necesarias para evaluar exhaustivamente una fórmula lógica.
  - **Espacio de valuaciones $\mathbb{V}^2$**: Conjunto de los cuatro pares ordenados posibles formados por $\{V, F\}$.
  - **Distribución canónica por bloques**: Método sistemático para escribir las combinaciones dividiendo a la mitad los bloques de $V$ y $F$.
propiedades_relaciones: |
  - **Crecimiento exponencial**: Duplicar el número de variables de $1$ a $2$ duplica el número de filas de $2$ a $4$.
  - **Independencia de conectivos**: La cantidad de filas depende exclusivamente del número de variables proposicionales distintas, no de la cantidad de conectivos lógicos presentes.
ejemplo_guiado:
  enunciado: |
    Determina cuántas filas debe tener la tabla de verdad de la fórmula $(p \land q) \to (p \lor \neg q)$ y escribe la disposición canónica de sus columnas de entrada.

    ![Diagrama: Número de Filas con Dos Variables](/static/img/nodos/numero-de-filas-en-una-tabla-de-verdad-con-dos-variables-ejemplos.svg)

  pasos:
    - 'Paso 1: Contar la cantidad de variables proposicionales distintas en la fórmula: aparecen $p$ y $q$, por lo que $n = 2$.'
    - 'Paso 2: Aplicar la fórmula del número de filas: $N = 2^n = 2^2 = 4$ filas.'
    - 'Paso 3: Distribuir los valores para la primera variable $p$: Se colocan $2$ verdades seguidas de $2$ falsedades: $(V, V, F, F)$.'
    - 'Paso 4: Distribuir los valores para la segunda variable $q$: Se alternan de uno en uno: $(V, F, V, F)$.'
    - 'Paso 5: Concluir que la tabla consta exactamente de $4$ filas organizadas en los pares $(V,V), (V,F), (F,V), (F,F)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula matemática para calcular el número de filas de una tabla de verdad con $n$ variables proposicionales distintas?'
    choices:
      - {text: '$2^n$', is_correct: true}
      - {text: '$2n$', is_correct: false}
      - {text: '$n^2$', is_correct: false}
      - {text: '$2^{n+1}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$2^n$''. Cada una de las $n$ variables tiene $2$ estados posibles ($V$ o $F$), resultando en $2^n$ combinaciones.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Una fórmula contiene $5$ conectivos lógicos pero utiliza únicamente las variables $p$ y $q$. ¿Cuántas filas tendrá su tabla de verdad?'
    choices:
      - {text: '$4$ filas ($2^2$)', is_correct: true}
      - {text: '$10$ filas', is_correct: false}
      - {text: '$32$ filas', is_correct: false}
      - {text: '$7$ filas', is_correct: false}
    explanation: 'La alternativa correcta es ''$4$ filas ($2^2$)''. El número de filas depende exclusivamente del número de variables distintas ($n=2$), no de la cantidad de conectivos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar y contar las variables proposicionales distintas ($n$) que intervienen en la fórmula.'
  - 'Paso 2: Calcular el total de filas mediante la potencia $N = 2^n$ (para $n=2$, $N = 4$).'
  - 'Paso 3: Llenar la primera columna con $N/2 = 2$ valores $V$ y $2$ valores $F$.'
  - 'Paso 4: Llenar la segunda columna alternando de $1$ en $1$ ($V, F, V, F$).'
errores_correccion: |
  - **Error 1:** Multiplicar $2 \times n$ en vez de elevar a la potencia $2^n$. **Cómo corregirlo:** Para $n=3$, $2 \times 3 = 6$ (incorrecto), mientras que $2^3 = 8$ (correcto). Para $n=2$, coincide numéricamente $2 \times 2 = 4$, pero conceptualmente es la potencia $2^2$.
  - **Error 2:** Contar las variables repetidas o negadas como variables nuevas. **Cómo corregirlo:** En la expresión $(p \land q) \to \neg p$, las variables distintas son solo $p$ y $q$ ($n=2$), por lo que la tabla tiene 4 filas.
ejemplos:
  - titulo: 'Cálculo directo con dos variables'
    enunciado: '¿Cuántas filas tiene la tabla de verdad de $p \leftrightarrow q$?'
    alternativas:
      - '$4$ filas'
      - '$2$ filas'
      - '$8$ filas'
    respuesta: '$4$ filas'
    solucion_pasos:
      - '1. Hay 2 variables ($p$ y $q$).'
      - '2. Filas $= 2^2 = 4$.'
  - titulo: 'Fórmula con variables negadas'
    enunciado: '¿Cuántas filas tiene la tabla de verdad de $\neg p \land \neg q$?'
    alternativas:
      - '$4$ filas'
      - '$8$ filas'
      - '$16$ filas'
    respuesta: '$4$ filas'
    solucion_pasos:
      - '1. Las variables base son $p$ y $q$ ($n=2$).'
      - '2. Filas $= 2^2 = 4$.'
  - titulo: 'Independencia de operadores'
    enunciado: '¿El número de conectivos lógicos modifica la cantidad de filas de la tabla?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el número de filas viene fijado exclusivamente por $2^n$.'
  - titulo: 'Disposición canónica'
    enunciado: '¿La primera columna para dos variables siempre lleva el patrón $V, V, F, F$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la convención estándar para $2^2 = 4$ filas.'
errores_frecuentes:
  - 'La afirmación de que el número de filas de una tabla de verdad se calcula multiplicando $2 \times n$.'
  - 'La afirmación de que una variable negada $\neg p$ cuenta como una variable independiente adicional aumentando las filas.'
  - 'La afirmación de que aumentar el número de conectivos lógicos incrementa el número de filas de la tabla.'
  - 'La afirmación de que una tabla con dos variables puede construirse con solo 3 filas sin perder combinaciones.'
  - 'La afirmación de que la base de la potencia exponencial en lógica clásica es 3 en lugar de 2.'
afirmaciones_verdaderas:
  - 'El número de filas de una tabla de verdad con $2$ variables proposicionales es exactamente $2^2 = 4$, abarcando todas las combinaciones posibles de $\mathbb{V}^2$.'
  - 'La cantidad de filas de una tabla de verdad depende únicamente del número de variables atómicas distintas ($n$) y es independiente del número de conectivos presentes en la fórmula.'
al_terminar_debes_poder: |
  QUÉ: Calcular y estructurar el número de filas de una tabla de verdad con $2$ variables proposicionales.
  CÓMO: Aplicar la fórmula exponencial $2^n = 2^2 = 4$ y distribuir las columnas de entrada según el patrón canónico.

