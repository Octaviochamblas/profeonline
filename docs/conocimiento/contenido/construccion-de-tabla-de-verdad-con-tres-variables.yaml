semantic_id: MAT.FUND.TABLAS_VERDAD.CONSTRUCCION_TRES_VARIABLES
resumen_inicial: 'Procedimiento sistemático paso a paso para construir y evaluar tablas de verdad completas de $8$ filas con tres variables proposicionales.'
explicacion_simple: |
  Para construir una tabla de verdad con **tres variables** ($p$, $q$ y $r$), el procedimiento es el mismo que con dos variables, pero ahora trabajamos con **$8$ filas**. Primero llenamos las tres columnas de entrada con el patrón $4-2-1$. Luego agregamos columnas auxiliares para resolver cada paréntesis por separado. Finalmente, comparamos los resultados de los paréntesis para llenar la **columna principal** de la fórmula.
explicacion_formal: |
  ### Definición formal
  La **construcción de una tabla de verdad para tres variables** es el algoritmo matricial de evaluación que computa el vector de verdad $\mathbf{v}(\Phi) \in \{V, F\}^8$ para una fórmula $\Phi(p, q, r)$ a partir de la matriz canónica $\mathbf{M}_{\text{in}} \in \{V, F\}^{8 \times 3}$:
  $$\mathbf{M}_{\text{in}} = \begin{pmatrix} V & V & V \\ V & V & F \\ V & F & V \\ V & F & F \\ F & V & V \\ F & V & F \\ F & F & V \\ F & F & F \end{pmatrix}$$
  mediante la descomposición jerárquica de subfórmulas según el árbol de análisis sintáctico.

  ### Desglose simbólico
  - Entradas canónicas: $p = (V^4, F^4)^T$, $q = (V^2, F^2, V^2, F^2)^T$, $r = (V, F)^4$.
  - Descomposición modular: Cada subexpresión $\psi_j$ ocupa una columna dedicada calculada a partir de columnas previamente resueltas.
  - Columna raíz / principal: Corresponde al conectivo dominante de menor jerarquía sintáctica.

  ### Síntesis didáctica
  La rigurosidad en el seguimiento fila por fila evita arrastrar errores de cálculo intermedio a lo largo de las 8 interpretaciones posibles.
definiciones_clave: |
  - **Tabla de verdad de 8 filas**: Arreglo que evalúa exhaustivamente el comportamiento de fórmulas con 3 átomos lógicos.
  - **Modularidad tabular**: Técnica de desglosar expresiones complejas en subfórmulas simples evaluadas en columnas individuales.
  - **Vector de evaluación de orden 3**: Columna resultante de 8 valores de verdad que clasifica la fórmula $\Phi(p, q, r)$.
propiedades_relaciones: |
  - **Demostración de leyes clásicas**: Permite validar formalmente leyes de orden 3 como la asociatividad $((p \land q) \land r \equiv p \land (q \land r))$ y distributividad $(p \land (q \lor r) \equiv (p \land q) \lor (p \land r))$.
  - **Complejidad algorítmica**: El costo de evaluación crece como $\mathcal{O}(m \cdot 2^n)$, donde $m$ es el número de conectivos y $n=3$.
ejemplo_guiado:
  enunciado: 'Construye la tabla de verdad de la fórmula $\Phi = (p \land q) \to r$ y halla su columna principal.'
  pasos:
    - 'Paso 1: Disponer las $8$ filas canónicas para las variables $p$, $q$ y $r$.'
    - 'Paso 2: Calcular la subcolumna auxiliar $(p \land q)$:
      - Fila 1 ($V,V,V$): $V \land V = V$
      - Fila 2 ($V,V,F$): $V \land V = V$
      - Fila 3 a 8: Como $p$ o $q$ es $F$, el resultado es $F$.
      - Vector: $[V, V, F, F, F, F, F, F]^T$.'
    - 'Paso 3: Identificar el conectivo principal: El condicional $\to$ entre la columna $(p \land q)$ y la columna $r$.'
    - 'Paso 4: Evaluar la columna principal $(p \land q) \to r$:
      - Fila 1: $V \to V = V$
      - Fila 2: $V \to F = F$ (único contraejemplo)
      - Filas 3 a 8: Como el antecedente $(p \land q)$ es $F$, el condicional es $V$.
      - Vector final: $[V, F, V, V, V, V, V, V]^T$.'
    - 'Paso 5: Concluir que la fórmula es una contingencia con $7$ valores verdaderos y $1$ falso.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la tabla de verdad de $(p \land q) \to r$, ¿en cuál fila se produce el único resultado Falso ($F$)?'
    choices:
      - {text: 'En la fila 2, donde $p=V, q=V$ y $r=F$', is_correct: true}
      - {text: 'En la fila 8, donde $p=F, q=F$ y $r=F$', is_correct: false}
      - {text: 'En la fila 1, donde $p=V, q=V$ y $r=V$', is_correct: false}
      - {text: 'En la fila 4, donde $p=V, q=F$ y $r=F$', is_correct: false}
    explanation: 'La alternativa correcta es ''En la fila 2, donde $p=V, q=V$ y $r=F$''. En esa fila el antecedente es $V$ y el consecuente es $F$, dando $V \to F = F$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la mejor estrategia para evitar confusiones al construir una tabla de verdad de 8 filas?'
    choices:
      - {text: 'Crear columnas intermedias para cada paréntesis antes de evaluar el conectivo principal', is_correct: true}
      - {text: 'Calcular toda la fórmula mentalmente en un solo paso directo', is_correct: false}
      - {text: 'Omitir la columna de la variable $r$ para trabajar con menos datos', is_correct: false}
      - {text: 'Evaluar únicamente las filas impares de la tabla', is_correct: false}
    explanation: 'La alternativa correcta es ''Crear columnas intermedias para cada paréntesis antes de evaluar el conectivo principal''. La modularidad asegura un cálculo libre de equivocaciones.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Dibujar una tabla de 8 filas y colocar las entradas canónicas para $p$ ($4V, 4F$), $q$ ($2V, 2F, 2V, 2F$) y $r$ ($V, F, \dots$).'
  - 'Paso 2: Resolver las negaciones unarias individuales presentes en la fórmula.'
  - 'Paso 3: Construir columnas auxiliares para los paréntesis y bloques binarios intermedios.'
  - 'Paso 4: Evaluar la columna principal operando sobre los bloques resueltos.'
  - 'Paso 5: Leer la columna principal y clasificar el resultado global.'
errores_correccion: |
  - **Error 1:** Cruzar filas por falta de alineación visual al trabajar con 8 filas. **Cómo corregirlo:** Trazar líneas horizontales claras para cada fila y verificar la correspondencia de la terna $(p, q, r)$ en cada paso.
  - **Error 2:** Evaluar el conectivo principal tomando como consecuente una variable equivocada. **Cómo corregirlo:** Escribir en el encabezado la referencia exacta de las columnas que se están relacionando (ej. "Columna 4 $\to$ Columna 3").
ejemplos:
  - titulo: 'Evaluación de ley distributiva'
    enunciado: '¿La columna de $p \land (q \lor r)$ es idéntica a la de $(p \land q) \lor (p \land r)$ en las 8 filas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, ambas generan exactamente el mismo vector veritativo de 8 posiciones por la ley distributiva.'
  - titulo: 'Número de combinaciones'
    enunciado: '¿Una tabla con 3 variables proposicionales abarca exactamente 8 interpretaciones?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $|\mathbb{V}^3| = 2^3 = 8$.'
  - titulo: 'Fila 1 de conjunción triple'
    enunciado: '¿Cuánto vale $p \land q \land r$ en la fila donde $p=V, q=V, r=V$?'
    alternativas:
      - '$V$'
      - '$F$'
      - 'Indeterminado'
    respuesta: '$V$'
    solucion_pasos:
      - '1. $V \land V \land V = V$.'
  - titulo: 'Falsedad en conjunción triple'
    enunciado: '¿En cuántas filas la fórmula $p \land q \land r$ resulta Falsa?'
    alternativas:
      - 'En $7$ filas'
      - 'En $4$ filas'
      - 'En $1$ fila'
    respuesta: 'En $7$ filas'
    solucion_pasos:
      - '1. Solo es $V$ en la fila 1; en las 7 restantes resulta $F$.'
errores_frecuentes:
  - 'La afirmación de que en una tabla de 3 variables se pueden suprimir filas si parecen repetitivas.'
  - 'La afirmación de que el orden de las 8 combinaciones canónicas no influye en la lectura comparativa de tablas.'
  - 'La afirmación de que una fórmula con 3 variables puede resolverse con 6 filas de evaluación.'
  - 'La afirmación de que los conectivos principales de fórmulas de 3 variables no requieren columnas auxiliares previas.'
  - 'La afirmación de que la columna de la tercera variable $r$ lleva bloques de dos verdades seguidas.'
afirmaciones_verdaderas:
  - 'La construcción de tablas de verdad con $3$ variables requiere $8$ filas y la estructuración modular de columnas auxiliares para cada subfórmula.'
  - 'La columna principal de una tabla de $8$ filas determina de forma exhaustiva si una fórmula de tres variables es tautología, contradicción o contingencia.'
al_terminar_debes_poder: |
  QUÉ: Construir, estructurar y evaluar tablas de verdad completas de $8$ filas con tres variables proposicionales.
  CÓMO: Disponer el esquema canónico $4-2-1$, calcular columnas auxiliares para subfórmulas y obtener el vector de la columna principal.
