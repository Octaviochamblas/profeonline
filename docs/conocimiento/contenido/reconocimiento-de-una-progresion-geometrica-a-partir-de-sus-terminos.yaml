semantic_id: MAT.NUM.PROG_GEOMETRICA.RECONOCIMIENTO
resumen_inicial: 'Reconocimiento de una progresión geométrica a partir de sus términos:
  concepto y desarrollo dentro de Progresión geométrica.'
explicacion_simple: No todo lo que crece rápido es una progresión geométrica. Algunas
  sucesiones tienen trampas. Así como en las aritméticas comprobábamos restando, aquí
  seremos los inspectores de la multiplicación.
explicacion_formal: 'Una secuencia sospechosa: $2, 6, 18, 36$.

  Vamos a auditarla paso a paso:

  1. $6 / 2 = 3$

  2. $18 / 6 = 3$

  3. $36 / 18 = 2$ $\rightarrow$ **¡Fallo!** Aunque empezó bien multiplicando por
  3, al final se multiplicó por 2. No es una P.G.


  También puedes toparte con secuencias alternadas como $5, -10, 20, -40$.

  1. $-10 / 5 = -2$

  2. $20 / -10 = -2$

  3. $-40 / 20 = -2$

  ¡Éxito! Todas las divisiones dan $-2$. Es una P.G. perfectamente válida.'
definiciones_clave: '- **Reconocimiento de una progresión geométrica a partir de sus
  términos**: Concepto fundamental dentro del estudio de Progresión geométrica.'
propiedades_relaciones: '- **Propiedades de Reconocimiento de una progresión geométrica
  a partir de sus términos**: Relaciones de cambio y fórmulas estructurales de progresión
  geométrica.'
ejemplo_guiado:
  enunciado: Resuelve un ejercicio práctico aplicando reconocimiento de una progresión
    geométrica a partir de sus términos.
  pasos:
  - Identificar los datos y términos conocidos de la sucesión.
  - Aplicar la regla o fórmula propia de reconocimiento de una progresión geométrica
    a partir de sus términos.
  - Efectuar las operaciones algebraicas o aritméticas.
  - Verificar y redactar el resultado final de forma clara.
