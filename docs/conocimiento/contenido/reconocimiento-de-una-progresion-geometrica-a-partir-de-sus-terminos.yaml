  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Toma el segundo número y divídelo por el primero.'
- 'Paso 2: Toma el tercer número y divídelo por el segundo.'
- 'Paso 3: Sigue así con todos los números que te hayan dado.'
- 'Paso 4: Si todas las divisiones dan el mismo resultado exacto, es una P.G. Si una sola
  falla, la rechazas.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en reconocimiento de una progresión geométrica a partir de sus términos.
ejemplos:
- titulo: Desenmascarando al impostor
  enunciado: ¿La secuencia $1, 4, 9, 16$ es una progresión geométrica?
  solucion_pasos:
  - Dividimos 4/1 = 4.
  - Dividimos 9/4 = 2.25.
  - Como 4 y 2.25 son distintos, no necesitamos seguir. NO es geométrica. (En realidad, son
    los cuadrados perfectos).
- titulo: Ejemplo 1
  enunciado: ¿Es 4, 12, 36, 100 una progresión geométrica?
  alternativas:
  - 'No'
  - Sí
  - Solo los tres primeros términos
  respuesta: 'No'
  solucion_pasos:
  - 36 dividido entre 12 es 3, pero 100 dividido entre 36 no es 3.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de las siguientes sucesiones sí es geométrica?
  alternativas:
  - 1, -3, 9, -27
  - 1, 3, 6, 10
  - 2, 5, 8, 11
  respuesta: 1, -3, 9, -27
  solucion_pasos:
  - Todos sus cocientes consecutivos son -3.
- titulo: ¿Se puede confirmar una progresión geométrica revisando solo dos términos?
  respuesta: 'No'
  solucion_pasos:
  - Hace falta comprobar el cociente en todos los pares consecutivos disponibles.
- titulo: ¿Una progresión geométrica puede tener razón fraccionaria, como 1/2?
  respuesta: Sí
  solucion_pasos:
  - Por ejemplo 80, 40, 20, 10, con razón constante 1/2.
errores_frecuentes:
- Comprobar solo los primeros dos números y dar por hecho que la regla se cumple para el resto.
- Creer que si tiene números negativos o fracciones no puede ser geométrica. Las progresiones
  con razón fraccionaria o negativa son las favoritas en la PAES.
- Declarar una sucesión como geométrica revisando solo el primer cociente.
- Pensar que una progresión geométrica no puede tener razón negativa o fraccionaria.
- Confundir una progresión geométrica con los cuadrados o cubos perfectos por su rápido crecimiento.
afirmaciones_verdaderas:
- La formulación de reconocimiento de una progresión geométrica a partir de sus términos mantiene
  la regularidad de la sucesión.
- Para confirmar que una sucesión es geométrica hay que comprobar el cociente en todos los
  pares de términos consecutivos, no solo en el primero.
al_terminar_debes_poder: Resolver problemas prácticos utilizando reconocimiento de una progresión
  geométrica a partir de sus términos.
