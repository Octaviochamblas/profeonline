semantic_id: MAT.NUM.PROG_GEOMETRICA.RECONOCIMIENTO
resumen_inicial: 'El reconocimiento de una progresión geométrica comprueba que todos los cocientes consecutivos sean constantes ($\frac{a_2}{a_1} = \frac{a_3}{a_2} = \dots = r$) o que el cuadrado del término medio iguale al producto de sus extremos.'
explicacion_simple: |
  Para verificar si una lista de números es una **progresión geométrica**:
  - Divides cada número entre el número que está justo a su izquierda:
    $$\frac{a_2}{a_1}, \quad \frac{a_3}{a_2}, \quad \frac{a_4}{a_3}, \dots$$
  - Si **todas las divisiones dan exactamente el mismo resultado**, ¡es una PG!
  - Si alguna división da un número diferente, **NO es una PG**.
  - Por ejemplo:
    - En $3, 6, 12, 24, 48$: $\frac{6}{3}=2, \frac{12}{6}=2, \frac{24}{12}=2 \implies$ Sí es PG ($r=2$).
    - En $2, 4, 6, 8$: $\frac{4}{2}=2, \frac{6}{4}=1,5 \implies$ No es PG (es una PA con $d=2$).

  ![Reconocimiento de una PG](/static/img/nodos/reconocimiento-de-una-progresion-geometrica-a-partir-de-sus-terminos-intro.svg)
explicacion_formal: |
  ### Definición formal
  Una secuencia finita de términos no nulos $\{a_1, a_2, \dots, a_k\}$ ($k \ge 3$) es una **progresión geométrica** si y solo si se verifica la igualdad de todos los cocientes consecutivos:
  $$\frac{a_2}{a_1} = \frac{a_3}{a_2} = \frac{a_4}{a_3} = \dots = \frac{a_k}{a_{k-1}} = r \quad (r \in \mathbb{R}^*)$$

  ### Criterio de la Media Geométrica Local
  Para cualquier trío consecutivo $(a_{n-1}, a_n, a_{n+1})$, se debe cumplir la propiedad de media geométrica:
  $$(a_n)^2 = a_{n-1} \cdot a_{n+1} \iff |a_n| = \sqrt{a_{n-1} \cdot a_{n+1}}$$

  ### Comparación Estructural: PA vs PG
  - **PA (Aritmética)**: Diferencias constantes $a_{n+1} - a_n = d$ (Crecimiento lineal).
  - **PG (Geométrica)**: Cocientes constantes $\frac{a_{n+1}}{a_n} = r$ (Crecimiento exponencial).

  ### Síntesis didáctica
  - Regla de prueba: $\frac{a_{k+1}}{a_k} = r$ constante para todo $k$.
  - Propiedad de simetría: $(a_k)^2 = a_{k-1} \cdot a_{k+1}$.
definiciones_clave: |
  - **Cociente consecutivo**: División entre un término y su inmediato predecesor.
  - **Media geométrica local**: Término medio cuyo cuadrado es igual al producto de los términos adyacentes.
  - **Invariante multiplicativo**: Razón $r$ que se conserva constante a lo largo de toda la progresión.
propiedades_relaciones: |
  - **Verificación completa**: Para asegurar que una lista es PG, deben comprobarse todas las divisiones consecutivas.
  - **Crecimiento acelerado**: Los términos de una PG con $|r| > 1$ crecen mucho más rápidamente que los de una PA.
ejemplo_guiado:
  enunciado: 'Determina si la secuencia $(2, 6, 18, 54, 162)$ es una progresión geométrica y comprueba el criterio de la media geométrica en el término central $a_3 = 18$.'
  imagen: '/static/img/nodos/reconocimiento-de-una-progresion-geometrica-a-partir-de-sus-terminos-ejemplos.svg'
  pasos:
    - 'Paso 1: Calculamos todas las divisiones consecutivas:'
    - '  - $\frac{a_2}{a_1} = \frac{6}{2} = 3$'
    - '  - $\frac{a_3}{a_2} = \frac{18}{6} = 3$'
    - '  - $\frac{a_4}{a_3} = \frac{54}{18} = 3$'
    - '  - $\frac{a_5}{a_4} = \frac{162}{54} = 3$'
    - 'Paso 2: Como todos los cocientes son iguales a $3$, **sí es una progresión geométrica con $r = 3$**.'
    - 'Paso 3: Verificamos la media geométrica en $a_3 = 18$: $(18)^2 = 324$ y $a_2 \cdot a_4 = 6 \cdot 54 = 324$. La igualdad se cumple estrictamente.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad cumplen obligatoriamente tres términos consecutivos $(x, y, z)$ de una progresión geométrica?'
    choices:
      - {text: '$y^2 = x \cdot z$ (el cuadrado del medio es igual al producto de los extremos)', is_correct: true}
      - {text: '$y = \frac{x + z}{2}$ (media aritmética)', is_correct: false}
      - {text: '$y = x + z$', is_correct: false}
      - {text: '$x \cdot y \cdot z = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$y^2 = x \cdot z$ (el cuadrado del medio es igual al producto de los extremos)''. En toda PG, el término central es la media geométrica de sus vecinos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes secuencias es una progresión geométrica?'
    choices:
      - {text: '$(4, 12, 36, 108)$, con razón constante $r = 3$', is_correct: true}
      - {text: '$(4, 8, 12, 16)$, que es una progresión aritmética', is_correct: false}
      - {text: '$(1, 4, 9, 16)$, de cuadrados perfectos', is_correct: false}
      - {text: '$(2, 4, 7, 11)$, con diferencias crecientes', is_correct: false}
    explanation: 'La alternativa correcta es ''$(4, 12, 36, 108)$, con razón constante $r = 3$''. Los cocientes son constantes: $12/4 = 3, 36/12 = 3, 108/36 = 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular todas las divisiones consecutivas $\frac{a_{k+1}}{a_k}$ para $k = 1, 2, \dots, n-1$.'
  - 'Paso 2: Comparar los valores de los cocientes resultantes.'
  - 'Paso 3: Si todos los cocientes son exactamente iguales a una constante $r$, concluir que es una PG.'
  - 'Paso 4: Si al menos un cociente difiere, concluir que no es una progresión geométrica.'
errores_correccion: |
  - **Error 1:** Evaluar la división solo en el primer par y asumir apresuradamente que es PG. **Cómo corregirlo:** Se deben **calcular todos los cocientes consecutivos** de la lista para certificar la constancia.
  - **Error 2:** Confundir secuencias aritméticas ($2, 4, 6, 8$) con geométricas. **Cómo corregirlo:** En $2, 4, 6, 8$ las restas son constantes ($+2$), pero las divisiones **no son constantes** ($4/2 = 2 \neq 6/4 = 1,5$).
ejemplos:
  - titulo: 'Verificación de PG con fracciones'
    enunciado: '¿La secuencia $32, 16, 8, 4, 2$ es una progresión geométrica?'
    alternativas:
      - 'Sí, es una PG con razón constante $r = \frac{1}{2}$'
      - 'No, porque los números van disminuyendo'
      - 'No, las divisiones no son iguales'
    respuesta: 'Sí, es una PG con razón constante $r = \frac{1}{2}$'
    solucion_pasos:
      - '1. $16/32 = 1/2, 8/16 = 1/2, 4/8 = 1/2, 2/4 = 1/2$.'
  - titulo: 'Detección de no-PG'
    enunciado: '¿La secuencia $5, 10, 15, 20$ es una progresión geométrica?'
    alternativas:
      - 'No, porque $10/5 = 2$ pero $15/10 = 1,5$ (cocientes distintos)'
      - 'Sí, con razón $r = 2$'
      - 'Sí, con razón $r = 5$'
    respuesta: 'No, porque $10/5 = 2$ pero $15/10 = 1,5$ (cocientes distintos)'
    solucion_pasos:
      - '1. No es PG porque los cocientes no son constantes (es una PA con $d=5$).'
  - titulo: 'Media geométrica de tres términos'
    enunciado: 'En la PG $(4, x, 36)$, ¿el valor positivo de $x$ es $12$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $x^2 = 4 \cdot 36 = 144 \implies x = \sqrt{144} = 12$.'
  - titulo: 'PG con signos alternados'
    enunciado: '¿La lista $1, -3, 9, -27, 81$ es una progresión geométrica válida?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Todos los cocientes dan $-3$.'
errores_frecuentes:
  - 'Una sucesión es clasificada como progresión geométrica verificando la división únicamente en el primer par de términos.'
  - 'La secuencia de los múltiplos de tres ($3, 6, 9, 12, 15$) es una progresión geométrica.'
  - 'El término central de tres elementos consecutivos en una PG es igual a la semisuma de los extremos.'
  - 'Una sucesión con números decrecientes no puede ser una progresión geométrica.'
  - 'La media geométrica de dos números positivos puede ser un número negativo.'
afirmaciones_verdaderas:
  - 'Una secuencia es una progresión geométrica si y solo si la división entre cada término y su antecesor es siempre la misma constante $r$.'
  - 'En cualquier progresión geométrica de términos positivos, cada término no extremo es la media geométrica de sus vecinos: $a_n = \sqrt{a_{n-1} \cdot a_{n+1}}$.'
