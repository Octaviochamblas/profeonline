resumen_inicial: El reconocimiento de una progresión geométrica exige comprobar que
  el cociente $\frac{x_{k+1}}{x_k}$ sea idéntico para todos los pares de términos
  consecutivos de la lista dada.
explicacion_simple: Para verificar si una lista de números es una progresión geométrica,
  dividimos cada número entre el anterior. Si todas las divisiones dan exactamente
  el mismo resultado, la secuencia es geométrica.
explicacion_formal: 'Dada la secuencia $(x_1, x_2, x_3, \dots, x_N)$, el **Criterio
  de Reconocimiento P.G.** evalúa el sistema de cocientes:


  $$q_1 = \frac{x_2}{x_1}, \quad q_2 = \frac{x_3}{x_2}, \dots, q_{N-1} = \frac{x_N}{x_{N-1}}$$


  $$\text{Es P.G. } \iff q_1 = q_2 = \dots = q_{N-1} = r \neq 0$$'
definiciones_clave: '- **Reconocimiento P.G.**: Verificación de cocientes constantes
  $q_k = r$ en la muestra.'
propiedades_relaciones: '- **Sensibilidad a cociente**: Si un solo cociente varía,
  la secuencia NO es una progresión geométrica.'
ejemplo_guiado:
  enunciado: Determine si la sucesión $(2, 6, 18, 54, 160)$ es una progresión geométrica.
  pasos:
  - 'Paso 1: $a_2 / a_1 = 6 / 2 = 3$.'
  - 'Paso 2: $a_3 / a_2 = 18 / 6 = 3$.'
  - 'Paso 3: $a_4 / a_3 = 54 / 18 = 3$.'
  - 'Paso 4: $a_5 / a_4 = 160 / 54 \approx 2,96$.'
  - 'Conclusión: NO es una P.G. porque el último cociente ($160/54 \approx 2,96$)
    es distinto a $3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición debe cumplirse para confirmar que una lista de números
    forma una progresión geométrica?
  choices:
  - text: Que la división entre cada término y su anterior (an+1 / an) sea exactamente
      la misma constante en toda la lista
    is_correct: true
  - text: Que las restas entre números den siempre el mismo valor
    is_correct: false
  - text: Que los números sean todos impares
    is_correct: false
  - text: Que la lista empiece en 1
    is_correct: false
  explanation: La alternativa correcta es 'Que la división entre cada término y su
    anterior (an+1 / an) sea exactamente la misma constante en toda la lista'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (2, 6, 18, 54, 160), ¿por qué NO es una P.G.?
  choices:
  - text: Porque la última división (160 / 54) no dio exactamente 3
    is_correct: true
  - text: Porque empezó en 2
    is_correct: false
  - text: Because es una suma
    is_correct: false
  - text: Porque los números son pares
    is_correct: false
  explanation: La alternativa correcta es 'Porque la última división (160 / 54) no
    dio exactamente 3'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de reconocer si una secuencia es
  una progresión geométrica evaluando la constancia de sus cocientes sucesivos.
semantic_id: MAT.NUM.PROG_GEOMETRICA.RECONOCIMIENTO
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una razón multiplicativa constante
  $r = \frac{a_{n+1}}{a_n}$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 \cdot r^{n-1}$ o de la
  suma $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
- 'Paso 3: Resolver numéricamente o con logaritmos el parámetro solicitado ($a_n,
  a_1, r, n$ o $S_n$).'
errores_correccion: '- **Error 1: Elevar la razón $r$ a la potencia $n$ en lugar de
  $(n-1)$ en el término general ($a_n = a_1 \cdot r^n$).** **Cómo corregirlo:** La
  razón $r$ se aplica a partir de la segunda posición, por lo que el exponente correcto
  es $(n-1)$.


  - **Error 2: Usar la fórmula de la suma de progresión aritmética en una progresión
  geométrica.** **Cómo corregirlo:** En la P.G. la suma DEBE utilizar el factor multiplicativo
  $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_GEOMETRICA.RECONOCIMIENTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión geométrica.
- titulo: Ejemplo 2
  enunciado: Verificación de la razón constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} / a_n = r$.
- titulo: ¿Es constante el cociente entre términos consecutivos en una P.G.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión geométrica.
- titulo: ¿Corresponde la P.G. a una función exponencial discreta?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a_n = a_1 \cdot r^{n-1}$ es una potencia de base $r$.
errores_frecuentes:
- Elevar la razón r al exponente n en lugar de multiplicar por r^(n-1) al calcular
  an.
- Restar los términos en lugar de calcular el cociente de división para determinar
  la razón r.
- Usar la fórmula del promedio de Gauss propia de la progresión aritmética en una
  progresión geométrica.
- Declarar que una razón geométrica menor que 1 genera términos negativos en la secuencia.
- Declarar la razón porcentual P% con el factor multiplicativo r = 1 + P/100.
afirmaciones_verdaderas:
- Una progresión geométrica tiene una razón constante $r = \frac{a_{n+1}}{a_n}$ entre
  términos consecutivos.
- El término general de una P.G. se calcula mediante la función exponencial $a_n =
  a_1 \cdot r^{n-1}$.
