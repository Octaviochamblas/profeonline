semantic_id: MAT.NUM.PROG_GEOMETRICA.RECONOCIMIENTO
resumen_inicial: 'El reconocimiento de una progresión geométrica exige comprobar que las divisiones entre todos los pares de términos consecutivos adyacentes de la muestra entreguen exactamente la misma constante $r$: $\frac{a_{n+1}}{a_n} = r$.'
explicacion_simple: |
  Si te presentan una lista de números (por ejemplo: $2, 6, 18, 54, 162$) y te preguntan **si es o no una progresión geométrica**:
  1. Divides el 2º término entre el 1º: $6 \div 2 = 3$.
  2. Divides el 3º término entre el 2º: $18 \div 6 = 3$.
  3. Divides el 4º término entre el 3º: $54 \div 18 = 3$.
  4. Divides el 5º término entre el 4º: $162 \div 54 = 3$.
  Como absolutamente todas las divisiones dieron el mismo número ($3$), **la lista SÍ es una progresión geométrica**.
explicacion_formal: |
  ### Definición formal
  Dada una secuencia finita de términos $(a_1, a_2, a_3, \dots, a_k)$ con $a_i \neq 0$, es una **progresión geométrica** si y solo si los cocientes consecutivos $q_i$ satisfacen la condición de constancia multiplicativa:
  $$q_1 = q_2 = \dots = q_{k-1} = r \quad (r \in \mathbb{R} \setminus \{0\})$$
  donde $q_i = \frac{a_{i+1}}{a_i}$.

  ### Criterio de discriminación con la P.A.
  - **Test Aritmético (P.A.)**: Restas constantes $a_2 - a_1 = a_3 - a_2 = d$.
  - **Test Geométrico (P.G.)**: Cocientes constantes $\frac{a_2}{a_1} = \frac{a_3}{a_2} = r$.

  ### Síntesis didáctica
  - Test de constancia de división: $\frac{a_2}{a_1} = \frac{a_3}{a_2} = \frac{a_4}{a_3} = \dots = r$.
  - Un solo cociente distinto descalifica la secuencia como progresión geométrica.
definiciones_clave: |
  - **Test de división constante**: Proceso de verificar la igualdad de los cocientes de todos los pares adyacentes.
  - **Invarianza cociente**: Propiedad por la cual la razón entre términos consecutivos no cambia a lo largo de la secuencia.
  - **Discriminante de patrón**: Prueba matemática que distingue si un crecimiento es aditivo o multiplicativo.
propiedades_relaciones: |
  - **Sensibilidad a la muestra**: Se deben comprobar todos los cocientes de la lista dada, pues una secuencia puede comportarse como P.G. al inicio y romper la regla al final.
  - **Invarianza de signo alternado**: Si la lista alterna signos ($+,-,+,-$), los cocientes deben ser todos negativos e iguales a $r < 0$.
ejemplo_guiado:
  enunciado: 'Determina si la secuencia $3, -6, 12, -24, 48$ es una progresión geométrica.'
  pasos:
    - 'Paso 1: Evaluamos el primer cociente: $\frac{-6}{3} = -2$.'
    - 'Paso 2: Evaluamos el segundo cociente: $\frac{12}{-6} = -2$.'
    - 'Paso 3: Evaluamos el tercer cociente: $\frac{-24}{12} = -2$.'
    - 'Paso 4: Evaluamos el cuarto cociente: $\frac{48}{-24} = -2$. Como todos los cocientes son iguales a $-2$, la secuencia **sí es una progresión geométrica de razón $r = -2$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué comprobación matemática demuestra que una lista dada de números constituye una progresión geométrica?'
    choices:
      - {text: 'Dividir cada término entre su antecesor y verificar que todos los cocientes sean exactamente iguales a una constante $r$', is_correct: true}
      - {text: 'Restar el primer número al último número y verificar que el resultado sea un número par', is_correct: false}
      - {text: 'Multiplicar todos los elementos y comprobar que dé 1', is_correct: false}
      - {text: 'Elevar cada número al cuadrado y sumar los resultados', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir cada término entre su antecesor y verificar que todos los cocientes sean exactamente iguales a una constante $r$''. Test de división constante.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la secuencia $5, 10, 15, 20, 25$, ¿es una progresión geométrica?'
    choices:
      - {text: 'No, porque los cocientes cambian ($\frac{10}{5} = 2$, mientras que $\frac{15}{10} = 1,5$); es una progresión aritmética', is_correct: true}
      - {text: 'Sí, porque aumenta de 5 en 5', is_correct: false}
      - {text: 'Sí, porque todos los términos son múltiplos de 5', is_correct: false}
      - {text: 'Sí, con razón $r = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''No, porque los cocientes cambian ($\frac{10}{5} = 2$, mientras que $\frac{15}{10} = 1,5$); es una progresión aritmética''. Sus restas son constantes, no sus cocientes.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar los elementos de la secuencia ordenada.'
  - 'Paso 2: Calcular la división de cada término entre el término anterior ($\frac{a_2}{a_1}, \frac{a_3}{a_2}, \dots$).'
  - 'Paso 3: Comparar numéricamente todos los cocientes obtenidos.'
  - 'Paso 4: Si todos los cocientes son iguales, la lista es una P.G. de razón $r$; si no lo son, no es P.G.'
errores_correccion: |
  - **Error 1:** Probar solo los dos primeros términos sin revisar los demás. **Cómo corregirlo:** Se deben **calcular los cocientes de TODOS los pares conocidos de la secuencia**.
  - **Error 2:** Declarar que una progresión es geométrica porque aumenta de 5 en 5. **Cómo corregirlo:** Aumentar sumando 5 es una **progresión aritmética**; la geométrica aumenta **multiplicando**.
ejemplos:
  - titulo: 'P.G. multiplicativa válida'
    enunciado: '¿La lista $1, 4, 16, 64, 256$ es una P.G.?'
    alternativas:
      - 'Sí, todos los cocientes valen 4'
      - 'No, porque la diferencia es 3'
      - 'No, porque la razón cambia'
    respuesta: 'Sí, todos los cocientes valen 4'
    solucion_pasos:
      - '1. Cocientes: $4/1 = 4, 16/4 = 4, 64/16 = 4, 256/64 = 4$.'
      - '2. La razón $r = 4$ es constante $\implies$ Sí es P.G.'
  - titulo: 'Secuencia aritmética no geométrica'
    enunciado: '¿La lista $10, 20, 30, 40$ es una P.G.?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. $20/10 = 2$, pero $30/20 = 1,5$. No es P.G. (es P.A. de diferencia 10).'
  - titulo: 'P.G. fraccionaria válida'
    enunciado: '¿La lista $81, 27, 9, 3, 1$ es una P.G.?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cocientes: $27/81 = 1/3, 9/27 = 1/3, 3/9 = 1/3, 1/3 = 1/3$. $r = 1/3$.'
  - titulo: 'Secuencia no geométrica con trampa'
    enunciado: '¿La lista $2, 4, 8, 16, 30$ es una P.G.?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Los primeros cocientes dan 2, pero el último da $30/16 = 1,875$.'
errores_frecuentes:
  - 'Validar que una secuencia es geométrica probando únicamente el primer cociente.'
  - 'Una razón geométrica menor que 1 genera términos negativos en la secuencia.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Un patrón de incremento aditivo constante equivale algebraicamente a un patrón de multiplicación constante.'
  - 'No considerar la alternancia de signos al calcular los cocientes de progresiones con razón negativa.'
afirmaciones_verdaderas:
  - 'Una secuencia es una progresión geométrica si y solo si las divisiones entre todos los términos consecutivos adyacentes arrojan la misma constante $r$.'
  - 'Si el cociente entre cualquier par de términos consecutivos difiere de los demás, la secuencia no es una progresión geométrica.'
al_terminar_debes_poder: 'Reconocer si una secuencia numérica dada es o no una progresión geométrica comprobando la constancia de $\frac{a_{n+1}}{a_n}$.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
