semantic_id: MAT.ALG.VALORIZACION.MULTIPLES_VARIABLES
resumen_inicial: 'Valorización de expresiones con múltiples variables: traducción,
  reglas y aplicación práctica en Valorización de expresiones algebraicas.'
explicacion_simple: Muchas fórmulas en la vida real dependen de más de un factor.
  El área de un rectángulo depende de la base y de la altura. Al valorizar, simplemente
  tenemos que reemplazar cada letra por su número correspondiente, sin mezclarlas.
explicacion_formal: '### Definición formal


  La yuxtaposición en álgebra (letras juntas) siempre implica multiplicación. Nunca
  es concatenación de dígitos.


  ### Desarrollo didáctico


  Consideremos la expresión $5xy + z$.

  Si nos dan los valores $x=2$, $y=3$, $z=4$:

  1. Reemplazamos la $x$ por (2).

  2. Reemplazamos la $y$ por (3).

  3. Reemplazamos la $z$ por (4).

  La expresión queda: $5(2)(3) + (4)$.


  El error fatal aquí es leer $xy$ como un número de dos cifras (ej. si $x=2$ e $y=3$,
  pensar que $xy$ es 23). Falso. Es una multiplicación: $2 \cdot 3 = 6$. Por eso el
  uso de paréntesis es obligatorio.'
definiciones_clave: '- **Valorización de expresiones con múltiples variables**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de valorización de expresiones con múltiples variables.'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de valorización
    de expresiones con múltiples variables.
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a valorización de expresiones
    con múltiples variables.
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
