procedimiento:
- 'Paso 1: Asigna a cada variable su valor numérico específico sin confundirlas.'
- 'Paso 2: Sustituye las letras en la expresión por los números entre paréntesis.'
- 'Paso 3: Si dos o más letras estaban pegadas (ej. abc), multiplica sus valores numéricos.'
- 'Paso 4: Resuelve el resto de las operaciones respetando la jerarquía.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  valorización de expresiones con múltiples variables.
ejemplos:
- titulo: Tres letras, un resultado
  enunciado: Valoriza $a^2 + bc$, sabiendo que a=3, b=2, c=5.
  solucion_pasos:
  - 'Reemplazamos: (3)^2 + (2)(5).'
  - 'Resolvemos la potencia: 9 + (2)(5).'
  - 'Resolvemos la multiplicación: 9 + 10.'
  - 'Sumamos: 19.'
- titulo: La energía potencial elástica de un resorte se calcula con la fórmula $E
    = \frac12 k x^2$, d
  enunciado: 'La energía potencial elástica de un resorte se calcula con la fórmula
    $E = \frac12 k x^2$, donde $k$ es la constante del resorte y $x$ es la deformación.
    Si para un experimento $k = 100$ y $x = 4$, ¿cuál es el valor de la energía $E$?
    (v1)


    Opciones: A) $800$ · B) $160000$ · C) $400$ · D) $200$'
  solucion_pasos:
  - 'Sustituimos: $E = \frac{1}{2}(100)(4)^2$. Por jerarquía, primero la potencia:
    $4^2 = 16$. Luego la multiplicación: $\frac{1}{2} \cdot 100 \cdot 16 = 50 \cdot
    16 = 800$.'
  - 'Respuesta: $800$'
- titulo: 'Respecto de «Valorización de expresiones con múltiples variables»: ¿Es
    correcta esta caracte'
  enunciado: 'Respecto de «Valorización de expresiones con múltiples variables»: ¿Es
    correcta esta caracterización? «Al valorizar **Múltiples Variables**, se debe
    sustituir cada letra por su respectivo valor numérico de forma independiente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al valorizar **Múltiples Variables**,
    se debe sustituir cada letra por su respectivo valor numérico de forma independiente.'
- titulo: 'Respecto de «Valorización de expresiones con múltiples variables»: ¿Es
    válida esta afirmació'
  enunciado: 'Respecto de «Valorización de expresiones con múltiples variables»: ¿Es
    válida esta afirmación? «Juntar los números en lugar de multiplicarlos (leer $ab$
    como $23$ en lugar de $2 \cdot 3$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al valorizar **Múltiples Variables**,
    se debe sustituir cada letra por su respectivo valor numérico de forma independiente.'
errores_frecuentes:
- Juntar los números en lugar de multiplicarlos (leer $ab$ como $23$ en lugar de $2
  \cdot 3$).
- Reemplazar el valor de una variable en el lugar de otra (confundir el valor de $x$
  con el de $y$).
- Interpretar que las variables deben sumarse ($1+2+3=6$).
- Interpretar que el resultado siempre será un número negativo.
- Para «Al valorizar un término algebraico que contiene variables yuxtapuestas como
  $xyz$, si $x=1, y=2, z=3$, ¿cuál es el error conceptual más grave al interpretar
  el resultado de la sustitución? (v1)», la respuesta correcta es Creer que se debe
  multiplicar por $3$ debido a la cantidad de letras.
afirmaciones_verdaderas:
- La traducción de valorización de expresiones con múltiples variables preserva el
  significado matemático del enunciado.
al_terminar_debes_poder: Traducir y evaluar expresiones que involucren valorización
