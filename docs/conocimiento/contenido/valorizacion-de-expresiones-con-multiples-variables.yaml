semantic_id: MAT.ALG.VALORIZACION.MULTIPLES_VARIABLES
resumen_inicial: La valorización de expresiones con múltiples variables consiste en calcular el valor numérico final sustituyendo simultáneamente dos o más letras distintas por sus valores asignados y ordenando los términos.
explicacion_simple: "Muchas expresiones algebraicas y fórmulas de física o geometría contienen **dos o más variables distintas** (ej: $x, y, z$ o $a, b, c$):\n- **Estrategia multivariable**:\n  - **Paso 1**: Asocia cada valor constante a su letra correspondiente con precisión.\n  - **Paso 2**: Reemplaza todas las variables de la expresión **al mismo tiempo usando paréntesis**.\n  - **Paso 3**: Resuelve cada término independientemente agrupando potencias y productos.\n  - **Paso 4**: Suma o resta los valores de los términos para hallar el resultado final.\n- **Ejemplo**: Valorizar el polinomio de dos variables $2x^2 y - 3x y^2 + 5$ para $x = 2$ e $y = -1$:\n  - Término 1: $2(2)^2(-1) = 2(4)(-1) = \\mathbf{-8}$.\n  - Término 2: $-3(2)(-1)^2 = -3(2)(1) = \\mathbf{-6}$.\n  - Término 3: constante $\\mathbf{+5}$.\n  - Suma final: $-8 - 6 + 5 = \\mathbf{-9}$.\n\n![Valorización con Múltiples Variables](/static/img/nodos/valorizacion-de-expresiones-con-multiples-variables-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $E(x_1, x_2, \dots, x_n) \in \mathbb{R}[x_1, \dots, x_n]$ una expresión multivariable sobre $n$ símbolos independientes. La valorización multivariable es el homomorfismo de evaluación en la tupla de constantes $C = (c_1, c_2, \dots, c_n) \in \mathbb{R}^n$:


  $$\operatorname{ev}_C(E) = E(c_1, c_2, \dots, c_n)$$


  ### Orden de Sustitución y Simetría de las Variables

  1. **Independencia del orden de asignación**: El orden en que se efectúa la sustitución de las variables individuales no altera la tupla resultante $C$.

  2. **Funciones Simétricas**: Si $E(x, y) = E(y, x)$ (ej: $x^2 + y^2 + xy$), permutar las constantes asignadas a $x$ e $y$ produce exactamente el mismo valor numérico.


  ### Síntesis didáctica

  La valorización de expresiones con múltiples variables permite calcular volúmenes geométricos ($V = \pi r^2 h$), fuerza gravitacional ($F = G \frac{m_1 m_2}{r^2}$) y ecuaciones de estado multivariadas.

  '
definiciones_clave: '- **Valorización multivariable**: Evaluación de una expresión algebraica que depende de dos o más símbolos independientes.

  - **Tupla de asignación $(c_1, c_2, \dots, c_n)$**: Conjunto ordenado de constantes numéricas asociadas a cada variable.

  - **Función simétrica**: Expresión donde intercambiar los valores de las variables mantiene inalterado el resultado.

  '
propiedades_relaciones: '- **Invarianza por simetría**: En expresiones simétricas como $a^2 + b^2$, asignar $(a=2, b=3)$ o $(a=3, b=2)$ da la misma valorización ($13$).

  - **Anulación por factor cero**: Si un término posee el producto $x \cdot y$ y cualquiera de las dos variables es $0$, todo ese término se reduce a $0$.

  '
ejemplo_guiado:
  enunciado: Calcula el valor numérico de la expresión $\frac{a^2 + 2bc}{a - b}$ para $a = 4$, $b = -2$ y $c = 3$.
  pasos:
  - 'Paso 1: Sustituimos las tres variables con paréntesis: $a = 4$, $b = -2$, $c = 3$.'
  - 'Paso 2: Formamos el numerador: $(4)^2 + 2(-2)(3) = 16 + (-12) = 16 - 12 = 4$.'
  - 'Paso 3: Formamos el denominador: $4 - (-2) = 4 + 2 = 6$.'
  - 'Paso 4: Escribimos la fracción resultante: $\frac{4}{6}$.'
  - 'Paso 5: Simplificamos dividiendo numerador y denominador entre 2: $\frac{2}{3}$.'
  - 'Conclusión: El valor numérico final es **$\frac{2}{3}$**.'
  imagen: /static/img/nodos/valorizacion-de-expresiones-con-multiples-variables-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué propiedad cumple la valorización de una expresión algebraica simétrica $E(x,y)$ como $x^2 + y^2$ al permutar los valores de sus variables?
  choices:
  - text: El resultado numérico permanece inalterado al intercambiar los valores asignados a las variables
    is_correct: true
  - text: El resultado cambia de signo obligatoriamente
    is_correct: false
  - text: El resultado se reduce a cero
    is_correct: false
  - text: La expresión deja de ser valorizable
    is_correct: false
  explanation: La alternativa correcta es 'El resultado numérico permanece inalterado al intercambiar los valores asignados a las variables'. Definición de expresión simétrica.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor numérico de $3xy - 2z$ para $x = 2$, $y = -1$ y $z = -4$?
  choices:
  - text: El valor es $2$, obtenido al calcular $3(2)(-1) - 2(-4) = -6 + 8 = 2$
    is_correct: true
  - text: El valor es $-14$
    is_correct: false
  - text: El valor es $14$
    is_correct: false
  - text: El valor es $-2$
    is_correct: false
  explanation: 'La alternativa correcta es ''El valor es $2$, obtenido al calcular $3(2)(-1) - 2(-4) = -6 + 8 = 2$''. Término 1: $-6$, término 2: $+8 \implies 2$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar con claridad el valor numérico asignado a cada letra o variable individual.'
- 'Paso 2: Sustituir todas las variables simultáneamente utilizando paréntesis alrededor de cada constante.'
- 'Paso 3: Calcular las potencias y productos de cada término de forma aislada.'
- 'Paso 4: Reducir los valores numéricos obtenidos en los numeradores, denominadores y sumas generales.'
errores_correccion: '- **Error 1:** Cruzar o intercambiar los valores asignados a variables distintas (reemplazar $x = 3, y = 5$ al revés). **Cómo corregirlo:** Se debe **asociar cada constante a su variable explícita** antes de sustituir.

  - **Error 2:** Excluir el signo de resta del denominador en expresiones fraccionarias multivariables ($a - b$ con $b = -2$). **Cómo corregirlo:** Usar paréntesis **$a - (-b) = a + b$** para no perder el signo negativo del denominador.

  '
ejemplos:
- titulo: Tres variables simples
  enunciado: ¿Cuál es el valor de $a + 2b - c$ para $a = 5$, $b = 3$ y $c = 4$?
  alternativas:
  - $7$
  - $11$
  - $15$
  respuesta: $7$
  solucion_pasos:
  - '1. Sustitución: $5 + 2(3) - 4$.'
  - '2. Operaciones: $5 + 6 - 4 = 7$.'
- titulo: Producto multivariable con negativo
  enunciado: ¿Cuál es el valor de $2x y z$ para $x = -1$, $y = 3$ y $z = -2$?
  alternativas:
  - $12$
  - $-12$
  - $6$
  respuesta: $12$
  solucion_pasos:
  - '1. Sustitución: $2(-1)(3)(-2)$.'
  - '2. Producto de signos: dos menos dan más $\implies 2 \cdot 1 \cdot 3 \cdot 2 = 12$.'
- titulo: Expresión simétrica
  enunciado: ¿Produce la expresión $x^2 + y^2$ el mismo valor $25$ para $(x=3, y=4)$ que para $(x=4, y=3)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3^2 + 4^2 = 9 + 16 = 25$ y $4^2 + 3^2 = 16 + 9 = 25$.
- titulo: Anulación por término cero
  enunciado: Para $y = 0$, ¿se anula el término $5x^2 y^3 z$ dando $0$ independientemente de $x$ y $z$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el factor cero anula todo el producto del término.
errores_frecuentes:
- Intercambiar la asignación numérica entre variables distintas durante el proceso de sustitución.
- La regla de doble signo menos no se aplica al restar una variable con valor negativo en el denominador.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Sumar los exponentes de variables distintas en lugar de evaluar sus valores independientes.
- Declarar que la sustitución simultánea de múltiples variables depende del orden cronológico de reemplazo.
afirmaciones_verdaderas:
- La valorización de expresiones con múltiples variables exige sustituir cada variable por su valor asignado específico en la tupla.
- En expresiones simétricas, permutar los valores numéricos asignados a las variables no altera el resultado final.
al_terminar_debes_poder: '![Resumen de valorización con múltiples variables](/static/img/nodos/valorizacion-de-expresiones-con-multiples-variables-resumen.svg)


  QUÉ: Evaluar numéricamente expresiones y fracciones algebraicas multivariables complejas.


  CÓMO: Sustituir ordenadamente cada variable en su posición $(x, y, z) = (a, b, c)$, verificando que el denominador resultante no se anule ($\operatorname{Den} \neq 0$).'
