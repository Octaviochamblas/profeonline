semantic_id: MAT.NUM.FINANZAS_PERSONALES.COTIZACION_AFP
resumen_inicial: 'Cálculo de cotización previsional sobre sueldo imponible: concepto
  y propiedades fundamentales en Finanzas personales.'
explicacion_simple: ¿Te ofrecieron un trabajo por $1.000.000? Cuidado, ese dinero
  no llegará completo a tu cuenta. El Estado exige que guardes una parte obligatoria
  para tu jubilación y salud. Lo que te llega se llama 'sueldo líquido'.
explicacion_formal: "Al firmar un contrato, tu sueldo se divide así:\n\n1. **Sueldo\
  \ Imponible:** El monto base sobre el cual se calculan los descuentos.\n2. **Descuentos\
  \ Legales (Cotizaciones):**\n   - **AFP (Fondo de Pensiones):** Un $10\\%$ obligatorio\
  \ que va a tu cuenta individual para la vejez, más una comisión que cobra la AFP\
  \ (ej: $0.6\\%$ a $1.5\\%$). En promedio, se descuenta alrededor de un $11\\%$ total.\n\
  \   - **Salud:** Un $7\\%$ obligatorio (va a Fonasa o a pagar el plan base de tu\
  \ Isapre).\n   - *Seguro de Cesantía e Impuestos (si corresponde).* \n3. **Sueldo\
  \ Líquido:** Es el dinero que finalmente te depositan en el banco ($Liquido = Imponible\
  \ - Cotizaciones$)."
definiciones_clave: '- **Cálculo de cotización previsional sobre sueldo imponible**:
  Elemento central dentro del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo de cotización previsional sobre sueldo imponible.'
ejemplo_guiado:
