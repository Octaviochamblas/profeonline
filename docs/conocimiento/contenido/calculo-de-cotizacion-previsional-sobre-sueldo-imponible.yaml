semantic_id: MAT.NUM.FINANZAS.COTIZACION_PREVISIONAL
resumen_inicial: 'El cálculo de la cotización previsional cuantifica los descuentos legales obligatorios sobre el sueldo imponible (10% fondo AFP + comisión de administración + 7% salud): $\text{Descuentos} = (0,10 + c_{\text{AFP}} + 0,07) \cdot S_{\text{imponible}}$.'
explicacion_simple: |
  Cuando recibes una liquidación de sueldo en Chile, del **sueldo bruto imponible** se descuentan por ley tres ítems principales:
  1. **$10\%$ Obligatorio para tu Fondo de Pensión**: Va directo a tu cuenta individual de ahorro para tu futura jubilación.
  2. **Comisión de la AFP**: Un porcentaje adicional (entre $0,49\%$ y $1,45\%$) que cobra la AFP por administrar tu dinero.
  3. **$7\%$ para Salud**: Va a Fonasa o a tu Isapre para tu cobertura médica.

  ![Cotización previsional sobre sueldo imponible](/static/img/nodos/calculo-de-cotizacion-previsional-sobre-sueldo-imponible-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sea $S_{\text{bruto}}$ el sueldo imponible del trabajador sujeto al **tope imponible legal vigente** $T_{\text{legal}}$ ($S_{\text{imp}} = \min(S_{\text{bruto}}, T_{\text{legal}})$). Los descuentos legales obligatorios de seguridad social $D_{\text{SS}}$ se calculan mediante:
  $$D_{\text{SS}} = D_{\text{AFP}} + D_{\text{Salud}} + D_{\text{Cesantía}}$$
  donde:
  - **Cotización AFP ($D_{\text{AFP}}$)**: $D_{\text{AFP}} = S_{\text{imp}} \cdot (0,10 + c_{\text{AFP}})$, siendo $c_{\text{AFP}}$ la comisión porcentual de la administradora.
  - **Cotización Salud ($D_{\text{Salud}}$)**: $D_{\text{Salud}} = S_{\text{imp}} \cdot 0,07$ (7% legal).
  - **Seguro de Cesantía ($D_{\text{SC}}$)**: $D_{\text{SC}} = S_{\text{imp}} \cdot 0,006$ (0,6% para contratos indefinidos).

  ### Cálculo del Sueldo Líquido
  $$S_{\text{líquido}} = S_{\text{bruto}} - D_{\text{SS}} - \text{Impuesto Único de Segunda Categoría}$$

  ### Síntesis didáctica
  - Ecuación previsional: $D_{\text{AFP}} = S_{\text{imp}} \cdot (10\% + \text{comisión})$.
  - Ecuación de salud: $D_{\text{Salud}} = S_{\text{imp}} \cdot 7\%$.
definiciones_clave: |
  - **Sueldo Imponible**: Total de remuneraciones sobre las cuales la ley obliga a realizar descuentos de seguridad social.
  - **Haberes No Imponibles**: Asignaciones destinadas a compensar gastos de trabajo (movilización, colación, viáticos) no afectas a cotizaciones.
  - **Tope Imponible**: Monto máximo fijado anualmente en UF sobre el cual se aplican los porcentajes legales de cotización.
propiedades_relaciones: |
  - **Capitalización individual**: El $10\%$ aportado al fondo de pensión permanece en propiedad exclusiva del trabajador generando rentabilidad compuesta en los multifondos.
  - **Efecto de la comisión de la AFP**: Elegir una AFP con menor comisión aumenta directamente el sueldo líquido mensual manteniendo el mismo $10\%$ de ahorro previsional.
ejemplo_guiado:
  enunciado: 'Un trabajador dependiente tiene un sueldo imponible de $\$800.000$ (sin haberes no imponibles). Su AFP cobra un $1,44\%$ de comisión ($11,44\%$ total) y cotiza el $7\%$ en salud. Calcula el descuento total por leyes sociales y su sueldo líquido.'
  imagen: '/static/img/nodos/calculo-de-cotizacion-previsional-sobre-sueldo-imponible-ejemplos.svg'
  pasos:
    - 'Paso 1: Calculamos descuento de AFP: $800.000 \cdot 0,1144 = $\$91.52$0$.'
    - 'Paso 2: Calculamos descuento de Salud ($7\%$): $800.000 \cdot 0,07 = $\$56.00$0$.'
    - 'Paso 3: Sumamos los descuentos de seguridad social: $91.520 + 56.000 = $\$147.52$0$.'
    - 'Paso 4: Calculamos el sueldo líquido: $S_{\text{líquido}} = 800.000 - 147.520 = $\$652.48$0$. El sueldo líquido es de **$\$652.480$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué porcentaje legal obligatorio se descuenta del sueldo imponible para la cobertura de salud (Fonasa o Isapre)?'
    choices:
      - {text: 'El $7\%$ del sueldo imponible', is_correct: true}
      - {text: 'El $10\%$ del sueldo imponible', is_correct: false}
      - {text: 'El $19\%$ del sueldo imponible', is_correct: false}
      - {text: 'El $1,44\%$ del sueldo imponible', is_correct: false}
    explanation: 'La alternativa correcta es ''El $7\%$ del sueldo imponible''. Es la cotización legal obligatoria de salud fijada por la legislación chilena.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para un sueldo imponible de $\$1.000.000$ en una AFP con comisión del $1\%$ ($11\%$ total), ¿cuánto se descuenta para el fondo de pensión y comisión?'
    choices:
      - {text: '$\$110.000$, calculando $1.000.000 \cdot 0,11 = 110.000$', is_correct: true}
      - {text: '$\$100.000$, omitiendo la comisión', is_correct: false}
      - {text: '$\$10.000$, calculando solo la comisión', is_correct: false}
      - {text: '$\$70.000$, calculando salud', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$110.000$, calculando $1.000.000 \cdot 0,11 = 110.000$''. Consolida el $10\%$ de capitalización y el $1\%$ de comisión.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el sueldo imponible $S_{\text{imp}}$ verificando que no supere el tope imponible legal.'
  - 'Paso 2: Sumar el $10\%$ obligatorio de pensión más la comisión porcentual de la AFP ($10\% + c_{\text{AFP}}$).'
  - 'Paso 3: Calcular el descuento de AFP y el descuento de salud ($7\%$).'
  - 'Paso 4: Restar los descuentos legales al sueldo imponible para obtener el sueldo líquido disponible.'
errores_correccion: |
  - **Error 1:** Aplicar los descuentos previsionales sobre asignaciones no imponibles como colación o movilización. **Cómo corregirlo:** Las cotizaciones se calculan **únicamente sobre los haberes imponibles**.
  - **Error 2:** Olvidar sumar la comisión de la AFP al $10\%$ obligatorio del fondo de pensión. **Cómo corregirlo:** La tasa total de descuento de AFP es **$10\% + \text{comisión}$**.
ejemplos:
  - titulo: 'Descuento de Salud del 7%'
    enunciado: 'Para un sueldo imponible de $\$600.000$, ¿cuál es el descuento legal de salud ($7\%$)?'
    alternativas:
      - '$\$42.000$'
      - '$\$60.000$'
      - '$\$7.000$'
    respuesta: '$\$42.000$'
    solucion_pasos:
      - '1. $600.000 \cdot 0,07 = $\$42.00$0$.'
  - titulo: 'Descuento total de leyes sociales'
    enunciado: 'Si AFP es $11,5\%$ y salud es $7\%$ sobre $\$1.000.000$, ¿cuál es el descuento previsional total?'
    alternativas:
      - '$\$185.000$'
      - '$\$115.000$'
      - '$\$70.000$'
    respuesta: '$\$185.000$'
    solucion_pasos:
      - '1. Tasa total: $11,5\% + 7\% = 18,5\%$.'
      - '2. Descuento: $1.000.000 \cdot 0,185 = $\$185.00$0$.'
  - titulo: 'Destino del 10% obligatorio'
    enunciado: '¿El $10\%$ obligatorio descontado de la remuneración pasa a ser de propiedad individual del trabajador en su cuenta de capitalización?'
    alternativas:
      - 'Sí, se deposita en la cuenta individual para rentabilizar en los multifondos'
      - 'No, se destina como impuesto fiscal al Estado'
      - 'No, pasa a ser ganancia de la empresa empleadora'
    respuesta: 'Sí, se deposita en la cuenta individual para rentabilizar en los multifondos'
    solucion_pasos:
      - '1. El 10% legal es un ahorro individual propio del cotizante.'
  - titulo: 'Impacto de la comisión en el sueldo líquido'
    enunciado: '¿Cambiarse a una AFP con una comisión $0,5\%$ menor aumenta directamente el sueldo líquido mensual del trabajador?'
    alternativas:
      - 'Sí, porque disminuye el monto total descontado por leyes sociales'
      - 'No, el sueldo líquido no cambia'
      - 'No, disminuye el ahorro para pensión'
    respuesta: 'Sí, porque disminuye el monto total descontado por leyes sociales'
    solucion_pasos:
      - '1. Menor comisión reduce el descuento y eleva el monto líquido a pagar.'
errores_frecuentes:
  - 'Los descuentos legales de AFP y salud se calculan sobre las asignaciones no imponibles de colación y movilización.'
  - 'La cotización para el fondo de pensión obligatorio equivale al diecinueve por ciento del sueldo imponible.'
  - 'El descuento de salud del siete por ciento se adiciona al sueldo líquido en lugar de descontarse del sueldo bruto.'
  - 'La comisión cobrada por la AFP se descuenta de los fondos del empleador y no del sueldo del trabajador.'
  - 'El sueldo líquido se obtiene sumando los descuentos previsionales al sueldo imponible.'
afirmaciones_verdaderas:
  - 'Los descuentos legales obligatorios se calculan sobre el sueldo imponible considerando el $10\%$ de pensión, la comisión de la AFP y el $7\%$ de salud.'
  - 'El $10\%$ de cotización previsional se destina a la cuenta de capitalización individual del trabajador para su futura pensión.'
al_terminar_debes_poder: |
