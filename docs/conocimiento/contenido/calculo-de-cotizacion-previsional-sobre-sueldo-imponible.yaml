resumen_inicial: La cotización previsional obligatoria a la AFP en Chile es del $10\%$
  sobre el sueldo imponible del trabajador (hasta el tope imponible legal), destinada
  a su cuenta de capitalización individual.
explicacion_simple: En Chile, a todos los trabajadores dependientes se les descuenta
  obligatoriamente un 10% de su sueldo imponible para guardarlo en su cuenta de ahorro
  para la jubilación en una AFP, más una pequeña comisión para la administradora.
explicacion_formal: 'Dado un Sueldo Imponible $S_{imp}$ (limitado al Tope Imponible
  $T_{imp}$ en UF), la **Cotización Obligatoria a la AFP ($C_{AFP}$)** se calcula
  como:


  $$S_{base} = \min(S_{imp}, T_{imp})$$


  $$C_{obligatoria} = S_{base} \cdot 0,10 = 10\% \text{ de } S_{base}$$


  $$\text{Descuento Total Previsional} = S_{base} \cdot (0,10 + \text{Comisión}_{AFP})$$'
definiciones_clave: '- **Cotización obligatoria AFP**: Descuento del 10% sobre el
  sueldo imponible destinado a la jubilación.'
propiedades_relaciones: '- **Tope imponible**: Límite máximo en UF sobre el cual se
  calcula el 10% obligatorio.'
ejemplo_guiado:
  enunciado: Un trabajador tiene un sueldo imponible de \$700.000. Calcule el descuento
    del $10\%$ obligatorio para su AFP.
  pasos:
  - 'Paso 1: Verificar que el sueldo imponible esté bajo el tope legal.'
  - 'Paso 2: Aplicar el $10\%$ sobre el sueldo imponible: $700.000 \cdot 0,10 = 70.000$.'
  - 'Conclusión: El descuento obligatorio para su fondo previsional es \$70.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué porcentaje del sueldo imponible se descuenta obligatoriamente para
    la cuenta individual de AFP en Chile?
  choices:
  - text: El 10% obligatorio sobre el sueldo imponible
    is_correct: true
  - text: El 19%
    is_correct: false
  - text: El 7%
    is_correct: false
  - text: El 20%
    is_correct: false
  explanation: La alternativa correcta es 'El 10% obligatorio sobre el sueldo imponible'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para un sueldo imponible de $700.000, ¿cuál fue el
    descuento del 10%?
  choices:
  - text: 70.000 $
    is_correct: true
  - text: 133.000 $
    is_correct: false
  - text: 49.000 $
    is_correct: false
  - text: 700 $
    is_correct: false
  explanation: La alternativa correcta es '70.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el descuento previsional
  obligatorio del $10\%$ sobre el sueldo imponible.
semantic_id: MAT.NUM.FINANZAS_PERSONALES.COTIZACION_AFP
procedimiento:
- 'Paso 1: Identificar las variables financieras de ingresos, gastos, tasas de interés
  o sueldos imponibles.'
- 'Paso 2: Aplicar la fórmula financiera correspondiente ($B = I - G$, $R\%$, $r_{real}$
  o $10\% \text{ AFP}$).'
- 'Paso 3: Calcular el resultado y evaluar la estabilidad presupuestaria.'
errores_correccion: '- **Error 1: Confundir la tasa de interés nominal con la tasa
  real sin restar la inflación del IPC.** **Cómo corregirlo:** La ganancia real de
  poder adquisitivo exige descontar el IPC ($r_{real} \approx r_{nominal} - \text{IPC}$).


  - **Error 2: Calcular la cotización previsional de AFP sobre el sueldo líquido en
  vez del imponible.** **Cómo corregirlo:** El $10\%$ obligatorio se aplica estrictamente
  sobre el SUELDO IMPONIBLE (hasta el tope legal).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.FINANZAS_PERSONALES.COTIZACION_AFP.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de finanzas personales.
- titulo: Ejemplo 2
  enunciado: Verificación de equilibrio financiero.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal de balance o cotización.
- titulo: ¿Es el 10% el porcentaje obligatorio de cotización previsional a la AFP?
  respuesta: Sí
  solucion_pasos:
  - Sí, sobre el sueldo imponible hasta el tope legal.
- titulo: ¿Genera un balance B = I - G positivo capacidad de ahorro?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa un superávit mensual de caja.
errores_frecuentes:
- Calcular el porcentaje de cotización previsional a la AFP sobre el sueldo líquido
  recibido en cuenta corriente.
- Sumar directamente la tasa de interés nominal y la inflación pretendiendo obtener
  la rentabilidad real.
- Considerar los gastos variables como egresos de costo fijo que no se pueden modificar
  mensualmente.
- La tasa de inflación del IPC incrementa el poder adquisitivo del dinero depositado
  a tasa fija.
- Clasificar el dividendo pagado por acciones como un gasto imprevisto en el presupuesto
  personal.
afirmaciones_verdaderas:
- 'El balance financiero de caja se calcula restando los egresos totales a los ingresos
  recibidos: $B_{neto} = I_{total} - G_{total}$.'
- La cotización previsional obligatoria a la AFP en Chile equivale al 10% del sueldo
  imponible ajustado al tope legal.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
