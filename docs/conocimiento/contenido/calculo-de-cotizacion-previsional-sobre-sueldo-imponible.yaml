  QUÉ: Calcular las cotizaciones previsionales obligatorias y determinar el sueldo líquido disponible.
  CÓMO: Aplicar los porcentajes legales sobre el sueldo imponible mediante $D_{\text{SS}} = S_{\text{imp}} \cdot (0,10 + c_{\text{AFP}} + 0,07)$ y deducir del total de haberes.
