semantic_id: MAT.ALG.RELACION_EXP_LOG.MODELO_LOGARITMICO_CONTEXTO
resumen_inicial: 'El modelamiento logarítmico se aplica en sismología (Richter), acústica (Decibeles) y química (pH) para comprimir rangos numéricos gigantescos en escalas manejables.'
explicacion_simple: |
  En el mundo real existen magnitudes que varían en rangos enormemente gigantescos (por ejemplo, la energía de un temblor suave comparada con un gran terremoto es millones de veces mayor). Para evitar trabajar con números con 15 ceros, los científicos inventaron las escalas logarítmicas. Un aumento de 1 unidad en la escala Richter o en decibeles no significa sumar 1, sino multiplicar la energía por 10. Por eso, un terremoto de magnitud 7 es 10 veces más fuerte que uno de magnitud 6.
explicacion_formal: |
  ### Definición formal
  Un **modelo de escala logarítmica contextual** es una función $M: \mathbb{R}^+ \to \mathbb{R}$ que comprime una variable de intensidad física $I > 0$ de amplio rango dinámico mediante la transformación:
  $$M(I) = k \cdot \log_{10}\left(\frac{I}{I_0}\right) + C$$
  donde $I_0 > 0$ es la intensidad física de referencia o umbral mínimo, $k$ es el factor de escala de la disciplina y $C$ es una constante de calibración.

  ### Modelos de Aplicación Canónicos
  1. **Escala Sísmica de Richter (Magnitud $M$)**:
     $$M = \log_{10}\left(\frac{A}{A_0}\right)$$
     donde $A$ es la amplitud máxima del sismograma y $A_0$ la amplitud de referencia. Un incremento de $\Delta M = 1$ representa una amplitud 10 veces mayor ($A_2 = 10 A_1$) y una liberación de energía $\approx 31.6$ veces mayor.
  2. **Intensidad Sonora (Decibeles $dB$)**:
     $$\beta = 10 \cdot \log_{10}\left(\frac{I}{I_0}\right)$$
     donde $I_0 = 10^{-12} \text{ W/m}^2$ es el umbral de audición humana.
  3. **Acidez Química ($pH$)**:
     $$pH = -\log_{10}([H^+])$$
     donde $[H^+]$ es la concentración de iones de hidrógeno en moles por litro.

  ### Síntesis didáctica
  Significado de los pasos en escalas logarítmicas: En una escala lineal, pasar de 2 a 4 es sumar 2. En una escala logarítmica decimal, pasar de 2 a 4 es multiplicar la intensidad de origen por $10^2 = 100$ veces.
definiciones_clave: |
  - **Escala logarítmica**: Sistema de medición que utiliza potencias de 10 para representar amplitudes extremas.
  - **Umbral de referencia $I_0$**: Valor base arbitrario o límite de sensibilidad usado como denominador del argumento.
  - **Variación multiplicativa de la intensidad**: Relación $\Delta M = \log_{10}(I_2 / I_1) \implies \frac{I_2}{I_1} = 10^{\Delta M}$.
propiedades_relaciones: |
  - **Sensibilidad perceptual humana**: La ley de Weber-Fechner establece que la percepción humana de estímulos (sonido, luz, peso) varía logarítmicamente respecto a la intensidad física del estímulo.
  - **Relación inversa en el pH**: A mayor concentración de $[H^+]$, menor es el valor del $pH$ (debido al signo negativo en $pH = -\log[H^+]$).
ejemplo_guiado:
  enunciado: 'Un terremoto A registra una magnitud de $M_1 = 5.0$ en la escala Richter y un terremoto B registra $M_2 = 8.0$. ¿Cuántas veces mayor es la amplitud sismográfica $A_2$ del terremoto B comparada con la amplitud $A_1$ del terremoto A?'
  pasos:
    - 'Paso 1: Escribimos las ecuaciones para cada terremoto: $M_1 = \log(A_1 / A_0) = 5.0$ y $M_2 = \log(A_2 / A_0) = 8.0$.'
    - 'Paso 2: Restamos las magnitudes: $M_2 - M_1 = 8.0 - 5.0 = 3.0$.'
    - 'Paso 3: Aplicamos la propiedad del cociente de logaritmos: $\log\left(\frac{A_2}{A_0}\right) - \log\left(\frac{A_1}{A_0}\right) = \log\left(\frac{A_2}{A_1}\right) = 3.0$.'
    - 'Paso 4: Convertimos a forma exponencial: $\frac{A_2}{A_1} = 10^{3.0} = 1000$.'
    - 'Paso 5: Conclusión: La amplitud del sismograma del terremoto B es 1000 veces mayor que la del terremoto A.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una solución química tiene una concentración de iones de hidrógeno $[H^+] = 10^{-4} \text{ M}$, ¿cuál es su nivel de $pH$ calculado mediante $pH = -\log[H^+]$?'
    choices:
      - {text: '$pH = 4$, aplicando $-\log(10^{-4}) = -(-4) = 4$', is_correct: true}
      - {text: '$pH = -4$, conservando el signo del exponente', is_correct: false}
      - {text: '$pH = 10$, porque la base es 10', is_correct: false}
      - {text: '$pH = 14$, restando de 14', is_correct: false}
    explanation: 'La alternativa correcta es ''$pH = 4$, aplicando $-\log(10^{-4}) = -(-4) = 4$''. El logaritmo decimal de $10^{-4}$ es $-4$, y al multiplicarse por el signo negativo resulta $pH = 4$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En un estudio acústico, el sonido A mide $40\text{ dB}$ y el sonido B mide $70\text{ dB}$. Sabiendo que $\beta = 10 \log(I / I_0)$, ¿cuántas veces más intenso es el sonido B que el sonido A?'
    choices:
      - {text: '1000 veces más intenso, pues $\Delta \beta = 30\text{ dB} \implies 10 \log(I_B/I_A) = 30 \implies \log(I_B/I_A) = 3 \implies \frac{I_B}{I_A} = 10^3 = 1000$', is_correct: true}
      - {text: '30 veces más intenso, restando $70 - 40 = 30$', is_correct: false}
      - {text: '3 veces más intenso', is_correct: false}
      - {text: '7000 veces más intenso', is_correct: false}
    explanation: 'La alternativa correcta es ''1000 veces más intenso, pues $\Delta \beta = 30\text{ dB} \implies 10 \log(I_B/I_A) = 30 \implies \log(I_B/I_A) = 3 \implies \frac{I_B}{I_A} = 10^3 = 1000$''. Cada incremento de $10\text{ dB}$ multiplica la intensidad física por 10.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la fórmula del modelo logarítmico contextual dada en el enunciado.'
  - 'Paso 2: Sustituir los datos de intensidad física o de nivel de escala entregados.'
  - 'Paso 3: Si se comparan dos medidas, restar sus valores en la escala para aplicar la propiedad del cociente de logaritmos.'
  - 'Paso 4: Convertir la ecuación resultante a forma exponencial en base 10 ($10^{\Delta M}$) para hallar la razón de intensidades.'
errores_correccion: |
  - **Error 1:** Creer que una diferencia de 2 unidades en la escala Richter significa que el terremoto es 2 veces más fuerte. **Cómo corregirlo:** La escala Richter es logarítmica decimal. Una diferencia de $\Delta M = 2$ significa que el terremoto es $10^2 = 100$ veces más fuerte en amplitud.
  - **Error 2:** Olvidar el signo negativo al calcular el pH (ej: decir que $[H^+] = 10^{-3}$ da $pH = -3$). **Cómo corregirlo:** La fórmula del pH incluye un signo negativo por fuera: $pH = -\log(10^{-3}) = -(-3) = +3$.
ejemplos:
  - titulo: 'Cálculo de pH básico'
    enunciado: '¿Cuál es el pH de una solución con $[H^+] = 10^{-7} \text{ M}$ (agua pura)?'
    alternativas:
      - '$pH = 7$'
      - '$pH = -7$'
      - '$pH = 0$'
    respuesta: '$pH = 7$'
    solucion_pasos:
      - '1. $pH = -\log(10^{-7}) = -(-7) = 7$.'
  - titulo: 'Diferencia en decibeles'
    enunciado: '¿Un aumento de $20\text{ dB}$ en intensidad sonora multiplica la intensidad física $I$ por 100?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $20 = 10 \log(I_2 / I_1) \implies \log(I_2 / I_1) = 2 \implies \frac{I_2}{I_1} = 10^2 = 100$.'
  - titulo: 'Comprobación de escala Richter'
    enunciado: '¿Un sismo de magnitud 6 libera una amplitud 10 veces mayor que uno de magnitud 5?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\Delta M = 6 - 5 = 1 \implies \frac{A_6}{A_5} = 10^1 = 10$.'
  - titulo: 'Concentración de H+ en medio ácido'
    enunciado: 'Si un jugo tiene $pH = 3$, ¿su concentración es $[H^+] = 10^{-3} \text{ M}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. De $3 = -\log[H^+] \implies \log[H^+] = -3 \implies [H^+] = 10^{-3} \text{ M}$.'
errores_frecuentes:
  - 'Un terremoto de magnitud 8 en la escala Richter es 2 veces más fuerte que uno de magnitud 6.'
  - 'El nivel de acidez $pH = 2$ es menos ácido que un nivel de $pH = 5$.'
  - 'Aumentar $10\text{ dB}$ en la escala de ruido equivale a sumar 10 watts por metro cuadrado a la intensidad física.'
  - 'En la fórmula del pH, el resultado siempre debe ser un número negativo.'
  - 'La escala Richter no utiliza logaritmos decimales sino logaritmos en base 2.'
afirmaciones_verdaderas:
  - 'Las escalas logarítmicas (Richter, Decibeles, pH) transforman variaciones multiplicativas gigantescas de la naturaleza en diferencias aditivas simples.'
  - 'Un incremento de una unidad en una escala logarítmica decimal ($M_2 - M_1 = 1$) representa una intensidad física 10 veces mayor.'
