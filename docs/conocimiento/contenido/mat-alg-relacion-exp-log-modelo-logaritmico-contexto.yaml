semantic_id: MAT.ALG.RELACION_EXP_LOG.MODELO_LOGARITMICO_CONTEXTO
resumen_inicial: 'Modelamiento de situaciones contextualizadas mediante funciones
  logarítmicas: conceptos, asíntotas, propiedades e inversidad en Relación de funciones
  inversas.'
explicacion_simple: Muchos fenómenos, como la escala de Richter o el pH, comprimen
  rangos enormes de valores usando logaritmos, porque crecen o decrecen de forma exponencial
  en la realidad.
explicacion_formal: '### Definición formal


  Un modelo logarítmico tiene la forma $f(x)=a\cdot\log_b(x)+c$, donde $x$ representa
  la magnitud física original y $f(x)$ una escala comprimida logarítmicamente. Se
  usa cuando el fenómeno real crece o decrece de forma exponencial, y se necesita
  una escala manejable para compararlo.


  ### Desarrollo didáctico


  La escala de Richter mide la magnitud $M$ de un sismo a partir de la amplitud $A$
  de la onda registrada, mediante $M=\log_{10}(A)+c$. Un aumento de una unidad en
  $M$ corresponde a multiplicar por $10$ la amplitud real de la onda: por eso la escala
  logarítmica es capaz de representar sismos de intensidades muy distintas en un rango
  pequeño de números.'
definiciones_clave: '- **Modelamiento de situaciones contextualizadas mediante funciones
  logarítmicas**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a modelamiento de situaciones contextualizadas mediante funciones logarítmicas.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de modelamiento
    de situaciones contextualizadas mediante funciones logarítmicas.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de modelamiento de situaciones
    contextualizadas mediante funciones logarítmicas.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
