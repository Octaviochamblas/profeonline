procedimiento:
- 'Para hallar el 3er término faltante (siendo $x^2$ el 1ero con coeficiente 1):'
- 'Paso 1: Toma el coeficiente numérico del término central.'
- 'Paso 2: Divídelo entre 2.'
- 'Paso 3: Eleva ese resultado al cuadrado.'
- 'Paso 4: Añade ese valor positivo al final.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en determinación del signo del binomio al factorizar un trinomio cuadrado
  perfecto.
ejemplos:
- titulo: Qué número falta en $m^2 - 14m + \text{___}$ para que sea TCP
  enunciado: ¿Qué número falta en $m^2 - 14m + \text{___}$ para que sea TCP?
  solucion_pasos:
  - El coeficiente central es 14.
  - 'Lo dividimos en 2: $14 / 2 = 7$.'
  - 'Lo elevamos al cuadrado: $7^2 = 49$.'
  - El término faltante es $49$.
- titulo: En $25x^2 + kx + 36$, halla el valor de k positivo para que sea TCP.
  solucion_pasos:
  - 'Raíces: 5x y 6. Doble producto: 2 * 5 * 6 = 60. Por ende $k=60$.'
- titulo: Respecto de «Determinación del signo del binomio al factorizar un trinomio
    cuadrado perfecto
  enunciado: 'Respecto de «Determinación del signo del binomio al factorizar un trinomio
    cuadrado perfecto»: ¿Describe adecuadamente el concepto esta frase? «Para completar
    un TCP, se debe asegurar que el término central $(2ab)$ o los extremos $(a^2,
    b^2)$ satisfagan la relación de que el coeficiente central es el doble del producto
    de las raíces de los extremos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para completar un TCP, se debe
    asegurar que el término central $(2ab)$ o los extremos $(a^2, b^2)$ satisfagan
    la relación de que el coeficiente central es el doble del producto de las raíces
    de los extremos.'
- titulo: Respecto de «Determinación del signo del binomio al factorizar un trinomio
    cuadrado perfecto
  enunciado: 'Respecto de «Determinación del signo del binomio al factorizar un trinomio
    cuadrado perfecto»: ¿Se puede aceptar esta afirmación? «Olvidar elevar al cuadrado
    tras dividir por 2»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para completar un TCP, se debe
    asegurar que el término central $(2ab)$ o los extremos $(a^2, b^2)$ satisfagan
    la relación de que el coeficiente central es el doble del producto de las raíces
    de los extremos.'
errores_frecuentes:
- Olvidar elevar al cuadrado tras dividir por 2.
- No darse cuenta de que si el término $x^2$ tiene un coeficiente distinto de 1, el
  método directo de dividir el centro entre 2 falla (hay que considerar la raíz del
  primer término también).
- El tercer término es la mitad del segundo.
- El segundo término es el cuadrado del tercero.
- Para «¿Qué fórmula rige la relación entre los términos de un TCP (asumiendo coeficiente
  1 en el grado 2)», la respuesta correcta es Todos suman cero.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
