resumen_inicial: La determinación del signo del binomio al factorizar un trinomio
  cuadrado perfecto establece que el signo interno de $(A \pm B)^2$ coincide estrictamente
  con el signo del término central del trinomio.
explicacion_simple: 'El signo que va al medio en $(A \dots B)^2$ depende 100% del
  término central del trinomio: Si tienes $+2AB$, la respuesta lleva signo más $(A
  + B)^2$. Si tienes $-2AB$, la respuesta lleva signo menos $(A - B)^2$.'
explicacion_formal: 'Dada la familia de trinomios cuadrados perfectos $P_{\sigma}(A,
  B) = A^2 + \sigma \cdot 2AB + B^2$ con $\sigma \in \{+1, -1\}$, la **Determinación
  del Signo del Binomio** establece el isomorfismo de signos:


  $$\text{sgn}(P_{\text{central}}) = \sigma \implies (A^2 + \sigma \cdot 2AB + B^2)
  = (A + \sigma B)^2$$


  **Desglose simbólico:**

  - Si $\sigma = +1 \implies A^2 + 2AB + B^2 = (A + B)^2$.

  - Si $\sigma = -1 \implies A^2 - 2AB + B^2 = (A - B)^2$.

  - Los términos $A^2$ y $B^2$ se mantienen positivos independientemente de $\sigma$
  debido a que $(\pm B)^2 = +B^2$.


  > **Complemento didáctico:** Explica por qué elevar al cuadrado tanto $(A + B)$
  como $(-A - B)$ produce el mismo trinomio positivo central.'
definiciones_clave: '- **Signo operativo del término central**: Operador $+$ o $-$
  que antecede al monomio $2AB$.

  - **Positividad de cuadrados**: Propiedad $B^2 > 0$ que mantiene los extremos positivos
  para ambos signos.'
propiedades_relaciones: '- **Preservación del signo**: El término central es el único
  componente del trinomio que conserva la memoria del signo del binomio original.'
ejemplo_guiado:
  enunciado: Determine el signo del binomio y factorice los trinomios $x^2 + 14x +
    49$ y $x^2 - 14x + 49$.
  pasos:
  - 'Paso 1: Identificar las raíces comunes: $A = \sqrt{x^2} = x$ y $B = \sqrt{49}
    = 7$.'
  - 'Paso 2: Analizar el primer trinomio $x^2 + 14x + 49$: El término central es $+14x$
    (positivo).'
  - 'Paso 3: Asignar signo positivo al binomio: $(x + 7)^2$.'
  - 'Paso 4: Analizar el segundo trinomio $x^2 - 14x + 49$: El término central es
    $-14x$ (negativo).'
  - 'Paso 5: Asignar signo negativo al binomio: $(x - 7)^2$.'
  - 'Conclusión: Los resultados son $(x + 7)^2$ y $(x - 7)^2$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿De cuál término del trinomio cuadrado perfecto proviene el signo que
    se coloca dentro del binomio al cuadrado?
  choices:
  - text: Provendiente estrictamente del signo que antecede al término central ($2AB$)
    is_correct: true
  - text: Del signo del término independiente $B^2$
    is_correct: false
  - text: Del signo del término cuadrático $A^2$
    is_correct: false
  - text: Se elige aleatoriamente según prefiera el estudiante
    is_correct: false
  explanation: La alternativa correcta es 'Provendiente estrictamente del signo que
    antecede al término central ($2AB$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para el trinomio $x^2 - 14x + 49$, ¿cuál es el signo correcto dentro de
    su binomio factorizado?
  choices:
  - text: Signo negativo, resultando $(x - 7)^2$
    is_correct: true
  - text: Signo positivo, resultando $(x + 7)^2$
    is_correct: false
  - text: Doble signo, resultando $(x \pm 7)^2$
    is_correct: false
  - text: Sin signo, resultando $(7x)^2$
    is_correct: false
  explanation: La alternativa correcta es 'Signo negativo, resultando $(x - 7)^2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el término central $2AB$ en el trinomio ordenado.'
- 'Paso 2: Observar si posee signo positivo $+$ o signo negativo $-$.'
- 'Paso 3: Trasladar dicho signo exactamente entre las bases $A$ y $B$ dentro de $(A
  \pm B)^2$.'
errores_correccion: '- **Error 1: Usar el signo del término independiente $B^2$ para
  decidir el signo del binomio.** **Cómo corregirlo:** El término $B^2$ SIEMPRE es
  positivo en un TCP real; el signo del binomio lo determina ÚNICAMENTE el término
  central $2AB$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En $25p^2 - 30pq + 9q^2$, ¿qué signo lleva el binomio factorizado?
  alternativas:
  - 'Signo menos: $(5p - 3q)^2$'
  - 'Signo más: $(5p + 3q)^2$'
  - Signo alternado
  respuesta: 'Signo menos: $(5p - 3q)^2$'
  solucion_pasos:
  - 1. El término central es $-30pq$ (negativo).
  - '2. Binomio con menos: $(5p - 3q)^2$.'
- titulo: Ejemplo 2
  enunciado: Si el trinomio es $a^2 + 2a + 1$, ¿cuál es su factorización correcta?
  alternativas:
  - $(a + 1)^2$
  - $(a - 1)^2$
  - $(a + 1)(a - 1)$
  respuesta: $(a + 1)^2$
  solucion_pasos:
  - 1. Término central $+2a$ es positivo $\to (a + 1)^2$.
- titulo: ¿Produce el desarrollo de $(-A + B)^2$ el mismo trinomio $A^2 - 2AB + B^2$
    que $(A - B)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $(-A + B)^2 = [-(A - B)]^2 = (A - B)^2$.
- titulo: En el campo real, ¿un TCP con término independiente positivo puede tener
    término central negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, ocurre siempre que el binomio sea una diferencia $(A - B)^2$.
errores_frecuentes:
- Determinar el signo del binomio observando el signo del último término $B^2$ en
  lugar del central.
- Declarar que el signo negativo del término central convierte a $B^2$ en un número
  negativo.
- Colocar el signo del término cuadrático $A^2$ dentro del binomio al cuadrado.
- Declarar que el término central siempre debe llevar signo positivo independientemente
  del binomio original.
- Escribir un doble signo $(\pm)$ en la respuesta final de un trinomio con signo definido.
afirmaciones_verdaderas:
- El signo operativo del binomio $(A \pm B)^2$ es idéntico al signo del término central
  del trinomio.
- En todo Trinomio Cuadrado Perfecto real, los términos extremos $A^2$ y $B^2$ deben
  ser positivos.
al_terminar_debes_poder: Al terminar serás capaz de asignar el signo correcto al binomio
  al factorizar un Trinomio Cuadrado Perfecto.
