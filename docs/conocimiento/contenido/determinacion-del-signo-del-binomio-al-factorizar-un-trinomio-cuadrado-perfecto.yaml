semantic_id: MAT.ALG.FACTOR_CUADRADOS.SIGNO_TERMINO_CENTRAL
resumen_inicial: 'Determinación del signo del binomio al factorizar un trinomio cuadrado
  perfecto: concepto, método de descomposición y reglas en Factorización asociada
  a cuadrados.'
explicacion_simple: Imagina que tienes una receta para un pastel perfecto (un TCP),
  pero te diste cuenta de que te falta un ingrediente clave o alguien le mordió un
  pedazo. Puedes calcular exactamente cuánto falta para que vuelva a ser perfecto.
explicacion_formal: '### Definición formal


  Si a=1, 2b = centro, entonces b = centro/2, y el tercer término es b^2 = (centro/2)^2.


  ### Desarrollo didáctico


  Caso 1: Falta un extremo.

  Tienes $x^2 + 10x + \text{___}$.

  Sabemos que $a = x$.

  El término central $2ab = 10x$. Si reemplazas $a=x$, tienes $2(x)b = 10x \rightarrow
  2b = 10 \rightarrow b = 5$.

  Por lo tanto, el extremo que falta es $b^2 = 5^2 = 25$.


  Caso 2: Falta el centro.

  Tienes $9x^2 + \text{___} + 16$.

  La raíz de $9x^2$ es $3x$. La raíz de $16$ es $4$.

  El centro debe ser $2 \cdot (3x) \cdot (4) = 24x$ (positivo o negativo).


  Saber buscar la pieza faltante es la base del método de "Completar el Cuadrado",
  vital para resolver ecuaciones de segundo grado complejas.'
definiciones_clave: '- **Determinación del signo del binomio al factorizar un trinomio
