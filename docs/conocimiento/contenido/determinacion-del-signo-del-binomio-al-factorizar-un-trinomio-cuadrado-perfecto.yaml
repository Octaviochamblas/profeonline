semantic_id: MAT.ALG.FACTOR_CUADRADOS.SIGNO_TERMINO_CENTRAL
resumen_inicial: 'La determinación del signo del binomio al factorizar un trinomio cuadrado perfecto consiste en evaluar estrictamente el signo del término doble producto central para asignar $+$ o $-$ en el binomio al cuadrado final.'
explicacion_simple: |
  El signo del binomio factorizado $(A \pm B)^2$ **depende exclusivamente de un solo término**:
  - **REGLA DE ORO DEL SIGNO CENTRAL**:
    - **Si el término central es positivo ($+2AB$)**:
      - Ejemplo: $x^2 \mathbf{+ 8x} + 16 \implies \mathbf{(x + 4)^2}$ (¡signo **$+$**!).
    - **Si el término central es negativo ($-2AB$)**:
      - Ejemplo: $x^2 \mathbf{- 8x} + 16 \implies \mathbf{(x - 4)^2}$ (¡signo **$-$**!).
  - **¿Por qué los extremos siempre son positivos?**:
    - Porque $(+4)^2 = +16$ y $(-4)^2 = +16$. ¡Elevar al cuadrado siempre da positivo!
    - El único que indica la resta original es el **término central**.
explicacion_formal: |
  ### Definición formal
  Sea la familia de trinomios cuadrados perfectos $T_\sigma(x) = A^2 + \sigma 2AB + B^2 \in \mathbb{R}[x]$ parametrizada por el signo relacional $\sigma \in \{+1, -1\}$. La **regla de determinación del signo binómico** establece el mapa de conservación de signo:

  $$\operatorname{sgn}(B_{\text{binomio}}) = \operatorname{sgn}(\text{Término Central}) = \sigma$$

  induciendo la biyección formal:

  $$\begin{cases} A^2 + 2AB + B^2 = (A + B)^2 & \text{si } \sigma = +1 \\ A^2 - 2AB + B^2 = (A - B)^2 & \text{si } \sigma = -1 \end{cases}$$

  ### Demostración por Regla de Signos de la Multiplicación
  Al expandir $(A - B)(A - B) = A^2 - AB - BA + (-B)(-B) = A^2 - 2AB + B^2$, se observa que la multiplicación de dos términos negativos $(-B)(-B) = +B^2$ produce un **tercer término estrictamente positivo**, mientras que la adición de términos cruzados $-AB - AB = -2AB$ produce un **término central estrictamente negativo**.

  ### Síntesis didáctica
  Los signos de los extremos cuadráticos $A^2$ y $B^2$ son inmunes al cambio de signo del binomio; el término central es el único indicador del signo algebraico interno del binomio factorizado.
definiciones_clave: |
  - **Signo relacional ($\sigma \in \{+1, -1\}$)**: Polaridad del término lineal o mixto que rige la suma o resta del binomio.
  - **Invarianza de positividad extrema**: Propiedad por la cual $A^2 > 0$ y $B^2 > 0$ independientemente de si el binomio es de la forma $(A+B)$ o $(A-B)$.
  - **Conservación de la paridad en producto**: Regla por la cual $(-B)^2 = +B^2$ encubre el signo negativo en los extremos cuadráticos.
propiedades_relaciones: |
  - **Biyección de signo**: Existe una correspondencia unívoca entre el signo del término central del TCP y el operador de suma/resta del binomio factorizado.
ejemplo_guiado:
  enunciado: 'Determina el signo del binomio al factorizar el trinomio $9m^2 - 42mn + 49n^2$.'
  pasos:
    - 'Paso 1: Extraemos las raíces cuadradas de los extremos:
       - $A = \sqrt{9m^2} = 3m$.
       - $B = \sqrt{49n^2} = 7n$.'
    - 'Paso 2: Inspeccionamos el término central: $-42mn$.'
    - 'Paso 3: Identificamos el signo del término central: Es **negativo ($-$)**.'
    - 'Paso 4: Asignamos el signo menos al binomio al cuadrado: $(3m - 7n)^2$.'
    - 'Conclusión: El signo que une a las raíces dentro del binomio al cuadrado es **negativo ($-$)**, produciendo **$(3m - 7n)^2$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el trinomio $16x^2 - 40x + 25$, ¿qué término determina si la factorización es $(4x + 5)^2$ o $(4x - 5)^2$ y qué signo le corresponde?'
    choices:
      - {text: 'Lo determina el término central $-40x$, y como posee signo negativo, la factorización es $(4x - 5)^2$', is_correct: true}
      - {text: 'Lo determina el término $16x^2$', is_correct: false}
      - {text: 'Lo determina el término $+25$, dando signo positivo', is_correct: false}
      - {text: 'Se puede elegir cualquier signo al azar', is_correct: false}
    explanation: 'La alternativa correcta es ''Lo determina el término central $-40x$, y como posee signo negativo, la factorización es $(4x - 5)^2$''. Biyección de signo: $\operatorname{sgn}(\text{central}) = \operatorname{sgn}(\text{binomio})$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué el término $+49y^2$ en el trinomio $x^2 - 14xy + 49y^2$ tiene signo positivo si el binomio es de la resta $(x - 7y)^2$?'
    choices:
      - {text: 'Porque al elevar $(-7y)^2$ al cuadrado, el producto de dos negativos resulta positivo ($(-7y) \cdot (-7y) = +49y^2$)', is_correct: true}
      - {text: 'Porque se cambió el signo por error', is_correct: false}
      - {text: 'Porque $49$ siempre es positivo', is_correct: false}
      - {text: 'Porque se le extrajo el valor absoluto', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque al elevar $(-7y)^2$ al cuadrado, el producto de dos negativos resulta positivo ($(-7y) \cdot (-7y) = +49y^2$)''. Invarianza de positividad extrema $(-B)^2 = +B^2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar los dos términos cuadráticos extremos del trinomio.'
  - 'Paso 2: Aislar el término central que contiene el producto de las variables.'
  - 'Paso 3: Identificar de forma explícita el signo de adición ($+$) o sustracción ($-$) que precede al término central.'
  - 'Paso 4: Transferir dicho signo exactamente al centro del binomio factorizado $(A \pm B)^2$.'
errores_correccion: |
  - **Error 1:** Asignar el signo del último término al binomio en lugar del signo del término central. **Cómo corregirlo:** El último término de un TCP **ES SIEMPRE POSITIVO; EL ÚNICO QUE DETERMINA EL SIGNO DEL BINOMIO ES EL TÉRMINO CENTRAL**.
  - **Error 2:** Declarar que un término central negativo exige que ambos extremos sean negativos. **Cómo corregirlo:** En la forma canónica del TCP **LOS DOS EXTREMOS SIGUEN SIENDO ESTRICTAMENTE POSITIVOS ($A^2 - 2AB + B^2$)**.
ejemplos:
  - titulo: 'Central positivo'
    enunciado: 'En $a^2 + 2ab + b^2$, ¿es el signo del binomio $+$, dando $(a + b)^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $+2ab$ indica suma.'
  - titulo: 'Central negativo'
    enunciado: 'En $a^2 - 2ab + b^2$, ¿es el signo del binomio $-$, dando $(a - b)^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-2ab$ indica resta.'
  - titulo: 'Extremo positivo constante'
    enunciado: '¿Es $+b^2$ positivo tanto en $(a+b)^2$ como en $(a-b)^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(+b)^2 = +b^2$ y $(-b)^2 = +b^2$.'
  - titulo: 'Trinomio desordenado'
    enunciado: 'En el trinomio $x^2 + 9 - 6x$, ¿determina el término $-6x$ que el signo es $-$, dando $(x - 3)^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-6x$ es el término central lineal.'
errores_frecuentes:
  - 'Asignar el signo del tercer término al binomio en lugar del signo del término central.'
  - 'Suponer que un término central negativo exige que los términos extremos sean negativos.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Ignorar el signo del término central al reordenar el trinomio.'
  - 'Cambiar el signo del binomio por falta de atención a la polaridad del doble producto.'
afirmaciones_verdaderas:
  - 'El signo del binomio al cuadrado coincide exactamente con el signo del término central del TCP.'
  - 'Los términos extremos cuadráticos de un TCP son siempre positivos indistintamente del signo del binomio.'
al_terminar_debes_poder: 'Determinar con precisión el signo de suma o resta del binomio factorizado evaluando el término central del TCP.'
