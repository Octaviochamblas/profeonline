semantic_id: MAT.ALG.FUNCION_CONCEPTOS.CODOMINIO
resumen_inicial: El codominio de una función es el conjunto de llegada declarado donde potencialmente caen todas sus imágenes.
explicacion_simple: '![El codominio de una función es el conjunto de llegada declarado donde potencialmente caen todas sus imágenes](/static/img/nodos/identificacion-del-codominio-de-una-funcion-intro.svg)



  Cuando defines una función $f: A \to B$, el conjunto $A$ es de donde salen los números (dominio) y el conjunto $B$ es a donde llegan (codominio).


  El **codominio** es el conjunto de llegada completo.


  Es fundamental no confundirlo con el **recorrido**: el recorrido son solo las salidas que realmente se alcanzan, mientras que el codominio es el conjunto total declarado como destino.'
explicacion_formal: 'Dada una función $f: A \to B$:

  - El conjunto $B$ se denomina formalmente **codominio** o conjunto de llegada de $f$, denotado $\text{Codom}(f) = B$.

  - El recorrido $\text{Rec}(f)$ siempre es un subconjunto del codominio:

  $$\text{Rec}(f) \subseteq \text{Codom}(f)$$

  - Si $\text{Rec}(f) = \text{Codom}(f)$, la función se clasifica como **sobreyectiva** (o epiyectiva).'
definiciones_clave: "- **Codominio ($\text{Codom}(f)$)**: Conjunto de llegada formalmente establecido en la definición de la función.\n- **Conjunto de llegada vs Imagen**: El codominio es el espacio destino global; las imágenes son los elementos de ese espacio efectivamente alcanzados."
propiedades_relaciones: '- **Declaración explícita**: El codominio viene dado en la definición de la función ($f: A \to B$).

  - **Inclusión**: Todo elemento del recorrido pertenece al codominio, pero pueden sobrar elementos en el codominio sin preimagen.'
ejemplo_guiado:
  enunciado: '![Ejemplo El codominio de una función es el conjunto de llegada declarado donde potencialmente caen todas sus imágenes](/static/img/nodos/identificacion-del-codominio-de-una-funcion-ejemplos.svg)



    Dada la función $f: \mathbb{R} \to \mathbb{R}$ definida por $f(x) = x^2$, identifica su dominio, su codominio y explica por qué el número $-5$ pertenece al codominio pero no al recorrido.'
  pasos:
  - 'Paso 1: Leer la declaración $f: \mathbb{R} \to \mathbb{R}$.'
  - 'Paso 2: El primer conjunto es el dominio: $\text{Dom}(f) = \mathbb{R}$.'
  - 'Paso 3: El segundo conjunto es el codominio: $\text{Codom}(f) = \mathbb{R}$.'
  - 'Paso 4: Dado que $x^2 \ge 0$ para todo $x \in \mathbb{R}$, las salidas solo toman valores no negativos. Por tanto, $-5 \in \text{Codom}(f)$, pero $-5 \notin \text{Rec}(f)$.'
checkpoints:
- placement: after_explicacion_formal
  question: 'En la función $g: \mathbb{N} \to \mathbb{Q}$ con $g(n) = \frac{n}{2}$, ¿cuál es el codominio?'
  choices:
  - text: El conjunto de los números racionales Q
    is_correct: true
  - text: El conjunto de los números naturales N
    is_correct: false
  - text: Solo las fracciones con denominador 2
    is_correct: false
  - text: Los números reales R
    is_correct: false
  explanation: 'La alternativa correcta es ''El conjunto de los números racionales Q''. En $g: A \to B$, el codominio es el conjunto de llegada $B$, que en este caso es $\mathbb{Q}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué relación de conjuntos existe siempre entre el recorrido y el codominio de cualquier función?
  choices:
  - text: El recorrido es un subconjunto del codominio (Rec(f) ⊆ Codom(f)).
    is_correct: true
  - text: El codominio siempre es menor que el recorrido.
    is_correct: false
  - text: El recorrido y el codominio son siempre conjuntos disjuntos.
    is_correct: false
  - text: El codominio es subconjunto estricto del dominio.
    is_correct: false
  explanation: La alternativa correcta es 'El recorrido es un subconjunto del codominio (Rec(f) ⊆ Codom(f)).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la notación estructural $f: A \to B$.'
- 'Paso 2: Identificar el conjunto situado a la derecha de la flecha ($B$) como el codominio.'
- 'Paso 3: Si no se especifica de forma explícita y se trabaja en funciones reales, el codominio por defecto es $\mathbb{R}$.'
- 'Paso 4: Comparar si el problema pide el codominio (conjunto destino $B$) o el recorrido (imágenes efectivas).'
errores_correccion: '- **Error común:** Creer que el codominio debe calcularse despejando $x$.

  - **Cómo corregirlo:** El cálculo algebraico de existencia despejando $x$ determina el **recorrido**. El codominio es simplemente el conjunto destino declarado en la definición de la función.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación directa'
  enunciado: 'Dada $h: \mathbb{R} \to [0, +\infty[$ tal que $h(x) = |x|$, ¿cuál es el codominio de $h$?'
  alternativas:
  - '[0, +inf['
  - R
  - ']-inf, 0]'
  - R \ {0}
  respuesta: '[0, +inf['
  solucion_pasos:
  - 'Paso 1: En la notación $h: A \to B$, el codominio es $B$.'
  - 'Paso 2: Aquí $B = [0, +\infty[$, por lo que el codominio es $[0, +\infty[$.'
- titulo: 'Ejemplo 2: Pertenencia al codominio'
  enunciado: 'Para $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = x^2 + 1$, ¿pertenece el número $-3$ al codominio?'
  alternativas:
  - Sí, porque -3 es un número real y el codominio es R
  - No, porque las imágenes son siempre mayores o iguales a 1
  - No, porque el codominio solo tiene números positivos
  - Solo si x es imaginario
  respuesta: Sí, porque -3 es un número real y el codominio es R
  solucion_pasos:
  - 'Paso 1: El codominio declarado es $\mathbb{R}$.'
  - 'Paso 2: Como $-3 \in \mathbb{R}$, pertenece al codominio (aunque no pertenezca al recorrido).'
- titulo: 'Ejemplo 3: Conjuntos discretos'
  enunciado: 'Si $f: \{1, 2\} \to \{A, B, C\}$ con $f(1)=A$ y $f(2)=B$, ¿cuál es el codominio?'
  alternativas:
  - '{A, B, C}'
  - '{A, B}'
  - '{1, 2}'
  - '{C}'
  respuesta: '{A, B, C}'
  solucion_pasos:
  - 'Paso 1: El conjunto de llegada es $\{A, B, C\}$.'
  - 'Paso 2: Aunque $C$ no se use, forma parte del codominio.'
- titulo: 'Ejemplo 4: Codominio por defecto'
  enunciado: Cuando se define una función real mediante su fórmula $f(x) = 3x - 1$ sin especificar conjuntos, ¿cuál es el codominio asumido?
  alternativas:
  - Todos los números reales R
  - Solo los números enteros Z
  - El intervalo [0, 1]
  - El conjunto vacío
  respuesta: Todos los números reales R
  solucion_pasos:
  - 'Paso 1: En el análisis de funciones reales de variable real, el codominio estándar por defecto es $\mathbb{R}$.'
errores_frecuentes:
- Suponer que el codominio y el recorrido son conceptos idénticos en todas las funciones.
- Descartar elementos del codominio por no tener preimagen asignada.
- Confundir el conjunto de partida A con el conjunto de llegada B.
afirmaciones_verdaderas:
- El codominio es el conjunto de llegada declarado para la función.
- El recorrido de cualquier función está siempre contenido dentro de su codominio.
al_terminar_debes_poder: '**QUÉ:** Identificar y diferenciar el codominio de una función respecto a su dominio y recorrido.


  **CÓMO:** Extrayendo el conjunto de llegada a partir de la definición estructural $f: A \to B$ y reconociendo su relación de inclusión con el recorrido.


  ![Resumen El codominio de una función es el conjunto de llegada declarado donde potencialmente caen todas sus imágenes](/static/img/nodos/identificacion-del-codominio-de-una-funcion-resumen.svg)'
