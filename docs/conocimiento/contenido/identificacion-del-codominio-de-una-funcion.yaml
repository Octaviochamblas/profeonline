semantic_id: MAT.ALG.FUNCION_CONCEPTOS.CODOMINIO
resumen_inicial: 'Identificación del codominio de una función: conceptos, representación
  y propiedades en Conceptos base de función.'
explicacion_simple: El codominio es el conjunto donde "podrían" caer las imágenes;
  el recorrido es el conjunto de las imágenes que "realmente" caen ahí. No siempre
  coinciden.
explicacion_formal: '### Definición formal


  Dada una función $f\colon A \to B$, el codominio es el conjunto $B$ fijado en la
  definición de la función, independiente de si cada uno de sus elementos es o no
  efectivamente alcanzado como imagen. Se cumple $\text{Rec}(f) \subseteq B$, con
  igualdad si y solo si $f$ es sobreyectiva.


  ### Desarrollo didáctico


  Imagina que $B$ = "todos los casilleros disponibles en un edificio" y el recorrido
  = "los casilleros que realmente tienen algo guardado". El codominio es la totalidad
  de casilleros; el recorrido es solo los ocupados.


  Por ejemplo, si se declara $f\colon \mathbb{R} \to \mathbb{R}$ con $f(x) = x^2$,
  el codominio es $\mathbb{R}$ completo, aunque las imágenes reales nunca sean negativas
  (el recorrido es $[0, +\infty[$).'
definiciones_clave: '- **Identificación del codominio de una función**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a identificación del codominio de una función.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a identificación del
    codominio de una función.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a identificación del codominio de
    una función.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    identificación del codominio de una función?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en conceptos base de función
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en conceptos base de función. Es la condición
    de existencia y unicidad en identificación del codominio de una función.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en identificación del codominio
    de una función, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Busca en la definición o el enunciado cuál es el conjunto de llegada declarado.'
- 'Paso 2: Ese conjunto declarado es el codominio, sin necesidad de calcular las imágenes.'
- 'Paso 3: No confundas este paso con calcular el recorrido, que requiere hallar las
  imágenes efectivas.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar identificación del codominio de una función.
ejemplos:
- titulo: Codominio declarado explícitamente
  enunciado: Si $f\colon \mathbb{R} \to \mathbb{R}^+_0$ con $f(x) = x^2$, indica el
    codominio.
  solucion_pasos:
  - El codominio es el conjunto de llegada declarado en la notación de la función.
  - 'Codominio: $\mathbb{R}^+_0$ (reales no negativos).'
- titulo: Codominio distinto del recorrido
  enunciado: Si $f\colon \mathbb{R} \to \mathbb{R}$ con $f(x) = x^2$, ¿el codominio
    incluye números negativos aunque nunca sean imagen?
  solucion_pasos:
  - Sí, porque el codominio es el conjunto de llegada completo, no solo los valores
    efectivamente alcanzados.
  - Los negativos pertenecen al codominio $\mathbb{R}$ pero no al recorrido de $f$.
- titulo: ¿El codominio y el recorrido son siempre el mismo conjunto?
  enunciado: ¿El codominio y el recorrido son siempre el mismo conjunto?
  respuesta: Falso
  solucion_pasos:
  - Solo coinciden cuando la función es sobreyectiva; en general el recorrido es un
    subconjunto del codominio.
- titulo: ¿El codominio se determina calculando todas las imágenes de la función?
  enunciado: ¿El codominio se determina calculando todas las imágenes de la función?
  respuesta: Falso
  solucion_pasos:
  - El codominio se fija por definición como conjunto de llegada; calcular las imágenes
    da el recorrido, no el codominio.
errores_frecuentes:
- Confundir codominio con recorrido, calculando las imágenes cuando solo se pide el
  conjunto de llegada declarado.
- Asumir que el codominio siempre es $\mathbb{R}$ sin revisar si el enunciado lo restringe.
- Creer que todo elemento del codominio necesariamente es imagen de algún elemento
  del dominio.
- No distinguir la notación $f\colon A \to B$ (que declara codominio $B$) de la fórmula
  $f(x)$ (que no lo declara).
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando identificación
  del codominio de una función.
