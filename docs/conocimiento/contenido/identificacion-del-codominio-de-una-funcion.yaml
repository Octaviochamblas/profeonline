semantic_id: MAT.ALG.FUNCION_CONCEPTOS.CODOMINIO
resumen_inicial: El codominio de una función es el conjunto de llegada declarado donde
  la función promete entregar sus resultados.
explicacion_simple: 'El **codominio** (o conjunto de llegada) es el conjunto completo
  que se define desde el inicio para recibir las salidas de la función.

  Es importante no confundirlo con el *recorrido*:

  - El codominio es el ''menú completo'' de posibles llegadas ($B$).

  - El recorrido es el conjunto de salidas que ''realmente se usan'' dentro de ese
  menú.'
explicacion_formal: 'Dada la declaración formal de una función $f: A \to B$:


  $$\text{Cod}(f) = B$$


  **Desglose de la fórmula:**

  - $B$: Conjunto de llegada especificado explícitamente en la definición formal de
  la función, sobre el cual se evalúa la sobreyectividad.'
definiciones_clave: '- **Codominio ($\text{Cod}(f)$)**: Conjunto de llegada $B$ declarado
  en la definición de la función $f: A \to B$.

  - **Relación de inclusión con el recorrido**: El recorrido es siempre un subconjunto
  del codominio ($\operatorname{Rec}(f) \subset \text{Cod}(f)$).'
propiedades_relaciones: '- **Condición de Sobreyectividad**: Una función es sobreyectiva
  si y solo si su recorrido es exactamente igual a su codominio ($\operatorname{Rec}(f)
  = \text{Cod}(f)$).'
ejemplo_guiado:
  enunciado: 'Dada la función declarada formalmente como $f: \mathbb{R} \to \mathbb{R}$
    con $f(x) = x^2$, identifica su codominio y compáralo con su recorrido de imágenes
    reales.'
  pasos:
  - 'Paso 1: Leer la declaración formal de la función: $f: \text{Dominio} \to \text{Codominio}$.Paso
    2: Identificar el conjunto de llegada declarado a la derecha de la flecha: $\mathbb{R}$.Paso
    3: Concluir que el codominio es $\text{Cod}(f) = \mathbb{R}$.Paso 4: Notar que
    su recorrido son solo los reales no negativos $[0, +\infty[$, luego $\operatorname{Rec}(f)
    \subset \text{Cod}(f)$.'
checkpoints:
- placement: after_explicacion_formal
  question: 'Para la función declarada formalmente como $f: \mathbb{Z} \to \mathbb{R}$
    dada por $f(x) = 3x$, ¿cuál es su codominio?'
  choices:
  - text: El conjunto de los números reales $\mathbb{R}$.
    is_correct: true
  - text: El conjunto de los enteros $\mathbb{Z}$.
    is_correct: false
  - text: Solo los números múltiplos de 3.
    is_correct: false
  - text: El conjunto vacío.
    is_correct: false
  explanation: 'La alternativa correcta es ''El conjunto de los números reales $\mathbb{R}$.''.
    (Es el conjunto ubicado a la derecha de la flecha $f: A \to B$).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la relación matemática siempre válida entre el recorrido y el
    codominio de una función?
  choices:
  - text: El recorrido es siempre un subconjunto del codominio ($\operatorname{Rec}(f)
      \subset \text{Cod}(f)$).
    is_correct: true
  - text: El codominio es siempre un subconjunto estrictamente menor que el recorrido.
    is_correct: false
  - text: Son dos conjuntos inconexos sin intersección.
    is_correct: false
  - text: El codominio depende de la variable $x$.
    is_correct: false
  explanation: La alternativa correcta es 'El recorrido es siempre un subconjunto
    del codominio ($\operatorname{Rec}(f) \subset \text{Cod}(f)$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar la notación formal del enunciado $f: A \to B$.'
- 'Paso 2: Tomar el conjunto señalado a la derecha de la flecha ($B$).'
- 'Paso 3: Declarar que dicho conjunto es el codominio de la función.'
errores_correccion: '- **Error común:** Confundir el codominio con el recorrido.

  - **Cómo corregirlo:** El codominio es el conjunto de llegada PROMETIDO ($B$), mientras
  que el recorrido son los valores REALMENTE ALCANZADOS.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
