semantic_id: MAT.ALG.FUNCION_CONCEPTOS.CODOMINIO
resumen_inicial: El codominio de una función es el conjunto completo de llegada donde potencialmente pueden encontrarse sus imágenes.
explicacion_simple: |
  Cuando se declara una función $f: A \to B$:
  - El conjunto $A$ es de donde salen las entradas (dominio).
  - El conjunto $B$ es a donde llegan las salidas (**codominio**).

  Es importante destacar que **el codominio es el conjunto de llegada completo**, incluso si algunos de sus elementos no son alcanzados por la función.
explicacion_formal: |
  Dada la función $f: A \to B$, el conjunto $B$ se denomina **codominio** o conjunto de llegada de la función.

  $$\text{Cod}(f) = B$$

  **Desglose de la fórmula:**
  - $B$: Conjunto de llegada declarado explícitamente en la definición formal de la función.
  - $\text{Rec}(f) \subseteq \text{Cod}(f)$: El recorrido siempre es un subconjunto (o igual) al codominio.
definiciones_clave: |
  - **Codominio ($\text{Cod}(f)$)**: Conjunto de llegada predefinido dentro del cual la función proyecta sus imágenes.
propiedades_relaciones: |
  - **Diferencia con el recorrido**: El codominio es todo el conjunto de llegada $B$, mientras que el recorrido son solo los elementos de $B$ que efectivamente tienen preimagen.
ejemplo_guiado:
  enunciado: "Dada la función $f: \\mathbb{R} \\to \\mathbb{R}$ definida por $f(x) = x^2 + 4$, identifica su codominio y compáralo con su recorrido."
  pasos:
    - 'Paso 1: Observar la notación formal $f: \mathbb{R} \to \mathbb{R}$.'
    - 'Paso 2: Identificar el conjunto de llegada a la derecha de la flecha: el codominio es $\mathbb{R}$.'
    - 'Paso 3: Calcular el recorrido: como $x^2 \ge 0$, se tiene que $x^2 + 4 \ge 4$, por lo que $\text{Rec}(f) = [4, +\infty[$.'
    - 'Paso 4: Concluir que el codominio es todo $\mathbb{R}$, mientras que el recorrido es solo $[4, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "En la función $f: \\mathbb{R} \\to \\mathbb{R}$ dada por $f(x) = x^2 + 4$, ¿cuál es su codominio?"
    choices:
      - {text: "Todo el conjunto de los números reales $\\mathbb{R}$.", is_correct: true}
      - {text: "El intervalo $[4, +\\infty[$.", is_correct: false}
      - {text: "El conjunto vacío $\\emptyset$.", is_correct: false}
      - {text: "Únicamente los números enteros positivos.", is_correct: false}
    explanation: "La alternativa correcta es 'Todo el conjunto de los números reales $\\mathbb{R}$.'. Es el conjunto de llegada declarado a la derecha de la flecha."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué relación de inclusión existe siempre entre el recorrido y el codominio de una función?"
    choices:
      - {text: "El recorrido es un subconjunto del codominio ($\\text{Rec} \\subseteq \\text{Cod}$).", is_correct: true}
      - {text: "El codominio es un subconjunto del recorrido.", is_correct: false}
      - {text: "Son conjuntos disjuntos sin intersección.", is_correct: false}
      - {text: "El recorrido siempre es estrictamente mayor que el codominio.", is_correct: false}
    explanation: "La alternativa correcta es 'El recorrido es un subconjunto del codominio ($\\text{Rec} \\subseteq \\text{Cod}$).'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Localizar la declaración formal de la función $f: A \to B$.'
  - 'Paso 2: Identificar el conjunto ubicado a la derecha de la flecha ($B$).'
  - 'Paso 3: Declarar $B$ como el codominio de la función.'
  - 'Paso 4: Evitar confundirlo con el recorrido efectivo de la regla algebraica.'
errores_correccion: |
  - **Error común:** Pensar que el codominio solo incluye a los números que efectivamente resultan de evaluar la función.
  - **Cómo corregirlo:** El conjunto de valores efectivamente alcanzados es el RECORRIDO; el CODOMINIO es todo el conjunto de llegada disponible.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El codominio de una función $f: A \to B$ es siempre exactamente igual al recorrido de la función.'
  - 'El codominio es el conjunto de partida formado por los valores de entrada de la función.'
  - 'Si una función $f: \mathbb{R} \to \mathbb{R}$ dada por $f(x) = x^2$ tiene recorrido $[0, +\infty[$, su codominio es $[0, +\infty[$.'
  - 'El codominio se calcula mediante el despeje algebraico de la variable $x$ en la ecuación $y = f(x)$.'
  - 'Una función no puede definirse si el codominio contiene elementos que no son imagen de ninguna preimagen.'
afirmaciones_verdaderas:
  - 'El codominio de una función $f: A \to B$ es el conjunto de llegada $B$ declarado en la definición de la función.'
  - 'El recorrido es un subconjunto del codominio ($\text{Rec}(f) \subseteq \text{Cod}(f)$).'
al_terminar_debes_poder: |
  QUÉ: Identificar el codominio de una función a partir de su definición formal.
  CÓMO: Localizar el conjunto de llegada $B$ en la notación $f: A \to B$ y distinguirlo del recorrido de la función.
