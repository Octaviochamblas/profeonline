- titulo: ¿Se cumple siempre la propiedad principal de interpretación del parámetro
    t en una ecuación paramétrica de la recta en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede interpretación del parámetro t en una ecuación paramétrica de la
    recta asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
