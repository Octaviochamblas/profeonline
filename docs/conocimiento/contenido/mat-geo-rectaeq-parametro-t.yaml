procedimiento:
- 'Paso 1: Reconoce que t=0 siempre corresponde al punto de referencia (x0,y0).'
- 'Paso 2: Interpreta que valores positivos de t desplazan el punto en la dirección
  del vector director.'
- 'Paso 3: Interpreta que valores negativos de t desplazan el punto en la dirección
  opuesta al vector director.'
