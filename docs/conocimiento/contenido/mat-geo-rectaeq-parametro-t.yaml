semantic_id: MAT.GEO.RECTA_ECUACIONES.PARAMETRO_T
resumen_inicial: 'Interpretación del parámetro t en una ecuación paramétrica de la
  recta: conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica
  Ampliada.'
explicacion_simple: El parámetro t no representa una coordenada geométrica directamente,
  sino un valor que indica qué tan lejos y en qué dirección nos movemos desde el punto
  de referencia, a lo largo del vector director.
explicacion_formal: '![Interpretación del parámetro t](/static/img/geometria/analitica/rectaeq-parametro-t.svg)


  ### Definición formal


  Para $t=0$: $(x,y)=(x_0,y_0)$. Para $t=1$: $(x,y)=(x_0+d_1,y_0+d_2)$, un punto desplazado
  exactamente el vector director completo. Para $t=-1$: $(x,y)=(x_0-d_1,y_0-d_2)$,
  desplazado en la dirección opuesta.


  ### Desarrollo didáctico


  En la figura, con punto $(0,1)$ y vector director $(4,3)$: en $t=0$ estamos en $(0,1)$;
  en $t=1$, en $(4,4)$; en $t=-1$, en $(-4,-2)$. A medida que $t$ aumenta, nos movemos
  en la dirección del vector; a medida que disminuye, en la dirección opuesta.'
definiciones_clave: '- **Interpretación del parámetro t en una ecuación paramétrica
