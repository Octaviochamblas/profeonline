semantic_id: MAT.NUM.FACTORIZACION_PRIMA.CANTIDAD_DIVISORES
resumen_inicial: "La cantidad de divisores de un número se calcula sumando 1 a cada exponente de su descomposición prima y multiplicando los resultados."
explicacion_simple: |
  Imagina que tienes una gran colección de figuritas y quieres guardarlas en cajas de
  igual cantidad. Para saber de cuántas formas distintas puedes organizarlas, necesitas
  conocer la cantidad de divisores del total. Si el número es grande, listar todos los
  divisores uno por uno toma tiempo. ¡Por suerte hay una fórmula mágica usando la
  descomposición prima!
explicacion_formal: |
  Si $N=p_1^{a_1}\cdot p_2^{a_2}\cdots p_k^{a_k}$ es la descomposición prima de $N$,
  cualquier divisor de $N$ se forma eligiendo un exponente entre $0$ y $a_i$ para cada
  primo $p_i$. Por el principio multiplicativo, la cantidad total de divisores es
  $d(N)=(a_1+1)(a_2+1)\cdots(a_k+1)$. Por ejemplo, para $N=12=2^2\cdot3^1$:
  $d(12)=(2+1)(1+1)=6$.
definiciones_clave: |
  **$d(N)$**: notación para la cantidad total de divisores positivos de $N$, calculada a
  partir de los exponentes de su descomposición prima.
propiedades_relaciones: |
  Si un factor primo no aparece con exponente explícito, su exponente es 1 (por ejemplo,
  en $2^2\cdot3$, el exponente de 3 es 1, no 0).
ejemplo_guiado:
  enunciado: "Calcula cuántos divisores tiene el número 20."
  pasos:
    - 'Descomposición prima: $20=2^2\cdot5^1$.'
    - "Sumamos 1 a cada exponente: $2+1=3$ y $1+1=2$."
    - 'Multiplicamos: $3\cdot2=6$. Conclusión: 20 tiene 6 divisores.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué se debe hacer con los exponentes de la descomposición prima para calcular la cantidad de divisores?"
    choices:
      - {text: "Sumarles 1 a cada uno y multiplicar los resultados", is_correct: true}
      - {text: "Multiplicarlos directamente sin modificarlos", is_correct: false}
      - {text: "Sumarlos todos", is_correct: false}
      - {text: "Restarles 1 a cada uno", is_correct: false}
    explanation: "La correcta es Sumarles 1 a cada uno y multiplicar los resultados: cada exponente aporta $(a_i+1)$ opciones de divisor."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuántos divisores tiene 50 ($50=2\\cdot5^2$)?"
    choices:
      - {text: "6", is_correct: true}
      - {text: "3", is_correct: false}
      - {text: "10", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 6: $(1+1)(2+1)=2\\cdot3=6$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Encuentra la descomposición en factores primos del número dado.'
  - 'Paso 2: Identifica todos los exponentes de los factores primos en la descomposición (si un factor primo no tiene exponente escrito, su exponente es 1).'
  - 'Paso 3: Suma 1 a cada uno de los exponentes identificados.'
  - 'Paso 4: Multiplica todos los resultados obtenidos en el Paso 3. El producto final es la cantidad de divisores del número.'
errores_correccion: |
  Un error frecuente es multiplicar los exponentes originales sin sumarles 1 primero.
  Otro error es olvidar que un factor primo sin exponente explícito tiene exponente 1.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Calcula cuántos divisores positivos tiene el número $18$.'
    alternativas:
      - "6"
      - "2"
      - "9"
    respuesta: "6"
    solucion_pasos:
      - 'Paso a: Encontramos la descomposición prima de $18$: $18 = 2^1 \cdot 3^2$.'
      - 'Paso b: Identificamos los exponentes, que son $1$ y $2$.'
      - 'Paso c: Sumamos $1$ a cada exponente: $1+1 = 2$ y $2+1 = 3$.'
      - 'Paso d: Multiplicamos los resultados: $2 \cdot 3 = 6$. El número $18$ tiene $6$ divisores positivos.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Determina la cantidad de divisores positivos de $40$.'
    alternativas:
      - "8"
      - "4"
      - "3"
    respuesta: "8"
    solucion_pasos:
      - 'Paso a: Obtenemos la descomposición prima de $40$: $40 = 2^3 \cdot 5^1$.'
      - 'Paso b: Los exponentes son $3$ y $1$.'
      - 'Paso c: Sumamos $1$ a cada exponente: $3+1 = 4$ y $1+1 = 2$.'
      - 'Paso d: Multiplicamos: $4 \cdot 2 = 8$. Por lo tanto, $40$ tiene $8$ divisores positivos.'
  - titulo: '¿Tiene el número $25$ exactamente $3$ divisores positivos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Descomponemos $25$ en factores primos: $25 = 5^2$.'
      - 'El único exponente es $2$.'
      - 'Sumamos $1$ a este exponente: $2 + 1 = 3$.'
      - 'Como no hay más exponentes que multiplicar, la cantidad de divisores es $3$ (los cuales son $1$, $5$ y $25$).'
  - titulo: 'Si la descomposición prima de un número es $2^2 \cdot 3^2$, ¿significa que tiene exactamente $4$ divisores?'
    respuesta: 'No'
    solucion_pasos:
      - 'Los exponentes en la descomposición $2^2 \cdot 3^2$ son $2$ y $2$.'
      - 'Sumamos $1$ a cada uno: $2+1 = 3$ y $2+1 = 3$.'
      - 'Multiplicamos los resultados: $3 \cdot 3 = 9$ divisores.'
      - 'Por lo tanto, la cantidad de divisores es $9$ y no $4$ (el error común es multiplicar los exponentes originales $2 \cdot 2 = 4$ sin sumarles 1).'
errores_frecuentes:
  - 'Multiplicar los exponentes originales directamente sin sumarles 1 primero.'
  - 'Olvidar que cuando un factor primo no tiene exponente explícito, este es igual a 1.'
  - 'Multiplicar las bases de los factores primos en lugar de sus exponentes modificados.'
  - 'No descomponer por completo el número antes de aplicar la regla (como usar bases compuestas).'
  - 'Olvidar incluir el divisor 1 y el propio número en el conteo total.'
afirmaciones_verdaderas:
  - "El número 12 tiene 6 divisores positivos."
  - "Para calcular la cantidad de divisores, se suma 1 a cada exponente y se multiplican los resultados."
al_terminar_debes_poder: |
  Calcular la cantidad total de divisores de un número entero a partir de su
  descomposición prima.
fuente: 'Teoría de Números'
estado: publicado
