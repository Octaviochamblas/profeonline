semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.INTERCEPTO_ORIGEN
resumen_inicial: La identificación del origen $(0, 0)$ como punto de paso en funciones potencia con exponente entero positivo demuestra que $f(0) = a \cdot 0^n = 0$ para todo $n \in \mathbb{Z}^+$ y $a \neq 0$, actuando simultáneamente como el intercepto único con ambos ejes coordenados, como vértice en exponentes pares y como punto de inflexión en exponentes impares.
explicacion_simple: "![La identificación del origen $(0, 0)$ como punto de paso en funciones potencia con exponente entero positivo demuestra que $f(0) = a \\cdot 0^n = 0$ para todo $n \\in \\mathbb{Z}^+$ y $a \\neq 0$, actuando simultáneamente como el intercepto único con ambos ejes coordenados, como vértice en exponentes pares y como punto de inflexión en exponentes impares](/static/img/nodos/identificacion-del-origen-como-punto-de-paso-en-funciones-potencia-de-exponente-entero-positivo-intro.svg)\n\n\nTodas las funciones potencia elementales con exponente entero positivo ($x^2, x^3, x^4, x^5...$) comparten una **propiedad geométrica universal**:\n\n$$\\mathbf{(0, 0) \\in \\operatorname{Gr}(f)} \\quad (\\text{¡Pasan Obligatoriamente por el Origen de Coordenadas!})$$\n\n- **¿Por qué?**\n  - Al evaluar en $x = 0$, cualquier número real elevado a una potencia positiva da cero: $0^n = 0$.\n  - Al multiplicar por el coeficiente $a$, $f(0) = a \\cdot 0 = \\mathbf{0}$.\n- **¿Qué papel juega el\
  \ origen según el exponente?**\n  - **En exponentes pares ($x^2, x^4$):** El origen $(0, 0)$ es el **VÉRTICE** y punto extremo (el fondo mínimo o la cúspide máxima).\n  - **En exponentes impares ($x^3, x^5$):** El origen $(0, 0)$ es el **PUNTO DE INFLEXIÓN** donde la curva cruza de cuadrante y cambia de concavidad."
explicacion_formal: 'Sea $f(x) = a \cdot x^n$ con $a \in \mathbb{R}^*$ y $n \in \mathbb{Z}^+$.

  Evaluando en el elemento neutro aditivo $x = 0$:

  $$f(0) = a \cdot 0^n = a \cdot 0 = 0$$

  Lo que demuestra que el par ordenado $(0, 0)$ satisface idénticamente la ecuación de la curva:

  $$(0, 0) \in \operatorname{Gr}(f) = \{(x, f(x)) \mid x \in \mathbb{R}\}$$


  **Intersección con los ejes coordenados**:

  1. **Intercepto en el eje $Y$**: Dado por $(0, f(0)) = (0, 0)$.

  2. **Interceptos en el eje $X$**: Resolviendo $f(x) = 0 \implies a x^n = 0 \implies x = 0$ (raíz única de multiplicidad $n$).

  Por lo tanto, la curva no corta a los ejes en ningún otro punto fuera del origen cartesiano.'
definiciones_clave: '- **Intercepto canónico**: Punto único $(0, 0)$ donde la curva coincide simultáneamente con el eje $X$ y el eje $Y$.

  - **Multiplicidad de la raíz en el origen**: Grado $n$ de contacto tangencial de la curva con el eje horizontal en $(0, 0)$.'
propiedades_relaciones: '- **Tangente en el origen**: Para todo $n \ge 2$, $f''(0) = 0$, por lo que la recta tangente en $(0, 0)$ es exactamente el eje horizontal $y = 0$.

  - **Exclusividad de exponentes positivos**: Si $n < 0$, $0^n$ es indefinido y la curva no toca el origen.'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación del origen $(0, 0)$ como punto de paso en funciones potencia con exponente entero positivo demuestra que $f(0) = a \cdot 0^n = 0$ para todo $n \in \mathbb{Z}^+$ y $a \neq 0$, actuando simultáneamente como el intercepto único con ambos ejes coordenados, como vértice en exponentes pares y como punto de inflexión en exponentes impares](/static/img/nodos/identificacion-del-origen-como-punto-de-paso-en-funciones-potencia-de-exponente-entero-positivo-ejemplos.svg)



    Verifica el paso por el origen y describe su naturaleza geométrica para:

    1) $f(x) = -6x^8$

    2) $g(x) = 5x^7$'
  pasos:
  - 'Paso 1: Para $f(x) = -6x^8$:

    - $f(0) = -6(0)^8 = \mathbf{0} \implies (0, 0) \in \operatorname{Gr}(f)$.

    - Como $n = 8$ es par, $(0, 0)$ es el **Vértice y Máximo Absoluto** de la función.'
  - 'Paso 2: Para $g(x) = 5x^7$:

    - $g(0) = 5(0)^7 = \mathbf{0} \implies (0, 0) \in \operatorname{Gr}(g)$.

    - Como $n = 7$ es impar, $(0, 0)$ es el **Punto de Inflexión** donde la curva cruza de concavidad cóncava a convexa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el intercepto con el eje Y de cualquier función potencia de la forma f(x) = axⁿ con n ∈ ℤ⁺?
  choices:
  - text: (0, 0) (el origen cartesiano)
    is_correct: true
  - text: (0, a)
    is_correct: false
  - text: (0, n)
    is_correct: false
  - text: No tiene intercepto en Y
    is_correct: false
  explanation: La alternativa correcta es '(0, 0) (el origen cartesiano)'. Al evaluar en $x = 0$, $f(0) = a(0)^n = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué recta es la tangente a la curva $f(x) = 3x^4$ en el origen $(0, 0)$?
  choices:
  - text: y = 0 (el eje X)
    is_correct: true
  - text: x = 0 (el eje Y)
    is_correct: false
  - text: y = 3x
    is_correct: false
  - text: y = 4x
    is_correct: false
  explanation: La alternativa correcta es 'y = 0 (el eje X)'. Como $f'(0) = 12(0)^3 = 0$, la pendiente es cero y la recta tangente es horizontal.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Evaluar la función en $x = 0$ calculando $f(0) = a \cdot 0^n = 0$.'
- 'Paso 2: Registrar el punto cartesiano $(0, 0)$ como intercepto simultáneo en $X$ e $Y$.'
- 'Paso 3: Si $n$ es par, clasificar $(0, 0)$ como vértice y extremo global.'
- 'Paso 4: Si $n$ es impar ($n \ge 3$), clasificar $(0, 0)$ como punto de inflexión.'
errores_correccion: '- **Error común:** Asumir que una función potencia con exponente negativo ($x^{-2}$) también pasa por $(0, 0)$.

  - **Cómo corregirlo:** El paso por el origen **SOLO ocurre si $n > 0$**; si el exponente es negativo, $x = 0$ **es una división por cero y una asíntota vertical**.'
ejemplos:
- titulo: 'Ejemplo 1: Evaluación en grado 5'
  enunciado: ¿Pasa la función $f(x) = -15x^5$ por el origen?
  alternativas:
  - Sí, f(0) = 0
  - No, pasa por (0, -15)
  - No, pasa por (0, 5)
  - No está definida en x = 0
  respuesta: Sí, f(0) = 0
  solucion_pasos:
  - 'Paso 1: $f(0) = -15(0)^5 = 0 \implies (0, 0) \in \operatorname{Gr}(f)$.'
- titulo: 'Ejemplo 2: Naturaleza en par'
  enunciado: 'En $g(x) = 2x^4$, el punto $(0, 0)$ corresponde a:'
  alternativas:
  - El vértice y mínimo absoluto
  - Un punto de inflexión
  - Un punto cualquiera sin propiedad especial
  - Una discontinuidad evitable
  respuesta: El vértice y mínimo absoluto
  solucion_pasos:
  - 'Paso 1: Al ser par con $a > 0$, el origen es el vértice y mínimo global.'
- titulo: 'Ejemplo 3: Raíz única'
  enunciado: ¿Cuántas raíces reales distintas tiene la ecuación $3x^6 = 0$?
  alternativas:
  - 'Una única raíz real: x = 0 (de multiplicidad 6)'
  - 6 raíces reales distintas
  - 2 raíces reales
  - Ninguna raíz real
  respuesta: 'Una única raíz real: x = 0 (de multiplicidad 6)'
  solucion_pasos:
  - 'Paso 1: $x^6 = 0 \implies x = 0$ como única raíz.'
- titulo: 'Ejemplo 4: Interceptos simultáneos'
  enunciado: ¿En qué puntos corta $y = -x^3$ a los ejes coordenados?
  alternativas:
  - Únicamente en el punto (0, 0)
  - En (0, 0) y (1, 0)
  - En (0, -1)
  - No corta a los ejes
  respuesta: Únicamente en el punto (0, 0)
  solucion_pasos:
  - 'Paso 1: El origen $(0, 0)$ es el único corte con ambos ejes.'
errores_frecuentes:
- Confundir el corte en Y (0, 0) con el punto de escala (1, a).
- Creer que funciones elementales sin traslación cortan al eje Y en y = a.
- Asumir que potencias negativas pasan por el origen.
afirmaciones_verdaderas:
- Toda función potencia con exponente entero positivo pasa por el origen cartesiano (0, 0).
- El punto (0, 0) actúa como vértice en exponentes pares y como punto de inflexión en exponentes impares.
al_terminar_debes_poder: '**QUÉ:** Identificar y caracterizar el origen (0, 0) como punto de paso en funciones potencia.


  **CÓMO:** Demostrando f(0) = 0 y clasificando su rol como vértice (par) o punto de inflexión (impar).


