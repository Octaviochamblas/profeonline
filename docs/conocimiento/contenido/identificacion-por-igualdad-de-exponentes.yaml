semantic_id: MAT.ALG.SIMILARIDAD.IGUALDAD_EXPONENTES
resumen_inicial: La identificación por igualdad de exponentes exige verificar que cada variable compartida tenga exactamente la misma potencia en todos los términos para validar su semejanza algebraicamente.
explicacion_simple: "Tener las mismas letras NO es suficiente para que dos términos sean semejantes: **los exponentes de cada letra deben ser exactamente iguales**:\n- **Comparación variable por variable**:\n  - Toma la variable $x$ en el primer término y revisa su exponente. Debe coincidir exactamente con el exponente de $x$ en el segundo término.\n  - Repite el proceso para $y, z$, etc.\n- **Ejemplo**:\n  - Término A: $5x^3 y^2$\n  - Término B: $-2x^3 y^2 \\implies$ Mismos exponentes ($3$ para $x$, $2$ para $y$) $\\implies$ **Semejantes**.\n  - Término C: $4x^2 y^3 \\implies$ Exponentes cambiados ($2$ para $x$, $3$ para $y$) $\\implies$ **NO semejante a A ni a B**.\n\n![Identificación por Igualdad de Exponentes](/static/img/nodos/identificacion-por-igualdad-de-exponentes-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $\mathcal{V} = \{x_1, x_2, \dots, x_k\}$ el conjunto de variables de dos monomios $M_1 = c_1 \prod x_i^{a_i}$ y $M_2 = c_2 \prod x_i^{b_i}$. El **criterio estricto de igualdad de exponentes** establece la equivalencia de los vectores de potencia en $\mathbb{N}_0^k$:


  $$M_1 \sim M_2 \iff (a_1, a_2, \dots, a_k) = (b_1, b_2, \dots, b_k)$$


  ### Sistema de Ecuaciones para la Semejanza con Parámetros

  Si dos monomios $M_1 = 3x^p y^q$ y $M_2 = -7x^5 y^4$ son semejantes, el criterio de igualdad de exponentes impone el sistema de identidades deterministas:


  $$\begin{cases} \deg_x(M_1) = \deg_x(M_2) \implies p = 5 \\ \deg_y(M_1) = \deg_y(M_2) \implies q = 4 \end{cases}$$


  ### Síntesis didáctica

  La verificación de los exponentes es el filtro determinante para no cometer sumas erróneas entre términos de distinto grado como $x^2 + x^3$.

  '
definiciones_clave: '- **Igualdad de exponentes**: Coincidencia numérica exacta entre los exponentes de cada variable correspondiente en dos o más monomios.

  - **Vector de potencias ($(a_1, \dots, a_k)$)**: Secuencia ordenada de los exponentes asociados a las variables del término.

  - **Grado relativo ($\deg_{x_i}$)**: Exponente individual asignado a la variable $x_i$.

  '
propiedades_relaciones: '- **Incompatibilidad de grados distintos**: Términos con idénticas bases pero distintos exponentes ($x^2$ y $x^3$) pertenecen a clases de equivalencia totalmente disjuntas.

  - **Determinación de parámetros**: Permite calcular valores desconocidos en exponentes imponiendo la condición de semejanza.

  '
ejemplo_guiado:
  enunciado: Determina el valor del parámetro $k$ para que los términos $4x^{k+1} y^3$ y $-9x^5 y^3$ sean semejantes.
  pasos:
  - 'Paso 1: Identificamos que la variable $y$ tiene el mismo exponente $3$ en ambos términos.'
  - 'Paso 2: Igualamos los exponentes de la variable $x$: $k + 1 = 5$.'
  - 'Paso 3: Despejamos el parámetro $k$: $k = 5 - 1 \implies k = 4$.'
  - 'Paso 4: Verificamos sustituyendo $k = 4$: $x^{4+1} = x^5$, obteniendo el factor literal $x^5 y^3$.'
  - 'Conclusión: El valor del parámetro es **$k = 4$**.'
  imagen: /static/img/nodos/identificacion-por-igualdad-de-exponentes-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre si dos términos tienen las mismas letras pero sus exponentes no coinciden variable por variable?
  choices:
  - text: Los términos no son semejantes y no se pueden sumar algebraicamente en un solo término
    is_correct: true
  - text: Los términos son semejantes y se suman los exponentes
    is_correct: false
  - text: Los coeficientes se multiplican directamente
    is_correct: false
  - text: Se eliminan las variables
    is_correct: false
  explanation: La alternativa correcta es 'Los términos no son semejantes y no se pueden sumar algebraicamente en un solo término'. Exponentes distintos impiden la semejanza.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $5x^a y^2$ y $-3x^4 y^b$ son semejantes, ¿cuáles son los valores de $a$ y $b$?
  choices:
  - text: Los valores son $a = 4$ y $b = 2$, por la igualdad de los exponentes de $x$ e $y$
    is_correct: true
  - text: Los valores son $a = 5$ y $b = -3$
    is_correct: false
  - text: Los valores son $a = 2$ y $b = 4$
    is_correct: false
  - text: Los valores son $a = 0$ y $b = 0$
    is_correct: false
  explanation: La alternativa correcta es 'Los valores son $a = 4$ y $b = 2$, por la igualdad de los exponentes de $x$ e $y$'. Igualdad $a=4, b=2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las variables comunes presentes en ambos monomios.'
- 'Paso 2: Comparar el exponente de la primera variable en ambos términos.'
- 'Paso 3: Repetir la comparación para cada una de las variables restantes.'
- 'Paso 4: Si todos los exponentes coinciden exactamente, clasificar los términos como semejantes.'
errores_correccion: '- **Error 1:** Sumar los exponentes de términos que se están sumando (escribir $x^2 + x^3 = x^5$). **Cómo corregirlo:** Términos con distintos exponentes **NO SE PUEDEN SUMAR ($x^2 + x^3$ queda igual)**.

  - **Error 2:** Declarar que $x^2 y$ y $x y^2$ son semejantes por tener exponentes 1 y 2. **Cómo corregirlo:** El exponente **DEBE PERTENECER A LA MISMA VARIABLE ($x$ tiene exponente 2 en el primero y 1 en el segundo)**.

  '
ejemplos:
- titulo: Exponentes idénticos
  enunciado: ¿Son semejantes $7a^4 b^2$ y $-3a^4 b^2$?
  alternativas:
  - Sí, $a$ tiene exponente 4 e $y$ tiene exponente 2 en ambos
  - No, difieren en los coeficientes
  - No, por el signo negativo
  respuesta: Sí, $a$ tiene exponente 4 e $y$ tiene exponente 2 en ambos
  solucion_pasos:
  - '1. Exponentes de $a$: $4 = 4$.'
  - '2. Exponentes de $b$: $2 = 2$.'
  - 3. Términos semejantes.
- titulo: Ecuación de exponentes
  enunciado: Si $x^m$ es semejante a $x^7$, ¿cuál es el valor de $m$?
  alternativas:
  - $7$
  - $1$
  - $0$
  respuesta: $7$
  solucion_pasos:
  - '1. Igualdad de exponentes: $m = 7$.'
- titulo: Incompatibilidad de grado
  enunciado: ¿Son semejantes $x^2$ y $x^3$?
  respuesta: 'No'
  solucion_pasos:
  - No, sus exponentes $2 \neq 3$ son distintos.
- titulo: Múltiples variables ordenadas
  enunciado: Para los términos $2p^3 q^5$ y $-8p^3 q^5$, ¿coincide el vector de potencias $(3, 5)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(3, 5) = (3, 5)$, son semejantes.
errores_frecuentes:
- Sumar los exponentes al intentar reducir términos no semejantes como x^2 + x^3.
- Considerar semejantes dos términos donde los mismos exponentes están asignados a variables distintas.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Ignorar la diferencia entre un exponente explicito y el exponente uno implícito.
- Declarar que la igualdad de coeficientes compensa la desigualdad de los exponentes.
afirmaciones_verdaderas:
- Para que dos monomios sean semejantes, los exponentes de cada variable correspondiente deben ser idénticos.
- Términos con las mismas variables pero exponentes distintos en alguna de ellas no se pueden reducir por suma o resta.
al_terminar_debes_poder: '![Resumen de igualdad de exponentes](/static/img/nodos/identificacion-por-igualdad-de-exponentes-resumen.svg)


  QUÉ: Comprobar la igualdad estricta de exponentes letra por letra para confirmar la semejanza.


  CÓMO: Contrastar el grado relativo de cada variable $\operatorname{Exp}_{x_i}(T_1) = \operatorname{Exp}_{x_i}(T_2)$, distinguiendo términos con exponentes cruzados como $x^3y^2 \not\sim x^2y^3$.'
