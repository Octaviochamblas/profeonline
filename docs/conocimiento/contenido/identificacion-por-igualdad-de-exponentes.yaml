resumen_inicial: La semejanza requiere la coincidencia uno a uno de los exponentes
  para cada variable homóloga de la parte literal.
explicacion_simple: 'Tener las mismas letras no es suficiente para que dos términos
  sean semejantes: los exponentes de cada letra tienen que coincidir exactamente.
  Por ejemplo, $3x^2y^4$ y $5x^2y^4$ son semejantes porque la $x$ tiene exponente
  $2$ en ambos y la $y$ exponente $4$ en ambos.'
explicacion_formal: 'Dados $T_1 = c_1 \prod x_j^{e_{1,j}}$ y $T_2 = c_2 \prod x_j^{e_{2,j}}$,
  la **Condición de Igualdad de Exponentes** exige:


  $$\forall j \in \{1, \dots, m\}, \quad \text{Exp}(x_j, T_1) = \text{Exp}(x_j, T_2)
  \iff e_{1,j} = e_{2,j}$$


  > **Complemento didáctico:** La igualdad de exponentes garantiza la equivalencia
  dimensional de las variables homólogas.'
definiciones_clave: '- **Exponentes homólogos**: Exponentes asociados a la misma variable
  en términos distintos.'
propiedades_relaciones: '- **Rigidez exponencial**: Si existe al menos un $j$ tal
  que $e_{1,j} \neq e_{2,j}$, los términos son no semejantes.'
ejemplo_guiado:
  enunciado: Compruebe si $T_1 = 4x^5y^3$ y $T_2 = -9x^5y^3$ satisfacen la igualdad
    de exponentes.
  pasos:
  - 'Paso 1: Exponente de $x$ en $T_1$: $5$; exponente de $x$ en $T_2$: $5 \implies
    5 = 5$.

    - Paso 2: Exponente de $y$ en $T_1$: $3$; exponente de $y$ en $T_2$: $3 \implies
    3 = 3$.'
  - 'Paso 3: Verificar la coincidencia para todas las letras.'
  - 'Conclusión: Coinciden en todos los exponentes homólogos, luego SÍ son términos
    semejantes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con la semejanza si dos términos tienen las mismas letras
    pero al menos un exponente homólogo es diferente?
  choices:
  - text: Los términos dejan de ser semejantes de forma automática
    is_correct: true
  - text: Los términos se vuelven semejantes
    is_correct: false
  - text: Se deben sumar los exponentes para arreglarlo
    is_correct: false
  - text: El coeficiente pasa a ser cero
    is_correct: false
  explanation: La alternativa correcta es 'Los términos dejan de ser semejantes de
    forma automática'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4x^5y^3 y -9x^5y^3, ¿cuáles fueron los exponentes
    homólogos verificados?
  choices:
  - text: 5 para x y 3 para y en ambos términos
    is_correct: true
  - text: 4 y -9
    is_correct: false
  - text: 8 y 6
    is_correct: false
  - text: 15 y 15
    is_correct: false
  explanation: La alternativa correcta es '5 para x y 3 para y en ambos términos'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Emparejar las variables homólogas de ambos términos.'
- 'Paso 2: Comparar individualmente cada exponente.'
- 'Paso 3: Confirmar la semejanza únicamente si todos los exponentes coinciden.'
errores_correccion: '- **Error 1: Considerar semejantes a $x^3y^2$ y $x^2y^3$ por
  tener exponentes $2$ y $3$.** **Cómo corregirlo:** La igualdad de exponentes exige
  que la MISMA variable tenga el mismo exponente ($x^3 \neq x^2$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Por qué 7a^4b^2 y -2a^4b^2 son semejantes?
  alternativas:
  - Porque los exponentes de a son 4 y los de b son 2 en ambos términos
  - Porque 7 - 2 = 5
  - Porque ambos tienen el signo positivo
  - Indeterminado
  respuesta: Porque los exponentes de a son 4 y los de b son 2 en ambos términos
  solucion_pasos:
  - 1. Coinciden exactamente en los exponentes homólogos de a y b. Son semejantes.
- titulo: Ejemplo 2
  enunciado: ¿Son 5x^3 y 5x^4 términos semejantes?
  alternativas:
  - No, porque los exponentes de x difieren (3 != 4)
  - Sí, porque ambos tienen coeficiente 5
  - Sí, porque la variable es x
  - Indeterminado
  respuesta: No, porque los exponentes de x difieren (3 != 4)
  solucion_pasos:
  - 1. Aunque el coeficiente y la letra son iguales, 3 != 4 impide la semejanza.
- titulo: ¿Es necesaria la coincidencia de todos los exponentes homólogos para afirmar
    semejanza?
  respuesta: Sí
  solucion_pasos:
  - Sí, la falta de coincidencia en un solo exponente destruye la semejanza.
- titulo: ¿Basta que la suma de exponentes (grado absoluto) sea igual para que dos
    términos sean semejantes?
  respuesta: 'No'
  solucion_pasos:
  - No, x^4y^1 y x^2y^3 tienen grado 5 pero NO son semejantes porque sus exponentes
    homólogos difieren.
errores_frecuentes:
- Declarar semejantes a términos apoyándose únicamente en la igualdad de sus grados
  absolutos.
- Intercambiar los exponentes de las variables y declarar que siguen siendo semejantes.
- Declarar que los exponentes sin escribir equivalen a exponente 0 en lugar de 1.
- Ignorar las diferencias de exponentes entre variables secundarias.
- Sumar los exponentes de variables distintas para justificar semejanza.
afirmaciones_verdaderas:
- La semejanza exige que cada variable tenga exactamente el mismo exponente en ambos
  términos.
- Términos con igual grado absoluto no son necesariamente semejantes si sus exponentes
  homólogos difieren.
al_terminar_debes_poder: Al terminar serás capaz de verificar la semejanza entre términos
  comparando minuciosamente los exponentes de cada variable homóloga.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.
estado: publicado
semantic_id: MAT.ALG.SIMILARIDAD.IGUALDAD_EXPONENTES
