semantic_id: MAT.GEO.POLIGONOS_BASE.DEFINICION_POLIGONO
resumen_inicial: 'Un polígono es una figura geométrica plana delimitada por una secuencia finita de segmentos de recta consecutivos que encierran una región del plano sin auto-intersecarse.'
explicacion_simple: |
  ![Definición de Polígono](/static/img/nodos/definicion-de-poligono-como-figura-plana-cerrada-formada-por-segmentos-intro.svg)

  Un polígono es una figura plana de bordes completamente rectos y cerrados. Para ser polígono, sus lados no pueden cruzarse entre sí ni contener líneas curvas.
explicacion_formal: |
  ### Definición axiomática de polígono
  Un polígono en el plano euclidiano $\mathbb{R}^2$ es la unión de una línea poligonal cerrada simple y la región interior que encierra. Formalmente, dados $n \geq 3$ puntos coplanares $V_1, V_2, \dots, V_n$ (vértices), se define como la figura acotada formada por los segmentos $\overline{V_1 V_2}, \overline{V_2 V_3}, \dots, \overline{V_n V_1}$ (lados) tales que:

  1. Cada vértice es extremo de exactamente dos lados consecutivos.
  2. Dos lados no consecutivos no tienen puntos en común: $\overline{V_i V_{i+1}} \cap \overline{V_j V_{j+1}} = \emptyset$ para $|i - j| > 1$.
  3. Ningún par de lados consecutivos es colineal.

  ### Convexidad y concavidad
  - **Polígono convexo**: Para cualquier par de puntos $A, B$ en el interior del polígono, el segmento $\overline{AB}$ está completamente contenido en el polígono. Todos sus ángulos interiores miden menos de $180^\circ$.
  - **Polígono cóncavo**: Existe al menos un par de puntos interiores cuyo segmento de unión sale de la figura. Posee al menos un ángulo interior reflejo (mayor de $180^\circ$).

  > **Complemento didáctico:** Un polígono divide al plano en tres regiones disjuntas: el interior (acotado), la frontera (la línea poligonal que define el perímetro) y el exterior (ilimitado). Para comprobar si un polígono es convexo, ningún segmento trazado entre dos de sus puntos interiores puede cruzar la frontera ni salir de la figura.
definiciones_clave: |
  - **Línea poligonal cerrada simple**: Trayectoria cerrada formada por segmentos consecutivos que no se cruzan consigo misma.
  - **Región poligonal**: Área del plano bidimensional delimitada por la frontera del polígono.
  - **Convexidad**: Propiedad geométrica donde todos los ángulos interiores son estrictamente menores a $180^\circ$.
  - **Polígono simple vs complejo**: El polígono simple divide el plano exactamente en región interior y exterior; el complejo presenta auto-intersecciones de lados.
propiedades_relaciones: |
  - **Mínimo número de lados**: El polígono de menor cantidad de lados en el plano es el triángulo ($n = 3$).
  - **Partición del plano**: Teorema de la Curva de Jordan: un polígono divide el plano en tres conjuntos disjuntos: interior, frontera y exterior.
  - **Bordes rectilíneos**: Toda curva, arco o elipse queda excluida de la definición de polígono.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Definición de Polígono](/static/img/nodos/definicion-de-poligono-como-figura-plana-cerrada-formada-por-segmentos-ejemplos.svg)

    Determina si una figura plana cerrada formada por 4 segmentos de recta con un ángulo interior de $210^\circ$ es un polígono y clasifícalo según su convexidad.
  pasos:
  - 'Paso 1: Verificar las condiciones de polígono: está formada por segmentos rectos ($n = 4$) y es cerrada simple ⟹ Sí es un polígono (cuadrilátero).'
  - 'Paso 2: Evaluar la medida de sus ángulos interiores: uno de ellos mide $210^\circ > 180^\circ$.'
  - 'Paso 3: Clasificar por convexidad: al tener un ángulo mayor de $180^\circ$, se clasifica como un cuadrilátero cóncavo (o no convexo).'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuál de las siguientes condiciones es estrictamente obligatoria para que una figura plana sea un polígono?'
  choices:
  - text: 'Estar delimitada exclusivamente por segmentos de recta consecutivos que formen una trayectoria cerrada sin auto-intersecciones'
    is_correct: true
  - text: 'Tener todos sus lados y ángulos exactamente de la misma medida'
    is_correct: false
  - text: 'Poseer al menos una arista con curvatura suave y continua'
    is_correct: false
  - text: 'Tener un número infinito de lados que converjan a una circunferencia'
    is_correct: false
  explanation: 'Estar delimitada exclusivamente por segmentos de recta consecutivos que formen una trayectoria cerrada sin auto-intersecciones.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿Por qué una circunferencia o una figura abierta NO pueden clasificarse como polígonos?'
  choices:
  - text: 'Porque la circunferencia tiene borde curvo y la figura abierta no encierra una región finita del plano'
    is_correct: true
  - text: 'Porque una circunferencia tiene solo 3 vértices colineales'
    is_correct: false
  - text: 'Porque todos los polígonos deben tener obligatoriamente 4 lados congruentes'
    is_correct: false
  - text: 'Porque las figuras abiertas tienen una cantidad infinita de diagonales interiores'
    is_correct: false
  explanation: 'Porque la circunferencia tiene borde curvo y la figura abierta no encierra una región finita del plano.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar la frontera de la figura: verificar que conste únicamente de segmentos de recta.'
- 'Paso 2: Comprobar que no existan aberturas (la línea debe comenzar y terminar en el mismo punto).'
- 'Paso 3: Verificar que no haya cruces ni lados que se intersequen fuera de los vértices.'
- 'Paso 4: Contar los lados $n$ para determinar el tipo de polígono ($n \geq 3$).'
- 'Paso 5: Medir los ángulos interiores: si todos son $< 180^\circ$ es convexo; si alguno es $> 180^\circ$ es cóncavo.'
errores_correccion: 'No confundas polígono con cualquier figura geométrica cerrada: las figuras con arcos curvos (círculos, sectores circulares) o los sólidos tridimensionales no son polígonos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el número mínimo de lados que debe tener un polígono en el plano euclidiano?
  alternativas:
  - '3 lados (triángulo)'
  - '2 lados'
  - '4 lados (cuadrilátero)'
  respuesta: '3 lados (triángulo)'
  solucion_pasos:
  - 'En el plano se requieren como mínimo 3 rectas que no concurran en un mismo punto para encerrar una región de área positiva: el triángulo ($n = 3$).'
- titulo: Ejemplo 2
  enunciado: ¿Un polígono que tiene un ángulo interior de 195° es convexo o cóncavo?
  alternativas:
  - 'Cóncavo, porque tiene al menos un ángulo mayor de 180°'
  - 'Convexo, porque tiene más de 3 lados'
  - 'No es un polígono porque supera los 180°'
  respuesta: 'Cóncavo, porque tiene al menos un ángulo mayor de 180°'
  solucion_pasos:
  - 'Por definición, si un polígono tiene uno o más ángulos interiores mayores que $180^\circ$, es cóncavo.'
- titulo: ¿Un círculo es un polígono con infinitos lados?
  respuesta: 'No'
  solucion_pasos:
  - 'No, rigurosamente un círculo no es un polígono porque su frontera es una curva continua y no una secuencia finita de segmentos rectos.'
- titulo: ¿Un cuadrilátero con forma de flecha o búmeran es un polígono cóncavo?
  respuesta: 'Sí'
  solucion_pasos:
  - 'Sí, porque está formado por 4 segmentos rectos cerrados y posee un vértice con ángulo interior entrante mayor de $180^\circ$.'
errores_frecuentes:
- 'Clasificar un círculo o una elipse como polígonos regulares.'
- 'Considerar que figuras cruzadas (como dos triángulos unidos en un vértice en forma de reloj de arena) son polígonos simples.'
- 'Creer que un polígono cóncavo deja de ser polígono por tener un ángulo interior mayor de $180^\circ$.'
- 'Confundir el perímetro (longitud de la frontera) con la región interior (área del polígono).'
afirmaciones_verdaderas:
- 'Todo polígono está formado exclusivamente por una cantidad finita de segmentos rectos.'
- 'El polígono de menor número de lados posible en el plano es el triángulo ($n = 3$).'
- 'En un polígono convexo todos los ángulos interiores son menores que $180^\circ$.'
al_terminar_debes_poder: |
  **QUÉ:** Definir, identificar y clasificar polígonos planos distinguiendo figuras válidas de no-polígonos y diferenciando figuras convexas de cóncavas.

  **CÓMO:** Analizando la linealidad de sus bordes segmentarios, la clausura del perímetro sin auto-intersecciones y la magnitud de sus ángulos interiores ($< 180^\circ$ o $> 180^\circ$).

  ![Resumen de Definición de Polígono](/static/img/nodos/definicion-de-poligono-como-figura-plana-cerrada-formada-por-segmentos-resumen.svg)
