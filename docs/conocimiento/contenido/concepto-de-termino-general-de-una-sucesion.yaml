resumen_inicial: El término general de una sucesión es la expresión algebraica $a_n
  = f(n)$ que permite calcular directamente el valor de cualquier término en función
  de su posición $n$.
explicacion_simple: El término general es como una receta o fórmula matemática. Si
  quieres saber qué número está en la posición 100, no necesitas calcular los 99 anteriores;
  basta con poner el número 100 en el lugar de la $n$ de la fórmula.
explicacion_formal: 'El **Término General $a_n$** de una sucesión se define como la
  regla explícita de correspondencia:


  $$a_n = f(n) \quad \text{donde } f: \mathbb{N}^+ \to \mathbb{R}$$


  **Cálculo directo sin iteración:**

  - Permite hallar el término de posición $n = 500$ evaluando directamente $f(500)$.'
definiciones_clave: '- **Término general $a_n$**: Expresión algebraica $a_n = f(n)$
  en función de la posición $n$.'
propiedades_relaciones: '- **Independencia iterativa**: Halla cualquier posición sin
  requerir términos previos.'
ejemplo_guiado:
  enunciado: Explique el significado del término general $a_n = n^2$ y determine el
    término de posición $n=10$.
  pasos:
  - 'Paso 1: $a_n = n^2$ indica que el valor de cada posición es el cuadrado de su
    número de orden.'
  - 'Paso 2: Para $n=10$, calcular directamente $a_{10} = 10^2 = 100$.'
  - 'Conclusión: El décimo término es $100$ sin requerir calcular del $a_1$ al $a_9$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ventaja fundamental de contar con el término general an =
    f(n) de una sucesión?
  choices:
  - text: Permite calcular directamente el valor de cualquier posición n sin requerir
      los términos anteriores
    is_correct: true
  - text: Elimina la necesidad de usar números enteros
    is_correct: false
  - text: Hace que todos los términos sean iguales a uno
    is_correct: false
  - text: Convierte la sucesión en un gráfico plano
    is_correct: false
  explanation: La alternativa correcta es 'Permite calcular directamente el valor
    de cualquier posición n sin requerir los términos anteriores'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para an = n^2, ¿cuál es el valor del décimo término
    a10?
  choices:
  - text: '100'
    is_correct: true
  - text: '20'
    is_correct: false
  - text: '10'
    is_correct: false
  - text: '50'
    is_correct: false
  explanation: La alternativa correcta es '100'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de comprender e interpretar el término
  general $a_n = f(n)$ como la regla algebraica de correspondencia de una sucesión.
semantic_id: MAT.NUM.SUCESIONES_BASE.TERMINO_GENERAL_CONCEPTO
procedimiento:
- 'Paso 1: Identificar el tipo de definición de la sucesión (término general explícito
  $a_n = f(n)$ o relación de recurrencia $a_n = g(a_{n-1})$).'
- 'Paso 2: Sustituir los índices de posición $n = 1, 2, 3, \dots$ para calcular los
  términos requeridos.'
- 'Paso 3: Verificar la consistencia de la secuencia numérica obtenida.'
errores_correccion: '- **Error 1: Sustituir $n=0$ en el término general pretendiendo
  obtener el primer término.** **Cómo corregirlo:** En el convenio escolar estándar,
  la posición del primer término empieza estrictamente en $n=1$.


  - **Error 2: Intentar calcular un término lejano en una definición recursiva sin
  conocer la condición inicial.** **Cómo corregirlo:** Una fórmula recursiva EXIGE
  conocer al menos el primer término $a_1$ para iterar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.SUCESIONES_BASE.TERMINO_GENERAL_CONCEPTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de conceptos de sucesiones numéricas.
- titulo: Ejemplo 2
  enunciado: Verificación de la notación por subíndices.
  alternativas:
  - Cumple la notación
  - No cumple
  - Indeterminado
  respuesta: Cumple la notación
  solucion_pasos:
  - Demostración formal por $a_n = f(n)$.
- titulo: ¿Comienza la posición n del primer término en n = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, en el dominio estándar $\mathbb{N}^+$.
- titulo: ¿Altera el orden de los elementos la identidad de una sucesión?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la posición determina la asignación de cada término.
errores_frecuentes:
- Evaluar $n = 0$ para encontrar el primer término de una sucesión definida en los
  enteros positivos.
- Declarar el valor numérico del término $a_n$ con la posición ordinal $n$ en la fórmula
  general.
- Intentar una sucesión como si fuera un conjunto desordenado donde el orden de los
  elementos no importa.
- Usar una relación recursiva para calcular la posición 100 sin conocer los 99 términos
  anteriores.
- Declarar que toda secuencia gráfica responde a un crecimiento lineal simple sin
  probar la diferencia.
afirmaciones_verdaderas:
- Una sucesión numérica es una función de dominio entero positivo $\mathbb{N}^+$ a
  valores reales.
- El término general $a_n = f(n)$ permite calcular el valor de cualquier posición
  $n$ en un solo paso de evaluación.
