semantic_id: MAT.NUM.SUCESIONES_BASE.TERMINO_GENERAL_CONCEPTO
resumen_inicial: 'El término general de una sucesión es una fórmula explícita $a_n = f(n)$ que determina el valor del término en cualquier posición $n \in \mathbb{N}$ sin calcular los términos previos.'
explicacion_simple: |
  El **término general** ($a_n$) es la "fórmula mágica" que fabrica cualquier número de la sucesión:
  - En vez de sumar paso a paso para llegar al número en el lugar 100, simplemente pones $n = 100$ en la fórmula.
  - Por ejemplo, si $a_n = 4n + 1$:
    - Para $n = 1 \implies a_1 = 4(1) + 1 = 5$
    - Para $n = 2 \implies a_2 = 4(2) + 1 = 9$
    - Para $n = 100 \implies a_{100} = 4(100) + 1 = 401$
  - El término general te da acceso instantáneo a cualquier posición.

  ![Concepto de término general](/static/img/nodos/concepto-de-termino-general-de-una-sucesion-intro.svg)
explicacion_formal: |
  ### Definición formal
  El **término general** o **fórmula explícita** de una sucesión $(a_n)_{n \ge 1}$ es la expresión analítica cerrada $f: \mathbb{N} \to \mathbb{R}$ que define la regla de correspondencia directa:
  $$a_n = f(n) \quad \forall n \in \mathbb{N}$$
  donde la variable independiente $n$ representa la posición ordinal entera positiva.

  ### Propiedad de Independencia de Cálculo
  A diferencia de los métodos recursivos, la fórmula explícita permite evaluar $a_k$ con una sola operación algebraica de sustitución $n=k$, con costo computacional constante $O(1)$, sin requerir el conocimiento de los $k-1$ términos precedentes.

  ### Tipología de Términos Generales
  - **Polinomiales lineales**: $a_n = d \cdot n + c$ (crecimiento aditivo constante).
  - **Polinomiales cuadráticos**: $a_n = a n^2 + b n + c$ (segundas diferencias constantes).
  - **Exponenciales**: $a_n = c \cdot r^n$ (crecimiento multiplicativo geométrico).
  - **Alternantes**: $a_n = (-1)^n \cdot g(n)$ (cambio periódico de signo).

  ### Síntesis didáctica
  - Ecuación explícita: $a_n = f(n)$.
  - Eficiencia: Obtención directa de $a_{1000}$ evaluando $n=1000$.
definiciones_clave: |
  - **Término general ($a_n$)**: Expresión algebraica en función de $n$ que define todos los términos de una sucesión.
  - **Fórmula explícita**: Regla matemática que entrega directamente el valor de un término a partir de su posición.
  - **Forma cerrada**: Expresión que se evalúa mediante un número finito de operaciones aritméticas estándar.
propiedades_relaciones: |
  - **Generación universal**: El término general determina por completo el comportamiento asintótico, la monotonía y los límites de la sucesión.
  - **Conexión con funciones continuas**: $a_n$ corresponde a la restricción al dominio discreto $\mathbb{N}$ de una función real $f(x)$.
ejemplo_guiado:
  enunciado: 'Dada la sucesión con término general $a_n = 5n - 2$, calcula los términos $a_1, a_3$ y determina el valor del término en la posición $n=20$.'
  imagen: '/static/img/nodos/concepto-de-termino-general-de-una-sucesion-ejemplos.svg'
  pasos:
    - 'Paso 1: Para $n=1$, evaluamos: $a_1 = 5(1) - 2 = 5 - 2 = 3$.'
    - 'Paso 2: Para $n=3$, evaluamos: $a_3 = 5(3) - 2 = 15 - 2 = 13$.'
    - 'Paso 3: Para la posición $n=20$, sustituimos directamente: $a_{20} = 5(20) - 2 = 100 - 2 = 98$.'
    - 'Paso 4: Conclusión: $a_1 = 3$, $a_3 = 13$ y el término vigésimo es **$a_{20} = 98$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la principal ventaja de conocer el término general $a_n$ de una sucesión?'
    choices:
      - {text: 'Calcular directamente cualquier término $a_k$ sustituyendo $n=k$ sin calcular los términos previos', is_correct: true}
      - {text: 'Cambiar el orden de los términos de la lista a voluntad', is_correct: false}
      - {text: 'Convertir la sucesión en un conjunto finito de números', is_correct: false}
      - {text: 'Eliminar los números negativos de la sucesión', is_correct: false}
    explanation: 'La alternativa correcta es ''Calcular directamente cualquier término $a_k$ sustituyendo $n=k$ sin calcular los términos previos''. El término general es una fórmula explícita directa e independiente.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el término general de una sucesión es $a_n = n^2 + 1$, ¿cuál es el valor de $a_5$?'
    choices:
      - {text: '$26$, calculando $5^2 + 1 = 25 + 1 = 26$', is_correct: true}
      - {text: '$11$, multiplicando $5 \cdot 2 + 1$', is_correct: false}
      - {text: '$25$, olvidando sumar 1', is_correct: false}
      - {text: '$36$, evaluando en $(5+1)^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$26$, calculando $5^2 + 1 = 25 + 1 = 26$''. Sustituyendo $n=5$: $a_5 = 5^2 + 1 = 26$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la expresión algebraica del término general $a_n = f(n)$.'
  - 'Paso 2: Sustituir la variable $n$ por el número de posición deseado.'
  - 'Paso 3: Realizar las operaciones aritméticas respetando la jerarquía (potencias, productos, sumas).'
  - 'Paso 4: Expresar el resultado como el valor del término indexado $a_n$.'
errores_correccion: |
  - **Error 1:** Creer que para hallar el término 50 es obligatorio calcular los 49 anteriores. **Cómo corregirlo:** La ventaja del término general es que **evalúa directamente en $n=50$** en un solo paso.
  - **Error 2:** Sustituir valores decimales o no enteros en la variable $n$. **Cómo corregirlo:** En sucesiones estándar, la variable $n$ **siempre pertenece al conjunto de los números naturales $\mathbb{N}$**.
ejemplos:
  - titulo: 'Cálculo de término lejano'
    enunciado: 'Para $a_n = 3n + 7$, ¿cuál es el valor del término $a_{30}$?'
    alternativas:
      - '$97$'
      - '$90$'
      - '$100$'
    respuesta: '$97$'
    solucion_pasos:
      - '1. $a_{30} = 3(30) + 7 = 90 + 7 = 97$.'
  - titulo: 'Término general fraccionario'
    enunciado: 'Para $a_n = \frac{n}{n+1}$, ¿cuál es el tercer término $a_3$?'
    alternativas:
      - '$\frac{3}{4}$'
      - '$\frac{1}{2}$'
      - '$\frac{4}{3}$'
    respuesta: '$\frac{3}{4}$'
    solucion_pasos:
      - '1. $a_3 = \frac{3}{3+1} = \frac{3}{4}$.'
  - titulo: 'Término general cuadrático'
    enunciado: '¿La fórmula $a_n = 2n^2$ genera los términos $2, 8, 18, 32$ para $n=1, 2, 3, 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $a_1 = 2(1)^2 = 2$, $a_2 = 2(4) = 8$, $a_3 = 2(9) = 18$, $a_4 = 2(16) = 32$.'
  - titulo: 'Independencia de cálculo'
    enunciado: '¿Se puede calcular $a_{100}$ en $a_n = 5n - 1$ sin conocer el valor de $a_{99}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Sí, la fórmula explícita solo depende del valor $n=100$.'
errores_frecuentes:
  - 'Para calcular un término lejano en una fórmula explícita es obligatorio calcular secuencialmente todos los términos anteriores.'
  - 'La variable $n$ del término general puede reemplazarse por números negativos o fracciones.'
  - 'El término general $a_n = 3n$ genera una sucesión constante donde todos los términos valen tres.'
  - 'La expresión $a_n$ se interpreta como la multiplicación de una constante $a$ por la variable $n$.'
  - 'Una sucesión con término general cuadrático presenta diferencias constantes de primer orden entre términos.'
afirmaciones_verdaderas:
  - 'El término general $a_n = f(n)$ permite obtener el valor de cualquier término de la sucesión evaluando directamente su posición $n$.'
  - 'El cálculo de un término a partir de su fórmula explícita no requiere el conocimiento de los términos previos de la secuencia.'
