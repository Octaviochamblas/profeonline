procedimiento:
- 'Paso 1: Entiende que ''$a_n = \dots$'' es una fórmula matemática.'
- 'Paso 2: Reconoce que la ''$n$'' de la fórmula representa el número de la posición.'
- 'Paso 3: Para descubrir el valor de un término, se reemplaza la ''n'' por la posición
  deseada y se resuelve la operatoria.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en concepto de término general de una sucesión.
ejemplos:
- titulo: La fábrica de impares
  enunciado: La fórmula general de los números impares es $a_n = 2n - 1$. Sin sumar
    desde el principio, ¿cuál es el 50° número impar?
  solucion_pasos:
  - Quiero la posición 50, así que $n = 50$.
  - 'Tomo la fórmula: $2 \cdot (50) - 1$.'
  - 'Multiplico: $100 - 1 = 99$.'
  - El número impar número 50 de la fila es el 99.
errores_frecuentes:
- Creer que la letra 'n' en la fórmula representa el valor del número en sí, en lugar
  de su posición.
- Pensar que todas las sucesiones tienen una fórmula simple (algunas sucesiones reales
  son muy caóticas y difíciles de modelar con una sola fórmula).
afirmaciones_verdaderas:
- La formulación de concepto de término general de una sucesión mantiene la regularidad
  de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando concepto de término
  general de una sucesión.
