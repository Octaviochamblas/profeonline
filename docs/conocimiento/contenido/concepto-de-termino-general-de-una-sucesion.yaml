semantic_id: MAT.NUM.SUCESIONES_BASE.TERMINO_GENERAL_CONCEPTO
resumen_inicial: 'Concepto de término general de una sucesión: concepto y desarrollo
  dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: Si te doy los números 2, 4, 6... es fácil adivinar el que sigue.
  Pero si te pido el término que está en la posición un millón, ¿vas a sumar de a
  2 un millón de veces? ¡Para eso inventamos el Término General!
explicacion_formal: 'Imagina que una sucesión es una fábrica de hacer números. El
  **término general** es la ''receta secreta'' de la máquina.


  Es una expresión algebraica que siempre lleva la letra ''$n$'' (la posición).

  Por ejemplo, si la fórmula de la máquina es **$a_n = 3n$**, significa que la máquina
  toma el número de posición que tú le digas y lo multiplica por 3.


  - Si quieres fabricar al que va primero ($n=1$): $3 \cdot 1 = 3$.

  - Si quieres fabricar al segundo ($n=2$): $3 \cdot 2 = 6$.

  - Si quieres descubrir quién está en la posición número cien ($n=100$): $3 \cdot
  100 = 300$.


  El término general te da el superpoder de ''teletransportarte'' a cualquier lugar
  de la fila sin tener que calcular todos los números anteriores.'
definiciones_clave: '- **Concepto de término general de una sucesión**: Concepto fundamental
  dentro del estudio de Conceptos fundamentales de sucesiones.'
propiedades_relaciones: '- **Propiedades de Concepto de término general de una sucesión**:
