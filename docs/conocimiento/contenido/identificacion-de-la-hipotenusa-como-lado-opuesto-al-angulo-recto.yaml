semantic_id: MAT.GEO.TRIANGULOS_RECTANGULOS.HIPOTENUSA
resumen_inicial: La hipotenusa es el lado de mayor longitud en un triángulo rectángulo,
  situado estrictamente en posición opuesta al ángulo recto de 90°.
explicacion_simple: '![Hipotenusa](/static/img/nodos/identificacion-de-la-hipotenusa-como-lado-opuesto-al-angulo-recto-intro.svg)


  En cualquier triángulo rectángulo, si te paras en la esquina cuadrada de **$90^\circ$**
  y miras hacia el frente, el lado que ves directamente enfrente es la **hipotenusa**.
  Es el lado más largo de los tres y nunca toca el vértice del ángulo recto.'
explicacion_formal: '### Definición formal

  En un triángulo rectángulo $\Delta ABC$ ($\gamma = 90^\circ$), la **hipotenusa**
  es el lado opuesto al ángulo recto, el cual posee estrictamente la mayor longitud
  de los tres lados del triángulo:


  $$c = AB = \operatorname{Hipotenusa} \iff c = \sqrt{a^2 + b^2} > \max(a, b)$$


  ### Desglose simbólico y geométrico

  - $c$: Longitud de la hipotenusa.

  - Posición frontal: Se ubica directamente enfrentada al ángulo de $90^\circ$.

  - Diámetro circunscrito: La hipotenusa coincide exactamente con el diámetro de la
  circunferencia circunscrita al triángulo ($c = 2R$).


  ### Síntesis didáctica

  La hipotenusa es el segmento dominante en el triángulo rectángulo y la base de referencia
  para el cálculo de proyecciones y relaciones métricas.'
definiciones_clave: '- **Hipotenusa**: Lado opuesto al ángulo recto en un triángulo
  rectángulo.

  - **Lado mayor**: Segmento de mayor longitud de la figura triangular.

  - **Fórmula de Pitágoras**: $c = \sqrt{a^2 + b^2}$. '
propiedades_relaciones: '- **Circuncentro en el punto medio**: El centro de la circunferencia
  circunscrita es exactamente el punto medio de la hipotenusa ($M = \frac{B+C}{2}$),
  cumpliéndose $R = a/2$.

  - **Mediana relativa a la hipotenusa**: La longitud de la mediana trazada desde
  el ángulo recto a la hipotenusa mide exactamente la mitad de la hipotenusa ($m_a
  = a/2$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Hipotenusa](/static/img/nodos/identificacion-de-la-hipotenusa-como-lado-opuesto-al-angulo-recto-ejemplos.svg)


    En un triángulo rectángulo $\triangle DEF$, el ángulo recto se ubica en el vértice
    $E$ ($\angle E = 90^\circ$), y los lados que salen de $E$ miden $DE = 8\text{
    cm}$ y $EF = 15\text{ cm}$. Identifica el nombre de la hipotenusa y calcula su
    longitud.'
  pasos:
  - 'Paso 1: Localizar el vértice del ángulo recto: es el punto $E$.'
  - 'Paso 2: Identificar el lado opuesto al vértice $E$: es el segmento $\overline{DF}$
    (la hipotenusa).'
  - 'Paso 3: Aplicar el Teorema de Pitágoras: $DF^2 = DE^2 + EF^2 = 8^2 + 15^2$.'
  - 'Paso 4: Calcular los cuadrados: $DF^2 = 64 + 225 = 289$.'
  - 'Paso 5: Extraer la raíz cuadrada: $DF = \sqrt{289} = 17\text{ cm}$.'
  - 'Paso 6: Concluir que la hipotenusa es el segmento $\overline{DF}$ y mide $17\text{
    cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se identifica la hipotenusa en cualquier triángulo rectángulo?
  choices:
  - text: Es el lado opuesto al ángulo recto de 90° (el lado de mayor longitud)
    is_correct: true
  - text: Es cualquiera de los dos lados que forman el ángulo recto
    is_correct: false
  - text: Es siempre el lado horizontal inferior
    is_correct: false
  - text: Es el lado más corto del triángulo
    is_correct: false
  explanation: Por definición geométrica, la hipotenusa es el lado opuesto al ángulo
    recto de 90° (el lado de mayor longitud).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en el triángulo ABC el ángulo recto está en el vértice B, ¿cuál segmento
    es la hipotenusa?
  choices:
  - text: El segmento AC (opuesto al vértice B)
    is_correct: true
  - text: El segmento AB
    is_correct: false
  - text: El segmento BC
    is_correct: false
  - text: La altura de la figura
    is_correct: false
  explanation: Como el ángulo recto está en B, la hipotenusa es el segmento AC (opuesto
    al vértice B).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el ángulo recto de $90^\circ$ (marcado con un cuadradito).'
- 'Paso 2: Trazar una línea visual recta hacia el lado que está enfrente.'
- 'Paso 3: Declarar dicho segmento como la hipotenusa del triángulo.'
- 'Paso 4: Si se requiere su valor numérico, calcular $c = \sqrt{a^2 + b^2}$.'
errores_correccion: 'No confundas la hipotenusa con los catetos: la hipotenusa nunca
  forma el ángulo recto, sino que está enfrente de él.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si los lados de un triángulo rectángulo miden $9\text{ cm}, 12\text{
    cm}$ y $15\text{ cm}$, ¿cuál es la hipotenusa?
  alternativas:
  - $15\text{ cm}$
  - $12\text{ cm}$
  - $9\text{ cm}$
  respuesta: $15\text{ cm}$
  solucion_pasos:
  - La hipotenusa es el lado de mayor longitud: $15\text{ cm}$ (pues $9^2 + 12^2 =
      15^2$).
- titulo: Ejemplo 2
  enunciado: En el triángulo $\triangle RST$, si $\angle S = 90^\circ$, ¿cuáles dos
    lados son los catetos?
  alternativas:
  - $\overline{RS}\text{ y }\overline{ST}$
  - $\overline{RT}\text{ y }\overline{RS}$
  - $\overline{RT}\text{ y }\overline{ST}$
  respuesta: $\overline{RS}\text{ y }\overline{ST}$
  solucion_pasos:
  - Los lados que concurren en el ángulo recto $S$ son $\overline{RS}$ y $\overline{ST}$
    (catetos).
- titulo: ¿La hipotenusa es siempre el lado más largo de un triángulo rectángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser opuesta al ángulo mayor de 90°.
- titulo: ¿La hipotenusa puede ser perpendicular a uno de los catetos?
  respuesta: 'No'
  solucion_pasos:
  - No, los perpendiculares entre sí son los dos catetos.
errores_frecuentes:
- Confundir la hipotenusa con el cateto de mayor medida.
- Pensar que la hipotenusa solo existe si el triángulo está en posición estándar.
- Creer que un triángulo puede tener dos hipotenusas.
- Olvidar que la hipotenusa no toca el vértice del ángulo recto.
- Confundir la hipotenusa con la altura trazada desde el ángulo recto.
afirmaciones_verdaderas:
- La hipotenusa es el lado opuesto al ángulo recto en un triángulo rectángulo.
- La hipotenusa es estrictamente el lado de mayor longitud del triángulo rectángulo.
al_terminar_debes_poder: '**QUÉ:** Identificar y calcular la hipotenusa de cualquier
  triángulo rectángulo.


  **CÓMO:** Reconociendo el lado opuesto al ángulo de $90^\circ$ y aplicando la fórmula
  de Pitágoras $c = \sqrt{a^2 + b^2}$.


  ![Resumen de Hipotenusa](/static/img/nodos/identificacion-de-la-hipotenusa-como-lado-opuesto-al-angulo-recto-resumen.svg)'
