semantic_id: MAT.GEO.TRIANGULOS_NOTABLES.TRIANGULO_45_45_90
resumen_inicial: El triángulo notable 45°-45°-90° es un triángulo rectángulo isósceles
  donde los catetos son iguales ($a$) y la hipotenusa mide $a\sqrt{2}$.
explicacion_simple: Imagina cortar un cuadrado perfecto por su diagonal. Obtienes
  dos triángulos idénticos con dos ángulos de 45° y una hipotenusa que mide el cateto
  multiplicado por $\sqrt{2}$.
explicacion_formal: 'En el **triángulo rectángulo notable 45°-45°-90°**, por ser isósceles,
  sus catetos son iguales ($a = b$). Por el Teorema de Pitágoras, la hipotenusa $c$
  cumple:


  $$c = \sqrt{a^2 + a^2} = a\sqrt{2}$$'
definiciones_clave: '- **Triángulo 45°-45°-90°**: Triángulo rectángulo isósceles notable.

  - **Factor $\sqrt{2}$**: Razón constante entre la hipotenusa y cualquiera de los
  catetos.'
propiedades_relaciones: '- **Catetos idénticos**: Si los catetos miden $k$, la hipotenusa
  mide $k\sqrt{2}$.

  - **Mitad del cuadrado**: Es la figura obtenida al trazar la diagonal de un cuadrado
  de lado $k$.'
ejemplo_guiado:
  enunciado: Una escuadra escolar notable 45°-45°-90° tiene catetos iguales que miden
    $a = 3\text{ cm}$. Calcula la longitud exacta de su hipotenusa $c$.
  pasos:
  - 'Paso 1: Aplicar la relación constante del triángulo notable 45°-45°-90°: $c =
    a\sqrt{2}$.'
  - 'Paso 2: Sustituir $a = 3$: $c = 3\sqrt{2}\text{ cm}$.'
  - 'Paso 3: Concluir que la hipotenusa exacta mide $3\sqrt{2}\text{ cm}$ (aproximadamente
    4.24 cm).'
checkpoints:
- placement: after_explicacion_formal
  question: En un triángulo notable 45°-45°-90° de cateto k, ¿cuánto mide la hipotenusa?
  choices:
  - text: k√2
    is_correct: true
  - text: 2k
    is_correct: false
  - text: k√3
    is_correct: false
  - text: k/2
    is_correct: false
  explanation: La alternativa correcta es 'k√2'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los catetos iguales de la escuadra miden 3 cm, ¿cuál es la medida exacta
    de su hipotenusa?
  choices:
  - text: 3√2 cm
    is_correct: true
  - text: 6 cm
    is_correct: false
  - text: 3√3 cm
    is_correct: false
  - text: 3 cm
    is_correct: false
  explanation: La alternativa correcta es '3√2 cm', por la relación $c = a\sqrt{2}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados y el teorema geométrico del concepto.'
- 'Paso 2: Plantear la ecuación algebraica o relación correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar su coherencia geométrica.'
errores_correccion: Evita confundir las propiedades de los lados con las de los ángulos
  interiores al clasificar la figura.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo dos ángulos interiores miden 49° y 62°, ¿cuánto mide
    el tercero?
  alternativas:
  - 69°
  - 111°
  - 90°
  respuesta: 69°
  solucion_pasos:
  - Despejar $x = 180 - (49 + 62) = 69^\circ$.
- titulo: Ejemplo 2
  enunciado: Si dos lados de un triángulo miden 106 cm y 143 cm, ¿cuál puede ser la
    medida del tercer lado?
  alternativas:
  - 247 cm
  - 254 cm
  - 0 cm
  respuesta: 247 cm
  solucion_pasos:
  - Por Desigualdad Triangular, el tercer lado debe ser menor que 249 cm.
- titulo: ¿La suma de los tres ángulos interiores de cualquier triángulo en el plano
    es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental e invariante de la geometría euclidiana.
- titulo: ¿Un triángulo puede tener dos ángulos rectos de 90° en su interior?
  respuesta: 'No'
  solucion_pasos:
  - No, porque 90° + 90° = 180°, dejando 0° para el tercer ángulo, lo cual imposibilita
    cerrar la figura.
errores_frecuentes:
- Declarar la suma de ángulos interiores (180°) con la suma de ángulos exteriores
  (360°).
- Afirmar que un triángulo isósceles tiene sus tres lados iguales (eso corresponde
  al equilátero).
- Declarar que cualquier trío de medidas de varillas puede formar un triángulo sin
  verificar la Desigualdad Triangular.
- Declarar los catetos con la hipotenusa en triángulos rectángulos orientados en distintas
  posiciones.
- Omitir que en un triángulo equilátero cada uno de sus tres ángulos interiores mide
  exactamente 60°.
afirmaciones_verdaderas:
- La suma de los ángulos interiores de todo triángulo en el plano es siempre igual
  a 180°.
- En todo triángulo rectángulo, la hipotenusa es el lado de mayor longitud opuesto
  al ángulo recto.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar y calcular las
  propiedades de relación de lados en el triángulo notable 45°-45°-90° resolviendo
  problemas geométricos con rigurosidad.
