    se tienen las dimensiones principales $r = 3\text{ cm}$ y $h = 1104\text{ cm}$.
    Halla el volumen $V$ o área superficial.
  pasos:
  - Usar la fórmula tridimensional de identificación del dodecaedro regular.
  - Sustituir los datos $r = 3$ y $h = 1104$.
  - Calcular el valor numérico en el espacio tridimensional.
