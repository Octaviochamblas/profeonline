semantic_id: MAT.GEO.POLIEDROS_PRISMAS.DODECAEDRO_REGULAR
resumen_inicial: 'Identificación del dodecaedro regular: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: El dodecaedro regular está formado por doce 'casas' pentagonales
  idénticas, ensambladas para formar un cuerpo geométrico casi esférico.
explicacion_formal: '![Dodecaedro regular (esquema)](/static/img/geometria/espacio-cuerpos/dodecaedro-regular.svg)


  ### Definición formal


  El dodecaedro regular es uno de los cinco sólidos platónicos. Tiene 12 caras (todas
  pentágonos regulares congruentes), 20 vértices y 30 aristas. En cada vértice concurren
  exactamente 3 caras.


  ### Desarrollo didáctico


  El esquema muestra una vista frontal simplificada: un pentágono central rodeado
  por las caras adyacentes que se ''inclinan'' hacia el fondo del cuerpo. El nombre
  ''dodecaedro'' proviene del griego ''dodeca'' (doce), en referencia a sus 12 caras.'
definiciones_clave: '- **Identificación del dodecaedro regular**: Elemento o propiedad
  fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del dodecaedro regular.'
ejemplo_guiado:
