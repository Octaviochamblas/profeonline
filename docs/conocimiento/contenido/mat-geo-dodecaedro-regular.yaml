procedimiento:
- 'Paso 1: Verifica que el cuerpo tenga exactamente 12 caras pentagonales.'
- 'Paso 2: Verifica que las 12 caras sean pentágonos regulares congruentes entre sí.'
- 'Paso 3: Confirma que en cada uno de los 20 vértices concurran exactamente 3 caras.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con identificación del dodecaedro regular.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de identificación del dodecaedro regular para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando identificación del dodecaedro regular.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de identificación del dodecaedro regular
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de identificación del dodecaedro regular.
- titulo: ¿Se cumple siempre la propiedad principal de identificación del dodecaedro
    regular en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación del dodecaedro regular asumir un valor negativo cuando
    representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en identificación del dodecaedro regular.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en identificación
  del dodecaedro regular.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en identificación
  del dodecaedro regular.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de identificación
  del dodecaedro regular.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
