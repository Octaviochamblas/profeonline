semantic_id: MAT.NUM.RACIONALES_CONCEPTO.CONDICION_DENOMINADOR_NO_CERO
resumen_inicial: "En un número racional $a/b$, el denominador $b$ nunca puede ser cero, porque la división por cero no está definida."
explicacion_simple: |
  La definición de número racional exige un denominador entero, pero no cualquier entero:
  hay exactamente un valor que queda prohibido. Imagina repartir 5 chocolates entre 0
  personas: no tiene sentido, no hay una respuesta. Por eso el denominador de una fracción
  racional nunca puede ser cero.
explicacion_formal: |
  La condición $b\neq0$ es parte de la definición misma de
  $\mathbb{Q}=\{a/b:a,b\in\mathbb{Z},b\neq0\}$: si $b=0$, la expresión $a/b$ no representa
  ningún número, ya que no existe un valor $x$ tal que $0\cdot x=a$ para $a\neq0$, y si
  $a=0$ también, cualquier $x$ serviría, lo que tampoco define un número único.
definiciones_clave: |
  **División por cero**: operación no definida en matemáticas; ningún número multiplicado
  por $0$ da un resultado distinto de $0$, por lo que no existe un cociente válido.
propiedades_relaciones: |
  Esta condición es la misma razón por la que la división por cero está prohibida en toda
  la aritmética, no solo en fracciones: es una regla que se hereda a todo el sistema
  numérico, incluidos los racionales.
ejemplo_guiado:
  enunciado: "Determina si la expresión 8/0 representa un número racional."
  pasos:
    - "Identificamos el denominador de la expresión: es $0$."
    - 'La definición de racional exige $b\neq0$.'
    - "Conclusión: $8/0$ no representa ningún número racional, porque el denominador es cero."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué la expresión a/0 no representa ningún número cuando a es distinto de cero?"
    choices:
      - {text: "Porque no existe ningún x tal que 0·x sea igual a a", is_correct: true}
      - {text: "Porque el resultado sería un número negativo", is_correct: false}
      - {text: "Porque el resultado sería demasiado grande", is_correct: false}
      - {text: "Porque a debe ser mayor que 0", is_correct: false}
    explanation: "La correcta es Porque no existe ningún x tal que 0·x sea igual a a: ningún número multiplicado por 0 da un resultado distinto de 0."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es -3/0 un número racional?"
    choices:
      - {text: "No, porque el denominador es 0", is_correct: true}
      - {text: "Sí, porque el numerador es negativo", is_correct: false}
      - {text: "Sí, porque -3 es un entero", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es No, porque el denominador es 0: la condición $b\\neq0$ no se cumple."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Localiza el denominador antes de aceptar la expresión como un número racional."
  - "Paso 2: Verifica si el denominador es igual a cero."
  - "Paso 3: Si el denominador es cero, la expresión no es un número racional (ni ningún número). Si es distinto de cero, sí puede serlo."
errores_correccion: |
  Un error frecuente es confundir "denominador cero" con "numerador cero": una fracción
  con numerador $0$ y denominador distinto de cero (como $0/5$) sí es un número racional
  válido, igual a $0$.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Representa la expresión $\\frac{5}{0}$ un número racional?"
    alternativas:
      - "No, porque el denominador es 0"
      - "Sí, porque el numerador es distinto de 0"
      - "No se puede determinar"
    respuesta: "No, porque el denominador es 0"
    solucion_pasos:
      - "Paso a: Identificamos el denominador de la expresión, que es $0$."
      - "Paso b: La definición de racional exige que el denominador sea distinto de cero."
      - 'Paso c: Como no se cumple esa condición, $\frac{5}{0}$ no representa ningún número racional.'
  - titulo: "Ejemplo 2"
    enunciado: "¿Es la expresión $\\frac{0}{7}$ un número racional?"
    alternativas:
      - "Sí, porque el denominador es distinto de 0"
      - "No, porque el numerador es 0"
      - "No se puede determinar"
    respuesta: "Sí, porque el denominador es distinto de 0"
    solucion_pasos:
      - "Paso a: Identificamos el denominador de la expresión, que es $7$."
      - 'Paso b: Como $7\neq0$, la condición de racional se cumple.'
      - 'Paso c: $\frac{0}{7}=0$, que es un número racional válido.'
  - titulo: "¿Es válida la expresión $\\frac{a}{0}$ como número racional para algún entero a?"
    respuesta: "No"
    solucion_pasos:
      - "La definición de número racional exige que el denominador sea distinto de cero."
      - "Sin importar el valor de $a$, un denominador igual a $0$ nunca cumple esa condición."
      - "Por lo tanto, ninguna expresión con denominador $0$ es un número racional."
  - titulo: "¿Puede el numerador de una fracción racional ser 0?"
    respuesta: "Sí"
    solucion_pasos:
      - "La condición que prohíbe el valor cero aplica solo al denominador, no al numerador."
      - 'Una fracción como $\frac{0}{4}$ cumple $b\neq0$ perfectamente.'
      - "Por lo tanto, el numerador sí puede ser $0$; la fracción simplemente vale $0$."
errores_frecuentes:
  - "Confundir la prohibición del denominador cero con una prohibición sobre el numerador."
  - "Creer que dividir por cero da como resultado cero, en vez de que la operación no está definida."
  - "Pensar que dividir por cero da como resultado un número infinito válido."
  - "Aceptar como racional una expresión con denominador cero sin verificar la condición."
  - 'Creer que la condición $b\neq0$ solo aplica a fracciones con numerador distinto de cero.'
afirmaciones_verdaderas:
  - "El denominador de un número racional siempre debe ser distinto de cero."
  - 'La fracción $\frac{0}{4}$ es un número racional válido, igual a 0.'
al_terminar_debes_poder: |
  Justificar por qué el denominador de un número racional nunca puede ser cero y
  distinguir una expresión no definida de un número racional válido.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
