semantic_id: MAT.NUM.RACIONALES_CONCEPTO.CONDICION_DENOMINADOR_NO_CERO
resumen_inicial: En todo número racional $\frac{a}{b}$, el denominador $b$ debe ser
  estrictamente distinto de cero ($b \neq 0$).
explicacion_simple: El denominador de una fracción nos indica en cuántas partes iguales
  dividimos la unidad entera. Como no es posible dividir un objeto en cero partes
  ni realizar divisiones por cero en aritmética, el denominador de cualquier número
  racional jamás puede ser cero.
explicacion_formal: 'Para cualquier expresión racional de la forma $\frac{P(x)}{Q(x)}$,
  la **Condición de Existencia Racional** exige la restricción del dominio:


  $$Q(x) \neq 0 \implies \text{Dom}\left(\frac{P(x)}{Q(x)}\right) = \mathbb{R} \setminus
  \{ x \mid Q(x) = 0 \}$$


  **Desglose de la fórmula:**

  - $\frac{P(x)}{Q(x)}$: Cociente algebraico o fracción racional.

  - $Q(x) = 0$: Puntos de indefinición donde la expresión deja de existir en el cuerpo
  de los racionales.


  > **Complemento didáctico:** Para hallar qué valores inhabilitan una fracción como
  $\frac{5}{x - 4}$, se iguala el denominador a cero ($x - 4 = 0 \implies x = 4$).'
definiciones_clave: '- **Condición de no nulidad del denominador**: Regla $b \neq
  0$ que garantiza la existencia matemática de la fracción.

  - **Puntos de indefinición**: Valores de la variable que anulan el denominador.'
propiedades_relaciones: '- **Restricción algebraica**: Se aplica a todas las fracciones
  y ecuaciones racionales.'
ejemplo_guiado:
  enunciado: Determine para qué valor de $x$ la expresión $\frac{8}{x + 6}$ NO representa
    un número racional.
  pasos:
  - 'Paso 1: Identificar el denominador de la fracción: $x + 6$.'
  - 'Paso 2: Igualar el denominador a cero para hallar el valor prohibido: $x + 6
    = 0$.'
  - 'Paso 3: Despejar $x$: $x = -6$.'
  - 'Conclusión: Si $x = -6$, el denominador se hace cero y la expresión NO es un
    número racional.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué el denominador de una fracción a/b no puede ser igual a cero?
  choices:
  - text: Porque la división por cero no está definida en matemáticas
    is_correct: true
  - text: Porque convertiría el número en positivo
    is_correct: false
  - text: Porque los numeradores siempre son mayores que cero
    is_correct: false
  - text: Porque la suma daría cero
    is_correct: false
  explanation: La alternativa correcta es 'Porque la división por cero no está definida
    en matemáticas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿para qué valor de x se incalcula la fracción 8
    / (x + 6)?
  choices:
  - text: x = -6
    is_correct: true
  - text: x = 6
    is_correct: false
  - text: x = 0
    is_correct: false
  - text: x = 8
    is_correct: false
  explanation: La alternativa correcta es 'x = -6'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar el denominador de la expresión racional.'
- 'Paso 2: Plantear la ecuación $Q(x) = 0$ para encontrar las restricciones.'
- 'Paso 3: Excluir los valores hallados estableciendo la condición $Q(x) \neq 0$.'
errores_correccion: '- **Error 1: Confundir denominador cero con numerador cero.**
  $\frac{0}{5} = 0$ (es racional), pero $\frac{5}{0}$ está INDEFINIDO (no es racional).


  - **Error 2: Olvidar restringir variables en el denominador.** En $\frac{3}{x-2}$,
  olvidar exigir $x \neq 2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la condición de existencia para $\frac{12}{2x - 8}$?
  alternativas:
  - x ≠ 4
  - x ≠ 0
  - x ≠ -4
  respuesta: x ≠ 4
  solucion_pasos:
  - $2x - 8 = 0 \implies 2x = 8 \implies x = 4$. Por ende, $x \neq 4$.
- titulo: Ejemplo 2
  enunciado: Calcule el valor de $\frac{0}{-9}$.
  alternativas:
  - '0'
  - Indefinido
  - '-9'
  respuesta: '0'
  solucion_pasos:
  - El numerador puede ser cero; $\frac{0}{-9} = 0$.
- titulo: ¿Es cierto que el numerador de una fracción sí puede ser igual a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{0}{b} = 0$ con $b \neq 0$ es un racional válido.
- titulo: ¿Es la expresión 3/0 igual a 0?
  respuesta: 'No'
  solucion_pasos:
  - No, la división por cero no está definida.
errores_frecuentes:
- Una fracción cuyo denominador es cero evalúa siempre al número entero cero.
- El numerador de un número racional jamás puede tomar el valor de cero.
- Si el denominador de una fracción es cero la expresión se transforma en un entero
  positivo.
- Cualquier número entero se indefine al colocarse como numerador de una fracción.
- La condición $b \neq 0$ aplica únicamente cuando el numerador es un número impar.
afirmaciones_verdaderas:
- En todo número racional $\frac{a}{b}$, el denominador $b$ debe ser estrictamente
  distinto de cero.
- La expresión $\frac{0}{b}$ es igual a 0 para todo $b \neq 0$, mientras que $\frac{a}{0}$
  no está definida.
al_terminar_debes_poder: Al terminar serás capaz de identificar y aplicar la condición
  $b \neq 0$, determinando las restricciones del denominador que garantizan la existencia
  de una expresión racional.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
