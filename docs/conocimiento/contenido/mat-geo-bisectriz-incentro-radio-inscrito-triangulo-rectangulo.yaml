semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.RADIO_INSCRITO_TRIANGULO_RECTANGULO
resumen_inicial: 'Cálculo del radio inscrito en un triángulo rectángulo mediante r
  = (a + b - c) / 2: conceptos, teoremas, propiedades geométricas y cálculo en Elementos
  Secundarios del Triángulo.'
explicacion_simple: 'En triángulos rectángulos existe un atajo para calcular el inradio,
  sin necesidad de calcular el área por separado: basta con conocer los catetos y
  la hipotenusa.'
explicacion_formal: '![Radio inscrito en un triángulo rectángulo](/static/img/geometria/elementos-secundarios/bisectriz-incentro-radio-inscrito-triangulo-rectangulo.svg)


  ### Definición formal


  En un triángulo rectángulo con catetos $a$, $b$ e hipotenusa $c$, el radio inscrito
  es $r=\frac{a+b-c}{2}$, fórmula equivalente a $r=\frac{\text{Área}}{s}$ para este
  caso particular.


  ### Desarrollo didáctico


  Para el triángulo rectángulo de catetos 3 y 4 e hipotenusa 5: $r=\frac{3+4-5}{2}=\frac{2}{2}=1$,
  coincidiendo con el cálculo por área y semiperímetro.'
definiciones_clave: '- **Cálculo del radio inscrito en un triángulo rectángulo mediante
