semantic_id: MAT.FUND.RAZONAMIENTO_LOGICO.DE_MORGAN_CONJUNCION
resumen_inicial: 'Definición y aplicación de la Ley de De Morgan para la negación de una conjunción: $\neg(p \land q) \equiv \neg p \lor \neg q$.'
explicacion_simple: |
  La **Primera Ley de De Morgan** nos enseña cómo negar correctamente una frase que tiene la palabra "y" (una conjunción). Si alguien afirma: "Es falso que estudié y aprobé", eso significa que o bien no estudió, o bien no aprobó (o ambas). En símbolos lógicos: **$\neg(p \land q) \equiv \neg p \lor \neg q$**. Al introducir la negación dentro del paréntesis, **se niega cada proposición por separado y el conector "y" ($\land$) se transforma en "o" ($\lor$)**.
explicacion_formal: |
  ### Definición formal
  En el cálculo proposicional, la **Ley de De Morgan para la conjunción** es el teorema de dualidad lógica que establece la equivalencia semántica:
  $$\neg(p \land q) \equiv \neg p \lor \neg q \quad \iff \quad \models \neg(p \land q) \leftrightarrow (\neg p \lor \neg q)$$
  En teoría de conjuntos, corresponde al complemento de la intersección: $(A \cap B)^c = A^c \cup B^c$.

  ### Desglose simbólico
  - Transformación estructural: El operador unario exterior $\neg$ se distribuye invirtiendo los literales ($p \mapsto \neg p$, $q \mapsto \neg q$) y conmuta el operador conjuntor ($\land$) por el disyuntor ($\lor$).
  - Vector de salida conjunto:
    - $\mathbf{v}(p \land q) = [V, F, F, F]^T \implies \mathbf{v}(\neg(p \land q)) = [F, V, V, V]^T$.
    - $\mathbf{v}(\neg p \lor \neg q) = [F \lor F, F \lor V, V \lor F, V \lor V]^T = [F, V, V, V]^T$.

  ### Síntesis didáctica
  Para negar que dos condiciones ocurran simultáneamente, basta con afirmar que al menos una de ellas no ocurre.
definiciones_clave: |
  - **Ley de De Morgan para la conjunción**: Teorema lógico formalizado por $\neg(p \land q) \equiv \neg p \lor \neg q$.
  - **Dualidad de operadores**: Principio por el cual la conjunción y la disyunción se transforman mutuamente bajo la acción del complemento.
  - **Distribución con inversión de conectivo**: Regla de reescritura que transforma $\land$ en $\lor$ al negar un bloque.
propiedades_relaciones: |
  - **Generalización a $n$ términos**: $\neg(p_1 \land p_2 \land \dots \land p_n) \equiv \neg p_1 \lor \neg p_2 \lor \dots \lor \neg p_n$.
  - **Forma normal disyuntiva**: Permite transformar fórmulas proposicionales complejas a su forma canónica disyuntiva o conjuntiva.
ejemplo_guiado:
  enunciado: 'Demuestra mediante tabla de verdad que la fórmula $\neg(p \land q)$ es lógicamente equivalente a $\neg p \lor \neg q$.'
  pasos:
    - 'Paso 1: Disponer las $4$ combinaciones canónicas de entrada para $p$ y $q$.'
    - 'Paso 2: Calcular la subcolumna $p \land q$: $[V, F, F, F]^T$.'
    - 'Paso 3: Calcular el lado izquierdo $\neg(p \land q)$: Invertir la columna anterior, obteniendo $[F, V, V, V]^T$.'
    - 'Paso 4: Calcular el lado derecho $\neg p \lor \neg q$:
      - Fila 1 ($F \lor F$): $F$
      - Fila 2 ($F \lor V$): $V$
      - Fila 3 ($V \lor F$): $V$
      - Fila 4 ($V \lor V$): $V$. Vector: $[F, V, V, V]^T$.'
    - 'Paso 5: Comparar los vectores: Como $[F, V, V, V]^T = [F, V, V, V]^T$, se demuestra formalmente la Primera Ley de De Morgan.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿A cuál de las siguientes expresiones es lógicamente equivalente la negación de la conjunción $\neg(p \land q)$?'
    choices:
      - {text: '$\neg p \lor \neg q$', is_correct: true}
      - {text: '$\neg p \land \neg q$', is_correct: false}
      - {text: '$p \lor q$', is_correct: false}
      - {text: '$\neg p \to \neg q$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\neg p \lor \neg q$''. Al aplicar De Morgan, el conectivo $\land$ se transforma obligatoriamente en $\lor$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la negación lógica formal del enunciado "Juan estudia matemáticas y aprueba el examen"?'
    choices:
      - {text: 'Juan no estudia matemáticas o no aprueba el examen', is_correct: true}
      - {text: 'Juan no estudia matemáticas y no aprueba el examen', is_correct: false}
      - {text: 'Si Juan estudia matemáticas, entonces no aprueba', is_correct: false}
      - {text: 'Juan nunca estudia matemáticas', is_correct: false}
    explanation: 'La alternativa correcta es ''Juan no estudia matemáticas o no aprueba el examen''. La negación de "y" produce un "o" entre las partes negadas.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar una fórmula con estructura de conjunción negada: $\neg(A \land B)$.'
  - 'Paso 2: Negar individualmente el primer término $A \mapsto \neg A$.'
  - 'Paso 3: Sustituir el conectivo de conjunción $\land$ por el de disyunción $\lor$.'
  - 'Paso 4: Negar individualmente el segundo término $B \mapsto \neg B$.'
  - 'Paso 5: Escribir la expresión equivalente simplificada: $\neg A \lor \neg B$.'
errores_correccion: |
  - **Error 1:** Mantener el conector "y" al negar: escribir $\neg(p \land q) \equiv \neg p \land \neg q$. **Cómo corregirlo:** La Ley de De Morgan exige transformar el conectivo; el conjuntor ($\land$) debe sustituirse por el disyuntor ($\lor$).
  - **Error 2:** Negar solo una de las variables dentro del paréntesis. **Cómo corregirlo:** La negación exterior afecta a ambos operandos por igual: $\neg(p \land q) \equiv \neg p \lor \neg q$.
ejemplos:
  - titulo: 'Negación de conjunción aritmética'
    enunciado: '¿Cuál es la negación de "$x > 0 \land y > 0$"?'
    alternativas:
      - '$x \leq 0 \lor y \leq 0$'
      - '$x \leq 0 \land y \leq 0$'
      - '$x < 0 \lor y < 0$'
    respuesta: '$x \leq 0 \lor y \leq 0$'
    solucion_pasos:
      - '1. Negar $x > 0 \implies x \leq 0$.'
      - '2. Cambiar $\land$ por $\lor$.'
      - '3. Negar $y > 0 \implies y \leq 0$.'
      - '4. Resultado: $x \leq 0 \lor y \leq 0$.'
  - titulo: 'Aplicación con variable negada'
    enunciado: '¿A qué equivale $\neg(p \land \neg q)$ aplicando De Morgan y doble negación?'
    respuesta: '$\neg p \lor q$'
    solucion_pasos:
      - '1. $\neg(p \land \neg q) \equiv \neg p \lor \neg(\neg q)$.'
      - '2. Por doble negación: $\neg p \lor q$.'
  - titulo: 'Vector de verdad'
    enunciado: '¿El vector de salida de $\neg(p \land q)$ es $[F, V, V, V]^T$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la inversión del vector canónico de la conjunción $[V, F, F, F]^T$.'
  - titulo: 'Equivalencia tautológica'
    enunciado: '¿La fórmula $\neg(p \land q) \leftrightarrow (\neg p \lor \neg q)$ es una tautología?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al ser una ley lógica universal su bicondicional es siempre tautológico.'
errores_frecuentes:
  - 'La afirmación de que la negación de una conjunción $\neg(p \land q)$ es lógicamente equivalente a $\neg p \land \neg q$.'
  - 'La afirmación de que al aplicar la Ley de De Morgan el conector $\land$ permanece inalterado.'
  - 'La afirmación de que la negación exterior solo se aplica a la primera variable $p$ ignorando a $q$.'
  - 'La afirmación de que la tabla de verdad de $\neg(p \land q)$ produce tres valores falsos y un valor verdadero.'
  - 'La afirmación de que la Ley de De Morgan solo es válida para proposiciones que sean contingencias.'
afirmaciones_verdaderas:
  - 'La Ley de De Morgan para la conjunción establece que la negación de una conjunción es equivalente a la disyunción de las proposiciones negadas: $\neg(p \land q) \equiv \neg p \lor \neg q$.'
  - 'La tabla de verdad de $\neg(p \land q)$ y la de $\neg p \lor \neg q$ comparten exactamente el mismo vector columna de salida $[F, V, V, V]^T$.'
al_terminar_debes_poder: |
  QUÉ: Conocer, demostrar y aplicar la Ley de De Morgan para la negación de una conjunción ($\neg(p \land q) \equiv \neg p \lor \neg q$).
  CÓMO: Distribuir la negación sobre los operandos, transformar el operador $\land$ en $\lor$ y validar la equivalencia mediante tablas de verdad.
