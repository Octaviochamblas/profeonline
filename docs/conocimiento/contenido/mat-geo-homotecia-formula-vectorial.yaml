semantic_id: MAT.GEO.HOMOTECIA.FORMULA_VECTORIAL_CENTRO_GENERAL
resumen_inicial: 'Fórmula vectorial de homotecia con centro general: P'' = O + k·(P
  − O): conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: La fórmula de coordenadas de la homotecia con centro general puede
  expresarse de forma más compacta y elegante utilizando notación vectorial.
explicacion_formal: '![Fórmula vectorial de homotecia](/static/img/geometria/congruencia-semejanza/homotecia-formula-vectorial.svg)


  ### Definición formal


  $P''=O+k(P-O)$, donde $P-O$ es el vector que va del centro al punto original, escalado
  por $k$, y luego trasladado de vuelta sumando $O$.


  ### Desarrollo didáctico


  Esta fórmula es equivalente a la fórmula de coordenadas $(a+k(x-a), b+k(y-b))$,
  pero expresada de forma vectorial: el vector $(P-O)$ representa la posición relativa
  del punto respecto al centro, que se escala por $k$ y se reubica sumando nuevamente
  $O$.'
definiciones_clave: '- **Fórmula vectorial de homotecia con centro general: P'' =
  O + k·(P − O)**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a fórmula vectorial de homotecia con centro
  general: p'' = o + k·(p − o).'
ejemplo_guiado:
  enunciado: 'En la aplicación de fórmula vectorial de homotecia con centro general:
    p'' = o + k·(p − o), se establece una razón $k = 1.2$ entre dos figuras homólogas
    de longitud original $L = 30\text{ cm}$. Calcula la longitud transformada $L''$.'
  pasos:
  - 'Aplicar el criterio o teorema de fórmula vectorial de homotecia con centro general:
    p'' = o + k·(p − o).'
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 1.2 \cdot 30$.'
  - 'Concluir que la medida obtenida en fórmula vectorial de homotecia con centro
    general: p'' = o + k·(p − o) es $L'' = 36.0\text{ cm}$.'
