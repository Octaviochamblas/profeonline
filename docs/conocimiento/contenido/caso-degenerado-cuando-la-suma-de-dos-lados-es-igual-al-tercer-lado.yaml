semantic_id: MAT.GEO.TRIANGULOS_METRICA.TRIANGULO_DEGENERADO
resumen_inicial: El caso degenerado ocurre cuando la suma de dos lados es exactamente
  igual al tercer lado (a + b = c), provocando que los tres vértices sean colineales
  y el triángulo colapse en un segmento de recta de área cero.
explicacion_simple: '![Caso Degenerado](/static/img/nodos/caso-degenerado-cuando-la-suma-de-dos-lados-es-igual-al-tercer-lado-intro.svg)


  ¿Qué pasa si tienes dos palitos de $3\text{ cm}$ y $4\text{ cm}$ frente a uno de
  $7\text{ cm}$? Como $3 + 4 = 7$, los dos palitos pequeños alcanzan justo a tocarse,
  pero **quedan completamente estirados y aplastados sobre el palito grande**. No
  se levanta ninguna esquina, no hay espacio adentro (área = 0) y solo queda una línea
  recta. A esto se le llama **triángulo degenerado**.'
explicacion_formal: '### Definición formal del caso degenerado

  Si tres puntos $A, B, C$ en el plano euclidiano satisfacen que la suma de las distancias
  entre dos pares es exactamente igual a la distancia del tercer par, los puntos son
  **colineales** y determinan un triángulo degenerado de área cero:


  $$AB + BC = AC \iff B \in \overline{AC} \implies \operatorname{Área}(\Delta ABC)
  = 0$$


  ### Desglose simbólico y geométrico

  - Colinealidad: Los tres vértices yacen sobre la misma línea recta $\overleftrightarrow{AC}$.

  - Ángulos interiores colapsados: $\beta = 180^\circ$, $\alpha = 0^\circ$, $\gamma
  = 0^\circ$.

  - No forma triángulo euclidiano estándar: No delimita una región bidimensional cerrada.


  ### Síntesis didáctica

  El caso degenerado marca la frontera exacta entre la existencia y la no existencia
  de un triángulo en el plano.'
definiciones_clave: '- **Triángulo degenerado**: Configuración límite donde los 3
  vértices son colineales y el área es estrictamente cero.

  - **Colinealidad**: Propiedad de tres o más puntos de pertenecer a la misma recta
  geométrica.

  - **Área nula**: Condición $A = 0$ al no existir superficie encerrada en el plano
  bidimensional. '
propiedades_relaciones: '- **Caso límite de la desigualdad**: Representa la frontera
  matemática entre los triángulos reales ($a + b > c$) y los segmentos desconectados
  ($a + b < c$).

  - **Ángulos colapsados**: El ángulo opuesto al lado mayor se abre a $180^\circ$
  (ángulo llano) mientras que los otros dos se cierran a $0^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Caso Degenerado](/static/img/nodos/caso-degenerado-cuando-la-suma-de-dos-lados-es-igual-al-tercer-lado-ejemplos.svg)


    Analiza qué figura geométrica se obtiene al intentar construir un triángulo con
    lados de $a = 4\text{ cm}$, $b = 6\text{ cm}$ y $c = 10\text{ cm}$. Calcula su
    área teórica.'
  pasos:
  - 'Paso 1: Sumar los dos lados menores: $a + b = 4 + 6 = 10\text{ cm}$.'
  - 'Paso 2: Comparar con el tercer lado: $a + b = c$ ($10 = 10$).'
  - 'Paso 3: Identificar que se trata del **caso degenerado**.'
  - 'Paso 4: Calcular el semiperímetro: $s = (4 + 6 + 10)/2 = 10\text{ cm}$.'
  - 'Paso 5: Aplicar la fórmula de Herón: $A = \sqrt{10(10-4)(10-6)(10-10)} = \sqrt{10
    \times 6 \times 4 \times 0} = 0\text{ cm}^2$.'
  - 'Paso 6: Concluir que no se forma un triángulo real, sino un segmento recto de
    longitud $10\text{ cm}$ con área igual a $0$.'
