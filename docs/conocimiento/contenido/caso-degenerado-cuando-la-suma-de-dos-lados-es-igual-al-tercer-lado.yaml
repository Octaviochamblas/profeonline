procedimiento:
- 'Paso 1: Sumar las longitudes de los dos lados menores: $a + b$.'
- 'Paso 2: Comparar con la longitud del lado mayor $c$.'
- 'Paso 3: Si $a + b = c$, clasificar como caso degenerado (segmento colineal).'
- 'Paso 4: Declarar que el área es $0$ y que no constituye un triángulo euclidiano
  válido.'
errores_correccion: 'No confundas el caso límite con un triángulo real: para que sea
  un triángulo debe cumplirse la desigualdad estricta a + b > c.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si tres segmentos miden $3\text{ cm}, 5\text{ cm}$ y $8\text{ cm}$, ¿forman
    un triángulo?
  alternativas:
  - No, forman un caso degenerado (segmento colineal de 8 cm)
  - Sí, es un triángulo escaleno
  - Sí, es un triángulo rectángulo
  respuesta: No, forman un caso degenerado (segmento colineal de 8 cm)
  solucion_pasos:
  - $3 + 5 = 8$, por lo que los vértices quedan sobre la misma línea recta.
- titulo: Ejemplo 2
  enunciado: ¿Cuáles son las medidas de los ángulos en un triángulo degenerado donde
    $a + b = c$?
  alternativas:
  - $0^\circ, 0^\circ\text{ y }180^\circ$
  - $60^\circ, 60^\circ\text{ y }60^\circ$
  - $90^\circ, 45^\circ\text{ y }45^\circ$
  respuesta: $0^\circ, 0^\circ\text{ y }180^\circ$
  solucion_pasos:
  - La figura está aplanada: dos ángulos miden $0^\circ$ y el ángulo en el punto intermedio
      es llano ($180^\circ$).
- titulo: ¿Un triángulo con lados 7 cm, 9 cm y 16 cm es degenerado?
  respuesta: Sí
  solucion_pasos:
  - Sí, $7 + 9 = 16$.
- titulo: ¿Un triángulo degenerado encierra una región bidimensional con área positiva?
  respuesta: 'No'
  solucion_pasos:
  - No, su área es estrictamente cero ($A = 0$).
errores_frecuentes:
- Considerar que $a + b = c$ forma un triángulo muy delgado (en realidad es unidimensional,
  una línea).
- Intentar aplicar fórmulas trigonométricas estándar sin notar la división por cero
  o senos nulos.
- Olvidar que la suma angular teórica en el caso degenerado es $0^\circ + 0^\circ
  + 180^\circ = 180^\circ$.
- No identificar la colinealidad de los vértices.
- Confundir caso degenerado con triángulo acutángulo pequeño.
afirmaciones_verdaderas:
- Cuando $a + b = c$, los tres vértices son colineales y el triángulo colapsa en un
  segmento de recta.
- El área de un triángulo degenerado es estrictamente igual a $0$.
al_terminar_debes_poder: '**QUÉ:** Identificar, caracterizar y explicar el caso degenerado
  en geometría métrica.


  **CÓMO:** Reconociendo la igualdad $a + b = c$, la colinealidad de los tres vértices
  y el área nula ($A = 0$).


  ![Resumen de Caso Degenerado](/static/img/nodos/caso-degenerado-cuando-la-suma-de-dos-lados-es-igual-al-tercer-lado-resumen.svg)'
