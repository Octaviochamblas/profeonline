semantic_id: MAT.ALG.FACTOR_CUBOS.RECONOCIMIENTO_DIFERENCIA_CUBOS
resumen_inicial: 'El reconocimiento de diferencia de cubos perfectos consiste en comprobar que un binomio esté formado por la resta de dos términos cuyas raíces cúbicas son números racionales enteros y cuyos exponentes son múltiplos de 3.'
explicacion_simple: |
  Para identificar si un binomio es una **Diferencia de Cubos Perfectos** (ej: $27x^3 - 8$):
  - **3 CONDICIONES INNEGOCIABLES**:
    1. **Dos términos separados por un signo menos**: Debe ser una **resta** ($-$).
    2. **Coeficientes con raíz cúbica exacta**: Números que son cubos enteros ($1, 8, 27, 64, 125, 216, 343, 512, 729, 1000$).
    3. **Exponentes divisibles por 3**: Los exponentes de las variables literales se pueden dividir entre 3 sin dejar resto ($x^3, x^6, x^9, x^{12}$).
  - **Identificación de las bases $A$ y $B$**:
    - En $27x^3 - 8$, la primera base es $A = \sqrt[3]{27x^3} = \mathbf{3x}$.
    - La segunda base es $B = \sqrt[3]{8} = \mathbf{2}$.
explicacion_formal: |
  ### Definición formal
  Sea la estructura binómica $D(x) = C_1 x_1^{3\alpha_1} \dots x_m^{3\alpha_m} - C_2 y_1^{3\beta_1} \dots y_k^{3\beta_k} \in \mathbb{R}[x_1, \dots, x_m, y_1, \dots, y_k]$. Se define como una **diferencia de cubos perfectos** si cumple:

  1. **Operador sustractivo principal**: Los términos están conectados por una resta estricta ($-$).
  2. **Condición de coeficientes cúbicos**: $C_1, C_2 \in \{k^3 \mid k \in \mathbb{Q}^+\}$ admiten raíz cúbica exacta $\sqrt[3]{C_1}, \sqrt[3]{C_2} \in \mathbb{Q}$.
  3. **Divisibilidad de grado literal por 3**: Todos los exponentes son de la forma $3k$ con $k \in \mathbb{N}$, satisfaciendo:

     $$\sqrt[3]{x_i^{3\alpha_i}} = x_i^{\alpha_i} \in \mathbb{N}$$

  ### Síntesis didáctica
  Extraer la raíz cúbica del coeficiente numérico y dividir los exponentes por 3 permite identificar las bases $A$ y $B$ de la estructura $A^3 - B^3$.
definiciones_clave: |
  - **Diferencia de cubos perfectos**: Binomio de la forma $A^3 - B^3$ que representa la resta de dos cubos de monomios.
  - **Base cúbica ($A, B$)**: Monomios obtenidos tras calcular las raíces cúbicas de los términos del binomio.
  - **Múltiplo de 3**: Propiedad $e = 3k$ que garantiza que el exponente literal es separable en potencias cúbicas.
propiedades_relaciones: |
  - **Factorización universal sobre $\mathbb{R}$**: La diferencia de cubos $A^3 - B^3$ es siempre factorizable en los números reales $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Verifica si el binomio $125x^6 - 216y^3$ es una diferencia de cubos perfectos y halla sus bases $A$ y $B$.'
  pasos:
    - 'Paso 1: Verificamos el signo del binomio: Es una diferencia ($-$).'
    - 'Paso 2: Evaluamos la parte numérica:
       - $\sqrt[3]{125} = 5$ ($5^3 = 125$).
       - $\sqrt[3]{216} = 6$ ($6^3 = 216$).'
    - 'Paso 3: Evaluamos los exponentes de las letras:
       - Para $x^6$: Exponente $6$ divisible por $3$ ($6 \div 3 = 2 \implies x^2$).
       - Para $y^3$: Exponente $3$ divisible por $3$ ($3 \div 3 = 1 \implies y^1$).'
    - 'Paso 4: Construimos las bases $A$ y $B$:
       - $A = \sqrt[3]{125x^6} = \mathbf{5x^2}$.
       - $B = \sqrt[3]{216y^3} = \mathbf{6y}$.'
    - 'Conclusión: La expresión **sí es una diferencia de cubos perfectos**, correspondiente a $(5x^2)^3 - (6y)^3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el binomio $64x^9 - 1$, ¿cuáles son las bases $A$ y $B$ de la diferencia de cubos?'
    choices:
      - {text: 'Las bases son $A = 4x^3$ y $B = 1$, calculando $\sqrt[3]{64}=4, 9\div 3=3$ y $\sqrt[3]{1}=1$', is_correct: true}
      - {text: 'Las bases son $A = 8x^3$ y $B = 1$', is_correct: false}
      - {text: 'Las bases son $A = 4x^9$ y $B = 1$', is_correct: false}
      - {text: 'Las bases son $A = 16x^3$ y $B = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''Las bases son $A = 4x^3$ y $B = 1$, calculando $\sqrt[3]{64}=4, 9\div 3=3$ y $\sqrt[3]{1}=1$''. Raíz cúbica de coeficientes y división de exponentes por 3.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la expresión $x^5 - 8$ NO es una diferencia de cubos perfectos en $\mathbb{R}[x]$?'
    choices:
      - {text: 'Porque el exponente 5 de la variable $x^5$ no es un múltiplo entero divisible por 3', is_correct: true}
      - {text: 'Porque 8 no tiene raíz cúbica', is_correct: false}
      - {text: 'Porque hay un signo menos entre los términos', is_correct: false}
      - {text: 'Porque 5 es un número primo', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque el exponente 5 de la variable $x^5$ no es un múltiplo entero divisible por 3''. Divisibilidad de exponentes por 3 ($5 \div 3 \notin \mathbb{N}$).'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar la presencia de 2 términos separados por el signo de resta.'
  - 'Paso 2: Calcular la raíz cúbica de los coeficientes numéricos.'
  - 'Paso 3: Dividir entre 3 los exponentes de las variables de ambos términos.'
  - 'Paso 4: Formar las bases $A$ y $B$ para preparar la estructura $A^3 - B^3$.'
errores_correccion: |
  - **Error 1:** Tratar un término con exponente divisible por 2 pero no por 3 (como $x^4$) como un cubo perfecto. **Cómo corregirlo:** Para ser un cubo perfecto **EL EXPONENTE DE LA VARIABLE DEBE SER UN MÚLTIPLO ENTERO DIVISIBLE POR 3 ($x^3, x^6, x^9$)**.
  - **Error 2:** Incluir el signo menos dentro de la base $B$ al identificarla en $A^3 - B^3$. **Cómo corregirlo:** La base $B$ **SE EXTRAE COMO UNA CANTIDAD POSITIVA; EL SIGNO MENOS PERTENECE AL OPERADOR DE LA ESTRUCTURA $A^3 - B^3$**.
ejemplos:
  - titulo: 'Raíz cúbica de 27'
    enunciado: 'Para $x^3 - 27$, ¿es la base $B = 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\sqrt[3]{27} = 3$.'
  - titulo: 'Exponente 12'
    enunciado: 'Para $y^{12}$, ¿es su base cúbica $y^{12/3} = y^4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $12 \div 3 = 4$.'
  - titulo: 'Base numérica 1'
    enunciado: 'En $8a^3 - 1$, ¿son las bases $A = 2a$ y $B = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\sqrt[3]{8a^3} = 2a$ y $\sqrt[3]{1} = 1$.'
  - titulo: 'Signo menos de operador'
    enunciado: 'En $m^3 - n^3$, ¿es la base $B = n$ en lugar de $-n$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el signo $-$ es la operación.'
errores_frecuentes:
  - 'Considerar exponentes divisibles por 2 como cubos perfectos.'
  - 'Incluir el signo negativo del operador de resta dentro de la propia base B.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Extraer la raíz cuadrada a los coeficientes numéricos en lugar de la raíz cúbica.'
  - 'No verificar que todos los términos numéricos posean raíz cúbica entera exacta.'
afirmaciones_verdaderas:
  - 'Una diferencia de cubos perfectos $A^3 - B^3$ está formada por 2 términos restados con coeficientes y exponentes cúbicos exactos.'
  - 'Las bases $A$ y $B$ se obtienen calculando la raíz cúbica del coeficiente y dividiendo el exponente por 3.'
al_terminar_debes_poder: 'Reconocer expresiones algebraicas que corresponden a una diferencia de cubos perfectos identificando sus bases $A$ y $B$.'
