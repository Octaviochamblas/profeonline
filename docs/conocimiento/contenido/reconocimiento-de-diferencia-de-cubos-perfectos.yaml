resumen_inicial: El reconocimiento de diferencia de cubos perfectos identifica binomios
  de la forma $a^3 - b^3$, donde dos cubos algebraicos se encuentran vinculados por
  una sustracción.
explicacion_simple: Una diferencia de cubos es un binomio con un signo menos en el
  centro donde ambos términos son cubos perfectos. En $x^3 - 27$, el primer término
  es el cubo de $x$ y el segundo es el cubo de $3$, por lo que equivale a $x^3 - 3^3$.
explicacion_formal: 'Sea $P(x, y)$ un binomio en $\mathbb{R}[x, y]$. El **Reconocimiento
  de la Diferencia de Cubos Perfectos** exige verificar la estructura:


  $$P(x, y) = A^3 - B^3 \quad \text{con } A = \sqrt[3]{T_1} \text{ y } B = \sqrt[3]{|T_2|}$$


  **Desglose simbólico:**

  - $T_1 = A^3$: Minuendo cubo perfecto con exponente múltiplo de 3.

  - $- $: Operador de resta central obligatorio entre ambos cubos.

  - $|T_2| = B^3$: Sustraendo cuya raíz cúbica positiva define la base $B$.


  > **Complemento didáctico:** Junto a la diferencia de cuadrados, constituye una
  de las dos formas fundamentales de descomposición de restas de potencias pares e
  impares.'
definiciones_clave: '- **Diferencia de cubos**: Binomio formado por la resta de dos
  expresiones que admiten raíz cúbica exacta.

  - **Minuendo y Sustraendo cúbicos**: Términos $A^3$ y $B^3$ que determinan las bases
  de la resta.'
propiedades_relaciones: '- **Raíz real en $A = B$**: La resta $A^3 - B^3$ se anula
  cuando $A = B$, garantizando el factor lineal $(A - B)$ por el teorema del factor.'
ejemplo_guiado:
  enunciado: Determine si la expresión $125x^3 - 8$ es una diferencia de cubos perfectos
    e identifique sus bases $A$ y $B$.
  pasos:
  - 'Paso 1: Identificar el signo central de resta entre los dos términos: $125x^3$
    y $8$ con $-$.'
  - 'Paso 2: Extraer la raíz cúbica del minuendo $125x^3$: $\sqrt[3]{125x^3} = 5x
    \implies A = 5x$.'
  - 'Paso 3: Extraer la raíz cúbica del sustraendo $8$: $\sqrt[3]{8} = 2 \implies
    B = 2$.'
  - 'Paso 4: Comprobar que $(5x)^3 - (2)^3 = 125x^3 - 8$.'
  - 'Conclusión: La expresión representa una diferencia de cubos perfectos con bases
    $A = 5x$ y $B = 2$.'
