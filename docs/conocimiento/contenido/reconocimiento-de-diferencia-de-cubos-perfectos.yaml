procedimiento:
- 'Paso 1: Observa que la expresión tiene 2 términos restándose.'
- 'Paso 2: Comprueba que el coeficiente numérico del primer y segundo término sean
  cubos perfectos.'
- 'Paso 3: Comprueba que los exponentes de todas las letras involucradas sean divisibles
  por 3.'
- Diferencia es sinónimo de resta en matemáticas.
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en reconocimiento de diferencia de cubos perfectos.
ejemplos:
- titulo: Determina si $x^3 y^6 - 27$ es diferencia de cubos
  enunciado: Determina si $x^3 y^6 - 27$ es diferencia de cubos.
  solucion_pasos:
  - Dos términos, signo resta.
  - 'Raíz del primero: $\sqrt[3]{x^3 y^6} = x y^2$.'
  - 'Raíz del segundo: $\sqrt[3]{27} = 3$.'
  - Ambas raíces existen. Es Diferencia de Cubos.
