  enunciado: ¿El número 1 se considera un cubo perfecto válido para la diferencia
    de cubos, como en $y^3 - 1$?
  solucion_pasos:
  - 'El 1 es mágico: es cuadrado, cubo, cuarta potencia... $1^3 = 1$.'
  - 'Respuesta: Verdadero'
