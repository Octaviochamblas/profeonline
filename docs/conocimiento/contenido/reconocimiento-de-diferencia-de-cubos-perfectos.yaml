procedimiento:
- 'Paso 1: Verificar que el binomio contenga dos términos separados por un signo menos
  ($-$).'
- 'Paso 2: Obtener las raíces cúbicas exactas de ambos coeficientes y dividir por
  3 los exponentes de las variables.'
- 'Paso 3: Definir las bases $A$ y $B$ confirmando que $A^3 - B^3$ reconstruya la
  expresión.'
errores_correccion: '- **Error 1: Incluir el signo negativo dentro de la base $B$
  declarando $B = -2$ en $x^3 - 8$.** **Cómo corregirlo:** La base $B$ se define como
  el valor positivo de la raíz cúbica del sustraendo $\sqrt[3]{8} = 2$; el signo menos
  pertenece al operador del binomio.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $a^3 - 216$ una diferencia de cubos perfectos?
  alternativas:
  - Sí, con $A = a$ y $B = 6$
  - No, porque 216 no es cubo
  - No, porque $a^3$ no tiene coeficiente
  respuesta: Sí, con $A = a$ y $B = 6$
  solucion_pasos:
  - 1. $\sqrt[3]{a^3} = a$.
  - 2. $\sqrt[3]{216} = 6$.
- titulo: Ejemplo 2
  enunciado: Para $27x^3 - 64y^3$, ¿cuáles son las bases $A$ y $B$?
  alternativas:
  - $A = 3x$ y $B = 4y$
  - $A = 9x$ y $B = 16y$
  - $A = 3x$ y $B = -4y$
  respuesta: $A = 3x$ y $B = 4y$
  solucion_pasos:
  - 1. $\sqrt[3]{27x^3} = 3x$.
  - 2. $\sqrt[3]{64y^3} = 4y$.
- titulo: En la diferencia de cubos $x^3 - 1$, ¿la base $B$ es igual a $1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt[3]{1} = 1$.
- titulo: ¿Se requiere que los exponentes de las variables sean divisibles por $2$
    para ser cubos perfectos?
  respuesta: 'No'
  solucion_pasos:
  - No, los exponentes deben ser divisibles por 3 para constituir un cubo perfecto.
errores_frecuentes:
- Incluir el signo negativo dentro de la definición de la base $B$ en lugar de asignarlo
  al operador central de resta.
- Dividir el coeficiente numérico por 3 en lugar de calcular su raíz cúbica exacta.
- Declarar que la diferencia de cubos no es factorizable cuando $B = 1$.
- Aplicar raíces cuadradas a los términos en lugar de raíces cúbicas al identificar
  las bases.
- Exigir que los exponentes de las variables sean impares en lugar de ser divisibles
  por 3.
afirmaciones_verdaderas:
- Una diferencia de cubos $A^3 - B^3$ está constituida por la resta de dos cubos perfectos.
- Las bases $A$ y $B$ se obtienen extrayendo la raíz cúbica a cada uno de los términos
  del binomio.
al_terminar_debes_poder: Al terminar serás capaz de reconocer diferencias de cubos
  perfectos e identificar sus bases $A$ y $B$.
