semantic_id: MAT.ALG.FACTOR_CUBOS.RECONOCIMIENTO_DIFERENCIA_CUBOS
resumen_inicial: 'Reconocimiento de diferencia de cubos perfectos: concepto, método
  de descomposición y reglas en Factorización asociada a cubos.'
explicacion_simple: No discrimines a la resta. Así como vimos la Suma de Cubos, su
  hermana, la Diferencia de Cubos, es igual de predecible y elegante. De hecho, los
  requisitos para encontrarla son exactamente los mismos, solo cambia el signo central.
explicacion_formal: '### Definición formal


  Un binomio de la forma $A^3 - B^3$ es una diferencia de cubos si y solo si tanto
  $A$ como $B$ admiten raíz cúbica exacta (son cubos perfectos), en cuyo caso factoriza
  como $A^3 - B^3 = (A - B)(A^2 + AB + B^2)$.


  ### Desarrollo didáctico


  Para reconocerla, pasamos el control de calidad:

  1. Son dos términos.

  2. Están separados por un signo menos (resta).

  3. Tienen raíz cúbica exacta.


  Ejemplo: $125 - 64y^9$.

  - ¿Dos términos separados por resta? Sí.

  - La raíz cúbica de 125 es 5.

  - La raíz cúbica de $64y^9$ se halla sacando raíz a 64 (que es 4) y dividiendo el
  exponente 9 entre 3 (que da 3). Queda $4y^3$.


  Al tener ambas raíces exactas ($5$ y $4y^3$), confirmamos que estamos ante una Diferencia
  de Cubos lista para ser factorizada.


  Recuerda los cubos clave: $1, 8, 27, 64, 125, 216, 343, 512, 729, 1000$.'
definiciones_clave: '- **Reconocimiento de diferencia de cubos perfectos**: Técnica
