semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.SIGNO_BASE_NEGATIVA_EXPONENTE_IMPAR
resumen_inicial: Una potencia de base negativa con exponente impar da SIEMPRE como resultado
  un número NEGATIVO ($(-a)^{2k+1} < 0$).
explicacion_simple: 'Cuando multiplicas una cantidad impar de signos menos, los signos se
  agrupan en parejas positivas y queda un signo menos libre que vuelve negativo todo el producto:

  - $(-2)^3 = (-2) \cdot (-2) \cdot (-2) = (+4) \cdot (-2) = -8$

  - $(-2)^5 = -32$

  Por lo tanto, **base negativa elevada a exponente impar da siempre resultado negativo**.'
explicacion_formal: Sea $-a < 0$ y $n = 2k+1$ con $k \in \mathbb{N}_0$ (exponente impar).
  Entonces $(-a)^{2k+1} = (-a)^{2k} \cdot (-a) = (+a^{2k}) \cdot (-a) = -a^{2k+1} < 0$. Se
  conserva el signo negativo de la base.
definiciones_clave: '- **Regla del exponente impar**: $(-a)^{\text{impar}} = -a^{\text{impar}}$.'
propiedades_relaciones: '- **Coincidencia con y sin paréntesis**: Para exponente impar, $(-a)^{\text{impar}}
  = -a^{\text{impar}}$ (el resultado numérico y su signo son idénticos).'
ejemplo_guiado:
  enunciado: Calcula $(-3)^3$ y $-3^3$.
  pasos:
  - 'Para $(-3)^3$: base $-3$, exponente $3$ (impar). $(-3)(-3)(-3) = -27$.'
  - 'Para $-3^3$: $-(3 \cdot 3 \cdot 3) = -27$.'
  - 'Observar que para exponentes impares, ambas expresiones dan el mismo resultado: $-27$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el signo de $(-5)^{33}$?
  choices:
  - text: Negativo (-)
    is_correct: true
  - text: Positivo (+)
    is_correct: false
  - text: Cero
    is_correct: false
  - text: Indefinido
    is_correct: false
  explanation: 'La correcta es: Negativo (-). Base negativa con exponente impar (33) conserva
    el signo negativo.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $(-1)^{99}$?
  choices:
  - text: '-1'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '-99'
    is_correct: false
  - text: '99'
    is_correct: false
  explanation: 'La correcta es: -1. Exponente impar (99) aplicado a base -1 resulta -1.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que la base es negativa.'
- 'Paso 2: Comprobar que el exponente sea impar ($1, 3, 5, 7, \dots$).'
- 'Paso 3: Colocar signo negativo al resultado y calcular la potencia del número.'
errores_correccion: No cambies el signo a positivo si el exponente es impar. $(-2)^3 = -8$,
  NO $+8$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $(-4)^3$.
  alternativas:
  - '-64'
  - '64'
  - '-12'
  respuesta: '-64'
  solucion_pasos:
  - $(-4)^3 = -64$ por ser exponente impar.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el signo del resultado de (-3)^7?
  alternativas:
  - Negativo
  - Positivo
  - Depende de 3
  respuesta: Negativo
  solucion_pasos:
  - El exponente 7 es impar, por lo que el signo se conserva negativo.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de (-3)^3?
  alternativas:
  - '-27'
  - '27'
  - '-9'
  respuesta: '-27'
  solucion_pasos:
  - 'Exponente impar: (-3)(-3)(-3) = -27.'
- titulo: ¿Es (-10)^3 un número positivo?
  respuesta: 'No'
  solucion_pasos:
  - El exponente 3 es impar, por lo que el resultado es negativo (-1000).
errores_frecuentes:
- Pensar que por llevar paréntesis el resultado siempre es positivo.
- Pensar que si la base está entre paréntesis, el resultado siempre es positivo sin importar
  el exponente.
- Olvidar comprobar si el exponente es impar antes de asignar el signo del resultado.
- Confundir exponente impar con exponente negativo.
- Creer que un número elevado a un exponente impar grande siempre da un resultado positivo
  por ser 'grande'.
afirmaciones_verdaderas:
- Base negativa con exponente impar resulta en un número negativo.
- Para exponente impar, el resultado de (-a)^n y de -a^n coincide, aunque el proceso de cálculo
  sea distinto.
al_terminar_debes_poder: Determinar con precisión el signo negativo de potencias con exponente
  impar.
fuente: Texto escolar MINEDUC.
estado: publicado
