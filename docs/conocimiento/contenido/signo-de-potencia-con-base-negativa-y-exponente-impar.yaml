semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.SIGNO_BASE_NEGATIVA_EXPONENTE_IMPAR
resumen_inicial: Toda potencia de base negativa elevada a un exponente impar preserva estrictamente el signo negativo en su resultado.
explicacion_simple: '![Signo de potencia con base negativa y exponente impar](/static/img/nodos/signo-de-potencia-con-base-negativa-y-exponente-impar-intro.svg)


  Cuando elevamos un número negativo a un exponente impar ($1, 3, 5, 7, 9...$), los signos negativos se agrupan de a dos volviéndose positivos, ¡pero siempre queda un signo negativo suelto al final! Como ''más por menos es menos'' ($(+) \cdot (-) = (-)$), el resultado final es siempre **negativo**. Por ejemplo: $(-2)^3 = (-2) \cdot (-2) \cdot (-2) = (+4) \cdot (-2) = -8$.'
explicacion_formal: "Sea $a \\in \\mathbb{R}$ con $a > 0$ y sea $n = 2k+1$ un número natural impar con $k \\in \\mathbb{N}_0$. El **Teorema de Paridad Impar** establece que:\n\n$$(-a)^{2k+1} = -a^{2k+1} < 0$$\n\n**Demostración algebraica:**\n$$(-a)^{2k+1} = (-a)^{2k} \\cdot (-a)^1 = (+a^{2k}) \\cdot (-a) = -(a^{2k} \\cdot a) = -a^{2k+1}$$\n\n**Propiedades fundamentales:**\n1. **Conservación de equivalencia sintáctica:**\n   $$(-a)^n = -a^n \\quad (\\text{únicamente cuando } n \\text{ es impar})$$\n2. **Potencias impares de la unidad negativa:**\n   $$(-1)^{2k+1} = -1 \\quad (\\forall k \\in \\mathbb{Z})$$\n3. **Simetría impar:** Las funciones potenciales $f(x) = x^{2k+1}$ son impares ($f(-x) = -f(x)$)."
definiciones_clave: '- **Exponente impar**: Número entero de la forma $2k+1$, no divisible por 2.

  - **Teorema de paridad impar**: Regla que garantiza la conservación del signo negativo al elevar bases negativas a exponentes impares.'
propiedades_relaciones: '- **Extracción de signo**: $(-x)^3 = -x^3$ y $(-x)^5 = -x^5$.

  - **Invarianza ante paréntesis en impares**: Para $n$ impar, $(-a)^n$ y $-a^n$ coinciden exactamente en valor y signo.'
ejemplo_guiado:
  enunciado: '![Ejemplos de base negativa con exponente impar](/static/img/nodos/signo-de-potencia-con-base-negativa-y-exponente-impar-ejemplos.svg)


    Calcule el valor de $(-2)^5$, $\left(-\frac{1}{2}\right)^3$ y $(-1)^{99}$ verificando el signo negativo en cada resultado.'
  pasos:
  - 'Paso 1: Evaluar $(-2)^5$: El exponente $5$ es impar. Desarrollo: $(-2)^5 = -2^5 = -32$.'
  - 'Paso 2: Evaluar $\left(-\frac{1}{2}\right)^3$: El exponente $3$ es impar. Desarrollo: $-\frac{1^3}{2^3} = -\frac{1}{8}$.'
  - 'Paso 3: Evaluar $(-1)^{99}$: El exponente $99$ es impar. Desarrollo: $(-1)^{99} = -1$.'
  - 'Conclusión: Los resultados son $-32$, $-\frac{1}{8}$ y $-1$, todos estrictamente negativos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué $(-a)^{2k+1}$ resulta siempre negativo para $a > 0$?
  choices:
  - text: Porque las parejas de signos negativos dan positivo, pero sobra un factor $(-)$ que vuelve negativo el producto
    is_correct: true
  - text: Porque los exponentes impares siempre restan
    is_correct: false
  - text: Porque la base es mayor que el exponente
    is_correct: false
  - text: Solo ocurre si $a$ es entero
    is_correct: false
  explanation: La alternativa correcta es 'Porque las parejas de signos negativos dan positivo, pero sobra un factor $(-)$ que vuelve negativo el producto'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el valor de $(-1)^{99}$?
  choices:
  - text: $-1$ (exponente impar)
    is_correct: true
  - text: $+1$
    is_correct: false
  - text: $-99$
    is_correct: false
  - text: $0$
    is_correct: false
  explanation: La alternativa correcta es '$-1$ (exponente impar)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que la base sea negativa y el exponente sea impar.'
- 'Paso 2: Factorizar el signo negativo hacia afuera: $(-a)^n = -a^n$.'
- 'Paso 3: Calcular el valor absoluto de la potencia $a^n$ y asignarle signo negativo al resultado final.'
errores_correccion: '- **Error 1: Creer que los paréntesis siempre hacen que el resultado sea positivo.** **Cómo corregirlo:** Los paréntesis solo vuelven positivo el resultado si el exponente es PAR. Si es IMPAR, da NEGATIVO ($(-2)^3 = -8$).

  - **Error 2: Pensar que $(-1)^3 = -3$.** **Cómo corregirlo:** Se multiplican factores: $(-1)(-1)(-1) = -1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $(-3)^3$?
  alternativas:
  - $-27$
  - $+27$
  - $-9$
  respuesta: $-27$
  solucion_pasos:
  - Exponente impar $3 \implies (-3)^3 = -3^3 = -27$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\left(-\frac{1}{4}\right)^3$?
  alternativas:
  - $-\frac{1}{64}$
  - $+\frac{1}{64}$
  - $-\frac{3}{64}$
  respuesta: $-\frac{1}{64}$
  solucion_pasos:
  - $\left(-\frac{1}{4}\right)^3 = -\frac{1^3}{4^3} = -\frac{1}{64}$.
- titulo: ¿Es (-4)⁵ un número negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, el exponente 5 es impar, por lo que $(-4)^5 < 0$.
  alternativas:
  - texto: Sí, porque el exponente 5 es impar
    es_correcta: true
    retroalimentacion: ¡Correcto! $(-a)^{\text{impar}} < 0$.
  - texto: No, es positivo porque está entre paréntesis
    es_correcta: false
    retroalimentacion: Incorrecto, solo los exponentes pares dan positivo.
  - texto: No, es igual a cero
    es_correcta: false
    retroalimentacion: Incorrecto, $(-4)^5 = -1024$.
- titulo: ¿Coinciden los valores de (-2)³ y -2³?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-2)^3 = -8$ y $-2^3 = -8$, ambos valen -8.
  alternativas:
  - texto: Sí, para exponentes impares ambos resultados son -8
    es_correcta: true
    retroalimentacion: ¡Correcto! En exponentes impares $(-a)^n = -a^n$.
  - texto: No, uno es positivo y el otro negativo
    es_correcta: false
    retroalimentacion: Incorrecto, ambos resultan en -8.
  - texto: No, dan valores numéricos distintos
    es_correcta: false
    retroalimentacion: Incorrecto, tienen la misma magnitud y signo.
errores_frecuentes:
- Afirmar que toda potencia con paréntesis da positivo sin revisar la paridad del exponente.
- Multiplicar la base por el exponente ($(-2)^3 = -6$).
- Pensar que $(-1)^{2k+1} = 1$.
- Olvidar el signo negativo al elevar fracciones con exponente impar.
- Confundir la extracción del signo en impares con la cancelación de signos en pares.
afirmaciones_verdaderas:
- Toda potencia de base negativa con exponente impar resulta en un número negativo.
- Para todo exponente impar $n$, se cumple la igualdad $(-a)^n = -a^n$.
- La potencia $(-1)^n = -1$ si y solo si $n$ es un número entero impar.
al_terminar_debes_poder: '![Síntesis de base negativa con exponente impar](/static/img/nodos/signo-de-potencia-con-base-negativa-y-exponente-impar-resumen.svg)


  QUÉ: Determinar y justificar el signo negativo en potencias de base negativa con exponente impar.


  CÓMO: Aplicando el teorema $(-a)^{2k+1} = -a^{2k+1}$, reconociendo que el factor negativo residual determina el signo del producto, y verificando la equivalencia $(-a)^n = -a^n$ exclusiva de exponentes impares.'
