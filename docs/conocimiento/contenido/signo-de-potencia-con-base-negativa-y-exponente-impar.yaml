semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.SIGNO_BASE_NEGATIVA_EXPONENTE_IMPAR
resumen_inicial: 'Toda potencia de base negativa elevada a un exponente entero impar
  resulta siempre en un número estrictamente negativo: $(-a)^{2k+1} < 0$.'
explicacion_simple: Cuando elevamos un número negativo a un exponente impar (como
  3, 5, 7...), los signos se agrupan en parejas dando positivo, pero siempre queda
  un signo negativo sobrante al final. Al multiplicar por ese negativo sobrante, el
  resultado final es negativo.
explicacion_formal: 'Para todo $a > 0$ y exponente impar $n = 2k+1$ con $k \in \mathbb{N}$,
  el **Regla del Signo Impar** establece:


  $$(-a)^{2k+1} = - (a^{2k+1}) < 0$$


  **Demostración por residuo de signo:**

  $$(-a)^{2k+1} = \underbrace{[(-a) \cdot (-a) \dots (-a)]}_{k \text{ parejas } (+)}
  \cdot (-a) = (+a^{2k}) \cdot (-a) = -a^{2k+1}$$


  > **Complemento didáctico:** Ejemplo: $(-2)^3 = (-2) \cdot (-2) \cdot (-2) = 4 \cdot
  (-2) = -8$.'
definiciones_clave: '- **Regla de base negativa y exponente impar**: Propiedad donde
  $(-a)^{2k+1} = -a^{2k+1}$ conserva el signo negativo.'
propiedades_relaciones: '- **Conservación del signo negativo**: $(-a)^{2k+1} < 0$
  para $a > 0$.'
ejemplo_guiado:
  enunciado: Determine el signo y el valor numérico de $(-2)^5$.
  pasos:
  - 'Paso 1: Identificar la base $(-2)$ y el exponente $5$ (que es impar).'
  - 'Paso 2: Desarrollar el producto: $(-2) \cdot (-2) \cdot (-2) \cdot (-2) \cdot
    (-2)$.'
  - 'Paso 3: Multiplicar las parejas: $(+4) \cdot (+4) \cdot (-2) = (+16) \cdot (-2)
    = -32$.'
  - 'Conclusión: Como el exponente es impar, $(-2)^5 = -32$ (negativo).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué signo tiene el resultado de (-a)^{2k+1} al elevar una base negativa
    a un exponente impar?
  choices:
  - text: Siempre negativo (-)
    is_correct: true
  - text: Siempre positivo (+)
    is_correct: false
  - text: Cero siempre
    is_correct: false
  - text: Depende de la base
    is_correct: false
  explanation: La alternativa correcta es 'Siempre negativo (-)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (-2)^5, ¿cuál fue el resultado numérico?
  choices:
  - text: -32 (negativo)
    is_correct: true
  - text: +32 (positivo)
    is_correct: false
  - text: '-10'
    is_correct: false
  - text: '10'
    is_correct: false
  explanation: La alternativa correcta es '-32 (negativo)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la base sea un número negativo.'
- 'Paso 2: Comprobar que el exponente sea un número impar ($1, 3, 5, 7, \dots$).'
- 'Paso 3: Asignar signo NEGATIVO ($-$) al resultado final y calcular $a^n$.'
errores_correccion: '- **Error 1: Pensar que por tener paréntesis el resultado de
  $(-3)^3$ debe ser positivo.** **Cómo corregirlo:** El paréntesis incluye al signo,
  pero al ser exponente IMPAR el resultado se mantiene NEGATIVO ($-27$).


  - **Error 2: Confundir $(-1)^3$ con $(-1)^2$.** **Cómo corregirlo:** Exponente impar
  da $-1$; exponente par da $+1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(-1)^7$.
  alternativas:
  - '-1'
  - '1'
  - '-7'
  respuesta: '-1'
  solucion_pasos:
  - Exponente impar $\implies (-1)^7 = -1$.
- titulo: Ejemplo 2
  enunciado: Calcule $(-3)^3$.
  alternativas:
  - '-27'
  - '27'
  - '-9'
  respuesta: '-27'
  solucion_pasos:
  - $(-3) \cdot (-3) \cdot (-3) = -27$.
- titulo: ¿Es (-5)^3 un número negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-5)^3 = -125 < 0$.
- titulo: ¿Conserva el signo negativo cualquier potencia de exponente impar?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-a)^{2k+1} = -a^{2k+1}$.
errores_frecuentes:
- Toda potencia de base negativa encerrada en paréntesis entrega un resultado positivo
  sin importar el exponente.
- Elevar un número negativo a un exponente impar produce un número positivo por la
  regla de paréntesis.
- La potencia $(-2)^3$ equivale numéricamente al resultado positivo $+8$.
- Multiplicar tres números negativos entre sí elimina los signos menos produciendo
  un entero positivo.
- El exponente impar transforma la base negativa en una fracción decimal racional.
afirmaciones_verdaderas:
- Toda base negativa elevada a un exponente impar resulta en un número estrictamente
  negativo ($(-a)^{2k+1} < 0$).
- La presencia de un número impar de factores negativos deja un signo menos no cancelado
  en el producto final.
al_terminar_debes_poder: Al terminar serás capaz de determinar inmediatamente el signo
  negativo de cualquier potencia $(-a)^{2k+1}$ de base negativa y exponente impar.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
