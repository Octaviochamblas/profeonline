semantic_id: MAT.GEO.PARALELOGRAMOS.DIAGONALES_BISECAN
resumen_inicial: 'Propiedad de las diagonales de un paralelogramo que se dimidian
  entre sí: conceptos, teoremas, propiedades geométricas y cálculo en Polígonos y
  Cuadriláteros.'
explicacion_simple: 'Al trazar las dos diagonales de un paralelogramo, ocurre algo
  notable en el punto donde se cruzan: ese punto divide a ambas diagonales exactamente
  por la mitad.'
explicacion_formal: '![Diagonales que se dimidian en un paralelogramo](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-diagonales-bisecan.svg)


  ### Definición formal


  En un paralelogramo $ABCD$ con diagonales $AC$ y $BD$ que se cortan en el punto
  $M$, se cumple $AM=MC$ y $BM=MD$: $M$ es el punto medio de ambas diagonales.


  ### Desarrollo didáctico


  Si una diagonal mide 10 cm, cada mitad (desde un vértice hasta el punto de intersección)
  mide 5 cm. Esta propiedad es exclusiva de los paralelogramos: en un trapecio, por
  ejemplo, las diagonales no se bisecan entre sí (excepto en casos muy particulares).'
