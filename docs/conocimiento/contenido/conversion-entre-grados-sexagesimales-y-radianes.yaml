semantic_id: MAT.GEO.MEDICION_ANGULAR.CONVERSION_GRADOS_RADIANES
resumen_inicial: La conversión entre grados sexagesimales y radianes se realiza multiplicando
  por el factor π/180° (de grados a radianes) o por 180°/π (de radianes a grados).
explicacion_simple: '![Conversión entre Grados y Radianes](/static/img/nodos/conversion-entre-grados-sexagesimales-y-radianes-intro.svg)


  Para convertir grados a radianes, multiplica el ángulo por $\pi$ y divide por $180^\circ$,
  simplificando la fracción. Para convertir radianes a grados, el truco más fácil
  es reemplazar la letra $\pi$ por el número $180^\circ$ y calcular.'
explicacion_formal: '### Algoritmo formal

  Para transformar una medida angular entre grados sexagesimales ($G$) y radianes
  ($R$), se aplica la regla de proporcionalidad directa derivada del factor unitario:


  $$R = G \times \frac{\pi}{180^\circ} \iff G = R \times \frac{180^\circ}{\pi}$$


  ### Desglose simbólico y geométrico

  - $G$: Medida del ángulo en grados sexagesimales.

  - $R$: Medida del ángulo en radianes.

  - Fracción simplificada: El resultado en radianes se expresa preferentemente en
  términos de múltiplos racionales de $\pi$ (ej. $60^\circ = \frac{\pi}{3} \text{
  rad}$).


  ### Síntesis didáctica

  Permite alternar con fluidez entre mediciones geométricas escolares en grados y
  expresiones analíticas en radianes para cálculo y física.'
definiciones_clave: '- **Factor de conversión a radianes**: $\frac{\pi}{180^\circ}$.

  - **Factor de conversión a grados**: $\frac{180^\circ}{\pi}$. '
propiedades_relaciones: '- **Simplificación de fracciones**: La medida en radianes
  usualmente se expresa como fracción irreducible con $\pi$ en el numerador.

  - **Conversión decimal**: Si se requiere un valor decimal, se evalúa $\pi \approx
  3{,}14159$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Conversión](/static/img/nodos/conversion-entre-grados-sexagesimales-y-radianes-ejemplos.svg)


    Convierte $150^\circ$ a radianes (en términos de $\pi$) y luego convierte $\frac{5\pi}{6}\text{
    rad}$ a grados sexagesimales.'
  pasos:
  - 'Paso 1: Para $150^\circ$, multiplicar por el factor $\frac{\pi}{180^\circ}$:
    $R = 150 \cdot \frac{\pi}{180}$.'
  - 'Paso 2: Simplificar la fracción dividiendo numerador y denominador por 30: $\frac{150}{180}
    = \frac{5}{6}$.'
  - 'Paso 3: Obtener el resultado en radianes: $R = \frac{5\pi}{6}\text{ rad}$.'
  - 'Paso 4: Para $\frac{5\pi}{6}\text{ rad}$, sustituir $\pi$ por $180^\circ$: $S
    = \frac{5 \times 180^\circ}{6}$.'
  - 'Paso 5: Calcular: $5 \times 30^\circ = 150^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por cuál factor se multiplica un ángulo en grados sexagesimales para
    convertirlo a radianes?
  choices:
  - text: Por el factor π / 180°
    is_correct: true
  - text: Por el factor 180° / π
    is_correct: false
  - text: Por el factor 360° / π
    is_correct: false
  - text: Por el factor π / 360°
    is_correct: false
  explanation: Para pasar de grados a radianes se multiplica por el factor π / 180°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos grados sexagesimales equivale un ángulo de 2π/3 radianes?
  choices:
  - text: 120° (porque 2 × 180° / 3 = 120°)
    is_correct: true
  - text: 60°
    is_correct: false
  - text: 240°
    is_correct: false
  - text: 90°
    is_correct: false
  explanation: Sustituyendo π = 180°, se obtiene 2 × 180° / 3 = 120° (porque 2 × 180°
    / 3 = 120°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la dirección de conversión (grados $\to$ radianes o radianes
  $\to$ grados).'
- 'Paso 2: Aplicar el factor correspondiente: $\times \frac{\pi}{180^\circ}$ o $\times
  \frac{180^\circ}{\pi}$.'
- 'Paso 3: Simplificar la fracción a su forma irreducible.'
errores_correccion: 'Ten cuidado de no invertir la fracción: para pasar a radianes
  π va arriba; para pasar a grados 180° va arriba.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A cuántos radianes equivale un ángulo de $210^\circ$?
  alternativas:
  - $\frac{7\pi}{6}\text{ rad}$
  - $\frac{5\pi}{6}\text{ rad}$
  - $\frac{7\pi}{3}\text{ rad}$
  respuesta: $\frac{7\pi}{6}\text{ rad}$
  solucion_pasos:
  - $\frac{210}{180}\pi = \frac{7}{6}\pi = \frac{7\pi}{6}\text{ rad}$.
- titulo: Ejemplo 2
  enunciado: ¿A cuántos grados sexagesimales equivale $\frac{\pi}{4}\text{ rad}$?
  alternativas:
  - $45^\circ$
  - $90^\circ$
  - $30^\circ$
  respuesta: $45^\circ$
  solucion_pasos:
  - $\frac{180^\circ}{4} = 45^\circ$.
- titulo: ¿Para convertir radianes a grados se puede reemplazar π por 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el método directo más eficiente cuando la expresión contiene $\pi$.
- titulo: ¿Para convertir grados a radianes se multiplica por 180/π?
  respuesta: 'No'
  solucion_pasos:
  - No, se multiplica por $\frac{\pi}{180^\circ}$ ($\pi$ va en el numerador).
errores_frecuentes:
- Invertir el factor de conversión.
- No simplificar la fracción resultante.
- Olvidar incluir la unidad de medida ($\text{rad}$ o $^\circ$).
- Confundir el factor $\frac{\pi}{180}$ con $\frac{\pi}{360}$.
- Reemplazar $\pi$ por decimales cuando se pide respuesta exacta.
afirmaciones_verdaderas:
- 'Para pasar de grados a radianes: $R = S \cdot \frac{\pi}{180^\circ}$.'
- 'Para pasar de radianes a grados: $S = R \cdot \frac{180^\circ}{\pi}$.'
al_terminar_debes_poder: '**QUÉ:** Convertir fluidamente medidas angulares entre grados
  sexagesimales y radianes.


  **CÓMO:** Multiplicando por los factores $\frac{\pi}{180^\circ}$ o $\frac{180^\circ}{\pi}$
  y simplificando fracciones.


  ![Resumen de Conversión Grados-Radianes](/static/img/nodos/conversion-entre-grados-sexagesimales-y-radianes-resumen.svg)'
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
