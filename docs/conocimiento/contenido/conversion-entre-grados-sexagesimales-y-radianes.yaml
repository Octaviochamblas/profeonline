semantic_id: MAT.GEO.MEDICION_ANGULAR.CONVERSION_GRADOS_RADIANES
resumen_inicial: El radián conecta la medida del ángulo con la longitud del arco de
  la circunferencia, constituyendo la unidad natural en cálculo y física.
explicacion_simple: Imagina tomar el radio de una rueda y doblarlo a lo largo del
  borde de la rueda. El ángulo formado por ese pedazo de borde igual al radio es un
  radián. Una vuelta entera equivale a $2\pi$ radianes.
explicacion_formal: 'Un **radián** es el ángulo central que subtiende un arco de circunferencia
  cuya longitud es igual al radio de dicha circunferencia. La equivalencia fundamental
  con el sistema sexagesimal es:


  $$\pi\text{ rad} = 180^\circ \implies 1\text{ rad} = \frac{180^\circ}{\pi} \approx
  57{,}3^\circ$$'
definiciones_clave: '- **Conversión entre grados sexagesimales y radianes**: Elemento
  o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en conversión entre grados sexagesimales y radianes se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Convierte un ángulo de $150^\circ$ a radianes expresando el resultado
    como una fracción simplificada en términos de $\pi$.
  pasos:
  - 'Paso 1: Multiplicar por el factor de conversión $\frac{\pi}{180^\circ}$: $\text{rad}
    = 150 \cdot \frac{\pi}{180}$.'
  - 'Paso 2: Simplificar la fracción dividiendo numerador y denominador por 30: $\frac{150}{180}
    = \frac{5}{6}$.'
  - 'Paso 3: Concluir que $150^\circ = \frac{5\pi}{6}\text{ rad}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de conversión entre grados sexagesimales
    y radianes?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos radianes equivale 150°?
  choices:
  - text: 5π/6 rad
    is_correct: true
  - text: 2π/3 rad
    is_correct: false
  - text: 3π/4 rad
    is_correct: false
  - text: 7π/6 rad
    is_correct: false
  explanation: La alternativa correcta es '5π/6 rad', pues $150 / 180 = 5 / 6$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en conversión entre grados sexagesimales y
  radianes.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en conversión entre
  grados sexagesimales y radianes sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 55^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 125°
  - 55°
  - 90°
  respuesta: 125°
  solucion_pasos:
  - Despejando $x = 180 - 55 = 125^\circ$.
- titulo: Ejemplo 2
  enunciado: En conversión entre grados sexagesimales y radianes, si dos ángulos son
    suplementarios y uno mide 55°, ¿cuánto mide el otro?
  alternativas:
  - 125°
  - 35°
  - 360°
  respuesta: 125°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 55 = 125^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en conversión entre
    grados sexagesimales y radianes?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en conversión entre grados sexagesimales
    y radianes es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de conversión entre grados sexagesimales y radianes.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
