semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNCENTRO_EQUIDISTANCIA_VERTICES
resumen_inicial: 'El circuncentro ($O$) es el único punto del plano que se encuentra
  a la misma distancia de los tres vértices del triángulo: $OA = OB = OC = R$. A esta
  distancia común se le denomina circunradio.'
explicacion_simple: '![Equidistancia a Vértices](/static/img/nodos/propiedad-del-circuncentro-como-punto-equidistante-de-los-vertices-del-triangulo-intro.svg)


  Si te paras en el circuncentro $O$ y mides la distancia hacia las tres esquinas
  (vértices $A, B, C$) del triángulo:


  - **Las tres distancias son idénticas**: La distancia $OA$, la distancia $OB$ y
  la distancia $OC$ miden exactamente lo mismo.

  - **Se llama circunradio ($R$)**: A esta medida común se le llama **circunradio**.

  - **Forma 3 triángulos isósceles**: Al unir $O$ con los vértices, se forman tres
  triángulos isósceles con dos lados de largo $R$.

  '
explicacion_formal: '### Teorema de equidistancia del circuncentro

  El circuncentro $O$ es el único punto en el plano del triángulo que **equidista**
  de los tres vértices $A, B$ y $C$:


  $$d(O, A) = d(O, B) = d(O, C) = R$$


  ### Desglose simbólico y geométrico

  - $R$: Circunradio o radio común de la circunferencia circunscrita ($R > 0$).

  - Triángulos isósceles radiales: Los segmentos radiales determinan tres triángulos
  isósceles $\Delta OAB, \Delta OBC, \Delta OCA$ con bases en los lados del triángulo.


  ### Síntesis didáctica

  La equidistancia del circuncentro a los tres vértices garantiza que una sola circunferencia
  de radio $R$ pasa simultáneamente por las tres esquinas del triángulo.'
definiciones_clave: '- **Circunradio ($R$)**: Longitud constante desde el circuncentro
  hasta cualquiera de los tres vértices.

  - **Equidistancia a vértices**: Propiedad geométrica según la cual $OA = OB = OC
  = R$.

  - **Triángulo isósceles radial**: Triángulo formado por el circuncentro y dos vértices
  adyacentes, con lados iguales a $R$.

  '
propiedades_relaciones: '- **Igualdad métrica**: $OA = OB = OC = R$.

  - **Triángulos isósceles**: $\Delta OAB$ ($OA = OB$), $\Delta OBC$ ($OB = OC$),
  $\Delta OCA$ ($OC = OA$).

  - **Diferenciación con incentro**: $d(O, \text{vértices}) = R$ (circuncentro) vs
  $d(I, \text{lados}) = r$ (incentro).

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Equidistancia a Vértices](/static/img/nodos/propiedad-del-circuncentro-como-punto-equidistante-de-los-vertices-del-triangulo-ejemplos.svg)


    En un triángulo $ABC$, el circuncentro se ubica en $O$. La distancia desde $O$
    hasta el vértice $B$ es $7.5\text{ cm}$. ¿Cuánto mide la distancia desde $O$ hasta
    el vértice $A$ y hasta el vértice $C$?

    '
  pasos:
  - 'Paso 1: Identificar el punto notable: $O$ es el circuncentro del triángulo.'
  - 'Paso 2: Aplicar la propiedad de equidistancia a los vértices: $OA = OB = OC =
    R$.'
  - 'Paso 3: Igualar las longitudes: $OA = 7.5\text{ cm}$ y $OC = 7.5\text{ cm}$.'
  - 'Paso 4: Concluir que la distancia a los vértices $A$ y $C$ es exactamente $7.5\text{
    cm}$.'
