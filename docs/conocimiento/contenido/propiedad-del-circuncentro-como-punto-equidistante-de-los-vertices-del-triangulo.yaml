procedimiento:
- 'Paso 1: Identificar el circuncentro $O$ del triángulo.'
- 'Paso 2: Conectar $O$ con los tres vértices mediante segmentos rectilíneos $OA,
  OB, OC$.'
- 'Paso 3: Aplicar la igualdad $OA = OB = OC = R$.'
- 'Paso 4: Usar las propiedades de los triángulos isósceles radiales para resolver
  ángulos o distancias.'
errores_correccion: No confundas la equidistancia a los vértices (circuncentro) con
  la equidistancia a los lados (incentro).
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo $ABC$ con circuncentro $O$, el segmento $OA = 8\text{
    cm}$. ¿Cuál es la suma de las distancias $OA + OB + OC$?
  alternativas:
  - $24\text{ cm}$
  - $16\text{ cm}$
  - $8\text{ cm}$
  respuesta: $24\text{ cm}$
  solucion_pasos:
  - Como $OA = OB = OC = 8\text{ cm}$, la suma es $8 + 8 + 8 = 24\text{ cm}$.
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de triángulo es $\Delta OBC$ si $O$ es el circuncentro del
    triángulo $ABC$?
  alternativas:
  - Triángulo isósceles con $OB = OC$
  - Triángulo equilátero siempre
  - Triángulo escaleno siempre
  respuesta: Triángulo isósceles con $OB = OC$
  solucion_pasos:
  - Como $OB = OC = R$, el triángulo $\Delta OBC$ tiene dos lados iguales, por lo
    que es isósceles.
- titulo: ¿El circuncentro de un triángulo está siempre a la misma distancia de los
    tres vértices?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la propiedad geométrica definitoria del circuncentro.
- titulo: ¿El circuncentro está siempre a la misma distancia de los tres lados del
    triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, el punto que equidista de los lados es el incentro ($I$), no el circuncentro.
errores_frecuentes:
- Confundir equidistancia a vértices con equidistancia a lados.
- Medir la distancia en perpendicular a los lados creyendo que es el circunradio.
- Olvidar que se forman triángulos isósceles al unir $O$ con los vértices.
- Creer que el circunradio cambia de valor según el vértice elegido.
- Confundir el circunradio $R$ con el inradio $r$.
afirmaciones_verdaderas:
- El circuncentro equidista exactamente de los tres vértices del triángulo.
- La distancia desde el circuncentro a cualquier vértice es igual al circunradio ($R$).
al_terminar_debes_poder: '**QUÉ:** Aplicar y fundamentar la propiedad de equidistancia
  del circuncentro a los vértices del triángulo.


  **CÓMO:** Igualando las distancias radiales $OA = OB = OC = R$ y utilizando la congruencia
  de los triángulos isósceles radiales.


