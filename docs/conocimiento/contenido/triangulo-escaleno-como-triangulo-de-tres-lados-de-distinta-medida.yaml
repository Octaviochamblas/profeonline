semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.ESCALENO
resumen_inicial: Un triángulo escaleno es aquel polígono de tres lados cuyas tres
  longitudes son estrictamente distintas entre sí, lo que determina que sus tres ángulos
  interiores también tengan medidas diferentes.
explicacion_simple: '![Triángulo Escaleno](/static/img/nodos/triangulo-escaleno-como-triangulo-de-tres-lados-de-distinta-medida-intro.svg)


  Un **triángulo escaleno** es un triángulo donde todos sus lados son diferentes:
  no hay dos lados que midan lo mismo. Como sus tres lados tienen medidas distintas
  (por ejemplo $4\text{ cm}$, $6\text{ cm}$ y $7\text{ cm}$), sus tres ángulos de
  adentro también son todos distintos.'
explicacion_formal: '### Definición formal

  Un triángulo $\Delta ABC$ es **escaleno** si sus tres lados tienen longitudes mutuamente
  desiguales (no existe ningún par de lados congruentes):


  $$\Delta ABC \text{ es escaleno} \iff a \neq b \land b \neq c \land a \neq c$$


  $$\|\{a, b, c\}\| = 3 \iff \text{Tres medidas métricas distintas}$$


  ### Desglose simbólico y geométrico

  - Desigualdad métrica estricta: $|a - b| > 0, \; |b - c| > 0, \; |a - c| > 0$.

  - Ausencia de simetría axial: Posee grupo de simetría trivial $C_1$.

  - Tres ángulos distintos: Por correspondencia lado-ángulo, $\alpha \neq \beta \land
  \beta \neq \gamma \land \alpha \neq \gamma$.


  ### Síntesis didáctica

  El triángulo escaleno representa el caso general sin simetrías en geometría, donde
  todas las líneas notables y centros son entidades diferenciadas.'
definiciones_clave: '- **Triángulo escaleno**: Triángulo con 3 lados de longitudes
  distintas.

  - **Asimetría angular**: Condición de tener tres ángulos interiores diferentes.

  - **Terna escalena**: Conjunto de 3 números positivos distintos $\{a, b, c\}$ que
  cumplen la desigualdad triangular. '
propiedades_relaciones: '- **Compatibilidad con ángulos**: Un triángulo escaleno puede
  ser acutángulo (ej: $40^\circ, 60^\circ, 80^\circ$), rectángulo (ej: $30^\circ,
  60^\circ, 90^\circ$, lados $3, 4, 5$) u obtusángulo (ej: $20^\circ, 40^\circ, 120^\circ$).

  - **Cero ejes de simetría**: Es la figura triangular con menor simetría (grupo de
  simetría trivial $C_1$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Triángulo Escaleno](/static/img/nodos/triangulo-escaleno-como-triangulo-de-tres-lados-de-distinta-medida-ejemplos.svg)


    Un triángulo tiene lados que miden $a = 5\text{ cm}$, $b = 7\text{ cm}$ y $c =
    9\text{ cm}$. Clasifícalo según sus lados y calcula su perímetro.'
  pasos:
  - 'Paso 1: Comparar las longitudes de los 3 lados: $5 \neq 7$, $7 \neq 9$, $5 \neq
    9$.'
  - 'Paso 2: Comprobar la desigualdad triangular: $5 + 7 = 12 > 9$ (válido).'
  - 'Paso 3: Como los tres lados son distintos, clasificar el triángulo como **escaleno**.'
  - 'Paso 4: Calcular el perímetro sumando los 3 lados: $P = 5 + 7 + 9 = 21\text{
    cm}$.'
  - 'Paso 5: Concluir que es un triángulo escaleno de perímetro $21\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición define formalmente a un triángulo escaleno?
  choices:
  - text: Tener sus tres lados de longitudes distintas entre sí
    is_correct: true
  - text: Tener exactamente dos lados iguales
    is_correct: false
  - text: Tener sus tres lados de igual longitud
    is_correct: false
  - text: Tener obligatoriamente un ángulo de 90°
    is_correct: false
  explanation: Por definición geométrica, un triángulo escaleno se caracteriza por
    tener sus tres lados de longitudes distintas entre sí.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo tiene ángulos interiores de 40°, 60° y 80°, ¿de qué tipo
    es según sus lados?
  choices:
  - text: Triángulo escaleno (porque sus 3 ángulos son distintos)
    is_correct: true
  - text: Triángulo equilátero
    is_correct: false
  - text: Triángulo isósceles
    is_correct: false
  - text: Triángulo rectángulo
    is_correct: false
  explanation: Al tener 3 ángulos diferentes, sus 3 lados opuestos son diferentes,
    luego es un triángulo escaleno (porque sus 3 ángulos son distintos).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Medir o registrar las longitudes de los tres lados $a, b, c$.'
- 'Paso 2: Comparar los tres valores por pares.'
- 'Paso 3: Si $a \neq b$, $b \neq c$ y $a \neq c$, clasificar como triángulo escaleno.'
errores_correccion: 'No creas que un triángulo escaleno no puede tener un ángulo recto:
  el triángulo de 3, 4 y 5 cm es escaleno y rectángulo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes ternas de lados corresponde a un triángulo escaleno?
  alternativas:
  - $6\text{ cm}, 8\text{ cm}, 10\text{ cm}$
  - $5\text{ cm}, 5\text{ cm}, 8\text{ cm}$
  - $7\text{ cm}, 7\text{ cm}, 7\text{ cm}$
  respuesta: $6\text{ cm}, 8\text{ cm}, 10\text{ cm}$
  solucion_pasos:
  - $6 \neq 8 \neq 10$ son 3 medidas distintas que además cumplen la desigualdad triangular
    ($6+8>10$).
- titulo: Ejemplo 2
  enunciado: Si un triángulo tiene un perímetro de $18\text{ cm}$ y dos de sus lados
    miden $4\text{ cm}$ y $6\text{ cm}$, ¿es escaleno?
  alternativas:
  - Sí, porque el tercer lado mide 8 cm (4 != 6 != 8)
  - No, es isósceles
  - No, es equilátero
  respuesta: Sí, porque el tercer lado mide 8 cm (4 != 6 != 8)
  solucion_pasos:
  - El tercer lado es $18 - (4 + 6) = 8\text{ cm}$. Como $4 \neq 6 \neq 8$, es escaleno.
- titulo: ¿Un triángulo con lados de 5 cm, 6 cm y 7 cm es escaleno?
  respuesta: Sí
  solucion_pasos:
  - Sí, los tres lados tienen medidas diferentes.
- titulo: ¿Un triángulo con dos lados iguales puede ser escaleno?
  respuesta: 'No'
  solucion_pasos:
  - No, si tiene dos lados iguales es isósceles por definición.
errores_frecuentes:
- Pensar que un triángulo escaleno no puede ser rectángulo.
- Confundir escaleno con isósceles.
- Creer que escaleno significa con ángulos menores a 60°.
- Proponer lados que no cumplan la desigualdad triangular ($1, 2, 5$).
- Olvidar que a lados distintos corresponden ángulos opuestos distintos.
afirmaciones_verdaderas:
- Un triángulo escaleno tiene sus 3 lados de diferente longitud.
- Los tres ángulos interiores de un triángulo escaleno son todos distintos.
al_terminar_debes_poder: '**QUÉ:** Identificar, definir y clasificar triángulos escalenos
  según sus lados y ángulos.


  **CÓMO:** Verificando la desigualdad estricta de sus tres lados ($a \neq b \neq
  c$) y de sus tres ángulos interiores.


  ![Resumen de Triángulo Escaleno](/static/img/nodos/triangulo-escaleno-como-triangulo-de-tres-lados-de-distinta-medida-resumen.svg)'
