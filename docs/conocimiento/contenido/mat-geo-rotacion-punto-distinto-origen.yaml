semantic_id: MAT.GEO.ROTACION_PLANO.ROTACION_PUNTO_DISTINTO_ORIGEN
resumen_inicial: 'Procedimiento de rotación en torno a un punto distinto del origen:
  conceptos, teoremas, propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'Rotar alrededor de un punto que no es el origen requiere un truco:
  primero ''trasladar'' mentalmente ese punto al origen, rotar allí, y luego devolver
  todo a su lugar original.'
explicacion_formal: '![Rotación en torno a un punto distinto del origen](/static/img/geometria/isometrias/rotacion-punto-distinto-origen.svg)


  ### Definición formal


  Para rotar $P(x,y)$ un ángulo $\theta$ alrededor de $O(a,b)$: (1) se calcula el
  punto relativo $(x-a,\,y-b)$; (2) se aplica la regla de rotación de $\theta$ a ese
  punto relativo, obteniendo $(x_r,y_r)$; (3) se traslada de vuelta sumando $O$: $P''=(x_r+a,\,y_r+b)$.


  ### Desarrollo didáctico


  En la figura, para rotar $P(4,1)$ 90° antihorario alrededor de $O(2,1)$: el punto
  relativo es $(4-2,\,1-1)=(2,0)$; al rotar 90° se obtiene $(0,2)$; al trasladar de
  vuelta sumando $O$, resulta $P''=(0+2,\,2+1)=(2,3)$.'
definiciones_clave: '- **Procedimiento de rotación en torno a un punto distinto del
