procedimiento:
- 'Paso 1: Resta las coordenadas del centro O al punto P, obteniendo el punto relativo
  (x-a, y-b).'
- 'Paso 2: Aplica la regla de rotación correspondiente al ángulo θ sobre ese punto
  relativo.'
- 'Paso 3: Suma las coordenadas de O al resultado para obtener la posición final P''
  en el sistema original.'
