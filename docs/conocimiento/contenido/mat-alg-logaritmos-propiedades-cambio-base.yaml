semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.CAMBIO_BASE
resumen_inicial: 'La fórmula de cambio de base $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$ permite reescribir cualquier logaritmo en una nueva base conveniente $c > 0, c \neq 1$.'
explicacion_simple: |
  Las calculadoras convencionales solo tienen botones para logaritmo decimal $\log_{10}$ y logaritmo natural $\ln$. Si necesitamos calcular un logaritmo en una base extraña como $\log_3(50)$, la fórmula de cambio de base nos salva: dividimos el logaritmo del número de arriba entre el logaritmo del número de abajo en la nueva base elegida: $\frac{\log_{10}(50)}{\log_{10}(3)}$ o $\frac{\ln(50)}{\ln(3)}$. Esta fórmula también es fundamental para simplificar multiplicaciones de logaritmos.
explicacion_formal: |
  ### Definición formal
  Para cualesquiera bases válidas $b, c \in \mathbb{R}^+ \setminus \{1\}$ y cualquier argumento estrictamente positivo $a \in \mathbb{R}^+$, la **fórmula de cambio de base** establece la identidad fundamental:
  $$\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$$

  ### Demostración formal
  Sea $x = \log_b(a) \implies b^x = a$.
  Aplicando el logaritmo en base $c$ a ambos miembros de la igualdad:
  $$\log_c(b^x) = \log_c(a)$$
  Aplicando la propiedad de la potencia al miembro izquierdo:
  $$x \cdot \log_c(b) = \log_c(a)$$
  Como $b \neq 1 \implies \log_c(b) \neq 0$, podemos despejar $x$:
  $$x = \frac{\log_c(a)}{\log_c(b)} \implies \log_b(a) = \frac{\log_c(a)}{\log_c(b)} \quad \blacksquare$$

  ### Síntesis didáctica
  Corolarios útiles del cambio de base:
  - **Recíproco por inversión de argumento y base**: $\log_b(a) = \frac{1}{\log_a(b)}$.
  - **Regla de la cadena logarítmica (cancelación cruzada)**: $\log_b(a) \cdot \log_c(b) = \log_c(a)$.
definiciones_clave: |
  - **Fórmula de cambio de base**: Identidad $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$ para transitar a una nueva base $c$.
  - **Base conveniente $c$**: Base seleccionada (usualmente 10 o $e$) para operar o evaluar con instrumentos tecnológicos.
  - **Inversión recíproca $\log_b(a) = \frac{1}{\log_a(b)}$**: Caso especial al intercambiar argumento y base.
propiedades_relaciones: |
  - **Cambio a base decimal o natural**: $\log_b(a) = \frac{\log(a)}{\log(b)} = \frac{\ln(a)}{\ln(b)}$.
  - **Simplificación de productos en cadena**: En una multiplicación de logaritmos con argumentos y bases cruzadas $\log_a(b) \cdot \log_b(c) \cdot \log_c(d) = \log_a(d)$, las bases intermedias se cancelan algebraicamente por cambio de base.
ejemplo_guiado:
  enunciado: 'Aplica la fórmula de cambio de base en los siguientes casos: A) Expresa $\log_2(7)$ en base 10 y en base $e$, B) Simplifica el producto $P = \log_3(5) \cdot \log_5(9)$, C) Calcula el valor exacto de $K = \log_8(32)$.'
  pasos:
    - 'Paso 1: Para $\log_2(7)$, cambiando a base 10: $\frac{\log(7)}{\log(2)}$. Cambiando a base $e$: $\frac{\ln(7)}{\ln(2)}$.'
    - 'Paso 2: Para $P = \log_3(5) \cdot \log_5(9)$, pasamos ambos a base 10: $\frac{\log(5)}{\log(3)} \cdot \frac{\log(9)}{\log(5)}$. Cancelamos $\log(5)$: $\frac{\log(9)}{\log(3)} = \log_3(9) = 2$.'
    - 'Paso 3: Para $K = \log_8(32)$, pasamos a base 2: $\frac{\log_2(32)}{\log_2(8)} = \frac{5}{3}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se expresa el logaritmo $\log_5(12)$ en términos de logaritmos decimales $\log$ aplicando el cambio de base?'
    choices:
      - {text: '$\frac{\log(12)}{\log(5)}$', is_correct: true}
      - {text: '$\frac{\log(5)}{\log(12)}$', is_correct: false}
      - {text: '$\log(12) - \log(5)$', is_correct: false}
      - {text: '$\log(12) \cdot \log(5)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{\log(12)}{\log(5)}$''. El logaritmo del argumento 12 queda en el numerador y el logaritmo de la base 5 en el denominador.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor numérico exacto del producto de logaritmos $M = \log_4(7) \cdot \log_7(64)$?'
    choices:
      - {text: '$3$, cancelando la base intermedia 7 resultando $\log_4(64) = 3$', is_correct: true}
      - {text: '$28$, multiplicando $4 \cdot 7$', is_correct: false}
      - {text: '$256$, elevando $4^4$', is_correct: false}
      - {text: '$1$, porque son bases distintas', is_correct: false}
    explanation: 'La alternativa correcta es ''$3$, cancelando la base intermedia 7 resultando $\log_4(64) = 3$''. Por cambio de base a base 10: $\frac{\log(7)}{\log(4)} \cdot \frac{\log(64)}{\log(7)} = \frac{\log(64)}{\log(4)} = \log_4(64) = 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el logaritmo original $\log_b(a)$ y elegir la nueva base $c$ deseada (usualmente 10 o $e$).'
  - 'Paso 2: Escribir una cociente donde el numerador sea $\log_c(a)$ (logaritmo del argumento) y el denominador sea $\log_c(b)$ (logaritmo de la base original).'
  - 'Paso 3: Si se trata de un producto de logaritmos, convertir todos los factores a una base común $c$ y simplificar los términos idénticos en numeradores y denominadores.'
  - 'Paso 4: Evaluar el cociente resultante.'
errores_correccion: |
  - **Error 1:** Colocar la base en el numerador y el argumento en el denominador (ej: escribir $\log_b(a) = \frac{\log(b)}{\log(a)}$). **Cómo corregirlo:** Recordar la regla de posición: el argumento $a$ está por arriba, así que va al numerador $\log_c(a)$; la base $b$ está como subíndice por abajo, así que va al denominador $\log_c(b)$.
  - **Error 2:** Confundir el cambio de base con la propiedad del cociente (ej: escribir $\frac{\log(a)}{\log(b)} = \log(a) - \log(b)$). **Cómo corregirlo:** La resta de logaritmos $\log(a) - \log(b)$ proviene del logaritmo de un cociente $\log\left(\frac{a}{b}\right)$. El cociente de dos logaritmos $\frac{\log(a)}{\log(b)}$ es el cambio de base de $\log_b(a)$.
ejemplos:
  - titulo: 'Cambio de base a logaritmo natural'
    enunciado: '¿El logaritmo $\log_3(10)$ se puede escribir como $\frac{\ln(10)}{\ln(3)}$?'
    alternativas:
      - 'Sí'
      - 'No, debe ser en base 10'
      - 'No, equivale a $\ln(10) - \ln(3)$'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Aplicamos cambio de base a base $e$: $\log_3(10) = \frac{\log_e(10)}{\log_e(3)} = \frac{\ln(10)}{\ln(3)}$.'
  - titulo: 'Inversión por recíproco'
    enunciado: '¿Es verdad que $\log_2(5) = \frac{1}{\log_5(2)}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por la propiedad del recíproco, intercambiar argumento y base invierte la fracción.'
  - titulo: 'Cálculo de logaritmo con bases potencia'
    enunciado: '¿El valor de $\log_{27}(81)$ es igual a $\frac{4}{3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cambiamos a base 3: $\frac{\log_3(81)}{\log_3(27)} = \frac{4}{3}$.'
  - titulo: 'Cancelación en cadena'
    enunciado: '¿El producto $\log_2(3) \cdot \log_3(4) \cdot \log_4(8)$ es igual a 3?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por la regla de la cadena, se cancelan las bases intermedias 3 y 4, quedando $\log_2(8) = 3$.'
errores_frecuentes:
  - 'La afirmación de que la fórmula de cambio de base invierte el cociente como $\frac{\log(b)}{\log(a)}$.'
  - 'La afirmación de que la división $\frac{\log(x)}{\log(y)}$ equivale a la sustracción de logaritmos $\log(x) - \log(y)$.'
  - 'La afirmación de que para modificar la base basta con efectuar una sustracción entre las bases.'
  - 'La afirmación de que el producto de dos logaritmos $\log_a(b) \cdot \log_c(d)$ siempre resulta en la unidad.'
  - 'La afirmación de que la propiedad de cambio de base exige que la nueva base $c$ sea estrictamente mayor que el argumento $a$.'
afirmaciones_verdaderas:
  - 'La fórmula de cambio de base $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$ permite convertir cualquier logaritmo a una base conveniente $c > 0, c \neq 1$.'
  - 'Intercambiar el argumento y la base de un logaritmo genera su inverso multiplicativo recíproco ($\log_b(a) = \frac{1}{\log_a(b)}$).'
al_terminar_debes_poder: |
  QUÉ: Aplicar la fórmula de cambio de base $\log_b(a) = \frac{\log_c(a)}{\log_c(b)}$ para evaluar o simplificar logaritmos.
  CÓMO: Expresar el logaritmo como un cociente entre el logaritmo del argumento y el logaritmo de la base original en la nueva base $c$.
