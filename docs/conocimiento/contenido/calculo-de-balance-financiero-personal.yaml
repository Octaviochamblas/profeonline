semantic_id: MAT.NUM.FINANZAS_PERSONALES.BALANCE_FLUJO
resumen_inicial: 'El cálculo del balance financiero personal evalúa la salud económica evaluando el flujo de caja ($B = \sum I - \sum G$) y el patrimonio neto personal ($\text{Patrimonio} = \text{Activos} - \text{Pasivos}$).'
explicacion_simple: |
  El **balance financiero personal** te dice si tu economía goza de buena salud o si estás en problemas:
  - **Superávit ($B > 0$)**: Tus ingresos son mayores que tus gastos. Te queda dinero libre cada mes para ahorrar e invertir.
  - **Equilibrio ($B = 0$)**: Vives "al día", lo que ganas es exactamente lo que gastas (sin colchón ante emergencias).
  - **Déficit ($B < 0$)**: Tus gastos superan a tus ingresos. Estás gastando dinero que no tienes y acumulando deudas.

  ![Cálculo de balance financiero personal](/static/img/nodos/calculo-de-balance-financiero-personal-intro.svg)
explicacion_formal: |
  ### Definición formal
  El estado de situación financiera personal se cuantifica mediante dos modelos fundamentales:
  1. **Balance de Flujo de Caja Periódico ($B$)**:
     $$B = \sum_{i=1}^n I_i - \sum_{j=1}^m G_j$$
     - $B > 0 \implies$ Superávit operativo (acumulación neta de liquidez).
     - $B = 0 \implies$ Flujo neutro o de subsistencia estricta.
     - $B < 0 \implies$ Déficit operativo (requiere desahorro o endeudamiento externo).

  2. **Tasa de Ahorro Real ($S_R$)**:
     $$S_R = \left(\frac{B}{I_T}\right) \cdot 100\% \quad (B > 0)$$

  3. **Patrimonio Neto ($P_N$)**:
     $$P_N = \sum \text{Activos} - \sum \text{Pasivos}$$

  ### Síntesis didáctica
  - Ecuación del balance: $B = I_{\text{Total}} - G_{\text{Total}}$.
  - Tasa de ahorro: $S_R = (B / I_T) \cdot 100\%$.
  - Patrimonio: $P_N = \text{Activos} - \text{Pasivos}$.
definiciones_clave: |
  - **Superávit financiero**: Saldo positivo resultante de ingresos superiores a los egresos en un período.
  - **Déficit financiero**: Brecha negativa producida cuando los egresos exceden a los ingresos percibidos.
  - **Patrimonio Neto**: Valor monetario real de los bienes y derechos propiedad del individuo tras deducir todas sus deudas.
propiedades_relaciones: |
  - **Acumulación patrimonial**: El patrimonio neto en el tiempo $t$ satisface $P_N(t) = P_N(0) + \sum B_k + \Delta \text{Valor Activos}$.
  - **Sostenibilidad financiera**: Mantener déficits recurrentes reduce el patrimonio neto y conduce inexorablemente a la insolvencia.
ejemplo_guiado:
  enunciado: 'Una persona percibe ingresos totales de $\$900.000$ y registra gastos totales de $\$750.000$ en el mes. Calcula su balance financiero mensual y su tasa de ahorro.'
  imagen: '/static/img/nodos/calculo-de-balance-financiero-personal-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos $I_T = 900.000$ y $G_T = 750.000$.'
    - 'Paso 2: Evaluamos el balance mensual: $B = I_T - G_T = 900.000 - 750.000 = +$\$150.00$0$ (Superávit).'
    - 'Paso 3: Calculamos la tasa de ahorro: $S_R = \frac{150.000}{900.000} \approx 0,1667$.'
    - 'Paso 4: Convertimos a porcentaje: $S_R = 0,1667 \cdot 100\% = 16,67\%$. Registra un **superávit de $\$150.000$** con una tasa de ahorro del **$16,67\%$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ocurre en la economía personal cuando el balance mensual arroja un valor negativo ($B < 0$)?'
    choices:
      - {text: 'Se produce un déficit que obliga a liquidar ahorros previos o contratar nueva deuda', is_correct: true}
      - {text: 'El patrimonio neto aumenta de forma automática', is_correct: false}
      - {text: 'El banco cancela las deudas de la persona', is_correct: false}
      - {text: 'La tasa de ahorro se convierte en un 100%', is_correct: false}
    explanation: 'La alternativa correcta es ''Se produce un déficit que obliga a liquidar ahorros previos o contratar nueva deuda''. El déficit exige financiamiento externo para cubrir la brecha.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una persona tiene $\$600.000$ de ingresos y $\$680.000$ de gastos, ¿cuál es su balance?'
    choices:
      - {text: 'Déficit de $-$\$80.00$0$, calculando $600.000 - 680.000 = -80.000$', is_correct: true}
      - {text: 'Superávit de $+$\$80.00$0$', is_correct: false}
      - {text: 'Equilibrio en $\$0$', is_correct: false}
      - {text: 'Superávit de $\$600.000$', is_correct: false}
    explanation: 'La alternativa correcta es ''Déficit de $-$\$80.00$0$, calculando $600.000 - 680.000 = -80.000$''. Al gastar más de lo que ingresa se genera déficit.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sumar todos los ingresos del período para obtener $I_{\text{Total}}$.'
  - 'Paso 2: Sumar todos los gastos ejecutados del período para obtener $G_{\text{Total}}$.'
  - 'Paso 3: Calcular la diferencia $B = I_{\text{Total}} - G_{\text{Total}}$.'
  - 'Paso 4: Clasificar el resultado en Superávit ($B > 0$), Equilibrio ($B = 0$) o Déficit ($B < 0$) y evaluar la tasa de ahorro.'
errores_correccion: |
  - **Error 1:** Omitir gastos pagados con tarjetas de crédito al calcular $G_T$. **Cómo corregirlo:** Las compras con tarjeta son **gastos reales del período** que deben sumarse íntegramente.
  - **Error 2:** Confundir el flujo de caja mensual positivo (superávit) con el patrimonio neto acumulado. **Cómo corregirlo:** El superávit es el **flujo del mes**, mientras que el patrimonio es el **stock acumulado de activos menos pasivos**.
ejemplos:
  - titulo: 'Balance con superávit'
    enunciado: 'Si los ingresos son $\$800.000$ y los gastos $\$650.000$, ¿cuál es el superávit mensual?'
    alternativas:
      - '$\$150.000$'
      - '$\$800.000$'
      - '$\$650.000$'
    respuesta: '$\$150.000$'
    solucion_pasos:
      - '1. $B = 800.000 - 650.000 = +$\$150.00$0$.'
  - titulo: 'Cálculo de Patrimonio Neto'
    enunciado: 'Si una persona tiene activos por $\$5.000.000$ (ahorros, auto) y deudas por $\$2.000.000$, ¿cuál es su patrimonio neto?'
    alternativas:
      - '$\$3.000.000$'
      - '$\$7.000.000$'
      - '$\$5.000.000$'
    respuesta: '$\$3.000.000$'
    solucion_pasos:
      - '1. $P_N = 5.000.000 - 2.000.000 = $\$3.000.00$0$.'
  - titulo: 'Tasa de ahorro del 25%'
    enunciado: 'Si con un ingreso de $\$1.000.000$ se logra un superávit de $\$250.000$, ¿la tasa de ahorro es del $25\%$?'
    alternativas:
      - 'Sí, pues $(250.000 / 1.000.000) \cdot 100\% = 25\%$'
      - 'No, es del $2,5\%$'
      - 'No, es del $50\%$'
    respuesta: 'Sí, pues $(250.000 / 1.000.000) \cdot 100\% = 25\%$'
    solucion_pasos:
      - '1. $S_R = (250.000 / 1.000.000) \cdot 100\% = 25\%$.'
  - titulo: 'Impacto de un balance deficitario sostenido'
    enunciado: '¿Mantener un balance con déficit continuo durante 12 meses disminuye el patrimonio neto personal?'
    alternativas:
      - 'Sí, porque exige endeudarse o agotar los ahorros acumulados'
      - 'No, el patrimonio se mantiene intacto'
      - 'No, el déficit aumenta el patrimonio'
    respuesta: 'Sí, porque exige endeudarse o agotar los ahorros acumulados'
    solucion_pasos:
      - '1. Los déficits consumen activos o incrementan pasivos, reduciendo $P_N$.'
errores_frecuentes:
  - 'Un balance financiero con resultado deficitario genera un incremento automático en el patrimonio neto.'
  - 'El cálculo del balance mensual omite los desembolsos y consumos efectuados mediante tarjetas de crédito.'
  - 'El patrimonio neto personal se obtiene sumando los activos totales con las deudas pendientes de pago.'
  - 'Un balance en valor cero indica un nivel óptimo de acumulación de riqueza y capacidad de ahorro.'
  - 'La tasa de ahorro personal se calcula dividiendo los gastos totales entre los ingresos percibidos.'
afirmaciones_verdaderas:
  - 'El balance financiero mensual es la diferencia entre los ingresos totales y los gastos totales del período ($B = \sum I - \sum G$).'
  - 'El patrimonio neto personal equivale a los activos totales de propiedad del individuo menos sus pasivos o deudas ($P_N = \text{Activos} - \text{Pasivos}$).'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/calculo-de-balance-financiero-personal-resumen.svg)

  QUÉ: Calcular el balance financiero personal y determinar la tasa de ahorro y patrimonio neto.
  CÓMO: Evaluar el flujo neto $B = \sum I - \sum G$ diagnosticando superávit, equilibrio o déficit, y computar el patrimonio neto mediante $P_N = \text{Activos} - \text{Pasivos}$.
