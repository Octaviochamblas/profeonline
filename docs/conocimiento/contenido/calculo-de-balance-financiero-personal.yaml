procedimiento:
- 'Paso 1: Suma todos tus ingresos del periodo.'
- 'Paso 2: Suma todos tus gastos (fijos, variables, cuotas de créditos).'
- 'Paso 3: Resta $Ingresos - Gastos$ para obtener el Balance final.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de balance
  financiero personal.
ejemplos:
- titulo: Cálculo de flujo
  enunciado: 'Ingreso: $500.000. Gastos Fijos: $300.000. Gastos Variables: $250.000. ¿Cuál
    es el balance?'
  solucion_pasos:
  - Total Gastos = $300.000 + 250.000 = 550.000$.
  - Balance = $500.000 - 550.000 = -50.000$.
  - Hay un déficit de $50.000. Esa persona se endeudó ese mes.
- titulo: Ejemplo 2
  enunciado: Con ingresos de 500.000 pesos y gastos totales de 520.000 pesos, ¿cuál es el
    balance?
  alternativas:
  - '-20.000'
  - '20.000'
  - '500.000'
  respuesta: '-20.000'
  solucion_pasos:
  - 500.000 menos 520.000 es igual a -20.000.
- titulo: Ejemplo 3
  enunciado: Con ingresos de 800.000 pesos y gastos totales de 800.000 pesos, ¿qué tipo de
    balance hay?
  alternativas:
  - Equilibrio
  - Superávit
  - Déficit
  respuesta: Equilibrio
  solucion_pasos:
  - Los ingresos son exactamente iguales a los gastos.
- titulo: ¿Un balance negativo, o déficit, significa que se gastó más de lo que se ganó?
  respuesta: Sí
  solucion_pasos:
  - Y usualmente implica usar crédito o ahorros previos para cubrir la diferencia.
errores_frecuentes:
- Olvidar sumar los 'pagos con tarjeta de crédito' como un gasto en el mes que se pagan.
- Creer que pedir un préstamo suma como 'Ingreso' (el préstamo te da efectivo hoy, pero aumenta
  tus gastos futuros, no es un ingreso real tuyo).
- Olvidar sumar los pagos con tarjeta de crédito como un gasto en el mes en que se pagan.
- Creer que pedir un préstamo suma como ingreso, cuando en realidad aumenta los gastos futuros.
- Sumar los gastos fijos y variables incorrectamente, olvidando alguna categoría al calcular
  el total.
afirmaciones_verdaderas:
- La propiedad de cálculo de balance financiero personal preserva la consistencia lógica.
- Un balance financiero positivo, o superávit, significa que los ingresos del periodo fueron
  mayores que los gastos.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de balance financiero
  personal.
