semantic_id: MAT.NUM.FINANZAS_PERSONALES.BALANCE_FLUJO
resumen_inicial: 'Cálculo de balance financiero personal: concepto y propiedades fundamentales
  en Finanzas personales.'
explicacion_simple: Llegó fin de mes. Sumamos todo lo que entró y restamos todo lo que salió.
  Si el número es verde, hiciste las cosas bien. Si el número es rojo, estás cavando un hoyo
  financiero.
explicacion_formal: 'El **Balance o Flujo de Caja Mensual** es la operación matemática que
  evalúa el resultado de tu mes.


  Fórmula:

  $$\text{Balance} = \sum \text{Ingresos} - \sum \text{Gastos}$$


  - **Superávit (Balance $> 0$):** Te sobró dinero. Tus ingresos fueron mayores que tus gastos.
  Este dinero debe ir a ahorro o inversión.

  - **Equilibrio (Balance $= 0$):** Gastaste exactamente todo lo que ganaste (vivir al día).

  - **Déficit (Balance $< 0$):** Gastaste más de lo que ganaste. Esto significa matemáticamente
  que usaste crédito (tarjeta, préstamo) o ahorros pasados para cubrir el mes. Estás aumentando
  tus deudas.'
definiciones_clave: '- **Cálculo de balance financiero personal**: Elemento central dentro
  del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo de balance financiero personal.'
ejemplo_guiado:
  enunciado: En un mes, una persona tuvo ingresos de 700.000 pesos, gastos fijos de 400.000
    pesos y gastos variables de 250.000 pesos. Calcula su balance financiero.
  pasos:
  - 'Sumo los gastos totales: 400.000 más 250.000 es igual a 650.000.'
  - 'Aplico la fórmula del balance: Ingresos menos Gastos, es decir 700.000 menos 650.000.'
  - 'Calculo el resultado: 50.000. Hay un superávit de 50.000, ese dinero puede destinarse
    a ahorro.'
