resumen_inicial: 'El balance o flujo neto de caja mensual es la diferencia aritmética
  entre los ingresos totales recibidos y los egresos totales pagados: $B_{neto} =
  I_{total} - G_{total}$.'
explicacion_simple: El balance de dinero mensual es lo que queda al restar lo que
  gastamos de lo que ganamos. Si el resultado es positivo tenemos superávit (podemos
  ahorrar); si da exactamente cero estamos en equilibrio; y si da negativo estamos
  en déficit (gastamos más de lo que ganamos).
explicacion_formal: 'Para un período mensual de caja, el **Balance Financiero Neto
  $B_{neto}$** se calcula como:


  $$B_{neto} = I_{total} - G_{total} = I_{total} - (G_{fijos} + G_{variables} + D_{cuotas})$$


  **Estados del balance:**

  - Superávit: $B_{neto} > 0$ (capacidad real de ahorro e inversión).

  - Equilibrio: $B_{neto} = 0$.

  - Déficit: $B_{neto} < 0$ (requiere endeudamiento o liquidación de patrimonio).'
definiciones_clave: '- **Balance financiero $B_{neto}$**: Diferencia $I_{total} -
  G_{total}$ que determina el superávit o déficit.'
propiedades_relaciones: '- **Superávit/Déficit**: $B > 0 \implies$ capacidad de ahorro;
  $B < 0 \implies$ déficit financiero.'
ejemplo_guiado:
  enunciado: Un hogar percibe ingresos por \$950.000 y tiene egresos totales por \$820.000.
    Calcule el balance de flujo neto.
  pasos:
  - 'Paso 1: Identificar $I_{total} = 950.000$ y $G_{total} = 820.000$.'
  - 'Paso 2: Restar ingresos menos egresos: $B_{neto} = 950.000 - 820.000 = 130.000$.'
  - 'Conclusión: El balance arroja un superávit mensual de \$130.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué estado financiero refleja un balance Bneto = Itotal - Gtotal estrictamente
    positivo (B > 0)?
  choices:
  - text: Refleja un estado de superávit financiero con capacidad de ahorro
    is_correct: true
  - text: Refleja un estado de déficit que exige endeudamiento
    is_correct: false
  - text: Refleja quiebra inmediata
    is_correct: false
  - text: Refleja equilibrio sin ahorro
    is_correct: false
  explanation: La alternativa correcta es 'Refleja un estado de superávit financiero
    con capacidad de ahorro'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para ingresos de $950.000 y gastos de $820.000, ¿cuál
    fue el balance neto?
  choices:
  - text: Un superávit de 130.000 $
    is_correct: true
  - text: Un déficit de 130.000 $
    is_correct: false
  - text: Un superávit de 170.000 $
    is_correct: false
  - text: Cero balance
    is_correct: false
  explanation: La alternativa correcta es 'Un superávit de 130.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el balance financiero
  neto $B_{neto} = I_{total} - G_{total}$, determinando si existe superávit o déficit.
semantic_id: MAT.NUM.FINANZAS_PERSONALES.BALANCE_FLUJO
procedimiento:
- 'Paso 1: Identificar las variables financieras de ingresos, gastos, tasas de interés
  o sueldos imponibles.'
- 'Paso 2: Aplicar la fórmula financiera correspondiente ($B = I - G$, $R\%$, $r_{real}$
  o $10\% \text{ AFP}$).'
- 'Paso 3: Calcular el resultado y evaluar la estabilidad presupuestaria.'
errores_correccion: '- **Error 1: Confundir la tasa de interés nominal con la tasa
  real sin restar la inflación del IPC.** **Cómo corregirlo:** La ganancia real de
  poder adquisitivo exige descontar el IPC ($r_{real} \approx r_{nominal} - \text{IPC}$).


  - **Error 2: Calcular la cotización previsional de AFP sobre el sueldo líquido en
  vez del imponible.** **Cómo corregirlo:** El $10\%$ obligatorio se aplica estrictamente
  sobre el SUELDO IMPONIBLE (hasta el tope legal).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.FINANZAS_PERSONALES.BALANCE_FLUJO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de finanzas personales.
- titulo: Ejemplo 2
  enunciado: Verificación de equilibrio financiero.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal de balance o cotización.
- titulo: ¿Es el 10% el porcentaje obligatorio de cotización previsional a la AFP?
  respuesta: Sí
  solucion_pasos:
  - Sí, sobre el sueldo imponible hasta el tope legal.
- titulo: ¿Genera un balance B = I - G positivo capacidad de ahorro?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa un superávit mensual de caja.
errores_frecuentes:
- Calcular el porcentaje de cotización previsional a la AFP sobre el sueldo líquido
  recibido en cuenta corriente.
- Sumar directamente la tasa de interés nominal y la inflación pretendiendo obtener
  la rentabilidad real.
- Considerar los gastos variables como egresos de costo fijo que no se pueden modificar
  mensualmente.
- La tasa de inflación del IPC incrementa el poder adquisitivo del dinero depositado
  a tasa fija.
- Clasificar el dividendo pagado por acciones como un gasto imprevisto en el presupuesto
  personal.
afirmaciones_verdaderas:
- 'El balance financiero de caja se calcula restando los egresos totales a los ingresos
  recibidos: $B_{neto} = I_{total} - G_{total}$.'
- La cotización previsional obligatoria a la AFP en Chile equivale al 10% del sueldo
  imponible ajustado al tope legal.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
