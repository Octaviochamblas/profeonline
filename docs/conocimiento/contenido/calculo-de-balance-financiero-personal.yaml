semantic_id: MAT.NUM.FINANZAS_PERSONALES.BALANCE_FLUJO
resumen_inicial: 'Cálculo de balance financiero personal: concepto y propiedades fundamentales
  en Finanzas personales.'
explicacion_simple: Llegó fin de mes. Sumamos todo lo que entró y restamos todo lo
  que salió. Si el número es verde, hiciste las cosas bien. Si el número es rojo,
  estás cavando un hoyo financiero.
explicacion_formal: 'El **Balance o Flujo de Caja Mensual** es la operación matemática
  que evalúa el resultado de tu mes.


  Fórmula:

  $$\text{Balance} = \sum \text{Ingresos} - \sum \text{Gastos}$$


  - **Superávit (Balance $> 0$):** Te sobró dinero. Tus ingresos fueron mayores que
  tus gastos. Este dinero debe ir a ahorro o inversión.

  - **Equilibrio (Balance $= 0$):** Gastaste exactamente todo lo que ganaste (vivir
  al día).

  - **Déficit (Balance $< 0$):** Gastaste más de lo que ganaste. Esto significa matemáticamente
  que usaste crédito (tarjeta, préstamo) o ahorros pasados para cubrir el mes. Estás
  aumentando tus deudas.'
definiciones_clave: '- **Cálculo de balance financiero personal**: Elemento central
  dentro del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
