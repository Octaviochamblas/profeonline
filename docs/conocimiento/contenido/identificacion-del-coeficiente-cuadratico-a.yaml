semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_A
resumen_inicial: El coeficiente cuadrático $a$ es la constante numérica real que multiplica a la incógnita elevada al cuadrado ($x^2$) en la forma general $ax^2 + bx + c = 0$.
explicacion_simple: "![El coeficiente cuadrático $a$ es la constante numérica real que multiplica a la incógnita elevada al cuadrado ($x^2$) en la forma general $ax^2 + bx + c = 0$](/static/img/nodos/identificacion-del-coeficiente-cuadratico-a-intro.svg)\n\n\nEl **coeficiente cuadrático $a$** es el número que acompaña directamente a $x^2$:\n- En $5x^2 - 3x + 2 = 0$, el coeficiente es **$a = 5$**.\n- En $-4x^2 + x - 9 = 0$, el coeficiente es **$a = -4$** (¡el signo menos se incluye!).\n- **Casos invisibles:**\n  - Si ves solo $x^2$, hay un $1$ invisible: **$a = 1$**.\n  - Si ves $-x^2$, hay un $-1$ invisible: **$a = -1$**.\n  - En $\\frac{x^2}{4}$, es una fracción: **$a = \\frac{1}{4}$**."
explicacion_formal: 'En la representación canónica de la ecuación de segundo grado:

  $$P(x) = ax^2 + bx + c = 0$$

  El coeficiente cuadrático $a$ es el elemento escalar que satisface:

  $$a = \frac{1}{2} P''''(x) = \lim_{x \to \infty} \frac{P(x)}{x^2} \in \mathbb{R} \setminus \{0\}$$


  **Significado geométrico y algebraico:**

  - **Concavidad de la parábola asociada**: Si $a > 0$, la parábola abre hacia arriba ($\ ext{U}$); si $a < 0$, abre hacia abajo ($\cap$).

  - **Apertura de ramas**: $|a|$ determina el ancho de la curva (mayor $|a| \implies$ ramas más cerradas/estrechas).

  - **Denominador en la fórmula general**: $a$ aparece en el divisor $2a$ de la resolvente cuadrática.'
definiciones_clave: '- **Coeficiente cuadrático $a$**: Factor constante que pondera a la potencia $x^2$.

  - **Ecuación mónic**: Ecuación cuadrática donde el coeficiente principal es unitario ($a = 1$).'
propiedades_relaciones: '- **Normalización mónic**: Cualquier ecuación cuadrática $ax^2 + bx + c = 0$ puede convertirse en mónic dividiendo toda la igualdad entre $a$.

  - **Invarianza de soluciones por cambio de signo**: Las soluciones de $-ax^2 - bx - c = 0$ son exactamente las mismas que las de $ax^2 + bx + c = 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El coeficiente cuadrático $a$ es la constante numérica real que multiplica a la incógnita elevada al cuadrado ($x^2$) en la forma general $ax^2 + bx + c = 0$](/static/img/nodos/identificacion-del-coeficiente-cuadratico-a-ejemplos.svg)



    Identifica el valor exacto del coeficiente cuadrático $a$ en las siguientes ecuaciones tras reducirlas si fuera necesario:

    1) $-x^2 + 8x - 3 = 0$

    2) $\frac{3x^2}{5} - 2x = 4$

    3) $7 - 2x^2 = 5x$'
  pasos:
  - 'Paso 1: En $-x^2 + 8x - 3 = 0$: el término cuadrático es $-1x^2 \implies a = -1$.'
  - 'Paso 2: En $\frac{3x^2}{5} - 2x = 4$: ordenando $\frac{3}{5}x^2 - 2x - 4 = 0 \implies a = \frac{3}{5}$.'
  - 'Paso 3: En $7 - 2x^2 = 5x$: transponiendo $-2x^2 - 5x + 7 = 0 \implies a = -2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor del coeficiente cuadrático a en la ecuación $x^2 - 6x + 8 = 0$?
  choices:
  - text: a = 1
    is_correct: true
  - text: a = 0
    is_correct: false
  - text: a = x^2
    is_correct: false
  - text: a = 8
    is_correct: false
  explanation: La alternativa correcta es 'a = 1'. Cuando no hay un número explícito delante de $x^2$, el coeficiente es el neutro multiplicativo 1.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la ecuación $\frac{2 - x^2}{3} = 4x$, ¿cuánto vale el coeficiente a?
  choices:
  - text: a = -1/3
    is_correct: true
  - text: a = -1
    is_correct: false
  - text: a = 2/3
    is_correct: false
  - text: a = 3
    is_correct: false
  explanation: La alternativa correcta es 'a = -1/3'. $\frac{2}{3} - \frac{1}{3}x^2 - 4x = 0 \implies a = -\frac{1}{3}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Llevar la ecuación a su forma general ordenada con todos los términos en un solo miembro.'
- 'Paso 2: Identificar el monomio que contiene la incógnita elevada al cuadrado ($x^2$).'
- 'Paso 3: Extraer el número que multiplica a $x^2$, incluyendo su signo positivo o negativo y posibles denominadores.'
- 'Paso 4: Verificar que el valor asignado a $a$ no contenga la letra $x$.'
errores_correccion: '- **Error común:** Escribir $a = 5x^2$ o decir que si aparece $x^2$ entonces $a = 0$.

  - **Cómo corregirlo:** $a$ es **solo el número factor** ($a = 5$); si aparece $x^2$ suelto, el número multiplicador es **$1$**, nunca $0$.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficiente unitario negativo'
  enunciado: En $-x^2 + 5x - 4 = 0$, ¿cuál es el valor de a?
  alternativas:
  - '-1'
  - '1'
  - '0'
  - -x^2
  respuesta: '-1'
  solucion_pasos:
  - 'Paso 1: El signo menos delante de $x^2$ indica que $a = -1$.'
- titulo: 'Ejemplo 2: Término cuadrático fraccionario'
  enunciado: ¿Cuánto vale a en $\frac{5x^2}{8} - 3 = 0$?
  alternativas:
  - 5/8
  - '5'
  - '8'
  - 5/8 x^2
  respuesta: 5/8
  solucion_pasos:
  - 'Paso 1: La fracción completa $\frac{5}{8}$ es el coeficiente $a$.'
- titulo: 'Ejemplo 3: Ecuación desordenada'
  enunciado: Halla a en $4 - 9x^2 + 2x = 0$.
  alternativas:
  - '-9'
  - '4'
  - '9'
  - '2'
  respuesta: '-9'
  solucion_pasos:
  - 'Paso 1: El término con $x^2$ es $-9x^2$, por lo que $a = -9$.'
- titulo: 'Ejemplo 4: Término cuadrático en el miembro derecho'
  enunciado: Al pasar $3x - 1 = -7x^2$ a la forma general izquierda, ¿cuánto vale a?
  alternativas:
  - '7'
  - '-7'
  - '3'
  - '-1'
  respuesta: '7'
  solucion_pasos:
  - 'Paso 1: Transponiendo: $7x^2 + 3x - 1 = 0 \implies a = 7$.'
errores_frecuentes:
- Incluir x^2 en el valor del coeficiente a.
- Asumir que a es siempre el primer número que aparece escrito en la ecuación sin ordenar.
- Olvidar los denominadores que dividen a x^2.
afirmaciones_verdaderas:
- El coeficiente cuadrático a es el número real no nulo que multiplica a x².
- En la ecuación x² + bx + c = 0, el coeficiente cuadrático es a = 1.
al_terminar_debes_poder: '**QUÉ:** Identificar y extraer con precisión el coeficiente cuadrático a en cualquier ecuación de segundo grado.


  **CÓMO:** Aislando el factor numérico que acompaña a x² en la forma canónica ordenada y asignando su valor con signo correcto.


