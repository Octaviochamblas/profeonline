semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_A
resumen_inicial: La identificación del coeficiente cuadrático $a$ reconoce el valor numérico (con su signo) que multiplica a la potencia $x^2$.
explicacion_simple: |
  El **coeficiente cuadrático $a$** es el número exacto que acompaña y multiplica a la variable $x^2$:

  - En $5x^2 - 3x + 8 = 0$, el coeficiente cuadrático es $a = 5$.
  - En $-x^2 + 4x - 1 = 0$, el coeficiente cuadrático incluye el signo menos: $a = -1$.
  - En $x^2 + 7x = 0$, cuando $x^2$ parece "solo", su coeficiente implícito es $a = 1$.
  - **Recuerda**: El coeficiente $a$ **NUNCA INCLUYE la variable $x^2$**; es únicamente el factor numérico.
explicacion_formal: |
  Sea la ecuación cuadrática reducida en forma general $ax^2 + bx + c = 0$. El **coeficiente cuadrático $a$** se define formalmente como el multiplicador o escalar del término de grado 2:

  $$a = \text{coef}(x^2) \in \mathbb{R} \setminus \{0\}$$

  **Propiedades estructurales:**
  - Si $a = 1$, la ecuación cuadrática se denomina **mónica**.
  - Si $a < 0$, la parábola asociada a la función cuadrática correspondiente abre hacia abajo (concavidad negativa).
  - Si $a > 0$, la parábola abre hacia arriba (concavidad positiva).
definiciones_clave: |
  - **Coeficiente cuadrático $a$**: Factor numérico constante que multiplica a la incógnita elevada al cuadrado $x^2$.
propiedades_relaciones: |
  - **Ecuaciones equivalentes por multiplicación**: Si se multiplica la ecuación $x^2 - 3x + 2 = 0$ por 4, se obtiene $4x^2 - 12x + 8 = 0$, donde el nuevo coeficiente cuadrático es $a = 4$.
ejemplo_guiado:
  enunciado: 'Identifica el coeficiente cuadrático $a$ en la ecuación $\frac{x^2}{3} - 4x + 9 = 0$ y en la ecuación $-x^2 + 6 = 0$.'
  pasos:
    - 'Paso 1: Para $\frac{x^2}{3} - 4x + 9 = 0$, reescribir el primer término como $\frac{1}{3} \cdot x^2$.'
    - 'Paso 2: Concluir que el coeficiente cuadrático es $a = \frac{1}{3}$.'
    - 'Paso 3: Para $-x^2 + 6 = 0$, observar que $-x^2$ equivale a $-1 \cdot x^2$.'
    - 'Paso 4: Concluir que el coeficiente cuadrático es $a = -1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor del coeficiente cuadrático $a$ en la ecuación $-x^2 + 8x - 5 = 0$?'
    choices:
      - {text: '$a = -1$', is_correct: true}
      - {text: '$a = 1$', is_correct: false}
      - {text: '$a = -x^2$', is_correct: false}
      - {text: '$a = 8$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = -1$''. El signo menos delante de $x^2$ indica que el coeficiente numérico es $-1$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el coeficiente cuadrático $a$ en la ecuación $\frac{3x^2}{5} - 2 = 0$?'
    choices:
      - {text: '$a = \frac{3}{5}$', is_correct: true}
      - {text: '$a = 3$', is_correct: false}
      - {text: '$a = 5$', is_correct: false}
      - {text: '$a = \frac{3x^2}{5}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = \frac{3}{5}$''. El factor constante numérico que multiplica a $x^2$ es la fracción $\frac{3}{5}$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Ordenar e igualar la ecuación a cero si se encuentra desordenada.'
  - 'Paso 2: Localizar el término algebraico que contiene la potencia cuadrática $x^2$.'
  - 'Paso 3: Separar la variable $x^2$ de su multiplicador escalar numérico.'
  - 'Paso 4: Extraer el multiplicador constante (incluyendo su signo y denominadores) como el coeficiente $a$.'
errores_correccion: |
  - **Error común:** Incluir la letra $x^2$ dentro del valor del coeficiente (decir $a = 5x^2$ en vez de $a = 5$).
  - **Cómo corregirlo:** Los coeficientes $a, b, c$ **SON SOLO NÚMEROS**; nunca incluyas la incógnita ni la potencia en su valor.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Coeficiente implícito.
    alternativas:
      - '$a = 1$'
      - '$a = 0$'
      - '$a = x^2$'
    respuesta: '$a = 1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Coeficiente fraccionario.
    alternativas:
      - '$a = 1/2$'
      - '$a = 2$'
      - '$a = -1/2$'
    respuesta: '$a = 1/2$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El coeficiente cuadrático $a$ de la expresión $7x^2 - 3x + 1 = 0$ es el término completo $7x^2$.'
  - 'En la ecuación $x^2 - 4 = 0$, el coeficiente $a$ vale cero porque no hay ningún número escrito antes de $x^2$.'
  - 'El coeficiente cuadrático $a$ cambia de valor según el número real que se asigne a la incógnita $x$.'
  - 'En la ecuación desordenada $3 - 5x + 2x^2 = 0$, el coeficiente $a$ es obligatoriamente el primer número $3$.'
  - 'Si el coeficiente cuadrático es un número negativo $a = -2$, la ecuación deja de ser de segundo grado.'
afirmaciones_verdaderas:
  - 'El coeficiente cuadrático $a$ representa exclusivamente el factor constante escalar que multiplica a $x^2$, sin incluir la incógnita.'
  - 'En términos cuadráticos de la forma $x^2$ o $-x^2$, el coeficiente $a$ toma los valores implícitos $1$ y $-1$ respectivamente.'
al_terminar_debes_poder: |
  QUÉ: Identificar y extraer con precisión el coeficiente cuadrático $a$ en cualquier ecuación de segundo grado.
  CÓMO: Isolar el factor numérico constante que multiplica a $x^2$ considerando signos, coeficientes implícitos y fracciones.
fuente: 'Texto escolar MINEDUC — Álgebra / Ecuaciones de Segundo Grado'
