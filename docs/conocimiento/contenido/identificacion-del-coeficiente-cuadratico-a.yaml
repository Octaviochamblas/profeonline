semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_A
resumen_inicial: El coeficiente cuadrático $a$ es el número real (con su signo) que
  multiplica directamente a $x^2$.
explicacion_simple: "Para identificar el **coeficiente cuadrático $a$**:\n- Busca\
  \ el término que contiene a $x^2$.\n- El número que está al lado de $x^2$ es $a$.\n\
  - Ejemplos:\n  - En $5x^2 - 3x + 1 = 0 \\implies a = 5$.\n  - En $-x^2 + 4x - 9\
  \ = 0 \\implies a = -1$.\n  - En $x^2 + 7 = 0 \\implies a = 1$ (si no hay número\
  \ explícito, hay un $1$ implícito)."
explicacion_formal: 'En el polinomio cuadrático $a x^2 + b x + c$, el coeficiente
  $a$ representa la **segunda derivada discreta o factor cuadrático principal**:


  $$a = \frac{1}{2} P''''(x) \quad \text{con } a \in \mathbb{R}^$$


  **Desglose de la fórmula:**

  - Factor numérico real estricto asignado al monomio cuadrático de la forma general
  $a x^2$.'
definiciones_clave: '- **Coeficiente cuadrático ($a$)**: Número real escalar que determina
  la magnitud y apertura del término de segundo grado.'
propiedades_relaciones: '- **Preservación de signo**: El signo positivo o negativo
  pertenece al coeficiente $a$ ($a = -1$ cuando se lee $-x^2$).'
ejemplo_guiado:
  enunciado: Identifica el valor del coeficiente cuadrático $a$ en la ecuación $7
    - x^2 + 3x = 0$.
  pasos:
  - 'Paso 1: Reordenar los términos en forma canónica descendente: $-x^2 + 3x + 7
    = 0$.Paso 2: Localizar el término cuadrático: $-x^2$.Paso 3: Notar que $-x^2$
    equivale a $(-1) \cdot x^2$.Paso 4: Concluir que el coeficiente cuadrático es
    $a = -1$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la ecuación desordenada $7 - x^2 + 3x = 0$, ¿cuál es el valor correcto
    del coeficiente cuadrático $a$?
  choices:
  - text: $a = -1$
    is_correct: true
  - text: $a = 7$
    is_correct: false
  - text: $a = 3$
    is_correct: false
  - text: $a = 1$
    is_correct: false
  explanation: La alternativa correcta es '$a = -1$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una ecuación cuadrática comienza con el término $+x^2$ sin número escrito
    delante, ¿cuánto vale su coeficiente $a$?
  choices:
  - text: $a = 1$
    is_correct: true
  - text: $a = 0$
    is_correct: false
  - text: $a = 2$
    is_correct: false
  - text: $a = x$
    is_correct: false
  explanation: La alternativa correcta es '$a = 1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el término que contiene la variable elevada a la potencia 2
  ($x^2$).'
- 'Paso 2: Observar el número multiplicativo delante de $x^2$ incluyendo su signo.'
- 'Paso 3: Si no hay número escrito, asignar $a = 1$ (o $a = -1$ si hay un signo menos).'
- 'Paso 4: Escribir el valor numérico de $a$.'
errores_correccion: '- **Error común:** Incluir la variable $x^2$ al nombrar el coeficiente
  (decir que $a = -x^2$).

  - **Cómo corregirlo:** Los coeficientes son NÚMEROS REALES puros; jamás debes incluir
  la letra $x$ al dar el valor de $a$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
