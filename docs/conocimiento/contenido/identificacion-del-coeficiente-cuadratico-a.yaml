semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_A
resumen_inicial: 'Identificación del coeficiente cuadrático a: concepto, discriminante,
  soluciones y modelamiento en Conceptos y formas de la ecuación cuadrática.'
explicacion_simple: El coeficiente $a$ es el número que "acompaña" al término $x^2$;
  es el que le da a la ecuación su carácter cuadrático.
explicacion_formal: '### Definición formal


  En la forma general $ax^2+bx+c=0$, el coeficiente $a$ es el número real que multiplica
  al término de mayor grado, $x^2$. Por definición de ecuación cuadrática, $a \neq
  0$.


  ### Desarrollo didáctico


  Para identificar $a$, basta con localizar el término que contiene $x^2$ y leer el
  número que lo multiplica, respetando su signo. Si no aparece ningún número explícito,
  el coeficiente es $1$ (o $-1$ si el término es negativo).


  En $-6x^2+4x-1=0$, el coeficiente $a$ es $-6$. En $x^2-9=0$, el coeficiente $a$
  es $1$, aunque no aparezca escrito.'
definiciones_clave: '- **Identificación del coeficiente cuadrático a**: Elemento o
  técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en identificación
  del coeficiente cuadrático a.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando identificación del
    coeficiente cuadrático a.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a identificación del coeficiente
    cuadrático a.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
