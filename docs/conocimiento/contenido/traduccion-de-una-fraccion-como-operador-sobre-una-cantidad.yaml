resumen_inicial: La traducción de una fracción como operador sobre una cantidad en
  lenguaje algebraico vincula enunciados verbales con expresiones matemáticas precisas.
explicacion_simple: Para expresar una fracción como operador sobre una cantidad, identificamos
  las letras que representan los números y usamos el símbolo matemático adecuado.
explicacion_formal: 'Sea $x, y \in \mathbb{R}$. La **Traducción de Una fracción como
  operador sobre una cantidad** establece la asignación:


  $$\text{"los tres cuartos de una cantidad x"} \implies (3/4)x$$


  > **Complemento didáctico:** Esta traducción permite formalizar algebraicamente
  enunciados verbales en el dominio real.'
definiciones_clave: '- **Una fracción como operador sobre una cantidad**: Representación
  simbólica en lenguaje algebraico.'
propiedades_relaciones: '- **Coherencia operacional**: (3/4)x conserva el significado
  semántico del enunciado.'
ejemplo_guiado:
  enunciado: 'Traduzca a lenguaje algebraico: ''los tres cuartos de una cantidad x''.'
  pasos:
  - 'Paso 1: Identificar las cantidades y variables.'
  - 'Paso 2: Aplicar la operación correspondiente.'
  - 'Conclusión: La expresión exacta es (3/4)x.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la representación algebraica de 'los tres cuartos de una cantidad
    x'?
  choices:
  - text: (3/4)x
    is_correct: true
  - text: x + 3/4
    is_correct: false
  - text: x - 3/4
    is_correct: false
  - text: 4x / 3
    is_correct: false
  explanation: La alternativa correcta es '(3/4)x'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'los tres cuartos de una cantidad x', ¿cuál
    fue la expresión obtenida?
  choices:
  - text: (3/4)x
    is_correct: true
  - text: x + 3/4
    is_correct: false
  - text: x - 3/4
    is_correct: false
  - text: 4x / 3
    is_correct: false
  explanation: La alternativa correcta es '(3/4)x'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado identificando variables.'
- 'Paso 2: Escribir los operadores correspondientes.'
- 'Paso 3: Verificar el resultado.'
errores_correccion: '- **Error 1: Invertir términos al traducir una fracción como
  operador sobre una cantidad.** **Cómo corregirlo:** Mantener el orden sintáctico
  adecuado de los operandos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se expresa algebraicamente 'los tres cuartos de una cantidad x'?
  alternativas:
  - (3/4)x
  - x + 3/4
  - x - 3/4
  - 4x / 3
  respuesta: (3/4)x
  solucion_pasos:
  - 1. Analizar las variables.
  - 2. Traducir al símbolo (3/4)x.
- titulo: Ejemplo 2
  enunciado: ¿Qué expresión traduce de forma correcta el enunciado de una fracción
    como operador sobre una cantidad 'los tres cuartos de una cantidad x'?
  alternativas:
  - (3/4)x
  - x + 3/4
  - x - 3/4
  - 4x / 3
  respuesta: (3/4)x
  solucion_pasos:
  - 1. Revisar la operación principal.
  - 2. Confirmar que la opción correcta es (3/4)x.
- titulo: ¿Representa (3/4)x el enunciado 'los tres cuartos de una cantidad x'?
  respuesta: Sí
  solucion_pasos:
  - Sí, coincide exactamente con el enunciado verbal.
- titulo: ¿Es la suma directa equivalente a (3/4)x?
  respuesta: 'No'
  solucion_pasos:
  - No, cada operador matemático tiene un significado único.
errores_frecuentes:
- Invertir el orden de los elementos al traducir la frase de una fracción como operador
  sobre una cantidad.
- Multiplicar en lugar de dividir o restar según corresponda en una fracción como
  operador sobre una cantidad.
- Representar la adición de términos mediante la elevación a exponentes en una fracción
  como operador sobre una cantidad.
- Reemplazar variables por valores constantes específicos sin razón lógica.
- Omitir delimitadores de agrupamiento en expresiones compuestas de una fracción como
  operador sobre una cantidad.
afirmaciones_verdaderas:
- La expresión (3/4)x representa la traducción fiel de una fracción como operador
  sobre una cantidad.
- Las variables permiten modelar cualquier caso en una fracción como operador sobre
  una cantidad.
al_terminar_debes_poder: Al terminar serás capaz de traducir enunciados sobre una
  fracción como operador sobre una cantidad construyendo la expresión algebraica (3/4)x
  de manera correcta.
