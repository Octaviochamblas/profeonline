semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.FRACCION_OPERADOR
resumen_inicial: 'La traducción de una fracción como operador sobre una cantidad consiste en representar simbólicamente la aplicación de una parte fraccionaria $\frac{p}{q}$ sobre un valor total mediante la multiplicación escalar $\frac{p}{q} \cdot x$.'
explicacion_simple: |
  Cuando aplicas una **fracción como operador** sobre una cantidad, estás calculando una "porción de un total":
  - En español, la clave verbal es la palabra **"DE"** o **"DEL"**:
    - *"Los tres cuartos **de** un número $x$"* $\implies \mathbf{\frac{3}{4} x}$ (multiplicar la fracción $\frac{3}{4}$ por $x$).
    - *"Las dos terceras partes **del** total $T$"* $\implies \mathbf{\frac{2}{3} T}$.
    - *"Los cinco octavos **de** la suma entre $a$ y $b$"* $\implies \mathbf{\frac{5}{8}(a + b)}$.
  - **¡Regla de oro!** En matemáticas, la palabra **"de" / "del"** entre una fracción y una cantidad equivale a una **MULTIPLICACIÓN ($\cdot$)**.
  - Para calcular el resultado numérico: multiplicas el numerador por la cantidad y divides entre el denominador (o viceversa).
explicacion_formal: |
  ### Definición formal
  La traducción de una **fracción como operador multiplicativo** mapea una cantidad total $x \in \mathbb{R}$ y una fracción irreducible $\frac{p}{q} \in \mathbb{Q}$ ($q \ge 2$) en el producto escalar parcial $O_{p/q}(x) \in \mathbb{R}[x]$:

  $$O_{p/q}(x) = \frac{p}{q} \cdot x = \frac{p \cdot x}{q}$$

  donde el denominador $q$ divide a la cantidad total en $q$ partes iguales y el numerador $p$ toma $p$ de esas partes.

  ### El Conector Verbal "de" como Operador Multiplicativo

  $$\Phi\left(\text{"} \frac{p}{q} \text{ de } x \text{"}\right) = \frac{p}{q} \cdot x$$

  ### Porcentaje como Fracción Operadora
  Todo porcentaje $P\%$ se traduce como la fracción de denominador $100$ actuando como operador sobre la cantidad $x$:

  $$P\% \text{ de } x = \frac{P}{100} \cdot x$$

  ### Síntesis didáctica
  La fracción como operador es el fundamento del cálculo de porcentajes, descuentos, aumentos proporcionales y fracciones de cantidades en problemas financieros.
definiciones_clave: |
  - **Fracción como operador**: Aplicación multiplicativa de una constante fraccionaria $\frac{p}{q}$ sobre una variable o cantidad total $x$.
  - **Conector verbal "de / del"**: Expresión lingüística que indica la operación de multiplicación entre la fracción y el total.
  - **Porcentaje como operador ($\frac{P}{100}$)**: Representación de una tasa centesimal como operador fraccionario.
propiedades_relaciones: |
  - **Asociatividad de operadores consecutivos**: "Los $\frac{2}{3}$ de los $\frac{3}{4}$ de $x$" $\implies \left(\frac{2}{3} \cdot \frac{3}{4}\right) x = \frac{6}{12} x = \frac{1}{2} x$.
  - **Fracción restante**: Si se toma la fracción $\frac{p}{q}$ de $x$, la cantidad que queda o resta es $\left(1 - \frac{p}{q}\right) x = \frac{q - p}{q} x$.
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "Los tres quintos del dinero de María ($m$) aumentados en el veinte por ciento del saldo de su cuenta ($s$)".'
  pasos:
    - 'Paso 1: Traducimos "Los tres quintos del dinero $m$": La palabra "del" multiplica $\implies \frac{3}{5} m$.'
    - 'Paso 2: Traducimos "el veinte por ciento del saldo $s$": Convertimos $20\%$ a fracción $\frac{20}{100} = \frac{1}{5}$ que multiplica a $s \implies \frac{1}{5} s$.'
    - 'Paso 3: Unimos ambas expresiones mediante el operador de adición "aumentados en" $\implies +$.'
    - 'Conclusión: La expresión traducida es **$\frac{3}{5} m + \frac{1}{5} s$** (o $\frac{3}{5}m + 0,2s$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué operación matemática traduce la palabra verbal "de" o "del" cuando se ubica entre una fracción $\frac{p}{q}$ y una cantidad $x$?'
    choices:
      - {text: 'Traduce la operación de multiplicación ($\cdot$) entre la fracción y la cantidad ($\frac{p}{q} \cdot x$)', is_correct: true}
      - {text: 'Traduce la operación de división ($/$) invirtiendo la fracción', is_correct: false}
      - {text: 'Traduce una resta entre la fracción y la cantidad', is_correct: false}
      - {text: 'Traduce una elevación a potencia de la cantidad', is_correct: false}
    explanation: 'La alternativa correcta es ''Traduce la operación de multiplicación ($\cdot$) entre la fracción y la cantidad ($\frac{p}{q} \cdot x$)''. "De" / "Del" es multiplicación.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en un problema se gasta la tercera parte ($\frac{1}{3}$) de un presupuesto $P$, ¿cuál es la expresión algebraicamente simplificada de lo que queda del presupuesto?'
    choices:
      - {text: 'Lo que queda se expresa como la fracción restante $\frac{2}{3}P$, obtenida de $\left(1 - \frac{1}{3}\right)P$', is_correct: true}
      - {text: 'Lo que queda se expresa como $\frac{1}{3}P$', is_correct: false}
      - {text: 'Lo que queda se expresa como $P - 3$', is_correct: false}
      - {text: 'Lo que queda se expresa como $3P$', is_correct: false}
    explanation: 'La alternativa correcta es ''Lo que queda se expresa como la fracción restante $\frac{2}{3}P$, obtenida de $\left(1 - \frac{1}{3}\right)P$''. Restante $1 - 1/3 = 2/3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la fracción o porcentaje que actúa como operador.'
  - 'Paso 2: Localizar la palabra conector "de" o "del".'
  - 'Paso 3: Identificar la cantidad o expresión total sobre la cual se aplica el operador.'
  - 'Paso 4: Escribir el producto de la fracción por la cantidad total $\frac{p}{q} \cdot x$.'
errores_correccion: |
  - **Error 1:** Sumar o restar la fracción a la cantidad en lugar de multiplicarla (escribir $x - \frac{3}{4}$ para "los tres cuartos de $x$"). **Cómo corregirlo:** La palabra "de" **significa MULTIPLICACIÓN ($\frac{3}{4}x$)**, no resta.
  - **Error 2:** Escribir el número entero $20x$ para el $20\%$ de $x$ en lugar de $\frac{20}{100}x$. **Cómo corregirlo:** El porcentaje exige **dividir por 100 ($\frac{20}{100}x = \frac{1}{5}x = 0,2x$)**.
ejemplos:
  - titulo: 'Fracción de una variable'
    enunciado: '¿Cuál es la traducción de "Los dos tercios de una cantidad $n$"?'
    alternativas:
      - '$\frac{2}{3}n$'
      - '$\frac{2}{3} + n$'
      - '$\frac{n}{2/3}$'
    respuesta: '$\frac{2}{3}n$'
    solucion_pasos:
      - '1. Operador fraccionario: $\frac{2}{3}$.'
      - '2. Palabra "de": multiplicación.'
      - '3. Resultado: $\frac{2}{3}n$.'
  - titulo: 'Porcentaje de una variable'
    enunciado: '¿Cuál es la traducción del "15% de una masa $m$"?'
    alternativas:
      - '$\frac{15}{100}m = 0,15m$'
      - '$15m$'
      - '$m + 15$'
    respuesta: '$\frac{15}{100}m = 0,15m$'
    solucion_pasos:
      - '1. $15\% = \frac{15}{100} = 0,15$.'
      - '2. Multiplica a $m \implies 0,15m$.'
  - titulo: 'Fracción de fracción'
    enunciado: '¿Es la traducción de "La mitad de la tercera parte de $x$" equivalente a $\frac{1}{6}x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{1}{2} \cdot \frac{1}{3} \cdot x = \frac{1}{6}x$.'
  - titulo: 'Fracción de una suma'
    enunciado: 'La frase "Los tres cuartos de la suma entre $a$ y $b$", ¿se traduce como $\frac{3}{4}(a + b)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{3}{4}$ multiplica a toda la suma $(a+b)$.'
errores_frecuentes:
  - 'Sumar la fracción a la cantidad total en lugar de multiplicarla al traducir los tres cuartos de x.'
  - 'Escribir el porcentaje directo 20x al traducir el 20 por ciento de una cantidad sin dividir entre cien.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intercambiar la fracción restante con la fracción consumida en problemas de aplicación.'
  - 'Los paréntesis no se incluyen al aplicar una fracción como operador sobre una suma de variables.'
afirmaciones_verdaderas:
  - 'El conector verbal "de" o "del" entre una fracción y una cantidad indica la operación de multiplicación.'
  - 'Un porcentaje P% actuando sobre una cantidad x equivale a la fracción (P/100) multiplicada por x.'
al_terminar_debes_poder: 'Traducir la aplicación de fracciones y porcentajes como operadores sobre cantidades multiplicando la fracción por el total.'
