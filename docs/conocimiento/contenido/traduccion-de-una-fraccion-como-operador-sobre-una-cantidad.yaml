semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.FRACCION_OPERADOR
resumen_inicial: 'Traducción de una fracción como operador sobre una cantidad: traducción,
  reglas y aplicación práctica en Lenguaje algebraico: operaciones y múltiplos.'
explicacion_simple: ¿Qué ocurre si no quiero la cantidad entera, sino solo un pedazo
  proporcional de ella? Cuando operamos con partes o rebanadas de variables, las fracciones
  entran a dominar el juego.
explicacion_formal: "### Definición formal\n\nSacarle la proporción a algo (el 'DE'\
  \ algo) es multiplicarlo por esa fracción. $\\frac{3}{4}$ 'de' $x$ es $\\frac{3}{4}\
  \ \\cdot x$.\n\n### Desarrollo didáctico\n\nPalabras clave:\n- La mitad de: $\\\
  frac{1}{2}x$ o $\\frac{x}{2}$\n- La tercera parte de: $\\frac{1}{3}y$ o $\\frac{y}{3}$\n\
  - La cuarta parte de: $\\frac{z}{4}$\n- Los dos tercios de: $\\frac{2}{3}x$ o $\\\
  frac{2x}{3}$\n\nLa palabra **DE** en matemáticas de proporciones significa **multiplicación**.\
  \ \n'Los tres cuartos DE un número' es $\\frac{3}{4} \\cdot x$. Que por regla de\
  \ fracciones se fusiona hermosamente en $\\frac{3x}{4}$."
definiciones_clave: '- **Traducción de una fracción como operador sobre una cantidad**:
  Herramienta clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de una fracción como operador sobre una cantidad.'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de traducción
    de una fracción como operador sobre una cantidad.
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a traducción de una fracción
    como operador sobre una cantidad.
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
