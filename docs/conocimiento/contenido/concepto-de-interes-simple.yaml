procedimiento:
- 'Paso 1: Entiende que la base de cálculo (el Capital Inicial) en el interés simple
  nunca cambia.'
- 'Paso 2: Reconoce que el crecimiento de la deuda es constante y lineal.'
- 'Paso 3: Diferéncialo del interés compuesto, donde la base de cálculo crece exponencialmente.'
errores_correccion: Evita confundir los datos de entrada al operar con concepto de
  interés simple.
ejemplos:
- titulo: Comparando el simple con la realidad
  enunciado: Si presto $1.000 con interés simple de 10% mensual, ¿cuánto dinero en
    intereses genero cada mes?
  solucion_pasos:
  - El 10% de 1.000 es 100.
  - El mes 1 genero $100.
  - El mes 2 genero otros $100.
  - El mes 3 genero otros $100. Es constante.
errores_frecuentes:
- Confundir el Interés Simple con el Compuesto (creyendo que el mes 2 se calcula el
  10% sobre 1.100).
- Pensar que los bancos usan Interés Simple para los hipotecarios (los bancos usan
  compuesto para maximizar las ganancias).
afirmaciones_verdaderas:
- La propiedad de concepto de interés simple preserva la consistencia lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren concepto de
