semantic_id: MAT.NUM.INTERES_SIMPLE.CONCEPTO
resumen_inicial: 'El interés simple es la ganancia o costo financiero generado por un capital inicial $C$, calculado sobre la misma suma original constante durante cada período de tiempo: $I = C \cdot i \cdot t$.'
explicacion_simple: |
  Imagínate que le prestas $\$100.000$ a un amigo con la condición de que te pague un $10\%$ de interés anual durante 3 años.
  - El primer año ganas el $10\%$ de $\$100.000 = $\$10.00$0$.
  - El segundo año ganas de nuevo el $10\%$ de $\$100.000 = $\$10.00$0$.
  - El tercer año vuelves a ganar el $10\%$ de $\$100.000 = $\$10.00$0$.

  Al final de los 3 años ganaste $\$30.000$ de interés. En el **interés simple**, la ganancia de cada año **NUNCA se suma al capital para generar nuevos intereses**; siempre se calcula sobre los $\$100.000$ iniciales.

  ![Concepto de interés simple](/static/img/nodos/concepto-de-interes-simple-intro.svg)
explicacion_formal: |
  ### Definición formal
  El **interés simple** $I$ es la función lineal de tres variables $(C, i, t)$ que expresa el rendimiento o costo financiero generado cuando los intereses no se capitalizan (no devengan nuevos intereses):
  $$I(C, i, t) = C \cdot i \cdot t$$
  donde:
  - $C \in \mathbb{R}^+$ es el **capital inicial** (principal depositado o prestado).
  - $i \in \mathbb{R}^+$ es la **tasa de interés periódica** expresada en forma decimal ($i = r / 100$).
  - $t \in \mathbb{R}^+$ es el **número de períodos de tiempo** (años, meses, etc.).

  ### Condición de Homogeneización Temporal
  La tasa de interés $i$ y el tiempo $t$ **DEBEN estar expresados estrictamente en la misma unidad temporal**:
  - Tasa anual $\implies$ tiempo $t$ en años.
  - Tasa mensual $\implies$ tiempo $t$ en meses.

  ### Gráfica del crecimiento de la ganancia
  Dado que el capital $C$ y la tasa $i$ son constantes, el interés $I(t)$ crece de manera estrictamente lineal respecto al tiempo $t$ con pendiente constante $m = C \cdot i$.

  ### Síntesis didáctica
  - Ecuación del interés acumulado: $I = C \cdot i \cdot t$.
  - Principio fundamental: Los intereses no se reinvierten (capital constante).
definiciones_clave: |
  - **Capital inicial ($C$)**: Cantidad de dinero depositada, invertida o solicitada en préstamo originalmente.
  - **Tasa de interés ($i$)**: Porcentaje del capital que se cobra o rinde en un período de tiempo determinado ($i = r\%$).
  - **No capitalización**: Regla según la cual los intereses generados en un período no se adicionan al capital para el cálculo de intereses futuros.
propiedades_relaciones: |
  - **Proporcionalidad lineal directa**: El interés acumulado $I$ es directamente proporcional a cada uno de sus tres factores: si el capital se duplica, el interés se duplica; si el tiempo se triplica, el interés se triplica.
  - **Constancia del interés periódico**: El rendimiento obtenido en el período 1 es exactamente igual al obtenido en cualquier otro período $k$.
ejemplo_guiado:
  enunciado: 'Un depósito de $\$200.000$ se coloca en un banco a una tasa de interés simple anual del $5\%$ durante $4$ años. Calcula el interés total generado.'
  imagen: '/static/img/nodos/concepto-de-interes-simple-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos las variables: Capital $C = 200.000$, Tasa anual $r = 5\% \implies i = 0,05$, Tiempo $t = 4\text{ años}$.'
    - 'Paso 2: Comprobamos la homogeneidad: La tasa es anual y el tiempo está en años.'
    - 'Paso 3: Aplicamos la fórmula del interés simple: $I = C \cdot i \cdot t = 200.000 \cdot 0,05 \cdot 4$.'
    - 'Paso 4: Multiplicamos: $200.000 \cdot 0,20 = 40.000$. El interés generado es de **$\$40.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la característica distintiva del interés simple respecto a los rendimientos periódicos?'
    choices:
      - {text: 'El interés de cada período se calcula siempre sobre el capital inicial constante', is_correct: true}
      - {text: 'El interés ganado se suma al capital cada año para generar nuevos intereses', is_correct: false}
      - {text: 'La tasa de interés aumenta progresivamente en cada período', is_correct: false}
      - {text: 'El capital inicial disminuye automáticamente con el paso del tiempo', is_correct: false}
    explanation: 'La alternativa correcta es ''El interés de cada período se calcula siempre sobre el capital inicial constante''. En el régimen simple los rendimientos nunca se capitalizan.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se invierten $\$50.000$ al $6\%$ anual de interés simple durante $2$ años, ¿cuánto interés se acumula?'
    choices:
      - {text: '$\$6.000$, multiplicando $50.000 \cdot 0,06 \cdot 2 = 6.000$', is_correct: true}
      - {text: '$\$3.000$, calculando solo un año', is_correct: false}
      - {text: '$\$12.000$, multiplicando por 4', is_correct: false}
      - {text: '$\$56.000$, sumando el capital inicial', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$6.000$, multiplicando $50.000 \cdot 0,06 \cdot 2 = 6.000$''. Aplicando $I = C \cdot i \cdot t$ obtenemos $\$6.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el capital inicial $C$, la tasa de interés $r\%$ y el período de tiempo $t$.'
  - 'Paso 2: Convertir la tasa porcentual a decimal ($i = r / 100$).'
  - 'Paso 3: Asegurarse de que las unidades de tiempo de la tasa $i$ y del tiempo $t$ coincidan.'
  - 'Paso 4: Multiplicar los tres factores $I = C \cdot i \cdot t$.'
errores_correccion: |
  - **Error 1:** Sumar los intereses al capital al término de cada año en lugar de mantener el capital constante. **Cómo corregirlo:** La adición de intereses al capital corresponde a interés compuesto; en **interés simple el capital $C$ no cambia jamás**.
  - **Error 2:** Usar el tiempo en meses cuando la tasa está dada en años sin convertir las unidades. **Cómo corregirlo:** Si la tasa es anual y el tiempo está en meses $m$, convierte el tiempo a años dividiendo por 12 (**$t = m / 12$**).
ejemplos:
  - titulo: 'Cálculo básico de interés anual'
    enunciado: '¿Cuál es el interés simple generado por un capital de $\$100.000$ colocado al $10\%$ anual durante $3$ años?'
    alternativas:
      - '$\$30.000$'
      - '$\$33.100$'
      - '$\$10.000$'
    respuesta: '$\$30.000$'
    solucion_pasos:
      - '1. Identificamos $C = 100.000$, $i = 0,10$ y $t = 3$.'
      - '2. Aplicamos la fórmula: $I = 100.000 \cdot 0,10 \cdot 3 = $\$30.00$0$.'
  - titulo: 'Interés en período semestral'
    enunciado: '¿El interés simple generado en 1 año al $4\%$ semestral ($2$ semestres) sobre $\$50.000$ es $\$4.000$?'
    alternativas:
      - 'Sí, pues $50.000 \cdot 0,04 \cdot 2 = $\$4.00$0$'
      - 'No, es $\$2.000$'
      - 'No, es $\$8.000$'
    respuesta: 'Sí, pues $50.000 \cdot 0,04 \cdot 2 = $\$4.00$0$'
    solucion_pasos:
      - '1. Un año tiene 2 semestres ($t = 2$).'
      - '2. $I = 50.000 \cdot 0,04 \cdot 2 = $\$4.00$0$.'
  - titulo: 'Interés proporcional a 6 meses'
    enunciado: 'Al $12\%$ anual, ¿cuánto interés simple generan $\$80.000$ en 6 meses ($0,5$ años)?'
    alternativas:
      - '$\$4.800$'
      - '$\$9.600$'
      - '$\$48.000$'
    respuesta: '$\$4.800$'
    solucion_pasos:
      - '1. Convertimos el plazo a años: $t = 6/12 = 0,5\text{ años}$.'
      - '2. $I = 80.000 \cdot 0,12 \cdot 0,5 = $\$4.80$0$.'
  - titulo: 'Comparación de rendimiento'
    enunciado: '¿Duplicar el tiempo de inversión en interés simple duplica exactamente la ganancia en intereses?'
    alternativas:
      - 'Sí, debido a la proporcionalidad lineal directa $I \propto t$'
      - 'No, la ganancia se cuadruplica'
      - 'No, la ganancia permanece idéntica'
    respuesta: 'Sí, debido a la proporcionalidad lineal directa $I \propto t$'
    solucion_pasos:
      - '1. La fórmula $I = C \cdot i \cdot t$ muestra una relación lineal con $t$.'
      - '2. Al multiplicar el tiempo por 2, el interés se multiplica exactamente por 2.'
errores_frecuentes:
  - 'Los intereses generados en cada período se suman al capital inicial para calcular los intereses del período siguiente.'
  - 'Una tasa de interés anual se multiplica directamente por un plazo en meses sin realizar la conversión temporal.'
  - 'La tasa de interés porcentual $r\%$ se introduce como número entero directo en la fórmula sin dividir por $100$.'
  - 'La cantidad acumulada de interés simple varía de forma exponencial respecto al tiempo transcurrido.'
  - 'El valor numérico del interés devengado $I$ es idéntico al monto final total acumulado $M$.'
afirmaciones_verdaderas:
  - 'El interés simple se calcula exclusivamente sobre el capital inicial constante mediante la fórmula $I = C \cdot i \cdot t$.'
  - 'La tasa de interés y el período de tiempo deben expresarse en la misma unidad temporal antes de efectuar el producto.'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/concepto-de-interes-simple-resumen.svg)

  QUÉ: Definir y calcular el interés simple acumulado identificando el capital constante y la no capitalización de ganancias periódicas.
  CÓMO: Aplicar la relación lineal fundamental $I = C \cdot i \cdot t = C \cdot \left(\frac{r}{100}\right) \cdot t$, garantizando la estricta homogeneización de las unidades temporales de la tasa periódica y el plazo.
