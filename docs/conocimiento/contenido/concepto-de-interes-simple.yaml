procedimiento:
- 'Paso 1: Entiende que la base de cálculo (el Capital Inicial) en el interés simple nunca
  cambia.'
- 'Paso 2: Reconoce que el crecimiento de la deuda es constante y lineal.'
- 'Paso 3: Diferéncialo del interés compuesto, donde la base de cálculo crece exponencialmente.'
errores_correccion: Evita confundir los datos de entrada al operar con concepto de interés
  simple.
ejemplos:
- titulo: Comparando el simple con la realidad
  enunciado: Si presto $1.000 con interés simple de 10% mensual, ¿cuánto dinero en intereses
    genero cada mes?
  solucion_pasos:
  - El 10% de 1.000 es 100.
  - El mes 1 genero $100.
  - El mes 2 genero otros $100.
  - El mes 3 genero otros $100. Es constante.
- titulo: Ejemplo 2
  enunciado: Con capital de 500.000 pesos e interés simple del 6% anual, ¿cuánto interés se
    genera cada año?
  alternativas:
  - '30.000'
  - 33.000 el segundo año
  - '3.000'
  respuesta: '30.000'
  solucion_pasos:
  - 500.000 por 0,06 es igual a 30.000, y es igual todos los años.
- titulo: ¿En el interés simple, el interés del segundo año es mayor que el del primero?
  respuesta: 'No'
  solucion_pasos:
  - El interés simple siempre se calcula sobre el mismo capital inicial, por lo tanto es constante.
- titulo: ¿El interés simple representa un crecimiento lineal en el tiempo?
  respuesta: Sí
  solucion_pasos:
  - Porque el monto total aumenta la misma cantidad fija cada periodo.
errores_frecuentes:
- Confundir el Interés Simple con el Compuesto (creyendo que el mes 2 se calcula el 10% sobre
  1.100).
- Pensar que los bancos usan Interés Simple para los hipotecarios (los bancos usan compuesto
  para maximizar las ganancias).
- Confundir el interés simple con el compuesto, creyendo que el segundo año se calcula sobre
  el capital más el interés del primer año.
- Pensar que los bancos siempre usan interés simple para préstamos hipotecarios, cuando en
  realidad usan interés compuesto.
- Creer que el interés simple crece exponencialmente igual que el compuesto.
afirmaciones_verdaderas:
- La propiedad de concepto de interés simple preserva la consistencia lógica.
- En el interés simple, el capital sobre el cual se calcula el interés nunca cambia, a diferencia
  del interés compuesto.
al_terminar_debes_poder: Resolver problemas aplicados que involucren concepto de interés simple.
