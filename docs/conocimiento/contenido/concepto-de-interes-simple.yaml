resumen_inicial: 'El interés simple es el rendimiento financiero generado cuando los
  intereses ganados en cada período se calculan única y exclusivamente sobre el capital
  inicial original $C$, permaneciendo constantes en el tiempo: $I = C \cdot i \cdot
  t$.'
explicacion_simple: En el interés simple, la ganancia o interés de cada período (mes
  o año) es siempre fija y no cambia. Esto ocurre porque los intereses producidos
  no se suman al dinero inicial para generar nuevos intereses, sino que se calculan
  siempre sobre el monto que pusiste al principio.
explicacion_formal: 'Para un capital inicial $C > 0$, una tasa de interés periódica
  $i = \frac{r}{100}$ y una cantidad de períodos $t$ expresados en la misma unidad
  temporal que la tasa, el **Interés Simple $I$** se define mediante la función lineal
  de crecimiento:


  $$I(t) = C \cdot i \cdot t = C \cdot \left(\frac{r}{100}\right) \cdot t$$


  **Propiedad de constancia periódica:**

  - El interés generado en cualquier período individual $k$ es invariante: $I_k =
  C \cdot i$.'
definiciones_clave: '- **Interés simple**: Modelo de rendimiento lineal $I = C \cdot
  i \cdot t$ calculado sobre el capital inicial fijo.'
propiedades_relaciones: '- **Crecimiento lineal constante**: Los intereses producidos
  en cada unidad de tiempo son idénticos.'
ejemplo_guiado:
  enunciado: Explique el comportamiento de una inversión de \$100.000 al $5\%$ de
    interés simple anual durante $3$ años.
  pasos:
  - 'Paso 1: Calcular la ganancia de $1$ año: $100.000 \cdot 0,05 = 5.000$.'
  - 'Paso 2: Como es interés simple, en el año $2$ y año $3$ la ganancia sigue siendo
    \$5.000 por año.'
  - 'Paso 3: Calcular el interés total de $3$ años: $I = 5.000 \cdot 3 = 15.000$.'
  - 'Conclusión: La ganancia total es \$15.000 (constante a \$5.000 por año).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Sobre qué valor se calculan siempre los intereses en el régimen de interés
    simple?
  choices:
  - text: Exclusivamente sobre el capital inicial original C
    is_correct: true
  - text: Sobre el monto acumulado del período anterior
    is_correct: false
  - text: Sobre el interés del primer mes
    is_correct: false
  - text: Sobre la tasa dividida por 100
    is_correct: false
  explanation: La alternativa correcta es 'Exclusivamente sobre el capital inicial
    original C'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $100.000 al 5% simple durante 3 años, ¿cuál
    fue el interés acumulado total?
  choices:
  - text: 15.000 $ (5.000 $ por año)
    is_correct: true
  - text: 5.000 $
    is_correct: false
  - text: 15.762 $
    is_correct: false
  - text: 30.000 $
    is_correct: false
  explanation: La alternativa correcta es '15.000 $ (5.000 $ por año)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir y explicar el modelo de
  interés simple $I = C \cdot i \cdot t$ caracterizado por su ganancia periódica constante.
semantic_id: MAT.NUM.INTERES_SIMPLE.CONCEPTO
procedimiento:
- 'Paso 1: Identificar los parámetros conocidos ($C, i, t, I, M$) e igualar las unidades
  de tiempo de la tasa y el plazo.'
- 'Paso 2: Sustituir en la fórmula fundamental del interés simple $I = C \cdot i \cdot
  t$ o del monto $M = C \cdot (1 + i \cdot t)$.'
- 'Paso 3: Despejar algebraicamente la variable buscada y comprobar el resultado numérico.'
errores_correccion: '- **Error 1: Ingresar el tiempo en meses cuando la tasa de interés
  es anual sin convertir unidades.** **Cómo corregirlo:** Se DEBE convertir el tiempo
  a años dividiendo entre 12 ($18\text{ meses} = 1,5\text{ años}$) o convertir la
  tasa anual a mensual dividiendo entre 12.


  - **Error 2: Sumar los intereses acumulados al capital inicial en cada período (tratarlo
  como interés compuesto).** **Cómo corregirlo:** En el interés simple el capital
  inicial $C$ permanece CONSTANTE en todos los períodos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_SIMPLE.CONCEPTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés simple.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización lineal.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por $M = C(1 + it)$.
- titulo: ¿Son idénticos los intereses ganados en cada período en el interés simple?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se calculan siempre sobre el mismo capital inicial $C$.
- titulo: ¿Debe coincidir la unidad de tiempo del plazo t con la unidad de la tasa
    de interés i?
  respuesta: Sí
  solucion_pasos:
  - Sí, para mantener la homogeneidad dimensional temporal.
errores_frecuentes:
- Ingresar el tiempo en meses manteniendo una tasa de interés expresada en términos
  anuales.
- Recapitalizar los intereses ganados al final de cada período sobre el capital inicial
  en régimen simple.
- Multiplicar por el número entero de la tasa de interés sin dividir previamente por
  cien.
- Declarar el valor del interés ganado $I$ con el monto final total acumulado $M$.
- Dividir el capital entre el tiempo sin incorporar la tasa de interés en el cálculo
  del saldo.
afirmaciones_verdaderas:
- El interés simple se caracteriza por generar ganancias periódicas constantes calculadas
  sobre el capital inicial $C$.
- El monto acumulado final en interés simple es una función lineal del tiempo $M =
  C \cdot (1 + i \cdot t)$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
