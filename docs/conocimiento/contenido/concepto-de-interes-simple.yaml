semantic_id: MAT.NUM.INTERES_SIMPLE.CONCEPTO
resumen_inicial: 'Concepto de interés simple: concepto y propiedades fundamentales
  en Interés simple.'
explicacion_simple: Si un amigo te presta dinero, quizás no te cobre extra. Pero los
  bancos no son tus amigos. Al prestarte dinero, te cobran un 'arriendo' por usarlo.
  Ese arriendo se llama interés.
explicacion_formal: 'El **Interés** es el porcentaje adicional que pagas por un préstamo
  o que ganas por una inversión.

  Existen dos grandes mundos:

  - **Interés Simple:** El interés se calcula siempre sobre el capital inicial. No
  varía de periodo en periodo. Es una relación lineal. (Se usa para préstamos a muy
  corto plazo).

  - **Interés Compuesto:** El interés de cada mes se suma al capital, y el nuevo mes
  se calcula sobre ese monto mayor (interés sobre interés). Se usa en los bancos y
  a largo plazo.


  En el Interés Simple, si el capital es $\$10.000$ y el interés es $10\%$ anual,
  cada año pagarás exactamente $\$1.000$ extra. No importa si pasaron 1 o 5 años,
  la cuota de interés es fija.'
definiciones_clave: '- **Concepto de interés simple**: Elemento central dentro del
  estudio de Interés simple.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a concepto de interés simple.'
