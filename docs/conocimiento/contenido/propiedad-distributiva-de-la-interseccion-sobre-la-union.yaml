errores_frecuentes:
- La afirmación de que $A \cap (B \cup C)$ es igual a $(A \cap B) \cap (A \cap C)$.
- La afirmación de que la intersección no puede distribuirse sobre la unión si los conjuntos son disjuntos.
- La afirmación de que $(A \cap B) \cup (A \cap B^c)$ produce el conjunto vacío.
- La afirmación de que la propiedad distributiva altera la pertenencia original de los elementos.
- La afirmación de que la distributividad de la intersección es idéntica a la propiedad asociativa.
afirmaciones_verdaderas:
- La intersección de conjuntos distribuye sobre la unión según la ley $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$.
- La demostración formal de esta propiedad se sustenta en la equivalencia lógica $P \land (Q \lor R) \equiv (P \land Q) \lor (P \land R)$.
al_terminar_debes_poder: 'QUÉ: Enunciar, demostrar y aplicar la propiedad distributiva de la intersección sobre la unión ($A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$).

  CÓMO: Expandir y factorizar expresiones conjuntistas aplicando la ley lógica $P \land (Q \lor R) \equiv (P \land Q) \lor (P \land R)$ y simplificar con identidades booleanas.


