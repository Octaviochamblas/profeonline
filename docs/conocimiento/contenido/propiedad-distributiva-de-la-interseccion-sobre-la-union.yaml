semantic_id: MAT.FUND.PROPIEDADES_CONJUNTOS.DISTRIBUTIVA_INTERSECCION_SOBRE_UNION
resumen_inicial: 'Demostración lógica, propiedades y aplicación de la propiedad distributiva de la intersección sobre la unión: $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$.'
explicacion_simple: 'La **propiedad distributiva de la intersección sobre la unión** establece que el conjunto $A$ "se distribuye" con la intersección $\cap$ hacia cada elemento de la unión:

  $$A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$$

  Esto significa que intersectar $A$ con la unión de $B$ y $C$ es exactamente lo mismo que intersectar $A$ con $B$, intersectar $A$ con $C$, y luego juntar o unir ambos resultados. Es análoga a la clásica multiplicación sobre la suma en álgebra: $a \cdot (b + c) = a \cdot b + a \cdot c$.


  ![propiedad-distributiva-de-la-interseccion-sobre-la-union](/static/img/nodos/propiedad-distributiva-de-la-interseccion-sobre-la-union-intro.svg)'
explicacion_formal: '### Definición formal

  En la teoría de conjuntos y el retículo distributivo $(\mathcal{P}(\mathcal{U}), \cup, \cap)$, la intersección distribuye sobre la unión:

  $$\forall A, B, C \subseteq \mathcal{U}, \quad A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$$

  Demostración formal basada en la distributividad lógica de la conjunción sobre la disyunción ($\land$ sobre $\lor$):

  $$x \in (A \cap (B \cup C)) \iff x \in A \land (x \in B \lor x \in C) \iff (x \in A \land x \in B) \lor (x \in A \land x \in C) \iff x \in ((A \cap B) \cup (A \cap C))$$

  Por el axioma de extensionalidad, se concluye la identidad conjuntista.


  ### Desglose simbólico

  - Ley lógica subyacente: $P \land (Q \lor R) \equiv (P \land Q) \lor (P \land R)$.

  - Extensión a uniones generalizadas: $A \cap \left(\bigcup_{i \in I} B_i\right) = \bigcup_{i \in I} (A \cap B_i)$.

  - Cálculo de probabilidades: $P(A \cap (B \cup C)) = P((A \cap B) \cup (A \cap C))$.


  ### Síntesis didáctica

  Esta propiedad permite descomponer la intersección de un conjunto con una estructura compuesta en partes más sencillas y analizables de forma independiente.

  '
definiciones_clave: '- **Distributividad de la intersección sobre la unión**: Expansión $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$.

  - **Factorización por intersección**: Proceso inverso $(A \cap B) \cup (A \cap C) = A \cap (B \cup C)$.

  - **Tautología de conjunción distributiva**: Equivalencia $P \land (Q \lor R) \equiv (P \land Q) \lor (P \land R)$.

  '
propiedades_relaciones: '- **Simplificación con complementos**: $(A \cap B) \cup (A \cap B^c) = A \cap (B \cup B^c) = A \cap \mathcal{U} = A$.

  - **Conjuntos disjuntos**: Si $A \cap B = \emptyset$ y $A \cap C = \emptyset$, entonces $A \cap (B \cup C) = \emptyset \cup \emptyset = \emptyset$.

  '
ejemplo_guiado:
  enunciado: 'Dados $A = \{2, 4, 6\}$, $B = \{1, 2, 3\}$ y $C = \{3, 4, 5\}$, demuestra por extensión que $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$.


    ![Ejemplo propiedad-distributiva-de-la-interseccion-sobre-la-union](/static/img/nodos/propiedad-distributiva-de-la-interseccion-sobre-la-union-ejemplos.svg)'
  pasos:
  - 'Paso 1: Resolver el lado izquierdo $A \cap (B \cup C)$: - Calcular la unión: $B \cup C = \{1, 2, 3\} \cup \{3, 4, 5\} = \{1, 2, 3, 4, 5\}$. - Intersectar con $A$: $A \cap (B \cup C) = \{2, 4, 6\} \cap \{1, 2, 3, 4, 5\} = \{2, 4\}$.'
  - 'Paso 2: Resolver el lado derecho $(A \cap B) \cup (A \cap C)$: - Primera intersección: $A \cap B = \{2, 4, 6\} \cap \{1, 2, 3\} = \{2\}$. - Segunda intersección: $A \cap C = \{2, 4, 6\} \cap \{3, 4, 5\} = \{4\}$. - Unir ambas intersecciones: $(A \cap B) \cup (A \cap C) = \{2\} \cup \{4\} = \{2, 4\}$.'
  - 'Paso 3: Comparar ambos resultados: $\{2, 4\} = \{2, 4\}$.'
  - 'Paso 4: Concluir formalmente que $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale de forma factorizada la expresión $(A \cap B) \cup (A \cap C)$?
  choices:
  - text: $A \cap (B \cup C)$
    is_correct: true
  - text: $A \cup (B \cap C)$
    is_correct: false
  - text: $(A \cup B) \cap C$
    is_correct: false
  - text: $A \cap B \cap C$
    is_correct: false
  explanation: La alternativa correcta es '$A \cap (B \cup C)$'. Se extrae el factor común $A \cap$ quedando la unión de $B$ y $C$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de simplificar la expresión $(X \cap Y) \cup (X \cap Y^c)$?
  choices:
  - text: $X$
    is_correct: true
  - text: $Y$
    is_correct: false
  - text: $\emptyset$
    is_correct: false
  - text: $\mathcal{U}$
    is_correct: false
  explanation: 'La alternativa correcta es ''$X$''. Factorizando: $X \cap (Y \cup Y^c) = X \cap \mathcal{U} = X$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el conjunto exterior $A$ y el operador $\cap$ que antecede a la unión $(B \cup C)$.'
- 'Paso 2: Distribuir la intersección con $A$ hacia $B$ y hacia $C$: $(A \cap B)$ y $(A \cap C)$.'
- 'Paso 3: Unir ambos resultados con el operador $\cup$ intermedio.'
- 'Paso 4: Para factorizar, detectar el término repetido $A \cap$ y extraerlo fuera de la unión $(B \cup C)$.'
errores_correccion: '- **Error 1:** Confundir la distributiva de la intersección con la asociativa. **Cómo corregirlo:** La distributiva mezcla dos operadores distintos ($\cap$ afuera y $\cup$ adentro); la asociativa tiene el mismo operador en toda la expresión.

  - **Error 2:** Olvidar que la unión $Y \cup Y^c = \mathcal{U}$ permite simplificar factorizaciones a $X \cap \mathcal{U} = X$. **Cómo corregirlo:** Aplicar la ley del tercero excluido para sustituir $Y \cup Y^c$ por el universo referencial.

  '
ejemplos:
- titulo: Distribución con conjuntos de números
  enunciado: Dado $A = \{1, 3\}$, $B = \{2\}$, $C = \{3\}$, halla $(A \cap B) \cup (A \cap C)$.
  alternativas:
  - $\{3\}$
  - $\{1, 3\}$
  - $\emptyset$
  respuesta: $\{3\}$
  solucion_pasos:
  - 1. $A \cap B = \emptyset$.
  - 2. $A \cap C = \{3\}$.
  - 3. $\emptyset \cup \{3\} = \{3\}$.
- titulo: Factorización con partición
  enunciado: Si $\{B_1, B_2\}$ es partición de $\mathcal{U}$, ¿a qué es igual $(A \cap B_1) \cup (A \cap B_2)$?
  respuesta: $A$
  solucion_pasos:
  - $A \cap (B_1 \cup B_2) = A \cap \mathcal{U} = A$.
  alternativas:
  - texto: $A$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
- titulo: Intersección con unión vacía
  enunciado: ¿$A \cap (B \cup \emptyset)$ a qué equivale?
  respuesta: $A \cap B$
  solucion_pasos:
  - $A \cap B \cup (A \cap \emptyset) = (A \cap B) \cup \emptyset = A \cap B$.
  alternativas:
  - texto: $A \cap B$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
- titulo: Descomposición en diagramas de Venn
  enunciado: ¿Qué regiones sombrea $(A \cap B) \cup (A \cap C)$?
  respuesta: Las zonas de $A$ solapadas con $B$ y con $C$
  solucion_pasos:
  - Representa la porción de $A$ que comparte elementos con $B$ o con $C$.
  alternativas:
