semantic_id: MAT.ALG.ECUACIONES_LITERALES.ERROR_DESPEJE
resumen_inicial: Omitir la distribución de términos o dividir prematuramente son los
  errores principales al despejar en ecuaciones literales.
explicacion_simple: 'Al despejar fórmulas o ecuaciones literales es muy fácil cometer
  distracciones algebraicas.

  Los errores más comunes son:

  1. Trasponer un parámetro restando cuando estaba multiplicando.

  2. No colocar paréntesis al trasponer un divisor a multiplicar todo el otro miembro.

  Detectar estas inconsistencias analizando paso a paso la transposición asegura un
  despeje correcto.'
explicacion_formal: 'Dada la fórmula $A = \frac{b + c}{2 h}$, se comparan el **despeje
  erróneo** y el **despeje correcto** de $c$:


  $$\text{Error: } c = 2 A h + b \quad \neq \quad \text{Correcto: } c = 2 A h - b$$


  **Desglose de la fórmula:**

  - Paso 1: $2 A h = b + c$.

  - Paso 2: $c = 2 A h - b$ (el término $+b$ pasa restando al miembro opuesto).'
definiciones_clave: '- **Error de despeje**: Fallo operativo en la aplicación de transposición
  de términos en ecuaciones literales.

  - **Verificación dimensional de despeje**: Comprobación del orden y signo de los
  parámetros en el resultado.'
propiedades_relaciones: '- **Sustitución de prueba**: Asignar valores numéricos simples
  a los parámetros permite comprobar si el despeje es correcto.'
ejemplo_guiado:
  enunciado: 'Analiza la fórmula $P = 2a + 2b$. Detecta el error en la propuesta de
    despeje de $a$: $a = \frac{P + 2b}{2}$, corrígela y evalúa la fórmula correcta
    para $P = 20, b = 4$.'
  pasos:
  - 'Paso 1: Identificar el error: La propuesta sumó $+2b$ en vez de restarlo al trasponerlo
    al primer miembro.Paso 2: Corregir el despeje de $2a$: $P - 2b = 2a$.Paso 3: Trasponer
    $2$ dividiendo: $a = \frac{P - 2b}{2}$.Paso 4: Evaluar para $P = 20, b = 4$: $a
    = \frac{20 - 2(4)}{2} = \frac{20 - 8}{2} = \frac{12}{2} = 6$.Paso 5: Comprobar
    en la fórmula inicial: $P = 2(6) + 2(4) = 12 + 8 = 20$ (se verifica).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula correcta para despejar $a$ en $P = 2a + 2b$?
  choices:
  - text: $a = \frac{P - 2b}{2}$
    is_correct: true
  - text: $a = \frac{P + 2b}{2}$
    is_correct: false
  - text: $a = 2P - 2b$
    is_correct: false
  - text: $a = \frac{P}{2} - b$
    is_correct: false
  explanation: La alternativa correcta es '$a = \frac{P - 2b}{2}$' (que también se
    puede escribir como $\frac{P}{2} - b$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar el despeje correcto $a = \frac{P - 2b}{2}$ para $P = 20$ y
    $b = 4$, ¿cuál es el valor de $a$?
  choices:
  - text: $a = 6$
    is_correct: true
  - text: $a = 14$
    is_correct: false
  - text: $a = 8$
    is_correct: false
  - text: $a = 12$
    is_correct: false
  explanation: La alternativa correcta es '$a = 6$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la fórmula original.'
- 'Paso 2: Identificar cada paso de transposición verificando la inversión de operaciones.'
- 'Paso 3: Asignar números sencillos de prueba a los parámetros para verificar numéricamente
  el despeje.'
- 'Paso 4: Presentar la versión corregida.'
errores_correccion: '- **Error común:** Cambiar el signo del parámetro al pasar a
  dividir.

  - **Cómo corregirlo:** Los sumandos cambian de signo; los multiplicadores/divisores
  conservan su signo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de despeje.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de despeje.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se pueden usar las reglas comunes de transposición en ecuaciones literales?
  respuesta: Sí
  solucion_pasos:
  - Sí, los parámetros se comportan exactamente igual que los números.
- titulo: ¿Dividir entre un parámetro exige la condición de ser distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la indefinición por cero.
errores_frecuentes:
- Confundir la incógnita a despejar con las letras que actúan como parámetros.
- Olvidar factorizar la incógnita cuando aparece en más de un término.
- Sumar o trasponer parámetros cambiando su operación equivocadamente.
- Dividir entre un parámetro sin aclarar la restricción de ser no nulo.
- Tratar las variables físicas con subíndices como si fueran términos idénticos.
afirmaciones_verdaderas:
- Una ecuación literal expresa la incógnita en función de constantes simbólicas o
  parámetros.
- Si la incógnita figura en múltiples términos, debe agruparse y factorizarse para
  realizar su despeje.
al_terminar_debes_poder: Al finalizar este recurso podrás despejar cualquier variable
  en ecuaciones literales y fórmulas científicas indicando sus restricciones.
