procedimiento:
- Nunca extraigas un término sumando o restando desde adentro de un paréntesis multiplicado.
- Siempre divide todo el miembro opuesto completo (no solo una parte de él).
- Si hay fcantidades involucradas comunes, extraélos formalmente antes de dividir.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en detección de error en el despeje de una variable.
ejemplos:
- titulo: $y$ y $x = a(y + b)$
  enunciado: Analiza el caso $y$ y $x = a(y + b)$ y explica cómo se aplica el criterio
    estudiado.
  solucion_pasos:
  - 'Ejemplo: Quieres despejar $y$ en la ecuación $x = a(y + b)$.

    - **Error frecuente:** Estudiante pasa la $b$ restando: $x - b = ay$. Falso. La
    $b$ está atrapada dentro del paréntesis que está siendo multiplicado por $a$.
    No puede salir de manera directa.

    - **Método correcto 1:** Distribuyes primero: $x = ay + ab$. Luego pasas restando
    $ab$: $x - ab = ay$. Finalmente divides por $a$: $y = \frac{x - ab}{a}$.

    - **Método correcto 2:** Pasas dividiendo la $a$ primero: $\frac{x}{a} = y + b$.
    Luego pasas restando la $b$: $y = \frac{x}{a} - b$.'
  - Nunca extraigas un término sumando o restando desde adentro de un paréntesis multiplicado.
- titulo: $y$ y $x = a(y + b)$
  enunciado: Resuelve o interpreta $y$ y $x = a(y + b)$ usando las condiciones de
    este recurso.
  solucion_pasos:
  - 'Ejemplo: Quieres despejar $y$ en la ecuación $x = a(y + b)$.

    - **Error frecuente:** Estudiante pasa la $b$ restando: $x - b = ay$. Falso. La
    $b$ está atrapada dentro del paréntesis que está siendo multiplicado por $a$.
    No puede salir de manera directa.

    - **Método correcto 1:** Distribuyes primero: $x = ay + ab$. Luego pasas restando
    $ab$: $x - ab = ay$. Finalmente divides por $a$: $y = \frac{x - ab}{a}$.

    - **Método correcto 2:** Pasas dividiendo la $a$ primero: $\frac{x}{a} = y + b$.
    Luego pasas restando la $b$: $y = \frac{x}{a} - b$.'
  - Siempre divide todo el miembro opuesto completo (no solo una parte de él).
- titulo: 'Respecto de «Detección de error en el despeje de una variable»: ¿Es correcta
    esta caracteriz'
  enunciado: 'Respecto de «Detección de error en el despeje de una variable»: ¿Es
    correcta esta caracterización? «El error conceptual más común en las ecuaciones
    literales es ''operar incorrectamente dentro de los paréntesis'' o dividir a medias»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El error conceptual más común
    en las ecuaciones literales es ''operar incorrectamente dentro de los paréntesis''
    o dividir a medias.'
- titulo: 'Respecto de «Detección de error en el despeje de una variable»: ¿Es válida
    esta afirmación?'
  enunciado: 'Respecto de «Detección de error en el despeje de una variable»: ¿Es
    válida esta afirmación? «Puede omitirse esta condición sin cambiar el resultado:
    «Nunca extraigas un término sumando o restando desde adentro de un paréntesis
    multiplicado»»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El error conceptual más común
    en las ecuaciones literales es ''operar incorrectamente dentro de los paréntesis''
    o dividir a medias.'
errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Nunca extraigas un término
  sumando o restando desde adentro de un paréntesis multiplicado».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Siempre divide
  todo el miembro opuesto completo (no solo una parte de él)».'
- La definición sigue cumpliéndose aunque no se considere que el error conceptual
  más común en las ecuaciones literales es 'operar incorrectamente dentro de los paréntesis'
  o dividir a medias.
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Nunca extraigas
  un término sumando o restando desde adentro de un paréntesis multiplicado».
- La comprobación del resultado vuelve innecesaria la condición «Siempre divide todo
  el miembro opuesto completo (no solo una parte de él)».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_poder: Resolver ecuaciones y sistemas lineales aplicando detección
  de error en el despeje de una variable.
