semantic_id: MAT.ALG.ECUACIONES_LITERALES.ERROR_DESPEJE
resumen_inicial: 'Detección de error en el despeje de una variable: propiedades, resolución
  y modelamiento en Ecuaciones literales y despeje.'
explicacion_simple: 'Ejemplo: Quieres despejar $y$ en la ecuación $x = a(y + b)$.'
explicacion_formal: '### Definición formal


  En una ecuación literal con un término entre paréntesis multiplicado por un parámetro,
  como $x=a(y+b)$, ningún sumando interno al paréntesis puede transponerse por separado:
  primero debe aplicarse la propiedad distributiva ($x=ay+ab$) o dividirse por el
  factor externo completo ($\frac{x}{a}=y+b$) antes de despejar los términos que estaban
  agrupados.


  ### Desarrollo didáctico


  Ejemplo: Quieres despejar $y$ en la ecuación $x = a(y + b)$.

  - **Error frecuente:** Estudiante pasa la $b$ restando: $x - b = ay$. Falso. La
  $b$ está atrapada dentro del paréntesis que está siendo multiplicado por $a$. No
  puede salir de manera directa.

  - **Método correcto 1:** Distribuyes primero: $x = ay + ab$. Luego pasas restando
  $ab$: $x - ab = ay$. Finalmente divides por $a$: $y = \frac{x - ab}{a}$.

  - **Método correcto 2:** Pasas dividiendo la $a$ primero: $\frac{x}{a} = y + b$.
  Luego pasas restando la $b$: $y = \frac{x}{a} - b$.


  Respeta los jerarquías operativas de los paréntesis.'
definiciones_clave: '- **Detección de error en el despeje de una variable**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a detección de error en el despeje de una
  variable.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando detección de error
    en el despeje de una variable.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de detección de error
    en el despeje de una variable.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
