procedimiento:
- 'Paso 1: Auditar cada paso del despeje comprobando que las sumas pasen a restar y la multiplicación a dividir.'
- 'Paso 2: Verificar la presencia de paréntesis al trasponer factores a miembros compuestos.'
- 'Paso 3: Asignar valores numéricos de prueba a los parámetros para verificar la identidad en la fórmula inicial.'
- 'Paso 4: Corregir la transposición e indicar las restricciones del divisor.'
errores_correccion: '- **Error 1:** Invertir el signo del parámetro al trasponerlo dividiendo (escribir $a x = b \implies
  x = \frac{b}{-a}$). **Cómo corregirlo:** Los sumandos cambian de signo al trasponerse; **LOS FACTORES MULTIPLICATIVOS Y
  DIVISORES CONSERVAN SU SIGNO ORIGINAL AL CAMBIAR DE MIEMBRO ($x = \frac{b}{a}$)**.

  - **Error 2:** Dividir por un parámetro antes de trasponer los términos independientes que suman en ese miembro. **Cómo
  corregirlo:** En un despeje, **PRIMERO SE TRASPONEN LOS SUMANDOS Y RESTAS, Y FINALMENTE SE PASA A DIVIDIR EL COEFICIENTE
  DE LA VARIABLE**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: En la fórmula $y = m x + b$, se propone $x = \frac{y + b}{m}$. ¿Cuál es el error cometido?
  alternativas:
  - Se sumó $+b$ en lugar de trasponerlo restando $-b$
  - Se multiplicó por $m$ en lugar de dividir
  - El resultado debió ser $x = y - m b$
  respuesta: Se sumó $+b$ en lugar de trasponerlo restando $-b$
  solucion_pasos:
  - '1. Transposición correcta del sumando: $y - b = m x$.'
  - '2. Despeje correcto: $x = \frac{y - b}{m}$.'
- titulo: Ejemplo 2
  enunciado: Al despejar $t$ en $v = \frac{d}{t}$, se propone $t = v \cdot d$. ¿Es correcta esa propuesta?
  alternativas:
  - No, el despeje correcto es $t = \frac{d}{v}$
  - Sí, es totalmente correcta
  - No, el despeje correcto es $t = d - v$
  respuesta: No, el despeje correcto es $t = \frac{d}{v}$
  solucion_pasos:
  - '1. Multiplicar por $t$: $v \cdot t = d$.'
  - '2. Dividir por $v$: $t = \frac{d}{v}$.'
- titulo: Inversión de sumandos
  enunciado: ¿Un término que está sumando en el primer miembro debe trasponerse obligatoriamente restando al segundo miembro?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla del opuesto aditivo.
- titulo: Conservación del signo en divisores
  enunciado: ¿Un coeficiente multiplicativo positivo $+a$ debe trasponerse dividiendo como un divisor positivo $+a$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la división conserva el signo del divisor.
errores_frecuentes:
- Trasponer un término sumando sin invertir su signo aditivo ($+b \to +b$).
- Dividir entre el coeficiente multiplicativo afectando solo a un término en lugar de a todo el miembro opuesto.
- Cambiar injustificadamente de signo al divisor multiplicativo al momento de pasarlo al segundo miembro.
- Omitir los paréntesis al multiplicar un divisor común por una expresión binomial en el miembro opuesto.
- Asumir que un error de despeje algebraico puede corregirse simplemente cambiando el signo final de la solución.
afirmaciones_verdaderas:
- La detección de errores de despeje requiere verificar que sumandos inviertan su signo y multiplicadores pasen dividiendo.
- Evaluar numéricamente una fórmula despejada con valores de prueba confirma la validez matemática de la expresión.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/deteccion-de-error-en-el-despeje-de-una-variable-resumen.svg)


  QUÉ: Detectar y corregir fallos procedimentales y conceptuales en el despeje de variables literales.

  CÓMO: Auditar la secuencia de transformaciones algebraicas verificando el respeto a la jerarquía operativa ($a x + b = c
  \iff x = \frac{c - b}{a}$), la ley de los signos y la correcta aplicación del factor común.

  '
