semantic_id: MAT.ALG.ECUACIONES_LITERALES.ERROR_DESPEJE
resumen_inicial: Omitir la inversión de signos en sumandos o dividir prematuramente sin enterizar son los errores principales
  al despejar en ecuaciones literales.
explicacion_simple: 'Al despejar fórmulas o ecuaciones literales, es común cometer equivocaciones procedimentales por falta
  de atención a las operaciones inversas.


  Los dos errores más recurrentes consisten en:


  1. Trasponer un parámetro que estaba sumando conservando su signo positivo en lugar de pasarlo restando.

  2. Trasponer un divisor a multiplicar a otro miembro afectando solo al primer sumando y omitiendo el uso de paréntesis.


  Identificar estas inconsistencias mediante la revisión sistemática del paso a paso o asignando valores numéricos de prueba
  garantiza un despeje correcto.


  ![Detección de errores en el despeje](/static/img/nodos/deteccion-de-error-en-el-despeje-de-una-variable-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la fórmula $A = \frac{b + c}{2 h}$, se comparan formalmente el **despeje erróneo** y el **despeje correcto** del parámetro
  $c$:


  $$\text{Error procedimental: } c = 2 A h + b \quad \neq \quad \text{Despeje correcto: } c = 2 A h - b$$


  ### Desglose de la fórmula

  - Paso 1 (Multiplicación por divisor): $2 A h = b + c$.

  - Paso 2 (Transposición de sumando): $c = 2 A h - b$ (el término $+b$ se traslada al miembro opuesto como su opuesto aditivo
  $-b$).


  ### Síntesis didáctica

  Probar una fórmula despejada asignando números sencillos a los parámetros valida aritméticamente la exactitud de las transposiciones
  realizadas.

  '
definiciones_clave: '- **Error de despeje**: Alteración inadecuada de operaciones o signos durante la transposición de expresiones
  literales.

  - **Prueba por sustitución numérica**: Método de control que asigna valores numéricos arbitrarios a los parámetros para
  verificar la validez de la fórmula despejada.

  '
propiedades_relaciones: '- **Inversión operacional**: La adición se invierte en sustracción, y la multiplicación se invierte
  en división conservando el signo del factor.

  - **Prioridad de desarticulación**: Primero se traspone la suma/resta independiente y finalmente se traspone el coeficiente
  multiplicativo.

  '
ejemplo_guiado:
  enunciado: 'Analiza la fórmula $P = 2a + 2b$. Detecta el error en la propuesta de despeje de $a$: $a = \frac{P + 2b}{2}$,
    corrígela y evalúa la fórmula verdadera para $P = 20, b = 4$.'
  pasos:
  - 'Paso 1: Identificar el error procedimental: la propuesta sumó $+2b$ en vez de trasponerlo restando como $-2b$ al primer
    miembro.'
  - 'Paso 2: Corregir la transposición del sumando: $P - 2b = 2a$.'
  - 'Paso 3: Trasponer el coeficiente $2$ dividiendo a todo el miembro: $a = \frac{P - 2b}{2}$.'
  - 'Paso 4: Evaluar la fórmula correcta para $P = 20, b = 4$: $a = \frac{20 - 2(4)}{2} = \frac{20 - 8}{2} = \frac{12}{2}
    = 6$.'
  - 'Paso 5: Comprobar en la fórmula original: $P = 2(6) + 2(4) = 12 + 8 = 20$, confirmando $a = 6$.'
  imagen: /static/img/nodos/deteccion-de-error-en-el-despeje-de-una-variable-ejemplos.svg
