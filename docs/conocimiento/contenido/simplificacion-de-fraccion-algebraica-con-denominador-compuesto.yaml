semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.DENOMINADOR_COMPUESTO
resumen_inicial: Multiplicar el numerador y denominador por el m.c.m. de todos los
  denominadores secundarios elimina de un solo paso la fracción compleja.
explicacion_simple: 'Además de la regla de extremos y medios, existe una técnica súper
  potente para resolver fracciones complejas:

  Multiplicamos toda la fracción (arriba y abajo) por el m.c.m. de TODOS los denominadores
  pequeños que aparecen dentro de ella.

  Al distribuir este m.c.m. por cada término, todas las sub-fracciones se simplifican
  instantáneamente, transformando la expresión compleja en una fracción polinomial
  simple en un solo paso.'
explicacion_formal: 'Dada la fracción compleja $\frac{\frac{A(x)}{P(x)} + \frac{B(x)}{Q(x)}}{\frac{C(x)}{R(x)}
  + \frac{D(x)}{S(x)}}$, sea $M(x) = \operatorname{mcm}(P, Q, R, S)$. El **método
  de anulación por m.c.m. global** establece:


  $$\frac{N(x)}{D(x)} \cdot \frac{M(x)}{M(x)} = \frac{\left(\frac{A(x)}{P(x)} + \frac{B(x)}{Q(x)}\right)
  \cdot M(x)}{\left(\frac{C(x)}{R(x)} + \frac{D(x)}{S(x)}\right) \cdot M(x)}$$


  **Desglose de la fórmula:**

  - Multiplicar por $\frac{M(x)}{M(x)} = 1$ no altera el valor de la expresión real,
  pero anula cada denominador secundario al simplificarse exactamente.'
definiciones_clave: '- **m.c.m. global de sub-denominadores**: El m.c.m. de todas
  las sub-fracciones presentes en la expresión compleja.

  - **Método de limpieza directa**: Multiplicación simultánea por el m.c.m. que elimina
  todos los denominadores secundarios de inmediato.'
propiedades_relaciones: '- **Eficiencia superior**: Requiere menos pasos y genera
  menos errores algebraicos que sumar numeradores y denominadores por separado.'
ejemplo_guiado:
  enunciado: Aplica el método del m.c.m. global para simplificar $\frac{\frac{1}{x}
    + \frac{1}{y}}{\frac{1}{x^2} - \frac{1}{y^2}}$ y evalúa para $x = 2, y = 3$.
  pasos:
  - 'Paso 1: Identificar sub-denominadores $x, y, x^2, y^2$. El m.c.m. global es $x^2y^2$.Paso
    2: Multiplicar numerador y denominador por $x^2y^2$: $\frac{\left(\frac{1}{x}
    + \frac{1}{y}\right)x^2y^2}{\left(\frac{1}{x^2} - \frac{1}{y^2}\right)x^2y^2}$.Paso
    3: Distribuir en el numerador: $xy^2 + x^2y = xy(y + x)$.Paso 4: Distribuir en
    el denominador: $y^2 - x^2 = (y - x)(y + x)$.Paso 5: Cancelar $(y + x)$: el resultado
    es $\frac{xy}{y - x}$ para $x \neq y$.Paso 6: Evaluar para $x = 2, y = 3$: $\frac{(2)(3)}{3
    - 2} = \frac{6}{1} = 6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado simplificado de $\frac{\frac{1}{x} + \frac{1}{y}}{\frac{1}{x^2}
    - \frac{1}{y^2}}$?
  choices:
  - text: $\frac{xy}{y - x}$
    is_correct: true
  - text: $\frac{xy}{x - y}$
    is_correct: false
  - text: $\frac{x + y}{xy}$
    is_correct: false
  - text: $\frac{1}{y - x}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{xy}{y - x}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la expresión simplificada $\frac{xy}{y - x}$ para $x = 2$ e
    $y = 3$, ¿cuál es el valor obtenido?
  choices:
  - text: $6$
    is_correct: true
  - text: $-6$
    is_correct: false
  - text: $1$
    is_correct: false
  - text: $\frac{6}{5}$
    is_correct: false
  explanation: La alternativa correcta es '$6$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Listar todos los denominadores de las sub-fracciones presentes.'
- 'Paso 2: Calcular el m.c.m. de todos esos denominadores secundarios.'
- 'Paso 3: Multiplicar cada término del numerador global por el m.c.m.'
- 'Paso 4: Multiplicar cada término del denominador global por el m.c.m.'
- 'Paso 5: Simplificar las fracciones sencillas resultantes y reducir la fracción
  final.'
errores_correccion: '- **Error común:** Multiplicar por el m.c.m. solo algunos términos
  del numerador u olvidar multiplicarlo en el denominador.

  - **Cómo corregirlo:** Para mantener la equivalencia, DEBES multiplicar TODOS y
  cada uno de los términos del numerador y del denominador por el mismo m.c.m.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración de fracción compleja.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de fracción compleja.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se aplica extremos y medios en fracciones complejas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla básica de simplificación.
- titulo: ¿Las fracciones continuas infinitas se resuelven con ecuaciones cuadráticas?
  respuesta: Sí
  solucion_pasos:
  - Sí, aprovechando su propiedad de auto-similitud.
errores_frecuentes:
- Confundir la barra principal de división con las barras secundarias.
- Invertir los medios y ponerlos en el numerador en la regla de extremos y medios.
- Multiplicar por el m.c.m. solo algunos términos omitiendo el denominador.
- Intentar resolver fracciones continuas finitas de arriba hacia abajo.
- Aceptar soluciones negativas al resolver fracciones continuas infinitas de términos
  positivos.
afirmaciones_verdaderas:
- Una fracción compleja se simplifica multiplicando extremos con extremos y medios
  con medios.
- Multiplicar numerador y denominador por el m.c.m. de las sub-fracciones elimina
  la complejidad en un solo paso.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, simplificar
  y resolver fracciones algebraicas complejas y continuas expresando el resultado
  en su forma más simple.
