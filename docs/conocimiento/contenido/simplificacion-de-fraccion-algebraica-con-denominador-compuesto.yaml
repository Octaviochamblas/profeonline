semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.DENOMINADOR_COMPUESTO
resumen_inicial: Multiplicar el numerador y denominador por el m.c.m. de todos los denominadores secundarios elimina de un solo paso la fracción compleja.
explicacion_simple: |
  Además de la regla de extremos y medios, existe una técnica muy eficiente para resolver fracciones complejas:

  Multiplicamos toda la fracción (tanto el numerador global como el denominador global) por el m.c.m. de TODOS los denominadores secundarios que figuran dentro de ella.

  Al distribuir este m.c.m. por cada término, todas las sub-fracciones se simplifican instantáneamente, transformando la expresión compleja en una fracción polinomial simple en un solo paso.
explicacion_formal: |
  ### Definición formal
  Dada la fracción compleja $\frac{\frac{A(x)}{P(x)} + \frac{B(x)}{Q(x)}}{\frac{C(x)}{R(x)} + \frac{D(x)}{S(x)}}$, sea $M(x) = \operatorname{mcm}(P, Q, R, S)$. El **método de anulación por m.c.m. global** establece:

  $$\frac{N(x)}{D(x)} \cdot \frac{M(x)}{M(x)} = \frac{\left(\frac{A(x)}{P(x)} + \frac{B(x)}{Q(x)}\right) \cdot M(x)}{\left(\frac{C(x)}{R(x)} + \frac{D(x)}{S(x)}\right) \cdot M(x)}$$

  ### Desglose de la fórmula
  - Multiplicar por $\frac{M(x)}{M(x)} = 1$ no altera el valor de la expresión real, pero anula cada denominador secundario al simplificarse exactamente.

  ### Síntesis didáctica
  Distribuir el m.c.m. de todos los denominadores secundarios limpia la estructura compleja convirtiéndola en un cociente de polinomios enteros.
definiciones_clave: |
  - **m.c.m. global de sub-denominadores**: El m.c.m. de todas las sub-fracciones presentes en la expresión compleja.
  - **Método de limpieza directa**: Multiplicación simultánea por el m.c.m. que elimina todos los denominadores secundarios de inmediato.
propiedades_relaciones: |
  - **Eficiencia superior**: Requiere menos pasos y reduce la posibilidad de errores algebraicos en comparación con la homogeneización separada.
ejemplo_guiado:
  enunciado: 'Aplica el método del m.c.m. global para simplificar $\frac{\frac{1}{x} + \frac{1}{y}}{\frac{1}{x^2} - \frac{1}{y^2}}$ y evalúa para $x = 2, y = 3$.'
  pasos:
    - 'Paso 1: Identificar sub-denominadores $x, y, x^2, y^2$. El m.c.m. global es $x^2y^2$.'
    - 'Paso 2: Multiplicar numerador y denominador por $x^2y^2$: $\frac{\left(\frac{1}{x} + \frac{1}{y}\right)x^2y^2}{\left(\frac{1}{x^2} - \frac{1}{y^2}\right)x^2y^2}$.'
    - 'Paso 3: Distribuir en el numerador: $xy^2 + x^2y = xy(y + x)$.'
    - 'Paso 4: Distribuir en el denominador: $y^2 - x^2 = (y - x)(y + x)$.'
    - 'Paso 5: Cancelar $(y + x)$: el resultado es $\frac{xy}{y - x}$ para $x \neq y$.'
    - 'Paso 6: Evaluar para $x = 2, y = 3$: $\frac{(2)(3)}{3 - 2} = \frac{6}{1} = 6$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el resultado simplificado de $\frac{\frac{1}{x} + \frac{1}{y}}{\frac{1}{x^2} - \frac{1}{y^2}}$?'
    choices:
      - {text: '$\frac{xy}{y - x}$', is_correct: true}
      - {text: '$\frac{xy}{x - y}$', is_correct: false}
      - {text: '$\frac{x + y}{xy}$', is_correct: false}
      - {text: '$\frac{1}{y - x}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{xy}{y - x}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar la expresión simplificada $\frac{xy}{y - x}$ para $x = 2$ e $y = 3$, ¿cuál es el valor obtenido?'
    choices:
      - {text: '$6$', is_correct: true}
      - {text: '$-6$', is_correct: false}
      - {text: '$1$', is_correct: false}
      - {text: '$\frac{6}{5}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$6$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Listar todos los denominadores de las sub-fracciones presentes en el numerador y denominador global.'
  - 'Paso 2: Calcular el m.c.m. de todos esos denominadores secundarios.'
  - 'Paso 3: Multiplicar cada término del numerador global por el m.c.m. determinado.'
  - 'Paso 4: Multiplicar cada término del denominador global por el m.c.m. determinado.'
  - 'Paso 5: Simplificar los productos polinomiales resultantes y cancelar términos comunes.'
errores_correccion: |
  - **Error 1:** Multiplicar por el m.c.m. solo algunos términos del numerador u omitir su distribución en el denominador. **Cómo corregirlo:** Para preservar la equivalencia, **DEBES MULTIPLICAR TODOS Y CADA UNO DE LOS SUMANDOS DEL NUMERADOR Y DENOMINADOR POR EL MISMO M.C.M.**.
  - **Error 2:** Omitir la simplificación entre el m.c.m. y el denominador secundario al distribuir. **Cómo corregirlo:** El m.c.m. **DEBE DIVIDIRSE EXACTAMENTE POR CADA DENOMINADOR SECUNDARIO CANCELANDO SU PRESENCIA**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es el m.c.m. global para simplificar $\frac{1 + \frac{1}{x}}{2 - \frac{3}{x^2}}$?'
    alternativas:
      - '$x^2$'
      - '$x^3$'
      - '$x$'
    respuesta: '$x^2$'
    solucion_pasos:
      - '1. Denominadores secundarios: $x$ y $x^2$.'
      - '2. Mayor exponente: $x^2$.'
      - '3. m.c.m. global: $x^2$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al multiplicar $\frac{x - \frac{1}{x}}{1 + \frac{1}{x}}$ por el m.c.m. $x$, ¿qué fracción simple resulta?'
    alternativas:
      - '$x - 1$'
      - '$x + 1$'
      - '$\frac{x^2-1}{x}$'
    respuesta: '$x - 1$'
    solucion_pasos:
      - '1. Numerador: $x(x) - 1 = x^2 - 1 = (x-1)(x+1)$.'
      - '2. Denominador: $x(1) + 1 = x + 1$.'
      - '3. Cancelar $(x+1) \implies x - 1$.'
  - titulo: 'Preservación del valor'
    enunciado: '¿Multiplicar numerador y denominador por la misma expresión m.c.m. mantiene la equivalencia de la fracción?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, equivale a multiplicar la expresión por 1.'
  - titulo: 'Limpieza en un paso'
    enunciado: '¿El método del m.c.m. global elimina todos los denominadores secundarios simultáneamente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por propiedad divisoria del m.c.m. sobre sus componentes.'
errores_frecuentes:
  - 'Multiplicar el m.c.m. global solo por las sub-fracciones y no por los términos enteros.'
  - 'Elegir un denominador común que no sea múltiplo de todos los denominadores secundarios.'
  - 'Omitir la distribución del m.c.m. sobre las restas del denominador.'
  - 'Cancelar términos antes de efectuar la suma polinomial en el numerador resultante.'
  - 'Olvidar declarar las restricciones de los denominadores secundarios eliminados.'
afirmaciones_verdaderas:
  - 'La multiplicación por el m.c.m. global convierte una fracción compleja en un cociente polinomial directo.'
  - 'El método del m.c.m. exige distribuir el multiplicador a todos los sumandos enteros y fraccionarios.'
al_terminar_debes_poder: |
  QUÉ: Simplificar fracciones algebraicas con denominadores compuestos.
  CÓMO: Multiplicar numerador y denominador globales por el m.c.m. de todos los denominadores secundarios y reducir la fracción racional resultante.
