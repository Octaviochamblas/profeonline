semantic_id: MAT.ALG.FRACCIONES_COMPLEJAS.DENOMINADOR_COMPUESTO
resumen_inicial: 'Simplificación de fracción algebraica con denominador compuesto:
  concepto, reglas operativas y simplificación en Fracciones algebraicas complejas.'
explicacion_simple: Aquí la dificultad sube un nivel. A veces, el 'piso' de arriba
  o de abajo no es una sola fracción, sino una suma o resta de varias cosas. No puedes
  voltear una suma directamente.
explicacion_formal: '### Definición formal


  No puedes usar la ley del sándwich ni invertir el divisor si este consta de dos
  sumandos separados.


  ### Desarrollo didáctico


  A menudo, el ''piso de arriba'' o el ''piso de abajo'' no son fracciones simples
  listas para la regla del sándwich, sino una ensalada de fracciones sumándose o restándose.
  Por ejemplo, el denominador principal es $(1 + \frac{1}{x})$.


  Antes de intentar la ley del sándwich, **tienes la obligación de convertir esa ensalada
  en una única fracción compacta**.


  Para el ejemplo $(1 + \frac{1}{x})$:

  1. Imagina que el 1 es una fracción: $\frac{1}{1}$.

  2. Súmala a $\frac{1}{x}$ usando el MCM (que es ''x'').

  3. Amplifica la primera: $\frac{x}{x} + \frac{1}{x}$.

  4. Suma los numeradores: $\frac{x+1}{x}$.


  Listo. Tu piso rebelde ha sido compactado en una hermosa fracción. Haz lo mismo
  con el otro piso y ahora sí podrás aplicar la ley del sándwich sin problemas.'
