semantic_id: MAT.ALG.INTERVALOS.TRADUCCION_DESIGUALDAD_INTERVALO
resumen_inicial: Traducir una desigualdad a intervalo convierte expresiones algebraicas
  de orden en notación estandarizada de corchetes.
explicacion_simple: 'Para pasar de una desigualdad (como $-1 < x \le 6$) a notación
  de intervalo:

  1. Escribimos las dos fronteras numéricas separadas por una coma: $-1, 6$.

  2. Para la desigualdad estricta $<$ ponemos corchete hacia afuera $]$.

  3. Para la desigualdad no estricta $\le$ ponemos corchete hacia adentro $]$.

  Resultado final: $]-1, 6]$.'
explicacion_formal: 'La **regla inversa de traducción de desigualdad a intervalo**
  establece:


  $$a < x < b \iff ]a, b[$$

  $$a \le x < b \iff [a, b[$$

  $$x < b \iff ]-\infty, b[$$

  $$x \ge a \iff [a, +\infty[$$'
definiciones_clave: '- **Traducción de desigualdad a intervalo**: Conversión de desigualdades
  explícitas a la notación compacta de corchetes reales.'
propiedades_relaciones: '- **Mapeo directo inverso**: Cada tipo de desigualdad posee
  una notación de intervalo unívoca asociada.'
ejemplo_guiado:
  enunciado: Traduce a notación de intervalo la desigualdad no acotada inferiormente
    $x \le -3$.
  pasos:
  - 'Paso 1: Reconocer que al no tener límite inferior, proviene de $-\infty$ por
    la izquierda.Paso 2: Identificar el límite superior: $-3$.Paso 3: Notar que la
    desigualdad incluye el igual ($\le$), luego el $-3$ lleva corchete cerrado $]$.Paso
    4: Escribir la notación completa: $]-\infty, -3]$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la notación de intervalo correcta para la desigualdad $x \le
    -3$?
  choices:
  - text: $]-\infty, -3]$
    is_correct: true
  - text: $[-\infty, -3]$
    is_correct: false
  - text: $]-3, +\infty[$
    is_correct: false
  - text: $]-\infty, -3[$
    is_correct: false
  explanation: La alternativa correcta es '$]-\infty, -3]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al traducir la desigualdad doble $0 < x < 10$, ¿cuál es su notación de
    intervalo?
  choices:
  - text: $]0, 10[$
    is_correct: true
  - text: $[0, 10]$
    is_correct: false
  - text: $[0, 10[$
    is_correct: false
  - text: $]0, 10]$
    is_correct: false
  explanation: La alternativa correcta es '$]0, 10[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los números límite de la desigualdad.'
- 'Paso 2: Si la desigualdad va hacia la izquierda sin cota, usar $]-\infty$. Si va
  hacia la derecha sin cota, usar $+\infty[$.'
- 'Paso 3: Asignar corchete abierto o cerrado a los límites finitos según contengan
  o no el signo igual.'
- 'Paso 4: Escribir el intervalo entre corchetes.'
errores_correccion: '- **Error común:** Escribir $[-3, -\infty[$ invirtiendo la posición
  del infinito.

  - **Cómo corregirlo:** El $-\infty$ SIEMPRE va primero en el extremo izquierdo del
  intervalo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
  - 'La desigualdad $-1 < x \le 5$ se traduce a notación de intervalo como el conjunto cerrado $[-1, 5]$.'
  - 'El intervalo semiabierto $]-4, 2]$ equivale a la desigualdad estricta doble $-4 < x < 2$.'
  - 'La inecuación $x > 3$ se traduce en notación de intervalo como $]-\infty, 3[$.'
  - 'La traducción de la desigualdad no estricta $x \le 8$ resulta en el intervalo semiabierto por la izquierda $]8, +\infty[$.'
  - 'Al traducir entre desigualdad e intervalo, los operadores estrictos ($<, >$) corresponden a corchetes hacia adentro ($[, ]$).'
afirmaciones_verdaderas:
  - 'Los operadores de desigualdad estricta ($<, >$) se corresponden con corchetes abiertos ($], [$), mientras que ($\le, \ge$) se traducen con corchetes cerrados ($[, ]$).'
  - 'La desigualdad $-1 < x \le 5$ equivale exactamente a la notación de intervalo $]-1, 5]$.'
al_terminar_debes_poder: |
  QUÉ: Traducir fluidamente de expresiones de desigualdad a notación de intervalos reales.
  CÓMO: Identificar los operadores de orden ($<, >, \le, \ge$), seleccionar los corchetes correspondientes ($], [, [,$ $]$) y estructurar los extremos $a$ y $b$.
fuente: 'Texto escolar MINEDUC — Álgebra / Intervalos Reales'
