semantic_id: MAT.NUM.ERROR_NUMERICO.ERROR_PORCENTUAL
resumen_inicial: 'El error porcentual expresa el error relativo como un porcentaje
  multiplicando el error relativo por $100\%$: $E_p = E_r \cdot 100\%$.'
explicacion_simple: El error porcentual es simplemente el error relativo transformado
  a porcentaje para poder interpretarlo fácilmente en la vida cotidiana. Nos indica
  qué porcentaje del valor real representa el desvío cometido en la aproximación.
explicacion_formal: 'Dado el error relativo $E_r = \frac{|x - \bar{x}|}{|x|}$, el
  **Error Porcentual $E_p$** representa la tasa relativa estandarizada sobre $100$:


  $$E_p = E_r \cdot 100\% = \frac{|x - \bar{x}|}{|x|} \cdot 100\%$$


  **Desglose de la fórmula:**

  - $E_r$: Error relativo fraccionario adimensional.

  - $\cdot 100\%$ Factor de conversión porcentual.


  > **Complemento didáctico:** Un error porcentual menor al $1\%$ indica una aproximación
  de altísima calidad en aplicaciones de ingeniería y ciencias.'
definiciones_clave: '- **Error porcentual**: Expresión en porcentaje $E_p = E_r \cdot
  100\%$ de la desviación relativa respecto del valor exacto.'
propiedades_relaciones: '- **Escala en Porcentaje**: Expresa el desvío en el rango
  $0\%$ a $100\%$.'
ejemplo_guiado:
  enunciado: Calcule el error porcentual si el error relativo de una medición es $E_r
    = 0,04$.
  pasos:
  - 'Paso 1: Identificar el error relativo: $E_r = 0,04$.'
  - "Paso 2: Multiplicar por $100\\%$:\n  $0,04 \\cdot 100\\% = 4\\%$."
  - 'Conclusión: El error porcentual cometido en la medición es de $4\%$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se obtiene el error porcentual Ep a partir del error relativo Er?
  choices:
  - text: Multiplicando el error relativo por 100% (Ep = Er · 100%)
    is_correct: true
  - text: Dividiendo el error relativo por 100
    is_correct: false
  - text: Sumando 100 al error relativo
    is_correct: false
  - text: Restando 100%
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando el error relativo por 100%
    (Ep = Er · 100%)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para Er = 0,04, ¿cuál fue el error porcentual resultante?
  choices:
  - text: 4%
    is_correct: true
  - text: 0,4%
    is_correct: false
  - text: 40%
    is_correct: false
  - text: 0,04%
    is_correct: false
  explanation: La alternativa correcta es '4%'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el error relativo $E_r = \frac{|x - \bar{x}|}{|x|}$.'
- 'Paso 2: Multiplicar el valor decimal del error relativo por $100$.'
- 'Paso 3: Añadir el símbolo de porcentaje ($\%$) al valor numérico resultante.'
errores_correccion: '- **Error 1: Multiplicar el error absoluto directamente por 100%
  sin dividir por el valor real.** **Cómo corregirlo:** El error porcentual exige
  calcular PRIMERO el error relativo $E_r = \frac{E_a}{|x|}$.


  - **Error 2: Olvidar añadir el símbolo % al resultado.** **Cómo corregirlo:** El
  error porcentual debe llevar siempre el símbolo $\%$ explícito.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $E_r = 0,025$, ¿cuál es el error porcentual?
  alternativas:
  - 2,5%
  - 0,25%
  - 25%
  respuesta: 2,5%
  solucion_pasos:
  - $E_p = 0,025 \cdot 100\% = 2,5\%$.
- titulo: Ejemplo 2
  enunciado: Si el valor real es 200 y se aproxima por 190 (Ea = 10), calcule el error
    porcentual.
  alternativas:
  - 5%
  - 10%
  - 2,5%
  respuesta: 5%
  solucion_pasos:
  - $E_r = 10 / 200 = 0,05 \implies E_p = 0,05 \cdot 100\% = 5\%$.
- titulo: ¿Equivale un error relativo de 0,01 a un error porcentual del 1%?
  respuesta: Sí
  solucion_pasos:
  - Sí, $0,01 \cdot 100\% = 1\%$.
- titulo: ¿Es 0% el error porcentual de una medición perfectamente exacta?
  respuesta: Sí
  solucion_pasos:
  - Sí, si $\bar{x} = x \implies E_a = 0 \implies E_p = 0\%$.
errores_frecuentes:
- Multiplicar el error absoluto por 100% para obtener el error porcentual sin dividir
  por el valor real.
- El error porcentual se calcula dividiendo el valor aproximado entre 100.
- Un error porcentual del 5% equivale a un error relativo de 0,5.
- El error porcentual puede tomar valores infinitos negativos cuando nos quedamos
  por debajo.
- Añadir el símbolo % exige dividir el número por 100 dos veces consecutivas.
afirmaciones_verdaderas:
- El error porcentual $E_p = E_r \cdot 100\%$ expresa el desvío relativo como un porcentaje
  respecto del valor exacto.
- Un error porcentual igual a $0\%$ indica una aproximación completamente exacta al
  valor real.
al_terminar_debes_poder: Al terminar serás capaz de calcular el error porcentual $E_p
  = E_r \cdot 100\%$, expresando el desvío proporcional de cualquier aproximación
  como un porcentaje representativo.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
