semantic_id: MAT.NUM.ERROR_NUMERICO.ERROR_PORCENTUAL
resumen_inicial: El error porcentual expresa el error relativo como un porcentaje multiplicándolo por 100%, facilitando la comunicación e interpretación de la exactitud.
explicacion_simple: '![Cálculo del error porcentual](/static/img/nodos/calculo-del-error-porcentual-intro.svg)


  El error porcentual toma el error relativo y lo convierte en un porcentaje multiplicándolo por $100\%$. Nos dice cuántas partes de error cometemos por cada $100$ partes del valor real. Por ejemplo, un error relativo de $0,025$ se traduce de inmediato en un error porcentual de $2,5\%$, lo que facilita comunicar la precisión en contextos cotidianos y científicos.'
explicacion_formal: 'Dado el error relativo $E_{\text{rel}} = \frac{|x_{\text{real}} - x_{\text{aprox}}|}{|x_{\text{real}}|}$, el **Error Porcentual** $E_{\%}$ se define formalmente mediante:


  $$E_{\%} = E_{\text{rel}} \cdot 100\% = \left( \frac{|x_{\text{real}} - x_{\text{aprox}}|}{|x_{\text{real}}|} \right) \cdot 100\%$$


  **Desglose formal de la fórmula:**

  - **$E_{\text{rel}}$:** Cociente adimensional de error.

  - **Factor $100\%$:** Factor de escala que transforma la razón a base porcentual centesimal.

  - **Rango estándar:** $E_{\%} \ge 0\%$, donde $0\%$ indica una exactitud absoluta ($x_{\text{real}} = x_{\text{aprox}}$).


  > **Complemento didáctico:** En aplicaciones técnicas y científicas, una medición con $E_{\%} < 1\%$ se considera de alta precisión, mientras que márgenes entre $1\%$ y $5\%$ son comunes en ingeniería.'
definiciones_clave: '- **Error porcentual**: Expresión en base 100 del error relativo ($E_{\text{rel}} \cdot 100\%$).

  - **Margen de tolerancia porcentual**: Umbral máximo de error permitido en una especificación técnica.

  - **Exactitud porcentual**: Medida complementaria ($100\% - E_{\%}$) que describe la fidelidad del cálculo.'
propiedades_relaciones: '- **Correspondencia biunívoca con el error relativo**: $E_{\text{rel}} = 0,01 \iff E_{\%} = 1\%$.

  - **Interpretación directa**: Indica el número de unidades erróneas cometidas por cada 100 unidades reales evaluadas.'
ejemplo_guiado:
  enunciado: '![Ejemplos de error porcentual](/static/img/nodos/calculo-del-error-porcentual-ejemplos.svg)


    Si el valor real es $40\text{ g}$ y el valor aproximado en balanza es $39\text{ g}$, calcule el error porcentual de la medición.'
  pasos:
  - 'Paso 1: Calcular el error absoluto: $E_{\text{abs}} = |40 - 39| = 1\text{ g}$.'
  - 'Paso 2: Calcular el error relativo: $E_{\text{rel}} = \frac{1\text{ g}}{40\text{ g}} = 0,025$.'
  - "Paso 3: Multiplicar por $100\\%$ para obtener el error porcentual:\n  $$E_{\\%} = 0,025 \\cdot 100\\% = 2,5\\%$$"
  - 'Conclusión: El error porcentual de la medición es $2,5\%$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se obtiene el error porcentual a partir del error relativo?
  choices:
  - text: Multiplicando el error relativo por 100%
    is_correct: true
  - text: Dividiendo el error relativo por 100
    is_correct: false
  - text: Sumando 100 al error absoluto
    is_correct: false
  - text: Restando el valor real del aproximado
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando el error relativo por 100%'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $40\text{ g}$ y $39\text{ g}$, ¿cuál fue el error porcentual final?
  choices:
  - text: $2,5\%$
    is_correct: true
  - text: $0,025\%$
    is_correct: false
  - text: $25\%$
    is_correct: false
  - text: $1\%$
    is_correct: false
  explanation: La alternativa correcta es '$2,5\%$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el error relativo $E_{\text{rel}} = \frac{|x_{\text{real}} - x_{\text{aprox}}|}{|x_{\text{real}}|}$.'
- 'Paso 2: Multiplicar el resultado decimal por $100$.'
- 'Paso 3: Añadir el símbolo de porcentaje ($\%$) al valor numérico resultante.'
errores_correccion: '- **Error 1: Multiplicar el error absoluto por 100% olvidando dividir por el valor real.** **Cómo corregirlo:** El porcentaje se aplica sobre el error RELATIVO, no sobre el absoluto ($E_{\%} = \frac{E_{\text{abs}}}{x_{\text{real}}} \cdot 100\%$).

  - **Error 2: Desplazar la coma un solo lugar al multiplicar por 100.** **Cómo corregirlo:** Multiplicar por 100 desplaza la coma DOS lugares a la derecha ($0,025 \cdot 100 = 2,5$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el error porcentual si $x_{\text{real}} = 40$ y $x_{\text{aprox}} = 39$.
  alternativas:
  - $2,5\%$
  - $0,25\%$
  - $25\%$
  respuesta: $2,5\%$
  solucion_pasos:
  - $E_{\text{rel}} = \frac{|40-39|}{40} = 0,025 \implies E_{\%} = 0,025 \cdot 100\% = 2,5\%$.
- titulo: Ejemplo 2
  enunciado: Calcule el error porcentual si $x_{\text{real}} = 20$ y $x_{\text{aprox}} = 21$.
  alternativas:
  - $5\%$
  - $0,5\%$
  - $50\%$
  respuesta: $5\%$
  solucion_pasos:
  - $E_{\text{rel}} = \frac{|20-21|}{20} = \frac{1}{20} = 0,05 \implies E_{\%} = 0,05 \cdot 100\% = 5\%$.
- titulo: ¿Equivale un error relativo de $0,01$ a un error porcentual del $1\%$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $0,01 \cdot 100\% = 1\%$.
  alternativas:
  - texto: Sí, equivale exactamente al 1%
    es_correcta: true
    retroalimentacion: ¡Correcto! Multiplicar $0,01$ por $100\%$ entrega $1\%$.
  - texto: No, equivale al 10%
    es_correcta: false
    retroalimentacion: Incorrecto, $10\%$ corresponde a un error relativo de $0,10$.
  - texto: No, equivale al 0,1%
    es_correcta: false
    retroalimentacion: Incorrecto, $0,1\%$ corresponde a $0,001$.
- titulo: ¿Es $0\%$ el error porcentual de una medición perfectamente exacta?
  respuesta: Sí
  solucion_pasos:
  - Sí, si $x_{\text{real}} = x_{\text{aprox}}$, entonces $E_{\text{abs}} = 0$, $E_{\text{rel}} = 0$ y $E_{\%} = 0\%$.
  alternativas:
  - texto: Sí, 0% indica exactitud perfecta
    es_correcta: true
    retroalimentacion: ¡Correcto! La ausencia total de error equivale a $0\%$.
  - texto: No, la exactitud perfecta es 100%
    es_correcta: false
    retroalimentacion: Incorrecto, el 100% de error implicaría una discrepancia igual a la magnitud total.
  - texto: No es posible tener 0% de error
    es_correcta: false
    retroalimentacion: Incorrecto, en cálculos matemáticos directos el error puede ser exactamente nulo.
errores_frecuentes:
- Multiplicar directamente el error absoluto por 100% sin dividir por el valor real.
- Desplazar la coma un solo lugar en vez de dos al multiplicar por 100.
- Confundir el error porcentual con el porcentaje de exactitud ($100\% - E_{\%}$).
- Dividir entre el valor aproximado para calcular el porcentaje de error.
- Creer que un error porcentual de 0,5% equivale a un error relativo de 0,5.
afirmaciones_verdaderas:
- El error porcentual es el producto del error relativo por 100%.
- Un error porcentual de 0% indica que el valor aproximado coincide exactamente con el valor real.
- El error porcentual permite comunicar la magnitud del error de manera comprensible y estandarizada.
al_terminar_debes_poder: '![Síntesis de cálculo del error porcentual](/static/img/nodos/calculo-del-error-porcentual-resumen.svg)


  QUÉ: Expresar el error de una aproximación en formato porcentual estándar.


  CÓMO: Multiplicando el error relativo por $100\%$ ($E_{\%} = \frac{|x_{\text{real}} - x_{\text{aprox}}|}{|x_{\text{real}}|} \cdot 100\%$), permitiendo comunicar e interpretar la precisión de cualquier cálculo o medición en una escala centesimal comprensible.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
