semantic_id: MAT.ALG.FACTOR_COMUN.MAXIMO_COEFICIENTE_COMUN
resumen_inicial: 'Determinación del máximo factor común numérico: concepto, método
  de descomposición y reglas en Factor común.'
explicacion_simple: La parte numérica del factor común debe dividir exactamente todos
  los coeficientes. Elegir su máximo común divisor produce una factorización completa
  en la parte numérica.
explicacion_formal: '### Definición formal


  El Máximo Común Divisor de $c_1, c_2, \dots, c_n$ es el mayor entero $d$ tal que
  $d \mid c_i$ para todo $i$ (es decir, cada $c_i$ es divisible exactamente por $d$).
  Elegir cualquier divisor común menor que $d$ deja un factor adicional sin extraer
  en la parte numérica.


  ### Desarrollo didáctico


  El mayor número que divide exactamente a 16 y 24 es 8.


  Dividimos 9/3=3 y 6/3=2, quedando (3a + 2b).


  Todos son divisibles por 6, y no hay otro mayor que divida a los tres.'
definiciones_clave: '- **Determinación del máximo factor común numérico**: Técnica
  de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en determinación del máximo factor común numérico.'
ejemplo_guiado:
  enunciado: Factoriza la expresión algebraica aplicando los criterios de determinación
    del máximo factor común numérico.
  pasos:
