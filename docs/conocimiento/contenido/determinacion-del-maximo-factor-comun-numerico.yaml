resumen_inicial: La determinación del máximo factor común numérico es el cálculo del
  Máximo Común Divisor (MCD) entre los coeficientes enteros de un polinomio para extraer
  el mayor factor entero posible.
explicacion_simple: Si tienes $24x + 36y + 60z$, los números $24, 36$ y $60$ se pueden
  dividir por $2$, por $3$, o por $6$, pero el divisor más grande de todos es $12$.
  El máximo factor común numérico es $12$, dejando $12(2x + 3y + 5z)$.
explicacion_formal: 'Dados los coeficientes enteros $c_1, c_2, \dots, c_n \in \mathbb{Z}$
  de un polinomio $P$, el **Máximo Factor Común Numérico** $D$ es:


  $$D = \text{MCD}(c_1, c_2, \dots, c_n) = \max \{ d \in \mathbb{Z}^+ : d \mid c_i
  \quad \forall i = 1, \dots, n \}$$


  **Desglose simbólico:**

  - $\text{MCD}(c_1, \dots, c_n)$: Entero positivo más grande que divide exactamente
  a cada coeficiente $c_i$.

  - $\frac{c_i}{D} \in \mathbb{Z}$: Los coeficientes resultantes dentro del paréntesis
  son enteros primos entre sí (MCD $= 1$).


  > **Complemento didáctico:** Garantiza que la factorización sea COMPLETA en el dominio
  de los enteros $\mathbb{Z}$.'
definiciones_clave: '- **Máximo Común Divisor (MCD)**: Mayor entero positivo que divide
  a un conjunto de números sin dejar residuo.

  - **Coeficientes primos entre sí**: Conjunto de enteros cuyo único divisor positivo
  común es $1$.'
propiedades_relaciones: '- **Condición de completitud**: Si el MCD de los coeficientes
  del paréntesis resultante es $> 1$, la factorización fue incompleta.'
ejemplo_guiado:
  enunciado: Determine el máximo factor común numérico para el polinomio $18a + 27b
    - 45c$ y escriba la expresión factorizada.
  pasos:
  - 'Paso 1: Descomponer los coeficientes en factores primos: $18 = 2 \cdot 3^2$,
    $27 = 3^3$, $45 = 5 \cdot 3^2$.'
  - 'Paso 2: Calcular el MCD: Tomar los factores comunes con su menor exponente $\to
    3^2 = 9$.'
  - 'Paso 3: Dividir cada coeficiente entre $9$: $18/9 = 2$, $27/9 = 3$, $-45/9 =
    -5$.'
  - 'Paso 4: Escribir la factorización: $9(2a + 3b - 5c)$.'
  - 'Paso 5: Verificar que $2, 3$ y $-5$ son primos entre sí (MCD $= 1$).'
  - 'Conclusión: El máximo factor común numérico es $9$ y la expresión es $9(2a +
    3b - 5c)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición deben cumplir los coeficientes que quedan dentro del paréntesis
    tras extraer el máximo factor común numérico?
  choices:
  - text: Deben ser números enteros primos entre sí (su MCD debe ser 1)
    is_correct: true
  - text: Deben ser todos números primos
    is_correct: false
  - text: Deben ser todos números pares
    is_correct: false
  - text: Deben ser iguales entre sí
    is_correct: false
  explanation: La alternativa correcta es 'Deben ser números enteros primos entre
    sí (su MCD debe ser 1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para el polinomio $18a + 27b - 45c$, ¿cuál es su máximo factor común numérico?
  choices:
  - text: $9$
    is_correct: true
  - text: $3$
    is_correct: false
  - text: $18$
    is_correct: false
  - text: $27$
    is_correct: false
  explanation: La alternativa correcta es '$9$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Descomponer los coeficientes numéricos en sus factores primos.'
- 'Paso 2: Obtener el MCD multiplicando los factores primos comunes con su menor exponente.'
- 'Paso 3: Dividir cada coeficiente entre el MCD y escribir la expresión factorizada.'
errores_correccion: '- **Error 1: Extraer un divisor común menor en lugar de extraer
  el Máximo Común Divisor (MCD).** **Cómo corregirlo:** Si se extrae un divisor menor
  (ej. 3 en lugar de 9), la expresión sigue teniendo un factor numérico dentro del
  paréntesis; se DEBE usar el MCD.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice al máximo el polinomio $16x - 24y + 32z$.
  alternativas:
  - $8(2x - 3y + 4z)$
  - $4(4x - 6y + 8z)$
  - $2(8x - 12y + 16z)$
  respuesta: $8(2x - 3y + 4z)$
  solucion_pasos:
  - 1. MCD(16, 24, 32) = 8.
  - '2. Dividiendo: $16/8=2$, $-24/8=-3$, $32/8=4$.'
  - '3. Resultado máximo: $8(2x - 3y + 4z)$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el MCD numérico de los coeficientes en $15m + 25n + 35p$?
  alternativas:
  - $5$
  - $15$
  - $1$
  respuesta: $5$
  solucion_pasos:
  - 1. MCD(15, 25, 35) = 5.
  - '2. Factorizado: $5(3m + 5n + 7p)$.'
- titulo: ¿Es $4(3a + 5b)$ la factorización completa con el máximo factor común de
    $12a + 20b$?
  respuesta: Sí
  solucion_pasos:
  - Sí, MCD(12, 20) = 4, y 3 con 5 son primos entre sí.
- titulo: Si los coeficientes numéricos de un polinomio son primos entre sí, ¿su MCD
    es mayor a 1?
  respuesta: 'No'
  solucion_pasos:
  - No, si son primos entre sí, su MCD es 1, por lo que no existe factor común numérico
    entero $>1$.
errores_frecuentes:
- Extraer un divisor común pequeño dejando coeficientes que aún comparten factores
  dentro del paréntesis.
- Usar el Mínimo Común Múltiplo (MCM) en lugar del Máximo Común Divisor (MCD) como
  factor numérico.
- Sumar o restar los coeficientes en lugar de calcular su MCD.
- Declarar que el factor numérico puede ser cualquier divisor entero arbitrario.
- Declarar que una factorización es completa aun cuando los coeficientes del paréntesis
  no son primos entre sí.
afirmaciones_verdaderas:
- El máximo factor común numérico es strictly el Máximo Común Divisor (MCD) de los
  coeficientes.
- Una factorización numérica es completa solo si los coeficientes resultantes en el
  paréntesis son primos entre sí.
al_terminar_debes_poder: Al terminar serás capaz de calcular y extraer el máximo factor
  común numérico de cualquier expresión polinómica.
