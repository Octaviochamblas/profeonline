procedimiento:
- El mayor número que divide exactamente a 16 y 24 es 8.
- Dividimos 9/3=3 y 6/3=2, quedando (3a + 2b).
- Todos son divisibles por 6, y no hay otro mayor que divida a los tres.
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en determinación del máximo factor común numérico.
ejemplos:
- titulo: El factor común numérico de $7x + 11$ es 1
  enunciado: ¿El factor común numérico de $7x + 11$ es 1?
  solucion_pasos:
  - Como 7 y 11 son primos entre sí, su único divisor común es 1.
  - 'Respuesta: Verdadero'
- titulo: Si saco 2 de $4x+8$, obtengo la factorización final completa
  enunciado: ¿Si saco 2 de $4x+8$, obtengo la factorización final completa?
  solucion_pasos:
  - Quedaría 2(2x+4), pero el interior aún es divisible por 2. Debí sacar el 4.
  - 'Respuesta: Falso'
- titulo: 'Respecto de «Determinación del máximo factor común numérico»: ¿Describe
    adecuadamente el con'
  enunciado: 'Respecto de «Determinación del máximo factor común numérico»: ¿Describe
    adecuadamente el concepto esta frase? «8»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: 8.'
- titulo: 'Respecto de «Determinación del máximo factor común numérico»: ¿Se puede
    aceptar esta afirmac'
  enunciado: 'Respecto de «Determinación del máximo factor común numérico»: ¿Se puede
    aceptar esta afirmación? «Para «¿Cuál es el MCD de los coeficientes en $16x^2
    - 24x$», la respuesta correcta es 4»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: 8.'
errores_frecuentes:
- Para «¿Cuál es el MCD de los coeficientes en $16x^2 - 24x$», la respuesta correcta
