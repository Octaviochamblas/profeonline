semantic_id: MAT.ALG.FACTOR_COMUN.MAXIMO_COEFICIENTE_COMUN
resumen_inicial: La determinación del máximo factor común numérico consiste en calcular el Máximo Común Divisor (MCD) de los
  coeficientes numéricos enteros mediante descomposición en factores primos para garantizar la factorización completa.
explicacion_simple: "Para hallar el **máximo factor común numérico** de un polinomio (ej: $24x + 36y - 60z$):\n- **¿POR QUÉ\
  \ BUSCAMOS EL MCD?**:\n  - Los coeficientes $24, 36, 60$ se pueden dividir por $2$, por $3$, por $4$ y por $6$.\n  - ¡Pero\
  \ el **MAYOR NÚMERO** que los divide a todos es el **$12$**!\n- **MÉTODO DE DESCOMPOSICIÓN EN PRIMOS**:\n  - $24 = 2^3 \\\
  cdot 3$.\n  - $36 = 2^2 \\cdot 3^2$.\n  - $60 = 2^2 \\cdot 3 \\cdot 5$.\n  - El MCD toma los primos comunes con su **menor\
  \ exponente**: $2^2 \\cdot 3 = 4 \\cdot 3 = \\mathbf{12}$.\n- **Resultado de la extracción numérico-completa**:\n  $$12(2x\
  \ + 3y - 5z)$$\n\n![Máximo factor común numérico](/static/img/nodos/determinacion-del-maximo-factor-comun-numerico-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $c_1, c_2, \dots, c_k \in \mathbb{Z} \setminus \{0\}$ los coeficientes numéricos de un polinomio de $k$ términos. Se
  define el **Máximo Común Divisor (MCD)** como el entero positivo $g = \operatorname{MCD}(c_1, \dots, c_k) \in \mathbb{N}$
  tal que:


  1. $g \mid c_i$ para todo $i \in \{1, \dots, k\}$ ($g$ es un divisor común).

  2. Si $d \mid c_i$ para todo $i$, entonces $d \mid g$ ($g$ es el máximo en la relación de divisibilidad).


  ### Cálculo por Factorización en Primos

  Expresando cada coeficiente en su forma canónica $\left| c_i \right| = \prod_{p} p^{v_p(c_i)}$:


  $$\operatorname{MCD}(c_1, \dots, c_k) = \prod_{p} p^{\min_i (v_p(c_i))}$$


  donde $v_p(c_i)$ representa la valoración $p$-ádica (exponente del primo $p$) en la factorización de $c_i$.


  ### Síntesis didáctica

  Extraer un divisor numérico menor que el MCD deja coeficientes dentro del paréntesis que aún comparten factores comunes,
  impidiendo que la factorización sea completa.

  '
definiciones_clave: '- **Máximo Común Divisor ($\operatorname{MCD}$)**: El entero mayor que divide exactamente a un conjunto
  de coeficientes sin dejar resto.

  - **Valoración $p$-ádica ($v_p(c)$)**: Exponente al que aparece elevado el número primo $p$ en la descomposición de un coeficiente.

  - **Factorización numérica completa**: Condición de un polinomio factorizado donde los coeficientes del paréntesis resultantes
  son primos entre sí ($\operatorname{MCD} = 1$).

  '
propiedades_relaciones: '- **Primos entre sí**: Los coeficientes reducidos dentro del paréntesis $\frac{c_1}{g}, \dots, \frac{c_k}{g}$
  satisfacen $\operatorname{MCD}\left(\frac{c_1}{g}, \dots, \frac{c_k}{g}\right) = 1$.

  - **Multiplicatividad del MCD**: $\operatorname{MCD}(m c_1, m c_2) = m \cdot \operatorname{MCD}(c_1, c_2)$ para todo $m
  \in \mathbb{N}$.

  '
ejemplo_guiado:
  enunciado: Determina el máximo factor común numérico del polinomio $48a - 72b + 120c$ y escribe su factorización.
  pasos:
  - 'Paso 1: Descomponemos los tres coeficientes en sus factores primos: - $48 = 2^4 \cdot 3$. - $72 = 2^3 \cdot 3^2$. - $120
    = 2^3 \cdot 3 \cdot 5$.'
  - 'Paso 2: Identificamos los factores primos comunes con sus menores exponentes: - Para el primo 2: $\min(4, 3, 3) = 3 \implies
    2^3 = 8$. - Para el primo 3: $\min(1, 2, 1) = 1 \implies 3^1 = 3$. - El primo 5 no es común a los tres.'
  - 'Paso 3: Multiplicamos los primos comunes seleccionados: $\operatorname{MCD}(48, 72, 120) = 2^3 \cdot 3 = 8 \cdot 3 =
    \mathbf{24}$.'
  - 'Paso 4: Dividimos cada coeficiente entre 24 para armar el paréntesis: - $48 / 24 = 2$. - $-72 / 24 = -3$. - $120 / 24
    = 5$.'
  - 'Conclusión: La factorización numérica máxima es **$24(2a - 3b + 5c)$**.'
  imagen: /static/img/nodos/determinacion-del-maximo-factor-comun-numerico-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el Máximo Común Divisor (MCD) numérico entre los coeficientes 30, 45 y 75?
  choices:
  - text: El MCD es 15, calculando los primos comunes $3^1 \cdot 5^1 = 15$
    is_correct: true
  - text: El MCD es 5
    is_correct: false
  - text: El MCD es 3
    is_correct: false
  - text: El MCD es 30
    is_correct: false
  explanation: La alternativa correcta es 'El MCD es 15, calculando los primos comunes $3^1 \cdot 5^1 = 15$'. $\operatorname{MCD}(30,
    45, 75) = 15$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si al factorizar $16x + 24y$ extraemos sólo el número 4 obteniendo $4(4x + 6y)$, ¿por qué la factorización no
    está completa?
  choices:
  - text: Porque los coeficientes 4 y 6 dentro del paréntesis aún se pueden dividir por 2, siendo el MCD real el número 8
      ($8(2x + 3y)$)
    is_correct: true
  - text: Porque 4 no divide a 16
    is_correct: false
  - text: Porque faltan las variables
    is_correct: false
  - text: La factorización sí está completa
    is_correct: false
  explanation: La alternativa correcta es 'Porque los coeficientes 4 y 6 dentro del paréntesis aún se pueden dividir por 2,
    siendo el MCD real el número 8 ($8(2x + 3y)$)'. MCD(16, 24) = 8.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Descomponer cada coeficiente numérico en el producto de sus factores primos.'
- 'Paso 2: Seleccionar únicamente los factores primos que aparezcan en todas las descomposiciones.'
- 'Paso 3: Elevar cada primo común al menor exponente con el que figura.'
- 'Paso 4: Multiplicar dichos primos para hallar el MCD y dividir los coeficientes originales.'
errores_correccion: '- **Error 1:** Extraer un divisor común que no es el MÁXIMO (extraer 4 en lugar de 8 para 16 y 24). **Cómo
  corregirlo:** Se debe **EXTRAER SIEMPRE EL MÁXIMO COMÚN DIVISOR (MCD) PARA QUE LOS COEFICIENTES DEL PARÉNTESIS SEAN PRIMOS
  ENTRE SÍ**.

  - **Error 2:** Intercambiar el MCD numérico con el Mínimo Común Múltiplo (MCM). **Cómo corregirlo:** El factor común numérico
  **DIVIDE A LOS NÚMEROS (MCD), NO ES DIVIDIDO POR ELLOS (MCM)**.

  '
ejemplos:
- titulo: MCD de dos coeficientes
  enunciado: Para $18x + 27y$, ¿es el máximo factor común numérico igual a $9$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\operatorname{MCD}(18, 27) = 9$.
- titulo: Coeficientes primos entre sí
  enunciado: Al extraer $12$ en $12a + 24b = 12(a + 2b)$, ¿son $1$ y $2$ primos entre sí?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\operatorname{MCD}(1, 2) = 1$.
- titulo: Tres coeficientes
  enunciado: Para $20, 40, 60$, ¿es $20$ el máximo común divisor?
  respuesta: Sí
  solucion_pasos:
  - Sí, 20 divide a los tres.
- titulo: MCD igual a 1
  enunciado: En el polinomio $5x + 7y + 11z$, ¿es el MCD numérico igual a $1$ por ser números primos?
  respuesta: Sí
  solucion_pasos:
  - Sí, no tienen divisores comunes mayores a 1.
errores_frecuentes:
- Extraer un divisor numérico menor que el MCD dejando coeficientes dentro del paréntesis que no son primos entre sí.
- Intercambiar el procedimiento del Máximo Común Divisor (MCD) con el del Mínimo Común Múltiplo (MCM).
- Multiplicar los coeficientes en lugar de dividirlos por el MCD al armar el paréntesis.
- Ignorar el signo negativo de los coeficientes al calcular el MCD numérico.
- Olvidar incluir factores primos con exponente mayor a 1 en el MCD.
afirmaciones_verdaderas:
- El máximo factor común numérico es el MCD de todos los coeficientes enteros del polinomio.
- La extracción completa del MCD garantiza que los coeficientes dentro del paréntesis sean primos entre sí.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/determinacion-del-maximo-factor-comun-numerico-resumen.svg)


  QUÉ: Determinar el Máximo Común Divisor de coeficientes numéricos mediante descomposición en primos.

  CÓMO: Descomponer coeficientes en factores primos y calcular $\operatorname{MCD}(c_i) = \prod p^{\min(v_p(c_i))}$ asegurando
  que los coeficientes resultantes en el paréntesis sean primos entre sí.

  '
