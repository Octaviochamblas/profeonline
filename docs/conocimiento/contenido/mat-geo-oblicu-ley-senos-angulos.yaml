procedimiento:
- 'Paso 1: Identifica el lado y ángulo opuesto conocidos (el par completo), y el otro
  lado conocido.'
- 'Paso 2: Despeja el seno del ángulo buscado: sin(ángulo buscado)=lado_buscado×sin(ángulo
  conocido)/lado_conocido.'
- 'Paso 3: Aplica arcoseno para obtener el ángulo, verificando si corresponde considerar
  también la solución obtusa (caso ambiguo).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con cálculo de ángulos mediante la ley de senos.
