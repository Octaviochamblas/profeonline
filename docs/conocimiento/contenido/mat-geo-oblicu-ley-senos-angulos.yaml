semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.LEY_SENOS_ANGULOS
resumen_inicial: 'Cálculo de ángulos mediante la ley de senos: conceptos, teoremas,
  propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Cuando se conocen dos lados y el ángulo opuesto a uno de ellos,
  se puede despejar el seno del ángulo opuesto al otro lado, y de ahí obtener ese
  ángulo.
explicacion_formal: '![Cálculo de ángulos con ley de senos](/static/img/geometria/trigonometria/oblicu-ley-senos-angulos.svg)


  ### Definición formal


  De la proporción $\dfrac{a}{\sin A}=\dfrac{b}{\sin B}$, se despeja $\sin B=\dfrac{b\cdot\sin
  A}{a}$, y luego $B=\arcsin\left(\dfrac{b\cdot\sin A}{a}\right)$.


  ### Desarrollo didáctico


  Si $a=10$, $A=40°$ y $b=12$, entonces $\sin B=\dfrac{12\times\sin40°}{10}\approx\dfrac{12\times0{,}643}{10}\approx0{,}771$,
  por lo que $B\approx50{,}6°$ (considerando la solución aguda).'
definiciones_clave: '- **Cálculo de ángulos mediante la ley de senos**: Elemento o
  propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo de ángulos mediante la ley de senos.'
ejemplo_guiado:
  enunciado: Para analizar cálculo de ángulos mediante la ley de senos, considera
    un ángulo $\alpha = 54^\circ$ ubicado en la posición dada. Determina el valor
    de la medida asociada sabiendo que $x + 1149^\circ = 54^\circ$.
  pasos:
  - Identificar la propiedad de cálculo de ángulos mediante la ley de senos referida
    a $\alpha = 54^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1149 = 54 \implies x = 54 - 1149$.'
  - Concluir que la medida calculada para cálculo de ángulos mediante la ley de senos
    es $x = -1095^\circ$.
