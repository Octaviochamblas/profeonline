resumen_inicial: La traducción de un número disminuido en una cantidad en lenguaje
  algebraico vincula enunciados verbales con expresiones matemáticas precisas.
explicacion_simple: Para expresar un número disminuido en una cantidad, identificamos
  las letras que representan los números y usamos el símbolo matemático adecuado.
explicacion_formal: 'Sea $x, y \in \mathbb{R}$. La **Traducción de Un número disminuido
  en una cantidad** establece la asignación:


  $$\text{"un número k disminuido en 9"} \implies k - 9$$


  > **Complemento didáctico:** Esta traducción permite formalizar algebraicamente
  enunciados verbales en el dominio real.'
definiciones_clave: '- **Un número disminuido en una cantidad**: Representación simbólica
  en lenguaje algebraico.'
propiedades_relaciones: '- **Coherencia operacional**: k - 9 conserva el significado
  semántico del enunciado.'
