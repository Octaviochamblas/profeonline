semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.NUMERO_DISMINUIDO
resumen_inicial: 'Traducción de un número disminuido en una cantidad: traducción,
  reglas y aplicación práctica en Lenguaje algebraico: operaciones y múltiplos.'
explicacion_simple: Si a un estanque de agua se le hace un agujero, la cantidad de
  agua disminuye. Al igual que el concepto de 'aumentado', el álgebra tiene una traducción
  directa para cuando perdemos cantidad.
explicacion_formal: '### Definición formal


  Como es la variable la que sufre la disminución, ella va primero ($x - k$).


  ### Desarrollo didáctico


  Palabras clave:

  - Disminuido en

  - Reducido en

  - Rebajado en


  Ejemplos:

  - ''Un número disminuido en quince'': $x - 15$

  - ''El precio de la camisa reducido en un descuento desconocido'': $P - d$

  - ''Diez disminuido en un número'': $10 - x$


  Nuevamente, el orden es ley. Si la oración dice ''un número disminuido en siete'',
  el número es el que sufre la pérdida, por lo tanto él va primero: $x - 7$.'
definiciones_clave: '- **Traducción de un número disminuido en una cantidad**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de un número disminuido en una cantidad.'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de traducción
    de un número disminuido en una cantidad.
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a traducción de un número disminuido
    en una cantidad.
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
