semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.NUMERO_DISMINUIDO
resumen_inicial: La traducción de un número disminuido en una cantidad consiste en expresar la sustracción escalar de una constante o variable a una expresión previa utilizando el operador de resta $-$.
explicacion_simple: "Expresar un **número disminuido en una cantidad** significa **quitar, restar o descontar** una cifra a un valor inicial:\n- En español, las palabras **\"disminuido en\"**, **\"reducido en\"** o **\"menos\"** equivalen exactamente a realizar una **resta ($-$)**.\n- Estructura: `[Cantidad inicial] - [Cantidad que disminuye]`.\n- Ejemplos:\n  - \"Un número $x$ disminuido en $9$\" $\\implies **x - 9**$.\n  - \"El cuádruple de un número $a$ disminuido en $3$\" $\\implies **4a - 3**$.\n  - \"Una cantidad $m$ disminuida en otra cantidad $n$\" $\\implies **m - n**$.\n- **¡Atención!** El orden es fundamental. \"$x$ disminuido en $9$\" es **$x - 9$**. No vayas a escribir $9 - x$, porque estarías restando al revés.\n\n![Número Disminuido en una Cantidad](/static/img/nodos/traduccion-de-un-numero-disminuido-en-una-cantidad-intro.svg)\n"
explicacion_formal: '### Definición formal

  La traducción de un **decremento aditivo** mapea una expresión inicial $A \in \mathbb{R}[x]$ y un decremento $k \in \mathbb{R}$ mediante el operador de resta $- \in \text{Op}$:


  $$\Phi(\text{"}A \text{ disminuido en } k\text{"}) = A - k$$


  donde $A$ es el minuendo que sufre la reducción y $k$ es el sustraendo descontado.


  ### Equivalencia Semántica con Otras Expresiones Sustractivas


  $$\begin{array}{|c|c|}

  \hline

  \text{\textbf{Frase verbal (Lenguaje Natural)}} & \text{\textbf{Traducción algebraica}} \\

  \hline

  x \text{ disminuido en } k & x - k \\

  x \text{ reducido en } k & x - k \\

  k \text{ unidades menos que } x & x - k \\

  x \text{ menos } k & x - k \\

  \hline

  \end{array}$$


  ### Síntesis didáctica

  El descuento o disminución rige los problemas de pérdidas, depreciación de activos, descuentos porcentuales y diferencias temporales.

  '
definiciones_clave: '- **Número disminuido**: Expresión $x - k$ que representa el descuento de la cantidad $k$ respecto al valor inicial $x$.

  - **Decremento aditivo ($k$)**: Cantidad restada que produce la disminución de la magnitud base.

  - **Operador de disminución ($-$)**: Signo menos que ejecuta el descuento sobre la cantidad inicial.

  '
propiedades_relaciones: '- **No conmutatividad**: La frase "$x$ disminuido en $k$" ($x - k$) no es conmutativa y difiere en signo de "$k$ disminuido en $x$" ($k - x$).

  - **Representación de número impar ($2n - 1$)**: Expresión canónica para denotar un entero impar como un múltiplo par disminuido en 1.

  '
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "El triple del saldo de una cuenta ($s$) disminuido en cincuenta mil pesos".'
  pasos:
  - 'Paso 1: Identificamos la cantidad base: "El triple del saldo $s$" $\implies 3s$.'
  - 'Paso 2: Identificamos el decremento verbal: "disminuido en cincuenta mil" $\implies - 50000$.'
  - 'Paso 3: Unimos la cantidad base con el descuento: $3s - 50000$.'
  - 'Conclusión: La expresión traducida es **$3s - 50000$**.'
  imagen: /static/img/nodos/traduccion-de-un-numero-disminuido-en-una-cantidad-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué operador matemático se utiliza para traducir la frase "disminuido en" o "reducido en"?
  choices:
  - text: El operador de resta o sustracción ($-$) colocándolo después de la cantidad inicial
    is_correct: true
  - text: El operador de suma ($+$)
    is_correct: false
  - text: El operador de multiplicación ($\cdot$)
    is_correct: false
  - text: El operador de potencia ($^x$)
    is_correct: false
  explanation: La alternativa correcta es 'El operador de resta o sustracción ($-$) colocándolo después de la cantidad inicial'. "Disminuido en" indica resta.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿Cómo se traduce al lenguaje algebraico la frase "La cuarta parte de un número $x$ disminuida en dos"? '
  choices:
  - text: Se traduce como la expresión $\frac{x}{4} - 2$
    is_correct: true
  - text: Se traduce como la expresión $4x - 2$
    is_correct: false
  - text: Se traduce como la expresión $\frac{x - 2}{4}$
    is_correct: false
  - text: Se traduce como la expresión $2 - \frac{x}{4}$
    is_correct: false
  explanation: La alternativa correcta es 'Se traduce como la expresión $\frac{x}{4} - 2$'. Cuarta parte $\frac{x}{4}$ disminuida en dos $- 2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la cantidad o expresión inicial que va a sufrir la reducción.'
- 'Paso 2: Reconocer el conector de resta ("disminuido en", "reducido en", "menos").'
- 'Paso 3: Identificar la cantidad o cifra que se descuenta.'
- 'Paso 4: Escribir la expresión inicial seguida del signo $-$ y el decremento.'
errores_correccion: '- **Error 1:** Invertir los términos al traducir " $x$ disminuido en 5" escribiendo $5 - x$. **Cómo corregirlo:** El valor inicial $x$ va **ANTES del signo menos ($x - 5$)**.

  - **Error 2:** Escribir $\frac{x}{2}$ al traducir " $x$ disminuido en la mitad de $x$". **Cómo corregirlo:** "$x$ disminuido en su mitad" es **$x - \frac{x}{2}$**; exige la resta explícita.

  '
ejemplos:
- titulo: Disminución simple
  enunciado: ¿Cuál es la traducción de "Un número $a$ disminuido en once"?
  alternativas:
  - $a - 11$
  - $11 - a$
  - $a + 11$
  respuesta: $a - 11$
  solucion_pasos:
  - '1. Cantidad inicial: $a$.'
  - '2. Disminuido en 11: $- 11$.'
  - '3. Resultado: $a - 11$.'
- titulo: Disminución sobre producto
  enunciado: ¿Cuál es la traducción de "El quíntuple de $y$ disminuido en seis"?
  alternativas:
  - $5y - 6$
  - $6 - 5y$
  - $5(y - 6)$
  respuesta: $5y - 6$
  solucion_pasos:
  - 1. Quíntuple de $y \to 5y$.
  - '2. Disminuido en 6: $- 6$.'
  - '3. Expresión: $5y - 6$.'
- titulo: Número impar canónico
  enunciado: ¿Representa la expresión $2n - 1$ a cualquier número entero impar para $n \in \mathbb{Z}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, un número par $2n$ disminuido en $1$ produce siempre un número impar.
- titulo: Disminución entre variables
  enunciado: La frase "La cantidad $p$ disminuida en la cantidad $q$", ¿se traduce como $p - q$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la cantidad $p$ disminuida en $q$ da $p - q$.
errores_frecuentes:
- Invertir la posición de los términos escribiendo 5 - x al traducir x disminuido en 5.
- Intercambiar un número disminuido en su mitad con la mitad del número solamente.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Escribir el signo de división en lugar de la resta al traducir la frase disminuido en.
- Declarar que la expresión x disminuida en y es conmutativa y equivale a y - x.
afirmaciones_verdaderas:
- La frase verbal "disminuido en" se traduce al lenguaje algebraico mediante el operador de resta -.
- La cantidad inicial a la que se le descuenta el valor constituye el minuendo y se ubica a la izquierda del signo menos.
al_terminar_debes_poder: '![Resumen de número disminuido en una cantidad](/static/img/nodos/traduccion-de-un-numero-disminuido-en-una-cantidad-resumen.svg)


  QUÉ: Traducir decrementos sustractivos constantes expresados verbalmente como ''disminuido en''.


  CÓMO: Establecer la expresión base como minuendo y restar la constante indicada ($x - k$), evitando la inversión errónea del orden ($k - x$).'
