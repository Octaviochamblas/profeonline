- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de efecto de reducción en una homotecia
    con valor absoluto de la razón entre 0 y 1 y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
