semantic_id: MAT.GEO.HOMOTECIA.REDUCCION
resumen_inicial: 'Efecto de reducción en una homotecia con valor absoluto de la razón
  entre 0 y 1: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia,
  Semejanza y Homotecia.'
explicacion_simple: 'El caso opuesto a la ampliación ocurre cuando el valor absoluto
  de la razón es un número entre 0 y 1: la figura resultante es más pequeña que la
  original.'
explicacion_formal: '![Homotecia de reducción](/static/img/geometria/congruencia-semejanza/homotecia-reduccion.svg)


  ### Definición formal


  Si $0<|k|<1$, cada distancia en la figura imagen es $|k|$ veces la distancia correspondiente
  en la figura original (un valor menor), produciendo una figura más pequeña, sin
  importar el signo de $k$.


  ### Desarrollo didáctico


  Tanto k=0,5 como k=-0,5 producen una reducción a la mitad del tamaño, pero con orientación
  distinta: k=0,5 mantiene la orientación (directa), mientras que k=-0,5 la invierte
  respecto al centro (inversa).'
definiciones_clave: '- **Efecto de reducción en una homotecia con valor absoluto de
  la razón entre 0 y 1**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a efecto de reducción en una homotecia con valor
  absoluto de la razón entre 0 y 1.'
ejemplo_guiado:
  enunciado: En la aplicación de efecto de reducción en una homotecia con valor absoluto
    de la razón entre 0 y 1, se establece una razón $k = 3.6$ entre dos figuras homólogas
    de longitud original $L = 15\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de efecto de reducción en una homotecia con valor
    absoluto de la razón entre 0 y 1.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 3.6 \cdot 15$.'
  - Concluir que la medida obtenida en efecto de reducción en una homotecia con valor
    absoluto de la razón entre 0 y 1 es $L' = 54.0\text{ cm}$.
