semantic_id: MAT.ALG.FUNCION_AFIN.COEFICIENTE_POSICION
resumen_inicial: El coeficiente de posición $n$ es el término constante de la función afín $f(x) = mx + n$, que determina la ordenada del punto de corte de la recta con el eje $Y$ en $(0, n)$.
explicacion_simple: '![El coeficiente de posición $n$ es el término constante de la función afín $f(x) = mx + n$, que determina la ordenada del punto de corte de la recta con el eje $Y$ en $(0, n)$](/static/img/nodos/identificacion-del-coeficiente-de-posicion-intro.svg)



  El **coeficiente de posición** (que se anota con la letra $n$) es el número suelto que no tiene $x$ en la fórmula $f(x) = mx + n$.


  **¿Qué significa en el dibujo?**

  Es exactamente la altura donde la recta cruza el eje vertical $Y$:

  - Si $n > 0$, la recta corta al eje $Y$ por arriba del origen.

  - Si $n < 0$, la recta corta al eje $Y$ por debajo del origen.

  - El punto exacto de cruce es $(0, n)$.'
explicacion_formal: 'En la función afín $f(x) = mx + n$, el **coeficiente de posición** (o intercepto en $Y$) es el valor de la imagen evaluada en el origen de abscisas:

  $$n = f(0) = m(0) + n$$


  **Propiedades geométricas y analíticas:**

  - **Punto de corte con eje $Y$**: $P_Y = (0, n)$.

  - **Familia de rectas con igual $n$**: Conjunto de rectas concurrentes en el punto $(0, n)$ con diversas pendientes.

  - **Despeje desde la forma general**: En $Ax + By + C = 0$, el coeficiente de posición es $n = -\frac{C}{B}$ (para $B \neq 0$).'
definiciones_clave: '- **Coeficiente de posición $n$**: Término independiente que fija la altura de corte vertical de la recta.

  - **Ordenada en el origen**: Valor de $y$ cuando $x = 0$.'
propiedades_relaciones: '- **Traslación**: Modificar $n$ produce una traslación vertical rígida de la recta sin alterar su inclinación.

  - **Corte único**: Toda función afín posee exactamente un único corte con el eje $Y$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El coeficiente de posición $n$ es el término constante de la función afín $f(x) = mx + n$, que determina la ordenada del punto de corte de la recta con el eje $Y$ en $(0, n)$](/static/img/nodos/identificacion-del-coeficiente-de-posicion-ejemplos.svg)



    Determina el coeficiente de posición $n$ y las coordenadas del corte con el eje Y para la función $f(x) = \frac{8 - 6x}{2}$.'
  pasos:
  - 'Paso 1: Separar la fracción en dos términos: $f(x) = \frac{8}{2} - \frac{6x}{2}$.'
  - 'Paso 2: Simplificar: $f(x) = 4 - 3x = -3x + 4$.'
  - 'Paso 3: Identificar el término constante: $n = 4$.'
  - 'Paso 4: Escribir las coordenadas del punto de corte con el eje Y: $(0, 4)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el coeficiente de posición de la función $f(x) = -5x - 14$?
  choices:
  - text: n = -14
    is_correct: true
  - text: n = 14
    is_correct: false
  - text: n = -5
    is_correct: false
  - text: n = 5
    is_correct: false
  explanation: La alternativa correcta es 'n = -14'. El término constante es $-14$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una recta afín tiene pendiente $m = 2$ y pasa por el punto $(0, -9)$, ¿cuál es su fórmula?
  choices:
  - text: f(x) = 2x - 9
    is_correct: true
  - text: f(x) = 2x + 9
    is_correct: false
  - text: f(x) = -9x + 2
    is_correct: false
  - text: f(x) = 2x
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 2x - 9'. Al pasar por $(0, -9)$, el coeficiente de posición es $n = -9$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ordenar la función en la forma $f(x) = mx + n$.'
- 'Paso 2: Localizar el término numérico constante que no posee la variable $x$.'
- 'Paso 3: Conservar estrictamente el signo del término para definir $n$.'
- 'Paso 4: Expresar el punto de intersección con el eje Y como el par ordenado $(0, n)$.'
errores_correccion: '- **Error común:** Confundir el coeficiente de posición con la pendiente cuando la función está escrita al revés (ej: en $f(x) = 12 - 3x$, decir $n = -3$).

  - **Cómo corregirlo:** La pendiente $m$ siempre acompaña a la $x$; el coeficiente de posición $n$ es el número que está **completamente solo** ($n = 12$).'
ejemplos:
- titulo: 'Ejemplo 1: Identificación con signo negativo'
  enunciado: En $f(x) = 3x - 18$, ¿cuál es el valor de $n$?
  alternativas:
  - '-18'
  - '18'
  - '3'
  - '-3'
  respuesta: '-18'
  solucion_pasos:
  - 'Paso 1: El término independiente es $-18$, luego $n = -18$.'
- titulo: 'Ejemplo 2: Corte en el eje vertical'
  enunciado: ¿En qué punto corta al eje Y la recta $y = -7x + 2$?
  alternativas:
  - (0, 2)
  - (2, 0)
  - (0, -7)
  - (-7, 2)
  respuesta: (0, 2)
  solucion_pasos:
  - 'Paso 1: Para $x = 0$, $y = 2$. El punto es $(0, 2)$.'
- titulo: 'Ejemplo 3: Despeje desde forma general'
  enunciado: Halla $n$ en $3x - 4y = 12$.
  alternativas:
  - '-3'
  - '3'
  - '12'
  - '-4'
  respuesta: '-3'
  solucion_pasos:
  - 'Paso 1: $-4y = -3x + 12 \implies y = \frac{3}{4}x - 3 \implies n = -3$.'
- titulo: 'Ejemplo 4: Coeficiente fraccionario'
  enunciado: Si $g(x) = 2x - \frac{5}{3}$, ¿cuál es el coeficiente de posición?
  alternativas:
  - -5/3
  - 5/3
  - '2'
  - '-2'
  respuesta: -5/3
  solucion_pasos:
  - 'Paso 1: $n = -\frac{5}{3}$.'
errores_frecuentes:
- Olvidar el signo negativo al extraer n.
- Confundir n con la abscisa en el origen (-n/m).
- Escribir el corte con el eje Y como (n, 0) en vez de (0, n).
afirmaciones_verdaderas:
- El coeficiente de posición n es el valor de f(0), indicando la ordenada del corte con el eje Y.
- Toda función afín con n > 0 corta al eje Y en su semieje positivo.
al_terminar_debes_poder: '**QUÉ:** Identificar e interpretar el coeficiente de posición n en funciones afines.


  **CÓMO:** Aislando el término independiente y determinando las coordenadas exactas del corte con el eje de las ordenadas (0, n).


