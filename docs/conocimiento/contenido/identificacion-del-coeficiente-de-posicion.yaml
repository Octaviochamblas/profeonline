semantic_id: MAT.ALG.FUNCION_AFIN.COEFICIENTE_POSICION
resumen_inicial: El coeficiente de posición $b$ es la constante de la función afín $f(x) = mx + b$ que determina la altura donde la recta intersecta al eje $Y$.
explicacion_simple: |
  En una función afín $f(x) = mx + b$:

  - El **coeficiente de posición es el número libre $b$** (el término independiente sin $x$).
  - Te dice a qué altura la recta cruza la línea vertical del gráfico (eje $Y$).
  - Las coordenadas de ese cruce son siempre **$(0, b)$**.
explicacion_formal: |
  Sea $f(x) = mx + b$ una función afín. El **coeficiente de posición** (u ordenada al origen) es la constante real $b \in \mathbb{R}$ que satisface:

  $$b = f(0)$$

  **Significado geométrico y analítico:**
  - El par ordenado $(0, b)$ representa el punto de corte exacto entre el gráfico de la función $f$ y el eje de las ordenadas $Y$.
  - Desplaza verticalmente la recta $y = mx$ en $|b|$ unidades (hacia arriba si $b > 0$, hacia abajo si $b < 0$).
definiciones_clave: |
  - **Coeficiente de posición ($b$)**: Término independiente constante de la función afín que define el intercepto vertical $(0, b)$.
propiedades_relaciones: |
  - **Distinción con función lineal**: Si $b = 0$, la función es lineal y pasa por $(0,0)$; si $b \neq 0$, es afín y no pasa por el origen.
ejemplo_guiado:
  enunciado: "Identifica el coeficiente de posición en las funciones $f(x) = -3x + 8$ y $g(x) = 5x - 2$, y entrega sus puntos de corte con el eje $Y$."
  pasos:
    - 'Paso 1: Para $f(x) = -3x + 8$: el término libre es $+8 \implies$ coeficiente de posición $b = 8$. El corte con el eje $Y$ es $(0, 8)$.'
    - 'Paso 2: Para $g(x) = 5x - 2$: el término libre es $-2 \implies$ coeficiente de posición $b = -2$. El corte con el eje $Y$ es $(0, -2)$.'
    - 'Paso 3: Concluir que los coeficientes de posición son $b_f = 8$ y $b_g = -2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el coeficiente de posición y el punto de corte con el eje $Y$ para la función $g(x) = 5x - 2$?'
    choices:
      - {text: '$b = -2$ y corte en $(0, -2)$', is_correct: true}
      - {text: '$b = 5$ y corte en $(5, 0)$', is_correct: false}
      - {text: '$b = 2$ y corte en $(2, 0)$', is_correct: false}
      - {text: '$b = -2$ y corte en $(-2, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$b = -2$ y corte en $(0, -2)$''. El coeficiente independiente es $b = -2$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué valor toma la función afín $f(x) = mx + b$ cuando se evalúa en $x = 0$?'
    choices:
      - {text: 'Es igual a $b$ (el coeficiente de posición).', is_correct: true}
      - {text: 'Es igual a $m$ (la pendiente).', is_correct: false}
      - {text: 'Es igual a cero.', is_correct: false}
      - {text: 'Es igual a $m + b$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Es igual a $b$ (el coeficiente de posición).''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la constante numérica independiente (que no está multiplicada por $x$).'
  - 'Paso 2: Conservar el signo (+ o -) que antecede a la constante.'
  - 'Paso 3: Declarar dicha constante como el coeficiente de posición $b$.'
  - 'Paso 4: Escribir el punto de corte cartesiano en el eje $Y$ como $(0, b)$.'
errores_correccion: |
  - **Error común:** Olvidar el signo negativo al extraer $b$ en expresiones como $f(x) = 4x - 9$.
  - **Cómo corregirlo:** El signo forma parte del coeficiente de posición: en $f(x) = 4x - 9$, el coeficiente de posición es **$b = -9$**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En la función afín $f(x) = 4x - 9$, el coeficiente de posición es igual al número positivo $b = 9$.'
  - 'El coeficiente de posición $b$ indica la abscisa del punto de corte de la recta con el eje $X$.'
  - 'Una función afín con coeficiente de posición $b = 0$ no puede ser graficada en el plano cartesiano.'
  - 'El coeficiente de posición de una función afín se calcula multiplicando la pendiente $m$ por la constante $x$.'
  - 'Dos rectas afines con el mismo coeficiente de posición $b_1 = b_2$ son siempre paralelas de forma obligatoria.'
afirmaciones_verdaderas:
  - 'El coeficiente de posición $b$ de una función afín $f(x) = mx + b$ es la ordenada al origen, correspondiente a la imagen $f(0) = b$.'
  - 'Geométricamente, $b$ representa el valor exacto donde la recta intersecta al eje vertical $Y$ en el punto $(0, b)$.'
al_terminar_debes_poder: |
  QUÉ: Identificar el coeficiente de posición $b$ de una función afín y determinar el intercepto vertical.
  CÓMO: Extraer el término independiente $b = f(0)$ con su signo correspondiente y formar el par ordenado $(0, b)$.
