semantic_id: MAT.ALG.FUNCION_AFIN.COEFICIENTE_POSICION
resumen_inicial: 'Identificación del coeficiente de posición: conceptos, representación
  y propiedades en Función afín.'
explicacion_simple: 'El segundo parámetro de la función afín responde a una pregunta
  distinta a la pendiente: ¿en qué altura empieza la recta cuando $x$ vale cero?'
explicacion_formal: '### Definición formal


  Dada $f(x) = mx + n$, el coeficiente de posición satisface $n = f(0)$, ya que al
  evaluar en $x=0$ el término $mx$ se anula. Geométricamente, $n$ es la ordenada del
  punto donde la recta corta al eje $y$: el punto $(0, n)$.


  ### Desarrollo didáctico


  A diferencia de la pendiente, que controla la inclinación, $n$ controla la posición
  vertical de toda la recta: aumentar $n$ desplaza la recta hacia arriba, disminuirlo
  la desplaza hacia abajo.


  Si un plan de celular cuesta \$8000 fijos más \$50 por minuto, $C(x)=50x+8000$:
  el coeficiente de posición $8000$ representa el costo cuando no se usa ningún minuto
  ($x=0$).'
definiciones_clave: '- **Identificación del coeficiente de posición**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a identificación del coeficiente de posición.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a identificación del
    coeficiente de posición.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a identificación del coeficiente
    de posición.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
