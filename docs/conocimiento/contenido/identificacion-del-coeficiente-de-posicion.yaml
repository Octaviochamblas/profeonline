semantic_id: MAT.ALG.FUNCION_AFIN.COEFICIENTE_POSICION
resumen_inicial: El coeficiente de posición $n$ es el término independiente de la
  función afín $f(x) = m x + n$ e indica la coordenada $y$ de corte con el eje vertical.
explicacion_simple: 'El **coeficiente de posición** (término independiente $n$) es
  el número suelto que no lleva variable $x$.

  - Nos indica la altura a la que la recta cruza el eje vertical $Y$.

  - Por ejemplo, en $f(x) = 4x + 6$, el coeficiente de posición es $n = 6$, lo que
  significa que la recta corta al eje $Y$ a una altura de $6$ en el punto $(0, 6)$.'
explicacion_formal: 'En la función afín $f(x) = m x + n$, el **coeficiente de posición
  $n$** se evalúa como:


  $$n = f(0) = \left. m x + n \right|_{x = 0}$$


  **Desglose de la fórmula:**

  - Valor de la ordenadas cuando la variable de entrada es nula ($x = 0$), definiendo
  la intersección $(0, n)$.'
definiciones_clave: '- **Coeficiente de posición ($n$)**: Término aditivo constante
  que desplaza verticalmente la gráfica de la recta.'
propiedades_relaciones: '- **Traslación vertical**: Cambiar el valor de $n$ desplaza
  la recta hacia arriba (si $n > 0$) o hacia abajo (si $n < 0$).'
ejemplo_guiado:
  enunciado: Dada la función afín $f(x) = 7x - 9$, identifica su coeficiente de posición
    y describe el desplazamiento vertical respecto a $g(x) = 7x$.
  pasos:
  - 'Paso 1: Identificar el término constante suelto en $f(x) = 7x - 9$: $n = -9$.Paso
    2: Confirmar la intersección con el eje $Y$: $(0, -9)$.Paso 3: Notar que la recta
    $f(x)$ es paralela a $g(x) = 7x$ pero desplazada $9$ unidades hacia abajo.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función afín $f(x) = 7x - 9$, ¿cuál es el coeficiente de posición
    $n$?
  choices:
  - text: $n = -9$
    is_correct: true
  - text: $n = 7$
    is_correct: false
  - text: $n = 9$
    is_correct: false
  - text: $n = 0$
    is_correct: false
  explanation: La alternativa correcta es '$n = -9$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué efecto geométrico produce cambiar el parámetro $n = -9$ por $n =
    +4$ manteniendo la misma pendiente $m = 7$?
  choices:
  - text: Desplaza la recta verticalmente hacia arriba hasta cortar el eje Y en $(0,
      4)$.
    is_correct: true
  - text: Cambia la inclinación de la recta.
    is_correct: false
  - text: Hace que la recta pase por el origen.
    is_correct: false
  - text: Invierte la dirección de la pendiente.
    is_correct: false
  explanation: La alternativa correcta es 'Desplaza la recta verticalmente hacia arriba
    hasta cortar el eje Y en $(0, 4)$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el término numérico constante en la fórmula.'
- 'Paso 2: Conservar el signo (+ o -) que acompaña al término constante.'
- 'Paso 3: Declarar $n$ como el coeficiente de posición e indicar su intersección
  $(0, n)$.'
errores_correccion: '- **Error común:** Confundir el coeficiente de posición $n$ con
  la intersección con el eje $X$.

  - **Cómo corregirlo:** El coeficiente de posición $n$ es la intersección con el
  eje VERTICAL $Y$ (ordenadas), no con el horizontal $X$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de función afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función afín f(x) = mx + n con n != 0 pasa por el origen (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - No, porque f(0) = n != 0.
- titulo: ¿El coeficiente de posición n indica la ordenada de corte con el eje Y?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta corta al eje Y en el punto (0, n).
errores_frecuentes:
- Confundir el coeficiente de posición $n$ (corte con el eje $Y$) con la intersección
  con el eje $X$.
- Asumir que la pendiente es siempre el primer número escrito en la fórmula sin verificar
  si acompaña a la variable $x$.
- Responder la intersección con un eje entregando solo un número suelto en lugar del
  par ordenado correspondiente.
- Confundir 'el cero de una función' (resolver $f(x)=0$) con 'evaluar en cero' (calcular
  $f(0)$).
- Cometer errores de signo al restar coordenadas negativas al aplicar la fórmula punto-pendiente.
afirmaciones_verdaderas:
- La función afín $f(x) = m x + n$ corta al eje vertical $Y$ en el punto $(0, n)$
  y al eje horizontal $X$ en $\left(-\frac{n}{m}, 0\right)$.
- La gráfica de una función afín es paralela a la gráfica de la función lineal $g(x)
  = m x$ trasladada verticalmente $n$ unidades.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y graficar
  funciones afines, identificando pendiente, coeficiente de posición, intersecciones
  con los ejes, ceros y fórmulas desde dos puntos.
