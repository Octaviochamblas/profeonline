semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.CENTRO
resumen_inicial: El centro es el punto interior coplanar que equidista de absolutamente todos los puntos de la circunferencia.
explicacion_simple: 'El **centro** es el corazón de la figura: un punto fijo interior desde el cual todo está a la misma distancia. Si colocas la punta metálica de un compás en un punto fijo sobre la hoja y dibujas, ese punto fijo es el **centro** (se suele nombrar con la letra $O$).


  Aunque la circunferencia se dibuja gracias al centro, hay un detalle que suele pillar a muchos estudiantes: **el centro NO forma parte de la circunferencia** (porque la circunferencia es solo la línea de afuera). El centro está adentro, en el círculo, y es el punto medio exacto de cualquier diámetro que puedas trazar.


  ![Identificación del centro](/static/img/nodos/identificacion-del-centro-de-una-circunferencia-intro.svg)

  '
explicacion_formal: '### Definición formal del centro

  Sea $\mathcal{C}$ una circunferencia en el plano euclidiano. Se define el **centro** $O \in \mathbb{R}^2$ como el único punto coplanar que satisface la propiedad de equidistancia universal con respecto a todos los puntos de $\mathcal{C}$:

  $$\exists ! O \in \mathbb{R}^2 \quad \text{tal que} \quad \forall P \in \mathcal{C}, \quad d(P, O) = r = \text{constante} > 0$$


  ### Pertenencia conjuntista

  - **Respecto a la circunferencia:** Como $d(O, O) = 0 \neq r$, el centro no satisface la ecuación de la curva: $O \notin \mathcal{C}$.

  - **Respecto al círculo:** Como $d(O, O) = 0 \le r$, el centro pertenece al conjunto del círculo cerrado: $O \in \mathcal{K}$.


  ### Construcción geométrica euclidiana (Regla y Compás)

  Para localizar el centro de una circunferencia dada sin marcas previas:

  1. Se trazan dos cuerdas secantes no paralelas $\overline{AB}$ y $\overline{CD}$.

  2. Se construyen las mediatrices $\mathcal{M}_{AB}$ y $\mathcal{M}_{CD}$ de ambas cuerdas.

  3. Por el teorema de la mediatriz euclidiana, el centro $O$ es el punto único de intersección:

  $$O = \mathcal{M}_{AB} \cap \mathcal{M}_{CD}$$


  > **Complemento didáctico:** Una pregunta clásica de selección múltiple dice: ''¿Pertenece el centro a la circunferencia?''. ¡Cuidado con decir que sí! El centro pertenece al CÍRCULO (zona interior), pero NO a la circunferencia (la línea curva del contorno).

  '
definiciones_clave: '- **Centro ($O$)**: Punto del plano respecto del cual todos los puntos de la circunferencia se encuentran a la misma distancia.

  - **Equidistancia**: Propiedad geométrica por la cual todas las distancias euclidianas $d(P, O)$ son rigurosamente idénticas.

  - **Mediatriz de una cuerda**: Recta perpendicular que biseca a una cuerda y pasa obligatoriamente por el centro.

  '
propiedades_relaciones: '- **Punto de simetría central**: La circunferencia es invariante bajo una rotación de $180^\circ$ en torno a su centro $O$.

  - **Punto medio diametral**: Si $\overline{AB}$ es cualquier diámetro, $O$ es el punto medio exacto: $O = \frac{A + B}{2}$.

  - **Coordenadas en la ecuación canónica**: En la ecuación $(x - h)^2 + (y - k)^2 = r^2$, el centro tiene coordenadas explícitas $(h, k)$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de centro de circunferencia](/static/img/nodos/identificacion-del-centro-de-una-circunferencia-ejemplos.svg)


    Un diámetro de una circunferencia tiene por extremos los puntos $A(2, -3)$ y $B(8, 5)$. Determina las coordenadas del centro $O$ y la longitud de su radio $r$.'
  pasos:
  - 'Paso 1: Recordar que el centro es el punto medio del diámetro: $O = \left(\frac{x_1 + x_2}{2}, \frac{y_1 + y_2}{2}\right)$.'
  - 'Paso 2: Sustituir las coordenadas: $h = \frac{2 + 8}{2} = \frac{10}{2} = 5$ y $k = \frac{-3 + 5}{2} = \frac{2}{2} = 1$. Luego el centro es $O(5, 1)$.'
  - 'Paso 3: Calcular el radio como la distancia del centro $O(5, 1)$ a uno de los extremos $A(2, -3)$: $r = \sqrt{(5 - 2)^2 + (1 - (-3))^2}$.'
  - 'Paso 4: Resolver algebraicamente: $r = \sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes afirmaciones sobre el centro de una circunferencia es verdadera?
  choices:
  - text: Equidista de todos los puntos de la circunferencia pero no pertenece a la curva.
    is_correct: true
  - text: Es un punto de la circunferencia que tiene distancia cero a los demás bordes.
    is_correct: false
  - text: Depende de la posición de la cuerda más larga trazada.
    is_correct: false
  - text: Tiene una distancia igual a dos veces el radio respecto al borde.
    is_correct: false
  explanation: La alternativa correcta es 'Equidista de todos los puntos de la circunferencia pero no pertenece a la curva.' El centro es interior, equidistante a distancia $r$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se puede hallar con exactitud el centro de una circunferencia utilizando cuerdas?
  choices:
  - text: Intersecando las mediatrices de dos cuerdas no paralelas.
    is_correct: true
  - text: Sumando las longitudes de dos radios consecutivos.
    is_correct: false
  - text: Trazando dos rectas tangentes paralelas entre sí.
    is_correct: false
  - text: Multiplicando la longitud de dos arcos de 90°.
    is_correct: false
  explanation: La alternativa correcta es 'Intersecando las mediatrices de dos cuerdas no paralelas.' La mediatriz de cualquier cuerda contiene al centro; su cruce determina $O$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Para hallar el centro conociendo un diámetro, calcular el punto medio de sus extremos: $O = ((x_1+x_2)/2, (y_1+y_2)/2)$.

  2. En geometría con regla y compás, trazar dos cuerdas y hallar la intersección de sus mediatrices.

  3. A partir de la ecuación canónica $(x - h)^2 + (y - k)^2 = r^2$, extraer directamente el punto $(h, k)$.

  4. Verificar que la distancia desde $O$ a cualquier punto del contorno sea constante e igual a $r$.

  '
errores_correccion: '- **Error común 1:** Afirmar que el centro pertenece a la circunferencia. **Corrección:** El centro es interior; solo pertenece al círculo.

  - **Error común 2:** Cambiar los signos incorrectamente al extraer $(h, k)$ de la ecuación canónica. **Corrección:** En $(x - 3)^2 + (y + 4)^2 = 25$, el centro es $(3, -4)$.

  '
ejemplos:
- tipo: A
  titulo: Centro desde ecuación canónica
  enunciado: Dada la ecuación $(x + 2)^2 + (y - 7)^2 = 16$, ¿cuáles son las coordenadas del centro $O$?
  alternativas:
  - text: $(-2, 7)$.
    is_correct: true
  - text: $(2, -7)$.
    is_correct: false
  - text: $(2, 7)$.
    is_correct: false
  - text: $(-2, -7)$.
    is_correct: false
  explicacion: Comparando con $(x - h)^2 + (y - k)^2 = r^2$, $h = -2$ y $k = 7$, luego $O(-2, 7)$.
- tipo: B
  titulo: Equidistancia del centro
  enunciado: ¿Es la distancia desde el centro a cualquier punto de la circunferencia siempre la misma?
  respuesta: Sí
  explicacion: Sí. Por definición de circunferencia, la distancia desde el centro a todos sus puntos es una constante fija $r$.
errores_frecuentes:
- '''Afirmar que el centro es un punto de la circunferencia.'''
- '''Confundir el centro con el punto medio de una cuerda cualquiera.'''
- '''Invertir los signos al leer las coordenadas del centro en la ecuación cartesiana.'''
afirmaciones_verdaderas:
- '''El centro es el punto equidistante de todos los puntos de la circunferencia.'''
- '''El centro es el punto medio de cualquier diámetro.'''
- '''La mediatriz de cualquier cuerda de una circunferencia pasa por su centro.'''
al_terminar_debes_poder: '**QUÉ:** Identificar, ubicar y calcular las coordenadas del centro de una circunferencia analítica y geométricamente.


  **CÓMO:** Empleando el punto medio del diámetro $O = \frac{A + B}{2}$ y la intersección de mediatrices.


  ![Síntesis de centro](/static/img/nodos/identificacion-del-centro-de-una-circunferencia-resumen.svg)

  '
