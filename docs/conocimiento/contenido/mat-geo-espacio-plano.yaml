semantic_id: MAT.GEO.ESPACIO_FUNDAMENTOS.PLANO_ESPACIO
resumen_inicial: 'Concepto de plano en el espacio: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'El plano es a la geometría del espacio lo que una hoja infinita
  y perfectamente plana sería: una superficie que se extiende en todas direcciones
  sin curvarse ni tener bordes.'
explicacion_formal: '![Plano en el espacio](/static/img/geometria/espacio-cuerpos/espacio-plano.svg)


  ### Definición formal


  Un plano $\alpha$ es una superficie infinita y bidimensional, sin curvatura, que
  se extiende en todas direcciones. Queda determinado de forma única por tres puntos
  no alineados, por dos rectas que se cruzan, o por una recta y un punto exterior
  a ella.


  ### Desarrollo didáctico


  En la figura, el plano $\alpha$ contiene la cara superior de un cuerpo geométrico
  (los cuatro vértices D, C, G y H), representando una porción visible de ese plano
  infinito, que en realidad se extendería más allá de los límites del cuerpo geométrico.'
definiciones_clave: '- **Concepto de plano en el espacio**: Elemento o propiedad fundamental
  en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a concepto de plano en el espacio.'
