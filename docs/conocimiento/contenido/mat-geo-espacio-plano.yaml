procedimiento:
- 'Paso 1: Identifica al menos tres puntos no alineados (o dos rectas que se cruzan)
  que determinen el plano.'
- 'Paso 2: Reconoce que el plano se extiende infinitamente en todas direcciones, más
  allá de la región visible en la figura.'
- 'Paso 3: Denota el plano con una letra griega minúscula (como α, β) o mediante tres
  de sus puntos.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con concepto de plano en el espacio.
