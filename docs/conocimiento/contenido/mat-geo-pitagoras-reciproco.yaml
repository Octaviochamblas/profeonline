semantic_id: MAT.GEO.PITAGORAS.RECIPROCO
resumen_inicial: 'Recíproco del teorema de Pitágoras para verificar si un triángulo
  es rectángulo: conceptos, teoremas, propiedades geométricas y cálculo en Perímetros,
  Áreas y Teoremas.'
explicacion_simple: 'El teorema de Pitágoras no solo permite calcular lados de un
  triángulo YA SABIDO rectángulo: su versión recíproca permite, al revés, verificar
  si un triángulo de lados conocidos es rectángulo o no.'
explicacion_formal: '![Recíproco del teorema de Pitágoras](/static/img/geometria/areas-pitagoras/pitagoras-reciproco.svg)


  ### Definición formal


  Si un triángulo tiene lados $a\leq b\leq c$ y se cumple $c^2=a^2+b^2$, entonces
  el triángulo es rectángulo, con el ángulo recto opuesto al lado $c$.


  ### Desarrollo didáctico


  Para verificar si un triángulo de lados 6, 8 y 10 es rectángulo, se comprueba: $10^2=8^2+6^2
  \Rightarrow 100=64+36=100$; se cumple, así que el triángulo es rectángulo.'
definiciones_clave: '- **Recíproco del teorema de Pitágoras para verificar si un triángulo
  es rectángulo**: Elemento o propiedad fundamental en el estudio de perímetros, áreas
  y teoremas.'
