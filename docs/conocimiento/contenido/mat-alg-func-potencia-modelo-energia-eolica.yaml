procedimiento:
- 'Paso 1: Identifica la constante $k$ y la velocidad $v$ en el problema.'
- 'Paso 2: Evalúa $P(v)=k\cdot v^3$ para calcular la potencia en un punto dado.'
- 'Paso 3: Para comparar dos velocidades, calcula la razón de sus cubos para determinar
  el factor de cambio.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en modelamiento de potencia de aerogeneradores mediante funciones
  cúbicas.
ejemplos:
- titulo: Cálculo directo de potencia eólica
  enunciado: Con $k=2$, calcula la potencia generada a $v=5$ m/s.
  solucion_pasos:
  - Se evalúa $P(5)=2\cdot5^3=2\cdot125=250$.
  - La potencia generada es $250$ (en las unidades correspondientes).
- titulo: Efecto de duplicar la velocidad del viento
  enunciado: ¿Por qué factor cambia la potencia si la velocidad del viento se duplica?
  solucion_pasos:
  - Se compara $P(2v)=k(2v)^3=8kv^3=8P(v)$.
  - La potencia se multiplica por $8$.
- titulo: ¿La potencia eólica depende linealmente de la velocidad del viento?
  enunciado: ¿La relación entre potencia y velocidad del viento en un aerogenerador
    es lineal?
  respuesta: 'No'
  solucion_pasos:
  - La relación es cúbica ($n=3$), no lineal.
- titulo: ¿Triplicar la velocidad del viento multiplica la potencia por $9$?
  enunciado: ¿Triplicar la velocidad del viento multiplica la potencia generada por
    un factor de $9$?
  respuesta: 'No'
  solucion_pasos:
  - Se multiplica por $3^3=27$, no por $9$, ya que la relación es cúbica.
errores_frecuentes:
- Suponer que la potencia eólica depende linealmente o cuadráticamente de la velocidad,
  en vez de cúbicamente.
- Calcular mal el factor de cambio al comparar dos velocidades distintas.
- No verificar que la velocidad del viento sea un valor físicamente razonable (no
  negativo).
- Confundir la constante $k$ con la velocidad $v$ al aplicar la fórmula.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  modelamiento de potencia de aerogeneradores mediante funciones cúbicas.
