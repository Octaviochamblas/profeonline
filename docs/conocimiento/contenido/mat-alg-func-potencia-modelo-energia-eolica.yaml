  - 'En la función $P(v) = k v^3$, se multiplica $k \cdot v$ antes de elevar al cubo.'
  - 'La velocidad del viento en un aerogenerador se ubica en el exponente de la función.'
  - 'Un incremento de velocidad del viento al triple produce 9 veces más energía eólica.'
