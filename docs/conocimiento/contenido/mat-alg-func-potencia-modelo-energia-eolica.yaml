semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.ENERGIA_EOLICA
resumen_inicial: 'Modelamiento de potencia de aerogeneradores mediante funciones cúbicas:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Modelamiento y aplicaciones
  en contexto.'
explicacion_simple: La energía que puede extraer un aerogenerador no depende linealmente
  de la velocidad del viento, sino de su cubo, lo que explica por qué pequeños cambios
  de viento generan grandes diferencias de energía.
explicacion_formal: '### Definición formal


  El modelo físico de potencia eólica es $P(v)=k\cdot v^3$, con $k>0$ constante y
  $v\geq0$ la velocidad del viento. Al ser un modelo de función potencia con $n=3$,
  la potencia crece de forma acelerada respecto a la velocidad.


  ### Desarrollo didáctico


  Si $k=0{,}5$ y la velocidad pasa de $4$ m/s a $8$ m/s: $P(4)=0{,}5\cdot64=32$ y
  $P(8)=0{,}5\cdot512=256$. La potencia se multiplicó por $8$, consistente con $2^3=8$,
  al duplicarse la velocidad.'
definiciones_clave: '- **Modelamiento de potencia de aerogeneradores mediante funciones
  cúbicas**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a modelamiento de potencia de aerogeneradores mediante funciones
  cúbicas.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de modelamiento de potencia de aerogeneradores mediante funciones cúbicas.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de modelamiento de potencia
    de aerogeneradores mediante funciones cúbicas.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
