semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.ENERGIA_EOLICA
resumen_inicial: 'La potencia eléctrica generada por un aerogenerador eólico responde a un modelo de función potencia cúbica respecto a la velocidad del viento $P(v) = k \cdot v^3$.'
explicacion_simple: |
  En la física de la energía eólica, la energía producida por las aspas de un molino de viento no depende proporcionalmente de la velocidad del viento, sino del cubo de su velocidad ($v^3$). La razón física es que el flujo de masa de aire que cruza las aspas depende de la velocidad $v$, y la energía cinética de ese aire depende del cuadrado de la velocidad $v^2$. Al multiplicarlas, obtenemos un modelo cúbico $P(v) = k \cdot v^3$. Esto significa que un pequeño aumento en el viento produce un incremento gigantesco en la energía generada.
explicacion_formal: |
  ### Definición formal
  El **modelo de generación eólica** para la potencia utilizable de una turbina eólica de área de barrido $A$ y densidad del aire $\rho$ viene dado por la **función potencia de exponente 3**:
  $$P(v) = k \cdot v^3 \quad \text{donde } k = \frac{1}{2} C_p \rho A$$
  donde:
  - **$v$**: Velocidad del viento incidente (m/s), variable independiente en la base.
  - **$P(v)$**: Potencia eléctrica extraída (Watts), variable dependiente.
  - **$k$**: Coeficiente global de eficiencia y geometría de la turbina ($k > 0$).
  - **$C_p$**: Coeficiente de potencia de Betz ($C_p \le 0.593$).

  ### Sensibilidad Cúbica al Viento
  - Si la velocidad del viento se incrementa por un factor $c \implies P(c \cdot v) = k (c v)^3 = c^3 (k v^3) = c^3 P(v)$.
  - **Duplicación del viento ($c = 2$)**: $P(2v) = 2^3 P(v) = 8 P(v)$ (Multiplica la potencia generada por **8 veces**).
  - **Triplicación del viento ($c = 3$)**: $P(3v) = 3^3 P(v) = 27 P(v)$ (Multiplica la potencia generada por **27 veces**).

  ### Síntesis didáctica
  Justificación del exponente 3:
  1. Masa de aire que choca por segundo: $\dot{m} = \rho A v \propto v$.
  2. Energía cinética por unidad de masa: $e_c = \frac{1}{2} v^2 \propto v^2$.
  3. Potencia total $\dot{E} = \dot{m} \cdot e_c \propto v \cdot v^2 = v^3$.
definiciones_clave: |
  - **Modelo eólico cúbico $P(v) = k \cdot v^3$**: Función potencia que vincula la velocidad del viento con la potencia eléctrica producida.
  - **Sensibilidad cúbica**: Propiedad por la cual variaciones en la velocidad impactan elevadas al cubo en la potencia.
  - **Límite de Betz $C_p$**: Límite físico máximo de eficiencia teórica de conversión (59.3%).
propiedades_relaciones: |
  - **Dominio contextual**: $v \in [v_{\text{inicio}}, v_{\text{corte}}]$, acotado por la velocidad mínima de arranque y la velocidad de seguridad por tormentas.
  - **Recorrido contextual**: $P \in [0, P_{\text{nominal}}]$.
ejemplo_guiado:
  enunciado: 'Un aerogenerador posee una constante de eficiencia $k = 0.5 \text{ W/(m/s)}^3$. Calcula la potencia generada para una velocidad del viento de $v_1 = 6 \text{ m/s}$ y para $v_2 = 12 \text{ m/s}$, e interpreta el factor de incremento.'
  pasos:
    - 'Paso 1: Evaluamos a $v_1 = 6 \text{ m/s}$: $P(6) = 0.5 \cdot (6)^3 = 0.5 \cdot 216 = 108 \text{ Watts}$.'
    - 'Paso 2: Evaluamos a $v_2 = 12 \text{ m/s}$: $P(12) = 0.5 \cdot (12)^3 = 0.5 \cdot 1728 = 864 \text{ Watts}$.'
    - 'Paso 3: Calculamos la razón de potencia: $\frac{P(12)}{P(6)} = \frac{864}{108} = 8$.'
    - 'Paso 4: Conclusión: Al duplicar la velocidad del viento de $6$ a $12 \text{ m/s}$, la potencia generada se multiplicó por $8$ ($2^3 = 8$).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un parque eólico modelado por $P(v) = k \cdot v^3$, si una ráfaga de viento aumenta la velocidad de la brisa de $4 \text{ m/s}$ a $12 \text{ m/s}$ (triplicando la velocidad), ¿cuántas veces aumenta la potencia eléctrica generada?'
    choices:
      - {text: 'Aumenta $27$ veces su valor inicial, pues el factor 3 se eleva al cubo ($3^3 = 27$)', is_correct: true}
      - {text: 'Aumenta $3$ veces su valor inicial', is_correct: false}
      - {text: 'Aumenta $9$ veces su valor inicial', is_correct: false}
      - {text: 'Aumenta $6$ veces su valor inicial', is_correct: false}
    explanation: 'La alternativa correcta es ''Aumenta $27$ veces su valor inicial, pues el factor 3 se eleva al cubo ($3^3 = 27$)''. Al ser un modelo cúbico $v^3$, triplicar la entrada amplifica la salida por $3^3 = 27$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la masa de aire y la energía cinética se combinan para dar un exponente 3 en la función de energía eólica $P(v) = k v^3$?'
    choices:
      - {text: 'Porque el flujo de masa depende de la velocidad $v^1$ y la energía cinética depende de $v^2$, multiplicándose dando $v^1 \cdot v^2 = v^3$', is_correct: true}
      - {text: 'Porque el viento sopla en 3 dimensiones espaciales', is_correct: false}
      - {text: 'Porque las aspas del molino tienen 3 palas', is_correct: false}
      - {text: 'Porque el tiempo de rotación es de 3 segundos', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque el flujo de masa depende de la velocidad $v^1$ y la energía cinética depende de $v^2$, multiplicándose dando $v^1 \cdot v^2 = v^3$''. La deducción física combina la tasa másica $v$ con la energía cinética $v^2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el modelo de potencia eólica $P(v) = k \cdot v^3$ con la velocidad del viento $v$ en la base.'
  - 'Paso 2: Sustituir la velocidad $v$ en m/s en la base y elevarla al cubo $v^3$.'
  - 'Paso 3: Multiplicar por el coeficiente constante de la turbina $k$.'
  - 'Paso 4: Aplicar el factor $c^3$ para responder preguntas de proporcionalidad en cambios de velocidad.'
errores_correccion: |
  - **Error 1:** Asumir que la energía eólica es una función cuadrática $v^2$ por parecerse a la energía cinética. **Cómo corregirlo:** La energía cinética por kg es $v^2$, pero la cantidad de kg de aire por segundo que pasa por el molino también depende de $v$. La potencia total es $v \cdot v^2 = v^3$ (función cúbica).
  - **Error 2:** Multiplicar la constante $k$ por la velocidad antes de elevar al cubo. **Cómo corregirlo:** En la función potencia $k \cdot v^3$, la potencia tiene jerarquía sobre la multiplicación: primero se eleva $v^3$ y luego se multiplica por $k$.
ejemplos:
  - titulo: 'Duplicación del viento'
    enunciado: 'En $P(v) = k \cdot v^3$, ¿duplicar la velocidad del viento multiplica por 8 la potencia generada?'
    alternativas:
      - 'Sí, por el factor $2^3 = 8$'
      - 'No, la multiplica por 4'
      - 'No, la multiplica por 2'
    respuesta: 'Sí, por el factor $2^3 = 8$'
    solucion_pasos:
      - '1. $P(2v) = k (2v)^3 = 8 (k v^3) = 8 P(v)$.'
      - '2. La potencia aumenta 8 veces.'
  - titulo: 'Cálculo de potencia a 10 m/s'
    enunciado: 'Si $k = 0.2$, ¿cuánta potencia se genera a $v = 10 \text{ m/s}$?'
    respuesta: '200 Watts'
    solucion_pasos:
      - '1. $P(10) = 0.2 \cdot (10)^3 = 0.2 \cdot 1000 = 200 \text{ Watts}$.'
  - titulo: 'Efecto de la reducción a la mitad del viento'
    enunciado: 'Si el viento cae a la mitad ($v/2$), ¿la potencia se reduce a la octava parte ($\frac{1}{8}$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(1/2)^3 = 1/8 \implies$ la potencia decae a la octava parte.'
  - titulo: 'Interpretación del coeficiente k'
    enunciado: '¿El coeficiente $k$ en $P(v) = k v^3$ incluye la densidad del aire y el área del rotor?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $k = \frac{1}{2} C_p \rho A$ agrupa los parámetros físicos del aire y la turbina.'
