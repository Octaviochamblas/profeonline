semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.MONOTONIA_PAR
resumen_inicial: 'La monotonía de una función potencia de exponente entero par positivo no es global, sino que se divide en dos tramos contrapuestos respecto al origen $x = 0$.'
explicacion_simple: |
  Las funciones potencia con exponente par (como $x^2, x^4, x^6$) no suben ni bajan durante todo el camino. Cambian de dirección en el centro $(0, 0)$. Si el coeficiente $a$ es positivo (como $f(x) = 3x^2$), la curva viene bajando (decreciente) a la izquierda de cero en $]-\infty, 0]$, toca el suelo en el origen, y empieza a subir (creciente) a la derecha en $[0, +\infty[$. Si $a$ es negativo, ocurre exactamente al revés.
explicacion_formal: |
  ### Definición formal
  Para una función potencia $f(x) = a x^n$ con exponente par positivo $n = 2k (k \in \mathbb{Z}^+)$, el análisis del signo de la derivada primera $f'(x) = 2k \cdot a \cdot x^{2k-1}$ demuestra que la **monotonia es por tramos disjuntos**:

  1. **Caso Coeficiente Positivo ($a > 0$)**:
     - En el intervalo $]-\infty, 0]$: Derivada $f'(x) \le 0 \implies$ La función es **estrictamente decreciente**.
     - En el intervalo $[0, +\infty[$: Derivada $f'(x) \ge 0 \implies$ La función es **estrictamente creciente**.
     - Punto crítico en $x = 0$: Mínimo absoluto global.

  2. **Caso Coeficiente Negativo ($a < 0$)**:
     - En el intervalo $]-\infty, 0]$: Derivada $f'(x) \ge 0 \implies$ La función es **estrictamente creciente**.
     - En el intervalo $[0, +\infty[$: Derivada $f'(x) \le 0 \implies$ La función es **estrictamente decreciente**.
     - Punto crítico en $x = 0$: Máximo absoluto global.

  ### Síntesis didáctica
  Cambio de sentido en el origen: El eje vertical $x = 0$ divide el dominio en dos regiones donde la monotonía se invierte por completo.
definiciones_clave: |
  - **Monotonia por tramos**: Comportamiento funcional dividido en intervalos donde la curva cambia entre creciente y decreciente.
  - **Intervalo decreciente**: Tramo del dominio donde al aumentar $x$, las salidas $y$ disminuyen.
  - **Intervalo creciente**: Tramo del dominio donde al aumentar $x$, las salidas $y$ aumentan.
propiedades_relaciones: |
  - **Punto de retorno (Vértice)**: El cambio de monotonía ocurre de forma continua e ininterrumpida exactamente en el origen de coordenadas $(0, 0)$.
  - **Falta de monotonía en todo $\mathbb{R}$**: La función no es ni estrictamente creciente ni estrictamente decreciente al considerar todo el conjunto $\mathbb{R}$ en su totalidad.
ejemplo_guiado:
  enunciado: 'Determina los intervalos de crecimiento y decrecimiento para la función potencia de exponente par $f(x) = -4x^4$ evaluando el comportamiento en los puntos $x = -2, -1, 0, 1, 2$.'
  pasos:
    - 'Paso 1: Evaluamos puntos: $f(-2) = -4(-2)^4 = -64$, $f(-1) = -4(-1)^4 = -4$, $f(0) = 0$, $f(1) = -4$, $f(2) = -64$.'
    - 'Paso 2: A la izquierda de cero ($]-\infty, 0]$): De $x = -2$ a $x = -1$, la salida sube de $-64$ a $-4$; y de $-1$ a $0$, sube de $-4$ a $0$. **Estrictamente creciente**.'
    - 'Paso 3: A la derecha de cero ($[0, +\infty[$): De $x = 0$ a $x = 1$, la salida cae de $0$ a $-4$; y de $1$ a $2$, cae de $-4$ a $-64$. **Estrictamente decreciente**.'
    - 'Paso 4: Conclusión: $f(x) = -4x^4$ es creciente en $]-\infty, 0]$ y decreciente en $[0, +\infty[$, con máximo en $(0, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué intervalo del dominio es estrictamente decreciente la función potencia $f(x) = 5x^2$ con exponente par y coeficiente positivo $a = 5 > 0$?'
    choices:
      - {text: 'En el intervalo no positivo $]-\infty, 0]$', is_correct: true}
      - {text: 'En el intervalo no negativo $[0, +\infty[$', is_correct: false}
      - {text: 'En todo el conjunto de los números reales $\mathbb{R}$', is_correct: false}
      - {text: 'En ningún intervalo, es constante', is_correct: false}
    explanation: 'La alternativa correcta es ''En el intervalo no positivo $]-\infty, 0]$''. Para $a > 0$, la copa en U desciende a la izquierda del origen en $]-\infty, 0]$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para la función potencia $f(x) = -2x^6$ con $a < 0$, ¿qué ocurre con los valores de $y$ a medida que avanzamos hacia la derecha en el intervalo $[0, +\infty[$?'
    choices:
      - {text: 'Los valores de $y$ disminuyen continuamente haciéndose cada vez más negativos, siendo la función estrictamente decreciente en $[0, +\infty[$', is_correct: true}
      - {text: 'Los valores de $y$ aumentan hacia $+\infty$, siendo estrictamente creciente', is_correct: false}
      - {text: 'Los valores de $y$ permanecen fijos en 0', is_correct: false}
      - {text: 'La función cambia de paridad', is_correct: false}
    explanation: 'La alternativa correcta es ''Los valores de $y$ disminuyen continuamente haciéndose cada vez más negativos, siendo la función estrictamente decreciente en $[0, +\infty[$''. Con $a < 0$, la rama derecha cae hacia $-\infty$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar que el exponente $n$ sea par positivo ($n = 2, 4, 6\dots$).'
  - 'Paso 2: Observar el signo del coeficiente multiplicativo $a$.'
  - 'Paso 3: Si $a > 0$, la función es decreciente en $]-\infty, 0]$ y creciente en $[0, +\infty[$.'
  - 'Paso 4: Si $a < 0$, la función es creciente en $]-\infty, 0]$ y decreciente en $[0, +\infty[$.'
errores_correccion: |
  - **Error 1:** Declarar que la función $f(x) = x^2$ es creciente en todo $\mathbb{R}$. **Cómo corregirlo:** La función sólo es creciente en la mitad derecha $[0, +\infty[$. En la mitad izquierda $]-\infty, 0]$ es decreciente.
  - **Error 2:** Creer que la monotonía por tramos excluye al origen $x = 0$. **Cómo corregirlo:** El punto $x = 0$ pertenece a ambos intervalos de monotonía continua (cerrado en $[0$ y en $0]$).
ejemplos:
  - titulo: 'Monotonía de parábola estándar'
    enunciado: '¿En qué intervalo es creciente $f(x) = 3x^2$?'
    alternativas:
      - 'En $[0, +\infty[$'
      - 'En $]-\infty, 0]$'
      - 'En todo $\mathbb{R}$'
    respuesta: 'En $[0, +\infty[$'
    solucion_pasos:
      - '1. Exponente par $n = 2$ y $a = 3 > 0$.'
      - '2. La rama derecha $[0, +\infty[$ es estrictamente creciente.'
  - titulo: 'Monotonía con coeficiente negativo'
    enunciado: '¿La función $g(x) = -x^4$ es creciente en $]-\infty, 0]$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser $a = -1 < 0$, la rama izquierda $]-\infty, 0]$ sube desde $-\infty$ hasta 0.'
  - titulo: 'Inversión de tendencia en el origen'
    enunciado: '¿El cambio de monotonía en $f(x) = 2x^6$ ocurre en $x = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El punto $(0, 0)$ es el vértice donde pasa de decrecer a crecer.'
  - titulo: 'Falta de monotonía global'
    enunciado: '¿Existe alguna función potencia de exponente par que sea monótona en todo $\mathbb{R}$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Toda función potencia de exponente par invierte su monotonía en el origen.'
errores_frecuentes:
  - 'La función potencia de exponente par $f(x) = x^4$ es estrictamente creciente en todo el conjunto $\mathbb{R}$.'
  - 'Una función de exponente par con $a < 0$ es decreciente en $]-\infty, 0]$.'
  - 'El cambio de monotonía en $f(x) = 5x^2$ ocurre a la altura $y = 5$.'
  - 'Las funciones de exponente par son monótonas en todo su dominio.'
  - 'El intervalo $[0, +\infty[$ es el tramo decreciente para $f(x) = 2x^2$.'
afirmaciones_verdaderas:
  - 'La monotonía de las funciones potencia de exponente entero par positivo se divide en dos tramos contrapuestos respecto a $x = 0$, cambiando de sentido en el vértice $(0, 0)$.'
  - 'Para $a > 0$, la función es decreciente a la izquierda del origen y creciente a la derecha; para $a < 0$, es creciente a la izquierda y decreciente a la derecha.'
