  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que $n$ sea par y determina el signo de $a$.'
- 'Paso 2: Identifica el punto $x=0$ como el punto donde cambia la monotonía.'
- 'Paso 3: Describe el comportamiento en cada uno de los dos intervalos separados
  por $x=0$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en análisis de la monotonía por tramos en funciones potencia de
  exponente par positivo.
ejemplos:
- titulo: Monotonía de $f(x)=x^2$
  enunciado: Describe la monotonía de $f(x)=x^2$.
  solucion_pasos:
  - Con $a=1>0$ y $n=2$ par, la función decrece en $(-\infty,0]$.
  - Y crece en $[0,+\infty)$.
- titulo: Monotonía de $f(x)=-x^4$
  enunciado: Describe la monotonía de $f(x)=-x^4$.
  solucion_pasos:
  - Con $a=-1<0$ y $n=4$ par, el comportamiento se invierte respecto al caso $a>0$.
  - La función crece en $(-\infty,0]$ y decrece en $[0,+\infty)$.
- titulo: ¿$f(x)=x^2$ es creciente en todo su dominio?
  enunciado: ¿La función $f(x)=x^2$ es creciente en todos los reales?
  respuesta: 'No'
  solucion_pasos:
  - Es decreciente en $(-\infty,0]$ y creciente en $[0,+\infty)$, no en todo su dominio.
- titulo: ¿El punto $x=0$ marca siempre el cambio de monotonía en una función con
    exponente par?
  enunciado: ¿El origen es siempre el punto donde cambia el comportamiento de crecimiento/decrecimiento
    con exponente par?
  respuesta: Sí
  solucion_pasos:
  - Corresponde al vértice de la curva, sea mínimo o máximo según el signo de $a$.
errores_frecuentes:
- Afirmar que la función es creciente o decreciente en todo su dominio, ignorando
  el cambio en $x=0$.
- Declarar los intervalos de crecimiento y decrecimiento según el signo de $a$.
- No identificar $x=0$ como el punto de cambio de comportamiento.
- Aplicar el análisis de monotonía par a una función con exponente impar.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  análisis de la monotonía por tramos en funciones potencia de exponente par positivo.
