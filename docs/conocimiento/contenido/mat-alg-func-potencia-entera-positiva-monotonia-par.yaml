semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.MONOTONIA_PAR
resumen_inicial: 'Análisis de la monotonía por tramos en funciones potencia de exponente
  par positivo: forma general $f(x) = a x^n$, simetría, dominio y recorrido en Comportamiento
  con exponente entero positivo.'
explicacion_simple: A diferencia de una función monótona en todo su dominio, las funciones
  con exponente par cambian su comportamiento exactamente en el origen.
explicacion_formal: '### Definición formal


  Para $n$ par y $a>0$, la función $f(x)=a\cdot x^n$ cumple $f''$ positivo salvo en
  el vértice, lo que se traduce en: para $x_1<x_2\leq0$, $f(x_1)>f(x_2)$ (decreciente);
  para $0\leq x_1<x_2$, $f(x_1)<f(x_2)$ (creciente). El punto $x=0$ es el punto donde
  cambia el comportamiento.


  ### Desarrollo didáctico


  Con $f(x)=x^2$: en el intervalo $(-\infty,0]$, a medida que $x$ aumenta (se acerca
  a $0$ desde valores muy negativos), $f(x)$ disminuye; en $[0,+\infty)$, a medida
  que $x$ sigue aumentando, $f(x)$ vuelve a crecer.'
definiciones_clave: '- **Análisis de la monotonía por tramos en funciones potencia
  de exponente par positivo**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y
  $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a análisis de la monotonía por tramos en funciones potencia
  de exponente par positivo.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de análisis de la monotonía por tramos en funciones potencia de exponente par
    positivo.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de análisis de la monotonía
    por tramos en funciones potencia de exponente par positivo.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
