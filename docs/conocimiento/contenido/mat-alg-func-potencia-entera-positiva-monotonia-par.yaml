  QUÉ: Analizar la monotonía por tramos en funciones potencia de exponente par positivo.
  CÓMO: Dividir el dominio en $]-\infty, 0]$ y $[0, +\infty[$ y evaluar si la función decrece o crece según el signo de $a$.
