semantic_id: MAT.GEO.RECTA_ECUACIONES.INTERCEPTO_B
resumen_inicial: 'Identificación del coeficiente de posición b como intercepto con
  el eje Y: conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica
  Ampliada.'
explicacion_simple: El término constante en la ecuación y=mx+b indica exactamente
  el valor de y cuando x=0, es decir, dónde la recta corta el eje vertical.
explicacion_formal: '![Intercepto b con el eje Y](/static/img/geometria/analitica/rectaeq-intercepto-b.svg)


  ### Definición formal


  Evaluando $y=mx+b$ en $x=0$, se obtiene $y=b$. Por lo tanto, el punto $(0,b)$ es
  siempre el intercepto de la recta con el eje y.


  ### Desarrollo didáctico


  En la figura, la recta $y=1{,}5x+2$ corta el eje y en el punto $(0,2)$, ya que al
  sustituir $x=0$ se obtiene $y=2$.'
