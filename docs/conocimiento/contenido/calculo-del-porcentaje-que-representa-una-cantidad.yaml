semantic_id: MAT.NUM.PORCENTAJES.CALCULO_PORCENTAJE
resumen_inicial: 'El porcentaje $p\%$ que representa una cantidad parcial $P$ respecto a una cantidad total $C$ se calcula dividiendo la parte entre el total y multiplicando el cociente por 100: $p\% = \left(\frac{P}{C}\right) \cdot 100\%$.'
explicacion_simple: |
  Cuando quieres averiguar qué porcentaje del total representa un cierto grupo de cosas o dinero (por ejemplo, si de $40$ estudiantes en una sala $10$ usan anteojos):
  1. Divides la parte ($10$) por el total ($40$), obteniendo la fracción $\frac{10}{40} = 0,25$.
  2. Multiplicas ese resultado decimal por $100$ para convertirlo a porcentaje: $0,25 \cdot 100 = 25\%$.
  Por lo tanto, los $10$ estudiantes representan el $25\%$ del curso.
explicacion_formal: |
  ### Definición formal
  El **porcentaje relativo $p\%$** que representa un valor parcial $P$ con respecto a un total de referencia $C$ ($C > 0$) viene dado por la razón:
  $$p\% = \left(\frac{P}{C}\right) \cdot 100\%$$

  ### Deducción por regla de tres simple directa
  Estableciendo la equivalencia de que la base $C$ representa el $100\%$:
  $$\begin{array}{ccc} \text{Cantidad} & & \text{Porcentaje} \\ C & \longrightarrow & 100\% \\ P & \longrightarrow & p\% \end{array} \implies p = \frac{P \cdot 100}{C}$$

  ### Análisis según el tamaño de la parte
  - Si $P < C \implies p\% < 100\%$ (la parte es menor que el total).
  - Si $P = C \implies p\% = 100\%$ (la parte es idéntica al total).
  - Si $P > C \implies p\% > 100\%$ (la parte supera al valor base de comparación).

  ### Síntesis didáctica
  - Ecuación del porcentaje: $p\% = \left(\frac{\text{Parte}}{\text{Total}}\right) \cdot 100\%$.
definiciones_clave: |
  - **Porcentaje relativo ($p\%$)**: Proporción percentil ocupada por la cuota parcial dentro del universo total.
  - **Cuota parcial ($P$)**: Numerador de la razón que indica la cantidad observada.
  - **Total de referencia ($C$)**: Denominador de la razón que actúa como base del 100%.
propiedades_relaciones: |
  - **Escalamiento homogéneo**: Si tanto la parte $P$ como el total $C$ se multiplican por un mismo factor $k$, el porcentaje representado $p\%$ permanece exactamente inalterado.
  - **Complementario porcentual**: El porcentaje de los elementos no incluidos en $P$ se calcula simplemente como $(100 - p)\%$.
ejemplo_guiado:
  enunciado: 'En un examen de $50$ preguntas, un estudiante respondió correctamente $38$ preguntas. ¿Qué porcentaje de respuestas correctas obtuvo el estudiante?'
  pasos:
    - 'Paso 1: Identificamos la parte parcial $P = 38$ y la cantidad total de preguntas $C = 50$.'
    - 'Paso 2: Formulamos la razón de la parte respecto al total: $\frac{P}{C} = \frac{38}{50}$.'
    - 'Paso 3: Calculamos la división decimal: $38 \div 50 = 0,76$.'
    - 'Paso 4: Multiplicamos por $100$ para obtener el porcentaje: $0,76 \cdot 100 = 76\%$. El estudiante obtuvo un **$76\%$ de respuestas correctas**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular qué porcentaje $p\%$ representa una parte $P$ de un total $C$?'
    choices:
      - {text: 'Dividir la parte $P$ entre el total $C$ y multiplicar el cociente por 100 ($p\% = \frac{P}{C} \cdot 100\%$)', is_correct: true}
      - {text: 'Dividir el total $C$ entre la parte $P$ y multiplicar por 100', is_correct: false}
      - {text: 'Multiplicar la parte $P$ por el total $C$', is_correct: false}
      - {text: 'Restar la parte $P$ al total $C$', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir la parte $P$ entre el total $C$ y multiplicar el cociente por 100 ($p\% = \frac{P}{C} \cdot 100\%$)''. Es la razón $P/C$ expresada en tanto por ciento.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en un canasto hay $15$ manzanas rojas de un total de $60$ frutas, ¿qué porcentaje de las frutas son manzanas rojas?'
    choices:
      - {text: 'El $25\%$, calculando $\frac{15}{60} \cdot 100 = \frac{1}{4} \cdot 100 = 25\%$', is_correct: true}
      - {text: 'El $40\%$, dividiendo $60 / 15$', is_correct: false}
      - {text: 'El $15\%$, tomando el número de manzanas', is_correct: false}
      - {text: 'El $75\%$, considerando las frutas no rojas', is_correct: false}
    explanation: 'La alternativa correcta es ''El $25\%$, calculando $\frac{15}{60} \cdot 100 = \frac{1}{4} \cdot 100 = 25\%$''. $15/60 = 0.25 \implies 25\%$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar claramente la parte observada $P$ y el total de referencia $C$.'
  - 'Paso 2: Formar la fracción $\frac{P}{C}$ colocando la parte arriba y el total abajo.'
  - 'Paso 3: Realizar la división $P \div C$ para obtener la forma decimal.'
  - 'Paso 4: Multiplicar el resultado decimal por 100 y agregar el símbolo $\%$.'
errores_correccion: |
  - **Error 1:** Dividir el total entre la parte en lugar de la parte entre el total (ej: hacer $50 \div 38$ en vez de $38 \div 50$). **Cómo corregirlo:** La parte observada se coloca **SIEMPRE en el numerador**: **$\frac{\text{Parte}}{\text{Total}}$**.
  - **Error 2:** Olvidar multiplicar por 100 tras realizar la división $P \div C$. **Cómo corregirlo:** La división entrega un número decimal ($0,76$); **debes multiplicar por 100** para expresar el resultado como tanto por ciento ($76\%$).
ejemplos:
  - titulo: 'Porcentaje de aprobados en un curso'
    enunciado: 'Si 18 de 20 estudiantes aprobaron, ¿el porcentaje de aprobados es el $90\%$?'
    alternativas:
      - 'Sí, pues $(18 / 20) \cdot 100 = 0.9 \cdot 100 = 90\%$'
      - 'No, es el 80%'
      - 'No, es el 95%'
    respuesta: 'Sí, pues $(18 / 20) \cdot 100 = 0.9 \cdot 100 = 90\%$'
    solucion_pasos:
      - '1. Razón de parte a total: $18 / 20 = 0,9$.'
      - '2. Multiplicamos por 100: $0,9 \cdot 100 = 90\%$.'
  - titulo: 'Porcentaje de la mitad'
    enunciado: 'Si se toman 25 unidades de 50 totales, ¿representan el $50\%$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(25/50) \cdot 100 = 0.5 \cdot 100 = 50\%$.'
  - titulo: 'Porcentaje mayor al 100% por comparación'
    enunciado: 'Si las ventas actuales son $\$150$ y las anteriores eran $\$100$, ¿las ventas actuales representan el $150\%$ de las anteriores?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(150 / 100) \cdot 100 = 150\%$.'
  - titulo: 'Porcentaje de totalidad'
    enunciado: 'Si se tienen 80 elementos de 80 posibles, ¿representan el $100\%$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(80/80) \cdot 100 = 100\%$.'
errores_frecuentes:
  - 'Dividir la cantidad total entre la parte parcial en lugar de dividir la parte entre el total.'
  - 'El resultado decimal de la división $P/C$ representa directamente el porcentaje sin multiplicar por 100.'
  - 'El porcentaje de la parte observada equivale numéricamente al porcentaje del complemento restante.'
  - 'Restar la parte al total y entregar la diferencia como si fuera el porcentaje.'
  - 'Considerar que la parte observada nunca puede ser mayor que el total de referencia.'
afirmaciones_verdaderas:
  - 'El porcentaje $p\%$ que representa una parte $P$ de un total $C$ se calcula mediante la fórmula $p\% = \left(\frac{P}{C}\right) \cdot 100\%$.'
  - 'Si la parte es igual a la mitad del total ($P = \frac{C}{2}$), el porcentaje que representa es exactamente el $50\%$.'
