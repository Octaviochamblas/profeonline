semantic_id: MAT.NUM.PORCENTAJES.CALC_TASA
resumen_inicial: Para calcular qué porcentaje representa una cantidad parcial $P$
  respecto a un total $T$, se divide la parte entre el total y se multiplica el resultado
  por 100% ($c\% = \frac{P}{T} \cdot 100\%$).
explicacion_simple: '![Cálculo del porcentaje que representa una cantidad](/static/img/nodos/calculo-del-porcentaje-que-representa-una-cantidad-intro.svg)


  Cuando quieres saber qué porcentaje es una cantidad de otra (por ejemplo, si respondiste
  bien $18$ preguntas de un total de $60$), debes formar la fracción **Parte / Total**,
  hacer la división y multiplicar por $100\%$. En este caso: $\frac{18}{60} = 0,30
  \implies 0,30 \cdot 100\% = 30\%$. La clave es recordar que el total de referencia
  siempre va en el denominador.

  '
explicacion_formal: '### Definición del operador de tasa porcentual

  Dada una cantidad parcial $P \in \mathbb{R}^+$ y una cantidad de referencia total
  $T \in \mathbb{R}^+$ con $T \neq 0$, la tasa porcentual $c\%$ que representa $P$
  respecto a $T$ es:

  $$c\% = \left(\frac{P}{T}\right) \cdot 100\%$$


  ### Interpretación por regla de tres simple

  $$\begin{aligned}

  T &\longrightarrow 100\% \\

  P &\longrightarrow c\%

  \end{aligned} \implies c = \frac{P \cdot 100}{T}$$


  ### Casos según la razón Parte/Total

  - Si $P < T$: $c\% < 100\%$ (porcentaje propio o fraccionario).

  - Si $P = T$: $c\% = 100\%$ (totalidad exacta).

  - Si $P > T$: $c\% > 100\%$ (exceso o sobrecumplimiento).

  '
definiciones_clave: '- **Tasa porcentual desconocida ($c\%$)**: Incógnita porcentual
  que cuantifica la proporción de la parte sobre la base.

  - **Cociente relativo ($\frac{P}{T}$)**: Razón adimensional entre la parte evaluada
  y el total de referencia.

  - **Factor de escala porcentual**: Multiplicador $100\%$ que transforma el cociente
  decimal a tanto por ciento.

  '
propiedades_relaciones: '- **Invarianza de escala**: Si tanto la parte como el total
  se multiplican por la misma constante, el porcentaje permanece idéntico.

  - **Aditividad de partes**: Si $P = P_1 + P_2$, entonces $c\%(P) = c\%(P_1) + c\%(P_2)$.

  '
ejemplo_guiado:
  enunciado: En un curso de $40$ estudiantes, $14$ obtuvieron calificación destacada.
    ¿Qué porcentaje del curso obtuvo calificación destacada?
  pasos:
  - 'Paso 1: Identificamos la parte ($P = 14$) y el total ($T = 40$).'
  - 'Paso 2: Planteamos la razón $\frac{\text{Parte}}{\text{Total}} = \frac{14}{40}$.'
  - 'Paso 3: Realizamos la división: $14 \div 40 = 0,35$.'
  - 'Paso 4: Multiplicamos por 100%: $0,35 \cdot 100\% = 35\%$.'
  - 'Paso 5: Conclusión: Los estudiantes destacados representan el **35%** del curso.'
  imagen: /static/img/nodos/calculo-del-porcentaje-que-representa-una-cantidad-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué porcentaje representa $15$ respecto a un total de $60$?
  choices:
  - text: $25\%$
    is_correct: true
  - text: $40\%$
    is_correct: false
  - text: $20\%$
    is_correct: false
  - text: $4\%$
    is_correct: false
  explanation: La alternativa correcta es $25\%$. $c\% = \left(\frac{15}{60}\right)
    \cdot 100\% = \frac{1}{4} \cdot 100\% = 25\%$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si de un presupuesto de $\$50.000$ se gastaron $\$35.000$, ¿qué porcentaje
    del presupuesto fue gastado?
  choices:
  - text: $70\%$
    is_correct: true
  - text: $35\%$
    is_correct: false
  - text: $65\%$
    is_correct: false
  - text: $7\%$
    is_correct: false
  explanation: La alternativa correcta es $70\%$. $\frac{35.000}{50.000} \cdot 100\%
    = \frac{35}{50} \cdot 100\% = 0,70 \cdot 100\% = 70\%$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar con claridad cuál es la parte ($P$) y cuál es el total de referencia
  ($T$).'
- 'Paso 2: Escribir la razón $\frac{P}{T}$.'
- 'Paso 3: Calcular el cociente decimal dividiendo $P \div T$.'
- 'Paso 4: Multiplicar el cociente decimal por $100\%$ (desplazar la coma 2 lugares
  a la derecha) y agregar el símbolo $\%$.'
errores_correccion: '- **Error 1:** Invertir la fracción dividiendo Total entre Parte
  (ej: $60 \div 15 = 4$ en vez de $15 \div 60 = 0,25 = 25\%$). **Cómo corregirlo:**
  La parte siempre va en el numerador y el total en el denominador: **$\frac{\text{Parte}}{\text{Total}}$**.

  - **Error 2:** Olvidar multiplicar por 100 dejando la respuesta como $0,35$ en vez
  de $35\%$.

  '
ejemplos:
- titulo: Cálculo de tasa porcentual
  enunciado: ¿Qué porcentaje representa $12$ de $48$?
  alternativas:
  - $25\%$
  - $20\%$
  - $30\%$
  - $4\%$
  respuesta: $25\%$
  solucion_pasos:
  - '1. Formamos la razón: $\frac{12}{48} = \frac{1}{4}$.'
  - '2. Multiplicamos por 100%: $\frac{1}{4} \cdot 100\% = 25\%$.'
- titulo: Porcentaje de totalidad
  enunciado: ¿Si una cantidad es igual a su total de referencia, representa el $100\%$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $\frac{T}{T} \cdot 100\% = 1 \cdot 100\% = 100\%$.
- titulo: Porcentaje mayor al total
  enunciado: ¿Si se producen $150$ unidades cuando la meta era $100$, el cumplimiento
    fue del $150\%$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $\frac{150}{100} \cdot 100\% = 150\%$.
- titulo: Porcentaje complementario
  enunciado: ¿Si el $30\%$ de los alumnos son hombres, las mujeres representan el
    $70\%$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $100\% - 30\% = 70\%$.
errores_frecuentes:
- Invertir la fracción dividiendo el total por la parte.
- Tomar como base el valor restante en lugar del total original.
- No multiplicar por 100 al final del cálculo.
afirmaciones_verdaderas:
- El porcentaje que representa una parte respecto al total se calcula mediante la
  fórmula (Parte / Total) · 100%.
- Si la parte es la mitad del total, el porcentaje resultante es exactamente el 50%.
al_terminar_debes_poder: '![Resumen de cálculo del porcentaje que representa una cantidad](/static/img/nodos/calculo-del-porcentaje-que-representa-una-cantidad-resumen.svg)


  QUÉ: Determinar con precisión qué porcentaje representa una cantidad parcial $P$
  en relación a una base total $T$.

  CÓMO: Formulando la razón $\frac{P}{T}$, calculando el cociente decimal y multiplicando
  por $100\%$ ($c\% = \frac{P}{T} \cdot 100\%$).

  '
