resumen_inicial: 'El porcentaje $P\%$ que representa una parte $A$ de un total $B$
  se calcula dividiendo la parte entre el total y multiplicando por $100\%$: $P\%
  = \left( \frac{A}{B} \right) \cdot 100\%$.'
explicacion_simple: Si queremos saber qué porcentaje representa una cantidad parcial
  $A$ dentro de un total $B$ (por ejemplo, 12 alumnos de 40), dividimos la parte entre
  el total ($12/40$) y multiplicamos el resultado decimal por 100 para obtener el
  número con símbolo $\%$.
explicacion_formal: 'Para una parte $A$ respecto a un total $B > 0$, la **Tasa Porcentual
  $P\%$** viene dada por la razón en base cien:


  $$P = \frac{A}{B} \cdot 100 \implies P\% = \left( \frac{A}{B} \right) \cdot 100\%$$


  **Verificación de rango:**

  - Si $A < B \implies P < 100\%$.

  - Si $A = B \implies P = 100\%$.

  - Si $A > B \implies P > 100\%$.'
definiciones_clave: '- **Cálculo de tasa $P\%$**: Porcentaje $P = \frac{A}{B} \cdot
  100$ que representa la parte $A$ sobre el total $B$.'
propiedades_relaciones: '- **Proporción de parte a todo**: $\frac{A}{B} = \frac{P}{100}$.'
ejemplo_guiado:
  enunciado: ¿Qué porcentaje representa $18$ respecto de $72$?
  pasos:
  - 'Paso 1: Identificar la parte $A = 18$ y el total $B = 72$.'
  - 'Paso 2: Formar la fracción y simplificar: $\frac{18}{72} = \frac{1}{4} = 0,25$.'
  - 'Paso 3: Multiplicar por $100\%$ para convertir a porcentaje: $0,25 \cdot 100\%
    = 25\%$.'
  - 'Conclusión: $18$ representa el $25\%$ de $72$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula el porcentaje P% que representa una parte A respecto
    de un total B?
  choices:
  - text: Dividiendo la parte entre el total y multiplicando por 100 (P = (A / B)
      · 100)
    is_correct: true
  - text: Multiplicando P = A · B · 100
    is_correct: false
  - text: Restando P = B - A
    is_correct: false
  - text: Dividiendo P = B / A
    is_correct: false
  explanation: La alternativa correcta es 'Dividiendo la parte entre el total y multiplicando
    por 100 (P = (A / B) · 100)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 18 respecto a 72, ¿cuál fue el porcentaje P%
    resultante?
  choices:
  - text: 25%
    is_correct: true
  - text: 18%
    is_correct: false
  - text: 50%
    is_correct: false
  - text: 40%
    is_correct: false
  explanation: La alternativa correcta es '25%'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular qué porcentaje representa
  una parte $A$ sobre un total $B$ dividiendo $\left( \frac{A}{B} \right) \cdot 100\%$.
semantic_id: MAT.NUM.PORCENTAJES.CALCULO_PORCENTAJE
procedimiento:
- 'Paso 1: Convertir el porcentaje $P\%$ a su forma decimal $d = P/100$ o fracción
  irreducible.'
- 'Paso 2: Formular la ecuación de proporción correspondiente ($V = d \cdot N$, $P
  = (A/B) \cdot 100$ o $N = V/d$).'
- 'Paso 3: Resolver numéricamente y verificar la coherencia de la respuesta.'
errores_correccion: '- **Error 1: Multiplicar directamente por el número del porcentaje
  sin dividir entre 100 ($15\% \text{ de } 80 = 15 \cdot 80 = 1200$).** **Cómo corregirlo:**
  El porcentaje DEBE convertirse a decimal dividiendo por 100 antes de multiplicar
  ($0,15 \cdot 80 = 12$).


  - **Error 2: Confundir el cálculo del valor de un porcentaje con el cálculo del
  total.** **Cómo corregirlo:** Si se busca el total $100\%$ dada una parte $V$, se
  DEBE dividir por el porcentaje ($N = V / d$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PORCENTAJES.CALCULO_PORCENTAJE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de porcentajes.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia decimal.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por división de base cien.
- titulo: ¿Equivale el P% a la fracción P/100?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de porcentaje.
- titulo: ¿Se obtiene el 10% de N dividiendo N entre 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10\% = 10/100 = 1/10$.
errores_frecuentes:
- Multiplicar una cantidad por el valor entero del porcentaje sin dividir entre cien.
- Sumar directamente dos porcentajes sucesivos aplicados sobre cantidades distintas.
- Desplazar la coma decimal hacia la derecha al convertir un porcentaje a su forma
  decimal.
- El porcentaje $50\%$ de una cantidad equivale a dividir dicha cantidad entre cincuenta.
- Declarar la parte dada con el total $100\%$ al despejar incógnitas de proporción.
afirmaciones_verdaderas:
- Un porcentaje $P\%$ es una razón de denominador cien $P\% = \frac{P}{100}$ que equivale
  al número decimal $P/100$.
- 'El $c\%$ de una cantidad $N$ se obtiene multiplicando $N$ por su equivalente decimal:
  $V = \left(\frac{c}{100}\right) \cdot N$.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
