semantic_id: MAT.NUM.PORCENTAJES.CALCULO_PORCENTAJE
resumen_inicial: 'Cálculo del porcentaje que representa una cantidad: concepto y propiedades
  fundamentales en Porcentajes.'
explicacion_simple: Tuviste 24 aciertos en una prueba de 30 preguntas. ¿Qué nota te
  sacarás? Necesitas saber qué porcentaje de la prueba dominaste. Este es el cálculo
  inverso.
explicacion_formal: "Cuando la pregunta es '¿Qué porcentaje es $P$ respecto de $T$?',\
  \ estamos buscando la relación entre la Parte ($P$) y el Total ($T$) llevada a una\
  \ escala de 100.\n\nLa fórmula directa es:\n$$\\% = \\left( \\frac{\\text{Parte}}{\\\
  text{Total}} \\right) \\cdot 100$\n\nEjemplo lógico: Si la Parte es exactamente\
  \ la mitad del Total, $P/T$ dará $0.5$. Al multiplicarlo por 100 obtenemos $50\\\
  %$. \nEste cálculo es equivalente a una regla de tres: Si $T$ es el $100\\%$, entonces\
  \ $P$ es a $x\\%$."
definiciones_clave: '- **Cálculo del porcentaje que representa una cantidad**: Elemento
  central dentro del estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo del porcentaje que representa una cantidad.'
ejemplo_guiado:
