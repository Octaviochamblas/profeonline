procedimiento:
- 'Paso 1: Identifica el ''Total'' (la base de referencia) y la ''Parte''.'
- 'Paso 2: Divide la Parte por el Total.'
- 'Paso 3: Multiplica el resultado decimal por 100 y agrégale el símbolo %.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del
  porcentaje que representa una cantidad.
ejemplos:
- titulo: Porcentaje de aciertos
  enunciado: Si aciertas 15 tiros de 20 intentos, ¿cuál es tu porcentaje de acierto?
  solucion_pasos:
  - Parte = 15, Total = 20.
  - 'Fracción: $15/20$.'
  - 'Multiplicamos por 100: $(15/20) \cdot 100 = 15 \cdot 5 = 75$.'
  - El porcentaje de acierto es 75%.
errores_frecuentes:
- Dividir el Total por la Parte (ej. $20/15$) obteniendo porcentajes absurdos mayores
  a 100% cuando no corresponde.
- Olvidar multiplicar por 100, respondiendo 'es el $0.75\%$' en lugar de $75\%$.
- Confundir cuál es la base (el Total) en problemas redactados confusamente (ej. 'Qué
  porcentaje es 50 respecto a 200').
afirmaciones_verdaderas:
- La propiedad de cálculo del porcentaje que representa una cantidad preserva la consistencia
  lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren cálculo del
  porcentaje que representa una cantidad.
