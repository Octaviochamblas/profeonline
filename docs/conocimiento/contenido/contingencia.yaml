semantic_id: MAT.FUND.TABLAS_VERDAD.CONTINGENCIA
resumen_inicial: 'Definición, identificación y características de las contingencias lógicas como proposiciones que combinan valores verdaderos y falsos en su tabla de verdad.'
explicacion_simple: |
  Una **contingencia** es una afirmación lógica cuyo valor de verdad depende de las circunstancias: **no es siempre verdadera ni siempre falsa**. Cuando construyes su tabla de verdad, la columna final tiene **una mezcla de valores Verdaderos ($V$) y Falsos ($F$)** (al menos un $V$ y al menos un $F$). La gran mayoría de las frases que decimos a diario en la vida real (como "Está soleado y tengo frío") son contingencias, porque su verdad depende del momento o del contexto.

  ![Infografía: Contingencia](/static/img/nodos/contingencia-intro.svg)
explicacion_formal: |
  ### Definición formal
  En el cálculo proposicional, una fórmula bien formada $\Phi(p_1, \dots, p_n)$ es una **contingencia** (o fórmula contingente) si y solo si es **satisfacible pero no es una tautología**:
  $$\exists \mathcal{M}_1 \text{ tal que } v_{\mathcal{M}_1}(\Phi) = V \quad \land \quad \exists \mathcal{M}_2 \text{ tal que } v_{\mathcal{M}_2}(\Phi) = F$$
  En términos del álgebra booleana sobre matrices veritativas, el vector columna principal $\mathbf{v}(\Phi)$ contiene al menos un elemento $V$ y al menos un elemento $F$:
  $$\mathbf{v}(\Phi) \neq \mathbf{1} \quad \land \quad \mathbf{v}(\Phi) \neq \mathbf{0}$$

  ### Desglose simbólico
  - Satisfacibilidad positiva: Existe al menos un modelo que hace verdadera a la fórmula.
  - Satisfacibilidad negativa: Existe al menos un modelo que hace falsa a la fórmula.
  - Condición necesaria y suficiente: $\mathbf{v}(\Phi) \in \{V, F\}^N \setminus \{\mathbf{1}, \mathbf{0}\}$.

  ### Síntesis didáctica
  Las contingencias representan proposiciones sintéticas cuyo valor de verdad no puede deducirse puramente a priori de la forma lógica sin conocer la asignación empírica de sus variables constituyentes.
definiciones_clave: |
  - **Contingencia lógica**: Proposición compuesta cuya columna principal en la tabla de verdad contiene tanto valores $V$ como valores $F$.
  - **Fórmula satisfacible y refutable**: Expresión que admite modelos verificadores y modelos falseadores.
  - **Proposición sintética**: Declaración cuya verdad fáctica depende de la realidad empírica asignada a sus átomos.
propiedades_relaciones: |
  - **Negación de una contingencia**: La negación de cualquier contingencia es siempre otra contingencia ($\neg \Phi_{\text{cont}} \equiv \Psi_{\text{cont}}$).
  - **Prevalencia combinatoria**: Para una tabla de $N=2^n$ filas, de las $2^N$ funciones booleanas posibles, exactamente $2^N - 2$ son contingencias (todas salvo la tautología $\mathbf{1}$ y la contradicción $\mathbf{0}$).
ejemplo_guiado:
  enunciado: |
    Demuestra mediante tabla de verdad que la fórmula $\Phi = p \to (p \land q)$ es una contingencia.

    ![Diagrama: Contingencia](/static/img/nodos/contingencia-ejemplos.svg)

  pasos:
    - 'Paso 1: Disponer las $4$ combinaciones canónicas de entrada para $p$ y $q$.'
    - 'Paso 2: Calcular la subcolumna $(p \land q)$: $[V, F, F, F]^T$.'
    - 'Paso 3: Evaluar el condicional principal $p \to (p \land q)$:
      - Fila 1 ($V \to V$): $V$
      - Fila 2 ($V \to F$): $F$
      - Fila 3 ($F \to F$): $V$
      - Fila 4 ($F \to F$): $V$'
    - 'Paso 4: Obtener el vector de la columna principal: $[V, F, V, V]^T$.'
    - 'Paso 5: Analizar la composición del vector: Como contiene $3$ valores $V$ y $1$ valor $F$ (no es puramente $V$ ni puramente $F$), se concluye que la fórmula es una **contingencia**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la condición necesaria y suficiente para que una fórmula lógica se clasifique como una contingencia?'
    choices:
      - {text: 'Que su columna principal contenga al menos un valor Verdadero ($V$) y al menos un valor Falso ($F$)', is_correct: true}
      - {text: 'Que todos los valores de su columna principal sean Verdaderos', is_correct: false}
      - {text: 'Que todos los valores de su columna principal sean Falsos', is_correct: false}
      - {text: 'Que la fórmula contenga exactamente dos variables proposicionales', is_correct: false}
    explanation: 'La alternativa correcta es ''Que su columna principal contenga al menos un valor Verdadero ($V$) y al menos un valor Falso ($F$)''. Es la definición exacta de contingencia.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la negación de una fórmula $\Phi$ es una contingencia, ¿qué tipo de fórmula es $\Phi$?'
    choices:
      - {text: 'Una contingencia', is_correct: true}
      - {text: 'Una tautología', is_correct: false}
      - {text: 'Una contradicción', is_correct: false}
      - {text: 'Un axioma', is_correct: false}
    explanation: 'La alternativa correcta es ''Una contingencia''. La negación de un vector mixto $[V, \dots, F]^T$ produce otro vector mixto $[F, \dots, V]^T$, que sigue siendo contingente.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Construir la tabla de verdad completa para las $n$ variables de la fórmula ($2^n$ filas).'
  - 'Paso 2: Calcular metódicamente las columnas auxiliares y la columna principal.'
  - 'Paso 3: Inspeccionar las celdas de la columna principal.'
  - 'Paso 4: Si se encuentran valores $V$ y valores $F$ combinados, clasificar formalmente la fórmula como contingencia.'
errores_correccion: |
  - **Error 1:** Afirmar que una contingencia debe tener exactamente el 50% de verdades y el 50% de falsedades. **Cómo corregirlo:** Una fórmula con 7 valores $V$ y 1 valor $F$ (o viceversa) es igualmente una contingencia; basta que exista al menos un valor de cada tipo.
  - **Error 2:** Creer que las proposiciones simples atómicas ($p, q$) son tautologías. **Cómo corregirlo:** Toda variable proposicional simple $p$ tiene vector $(V, F)^T$, por lo que es en sí misma una contingencia.
ejemplos:
  - titulo: 'Clasificación de disyunción simple'
    enunciado: '¿La fórmula $p \lor q$ es una contingencia?'
    alternativas:
      - 'Sí, su vector es $[V, V, V, F]^T$'
      - 'No, es una tautología'
      - 'No, es una contradicción'
    respuesta: 'Sí, su vector es $[V, V, V, F]^T$'
    solucion_pasos:
      - '1. Posee 3 valores $V$ y 1 valor $F$.'
      - '2. Es una contingencia.'
  - titulo: 'Clasificación de condicional simple'
    enunciado: '¿La fórmula $p \to q$ es una contingencia?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, su vector $[V, F, V, V]^T$ contiene tanto $V$ como $F$.'
  - titulo: 'Porcentaje de funciones contingentes'
    enunciado: '¿Para 2 variables, 14 de las 16 funciones booleanas posibles son contingencias?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, de $2^{2^2} = 16$ funciones, 1 es tautología y 1 contradicción, restando 14 contingencias.'
  - titulo: 'Negación de contingencia'
    enunciado: '¿La negación de $\neg(p \land q)$ es una contingencia?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\neg(p \land q)$ es contingente y su negación $p \land q$ también es contingente.'
errores_frecuentes:
  - 'La afirmación de que una contingencia exige exactamente igual cantidad de filas verdaderas que falsas.'
  - 'La afirmación de que una fórmula con una sola fila falsa entre ocho filas se clasifica como tautología.'
  - 'La afirmación de que la negación de una contingencia se convierte en una contradicción.'
  - 'La afirmación de que las proposiciones atómicas simples como $p$ son tautologías por defecto.'
  - 'La afirmación de que las contingencias no pueden evaluarse mediante tablas de verdad finitas.'
afirmaciones_verdaderas:
  - 'Una fórmula proposicional es una contingencia si y solo si su columna principal en la tabla de verdad contiene al menos un valor verdadero ($V$) y al menos un valor falso ($F$).'
  - 'La gran mayoría de las fórmulas proposicionales generables corresponden a contingencias, cuya validez depende de la asignación particular de sus variables componentes.'
al_terminar_debes_poder: |
  QUÉ: Identificar, demostrar y clasificar fórmulas proposicionales contingentes.
  CÓMO: Construir la tabla de verdad y comprobar la presencia simultánea de valores $V$ y $F$ en el vector de la columna principal.

  ![Cuadro resumen: Contingencia](/static/img/nodos/contingencia-resumen.svg)
