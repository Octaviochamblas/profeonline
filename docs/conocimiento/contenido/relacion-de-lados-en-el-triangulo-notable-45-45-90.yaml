semantic_id: MAT.GEO.TRIANGULOS_NOTABLES.TRIANGULO_45_45_90
resumen_inicial: 'El triángulo notable $45^\circ-45^\circ-90^\circ$ es un triángulo
  rectángulo isósceles cuyos catetos son iguales ($L, L$) y cuya hipotenusa es siempre
  igual al cateto multiplicado por la raíz de 2 ($L\sqrt{2}$), con razón métrica $1
  : 1 : \sqrt{2}$.'
explicacion_simple: '![Triángulo 45-45-90](/static/img/nodos/relacion-de-lados-en-el-triangulo-notable-45-45-90-intro.svg)


  Si cortas un cuadrado perfecto por su diagonal, obtienes dos **triángulos notables
  de $45^\circ-45^\circ-90^\circ$**. Como vienen de un cuadrado, sus dos catetos miden
  lo mismo ($L$). Y su hipotenusa tiene una regla muy directa:


  - **Catetos iguales**: Ambos catetos miden siempre la misma longitud ($L$).

  - **Hipotenusa**: Siempre mide el cateto multiplicado por la raíz de 2 ($L\sqrt{2}$).

  - **Ejemplo**: Si los catetos miden $5\text{ cm}$, la hipotenusa mide directamente
  $5\sqrt{2}\text{ cm}$.

  '
explicacion_formal: '### Definición formal

  El triángulo rectángulo isósceles es el triángulo notable de ángulos interiores
  $\{45^\circ, 45^\circ, 90^\circ\}$, resultante de trazar la diagonal de un cuadrado
  de lado $k$. Sus lados guardan la proporción métrica fija:


  $$\text{Lados} = \{k, \; k, \; k\sqrt{2}\} \quad (k > 0)$$


  $$\text{Cateto}_1 = k, \quad \text{Cateto}_2 = k, \quad \text{Hipotenusa} = k\sqrt{2}$$


  ### Desglose simbólico y geométrico

  - Proporción $1 : 1 : \sqrt{2}$.

  - Ángulos agudos congruentes: $\alpha = \beta = 45^\circ = \frac{\pi}{4} \text{
  rad}$.

  - Despeje de cateto desde hipotenusa $c$: $k = \frac{c}{\sqrt{2}} = \frac{c\sqrt{2}}{2}$.

  - Razones trigonométricas canónicas: $\sin 45^\circ = \cos 45^\circ = \frac{\sqrt{2}}{2}$
  y $\tan 45^\circ = 1$.


  ### Síntesis didáctica

  El triángulo $45^\circ-45^\circ-90^\circ$ permite calcular diagonales de cuadrados
  y proyecciones ortogonales simétricas de forma instantánea sin usar calculadora.'
definiciones_clave: '- **Triángulo 45°-45°-90°**: Triángulo rectángulo isósceles con
  ángulos agudos de $45^\circ$.

  - **Razón notable**: Proporción constante de lados $1 : 1 : \sqrt{2}$.

  - **Diagonal del cuadrado**: Segmento de longitud $d = L\sqrt{2}$.

  '
propiedades_relaciones: '- **Cálculo directo de hipotenusa**: $c = L\sqrt{2}$.

  - **Despeje racionalizado de cateto**: $L = \frac{c}{\sqrt{2}} = \frac{c\sqrt{2}}{2}$.

  - **Área directa**: $A = \frac{L^2}{2} = \frac{c^2}{4}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Triángulo 45-45-90](/static/img/nodos/relacion-de-lados-en-el-triangulo-notable-45-45-90-ejemplos.svg)


    Un triángulo rectángulo tiene un ángulo agudo de $45^\circ$ y su hipotenusa mide
    $14\text{ cm}$. Calcula la longitud exacta de cada uno de sus catetos y determina
    el área del triángulo.

    '
  pasos:
  - 'Paso 1: Identificar el triángulo: al tener un ángulo de $45^\circ$ y uno de $90^\circ$,
    el otro agudo es $90^\circ - 45^\circ = 45^\circ$ (triángulo $45^\circ-45^\circ-90^\circ$).'
  - 'Paso 2: Aplicar la relación de la hipotenusa: $c = L\sqrt{2} = 14\text{ cm}$.'
  - 'Paso 3: Despejar el cateto $L$: $L = \frac{14}{\sqrt{2}} = \frac{14\sqrt{2}}{2}
    = 7\sqrt{2}\text{ cm}$.'
  - 'Paso 4: Calcular el área mediante el semiproducto de catetos: $A = \frac{L \cdot
    L}{2} = \frac{(7\sqrt{2})^2}{2} = \frac{49 \times 2}{2} = 49\text{ cm}^2$.'
  - 'Paso 5: Concluir que cada cateto mide $7\sqrt{2}\text{ cm}$ y el área es $49\text{
    cm}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la razón de lados en el triángulo notable 45°-45°-90°?
  choices:
  - text: '$1 : 1 : \sqrt{2}$ (catetos iguales $L$ y $L$, hipotenusa $L\sqrt{2}$)'
    is_correct: true
  - text: '$1 : \sqrt{3} : 2$'
    is_correct: false
  - text: '$3 : 4 : 5$'
    is_correct: false
  - text: '$1 : 2 : 3$'
    is_correct: false
  explanation: 'Por el teorema de Pitágoras en el triángulo isósceles, la razón de
    lados es $1 : 1 : \sqrt{2}$ (catetos iguales $L$ y $L$, hipotenusa $L\sqrt{2}$).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los catetos de un triángulo rectángulo de 45°-45°-90° miden 8 cm cada
    uno, ¿cuánto mide su hipotenusa?
  choices:
  - text: $8\sqrt{2}\text{ cm}$
    is_correct: true
  - text: $16\text{ cm}$
    is_correct: false
  - text: $8\sqrt{3}\text{ cm}$
    is_correct: false
  - text: $4\sqrt{2}\text{ cm}$
    is_correct: false
  explanation: Multiplicando directamente el cateto por $\sqrt{2}$ se obtiene $8\sqrt{2}\text{
    cm}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer la presencia de los ángulos $45^\circ-45^\circ-90^\circ$ o de
  catetos iguales en un triángulo rectángulo.'
- 'Paso 2: Si se conoce el cateto $L$, calcular la hipotenusa multiplicando por $\sqrt{2}$:
  $c = L\sqrt{2}$.'
- 'Paso 3: Si se conoce la hipotenusa $c$, calcular el cateto dividiendo por $\sqrt{2}$:
  $L = \frac{c\sqrt{2}}{2}$.'
errores_correccion: 'No confundas los triángulos notables: en el 45-45-90 la hipotenusa
  lleva raíz de 2 ($L\sqrt{2}$), no raíz de 3 ni el doble.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el cateto de un triángulo rectángulo isósceles mide $11\text{ cm}$,
    ¿cuánto mide su hipotenusa?
  alternativas:
  - $11\sqrt{2}\text{ cm}$
  - $22\text{ cm}$
  - $11\sqrt{3}\text{ cm}$
  respuesta: $11\sqrt{2}\text{ cm}$
  solucion_pasos:
  - En el triángulo $45^\circ-45^\circ-90^\circ$, la hipotenusa es $L\sqrt{2} = 11\sqrt{2}\text{
    cm}$.
- titulo: Ejemplo 2
  enunciado: Si la hipotenusa de un triángulo $45^\circ-45^\circ-90^\circ$ mide $16\text{
    cm}$, ¿cuánto mide cada cateto?
  alternativas:
  - $8\sqrt{2}\text{ cm}$
  - $8\text{ cm}$
  - $16\sqrt{2}\text{ cm}$
  respuesta: $8\sqrt{2}\text{ cm}$
  solucion_pasos:
  - $L = \frac{16}{\sqrt{2}} = \frac{16\sqrt{2}}{2} = 8\sqrt{2}\text{ cm}$.
- titulo: ¿Un triángulo rectángulo con dos ángulos de 45° tiene sus dos catetos de
    igual medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser isósceles.
- titulo: ¿La hipotenusa de un triángulo 45°-45°-90° mide el doble del cateto?
  respuesta: 'No'
  solucion_pasos:
  - No, mide $L\sqrt{2} \approx 1.414L$, no $2L$.
errores_frecuentes:
- Confundir $\sqrt{2}$ con $\sqrt{3}$ o con 2.
- Multiplicar por $\sqrt{2}$ cuando se debe dividir (al pasar de hipotenusa a cateto).
- Olvidar que los dos catetos son forzosamente de igual longitud.
- No racionalizar el resultado fraccionario dejando raíces en el denominador.
- Confundir el triángulo de 45-45-90 con el de 30-60-90.
afirmaciones_verdaderas:
- 'En el triángulo notable $45^\circ-45^\circ-90^\circ$ la proporción de lados es
  $1 : 1 : \sqrt{2}$.'
- La hipotenusa de un triángulo rectángulo isósceles de cateto $L$ es siempre $L\sqrt{2}$.
al_terminar_debes_poder: '**QUÉ:** Aplicar las razones métricas del triángulo notable
  $45^\circ-45^\circ-90^\circ$.


  **CÓMO:** Calculando lados e hipotenusa mediante las relaciones $c = L\sqrt{2}$
  y $L = \frac{c\sqrt{2}}{2}$.


  ![Resumen de Triángulo 45-45-90](/static/img/nodos/relacion-de-lados-en-el-triangulo-notable-45-45-90-resumen.svg)

  '
