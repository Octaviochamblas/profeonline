semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.RECORRIDO
resumen_inicial: 'Determinación del recorrido (rango) de la función coseno $f(x) = \cos(x)$ acotado estrictamente en el intervalo $[-1, 1]$.'
explicacion_simple: |
  El **recorrido** o rango de una función es el conjunto de todos los valores de salida ($y$) que la función puede producir. En el círculo unitario, la posición horizontal más a la derecha es $1$ y la posición más a la izquierda es $-1$. Por esta razón, por mucho que cambies el ángulo $x$, la gráfica del coseno jamás subirá más arriba de $1$ ni bajará más abajo de $-1$. El recorrido del coseno base es el intervalo cerrado $[-1, 1]$.
explicacion_formal: |
  ### Definición formal
  El **recorrido (o conjunto imagen)** de la función coseno fundamental $f(x) = \cos(x)$ se define analíticamente como el intervalo cerrado de números reales:
  $$\operatorname{Rec}(f) = \operatorname{Im}(f) = \{y \in \mathbb{R} : -1 \le y \le 1\} = [-1, 1]$$
  demostrado a partir de la acotación geométrica del círculo unitario $\mathcal{C}: x^2 + y^2 = 1 \implies x^2 = 1 - y^2 \le 1 \implies |x| \le 1$.

  ### Desglose simbólico
  - Cota inferior (mínimo absoluto): $y_{\min} = -1$, alcanzado en los puntos $x = \pi + 2k\pi$.
  - Cota superior (máximo absoluto): $y_{\max} = 1$, alcanzado en los puntos $x = 2k\pi$.
  - Intervalo cerrado: Los extremos $-1$ y $1$ **están incluidos** en el conjunto imagen.

  ### Síntesis didáctica
  El recorrido acota la oscilación de la onda cosenoidal. Si en un problema la función coseno base da como resultado un número fuera del rango $[-1, 1]$ (como $1.5$ o $-2$), significa que se cometió un error algebraico o que la ecuación carece de solución real.
definiciones_clave: |
  - **Recorrido / Rango ($\operatorname{Rec}$)**: Conjunto de valores de salida $y$ generados por la función.
  - **Función acotada**: Propiedad de una función cuyas salidas están limitadas superior e inferiormente por valores constantes.
  - **Intervalo cerrado $[-1, 1]$**: Rango continuo que incluye todas las posiciones horizontales entre $-1$ y $1$ ambos inclusive.
propiedades_relaciones: |
  - **Modificación por amplitud**: En una función de la forma $f(x) = A\cos(x)$, el recorrido se escala al intervalo $[-|A|, |A|]$.
  - **Modificación por desplazamiento vertical**: En $f(x) = \cos(x) + D$, el recorrido se desplaza al intervalo $[-1 + D, 1 + D]$.
ejemplo_guiado:
  enunciado: 'Determina el recorrido de la función transformada $g(x) = 2\cos(x) - 3$ identificando sus cotas mínima y máxima.'
  pasos:
    - 'Paso 1: Recordar el recorrido de la función coseno base: $-1 \le \cos(x) \le 1$.'
    - 'Paso 2: Multiplicar la desigualdad por la amplitud $A = 2$: $-2 \le 2\cos(x) \le 2$.'
    - 'Paso 3: Restar el desplazamiento vertical $D = 3$ a todos los miembros: $-2 - 3 \le 2\cos(x) - 3 \le 2 - 3$.'
    - 'Paso 4: Resolver las restas: $-5 \le g(x) \le -1$. El recorrido de la función transformada es $\operatorname{Rec}(g) = [-5, -1]$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el recorrido (conjunto imagen) de la función coseno base $f(x) = \cos(x)$?'
    choices:
      - {text: 'El intervalo cerrado $[-1, 1]$', is_correct: true}
      - {text: 'El conjunto de todos los números reales $\mathbb{R}$', is_correct: false}
      - {text: 'El intervalo abierto $]-1, 1[$', is_correct: false}
      - {text: 'El intervalo positivo $[0, 1]$', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo cerrado $[-1, 1]$''. Los valores de salida del coseno están acotados entre $-1$ y $1$ inclusive.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el recorrido de la función amplificada $h(x) = 3\cos(x)$?'
    choices:
      - {text: '$[-3, 3]$', is_correct: true}
      - {text: '$[-1, 1]$', is_correct: false}
      - {text: '$[0, 3]$', is_correct: false}
      - {text: '$[-3, 0]$', is_correct: false}
    explanation: 'La alternativa correcta es ''$[-3, 3]$''. Multiplicar por $3$ escala las cotas de la onda de $-1 \cdot 3 = -3$ a $1 \cdot 3 = 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Partir de la restricción base del coseno: $-1 \le \cos(x) \le 1$.'
  - 'Paso 2: Aplicar la multiplicación de la amplitud $|A|$ a los límites del intervalo.'
  - 'Paso 3: Sumar o restar el desplazamiento vertical $D$ a ambos extremos.'
  - 'Paso 4: Escribir el intervalo cerrado resultante $[y_{\min}, y_{\max}]$.'
errores_correccion: |
  - **Error 1:** Usar un intervalo abierto $]-1, 1[$ pensando que los extremos no se alcanzan. **Cómo corregirlo:** La función coseno alcanza exactamente los valores de $-1$ y $1$ en los cuadrantales ($0$ y $\pi$), por lo que los corchetes deben ser cerrados.
  - **Error 2:** Creer que la función coseno no tiene solución para ecuaciones dentro del recorrido. **Cómo corregirlo:** Para cualquier valor $k \in [-1, 1]$, la ecuación $\cos x = k$ posee infinitas soluciones reales.
ejemplos:
  - titulo: 'Inexistencia de solución fuera del recorrido'
    enunciado: '¿Tiene solución real la ecuación $\cos(x) = -1.8$?'
    alternativas:
      - 'No, pues $-1.8 \notin [-1, 1]$'
      - 'Sí, $x = \pi$'
      - 'Sí, $x = \frac{3\pi}{2}$'
    respuesta: 'No, pues $-1.8 \notin [-1, 1]$'
    solucion_pasos:
      - '1. El recorrido del coseno está acotado en $[-1, 1]$.'
      - '2. Como $-1.8 < -1$, la ecuación no tiene solución real.'
  - titulo: 'Recorrido con desplazamiento vertical'
    enunciado: '¿Cuál es el recorrido de $f(x) = \cos(x) + 5$?'
    alternativas:
      - '$[4, 6]$'
      - '$[-1, 1]$'
      - '$[0, 5]$'
    respuesta: '$[4, 6]$'
    solucion_pasos:
      - '1. Sumamos 5 a la desigualdad base: $-1 + 5 \le \cos(x) + 5 \le 1 + 5$.'
      - '2. Ocupa el intervalo $[4, 6]$.'
  - titulo: 'Pertenencia del valor cero al recorrido'
    enunciado: '¿El valor $0$ pertenece al recorrido de la función coseno base?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $0 \in [-1, 1]$ y se alcanza en $x = \frac{\pi}{2}, \frac{3\pi}{2}$, etc.'
  - titulo: 'Cota máxima absoluta'
    enunciado: '¿Es $1$ la mayor salida posible que entrega la función coseno base?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el valor máximo absoluto de $y = \cos x$ es $1$.'
errores_frecuentes:
  - 'La afirmación de que el recorrido de la función coseno base es el conjunto de todos los números reales $\mathbb{R}$.'
  - 'La afirmación de que la función coseno no puede tomar valores negativos.'
  - 'La afirmación de que los extremos $-1$ y $1$ están excluidos del recorrido.'
  - 'La afirmación de que la ecuación $\cos(x) = 2$ posee solución real.'
  - 'La afirmación de que el escalado de la función por una constante negativa convierte el recorrido en números imaginarios.'
afirmaciones_verdaderas:
  - 'El recorrido o conjunto imagen de la función coseno base $f(x) = \cos(x)$ es el intervalo cerrado $[-1, 1]$.'
  - 'Toda ecuación de la forma $\cos(x) = c$ carece de soluciones en los números reales si $|c| > 1$.'
al_terminar_debes_poder: |
  QUÉ: Determinar y calcular el recorrido de la función coseno base y de sus transformaciones lineales.
  CÓMO: Escalar e intervenir el intervalo acotado $[-1, 1]$ mediante la amplitud $|A|$ y el desplazamiento vertical $D$.
