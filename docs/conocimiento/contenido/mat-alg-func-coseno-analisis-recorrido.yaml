semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.RECORRIDO
resumen_inicial: 'Determinación del recorrido de la función coseno: círculo unitario,
  amplitud, período y transformaciones de Análisis de la función coseno.'
explicacion_simple: Al igual que el seno, el resultado del coseno siempre queda restringido
  a un rango pequeño y fijo de valores.
explicacion_formal: '### Definición formal


  Como $\cos(x)$ es la coordenada $x$ de un punto sobre el círculo unitario, y todo
  punto del círculo cumple $-1\leq x\leq1$, se concluye que $-1\leq\cos(x)\leq1$ para
  todo $x$. Los valores extremos $-1$ y $1$ sí se alcanzan.


  ### Desarrollo didáctico


  El máximo $\cos(x)=1$ se alcanza en $x=0$ (y en todos sus coterminales); el mínimo
  $\cos(x)=-1$ se alcanza en $x=\pi$. Ningún valor de $x$ produce un resultado fuera
  de $[-1,1]$.'
definiciones_clave: '- **Determinación del recorrido de la función coseno**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a determinación del recorrido de la función coseno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    determinación del recorrido de la función coseno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de determinación del recorrido de la función coseno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
