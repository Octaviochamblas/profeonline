semantic_id: MAT.NUM.FINANZAS_PERSONALES.TIPOS_DEUDA
resumen_inicial: 'Clasificación de tipos de deuda (personal, estudiantil, tarjeta):
  concepto y propiedades fundamentales en Finanzas personales.'
explicacion_simple: No toda la deuda es mala. Endeudarse para comprar una casa o estudiar
  puede ser una inversión en tu futuro. Pero endeudarse para ir de vacaciones o comprar
  comida es una trampa mortal.
explicacion_formal: 'Una deuda es un compromiso de devolver dinero prestado más un
  interés. No todas tienen el mismo riesgo:


  - **Hipotecario:** Sirve para comprar propiedades. Suele tener las tasas de interés
  más bajas porque la propiedad es la garantía.

  - **Automotriz:** Para comprar vehículos. El vehículo queda en ''prenda'' (no puedes
  venderlo hasta pagar la deuda).

  - **Consumo / Personal:** El banco te presta dinero en efectivo para lo que quieras.
  Tiene tasas más altas porque no hay garantías físicas fuertes.

  - **Estudiantil (CAE, Fondo Solidario):** Para financiar educación superior. Suelen
  tener tasas bajas y condiciones de pago asociadas a los ingresos futuros.

  - **Tarjetas de Crédito / Líneas de Crédito:** Es dinero plástico o disponible al
  instante. Si no pagas el total facturado a fin de mes, cobran los intereses más
  altos del mercado (interés rotativo).'
definiciones_clave: '- **Clasificación de tipos de deuda (personal, estudiantil, tarjeta)**:
  Elemento central dentro del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
