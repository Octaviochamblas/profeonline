procedimiento:
- 'Paso 1: Analiza el propósito del dinero prestado.'
- 'Paso 2: Evalúa qué tipo de garantía exige el banco (la casa, el auto, o solo tu
  firma).'
- 'Paso 3: A menor garantía, mayor suele ser la tasa de interés que te cobran.'
errores_correccion: Evita confundir los datos de entrada al operar con clasificación
  de tipos de deuda (personal, estudiantil, tarjeta).
ejemplos:
- titulo: Comprando un departamento
  enunciado: Si quieres adquirir un departamento a 20 años plazo, ¿qué tipo de crédito
    debes solicitar?
  solucion_pasos:
  - Es un bien raíz.
  - Es a largo plazo.
  - Por lo tanto, la opción correcta es un Crédito Hipotecario.
errores_frecuentes:
- Usar la Tarjeta de Crédito en muchas cuotas para pagar compras grandes y permanentes
  (sus intereses arruinan el presupuesto).
- Pedir un Crédito de Consumo para comprar una casa (los plazos son muy cortos y la
  cuota sería impagable).
afirmaciones_verdaderas:
