semantic_id: MAT.NUM.FINANZAS.CLASIFICACION_DEUDAS
resumen_inicial: 'Las deudas personales se clasifican según su costo y destino en deuda de consumo/tarjeta (alto costo) y deuda hipotecaria/estudiantil (largo plazo y formación patrimonial): $\text{ICF} = \frac{\sum \text{Cuotas}}{\text{Ingreso Líquido}} \cdot 100\%$.'
explicacion_simple: |
  No todas las deudas son iguales:
  - **Deuda de Tarjeta de Crédito y Línea de Sobregiro**: Es la más cara del mercado (altas tasas de interés). Si pagas solo el "pago mínimo", la deuda crece mes a mes como una bola de nieve.
  - **Crédito de Consumo o Automotriz**: Préstamos a plazo medio (1 a 3 años) para bienes de uso.
  - **Crédito Hipotecario y Deuda Estudiantil**: Deudas a largo plazo con tasas más bajas orientadas a adquirir una vivienda o una profesión (construcción de patrimonio o capital humano).

  ![Clasificación de tipos de deuda](/static/img/nodos/clasificacion-de-tipos-de-deuda-personal-estudiantil-tarjeta-intro.svg)
explicacion_formal: |
  ### Definición formal
  La **Carga Financiera Total Mensual ($C_F$)** es la suma de todas las cuotas de amortización e intereses que un individuo debe pagar en el mes:
  $$C_F = \sum_{j=1}^m \text{Cuota}_j$$
  El **Indicador de Carga Financiera (ICF)** evalúa el nivel de compromiso del ingreso líquido mensual ($I_L$):
  $$\text{ICF} = \left(\frac{\sum_{j=1}^m \text{Cuota}_j}{I_L}\right) \cdot 100\%$$

  ### Escala de Riesgo de Endeudamiento
  - $\text{ICF} \le 25\%$: **Nivel Saludable y Seguro**.
  - $25\% < \text{ICF} \le 40\%$: **Zona de Alerta** (rigidez presupuestaria).
  - $\text{ICF} > 40\%$: **Sobreendeudamiento Crítico** (alto riesgo de insolvencia).

  ### Síntesis didáctica
  - Ecuación del ICF: $\text{ICF} = (\sum \text{Cuotas} / I_L) \cdot 100\%$.
  - Regla de oro de tarjetas: Pagar siempre el monto total facturado del mes.
definiciones_clave: |
  - **Carga Financiera (ICF)**: Porcentaje del ingreso mensual comprometido en el servicio de deudas.
  - **Costo Total del Crédito (CTC)**: Monto final total que se termina pagando al banco tras amortizaciones, intereses, comisiones y seguros.
  - **Pago Mínimo**: Monto mínimo exigido por la tarjeta que cubre principalmente intereses y comisiones, amortizando casi nada de capital.
propiedades_relaciones: |
  - **Efecto multiplicador del interés rotativo**: Usar crédito rotativo de tarjeta capitaliza intereses mensuales generando crecimiento exponencial de la deuda.
  - **Estrategia de bola de nieve / avalancha**: Métodos de desendeudamiento que priorizan pagar primero la deuda de menor monto o la de mayor tasa de interés.
ejemplo_guiado:
  enunciado: 'Una persona percibe un ingreso líquido mensual de $\$1.000.000$ y paga $\$120.000$ por un crédito de consumo y $\$80.000$ por la tarjeta de crédito. Calcula su carga financiera total y el porcentaje de su ingreso comprometido.'
  imagen: '/static/img/nodos/clasificacion-de-tipos-de-deuda-personal-estudiantil-tarjeta-ejemplos.svg'
  pasos:
    - 'Paso 1: Sumamos las cuotas mensuales de deuda: $C_F = 120.000 + 80.000 = $\$200.00$0$.'
    - 'Paso 2: Planteamos la razón respecto al ingreso líquido: $\frac{200.000}{1.000.000} = 0,20$.'
    - 'Paso 3: Convertimos a porcentaje multiplicando por 100: $\text{ICF} = 0,20 \cdot 100\% = 20\%$.'
    - 'Paso 4: Conclusión: La carga financiera es de **$20\%$**, ubicándose en un nivel saludable ($< 25\%$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué consecuencia financiera tiene pagar únicamente el ''monto mínimo'' en la tarjeta de crédito mes tras mes?'
    choices:
      - {text: 'La deuda se perpetúa en el tiempo y genera un elevado cobro de intereses acumulados', is_correct: true}
      - {text: 'La deuda se extingue completamente en 6 meses', is_correct: false}
      - {text: 'El banco cancela los intereses automáticamente', is_correct: false}
      - {text: 'El cupo de crédito se duplica de inmediato', is_correct: false}
    explanation: 'La alternativa correcta es ''La deuda se perpetúa en el tiempo y genera un elevado cobro de intereses acumulados''. El pago mínimo cubre casi exclusivamente comisiones e intereses sin amortizar capital.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una persona tiene un ingreso de $\$800.000$ y cuotas de crédito por $\$320.000$, ¿cuál es su nivel de carga financiera (ICF)?'
    choices:
      - {text: '$40\%$, calculando $(320.000 / 800.000) \cdot 100\% = 40\%$', is_correct: true}
      - {text: '$25\%$, dividiendo por 4', is_correct: false}
      - {text: '$50\%$, estimando la mitad', is_correct: false}
      - {text: '$32\%$, tomando el numerador directo', is_correct: false}
    explanation: 'La alternativa correcta es ''$40\%$, calculando $(320.000 / 800.000) \cdot 100\% = 40\%$''. Representa el umbral de alerta máxima presupuestaria.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar todas las deudas activas con sus respectivas cuotas mensuales y tasas de interés.'
  - 'Paso 2: Sumar el monto total de cuotas a pagar en el mes ($C_F = \sum \text{Cuotas}$).'
  - 'Paso 3: Dividir la carga total entre el ingreso líquido mensual del individuo.'
  - 'Paso 4: Multiplicar por 100 para evaluar el Indicador de Carga Financiera (ICF) y verificar si supera el umbral del $25\%-30\%$.'
errores_correccion: |
  - **Error 1:** Realizar únicamente el pago mínimo en tarjetas de crédito creyendo que amortiza el saldo de capital. **Cómo corregirlo:** El pago mínimo cubre intereses; **debes pagar siempre el total facturado del período**.
  - **Error 2:** Calcular el ICF utilizando el sueldo bruto en lugar del ingreso líquido disponible. **Cómo corregirlo:** La capacidad real de pago se evalúa **sobre el ingreso líquido que efectivamente ingresa a la cuenta bancaria**.
ejemplos:
  - titulo: 'Cálculo de carga financiera'
    enunciado: 'Para un ingreso de $\$500.000$ y cuotas de deuda por $\$100.000$, ¿cuál es el ICF?'
    alternativas:
      - '$20\%$'
      - '$10\%$'
      - '$50\%$'
    respuesta: '$20\%$'
    solucion_pasos:
      - '1. $\text{ICF} = (100.000 / 500.000) \cdot 100\% = 20\%$.'
  - titulo: 'Evaluación de sobreendeudamiento'
    enunciado: '¿Un ICF del $45\%$ sitúa a la persona en zona de sobreendeudamiento crítico?'
    alternativas:
      - 'Sí, supera el umbral máximo recomendado del 30% a 40%'
      - 'No, el límite legal es 100%'
      - 'No, representa una carga saludable'
    respuesta: 'Sí, supera el umbral máximo recomendado del 30% a 40%'
    solucion_pasos:
      - '1. Todo ICF mayor a $40\%$ implica un riesgo financiero crítico.'
  - titulo: 'Prioridad de pago de deudas'
    enunciado: 'En una estrategia financiera de desendeudamiento eficiente, ¿qué deuda conviene amortizar primero de forma acelerada?'
    alternativas:
      - 'La deuda con mayor tasa de interés (como tarjetas de crédito o líneas de sobregiro)'
      - 'El crédito hipotecario a 25 años con la tasa más baja'
      - 'La deuda más antigua sin importar su tasa de interés'
    respuesta: 'La deuda con mayor tasa de interés (como tarjetas de crédito o líneas de sobregiro)'
    solucion_pasos:
      - '1. Minimizar el costo financiero exige liquidar primero los pasivos más costosos.'
  - titulo: 'Impacto en el presupuesto disponible'
    enunciado: 'Si una persona con $\$1.000.000$ de ingreso paga $\$300.000$ en deudas, ¿cuánto dinero le queda para sus gastos de vida?'
    alternativas:
      - '$\$700.000$'
      - '$\$300.000$'
      - '$\$1.300.000$'
    respuesta: '$\$700.000$'
    solucion_pasos:
      - '1. $1.000.000 - 300.000 = $\$700.00$0$.'
errores_frecuentes:
  - 'Efectuar únicamente el pago mínimo en la tarjeta de crédito cancela de manera progresiva la totalidad de la deuda.'
  - 'El indicador de carga financiera se calcula dividiendo el ingreso líquido entre la suma de cuotas mensuales.'
  - 'Un nivel de endeudamiento del cincuenta por ciento del ingreso mensual es catalogado como financieramente seguro.'
  - 'Todas las deudas tienen la misma tasa de interés independientemente de si son tarjetas o créditos hipotecarios.'
  - 'El uso de la línea de sobregiro bancario carece de cobro de intereses o comisiones financieras.'
afirmaciones_verdaderas:
  - 'El Indicador de Carga Financiera corresponde al cociente entre la suma de cuotas de deuda y el ingreso líquido mensual ($\text{ICF} = \frac{\sum \text{Cuotas}}{I_L} \cdot 100\%$).'
  - 'Pagar el monto total facturado de la tarjeta de crédito evita el devengo de intereses rotativos de alto costo.'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/clasificacion-de-tipos-de-deuda-personal-estudiantil-tarjeta-resumen.svg)

  QUÉ: Clasificar los tipos de deuda y evaluar el nivel de carga financiera mensual del individuo.
  CÓMO: Consolidar las cuotas de deuda del período y calcular el Indicador de Carga Financiera mediante $\text{ICF} = \left(\frac{\sum \text{Cuotas}}{I_L}\right) \cdot 100\%$, contrastando con los límites de seguridad financiera.
