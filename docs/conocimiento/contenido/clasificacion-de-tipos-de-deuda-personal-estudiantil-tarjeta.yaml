resumen_inicial: Las deudas personales representan compromisos financieros de pago
  clasificables según su garantía y tasa en crédito de consumo/personal, crédito estudiantil
  (CAE) y deuda rotativa por tarjeta de crédito.
explicacion_simple: Una deuda es dinero pedido en préstamo que debemos devolver con
  intereses. Existen créditos personales a plazo fijo, préstamos estudiantiles con
  tasas subsidiadas y deudas de tarjetas de crédito que cobran intereses elevados
  si no pagamos el total a fin de mes.
explicacion_formal: 'El **Pasivo o Carga Financiera de Deuda** cuantifica las obligaciones
  de pago periódicas $D_t$ según su estructura crediticia:


  $$D_{total} = C_{consumo} + C_{estudiantil} + D_{rotativa\_tarjeta}$$


  **Diferenciación de costo de capital:**

  - Deuda no rotativa (Crédito personal/estudiantil): Cuotas mensuales fijas con amortización
  programada.

  - Deuda rotativa (Tarjeta de crédito): Cobro de tasa de interés sobre saldos insolutos
  pactados o en mora.'
definiciones_clave: '- **Tipos de deuda**: Clasificación en préstamos personales,
  crédito estudiantil y saldo rotativo de tarjetas de crédito.'
propiedades_relaciones: '- **Carga financiera de deuda**: Suma de las cuotas y compromisos
  de pago mensuales.'
ejemplo_guiado:
  enunciado: Un usuario paga una cuota de crédito universitario por \$40.000 y el
    saldo en rotación de su tarjeta por \$80.000. Clasifique ambas deudas.
  pasos:
  - 'Paso 1: La cuota del crédito universitario es una obligación estudiantil con
    tasa subsidiada $\implies$ Crédito Estudiantil.'
  - 'Paso 2: El saldo rotativo de la tarjeta es una deuda de consumo rotativo $\implies$
    Deuda de Tarjeta de Crédito.'
  - 'Conclusión: Crédito Estudiantil y Deuda de Tarjeta de Crédito.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué característica distingue a la deuda por saldo rotativo en tarjeta
    de crédito?
  choices:
  - text: Cobra tasas de interés sobre saldos no pagados a la fecha de vencimiento
    is_correct: true
  - text: No cobra ningún tipo de interés
    is_correct: false
  - text: Es una cuota fija sin variabilidad
    is_correct: false
  - text: Es un dividendo hipotecario estatal
    is_correct: false
  explanation: La alternativa correcta es 'Cobra tasas de interés sobre saldos no
    pagados a la fecha de vencimiento'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se clasificó el pago del crédito universitario?
  choices:
  - text: Como crédito estudiantil de cuota programada
    is_correct: true
  - text: Como saldo rotativo de tarjeta
    is_correct: false
  - text: Como ingreso de capital
    is_correct: false
  - text: Como gasto variable imprevisto
    is_correct: false
  explanation: La alternativa correcta es 'Como crédito estudiantil de cuota programada'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de clasificar compromisos de deuda
  en créditos personales, estudiantiles y rotativos de tarjetas de crédito.
semantic_id: MAT.NUM.FINANZAS_PERSONALES.TIPOS_DEUDA
procedimiento:
- 'Paso 1: Identificar las variables financieras de ingresos, gastos, tasas de interés
  o sueldos imponibles.'
- 'Paso 2: Aplicar la fórmula financiera correspondiente ($B = I - G$, $R\%$, $r_{real}$
  o $10\% \text{ AFP}$).'
- 'Paso 3: Calcular el resultado y evaluar la estabilidad presupuestaria.'
errores_correccion: '- **Error 1: Confundir la tasa de interés nominal con la tasa
  real sin restar la inflación del IPC.** **Cómo corregirlo:** La ganancia real de
  poder adquisitivo exige descontar el IPC ($r_{real} \approx r_{nominal} - \text{IPC}$).


  - **Error 2: Calcular la cotización previsional de AFP sobre el sueldo líquido en
  vez del imponible.** **Cómo corregirlo:** El $10\%$ obligatorio se aplica estrictamente
  sobre el SUELDO IMPONIBLE (hasta el tope legal).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.FINANZAS_PERSONALES.TIPOS_DEUDA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de finanzas personales.
- titulo: Ejemplo 2
  enunciado: Verificación de equilibrio financiero.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal de balance o cotización.
- titulo: ¿Es el 10% el porcentaje obligatorio de cotización previsional a la AFP?
  respuesta: Sí
  solucion_pasos:
  - Sí, sobre el sueldo imponible hasta el tope legal.
- titulo: ¿Genera un balance B = I - G positivo capacidad de ahorro?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa un superávit mensual de caja.
errores_frecuentes:
- Calcular el porcentaje de cotización previsional a la AFP sobre el sueldo líquido
  recibido en cuenta corriente.
- Sumar directamente la tasa de interés nominal y la inflación pretendiendo obtener
  la rentabilidad real.
- Considerar los gastos variables como egresos de costo fijo que no se pueden modificar
  mensualmente.
- La tasa de inflación del IPC incrementa el poder adquisitivo del dinero depositado
  a tasa fija.
- Clasificar el dividendo pagado por acciones como un gasto imprevisto en el presupuesto
  personal.
afirmaciones_verdaderas:
- 'El balance financiero de caja se calcula restando los egresos totales a los ingresos
  recibidos: $B_{neto} = I_{total} - G_{total}$.'
- La cotización previsional obligatoria a la AFP en Chile equivale al 10% del sueldo
  imponible ajustado al tope legal.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
