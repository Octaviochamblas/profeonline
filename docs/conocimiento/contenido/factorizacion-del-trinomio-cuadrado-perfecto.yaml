procedimiento:
- 'Paso 1: Ordena el trinomio de mayor a menor exponente.'
- 'Paso 2: Verifica que los extremos sean positivos y tengan raíz cuadrada exacta.
  Extráelas.'
- 'Paso 3: Multiplica esas dos raíces por 2. Si el resultado es igual a la magnitud
  del término central, es un TCP.'
- 'Paso 4: Escribe un paréntesis que contenga ambas raíces separadas por el signo
  del término central original. Cierra y eleva al cuadrado (o multiplica el paréntesis
  por sí mismo).'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en factorización del trinomio cuadrado perfecto.
ejemplos:
- titulo: Factoriza $m^2 - 10m + 25$
  enunciado: Factoriza $m^2 - 10m + 25$.
  solucion_pasos:
  - 'Raíz del primero: $m$. Raíz del tercero: $5$.'
  - 'Doble producto: $2 * m * 5 = 10m$. (Cumple el control de calidad).'
  - Signo del medio es negativo (-).
  - 'Resultado: $(m - 5)^2$.'
- titulo: Evalúa si $x^2 + 7x + 49$ es un TCP.
  solucion_pasos:
  - La raíz de 49 es 7. La raíz de $x^2$ es $x$. El doble producto sería $14x$, pero
    el centro tiene $7x$.
- titulo: 'Respecto de «Factorización del trinomio cuadrado perfecto»: ¿La siguiente
    formulación es cor'
  enunciado: 'Respecto de «Factorización del trinomio cuadrado perfecto»: ¿La siguiente
    formulación es correcta? «Un Trinomio Cuadrado Perfecto (TCP) tiene la forma $a^2
    \pm 2ab + b^2$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un Trinomio Cuadrado Perfecto
    (TCP) tiene la forma $a^2 \pm 2ab + b^2$.'
- titulo: 'Respecto de «Factorización del trinomio cuadrado perfecto»: ¿La siguiente
    conclusión es corr'
  enunciado: 'Respecto de «Factorización del trinomio cuadrado perfecto»: ¿La siguiente
    conclusión es correcta? «Olvidar comprobar el término central (el ''control de
    calidad'') y asumir ciegamente que es TCP solo por ver dos cuadrados a los extremos»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un Trinomio Cuadrado Perfecto
    (TCP) tiene la forma $a^2 \pm 2ab + b^2$.'
errores_frecuentes:
- Olvidar comprobar el término central (el 'control de calidad') y asumir ciegamente
  que es TCP solo por ver dos cuadrados a los extremos.
- Intentar aplicar la regla si el tercer término es negativo (ej. $x^2 + 2x - 1$).
  Un cuadrado nunca es negativo en los Reales.
- Tres términos cualquiera.
- Extremos cuadrados perfectos y centro igual al producto de las raíces.
- Todos los términos positivos.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_ponder: Descomponer en factores irreducibles expresiones algebraicas
