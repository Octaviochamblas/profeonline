resumen_inicial: La factorización del trinomio cuadrado perfecto transforma la suma
  $A^2 \pm 2AB + B^2$ en la expresión equivalente en forma de binomio al cuadrado
  $(A \pm B)^2$.
explicacion_simple: 'Cuando confirmas que un trinomio es un TCP, su factorización
  es instantánea: tomas la raíz del primer término ($A$), la raíz del último término
  ($B$), pones el signo del medio y elevas todo el paréntesis al cuadrado: $(A \pm
  B)^2$.'
explicacion_formal: 'Dado el trinomio verificado $P = A^2 \pm 2AB + B^2$, la **Factorización
  del Trinomio Cuadrado Perfecto** responde a la regla de equivalencia polinomial:


  $$A^2 \pm 2AB + B^2 = (A \pm B)^2$$


  **Desglose simbólico:**

  - $A = \sqrt{A^2}$: Base del primer término.

  - $B = \sqrt{B^2}$: Base del segundo término.

  - Signo $\pm$: Signo operativo del término central $+2AB$ o $-2AB$.

  - $(A \pm B)^2 = (A \pm B)(A \pm B)$: Producto de dos factores primos idénticos.


  > **Complemento didáctico:** Es el proceso inverso al desarrollo del cuadrado de
  un binomio suma o diferencia.'
definiciones_clave: '- **Binomio al cuadrado**: Expresión $(A \pm B)^2$ que representa
  la multiplicación de una base binomia por sí misma.

  - **Factor de multiplicidad 2**: Raíz algebraica duplicada que produce la forma
  al cuadrado.'
propiedades_relaciones: '- **Inversidad del Cuadrado de Binomio**: $(A + B)^2 = A^2
  + 2AB + B^2 \iff A^2 + 2AB + B^2 = (A + B)^2$.'
ejemplo_guiado:
  enunciado: Factorice el Trinomio Cuadrado Perfecto $9x^2 + 30x + 25$.
  pasos:
  - 'Paso 1: Extraer la raíz del primer término: $A = \sqrt{9x^2} = 3x$.'
  - 'Paso 2: Extraer la raíz del último término: $B = \sqrt{25} = 5$.'
  - 'Paso 3: Identificar el signo del término central $+30x$: El signo es positivo
    ($+$).'
  - 'Paso 4: Formar el binomio con sus bases y el signo correspondiente: $(3x + 5)$.'
  - 'Paso 5: Elevar el binomio al cuadrado: $(3x + 5)^2$.'
  - 'Conclusión: La factorización del TCP es $(3x + 5)^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión factorizada formal de un trinomio de la forma $A^2
    + 2AB + B^2$?
  choices:
  - text: $(A + B)^2$
    is_correct: true
  - text: $(A - B)^2$
    is_correct: false
  - text: $(A + B)(A - B)$
    is_correct: false
  - text: $A^2 + B^2$
    is_correct: false
  explanation: La alternativa correcta es '$(A + B)^2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la factorización de $9x^2 + 30x + 25$, ¿cuál es el binomio al cuadrado
    obtenido?
  choices:
  - text: $(3x + 5)^2$
    is_correct: true
  - text: $(3x - 5)^2$
    is_correct: false
  - text: $(9x + 5)^2$
    is_correct: false
  - text: $(3x + 25)^2$
    is_correct: false
  explanation: La alternativa correcta es '$(3x + 5)^2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener las raíces $A$ y $B$ de los términos cuadrados perfectos extremos.'
- 'Paso 2: Asignar al binomio $(A \dots B)$ el signo del término central del trinomio.'
- 'Paso 3: Encerrar entre paréntesis el binomio resultante y elevarlo al exponente
  2.'
errores_correccion: '- **Error 1: Dejar el paréntesis con exponente 1 entregando un
  binomio lineal simple.** **Cómo corregirlo:** La factorización de un TCP DEBE ir
  elevada al cuadrado: $(A + B)^2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice el trinomio $m^2 - 12m + 36$.
  alternativas:
  - $(m - 6)^2$
  - $(m + 6)^2$
  - $(m - 6)(m + 6)$
  respuesta: $(m - 6)^2$
  solucion_pasos:
  - 1. $A = m, B = 6$. Signo central minus ($-$ ).
  - '2. Resultado: $(m - 6)^2$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la forma factorizada de $16y^2 + 8y + 1$?
  alternativas:
  - $(4y + 1)^2$
  - $(4y - 1)^2$
  - $(16y + 1)^2$
  respuesta: $(4y + 1)^2$
  solucion_pasos:
  - 1. $A = 4y, B = 1$. Signo central plus ($+$).
  - '2. Resultado: $(4y + 1)^2$.'
- titulo: ¿Es $(2x - 3y)^2$ la factorización del trinomio $4x^2 - 12xy + 9y^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $A=2x, B=3y$ con signo negativo central.
- titulo: Al factorizar un TCP $A^2 + 2AB + B^2$, ¿los dos factores parentéticos $(A
    + B)(A + B)$ son distintos?
  respuesta: 'No'
  solucion_pasos:
  - No, son exactamente idénticos, por lo que se resumen como $(A + B)^2$.
errores_frecuentes:
- Escribir el binomio lineal simple $(A + B)$ en lugar de elevar la base entre paréntesis
  al cuadrado.
- Usar la fórmula de diferencia de cuadrados conjugada $(A + B)(A - B)$ para factorizar
  un TCP.
- Mantener los términos elevados al cuadrado dentro del binomio al cuadrado resultante.
- Declarar que un TCP con signo negativo central se factoriza como una suma al cuadrado
  $(A + B)^2$.
- Multiplicar por 2 las raíces dentro del paréntesis resultativo.
afirmaciones_verdaderas:
- La factorización de un Trinomio Cuadrado Perfecto produce siempre un binomio al
  cuadrado $(A \pm B)^2$.
- El binomio al cuadrado representa la multiplicación de una misma base binomia por
  sí misma.
al_terminar_debes_poder: Al terminar serás capaz de factorizar trinomios cuadrados
  perfectos escribiéndolos como binomios al cuadrado.
