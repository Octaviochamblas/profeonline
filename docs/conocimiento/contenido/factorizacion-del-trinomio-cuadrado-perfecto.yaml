semantic_id: MAT.ALG.FACTOR_CUADRADOS.FACTORIZACION_TRINOMIO_CUADRADO
resumen_inicial: 'Factorización del trinomio cuadrado perfecto: concepto, método de
  descomposición y reglas en Factorización asociada a cuadrados.'
explicacion_simple: A veces nos topamos con trinomios que parecen hijos únicos, pero
  en realidad provienen de gemelos exactos multiplicándose. Son el resultado directo
  del Cuadrado de un Binomio. Saber reconocerlos te ahorrará el camino largo.
explicacion_formal: "### Definición formal\n\nEsa es la regla de oro que define al\
  \ Cuadrado de Binomio (a^2 + 2ab + b^2).\n\n### Desarrollo didáctico\n\nEl Cuadrado\
  \ de Binomio nos enseñó que $(a + b)^2 = a^2 + 2ab + b^2$.\nPara ir en reversa (factorizar),\
  \ debemos someter a nuestro trinomio a un 'Control de Calidad' de tres pasos.\n\n\
  Prueba con $4x^2 + 12x + 9$:\n1. ¿El primer y último término son positivos y tienen\
  \ raíz cuadrada exacta?\n   Sí. Raíz de $4x^2$ es $2x$. Raíz de $9$ es $3$.\n2.\
  \ ¿El término del medio es EXACTAMENTE el doble del producto de estas raíces?\n\
  \   Calculemos: $2 \\cdot (2x) \\cdot (3) = 12x$. Sí. Coincide perfectamente con\
  \ el centro del trinomio.\n\nDado que pasó el control de calidad, es un TCP oficial.\n\
  Tomamos ambas raíces ($2x$ y $3$), les ponemos el signo del término central ($+$),\
  \ las encerramos en un paréntesis y elevamos al cuadrado: $(2x + 3)^2$."
definiciones_clave: '- **Factorización del trinomio cuadrado perfecto**: Técnica de
  factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en factorización del trinomio cuadrado perfecto.'
