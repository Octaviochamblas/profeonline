semantic_id: MAT.ALG.FACTOR_CUADRADOS.FACTORIZACION_TRINOMIO_CUADRADO
resumen_inicial: La factorización del trinomio cuadrado perfecto establece la equivalencia $A^2 \pm 2AB + B^2 = (A \pm B)^2$
  construyendo un binomio al cuadrado formado por las raíces cuadradas extremas.
explicacion_simple: "Para **factorizar un Trinomio Cuadrado Perfecto** (ej: $x^2 + 10x + 25$):\n- **FÓRMULA DIRECTA DE FACTORIZACIÓN**:\n\
  \  $$\\mathbf{A^2 \\pm 2AB + B^2 = (A \\pm B)^2}$$\n- **PROCEDIMIENTO EN 3 PASOS**:\n  1. **Extrae la raíz cuadrada del\
  \ 1.er término ($A$)**:\n     - $\\sqrt{x^2} = \\mathbf{x}$.\n  2. **Extrae la raíz cuadrada del 3.er término ($B$)**:\n\
  \     - $\\sqrt{25} = \\mathbf{5}$.\n  3. **Copia el signo del término central ($2AB$) y eleva al cuadrado**:\n     - Como\
  \ el término central $+10x$ es **positivo** $\\implies \\mathbf{(x + 5)^2}$.\n     - Si el término central hubiese sido\
  \ $-10x$ $\\implies \\mathbf{(x - 5)^2}$.\n\n![Factorización del trinomio cuadrado perfecto](/static/img/nodos/factorizacion-del-trinomio-cuadrado-perfecto-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea el trinomio cuadrado perfecto $T(x, y) = A^2(x) \pm 2A(x)B(y) + B^2(y) \in \mathbb{R}[x, y]$. El operador de **factorización
  trinomial cuadrática** define el mapa de contracción de grado:


  $$\mathbf{A^2 \pm 2AB + B^2 = (A \pm B)^2}$$


  ### Demostración por Expansión de Binomio

  Por el Teorema del Binomio para $n=2$:


  $$(A \pm B)^2 = A^2 \pm 2 \cdot A \cdot B + (\pm B)^2 = A^2 \pm 2AB + B^2$$


  lo cual demuestra la bidireccionalidad de la identidad algebraica entre el cuadrado de binomio y el trinomio cuadrado perfecto.


  ### Síntesis didáctica

  Factorizar un TCP consiste en condensar sus tres términos en la potencia segunda de un binomio formado por la adición o
  sustracción de sus raíces extremas.

  '
definiciones_clave: '- **Cuadrado de binomio ($(A \pm B)^2$)**: Expresión binómica elevada a la potencia 2 equivalente al
  TCP factorizado.

  - **Signo de enlace**: Signo algebraico ($+$ o $-$) conservado del término central que une a las raíces $A$ y $B$.

  - **Bases del binomio ($A, B$)**: Valores $\sqrt{A^2}$ y $\sqrt{B^2}$ que forman los sumandos del binomio factorizado.

  '
propiedades_relaciones: '- **Invarianza del signo del exponente**: $(A - B)^2 = (B - A)^2$. Restar las bases en cualquier
  orden dentro de la elevación al cuadrado produce exactamente la misma expresión expandida.

  '
ejemplo_guiado:
  enunciado: Factoriza completamente el trinomio cuadrado perfecto $16x^2 - 24xy + 9y^2$.
  pasos:
  - 'Paso 1: Extraemos la raíz cuadrada del primer término $A = \sqrt{16x^2} = \mathbf{4x}$.'
  - 'Paso 2: Extraemos la raíz cuadrada del tercer término $B = \sqrt{9y^2} = \mathbf{3y}$.'
  - 'Paso 3: Verificamos el signo del término central: $-24xy$ posee signo **negativo** ($-$).'
  - 'Paso 4: Formamos el binomio al cuadrado con las raíces y el signo menos central: $(4x - 3y)^2$.'
  - 'Conclusión: La expresión factorizada es **$(4x - 3y)^2$**.'
  imagen: /static/img/nodos/factorizacion-del-trinomio-cuadrado-perfecto-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la factorización completa del trinomio cuadrado perfecto $x^2 + 12x + 36$?
  choices:
  - text: La factorización es $(x + 6)^2$, tomando las raíces $A=x, B=6$ y el signo positivo central
    is_correct: true
  - text: La factorización es $(x - 6)^2$
    is_correct: false
  - text: La factorización es $(x + 6)(x - 6)$
    is_correct: false
  - text: La factorización es $(x + 12)^2$
    is_correct: false
  explanation: La alternativa correcta es 'La factorización es $(x + 6)^2$, tomando las raíces $A=x, B=6$ y el signo positivo
    central'. Raíces $A=x, B=6$, signo $+ \implies (x+6)^2$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al factorizar el trinomio $25a^2 - 30ab + 9b^2$, ¿cuál es el binomio al cuadrado resultante?
  choices:
  - text: El binomio resultante es $(5a - 3b)^2$, conservando el signo negativo del término central $-30ab$
    is_correct: true
  - text: El binomio resultante es $(5a + 3b)^2$
    is_correct: false
  - text: El binomio resultante es $(25a - 9b)^2$
    is_correct: false
  - text: El binomio resultante es $(5a - 3b)(5a + 3b)$
    is_correct: false
  explanation: La alternativa correcta es 'El binomio resultante es $(5a - 3b)^2$, conservando el signo negativo del término
    central $-30ab$'. Raíces $A=5a, B=3b$, signo $- \implies (5a-3b)^2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer la raíz cuadrada del primer término cuadrático ($A$).'
- 'Paso 2: Extraer la raíz cuadrada del segundo término cuadrático ($B$).'
- 'Paso 3: Identificar el signo ($+$ o $-$) del término doble producto central.'
- 'Paso 4: Escribir el binomio $(A \pm B)^2$ elevándolo a la segunda potencia.'
errores_correccion: '- **Error 1:** Intercambiar la factorización de un TCP con una diferencia de cuadrados (escribir $x^2
  + 6x + 9 = (x+3)(x-3)$). **Cómo corregirlo:** El trinomio cuadrado perfecto **FACTORIZA COMO UN BINOMIO AL CUADRADO CON
  SIGNOS IGUALES ($(x+3)^2 = (x+3)(x+3)$)**.

  - **Error 2:** Colocar el signo positivo en el binomio cuando el término central es negativo. **Cómo corregirlo:** El signo
  del binomio factorizado **DEBE COINCIDIR EXACTAMENTE CON EL SIGNO DEL TÉRMINO CENTRAL**.

  '
ejemplos:
- titulo: Término central positivo
  enunciado: Para $m^2 + 8m + 16$, ¿es $(m + 4)^2$ la factorización correcta?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt{16}=4$ y signo central $+$.
- titulo: Término central negativo
  enunciado: Para $y^2 - 10y + 25$, ¿obtenemos $(y - 5)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt{25}=5$ y signo central $-$.
- titulo: Coeficiente en variable
  enunciado: Para $9x^2 + 12x + 4$, ¿es $(3x + 2)^2$ su respuesta factorizada?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt{9x^2}=3x$ y $\sqrt{4}=2$.
- titulo: Equivalencia de diferencias opuestas
  enunciado: ¿Es $(a - b)^2$ numéricamente equivalente a $(b - a)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-1)^2 = 1$.
errores_frecuentes:
- Factorizar un trinomio cuadrado perfecto como binomios conjugados con signos opuestos.
- Invertir el signo del término central al armar el binomio al cuadrado.
- El exponente cuadrático 2 en el paréntesis de la respuesta final no es escrito.
- Elevar al cuadrado las raíces antes de escribirlas dentro del binomio.
- Olvidar verificar la expresión expandiendo el binomio por $(A \pm B)^2$.
afirmaciones_verdaderas:
- El trinomio cuadrado perfecto $A^2 \pm 2AB + B^2$ factoriza como el cuadrado de binomio $(A \pm B)^2$.
- El signo del binomio al cuadrado es exactamente igual al signo del término central del trinomio.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/factorizacion-del-trinomio-cuadrado-perfecto-resumen.svg)


  QUÉ: Factorizar trinomios cuadrados perfectos escribiéndolos como un binomio al cuadrado con su signo central correcto.

  CÓMO: Escribir $(A \pm B)^2$ colocando en el binomio las raíces cuadradas de los términos extremos y asignando el signo
  ($+$ o $-$) del término doble producto central.

  '
