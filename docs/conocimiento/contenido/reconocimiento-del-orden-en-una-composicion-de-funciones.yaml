semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.ORDEN_COMPOSICION
resumen_inicial: 'Reconocimiento del orden en una composición de funciones: conceptos,
  representación y propiedades en Composición de funciones.'
explicacion_simple: Duplicar un número y luego sumarle uno no es lo mismo que sumarle
  uno y luego duplicarlo. El orden de composición casi siempre importa.
explicacion_formal: '### Definición formal


  Dadas dos funciones $f$ y $g$, no existe garantía general de que $(f\circ g)(x)=(g\circ
  f)(x)$ para todo $x$; esta igualdad solo se cumple para pares particulares de funciones
  (por ejemplo, cuando una es la inversa de la otra, dando la identidad), no como
  regla general.


  ### Desarrollo didáctico


  Para verificar si el orden importa en un caso concreto, basta con calcular ambas
  composiciones y compararlas término a término.


  Si $f(x)=x+1$ y $g(x)=2x$: $(f\circ g)(x)=2x+1$, mientras que $(g\circ f)(x)=2(x+1)=2x+2$.
  Son expresiones distintas, confirmando que el orden importa en este caso.'
definiciones_clave: '- **Reconocimiento del orden en una composición de funciones**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a reconocimiento del orden en una composición
  de funciones.'
ejemplo_guiado:
