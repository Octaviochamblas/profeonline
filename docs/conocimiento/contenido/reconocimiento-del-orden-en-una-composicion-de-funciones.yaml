semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.ORDEN_COMPOSICION
resumen_inicial: 'La composición de funciones no es conmutativa en general: $(f \circ g)(x) \neq (g \circ f)(x)$, por lo que el orden de las operaciones altera el resultado final.'
explicacion_simple: "![La composición de funciones no es conmutativa en general: $(f \\circ g)(x) \\neq (g \\circ f)(x)$, por lo que el orden de las operaciones altera el resultado final](/static/img/nodos/reconocimiento-del-orden-en-una-composicion-de-funciones-intro.svg)\n\n\nEn los números, multiplicar $3 \\times 5$ es igual a $5 \\times 3$ (es conmutativo).\n\n**¡Pero en las funciones NO ocurre esto!**\n- Ponerse los calcetines y luego los zapatos **no es lo mismo** que ponerse los zapatos y luego los calcetines.\n- Si $f$ duplica ($2x$) y $g$ suma tres ($x + 3$):\n  - $(f \\circ g)(x) = 2(x + 3) = 2x + 6$.\n  - $(g \\circ f)(x) = 2x + 3$.\n- ¡Los resultados $2x + 6$ y $2x + 3$ son completamente distintos!"
explicacion_formal: 'En el conjunto de aplicaciones $\mathcal{F}(X, X)$, la operación binaria de composición $\circ$ **no satisface la propiedad conmutativa**:

  $$\exists f, g \quad \text{tales que} \quad f \circ g \neq g \circ f$$


  **Casos excepcionales de conmutatividad ($f \circ g = g \circ f$):**

  1. **Con la función identidad**: $f \circ \text{id} = \text{id} \circ f = f$.

  2. **Con la función inversa**: $f \circ f^{-1} = f^{-1} \circ f = \text{id}$.

  3. **Potencias de la misma función**: $f^n \circ f^m = f^m \circ f^n = f^{n+m}$.

  4. **Funciones lineales homotéticas**: $f(x) = ax$ y $g(x) = cx \implies f(g(x)) = g(f(x)) = (ac)x$.'
definiciones_clave: '- **No conmutatividad**: Propiedad algebraica donde alterar el orden de los factores u operandos modifica el resultado.

  - **Conmutatividad excepcional**: Casos particulares donde dos operadores funcionales conmutan.'
propiedades_relaciones: '- **Diferencia de pendientes / interceptos**: En afines, $(f \circ g)$ y $(g \circ f)$ comparten la misma pendiente $ac$ pero tienen distintos interceptos ($ad + b \neq cb + d$).

  - **Estructura algebraica**: Las funciones forman un monoide no conmutativo bajo la composición.'
ejemplo_guiado:
  enunciado: '![Ejemplo La composición de funciones no es conmutativa en general: $(f \circ g)(x) \neq (g \circ f)(x)$, por lo que el orden de las operaciones altera el resultado final](/static/img/nodos/reconocimiento-del-orden-en-una-composicion-de-funciones-ejemplos.svg)



    Sean $f(x) = 3x - 2$ y $g(x) = 4x + 5$.

    1) Halla $(f \circ g)(x)$ y $(g \circ f)(x)$.

    2) Compara sus coeficientes de posición y concluye sobre la conmutatividad.'
  pasos:
  - 'Paso 1: Calcular $(f \circ g)(x) = 3(4x + 5) - 2 = 12x + 15 - 2 = 12x + 13$.'
  - 'Paso 2: Calcular $(g \circ f)(x) = 4(3x - 2) + 5 = 12x - 8 + 5 = 12x - 3$.'
  - 'Paso 3: Observar que ambas tienen pendiente $12$, pero interceptos $13 \neq -3$.'
  - 'Paso 4: Concluir formalmente que $(f \circ g)(x) \neq (g \circ f)(x)$ (la operación no es conmutativa).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Es conmutativa la composición de funciones en general?
  choices:
  - text: No, en general (f ∘ g)(x) != (g ∘ f)(x).
    is_correct: true
  - text: Si, siempre da el mismo resultado.
    is_correct: false
  - text: Solo cuando las pendientes son negativas.
    is_correct: false
  - text: Solo si ambas son cuadraticas.
    is_correct: false
  explanation: La alternativa correcta es 'No, en general (f ∘ g)(x) != (g ∘ f)(x).'. El orden de las funciones altera el resultado.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En cuál de los siguientes casos particulares SÍ se cumple que $f \circ g = g \circ f$?
  choices:
  - text: Cuando una de las funciones es la inversa de la otra (f y f^(-1)).
    is_correct: true
  - text: Cuando una es afin y la otra cuadratica.
    is_correct: false
  - text: Cuando ambas tienen pendiente negativa.
    is_correct: false
  - text: Nunca jamas se cumple.
    is_correct: false
  explanation: La alternativa correcta es 'Cuando una de las funciones es la inversa de la otra (f y f^(-1)).'. Ambas composiciones dan la identidad $x$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular algebraicamente la primera composición $(f \circ g)(x) = f(g(x))$.'
- 'Paso 2: Calcular algebraicamente la segunda composición $(g \circ f)(x) = g(f(x))$.'
- 'Paso 3: Comparar término a término los polinomios o expresiones resultantes.'
- 'Paso 4: Verificar si coinciden idénticamente o si son funciones distintas.'
errores_correccion: '- **Error común:** Pensar que porque $f \circ g$ y $g \circ f$ tienen la misma pendiente en funciones afines ($ac$), son la misma función.

  - **Cómo corregirlo:** Compara también los **términos independientes**: si los coeficientes de posición son distintos ($ad+b \neq cb+d$), las funciones son diferentes.'
ejemplos:
- titulo: 'Ejemplo 1: No conmutatividad afín'
  enunciado: Si $f(x) = 2x$ y $g(x) = x + 4$, ¿cuánto vale $(f \circ g)(x) - (g \circ f)(x)$?
  alternativas:
  - '4'
  - '0'
  - '-4'
  - 2x
  respuesta: '4'
  solucion_pasos:
  - 'Paso 1: $(f \circ g)(x) = 2(x + 4) = 2x + 8$.'
  - 'Paso 2: $(g \circ f)(x) = 2x + 4$.'
  - 'Paso 3: $(2x + 8) - (2x + 4) = 4$.'
- titulo: 'Ejemplo 2: Conmutatividad con la identidad'
  enunciado: Si $\text{id}(x) = x$ y $f(x) = 5x - 9$, ¿cuánto es $(f \circ \text{id})(x)$ y $(\text{id} \circ f)(x)$?
  alternativas:
  - Ambas dan 5x - 9
  - Dan 5x y -9
  - Dan x y 5x - 9
  - Dan 0
  respuesta: Ambas dan 5x - 9
  solucion_pasos:
  - 'Paso 1: La función identidad conmuta con cualquier función.'
- titulo: 'Ejemplo 3: Lineales puras'
  enunciado: Si $f(x) = 3x$ y $g(x) = 7x$, ¿conmutan bajo composición?
  alternativas:
  - Sí, ambas composiciones dan 21x
  - No, porque 3 != 7
  - Solo en el origen
  - No conmutan nunca
  respuesta: Sí, ambas composiciones dan 21x
  solucion_pasos:
  - 'Paso 1: $f(g(x)) = 3(7x) = 21x$ y $g(f(x)) = 7(3x) = 21x$ (conmutan).'
- titulo: 'Ejemplo 4: Evaluación numérica'
  enunciado: Si $(f \circ g)(3) = 10$, ¿se puede asegurar que $(g \circ f)(3) = 10$?
  alternativas:
  - No, porque la composición no es conmutativa
  - Sí, siempre dan lo mismo
  - Solo si 3 es par
  - Solo si son inversas
  respuesta: No, porque la composición no es conmutativa
  solucion_pasos:
  - 'Paso 1: La no conmutatividad implica que las evaluaciones en general difieren.'
errores_frecuentes:
- Asumir que la composición conmuta como la multiplicación.
- Olvidar que las funciones lineales puras sí conmutan entre sí.
- Confundir la asociatividad con la conmutatividad.
afirmaciones_verdaderas:
- La composición de funciones es una operación asociativa pero no conmutativa.
- Una función conmuta bajo composición con su función inversa y con la función identidad.
al_terminar_debes_poder: '**QUÉ:** Reconocer, demostrar y justificar la no conmutatividad en la composición de funciones.


  **CÓMO:** Calculando (f ∘ g)(x) y (g ∘ f)(x) y contrastando algebraicamente sus diferencias.


