semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.ORDEN_COMPOSICION
resumen_inicial: La composición de funciones NO es conmutativa ($f \circ g \neq g
  \circ f$), por lo que el orden de las funciones altera el resultado final.
explicacion_simple: 'A diferencia de la suma o la multiplicación donde $2 + 3 = 3
  + 2$, en la composición de funciones **EL ORDEN IMPORTA ABSOLUTAMENTE**:

  - En general, **$(f \circ g)(x)$ NO ES IGUAL a $(g \circ f)(x)$**.

  - Aplicar primero ''sumar 3'' y luego ''elevar al cuadrado'' a $x = 2$ da $(2+3)^2
  = 25$.

  - Aplicar primero ''elevar al cuadrado'' y luego ''sumar 3'' a $x = 2$ da $2^2 +
  3 = 7$.'
explicacion_formal: 'En el álgebra de operadores funcionales, la propiedad conmutativa
  no se cumple globalmente:


  $$f \circ g \neq g \circ f \quad \text{en el caso general}$$


  **Desglose de la fórmula:**

  - La no conmutatividad implica que la sustitución $f(g(x))$ produce una regla y
  dominio geométrico completamente distinto a $g(f(x))$.'
definiciones_clave: '- **No conmutatividad**: Propiedad fundamental de la composición
  por la cual el orden de ejecución altera el mapeo funcional.'
propiedades_relaciones: '- **Excepción de conmutatividad**: $f \circ g = g \circ f$
  ocurre de forma excepcional cuando una función se compone con la identidad o cuando
  son funciones mutuamente inversas ($f \circ f^{-1} = f^{-1} \circ f = \operatorname{id}$).'
ejemplo_guiado:
  enunciado: Compara las expresiones algebraicas de $(f \circ g)(x)$ y $(g \circ f)(x)$
    para $f(x) = x^2$ y $g(x) = x + 3$.
  pasos:
  - 'Paso 1: Calcular $(f \circ g)(x) = f(g(x)) = f(x + 3) = (x + 3)^2 = x^2 + 6x
    + 9$.Paso 2: Calcular $(g \circ f)(x) = g(f(x)) = g(x^2) = x^2 + 3$.Paso 3: Comparar
    los resultados: $x^2 + 6x + 9 \neq x^2 + 3$.Paso 4: Concluir que el orden de composición
    genera fórmulas algebraicas distintas.'
checkpoints:
- placement: after_explicacion_formal
  question: Al calcular $(f \circ g)(x)$ y $(g \circ f)(x)$ para $f(x) = x^2$ y $g(x)
    = x + 3$, ¿cuáles son las expresiones obtenidas?
  choices:
  - text: $(f \circ g)(x) = x^2 + 6x + 9$ y $(g \circ f)(x) = x^2 + 3$
    is_correct: true
  - text: $(f \circ g)(x) = x^2 + 3$ y $(g \circ f)(x) = x^2 + 6x + 9$
    is_correct: false
  - text: Ambas composiciones dan $x^2 + 3$.
    is_correct: false
  - text: Ambas composiciones dan $x^3 + 3$.
    is_correct: false
  explanation: La alternativa correcta es '$(f \circ g)(x) = x^2 + 6x + 9$ y $(g \circ
    f)(x) = x^2 + 3$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué caso excepcional se cumple que $(f \circ g)(x) = (g \circ f)(x)$?
  choices:
  - text: Cuando $g$ es la función inversa de $f$, o cuando una de ellas es la función
      identidad.
    is_correct: true
  - text: Siempre se cumple en todas las funciones.
    is_correct: false
  - text: Cuando las dos funciones son negativas.
    is_correct: false
  - text: Nunca jamás se puede cumplir.
    is_correct: false
  explanation: La alternativa correcta es 'Cuando $g$ es la función inversa de $f$,
    o cuando una de ellas es la función identidad.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar con atención la notación pedida $(f \circ g)$ o $(g \circ f)$.'
- 'Paso 2: Asegurar que la función situada a la derecha se introduzca dentro de la
  situada a la izquierda.'
- 'Paso 3: No asumir que invertir las funciones dará la misma respuesta.'
errores_correccion: '- **Error común:** Asumir sin verificar que $(f \circ g)(x) =
  (g \circ f)(x)$.

  - **Cómo corregirlo:** La composición no conmuta. Para calcular $(f \circ g)(x)$
  debes meter $g$ en $f$, y para $(g \circ f)(x)$ debes meter $f$ en $g$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de composición de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de composición de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La composición de funciones (f o g)(x) equivale a f(g(x))?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición notacional de composición de funciones.
- titulo: ¿La composición de funciones es conmutativa en general?
  respuesta: 'No'
  solucion_pasos:
  - No, en general (f o g)(x) != (g o f)(x).
errores_frecuentes:
- Confundir la composición de funciones $(f \circ g)(x)$ con la multiplicación de
  funciones $(f \cdot g)(x)$.
- Evaluar primero la función externa de la izquierda en lugar de la función interna
  de la derecha.
- Asumir falsamente que la composición de funciones es conmutativa ($(f \circ g)(x)
  = (g \circ f)(x)$).
- Olvidar distribuir coeficientes al sustituir expresiones compuestas en el cálculo
  algebraico.
- Determinar el dominio únicamente desde la fórmula reducida final ignorando las restricciones
  del proceso intermedio.
afirmaciones_verdaderas:
- La composición de funciones $(f \circ g)(x) = f(g(x))$ consiste en evaluar la función
  externa $f$ en el resultado de la función interna $g(x)$.
- El dominio de la composición $\operatorname{Dom}(f \circ g)$ hereda todas las restricciones
  de la función interna $g(x)$ y exige que $g(x) \in \operatorname{Dom}(f)$.
al_terminar_debes_poder: Al finalizar este recurso podrás comprender, evaluar numéricamente
  y calcular algebraicamente composiciones de funciones, reconociendo la no conmutatividad
  y analizando sus dominios resultantes.
