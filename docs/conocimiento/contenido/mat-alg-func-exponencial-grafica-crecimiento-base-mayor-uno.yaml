semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.CRECIMIENTO_BASE_MAYOR_UNO
resumen_inicial: 'El crecimiento exponencial ocurre cuando la base cumple $b > 1$, haciendo que la gráfica suba velozmente hacia $+\infty$ a la derecha y se pegue asintóticamente a $y = 0$ a la izquierda.'
explicacion_simple: |
  Cuando la base de una función exponencial es mayor que 1 (como $b = 2$ o $b = 5$), la función representa un crecimiento acelerado. A la izquierda del gráfico (con números negativos), la curva es casi plana y flota rozando la línea del eje $x$. Al cruzar el eje vertical en el punto $(0, a)$, la curva despega hacia arriba haciéndose cada vez más empinada, creciendo a una velocidad que supera a cualquier función lineal o polinomial.
explicacion_formal: |
  ### Definición formal
  Para una función exponencial $f(x) = a \cdot b^x$ con $a > 0$, la condición $b > 1$ define un **modelo de crecimiento exponencial estrictamente creciente** caracterizado analíticamente por:
  $$\forall x_1, x_2 \in \mathbb{R}, \quad x_1 < x_2 \implies f(x_1) < f(x_2)$$
  con derivada primera estrictamente positiva $f'(x) = a \cdot b^x \cdot \ln(b) > 0$ (dado que $\ln(b) > 0$ para $b > 1$).

  ### Desglose simbólico
  - Comportamiento asintótico a la izquierda: $\lim_{x \to -\infty} a \cdot b^x = 0^+$. La recta $y = 0$ es asíntota horizontal a la izquierda.
  - Comportamiento divergente a la derecha: $\lim_{x \to +\infty} a \cdot b^x = +\infty$.
  - Convexidad permanente: La derivada segunda $f''(x) = a \cdot b^x \cdot (\ln b)^2 > 0$ es estrictamente positiva en todo $\mathbb{R}$, indicando que la gráfica es cóncava hacia arriba (convexa).

  ### Síntesis didáctica
  Diferenciar crecimiento lineal de crecimiento exponencial con $b > 1$: Una recta crece a una tasa constante de cambio (adición). La curva exponencial con $b > 1$ crece a una tasa porcentual o multiplicativa constante, lo que produce una aceleración continua de la pendiente.
definiciones_clave: |
  - **Crecimiento exponencial ($b > 1$)**: Comportamiento funcional donde los valores de salida se multiplican por $b > 1$ en cada incremento unitario.
  - **Divergencia a $+\infty$**: Tendencia ilimitada de la gráfica hacia valores infinitamente grandes al avanzar hacia la derecha.
  - **Aproximación asintótica inferior**: Descenso de la curva hacia la recta $y = 0$ sin tocarla al retroceder hacia la izquierda.
propiedades_relaciones: |
  - **Dominancia sobre polinomios**: Para cualquier polinomio $P(x)$, la función exponencial $b^x$ con $b > 1$ crece eventualmente más rápido que $P(x)$ cuando $x \to +\infty$ ($\lim_{x \to +\infty} \frac{b^x}{x^n} = +\infty$).
  - **Efecto de la magnitud de la base**: Cuanto mayor es la base $b > 1$, más vertical y empinada resulta la gráfica para $x > 0$.
ejemplo_guiado:
  enunciado: 'Analiza el crecimiento de la función exponencial $f(x) = 2 \cdot 4^x$, hallando sus límites cuando $x \to -\infty$ y $x \to +\infty$, y calcula el valor de su pendiente promedio en los intervalos $[0, 1]$ y $[1, 2]$.'
  pasos:
    - 'Paso 1: Identificamos la base $b = 4 > 1$ y $a = 2 > 0$. La función es estrictamente creciente.'
    - 'Paso 2: Evaluamos el límite a la izquierda: $\lim_{x \to -\infty} 2 \cdot 4^x = 0^+$ (asíntota horizontal $y = 0$).'
    - 'Paso 3: Evaluamos el límite a la derecha: $\lim_{x \to +\infty} 2 \cdot 4^x = +\infty$ (divergencia).'
    - 'Paso 4: Puntos: $f(0) = 2$, $f(1) = 8$, $f(2) = 32$.'
    - 'Paso 5: Pendiente en $[0, 1]$: $m_1 = \frac{8 - 2}{1 - 0} = 6$. Pendiente en $[1, 2]$: $m_2 = \frac{32 - 8}{2 - 1} = 24$. Comprobamos que la pendiente se cuadruplica, mostrando aceleración.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para una función exponencial $f(x) = a \cdot b^x$ con $a > 0$, ¿qué condición sobre la base $b$ garantiza que la gráfica sea estrictamente creciente y tienda a $+\infty$ cuando $x \to +\infty$?'
    choices:
      - {text: 'Que la base sea estrictamente mayor que uno ($b > 1$)', is_correct: true}
      - {text: 'Que la base esté comprimida entre cero y uno ($0 < b < 1$)', is_correct: false}
      - {text: 'Que la base sea igual a cero ($b = 0$)', is_correct: false}
      - {text: 'Que la base sea un número entero negativo', is_correct: false}
    explanation: 'La alternativa correcta es ''Que la base sea estrictamente mayor que uno ($b > 1$)''. Una base $b > 1$ produce la multiplicación acumulativa que origina el crecimiento exponencial.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si comparamos las funciones $f(x) = 3^x$ y $g(x) = 10^x$, ¿qué ocurre con sus gráficas en el cuadrante I ($x > 0$)?'
    choices:
      - {text: 'La gráfica de $g(x) = 10^x$ se eleva con mayor rapidez y pendiente que la de $f(x) = 3^x$', is_correct: true}
      - {text: 'La gráfica de $f(x) = 3^x$ se eleva con mayor rapidez que la de $g(x) = 10^x$', is_correct: false}
      - {text: 'Ambas gráficas son rectas paralelas de igual pendiente', is_correct: false}
      - {text: 'La gráfica de $g(x) = 10^x$ es una curva decreciente', is_correct: false}
    explanation: 'La alternativa correcta es ''La gráfica de $g(x) = 10^x$ se eleva con mayor rapidez y pendiente que la de $f(x) = 3^x$''. A mayor magnitud de la base $b > 1$, mayor es la aceleración de crecimiento.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la base $b$ de la función exponencial.'
  - 'Paso 2: Comprobar que $b > 1$ para ratificar el comportamiento de crecimiento.'
  - 'Paso 3: Trazar la asíntota horizontal $y = 0$ en el extremo izquierdo ($x \to -\infty$).'
  - 'Paso 4: Trazar la curva pasando por $(0, a)$ y elevándola aceleradamente hacia $+\infty$ a la derecha.'
errores_correccion: |
  - **Error 1:** Creer que una función exponencial con $b > 1$ crece a velocidad constante. **Cómo corregirlo:** La pendiente de la curva exponencial aumenta continuamente a medida que $x$ crece. No es una recta; es una curva acelerada.
  - **Error 2:** Asumir que para $x < 0$ la curva de crecimiento se vuelve negativa. **Cómo corregirlo:** Para $x < 0$, las potencias $b^x$ son números positivos pequeños. La curva se aproxima al eje $x$ ($y = 0$) por arriba, sin ser jamás negativa.
ejemplos:
  - titulo: 'Identificación de curva de crecimiento'
    enunciado: '¿La función $f(x) = 5 \cdot (1.8)^x$ es creciente?'
    alternativas:
      - 'Sí, porque $b = 1.8 > 1$'
      - 'No, porque $1.8$ no es entero'
      - 'No, es decreciente'
    respuesta: 'Sí, porque $b = 1.8 > 1$'
    solucion_pasos:
      - '1. La base es $b = 1.8$.'
      - '2. Como $1.8 > 1$ y $a = 5 > 0$, la función es estrictamente creciente.'
  - titulo: 'Comportamiento en el infinito negativo'
    enunciado: 'Para $f(x) = 2^x$, ¿el límite cuando $x \to -\infty$ es igual a 0?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $2^{-1000} = \frac{1}{2^{1000}} \approx 0$. La asíntota a la izquierda es $y = 0$.'
  - titulo: 'Aceleración de pendientes'
    enunciado: '¿La diferencia de alturas entre $x = 10$ y $x = 11$ en $f(x) = 2^x$ es mayor que la diferencia entre $x = 1$ y $x = 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En $[1, 2]$ sube $4 - 2 = 2$. En $[10, 11]$ sube $2048 - 1024 = 1024$. La tasa de cambio crece enormemente.'
  - titulo: 'Convexidad permanente'
    enunciado: '¿La gráfica de una función exponencial creciente $f(x) = b^x$ ($b > 1$) curva sus brazos hacia arriba en forma convexa?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Su derivada segunda es positiva en todo su dominio, garantizando convexidad hacia arriba.'
errores_frecuentes:
  - 'Una función exponencial con base $b > 1$ tiene una asíntota vertical a la derecha del gráfico.'
  - 'Al avanzar hacia la izquierda ($x \to -\infty$), la gráfica de $f(x) = 3^x$ cruza el eje $x$ volviéndose negativa.'
  - 'La velocidad de crecimiento de una función exponencial con $b > 1$ es la misma en todos sus puntos.'
  - 'Una función exponencial con $b = 1.2$ es decreciente porque la base está cerca de 1.'
  - 'La curva de crecimiento exponencial $f(x) = 2^x$ es superada eventualmente por cualquier función lineal $y = 1000x$.'
afirmaciones_verdaderas:
  - 'Para $a > 0$, una base $b > 1$ genera una curva exponencial estrictamente creciente que diverge a $+\infty$ a la derecha y se aproxima asintóticamente a $y = 0$ a la izquierda.'
  - 'La pendiente de una función exponencial creciente aumenta de manera continua a medida que la variable $x$ toma valores cada vez mayores.'
al_terminar_debes_poder: 'Analizar y graficar el crecimiento exponencial para bases $b > 1$ identificando sus asíntotas y tasas de aceleración.'
