semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.CRECIMIENTO_BASE_MAYOR_UNO
resumen_inicial: Cuando la base es mayor que uno ($b > 1$), la función exponencial
  es estrictamente creciente y su gráfica se dispara hacia arriba al aumentar $x$.
explicacion_simple: 'Si la base de una función exponencial $f(x) = b^x$ es mayor que
  1 (como $b = 2$, $b = 3$ o $b = 1{,}5$):

  - A medida que avanzamos hacia la derecha en el eje X, los valores de $y$ crecen
  cada vez más rápido.

  - Hacia la izquierda (valores de $x$ negativos), la curva se aproxima al eje X pero
  NUNCA lo toca (asíntota en $y = 0$).

  - La función es **estrictamente creciente** en todo su dominio real.'
explicacion_formal: 'Dada la función $f(x) = b^x$ with $b > 1$, la condición de **crecimiento
  exponencial estricto** se enuncia como:


  $$\forall x_1, x_2 \in \mathbb{R}, \quad x_1 < x_2 \implies b^{x_1} < b^{x_2}$$


  **Desglose de la fórmula:**

  - Monotonía estrictamente creciente con tasa de variación proporcional al valor
  instantáneo de la función.'
definiciones_clave: '- **Crecimiento exponencial ($b > 1$)**: Comportamiento funcional
  donde los valores de $y$ aumentan a ritmo acelerado conforme $x$ aumenta.'
propiedades_relaciones: '- **Asíntota izquierda**: Para $x \to -\infty$, la función
  tiende asintóticamente a $0^+$ ($y = 0$).'
ejemplo_guiado:
  enunciado: Compara los valores de $f(2)$ y $f(5)$ para la función exponencial $f(x)
    = 2^x$ para demostrar su crecimiento estricto.
  pasos:
  - 'Paso 1: Evaluar $f(2)$: $f(2) = 2^2 = 4$.'
  - 'Paso 2: Evaluar $f(5)$: $f(5) = 2^5 = 32$.'
  - 'Paso 3: Observar que como $2 < 5 \implies f(2) = 4 < 32 = f(5)$.'
  - 'Paso 4: Concluir que al ser $b = 2 > 1$, la función $f(x) = 2^x$ es estrictamente
    creciente.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función exponencial $f(x) = 2^x$, al comparar $f(2) = 4$ con $f(5)
    = 32$, ¿qué comportamiento se confirma?
  choices:
  - text: La función es estrictamente creciente en todo su dominio real.
    is_correct: true
  - text: La función es estrictamente decreciente.
    is_correct: false
  - text: La función es constante.
    is_correct: false
  - text: La función tiene un máximo en x = 5.
    is_correct: false
  explanation: La alternativa correcta es 'La función es estrictamente creciente en todo
    su dominio real.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ocurre con la gráfica de $f(x) = 3^x$ cuando $x$ toma valores negativos
    cada vez más grandes en magnitud (hacia $-\infty$)?
  choices:
  - text: Se aproxima infinitamente al eje X ($y = 0$) por arriba sin tocarlo jamás.
    is_correct: true
  - text: Cruza hacia los números negativos por debajo del eje X.
    is_correct: false
  - text: Se convierte en una recta vertical.
    is_correct: false
  - text: Tiende hacia $+\infty$.
    is_correct: false
  explanation: La alternativa correcta es 'Se aproxima infinitamente al eje X ($y
    = 0$) por arriba sin tocarlo jamás.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$ de la función exponencial $b^x$.'
- 'Paso 2: Comprobar la condición $b > 1$.'
- 'Paso 3: Confirmar que la gráfica sube de izquierda a derecha.'
- 'Paso 4: Ubicar la asíntota horizontal hacia la izquierda en $y = 0$.'
errores_correccion: '- **Error común:** Creer que la gráfica toca o cruza el eje X
  en la zona de valores negativos de $x$.

  - **Cómo corregirlo:** Las potencias de base positiva $b^x$ son SIEMPRE estrictamente
  mayores que cero ($b^x > 0$); el eje X actúa como un límite asintótico infranqueable.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de funciones exponenciales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de ecuaciones exponenciales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función exponencial f(x) = b^x con b > 1 es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, a mayor exponente mayor es la potencia resultante cuando la base es mayor
    a 1.
- titulo: ¿La ecuación 2^(3x - 1) = 16 se resuelve igualando 3x - 1 a 4?
  respuesta: Sí
  solucion_pasos:
  - Sí, expresando 16 como 2^4 se igualan directamente los exponentes.
errores_frecuentes:
- Creer que un exponente negativo produce un resultado negativo (evaluar $2^{-2} =
  -4$ en lugar de $0{,}25$).
- Confundir la asíntota horizontal $y = k$ con el intercepto en el eje Y $f(0) = a
  + k$.
- Creer que la gráfica de una función exponencial toca o cruza el eje X cuando no
  tiene traslación vertical ($k = 0$).
- Igualar bases incorrectamente al resolver ecuaciones exponenciales (decir $16 =
  2^3$ en vez de $2^4$).
- Confundir la tasa de crecimiento porcentual $r$ con la base completa del modelo
  $(1 + r)$.
afirmaciones_verdaderas:
- Una función exponencial $f(x) = b^x$ es estrictamente creciente si $b > 1$ y estrictamente
  decreciente si $0 < b < 1$.
- La asíntota horizontal de la función exponencial trasladada $f(x) = a \cdot b^{p
  x + q} + k$ es la recta $y = k$.
al_terminar_debes_poder: Al finalizar este recurso podrás construir tablas de valores,
  analizar crecimiento y monotonía, identificar asíntotas trasladadas, resolver ecuaciones
  de igual base y modelar fenómenos exponenciales.
