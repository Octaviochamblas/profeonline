semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.CRECIMIENTO_BASE_MAYOR_UNO
resumen_inicial: 'Análisis del crecimiento exponencial para bases mayores que uno:
  conceptos, asíntotas, propiedades e inversidad en Análisis gráfico y modelamiento
  exponencial.'
explicacion_simple: Cuando la base supera a 1, cada incremento unitario en $x$ no
  suma una cantidad fija, sino que multiplica el valor anterior, generando un crecimiento
  cada vez más rápido.
explicacion_formal: '### Definición formal


  Para $f(x)=a\cdot b^x$ con $a>0$ y $b>1$: si $x_1<x_2$, entonces $f(x_1)<f(x_2)$,
  es decir, la función es estrictamente creciente en todo $\mathbb{R}$. Además, la
  tasa de crecimiento (el cociente entre valores consecutivos) es constante e igual
  a $b$.


  ### Desarrollo didáctico


  Lo distintivo del crecimiento exponencial es que no es "cada vez más lento" como
  el crecimiento lineal, sino "cada vez más rápido": los incrementos absolutos entre
  valores consecutivos aumentan constantemente.


  Para $f(x)=2^x$: entre $x=0$ y $x=1$, la función pasa de $1$ a $2$ (aumento de $1$);
  entre $x=3$ y $x=4$, pasa de $8$ a $16$ (aumento de $8$), mostrando que el crecimiento
  se acelera.'
definiciones_clave: '- **Análisis del crecimiento exponencial para bases mayores que
  uno**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a análisis del crecimiento exponencial para bases mayores que uno.'
