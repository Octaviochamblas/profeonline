procedimiento:
- 'Paso 1: Verifica que la base $b$ sea mayor que 1 y que $a$ sea positivo.'
- 'Paso 2: Concluye que la función es estrictamente creciente en todo su dominio.'
- 'Paso 3: Observa que el ritmo de crecimiento se acelera a medida que $x$ aumenta.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en análisis
  del crecimiento exponencial para bases mayores que uno.
ejemplos:
- titulo: Verificación de crecimiento acelerado
  enunciado: ¿Cómo se comporta $f(x)=3\cdot2^x$ a medida que $x$ aumenta?
  solucion_pasos:
  - $b=2>1$ y $a=3>0$.
  - La función crece de manera acelerada, duplicándose cada vez que $x$ aumenta en
    1 unidad.
- titulo: Comparación de tasas de crecimiento
  enunciado: ¿Cuál de $f(x)=2^x$ y $g(x)=5^x$ crece más rápido para $x$ grande?
  solucion_pasos:
  - Ambas tienen base mayor que 1, por lo que ambas son crecientes.
  - $g(x)=5^x$ crece más rápido, ya que su base ($5$) es mayor que la de $f(x)$ ($2$).
- titulo: ¿El crecimiento exponencial con $b>1$ es constante en magnitud absoluta?
  enunciado: ¿El crecimiento exponencial con $b>1$ es constante en magnitud absoluta?
  respuesta: 'No'
  solucion_pasos:
  - El aumento absoluto entre valores consecutivos crece cada vez más, a diferencia
    del crecimiento lineal.
- titulo: ¿La razón entre dos valores consecutivos de una función exponencial con
    $b>1$ es siempre la misma?
  enunciado: ¿La razón entre dos valores consecutivos de una función exponencial con
    $b>1$ es siempre la misma?
  respuesta: Sí
  solucion_pasos:
  - Esa razón constante es precisamente el valor de la base $b$.
errores_frecuentes:
- Confundir el crecimiento exponencial con el crecimiento lineal, asumiendo incrementos
  constantes.
- No verificar el signo del coeficiente $a$ antes de concluir que la función es creciente.
- Asumir que toda base mayor que 1 produce el mismo ritmo de crecimiento, sin comparar
  valores específicos.
- Confundir "crecimiento acelerado" con "crecimiento infinito inmediato", ignorando
  que para $x$ negativo la función sigue siendo pequeña y positiva.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando análisis del crecimiento exponencial para bases mayores que uno.
