semantic_id: MAT.NUM.FRACCIONES_CLASIFICACION.NUMERO_MIXTO_CONCEPTO
resumen_inicial: "Un número mixto es la representación de una fracción impropia formada por la suma de un entero completo y una fracción propia."
explicacion_simple: |
  Si en una receta te piden $2\frac{1}{2}$ tazas de harina, significa que vas a usar 2 tazas completamente llenas y media taza más. Esa forma de escribir se llama **número mixto** porque 'mezcla' un número entero (el 2) con una fracción (el $\frac{1}{2}$). Es una forma muy práctica de expresar cantidades mayores que 1 entero sin tener que usar fracciones impropias grandes como $\frac{5}{2}$.
explicacion_formal: |
  Formalmente, un **número mixto** es una notación abreviada que expresa la suma de un entero positivo $A \in \mathbb{Z}^+$ y una fracción propia $\frac{b}{c}$ (con $b, c \in \mathbb{Z}^+$ y $b < c$):
  $A$\frac{b}{c}$ \iff A + \frac{b}{c}$

  La equivalencia a su correspondiente fracción impropia $\frac{N}{c}$ se obtiene mediante la relación:
  $N = A \cdot c + b \implies A$\frac{b}{c}$ = \frac{A \cdot c + b}{c}$
  Geometricamente, el número mixto ubica la cantidad en el segmento continuo $[A, A+1]$ a una distancia de $\frac{b}{c}$ respecto al entero $A$.
definiciones_clave: |
  - **Número mixto**: Notación $A\frac{b}{c}$ que combina una parte entera $A$ y una parte fraccionaria propia $\frac{b}{c}$.
  - **Parte entera ($A$)**: Cantidad de unidades completas no divididas.
  - **Parte fraccionaria ($\frac{b}{c}$)**: Fracción propia ($b < c$) que representa el sobrante menor a una unidad entera.
propiedades_relaciones: |
  - **Identidad aditiva implícita**: El espacio entre el entero $A$ y la fracción $\frac{b}{c}$ representa una adición, **no** una multiplicación ($A\frac{b}{c} = A + \frac{b}{c} \neq A \cdot \frac{b}{c}$).
  - **Conversión biunívoca**: Existe una correspondencia uno a uno entre cada fracción impropia no entera $\frac{a}{b}$ y su único número mixto $A\frac{r}{b}$.
  - **Comparación directa**: Entre dos números mixtos positivos con distintas partes enteras, es mayor aquel que posee la mayor parte entera ($A_1 > A_2 \implies A_1\frac{b_1}{c_1} > A_2\frac{b_2}{c_2}$).
ejemplo_guiado:
  enunciado: "Dado el número mixto $3\\frac{4}{5}$, explica el significado de cada una de sus partes, transfórmalo a fracción impropia y ubícalo entre qué dos enteros consecutivos se encuentra."
  pasos:
    - 'Identificar componentes: parte entera $A = 3$ enteros completos; parte fraccionaria propia $\frac{4}{5}$ ($4 < 5$).'
    - 'Convertir a fracción impropia: multiplicar la parte entera por el denominador y sumar el numerador: $N = 3 \cdot 5 + 4 = 19$. La fracción impropia es $\frac{19}{5}$.'
    - 'Ubicar entre enteros consecutivos: como $3\frac{4}{5} = 3 + \frac{4}{5}$, el valor se encuentra estrictamente entre los enteros $3$ y $4$ ($3 < 3\frac{4}{5} < 4$).'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué operación matemática real existe de manera implícita entre la parte entera $A$ y la parte fraccionaria $\\frac{b}{c}$ en un número mixto $A\\frac{b}{c}$?"
    choices:
      - {text: "Una adición: $A\\frac{b}{c} = A + \\frac{b}{c}$.", is_correct: true}
      - {text: "Una multiplicación: $A\\frac{b}{c} = A \\cdot \\frac{b}{c}$.", is_correct: false}
      - {text: "Una división: $A\\frac{b}{c} = A \\div \\frac{b}{c}$.", is_correct: false}
      - {text: "Una resta: $A\\frac{b}{c} = A - \\frac{b}{c}$.", is_correct: false}
    explanation: "La correcta es Una adición: $A\\frac{b}{c} = A + \\frac{b}{c}$.: la notación del número mixto agrupa las unidades completas más la fracción sobrante mediante una suma implícita."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cuál es la fracción impropia equivalente al número mixto $5\\frac{2}{3}$?"
    choices:
      - {text: '\$\frac{17}{3}$', is_correct: true}
      - {text: '\$\frac{10}{3}$', is_correct: false}
      - {text: '\$\frac{13}{3}$', is_correct: false}
      - {text: '\$\frac{17}{2}$', is_correct: false}
    explanation: 'La correcta es$ \frac{17}{3}$: calculamos el nuevo numerador multiplicando entero por denominador y sumando numerador ($5 \cdot 3 + 2 = 17$), conservando el denominador $3$.'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identificar la parte entera $A$ y la parte fraccionaria $\frac{b}{c}$ del número mixto.'
  - 'Paso 2: Para convertir a fracción impropia, calcular el numerador $N = A \cdot c + b$.'
  - 'Paso 3: Conservar el denominador $c$ para obtener $\frac{N}{c}$.'
errores_correccion: |
  Un error clásico es interpretar el número mixto como una multiplicación (creyendo que $2\frac{1}{2} = 2 \cdot \frac{1}{2} = 1$). Recuerda siempre que en el número mixto hay un signo más implícito: $2\frac{1}{2} = 2 + \frac{1}{2} = \frac{5}{2}$.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Expresa el número mixto $4\\frac{3}{7}$ como fracción impropia."
    alternativas:
      - '\$\frac{31}{7}$'
      - '\$\frac{12}{7}$'
      - '\$\frac{19}{7}$'
    respuesta: '\$\frac{31}{7}$'
    solucion_pasos:
      - 'Multiplicamos el entero 4 por el denominador 7: $4 \cdot 7 = 28$.'
      - "Sumamos el numerador 3: $28 + 3 = 31$."
      - 'El resultado final es la fracción impropia $\frac{31}{7}$.'
  - titulo: "Ejemplo 2"
    enunciado: "Un atleta corrió durante $1\\frac{3}{4}$ horas. ¿Cuántos minutos enteros corrió en total?"
    alternativas:
      - "Corrió 105 minutos."
      - "Corrió 75 minutos."
      - "Corrió 134 minutos."
    respuesta: "Corrió 105 minutos."
    solucion_pasos:
      - '$1\frac{3}{4}$ equivale a $1$ hora ($60$ min) más $\frac{3}{4}$ de hora ($45$ min).'
      - "Sumando ambas partes: $60 + 45 = 105$ minutos."
  - titulo: "¿La parte fraccionaria de un número mixto debe ser siempre una fracción propia ($b < c$)?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, si la parte fraccionaria fuera impropia, se deberían extraer de ella más enteros para agregarlos a la parte entera $A$."
  - titulo: "¿Se encuentra el número mixto $6\\frac{1}{8}$ ubicado entre los enteros 6 y 7?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, al ser $6 + \frac{1}{8}$, es mayor que 6 y menor que 7.'
errores_frecuentes:
  - 'Multiplicar el entero por la fracción en lugar de sumarlos (interpretar $A\frac{b}{c}$ como $A \cdot \frac{b}{c}$).'
  - 'Escribir un número mixto con una fracción impropia en su parte fraccionaria (como $2\frac{5}{3}$ en vez de $3\frac{2}{3}$).'
  - 'Olvidar sumar el numerador original al convertir a fracción impropia (hacer solo $A \cdot c$).'
  - "Cambiar el denominador al hacer la conversión a fracción impropia."
  - "Confundir la conversión de número mixto a fracción con simplificación de fracciones."
afirmaciones_verdaderas:
  - "Un número mixto expresa la suma explícita de un número entero y una fracción propia."
  - 'El número mixto $A\frac{b}{c}$ es numéricamente equivalente a la fracción impropia $\frac{A \cdot c + b}{c}$.'
al_terminar_debes_ponder: |
  Debes ser capaz de interpretar un número mixto $A\frac{b}{c}$, realizar la conversión bidireccional a fracción impropia y operar con ambas representaciones con total fluidez.
