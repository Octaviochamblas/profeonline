semantic_id: MAT.NUM.FRACCIONES_CLASIFICACION.NUMERO_MIXTO_CONCEPTO
resumen_inicial: 'Un número mixto representa a una fracción impropia no entera mediante
  la combinación de una parte entera y una fracción propia: $C \frac{r}{b} = C + \frac{r}{b}$.'
explicacion_simple: Un número mixto es una forma muy práctica de escribir fracciones
  impropias mostrando claramente cuántos enteros completos tenemos y qué pedazo sobrante
  nos queda. Se compone de un número entero grande seguido inmediatamente de una fracción
  propia.
explicacion_formal: 'Dado un racional impropio $\frac{a}{b} > 1$ con algoritmo de
  la división $a = b \cdot C + r$ ($0 < r < b$), su representación en **Número Mixto**
  se define por:


  $$C \frac{r}{b} = C + \frac{r}{b} = \frac{b \cdot C + r}{b}$$


  **Desglose de la fórmula:**

  - $C = \lfloor a/b \rfloor \in \mathbb{N}$: Parte entera obtenida como cociente
  entero de $a : b$.

  - $r = a \bmod b$: Residuo de la división ($0 < r < b$).

  - $\frac{r}{b}$: Fracción propia que representa el remanente menor que la unidad.


  > **Complemento didáctico:** La notación $2 \frac{1}{3}$ representa una SUMA ($2
  + \frac{1}{3}$), NUNCA una multiplicación de $2$ por $\frac{1}{3}$.'
definiciones_clave: '- **Número mixto**: Expresión $C \frac{r}{b}$ compuesta por una
  parte entera $C$ y una fracción propia $\frac{r}{b}$.'
propiedades_relaciones: '- **Fórmula de conversión a fracción**: $C \frac{r}{b} =
  \frac{C \cdot b + r}{b}$.'
ejemplo_guiado:
  enunciado: Convierta la fracción impropia $\frac{14}{3}$ en un número mixto y viceversa.
  pasos:
  - 'Paso 1: Dividir $14$ entre $3$: $14 : 3 = 4$ con residuo $2$ ($14 = 3 \cdot 4
    + 2$).'
  - 'Paso 2: Escribir como mixto: parte entera $C = 4$, fracción propia $\frac{2}{3}
    \implies 4 \frac{2}{3}$.'
  - 'Paso 3: Convertir $4 \frac{2}{3}$ de regreso a fracción impropia: $\frac{4 \cdot
    3 + 2}{3} = \frac{12 + 2}{3} = \frac{14}{3}$.'
  - 'Conclusión: La representación en número mixto de $\frac{14}{3}$ es $4 \frac{2}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa la notación de un número mixto C r/b?
  choices:
  - text: La suma de una parte entera C más una fracción propia r/b
    is_correct: true
  - text: La multiplicación de C por la fracción r/b
    is_correct: false
  - text: La resta de C menos r/b
    is_correct: false
  - text: Una fracción impropia con denominador cero
    is_correct: false
  explanation: La alternativa correcta es 'La suma de una parte entera C más una fracción
    propia r/b'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 14/3, ¿cuál fue el número mixto obtenido?
  choices:
  - text: 4 2/3
    is_correct: true
  - text: 3 4/2
    is_correct: false
  - text: 2 4/3
    is_correct: false
  - text: 4 3/2
    is_correct: false
  explanation: La alternativa correcta es '4 2/3'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el numerador entre el denominador de la fracción impropia.'
- 'Paso 2: Tomar el cociente de la división como la parte entera $C$.'
- 'Paso 3: Escribir el residuo como numerador $r$ conservando el denominador original
  $b$.'
errores_correccion: '- **Error 1: Interpretar $3 \frac{1}{2}$ como la multiplicación
  $3 \cdot \frac{1}{2} = \frac{3}{2}$.** **Cómo corregirlo:** Es una SUMA ($3 + \frac{1}{2}
  = \frac{7}{2}$).


  - **Error 2: Dejar una fracción impropia en la parte fraccionaria del mixto ($2
  \frac{5}{3}$).** **Cómo corregirlo:** La parte fraccionaria debe ser estrictamente
  PROPIA (numerador menor que denominador).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Convierta $2 \frac{3}{5}$ a fracción impropia.
  alternativas:
  - 13/5
  - 6/5
  - 10/5
  respuesta: 13/5
  solucion_pasos:
  - $\frac{2 \cdot 5 + 3}{5} = \frac{10 + 3}{5} = \frac{13}{5}$.
- titulo: Ejemplo 2
  enunciado: Exprese 9/2 como número mixto.
  alternativas:
  - 4 1/2
  - 2 1/4
  - 4 2/1
  respuesta: 4 1/2
  solucion_pasos:
  - '$9 : 2 = 4$ con resto $1 \implies 4 \frac{1}{2}$.'
- titulo: ¿Se pueden expresar las fracciones propias como números mixtos enteros?
  respuesta: 'No'
  solucion_pasos:
  - No, los números mixtos se aplican a fracciones impropias no enteras.
- titulo: ¿Es 3 1/4 equivalente a la fracción 13/4?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(3 \cdot 4 + 1)/4 = 13/4$.
errores_frecuentes:
- Un número mixto de la forma $C \frac{r}{b}$ representa el producto de $C$ por la
  fracción.
- La parte fraccionaria de un número mixto puede ser una fracción impropia como $2
  \frac{7}{3}$.
- Las fracciones propias de valor menor que 1 se convierten en números mixtos con
  enteros mayores a 1.
- Para convertir un mixto a fracción se debe multiplicar el entero por el numerador
  y sumar el denominador.
- El denominador de la parte fraccionaria cambia al convertir el número mixto.
afirmaciones_verdaderas:
- Un número mixto combina una parte entera y una fracción propia para representar
  una fracción impropia.
- La conversión de $C \frac{r}{b}$ a fracción impropia sigue la fórmula $\frac{C \cdot
  b + r}{b}$.
al_terminar_debes_poder: Al terminar serás capaz de convertir fracciones impropias
  a números mixtos y viceversa, aplicando el algoritmo de la división para separar
  enteros de partes propias.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
