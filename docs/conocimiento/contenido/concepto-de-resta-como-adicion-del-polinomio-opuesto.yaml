  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar con claridad cuál polinomio actúa como minuendo y cuál como sustraendo.'
- 'Paso 2: Escribir la expresión encerrando el sustraendo entre paréntesis precedido por un signo menos ($-$).'
- 'Paso 3: Obtener el polinomio opuesto invirtiendo los signos de cada uno de los términos del sustraendo.'
- 'Paso 4: Reducir los términos semejantes entre el minuendo y el polinomio opuesto obtenido.'
errores_correccion: '- **Error 1:** Cambiar el signo únicamente al primer término del sustraendo y dejar los demás iguales (escribir $-(2x+3) = -2x+3$). **Cómo corregirlo:** La resta exige **CAMBIAR EL SIGNO A TODOS LOS TÉRMINOS DEL SUSTRAENDO ($-2x - 3$)**.

  - **Error 2:** Intercambiar el orden de minuendo y sustraendo en expresiones textuales como "Restar A de B". **Cómo corregirlo:** En "Restar A de B", el minuendo es **B** y el sustraendo es **A ($B - A$)**.

  '
ejemplos:
- titulo: Opuesto de binomio
  enunciado: ¿Cuál es la resta de $(5x + 8) - (2x - 3)$?
  alternativas:
  - $3x + 11$
  - $3x + 5$
  - $7x + 5$
  respuesta: $3x + 11$
  solucion_pasos:
  - '1. Opuesto del sustraendo: $-2x + 3$.'
  - '2. Expresión: $5x + 8 - 2x + 3$.'
  - '3. Reducción: $3x + 11$.'
- titulo: Interpretación de "Restar A de B"
  enunciado: ¿Cómo se plantea algebraicamente la frase "Restar $(x + 2)$ de $(3x + 5)$"?
  alternativas:
  - $(3x + 5) - (x + 2)$
  - $(x + 2) - (3x + 5)$
  - $(3x + 5) + (x + 2)$
  respuesta: $(3x + 5) - (x + 2)$
  solucion_pasos:
  - 1. Minuendo es "de B" $\implies (3x + 5)$.
  - 2. Sustraendo es "A" $\implies (x + 2)$.
  - '3. Planteamiento: $(3x + 5) - (x + 2)$.'
- titulo: Opuesto nulo
  enunciado: ¿Es la suma de un polinomio con su polinomio opuesto igual a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, $Q(x) + (-Q(x)) = 0$.
- titulo: Inversión completa
  enunciado: Para $Q = x^2 - x + 1$, ¿es su opuesto $-Q = -x^2 + x - 1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, todos los coeficientes cambiaron de signo.
errores_frecuentes:
- Invertir el signo únicamente del primer término del polinomio sustraendo.
- Intercambiar el orden de minuendo y sustraendo en problemas redactados como restar A de B.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Cambiar también los signos del polinomio minuendo al ejecutar la resta.
- Multiplicar los polinomios en lugar de restarlos.
afirmaciones_verdaderas:
- Restar un polinomio sustraendo equivale a sumar su polinomio opuesto invirtiendo el signo de todos sus términos.
- El polinomio minuendo conserva intactos sus signos originales durante la operación de sustracción.
al_terminar_debes_poder: '![Resumen de resta como adición del opuesto](/static/img/nodos/concepto-de-resta-como-adicion-del-polinomio-opuesto-resumen.svg)


  QUÉ: Definir y ejecutar la sustracción de polinomios transformándola en la suma del polinomio opuesto.


  CÓMO: Conservar intacto el minuendo $P(x)$ y sumarle el inverso aditivo del sustraendo $-Q(x)$, reduciendo los términos semejantes resultantes.'
