semantic_id: MAT.ALG.SUSTRACCION_POL.POLINOMIO_OPUESTO
resumen_inicial: El concepto de resta como adición del polinomio opuesto establece que restar un polinomio sustraendo $Q(x)$ equivale a sumar su inverso aditivo $-Q(x)$ invirtiendo los signos de todos sus términos.
explicacion_simple: "En álgebra, la **resta de dos polinomios** $P(x) - Q(x)$ no es una operación nueva: es simplemente la **suma del minando con el opuesto del sustraendo**:\n- **Minuendo $P(x)$**: El polinomio al que se le resta (se mantiene intacto).\n- **Sustraendo $Q(x)$**: El polinomio que se restará (se encierra entre paréntesis con un signo $-$ adelante).\n- **REGLA DE ORO**: Restar $Q(x)$ es **cambiar el signo a TODOS los términos de $Q(x)$** y luego sumar los términos semejantes.\n- **Ejemplo**: Restar $(2x^2 + 5x - 3)$ de $(7x^2 - x + 4)$:\n  - Identificamos minuendo y sustraendo: $(7x^2 - x + 4) - (2x^2 + 5x - 3)$.\n  - Hallamos el polinomio opuesto de $Q(x)$: $-2x^2 - 5x + 3$.\n  - Sumamos minuendo $+$ opuesto: $7x^2 - x + 4 - 2x^2 - 5x + 3$.\n  - Reducimos términos semejantes: **$5x^2 - 6x + 7$**.\n\n![Concepto de Resta como Adición del Opuesto](/static/img/nodos/concepto-de-resta-como-adicion-del-polinomio-opuesto-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $P(x), Q(x) \in \mathbb{R}[x]$ dos polinomios. La **sustracción polinómica** es la operación binaria obtenida al adicionar el inverso aditivo $-Q(x)$ al polinomio minuendo $P(x)$:


  $$P(x) - Q(x) \equiv P(x) + \big( -Q(x) \big)$$


  donde $-Q(x) = \sum_{i=0}^m (-b_i) x^i$ representa el **polinomio opuesto**, obtenido al multiplicar cada coeficiente $b_i$ de $Q(x)$ por el escalar $-1$.


  ### Propiedad de Inversión Aditiva en el Anillo $\mathbb{R}[x]$

  Para todo polinomio $Q(x)$, su polinomio opuesto $-Q(x)$ es el único elemento que satisface el axioma del neutro aditivo:


  $$Q(x) + \big( -Q(x) \big) = 0$$


  ### Síntesis didáctica

  Transformar la resta en una suma del polinomio opuesto elimina las ambigüedades de signos antecedentes y unifica el algoritmo aditivo.

  '
definiciones_clave: '- **Minuendo ($P(x)$)**: Polinomio inicial del cual se sustrae otra cantidad.

  - **Sustraendo ($Q(x)$)**: Polinomio precedido por el signo menos que debe restarse.

  - **Polinomio opuesto ($-Q(x)$)**: Polinomio cuyos coeficientes tienen la signatura exactamente invertida respecto a $Q(x)$.

  '
propiedades_relaciones: '- **No conmutatividad de la resta**: $P(x) - Q(x) \neq Q(x) - P(x)$ (difieren en un signo global $-1$).

  - **Opuesto del opuesto**: -(-Q(x)) = Q(x).

  '
ejemplo_guiado:
  enunciado: Resta el polinomio $Q(x) = 3x^2 - 7x + 2$ del polinomio $P(x) = 8x^2 + x - 5$.
  pasos:
  - 'Paso 1: Planteamos la diferencia identificando minuendo y sustraendo: $(8x^2 + x - 5) - (3x^2 - 7x + 2)$.'
  - 'Paso 2: Determinamos el polinomio opuesto de $Q(x)$ cambiando el signo de cada término: $-3x^2 + 7x - 2$.'
  - 'Paso 3: Escribimos la expresión como suma con el opuesto: $8x^2 + x - 5 - 3x^2 + 7x - 2$.'
  - 'Paso 4: Reducimos la Clase $x^2$: $8x^2 - 3x^2 = \mathbf{5x^2}$.'
  - 'Paso 5: Reducimos la Clase $x$: $+1x + 7x = \mathbf{+8x}$.'
  - 'Paso 6: Reducimos las Constantes: $-5 - 2 = \mathbf{-7}$.'
  - 'Conclusión: El polinomio diferencia es **$5x^2 + 8x - 7$**.'
  imagen: /static/img/nodos/concepto-de-resta-como-adicion-del-polinomio-opuesto-ejemplos.svg
