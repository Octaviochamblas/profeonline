semantic_id: MAT.ALG.SUSTRACCION_POL.POLINOMIO_OPUESTO
resumen_inicial: 'Concepto de resta como adición del polinomio opuesto: procedimiento
  y reglas en Sustracción de polinomios.'
explicacion_simple: 'El opuesto de un número es el que sumado con él da cero: el opuesto
  de $5$ es $-5$. En álgebra, el opuesto de un polinomio completo es el polinomio
  con todos sus coeficientes con signo invertido.'
explicacion_formal: '### Definición formal


  Invertimos cada signo: $+5x^2 \to -5x^2$, $-3x \to +3x$, $+7 \to -7$.


  ### Desarrollo didáctico


  Si $P = 3x^2 - 5x + 2$, entonces:

  $-P = -3x^2 + 5x - 2$.


  Cada término cambia de signo:

  - $+3x^2 \rightarrow -3x^2$.

  - $-5x \rightarrow +5x$.

  - $+2 \rightarrow -2$.


  Importante: Si sumamos un polinomio con su opuesto, obtenemos $0$: $P + (-P) = 0$.'
definiciones_clave: '- **Concepto de resta como adición del polinomio opuesto**: Operación
  o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a concepto de resta como adición del polinomio opuesto.'
ejemplo_guiado:
  enunciado: Aplica concepto de resta como adición del polinomio opuesto en una expresión
    algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de concepto de resta como adición
    del polinomio opuesto.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
