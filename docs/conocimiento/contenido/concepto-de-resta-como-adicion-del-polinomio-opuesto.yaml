resumen_inicial: La sustracción de polinomios se define como la suma del minuendo
  con el opuesto (inverso aditivo) del sustraendo.
explicacion_simple: Restar un polinomio es exactamente igual que sumarle su 'polinomio
  opuesto'. Para hacerlo, tomamos la expresión que se resta (el sustraendo), le cambiamos
  el signo a todos sus números y luego sumamos los términos semejantes con el primer
  polinomio.
explicacion_formal: 'Sean $P(x)$ el minuendo y $Q(x)$ el sustraendo. La **Sustracción
  Polinómica** $P(x) - Q(x)$ se define como la adición del opuesto $-Q(x)$:


  $$P(x) - Q(x) = P(x) + (-Q(x)) = P(x) + \sum_{k=0}^m (-b_k) x^k$$


  > **Complemento didáctico:** La reducción de la resta a la adición del inverso aditivo
  unifica la estructura algebraica bajo las propiedades del grupo abeliano polinomial.'
definiciones_clave: '- **Minuendo $P(x)$**: Polinomio al cual se le sustrae otra cantidad.

  - **Sustraendo $Q(x)$**: Polinomio que se resta del minuendo.

  - **Polinomio opuesto $-Q(x)$**: Expresión con todos sus coeficientes de signo invertido.'
propiedades_relaciones: '- **No conmutatividad**: $P - Q \neq Q - P$ (en general,
  $P - Q = -(Q - P)$).'
ejemplo_guiado:
  enunciado: Reste del polinomio $P(x) = 5x^2 - 3x + 8$ el polinomio $Q(x) = 2x^2
    + 4x - 1$.
  pasos:
  - 'Paso 1: Plantear la resta: $(5x^2 - 3x + 8) - (2x^2 + 4x - 1)$.'
  - 'Paso 2: Obtener el polinomio opuesto $-Q(x)$ cambiando el signo de sus términos:
    $-2x^2 - 4x + 1$.'
  - 'Paso 3: Transformar la resta en adición del opuesto: $5x^2 - 3x + 8 - 2x^2 -
    4x + 1$.'
  - "Paso 4: Reducir los términos semejantes:\n  $x^2 \\to 5 - 2 = 3x^2$.\n  $x \\\
    to -3 - 4 = -7x$.\n  Constantes $\\to 8 + 1 = 9$."
  - 'Conclusión: La diferencia es $3x^2 - 7x + 9$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define formalmente la resta entre dos polinomios P(x) - Q(x)?
  choices:
  - text: Como la adición del minuendo P(x) con el polinomio opuesto (-Q(x))
    is_correct: true
  - text: Como la multiplicación de los coeficientes de P y Q
    is_correct: false
  - text: Como la división de sus términos semejantes
    is_correct: false
  - text: Como la suma de sus exponentes
    is_correct: false
  explanation: La alternativa correcta es 'Como la adición del minuendo P(x) con el
    polinomio opuesto (-Q(x))'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (5x^2 - 3x + 8) - (2x^2 + 4x - 1), ¿cuál fue
    el resultado de la resta?
  choices:
  - text: 3x^2 - 7x + 9
    is_correct: true
  - text: 7x^2 + x + 7
    is_correct: false
  - text: 3x^2 + x + 9
    is_correct: false
  - text: 3x^2 - 7x + 7
    is_correct: false
  explanation: La alternativa correcta es '3x^2 - 7x + 9'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la resta encerrando el sustraendo entre paréntesis precedido del
  signo $-$.'
- 'Paso 2: Cambiar los signos de todos los términos del sustraendo para formar $-Q(x)$.'
- 'Paso 3: Reducir los términos semejantes resultantes.'
errores_correccion: '- **Error 1: Cambiar el signo de los términos del minuendo en
  lugar del sustraendo.** **Cómo corregirlo:** El minuendo permanece con sus signos
  intactos; sólo el sustraendo cambia de polaridad.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule la resta (8a - 5b) - (3a - 2b).
  alternativas:
  - 5a - 3b
  - 5a - 7b
  - 11a - 7b
  - 5a + 3b
  respuesta: 5a - 3b
  solucion_pasos:
  - '1. Opuesto del sustraendo: -3a + 2b.'
  - '2. Operar: 8a - 3a = 5a; -5b + 2b = -3b. Resultado: 5a - 3b.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el polinomio opuesto de Q(x) = -4x^2 + 7x - 3?
  alternativas:
  - 4x^2 - 7x + 3
  - -4x^2 - 7x + 3
  - 4x^2 + 7x - 3
  - -4x^2 + 7x + 3
  respuesta: 4x^2 - 7x + 3
  solucion_pasos:
  - '1. Invertir cada signo: -(-4x^2) = 4x^2, -(7x) = -7x, -(-3) = +3.'
- titulo: ¿Es la resta de polinomios una operación no conmutativa (P - Q != Q - P)?
  respuesta: Sí
  solucion_pasos:
  - Sí, alternar minuendo y sustraendo invierte el signo del resultado final.
- titulo: ¿Permanece el minuendo P(x) con sus signos inalterados al ejecutar la resta?
  respuesta: Sí
  solucion_pasos:
  - Sí, el minuendo conserva sus signos originales; el cambio aplica sólo al sustraendo.
errores_frecuentes:
- Cambiar de signo los términos del minuendo al plantear la sustracción.
- Cambiar sólo el signo del primer término del sustraendo dejando los demás iguales.
- Declarar que restar un polinomio negativo equivale a restar sus coeficientes numéricos
  absolutos.
- Sumar los polinomios ignorando el signo menos de resta.
- Declarar que P - Q es igual a Q - P en todos los casos.
afirmaciones_verdaderas:
- La sustracción de polinomios se resuelve sumando el minuendo con el inverso aditivo
  del sustraendo.
- El polinomio opuesto de Q(x) se obtiene invirtiendo la polaridad de cada uno de
  sus coeficientes.
al_terminar_debes_poder: Al terminar serás capaz de restar polinomios transformando
  la operación en la adición del polinomio opuesto del sustraendo.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Sustracción.
estado: publicado
