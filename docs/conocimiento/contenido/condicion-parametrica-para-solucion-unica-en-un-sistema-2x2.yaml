semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.PARAMETROS_SOLUCION_UNICA
resumen_inicial: La condición paramétrica para solución única en un sistema 2x2 exige que el determinante principal del sistema sea estrictamente no nulo.
explicacion_simple: |
  Cuando un sistema de ecuaciones $2 \times 2$ contiene letras llamadas **parámetros** (como $k, m$ o $a$) que acompañan a las incógnitas $x$ e $y$, suele ser necesario hallar para qué valores del parámetro el sistema admite **solución única**.

  Aplicamos la condición del determinante principal $\Delta$: multiplicamos cruzado los coeficientes de las variables $x$ e $y$ y exigimos que esa resta no sea igual a cero ($a_1 b_2 - a_2 b_1 \neq 0$).

  Esto equivale a asegurar que la razón entre los coeficientes de $x$ sea distinta a la razón entre los coeficientes de $y$ ($\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$).
explicacion_formal: |
  ### Definición formal
  Dado el sistema parametrizado con $k \in \mathbb{R}$:

  $$\begin{cases} a_1(k) x + b_1(k) y = c_1 \\ a_2(k) x + b_2(k) y = c_2 \end{cases}$$

  La **condición de solución única** (Compatible Determinado) exige:

  $$\Delta(k) = a_1(k) b_2(k) - a_2(k) b_1(k) \neq 0 \iff \frac{a_1(k)}{a_2(k)} \neq \frac{b_1(k)}{b_2(k)}$$

  ### Desglose de la fórmula
  - $\Delta(k) \neq 0$: Desigualdad paramétrica que descarta los valores críticos que generan paralelismo o coincidencia entre las rectas.

  ### Síntesis didáctica
  La condición de solución única es independiente de los valores de las constantes independientes $c_1, c_2$.
definiciones_clave: |
  - **Condición paramétrica de solución única**: Restricción algebraica de desigualdad sobre el parámetro $k$ que impone $\Delta(k) \neq 0$.
  - **Valores críticos del parámetro**: Soluciones numéricas de la ecuación $\Delta(k) = 0$ que anulan el determinante y destruyen la condición de rectas secantes.
propiedades_relaciones: |
  - **Independencia del término independiente**: La condición $\Delta(k) \neq 0$ depende EXCLUSIVAMENTE de los coeficientes de $x$ e $y$, ignorando los valores de $c_1$ y $c_2$.
  - **Exclusión de valores numéricos**: El conjunto de parámetros admisibles se expresa en notación de conjuntos como $\mathbb{R} \setminus \{k_1, k_2, \dots\}$.
ejemplo_guiado:
  enunciado: 'Determina para qué valores del parámetro $k$ el sistema $\begin{cases} kx + 2y = 5 \\ 3x + y = 4 \end{cases}$ posee una solución única en los números reales.'
  pasos:
    - 'Paso 1: Plantear el determinante principal en función de $k$: $\Delta(k) = \begin{vmatrix} k & 2 \\ 3 & 1 \end{vmatrix} = k(1) - (2)(3) = k - 6$.'
    - 'Paso 2: Exigir la condición de solución única: $\Delta(k) \neq 0 \implies k - 6 \neq 0$.'
    - 'Paso 3: Resolver la desigualdad paramétrica: $k \neq 6$.'
    - 'Paso 4: Concluir que el sistema posee solución única para todo $k \in \mathbb{R} \setminus \{6\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para el sistema $\begin{cases} kx + 2y = 5 \\ 3x + y = 4 \end{cases}$, ¿cuál es la condición paramétrica exacta para tener solución única?'
    choices:
      - {text: '$k \neq 6$', is_correct: true}
      - {text: '$k = 6$', is_correct: false}
      - {text: '$k \neq 5$', is_correct: false}
      - {text: '$k > 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$k \neq 6$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en el sistema anterior el parámetro toma el valor crítico $k = 6$, ¿qué ocurre con la clasificación del sistema?'
    choices:
      - {text: 'Deja de tener solución única (se transforma en inconsistente o en compatible indeterminado).', is_correct: true}
      - {text: 'Mantiene su solución única en el origen $(0,0)$.', is_correct: false}
      - {text: 'Se transforma en una ecuación cuadrática.', is_correct: false}
      - {text: 'Su única solución pasa a ser $x = 6$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Deja de tener solución única (se transforma en inconsistente o en compatible indeterminado).''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer la matriz de coeficientes de las variables $x$ e $y$ expresada en función del parámetro $k$.'
  - 'Paso 2: Calcular el determinante $\Delta(k) = a_1(k) b_2(k) - a_2(k) b_1(k)$.'
  - 'Paso 3: Formular la inecuación $\Delta(k) \neq 0$.'
  - 'Paso 4: Despejar la variable parámetro $k$ encontrando las raíces críticas $k_{\text{crítico}}$.'
  - 'Paso 5: Redactar el conjunto solución paramétrico en la forma $k \in \mathbb{R} \setminus \{k_{\text{crítico}}\}$.'
errores_correccion: |
  - **Error 1:** Incluir las constantes del término independiente $c_1, c_2$ al calcular la desigualdad de solución única. **Cómo corregirlo:** La condición de solución única **DEPENDE EXCLUSIVAMENTE DEL DETERMINANTE DE COEFICIENTES DE LAS VARIABLES ($\Delta(k) \neq 0$); NO SE INCLUYEN LAS CONSTANTES $c_1, c_2$**.
  - **Error 2:** Escribir una igualdad $k = k_{\text{crítico}}$ en lugar de una desigualdad $k \neq k_{\text{crítico}}$. **Cómo corregirlo:** Para que existan soluciones únicas, **EL PARÁMETRO DEBE SER DISTINTO DE LOS VALORES CRÍTICOS ($k \neq k_{\text{crítico}}$), NO IGUAL A ELLOS**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Para qué valores de $p$ el sistema $\begin{cases} px + 4y = 1 \\ 2x + py = 3 \end{cases}$ admite solución única?'
    alternativas:
      - '$p \neq 2 \land p \neq -2$'
      - '$p = 2 \lor p = -2$'
      - '$p \neq 8$'
    respuesta: '$p \neq 2 \land p \neq -2$'
    solucion_pasos:
      - '1. $\Delta = p^2 - 8 \neq 0 \implies p^2 \neq 4 \implies p \neq \pm 2$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'En el sistema $\begin{cases} 3x + my = 6 \\ x + 2y = 4 \end{cases}$, determina el valor excluido de $m$ para solución única.'
    alternativas:
      - '$m = 6$'
      - '$m = 3$'
      - '$m = 2$'
    respuesta: '$m = 6$'
    solucion_pasos:
      - '1. $\Delta = 3(2) - m(1) = 6 - m \neq 0 \implies m \neq 6$.'
      - '2. El valor excluido es $m = 6$.'
  - titulo: 'Determinante no nulo'
    enunciado: '¿Exigir $\Delta(k) \neq 0$ determina todos los valores paramétricos que generan rectas secantes?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la condición algebraica de solución única.'
  - titulo: 'Exclusión del término constante'
    enunciado: '¿Es correcto omitir las constantes $c_1, c_2$ al calcular la condición paramétrica de solución única?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues no influyen en el cruce puntual de rectas secantes.'
errores_frecuentes:
  - 'Incluir los términos independientes $c_1, c_2$ al estructurar la desigualdad de solución única.'
  - 'Resolver como igualdad $k = k_{\text{crítico}}$ reportando los valores prohibidos en vez de los permitidos.'
  - 'Olvidar considerar las soluciones negativas de raíces cuadradas como en $p^2 \neq 4 \implies p \neq \pm 2$.'
  - 'Confundir la condición $\Delta(k) \neq 0$ con la condición de infinitas soluciones.'
  - 'Asumir que si $k = 0$ el sistema siempre se invalida.'
afirmaciones_verdaderas:
  - 'Un sistema de ecuaciones 2x2 parametrizado admite solución única si y solo si su determinante principal es no nulo ($\Delta(k) \neq 0$).'
  - 'Los valores paramétricos que satisfacen $\Delta(k) \neq 0$ garantizan que las rectas asociadas sean secantes en el plano.'
al_terminar_debes_poder: |
  QUÉ: Determinar las condiciones paramétricas para que un sistema 2x2 posea solución única.
  CÓMO: Plantear el determinante principal $\Delta(k) \neq 0$, resolver la inecuación y expresar el conjunto de valores paramétricos permitidos $\mathbb{R} \setminus \{k_{\text{crítico}}\}$.
