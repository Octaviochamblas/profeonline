procedimiento:
- Identifica los coeficientes que acompañan a 'x' ($A_1, A_2$) y los que acompañan
  a 'y' ($B_1, B_2$).
- 'Plantea la inecuación de que la división de las ''x'' sea DISTINTA a la división
  de las ''y'': $\frac{A_1}{A_2} \neq$ \frac{B_1}{B_2}$.'
- Despeja el parámetro desconocido ('k') como si fuera una ecuación normal.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en condición paramétrica para solución única en un sistema 2x2.
