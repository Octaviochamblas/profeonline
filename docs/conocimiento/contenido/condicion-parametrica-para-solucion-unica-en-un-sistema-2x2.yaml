semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.PARAMETROS_SOLUCION_UNICA
resumen_inicial: 'Condición paramétrica para solución única en un sistema 2x2: propiedades,
  resolución y modelamiento en Representación y clasificación de sistemas 2x2.'
explicacion_simple: 'Recuerda: Para que haya solución única, las rectas deben tener
  pendientes diferentes (deben chocar). La forma matemática de verificar esto rápidamente
  es comparando las fracciones que forman los coeficientes.'
explicacion_formal: '### Definición formal


  Dado un sistema $A_1x+B_1y=C_1$, $A_2x+B_2y=C_2$ con un coeficiente expresado como
  parámetro, el sistema tiene solución única exactamente para los valores del parámetro
  que cumplen $\frac{A_1}{A_2} \neq \frac{B_1}{B_2}$; despejar el parámetro de la
  igualdad $\frac{A_1}{A_2} = \frac{B_1}{B_2}$ determina el único valor que debe excluirse.


  ### Desarrollo didáctico


  Recuerda: Para que haya solución única, las rectas deben tener pendientes diferentes
  (deben chocar). La forma matemática de verificar esto rápidamente es comparando
  las fracciones que forman los coeficientes.


  Regla: Para solución única, la proporción de las ''x'' debe ser distinta a la proporción
  de las ''y''. Es decir: $\frac{A_1}{A_2} \neq \frac{B_1}{B_2}$.

  En nuestro ejemplo: $\frac{k}{3} \neq \frac{2}{4}$. Resuelves y listo: $k \neq 1.5$.'
definiciones_clave: '- **Condición paramétrica para solución única en un sistema 2x2**:
  Herramienta matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a condición paramétrica para solución única
  en un sistema 2x2.'
