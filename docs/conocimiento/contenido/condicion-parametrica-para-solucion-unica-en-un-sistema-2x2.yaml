semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.PARAMETROS_SOLUCION_UNICA
resumen_inicial: La condición paramétrica para solución única en un sistema 2x2 exige
  que el determinante principal del sistema sea no nulo.
explicacion_simple: 'Cuando un sistema 2x2 contiene letras parámetro (como $k$ o $m$)
  acompañando a las incógnitas $x, y$, se nos pide hallar para qué valores de $k$
  el sistema tiene **solución única**.

  Aplicamos la regla del determinante principal $\Delta$: multiplicamos en cruz los
  coeficientes de las variables $x, y$ y exigimos que esa resta sea distinta de cero
  ($a_1 b_2 - a_2 b_1 \neq 0$).'
explicacion_formal: 'Dado el sistema con parámetro $k \in \mathbb{R}$:


  $$\begin{cases} a_1(k) x + b_1(k) y = c_1 \\ a_2(k) x + b_2(k) y = c_2 \end{cases}$$


  La **condición de solución única** (Compatible Determinado) requiere:


  $$\Delta(k) = a_1(k) b_2(k) - a_2(k) b_1(k) \neq 0 \iff \frac{a_1(k)}{a_2(k)} \neq
  \frac{b_1(k)}{b_2(k)}$$


  **Desglose de la fórmula:**

  - $\Delta(k) \neq 0$: Desigualdad paramétrica que excluye los valores críticos que
  causarían paralelismo o coincidencia entre las rectas.'
definiciones_clave: '- **Condición paramétrica de solución única**: Desigualdad que
  restringe los valores del parámetro $k$ para garantizar $\Delta \neq 0$.

  - **Valores críticos del parámetro**: Raíces de la ecuación $\Delta(k) = 0$ que
  destruyen la solución única.'
propiedades_relaciones: '- **Independencia del término independiente**: La condición
  de solución única depende ÚNICAMENTE de los coeficientes de las variables $x$ e
  $y$, jamás del término independiente $c_1, c_2$.'
ejemplo_guiado:
  enunciado: Determina para qué valores del parámetro $k$ el sistema $\begin{cases}
    kx + 2y = 5 \\ 3x + y = 4 \end{cases}$ posee una solución única en los números
    reales.
  pasos:
  - 'Paso 1: Plantear el determinante principal del sistema: $\Delta = \begin{vmatrix}
    k & 2 \\ 3 & 1 \end{vmatrix} = k(1) - (2)(3) = k - 6$.Paso 2: Exigir la condición
    de solución única: $\Delta \neq 0 \implies k - 6 \neq 0$.Paso 3: Resolver la desigualdad
    para el parámetro: $k \neq 6$.Paso 4: Concluir que el sistema posee solución única
    para todo $k \in \mathbb{R} \setminus \{6\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Para el sistema $\begin{cases} kx + 2y = 5 \\ 3x + y = 4 \end{cases}$,
    ¿cuál es la condición paramétrica exacta para tener solución única?
  choices:
  - text: $k \neq 6$
    is_correct: true
  - text: $k = 6$
    is_correct: false
  - text: $k \neq 5$
    is_correct: false
  - text: $k > 0$
    is_correct: false
  explanation: La alternativa correcta es '$k \neq 6$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en el sistema anterior el parámetro toma el valor crítico $k = 6$,
    ¿qué ocurre con el sistema?
  choices:
  - text: Deja de tener solución única (se vuelve inconsistente o con infinitas soluciones).
    is_correct: true
  - text: Mantiene su solución única en el punto $(0,0)$.
    is_correct: false
  - text: Se convierte en una ecuación cuadrática.
    is_correct: false
  - text: La solución pasa a ser $x = 6$.
    is_correct: false
  explanation: La alternativa correcta es 'Deja de tener solución única (se vuelve
    inconsistente o con infinitas soluciones).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la matriz de coeficientes de las variables $x$ e $y$ en función
  del parámetro $k$.'
- 'Paso 2: Calcular el determinante $\Delta(k) = a_1 b_2 - a_2 b_1$.'
- 'Paso 3: Escribir la desigualdad $\Delta(k) \neq 0$.'
- 'Paso 4: Despejar el parámetro $k$ para indicar los valores permitidos $\mathbb{R}
  \setminus \{k_{\text{crítico}}\}$.'
errores_correccion: '- **Error común:** Incluir los términos constantes independientes
  $c_1, c_2$ al evaluar la condición de solución única.

  - **Cómo corregirlo:** La solución única se evalúa ÚNICAMENTE con los coeficientes
  de $x$ e $y$ (matriz $\Delta$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de clasificación.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de clasificación.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un sistema con solución única se representa por dos rectas secantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, se cortan en un único punto del plano.
- titulo: ¿Dos rectas paralelas representan un sistema sin solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, al no tener puntos en común no existe solución.
errores_frecuentes:
- Confundir las condiciones de proporcionalidad para solución única y sin solución.
- Asumir que la lectura gráfica sustituye la comprobación algebraica en las ecuaciones.
- Olvidar incluir el término constante al evaluar la condición de infinitas soluciones.
- Invertir los ejes $x$ e $y$ al leer las coordenadas de intersección del gráfico.
- Confundir la igualdad de pendientes con la coincidencia total de las rectas.
afirmaciones_verdaderas:
- Un sistema 2x2 es compatible determinado si las rectas asociadas tienen pendientes
  distintas y se cortan en un único punto.
- Si las razones de los coeficientes de $x$ e $y$ son iguales pero distintas a la
  razón de las constantes, el sistema es incompatible.
al_terminar_debes_poder: Al finalizar este recurso podrás clasificar sistemas 2x2
  e interpretar sus soluciones desde la perspectiva geométrica y paramétrica.
