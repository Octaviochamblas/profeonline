semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.COMPARACION_GRAFICAS
resumen_inicial: 'La comparación entre una función potencia base $f(x) = x^n$ y su versión transformada $g(x) = a (x - h)^n + k$ permite identificar sistemáticamente reflexiones, dilataciones/contracciones y traslaciones combinadas.'
explicacion_simple: |
  Para entender cualquier función potencia compleja como $g(x) = -3(x - 2)^4 + 5$, la comparamos paso a paso con su función madre $f(x) = x^4$. Analizamos cada parámetro: el signo menos indica que se dio vuelta patas arriba (reflexión); el 3 indica que se volvió más delgada y empinada (dilatación vertical); el $-2$ dentro del paréntesis indica que se corrió 2 unidades a la derecha; y el $+5$ fuera del paréntesis indica que subió 5 unidades. El vértice pasó de $(0, 0)$ a $(2, 5)$.
explicacion_formal: |
  ### Definición formal
  El **análisis sistemático de transformaciones de funciones potencia** compara la función mónica base $f(x) = x^n$ con la familia transformada tridimensional general:
  $$g(x) = a (x - h)^n + k$$
  descomponiendo el mapeo gráfico mediante cuatro parámetros elementales independientes:

  1. **Parámetro $a$ (Escala y Orientación)**:
     - Signo de $a$: Si $a < 0$, existe una **reflexión respecto del eje $x$**.
     - Magnitud $|a|$: Si $|a| > 1$, existe **dilatación vertical** (estrechamiento). Si $0 < |a| < 1$, existe **contracción vertical** (achatamiento).
  2. **Parámetro $h$ (Traslación Horizontal)**:
     - Desplaza el gráfico $h$ unidades horizontalmente. Vértice en $x = h$.
  3. **Parámetro $k$ (Traslación Vertical)**:
     - Desplaza el gráfico $k$ unidades verticalmente. Vértice en $y = k$.

  ### Matriz de Mapeo de Puntos Clave
  $$(x, y) \xrightarrow{\quad \text{Transformación} \quad} (x + h, \; a \cdot y + k)$$

  ### Síntesis didáctica
  Vector de transformación y coordenadas del vértice: El punto característico de referencia (vértice, punto de inflexión o cruce de asíntotas) se mapea directamente de $(0, 0)$ a $(h, k)$.
definiciones_clave: |
  - **Función potencia madre $x^n$**: Modelo canónico básico sin transformaciones aplicadas.
  - **Ecuación canónica transformada $a(x - h)^n + k$**: Formulación algebraica completa que integra todos los parámetros de transformación.
  - **Mapeo de transformaciones**: Regla punto a punto $(x, y) \to (x + h, ay + k)$ que relaciona ambas gráficas.
propiedades_relaciones: |
  - **Preservación del Grado $n$**: El exponente $n$ determina la familia morfológica (par, impar, positivo, negativo, fraccionario), la cual permanece inalterada bajo traslaciones y escalas.
  - **Comparación de Recorridos**:
    - $f(x) = x^2 \implies \operatorname{Rec}(f) = [0, +\infty[$.
    - $g(x) = a(x - h)^2 + k$ con $a < 0 \implies \operatorname{Rec}(g) = ]-\infty, k]$.
ejemplo_guiado:
  enunciado: 'Compara detalladamente la función potencia base $f(x) = x^2$ con la función transformada $g(x) = -2(x - 3)^2 + 4$, describiendo todas las transformaciones geométricas aplicadas, la ubicación del vértice y el recorrido.'
  pasos:
    - 'Paso 1: Análisis del coeficiente $a = -2$: El signo negativo indica **reflexión respecto del eje $x$** (abre hacia abajo). La magnitud $|-2| = 2 > 1$ indica **dilatación vertical** por un factor de 2.'
    - 'Paso 2: Análisis de $h$: En el binomio $(x - 3)$, $h = 3 > 0$, lo que indica **traslación horizontal de 3 unidades a la derecha**.'
    - 'Paso 3: Análisis de $k$: El término independiente $+4$ indica **traslación vertical de 4 unidades hacia arriba**.'
    - 'Paso 4: Vértice y Recorrido: El vértice pasa de $(0, 0)$ a $(3, 4)$. Como abre hacia abajo, el recorrido es $\operatorname{Rec}(g) = ]-\infty, 4]$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué secuencia de transformaciones geométricas se le aplicó a la función base $f(x) = x^3$ para obtener $g(x) = 0.5(x + 2)^3 - 7$?'
    choices:
      - {text: 'Contracción vertical por factor 0.5, traslación de 2 unidades a la izquierda y 7 unidades hacia abajo', is_correct: true}
      - {text: 'Dilatación vertical por factor 0.5, traslación de 2 unidades a la derecha y 7 unidades hacia arriba', is_correct: false}
      - {text: 'Reflexión respecto del eje $x$ y traslación de 2 unidades a la derecha', is_correct: false}
      - {text: 'Dilatación vertical por factor 2 y traslación de 7 unidades a la izquierda', is_correct: false}
    explanation: 'La alternativa correcta es ''Contracción vertical por factor 0.5, traslación de 2 unidades a la izquierda y 7 unidades hacia abajo''. $|a| = 0.5 < 1$ contrae verticalmente, $(x + 2)$ desplaza 2 a la izquierda, y $-7$ desplaza 7 hacia abajo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la función base es $f(x) = x^2$ con punto $(1, 1)$, ¿cuáles son las coordenadas del punto transformado en la función $g(x) = -3(x - 5)^2 + 10$?'
    choices:
      - {text: 'El punto de coordenadas $(6, 7)$, obtenido de $(1 + 5, -3(1) + 10)$', is_correct: true}
      - {text: 'El punto de coordenadas $(1, 1)$', is_correct: false}
      - {text: 'El punto de coordenadas $(5, 10)$', is_correct: false}
      - {text: 'El punto de coordenadas $(-4, -3)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto de coordenadas $(6, 7)$, obtenido de $(1 + 5, -3(1) + 10)$''. Aplicando el mapeo $(x + h, ay + k) \implies (1 + 5, -3(1) + 10) = (6, 7)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los cuatro parámetros en la función dada: exponente $n$, coeficiente $a$, desplazamiento horizontal $h$ y vertical $k$.'
  - 'Paso 2: Evaluar $a$: determinar reflexión (si $a < 0$) y tipo de escala (dilatación si $|a| > 1$ o contracción si $0 < |a| < 1$).'
  - 'Paso 3: Evaluar $h$ y $k$: determinar las traslaciones horizontales y verticales y ubicar el nuevo vértice $(h, k)$.'
  - 'Paso 4: Aplicar la regla de mapeo $(x, y) \to (x + h, ay + k)$ para reconstruir la gráfica y determinar el dominio y recorrido.'
errores_correccion: |
  - **Error 1:** Describir la secuencia de transformaciones en orden equivocado afectando los puntos. **Cómo corregirlo:** La regla estandarizada es aplicar primero la escala y reflexión sobre la función base ($a x^n$) y finalmente desplazar el resultado con el vector de traslación $(h, k)$.
  - **Error 2:** Confundir la función base $x^2$ con $x^3$ al analizar la forma. **Cómo corregirlo:** El exponente $n$ fija la forma estructural básica (U o S). Las transformaciones $a, h, k$ sólo mueven y deforman esa estructura básica sin cambiar el grado $n$.
ejemplos:
  - titulo: 'Análisis de parámetros desfasados'
    enunciado: 'Para $g(x) = -(x - 4)^3 + 2$, ¿cuál es el nuevo punto de inflexión?'
    alternativas:
      - 'El punto $(4, 2)$'
      - 'El punto $(-4, 2)$'
      - 'El punto $(4, -2)$'
    respuesta: 'El punto $(4, 2)$'
    solucion_pasos:
      - '1. Desplazamiento horizontal $h = 4$, vertical $k = 2$.'
      - '2. Punto de inflexión en $(h, k) = (4, 2)$.'
  - titulo: 'Deducción de la fórmula desde transformaciones'
    enunciado: 'Si $f(x) = x^2$ se contrae a la mitad, se refleja en $x$, y se desplaza 1 unidad a la derecha y 3 arriba, ¿la fórmula es $g(x) = -0.5(x - 1)^2 + 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a = -0.5$, $h = 1$, $k = 3 \implies g(x) = -0.5(x - 1)^2 + 3$.'
  - titulo: 'Recorrido de parábola transformada'
    enunciado: '¿El recorrido de $g(x) = -4(x - 5)^2 + 8$ es $]-\infty, 8]$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Reflexión en $x$ ($a = -4 < 0$) y vértice en $y = 8 \implies \operatorname{Rec}(g) = ]-\infty, 8]$.'
  - titulo: 'Mapeo de punto sobre la gráfica'
    enunciado: 'Si $(0, 0)$ es el vértice de $x^2$, ¿$(h, k)$ es siempre el vértice de $a(x - h)^2 + k$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El mapeo $(0 + h, a(0) + k) = (h, k)$ traslada el vértice al punto $(h, k)$.'
errores_frecuentes:
  - 'La función $g(x) = -2(x + 3)^2 + 1$ tiene su vértice en $(3, 1)$.'
  - 'El coeficiente $a = -0.5$ produce una dilatación vertical por ser negativo.'
  - 'Comparar $g(x) = 3(x - 1)^4 + 2$ con $f(x) = x^4$ indica una traslación horizontal a la izquierda.'
  - 'Las transformaciones $a, h, k$ modifican el exponente $n$ de la función potencia.'
  - 'El valor $k$ en $g(x) = a(x - h)^n + k$ afecta a la abscisa del punto trasladado.'
afirmaciones_verdaderas:
  - 'La comparación entre $f(x) = x^n$ y $g(x) = a (x - h)^n + k$ descompone las transformaciones en escala/reflexión de factor $a$, traslación horizontal de $h$ unidades y traslación vertical de $k$ unidades.'
  - 'El mapeo punto a punto $(x, y) \to (x + h, ay + k)$ traslada el centro de referencia de la función potencia del origen $(0, 0)$ al punto cartesiano $(h, k)$.'
al_terminar_debes_poder: |
  QUÉ: Comparar la gráfica de una función potencia transformada con su curva canónica base.
  CÓMO: Descomponer la ecuación en parámetros de escala ($a$), traslación horizontal ($h$) y traslación vertical ($k$).
