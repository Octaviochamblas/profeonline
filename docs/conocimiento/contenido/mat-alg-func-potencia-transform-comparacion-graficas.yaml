semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.COMPARACION_GRAFICAS
resumen_inicial: 'Comparación entre la función potencia base y su transformación gráfica:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Traslaciones y escalas.'
explicacion_simple: Ya conoces cada transformación por separado; ahora se combinan
  todas para describir completamente cómo se ve una función potencia transformada
  respecto a su versión básica.
explicacion_formal: '### Definición formal


  Dada $f(x)=a(x-h)^n+k$, la comparación completa con $g(x)=x^n$ requiere describir:
  (1) si $a<0$, hay reflexión respecto al eje $x$; (2) si $|a|>1$ o $|a|<1$, hay dilatación
  o contracción vertical; (3) el valor de $h$ indica el desplazamiento horizontal;
  (4) el valor de $k$ indica el desplazamiento vertical.


  ### Desarrollo didáctico


  Para $f(x)=-2(x-1)^2+3$: el coeficiente $a=-2$ indica reflexión (por el signo) y
  dilatación (por $|{-2}|>1$); $h=1$ desplaza $1$ unidad a la derecha; $k=3$ desplaza
  $3$ unidades hacia arriba. El vértice, antes en $(0,0)$, ahora está en $(1,3)$,
  y la curva abre hacia abajo en vez de hacia arriba.'
definiciones_clave: '- **Comparación entre la función potencia base y su transformación
  gráfica**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a comparación entre la función potencia base y su transformación
  gráfica.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de comparación entre la función potencia base y su transformación gráfica.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de comparación entre la
    función potencia base y su transformación gráfica.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar comparación entre la función potencia base y su transformación
    gráfica?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en traslaciones y escalas
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en traslaciones y escalas. El exponente
    n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en comparación entre la función potencia base y su transformación
    gráfica?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el signo y la magnitud del coeficiente $a$.'
- 'Paso 2: Identifica los valores de $h$ y $k$ para las traslaciones.'
- 'Paso 3: Describe la combinación de todas las transformaciones respecto a la función
  básica $x^n$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en comparación entre la función potencia base y su transformación
  gráfica.
ejemplos:
- titulo: Descripción integral de una transformación
  enunciado: Describe todas las transformaciones de $f(x)=3(x+2)^2-5$ respecto a $g(x)=x^2$.
  solucion_pasos:
  - '$a=3>1$: dilatación vertical, sin reflexión.'
  - '$h=-2$: desplazamiento $2$ unidades a la izquierda; $k=-5$: desplazamiento $5$
    unidades hacia abajo.'
- titulo: Descripción integral con reflexión y contracción
  enunciado: Describe todas las transformaciones de $f(x)=-0{,}5(x-4)^3+1$ respecto
    a $g(x)=x^3$.
  solucion_pasos:
  - '$a=-0{,}5$: hay reflexión (signo negativo) y contracción vertical ($|{-0{,}5}|<1$).'
  - '$h=4$: desplazamiento $4$ unidades a la derecha; $k=1$: desplazamiento $1$ unidad
    hacia arriba.'
- titulo: ¿Es posible que una función tenga reflexión y dilatación simultáneamente?
  enunciado: ¿Puede una función potencia transformada presentar reflexión y dilatación
    vertical al mismo tiempo?
  respuesta: Sí
  solucion_pasos:
  - Ocurre cuando $a<-1$: el signo negativo produce reflexión y el valor absoluto
      mayor que $1$ produce dilatación.
- titulo: ¿El orden de las transformaciones afecta el resultado final de la gráfica?
  enunciado: ¿Cambia la gráfica final si se aplican las transformaciones en distinto
    orden (primero traslación, luego reflexión, o viceversa)?
  respuesta: 'No'
  solucion_pasos:
  - Siguiendo la forma estándar $a(x-h)^n+k$, el resultado final es el mismo independiente
    del orden de análisis.
errores_frecuentes:
- Analizar el coeficiente $a$ solo por su signo o solo por su magnitud, sin combinar
  ambos aspectos.
- Confundir el orden de $h$ y $k$ al describir las traslaciones.
- Olvidar mencionar alguna de las cuatro transformaciones al describir la gráfica
  completa.
- No verificar el nuevo punto de referencia $(h,k)$ como resumen de ambas traslaciones.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  comparación entre la función potencia base y su transformación gráfica.
