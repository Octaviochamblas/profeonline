semantic_id: MAT.ALG.EC_CUADR_METODOS.EC_REDUCIBLES
resumen_inicial: La resolución de ecuaciones reducibles a segundo grado efectúa la sustitución $u = g(x)$, resuelve $au^2 + bu + c = 0$ y restituye $g(x) = u$.
explicacion_simple: |
  Para resolver ecuaciones complejas (como ecuaciones bicuadradas $x^4 - 13x^2 + 36 = 0$):

  1. **Haces el cambio de variable**: Defines $u = x^2$.
  2. **Escribes la ecuación cuadrática auxiliar**: $u^2 - 13u + 36 = 0$.
  3. **Resuelves para $u$**: $(u - 9)(u - 4) = 0 \implies u_1 = 9$ y $u_2 = 4$.
  4. **Restituyes la variable original $x$**:
     - Para $u_1 = 9 \implies x^2 = 9 \implies x = \pm 3$.
     - Para $u_2 = 4 \implies x^2 = 4 \implies x = \pm 2$.
  - **Resultado final**: La ecuación original de grado 4 tiene cuatro soluciones en los reales: $S = \{-3, -2, 2, 3\}$.
explicacion_formal: |
  Sea una ecuación algebraica de estructura compuesta $a[g(x)]^2 + b[g(x)] + c = 0$ donde $g: D \subseteq \mathbb{R} \to \mathbb{R}$ es una función sobreyectiva en su imagen. El algoritmo de resolución comprende dos etapas analíticas:

  **Etapa 1 (Ecuación Auxiliar en $u$):**
  Definiendo $u = g(x)$, se resuelve $au^2 + bu + c = 0$ obteniendo el conjunto solución auxiliar $S_u = \{u_1, u_2\}$.

  **Etapa 2 (Ecuaciones Secundarias en $x$):**
  Para cada $u_i \in S_u$, se resuelve la ecuación $g(x) = u_i$. El conjunto solución total $S_x$ es la unión de los conjuntos solución de las ecuaciones secundarias:

  $$S_x = \{x \in D \mid g(x) = u_1\} \cup \{x \in D \mid g(x) = u_2\}$$
definiciones_clave: |
  - **Ecuaciones reducibles a cuadráticas**: Ecuaciones de grado superior, exponenciales o racionales que adoptan la forma $au^2 + bu + c = 0$ mediante una transformación $u = g(x)$.
propiedades_relaciones: |
  - **Descarte de raíces extrañas o imposibles**: Si al resolver $u = x^2$ se obtiene un valor $u = -4$, la ecuación $x^2 = -4$ no aporta soluciones en el conjunto de los números reales $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación bicuadrada de cuarto grado $x^4 - 5x^2 - 36 = 0$ en el conjunto de los números reales.'
  pasos:
    - 'Paso 1: Aplicar el cambio de variable $u = x^2$: $u^2 - 5u - 36 = 0$.'
    - 'Paso 2: Resolver para $u$ factorizando: $(u - 9)(u + 4) = 0 \implies u_1 = 9$ y $u_2 = -4$.'
    - 'Paso 3: Restituir $x^2 = u$: para $u_1 = 9 \implies x^2 = 9 \implies x = \pm 3$.'
    - 'Paso 4: Para $u_2 = -4 \implies x^2 = -4$ (sin soluciones reales). Conjunto solución real final $S = \{-3, 3\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué paso es indispensable realizar después de encontrar las soluciones auxiliares $u_1$ y $u_2$ en una ecuación reducible?'
    choices:
      - {text: 'Restituir la variable original resolviendo las ecuaciones $g(x) = u_1$ y $g(x) = u_2$.', is_correct: true}
      - {text: 'Multiplicar $u_1$ por $u_2$ e igualar a cero.', is_correct: false}
      - {text: 'Declarar que las soluciones finales de la ecuación son $u_1$ y $u_2$.', is_correct: false}
      - {text: 'Descartar automáticamente ambas soluciones.', is_correct: false}
    explanation: 'La alternativa correcta es ''Restituir la variable original resolviendo las ecuaciones $g(x) = u_1$ y $g(x) = u_2$.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son las soluciones reales de la ecuación bicuadrada $x^4 - 10x^2 + 9 = 0$?'
    choices:
      - {text: '$S = \{-3, -1, 1, 3\}$', is_correct: true}
      - {text: '$S = \{1, 9\}$', is_correct: false}
      - {text: '$S = \{-9, -1, 1, 9\}$', is_correct: false}
      - {text: '$S = \{0\}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$S = \{-3, -1, 1, 3\}$''. Las soluciones en $u$ son $9$ y $1$; al despejar $x^2=9 \implies \pm 3$ y $x^2=1 \implies \pm 1$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el cambio de variable conveniente $u = g(x)$ que transforma la ecuación en $au^2 + bu + c = 0$.'
  - 'Paso 2: Resolver la ecuación cuadrática auxiliar para hallar sus soluciones $u_1$ y $u_2$.'
  - 'Paso 3: Plantear y resolver las ecuaciones secundarias $g(x) = u_1$ y $g(x) = u_2$.'
  - 'Paso 4: Descartar soluciones secundarias que no cumplan el dominio real y formar el conjunto solución $S_x$.'
errores_correccion: |
  - **Error común:** Aceptar valores negativos de $u$ en $u = x^2$ para calcular raíces reales (ej. decir $x = \pm \sqrt{-4} = \pm 2$).
  - **Cómo corregirlo:** Si $u < 0$ en la sustitución $x^2 = u$, esa rama **NO TIENE SOLUCIONES REALES** ($x \notin \mathbb{R}$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Ecuación bicuadrada con 4 raíces reales.
    alternativas:
      - '$S = \{-2, -1, 1, 2\}$'
      - '$S = \{1, 4\}$'
      - '$S = \{-4, 4\}$'
    respuesta: '$S = \{-2, -1, 1, 2\}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Bicuadrada con 2 raíces reales.
    alternativas:
      - '$S = \{-3, 3\}$'
      - '$S = \{-3, -2, 2, 3\}$'
      - '$\emptyset$'
    respuesta: '$S = \{-3, 3\}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Entregar las respuestas de la variable auxiliar $u$ como las soluciones finales de la incógnita $x$.'
  - 'Extraer raíz cuadrada a un valor negativo $u = -16$ en $x^2 = u$ obteniendo el número real $x = -4$.'
  - 'La sustitución de variable en ecuaciones de grado 4 produce siempre cuatro soluciones reales distintas.'
  - 'No verificar el dominio de validez de la función interna $g(x)$ en ecuaciones exponenciales o radicales.'
  - 'La técnica de sustitución auxiliar invalida el uso de la fórmula general en la etapa secundaria.'
afirmaciones_verdaderas:
  - 'Resolver ecuaciones reducibles a cuadráticas requiere resolver la ecuación cuadrática auxiliar $au^2 + bu + c = 0$ y posteriormente despejar la variable original $g(x) = u$.'
  - 'Si la sustitución es $u = x^2$ y una raíz auxiliar es negativa ($u_i < 0$), dicha raíz no aporta soluciones en el conjunto de los números reales.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones de grado superior o compuestas reducibles a segundo grado mediante cambio de variable.
  CÓMO: Definir $u = g(x)$, resolver $au^2 + bu + c = 0$, despejar $g(x) = u$ y filtrar las soluciones reales válidas.
