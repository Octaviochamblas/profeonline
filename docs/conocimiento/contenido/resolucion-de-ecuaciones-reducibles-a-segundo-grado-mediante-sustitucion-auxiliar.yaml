semantic_id: MAT.ALG.EC_CUADR_METODOS.EC_REDUCIBLES
resumen_inicial: 'Resolución de ecuaciones reducibles a segundo grado mediante sustitución
  auxiliar: concepto, discriminante, soluciones y modelamiento en Métodos algebraicos
  de resolución.'
explicacion_simple: Identificar la sustitución correcta es solo la mitad del trabajo;
  falta resolver la ecuación cuadrática resultante y luego "traducir" esa solución
  de vuelta a la variable original.
explicacion_formal: '### Definición formal


  Dada una ecuación reducible mediante $u=g(x)$, el proceso completo consiste en resolver
  $au^2+bu+c=0$ para obtener los valores de $u$, y luego resolver la ecuación $g(x)=u$
  para cada valor válido de $u$, obteniendo así las soluciones finales en $x$.


  ### Desarrollo didáctico


  Un detalle crucial es que no todo valor de $u$ obtenido produce soluciones reales
  en $x$: si $u=g(x)=x^2$ y el valor de $u$ resulta negativo, ese valor debe descartarse.


  Para $x^4-5x^2+4=0$: con $u=x^2$, se obtiene $u^2-5u+4=0$, cuyas soluciones son
  $u=1$ y $u=4$. Deshaciendo: $x^2=1 \Rightarrow x=\pm1$; $x^2=4 \Rightarrow x=\pm2$.
  En total, cuatro soluciones: $x=\pm1, \pm2$.'
definiciones_clave: '- **Resolución de ecuaciones reducibles a segundo grado mediante
  sustitución auxiliar**: Elemento o técnica fundamental en la resolución de ecuaciones
  cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en resolución
  de ecuaciones reducibles a segundo grado mediante sustitución auxiliar.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando resolución de ecuaciones
    reducibles a segundo grado mediante sustitución auxiliar.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a resolución de ecuaciones
    reducibles a segundo grado mediante sustitución auxiliar.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
