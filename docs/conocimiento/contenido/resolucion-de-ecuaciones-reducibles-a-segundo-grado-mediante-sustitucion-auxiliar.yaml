semantic_id: MAT.ALG.EC_CUADR_METODOS.EC_REDUCIBLES
resumen_inicial: Resolver ecuaciones reducibles a segundo grado exige resolver la
  cuadrática auxiliar en $u$ y luego despejar la incógnita original deshaciendo el
  cambio.
explicacion_simple: 'Para resolver completamente una **ecuación reducible a cuadrática**:

  1. Hacemos el cambio de variable $u = g(x)$.

  2. Resolvemos la ecuación cuadrática en $u$ obteniendo dos valores $u_1$ y $u_2$.

  3. Deshacemos el cambio resolviendo $g(x) = u_1$ y $g(x) = u_2$.

  4. Verificamos cuáles de los valores de $x$ obtenidos son soluciones reales válidas.'
explicacion_formal: Definición formal y justificación algebraica de métodos de resolución
  de ecuaciones cuadráticas.
definiciones_clave: '- **Método algebraico**: Procedimiento analítico para resolver
  ecuaciones cuadráticas sin depender de estimaciones gráficas.'
propiedades_relaciones: '- **Equivalencia de métodos**: Todos los métodos algebraicos
  (fórmula general, completación de cuadrados, sustitución) entregan exactamente las
  mismas soluciones.'
ejemplo_guiado:
  enunciado: Resolución de ecuaciones cuadráticas mediante métodos algebraicos avanzados.
  pasos:
  - 'Paso 1: Aplicar la técnica o cambio de variable.'
  - 'Paso 2: Desarrollar la ecuación cuadrática resultante.'
  - 'Paso 3: Obtener las raíces en la variable auxiliar.'
  - 'Paso 4: Despejar la variable original.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la principal ventaja de utilizar métodos algebraicos directos
    en ecuaciones cuadráticas?
  choices:
  - text: Garantizan la obtención exacta de todas las raíces reales o complejas.
    is_correct: true
  - text: Eliminan los números negativos.
    is_correct: false
  - text: Transforman todas las ecuaciones en rectas.
    is_correct: false
  - text: No requieren operaciones aritméticas.
    is_correct: false
  explanation: La alternativa correcta es 'Garantizan la obtención exacta de todas
    las raíces reales o complejas.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué paso es indispensable al utilizar una variable auxiliar $u = x^2$?
  choices:
  - text: Deshacer el cambio al final calculando $x = \pm \sqrt{u}$ para los valores
      de u positivos.
    is_correct: true
  - text: Dejar el resultado final expresado en la variable u.
    is_correct: false
  - text: Sumar u a toda la ecuación.
    is_correct: false
  - text: Igualar u a cero obligatoriamente.
    is_correct: false
  explanation: La alternativa correcta es 'Deshacer el cambio al final calculando
    $x = \pm \sqrt{u}$ para los valores de u positivos.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar el método algebraico más adecuado (fórmula, completación de
  cuadrados o sustitución).'
- 'Paso 2: Ejecutar los pasos algebraicos rigurosamente.'
- 'Paso 3: Simplificar los radicales y fracciones resultantes.'
- 'Paso 4: Declarar el conjunto solución $S$.'
errores_correccion: '- **Error común:** Errores de signo al elevar coeficientes negativos
  al cuadrado en la fórmula general.

  - **Cómo corregirlo:** Usa paréntesis: $(-b)^2$ siempre resulta en un número positivo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de métodos algebraicos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de métodos de resolución.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La fórmula general resuelve cualquier ecuación cuadrática ax^2 + bx + c
    = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, la fórmula general resolvente es de aplicación universal.
- titulo: ¿Al sustituir b = -5 en la fórmula general, -b se transforma en +5?
  respuesta: Sí
  solucion_pasos:
  - Sí, -(-5) = +5 por la regla de signos.
errores_frecuentes:
- Escribir $(-5)^2 = -25$ dentro del radical de la fórmula general en lugar de $+25$.
- Escribir el denominador $2a$ de la fórmula general dividiendo únicamente al radical
  y no a todo el numerador.
- Olvidar sumar el término $(b/2)^2$ a ambos lados de la ecuación al completar el
  cuadrado.
- Olvidar deshacer el cambio de variable auxiliar $u = x^2$ dejando las soluciones
  expresadas en $u$ en lugar de $x$.
- Simplificar coeficientes en fracciones algebraicas sin antes haber factorizado el
  numerador completo.
afirmaciones_verdaderas:
- La fórmula general $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$ resuelve cualquier ecuación
  cuadrática real.
- Para resolver ecuaciones bicuadradas de la forma $a x^4 + b x^2 + c = 0$, la sustitución
  $u = x^2$ la reduce a la cuadrática $a u^2 + b u + c = 0$.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar la fórmula general,
  sustituir coeficientes ordenadamente, simplificar radicales, completar el cuadrado
  y resolver ecuaciones reducibles a segundo grado.
fuente: Texto escolar MINEDUC — Álgebra / Métodos de Resolución Cuadrática
