semantic_id: MAT.GEO.CIRCULO_RECTAS.SECANTE
resumen_inicial: 'Definición de recta secante a una circunferencia como recta con
  dos puntos de intersección: conceptos, teoremas, propiedades geométricas y cálculo
  en Circunferencia y Círculo.'
explicacion_simple: El segundo caso posible en la posición relativa entre una recta
  y una circunferencia ocurre cuando la recta atraviesa la figura, cortándola.
explicacion_formal: '![Recta secante: dos puntos de intersección](/static/img/geometria/circunferencia-circulo/circulo-recta-secante.svg)


  ### Definición formal


  Una recta $L$ es secante a una circunferencia de centro $O$ y radio $r$ si la distancia
  de $O$ a $L$ es menor que $r$: $d(O,L)<r$. En este caso, $L$ y la circunferencia
  comparten exactamente dos puntos.


  ### Desarrollo didáctico


  El segmento de la recta secante que queda dentro de la circunferencia (entre sus
  dos puntos de intersección) es precisamente una cuerda; toda cuerda de una circunferencia
  proviene de prolongar una recta secante.'
