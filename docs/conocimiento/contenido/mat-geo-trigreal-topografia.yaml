procedimiento:
- 'Paso 1: Mide con precisión la distancia entre dos puntos accesibles (la base).'
- 'Paso 2: Mide los ángulos desde cada extremo de la base hacia el punto de interés.'
- 'Paso 3: Calcula el tercer ángulo y aplica la ley de senos para obtener las distancias
  hacia el punto de interés.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
