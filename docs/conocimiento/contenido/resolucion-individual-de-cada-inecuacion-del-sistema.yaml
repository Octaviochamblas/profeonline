semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.RESOLUCION_INDIVIDUAL
resumen_inicial: El primer paso para resolver un sistema de inecuaciones es despejar y hallar el conjunto solución individual de cada inecuación por separado.
explicacion_simple: '![Resolución individual de cada inecuación del sistema](/static/img/nodos/resolucion-individual-de-cada-inecuacion-del-sistema-intro.svg)


  Para resolver un sistema de inecuaciones, no intentamos despejar todo junto.


  1. Tomamos la primera inecuación y la despejamos completamente para hallar su intervalo solución $S_1$.

  2. Tomamos la segunda inecuación y la despejamos de forma independiente para hallar su intervalo solución $S_2$.

  3. Una vez obtenidos $S_1$ y $S_2$, pasamos a comparar dónde se traslapan ambos intervalos.'
explicacion_formal: 'Dado el sistema de inecuaciones con incógnita $x \in \mathbb{R}$:


  $$\begin{cases} I_1(x) \ R_1 \ 0 \implies S_1 = \{x \in \mathbb{R} \mid I_1(x) \ R_1 \ 0\} \\ I_2(x) \ R_2 \ 0 \implies S_2 = \{x \in \mathbb{R} \mid I_2(x) \ R_2 \ 0\} \end{cases}$$


  **Desglose de la fórmula:**

  - Independencia algebraica parcial: Cada subconjunto $S_i$ se calcula omitiendo temporalmente los términos de las demás inecuaciones del sistema.

  '
definiciones_clave: '- **Soluciones individuales ($S_1, S_2$)**: Intervalos de números reales resultantes de resolver cada inecuación del sistema de forma independiente.

  '
propiedades_relaciones: '- **Paso previo obligatorio**: No es posible determinar la intersección $S_1 \cap S_2$ sin antes calcular con precisión $S_1$ y $S_2$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Resolución individual de cada inecuación del sistema](/static/img/nodos/resolucion-individual-de-cada-inecuacion-del-sistema-ejemplos.svg)


    Resuelve individualmente las inecuaciones del sistema $\begin{cases} 2x - 4 > 2 \\ -3x + 15 \ge 3 \end{cases}$ y determina los conjuntos $S_1$ y $S_2$.'
  pasos:
  - 'Paso 1: Resolver la primera inecuación: $2x - 4 > 2 \implies 2x > 6 \implies x > 3$. Por lo tanto, $S_1 = ]3, +\infty[$.'
  - 'Paso 2: Resolver la segunda inecuación: $-3x + 15 \ge 3 \implies -3x \ge -12$.'
  - 'Paso 3: Dividir entre $-3$ e invertir $\ge$ a $\le$: $x \le \frac{-12}{-3} \implies x \le 4$. Por lo tanto, $S_2 = ]-\infty, 4]$.'
  - 'Paso 4: Presentar las soluciones individuales: $S_1 = ]3, +\infty[$ y $S_2 = ]-\infty, 4]$.'
checkpoints:
- placement: after_explicacion_formal
