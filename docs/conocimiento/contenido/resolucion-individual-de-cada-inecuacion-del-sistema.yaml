  - text: $S_2 = [4, +\infty[$
    is_correct: false
  - text: $S_2 = ]-\infty, 4[$
    is_correct: false
  - text: $S_2 = ]4, +\infty[$
    is_correct: false
  explanation: La alternativa correcta es '$S_2 = ]-\infty, 4]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al despejar $2x - 4 > 2$, ¿cuál es el intervalo solución individual $S_1$?
  choices:
  - text: $S_1 = ]3, +\infty[$
    is_correct: true
  - text: $S_1 = [3, +\infty[$
    is_correct: false
  - text: $S_1 = ]-\infty, 3[$
    is_correct: false
  - text: $S_1 = ]3, 4]$
    is_correct: false
  explanation: La alternativa correcta es '$S_1 = ]3, +\infty[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar la primera inecuación y despejar la variable $x$ obteniendo $S_1$.'
- 'Paso 2: Aislar la segunda inecuación y despejar la variable $x$ obteniendo $S_2$.'
- 'Paso 3: Expresar ambos conjuntos $S_1$ y $S_2$ en notación de intervalo.'
- 'Paso 4: Disponer ambos resultados para el cálculo de su intersección.'
errores_correccion: '- **Error común:** Intentar sumar o restar las dos inecuaciones del sistema como si fuera un sistema de ecuaciones lineales.

  - **Cómo corregirlo:** En inecuaciones NUNCA se suman las desigualdades; cada inecuación se resuelve DE FORMA INDIVIDUAL.

  '
ejemplos:
- titulo: 'Ejemplo 1: Despeje de la primera inecuación'
  enunciado: En el sistema $2x - 6 > 4$ y $3x + 1 \leq 16$, ¿cuál es la solución $S_1$ de la primera inecuación?
  alternativas:
  - $S_1 = ]5, +\infty[$
  - $S_1 = ]-\infty, 5[$
  - $S_1 = [5, +\infty[$
  - $S_1 = ]-\infty, 5]$
  respuesta: $S_1 = ]5, +\infty[$
  solucion_pasos:
  - 'Paso 1: $2x > 10 \implies x > 5$.'
  - 'Paso 2: $S_1 = ]5, +\infty[$.'
- titulo: 'Ejemplo 2: Despeje de la segunda inecuación'
  enunciado: En el mismo sistema, ¿cuál es la solución $S_2$ de $3x + 1 \leq 16$?
  alternativas:
  - $S_2 = ]-\infty, 5]$
  - $S_2 = [5, +\infty[$
  - $S_2 = ]-\infty, 5[$
  - $S_2 = ]5, +\infty[$
  respuesta: $S_2 = ]-\infty, 5]$
  solucion_pasos:
  - 'Paso 1: $3x \le 15 \implies x \le 5$.'
  - 'Paso 2: $S_2 = ]-\infty, 5]$.'
- titulo: 'Ejemplo 3: Inversión en despeje individual'
  enunciado: Al resolver individualmente $-2x \leq 8$, ¿qué intervalo se obtiene?
  alternativas:
  - $[-4, +\infty[$
  - $]-\infty, -4]$
  - $[4, +\infty[$
  - $]-\infty, 4]$
  respuesta: $[-4, +\infty[$
  solucion_pasos:
  - 'Paso 1: Al dividir por $-2$, el signo $\le$ cambia a $\ge$: $x \ge -4$.'
  - 'Paso 2: $S = [-4, +\infty[$.'
- titulo: 'Ejemplo 4: Independencia de cálculos'
  enunciado: ¿Es correcto mezclar términos de $I_1$ con $I_2$ durante el despeje?
  alternativas:
  - No, cada inecuación se resuelve de manera 100% independiente
  - Sí, se pueden sumar entre sí
  - Solo si tienen el mismo signo
  - Depende de las constantes
  respuesta: No, cada inecuación se resuelve de manera 100% independiente
  solucion_pasos:
  - 'Paso 1: Las inecuaciones no se suman ni restan entre sí; se despejan por separado.'
  - 'Paso 2: Luego se calcula la intersección.'
errores_frecuentes:
- Resolver un sistema de inecuaciones exige sumar algebraicamente los miembros de las dos inecuaciones para formar una sola desigualdad.
- Al resolver individualmente la inecuación $-2x < 6$ dentro del sistema, se mantiene el operador obteniendo $x < -3$.
- La resolución de la primera inecuación altera automáticamente los coeficientes de la segunda inecuación del sistema.
- Obtener $S_1 = ]3, +\infty[$ al resolver la primera inecuación concluye inmediatamente el trabajo sin necesidad de resolver la segunda.
- Despejar inecuaciones en un sistema requiere sustituir una variable por otra como en sistemas de ecuaciones lineales.
afirmaciones_verdaderas:
- El primer paso para resolver un sistema de inecuaciones consiste en despejar analíticamente cada inecuación por separado para hallar $S_1, S_2, \dots$
- Cada inecuación del sistema conserva sus propias reglas de despeje, incluyendo el cambio de sentido al dividir por coeficientes negativos.
al_terminar_debes_poder: '**QUÉ:** Resolver cada inecuación del sistema de manera independiente.


  **CÓMO:** Despejando analíticamente la variable en cada expresión para obtener los conjuntos parciales $S_1, S_2, \dots$ antes de cruzarlos.


  ![Resumen Resolución individual de cada inecuación del sistema](/static/img/nodos/resolucion-individual-de-cada-inecuacion-del-sistema-resumen.svg)'
