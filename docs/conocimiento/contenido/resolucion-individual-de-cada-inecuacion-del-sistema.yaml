semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.RESOLUCION_INDIVIDUAL
resumen_inicial: 'Resolución individual de cada inecuación del sistema: relaciones
  de orden, intervalos y resolución en Sistemas de inecuaciones lineales con una incógnita.'
explicacion_simple: Un sistema de inecuaciones consiste en dos o más desigualdades
  que deben cumplirse al mismo tiempo. Para encontrar los valores que satisfacen el
  sistema, resolvemos cada inecuación por separado y luego buscamos qué valores tienen
  en común.
explicacion_formal: '### Definición formal

  Un sistema de inecuaciones con una incógnita $x$ es un conjunto de inecuaciones
  $\\{I_1(x), I_2(x), \\dots, I_n(x)\\}$. El conjunto solución $S$ del sistema es
  la intersección de los conjuntos solución individuales de cada inecuación - $S =
  S_1 \\cap S_2 \\cap \\dots \\cap S_n$. Si la intersección es el conjunto vacío,
  el sistema no tiene solución.


  ### Desarrollo didáctico

  Resolver un sistema de inecuaciones es como buscar a una persona que debe cumplir
  varias condiciones a la vez. Por ejemplo, debe tener más de 18 años y menos de 25.
  Primero determinamos quiénes cumplen la primera condición, luego quiénes cumplen
  la segunda, y finalmente cruzamos la información para ver quiénes cumplen ambas.
  En matemáticas, calculamos el intervalo solución de cada inecuación de forma independiente.
  Una vez que tenemos los intervalos, los graficamos en la misma recta numérica. La
  zona donde todas las soluciones se superponen (se intersectan) es el resultado final
  del sistema.'
definiciones_clave: '- **Resolución individual de cada inecuación del sistema**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a resolución individual de cada inecuación
  del sistema.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de resolución individual
    de cada inecuación del sistema.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de resolución individual de cada inecuación
    del sistema, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
