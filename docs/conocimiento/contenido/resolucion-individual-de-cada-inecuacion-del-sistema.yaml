procedimiento:
- Resolver la primera inecuación de forma independiente aplicando las propiedades
  de las desigualdades, obteniendo su conjunto solución.
- Resolver la segunda inecuación de manera similar para obtener su propio conjunto
  solución.
- Representar ambas soluciones en una misma recta numérica para visualizar fácilmente
  los valores compartidos.
- Determinar la intersección de los conjuntos, que corresponde a la solución final
  del sistema.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en resolución individual de
  cada inecuación del sistema.
ejemplos:
- titulo: Sistema con intersección en un intervalo
  enunciado: Resuelve el sistema formado por las inecuaciones $2x - 4 < 0$ y $x +
    1 \\geq 0$.
  solucion_pasos:
  - 'Paso 1: Resolver la primera inecuación $2x - 4 < 0$.'
  - 'Paso 2: Sumar 4 a ambos lados para obtener $2x < 4$.'
  - 'Paso 3: Dividir por 2 para obtener $x < 2$. El conjunto solución es $(-\\infty,
    2)$.'
  - 'Paso 4: Resolver la segunda inecuación $x + 1 \\geq 0$.'
  - 'Paso 5: Restar 1 a ambos lados para obtener $x \\geq -1$. El conjunto solución
    es $[-1, \\infty)$.'
  - 'Paso 6: Intersectar las soluciones - $(-\\infty, 2) \\cap [-1, \\infty) = [-1,
    2)$.'
- titulo: Sistema con solución hacia el infinito
  enunciado: Determina el conjunto solución del sistema $3x \\geq 6$ y $5 - x < 2$.
  solucion_pasos:
  - 'Paso 1: Resolver la primera inecuación - $3x \\geq 6$.'
  - 'Paso 2: Dividir entre 3 para obtener $x \\geq 2$. El conjunto solución es $[2,
    \\infty)$.'
  - 'Paso 3: Resolver la segunda inecuación - $5 - x < 2$.'
  - 'Paso 4: Restar 5 a ambos lados obteniendo $-x < -3$.'
  - 'Paso 5: Multiplicar por $-1$, invirtiendo la desigualdad - $x > 3$. El conjunto
    es $(3, \\infty)$.'
  - 'Paso 6: Intersectar ambas soluciones - $[2, \\infty) \\cap (3, \\infty) = (3,
    \\infty)$.'
- titulo: Verificación de un valor en el sistema
  respuesta: Verdadero
  solucion_pasos:
  - Para que $x = 3$ sea solución, debe cumplir ambas inecuaciones.
  - 'Verificamos en la primera inecuación $x > 2$: el valor $3 > 2$ es verdadero.'
  - 'Verificamos en la segunda inecuación $2x \\leq 6$: calculamos $2(3) = 6 \\leq
    6$, lo cual es verdadero.'
  - Como cumple ambas desigualdades simultáneamente, sí es solución.
- titulo: ¿Tiene solución el sistema formado por $x > 5$ y $x < 2$?
  respuesta: Falso
  solucion_pasos:
  - La primera inecuación indica que $x$ pertenece al intervalo $(5, \\infty)$.
  - La segunda inecuación indica que $x$ pertenece al intervalo $(-\\infty, 2)$.
  - Al graficar en la recta, observamos que los intervalos no se cruzan en ningún
    punto.
  - La intersección es vacía, por lo tanto, el sistema no tiene solución.
errores_frecuentes:
- Creer que la solución del sistema se obtiene sumando o restando las inecuaciones
  como si fuera un sistema de ecuaciones.
- Considerar que la solución final es la unión de los conjuntos, en lugar de su intersección.
- Olvidar invertir el signo de la desigualdad en una de las inecuaciones al dividir
  por un negativo, afectando toda la intersección final.
- Concluir que si la primera inecuación incluye al extremo, la intersección siempre
  incluirá ese mismo extremo sin importar la segunda inecuación.
- Asumir que si una inecuación da como solución todos los números reales, el sistema
  no tiene solución.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  resolución individual de cada inecuación del sistema.
