semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.RESOLUCION_INDIVIDUAL
resumen_inicial: El primer paso para resolver un sistema de inecuaciones es despejar
  y hallar el conjunto solución individual de cada inecuación por separado.
explicacion_simple: 'Para resolver un sistema de inecuaciones, no intentamos despejar
  todo junto.

  1. Tomamos la primera inecuación y la despejamos completamente para hallar su intervalo
  solución $S_1$.

  2. Tomamos la segunda inecuación y la despejamos de forma independiente para hallar
  su intervalo solución $S_2$.

  3. Una vez obtenidos $S_1$ y $S_2$, pasamos a comparar dónde se traslapan ambos
  intervalos.'
explicacion_formal: 'Dado el sistema de inecuaciones con incógnita $x \in \mathbb{R}$:


  $$\begin{cases} I_1(x) \ R_1 \ 0 \implies S_1 = \{x \in \mathbb{R} \mid I_1(x) \
  R_1 \ 0\} \\ I_2(x) \ R_2 \ 0 \implies S_2 = \{x \in \mathbb{R} \mid I_2(x) \ R_2
  \ 0\} \end{cases}$$


  **Desglose de la fórmula:**

  - Independencia algebraica parcial: Cada subconjunto $S_i$ se calcula omitiendo
  temporalmente los términos de las demás inecuaciones del sistema.'
definiciones_clave: '- **Soluciones individuales ($S_1, S_2$)**: Intervalos de números
  reales resultantes de resolver cada inecuación del sistema de forma independiente.'
propiedades_relaciones: '- **Paso previo obligatorio**: No es posible determinar la
  intersección $S_1 \cap S_2$ sin antes calcular con precisión $S_1$ y $S_2$.'
ejemplo_guiado:
  enunciado: Resuelve individualmente las inecuaciones del sistema $\begin{cases}
    2x - 4 > 2 \\ -3x + 15 \ge 3 \end{cases}$ y determina los conjuntos $S_1$ y $S_2$.
  pasos:
  - 'Paso 1: Resolver la primera inecuación: $2x - 4 > 2 \implies 2x > 6 \implies
    x > 3$. Por lo tanto, $S_1 = ]3, +\infty[$.Paso 2: Resolver la segunda inecuación:
    $-3x + 15 \ge 3 \implies -3x \ge -12$.Paso 3: Dividir entre $-3$ e invertir $\ge$
    a $\le$: $x \le \frac{-12}{-3} \implies x \le 4$. Por lo tanto, $S_2 = ]-\infty,
    4]$.Paso 4: Presentar las soluciones individuales: $S_1 = ]3, +\infty[$ y $S_2
    = ]-\infty, 4]$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver individualmente la inecuación $-3x + 15 \ge 3$, ¿cuál es su
    conjunto solución $S_2$?
  choices:
  - text: $S_2 = ]-\infty, 4]$
    is_correct: true
  - text: $S_2 = [4, +\infty[$
    is_correct: false
  - text: $S_2 = ]-\infty, 4[$
    is_correct: false
  - text: $S_2 = ]4, +\infty[$
    is_correct: false
  explanation: La alternativa correcta es '$S_2 = ]-\infty, 4]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al despejar $2x - 4 > 2$, ¿cuál es el intervalo solución individual $S_1$?
  choices:
  - text: $S_1 = ]3, +\infty[$
    is_correct: true
  - text: $S_1 = [3, +\infty[$
    is_correct: false
  - text: $S_1 = ]-\infty, 3[$
    is_correct: false
  - text: $S_1 = ]3, 4]$
    is_correct: false
  explanation: La alternativa correcta es '$S_1 = ]3, +\infty[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar la primera inecuación y despejar la variable $x$ obteniendo $S_1$.'
- 'Paso 2: Aislar la segunda inecuación y despejar la variable $x$ obteniendo $S_2$.'
- 'Paso 3: Expresar ambos conjuntos $S_1$ y $S_2$ en notación de intervalo.'
- 'Paso 4: Disponer ambos resultados para el cálculo de su intersección.'
errores_correccion: '- **Error común:** Intentar sumar o restar las dos inecuaciones
  del sistema como si fuera un sistema de ecuaciones lineales.

  - **Cómo corregirlo:** En inecuaciones NUNCA se suman las desigualdades; cada inecuación
  se resuelve DE FORMA INDIVIDUAL.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de un sistema de inecuaciones requiere calcular la intersección
    de soluciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se exige la simultaneidad de todas las desigualdades.
- titulo: ¿Si dos intervalos no se cruzan en la recta numérica el sistema no tiene
    solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, la intersección es vacía ($S = \\emptyset$).
errores_frecuentes:
- Calcular la unión de intervalos en lugar de la intersección al resolver un sistema
  de inecuaciones.
- Intentar sumar o restar las inecuaciones del sistema como si fuera un sistema de
  ecuaciones lineales.
- Creer que basta con que un número cumpla una sola inecuación para ser solución del
  sistema.
- Olvidar invertir el símbolo al despejar coeficientes negativos dentro de alguna
  inecuación individual.
- Inventar un intervalo arbitrario cuando los sombreados de los intervalos van en
  direcciones opuestas sin cruzarse.
afirmaciones_verdaderas:
- La solución final de un sistema de inecuaciones lineales es la intersección de los
  conjuntos solución individuales de cada inecuación.
- Si las regiones de solución de las inecuaciones no tienen puntos comunes en la recta
  numérica, el sistema no tiene solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver sistemas de inecuaciones
  lineales con una incógnita, determinando su conjunto intersección en notación de
  intervalo y gráfica.
