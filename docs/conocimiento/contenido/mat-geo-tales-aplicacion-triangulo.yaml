- titulo: ¿Se cumple siempre la propiedad principal de aplicación del teorema de tales
    en triángulos con una recta paralela a un lado en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede aplicación del teorema de tales en triángulos con una recta paralela
    a un lado asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
