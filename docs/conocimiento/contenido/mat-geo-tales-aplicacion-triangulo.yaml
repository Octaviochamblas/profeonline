semantic_id: MAT.GEO.TEOREMA_TALES.APLICACION_TRIANGULO
resumen_inicial: 'Aplicación del teorema de Tales en triángulos con una recta paralela
  a un lado: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia,
  Semejanza y Homotecia.'
explicacion_simple: 'Un caso muy frecuente y útil del teorema de Tales ocurre dentro
  de un triángulo: cuando se traza una recta paralela a uno de sus lados, cortando
  a los otros dos.'
explicacion_formal: '![Tales aplicado en un triángulo con DE paralela a BC](/static/img/geometria/congruencia-semejanza/tales-aplicacion-triangulo.svg)


  ### Definición formal


  En el triángulo $ABC$, si $D\in AB$, $E\in AC$ y $DE\parallel BC$, entonces $\frac{AD}{DB}=\frac{AE}{EC}$,
  ya que AB y AC actúan como dos transversales cortadas por las paralelas que contienen
  a DE y BC.


  ### Desarrollo didáctico


  Este caso es simplemente una aplicación del teorema general de Tales, pero usando
  solo dos rectas paralelas (la que contiene a DE y la que contiene a BC) y dos transversales
  (los lados AB y AC del triángulo).'
definiciones_clave: '- **Aplicación del teorema de Tales en triángulos con una recta
  paralela a un lado**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a aplicación del teorema de tales en triángulos
  con una recta paralela a un lado.'
ejemplo_guiado:
  enunciado: En la aplicación de aplicación del teorema de tales en triángulos con
    una recta paralela a un lado, se establece una razón $k = 1.2$ entre dos figuras
    homólogas de longitud original $L = 50\text{ cm}$. Calcula la longitud transformada
    $L'$.
  pasos:
  - Aplicar el criterio o teorema de aplicación del teorema de tales en triángulos
    con una recta paralela a un lado.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 1.2 \cdot 50$.'
  - Concluir que la medida obtenida en aplicación del teorema de tales en triángulos
    con una recta paralela a un lado es $L' = 60.0\text{ cm}$.
