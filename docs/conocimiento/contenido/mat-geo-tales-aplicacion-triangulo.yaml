procedimiento:
- 'Paso 1: Verifica que el segmento trazado dentro del triángulo sea paralelo a uno
  de sus lados.'
- 'Paso 2: Identifica los dos segmentos que se forman en cada lado cortado por esa
  paralela.'
- 'Paso 3: Plantea la proporción entre los segmentos correspondientes en cada lado.'
