semantic_id: MAT.NUM.RAZONES_PROPORCIONES.MODELO_PROP_INVERSA
resumen_inicial: El modelamiento algebraico de la proporcionalidad inversa formula la relación entre dos variables mediante la función racional $y = f(x) = \frac{k}{x}$, donde $k = x_0 \cdot y_0$ es la constante de proporcionalidad.
explicacion_simple: "![Modelamiento algebraico inverso](/static/img/nodos/modelamiento-algebraico-de-la-proporcion-inversa-intro.svg)\n\nEl **modelamiento algebraico inverso** consiste en construir una fórmula racional para predecir cualquier valor:\n- La fórmula universal es:\n$$y = \\frac{k}{x}$$\n- **¿Cómo se construye el modelo?**\n  1. Identificamos un dato conocido $(x_0, y_0)$.\n  2. Calculamos la constante multiplicando: $k = x_0 \\cdot y_0$.\n  3. Escribimos la fórmula colocando $k$ en el numerador y $x$ en el denominador.\n- **Ejemplo:** Si $3$ bombas tardan $8\\text{ horas}$ en llenar un estanque:\n  - Constante de trabajo: $k = 3 \\cdot 8 = 24\\text{ bomba-horas}$.\n  - Modelo del tiempo: $T(n) = \\frac{24}{n}$ (donde $n$ es el número de bombas).\n  - Predicción: Para $6$ bombas $\\implies T(6) = \\frac{24}{6} = 4\\text{ horas}$."
explicacion_formal: 'Sea un fenómeno físico o logístico donde la variable dependiente $y$ es inversamente proporcional a la independiente $x$.


  **Formulación del Modelo Racional Homogéneo:**

  Se define la función modelo $f: \mathbb{R}^+ \to \mathbb{R}^+$ como:


  $$y = f(x) = \frac{k}{x}$$


  con parámetro estructural:

  $$k = x_0 \cdot y_0 \in \mathbb{R}^+$$


  **Capacidades del Modelo:**

  1. **Evaluación Directa (Predicción):** $y = f(x_{\text{nuevo}}) = \frac{k}{x_{\text{nuevo}}}$.

  2. **Evaluación Inversa (Control):** $x = f^{-1}(y_{\text{meta}}) = \frac{k}{y_{\text{meta}}}$.

  3. **Comportamiento Asintótico:** $\operatorname{Dom}(f) = \mathbb{R}^+$, $\operatorname{Rec}(f) = \mathbb{R}^+$.'
definiciones_clave: '- **Modelo proporcional inverso**: Función racional $y = \frac{k}{x}$.

  - **Parámetro $k$**: Magnitud invariante $k = x_0 \cdot y_0$.

  - **Simetría de inversión**: La función inversa es idéntica en estructura $f^{-1}(y) = \frac{k}{y}$.'
propiedades_relaciones: '- **Escalabilidad inversa**: $f(n \cdot x) = \frac{1}{n} \cdot f(x)$.

  - **Tasa de cambio no lineal**: La derivada $f''(x) = -\frac{k}{x^2}$ varía con $x$ (el decrecimiento es rápido al inicio y se ralentiza luego).'
ejemplo_guiado:
  enunciado: '![Ejemplos de modelamiento inverso](/static/img/nodos/modelamiento-algebraico-de-la-proporcion-inversa-ejemplos.svg)


    Construya el modelo del tiempo de llenado $T(n)$ de un estanque sabiendo que $3$ bombas tardan $8\text{ horas}$, y calcule cuánto tardarán $6$ bombas en llenarlo.'
  pasos:
  - 'Paso 1: Calcular la constante $k$: $k = 3 \cdot 8 = 24\text{ bomba-horas}$.'
  - 'Paso 2: Formular la función modelo: $T(n) = \frac{24}{n}$.'
  - 'Paso 3: Evaluar para $n = 6$: $T(6) = \frac{24}{6} = 4\text{ horas}$.'
  - 'Paso 4: Conclusión: $6$ bombas tardarán $4\text{ horas}$ (el doble de bombas tarda la mitad del tiempo).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la estructura algebraica general de un modelo de proporcionalidad inversa?
  choices:
  - text: $y = \frac{k}{x}$
    is_correct: true
  - text: $y = k \cdot x$
    is_correct: false
  - text: $y = k - x$
    is_correct: false
  - text: $y = \frac{x}{k}$
    is_correct: false
  explanation: La alternativa correcta es '$y = \frac{k}{x}$'. Función racional homogénea.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se calculó el tiempo para 6 bombas usando el modelo?
  choices:
  - text: 'Dividiendo la constante 24 entre 6 bombas: $T(6) = \frac{24}{6} = 4\text{ horas}$'
    is_correct: true
  - text: Multiplicando 24 por 6
    is_correct: false
  - text: Restando 24 menos 6
    is_correct: false
  - text: Sumando 3 + 8 + 6
    is_correct: false
  explanation: 'La alternativa correcta es ''Dividiendo la constante 24 entre 6 bombas: $T(6) = \frac{24}{6} = 4\text{ horas}$''.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las variables involucradas y verificar la naturaleza inversa de su relación.'
- 'Paso 2: Calcular la constante $k = x_0 \cdot y_0$ multiplicando los datos de referencia.'
- 'Paso 3: Formular la función $y = \frac{k}{x}$ y utilizarla para resolver predicciones directas o despejes inversos.'
errores_correccion: '- **Error 1: Escribir $y = kx$ por distracción.** **Cómo corregirlo:** En la proporción inversa la variable independiente DEBE estar en el denominador ($y = \frac{k}{x}$).

  - **Error 2: Evaluar $x = 0$ en el modelo.** **Cómo corregirlo:** $x = 0$ está fuera del dominio porque no se puede dividir por cero.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $4$ pintores pintan un edificio en $10\text{ días}$, ¿cuál es el modelo $D(p)$ de los días en función de los pintores?
  alternativas:
  - $D(p) = \frac{40}{p}$
  - $D(p) = 40p$
  - $D(p) = 10p + 4$
  respuesta: $D(p) = \frac{40}{p}$
  solucion_pasos:
  - $k = 4 \cdot 10 = 40 \implies D(p) = \frac{40}{p}$.
- titulo: Ejemplo 2
  enunciado: Usando $D(p) = \frac{40}{p}$, ¿cuántos pintores se necesitan para terminar en $5\text{ días}$?
  alternativas:
  - $8\text{ pintores}$
  - $200\text{ pintores}$
  - $2\text{ pintores}$
  respuesta: $8\text{ pintores}$
  solucion_pasos:
  - $p = \frac{40}{D} = \frac{40}{5} = 8\text{ pintores}$.
- titulo: ¿Permite el modelo y = k/x evaluar valores fraccionarios o decimales de x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una función continua definida para todo $x > 0$.
  alternativas:
  - texto: Sí, es aplicable para cualquier valor real positivo del dominio
    es_correcta: true
    retroalimentacion: ¡Correcto! Continuidad en $\mathbb{R}^+$.
  - texto: No, solo para números enteros
    es_correcta: false
    retroalimentacion: Incorrecto, admite cualquier número real positivo.
  - texto: No, solo para potencias de 2
    es_correcta: false
    retroalimentacion: Incorrecto, no existe restricción de potencia.
- titulo: ¿Es la función f(x) = 100/x un modelo de proporcionalidad inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la forma algebraica estándar con $k = 100$.
  alternativas:
  - texto: Sí, es una función racional de proporcionalidad inversa con k = 100
    es_correcta: true
    retroalimentacion: ¡Correcto! Modelo inverso perfecto.
  - texto: No, es una función lineal
    es_correcta: false
    retroalimentacion: Incorrecto, es una función racional.
  - texto: No, es una función cuadrática
    es_correcta: false
    retroalimentacion: Incorrecto, el grado del denominador es 1.
errores_frecuentes:
- Formular $y = kx$ en lugar de $y = k/x$.
- Multiplicar en vez de dividir al evaluar un nuevo valor de $x$.
- No identificar correctamente qué variable va en el denominador.
- Intentar evaluar la función en $x = 0$.
afirmaciones_verdaderas:
- El modelamiento algebraico de la proporción inversa adopta la forma $y = \frac{k}{x}$.
- La constante $k$ se calcula mediante $k = x_0 \cdot y_0$.
- Permite predecir y despejar variables continuas en cualquier contexto inverso.
al_terminar_debes_poder: '![Síntesis de modelamiento inverso](/static/img/nodos/modelamiento-algebraico-de-la-proporcion-inversa-resumen.svg)


  QUÉ: Modelar fenómenos y relaciones de proporcionalidad inversa mediante ecuaciones algebraicas funcionales.


  CÓMO: Determinando la constante $k = x_0 \cdot y_0$, formulando la función racional $y = \frac{k}{x}$ y utilizándola para predecir o controlar variables en contexto.'
