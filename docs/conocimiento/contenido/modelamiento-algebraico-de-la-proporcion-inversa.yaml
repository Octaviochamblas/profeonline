procedimiento:
- 'Paso 1: Calcula la constante $k$ multiplicando un par conocido $x \cdot y$.'
- 'Paso 2: Escribe la ecuación sustituyendo $k$ por el número encontrado como numerador.'
- 'Paso 3: Utiliza $y = k/x$ para calcular valores desconocidos reemplazando el valor de $x$.'
errores_correccion: Evita confundir los datos de entrada al operar con modelamiento algebraico
  de la proporción inversa.
ejemplos:
- titulo: Construyendo el modelo inverso
  enunciado: Si 5 obreros terminan un muro en 20 días, escribe el modelo algebraico del tiempo
    ($y$) en función de los obreros ($x$).
  solucion_pasos:
  - Calculamos $k = 5 \cdot 20 = 100$ (días-obrero totales).
  - Planteamos la fórmula general $y = k / x$.
  - El modelo es $y = 100/x$. (Si vienen 2 obreros, $100/2 = 50$ días).
- titulo: ¿Puedo despejar x en la ecuación inversa?
  respuesta: Sí
  solucion_pasos:
  - Al igual que $y = 100/x$, se cumple que $x = 100/y$. Puedes alternar posiciones sin alterar
    el numerador $k$.
- titulo: Ejemplo 3
  enunciado: Si el modelo es y igual a 48 dividido entre x, ¿cuánto vale y cuando x es 8?
  alternativas:
  - '6'
  - '40'
  - '56'
  respuesta: '6'
  solucion_pasos:
  - 48 dividido entre 8 es igual a 6.
- titulo: ¿En el modelo y igual a k dividido entre x, la variable x puede valer 0?
  respuesta: 'No'
  solucion_pasos:
  - Dividir por cero no está definido, por lo tanto x nunca puede ser 0.
errores_frecuentes:
- Plantear el modelo como $y = x / k$ (el total siempre debe ser el dividendo).
- Usar el modelo $y = k \cdot x$ (que es para proporción directa).
- Plantearlo como una resta $y = k - x$.
- Olvidar que $x$ no puede ser cero en la evaluación de la fórmula.
- Plantear el modelo como y igual a k por x, que corresponde a una proporción directa y no
  inversa.
afirmaciones_verdaderas:
- La propiedad de modelamiento algebraico de la proporción inversa preserva la consistencia
  lógica.
- El modelo algebraico de una proporción inversa siempre tiene la forma y igual a k dividido
  entre x, con x distinto de cero.
al_terminar_debes_poder: Resolver problemas aplicados que involucren modelamiento algebraico
  de la proporción inversa.
