resumen_inicial: 'El modelo algebraico de una proporcionalidad inversa expresa la
  variable dependiente $y$ como la constante $k$ dividida entre la variable independiente
  $x$: $y = \frac{k}{x}$.'
explicacion_simple: La fórmula de una proporcionalidad inversa es $y = k / x$. Para
  encontrar cualquier valor de $y$, tomamos la constante fija $k$ y la dividimos entre
  la variable $x$.
explicacion_formal: 'El **Modelo Algebraico Inverso** rige la función racional dada
  por:


  $$f(x) = y = \frac{k}{x} \quad (k > 0, \, x > 0)$$


  **Formulación equivalente:**

  - $x \cdot y = k$ o $x = \frac{k}{y}$.'
definiciones_clave: '- **Modelo algebraico inverso**: Ecuación racional $y = \frac{k}{x}$
  o $x \cdot y = k$.'
propiedades_relaciones: '- **Función racional**: Curva asintótica decreciente para
  $x > 0$.'
ejemplo_guiado:
  enunciado: Escriba el modelo algebraico para repartir un premio de \$600.000 entre
    $x$ ganadores.
  pasos:
  - 'Paso 1: Identificar el monto total a repartir como constante $k = 600.000$.'
  - 'Paso 2: Expresar la cantidad por persona $y = \frac{k}{x} \implies y = \frac{600.000}{x}$.'
  - 'Paso 3: Evaluar para $x = 4$ ganadores $\implies y = \frac{600.000}{4} = 150.000$.'
  - 'Conclusión: El modelo es $y = \frac{600.000}{x}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión algebraica estándar de un modelo de proporcionalidad
    inversa?
  choices:
  - text: y = k / x
    is_correct: true
  - text: y = k · x
    is_correct: false
  - text: y = x / k
    is_correct: false
  - text: y = k - x
    is_correct: false
  explanation: La alternativa correcta es 'y = k / x'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el premio de $600.000 entre x personas, ¿cuál
    fue la ecuación del modelo?
  choices:
  - text: y = 600.000 / x
    is_correct: true
  - text: y = 600.000x
    is_correct: false
  - text: y = x / 600.000
    is_correct: false
  - text: y = 600.000 - x
    is_correct: false
  explanation: La alternativa correcta es 'y = 600.000 / x'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de construir y evaluar el modelo
  algebraico de proporcionalidad inversa $y = \frac{k}{x}$.
semantic_id: MAT.NUM.PROP_INVERSA.MODELO_ALGEBRAICO
procedimiento:
- 'Paso 1: Verificar que el producto $x \cdot y = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = \frac{k}{x}$ o la hipérbola decreciente.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Aplicar la regla de tres directa multiplicando cruzado
  en un problema inverso.** **Cómo corregirlo:** En la proporción inversa se multiplican
  los datos de la misma fila ($x_1 \cdot y_1 = x_2 \cdot y_2$).


  - **Error 2: Usar el cociente $y / x$ en lugar del producto $x \cdot y$ para calcular
  $k$.** **Cómo corregirlo:** La proporcionalidad inversa conserva el PRODUCTO $k
  = x \cdot y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_INVERSA.MODELO_ALGEBRAICO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad inversa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de producto.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por producto constante x · y.
- titulo: ¿Es la gráfica de una proporción inversa una recta?
  respuesta: 'No'
  solucion_pasos:
  - No, es una curva suave llamada rama de hipérbola.
- titulo: ¿Permite la constante k = x · y resolver ecuaciones inversas?
  respuesta: Sí
  solucion_pasos:
  - Sí, despejando $y = k / x$ o $x = k / y$.
errores_frecuentes:
- Aplicar la regla de tres directa para resolver problemas cuya naturaleza es inversamente
  proporcional.
- Dividir la variable dependiente entre la independiente ($y / x$) pretendiendo obtener
  la constante de proporción inversa.
- Graficar una proporcionalidad inversa mediante una línea recta que toca el origen
  $(0,0)$.
- Declarar que si una variable disminuye al aumentar otra, siempre son inversamente
  proporcionales sin comprobar $x \cdot y = k$.
- Omitir que el producto de los datos $x_1 \cdot y_1$ debe ser igual al producto $x_2
  \cdot y_2$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son inversamente proporcionales si su producto es constante:
  $x \cdot y = k$.'
- El gráfico de una relación de proporcionalidad inversa en el primer cuadrante es
  una rama de hipérbola decreciente.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
