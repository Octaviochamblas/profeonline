semantic_id: MAT.NUM.PROP_INVERSA.MODELO_ALGEBRAICO
resumen_inicial: 'El modelo algebraico de la proporcionalidad inversa es la función racional $y = \frac{k}{x}$, donde $y$ es la variable dependiente, $x$ la independiente ($x \neq 0$) y $k$ la constante de proporcionalidad.'
explicacion_simple: |
  La fórmula de la proporción inversa te permite calcular de forma rápida cómo se reduce una cantidad al aumentar la otra. La ecuación general es $y = \frac{k}{x}$. Si sabes que el trabajo total para construir un muro requiere $40\text{ horas-hombre}$ ($k = 40$), la fórmula algebraico del tiempo $y$ en función del número de obreros $x$ es $y = \frac{40}{x}$. Para calcular cuánto tardarán 5 obreros, reemplazas $x = 5$: $y = \frac{40}{5} = 8\text{ horas}$.
explicacion_formal: |
  ### Definición formal
  El **modelo algebraico canónico** de una relación de proporcionalidad inversa entre dos variables reales positivas $x, y \in \mathbb{R}^+$ es la **función racional homogénea de grado -1**:
  $$y(x) = \frac{k}{x} = k \cdot x^{-1} \quad (k > 0, x \neq 0)$$

  ### Componentes de la ecuación funcional
  - **$x$**: Variable independiente (dominio $x \in \mathbb{R}^+$).
  - **$y$**: Variable dependiente (codominio $y \in \mathbb{R}^+$).
  - **$k$**: Constante de proporcionalidad inversa fija ($k = x \cdot y$).

  ### Propiedad de homogeneidad de grado -1
  La función $f(x) = \frac{k}{x}$ satisface para cualquier escalar de cambio de escala $c > 0$:
  $$f(c \cdot x) = \frac{k}{c \cdot x} = \frac{1}{c} \cdot \left(\frac{k}{x}\right) = \frac{1}{c} \cdot f(x)$$

  ### Comparación estructural de modelos
  - Proporcionalidad inversa: $y = \frac{k}{x}$.
  - Proporcionalidad directa: $y = k \cdot x$.
  - Función afín: $y = mx + n$.

  ### Síntesis didáctica
  - Ecuación del modelo: $y = \frac{k}{x}$.
  - Método de construcción: 1. Hallar $k = x \cdot y \implies$ 2. Escribir $y = \frac{k}{x}$.
definiciones_clave: |
  - **Modelo algebraico $y = k/x$**: Expresión funcional racional que modela el comportamiento recíproco de dos variables inversas.
  - **Función racional de grado -1**: Función matemática donde la variable independiente figura en el denominador con exponente 1.
  - **Dominio restringido $x \neq 0$**: Condición analítica que prohíbe evaluar el modelo en el valor cero.
propiedades_relaciones: |
  - **Simetría de despeje**: En el modelo inverso $y = \frac{k}{x}$, el despeje de la variable independiente es idéntico estructuralmente: $x = \frac{k}{y}$.
  - **Transformación a modelo lineal**: Al definir la variable auxiliar $u = \frac{1}{x}$, el modelo $y = \frac{k}{x}$ se transforma en un modelo lineal $y = k \cdot u$.
ejemplo_guiado:
  enunciado: 'Para llenar un estanque, $3$ bombas tardan $20\text{ minutos}$. Construye el modelo algebraico $y = \frac{k}{x}$ y calcula cuánto tiempo $y$ tardarán $12$ bombas.'
  pasos:
    - 'Paso 1: Calculamos la constante $k$ multiplicando el número de bombas por el tiempo: $k = x \cdot y = 3 \cdot 20 = 60$.'
    - 'Paso 2: Escribimos la ecuación del modelo algebraico sustituyendo $k = 60$: $y = \frac{60}{x}$.'
    - 'Paso 3: Sustituimos la nueva cantidad de bombas independientes $x = 12$ en la fórmula modelada: $y = \frac{60}{12}$.'
    - 'Paso 4: Resolvemos la división: $y = 5\text{ minutos}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula del modelo algebraico que representa a una relación de proporcionalidad inversa?'
    choices:
      - {text: '$y = \frac{k}{x}$, colocando la variable independiente en el denominador de la constante', is_correct: true}
      - {text: '$y = k \cdot x$, multiplicando la constante por la variable', is_correct: false}
      - {text: '$y = k + x$, sumando la constante a la variable', is_correct: false}
      - {text: '$y = x^k$, elevando la variable a la constante', is_correct: false}
    explanation: 'La alternativa correcta es ''$y = \frac{k}{x}$, colocando la variable independiente en el denominador de la constante''. Es la función racional homogénea.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el modelo algebraico del tiempo de viaje es $t = \frac{360}{v}$, ¿cuántas horas $t$ tardará un automóvil a una velocidad de $90\text{ km/h}$?'
    choices:
      - {text: '$4\text{ horas}$, calculando $t = \frac{360}{90} = 4$', is_correct: true}
      - {text: '$32.400\text{ horas}$, multiplicando $360 \cdot 90$', is_correct: false}
      - {text: '$270\text{ horas}$, restando $360 - 90$', is_correct: false}
      - {text: '$0.25\text{ horas}$, dividiendo $90 / 360$', is_correct: false}
    explanation: 'La alternativa correcta es ''$4\text{ horas}$, calculando $t = \frac{360}{90} = 4$''. Reemplazamos $v = 90 \implies t = 360 / 90 = 4\text{ h}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las variables cuantitativas del problema ($x$ independiente, $y$ dependiente).'
  - 'Paso 2: Calcular la constante de proporcionalidad inversa $k$ multiplicando un par de datos conocidos ($k = x \cdot y$).'
  - 'Paso 3: Escribir la fórmula del modelo sustituyendo la constante hallada: $y = \frac{k}{x}$.'
  - 'Paso 4: Evaluar la ecuación dividiendo $k$ por el nuevo valor de $x$ para obtener $y$.'
errores_correccion: |
  - **Error 1:** Escribir el modelo de proporción inversa como una resta $y = k - x$. **Cómo corregirlo:** La proporcionalidad inversa es una relación **racional multiplicativa**: $y = \frac{k}{x}$.
  - **Error 2:** Multiplicar $k \cdot x$ al evaluar el modelo en lugar de dividir $\frac{k}{x}$. **Cómo corregirlo:** La fórmula del modelo es $y = \frac{k}{x}$; al sustituir $x$, **debes realizar una DIVISIÓN**, jamás una multiplicación.
ejemplos:
  - titulo: 'Modelo de reparto de herencia'
    enunciado: 'Si el monto total a repartir por persona es $\$1.000.000$ ($k$), ¿el modelo por heredero $n$ es $y = \frac{1.000.000}{n}$?'
    alternativas:
      - 'Sí, con $k = 1.000.000$'
      - 'No, es $y = 1.000.000 \cdot n$'
      - 'No, es $y = 1.000.000 - n$'
    respuesta: 'Sí, con $k = 1.000.000$'
    solucion_pasos:
      - '1. Identificamos la constante total $k = 1.000.000$.'
      - '2. Escribimos la fórmula racional: $y = \frac{1.000.000}{n}$.'
  - titulo: 'Modelo de velocidad y tiempo'
    enunciado: 'Para una distancia de $180\text{ km}$, ¿el modelo del tiempo es $t(v) = \frac{180}{v}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $t = \frac{d}{v} \implies t = \frac{180}{v}$.'
  - titulo: 'Despeje de variable independiente'
    enunciado: 'En el modelo $y = \frac{80}{x}$, si $y = 16$, ¿el valor de $x$ es $5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $x = \frac{k}{y} = \frac{80}{16} = 5$.'
  - titulo: 'Comprobación de restricción de dominio'
    enunciado: 'En el modelo $y = \frac{50}{x}$, ¿es imposible calcular $y$ para $x = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La división por cero no está definida ($x \neq 0$).'
errores_frecuentes:
  - 'Escribir el modelo de la proporcionalidad inversa como una función multiplicativa $y = k \cdot x$.'
  - 'Multiplicar en lugar de dividir por la variable independiente al evaluar $y = k / x$.'
  - 'Evaluar el modelo inverso asignando el valor cero a la variable independiente $x$.'
  - 'Restar la variable independiente a la constante $k - x$ creyendo que disminuye al mismo ritmo.'
  - 'Invertir el despeje dividiendo $x$ entre $k$ al buscar la variable dependiente.'
afirmaciones_verdaderas:
  - 'El modelo algebraico de la proporcionalidad inversa es la función racional $y = \frac{k}{x}$, donde $k = x \cdot y$ es la constante de proporcionalidad.'
  - 'En el modelo $y = \frac{k}{x}$, el valor de $x$ se puede despejar aplicando la misma estructura racional $x = \frac{k}{y}$.'
al_terminar_debes_poder: 'Construir y evaluar el modelo algebraico $y = \frac{k}{x}$ para resolver situaciones de proporcionalidad inversa.'
