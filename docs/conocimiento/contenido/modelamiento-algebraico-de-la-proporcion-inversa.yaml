semantic_id: MAT.NUM.PROP_INVERSA.MODELO_ALGEBRAICO
resumen_inicial: 'Modelamiento algebraico de la proporción inversa: concepto y propiedades
  fundamentales en Proporcionalidad inversa.'
explicacion_simple: Al igual que con la directa, podemos construir una 'máquina' para la proporción
  inversa. Esta máquina toma el trabajo total, lo divide por lo que tengas ahora, y te dice
  exactamente qué pasará.
explicacion_formal: 'Sabiendo que $x \cdot y = k$, podemos despejar la variable dependiente
  $y$ dividiendo ambos lados por $x$. Así obtenemos el **modelo algebraico** de la proporción
  inversa:


  $y = \frac{k}{x}$


  Esta ecuación nos dice que para hallar cualquier valor de $y$, debemos tomar nuestra ''cantidad
  total'' (la constante $k$) y repartirla o dividirla entre el valor de $x$. Si $x$ crece,
  se divide por un número mayor, haciendo que $y$ sea más pequeño.'
definiciones_clave: '- **Modelamiento algebraico de la proporción inversa**: Elemento central
  dentro del estudio de Proporcionalidad inversa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a modelamiento algebraico de la proporción inversa.'
ejemplo_guiado:
  enunciado: Si 4 máquinas fabrican un pedido en 15 horas, escribe el modelo algebraico de
    las horas en función del número de máquinas y calcula el tiempo con 6 máquinas.
  pasos:
  - 'Calculo la constante: k igual a 4 por 15, o sea 60.'
  - 'Planteo el modelo: y igual a 60 dividido entre x.'
  - 'Calculo el tiempo con 6 máquinas: y igual a 60 dividido entre 6, o sea 10 horas.'
