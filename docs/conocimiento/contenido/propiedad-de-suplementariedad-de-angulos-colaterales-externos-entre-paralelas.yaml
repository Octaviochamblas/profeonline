semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.COLATERALES_EXTERNOS_SUPLEMENTARIOS
resumen_inicial: Los ángulos suplementarios suman 180° formando una recta continua,
  siendo la base para calcular ángulos adyacentes y resolver sistemas de ecuaciones.
explicacion_simple: Imagina una línea recta horizontal de 180° partida en dos pedazos
  por una línea oblicua. Los dos pedazos son suplementarios porque juntos forman la
  línea recta completa.
explicacion_formal: Dos ángulos $\theta$ y $\phi$ son **suplementarios** si la suma
  de sus medidas es exactamente $180^\circ$ ($\theta + \phi = 180^\circ$). El suplemento
  de $\theta$ se obtiene mediante $\phi = 180^\circ - \theta$.
definiciones_clave: '- **Propiedad de suplementariedad de ángulos colaterales externos
  entre paralelas**: Elemento o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en propiedad de suplementariedad de ángulos colaterales externos entre paralelas
  se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Dos ángulos colaterales (conjugados) externos ubicados fuera de dos paralelas
    y al mismo lado de la transversal miden $130^\circ$ y $y$. Calcula $y$.
  pasos:
  - 'Paso 1: Aplicar la propiedad de ángulos colaterales externos: son suplementarios
    (suman $180^\circ$).'
  - 'Paso 2: Planteamos la ecuación: $130 + y = 180$.'
  - 'Paso 3: Restar 130: $y = 180 - 130 = 50^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de propiedad de suplementariedad
    de ángulos colaterales externos entre paralelas?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo colateral externo mide 130°, ¿cuánto mide su colateral externo
    suplementario?
  choices:
  - text: 50°
    is_correct: true
  - text: 130°
    is_correct: false
  - text: 60°
    is_correct: false
  - text: 180°
    is_correct: false
  explanation: La alternativa correcta es '50°', calculada como $180^\circ - 130^\circ
    = 50^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en propiedad de suplementariedad de ángulos
  colaterales externos entre paralelas.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en propiedad de suplementariedad
  de ángulos colaterales externos entre paralelas sean coherentes y tengan sentido
  geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 156^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 24°
  - 156°
  - 90°
  respuesta: 24°
  solucion_pasos:
  - Despejando $x = 180 - 156 = 24^\circ$.
- titulo: Ejemplo 2
  enunciado: En propiedad de suplementariedad de ángulos colaterales externos entre
    paralelas, si dos ángulos son suplementarios y uno mide 156°, ¿cuánto mide el
    otro?
  alternativas:
  - 24°
  - 14°
  - 360°
  respuesta: 24°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 156 = 24^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en propiedad de
    suplementariedad de ángulos colaterales externos entre paralelas?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en propiedad de suplementariedad
    de ángulos colaterales externos entre paralelas es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de propiedad de suplementariedad de ángulos
  colaterales externos entre paralelas.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
