semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.COLATERALES_EXTERNOS_SUPLEMENTARIOS
resumen_inicial: Si dos rectas paralelas son cortadas por una transversal, los ángulos
  colaterales externos son suplementarios (su suma es exactamente 180°).
explicacion_simple: '![Suplementariedad de Colaterales Externos](/static/img/nodos/propiedad-de-suplementariedad-de-angulos-colaterales-externos-entre-paralelas-intro.svg)


  Al igual que ocurre adentro, afuera los dos ángulos que están al mismo lado de la
  secante combinan una esquina muy abierta con una muy cerrada. Al sumar ambas medidas,
  el resultado es siempre exactamente 180°.'
explicacion_formal: '### Teorema formal

  Si dos rectas paralelas $L_1$ y $L_2$ son cortadas por una recta transversal $T$,
  los ángulos colaterales externos son estrictamente **suplementarios**:


  $$L_1 \parallel L_2 \implies \alpha + \beta = 180^\circ \quad (\text{Colaterales
  Externos})$$


  ### Desglose simbólico y geométrico

  - Suma de $180^\circ$: $\mu(\alpha) + \mu(\beta) = 180^\circ$.

  - Despeje algebraico directo: $\alpha = 180^\circ - \beta$.


  ### Síntesis didáctica

  Permite calcular medidas exteriores complementarias en techumbres y estructuras
  de ingeniería con perfiles paralelos.'
definiciones_clave: '- **Suplementariedad colateral externa**: Propiedad de sumar
  $180^\circ$ para ángulos colaterales en la región exterior.

  - **Criterio de paralelismo exterior**: Si dos ángulos colaterales externos suman
  $180^\circ$, las rectas son paralelas. '
propiedades_relaciones: '- **Formulación algebraica**: Ecuaciones del tipo $\alpha_1
  + \alpha_2 = 180^\circ$.

  - **Equivalencia de suplementos**: El suplemento del ángulo exterior superior es
  exactamente el ángulo exterior inferior del mismo lado. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Suplementariedad de Colaterales Externos](/static/img/nodos/propiedad-de-suplementariedad-de-angulos-colaterales-externos-entre-paralelas-ejemplos.svg)


    Dos ángulos colaterales externos entre rectas paralelas miden $\alpha = 4x + 20^\circ$
    y $\beta = x + 10^\circ$. Determina el valor de $x$ y la medida de ambos ángulos.'
  pasos:
  - 'Paso 1: Por teorema de colaterales externos entre paralelas, plantear la suma:
    $(4x + 20^\circ) + (x + 10^\circ) = 180^\circ$.'
  - 'Paso 2: Reducir términos semejantes: $5x + 30^\circ = 180^\circ$.'
  - 'Paso 3: Despejar $5x = 150^\circ \implies x = 30^\circ$.'
  - 'Paso 4: Calcular $\alpha$: $4(30^\circ) + 20^\circ = 140^\circ$.'
  - 'Paso 5: Calcular $\beta$: $30^\circ + 10^\circ = 40^\circ$. Comprobar: $140^\circ
    + 40^\circ = 180^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto suman dos ángulos colaterales externos entre rectas paralelas?
  choices:
  - text: Exactamente 180° (son suplementarios)
    is_correct: true
  - text: Exactamente 90° (son complementarios)
    is_correct: false
  - text: Exactamente 360°
    is_correct: false
  - text: Son siempre iguales
    is_correct: false
  explanation: Por teorema geométrico, suman exactamente 180° (son suplementarios).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo colateral externo mide 135° en rectas paralelas, ¿cuánto
    mide su pareja colateral externa?
  choices:
  - text: 45° (porque 180° - 135° = 45°)
    is_correct: true
  - text: 135°
    is_correct: false
  - text: 55°
    is_correct: false
  - text: 90°
    is_correct: false
  explanation: Por ser suplementarios, 180° - 135° = 45°, por lo que la pareja mide
    45° (porque 180° - 135° = 45°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las rectas paralelas $L_1 \parallel L_2$.'
- 'Paso 2: Localizar los ángulos colaterales externos (mismo lado de $T$, región exterior).'
- 'Paso 3: Plantear la ecuación $\alpha + \beta = 180^\circ$.'
- 'Paso 4: Resolver para despejar la incógnita y calcular las medidas.'
errores_correccion: No confundas colaterales externos (que suman 180°) con alternos
  externos (que son iguales).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si dos ángulos colaterales externos miden $115^\circ$ y $x$, ¿cuánto
    vale $x$?
  alternativas:
  - $65^\circ$
  - $115^\circ$
  - $75^\circ$
  respuesta: $65^\circ$
  solucion_pasos:
  - $x = 180^\circ - 115^\circ = 65^\circ$.
- titulo: Ejemplo 2
  enunciado: Si los ángulos colaterales externos miden $3x$ y $2x + 30^\circ$, ¿cuánto
    vale $x$?
  alternativas:
  - $30^\circ$
  - $40^\circ$
  - $50^\circ$
  respuesta: $30^\circ$
  solucion_pasos:
  - $3x + 2x + 30^\circ = 180^\circ \implies 5x = 150^\circ \implies x = 30^\circ$.
- titulo: ¿Los ángulos colaterales externos son suplementarios en rectas paralelas?
  respuesta: Sí
  solucion_pasos:
  - Sí, por teorema su suma siempre es 180°.
- titulo: ¿Los ángulos colaterales externos son siempre congruentes?
  respuesta: 'No'
  solucion_pasos:
  - No, suman 180°; solo son congruentes si ambos son rectos de 90°.
errores_frecuentes:
- Igualar los dos ángulos colaterales externos creyendo que son iguales.
- Confundir la posición colateral con la posición alterna.
- Sumar a $90^\circ$ o $360^\circ$ en lugar de $180^\circ$.
- Olvidar verificar que las rectas sean paralelas.
- Equivocarse en la reducción de términos semejantes.
afirmaciones_verdaderas:
- Los ángulos colaterales externos entre rectas paralelas suman $180^\circ$.
- La suplementariedad de colaterales externos garantiza que las rectas son paralelas.
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad de suplementariedad de ángulos
  colaterales externos para resolver problemas de paralelismo.


  **CÓMO:** Planteando la ecuación $\alpha + \beta = 180^\circ$ y despejando incógnitas
  bajo la condición $L_1 \parallel L_2$.


  ![Resumen de Suplementariedad de Colaterales Externos](/static/img/nodos/propiedad-de-suplementariedad-de-angulos-colaterales-externos-entre-paralelas-resumen.svg)'
