semantic_id: MAT.GEO.CIRCULO_TEOREMAS.TANGENTE_SECANTE_SEGMENTOS
resumen_inicial: 'En una configuración mixta desde un punto exterior, es indispensable identificar el segmento tangente PT hasta el punto de contacto, y los dos segmentos de la secante: el exterior PA y el total PB.'
explicacion_simple: 'Imagina que desde un mismo punto exterior $P$ lanzas dos miradas hacia la circunferencia:

  1. La primera línea apenas **roza** la curva en un solo punto $T$ (es una recta tangente). La distancia desde ti hasta ese punto de contacto es el **segmento tangente $PT$**.

  2. La segunda línea **atraviesa** la curva (es una recta secante). Tiene una entrada cercana $A$ (el **segmento exterior $PA$**) y una salida lejana $B$ (el **segmento total $PB = PA + AB$**).


  En esta configuración mixta conviven una tangente y una secante. El segmento tangente $PT$ es especial porque su punto de entrada y de salida es el mismo ($T$), por lo que en los teoremas métricos ¡actúa como si se multiplicara por sí mismo ($PT^2$)!


  ![Identificación de tangente y secante](/static/img/nodos/identificacion-del-segmento-tangente-y-los-segmentos-de-la-secante-trazados-desde-un-punto-exterior-intro.svg)

  '
explicacion_formal: '### Configuración mixta tangente-secante desde punto exterior

  Sea $P$ un punto exterior a una circunferencia $\mathcal{C}(O, r)$. Desde $P$ se trazan:

  1. Una recta tangente $\mathcal{L}_T$ que hace contacto con $\mathcal{C}$ en el único punto de tangencia $T \in \mathcal{C}$. El segmento determinado es el **segmento tangente** $\overline{PT}$, de longitud escalar $PT = d(P, T)$.

  2. Una recta secante $\mathcal{L}_S$ que interseca a $\mathcal{C}$ en dos puntos $A$ y $B$, con $d(P, A) < d(P, B)$.


  Sobre la secante se distinguen formalmente:

  - El **segmento exterior**: $\overline{PA}$ con longitud $PA = d(P, A)$.

  - La **cuerda interior**: $\overline{AB}$ con longitud $AB = d(A, B)$.

  - El **segmento total**: $\overline{PB}$ con longitud aditiva:

  $$PB = PA + AB$$


  > **Complemento didáctico:** Fíjate en los nombres de las letras: el segmento tangente siempre tiene como segundo extremo el punto de tangencia $T$ ($PT$). La secante siempre tiene dos letras sobre la curva ($A$ y $B$). ¡Nunca confundas $T$ con los puntos de corte de la secante!

  '
definiciones_clave: '- **Segmento tangente ($PT$)**: Distancia desde el punto exterior $P$ hasta el punto de tangencia $T$.

  - **Punto de tangencia ($T$)**: Único punto común entre la recta tangente y la circunferencia.

  - **Segmento total de secante ($PB$)**: Suma del segmento exterior y la cuerda interior ($PB = PA + AB$).

  '
propiedades_relaciones: '- **Radio perpendicular**: $\overline{OT} \perp \overline{PT}$ en el punto de contacto $T$.

  - **Caso límite de secante**: Si una secante gira de modo que sus dos puntos de corte $A$ y $B$ convergen a $T$, entonces $PA \to PT$ y $PB \to PT$.

  - **Desigualdad**: $PA < PT < PB$ cuando la secante pasa cerca del centro.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de segmentos tangente y secante](/static/img/nodos/identificacion-del-segmento-tangente-y-los-segmentos-de-la-secante-trazados-desde-un-punto-exterior-ejemplos.svg)


    Desde un punto exterior $P$ se traza un segmento tangente $\overline{PT}$ de longitud $12\text{ cm}$ y una secante que corta a la circunferencia en $A$ y $B$. Si el segmento exterior de la secante mide $PA = 8\text{ cm}$ y la cuerda interior mide $AB = 10\text{ cm}$, identifica los valores del segmento tangente, segmento exterior y segmento total de la secante.'
  pasos:
  - 'Paso 1: Identificar el segmento tangente: $PT = 12\text{ cm}$ (va de $P$ al punto de contacto $T$).'
  - 'Paso 2: Identificar el segmento exterior de la secante: $PA = 8\text{ cm}$ (va de $P$ al primer corte $A$).'
  - 'Paso 3: Calcular el segmento total de la secante sumando exterior más cuerda: $PB = PA + AB = 8 + 10 = 18\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: En una secante trazada desde un punto exterior P, ¿cómo se calcula la longitud de su segmento total PB?
  choices:
  - text: 'Sumando el segmento exterior y la cuerda interior: PB = PA + AB.'
    is_correct: true
  - text: 'Multiplicando el segmento exterior por la tangente: PB = PA · PT.'
    is_correct: false
  - text: 'Restando la cuerda interior del segmento tangente: PB = PT - AB.'
    is_correct: false
  - text: 'Elevando al cuadrado el segmento exterior: PB = PA².'
    is_correct: false
  explanation: 'La alternativa correcta es ''Sumando el segmento exterior y la cuerda interior: PB = PA + AB.'' El segmento total abarca desde el punto $P$ hasta el corte más lejano $B$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la característica distintiva del segmento tangente PT?
  choices:
  - text: Termina en el punto único de contacto T donde la recta no atraviesa la circunferencia.
    is_correct: true
  - text: Atraviesa la circunferencia cortándola en dos puntos opuestos.
    is_correct: false
  - text: Pasa obligatoriamente por el centro O de la circunferencia.
    is_correct: false
  - text: Mide siempre lo mismo que el diámetro.
    is_correct: false
  explanation: La alternativa correcta es 'Termina en el punto único de contacto T donde la recta no atraviesa la circunferencia.' La tangencia se caracteriza por un solo punto de intersección.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Localizar el punto exterior $P$ y las dos rectas trazadas.

  2. Identificar la recta que roza a la curva y registrar el punto de tangencia $T$ para obtener el segmento tangente $PT$.

  3. Identificar la recta que atraviesa la curva y registrar el corte cercano $A$ (segmento exterior $PA$) y lejano $B$.

  4. Calcular el segmento total de la secante sumando: $PB = PA + AB$.

  '
errores_correccion: '- **Error común 1:** Confundir el punto de tangencia $T$ con uno de los cortes de la secante. **Corrección:** $T$ es el contacto exclusivo de la recta tangente.

  - **Error común 2:** Olvidar sumar el exterior y la cuerda para obtener el total de la secante. **Corrección:** El total de la secante es $PB = PA + AB$.

  '
ejemplos:
- tipo: A
  titulo: Identificación de segmento total de secante
  enunciado: Desde un punto exterior $P$ se traza una tangente que contacta en $T$ y una secante que corta en $A$ y $B$. Si $PA = 5\text{ cm}$ y $AB = 7\text{ cm}$, ¿cuánto mide el segmento total $PB$?
  alternativas:
  - text: $12\text{ cm}$.
    is_correct: true
  - text: $7\text{ cm}$.
    is_correct: false
  - text: $35\text{ cm}$.
    is_correct: false
  - text: $2\text{ cm}$.
    is_correct: false
  explicacion: $PB = PA + AB = 5 + 7 = 12\text{ cm}$.
- tipo: B
  titulo: Contacto único
  enunciado: ¿Tiene el segmento tangente $PT$ un único punto de contacto con la circunferencia?
  respuesta: Sí
  explicacion: Sí. La recta tangente interseca a la circunferencia en un único punto geométrico $T$.
errores_frecuentes:
- '''Confundir el punto de tangencia $T$ con uno de los cortes de la secante.'''
- '''Tomar la cuerda interna como el total de la secante.'''
- '''Creer que el segmento tangente atraviesa la circunferencia.'''
afirmaciones_verdaderas:
- '''El segmento tangente $PT$ une el punto exterior $P$ con el punto de contacto $T$.'''
- '''El segmento total de la secante es la suma del exterior y la cuerda ($PB = PA + AB$).'''
- '''El radio en el punto de tangencia es perpendicular al segmento tangente ($OT \perp PT$).'''
al_terminar_debes_poder: '**QUÉ:** Identificar y estructurar correctamente segmentos tangentes y secantes desde un punto exterior.


  **CÓMO:** Distinguiendo el segmento tangente $PT$, exterior $PA$ y total $PB = PA + AB$.


