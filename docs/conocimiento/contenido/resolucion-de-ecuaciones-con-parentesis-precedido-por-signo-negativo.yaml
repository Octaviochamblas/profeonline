semantic_id: MAT.ALG.RESOLUCION_LINEAL.PARENTESIS_NEGATIVO
resumen_inicial: Un signo menos delante de un paréntesis exige cambiar el signo a
  todos los términos que están en su interior al suprimirlo.
explicacion_simple: 'Un signo negativo (-) ubicado justo delante de un paréntesis
  equivale a multiplicar todo lo que está adentro por $-1$.

  Al eliminar el paréntesis, debemos cambiar el signo de CADA término que estaba encerrado:

  Los términos positivos dentro del paréntesis se vuelven negativos y los términos
  negativos se convierten en positivos.'
explicacion_formal: 'Dada una ecuación con paréntesis precedido por signo negativo
  $A(x) - (b x + c) = d$, la **supresión del paréntesis negativo** establece:


  $$A(x) - (b x + c) = d \iff A(x) - b x - c = d$$

  $$A(x) - (b x - c) = d \iff A(x) - b x + c = d$$


  **Desglose de la fórmula:**

  - Inversión simultánea de los signos de todos los sumandos encerrados en el paréntesis.'
definiciones_clave: '- **Paréntesis precedido por signo negativo**: Estructura de
  la forma $-(P(x))$ que invierte los signos de su contenido al eliminarse.

  - **Distribución de $-1$**: Multiplicación del escalar $-1$ por cada término dentro
  del paréntesis.'
propiedades_relaciones: '- **Peligro algebraico clásico**: Olvidar cambiar el signo
  del término independiente dentro del paréntesis es una de las causas principales
  de error en exámenes.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación $10x - (3x - 4) = 25$ suprimiendo correctamente
    el paréntesis negativo y evalúa la solución.
  pasos:
  - 'Paso 1: Eliminar el paréntesis cambiando los signos de $+3x \implies -3x$ y de
    $-4 \implies +4$: $10x - 3x + 4 = 25$.Paso 2: Reducir términos semejantes en el
    primer miembro: $7x + 4 = 25$.Paso 3: Trasponer $+4$ restando: $7x = 25 - 4 =
    21$.Paso 4: Trasponer $7$ dividiendo: $x = \frac{21}{7} = 3$.Paso 5: Comprobar
    en la ecuación inicial: $10(3) - (3(3) - 4) = 30 - (9 - 4) = 30 - 5 = 25$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al eliminar el paréntesis en $10x - (3x - 4) = 25$, ¿cuál es la expresión
    correcta resultante?
  choices:
  - text: $10x - 3x + 4 = 25$
    is_correct: true
  - text: $10x - 3x - 4 = 25$
    is_correct: false
  - text: $10x + 3x - 4 = 25$
    is_correct: false
  - text: $10x + 3x + 4 = 25$
    is_correct: false
  explanation: La alternativa correcta es '$10x - 3x + 4 = 25$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $10x - (3x - 4) = 25$, ¿cuál es el valor de $x$?
  choices:
  - text: $x = 3$
    is_correct: true
  - text: $x = 4$
    is_correct: false
  - text: $x = 5$
    is_correct: false
  - text: $x = 2$
    is_correct: false
  explanation: La alternativa correcta es '$x = 3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el signo menos $(-)$ inmediatamente anterior al paréntesis.'
- 'Paso 2: Quitar el signo menos exterior y los paréntesis.'
- 'Paso 3: Escribir los términos interiores cambiando el signo $+$ a $-$ y el signo
  $-$ a $+$.'
- 'Paso 4: Reducir los términos semejantes y despejar la incógnita.'
errores_correccion: '- **Error común:** Escribir $-(3x - 4) = -3x - 4$ manteniendo
  el signo negativo del número 4.

  - **Cómo corregirlo:** La regla exige cambiar el signo a TODOS los términos dentro
  del paréntesis: el $-4$ dentro del paréntesis PASA A SER $+4$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de transposición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de transposición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un término que suma pasa restando al otro miembro?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de transposición de términos.
- titulo: ¿Un coeficiente multiplicativo cambia de signo al pasar dividiendo?
  respuesta: 'No'
  solucion_pasos:
  - No, la división conserva el signo del número que divide.
errores_frecuentes:
- Trasponer un término sumando sin invertir su signo al pasar al otro miembro.
- Cambiar el signo de un coeficiente multiplicativo al trasponerlo dividiendo.
- Multiplicar solo el primer término del paréntesis al aplicar la propiedad distributiva.
- Olvidar cambiar el signo del segundo término al eliminar un paréntesis precedido
  por signo negativo.
- Sumar términos semejantes en el mismo miembro cambiando sus signos como si hubieran
  cruzado el igual.
afirmaciones_verdaderas:
- La transposición de términos traslada sumandos aplicando la operación inversa (opuesto
  aditivo).
- La verificación de una ecuación sustituye el valor obtenido en la ecuación original
  para confirmar la igualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones lineales
  aplicando transposición de términos, paréntesis y verificación de soluciones.
