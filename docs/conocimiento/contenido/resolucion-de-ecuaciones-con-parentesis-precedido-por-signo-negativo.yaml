semantic_id: MAT.ALG.RESOLUCION_LINEAL.PARENTESIS_NEGATIVO
resumen_inicial: Un signo menos situado delante de un paréntesis exige cambiar el signo de todos los términos que se encuentran en su interior al suprimirlo.
explicacion_simple: |
  Un signo negativo ($-$) ubicado justo delante de un paréntesis equivale matemáticamente a multiplicar todo su contenido interior por $-1$.

  Al suprimir dicho paréntesis, debemos cambiar obligatoriamente el signo de **cada uno** de los términos encerrados:

  Los términos positivos en su interior se convierten en negativos, mientras que los términos negativos se transforman en positivos.
explicacion_formal: |
  ### Definición formal
  Dada una ecuación con paréntesis precedido por signo negativo $A(x) - (bx + c) = d$, la **supresión del paréntesis negativo** establece las transformaciones equivalentes:

  $$A(x) - (bx + c) = d \iff A(x) - bx - c = d$$

  $$A(x) - (bx - c) = d \iff A(x) - bx + c = d$$

  ### Desglose de la fórmula
  - Inversión simultánea e integral de los signos algebraicos de cada sumando dentro de la agrupación.

  ### Síntesis didáctica
  Distribuir el signo menos equivale a multiplicar por el escalar $-1$. Omitir la inversión del signo en el segundo término interior altera radicalmente la ecuación.
definiciones_clave: |
  - **Paréntesis precedido por signo negativo**: Estructura $-(P(x))$ donde el signo resta exterior invierte los signos de todos los sumandos internos.
  - **Inversión de signos**: Cambio de cada término $+T \implies -T$ y $-T \implies +T$ al eliminar el paréntesis.
propiedades_relaciones: |
  - **Distribución de $-1$**: La operación $-(a + b) = (-1) \cdot a + (-1) \cdot b = -a - b$ es la justificación distributiva del procedimiento.
  - **Conservación de equivalencia**: Invertir todos los sumandos internos mantiene la igualdad de la ecuación original.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación $10x - (3x - 4) = 25$ suprimiendo correctamente el paréntesis negativo y evalúa la solución.'
  pasos:
    - 'Paso 1: Eliminar el paréntesis invirtiendo los signos de $+3x \implies -3x$ y de $-4 \implies +4$: $10x - 3x + 4 = 25$.'
    - 'Paso 2: Reducir los términos semejantes en el primer miembro: $7x + 4 = 25$.'
    - 'Paso 3: Trasponer $+4$ restando al segundo miembro: $7x = 25 - 4 = 21$.'
    - 'Paso 4: Trasponer $7$ dividiendo al segundo miembro: $x = \frac{21}{7} = 3$.'
    - 'Paso 5: Comprobar sustituyendo $x = 3$ en la ecuación inicial: $10(3) - (3(3) - 4) = 30 - (9 - 4) = 30 - 5 = 25$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al eliminar el paréntesis en la ecuación $10x - (3x - 4) = 25$, ¿cuál es la expresión correcta resultante?'
    choices:
      - {text: '$10x - 3x + 4 = 25$', is_correct: true}
      - {text: '$10x - 3x - 4 = 25$', is_correct: false}
      - {text: '$10x + 3x - 4 = 25$', is_correct: false}
      - {text: '$10x + 3x + 4 = 25$', is_correct: false}
    explanation: 'La alternativa correcta es ''$10x - 3x + 4 = 25$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al resolver $10x - (3x - 4) = 25$, ¿cuál es el valor de $x$ obtenido?'
    choices:
      - {text: '$x = 3$', is_correct: true}
      - {text: '$x = 4$', is_correct: false}
      - {text: '$x = 5$', is_correct: false}
      - {text: '$x = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 3$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar el signo menos $(-)$ inmediatamente anterior al paréntesis.'
  - 'Paso 2: Quitar el signo menos exterior y los paréntesis del miembro.'
  - 'Paso 3: Cambiar el signo del primer término dentro del paréntesis ($+ \to -$ o $- \to +$).'
  - 'Paso 4: Cambiar el signo del segundo y subsecuentes términos dentro del paréntesis ($+ \to -$ o $- \to +$).'
  - 'Paso 5: Reducir los términos semejantes y despejar la incógnita.'
errores_correccion: |
  - **Error 1:** Escribir $-(3x - 4) = -3x - 4$ conservando el signo del término independiente. **Cómo corregirlo:** La regla exige cambiar el signo a **TODOS LOS TÉRMINOS DEL PARÉNTESIS: EL $-4$ DENTRO DEL PARÉNTESIS PASA OBLIGATORIAMENTE A SER $+4$**.
  - **Error 2:** Cambiar el signo de los términos ubicados fuera del paréntesis. **Cómo corregirlo:** La inversión de signos **AFECTA EXCLUSIVAMENTE A LOS SUMANDOS DEL INTERIOR DEL PARÉNTESIS PRECEDIDO POR EL SIGNO NEGATIVO**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es la forma sin paréntesis de la expresión $8 - (2x + 5)$?'
    alternativas:
      - '$8 - 2x - 5$'
      - '$8 - 2x + 5$'
      - '$8 + 2x - 5$'
    respuesta: '$8 - 2x - 5$'
    solucion_pasos:
      - '1. Invertir $+2x \implies -2x$.'
      - '2. Invertir $+5 \implies -5$.'
      - '3. Resultado: $8 - 2x - 5 = 3 - 2x$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve la ecuación $5x - (x - 6) = 22$.'
    alternativas:
      - '$x = 4$'
      - '$x = 7$'
      - '$x = 3$'
    respuesta: '$x = 4$'
    solucion_pasos:
      - '1. Eliminar paréntesis: $5x - x + 6 = 22$.'
      - '2. Reducir: $4x + 6 = 22$.'
      - '3. Trasponer $+6$: $4x = 16 \implies x = 4$.'
  - titulo: 'Inversión de término negativo'
    enunciado: '¿La expresión $-( -x + 3)$ se simplifica como $x - 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $-(-x) = +x$ y $-(+3) = -3$.'
  - titulo: 'Presencia del signo más'
    enunciado: '¿Un signo positivo $+ (2x - 1)$ exige cambiar los signos interiores al suprimir el paréntesis?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el signo positivo exterior conserva intactos los signos del interior.'
errores_frecuentes:
  - 'Al suprimir el paréntesis en la expresión $10x - (3x - 4)$, la constante $-4$ conserva su signo resultando en $10x - 3x - 4$.'
  - 'Al eliminar el paréntesis en $8 - (2x + 5) = 20$, los signos del término exterior $8$ cambian a $-8$.'
  - 'La expresión $-(3x - 4)$ equivale a multiplicar la agrupación por un escalar positivo $+3$ en lugar de por $-1$.'
  - 'Al eliminar el paréntesis en $10x - (3x - 4)$, los signos de los términos interiores se conservan idénticos como $10x + 3x - 4$.'
  - 'En la expresión $5x - (x - 6) = 22$, se efectúa la resta de coeficientes $5x - x = 4x$ conservando el paréntesis como $4x(-6) = 22$.'
afirmaciones_verdaderas:
  - 'Un signo negativo antes de un paréntesis equivale a multiplicar todos sus sumandos por $-1$.'
  - 'Suprimir un paréntesis precedido por un signo menos invierte el signo de todos los términos en su interior.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones lineales con paréntesis precedidos por un signo negativo.
  CÓMO: Suprimir la agrupación invirtiendo el signo de todos los sumandos interiores y despejar la incógnita.
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Ecuaciones Lineales.'
