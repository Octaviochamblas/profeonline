semantic_id: MAT.ALG.RESOLUCION_LINEAL.PARENTESIS_NEGATIVO
resumen_inicial: 'Resolución de ecuaciones con paréntesis precedido por signo negativo:
  propiedades, resolución y modelamiento en Resolución de ecuaciones lineales.'
explicacion_simple: Si hay un 'asesino silencioso' en los exámenes de álgebra, es
  el signo menos antes de un paréntesis. Ha arruinado más notas perfectas que cualquier
  otro error matemático.
explicacion_formal: '### Definición formal


  El menos de afuera invierte el signo del 3x positivo (queda -3x) y el del -7 (queda
  +7).


  ### Desarrollo didáctico


  Fíjate en esto: $10 - (2x + 4) = 0$


  Ese signo $-$ no solo afecta al $2x$. Ese signo menos es en realidad un $-1$ disfrazado
  que está multiplicando a todo el paréntesis.

  Si aplicas la propiedad distributiva con $-1$:

  - El $2x$ positivo se vuelve negativo: $-2x$

  - El $+4$ se vuelve negativo: $-4$


  La ecuación liberada queda: $10 - 2x - 4 = 0$.


  Si el interior tuviera un negativo, por ejemplo $-(x - 5)$, la regla de los signos
  (menos por menos da más) lo transforma en $-x + 5$.


  La regla de oro: Un ''menos'' afuera invierte TODOS los signos de adentro. Un ''más''
  afuera deja todos los signos exactamente igual.'
definiciones_clave: '- **Resolución de ecuaciones con paréntesis precedido por signo
