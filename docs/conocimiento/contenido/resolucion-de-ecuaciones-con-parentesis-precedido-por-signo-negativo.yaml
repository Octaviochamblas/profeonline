procedimiento:
- 'Paso 1: Detecta el signo $-$ antes del paréntesis.'
- 'Paso 2: Borra el signo menos y los paréntesis.'
- 'Paso 3: Escribe cada término del interior pero con su signo opuesto (+ cambia a
  -, y - cambia a +).'
- 'Paso 4: Continúa reduciendo términos como de costumbre.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en resolución de ecuaciones con paréntesis precedido por signo negativo.
ejemplos:
- titulo: 'Elimina el paréntesis y resuelve: $8 - (x - 2) = 12$'
  enunciado: 'Elimina el paréntesis y resuelve: $8 - (x - 2) = 12$'
  solucion_pasos:
  - El signo menos afecta a la 'x' y al '-2'.
  - 'Queda: $8 - x + 2 = 12$.'
  - 'Reducimos: $10 - x = 12$.'
  - 'Despejamos: $-x = 12 - 10 \rightarrow -x = 2$.'
  - 'Cambiamos signo a todo: $x = -2$.'
- titulo: Resuelve $5x - (2x + 9) = 6$
  solucion_pasos:
  - 5x - 2x - 9 = 6
  - 3x - 9 = 6
  - 3x = 15
  - x = 5
- titulo: 'Respecto de «Resolución de ecuaciones con paréntesis precedido por signo
    negativo»: ¿Describ'
  enunciado: 'Respecto de «Resolución de ecuaciones con paréntesis precedido por signo
    negativo»: ¿Describe adecuadamente el concepto esta frase? «Cuando un paréntesis
    está precedido por un signo menos ($-$), al eliminar el paréntesis se DEBEN CAMBIAR
    LOS SIGNOS de TODOS los términos de su interior»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Cuando un paréntesis está precedido
    por un signo menos ($-$), al eliminar el paréntesis se DEBEN CAMBIAR LOS SIGNOS
    de TODOS los términos de su interior.'
- titulo: 'Respecto de «Resolución de ecuaciones con paréntesis precedido por signo
    negativo»: ¿Se pued'
  enunciado: 'Respecto de «Resolución de ecuaciones con paréntesis precedido por signo
    negativo»: ¿Se puede aceptar esta afirmación? «El error más clásico: Cambiar el
    signo solo del primer término y copiar el segundo igual. Ej: $-(x+5)$ -> $-x+5$
    (Incorrecto, es $-x-5$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Cuando un paréntesis está precedido
    por un signo menos ($-$), al eliminar el paréntesis se DEBEN CAMBIAR LOS SIGNOS
    de TODOS los términos de su interior.'
errores_frecuentes:
- 'El error más clásico: Cambiar el signo solo del primer término y copiar el segundo
  igual. Ej: $-(x+5)$ -> $-x+5$ (Incorrecto, es $-x-5$).'
- $-3x - 7$.
- $2x - x - 1 = 5$.
- $x - 1 = 5$.
- $3x - 1 = 5$.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
