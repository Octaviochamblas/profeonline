procedimiento:
- 'Paso 1: Identificar los términos semejantes que residen dentro de un mismo miembro.'
- 'Paso 2: Sumar o restar algebraicamente los coeficientes numéricos manteniendo los signos de cada sumando.'
- 'Paso 3: Reducir las constantes numéricas independientes dentro del mismo miembro.'
- 'Paso 4: Repetir el procedimiento en el segundo miembro si contiene términos semejantes.'
- 'Paso 5: Resolver la ecuación lineal simplificada $Ax + B = C$ mediante transposición de términos.'
errores_correccion: '- **Error 1:** Cambiar los signos de los términos al agruparlos o sumarlos dentro del MISMO miembro.
  **Cómo corregirlo:** Los signos de los términos **SOLO SE INVIERTEN CUANDO CRUZAN EL SIGNO IGUAL DE UN MIEMBRO A OTRO; DENTRO
  DE UN MISMO MIEMBRO SE AGROPAN CONSERVANDO SUS SIGNOS**.

  - **Error 2:** Sumar coeficientes de la incógnita con constantes independientes (ejemplo: combinar $5x + 3 = 8x$). **Cómo
  corregirlo:** Solo se pueden agrupar términos que **COMPARTAN EXACTAMENTE LA MISMA VARIABLE O SEA CONSTANTES INDEPENDIENTES**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la versión simplificada del primer miembro en la ecuación $7x - 2x + 10 - 4 = 21$?
  alternativas:
  - $5x + 6 = 21$
  - $9x + 14 = 21$
  - $5x - 6 = 21$
  respuesta: $5x + 6 = 21$
  solucion_pasos:
  - '1. Términos con $x$: $7x - 2x = 5x$.'
  - '2. Constantes: $10 - 4 = +6$.'
  - '3. Ecuación reducida: $5x + 6 = 21$.'
- titulo: Ejemplo 2
  enunciado: Resuelve la ecuación $4x + 6 - x = 18$ tras reducir términos semejantes.
  alternativas:
  - $x = 4$
  - $x = 3$
  - $x = 6$
  respuesta: $x = 4$
  solucion_pasos:
  - '1. Reducir primer miembro: $4x - x = 3x \implies 3x + 6 = 18$.'
  - '2. Trasponer $+6$: $3x = 18 - 6 = 12$.'
  - '3. Despejar $x$: $x = \frac{12}{3} = 4$.'
- titulo: Agrupar en mismo miembro
  enunciado: ¿La expresión $2x + 3x$ en el primer miembro se reduce a $5x$ sin cambiar de signo?
  respuesta: Sí
  solucion_pasos:
  - Sí, pues no se ha traspuesto de miembro.
- titulo: Reducción en ambos miembros
  enunciado: ¿Es correcto reducir los términos semejantes del primer miembro y del segundo miembro de forma independiente
    antes de trasponer?
  respuesta: Sí
  solucion_pasos:
  - Sí, simplifica la ecuación a la forma $ax + b = cx + d$.
errores_frecuentes:
- Invertir los signos de los términos al agruparlos o sumarlos dentro del mismo miembro.
- Sumar coeficientes de la incógnita con constantes independientes (combinar $5x + 3$ como $8x$).
- Omitir el coeficiente implícito $1$ al reducir términos con variable como $4x - x$.
- Agrupar términos semejantes de miembros opuestos sin aplicar la regla de transposición.
- Dejar constantes numéricas sin simplificar antes de efectuar el despeje final.
afirmaciones_verdaderas:
- Reducir términos semejantes en un mismo miembro aplica la propiedad distributiva conservando los signos originales.
- La reducción previa simplifica la ecuación a la forma $Ax + B = C$ facilitando el despeje posterior.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/resolucion-con-reduccion-de-terminos-semejantes-resumen.svg)


  QUÉ: Resolver ecuaciones lineales reduciendo previamente los términos semejantes en cada miembro.

  CÓMO: Sumar algebraicamente coeficientes literales ($(a_1 + a_2)x$) y constantes independientes ($b_1 + b_2$) de forma independiente
  en cada miembro antes de trasponer para obtener la forma reducida $Ax + B = C$.

  '
