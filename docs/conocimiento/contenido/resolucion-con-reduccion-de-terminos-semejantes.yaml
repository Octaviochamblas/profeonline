procedimiento:
- 'Paso 1: Observa un solo miembro de la ecuación a la vez.'
- 'Paso 2: Suma o resta todos los términos que tengan la misma incógnita.'
- 'Paso 3: Suma o resta todos los números independientes.'
- 'Paso 4: Escribe la nueva ecuación simplificada y luego comienza a despejar.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en resolución con reducción de términos semejantes.
ejemplos:
- titulo: 'Simplifica y resuelve: $2x - x + 4 + x - 1 = 9$'
  enunciado: 'Simplifica y resuelve: $2x - x + 4 + x - 1 = 9$'
  solucion_pasos:
  - 'Reducimos las x: $2x - 1x + 1x = 2x$.'
  - 'Reducimos los números: $4 - 1 = 3$.'
  - 'La ecuación queda: $2x + 3 = 9$.'
  - 'Despejamos: $2x = 9 - 3 \rightarrow 2x = 6$.'
  - 'Final: $x = 3$.'
- titulo: Resuelve $5x - 3x + 10 = 20$
  solucion_pasos:
  - 'Reducimos: 2x + 10 = 20.'
  - 'Pasamos el 10: 2x = 10.'
  - 'Dividimos: x = 5.'
- titulo: 'Respecto de «Resolución con reducción de términos semejantes»: ¿Describe
    adecuadamente el co'
  enunciado: 'Respecto de «Resolución con reducción de términos semejantes»: ¿Describe
    adecuadamente el concepto esta frase? «Antes de empezar a transponer o despejar,
    siempre se deben sumar o restar entre sí (reducir) aquellos términos que son semejantes
    (tienen la misma letra) dentro de un mismo miembro»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Antes de empezar a transponer
    o despejar, siempre se deben sumar o restar entre sí (reducir) aquellos términos
    que son semejantes (tienen la misma letra) dentro de un mismo miembro.'
- titulo: 'Respecto de «Resolución con reducción de términos semejantes»: ¿Se puede
    aceptar esta afirma'
  enunciado: 'Respecto de «Resolución con reducción de términos semejantes»: ¿Se puede
    aceptar esta afirmación? «Sumar una ''x'' con un número independiente (ej: creer
    que $3x + 2 = 5x$). ¡Grave error algebraico!»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Antes de empezar a transponer
    o despejar, siempre se deben sumar o restar entre sí (reducir) aquellos términos
    que son semejantes (tienen la misma letra) dentro de un mismo miembro.'
errores_frecuentes:
- 'Sumar una ''x'' con un número independiente (ej: creer que $3x + 2 = 5x$). ¡Grave
  error algebraico!'
- 'Olvidar los signos al agrupar (ej: $4x - 5x$ ponerlo como $x$ positivo en vez de
  $-x$).'
- Transposición de miembros.
- Racionalización.
- Factorización por agrupación.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_poder: Resolver ecuaciones y sistemas lineales aplicando resolución
  con reducción de términos semejantes.
