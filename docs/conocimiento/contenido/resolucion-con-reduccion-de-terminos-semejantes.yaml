semantic_id: MAT.ALG.RESOLUCION_LINEAL.REDUCCION_TERMINOS_SEMEJANTES
resumen_inicial: 'Resolución con reducción de términos semejantes: propiedades, resolución
  y modelamiento en Resolución de ecuaciones lineales.'
explicacion_simple: Una ecuación puede parecer intimidante si tiene las 'x' y los
  números esparcidos por todas partes, como juguetes tirados en el suelo. El primer
  paso siempre es ordenar y juntar los juguetes que son iguales.
explicacion_formal: '### Definición formal


  Términos semejantes son aquellos con idéntica parte literal. Reducirlos es sumarlos/restarlos.


  ### Desarrollo didáctico


  Piensa en las ''x'' como manzanas y los números sueltos como monedas. No puedes
  sumar manzanas con monedas.


  Ejemplo: $4x + 2 + 3x - 5 = 11$


  Si miras el lado izquierdo, es un desorden. No empieces a despejar aún. Primero,
  ordena la casa.


  1. **Agrupa las manzanas (términos con x):** $4x + 3x = 7x$.

  2. **Agrupa las monedas (números):** $+2 - 5 = -3$.


  Reescribe la ecuación limpia: $7x - 3 = 11$.


  Ahora sí, puedes despejar:

  - Pasas el $-3$ sumando: $7x = 11 + 3 \rightarrow 7x = 14$.

  - Pasas el $7$ dividiendo: $x = \frac{14}{7} \rightarrow x = 2$.


  Reducir términos semejantes es como ''barrer'' la ecuación para que quede en su
  versión más simple.'
definiciones_clave: '- **Resolución con reducción de términos semejantes**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a resolución con reducción de términos semejantes.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando resolución con
    reducción de términos semejantes.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de resolución con reducción
    de términos semejantes.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
