semantic_id: MAT.ALG.RESOLUCION_LINEAL.REDUCCION_TERMINOS_SEMEJANTES
resumen_inicial: Reducir términos semejantes en cada miembro antes de trasponer simplifica
  el despeje de la ecuación lineal.
explicacion_simple: 'Si una ecuación tiene varias $x$ o varios números sueltos en
  el mismo lado del igual, no es conveniente empezar a moverlos de un lado a otro
  inmediatamente.

  Primero debemos simplificar cada miembro por separado agrupando y sumando los términos
  semejantes.

  Una vez que cada lado tenga solo una $x$ y un número, la ecuación estará lista para
  despejarse con la regla de transposición.'
explicacion_formal: 'Dada una ecuación con múltiples términos semejantes en un mismo
  miembro $a_1 x + a_2 x + b_1 + b_2 = c$, la **reducción previa** establece:


  $$(a_1 + a_2)x + (b_1 + b_2) = c \implies A x + B = c$$


  **Desglose de la fórmula:**

  - $A = a_1 + a_2$: Suma algebraica de los coeficientes de los términos con incógnita.

  - $B = b_1 + b_2$: Suma algebraica de las constantes independientes en el miembro.'
definiciones_clave: '- **Reducción de términos semejantes**: Agrupación por suma o
  resta de coeficientes de términos que comparten la misma variable.

  - **Simplificación miembro a miembro**: Proceso de ordenamiento antes de trasponer
  términos.'
propiedades_relaciones: '- **Propiedad distributiva invertida**: $a_1 x + a_2 x =
  (a_1 + a_2)x$.

  - **Economía de pasos**: Evita trasponer 4 o 5 términos de manera individual.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación $5x + 3x - 4 + 2 = 26$ reduciendo previamente los
    términos semejantes en el primer miembro y evalúa la solución.
  pasos:
  - 'Paso 1: Agrupar los términos con la incógnita en el primer miembro: $5x + 3x
    = 8x$.Paso 2: Agrupar los términos independientes en el primer miembro: $-4 +
    2 = -2$.Paso 3: Escribir la ecuación reducida: $8x - 2 = 26$.Paso 4: Trasponer
    $-2$ sumando al segundo miembro: $8x = 26 + 2 = 28$.Paso 5: Trasponer $8$ dividiendo:
    $x = \frac{28}{8} = \frac{7}{2} = 3{,}5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación equivalente reducida en el primer miembro para $5x
    + 3x - 4 + 2 = 26$?
  choices:
  - text: $8x - 2 = 26$
    is_correct: true
  - text: $15x - 8 = 26$
    is_correct: false
  - text: $8x + 2 = 26$
    is_correct: false
  - text: $2x - 2 = 26$
    is_correct: false
  explanation: La alternativa correcta es '$8x - 2 = 26$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver la ecuación reducida $8x - 2 = 26$, ¿cuál es el valor de $x$
    simplificado?
  choices:
  - text: $x = \frac{7}{2}$
    is_correct: true
  - text: $x = 7$
    is_correct: false
  - text: $x = 3$
    is_correct: false
  - text: $x = \frac{28}{6}$
    is_correct: false
  explanation: La alternativa correcta es '$x = \frac{7}{2}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los términos semejantes que están en el mismo miembro.'
- 'Paso 2: Sumar o restar los coeficientes de los términos que tienen la variable
  $x$.'
- 'Paso 3: Sumar o restar los términos numéricos independientes en ese miembro.'
- 'Paso 4: Repetir el proceso en el otro miembro si fuera necesario.'
- 'Paso 5: Trasponer los términos de la ecuación simplificada resultante.'
errores_correccion: '- **Error común:** Cambiar los signos de los términos semejantes
  al sumarlos en el MISMO miembro.

  - **Cómo corregirlo:** Los signos solo se cambian cuando cruzan la barra del igual
  ($=$) a otro miembro. Si están en el mismo lado, se suman o restan manteniendo sus
  signos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de transposición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de transposición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un término que suma pasa restando al otro miembro?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de transposición de términos.
- titulo: ¿Un coeficiente multiplicativo cambia de signo al pasar dividiendo?
  respuesta: 'No'
  solucion_pasos:
  - No, la división conserva el signo del número que divide.
errores_frecuentes:
- Trasponer un término sumando sin invertir su signo al pasar al otro miembro.
- Cambiar el signo de un coeficiente multiplicativo al trasponerlo dividiendo.
- Multiplicar solo el primer término del paréntesis al aplicar la propiedad distributiva.
- Olvidar cambiar el signo del segundo término al eliminar un paréntesis precedido
  por signo negativo.
- Sumar términos semejantes en el mismo miembro cambiando sus signos como si hubieran
  cruzado el igual.
afirmaciones_verdaderas:
- La transposición de términos traslada sumandos aplicando la operación inversa (opuesto
  aditivo).
- La verificación de una ecuación sustituye el valor obtenido en la ecuación original
  para confirmar la igualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver ecuaciones lineales
  aplicando transposición de términos, paréntesis y verificación de soluciones.
