semantic_id: MAT.ALG.RESOLUCION_LINEAL.REDUCCION_TERMINOS_SEMEJANTES
resumen_inicial: Reducir términos semejantes en cada miembro antes de trasponer simplifica y optimiza el proceso de resolución
  de ecuaciones lineales.
explicacion_simple: 'Si una ecuación presenta múltiples términos con la incógnita $x$ o varias constantes en un mismo miembro,
  resulta más eficiente agruparlos antes de transponer.


  Primero simplificamos cada miembro de forma independiente agrupando y operando entre sí sus términos semejantes.


  Una vez reducidos los miembros a su forma canónica ($Ax + B = C$), se aplican las reglas de transposición para despejar
  la incógnita de forma directa.


  ![Reducción de términos semejantes](/static/img/nodos/resolucion-con-reduccion-de-terminos-semejantes-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada una ecuación que contiene múltiples sumandos en un mismo miembro $a_1 x + a_2 x + b_1 + b_2 = c$, el principio de **reducción
  previa** establece:


  $$(a_1 + a_2)x + (b_1 + b_2) = c \implies A x + B = c$$


  ### Desglose de la fórmula

  - $A = a_1 + a_2$: Suma algebraica de los coeficientes de los términos con la variable.

  - $B = b_1 + b_2$: Suma algebraica de las constantes independientes en dicho miembro.


  ### Síntesis didáctica

  La reducción interna en un mismo miembro se fundamenta en la propiedad distributiva $a_1 x + a_2 x = (a_1 + a_2)x$ y no
  requiere cambiar el signo de los sumandos.

  '
definiciones_clave: '- **Reducción de términos semejantes**: Agrupación por suma o resta de coeficientes de términos que comparten
  exactamente la misma parte literal.

  - **Simplificación miembro a miembro**: Agrupación previa de sumandos en un mismo lado de la igualdad antes de trasponer.

  '
propiedades_relaciones: '- **Invarianza de miembros**: Operar sumandos dentro del mismo miembro preserva exactamente sus signos
  algebraicos.

  - **Eficiencia procedimental**: Reduce sustancialmente la probabilidad de cometer omisiones en comparativa a trasponer término
  por término.

  '
ejemplo_guiado:
  enunciado: Resuelve la ecuación $5x + 3x - 4 + 2 = 26$ reduciendo previamente los términos semejantes en el primer miembro
    y evalúa la solución.
  pasos:
  - 'Paso 1: Reducir los términos con la incógnita en el primer miembro: $5x + 3x = 8x$.'
  - 'Paso 2: Reducir las constantes independientes en el primer miembro: $-4 + 2 = -2$.'
  - 'Paso 3: Escribir la ecuación reducida: $8x - 2 = 26$.'
  - 'Paso 4: Trasponer $-2$ sumando al segundo miembro: $8x = 26 + 2 = 28$.'
  - 'Paso 5: Trasponer $8$ dividiendo y simplificar la fracción: $x = \frac{28}{8} = \frac{7}{2} = 3,5$.'
  imagen: /static/img/nodos/resolucion-con-reduccion-de-terminos-semejantes-ejemplos.svg
