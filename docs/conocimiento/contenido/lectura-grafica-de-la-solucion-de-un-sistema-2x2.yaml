semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SOLUCION_GRAFICA
resumen_inicial: La lectura gráfica determina las coordenadas del punto de corte trazando
  o inspeccionando las rectas en el plano cartesiano.
explicacion_simple: 'Cuando nos presentan un gráfico con dos rectas dibujadas en el
  plano cartesiano, podemos leer la solución del sistema de forma visual.

  Buscamos el punto donde las dos líneas se cruzan.

  Desde ese punto de cruce, bajamos verticalmente hasta el eje horizontal para leer
  el valor de $x$, y nos movemos horizontalmente hacia el eje vertical para leer el
  valor de $y$.'
explicacion_formal: 'Dadas las gráficas cartesianas de las rectas $L_1$ y $L_2$, el
  **procedimiento de lectura gráfica** proyecta la coordenada proyectiva:


  $$(x_0, y_0) = (\pi_x(P), \pi_y(P)) \quad \text{donde } P = L_1 \cap L_2$$


  **Desglose de la fórmula:**

  - $\pi_x(P)$: Proyección ortogonal del punto de corte $P$ sobre el eje de las abscisas
  $x$.

  - $\pi_y(P)$: Proyección ortogonal del punto de corte $P$ sobre el eje de las ordenadas
  $y$.'
definiciones_clave: '- **Lectura gráfica de solución**: Extracción de los valores
  numéricos de $(x, y)$ a partir de la inspección de la gráfica cartesiana.

  - **Proyección ortogonal**: Trazado de líneas perpendiculares desde el punto hacia
  los ejes coordenados.'
propiedades_relaciones: '- **Verificación algebraica post-lectura**: Es recomendable
  reemplazar los valores leídos $(x_0, y_0)$ en las ecuaciones para confirmar la precisión
  del gráfico.'
ejemplo_guiado:
  enunciado: Si dos rectas en el plano cartesiano se cruzan en un punto ubicado $3$
    unidades a la derecha del origen y $5$ unidades hacia arriba, determina las coordenadas
    de la solución $(x, y)$ y confírmalas para el sistema $\begin{cases} x + y = 8
    \\ 2x - y = 1 \end{cases}$.
  pasos:
  - 'Paso 1: Leer la coordenada $x$ sobre el eje horizontal: $x = 3$.Paso 2: Leer
    la coordenada $y$ sobre el eje vertical: $y = 5$.Paso 3: Escribir el par ordenado
    solución: $(x, y) = (3, 5)$.Paso 4: Verificar en la primera ecuación: $3 + 5 =
    8$ ($8 = 8$).Paso 5: Verificar en la segunda ecuación: $2(3) - 5 = 6 - 5 = 1$
    ($1 = 1$).'
checkpoints:
- placement: after_explicacion_formal
  question: Si el punto de intersección entre dos rectas en el plano se ubica en 3
    unidades sobre el eje $x$ y 5 sobre el eje $y$, ¿cuál es el par solución?
  choices:
  - text: $(3, 5)$
    is_correct: true
  - text: $(5, 3)$
    is_correct: false
  - text: $(-3, -5)$
    is_correct: false
  - text: $(8, 1)$
    is_correct: false
  explanation: La alternativa correcta es '$(3, 5)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comprobar la lectura gráfica $(3, 5)$ en la ecuación $2x - y = 1$,
    ¿cuál es el resultado obtenido?
  choices:
  - text: $1$
    is_correct: true
  - text: $8$
    is_correct: false
  - text: $5$
    is_correct: false
  - text: $6$
    is_correct: false
  explanation: La alternativa correcta es '$1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar visualmente el punto de corte $P$ entre las dos rectas dibujadas.'
- 'Paso 2: Trazar una línea punteada vertical hasta tocar el eje $x$ para leer el
  primer número $x_0$.'
- 'Paso 3: Trazar una línea punteada horizontal hasta tocar el eje $y$ para leer el
  segundo número $y_0$.'
- 'Paso 4: Anotar el par ordenado $(x_0, y_0)$.'
errores_correccion: '- **Error común:** Escribir las coordenadas al revés (confundir
  $x$ por $y$ dando $(y_0, x_0)$).

  - **Cómo corregirlo:** El primer número del par ordenado SIEMPRE corresponde al
  eje horizontal $x$ y el segundo al eje vertical $y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de clasificación.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de clasificación.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un sistema con solución única se representa por dos rectas secantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, se cortan en un único punto del plano.
- titulo: ¿Dos rectas paralelas representan un sistema sin solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, al no tener puntos en común no existe solución.
errores_frecuentes:
- Confundir las condiciones de proporcionalidad para solución única y sin solución.
- Asumir que la lectura gráfica sustituye la comprobación algebraica en las ecuaciones.
- Olvidar incluir el término constante al evaluar la condición de infinitas soluciones.
- Invertir los ejes $x$ e $y$ al leer las coordenadas de intersección del gráfico.
- Confundir la igualdad de pendientes con la coincidencia total de las rectas.
afirmaciones_verdaderas:
- Un sistema 2x2 es compatible determinado si las rectas asociadas tienen pendientes
  distintas y se cortan en un único punto.
- Si las razones de los coeficientes de $x$ e $y$ son iguales pero distintas a la
  razón de las constantes, el sistema es incompatible.
al_terminar_debes_poder: Al finalizar este recurso podrás clasificar sistemas 2x2
  e interpretar sus soluciones desde la perspectiva geométrica y paramétrica.
