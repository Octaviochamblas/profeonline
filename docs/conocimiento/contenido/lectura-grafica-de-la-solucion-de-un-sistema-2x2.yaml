resumen_inicial: 'Lectura gráfica de la solución de un sistema 2x2: propiedades, resolución
  y modelamiento en Representación y clasificación de sistemas 2x2.'
explicacion_simple: Visualmente, esto no es más que **el punto de intersección (la
  intersección)** entre las dos rectas.
explicacion_formal: '### Definición formal


  El par ordenado $(x_0,y_0)$ es solución de un sistema de dos ecuaciones lineales
  si y solo si pertenece simultáneamente a ambas rectas, es decir, satisface las dos
  ecuaciones a la vez; geométricamente, corresponde al punto de intersección de las
  rectas.


  ### Desarrollo didáctico


  Visualmente, esto no es más que **el punto de intersección (la intersección)** entre
  las dos rectas.

  El par ordenado $(x,y)$ que tanto te esforzaste en calcular algebraicamente usando
  Reducción o Sustitución, son exactamente las coordenadas espaciales donde las dos
  líneas se cruzan en tu dibujo.

  Es la fusión perfecta entre el álgebra y la geometría.'
definiciones_clave: '- **Lectura gráfica de la solución de un sistema 2x2**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a lectura gráfica de la solución de un sistema
  2x2.'
