semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SOLUCION_GRAFICA
resumen_inicial: La lectura gráfica determina las coordenadas del par solución $(x, y)$ identificando el punto de intersección de las rectas trazadas en el plano cartesiano.
explicacion_simple: '![Lectura gráfica de la solución de un sistema 2x2](/static/img/nodos/lectura-grafica-de-la-solucion-de-un-sistema-2x2-intro.svg)


  Cuando se presenta un gráfico cartesiano con dos rectas dibujadas, es posible determinar visualmente la solución del sistema $2 \times 2$.


  Buscamos el punto exacto $P$ en donde las dos líneas rectas se cruzan o intersectan.


  Desde ese punto de cruce, proyectamos una línea vertical hacia el eje horizontal para leer la coordenada $x$, y proyectamos una línea horizontal hacia el eje vertical para leer la coordenada $y$.'
explicacion_formal: '### Definición formal

  Dadas las representaciones gráficas en el plano cartesiano de las rectas $L_1$ y $L_2$, el **procedimiento de lectura gráfica** obtiene las componentes proyectivas:


  $$(x_0, y_0) = (\pi_x(P), \pi_y(P)) \quad \text{donde } P = L_1 \cap L_2$$


  ### Desglose de la fórmula

  - $\pi_x(P)$: Proyección ortogonal del punto de cruce $P$ sobre el eje de las abscisas $x$.

  - $\pi_y(P)$: Proyección ortogonal del punto de cruce $P$ sobre el eje de las ordenadas $y$.


  ### Síntesis didáctica

  La precisión visual debe ratificarse evaluando las coordenadas leídas en las dos ecuaciones algebraicas del sistema.

  '
definiciones_clave: '- **Lectura gráfica de solución**: Determinación cuantitativa de $(x_0, y_0)$ mediante la proyección de los ejes cartesianos desde el punto de cruce.

  - **Proyección ortogonal**: Trazo perpendicular lanzado desde un punto del plano hacia los ejes de abscisas u ordenadas.

  '
propiedades_relaciones: '- **Verificación algebraica complementaria**: Es conveniente sustituir la pareja ordenada leída $(x_0, y_0)$ en el sistema para confirmar la exactitud del gráfico.

  - **Identificación de escalas**: La precisión de la lectura depende directamente del valor numérico asignado a cada cuadrícula o división del plano.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Lectura gráfica de la solución de un sistema 2x2](/static/img/nodos/lectura-grafica-de-la-solucion-de-un-sistema-2x2-ejemplos.svg)


    Si dos rectas se cruzan en un punto ubicado a 3 unidades a la derecha del origen sobre el eje horizontal y a 5 unidades hacia arriba sobre el eje vertical, determina la solución $(x, y)$ y confírmala en el sistema $\begin{cases} x + y = 8 \\ 2x - y = 1 \end{cases}$.'
  pasos:
  - 'Paso 1: Proyectar ortogonalmente sobre el eje horizontal para leer $x = 3$.'
  - 'Paso 2: Proyectar ortogonalmente sobre el eje vertical para leer $y = 5$.'
  - 'Paso 3: Estructurar el par ordenado solución: $(x, y) = (3, 5)$.'
  - 'Paso 4: Comprobar en Ecuación 1: $3 + 5 = 8$, lo que satisface la primera igualdad ($8 = 8$).'
  - 'Paso 5: Comprobar en Ecuación 2: $2(3) - 5 = 6 - 5 = 1$, satisfaciendo la segunda igualdad ($1 = 1$).'
  - 'Paso 6: Concluir que el par $(3, 5)$ es la solución correcta del sistema.'
checkpoints:
- placement: after_explicacion_formal
  question: Si el punto de intersección $P$ entre dos rectas se proyecta en $3$ sobre el eje de abscisas y en $5$ sobre el eje de ordenadas, ¿cuál es el par solución?
  choices:
  - text: $(3, 5)$
    is_correct: true
  - text: $(5, 3)$
    is_correct: false
  - text: $(-3, -5)$
    is_correct: false
  - text: $(8, 1)$
    is_correct: false
  explanation: La alternativa correcta es '$(3, 5)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar el par leído $(3, 5)$ en el primer miembro de la ecuación $2x - y$, ¿qué valor numérico se obtiene?
  choices:
  - text: $1$
    is_correct: true
  - text: $8$
    is_correct: false
  - text: $5$
    is_correct: false
  - text: $6$
    is_correct: false
  explanation: La alternativa correcta es '$1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar visualmente el punto de corte $P$ donde se cruzan las dos rectas del plano.'
- 'Paso 2: Trazar una perpendicular imaginaria desde $P$ hacia el eje $x$ y leer la primera coordenada $x_0$.'
- 'Paso 3: Trazar una perpendicular imaginaria desde $P$ hacia el eje $y$ y leer la segunda coordenada $y_0$.'
- 'Paso 4: Escribir el par ordenado solución $(x_0, y_0)$.'
- 'Paso 5: Sustituir $(x_0, y_0)$ en las ecuaciones del sistema para confirmar numéricamente la lectura.'
errores_correccion: '- **Error 1:** Escribir las coordenadas en orden invertido (confundir el valor del eje vertical $y$ con el eje horizontal $x$ anotando $(y_0, x_0)$). **Cómo corregirlo:** La primera componente de un par ordenado **DEBE SER SIEMPRE LA LECTURA DEL EJE HORIZONTAL $x$ Y LA SEGUNDA LA DEL EJE VERTICAL $y$ (ESCRIBIR $(x_0, y_0)$)**.

  - **Error 2:** Asumir que la lectura aproximada en un gráfico impreciso sustituye a la verificación matemática. **Cómo corregirlo:** Toda lectura visual en un plano cartesiano **DEBE SER REMPLAZADA EN LAS ECUACIONES ORIGINALES PARA CONFIRMAR LA EXACTITUD DE LA SOLUCIÓN**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al observar dos rectas cruzándose sobre el eje de abscisas en el punto $(4, 0)$, ¿cuál es la solución del sistema?
  alternativas:
  - $(4, 0)$
  - $(0, 4)$
  - $(4, 4)$
  respuesta: $(4, 0)$
  solucion_pasos:
  - 1. La componente horizontal es $x = 4$.
  - '2. La componente vertical es $y = 0$. Solución: $(4, 0)$.'
- titulo: Ejemplo 2
  enunciado: Si el punto de cruce está en el tercer cuadrante a $-2$ unidades en $x$ y $-3$ unidades en $y$, ¿cuál es la solución?
  alternativas:
  - $(-2, -3)$
  - $(2, 3)$
  - $(-3, -2)$
  respuesta: $(-2, -3)$
  solucion_pasos:
  - 1. Proyección $x = -2$.
  - '2. Proyección $y = -3$. Solución: $(-2, -3)$.'
- titulo: Proyección sobre el eje horizontal
  enunciado: ¿La primera coordenada de la lectura gráfica se obtiene proyectando hacia el eje de las abscisas $x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de par ordenado $(x, y)$.
- titulo: Verificación en ambas ecuaciones
  enunciado: ¿La comprobación de la lectura gráfica debe satisfacer las dos ecuaciones del sistema?
  respuesta: Sí
  solucion_pasos:
  - Sí, para certificar que el punto pertenece a ambas rectas.
errores_frecuentes:
- Al realizar la lectura gráfica del punto de corte $P(3, 5)$, se anotan las coordenadas en orden invertido como $(5, 3)$.
- La lectura gráfica de las coordenadas de intersección prescinde de la verificación por sustitución en las ecuaciones del sistema inicial.
- Al proyectar un punto de cruce situado en el tercer cuadrante del plano, se omiten los signos negativos declarando $(2, 3)$ en vez de $(-2, -3)$.
- Una lectura visual imprecisa en el plano cartesiano sustituye la comprobación aritmética del par ordenado en ambas ecuaciones.
- El punto de corte de una recta con el eje de abscisas se confunde con la solución simultánea del sistema $2 \times 2$.
afirmaciones_verdaderas:
- La lectura gráfica de un sistema 2x2 consiste en determinar las proyecciones del punto de corte sobre los ejes $x$ e $y$.
- Un par ordenado leíles en la gráfica es solución del sistema si y solo si al sustituirlo satisface ambas ecuaciones lineales.
al_terminar_debes_poder: '**QUÉ:** Determinar las coordenadas solución de un sistema 2x2 mediante lectura gráfica.


  **CÓMO:** Localizando visualmente el punto de corte $P(x_0, y_0)$ entre las dos rectas y proyectándolo perpendicularmente a los ejes $X$ e $Y$.


  ![Resumen Lectura gráfica de la solución de un sistema 2x2](/static/img/nodos/lectura-grafica-de-la-solucion-de-un-sistema-2x2-resumen.svg)'
