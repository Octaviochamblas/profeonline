errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Grafica la primera recta».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Grafica la segunda
  recta en el mismo plano».'
- 'La definición sigue cumpliéndose aunque no se considere que si cada ecuación es
  una línea recta llena de puntos-solución, entonces resolver el sistema significa:
  ''Busca el único punto que pertenezca a ambas líneas al mismo tiempo''.'
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Lee las
  coordenadas (x,y) de ese punto. Esa es la solución de tu sistema».
- La comprobación del resultado vuelve innecesaria la condición «Grafica la primera
  recta».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
