semantic_id: MAT.GEO.AREAS_TRIANGULOS.DEFINICION
resumen_inicial: 'Definición de área como medida de la superficie encerrada por una
  figura plana: conceptos, teoremas, propiedades geométricas y cálculo en Perímetros,
  Áreas y Teoremas.'
explicacion_simple: 'Mientras el perímetro mide el contorno de una figura, el área
  mide una cosa completamente distinta: cuánta superficie plana queda encerrada dentro
  de ese contorno.'
explicacion_formal: '![Área como superficie encerrada](/static/img/geometria/areas-pitagoras/areas-triangulos-definicion.svg)


  ### Definición formal


  El área de una figura plana es la cantidad de unidades cuadradas necesarias para
  cubrir por completo la superficie que encierra su contorno.


  ### Desarrollo didáctico


  Un triángulo y un rectángulo pueden tener el mismo perímetro (misma longitud de
  contorno) pero áreas muy distintas (distinta cantidad de superficie interior); son
  dos magnitudes independientes.'
definiciones_clave: '- **Definición de área como medida de la superficie encerrada
  por una figura plana**: Elemento o propiedad fundamental en el estudio de perímetros,
  áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a definición de área como medida de la superficie
  encerrada por una figura plana.'
ejemplo_guiado:
  enunciado: Para analizar definición de área como medida de la superficie encerrada
    por una figura plana, considera un ángulo $\alpha = 138^\circ$ ubicado en la posición
    dada. Determina el valor de la medida asociada sabiendo que $x + 1001^\circ =
    138^\circ$.
  pasos:
  - Identificar la propiedad de definición de área como medida de la superficie encerrada
    por una figura plana referida a $\alpha = 138^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1001 = 138 \implies x = 138 - 1001$.'
  - Concluir que la medida calculada para definición de área como medida de la superficie
    encerrada por una figura plana es $x = -863^\circ$.
