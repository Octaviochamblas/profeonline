semantic_id: MAT.ALG.INTERVALOS.INTERVALO_ABIERTO
resumen_inicial: 'Notación de intervalo abierto: relaciones de orden, intervalos y
  resolución en Intervalos reales y su representación.'
explicacion_simple: Un intervalo abierto comprende todos los números reales estrictamente
  entre dos valores dados.
explicacion_formal: '### Definición formal

  El intervalo abierto se define como $(a, b) = \{ x \in \mathbb{R} \mid a < x < b
  \}$.


  ### Desarrollo didáctico

  Al representar gráficamente, utilizamos círculos sin rellenar en los extremos para
  indicar que esos puntos exactos no forman parte del conjunto.'
definiciones_clave: '- **Notación de intervalo abierto**: Concepto fundamental de
  relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a notación de intervalo abierto.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de notación de intervalo
    abierto.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de notación de intervalo abierto, invirtiendo
    el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla de oro al multiplicar o dividir una desigualdad por
    un número negativo en notación de intervalo abierto?
  choices:
  - text: Invertir el sentido de la desigualdad al multiplicar o dividir por un número
      negativo en intervalos reales y su representación
    is_correct: true
  - text: Mantener el mismo sentido de la desigualdad sin cambios
    is_correct: false
  - text: Cambiar la variable por cero
    is_correct: false
  - text: Transformar la inecuación en una igualdad exacta
    is_correct: false
  explanation: 'La alternativa correcta es: Invertir el sentido de la desigualdad
    al multiplicar o dividir por un número negativo en intervalos reales y su representación.
    Es la propiedad fundamental de orden en notación de intervalo abierto.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver una inecuación y obtener su conjunto solución en notación
    de intervalo abierto, ¿cómo se debe expresar el resultado?
  choices:
  - text: Representar el conjunto solución mediante notación de intervalo o gráficamente
      en la recta real
    is_correct: true
  - text: Como un único número aislado obligatoriamente
    is_correct: false
  - text: Igualando la variable a la constante
    is_correct: false
  - text: Eliminando los símbolos de desigualdad del resultado
    is_correct: false
  explanation: 'La alternativa correcta es: Representar el conjunto solución mediante
    notación de intervalo o gráficamente en la recta real. Forma estándar de representar
    conjuntos soluciones de inecuaciones.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Identificar los límites inferior y superior, $a$ y $b$.
- Escribir el conjunto como $(a, b)$ o $]a, b[$.
- Trazar la gráfica utilizando puntos sin colorear en $a$ y $b$.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en notación de intervalo abierto.
ejemplos:
- titulo: Análisis en un escenario práctico
  enunciado: Considera el contexto de MAT.ALG.INTERVALOS.INTERVALO_ABIERTO. Determina
    las implicancias.
  solucion_pasos:
  - Establecer los límites.
  - Analizar el tipo de extremo.
  - Concluir.
- titulo: Evaluación de condición general
  enunciado: Dada la estructura del conjunto para MAT.ALG.INTERVALOS.INTERVALO_ABIERTO,
    plantea la desigualdad.
  solucion_pasos:
  - Identificar la variable.
  - Aplicar la definición.
  - Escribir el intervalo.
- titulo: ¿Es cierto que todos los elementos de un conjunto finito pueden formar un
    intervalo denso?
  respuesta: 'No'
  solucion_pasos:
  - Recordar la definición de intervalo en $\mathbb{R}$.
  - Concluir que un conjunto finito no contiene todos los números reales entre dos
    puntos.
- titulo: ¿El uso de MAT.ALG.INTERVALOS.INTERVALO_ABIERTO es adecuado para expresar
    desigualdades lineales simples?
  respuesta: Sí
  solucion_pasos:
  - Analizar el resultado de una desigualdad simple.
  - Verificar que su conjunto solución puede representarse como intervalo.
errores_frecuentes:
- El intervalo abierto incluye al extremo inferior.
- El intervalo abierto $(2, 5)$ contiene exactamente 2 números.
- Se usan corchetes apuntando hacia el interior para denotar intervalos abiertos.
- Un intervalo abierto no puede tener un extremo negativo.
- Un intervalo abierto solo puede definirse entre números racionales.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  notación de intervalo abierto.
