semantic_id: MAT.ALG.INTERVALOS.INTERVALO_ABIERTO
resumen_inicial: Un intervalo abierto excluye estrictamente a sus dos extremos y se denota entre paréntesis $]a, b[$ o $(a, b)$.
explicacion_simple: '![Notación de intervalo abierto](/static/img/nodos/notacion-de-intervalo-abierto-intro.svg)


  Un **intervalo abierto** comprende a todos los números reales que están entre $a$ y $b$, pero **NO INCLUYE** a los propios bordes $a$ ni $b$.


  En Chile se utiliza habitualmente la notación de corchetes invertidos $]a, b[$ (o paréntesis redondeados $(a, b)$).


  Se relaciona directamente con desigualdades estrictas del tipo $a < x < b$.'
explicacion_formal: 'El **intervalo abierto** $]a, b[$ sobre $\mathbb{R}$ con $a < b$ se define formalmente mediante compresión como:


  $$]a, b[ \ = (a, b) = \{x \in \mathbb{R} \mid a < x < b\}$$


  **Desglose de la fórmula:**

  - $]a$ y $b[$: Corchetes dados vuelta hacia afuera que simbolizan que los bordes $a$ y $b$ no pertenecen al conjunto.

  '
definiciones_clave: '- **Intervalo abierto $]a, b[$**: Subconjunto real que excluye sus dos extremos $a \notin ]a, b[$ y $b \notin ]a, b[$.

  - **Corchete abierto / invertido ($]$ ó $[$)**: Símbolo gráfico que indica exclusión estricta del valor límite.

  '
propiedades_relaciones: '- **Desigualdad estricta asociada**: Se corresponde con $a < x < b$ (sin el signo igual).

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Notación de intervalo abierto](/static/img/nodos/notacion-de-intervalo-abierto-ejemplos.svg)


    Expresa en notación de intervalo abierto la desigualdad $3 < x < 8$, y verifica si $x = 3$ y $x = 4$ pertenecen al conjunto.'
  pasos:
  - 'Paso 1: Identificar los extremos $a = 3$ y $b = 8$.'
  - 'Paso 2: Escribir la notación de intervalo abierto: $]3, 8[$.'
  - 'Paso 3: Comprobar el extremo $x = 3$: por ser abierto, $3 \notin ]3, 8[$.'
  - 'Paso 4: Comprobar $x = 4$: por estar comprendido entre $3$ y $8$, $4 \in ]3, 8[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se representa en notación de intervalo abierto el conjunto $\{x \in \mathbb{R} \mid 3 < x < 8\}$?
  choices:
  - text: $]3, 8[$
    is_correct: true
  - text: $[3, 8]$
    is_correct: false
  - text: $[3, 8[$
    is_correct: false
  - text: $]3, 8]$
    is_correct: false
  explanation: La alternativa correcta es '$]3, 8[$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el intervalo abierto $]3, 8[$, ¿pertenece el extremo $x = 3$ al conjunto?
  choices:
  - text: No, porque el intervalo abierto excluye a sus extremos.
    is_correct: true
  - text: Sí, porque es el límite inferior.
    is_correct: false
  - text: Sí, todos los enteros pertenecen.
    is_correct: false
  - text: Depende de si $x$ es positivo.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque el intervalo abierto excluye a sus extremos.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar los extremos $a$ y $b$ con $a < b$.'
- 'Paso 2: Escribir el corchete izquierdo invertido hacia afuera $]$.'
- 'Paso 3: Escribir los números separados por coma o punto y coma ($a, b$).'
- 'Paso 4: Escribir el corchete derecho invertido hacia afuera $[$ para cerrar el intervalo $]a, b[$.'
errores_correccion: '- **Error común:** Escribir $[3, 8]$ con corchetes normales para una desigualdad estricta $3 < x < 8$.

  - **Cómo corregirlo:** Los corchetes normales $[ ]$ significan INCLUIDO. Para EXCLUIDO debes darlos vuelta $] [$.

  '
ejemplos:
- titulo: 'Ejemplo 1: Identificación de intervalo abierto'
  enunciado: ¿Cuál es la notación de intervalo abierto para la desigualdad $-2 < x < 5$?
  alternativas:
  - $]-2, 5[$
  - $[-2, 5]$
  - $[-2, 5[$
  - $]-2, 5]$
  respuesta: $]-2, 5[$
  solucion_pasos:
  - 'Paso 1: La desigualdad es estricta en ambos extremos ($-2 < x$ y $x < 5$).'
  - 'Paso 2: Ambos límites llevan corchetes hacia afuera: $]-2, 5[$.'
- titulo: 'Ejemplo 2: Pertenencia de extremos'
  enunciado: En el intervalo $]1, 9[$, ¿pertenece el número $1$ al conjunto?
  alternativas:
  - No, porque el corchete abierto excluye el borde
  - Sí, porque es el límite inferior
  - Sí, todo número entero pertenece
  - Depende del signo de la variable
  respuesta: No, porque el corchete abierto excluye el borde
  solucion_pasos:
  - 'Paso 1: Por definición de intervalo abierto, $a \notin ]a, b[$.'
  - 'Paso 2: Por lo tanto, $1 \notin ]1, 9[$.'
- titulo: 'Ejemplo 3: Elemento interior'
  enunciado: ¿Pertenece el número decimal $3,14$ al intervalo abierto $]3, 4[$?
  alternativas:
  - Sí, porque $3 < 3,14 < 4$
  - No, los intervalos solo contienen enteros
  - No, supera el límite superior
  - Depende de la aproximación
  respuesta: Sí, porque $3 < 3,14 < 4$
  solucion_pasos:
  - 'Paso 1: Como $3 < 3,14 < 4$, el número se ubica estrictamente entre los extremos.'
  - 'Paso 2: En consecuencia, $3,14 \in ]3, 4[$.'
- titulo: 'Ejemplo 4: Desigualdad equivalente'
  enunciado: ¿Qué desigualdad corresponde al intervalo abierto $]0, 10[$?
  alternativas:
  - $0 < x < 10$
  - $0 \leq x \leq 10$
  - $0 \leq x < 10$
  - $x > 10$
  respuesta: $0 < x < 10$
  solucion_pasos:
  - 'Paso 1: Los corchetes invertidos $]0$ y $10[$ representan desigualdades estrictas sin igualdad.'
  - 'Paso 2: La desigualdad correspondiente es $0 < x < 10$.'
errores_frecuentes:
- La notación de intervalo abierto para la desigualdad estricta $3 < x < 8$ se escribe con corchetes cerrados como $[3, 8]$.
- El intervalo abierto $]3, 8[$ admite al extremo inferior $x = 3$ como elemento de su conjunto.
- La desigualdad asociada al intervalo abierto $]a, b[$ incluye los signos no estrictos $a \le x \le b$.
- La notación $(a, b)$ representa un par ordenado en el plano cartesiano pero prohíbe su uso para intervalos reales abiertos.
- El intervalo abierto $]3, 8[$ carece de elementos decimales entre $3$ y $4$.
afirmaciones_verdaderas:
- Un intervalo abierto $]a, b[$ excluye a sus dos extremos $a$ y $b$ de su conjunto solución.
- La notación de intervalo abierto $]a, b[$ equivale formalmente a la desigualdad estricta doble $a < x < b$.
al_terminar_debes_poder: '**QUÉ:** Expresar e interpretar intervalos reales abiertos $]a, b[$ o $(a, b)$.


  **CÓMO:** Empleando corchetes invertidos hacia afuera para denotar la exclusión estricta de ambos extremos ($a < x < b$, donde $a, b \notin I$).


  ![Resumen Notación de intervalo abierto](/static/img/nodos/notacion-de-intervalo-abierto-resumen.svg)'
