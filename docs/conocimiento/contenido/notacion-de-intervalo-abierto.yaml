semantic_id: MAT.ALG.INTERVALOS.INTERVALO_ABIERTO
resumen_inicial: Un intervalo abierto excluye estrictamente a sus dos extremos y se
  denota entre paréntesis $]a, b[$ o $(a, b)$.
explicacion_simple: 'Un **intervalo abierto** comprende a todos los números reales
  que están entre $a$ y $b$, pero **NO INCLUYE** a los propios bordes $a$ ni $b$.

  En Chile se utiliza habitualmente la notación de corchetes invertidos $]a, b[$ (o
  paréntesis redondeados $(a, b)$).

  Se relaciona directamente con desigualdades estrictas del tipo $a < x < b$.'
explicacion_formal: 'El **intervalo abierto** $]a, b[$ sobre $\mathbb{R}$ con $a <
  b$ se define formalmente mediante compresión como:


  $$]a, b[ \ = (a, b) = \{x \in \mathbb{R} \mid a < x < b\}$$


  **Desglose de la fórmula:**

  - $]a$ y $b[$: Corchetes dados vuelta hacia afuera que simbolizan que los bordes
  $a$ y $b$ no pertenecen al conjunto.'
definiciones_clave: '- **Intervalo abierto $]a, b[$**: Subconjunto real que excluye
  sus dos extremos $a \notin ]a, b[$ y $b \notin ]a, b[$.

  - **Corchete abierto / invertido ($]$ ó $[$)**: Símbolo gráfico que indica exclusión
  estricta del valor límite.'
propiedades_relaciones: '- **Desigualdad estricta asociada**: Se corresponde con $a
  < x < b$ (sin el signo igual).'
ejemplo_guiado:
  enunciado: Expresa en notación de intervalo abierto la desigualdad $3 < x < 8$,
    y verifica si $x = 3$ y $x = 4$ pertenecen al conjunto.
  pasos:
  - 'Paso 1: Identificar los extremos $a = 3$ y $b = 8$.Paso 2: Escribir la notación
    de intervalo abierto: $]3, 8[$.Paso 3: Comprobar el extremo $x = 3$: por ser abierto,
    $3 \notin ]3, 8[$.Paso 4: Comprobar $x = 4$: por estar comprendido entre $3$ y
    $8$, $4 \in ]3, 8[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se representa en notación de intervalo abierto el conjunto $\{x
    \in \mathbb{R} \mid 3 < x < 8\}$?
  choices:
  - text: $]3, 8[$
    is_correct: true
  - text: $[3, 8]$
    is_correct: false
  - text: $[3, 8[$
    is_correct: false
  - text: $]3, 8]$
    is_correct: false
  explanation: La alternativa correcta es '$]3, 8[$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el intervalo abierto $]3, 8[$, ¿pertenece el extremo $x = 3$ al conjunto?
  choices:
  - text: No, porque el intervalo abierto excluye a sus extremos.
    is_correct: true
  - text: Sí, porque es el límite inferior.
    is_correct: false
  - text: Sí, todos los enteros pertenecen.
    is_correct: false
  - text: Depende de si $x$ es positivo.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque el intervalo abierto excluye
    a sus extremos.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar los extremos $a$ y $b$ con $a < b$.'
- 'Paso 2: Escribir el corchete izquierdo invertido hacia afuera $]$.'
- 'Paso 3: Escribir los números separados por coma o punto y coma ($a, b$).'
- 'Paso 4: Escribir el corchete derecho invertido hacia afuera $[$ para cerrar el
  intervalo $]a, b[$.'
errores_correccion: '- **Error común:** Escribir $[3, 8]$ con corchetes normales para
  una desigualdad estricta $3 < x < 8$.

  - **Cómo corregirlo:** Los corchetes normales $[ ]$ significan INCLUIDO. Para EXCLUIDO
  debes darlos vuelta $] [$'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
- Usar corchetes cerrados $[ ]$ para traducir desigualdades estrictas que no incluyen
  el signo igual.
- Colocar un corchete cerrado en los símbolos de infinito $+ \infty$ o $-\infty$.
- Escribir las fronteras del intervalo al revés colocando el número mayor a la izquierda.
- Creer que un intervalo real solo contiene a los números enteros de la zona.
- Olvidar sombrear la línea continua al dibujar la gráfica en la recta numérica.
afirmaciones_verdaderas:
- Un intervalo cerrado $[a, b]$ incluye a ambos extremos $a$ y $b$ dentro del conjunto
  de soluciones.
- El símbolo de infinito siempre lleva corchete abierto ya que representa una cota
  ilimitada no alcanzable.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, traducir y representar
  gráficamente intervalos reales abiertos, cerrados e infinitos.
