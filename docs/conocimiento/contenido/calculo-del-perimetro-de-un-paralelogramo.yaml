semantic_id: MAT.GEO.PARALELOGRAMOS.PERIMETRO
resumen_inicial: 'El perímetro de un paralelogramo es la suma de sus cuatro lados: P = 2a + 2b = 2(a + b).'
explicacion_simple: 'El perímetro es simplemente la distancia total que recorrerías si caminaras alrededor de todo el borde del paralelogramo. Como los lados opuestos son gemelos (miden lo mismo), no necesitas sumar los cuatro lados uno a uno.


  Basta con tomar la medida de un lado horizontal ($a$), sumarla con la medida del lado inclinado ($b$), y luego **multiplicar esa suma por 2**: **$P = 2(a + b)$**. ¡Así de simple!


  ![Cálculo del perímetro de un paralelogramo](/static/img/nodos/calculo-del-perimetro-de-un-paralelogramo-intro.svg)

  '
explicacion_formal: '### Definición métrica del perímetro

  Sea $\mathcal{ABCD}$ un paralelogramo con longitudes de lados contiguos $a, b \in \mathbb{R}^+$. Por el teorema de los lados opuestos congruentes, el conjunto de lados es $\{a, b, a, b\}$. La función perímetro $P$ es la suma del contorno lineal:

  $$P = a + b + a + b = 2a + 2b = 2(a + b)$$


  ### Propiedades y casos particulares

  1. **Semiperímetro ($p$):** La semisuma de los lados corresponde a $p = \frac{P}{2} = a + b$.

  2. **Caso cuadrado y rombo ($a = b = s$):**

  $$P = 2(s + s) = 2(2s) = 4s$$

  3. **Despeje de un lado conociendo el perímetro:**

  $$a = \frac{P}{2} - b \quad \wedge \quad b = \frac{P}{2} - a$$

  4. **Independencia angular:** El perímetro depende exclusivamente de las longitudes de los lados $a$ y $b$, siendo totalmente invariante respecto a los ángulos interiores o a la altura $h$.


  > **Complemento didáctico:** Una trampa típica en la PAES es dar la altura $h$ junto con la base $b$ y pedir el perímetro. ¡Cuidado! La altura $h$ se usa para el ÁREA, jamás para el perímetro. Para el perímetro necesitas la longitud del lado oblicuo exterior.

  '
definiciones_clave: '- **Perímetro ($P$)**: Longitud total del contorno cerrado que delimita una figura geométrica bidimensional.

  - **Semiperímetro ($p$)**: Mitad del perímetro total, equivalente a la suma de dos lados adyacentes ($p = a + b$).

  - **Lado oblicuo**: Lado lateral cuya medida de longitud exterior forma parte del perímetro.

  '
propiedades_relaciones: '- **Escalamiento lineal**: Si las dimensiones de los lados se multiplican por una constante $k > 0$, el nuevo perímetro se multiplica por $k$: $P'' = k \cdot P$.

  - **Desigualdad triangular en semidiagonales**: Las longitudes de los lados satisfacen $a < \frac{d_1 + d_2}{2}$ y $b < \frac{d_1 + d_2}{2}$.

  - **Teorema de Apolonio (Ley del paralelogramo):** $2a^2 + 2b^2 = d_1^2 + d_2^2$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de perímetro](/static/img/nodos/calculo-del-perimetro-de-un-paralelogramo-ejemplos.svg)


    Un paralelogramo tiene un perímetro de $50$ cm y uno de sus lados mide $15$ cm. Calcula la longitud del lado contiguo.'
  pasos:
  - 'Paso 1: Plantear la fórmula general del perímetro: $P = 2(a + b) = 50$ cm.'
  - 'Paso 2: Dividir entre 2 para obtener el semiperímetro: $a + b = \frac{50}{2} = 25$ cm.'
  - 'Paso 3: Sustituir el lado conocido ($a = 15$ cm): $15 + b = 25$ cm.'
  - 'Paso 4: Despejar el lado contiguo: $b = 25 - 15 = 10$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el perímetro de un paralelogramo de lados a y b?
  choices:
  - text: P = 2(a + b).
    is_correct: true
  - text: P = a · b.
    is_correct: false
  - text: P = a + b.
    is_correct: false
  - text: P = 4(a + b).
    is_correct: false
  explanation: La alternativa correcta es 'P = 2(a + b).' El paralelogramo tiene dos lados de medida $a$ y dos lados de medida $b$, sumando $2a + 2b = 2(a + b)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Los lados contiguos de un paralelogramo miden 7 cm y 11 cm. ¿Cuál es su perímetro?
  choices:
  - text: 36 cm.
    is_correct: true
  - text: 18 cm.
    is_correct: false
  - text: 77 cm.
    is_correct: false
  - text: 25 cm.
    is_correct: false
  explanation: La alternativa correcta es '36 cm.' $P = 2(7 + 11) = 2(18) = 36$ cm.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar las medidas de los dos lados contiguos $a$ y $b$.

  2. Sumar ambos lados: $a + b$.

  3. Duplicar la suma obtenida: $P = 2(a + b)$.

  4. Si se conoce el perímetro $P$ y se busca un lado, calcular $b = (P / 2) - a$.

  '
errores_correccion: '- **Error común 1:** Sumar solo dos lados contiguos ($a + b$) y olvidar multiplicar por 2. **Corrección:** La figura tiene 4 lados en su contorno, no 2.

  - **Error común 2:** Usar la altura en la fórmula del perímetro en lugar del lado oblicuo. **Corrección:** La altura es interior y no forma parte del borde de la figura.

  '
ejemplos:
- tipo: A
  titulo: Perímetro con números decimales
  enunciado: Un paralelogramo tiene lados de $4{,}2\text{ cm}$ y $8{,}3\text{ cm}$. ¿Cuál es su perímetro?
  alternativas:
  - text: $25\text{ cm}$.
    is_correct: true
  - text: $12{,}5\text{ cm}$.
    is_correct: false
  - text: $34{,}86\text{ cm}$.
    is_correct: false
  - text: $50\text{ cm}$.
    is_correct: false
  explicacion: $P = 2(4{,}2 + 8{,}3) = 2(12{,}5) = 25\text{ cm}$.
- tipo: B
  titulo: Perímetro con altura
  enunciado: ¿Se necesita la altura perpendicular para calcular el perímetro de un paralelogramo?
  respuesta: 'No'
  explicacion: No. El perímetro solo requiere las longitudes de los lados que delimitan la figura.
errores_frecuentes:
- '''Confundir el semiperímetro ($a + b$) con el perímetro completo ($2a + 2b$).'''
- '''Multiplicar los lados ($a \cdot b$) en lugar de sumarlos al calcular el contorno.'''
- '''Usar la altura perpendicular en vez del lado exterior.'''
afirmaciones_verdaderas:
- '''El perímetro de un paralelogramo es $P = 2(a + b)$.'''
- '''El perímetro no depende de la inclinación ni de los ángulos del paralelogramo.'''
- '''En el cuadrado y en el rombo, el perímetro se reduce a $P = 4s$.'''
al_terminar_debes_poder: '**QUÉ:** Calcular el perímetro de paralelogramos y despejar la longitud de lados desconocidos a partir del perímetro.


  **CÓMO:** Utilizando la fórmula $P = 2(a + b)$ asegurando el uso de lados exteriores y no alturas internas.


  ![Síntesis de perímetro](/static/img/nodos/calculo-del-perimetro-de-un-paralelogramo-resumen.svg)

  '
