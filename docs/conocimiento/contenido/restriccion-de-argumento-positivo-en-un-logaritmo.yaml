resumen_inicial: El argumento $a$ de un logaritmo $\log_b(a)$ debe ser estrictamente
  positivo ($a > 0$), ya que potenciar una base positiva $b > 0$ genera siempre resultados
  positivos $b^c > 0$.
explicacion_simple: No existen logaritmos de números negativos ni del cero. Como la
  base es un número positivo, al elevarla a cualquier exponente el resultado siempre
  será un número positivo, haciendo imposible obtener un argumento cero o negativo.
explicacion_formal: 'Para todo $\log_b(a)$, la **Restricción de Positividad del Argumento**
  exige:


  $$a \in \mathbb{R}^+ \iff a > 0$$


  **Demostración de no existencia para $a \le 0$:**

  Para toda base $b > 0$ y exponente $c \in \mathbb{R}$, se cumple $b^c > 0$.

  Por lo tanto, $b^c = a \le 0$ no tiene solución en el conjunto de los números reales
  $\mathbb{R}$.'
definiciones_clave: '- **Restricción de argumento positivo**: Exigencia $a > 0$ derivada
  del rango estricto $b^c > 0$ de la función exponencial.'
propiedades_relaciones: '- **Rango exponencial / Dominio logarítmico**: $(0, +\infty)$.'
ejemplo_guiado:
  enunciado: Determine la validez en $\mathbb{R}$ de las expresiones $\log_2(-8)$,
    $\log_5(0)$ y $\log_3(9)$.
  pasos:
  - 'Paso 1: Para $\log_2(-8)$, el argumento es $-8 < 0 \implies$ NO existe en $\mathbb{R}$.'
  - 'Paso 2: Para $\log_5(0)$, el argumento es $0 \implies$ NO existe en $\mathbb{R}$.'
  - 'Paso 3: Para $\log_3(9)$, el argumento es $9 > 0 \implies$ SÍ existe en $\mathbb{R}$
    y vale $2$.'
  - 'Conclusión: Solo $\log_3(9) = 2$ es una expresión válida en los reales.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué el argumento a de un logaritmo log_b(a) debe ser estrictamente
    positivo (a > 0)?
  choices:
  - text: Porque potenciar una base positiva b > 0 produce siempre un resultado positivo
      (b^c > 0)
    is_correct: true
  - text: Porque el argumento es siempre igual a la base
    is_correct: false
  - text: Porque los logaritmos no admiten enteros
    is_correct: false
  - text: Para evitar fracciones
    is_correct: false
  explanation: La alternativa correcta es 'Porque potenciar una base positiva b >
    0 produce siempre un resultado positivo (b^c > 0)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué log_5(0) NO está definido en los reales?
  choices:
  - text: Porque el argumento es igual a cero (viola a > 0)
    is_correct: true
  - text: Porque la base es 5
    is_correct: false
  - text: Because es un número par
    is_correct: false
  - text: Sí está definido y vale 0
    is_correct: false
  explanation: La alternativa correcta es 'Porque el argumento es igual a cero (viola
    a > 0)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de verificar la restricción $a >
  0$ sobre el argumento de cualquier logaritmo $\log_b(a)$, identificando expresiones
  no válidas en $\mathbb{R}$.
semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_ARGUMENTO_POSITIVO
procedimiento:
- 'Paso 1: Verificar que el argumento $a > 0$ y la base $b > 0, b \neq 1$ cumplan
  las restricciones.'
- 'Paso 2: Formular la equivalencia de potencia $b^c = a$.'
- 'Paso 3: Calcular el valor del exponente $c$ o simplificar la expresión logarítmica.'
errores_correccion: '- **Error 1: Intentar calcular logaritmos de números negativos
  o cero ($\log_2(-4)$ o $\log_2(0)$).** **Cómo corregirlo:** El argumento debe ser
  estrictamente positivo ($a > 0$); en $\mathbb{R}$ no existen.


  - **Error 2: Confundir la base con el argumento (escribir $\log_2(8) = 8^2 = 64$).**
  **Cómo corregirlo:** La base $2$ se eleva al RESULTADO para dar el argumento ($2^3
  = 8 \implies \log_2(8) = 3$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_ARGUMENTO_POSITIVO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
