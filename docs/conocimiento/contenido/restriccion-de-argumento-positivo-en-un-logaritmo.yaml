semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_ARGUMENTO_POSITIVO
resumen_inicial: El argumento de un logaritmo debe ser estrictamente mayor que cero
  ($a > 0$), por lo que no existen logaritmos de números negativos ni de cero en los
  números reales.
explicacion_simple: 'Dado que una base positiva elevada a cualquier exponente real
  siempre da un resultado positivo:

  - $\log_2(-4)$ NO existe en $\mathbb{R}$ (no hay exponente que haga a $2^x$ negativo).

  - $\log_2(0)$ NO existe en $\mathbb{R}$ (ninguna potencia de $2$ da $0$).

  Por lo tanto, **el número dentro del logaritmo (argumento) debe ser estrictamente
  positivo**.'
explicacion_formal: Para todo $b > 0, b \neq 1$, el recorrido de la función exponencial
  $f(x) = b^x$ es el conjunto $\mathbb{R}^+ = ]0, \infty[$. En consecuencia, el dominio
  de su función inversa $f^{-1}(x) = \log_b(x)$ es estrictamente $\mathbb{R}^+$.
definiciones_clave: '- **Dominio de argumento positivo**: Restricción $a > 0$ indispensable
  para la existencia del logaritmo real.'
propiedades_relaciones: '- **Ausencia de logaritmo de cero o negativos**: $\log_b(a)$
  no pertenece a $\mathbb{R}$ para $a \le 0$.'
ejemplo_guiado:
  enunciado: Determina si las expresiones A) $\log_3(-9)$ y B) $\log_3(0)$ son válidas
    en $\mathbb{R}$.
  pasos:
  - 'Para A: El argumento es $-9 < 0$. No existe logaritmo real de números negativos.'
  - 'Para B: El argumento es $0$. No existe exponente que haga $3^x = 0$.'
  - Concluir que ninguna de las dos expresiones existe en $\mathbb{R}$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué no existe $\log_{10}(-100)$ en los números reales?
  choices:
  - text: Porque el argumento es un número negativo (-100 < 0)
    is_correct: true
  - text: Porque la base es 10
    is_correct: false
  - text: Porque es igual a -2
    is_correct: false
  - text: Porque no se puede dividir entre 10
    is_correct: false
  explanation: 'La correcta es: Porque el argumento es un número negativo (-100 <
    0). El argumento exige estrictamente $a > 0$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Determina el dominio de existencia real para la expresión $\log_2(x -
    5)$.
  choices:
  - text: x > 5
    is_correct: true
  - text: x ≥ 5
    is_correct: false
  - text: x > 0
    is_correct: false
  - text: x ≠ 5
    is_correct: false
  explanation: 'La correcta es: x > 5. Exigimos argumento estrictamente positivo:
    $x - 5 > 0 \implies x > 5$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión del argumento $a$.'
- 'Paso 2: Plantear la inecuación estricta $a > 0$.'
- 'Paso 3: Resolver para hallar el intervalo de valores permitidos.'
errores_correccion: No confundas el resultado de un logaritmo (que sí puede ser negativo,
  como $\log_2(0{,}5) = -1$) con el argumento (que NUNCA puede ser negativo).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Existe $\log_2(0)$ en los números reales?
  alternativas:
  - 'No'
  - Sí, vale 0
  - Sí, es negativo
  respuesta: 'No'
  solucion_pasos:
  - El argumento no puede ser 0.
errores_frecuentes:
- Pensar que el resultado de un logaritmo no puede ser negativo.
afirmaciones_verdaderas:
- El argumento de un logaritmo debe cumplir $a > 0$.
al_terminar_debes_poder: Aplicar la restricción de argumento positivo para determinar
  dominios logarítmicos.
fuente: Texto escolar MINEDUC.
estado: publicado
