semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_ARGUMENTO_POSITIVO
resumen_inicial: El argumento de un logaritmo debe ser estrictamente positivo ($a > 0$), ya que una base positiva elevada a cualquier exponente real siempre genera un resultado mayor que cero.
explicacion_simple: "![Restricción de argumento positivo](/static/img/nodos/restriccion-de-argumento-positivo-en-un-logaritmo-intro.svg)\n\n¿Por qué no existen logaritmos de números negativos o cero?\n- Para cualquier base positiva ($b > 0$), como $2$:\n  - $2^3 = 8$ (positivo)\n  - $2^0 = 1$ (positivo)\n  - $2^{-5} = \frac{1}{32}$ (positivo)\n- ¡Ningún exponente puede hacer que una base positiva dé un número negativo o cero!\n- Por eso, el argumento debe ser siempre estrictamente positivo: $a > 0$."
explicacion_formal: 'Sea la función logarítmica $f(x) = \log_b(x)$ con $b \in \mathbb{R}^+ \setminus \{1\}$. Como la imagen de la función exponencial $g(x) = b^x$ es el conjunto $\operatorname{Rec}(g) = \mathbb{R}^+ = ]0, +\infty[$, el **dominio analítico** del logaritmo es estrictamente:


  $$\operatorname{Dom}(\log_b) = ]0, +\infty[$$


  **Consecuencias Analíticas:**

  1. $\log_b(a)$ **no existe en $\mathbb{R}$** para todo $a \le 0$.

  2. En $x = 0$ existe una **asíntota vertical** donde $\lim_{x \to 0^+} \log_b(x) = \pm \infty$.'
definiciones_clave: '- **Argumento positivo ($a > 0$)**: Condición de existencia obligatoria para el radicando o argumento del logaritmo.

  - **Dominio logarítmico**: Conjunto $\mathbb{R}^+ = ]0, +\infty[$.

  - **Asíntota vertical**: Recta $x = 0$ a la que se aproxima la curva logarítmica sin tocarla jamás.'
propiedades_relaciones: '- **Inecuación de existencia**: Para $\log_b(g(x))$, se exige resolver la inecuación estricta $g(x) > 0$.

  - **Valores del logaritmo**: Aunque el argumento debe ser positivo ($a > 0$), el resultado del logaritmo puede ser negativo ($c < 0$) si $0 < a < 1$ (con $b > 1$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de argumento positivo](/static/img/nodos/restriccion-de-argumento-positivo-en-un-logaritmo-ejemplos.svg)


    Determine la validez de $\log_2(-8)$, $\log_{10}(0)$ y $\log_2\left(\frac{1}{16}\right)$ en los números reales.'
  pasos:
  - 'Paso 1: Para $\log_2(-8)$: El argumento es $-8 < 0$. Como $2^c > 0$ siempre, no existe en $\mathbb{R}$.'
  - 'Paso 2: Para $\log_{10}(0)$: El argumento es $0$. Como $10^c \neq 0$ para todo $c \in \mathbb{R}$, está indefinido.'
  - 'Paso 3: Para $\log_2\left(\frac{1}{16}\right)$: El argumento es $\frac{1}{16} > 0$. Es válido y su valor es $-4$ ($2^{-4} = \frac{1}{16}$).'
  - 'Conclusión: Solo los argumentos estrictamente mayores a cero son válidos en $\mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función $f(x) = \log_3(x - 5)$?
  choices:
  - text: $]5, +\infty[$ (es decir, $x > 5$)
    is_correct: true
  - text: $[5, +\infty[$ (incluyendo el 5)
    is_correct: false
  - text: $\mathbb{R}$
    is_correct: false
  - text: $]0, +\infty[$
    is_correct: false
  explanation: La alternativa correcta es '$]5, +\infty[$ (es decir, $x > 5$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\log_2\left(\frac{1}{16}\right)$ sí existe a pesar de dar un resultado negativo?
  choices:
  - text: Porque el argumento $\frac{1}{16}$ es positivo ($> 0$); el resultado del logaritmo sí puede ser negativo
    is_correct: true
  - text: Porque $16$ es divisible por $2$
    is_correct: false
  - text: Porque las fracciones se vuelven positivas
    is_correct: false
  - text: Porque el logaritmo se eleva al cuadrado
    is_correct: false
  explanation: La alternativa correcta es 'Porque el argumento $\frac{1}{16}$ es positivo ($> 0$); el resultado del logaritmo sí puede ser negativo'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el argumento $a$ o la expresión interna $g(x)$.'
- 'Paso 2: Establecer la inecuación estricta $g(x) > 0$.'
- 'Paso 3: Resolver la inecuación para determinar el conjunto de valores de $x$ donde el logaritmo existe.'
errores_correccion: '- **Error 1: Confundir argumento negativo con resultado negativo.** **Cómo corregirlo:** El argumento no puede ser negativo ($a > 0$), pero el resultado sí puede ser negativo ($\log_2(1/4) = -2$).

  - **Error 2: Incluir el cero en el dominio ($a \ge 0$).** **Cómo corregirlo:** La inecuación es estrictamente mayor que cero ($a > 0$), el cero no tiene logaritmo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Para qué valores de $x$ existe $\log(2x - 6)$?
  alternativas:
  - $x > 3$
  - $x \ge 3$
  - $x > 0$
  respuesta: $x > 3$
  solucion_pasos:
  - $2x - 6 > 0 \implies 2x > 6 \implies x > 3$.
- titulo: Ejemplo 2
  enunciado: ¿Existe el valor real de $\log_{10}(-100)$?
  alternativas:
  - No existe en $\mathbb{R}$
  - $-2$
  - $2$
  respuesta: No existe en $\mathbb{R}$
  solucion_pasos:
  - El argumento $-100 < 0$ viola la restricción $a > 0$.
- titulo: ¿Es log(0) = 0 una afirmación verdadera?
  respuesta: 'No'
  solucion_pasos:
  - No, $\log(0)$ está indefinido porque ninguna potencia de 10 da 0.
  alternativas:
  - texto: No, log(0) no existe
    es_correcta: true
    retroalimentacion: ¡Correcto! El argumento debe ser estrictamente positivo ($a > 0$).
  - texto: Sí, es igual a 0
    es_correcta: false
    retroalimentacion: Incorrecto, el que vale 0 es $\log(1)$.
  - texto: Sí, es igual a 1
    es_correcta: false
    retroalimentacion: Incorrecto, $10^0 = 1$, no 0.
- titulo: ¿Es log₃(1/27) = -3 una expresión válida?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el argumento $1/27 > 0$ es positivo y $3^{-3} = 1/27$.
  alternativas:
  - texto: Sí, argumento 1/27 > 0 es positivo
    es_correcta: true
    retroalimentacion: ¡Correcto! Argumento positivo con exponente negativo.
  - texto: No, las fracciones no tienen logaritmo
    es_correcta: false
    retroalimentacion: Incorrecto, todo número real positivo tiene logaritmo.
  - texto: No, el logaritmo debe ser positivo
    es_correcta: false
    retroalimentacion: Incorrecto, los exponentes pueden ser negativos.
errores_frecuentes:
- Intentar calcular logaritmos de números negativos.
- Confundir $\log_b(1) = 0$ con $\log_b(0) = 0$.
- Usar $\ge 0$ en vez de $> 0$ al calcular dominios.
- Rechazar logaritmos cuyo resultado sea negativo.
afirmaciones_verdaderas:
- El argumento de un logaritmo debe ser un número real estrictamente positivo ($a > 0$).
- El conjunto imagen de la función exponencial es $]0, +\infty[$, lo que fija el dominio del logaritmo.
- El resultado de un logaritmo puede ser cualquier número real (positivo, cero o negativo).
al_terminar_debes_poder: '![Síntesis de restricción de argumento positivo](/static/img/nodos/restriccion-de-argumento-positivo-en-un-logaritmo-resumen.svg)


  QUÉ: Comprender y aplicar la restricción de argumento positivo $a > 0$ en logaritmos.


  CÓMO: Verificando que todo argumento pertenezca al intervalo $]0, +\infty[$ y planteando inecuaciones estrictas $g(x) > 0$ para hallar dominios de existencia.'
