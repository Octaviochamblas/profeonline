semantic_id: MAT.NUM.ENTEROS_OPERATORIA.ASOCIATIVA_MULT
resumen_inicial: "La propiedad asociativa dice que al multiplicar tres o más enteros, la forma de agruparlos no cambia el producto: $(a\\cdot b)\\cdot c=a\\cdot(b\\cdot c)$."
explicacion_simple: |
  Al multiplicar $2 \cdot 3 \cdot 5$, ¿importa cuáles dos multiplicas primero? ¡Para nada!
  Puedes hacer $2\cdot3=6$ y luego $6\cdot5=30$, o $3\cdot5=15$ y luego $2\cdot15=30$. Esa
  libertad para agrupar los factores como quieras sin cambiar el resultado se llama
  propiedad asociativa. Es muy útil para hacer cálculos difíciles de forma más simple.
explicacion_formal: |
  Para todo $a, b, c \in \mathbb{Z}$: $(a \cdot b) \cdot c = a \cdot (b \cdot c)$. Permite
  agrupar los factores en el orden más conveniente, por ejemplo buscando obtener múltiplos
  de 10 para facilitar el cálculo mental.
definiciones_clave: |
  **Propiedad asociativa de la multiplicación**: la forma de agrupar tres o más factores
  con paréntesis no altera el resultado del producto.
propiedades_relaciones: |
  La propiedad asociativa aplica solo a la multiplicación (y a la adición), no a la
  división. Junto con la conmutativa, permite reordenar y agrupar factores libremente.
ejemplo_guiado:
  enunciado: "Calcula $(-2) \\cdot 15 \\cdot (-5)$ usando la propiedad asociativa."
  pasos:
    - 'Se agrupan los factores que dan un número redondo: $[(-2)\cdot(-5)]\cdot 15$.'
    - 'Se resuelve el paréntesis: $(-2)\cdot(-5)=10$.'
    - 'Se multiplica por el factor restante: $10\cdot15=150$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Para qué sirve principalmente la propiedad asociativa de la multiplicación?"
    choices:
      - {text: "Para agrupar factores y simplificar el cálculo", is_correct: true}
      - {text: "Para cambiar el signo del resultado", is_correct: false}
      - {text: "Para convertir una multiplicación en suma", is_correct: false}
      - {text: "Para dividir factores comunes", is_correct: false}
    explanation: "La correcta es Para agrupar factores y simplificar el cálculo: la forma de agrupar no cambia el resultado."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $(-4) \\cdot 23 \\cdot (-25)$?"
    choices:
      - {text: "$2300$", is_correct: true}
      - {text: "$-2300$", is_correct: false}
      - {text: "$100$", is_correct: false}
      - {text: "$-100$", is_correct: false}
    explanation: "La correcta es $2300$: se agrupa $(-4)\\cdot(-25)=100$, y luego $100\\cdot23=2300$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identifica los factores en la multiplicación de tres o más enteros.'
  - 'Paso 2: Agrupa o asocia dos de los factores utilizando paréntesis, buscando la combinación que facilite el cálculo (por ejemplo, obtener múltiplos de 10).'
  - 'Paso 3: Multiplica los factores agrupados y luego multiplica el resultado por el factor restante, respetando la regla de los signos.'
errores_correccion: |
  Un error frecuente es creer que la propiedad asociativa se aplica a la división (no es
  asociativa). Otro error es confundirla con la conmutativa: la asociativa cambia la
  agrupación, no el orden de los factores.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Calcula el producto $(-4) \cdot 13 \cdot (-25)$ utilizando la propiedad asociativa para simplificar el proceso.'
    alternativas:
      - "$1300$"
      - "$-1300$"
      - "$300$"
    respuesta: "$1300$"
    solucion_pasos:
      - 'Paso a: Identificamos los factores: $-4$, $13$ y $-25$. Vemos que multiplicar $-4 \cdot (-25)$ da un número redondo ($100$).'
      - 'Paso b: Usamos la propiedad asociativa para agrupar estos factores: $[(-4) \cdot (-25)] \cdot 13$.'
      - 'Paso c: Calculamos el producto dentro del corchete: $(-4) \cdot (-25) = 100$.'
      - 'Paso d: Multiplicamos el resultado por el factor restante: $100 \cdot 13 = 1300$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Calcula el producto $5 \cdot (-8) \cdot 2$ de dos formas distintas usando la propiedad asociativa.'
    alternativas:
      - "$-80$ en ambas formas"
      - "$-80$ y $80$ según la forma"
      - "$-40$ en ambas formas"
    respuesta: "$-80$ en ambas formas"
    solucion_pasos:
      - 'Paso a: Primera forma: Agrupamos los dos primeros factores: $[5 \cdot (-8)] \cdot 2 = (-40) \cdot 2 = -80$.'
      - 'Paso b: Segunda forma: Agrupamos los dos últimos factores: $5 \cdot [(-8) \cdot 2] = 5 \cdot (-16) = -80$.'
      - 'Paso c: Conclusión: En ambos casos el resultado es $-80$, lo que comprueba la propiedad asociativa.'
  - titulo: '¿Cambia el resultado de $(-2) \cdot 3 \cdot (-5)$ si agrupamos primero $(-2) \cdot 3$?'
    respuesta: 'No'
    solucion_pasos:
      - 'Agrupando primero los dos primeros factores: $[(-2) \cdot 3] \cdot (-5) = (-6) \cdot (-5) = 30$.'
      - 'Agrupando los dos últimos factores: $(-2) \cdot [3 \cdot (-5)] = (-2) \cdot (-15) = 30$.'
      - 'Por la propiedad asociativa, la forma de agrupar no altera el resultado final.'
  - titulo: '¿Es la propiedad asociativa válida para cualquier número entero, incluyendo los negativos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'La propiedad asociativa se cumple para todos los elementos del conjunto $\mathbb{Z}$.'
      - 'Esto incluye números enteros positivos, negativos y el cero.'
errores_frecuentes:
  - 'Creer que la propiedad asociativa se aplica a la división de números enteros (la división no es asociativa).'
  - 'Confundir la propiedad asociativa con la conmutativa (la conmutativa cambia el orden de los factores, la asociativa cambia su agrupación).'
  - 'Olvidar aplicar la regla de los signos al multiplicar los grupos de números enteros.'
  - 'Asociar sumas y multiplicaciones de forma incorrecta mezclando las operaciones sin aplicar distributividad.'
  - 'Pensar que los paréntesis cambian el valor absoluto del resultado final de la multiplicación.'
afirmaciones_verdaderas:
  - "La propiedad asociativa permite agrupar los factores de cualquier forma sin cambiar el producto."
  - "(2·3)·4 da el mismo resultado que 2·(3·4)."
al_terminar_debes_poder: |
  Agrupar tres o más factores de la forma más conveniente para facilitar el cálculo,
  aplicando correctamente la propiedad asociativa.
fuente: "Matemática 7° Básico Tomo 1 — Enteros, p. 38"
estado: publicado
