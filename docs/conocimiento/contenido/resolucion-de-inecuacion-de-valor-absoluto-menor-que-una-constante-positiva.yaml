semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MENOR_QUE_POSITIVO
resumen_inicial: Una inecuación del tipo $|X| < k$ con $k > 0$ equivale a una desigualdad
  doble encerrada $-k < X < k$.
explicacion_simple: 'Si tenemos una inecuación como $|x| < 5$ con un número positivo
  $k = 5$:

  Significa que la distancia de $x$ al cero debe ser menor que 5 unidades.

  Eso encierra a la $x$ exactamente entre $-5$ y $5$.

  La propiedad matemática para quitar el valor absoluto es transformarla en la desigualdad
  doble: **$-5 < x < 5$** (un solo intervalo cerrado).'
explicacion_formal: 'Para toda expresión $X$ y constante $k > 0$ (estrictamente positiva):


  $$|X| < k \iff -k < X < k$$


  **Desglose de la fórmula:**

  - Equivale a la conjunción simultánea de dos desigualdades: $X > -k \quad \land
  \quad X < k$.

  - Conjunto solución en formato de intervalo: $S = ]-k, k[$.'
definiciones_clave: '- **Propiedad de acotamiento $|X| < k$**: Regla que convierte
  una inecuación de valor absoluto ''menor que'' en una desigualdad simultánea acotada
  entre $-k$ y $k$.'
propiedades_relaciones: '- **Conjunción e intersección**: Produce un único intervalo
  acotado de soluciones continuo.'
ejemplo_guiado:
  enunciado: Resuelve la inecuación con valor absoluto $|2x - 1| < 7$ aplicando la
    propiedad de acotamiento.
  pasos:
  - 'Paso 1: Aplicar la propiedad $|X| < k \iff -k < X < k$: $-7 < 2x - 1 < 7$.Paso
    2: Sumar $1$ a los tres miembros de la desigualdad: $-7 + 1 < 2x < 7 + 1 \implies
    -6 < 2x < 8$.Paso 3: Dividir los tres miembros entre $+2$: $\frac{-6}{2} < x <
    \frac{8}{2} \implies -3 < x < 4$.Paso 4: Escribir el conjunto solución en formato
    de intervalo: $S = ]-3, 4[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué desigualdad equivalente se transforma la inecuación $|X| < k$ con
    $k > 0$?
  choices:
  - text: $-k < X < k$
    is_correct: true
  - text: $X < -k$ o $X > k$
    is_correct: false
  - text: $X < k$
    is_correct: false
  - text: $X = k$
    is_correct: false
  explanation: La alternativa correcta es '$-k < X < k$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $|2x - 1| < 7$, ¿cuál es el conjunto solución $S$ obtenido?
  choices:
  - text: $S = ]-3, 4[$
    is_correct: true
  - text: $S = [-3, 4]$
    is_correct: false
  - text: $S = ]-\infty, -3[ \ \cup \ ]4, +\infty[$
    is_correct: false
  - text: $S = ]-7, 7[$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-3, 4[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que la constante $k$ a la derecha sea estrictamente positiva
  ($k > 0$).'
- 'Paso 2: Eliminar las barras escribiendo $-k < \text{expresión} < k$.'
- 'Paso 3: Despejar la variable $x$ operando en los tres miembros simultáneamente.'
- 'Paso 4: Expresar el resultado como intervalo abierto $]a, b[$.'
errores_correccion: '- **Error común:** Escribir la propiedad de ''menor que'' como
  una unión de dos ramas separadas ($x < -5$ o $x > 5$).

  - **Cómo corregirlo:** Las inecuaciones con ''menor que'' ($|X| < k$) se encierran
  en UN SOLO INTERVALO entre $-k$ y $k$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones con valor absoluto.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de valor absoluto.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una inecuación del tipo |X| < k con k > 0 se convierte en la desigualdad
    doble -k < X < k?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de acotamiento de distancias.
- titulo: ¿Es cierto que |P(x)| < -5 no tiene solución en los números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el valor absoluto es siempre mayor o igual a cero ($S = \\emptyset$).
errores_frecuentes:
- Quitar las barras de valor absoluto sin descomponer en la propiedad correspondiente.
- Confundir la propiedad de 'menor que' ($|X| < k \implies -k < X < k$) con la de
  'mayor que' ($|X| > k \implies X < -k \lor X > k$).
- Intentar despejar algebraicamente una inecuación de valor absoluto comparada con
  una constante negativa en vez de usar la lógica inmediata.
- Olvidar colocar el símbolo de unión $\cup$ al unir las dos ramas de una inecuación
  del tipo $|X| > k$.
- Usar corchetes abiertos en la solución de inecuaciones no estrictas de valor absoluto
  ($|X| \le k$).
afirmaciones_verdaderas:
- La inecuación $|X| < k$ con $k > 0$ equivale a la desigualdad acotada $-k < X <
  k$, cuyo conjunto solución es un único intervalo continuo.
- Dado que el valor absoluto es siempre no negativo, la inecuación $|P(x)| < c$ con
  $c < 0$ carece de solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver inecuaciones con
  valor absoluto de tipo menor que, mayor que y comparaciones con constantes negativas.
