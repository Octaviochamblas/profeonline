semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MENOR_QUE_POSITIVO
resumen_inicial: 'Resolución de inecuación de valor absoluto menor que una constante
  positiva: relaciones de orden, intervalos y resolución en Inecuaciones con valor
  absoluto.'
explicacion_simple: Cuando decimos que el valor absoluto de una cantidad es menor
  que un número positivo, significa que la distancia de esa cantidad al origen es
  más pequeña que ese número. Esto se traduce en que la cantidad original debe estar
  "atrapada" entre el valor negativo y el valor positivo del número.
explicacion_formal: '### Definición formal

  Para cualquier expresión algebraica $u$ y cualquier número real constante $a > 0$,
  la inecuación de valor absoluto $|u| < a$ es lógicamente equivalente a la doble
  inecuación $-a < u < a$. Del mismo modo, si la inecuación incluye la igualdad, $|u|
  \\leq a$ es equivalente a $-a \\leq u \\leq a$.


  ### Desarrollo didáctico

  Imagina que estás en el centro de una plaza (posición cero) y te dicen que debes
  mantenerte a una distancia menor a 5 metros de este centro. Eso significa que no
  puedes alejarte 5 metros hacia la derecha (valores positivos) ni 5 metros hacia
  la izquierda (valores negativos). Debes permanecer en la franja que va desde $-5$
  hasta $5$. En términos algebraicos, esto explica por qué si $|x| < 5$, entonces
  obligatoriamente $-5 < x < 5$. Cuando hay una expresión más compleja dentro de las
  barras, como $|2x - 1| < 5$, aplicamos el mismo principio para atrapar al bloque
  entero $-5 < 2x - 1 < 5$, y a partir de ahí despejamos la variable.'
definiciones_clave: '- **Resolución de inecuación de valor absoluto menor que una
  constante positiva**: Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a resolución de inecuación de valor absoluto
  menor que una constante positiva.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de resolución de
    inecuación de valor absoluto menor que una constante positiva.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de resolución de inecuación de valor absoluto
    menor que una constante positiva, invirtiendo el sentido si se multiplica por
    un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
