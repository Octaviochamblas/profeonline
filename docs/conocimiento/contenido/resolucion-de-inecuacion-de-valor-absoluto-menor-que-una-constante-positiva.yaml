semantic_id: MAT.ALG.INECUACIONES_VALOR_ABSOLUTO.MENOR_QUE_POSITIVO
resumen_inicial: Las inecuaciones de valor absoluto del tipo $|E| < k$ con $k > 0$ se resuelven mediante la doble desigualdad estricta acotada.
explicacion_simple: '![Resolución de inecuación de valor absoluto menor que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-menor-que-una-constante-positiva-intro.svg)


  Para resolver $|x| < 5$, buscamos los números cuya distancia a cero sea **estrictamente menor que 5**.


  Esto confina los valores al intervalo acotado entre $-5$ y $5$ sin incluir los extremos:

  $$-5 < x < 5$$


  La solución en notación de intervalo es el **intervalo abierto** $S = ]-5, 5[$.'
explicacion_formal: 'Para $k > 0$ y $E(x)$ una expresión algebraica:


  $$|E(x)| < k \iff -k < E(x) < k$$


  **Desglose de la fórmula:**

  - Doble desigualdad estricta: Excluye las fronteras $-k$ y $k$.

  - Conjunto solución global $S = ]-k, k[$.

  '
definiciones_clave: '- **Emparedado estricto**: Doble desigualdad que acota el argumento $E$ dentro del intervalo abierto $]-k, k[$.

  '
propiedades_relaciones: '- **Exclusión de las fronteras**: El operador $<$ garantiza corchetes abiertos en ambos límites.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Resolución de inecuación de valor absoluto menor que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-menor-que-una-constante-positiva-ejemplos.svg)


    Resuelve la inecuación $|x + 4| < 9$ y expresa el conjunto solución como intervalo.'
  pasos:
  - 'Paso 1: Aplicar la doble desigualdad estricta: $-9 < x + 4 < 9$.'
  - 'Paso 2: Restar 4 en los tres miembros: $-9 - 4 < x < 9 - 4$.'
  - 'Paso 3: Simplificar: $-13 < x < 5$.'
  - 'Paso 4: Escribir la solución en notación de intervalo abierto: $S = ]-13, 5[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver $|x + 4| < 9$, ¿cuál es el conjunto solución $S$?
  choices:
  - text: $S = ]-13, 5[$
    is_correct: true
  - text: $S = [-13, 5]$
    is_correct: false
  - text: $S = ]-\infty, -13[ \cup ]5, +\infty[$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-13, 5[$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué tipo de corchetes utiliza la solución de $|E| < k$ con $k > 0$?
  choices:
  - text: Corchetes abiertos mirando hacia afuera en ambos extremos.
    is_correct: true
  - text: Corchetes cerrados mirando hacia adentro.
    is_correct: false
  - text: Corchete abierto a la izquierda y cerrado a la derecha.
    is_correct: false
  - text: No utiliza corchetes.
    is_correct: false
  explanation: La alternativa correcta es 'Corchetes abiertos mirando hacia afuera en ambos extremos.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la constante $k$ sea estrictamente positiva ($k > 0$).'
- 'Paso 2: Formular la doble desigualdad estricta $-k < E < k$.'
- 'Paso 3: Despejar la variable $x$ operando simultáneamente en las tres partes.'
- 'Paso 4: Declarar el intervalo abierto $S = ]a, b[$.'
errores_correccion: '- **Error común:** Escribir corchetes cerrados en la solución de una desigualdad estricta ($<$).

  - **Cómo corregirlo:** Si el operador original es estrictamente menor que ($<$), los extremos $-k$ y $k$ NO forman parte del conjunto solución y deben llevar corchetes abiertos.

  '
ejemplos:
- titulo: 'Ejemplo 1: Caso directo'
  enunciado: ¿Cuál es la solución de $|x - 4| < 3$?
  alternativas:
  - $]1, 7[$
  - $[1, 7]$
  - $]-7, -1[$
  - $]-\infty, 1[ \cup ]7, +\infty[$
  respuesta: $]1, 7[$
  solucion_pasos:
  - 'Paso 1: $-3 < x - 4 < 3$.'
  - 'Paso 2: Sumar $4$: $1 < x < 7 \implies x \in ]1, 7[$.'
- titulo: 'Ejemplo 2: Con coeficiente lineal'
  enunciado: ¿Cuál es el conjunto solución de $|2x + 1| < 5$?
  alternativas:
  - $]-3, 2[$
  - $[-3, 2]$
  - $]-2, 3[$
  - $]-\infty, -3[ \cup ]2, +\infty[$
  respuesta: $]-3, 2[$
  solucion_pasos:
  - 'Paso 1: $-5 < 2x + 1 < 5$.'
  - 'Paso 2: Restar $1$: $-6 < 2x < 4$.'
  - 'Paso 3: Dividir entre $2$: $-3 < x < 2 \implies S = ]-3, 2[$.'
- titulo: 'Ejemplo 3: Inecuación centrada en cero'
  enunciado: ¿Cuál es la solución de $|x| < 9$?
  alternativas:
  - $]-9, 9[$
  - $[-9, 9]$
  - $]0, 9[$
  - $]-\infty, 9[$
  respuesta: $]-9, 9[$
  solucion_pasos:
  - 'Paso 1: Directamente $-9 < x < 9$.'
  - 'Paso 2: $S = ]-9, 9[$.'
- titulo: 'Ejemplo 4: Despeje con resta previa'
  enunciado: Resuelve $|x| + 2 < 8$.
  alternativas:
  - $]-6, 6[$
  - $[-6, 6]$
  - $]-10, 10[$
  - $]-\infty, 6[$
  respuesta: $]-6, 6[$
  solucion_pasos:
  - 'Paso 1: Restar $2$: $|x| < 6$.'
  - 'Paso 2: $-6 < x < 6 \implies S = ]-6, 6[$.'
errores_frecuentes:
- La inecuación $|x| < 8$ se desglosa en la unión de semirrectas $]-\infty, -8[ \cup ]8, +\infty[$.
- Resolver $|x - 1| < 5$ requiere incluir los puntos extremos $-4$ y $6$ como soluciones válidas.
- La desigualdad $|E| < k$ con $k > 0$ se traduce en la disyunción de dos inecuaciones separadas.
- Al despejar $-3 < x + 2 < 3$, se resta $2$ únicamente en el miembro derecho obteniendo $-3 < x < 1$.
- La condición $-k < E < k$ equivale a la intersección de dos conjuntos con corchetes cerrados.
afirmaciones_verdaderas:
- Para $k > 0$, la desigualdad $|E| < k$ equivale a la conjunción continua $-k < E < k$.
- El conjunto solución de $|E| < k$ se expresa como un intervalo abierto acotado $]-k, k[$.
al_terminar_debes_poder: '**QUÉ:** Resolver inecuaciones de la forma $|f(x)| < k$ con $k > 0$.


  **CÓMO:** Desdoblando la inecuación en una doble desigualdad simultánea $-k < f(x) < k$ para obtener un intervalo abierto acotado.


  ![Resumen Resolución de inecuación de valor absoluto menor que una constante positiva](/static/img/nodos/resolucion-de-inecuacion-de-valor-absoluto-menor-que-una-constante-positiva-resumen.svg)'
