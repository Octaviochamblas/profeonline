semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.VOLUMENES_GEOMETRICOS
resumen_inicial: El modelamiento de volúmenes de cuerpos geométricos mediante funciones potencia cúbicas $V(L) = k \cdot L^3$ establece que la capacidad y masa de cualquier cuerpo tridimensional semejante escala proporcionalmente al cubo de su dimensión lineal $L$, con factor de escala $c^3$.
explicacion_simple: "![El modelamiento de volúmenes de cuerpos geométricos mediante funciones potencia cúbicas $V(L) = k \\cdot L^3$ establece que la capacidad y masa de cualquier cuerpo tridimensional semejante escala proporcionalmente al cubo de su dimensión lineal $L$, con factor de escala $c^3$](/static/img/nodos/modelamiento-de-volumenes-de-cuerpos-geometricos-mediante-funciones-potencia-cubicas-intro.svg)\n\n\nCualquier objeto tridimensional (un cubo, una pelota, una botella o un ser vivo) escala su volumen y peso según una **función potencia cúbica ($n = 3$)**:\n\n- **Ejemplos en cuerpos clásicos:**\n  - Cubo: $V(a) = \\mathbf{1} \\cdot a^3$\n  - Esfera: $V(r) = \\mathbf{\\frac{4}{3}\\pi} \\cdot r^3$\n  - Cilindro equilátero ($h = 2r$): $V(r) = \\mathbf{2\\pi} \\cdot r^3$\n  - Cono equilátero ($h = r$): $V(r) = \\mathbf{\\frac{1}{3}\\pi} \\cdot r^3$\n- **La paradoja del gigante de Galileo:** Si un animal fuera el doble de alto, ancho y grueso ($c = 2$), ¡su peso y volumen se multiplicarían\
  \ por $2^3 = \\mathbf{8}$ veces!"
explicacion_formal: 'Por el teorema de semejanza tridimensional en el espacio euclidiano $\mathbb{R}^3$, dos cuerpos homogéneos $\mathcal{S}_1$ y $\mathcal{S}_2$ con factor de escala lineal $c = L_2 / L_1$ satisfacen:

  $$\frac{\operatorname{Volumen}(\mathcal{S}_2)}{\operatorname{Volumen}(\mathcal{S}_1)} = c^3 = \left(\frac{L_2}{L_1}\right)^3$$

  De este modo, el volumen y la masa ($m = \rho V$) como función de la longitud característica $L$ se modelan mediante:

  $$V(L) = k \cdot L^3$$

  donde $k = V(1)$ es la constante volumétrica morfológica del cuerpo.'
definiciones_clave: '- **Factor de escala volumétrico**: Razón $c^3$ por la cual se multiplica la capacidad al escalar las longitudes por $c$.

  - **Constante volumétrica $k$**: Coeficiente morfológico que define el volumen unitario del sólido.'
propiedades_relaciones: '- **Homogeneidad de grado 3**: $V(c \cdot L) = c^3 \cdot V(L)$.

  - **Razón superficie-volumen**: La relación área/volumen escala como $\frac{k_A L^2}{k_V L^3} = \frac{K}{L}$, disminuyendo con el tamaño.'
ejemplo_guiado:
  enunciado: '![Ejemplo El modelamiento de volúmenes de cuerpos geométricos mediante funciones potencia cúbicas $V(L) = k \cdot L^3$ establece que la capacidad y masa de cualquier cuerpo tridimensional semejante escala proporcionalmente al cubo de su dimensión lineal $L$, con factor de escala $c^3$](/static/img/nodos/modelamiento-de-volumenes-de-cuerpos-geometricos-mediante-funciones-potencia-cubicas-ejemplos.svg)



    Aplica el modelo de volumen cúbico para resolver:

    1) Un estanque esférico de radio $r = 1\text{ m}$ almacena $4{,}19\text{ m}^3$ de agua. Si se construye otro estanque semejante con radio $r = 3\text{ m}$ ($c = 3$), ¿cuál será su capacidad?

    2) Un bloque de metal cúbico de $2\text{ cm}$ de arista pesa $64\text{ g}$. ¿Cuánto pesará un bloque del mismo metal con $4\text{ cm}$ de arista?'
  pasos:
  - 'Paso 1: Para el estanque: El radio se triplica ($c = 3$). Factor de volumen: $c^3 = 3^3 = \mathbf{27}$. Capacidad: $4{,}19 \times 27 = \mathbf{113{,}13\text{ m}^3}$.'
  - 'Paso 2: Para el bloque de metal: La arista se duplica ($c = 4/2 = 2$). Factor de masa: $c^3 = 2^3 = \mathbf{8}$. Peso: $64\text{ g} \times 8 = \mathbf{512\text{ g}}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si se duplican todas las dimensiones de una caja (largo, ancho y alto), ¿cuántas veces más producto puede contener?
  choices:
  - text: 8 veces más (porque 2³ = 8)
    is_correct: true
  - text: 2 veces más
    is_correct: false
  - text: 4 veces más
    is_correct: false
  - text: 6 veces más
    is_correct: false
  explanation: 'La alternativa correcta es ''8 veces más (porque 2³ = 8)''. El volumen escala con el cubo del factor de longitud: $c^3 = 2^3 = 8$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el modelo del volumen de una esfera $V(r) = \frac{4}{3}\pi r^3$, ¿cuál es el coeficiente constante k?
  choices:
  - text: k = (4/3)π
    is_correct: true
  - text: k = 4π
    is_correct: false
  - text: k = 3
    is_correct: false
  - text: k = π
    is_correct: false
  explanation: La alternativa correcta es 'k = (4/3)π'. Es el factor constante que multiplica a la potencia cúbica del radio $r^3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la dimensión lineal $L$ característica del cuerpo tridimensional.'
- 'Paso 2: Establecer el modelo de volumen cúbico $V(L) = k \cdot L^3$.'
- 'Paso 3: Calcular el factor de amplificación volumétrica elevando el factor lineal al cubo ($c^3$).'
- 'Paso 4: Multiplicar el volumen o masa original por $c^3$ para obtener la nueva capacidad.'
errores_correccion: '- **Error común:** Creer que duplicar el radio de un depósito duplica su capacidad.

  - **Cómo corregirlo:** El volumen es **TRIDIMENSIONAL ($c^3$)**: duplicar el radio ($c = 2$) multiplica la capacidad por **$2^3 = \mathbf{8}$ veces**.'
ejemplos:
- titulo: 'Ejemplo 1: Escala cúbica de globo'
  enunciado: 'Si inflas un globo hasta triplicar su diámetro, la cantidad de aire que contiene se multiplica por:'
  alternativas:
  - '27'
  - '3'
  - '9'
  - '6'
  respuesta: '27'
  solucion_pasos:
  - 'Paso 1: $c^3 = 3^3 = 27$.'
- titulo: 'Ejemplo 2: Masa de estatua de bronce'
  enunciado: 'Una maqueta de bronce de 10 cm pesa 500 g. La estatua real de 100 cm ($c = 10$) pesará:'
  alternativas:
  - 500 kg (500.000 g)
  - 50 kg
  - 5.000 g
  - 1.000 kg
  respuesta: 500 kg (500.000 g)
  solucion_pasos:
  - 'Paso 1: $500\text{ g} \times 10^3 = 500 \times 1.000 = 500.000\text{ g} = 500\text{ kg}$.'
- titulo: 'Ejemplo 3: Volumen de cono'
  enunciado: 'El volumen de un cono con $h = 2r$ es $V = \frac{2}{3}\pi r^3$. Sus parámetros son:'
  alternativas:
  - k = (2/3)π, n = 3
  - k = 2, n = 3
  - k = π, n = 2
  - n = 1/3
  respuesta: k = (2/3)π, n = 3
  solucion_pasos:
  - 'Paso 1: $k = \frac{2}{3}\pi, n = 3$.'
- titulo: 'Ejemplo 4: Reducción cúbica'
  enunciado: 'Si un cubito de hielo se derrite reduciendo sus lados a la mitad ($c = 0{,}5$), su masa es el:'
  alternativas:
  - 12,5% de la original
  - 50% de la original
  - 25% de la original
  - 6,25% de la original
  respuesta: 12,5% de la original
  solucion_pasos:
  - 'Paso 1: $(0{,}5)^3 = 0{,}125 = 12{,}5\%$.'
errores_frecuentes:
- Confundir las unidades cúbicas de volumen con las cuadráticas de área.
- Multiplicar por 3 en lugar de elevar al cubo (c³).
- Olvidar que la masa de un cuerpo homogéneo escala idénticamente al volumen.
afirmaciones_verdaderas:
- El volumen de cualquier sólido semejante sigue un modelo de función potencia cúbica V = k · L³.
- Al multiplicar las dimensiones lineales por c, el volumen y la masa se multiplican por c³.
al_terminar_debes_poder: '**QUÉ:** Modelar y resolver problemas de volúmenes y masas mediante funciones potencia cúbicas.


  **CÓMO:** Aplicando la ley de escala tridimensional V(L) = k · L³ y calculando la amplificación cúbica c³.


