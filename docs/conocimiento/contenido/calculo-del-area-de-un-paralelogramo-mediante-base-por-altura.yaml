semantic_id: MAT.GEO.PARALELOGRAMOS.AREA_BASE_ALTURA
resumen_inicial: 'El área de un paralelogramo equivale al producto de su base por su altura perpendicular: A = b · h.'
explicacion_simple: '¿Por qué la fórmula del área de un paralelogramo es tan parecida a la de un rectángulo? Si tomas unas tijeras y cortas el triángulo inclinado que sobra a la izquierda de un paralelogramo y lo pegas en el hueco que falta a la derecha, ¡la figura se convierte exactamente en un rectángulo de base $b$ y altura $h$!


  Por este principio de conservación, su área es simplemente **$A = b \cdot h$**. La única regla de oro es que la **altura $h$ debe ser estrictamente perpendicular** (formar un ángulo de $90^\circ$) con la base. ¡Jamás multipliques la base por el lado inclinado!


  ![Cálculo del área de un paralelogramo](/static/img/nodos/calculo-del-area-de-un-paralelogramo-mediante-base-por-altura-intro.svg)

  '
explicacion_formal: '### Teorema del área del paralelogramo

  Sea $\mathcal{ABCD}$ un paralelogramo con base de longitud $b$ y altura perpendicular asociada $h$. El área superficial $A$ viene dada por:

  $$A = b \cdot h$$


  ### Deducción geométrica por equidescomposición

  1. Trácese la altura perpendicular $\overline{DE} \perp \overline{AB}$ con longitud $h$, determinando el triángulo rectángulo $\triangle ADE$.

  2. Trácese la perpendicular $\overline{CF} \perp$ a la prolongación de $\overline{AB}$, determinando el triángulo $\triangle BCF$.

  3. Como $\overline{AD} \cong \overline{BC}$ y $\overline{DE} \cong \overline{CF} = h$, por congruencia de triángulos rectángulos se tiene $\triangle ADE \cong \triangle BCF$.

  4. Área del paralelogramo: $\text{Área}(EBCD) + \text{Área}(\triangle ADE) = \text{Área}(EBCD) + \text{Área}(\triangle BCF) = \text{Área}(\text{rectángulo } EFCD)$.

  5. Por tanto, $A = EF \cdot h = b \cdot h$.


  ### Forma trigonométrica

  Si se conocen los lados adyacentes $a$ y $b$ y el ángulo comprendido $\theta$, como $h = a \cdot \sin(\theta)$:

  $$A = a \cdot b \cdot \sin(\theta)$$

  Como $\sin(\theta) \leq 1$, se deduce rigurosamente que $A \leq a \cdot b$, alcanzándose la igualdad únicamente si $\theta = 90^\circ$ (rectángulo).


  > **Complemento didáctico:** La trampa clásica número uno de la PAES en este tema es darte la base ($10$), el lado inclinado ($6$) y la altura ($5$). El error típico es hacer $10 \cdot 6 = 60$. ¡No caigas en la trampa! El área correcta es base por altura: $10 \cdot 5 = 50$.

  '
definiciones_clave: '- **Base ($b$)**: Lado del paralelogramo elegido como referencia sobre el cual descansa o se proyecta la figura.

  - **Altura ($h$)**: Segmento perpendicular trazado desde la recta que contiene a la base hasta la recta del lado opuesto ($h \perp b$).

  - **Equidescomposición**: Principio geométrico por el cual dos polígonos tienen la misma área si pueden particionarse en piezas congruentes.

  '
propiedades_relaciones: '- **Doble cálculo de área**: Como el paralelogramo tiene dos pares de lados, $A = b_1 \cdot h_1 = b_2 \cdot h_2$.

  - **Despeje de la altura**: Conocida el área y la base, $h = \frac{A}{b}$.

  - **Área y diagonales**: El área también equivale a $A = \frac{1}{2} d_1 d_2 \sin(\phi)$, donde $\phi$ es el ángulo de intersección entre las diagonales.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de área de paralelogramo](/static/img/nodos/calculo-del-area-de-un-paralelogramo-mediante-base-por-altura-ejemplos.svg)


    Un paralelogramo tiene una base de $12$ cm, un lado oblicuo de $7$ cm y una altura perpendicular relativa a la base de $5$ cm. Calcula el área del paralelogramo y su perímetro.'
  pasos:
  - 'Paso 1: Seleccionar los datos correctos para el área: Base $b = 12$ cm y altura perpendicular $h = 5$ cm (el lado de $7$ cm es un distractor para el área).'
  - 'Paso 2: Calcular el área aplicando $A = b \cdot h$: $A = 12\text{ cm} \cdot 5\text{ cm} = 60\text{ cm}^2$.'
  - 'Paso 3: Seleccionar los datos correctos para el perímetro: Base $a = 12$ cm y lado oblicuo $b = 7$ cm.'
  - 'Paso 4: Calcular el perímetro aplicando $P = 2(a + b)$: $P = 2(12 + 7) = 2(19) = 38$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué no se debe multiplicar la base por el lado inclinado para calcular el área de un paralelogramo oblicuo?
  choices:
  - text: Porque el lado inclinado es mayor que la distancia perpendicular real (altura), arrojando un área falsa e inflada.
    is_correct: true
  - text: Porque la fórmula base por lado solo se puede usar si la figura tiene tres lados.
    is_correct: false
  - text: Porque los lados inclinados siempre se cancelan con las diagonales.
    is_correct: false
  - text: Porque el área solo se puede calcular dividiendo entre dos como en el triángulo.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el lado inclinado es mayor que la distancia perpendicular real (altura), arrojando un área falsa e inflada.' En cualquier triángulo rectángulo la hipotenusa (lado oblicuo) es mayor que el cateto (altura perpendicular $h$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un paralelogramo tiene un área de 84 cm² y una base de 14 cm. ¿Cuánto mide su altura perpendicular?
  choices:
  - text: 6 cm.
    is_correct: true
  - text: 12 cm.
    is_correct: false
  - text: 70 cm.
    is_correct: false
  - text: 42 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''6 cm.'' Despejando de $A = b \cdot h$: $h = \frac{A}{b} = \frac{84}{14} = 6$ cm.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar la base $b$ y su altura perpendicular correspondiente $h$ (verificar el ángulo recto).

  2. Descartar la longitud del lado oblicuo para el cálculo de área.

  3. Multiplicar base por altura: $A = b \cdot h$.

  4. Expresar el resultado final en unidades cuadradas ($\text{cm}^2, \text{m}^2$).

  '
errores_correccion: '- **Error común 1:** Multiplicar base por lado oblicuo en lugar de base por altura. **Corrección:** La altura debe formar $90^\circ$ con la base.

  - **Error común 2:** Dividir entre 2 como si fuera un triángulo. **Corrección:** En el paralelogramo es $b \cdot h$ completo; se divide entre 2 solo en triángulos y rombos con diagonales.

  '
ejemplos:
- tipo: A
  titulo: Cálculo directo de área
  enunciado: Un paralelogramo tiene base $b = 15\text{ cm}$ y altura $h = 8\text{ cm}$. ¿Cuál es su área?
  alternativas:
  - text: $120\text{ cm}^2$.
    is_correct: true
  - text: $60\text{ cm}^2$.
    is_correct: false
  - text: $46\text{ cm}^2$.
    is_correct: false
  - text: $23\text{ cm}^2$.
    is_correct: false
  explicacion: $A = b \cdot h = 15 \cdot 8 = 120\text{ cm}^2$.
- tipo: B
  titulo: División entre 2 en área de paralelogramo
  enunciado: ¿Se divide por dos el producto base por altura al calcular el área de un paralelogramo?
  respuesta: 'No'
  explicacion: No. La fórmula es $A = b \cdot h$; dividir por dos daría el área de un solo triángulo.
errores_frecuentes:
- '''Multiplicar base por el lado adyacente en lugar de la altura perpendicular.'''
- '''Dividir entre 2 la fórmula confundiendo el paralelogramo con un triángulo.'''
- '''Olvidar asociar cada base con su altura respectiva ($b_1 h_1 = b_2 h_2$).'''
afirmaciones_verdaderas:
- '''El área de un paralelogramo es estrictamente igual al producto de su base por su altura perpendicular ($A = b \cdot h$).'''
- '''La altura perpendicular es siempre menor o igual a la longitud del lado oblicuo ($h \leq a$).'''
- '''Un paralelogramo y un rectángulo con la misma base y la misma altura tienen exactamente la misma área.'''
al_terminar_debes_poder: '**QUÉ:** Calcular con destreza el área de cualquier paralelogramo y despejar bases o alturas dadas condiciones métricas.


  **CÓMO:** Aplicando la relación fundamental $A = b \cdot h$ asegurando la perpendicularidad estricta $h \perp b$.


  ![Síntesis de área de paralelogramo](/static/img/nodos/calculo-del-area-de-un-paralelogramo-mediante-base-por-altura-resumen.svg)

  '
