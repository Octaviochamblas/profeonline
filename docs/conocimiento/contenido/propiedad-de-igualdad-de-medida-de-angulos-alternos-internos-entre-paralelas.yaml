semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.ALTERNOS_INTERNOS_IGUALDAD
resumen_inicial: Si dos rectas paralelas son cortadas por una transversal, los ángulos
  alternos internos tienen exactamente la misma medida angular.
explicacion_simple: '![Igualdad de Alternos Internos](/static/img/nodos/propiedad-de-igualdad-de-medida-de-angulos-alternos-internos-entre-paralelas-intro.svg)


  Cuando dos rectas paralelas son atravesadas por una línea secante, la inclinación
  es idéntica en ambos cruces. Por eso, los dos ángulos interiores de la letra "Z"
  miden exactamente lo mismo: si uno mide 50°, su alterno interno también mide 50°.'
explicacion_formal: '### Teorema formal

  En el plano euclidiano, si dos rectas paralelas $L_1$ y $L_2$ son cortadas por una
  transversal $T$, los ángulos alternos internos son estrictamente **congruentes**
  (tienen igual medida):


  $$L_1 \parallel L_2 \implies \alpha = \beta \quad (\text{Ángulos Alternos Internos})$$


  ### Desglose simbólico y geométrico

  - $L_1 \parallel L_2$: Hipótesis obligatoria de paralelismo estricto.

  - Demostración por simetría central: Una rotación de $180^\circ$ respecto al punto
  medio del segmento secante mapea un ángulo sobre el otro.

  - Igualdad analítica: $\mu(\angle 1) = \mu(\angle 2)$.


  ### Síntesis didáctica

  La igualdad de los ángulos alternos internos es el postulado clave que permite transferir
  medidas angulares entre líneas paralelas y demostrar que los ángulos de un triángulo
  suman $180^\circ$.'
definiciones_clave: '- **Teorema de alternos internos**: Si $L_1 \parallel L_2$, entonces
  $\alpha = \beta$ para todo par alterno interno.

  - **Recíproco del teorema**: Si dos rectas cortadas por una transversal determinan
  ángulos alternos internos congruentes, entonces las rectas son paralelas. '
propiedades_relaciones: '- **Igualdad algebraica**: Permite plantear ecuaciones directas
  del tipo $3x + 10^\circ = 70^\circ$.

  - **Transitividad con opuestos y correspondientes**: La igualdad se demuestra combinando
  ángulos correspondientes y opuestos por el vértice. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Igualdad de Alternos Internos](/static/img/nodos/propiedad-de-igualdad-de-medida-de-angulos-alternos-internos-entre-paralelas-ejemplos.svg)


    En una figura con $L_1 \parallel L_2$, dos ángulos alternos internos miden $\alpha
    = 4x - 15^\circ$ y $\beta = 2x + 25^\circ$. Encuentra el valor de $x$ y la medida
    de los ángulos.'
  pasos:
  - 'Paso 1: Por teorema de alternos internos entre paralelas, igualar: $4x - 15^\circ
    = 2x + 25^\circ$.'
  - 'Paso 2: Agrupar incógnitas: $4x - 2x = 25^\circ + 15^\circ$.'
  - 'Paso 3: Resolver: $2x = 40^\circ \implies x = 20^\circ$.'
  - 'Paso 4: Calcular la medida del ángulo: $4(20^\circ) - 15^\circ = 80^\circ - 15^\circ
    = 65^\circ$.'
  - 'Paso 5: Comprobar: $2(20^\circ) + 25^\circ = 65^\circ$. Ambos miden $65^\circ$.'
