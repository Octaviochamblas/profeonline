procedimiento:
- 'Paso 1: Verificar la hipótesis de paralelismo $L_1 \parallel L_2$.'
- 'Paso 2: Identificar el par de ángulos alternos internos.'
- 'Paso 3: Formular la igualdad $\alpha_1 = \alpha_2$.'
- 'Paso 4: Despejar la incógnita y calcular el valor numérico.'
errores_correccion: No confundas alternos internos (que son iguales) con colaterales
  internos (que suman 180°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si dos ángulos alternos internos entre paralelas miden $5x$ y $100^\circ$,
    ¿cuánto vale $x$?
  alternativas:
  - $20^\circ$
  - $10^\circ$
  - $50^\circ$
  respuesta: $20^\circ$
  solucion_pasos:
  - $5x = 100^\circ \implies x = 20^\circ$.
- titulo: Ejemplo 2
  enunciado: Si un ángulo alterno interno mide 120°, ¿cuánto mide su alterno interno
    correspondiente?
  alternativas:
  - $120^\circ$
  - $60^\circ$
  - $90^\circ$
  respuesta: $120^\circ$
  solucion_pasos:
  - Por propiedad de paralelismo, miden exactamente lo mismo: $120^\circ$.
- titulo: ¿La igualdad de alternos internos requiere obligatoriamente que las rectas
    sean paralelas?
  respuesta: Sí
  solucion_pasos:
  - Sí, si las rectas no son paralelas, los alternos internos no son iguales.
- titulo: ¿Dos ángulos alternos internos entre paralelas siempre suman 180°?
  respuesta: 'No'
  solucion_pasos:
  - No, son iguales entre sí; solo sumarían 180° si fueran ángulos rectos de 90°.
errores_frecuentes:
- Igualar a $180^\circ$ en vez de igualar las expresiones entre sí.
- Aplicar la propiedad en rectas que no son paralelas.
- Confundir ángulos alternos internos con colaterales internos.
- Equivocarse en el despeje algebraico con signos negativos.
- No comprobar la solución sustituyendo la incógnita en ambos ángulos.
afirmaciones_verdaderas:
- Los ángulos alternos internos entre rectas paralelas son siempre congruentes.
- Si dos ángulos alternos internos son iguales, las rectas son paralelas.
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad de igualdad de ángulos alternos
  internos para resolver problemas geométricos.


  **CÓMO:** Igualando las expresiones algebraicas $\alpha_1 = \alpha_2$ y despejando
  incógnitas bajo la condición $L_1 \parallel L_2$.


  ![Resumen de Igualdad de Alternos Internos](/static/img/nodos/propiedad-de-igualdad-de-medida-de-angulos-alternos-internos-entre-paralelas-resumen.svg)'
