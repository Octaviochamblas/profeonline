semantic_id: MAT.FUND.PROPIEDADES_CONJUNTOS.IDEMPOTENCIA_UNION
resumen_inicial: 'Demostración lógica, propiedades y consecuencias de la propiedad idempotente de la unión de conjuntos: $A \cup A = A$.'
explicacion_simple: |
  La **propiedad de idempotencia de la unión** afirma que **unir un conjunto consigo mismo da como resultado el mismo conjunto original**: **$A \cup A = A$**. Esto ocurre porque al juntar los elementos de $A$ con los mismos elementos de $A$, todos los elementos se repiten exactamente una vez, y en la teoría de conjuntos **los elementos repetidos no se duplican ni aumentan el tamaño del conjunto**. Por ejemplo, si $A = \{1, 2, 3\}$, entonces $\{1, 2, 3\} \cup \{1, 2, 3\} = \{1, 2, 3\} = A$.
explicacion_formal: |
  ### Definición formal
  En la teoría de conjuntos y el álgebra de Boole, la operación de unión es **idempotente**:
  $$\forall A \subseteq \mathcal{U}, \quad A \cup A = A$$
  Demostración formal basada en la idempotencia de la disyunción lógica ($\lor$):
  $$x \in (A \cup A) \iff (x \in A \lor x \in A) \iff x \in A$$
  Por el axioma de extensionalidad, se deduce la identidad $A \cup A = A$.

  ### Desglose simbólico
  - Tautología lógica subyacente: $P \lor P \equiv P$.
  - Invarianza de cardinalidad: $|A \cup A| = |A|$.
  - Idempotencia múltiple: $\bigcup_{i=1}^k A = A$ para cualquier $k \in \mathbb{N}$.

  ### Síntesis didáctica
  La idempotencia elimina la redundancia conjuntista y asegura que la agregación reiterada del mismo conjunto no modifique su estado ni su extensión.
definiciones_clave: |
  - **Idempotencia de la unión**: Propiedad donde la aplicación repetida de la operación sobre un mismo elemento no altera el resultado ($A \cup A = A$).
  - **Idempotencia lógica**: Tautología fundamental $P \lor P \equiv P$.
  - **Colapso de duplicados**: Principio derivado del axioma de extensionalidad.
propiedades_relaciones: |
  - **Simplificación de expresiones**: $A \cup A \cup A \cup \dots \cup A = A$.
  - **Unión con subconjuntos**: Si $A \subseteq A$, $A \cup A = A$ es un caso particular de $A \subseteq B \implies A \cup B = B$.
ejemplo_guiado:
  enunciado: 'Dado el conjunto $K = \{x \in \mathbb{Z} \mid 1 \leq x \leq 3\}$, demuestra mediante extensión y cardinalidad que $K \cup K = K$.'
  pasos:
    - 'Paso 1: Escribir el conjunto $K$ por extensión: $K = \{1, 2, 3\}$.'
    - 'Paso 2: Plantear la unión $K \cup K$: $\{1, 2, 3\} \cup \{1, 2, 3\}$.'
    - 'Paso 3: Listar los elementos resultantes omitiendo repeticiones: $\{1, 2, 3\}$.'
    - 'Paso 4: Comprobar la igualdad: $\{1, 2, 3\} = K$.'
    - 'Paso 5: Verificar las cardinalidades: $|K \cup K| = 3$ y $|K| = 3$, concluyendo que $|K \cup K| = |K|$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ley de la lógica proposicional sustenta la propiedad idempotente $A \cup A = A$?'
    choices:
      - {text: 'La idempotencia de la disyunción: $P \lor P \equiv P$', is_correct: true}
      - {text: 'El principio del tercero excluido: $P \lor \neg P \equiv V$', is_correct: false}
      - {text: 'La ley de De Morgan', is_correct: false}
      - {text: 'El modus ponens', is_correct: false}
    explanation: 'La alternativa correcta es ''La idempotencia de la disyunción: $P \lor P \equiv P$''. Pertenecer a $A$ o pertenecer a $A$ equivale simplemente a pertenecer a $A$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿A qué equivale la simplificación de la expresión $(A \cup B) \cup (A \cup B)$?'
    choices:
      - {text: '$A \cup B$', is_correct: true}
      - {text: '$2(A \cup B)$', is_correct: false}
      - {text: '$\emptyset$', is_correct: false}
      - {text: '$A \cap B$', is_correct: false}
    explanation: 'La alternativa correcta es ''$A \cup B$''. Cualquier bloque de conjuntos unido consigo mismo produce el mismo bloque por idempotencia.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la unión de un conjunto o bloque consigo mismo ($S \cup S$).'
  - 'Paso 2: Aplicar la ley lógica $x \in S \lor x \in S \iff x \in S$.'
  - 'Paso 3: Reemplazar directamente el término $S \cup S$ por una única instancia $S$.'
  - 'Paso 4: Verificar que la cardinalidad se mantiene invariante.'
errores_correccion: |
  - **Error 1:** Creer que $A \cup A$ duplica la cardinalidad a $2|A|$. **Cómo corregirlo:** La teoría de conjuntos ignora la multiplicidad de los elementos repetidos; $|A \cup A| = |A|$.
  - **Error 2:** Confundir la unión idempotente con la suma aritmética. **Cómo corregirlo:** En conjuntos no existe el concepto de sumar dos veces el mismo elemento ($A \cup A = A$, no $2A$).
ejemplos:
  - titulo: 'Idempotencia con conjunto unitario'
    enunciado: '¿Cuánto vale $\{5\} \cup \{5\}$?'
    alternativas:
      - '$\{5\}$'
      - '$\{5, 5\}$ con 2 elementos'
      - '$\{10\}$'
    respuesta: '$\{5\}$'
    solucion_pasos:
      - '1. Colapsa al mismo conjunto unitario $\{5\}$.'
  - titulo: 'Idempotencia del conjunto vacío'
    enunciado: '¿$\emptyset \cup \emptyset = \emptyset$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Por idempotencia de la unión aplicada al conjunto vacío.'
  - titulo: 'Simplificación de expresión larga'
    enunciado: 'Simplifica $A \cup B \cup A \cup B \cup A$.'
    respuesta: '$A \cup B$'
    solucion_pasos:
      - 'Por conmutatividad e idempotencia se reduce a $A \cup B$.'
  - titulo: 'Idempotencia del universo'
    enunciado: '¿Cuánto vale $\mathcal{U} \cup \mathcal{U}$?'
    respuesta: '$\mathcal{U}$'
    solucion_pasos:
      - 'El universo unido consigo mismo resulta en el universo.'
errores_frecuentes:
  - 'La afirmación de que unir un conjunto consigo mismo produce un conjunto con el doble de elementos.'
  - 'La afirmación de que la idempotencia de la unión solo se aplica a conjuntos finitos.'
  - 'La afirmación de que la expresión $A \cup A$ genera un nuevo conjunto con llaves dobles $\{\{A\}\}$.'
  - 'La afirmación de que la propiedad de idempotencia no es válida para el conjunto vacío.'
  - 'La afirmación de que la unión de conjuntos infinitos consigo mismos altera su orden de infinitud.'
afirmaciones_verdaderas:
  - 'La unión de cualquier conjunto consigo mismo es idéntica al propio conjunto ($A \cup A = A$).'
  - 'La propiedad de idempotencia de la unión es consecuencia directa de la tautología lógica $P \lor P \equiv P$.'
al_terminar_debes_poder: |
  QUÉ: Enunciar, demostrar y aplicar la propiedad de idempotencia de la unión ($A \cup A = A$).
  CÓMO: Simplificar repeticiones de conjuntos en uniones múltiples aplicando la equivalencia lógica $P \lor P \equiv P$.
