- titulo: ¿Se cumple siempre la propiedad principal de alineación del ortocentro,
    baricentro y circuncentro en triángulos no equiláteros en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede alineación del ortocentro, baricentro y circuncentro en triángulos
    no equiláteros asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
