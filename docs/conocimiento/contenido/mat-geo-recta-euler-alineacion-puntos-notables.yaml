semantic_id: MAT.GEO.RECTA_EULER.ALINEACION_PUNTOS_NOTABLES
resumen_inicial: 'Alineación del ortocentro, baricentro y circuncentro en triángulos
  no equiláteros: conceptos, teoremas, propiedades geométricas y cálculo en Elementos
  Secundarios del Triángulo.'
explicacion_simple: 'La alineación de O, G y H en la recta de Euler no es arbitraria:
  el baricentro siempre se ubica en una posición precisa entre los otros dos, dividiendo
  el segmento OH en una razón fija.'
explicacion_formal: '![Alineación de O, G y H con razón OG:GH = 1:2](/static/img/geometria/elementos-secundarios/recta-euler-alineacion-puntos-notables.svg)


  ### Definición formal


  Si O es el circuncentro, G el baricentro y H el ortocentro de un triángulo, se cumple
  $OG:GH=1:2$, es decir, $\vec{OH}=3\vec{OG}$, o equivalentemente $H=3G-2O$.


  ### Desarrollo didáctico


  Si la distancia de O a G es 4 cm, la distancia de G a H es el doble, 8 cm, y la
  distancia total de O a H es 4+8=12 cm. Esta relación vectorial es, de hecho, la
  fórmula usada para calcular el ortocentro a partir del baricentro y el circuncentro.'
definiciones_clave: '- **Alineación del ortocentro, baricentro y circuncentro en triángulos
  no equiláteros**: Elemento o propiedad fundamental en el estudio de elementos secundarios
  del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a alineación del ortocentro, baricentro y circuncentro
  en triángulos no equiláteros.'
ejemplo_guiado:
  enunciado: En el estudio de alineación del ortocentro, baricentro y circuncentro
    en triángulos no equiláteros, un triángulo posee ángulos interiores de medidas
    $78^\circ$, $4886^\circ$ y $\gamma$. Halla el valor exacto de $\gamma$.
  pasos:
  - Aplicar la regla propia de alineación del ortocentro, baricentro y circuncentro
    en triángulos no equiláteros y la suma de ángulos interiores.
  - 'Plantear la suma: $78^\circ + 4886^\circ + \gamma = 180^\circ \implies 4964^\circ
    + \gamma = 180^\circ$.'
  - Despejar $\gamma = 180^\circ - 4964^\circ = -4784^\circ$.
