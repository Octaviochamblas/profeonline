semantic_id: MAT.ALG.FUNCION_EVALUACION.PREIMAGEN_DESDE_VALOR
resumen_inicial: 'Determinación de preimagen a partir de una imagen dada: conceptos,
  representación y propiedades en Evaluación de funciones.'
explicacion_simple: Ahora el juego se invierte. En vez de darte el ingrediente y pedirte
  el resultado, te dan el resultado y te piden averiguar qué ingrediente lo produjo.
explicacion_formal: '### Definición formal


  Dada una función $f$ y un valor $y_0$ del codominio, hallar la preimagen de $y_0$
  es resolver la ecuación $f(x) = y_0$ en la variable $x$; el conjunto de soluciones
  que pertenecen al dominio de $f$ constituye $f^{-1}(\{y_0\})$.


  ### Desarrollo didáctico


  El procedimiento es el inverso de evaluar: en vez de sustituir $x$ y calcular $y$,
  ahora conoces $y$ y despejas $x$.


  Si $f(x) = 2x + 3$ y buscas qué $x$ produce $f(x) = 11$, resuelves $2x+3=11$, obteniendo
  $2x=8$, $x=4$. Por lo tanto, la preimagen de $11$ es $\{4\}$.'
definiciones_clave: '- **Determinación de preimagen a partir de una imagen dada**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a determinación de preimagen a partir de
  una imagen dada.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a determinación de
    preimagen a partir de una imagen dada.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a determinación de preimagen a partir
    de una imagen dada.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
