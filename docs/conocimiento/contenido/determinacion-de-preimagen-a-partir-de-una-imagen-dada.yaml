semantic_id: MAT.ALG.FUNCION_EVALUACION.PREIMAGEN_DESDE_VALOR
resumen_inicial: Determinar la preimagen a partir de una imagen dada consiste en resolver la ecuación resultante de igualar la regla funcional al valor de salida.
explicacion_simple: |
  Si conocemos el valor de salida $y_0$ (la imagen) y queremos hallar el valor de entrada $x$ (la preimagen):

  1. Tomamos la fórmula de la función $f(x)$.
  2. La igualamos al valor de la imagen: $f(x) = y_0$.
  3. Despejamos la variable $x$.
explicacion_formal: |
  Dada la función $f: A \to B$ y un valor de imagen $y_0 \in \text{Rec}(f)$, el conjunto de **preimágenes** $f^{-1}(\{y_0\})$ viene dado por la solución de la ecuación:

  $$f(x) = y_0 \quad \text{con } x \in \text{Dom}(f)$$

  **Desglose de la fórmula:**
  - $y_0$: Valor conocido de salida.
  - $x$: Incógnita de la ecuación a resolver.
definiciones_clave: |
  - **Cálculo de preimagen**: Resolución algebraica de $f(x) = y_0$ para hallar la variable independiente.
propiedades_relaciones: |
  - **Cantidad de preimágenes**: Una imagen puede tener una preimagen (función inyectiva), varias preimágenes (ej. funciones cuadráticas) o ninguna si $y_0 \notin \text{Rec}(f)$.
ejemplo_guiado:
  enunciado: "Dada la función $f(x) = 3x - 5$, determina la preimagen del valor $y = 16$."
  pasos:
    - 'Paso 1: Igualar la regla de la función al valor dado de la imagen: $3x - 5 = 16$.'
    - 'Paso 2: Sumar 5 en ambos miembros: $3x = 16 + 5 \implies 3x = 21$.'
    - 'Paso 3: Dividir entre 3: $x = \frac{21}{3} = 7$.'
    - 'Paso 4: Concluir que la preimagen de 16 es $x = 7$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Dada la función $f(x) = 3x - 5$, ¿cuál es la preimagen de $y = 16$?"
    choices:
      - {text: "$x = 7$", is_correct: true}
      - {text: "$x = 43$", is_correct: false}
      - {text: "$x = 11/3$", is_correct: false}
      - {text: "$x = 21$", is_correct: false}
    explanation: "La alternativa correcta es '$x = 7$'. $3(7) - 5 = 21 - 5 = 16$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Dada la función cuadrática $f(x) = x^2$, ¿cuáles son las preimágenes de $y = 25$?"
    choices:
      - {text: "$x = 5$ y $x = -5$", is_correct: true}
      - {text: "Solo $x = 5$", is_correct: false}
      - {text: "$x = 625$", is_correct: false}
      - {text: "No existen preimágenes en los reales.", is_correct: false}
    explanation: "La alternativa correcta es '$x = 5$ y $x = -5$'. Ambos elevados al cuadrado dan 25."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el valor de la imagen conocida $y_0$.'
  - 'Paso 2: Formular la ecuación $f(x) = y_0$.'
  - 'Paso 3: Resolver la ecuación despejando la incógnita $x$.'
  - 'Paso 4: Comprobar que los valores $x$ pertenezcan al dominio de la función.'
errores_correccion: |
  - **Error común:** Evaluar $f(y_0)$ en lugar de resolver $f(x) = y_0$.
  - **Cómo corregirlo:** Si te piden la preimagen de 16, NO sustituyas $x = 16$; iguala la fórmula a 16 y despeja $x$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de evaluación funcional.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de evaluación funcional.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Hallar la preimagen de $y = 10$ en $f(x) = 3x + 1$ se calcula evaluando $f(10) = 31$.'
  - 'La preimagen de $y = 0$ en cualquier función real es siempre la constante $x = 0$.'
  - 'Resolver $f(x) = y_0$ para hallar una preimagen genera una inecuación de orden en lugar de una ecuación.'
  - 'Si una función es cuadrática como $f(x) = x^2$, la imagen $y = 25$ posee una única preimagen dada por $x = 5$.'
  - 'Para encontrar la preimagen de un valor $y$, se intercambian los roles dividiendo la imagen entre el dominio.'
afirmaciones_verdaderas:
  - 'Determinar la preimagen a partir de una imagen $y_0$ consiste en resolver la ecuación $f(x) = y_0$ para hallar el valor de $x$ en el dominio.'
  - 'Una imagen dada puede poseer una, varias o ninguna preimagen dependiendo del tipo de función.'
al_terminar_debes_poder: |
  QUÉ: Determinar analíticamente la preimagen de una función a partir de una imagen dada.
  CÓMO: Plantear la ecuación $f(x) = y_0$, despejar la variable independiente $x$ y verificar su validez en el dominio.
