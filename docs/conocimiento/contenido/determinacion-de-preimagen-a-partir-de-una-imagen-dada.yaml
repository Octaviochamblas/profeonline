semantic_id: MAT.ALG.FUNCION_EVALUACION.PREIMAGEN_DESDE_VALOR
resumen_inicial: Determinar una preimagen desde una imagen dada consiste en igualar
  la fórmula de la función a dicho valor y resolver la ecuación resultante.
explicacion_simple: 'Si nos dan la imagen (la salida $y$) y nos piden hallar la preimagen
  (la entrada $x$):

  1. Tomamos la fórmula de la función (ejemplo: $f(x) = 4x - 3$).

  2. La igualamos al valor de la imagen conocida (ejemplo: $f(x) = 17 \implies 4x
  - 3 = 17$).

  3. Despejamos la $x$ como en cualquier ecuación lineal: $4x = 20 \implies x = 5$.

  4. El número $x = 5$ es la preimagen buscada.'
explicacion_formal: 'Dada una función $f(x)$ y una imagen conocida $y_0 \in \operatorname{Rec}(f)$,
  la **determinación de preimágenes** es la resolución del conjunto nivel:


  $$f^{-1}(\{y_0\}) = \{x \in \operatorname{Dom}(f) \mid f(x) = y_0\}$$


  **Desglose de la fórmula:**

  - Ecuación algebraica en $x$ donde la constante $y_0$ actúa como término independiente
  fijado.'
definiciones_clave: '- **Ecuación de preimagen ($f(x) = y_0$)**: Ecuación matemática
  que permite encontrar los valores de entrada $x$ que producen la salida $y_0$.'
propiedades_relaciones: '- **Posibilidad de múltiples preimágenes**: A diferencia
  de las imágenes que son únicas, una misma imagen $y_0$ puede tener más de una preimagen
  (como en $f(x) = x^2$ donde $y = 9$ tiene preimágenes $3$ y $-3$).'
ejemplo_guiado:
  enunciado: Dada la función cuadrática $f(x) = x^2 - 1$, halla todas las preimágenes
    correspondientes a la imagen $y = 8$.
  pasos:
  - 'Paso 1: Igualar la fórmula al valor de la imagen: $x^2 - 1 = 8$.Paso 2: Trasponer
    el $-1$ sumando: $x^2 = 8 + 1 \implies x^2 = 9$.Paso 3: Extraer raíz cuadrada
    a ambos lados: $x = \pm \sqrt{9} \implies x = 3 \quad \text{ó} \quad x = -3$.Paso
    4: Concluir que la imagen $y = 8$ tiene dos preimágenes válidas: $x_1 = 3$ y $x_2
    = -3$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al buscar las preimágenes de $y = 8$ en la función $f(x) = x^2 - 1$, ¿cuáles
    son los valores de $x$ obtenidos?
  choices:
  - text: $x = 3$ y $x = -3$
    is_correct: true
  - text: $x = 9$ únicamente
    is_correct: false
  - text: $x = 63$
    is_correct: false
  - text: No existen preimágenes
    is_correct: false
  explanation: La alternativa correcta es '$x = 3$ y $x = -3$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Es posible que una misma imagen $y_0$ posea dos preimágenes distintas
    en una función?
  choices:
  - text: Sí, como ocurre en las funciones cuadráticas donde dos preimágenes producen
      la misma salida.
    is_correct: true
  - text: No, está estrictamente prohibido en matemáticas.
    is_correct: false
  - text: Solo si la función no es real.
    is_correct: false
  - text: Solo cuando la preimagen es cero.
    is_correct: false
  explanation: La alternativa correcta es 'Sí, como ocurre en las funciones cuadráticas
    donde dos preimágenes producen la misma salida.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la expresión $f(x) = y_0$ usando el valor dado de la imagen.'
- 'Paso 2: Reemplazar $f(x)$ por su fórmula algebraica.'
- 'Paso 3: Resolver la ecuación resultante para despejar $x$.'
- 'Paso 4: Verificar que las soluciones $x$ pertenezcan al dominio de la función.'
errores_correccion: '- **Error común:** Evaluar $f(8)$ cuando piden la preimagen de
  $8$.

  - **Cómo corregirlo:** Si piden la PREIMAGEN de $8$, debes IGUALAR la función a
  $8$ ($f(x) = 8$) y despejar $x$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de evaluación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de evaluación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Evaluar una función consiste en reemplazar la preimagen x en la fórmula
    y calcular y?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de valorización funcional.
- titulo: ¿Se debe verificar que el número pertenezca al dominio antes de evaluar
    una raíz par?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar raíces de números negativos en $\\mathbb{R}$.
errores_frecuentes:
- Olvidar usar paréntesis al sustituir números negativos al elevar a potencias pares.
- Confundir la búsqueda de una imagen (evaluar $f(a)$) con la búsqueda de una preimagen
  (igualar $f(x) = b$).
- Pensar que la notación $f(x+3)$ equivale simplemente a sumar $3$ al resultado final
  de $f(x)$.
- Intentar evaluar valores que no pertenecen al dominio provocando divisiones por
  cero o raíces pares negativas.
- Buscar preimágenes en el eje vertical $Y$ o imágenes en el eje horizontal $X$ al
  interpretar un gráfico.
afirmaciones_verdaderas:
- Para evaluar una función $f(x)$ se reemplaza la variable $x$ por el valor dado respetando
  la jerarquía operacional.
- Para hallar la preimagen $x$ correspondiente a una imagen $y_0$ se debe resolver
  la ecuación $f(x) = y_0$.
al_terminar_debes_poder: Al finalizar este recurso podrás evaluar funciones a partir
  de fórmulas, tablas o gráficos, y determinar preimágenes respetando las restricciones
  del dominio.
