semantic_id: MAT.ALG.FUNCION_EVALUACION.PREIMAGEN_DESDE_VALOR
resumen_inicial: Determinar una preimagen consiste en igualar la fórmula de la función al valor de imagen dado y resolver la ecuación resultante para $x$.
explicacion_simple: '![Determinar una preimagen consiste en igualar la fórmula de la función al valor de imagen dado y resolver la ecuación resultante para $x$](/static/img/nodos/determinacion-de-preimagen-a-partir-de-una-imagen-dada-intro.svg)



  Si te dan el resultado final $y_0$ (la imagen) y te piden **¿de qué número $x$ proviene?** (la preimagen):

  1. Tomas la fórmula de la función y la igualas al número dado: $f(x) = y_0$.

  2. Despejas la incógnita $x$ usando las reglas del álgebra.


  Por ejemplo, si $f(x) = 2x - 3$ y te piden la preimagen de $11$:

  $$2x - 3 = 11 \implies 2x = 14 \implies x = 7$$


  La preimagen de $11$ es $7$.'
explicacion_formal: 'Dada una función $f: \text{Dom}(f) \to \mathbb{R}$ y un valor $y_0 \in \text{Rec}(f)$, el conjunto de **preimágenes** de $y_0$ es el conjunto solución de la ecuación:

  $$f(x) = y_0$$


  **Comportamiento según el tipo de función:**

  - **Funciones lineales/afines ($f(x) = mx + n$ con $m \neq 0$)**: Poseen exactamente una preimagen única para cada $y_0 \in \mathbb{R}$ ($x = \frac{y_0 - n}{m}$).

  - **Funciones cuadráticas ($f(x) = ax^2 + bx + c$)**: Pueden tener $2$, $1$ o ninguna preimagen real según el discriminante $\Delta$ de la ecuación $ax^2 + bx + (c - y_0) = 0$.

  - **Funciones constantes ($f(x) = k$)**: Si $y_0 = k$, todo el dominio son preimágenes; si $y_0 \neq k$, no existe ninguna preimagen.'
definiciones_clave: '- **Preimagen**: Valor de la variable independiente $x$ que satisface la igualdad $f(x) = y_0$.

  - **Ecuación funcional**: Expresión algebraica que se resuelve para determinar el valor de entrada original.'
propiedades_relaciones: '- **Inyectividad**: Si cada imagen tiene a lo más una preimagen, la función es inyectiva.

  - **Lectura gráfica**: Las preimágenes de $y_0$ son las abscisas donde la recta horizontal $y = y_0$ corta a la gráfica.'
ejemplo_guiado:
  enunciado: '![Ejemplo Determinar una preimagen consiste en igualar la fórmula de la función al valor de imagen dado y resolver la ecuación resultante para $x$](/static/img/nodos/determinacion-de-preimagen-a-partir-de-una-imagen-dada-ejemplos.svg)



    Dada la función cuadrática $f(x) = 2x^2 - 1$, determina todas las preimágenes del valor $31$.'
  pasos:
  - 'Paso 1: Plantear la ecuación igualando la regla al valor dado: $2x^2 - 1 = 31$.'
  - 'Paso 2: Sumar 1 a ambos miembros: $2x^2 = 32$.'
  - 'Paso 3: Dividir por 2: $x^2 = 16$.'
  - 'Paso 4: Extraer la raíz cuadrada considerando ambas soluciones reales: $x = \pm \sqrt{16} = \pm 4$.'
  - 'Paso 5: Concluir que el valor $31$ tiene dos preimágenes: $x = 4$ y $x = -4$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función lineal $f(x) = 5x + 4$, ¿cuál es la preimagen de 29?
  choices:
  - text: '5'
    is_correct: true
  - text: '149'
    is_correct: false
  - text: '6.6'
    is_correct: false
  - text: '25'
    is_correct: false
  explanation: La alternativa correcta es '5'. Se resuelve $5x + 4 = 29 \implies 5x = 25 \implies x = 5$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $g(x) = x^2 + 7$, ¿cuántas preimágenes reales tiene el número 3?
  choices:
  - text: Ninguna, porque x^2 = -4 no tiene soluciones reales.
    is_correct: true
  - text: 'Dos preimágenes: 2 y -2.'
    is_correct: false
  - text: 'Una preimagen: 3.'
    is_correct: false
  - text: Infinitas.
    is_correct: false
  explanation: La alternativa correcta es 'Ninguna, porque x^2 = -4 no tiene soluciones reales.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor de la imagen $y_0$ proporcionado en el problema.'
- 'Paso 2: Igualar la expresión algebraica de la función a dicho valor: $f(x) = y_0$.'
- 'Paso 3: Despejar algebraicamente la variable $x$ aplicando operaciones inversas.'
- 'Paso 4: Verificar que las soluciones encontradas pertenezcan al dominio de definición de la función.'
errores_correccion: '- **Error común:** Evaluar la función en el número dado calculando $f(y_0)$ en lugar de resolver la ecuación $f(x) = y_0$.

  - **Cómo corregirlo:** Recordar que si te dan la **imagen**, te están dando la salida $y$; debes buscar la entrada $x$ resolviendo la ecuación.'
ejemplos:
- titulo: 'Ejemplo 1: Función afín'
  enunciado: Halla la preimagen de $-8$ para la función $f(x) = 3x + 7$.
  alternativas:
  - '-5'
  - '-17'
  - '-1'
  - '5'
  respuesta: '-5'
  solucion_pasos:
  - 'Paso 1: Plantear $3x + 7 = -8$.'
  - 'Paso 2: $3x = -15 \implies x = -5$.'
- titulo: 'Ejemplo 2: Raíz cuadrada'
  enunciado: Determina la preimagen de $6$ en $g(x) = \sqrt{2x + 8}$.
  alternativas:
  - '14'
  - '20'
  - '10'
  - '12'
  respuesta: '14'
  solucion_pasos:
  - 'Paso 1: $\sqrt{2x + 8} = 6$.'
  - 'Paso 2: Elevar al cuadrado: $2x + 8 = 36$.'
  - 'Paso 3: $2x = 28 \implies x = 14$.'
- titulo: 'Ejemplo 3: Función racional'
  enunciado: ¿Cuál es la preimagen de $3$ en $h(x) = \frac{2x + 1}{x - 1}$?
  alternativas:
  - '4'
  - '2'
  - '-4'
  - '1'
  respuesta: '4'
  solucion_pasos:
  - 'Paso 1: $\frac{2x + 1}{x - 1} = 3 \implies 2x + 1 = 3(x - 1)$.'
  - 'Paso 2: $2x + 1 = 3x - 3 \implies x = 4$.'
- titulo: 'Ejemplo 4: Preimágenes cuadráticas'
  enunciado: Halla todas las preimágenes de $10$ en $f(x) = x^2 + 1$.
  alternativas:
  - 3 y -3
  - Solo 3
  - Solo -3
  - 9 y -9
  respuesta: 3 y -3
  solucion_pasos:
  - 'Paso 1: $x^2 + 1 = 10 \implies x^2 = 9$.'
  - 'Paso 2: $x = \pm 3$.'
errores_frecuentes:
- Sustituir el valor de la imagen en x en vez de resolver la ecuación.
- Olvidar la raíz negativa en ecuaciones cuadráticas.
- No verificar si el resultado pertenece al dominio en funciones racionales o con radicales.
afirmaciones_verdaderas:
- Calcular la preimagen de un valor y consiste en resolver la ecuación f(x) = y para encontrar los valores de x correspondientes.
- Una imagen puede poseer múltiples preimágenes si la función no es inyectiva.
al_terminar_debes_poder: '**QUÉ:** Determinar y calcular preimágenes de funciones algebraicas a partir de valores de salida.


  **CÓMO:** Igualando la regla funcional a la imagen dada y despejando algebraicamente la variable independiente.


  ![Resumen Determinar una preimagen consiste en igualar la fórmula de la función al valor de imagen dado y resolver la ecuación resultante para $x$](/static/img/nodos/determinacion-de-preimagen-a-partir-de-una-imagen-dada-resumen.svg)'
