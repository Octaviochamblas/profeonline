semantic_id: MAT.GEO.TRIANGULOS_DEF.LADOS
resumen_inicial: Los lados de un triángulo son los tres segmentos de recta que unen
  sus vértices, nombrados con la convención estándar de Euler con letras minúsculas
  (a, b, c) opuestas a cada vértice.
explicacion_simple: '![Lados de un Triángulo](/static/img/nodos/identificacion-de-los-tres-lados-de-un-triangulo-intro.svg)


  Las tres líneas rectas que forman el contorno de un triángulo son sus **lados**.
  Se pueden nombrar con los dos vértices de sus extremos (por ejemplo $\overline{AB}$)
  o con una sola letra minúscula que coincide con la esquina que tiene al frente:
  el lado $a$ está frente a la esquina $A$, el lado $b$ frente a $B$, y el lado $c$
  frente a $C$.'
explicacion_formal: '### Definición formal

  Los **lados** de un triángulo $\Delta ABC$ son los tres segmentos cerrados determinados
  por las parejas de vértices, cuyas longitudes euclidianas se denotan comúnmente
  con letras minúsculas homólogas al vértice opuesto:


  $$\operatorname{Lados}(\Delta ABC) = \{\overline{BC}, \overline{AC}, \overline{AB}\}
  \quad \text{con longitudes} \quad a = \|C - B\|, \; b = \|C - A\|, \; c = \|B -
  A\|$$


  ### Desglose simbólico y geométrico

  - $a = BC$: Longitud del lado opuesto al vértice $A$.

  - $b = AC$: Longitud del lado opuesto al vértice $B$.

  - $c = AB$: Longitud del lado opuesto al vértice $C$.

  - Segmentos métricos finitos: A diferencia de los rayos infinitos, los lados tienen
  longitud métrica escalar bien definida y positiva ($a, b, c > 0$).


  ### Síntesis didáctica

  La convención estándar de nombrar cada lado con la letra minúscula de su vértice
  opuesto simplifica la formulación algebraica de teoremas como Pitágoras, Tales y
  la ley del coseno.'
definiciones_clave: '- **Lado**: Segmento de recta que une dos vértices contiguos
  de un triángulo.

  - **Convención de Euler**: Asignación de letras minúsculas $a, b, c$ a los lados
  opuestos a los vértices $A, B, C$.

  - **Lados adyacentes**: Los dos lados que se intersectan en un vértice común. '
propiedades_relaciones: '- **Desigualdad triangular**: En todo triángulo, la suma
  de las longitudes de dos lados cualesquiera siempre es estrictamente mayor que el
  tercer lado ($a + b > c$, $a + c > b$, $b + c > a$).

  - **Perímetro**: Longitud total del contorno del triángulo ($P = a + b + c$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Lados de Triángulo](/static/img/nodos/identificacion-de-los-tres-lados-de-un-triangulo-ejemplos.svg)


    En el triángulo $\triangle ABC$, los lados miden $a = 7\text{ cm}$, $b = 10\text{
    cm}$ y $c = 12\text{ cm}$. Identifica cuál es el segmento que representa el lado
    $b$ y calcula el perímetro del triángulo.'
  pasos:
  - 'Paso 1: Recordar la convención de Euler: el lado $b$ es el segmento opuesto al
    vértice $B$.'
  - 'Paso 2: Identificar los extremos del lado opuesto a $B$: es el segmento $\overline{AC}$.'
  - 'Paso 3: Calcular el perímetro sumando los 3 lados: $P = a + b + c$.'
  - 'Paso 4: Sustituir valores: $P = 7 + 10 + 12 = 29\text{ cm}$.'
  - 'Paso 5: Concluir que el lado $b$ es $\overline{AC}$ ($10\text{ cm}$) y el perímetro
    es $29\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Según la convención de Euler, ¿cuál es el lado que se denota con la letra
    minúscula 'a'?
  choices:
  - text: El lado BC opuesto al vértice A
    is_correct: true
  - text: El lado AB adyacente a A
    is_correct: false
  - text: El lado AC adyacente a A
    is_correct: false
  - text: Cualquier lado elegido al azar
    is_correct: false
  explanation: Por convención estándar de Euler, la letra 'a' representa el lado BC
    opuesto al vértice A.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los lados de un triángulo miden 6 cm, 8 cm y 10 cm, ¿cuál es su perímetro?
  choices:
  - text: 24 cm (porque 6 + 8 + 10 = 24)
    is_correct: true
  - text: 48 cm
    is_correct: false
  - text: 14 cm
    is_correct: false
  - text: 18 cm
    is_correct: false
  explanation: Sumando las 3 longitudes se obtiene 24 cm (porque 6 + 8 + 10 = 24).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los tres segmentos que conforman el contorno del triángulo.'
- 'Paso 2: Nombrarlos con sus extremos ($\overline{AB}, \overline{BC}, \overline{CA}$).'
- 'Paso 3: Asociar a cada lado la letra minúscula correspondiente al vértice opuesto
  ($a, b, c$).'
- 'Paso 4: Calcular el perímetro sumando sus medidas ($P = a + b + c$).'
errores_correccion: 'No asignes la letra a al segmento que sale de A: el lado a siempre
  está enfrente (opuesto) al vértice A.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En el triángulo $ riangle PQR$, ¿cuál es el segmento opuesto al vértice
    $P$?
  alternativas:
  - $\overline{QR}$
  - $\overline{PQ}$
  - $\overline{PR}$
  respuesta: $\overline{QR}$
  solucion_pasos:
  - El lado opuesto al vértice $P$ es el segmento que une los otros dos vértices: $\overline{QR}$.
- titulo: Ejemplo 2
  enunciado: ¿Cómo se expresa el perímetro de un triángulo equilátero de lado $L$?
  alternativas:
  - $P = 3L$
  - $P = L^3$
  - $P = \frac{3}{L}$
  respuesta: $P = 3L$
  solucion_pasos:
  - Sumando sus tres lados iguales: $L + L + L = 3L$.
- titulo: ¿El lado opuesto al vértice C es el segmento AB?
  respuesta: Sí
  solucion_pasos:
  - Sí, el lado $c$ une los vértices $A$ y $B$, situándose frente a $C$.
- titulo: ¿El lado 'a' corresponde al segmento AB?
  respuesta: 'No'
  solucion_pasos:
  - No, $\overline{AB}$ es el lado $c$; el lado $a$ es $\overline{BC}$ (opuesto a
    $A$).
errores_frecuentes:
- Nombrar $a = \overline{AB}$ en vez de $a = \overline{BC}$.
- Olvidar la notación de segmento con barra superior $\overline{AB}$.
- Confundir perímetro (suma de lados) con semiperímetro ($p = P/2$).
- Creer que se pueden construir triángulos con cualquier terna de números (olvidar
  la desigualdad triangular).
- Confundir lados con medianas o alturas.
afirmaciones_verdaderas:
- Un triángulo tiene exactamente 3 lados.
- Cada lado en minúscula nombra al segmento opuesto a su vértice mayúscula correspondiente.
al_terminar_debes_poder: '**QUÉ:** Identificar, relacionar y nombrar correctamente
  los tres lados de un triángulo.


  **CÓMO:** Aplicando la convención de Euler ($a = \overline{BC}, b = \overline{AC},
  c = \overline{AB}$) y calculando el perímetro.


  ![Resumen de los Lados del Triángulo](/static/img/nodos/identificacion-de-los-tres-lados-de-un-triangulo-resumen.svg)'
