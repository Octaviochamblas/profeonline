semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_6
resumen_inicial: "Un número es divisible por 6 si cumple a la vez el criterio del 2 (es par) y el del 3 (suma de cifras múltiplo de 3)."
explicacion_simple: |
  El 6 tiene dos llaves mágicas: la llave del 2 y la llave del 3. Si un número puede abrir
  ambas puertas, ¡también puede abrir la puerta del 6! Si un número se puede dividir por 2
  y por 3 al mismo tiempo, entonces es divisible por 6. Es como tener un pase doble.
explicacion_formal: |
  Como $6=2\cdot3$ y $2,3$ son primos relativos, un número es divisible por 6 si y solo si
  cumple simultáneamente: (1) ser par (terminar en $0,2,4,6,8$), y (2) que la suma de sus
  cifras sea múltiplo de 3. Si falla cualquiera de las dos condiciones, no es divisible
  por 6.
definiciones_clave: |
  **Condición doble**: para ser divisible por 6, un número debe cumplir a la vez el
  criterio del 2 y el del 3, no basta con uno solo.
propiedades_relaciones: |
  Si un número falla el criterio del 2 (es impar), no hace falta revisar el del 3: ya se
  sabe que no es divisible por 6.
ejemplo_guiado:
  enunciado: "Determina si 918 es divisible por 6."
  pasos:
    - "Es par: termina en $8$."
    - "Suma de cifras: $9+1+8=18$, múltiplo de 3."
    - "Cumple ambas condiciones: 918 es divisible por 6."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué dos condiciones debe cumplir un número para ser divisible por 6?"
    choices:
      - {text: "Ser divisible por 2 y por 3 a la vez", is_correct: true}
      - {text: "Ser divisible por 2 o por 3", is_correct: false}
      - {text: "Terminar en 6", is_correct: false}
      - {text: "Ser divisible por 3 y por 9", is_correct: false}
    explanation: "La correcta es Ser divisible por 2 y por 3 a la vez: ambas condiciones deben cumplirse simultáneamente."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 234 divisible por 6?"
    choices:
      - {text: "Sí, es par y su suma de cifras (9) es múltiplo de 3", is_correct: true}
      - {text: "No, porque es par", is_correct: false}
      - {text: "No, porque la suma de cifras no es múltiplo de 3", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es Sí, es par y su suma de cifras (9) es múltiplo de 3: $2+3+4=9$, cumple ambas condiciones."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Observa la última cifra del número para verificar si es par. Si termina en 0, 2, 4, 6 u 8, continúa al Paso 2. Si es impar, el número no es divisible por 6 y el proceso termina.'
  - 'Paso 2: Suma todas las cifras del número.'
  - 'Paso 3: Verifica si la suma del Paso 2 es un múltiplo de 3. Si lo es, el número es divisible por 6. De lo contrario, no lo es.'
errores_correccion: |
  Un error frecuente es verificar solo una de las dos condiciones (por ejemplo, solo que
  sea par) y concluir que ya es divisible por 6. Otro error es aplicar el criterio del 3
  antes de descartar por el criterio del 2, perdiendo tiempo innecesariamente.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determina si el número $162$ es divisible por $6$."
    alternativas:
      - "Sí, es par y su suma de cifras es múltiplo de 3"
      - "No, es par pero su suma de cifras no es múltiplo de 3"
      - "No, es impar"
    respuesta: "Sí, es par y su suma de cifras es múltiplo de 3"
    solucion_pasos:
      - "Paso a: Verificamos si el número es par. Termina en $2$, por lo tanto, es par y divisible por $2$."
      - 'Paso b: Sumamos sus cifras: $1 + 6 + 2 = 9$. Como $9$ es un múltiplo de $3$ ($3 \cdot 3 = 9$), el número es divisible por $3$.'
      - "Paso c: Al cumplir ambas condiciones, concluimos que $162$ es divisible por $6$."
  - titulo: "Ejemplo 2"
    enunciado: "Comprueba si el número $215$ es divisible por $6$."
    alternativas:
      - "No, es impar"
      - "Sí, es par"
      - "No se puede determinar"
    respuesta: "No, es impar"
    solucion_pasos:
      - "Paso a: Verificamos si el número es par. Termina en $5$, por lo tanto, es impar."
      - "Paso b: Como no cumple la condición de ser divisible por $2$, no es necesario sumar las cifras. Concluimos inmediatamente que $215$ no es divisible por $6$."
  - titulo: "¿Es el número $528$ divisible por $6$?"
    respuesta: "Sí"
    solucion_pasos:
      - "El número $528$ termina en $8$, por lo que es par (divisible por $2$)."
      - 'Sumamos sus cifras: $5 + 2 + 8 = 15$. Dado que $15$ es un múltiplo de $3$ ($3 \cdot 5 = 15$), es divisible por $3$.'
      - "Como es divisible por $2$ y por $3$ a la vez, entonces $528$ es divisible por $6$."
  - titulo: "¿Es el número $742$ divisible por $6$?"
    respuesta: "No"
    solucion_pasos:
      - "El número $742$ es par porque termina en $2$."
      - "Sumamos sus cifras: $7 + 4 + 2 = 13$. Como $13$ no es un múltiplo de $3$, el número no es divisible por $3$."
      - "Dado que no cumple la divisibilidad por $3$, $742$ no es divisible por $6$."
errores_frecuentes:
  - "Creer que basta con que un número sea par para que ya sea divisible por 6, sin revisar la suma de sus cifras."
  - "Pensar que si la suma de cifras es múltiplo de 3, el número ya es divisible por 6 sin verificar que también sea par."
  - "Sumar incorrectamente las cifras, lo que altera el resultado de la divisibilidad por 3."
  - "Olvidar que se deben cumplir simultáneamente ambas condiciones (ser divisible por 2 y por 3)."
  - "Intentar aplicar el criterio a números decimales; los criterios de divisibilidad se aplican exclusivamente a números enteros."
afirmaciones_verdaderas:
  - "Un número divisible por 6 debe ser par y también divisible por 3."
  - "El número 108 es divisible por 6."
al_terminar_debes_poder: |
  Determinar la divisibilidad por 6 de cualquier número verificando ambas condiciones
  (divisible por 2 y por 3) de forma ordenada.
fuente: "Teoría de Números"
estado: publicado
