semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_6
resumen_inicial: Un número es divisible por 6 si es divisible simultáneamente por 2 y por 3.
explicacion_simple: 'El criterio de divisibilidad por 6 nos permite determinar rápidamente si un número entero se puede dividir exactamente por dicho valor sin necesidad de realizar la división larga completa. Aplicamos una regla sobre las cifras del número.


  ![Criterio de divisibilidad por 6](/static/img/nodos/criterio-de-divisibilidad-por-6-intro.svg)'
explicacion_formal: 'Un entero $n$ es divisible por $6$ si y solo si $2 \mid n \land 3 \mid n$, dado que $\operatorname{mcm}(2,3) = 6$.


  $$2 \mid n \land 3 \mid n \iff 6 \mid n$$


  > **Complemento didáctico:** Los criterios de divisibilidad son simplificaciones algebraicas basadas en la aritmética modular sobre las potencias de 10.'
definiciones_clave: '- **Criterio de divisibilidad**: Regla rápida sobre las cifras de un número para verificar si la división es exacta.'
propiedades_relaciones: '- **Aritmética modular**: Simplificación de cálculos al trabajar con residuos de potencias de 10.'
ejemplo_guiado:
  enunciado: 'Aplique el criterio de divisibilidad por 6 para verificar si la cifra dada cumple la condición.


    ![Ejemplo Criterio de divisibilidad por 6](/static/img/nodos/criterio-de-divisibilidad-por-6-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el procedimiento del criterio: comprobar los criterios del 2 y del 3.'
  - 'Paso 2: Aplicar la prueba: 432 es divisible por 6 porque es par (termina en 2) y $4+3+2=9$ (múltiplo de 3)..'
  - 'Conclusión: El número cumple el criterio de divisibilidad.'
