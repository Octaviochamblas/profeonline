  explanation: La alternativa correcta es 'Determinar la divisibilidad exacta sin necesidad de hacer la división larga'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la regla específica del criterio: comprobar los criterios del 2 y del 3.'
- 'Paso 2: Evaluar el resultado simplificado obtenido.'
- 'Paso 3: Concluir que el número es divisible si el resultado simplificado cumple la norma.'
errores_correccion: '- **Error 1: Un número es divisible por 6 si termina en la cifra 6.** **Cómo corregirlo:** Aplicar estrictamente la regla del criterio sobre las cifras especificadas en la definición formal.


  - **Error 2: Confundir los criterios de distintos números.** **Cómo corregirlo:** Memorizar la regla específica de cada divisor.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál número es divisible según este criterio?
  alternativas:
  - '432'
  - '433'
  - '430'
  respuesta: '432'
  solucion_pasos:
  - Aplicando el criterio se verifica que 432 cumple la propiedad.
- titulo: Ejemplo 2
  enunciado: Verifique si la afirmación 'El número 162 es divisible por 6.' es verdadera o falsa.
  alternativas:
  - Verdadera
  - Falsa
  - Depende del día
  respuesta: Verdadera
  solucion_pasos:
  - Se aplica el criterio para corroborar la validez de la proposición.
- titulo: ¿Permite este criterio evaluar la divisibilidad sin realizar la división larga?
  respuesta: Sí
  solucion_pasos:
  - Sí, los criterios simplifican el proceso de verificación de divisibilidad.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple estrictamente con la definición y criterios de divisibilidad.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación directa de los teoremas y criterios de divisibilidad determina un valor único.
  - texto: No es posible determinarlo con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios aritméticos proporcionan un método determinista completo.
- titulo: ¿Aplica la regla de sumar dígitos para el criterio de divisibilidad por 2?
  respuesta: 'No'
  solucion_pasos:
  - No, el criterio del 2 evalúa únicamente la última cifra par, no la suma de dígitos.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple estrictamente con la definición y criterios de divisibilidad.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación directa de los teoremas y criterios de divisibilidad determina un valor único.
  - texto: No es posible determinarlo con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los criterios aritméticos proporcionan un método determinista completo.
errores_frecuentes:
- Un número es divisible por 6 si termina en la cifra 6.
- Los criterios de divisibilidad se pueden aplicar únicamente a números enteros de dos dígitos.
- El criterio de divisibilidad por 6 requiere realizar la división larga completa en todos los casos.
- Un número impar puede ser divisible por un número par según los criterios de divisibilidad.
- Aplicar un criterio de divisibilidad cambia el valor numérico del número original.
afirmaciones_verdaderas:
- Un número es divisible por 6 si cumple simultáneamente los criterios de divisibilidad por 2 y por 3.
- Los criterios de divisibilidad permiten verificar la divisibilidad exacta de forma rápida sin hacer la división larga.
al_terminar_debes_ponder: Al terminar serás capaz de aplicar el criterio de divisibilidad por 6, verificando que sea par (divisible por 2) y que la suma de sus dígitos sea múltiplo de 3.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
al_terminar_debes_poder: '**QUÉ:** Evaluar la divisibilidad por 6 aplicando el criterio para números compuestos coprimos.


  **CÓMO:** Verificando en dos etapas independientes y obligatorias: 1° que el número sea par ($2 \mid n$) y 2° que la suma de sus dígitos sea múltiplo de 3 ($3 \mid n$).


  ![Resumen Criterio de divisibilidad por 6](/static/img/nodos/criterio-de-divisibilidad-por-6-resumen.svg)'
