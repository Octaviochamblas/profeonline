semantic_id: MAT.GEO.TEOREMA_TALES.MODELAMIENTO_SOMBRAS
resumen_inicial: 'Modelamiento de sombras proyectadas usando proporcionalidad de Tales:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: Una aplicación clásica y muy práctica del teorema de Tales es
  el cálculo de alturas de objetos altos (como árboles o edificios) usando la sombra
  que proyectan, comparada con la sombra de un objeto de altura conocida.
explicacion_formal: '![Modelamiento de sombras con proporcionalidad de Tales](/static/img/geometria/congruencia-semejanza/tales-modelamiento-sombras.svg)


  ### Definición formal


  Como los rayos del sol son prácticamente paralelos entre sí, dos objetos verticales
  bajo el mismo sol forman triángulos semejantes con sus respectivas sombras, cumpliendo
  $\frac{h_1}{s_1}=\frac{h_2}{s_2}$, donde $h$ es la altura y $s$ la sombra de cada
  objeto.


  ### Desarrollo didáctico


  Una persona de 1,7 m de altura proyecta una sombra de 2 m; un árbol cercano proyecta
  una sombra de 12 m en el mismo momento. Usando la proporción: $\frac{1,7}{2}=\frac{h}{12}$,
  se obtiene $h=\frac{1,7\times12}{2}=10,2$ m, la altura del árbol.'
