- titulo: ¿Se cumple siempre la propiedad principal de expresión de la tangente como
    cociente entre seno y coseno en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede expresión de la tangente como cociente entre seno y coseno asumir
