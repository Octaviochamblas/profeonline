semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.TANGENTE_COCIENTE
resumen_inicial: 'Expresión de la tangente como cociente entre seno y coseno: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Así como en el triángulo rectángulo la tangente es opuesto sobre
  adyacente, en la circunferencia unitaria esa misma relación se expresa como sinx
  sobre cosx, válida para cualquier ángulo donde cosx≠0.
explicacion_formal: '![Tangente como cociente entre seno y coseno](/static/img/geometria/trigonometria/trigid-tangente-cociente.svg)


  ### Definición formal


  Si $P=(\cos x,\sin x)$ es un punto sobre la circunferencia unitaria, la tangente
  se define como $\tan x=\dfrac{\sin x}{\cos x}$, siempre que $\cos x\neq0$.


  ### Desarrollo didáctico


  Esta identidad permite calcular la tangente de cualquier ángulo (incluyendo los
  no agudos) a partir de su seno y coseno, sin necesidad de un triángulo rectángulo.
  Por ejemplo, si sin150°=0,5 y cos150°=-√3/2, entonces tan150°=0,5/(-√3/2)≈-0,577.'
definiciones_clave: '- **Expresión de la tangente como cociente entre seno y coseno**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a expresión de la tangente como cociente entre
  seno y coseno.'
