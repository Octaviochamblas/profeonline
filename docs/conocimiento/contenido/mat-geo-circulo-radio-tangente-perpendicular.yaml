semantic_id: MAT.GEO.CIRCULO_RECTAS.RADIO_TANGENTE_PERPENDICULAR
resumen_inicial: 'Propiedad de perpendicularidad entre el radio y la tangente en el
  punto de tangencia: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia
  y Círculo.'
explicacion_simple: Existe una propiedad geométrica muy poderosa que conecta el radio
  de una circunferencia con cualquier recta tangente a ella.
explicacion_formal: '![Radio perpendicular a la tangente en el punto de tangencia](/static/img/geometria/circunferencia-circulo/circulo-radio-tangente-perpendicular.svg)


  ### Definición formal


  Si $L$ es tangente a una circunferencia de centro $O$ en el punto $T$, entonces
  $\overline{OT}\perp L$.


  ### Desarrollo didáctico


  Esta propiedad se puede demostrar por contradicción: si el radio OT no fuera perpendicular
  a la tangente, existiría otro punto de la recta más cercano a O que T, lo que implicaría
  que ese otro punto está dentro de la circunferencia, contradiciendo que L es tangente
  (toca la circunferencia en un solo punto).'
definiciones_clave: '- **Propiedad de perpendicularidad entre el radio y la tangente
  en el punto de tangencia**: Elemento o propiedad fundamental en el estudio de circunferencia
  y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a propiedad de perpendicularidad entre el radio
  y la tangente en el punto de tangencia.'
