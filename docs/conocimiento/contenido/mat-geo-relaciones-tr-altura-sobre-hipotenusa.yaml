semantic_id: MAT.GEO.RELACIONES_TR.ALTURA_SOBRE_HIPOTENUSA
resumen_inicial: 'Definición de la altura relativa a la hipotenusa en un triángulo
  rectángulo: conceptos, teoremas, propiedades geométricas y cálculo en Perímetros,
  Áreas y Teoremas.'
explicacion_simple: 'En un triángulo rectángulo, la altura que se traza desde el vértice
  del ángulo recto hacia la hipotenusa tiene un rol especial: divide al triángulo
  original en dos triángulos más pequeños, ambos semejantes entre sí y al original.'
explicacion_formal: '![Altura relativa a la hipotenusa](/static/img/geometria/areas-pitagoras/relaciones-tr-altura-sobre-hipotenusa.svg)


  ### Definición formal


  En un triángulo rectángulo ABC con ángulo recto en A, la altura $h$ relativa a la
  hipotenusa BC es el segmento AH, donde H es el pie de la perpendicular desde A hacia
  BC.


  ### Desarrollo didáctico


  Esta altura AH divide al triángulo ABC en dos triángulos más pequeños (ABH y ACH),
  ambos rectángulos y semejantes al triángulo original ABC — esta semejanza es la
  base de todas las relaciones métricas del triángulo rectángulo.'
definiciones_clave: '- **Definición de la altura relativa a la hipotenusa en un triángulo
  rectángulo**: Elemento o propiedad fundamental en el estudio de perímetros, áreas
  y teoremas.'
