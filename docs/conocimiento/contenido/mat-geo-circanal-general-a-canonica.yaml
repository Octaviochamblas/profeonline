procedimiento:
- 'Paso 1: Agrupa los términos en x y los términos en y por separado, dejando la constante
  F al otro lado de la igualdad.'
- 'Paso 2: Completa el cuadrado en cada grupo, sumando la misma cantidad a ambos lados
  de la ecuación.'
- 'Paso 3: Escribe la ecuación resultante en forma canónica y verifica que el término
  derecho (r²) sea positivo.'
