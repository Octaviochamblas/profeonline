semantic_id: MAT.GEO.CIRCUNFERENCIA_ANALITICA.GENERAL_A_CANONICA
resumen_inicial: 'Transformación de la ecuación general a la forma canónica de la
  circunferencia: conceptos, teoremas, propiedades geométricas y cálculo en Geometría
  Analítica Ampliada.'
explicacion_simple: Al completar los cuadrados de ambas variables y reagrupar los
  términos, la ecuación general revela finalmente su centro y su radio de forma explícita.
explicacion_formal: '![Conversión: forma general a canónica](/static/img/geometria/analitica/circanal-general-a-canonica.svg)


  ### Definición formal


  Dada $x^2+y^2+Dx+Ey+F=0$, se agrupan: $(x^2+Dx)+(y^2+Ey)=-F$. Completando ambos
  cuadrados: $\left(x+\dfrac{D}{2}\right)^2+\left(y+\dfrac{E}{2}\right)^2=-F+\left(\dfrac{D}{2}\right)^2+\left(\dfrac{E}{2}\right)^2$.


  ### Desarrollo didáctico


  Para $x^2+y^2-4x+6y-3=0$: agrupando, $(x^2-4x)+(y^2+6y)=3$. Completando: $(x-2)^2-4+(y+3)^2-9=3$,
  es decir, $(x-2)^2+(y+3)^2=16$. El centro es $(2,-3)$ y el radio es $\sqrt{16}=4$.'
definiciones_clave: '- **Transformación de la ecuación general a la forma canónica
