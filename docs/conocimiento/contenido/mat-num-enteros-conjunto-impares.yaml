semantic_id: MAT.NUM.ENTEROS_CONJUNTO.IMPARES
resumen_inicial: Los números impares se expresan de la forma $2k + 1$ (o $2k - 1$)
  con $k \in \mathbb{Z}$.
explicacion_simple: Un número entero es impar si al dividirlo entre dos deja como
  residuo una unidad. Se forman sumando o restando uno a cualquier número par, extendiéndose
  de forma alterna en toda la recta numérica tanto para valores positivos como negativos.
explicacion_formal: 'Un entero $n \in \mathbb{Z}$ se define como un **Número Impar**
  si existe un entero $k \in \mathbb{Z}$ tal que:


  $$n = 2k + 1 \quad \iff \quad n \equiv 1 \pmod 2$$


  **Desglose de la fórmula:**

  - $2k + 1$: Expresión estándar de un número entero impar para $k \in \mathbb{Z}$.

  - $n \equiv 1 \pmod 2$: Residuo unitario no nulo al dividir entre 2.

  - Alternativamente: $n = 2k - 1$ genera el mismo conjunto de números impares en
  $\mathbb{Z}$.


  > **Complemento didáctico:** La alternancia entre pares e impares garantiza que
  entre dos pares consecutivos siempre exista exactamente un número impar.'
definiciones_clave: '- **Número impar**: Entero de la forma $2k + 1$ que al dividirse
  entre 2 deja residuo igual a 1.

  - **Alternancia de paridad**: Secuencia intercalada par-impar-par-impar a lo largo
  de toda la recta numérica.'
propiedades_relaciones: '- **Suma de impares**: La suma de dos enteros impares da
  como resultado un número par.'
ejemplo_guiado:
  enunciado: Demuestre que el entero negativo $-7$ es impar hallando el valor de $k
    \in \mathbb{Z}$ en la fórmula $2k + 1$.
  pasos:
  - 'Paso 1: Plantear la ecuación $2k + 1 = -7$.'
  - 'Paso 2: Restar 1: $2k = -8$.'
  - 'Paso 3: Dividir entre 2: $k = -4 \in \mathbb{Z}$.'
  - 'Conclusión: Como $-4$ es un entero, $-7 = 2(-4) + 1$ es un número impar.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión algebraica general que representa a todo número
    impar para k en Z?
  choices:
  - text: 2k + 1 (o 2k - 1)
    is_correct: true
  - text: 2k
    is_correct: false
  - text: k + 2
    is_correct: false
  - text: k / 2
    is_correct: false
  explanation: La alternativa correcta es '2k + 1 (o 2k - 1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿qué valor de k demuestra que -7 es impar en 2k
    + 1?
  choices:
  - text: k = -4
    is_correct: true
  - text: k = -3
    is_correct: false
  - text: k = 4
    is_correct: false
  - text: k = -7
    is_correct: false
  explanation: La alternativa correcta es 'k = -4', calculando $2(-4) + 1 = -7$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Restar 1 al número dado.'
- 'Paso 2: Verificar si la cantidad resultante es divisible exactamente entre 2.'
- 'Paso 3: Concluir que el número es impar si responde a la forma $2k+1$.'
errores_correccion: '- **Error 1: Creer que la expresión $2k+1$ solo produce impares
  positivos.** **Cómo corregirlo:** Para $k = -3$, $2(-3) + 1 = -5$ (impar negativo).


  - **Error 2: Confundir números impares con números primos.** **Cómo corregirlo:**
  Números como 9 o 15 son impares pero no primos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes números es un entero impar negativo?
  alternativas:
  - '-11'
  - '-12'
  - '-4'
  respuesta: '-11'
  solucion_pasos:
  - $-11 = 2(-6) + 1$, por ende es un impar negativo.
- titulo: Ejemplo 2
  enunciado: Si sumamos dos números impares, ¿qué resultado obtenemos?
  alternativas:
  - Un número par
  - Un número impar
  - Depende del signo
  respuesta: Un número par
  solucion_pasos:
  - $(2k+1) + (2m+1) = 2(k+m+1)$, que es siempre par.
- titulo: ¿Es el número -1 un entero impar?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-1 = 2(-1) + 1$ es un entero impar.
- titulo: ¿Todos los números impares son números primos?
  respuesta: 'No'
  solucion_pasos:
  - No, el número 9 es impar pero es compuesto ($3 \times 3$).
errores_frecuentes:
- La expresión $2k + 1$ genera únicamente números impares de signo positivo.
- Todos los números impares son obligatoriamente números primos.
- Los números enteros negativos no pueden clasificarse como impares.
- La adición de dos números impares resulta siempre en otro número impar.
- El número 1 es el único entero impar que existe en la recta numérica.
afirmaciones_verdaderas:
- Los números impares tienen la forma $2k+1$ y dejan residuo 1 al dividirse por 2.
- La suma de dos números impares resulta siempre en un número par.
al_terminar_debes_poder: Al terminar serás capaz de determinar si un entero es impar,
  verificando que responda a la estructura $2k+1$ ($k \in \mathbb{Z}$) y que deje
  residuo 1 al dividirse por 2.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
