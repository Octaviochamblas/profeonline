semantic_id: MAT.NUM.ENTEROS_CONJUNTO.IMPARES
resumen_inicial: "Un número impar es todo entero que al dividirlo entre 2 deja resto 1. Se representa algebraicamente como $2n+1$."
explicacion_simple: |
  Un número impar es todo número que al dividirlo entre 2 siempre sobra uno. Si tienes 5 galletas y
  quieres repartirlas exactamente entre 2 personas, no puedes — siempre sobra una. Por eso 5 es
  impar. Los impares incluyen los negativos: -1, -3, -5… Pares e impares se turnan en la recta
  numérica.
explicacion_formal: |
  Un número impar no es divisible exactamente por $2$ y se representa algebraicamente como $2n+1$
  (o $2n-1$), con $n \in \mathbb{Z}$. La secuencia de impares es
  $\{\ldots, -5, -3, -1, 1, 3, 5, \ldots\}$.
definiciones_clave: |
  **Número impar**: entero de la forma $2n+1$, $n \in \mathbb{Z}$. **Impares consecutivos**: impares
  que difieren en dos unidades, como $2n+1, 2n+3, 2n+5$.
propiedades_relaciones: |
  La suma de dos impares es siempre par. El producto de dos impares es siempre impar. Todo impar es
  el sucesor o antecesor inmediato de un número par.
ejemplo_guiado:
  enunciado: "Demuestra que $-13$ es un número impar."
  pasos:
    - 'Se realiza la división $-13 \div 2$.'
    - 'El resultado es $-7$ con resto $1$, ya que $2 \cdot (-7) + 1 = -13$.'
    - "Como no es divisible exactamente por $2$, $-13$ es impar."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de estas expresiones representa siempre un número impar, para cualquier $n \\in \\mathbb{Z}$?"
    choices:
      - {text: "$2n$", is_correct: false}
      - {text: "$2n + 1$", is_correct: true}
      - {text: "$n + 1$", is_correct: false}
      - {text: "$4n$", is_correct: false}
    explanation: "La correcta es $2n + 1$, porque sumar 1 a un múltiplo de 2 siempre rompe la divisibilidad exacta por 2."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es $-21$ un número impar?"
    choices:
      - {text: "Sí, porque $-21 = 2(-11) + 1$", is_correct: true}
      - {text: "No, porque es negativo", is_correct: false}
      - {text: "No, porque $-21 \\div 2$ es exacta", is_correct: false}
      - {text: "No se puede determinar", is_correct: false}
    explanation: "La correcta es Sí, porque $-21 = 2(-11) + 1$, que es de la forma $2n+1$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Dividir el número entero por $2$ y verificar si el cociente no es exacto."
  - 'Paso 2: Comprobar que el número no puede expresarse como $2n$ con $n \in \mathbb{Z}$.'
  - "Paso 3: Para modelar algebraicamente, usar la expresión $2n + 1$ o $2n - 1$ según la conveniencia del problema."
errores_correccion: |
  Un error frecuente es pensar que el cero es impar "porque no es par positivo": el cero es par
  ($0=2\cdot 0$), no impar. Otro error es creer que la suma de dos impares siempre da impar; en
  realidad siempre da par, porque los dos "restos 1" se combinan en un múltiplo exacto de 2.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Demuestre que $15$ es un número impar usando su definición."
    alternativas:
      - '$15 = 2 \cdot 7 + 1$, no es divisible exactamente por $2$'
      - '$15 = 2 \cdot 7$, es par'
      - "$15$ no puede escribirse como $2n+1$"
    respuesta: "$15 = 2 \\cdot 7 + 1$, no es divisible exactamente por $2$"
    solucion_pasos:
      - 'Se realiza la división $15 \div 2$.'
      - 'El resultado es $7$ con resto $1$, ya que $2 \cdot 7 + 1 = 15$.'
      - "Como no es divisible exactamente por $2$, el número es impar."
  - titulo: "Ejemplo 2"
    enunciado: "Use la forma $2n + 1$ para dar un ejemplo de número impar negativo."
    alternativas:
      - "$n = -4$: $2(-4) + 1 = -7$"
      - "$n = -4$: $2(-4) + 1 = -9$"
      - "$n = 4$: $2(4) + 1 = 9$"
    respuesta: "$n = -4$: $2(-4) + 1 = -7$"
    solucion_pasos:
      - 'Se utiliza la forma general $2n + 1$ con $n \in \mathbb{Z}$.'
      - 'Se selecciona $n = -4$: $2 \cdot (-4) + 1 = -8 + 1 = -7$.'
      - "Resultado: $-7$ es un ejemplo de número impar negativo (forma general: $2n+1$ con $n < -1$)."
  - titulo: "¿Es $-9$ un número impar?"
    respuesta: "Sí"
    solucion_pasos:
      - '$-9 \div 2 = -4$ con resto $-1$ (no es exacta).'
      - "Alternativamente: $-9 = 2(-5) + 1$, que es de la forma $2n+1$."
      - "Por lo tanto, $-9$ sí es un número impar."
  - titulo: "¿Es $0$ un número impar?"
    respuesta: "No"
    solucion_pasos:
      - '$0 \div 2 = 0$ con resto $0$: la división es exacta.'
      - '$0 = 2 \cdot 0$, que es de la forma $2n$, lo que lo define como par.'
      - "Por lo tanto, $0$ no es impar."
errores_frecuentes:
  - "El cero es un número impar porque no es par positivo."
  - "Los números impares negativos no existen porque los impares son de conteo."
  - "La suma de dos números impares siempre da un número impar."
  - "Un número es impar si termina en $1, 3, 7$ o $9$, pero no si termina en $5$."
  - "$-7$ es par porque tiene signo negativo."
afirmaciones_verdaderas:
  - "El número 7 es impar."
  - "La suma de dos números impares siempre es un número par."
al_terminar_debes_poder: |
  Determinar si un entero cualquiera es impar, y representar algebraicamente un número impar o una
  secuencia de impares consecutivos usando $2n+1$.

fuente: "Álgebra Ximena Carreño p.8"
estado: publicado
