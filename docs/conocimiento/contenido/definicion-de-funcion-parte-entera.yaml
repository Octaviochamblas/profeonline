semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_DEFINICION
resumen_inicial: La función parte entera $f(x) = [x]$ (o escalón) asigna a cada número
  real el mayor número entero que es menor o igual a $x$.
explicacion_simple: 'La **función parte entera** (denotada $f(x) = [x]$ o $\lfloor
  x \rfloor$) aproxima cualquier número hacia el entero inmediatamente menor o igual
  a él (redondeo hacia abajo):

  - Para números positivos: $[3{,}7] = 3$, $[3{,}0] = 3$, $[0{,}9] = 0$.

  - Para números negativos (¡CUIDADO!): $[-2{,}3] = -3$ (porque $-3$ es el entero
  menor o igual a $-2{,}3$).'
explicacion_formal: 'La **función parte entera (o piso)** $f: \mathbb{R} \to \mathbb{Z}$
  se define formalmente como:


  $$[x] = \lfloor x \rfloor = \max \{k \in \mathbb{Z} \mid k \le x\}$$


  **Desglose de la fórmula:**

  - Propiedad del entero característico: Para todo $x \in \mathbb{R}$, existe un único
  $k \in \mathbb{Z}$ tal que $k \le x < k + 1$, donde $[x] = k$.'
definiciones_clave: '- **Función parte entera ($[x]$ o $\lfloor x \rfloor$)**: Función
  a tramos discontinuos que extrae la componente entera no superior a $x$.

  - **Propiedad del piso**: $k \le x < k + 1 \iff [x] = k$.'
propiedades_relaciones: '- **Dominio y Recorrido**: $\operatorname{Dom}([x]) = \mathbb{R}$
  y $\operatorname{Rec}([x]) = \mathbb{Z}$ (conjunto de los enteros).'
ejemplo_guiado:
  enunciado: Evalúa el valor de la función parte entera $f(x) = [x]$ para $x_1 = 4{,}8$,
    $x_2 = 5{,}0$ y $x_3 = -1{,}2$.
  pasos:
  - 'Paso 1: Para $x_1 = 4{,}8$: buscar los enteros entre los que se ubica $4 \le
    4{,}8 < 5 \implies [4{,}8] = 4$.Paso 2: Para $x_2 = 5{,}0$: por ser entero exacto
    $5 \le 5{,}0 < 6 \implies [5{,}0] = 5$.Paso 3: Para $x_3 = -1{,}2$: buscar los
    enteros entre los que se ubica $-2 \le -1{,}2 < -1 \implies [-1{,}2] = -2$.Paso
    4: Concluir las evaluaciones: $4$, $5$ y $-2$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar la función parte entera en $x = -1{,}2$, ¿cuál es el valor
    numérico obtenido?
  choices:
  - text: $[-1{,}2] = -2$
    is_correct: true
  - text: $[-1{,}2] = -1$
    is_correct: false
  - text: $[-1{,}2] = 1$
    is_correct: false
  - text: $[-1{,}2] = 0$
    is_correct: false
  explanation: La alternativa correcta es '$[-1{,}2] = -2$'. (Puesto que $-2$ es el
    mayor entero menor o igual a $-1{,}2$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el conjunto recorrido $\operatorname{Rec}(f)$ de la función parte
    entera $f(x) = [x]$ en los reales?
  choices:
  - text: El conjunto de los números enteros $\mathbb{Z}$.
    is_correct: true
  - text: El conjunto de los números reales $\mathbb{R}$.
    is_correct: false
  - text: El intervalo $[0, 1[$.
    is_correct: false
  - text: El conjunto de los números irracionales.
    is_correct: false
  explanation: La alternativa correcta es 'El conjunto de los números enteros $\mathbb{Z}$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar el número $x$ en la recta numérica.'
- 'Paso 2: Mirar hacia la izquierda en la recta numérica para hallar el primer número
  entero.'
- 'Paso 3: Declarar ese entero como el resultado $[x]$.'
errores_correccion: '- **Error común:** Escribir $[-1{,}2] = -1$ (pensar que simplemente
  se ''trunca'' la parte decimal).

  - **Cómo corregirlo:** La parte entera busca el entero MENOR o igual. En la recta
  numérica, a la izquierda de $-1{,}2$ está el $-2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de simetrías y funciones especiales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de simetrías y funciones especiales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función par cumple la identidad de simetría f(-x) = f(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de función par con simetría en el eje Y.
- titulo: ¿La función parte entera [x] devuelve el mayor entero menor o igual a x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de la función piso o parte entera.
errores_frecuentes:
- Confundir las funciones pares (simetría eje Y) con las funciones impares (simetría
  respecto al origen).
- Asumir que toda función real debe ser obligatoriamente par o impar, ignorando el
  caso sin paridad.
- Creer que una función impar o par debe tener coeficientes pares o impares respectivamente.
- 'Calcular la parte entera de números negativos truncando decimales en lugar de redondear
  al entero menor (ej: $[-1{,}2] = -2$).'
- Unir los escalones horizontales de la función parte entera con líneas verticales
  en lugar de dejarlos discontinuos.
afirmaciones_verdaderas:
- Una función es par si $f(-x) = f(x)$ (simétrica respecto al eje $Y$) e impar si
  $f(-x) = -f(x)$ (simétrica respecto al origen $(0,0)$).
- La función parte entera $f(x) = [x]$ asigna a cada real el mayor entero menor o
  igual a $x$, generando una gráfica escalonada discontinua.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y clasificar
  simetrías de funciones pares e impares, así como graficar y aplicar la función parte
  entera en contextos de cobro por tramos y finanzas.
