semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_DEFINICION
resumen_inicial: 'Definición de función parte entera: conceptos, representación y
  propiedades en Simetrías y funciones especiales.'
explicacion_simple: 'Si tienes 7,9 años de experiencia y alguien te pregunta "¿cuántos
  años completos tienes de experiencia?", la respuesta no es 8: es 7. Esa operación
  de "quedarse con lo completo, sin redondear hacia arriba" es la función parte entera.'
explicacion_formal: '### Definición formal


  La función parte entera se define como $\lfloor x \rfloor = \max\{n \in \mathbb{Z}
  : n \leq x\}$: el mayor entero $n$ tal que $n \leq x$. Para $x$ ya entero, $\lfloor
  x \rfloor = x$; para $x$ no entero, se "redondea hacia abajo" siempre, incluso si
  $x$ es negativo.


  ### Desarrollo didáctico


  Un error común es pensar que la parte entera es simplemente "quitar los decimales",
  pero eso solo funciona para números positivos. Para negativos, el redondeo hacia
  abajo va en la dirección opuesta a la intuición decimal.


  $\lfloor 5{,}7 \rfloor = 5$ (el mayor entero menor o igual a 5,7). Pero $\lfloor
  -5{,}7 \rfloor = -6$ (no $-5$), porque $-6$ es el mayor entero que sigue siendo
  menor o igual a $-5{,}7$.'
definiciones_clave: '- **Definición de función parte entera**: Elemento central en
  el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a definición de función parte entera.'
