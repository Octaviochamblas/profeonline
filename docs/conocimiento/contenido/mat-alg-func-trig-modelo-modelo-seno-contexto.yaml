semantic_id: MAT.ALG.FUNC_TRIG_MODELO.MODELO_SENO_CONTEXTO
resumen_inicial: 'Modelamiento de fenómenos periódicos mediante función seno: círculo
  unitario, amplitud, período y transformaciones de Modelamiento trigonométrico y
  extensiones.'
explicacion_simple: Cuando un fenómeno comienza en su valor promedio y su primer movimiento
  es de ascenso, conviene usar la función seno como base del modelo.
explicacion_formal: '### Definición formal


  El seno básico comienza en $0$ (su línea media) y sube hacia el máximo. Si el fenómeno
  tiene ese comportamiento en el instante de referencia, conviene modelarlo con $f(t)=a\sin(b(t-c))+d$,
  ajustando amplitud, periodo, desfase y línea media según los datos observados.


  ### Desarrollo didáctico


  La altura de una rueda de la fortuna, medida desde su centro, comienza en $0$ (a
  la altura del eje) y sube; esto sugiere un modelo tipo seno: $h(t)=a\sin(bt)+d$,
  donde $a$ es el radio de la rueda y $d$ la altura del eje respecto al suelo.'
definiciones_clave: '- **Modelamiento de fenómenos periódicos mediante función seno**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a modelamiento de fenómenos periódicos mediante función seno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    modelamiento de fenómenos periódicos mediante función seno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de modelamiento de fenómenos periódicos mediante función
    seno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
