semantic_id: MAT.ALG.FUNC_TRIG_MODELO.MODELO_SENO_CONTEXTO
resumen_inicial: 'Construcción e interpretación de modelos contextuados mediante la función seno $y(t) = A\sin(Bt + C) + D$.'
explicacion_simple: |
  Para construir un modelo matemático con la función **seno**, utilizamos la ecuación $y(t) = A\sin(Bt + C) + D$. Es ideal usar el seno cuando el fenómeno que estamos estudiando comienza en el momento inicial ($t = 0$) en su punto medio o valor promedio (la línea media). Para armar la fórmula, calculamos la línea media $D$ promediando el valor más alto y el más bajo, la amplitud $A$ restando el centro de la cima, y la frecuencia $B$ dividiendo $2\pi$ entre el tiempo del ciclo.
explicacion_formal: |
  ### Definición formal
  El **modelo senoidal de un fenómeno contextual** es la función $y: \mathbb{R} \to [y_{\min}, y_{\max}]$ que describe la magnitud $y$ en el instante $t$ mediante:
  $$y(t) = A\sin(Bt + C) + D$$
  donde los coeficientes se obtienen a partir de las condiciones observadas del sistema:
  1. Línea media: $D = \frac{y_{\max} + y_{\min}}{2}$
  2. Amplitud: $A = \frac{y_{\max} - y_{\min}}{2}$
  3. Frecuencia angular: $B = \frac{2\pi}{T}$
  4. Desfase $C$: Se calcula imponiendo la condición inicial $y(0) = y_0$.

  ### Desglose simbólico
  - $y(0) = D$ (si $C = 0$): La función inicia en la línea media.
  - $y\left(\frac{T}{4}\right) = D + A$: Alcanza su cresta a un cuarto del período.
  - $y\left(\frac{T}{2}\right) = D$: Retorna a la línea media a la mitad del período.

  ### Síntesis didáctica
  La función seno es la opción preferida de modelamiento cuando el fenómeno se encuentra en su valor promedio en $t=0$ y comienza a aumentar inmediatamente después.
definiciones_clave: |
  - **Modelo senoidal**: Representación algebraica mediante la función seno adaptada a variables del mundo real.
  - **Condición de inicio en la línea media**: Propiedad por la cual en $t=0$ la variable se ubica en su valor promedio $D$.
  - **Unidades de contexto**: Unidades físicas asociadas a la variable dependiente $y$ (metros, grados, voltios) e independiente $t$ (segundos, meses).
propiedades_relaciones: |
  - **Convertibilidad a coseno**: Cualquier modelo senoidal $A\sin(Bt+C)+D$ puede expresarse idénticamente usando coseno desfasando el argumento en $\frac{\pi}{2}$ radianes.
  - **Sensibilidad de parámetros**: Un error al medir el período $T$ distorsiona la predicción de $y(t)$ en todos los instantes futuros.
ejemplo_guiado:
  enunciado: 'Un muelle oscila en el agua. Su profundidad promedio es $D = 8$ metros, su oscilación máxima sube $3$ metros por encima de la media y completa un ciclo en $12$ horas. Escribe el modelo senoidal $h(t)$ suponiendo que en $t = 0$ la profundidad es de $8$ metros y está aumentando.'
  pasos:
    - 'Paso 1: Identificar la línea media dada: $D = 8$ metros.'
    - 'Paso 2: Identificar la amplitud dada: $A = 3$ metros.'
    - 'Paso 3: Calcular el coeficiente de frecuencia $B$ con $T = 12$: $B = \frac{2\pi}{12} = \frac{\pi}{6}$.'
    - 'Paso 4: Verificar la condición en $t=0$: $h(0) = 3\sin(0) + 8 = 8$, lo que concuerda con $C = 0$.'
    - 'Paso 5: Escribir el modelo final: $h(t) = 3\sin\left(\frac{\pi}{6}t\right) + 8$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un modelo senoidal del tipo $y(t) = A\sin(Bt) + D$, ¿cuál es el valor de la función en $t = 0$?'
    choices:
      - {text: 'El valor de la línea media $y(0) = D$', is_correct: true}
      - {text: 'El valor máximo $y(0) = D + A$', is_correct: false}
      - {text: 'El valor mínimo $y(0) = D - A$', is_correct: false}
      - {text: 'El valor nulo $y(0) = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor de la línea media $y(0) = D$''. Como $\sin(0) = 0$, resulta $y(0) = A(0) + D = D$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para la función de marea $h(t) = 3\sin\left(\frac{\pi}{6}t\right) + 8$, ¿a qué hora $t$ alcanza la marea su máxima altura de $11$ metros por primera vez?'
    choices:
      - {text: 'A las $t = 3$ horas', is_correct: true}
      - {text: 'A las $t = 6$ horas', is_correct: false}
      - {text: 'A las $t = 12$ horas', is_correct: false}
      - {text: 'A las $t = 1$ hora', is_correct: false}
    explanation: 'La alternativa correcta es ''A las $t = 3$ horas''. En la función seno pura, el máximo se alcanza a un cuarto del período: $\frac{12}{4} = 3$ horas.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las cotas extremas $y_{\max}$ e $y_{\min}$ o la línea media $D$ en el contexto.'
  - 'Paso 2: Calcular la amplitud $A = \frac{y_{\max} - y_{\min}}{2}$ y la línea media $D = \frac{y_{\max} + y_{\min}}{2}$.'
  - 'Paso 3: Determinar el período $T$ y calcular la frecuencia $B = \frac{2\pi}{T}$.'
  - 'Paso 4: Evaluar las condiciones iniciales para ajustar el desfase $C$ y escribir la función $y(t) = A\sin(Bt+C)+D$.'
errores_correccion: |
  - **Error 1:** Usar el modelo senoidal sin desfase ($C=0$) cuando en $t=0$ el fenómeno se encuentra en su punto máximo. **Cómo corregirlo:** Si el fenómeno arranca en la cima en $t=0$, debe usarse la función coseno o añadir un desfase $C = \frac{\pi}{2}$ al seno.
  - **Error 2:** Medir el ángulo en grados dentro de la fórmula $B t$. **Cómo corregirlo:** La frecuencia $B = \frac{2\pi}{T}$ exige operar en radianes para mantener consistencia con las unidades temporales.
ejemplos:
  - titulo: 'Modelo de marea en el muelle'
    enunciado: 'Si $y(t) = 4\sin\left(\frac{\pi}{12}t\right) + 6$ representa el nivel del agua en metros, ¿cuál es el nivel en $t = 0$?'
    alternativas:
      - '$6$ metros'
      - '$10$ metros'
      - '$4$ metros'
    respuesta: '$6$ metros'
    solucion_pasos:
      - '1. $y(0) = 4\sin(0) + 6 = 6$.'
      - '2. En el inicio el nivel coincide con la línea media de $6$ metros.'
  - titulo: 'Período del modelo senoidal'
    enunciado: '¿Cuál es el período en horas del modelo $y(t) = \sin\left(\frac{\pi}{12}t\right)$?'
    alternativas:
      - '$24$ horas'
      - '$12$ horas'
      - '$6$ horas'
    respuesta: '$24$ horas'
    solucion_pasos:
      - '1. $B = \frac{\pi}{12}$.'
      - '2. $T = \frac{2\pi}{\pi/12} = 24$ horas.'
  - titulo: 'Valor máximo del modelo'
    enunciado: '¿El nivel máximo que alcanza el agua en $y(t) = 4\sin\left(\frac{\pi}{12}t\right) + 6$ es $10$ metros?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $y_{\max} = D + A = 6 + 4 = 10$ metros.'
  - titulo: 'Valor mínimo del modelo'
    enunciado: '¿El nivel mínimo del agua en dicho modelo es $2$ metros?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $y_{\min} = D - A = 6 - 4 = 2$ metros.'
errores_frecuentes:
  - 'La afirmación de que el modelo senoidal $y(t) = A\sin(Bt) + D$ arranca en su valor máximo en $t = 0$.'
  - 'La afirmación de que el parámetro $B$ en un modelo de contexto es igual al período de horas directamente.'
  - 'La afirmación de que el término independiente $D$ representa la amplitud de la oscilación de la marea.'
  - 'La afirmación de que para evaluar la función en horas se debe convertir el argumento a grados sexagesimales.'
  - 'La afirmación de que la función seno no puede utilizarse si la variable $y$ toma valores negativos.'
afirmaciones_verdaderas:
  - 'El modelo senoidal $y(t) = A\sin(Bt + C) + D$ es la opción óptima de modelamiento cuando la variable contextual inicia su oscilación en la línea media en $t = 0$.'
  - 'Los parámetros del modelo contextual senoidal relacionan directamente la amplitud física $|A|$, el período temporal $T = \frac{2\pi}{B}$ y el valor promedio de equilibrio $D$.'
al_terminar_debes_poder: |
  QUÉ: Construir e interpretar un modelo matemático senoidal $y(t) = A\sin(Bt + C) + D$ en contextos reales.
  CÓMO: Deducir $A$, $B$ y $D$ a partir de la línea media, la amplitud física y la duración del ciclo $T$.
