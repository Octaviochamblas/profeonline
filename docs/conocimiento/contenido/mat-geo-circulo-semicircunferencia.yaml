semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.SEMICIRCUNFERENCIA_DEFINICION
resumen_inicial: 'Definición de semicircunferencia como arco correspondiente a medio
  giro: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia y
  Círculo.'
explicacion_simple: 'Entre todos los arcos posibles de una circunferencia, existe
  un caso especial de gran importancia: aquel determinado por los extremos de un diámetro.'
explicacion_formal: '![Semicircunferencia: arco de medio giro](/static/img/geometria/circunferencia-circulo/circulo-semicircunferencia.svg)


  ### Definición formal


  Si $A$ y $B$ son los extremos de un diámetro de una circunferencia, cada uno de
  los dos arcos que determinan (ambos iguales) es una semicircunferencia, correspondiente
  a un ángulo central de 180°.


  ### Desarrollo didáctico


  Un diámetro siempre divide a la circunferencia en dos semicircunferencias exactamente
  iguales; esta es la única forma en que dos arcos determinados por dos puntos resultan
  ser iguales entre sí.'
