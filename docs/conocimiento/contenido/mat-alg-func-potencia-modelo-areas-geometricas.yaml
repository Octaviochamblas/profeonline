semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.AREAS_GEOMETRICAS
resumen_inicial: 'El área de cualquier figura geométrica semejante modelada en función de su dimensión lineal $x$ responde a una función potencia cuadrática $A(x) = a x^2$.'
explicacion_simple: |
  Todas las fórmulas de área en geometría plana (como el área de un cuadrado $A = s^2$, de un círculo $A = \pi r^2$ o de un triángulo equilátero $A = \frac{\sqrt{3}}{4} s^2$) son funciones potencia con exponente $2$. Como el área mide una superficie bidimensional (ancho por alto), cuando la dimensión lineal $x$ se multiplica por un número $c$, el área resultante no se multiplica por $c$, sino por $c^2$. Por ejemplo, si duplicamos el radio de una pizza ($2r$), su superficie comestible se vuelve 4 veces más grande ($2^2 = 4$).
explicacion_formal: |
  ### Definición formal
  El **modelamiento de áreas de figuras planas semejantes** en función de una dimensión característica lineal $x > 0$ se define por la **función potencia cuadrática**:
  $$A(x) = a \cdot x^2$$
  donde:
  - **$x$**: Longitud o dimensión lineal característica (lado, radio, diagonal, perímetro).
  - **$A(x)$**: Área de la superficie bidimensional.
  - **$a$**: Factor de forma geométrico constante ($a > 0$).

  ### Factores de Forma Geométricos Típicos ($a$)
  1. **Cuadrado de lado $s$**: $A(s) = 1 \cdot s^2 \implies a = 1$.
  2. **Círculo de radio $r$**: $A(r) = \pi \cdot r^2 \implies a = \pi \approx 3.1416$.
  3. **Triángulo Equilátero de lado $s$**: $A(s) = \frac{\sqrt{3}}{4} \cdot s^2 \implies a = \frac{\sqrt{3}}{4}$.
  4. **Hexágono Regular de lado $s$**: $A(s) = \frac{3\sqrt{3}}{2} \cdot s^2 \implies a = \frac{3\sqrt{3}}{2}$.

  ### Teorema de Escalamiento de Superficie
  Para dos figuras planas semejantes $F_1$ y $F_2$ con razón de semejanza lineal $c = \frac{x_2}{x_1}$:
  $$\frac{\text{Área}(F_2)}{\text{Área}(F_1)} = \frac{a x_2^2}{a x_1^2} = \left(\frac{x_2}{x_1}\right)^2 = c^2$$
  La razón entre las áreas de dos figuras semejantes es igual al cuadrado de la razón de semejanza lineal.
definiciones_clave: |
  - **Función área cuadrática $A(x) = a x^2$**: Modelo potencia de exponente 2 que describe superficies.
  - **Factor de forma $a$**: Constante adimensional o numérica que depende exclusivamente de la geometría de la figura.
  - **Razón de áreas $c^2$**: Cuadrado de la razón de semejanza entre dimensiones lineales de figuras semejantes.
propiedades_relaciones: |
  - **Dominio geométrico**: $x \in ]0, +\infty[$, ya que las longitudes reales deben ser estrictamente positivas.
  - **Recorrido geométrico**: $A \in ]0, +\infty[$.
ejemplo_guiado:
  enunciado: 'Un cocinero prepara una pizza circular de radio $r_1 = 15 \text{ cm}$ y decide vender una versión gigante con radio $r_2 = 30 \text{ cm}$. Utiliza el modelo de función potencia $A(r) = \pi r^2$ para calcular la superficie de ambas pizzas y la razón entre sus áreas.'
  pasos:
    - 'Paso 1: Para la pizza normal ($r_1 = 15$): $A(15) = \pi (15)^2 = 225\pi \text{ cm}^2$.'
    - 'Paso 2: Para la pizza gigante ($r_2 = 30$): $A(30) = \pi (30)^2 = 900\pi \text{ cm}^2$.'
    - 'Paso 3: Razón entre áreas: $\frac{A(30)}{A(15)} = \frac{900\pi}{225\pi} = 4$.'
    - 'Paso 4: Conclusión: Como la razón de radios es $c = \frac{30}{15} = 2$ (se duplicó el radio), el área de la superficie se multiplicó por $c^2 = 2^2 = 4$ veces.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si se tiene un rectángulo cuyos lados se triplican para construir un rectángulo semejante mayor (razón de semejanza $c = 3$), ¿por qué factor se multiplica el área del nuevo rectángulo?'
    choices:
      - {text: 'Por un factor de $9$, ya que la razón entre áreas en modelos cuadráticos es $c^2 = 3^2 = 9$', is_correct: true}
      - {text: 'Por un factor de $3$', is_correct: false}
      - {text: 'Por un factor de $6$', is_correct: false}
      - {text: 'Por un factor de $27$', is_correct: false}
    explanation: 'La alternativa correcta es ''Por un factor de $9$, ya que la razón entre áreas en modelos cuadráticos es $c^2 = 3^2 = 9$''. El área depende cuadráticamente de las dimensiones lineales.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la función potencia de área de un círculo $A(r) = \pi r^2$, ¿cuál es el significado geométrico del parámetro de escala $a = \pi$?'
    choices:
      - {text: 'Es el factor de forma constante que relaciona el cuadrado del radio con la superficie total encerrada', is_correct: true}
      - {text: 'Es la variable dependiente de la pizza', is_correct: false}
      - {text: 'Es la longitud del diámetro', is_correct: false}
      - {text: 'Es una constante que cambia según el radio', is_correct: false}
    explanation: 'La alternativa correcta es ''Es el factor de forma constante que relaciona el cuadrado del radio con la superficie total encerrada''. La constante $a = \pi$ es el factor de proporcionalidad del círculo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la dimensión lineal $x$ (lado, radio) y el modelo de área $A(x) = a x^2$.'
  - 'Paso 2: Determinar el factor de forma $a$ específico de la figura geométrica.'
  - 'Paso 3: Sustituir la longitud dada en la base $x$ y elevar al cuadrado $x^2$.'
  - 'Paso 4: Aplicar la propiedad de semejanza $c^2$ para calcular aumentos o reducciones de área.'
errores_correccion: |
  - **Error 1:** Confundir el modelo de área (exponente 2) con el modelo de volumen (exponente 3). **Cómo corregirlo:** Las áreas son superficies planas bidimensionales, por lo que dependen cuadráticamente de las longitudes $x^2$. Los volúmenes son tridimensionales y dependen de $x^3$.
  - **Error 2:** Creer que duplicar el perímetro de una figura duplica su área. **Cómo corregirlo:** El perímetro es una medida lineal ($c$). Duplicar el perímetro multiplica el área por $c^2 = 2^2 = 4$ veces.
ejemplos:
  - titulo: 'Área de triángulo equilátero'
    enunciado: 'En $A(s) = \frac{\sqrt{3}}{4} s^2$, ¿si el lado $s$ se duplica el área se cuadruplica?'
    alternativas:
      - 'Sí, por ser modelo cuadrático $2^2 = 4$'
      - 'No, el área se duplica'
      - 'No, el área se triplica'
    respuesta: 'Sí, por ser modelo cuadrático $2^2 = 4$'
    solucion_pasos:
      - '1. $A(2s) = \frac{\sqrt{3}}{4} (2s)^2 = 4 \cdot A(s)$.'
      - '2. El área aumenta 4 veces.'
  - titulo: 'Cálculo de superficie de círculo'
    enunciado: '¿Cuál es el área de un círculo de radio $r = 10 \text{ cm}$?'
    respuesta: '100 \pi cm²'
    solucion_pasos:
      - '1. $A(10) = \pi (10)^2 = 100\pi \text{ cm}^2$.'
  - titulo: 'Reducción de dimensión lineal a la mitad'
    enunciado: 'Si el lado de un cuadrado se reduce a la mitad ($s/2$), ¿el área cae a $\frac{1}{4}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(1/2)^2 = 1/4 \implies$ el área se reduce a la cuarta parte.'
  - titulo: 'Factor de forma en cuadrados'
    enunciado: '¿El factor de forma de un cuadrado $A(s) = s^2$ es $a = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En $A(s) = 1 \cdot s^2$, la constante $a = 1$.'
errores_frecuentes:
  - 'El área de una figura geométrica en función de su lado sigue un modelo de exponente 3.'
  - 'Duplicar la longitud de los lados de un triángulo duplica su área.'
  - 'En la función de área $A(r) = \pi r^2$, el parámetro de escala $\pi$ cambia cuando el radio aumenta.'
  - 'Triplicar el radio de un círculo aumenta su área por un factor de 6.'
  - 'Las áreas geométricas pueden ser representadas con exponentes negativos.'
afirmaciones_verdaderas:
  - 'El área de cualquier figura plana semejante en función de su dimensión lineal $x$ es una función potencia cuadrática $A(x) = a x^2$.'
  - 'La razón entre las áreas de dos figuras planas semejantes es igual al cuadrado de la razón de semejanza entre sus dimensiones lineales ($c^2$).'
al_terminar_debes_poder: |
  QUÉ: Modelar variaciones de área geométrica mediante funciones potencia cuadráticas $A(r) = c \cdot r^2$.
  CÓMO: Aplicar el factor de escala cuadrático $k^2$ al modificar linealmente una dimensión en un factor $k$.
