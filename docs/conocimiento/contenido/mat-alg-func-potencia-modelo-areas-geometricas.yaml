semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.AREAS_GEOMETRICAS
resumen_inicial: 'Modelamiento de áreas geométricas mediante funciones potencia cuadráticas:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Modelamiento y aplicaciones
  en contexto.'
explicacion_simple: Cuando una figura crece manteniendo su forma (sus lados escalan
  todos por igual), su área no crece en la misma proporción que sus lados, sino según
  el cuadrado de esa proporción.
explicacion_formal: '### Definición formal


  Para figuras semejantes con dimensión lineal $x$, el área se modela como $A(x)=a\cdot
  x^2$, con $a$ una constante geométrica (por ejemplo, $a=1$ para un cuadrado de lado
  $x$, o $a=\pi$ para un círculo de radio $x$). Es un caso particular de función potencia
  con $n=2$.


  ### Desarrollo didáctico


  Si se duplica el lado de un cuadrado, de $x$ a $2x$, su área pasa de $x^2$ a $(2x)^2=4x^2$:
  se cuadruplica, no se duplica. Esta relación cuadrática se cumple para cualquier
  figura semejante que escale proporcionalmente.'
definiciones_clave: '- **Modelamiento de áreas geométricas mediante funciones potencia
  cuadráticas**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a modelamiento de áreas geométricas mediante funciones potencia
  cuadráticas.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de modelamiento de áreas geométricas mediante funciones potencia cuadráticas.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de modelamiento de áreas
    geométricas mediante funciones potencia cuadráticas.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
