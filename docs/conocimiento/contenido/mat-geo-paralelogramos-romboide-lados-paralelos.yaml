semantic_id: MAT.GEO.PARALELOGRAMOS.ROMBOIDE_LADOS_OPUESTOS_PARALELOS
resumen_inicial: 'Propiedad de lados opuestos paralelos en el romboide: conceptos,
  teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: 'Después de estudiar el cuadrado, el rectángulo y el rombo (cada
  uno con una propiedad adicional especial), queda un último caso: el paralelogramo
  que no tiene ninguna característica extra.'
explicacion_formal: '![Romboide: lados opuestos paralelos, sin ángulos rectos ni lados
  iguales](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-romboide-lados-paralelos.svg)


  ### Definición formal


  Un romboide es un paralelogramo en el que $AB\parallel CD$ y $BC\parallel AD$, con
  $AB=CD\neq BC=AD$ (lados opuestos iguales entre sí, pero distintos entre pares)
  y ángulos distintos de 90°.


  ### Desarrollo didáctico


  El romboide es, en cierto sentido, el paralelogramo ''más genérico'': tiene todas
  las propiedades comunes a todo paralelogramo, pero ninguna de las propiedades adicionales
  que distinguen al cuadrado (lados y ángulos especiales), al rectángulo (ángulos
  rectos) o al rombo (lados iguales).'
