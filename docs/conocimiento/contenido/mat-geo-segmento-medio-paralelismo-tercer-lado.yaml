semantic_id: MAT.GEO.SEGMENTO_MEDIO.PARALELISMO_TERCER_LADO
resumen_inicial: 'Propiedad de paralelismo del segmento medio respecto del tercer
  lado: conceptos, teoremas, propiedades geométricas y cálculo en Elementos Secundarios
  del Triángulo.'
explicacion_simple: Una propiedad notable del segmento medio es que, sin importar
  la forma del triángulo, siempre queda exactamente paralelo al tercer lado, el que
  no interviene en su construcción.
explicacion_formal: '![Segmento medio paralelo al tercer lado](/static/img/geometria/elementos-secundarios/segmento-medio-paralelismo-tercer-lado.svg)


  ### Definición formal


  Si M y N son los puntos medios de AB y AC en un triángulo ABC, el segmento MN es
  paralelo al lado BC.


  ### Desarrollo didáctico


  Esta propiedad, junto con la de la medida (MN mide la mitad de BC), constituye el
  llamado teorema del segmento medio o teorema de la base media.'
