semantic_id: MAT.ALG.MULT_MON_POL.COEFICIENTES_FRACCIONARIOS
resumen_inicial: El producto de monomio por polinomio con coeficientes fraccionarios consiste en distribuir el monomio fraccionario sobre cada término multiplicando numeradores y denominadores y simplificando las fracciones.
explicacion_simple: "Cuando multiplicas un **monomio fraccionario por un polinomio con fracciones** (ej: $\\frac{1}{2}x \\cdot \\left(\\frac{2}{3}x^2 - \\frac{4}{5}x + 6\\right)$):\n- **Procedimiento**:\n  1. Multiplica la fracción de afuera por la fracción de CADA término de adentro ($\\text{num} \\cdot \\text{num}$ y $\\text{den} \\cdot \\text{den}$).\n  2. Simplifica las fracciones resultantes a su mínima expresión.\n  3. Suma los exponentes de las letras iguales.\n- **Ejemplo**: $\\frac{1}{2}x \\cdot \\left(\\frac{2}{3}x^2 - \\frac{4}{5}x + 6\\right)$:\n  - Término 1: $\\left(\\frac{1}{2} \\cdot \\frac{2}{3}\\right) x^{1+2} = \\frac{2}{6}x^3 = \\mathbf{\\frac{1}{3}x^3}$.\n  - Término 2: $\\left(\\frac{1}{2} \\cdot \\left(-\\frac{4}{5}\\right)\\right) x^{1+1} = -\\frac{4}{10}x^2 = \\mathbf{-\\frac{2}{5}x^2}$.\n  - Término 3: $\\left(\\frac{1}{2} \\cdot 6\\right) x = \\frac{6}{2}x = \\mathbf{+3x}$.\n- **Polinomio final**: **$\\frac{1}{3}x^3 - \\frac{2}{5}x^2 + 3x$**.\n\n![Monomio por Polinomio\
  \ con Fracciones](/static/img/nodos/producto-de-monomio-por-polinomio-con-coeficientes-fraccionarios-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea un monomio racional $M = \frac{p}{q} x^\alpha \in \mathbb{Q}[x]$ ($p,q \in \mathbb{Z}, q \neq 0$) y un polinomio $P(x) = \sum_{j=1}^m \frac{a_j}{b_j} x^{\beta_j}$. El **producto de monomio por polinomio en $\mathbb{Q}[x]$** expande la adición racional distribuida:


  $$M \cdot P(x) = \sum_{j=1}^m \left( \frac{p \cdot a_j}{q \cdot b_j} \right) x^{\alpha + \beta_j}$$


  ### Simplificación Racional Termino a Termino via MCD

  Cada fracción producto $F_j = \frac{p a_j}{q b_j}$ se simplifica individualmente dividiendo entre $g_j = \gcd(p a_j, q b_j)$:


  $$M \cdot P(x) = \sum_{j=1}^m \left( \frac{(p a_j)/g_j}{(q b_j)/g_j} \right) x^{\alpha + \beta_j}$$


  ### Síntesis didáctica

  La simplificación cruzada antes de multiplicar los términos reduce el tamaño de las cifras numéricas y acelera el desarrollo de polinomios racionales.

  '
definiciones_clave: '- **Producto de monomio por polinomio racional**: Expansión distributiva donde los coeficientes pertenecen al cuerpo $\mathbb{Q}$.

  - **Simplificación independiente por sumando**: Reducción al MCD efectuada sobre cada una de las fracciones resultantes del polinomio.

  - **Coeficiente entero implícito ($\frac{c}{1}$)**: Representación racional de términos enteros dentro del polinomio.

  '
propiedades_relaciones: '- **Conservación de la regla de potencias**: Las fracciones de los coeficientes no alteran la suma de exponentes literales.

  - **Invarianza del número de sumandos**: La cantidad de términos en la respuesta coincide con los del polinomio original (antes de simplificar ceros).

  '
ejemplo_guiado:
  enunciado: Calcula el producto expandido de $\frac{3}{4}x^2 \cdot \left(\frac{2}{3}x^2 - \frac{8}{9}x + \frac{4}{5}\right)$.
  pasos:
  - 'Paso 1: Distribuimos sobre el término 1: $\left(\frac{3}{4} \cdot \frac{2}{3}\right) x^{2+2} = \frac{6}{12}x^4 = \mathbf{\frac{1}{2}x^4}$.'
  - 'Paso 2: Distribuimos sobre el término 2: $\left(\frac{3}{4} \cdot \left(-\frac{8}{9}\right)\right) x^{2+1} = -\frac{24}{36}x^3 = \mathbf{-\frac{2}{3}x^3}$.'
  - 'Paso 3: Distribuimos sobre el término 3: $\left(\frac{3}{4} \cdot \frac{4}{5}\right) x^2 = \frac{12}{20}x^2 = \mathbf{+\frac{3}{5}x^2}$.'
  - 'Paso 4: Consolidamos el polinomio final simplificado: $\frac{1}{2}x^4 - \frac{2}{3}x^3 + \frac{3}{5}x^2$.'
  - 'Conclusión: El polinomio expandido es **$\frac{1}{2}x^4 - \frac{2}{3}x^3 + \frac{3}{5}x^2$**.'
  imagen: /static/img/nodos/producto-de-monomio-por-polinomio-con-coeficientes-fraccionarios-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se efectúa la multiplicación del monomio fraccionario por cada coeficiente del polinomio?
  choices:
  - text: Multiplicando numerador por numerador y denominador por denominador en cada término y simplificando la fracción resultante
    is_correct: true
  - text: Buscando el MCM de todos los denominadores de todo el polinomio
    is_correct: false
  - text: Multiplicando únicamente los numeradores y eliminando los denominadores
    is_correct: false
  - text: Sumando las fracciones entre sí
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando numerador por numerador y denominador por denominador en cada término y simplificando la fracción resultante'. Producto directo de fracciones término a término.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de multiplicar $\frac{1}{3}a \cdot (3a + 6)$?
  choices:
  - text: El resultado es $a^2 + 2a$, porque $\frac{1}{3} \cdot 3 = 1 \implies 1a^2$ y $\frac{1}{3} \cdot 6 = 2 \implies 2a$
    is_correct: true
  - text: El resultado es $3a^2 + 6a$
    is_correct: false
  - text: El resultado es $a^2 + 6a$
    is_correct: false
  - text: El resultado es $\frac{1}{3}a^2 + 2a$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $a^2 + 2a$, porque $\frac{1}{3} \cdot 3 = 1 \implies 1a^2$ y $\frac{1}{3} \cdot 6 = 2 \implies 2a$'. $\frac{3}{3}a^2 + \frac{6}{3}a = a^2 + 2a$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Convertir cualquier coeficiente entero del polinomio en fracción colocándole denominador 1.'
- 'Paso 2: Multiplicar el coeficiente fraccionario del monomio por el primer coeficiente del polinomio ($\text{num} \cdot \text{num}$ y $\text{den} \cdot \text{den}$).'
- 'Paso 3: Sumar los exponentes de las variables correspondientes al primer término.'
- 'Paso 4: Repetir el proceso con los demás sumandos y simplificar cada fracción resultante a su forma irreductible.'
errores_correccion: '- **Error 1:** Buscar un MCM para todos los denominadores del polinomio al multiplicar por un monomio fraccionario. **Cómo corregirlo:** La multiplicación de fracciones **NO REQUIERE MCM; se multiplica directamente término a término**.

  - **Error 2:** Multiplicar en cruz los coeficientes fraccionarios en la distribución. **Cómo corregirlo:** La multiplicación **ES DIRECTA ($\text{num} \cdot \text{num}$ / $\text{den} \cdot \text{den}$)**.

  '
ejemplos:
- titulo: Distribución fraccionaria simple
  enunciado: ¿Cuál es el producto de $\frac{1}{2}x \cdot (4x - 8)$?
  alternativas:
  - $2x^2 - 4x$
  - $4x^2 - 8x$
  - $2x^2 - 8x$
  respuesta: $2x^2 - 4x$
  solucion_pasos:
  - 1. $\frac{1}{2} \cdot 4 = 2 \implies 2x^2$.
  - 2. $\frac{1}{2} \cdot (-8) = -4 \implies -4x$.
  - '3. Resultado: $2x^2 - 4x$.'
- titulo: Simplificación por cancelación
  enunciado: ¿Cuál es el producto de $\frac{2}{5}a^2 \cdot \left(\frac{5}{2}a + 10\right)$?
  alternativas:
  - $a^3 + 4a^2$
  - $a^3 + 10a^2$
  - $\frac{10}{10}a^3 + 10$
  respuesta: $a^3 + 4a^2$
  solucion_pasos:
  - 1. $\frac{2}{5} \cdot \frac{5}{2} = 1 \implies 1a^3 = a^3$.
  - 2. $\frac{2}{5} \cdot 10 = 4 \implies 4a^2$.
  - '3. Resultado: $a^3 + 4a^2$.'
- titulo: Invarianza de leyes de potencias
  enunciado: ¿Se mantiene la suma de exponentes $x^2 \cdot x^3 = x^5$ intacta cuando los coeficientes son fracciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, las potencias de las bases iguales siempre se suman.
- titulo: Fracción negativa distribuida
  enunciado: Para $-\frac{1}{4}(4x - 8)$, ¿se obtiene $-x + 2$ al distribuir el signo y simplificar las fracciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-\frac{4}{4}x = -1x$ y $-\frac{1}{4}(-8) = +2$.
errores_frecuentes:
- Buscar un único MCM para todos los denominadores del polinomio al distribuir un monomio fraccionario.
- Multiplicar en cruz los coeficientes fraccionarios del monomio y del polinomio.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Los coeficientes fraccionarios del polinomio resultante no son simplificados a su forma irreductible.
- Alterar los exponentes de las variables al simplificar los denominadores.
afirmaciones_verdaderas:
- La multiplicación de un monomio fraccionario por un polinomio se realiza multiplicando fracciones directamente término a término.
- Cada coeficiente fraccionario del polinomio expandido se simplifica de forma independiente.
al_terminar_debes_poder: '![Resumen de monomio por polinomio con fracciones](/static/img/nodos/producto-de-monomio-por-polinomio-con-coeficientes-fraccionarios-resumen.svg)


  QUÉ: Multiplicar monomios y polinomios compuestos por coeficientes fraccionarios.


  CÓMO: Multiplicar numeradores entre sí y denominadores entre sí para cada sumando $\frac{a \cdot c_k}{b \cdot d_k}$, simplificando cada fracción a su forma irreductible.'
