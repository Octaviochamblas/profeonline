procedimiento:
- 'Paso 1: Identifica el monomio multiplicador y cada uno de los sumandos fraccionarios
  dentro del polinomio.'
- 'Paso 2: Distribuye el monomio multiplicando el primer término del polinomio (multiplicación
  de fracciones).'
- 'Paso 3: Distribuye al segundo término (ojo con los signos y la multiplicación de
  fracciones).'
- 'Paso 4: Simplifica cada una de las fracciones obtenidas en los coeficientes.'
- 'Paso 5: Escribe el polinomio final.'
- 'Término 1: $\frac{3}{5} \times \frac{5}{3} = 1$. Término 2: $\frac{3}{5} \times
  (-10) = -6$.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en producto de monomio por polinomio con coeficientes fraccionarios.
ejemplos:
- titulo: Distribución fraccionaria
  enunciado: 'Multiplica: 2/3 a(3/4 a + 1/2).'
  solucion_pasos:
  - 'Producto 1: (2/3 a)(3/4 a) = 6/12 a^2 = 1/2 a^2.'
  - 'Producto 2: (2/3 a)(1/2) = 2/6 a = 1/3 a.'
  - 'Resultado: 1/2 a^2 + 1/3 a.'
- titulo: Un maestro de obra diseña una rampa de ancho $\frac{1}{2}w$ metros y longitud
    descrita por $
  enunciado: 'Un maestro de obra diseña una rampa de ancho $\frac{1}{2}w$ metros y
    longitud descrita por $(\frac{2}{3}w^2 + 8w)$ metros. ¿Cuál es el área de la superficie
    de la rampa? (v1)


    Opciones: A) $\frac{1}{3}w^3 + 4w^2$ · B) $\frac{2}{6}w^3 + 8w^2$ · C) $\frac{1}{2}w^3
    + 4w^2$ · D) $\frac{1}{3}w^2 + 4w$'
  solucion_pasos:
  - Área $= (\frac{1}{2}w)(\frac{2}{3}w^2 + 8w) = (\frac{1}{2} \cdot \frac{2}{3})w^3
    + (\frac{1}{2} \cdot 8)w^2 = \frac{2}{6}w^3 + 4w^2 = \frac{1}{3}w^3 + 4w^2$.
  - 'Respuesta: $\frac{1}{3}w^3 + 4w^2$'
- titulo: 'Respecto de «Producto de monomio por polinomio con coeficientes fraccionarios»:
    ¿Es correcta'
  enunciado: 'Respecto de «Producto de monomio por polinomio con coeficientes fraccionarios»:
    ¿Es correcta esta caracterización? «Al multiplicar un monomio por un polinomio
    con **Coeficientes Fraccionarios**, se distribuye el monomio multiplicando cada
    término»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al multiplicar un monomio por
    un polinomio con **Coeficientes Fraccionarios**, se distribuye el monomio multiplicando
    cada término.'
- titulo: 'Respecto de «Producto de monomio por polinomio con coeficientes fraccionarios»:
    ¿Es válida e'
  enunciado: 'Respecto de «Producto de monomio por polinomio con coeficientes fraccionarios»:
    ¿Es válida esta afirmación? «Olvidar distribuir el monomio al denominador de los
    coeficientes del polinomio»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al multiplicar un monomio por
    un polinomio con **Coeficientes Fraccionarios**, se distribuye el monomio multiplicando
    cada término.'
errores_frecuentes:
- Olvidar distribuir el monomio al denominador de los coeficientes del polinomio.
- No simplificar las fracciones finales de cada término.
- $\frac{15}{15}$ y $-\frac{30}{5}$.
- $1$ y $-10$.
- $\frac{3}{5}$ y $-6$.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
