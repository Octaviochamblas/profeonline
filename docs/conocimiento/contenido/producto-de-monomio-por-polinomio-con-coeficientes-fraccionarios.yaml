semantic_id: MAT.ALG.MULT_MON_POL.COEFICIENTES_FRACCIONARIOS
resumen_inicial: 'Producto de monomio por polinomio con coeficientes fraccionarios:
  leyes, procedimiento y aplicación en Multiplicación de monomio por polinomio.'
explicacion_simple: Cuando distribuimos un monomio sobre un polinomio con fracciones,
  multiplicamos el término exterior por cada término interior. Esto genera múltiples
  multiplicaciones de fracciones independientes que resolvemos una por una.
explicacion_formal: "### Definición formal\n\nSea $M=cX^{\\alpha}$ un monomio y sea\
  \ $P=\\sum_{i=1}^{n}d_iX^{\\beta_i}$ un polinomio, donde $c,d_i\\in\\mathbb{Q}$\
  \ y todos los denominadores son distintos de cero. Entonces\n\n$$M\\cdot P=\\sum_{i=1}^{n}(cd_i)X^{\\\
  alpha+\\beta_i}.$$\n\nLa presencia de coeficientes fraccionarios no modifica la\
  \ propiedad distributiva: cada coeficiente $cd_i$ se calcula mediante el producto\
  \ de fracciones y se expresa en su forma irreducible; las potencias de bases iguales\
  \ se combinan sumando exponentes.\n\n### Desarrollo didáctico\n\nMultiplica: $\\\
  frac{1}{2}x(\\frac{2}{3}x - \\frac{4}{5})$.\n\n1. Distribución 1:\n   $\\frac{1}{2}x\
  \ \\cdot \\frac{2}{3}x = (\\frac{1}{2} \\cdot \\frac{2}{3})x^2 = \\frac{2}{6}x^2\
  \ = \\frac{1}{3}x^2$.\n2. Distribución 2:\n   $\\frac{1}{2}x \\cdot (-\\frac{4}{5})\
  \ = -(\\frac{1}{2} \\cdot \\frac{4}{5})x = -\\frac{4}{10}x = -\\frac{2}{5}x$.\n\n\
  Resultado combinado: $\\frac{1}{3}x^2 - \\frac{2}{5}x$."
definiciones_clave: '- **Producto de monomio por polinomio con coeficientes fraccionarios**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a producto de monomio por polinomio con coeficientes
  fraccionarios.'
