resumen_inicial: La producto de monomio por polinomio con coeficientes fraccionarios
  aplica rigurosamente las leyes distributivas, de signos y de potencias en expresiones
  algebraicas.
explicacion_simple: Al trabajar con producto de monomio por polinomio con coeficientes
  fraccionarios, multiplicamos los coeficientes numéricos, aplicamos la regla de signos
  y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Producto de monomio por polinomio
  con coeficientes fraccionarios** viene dada por:


  $$\text{"el producto (1/2 x)(4x^2 - 6x + 8)"} \implies 2x^3 - 3x^2 + 4x$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Producto de monomio por polinomio con coeficientes fraccionarios**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule producto de monomio por polinomio con coeficientes fraccionarios
    para: ''el producto (1/2 x)(4x^2 - 6x + 8)''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es 2x^3 - 3x^2 + 4x.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar producto de monomio por polinomio con
    coeficientes fraccionarios a 'el producto (1/2 x)(4x^2 - 6x + 8)'?
  choices:
  - text: 2x^3 - 3x^2 + 4x
    is_correct: true
  - text: 4x^3 - 6x^2 + 8x
    is_correct: false
  - text: 2x^2 - 3x + 4
    is_correct: false
  - text: (1/2)x^3 - (3/2)x^2 + 4x
    is_correct: false
  explanation: La alternativa correcta es '2x^3 - 3x^2 + 4x'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto (1/2 x)(4x^2 - 6x + 8)', ¿qué expresión
    resultante se obtuvo?
  choices:
  - text: 2x^3 - 3x^2 + 4x
    is_correct: true
  - text: 4x^3 - 6x^2 + 8x
    is_correct: false
  - text: 2x^2 - 3x + 4
    is_correct: false
  - text: (1/2)x^3 - (3/2)x^2 + 4x
    is_correct: false
  explanation: La alternativa correcta es '2x^3 - 3x^2 + 4x'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante producto de monomio por polinomio con coeficientes fraccionarios.** **Cómo
  corregirlo:** Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de producto de monomio por polinomio con coeficientes
    fraccionarios en 'el producto (1/2 x)(4x^2 - 6x + 8)'?
  alternativas:
  - 2x^3 - 3x^2 + 4x
  - 4x^3 - 6x^2 + 8x
  - 2x^2 - 3x + 4
  - (1/2)x^3 - (3/2)x^2 + 4x
  respuesta: 2x^3 - 3x^2 + 4x
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener 2x^3 - 3x^2 + 4x.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto (1/2 x)(4x^2 - 6x + 8)' por producto de monomio
    por polinomio con coeficientes fraccionarios, ¿qué expresión resulta?
  alternativas:
  - 2x^3 - 3x^2 + 4x
  - 4x^3 - 6x^2 + 8x
  - 2x^2 - 3x + 4
  - (1/2)x^3 - (3/2)x^2 + 4x
  respuesta: 2x^3 - 3x^2 + 4x
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir 2x^3 - 3x^2 + 4x.
- titulo: ¿Es la multiplicación en 'el producto (1/2 x)(4x^2 - 6x + 8)' equivalente
    a 2x^3 - 3x^2 + 4x?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene 2x^3 - 3x^2 + 4x.
- titulo: ¿Da el producto de 'el producto (1/2 x)(4x^2 - 6x + 8)' un resultado igual
    a 4x^3 - 6x^2 + 8x?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es 2x^3 - 3x^2 + 4x.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar producto de monomio
  por polinomio con coeficientes fraccionarios.
- Omitir distribuir el monomio o término sobre todos los sumandos en producto de monomio
  por polinomio con coeficientes fraccionarios.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La producto de monomio por polinomio con coeficientes fraccionarios requiere sumar
  los exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la producto de monomio
  por polinomio con coeficientes fraccionarios aplicando distributividad, ley de signos
  y suma de exponentes.
