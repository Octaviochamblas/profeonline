semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.FRACCION_DE_CANTIDAD
resumen_inicial: "El cálculo de la fracción de una cantidad consiste en multiplicar la fracción dada por dicha cantidad (o dividir la cantidad por el denominador y multiplicar por el numerador)."
explicacion_simple: |
  Si te preguntan cuánto es los $\frac{3}{4}$ de 20 personas, estás calculando una **fracción de una cantidad**. La palabra 'de' en matemática equivale a una **multiplicación**. Puedes resolverlo de dos formas equivalentes:
  1. Multiplicas $20 \times 3 = 60$ y luego divides entre $4$: $60 \div 4 = 15$.
  2. O divides primero 20 en 4 grupos iguales ($20 \div 4 = 5$) y tomas 3 de esos grupos ($5 \times 3 = 15$).
  En ambos casos, los $\frac{3}{4}$ de 20 son 15 personas.
explicacion_formal: |
  Formalmente, dada una cantidad real $C \in \mathbb{R}$ y una fracción operador $\frac{a}{b} \in \mathbb{Q}$ (con $b \in \mathbb{Z}^+$ y $a \in \mathbb{Z}$), el valor $V$ correspondiente a los **$\frac{a}{b}$ de $C$** se define mediante el producto:
  $V = \frac{a}{b} \cdot C = \frac{a \cdot C}{b}$

  Equivalencia operacional distributiva:
  $$V = (C \div b) \cdot a = (C \cdot a) \div b$$
definiciones_clave: |
  - **Fracción como operador**: Función $f(C) = \frac{a}{b} \cdot C$ que escala o extrae una porción de una cantidad $C$.
  - **Interpretación del conector 'de'**: Equivalencia semántica en problemas verbales donde 'de' o 'del' indica multiplicación $\cdot$.
  - **Unidad del grupo ($C \div b$)**: Tamaño de una de las $b$ partes iguales en las que se divide la cantidad total $C$.
propiedades_relaciones: |
  - **Escalamiento reductor ($a < b$)**: Si la fracción es propia ($\frac{a}{b} < 1$), el resultado $V$ es estrictamente menor que la cantidad original $C$ (para $C > 0$).
  - **Escalamiento amplificador ($a > b$)**: Si la fracción es impropia ($\frac{a}{b} > 1$), el resultado $V$ es estrictamente mayor que la cantidad original $C$.
  - **Aplicación en porcentajes**: La aplicación de un porcentaje $P\%$ a una cantidad $C$ es un caso particular de fracción de una cantidad $V = \frac{P}{100} \cdot C$.
ejemplo_guiado:
  enunciado: "Un curso tiene 36 estudiantes. Si los $\\frac{5}{9}$ del curso son mujeres, calcula cuántas mujeres hay en el curso y cuántos hombres."
  pasos:
    - 'Identificar la cantidad total $C = 36$ y la fracción operador $\frac{5}{9}$.'
    - 'Aplicar la fórmula de fracción de una cantidad: $V = \frac{5}{9} \cdot 36$.'
    - 'Dividir primero el total entre el denominador: $36 \div 9 = 4$ estudiantes por noveno.'
    - 'Multiplicar por el numerador: $4 \cdot 5 = 20$ mujeres.'
    - 'Calcular la cantidad de hombres mediante la fracción complementaria $\frac{4}{9}$ o por diferencia: $36 - 20 = 16$ hombres.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué operación matemática representa la palabra 'de' cuando se pide calcular los $\\frac{a}{b}$ de una cantidad $C$?"
    choices:
      - {text: "Una multiplicación: $V = \\frac{a}{b} \\cdot C$.", is_correct: true}
      - {text: "Una división directa $C \\div a$.", is_correct: false}
      - {text: "Una resta $C - \\frac{a}{b}$.", is_correct: false}
      - {text: "Una suma $C + \\frac{a}{b}$.", is_correct: false}
    explanation: 'La correcta es Una multiplicación: $V = \frac{a}{b} \cdot C$.: actuar como operador fraccionario sobre una cantidad dada es equivalente al producto $C \cdot (a/b)$.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cuánto es los $\\frac{3}{5}$ de $45$?"
    choices:
      - {text: "27", is_correct: true}
      - {text: "15", is_correct: false}
      - {text: "75", is_correct: false}
      - {text: "9", is_correct: false}
    explanation: 'La correcta es 27: dividimos $45 \div 5 = 9$ y multiplicamos $9 \cdot 3 = 27$.'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identificar la cantidad total $C$ y la fracción operador $\frac{a}{b}$.'
  - 'Paso 2: Plantear la multiplicación $\frac{a}{b} \cdot C$.'
  - 'Paso 3: Resolver mediante $(C \div b) \cdot a$ o $(C \cdot a) \div b$ (se sugiere simplificar $C$ con $b$ antes de multiplicar).'
  - "Paso 4: Escribir la respuesta con las unidades del problema (personas, metros, pesos, etc.)."
errores_correccion: |
  Un error común es dividir entre el numerador y multiplicar por el denominador (hacer $(C \div a) \cdot b$). Recuerda siempre la regla verbal: **divides por el de abajo (denominador) y multiplicas por el de arriba (numerador)**.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "En un estanque de 120 litros se han llenado los $\\frac{3}{4}$ de su capacidad. ¿Cuántos litros de agua contiene?"
    alternativas:
      - "90 litros."
      - "30 litros."
      - "160 litros."
    respuesta: "90 litros."
    solucion_pasos:
      - 'Dividimos 120 entre 4: $120 \div 4 = 30$.'
      - 'Multiplicamos por 3: $30 \cdot 3 = 90$ litros.'
  - titulo: "Ejemplo 2"
    enunciado: "De un sueldo de $600.000 pesos, una persona destina $\\frac{2}{5}$ para arriendo. ¿Cuánto dinero gasta en arriendo?"
    alternativas:
      - "$240.000 pesos."
      - "$120.000 pesos."
      - "$360.000 pesos."
    respuesta: "$240.000 pesos."
    solucion_pasos:
      - '$600.000 \div 5 = 120.000$.'
      - '$120.000 \cdot 2 = 240.000$ pesos.'
  - titulo: "¿Es posible calcular la fracción de una cantidad desconocida $X$ planteando la ecuación $\\frac{a}{b} \\cdot X = V$?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, despejando $X = V \cdot \frac{b}{a}$ se halla la cantidad total a partir de la porción.'
  - titulo: "¿Calcular los $\\frac{1}{2}$ de una cantidad equivale a dividir esa cantidad por 2?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, $\frac{1}{2} \cdot C = \frac{C}{2}$.'
errores_frecuentes:
  - "Invertir los roles del numerador y denominador al operar (dividir por arriba y multiplicar por abajo)."
  - "Sumar la fracción a la cantidad en lugar de multiplicarla."
  - "Olvidar simplificar la cantidad $C$ con el denominador $b$ antes de hacer multiplicaciones grandes."
  - "Confundir la cantidad parcial hallada con lo que falta para completar el entero."
  - "Creer que la fracción de una cantidad siempre da un número entero (puede dar decimal o fracción)."
afirmaciones_verdaderas:
  - 'Para calcular la fracción $\frac{a}{b}$ de una cantidad $C$, se multiplica la cantidad por el numerador y se divide entre el denominador.'
  - "Si la fracción operador es propia, la fracción de la cantidad resulta menor que la cantidad original."
al_terminar_debes_ponder: |
  Debes ser capaz de calcular la fracción de cualquier cantidad continua o discreta y resolver problemas contextualizados.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
