semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.FRACCION_DE_CANTIDAD
resumen_inicial: 'Calcular la fracción $\frac{a}{b}$ de una cantidad $N$ consiste
  en multiplicar la fracción por la cantidad: $\frac{a}{b} \cdot N = \frac{a \cdot
  N}{b}$.'
explicacion_simple: Para calcular cuánto es una fracción de un total de cosas (por
  ejemplo, cuánto son los 3/4 de 20 personas), simplemente multiplicamos la fracción
  por ese número total. Esto equivale a dividir el total entre el número de abajo
  y multiplicar el resultado por el número de arriba.
explicacion_formal: 'Para un operador fraccionario $\frac{a}{b}$ aplicado sobre una
  magnitud $N \in \mathbb{R}^+$, la **Función Fracción de una Cantidad** se define
  como el producto escalar:


  $$\operatorname{Frac}_{a/b}(N) = \frac{a}{b} \cdot N = \frac{a \cdot N}{b} = a \cdot
  \left(\frac{N}{b}\right)$$


  **Desglose de la fórmula:**

  - $\frac{N}{b}$: División de la cantidad total $N$ en $b$ partes de igual medida.

  - $a \cdot \left(\frac{N}{b}\right)$: Selección multiplicativa de $a$ de dichas
  partes.


  > **Complemento didáctico:** La palabra ''de'', ''del'' o ''de los'' en problemas
  verbales se traduce matemáticamente por la operación de **multiplicación** ($3/4$
  **de** $20 \implies \frac{3}{4} \cdot 20$).'
definiciones_clave: '- **Operador fracción de una cantidad**: Expresión $\frac{a}{b}
  \cdot N$ que obtiene la porción proporcional de un total $N$.'
propiedades_relaciones: '- **Identidad de operador multiplicativo**: $\operatorname{Frac}_{a/b}(N)
  = \frac{a}{b} \cdot N$.'
ejemplo_guiado:
  enunciado: Calcule los $\frac{3}{5}$ de $40$ alumnos de un curso.
  pasos:
  - 'Paso 1: Traducir la frase ''3/5 de 40'' a una multiplicación: $\frac{3}{5} \cdot
    40$.'
  - 'Paso 2: Dividir la cantidad $40$ entre el denominador $5$: $40 : 5 = 8$ (cada
    quinto equivale a 8 alumnos).'
  - 'Paso 3: Multiplicar las $3$ partes por el valor de cada quinto: $3 \cdot 8 =
    24$.'
  - 'Conclusión: Los $\frac{3}{5}$ de $40$ alumnos equivalen a $24$ alumnos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué operación matemática se debe realizar para calcular los a/b de una
    cantidad N?
  choices:
  - text: 'Multiplicar la fracción por la cantidad: (a/b) · N'
    is_correct: true
  - text: 'Sumar la fracción a la cantidad: (a/b) + N'
    is_correct: false
  - text: Restar N menos a/b
    is_correct: false
  - text: Dividir b entre N
    is_correct: false
  explanation: 'La alternativa correcta es ''Multiplicar la fracción por la cantidad:
    (a/b) · N''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para los 3/5 de 40 alumnos, ¿cuál fue la cantidad
    calculada?
  choices:
  - text: 24 alumnos
    is_correct: true
  - text: 15 alumnos
    is_correct: false
  - text: 8 alumnos
    is_correct: false
  - text: 30 alumnos
    is_correct: false
  explanation: La alternativa correcta es '24 alumnos'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la multiplicación de la fracción $\frac{a}{b}$ por la cantidad
  total $N$.'
- 'Paso 2: Dividir $N$ entre el denominador $b$ (o multiplicar $a \cdot N$).'
- 'Paso 3: Multiplicar el resultado por el numerador $a$ para obtener la cantidad
  parcial.'
errores_correccion: '- **Error 1: Sumar la fracción a la cantidad en lugar de multiplicarla.**
  **Cómo corregirlo:** La palabra ''de'' exige MULTIPLICACIÓN ($\frac{a}{b} \cdot
  N$).


  - **Error 2: Dividir por el numerador y multiplicar por el denominador.** **Cómo
  corregirlo:** Se divide por el DENOMINADOR $b$ y se multiplica por el NUMERADOR
  $a$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule los 2/3 de 18.
  alternativas:
  - '12'
  - '6'
  - '9'
  respuesta: '12'
  solucion_pasos:
  - $\frac{2}{3} \cdot 18 = 2 \cdot (18/3) = 2 \cdot 6 = 12$.
- titulo: Ejemplo 2
  enunciado: Si un libro de 200 páginas tiene leídos 3/4, ¿cuántas páginas faltan
    por leer?
  alternativas:
  - 50 páginas (que representa 1/4)
  - 150 páginas
  - 100 páginas
  respuesta: 50 páginas (que representa 1/4)
  solucion_pasos:
  - Falta $\frac{1}{4}$ de $200 = \frac{1}{4} \cdot 200 = 50$ páginas.
- titulo: ¿Significa la palabra 'de' una multiplicación al calcular la fracción de
    un total?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'de' representa la operación de multiplicación de fracciones.
- titulo: ¿Es la mitad de 50 igual a 25?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{1}{2} \cdot 50 = 25$.
errores_frecuentes:
- Calcular la fracción de una cantidad requiere sumar el total con el denominador.
- La palabra 'de' en problemas de fracción de un número indica una división invertida.
- Para hallar la fracción de un número se multiplica por el denominador y se divide
  por el numerador.
- Los $3/4$ de una cantidad representa una cantidad mayor que el total entero.
- Calcular la fracción de un número produce siempre una cifra decimal infinita.
afirmaciones_verdaderas:
- Calcular la fracción $\frac{a}{b}$ de una cantidad $N$ equivale a multiplicar $\frac{a}{b}
  \cdot N = \frac{a \cdot N}{b}$.
- El cálculo representa dividir la cantidad $N$ en $b$ partes iguales y seleccionar
  $a$ de ellas.
al_terminar_debes_poder: Al terminar serás capaz de calcular la fracción de cualquier
  cantidad $N$, multiplicando $\frac{a}{b} \cdot N$ para determinar la porción proporcional
  correspondiente.
