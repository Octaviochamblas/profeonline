semantic_id: MAT.ALG.INTERVALOS.EXTREMO_EXCLUIDO
resumen_inicial: 'Representación de extremo excluido en la recta numérica: relaciones
  de orden, intervalos y resolución en Intervalos reales y su representación.'
explicacion_simple: Al trabajar con intervalos, es fundamental diferenciar entre los
  valores que pertenecen al conjunto y aquellos que, aunque marcan un límite, no están
  incluidos en él. Un extremo excluido indica un límite estricto.
explicacion_formal: '### Definición formal

  Un intervalo abierto en ambos extremos se define como el conjunto de números reales
  $x$ tales que $a < x < b$, denotado por $]a, b[$ o $(a, b)$. En este caso, $a$ y
  $b$ son extremos excluidos, lo que significa que $a \notin ]a, b[$ y $b \notin ]a,
  b[$. Un extremo excluido se da en cualquier intervalo donde la desigualdad sea estricta
  ($<$ o $>$).


  ### Desarrollo didáctico

  La noción de extremo excluido es como un cerco al que te puedes acercar tanto como
  quieras, pero que nunca puedes tocar. Matemáticamente, esto nos permite hablar de
  todos los números que están estrictamente entre dos valores. Al representar esto
  en una recta numérica, utilizamos un punto hueco o círculo sin pintar sobre el número
  que actúa como extremo excluido para dejar claro visualmente que ese valor específico
  no es parte del grupo.'
definiciones_clave: '- **Representación de extremo excluido en la recta numérica**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
