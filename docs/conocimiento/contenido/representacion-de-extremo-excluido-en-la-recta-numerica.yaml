semantic_id: MAT.ALG.INTERVALOS.EXTREMO_EXCLUIDO
resumen_inicial: Un extremo excluido se representa en la recta numérica mediante un
  punto o círculo transparente sin rellenar (óvalo blanco).
explicacion_simple: 'Cuando un número frontera NO forma parte de la solución (como
  en $<$, $>$ o corchete abierto $]$ ), dibujamos sobre ese número un **círculo blanco
  sin rellenar (vacío)**.

  Ese anillo transparente indica que el conjunto se acerca infinitamente a ese número
  pero NUNCA lo toca ni lo incluye.'
explicacion_formal: 'Sea el extremo $a \notin ]a, b[$. La **convención gráfica de
  exclusión** se simboliza mediante:


  $$a \notin I \implies \circ \quad (\text{círculo transparente sin rellenar en }
  x = a)$$


  **Desglose de la fórmula:**

  - Representación de frontera abierta que declara la exclusión del valor puntual
  $a$.'
definiciones_clave: '- **Punto transparente / vacío ($\circ$)**: Marcador en la recta
  real que indica la exclusión del valor límite.

  - **Extremo abierto**: Límite que no satisface la condición estricta de pertenencia.'
propiedades_relaciones: '- **Correspondencia lógica**: El círculo vacío $\circ$ corresponde
  a los operadores $<, >$ y a los corchetes abiertos $], [$.'
ejemplo_guiado:
  enunciado: Muestra la representación gráfica del extremo $x = 5$ para la desigualdad
    $x < 5$.
  pasos:
  - 'Paso 1: Ubicar el número $5$ en la recta numérica.'
  - 'Paso 2: Dibujar un círculo transparente sin rellenar ($\circ$) exactamente sobre
    el número $5$.'
  - 'Paso 3: Sombrear la recta hacia la izquierda hacia $-\infty$.'
  - 'Paso 4: Concluir que el círculo vacío indica que $5$ no es parte de las soluciones.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué símbolo gráfico se utiliza en la recta numérica para mostrar que
    un extremo NO pertenece al intervalo?
  choices:
  - text: Un círculo transparente o vacío ($\circ$).
    is_correct: true
  - text: Un punto negro completamente relleno ($\bullet$).
    is_correct: false
  - text: Un triángulo invertido.
    is_correct: false
  - text: Una línea vertical continua.
    is_correct: false
  explanation: La alternativa correcta es 'Un círculo transparente o vacío ($\circ$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al graficar $x < 5$, ¿por qué se utiliza un círculo vacío en el número
    5?
  choices:
  - text: Porque la desigualdad es estricta ($<$) y excluye al número 5.
    is_correct: true
  - text: Porque 5 es un número entero.
    is_correct: false
  - text: Porque 5 no tiene raíz cuadrada.
    is_correct: false
  - text: Porque no hay más números a la izquierda.
    is_correct: false
  explanation: La alternativa correcta es 'Porque la desigualdad es estricta ($<$)
    y excluye al número 5.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la desigualdad sea estricta ($<, >$) o el corchete sea abierto.'
- 'Paso 2: Ubicar el extremo en la recta real.'
- 'Paso 3: Dibujar un círculo pequeño sin pintar el interior ($\circ$).'
errores_correccion: '- **Error común:** Rellenar el círculo en una desigualdad estricta
  $x < 5$.

  - **Cómo corregirlo:** Si la desigualdad NO tiene la barrita de igual abajo ($<$
  ó $>$), dejas el círculo totalmente transparente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
- Usar corchetes cerrados $[ ]$ para traducir desigualdades estrictas que no incluyen
  el signo igual.
- Colocar un corchete cerrado en los símbolos de infinito $+ \infty$ o $-\infty$.
- Escribir las fronteras del intervalo al revés colocando el número mayor a la izquierda.
- Creer que un intervalo real solo contiene a los números enteros de la zona.
- Olvidar sombrear la línea continua al dibujar la gráfica en la recta numérica.
afirmaciones_verdaderas:
- Un intervalo cerrado $[a, b]$ incluye a ambos extremos $a$ y $b$ dentro del conjunto
  de soluciones.
- El símbolo de infinito siempre lleva corchete abierto ya que representa una cota
  ilimitada no alcanzable.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, traducir y representar
  gráficamente intervalos reales abiertos, cerrados e infinitos.
fuente: Texto escolar MINEDUC — Álgebra / Intervalos Reales
