procedimiento:
- 'Paso 1: Identifica los dos ángulos que comparten un mismo lado lateral del trapecio.'
- 'Paso 2: Recuerda que esos dos ángulos colaterales son suplementarios (suman 180°).'
- 'Paso 3: Si conoces uno de los dos ángulos, resta su valor de 180° para obtener
  el otro.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
