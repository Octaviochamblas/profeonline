- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en suplementariedad
  de ángulos colaterales en un trapecio.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de suplementariedad
