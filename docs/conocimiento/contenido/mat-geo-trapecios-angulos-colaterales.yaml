semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.TRAPECIO_ANGULOS_COLATERALES
resumen_inicial: 'Suplementariedad de ángulos colaterales en un trapecio: conceptos,
  teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Los lados laterales de un trapecio conectan cada base con la otra,
  y en cada uno de esos lados se forman dos ángulos con una relación específica.
explicacion_formal: '![Ángulos colaterales suplementarios en un trapecio](/static/img/geometria/poligonos-cuadrilateros/trapecios-angulos-colaterales.svg)


  ### Definición formal


  En un trapecio $ABCD$ con $AB\parallel CD$, se cumple $\angle A+\angle D=180°$ y
  $\angle B+\angle C=180°$ (los ángulos que comparten el lado lateral AD, y los que
  comparten el lado lateral BC, respectivamente).


  ### Desarrollo didáctico


  Esta propiedad surge del paralelismo entre las bases: el lado lateral actúa como
  una transversal que corta a dos rectas paralelas, generando ángulos internos del
  mismo lado que son suplementarios (propiedad de rectas paralelas cortadas por una
  transversal).'
definiciones_clave: '- **Suplementariedad de ángulos colaterales en un trapecio**:
  Elemento o propiedad fundamental en el estudio de polígonos y cuadriláteros.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a suplementariedad de ángulos colaterales en
  un trapecio.'
ejemplo_guiado:
  enunciado: Para analizar suplementariedad de ángulos colaterales en un trapecio,
    considera un ángulo $\alpha = 124^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1319^\circ = 124^\circ$.
  pasos:
  - Identificar la propiedad de suplementariedad de ángulos colaterales en un trapecio
    referida a $\alpha = 124^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1319 = 124 \implies x = 124 - 1319$.'
  - Concluir que la medida calculada para suplementariedad de ángulos colaterales
    en un trapecio es $x = -1195^\circ$.
