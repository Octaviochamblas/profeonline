semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.IDENTIFICACION_LISTA
resumen_inicial: El M.C.D. por listas se encuentra enumerando los divisores de cada número y seleccionando el mayor divisor coincidente.
explicacion_simple: 'Este método consiste en encontrar y listar por separado todos los divisores de cada número dado. Después observamos ambas listas, buscamos todos los números que se repiten en ellas y encerramos el valor más grande de esa selección.


  ![Identificación del M.C.D. mediante lista de divisores comunes](/static/img/nodos/identificacion-del-mcd-mediante-lista-de-divisores-comunes-intro.svg)'
explicacion_formal: 'Dada la colección de conjuntos finitos de divisores $D^+(a_i) = \{ d \in \mathbb{N} \mid d \mid a_i \}$, el **Algoritmo de Intersección de Listas** determina:


  $$d^* = \max \left( D^+(a_1) \cap D^+(a_2) \cap \dots \cap D^+(a_k) \right)$$


  **Desglose de la fórmula:**

  - $D^+(a_i)$: Lista completa y finita de los divisores positivos de $a_i$.

  - $d^*$: El número de mayor valor presente de forma simultánea en todas las listas.


  > **Complemento didáctico:** Es un procedimiento muy claro y seguro que garantiza no cometer errores siempre que se listen correctamente todos los divisores de cada número.'
definiciones_clave: '- **Método de listas de divisores**: Búsqueda del M.C.D. mediante la comparación directa de los conjuntos de divisores de cada número.'
ejemplo_guiado:
  enunciado: 'Halle el M.C.D.(16, 24) enumerando sus listas de divisores.


    ![Ejemplo Identificación del M.C.D. mediante lista de divisores comunes](/static/img/nodos/identificacion-del-mcd-mediante-lista-de-divisores-comunes-ejemplos.svg)'
  pasos:
  - 'Paso 1: Listar divisores de 16: $\{1, 2, 4, 8, 16\}$.'
  - 'Paso 2: Listar divisores de 24: $\{1, 2, 3, 4, 6, 8, 12, 24\}$.'
  - 'Paso 3: Identificar los divisores coincidentes: $\{1, 2, 4, 8\}$.'
  - 'Conclusión: El mayor coincidente es $8$, por lo que $\operatorname{MCD}(16, 24) = 8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el M.C.D. entre 16 y 24 obtenido por comparación de listas?
  choices:
  - text: '8'
    is_correct: true
  - text: '4'
    is_correct: false
  - text: '16'
    is_correct: false
  - text: '48'
    is_correct: false
  explanation: La alternativa correcta es '8'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuáles fueron todos los divisores comunes entre 16 y 24?
  choices:
  - text: '{1, 2, 4, 8}'
    is_correct: true
  - text: '{1, 2, 3}'
    is_correct: false
  - text: '{8, 16, 24}'
    is_correct: false
  - text: No tienen divisores comunes
    is_correct: false
  explanation: La alternativa correcta es '{1, 2, 4, 8}'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el conjunto de divisores de cada uno de los números dados.'
- 'Paso 2: Marcar los números que pertenezcan simultáneamente a todos los conjuntos.'
- 'Paso 3: Seleccionar el número de mayor valor numérico como el M.C.D.'
errores_correccion: '- **Error 1: Omitir algún divisor al armar las listas de los números.** **Cómo corregirlo:** Usar la búsqueda por pares conjugados para asegurar la lista completa.


  - **Error 2: Seleccionar el menor divisor común en lugar del mayor.** **Cómo corregirlo:** El M.C.D. busca el MAYOR de los divisores comunes compartidos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Halle el M.C.D.(15, 20) por listas.
  alternativas:
  - '5'
  - '10'
  - '60'
  respuesta: '5'
  solucion_pasos:
  - 'Divisores 15: 1, 3, 5, 15. Divisores 20: 1, 2, 4, 5, 10, 20. MCD = 5.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el M.C.D.(14, 28) por el método de listas?
  alternativas:
  - '14'
  - '7'
  - '28'
  respuesta: '14'
  solucion_pasos:
  - 'Divisores de 14: 1, 2, 7, 14. Divisores de 28: 1, 2, 4, 7, 14, 28. MCD = 14.'
- titulo: ¿Se puede usar la lista de divisores para encontrar el M.C.D. de tres números?
  respuesta: Sí
  solucion_pasos:
  - Sí, intersectando los conjuntos de divisores de los tres números.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al mayor divisor común obtenido mediante el algoritmo correspondiente.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo del MCD entrega un valor entero único bien determinado.
  - texto: No es posible calcularlo con los métodos estándar
    es_correcta: false
    retroalimentacion: Incorrecto, los métodos de listas, tabla común, potencias primas y algoritmo de Euclides son deterministas y exactos.
- titulo: ¿Es el M.C.D.(9, 12) igual a 3?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, divisores 9: {1,3,9}; divisores 12: {1,2,3,4,6,12}. El mayor común es 3.'
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al mayor divisor común obtenido mediante el algoritmo correspondiente.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo del MCD entrega un valor entero único bien determinado.
  - texto: No es posible calcularlo con los métodos estándar
    es_correcta: false
    retroalimentacion: Incorrecto, los métodos de listas, tabla común, potencias primas y algoritmo de Euclides son deterministas y exactos.
errores_frecuentes:
- El método de listas exige seleccionar el menor divisor común distinto de 1.
- Si dos números no son pares es imposible construir una lista de divisores comunes.
- El M.C.D. obtenido por listas es igual al producto de todos los divisores comunes.
- La lista de divisores de un número compuesto contiene infinitos elementos.
- El número 1 debe descartarse de la lista de divisores de los enteros.
afirmaciones_verdaderas:
- El M.C.D. por listas identifica el mayor número común en los conjuntos de divisores de los números.
- Si $a$ divide a $b$, entonces $\operatorname{MCD}(a, b) = a$.
al_terminar_debes_poder: '**QUÉ:** Determinar el máximo común divisor mediante el método por extensión de listas de divisores comunes.


  **CÓMO:** Escribiendo exhaustivamente los conjuntos finitos de divisores $D(a)$ y $D(b)$, determinando su intersección $D(a) \cap D(b)$ y seleccionando el mayor elemento compartido.


  ![Resumen Identificación del M.C.D. mediante lista de divisores comunes](/static/img/nodos/identificacion-del-mcd-mediante-lista-de-divisores-comunes-resumen.svg)'
