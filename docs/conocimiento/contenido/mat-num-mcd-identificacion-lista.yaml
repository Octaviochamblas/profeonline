semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.IDENTIFICACION_LISTA
resumen_inicial: "El método de listado calcula el MCD escribiendo los divisores de cada número y eligiendo el mayor divisor común."
explicacion_simple: |
  ¿Cómo encuentras algo cuando tienes muchas cosas mezcladas? ¡Haces una lista! Si quieres
  saber el mayor divisor común de dos números, escribe dos listas: una con los divisores
  del primer número y otra con los del segundo. Luego busca los números que aparecen en
  ambas listas y elige el más grande.
explicacion_formal: |
  El conjunto de divisores de $n$, denotado $D(n)$, contiene todos los números que dividen
  exactamente a $n$. Para el MCD de $a$ y $b$: se calcula $D(a)$, $D(b)$, se toma la
  intersección $D(a)\cap D(b)$ (los divisores comunes), y se elige el mayor elemento. Para
  $\text{MCD}(24,36)$: $D(24)\cap D(36)=\{1,2,3,4,6,12\}$, por lo que $\text{MCD}=12$.
definiciones_clave: |
  **Intersección de divisores**: conjunto de números que dividen exactamente a la vez a
  dos o más números; el MCD es el mayor elemento de esa intersección.
propiedades_relaciones: |
  Este método es ideal para números pequeños (menores a 100); para números grandes resulta
  ineficiente y propenso a omitir divisores.
ejemplo_guiado:
  enunciado: "Calcula el MCD entre 20 y 30 listando sus divisores."
  pasos:
    - "Divisores de 20: $\\{1,2,4,5,10,20\\}$. Divisores de 30: $\\{1,2,3,5,6,10,15,30\\}$."
    - "Divisores comunes: $\\{1,2,5,10\\}$."
    - "Conclusión: el mayor es 10, por lo que $\\text{MCD}(20,30)=10$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué representa la intersección de las listas de divisores de dos números?"
    choices:
      - {text: "El conjunto de divisores comunes a ambos", is_correct: true}
      - {text: "El conjunto de múltiplos comunes", is_correct: false}
      - {text: "Solo el divisor 1", is_correct: false}
      - {text: "El producto de todos los divisores", is_correct: false}
    explanation: "La correcta es El conjunto de divisores comunes a ambos: el MCD es el mayor elemento de esa intersección."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el MCD entre 12 y 8?"
    choices:
      - {text: "4", is_correct: true}
      - {text: "2", is_correct: false}
      - {text: "24", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 4: divisores de 12 son $1,2,3,4,6,12$ y de 8 son $1,2,4,8$; el mayor común es 4."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Escribe la lista completa de los divisores del primer número, comenzando por el 1 y terminando en el número mismo.'
  - 'Paso 2: Escribe la lista completa de los divisores del segundo número de la misma manera.'
  - 'Paso 3: Identifica y subraya todos los números que aparecen en ambas listas (divisores comunes).'
  - 'Paso 4: Elige el número más grande de los divisores comunes identificados; este será el MCD.'
errores_correccion: |
  Un error frecuente es omitir divisores al escribir la lista (por ejemplo, olvidar el 1
  o el propio número). Otro error es listar múltiplos en vez de divisores.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Calcula el MCD de $16$ y $24$ listando sus divisores.
    alternativas:
      - "8"
      - "4"
      - "48"
    respuesta: "8"
    solucion_pasos:
      - 'Paso a: Listamos los divisores de $16$: $D(16) = \{1, 2, 4, 8, 16\}$.'
      - 'Paso b: Listamos los divisores de $24$: $D(24) = \{1, 2, 3, 4, 6, 8, 12, 24\}$.'
      - 'Paso c: Identificamos los divisores comunes entre ambas listas: $\{1, 2, 4, 8\}$.'
      - 'Paso d: Seleccionamos el mayor, que es $8$. Por ende, $\text{MCD}(16, 24) = 8$.'
  - titulo: Ejemplo 2
    enunciado: Determina el MCD de $18$ y $27$ listando sus divisores.
    alternativas:
      - "9"
      - "3"
      - "54"
    respuesta: "9"
    solucion_pasos:
      - 'Paso a: Los divisores de $18$ son $D(18) = \{1, 2, 3, 6, 9, 18\}$.'
      - 'Paso b: Los divisores de $27$ son $D(27) = \{1, 3, 9, 27\}$.'
      - 'Paso c: Intersecamos las dos listas para obtener los divisores comunes: $\{1, 3, 9\}$.'
      - 'Paso d: Elegimos el mayor valor, que es $9$. Por ende, $\text{MCD}(18, 27) = 9$.'
  - titulo: '¿El MCD de $14$ y $35$ es $7$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Los divisores de $14$ son $\{1, 2, 7, 14\}$.'
      - 'Los divisores de $35$ son $\{1, 5, 7, 35\}$.'
      - 'Los divisores comunes son $\{1, 7\}$, de los cuales el mayor es $7$. Así, $\text{MCD}(14, 35) = 7$.'
  - titulo: 'Al listar los divisores de $20$ y $30$, ¿es el divisor común más grande igual a $5$?'
    respuesta: 'No'
    solucion_pasos:
      - 'Los divisores de $20$ son $\{1, 2, 4, 5, 10, 20\}$.'
      - 'Los divisores de $30$ son $\{1, 2, 3, 5, 6, 10, 15, 30\}$.'
      - 'Los divisores comunes son $\{1, 2, 5, 10\}$. El mayor común es $10$, no $5$.'
errores_frecuentes:
  - Omitir divisores al escribir la lista (por ejemplo, olvidar el 1 o el propio número).
  - Listar los múltiplos del número en lugar de sus divisores.
  - Seleccionar un divisor que solo pertenece a uno de los números pero no es común a ambos.
  - Elegir el menor divisor común positivo (que siempre es 1) en lugar de elegir el mayor (MCD).
  - Dividir incorrectamente al comprobar si un número es divisor, lo que altera la lista resultante.
afirmaciones_verdaderas:
  - "El método de listado es útil para calcular el MCD de números pequeños."
  - "El MCD entre 16 y 24 es 8."
al_terminar_debes_poder: |
  Calcular el MCD de dos o más números mediante el método de comparación de listas de
  divisores.
fuente: Teoría de Números
estado: publicado
