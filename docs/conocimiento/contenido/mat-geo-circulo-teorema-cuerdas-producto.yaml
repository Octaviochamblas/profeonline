semantic_id: MAT.GEO.CIRCULO_TEOREMAS.CUERDAS_PRODUCTO
resumen_inicial: 'Teorema de las cuerdas como igualdad de productos de segmentos de
  cuerdas: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia
  y Círculo.'
explicacion_simple: 'Cuando dos cuerdas se cruzan dentro de un círculo, existe una
  relación numérica precisa entre los cuatro segmentos que forman: sus productos son
  iguales.'
explicacion_formal: '![Teorema de las cuerdas: PA×PB = PC×PD](/static/img/geometria/circunferencia-circulo/circulo-teorema-cuerdas-producto.svg)


  ### Definición formal


  Si las cuerdas $AB$ y $CD$ de una circunferencia se cruzan en un punto interior
  $P$, se cumple que $PA\times PB=PC\times PD$. Esta igualdad se demuestra mediante
  semejanza de los triángulos $PAC$ y $PDB$ (o $PAD$ y $PCB$, según la configuración).


  ### Desarrollo didáctico


  Si $PA=4$ cm, $PB=6$ cm y $PC=3$ cm, entonces $4\times6=3\times PD$, de donde $PD=\frac{24}{3}=8$
  cm. Este teorema permite calcular un segmento desconocido conociendo los otros tres.'
