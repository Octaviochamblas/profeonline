semantic_id: MAT.GEO.POSICIONES_RECTAS_CIRCUNFERENCIAS.PUNTO_MEDIO
resumen_inicial: 'Cálculo del punto medio entre dos puntos del plano cartesiano: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: El punto medio divide al segmento exactamente en dos partes iguales,
  y se obtiene calculando el promedio (media aritmética) de las coordenadas x, y por
  separado el de las coordenadas y.
explicacion_formal: '![Punto medio entre dos puntos](/static/img/geometria/analitica/posrc-punto-medio.svg)


  ### Definición formal


  El punto medio $M$ de un segmento con extremos $(x_1,y_1)$ y $(x_2,y_2)$ tiene coordenadas
  $M=\left(\dfrac{x_1+x_2}{2},\dfrac{y_1+y_2}{2}\right)$.


  ### Desarrollo didáctico


  Para $A(-3,-2)$ y $B(3,4)$: $M=\left(\dfrac{-3+3}{2},\dfrac{-2+4}{2}\right)=(0,1)$.'
