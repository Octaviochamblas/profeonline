- titulo: ¿Se cumple siempre la propiedad principal de cálculo del punto medio entre
    dos puntos del plano cartesiano en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
