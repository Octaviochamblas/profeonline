semantic_id: MAT.ALG.FRACCIONES_DIV.SIMPLIFICACION_RESULTADO
resumen_inicial: El cociente irreducible de una división de fracciones algebraicas
  se expresa en su menor grado declarando todas sus restricciones.
explicacion_simple: 'Tras convertir la división en multiplicación y simplificar todos
  los factores posibles, obtenemos el resultado final de la división.

  Este cociente debe ser una fracción irreducible, lo que significa que el numerador
  y denominador ya no comparten ningún factor común.

  Además, debemos tener presente que las restricciones del dominio provienen tanto
  de los denominadores iniciales como del numerador de la fracción que fue invertida.'
explicacion_formal: 'El **cociente irreducible** de la división $\frac{A(x)}{B(x)}
  \div \frac{C(x)}{D(x)}$ es la fracción reducida $R(x) = \frac{U(x)}{V(x)}$ tal que:


  $$\operatorname{gcd}(U(x), V(x)) = 1 \quad \land \quad \operatorname{Dom}(R) = \mathbb{R}
  \setminus \{x \mid B(x) \cdot C(x) \cdot D(x) = 0\}$$


  **Desglose de la fórmula:**

  - $\operatorname{gcd}(U(x), V(x)) = 1$: Indica que la expresión resultante no contiene
  factores comunes adicionales.

  - $\setminus \{B \cdot C \cdot D = 0\}$: Especifica las restricciones del dominio
  acumuladas, puesto que $C(x)$ pasó a ser denominador en el recíproco.'
definiciones_clave: '- **Cociente irreducible**: Fracción resultante final sin divisores
  polinomiales comunes adicionales.

  - **Restricción de división**: Exclusión de los ceros del primer denominador, del
  segundo denominador y del segundo numerador.'
propiedades_relaciones: '- **Triple origen de restricciones**: En una división $\frac{A}{B}
  \div \frac{C}{D}$, los tres polinomios $B$, $C$ y $D$ actúan en algún punto como
  denominadores.

  - **Verificación de cociente**: Multiplicar el cociente resultante por la segunda
  fracción original debe restituir la primera fracción.'
ejemplo_guiado:
  enunciado: Obtén la simplificación final de $\frac{x^2 - 4}{x^2 + 3x} \div \frac{x
    + 2}{x}$, indica sus restricciones y evalúa para $x = 4$.
  pasos:
  - 'Paso 1: Factorizar: $\frac{(x - 2)(x + 2)}{x(x + 3)} \div \frac{x + 2}{x}$.Paso
    2: Invertir el divisor: $\frac{(x - 2)(x + 2)}{x(x + 3)} \cdot \frac{x}{x + 2}$.Paso
    3: Registrar restricciones: $x \neq 0$, $x \neq -3$ y $x \neq -2$.Paso 4: Cancelar
    factores comunes $x$ y $(x + 2)$.Paso 5: Cociente irreducible final: $\frac{x
    - 2}{x + 3}$.Paso 6: Evaluar para $x = 4$: $\frac{4 - 2}{4 + 3} = \frac{2}{7}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles polinomios generan restricciones del dominio al dividir $\frac{A(x)}{B(x)}
    \div \frac{C(x)}{D(x)}$?
  choices:
  - text: Los polinomios $B(x)$, $D(x)$ y $C(x)$.
    is_correct: true
  - text: Solo los polinomios $B(x)$ y $D(x)$.
    is_correct: false
  - text: Solo el polinomio $A(x)$.
    is_correct: false
  - text: Únicamente el polinomio $C(x)$.
    is_correct: false
  explanation: La alternativa correcta es 'Los polinomios $B(x)$, $D(x)$ y $C(x)$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar el cociente irreducible $\frac{x - 2}{x + 3}$ para $x = 4$,
    ¿cuál es el resultado numérico?
  choices:
  - text: $\frac{2}{7}$
    is_correct: true
  - text: $\frac{4}{7}$
    is_correct: false
  - text: $\frac{2}{5}$
    is_correct: false
  - text: $\frac{1}{7}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{2}{7}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Realizar la división convirtiéndola en producto por el recíproco.'
- 'Paso 2: Cancelar los factores comunes directos y cruzados.'
- 'Paso 3: Multiplicar las expresiones irreductibles resultantes.'
- 'Paso 4: Declarar todas las restricciones acumuladas del dominio.'
- 'Paso 5: Presentar el cociente simplificado final.'
errores_correccion: '- **Error común:** Olvidar incluir los ceros del segundo numerador
  $C(x)$ al declarar las restricciones del dominio.

  - **Cómo corregirlo:** Recuerda que al invertir $\frac{C(x)}{D(x)}$ a $\frac{D(x)}{C(x)}$,
  el polinomio $C(x)$ se convierte en denominador, por lo que sus ceros también indefinen
  la expresión.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de división.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de división.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se invierte la segunda fracción al dividir?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla estándar.
- titulo: ¿La división de fracciones es conmutativa?
  respuesta: 'No'
  solucion_pasos:
  - No, el orden de las fracciones altera el resultado.
errores_frecuentes:
- Invertir la primera fracción en lugar de la segunda al dividir.
- Cambiar de signo los términos en vez de permutar numerador y denominador.
- Olvidar restringir del dominio los ceros del segundo numerador.
- Multiplicar en cruz las fracciones habiendo invertido previamente el divisor.
- Desarrollar productos de polinomios antes de factorizar.
afirmaciones_verdaderas:
- La división de fracciones algebraicas equivale a multiplicar la primera fracción
  por el inverso de la segunda.
- El dominio de una división de fracciones excluye los ceros del primer denominador,
  segundo denominador y segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver divisiones de fracciones
  algebraicas mediante la inversión del divisor y simplificación del cociente.
