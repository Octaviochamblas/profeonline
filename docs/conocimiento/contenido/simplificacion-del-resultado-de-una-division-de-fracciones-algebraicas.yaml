semantic_id: MAT.ALG.FRACCIONES_DIV.SIMPLIFICACION_RESULTADO
resumen_inicial: El cociente irreducible de una división de fracciones algebraicas se expresa en su menor grado declarando todas sus restricciones.
explicacion_simple: |
  Tras convertir la división en multiplicación e invertir el divisor, simplificamos todos los factores comunes verticales y cruzados.

  El resultado final debe ser una fracción irreducible, lo que significa que el numerador y el denominador ya no comparten ningún factor común distinto de 1.

  Además, debemos registrar que las restricciones del dominio provienen tanto de los denominadores originales como del numerador de la fracción que fue invertida.
explicacion_formal: |
  ### Definición formal
  El **cociente irreducible** de la división $\frac{A(x)}{B(x)} \div \frac{C(x)}{D(x)}$ es la fracción reducida $R(x) = \frac{U(x)}{V(x)}$ tal que:

  $$\operatorname{MCD}(U(x), V(x)) = 1 \quad \land \quad \operatorname{Dom}(R) = \mathbb{R} \setminus \{x \mid B(x) \cdot C(x) \cdot D(x) = 0\}$$

  ### Desglose de la fórmula
  - $\operatorname{MCD}(U(x), V(x)) = 1$: Indica que la expresión resultante no contiene factores comunes adicionales.
  - $\setminus \{B \cdot C \cdot D = 0\}$: Especifica las restricciones del dominio acumuladas, puesto que $C(x)$ pasó a ser denominador en el recíproco.

  ### Síntesis didáctica
  El cociente final expresa la división simplificada al mínimo junto con la totalidad de restricciones acumuladas.
definiciones_clave: |
  - **Cociente irreducible**: Fracción resultante final sin divisores polinomiales comunes adicionales.
  - **Restricción de división**: Exclusión de los ceros del primer denominador, del segundo denominador y del segundo numerador.
propiedades_relaciones: |
  - **Triple origen de restricciones**: En una división $\frac{A}{B} \div \frac{C}{D}$, los tres polinomios $B$, $C$ y $D$ actúan en algún punto como denominadores.
  - **Verificación de cociente**: Multiplicar el cociente resultante por la segunda fracción original debe restituir la primera fracción.
ejemplo_guiado:
  enunciado: 'Obtén la simplificación final de $\frac{x^2 - 4}{x^2 + 3x} \div \frac{x + 2}{x}$, indica sus restricciones y evalúa para $x = 4$.'
  pasos:
    - 'Paso 1: Factorizar: $\frac{(x - 2)(x + 2)}{x(x + 3)} \div \frac{x + 2}{x}$.'
    - 'Paso 2: Invertir el divisor: $\frac{(x - 2)(x + 2)}{x(x + 3)} \cdot \frac{x}{x + 2}$.'
    - 'Paso 3: Registrar restricciones: $x \neq 0$, $x \neq -3$ y $x \neq -2$.'
    - 'Paso 4: Cancelar factores comunes $x$ y $(x + 2)$.'
    - 'Paso 5: Cociente irreducible final: $\frac{x - 2}{x + 3}$.'
    - 'Paso 6: Evaluar para $x = 4$: $\frac{4 - 2}{4 + 3} = \frac{2}{7}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles polinomios generan restricciones del dominio al dividir $\frac{A(x)}{B(x)} \div \frac{C(x)}{D(x)}$?'
    choices:
      - {text: 'Los polinomios $B(x)$, $D(x)$ y $C(x)$', is_correct: true}
      - {text: 'Solo los polinomios $B(x)$ y $D(x)$', is_correct: false}
      - {text: 'Solo el polinomio $A(x)$', is_correct: false}
      - {text: 'Únicamente el polinomio $C(x)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Los polinomios $B(x)$, $D(x)$ y $C(x)$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar el cociente irreducible $\frac{x - 2}{x + 3}$ para $x = 4$, ¿cuál es el resultado numérico?'
    choices:
      - {text: '$\frac{2}{7}$', is_correct: true}
      - {text: '$\frac{4}{7}$', is_correct: false}
      - {text: '$\frac{2}{5}$', is_correct: false}
      - {text: '$\frac{1}{7}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{2}{7}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Realizar la división convirtiéndola en producto por el recíproco.'
  - 'Paso 2: Cancelar los factores comunes directos y cruzados.'
  - 'Paso 3: Multiplicar las expresiones irreductibles resultantes.'
  - 'Paso 4: Declarar todas las restricciones acumuladas del dominio.'
  - 'Paso 5: Presentar el cociente simplificado final.'
errores_correccion: |
  - **Error 1:** Omitir los ceros del segundo numerador $C(x)$ al declarar las restricciones del dominio. **Cómo corregirlo:** Al invertir $\frac{C(x)}{D(x)}$ a $\frac{D(x)}{C(x)}$, el polinomio $C(x)$ **PASA AL DENOMINADOR, POR LO QUE SUS CEROS TAMBIÉN INDEFINEN LA OPERACIÓN**.
  - **Error 2:** Dejar el resultado expresado con factores comunes sin simplificar en el numerador y denominador. **Cómo corregirlo:** Se debe **DIVIDIR CADA NIVEL POR EL M.C.D. HASTA OBTENER UNA FRACCIÓN IRREDUCTIBLE ($\operatorname{MCD}=1$)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es la forma irreducible de $\frac{x^2 - 9}{x} \div \frac{x + 3}{x}$?'
    alternativas:
      - '$x - 3$'
      - '$x + 3$'
      - '$\frac{x - 3}{x}$'
    respuesta: '$x - 3$'
    solucion_pasos:
      - '1. Convertir a producto: $\frac{(x-3)(x+3)}{x} \cdot \frac{x}{x+3}$.'
      - '2. Cancelar $x$ y $(x+3)$.'
      - '3. Cociente irreducible: $x - 3$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al simplificar la división $\frac{6x^2}{y} \div \frac{2x}{y^2}$, ¿cuál es la expresión resultante?'
    alternativas:
      - '$3xy$'
      - '$12x^3y^3$'
      - '$\frac{3x}{y}$'
    respuesta: '$3xy$'
    solucion_pasos:
      - '1. Convertir a producto: $\frac{6x^2}{y} \cdot \frac{y^2}{2x}$.'
      - '2. Simplificar $\frac{6}{2} = 3$, $\frac{x^2}{x} = x$ e $\frac{y^2}{y} = y$.'
      - '3. Resultado: $3xy$.'
  - titulo: 'Forma irreducible'
    enunciado: '¿Una fracción es irreducible cuando su numerador y denominador no comparten factores comunes?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la definición formal de fracción irreducible.'
  - titulo: 'Restricciones del divisor'
    enunciado: '¿Los ceros del numerador del divisor deben incluirse en las restricciones?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, porque dicho numerador se convierte en denominador al invertir.'
errores_frecuentes:
  - 'Omitir los ceros del segundo numerador al consolidar el conjunto de restricciones del dominio.'
  - 'Dejar factores algebraicos o numéricos comunes sin cancelar en el cociente final.'
  - 'Escribir 0 como denominador cuando se han simplificado todos sus términos.'
  - 'Distribuir exponentes de forma incorrecta al reducir las variables sobrantes.'
  - 'Olvidar verificar la irreductibilidad del cociente antes de dar por terminada la operación.'
afirmaciones_verdaderas:
  - 'El cociente irreducible de una división no posee factores comunes entre su numerador y su denominador.'
  - 'Las restricciones de una división provienen de ambos denominadores iniciales y del numerador del divisor.'
al_terminar_debes_poder: |
  Obtener y expresar el cociente irreducible de cualquier división de fracciones algebraicas declarando el conjunto completo de restricciones de dominio.
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.'
