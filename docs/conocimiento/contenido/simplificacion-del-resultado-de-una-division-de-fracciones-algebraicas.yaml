procedimiento:
- 'Paso 1: Realiza todas las cancelaciones posibles (verticales y cruzadas) sobre
  la multiplicación armada.'
- 'Paso 2: Junta los factores resultantes.'
- 'Paso 3: Asegúrate de que no existan factores comunes ocultos en tu resultado final.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en simplificación del resultado de una división de fracciones
  algebraicas.
ejemplos:
- titulo: 'Resuelve completo: $\frac{2a^2}{b} \div \frac{a}{3b^2}$'
  enunciado: 'Resuelve completo: $\frac{2a^2}{b} \div \frac{a}{3b^2}$.'
  solucion_pasos:
  - 'Invertir: $\frac{2a^2}{b} \cdot \frac{3b^2}{a}$.'
  - 'Cancelar ''a'' y ''b'': Arriba queda $2a$ y $3b$. Abajo nada.'
  - 'Resultado: $2a \cdot 3b = 6ab$.'
- titulo: Divide $\frac{x+y}{x-y} \div \frac{x+y}{x-y}$.
  solucion_pasos:
  - Cualquier cosa dividida por sí misma es 1. También comprobable invirtiendo y tachando
    todo cruzado.
- titulo: 'Respecto de «Simplificación del resultado de una división de fracciones
    algebraicas»: ¿Se aj'
  enunciado: 'Respecto de «Simplificación del resultado de una división de fracciones
    algebraicas»: ¿Se ajusta a la definición esta afirmación? «El resultado final
    de la división se arma multiplicando los factores no cancelados»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El resultado final de la división
    se arma multiplicando los factores no cancelados.'
- titulo: 'Respecto de «Simplificación del resultado de una división de fracciones
    algebraicas»: ¿Es co'
  enunciado: 'Respecto de «Simplificación del resultado de una división de fracciones
    algebraicas»: ¿Es compatible con el procedimiento esta afirmación? «Dejar denominadores
    igual a 0»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El resultado final de la división
    se arma multiplicando los factores no cancelados.'
errores_frecuentes:
- Dejar denominadores igual a 0.
- Dejar la respuesta sin multiplicar los factores finales cuando se solicita expandido.
- Que el resultado está mal.
- Que la fracción no se puede dividir.
- Para «Si al terminar una división te queda un polinomio en el numerador y un polinomio
  en el denominador que aún comparten un factor común, ¿qué significa», la respuesta
  correcta es Que el signo era diferente.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
