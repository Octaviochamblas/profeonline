semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.ALTERNOS_EXTERNOS_IGUALDAD
resumen_inicial: Si dos rectas paralelas son cortadas por una transversal, los ángulos
  alternos externos tienen exactamente la misma medida angular (son congruentes).
explicacion_simple: '![Igualdad de Alternos Externos](/static/img/nodos/propiedad-de-igualdad-de-medida-de-angulos-alternos-externos-entre-paralelas-intro.svg)


  Al igual que ocurre con los alternos internos, las dos esquinas exteriores opuestas
  tienen exactamente la misma inclinación. Por lo tanto, si el ángulo exterior superior
  derecho mide 45°, el ángulo exterior inferior izquierdo medirá también 45°.'
explicacion_formal: '### Teorema formal

  Si dos rectas paralelas $L_1$ y $L_2$ son cortadas por una recta secante transversal
  $T$, los ángulos alternos externos son estrictamente **congruentes**:


  $$L_1 \parallel L_2 \implies \alpha = \beta \quad (\text{Ángulos Alternos Externos})$$


  ### Desglose simbólico y geométrico

  - Deducción por transitividad: Son opuestos por el vértice de los ángulos alternos
  internos correspondientes.

  - Ecuación de congruencia: $\mu(\alpha) = \mu(\beta)$.


  ### Síntesis didáctica

  Permite igualar directamente medidas en los extremos exteriores de esquemas con
  vías, vigas o figuras poliédricas con lados paralelos.'
definiciones_clave: '- **Teorema de alternos externos**: Si $L_1 \parallel L_2$, entonces
  $\alpha = \beta$ para los pares alternos externos.

  - **Demostración por opuestos y correspondientes**: $\angle 1 = \angle 5$ (correspondientes)
  y $\angle 5 = \angle 7$ (opuestos por el vértice) $\implies \angle 1 = \angle 7$. '
propiedades_relaciones: '- **Igualdad recíproca**: La igualdad de un par de ángulos
  alternos externos garantiza el paralelismo de las rectas.

  - **Resolución algebraica**: Permite igualar directamente binomios que representen
  a estos ángulos. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Igualdad de Alternos Externos](/static/img/nodos/propiedad-de-igualdad-de-medida-de-angulos-alternos-externos-entre-paralelas-ejemplos.svg)


    Dos ángulos alternos externos entre rectas paralelas miden $\alpha = 5x - 20^\circ$
    y $\beta = 3x + 40^\circ$. Determina el valor de $x$ y la medida de los ángulos.'
  pasos:
  - 'Paso 1: Por teorema de alternos externos entre paralelas, igualar: $5x - 20^\circ
    = 3x + 40^\circ$.'
  - 'Paso 2: Agrupar términos con $x$: $5x - 3x = 40^\circ + 20^\circ$.'
  - 'Paso 3: Resolver: $2x = 60^\circ \implies x = 30^\circ$.'
  - 'Paso 4: Calcular la medida del ángulo: $5(30^\circ) - 20^\circ = 150^\circ -
    20^\circ = 130^\circ$.'
  - 'Paso 5: Comprobar: $3(30^\circ) + 40^\circ = 130^\circ$. Ambos miden $130^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la relación métrica entre dos ángulos alternos externos cuando
    las rectas son paralelas?
  choices:
  - text: Tienen exactamente la misma medida (son congruentes)
    is_correct: true
  - text: Suman 180° obligatoriamente
    is_correct: false
  - text: Suman 90°
    is_correct: false
  - text: Depende de la longitud de la secante
    is_correct: false
  explanation: Por teorema geométrico, tienen exactamente la misma medida (son congruentes).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo alterno externo mide 115° en rectas paralelas, ¿cuánto mide
    su pareja alterno externo?
  choices:
  - text: 115° (por ser iguales los alternos externos entre paralelas)
    is_correct: true
  - text: 65°
    is_correct: false
  - text: 25°
    is_correct: false
  - text: 230°
    is_correct: false
  explanation: 'Al ser alternos externos entre paralelas, tienen igual medida: 115°
    (por ser iguales los alternos externos entre paralelas).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las rectas paralelas $L_1 \parallel L_2$ y la transversal $T$.'
- 'Paso 2: Verificar que los dos ángulos estén en posición alterno externa.'
- 'Paso 3: Formular la igualdad $\alpha_1 = \alpha_2$.'
- 'Paso 4: Despejar la variable incógnita.'
errores_correccion: No confundas alternos externos (que son iguales) con colaterales
  externos (que suman 180°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si dos ángulos alternos externos miden $3x$ y $135^\circ$, ¿cuánto vale
    $x$?
  alternativas:
  - $45^\circ$
  - $35^\circ$
  - $15^\circ$
  respuesta: $45^\circ$
  solucion_pasos:
  - $3x = 135^\circ \implies x = 45^\circ$.
- titulo: Ejemplo 2
  enunciado: Si un ángulo alterno externo mide $40^\circ$, ¿cuánto mide su alterno
    externo?
  alternativas:
  - $40^\circ$
  - $140^\circ$
  - $50^\circ$
  respuesta: $40^\circ$
  solucion_pasos:
  - Por congruencia entre paralelas, mide exactamente $40^\circ$.
- titulo: ¿Los ángulos alternos externos son congruentes si las rectas son paralelas?
  respuesta: Sí
  solucion_pasos:
  - Sí, por teorema euclidiano siempre son congruentes entre rectas paralelas.
- titulo: ¿Dos ángulos alternos externos siempre suman 180°?
  respuesta: 'No'
  solucion_pasos:
  - No, son iguales; solo sumarían 180° si ambos midieran 90°.
errores_frecuentes:
- Sumar los ángulos e igualar a $180^\circ$ en vez de igualarlos entre sí.
- Aplicar la congruencia cuando las rectas no son paralelas.
- Confundir ángulos alternos externos con ángulos colaterales externos.
- Cometer fallos algebraicos al despejar incógnitas.
- Olvidar que los alternos externos están por fuera de la franja interna.
afirmaciones_verdaderas:
- Los ángulos alternos externos entre rectas paralelas son siempre congruentes.
- La igualdad entre alternos externos es una condición necesaria y suficiente de paralelismo.
al_terminar_debes_poder: '**QUÉ:** Aplicar la congruencia de ángulos alternos externos
  para encontrar medidas angulares e incógnitas.


  **CÓMO:** Igualando las expresiones algebraicas $\alpha_1 = \alpha_2$ bajo la condición
  $L_1 \parallel L_2$.


  ![Resumen de Igualdad de Alternos Externos](/static/img/nodos/propiedad-de-igualdad-de-medida-de-angulos-alternos-externos-entre-paralelas-resumen.svg)'
