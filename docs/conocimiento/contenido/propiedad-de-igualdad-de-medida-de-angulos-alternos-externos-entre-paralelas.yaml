semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.ALTERNOS_EXTERNOS_IGUALDAD
resumen_inicial: Los ángulos alternos entre rectas paralelas cortadas por una transversal
  son de igual medida, permitiendo trasladar ángulos a lo largo de líneas paralelas.
explicacion_simple: Imagina las vías paralelas de un tren cruzadas por un camino.
  Los ángulos que se forman en lados opuestos del camino y por dentro de las vías
  son iguales entre sí, como la forma de una letra 'Z'.
explicacion_formal: Cuando dos rectas paralelas $L_1 \parallel L_2$ son cortadas por
  una transversal $T$, los **ángulos alternos internos** (y alternos externos) situados
  en lados opuestos de la transversal son congruentes entre sí.
definiciones_clave: '- **Propiedad de igualdad de medida de ángulos alternos externos
  entre paralelas**: Elemento o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en propiedad de igualdad de medida de ángulos alternos externos entre paralelas
  se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Dos ángulos alternos externos entre paralelas vienen dados por las expresiones
    $2x + 30^\circ$ y $80^\circ$. Halla el valor de $x$.
  pasos:
  - 'Paso 1: Igualar los ángulos alternos externos por ser congruentes: $2x + 30 =
    80$.'
  - 'Paso 2: Restar 30: $2x = 50$.'
  - 'Paso 3: Despejar $x = \frac{50}{2} = 25^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de propiedad de igualdad de medida
    de ángulos alternos externos entre paralelas?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $2x + 30^\circ = 80^\circ$, ¿cuál es el valor de x?
  choices:
  - text: 25°
    is_correct: true
  - text: 50°
    is_correct: false
  - text: 40°
    is_correct: false
  - text: 20°
    is_correct: false
  explanation: La alternativa correcta es '25°', resultado de $2x = 50 \implies x
    = 25^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en propiedad de igualdad de medida de ángulos
  alternos externos entre paralelas.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en propiedad de igualdad
  de medida de ángulos alternos externos entre paralelas sean coherentes y tengan
  sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 114^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 66°
  - 114°
  - 90°
  respuesta: 66°
  solucion_pasos:
  - Despejando $x = 180 - 114 = 66^\circ$.
- titulo: Ejemplo 2
  enunciado: En propiedad de igualdad de medida de ángulos alternos externos entre
    paralelas, si dos ángulos son suplementarios y uno mide 114°, ¿cuánto mide el
    otro?
  alternativas:
  - 66°
  - 56°
  - 360°
  respuesta: 66°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 114 = 66^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en propiedad de
    igualdad de medida de ángulos alternos externos entre paralelas?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en propiedad de igualdad de medida
    de ángulos alternos externos entre paralelas es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de propiedad de igualdad de medida de ángulos
  alternos externos entre paralelas.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
