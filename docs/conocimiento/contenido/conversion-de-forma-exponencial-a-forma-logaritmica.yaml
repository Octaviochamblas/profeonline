semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.FORMA_EXPONENCIAL_A_LOGARITMICA
resumen_inicial: Una ecuación exponencial de la forma $b^c = a$ se transforma a notación logarítmica
  como $\log_b(a) = c$.
explicacion_simple: 'Para pasar una igualdad de potencia a un logaritmo:

  1. Escribes ''log''.

  2. Colocas la base de la potencia como la base pequeña del logaritmo.

  3. El resultado de la potencia pasa a ser el argumento dentro del logaritmo.

  4. El exponente pasa al otro lado de la igualdad.

  Ejemplo: $7^2 = 49 \implies \log_7(49) = 2$.'
explicacion_formal: Dada la igualdad de potencias $b^c = a$ con $b > 0, b \neq 1$ y $a > 0$,
  su transformación a forma logarítmica es $\log_b(a) = c$. Esta conversión permite aislar
  exponentes desconocidos en ecuaciones exponenciales.
definiciones_clave: '- **Aislamiento del exponente**: El logaritmo extrae el exponente $c$
  dejándolo como resultado del despeje.'
propiedades_relaciones: '- **Despeje exponencial**: $b^x = k \implies x = \log_b(k)$.'
ejemplo_guiado:
  enunciado: Despeja el exponente $x$ en la ecuación $3^x = 20$.
  pasos:
  - Identificar base $b = 3$, exponente $c = x$ y resultado $a = 20$.
  - Convertir a notación logarítmica $\log_b(a) = c$.
  - 'Obtener el despeje directo: $x = \log_3(20)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se expresa la igualdad $5^x = 18$ en notación logarítmica?
  choices:
  - text: x = \log_5(18)
    is_correct: true
  - text: x = \log_{18}(5)
    is_correct: false
  - text: 18 = \log_5(x)
    is_correct: false
  - text: x = 5^{18}
    is_correct: false
  explanation: 'La correcta es: x = \log_5(18). Se aísla el exponente $x$ aplicando logaritmo
    en base 5.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Transforma $e^y = 10$ a logaritmo natural.
  choices:
  - text: y = \ln(10)
    is_correct: true
  - text: 10 = \ln(y)
    is_correct: false
  - text: y = \log_{10}(e)
    is_correct: false
  - text: y = e^{10}
    is_correct: false
  explanation: 'La correcta es: y = \ln(10). El logaritmo en base $e$ se denota $\ln$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$ de la potencia y el resultado $a$.'
- 'Paso 2: Escribir el operador logarítmico con esa base: $\log_b(a)$.'
- 'Paso 3: Igualar dicho logaritmo al exponente $c$.'
errores_correccion: No olvides que la base de la potencia sigue siendo la base del logaritmo.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Despeja $x$ de $2^x = 7$.
  alternativas:
  - x = \log_2(7)
  - x = \log_7(2)
  - x = 14
  respuesta: x = \log_2(7)
  solucion_pasos:
  - $2^x = 7 \implies x = \log_2(7)$.
- titulo: Ejemplo 2
  enunciado: ¿Cómo se expresa 6^x=40 en notación logarítmica?
  alternativas:
  - x = log base 6 de 40
  - x = log base 40 de 6
  - 40 = log base 6 de x
  respuesta: x = log base 6 de 40
  solucion_pasos:
  - Se aísla el exponente aplicando logaritmo en la base de la potencia.
- titulo: Ejemplo 3
  enunciado: Transforma 10^y=250 a logaritmo decimal.
  alternativas:
  - y = log(250)
  - 250 = log(y)
  - y = log base 250 de 10
  respuesta: y = log(250)
  solucion_pasos:
  - La base 10 corresponde al logaritmo decimal, sin subíndice.
- titulo: ¿Es correcto que 3^x=50 se transforma en x=log base 50 de 3?
  respuesta: 'No'
  solucion_pasos:
  - La base de la potencia (3) debe ser la base del logaritmo, no el resultado (50).
errores_frecuentes:
- Invertir la base y el argumento al pasar a logaritmo.
- Invertir la base y el resultado de la potencia al escribir el logaritmo equivalente.
- Olvidar que la base de la potencia debe conservarse como base del logaritmo.
- Confundir el logaritmo natural con el logaritmo decimal al convertir una potencia de base
  e.
- Aplicar la conversión sin verificar que la base de la potencia sea positiva y distinta de
  1.
afirmaciones_verdaderas:
- $b^c = a \implies c = \log_b(a)$.
- Al convertir de forma exponencial a logarítmica, el exponente desconocido queda despejado
  como resultado del logaritmo.
al_terminar_debes_poder: Despejar exponentes desconocidos mediante notación logarítmica.
fuente: Texto escolar MINEDUC.
estado: publicado
