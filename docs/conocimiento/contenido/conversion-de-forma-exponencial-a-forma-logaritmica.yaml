semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.FORMA_EXPONENCIAL_A_LOGARITMICA
resumen_inicial: 'Para transformar una potencia $b^c = a$ a forma logarítmica, se aísla el exponente $c$ como resultado del logaritmo en base $b$ del argumento $a$: $\log_b(a) = c$.'
explicacion_simple: '![Conversión de exponencial a logaritmo](/static/img/nodos/conversion-de-forma-exponencial-a-forma-logaritmica-intro.svg)


  Cuando tienes una potencia $b^c = a$ y quieres despejar el exponente $c$:

  - El exponente $c$ pasa a quedar completamente solo al otro lado del igual.

  - La base $b$ se convierte en el subíndice del logaritmo.

  - El resultado $a$ entra como argumento dentro del logaritmo.

  - Ejemplo: $3^4 = 81 \implies \log_3(81) = 4$.'
explicacion_formal: 'Dada la ecuación exponencial $b^c = a$ con $b > 0, b \neq 1$ y $a > 0$, la **transformación a forma logarítmica** consiste en aplicar el operador $\log_b(\cdot)$ a ambos lados de la igualdad:


  $$\log_b(b^c) = \log_b(a) \implies c = \log_b(a) \iff \log_b(a) = c$$


  Este procedimiento constituye la herramienta analítica fundamental para despejar incógnitas que se encuentran en el exponente en ecuaciones exponenciales.'
definiciones_clave: '- **Conversión logarítmica**: Transformación analítica de $b^c = a$ en $\log_b(a) = c$.

  - **Despeje de exponente**: Aislamiento de la variable $c$ mediante el operador logaritmo.

  - **Base común**: Conservación del valor $b$ como base de ambos operadores.'
propiedades_relaciones: '- **Biyección exponencial-logaritmo**: $b^c = a$ si y solo si $\log_b(a) = c$.

  - **Logaritmación de ecuaciones**: Método estándar para resolver $a^x = b$ cuando las bases no son múltiplos comunes ($x = \log_a(b)$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de conversión a logaritmo](/static/img/nodos/conversion-de-forma-exponencial-a-forma-logaritmica-ejemplos.svg)


    Convierta a forma logarítmica las potencias $3^4 = 81$, $5^{-1} = \frac{1}{5}$ y $10^2 = 100$.'
  pasos:
  - 'Paso 1: Para $3^4 = 81$: Base 3, argumento 81, exponente 4 $\implies \log_3(81) = 4$.'
  - 'Paso 2: Para $5^{-1} = \frac{1}{5}$: Base 5, argumento $\frac{1}{5}$, exponente -1 $\implies \log_5\left(\frac{1}{5}\right) = -1$.'
  - 'Paso 3: Para $10^2 = 100$: Base 10, argumento 100, exponente 2 $\implies \log(100) = 2$.'
  - 'Conclusión: Las formas logarítmicas son $\log_3(81) = 4$, $\log_5\left(\frac{1}{5}\right) = -1$ y $\log(100) = 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma logarítmica de $2^7 = 128$?
  choices:
  - text: $\log_2(128) = 7$
    is_correct: true
  - text: $\log_7(128) = 2$
    is_correct: false
  - text: $\log_2(7) = 128$
    is_correct: false
  - text: $\log_{128}(2) = 7$
    is_correct: false
  explanation: La alternativa correcta es '$\log_2(128) = 7$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿a qué logaritmo equivale $5^{-1} = \frac{1}{5}$?
  choices:
  - text: $\log_5\left(\frac{1}{5}\right) = -1$
    is_correct: true
  - text: $\log_5(-1) = \frac{1}{5}$
    is_correct: false
  - text: $\log_{-1}(5) = \frac{1}{5}$
    is_correct: false
  - text: $\log(5) = -1$
    is_correct: false
  explanation: La alternativa correcta es '$\log_5\left(\frac{1}{5}\right) = -1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar en la potencia $b^c = a$ la base $b$, el exponente $c$ y el resultado $a$.'
- 'Paso 2: Escribir el operador $\log_b$ con argumento $a$.'
- 'Paso 3: Igualar la expresión logarítmica al exponente $c$: $\log_b(a) = c$.'
errores_correccion: '- **Error 1: Poner el exponente dentro del logaritmo ($\log_b(c) = a$).** **Cómo corregirlo:** El exponente $c$ es siempre el resultado aislado al otro lado del signo igual.

  - **Error 2: Cambiar la base de posición.** **Cómo corregirlo:** La base $b$ de la potencia es la base subíndice del logaritmo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $6^3 = 216$, ¿cuál es su expresión en forma logarítmica?
  alternativas:
  - $\log_6(216) = 3$
  - $\log_3(216) = 6$
  - $\log_6(3) = 216$
  respuesta: $\log_6(216) = 3$
  solucion_pasos:
  - Base 6, argumento 216, exponente 3 $\implies \log_6(216) = 3$.
- titulo: Ejemplo 2
  enunciado: ¿Cómo se escribe $e^x = y$ en forma logarítmica?
  alternativas:
  - $\ln(y) = x$
  - $\log(y) = x$
  - $\ln(x) = y$
  respuesta: $\ln(y) = x$
  solucion_pasos:
  - 'La base $e$ define el logaritmo natural: $\ln(y) = x$.'
- titulo: ¿Es 7² = 49 equivalente a log₇(49) = 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la base es 7, el argumento 49 y el exponente 2.
  alternativas:
  - texto: Sí, log₇(49) = 2
    es_correcta: true
    retroalimentacion: ¡Correcto! Conversión exacta a logaritmo.
  - texto: No, es log₂(49) = 7
    es_correcta: false
    retroalimentacion: Incorrecto, la base es 7.
  - texto: No, es log₄₉(7) = 2
    es_correcta: false
    retroalimentacion: Incorrecto, el argumento es 49.
- titulo: ¿Es 10⁻² = 0,01 equivalente a log(0,01) = -2?
  respuesta: Sí
  solucion_pasos:
  - Sí, en base decimal tácita $\log(0,01) = -2$.
  alternativas:
  - texto: Sí, log(0,01) = -2
    es_correcta: true
    retroalimentacion: ¡Correcto! Base 10 omitida y exponente negativo.
  - texto: No, es log(0,01) = 2
    es_correcta: false
    retroalimentacion: Incorrecto, falta el signo negativo del exponente.
  - texto: No, es log(-2) = 0,01
    es_correcta: false
    retroalimentacion: Incorrecto, los logaritmos no llevan argumento negativo.
errores_frecuentes:
- Ubicar el exponente como argumento del logaritmo.
- Confundir la base con el exponente al convertir.
- Olvidar omitir el subíndice 10 en logaritmos decimales.
- Intentar logaritmar potencias con base negativa.
afirmaciones_verdaderas:
- Toda igualdad exponencial $b^c = a$ se puede reescribir como $\log_b(a) = c$.
- El logaritmo despeja la variable que actúa como exponente.
- La base de la potencia se conserva como base del logaritmo.
al_terminar_debes_poder: '![Síntesis de conversión a logaritmo](/static/img/nodos/conversion-de-forma-exponencial-a-forma-logaritmica-resumen.svg)


  QUÉ: Convertir expresiones exponenciales a su forma logarítmica equivalente.


  CÓMO: Identificando la base $b$, el exponente $c$ y el resultado $a$ en $b^c = a$, y expresándolos como $\log_b(a) = c$.'
