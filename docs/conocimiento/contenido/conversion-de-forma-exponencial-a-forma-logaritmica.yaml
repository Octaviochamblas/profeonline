resumen_inicial: Convertir una potencia $b^c = a$ a forma logarítmica consiste en
  reescribirla como $\log_b(a) = c$, expresando el exponente $c$ como el logaritmo
  en base $b$ del resultado $a$.
explicacion_simple: Para pasar de notación de potencia a logaritmo, aislamos el exponente
  $c$ y lo igualamos al logaritmo donde la base de la potencia $b$ pasa a ser el subíndice
  y la potencia $a$ se convierte en el argumento.
explicacion_formal: 'La conversión de la igualdad de potencia $b^c = a$ a su **Forma
  Logarítmica Equivalente** se define como:


  $$b^c = a \implies \log_b(a) = c$$


  **Mapeo de componentes:**

  - Base de la potencia $b \implies$ Subíndice base del logaritmo.

  - Resultado de la potencia $a \implies$ Argumento interno del logaritmo.

  - Exponente $c \implies$ Resultado del logaritmo.'
definiciones_clave: '- **Conversión a logarítmica**: Pasaje directo de $b^c = a$ a
  $\log_b(a) = c$.'
propiedades_relaciones: '- **Despeje de exponente**: Aísla el exponente $c$ mediante
  la función logaritmo.'
ejemplo_guiado:
  enunciado: Convierta a forma logarítmica las ecuaciones $5^3 = 125$ y $4^{-1} =
    0,25$.
  pasos:
  - 'Paso 1: Para $5^3 = 125$, la base es $5$, la potencia es $125$ y el exponente
    es $3 \implies \log_5(125) = 3$.'
  - 'Paso 2: Para $4^{-1} = 0,25$, la base es $4$, la potencia es $0,25$ y el exponente
    es $-1 \implies \log_4(0,25) = -1$.'
  - 'Conclusión: Las formas logarítmicas son $\log_5(125) = 3$ y $\log_4(0,25) = -1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se reescribe en forma logarítmica la ecuación exponencial b^c =
    a?
  choices:
  - text: Como el logaritmo log_b(a) = c
    is_correct: true
  - text: Como log_a(b) = c
    is_correct: false
  - text: Como log_c(a) = b
    is_correct: false
  - text: Como log_b(c) = a
    is_correct: false
  explanation: La alternativa correcta es 'Como el logaritmo log_b(a) = c'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4^{-1} = 0,25, ¿cuál fue la forma logarítmica
    obtenida?
  choices:
  - text: log_4(0,25) = -1
    is_correct: true
  - text: log_{-1}(0,25) = 4
    is_correct: false
  - text: log_4(-1) = 0,25
    is_correct: false
  - text: log_{0,25}(4) = 1
    is_correct: false
  explanation: La alternativa correcta es 'log_4(0,25) = -1'.
  reinforcement_section: Ejemplo guiado
