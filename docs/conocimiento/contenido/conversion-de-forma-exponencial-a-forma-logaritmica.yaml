semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.FORMA_EXPONENCIAL_A_LOGARITMICA
resumen_inicial: Una ecuación exponencial de la forma $b^c = a$ se transforma a notación
  logarítmica como $\log_b(a) = c$.
explicacion_simple: 'Para pasar una igualdad de potencia a un logaritmo:

  1. Escribes ''log''.

  2. Colocas la base de la potencia como la base pequeña del logaritmo.

  3. El resultado de la potencia pasa a ser el argumento dentro del logaritmo.

  4. El exponente pasa al otro lado de la igualdad.

  Ejemplo: $7^2 = 49 \implies \log_7(49) = 2$.'
explicacion_formal: Dada la igualdad de potencias $b^c = a$ con $b > 0, b \neq 1$
  y $a > 0$, su transformación a forma logarítmica es $\log_b(a) = c$. Esta conversión
  permite aislar exponentes desconocidos en ecuaciones exponenciales.
definiciones_clave: '- **Aislamiento del exponente**: El logaritmo extrae el exponente
  $c$ dejándolo como resultado del despeje.'
propiedades_relaciones: '- **Despeje exponencial**: $b^x = k \implies x = \log_b(k)$.'
ejemplo_guiado:
  enunciado: Despeja el exponente $x$ en la ecuación $3^x = 20$.
  pasos:
  - Identificar base $b = 3$, exponente $c = x$ y resultado $a = 20$.
  - Convertir a notación logarítmica $\log_b(a) = c$.
  - 'Obtener el despeje directo: $x = \log_3(20)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se expresa la igualdad $5^x = 18$ en notación logarítmica?
  choices:
  - text: x = \log_5(18)
    is_correct: true
  - text: x = \log_{18}(5)
    is_correct: false
  - text: 18 = \log_5(x)
    is_correct: false
  - text: x = 5^{18}
    is_correct: false
  explanation: 'La correcta es: x = \log_5(18). Se aísla el exponente $x$ aplicando
    logaritmo en base 5.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Transforma $e^y = 10$ a logaritmo natural.
  choices:
  - text: y = \ln(10)
    is_correct: true
  - text: 10 = \ln(y)
    is_correct: false
  - text: y = \log_{10}(e)
    is_correct: false
  - text: y = e^{10}
    is_correct: false
  explanation: 'La correcta es: y = \ln(10). El logaritmo en base $e$ se denota $\ln$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$ de la potencia y el resultado $a$.'
- 'Paso 2: Escribir el operador logarítmico con esa base: $\log_b(a)$.'
- 'Paso 3: Igualar dicho logaritmo al exponente $c$.'
errores_correccion: No olvides que la base de la potencia sigue siendo la base del
  logaritmo.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Despeja $x$ de $2^x = 7$.
  alternativas:
  - x = \log_2(7)
  - x = \log_7(2)
  - x = 14
  respuesta: x = \log_2(7)
  solucion_pasos:
  - $2^x = 7 \implies x = \log_2(7)$.
errores_frecuentes:
- Invertir la base y el argumento al pasar a logaritmo.
afirmaciones_verdaderas:
- $b^c = a \implies c = \log_b(a)$.
al_terminar_debes_ponder: Despejar exponentes desconocidos mediante notación logarítmica.
fuente: Texto escolar MINEDUC.
estado: publicado
