semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.AREA_TRAPECIO
resumen_inicial: 'El área de un trapecio es el producto de la semisuma de sus bases por la altura, equivalente a la mediana por la altura: A = [(B + b) / 2] · h = M · h.'
explicacion_simple: '¿De dónde sale la fórmula del área de un trapecio? Imagina que tomas un trapecio idéntico de cartulina, lo pones de cabeza y lo pegas al lado del primero. ¡Juntos forman un paralelogramo gigante cuya base mide $(B + b)$ y cuya altura es $h$!


  Como tu trapecio original es exactamente la mitad de ese paralelogramo gigante, su área es la mitad: **$A = \frac{(B + b) \cdot h}{2}$**. Y como ya sabes que $\frac{B + b}{2}$ es la mediana ($M$), ¡el área es simplemente **$A = M \cdot h$**!


  ![Cálculo del área de un trapecio](/static/img/nodos/calculo-del-area-de-un-trapecio-intro.svg)

  '
explicacion_formal: '### Teorema del área del trapecio

  Sea $\mathcal{ABCD}$ un trapecio con base mayor $B$, base menor $b$ y altura perpendicular $h$. El área superficial $A$ viene dada por:

  $$A = \frac{(B + b) \cdot h}{2} = \left(\frac{B + b}{2}\right) \cdot h = M \cdot h$$


  ### Demostración geométrica por duplicación

  1. Sea un trapecio $T_1$ de bases $B$ y $b$ y altura $h$.

  2. Constrúyase una copia congruente $T_2$ rotada $180^\circ$ adyacente a $T_1$.

  3. La figura resultante $T_1 \cup T_2$ es un paralelogramo cuya base total es $B + b$ y su altura es $h$.

  4. El área del paralelogramo es $\text{Área}(P) = (B + b) \cdot h$.

  5. Dado que $\text{Área}(T_1) = \text{Área}(T_2)$, se concluye:

  $$A = \frac{\text{Área}(P)}{2} = \frac{(B + b) \cdot h}{2}$$


  ### Despejes algebraicos frecuentes

  - Altura conociendo el área: $h = \frac{2A}{B + b} = \frac{A}{M}$.

  - Suma de bases conociendo el área y la altura: $B + b = \frac{2A}{h}$.


  > **Complemento didáctico:** La conexión $A = M \cdot h$ te ahorrará muchísimo tiempo en la prueba. Si una pregunta te da directamente la mediana (o base media) y la altura, simplemente multiplícalas directamente. ¡No pierdas tiempo buscando las bases individuales!

  '
definiciones_clave: '- **Área del trapecio ($A$)**: Medida de la región bidimensional interior encerrada por el trapecio.

  - **Mediana ($M$)**: Factor de escala horizontal del área equivalente a $\frac{B + b}{2}$.

  - **Altura ($h$)**: Distancia perpendicular estricta entre las dos rectas de las bases.

  '
propiedades_relaciones: '- **Descomposición triangular por diagonal**: Si se traza una diagonal, el área equivale a la suma de dos triángulos: $\frac{B \cdot h}{2} + \frac{b \cdot h}{2} = \frac{(B + b)h}{2}$.

  - **Razón de áreas de triángulos de las diagonales**: Los triángulos opuestos apoyados sobre las bases tienen áreas en la razón $A_B / A_b = (B / b)^2$.

  - **Equivalencia con el rectángulo**: Un trapecio tiene exactamente la misma área que un rectángulo de base $M$ y altura $h$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de área de trapecio](/static/img/nodos/calculo-del-area-de-un-trapecio-ejemplos.svg)


    Un campo agrícola tiene forma de trapecio con base mayor de $30$ m, base menor de $18$ m y altura de $10$ m. Calcula el área total del campo.'
  pasos:
  - 'Paso 1: Sumar las bases: $B + b = 30 + 18 = 48$ m.'
  - 'Paso 2: Multiplicar por la altura perpendicular: $48 \cdot 10 = 480\text{ m}^2$.'
  - 'Paso 3: Dividir entre 2 para obtener el área del trapecio: $A = \frac{480}{2} = 240\text{ m}^2$.'
  - 'Paso 4: Verificación alternativa con mediana: $M = \frac{48}{2} = 24$ m $\implies A = 24 \cdot 10 = 240\text{ m}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el área de un trapecio conociendo su mediana M y su altura h?
  choices:
  - text: A = M · h.
    is_correct: true
  - text: A = (M · h) / 2.
    is_correct: false
  - text: A = 2 · M · h.
    is_correct: false
  - text: A = M + h.
    is_correct: false
  explanation: La alternativa correcta es 'A = M · h.' Como la mediana ya incorpora la división por 2 ($M = \frac{B + b}{2}$), el área es directamente $A = M \cdot h$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un trapecio tiene un área de 70 cm² y sus bases miden 12 cm y 8 cm. ¿Cuánto mide su altura?
  choices:
  - text: 7 cm.
    is_correct: true
  - text: 14 cm.
    is_correct: false
  - text: 3,5 cm.
    is_correct: false
  - text: 10 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''7 cm.'' Mediana $M = \frac{12 + 8}{2} = 10$ cm. Despejando: $h = \frac{A}{M} = \frac{70}{10} = 7$ cm.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar la base mayor $B$, la base menor $b$ y la altura perpendicular $h$.

  2. Calcular la semisuma de las bases: $(B + b) / 2$ (mediana $M$).

  3. Multiplicar la mediana por la altura: $A = M \cdot h$.

  4. Asignar unidades cuadradas al resultado final ($\text{cm}^2, \text{m}^2$).

  '
errores_correccion: '- **Error común 1:** Olvidar dividir por 2 la fórmula y responder $(B + b) \cdot h$. **Corrección:** $(B + b) \cdot h$ es el área de dos trapecios juntos; debes dividir siempre por 2.

  - **Error común 2:** Usar la longitud del lado oblicuo en lugar de la altura perpendicular. **Corrección:** La altura debe formar $90^\circ$ con las bases.

  '
ejemplos:
- tipo: A
  titulo: Área con bases decimales
  enunciado: Un trapecio tiene bases de $7{,}5\text{ cm}$ y $4{,}5\text{ cm}$ con altura de $6\text{ cm}$. ¿Cuál es su área?
  alternativas:
  - text: $36\text{ cm}^2$.
    is_correct: true
  - text: $72\text{ cm}^2$.
    is_correct: false
  - text: $18\text{ cm}^2$.
    is_correct: false
  - text: $24\text{ cm}^2$.
    is_correct: false
  explicacion: $M = \frac{7{,}5 + 4{,}5}{2} = 6\text{ cm}$. $A = 6 \cdot 6 = 36\text{ cm}^2$.
- tipo: B
  titulo: Área y lado lateral
  enunciado: ¿Se necesita conocer la longitud de los lados oblicuos para calcular el área de un trapecio si ya se conocen las bases y la altura?
  respuesta: 'No'
  explicacion: No. El área depende exclusivamente de las dos bases y de la altura perpendicular.
errores_frecuentes:
- '''Olvidar dividir entre 2 al calcular el área del trapecio.'''
- '''Multiplicar la suma de bases por el lado inclinado en lugar de la altura.'''
- '''Dividir entre 2 la mediana creyendo que aún falta dividirla.'''
afirmaciones_verdaderas:
- '''El área de un trapecio es estrictamente igual a $A = \frac{(B + b) \cdot h}{2}$.'''
- '''El área equivale al producto de la mediana por la altura: $A = M \cdot h$.'''
- '''Dos trapecios con las mismas bases y la misma altura tienen exactamente la misma área.'''
al_terminar_debes_poder: '**QUÉ:** Calcular el área de trapecios y despejar alturas o bases conocidas otras magnitudes métricas.


  **CÓMO:** Aplicando las fórmulas $A = \frac{(B + b) \cdot h}{2}$ y $A = M \cdot h$.


  ![Síntesis de área de trapecio](/static/img/nodos/calculo-del-area-de-un-trapecio-resumen.svg)

  '
