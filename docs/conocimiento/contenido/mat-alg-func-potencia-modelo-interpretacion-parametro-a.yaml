  - 'El parámetro de escala $a$ cambia de valor a medida que la variable $x$ aumenta.'
  - 'Las unidades del parámetro $a$ son idénticas a las unidades de la variable independiente $x$.'
  - 'En la función $f(x) = 5x^3$, el número 5 es la variable dependiente.'
  - 'El parámetro $a$ depende del valor que tome el exponente $n$.'
afirmaciones_verdaderas:
  - 'En cualquier modelo de función potencia $f(x) = a x^n$, el coeficiente $a$ representa exactamente el valor de salida de la función cuando la variable de entrada vale $x = 1$.'
  - 'Las unidades físicas del coeficiente $a$ se obtienen al dividir la unidad de la variable dependiente $y$ por la unidad de la variable independiente elevada a la potencia $x^n$.'
