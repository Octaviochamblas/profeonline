semantic_id: MAT.ALG.MULT_POLINOMIOS.EXPONENTES_LITERALES
resumen_inicial: 'Multiplicación de polinomios con exponentes literales: leyes, procedimiento
  y aplicación en Multiplicación de polinomios.'
explicacion_simple: En algunos productos polinomiales los exponentes también están
  representados por letras. Las leyes de potencias siguen siendo válidas siempre que
  se identifique correctamente la base.
explicacion_formal: '### Definición formal


  Si dos potencias tienen la misma base y exponentes algebraicos $\alpha$ y $\beta$,
  entonces, siempre que la expresión esté definida,

  $$x^{\alpha}\cdot x^{\beta}=x^{\alpha+\beta}.$$

  En la multiplicación de polinomios con exponentes literales, cada producto parcial
  combina los coeficientes de la manera usual y suma algebraicamente los exponentes
  de las bases iguales. Dos términos resultantes son semejantes solo si coinciden
  exactamente sus partes literales completas, incluyendo las expresiones que aparecen
  en los exponentes.


  ### Desarrollo didáctico


  Para ser semejantes, tanto la base como el exponente completo deben ser idénticos.
  $a+1 \neq a+2$.


  El $1$ es el elemento neutro de la multiplicación. $x^{2a} \cdot 1 = x^{2a}$. (No
  se suma $1$ al exponente porque no es $x^1$, es $x^0$).


  Suma: $(m - 3) + (m + 5) = 2m + 2$.'
definiciones_clave: '- **Multiplicación de polinomios con exponentes literales**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
