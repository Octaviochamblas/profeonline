resumen_inicial: La multiplicación de polinomios con exponentes literales aplica rigurosamente
  las leyes distributivas, de signos y de potencias en expresiones algebraicas.
explicacion_simple: Al trabajar con multiplicación de polinomios con exponentes literales,
  multiplicamos los coeficientes numéricos, aplicamos la regla de signos y sumamos
  los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Multiplicación de polinomios
  con exponentes literales** viene dada por:


  $$\text{"el producto x^n · (x^(n+1) + x^n)"} \implies x^(2n+1) + x^(2n)$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Multiplicación de polinomios con exponentes literales**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule multiplicación de polinomios con exponentes literales para:
    ''el producto x^n · (x^(n+1) + x^n)''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es x^(2n+1) + x^(2n).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar multiplicación de polinomios con exponentes
    literales a 'el producto x^n · (x^(n+1) + x^n)'?
  choices:
  - text: x^(2n+1) + x^(2n)
    is_correct: true
  - text: x^(n^2+1) + x^(n^2)
    is_correct: false
  - text: 2x^(2n+1)
    is_correct: false
  - text: x^(n+2)
    is_correct: false
  explanation: La alternativa correcta es 'x^(2n+1) + x^(2n)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto x^n · (x^(n+1) + x^n)', ¿qué expresión
    resultante se obtuvo?
  choices:
  - text: x^(2n+1) + x^(2n)
    is_correct: true
  - text: x^(n^2+1) + x^(n^2)
    is_correct: false
  - text: 2x^(2n+1)
    is_correct: false
  - text: x^(n+2)
    is_correct: false
  explanation: La alternativa correcta es 'x^(2n+1) + x^(2n)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante multiplicación de polinomios con exponentes literales.** **Cómo corregirlo:**
  Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de multiplicación de polinomios con exponentes
    literales en 'el producto x^n · (x^(n+1) + x^n)'?
  alternativas:
  - x^(2n+1) + x^(2n)
  - x^(n^2+1) + x^(n^2)
  - 2x^(2n+1)
  - x^(n+2)
  respuesta: x^(2n+1) + x^(2n)
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener x^(2n+1) + x^(2n).
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto x^n · (x^(n+1) + x^n)' por multiplicación de
    polinomios con exponentes literales, ¿qué expresión resulta?
  alternativas:
  - x^(2n+1) + x^(2n)
  - x^(n^2+1) + x^(n^2)
  - 2x^(2n+1)
  - x^(n+2)
  respuesta: x^(2n+1) + x^(2n)
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir x^(2n+1) + x^(2n).
- titulo: ¿Es la multiplicación en 'el producto x^n · (x^(n+1) + x^n)' equivalente
    a x^(2n+1) + x^(2n)?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene x^(2n+1) + x^(2n).
- titulo: ¿Da el producto de 'el producto x^n · (x^(n+1) + x^n)' un resultado igual
    a x^(n^2+1) + x^(n^2)?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es x^(2n+1) + x^(2n).
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar multiplicación de polinomios
  con exponentes literales.
- Omitir distribuir el monomio o término sobre todos los sumandos en multiplicación
  de polinomios con exponentes literales.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La multiplicación de polinomios con exponentes literales requiere sumar los exponentes
  de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la multiplicación de
  polinomios con exponentes literales aplicando distributividad, ley de signos y suma
  de exponentes.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Multiplicación.
