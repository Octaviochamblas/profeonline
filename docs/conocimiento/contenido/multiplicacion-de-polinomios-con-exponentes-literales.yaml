semantic_id: MAT.ALG.MULT_POLINOMIOS.EXPONENTES_LITERALES
resumen_inicial: 'La multiplicación de polinomios con exponentes literales consiste en multiplicar términos cuyas potencias contienen variables algebraicas sumando algebraicamente las expresiones de los exponentes.'
explicacion_simple: |
  A veces las potencias de las variables no son números simples como $x^2$ o $x^3$, sino **expresiones algebraicas como $x^n$, $x^{a+1}$ o $x^{2m-3}$**:
  - **REGLA DE POTENCIAS LITERALES**: **Conserva la base y SUMA ALGEBRAICAMENTE las expresiones de los exponentes**.
  - **Fórmula**: $x^a \cdot x^b = x^{a + b}$.
  - **Ejemplos**:
    - $x^n \cdot x^{n+2} = x^{n + (n+2)} = \mathbf{x^{2n+2}}$.
    - $y^{m-1} \cdot y^{m+3} = y^{(m-1) + (m+3)} = y^{m+m - 1+3} = \mathbf{y^{2m+2}}$.
  - **En productos de polinomios**: Aplicas la propiedad distributiva igual que siempre, pero al multiplicar la parte literal haces una **suma de polinomios en los exponentes**.
explicacion_formal: |
  ### Definición formal
  Sean $A(x) = \sum a_i x^{P_i(n)}$ y $B(x) = \sum b_j x^{Q_j(n)}$ dos polinomios en $\mathbb{R}[x]$ cuyas potencias están indexadas por polinomios en el anillo de exponentes $\mathbb{Z}[n]$. La **multiplicación con exponentes literales** aplica el operador producto de potencias de igual base sobre las expresiones polinómicas cuadráticas o lineales de exponente:

  $$(a_i x^{P_i(n)}) \cdot (b_j x^{Q_j(n)}) = (a_i \cdot b_j) x^{P_i(n) + Q_j(n)}$$

  ### Adición de Exponentes Multivariables
  Si $P_i(n) = c_i n + d_i$ y $Q_j(n) = e_j n + f_j$ son funciones lineales en la variable entera $n$, la suma de exponentes reduce los términos semejantes del propio exponente:

  $$\text{Exponente resultante} = (c_i + e_j) n + (d_i + f_j)$$

  ### Síntesis didáctica
  Multiplicar con exponentes literales es una operación doble: se multiplica la base algebraica mientras se suman algebraicamente los polinomios del exponente.
definiciones_clave: |
  - **Exponente literal**: Expresión algebraica (como $a+1$ o $2m-5$) ubicada en la posición de la potencia de una variable.
  - **Adición de exponentes literales**: Reducción de términos semejantes efectuada sobre las expresiones que conforman los exponentes ($P_i + Q_j$).
  - **Doble reducción semejante**: Proceso donde se reducen semejantes tanto en la base del polinomio final como en los exponentes de cada monomio.
propiedades_relaciones: |
  - **Invarianza de leyes de potencias**: La ley $x^A \cdot x^B = x^{A+B}$ se mantiene idéntica sin importar la complejidad del exponente.
  - **Homomorfismo exponente-base**: Las reglas de adición del exponente simulan el comportamiento de las operaciones entre términos semejantes.
ejemplo_guiado:
  enunciado: 'Multiplica los polinomios con exponentes literales $(x^{a+1} - 2x^a) \cdot (x^{a+2} + 3x^{a+1})$.'
  pasos:
    - 'Paso 1: Multiplicamos término 1 del primero por el segundo polinomio:
       - $x^{a+1} \cdot x^{a+2} = x^{(a+1) + (a+2)} = \mathbf{x^{2a+3}}$.
       - $x^{a+1} \cdot 3x^{a+1} = 3 x^{(a+1) + (a+1)} = \mathbf{+3x^{2a+2}}$.'
    - 'Paso 2: Multiplicamos término 2 del primero por el segundo polinomio:
       - $-2x^a \cdot x^{a+2} = -2 x^{a + (a+2)} = \mathbf{-2x^{2a+2}}$.
       - $-2x^a \cdot 3x^{a+1} = -6 x^{a + (a+1)} = \mathbf{-6x^{2a+1}}$.'
    - 'Paso 3: Reunimos los 4 productos parciales:
       $x^{2a+3} + 3x^{2a+2} - 2x^{2a+2} - 6x^{2a+1}$.'
    - 'Paso 4: Reducimos la Clase $x^{2a+2}$: $+3x^{2a+2} - 2x^{2a+2} = \mathbf{+x^{2a+2}}$.'
    - 'Conclusión: El polinomio producto ordenado es **$x^{2a+3} + x^{2a+2} - 6x^{2a+1}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué operación debe realizarse entre los exponentes al multiplicar $x^{n+3} \cdot x^{2n-1}$?'
    choices:
      - {text: 'Se debe sumar algebraicamente las expresiones de los exponentes: $(n+3) + (2n-1) = 3n + 2$, obteniendo $x^{3n+2}$', is_correct: true}
      - {text: 'Se deben multiplicar las expresiones: $(n+3)(2n-1)$', is_correct: false}
      - {text: 'Se deben restar los exponentes', is_correct: false}
      - {text: 'Se conserva el exponente $n+3$ cancelando la variable $n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se debe sumar algebraicamente las expresiones de los exponentes: $(n+3) + (2n-1) = 3n + 2$, obteniendo $x^{3n+2}$''. Adición de exponentes literales.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de multiplicar $(2a^{m}) \cdot (3a^{m+1})$?'
    choices:
      - {text: 'El resultado es $6a^{2m+1}$, multiplicando $2 \cdot 3 = 6$ y sumando $m + (m+1) = 2m + 1$', is_correct: true}
      - {text: 'El resultado es $6a^{m^2+m}$', is_correct: false}
      - {text: 'El resultado es $5a^{2m+1}$', is_correct: false}
      - {text: 'El resultado es $6a^{m+1}$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $6a^{2m+1}$, multiplicando $2 \cdot 3 = 6$ y sumando $m + (m+1) = 2m + 1$''. $2 \cdot 3 = 6$, $a^{m + m + 1} = a^{2m+1}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Aplicar la regla general de multiplicación de polinomios distribuyendo cada término.'
  - 'Paso 2: Para la parte literal de cada producto parcial, escribir la base común.'
  - 'Paso 3: En el exponente de la base, plantear la suma de las expresiones algebraicas exponenciales.'
  - 'Paso 4: Reducir los términos semejantes dentro del propio exponente y reducir los términos semejantes del polinomio principal.'
errores_correccion: |
  - **Error 1:** Multiplicar las expresiones algebraicas de los exponentes (escribir $x^n \cdot x^m = x^{nm}$). **Cómo corregirlo:** Al multiplicar potencias de igual base **LOS EXPONENTES SE SUMAN ALGEBRAICAMENTE ($x^{n+m}$)**.
  - **Error 2:** Multiplicar las variables del exponente con la variable base. **Cómo corregirlo:** Las variables del exponente **PERMANECEN ARRIBA DENTRO DE LA POTENCIA**.
ejemplos:
  - titulo: 'Producto simple de exponente literal'
    enunciado: '¿Cuál es el resultado de $x^a \cdot x^{a+3}$?'
    alternativas:
      - '$x^{2a+3}$'
      - '$x^{a^2+3a}$'
      - '$x^{a+3}$'
    respuesta: '$x^{2a+3}$'
    solucion_pasos:
      - '1. Suma en exponente: $a + (a + 3) = 2a + 3$.'
      - '2. Resultado: $x^{2a+3}$.'
  - titulo: 'Distribución con exponente literal'
    enunciado: '¿Cuál es el desarrollo de $y^n \cdot (y^n - 2)$?'
    alternativas:
      - '$y^{2n} - 2y^n$'
      - '$y^{n^2} - 2y^n$'
      - '$y^{2n} - 2$'
    respuesta: '$y^{2n} - 2y^n$'
    solucion_pasos:
      - '1. $y^n \cdot y^n = y^{n+n} = y^{2n}$.'
      - '2. $y^n \cdot (-2) = -2y^n$.'
      - '3. Resultado: $y^{2n} - 2y^n$.'
  - titulo: 'Resta en el exponente'
    enunciado: 'Para $x^{m+2} \cdot x^{m-2}$, ¿se obtiene $x^{2m}$ al sumar $(m+2) + (m-2)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $+2 - 2 = 0 \implies m + m = 2m$.'
  - titulo: 'Preservación de ley de base'
    enunciado: '¿Sigue aplicándose la ley $a^P \cdot a^Q = a^{P+Q}$ sin importar cuán complejo sea el polinomio $P$ y $Q$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la regla es universal para potencias de igual base.'
errores_frecuentes:
  - 'Multiplicar las expresiones algebraicas de los exponentes entre sí en lugar de sumarlas.'
  - 'Mezclar las variables de la base con las variables contenidas en los exponentes literales.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'La reducción de los términos semejantes dentro de la expresión del exponente no se realiza.'
  - 'Cambiar el signo de la variable del exponente al multiplicar.'
afirmaciones_verdaderas:
  - 'Al multiplicar potencias con exponentes literales de igual base se suman algebraicamente las expresiones de los exponentes.'
  - 'La adición de exponentes literales requiere reducir los términos semejantes que conforman el propio exponente.'
al_terminar_debes_poder: 'Multiplicar polinomios con exponentes literales sumando algebraicamente las expresiones de las potencias.'
