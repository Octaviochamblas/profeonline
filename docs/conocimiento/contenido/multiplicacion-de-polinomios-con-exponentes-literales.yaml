procedimiento:
- 'Paso 1: Multiplica los coeficientes numéricos de los términos que intervienen en
  cada producto parcial.'
- 'Paso 2: Para cada base literal repetida, conserva la base y suma algebraicamente
  sus exponentes.'
- 'Paso 3: Mantén separados los términos cuyos exponentes literales no coincidan exactamente.'
- 'Paso 4: Después de expandir todo el producto, identifica qué términos son verdaderamente
  semejantes.'
- 'Paso 5: Reduce solo los términos con la misma parte literal completa y ordena el
  resultado final.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en multiplicación de polinomios con exponentes literales.
ejemplos:
- titulo: Si en la expansión de $(2x^k - 3)(x^k + 5)$ el término central se reduce
    a $7x^3$, ¿cuál es
  enunciado: 'Si en la expansión de $(2x^k - 3)(x^k + 5)$ el término central se reduce
    a $7x^3$, ¿cuál es el valor de $k$?


    Opciones: A) $3$ · B) $6$ · C) $1.5$ · D) $4$'
  solucion_pasos:
  - El producto es $2x^{2k} + 10x^k - 3x^k - 15 = 2x^{2k} + 7x^k - 15$. El término
    central es $7x^k$. Como nos dicen que es $7x^3$, entonces $k=3$.
  - 'Respuesta: $3$'
- titulo: Cuál es la expresión factorizada de $m^{2a+2} + m^{2a+1}$ luego de extraer
    como factor común
  enunciado: '¿Cuál es la expresión factorizada de $m^{2a+2} + m^{2a+1}$ luego de
    extraer como factor común al monomio de menor grado?


    Opciones: A) $m^{2a+1}(m + 1)$ · B) $m^{2a}(m^2 + m)$ · C) $m^{a+1}(m^{a+1} +
    m^a)$ · D) $m^{2a+1}(m)$'
  solucion_pasos:
  - 'Revertimos la distribución. El menor grado es $2a+1$. Dividiendo obtenemos: $m^{(2a+2)-(2a+1)}
    + 1 = m^1 + 1$. Luego: $m^{2a+1}(m + 1)$.'
