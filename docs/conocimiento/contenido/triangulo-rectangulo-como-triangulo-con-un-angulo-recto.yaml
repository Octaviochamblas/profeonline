semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.RECTANGULO
resumen_inicial: Un triángulo rectángulo es aquel que posee exactamente un ángulo
  interior recto (90°), delimitado por dos catetos perpendiculares y con una hipotenusa
  opuesta que es el lado de mayor longitud.
explicacion_simple: '![Triángulo Rectángulo](/static/img/nodos/triangulo-rectangulo-como-triangulo-con-un-angulo-recto-intro.svg)


  Un **triángulo rectángulo** tiene una esquina cuadrada perfecta de **$90^\circ$**
  (como la esquina de un libro o de una pared). Los dos lados que forman la esquina
  recta se llaman **catetos**, y el lado largo inclinado que está al frente se llama
  **hipotenusa**. Sus otros dos ángulos siempre suman **$90^\circ$**.'
explicacion_formal: '### Definición formal

  Un triángulo $\Delta ABC$ es **rectángulo** si posee exactamente un ángulo interior
  recto ($90^\circ$ o $\frac{\pi}{2} \text{ rad}$):


  $$\Delta ABC \text{ es rectángulo} \iff \exists \, \theta \in \{\alpha, \beta, \gamma\},
  \; \theta = 90^\circ$$


  $$\gamma = 90^\circ \implies \vec{CA} \perp \vec{CB} \iff a^2 + b^2 = c^2 \quad
  (\text{Teorema de Pitágoras})$$


  ### Desglose simbólico y geométrico

  - Catetos ($a, b$): Los dos lados perpendiculares entre sí que forman el ángulo
  recto.

  - Hipotenusa ($c$): Lado mayor opuesto al ángulo recto.

  - Ángulos agudos complementarios: $\alpha + \beta = 90^\circ$.


  ### Síntesis didáctica

  El triángulo rectángulo es la figura central de la trigonometría, la geometría analítica
  y la teoría métrica euclidiana.'
definiciones_clave: '- **Triángulo rectángulo**: Triángulo con exactamente un ángulo
  interior de $90^\circ$.

  - **Catetos**: Los dos lados perpendiculares que forman el ángulo recto.

  - **Hipotenusa**: Lado opuesto al ángulo recto (siempre el lado de mayor longitud).

  - **Ángulos complementarios**: Los dos ángulos agudos que suman $90^\circ$. '
propiedades_relaciones: '- **Área directa**: El área se calcula directamente como
  el semiproducto de los catetos: $A = \frac{b \cdot c}{2}$.

  - **Circuncentro en el punto medio**: El centro de la circunferencia circunscrita
  se ubica exactamente en el punto medio de la hipotenusa, y el radio es $R = a/2$.

  - **Ortocentro en el vértice recto**: Las dos alturas coinciden con los catetos,
  por lo que el ortocentro es el propio vértice del ángulo recto. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Triángulo Rectángulo](/static/img/nodos/triangulo-rectangulo-como-triangulo-con-un-angulo-recto-ejemplos.svg)


    En un triángulo rectángulo, uno de los ángulos agudos mide $34^\circ$ y los catetos
    miden $6\text{ cm}$ y $8\text{ cm}$. Calcula la medida del otro ángulo agudo y
    la longitud de la hipotenusa.'
  pasos:
  - 'Paso 1: Calcular el ángulo agudo faltante sabiendo que son complementarios: $\beta
    = 90^\circ - 34^\circ = 56^\circ$.'
  - 'Paso 2: Aplicar el Teorema de Pitágoras para hallar la hipotenusa $a$: $a^2 =
    b^2 + c^2 = 6^2 + 8^2$.'
  - 'Paso 3: Calcular los cuadrados: $a^2 = 36 + 64 = 100$.'
  - 'Paso 4: Extraer la raíz cuadrada positiva: $a = \sqrt{100} = 10\text{ cm}$.'
  - 'Paso 5: Concluir que el otro ángulo agudo mide $56^\circ$ y la hipotenusa mide
    $10\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué nombre reciben los dos lados que forman el ángulo recto en un triángulo
    rectángulo?
  choices:
  - text: Catetos
    is_correct: true
  - text: Hipotenusas
    is_correct: false
  - text: Medianas
    is_correct: false
  - text: Bases
    is_correct: false
  explanation: En la terminología geométrica formal, los dos lados que forman el ángulo
    recto se denominan catetos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo rectángulo tiene un ángulo agudo de 25°, ¿cuánto mide
    el otro ángulo agudo?
  choices:
  - text: 65° (porque 90° - 25° = 65°)
    is_correct: true
  - text: 75°
    is_correct: false
  - text: 155°
    is_correct: false
  - text: 25°
    is_correct: false
  explanation: Por ser ángulos complementarios en el triángulo rectángulo, mide 65°
    (porque 90° - 25° = 65°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la presencia del ángulo recto de $90^\circ$ (marcado con un
  recuadro).'
- 'Paso 2: Reconocer los catetos $b, c$ y la hipotenusa $a$ (frente al ángulo de $90^\circ$).'
- 'Paso 3: Para calcular un ángulo agudo desconocido, restar el agudo conocido de
  $90^\circ$.'
- 'Paso 4: Para relacionar las longitudes de los lados, aplicar el Teorema de Pitágoras
  $a^2 = b^2 + c^2$.'
errores_correccion: Recuerda que la hipotenusa siempre está enfrente del ángulo recto
  y es estrictamente el lado más largo.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si los catetos de un triángulo rectángulo miden $5\text{ cm}$ y $12\text{
    cm}$, ¿cuánto mide la hipotenusa?
  alternativas:
  - $13\text{ cm}$
  - $17\text{ cm}$
  - $15\text{ cm}$
  respuesta: $13\text{ cm}$
  solucion_pasos:
  - $\text{Hipotenusa} = \sqrt{5^2 + 12^2} = \sqrt{25 + 144} = \sqrt{169} = 13\text{
    cm}$.
- titulo: Ejemplo 2
  enunciado: En un triángulo rectángulo isósceles, ¿cuánto miden sus ángulos agudos?
  alternativas:
  - $45^\circ\text{ cada uno}$
  - $60^\circ\text{ y }30^\circ$
  - $50^\circ\text{ y }40^\circ$
  respuesta: $45^\circ\text{ cada uno}$
  solucion_pasos:
  - Al ser isósceles, los dos agudos son iguales: $90^\circ / 2 = 45^\circ$.
- titulo: ¿Un triángulo puede tener un ángulo recto de 90° y ser isósceles?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el triángulo rectángulo isósceles con ángulos 90°, 45° y 45°.
- titulo: ¿Un triángulo puede tener dos ángulos rectos de 90° en el plano?
  respuesta: 'No'
  solucion_pasos:
  - No, dos ángulos rectos sumarían 180°, dejando 0° para el tercer ángulo.
errores_frecuentes:
- Confundir catetos con la hipotenusa.
- Sumar los ángulos agudos igualándolos a 180° en lugar de 90°.
- Aplicar el Teorema de Pitágoras en triángulos que no son rectángulos.
- Olvidar extraer la raíz cuadrada al despejar la hipotenusa.
- Asumir que la hipotenusa puede ser menor que un cateto.
afirmaciones_verdaderas:
- Un triángulo rectángulo tiene exactamente un ángulo interior de $90^\circ$.
- Los dos ángulos agudos de un triángulo rectángulo siempre suman $90^\circ$.
al_terminar_debes_poder: '**QUÉ:** Identificar, caracterizar y resolver problemas
  en triángulos rectángulos.


  **CÓMO:** Aplicando la complementariedad de los ángulos agudos ($\beta + \gamma
  = 90^\circ$) y el Teorema de Pitágoras ($b^2 + c^2 = a^2$).


  ![Resumen de Triángulo Rectángulo](/static/img/nodos/triangulo-rectangulo-como-triangulo-con-un-angulo-recto-resumen.svg)'
