semantic_id: MAT.GEO.SEGMENTO_MEDIO.TRIANGULO_CENTRAL_AREA_UN_CUARTO
resumen_inicial: 'Razón de área 1:4 entre el triángulo central formado por segmentos
  medios y el triángulo original: conceptos, teoremas, propiedades geométricas y cálculo
  en Elementos Secundarios del Triángulo.'
explicacion_simple: Como los cuatro triángulos formados por los segmentos medios son
  congruentes, el central (llamado triángulo medial) ocupa exactamente una cuarta
  parte del área total del triángulo original.
explicacion_formal: '![Triángulo medial con un cuarto del área](/static/img/geometria/elementos-secundarios/segmento-medio-triangulo-central-area-un-cuarto.svg)


  ### Definición formal


  Si el triángulo medial MNP se forma uniendo los puntos medios de los lados de un
  triángulo ABC, entonces $\text{Área}(MNP)=\frac{1}{4}\text{Área}(ABC)$.


  ### Desarrollo didáctico


  Si el triángulo original tiene área 20, el triángulo medial (central) tiene área
  20/4=5. Esto es consistente con que los cuatro triángulos congruentes formados reparten
  el área total en 4 partes iguales.'
definiciones_clave: '- **Razón de área 1:4 entre el triángulo central formado por
  segmentos medios y el triángulo original**: Elemento o propiedad fundamental en
  el estudio de elementos secundarios del triángulo.'
