semantic_id: MAT.ALG.CUBO_BINOMIO.REGLA_SUMA
resumen_inicial: 'La aplicación de la regla del cubo de binomio suma consiste en expandir expresiones complejas $(ax^n + by^m)^3$ elevando coeficientes al cubo y multiplicando exponentes por 3 en el primer y último término y operando los triples productos intermedios.'
explicacion_simple: |
  Para expandir binomios suma con **coeficientes y exponentes más grandes** como $(2x^2 + 5)^3$:
  - **FÓRMULA PASO A PASO**: $(a + b)^3 = \mathbf{a^3 + 3a^2 b + 3ab^2 + b^3}$.
  - **Pasos detallados con $(2x^2 + 5)^3$**:
    1. **Cubo del primer término**: $(2x^2)^3 = 2^3 \cdot (x^2)^3 = \mathbf{8x^6}$.
    2. **Triple del cuadrado del primero por el segundo**:
       $3 \cdot (2x^2)^2 \cdot 5 = 3 \cdot (4x^4) \cdot 5 = \mathbf{60x^4}$.
    3. **Triple del primero por el cuadrado del segundo**:
       $3 \cdot (2x^2) \cdot 5^2 = 3 \cdot (2x^2) \cdot 25 = \mathbf{150x^2}$.
    4. **Cubo del segundo término**: $5^3 = \mathbf{125}$.
  - **Resultado unificado**: **$8x^6 + 60x^4 + 150x^2 + 125$**.
explicacion_formal: |
  ### Definición formal
  Sea la suma de monomios multivariables $B = (c_1 x^{\alpha} + c_2 y^{\beta})$ en $\mathbb{R}[x,y]$. El operador de expansión cúbica directa $\Phi: \mathbb{R}[x,y] \to \mathbb{R}[x,y]$ está dado por:

  $$\Phi(B^3) = \left(c_1 x^{\alpha}\right)^3 + 3 \left(c_1 x^{\alpha}\right)^2 \left(c_2 y^{\beta}\right) + 3 \left(c_1 x^{\alpha}\right) \left(c_2 y^{\beta}\right)^2 + \left(c_2 y^{\beta}\right)^3$$

  Operando la ley de potencias de un producto $(c \cdot x^\alpha)^k = c^k \cdot x^{k\alpha}$:

  $$\mathbf{\Phi(B^3) = c_1^3 x^{3\alpha} + 3 c_1^2 c_2 x^{2\alpha} y^{\beta} + 3 c_1 c_2^2 x^{\alpha} y^{2\beta} + c_2^3 y^{3\beta}}$$

  ### Triplicación de Exponentes Monómicos
  En los términos extremos, el exponente de cada variable se **multiplica por 3** ($3\alpha$ y $3\beta$), mientras que en los términos intermedios se aplican los multiplicadores $2\alpha$ y $2\beta$ respectivamente.

  ### Síntesis didáctica
  Aplicar jerárquicamente la potencia antes del producto escalar evita errores al calcular $3a^2b$ y $3ab^2$ sobre monomios con coeficientes.
definiciones_clave: |
  - **Triplicación de exponentes ($3\alpha, 3\beta$)**: Regla de ley de potencias por la cual las potencias de las variables en los términos extremos son multiplicadas por 3.
  - **Evaluación jerárquica de potencias**: Orden obligatorio que exige elevar al cuadrado o al cubo el monomio antes de multiplicarlo por el coeficiente 3.
  - **Tetranomio multivariable homogéneo**: Polinomio ordenado de 4 términos generado por la expansión de monomios compuestos.
propiedades_relaciones: |
  - **Crecimiento de coeficientes constantes**: Los coeficientes crecen rápidamente debido al factor 3 multiplicado por las potencias cuadráticas y cúbicas de $c_1$ y $c_2$.
ejemplo_guiado:
  enunciado: 'Desarrolla mediante la regla del cubo de binomio suma la expresión $(3x^3 + 2y)^3$.'
  pasos:
    - 'Paso 1: Identificamos $a = 3x^3$ y $b = 2y$.'
    - 'Paso 2: Calculamos $a^3$: $(3x^3)^3 = 3^3 \cdot (x^3)^3 = \mathbf{27x^9}$.'
    - 'Paso 3: Calculamos $3a^2b$: $3 \cdot (3x^3)^2 \cdot (2y) = 3 \cdot (9x^6) \cdot (2y) = \mathbf{54x^6 y}$.'
    - 'Paso 4: Calculamos $3ab^2$: $3 \cdot (3x^3) \cdot (2y)^2 = 3 \cdot (3x^3) \cdot (4y^2) = \mathbf{36x^3 y^2}$.'
    - 'Paso 5: Calculamos $b^3$: $(2y)^3 = 2^3 \cdot y^3 = \mathbf{8y^3}$.'
    - 'Paso 6: Unimos los 4 términos: $27x^9 + 54x^6 y + 36x^3 y^2 + 8y^3$.'
    - 'Conclusión: El desarrollo expandido es **$27x^9 + 54x^6 y + 36x^3 y^2 + 8y^3$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al calcular el segundo término $3a^2b$ en la expansión de $(2x^2 + 3)^3$, ¿cuál es el orden correcto de las operaciones?'
    choices:
      - {text: 'Primero se eleva al cuadrado el término $2x^2$ obteniendo $4x^4$, y luego se multiplica por 3 y por 3 ($3 \cdot 4x^4 \cdot 3 = 36x^4$)', is_correct: true}
      - {text: 'Se multiplican todos los números $3 \cdot 2 \cdot 3 = 18$ y luego se eleva al cuadrado', is_correct: false}
      - {text: 'Se eleva al cubo el coeficiente 2 directamente', is_correct: false}
      - {text: 'Se suman los coeficientes y se eleva a la cuarta potencia', is_correct: false}
    explanation: 'La alternativa correcta es ''Primero se eleva al cuadrado el término $2x^2$ obteniendo $4x^4$, y luego se multiplica por 3 y por 3 ($3 \cdot 4x^4 \cdot 3 = 36x^4$)''. Jerarquía de operaciones: potencias antes que multiplicaciones.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el término extremo inicial $a^3$ en la expansión de $(4m^2 + 5)^3$?'
    choices:
      - {text: 'El término es $64m^6$, calculando $4^3 = 64$ y multiplicando el exponente $2 \cdot 3 = 6$', is_correct: true}
      - {text: 'El término es $12m^6$', is_correct: false}
      - {text: 'El término es $64m^5$', is_correct: false}
      - {text: 'El término es $16m^6$', is_correct: false}
    explanation: 'La alternativa correcta es ''El término es $64m^6$, calculando $4^3 = 64$ y multiplicando el exponente $2 \cdot 3 = 6$''. $(4m^2)^3 = 64m^6$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Elevar al cubo el coeficiente del primer término y multiplicar sus exponentes por 3.'
  - 'Paso 2: Elevar al cuadrado el primer término, multiplicarlo por 3 y por el segundo término.'
  - 'Paso 3: Elevar al cuadrado el segundo término, multiplicarlo por 3 y por el primer término.'
  - 'Paso 4: Elevar al cubo el coeficiente del segundo término y multiplicar sus exponentes por 3.'
errores_correccion: |
  - **Error 1:** Elevar los exponentes al cubo en lugar de multiplicarlos por 3 (escribir $(x^2)^3 = x^8$). **Cómo corregirlo:** En potencia de una potencia **LOS EXPONENTES SE MULTIPLICAN POR 3 ($(x^2)^3 = x^6$)**.
  - **Error 2:** Excluir la elevación al cuadrado o al cubo del coeficiente numérico (escribir $(3x)^3 = 3x^3$). **Cómo corregirlo:** El coeficiente **TAMBIÉN SE ELEVA A LA POTENCIA ($3^3 = 27 \implies 27x^3$)**.
ejemplos:
  - titulo: 'Cubo con exponentes de variable'
    enunciado: '¿Cuál es el resultado de $(x^3 + 2)^3$?'
    alternativas:
      - '$x^9 + 6x^6 + 12x^3 + 8$'
      - '$x^9 + 8$'
      - '$x^6 + 6x^4 + 12x^2 + 8$'
    respuesta: '$x^9 + 6x^6 + 12x^3 + 8$'
    solucion_pasos:
      - '1. $(x^3)^3 = x^9$.'
      - '2. $3(x^3)^2(2) = 6x^6$.'
      - '3. $3(x^3)(2^2) = 12x^3$.'
      - '4. $2^3 = 8$.'
      - '5. Resultado: $x^9 + 6x^6 + 12x^3 + 8$.'
  - titulo: 'Cubo con coeficiente mayor a 1'
    enunciado: '¿Cuál es la expansión del término inicial $(5a)^3$?'
    alternativas:
      - '$125a^3$'
      - '$15a^3$'
      - '$25a^3$'
    respuesta: '$125a^3$'
    solucion_pasos:
      - '1. $5^3 = 125$.'
      - '2. $a^3$.'
      - '3. Resultado: $125a^3$.'
  - titulo: 'Multiplicación de exponentes'
    enunciado: 'En la expresión $(y^4)^3$, ¿es el exponente resultante $12$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $4 \cdot 3 = 12$.'
  - titulo: 'Constante final'
    enunciado: 'Para $(2x + 3)^3$, ¿es la constante independiente final $3^3 = 27$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $3^3 = 27$.'
errores_frecuentes:
  - 'Elevar los exponentes de las variables al cubo en lugar de multiplicarlos por 3.'
  - 'La elevación al cubo o al cuadrado de los coeficientes numéricos constantes no se realiza.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Multiplicar los coeficientes intermedios antes de resolver las potencias cuadráticas.'
  - 'Sumar los exponentes al calcular la potencia de potencia.'
afirmaciones_verdaderas:
  - 'Al elevar un monomio compuesto al cubo, su coeficiente se eleva a 3 y los exponentes de sus variables se multiplican por 3.'
  - 'La jerarquía operacional requiere resolver las elevaciones al cuadrado de los monomios antes de calcular los triples productos.'
al_terminar_debes_poder: 'Aplicar la regla del cubo de binomio suma sobre monomios con coeficientes numéricos y exponentes de cualquier grado.'
