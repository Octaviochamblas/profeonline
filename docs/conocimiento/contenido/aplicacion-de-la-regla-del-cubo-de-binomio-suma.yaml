resumen_inicial: La aplicación de la regla del cubo de binomio suma permite expandir
  expresiones con coeficientes y potencias de grado superior $(c_1 x^m + c_2 y^n)^3$.
explicacion_simple: Si los términos del binomio tienen números y exponentes como $(2x^2
  + 3y)^3$, elevamos el primer bloque completo al cubo, calculamos $3$ por el primer
  bloque al cuadrado por el segundo, $3$ por el primero por el segundo al cuadrado,
  y elevamos el segundo bloque al cubo.
explicacion_formal: 'Para monomios generales $A = c_1 x^m$ y $B = c_2 y^n$, el desarrollo
  de $(A + B)^3$ es la identidad trinómico-cúbica:


  $$(A + B)^3 = A^3 + 3A^2B + 3AB^2 + B^3$$

  $$= (c_1 x^m)^3 + 3(c_1 x^m)^2(c_2 y^n) + 3(c_1 x^m)(c_2 y^n)^2 + (c_2 y^n)^3$$

  $$= c_1^3 x^{3m} + 3c_1^2 c_2 x^{2m} y^n + 3c_1 c_2^2 x^m y^{2n} + c_2^3 y^{3n}$$


  **Desglose simbólico:**

  - $c_1^3 x^{3m}$: Aplicación de la regla $(x^m)^3 = x^{3m}$ sobre el primer monomio.

  - $3c_1^2 c_2 x^{2m} y^n$: Coeficiente compuesto por $3 \cdot c_1^2 \cdot c_2$.

  - $3c_1 c_2^2 x^m y^{2n}$: Coeficiente compuesto por $3 \cdot c_1 \cdot c_2^2$.

  - $c_2^3 y^{3n}$: Cubo del segundo monomio.


  > **Complemento didáctico:** Permite algebraizar potencias complejas aplicando simultáneamente
  leyes de exponentes y coeficientes binomiales.'
definiciones_clave: '- **Regla de potencia de potencia cúbica**: $(x^m)^3 = x^{3m}$.

  - **Coeficientes compuestos cúbicos**: $3c_1^2 c_2$ y $3c_1 c_2^2$.'
propiedades_relaciones: '- **Homogeneidad de grado**: Si $A$ y $B$ son monomios de
  grado $k$, todos los términos del desarrollo de $(A+B)^3$ poseen grado $3k$.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(2x^2 + 3y)^3$ aplicando la regla del cubo de
    binomio suma.
  pasos:
  - 'Paso 1: Identificar $A = 2x^2$ y $B = 3y$.'
  - 'Paso 2: Elevar $A$ al cubo: $(2x^2)^3 = 2^3 \cdot (x^2)^3 = 8x^6$.'
  - 'Paso 3: Calcular $3A^2B = 3 \cdot (2x^2)^2 \cdot (3y) = 3 \cdot 4x^4 \cdot 3y
    = 36x^4y$.'
  - 'Paso 4: Calcular $3AB^2 = 3 \cdot (2x^2) \cdot (3y)^2 = 3 \cdot 2x^2 \cdot 9y^2
    = 54x^2y^2$.'
  - 'Paso 5: Elevar $B$ al cubo: $(3y)^3 = 3^3 \cdot y^3 = 27y^3$.'
  - 'Paso 6: Ensamblar la expresión: $8x^6 + 36x^4y + 54x^2y^2 + 27y^3$.'
  - 'Conclusión: El desarrollo simplificado es $8x^6 + 36x^4y + 54x^2y^2 + 27y^3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de elevar el monomio $A = 2x^2$ al cubo?
  choices:
  - text: $8x^6$
    is_correct: true
  - text: $6x^6$
    is_correct: false
  - text: $8x^5$
    is_correct: false
  - text: $2x^6$
    is_correct: false
  explanation: La alternativa correcta es '$8x^6$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de $(2x^2 + 3y)^3$, ¿cuál es el coeficiente numérico
    del término $x^4y$?
  choices:
  - text: $36$, resultante de $3 \cdot 4 \cdot 3$
    is_correct: true
  - text: $54$
    is_correct: false
  - text: $18$
    is_correct: false
  - text: $27$
    is_correct: false
  explanation: La alternativa correcta es '$36$, resultante de $3 \cdot 4 \cdot 3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar el coeficiente al cubo y multiplicar el exponente por 3 en el primer
  monomio.'
- 'Paso 2: Calcular $3 \cdot c_1^2 \cdot c_2$ y ajustar exponentes para el segundo
  término.'
- 'Paso 3: Calcular $3 \cdot c_1 \cdot c_2^2$ y ajustar exponentes para el tercer
  término.'
- 'Paso 4: Elevar el coeficiente al cubo y multiplicar el exponente por 3 en el segundo
  monomio.'
errores_correccion: '- **Error 1: Sumar 3 a los exponentes en lugar de multiplicarlos
  por 3.** **Cómo corregirlo:** Aplicar la ley de potencia de potencia $(x^m)^3 =
  x^{3m}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle la expresión $(3a + 2b)^3$.
  alternativas:
  - $27a^3 + 54a^2b + 36ab^2 + 8b^3$
  - $27a^3 + 8b^3$
  - $9a^3 + 18a^2b + 12ab^2 + 6b^3$
  respuesta: $27a^3 + 54a^2b + 36ab^2 + 8b^3$
  solucion_pasos:
  - 1. $(3a)^3 = 27a^3$.
  - 2. $3(9a^2)(2b) = 54a^2b$.
  - 3. $3(3a)(4b^2) = 36ab^2$.
  - '4. $(2b)^3 = 8b^3$. Resultado: $27a^3 + 54a^2b + 36ab^2 + 8b^3$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(x^3 + 4)^3$?
  alternativas:
  - $x^9 + 12x^6 + 48x^3 + 64$
  - $x^9 + 64$
  - $x^6 + 12x^6 + 48x^3 + 64$
  respuesta: $x^9 + 12x^6 + 48x^3 + 64$
  solucion_pasos:
  - 1. $(x^3)^3 = x^9$.
  - 2. $3(x^6)(4) = 12x^6$.
  - 3. $3(x^3)(16) = 48x^3$.
  - '4. $4^3 = 64$. Resultado: $x^9 + 12x^6 + 48x^3 + 64$.'
- titulo: ¿Es $8m^3 + 36m^2 + 54m + 27$ la expansión correcta de $(2m + 3)^3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(2m)^3 + 3(4m^2)(3) + 3(2m)(9) + 27 = 8m^3 + 36m^2 + 54m + 27$.
- titulo: ¿El término independiente de $(x + 5)^3$ es igual a 15?
  respuesta: 'No'
  solucion_pasos:
  - No, $5^3 = 125$, no 15.
errores_frecuentes:
- Elevar los coeficientes al cuadrado en lugar de elevarlos al cubo en los extremos.
- Declarar que $(2x^2 + 3y)^3$ equivale a $8x^6 + 27y^3$.
- Sumar 3 a los exponentes de las variables al elevar un monomio al cubo.
- Elevar las variables al cuadrado manteniendo los coeficientes numéricos sin elevar
  al calcular términos intermedios.
- Declarar que el desarrollo de monomios con coeficientes no mónicos tiene tres términos.
afirmaciones_verdaderas:
- En la expansión de $(c_1 x^m + c_2 y^n)^3$, los coeficientes extremales son $c_1^3$
  y $c_2^3$.
- Los exponentes de la primera variable decrecen de a $m$ unidades mientras los de
  la segunda aumentan de a $n$ unidades.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la regla del cubo de binomio
  suma sobre monomios con coeficientes numéricos y potencias compuestas.
