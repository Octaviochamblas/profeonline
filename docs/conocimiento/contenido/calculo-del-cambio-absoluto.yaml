semantic_id: MAT.NUM.VARIACION_PORCENTUAL.CAMBIO_ABSOLUTO
estado: publicado
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES
resumen_inicial: 'El cambio absoluto mide la diferencia numérica directa entre el
  valor final y el valor inicial de una magnitud: $\Delta V = V_f - V_i$, conservando
  las unidades físicas de la variable.'
explicacion_simple: 'El cambio absoluto te dice exactamente cuánto aumentó o disminuyó
  una cantidad en sus mismas unidades (metros, pesos, litros, etc.). Se calcula restando
  el valor final menos el valor inicial. Si el resultado es positivo, hubo un aumento;
  si es negativo, hubo una disminución.


  ![calculo-del-cambio-absoluto](/static/img/nodos/calculo-del-cambio-absoluto-intro.svg)

  '
explicacion_formal: 'Para una variable que transita desde un estado inicial $V_i$
  hasta un estado final $V_f$, el **Cambio Absoluto** $\Delta V$ se define formalmente
  mediante la diferencia:


  $$\Delta V = V_f - V_i$$


  **Propiedades del signo:**

  - Si $\Delta V > 0 \iff V_f > V_i$ (incremento o ganancia neta).

  - Si $\Delta V < 0 \iff V_f < V_i$ (decremento o pérdida neta).

  - Si $\Delta V = 0 \iff V_f = V_i$ (permanencia o estabilidad).'
definiciones_clave: '- **Cambio absoluto ($\Delta V$)**: Variación neta en unidades
  de medida reales entre dos momentos temporales.

  - **Valor inicial ($V_i$)**: Estado o magnitud de referencia de partida.

  - **Valor final ($V_f$)**: Estado o magnitud alcanzada tras el cambio.'
propiedades_relaciones: '- **Unidades**: $\Delta V$ tiene exactamente las mismas unidades
  físicas o monetarias que $V_i$ y $V_f$.

  - **No acotado**: A diferencia del porcentaje, el cambio absoluto no está normalizado
  respecto a la magnitud de partida.'
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/calculo-del-cambio-absoluto-resumen.svg)


  QUÉ: Calcular e interpretar el cambio absoluto entre dos valores. CÓMO: Aplicando
  la resta $\Delta V = V_f - V_i$ e interpretando el signo resultante como incremento
  ($+$) o reducción ($-$).'
