procedimiento:
- 'Paso 1: Identificar con claridad el valor de partida inicial $V_i$ y el valor final
  alcanzado $V_f$.'
- 'Paso 2: Plantear la resta en orden cronológico: $\Delta V = V_f - V_i$.'
- 'Paso 3: Interpretar el resultado numérico: si es positivo es un aumento, si es
  negativo es una reducción.'
ejemplo_guiado:
  enunciado: El precio de un pasaje de bus interurbano sube de $\$12.000$ a $\$15.500$
    en vísperas de festivos. Calcule e interprete el cambio absoluto.
  pasos:
  - 'Paso 1: Identificar $V_i = 12.000$ y $V_f = 15.500$.'
  - 'Paso 2: Aplicar la fórmula: $\Delta V = 15.500 - 12.000 = +3.500$.'
  - 'Paso 3: Interpretar el signo: El signo positivo indica un incremento de $\$3.500$.'
  - 'Conclusión: El cambio absoluto es un aumento de $\$3.500$ en el precio del pasaje.'
  imagen: /static/img/nodos/calculo-del-cambio-absoluto-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Si la temperatura de una sustancia pasa de $25^\circ\text{C}$ a $18^\circ\text{C}$,
    ¿cuál es el cambio absoluto?
  choices:
  - text: $-7^\circ\text{C}$
    is_correct: true
  - text: $+7^\circ\text{C}$
    is_correct: false
  - text: $-18^\circ\text{C}$
    is_correct: false
  - text: $+25^\circ\text{C}$
    is_correct: false
  explanation: $\Delta T = T_f - T_i = 18 - 25 = -7^\circ\text{C}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un estanque tenía $500\text{ L}$ y ahora tiene $350\text{ L}$. ¿Cuál fue
    el cambio absoluto?
  choices:
  - text: $-150\text{ L}$
    is_correct: true
  - text: $+150\text{ L}$
    is_correct: false
  - text: $-350\text{ L}$
    is_correct: false
  - text: $+500\text{ L}$
    is_correct: false
  explanation: $\Delta V = 350 - 500 = -150\text{ L}$.
  reinforcement_section: Ejemplo guiado
errores_correccion: '- **Error 1: Invertir el orden de la resta ($V_i - V_f$).** **Cómo
  corregirlo:** La fórmula siempre es estado final menos estado inicial ($V_f - V_i$).

  - **Error 2: Expresar el cambio absoluto en porcentaje.** **Cómo corregirlo:** El
  cambio absoluto se expresa en las unidades de la magnitud ($ pesos, metros, kg),
  no en %.'
ejemplos:
- titulo: Aumento en cuenta bancaria
  enunciado: El saldo de una cuenta de ahorro pasa de $\$450.000$ a $\$520.000$. ¿Cuál
    es el cambio absoluto del saldo?
  alternativas:
  - +$\$70.000$
  - -$\$70.000$
  - +$\$520.000$
  - +$\$450.000$
  respuesta: +$\$70.000$
  solucion_pasos:
  - Identificar $V_i = 450.000$ y $V_f = 520.000$.
  - 'Restar: $\Delta V = 520.000 - 450.000 = +70.000$ pesos.'
- titulo: Disminución de masa corporal
  enunciado: Un atleta reduce su masa corporal de $84\text{ kg}$ a $79\text{ kg}$.
    ¿Cuál es la variación absoluta?
  alternativas:
  - $-5\text{ kg}$
  - $+5\text{ kg}$
  - $-79\text{ kg}$
  - $-84\text{ kg}$
  respuesta: $-5\text{ kg}$
  solucion_pasos:
  - 'Restar: $\Delta m = 79 - 84 = -5\text{ kg}$.'
- titulo: ¿Si el valor inicial es igual al valor final, el cambio absoluto es 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\Delta V = V_f - V_i = V_i - V_i = 0$.
- titulo: ¿El cambio absoluto puede expresarse en porcentaje (%)?
  respuesta: 'No'
  solucion_pasos:
  - No, el cambio absoluto conserva las unidades físicas de la variable. El cambio
    porcentual es el cambio relativo.
errores_frecuentes:
- Invertir el minuendo y sustraendo en la resta.
- Omitir el signo negativo cuando una variable experimenta un decremento.
- Confundir la variación absoluta con la variación porcentual.
afirmaciones_verdaderas:
- El cambio absoluto es positivo cuando el valor final supera al valor inicial.
- El cambio absoluto conserva idénticas unidades de medida que las cantidades originales.
