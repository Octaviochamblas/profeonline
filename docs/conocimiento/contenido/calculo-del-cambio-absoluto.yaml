semantic_id: MAT.NUM.VARIACION_PORCENTUAL.CAMBIO_ABSOLUTO
resumen_inicial: 'Cálculo del cambio absoluto: concepto y propiedades fundamentales en Variaciones
  porcentuales.'
explicacion_simple: Si antes pesabas 70 kg y ahora pesas 65 kg, perdiste 5 kilos. Esos 5 kilos
  son tu 'cambio absoluto'. No tiene que ver con porcentajes aún, es simplemente la diferencia
  real en números.
explicacion_formal: "Antes de hablar de porcentajes de crecimiento, debemos definir el **Cambio\
  \ Absoluto** o **Variación Absoluta**.\n\nFórmula matemática:\n$$\\text{Cambio Absoluto}\
  \ = \\text{Valor Final} - \\text{Valor Inicial}$$\n\n- Si el número da **positivo**, hubo\
  \ un aumento.\n- Si el número da **negativo**, hubo una disminución.\n\nEjemplo: Si tu cuenta\
  \ de ahorros pasó de tener $\\$10.000$ (inicial) a $\\$12.000$ (final), el cambio absoluto\
  \ es $12.000 - 10.000 = +2.000$. \nEs 'absoluto' porque se expresa en la unidad original\
  \ de medida (pesos, kilos, metros), no en un porcentaje."
definiciones_clave: '- **Cálculo del cambio absoluto**: Elemento central dentro del estudio
  de Variaciones porcentuales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo del cambio absoluto.'
ejemplo_guiado:
  enunciado: En enero un negocio tenía 320 clientes registrados. En febrero tenía 285. Calcula
    el cambio absoluto.
  pasos:
  - Identifico el Valor Inicial, 320 clientes en enero, y el Valor Final, 285 en febrero.
  - 'Aplico la fórmula: cambio absoluto igual a Valor Final menos Valor Inicial, es decir
    285 menos 320.'
  - 'Calculo el resultado: -35. Hubo una disminución de 35 clientes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con cálculo del cambio absoluto?
  choices:
  - text: Identificar correctamente la relación de variaciones porcentuales
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de variaciones porcentuales.
    Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de cálculo del cambio absoluto, ¿qué paso es
    indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
    clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el Valor Inicial (el dato del pasado o el original).'
- 'Paso 2: Identifica el Valor Final (el dato del presente o el nuevo).'
- 'Paso 3: Resta $Final - Inicial$ para hallar la variación neta.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del cambio
  absoluto.
ejemplos:
- titulo: Crecimiento poblacional
  enunciado: En 2020 habían 500 alumnos. En 2021 habían 450. ¿Cuál es el cambio absoluto?
  solucion_pasos:
  - Inicial = 500, Final = 450.
  - Cambio Absoluto = $450 - 500 = -50$.
  - Hubo una disminución de 50 alumnos.
- titulo: Ejemplo 2
  enunciado: Una empresa pasó de 80 a 95 trabajadores. ¿Cuál es el cambio absoluto?
  alternativas:
  - '+15'
  - '-15'
  - '+80'
  respuesta: '+15'
  solucion_pasos:
  - 95 menos 80 es igual a 15, positivo porque aumentó.
- titulo: Ejemplo 3
  enunciado: Un termómetro marcaba 28° y bajó a 21°. ¿Cuál es el cambio absoluto?
  alternativas:
  - '-7'
  - '+7'
  - '21'
  respuesta: '-7'
  solucion_pasos:
  - 21 menos 28 es igual a -7.
- titulo: ¿El cambio absoluto puede ser un número negativo?
  respuesta: Sí
  solucion_pasos:
  - Ocurre cuando el valor final es menor que el inicial.
errores_frecuentes:
- Restar siempre el mayor menos el menor, ignorando el orden de tiempo. (Si restas Inicial
  - Final te dará el signo equivocado y podrías reportar un aumento cuando fue una caída).
- Expresar el resultado con un símbolo $\%$ (el cambio absoluto NO es un porcentaje).
- Restar Valor Inicial menos Valor Final en vez de Valor Final menos Valor Inicial, invirtiendo
  el signo del resultado.
- Expresar el resultado del cambio absoluto con el símbolo %, cuando en realidad es un número
  en la unidad original.
- Confundir el cambio absoluto con el cambio relativo o porcentual.
afirmaciones_verdaderas:
- La propiedad de cálculo del cambio absoluto preserva la consistencia lógica.
- El cambio absoluto se expresa siempre en la misma unidad de medida de los valores originales,
  nunca como porcentaje.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del cambio absoluto.
fuente: Currículum Nacional MINEDUC.
estado: publicado
