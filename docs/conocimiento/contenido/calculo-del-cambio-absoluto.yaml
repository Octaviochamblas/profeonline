semantic_id: MAT.NUM.VARIACION_PORCENTUAL.CAMBIO_ABSOLUTO
resumen_inicial: 'Cálculo del cambio absoluto: concepto y propiedades fundamentales
  en Variaciones porcentuales.'
explicacion_simple: Si antes pesabas 70 kg y ahora pesas 65 kg, perdiste 5 kilos.
  Esos 5 kilos son tu 'cambio absoluto'. No tiene que ver con porcentajes aún, es
  simplemente la diferencia real en números.
explicacion_formal: "Antes de hablar de porcentajes de crecimiento, debemos definir\
  \ el **Cambio Absoluto** o **Variación Absoluta**.\n\nFórmula matemática:\n$$\\\
  text{Cambio Absoluto} = \\text{Valor Final} - \\text{Valor Inicial}$$\n\n- Si el\
  \ número da **positivo**, hubo un aumento.\n- Si el número da **negativo**, hubo\
  \ una disminución.\n\nEjemplo: Si tu cuenta de ahorros pasó de tener $\\$10.000$\
  \ (inicial) a $\\$12.000$ (final), el cambio absoluto es $12.000 - 10.000 = +2.000$.\
  \ \nEs 'absoluto' porque se expresa en la unidad original de medida (pesos, kilos,\
  \ metros), no en un porcentaje."
definiciones_clave: '- **Cálculo del cambio absoluto**: Elemento central dentro del
  estudio de Variaciones porcentuales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo del cambio absoluto.'
ejemplo_guiado:
  enunciado: Aplica el concepto de cálculo del cambio absoluto en un ejercicio paso
    a paso.
  pasos:
  - Identificar los datos dados en el problema.
  - Aplicar la regla o fórmula correspondiente a cálculo del cambio absoluto.
  - Efectuar los cálculos aritméticos necesarios.
  - Concluir con el resultado final simplificado.
checkpoints:
