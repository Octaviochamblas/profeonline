resumen_inicial: 'El cambio absoluto es la diferencia numérica simple en las mismas
  unidades de medida entre el valor final $V_f$ y el valor inicial $V_i$: $\Delta
  V = V_f - V_i$.'
explicacion_simple: El cambio absoluto mide la cantidad exacta que subió o bajó un
  valor sin hablar de porcentajes. Por ejemplo, si la temperatura pasa de $15^\circ\text{C}$
  a $22^\circ\text{C}$, el cambio absoluto es un aumento de $7^\circ\text{C}$.
explicacion_formal: 'Para dos estados medidos $V_i$ y $V_f$, el **Cambio Absoluto
  $\Delta V$** es la diferencia escalar:


  $$\Delta V = V_f - V_i$$


  **Interpretación del signo:**

  - $\Delta V > 0$: Incremento o variación positiva.

  - $\Delta V < 0$: Decremento o variación negativa.'
definiciones_clave: '- **Cambio absoluto $\Delta V$**: Diferencia $V_f - V_i$ expresada
  en unidades absolutas de la variable.'
propiedades_relaciones: '- **Dimensión física**: Mantiene las mismas unidades de medida
  de las variables inicial y final.'
ejemplo_guiado:
  enunciado: El precio del litro de bencina pasó de \$1.050 a \$1.120. Calcule el
    cambio absoluto.
  pasos:
  - 'Paso 1: Identificar $V_i = 1.050$ y $V_f = 1.120$.'
  - 'Paso 2: Restar valor final menos inicial: $\Delta V = 1.120 - 1.050 = 70$.'
  - 'Conclusión: El cambio absoluto fue un incremento de \$70 por litro.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula el cambio absoluto Delta V entre un estado inicial Vi
    y uno final Vf?
  choices:
  - text: Restando el valor final menos el valor inicial (Delta V = Vf - Vi)
    is_correct: true
  - text: Dividiendo Delta V = Vf / Vi
    is_correct: false
  - text: Multiplicando Delta V = Vi · Vf
    is_correct: false
  - text: Sumando Delta V = Vi + Vf
    is_correct: false
  explanation: La alternativa correcta es 'Restando el valor final menos el valor
    inicial (Delta V = Vf - Vi)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado de la bencina de $1.050 a $1.120, ¿cuál fue el cambio
    absoluto?
  choices:
  - text: Un incremento de 70 $
    is_correct: true
  - text: Un incremento de 1.120 $
    is_correct: false
  - text: Un decremento de 70 $
    is_correct: false
  - text: 7%
    is_correct: false
  explanation: La alternativa correcta es 'Un incremento de 70 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el cambio absoluto $\Delta
  V = V_f - V_i$ expresándolo en las unidades físicas de la variable.
semantic_id: MAT.NUM.VARIACION_PORCENTUAL.CAMBIO_ABSOLUTO
procedimiento:
- 'Paso 1: Identificar la tasa de variación $P\%$ y determinar si es aumento ($1 +
  p$) o descuento ($1 - p$).'
- 'Paso 2: Multiplicar el valor inicial por el factor multiplicativo correspondiente.'
- 'Paso 3: Resolver numéricamente y verificar que el resultado final responda a la
  situación planteada.'
errores_correccion: '- **Error 1: Sumar o restar porcentajes sucesivos directamente
  (pensar que $-20\%$ y $-10\%$ dan $-30\%$).** **Cómo corregirlo:** Los porcentajes
  sucesivos se MULTIPLICAN por sus factores decimales ($0,80 \cdot 0,90 = 0,72 \implies
  -28\%$).


  - **Error 2: Usar el valor final como denominador al calcular la variación porcentual.**
  **Cómo corregirlo:** El denominador para el cambio relativo es SIEMPRE el valor
  inicial $V_i$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.VARIACION_PORCENTUAL.CAMBIO_ABSOLUTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de factores de variación porcentual.
- titulo: Ejemplo 2
  enunciado: Verificación de factor multiplicativo.
  alternativas:
  - Cumple el factor
  - No cumple
  - Indeterminado
  respuesta: Cumple el factor
  solucion_pasos:
  - Demostración formal por $1 \pm p$.
- titulo: ¿Equivale el IVA en Chile a multiplicar el neto por 1,19?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $1 + 0,19 = 1,19$.
- titulo: ¿Altera el orden en que se aplican dos descuentos sucesivos el precio final?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa del producto de factores.
errores_frecuentes:
- Sumar directamente dos porcentajes de descuento sucesivos aplicados sobre un mismo
  producto.
- Utilizar el precio final como el denominador de referencia al calcular la variación
  porcentual relativa.
- Dividir por 0,19 para extraer el Impuesto al Valor Agregado (IVA) de un precio Bruto.
- Un descuento del $20\%$ seguido de un aumento del $20\%$ devuelve el producto a
  su precio original.
- Restar el número entero del porcentaje al precio sin convertirlo a su factor decimal
  $1 - d$.
afirmaciones_verdaderas:
- El aumento o descuento porcentual se calcula directamente multiplicando el valor
  inicial por el factor $(1 \pm p)$.
- Dos descuentos sucesivos del $a\%$ y $b\%$ equivalen al factor acumulado $(1 - a/100)(1
  - b/100)$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
