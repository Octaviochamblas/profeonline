semantic_id: MAT.ALG.EC_CUADR_MODELO.PLANTEO_CONTEXTO
resumen_inicial: 'Traducción de problemas de lenguaje natural a ecuaciones de segundo
  grado: concepto, discriminante, soluciones y modelamiento en Modelamiento y resolución
  de problemas.'
explicacion_simple: Antes de resolver cualquier problema cuadrático de la vida real,
  hay que "traducirlo" del español a una ecuación; ese primer paso suele ser el más
  difícil de todo el proceso.
explicacion_formal: '### Definición formal


  El planteo de un problema consiste en asignar una variable $x$ a la cantidad desconocida
  y traducir cada relación verbal del enunciado (sumas, productos, comparaciones)
  en una expresión algebraica, hasta obtener una igualdad equivalente a una ecuación
  de segundo grado.


  ### Desarrollo didáctico


  Suele ayudar identificar primero qué palabra clave corresponde a qué operación:
  "el producto de" indica multiplicación, "la suma de" indica adición, "es igual a"
  indica el signo igual.


  "El producto de un número y el número aumentado en 3 es igual a 40" se traduce como
  $x(x+3)=40$, una ecuación de segundo grado tras desarrollar.'
definiciones_clave: '- **Traducción de problemas de lenguaje natural a ecuaciones
  de segundo grado**: Elemento o técnica fundamental en la resolución de ecuaciones
  cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en traducción
  de problemas de lenguaje natural a ecuaciones de segundo grado.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando traducción de problemas
    de lenguaje natural a ecuaciones de segundo grado.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a traducción de problemas
    de lenguaje natural a ecuaciones de segundo grado.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
