semantic_id: MAT.ALG.EC_CUADR_MODELO.PLANTEO_CONTEXTO
resumen_inicial: La traducción de problemas de lenguaje natural a ecuaciones de segundo grado consiste en identificar la incógnita principal $x$, expresar las relaciones cuantitativas dadas en el texto y formular una ecuación en la forma canónica $ax^2 + bx + c = 0$.
explicacion_simple: "![La traducción de problemas de lenguaje natural a ecuaciones de segundo grado consiste en identificar la incógnita principal $x$, expresar las relaciones cuantitativas dadas en el texto y formular una ecuación en la forma canónica $ax^2 + bx + c = 0$](/static/img/nodos/traduccion-de-problemas-de-lenguaje-natural-a-ecuaciones-de-segundo-grado-intro.svg)\n\n\nTraducir un problema verbal a una ecuación cuadrática es como armar un rompecabezas:\n1. **Identifica qué te preguntan y dale un nombre:** \"Sea $x$ el ancho del rectángulo\".\n2. **Escribe las frases en lenguaje matemático:**\n   - \"El largo mide 3 metros más que el ancho\" $\\implies$ Largo $= x + 3$.\n   - \"El área es 40 m²\" $\\implies \\text{Área} = \\text{ancho} \\cdot \\text{largo} = x(x + 3) = 40$.\n3. **Multiplica e iguala a cero:**\n   $$x^2 + 3x = 40 \\implies x^2 + 3x - 40 = 0$$\n- ¡Listo! Tienes tu ecuación cuadrática lista para ser resuelta."
explicacion_formal: "Sea un enunciado verbal contextualizado que describe una relación cuadrática entre magnitudes reales. El **proceso de modelación algebraica cuadrática** sigue el esquema funcional:\n\n1. **Asignación formal de la variable de estado**: $x \\in \\mathcal{D} \\subseteq \\mathbb{R}$.\n2. **Formalización de operadores semánticos**:\n   - *Producto de enteros consecutivos*: $x(x + 1) = K$.\n   - *Doble producto con adición*: $x(2x + k) = K$.\n   - *Cuadrado de la diferencia*: $(x - k)^2 = K$.\n3. **Reducción a la variedad polinómica canónica**:\n   $$P(x) = ax^2 + bx + c = 0, \\quad a \\neq 0$$"
definiciones_clave: '- **Modelamiento cuadrático**: Formulación de un fenómeno o problema del mundo real mediante un polinomio de grado 2.

  - **Variable de decisión / incógnita**: Magnitud desconocida central cuya determinación resuelve el problema.'
propiedades_relaciones: '- **No linealidad intrínseca**: Surge típicamente por el producto de dos dimensiones espaciales, aceleración gravitacional o relaciones de proporcionalidad inversa.

  - **Dominio de admisibilidad**: Conjunto de restricciones impuestas por la naturaleza física de la variable ($x > 0$, $x \in \mathbb{Z}^+$, etc.).'
ejemplo_guiado:
  enunciado: '![Ejemplo La traducción de problemas de lenguaje natural a ecuaciones de segundo grado consiste en identificar la incógnita principal $x$, expresar las relaciones cuantitativas dadas en el texto y formular una ecuación en la forma canónica $ax^2 + bx + c = 0$](/static/img/nodos/traduccion-de-problemas-de-lenguaje-natural-a-ecuaciones-de-segundo-grado-ejemplos.svg)



    Plantea la ecuación cuadrática general para el siguiente problema: "El producto de dos números enteros pares consecutivos es 168".'
  pasos:
  - 'Paso 1: Definir la variable: Sea $x$ el primer número par ($x \in 2\mathbb{Z}$).'
  - 'Paso 2: Expresar el siguiente par consecutivo: $x + 2$.'
  - 'Paso 3: Plantear el producto según el enunciado: $x(x + 2) = 168$.'
  - 'Paso 4: Distribuir el producto: $x^2 + 2x = 168$.'
  - 'Paso 5: Transponer la constante para igualar a cero: $x^2 + 2x - 168 = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuál es la ecuación que modela: "El área de un triángulo cuya base mide 4 cm más que su altura es 30 cm²"?'
  choices:
  - text: x(x + 4) / 2 = 30  =>  x² + 4x - 60 = 0
    is_correct: true
  - text: x(x + 4) = 30  =>  x² + 4x - 30 = 0
    is_correct: false
  - text: x² + 4x + 60 = 0
    is_correct: false
  - text: (x + 4)² = 30
    is_correct: false
  explanation: La alternativa correcta es 'x(x + 4) / 2 = 30  =>  x² + 4x - 60 = 0'. El área del triángulo es $(b \cdot h)/2 = 30 \implies x(x + 4) = 60 \implies x^2 + 4x - 60 = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al modelar "el cuadrado de un número disminuido en 5 es igual a 20", ¿cuál es la ecuación correcta?
  choices:
  - text: x² - 5 = 20  =>  x² - 25 = 0
    is_correct: true
  - text: (x - 5)² = 20
    is_correct: false
  - text: 2x - 5 = 20
    is_correct: false
  - text: x² + 5 = 20
    is_correct: false
  explanation: La alternativa correcta es 'x² - 5 = 20  =>  x² - 25 = 0'. "El cuadrado de un número" es $x^2$, y "disminuido en 5" es $-5$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer atentamente el enunciado identificando la incógnita pedida.'
- 'Paso 2: Asignar una letra $x$ a la magnitud fundamental y expresar las demás cantidades en función de $x$.'
- 'Paso 3: Escribir la relación de igualdad descrita en el texto.'
- 'Paso 4: Realizar los productos algebraicos y simplificar términos semejantes.'
- 'Paso 5: Transponer todos los términos al miembro izquierdo para obtener $ax^2 + bx + c = 0$.'
errores_correccion: '- **Error común:** Confundir "el cuadrado de la suma" ($(x + 3)^2$) con "la suma de los cuadrados" ($x^2 + 3^2$).

  - **Cómo corregirlo:** Lee con atención los signos de puntuación: **$(x + 3)^2 = x^2 + 6x + 9$** contiene el doble producto central.'
ejemplos:
- titulo: 'Ejemplo 1: Rectángulo con diferencia de lados'
  enunciado: Un terreno rectangular tiene un largo que excede en 6 m a su ancho. Si su área es 216 m², ¿qué ecuación lo modela?
  alternativas:
  - x^2 + 6x - 216 = 0
  - x^2 + 6x + 216 = 0
  - x^2 - 6x - 216 = 0
  - 2x + 6 = 216
  respuesta: x^2 + 6x - 216 = 0
  solucion_pasos:
  - 'Paso 1: $x(x + 6) = 216 \implies x^2 + 6x - 216 = 0$.'
- titulo: 'Ejemplo 2: Suma de un número y su recíproco'
  enunciado: La suma de un número y el doble de su recíproco es 3. ¿Cuál es la ecuación?
  alternativas:
  - x^2 - 3x + 2 = 0
  - x^2 + 3x + 2 = 0
  - x^2 - 3x - 2 = 0
  - 2x^2 - 3x + 1 = 0
  respuesta: x^2 - 3x + 2 = 0
  solucion_pasos:
  - 'Paso 1: $x + 2/x = 3 \implies x^2 + 2 = 3x \implies x^2 - 3x + 2 = 0$.'
- titulo: 'Ejemplo 3: Números impares consecutivos'
  enunciado: El producto de dos enteros impares consecutivos es 99. ¿Qué ecuación cuadrática en x (primer impar) resulta?
  alternativas:
  - x^2 + 2x - 99 = 0
  - x^2 + x - 99 = 0
  - x^2 + 3x - 99 = 0
  - x^2 - 99 = 0
  respuesta: x^2 + 2x - 99 = 0
  solucion_pasos:
  - 'Paso 1: Dos impares consecutivos difieren en 2: $x(x + 2) = 99 \implies x^2 + 2x - 99 = 0$.'
- titulo: 'Ejemplo 4: Cuadrado aumentado'
  enunciado: El triple del cuadrado de un número aumentado en su doble es 40. ¿Cuál es la ecuación?
  alternativas:
  - 3x^2 + 2x - 40 = 0
  - (3x)^2 + 2x = 40
  - 3x^2 - 2x - 40 = 0
  - 3x^2 + 2x + 40 = 0
  respuesta: 3x^2 + 2x - 40 = 0
  solucion_pasos:
  - 'Paso 1: $3x^2 + 2x = 40 \implies 3x^2 + 2x - 40 = 0$.'
errores_frecuentes:
- No colocar paréntesis en expresiones compuestas al multiplicar.
- Olvidar igualar a cero la ecuación antes de resolverla.
- Asignar variables distintas para cantidades que dependen de la misma incógnita.
afirmaciones_verdaderas:
- La traducción a ecuación cuadrática formaliza relaciones de productos y potencias en la forma ax² + bx + c = 0.
- El producto de dos enteros consecutivos se modela como x(x + 1).
al_terminar_debes_poder: '**QUÉ:** Traducir problemas de lenguaje natural a ecuaciones de segundo grado.


  **CÓMO:** Identificando la incógnita x, formulando las expresiones algebraicas e igualando a cero en la forma ax² + bx + c = 0.


