procedimiento:
- 'Paso 1: Define una variable $x$ para representar la cantidad desconocida.'
- 'Paso 2: Traduce cada relación del enunciado a una expresión algebraica en términos
  de $x$.'
- 'Paso 3: Plantea la igualdad completa y normalízala a la forma $ax^2+bx+c=0$.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en traducción de problemas de lenguaje natural a ecuaciones de segundo grado.
ejemplos:
- titulo: Traducción de un problema numérico simple
  enunciado: 'Traduce a ecuación: "El cuadrado de un número disminuido en 5 es igual
    a 20".'
  solucion_pasos:
  - Sea $x$ el número buscado.
  - $x^2-5=20$, equivalente a $x^2-25=0$.
- titulo: Traducción de un problema con producto
  enunciado: 'Traduce a ecuación: "El producto de dos números consecutivos es 56".'
  solucion_pasos:
  - Sea $x$ el primer número; el segundo es $x+1$.
  - $x(x+1)=56$, equivalente a $x^2+x-56=0$.
- titulo: ¿El primer paso al traducir un problema es siempre definir la incógnita?
  enunciado: ¿El primer paso al traducir un problema es siempre definir la incógnita?
  respuesta: Sí
  solucion_pasos:
  - Sin una variable claramente definida, no es posible traducir las relaciones del
    enunciado a expresiones algebraicas.
- titulo: ¿Toda ecuación cuadrática planteada a partir de un problema queda automáticamente
    en forma general?
  enunciado: ¿Toda ecuación cuadrática planteada a partir de un problema queda automáticamente
    en forma general?
  respuesta: 'No'
  solucion_pasos:
  - Generalmente hay que desarrollar productos y trasladar términos para normalizarla
    a la forma $ax^2+bx+c=0$.
errores_frecuentes:
- Definir la incógnita de forma ambigua, sin precisar exactamente qué representa.
- Traducir incorrectamente una relación verbal, por ejemplo confundiendo "el doble
  de un número" con "un número al cuadrado".
- Olvidar normalizar la ecuación planteada a su forma general antes de resolverla.
- No verificar que la ecuación planteada realmente sea de segundo grado tras desarrollarla.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando traducción
  de problemas de lenguaje natural a ecuaciones de segundo grado.
