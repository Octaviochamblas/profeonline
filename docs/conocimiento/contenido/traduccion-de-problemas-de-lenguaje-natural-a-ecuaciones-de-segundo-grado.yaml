semantic_id: MAT.ALG.EC_CUADR_MODELO.PLANTEO_CONTEXTO
resumen_inicial: La traducción de problemas a ecuaciones cuadráticas convierte expresiones verbales en ecuaciones algebraicas de segundo grado $ax^2 + bx + c = 0$.
explicacion_simple: |
  Para resolver un problema de la vida real o geométrico mediante ecuaciones cuadráticas:

  1. **Asignas una variable $x$** a lo que quieres calcular (por ejemplo, el ancho de un terreno).
  2. **Traduces las frases a álgebra**:
     - "El cuadrado de un número": $x^2$.
     - "Un número aumentado en 3": $x + 3$.
     - "El área de un rectángulo de largo $(x+4)$ y ancho $x$ es 60": $x(x + 4) = 60$.
  3. **Desarrollas e igualas a cero**:
     $$x^2 + 4x - 60 = 0$$
  4. ¡Ahora la ecuación está lista para ser resuelta por factorización o fórmula general!
explicacion_formal: |
  Sea un enunciado verbal en lenguaje natural que describe una relación cuantitativa no lineal. El **modelamiento algebraico cuadrático** establece una función biyectiva entre los conceptos del dominio verbal y el lenguaje formal:

  $$\text{Enunciado en Lenguaje Natural} \longrightarrow ax^2 + bx + c = 0 \quad \text{con } a \neq 0$$

  **Tabla de traducción canónica:**
  - *"El producto de dos enteros consecutivos es 156"*: $x(x + 1) = 156 \implies x^2 + x - 156 = 0$.
  - *"La suma de un número con su triple cuadrado es 14"*: $3x^2 + x = 14 \implies 3x^2 + x - 14 = 0$.
definiciones_clave: |
  - **Traducción a ecuación cuadrática**: Proceso de formalización matemática que representa situaciones verbales mediante la estructura polinómica $ax^2 + bx + c = 0$.
propiedades_relaciones: |
  - **Identificación de relaciones multiplicativas de grado 2**: Cualquier producto de dos dimensiones lineales que dependen de una misma variable produce un término cuadrático $x^2$.
ejemplo_guiado:
  enunciado: 'Traduce a ecuación cuadrática: "El largo de una cancha excede a su ancho en 5 metros. Si el área total es de $150 \text{ m}^2$, halla la ecuación que permite calcular el ancho $x$".'
  pasos:
    - 'Paso 1: Definir la variable: sea $x$ el ancho en metros.'
    - 'Paso 2: Expresar el largo en función de $x$: largo $= x + 5$.'
    - 'Paso 3: Plantear la fórmula del área (largo $\cdot$ ancho): $x(x + 5) = 150$.'
    - 'Paso 4: Desarrollar e igualar a cero: $x^2 + 5x - 150 = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ecuación representa el enunciado: "El cuadrado de un número menos su cuádruple es igual a 21"?'
    choices:
      - {text: '$x^2 - 4x - 21 = 0$', is_correct: true}
      - {text: '$x^2 + 4x + 21 = 0$', is_correct: false}
      - {text: '$2x - 4 = 21$', is_correct: false}
      - {text: '$x^2 - 21x + 4 = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x^2 - 4x - 21 = 0$''. Se plantea $x^2 - 4x = 21 \implies x^2 - 4x - 21 = 0$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la ecuación cuadrática que modela: "El producto de dos números enteros consecutivos es igual a 72"?'
    choices:
      - {text: '$x^2 + x - 72 = 0$', is_correct: true}
      - {text: '$x^2 - 72 = 0$', is_correct: false}
      - {text: '$2x + 1 = 72$', is_correct: false}
      - {text: '$x^2 + 2x - 72 = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x^2 + x - 72 = 0$''. Los números enteros consecutivos son $x$ y $x+1$, luego $x(x+1) = 72 \implies x^2 + x - 72 = 0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Leer atentamente el enunciado identificando la cantidad desconocida y asignarle la variable $x$.'
  - 'Paso 2: Expresar los demás datos del enunciado en función de $x$.'
  - 'Paso 3: Formular la igualdad matemática igualando la expresión al valor total dado.'
  - 'Paso 4: Expandir los productos algebraicos y transponer términos para obtener la forma estándar $ax^2 + bx + c = 0$.'
errores_correccion: |
  - **Error común:** Confundir "el doble del cuadrado de $x$" ($2x^2$) con "el cuadrado del doble de $x$" ($(2x)^2 = 4x^2$).
  - **Cómo corregirlo:** Pon **ATENCIÓN AL ORDEN DE LAS PALABRAS**: la potencia aplica solo a la variable a menos que el paréntesis indique lo contrario.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Números consecutivos.
    alternativas:
      - '$x^2 + x - 110 = 0$'
      - '$x^2 - 110 = 0$'
      - '$2x - 110 = 0$'
    respuesta: '$x^2 + x - 110 = 0$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Área rectangular.
    alternativas:
      - '$x^2 + 3x - 40 = 0$'
      - '$x^2 - 3x - 40 = 0$'
      - '$2x + 3 = 40$'
    respuesta: '$x^2 + 3x - 40 = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La interpretación errónea de "el doble del cuadrado de un número" como la expresión $(2x)^2 = 4x^2$.'
  - 'La falta de transposición del valor numérico del miembro derecho dejando la ecuación sin igualar a cero.'
  - 'Expresar "dos números consecutivos" como las variables independientes $x$ e $y$ impidiendo formar una sola ecuación en $x$.'
  - 'La equivalencia errónea entre el perímetro de un rectángulo $2x + 2y$ y su área $x \cdot y$ al formular ecuaciones cuadráticas.'
  - 'El cambio erróneo de signo de la constante al trasladar un término al otro lado de la igualdad.'
afirmaciones_verdaderas:
  - 'Traducir un problema verbal a una ecuación cuadrática requiere definir la variable $x$, expresar las magnitudes en su función e igualar a cero $ax^2 + bx + c = 0$.'
  - 'El producto de dos expresiones lineales en términos de la misma variable $x$ genera un término cuadrático $x^2$.'
al_terminar_debes_poder: |
  QUÉ: Traducir problemas de lenguaje natural a ecuaciones de segundo grado en su forma canónica.
  CÓMO: Asignar la variable $x$, escribir las expresiones algebraicas del enunciado, multiplicar e igualar a cero $ax^2 + bx + c = 0$.
fuente: 'Texto escolar MINEDUC — Álgebra / Ecuaciones de Segundo Grado'
estado: publicado
