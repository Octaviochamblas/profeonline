semantic_id: MAT.ALG.EC_CUADR_MODELO.PLANTEO_CONTEXTO
resumen_inicial: La traducción de un problema verbal a una ecuación cuadrática consiste
  en definir la variable $x$ y traducir frases como 'el producto de dos números consecutivos'
  ($x(x+1)$) o 'el área de un rectángulo' ($l \cdot a$).
explicacion_simple: "Para plantear un problema escrito en español como una **ecuación\
  \ de segundo grado**:\n1. Asigna una letra (usualmente $x$) a la cantidad desconocida.\n\
  2. Traduce las pistas verbales a lenguaje matemático:\n   - 'Un número y su cuadrado':\
  \ $x$ y $x^2$.\n   - 'Dos enteros consecutivos': $x$ y $x+1$.\n   - 'El producto\
  \ de dos enteros consecutivos es 56': $x(x+1) = 56 \\implies x^2 + x - 56 = 0$.\n\
  3. Resuelve la ecuación resultante."
explicacion_formal: 'El **modelamiento cuadrático contextual** es la función de formalización
  $f: \text{Enunciado Verbal} \to \text{Ecuación polinómica}$:


  $$a x^2 + b x + c = 0 \quad \text{con } x \in D \subset \mathbb{R}$$


  **Desglose de la fórmula:**

  - Definición explícita del dominio físico/geométrico legítimo para la incógnita
  $x$ (ej. medidas no negativas $x > 0$).'
definiciones_clave: '- **Modelamiento cuadrático**: Formulación algebraica de situaciones
  reales donde la relación de variables es de segundo grado.'
propiedades_relaciones: '- **Doble solución matemática vs. Solución única física**:
  Una ecuación cuadrática entrega dos soluciones algebraicas, pero las condiciones
  del problema real pueden descartar una de ellas.'
ejemplo_guiado:
  enunciado: 'Plantea y resuelve el siguiente problema: ''El producto de dos números
    enteros positivos consecutivos es igual a 72. Encuentra dichos números.'''
  pasos:
  - 'Paso 1: Definir la variable: sea $x$ el primer entero positivo. El siguiente
    consecutivo es $x + 1$.Paso 2: Plantear la ecuación del producto: $x(x + 1) =
    72$.Paso 3: Desarrollar e igualar a cero: $x^2 + x - 72 = 0$.Paso 4: Factorizar
    el trinomio: $(x + 9)(x - 8) = 0 \implies x_1 = -9$ y $x_2 = 8$.Paso 5: Descartar
    $x = -9$ por la condición de ser enteros positivos. El primer número es $x = 8$
    y el consecutivo es $9$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al plantear la ecuación para 'el producto de dos enteros positivos consecutivos
    es 72', ¿cuál es la solución válida del problema?
  choices:
  - text: Los enteros positivos consecutivos son $8$ y $9$.
    is_correct: true
  - text: Los enteros son $-9$ y $-8$.
    is_correct: false
  - text: El único entero es 72.
    is_correct: false
  - text: Los enteros son 6 y 12.
    is_correct: false
  explanation: La alternativa correcta es 'Los enteros positivos consecutivos son
    $8$ y $9$.'. (Puesto que $8 \cdot 9 = 72$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué se descartó la solución algebraica $x = -9$ en el problema dado?
  choices:
  - text: Porque el enunciado exigía explícitamente que los números fueran enteros
      POSITIVOS.
    is_correct: true
  - text: Porque $-9$ es un número primo.
    is_correct: false
  - text: Porque $-9$ no satisface la ecuación $x^2 + x - 72 = 0$.
    is_correct: false
  - text: Porque el producto daba un número decimal.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el enunciado exigía explícitamente
    que los números fueran enteros POSITIVOS.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer atentamente el problema y declarar la incógnita $x$ con sus unidades
  y restricciones.'
- 'Paso 2: Escribir la relación matemática dada en el texto.'
- 'Paso 3: Convertir a la forma general $a x^2 + b x + c = 0$ y resolver.'
- 'Paso 4: Validar las raíces según el contexto real del problema.'
errores_correccion: '- **Error común:** Aceptar a $-9$ como respuesta final de un
  problema de edades o cantidades físicas.

  - **Cómo corregirlo:** Revisa siempre las restricciones del enunciado: magnitudes
  como longitudes, edades o cantidades físicas no admiten valores negativos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento cuadrático.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de resolución contextual.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se deben descartar soluciones negativas al calcular distancias o tiempos?
  respuesta: Sí
  solucion_pasos:
  - Sí, las magnitudes físicas de longitud y tiempo en física clásica son no negativas.
- titulo: ¿Un proyectil lanzado verticalmente h(t) = -5t^2 + v0*t vuelve al suelo
    cuando h(t) = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, tocar el suelo equivale a tener altura h = 0.
errores_frecuentes:
- Aceptar soluciones negativas en problemas donde la variable representa magnitudes
  no negativas como edades o medidas de lados.
- Confundir la pregunta por la incógnita $x$ con la pregunta por la superficie o perímetro
  completo.
- Plantear incorrectamente la ecuación de área olvidando multiplicar los paréntesis
  del largo y ancho.
- Olvidar colocar unidades físicas (metros, segundos, pesos) en la respuesta contextual
  final.
- Sumar en lugar de multiplicar al traducir frases de producto entre números.
afirmaciones_verdaderas:
- El modelamiento cuadrático traduce enunciados reales a ecuaciones $a x^2 + b x +
  c = 0$ cuyas soluciones deben filtrarse según las restricciones físicas del problema.
- En problemas de lanzamiento de proyectiles $h(t) = -g t^2 + v_0 t + h_0$, el instante
  de retorno al suelo se halla igualando la altura a cero ($h(t) = 0$).
al_terminar_debes_poder: Al finalizar este recurso podrás traducir enunciados verbales
  a ecuaciones cuadráticas, resolver problemas de áreas, números y movimiento, seleccionando
  la raíz válida e interpretando la solución.
