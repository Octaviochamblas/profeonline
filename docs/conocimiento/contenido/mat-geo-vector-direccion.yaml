semantic_id: MAT.GEO.VECTORES_BASE.DIRECCION
resumen_inicial: 'Concepto de dirección de un vector: conceptos, teoremas, propiedades
  geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: La dirección de un vector es 'hacia dónde apunta', expresada como
  un ángulo respecto de una referencia fija (el eje X).
explicacion_formal: '![Dirección de un vector](/static/img/geometria/cartesiano-vectores/vector-direccion.svg)


  ### Definición formal


  La dirección de un vector $\vec{v}=(v_x,v_y)$ es el ángulo $\theta$ que forma con
  el semieje positivo de las abscisas, calculado como $\theta=\arctan\left(\frac{v_y}{v_x}\right)$,
  ajustado según el cuadrante correspondiente.


  ### Desarrollo didáctico


  En la figura, el vector con componentes $(4,3)$ forma un ángulo de aproximadamente
  $37°$ con el eje X, calculado como $\arctan(3/4)\approx37°$.'
definiciones_clave: '- **Concepto de dirección de un vector**: Elemento o propiedad
  fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a concepto de dirección de un vector.'
