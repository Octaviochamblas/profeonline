semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.COMPLETO
resumen_inicial: Un ángulo completo (o perigonal) es aquel cuya medida es exactamente
  360° (2π rad), generado por una rotación completa de una vuelta en torno al vértice.
explicacion_simple: '![Ángulo Completo](/static/img/nodos/angulo-completo-de-medida-360-intro.svg)


  Imagina el segundero de un reloj que parte desde las 12, da toda la vuelta completa
  de 60 segundos y vuelve a llegar a las 12. Ha realizado un giro de 360°, denominado
  ángulo completo o perigonal.'
explicacion_formal: '### Definición formal

  Un ángulo $\angle AOB$ es **completo** (o perigonal) si el rayo móvil ha realizado
  una rotación completa de una revolución ($360^\circ$) sobre el vértice, retornando
  a la posición inicial:


  $$\mu(\angle AOB) = 360^\circ = 2\pi \text{ rad} \iff 1 \text{ revolución completa}$$


  ### Desglose simbólico y geométrico

  - $360^\circ = 2\pi \text{ rad}$: Medida total de la circunferencia completa.

  - Recubrimiento total: La región angular abarca la totalidad del plano euclidiano
  $\mathbb{R}^2$.

  - Periodicidad trigonométrica: $\sin(\theta + 360^\circ) = \sin\theta$ y $\cos(\theta
  + 360^\circ) = \cos\theta$.


  ### Síntesis didáctica

  El ángulo completo cuantifica una revolución entera y define el ciclo periódico
  fundamental de la trigonometría y la cinemática circular.'
definiciones_clave: '- **Ángulo completo**: Ángulo de medida exacta $\theta = 360^\circ$.

  - **Ángulo perigonal**: Nombre clásico para el ángulo que abarca los $360^\circ$
  de una circunferencia. '
propiedades_relaciones: '- **Revolución completa**: Equivale a dos ángulos llanos
  ($2 \times 180^\circ$) o cuatro ángulos rectos ($4 \times 90^\circ$).

  - **Suma alrededor de un punto**: La suma de los ángulos consecutivos que comparten
  un mismo vértice y cubren todo el plano es siempre $360^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Completo](/static/img/nodos/angulo-completo-de-medida-360-ejemplos.svg)


    Alrededor de un punto central $O$ se trazan 5 ángulos congruentes de igual medida
    $\alpha$ que cubren todo el plano sin solaparse. Determina la medida de cada ángulo
    $\alpha$ y clasifícalo.'
  pasos:
  - 'Paso 1: Reconocer que la suma total de los ángulos alrededor del punto es un
    ángulo completo de $360^\circ$.'
  - 'Paso 2: Plantear la ecuación: $5\alpha = 360^\circ$.'
  - 'Paso 3: Despejar $\alpha = \frac{360^\circ}{5} = 72^\circ$.'
  - 'Paso 4: Concluir que cada ángulo mide $72^\circ$, el cual se clasifica como ángulo
    agudo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto mide exactamente un ángulo completo?
  choices:
  - text: Exactamente 360° (2π rad)
    is_correct: true
  - text: Exactamente 180°
    is_correct: false
  - text: Exactamente 90°
    is_correct: false
  - text: Exactamente 0°
    is_correct: false
  explanation: Un ángulo completo mide exactamente 360° (2π rad).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A cuántos ángulos rectos equivale un ángulo completo?
  choices:
  - text: Equivale a 4 ángulos rectos
    is_correct: true
  - text: Equivale a 2 ángulos rectos
    is_correct: false
  - text: Equivale a 1 ángulo recto
    is_correct: false
  - text: Equivale a 6 ángulos rectos
    is_correct: false
  explanation: Puesto que 4 x 90° = 360°, equivale a 4 ángulos rectos.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que se trata de un giro de una vuelta completa o de la suma
  total alrededor de un punto.'
- 'Paso 2: Aplicar la equivalencia $\theta = 360^\circ$ ($2\pi\text{ rad}$).'
- 'Paso 3: Resolver la suma angular $\sum \alpha_i = 360^\circ$.'
errores_correccion: No confundas el ángulo completo (360°, con rotación de 1 vuelta)
  con el ángulo nulo (0°, sin rotación).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántos grados recorre la aguja de los minutos de un reloj en 1 hora
    completa?
  alternativas:
  - $360^\circ$ (un ángulo completo)
  - $180^\circ$ (un ángulo extendido)
  - $90^\circ$ (un ángulo recto)
  respuesta: $360^\circ$ (un ángulo completo)
  solucion_pasos:
  - En una hora completa realiza un giro perigonal de $360^\circ$.
- titulo: Ejemplo 2
  enunciado: Si tres ángulos alrededor de un punto miden $100^\circ$, $120^\circ$
    y $x$, ¿cuánto vale $x$?
  alternativas:
  - $140^\circ$
  - $150^\circ$
  - $120^\circ$
  respuesta: $140^\circ$
  solucion_pasos:
  - $100^\circ + 120^\circ + x = 360^\circ \implies 220^\circ + x = 360^\circ \implies
    x = 140^\circ$.
- titulo: ¿Un ángulo completo mide 360°?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición formal un ángulo completo equivale a 360°.
- titulo: ¿Un ángulo completo es lo mismo que un ángulo nulo de 0°?
  respuesta: 'No'
  solucion_pasos:
  - No, aunque los rayos coincidan visualmente, el ángulo completo involucra un giro
    de 360°.
errores_frecuentes:
- Confundir ángulo completo ($360^\circ$) con ángulo nulo ($0^\circ$).
- Confundir ángulo completo con ángulo extendido ($180^\circ$).
- Creer que un ángulo completo equivale a 2 ángulos rectos (equivale a 4).
- Olvidar que la suma de ángulos alrededor de cualquier punto en el plano es $360^\circ$.
- No distinguir entre la posición final del rayo y la trayectoria rotacional recorrida.
afirmaciones_verdaderas:
- Un ángulo completo mide exactamente $360^\circ$.
- Cuatro ángulos rectos equivalen a un ángulo completo.
al_terminar_debes_poder: '**QUÉ:** Identificar, calcular y aplicar propiedades de
  ángulos completos de $360^\circ$ en problemas geométricos.


  **CÓMO:** Verificando la rotación completa de $360^\circ$ y aplicando la suma alrededor
  de un punto $\sum \alpha_i = 360^\circ$.


  ![Resumen de Ángulo Completo](/static/img/nodos/angulo-completo-de-medida-360-resumen.svg)'
