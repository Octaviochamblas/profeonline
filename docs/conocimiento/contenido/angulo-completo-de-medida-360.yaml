semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.COMPLETO
resumen_inicial: El ángulo completo o perígono representa un giro entero de 360° alrededor
  de un punto, fundamentando la división en grados de la circunferencia.
explicacion_simple: Piensa en dar una vuelta completa en una calesita hasta volver
  exactamente al lugar donde empezaste. Ese giro de una vuelta entera es un ángulo
  completo que mide 360°.
explicacion_formal: Un ángulo es **completo o perígono** si su medida es exactamente
  igual a $360^\circ$. Corresponde a una rotación completa del rayo final alrededor
  del vértice hasta volver a coincidir sobre el rayo inicial.
definiciones_clave: '- **Ángulo obtuso**: Ángulo cuya medida está comprendida estrictamente
  entre $90^\circ$ y $180^\circ$.

  - **Triángulo obtusángulo**: Triángulo que posee un ángulo interior obtuso.'
propiedades_relaciones: '- **Suplementariedad**: El suplemento de un ángulo obtuso
  es siempre un ángulo agudo.

  - **Unicidad en triángulos**: Un triángulo puede tener como máximo un solo ángulo
  obtuso.'
ejemplo_guiado:
  enunciado: Una rueda de bicicleta da un giro completo alrededor de su eje en 1 segundo.
    Si el ángulo recorrido en medio segundo equivale a la mitad del perígono ($360^\circ$),
    calcula cuántos grados gira en medio segundo.
  pasos:
  - 'Paso 1: Identificar la medida del ángulo completo o perígono como $360^\circ$.'
  - 'Paso 2: Dividir el giro entre 2 para medio segundo: $\theta = \frac{360^\circ}{2}$.'
  - 'Paso 3: Concluir que en medio segundo gira $180^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Entre qué valores de medida en grados se encuentra un ángulo obtuso?
  choices:
  - text: Mayor que 90° y menor que 180°
    is_correct: true
  - text: Mayor que 0° y menor que 90°
    is_correct: false
  - text: Exactamente 180°
    is_correct: false
  - text: Mayor que 180° y menor que 360°
    is_correct: false
  explanation: La alternativa correcta es 'Mayor que 90° y menor que 180°'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántos grados gira la rueda en media vuelta si una vuelta completa son
    360°?
  choices:
  - text: 180°
    is_correct: true
  - text: 90°
    is_correct: false
  - text: 360°
    is_correct: false
  - text: 270°
    is_correct: false
  explanation: La alternativa correcta es '180°', calculada como $360^\circ / 2 =
    180^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener la medida del ángulo.'
- 'Paso 2: Comprobar que sea mayor a $90^\circ$ y menor a $180^\circ$.'
- 'Paso 3: Clasificarlo como ángulo obtuso.'
errores_correccion: Recuerda que un ángulo de 90° no es obtuso (es recto) y uno de
  180° tampoco (es extendido).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes ángulos es obtuso?
  alternativas:
  - 135°
  - 85°
  - 180°
  respuesta: 135°
  solucion_pasos:
  - 135° está comprendido entre 90° y 180°.
- titulo: Ejemplo 2
  enunciado: Si $\alpha = 110^\circ$, ¿cómo se clasifica?
  alternativas:
  - Ángulo obtuso
  - Ángulo agudo
  - Ángulo recto
  respuesta: Ángulo obtuso
  solucion_pasos:
  - 110° es mayor a 90° y menor a 180°, luego es obtuso.
- titulo: ¿Un ángulo de 120° es obtuso?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque 120° está entre 90° y 180°.
- titulo: ¿Un triángulo puede tener dos ángulos obtusos?
  respuesta: 'No'
  solucion_pasos:
  - No, la suma excedería los 180° del triángulo.
errores_frecuentes:
- Declarar ángulos obtusos con agudos.
- Declarar que un ángulo obtuso puede medir más de 180°.
- Incluir los ángulos de 90° y 180° como obtusos.
- Afirmar que el suplemento de un ángulo obtuso también es obtuso.
- Declarar que un triángulo obtusángulo tiene tres ángulos obtusos.
afirmaciones_verdaderas:
- Un ángulo obtuso mide más de 90° y menos de 180°.
- El suplemento de cualquier ángulo obtuso es siempre un ángulo agudo.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, calcular y
  clasificar cualquier ángulo obtuso en figuras geométricas.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
