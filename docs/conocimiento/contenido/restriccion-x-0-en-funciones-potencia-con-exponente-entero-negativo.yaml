semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.DOMINIO_NEGATIVO
resumen_inicial: La restricción $x \neq 0$ en funciones potencia con exponente entero negativo $f(x) = a \cdot x^{-k} = \frac{a}{x^k}$ establece que $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\} = ]-\infty, 0[ \cup ]0, +\infty[$, debido a la imposibilidad aritmética de la división por cero.
explicacion_simple: "![La restricción $x \\neq 0$ en funciones potencia con exponente entero negativo $f(x) = a \\cdot x^{-k} = \\frac{a}{x^k}$ establece que $\\operatorname{Dom}(f) = \\mathbb{R} \\setminus \\{0\\} = ]-\\infty, 0[ \\cup ]0, +\\infty[$, debido a la imposibilidad aritmética de la división por cero](/static/img/nodos/restriccion-x-0-en-funciones-potencia-con-exponente-entero-negativo-intro.svg)\n\n\nEn cualquier función que tenga un **exponente negativo ($x^{-1}, x^{-2}, x^{-3}...$)**:\n\n$$\\mathbf{x \\neq 0} \\quad \\Longleftrightarrow \\quad \\operatorname{Dom}(f) = \\mathbb{R} \\setminus \\{0\\}$$\n\n- **¿Por qué está prohibido el cero?**\n  - Porque $x^{-k}$ significa $\\frac{1}{x^k}$.\n  - Si intentas reemplazar $x = 0$, tendrías que calcular $\\frac{a}{0}$, **¡lo cual es una división por cero matemáticamente imposible!**\n- **En la gráfica:** El eje $X$ queda 'cortado' o perforado exactamente en el cero, dividiendo la curva en **dos ramas separadas** que nunca se tocan\
  \ en $x = 0$."
explicacion_formal: 'Sea $f(x) = a \cdot x^{-k} = \frac{a}{x^k}$ con $k \in \mathbb{Z}^+$ y $a \in \mathbb{R}^*$.

  Por la definición formal de dominio maximal en funciones racionales:

  $$\operatorname{Dom}(f) = \left\{x \in \mathbb{R} \mid x^k \neq 0\right\}$$

  Dado que $x^k = 0 \iff x = 0$ para todo $k \in \mathbb{Z}^+$:

  $$\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\} = ]-\infty, 0[ \cup ]0, +\infty[$$


  **Propiedad topológica de disconexión**:

  El dominio $\operatorname{Dom}(f)$ es un conjunto abierto desconexo formado por la unión disjunta de dos componentes conexas.'
definiciones_clave: '- **Singularidad esencial aislada**: Punto $x = 0$ excluido del dominio por anulación del denominador.

  - **Dominio desconexo**: Estructura de dos intervalos abiertos separados por el origen.'
propiedades_relaciones: '- **Inexistencia de intercepto en $Y$**: Como $0 \notin \operatorname{Dom}(f)$, la gráfica nunca intersecta al eje de ordenadas.

  - **Simetría de dominios**: Si $x_0 \in \operatorname{Dom}(f) \implies -x_0 \in \operatorname{Dom}(f)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La restricción $x \neq 0$ en funciones potencia con exponente entero negativo $f(x) = a \cdot x^{-k} = \frac{a}{x^k}$ establece que $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\} = ]-\infty, 0[ \cup ]0, +\infty[$, debido a la imposibilidad aritmética de la división por cero](/static/img/nodos/restriccion-x-0-en-funciones-potencia-con-exponente-entero-negativo-ejemplos.svg)



    Determina y fundamenta el dominio de:

    1) $f(x) = -9x^{-4}$

    2) $g(x) = \frac{3}{5x^7}$

    3) Justifica por qué $f(0)$ no existe.'
  pasos:
  - 'Paso 1: Para $f(x) = -9x^{-4} = -9/x^4$: Restricción $x^4 \neq 0 \implies x \neq 0 \implies$ **$\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$**.'
  - 'Paso 2: Para $g(x) = \frac{3}{5x^7}$: Restricción $5x^7 \neq 0 \implies x \neq 0 \implies$ **$\operatorname{Dom}(g) = \mathbb{R} \setminus \{0\}$**.'
  - 'Paso 3: $f(0) = -9/0^4 = -9/0$, lo cual carece de definición en el cuerpo $\mathbb{R}$, demostrando que **$0 \notin \operatorname{Dom}(f)$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función $f(x) = 11x^{-6}$?
  choices:
  - text: ℝ \ {0} (todos los reales excepto el cero)
    is_correct: true
  - text: ℝ
    is_correct: false
  - text: '[0, +∞['
    is_correct: false
  - text: ']-∞, 0]'
    is_correct: false
  explanation: La alternativa correcta es 'ℝ \ {0} (todos los reales excepto el cero)'. Como $x^{-6} = 1/x^6$, el denominador se anula en $x = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Corta la gráfica de $f(x) = 2x^{-1}$ al eje Y?
  choices:
  - text: No, porque x = 0 no pertenece al dominio
    is_correct: true
  - text: Sí, en el punto (0, 2)
    is_correct: false
  - text: Sí, en el punto (0, 0)
    is_correct: false
  - text: Solo si x > 0
    is_correct: false
  explanation: La alternativa correcta es 'No, porque x = 0 no pertenece al dominio'. Todo corte con el eje Y requiere evaluar en $x = 0$, lo cual no está definido.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente negativo de la función $f(x) = a x^{-k}$.'
- 'Paso 2: Escribir la función en forma de cociente $f(x) = a / x^k$.'
- 'Paso 3: Igualar el denominador a cero y resolver: $x^k = 0 \implies x = 0$.'
- 'Paso 4: Excluir dicha solución del dominio: $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\} = ]-\infty, 0[ \cup ]0, +\infty[$.'
errores_correccion: '- **Error común:** Escribir $\operatorname{Dom} = \mathbb{R}$ en funciones con exponente negativo.

  - **Cómo corregirlo:** La variable está en el denominador: **el cero DEBE SER EXCLUIDO**: $\operatorname{Dom} = \mathbf{\mathbb{R} \setminus \{0\}}$.'
ejemplos:
- titulo: 'Ejemplo 1: Notación de unión de intervalos'
  enunciado: 'El dominio de $f(x) = 4x^{-2}$ expresado en intervalos es:'
  alternativas:
  - ']-inf, 0[ U ]0, +inf['
  - ']-inf, +inf['
  - '[0, +inf['
  - ']-inf, 0]'
  respuesta: ']-inf, 0[ U ]0, +inf['
  solucion_pasos:
  - 'Paso 1: $\mathbb{R} \setminus \{0\} = ]-\infty, 0[ \cup ]0, +\infty[$.'
- titulo: 'Ejemplo 2: Evaluación no permitida'
  enunciado: ¿Cuál es el valor de $g(0)$ para $g(x) = -8x^{-5}$?
  alternativas:
  - No está definido (no existe en R)
  - '0'
  - '-8'
  - +infinito
  respuesta: No está definido (no existe en R)
  solucion_pasos:
  - 'Paso 1: $0 \notin \operatorname{Dom}(g) \implies g(0)$ no existe.'
- titulo: 'Ejemplo 3: Dominio de monomio recíproco'
  enunciado: ¿Para qué valores de $x$ está definida la función $h(x) = \frac{1}{x^3}$?
  alternativas:
  - Para todo x distinto de 0
  - Para todo x mayor que 0
  - Para todo x real
  - Solo para enteros
  respuesta: Para todo x distinto de 0
  solucion_pasos:
  - 'Paso 1: $x \neq 0$ es la única condición de existencia.'
- titulo: 'Ejemplo 4: Intercepto ausente'
  enunciado: ¿Por qué $y = 3x^{-4}$ no tiene intercepto con el eje Y?
  alternativas:
  - Porque x = 0 no pertenece al dominio de la función
  - Porque 3 es positivo
  - Porque el exponente es par
  - Sí tiene en (0, 3)
  respuesta: Porque x = 0 no pertenece al dominio de la función
  solucion_pasos:
  - 'Paso 1: Al no poder evaluar en $x = 0$, no existe punto $(0, y)$.'
errores_frecuentes:
- Incluir el cero en el dominio.
- Asumir que f(0) = 0.
- Confundir la exclusión del cero en el dominio con la exclusión del cero en el recorrido.
afirmaciones_verdaderas:
- El dominio de cualquier función potencia con exponente entero negativo es ℝ \ {0}.
- La gráfica de una función potencia con exponente negativo no corta jamás al eje Y.
al_terminar_debes_poder: '**QUÉ:** Determinar y justificar la restricción de dominio x ≠ 0 en potencias de exponente negativo.


  **CÓMO:** Argumentando la indeterminación de la división por cero para formular Dom(f) = ℝ \ {0}.


