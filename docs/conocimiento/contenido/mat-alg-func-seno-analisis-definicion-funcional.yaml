semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.DEFINICION_FUNCIONAL
resumen_inicial: 'Definición de la función seno $f(x) = \sin(x)$ como la relación funcional que asigna a cada ángulo real $x$ la ordenada $y$ del círculo unitario.'
explicacion_simple: |
  Imagina que desenrollas la circunferencia del círculo unitario a lo largo de una recta horizontal. El eje de las abscisas ($x$) ahora representa la medida del ángulo en radianes, y el eje de las ordenadas ($y$) representa la altura que alcanza el punto sobre el círculo unitario. La función seno, escrita como $f(x) = \sin(x)$, toma la medida del ángulo $x$ y devuelve exactamente esa altura $y$. Como el círculo da vueltas infinitas hacia la derecha y hacia la izquierda, la gráfica se repite como una onda ondulante sin fin.
explicacion_formal: |
  ### Definición formal
  La **función seno fundamental** es la función real de variable real $f: \mathbb{R} \to [-1, 1]$ definida por:
  $$f(x) = \sin(x)$$
  donde a cada número real $x \in \mathbb{R}$ (que representa la medida de un ángulo en radianes en posición estándar) le asigna la ordenada $y$ del punto intersección $P(x,y)$ entre el lado terminal del ángulo y la circunferencia unitaria $\mathcal{C}: x^2 + y^2 = 1$.

  ### Desglose simbólico
  - $x \in \mathbb{R}$: Variable independiente que representa la apertura del ángulo medida en radianes.
  - $y = f(x) = \sin(x)$: Variable dependiente que representa la proyección vertical del punto sobre la circunferencia unitaria.
  - Dominio: $\operatorname{Dom}(f) = \mathbb{R} = (-\infty, \infty)$.
  - Recorrido: $\operatorname{Rec}(f) = [-1, 1]$.

  ### Síntesis didáctica
  La función seno transforma la geometría estática de la circunferencia goniométrica en una función continua u ondulante. Permite modelar fenómenos oscilatorios continuos como ondas de sonido, vibraciones y corriente alterna.
definiciones_clave: |
  - **Función seno ($f(x) = \sin x$)**: Relación funcional real que asigna a cada ángulo $x$ en radianes su proyección vertical en el círculo unitario.
  - **Onda sinusoidal**: Curva suave y periódica continua que representa gráficamente a la función seno.
  - **Variable angular $x$**: Argumento de la función trigonométrica expresado preferentemente en radianes.
propiedades_relaciones: |
  - **Continuidad universal**: La función $f(x) = \sin(x)$ es continua y derivable en todo su dominio $\mathbb{R}$.
  - **Acotación estricta**: Para todo $x \in \mathbb{R}$, se verifica la desigualdad $-1 \le \sin(x) \le 1$.
ejemplo_guiado:
  enunciado: 'Evalúa la función seno $f(x) = \sin(x)$ en el valor $x = \frac{5\pi}{6}$ y determina la altura $y$ correspondiente en el círculo unitario.'
  pasos:
    - 'Paso 1: Identificar el argumento angular dado en radianes: $x = \frac{5\pi}{6}$ (equivalente a $150^\circ$).'
    - "Paso 2: Determinar el ángulo de referencia en el segundo cuadrante: $x' = \\pi - \\frac{5\\pi}{6} = \\frac{\\pi}{6}$ (equivalente a $30^\\circ$)."
    - 'Paso 3: Evaluar el valor del seno para el ángulo de referencia: $\sin\left(\frac{\pi}{6}\right) = \frac{1}{2}$.'
    - 'Paso 4: Asignar el signo del segundo cuadrante (en II C las ordenadas son positivas, $y > 0$): $f\left(\frac{5\pi}{6}\right) = \sin\left(\frac{5\pi}{6}\right) = +\frac{1}{2}$. La altura alcanzada en la gráfica es $y = 0.5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué representa la variable independiente $x$ en la función seno real $f(x) = \sin(x)$?'
    choices:
      - {text: 'La medida del ángulo en radianes en el plano cartesiano', is_correct: true}
      - {text: 'La altura vertical del triángulo rectángulo', is_correct: false}
      - {text: 'El área encerrada por el círculo unitario', is_correct: false}
      - {text: 'La longitud fija del radio del círculo', is_correct: false}
    explanation: 'La alternativa correcta es ''La medida del ángulo en radianes en el plano cartesiano''. En la función $f(x) = \sin(x)$, $x$ es el argumento angular real.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se evalúa la función seno en $x = \frac{\pi}{2}$, ¿cuál es el valor resultante $f\left(\frac{\pi}{2}\right)$?'
    choices:
      - {text: '$1$', is_correct: true}
      - {text: '$0$', is_correct: false}
      - {text: '$-1$', is_correct: false}
      - {text: '$\frac{1}{2}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$1$''. En $x = \frac{\pi}{2}$ ($90^\circ$), el punto del círculo unitario es $(0,1)$, por lo que $\sin\left(\frac{\pi}{2}\right) = 1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar el valor del ángulo $x$ expresado en radianes.'
  - 'Paso 2: Ubicar el punto $P(x,y) = (\cos x, \sin x)$ sobre la circunferencia unitaria.'
  - 'Paso 3: Extraer la ordenada vertical $y$ del punto $P$.'
  - 'Paso 4: Asignar $f(x) = y$ como el valor resultante de la función seno.'
errores_correccion: |
  - **Error 1:** Confundir la función seno $f(x) = \sin(x)$ con la coordenada horizontal $x$ del círculo unitario. **Cómo corregirlo:** La función seno asigna la coordenada vertical $y$ como respuesta ($y = \sin x$). La coordenada horizontal $x$ representa el coseno.
  - **Error 2:** Evaluar la función $f(x) = \sin(x)$ ingresando el argumento en grados sexagesimales sin convertir a la escala real del eje $X$. **Cómo corregirlo:** Al graficar como función real en el plano $XY$, la variable $x$ debe medirse de manera continua en radianes.
ejemplos:
  - titulo: 'Evaluación del seno en cero'
    enunciado: '¿Cuál es el valor de $f(0)$ para la función $f(x) = \sin(x)$?'
    alternativas:
      - '$0$'
      - '$1$'
      - '$-1$'
    respuesta: '$0$'
    solucion_pasos:
      - '1. Para $x = 0$, la ordenada del punto $(1,0)$ en el círculo unitario es $y = 0$.'
      - '2. Por lo tanto, $f(0) = \sin(0) = 0$.'
  - titulo: 'Evaluación del seno en tres pi medios'
    enunciado: '¿Cuánto vale $f\left(\frac{3\pi}{2}\right)$ para $f(x) = \sin(x)$?'
    alternativas:
      - '$-1$'
      - '$0$'
      - '$1$'
    respuesta: '$-1$'
    solucion_pasos:
      - '1. $\frac{3\pi}{2}$ corresponde al punto $(0,-1)$ en el círculo unitario.'
      - '2. La ordenada es $y = -1 \implies f\left(\frac{3\pi}{2}\right) = -1$.'
  - titulo: 'Seno de un ángulo pi'
    enunciado: '¿El valor de $f(\pi)$ en la función seno es igual a cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en $x = \pi$ ($180^\circ$) el punto es $(-1,0)$ y su ordenada $y = 0$.'
  - titulo: 'Imposibilidad de seno mayor a 1'
    enunciado: '¿Puede la función $f(x) = \sin(x)$ devolver el valor de $1.5$ para algún $x$ real?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el recorrido de la función seno base está acotado en el intervalo $[-1, 1]$.'
errores_frecuentes:
  - 'La afirmación de que la función seno $f(x) = \sin(x)$ asigna la coordenada horizontal $x$ como resultado.'
  - 'La afirmación de que la función seno requiere un dominio restringido solo a números positivos.'
  - 'La afirmación de que la función seno se interrumpe o presenta asíntotas verticales.'
  - 'La afirmación de que $f(\pi)$ es igual a $1$ en la función seno base.'
  - 'La afirmación de que el seno de un ángulo real carece de representación en el plano cartesiano.'
afirmaciones_verdaderas:
  - 'La función seno $f(x) = \sin(x)$ asigna a cada número real $x$ la ordenada $y$ del punto correspondiente en el círculo unitario.'
  - 'La gráfica de la función seno es una curva continua y ondulante cuyo dominio abarca todos los números reales $\mathbb{R}$.'
al_terminar_debes_poder: |
  QUÉ: Definir e interpretar la función seno $f(x) = \sin(x)$ como relación funcional real.
  CÓMO: Asociar la variable $x$ al ángulo en radianes y el valor $f(x)$ a la ordenada $y$ del círculo unitario.
