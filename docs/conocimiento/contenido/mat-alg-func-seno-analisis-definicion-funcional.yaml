semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.DEFINICION_FUNCIONAL
resumen_inicial: 'Definición de la función seno como relación entre ángulo y coordenada
  y: círculo unitario, amplitud, período y transformaciones de Análisis de la función
  seno.'
explicacion_simple: Ya conoces $\sin(\theta)$ para ángulos específicos; ahora se trata
  como una función completa, que puede evaluarse en cualquier número real y graficarse.
explicacion_formal: '### Definición formal


  $f:\mathbb{R}\to\mathbb{R}$, $f(x)=\sin(x)$, donde $x$ se interpreta como la medida
  en radianes de un ángulo en posición estándar, y $f(x)$ es la coordenada $y$ del
  punto donde el lado terminal corta al círculo unitario.


  ### Desarrollo didáctico


  $f(0)=\sin(0)=0$; $f(\pi/2)=\sin(\pi/2)=1$; $f(\pi)=\sin(\pi)=0$. A diferencia de
  usar grados, en el contexto de funciones se trabaja casi siempre con radianes como
  unidad natural del argumento.'
definiciones_clave: '- **Definición de la función seno como relación entre ángulo
  y coordenada y**: Función periódica fundamentada en las coordenadas del círculo
  unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a definición de la función seno como relación entre ángulo y coordenada
  y.'
