semantic_id: MAT.NUM.ENTEROS_OPERATORIA.ADICION_DISTINTO_SIGNO
resumen_inicial: Para sumar enteros de distinto signo, se restan sus valores absolutos
  y se conserva el signo del número con mayor valor absoluto.
explicacion_simple: 'Cuando sumamos dos números con signos opuestos (uno positivo
  y uno negativo), sus efectos se contrarrestan parcialmente. Es como tener un abono
  a favor y una deuda: la cantidad final disminuye y el resultado conserva la naturaleza
  del número que tenía la magnitud más grande.'
explicacion_formal: 'Para dos enteros $a, b \in \mathbb{Z}$ tales que $\operatorname{sgn}(a)
  \neq \operatorname{sgn}(b)$, la **Regla de Adición de Distinto Signo** se define
  como:


  $$a + b = \operatorname{sgn}(m) \cdot \left| |a| - |b| \right| \quad \text{donde
  } m = \arg\max_{x \in \{a,b\}} |x|$$


  **Desglose de la fórmula:**

  - $\left| |a| - |b| \right|$: Resta aritmética entre el mayor valor absoluto y el
  menor valor absoluto.

  - $m$: El sumando cuyo valor absoluto $|m|$ es estrictamente mayor.

  - $\operatorname{sgn}(m)$: Garantiza que la suma conserve el signo del sumando dominante
  en magnitud.


  > **Complemento didáctico:** En $(-15) + 8$, el mayor valor absoluto es $|-15|=15$.
  Restamos $15-8=7$ y colocamos el signo del $-15$, obteniendo $-7$.'
definiciones_clave: '- **Adición de distinto signo**: Sustracción de magnitudes absolutas
  bajo la dominancia del signo del mayor módulo.

  - **Dominancia de módulo**: El término con mayor distancia al cero impone su polaridad
  al resultado.'
propiedades_relaciones: '- **Cancelación de opuestos**: Si $a + b = 0$, los números
  son opuestos aditivos ($b = -a$).'
ejemplo_guiado:
  enunciado: Calcule la suma de enteros de distinto signo $(-14) + 9$ indicando el
    paso a paso.
  pasos:
  - 'Paso 1: Comparar los valores absolutos de los sumandos: $|-14| = 14$ y $|9| =
    9$.'
  - 'Paso 2: Restar el valor absoluto menor al mayor: $14 - 9 = 5$.'
  - 'Paso 3: Identificar que $-14$ tiene el mayor valor absoluto ($14 > 9$), por lo
    que el resultado es negativo: $-5$.'
  - 'Conclusión: $(-14) + 9 = -5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de la suma (-12) + 20?
  choices:
  - text: '8'
    is_correct: true
  - text: '-8'
    is_correct: false
  - text: '32'
    is_correct: false
  - text: '-32'
    is_correct: false
  explanation: La alternativa correcta es '8', calculando $20 - 12 = 8$, y conservando
    el signo positivo de 20.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado (-14) + 9, ¿por qué el resultado es negativo?
  choices:
  - text: Porque el número -14 tiene mayor valor absoluto que 9
    is_correct: true
  - text: Porque la suma siempre da negativo
    is_correct: false
  - text: Porque se multiplicaron los signos
    is_correct: false
  - text: Porque el 9 es un número impar
    is_correct: false
  explanation: La alternativa correcta es 'Porque el número -14 tiene mayor valor
    absoluto que 9'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener el valor absoluto de cada uno de los dos sumandos.'
- 'Paso 2: Restar el valor absoluto menor del valor absoluto mayor.'
- 'Paso 3: Asignar al resultado el signo del sumando que poseía la mayor distancia
  al cero.'
errores_correccion: '- **Error 1: Sumar las magnitudes al tener distinto signo (ej:
  $(-8) + 5 = -13$).** **Cómo corregirlo:** Al tener distinto signo, las magnitudes
  se restan ($8 - 5 = 3 \implies -3$).


  - **Error 2: Poner siempre el signo del primer número escrito.** **Cómo corregirlo:**
  El signo lo impone el número de mayor valor absoluto, independientemente de su posición.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $18 + (-25)$.
  alternativas:
  - '-7'
  - '7'
  - '-43'
  respuesta: '-7'
  solucion_pasos:
  - '$|-25| = 25 > |18| = 18$. Resta: $25 - 18 = 7$. Signo de $-25$: $-7$.'
- titulo: Ejemplo 2
  enunciado: Una temperatura de $-6^\circ\text{C}$ sube $10^\circ\text{C}$. ¿Cuál
    es la temperatura final?
  alternativas:
  - 4°C
  - -4°C
  - 16°C
  respuesta: 4°C
  solucion_pasos:
  - $(-6) + 10 = +4^\circ\text{C}$.
- titulo: ¿La suma (-10) + 10 es igual a 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, la suma de opuestos aditivos es siempre cero.
- titulo: ¿El resultado de 15 + (-3) es negativo?
  respuesta: 'No'
  solucion_pasos:
  - No, $|15| > |-3|$, por ende el resultado es positivo ($+12$).
errores_frecuentes:
- Al sumar dos enteros de distinto signo se deben sumar sus valores absolutos.
- El resultado de sumar dos enteros de distinto signo es siempre un entero positivo.
- El signo del resultado al sumar enteros de distinto signo es siempre el del primer
  sumando.
- La suma de dos enteros de distinto signo da como resultado cero en todos los casos.
- Multiplicar los signos antecedente determina el signo de la suma de distinto signo.
afirmaciones_verdaderas:
- Al sumar enteros de distinto signo, se restan sus valores absolutos.
- El resultado conserva el signo del sumando que tiene el mayor valor absoluto.
al_terminar_debes_poder: Al terminar serás capaz de calcular la adición de dos enteros
  de distinto signo, restando el módulo menor al mayor y conservando el signo de la
  cantidad con mayor valor absoluto.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
