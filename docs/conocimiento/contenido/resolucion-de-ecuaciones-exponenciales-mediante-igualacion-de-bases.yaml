semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.ECUACIONES_IGUAL_BASE
resumen_inicial: La resolución de ecuaciones exponenciales mediante igualación de bases aplica la propiedad de inyectividad $b^{P(x)} = b^{Q(x)} \iff P(x) = Q(x)$.
explicacion_simple: |
  Una **ecuación exponencial** es aquella donde la incógnita $x$ se encuentra en el exponente (por ejemplo, $2^{x+1} = 16$).

  - El método de **igualación de bases** consiste en transformar ambos lados de la ecuación para que tengan **LA MISMA BASE $b$**:
    - Como $16 = 2^4$, escribimos la ecuación como:

    $$2^{x+1} = 2^4$$

  - **Dado que las bases son iguales ($2 = 2$)**, los exponentes **TIENEN QUE SER IGUALES**:

    $$x + 1 = 4 \implies x = 3$$
explicacion_formal: |
  Dada una igualdad de potencias exponenciales $b^{P(x)} = b^{Q(x)}$ definida para $b \in \mathbb{R}^+ \setminus \{1\}$ y expresiones algebraicas $P(x), Q(x)$, el principio de resolución se sustenta en la **propiedad de inyectividad estricta de la función exponencial**:

  $$f(u) = b^u \text{ es inyectiva en } \mathbb{R} \iff \left(f(u_1) = f(u_2) \iff u_1 = u_2\right)$$

  **Teorema de Equivalencia de Exponentes:**
  $$b^{P(x)} = b^{Q(x)} \iff P(x) = Q(x)$$

  - Este teorema reduce una ecuación exponencial a una **ecuación lineal o cuadrática equivalente** en el dominio de los exponentes.
definiciones_clave: |
  - **Igualación de bases**: Técnica algebraica de resolución de ecuaciones exponenciales que expresa ambos miembros de la ecuación como potencias de una base común $b > 0, b \neq 1$.
propiedades_relaciones: |
  - **Inyectividad exponencial**: Propiedad matemática que garantiza que dos potencias de igual base son iguales si y solo si sus exponentes son idénticos.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación exponencial $9^{2x - 1} = 27^{x + 2}$ aplicando el método de igualación de bases.'
  pasos:
    - 'Paso 1: Expresar 9 y 27 como potencias de una base común $b = 3$: $9 = 3^2$ y $27 = 3^3$.'
    - 'Paso 2: Sustituir en la ecuación: $(3^2)^{2x - 1} = (3^3)^{x + 2}$.'
    - 'Paso 3: Aplicar potencia de una potencia: $3^{2(2x - 1)} = 3^{3(x + 2)} \implies 3^{4x - 2} = 3^{3x + 6}$.'
    - 'Paso 4: Igualar exponentes y resolver: $4x - 2 = 3x + 6 \implies 4x - 3x = 6 + 2 \implies x = 8$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al resolver la ecuación exponencial $5^{3x - 2} = 125$, ¿cuál es el valor de la incógnita $x$?'
    choices:
      - {text: '$x = 5/3$', is_correct: true}
      - {text: '$x = 1$.', is_correct: false}
      - {text: '$x = 3$.', is_correct: false}
      - {text: '$x = 25$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 5/3$''. $125 = 5^3 \implies 3x - 2 = 3 \implies 3x = 5 \implies x = 5/3$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Para la ecuación exponencial $2^{x^2 - 5} = \frac{1}{2}$, ¿cuáles son las soluciones reales de $x$?'
    choices:
      - {text: '$x = 2$ y $x = -2$', is_correct: true}
      - {text: '$x = 4$ y $x = -4$.', is_correct: false}
      - {text: '$x = 1$ y $x = -1$.', is_correct: false}
      - {text: 'No tiene soluciones reales.', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 2$ y $x = -2$''. $1/2 = 2^{-1} \implies x^2 - 5 = -1 \implies x^2 = 4 \implies x = \pm 2$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reescribir ambos miembros de la ecuación como potencias de una misma base $b > 0, b \neq 1$.'
  - 'Paso 2: Aplicar la ley de potencia de potencia $(b^n)^m = b^{n \cdot m}$ para simplificar los exponentes.'
  - 'Paso 3: Aplicar el principio de inyectividad e igualar los exponentes resultantes $P(x) = Q(x)$.'
  - 'Paso 4: Resolver la ecuación polinómica obtenida para $x$ y verificar la solución en la ecuación original.'
errores_correccion: |
  - **Error común:** Cancelar las bases multiplicando o dividiendo incorrectamente (ej. decir que de $2^x = 8$ se obtiene $x = 8/2 = 4$).
  - **Cómo corregirlo:** No dividas la base entre la respuesta: debes **EXPRESAR 8 COMO POTENCIA ($8 = 2^3$)** y luego igualar los exponentes ($x = 3$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Base 2 y potencia 16.
    alternativas:
      - '2^{x+2} = 2^4 \implies x+2 = 4 \implies x = 2'
      - 'x = 8'
      - 'x = 16'
    respuesta: '2^{x+2} = 2^4 \implies x+2 = 4 \implies x = 2'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Exponente negativo por fracción.
    alternativas:
      - '4^x = 1/64 \implies 4^x = 4^{-3} \implies x = -3'
      - 'x = 3'
      - 'x = 1/16'
    respuesta: '4^x = 1/64 \implies 4^x = 4^{-3} \implies x = -3'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la ecuación $3^x = 27$, la afirmación de que $x = 9$ por efectuar la división $27 / 3$.'
  - 'La omisión del cambio de signo del exponente al convertir fracciones de la forma $1/b^n$ a potencias $b^{-n}$.'
  - 'La aplicación incorrecta de la propiedad distributiva al efectuar el producto de exponentes en la regla de potencia de potencia.'
  - 'La afirmación de que el método de igualación de bases puede aplicarse cuando las bases no son expresables mediante una raíz entera común.'
  - 'La afirmación de que dos potencias de igual base pueden ser iguales teniendo exponentes distintos.'
afirmaciones_verdaderas:
  - 'La propiedad de inyectividad exponencial establece que si $b^A = b^B$ con $b > 0, b \neq 1$, entonces necesariamente $A = B$.'
  - 'Una fracción de la forma $1/b^k$ equivale a la potencia con exponente negativo $b^{-k}$, permitiendo la igualación de bases.'
al_terminar_debes_poder: |
  QUÉ: Resolver ecuaciones exponenciales utilizando el método de igualación de bases $b^{P(x)} = b^{Q(x)} \iff P(x) = Q(x)$.
  CÓMO: Expresar ambos lados con base común $b$, igualar los exponentes $P(x) = Q(x)$, despejar $x$ y verificar la solución.
