semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.ECUACIONES_IGUAL_BASE
resumen_inicial: La resolución de ecuaciones exponenciales mediante igualación de bases aplica el principio de inyectividad $b^{u(x)} = b^{v(x)} \Longleftrightarrow u(x) = v(x)$ ($b > 0, b \neq 1$), transformando ecuaciones trascendentes en ecuaciones algebraicas polinómicas al expresar ambos miembros bajo una base común.
explicacion_simple: "![La resolución de ecuaciones exponenciales mediante igualación de bases aplica el principio de inyectividad $b^{u(x)} = b^{v(x)} \\Longleftrightarrow u(x) = v(x)$ ($b > 0, b \\neq 1$), transformando ecuaciones trascendentes en ecuaciones algebraicas polinómicas al expresar ambos miembros bajo una base común](/static/img/nodos/resolucion-de-ecuaciones-exponenciales-mediante-igualacion-de-bases-intro.svg)\n\n\nPara resolver una ecuación donde la incógnita $x$ está atrapada en el exponente:\n\n1. **Paso 1: Convierte los dos lados a la MISMA BASE.**\n   - Escribe los números como potencias de números primos ($2, 3, 5$):\n     - $4 = 2^2, \\quad 8 = 2^3, \\quad 16 = 2^4, \\quad 27 = 3^3, \\quad \\frac{1}{9} = 3^{-2}$.\n2. **Paso 2: Cancela las bases iguales e IGUALA LOS EXPONENTES.**\n   - Si $2^{3x - 1} = 2^5 \\implies$ ¡los techos deben ser iguales!\n   - $$3x - 1 = 5$$\n3. **Paso 3: Despeja la $x$ como una ecuación normal:**\n   - $3x = 6 \\implies \\mathbf{x = 2}$."
explicacion_formal: "Sea $b \\in \\mathbb{R}^+ \\setminus \\{1\\}$. Por la propiedad de **estricta inyectividad** del homomorfismo exponencial $\\exp_b: \\mathbb{R} \\to \\mathbb{R}^+$:\n$$\\forall u, v \\in \\mathbb{R}: \\quad b^u = b^v \\Longleftrightarrow u = v$$\n\n**Algoritmo de resolución analítica**:\n1. **Factorización en factores primos canónicos**: Expresar la ecuación en la forma $(p^m)^{f(x)} = (p^n)^{g(x)}$.\n2. **Aplicación de leyes de exponentes**: $p^{m \\cdot f(x)} = p^{n \\cdot g(x)}$.\n3. **Reducción algebráica por inyectividad**:\n   $$m \\cdot f(x) = n \\cdot g(x)$$\n4. **Resolución del sistema polinómico** y verificación de soluciones en el dominio real."
definiciones_clave: '- **Ecuación exponencial**: Igualdad matemática donde la variable incógnita figura en uno o más exponentes.

  - **Inyectividad exponencial**: Propiedad que asegura que imágenes iguales provienen obligatoriamente de preimágenes idénticas.'
propiedades_relaciones: '- **Potencia de potencia distributiva**: $(b^m)^n = b^{m \cdot n}$.

  - **Inversión fraccionaria**: $\left(\frac{1}{b}\right)^u = b^{-u}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de ecuaciones exponenciales mediante igualación de bases aplica el principio de inyectividad $b^{u(x)} = b^{v(x)} \Longleftrightarrow u(x) = v(x)$ ($b > 0, b \neq 1$), transformando ecuaciones trascendentes en ecuaciones algebraicas polinómicas al expresar ambos miembros bajo una base común](/static/img/nodos/resolucion-de-ecuaciones-exponenciales-mediante-igualacion-de-bases-ejemplos.svg)



    Resuelve la siguiente ecuación exponencial por el método de igualación de bases:

    $$27^{x - 1} = \left(\frac{1}{9}\right)^{x + 2}$$'
  pasos:
  - 'Paso 1: Expresar ambas bases en potencias de base prima común (base 3):

    - $27 = 3^3$.

    - $\frac{1}{9} = 9^{-1} = (3^2)^{-1} = 3^{-2}$.'
  - 'Paso 2: Sustituir en la ecuación original:

    $(3^3)^{x - 1} = (3^{-2})^{x + 2}$.'
  - 'Paso 3: Aplicar propiedad de potencia de potencia multiplicando exponentes:

    $3^{3(x - 1)} = 3^{-2(x + 2)} \implies 3^{3x - 3} = 3^{-2x - 4}$.'
  - 'Paso 4: Igualar los exponentes por inyectividad de base 3:

    $3x - 3 = -2x - 4$.'
  - 'Paso 5: Resolver la ecuación lineal:

    $3x + 2x = -4 + 3 \implies 5x = -1 \implies x = -\frac{1}{5}$.'
  - 'Paso 6: Conclusión: La solución real única es $x = -\frac{1}{5}$ (o $-0{,}2$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la solución de la ecuación exponencial $2^{x + 3} = 16$?
  choices:
  - text: x = 1 (porque 16 = 2⁴ y x + 3 = 4)
    is_correct: true
  - text: x = 4
    is_correct: false
  - text: x = 13
    is_correct: false
  - text: x = 2
    is_correct: false
  explanation: La alternativa correcta es 'x = 1 (porque 16 = 2⁴ y x + 3 = 4)'. $2^{x+3} = 2^4 \implies x + 3 = 4 \implies x = 1$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $5^{2x - 1} = \frac{1}{25}$, ¿cuál es el valor de x?
  choices:
  - text: x = -1/2 (porque 1/25 = 5⁻² y 2x - 1 = -2)
    is_correct: true
  - text: x = -2
    is_correct: false
  - text: x = 3/2
    is_correct: false
  - text: x = 1
    is_correct: false
  explanation: La alternativa correcta es 'x = -1/2 (porque 1/25 = 5⁻² y 2x - 1 = -2)'. $5^{2x-1} = 5^{-2} \implies 2x - 1 = -2 \implies 2x = -1 \implies x = -1/2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Descomponer las bases de ambos miembros en factores primos para encontrar una base común $b$.'
- 'Paso 2: Aplicar propiedades de potencias ($(b^m)^n = b^{mn}$, $1/b^n = b^{-n}$) para dejar un solo término exponencial a cada lado.'
- 'Paso 3: Igualar los exponentes resultantes eliminando la base común.'
- 'Paso 4: Resolver la ecuación algebraica obtenida y verificar la solución.'
errores_correccion: '- **Error común:** Igualar directamente los exponentes cuando las bases son distintas (ej: en $2^x = 4^3$ decir que $x = 3$).

  - **Cómo corregirlo:** Primero debes **igualar las bases**: $4^3 = (2^2)^3 = 2^6 \implies x = 6$.'
ejemplos:
- titulo: 'Ejemplo 1: Base 2 simple'
  enunciado: 'Resuelve $2^{2x} = 64$:'
  alternativas:
  - x = 3
  - x = 6
  - x = 32
  - x = 2
  respuesta: x = 3
  solucion_pasos:
  - 'Paso 1: $2^{2x} = 2^6 \implies 2x = 6 \implies x = 3$.'
- titulo: 'Ejemplo 2: Base 3 con resta'
  enunciado: 'Resuelve $3^{x-4} = 27$:'
  alternativas:
  - x = 7
  - x = 3
  - x = -1
  - x = 12
  respuesta: x = 7
  solucion_pasos:
  - 'Paso 1: $3^{x-4} = 3^3 \implies x - 4 = 3 \implies x = 7$.'
- titulo: 'Ejemplo 3: Base fraccionaria'
  enunciado: 'Resuelve $4^{x+1} = \frac{1}{16}$:'
  alternativas:
  - x = -3
  - x = -2
  - x = 3
  - x = -1
  respuesta: x = -3
  solucion_pasos:
  - 'Paso 1: $4^{x+1} = 4^{-2} \implies x + 1 = -2 \implies x = -3$.'
- titulo: 'Ejemplo 4: Exponente cuadrático'
  enunciado: 'Resuelve $2^{x^2 - 4} = 1$:'
  alternativas:
  - x = 2 ó x = -2
  - x = 4
  - x = 0
  - x = 1
  respuesta: x = 2 ó x = -2
  solucion_pasos:
  - 'Paso 1: $2^{x^2 - 4} = 2^0 \implies x^2 - 4 = 0 \implies x = \pm 2$.'
errores_frecuentes:
- 'Olvidar distribuir el producto al aplicar potencia de potencia (ej: 2(x+1) = 2x+2, no 2x+1).'
- Tratar a 1 como número no exponencial en lugar de escribirlo como b⁰.
- Intentar igualar bases sumando o restando números en lugar de factorizar potencias.
afirmaciones_verdaderas:
- Si b^(u(x)) = b^(v(x)) con b > 0 y b ≠ 1, entonces obligatoriamente u(x) = v(x).
- El número 1 puede expresarse en cualquier base positiva b como b⁰.
al_terminar_debes_poder: '**QUÉ:** Resolver ecuaciones exponenciales mediante el método de igualación de bases.


  **CÓMO:** Transformando ambos miembros a una base prima común e igualando sus exponentes algebraicos.


  ![Resumen La resolución de ecuaciones exponenciales mediante igualación de bases aplica el principio de inyectividad $b^{u(x)} = b^{v(x)} \Longleftrightarrow u(x) = v(x)$ ($b > 0, b \neq 1$), transformando ecuaciones trascendentes en ecuaciones algebraicas polinómicas al expresar ambos miembros bajo una base común](/static/img/nodos/resolucion-de-ecuaciones-exponenciales-mediante-igualacion-de-bases-resumen.svg)'
