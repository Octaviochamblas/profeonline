semantic_id: MAT.GEO.RECTA_ECUACIONES.VECTOR_DIRECTOR
resumen_inicial: 'Identificación del vector director de una recta en el plano: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: 'Además de la pendiente, una recta puede describirse mediante
  un vector que apunta en su misma dirección: el vector director, base de las formas
  vectorial y paramétrica.'
explicacion_formal: '![Vector director de una recta](/static/img/geometria/analitica/rectaeq-vector-director.svg)


  ### Definición formal


  Si una recta tiene pendiente $m=\dfrac{d_2}{d_1}$, entonces $\vec{d}=(d_1,d_2)$
  es un vector director válido. También se puede obtener restando las coordenadas
  de dos puntos de la recta: $\vec{d}=(x_2-x_1,y_2-y_1)$.


  ### Desarrollo didáctico


  En la figura, la recta con pendiente $m=0{,}75$ tiene como vector director, por
  ejemplo, $\vec{d}=(4,3)$, ya que $\dfrac{3}{4}=0{,}75$.'
definiciones_clave: '- **Identificación del vector director de una recta en el plano**:
  Elemento o propiedad fundamental en el estudio de geometría analítica ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del vector director de una
  recta en el plano.'
