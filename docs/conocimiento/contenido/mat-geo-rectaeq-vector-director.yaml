procedimiento:
- 'Paso 1: Identifica la pendiente m de la recta (o dos puntos que pertenezcan a ella).'
- 'Paso 2: Si tienes la pendiente, elige un vector (d1,d2) tal que d2/d1=m.'
- 'Paso 3: Si tienes dos puntos, calcula el vector restando sus coordenadas: (x2-x1,
  y2-y1).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
