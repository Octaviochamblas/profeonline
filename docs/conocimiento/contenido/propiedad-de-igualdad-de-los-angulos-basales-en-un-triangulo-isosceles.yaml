semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.ISOSCELES_ANGULOS_BASALES
resumen_inicial: En todo triángulo isósceles, los dos ángulos adyacentes a la base
  (ángulos basales) son estrictamente congruentes, calculándose mediante la relación
  β = γ = (180° - α) / 2.
explicacion_simple: '![Ángulos Basales en Isósceles](/static/img/nodos/propiedad-de-igualdad-de-los-angulos-basales-en-un-triangulo-isosceles-intro.svg)


  Si un triángulo tiene dos lados gemelos del mismo largo, las dos esquinas de la
  base se abren exactamente con la misma inclinación. Por eso, **los dos ángulos de
  la base siempre son exactamente iguales**. Si el ángulo de arriba mide $40^\circ$,
  sobran $140^\circ$ para repartir en partes iguales: $70^\circ$ para cada esquina
  de abajo.'
explicacion_formal: '### Teorema del Pons Asinorum (Euclides I.5)

  En todo triángulo isósceles, los ángulos opuestos a los lados congruentes (**ángulos
  basales**) son estrictamente congruentes entre sí:


  $$AB = AC \implies \angle B \cong \angle C \iff \beta = \gamma$$


  $$\alpha + 2\beta = 180^\circ \implies \beta = \gamma = \frac{180^\circ - \alpha}{2}$$


  ### Desglose simbólico y geométrico

  - $\alpha$: Ángulo en el vértice principal.

  - $\beta, \gamma$: Ángulos basales adyacentes a la base $\overline{BC}$.

  - Relación recíproca: Si un triángulo tiene dos ángulos interiores congruentes,
  entonces es isósceles con lados opuestos congruentes.


  ### Síntesis didáctica

  La igualdad de los ángulos basales permite resolver completamente la estructura
  angular de un isósceles conociendo únicamente uno de sus ángulos.'
definiciones_clave: '- **Teorema de ángulos basales**: Los ángulos adyacentes a la
  base de un isósceles son congruentes ($\beta = \gamma$).

  - **Vértice principal**: Ángulo desigual $\alpha$ opuesto a la base.

  - **Fórmula basal**: $\beta = \frac{180^\circ - \alpha}{2}$. '
propiedades_relaciones: '- **Cálculo del vértice principal**: $\alpha = 180^\circ
  - 2\beta$.

  - **Restricción de medidas**: Como $\beta = \gamma$, los ángulos basales deben ser
  estrictamente agudos ($0^\circ < \beta < 90^\circ$) para que la suma sea menor a
  $180^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulos Basales](/static/img/nodos/propiedad-de-igualdad-de-los-angulos-basales-en-un-triangulo-isosceles-ejemplos.svg)


    En un triángulo isósceles $\\triangle ABC$ con lados iguales $\\overline{AB} =
    \\overline{AC}$, el ángulo en el vértice principal mide $\alpha = 36^\circ$. Determina
    la medida de cada uno de los ángulos basales.'
  pasos:
  - 'Paso 1: Recordar que en un triángulo isósceles los ángulos basales son iguales:
    $\beta = \gamma$.'
  - 'Paso 2: Aplicar la suma de ángulos interiores: $\alpha + 2\beta = 180^\circ$.'
  - 'Paso 3: Sustituir $\alpha = 36^\circ$: $36^\circ + 2\beta = 180^\circ$.'
  - 'Paso 4: Despejar $2\beta$: $2\beta = 180^\circ - 36^\circ = 144^\circ$.'
  - 'Paso 5: Dividir entre 2: $\beta = 144^\circ / 2 = 72^\circ$.'
  - 'Paso 6: Concluir que cada ángulo basal mide $72^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si en un triángulo isósceles el ángulo del vértice principal mide 50°,
    ¿cuánto mide cada ángulo basal?
  choices:
  - text: 65° cada uno (porque (180° - 50°) / 2 = 65°)
    is_correct: true
  - text: 130° cada uno
    is_correct: false
  - text: 50° cada uno
    is_correct: false
  - text: 40° cada uno
    is_correct: false
  explanation: Restando 50° de 180° y dividiendo entre 2 se obtiene 65° cada uno (porque
    (180° - 50°) / 2 = 65°).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si uno de los ángulos basales de un triángulo isósceles mide 40°, ¿cuánto
    mide el ángulo del vértice principal?
  choices:
  - text: 100° (porque 180° - 2(40°) = 100°)
    is_correct: true
  - text: 40°
    is_correct: false
  - text: 80°
    is_correct: false
  - text: 140°
    is_correct: false
  explanation: Multiplicando 40° por 2 y restando de 180° se obtiene 100° (porque
    180° - 2(40°) = 100°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el ángulo del vértice principal $\alpha$ y los ángulos basales
  $\beta = \gamma$.'
- 'Paso 2: Para calcular el ángulo basal, restar $\alpha$ de $180^\circ$ y dividir
  el resultado entre 2.'
- 'Paso 3: Para calcular el ángulo principal, multiplicar el ángulo basal por 2 y
  restarlo de $180^\circ$.'
errores_correccion: 'No olvides dividir entre 2: el resultado de 180° - α corresponde
  a la suma de los dos ángulos basales juntos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un ángulo basal de un triángulo isósceles mide $75^\circ$, ¿cuánto
    mide el ángulo del vértice?
  alternativas:
  - $30^\circ$
  - $75^\circ$
  - $15^\circ$
  respuesta: $30^\circ$
  solucion_pasos:
  - $\alpha = 180^\circ - 2(75^\circ) = 180^\circ - 150^\circ = 30^\circ$.
- titulo: Ejemplo 2
  enunciado: ¿Puede un ángulo basal de un triángulo isósceles medir $95^\circ$?
  alternativas:
  - No, porque dos ángulos de 95° sumarían 190° (superando 180°)
  - Sí, es un triángulo obtusángulo
  - Sí, si los lados son grandes
  respuesta: No, porque dos ángulos de 95° sumarían 190° (superando 180°)
  solucion_pasos:
  - Los ángulos basales deben ser agudos (< 90°) para que su suma no supere 180°.
- titulo: ¿Los dos ángulos basales de un triángulo isósceles son siempre iguales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema del Triángulo Isósceles de Euclides.
- titulo: ¿Un ángulo basal de un triángulo isósceles puede ser recto o obtuso?
  respuesta: 'No'
  solucion_pasos:
  - No, obligatoriamente deben ser agudos menores a 90°.
errores_frecuentes:
- Olvidar dividir por 2 al calcular el ángulo basal.
- Confundir el ángulo del vértice con los ángulos basales.
- Intentar colocar un ángulo obtuso como ángulo basal.
- Restar el ángulo basal de 180° sin multiplicarlo por 2 al despejar el vértice.
- Creer que los ángulos basales dependen de si el triángulo está dibujado vertical
  u horizontal.
afirmaciones_verdaderas:
- Los ángulos basales de un triángulo isósceles son siempre de igual medida.
- Los ángulos basales de un triángulo isósceles son siempre estrictamente agudos (<
  90°).
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad de congruencia de ángulos
  basales en triángulos isósceles.


  **CÓMO:** Calculando ángulos basales y del vértice principal mediante las fórmulas
  $\beta = (180^\circ - \alpha)/2$ y $\alpha = 180^\circ - 2\beta$.


  ![Resumen de Ángulos Basales](/static/img/nodos/propiedad-de-igualdad-de-los-angulos-basales-en-un-triangulo-isosceles-resumen.svg)'
