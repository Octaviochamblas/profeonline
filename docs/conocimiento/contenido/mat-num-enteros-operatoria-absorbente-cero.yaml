semantic_id: MAT.NUM.ENTEROS_OPERATORIA.ABSORBENTE_CERO
resumen_inicial: "El cero es el elemento absorbente de la multiplicación: cualquier entero multiplicado por cero da cero."
explicacion_simple: |
  Imagina que el cero es un agujero negro en la multiplicación. No importa qué tan grande,
  positivo o negativo sea el número que "lances" hacia él: al multiplicarlo por cero, el
  cero lo absorbe por completo. $5\cdot0=0$, y hasta $(-1234567)\cdot0=0$. Si en una
  multiplicación larga aparece un "$\cdot0$", ya sabes que el resultado final es cero, sin
  necesidad de calcular el resto.
explicacion_formal: |
  Para todo $a \in \mathbb{Z}$: $a \cdot 0 = 0 \cdot a = 0$. Se deduce de la propiedad
  distributiva: como $a\cdot(0+0)=a\cdot0+a\cdot0$ y también $a\cdot(0+0)=a\cdot0$, al
  restar $a\cdot0$ de ambos lados se obtiene $a\cdot0=0$.
definiciones_clave: |
  **Elemento absorbente**: en la multiplicación de $\mathbb{Z}$, es el cero: cualquier
  factor multiplicado por él da siempre cero.
propiedades_relaciones: |
  Si una cadena de multiplicaciones incluye al menos un factor cero, el producto total es
  cero sin importar cuántos ni cuáles sean los demás factores.
ejemplo_guiado:
  enunciado: "Calcula $(-34) \\cdot 19 \\cdot 0 \\cdot (-7)$."
  pasos:
    - "Se observa que uno de los factores es $0$."
    - "Por la propiedad del absorbente, no hace falta calcular el resto."
    - "El resultado es $0$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el resultado de multiplicar cualquier entero por cero?"
    choices:
      - {text: "El mismo entero", is_correct: false}
      - {text: "Siempre cero", is_correct: true}
      - {text: "El opuesto del entero", is_correct: false}
      - {text: "Depende del signo del entero", is_correct: false}
    explanation: "La correcta es Siempre cero: el cero es el elemento absorbente de la multiplicación."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $(-8) \\cdot 0 \\cdot 500$?"
    choices:
      - {text: "$0$", is_correct: true}
      - {text: "$-4000$", is_correct: false}
      - {text: "$4000$", is_correct: false}
      - {text: "No se puede calcular", is_correct: false}
    explanation: "La correcta es $0$: basta con que un factor sea cero para que todo el producto sea cero."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Examina la expresión matemática y busca si existe una operación de multiplicación donde uno de los factores sea $0$.'
  - 'Paso 2: Aplica la propiedad del elemento absorbente multiplicativo: reduce cualquier multiplicación de la forma $a \cdot 0$ o $0 \cdot a$ directamente a $0$.'
  - 'Paso 3: Si se trata de una multiplicación de varios factores consecutivos y uno de ellos es cero, concluye inmediatamente que el producto final es $0$.'
errores_correccion: |
  Un error frecuente es confundir el elemento absorbente ($a\cdot0=0$) con el elemento
  neutro de la adición ($a+0=a$); son propiedades de operaciones distintas. Otro error es
  recorrer cálculos largos sin notar que hay un cero como factor, perdiendo tiempo.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Calcula el resultado de la siguiente expresión: $(-15) \cdot 24 \cdot (-8) \cdot 0 \cdot 54$'
    alternativas:
      - "$0$"
      - "$-155520$"
      - "$155520$"
    respuesta: "$0$"
    solucion_pasos:
      - 'Paso a: Analizamos la expresión y observamos que todos los términos están conectados por multiplicaciones.'
      - 'Paso b: Identificamos que uno de los factores es el número $0$.'
      - 'Paso c: Aplicando la propiedad del elemento absorbente de la multiplicación, no es necesario calcular las otras multiplicaciones. El resultado total es $0$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve la expresión $5 \cdot (3 - 3) \cdot (-12)$.'
    alternativas:
      - "$0$"
      - "$-180$"
      - "$180$"
    respuesta: "$0$"
    solucion_pasos:
      - 'Paso a: Primero resolvemos el paréntesis: $3 - 3 = 0$.'
      - 'Paso b: Reemplazamos en la expresión original, quedando $5 \cdot 0 \cdot (-12)$.'
      - 'Paso c: Como uno de los factores es $0$ en una cadena de multiplicación, el resultado final es $0$.'
  - titulo: '¿Es cero el resultado de multiplicar un número entero positivo muy grande por cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Por la propiedad del elemento absorbente, cualquier entero $a \cdot 0 = 0$.'
      - 'No importa cuán grande sea el valor absoluto del entero positivo, el resultado siempre será $0$.'
  - titulo: '¿Se aplica la propiedad del elemento absorbente si sumamos un número con cero?'
    respuesta: 'No'
    solucion_pasos:
      - 'La propiedad absorbente del cero aplica exclusivamente a la multiplicación.'
      - 'En la adición, el cero es el elemento neutro (ej: $5 + 0 = 5$).'
errores_frecuentes:
  - 'Creer que $a \cdot 0 = a$, confundiendo el elemento absorbente de la multiplicación con el elemento neutro de la adición.'
  - 'Realizar cálculos largos de multiplicaciones complejas sin notar que hay un cero como factor multiplicativo al final.'
  - 'Asumir que si multiplicamos un número negativo por cero, el resultado debe conservar el signo negativo (escribir $-0$ en lugar de $0$).'
  - 'Creer que la propiedad del elemento absorbente también aplica para la división (la división por cero está indefinida).'
  - 'Aplicar la absorción en sumas, reduciendo expresiones como $12 + 0$ a $0$.'
afirmaciones_verdaderas:
  - "Cualquier número multiplicado por 0 da 0."
  - "El 0 es el elemento absorbente de la multiplicación."
al_terminar_debes_poder: |
  Reconocer de inmediato que una multiplicación con un factor cero da cero, sin necesidad
  de calcular los demás factores.
fuente: "Matemática 7° Básico Tomo 1 — Enteros, p. 39"
estado: publicado
