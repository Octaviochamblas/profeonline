semantic_id: MAT.NUM.ENTEROS_OPERATORIA.ABSORBENTE_CERO
resumen_inicial: 'El cero es el elemento absorbente de la multiplicación: $a \cdot 0 = 0$ para todo entero $a \in \mathbb{Z}$.'
explicacion_simple: 'El número cero actúa como un imán absorbente en la multiplicación: cualquier número entero, sin importar qué tan grande o pequeño sea ni qué signo tenga, al ser multiplicado por cero se convierte automáticamente en cero.


  ![Elemento absorbente de la multiplicación (el cero)](/static/img/nodos/elemento-absorbente-de-la-multiplicacion-el-cero-intro.svg)'
explicacion_formal: 'Para todo entero $a \in \mathbb{Z}$, la **Propiedad del Elemento Absorbente** de la multiplicación establece que:


  $$a \cdot 0 = 0 \cdot a = 0$$


  **Desglose de la fórmula:**

  - $a \cdot 0$: Producto del entero $a$ por el factor cero.

  - $= 0$: Anulación total del producto, produciendo el escalar cero.


  > **Complemento didáctico:** Multiplicar por cero anula cualquier cantidad o acumulación, resultando siempre en la ausencia de magnitud $0$.'
definiciones_clave: '- **Elemento absorbente**: El número $0$, que anula cualquier producto haciéndolo igual a cero.'
propiedades_relaciones: '- **Producto nulo**: Si $a \cdot b = 0$, entonces $a = 0$ o $b = 0$ (Propiedad del producto cero).'
ejemplo_guiado:
  enunciado: 'Calcule el producto $(-158) \cdot 0$ e indique la propiedad aplicada.


    ![Ejemplo Elemento absorbente de la multiplicación (el cero)](/static/img/nodos/elemento-absorbente-de-la-multiplicacion-el-cero-ejemplos.svg)'
  pasos:
  - 'Paso 1: Reconocer la presencia del factor cero en la multiplicación.'
  - 'Paso 2: Aplicar la propiedad del elemento absorbente: $(-158) \cdot 0 = 0$.'
  - 'Conclusión: El resultado es $0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de la multiplicación (-45) · 0?
  choices:
  - text: '0'
    is_correct: true
  - text: '-45'
    is_correct: false
  - text: '45'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '0', por la propiedad del elemento absorbente.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado (-158) · 0, ¿cuál es el producto resultante?
  choices:
  - text: '0'
    is_correct: true
  - text: '-158'
    is_correct: false
  - text: '158'
    is_correct: false
  - text: '-1'
    is_correct: false
  explanation: La alternativa correcta es '0'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si uno de los factores de la multiplicación es el cero.'
- 'Paso 2: Anular el producto de manera directa.'
- 'Paso 3: Escribir como resultado final el entero $0$.'
errores_correccion: '- **Error 1: Pensar que $(-5) \cdot 0 = -5$ conservando el número.** **Cómo corregirlo:** La multiplicación por cero anula el factor produciendo 0 ($a \cdot 0 = 0$).


  - **Error 2: Confundir multiplicación por cero con adición con cero ($a + 0 = a$).** **Cómo corregirlo:** La adición conserva el número ($a+0=a$); la multiplicación lo anula ($a \cdot 0 = 0$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $125 \cdot (-4) \cdot 0 \cdot 8$.
  alternativas:
  - '0'
  - '-4000'
  - '4000'
  respuesta: '0'
  solucion_pasos:
  - La presencia de un factor cero en la cadena de multiplicación anula el producto total a 0.
- titulo: Ejemplo 2
  enunciado: Si $a \cdot b = 0$ y $a = -9$, ¿cuál es el valor de $b$?
  alternativas:
  - '0'
  - '9'
  - '-9'
  respuesta: '0'
  solucion_pasos:
  - Dado que $a \neq 0$, obligatoriamente $b = 0$.
- titulo: ¿Es cierto que el producto de cualquier entero por cero es siempre igual a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, el cero es el elemento absorbente de la multiplicación.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con las reglas formales de operatoria y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación estricta de las reglas de signos y jerarquía conduce a un único resultado determinado.
  - texto: El cálculo no está definido en ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es completamente cerrada y válida en el conjunto de los enteros.
- titulo: ¿Multiplicar un entero negativo por cero da como resultado un número negativo?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado es el entero neutro 0 (sin signo).
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con las reglas formales de operatoria y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la aplicación estricta de las reglas de signos y jerarquía conduce a un único resultado determinado.
  - texto: El cálculo no está definido en ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es completamente cerrada y válida en el conjunto de los enteros.
errores_frecuentes:
- Multiplicar un número entero negativo por cero da como resultado un entero negativo.
- El elemento absorbente de la multiplicación en los enteros es el número 1.
- Multiplicar cualquier número entero por cero conserva intacto el valor del entero.
- La propiedad del elemento absorbente exige que el factor cero esté colocado a la derecha.
- El producto de varios enteros donde hay un cero resulta en la suma de los demás números.
afirmaciones_verdaderas:
- El cero es el elemento absorbente de la multiplicación en $\mathbb{Z}$, cumpliendo $a \cdot 0 = 0$.
- Si el producto de dos enteros es cero, al menos uno de los factores debe ser cero.
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad del elemento absorbente de la multiplicación y el teorema del producto cero.


  **CÓMO:** Anulando productos mediante $a \cdot 0 = 0 \cdot a = 0$ y aplicando la propiedad $a \cdot b = 0 \implies a = 0 \lor b = 0$ en la resolución de ecuaciones.


  ![Resumen Elemento absorbente de la multiplicación (el cero)](/static/img/nodos/elemento-absorbente-de-la-multiplicacion-el-cero-resumen.svg)'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
