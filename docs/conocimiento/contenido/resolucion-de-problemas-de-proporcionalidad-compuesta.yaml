resumen_inicial: La resolución de problemas de proporcionalidad compuesta en contexto
  aplica la identificación previa del carácter directo o inverso de cada magnitud
  para calcular valores reales desconocidos.
explicacion_simple: Para resolver problemas de la vida diaria o de pruebas como la
  PAES (obras, producción, transporte, consumos), organizamos una tabla con los datos,
  clasificamos cada columna como directa o inversa respecto a la incógnita y multiplicamos
  las razones correspondientes.
explicacion_formal: 'Para un problema contextual compuesto con magnitudes $\{A, B,
  C, D\}$, la **Metodología de Resolución Integrada** requiere:


  1. Organización matricial de datos en Estado 1 y Estado 2.

  2. Clasificación pareada de $B, C, D$ respecto a la incógnita $A$.

  3. Planteamiento de la ecuación $A_2 = A_1 \cdot \prod \text{Factores}$.

  4. Verificación de coherencia dimensional y magnitudes físicas.'
definiciones_clave: '- **Resolución de problema compuesto**: Algoritmo integral de
  4 pasos para resolver magnitudes combinadas.'
propiedades_relaciones: '- **Metodología matricial**: Estructuración ordenada de datos
  por estados inicial y final.'
ejemplo_guiado:
  enunciado: Si $5$ impresoras funcionando $6\text{ horas/día}$ imprimen $3.000$ libros
    en $4\text{ días}$, ¿cuántos días tardarán $8$ impresoras trabajando $5\text{
    horas/día}$ en imprimir $4.000$ libros?
  pasos:
  - 'Paso 1: Incógnita: Días ($X_1 = 4$). Clasificar respecto a Días:

    - Impresoras: a más impresoras, menos días $\implies$ INVERSA ($5/8$).

    - Horas/día: a más horas/día, menos días $\implies$ INVERSA ($6/5$).

    - Libros: a más libros, más días $\implies$ DIRECTA ($4.000 / 3.000 = 4/3$).'
  - 'Paso 2: Armar la ecuación: $X_2 = 4 \cdot \left(\frac{5}{8}\right) \cdot \left(\frac{6}{5}\right)
    \cdot \left(\frac{4}{3}\right)$.'
  - 'Paso 3: Simplificar factores: $X_2 = 4 \cdot \frac{5 \cdot 6 \cdot 4}{8 \cdot
    5 \cdot 3} = 4 \cdot \frac{120}{120} = 4 \cdot 1 = 4\text{ días}$.'
  - 'Conclusión: Tardarán exactamente $4$ días.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el primer paso metodológico para resolver un problema de proporcionalidad
    compuesta en contexto?
  choices:
  - text: Organizar la tabla de datos y clasificar cada magnitud como directa o inversa
      con la incógnita
    is_correct: true
  - text: Sumar todos los números del problema
    is_correct: false
  - text: Multiplicar todos los datos sin analizar sus relaciones
    is_correct: false
  - text: Dividir la primera columna entre la última
    is_correct: false
  explanation: La alternativa correcta es 'Organizar la tabla de datos y clasificar
    cada magnitud como directa o inversa con la incógnita'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado de los libros e impresoras, ¿cuántos días tardaron
    las 8 impresoras?
  choices:
  - text: 4 días
    is_correct: true
  - text: 8 días
    is_correct: false
  - text: 5 días
    is_correct: false
  - text: 10 días
    is_correct: false
  explanation: La alternativa correcta es '4 días'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de resolver problemas complejos de
  proporcionalidad compuesta organizando la matriz de datos y aplicando el producto
  de razones directas e inversas.
semantic_id: MAT.NUM.PROP_COMPUESTA.PROBLEMAS_CONTEXTO
procedimiento:
- 'Paso 1: Identificar la variable incógnita y comparar individualmente cada magnitud
  auxiliar con ella (fijando las demás).'
- 'Paso 2: Clasificar cada magnitud como directamente proporcional (mantener razón)
  o inversamente proporcional (invertir razón).'
- 'Paso 3: Formar la ecuación generalizada y calcular la respuesta reduciendo los
  factores multiplicativos.'
errores_correccion: '- **Error 1: Comparar las magnitudes auxiliares entre sí en lugar
  de compararlas con la variable incógnita.** **Cómo corregirlo:** La comparación
  de proporcionalidad directa o inversa se DEBE hacer siempre respecto a la columna
  de la INCÓGNITA.


  - **Error 2: No invertir la razón de las magnitudes inversas al armar la fórmula.**
  **Cómo corregirlo:** Las magnitudes inversas cambian su posición $\frac{a_1}{a_2}
  \to \frac{a_2}{a_1}$ al multiplicar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_COMPUESTA.PROBLEMAS_CONTEXTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las leyes de proporcionalidad compuesta.
- titulo: Ejemplo 2
  enunciado: Verificación de la fórmula del producto de razones.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por producto de razones.
- titulo: ¿Se invierten las razones de las magnitudes inversas en la fórmula generalizada?
  respuesta: Sí
  solucion_pasos:
  - Sí, para compensar la variación inversamente proporcional.
- titulo: ¿Es necesario congelar las otras variables al clasificar una magnitud?
  respuesta: Sí
  solucion_pasos:
  - Sí, para aislar el efecto puro de esa variable sobre la incógnita.
errores_frecuentes:
- Comparar dos magnitudes auxiliares entre sí en lugar de analizar su relación individual
  con la incógnita.
- Mantener sin invertir la fracción correspondiente a una magnitud de relación inversamente
  proporcional.
- Multiplicar todos los datos numéricos del problema sin distinguir su carácter directo
  o inverso.
- Omitir congelar mentalmente las demás variables al determinar si una relación es
  directa o inversa.
- Declarar que si participan más de tres variables la relación es siempre directamente
  proporcional.
afirmaciones_verdaderas:
- La proporcionalidad compuesta combina tres o más magnitudes analizando la relación
  directa o inversa de cada una con la incógnita.
- En la fórmula generalizada de resolución, la razón de una magnitud inversa se invierte
  respecto a su estado inicial.
