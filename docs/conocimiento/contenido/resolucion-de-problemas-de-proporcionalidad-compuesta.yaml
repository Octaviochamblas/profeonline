semantic_id: MAT.NUM.PROP_COMPUESTA.PROBLEMAS_CONTEXTO
resumen_inicial: 'Resolución de problemas de proporcionalidad compuesta: concepto y propiedades
  fundamentales en Proporcionalidad compuesta.'
explicacion_simple: 'Ya tienes todas las herramientas: sabes identificar las variables, ver
  si son directas o inversas, y armar la ecuación. Ahora pondremos a prueba tu destreza con
  problemas reales de fábricas, viajes y presupuestos.'
explicacion_formal: "En los problemas de contexto extenso, el mayor desafío es la **extracción\
  \ de datos**. \n1. Haz una tabla donde las columnas sean las variables y las filas sean\
  \ los 'Escenarios' (el escenario de datos conocidos y el de la incógnita).\n2. Siempre deja\
  \ la columna de la incógnita al final o al principio para aislarla fácilmente.\n3. Revisa\
  \ las unidades: si el tiempo inicial está en horas y el final en minutos, ¡debes convertirlos\
  \ antes de operar!"
definiciones_clave: '- **Resolución de problemas de proporcionalidad compuesta**: Elemento
  central dentro del estudio de Proporcionalidad compuesta.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a resolución de problemas de proporcionalidad compuesta.'
ejemplo_guiado:
  enunciado: 5 máquinas producen 300 piezas en 6 horas. ¿Cuántas horas demorarán 3 máquinas
    en producir 450 piezas?
  pasos:
  - 'Identifico la incógnita: horas. Horas respecto a máquinas es inversa; horas respecto
    a piezas es directa.'
  - 'Planteo la ecuación: 6 dividido entre x es igual a (3 dividido entre 5, invertida) por
    (450 dividido entre 300, directa).'
  - 'Calculo: 6/x es igual a (3/5) por (3/2), es decir 9/10; despejo x: 6 por 10 es igual
    a 9 por x; 60 es igual a 9x; x es aproximadamente 6,67 horas.'
