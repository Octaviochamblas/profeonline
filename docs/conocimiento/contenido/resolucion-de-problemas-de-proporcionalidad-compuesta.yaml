procedimiento:
- 'Paso 1: Extrae los datos y arma una tabla limpia.'
- 'Paso 2: Comprueba unidades (ej: que todos los tiempos estén en la misma medida).'
- 'Paso 3: Aplica el método de igualación de fracciones o la fórmula generalizada
  para obtener el resultado.'
errores_correccion: Evita confundir los datos de entrada al operar con resolución
  de problemas de proporcionalidad compuesta.
ejemplos:
- titulo: Transporte de mercancía
  enunciado: 3 camiones transportan 12 toneladas en 6 viajes. ¿Cuántos viajes harán
    4 camiones para transportar 16 toneladas?
  solucion_pasos:
  - 'Incógnita: Viajes ($x$). Variables: Camiones, Toneladas.'
  - 'Viajes vs Camiones: Inversa (más camiones, menos viajes). Viajes vs Toneladas:
    Directa (más toneladas, más viajes).'
  - 'Fracción Viajes: $6/x$. Fracción Camiones (invierte): $4/3$. Fracción Toneladas
    (mantiene): $12/16 = 3/4$.'
  - 'Ecuación: $6/x = (4/3) \cdot (3/4) = 1$.'
  - $6/x = 1 \implies x = 6$ viajes.
errores_frecuentes:
- Operar con unidades mixtas (meses y días, kilos y toneladas) sin convertirlas.
- Confundirse al momento de despejar $x$ cuando queda en el denominador.
- Armar mal la tabla cruzando datos de la primera oración con la segunda.
afirmaciones_verdaderas:
- La propiedad de resolución de problemas de proporcionalidad compuesta preserva la
  consistencia lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren resolución de
  problemas de proporcionalidad compuesta.
