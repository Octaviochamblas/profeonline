procedimiento:
- 'Paso 1: Extrae los datos y arma una tabla limpia.'
- 'Paso 2: Comprueba unidades (ej: que todos los tiempos estén en la misma medida).'
- 'Paso 3: Aplica el método de igualación de fracciones o la fórmula generalizada para obtener
  el resultado.'
errores_correccion: Evita confundir los datos de entrada al operar con resolución de problemas
  de proporcionalidad compuesta.
ejemplos:
- titulo: Transporte de mercancía
  enunciado: 3 camiones transportan 12 toneladas en 6 viajes. ¿Cuántos viajes harán 4 camiones
    para transportar 16 toneladas?
  solucion_pasos:
  - 'Incógnita: Viajes ($x$). Variables: Camiones, Toneladas.'
  - 'Viajes vs Camiones: Inversa (más camiones, menos viajes). Viajes vs Toneladas: Directa
    (más toneladas, más viajes).'
  - 'Fracción Viajes: $6/x$. Fracción Camiones (invierte): $4/3$. Fracción Toneladas (mantiene):
    $12/16 = 3/4$.'
  - 'Ecuación: $6/x = (4/3) \cdot (3/4) = 1$.'
  - $6/x = 1 \implies x = 6$ viajes.
- titulo: Ejemplo 2
  enunciado: 3 camiones transportan 12 toneladas en 6 viajes. ¿Cuántos viajes harán 4 camiones
    para transportar 16 toneladas?
  alternativas:
  - '6'
  - '8'
  - 4,5
  respuesta: '6'
  solucion_pasos:
  - 6/x es igual a (4/3) por (3/4), que es igual a 1; despejando, x es igual a 6.
- titulo: Ejemplo 3
  enunciado: 2 pintores pintan 40 m² en 5 días. ¿Cuántos días demorarán 4 pintores en pintar
    80 m²?
  alternativas:
  - '5'
  - '10'
  - 2,5
  respuesta: '5'
  solucion_pasos:
  - 5/x es igual a (2/4, invertida) por (80/40), es decir (1/2) por 2, que es igual a 1; despejando,
    x es igual a 5.
- titulo: ¿Es necesario convertir las unidades antes de operar si el problema mezcla horas
    y minutos?
  respuesta: Sí
  solucion_pasos:
  - Operar con unidades distintas sin convertir produce un resultado incorrecto.
errores_frecuentes:
- Operar con unidades mixtas (meses y días, kilos y toneladas) sin convertirlas.
- Confundirse al momento de despejar $x$ cuando queda en el denominador.
- Armar mal la tabla cruzando datos de la primera oración con la segunda.
- Operar con unidades mixtas, como meses y días, o kilos y toneladas, sin convertirlas primero.
- Armar mal la tabla de datos, mezclando valores de la situación inicial con los de la situación
  final.
afirmaciones_verdaderas:
- La propiedad de resolución de problemas de proporcionalidad compuesta preserva la consistencia
  lógica.
- Antes de operar en un problema de proporcionalidad compuesta, se deben revisar y convertir
  las unidades para que todas las magnitudes estén expresadas de la misma forma.
al_terminar_debes_poder: Resolver problemas aplicados que involucren resolución de problemas
  de proporcionalidad compuesta.
