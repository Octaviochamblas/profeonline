procedimiento:
- 'Paso 1: Organizar el enunciado en una tabla con encabezados claros y unidades uniformes.'
- 'Paso 2: Determinar si cada columna es Directa (D) o Inversa (I) respecto a la incógnita mediante ceteris paribus.'
- 'Paso 3: Formular la proporción $\frac{A_1}{x} = \prod R_D \cdot \prod R_I$ y simplificar las fracciones.'
- 'Paso 4: Despejar $x$ y redactar la respuesta con su unidad de medida y verificación contextual.'
errores_correccion: '- **Error 1: Mezclar unidades (ej: días con semanas).** **Cómo corregirlo:** Convertir semanas a días ($1\text{ sem} = 7\text{ d}$) antes de construir la tabla.

  - **Error 2: No validar el sentido del resultado.** **Cómo corregirlo:** Revisar lógicamente: ¿si aumentaron los obreros y las horas, tiene sentido que tarden menos días? Si la respuesta es sí, el planteamiento es consistente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $4$ tractores aran $60\text{ ha}$ en $5\text{ días}$, ¿cuántos días tardan $6$ tractores en arar $90\text{ ha}$?
  alternativas:
  - $5\text{ días}$
  - $7,5\text{ días}$
  - $3,33\text{ días}$
  respuesta: $5\text{ días}$
  solucion_pasos:
  - $\frac{5}{x} = \frac{6}{4} \cdot \frac{60}{90} = \frac{3}{2} \cdot \frac{2}{3} = 1 \implies x = 5\text{ días}$.
- titulo: Ejemplo 2
  enunciado: 8 costureras hacen 160 camisas en 4 días trabajando 6 h/d. ¿Cuántas camisas hacen 10 costureras en 6 días trabajando 8 h/d?
  alternativas:
  - $500\text{ camisas}$
  - $400\text{ camisas}$
  - $320\text{ camisas}$
  respuesta: $500\text{ camisas}$
  solucion_pasos:
  - 'Incógnita Camisas ($C$ directa con todo): $\frac{160}{x} = \frac{8}{10} \cdot \frac{4}{6} \cdot \frac{6}{8} = \frac{4}{10} = \frac{2}{5} \implies x = \frac{160 \cdot 5}{2} = 400 \cdot \frac{5}{4} = 500\text{ camisas}$.'
- titulo: ¿Es indispensable homogeneizar las unidades de tiempo antes de operar?
  respuesta: Sí
  solucion_pasos:
  - Sí, operar unidades distintas como meses y días genera errores de escala de orden de magnitud.
  alternativas:
  - texto: Sí, todas las variables de la misma especie deben estar en la misma unidad
    es_correcta: true
    retroalimentacion: ¡Correcto! Homogeneidad dimensional obligatoria.
  - texto: No, la fórmula convierte las unidades automáticamente
    es_correcta: false
    retroalimentacion: Incorrecto, la matemática opera con números puros.
  - texto: No, se pueden mezclar horas y minutos libremente
    es_correcta: false
    retroalimentacion: Incorrecto, mezclar horas y minutos alteraría el resultado por factor 60.
- titulo: ¿Se pueden resolver problemas compuestos con todas las magnitudes directas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la proporcionalidad compuesta directa pura (todas las razones se mantienen $1/2$).
  alternativas:
  - texto: Sí, es el caso de proporcionalidad compuesta directa pura
    es_correcta: true
    retroalimentacion: ¡Correcto! Caso directo puro.
  - texto: No, al menos una debe ser inversa
    es_correcta: false
    retroalimentacion: Incorrecto, pueden ser todas directas o todas inversas.
  - texto: No, se convierte en proporción simple
    es_correcta: false
    retroalimentacion: Incorrecto, sigue siendo compuesta por tener $\ge 3$ variables.
errores_frecuentes:
- No homogeneizar unidades de medida entre estados.
- Clasificar incorrectamente una magnitud como directa siendo inversa.
- Cometer errores al despejar $x$ en la ecuación final.
- No revisar la coherencia física de la solución obtenida.
afirmaciones_verdaderas:
- El protocolo en 4 pasos garantiza una resolución sistemática y libre de errores.
- La homogeneización dimensional es el requisito previo fundamental.
- El resultado obtenido debe verificarse mediante un análisis de sentido común en contexto.
al_terminar_debes_poder: '![Síntesis de resolución de problemas compuestos](/static/img/nodos/resolucion-de-problemas-de-proporcionalidad-compuesta-resumen.svg)


  QUÉ: Resolver problemas contextuales complejos aplicando proporcionalidad compuesta directa, inversa o mixta.


  CÓMO: Siguiendo el protocolo de 4 pasos (tabla de datos homogeneizada, clasificación D/I ceteris paribus, planteamiento de la ecuación de razones y despeje simplificado con verificación de sentido común).'
