semantic_id: MAT.NUM.RAZONES_PROPORCIONES.COMPUESTA_PROBLEMAS
resumen_inicial: 'La resolución de problemas de proporcionalidad compuesta sigue un protocolo de cuatro pasos: organizar los datos en una tabla, determinar el tipo de relación (directa/inversa) de cada magnitud con la incógnita, formular la ecuación de razones y despejar el valor final con coherencia dimensional.'
explicacion_simple: "![Resolución de problemas compuestos](/static/img/nodos/resolucion-de-problemas-de-proporcionalidad-compuesta-intro.svg)\n\nPara resolver con éxito cualquier problema de **proporcionalidad compuesta**, aplica siempre este protocolo en 4 pasos:\n\n1. **Paso 1: Construir la tabla de datos**\n   - Escribe en columnas cada magnitud con sus unidades (asegúrate de que las unidades estén homogeneizadas, ej: todo en horas o todo en días).\n2. **Paso 2: Identificar el tipo de relación (D o I)**\n   - Compara cada magnitud con la columna de la incógnita (bajo *ceteris paribus*).\n3. **Paso 3: Armar la ecuación de proporciones**\n   - $\\frac{\\text{Incógnita}_1}{\\text{Incógnita}_2} = \\prod (\\text{Directas: } 1/2) \\cdot \\prod (\\text{Inversas: } 2/1)$.\n4. **Paso 4: Simplificar, despejar y validar**\n   - Despeja $x$ y comprueba que la respuesta tenga sentido lógico en el contexto del problema."
explicacion_formal: 'Sea un problema en contexto con magnitudes $\{M_0, M_1, \dots, M_n\}$ donde $M_0$ es la magnitud incógnita.


  **Protocolo Algorítmico Formal:**

  1. **Homogeneización Dimensional:**

  $$\forall j \in \{0, \dots, n\}, \quad [M_j^{(1)}] = [M_j^{(2)}]$$

  2. **Clasificación Funcional por Signo del Gradiente:**

  $$s_j = \operatorname{sgn}\left(\frac{\partial M_0}{\partial M_j}\right) \implies s_j = +1 \text{ (Directa)}, \quad s_j = -1 \text{ (Inversa)}$$

  3. **Construcción del Sistema de Razones:**

  $$\frac{M_0^{(1)}}{M_0^{(2)}} = \prod_{j=1}^{n} \left(\frac{M_j^{(1)}}{M_j^{(2)}}\right)^{s_j}$$

  4. **Solución Explícita y Validación:**

  $$x = M_0^{(2)} = M_0^{(1)} \cdot \prod_{j=1}^{n} \left(\frac{M_j^{(2)}}{M_j^{(1)}}\right)^{s_j}$$'
definiciones_clave: '- **Protocolo de 4 pasos**: Método estructurado para resolver problemas compuestos sin errores.

  - **Homogeneización dimensional**: Conversión de todas las magnitudes a unidades compatibles.

  - **Validación contextual**: Comprobación del sentido físico o económico del resultado numérico.'
propiedades_relaciones: '- **Robustez algorítmica**: Evita confusiones independientemente de la complejidad del enunciado.

  - **Universalidad**: Aplica a problemas de construcción, transporte, rendimiento agrícola, manufactura y finanzas.'
ejemplo_guiado:
  enunciado: '![Ejemplos de problemas compuestos](/static/img/nodos/resolucion-de-problemas-de-proporcionalidad-compuesta-ejemplos.svg)


    Si $6$ obreros trabajando $8\text{ h/día}$ tardan $10\text{ días}$ en pavimentar una calle, ¿cuántos días tardarán $10$ obreros trabajando $6\text{ h/día}$? Además, si transportar $5\text{ ton}$ a $200\text{ km}$ cuesta $\$80.000$, ¿cuánto costará transportar $8\text{ ton}$ a $300\text{ km}$?'
  pasos:
  - 'Paso 1: Para los obreros: Incógnita Días. Obreros es INVERSA ($\frac{10}{6}$) y Horas/día es INVERSA ($\frac{6}{8}$).'
  - 'Paso 2: Ecuación: $\frac{10}{x} = \left(\frac{10}{6}\right) \cdot \left(\frac{6}{8}\right) = \frac{10}{8} \implies x = 8\text{ días}$.'
  - 'Paso 3: Para el transporte: Incógnita Costo. Toneladas es DIRECTA ($\frac{5}{8}$) y Distancia es DIRECTA ($\frac{200}{300}$).'
  - 'Paso 4: Ecuación: $\frac{80000}{x} = \left(\frac{5}{8}\right) \cdot \left(\frac{2}{3}\right) = \frac{10}{24} \implies x = \frac{80000 \cdot 24}{10} = \$192.000$.'
