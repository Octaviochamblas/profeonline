semantic_id: MAT.NUM.PROP_COMPUESTA.PROBLEMAS_CONTEXTO
resumen_inicial: 'La resolución de problemas de proporcionalidad compuesta en contextos reales combina la organización tabular de datos, el análisis de tipo de relación por congelamiento de variables y el cálculo mediante la fórmula generalizada.'
explicacion_simple: |
  Para resolver cualquier problema real de proporcionalidad compuesta (como planificar obras de construcción, viajes de transporte, alimentación de ganadería o producción industrial), debes seguir 4 pasos ordenados:
  1. Armar una tabla clara con las magnitudes y sus datos.
  2. Identificar la columna que tiene la X (incógnita).
  3. Comparar cada columna contra la X para marcar si es **Directa (D)** o **Inversa (I)**.
  4. Armar la ecuación multiplicando la X inicial por los factores Directos normales y los Inversos al revés.
explicacion_formal: |
  ### Definición formal
  Un **problema de proporcionalidad compuesta en contexto real** es aquel en el que $n$ magnitudes físicas, económicas o industriales $(X_1, X_2, \dots, X_{n-1}, Y)$ varían simultáneamente según la ley multiplicativa general:
  $$Y^{(2)} = Y^{(1)} \cdot \prod_{a \in \text{Directas}} \left(\frac{X_a^{(2)}}{X_a^{(1)}}\right) \cdot \prod_{b \in \text{Inversas}} \left(\frac{X_b^{(1)}}{X_b^{(2)}}\right)$$

  ### Algoritmo Maestro de Resolución
  1. **Matriz de datos de dos estados**:
     $$\begin{array}{ccccc} X_1 & X_2 & \dots & X_{n-1} & Y (\text{Incógnita}) \\ \hline X_1^{(1)} & X_2^{(1)} & \dots & X_{n-1}^{(1)} & Y^{(1)} \\ X_1^{(2)} & X_2^{(2)} & \dots & X_{n-1}^{(2)} & Y^{(2)} = x \end{array}$$
  2. **Identificación de relaciones por aislamiento (Ceteris Paribus)**:
     - Evaluar la pareja $(X_j, Y)$ congelando las demás variables.
     - Asignar etiqueta **D** o **I** a la columna $X_j$.
  3. **Planteamiento de la ecuación de razones**:
     $$x = Y^{(1)} \cdot \left(\text{Factores } D\right) \cdot \left(\text{Factores } I \text{ invertidos}\right)$$
  4. **Cálculo, simplificación y verificación de coherencia práctica**.

  ### Ámbitos típicos de evaluación
  - **Construcción y obras públicas**: Obreros, horas/día, días, metros cuadrados / cúbicos.
  - **Transporte de carga**: Camiones, capacidad (toneladas), viajes, días.
  - **Alimentación ganadera**: Animales, raciones diarias, días de suministro, masa total.

  ### Síntesis didáctica
  - Método: Tabla $\to$ Clasificación (D/I) $\to$ Ecuación de razones $\to$ Resultado.
definiciones_clave: |
  - **Matriz de datos de estados**: Tabla ordenada con dos filas que contiene los datos conocidos y la incógnita del problema.
  - **Etiquetado de relaciones (D/I)**: Asignación de la propiedad Directa o Inversa a cada magnitud frente a la incógnita.
  - **Coherencia práctica**: Criterio de validación que exige comprobar si la respuesta obtenida tiene sentido en el mundo real.
propiedades_relaciones: |
  - **Robustez del algoritmo**: El método tabular de razones funciona idénticamente sin importar cuántas magnitudes independientes se agreguen al problema.
  - **Sensibilidad al cambio de escala**: Si todas las magnitudes independientes directas se duplican y las inversas se mantienen, la incógnita resulta multiplicada por $2^m$.
ejemplo_guiado:
  enunciado: 'Para pavimentar un camino, $8$ trabajadores laborando $6\text{ horas/día}$ pavimentan $400\text{ metros}$ en $10\text{ días}$. ¿Cuántos días ($Y$) tardarán $12$ trabajadores laborando $8\text{ horas/día}$ en pavimentar $800\text{ metros}$?'
  pasos:
    - 'Paso 1: Construimos la tabla de datos identificando la incógnita $Y$ en la columna Días:\n- Trabajadores: $8 \to 12$\n- Horas/día: $6 \to 8$\n- Metros: $400 \to 800$\n- Días ($Y$): $10 \to x$'
    - 'Paso 2: Clasificamos cada variable respecto a los Días:\n- Trabajadores (Inversa): a más trabajadores, menos días $\implies$ Factor $\frac{8}{12}$.\n- Horas/día (Inversa): a más horas diarias, menos días $\implies$ Factor $\frac{6}{8}$.\n- Metros (Directa): a más metros por pavimentar, más días $\implies$ Factor $\frac{800}{400} = 2$.'
    - 'Paso 3: Formamos la ecuación generalizada:\n$$x = 10 \cdot \frac{8}{12} \cdot \frac{6}{8} \cdot \frac{800}{400}$$'
    - 'Paso 4: Simplificamos los factores: $x = 10 \cdot \frac{8 \cdot 6 \cdot 800}{12 \cdot 8 \cdot 400} = 10 \cdot \frac{38.400}{38.400} = 10 \cdot 1 = 10\text{ días}$. Tardarán **10 días**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el primer paso recomendado en el algoritmo maestro para resolver un problema real de proporcionalidad compuesta?'
    choices:
      - {text: 'Organizar todos los datos conocidos y la incógnita en una tabla ordenada de dos filas de estados', is_correct: true}
      - {text: 'Multiplicar todos los números del enunciado sin orden alguno', is_correct: false}
      - {text: 'Dividir la respuesta esperada entre diez', is_correct: false}
      - {text: 'Restar los datos del segundo estado a los del primero', is_correct: false}
    explanation: 'La alternativa correcta es ''Organizar todos los datos conocidos y la incógnita en una tabla ordenada de dos filas de estados''. Es el primer paso del algoritmo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en un problema de transporte se duplica el número de camiones (inversa) y también se duplica la distancia a recorrer (directa), ¿qué ocurre con el número de días necesarios?'
    choices:
      - {text: 'El número de días se mantiene igual, pues los factores de razón $1/2$ y $2/1$ se cancelan ($x \cdot \frac{1}{2} \cdot \frac{2}{1} = x$)', is_correct: true}
      - {text: 'El número de días se quadruplica', is_correct: false}
      - {text: 'El número de días se reduce a la cuarta parte', is_correct: false}
      - {text: 'El número de días se vuelve cero', is_correct: false}
    explanation: 'La alternativa correcta es ''El número de días se mantiene igual, pues los factores de razón $1/2$ y $2/1$ se cancelan ($x \cdot \frac{1}{2} \cdot \frac{2}{1} = x$)''. Los efectos opuestos se anulan.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Armar la tabla de datos colocando las magnitudes en columnas y los dos estados en filas.'
  - 'Paso 2: Marcar la columna que contiene la incógnita $X$.'
  - 'Paso 3: Analizar cada columna independiente con la incógnita congelando las demás y etiquetar con D (Directa) o I (Inversa).'
  - 'Paso 4: Plantear la fórmula $x = \text{Dato Inicial} \cdot \prod \text{Factores } D \cdot \prod \text{Factores } I \text{ invertidos}$, resolver y comprobar coherencia.'
errores_correccion: |
  - **Error 1:** Resolver el problema usando solo dos variables e ignorar las demás magnitudes indicadas en el enunciado. **Cómo corregirlo:** Asegúrate de incluir **absolutamente todas las variables nombradas** en la tabla y en la fórmula generalizada.
  - **Error 2:** No verificar la coherencia física del resultado final. **Cómo corregirlo:** Si agregaste más obreros y más horas de trabajo, la cantidad de días calculada **debe ser menor**; si resultó mayor, revisa el etiquetado D/I.
ejemplos:
  - titulo: 'Problema de raciones en campamento'
    enunciado: 'Si $50$ personas consumen $100\text{ kg}$ de comida en $4$ días, ¿cuántos días durarán $200\text{ kg}$ de comida para $100$ personas?'
    alternativas:
      - 'Durarán 4 días'
      - 'Durarán 8 días'
      - 'Durarán 2 días'
    respuesta: 'Durarán 4 días'
    solucion_pasos:
      - '1. Tabla: Personas ($50 \to 100$, Inversa $\implies 50/100$), Comida ($100 \to 200$, Directa $\implies 200/100$).'
      - '2. Ecuación: $x = 4 \cdot \frac{50}{100} \cdot \frac{200}{100} = 4 \cdot 0.5 \cdot 2 = 4\text{ días}$.'
  - titulo: 'Problema de excavación de zanjas'
    enunciado: 'Si 4 obreros hacen 40m en 2 días, ¿8 obreros harán 80m en 2 días?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Se duplican obreros y se duplica la zanja, el tiempo se mantiene en 2 días.'
  - titulo: 'Problema de bombas de agua y estanque'
    enunciado: 'Si 3 bombas vacían 600L en 3 horas, ¿cuántas horas tardarán 6 bombas en vaciar 1.200L?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $x = 3 \cdot \frac{3}{6} \cdot \frac{1.200}{600} = 3 \cdot 0.5 \cdot 2 = 3\text{ horas}$.'
  - titulo: 'Validación por sentido común'
    enunciado: 'Si al duplicar los recursos la incógnita calculada disminuye a la mitad como se esperaba, ¿el resultado es físicamente coherente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Confirma la correcta aplicación de las relaciones inversas.'
errores_frecuentes:
  - 'Las magnitudes secundarias del enunciado se pueden descartar libremente de la tabla de datos.'
  - 'Clasificar incorrectamente una columna como directa cuando corresponde a una relación inversa.'
  - 'Aceptar resultados numéricos incoherentes en el contexto real sin revisar los factores de razón.'
  - 'Multiplicar las columnas en diagonal sin distinguir entre variables directas e inversas.'
  - 'Mezclar unidades de medida incompatibles en una misma columna de la tabla.'
afirmaciones_verdaderas:
  - 'La resolución de problemas de proporcionalidad compuesta requiere clasificar cada variable frente a la incógnita mediante el principio de congelamiento.'
  - 'El resultado de un problema compuesto en contexto real se calcula multiplicando el dato inicial de la incógnita por las razones directas e inversas invertidas.'
al_terminar_debes_poder: 'Resolver problemas de proporcionalidad compuesta en contexto real aplicando el algoritmo maestro de tabla, clasificación y fórmula generalizada.'
