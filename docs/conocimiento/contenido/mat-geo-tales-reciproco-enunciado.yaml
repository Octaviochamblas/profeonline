semantic_id: MAT.GEO.TEOREMA_TALES.RECIPROCO_ENUNCIADO
resumen_inicial: 'Enunciado del recíproco del teorema de Tales: conceptos, teoremas,
  propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: El teorema de Tales dice que el paralelismo implica proporcionalidad.
  Pero, ¿es cierto también el camino inverso? El recíproco del teorema responde esta
  pregunta.
explicacion_formal: '![Recíproco del teorema de Tales](/static/img/geometria/congruencia-semejanza/tales-reciproco-enunciado.svg)


  ### Definición formal


  Si $D\in AB$, $E\in AC$ y $\frac{AD}{DB}=\frac{AE}{EC}$, entonces $DE\parallel BC$.
  Este es el enunciado recíproco (inverso) del teorema directo de Tales.


  ### Desarrollo didáctico


  Mientras el teorema directo va de "paralelismo" a "proporcionalidad", el recíproco
  va de "proporcionalidad" a "paralelismo": ambos son igual de válidos y útiles, pero
  se usan en situaciones distintas según qué información se tiene y qué se quiere
  demostrar.'
definiciones_clave: '- **Enunciado del recíproco del teorema de Tales**: Elemento
  o propiedad fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a enunciado del recíproco del teorema de tales.'
ejemplo_guiado:
  enunciado: En la aplicación de enunciado del recíproco del teorema de tales, se
    establece una razón $k = 2.8$ entre dos figuras homólogas de longitud original
    $L = 25\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de enunciado del recíproco del teorema de tales.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 2.8 \cdot 25$.'
  - Concluir que la medida obtenida en enunciado del recíproco del teorema de tales
    es $L' = 70.0\text{ cm}$.
