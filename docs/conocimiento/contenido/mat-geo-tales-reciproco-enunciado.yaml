procedimiento:
- 'Paso 1: Verifica que se cumpla la proporción AD/DB = AE/EC entre los segmentos
  dados.'
- 'Paso 2: Si la proporción se cumple exactamente, concluye que DE es paralela a BC.'
- 'Paso 3: Si la proporción no se cumple, DE no es paralela a BC.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con enunciado del recíproco del teorema de tales.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de enunciado del recíproco del teorema de tales
    para determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando enunciado del recíproco del teorema de tales.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de enunciado del recíproco del teorema
    de tales y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de enunciado del recíproco del teorema de tales.
- titulo: ¿Se cumple siempre la propiedad principal de enunciado del recíproco del
    teorema de tales en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede enunciado del recíproco del teorema de tales asumir un valor negativo
    cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en enunciado del recíproco del teorema
  de tales.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en enunciado del
  recíproco del teorema de tales.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en enunciado del
  recíproco del teorema de tales.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de enunciado
  del recíproco del teorema de tales.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
