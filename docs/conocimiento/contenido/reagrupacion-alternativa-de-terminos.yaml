procedimiento:
- 'Paso 1: Reordena los términos del polinomio si la primera agrupación que intentaste
  no genera paréntesis idénticos.'
- 'Paso 2: Asegúrate de llevarte el signo correcto de cada término al reordenarlo.'
- 'Paso 3: Agrupa usando tu nueva configuración.'
- 'Paso 4: Aplica los pasos de factor común por grupo y factor resultante.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en reagrupación alternativa de términos.
ejemplos:
- titulo: Factoriza $3mx - 2ny + 3nx - 2my$ mediante una reagrupación conveniente
  enunciado: Factoriza $3mx - 2ny + 3nx - 2my$ mediante una reagrupación conveniente.
  solucion_pasos:
  - 'La agrupación inicial no sirve bien. Reordenamos juntando las ''m'' y las ''n'':
    $3mx - 2my + 3nx - 2ny$.'
  - 'Agrupamos: $(3mx - 2my) + (3nx - 2ny)$.'
  - 'Extraemos: $m(3x - 2y) + n(3x - 2y)$.'
  - 'Final: $(3x - 2y)(m + n)$.'
- titulo: Si agrupo $x^2 + xy + ax + ay$ como $(x^2 + ax) + (xy + ay)$, ¿qué resultado
    obtengo?
  solucion_pasos:
  - 'Sacamos ''x'' del primero y ''y'' del segundo: $x(x+a) + y(x+a)$. Esto da (x+a)(x+y),
    idéntico al otro método.'
- titulo: 'Respecto de «Reagrupación alternativa de términos»: ¿Describe adecuadamente
    el concepto esta'
  enunciado: 'Respecto de «Reagrupación alternativa de términos»: ¿Describe adecuadamente
    el concepto esta frase? «Un polinomio factorizable por agrupación suele permitir
    más de una combinación posible de grupos (por ejemplo, agrupar 1 con 3 y 2 con
    4 en lugar de 1 con 2 y 3 con 4), llevando siempre a los mismos factores finales»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un polinomio factorizable por
    agrupación suele permitir más de una combinación posible de grupos (por ejemplo,
    agrupar 1 con 3 y 2 con 4 en lugar de 1 con 2 y 3 con 4), llevando siempre a los
    mismos factores finales.'
- titulo: 'Respecto de «Reagrupación alternativa de términos»: ¿Se puede aceptar esta
    afirmación? «Al r'
  enunciado: 'Respecto de «Reagrupación alternativa de términos»: ¿Se puede aceptar
    esta afirmación? «Al reordenar términos, olvidar moverlos con su signo original
    correspondiente»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un polinomio factorizable por
    agrupación suele permitir más de una combinación posible de grupos (por ejemplo,
    agrupar 1 con 3 y 2 con 4 en lugar de 1 con 2 y 3 con 4), llevando siempre a los
    mismos factores finales.'
errores_frecuentes:
- Al reordenar términos, olvidar moverlos con su signo original correspondiente.
- Pensar que un método está malo porque los factores salen invertidos al final.
- Porque hay múltiples respuestas correctas diferentes.
- Porque se pueden inventar términos.
- Para «¿Por qué un polinomio puede factorizarse usando diferentes combinaciones de
  agrupación», la respuesta correcta es Porque los polinomios son infinitos.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_ponder: Descomponer en factores irreducibles expresiones algebraicas
  aplicando reagrupación alternativa de términos.
