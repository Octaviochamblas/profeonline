resumen_inicial: La reagrupación alternativa de términos demuestra que un mismo polinomio
  admite distintas agrupaciones iniciales que conducen al mismo resultado factorizado
  equivalente.
explicacion_simple: 'Para factorizar $ax + ay + bx + by$, puedes agrupar las $a$ y
  las $b$: $(ax + ay) + (bx + by) \to (a + b)(x + y)$. Pero también puedes agrupar
  las $x$ y las $y$: $(ax + bx) + (ay + by) \to (x + y)(a + b)$. ¡Llegas exactamente
  al mismo resultado final!'
explicacion_formal: 'Sea el polinomio $P = ax + ay + bx + by$. La **Reagrupación Alternativa
  de Términos** establece la existencia de al menos dos particiones disjuntas equivalentes
  $\mathcal{P}_1$ y $\mathcal{P}_2$:


  $$\text{Ruta 1: } \mathcal{P}_1 = (ax + ay) + (bx + by) = a(x + y) + b(x + y) =
  (x + y)(a + b)$$

  $$\text{Ruta 2: } \mathcal{P}_2 = (ax + bx) + (ay + by) = x(a + b) + y(a + b) =
  (a + b)(x + y)$$


  **Desglose simbólico:**

  - Ruta 1: Agrupa por coeficientes comunes ($a$ y $b$).

  - Ruta 2: Agrupa por variables comunes ($x$ y $y$).

  - Equivalencia final: $(x + y)(a + b) \equiv (a + b)(x + y)$ garantizada por el
  axioma de conmutatividad del producto en $\mathbb{R}$.


  > **Complemento didáctico:** Brinda flexibilidad al estudiante permitiéndole elegir
  el emparejamiento que le resulte más intuitivo.'
definiciones_clave: '- **Rutas de agrupación equivalentes**: Distintas formas de emparejar
  los sumandos que conducen a la misma factorización final.

  - **Invarianza del resultado factorizado**: Principio por el cual la factorización
  prima es única salvo el orden de factores.'
propiedades_relaciones: '- **Teorema de unicidad de factorización**: Todo polinomio
  posee una única representación factorizada irreducible (hasta el orden de factores).'
ejemplo_guiado:
  enunciado: Factorice el polinomio $2ac + 6ad + bc + 3bd$ siguiendo dos rutas de
    agrupación distintas y verifique su equivalencia.
  pasos:
  - 'Paso 1: Ruta A (agrupar 1-2 y 3-4): $(2ac + 6ad) + (bc + 3bd)$.'
  - '  - Extraer en grupo 1: $2a(c + 3d)$.'
  - '  - Extraer en grupo 2: $b(c + 3d)$.'
  - '  - Resultado Ruta A: $(c + 3d)(2a + b)$.'
  - 'Paso 2: Ruta B (reordenar 1-3 y 2-4): $(2ac + bc) + (6ad + 3bd)$.'
  - '  - Extraer en grupo 1: $c(2a + b)$.'
  - '  - Extraer en grupo 2: $3d(2a + b)$.'
  - '  - Resultado Ruta B: $(2a + b)(c + 3d)$.'
  - 'Paso 3: Comparar Ruta A y Ruta B: $(c + 3d)(2a + b) = (2a + b)(c + 3d)$.'
  - 'Conclusión: Ambas rutas de agrupación son válidas y conducen al mismo resultado.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué dos rutas distintas de agrupación en un polinomio conducen al
    mismo resultado final?
  choices:
  - text: Por el teorema de unicidad de la factorización y la conmutatividad de la
      multiplicación
    is_correct: true
  - text: Porque una de las rutas elimina los términos negativos
    is_correct: false
  - text: Por casualidad numérica en polinomios pequeños
    is_correct: false
  - text: Porque el orden de los términos altera el valor del polinomio
    is_correct: false
  explanation: La alternativa correcta es 'Por el teorema de unicidad de la factorización
    y la conmutatividad de la multiplicación'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la Ruta B del ejemplo guiado para $2ac + 6ad + bc + 3bd$, ¿cuál fue
    el paréntesis común generado?
  choices:
  - text: $(2a + b)$
    is_correct: true
  - text: $(c + 3d)$
    is_correct: false
  - text: $(2a - b)$
    is_correct: false
  - text: $(a + b)$
    is_correct: false
  explanation: La alternativa correcta es '$(2a + b)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar una primera combinación de parejas para agrupar y factorizar.'
- 'Paso 2: Probar una combinación alternativa reordenando los términos según otra
  variable común.'
- 'Paso 3: Verificar que ambos productos finales contengan los mismos factores parentéticos.'
errores_correccion: '- **Error 1: Abandonar el procedimiento si una pareja de términos
  no genera un paréntesis común.** **Cómo corregirlo:** Si una pareja de términos
  no funciona, se DEBE intentar una reagrupación alternativa reordenando los sumandos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Para $xy + 2x + 3y + 6$, ¿cuáles son las dos agrupaciones posibles?
  alternativas:
  - $(xy + 2x) + (3y + 6)$ y $(xy + 3y) + (2x + 6)$
  - $(xy + 6) + (2x + 3y)$ únicamente
  - Solo existe una agrupación válida
  respuesta: $(xy + 2x) + (3y + 6)$ y $(xy + 3y) + (2x + 6)$
  solucion_pasos:
  - 1. Ambas generan $(y + 2)(x + 3)$ o $(x + 3)(y + 2)$.
- titulo: Ejemplo 2
  enunciado: Si agrupas $ab + ac + b^2 + bc$ como $(ab + b^2) + (ac + bc)$, ¿cuál
    es el producto resultante?
  alternativas:
  - $(b + c)(a + b)$
  - $(a + b)(b + c)$
  - Ambas alternativas representan el mismo resultado
  respuesta: Ambas alternativas representan el mismo resultado
  solucion_pasos:
  - 1. $b(a + b) + c(a + b) = (a + b)(b + c)$.
- titulo: ¿Es posible obtener el resultado correcto reordenando un polinomio desordenado
    antes de agrupar?
  respuesta: Sí
  solucion_pasos:
  - Sí, la reordenación es la clave cuando el orden original no muestra factores comunes
    evidentes.
- titulo: ¿Produce la reagrupación alternativa factores numéricos o literales totalmente
    distintos e incompatibles?
  respuesta: 'No'
  solucion_pasos:
  - No, los factores primos irreducibles resultantes son matemáticamente equivalentes.
errores_frecuentes:
- Descartar la factorización si la primera agrupación no muestra un paréntesis común
  sin probar reagrupaciones alternativas.
- Declarar que la reagrupación por otra variable da un resultado matemáticamente diferente
  e incorrecto.
- Mezclar términos en grupos de tamaños dispares al intentar una reagrupación alternativa.
- Declarar que solo la primera pareja de términos tiene derecho a ser agrupada.
- Alterar los signos de la expresión original al probar una nueva ruta de agrupación.
afirmaciones_verdaderas:
- Un mismo polinomio factorizable por agrupación admite múltiples rutas válidas de
  emparejamiento.
- Cualquier ruta de agrupación correcta conduce a la misma expresión factorizada irreducible.
al_terminar_debes_poder: Al terminar serás capaz de emplear reagrupaciones alternativas
  de términos para factorizar polinomios por diferentes caminos.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / Agrupación.
