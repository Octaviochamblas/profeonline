semantic_id: MAT.FUND.PROPIEDADES_CONJUNTOS.IDEMPOTENCIA_INTERSECCION
resumen_inicial: 'Demostración lógica, propiedades y consecuencias de la propiedad idempotente de la intersección de conjuntos: $A \cap A = A$.'
explicacion_simple: 'La **propiedad de idempotencia de la intersección** afirma que **la intersección de un conjunto consigo mismo da exactamente el mismo conjunto**: **$A \cap A = A$**. Al buscar cuáles elementos están presentes simultáneamente en $A$ y en $A$, encontramos que **todos y cada uno de los elementos de $A$ cumplen la condición**. Por ejemplo, si $A = \{a, b, c\}$, los elementos comunes entre $\{a, b, c\}$ y $\{a, b, c\}$ son precisamente $\{a, b, c\}$.


  ![propiedad-idempotente-de-la-interseccion](/static/img/nodos/propiedad-idempotente-de-la-interseccion-intro.svg)'
explicacion_formal: '### Definición formal

  En la teoría axiomática de conjuntos y el álgebra de Boole, la operación binaria de intersección es **idempotente**:

  $$\forall A \subseteq \mathcal{U}, \quad A \cap A = A$$

  Demostración formal basada en la idempotencia de la conjunción lógica ($\land$):

  $$x \in (A \cap A) \iff (x \in A \land x \in A) \iff x \in A$$

  Por el axioma de extensionalidad, se concluye la identidad de conjuntos $A \cap A = A$.


  ### Desglose simbólico

  - Tautología lógica subyacente: $P \land P \equiv P$.

  - Invarianza de cardinalidad: $|A \cap A| = |A|$.

  - Intersección múltiple idempotente: $\bigcap_{i=1}^k A = A$ para cualquier $k \in \mathbb{N}$.


  ### Síntesis didáctica

  Intersectar un conjunto consigo mismo actúa como un filtro totalmente transparente que deja intacto el conjunto evaluado.

  '
definiciones_clave: '- **Idempotencia de la intersección**: Propiedad donde intersectar un conjunto consigo mismo devuelve el conjunto original ($A \cap A = A$).

  - **Idempotencia de la conjunción**: Tautología fundamental $P \land P \equiv P$.

  - **Filtro redundante**: Operación que no altera la pertenencia de ningún elemento.

  '
propiedades_relaciones: '- **Simplificación booleana**: $A \cap A \cap A \cap \dots \cap A = A$.

  - **Relación con inclusión**: Dado que $A \subseteq A$, $A \cap A = A$ es consecuencia directa de la propiedad general $X \subseteq Y \implies X \cap Y = X$.

  '
ejemplo_guiado:
  enunciado: 'Dado el conjunto $T = \{x \in \mathbb{N} \mid x \leq 4\}$, demuestra que $T \cap T = T$ mediante extensión y cardinalidad.


    ![Ejemplo propiedad-idempotente-de-la-interseccion](/static/img/nodos/propiedad-idempotente-de-la-interseccion-ejemplos.svg)'
  pasos:
  - 'Paso 1: Escribir el conjunto $T$ por extensión: $T = \{1, 2, 3, 4\}$.'
  - 'Paso 2: Plantear la intersección $T \cap T$: $\{1, 2, 3, 4\} \cap \{1, 2, 3, 4\}$.'
  - 'Paso 3: Extraer los elementos comunes a ambos conjuntos: $\{1, 2, 3, 4\}$.'
  - 'Paso 4: Comprobar la igualdad con el conjunto original: $\{1, 2, 3, 4\} = T$.'
  - 'Paso 5: Concluir formalmente que $T \cap T = T$, con $|T \cap T| = |T| = 4$.'
