semantic_id: MAT.ALG.LENGUAJE_RELACIONES.SUCESOR_NUMERO
resumen_inicial: 'Representación del sucesor de un número: traducción, reglas y aplicación
  práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: Si el antecesor mira hacia el pasado, el sucesor mira hacia el
  futuro. Es el siguiente número en la fila.
explicacion_formal: "### Definición formal\n\nSucesor y consecutivo son términos intercambiables\
  \ que denotan avanzar una unidad ($x+1$) en la serie de números enteros.\n\n###\
  \ Desarrollo didáctico\n\nAl igual que con el antecesor, funciona en toda la recta\
  \ entera.\n- El sucesor de $14$ es $14 + 1 = 15$.\n- El sucesor de $-5$ es $-5 +\
  \ 1 = -4$. (Ojo aquí: el sucesor es 'más grande', por lo que avanza hacia el cero\
  \ en los negativos).\n- El sucesor de $y$ es $y + 1$.\n\nNuevamente, el uso de paréntesis\
  \ dictamina el orden de las operaciones. \n'El cuadrado del sucesor' es $(x+1)^2$.\n\
  'El sucesor del cuadrado' es $x^2 + 1$."
definiciones_clave: '- **Representación del sucesor de un número**: Herramienta clave
  para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de representación del sucesor de un número.'
ejemplo_guiado:
