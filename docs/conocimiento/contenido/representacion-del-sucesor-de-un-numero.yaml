resumen_inicial: El sucesor o consecutivo de un número entero es la cantidad inmediatamente
  posterior obtenida al sumar 1 al número original.
explicacion_simple: El sucesor de cualquier número es el número que le sigue justo
  después en la recta numérica. Si el número es $n$, su sucesor es $n + 1$. Por ejemplo,
  si $n = 7$, su sucesor es $7 + 1 = 8$.
explicacion_formal: 'Dada la función sucesor en el conjunto de los números enteros
  $S: \mathbb{Z} \to \mathbb{Z}$, el **Sucesor de** $n$ se define formalmente como:


  $$S(n) = n + 1 \quad \forall n \in \mathbb{Z}$$


  > **Complemento didáctico:** La función sucesor es el operador fundamental en los
  axiomas de Peano para la construcción de los números naturales.'
definiciones_clave: '- **Sucesor $n+1$**: Número entero inmediatamente posterior en
  la recta numérica.'
propiedades_relaciones: '- **Inyectividad**: Si $S(a) = S(b) \implies a = b$.'
ejemplo_guiado:
  enunciado: Exprese algebraicamente el sucesor del triple de un número $x$.
  pasos:
  - 'Paso 1: Expresar el triple del número $x$: $3x$.'
  - 'Paso 2: Aplicar el operador sucesor sumando $1$: $(3x) + 1$.'
  - 'Conclusión: La expresión traducida es $3x + 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se representa algebraicamente el sucesor de un número entero n?
  choices:
  - text: n + 1
    is_correct: true
  - text: n - 1
    is_correct: false
  - text: 2n
    is_correct: false
  - text: n^2
    is_correct: false
  explanation: La alternativa correcta es 'n + 1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue la expresión del sucesor del triple de
    x?
  choices:
  - text: 3x + 1
    is_correct: true
  - text: 3(x + 1)
    is_correct: false
  - text: 3x - 1
    is_correct: false
  - text: x/3 + 1
    is_correct: false
  explanation: La alternativa correcta es '3x + 1'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el número base o expresión original.'
- 'Paso 2: Sumar la constante $1$ a la expresión original.'
- 'Paso 3: Simplificar si corresponde.'
errores_correccion: '- **Error 1: Confundir ''el sucesor del triple de $x$'' ($3x
  + 1$) con ''el triple del sucesor de $x$'' ($3(x + 1)$).** **Cómo corregirlo:**
  La palabra ''sucesor'' afecta al bloque que la sigue; si es al triple, se le suma
  1 a $3x$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la expresión algebraica para el doble del sucesor de un número
    k?
  alternativas:
  - 2(k + 1)
  - 2k + 1
  - k + 2
  - 2k - 1
  respuesta: 2(k + 1)
  solucion_pasos:
  - '1. Sucesor de k: k + 1.'
  - '2. Doble del sucesor: 2(k + 1).'
- titulo: Ejemplo 2
  enunciado: Si m = -5, ¿cuál es su sucesor m + 1 en los enteros?
  alternativas:
  - '-4'
  - '-6'
  - '5'
  - '6'
  respuesta: '-4'
  solucion_pasos:
  - 1. -5 + 1 = -4. El sucesor de -5 es -4.
- titulo: ¿Es el sucesor de un número n siempre 1 unidad mayor que n?
  respuesta: Sí
  solucion_pasos:
  - Sí, n + 1 es exactamente 1 unidad mayor.
- titulo: ¿Es la expresión n - 1 la representación del sucesor de n?
  respuesta: 'No'
  solucion_pasos:
  - No, n - 1 representa el antecesor de n.
errores_frecuentes:
- Restar 1 en lugar de sumar 1 al representar el sucesor de un número.
- Omitir los paréntesis al calcular un múltiplo del sucesor de una variable.
- Declarar que el sucesor de un número entero negativo es más negativo (decir que
  el sucesor de -5 es -6).
- Multiplicar por 2 en lugar de sumar 1 para obtener el sucesor.
- Declarar el concepto de sucesor con el de potencia de exponente 2.
afirmaciones_verdaderas:
- El sucesor de cualquier entero n es n + 1.
- En los enteros negativos, sumar 1 acerca el número al origen cero (sucesor de -3
  es -2).
al_terminar_debes_poder: Al terminar serás capaz de representar algebraicamente el
  sucesor de cualquier número o expresión sumando la unidad constante.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Sucesiones.
estado: publicado
