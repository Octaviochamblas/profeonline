semantic_id: MAT.ALG.LENGUAJE_RELACIONES.SUCESOR_NUMERO
resumen_inicial: La representación del sucesor de un número consiste en expresar algebraicamente el entero inmediatamente posterior a una cantidad dada mediante la adición de una unidad $n + 1$.
explicacion_simple: "El **sucesor de un número entero** es el número que le sigue inmediatamente hacia la derecha en la recta numérica (el número \"siguiente\"):\n- Para encontrar el sucesor de cualquier entero, **simplemente le sumas $1$**.\n- Si el número desconocido es $n$, su **sucesor** es **$n + 1$**.\n- Ejemplos:\n  - El sucesor de $5 \\implies 5 + 1 = 6$.\n  - El sucesor de $-4 \\implies -4 + 1 = -3$.\n  - El sucesor de un número $x \\implies **x + 1**$.\n  - El doble del sucesor de $x \\implies **2(x + 1)**$.\n  - El sucesor del doble de $x \\implies **2x + 1**$.\n\n![Sucesor de un Número](/static/img/nodos/representacion-del-sucesor-de-un-numero-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $n \in \mathbb{Z}$ un número entero. La **función sucesor** (o consecutividad posterior) $S: \mathbb{Z} \to \mathbb{Z}$ asigna a cada elemento $n$ el valor único determinado por la adición del elemento neutro aditivo $1$:


  $$S(n) = n + 1$$


  ### Propiedades Peano de la Función Sucesor

  1. **Inyectividad**: $S(a) = S(b) \iff a + 1 = b + 1 \iff a = b$.

  2. **Ausencia de ciclos finitos**: Para todo $n \in \mathbb{Z}$, $S(n) \neq n$.


  ### Distinción Sintáctica: Sucesor del Múltiplo vs Múltiplo del Sucesor

  - **El sucesor del doble de $n$**: $S(2n) = 2n + 1$.

  - **El doble del sucesor de $n$**: $2 \cdot S(n) = 2(n + 1) = 2n + 2$.


  ### Síntesis didáctica

  La función sucesor es el axioma fundamental para definir la inducción matemática y las sucesiones aritméticas de razón $1$.

  '
definiciones_clave: '- **Sucesor de un entero ($n + 1$)**: Número entero contiguo mayor en $1$ unidad respecto a la cantidad dada.

  - **Función sucesor ($S(n)$)**: Operación elemental $n \mapsto n+1$ sobre el conjunto de los enteros $\mathbb{Z}$.

  - **Puntuación y ámbito de los paréntesis**: Diferencia funcional entre modificar el argumento antes o después de la función sucesor.

  '
propiedades_relaciones: '- **Diferencia constante**: La diferencia entre el sucesor de un número y el número original es siempre igual a $1$ ($S(n) - n = 1$).

  - **Composición de sucesores**: El sucesor del sucesor de $n$ equivale a $S(S(n)) = (n + 1) + 1 = n + 2$.

  '
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "El triple del sucesor de un número $x$ equivale a treinta y seis".'
  pasos:
  - 'Paso 1: Expresamos el sucesor de la variable $x$: $S(x) = (x + 1)$.'
  - 'Paso 2: Aplicamos el multiplicador "el triple" sobre toda la expresión entre paréntesis: $3(x + 1)$.'
  - 'Paso 3: Igualamos a $36$: $3(x + 1) = 36$.'
  - 'Conclusión: La ecuación traducida es **$3(x + 1) = 36$**.'
  imagen: /static/img/nodos/representacion-del-sucesor-de-un-numero-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión algebraica genérica que representa el sucesor de un número entero $n$?
  choices:
  - text: 'Se representa sumando una unidad a la variable: $n + 1$'
    is_correct: true
  - text: 'Se representa restando una unidad a la variable: $n - 1$'
    is_correct: false
  - text: 'Se representa multiplicando la variable por dos: $2n$'
    is_correct: false
  - text: 'Se representa elevando la variable al cuadrado: $n^2$'
    is_correct: false
  explanation: 'La alternativa correcta es ''Se representa sumando una unidad a la variable: $n + 1$''. Definición de sucesor.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿Cuál es la traducción correcta de "El sucesor del cuadrado de $x$"? '
  choices:
  - text: Se traduce como la expresión $x^2 + 1$
    is_correct: true
  - text: Se traduce como la expresión $(x + 1)^2$
    is_correct: false
  - text: Se traduce como la expresión $2x + 1$
    is_correct: false
  - text: Se traduce como la expresión $x + 2$
    is_correct: false
  explanation: La alternativa correcta es 'Se traduce como la expresión $x^2 + 1$'. Primero el cuadrado $x^2$ y luego su sucesor $+ 1$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la variable que representa al número inicial.'
- 'Paso 2: Añadir $+ 1$ inmediatamente a la derecha de dicha variable.'
- 'Paso 3: Si el enunciado aplica una operación (doble, triple, cuadrado) SOBRE el sucesor, encerrar $(n + 1)$ entre paréntesis.'
- 'Paso 4: Si el enunciado pide el sucesor DE una operación, realizar primero la operación y sumar $+ 1$ al final.'
errores_correccion: '- **Error 1:** Escribir $2x + 1$ al traducir "el doble del sucesor de $x$" en lugar de $2(x+1)$. **Cómo corregirlo:** En "el doble del sucesor", **el 2 multiplica al paréntesis $2(x+1)$**; en "el sucesor del doble", se suma 1 al final de $2x$.

  - **Error 2:** Restar $1$ en lugar de sumar $1$ (escribir $n - 1$ para el sucesor). **Cómo corregirlo:** El **sucesor SUMA $1$ ($n + 1$)**; restar 1 da el antecesor.

  '
ejemplos:
- titulo: Sucesor simple
  enunciado: ¿Cuál es la traducción del "Sucesor de un número $k$"?
  alternativas:
  - $k + 1$
  - $k - 1$
  - $2k$
  respuesta: $k + 1$
  solucion_pasos:
  - '1. Variable: $k$.'
  - '2. Sucesor suma 1: $k + 1$.'
- titulo: Sucesor del sucesor
  enunciado: ¿Cuál es la expresión simplificada del sucesor del sucesor de $n$?
  alternativas:
  - $n + 2$
  - $n + 1$
  - $2n + 2$
  respuesta: $n + 2$
  solucion_pasos:
  - 1. Sucesor de $n \to n+1$.
  - 2. Sucesor de $(n+1) \to (n+1)+1 = n+2$.
- titulo: Sucesor de un entero negativo
  enunciado: ¿Es el número $-3$ el sucesor de $-4$ por la operación $-4 + 1 = -3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-4 + 1 = -3$.
- titulo: Cuadrado del sucesor
  enunciado: La frase "El cuadrado del sucesor de $x$", ¿se traduce como $(x + 1)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, primero el sucesor $(x+1)$ y luego elevado al cuadrado.
errores_frecuentes:
- Escribir n - 1 al traducir el sucesor de un número en lugar de sumar una unidad.
- Intercambiar la estructura del doble del sucesor 2(x+1) con la del sucesor del doble 2x+1.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Multiplicar por dos la variable en lugar de sumar uno para obtener el número siguiente.
- Declarar que el sucesor de un número negativo disminuye en magnitud absoluta.
afirmaciones_verdaderas:
- El sucesor de cualquier entero n se expresa algebraicamente como n + 1.
- La diferencia entre el sucesor de un número y el número original es constante e igual a 1.
al_terminar_debes_poder: '![Resumen de sucesor de un número](/static/img/nodos/representacion-del-sucesor-de-un-numero-resumen.svg)


  QUÉ: Representar algebraicamente el sucesor o número entero siguiente de una cantidad dada.


  CÓMO: Sumar una unidad al número de referencia ($n + 1$) utilizando paréntesis $k(n + 1)$ cuando la expresión se multiplique o eleve a potencia.'
