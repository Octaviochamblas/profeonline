semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.VALOR_INICIAL
resumen_inicial: 'El valor inicial de un modelo exponencial $f(t) = a \cdot b^t$ es la cantidad observada en el instante cero $f(0) = a$, representando la condición de partida del fenómeno.'
explicacion_simple: |
  En los problemas reales (como el crecimiento de bacterias, el dinero en un banco o la propagación de un virus), el tiempo comienza a contarse en $t = 0$. Al reemplazar $t = 0$ en la fórmula $f(t) = a \cdot b^t$, la potencia $b^0$ da 1, y el resultado es simplemente el número $a$. Por esta razón, el parámetro $a$ recibe el nombre de "valor inicial" o "cantidad de partida".
explicacion_formal: |
  ### Definición formal
  En un modelo exponencial dinámico de tiempo $t \in [0, +\infty[$ definido por $P(t) = P_0 \cdot b^t$, la constante $P_0 \in \mathbb{R}^+$ es el **valor o estado inicial del sistema**, determinado formalmente por el operador de evaluación temporal en el origen:
  $$P(0) = P_0 \cdot b^0 = P_0 \cdot 1 = P_0$$

  ### Desglose simbólico
  - Contexto de Biología (Bacterias): $N(t) = N_0 \cdot 2^t \implies N_0 = \text{población inicial de bacterias en } t = 0$.
  - Contexto Financiero (Interés Compuesto): $C(t) = C_0 \cdot (1 + r)^t \implies C_0 = \text{capital o dinero inicial invertido}$.
  - Contexto Físico (Desintegración): $M(t) = M_0 \cdot (0.5)^t \implies M_0 = \text{masa inicial de sustancia radiactiva}$.

  ### Síntesis didáctica
  Diferenciar el valor inicial de la tasa de variación: El valor inicial $a = f(0)$ indica *con cuánto empezamos* en unidades absolutas (pesos, bacterias, gramos). La base $b$ indica *a qué velocidad o razón cambia* esa cantidad.
definiciones_clave: |
  - **Valor inicial $P_0$ / $a$**: Estado del fenómeno observado en el instante $t = 0$.
  - **Condición de partida**: Conjunto de valores medidos antes de la evolución exponencial.
  - **Escala de magnitud real**: Unidad de medida contextual asignada al coeficiente de escala $a$.
propiedades_relaciones: |
  - **Proporcionalidad directa**: La cantidad total acumulada en cualquier instante $t$ es directamente proporcional al valor inicial $P_0$: si duplicamos el valor inicial $P_0$, se duplican todas las imágenes $P(t)$.
  - **Constante del punto de corte $y$**: En el plano cartesiano del modelo, el valor inicial $P_0$ coincide exactamente con la ordenada del punto de intersección $(0, P_0)$.
ejemplo_guiado:
  enunciado: 'Un cultivo de bacterias se modela mediante la función $N(t) = 1500 \cdot 2^t$, donde $N(t)$ es el número de bacterias y $t$ es el tiempo en horas. Determina el valor inicial del cultivo, calcula la población a las 3 horas y deduce el factor por el cual se multiplicó la población inicial.'
  pasos:
    - 'Paso 1: Para hallar el valor inicial, evaluamos en el instante $t = 0 \implies N(0) = 1500 \cdot 2^0 = 1500 \cdot 1 = 1500\text{ bacterias}$.'
    - 'Paso 2: Concluimos que la población inicial con la que comenzó el experimento fue de 1500 bacterias.'
    - 'Paso 3: Calculamos la población a las 3 horas evaluando $N(3)$: $N(3) = 1500 \cdot 2^3 = 1500 \cdot 8 = 12000\text{ bacterias}$.'
    - 'Paso 4: El factor de multiplicación transcurridas 3 horas es $2^3 = 8$ (la población inicial se multiplicó por 8).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Un depósito de dinero en un banco se modela mediante la función $M(t) = 500000 \cdot (1.05)^t$, donde $M$ es el monto en pesos y $t$ son los años transcurridos. ¿Qué representa el número $500000$?'
    choices:
      - {text: 'El capital o dinero inicial depositado en el año $t = 0$', is_correct: true}
      - {text: 'La ganancia de dinero al cabo de 5 años', is_correct: false}
      - {text: 'La tasa de interés del $5\%$ anual', is_correct: false}
      - {text: 'El dinero total acumulado al cabo de 100 años', is_correct: false}
    explanation: 'La alternativa correcta es ''El capital o dinero inicial depositado en el año $t = 0$''. En $t = 0$, $M(0) = 500000 \cdot 1 = 500000$ pesos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'La masa en gramos de una sustancia radiactiva disminuye según $m(t) = 80 \cdot (0.5)^t$, con $t$ en días. ¿Cuál era la masa de sustancia presente al inicio del experimento?'
    choices:
      - {text: '80 gramos', is_correct: true}
      - {text: '40 gramos', is_correct: false}
      - {text: '0.5 gramos', is_correct: false}
      - {text: '160 gramos', is_correct: false}
    explanation: 'La alternativa correcta es ''80 gramos''. La masa inicial se obtiene evaluando $t = 0 \implies m(0) = 80 \cdot (0.5)^0 = 80\text{ gramos}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la variable temporal de entrada (típicamente $t$).'
  - 'Paso 2: Sustituir $t = 0$ en la ecuación del modelo exponencial.'
  - 'Paso 3: Resolver la evaluación simplificando la potencia $b^0 = 1$.'
  - 'Paso 4: Interpretar el resultado numérico obtenido como la cantidad inicial medida en las unidades del problema.'
errores_correccion: |
  - **Error 1:** Confundir el valor inicial $a = f(0)$ con el valor de la función tras la primera unidad de tiempo $f(1) = a \cdot b$. **Cómo corregirlo:** El valor inicial exige evaluar estrictamente en $t = 0$. Evaluar en $t = 1$ incluye la primera multiplicación por la base $b$.
  - **Error 2:** Creer que el valor inicial es la base $b$. **Cómo corregirlo:** La base $b$ es la tasa multiplicativa (por cuánto se multiplica). El valor inicial es el coeficiente externo $a$ (la cantidad de partida).
ejemplos:
  - titulo: 'Identificación de población inicial'
    enunciado: 'En la función de población $P(t) = 350 \cdot 1.2^t$, ¿cuántos individuos había al comienzo?'
    alternativas:
      - '350 individuos'
      - '1.2 individuos'
      - '420 individuos'
    respuesta: '350 individuos'
    solucion_pasos:
      - '1. $P(0) = 350 \cdot 1.2^0 = 350 \cdot 1 = 350$.'
      - '2. La población inicial era de 350 individuos.'
  - titulo: 'Capital inicial depositado'
    enunciado: 'Si $C(t) = 20000 \cdot (1.08)^t$, ¿el dinero depositado originalmente fue de 20.000 pesos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El término constante $a = 20000$ corresponde a $C(0) = 20000$ pesos.'
  - titulo: 'Masa inicial en decaimiento'
    enunciado: '¿Una masa de $M(t) = 500 \cdot (0.8)^t$ comenzó con 500 gramos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $M(0) = 500 \cdot (0.8)^0 = 500$ gramos.'
  - titulo: 'Proporcionalidad del valor inicial'
    enunciado: 'Si se triplica la cantidad inicial de bacterias de $100 \cdot 2^t$ a $300 \cdot 2^t$, ¿la población a las 4 horas también se triplica?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Para 100: $100 \cdot 16 = 1600$. Para 300: $300 \cdot 16 = 4800 = 3 \cdot 1600$.'
errores_frecuentes:
  - 'El valor inicial de la función exponencial $P(t) = 400 \cdot 3^t$ se obtiene evaluando $t = 1$.'
  - 'En un modelo de crecimiento $N(t) = 50 \cdot 2^t$, el valor inicial es la base $2$.'
  - 'El valor inicial de una función de decaimiento es igual a cero.'
  - 'Multiplicar el valor inicial por la base nos da la cantidad medida en el instante $t = 0$.'
  - 'El valor inicial de un modelo exponencial cambia cuando modificamos la base $b$.'
afirmaciones_verdaderas:
  - 'El valor inicial de un modelo exponencial $f(t) = a \cdot b^t$ es la cantidad observada en $t = 0$, representada por el coeficiente $a = f(0)$.'
  - 'El valor inicial representa la cantidad física o económica de partida antes de experimentar el crecimiento o decaimiento exponencial.'
