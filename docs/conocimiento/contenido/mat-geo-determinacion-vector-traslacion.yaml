procedimiento:
- 'Paso 1: Identifica un punto de la preimagen P(x,y) y su correspondiente en la imagen
  P''(x'',y'').'
- 'Paso 2: Resta las coordenadas: x''-x para la componente horizontal, y''-y para
  la componente vertical.'
- 'Paso 3: El vector traslación es v=(x''-x, y''-y); verifica aplicándolo a otro par
  de puntos correspondientes si están disponibles.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con determinación del vector traslación a partir de una imagen
  y su preimagen.
