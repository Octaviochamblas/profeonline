semantic_id: MAT.GEO.ISOMETRIA_TRASLACION.DETERMINACION_VECTOR
resumen_inicial: 'Determinación del vector traslación a partir de una imagen y su
  preimagen: conceptos, teoremas, propiedades geométricas y cálculo en Transformaciones
  Isométricas.'
explicacion_simple: Si conoces un punto antes y después de moverse, puedes 'deducir'
  exactamente cuál fue el vector de movimiento que se aplicó.
explicacion_formal: '![Determinación del vector traslación](/static/img/geometria/isometrias/determinacion-vector-traslacion.svg)


  ### Definición formal


  Si $P(x,y)$ es un punto de la preimagen y $P''(x'',y'')$ es su correspondiente en
  la imagen, el vector traslación es $\vec{v}=P''-P=(x''-x,\,y''-y)$. Basta con conocer
  un único par de puntos correspondientes para determinar el vector completo.


  ### Desarrollo didáctico


  En la figura, dado $P(-4,-2)$ y su imagen $P''(2,3)$, el vector traslación es $\vec{v}=(2-(-4),\,3-(-2))=(6,5)$.'
