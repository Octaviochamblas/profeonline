semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.SIMETRIA_IMPAR
resumen_inicial: 'Las funciones potencia de exponente entero impar positivo satisfacen la propiedad de función impar $f(-x) = -f(x)$, generando simetría central respecto al origen de coordenadas $(0, 0)$.'
explicacion_simple: |
  Una función es impar cuando al cambiarle el signo a la entrada (poniendo $-x$), la salida resultante cambia exactamente de signo pasando a ser $-y$. En las funciones potencia de exponente impar (como $x^3, x^5, x^7$), la potencia conserva el signo negativo ($(-2)^3 = -8$). Debido a esto, la gráfica presenta una simetría puntual o rotacional respecto al centro $(0, 0)$: si giramos la gráfica patas arriba dando media vuelta (180°), queda exactamente igual.
explicacion_formal: |
  ### Definición formal
  La **simetría central de función impar** en la familia de funciones potencia $f(x) = a x^n$ con $n = 2k+1 (k \in \mathbb{Z}^+)$ se demuestra algebraicamente mediante la antipatía exacta por inversión del signo de la variable independiente:
  $$\forall x \in \mathbb{R}: \quad f(-x) = a(-x)^{2k+1} = a [(-1) \cdot x]^{2k+1} = a (-1)^{2k+1} x^{2k+1} = a (-1) x^{2k+1} = -a x^{2k+1} = -f(x)$$

  ### Desglose geométrico
  - Centro de simetría cartesiano: Origen de coordenadas $P_0 = (0, 0)$.
  - Mapeo de puntos antipodales: Para todo par cartesiano $(u, v) \in \operatorname{Graf}(f)$, el par opuesto $(-u, -v)$ pertenece obligatoriamente a $\operatorname{Graf}(f)$.
  - Punto medio en el origen: El segmento que une $(u, v)$ con $(-u, -v)$ pasa exactamente por el origen $(0, 0)$, el cual actúa como punto medio exacto del segmento.

  ### Síntesis didáctica
  Identificación rápida de paridad: Si el exponente de la variable en una función potencia es impar ($1, 3, 5, 7\dots$), la función es **matemáticamente impar** y su gráfica es **simétrica respecto al origen $(0, 0)$**.
definiciones_clave: |
  - **Función impar $f(-x) = -f(x)$**: Propiedad algebraica que invierte el signo de la salida al invertir el signo de la entrada.
  - **Simetría central (Origen $(0, 0)$)**: Invariancia gráfica por rotación de 180° alrededor del punto central del plano.
  - **Pares antípodas $(u, v) \longleftrightarrow (-u, -v)$**: Puntos ubicados a igual distancia del origen en direcciones diametralmente opuestas.
propiedades_relaciones: |
  - **Preservación de la inyectividad**: Las funciones potencia de exponente impar positivo son estrictamente monótonas e inyectivas en todo $\mathbb{R}$, aceptando función inversa.
  - **Paso por el origen**: Toda función impar definida en $x = 0$ satisface obligatoriamente $f(0) = 0$.
ejemplo_guiado:
  enunciado: 'Demuestra algebraicamente la simetría respecto al origen de la función potencia $f(x) = -2x^5$ evaluando $f(-x)$, y verifica la propiedad con el par de abscisas $x = 2$ y $x = -2$.'
  pasos:
    - 'Paso 1: Demostración algebraica: $f(-x) = -2(-x)^5 = -2 [(-1)^5 x^5] = -2 (-1) x^5 = 2x^5 = -(-2x^5) = -f(x)$. Demostrado que es impar.'
    - 'Paso 2: Evaluamos en $x = 2$: $f(2) = -2(2)^5 = -2(32) = -64$. Punto: $(2, -64)$.'
    - 'Paso 3: Evaluamos en $x = -2$: $f(-2) = -2(-2)^5 = -2(-32) = +64$. Punto: $(-2, 64)$.'
    - 'Paso 4: Conclusión: $f(-2) = 64 = -(-64) = -f(2)$, confirmando que los puntos $(2, -64)$ y $(-2, 64)$ son antípodas respecto al origen $(0, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad algebraica define a una función potencia de exponente impar como $f(x) = 5x^3$ como una función impar simétrica respecto al origen?'
    choices:
      - {text: 'La igualdad $f(-x) = -f(x)$ para todo $x \in \mathbb{R}$', is_correct: true}
      - {text: 'La igualdad $f(-x) = f(x)$ para todo $x \in \mathbb{R}$', is_correct: false}
      - {text: 'La propiedad $f(0) = 5$', is_correct: false}
      - {text: 'Que su gráfica sea una parábola simétrica respecto al eje $y$', is_correct: false}
    explanation: 'La alternativa correcta es ''La igualdad $f(-x) = -f(x)$ para todo $x \in \mathbb{R}$''. Esta relación de inversión de signo define formalmente a las funciones impares.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el punto $(-3, -54)$ pertenece a la gráfica de la función potencia impar $f(x) = 2x^3$, ¿qué otro punto pertenece obligatoriamente a la gráfica por simetría respecto al origen $(0, 0)$?'
    choices:
      - {text: 'El punto de coordenadas $(3, 54)$', is_correct: true}
      - {text: 'El punto de coordenadas $(3, -54)$', is_correct: false}
      - {text: 'El punto de coordenadas $(-3, 54)$', is_correct: false}
      - {text: 'El punto de coordenadas $(0, 0)$ exclusivamente', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto de coordenadas $(3, 54)$''. La simetría central respecto al origen invierte tanto el signo de la abscisa (de $-3$ a $+3$) como el signo de la ordenada (de $-54$ a $+54$).'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Sustituir la variable $x$ por $(-x)$ en la fórmula de la función potencia.'
  - 'Paso 2: Utilizar la propiedad de los exponentes impares $(-1)^{2k+1} = -1$ para factorizar el signo negativo por fuera de la expresión.'
  - 'Paso 3: Verificar que $f(-x) = -f(x)$.'
  - 'Paso 4: Concluir que la función es impar y que su gráfica presenta simetría central respecto al punto $(0, 0)$.'
errores_correccion: |
  - **Error 1:** Afirmar que $(-x)^3 = x^3$ y concluir que la función es par. **Cómo corregirlo:** La potencia de exponente impar preserva el signo del argumento: $(-x)^3 = -x^3$. La función es impar ($f(-x) = -f(x)$).
  - **Error 2:** Creer que un coeficiente negativo altera el carácter impar de la función. **Cómo corregirlo:** Si $a < 0$, por ejemplo en $f(x) = -x^3$, $f(-x) = -(-x)^3 = -(-x^3) = x^3 = -(-x^3) = -f(x)$, manteniendo intacta la paridad impar.
ejemplos:
  - titulo: 'Demostración de paridad en exponente 5'
    enunciado: '¿La función $f(x) = 4x^5$ es una función impar?'
    alternativas:
      - 'Sí, porque $f(-x) = 4(-x)^5 = -4x^5 = -f(x)$'
      - 'No, es par'
      - 'No tiene paridad'
    respuesta: 'Sí, porque $f(-x) = 4(-x)^5 = -4x^5 = -f(x)$'
    solucion_pasos:
      - '1. Evaluamos $f(-x) = 4(-x)^5$.'
      - '2. Como 5 es impar, $(-1)^5 = -1 \implies f(-x) = -4x^5 = -f(x)$, siendo una función impar.'
  - titulo: 'Puntos antípodas en la curva'
    enunciado: 'Si $f(2) = 16$ en la función impar $f(x) = 2x^3$, ¿$f(-2) = -16$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por simetría central respecto al origen, al invertir la entrada a $-2$ la salida invierte su signo a $-16$.'
  - titulo: 'Inyectividad preservada por simetría impar'
    enunciado: '¿La función potencia impar $f(x) = x^5$ es inyectiva en todo $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser monótona continua sin duplicación de ordenadas, es inyectiva y admite función inversa.'
  - titulo: 'Invariancia por constante multiplicativa'
    enunciado: '¿Las funciones $f(x) = 8x^3$ y $g(x) = -0.1x^3$ son ambas funciones impares?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La paridad impar depende exclusivamente de que el exponente sea impar.'
errores_frecuentes:
  - 'Las funciones potencia de exponente impar satisfacen la identidad $f(-x) = f(x)$.'
  - 'La gráfica de la función potencia $f(x) = x^3$ es simétrica respecto al eje vertical $y$.'
  - 'Evaluar $x = -3$ en la función $f(x) = x^5$ entrega un resultado positivo.'
  - 'Una función de exponente impar con $a < 0$ pierde su simetría respecto al origen.'
  - 'Las funciones potencia impares no pueden tomar valores de salida negativos.'
afirmaciones_verdaderas:
  - 'Todas las funciones potencia de exponente entero impar positivo satisfacen la identidad $f(-x) = -f(x)$, lo que se traduce geométricamente en una simetría central respecto al origen $(0, 0)$.'
  - 'La simetría respecto al origen implica que si la curva pasa por el punto de coordenadas $(u, v)$, debe pasar obligatoriamente por su antípoda opuesta $(-u, -v)$.'
