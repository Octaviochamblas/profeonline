semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.SIMETRIA_IMPAR
resumen_inicial: 'Identificación de simetría respecto del origen en exponentes impares:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Comportamiento con
  exponente entero positivo.'
explicacion_simple: Una función es impar cuando su gráfica, al rotarla 180 grados
  alrededor del origen, se ve exactamente igual a como estaba antes.
explicacion_formal: '### Definición formal


  Una función $f$ es impar si $f(-x)=-f(x)$ para todo $x$ del dominio. Para $f(x)=a\cdot
  x^n$ con $n$ impar, $f(-x)=a\cdot(-x)^n=-a\cdot x^n=-f(x)$, ya que una potencia
  impar de un número negativo conserva el signo negativo.


  ### Desarrollo didáctico


  Con $f(x)=3x^5$: $f(-2)=3\cdot(-2)^5=3\cdot(-32)=-96$ y $f(2)=3\cdot2^5=96$. Se
  cumple $f(-2)=-f(2)$, confirmando que la función es impar y su gráfica es simétrica
  respecto al origen.'
definiciones_clave: '- **Identificación de simetría respecto del origen en exponentes
  impares**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a identificación de simetría respecto del origen en exponentes
  impares.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de identificación de simetría respecto del origen en exponentes impares.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de identificación de simetría
    respecto del origen en exponentes impares.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
