semantic_id: MAT.ALG.LENGUAJE_RELACIONES.NUMERO_PAR
resumen_inicial: 'Representación de un número par: traducción, reglas y aplicación
  práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: Si tú escoges el número 3, y te pido que lo vuelvas par sin sumar
  ni restar nada, ¿qué harías? Lo multiplicarías por 2. Esa es la esencia de la paridad
  en álgebra.
explicacion_formal: "### Definición formal\n\nEl factor 2 actúa como un filtro que\
  \ fuerza a que el resultado siempre sea divisible por 2 (definición de número par).\n\
  \n### Desarrollo didáctico\n\nCualquier número entero (ya sea par o impar), al ser\
  \ multiplicado por 2, se convierte automáticamente en un número par. \n- Si $n=5$\
  \ (impar), $2n = 10$ (par).\n- Si $n=8$ (par), $2n = 16$ (par).\nPor esto, $2n$\
  \ es el 'candado' perfecto para forzar la paridad en cualquier demostración o problema."
definiciones_clave: '- **Representación de un número par**: Herramienta clave para
  pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de representación de un número par.'
ejemplo_guiado:
