procedimiento:
- 'Paso 1: Identificar que el enunciado requiere representar un entero con condición de paridad par.'
- 'Paso 2: Definir una letra de variable entera (ej: $n \in \mathbb{Z}$).'
- 'Paso 3: Escribir el producto de $2$ por la variable: $2n$.'
- 'Paso 4: Para representar un segundo número par independiente, usar otra variable: $2m$.'
errores_correccion: '- **Error 1:** Afirmar que $n + 2$ representa siempre un número par. **Cómo corregirlo:** Si $n$ fuese impar (ej: $n=3$), $3+2=5$ (impar). La expresión **correcta para garantizar paridad es $2n$**.

  - **Error 2:** Declarar que el número cero ($0$) no es par. **Cómo corregirlo:** El $0$ **SÍ es un número par** porque $0 = 2(0)$.

  '
ejemplos:
- titulo: Representación de par
  enunciado: ¿Cuál es la representación algebraica de un número par?
  alternativas:
  - $2n$
  - $n + 2$
  - $2n + 1$
  respuesta: $2n$
  solucion_pasos:
  - 1. Todo número par es múltiplo de 2.
  - '2. Representación: $2n$.'
- titulo: Paridad de la suma
  enunciado: Al sumar $2a + 2b = 2(a+b)$, ¿se obtiene un número par?
  alternativas:
  - Sí, por la factorización del factor 2
  - No, da un número impar
  - No, da una fracción
  respuesta: Sí, por la factorización del factor 2
  solucion_pasos:
  - 1. $2(a+b)$ es de la forma $2k$.
  - 2. Por lo tanto, es un número par.
- titulo: Evaluación con n impar
  enunciado: Para $n = 7$ (impar), ¿resulta $2n = 2(7) = 14$ un número par?
  respuesta: Sí
  solucion_pasos:
  - Sí, multiplicar por 2 transforma cualquier número en par.
- titulo: Cero como par
  enunciado: ¿Es la expresión $2n$ válida para $n = 0$ dando $0$ como número par?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2(0) = 0$, que es par.
errores_frecuentes:
- Escribir n + 2 para representar un número par en lugar de utilizar el producto 2n.
- Declarar que el número cero no pertenece al conjunto de los números enteros pares.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Intercambiar la estructura de un número par 2n con la de un número impar 2n + 1.
- Afirmar que multiplicar un número impar por dos resulta en otro número impar.
afirmaciones_verdaderas:
- Un número par se representa algebraicamente mediante la expresión canónica 2n (con n entero).
- La suma de dos números pares produce siempre como resultado otro número par.
al_terminar_debes_poder: '![Resumen de número par](/static/img/nodos/representacion-de-un-numero-par-resumen.svg)


  QUÉ: Representar la estructura algebraica canónica de un número par cualquiera.


  CÓMO: Multiplicar una variable entera $n \in \mathbb{Z}$ por el factor 2 ($2n$), garantizando divisibilidad exacta.'
