semantic_id: MAT.ALG.LENGUAJE_RELACIONES.NUMERO_PAR
resumen_inicial: La representación de un número par consiste en expresar algebraicamente cualquier entero divisible por 2 mediante la estructura multiplicativa canónica $2n$, donde $n$ pertenece a los números enteros.
explicacion_simple: "Un **número par** es cualquier número entero que se puede dividir exactamente por 2 (sin dejar resto):\n- Ejemplos numéricos de pares: $\\dots, -6, -4, -2, 0, 2, 4, 6, 8, 10, \\dots$\n- En álgebra, como todo número par es un **múltiplo de 2**, se representa siempre mediante el producto: **$2n$** (o $2k$), donde $n$ puede ser cualquier número entero ($\\dots, -2, -1, 0, 1, 2, \\dots$).\n- **¿Por qué $2n$ es siempre par?**\n  - Si $n = 3 \\implies 2(3) = 6$ (Par).\n  - Si $n = 4 \\implies 2(4) = 8$ (Par).\n  - Si $n = 0 \\implies 2(0) = 0$ (Par).\n- No importa si $n$ es par o es impar, **al multiplicarlo por $2$ se transforma obligatoriamente en un número PAR**.\n\n![Número Par](/static/img/nodos/representacion-de-un-numero-par-intro.svg)\n"
explicacion_formal: "### Definición formal\nEl conjunto de los números enteros pares $2\\mathbb{Z} \\subset \\mathbb{Z}$ es el ideal generado por el entero $2$, constituido por todos los enteros $x$ tales que su resto en la división modular por $2$ es estrictamente nulo:\n\n$$x \\in 2\\mathbb{Z} \\iff x \\equiv 0 \\pmod 2 \\iff \\exists n \\in \\mathbb{Z} \\quad \\text{tal que} \\quad x = 2n$$\n\n### Propiedades Operacionales de los Números Pares\n1. **Cierre de la Adición**: La suma de dos números pares es siempre un número par:\n   $$2n + 2m = 2(n + m) \\in 2\\mathbb{Z}$$\n2. **Absorción Multiplicativa**: El producto de cualquier número entero por un número par es siempre par:\n   $$(2n) \\cdot m = 2(nm) \\in 2\\mathbb{Z}$$\n3. **Cuadrado Par**: El cuadrado de un número par es siempre un múltiplo de $4$:\n   $$(2n)^2 = 4n^2 = 2(2n^2) \\in 2\\mathbb{Z}$$\n\n### Síntesis didáctica\nLa estructura $2n$ es la base de las demostraciones por paridad en teoría de números y en el planteamiento\
  \ de problemas con restricciones de divisibilidad.\n"
definiciones_clave: '- **Número par ($2n$)**: Expresión algebraica universal que representa a todo número entero divisible exactamente por $2$.

  - **Variable entera ($n \in \mathbb{Z}$)**: Parámetro entero arbitrario que al multiplicarse por $2$ genera un elemento par.

  - **Divisibilidad por 2**: Condición aritmética por la cual la división entre $2$ arroja un resto igual a cero.

  '
propiedades_relaciones: '- **Inclusión del cero**: El número $0$ es formalmente un número par, ya que $0 = 2(0)$.

  - **Relación con el impar**: El sucesor ($2n + 1$) y el antecesor ($2n - 1$) de un número par $2n$ son siempre números impares.

  '
ejemplo_guiado:
  enunciado: Demuestra algebraicamente que la suma de dos números pares cualesquiera da como resultado otro número par.
  pasos:
  - 'Paso 1: Representamos el primer número par como $2a$ (donde $a \in \mathbb{Z}$).'
  - 'Paso 2: Representamos el segundo número par como $2b$ (donde $b \in \mathbb{Z}$).'
  - 'Paso 3: Sumamos ambas expresiones: $2a + 2b$.'
  - 'Paso 4: Factorizamos por el factor común $2$: $2(a + b)$.'
  - 'Paso 5: Como la suma de enteros $(a + b) = k$ es otro entero, la expresión se escribe como $2k$.'
  - 'Conclusión: La expresión **$2k$ tiene la forma canónica de un número par**, quedando demostrado.'
  imagen: /static/img/nodos/representacion-de-un-numero-par-ejemplos.svg
