procedimiento:
- 'Paso 1: Asigna una variable cualquiera para representar un número entero (ej. n).'
- 'Paso 2: Multiplica esa variable por 2.'
- 'Paso 3: Usa la expresión 2n cada vez que el problema se refiera a ''un número par
  cualquiera''.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  representación de un número par.
ejemplos:
- titulo: Forzando la paridad
  enunciado: 'Traduce algebraicamente: ''El cuádruple de un número par cualquiera''.'
  solucion_pasos:
  - Un número par cualquiera se escribe como 2n.
  - El cuádruple significa multiplicar por 4.
  - 'Traducción final: 4(2n), que puede reducirse a 8n.'
- titulo: En un algoritmo de encriptación, se necesita que el código final ($C$) sea
    obligatoriamente
  enunciado: 'En un algoritmo de encriptación, se necesita que el código final ($C$)
    sea obligatoriamente par, independientemente del número entero ($N$) que ingrese
    el usuario. Un programador propone tres opciones: $C_1 = N + 2$, $C_2 = N^2$,
    y $C_3 = 2N$. ¿Cuál de ellas garantiza siempre el cumplimiento de la condición?
    (v1)


    Opciones: A) Solo $C_3 = 2N$ · B) Solo $C_1 = N + 2$ · C) Solo $C_2 = N^2$ · D)
    Todas garantizan la condición.'
  solucion_pasos:
  - Si $N=3$, $C_1 = 5$ (impar), $C_2 = 9$ (impar). Solo $C_3 = 2(3) = 6$ garantiza
    la paridad mediante el factor multiplicativo 2.
  - 'Respuesta: Solo $C_3 = 2N$'
- titulo: 'Respecto de «Representación de un número par»: ¿Se ajusta a la definición
    esta afirmación? «'
  enunciado: 'Respecto de «Representación de un número par»: ¿Se ajusta a la definición
    esta afirmación? «Un **Número Par** se traduce algebraicamente como **$2n$** (o
    $2x$, $2k$, etc.), donde $n$ pertenece a los números enteros»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un **Número Par** se traduce
    algebraicamente como **$2n$** (o $2x$, $2k$, etc.), donde $n$ pertenece a los
    números enteros.'
- titulo: 'Respecto de «Representación de un número par»: ¿Es compatible con el procedimiento
    esta afir'
  enunciado: 'Respecto de «Representación de un número par»: ¿Es compatible con el
    procedimiento esta afirmación? «Traducir ''un número par'' usando la letra $p$
    a secas. La $p$ podría tomar el valor 3. Solo $2p$ garantiza que sea par»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un **Número Par** se traduce
    algebraicamente como **$2n$** (o $2x$, $2k$, etc.), donde $n$ pertenece a los
    números enteros.'
errores_frecuentes:
- Traducir 'un número par' usando la letra $p$ a secas. La $p$ podría tomar el valor
  3. Solo $2p$ garantiza que sea par.
- Creer que $x/2$ genera un número par. (La división por dos genera mitades, no fuerza
  paridad).
- Porque el número $2$ es el único número par que existe.
- Para «¿Por qué la expresión algebraica $2x$, donde $x$ es un entero, es el estándar
  universal para representar 'un número par'? (v1)», la respuesta correcta es Porque
  la letra $x$ siempre asume el valor de $2$ en las ecuaciones lineales.
- Porque sumar $2$ a cualquier número lo vuelve par.
afirmaciones_verdaderas:
- La traducción de representación de un número par preserva el significado matemático
  del enunciado.
al_terminar_debes_ponder: Traducir y evaluar expresiones que involucren representación
  de un número par.
fuente: Álgebra de Baldor.
