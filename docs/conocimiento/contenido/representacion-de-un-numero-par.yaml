errores_frecuentes:
- Omitir el operador de desigualdad estricta o no estricta al traducir representación
  de un número par.
- Invertir el orden de las variables al construir la expresión de representación de
  un número par.
- Usar una suma cuando el enunciado de representación de un número par exige una resta
  o división.
- Omitir paréntesis al multiplicar expresiones en representación de un número par.
- Declarar que la expresión de representación de un número par es válida sólo para
  números pares.
afirmaciones_verdaderas:
- La traducción simbólica de representación de un número par preserva la relación
  de orden o sucesión entre cantidades.
- La notación algebraica permite expresar relaciones numéricas complejas de forma
  compacta.
al_terminar_debes_poder: Al terminar serás capaz de traducir expresiones de representación
