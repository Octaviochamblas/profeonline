semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MODELO_CRECIMIENTO
resumen_inicial: 'Modelamiento de crecimiento poblacional mediante funciones exponenciales:
  conceptos, asíntotas, propiedades e inversidad en Análisis gráfico y modelamiento
  exponencial.'
explicacion_simple: Poblaciones de bacterias, animales o incluso usuarios de una aplicación
  suelen crecer multiplicándose por un mismo factor en cada período de tiempo, un
  comportamiento que se ajusta exactamente al modelo exponencial.
explicacion_formal: '### Definición formal


  Un fenómeno de crecimiento que aumenta una tasa fija $r$ (expresada como decimal)
  por cada unidad de tiempo se modela como $P(t)=P_0\cdot(1+r)^t$, donde $P_0=P(0)$
  es la población inicial y la base $b=1+r>1$ garantiza crecimiento.


  ### Desarrollo didáctico


  Para plantear el modelo, se identifica la población inicial y la tasa de crecimiento
  porcentual, convirtiendo esta última a su forma decimal y sumándola a 1 para obtener
  la base.


  Una población de $200$ conejos crece a una tasa del $8\%$ anual: el modelo es $P(t)=200\cdot(1{,}08)^t$,
  con $P_0=200$ y base $b=1+0{,}08=1{,}08$.'
definiciones_clave: '- **Modelamiento de crecimiento poblacional mediante funciones
  exponenciales**: Concepto fundamental en el estudio del crecimiento/decaimiento
  exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a modelamiento de crecimiento poblacional mediante funciones exponenciales.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de modelamiento
    de crecimiento poblacional mediante funciones exponenciales.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de modelamiento de crecimiento
    poblacional mediante funciones exponenciales.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
