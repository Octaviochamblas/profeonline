semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MODELO_CRECIMIENTO
resumen_inicial: 'El modelamiento de crecimiento poblacional aplica la función exponencial $P(t) = P_0 \cdot (1 + r)^t$ para predecir la expansión de especies o sustancias a una tasa constante $r > 0$.'
explicacion_simple: |
  En la naturaleza, cuando una población (como un grupo de bacterias, plantas o animales) cuenta con recursos ilimitados, crece a un ritmo proporcional a su tamaño: mientras más individuos hay, más nuevos individuos nacen. Este fenómeno se modela con la función $P(t) = P_0 \cdot (1 + r)^t$, donde $P_0$ es la cantidad inicial de la población, $r$ es el porcentaje de aumento en cada periodo, y $t$ es el tiempo transcurrido.
explicacion_formal: |
  ### Definición formal
  El **modelo de crecimiento exponencial malthusiano / discreto** en función del tiempo $t \ge 0$ se define analíticamente mediante la ecuación de tasa porcentual constante $r > 0$:
  $$P(t) = P_0 \cdot (1 + r)^t$$
  donde $P_0 = P(0) > 0$ es la población inicial en el instante cero y $b = 1 + r > 1$ es la base del crecimiento relativo.

  ### Desglose simbólico
  - Tasa de crecimiento porcentual $r = b - 1 > 0$. Si una población crece un $20\%$ por periodo $\implies r = 0.20 \implies b = 1.20$.
  - Modelo de duplicación: $P(t) = P_0 \cdot 2^{t / T_d}$, donde $T_d$ es el **tiempo de duplicación** (periodo necesario para multiplicar la población por dos).
  - Tasa instantánea de variación: $\frac{dP}{dt} = k \cdot P(t)$, lo que expresa que la velocidad de crecimiento es directamente proporcional al tamaño actual de la población.

  ### Síntesis didáctica
  Diferenciar crecimiento por suma de crecimiento por porcentaje: Si una población aumenta en 50 individuos cada año, es un modelo lineal $P(t) = 50t + P_0$. Si aumenta en un $50\%$ cada año, es un modelo exponencial $P(t) = P_0 \cdot (1.5)^t$.
definiciones_clave: |
  - **Población inicial $P_0$**: Número de individuos o cantidad de sustancia registrada en el instante $t = 0$.
  - **Tasa de crecimiento $r$**: Porcentaje de incremento relativo expresado como fracción decimal por unidad de tiempo.
  - **Tiempo de duplicación $T_d$**: Periodo de tiempo requerido para que la población inicial duplique su tamaño ($P = 2P_0$).
propiedades_relaciones: |
  - **Invariancia del tiempo de duplicación**: En un modelo exponencial puro de recursos ilimitados, el tiempo necesario para duplicar la población es constante sin importar el tamaño actual de la misma.
  - **Expansión acelerada**: La cantidad absoluta de nuevos individuos añadidos por periodo aumenta en cada intervalo de tiempo.
ejemplo_guiado:
  enunciado: 'Un cultivo de bacterias cuenta inicialmente con 500 bacterias y se duplica cada 3 horas. Formula la función de población $N(t)$ en función de las horas $t$, calcula la población al cabo de 12 horas y determina cuántas bacterias hay después de 1 día.'
  pasos:
    - 'Paso 1: Identificamos $N_0 = 500$ y el tiempo de duplicación $T_d = 3\text{ horas}$.'
    - 'Paso 2: Formulamos el modelo de duplicación: $N(t) = 500 \cdot 2^{t/3}$.'
    - 'Paso 3: Para $t = 12\text{ horas}$, el exponente es $\frac{12}{3} = 4$ periodos de duplicación.'
    - 'Paso 4: Evaluamos $N(12) = 500 \cdot 2^4 = 500 \cdot 16 = 8000\text{ bacterias}$.'
    - 'Paso 5: Para $1\text{ día} = 24\text{ horas}$, el exponente es $\frac{24}{3} = 8$. Evaluamos $N(24) = 500 \cdot 2^8 = 500 \cdot 256 = 128000\text{ bacterias}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Una población de insectos inicia con 1000 individuos y crece a una tasa constante del $15\%$ mensual. ¿Cuál es la función $P(m)$ que representa la cantidad de insectos al cabo de $m$ meses?'
    choices:
      - {text: '$P(m) = 1000 \cdot (1.15)^m$', is_correct: true}
      - {text: '$P(m) = 1000 \cdot (0.15)^m$', is_correct: false}
      - {text: '$P(m) = 1000 + 0.15m$', is_correct: false}
      - {text: '$P(m) = 1150m$', is_correct: false}
    explanation: 'La alternativa correcta es ''$P(m) = 1000 \cdot (1.15)^m$''. La base es $b = 1 + r = 1 + 0.15 = 1.15$, multiplicada por la población inicial $P_0 = 1000$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una población de levaduras se triplica cada 2 horas comenzando con 400 células, ¿cuál es la expresión de la población $N(t)$ para $t$ en horas?'
    choices:
      - {text: '$N(t) = 400 \cdot 3^{t/2}$', is_correct: true}
      - {text: '$N(t) = 400 \cdot 2^{t/3}$', is_correct: false}
      - {text: '$N(t) = 1200^t$', is_correct: false}
      - {text: '$N(t) = 400 + 3t$', is_correct: false}
    explanation: 'La alternativa correcta es ''$N(t) = 400 \cdot 3^{t/2}$''. La base de triplicación es $3$, y el exponente es el número de periodos de 2 horas transcurridos $\frac{t}{2}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer la población inicial $P_0 = P(0)$ del enunciado.'
  - 'Paso 2: Calcular la base $b = 1 + r$ si se da el porcentaje de incremento $r$, o usar $b = 2$ si es duplicación.'
  - 'Paso 3: Construir la función exponencial $P(t) = P_0 \cdot b^{t / T}$.'
  - 'Paso 4: Sustituir el tiempo $t$ deseado y calcular la cantidad final proyectada.'
errores_correccion: |
  - **Error 1:** Utilizar la tasa porcentual $r$ directamente como base (ej: para un $20\%$ escribir $f(t) = P_0 \cdot (0.2)^t$). **Cómo corregirlo:** La base de crecimiento es $b = 1 + r = 1 + 0.20 = 1.20$. La base $0.20$ representaría una pérdida del $80\%$.
  - **Error 2:** Multiplicar la población inicial por el porcentaje antes de elevar a la potencia. **Cómo corregirlo:** La estructura del modelo exige aplicar el exponente a la base $(1+r)^t$ en primer lugar y luego multiplicar por $P_0$.
ejemplos:
  - titulo: 'Cálculo de base con tasa porcentual'
    enunciado: 'Si una ciudad de 50.000 habitantes crece un $3\%$ anual, ¿cuál es su modelo exponencial?'
    alternativas:
      - '$P(t) = 50000 \cdot (1.03)^t$'
      - '$P(t) = 50000 \cdot (0.03)^t$'
      - '$P(t) = 50000 \cdot (3)^t$'
    respuesta: '$P(t) = 50000 \cdot (1.03)^t$'
    solucion_pasos:
      - '1. $P_0 = 50000$, tasa $r = 3\% = 0.03$.'
      - '2. Base $b = 1 + 0.03 = 1.03$.'
      - '3. Modelo: $P(t) = 50000 \cdot (1.03)^t$.'
  - titulo: 'Evaluación en modelo de duplicación'
    enunciado: 'Si $N(t) = 100 \cdot 2^t$ representa bacterias en horas, ¿cuántas bacterias hay a las 5 horas?'
    respuesta: '3200 bacterias'
    solucion_pasos:
      - '1. Evaluamos $t = 5 \implies N(5) = 100 \cdot 2^5 = 100 \cdot 32 = 3200$.'
  - titulo: 'Población inicial en el modelo'
    enunciado: 'En el modelo de algas $A(t) = 80 \cdot (1.4)^t$, ¿80 es la masa inicial de algas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al evaluar $t = 0$, $A(0) = 80 \cdot (1.4)^0 = 80$.'
  - titulo: 'Crecimiento de velocidad variable'
    enunciado: '¿En el modelo $P(t) = 1000 \cdot (1.1)^t$, la cantidad de nuevos individuos añadidos en el año 10 es mayor que en el año 1?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser una función acelerada, el $10\%$ de una población mayor genera un número absoluto más grande de nuevos individuos.'
errores_frecuentes:
  - 'Un modelo de crecimiento de población del $10\%$ anual con 500 individuos iniciales se plantea como $P(t) = 500 \cdot (0.1)^t$.'
  - 'En un modelo de duplicación cada 4 horas $N(t) = N_0 \cdot 2^{t/4}$, evaluar $t = 4$ horas equivale a elevar $2^4 = 16$.'
  - 'El crecimiento de una población que aumenta un número fijo de 100 habitantes al mes es una función exponencial.'
  - 'Si una población de 1000 habitantes crece un $5\%$ anual, al cabo de 2 años hay $1000 + 50 + 50 = 1100$ habitantes.'
  - 'En el modelo $P(t) = P_0 \cdot b^t$, la variable $t$ representa la tasa de crecimiento.'
afirmaciones_verdaderas:
  - 'El modelo de crecimiento exponencial poblacional $P(t) = P_0 \cdot (1 + r)^t$ utiliza una base $b = 1 + r > 1$ basada en la tasa de aumento relativo constante.'
  - 'En un modelo de duplicación $P(t) = P_0 \cdot 2^{t/T_d}$, el exponente fraccionario $\frac{t}{T_d}$ representa el número de ciclos completos de duplicación transcurridos.'
