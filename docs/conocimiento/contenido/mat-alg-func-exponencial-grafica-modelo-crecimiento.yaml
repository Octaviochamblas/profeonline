procedimiento:
- 'Paso 1: Identifica la población inicial $P_0$ y la tasa de crecimiento porcentual
  $r\%$.'
- 'Paso 2: Convierte la tasa a decimal y calcula la base $b=1+r$.'
- 'Paso 3: Plantea el modelo $P(t)=P_0\cdot b^t$.'
- 'Paso 4: Evalúa el modelo en el tiempo solicitado para responder la pregunta del
  problema.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en modelamiento
  de crecimiento poblacional mediante funciones exponenciales.
ejemplos:
- titulo: Planteamiento de un modelo de crecimiento poblacional
  enunciado: Una población de $500$ bacterias crece a una tasa del $20\%$ por hora.
    Plantea el modelo y calcula la población después de $3$ horas.
  solucion_pasos:
  - 'Modelo: $P(t)=500\cdot(1{,}2)^t$.'
  - $P(3)=500\cdot(1{,}2)^3=500\cdot1{,}728=864$.
- titulo: Cálculo con crecimiento poblacional dado por duplicación
  enunciado: Una colonia de $50$ hormigas se duplica cada semana. Plantea el modelo
    y calcula la población después de $4$ semanas.
  solucion_pasos:
  - 'Duplicarse corresponde a base $2$: $P(t)=50\cdot2^t$.'
  - $P(4)=50\cdot16=800$ hormigas.
- titulo: ¿La base de un modelo de crecimiento con tasa $r\%$ es siempre $1+r$ (en
    decimal)?
  enunciado: ¿La base de un modelo de crecimiento con tasa $r\%$ es siempre $1+r$
    (en decimal)?
  respuesta: Sí
  solucion_pasos:
  - Sumar 1 a la tasa decimal representa el 100% original más el porcentaje de crecimiento
    adicional.
- titulo: ¿Un crecimiento "que se duplica cada período" corresponde a una base igual
    a 2?
  enunciado: ¿Un crecimiento "que se duplica cada período" corresponde a una base
    igual a 2?
  respuesta: Sí
  solucion_pasos:
  - Duplicarse significa multiplicar por 2 en cada unidad de tiempo, lo que corresponde
    exactamente a $b=2$.
errores_frecuentes:
- Olvidar convertir la tasa porcentual a decimal antes de sumarla a 1.
- Confundir la tasa de crecimiento $r$ con la base $b=1+r$ del modelo.
- Usar directamente el porcentaje (por ejemplo, 20) en vez de su forma decimal (0,2)
  al construir la base.
- No identificar correctamente la población inicial cuando el problema la describe
  de forma indirecta.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_ponder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando modelamiento de crecimiento poblacional mediante funciones exponenciales.
