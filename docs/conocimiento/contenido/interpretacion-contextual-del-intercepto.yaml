semantic_id: MAT.ALG.MODELAMIENTO_AFIN.INTERPRETACION_INTERCEPTO_CONTEXTO
resumen_inicial: El intercepto $n$ representa la condición inicial, cargo fijo o estado
  de partida del sistema cuando la variable independiente vale cero ($x = 0$).
explicacion_simple: 'En un problema contextual, el **intercepto o coeficiente de posición
  $n$** representa el valor de salida cuando no ha comenzado la actividad o el tiempo
  es cero ($x = 0$):

  - En una cuenta de luz ($C(k) = 120k + 2.500$), los $\$2.500$ son el **cargo fijo
  base** que se cobra aun consumiendo $0\text{ kWh}$.

  - En la temperatura de un horno ($T(t) = 15t + 20$), los $20^\circ\text{C}$ son
  la **temperatura inicial ambiente** antes de encenderlo.'
explicacion_formal: 'La **interpretación contextual del intercepto $n$** en la función
  $f(x) = m x + n$ es el estado de reposo o valor inicial:


  $$n = f(0) \quad [\text{Unidades de } Y]$$


  **Desglose de la fórmula:**

  - Valor escalar que adopta la variable de salida en el momento de origen del modelo
  ($x = 0$).'
definiciones_clave: '- **Interpretación contextual del intercepto $n$**: Significado
  físico o económico del valor del sistema cuando el insumo o tiempo es nulo.'
propiedades_relaciones: '- **Mismas unidades que $Y$**: El intercepto $n$ comparte
  exactamente las mismas unidades físicas de la variable dependiente $Y$.'
ejemplo_guiado:
  enunciado: En la función de temperatura de un liquido en calentamiento $T(t) = 4t
    + 18$, donde $T$ es temperatura en ${}^\circ\text{C}$ y $t$ es tiempo en minutos,
    interpreta el significado del intercepto $n = 18$.
  pasos:
  - 'Paso 1: Evaluar la función en $t = 0$: $T(0) = 4(0) + 18 = 18{}^\circ\text{C}$.Paso
    2: Identificar las unidades de $n$: grados Celsius (${}^\circ\text{C}$).Paso 3:
    Interpretar en contexto: los $18{}^\circ\text{C}$ representan la temperatura inicial
    que poseía el líquido antes de comenzar el proceso de calentamiento.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función $T(t) = 4t + 18$, ¿cuál es la interpretación contextual
    del intercepto $n = 18$?
  choices:
  - text: Es la temperatura inicial del líquido ($18{}^\circ\text{C}$) en el momento
      $t = 0$.
    is_correct: true
  - text: Es la tasa a la que aumenta la temperatura por minuto.
    is_correct: false
  - text: Es el tiempo que tarda el líquido en hervir.
    is_correct: false
  - text: Es la temperatura máxima alcanzada.
    is_correct: false
  explanation: La alternativa correcta es 'Es la temperatura inicial del líquido ($18{}^\circ\text{C}$)
    en el momento $t = 0$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué unidades físicas comparte el intercepto $n$ en cualquier modelo afín
    $f(x) = m x + n$?
  choices:
  - text: Las mismas unidades de la variable dependiente $Y$.
    is_correct: true
  - text: Las unidades de la variable independiente $X$.
    is_correct: false
  - text: Unidades de tasa dividida por tiempo.
    is_correct: false
  - text: No tiene unidades, es adimensional.
    is_correct: false
  explanation: La alternativa correcta es 'Las mismas unidades de la variable dependiente
    $Y$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Evaluar o identificar el término independiente $n$ de la función.'
- 'Paso 2: Asociar a $n$ las unidades físicas de la variable de salida $Y$.'
- 'Paso 3: Explicar su significado como el valor inicial o costo base cuando $x =
  0$.'
errores_correccion: '- **Error común:** Confundir las unidades del intercepto $n$
  creyendo que lleva unidades por unidad de tiempo.

  - **Cómo corregirlo:** El intercepto $n$ tiene exactamente las MISMAS unidades que
  la salida $Y$ (ejemplo: pesos o grados), sin división por la variable de entrada.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una tasa de cambio constante m indica que el proceso se puede modelar con
    una función afín?
  respuesta: Sí
  solucion_pasos:
  - Sí, la razón incremental constante caracteriza a los modelos afines y lineales.
- titulo: ¿El cargo fijo n representa la salida en el momento inicial x = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, f(0) = n es el intercepto o condición de partida.
errores_frecuentes:
- Confundir la tasa de cambio $m$ (unidades compuestas) con el valor acumulado inicial
  $n$ (unidades simples).
- Agregar un cargo fijo $n$ en situaciones de proporcionalidad directa donde no existe
  valor inicial.
- Multiplicar la variable $x$ por el cargo fijo $n$ en lugar de multiplicarla por
  la tarifa unitaria $m$.
- Confundir el crecimiento lineal (suma constante por año) con el crecimiento exponencial
  (porcentaje constante por año).
- Sustituir el valor de la salida $y$ en el lugar de la entrada $x$ al realizar una
  predicción en el modelo.
afirmaciones_verdaderas:
- La pendiente $m$ en un modelo afín contextual representa la tasa de cambio unitaria
  constante $\frac{\Delta y}{\Delta x}$.
- El intercepto $n$ representa la condición inicial, costo base o valor de partida
  del sistema cuando la variable de entrada vale cero ($x = 0$).
al_terminar_debes_poder: Al finalizar este recurso podrás identificar tasas de cambio
  constantes, construir modelos lineales y afines contextuales e interpretar pendiente
  e intercepto para realizar predicciones.
