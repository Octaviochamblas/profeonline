semantic_id: MAT.ALG.MODELAMIENTO_AFIN.INTERPRETACION_INTERCEPTO_CONTEXTO
resumen_inicial: El intercepto o coeficiente de posición $n$ en un modelo aplicado representa el estado inicial, costo fijo o valor basal del sistema cuando la variable independiente es cero ($x = 0$).
explicacion_simple: '![El intercepto o coeficiente de posición $n$ en un modelo aplicado representa el estado inicial, costo fijo o valor basal del sistema cuando la variable independiente es cero ($x = 0$)](/static/img/nodos/interpretacion-contextual-del-intercepto-intro.svg)



  En cualquier situación modelada con $y = mx + n$, el **intercepto $n$ responde a la pregunta**:

  *¿Cuánto vale la magnitud al principio de todo, cuando la entrada es cero ($x = 0$)?*


  - **En cuentas y servicios:** Es el **cargo fijo o cobro base** que pagas aunque no uses el servicio.

  - **En física/química:** Es la **temperatura inicial, volumen de partida o altura de lanzamiento**.

  - **En demografía:** Es la **población inicial** en el año cero del estudio.


  Tiene exactamente las **mismas unidades de medida que la variable dependiente $y$** (pesos, litros, personas, metros).'
explicacion_formal: 'Sea $y = f(x) = mx + n$ un modelo afín de un fenómeno real. El **intercepto** $n$ se define formalmente como el valor de la magnitud dependiente en el origen de referencia:

  $$n = f(0) = m(0) + n$$


  **Propiedades de interpretación:**

  - **Condición de borde inicial**: Establece el punto de partida $(0, n)$ a partir del cual el sistema evoluciona.

  - **Unidad de medida**: Coincide estrictamente con la unidad de la variable dependiente $[n] = [Y]$.

  - **Significado económico**: Costos fijos irrecuperables o cargos por infraestructura independientes del volumen de producción.'
definiciones_clave: '- **Condición inicial / Valor basal ($n$)**: Nivel cuantitativo de la magnitud de salida cuando no hay actividad o consumo ($x = 0$).

  - **Cargo fijo**: Monto económico invariable asociado al contrato o servicio.'
propiedades_relaciones: '- **Independencia de la tasa**: Cambiar la velocidad de consumo $m$ no afecta el valor del intercepto $n$.

  - **Cero contextual**: Si $n = 0$, el modelo se reduce a proporcionalidad directa pura.'
ejemplo_guiado:
  enunciado: '![Ejemplo El intercepto o coeficiente de posición $n$ en un modelo aplicado representa el estado inicial, costo fijo o valor basal del sistema cuando la variable independiente es cero ($x = 0$)](/static/img/nodos/interpretacion-contextual-del-intercepto-ejemplos.svg)



    Un estanque contiene agua y se vacía según la función $V(t) = -18t + 450$, donde $t$ está en minutos y $V$ en litros. Interpreta el significado del intercepto $n = 450$.'
  pasos:
  - 'Paso 1: Identificar el término constante de la función afín: $n = 450$.'
  - 'Paso 2: Asociar las unidades de la variable dependiente: $450\text{ litros}$.'
  - 'Paso 3: Evaluar en $t = 0$: $V(0) = -18(0) + 450 = 450\text{ litros}$.'
  - 'Paso 4: Redactar la interpretación contextual: ''El intercepto $450$ representa la cantidad inicial de agua que había en el estanque antes de comenzar el vaciado en el minuto cero''.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función de costo de un taxi $C(x) = 650x + 400$, ¿qué representa el número 400?
  choices:
  - text: El cargo fijo o bajada de bandera al subirse al taxi.
    is_correct: true
  - text: El precio por cada kilometro recorrido.
    is_correct: false
  - text: El costo maximo del viaje.
    is_correct: false
  - text: La distancia recorrida.
    is_correct: false
  explanation: La alternativa correcta es 'El cargo fijo o bajada de bandera al subirse al taxi.'. Es el intercepto $n = C(0) = 400$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué unidad de medida tiene el intercepto en una función donde el tiempo está en horas y la distancia en kilómetros?
  choices:
  - text: Kilometros (km)
    is_correct: true
  - text: Kilometros por hora (km/h)
    is_correct: false
  - text: Horas (h)
    is_correct: false
  - text: Sin unidades
    is_correct: false
  explanation: La alternativa correcta es 'Kilometros (km)'. El intercepto comparte siempre la misma unidad que la variable dependiente Y.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el término independiente $n$ en la fórmula del modelo afín.'
- 'Paso 2: Asignar al valor $n$ las unidades directas de la variable de salida $Y$.'
- 'Paso 3: Evaluar la situación en la condición inicial $x = 0$.'
- 'Paso 4: Redactar la conclusión: ''El intercepto $n$ representa el valor inicial o costo base de $Y$ antes de que $X$ empiece a variar''.'
errores_correccion: '- **Error común:** Asignar al intercepto unidades de tasa compuesta (como decir que el cargo fijo es de $\$1.500/\text{mes}$ en vez de $\$1.500$).

  - **Cómo corregirlo:** La **pendiente** lleva unidades compuestas ($/\text{unidad}$); el **intercepto** lleva la **unidad pura directa** ($).'
ejemplos:
- titulo: 'Ejemplo 1: Cuenta de gas'
  enunciado: La cuenta mensual de gas es $G(x) = 850x + 2.500$ ($x$ en $\text{m}^3$). ¿Qué representa $\$2.500$?
  alternativas:
  - El cargo fijo mensual por mantención y conexión al servicio
  - El costo de un metro cúbico de gas
  - El consumo máximo del mes
  - El costo total del gas consumido
  respuesta: El cargo fijo mensual por mantención y conexión al servicio
  solucion_pasos:
  - 'Paso 1: $G(0) = \$2.500$, es el cobro base independientemente del consumo.'
- titulo: 'Ejemplo 2: Altura de lanzamiento'
  enunciado: Un dron desciende a velocidad constante con altura $h(t) = -2t + 50$ ($t$ en segundos, $h$ en metros). ¿Qué representa $50$?
  alternativas:
  - La altura inicial a la que se encontraba el dron en t = 0
  - La velocidad de descenso del dron
  - El tiempo que tarda en aterrizar
  - La distancia horizontal recorrida
  respuesta: La altura inicial a la que se encontraba el dron en t = 0
  solucion_pasos:
  - 'Paso 1: $h(0) = 50\text{ metros}$, la altura de partida.'
- titulo: 'Ejemplo 3: Saldo en cuenta de ahorros'
  enunciado: El saldo tras $m$ meses de ahorro es $S(m) = 30.000m + 100.000$. ¿Cuánto dinero había al abrir la cuenta?
  alternativas:
  - $100.000
  - $30.000
  - $130.000
  - $0
  respuesta: $100.000
  solucion_pasos:
  - 'Paso 1: En el mes inicial ($m = 0$), $S(0) = \$100.000$.'
- titulo: 'Ejemplo 4: Distinción con modelo lineal'
  enunciado: Si un modelo tiene intercepto $n = 0$, ¿qué significa contextualmente?
  alternativas:
  - Que no existe costo fijo ni valor residual al inicio
  - Que el proceso nunca empieza
  - Que la tasa de cambio es cero
  - Que la función no es válida
  respuesta: Que no existe costo fijo ni valor residual al inicio
  solucion_pasos:
  - 'Paso 1: $n = 0$ indica proporcionalidad directa pura sin condición basal.'
errores_frecuentes:
- Confundir el intercepto con la pendiente.
- Asignar unidades de tasa al intercepto.
- Creer que el intercepto siempre debe ser cero.
afirmaciones_verdaderas:
- El intercepto n representa el estado inicial del sistema evaluado en x = 0.
- El intercepto comparte siempre la misma unidad de medida que la variable dependiente.
al_terminar_debes_poder: '**QUÉ:** Interpretar el significado físico, económico o basal del intercepto en modelos afines aplicados.


  **CÓMO:** Identificando el valor n = f(0) con sus unidades directas y describiéndolo como la condición de partida o cargo fijo del sistema.


  ![Resumen El intercepto o coeficiente de posición $n$ en un modelo aplicado representa el estado inicial, costo fijo o valor basal del sistema cuando la variable independiente es cero ($x = 0$)](/static/img/nodos/interpretacion-contextual-del-intercepto-resumen.svg)'
