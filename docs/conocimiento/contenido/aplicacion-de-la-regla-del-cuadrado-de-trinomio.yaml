resumen_inicial: La aplicación de la regla del cuadrado de trinomio permite operar
  sobre monomios con coeficientes y potencias superiores $(c_1 x^m + c_2 y^n + c_3
  z^p)^2$.
explicacion_simple: 'Si los tres términos tienen coeficientes y exponentes como $(2x^2
  + 3y + 4)^2$, elevamos cada bloque al cuadrado ($(2x^2)^2 = 4x^4$, $(3y)^2 = 9y^2$,
  $4^2 = 16$), y luego calculamos el doble del producto de cada pareja: $2(2x^2)(3y)
  = 12x^2y$, $2(2x^2)(4) = 16x^2$, y $2(3y)(4) = 24y$.'
explicacion_formal: 'Para monomios generales $A = c_1 x^m, B = c_2 y^n, C = c_3 z^p$,
  el desarrollo de $(A + B + C)^2$ es:


  $$(A + B + C)^2 = A^2 + B^2 + C^2 + 2AB + 2AC + 2BC$$

  $$= (c_1 x^m)^2 + (c_2 y^n)^2 + (c_3 z^p)^2 + 2(c_1 x^m)(c_2 y^n) + 2(c_1 x^m)(c_3
  z^p) + 2(c_2 y^n)(c_3 z^p)$$

  $$= c_1^2 x^{2m} + c_2^2 y^{2n} + c_3^2 z^{2p} + 2c_1 c_2 x^m y^n + 2c_1 c_3 x^m
  z^p + 2c_2 c_3 y^n z^p$$


  **Desglose simbólico:**

  - $c_1^2 x^{2m}, c_2^2 y^{2n}, c_3^2 z^{2p}$: Cuadrados de los coeficientes con
  exponentes duplicados por la ley $(x^m)^2 = x^{2m}$.

  - $2c_1 c_2, 2c_1 c_3, 2c_2 c_3$: Coeficientes dobles del producto de cada par de
  monomios.


  > **Complemento didáctico:** Formaliza la expansión cuadrática de vectores algebraicos
  en espacios tridimensionales $\mathbb{R}^3$.'
definiciones_clave: '- **Duplicación de exponentes**: Regla de potencias $(x^m)^2
  = x^{2m}$ aplicada a los monomios del trinomio.

  - **Coeficientes mixtos dobles**: Productos de coeficientes $2c_i c_j$ para cada
  pareja de términos.'
propiedades_relaciones: '- **Preservación de signo en cuadrados**: Los tres primeros
  términos $A^2, B^2, C^2$ son estrictamente positivos para cualquier valor real no
  nulo de los monomios.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(2x^2 + 3y + 4)^2$ aplicando la regla general
    de cuadrado de trinomio.
  pasos:
  - 'Paso 1: Identificar $A = 2x^2, B = 3y, C = 4$.'
  - 'Paso 2: Elevar al cuadrado cada término: $(2x^2)^2 = 4x^4$, $(3y)^2 = 9y^2$,
    $4^2 = 16$.'
  - 'Paso 3: Calcular $2AB = 2(2x^2)(3y) = 12x^2y$.'
  - 'Paso 4: Calcular $2AC = 2(2x^2)(4) = 16x^2$.'
  - 'Paso 5: Calcular $2BC = 2(3y)(4) = 24y$.'
  - 'Paso 6: Ensamblar los seis términos: $4x^4 + 9y^2 + 16 + 12x^2y + 16x^2 + 24y$.'
  - 'Conclusión: El resultado simplificado es $4x^4 + 9y^2 + 12x^2y + 16x^2 + 24y
    + 16$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de elevar al cuadrado el primer monomio $A = 2x^2$?
  choices:
  - text: $4x^4$
    is_correct: true
  - text: $2x^4$
    is_correct: false
  - text: $4x^2$
    is_correct: false
  - text: $8x^4$
    is_correct: false
  explanation: La alternativa correcta es '$4x^4$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expansión de $(2x^2 + 3y + 4)^2$, ¿cuál es el coeficiente del término
    $x^2y$?
  choices:
  - text: $12$, resultante de $2 \cdot 2 \cdot 3$
    is_correct: true
  - text: $6$
    is_correct: false
  - text: $16$
    is_correct: false
  - text: $24$
    is_correct: false
  explanation: La alternativa correcta es '$12$, resultante de $2 \cdot 2 \cdot 3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar al cuadrado los coeficientes y duplicar exponentes de los 3 monomios
  ($A^2 + B^2 + C^2$).'
- 'Paso 2: Calcular el doble producto $2AB$, ajustando coeficientes y variables.'
- 'Paso 3: Calcular el doble producto $2AC$ y el doble producto $2BC$.'
- 'Paso 4: Unir los 6 términos resultantes.'
errores_correccion: '- **Error 1: Sumar 2 a los exponentes en lugar de multiplicarlos
  por 2 al elevar monomios al cuadrado.** **Cómo corregirlo:** Aplicar la propiedad
  de potencia de potencia $(x^m)^2 = x^{2m}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle $(3a^2 + 2b + 1)^2$.
  alternativas:
  - $9a^4 + 4b^2 + 1 + 12a^2b + 6a^2 + 4b$
  - $9a^4 + 4b^2 + 1$
  - $6a^4 + 4b^2 + 1 + 6a^2b + 6a^2 + 4b$
  respuesta: $9a^4 + 4b^2 + 1 + 12a^2b + 6a^2 + 4b$
  solucion_pasos:
  - '1. Cuadrados: $(3a^2)^2 = 9a^4$, $(2b)^2 = 4b^2$, $1^2 = 1$.'
  - '2. Dobles: $2(3a^2)(2b) = 12a^2b$, $2(3a^2)(1) = 6a^2$, $2(2b)(1) = 4b$.'
  - '3. Resultado: $9a^4 + 4b^2 + 12a^2b + 6a^2 + 4b + 1$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(x^3 + y^2 + 2)^2$?
  alternativas:
  - $x^6 + y^4 + 4 + 2x^3y^2 + 4x^3 + 4y^2$
  - $x^6 + y^4 + 4$
  - $x^5 + y^4 + 4 + 2x^3y^2 + 4x^3 + 4y^2$
  respuesta: $x^6 + y^4 + 4 + 2x^3y^2 + 4x^3 + 4y^2$
  solucion_pasos:
  - '1. Cuadrados: $x^6 + y^4 + 4$.'
  - '2. Dobles: $2x^3y^2 + 4x^3 + 4y^2$.'
  - '3. Resultado: $x^6 + y^4 + 2x^3y^2 + 4x^3 + 4y^2 + 4$.'
- titulo: ¿Es $4m^4 + 9n^2 + 25 + 12m^2n + 20m^2 + 30n$ la expansión de $(2m^2 + 3n
    + 5)^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(2m^2)^2 + (3n)^2 + 25 + 2(2m^2)(3n) + 2(2m^2)(5) + 2(3n)(5)$ coincide exactamente.
- titulo: ¿El término independiente de $(x + y + 6)^2$ es 12?
  respuesta: 'No'
  solucion_pasos:
  - No, el término independiente es $6^2 = 36$.
errores_frecuentes:
- Sumar 2 a los exponentes de las variables en lugar de duplicarlos al elevar al cuadrado.
- Declarar que $(2x^2 + 3y + 4)^2$ equivale a $4x^4 + 9y^2 + 16$.
- Multiplicar los coeficientes sin duplicar el resultado por 2 al calcular los productos
  cruzados.
- Asignar coeficientes lineales a los tres primeros términos al cuadrado.
- Declarar que el desarrollo de trinomios no mónicos tiene menos de 6 términos.
afirmaciones_verdaderas:
- En la regla del cuadrado de trinomio, los exponentes de los monomios cuadráticos
  iniciales se duplican.
- Cada uno de los tres dobles productos resulta de multiplicar 2 por el producto numérico
  y literal de la pareja.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la regla del cuadrado
  de trinomio a monomios con coeficientes no mónicos y exponentes superiores.
