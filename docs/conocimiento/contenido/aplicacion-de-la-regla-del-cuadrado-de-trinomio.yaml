errores_frecuentes:
- Olvidar uno de los tres dobles productos.
- Para «Calcula el número de términos NO nulos y no semejantes en el desarrollo puro
  de $(x+y+z)^2$.», la respuesta correcta es $9$.
- Para «Calcula el número de términos NO nulos y no semejantes en el desarrollo puro
  de $(x+y+z)^2$.», la respuesta correcta es $3$.
- Para «Calcula el número de términos NO nulos y no semejantes en el desarrollo puro
  de $(x+y+z)^2$.», la respuesta correcta es $5$.
- La afirmación «$6$» no es válida en este contenido.
