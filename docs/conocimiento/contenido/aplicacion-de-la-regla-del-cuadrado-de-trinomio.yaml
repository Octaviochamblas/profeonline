procedimiento:
- 'Paso 1: Para desarrollar $(A+B+C)^2$:'
- 'Paso 2: Eleva cada uno al cuadrado (todos serán positivos).'
- 'Paso 3: Haz el doble producto de $A$ y $B$.'
- 'Paso 4: Haz el doble producto de $A$ y $C$.'
- 'Paso 5: Haz el doble producto de $B$ y $C$.'
- 3 cuadrados perfectos y 3 dobles productos.
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en aplicación de la regla del cuadrado de trinomio.
ejemplos:
- titulo: Desarrollo completo
  enunciado: Desarrolla $(x+y+z)^2$.
  solucion_pasos:
  - 'Cuadrados: $x^2 + y^2 + z^2$.'
  - 'Dobles productos: $2xy + 2xz + 2yz$.'
  - 'Suma total: $x^2 + y^2 + z^2 + 2xy + 2xz + 2yz$.'
- titulo: Calcula el número de términos NO nulos y no semejantes en el desarrollo
    puro de $(x+y+z)^2$
  enunciado: 'Calcula el número de términos NO nulos y no semejantes en el desarrollo
    puro de $(x+y+z)^2$.


    Opciones: A) $6$ · B) $9$ · C) $3$ · D) $5$'
  solucion_pasos:
  - 3 cuadrados perfectos y 3 dobles productos.
  - 'Respuesta: $6$'
- titulo: 'Respecto de «Aplicación de la regla del cuadrado de trinomio»: ¿Se ajusta
    a la definición es'
  enunciado: 'Respecto de «Aplicación de la regla del cuadrado de trinomio»: ¿Se ajusta
    a la definición esta afirmación? «Fórmula: $(a+b+c)^2 = a^2 + b^2 + c^2 + 2ab
    + 2ac + 2bc$ La suma de los cuadrados de cada término, más el doble producto de
    todas las combinaciones posibles de dos términos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Fórmula: $(a+b+c)^2 = a^2 +
    b^2 + c^2 + 2ab + 2ac + 2bc$ La suma de los cuadrados de cada término, más el
    doble producto de todas las combinaciones posibles de dos términos.'
- titulo: 'Respecto de «Aplicación de la regla del cuadrado de trinomio»: ¿Es compatible
    con el procedi'
  enunciado: 'Respecto de «Aplicación de la regla del cuadrado de trinomio»: ¿Es compatible
    con el procedimiento esta afirmación? «Olvidar uno de los tres dobles productos»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Fórmula: $(a+b+c)^2 = a^2 +
