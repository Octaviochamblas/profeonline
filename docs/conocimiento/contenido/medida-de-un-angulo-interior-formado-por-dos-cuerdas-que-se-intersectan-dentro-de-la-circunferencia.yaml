semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_INTERIOR_CUERDAS
resumen_inicial: 'La medida de un ángulo interior formado por dos cuerdas que se intersecan dentro de la circunferencia es igual a la semisuma de las medidas de los arcos interceptados: δ = (AB + CD) / 2.'
explicacion_simple: '¿Qué pasa si dos cuerdas se cruzan como una ''X'' dentro del círculo, pero el cruce **no está en el centro**? El ángulo que se forma en el cruce se llama **ángulo interior**.


  Como está corrido del centro, el ángulo abre dos arcos a la vez: uno adelante (entre sus brazos) y otro atrás (entre las prolongaciones de sus brazos opuestos por el vértice). Para saber cuánto mide este ángulo, la matemática hace un promedio perfecto: **sumas los dos arcos opuestos y divides el resultado entre dos** (la **semisuma**):

  $$\delta = \frac{\overset{\frown}{\text{Arco}_1} + \overset{\frown}{\text{Arco}_2}}{2}$$


  ¡Recuerda siempre: **Ángulo INTERIOR lleva SUMA**! Si un arco mide $80^\circ$ y el otro mide $40^\circ$, el ángulo interior mide $(80^\circ + 40^\circ) / 2 = 120^\circ / 2 = 60^\circ$.


  ![Ángulo interior por cuerdas](/static/img/nodos/medida-de-un-angulo-interior-formado-por-dos-cuerdas-que-se-intersectan-dentro-de-la-circunferencia-intro.svg)

  '
explicacion_formal: '### Teorema del ángulo interior

  Sean $\overline{AB}$ y $\overline{CD}$ dos cuerdas de una circunferencia $\mathcal{C}$ que se cortan en un punto interior $P$ ($P \in \text{Int}(\mathcal{C})$). La medida del ángulo interior $\delta = \angle APD$ es la semisuma de las medidas de los arcos interceptados $\overset{\frown}{AD}$ y $\overset{\frown}{BC}$:

  $$\delta = \frac{\text{med}(\overset{\frown}{AD}) + \text{med}(\overset{\frown}{BC})}{2}$$


  ### Demostración geométrica mediante ángulo exterior de un triángulo

  1. Trácese la cuerda auxiliar $\overline{AC}$. Se forma el triángulo interior $\triangle APC$.

  2. En $\triangle APC$, el ángulo $\delta = \angle APD$ es un ángulo exterior al triángulo en el vértice $P$.

  3. Por el teorema del ángulo exterior, su medida es igual a la suma de los dos ángulos interiores no adyacentes:

  $$\delta = \angle PAC + \angle PCA$$

  4. Pero $\angle PAC$ es un ángulo inscrito que subtiende el arco $\overset{\frown}{BC}$, luego $\angle PAC = \frac{\text{med}(\overset{\frown}{BC})}{2}$.

  5. Y $\angle PCA$ es un ángulo inscrito que subtiende el arco $\overset{\frown}{AD}$, luego $\angle PCA = \frac{\text{med}(\overset{\frown}{AD})}{2}$.

  6. Sumando ambas igualdades:

  $$\delta = \frac{\text{med}(\overset{\frown}{BC})}{2} + \frac{\text{med}(\overset{\frown}{AD})}{2} = \frac{\text{med}(\overset{\frown}{AD}) + \text{med}(\overset{\frown}{BC})}{2}$$


  > **Complemento didáctico:** Para no mezclarte con la fórmula del ángulo exterior: **INterior = AÑADIR (Suma)**; **EXterior = EXTRAER (Resta)**. El ángulo que vive adentro promedia los arcos sumándolos y dividiendo entre dos.

  '
definiciones_clave: '- **Ángulo interior**: Ángulo con vértice en el interior del círculo formado por dos cuerdas secantes.

  - **Arcos opuestos por el vértice**: Arcos interceptados por el ángulo y por sus prolongaciones rectilíneas.

  - **Semisuma**: Promedio aritmético de dos magnitudes dividido por 2.

  '
propiedades_relaciones: '- **Caso límite central**: Si el punto de corte $P$ es el centro $O$, ambos arcos son iguales y $\delta = \frac{\alpha + \alpha}{2} = \alpha$ (se recupera el ángulo del centro).

  - **Ángulos adyacentes suplementarios**: El ángulo interior adyacente suma $180^\circ$ con $\delta$ y subtiende los otros dos arcos laterales.

  - **Suma total de arcos**: Los cuatro arcos determinados por las dos cuerdas completan los $360^\circ$ del perímetro angular.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulo interior](/static/img/nodos/medida-de-un-angulo-interior-formado-por-dos-cuerdas-que-se-intersectan-dentro-de-la-circunferencia-ejemplos.svg)


    Dos cuerdas se intersecan en un punto interior $P$ de una circunferencia. Los arcos opuestos que interceptan miden $85^\circ$ y $35^\circ$. Calcula la medida del ángulo interior $\delta$. Además, si otro ángulo interior mide $75^\circ$ y uno de sus arcos mide $100^\circ$, halla la medida del otro arco opuesto.'
  pasos:
  - 'Paso 1: Aplicar la fórmula de la semisuma con los arcos de $85^\circ$ y $35^\circ$: $\delta = \frac{85^\circ + 35^\circ}{2}$.'
  - 'Paso 2: Sumar y dividir: $\delta = \frac{120^\circ}{2} = 60^\circ$.'
  - 'Paso 3: Para el segundo problema, plantear la ecuación con $\delta = 75^\circ$ y arco conocido de $100^\circ$: $75^\circ = \frac{100^\circ + x}{2}$.'
  - 'Paso 4: Multiplicar por 2 y despejar el arco incógnita $x$: $150^\circ = 100^\circ + x \implies x = 150^\circ - 100^\circ = 50^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la operación matemática correcta para calcular la medida de un ángulo interior formado por dos cuerdas secantes?
  choices:
  - text: 'La semisuma de los dos arcos interceptados: (Arco₁ + Arco₂) / 2.'
    is_correct: true
  - text: 'La semidiferencia de los dos arcos interceptados: (Arco₁ - Arco₂) / 2.'
    is_correct: false
  - text: El producto de los dos arcos dividido por 360°.
    is_correct: false
  - text: La suma directa de los dos arcos sin dividir.
    is_correct: false
  explanation: 'La alternativa correcta es ''La semisuma de los dos arcos interceptados: (Arco₁ + Arco₂) / 2.'' El ángulo interior promedia los dos arcos opuestos sumándolos y dividiendo entre dos.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos cuerdas se cortan en el interior determinando arcos opuestos de 90° y 50°, ¿cuánto mide el ángulo interior?
  choices:
  - text: 70°.
    is_correct: true
  - text: 20°.
    is_correct: false
  - text: 140°.
    is_correct: false
  - text: 40°.
    is_correct: false
  explanation: 'La alternativa correcta es ''70°.'' Calculando la semisuma: $\frac{90^\circ + 50^\circ}{2} = \frac{140^\circ}{2} = 70^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar los dos arcos opuestos interceptados por las cuerdas que se cruzan.

  2. Sumar las medidas angulares de ambos arcos.

  3. Dividir el resultado de la suma entre 2: $\delta = \frac{\overset{\frown}{\text{Arco}_1} + \overset{\frown}{\text{Arco}_2}}{2}$.

  4. Para despejar un arco desconocido, multiplicar el ángulo interior por 2 y restar el arco conocido.

  '
errores_correccion: '- **Error común 1:** Restar los arcos en lugar de sumarlos. **Corrección:** La resta se usa en ángulos EXTERIORES; en ángulos interiores se SUMA.

  - **Error común 2:** Olvidar dividir entre dos al final. **Corrección:** El ángulo es la semisuma (la mitad de la suma).

  '
ejemplos:
- tipo: A
  titulo: Ángulo interior simple
  enunciado: Dos cuerdas se cortan formando arcos opuestos de $60^\circ$ y $80^\circ$. ¿Cuánto mide el ángulo interior?
  alternativas:
  - text: $70^\circ$.
    is_correct: true
  - text: $10^\circ$.
    is_correct: false
  - text: $140^\circ$.
    is_correct: false
  - text: $35^\circ$.
    is_correct: false
  explicacion: $\delta = \frac{60^\circ + 80^\circ}{2} = \frac{140^\circ}{2} = 70^\circ$.
- tipo: B
  titulo: Interior y suma
  enunciado: ¿Es la medida de un ángulo interior siempre igual a la semisuma de los arcos que interceptan él y su opuesto por el vértice?
  respuesta: Sí
  explicacion: Sí. Por el teorema del ángulo interior, $\delta = \frac{\overset{\frown}{\text{Arco}_1} + \overset{\frown}{\text{Arco}_2}}{2}$.
errores_frecuentes:
- '''Restar los arcos en vez de sumarlos confundiendo el ángulo interior con el exterior.'''
- '''Olvidar dividir entre dos la suma de los arcos.'''
- '''Asumir que el punto de corte de las cuerdas es el centro de la circunferencia.'''
afirmaciones_verdaderas:
- '''La medida del ángulo interior formado por dos cuerdas es la semisuma de los arcos interceptados.'''
- '''Si el punto de intersección de las cuerdas coincide con el centro, la fórmula produce el ángulo del centro.'''
- '''El ángulo interior es igual a la suma de dos ángulos inscritos no adyacentes de un triángulo auxiliar.'''
al_terminar_debes_poder: '**QUÉ:** Calcular medidas de ángulos interiores formados por cuerdas secantes y arcos interceptados.


  **CÓMO:** Aplicando la fórmula de la semisuma $\delta = \frac{\overset{\frown}{AB} + \overset{\frown}{CD}}{2}$.


  ![Síntesis de ángulo interior](/static/img/nodos/medida-de-un-angulo-interior-formado-por-dos-cuerdas-que-se-intersectan-dentro-de-la-circunferencia-resumen.svg)

  '
