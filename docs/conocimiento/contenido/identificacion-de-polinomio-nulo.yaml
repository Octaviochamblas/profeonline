procedimiento:
- 'Paso 1: Revisa el coeficiente (el número grande) que acompaña a cada término de
  la expresión.'
- 'Paso 2: Revisa también el término independiente.'
- 'Paso 3: Si absolutamente todos esos números son un gran ''0'', estás ante un polinomio
  nulo.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar identificación de polinomio nulo.
ejemplos:
- titulo: El tren vacío
  enunciado: Sabiendo que P(x) = (a-2)x^2 + (b-3)x es un polinomio nulo, halla a y
    b.
  solucion_pasos:
  - Si es nulo, todos sus coeficientes deben valer cero.
  - El primer coeficiente (a-2) debe ser 0. Por ende, a = 2.
  - El segundo coeficiente (b-3) debe ser 0. Por ende, b = 3.
- titulo: En el desarrollo de un motor físico para videojuegos, se programa que cuando
    el 'Polinomio d
  enunciado: 'En el desarrollo de un motor físico para videojuegos, se programa que
    cuando el ''Polinomio de Fuerza Neta'' ($F(x)$) se convierte en un polinomio nulo,
    el objeto entra en reposo absoluto inalterable. El sistema lee $F(x) = (c-2)x^2
    + (k)x$. Para que la nave espacial quede anclada en reposo, ¿qué valores deben
    inyectar los sensores a las constantes $c$ y $k$? (v1)


    Opciones: A) $c = 2$ y $k = 0$. · B) $c = 0$ y $k = 0$. · C) $c = -2$ y $k = 0$.
    · D) Cualquier valor de $c$ y $k$ si $x = 0$.'
  solucion_pasos:
  - Si debe ser un polinomio nulo ($F(x) \equiv 0$), sus coeficientes valen cero.
    $c-2 = 0 \rightarrow c=2$. Y directamente $k=0$.
  - 'Respuesta: $c = 2$ y $k = 0$.'
- titulo: 'Respecto de «Identificación de polinomio nulo»: ¿Es correcta esta caracterización?
    «Un **Pol'
  enunciado: 'Respecto de «Identificación de polinomio nulo»: ¿Es correcta esta caracterización?
    «Un **Polinomio Nulo** es aquel en el cual **todos y cada uno de sus coeficientes
    numéricos son iguales a cero**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un **Polinomio Nulo** es aquel
    en el cual **todos y cada uno de sus coeficientes numéricos son iguales a cero**.'
- titulo: 'Respecto de «Identificación de polinomio nulo»: ¿Es válida esta afirmación?
    «Confundir ''Poli'
  enunciado: 'Respecto de «Identificación de polinomio nulo»: ¿Es válida esta afirmación?
    «Confundir ''Polinomio Nulo'' con ''Polinomio de grado cero''. Un polinomio de
    grado cero es una constante ($P(x) = 5$). Un polinomio nulo es literalmente el
    vacío ($P(x) = 0$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un **Polinomio Nulo** es aquel
    en el cual **todos y cada uno de sus coeficientes numéricos son iguales a cero**.'
errores_frecuentes:
- Confundir 'Polinomio Nulo' con 'Polinomio de grado cero'. Un polinomio de grado
  cero es una constante ($P(x) = 5$). Un polinomio nulo es literalmente el vacío ($P(x)
  = 0$).
- Creer que si la 'x' vale cero, el polinomio se llama nulo. El polinomio es nulo
  solo si sus *coeficientes fijos* son cero de fábrica.
- Que la variable o incógnita del problema tome obligatoriamente el valor numérico
  cero.
- Que el polinomio carezca de término independiente.
- Para «¿Cuál es la condición algebraica necesaria e indispensable para que una expresión
  sea formalmente categorizada como un 'Polinomio Nulo' ($P(x) \equiv 0$)? (v1)»,
  la respuesta correcta es Que todos sus exponentes sean cero.
afirmaciones_verdaderas:
- La notación de identificación de polinomio nulo sigue las convenciones del lenguaje
  algebraico.
al_terminar_debes_ponder: Identificar y operar con conceptos relativos a identificación
