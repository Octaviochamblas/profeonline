semantic_id: MAT.GEO.VECTORES_BASE.DEFINICION_VECTOR
resumen_inicial: 'Definición de vector como ente geométrico orientado: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: 'Un vector es como una flecha: no solo indica una longitud, sino
  también hacia dónde apunta.'
explicacion_formal: '![Definición de vector](/static/img/geometria/cartesiano-vectores/vector-definicion.svg)


  ### Definición formal


  Un vector $\vec{AB}$ es un segmento orientado con punto de origen $A$ y punto de
  extremo (o término) $B$, representado gráficamente mediante una flecha que va desde
  $A$ hasta $B$.


  ### Desarrollo didáctico


  En la figura, el vector va desde el punto $A$ (origen) hasta el punto $B$ (extremo),
  representado por la flecha. A diferencia de un segmento común (sin orientación),
  el vector indica explícitamente una dirección de recorrido: de A hacia B, no al
  revés.'
definiciones_clave: '- **Definición de vector como ente geométrico orientado**: Elemento
  o propiedad fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
