procedimiento:
- 'Paso 1: Identifica el punto de origen del vector (donde comienza la flecha).'
- 'Paso 2: Identifica el punto de extremo del vector (donde termina la flecha, indicado
  por la punta).'
- 'Paso 3: Reconoce que el vector representa una magnitud orientada, no solo una longitud.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con definición de vector como ente geométrico orientado.
