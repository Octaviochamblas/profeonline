semantic_id: MAT.ALG.FUNCION_AFIN.DEFINICION
resumen_inicial: La función afín es una función polinómica de primer grado de la forma $f(x) = mx + n$ con $m \neq 0$ y $n \neq 0$, cuya gráfica es una recta que no pasa por el origen.
explicacion_simple: '![La función afín es una función polinómica de primer grado de la forma $f(x) = mx + n$ con $m \neq 0$ y $n \neq 0$, cuya gráfica es una recta que no pasa por el origen](/static/img/nodos/estudio-de-la-funcion-afin-intro.svg)



  Una **función afín** tiene la forma $f(x) = mx + n$, donde:

  - $m$ es la **pendiente** (la inclinación de la recta).

  - $n$ es el **coeficiente de posición** (el valor donde la recta cruza el eje vertical $Y$).


  A diferencia de la función lineal, como aquí $n \neq 0$, cuando evaluamos en $x = 0$ obtenemos $f(0) = n$.


  Esto significa que la gráfica **no pasa por el origen $(0, 0)$**, sino por el punto $(0, n)$.'
explicacion_formal: 'Una **función afín** real es una aplicación $f: \mathbb{R} \to \mathbb{R}$ definida mediante:

  $$f(x) = mx + n, \quad m, n \in \mathbb{R} \setminus \{0\}$$


  **Propiedades analíticas:**

  - **Dominio y Recorrido**: $\text{Dom}(f) = \mathbb{R}$, $\text{Rec}(f) = \mathbb{R}$.

  - **Biyección**: Al tener $m \neq 0$, toda función afín es una biyección de $\mathbb{R}$ en $\mathbb{R}$.

  - **Tasa de cambio**: $\frac{f(x_2) - f(x_1)}{x_2 - x_1} = m$ (constante en todo el dominio).

  - **Inversa afín**: Posee función inversa $f^{-1}(x) = \frac{x - n}{m} = \frac{1}{m}x - \frac{n}{m}$, la cual también es una función afín.'
definiciones_clave: '- **Función afín**: Función polinómica de primer grado con término constante no nulo ($y = mx + n$).

  - **Coeficiente de posición $n$**: Ordenada en el origen que define el desplazamiento vertical respecto a $y = mx$.'
propiedades_relaciones: '- **No homogeneidad**: En general $f(x_1 + x_2) \neq f(x_1) + f(x_2)$ y $f(kx) \neq kf(x)$ debido al sumando $n$.

  - **Paralelismo con función lineal**: Su gráfica es estrictamente paralela a la recta lineal $y = mx$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La función afín es una función polinómica de primer grado de la forma $f(x) = mx + n$ con $m \neq 0$ y $n \neq 0$, cuya gráfica es una recta que no pasa por el origen](/static/img/nodos/estudio-de-la-funcion-afin-ejemplos.svg)



    Dada la función afín $f(x) = -2x + 6$, determina su pendiente, su coeficiente de posición, su corte con el eje Y y calcula $f(4)$.'
  pasos:
  - 'Paso 1: Identificar la pendiente: $m = -2$ (coeficiente de $x$).'
  - 'Paso 2: Identificar el coeficiente de posición: $n = 6$ (término constante).'
  - 'Paso 3: Determinar el punto de corte con el eje Y: $(0, n) = (0, 6)$.'
  - 'Paso 4: Evaluar en $x = 4$: $f(4) = -2(4) + 6 = -8 + 6 = -2$.'
  - 'Paso 5: Concluir que es una función afín decreciente con intercepto en $(0, 6)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la diferencia estructural clave entre una función lineal y una función afín?
  choices:
  - text: La función lineal pasa por el origen (n = 0), mientras que la función afín tiene n != 0 y no pasa por el origen.
    is_correct: true
  - text: La función lineal tiene exponente 2.
    is_correct: false
  - text: La función afín tiene pendiente cero.
    is_correct: false
  - text: La función lineal no tiene pendiente.
    is_correct: false
  explanation: La alternativa correcta es 'La función lineal pasa por el origen (n = 0), mientras que la función afín tiene n != 0 y no pasa por el origen.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la función $f(x) = 5x - 15$, ¿cuál es el par ordenado donde la recta corta al eje Y?
  choices:
  - text: (0, -15)
    is_correct: true
  - text: (0, 15)
    is_correct: false
  - text: (3, 0)
    is_correct: false
  - text: (-15, 0)
    is_correct: false
  explanation: La alternativa correcta es '(0, -15)'. El corte con el eje Y ocurre en $(0, n) = (0, -15)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la función en la forma explícita $f(x) = mx + n$.'
- 'Paso 2: Identificar la pendiente $m$ y el coeficiente de posición $n$.'
- 'Paso 3: Ubicar el corte con el eje Y en el punto $(0, n)$.'
- 'Paso 4: Evaluar preimágenes sustituyendo $x$ y resolviendo las operaciones respetando la jerarquía.'
errores_correccion: '- **Error común:** Omitir el signo negativo del coeficiente de posición en funciones como $f(x) = 3x - 8$.

  - **Cómo corregirlo:** En $f(x) = 3x - 8$, el término constante es $n = -8$, por lo que el corte con el eje Y está en $(0, -8)$ y no en $(0, 8)$.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de parámetros'
  enunciado: En $f(x) = 4 - 3x$, ¿cuáles son los valores de la pendiente $m$ y el coeficiente de posición $n$?
  alternativas:
  - m = -3, n = 4
  - m = 4, n = -3
  - m = 3, n = 4
  - m = -3, n = -4
  respuesta: m = -3, n = 4
  solucion_pasos:
  - 'Paso 1: Reordenar la expresión: $f(x) = -3x + 4$.'
  - 'Paso 2: $m = -3$ y $n = 4$.'
- titulo: 'Ejemplo 2: Evaluación con signos'
  enunciado: Para $g(x) = -2x - 7$, calcula $g(-3)$.
  alternativas:
  - '-1'
  - '1'
  - '-13'
  - '13'
  respuesta: '-1'
  solucion_pasos:
  - 'Paso 1: $g(-3) = -2(-3) - 7 = 6 - 7 = -1$.'
- titulo: 'Ejemplo 3: Preimagen en función afín'
  enunciado: Si $h(x) = 5x + 3$, ¿cuál es la preimagen de $28$?
  alternativas:
  - '5'
  - '6'
  - '143'
  - '25'
  respuesta: '5'
  solucion_pasos:
  - 'Paso 1: $5x + 3 = 28 \implies 5x = 25 \implies x = 5$.'
- titulo: 'Ejemplo 4: Clasificación conceptual'
  enunciado: ¿Cuál de las siguientes fórmulas describe una función afín?
  alternativas:
  - f(x) = 2x - 1
  - f(x) = 2x
  - f(x) = 2
  - f(x) = x^2 - 1
  respuesta: f(x) = 2x - 1
  solucion_pasos:
  - 'Paso 1: $f(x) = 2x - 1$ tiene $m = 2 \neq 0$ y $n = -1 \neq 0$, siendo afín.'
errores_frecuentes:
- Confundir la función afín con la lineal afirmando que pasa por el origen.
- Olvidar los signos negativos en los coeficientes.
- Identificar como pendiente el primer número sin verificar el término que contiene a x.
afirmaciones_verdaderas:
- Una función afín f(x) = mx + n tiene gráfica rectilínea que no pasa por el origen de coordenadas.
- El dominio y el recorrido de toda función afín son el conjunto de los números reales R.
al_terminar_debes_poder: '**QUÉ:** Analizar, evaluar y definir funciones afines de primer grado.


  **CÓMO:** Identificando sus parámetros canónicos m y n y reconociendo su comportamiento geométrico y algebraico.


