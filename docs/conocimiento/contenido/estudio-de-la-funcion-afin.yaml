errores_frecuentes:
  - 'La función afín $f(x) = mx + b$ con $b \neq 0$ pasa siempre por el origen de coordenadas $(0, 0)$.'
  - 'El recorrido de la función afín $f(x) = 2x - 5$ se limita exclusivamente al intervalo $[0, +\infty[$.'
  - 'Si la pendiente $m$ de una función afín es positiva, el coeficiente de posición $b$ debe ser obligatoriamente positivo.'
  - 'Una función afín se transforma en una recta vertical cuando el valor del coeficiente de posición es $b = 0$.'
  - 'Evaluar $f(x) = mx + b$ en un valor negativo de $x$ es una operación matemáticamente indefinida.'
afirmaciones_verdaderas:
  - 'Una función afín es de la forma $f(x) = mx + b$ con $m \neq 0$ y $b \neq 0$, cuyo gráfico es una recta que no pasa por el origen $(0, 0)$.'
  - 'El parámetro $m$ fija la inclinación y monotonía de la recta mientras que el parámetro $b$ determina el punto de intersección $(0, b)$ con el eje $Y$.'
al_terminar_debes_poder: |
