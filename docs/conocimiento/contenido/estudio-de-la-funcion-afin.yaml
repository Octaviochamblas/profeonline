semantic_id: MAT.ALG.FUNCION_AFIN.DEFINICION
resumen_inicial: La función afín es de la forma $f(x) = mx + b$ con $b \neq 0$, representando una recta desplazada que no pasa por el origen $(0, 0)$.
explicacion_simple: |
  Una **función afín** es la combinación de una pendiente y un desplazamiento:

  - Su fórmula es **$f(x) = mx + b$**.
  - $m$ es la **pendiente** (qué tan empinada está).
  - $b$ es el **coeficiente de posición** (dónde corta al eje vertical $Y$).
  - **Diferencia clave:** Como $b \neq 0$, la gráfica **NO pasa por $(0, 0)$**.
explicacion_formal: |
  Una función $f: \mathbb{R} \to \mathbb{R}$ es una **función afín** si se expresa mediante la regla:

  $$f(x) = mx + b \quad \text{con } m \in \mathbb{R} \setminus \{0\} \ \text{y } b \in \mathbb{R} \setminus \{0\}$$

  **Propiedades fundamentales:**
  - **Dominio**: $\text{Dom}(f) = \mathbb{R}$
  - **Recorrido**: $\text{Rec}(f) = \mathbb{R}$
  - **Pendiente**: $m$
  - **Corte eje $Y$**: $(0, b)$ con $b \neq 0$
  - **Corte eje $X$**: $\left(-\frac{b}{m}, 0\right)$
definiciones_clave: |
  - **Función afín ($f(x) = mx + b$)**: Función polinómica de primer grado con término independiente no nulo $b \neq 0$.
propiedades_relaciones: |
  - **Monotonía**:
    - Si $m > 0$, la función afín es estrictamente creciente.
    - Si $m < 0$, la función afín es estrictamente decreciente.
ejemplo_guiado:
  enunciado: "Analiza la función afín $f(x) = -2x + 6$. Identifica su pendiente, su coeficiente de posición, sus cortes con los ejes y su monotonía."
  pasos:
    - 'Paso 1: Extraer los parámetros: pendiente $m = -2$ y coeficiente de posición $b = 6$.'
    - 'Paso 2: Determinar el corte con el eje $Y$: punto $(0, 6)$.'
    - 'Paso 3: Determinar el corte con el eje $X$: $-2x + 6 = 0 \implies 2x = 6 \implies x = 3$, luego el punto es $(3, 0)$.'
    - 'Paso 4: Analizar la monotonía: como $m = -2 < 0$, es estrictamente decreciente.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuáles son los cortes con el eje $Y$ y el eje $X$ de la función afín $f(x) = -2x + 6$?"
    choices:
      - {text: "Corta al eje $Y$ en $(0, 6)$ y al eje $X$ en $(3, 0)$", is_correct: true}
      - {text: "Corta al eje $Y$ en $(6, 0)$ y al eje $X$ en $(0, 3)$", is_correct: false}
      - {text: "Corta a ambos ejes en el origen $(0, 0)$", is_correct: false}
      - {text: "Corta al eje $Y$ en $(0, -2)$ y al eje $X$ en $(6, 0)$", is_correct: false}
    explanation: "La alternativa correcta es 'Corta al eje $Y$ en $(0, 6)$ y al eje $X$ en $(3, 0)$'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué diferencia principal existe entre la gráfica de una función lineal $f(x) = mx$ y una función afín $g(x) = mx + b$ ($b \\neq 0$)?"
    choices:
      - {text: "La función lineal pasa por $(0,0)$ y la función afín no pasa por $(0,0)$.", is_correct: true}
      - {text: "La función afín es siempre curva y la lineal es recta.", is_correct: false}
      - {text: "La función lineal no tiene pendiente.", is_correct: false}
      - {text: "La función afín tiene dominio acotado.", is_correct: false}
    explanation: "La alternativa correcta es 'La función lineal pasa por $(0,0)$ y la función afín no pasa por $(0,0)$.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reconocer la estructura $f(x) = mx + b$ verificando que $m \neq 0$ y $b \neq 0$.'
  - 'Paso 2: Identificar $m$ (pendiente) y $b$ (coeficiente de posición).'
  - 'Paso 3: Calcular las intersecciones con los ejes $(0, b)$ y $(-\frac{b}{m}, 0)$.'
  - 'Paso 4: Trazar la recta continua en el plano cartesiano.'
errores_correccion: |
  - **Error común:** Clasificar $f(x) = 3x$ como función afín.
  - **Cómo corregirlo:** Si no hay término $+ b$ (es decir $b = 0$), es una **FUNCIÓN LINEAL**. La **FUNCIÓN AFÍN** requiere $b \neq 0$.
