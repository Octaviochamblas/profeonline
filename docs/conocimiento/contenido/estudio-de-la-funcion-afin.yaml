semantic_id: MAT.ALG.FUNCION_AFIN.DEFINICION
resumen_inicial: La función afín se expresa como $f(x) = m x + n$ (con $m \neq 0$
  y $n \neq 0$), representando una recta desfasada que no pasa por el origen.
explicacion_simple: 'Una **función afín** tiene la estructura $f(x) = m x + n$:

  - $m$ es la **pendiente** (mide la inclinación de la recta).

  - $n$ es el **coeficiente de posición** (indica la altura a la que cruza el eje
  vertical $Y$).

  A diferencia de la función lineal, como $n \neq 0$, al evaluar $x = 0$ obtenemos
  $f(0) = n \neq 0$, por lo que **NO pasa por el origen $(0,0)$**.'
explicacion_formal: 'La **función afín** $f: \mathbb{R} \to \mathbb{R}$ con constante
  de pendiente $m \in \mathbb{R} \setminus \{0\}$ e intersección $n \in \mathbb{R}
  \setminus \{0\}$ se define formalmente como:


  $$f(x) = m x + n$$


  **Desglose de la fórmula:**

  - $\operatorname{Dom}(f) = \mathbb{R}$

  - $\operatorname{Rec}(f) = \mathbb{R}$

  - $f(0) = n \neq 0$: Intersección puntual con el eje de las ordenadas en $(0, n)$.'
definiciones_clave: '- **Función afín ($f(x) = m x + n$)**: Relación funcional lineal
  desfasada por una constante $n \neq 0$.

  - **Coeficiente de posición ($n$)**: Término independiente que fija la altura de
  cruce con el eje vertical $Y$.'
propiedades_relaciones: '- **No pasa por el origen**: $(0,0) \notin G(f)$ puesto que
  $n \neq 0$.'
ejemplo_guiado:
  enunciado: Dada la función afín $f(x) = 2x - 5$, identifica su pendiente $m$, su
    coeficiente de posición $n$, y calcula su corte con el eje $Y$.
  pasos:
  - 'Paso 1: Comparar la fórmula $f(x) = 2x - 5$ con el modelo $m x + n$.Paso 2: Identificar
    el coeficiente multiplicativo de $x$: pendiente $m = 2$.Paso 3: Identificar el
    término independiente: coeficiente de posición $n = -5$.Paso 4: Evaluar $x = 0$:
    $f(0) = 2(0) - 5 = -5 \implies$ corte con eje $Y$ en $(0, -5)$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función afín $f(x) = 2x - 5$, ¿cuál es el coeficiente de posición
    $n$ y en qué punto cruza al eje Y?
  choices:
  - text: $n = -5$, cortando al eje Y en el punto $(0, -5)$.
    is_correct: true
  - text: $n = 2$, cortando al eje Y en el punto $(0, 2)$.
    is_correct: false
  - text: $n = 5$, cortando al eje Y en el punto $(5, 0)$.
    is_correct: false
  - text: $n = -5$, cortando al eje Y en el punto $(-5, 0)$.
    is_correct: false
  explanation: La alternativa correcta es '$n = -5$, cortando al eje Y en el punto
    $(0, -5)$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la diferencia fundamental entre una función lineal $f(x) = m
    x$ y una función afín $f(x) = m x + n$?
  choices:
  - text: La función lineal pasa por el origen $(0,0)$, mientras que la función afín
      tiene $n \neq 0$ y no pasa por el origen.
    is_correct: true
  - text: La función afín es una curva y la lineal es una recta.
    is_correct: false
  - text: La función lineal no tiene pendiente.
    is_correct: false
  - text: La función afín no está definida en los números reales.
    is_correct: false
  explanation: La alternativa correcta es 'La función lineal pasa por el origen $(0,0)$,
    mientras que la función afín tiene $n \neq 0$ y no pasa por el origen.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la función en forma explícita $f(x) = m x + n$.'
- 'Paso 2: Extraer la pendiente $m$ como el coeficiente numérico que multiplica a
  $x$.'
- 'Paso 3: Extraer el coeficiente de posición $n$ como la constante suelta sumando
  o restando.'
- 'Paso 4: Declarar el punto de corte con el eje $Y$ como $(0, n)$.'
errores_correccion: '- **Error común:** Confundir el orden de las componentes en el
  corte con el eje $Y$ escribiendo $(n, 0)$ en vez de $(0, n)$.

  - **Cómo corregirlo:** El corte con el eje $Y$ ocurre cuando $x = 0$, por lo tanto
  la abscisa es siempre 0: $(0, n)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de función afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función afín f(x) = mx + n con n != 0 pasa por el origen (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - No, porque f(0) = n != 0.
- titulo: ¿El coeficiente de posición n indica la ordenada de corte con el eje Y?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta corta al eje Y en el punto (0, n).
errores_frecuentes:
- Confundir el coeficiente de posición $n$ (corte con el eje $Y$) con la intersección
  con el eje $X$.
- Asumir que la pendiente es siempre el primer número escrito en la fórmula sin verificar
  si acompaña a la variable $x$.
- Responder la intersección con un eje entregando solo un número suelto en lugar del
  par ordenado correspondiente.
- Confundir 'el cero de una función' (resolver $f(x)=0$) con 'evaluar en cero' (calcular
  $f(0)$).
- Cometer errores de signo al restar coordenadas negativas al aplicar la fórmula punto-pendiente.
afirmaciones_verdaderas:
- La función afín $f(x) = m x + n$ corta al eje vertical $Y$ en el punto $(0, n)$
  y al eje horizontal $X$ en $\left(-\frac{n}{m}, 0\right)$.
- La gráfica de una función afín es paralela a la gráfica de la función lineal $g(x)
  = m x$ trasladada verticalmente $n$ unidades.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y graficar
  funciones afines, identificando pendiente, coeficiente de posición, intersecciones
  con los ejes, ceros y fórmulas desde dos puntos.
