semantic_id: MAT.ALG.FUNCION_AFIN.DEFINICION
resumen_inicial: 'Estudio de la función afín: conceptos, representación y propiedades
  en Función afín.'
explicacion_simple: 'A diferencia de la función lineal, la afín tiene un "punto de
  partida" distinto de cero: ya trae un valor inicial antes de que la variable empiece
  a influir.'
explicacion_formal: '### Definición formal


  Una función $f: \mathbb{R} \to \mathbb{R}$ se llama afín si existen constantes $m,
  n \in \mathbb{R}$, con $n \neq 0$, tales que $f(x) = mx + n$ para todo $x$. La función
  lineal ($n=0$) y la constante ($m=0$) son casos particulares relacionados, pero
  no afines en sentido estricto según esta definición.


  ### Desarrollo didáctico


  La estructura es "parte variable más parte fija": el término $mx$ cambia según $x$,
  mientras que $n$ permanece igual siempre.


  Si un plan de telefonía cuesta \$5000 fijos más \$100 por cada minuto usado, el
  costo se modela como $C(x) = 100x + 5000$: aquí $m=100$ (costo por minuto) y $n=5000$
  (cargo fijo, presente incluso sin usar minutos).'
definiciones_clave: '- **Estudio de la función afín**: Elemento central en el estudio
  de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a estudio de la función afín.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a estudio de la función
    afín.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a estudio de la función afín.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    estudio de la función afín?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en función afín
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en función afín. Es la condición de existencia
    y unicidad en estudio de la función afín.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en estudio de la función
    afín, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica que la fórmula tenga la forma $mx+n$.'
- 'Paso 2: Identifica el coeficiente $m$ que acompaña a la variable (la pendiente).'
- 'Paso 3: Identifica el término independiente $n$ (el coeficiente de posición).'
- 'Paso 4: Confirma que $n \neq 0$ para distinguirla de la función lineal.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar estudio de la función afín.
ejemplos:
- titulo: Identificación de función afín
  enunciado: Determina si $f(x) = 3x - 7$ es una función afín, e identifica $m$ y
    $n$.
  solucion_pasos:
  - Tiene la forma $mx+n$ con $n=-7 \neq 0$.
  - $m=3$, $n=-7$.
- titulo: Comparación lineal versus afín
  enunciado: Compara $f(x) = 5x$ con $g(x) = 5x + 2$.
  solucion_pasos:
  - $f$ es lineal, sin término independiente.
  - $g$ es afín, con $n=2 \neq 0$.
- titulo: ¿$f(x) = 4x$ es una función afín?
  enunciado: ¿$f(x) = 4x$ es una función afín?
  respuesta: 'No'
  solucion_pasos:
  - No tiene término independiente distinto de cero; es lineal, no afín.
- titulo: ¿Toda función lineal puede considerarse un caso particular relacionado con
    la familia afín?
  enunciado: ¿Toda función lineal puede considerarse un caso particular relacionado
    con la familia afín?
  respuesta: Sí
  solucion_pasos:
  - La lineal comparte la forma $mx+n$ con $n=0$, aunque estrictamente se distingue
    de la afín por esa condición.
errores_frecuentes:
- Confundir "afín" con "lineal", usando los términos como sinónimos exactos.
- Olvidar identificar correctamente cuál coeficiente es $m$ y cuál es $n$.
- Creer que $m$ debe ser positivo en toda función afín.
- No verificar la condición $n\neq0$ al clasificar entre lineal y afín.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando estudio
  de la función afín.
