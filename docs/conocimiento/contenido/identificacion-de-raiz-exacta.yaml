semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_EXACTA
resumen_inicial: Una raíz es exacta si el radicando $a$ es una potencia $n$-ésima
  perfecta, dando como resultado un número entero o racional exacto.
explicacion_simple: Una raíz exacta es aquella cuyo resultado es un número entero
  limpio sin decimales infinitos. Por ejemplo, $\sqrt{25} = 5$ y $\sqrt[3]{8} = 2$
  son raíces exactas porque $5^2 = 25$ y $2^3 = 8$.
explicacion_formal: 'La expresión $\sqrt[n]{a}$ se clasifica como **Raíz Exacta**
  si el radicando es la potencia $n$-ésima de un entero o racional:


  $$\sqrt[n]{a} \in \mathbb{Q} \iff \exists q \in \mathbb{Q} \text{ tal que } a =
  q^n$$


  **Ejemplos en los racionales:**

  - $\sqrt{49} = 7 \in \mathbb{Z}$.

  - $\sqrt{\frac{9}{16}} = \frac{3}{4} \in \mathbb{Q}$.'
definiciones_clave: '- **Raíz exacta**: Expresión radical cuyo resultado pertenece
  a los números racionales $\mathbb{Q}$ (o enteros $\mathbb{Z}$).'
propiedades_relaciones: '- **Pertenencia a Q**: $\sqrt[n]{a} \in \mathbb{Q}$ para
  potencias $n$-ésimas perfectas.'
ejemplo_guiado:
  enunciado: Determine si las raíces $\sqrt{64}$ y $\sqrt[3]{\frac{1}{27}}$ son raíces
    exactas.
  pasos:
  - 'Paso 1: Evaluar $\sqrt{64}$: como $8^2 = 64 \implies \sqrt{64} = 8 \in \mathbb{Z}$
    (exacta).'
  - 'Paso 2: Evaluar $\sqrt[3]{\frac{1}{27}}$: como $\left(\frac{1}{3}\right)^3 =
    \frac{1}{27} \implies \frac{1}{3} \in \mathbb{Q}$ (exacta).'
  - 'Conclusión: Ambas raíces representan números racionales exactos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué caracteriza a una raíz exacta en los números reales?
  choices:
  - text: Que su resultado es un número racional exacto (entero o fracción en Q)
    is_correct: true
  - text: Que da un decimal infinito no periódico
    is_correct: false
  - text: Que da cero siempre
    is_correct: false
  - text: Que es un número irracional
    is_correct: false
  explanation: La alternativa correcta es 'Que su resultado es un número racional
    exacto (entero o fracción en Q)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt(64), ¿cuál fue el número entero exacto
    resultante?
  choices:
  - text: '8'
    is_correct: true
  - text: '64'
    is_correct: false
  - text: '32'
    is_correct: false
  - text: '16'
    is_correct: false
  explanation: La alternativa correcta es '8'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Descomponer el radicando $a$ en sus factores primos.'
- 'Paso 2: Comprobar si todos los exponentes de los factores primos son divisibles
  exactamente por el índice $n$.'
- 'Paso 3: Calcular el valor racional exacto de la raíz.'
errores_correccion: '- **Error 1: Creer que solo los enteros dan raíces exactas (descartar
  $\sqrt{\frac{4}{9}}$).** **Cómo corregirlo:** La fracción $\sqrt{\frac{4}{9}} =
  \frac{2}{3}$ es una raíz exacta en $\mathbb{Q}$.


  - **Error 2: Confundir una raíz exacta grande con un número irracional (ej: $\sqrt{400}$).**
  **Cómo corregirlo:** $20^2 = 400 \implies \sqrt{400} = 20$ es exacta.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $\sqrt{144}$.
  alternativas:
  - '12'
  - 14,4
  - '72'
  respuesta: '12'
  solucion_pasos:
  - $12^2 = 144 \implies \sqrt{144} = 12$.
- titulo: Ejemplo 2
  enunciado: Calcule $\sqrt[3]{125}$.
  alternativas:
  - '5'
  - '25'
  - '15'
  respuesta: '5'
  solucion_pasos:
  - $5^3 = 125 \implies \sqrt[3]{125} = 5$.
- titulo: ¿Es sqrt(81/100) una raíz exacta igual a 9/10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt{81/100} = 9/10 = 0,9 \in \mathbb{Q}$.
- titulo: ¿Pertenecen todas las raíces exactas al conjunto de los números racionales
    Q?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de potencia perfecta.
errores_frecuentes:
- Las raíces exactas son aquellas cuyo radicando es un número primo mayor a 10.
- Una raíz exacta de una fracción propia produce un número irracional con barra.
- La raíz cuadrada de 100 equivale numéricamente a la aproximación decimal 10,00001.
- Clasificar $\sqrt{36}$ como un número irracional por tener el símbolo de raíz.
- Las raíces cúbicas exactas dan siempre como resultado un número entero negativo.
afirmaciones_verdaderas:
- Una raíz es exacta si su radicando es una potencia perfecta del índice, perteneciendo
  el resultado a $\mathbb{Q}$.
- La raíz cuadrada de cuadrados perfectos como 1, 4, 9, 16, 25, 36, 49, 64, 81, 100
  son números enteros exactos.
al_terminar_debes_poder: Al terminar serás capaz de identificar y calcular raíces
  exactas $\sqrt[n]{a} \in \mathbb{Q}$, reconociendo radicandos que son potencias
  perfectas del índice.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
