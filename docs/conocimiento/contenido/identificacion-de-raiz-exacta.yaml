semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_EXACTA
resumen_inicial: Una raíz exacta es aquella cuyo resultado es un número racional ($\mathbb{Q}$), lo que ocurre cuando el radicando es una potencia $n$-ésima perfecta de un número racional.
explicacion_simple: '![Identificación de raíz exacta](/static/img/nodos/identificacion-de-raiz-exacta-intro.svg)


  Una raíz es **exacta** cuando su resultado es un número ''limpio'': un entero, una fracción o un decimal finito/periódico (es decir, un número racional $\mathbb{Q}$).

  - Por ejemplo, $\sqrt{25} = 5$ es exacta porque $5^2 = 25$.

  - La raíz $\sqrt{\frac{9}{64}} = \frac{3}{8}$ es exacta porque $\left(\frac{3}{8}\right)^2 = \frac{9}{64}$.

  - Para saber si es exacta, descompón el número en factores primos y comprueba si todos sus exponentes se pueden dividir exactamente por el índice de la raíz.'
explicacion_formal: 'Sea $\sqrt[n]{a}$ una raíz real ($a \ge 0$ si $n$ es par). Se define como **Raíz Exacta** a aquella que satisface:


  $$\sqrt[n]{a} = b \in \mathbb{Q}$$


  **Criterio Fundamental de Factorización Prima:**

  Sea la descomposición prima de un número natural $a = p_1^{k_1} \cdot p_2^{k_2} \cdots p_r^{k_r}$. La raíz $\sqrt[n]{a}$ es exacta en $\mathbb{Q}$ si y solo si:

  $$n \mid k_i \quad (\text{el índice } n \text{ divide exactamente a cada exponente } k_i, \forall i \in \{1, \dots, r\})$$


  **Extensión a Fracciones y Decimales:**

  - $\sqrt[n]{\frac{p}{q}} \in \mathbb{Q} \iff \sqrt[n]{p} \in \mathbb{Q} \text{ y } \sqrt[n]{q} \in \mathbb{Q}$ (ambos términos son potencias $n$-ésimas perfectas).

  - En decimales finitos, se transforma primero a fracción irreductible: $\sqrt{0,04} = \sqrt{\frac{4}{100}} = \frac{2}{10} = 0,2 \in \mathbb{Q}$.'
definiciones_clave: '- **Raíz exacta**: Radical cuyo valor pertenece al conjunto de los números racionales $\mathbb{Q}$.

  - **Cuadrado/Cubo perfecto**: Número entero que es el cuadrado/cubo de otro entero.

  - **Divisibilidad de exponentes**: Condición de que todos los exponentes primos sean múltiplos del índice.'
propiedades_relaciones: '- **Pertenencia a racionales**: Toda raíz exacta es un elemento de $\mathbb{Q}$.

  - **Descomposición factorial**: $\sqrt{144} = \sqrt{2^4 \cdot 3^2} = 2^2 \cdot 3 = 12$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de identificación de raíz exacta](/static/img/nodos/identificacion-de-raiz-exacta-ejemplos.svg)


    Identifique si las raíces $\sqrt{144}$, $\sqrt{\frac{9}{64}}$ y $\sqrt{0,04}$ son exactas y calcule su valor en $\mathbb{Q}$.'
  pasos:
  - 'Paso 1: Evaluar $\sqrt{144}$: Descomposición $144 = 12^2$. Como $12 \in \mathbb{Z} \subset \mathbb{Q}$, es exacta y vale $12$.'
  - 'Paso 2: Evaluar $\sqrt{\frac{9}{64}}$: $\sqrt{9} = 3$ y $\sqrt{64} = 8$. Resultado $\frac{3}{8} \in \mathbb{Q}$ (exacta).'
  - 'Paso 3: Evaluar $\sqrt{0,04}$: Convertir a fracción $\sqrt{\frac{4}{100}} = \frac{2}{10} = 0,2 \in \mathbb{Q}$ (exacta).'
  - 'Conclusión: Todas son raíces exactas pertenecientes a $\mathbb{Q}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes raíces es una raíz exacta en $\mathbb{Q}$?
  choices:
  - text: $\sqrt{\frac{25}{49}}$ (porque $\sqrt{25}=5$ y $\sqrt{49}=7$, dando $\frac{5}{7} \in \mathbb{Q}$)
    is_correct: true
  - text: $\sqrt{20}$
    is_correct: false
  - text: $\sqrt[3]{16}$
    is_correct: false
  - text: $\sqrt{0,4}$
    is_correct: false
  explanation: La alternativa correcta es '$\sqrt{\frac{25}{49}}$ (porque $\sqrt{25}=5$ y $\sqrt{49}=7$, dando $\frac{5}{7} \in \mathbb{Q}$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\sqrt{0,04}$ dio como resultado $0,2$ y no $0,02$?
  choices:
  - text: Porque $(0,2)^2 = 0,04$, o equivalentemente $\sqrt{4/100} = 2/10 = 0,2$
    is_correct: true
  - text: Porque la raíz duplica los ceros
    is_correct: false
  - text: Porque $0,02 \times 2 = 0,04$
    is_correct: false
  - text: Fue un error de aproximación
    is_correct: false
  explanation: La alternativa correcta es 'Porque $(0,2)^2 = 0,04$, o equivalentemente $\sqrt{4/100} = 2/10 = 0,2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expresar el radicando en forma entera o fraccionaria irreducible.'
- 'Paso 2: Descomponer en factores primos los términos del radicando.'
- 'Paso 3: Verificar si el índice divide exactamente a todos los exponentes; si es así, extraer la raíz dividiendo los exponentes por el índice.'
errores_correccion: '- **Error 1: Creer que $\sqrt{0,4} = 0,2$.** **Cómo corregirlo:** $(0,2)^2 = 0,04 \neq 0,4$. Escribir $\sqrt{0,4} = \sqrt{4/10} = 2/\sqrt{10}$, que es irracional.

  - **Error 2: Asumir que toda raíz con número grande es inexacta.** **Cómo corregirlo:** Descomponer en factores primos para comprobar divisibilidad.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de la raíz exacta $\sqrt{81}$?
  alternativas:
  - $9$
  - $18$
  - $3$
  respuesta: $9$
  solucion_pasos:
  - $9^2 = 81 \implies \sqrt{81} = 9$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\sqrt[3]{\frac{8}{27}}$?
  alternativas:
  - $\frac{2}{3}$
  - $\frac{4}{9}$
  - $\frac{2}{9}$
  respuesta: $\frac{2}{3}$
  solucion_pasos:
  - $\sqrt[3]{8} / \sqrt[3]{27} = 2/3$.
- titulo: ¿Es √0,09 una raíz exacta igual a 0,3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt{0,09} = \sqrt{9/100} = 3/10 = 0,3 \in \mathbb{Q}$.
  alternativas:
  - texto: Sí, 0,3² = 0,09
    es_correcta: true
    retroalimentacion: ¡Correcto! Decimal finito exacto.
  - texto: No, es igual a 0,03
    es_correcta: false
    retroalimentacion: Incorrecto, $(0,03)^2 = 0,0009$.
  - texto: No, es un número irracional
    es_correcta: false
    retroalimentacion: Incorrecto, es racional.
- titulo: ¿Es √50 una raíz exacta?
  respuesta: 'No'
  solucion_pasos:
  - No, $50 = 2 \cdot 5^2$. El exponente del 2 es 1 (no divisible por 2), por lo que $\sqrt{50} = 5\sqrt{2} \notin \mathbb{Q}$.
  alternativas:
  - texto: No, 50 no es un cuadrado perfecto (es 5√2 irracional)
    es_correcta: true
    retroalimentacion: ¡Correcto! No produce un número racional.
  - texto: Sí, es igual a 25
    es_correcta: false
    retroalimentacion: Incorrecto, $25^2 = 625$.
  - texto: Sí, es igual a 5
    es_correcta: false
    retroalimentacion: Incorrecto, $5^2 = 25$.
errores_frecuentes:
- Confundir $\sqrt{0,4}$ con $\sqrt{0,04}$.
- Dividir el radicando por 2 en vez de buscar la raíz cuadrada.
- No simplificar fracciones antes de evaluar si son exactas.
- Asumir que solo los enteros pueden tener raíces exactas.
- Olvidar verificar la divisibilidad de todos los exponentes primos.
afirmaciones_verdaderas:
- Toda raíz exacta tiene como resultado un número perteneciente a $\mathbb{Q}$.
- Un número entero tiene raíz enésima exacta si todos los exponentes de su factorización prima son múltiplos de $n$.
- Las fracciones con numerador y denominador cuadrados perfectos generan raíces cuadradas exactas.
al_terminar_debes_poder: '![Síntesis de raíces exactas](/static/img/nodos/identificacion-de-raiz-exacta-resumen.svg)


  QUÉ: Identificar, justificar y calcular raíces exactas en el conjunto de los números racionales $\mathbb{Q}$.


  CÓMO: Descomponiendo el radicando en factores primos, verificando la divisibilidad de sus exponentes por el índice $n$ y expresando el resultado como entero o fracción irreducible.'
