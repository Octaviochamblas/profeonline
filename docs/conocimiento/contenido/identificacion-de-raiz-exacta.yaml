semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_EXACTA
resumen_inicial: Una raíz es exacta cuando su resultado es un número entero o racional exacto,
  debido a que el radicando es una potencia perfecta respecto al índice de la raíz.
explicacion_simple: 'Una raíz es exacta cuando da como resultado un número entero o una fracción
  ''limpia'', sin decimales infinitos ni símbolos de raíz:

  - $\sqrt{49} = 7$ (exacta, pues $7^2 = 49$).

  - $\sqrt[3]{27} = 3$ (exacta, pues $3^3 = 27$).

  - $\sqrt{\frac{9}{16}} = \frac{3}{4}$ (exacta, pues $(\frac{3}{4})^2 = \frac{9}{16}$).'
explicacion_formal: Dada $\sqrt[n]{a}$, la raíz se denomina exacta si y solo si existe $q
  \in \mathbb{Q}$ tal que $q^n = a$. En este caso $\sqrt[n]{a} = q \in \mathbb{Q}$. Para enteros,
  $a$ debe ser una potencia $n$-ésima perfecta de un entero.
definiciones_clave: '- **Potencia perfecta**: Número entero o racional que puede expresarse
  como $k^n$ para algún $k \in \mathbb{Q}$.'
propiedades_relaciones: '- **Racionalidad**: Toda raíz exacta representa un número racional
  ($q \in \mathbb{Q}$).'
ejemplo_guiado:
  enunciado: Determina si las raíces A) $\sqrt{64}$ y B) $\sqrt{50}$ son exactas.
  pasos:
  - 'Para A: $8^2 = 64$, de modo que $\sqrt{64} = 8 \in \mathbb{Z}$. Es una raíz exacta.'
  - 'Para B: no existe ningún entero cuyo cuadrado sea 50 ($7^2 = 49$ y $8^2 = 64$). Es una
    raíz no exacta.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes raíces es una raíz EXACTA?
  choices:
  - text: $\sqrt{81}$
    is_correct: true
  - text: $\sqrt{20}$
    is_correct: false
  - text: $\sqrt{12}$
    is_correct: false
  - text: $\sqrt{5}$
    is_correct: false
  explanation: 'La correcta es: $\sqrt{81}$. Como $9^2 = 81$, $\sqrt{81} = 9$ es exacta.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Es $\sqrt[3]{64}$ una raíz exacta?
  choices:
  - text: Sí, porque es igual a 4
    is_correct: true
  - text: No, porque 64 no tiene raíz cúbica
    is_correct: false
  - text: Sí, porque es igual a 8
    is_correct: false
  - text: No, es un irracional
    is_correct: false
  explanation: 'La correcta es: Sí, porque es igual a 4. Puesto que $4^3 = 64$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Descomponer el radicando en factores primos.'
- 'Paso 2: Comprobar si todos los exponentes de los factores primos son múltiplos exactos
  del índice de la raíz.'
- 'Paso 3: Si lo son, simplificar y extraer la raíz entera/racional exacta.'
errores_correccion: No confundas cuadrado perfecto con cubo perfecto. $8$ es cubo perfecto
  ($\sqrt[3]{8} = 2$), pero no es cuadrado perfecto ($\sqrt{8}$ no es exacta).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula la raíz exacta $\sqrt{\frac{25}{36}}$.
  alternativas:
  - 5/6
  - 25/36
  - 5/36
  respuesta: 5/6
  solucion_pasos:
  - $\sqrt{25}/\sqrt{36} = 5/6$.
- titulo: Ejemplo 2
  enunciado: ¿Es la raíz cuarta de 16 una raíz exacta?
  alternativas:
  - Sí, vale 2
  - No, es irracional
  - Sí, vale 4
  respuesta: Sí, vale 2
  solucion_pasos:
  - 2^4 = 16, por lo tanto es exacta.
- titulo: Ejemplo 3
  enunciado: ¿Cuál de las siguientes raíces es exacta?
  alternativas:
  - Raíz cúbica de 125
  - Raíz cúbica de 100
  - Raíz cúbica de 50
  respuesta: Raíz cúbica de 125
  solucion_pasos:
  - 125 = 5^3, es una potencia perfecta cúbica.
- titulo: ¿Es la raíz cuadrada de 121 una raíz exacta?
  respuesta: Sí
  solucion_pasos:
  - 121 = 11^2, un cuadrado perfecto.
errores_frecuentes:
- Confundir el índice al determinar si un radicando es potencia perfecta.
- Pensar que una raíz es exacta solo si el radicando es un cuadrado perfecto, ignorando otros
  índices.
- Confundir una aproximación decimal cercana a un entero con una raíz exacta.
- Olvidar verificar el índice correcto al determinar si un radicando es una potencia perfecta.
- Asumir que todas las raíces de números pares son exactas.
afirmaciones_verdaderas:
- Las raíces exactas dan como resultado números racionales.
- Toda raíz exacta de un número entero da como resultado otro número entero o racional.
al_terminar_debes_poder: Identificar y calcular raíces exactas de números enteros y racionales.
fuente: Texto escolar MINEDUC.
estado: publicado
