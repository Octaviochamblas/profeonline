semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.AMPLIFICACION
resumen_inicial: "La amplificación es el proceso de multiplicar tanto el numerador como el denominador de una fracción por un mismo número entero distinto de cero, obteniendo una fracción equivalente."
explicacion_simple: |
  Amplificar una fracción es como mirar un objeto con una lupa o subdividir los trozos que ya tenías. Si tienes $\frac{1}{2}$ pizza y cortas esa mitad en 3 trozos iguales, ahora tienes 3 trozos de un total de 6 ($\frac{3}{6}$). No ganaste ni perdiste pizza: multiplicaste por 3 tanto las partes que tenías como el total de partes. En matemática, **amplificar** por un número $k$ significa multiplicar arriba y abajo por $k$.
explicacion_formal: |
  Formalmente, dada la fracción $\frac{a}{b}$ (con $b \neq 0$) y un entero amplificador $k \in \mathbb{Z} \setminus \{0\}$, el proceso de **amplificación por $k$** se define mediante la transformación:
  $\frac{a}{b} \xrightarrow{\text{amplificar por } k} \frac{a \cdot k}{b \cdot k}$

  La validez algebraica de este procedimiento se sustenta en la propiedad del elemento neutro multiplicativo $1 = \frac{k}{k}$:
  $\frac{a \cdot k}{b \cdot k} = \frac{a}{b} \cdot \left(\frac{k}{k}\right) = \frac{a}{b} \cdot 1 = \frac{a}{b}$
  Por lo tanto, la fracción amplificada $\frac{a \cdot k}{b \cdot k}$ pertenece a la misma clase de equivalencia que $\frac{a}{b}$.
definiciones_clave: |
  - **Amplificación**: Multiplicación simultánea del numerador y del denominador por un mismo factor entero no nulo $k$.
  - **Factor amplificador ($k$)**: Número entero $k \neq 0$ utilizado para multiplicar ambos términos de la fracción.
  - **Propiedad del neutro multiplicativo**: Justificación matemática basada en que $\frac{k}{k} = 1$.
propiedades_relaciones: |
  - **Generación infinita**: Dado que existen infinitos enteros $k \neq 0$, toda fracción puede amplificarse de infinitas maneras distintas.
  - **Identidad de valor**: El valor decimal y la posición en la recta numérica se conservan intactos tras la amplificación.
  - **Igualación de denominadores**: La amplificación es la herramienta fundamental utilizada para homogenizar denominadores antes de sumar o comparar fracciones.
ejemplo_guiado:
  enunciado: "Amplifica la fracción $\\frac{4}{9}$ por el factor $5$, comprueba su valor resultante y demuestra que la fracción obtenida es equivalente a la original."
  pasos:
    - 'Identificar la fracción original $\frac{4}{9}$ y el factor amplificador $k = 5$.'
    - 'Multiplicar el numerador por $5$: $4 \cdot 5 = 20$.'
    - 'Multiplicar el denominador por $5$: $9 \cdot 5 = 45$.'
    - 'Escribir la fracción amplificada resultante: $\frac{20}{45}$.'
    - 'Verificar equivalencia mediante productos cruzados: $4 \cdot 45 = 180$ y $9 \cdot 20 = 180$. Como $180 = 180$, se demuestra que $\frac{4}{9} = \frac{20}{45}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué propiedad matemática garantiza que al amplificar la fracción $\\frac{a}{b}$ por un factor $k \\neq 0$ el valor de la fracción no cambie?"
    choices:
      - {text: 'La propiedad del neutro multiplicativo, ya que amplificar equivale a multiplicar la fracción por $\frac{k}{k} = 1$.', is_correct: true}
      - {text: "La propiedad del neutro aditivo, ya que se le está sumando cero al numerador y al denominador.", is_correct: false}
      - {text: "La propiedad conmutativa de la adición.", is_correct: false}
      - {text: "La propiedad distributiva de la división por cero.", is_correct: false}
    explanation: 'La correcta es La propiedad del neutro multiplicativo, ya que amplificar equivale a multiplicar la fracción por $\frac{k}{k} = 1$.: multiplicar por $\frac{k}{k}$ es multiplicar por el número $1$.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Si amplificas la fracción $\\frac{3}{8}$ por el factor $6$, ¿cuál es la fracción amplificada obtenida?"
    choices:
      - {text: '\$\frac{18}{48}$', is_correct: true}
      - {text: '\$\frac{18}{8}$', is_correct: false}
      - {text: '\$\frac{3}{48}$', is_correct: false}
      - {text: '\$\frac{9}{14}$', is_correct: false}
    explanation: 'La correcta es$ \frac{18}{48}$: multiplicamos tanto el numerador como el denominador por $6$ ($3 \cdot 6 = 18$ y $8 \cdot 6 = 48$).'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Seleccionar o identificar el factor amplificador $k \neq 0$.'
  - 'Paso 2: Multiplicar el numerador $a$ por $k$ para obtener el nuevo numerador $a \cdot k$.'
  - 'Paso 3: Multiplicar el denominador $b$ por $k$ para obtener el nuevo denominador $b \cdot k$.'
  - 'Paso 4: Escribir la nueva fracción $\frac{a \cdot k}{b \cdot k}$.'
errores_correccion: |
  El error más común es multiplicar únicamente el numerador y olvidar multiplicar el denominador (por ejemplo, hacer de $\frac{2}{5}$ por 3 el resultado $\frac{6}{5}$). Recuerda que si no multiplicas ambos términos por el mismo número, estás cambiando el valor real de la fracción.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál es el resultado de amplificar $\\frac{5}{7}$ por 4?"
    alternativas:
      - '\$\frac{20}{28}$'
      - '\$\frac{20}{7}$'
      - '\$\frac{5}{28}$'
    respuesta: '\$\frac{20}{28}$'
    solucion_pasos:
      - 'Multiplicamos el numerador: $5 \cdot 4 = 20$.'
      - 'Multiplicamos el denominador: $7 \cdot 4 = 28$.'
      - 'La fracción resultante es $\frac{20}{28}$.'
  - titulo: "Ejemplo 2"
    enunciado: "Se requiere convertir la fracción $\\frac{2}{3}$ en una fracción equivalente que tenga denominador 15. ¿Por qué número se debe amplificar?"
    alternativas:
      - 'Se debe amplificar por 5, obteniendo \$\frac{10}{15}$.'
      - 'Se debe amplificar por 3, obteniendo \$\frac{6}{15}$.'
      - 'Se debe amplificar por 12, obteniendo \$\frac{24}{15}$.'
    respuesta: 'Se debe amplificar por 5, obteniendo \$\frac{10}{15}$.'
    solucion_pasos:
      - 'Buscamos el factor $k$ tal que $3 \cdot k = 15 \implies k = 5$.'
      - 'Amplificamos la fracción completa por 5: $\frac{2 \cdot 5}{3 \cdot 5} = \frac{10}{15}$.'
  - titulo: "¿Se puede amplificar una fracción por cualquier número entero positivo mayor que cero?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, cualquier factor entero $k \neq 0$ genera una fracción equivalente válida.'
  - titulo: "¿Cambia el valor decimal de una fracción después de ser amplificada?"
    respuesta: "No"
    solucion_pasos:
      - "No, el valor cuantitativo se mantiene idéntico porque amplificar equivale a multiplicar por 1."
errores_frecuentes:
  - "Multiplicar solo el numerador dejando el denominador intacto."
  - "Multiplicar el numerador por un número y el denominador por un número distinto."
  - "Confundir amplificar (multiplicar) con simplificar (dividir)."
  - 'Intentar amplificar multiplicando por cero, lo que generaría $\frac{0}{0}$.'
  - "Creer que la fracción amplificada representa una cantidad mayor que la fracción original."
afirmaciones_verdaderas:
  - "Amplificar una fracción consiste en multiplicar tanto su numerador como su denominador por un mismo número no nulo."
  - "Una fracción y su versión amplificada son siempre equivalentes y representan el mismo valor numérico."
al_terminar_debes_ponder: |
  Debes ser capaz de amplificar cualquier fracción por un factor dado, determinar el factor necesario para obtener un denominador específico y justificar la conservación del valor numérico.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
