semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.AMPLIFICACION
resumen_inicial: 'Amplificar una fracción consiste en multiplicar simultáneamente su numerador y su denominador por un mismo entero distinto de cero: $\frac{a \cdot k}{b \cdot k}$.'
explicacion_simple: 'Amplificar una fracción significa multiplicar tanto el número de arriba como el número de abajo por exactamente el mismo número. Al hacerlo obtenemos una fracción con números más grandes pero que vale exactamente lo mismo, ya que equivale a dividir las partes del todo en trozos más pequeños sin alterar la cantidad total.


  ![Amplificación de fracciones](/static/img/nodos/amplificacion-de-fracciones-intro.svg)'
explicacion_formal: 'Dada la fracción $\frac{a}{b} \in \mathbb{Q}$ y un factor $k \in \mathbb{Z} \setminus \{0\}$, la **Operación de Amplificación** se define como:


  $$\operatorname{Amp}_k\left(\frac{a}{b}\right) = \frac{a \cdot k}{b \cdot k} \quad \text{donde } \frac{a \cdot k}{b \cdot k} \sim \frac{a}{b}$$


  **Desglose de la fórmula:**

  - $k \neq 0$: Factor amplificador entero no nulo.

  - $\frac{k}{k} = 1$: Neutro multiplicativo en $\mathbb{Q}$ que garantiza que el valor cuantitativo permanezca inalterado ($q \cdot 1 = q$).


  > **Complemento didáctico:** Amplificar por $k$ equivale matemáticamente a multiplicar la fracción por $1$ en la forma de la fracción neutra $\frac{k}{k}$.'
definiciones_clave: '- **Amplificación de fracciones**: Multiplicación del numerador y denominador por un mismo factor $k \neq 0$.

  - **Factor amplificador**: Número entero $k$ aplicado simétricamente a ambos términos.'
propiedades_relaciones: '- **Generación de equivalencias**: Todo número racional admite infinitas amplificaciones equivalentes.'
ejemplo_guiado:
  enunciado: 'Amplifique la fracción $\frac{3}{4}$ por el factor $5$ y compruebe su equivalencia.


    ![Ejemplo Amplificación de fracciones](/static/img/nodos/amplificacion-de-fracciones-ejemplos.svg)'
  pasos:
  - 'Paso 1: Multiplicar el numerador por 5: $3 \cdot 5 = 15$.'
  - 'Paso 2: Multiplicar el denominador por 5: $4 \cdot 5 = 20$.'
  - 'Paso 3: Escribir la nueva fracción amplificada: $\frac{15}{20}$.'
  - 'Paso 4: Comprobar por productos cruzados: $3 \cdot 20 = 60$ y $4 \cdot 15 = 60$.'
  - 'Conclusión: La fracción amplificada es $\frac{15}{20}$, que es equivalente a $\frac{3}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste la operación de amplificar una fracción por un entero k?
  choices:
  - text: En multiplicar el numerador y el denominador por el mismo entero k
    is_correct: true
  - text: En sumar k al numerador únicamente
    is_correct: false
  - text: En dividir el denominador por k
    is_correct: false
  - text: En elevar al cuadrado el denominador
    is_correct: false
  explanation: La alternativa correcta es 'En multiplicar el numerador y el denominador por el mismo entero k'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, al amplificar 3/4 por 5, ¿cuál fue la fracción obtenida?
  choices:
  - text: 15/20
    is_correct: true
  - text: 8/9
    is_correct: false
  - text: 15/4
    is_correct: false
  - text: 3/20
    is_correct: false
  explanation: La alternativa correcta es '15/20'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar el factor entero $k \neq 0$ por el que se va a amplificar.'
- 'Paso 2: Multiplicar el numerador original por $k$ para hallar el nuevo numerador.'
- 'Paso 3: Multiplicar el denominador original por $k$ para hallar el nuevo denominador.'
errores_correccion: '- **Error 1: Multiplicar solo el numerador y dejar el denominador igual.** **Cómo corregirlo:** La amplificación EXIGE multiplicar AMBOS términos por $k$.


  - **Error 2: Usar factores distintos arriba y abajo ($3 \cdot 2$ y $4 \cdot 5$).** **Cómo corregirlo:** El factor $k$ debe ser ESTRICTAMENTE EL MISMO en numerador y denominador.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Amplifique la fracción 2/7 por 3.
  alternativas:
  - 6/21
  - 5/10
  - 6/7
  respuesta: 6/21
  solucion_pasos:
  - $\frac{2 \cdot 3}{7 \cdot 3} = \frac{6}{21}$.
- titulo: Ejemplo 2
  enunciado: ¿Es 10/16 la amplificación de 5/8 por 2?
  alternativas:
  - Sí, porque 5 · 2 = 10 y 8 · 2 = 16
  - No, le falta simplificar
  - Solo si es impar
  respuesta: Sí, porque 5 · 2 = 10 y 8 · 2 = 16
  solucion_pasos:
  - $\frac{5 \cdot 2}{8 \cdot 2} = \frac{10}{16}$.
- titulo: ¿Conserva la amplificación el mismo valor numérico de la fracción original?
  respuesta: Sí
  solucion_pasos:
  - Sí, amplificar por $k$ equivale a multiplicar por $1 = k/k$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde con precisión a las reglas de equivalencia, simplificación o conversión analizadas.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el algoritmo matemático entrega un resultado único y bien definido.
  - texto: No es posible determinar la equivalencia
    es_correcta: false
    retroalimentacion: Incorrecto, los teoremas y algoritmos de fracciones permiten resolver unívocamente.
- titulo: ¿Se puede amplificar una fracción por el número 0?
  respuesta: 'No'
  solucion_pasos:
  - No, el factor amplificador debe ser distinto de cero ($k \neq 0$).
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde con precisión a las reglas de equivalencia, simplificación o conversión analizadas.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el algoritmo matemático entrega un resultado único y bien definido.
  - texto: No es posible determinar la equivalencia
    es_correcta: false
    retroalimentacion: Incorrecto, los teoremas y algoritmos de fracciones permiten resolver unívocamente.
errores_frecuentes:
- Amplificar una fracción consiste en multiplicar únicamente su numerador dejando su denominador intacto.
- Amplificar por un número entero altera y modifica el valor cuantitativo original de la fracción.
- Se puede amplificar una fracción multiplicando el numerador por 2 y el denominador por 3.
- El número cero es un factor válido para amplificar fracciones racionales.
- La amplificación produce siempre fracciones irreductibles de menor valor.
afirmaciones_verdaderas:
- Amplificar una fracción requiere multiplicar su numerador y su denominador por el mismo entero $k \neq 0$.
- La amplificación produce una fracción equivalente que representa exactamente el mismo punto numérico.
al_terminar_debes_poder: '**QUÉ:** Amplificar fracciones preservando el valor numérico para la homogeneización de denominadores y resolución algebraica.


  **CÓMO:** Multiplicando simultáneamente numerador y denominador por un mismo factor entero no nulo $k \neq 0$ mediante $\frac{a}{b} = \frac{a \cdot k}{b \cdot k}$ (equivalente a multiplicar por el neutro multiplicativo $\frac{k}{k} = 1$).


  ![Resumen Amplificación de fracciones](/static/img/nodos/amplificacion-de-fracciones-resumen.svg)'
