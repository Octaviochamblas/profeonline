semantic_id: MAT.ALG.FRACCIONES_BASE.SIMPLIFICACION_FACTORIZACION
resumen_inicial: Para simplificar fracciones polinomiales se deben factorizar completamente
  el numerador y denominador y cancelar los factores comunes enteros.
explicacion_simple: 'Cuando una fracción algebraica contiene sumas o restas en el
  numerador o denominador, NO podemos cancelar términos sueltos directamente.

  Primero debemos convertir el numerador y el denominador en productos de factores
  mediante la factorización.

  Una vez que ambas partes están escritas como productos de paréntesis, cancelamos
  los paréntesis idénticos que aparezcan arriba y abajo.'
explicacion_formal: 'Dada una fracción polinomial $\frac{P(x)}{Q(x)}$, se factorizan
  ambos polinomios en producto de factores irreductibles sobre $\mathbb{R}[x]$:


  $$\frac{P(x)}{Q(x)} = \frac{A(x) \cdot C(x)}{B(x) \cdot C(x)} = \frac{A(x)}{B(x)}
  \quad \text{para } C(x) \neq 0 \quad \land \quad B(x) \neq 0$$


  **Desglose de la fórmula:**

  - $C(x)$: Polinomio factor común presente en numerador y denominador (M.C.D. polinomial).

  - $\frac{A(x)}{B(x)}$: Fracción reducida equivalente obtenida tras cancelar el factor
  común $C(x)$.'
definiciones_clave: '- **Factorización previa**: Acción de transformar sumas y restas
  en multiplicación antes de simplificar.

  - **Cancelación de factores**: División del numerador y denominador entre un mismo
  paréntesis o factor común no nulo.'
propiedades_relaciones: '- **Prohibición de cancelar sumandos**: Cancelar términos
  separados por signos $+$ o $-$ destruye la equivalencia algebraica de la fracción.

  - **Fracción polinomial irreducible**: Fracción donde $\text{M.C.D.}(A(x), B(x))
  = 1$.'
ejemplo_guiado:
  enunciado: Simplifica la fracción algebraica $\frac{x^2 - 16}{x^2 + 7x + 12}$ mediante
    factorización de sus términos, y evalúa el resultado irreducible para $x = 2$.
  pasos:
  - 'Paso 1: Factorizar el numerador $x^2 - 16$ mediante diferencia de cuadrados:
    $(x - 4)(x + 4)$.Paso 2: Factorizar el denominador $x^2 + 7x + 12$ buscando dos
    números que multipliquen $12$ y sumen $7$: $(x + 3)(x + 4)$.Paso 3: Cancelar el
    factor común $(x + 4)$ en numerador y denominador: $\frac{(x - 4)(x + 4)}{(x +
    3)(x + 4)} = \frac{x - 4}{x + 3}$.Paso 4: Evaluar la expresión reducida para $x
    = 2$: $\frac{2 - 4}{2 + 3} = \frac{-2}{5} = -\frac{2}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma simplificada irreducible de $\frac{x^2 - 16}{x^2 + 7x
    + 12}$?
  choices:
  - text: $\frac{x - 4}{x + 3}$
    is_correct: true
  - text: $\frac{x + 4}{x + 3}$
    is_correct: false
  - text: $\frac{-16}{7x + 12}$
    is_correct: false
  - text: $\frac{x - 4}{x - 3}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{x - 4}{x + 3}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar $\frac{x - 4}{x + 3}$ para $x = 2$, ¿cuál es el valor numérico
    obtenido?
  choices:
  - text: $-\frac{2}{5}$
    is_correct: true
  - text: $\frac{2}{5}$
    is_correct: false
  - text: $-\frac{6}{5}$
    is_correct: false
  - text: $\frac{2}{3}$
    is_correct: false
  explanation: La alternativa correcta es '$-\frac{2}{5}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente el polinomio del numerador utilizando productos
  notables o factor común.'
- 'Paso 2: Factorizar completamente el polinomio del denominador.'
- 'Paso 3: Identificar los paréntesis o factores multiplicativos idénticos arriba
  y abajo.'
- 'Paso 4: Cancelar los factores comunes especificando las restricciones del dominio.'
- 'Paso 5: Escribir la fracción simplificada restante.'
errores_correccion: '- **Error común:** Tachar o cancelar términos sumandos individuales
  (ejemplo: simplificar $\frac{x^2 + 5}{x^2 + 2}$ cancelando $x^2$ para obtener $\frac{5}{2}$).

  - **Cómo corregirlo:** NUNCA taches términos que estén sumando o restando. Solo
  se pueden cancelar factores completos que estén MULTIPLICANDO a toda la expresión.'
