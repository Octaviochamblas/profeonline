semantic_id: MAT.ALG.FRACCIONES_BASE.SIMPLIFICACION_FACTORIZACION
resumen_inicial: 'La simplificación de fracciones mediante factorización de polinomios consiste en descomponer el numerador y el denominador en factores primos para cancelar únicamente paréntesis o factores multiplicativos idénticos.'
explicacion_simple: |
  Para **simplificar fracciones con polinomios** (ej: $\frac{x^2 - 9}{x^2 + 5x + 6}$):
  - **REGLA DE ORO DE LA SIMPLIFICACIÓN**:
    $$\mathbf{\text{¡SOLO SE PUEDEN CANCELAR FACTORES QUE ESTÉN MULTIPLICANDO!}}$$
    - **NUNCA** canceles términos que estén sumando o restando (ej: cancelar las $x^2$ directamente está **GRAVEMENTE PROHIBIDO**).
  - **PROCEDIMIENTO EN 3 PASOS**:
    1. **Factoriza por completo el numerador**:
       - $x^2 - 9 = \mathbf{(x - 3)(x + 3)}$.
    2. **Factoriza por completo el denominador**:
       - $x^2 + 5x + 6 = \mathbf{(x + 2)(x + 3)}$.
    3. **Cancela los paréntesis (factores) EXACTAMENTE IGUALES arriba y abajo**:
       $$\frac{(x - 3)\cancel{(x + 3)}}{(x + 2)\cancel{(x + 3)}} = \mathbf{\frac{x - 3}{x + 2}}$$
explicacion_formal: |
  ### Definición formal
  Sean $P(x), Q(x) \in \mathbb{K}[x]$ dos polinomios no nulos. Para simplificar la función racional $f(x) = \frac{P(x)}{Q(x)}$, se descomponen ambos polinomios sobre el Dominio de Factorización Única $\mathbb{K}[x]$ en sus factores primos irreducibles:

  $$P(x) = c_1 \cdot D(x) \cdot A(x) \quad \text{y} \quad Q(x) = c_2 \cdot D(x) \cdot B(x)$$

  donde $D(x) = \operatorname{MCD}(P, Q)$ es el Máximo Común Divisor polinomial. Aplicando el axioma de la división de factores neutros ($\frac{D(x)}{D(x)} = 1$ para $D(x) \neq 0$):

  $$f(x) = \frac{c_1 A(x) D(x)}{c_2 B(x) D(x)} = \frac{c_1 A(x)}{c_2 B(x)} \cdot \mathbf{1} = \frac{c_1 A(x)}{c_2 B(x)}$$

  ### Restricción del Dominio
  La simplificación sólo es válida si se excluyen explícitamente del dominio las raíces de $D(x)$ ($D(x) \neq 0$).

  ### Síntesis didáctica
  Transformar polinomios en productos de factores permite simplificar aquellos paréntesis o bloques multiplicativos que sean idénticos en el numerador y denominador.
definiciones_clave: |
  - **Simplificación polinomial**: Cancelación de factores o paréntesis comunes entre el numerador y denominador previamente factorizados.
  - **Factor multiplicativo vs Término sumando**: Diferencia estructural donde sólo las expresiones unidas por multiplicación admiten simplificación.
  - **Fracción polinomial irreductible**: Expresión final donde el numerador y denominador factorizados tienen M.C.D. igual a 1.
propiedades_relaciones: |
  - **Inviolabilidad de las adiciones**: Intentar simplificar términos individuales separados por signos $+$ o $-$ destruye la igualdad algebraica.
ejemplo_guiado:
  enunciado: 'Simplifica la fracción algebraica $\frac{2x^2 - 8}{x^2 - 4x + 4}$.'
  pasos:
    - 'Paso 1: Factorizamos completamente el numerador $2x^2 - 8$:
       - Extraemos factor común $2$: $2(x^2 - 4)$.
       - Factorizamos la diferencia de cuadrados: $2(x - 2)(x + 2)$.'
    - 'Paso 2: Factorizamos completamente el denominador $x^2 - 4x + 4$:
       - Es un trinomio cuadrado perfecto: $(x - 2)^2 = (x - 2)(x - 2)$.'
    - 'Paso 3: Escribimos la fracción con sus factores descompuestos:
       $\frac{2(x - 2)(x + 2)}{(x - 2)(x - 2)}$.'
    - 'Paso 4: Cancelamos un factor $(x - 2)$ presente en el numerador y en el denominador:
       $\frac{2\cancel{(x - 2)}(x + 2)}{\cancel{(x - 2)}(x - 2)} = \mathbf{\frac{2(x + 2)}{x - 2}}$.'
    - 'Conclusión: La expresión simplificada es **$\frac{2(x + 2)}{x - 2}$** con $x \neq 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al intentar simplificar la expresión $\frac{x^2 + 5}{x^2 + 3}$, ¿por qué es UN ERROR GRAVE tachar o cancelar los términos $x^2$?'
    choices:
      - {text: 'Porque $x^2$ es un término que está sumando en ambas expresiones y la simplificación sólo está permitida para factores que están multiplicando', is_correct: true}
      - {text: 'Porque los números 5 y 3 son distintos', is_correct: false}
      - {text: 'Porque $x^2$ es un número par', is_correct: false}
      - {text: 'Porque el resultado da 5/3', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque $x^2$ es un término que está sumando en ambas expresiones y la simplificación sólo está permitida para factores que están multiplicando''. Regla fundamental: prohibición de cancelar sumandos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el primer paso obligatorio que debe realizarse para simplificar la fracción $\frac{x^2 - x - 6}{x^2 - 9}$?'
    choices:
      - {text: 'Factorizar completamente tanto el numerador $(x-3)(x+2)$ como el denominador $(x-3)(x+3)$', is_correct: true}
      - {text: 'Restar los coeficientes numéricos', is_correct: false}
      - {text: 'Cancelar los $x^2$', is_correct: false}
      - {text: 'Dividir entre 6', is_correct: false}
    explanation: 'La alternativa correcta es ''Factorizar completamente tanto el numerador $(x-3)(x+2)$ como el denominador $(x-3)(x+3)$''. La factorización previa es requisito indispensable para simplificar polinomios.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Factorizar completamente el polinomio del numerador utilizando factor común, productos notables o trinomios.'
  - 'Paso 2: Factorizar completamente el polinomio del denominador mediante las mismas técnicas algebraicas.'
  - 'Paso 3: Identificar los paréntesis o factores multiplicativos que sean idénticos en ambos niveles de la fracción.'
  - 'Paso 4: Tachar o cancelar los factores comunes idénticos y escribir la fracción irreductible resultante.'
errores_correccion: |
  - **Error 1:** Cancelar términos sumandos o restandos en lugar de factorizar primero (escribir $\frac{x+5}{x+2} \to \frac{5}{2}$ tachando las $x$). **Cómo corregirlo:** La simplificación **SÓLO SE APLICA A FACTORES MULTIPLICATIVOS; NUNCA A TÉRMINOS SUMANDOS SEPARADOS POR $+$ O $-$**.
  - **Error 2:** Cancelar factores parcialmente parecidos sin que sean exactamente idénticos (como $(x - 2)$ con $(x + 2)$). **Cómo corregirlo:** Para simplificar directamente **LOS PARÉNTESIS DEBEN SER EXACTAMENTE IGUALES EN TÉRMINOS Y SIGNOS**.
ejemplos:
  - titulo: 'Diferencia de cuadrados'
    enunciado: 'Para $\frac{x^2 - 1}{x + 1}$, ¿es el resultado $x - 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{(x+1)(x-1)}{x+1} = x-1$.'
  - titulo: 'Factor común en numerador'
    enunciado: 'Para $\frac{3x - 6}{x - 2}$, ¿es el resultado $3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{3(x-2)}{x-2} = 3$.'
  - titulo: 'Error de cancelación en suma'
    enunciado: 'En $\frac{a + b}{a}$, ¿es válido cancelar $a$ para obtener $b$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, $a$ está sumando en el numerador.'
  - titulo: 'Trinomio mónico'
    enunciado: 'Para $\frac{x^2 + 3x + 2}{x + 2}$, ¿es el resultado $x + 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{(x+2)(x+1)}{x+2} = x+1$.'
errores_frecuentes:
  - 'Cancelar términos que están sumando o restando en lugar de factorizar los polinomios.'
  - 'Cancelar paréntesis con signos opuestos como (x - 2) con (x + 2) creyendo que son iguales.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'La factorización por completo de los polinomios hasta sus factores primos irreducibles no es ejecutada.'
  - 'Declarar que al simplificar todo el numerador queda 0 en lugar de 1.'
afirmaciones_verdaderas:
  - 'Para simplificar fracciones algebraicas con polinomios es obligatorio factorizar previamente el numerador y denominador.'
  - 'Únicamente se pueden cancelar aquellos paréntesis o factores que estén multiplicando a toda la expresión.'
al_terminar_debes_poder: 'Simplificar fracciones algebraicas compuestas por polinomios factorizando completamente ambas expresiones.'
