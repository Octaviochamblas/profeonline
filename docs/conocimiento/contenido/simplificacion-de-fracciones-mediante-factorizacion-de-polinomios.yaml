procedimiento:
- 'Paso 1: Ignora tu instinto de tachar letras sueltas a simple vista.'
- 'Paso 2: Factoriza el numerador lo máximo que puedas.'
- 'Paso 3: Factoriza el denominador lo máximo que puedas.'
- 'Paso 4: Busca paréntesis (o monomios sueltos) enteros que sean idénticos arriba
  y abajo, y cancélelos.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en simplificación de fracciones mediante factorización de polinomios.
ejemplos:
- titulo: Simplifica $\frac{a^2 - b^2}{a+b}$
  enunciado: Simplifica $\frac{a^2 - b^2}{a+b}$.
  solucion_pasos:
  - 1. No puedes tachar 'a' con 'a'.
  - '2. Factoriza arriba (Diferencia de cuadrados): $(a+b)(a-b)$.'
  - '3. Abajo ya es irreducible: $(a+b)$.'
  - '4. Fracción: $\frac{(a+b)(a-b)}{(a+b)}$.'
  - '5. Cancela el bloque entero $(a+b)$. Resultado: $a-b$.'
- titulo: Simplifica $\frac{x^2-3x}{x-3}$.
  solucion_pasos:
  - 'Arriba factor común: x(x-3). Abajo: (x-3). Se cancela (x-3) completo.'
- titulo: 'Respecto de «Simplificación de fracciones mediante factorización de polinomios»:
    ¿Es correct'
  enunciado: 'Respecto de «Simplificación de fracciones mediante factorización de
    polinomios»: ¿Es correcta esta caracterización? «Para simplificar una fracción
    con polinomios, primero DEBES FACTORIZAR completamente tanto el numerador como
    el denominador»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para simplificar una fracción
    con polinomios, primero DEBES FACTORIZAR completamente tanto el numerador como
    el denominador.'
- titulo: 'Respecto de «Simplificación de fracciones mediante factorización de polinomios»:
    ¿Es válida'
  enunciado: 'Respecto de «Simplificación de fracciones mediante factorización de
    polinomios»: ¿Es válida esta afirmación? «Tachar un sumando (ej. en $(x+4)/4$,
    tachar los cuatros)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para simplificar una fracción
    con polinomios, primero DEBES FACTORIZAR completamente tanto el numerador como
    el denominador.'
errores_frecuentes:
- Tachar un sumando (ej. en $(x+4)/4$, tachar los cuatros).
- Tachar partes internas de un paréntesis.
- Porque el 4 de arriba no es múltiplo de x.
- Porque da x, y debería dar x+1.
- Para «¿Por qué es matemáticamente incorrecto simplificar los números '4' en la expresión
  $\frac{x+4}{4}$», la respuesta correcta es Porque no tienen exponentes.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando simplificación
