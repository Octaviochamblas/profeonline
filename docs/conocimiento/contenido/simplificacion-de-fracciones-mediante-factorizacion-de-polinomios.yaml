semantic_id: MAT.ALG.FRACCIONES_BASE.SIMPLIFICACION_FACTORIZACION
resumen_inicial: 'Simplificación de fracciones mediante factorización de polinomios:
  concepto, reglas operativas y simplificación en Fracciones algebraicas base.'
explicacion_simple: 'Aquí es donde los estudiantes novatos caen como moscas. Tachan
  cosas que no deberían tachar. Existe una regla inquebrantable en las fracciones
  algebraicas: nunca puedes tachar términos que se estén sumando o restando.'
explicacion_formal: '### Definición formal


  El 4 en el numerador es un sumando, no un factor. (Como probar (2+4)/4 -> 6/4 =
  1.5, pero si tacharas daría 2).


  ### Desarrollo didáctico


  El error más catastrófico en álgebra es tachar (simplificar) letras o números que
  están sumando o restando.


  Si tienes $\frac{x^2 + 2x}{x}$, ESTÁ PROHIBIDO tachar la ''x'' de arriba con la
  de abajo.


  **Ley Universal de Simplificación:** SOLO puedes simplificar factores. Un factor
  es algo que está MULTIPLICANDO a todo lo demás. Los términos que suman o restan
  están blindados y no se pueden separar.


  Para poder simplificar, debes **Factorizar primero**. Transformar las sumas en multiplicaciones
  de paréntesis.

  - Paso 1: Toma el numerador $x^2 + 2x$ y extrae factor común ''x''. Queda: $x(x
  + 2)$.

  - Paso 2: Reescribe la fracción: $\frac{x(x + 2)}{x}$.

  - Paso 3: Ahora sí. Como la ''x'' está multiplicando a todo el paréntesis, puedes
  tacharla con la ''x'' que está multiplicando sola abajo.

  - Resultado final: $x + 2$.


  Si no hay multiplicaciones puras, no puedes simplificar.'
definiciones_clave: '- **Simplificación de fracciones mediante factorización de polinomios**:
