semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.TABLA_VALORES
resumen_inicial: La construcción de una tabla de valores organiza de manera sistemática pares ordenados $(x, f(x))$ para graficar la parábola.
explicacion_simple: |
  Una **tabla de valores** es una herramienta para calcular puntos clave antes de hacer el dibujo de la parábola:

  1. Eliges varios números para la entrada $x$ (es ideal incluir el valor del **vértice** y números a su izquierda y derecha).
  2. Calculas la salida $y = f(x)$ reemplazando cada $x$ en la fórmula.
  3. Escribes los pares de coordenadas $(x, y)$.

  **Ejemplo**: Para $f(x) = x^2 - 2x$:
  | $x$ | $f(x) = x^2 - 2x$ | Punto $(x, y)$ |
  | :---: | :---: | :---: |
  | $-1$ | $(-1)^2 - 2(-1) = 3$ | $(-1, 3)$ |
  | $0$ | $0^2 - 2(0) = 0$ | $(0, 0)$ |
  | $1$ | $1^2 - 2(1) = -1$ | $(1, -1)$ |
  | $2$ | $2^2 - 2(2) = 0$ | $(2, 0)$ |
  | $3$ | $3^2 - 2(3) = 3$ | $(3, 3)$ |

  ¡Observa cómo los valores de $y$ se repiten simétricamente alrededor del vértice $x = 1$!
explicacion_formal: |
  Sea la función $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = ax^2 + bx + c$. La **matriz de evaluación o tabla de valores** es un subconjunto finito del grafo de la función $\mathcal{T} \subset G(f)$:

  $$\mathcal{T} = \{(x_k, f(x_k)) \in \mathbb{R}^2 \mid k \in \{1, 2, \dots, n\}\}$$

  **Estrategia óptima de selección de nodos de entrada $x_k$:**
  Para reflejar fielmente la simetría de la curva, el conjunto de abscisas $\{x_k\}$ se centra en la abscisa del vértice $x_v = -\frac{b}{2a}$, seleccionando valores equidistantes:

  $$x_v - 2h, \quad x_v - h, \quad x_v, \quad x_v + h, \quad x_v + 2h$$
definiciones_clave: |
  - **Tabla de valores**: Estructura de filas y columnas que tabula parejas de datos $(x, f(x))$ para la construcción cartesiana de la parábola.
propiedades_relaciones: |
  - **Simetría numérica tabular**: En una tabla construida con abscisas centradas en el vértice $x_v$, los valores de salida $y$ a igual distancia del vértice son exactamente idénticos: $f(x_v - h) = f(x_v + h)$.
ejemplo_guiado:
  enunciado: 'Construye la tabla de valores de la función $f(x) = x^2 + 1$ para $x \in \{-2, -1, 0, 1, 2\}$.'
  pasos:
    - 'Paso 1: Evaluar $x = -2 \implies f(-2) = (-2)^2 + 1 = 5 \implies (-2, 5)$.'
    - 'Paso 2: Evaluar $x = -1 \implies f(-1) = (-1)^2 + 1 = 2 \implies (-1, 2)$.'
    - 'Paso 3: Evaluar $x = 0 \implies f(0) = 0^2 + 1 = 1 \implies (0, 1)$.'
    - 'Paso 4: Evaluar $x = 1 \implies (1, 2)$ y $x = 2 \implies (2, 5)$. Constatar la simetría.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Alrededor de qué valor de $x$ conviene centrar los valores de una tabla para apreciar la simetría de la parábola?'
    choices:
      - {text: 'Alrededor de la abscisa del vértice $x_v = -b/(2a)$', is_correct: true}
      - {text: 'Alrededor del número 10.', is_correct: false}
      - {text: 'Alrededor del término independiente $c$.', is_correct: false}
      - {text: 'Únicamente alrededor de números impares.', is_correct: false}
    explanation: 'La alternativa correcta es ''Alrededor de la abscisa del vértice $x_v = -b/(2a)$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En la tabla de $f(x) = x^2 - 4x$, el vértice está en $x = 2$ con $f(2) = -4$. Si $f(1) = -3$, ¿cuánto vale $f(3)$ por propiedad de simetría?'
    choices:
      - {text: '$f(3) = -3$', is_correct: true}
      - {text: '$f(3) = 0$', is_correct: false}
      - {text: '$f(3) = 3$', is_correct: false}
      - {text: '$f(3) = -4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(3) = -3$''. Al estar $x=1$ y $x=3$ a la misma distancia de $x=2$, sus imágenes son iguales.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Calcular la abscisa del vértice $x_v = -\frac{b}{2a}$.'
  - 'Paso 2: Seleccionar al menos 2 valores a la izquierda y 2 valores a la derecha de $x_v$.'
  - 'Paso 3: Sustituir cada $x$ en la función calculando cuidadosamente los resultados $y$.'
  - 'Paso 4: Organizar las respuestas en pares ordenados $(x, y)$ dentro de la tabla.'
errores_correccion: |
  - **Error común:** Escoger valores de $x$ muy alejados del vértice (ej. $x = 10, 20$) perdiendo la vista del vértice y la curva.
  - **Cómo corregirlo:** Calcula **PRIMERO EL VÉRTICE $x_v$** y elige valores cercanos a su alrededor.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Tabla simétrica en el origen.
    alternativas:
      - '(-1, 3), (0, 0), (1, 3)'
      - '(-1, -3), (0, 0), (1, 3)'
      - '(-1, 1), (0, 0), (1, 2)'
    respuesta: '(-1, 3), (0, 0), (1, 3)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Tabla con traslación.
    alternativas:
      - '(1, 1), (2, 0), (3, 1)'
      - '(1, 0), (2, 1), (3, 2)'
      - '(1, 2), (2, 2), (3, 2)'
    respuesta: '(1, 1), (2, 0), (3, 1)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Cometer errores de signo en la potencia de números negativos dentro de la tabla.'
  - 'Elegir únicamente valores de $x$ positivos impidiendo observar la curvatura completa de la parábola.'
  - 'La falta de aprovechamiento de la simetría de las salidas $y$ para verificar la corrección de los cálculos tabulares.'
  - 'El intercambio entre las columnas de entrada $x$ y salida $y$ al traspasar los puntos al plano cartesiano.'
  - 'La suposición de que la diferencia entre valores consecutivos de $y$ en la tabla debe ser una constante fija.'
afirmaciones_verdaderas:
  - 'Construir una tabla de valores centrada en el vértice $x_v$ permite verificar visualmente la simetría de la parábola.'
  - 'Los valores de salida $y$ situados a la misma distancia a la izquierda y derecha del vértice son idénticos.'
al_terminar_debes_poder: |
  QUÉ: Construir y organizar tablas de valores para graficar funciones cuadráticas.
  CÓMO: Calcular $x_v$, elegir valores simétricos de entrada, evaluar $f(x)$ y formar la matriz de puntos ordenados $(x, y)$.
