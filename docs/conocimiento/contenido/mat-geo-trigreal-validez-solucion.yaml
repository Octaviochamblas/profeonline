semantic_id: MAT.GEO.TRIG_APLICA_REAL.VALIDEZ_SOLUCION
resumen_inicial: 'Evaluación de la validez geométrica de una solución trigonométrica
  en contexto: conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría
  Ampliada.'
explicacion_simple: Al resolver triángulos con las leyes de senos y cosenos, es posible
  obtener resultados numéricamente correctos en el álgebra pero geométricamente imposibles,
  por lo que siempre se debe verificar la validez de la solución final.
explicacion_formal: '![Validez geométrica de una solución](/static/img/geometria/trigonometria/trigreal-validez-solucion.svg)


  ### Definición formal


  Una solución de un triángulo es válida si: (1) los tres ángulos son positivos y
  su suma es 180°, y (2) cada lado es menor que la suma de los otros dos (desigualdad
  triangular).


  ### Desarrollo didáctico


  En el caso ambiguo de la ley de senos, por ejemplo, una de las dos soluciones angulares
  posibles puede hacer que la suma de los ángulos supere 180°, lo que la descarta
  automáticamente como solución inválida, dejando solo la otra como la respuesta correcta.'
