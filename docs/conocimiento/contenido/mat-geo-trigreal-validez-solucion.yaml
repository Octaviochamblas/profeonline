- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en evaluación de
  la validez geométrica de una solución trigonométrica en contexto.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de evaluación
  de la validez geométrica de una solución trigonométrica en contexto.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
