procedimiento:
- 'Paso 1: Suma los tres ángulos obtenidos y verifica que el resultado sea exactamente
  180°.'
- 'Paso 2: Verifica que los tres lados cumplan la desigualdad triangular (cada lado
  menor que la suma de los otros dos).'
- 'Paso 3: Si alguna de estas condiciones falla, descarta esa solución como geométricamente
  inválida.'
