semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.CRECIMIENTO_POLINOMIAL
resumen_inicial: La interpretación del crecimiento polinomial mediante funciones potencia de exponente positivo $f(x) = k \cdot x^n$ ($n > 0$) demuestra que multiplicar la variable de entrada por un factor $c$ multiplica la variable de respuesta por un factor $c^n$, generando una amplificación acelerada de escala.
explicacion_simple: "![La interpretación del crecimiento polinomial mediante funciones potencia de exponente positivo $f(x) = k \\cdot x^n$ ($n > 0$) demuestra que multiplicar la variable de entrada por un factor $c$ multiplica la variable de respuesta por un factor $c^n$, generando una amplificación acelerada de escala](/static/img/nodos/interpretacion-de-crecimiento-polinomial-mediante-funciones-potencia-de-exponente-positivo-intro.svg)\n\n\nEl crecimiento polinomial tiene una propiedad asombrosa: **¡un pequeño cambio en la entrada produce un cambio gigante en la salida!**\n\n- **¿Cómo funciona el multiplicador de escala $c^n$?**\n  - Si el modelo es **cuadrático ($n = 2$, como el área o la energía cinética)**:\n    - Al duplicar la velocidad ($c = 2$), la energía se multiplica por $2^2 = \\mathbf{4}$.\n    - Al triplicar la velocidad ($c = 3$), la energía se multiplica por $3^2 = \\mathbf{9}$.\n  - Si el modelo es **cúbico ($n = 3$, como el volumen o la potencia del viento)**:\n    -\
  \ Al duplicar la entrada ($c = 2$), la salida se multiplica por $2^3 = \\mathbf{8}$ (¡800%!).\n    - Al triplicar la entrada ($c = 3$), la salida se multiplica por $3^3 = \\mathbf{27}$.\n- **Conclusión:** ¡Nunca pienses linealmente! El factor de multiplicación es siempre **$c^n$**."
explicacion_formal: 'Sea $f: \mathbb{R}^+ \to \mathbb{R}^+$ definida por $f(x) = kx^n$ con $k > 0$ y $n \in \mathbb{R}^+$.

  Al escalar la variable independiente por una constante positiva $c > 0$:

  $$f(c \cdot x) = k(cx)^n = k \cdot c^n \cdot x^n = c^n \cdot (kx^n) = c^n \cdot f(x)$$


  **Razón de amplificación relativa**:

  $$\frac{f(c \cdot x)}{f(x)} = c^n$$

  Esto demuestra rigurosamente que el factor de amplificación de la respuesta depende única y exclusivamente del factor de escala $c$ y del exponente $n$, independientemente del valor inicial de $x$ o del coeficiente $k$.'
definiciones_clave: '- **Multiplicador de escala polinomial**: Razón $c^n$ por la cual se amplifica la salida al escalar la entrada por $c$.

  - **Homogeneidad positiva de orden $n$**: Propiedad algebraica $f(cx) = c^n f(x)$.'
propiedades_relaciones: '- **Crecimiento superlineal**: Para todo $n > 1$ y $c > 1$, se cumple $c^n > c$, de modo que la respuesta crece más rápido que la entrada.

  - **Sensibilidad dimensional**: A mayor exponente $n$, más explosiva es la respuesta ante incrementos de escala.'
ejemplo_guiado:
  enunciado: '![Ejemplo La interpretación del crecimiento polinomial mediante funciones potencia de exponente positivo $f(x) = k \cdot x^n$ ($n > 0$) demuestra que multiplicar la variable de entrada por un factor $c$ multiplica la variable de respuesta por un factor $c^n$, generando una amplificación acelerada de escala](/static/img/nodos/interpretacion-de-crecimiento-polinomial-mediante-funciones-potencia-de-exponente-positivo-ejemplos.svg)



    Aplica la ley de amplificación de escala $c^n$ para resolver:

    1) La distancia de frenado de un tren sigue $d(v) = k v^2$. Si el tren duplica su rapidez ($v_2 = 2v_1$), ¿cuántas veces aumenta la distancia de frenado?

    2) El volumen de agua en un embalse cónico es $V(h) = k h^3$. Si la altura del agua se triplica ($h_2 = 3h_1$), ¿cuántas veces aumenta el volumen?'
  pasos:
  - 'Paso 1: Para $d(v) = k v^2$: El exponente es $n = 2$ y el factor es $c = 2$. Multiplicador: $c^n = 2^2 = \mathbf{4}$. **La distancia de frenado se cuadruplica (aumenta 4 veces)**.'
  - 'Paso 2: Para $V(h) = k h^3$: El exponente es $n = 3$ y el factor es $c = 3$. Multiplicador: $c^n = 3^3 = \mathbf{27}$. **El volumen de agua aumenta 27 veces**.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una magnitud se modela por $y = k x^4$ y la variable x se duplica (c = 2), ¿por qué factor se multiplica y?
  choices:
  - text: Por 16 (porque 2⁴ = 16)
    is_correct: true
  - text: Por 8
    is_correct: false
  - text: Por 4
    is_correct: false
  - text: Por 2
    is_correct: false
  explanation: La alternativa correcta es 'Por 16 (porque 2⁴ = 16)'. La regla de escala establece que la salida se multiplica por $c^n = 2^4 = 16$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En una tubería donde el caudal es $Q = k · r⁴$, si el radio r se incrementa en un factor de 3, ¿cuántas veces más fluido transporta?
  choices:
  - text: 81 veces más (3⁴ = 81)
    is_correct: true
  - text: 12 veces más
    is_correct: false
  - text: 27 veces más
    is_correct: false
  - text: 3 veces más
    is_correct: false
  explanation: La alternativa correcta es '81 veces más (3⁴ = 81)'. Aplicando la ley de Poiseuille, $c^n = 3^4 = 81$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente $n$ del modelo de función potencia $y = k x^n$.'
- 'Paso 2: Identificar el factor multiplicativo de entrada $c = x_{\text{nuevo}} / x_{\text{original}}$.'
- 'Paso 3: Calcular el factor de amplificación de salida elevando $c^n$.'
- 'Paso 4: Multiplicar el valor de salida original por $c^n$ para obtener la nueva magnitud.'
errores_correccion: '- **Error común:** Creer que si la entrada se duplica ($c = 2$), la salida también se duplica en cualquier función.

  - **Cómo corregirlo:** En funciones potencia, la salida se multiplica por **$c^n$**: si $n = 3$, se multiplica por $2^3 = \mathbf{8}$, ¡no por 2!'
ejemplos:
- titulo: 'Ejemplo 1: Escala cuadrática cuádruple'
  enunciado: 'Si el lado de un cuadrado se multiplica por 4, su área se multiplica por:'
  alternativas:
  - '16'
  - '4'
  - '8'
  - '64'
  respuesta: '16'
  solucion_pasos:
  - 'Paso 1: $c^n = 4^2 = 16$.'
- titulo: 'Ejemplo 2: Escala cúbica décuple'
  enunciado: 'Si las dimensiones de un cubo se multiplican por 10, su volumen se multiplica por:'
  alternativas:
  - '1.000'
  - '100'
  - '30'
  - '10'
  respuesta: '1.000'
  solucion_pasos:
  - 'Paso 1: $c^n = 10^3 = 1.000$.'
- titulo: 'Ejemplo 3: Aumento porcentual'
  enunciado: 'Si la velocidad de un móvil aumenta un 100% (se duplica), su energía cinética $E_k \propto v^2$ aumenta en un:'
  alternativas:
  - 300% (pasa al 400%, subiendo un 300%)
  - 100%
  - 200%
  - 400%
  respuesta: 300% (pasa al 400%, subiendo un 300%)
  solucion_pasos:
  - 'Paso 1: Pasa a ser 4 veces el valor inicial $\implies$ aumento de $(4 - 1) \times 100\% = 300\%$.'
- titulo: 'Ejemplo 4: Multiplicador fraccionario'
  enunciado: 'Si el radio de una esfera se reduce a la mitad ($c = 0{,}5$), su volumen se reduce a:'
  alternativas:
  - 1/8 del original
  - 1/2 del original
  - 1/4 del original
  - 1/6 del original
  respuesta: 1/8 del original
  solucion_pasos:
  - 'Paso 1: $(1/2)^3 = 1/8$.'
errores_frecuentes:
- Asumir linealidad en el cambio de variables.
- Confundir el factor de escala cⁿ con multiplicar por n.
- Olvidar la diferencia entre el valor final (400%) y el aumento neto (300%).
afirmaciones_verdaderas:
- Al multiplicar la entrada por c en y = k · xⁿ, la salida se multiplica por cⁿ.
- El factor de amplificación cⁿ es independiente del valor inicial y del coeficiente k.
al_terminar_debes_poder: '**QUÉ:** Interpretar y calcular el crecimiento polinomial en modelos de función potencia.


  **CÓMO:** Aplicando la ley de escala f(c · x) = cⁿ · f(x) para deducir el factor multiplicativo exacto.


