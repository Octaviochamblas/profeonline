semantic_id: MAT.ALG.SISTEMAS_2X2.DEFINICION
resumen_inicial: 'Definición de sistema de ecuaciones lineales 2x2: propiedades, resolución
  y modelamiento en Sistemas de ecuaciones lineales 2x2.'
explicacion_simple: 'La regla dorada del álgebra dice: Si tienes 2 incógnitas, necesitas
  OBLIGATORIAMENTE 2 ecuaciones distintas para poder resolverlo. Si solo tienes 1
  ecuación (ej: $x + y = 10$), hay infinitas combinaciones ($5+5$, $8+2$, $0+10$).'
explicacion_formal: '### Definición formal


  Un sistema lineal $2\times 2$ es un conjunto de dos ecuaciones lineales con dos
  incógnitas, de la forma

  $$\begin{cases} a_1x+b_1y=c_1,\\ a_2x+b_2y=c_2, \end{cases}$$

  donde $(a_1,b_1)\neq(0,0)$ y $(a_2,b_2)\neq(0,0)$. Resolver el sistema consiste
  en determinar el conjunto de pares ordenados $(x,y)$ que satisfacen simultáneamente
  ambas ecuaciones. La solución puede ser única, inexistente o infinita, según la
  relación entre las dos ecuaciones.


  ### Desarrollo didáctico


  La regla dorada del álgebra dice: Si tienes 2 incógnitas, necesitas OBLIGATORIAMENTE
  2 ecuaciones distintas para poder resolverlo. Si solo tienes 1 ecuación (ej: $x
  + y = 10$), hay infinitas combinaciones ($5+5$, $8+2$, $0+10$).


  Un sistema 2x2 es simplemente un par de ecuaciones (generalmente escritas una debajo
  de la otra unidas por una llave) que deben cumplirse **al mismo tiempo**.'
definiciones_clave: '- **Definición de sistema de ecuaciones lineales 2x2**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a definición de sistema de ecuaciones lineales
  2x2.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando definición de sistema
    de ecuaciones lineales 2x2.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de definición de sistema
    de ecuaciones lineales 2x2.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
