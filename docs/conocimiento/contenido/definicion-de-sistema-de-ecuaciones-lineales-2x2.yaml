semantic_id: MAT.ALG.SISTEMAS_2X2.DEFINICION
resumen_inicial: Un sistema de ecuaciones lineales 2x2 consiste en un conjunto de dos ecuaciones de primer grado con dos incógnitas comunes.
explicacion_simple: |
  Un sistema de ecuaciones $2 \times 2$ reúne dos ecuaciones algebraicas que comparten las mismas dos incógnitas (generalmente denotadas como $x$ e $y$).

  La **solución del sistema** es el par ordenado de valores $(x, y)$ que satisface ambas ecuaciones simultáneamente al sustituir sus coordenadas.

  En el plano cartesiano, cada ecuación representa una recta continua, y la solución matemática corresponde precisamente al punto de intersección donde se cruzan ambas rectas.
explicacion_formal: |
  ### Definición formal
  Un **sistema de ecuaciones lineales 2x2** escrito en su forma canónica o estándar se representa por el par de igualdades:

  $$\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases} \quad \text{con coeficientes } a_i, b_i, c_i \in \mathbb{R}$$

  ### Desglose de la fórmula
  - $x, y$: Incógnitas algebraicas compartidas del sistema.
  - Par ordenado $(x_0, y_0) \in \mathbb{R}^2$: Solución simultánea que satisface $a_1 x_0 + b_1 y_0 = c_1$ y $a_2 x_0 + b_2 y_0 = c_2$.

  ### Síntesis didáctica
  Encontrar la solución $(x, y)$ requiere hallar un par numérico único que haga verdaderas ambas igualdades a la vez.
definiciones_clave: |
  - **Sistema de ecuaciones 2x2**: Estructura algebraica de dos ecuaciones lineales que vinculan dos variables desconocidas comunes.
  - **Par ordenado solución $(x, y)$**: Conjunto de valores numéricos que satisface simultáneamente las dos relaciones del sistema.
propiedades_relaciones: |
  - **Intersección gráfica**: En el plano cartesiano, el par $(x_0, y_0)$ es el punto de intersección $L_1 \cap L_2$ entre las dos rectas asociadas.
  - **Simultaneidad matemática**: Un par ordenado que satisface únicamente una de las dos ecuaciones no constituye solución del sistema.
ejemplo_guiado:
  enunciado: 'Verifica si el par ordenado $(x, y) = (3, 2)$ es la solución simultánea del sistema $\begin{cases} 2x + y = 8 \\ x - y = 1 \end{cases}$.'
  pasos:
    - 'Paso 1: Sustituir $x = 3, y = 2$ en la primera ecuación: $2(3) + 2 = 6 + 2 = 8$ (se verifica la igualdad $8 = 8$).'
    - 'Paso 2: Sustituir $x = 3, y = 2$ en la segunda ecuación: $3 - 2 = 1$ (se verifica la igualdad $1 = 1$).'
    - 'Paso 3: Concluir que el par ordenado $(3, 2)$ **SÍ es la solución del sistema** por satisfacer ambas ecuaciones de forma simultánea.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición obligatoria debe cumplir un par ordenado $(x, y)$ para ser solución de un sistema $2 \times 2$?'
    choices:
      - {text: 'Debe transformar a ambas ecuaciones en igualdades verdaderas simultáneamente.', is_correct: true}
      - {text: 'Basta con que satisfaga únicamente la primera ecuación del sistema.', is_correct: false}
      - {text: 'Ambas coordenadas $x$ e $y$ deben ser obligatoriamente números enteros positivos.', is_correct: false}
      - {text: 'El producto de las coordenadas $x \cdot y$ debe ser siempre igual a cero.', is_correct: false}
    explanation: 'La alternativa correcta es ''Debe transformar a ambas ecuaciones en igualdades verdaderas simultáneamente.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar el par ordenado $(3, 2)$ en el sistema $\begin{cases} 2x + y = 8 \\ x - y = 1 \end{cases}$, ¿cuáles son las igualdades obtenidas?'
    choices:
      - {text: 'Primera ecuación $8 = 8$, segunda ecuación $1 = 1$.', is_correct: true}
      - {text: 'Primera ecuación $6 = 8$, segunda ecuación $2 = 1$.', is_correct: false}
      - {text: 'Primera ecuación $0 = 0$, segunda ecuación $0 = 0$.', is_correct: false}
      - {text: 'Primera ecuación $10 = 8$, segunda ecuación $5 = 1$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Primera ecuación $8 = 8$, segunda ecuación $1 = 1$.''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos ecuaciones y los coeficientes de las variables comunes $x$ e $y$.'
  - 'Paso 2: Sustituir las coordenadas del par evaluado $(x_0, y_0)$ en la primera ecuación.'
  - 'Paso 3: Sustituir las mismas coordenadas $(x_0, y_0)$ en la segunda ecuación.'
  - 'Paso 4: Comprobar la validez de ambas igualdades numéricas.'
  - 'Paso 5: Declarar el par $(x_0, y_0)$ como solución si y solo si ambas igualdades son verdaderas.'
errores_correccion: |
  - **Error 1:** Considerar que un par ordenado es solución del sistema tras verificarlo únicamente en la primera ecuación. **Cómo corregirlo:** Toda solución **DEBE COMPROBARSE EN AMBAS ECUACIONES DEL SISTEMA SIMULTÁNEAMENTE ($a_1 x_0 + b_1 y_0 = c_1 \text{ y } a_2 x_0 + b_2 y_0 = c_2$)**.
  - **Error 2:** Invertir la posición de las coordenadas evaluando $(y, x)$ en lugar de $(x, y)$. **Cómo corregirlo:** El par ordenado **RESPETA EL ORDEN ESTÁNDAR: LA PRIMERA COORDENADA CORRESPONDE A LA VARIABLE $x$ Y LA SEGUNDA A LA VARIABLE $y$**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Verifica si $(1, 4)$ es solución de $\begin{cases} x + y = 5 \\ 2x - y = -2 \end{cases}$.'
    alternativas:
      - 'Sí, es la solución simultánea del sistema'
      - 'No, solo satisface la primera ecuación'
      - 'No, solo satisface la segunda ecuación'
    respuesta: 'Sí, es la solución simultánea del sistema'
    solucion_pasos:
      - '1. Ecuación 1: $1 + 4 = 5$ (Verdad).'
      - '2. Ecuación 2: $2(1) - 4 = 2 - 4 = -2$ (Verdad).'
  - titulo: 'Ejemplo 2'
    enunciado: 'Evalúa $(2, 1)$ en $\begin{cases} 3x + y = 7 \\ x + 2y = 5 \end{cases}$.'
    alternativas:
      - 'No es solución (la primera da $7 = 7$ pero la segunda da $4 \neq 5$)'
      - 'Sí es solución simultánea'
      - 'Ambas ecuaciones dan falso'
    respuesta: 'No es solución (la primera da $7 = 7$ pero la segunda da $4 \neq 5$)'
    solucion_pasos:
      - '1. Ecuación 1: $3(2) + 1 = 7$ (Verdad).'
      - '2. Ecuación 2: $2 + 2(1) = 4 \neq 5$ (Falso).'
  - titulo: 'Simultaneidad requerida'
    enunciado: '¿Es obligatorio que el par solución verifique simultáneamente ambas igualdades?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la definición matemática de sistema.'
  - titulo: 'Punto de intersección'
    enunciado: '¿La solución de un sistema 2x2 corresponde al punto de corte de las dos rectas en el plano cartesiano?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es el único punto $(x, y)$ común a ambas rectas.'
errores_frecuentes:
  - 'Verificar el par ordenado en una sola ecuación y omitir la comprobación en la otra.'
  - 'Invertir el orden de las coordenadas evaluando la primera como $y$ y la segunda como $x$.'
  - 'Cometer errores de signos al multiplicar coeficientes negativos durante la sustitución.'
  - 'Confundir las incógnitas del sistema al trabajar con variables distintas de $x$ e $y$.'
  - 'Asumir que si un sistema no tiene solución entera entonces carece de solución.'
afirmaciones_verdaderas:
  - 'Un sistema de ecuaciones 2x2 posee como solución el par ordenado que satisface simultáneamente ambas ecuaciones.'
  - 'Gráficamente, la solución de un sistema 2x2 representa el punto de intersección de las dos rectas asociadas.'
al_terminar_debes_poder: |
  QUÉ: Definir y verificar la solución de un sistema de ecuaciones lineales 2x2.
  CÓMO: Sustituir las coordenadas del par ordenado $(x, y)$ en ambas ecuaciones del sistema y confirmar la validez simultánea de las dos igualdades.
