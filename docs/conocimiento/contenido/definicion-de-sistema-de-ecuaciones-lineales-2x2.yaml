procedimiento:
- Identifica que tienes dos incógnitas distintas (usualmente 'x' e 'y').
- Asegúrate de tener dos ecuaciones que relacionen esas dos incógnitas.
- Comprende que la solución del sistema es un PAR ORDENADO $(x, y)$ que hace verdaderas
  a ambas ecuaciones simultáneamente.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en definición de sistema de ecuaciones lineales 2x2.
ejemplos:
- titulo: $x + y = 10$ y $0+10$
  enunciado: Analiza el caso $x + y = 10$ y $0+10$ y explica cómo se aplica el criterio
    estudiado.
  solucion_pasos:
  - 'La regla dorada del álgebra dice: Si tienes 2 incógnitas, necesitas OBLIGATORIAMENTE
    2 ecuaciones distintas para poder resolverlo. Si solo tienes 1 ecuación (ej: $x
    + y = 10$), hay infinitas combinaciones ($5+5$, $8+2$, $0+10$).'
  - Identifica que tienes dos incógnitas distintas (usualmente 'x' e 'y').
- titulo: $x$
  enunciado: Resuelve o interpreta $x$ usando las condiciones de este recurso.
  solucion_pasos:
  - Hasta ahora resolvías problemas de una sola letra ($x$). Pero, ¿qué pasa si quieres
    saber el precio de una manzana ($x$) y de una pera ($y$)? Necesitas **dos letras**.
  - Asegúrate de tener dos ecuaciones que relacionen esas dos incógnitas.
- titulo: 'Respecto de «Definición de sistema de ecuaciones lineales 2x2»: ¿Es correcta
    esta caracteriz'
  enunciado: 'Respecto de «Definición de sistema de ecuaciones lineales 2x2»: ¿Es
    correcta esta caracterización? «Hasta ahora resolvías problemas de una sola letra
    ($x$)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Hasta ahora resolvías problemas
    de una sola letra ($x$).'
- titulo: 'Respecto de «Definición de sistema de ecuaciones lineales 2x2»: ¿Es válida
    esta afirmación?'
  enunciado: 'Respecto de «Definición de sistema de ecuaciones lineales 2x2»: ¿Es
    válida esta afirmación? «Puede omitirse esta condición sin cambiar el resultado:
    «Identifica que tienes dos incógnitas distintas (usualmente ''x'' e ''y'')»»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Hasta ahora resolvías problemas
    de una sola letra ($x$).'
errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Identifica que tienes
  dos incógnitas distintas (usualmente ''x'' e ''y'')».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Asegúrate de tener
  dos ecuaciones que relacionen esas dos incógnitas».'
- La definición sigue cumpliéndose aunque no se considere que hasta ahora resolvías
  problemas de una sola letra ($x$). Pero, ¿qué pasa si quieres saber el precio de
  una manzana ($x$) y de una pera ($y$)? Necesitas **dos letras**.
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Identifica
  que tienes dos incógnitas distintas (usualmente 'x' e 'y')».
- La comprobación del resultado vuelve innecesaria la condición «Asegúrate de tener
  dos ecuaciones que relacionen esas dos incógnitas».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
