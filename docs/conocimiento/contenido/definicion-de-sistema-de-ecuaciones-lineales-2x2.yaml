semantic_id: MAT.ALG.SISTEMAS_2X2.DEFINICION
resumen_inicial: Un sistema de ecuaciones lineales 2x2 consta de dos ecuaciones de
  primer grado con dos incógnitas comunes.
explicacion_simple: 'Un sistema 2x2 reúne dos ecuaciones que comparten dos letras
  desconocidas (por ejemplo $x$ e $y$).

  La **solución del sistema** es el par ordenado $(x, y)$ que satisface AMBAS ecuaciones
  al mismo tiempo.

  Geométricamente, cada ecuación representa una recta en el plano cartesiano, y la
  solución corresponde al punto de intersección de esas dos rectas.'
explicacion_formal: 'Un **sistema de ecuaciones lineales 2x2** en forma canónica se
  expresa como:


  $$\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases} \quad \text{con
  } a_i, b_i, c_i \in \mathbb{R}$$


  **Desglose de la fórmula:**

  - $x, y$: Incógnitas compartidas del sistema.

  - Par ordenado $(x_0, y_0) \in \mathbb{R}^2$: Solución simultánea tal que $a_1 x_0
  + b_1 y_0 = c_1$ y $a_2 x_0 + b_2 y_0 = c_2$.'
definiciones_clave: '- **Sistema de ecuaciones 2x2**: Conjunto de 2 ecuaciones lineales
  con 2 variables desconocidas.

  - **Par ordenado solución $(x, y)$**: Par de números que verifica simultáneamente
  las dos igualdades.'
propiedades_relaciones: '- **Interpretación gráfica**: Cada ecuación es una recta
  $L_1$ y $L_2$. La solución es el punto de corte $(x, y) = L_1 \cap L_2$.'
ejemplo_guiado:
  enunciado: Verifica si el par ordenado $(x, y) = (3, 2)$ es la solución simultánea
    del sistema $\begin{cases} 2x + y = 8 \\ x - y = 1 \end{cases}$.
  pasos:
  - 'Paso 1: Sustituir $x = 3, y = 2$ en la primera ecuación: $2(3) + 2 = 6 + 2 =
    8$ (se verifica $8 = 8$).Paso 2: Sustituir $x = 3, y = 2$ en la segunda ecuación:
    $3 - 2 = 1$ (se verifica $1 = 1$).Paso 3: Concluir que el par ordenado $(3, 2)$
    SI es la solución del sistema por satisfacer ambas ecuaciones a la vez.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición obligatoria debe cumplir un par ordenado $(x, y)$ para
    ser la solución de un sistema 2x2?
  choices:
  - text: Debe hacer verdaderas a ambas ecuaciones al mismo tiempo.
    is_correct: true
  - text: Basta con que satisfaga la primera ecuación solamente.
    is_correct: false
  - text: Ambos números $x$ e $y$ deben ser necesariamente iguales.
    is_correct: false
  - text: El producto de $x \cdot y$ debe dar cero.
    is_correct: false
  explanation: La alternativa correcta es 'Debe hacer verdaderas a ambas ecuaciones
    al mismo tiempo.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comprobar el par $(3, 2)$ en el sistema $\begin{cases} 2x + y = 8 \\
    x - y = 1 \end{cases}$, ¿cuál es el resultado numérico en ambas ecuaciones?
  choices:
  - text: Primera ecuación $= 8$, segunda ecuación $= 1$.
    is_correct: true
  - text: Primera ecuación $= 6$, segunda ecuación $= 2$.
    is_correct: false
  - text: Primera ecuación $= 0$, segunda ecuación $= 0$.
    is_correct: false
  - text: Primera ecuación $= 10$, segunda ecuación $= 5$.
    is_correct: false
  explanation: La alternativa correcta es 'Primera ecuación $= 8$, segunda ecuación
    $= 1$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos ecuaciones y las dos incógnitas $x, y$.'
- 'Paso 2: Sustituir las coordenadas $(x, y)$ en la primera ecuación y calcular.'
- 'Paso 3: Sustituir las coordenadas $(x, y)$ en la segunda ecuación y calcular.'
- 'Paso 4: Confirmar que ambas igualdades numéricas se cumplan.'
errores_correccion: '- **Error común:** Creer que con satisfacer una de las dos ecuaciones
  es suficiente para dar por válida la solución.

  - **Cómo corregirlo:** La solución debe satisfacer AMBAS ecuaciones simultáneamente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas 2x2.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas 2x2.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución de un sistema 2x2 debe satisfacer ambas ecuaciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la definición de solución de un sistema de ecuaciones.
- titulo: ¿La regla de Cramer requiere que el determinante del sistema sea distinto
    de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división entre cero.
errores_frecuentes:
- Verificar la solución $(x, y)$ únicamente en la primera ecuación del sistema.
- Sustituir la expresión despejada en la misma ecuación de donde fue extraída al usar
  sustitución.
- Despejar variables distintas en cada ecuación antes de aplicar el método de igualación.
- Multiplicar solo el primer miembro al aplicar reducción olvidando el término constante.
- Calcular el determinante $2 \times 2$ sumando las diagonales en lugar de restarlas.
afirmaciones_verdaderas:
- Un sistema de ecuaciones 2x2 tiene como solución el par ordenado que satisface simultáneamente
  ambas ecuaciones.
- El método de reducción elimina una de las variables sumando combinaciones lineales
  de las ecuaciones.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver, verificar y modelar
  sistemas de ecuaciones lineales 2x2 mediante los métodos algebraicos y matriciales.
