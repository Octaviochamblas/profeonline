errores_frecuentes:
- Para convertir un número mixto a fracción se suma el entero con el denominador y se multiplica por el numerador.
- El denominador original del número mixto se reemplaza por la suma de todos sus términos.
- Convertir $3 \frac{1}{2}$ a fracción impropia entrega como resultado la fracción $3/2$.
- La conversión de mixto a impropia altera el valor cuantitativo que el número tiene en la recta.
- Un número mixto solo se puede convertir a fracción si la parte entera es un número par.
afirmaciones_verdaderas:
- La conversión de $C \frac{r}{b}$ a fracción impropia se calcula como $\frac{C \cdot b + r}{b}$.
- El denominador de la fracción impropia resultante es siempre idéntico al denominador de la parte fraccionaria.
al_terminar_debes_poder: '**QUÉ:** Transformar de manera precisa y expedita números mixtos a fracciones impropias para operar en el cuerpo $\mathbb{Q}$.


  **CÓMO:** Aplicando la descomposición aditiva $E \frac{a}{b} = E + \frac{a}{b} = \frac{E \cdot b + a}{b}$ y anteponiendo el signo global en el caso de números mixtos negativos $-E \frac{a}{b} = -\frac{E \cdot b + a}{b}$.


  ![Resumen Conversión de número mixto a fracción impropia](/static/img/nodos/conversion-de-numero-mixto-a-fraccion-impropia-resumen.svg)'
