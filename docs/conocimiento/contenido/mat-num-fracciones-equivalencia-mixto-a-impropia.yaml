semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.MIXTO_A_IMPROPIA
resumen_inicial: "La conversión de número mixto a fracción impropia consiste en transformar la parte entera y la parte fraccionaria propia en una sola fracción con numerador mayor que el denominador."
explicacion_simple: |
  Imagina que tienes $3\frac{1}{2}$ pizzas. Cada pizza entera tiene 2 mitades. Las 3 pizzas enteras suman $3 \times 2 = 6$ mitades. Si le sumas la media pizza que te quedaba, tienes un total de $6 + 1 = 7$ mitades. Así que $3\frac{1}{2}$ equivale a $\frac{7}{2}$. La regla rápida es: **multiplicas el número entero por el denominador de abajo y le sumas el número de arriba**. El resultado es el nuevo numerador y mantienes el mismo denominador.
explicacion_formal: |
  Formalmente, dado un número mixto $A\frac{b}{c}$ con $A, b, c \in \mathbb{Z}^+$ y $b < c$, el proceso de conversión a la **fracción impropia equivalente** $\frac{N}{c}$ se fundamenta en la suma de fracciones con igual denominador:
  $A$\frac{b}{c}$ = A + \frac{b}{c} = \frac{A \cdot c}{c} + \frac{b}{c} = \frac{A \cdot c + b}{c}$

  Por consiguiente, la fórmula general del nuevo numerador $N$ es:
  $$N = A \cdot c + b$$
  conservando el denominador original $c$.
definiciones_clave: |
  - **Conversión de mixto a impropia**: Algoritmo algebraico para pasar de la forma $A\frac{b}{c}$ a la forma $\frac{N}{c}$.
  - **Numerador acumulado ($N$)**: Valor obtenido mediante $N = A \cdot c + b$.
  - **Conservación del denominador**: Principio por el cual la unidad fraccionaria base $\frac{1}{c}$ no sufre modificación.
propiedades_relaciones: |
  - **Invarianza de valor**: $A\frac{b}{c}$ y $\frac{A \cdot c + b}{c}$ representan exactamente el mismo punto de la recta numérica.
  - **Operatividad algebraica**: La conversión a fracción impropia es un paso previo indispensable para realizar multiplicaciones, divisiones y potencias con números mixtos.
  - **Biyección**: El proceso es totalmente reversible mediante el algoritmo de la división entera ($N \div c$).
ejemplo_guiado:
  enunciado: "Convierte el número mixto $4\\frac{2}{5}$ a fracción impropia, explicando detalladamente el cálculo de las partes enteras en función de la unidad fraccionaria $\\frac{1}{5}$."
  pasos:
    - "Identificar los componentes: entero $A = 4$, numerador propio $b = 2$, denominador $c = 5$."
    - 'Calcular las unidades fraccionarias contenidas en los 4 enteros: $4 \cdot 5 = 20$ quintos.'
    - "Sumar las 2 unidades fraccionarias adicionales: $20 + 2 = 22$ quintos."
    - 'Formar la fracción impropia conservando el denominador: $\frac{22}{5}$.'
    - 'Verificación: $22 \div 5 = 4$ con residuo $2$, lo que reconstruye $4\frac{2}{5}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es la fórmula algebraica para hallar el numerador $N$ de la fracción impropia equivalente al número mixto $A\\frac{b}{c}$?"
    choices:
      - {text: "Multiplicar el entero por el denominador y sumar el numerador: $N = A \\cdot c + b$.", is_correct: true}
      - {text: "Sumar el entero más el numerador y multiplicar por el denominador: $N = (A + b) \\cdot c$.", is_correct: false}
      - {text: "Multiplicar el entero por el numerador y sumar el denominador: $N = A \\cdot b + c$.", is_correct: false}
      - {text: "Dividir el entero entre el denominador: $N = A \\div c$.", is_correct: false}
    explanation: "La correcta es Multiplicar el entero por el denominador y sumar el numerador: $N = A \\cdot c + b$.: convierte los $A$ enteros en $A \\cdot c$ unidades fraccionarias y les añade las $b$ existentes."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cuál es la fracción impropia equivalente al número mixto $6\\frac{3}{4}$?"
    choices:
      - {text: '\$\frac{27}{4}$', is_correct: true}
      - {text: '\$\frac{24}{4}$', is_correct: false}
      - {text: '\$\frac{18}{4}$', is_correct: false}
      - {text: '\$\frac{27}{3}$', is_correct: false}
    explanation: 'La correcta es$ \frac{27}{4}$: calculamos el numerador $6 \cdot 4 + 3 = 24 + 3 = 27$ y mantenemos el denominador $4$.'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar la parte entera $A$, el numerador $b$ y el denominador $c$."
  - 'Paso 2: Multiplicar la parte entera por el denominador: $A \cdot c$.'
  - 'Paso 3: Sumar el numerador $b$ al resultado previo: $N = A \cdot c + b$.'
  - 'Paso 4: Escribir la fracción impropia resultante $\frac{N}{c}$.'
errores_correccion: |
  Un error muy extendido es multiplicar la parte entera por el numerador en lugar del denominador (hacer $A \cdot b + c$). Recuerda la regla: **multiplicas hacia abajo** (entero por denominador) y **sumas hacia arriba** (con el numerador).
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Convierte $5\\frac{1}{3}$ a fracción impropia."
    alternativas:
      - '\$\frac{16}{3}$'
      - '\$\frac{15}{3}$'
      - '\$\frac{8}{3}$'
    respuesta: '\$\frac{16}{3}$'
    solucion_pasos:
      - 'Multiplicamos el entero por el denominador: $5 \cdot 3 = 15$.'
      - "Sumamos el numerador: $15 + 1 = 16$."
      - 'La fracción impropia equivalente es $\frac{16}{3}$.'
  - titulo: "Ejemplo 2"
    enunciado: "Una receta requiere $2\\frac{3}{8}$ kg de harina. ¿Cuántos octavos de kg de harina se necesitan en total?"
    alternativas:
      - 'Se necesitan \$\frac{19}{8}$ kg (19 octavos).'
      - 'Se necesitan \$\frac{16}{8}$ kg (16 octavos).'
      - 'Se necesitan \$\frac{14}{8}$ kg (14 octavos).'
    respuesta: 'Se necesitan \$\frac{19}{8}$ kg (19 octavos).'
    solucion_pasos:
      - 'Calculamos $2 \cdot 8 + 3 = 16 + 3 = 19$.'
      - 'Expresamos como octavos: $\frac{19}{8}$ kg.'
  - titulo: "¿Se mantiene siempre el mismo denominador al pasar de número mixto a fracción impropia?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, el tamaño de la unidad fraccionaria (el denominador) no cambia durante la conversión."
  - titulo: "¿Es necesario convertir los números mixtos a fracciones impropias antes de multiplicarlos entre sí?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, para multiplicar correctamente números mixtos se deben convertir previamente a fracciones impropias."
errores_frecuentes:
  - "Multiplicar el entero por el numerador en lugar de multiplicarlo por el denominador."
  - 'Olvidar sumar el numerador original después de multiplicar $A \cdot c$.'
  - "Cambiar el denominador de la fracción en el resultado final."
  - "Sumar el entero al numerador sin haberlo multiplicado antes por el denominador."
  - "Confundir la conversión a impropia con simplificación."
afirmaciones_verdaderas:
  - 'Para convertir $A\frac{b}{c}$ a fracción impropia se calcula el numerador como $A \cdot c + b$ y se conserva el denominador $c$.'
  - "Un número mixto y su correspondiente fracción impropia representan exactamente el mismo valor cuantitativo."
al_terminar_debes_ponder: |
  Debes ser capaz de convertir cualquier número mixto a fracción impropia de manera rápida y precisa para operar algebraicamente con él.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
