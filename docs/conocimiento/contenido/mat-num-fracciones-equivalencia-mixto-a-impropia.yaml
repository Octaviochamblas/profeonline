semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.MIXTO_A_IMPROPIA
resumen_inicial: 'Para convertir el número mixto $C \frac{r}{b}$ a fracción impropia, se multiplica el entero por el denominador y se le suma el numerador: $\frac{C \cdot b + r}{b}$.'
explicacion_simple: 'Para transformar un número mixto en una sola fracción impropia, multiplicamos la parte entera grande por el denominador de abajo y le sumamos el numerador de arriba. El resultado obtenido será el nuevo numerador y mantenemos exactamente el mismo denominador.


  ![Conversión de número mixto a fracción impropia](/static/img/nodos/conversion-de-numero-mixto-a-fraccion-impropia-intro.svg)'
explicacion_formal: 'Dado el número mixto $C \frac{r}{b}$ con $C \in \mathbb{Z}^+$ y $0 < r < b$, la **Transformación a Fracción Impropia** se deduce de la suma con denominador común:


  $$C \frac{r}{b} = C + \frac{r}{b} = \frac{C \cdot b}{b} + \frac{r}{b} = \frac{C \cdot b + r}{b}$$


  **Desglose de la fórmula:**

  - $C \cdot b$: Cantidad total de unidades fraccionarias contenidas en los $C$ enteros completos.

  - $C \cdot b + r$: Numerador final de la fracción impropia equivalente.

  - $b$: Denominador que se conserva intacto.


  > **Complemento didáctico:** Para $3 \frac{2}{5}$, calculamos $(3 \cdot 5 + 2)/5 = (15 + 2)/5 = \frac{17}{5}$.'
definiciones_clave: '- **Algoritmo de mixto a impropia**: Fórmula $\frac{C \cdot b + r}{b}$ que convierte un número mixto en fracción impropia equivalente.'
propiedades_relaciones: '- **Invarianza de denominador**: El denominador $b$ de la fracción se conserva idéntico.'
ejemplo_guiado:
  enunciado: 'Convierta el número mixto $4 \frac{2}{3}$ a una fracción impropia aplicando el algoritmo.


    ![Ejemplo Conversión de número mixto a fracción impropia](/static/img/nodos/conversion-de-numero-mixto-a-fraccion-impropia-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el entero ($C = 4$), el numerador ($r = 2$) y el denominador ($b = 3$).'
  - 'Paso 2: Multiplicar el entero por el denominador: $C \cdot b = 4 \cdot 3 = 12$.'
  - 'Paso 3: Sumar el numerador: $12 + r = 12 + 2 = 14$.'
  - 'Paso 4: Formar la fracción impropia conservando el denominador $3$: $\frac{14}{3}$.'
  - 'Conclusión: $4 \frac{2}{3} = \frac{14}{3}$.'
