procedimiento:
- 'Paso 1: Multiplicar la parte entera $C$ por el denominador $b$.'
- 'Paso 2: Sumar el numerador $r$ al producto obtenido en el paso anterior.'
- 'Paso 3: Colocar dicho resultado sobre el denominador original $b$ para obtener $\frac{C \cdot b + r}{b}$.'
errores_correccion: '- **Error 1: Multiplicar el entero por el numerador en lugar del denominador.** **Cómo corregirlo:** Se multiplica por el DENOMINADOR ($C \cdot b$) y luego se SUMA el numerador ($+ r$).


  - **Error 2: Cambiar el denominador al hacer la conversión.** **Cómo corregirlo:** El denominador se MANTIENE INTACTO en todo el procedimiento.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Convierta $5 \frac{1}{4}$ a fracción impropia.
  alternativas:
  - 21/4
  - 20/4
  - 9/4
  respuesta: 21/4
  solucion_pasos:
  - $\frac{5 \cdot 4 + 1}{4} = \frac{20 + 1}{4} = \frac{21}{4}$.
- titulo: Ejemplo 2
  enunciado: ¿Es $1 \frac{7}{8}$ igual a 15/8?
  alternativas:
  - Sí, porque (1 · 8 + 7)/8 = 15/8
  - No, da 8/7
  - No, da 5/8
  respuesta: Sí, porque (1 · 8 + 7)/8 = 15/8
  solucion_pasos:
  - $1 \cdot 8 + 7 = 15 \implies 15/8$.
- titulo: ¿Mantiene la conversión de mixto a impropia el mismo denominador original?
  respuesta: Sí
  solucion_pasos:
  - Sí, el denominador de la fracción no sufre ningún cambio.
  alternativas:
  - texto: Sí
