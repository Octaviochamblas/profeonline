procedimiento:
- 'Paso 1: Identificar las cantidades iniciales a dividir o repartir.'
- 'Paso 2: Calcular el M.C.D. de las cantidades para obtener el tamaño máximo de cada grupo.'
- 'Paso 3: Dividir cada cantidad inicial entre el M.C.D. para saber la cantidad de grupos obtenidos.'
errores_correccion: '- **Error 1: Usar el m.c.m. en problemas que piden dividir o cortar.** **Cómo corregirlo:** Si se busca fraccionar en partes más pequeñas sin residuos, se usa el M.C.D.


  - **Error 2: Confundir el tamaño de cada bolsa (M.C.D.) con el número total de bolsas (suma de cocientes).** **Cómo corregirlo:** El M.C.D. da el tamaño del grupo; para el número de grupos se divide cada cantidad por el M.C.D.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Se quieren cortar dos cintas de 40 cm y 60 cm en trozos iguales de la mayor longitud posible. ¿Cuánto mide cada trozo?
  alternativas:
  - 20 cm
  - 120 cm
  - 10 cm
  respuesta: 20 cm
  solucion_pasos:
  - $\operatorname{MCD}(40, 60) = 20$ cm.
- titulo: Ejemplo 2
  enunciado: En el ejemplo de las cintas de 40 cm y 60 cm cortadas en trozos de 20 cm, ¿cuántos trozos se obtienen en total?
  alternativas:
  - 5 trozos
  - 100 trozos
  - 3 trozos
  respuesta: 5 trozos
  solucion_pasos:
  - '$40 : 20 = 2$ trozos y $60 : 20 = 3$ trozos. Total = $2 + 3 = 5$ trozos.'
- titulo: ¿Se aplica el M.C.D. para dividir cantidades distintas en grupos del mayor tamaño posible?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la aplicación principal del M.C.D. en problemas reales.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la resolución del problema contextualizado aplicando la herramienta adecuada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el análisis del problema entrega una solución numérica única y bien fundamentada.
  - texto: No es posible determinarlo con los datos entregados
    es_correcta: false
