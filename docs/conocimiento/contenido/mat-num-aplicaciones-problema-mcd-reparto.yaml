semantic_id: MAT.NUM.APLICACIONES_MCM_MCD.PROBLEMA_MCD_REPARTO
resumen_inicial: "Los problemas de reparto equitativo sin desperdicios se resuelven calculando el Máximo Común Divisor (MCD) de las cantidades dadas."
explicacion_simple: |
  Imagina que organizas un campamento escolar. Te entregan 40 latas de atún y 64 paquetes
  de fideos, y debes preparar cajas idénticas sin que sobre nada. Esta clase de
  situaciones, donde necesitas dividir cantidades en partes iguales lo más grandes
  posibles, se resuelven usando el Máximo Común Divisor (MCD).
explicacion_formal: |
  En problemas de reparto, corte o división máxima, se busca fragmentar cantidades $a,b,c$
  en partes iguales, sin desperdicios (resto $0$), maximizando el tamaño de cada parte o el
  número de grupos. El valor óptimo es $\text{MCD}(a,b)$. Palabras clave: "repartir
  equitativamente", "cortar en trozos del mayor largo posible", "el mayor número de cajas".
  Ejemplo: repartiendo 24 lápices azules y 36 rojos, $\text{MCD}(24,36)=12$ estuches, con 2
  azules y 3 rojos cada uno.
definiciones_clave: |
  **Reparto máximo sin desperdicio**: distribución de cantidades en partes iguales,
  utilizando todo el recurso, maximizando el tamaño de cada parte o el número de grupos.
propiedades_relaciones: |
  El resultado del MCD siempre es menor o igual que las cantidades originales, nunca
  mayor: tiene sentido, porque es un divisor de ellas.
ejemplo_guiado:
  enunciado: "Se quieren armar bolsas con 18 caramelos de menta y 30 de limón, con la misma cantidad de cada tipo en cada bolsa, sin que sobre nada. ¿Cuántas bolsas como máximo se pueden armar?"
  pasos:
    - "Calculamos $\\text{MCD}(18,30)$: $18=2\\cdot3^2$, $30=2\\cdot3\\cdot5$, MCD$=2\\cdot3=6$."
    - "Se pueden armar 6 bolsas."
    - "Conclusión: cada bolsa tendrá $18\\div6=3$ caramelos de menta y $30\\div6=5$ de limón."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué operación se usa para resolver un problema de reparto equitativo máximo sin desperdicios?"
    choices:
      - {text: "El Máximo Común Divisor de las cantidades", is_correct: true}
      - {text: "El Mínimo Común Múltiplo de las cantidades", is_correct: false}
      - {text: "La resta de las cantidades", is_correct: false}
      - {text: "El promedio de las cantidades", is_correct: false}
    explanation: "La correcta es El Máximo Común Divisor de las cantidades: el MCD da el mayor tamaño de parte o número de grupos posible sin que sobre nada."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, si tienes 16 lápices y 24 gomas, ¿cuántos estuches iguales como máximo puedes armar?"
    choices:
      - {text: "8", is_correct: true}
      - {text: "4", is_correct: false}
      - {text: "48", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 8: $\\text{MCD}(16,24)=8$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identifica las cantidades de los diferentes elementos que se desean repartir o cortar.'
  - 'Paso 2: Extrae los números correspondientes a estas cantidades.'
  - 'Paso 3: Calcula el Máximo Común Divisor (MCD) de dichos números.'
  - 'Paso 4: Interpreta el resultado del MCD: si representa el tamaño de cada trozo o el número total de grupos, y realiza divisiones simples si se te solicita la composición de cada grupo.'
errores_correccion: |
  Un error frecuente es calcular el MCM en lugar del MCD, obteniendo un valor gigante
  imposible de usar para repartir. Otro error es confundir el número de grupos (MCD) con
  el contenido de cada grupo (resultado de dividir cada cantidad por el MCD).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Un artesano tiene dos alambres de $45$ cm y $60$ cm de largo. Quiere cortarlos en pedazos iguales del mayor tamaño posible, sin desperdiciar nada. ¿Cuánto medirá cada trozo?
    alternativas:
      - "15 cm"
      - "5 cm"
      - "180 cm"
    respuesta: "15 cm"
    solucion_pasos:
      - 'Paso a: Extraemos las longitudes de los alambres: $45$ y $60$.'
      - 'Paso b: Buscamos el MCD de $45$ y $60$.'
      - 'Paso c: Calculamos: $45 = 3^2 \cdot 5$ y $60 = 2^2 \cdot 3 \cdot 5$. El MCD es $3^1 \cdot 5^1 = 15$.'
      - 'Paso d: Concluimos que cada pedazo debe medir $15$ cm.'
  - titulo: Ejemplo 2
    enunciado: Se desean armar bolsas de regalo con $24$ autitos de juguete y $32$ pelotas. Cada bolsa debe contener la misma cantidad de autitos y pelotas, sin que sobre nada. ¿Cuál es el número máximo de bolsas que se pueden armar y cuántos autitos tendrá cada una?
    alternativas:
      - "8 bolsas, con 3 autitos cada una"
      - "4 bolsas, con 6 autitos cada una"
      - "8 bolsas, con 4 autitos cada una"
    respuesta: "8 bolsas, con 3 autitos cada una"
    solucion_pasos:
      - 'Paso a: Las cantidades son $24$ y $32$.'
      - 'Paso b: Calculamos el $\text{MCD}(24, 32) = 8$. Se pueden armar como máximo $8$ bolsas.'
      - 'Paso c: Dividimos el número de autitos por el total de bolsas: $24 \div 8 = 3$.'
      - 'Paso d: Concluimos que se armarán $8$ bolsas, y cada una tendrá $3$ autitos (y $4$ pelotas).'
  - titulo: '¿Si tienes $20$ kg de arroz y $28$ kg de azúcar, y quieres envasarlos en sacos iguales de peso máximo entero, medirá cada saco $4$ kg?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Buscamos el MCD de las cantidades $20$ y $28$.'
      - 'Los divisores de $20$ son $\{1, 2, 4, 5, 10, 20\}$ y de $28$ son $\{1, 2, 4, 7, 14, 28\}$.'
      - 'El mayor divisor común es $4$, por lo tanto, el peso de cada saco será de $4$ kg.'
  - titulo: '¿Si cortas dos cintas de $18$ cm y $24$ cm en trozos del mayor largo posible, obtendrás en total $6$ trozos?'
    respuesta: 'No'
    solucion_pasos:
      - 'Calculamos el $\text{MCD}(18, 24) = 6$ cm de largo para cada trozo.'
      - 'Para saber el total de trozos, dividimos cada cinta por el largo: $18 \div 6 = 3$ trozos y $24 \div 6 = 4$ trozos.'
      - 'En total se obtienen $3 + 4 = 7$ trozos, no $6$ trozos.'
errores_frecuentes:
  - Calcular el MCM en lugar del MCD, obteniendo un valor gigante que no se puede usar para repartir o cortar (por ejemplo, decir que los trozos deben medir 180 cm cuando el alambre original mide 45 cm).
  - Confundir el número de grupos (MCD) con el contenido de cada grupo (resultado de dividir cada cantidad por el MCD).
  - Dejar residuos en el reparto por no calcular el divisor común exacto más alto.
  - Restar las cantidades en lugar de calcular su MCD.
  - Pensar que la mayor longitud posible para cortar es siempre el menor de los dos números dados, sin comprobar si es divisor del mayor.
al_terminar_debes_poder: |
  Reconocer problemas de reparto equitativo máximo sin desperdicios y resolverlos
  calculando el MCD de las cantidades dadas.
fuente: Teoría de Números
estado: publicado
