semantic_id: MAT.NUM.APLICACIONES_MCM_MCD.PROBLEMA_MCD_REPARTO
resumen_inicial: Los problemas de división en partes iguales de máximo tamaño se resuelven calculando el M.C.D. de las cantidades.
explicacion_simple: 'Cuando un problema pide dividir, cortar o repartir varios grupos de objetos de diferentes tamaños en paquetes, cajas o tiras de igual cantidad sin que sobre nada, y exige que ese tamaño sea el ''mayor posible'', la herramienta matemática adecuada para resolverlo es el máximo común divisor.


  ![Resolución de problemas de reparto en grupos iguales con M.C.D.](/static/img/nodos/resolucion-de-problemas-de-reparto-en-grupos-iguales-con-mcd-intro.svg)'
explicacion_formal: 'En la **Modelación de Partición Óptima**, para cantidades $Q_1, Q_2, \dots, Q_k$, la **Medida de Corte o Reparto Máximo** $S_{\max}$ se define por:


  $$S_{\max} = \operatorname{MCD}(Q_1, Q_2, \dots, Q_k)$$


  **Desglose de la fórmula:**

  - $S_{\max}$: Tamaño o capacidad máxima común de cada grupo de división.

  - Número de grupos formados de tipo $i$: $N_i = \frac{Q_i}{S_{\max}}$.


  > **Complemento didáctico:** Palabras clave en el enunciado como ''dividir en partes iguales'', ''el mayor tamaño posible'', ''paquetes idénticos sin sobrantes'' o ''corta de longitud máxima'' indican el uso del M.C.D.'
definiciones_clave: '- **Problema de reparto equitativo**: Contexto donde varias cantidades se dividen en grupos homogéneos máximos.

  - **Divisor de máxima capacidad**: El valor del M.C.D. que fija el tamaño óptimo de la división.'
ejemplo_guiado:
  enunciado: 'Se tienen 24 manzanas y 36 naranjas. Se quieren armar bolsas iguales con la mayor cantidad de frutas posibles sin mezclar tipos ni dejar sobras. ¿Cuántas frutas habrá en cada bolsa y cuántas bolsas se armarán?


    ![Ejemplo Resolución de problemas de reparto en grupos iguales con M.C.D.](/static/img/nodos/resolucion-de-problemas-de-reparto-en-grupos-iguales-con-mcd-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar que se trata de un reparto equitativo en grupos del mayor tamaño posible.'
  - 'Paso 2: Calcular el M.C.D. de las cantidades: $\operatorname{MCD}(24, 36) = 12$.'
  - 'Paso 3: Cada bolsa contendrá $12$ frutas.'
  - 'Paso 4: Calcular la cantidad de bolsas: $24:12 = 2$ bolsas de manzana, $36:12 = 3$ bolsas de naranja. Total = $5$ bolsas.'
  - 'Conclusión: Habrá $12$ frutas en cada bolsa y se armarán $5$ bolsas en total.'
