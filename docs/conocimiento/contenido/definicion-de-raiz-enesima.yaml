semantic_id: MAT.NUM.RAICES_CONCEPTO.DEFINICION_RAIZ_ENESIMA
resumen_inicial: La raíz enésima de un número real $a$ es un número real $b$ tal que $b^n = a$, denotado por $\sqrt[n]{a} = b$, donde $n \in \mathbb{N}, n \ge 2$, con $a \ge 0$ y $b \ge 0$ si $n$ es par.
explicacion_simple: '![Definición de raíz enésima](/static/img/nodos/definicion-de-raiz-enesima-intro.svg)


  Calcular una raíz es la operación inversa de calcular una potencia. Mientras que la potencia te pregunta *''¿cuánto da $4^3$?''* ($64$), la raíz te pregunta al revés: *''¿qué número multiplicado por sí mismo $3$ veces da $64$?''* (la respuesta es $4$). Al número pequeñito arriba del gancho lo llamamos **índice** ($n$), al número que está adentro lo llamamos **radicando** ($a$) y al resultado lo llamamos **raíz** ($b$).'
explicacion_formal: "Sean $a \\in \\mathbb{R}$ y $n \\in \\mathbb{N}$ con $n \\ge 2$. La **Raíz Enésima** de $a$, denotada por $\\sqrt[n]{a}$, se define como el número real $b \\in \\mathbb{R}$ tal que:\n\n$$\\sqrt[n]{a} = b \\iff b^n = a$$\n\n**Condiciones analíticas de definición:**\n1. **Índice par ($n = 2k, k \\in \\mathbb{N}$):**\n   - Requiere obligatoriamente que el radicando sea no negativo: $a \\ge 0$.\n   - Se define la **raíz principal** como el único valor no negativo $b \\ge 0$.\n   - Para $a < 0$, $\\sqrt[2k]{a} \\notin \\mathbb{R}$.\n2. **Índice impar ($n = 2k+1, k \\in \\mathbb{N}$):**\n   - Está definida para todo $a \\in \\mathbb{R}$.\n   - Existe un único $b \\in \\mathbb{R}$ tal que $b^n = a$, conservando el signo del radicando ($\\operatorname{sgn}(b) = \\operatorname{sgn}(a)$)."
definiciones_clave: '- **Radicación**: Operación matemática inversa de la potenciación respecto a la base.

  - **Índice ($n$)**: Grado del radical, natural mayor o igual a 2 ($n \in \mathbb{N}_{\ge 2}$).

  - **Radicando ($a$)**: Cantidad subradical sobre la cual opera la raíz.

  - **Raíz ($b$)**: Valor real que elevado a la potencia $n$ reproduce exactamente a $a$.'
propiedades_relaciones: '- **Existencia**: Garantizada en $\mathbb{R}$ si $n$ es impar, o si $n$ es par con $a \ge 0$.

  - **Raíz de cero**: $\sqrt[n]{0} = 0$ para todo índice $n \ge 2$.

  - **Raíz de la unidad**: $\sqrt[n]{1} = 1$ para todo índice $n \ge 2$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de definición de raíz enésima](/static/img/nodos/definicion-de-raiz-enesima-ejemplos.svg)


    Calcule el valor de las raíces reales $\sqrt{49}$, $\sqrt[3]{-27}$ y $\sqrt[4]{81}$ justificando mediante la definición de potencia asociada.'
  pasos:
  - 'Paso 1: Evaluar $\sqrt{49}$: Índice $n = 2$ implícito. Se busca $b \ge 0$ tal que $b^2 = 49$. Como $7^2 = 49$, entonces $\sqrt{49} = 7$.'
  - 'Paso 2: Evaluar $\sqrt[3]{-27}$: Índice $n = 3$ impar. Se busca $b \in \mathbb{R}$ tal que $b^3 = -27$. Como $(-3)^3 = -27$, entonces $\sqrt[3]{-27} = -3$.'
  - 'Paso 3: Evaluar $\sqrt[4]{81}$: Índice $n = 4$ par. Se busca $b \ge 0$ tal que $b^4 = 81$. Como $3^4 = 81$, entonces $\sqrt[4]{81} = 3$.'
  - 'Conclusión: Los valores son $\sqrt{49} = 7$, $\sqrt[3]{-27} = -3$ y $\sqrt[4]{81} = 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué $\sqrt[3]{-8} = -2$ pero $\sqrt{-4} \notin \mathbb{R}$?
  choices:
  - text: Porque el índice 3 es impar (admite negativos en $\mathbb{R}$) mientras que el índice 2 es par (ningún real al cuadrado es negativo)
    is_correct: true
  - text: Porque 8 es mayor que 4
    is_correct: false
  - text: Porque las raíces cúbicas siempre son negativas
    is_correct: false
  - text: Porque la raíz cuadrada no existe para ningún número
    is_correct: false
  explanation: La alternativa correcta es 'Porque el índice 3 es impar (admite negativos en $\mathbb{R}$) mientras que el índice 2 es par (ningún real al cuadrado es negativo)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es la razón de que $\sqrt[4]{81} = 3$ y no $\pm 3$?
  choices:
  - text: Por definición de raíz principal de índice par, el resultado es el único valor real no negativo ($b \ge 0$)
    is_correct: true
  - text: Porque $-3$ elevado a $4$ no da $81$
    is_correct: false
  - text: Porque $81$ es impar
    is_correct: false
  - text: Porque los números negativos no tienen potencias cuartas
    is_correct: false
  explanation: La alternativa correcta es 'Por definición de raíz principal de índice par, el resultado es el único valor real no negativo ($b \ge 0$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el índice $n$ y el radicando $a$.'
- 'Paso 2: Verificar la existencia en $\mathbb{R}$ (si $n$ es par, exigir $a \ge 0$).'
- 'Paso 3: Determinar el número real $b$ que cumple $b^n = a$ (eligiendo $b \ge 0$ si $n$ es par).'
errores_correccion: '- **Error 1: Asignar doble signo $\pm$ al operador radical ($\sqrt{25} = \pm 5$).** **Cómo corregirlo:** La raíz principal es unívoca y no negativa: $\sqrt{25} = +5$.

  - **Error 2: Intentar calcular raíces de índice par con radicando negativo en $\mathbb{R}$.** **Cómo corregirlo:** Indicar que no tiene solución en el conjunto de los números reales ($\sqrt{-9} \notin \mathbb{R}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\sqrt[3]{64}$?
  alternativas:
  - $4$
  - $8$
  - $16$
  respuesta: $4$
  solucion_pasos:
  - $4^3 = 64 \implies \sqrt[3]{64} = 4$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\sqrt{100}$?
  alternativas:
  - $10$
  - $\pm 10$
  - $50$
  respuesta: $10$
  solucion_pasos:
  - $10^2 = 100 \implies \sqrt{100} = 10$.
- titulo: ¿Es ∛(-1) igual a -1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-1)^3 = -1 \implies \sqrt[3]{-1} = -1$.
  alternativas:
  - texto: Sí, (-1)³ = -1
    es_correcta: true
    retroalimentacion: ¡Correcto! El índice impar preserva el signo negativo.
  - texto: No, las raíces de negativos no existen en ℝ
    es_correcta: false
    retroalimentacion: Incorrecto, solo las de índice par no existen en ℝ.
  - texto: No, es igual a +1
    es_correcta: false
    retroalimentacion: Incorrecto, $1^3 = +1 \neq -1$.
- titulo: ¿Pertenece √(-16) a los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, ningún número real al cuadrado produce un resultado negativo ($\sqrt{-16} \notin \mathbb{R}$).
  alternativas:
  - texto: No, porque el índice 2 es par y el radicando es negativo (∉ ℝ)
    es_correcta: true
    retroalimentacion: ¡Correcto! $\sqrt{-16} \notin \mathbb{R}$.
  - texto: Sí, es igual a -4
    es_correcta: false
    retroalimentacion: Incorrecto, $(-4)^2 = +16 \neq -16$.
  - texto: Sí, es igual a 4
    es_correcta: false
    retroalimentacion: Incorrecto, $4^2 = +16 \neq -16$.
errores_frecuentes:
- Afirmar que $\sqrt{a}$ entrega dos resultados simultáneos $(\pm)$.
- Confundir la radicación con la división por el índice (creer que $\sqrt{16} = 8$).
- Afirmar que las raíces cúbicas de números negativos no son reales.
- Olvidar que el índice por defecto de $\sqrt{a}$ es 2.
- Calcular $b^n$ multiplicando base por exponente.
afirmaciones_verdaderas:
- La radicación es la operación inversa de la potenciación respecto a la base.
- Para índices pares, la raíz principal es siempre un número real mayor o igual a cero.
- Para índices impares, todo número real posee una única raíz en $\mathbb{R}$.
al_terminar_debes_poder: '![Síntesis de definición de raíz enésima](/static/img/nodos/definicion-de-raiz-enesima-resumen.svg)


  QUÉ: Comprender, calcular y justificar raíces enésimas en el conjunto de los números reales.


  CÓMO: Aplicando la equivalencia fundamental $\sqrt[n]{a} = b \iff b^n = a$, considerando la paridad del índice $n$ y seleccionando la raíz principal no negativa para índices pares.'
fuente: Texto escolar MINEDUC — Matemática 8° Básico / 1° Medio / PAES.
