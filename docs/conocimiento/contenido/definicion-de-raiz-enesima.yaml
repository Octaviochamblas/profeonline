semantic_id: MAT.NUM.RAICES_CONCEPTO.DEFINICION_RAIZ_ENESIMA
resumen_inicial: La raíz n-ésima de un número real $a$ es un número $b$ que al elevarse
  al exponente $n$ da como resultado $a$ ($\sqrt[n]{a} = b \iff b^n = a$).
explicacion_simple: 'Calcular la raíz $n$-ésima de un número consiste en buscar cuál
  número, multiplicado por sí mismo $n$ veces, da como resultado el número original:

  - $\sqrt[3]{8} = 2$ porque $2^3 = 8$.

  - $\sqrt{25} = 5$ porque $5^2 = 25$.

  El símbolo $\sqrt{}$ es el radical, el número dentro es el radicando y el número
  pequeño arriba es el índice.'
explicacion_formal: Sea $n \in \mathbb{N}, n \ge 2$ y $a \in \mathbb{R}$. La raíz
  $n$-ésima principal $\sqrt[n]{a}$ es el número real $b$ tal que $b^n = a$. Si $n$
  es par, se requiere $a \ge 0$ y $b \ge 0$. Si $n$ es impar, $b$ se define para todo
  $a \in \mathbb{R}$ conservando su signo.
definiciones_clave: '- **Radical ($\sqrt{}$)**: Símbolo matemático de la operación
  de radicación.

  - **Índice ($n$)**: Grado de la raíz que indica el exponente de la potencia inversa.

  - **Radicando ($a$)**: Número o expresión a la que se le extrae la raíz.'
propiedades_relaciones: '- **Relación con la potencia**: $\sqrt[n]{a} = b \iff b^n
  = a$.'
ejemplo_guiado:
  enunciado: Calcula el valor de $\sqrt[4]{81}$ justificando tu respuesta.
  pasos:
  - Identificar el índice $n = 4$ y el radicando $a = 81$.
  - Buscar un número real $b$ tal que $b^4 = 81$.
  - 'Probar valores: $3^4 = 3 \cdot 3 \cdot 3 \cdot 3 = 81$.'
  - Concluir que $\sqrt[4]{81} = 3$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la definición formal de $\sqrt[3]{125} = 5$?
  choices:
  - text: Porque 5^3 = 125
    is_correct: true
  - text: Porque 125 / 3 = 5
    is_correct: false
  - text: Porque 5 * 3 = 15
    is_correct: false
  - text: Porque 125 - 3 = 122
    is_correct: false
  explanation: 'La correcta es: Porque 5^3 = 125. Por definición de raíz $n$-ésima.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $\sqrt[5]{32}$?
  choices:
  - text: '2'
    is_correct: true
  - text: 6,4
    is_correct: false
  - text: '4'
    is_correct: false
  - text: '16'
    is_correct: false
  explanation: 'La correcta es: 2. Puesto que $2^5 = 32$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el índice $n$ y el radicando $a$.'
- 'Paso 2: Encontrar el número $b$ cuyo producto repetido $n$ veces equivalga a $a$.'
- 'Paso 3: Verificar que $b^n = a$.'
errores_correccion: No divides el radicando por el índice. $\sqrt[3]{27}$ NO es $27
  \div 3 = 9$, sino $3$ porque $3^3 = 27$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\sqrt{64}$.
  alternativas:
  - '8'
  - '32'
  - '16'
  respuesta: '8'
  solucion_pasos:
  - $8^2 = 64 \implies \sqrt{64} = 8$.
errores_frecuentes:
- Dividir el radicando entre el índice.
afirmaciones_verdaderas:
- $\sqrt[n]{a} = b \iff b^n = a$.
al_terminar_debes_poder: Calcular raíces n-ésimas comprendiendo su significado como
  potencia inversa.
fuente: Texto escolar MINEDUC.
estado: publicado
