semantic_id: MAT.NUM.RAICES_CONCEPTO.DEFINICION_RAIZ_ENESIMA
resumen_inicial: 'La raíz $n$-ésima de un número $a$ es el número real $b$ tal que
  elevado a la potencia $n$ reproduce exactamente el radicando $a$: $\sqrt[n]{a} =
  b \iff b^n = a$.'
explicacion_simple: Calcular una raíz $n$-ésima significa encontrar qué número elevado
  a esa potencia $n$ nos da el número de adentro. Por ejemplo, la raíz cúbica de 8
  es 2 porque 2 elevado a 3 da exactamente 8.
explicacion_formal: 'Para todo $a \in \mathbb{R}$ y $n \in \mathbb{N}_{\ge 2}$, el
  valor de la **Raíz $n$-ésima** $\sqrt[n]{a} = b$ se define mediante la equivalencia
  lógica de potenciación:


  $$\sqrt[n]{a} = b \iff b^n = a$$


  **Desglose de condiciones de existencia:**

  - Si $n$ es impar ($3, 5, 7, \dots$), la raíz $\sqrt[n]{a}$ existe y es única para
  todo $a \in \mathbb{R}$ conservando el signo de $a$.

  - Si $n$ es par ($2, 4, 6, \dots$), la raíz $\sqrt[n]{a}$ existe en $\mathbb{R}$
  si y solo si $a \ge 0$, definiéndose como el valor único $b \ge 0$.


  > **Complemento didáctico:** El símbolo radical $\sqrt{}$ proviene de la letra r
  latina abreviatura de la palabra *radix*.'
definiciones_clave: '- **Raíz $n$-ésima**: Valor real $b$ que satisface la igualdad
  de potencia $b^n = a$.'
propiedades_relaciones: '- **Equivalencia de potencia**: $\sqrt[n]{a} = b \iff b^n
  = a$.'
ejemplo_guiado:
  enunciado: Calcule el valor exacto de las raíces $\sqrt[3]{27}$ y $\sqrt[4]{16}$.
  pasos:
  - 'Paso 1: Para $\sqrt[3]{27}$, buscar un número $b$ tal que $b^3 = 27$. Como $3^3
    = 27 \implies \sqrt[3]{27} = 3$.'
  - 'Paso 2: Para $\sqrt[4]{16}$, buscar un número $b \ge 0$ tal que $b^4 = 16$. Como
    $2^4 = 16 \implies \sqrt[4]{16} = 2$.'
  - 'Conclusión: $\sqrt[3]{27} = 3$ y $\sqrt[4]{16} = 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la equivalencia lógica que define a la raíz enésima sqrt[n]{a}
    = b?
  choices:
  - text: b^n = a (el resultado b elevado al índice n da el radicando a)
    is_correct: true
  - text: b · n = a
    is_correct: false
  - text: a + n = b
    is_correct: false
  - text: b / n = a
    is_correct: false
  explanation: La alternativa correcta es 'b^n = a (el resultado b elevado al índice
    n da el radicando a)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt[3]{27}, ¿por qué el resultado es 3?
  choices:
  - text: Porque 3^3 = 3 · 3 · 3 = 27
    is_correct: true
  - text: Porque 27 dividido entre 3 da 9
    is_correct: false
  - text: Porque 3 + 3 + 3 = 9
    is_correct: false
  - text: Porque 27 - 3 = 24
    is_correct: false
  explanation: La alternativa correcta es 'Porque 3^3 = 3 · 3 · 3 = 27'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el índice $n$ y el radicando $a$ dentro de la expresión radical
  $\sqrt[n]{a}$.'
- 'Paso 2: Buscar un número real $b$ que al multiplicarse $n$ veces por sí mismo de
  exactamente el radicando $a$.'
- 'Paso 3: Verificar las restricciones de existencia según la paridad del índice $n$.'
errores_correccion: '- **Error 1: Dividir el radicando por el índice ($\sqrt[3]{27}
  = 27 : 3 = 9$).** **Cómo corregirlo:** La raíz NO es una división; se busca el número
  base de potencia ($3^3 = 27 \implies \sqrt[3]{27} = 3$).


  - **Error 2: Afirmar que $\sqrt{16} = \pm 4$.** **Cómo corregirlo:** La raíz cuadrada
  principal $\sqrt{a}$ entrega ÚNICAMENTE la solución real positiva ($+4$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $\sqrt[3]{64}$.
  alternativas:
  - '4'
  - '16'
  - 21,33
  respuesta: '4'
  solucion_pasos:
  - $4^3 = 64 \implies \sqrt[3]{64} = 4$.
- titulo: Ejemplo 2
  enunciado: Calcule $\sqrt[5]{32}$.
  alternativas:
  - '2'
  - 6,4
  - '8'
  respuesta: '2'
  solucion_pasos:
  - $2^5 = 32 \implies \sqrt[5]{32} = 2$.
- titulo: ¿Es sqrt(100) igual a 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10^2 = 100$.
- titulo: ¿Cumple toda raíz enésima la propiedad (sqrt[n]{a})^n = a?
  respuesta: Sí
  solucion_pasos:
  - Sí, para todo radicando $a$ válido en los reales.
errores_frecuentes:
- Calcular la raíz $n$-ésima de un número dividiendo el radicando $a$ por el índice
  $n$.
- La raíz cuadrada principal de 25 representa dos resultados numéricos distintos en
  $\mathbb{R}$.
- La raíz cúbica de un entero positivo requiere restar el índice al radicando.
- 'La expresión $\sqrt[4]{16}$ equivale numéricamente a la división $16 : 4 = 4$.'
- Todas las raíces de índice par producen valores negativos en el conjunto real.
afirmaciones_verdaderas:
- La raíz $n$-ésima $\sqrt[n]{a} = b$ se define formalmente mediante la equivalencia
  de potencia $b^n = a$.
- La raíz cuadrada principal de un número no negativo $a \ge 0$ entrega un único valor
  real no negativo $\sqrt{a} \ge 0$.
al_terminar_debes_poder: Al terminar serás capaz de evaluar y definir raíces $n$-ésimas
  $\sqrt[n]{a} = b$, verificando la equivalencia de potenciación $b^n = a$ y sus condiciones
  de existencia.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
