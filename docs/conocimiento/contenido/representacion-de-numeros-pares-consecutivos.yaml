semantic_id: MAT.ALG.LENGUAJE_RELACIONES.PARES_CONSECUTIVOS
resumen_inicial: 'Representación de números pares consecutivos: traducción, reglas
  y aplicación práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: Si estamos contando de dos en dos (2, 4, 6, 8.), ya no nos sirve
  sumar de a 1. El salto entre números de la misma familia de paridad es mayor.
explicacion_formal: '### Definición formal


  Entre un par y el siguiente (ej. entre 6 y 8) hay una distancia exacta de 2 unidades,
  por eso se modela como $2n$, luego $2n+2$, etc.


  ### Desarrollo didáctico


  Construcción lógica:

  1. El primer número debe ser garantizado par: $2n$.

  2. ¿Cuál es el siguiente número par? Si le sumo 1 ($2n+1$) caigo en un impar. Debo
  sumarle 2.

  3. El segundo par consecutivo es: $2n+2$.

  4. El tercer par consecutivo es: $2n+4$.


  Si el problema es más permisivo y no exige que las letras representen ''cualquier
  entero'', a veces verás que usan $x, x+2, x+4$ asumiendo tácitamente que ''x'' ya
  es par de antemano.'
definiciones_clave: '- **Representación de números pares consecutivos**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de representación de números pares consecutivos.'
ejemplo_guiado:
