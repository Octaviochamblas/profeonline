resumen_inicial: La números pares consecutivos permite representar estructuras matemáticas
  de sucesiones y desigualdades en notación simbólica.
explicacion_simple: Al trabajar con números pares consecutivos, transformamos frases
  sobre números y relaciones algebraicas en expresiones exactas.
explicacion_formal: 'Sea $x \in \mathbb{R}$. La relación formal para **Números pares
  consecutivos** viene dada por:


  $$\text{"dos números pares consecutivos a partir de 2k"} \implies 2k, 2k+2$$


  > **Complemento didáctico:** Esta estructura fija las reglas formales de planteamiento
  para expresiones algebraicas de orden y sucesiones.'
definiciones_clave: '- **Números pares consecutivos**: Representación simbólica en
  el lenguaje algebraico de relaciones.'
propiedades_relaciones: '- **Consistencia de notación**: 2k, 2k+2 define la estructura
  requerida.'
ejemplo_guiado:
  enunciado: 'Traduzca o exprese según números pares consecutivos: ''dos números pares
    consecutivos a partir de 2k''.'
  pasos:
