errores_frecuentes:
- Omitir el operador de desigualdad estricta o no estricta al traducir números pares
  consecutivos.
- Invertir el orden de las variables al construir la expresión de números pares consecutivos.
- Usar una suma cuando el enunciado de números pares consecutivos exige una resta
  o división.
- Omitir paréntesis al multiplicar expresiones en números pares consecutivos.
- Declarar que la expresión de números pares consecutivos es válida sólo para números
  pares.
afirmaciones_verdaderas:
- La traducción simbólica de números pares consecutivos preserva la relación de orden
  o sucesión entre cantidades.
- La notación algebraica permite expresar relaciones numéricas complejas de forma
  compacta.
al_terminar_debes_poder: Al terminar serás capaz de traducir expresiones de números
