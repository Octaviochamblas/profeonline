procedimiento:
- 'Paso 1: Establece el primer número como 2n (el primer par).'
- 'Paso 2: Suma 2 para hallar el segundo (2n + 2).'
- 'Paso 3: Suma 4 para hallar el tercero (2n + 4), y así sucesivamente.'
- 'Paso 4: Relaciona estos bloques según lo pida el enunciado (suma, resta, producto).'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  representación de números pares consecutivos.
ejemplos:
- titulo: Sumando saltos pares
  enunciado: 'Traduce algebraicamente: ''La suma de tres pares consecutivos''.'
  solucion_pasos:
  - 'Primer par: 2n.'
  - 'Segundo par: 2n + 2.'
  - 'Tercer par: 2n + 4.'
  - 'Suma total: 2n + (2n + 2) + (2n + 4).'
  - 'Reducido: 6n + 6.'
- titulo: 'Un problema geométrico indica: ''Las longitudes de los tres lados de un
    triángulo son números'
  enunciado: 'Un problema geométrico indica: ''Las longitudes de los tres lados de
    un triángulo son números pares consecutivos. Si su perímetro es $60$ cm, halla
    la ecuación correspondiente''. Si el lado más pequeño es $2x$, ¿cuál es la ecuación
    para resolver el perímetro? (v1)


    Opciones: A) $2x + (2x + 2) + (2x + 4) = 60$ · B) $2x + 2(x + 1) + 2(x + 2) =
    60$ · C) $2x + (2x + 1) + (2x + 2) = 60$ · D) $x + (x + 2) + (x + 4) = 60$'
  solucion_pasos:
  - Los tres pares consecutivos, partiendo del menor $2x$, son $2x, 2x+2, 2x+4$. Al
    sumarlos para igualarlos al perímetro 60, obtenemos la opción A. (La opción B
    matemáticamente equivale a la A, pero está factorizada innecesariamente; la A
    es la traducción directa más pulcra).
  - 'Respuesta: $2x + (2x + 2) + (2x + 4) = 60$'
- titulo: 'Respecto de «Representación de números pares consecutivos»: ¿La siguiente
    formulación es cor'
  enunciado: 'Respecto de «Representación de números pares consecutivos»: ¿La siguiente
    formulación es correcta? «Los **Números Pares Consecutivos** se distancian siempre
    en **2 unidades**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Los **Números Pares Consecutivos**
    se distancian siempre en **2 unidades**.'
- titulo: 'Respecto de «Representación de números pares consecutivos»: ¿La siguiente
    conclusión es corr'
  enunciado: 'Respecto de «Representación de números pares consecutivos»: ¿La siguiente
    conclusión es correcta? «Traducirlos como $2n, 2n+1, 2n+2$. (Aquí estás alternando
    par-impar-par)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Los **Números Pares Consecutivos**
    se distancian siempre en **2 unidades**.'
errores_frecuentes:
- Traducirlos como $2n, 2n+1, 2n+2$. (Aquí estás alternando par-impar-par).
- Confundirlos con enteros consecutivos ($x, x+1, x+2$).
- Para «¿Cuál es el intervalo matemático o 'salto' necesario para avanzar desde un
  número par cualquiera hacia su par consecutivo inmediato en la recta numérica? (v1)»,
  la respuesta correcta es Un salto de $1$ unidad.
- Para «¿Cuál es el intervalo matemático o 'salto' necesario para avanzar desde un
  número par cualquiera hacia su par consecutivo inmediato en la recta numérica? (v1)»,
  la respuesta correcta es Un salto de $4$ unidades.
- Multiplicar el número por $2$.
afirmaciones_verdaderas:
- La traducción de representación de números pares consecutivos preserva el significado
  matemático del enunciado.
al_terminar_debes_poder: Traducir y evaluar expresiones que involucren representación
