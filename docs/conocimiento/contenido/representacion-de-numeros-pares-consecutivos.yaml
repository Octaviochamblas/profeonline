semantic_id: MAT.ALG.LENGUAJE_RELACIONES.PARES_CONSECUTIVOS
resumen_inicial: 'La representación de números pares consecutivos consiste en expresar algebraicamente una secuencia de números pares contiguos mediante el incremento constante de 2 unidades $2n, 2n+2, 2n+4, \dots$'
explicacion_simple: |
  Los **números pares consecutivos** son números pares que se siguen uno inmediatamente después del otro en la recta numérica (de 2 en 2):
  - Ejemplos numéricos: $(2, 4, 6)$, $(10, 12, 14)$, $(-4, -2, 0, 2)$.
  - En álgebra, como la diferencia entre dos pares contiguos es **$2$**:
    - **Dos pares consecutivos**: **$2n$** y **$2n + 2$** (o bien $x$ y $x + 2$ si asumimos que $x$ es par).
    - **Tres pares consecutivos**: **$2n$**, **$2n + 2$** y **$2n + 4$**.
    - **Cuatro pares consecutivos**: **$2n$**, **$2n + 2$**, **$2n + 4$** y **$2n + 6$**.
  - **Suma de pares consecutivos**:
    - La suma de 3 pares consecutivos: $2n + (2n + 2) + (2n + 4) = \mathbf{6n + 6} = 6(n + 1)$.
explicacion_formal: |
  ### Definición formal
  Una secuencia de $k$ números **pares consecutivos** generada a partir del primer entero par $2n \in 2\mathbb{Z}$ es una tupla finita en $(2\mathbb{Z})^k$ definida por la adición de saltos pares de razón $r = 2$:

  $$\mathcal{P}_k(n) = (2n, \quad 2n+2, \quad 2n+4, \quad \dots, \quad 2n + 2(k-1))$$

  ### Suma de $k$ Pares Consecutivos (Progresión Aritmética)
  La suma de $k$ pares consecutivos constituye la suma de una progresión aritmética con término inicial $a_1 = 2n$ y razón $r = 2$:

  $$\sum_{i=0}^{k-1} (2n + 2i) = k \cdot (2n) + 2 \cdot \frac{k(k-1)}{2} = 2k \cdot n + k(k-1)$$

  Para $k = 3$: $\sum = 6n + 6 = 6(n + 1)$. ¡Atención! La suma de 3 pares consecutivos es siempre divisible por $6$.

  ### Síntesis didáctica
  La progresión de pares consecutivos requiere el incremento escalar $2i$ para preservar la divisibilidad por 2 sobre todos los términos de la tupla.
definiciones_clave: |
  - **Pares consecutivos**: Secuencia de enteros pares cuya diferencia entre términos contiguos es de $2$ unidades.
  - **Incremento de paridad ($+2$)**: Salto aritmético necesario para saltar el entero impar intermedio y mantener la paridad par.
  - **Múltiplo de 6 en 3 pares**: Propiedad aritmética por la cual la suma de tres pares consecutivos es un múltiplo exacto de $6$.
propiedades_relaciones: |
  - **Diferencia entre pares contiguos**: $(2n + 2) - 2n = 2$.
  - **Alternativa simplificada**: Si se define la primera variable $x$ como par ($x \in 2\mathbb{Z}$), la secuencia se representa como $x, x+2, x+4$.
ejemplo_guiado:
  enunciado: 'Traduce y resuelve el siguiente problema: "La suma de tres números pares consecutivos es igual a setenta y dos. Encuentra los tres números".'
  pasos:
    - 'Paso 1: Planteamos los tres números pares consecutivos: $2n$, $2n + 2$ y $2n + 4$.'
    - 'Paso 2: Expresamos su suma igualada a $72$: $2n + (2n + 2) + (2n + 4) = 72$.'
    - 'Paso 3: Reducimos términos semejantes: $6n + 6 = 72$.'
    - 'Paso 4: Despejamos $n$: $6n = 72 - 6 \implies 6n = 66 \implies n = 11$.'
    - 'Paso 5: Calculamos los pares: $2n = 2(11) = 22$, $2n + 2 = 24$, $2n + 4 = 26$.'
    - 'Conclusión: Los tres números pares consecutivos son **$22, 24$ y $26$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la representación algebraica canónica de tres números pares consecutivos expresados en función de una variable entera $n$?'
    choices:
      - {text: 'Se representan sumando de dos en dos a partir del par base: $2n$, $2n + 2$ y $2n + 4$', is_correct: true}
      - {text: 'Se representan sumando de uno en uno: $2n$, $2n + 1$ y $2n + 2$', is_correct: false}
      - {text: 'Se representan multiplicando por tres: $2n$, $4n$ y $6n$', is_correct: false}
      - {text: 'Se representan elevando al cuadrado: $2n$, $4n^2$ y $8n^3$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se representan sumando de dos en dos a partir del par base: $2n$, $2n + 2$ y $2n + 4$''. Incremento $+2$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la suma de tres números pares consecutivos $2n + (2n+2) + (2n+4) = 6n + 6$ es siempre un múltiplo exacto de 6?'
    choices:
      - {text: 'Porque al factorizar $6n + 6$ se obtiene $6(n + 1)$, demostrando que el resultado es divisible por 6', is_correct: true}
      - {text: 'Porque la suma de tres números pares da siempre un número impar', is_correct: false}
      - {text: 'Porque se dividen los coeficientes entre dos', is_correct: false}
      - {text: 'Porque todos los pares son múltiplos de 12', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque al factorizar $6n + 6$ se obtiene $6(n + 1)$, demostrando que el resultado es divisible por 6''. Factorización $6(n+1)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Definir el primer número par como $2n$ (o como $x$, especificando que $x$ es par).'
  - 'Paso 2: Sumar $+ 2$ para obtener el siguiente par $(2n + 2)$, $+ 4$ para el tercero $(2n + 4)$, $+ 6$ para el cuarto, etc.'
  - 'Paso 3: Si el enunciado solicita la suma, sumar los términos igualando al total dado.'
  - 'Paso 4: Reducir términos semejantes y despejar la variable $n$ para hallar el valor de cada par.'
errores_correccion: |
  - **Error 1:** Incrementar de 1 en 1 al representar pares consecutivos (escribir $2n, 2n+1, 2n+2$). **Cómo corregirlo:** Sumar 1 genera un número impar ($2n+1$); los pares consecutivos **SE INCREMENTAN DE 2 EN 2 ($2n, 2n+2, 2n+4$)**.
  - **Error 2:** Usar variables distintas como $x, y, z$ para cada par. **Cómo corregirlo:** Deben expresarse **en función de una sola variable ($2n, 2n+2, 2n+4$)** para formar una ecuación resoluble.
ejemplos:
  - titulo: 'Dos pares consecutivos'
    enunciado: '¿Cuáles son las expresiones que representan dos pares consecutivos?'
    alternativas:
      - '$2n$ y $2n + 2$'
      - '$2n$ y $2n + 1$'
      - '$n$ y $n + 2$'
    respuesta: '$2n$ y $2n + 2$'
    solucion_pasos:
      - '1. Primer par: $2n$.'
      - '2. Segundo par: $2n + 2$.'
  - titulo: 'Suma de tres pares'
    enunciado: '¿Cuál es la expresión reducida de la suma de tres pares consecutivos?'
    alternativas:
      - '$6n + 6$'
      - '$6n + 3$'
      - '$3n + 6$'
    respuesta: '$6n + 6$'
    solucion_pasos:
      - '1. Suma: $2n + (2n+2) + (2n+4)$.'
      - '2. Reduciendo: $6n + 6$.'
  - titulo: 'Verificación de salto'
    enunciado: 'Para $n = 5$, ¿son los pares consecutivos $2n, 2n+2, 2n+4$ iguales a $10, 12, 14$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $2(5)=10, 10+2=12, 10+4=14$.'
  - titulo: 'Divisibilidad de la suma de dos pares'
    enunciado: '¿Es la suma de dos pares consecutivos $2n + (2n+2) = 4n + 2$ siempre divisible por 2 pero no necesariamente por 4?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $4n + 2 = 2(2n + 1)$, que es par pero no múltiplo de 4.'
errores_frecuentes:
  - 'Incrementar de uno en uno los términos 2n, 2n+1, 2n+2 al representar números pares consecutivos.'
  - 'Utilizar variables independientes distintas para representar cada par de la secuencia consecutiva.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Declarar que la suma de tres números pares consecutivos produce un resultado impar.'
  - 'La condición de paridad inicial no se incluye al definir la variable base de la secuencia.'
afirmaciones_verdaderas:
  - 'Una secuencia de números pares consecutivos se representa algebraicamente incrementando en 2 unidades cada término (2n, 2n+2, 2n+4...).'
  - 'La suma de tres números pares consecutivos es siempre divisible por 6.'
al_terminar_debes_poder: 'Representar algebraicamente secuencias de números pares consecutivos mediante el incremento constante de 2 unidades.'
