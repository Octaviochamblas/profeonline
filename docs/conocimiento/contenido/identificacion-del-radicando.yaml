semantic_id: MAT.NUM.RAICES_CONCEPTO.RADICANDO_IDENTIFICACION
resumen_inicial: El radicando (o cantidad subradical) es la expresión matemática completa que se encuentra ubicada debajo de la barra horizontal superior del radical.
explicacion_simple: '![Identificación del radicando](/static/img/nodos/identificacion-del-radicando-intro.svg)


  El **radicando** o **cantidad subradical** es todo lo que está protegido ''bajo el techo'' del símbolo radical. La longitud de la barra superior es fundamental:

  - En $\sqrt{9 + 16}$, el techo cubre toda la suma, así que el radicando es $9 + 16 = 25$ y la raíz vale $5$.

  - En $\sqrt{9} + 16$, el techo solo cubre al $9$, así que se calcula $\sqrt{9} = 3$ y luego se suma $16$, dando $19$.'
explicacion_formal: "En la expresión $\\sqrt[n]{A}$, la entidad matemática $A$ se denomina **Radicando** o **Cantidad Subradical**.\n\n**Delimitación geométrica del vínculo:**\n- La barra horizontal superior (denominada *vinculum*) actúa como un signo de agrupación implícito equivalente a paréntesis:\n  $$\\sqrt[n]{A} \\equiv (A)^{1/n}$$\n- **Alcance operacional:**\n  - $\\sqrt{x + y} = (x + y)^{1/2}$ (el radicando es el binomio $x+y$).\n  - $\\sqrt{x} + y = (x)^{1/2} + y$ (el radicando es únicamente $x$).\n  - $\\sqrt{\\frac{a}{b}} = \\left(\\frac{a}{b}\\right)^{1/2}$ (el radicando es la fracción completa).\n  - $\\frac{\\sqrt{a}}{b} = \\frac{a^{1/2}}{b}$ (el radicando es solo el numerador $a$)."
definiciones_clave: '- **Radicando**: Expresión algebraica o numérica bajo el operador radical.

  - **Vínculo**: Barra horizontal superior que delimita el alcance de la radicación.

  - **Agrupación implícita**: Prioridad de cálculo sobre la totalidad de la cantidad subradical.'
propiedades_relaciones: '- **No distributividad respecto a la suma**: $\sqrt{a + b} \neq \sqrt{a} + \sqrt{b}$.

  - **Preservación de signos fuera del vínculo**: En $-\sqrt{x}$, el radicando es $x$ (el signo menos no está bajo la raíz).'
ejemplo_guiado:
  enunciado: '![Ejemplos de delimitación del radicando](/static/img/nodos/identificacion-del-radicando-ejemplos.svg)


    Identifique el radicando en las expresiones $\sqrt{2x + 5}$, $\sqrt{\frac{a}{b}}$ y $3\sqrt{x} + 7$.'
  pasos:
  - 'Paso 1: Analizar $\sqrt{2x + 5}$: La barra horizontal cubre a todo el binomio $\implies$ Radicando $= 2x + 5$.'
  - 'Paso 2: Analizar $\sqrt{\frac{a}{b}}$: La barra cubre numerador y denominador $\implies$ Radicando $= \frac{a}{b}$.'
  - 'Paso 3: Analizar $3\sqrt{x} + 7$: La barra solo cubre a $x$. El $3$ es coeficiente y el $+7$ es término independiente $\implies$ Radicando $= x$.'
  - 'Conclusión: Los radicandos son $2x+5$, $\frac{a}{b}$ y $x$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\sqrt{9 + 16}$ comparado con $\sqrt{9} + \sqrt{16}$?
  choices:
  - text: $\sqrt{9+16} = \sqrt{25} = 5$, mientras que $\sqrt{9} + \sqrt{16} = 3 + 4 = 7$ (son distintos)
    is_correct: true
  - text: Son iguales a $7$
    is_correct: false
  - text: Son iguales a $5$
    is_correct: false
  - text: Son iguales a $25$
    is_correct: false
  explanation: La alternativa correcta es '$\sqrt{9+16} = \sqrt{25} = 5$, mientras que $\sqrt{9} + \sqrt{16} = 3 + 4 = 7$ (son distintos)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expresión $-\sqrt{36}$, ¿cuál es el radicando?
  choices:
  - text: $36$ (el signo negativo está fuera del radical y el resultado es $-6$)
    is_correct: true
  - text: $-36$
    is_correct: false
  - text: No tiene radicando
    is_correct: false
  - text: $-6$
    is_correct: false
  explanation: La alternativa correcta es '$36$ (el signo negativo está fuera del radical y el resultado es $-6$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar la extensión exacta de la barra horizontal superior.'
- 'Paso 2: Incluir todos los términos y operaciones situados directamente bajo dicha barra.'
- 'Paso 3: Excluir signos, factores y términos que se encuentren a la izquierda o a la derecha de la barra.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a^2 + b^2} = a + b$).** **Cómo corregirlo:** La radicación NO es distributiva sobre la adición ni la sustracción.

  - **Error 2: Incluir signos exteriores dentro del radicando ($-\sqrt{4}$ pensado como $\sqrt{-4}$).** **Cómo corregirlo:** $-\sqrt{4} = -(2) = -2 \in \mathbb{R}$, mientras que $\sqrt{-4} \notin \mathbb{R}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el radicando en $\sqrt{x^2 + y^2}$?
  alternativas:
  - $x^2 + y^2$
  - $x + y$
  - $x^2$
  respuesta: $x^2 + y^2$
  solucion_pasos:
  - Todo el binomio $x^2 + y^2$ está bajo la barra.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el radicando en $5\sqrt{7} - 3$?
  alternativas:
  - $7$
  - $5\cdot 7$
  - $7 - 3$
  respuesta: $7$
  solucion_pasos:
  - Solo el 7 se ubica bajo el radical.
- titulo: ¿Es el radicando de √(x + 4) igual a x + 4?
  respuesta: Sí
  solucion_pasos:
  - Sí, la barra horizontal cubre al binomio completo $x + 4$.
  alternativas:
  - texto: Sí, el radicando es x + 4
    es_correcta: true
    retroalimentacion: ¡Correcto! El vínculo cubre ambos términos.
  - texto: No, es solo x
    es_correcta: false
    retroalimentacion: Incorrecto, el 4 también está bajo el techo del radical.
  - texto: No, es √x + 2
    es_correcta: false
    retroalimentacion: Incorrecto, no se puede distribuir la raíz.
- titulo: ¿Es √(a + b) igual a √a + √b?
  respuesta: 'No'
  solucion_pasos:
  - No, la raíz de una suma NO es igual a la suma de las raíces ($\sqrt{9+16} = 5 \neq 3+4 = 7$).
  alternativas:
  - texto: No, la radicación no es distributiva con respecto a la adición
    es_correcta: true
    retroalimentacion: ¡Correcto! Es uno de los errores más comunes en álgebra.
  - texto: Sí, la raíz se reparte a cada sumando
    es_correcta: false
    retroalimentacion: Incorrecto, solo es distributiva respecto a la multiplicación y división.
  - texto: Sí, siempre que a y b sean positivos
    es_correcta: false
    retroalimentacion: Incorrecto, falla para cualquier par de números no nulos.
errores_frecuentes:
- Distribuir la raíz sobre sumas o restas de términos.
- Confundir signos negativos exteriores con radicandos negativos.
- Omitir el denominador al evaluar raíces de fracciones.
- No respetar la prioridad de operaciones dentro de la cantidad subradical.
- Cortar visualmente la barra del radical antes de tiempo.
afirmaciones_verdaderas:
- El radicando comprende todo elemento cubierto por el vínculo superior.
- La radicación no es distributiva respecto a la suma ni a la resta.
- El signo menos situado a la izquierda del radical no forma parte del radicando.
al_terminar_debes_poder: '![Síntesis de identificación del radicando](/static/img/nodos/identificacion-del-radicando-resumen.svg)


  QUÉ: Delimitar e identificar con precisión el radicando de cualquier expresión radical.


  CÓMO: Observando el alcance geométrico de la barra horizontal superior (vínculo), tratando el radicando como un bloque agrupado y evitando la falsa distribución sobre sumas y restas.'
fuente: Texto escolar MINEDUC — Matemática 8° Básico / 1° Medio / PAES.
