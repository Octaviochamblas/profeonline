semantic_id: MAT.NUM.RAICES_CONCEPTO.RADICANDO_IDENTIFICACION
resumen_inicial: El radicando o cantidad subradical es la cantidad o expresión numérica
  ubicada debajo del techo del símbolo radical.
explicacion_simple: 'El radicando es todo lo que está encerrado **dentro de la raíz**:

  - En $\sqrt{36}$, el radicando es $36$.

  - En $\sqrt[3]{x^2 + 5}$, el radicando es la expresión completa $x^2 + 5$.

  - En $3\sqrt{7}$, el radicando es solo el $7$ (el $3$ de adelante es un coeficiente
  multiplicador).'
explicacion_formal: En la notación $\sqrt[n]{a}$, $a \in \mathbb{R}$ es el radicando
  o cantidad subradical. Si la expresión es $c \sqrt[n]{f(x)}$, el radicando es $f(x)$
  y $c$ es un coeficiente escalar que multiplica a la raíz.
definiciones_clave: '- **Radicando / Cantidad subradical**: Expresión matemática que
  se ubica bajo el techo de la raíz.'
propiedades_relaciones: '- **Independencia de coeficientes**: Los números fuera del
  radical NO forman parte del radicando.'
ejemplo_guiado:
  enunciado: Distingue el radicando en A) $\sqrt{4x-1}$ y B) $5\sqrt{x}$.
  pasos:
  - 'Para A: Todo $4x-1$ está bajo el techo de la raíz, luego el radicando es $4x-1$.'
  - 'Para B: El 5 está afuera multiplicando, solo $x$ está bajo la raíz, luego el
    radicando es $x$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el radicando en la expresión $4\sqrt[3]{9}$?
  choices:
  - text: '9'
    is_correct: true
  - text: '4'
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '36'
    is_correct: false
  explanation: 'La correcta es: 9. El 9 es el número que está dentro del radical.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el radicando en $\sqrt{x^2 + 16}$?
  choices:
  - text: x^2 + 16
    is_correct: true
  - text: x^2
    is_correct: false
  - text: '16'
    is_correct: false
  - text: x + 4
    is_correct: false
  explanation: 'La correcta es: x^2 + 16. Todo el bloque $x^2 + 16$ está dentro de
    la raíz.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el techo del símbolo de raíz $\sqrt{}$.'
- 'Paso 2: Identificar toda la expresión numérica o algebraica que se encuentre debajo
  de ese techo.'
- 'Paso 3: Excluir los coeficientes exteriores o los índices.'
errores_correccion: No confundas el coeficiente multiplicador con el radicando. En
  $2\sqrt{5}$, el radicando es $5$, no $10$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el radicando en $\sqrt{81}$?
  alternativas:
  - '81'
  - '9'
  - '2'
  respuesta: '81'
  solucion_pasos:
  - El número dentro de la raíz es 81.
errores_frecuentes:
- Incluir el coeficiente exterior dentro del radicando.
afirmaciones_verdaderas:
- El radicando es la expresión que se ubica dentro del radical.
al_terminar_debes_ponder: Identificar el radicando en cualquier expresión con radicales.
fuente: Texto escolar MINEDUC.
estado: publicado
