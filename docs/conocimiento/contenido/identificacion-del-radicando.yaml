semantic_id: MAT.NUM.RAICES_CONCEPTO.RADICANDO_IDENTIFICACION
resumen_inicial: El radicando (o cantidad subradical) es la cantidad o expresión matemática
  encerrada bajo el techo del símbolo radical sobre la cual se extrae la raíz.
explicacion_simple: El radicando es todo lo que está guardado o protegido debajo del
  techo de la raíz. Puede ser un número simple, una fracción o una suma de letras.
explicacion_formal: 'En la expresión $\sqrt[n]{a}$ o $\sqrt[n]{expr}$, el **Radicando
  $a$** es la cantidad subradical operada:


  $$a \in \mathbb{R} \quad (\text{con } a \ge 0 \text{ si } n \text{ es par})$$


  **Alcance del techo radical:**

  - En $\sqrt{x + y}$, el radicando es la suma completa $(x + y)$.

  - En $\sqrt{x} + y$, el radicando es solo la variable $x$.'
definiciones_clave: '- **Radicando o subradical**: Expresión matemática ubicada debajo
  del trazo horizontal de la raíz.'
propiedades_relaciones: '- **Ubicación subradical**: Es la cantidad bajo la barra
  superior del símbolo $\sqrt{}$.'
ejemplo_guiado:
  enunciado: Identifique el radicando en las expresiones $\sqrt{36}$, $\sqrt[3]{x^2
    + 5}$ y $2\sqrt{9} + 1$.
  pasos:
  - 'Paso 1: En $\sqrt{36}$, el número bajo el techo del radical es $36 \implies$
    radicando $36$.'
  - 'Paso 2: En $\sqrt[3]{x^2 + 5}$, la expresión bajo la barra es $x^2 + 5 \implies$
    radicando $(x^2 + 5)$.'
  - 'Paso 3: En $2\sqrt{9} + 1$, solo el número $9$ está dentro del radical $\implies$
    radicando $9$.'
  - 'Conclusión: Los radicandos son $36$, $(x^2 + 5)$ y $9$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa el radicando en la notación de una raíz sqrt[n]{a}?
  choices:
  - text: La cantidad o expresión matemática encerrada bajo la barra del radical
    is_correct: true
  - text: El número pequeño de la apertura
    is_correct: false
  - text: El resultado final de la raíz
    is_correct: false
  - text: La división del índice
    is_correct: false
  explanation: La alternativa correcta es 'La cantidad o expresión matemática encerrada
    bajo la barra del radical'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt[3]{x^2 + 5}, ¿cuál es el radicando?
  choices:
  - text: La expresión completa x^2 + 5
    is_correct: true
  - text: El número 3 del índice
    is_correct: false
  - text: Solo la variable x
    is_correct: false
  - text: El número 5 solo
    is_correct: false
  explanation: La alternativa correcta es 'La expresión completa x^2 + 5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Delimitar el trazo horizontal (techo) del símbolo de la raíz.'
- 'Paso 2: Agrupar todas las constantes y variables situadas debajo del trazo.'
- 'Paso 3: Declarar dicha agrupación como el radicando de la expresión.'
errores_correccion: '- **Error 1: Incluir números o términos fuera de la raíz como
  parte del radicando ($2\sqrt{3} \implies$ radicando 6).** **Cómo corregirlo:** Solo
  lo que está estrictamente debajo de la barra es el radicando (radicando $3$).


  - **Error 2: Confundir el radicando con el índice.** **Cómo corregirlo:** El índice
  está en la abertura ($n$) y el radicando dentro ($a$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el radicando en $\sqrt{a + b}$?
  alternativas:
  - a + b
  - a
  - b
  respuesta: a + b
  solucion_pasos:
  - La suma completa $(a+b)$ está bajo el techo del radical.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el radicando en $5\sqrt{7}$?
  alternativas:
  - '7'
  - '35'
  - '5'
  respuesta: '7'
  solucion_pasos:
  - El $5$ es un coeficiente externo; el radicando es solo $7$.
- titulo: ¿Es el radicando en sqrt(16) el número 16?
  respuesta: Sí
  solucion_pasos:
  - Sí, $16$ es la cantidad subradical.
- titulo: ¿Puede el radicando ser una fracción de enteros?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ejemplo en $\sqrt{4/9}$ el radicando es $4/9$.
errores_frecuentes:
- El coefíciente que multiplica por fuera a la raíz forma parte del radicando.
- El radicando es el número pequeño que indica el orden o grado de la radicación.
- En la expresión $\sqrt{x} + 4$ el radicando se define como la suma $x + 4$.
- El radicando en los números reales debe ser siempre un número entero impar.
- Las letras en álgebra no pueden formar parte del radicando de una raíz.
afirmaciones_verdaderas:
- El radicando o cantidad subradical es la expresión sobre la cual recae el operador
  de la raíz.
- El alcance de la barra del radical delimita exactamente qué términos pertenecen
  al radicando.
al_terminar_debes_poder: Al terminar serás capaz de identificar el radicando de cualquier
  expresión radical, reconociendo el alcance de la barra del símbolo de la raíz.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
