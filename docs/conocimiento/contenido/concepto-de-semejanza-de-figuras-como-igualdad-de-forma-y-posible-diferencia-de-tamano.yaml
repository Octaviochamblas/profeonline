semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.SEMEJANZA_FIGURAS_CONCEPTO
resumen_inicial: 'Dos figuras geométricas son semejantes si y solo si poseen la misma forma, lo que implica que sus ángulos homólogos son congruentes y sus lados correspondientes son proporcionales en una razón constante $k$.'
explicacion_simple: |
  ![Concepto de Semejanza: Misma Forma, Escala Variable](/static/img/nodos/concepto-de-semejanza-de-figuras-como-igualdad-de-forma-y-posible-diferencia-de-tamano-intro.svg)

  Dos figuras son semejantes cuando una es una copia ampliada o reducida de la otra sin deformarse.
explicacion_formal: |
  ### Definición formal
  Dos figuras $F_1, F_2 \subset \mathbb{R}^2$ son semejantes ($F_1 \sim F_2$) si existe una transformación de semejanza $S: \mathbb{R}^2 \to \mathbb{R}^2$ tal que $S(F_1) = F_2$. Toda transformación de semejanza satisface:

  $$d(S(P), S(Q)) = k \cdot d(P, Q) \quad \forall P, Q \in F_1 \quad (k \in \mathbb{R}^+)$$

  ### Desglose simbólico y geométrico
  - $k$: Razón de semejanza o factor de escala métrica.
    - $k > 1$: Ampliación o dilatación homotética.
    - $0 < k < 1$: Reducción o contracción homotética.
    - $k = 1$: Congruencia isométrica ($F_1 \cong F_2$).
  - Invarianza angular: Las semejanzas preservan la amplitud de todos los ángulos orientados.

  ### Síntesis didáctica
  La semejanza generaliza la congruencia, permitiendo cambios de escala preservando la estructura angular.
definiciones_clave: |
  - **Semejanza geométrica**: Relación entre figuras que poseen la misma forma con ángulos congruentes y lados proporcionales.
  - **Razón de semejanza (k)**: Factor numérico constante resultante del cociente entre longitudes homólogas ($k = L^\prime/L$).
  - **Criterios de semejanza**: Condiciones mínimas suficientes para garantizar la semejanza de triángulos (AA, LLL, LAL).
  - **Relación dimensional**: Comportamiento de magnitudes geométricas bajo escala: $1D \to k$, $2D \to k^2$, $3D \to k^3$.
propiedades_relaciones: |
  - **Invarianza angular**: $\angle_i \cong \angle_i^\prime \quad \forall i$.
  - **Proporción de perímetros**: $\frac{P^\prime}{P} = k$.
  - **Proporción de áreas**: $\frac{A^\prime}{A} = k^2$.
  - **Proporción de volúmenes**: $\frac{V^\prime}{V} = k^3$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Concepto de Semejanza: Misma Forma, Escala Variable](/static/img/nodos/concepto-de-semejanza-de-figuras-como-igualdad-de-forma-y-posible-diferencia-de-tamano-ejemplos.svg)

    Aplica las propiedades y criterios de semejanza para determinar las medidas desconocidas y justificar la relación geométrica.
  pasos:
  - 'Paso 1: Identificar las figuras dadas y verificar el cumplimiento de los criterios de semejanza (AA, LLL o LAL).'
  - 'Paso 2: Establecer la correspondencia de vértices, ángulos homólogos y lados correspondientes.'
  - 'Paso 3: Calcular la razón de semejanza lineal $k = L^\prime / L$ a partir de los datos numéricos conocidos.'
  - 'Paso 4: Aplicar el factor de escala adecuado según la dimensión de la magnitud: lineal ($k$), superficial ($k^2$) o volumétrica ($k^3$).'
  - 'Paso 5: Expresar el resultado final con su respectiva unidad de medida.'
