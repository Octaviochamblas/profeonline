semantic_id: MAT.GEO.TRIG_IDENTIDADES.COSECANTE_COTANGENTE
resumen_inicial: 'Identidad pitagórica recíproca: uno más cotangente cuadrado igual
  a cosecante cuadrado: conceptos, teoremas, propiedades geométricas y cálculo en
  Trigonometría en el Triángulo Rectángulo.'
explicacion_simple: Esta identidad se obtiene dividiendo la identidad pitagórica fundamental
  por el seno al cuadrado, transformando seno y coseno en cotangente y cosecante.
explicacion_formal: '![Identidad pitagórica: 1+cot²θ=csc²θ](/static/img/geometria/trigonometria/razon-identidad-cosecante-cotangente.svg)


  ### Definición formal


  Partiendo de $\sin^2\theta+\cos^2\theta=1$ y dividiendo ambos lados por $\sin^2\theta$:
  $1+\dfrac{\cos^2\theta}{\sin^2\theta}=\dfrac{1}{\sin^2\theta}$, es decir, $1+\cot^2\theta=\csc^2\theta$.


  ### Desarrollo didáctico


  Si $\cot\theta=\dfrac{4}{3}$, entonces $\csc^2\theta=1+\left(\dfrac{4}{3}\right)^2=1+\dfrac{16}{9}=\dfrac{25}{9}$,
  por lo que $\csc\theta=\dfrac{5}{3}$.'
