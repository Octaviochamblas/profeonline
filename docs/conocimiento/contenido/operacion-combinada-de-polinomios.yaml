semantic_id: MAT.ALG.SUSTRACCION_POL.OPERACION_COMBINADA
resumen_inicial: 'La operación combinada de polinomios consiste en resolver cadenas compuestas de adiciones y supresiones de polinomios aplicando el orden de signos antecedentes y agrupando términos semejantes.'
explicacion_simple: |
  En una **operación combinada de polinomios** hay varias sumas y restas mezcladas (ej: $P(x) - [ Q(x) + R(x) ]$):
  - **Procedimiento de resolución**:
    1. **Identifica los signos antecedentes** ($+$ o $-$) que están delante de cada polinomio o paréntesis.
    2. **Suprime los paréntesis de adentro hacia afuera**:
       - Si antecede un $+$, conservas los signos.
       - Si antecede un $-$, **inviertes TODOS los signos de adentro**.
    3. **Reúne todos los términos liberados en una sola fila**.
    4. **Agrupa y reduce** los términos semejantes de cada clase.
  - **Ejemplo**: Resolver $(5x^2 + 3) - (2x^2 - 4) + (x^2 - 1)$:
    - Liberamos el primer paréntesis: $5x^2 + 3$.
    - Liberamos el segundo cambiando signos: $-2x^2 + 4$.
    - Liberamos el tercero manteniendo signos: $+x^2 - 1$.
    - Expresión reunida: $5x^2 + 3 - 2x^2 + 4 + x^2 - 1$.
    - Reducimos $x^2$: $5 - 2 + 1 = \mathbf{4x^2}$.
    - Reducimos constantes: $3 + 4 - 1 = \mathbf{+6}$.
    - Resultado final: **$4x^2 + 6$**.
explicacion_formal: |
  ### Definición formal
  Sea $\mathcal{E}(P_1, P_2, \dots, P_k)$ un árbol de operaciones algebraicas compuesto por $k$ polinomios interactuando bajo adición y sustracción. La **simplificación de operaciones combinadas** aplica recursivamente los operadores de supresión parentética $\mathcal{S}_{\sigma}$ sobre la estructura anidada:

  $$\mathcal{E} \xrightarrow{\operatorname{Expand}} \sum_{i=1}^k \sigma_i P_i(x) \xrightarrow{\operatorname{Reducción}} \sum_{j=0}^n \left( \sum \text{coeficientes de } x^j \right) x^j$$

  donde $\sigma_i \in \{-1, +1\}$ es el producto acumulado de los signos antecedentes que afectan al polinomio $P_i$.

  ### Invarianza del Resultado por Asociatividad
  La asociatividad aditiva en $\mathbb{R}[x]$ garantiza que evaluar primero la operación interna o distribuir los signos externos genera exactamente el mismo polinomio simplificado.

  ### Síntesis didáctica
  Las operaciones combinadas de polinomios integran todas las reglas de signos, agrupación y reducción en una sola técnica unificada.
definiciones_clave: |
  - **Operación combinada polinómica**: Expresión con tres o más polinomios vinculados por signos de adición y sustracción.
  - **Distribución de signos antecedentes ($\sigma_i$)**: Aplicación del operador $+1$ o $-1$ sobre el conjunto de términos de un polinomio parentético.
  - **Consolidación aditiva final**: Reducción global de todas las clases de semejanza tras eliminar todas las agrupaciones.
propiedades_relaciones: |
  - **Cancelación entre polinomios**: Si una cadena contiene $P(x) - Q(x) + Q(x)$, el polinomio $Q(x)$ se anula completamente ($P(x)$).
  - **Invarianza por ordenamiento previa**: Reordenar las clases antes de reducir elimina el riesgo de omisiones en cadenas largas.
ejemplo_guiado:
  enunciado: 'Simplifica la siguiente operación combinada: $(4a^2 - 3b) - [ (2a^2 + 5b) - (a^2 - b) ]$.'
  pasos:
    - 'Paso 1: Identificamos el paréntesis interno: $-(a^2 - b)$.'
    - 'Paso 2: Suprimimos el paréntesis interno invirtiendo sus signos: $(4a^2 - 3b) - [ 2a^2 + 5b - a^2 + b ]$.'
    - 'Paso 3: Reducimos términos semejantes dentro del corchete:
       - Clase $a^2$: $2a^2 - a^2 = a^2$.
       - Clase $b$: $5b + b = 6b$.
       - Queda: $(4a^2 - 3b) - [ a^2 + 6b ]$.'
    - 'Paso 4: Suprimimos el primer paréntesis (precedido por $+$) y el corchete (precedido por $-$):
       $4a^2 - 3b - a^2 - 6b$.'
    - 'Paso 5: Reducimos por clases:
       - Clase $a^2$: $4a^2 - a^2 = \mathbf{3a^2}$.
       - Clase $b$: $-3b - 6b = \mathbf{-9b}$.'
    - 'Conclusión: La expresión simplificada es **$3a^2 - 9b$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el primer paso recomendado para resolver con precisión una operación combinada con paréntesis anidados?'
    choices:
      - {text: 'Eliminar los paréntesis de adentro hacia afuera aplicando la regla del signo antecedente a cada nivel', is_correct: true}
      - {text: 'Sumar todos los coeficientes numéricos ignorando los paréntesis', is_correct: false}
      - {text: 'Multiplicar todas las variables entre sí', is_correct: false}
      - {text: 'Cambiar los signos únicamente al primer polinomio', is_correct: false}
    explanation: 'La alternativa correcta es ''Eliminar los paréntesis de adentro hacia afuera aplicando la regla del signo antecedente a cada nivel''. Resolución de dentro hacia afuera.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de la operación combinada $(3x + 2) + (5x - 4) - (2x + 1)$?'
    choices:
      - {text: 'El resultado es $6x - 3$, al liberar $3x + 2 + 5x - 4 - 2x - 1 = 6x - 3$', is_correct: true}
      - {text: 'El resultado es $10x - 3$', is_correct: false}
      - {text: 'El resultado es $6x + 3$', is_correct: false}
      - {text: 'El resultado es $6x - 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $6x - 3$, al liberar $3x + 2 + 5x - 4 - 2x - 1 = 6x - 3$''. Clase $x: 3+5-2=6x$; Constantes: $2-4-1=-3 \implies 6x - 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar la cadena completa de operaciones e identificar los signos antecedentes de cada agrupación.'
  - 'Paso 2: Suprimir los signos de agrupación trabajando secuencialmente de adentro hacia afuera.'
  - 'Paso 3: Reducir las expresiones intermedias dentro de corchetes o llaves para simplificar los pasos.'
  - 'Paso 4: Reagrupar todos los monomios liberados por clases de semejanza y calcular el polinomio reducido final.'
errores_correccion: |
  - **Error 1:** Aplicar la inversión de signos a un polinomio que está precedido por un signo positivo (escribir $+(2x - 3) = -2x + 3$). **Cómo corregirlo:** El signo positivo **MANTIENE LOS SIGNOS INTACTOS ($+2x - 3$)**.
  - **Error 2:** Excluir que un signo menos antes de un corchete afecta a TODOS los términos que fueron liberados previamente dentro de él. **Cómo corregirlo:** Se deben **REDUCIR LOS TÉRMINOS DENTRO DEL CORCHETE** antes de eliminar el corchete.
ejemplos:
  - titulo: 'Tres polinomios simples'
    enunciado: '¿Cuál es el resultado de $(x + 4) - (2x - 1) + (3x + 2)$?'
    alternativas:
      - '$2x + 7$'
      - '$4x + 7$'
      - '$2x + 3$'
    respuesta: '$2x + 7$'
    solucion_pasos:
      - '1. Liberación: $x + 4 - 2x + 1 + 3x + 2$.'
      - '2. Clase $x$: $1 - 2 + 3 = 2x$.'
      - '3. Constantes: $4 + 1 + 2 = 7$.'
      - '4. Resultado: $2x + 7$.'
  - titulo: 'Anulación por combinación'
    enunciado: '¿Cuál es el resultado de $P(x) - P(x) + Q(x)$?'
    alternativas:
      - '$Q(x)$'
      - '$2P(x) + Q(x)$'
      - '$0$'
    respuesta: '$Q(x)$'
    solucion_pasos:
      - '1. $P(x) - P(x) = 0$.'
      - '2. $0 + Q(x) = Q(x)$.'
  - titulo: 'Inversión parentética correcta'
    enunciado: 'Para $a - (b - c) + (d - e)$, ¿es la liberación correcta $a - b + c + d - e$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, se cambiaron los signos del segundo paréntesis y se mantuvieron los del tercero.'
  - titulo: 'Reducción final unificada'
    enunciado: '¿Produce una operación combinada reducida un polinomio donde no existen términos semejantes repetidos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el resultado final debe consolidar todas las clases.'
errores_frecuentes:
  - 'Cambiar erróneamente los signos de los polinomios que están precedidos por un signo positivo.'
  - 'El signo menos antecedente del corchete no es aplicado a los términos liberados internamente.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Perder el orden de la supresión intentando eliminar llaves y paréntesis al mismo tiempo.'
  - 'Mezclar clases de variables distintas al consolidar la resta final.'
afirmaciones_verdaderas:
  - 'En una operación combinada de polinomios, los signos antecedentes determinan si cada paréntesis mantiene o invierte sus signos.'
  - 'Resolver las agrupaciones anidadas de adentro hacia afuera es el procedimiento más seguro para simplificar operaciones combinadas.'
al_terminar_debes_poder: 'Resolver operaciones combinadas de adición y sustracción de polinomios eliminando agrupaciones y reduciendo términos.'
