resumen_inicial: La operación combinada de polinomios aplica las reglas formales de
  la sustracción e inversión de signos en expresiones polinómicas.
explicacion_simple: Al trabajar con operación combinada de polinomios, aseguramos
  cambiar correctamente los signos de todos los términos restados para obtener el
  resultado simplificado exacto.
explicacion_formal: 'Dados polinomios con la estructura dada, la **Operación combinada
  de polinomios** establece:


  $$\text{"la expresión (4x^2 + 3) - (x^2 - 2) + (2x^2 - 1)"} \implies 5x^2 + 4$$


  > **Complemento didáctico:** La formalización rigurosa previene equivocaciones estructurales
  al operar con inversos aditivos.'
definiciones_clave: '- **Operación combinada de polinomios**: Aplicación exacta de
  las reglas de resta y supresión de signos sobre polinomios.'
propiedades_relaciones: '- **Distributividad del signo menos**: El operador $-$ afecta
  individualmente a cada sumando del bloque.'
ejemplo_guiado:
  enunciado: 'Efectúe la operación combinada de polinomios para: ''la expresión (4x^2
    + 3) - (x^2 - 2) + (2x^2 - 1)''.'
  pasos:
  - 'Paso 1: Identificar el sustraendo o los términos a restar.'
  - 'Paso 2: Invertir el signo de todos los elementos involucrados.'
  - 'Paso 3: Reducir los términos semejantes.'
  - 'Conclusión: El resultado es 5x^2 + 4.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar operación combinada de polinomios a 'la
    expresión (4x^2 + 3) - (x^2 - 2) + (2x^2 - 1)'?
  choices:
  - text: 5x^2 + 4
    is_correct: true
  - text: 3x^2 + 4
    is_correct: false
  - text: 5x^2 + 0
    is_correct: false
  - text: x^2 + 4
    is_correct: false
  explanation: La alternativa correcta es '5x^2 + 4'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'la expresión (4x^2 + 3) - (x^2 - 2) + (2x^2
    - 1)', ¿qué expresión reducida se obtuvo?
  choices:
  - text: 5x^2 + 4
    is_correct: true
  - text: 3x^2 + 4
    is_correct: false
  - text: 5x^2 + 0
    is_correct: false
  - text: x^2 + 4
    is_correct: false
  explanation: La alternativa correcta es '5x^2 + 4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar paréntesis al sustraendo.'
- 'Paso 2: Distribuir el signo menos invirtiendo cada signo.'
- 'Paso 3: Agrupar y reducir términos semejantes.'
errores_correccion: '- **Error 1: Invertir sólo parte de los signos en operación combinada
  de polinomios.** **Cómo corregirlo:** Cambiar obligatoriamente los signos de todos
  los términos contenidos en el sustraendo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la solución correcta para operación combinada de polinomios
    en 'la expresión (4x^2 + 3) - (x^2 - 2) + (2x^2 - 1)'?
  alternativas:
  - 5x^2 + 4
  - 3x^2 + 4
  - 5x^2 + 0
  - x^2 + 4
  respuesta: 5x^2 + 4
  solucion_pasos:
  - 1. Aplicar la inversión de signos.
  - 2. Obtener 5x^2 + 4.
- titulo: Ejemplo 2
  enunciado: Al simplificar 'la expresión (4x^2 + 3) - (x^2 - 2) + (2x^2 - 1)' por
    operación combinada de polinomios, ¿qué resultado se obtiene?
  alternativas:
  - 5x^2 + 4
  - 3x^2 + 4
  - 5x^2 + 0
  - x^2 + 4
  respuesta: 5x^2 + 4
  solucion_pasos:
  - 1. Operar los coeficientes resultantes.
  - 2. Concluir 5x^2 + 4.
- titulo: ¿Es el resultado de la sustracción en 'la expresión (4x^2 + 3) - (x^2 -
    2) + (2x^2 - 1)' igual a 5x^2 + 4?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando el cambio de signos se obtiene 5x^2 + 4.
- titulo: ¿Da la resta en 'la expresión (4x^2 + 3) - (x^2 - 2) + (2x^2 - 1)' una diferencia
    igual a 3x^2 + 4?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es 5x^2 + 4.
errores_frecuentes:
- Omitir la inversión de signo en términos secundarios en operación combinada de polinomios.
- Sumar los exponentes al restar términos en operación combinada de polinomios.
- Omitir encfallar el sustraendo entre paréntesis en operación combinada de polinomios.
- Declarar el inverso aditivo de un polinomio con su recíproco multiplicativo.
- Declarar que restar un término negativo da como resultado un valor negativo.
afirmaciones_verdaderas:
- La operación combinada de polinomios exige la distribución completa del signo negativo
  sobre todo el sustraendo.
- El inverso aditivo de un polinomio se forma cambiando el signo a cada uno de sus
  términos.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la operación combinada
  de polinomios aplicando rigurosamente la regla del inverso aditivo sobre los términos
  restados.
