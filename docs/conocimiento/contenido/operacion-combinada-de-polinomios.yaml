semantic_id: MAT.ALG.SUSTRACCION_POL.OPERACION_COMBINADA
resumen_inicial: 'Operación combinada de polinomios: procedimiento y reglas en Sustracción
  de polinomios.'
explicacion_simple: Las operaciones algebraicas rara vez se presentan de una en una.
  En una expresión real, puede haber que sumar y restar varios polinomios en secuencia.
  La clave es resolver en orden, convirtiendo siempre las restas en sumas del opuesto.
explicacion_formal: '### Definición formal


  El signo $-$ exterior al paréntesis de C actúa como distribuidor, invirtiendo todos
  sus signos internos.


  ### Desarrollo didáctico


  Simplifica: $(3x^2 - x) + (x^2 + 4) - (2x^2 - 3x + 1)$.


  Eliminamos los agrupadores con sus reglas:

  - El $+$ no cambia nada: $3x^2 - x + x^2 + 4$.

  - El $-$ invierte el último: $-2x^2 + 3x - 1$.


  Juntos: $3x^2 - x + x^2 + 4 - 2x^2 + 3x - 1$.


  Reducimos por familias:

  - $x^2$: $3 + 1 - 2 = 2x^2$.

  - $x$: $-1 + 3 = 2x$.

  - Constante: $4 - 1 = 3$.


  Resultado: $2x^2 + 2x + 3$.'
definiciones_clave: '- **Operación combinada de polinomios**: Operación o propiedad
  fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a operación combinada de polinomios.'
ejemplo_guiado:
  enunciado: Aplica operación combinada de polinomios en una expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de operación combinada de polinomios.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
checkpoints:
