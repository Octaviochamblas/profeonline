semantic_id: MAT.GEO.ANGULOS_APLICACIONES.ELEVACION_DEFINICION
resumen_inicial: El ángulo de elevación es el ángulo agudo formado entre la línea
  horizontal de visión del observador y la línea visual dirigida hacia un objeto situado
  en una posición más alta.
explicacion_simple: '![Ángulo de Elevación](/static/img/nodos/definicion-de-angulo-de-elevacion-respecto-de-la-horizontal-intro.svg)


  Cuando miras hacia arriba (por ejemplo, a la copa de un árbol, la cima de una montaña
  o un avión), tus ojos forman un ángulo. La línea recta horizontal que sale a la
  altura de tus ojos y la línea recta que apunta hacia el objeto forman el **ángulo
  de elevación**.'
explicacion_formal: '### Definición formal

  El **ángulo de elevación** $\theta_{\text{elev}}$ es el ángulo formado entre la
  línea de visión de un observador hacia un objeto ubicado en una posición superior
  y la **línea horizontal de referencia** que pasa por el punto de observación:


  $$\theta_{\text{elev}} = \angle(\text{Línea Horizontal}, \text{Línea de Visión Ascendente})
  \quad (\text{con } \theta_{\text{elev}} \in [0^\circ, 90^\circ])$$


  $$\tan(\theta_{\text{elev}}) = \frac{h}{d} = \frac{\text{Altura relativa}}{\text{Distancia
  horizontal}}$$


  ### Desglose simbólico y geométrico

  - Línea horizontal: Recta base paralela al plano del horizonte terrestre.

  - Línea de visión: Rayo rectilíneo que une el ojo del observador con el objeto elevado.

  - $h$: Altura vertical del objeto respecto al nivel de los ojos del observador.

  - $d$: Distancia horizontal terrestre entre el observador y el pie de la vertical.


  ### Síntesis didáctica

  El ángulo de elevación es la variable angular fundamental en topografía y trigonometría
  para calcular alturas inaccesibles sin necesidad de escalarlas.'
definiciones_clave: '- **Línea horizontal**: Línea recta paralela al suelo a la altura
  del ojo del observador.

  - **Línea visual**: Recta imaginaria que une el ojo del observador con el objeto
  observado.

  - **Ángulo de elevación ($\alpha$)**: Abertura angular medida hacia arriba desde
  la horizontal. '
propiedades_relaciones: '- **Triángulo rectángulo fundamental**: La distancia horizontal
  $d$, la altura $h$ y la visual $v$ forman un triángulo rectángulo donde $\tan(\alpha)
  = \frac{h}{d}$.

  - **Altura total**: Si el observador tiene altura $h_0$, la altura total del objeto
  es $H = h_0 + d \cdot \tan(\alpha)$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo de Elevación](/static/img/nodos/definicion-de-angulo-de-elevacion-respecto-de-la-horizontal-ejemplos.svg)


    Una persona ubicada a $30\text{ m}$ de la base de un edificio observa la azotea
    con un ángulo de elevación de $45^\circ$. Si no se considera la altura de la persona,
    ¿cuál es la altura del edificio?'
  pasos:
  - 'Paso 1: Identificar los datos: distancia horizontal $d = 30\text{ m}$, ángulo
    de elevación $\alpha = 45^\circ$.'
  - 'Paso 2: Reconocer la relación trigonométrica: $\tan(\alpha) = \frac{\text{altura
    } h}{\text{distancia } d}$.'
  - 'Paso 3: Recordar que $\tan(45^\circ) = 1$.'
  - 'Paso 4: Igualar: $1 = \frac{h}{30\text{ m}} \implies h = 30\text{ m}$.'
  - 'Paso 5: Concluir que el edificio mide $30\text{ metros}$ de altura.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Entre qué dos líneas se mide siempre el ángulo de elevación?
  choices:
  - text: Entre la línea horizontal y la línea visual dirigida hacia arriba
    is_correct: true
  - text: Entre la línea vertical y la línea visual
    is_correct: false
  - text: Entre el suelo y la pared del edificio
    is_correct: false
  - text: Entre el norte magnético y el objeto
    is_correct: false
  explanation: Por definición, el ángulo de elevación se mide entre la línea horizontal
    y la línea visual dirigida hacia arriba.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un observador mira un objeto situado más arriba con un ángulo de elevación
    de 45°, ¿cómo se compara la altura del objeto con la distancia horizontal?
  choices:
  - text: La altura es exactamente igual a la distancia horizontal (porque tan(45°)
      = 1)
    is_correct: true
  - text: La altura es el doble de la distancia
    is_correct: false
  - text: La altura es la mitad de la distancia
    is_correct: false
  - text: La altura es cero
    is_correct: false
  explanation: Como tan(45°) = 1, la altura es exactamente igual a la distancia horizontal
    (porque tan(45°) = 1).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar el esquema con la línea horizontal del observador y la línea visual
  hacia arriba.'
- 'Paso 2: Ubicar el ángulo de elevación $\alpha$ pegado a la horizontal.'
- 'Paso 3: Identificar el triángulo rectángulo con cateto opuesto (altura) y cateto
  adyacente (distancia).'
- 'Paso 4: Aplicar la relación $\tan(\alpha) = \frac{\text{opuesto}}{\text{adyacente}}$
  para resolver la incógnita.'
errores_correccion: 'No midas el ángulo desde la vertical: el ángulo de elevación
  siempre tiene a la línea horizontal como lado inicial.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el ángulo de elevación hacia la copa de un poste es de $60^\circ$
    y estás a $10\text{ m}$ de su base, ¿cuál es la expresión de la altura?
  alternativas:
  - $h = 10 \cdot  an(60^\circ)$
  - $h = 10 \cdot \sin(60^\circ)$
  - $h = \frac{10}{ an(60^\circ)}$
  respuesta: $h = 10 \cdot  an(60^\circ)$
  solucion_pasos:
  - $ an(60^\circ) = \frac{h}{10} \implies h = 10 \cdot  an(60^\circ) = 10\sqrt{3}\text{
    m}$.
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de ángulo es siempre un ángulo de elevación en situaciones
    reales sobre el plano?
  alternativas:
  - Ángulo agudo ($0^\circ < \alpha < 90^\circ$)
  - Ángulo obtuso
  - Ángulo cóncavo
  respuesta: Ángulo agudo ($0^\circ < \alpha < 90^\circ$)
  solucion_pasos:
  - En la práctica, la visual hacia un objeto elevado se ubica entre la horizontal
    ($0^\circ$) y el cenit ($90^\circ$), siendo siempre agudo.
- titulo: ¿El ángulo de elevación se mide siempre hacia arriba a partir de la horizontal?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición geométrica formal de ángulo de elevación.
- titulo: ¿El ángulo de elevación se mide respecto a una línea vertical que pasa por
    el observador?
  respuesta: 'No'
  solucion_pasos:
  - No, se mide estrictamente respecto a la línea horizontal de visión.
errores_frecuentes:
- Medir el ángulo respecto a la vertical (ángulo cenital en vez de elevación).
- Confundir ángulo de elevación con ángulo de depresión.
- No considerar la altura del observador cuando el enunciado la proporciona explícitamente.
- Usar $\sin$ o $\cos$ en lugar de $ an$ al relacionar altura y distancia horizontal.
- Suponer que el ángulo cambia si el observador no se mueve.
afirmaciones_verdaderas:
- El ángulo de elevación tiene como lado inicial una recta horizontal imaginaria.
- El ángulo de elevación siempre es un ángulo agudo positivo.
al_terminar_debes_poder: '**QUÉ:** Definir, identificar y aplicar el concepto de ángulo
  de elevación en problemas geométricos y trigonométricos.


  **CÓMO:** Construyendo triángulos rectángulos con la línea horizontal como referencia
  y aplicando razones trigonométricas ($ an(\alpha) = \frac{h}{d}$).


  ![Resumen del Ángulo de Elevación](/static/img/nodos/definicion-de-angulo-de-elevacion-respecto-de-la-horizontal-resumen.svg)'
