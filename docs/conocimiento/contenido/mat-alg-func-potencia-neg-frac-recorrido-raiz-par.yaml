semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.RECORRIDO_RAIZ_PAR
resumen_inicial: 'El conjunto recorrido de una función potencia con exponente fraccionario de denominador par $f(x) = a x^{p/q}$ ($q$ par) son los reales no negativos $\operatorname{Rec}(f) = [0, +\infty[$ si $a > 0$, o los reales no positivos $\operatorname{Rec}(f) = ]-\infty, 0]$ si $a < 0$.'
explicacion_simple: |
  En las funciones potencia de exponente fraccionario con denominador par (como $x^{1/2}, x^{3/4}$), la función representa una raíz de índice par ($\sqrt{}, \sqrt[4]{}$). Por definición matemática, el resultado de una raíz principal de índice par jamás puede ser un número negativo ($\sqrt{x} \ge 0$). Si el coeficiente $a$ es positivo, todas las respuestas son mayores o iguales a cero ($[0, +\infty[$). Si $a$ es negativo, el producto convierte todos los resultados en cero o negativos ($]-\infty, 0]$).
explicacion_formal: |
  ### Definición formal
  Para la función potencia de exponente fraccionario $f(x) = a \cdot x^{p/q} \equiv a \cdot \sqrt[q]{x^p}$ definida en $\operatorname{Dom}(f) = [0, +\infty[$ con denominador par **$q = 2k$ (Par)**, el **conjunto recorrido o conjunto imagen** viene determinado por el signo del parámetro de escala $a \neq 0$:

  1. **Caso Coeficiente Positivo ($a > 0$)**:
     - Puesto que $x^{p/2k} \ge 0$ para todo $x \ge 0$, el producto $a x^{p/2k} \ge 0$.
     - El mínimo absoluto se ubica en $f(0) = 0$.
     - Conjunto Recorrido: $\operatorname{Rec}(f) = [0, +\infty[$.

  2. **Caso Coeficiente Negativo ($a < 0$)**:
     - Puesto que $x^{p/2k} \ge 0$ para todo $x \ge 0$, el producto $a x^{p/2k} \le 0$.
     - El máximo absoluto se ubica en $f(0) = 0$.
     - Conjunto Recorrido: $\operatorname{Rec}(f) = ]-\infty, 0]$.

  ### Síntesis didáctica
  Diferencia de cota según el signo de $a$:
  - $a > 0 \implies \operatorname{Rec}(f) = [0, +\infty[$ (Semiparábola horizontal habitando el cuadrante I).
  - $a < 0 \implies \operatorname{Rec}(f) = ]-\infty, 0]$ (Semiparábola horizontal habitando el cuadrante IV).
definiciones_clave: |
  - **Recorrido acotado**: Conjunto de salidas de la raíz principal limitado por la cota $y = 0$.
  - **Raíz principal no negativa**: Propiedad por la cual $\sqrt[2k]{u} \ge 0$ para todo $u \ge 0$.
  - **Inversión del recorrido por el signo de $a$**: Transición del intervalo $[0, +\infty[$ a $]-\infty, 0]$ al multiplicar por un coeficiente negativo.
propiedades_relaciones: |
  - **Biyectividad e Invertibilidad**: En su dominio $[0, +\infty[$, la función $f(x) = a x^{p/2k}$ es estrictamente monótona, admitiendo función inversa definida en su recorrido.
  - **Invariancia por el numerador $p$**: Para todo $p \in \mathbb{Z}^+$, la raíz principal de índice par conserva la acotación de salidas a valores no negativos si $a > 0$.
ejemplo_guiado:
  enunciado: 'Determina el conjunto recorrido de las funciones potencia de exponente fraccionario $f(x) = 3 x^{1/2}$ y $g(x) = -5 x^{3/4}$, identificando el valor de su cota en el origen.'
  pasos:
    - 'Paso 1: Para $f(x) = 3 x^{1/2} = 3\sqrt{x}$, el denominador $q = 2$ es par y $a = 3 > 0$. Para $x = 0 \implies f(0) = 0$. Para todo $x > 0 \implies f(x) > 0$. Recorrido: $\operatorname{Rec}(f) = [0, +\infty[$.'
    - 'Paso 2: Para $g(x) = -5 x^{3/4} = -5\sqrt[4]{x^3}$, el denominador $q = 4$ es par y $a = -5 < 0$. Para $x = 0 \implies g(0) = 0$. Para todo $x > 0 \implies g(x) < 0$. Recorrido: $\operatorname{Rec}(g) = ]-\infty, 0]$.'
    - 'Paso 3: Conclusión: $f(x)$ posee su mínimo absoluto en $y = 0$ ($[0, +\infty[$), mientras que $g(x)$ posee su máximo absoluto en $y = 0$ ($]-\infty, 0]$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el conjunto recorrido de la función potencia $f(x) = 4 x^{1/4} = 4\sqrt[4]{x}$ con denominador par y coeficiente positivo $a = 4 > 0$?'
    choices:
      - {text: 'El intervalo de reales no negativos $\operatorname{Rec}(f) = [0, +\infty[$', is_correct: true}
      - {text: 'El conjunto completo de los números reales $\operatorname{Rec}(f) = \mathbb{R}$', is_correct: false}
      - {text: 'El intervalo de reales no positivos $\operatorname{Rec}(f) = ]-\infty, 0]$', is_correct: false}
      - {text: 'El conjunto $\mathbb{R} \setminus \{0\}$', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo de reales no negativos $\operatorname{Rec}(f) = [0, +\infty[$''. Las raíces principales de índice par con $a > 0$ entregan salidas mayores o iguales a cero.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué ocurre con el conjunto recorrido de la función potencia $f(x) = -2 x^{1/2} = -2\sqrt{x}$ al multiplicar la raíz cuadrada por el coeficiente negativo $a = -2$?'
    choices:
      - {text: 'El recorrido se invierte al intervalo de reales no positivos $\operatorname{Rec}(f) = ]-\infty, 0]$, pues toda salida no negativa se multiplica por un número negativo', is_correct: true}
      - {text: 'El recorrido pasa a ser todo el conjunto $\mathbb{R}$', is_correct: false}
      - {text: 'El recorrido se mantiene en $[0, +\infty[$', is_correct: false}
      - {text: 'La función deja de tener recorrido real', is_correct: false}
    explanation: 'La alternativa correcta es ''El recorrido se invierte al intervalo de reales no positivos $\operatorname{Rec}(f) = ]-\infty, 0]$, pues toda salida no negativa se multiplica por un número negativo''. El signo negativo de $a$ invierte el intervalo de salidas.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar que el denominador $q$ en el exponente fraccionario de $f(x) = a x^{p/q}$ sea par.'
  - 'Paso 2: Observar el signo del coeficiente multiplicativo $a$.'
  - 'Paso 3: Si $a > 0$, fijar el mínimo en $y = 0$ y declarar el recorrido como $\operatorname{Rec}(f) = [0, +\infty[$.'
  - 'Paso 4: Si $a < 0$, fijar el máximo en $y = 0$ y declarar el recorrido como $\operatorname{Rec}(f) = ]-\infty, 0]$.'
errores_correccion: |
  - **Error 1:** Declarar que el recorrido de $y = \sqrt{x}$ abarca números negativos porque $(-2)^2 = 4$. **Cómo corregirlo:** La función potencia $x^{1/2}$ representa la raíz cuadrada **principal** (aritmética), la cual por convención y definición de función es siempre no negativa ($y \ge 0$).
  - **Error 2:** Olvidar que el corchete en el cero es cerrado en el recorrido. **Cómo corregirlo:** En $x = 0$, $f(0) = a\sqrt[q]{0} = 0$. El cero pertenece al conjunto de imágenes, por lo que lleva corchete cerrado ($[0$ o $0]$).
ejemplos:
  - titulo: 'Recorrido de raíz cuadrada mónica'
    enunciado: '¿El recorrido de $f(x) = x^{1/2}$ es $[0, +\infty[$?'
    alternativas:
      - 'Sí, $[0, +\infty[$'
      - 'No, es $\mathbb{R}$'
      - 'No, es $]-\infty, 0]$'
    respuesta: 'Sí, $[0, +\infty[$'
    solucion_pasos:
      - '1. Denominador par $q = 2$ y $a = 1 > 0$.'
      - '2. El recorrido es $\operatorname{Rec}(f) = [0, +\infty[$.'
  - titulo: 'Recorrido con coeficiente negativo'
    enunciado: '¿La función $g(x) = -6x^{3/4}$ tiene recorrido $]-\infty, 0]$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Con $q = 4$ par y $a = -6 < 0$, las imágenes varían de $-\infty$ a $0$.'
  - titulo: 'Cota de la función raíz'
    enunciado: '¿El valor $y = -5$ pertenece al recorrido de $f(x) = 2x^{1/2}$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Puesto que el recorrido es $[0, +\infty[$, el valor negativo $-5$ no forma parte de la imagen.'
  - titulo: 'Recorrido de exponente 5/2'
    enunciado: '¿La función $h(x) = 4x^{5/2}$ posee un mínimo absoluto en $y = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Denominador $q = 2$ par y $a = 4 > 0 \implies$ mínimo en $(0, 0)$ y recorrido $[0, +\infty[$.'
