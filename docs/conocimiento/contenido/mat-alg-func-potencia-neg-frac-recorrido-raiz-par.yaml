  - 'Una función con exponente $1/2$ y $a > 0$ arroja salidas negativas para números reales pequeños.'
  - 'El recorrido de $f(x) = -3x^{1/2}$ es el intervalo cerrado $[0, +\infty[$.'
  - 'El valor cero $y = 0$ se excluye del recorrido de $f(x) = x^{1/4}$.'
  - 'El denominador par en el exponente permite que las salidas abarquen todos los números reales.'
afirmaciones_verdaderas:
  - 'El conjunto recorrido de una función potencia con exponente fraccionario de denominador par $f(x) = a x^{p/2k}$ son los reales no negativos $\operatorname{Rec}(f) = [0, +\infty[$ si $a > 0$, o los reales no positivos $\operatorname{Rec}(f) = ]-\infty, 0]$ si $a < 0$.'
  - 'La acotación del recorrido en $y = 0$ es consecuencia de la definición de raíz principal no negativa sobre el dominio $[0, +\infty[$.'
