semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.RECORRIDO_RAIZ_PAR
resumen_inicial: 'Determinación del recorrido de funciones potencia asociadas a raíces
  de índice par: forma general $f(x) = a x^n$, simetría, dominio y recorrido en Exponentes
  negativos y fraccionarios.'
explicacion_simple: Así como el dominio de la raíz de índice par se restringe a los
  no negativos, su resultado también queda limitado de la misma forma.
explicacion_formal: '### Definición formal


  Para $q$ par, $\sqrt[q]{x}$ se define como el único número real no negativo $y$
  tal que $y^q=x$, para $x\geq0$. Como $y\geq0$ por definición, el recorrido de $f(x)=x^{1/q}$
  es $[0,+\infty)$.


  ### Desarrollo didáctico


  $f(x)=\sqrt{x}$: nunca entrega como resultado un número negativo, aunque matemáticamente
  $(-3)^2=9$ también. Por convención, $\sqrt{9}=3$ (el valor no negativo), así que
  el recorrido de la función excluye los negativos.'
definiciones_clave: '- **Determinación del recorrido de funciones potencia asociadas
  a raíces de índice par**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n
  \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a determinación del recorrido de funciones potencia asociadas
  a raíces de índice par.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de determinación del recorrido de funciones potencia asociadas a raíces de índice
    par.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de determinación del recorrido
    de funciones potencia asociadas a raíces de índice par.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar determinación del recorrido de funciones potencia asociadas a
    raíces de índice par?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en exponentes negativos y fraccionarios
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en exponentes negativos y fraccionarios.
    El exponente n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en determinación del recorrido de funciones potencia asociadas
    a raíces de índice par?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el índice $q$ de la raíz en la expresión $x^{1/q}$.'
- 'Paso 2: Verifica si $q$ es par.'
- 'Paso 3: Si es par, concluye que el recorrido es $[0,+\infty)$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en determinación del recorrido de funciones potencia asociadas a
  raíces de índice par.
ejemplos:
- titulo: Determinación del recorrido de $\sqrt{x}$
  enunciado: Determina el recorrido de $f(x)=\sqrt{x}$.
  solucion_pasos:
  - El índice de la raíz es $2$, un número par.
  - El recorrido es $[0,+\infty)$.
- titulo: Determinación del recorrido de $x^{1/4}$
  enunciado: Determina el recorrido de $f(x)=x^{1/4}$.
  solucion_pasos:
  - El índice de la raíz es $4$, un número par.
  - El recorrido es $[0,+\infty)$.
- titulo: ¿Puede $f(x)=\sqrt{x}$ entregar como resultado un número negativo?
  enunciado: ¿Puede la función $f(x)=\sqrt{x}$ entregar un resultado negativo para
    algún $x$ de su dominio?
  respuesta: 'No'
  solucion_pasos:
  - Por convención, la raíz de índice par se define como el valor no negativo que
    cumple la igualdad.
- titulo: ¿El valor $0$ pertenece al recorrido de $f(x)=\sqrt[6]{x}$?
  enunciado: ¿El valor $f(x)=0$ pertenece al recorrido de $f(x)=\sqrt[6]{x}$?
  respuesta: Sí
  solucion_pasos:
  - Se alcanza exactamente en $x=0$, ya que $\sqrt[6]{0}=0$.
errores_frecuentes:
- Suponer que la raíz de índice par puede entregar tanto el valor positivo como el
  negativo.
- Confundir el recorrido de la raíz par con el de la raíz impar, que sí es todo $\mathbb{R}$.
- No relacionar el recorrido restringido con la definición por convención de la raíz
  de índice par.
- Olvidar que el valor $0$ sí pertenece al recorrido.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  determinación del recorrido de funciones potencia asociadas a raíces de índice par.
