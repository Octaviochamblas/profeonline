semantic_id: MAT.GEO.AREAS_TRIANGULOS.FORMULA_EQUILATERO
resumen_inicial: 'Fórmula del área del triángulo equilátero: A = l²√3 / 4: conceptos,
  teoremas, propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: Como todos los lados y ángulos de un triángulo equilátero están
  determinados por una sola medida (el lado), existe una fórmula directa para su área
  que no requiere calcular la altura por separado.
explicacion_formal: '![Área del triángulo equilátero](/static/img/geometria/areas-pitagoras/areas-triangulos-formula-equilatero.svg)


  ### Definición formal


  Esta fórmula surge de calcular la altura del equilátero con Pitágoras ($h=\frac{l\sqrt{3}}{2}$)
  y sustituirla en $A=\frac{l\times h}{2}=\frac{l\times\frac{l\sqrt3}{2}}{2}=\frac{l^2\sqrt3}{4}$.


  ### Desarrollo didáctico


  Un triángulo equilátero de lado 4 cm tiene área $A=\frac{4^2\sqrt3}{4}=\frac{16\sqrt3}{4}=4\sqrt3\approx6,93$
  cm².'
definiciones_clave: '- **Fórmula del área del triángulo equilátero: A = l²√3 / 4**:
  Elemento o propiedad fundamental en el estudio de perímetros, áreas y teoremas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
