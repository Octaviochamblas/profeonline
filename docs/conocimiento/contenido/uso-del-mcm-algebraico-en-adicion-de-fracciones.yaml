procedimiento:
- 'Paso 1: Factoriza los denominadores.'
- 'Paso 2: Construye el MCM.'
- 'Paso 3: Para cada fracción, multiplica su numerador por los factores del MCM que
  NO están en su denominador original.'
- 'Paso 4: Pon la suma de esos nuevos numeradores sobre el MCM.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en uso del m.c.m. algebraico en adición de fracciones.
ejemplos:
- titulo: Suma $\frac{2}{ab} + \frac{3}{b^2}$
  enunciado: Suma $\frac{2}{ab} + \frac{3}{b^2}$.
  solucion_pasos:
  - MCM entre $ab$ y $b^2$ es $ab^2$.
  - 'A la 1ra le falta ''b'': numerador $2b$.'
  - 'A la 2da le falta ''a'': numerador $3a$.'
  - 'Suma: $\frac{2b + 3a}{ab^2}$.'
- titulo: Suma $\frac{1}{2x} + \frac{1}{4x}$.
  solucion_pasos:
  - MCM es 4x. A la primera le falta 2. 2/4x + 1/4x = 3/4x.
- titulo: 'Respecto de «Uso del m.c.m. algebraico en adición de fracciones»: ¿Describe
    adecuadamente el'
  enunciado: 'Respecto de «Uso del m.c.m. algebraico en adición de fracciones»: ¿Describe
    adecuadamente el concepto esta frase? «El denominador común óptimo es el MCM de
    todos los denominadores originales, obtenido factorizándolos y tomando los factores
    únicos con su mayor exponente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El denominador común óptimo
    es el MCM de todos los denominadores originales, obtenido factorizándolos y tomando
    los factores únicos con su mayor exponente.'
- titulo: 'Respecto de «Uso del m.c.m. algebraico en adición de fracciones»: ¿Se puede
    aceptar esta afi'
  enunciado: 'Respecto de «Uso del m.c.m. algebraico en adición de fracciones»: ¿Se
    puede aceptar esta afirmación? «Usar el producto de todos los denominadores sin
    sacar MCM, resultando en polinomios difíciles de manejar»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El denominador común óptimo
    es el MCM de todos los denominadores originales, obtenido factorizándolos y tomando
    los factores únicos con su mayor exponente.'
errores_frecuentes:
- Usar el producto de todos los denominadores sin sacar MCM, resultando en polinomios
  difíciles de manejar.
- Multiplicar el numerador por todo el MCM en lugar de solo por el factor faltante.
- Para «¿Cuál es la principal ventaja de usar el MCM al sumar fracciones algebraicas»,
  la respuesta correcta es Evita tener que amplificar las fracciones.
- Para «¿Cuál es la principal ventaja de usar el MCM al sumar fracciones algebraicas»,
  la respuesta correcta es Garantiza que no aparezcan signos negativos.
- Para «¿Cuál es la principal ventaja de usar el MCM al sumar fracciones algebraicas»,
  la respuesta correcta es Hace que la respuesta sea siempre 1.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
