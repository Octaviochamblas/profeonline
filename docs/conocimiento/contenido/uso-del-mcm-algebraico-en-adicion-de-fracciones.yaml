semantic_id: MAT.ALG.FRACCIONES_SUMA.USO_MCM
resumen_inicial: El m.c.m. de los denominadores es el denominador común óptimo que
  minimiza el grado de los polinomios al sumar fracciones.
explicacion_simple: 'Para sumar varias fracciones algebraicas podrías simplemente
  multiplicar todos los denominadores entre sí, pero esto generaría números y exponentes
  innecesariamente grandes.

  El método óptimo consiste en calcular el m.c.m. de los denominadores.

  Al usar el m.c.m. como denominador común, los factores de amplificación son los
  más pequeños posibles, haciendo que los numeradores sean mucho más fáciles de sumar
  y reducir.'
explicacion_formal: 'Dada la suma $\sum_{i=1}^k \frac{N_i(x)}{D_i(x)}$, el **uso del
  m.c.m. en la adición** fija el denominador común $M(x) = \operatorname{mcm}(D_1,
  D_2, \dots, D_k)$:


  $$\sum_{i=1}^k \frac{N_i(x)}{D_i(x)} = \frac{\sum_{i=1}^k N_i(x) \cdot \left(\frac{M(x)}{D_i(x)}\right)}{M(x)}$$


  **Desglose de la fórmula:**

  - $M(x)$: Mímino común múltiplo de los denominadores que minimiza el grado $\operatorname{gr}(M)$.

  - $\frac{M(x)}{D_i(x)}$: Cociente entero exacto que actúa como el factor de amplificación
  mínimo para la fracción $i$.'
definiciones_clave: '- **Mínimo común denominador óptimo**: Expresión m.c.m. que evita
  grados polinomiales excesivos en las adiciones.

  - **Factor de amplificación mínimo**: Cociente $\frac{M(x)}{D_i(x)}$ de menor grado
  posible.'
propiedades_relaciones: '- **Eficiencia algebraica**: Minimiza la posibilidad de cometer
  errores algebraicos al manipular numeradores de menor grado.

  - **Simplificación facilitada**: Produce una fracción donde los factores del numerador
  son más sencillos de simplificar con el denominador.'
ejemplo_guiado:
  enunciado: Utiliza el m.c.m. de los denominadores para resolver la suma $\frac{1}{x^2
    - x} + \frac{2}{x^2 - 1}$, expresa la suma reducida y evalúala para $x = 3$.
  pasos:
  - 'Paso 1: Factorizar denominadores: $x^2 - x = x(x - 1)$ y $x^2 - 1 = (x - 1)(x
    + 1)$.Paso 2: Determinar el m.c.m. de denominadores: $M(x) = x(x - 1)(x + 1)$.Paso
    3: Calcular los factores de amplificación: para la primera es $(x + 1)$; para
    la segunda es $x$.Paso 4: Sumar numeradores amplificados: $\frac{1(x + 1) + 2(x)}{x(x
    - 1)(x + 1)} = \frac{x + 1 + 2x}{x(x^2 - 1)} = \frac{3x + 1}{x(x^2 - 1)}$.Paso
    5: Evaluar para $x = 3$: $\frac{3(3) + 1}{3(3^2 - 1)} = \frac{9 + 1}{3(8)} = \frac{10}{24}
    = \frac{5}{12}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el denominador común m.c.m. al sumar $\frac{1}{x(x-1)} + \frac{2}{(x-1)(x+1)}$?
  choices:
  - text: $x(x - 1)(x + 1)$
    is_correct: true
  - text: $x^2(x - 1)^2(x + 1)$
    is_correct: false
  - text: $(x - 1)$
    is_correct: false
  - text: $x^3 - 1$
    is_correct: false
  explanation: La alternativa correcta es '$x(x - 1)(x + 1)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la suma $\frac{3x + 1}{x(x^2 - 1)}$ para $x = 3$, ¿cuál es
    el resultado simplificado?
  choices:
  - text: $\frac{5}{12}$
    is_correct: true
  - text: $\frac{10}{12}$
    is_correct: false
  - text: $\frac{5}{6}$
    is_correct: false
  - text: $\frac{5}{24}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{5}{12}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar completamente cada uno de los denominadores.'
- 'Paso 2: Construir el m.c.m. tomando todos los factores comunes y no comunes a su
  mayor exponente.'
- 'Paso 3: Dividir el m.c.m. entre cada denominador factorizado para hallar los factores
  de amplificación mínimos.'
- 'Paso 4: Multiplicar cada numerador por su factor mínimo y sumar sobre el m.c.m.
  común.'
- 'Paso 5: Reducir y simplificar el numerador final.'
errores_correccion: '- **Error común:** Multiplicar a ciegas todos los denominadores
  sin factorizar (ejemplo: usar $x(x-1)^2(x+1)$ como denominador en vez del m.c.m.
  $x(x-1)(x+1)$).

  - **Cómo corregirlo:** Factoriza primero los denominadores para construir el m.c.m.
  exacto y evitar potencias duplicadas e innecesarias.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de adición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de adición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se conserva el denominador común al sumar?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla fundamental de la adición racional.
- titulo: ¿Se pueden sumar los denominadores entre sí?
  respuesta: 'No'
  solucion_pasos:
  - No, jamás se suman los denominadores.
errores_frecuentes:
- Sumar denominadores al realizar la adición de fracciones algebraicas.
- Sumar numeradores de fracciones con distinto denominador sin homogeneizar.
- Olvidar multiplicar el numerador por el factor de amplificación correspondiente.
- Dejar paréntesis sin expandir en el numerador impidiendo la reducción de términos
  semejantes.
- No verificar si el numerador final se puede factorizar para simplificar con el denominador.
afirmaciones_verdaderas:
- Para sumar fracciones algebraicas de igual denominador se suman los numeradores
  y se conserva el denominador común.
- El uso del m.c.m. como denominador común minimiza el grado de los numeradores amplificados.
al_terminar_debes_poder: Al finalizar este recurso podrás realizar la adición de fracciones
  algebraicas de igual y distinto denominador expresando el resultado en su forma
  simplificada.
