procedimiento:
- 'Paso 1: Factorizar completamente cada uno de los denominadores.'
- 'Paso 2: Construir el m.c.m. tomando todos los factores comunes y no comunes a su mayor exponente.'
- 'Paso 3: Dividir el m.c.m. entre cada denominador factorizado para hallar los factores de amplificación mínimos.'
- 'Paso 4: Multiplicar cada numerador por su factor mínimo y sumar sobre el m.c.m. común.'
- 'Paso 5: Reducir y simplificar el numerador final.'
errores_correccion: '- **Error 1:** Multiplicar los denominadores sin factorizar (usar $P(x) \cdot Q(x)$ en lugar del $\operatorname{mcm}(P,
  Q)$). **Cómo corregirlo:** Se deben **FACTORIZAR PRIMERO LOS DENOMINADORES Y CONSTRUIR EL M.C.M. CON LOS FACTORES AL MAYOR
  EXPONENTE**.

  - **Error 2:** Duplicar factores comunes al armar el denominador común. **Cómo corregirlo:** Los factores compartidos por
  dos o más denominadores **SOLO SE ESCRIBEN UNA VEZ CON SU MAYOR EXPONENTE EN EL M.C.M.**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el m.c.m. entre los denominadores de $\frac{1}{2x} + \frac{1}{x^2}$?
  alternativas:
  - $2x^2$
  - $2x^3$
  - $x^2$
  respuesta: $2x^2$
  solucion_pasos:
  - '1. Factores de coeficientes: 2.'
  - '2. Factores de variables al mayor exponente: $x^2$.'
  - '3. m.c.m.: $2x^2$.'
- titulo: Ejemplo 2
  enunciado: Al sumar $\frac{1}{x-1} + \frac{1}{(x-1)^2}$, ¿cuál es el denominador m.c.m. óptimo?
  alternativas:
  - $(x-1)^2$
  - $(x-1)^3$
  - $(x-1)$
  respuesta: $(x-1)^2$
  solucion_pasos:
  - 1. El factor común $(x-1)$ tiene exponente máximo 2.
  - 2. El m.c.m. óptimo es $(x-1)^2$.
- titulo: Minimización de grado
  enunciado: ¿El m.c.m. reduce el grado de los numeradores amplificados respecto al producto simple?
  respuesta: Sí
  solucion_pasos:
  - Sí, al evitar factores duplicados mantiene los grados al mínimo.
- titulo: Factor común en m.c.m.
  enunciado: Si un factor está en ambos denominadores con exponente 1, ¿se coloca al cuadrado en el m.c.m.?
  respuesta: 'No'
  solucion_pasos:
  - No, se toma al mayor exponente presente, que en este caso es 1.
errores_frecuentes:
- El mínimo común denominador entre $\frac{1}{x(x-1)}$ y $\frac{1}{(x-1)^2}$ es la expresión de mayor grado $x(x-1)^3$.
- Al sumar fracciones con denominadores $2x$ y $x^2$, el m.c.m. es el producto simple $2x^3$.
- El m.c.m. entre $x+1$ y $x-1$ es la suma de ambos binomios $2x$.
- Al utilizar el denominador común $M(x)$, el numerador resultante de la fracción $i$ se obtiene dividiendo $N_i(x)$ por $M(x)$.
- El m.c.m. de dos denominadores polinomiales es igual al M.C.D. de dichos polinomios.
afirmaciones_verdaderas:
- El m.c.m. de los denominadores es la expresión común de menor grado que contiene a cada denominador original.
- Utilizar el m.c.m. facilita la simplificación final del numerador resultante.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/uso-del-mcm-algebraico-en-adicion-de-fracciones-resumen.svg)


  QUÉ: Utilizar el m.c.m. algebraico como denominador común óptimo en la adición de fracciones.

  CÓMO: Factorizar denominadores, construir el m.c.m. tomando factores comunes y no comunes al mayor exponente ($\prod [F_{\text{todos}}]^{\max(e_i)}$)
  y amplificar numeradores mínimamente.

  '
