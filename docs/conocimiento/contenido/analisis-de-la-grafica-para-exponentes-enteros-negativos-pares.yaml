semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.GRAFICA_NEGATIVO_PAR
resumen_inicial: 'El análisis de la gráfica para funciones potencia con exponente entero negativo par $f(x) = \frac{a}{x^{2k}}$ ($k \in \mathbb{Z}^+, a \neq 0$) describe una curva en forma de volcán simétrica respecto al eje $Y$, con asíntota vertical $\mathcal{A}_V: x = 0$ y horizontal $\mathcal{A}_H: y = 0$, y recorrido $]0, +\infty[$ para $a > 0$ (o $]-\infty, 0[$ para $a < 0$).'
explicacion_simple: "![El análisis de la gráfica para funciones potencia con exponente entero negativo par $f(x) = \\frac{a}{x^{2k}}$ ($k \\in \\mathbb{Z}^+, a \\neq 0$) describe una curva en forma de volcán simétrica respecto al eje $Y$, con asíntota vertical $\\mathcal{A}_V: x = 0$ y horizontal $\\mathcal{A}_H: y = 0$, y recorrido $]0, +\\infty[$ para $a > 0$ (o $]-\\infty, 0[$ para $a < 0$)](/static/img/nodos/analisis-de-la-grafica-para-exponentes-enteros-negativos-pares-intro.svg)\n\n\nCuando el exponente es un **número negativo PAR ($-2, -4, -6...$)**, la gráfica tiene **forma de volcán**:\n\n- **¿Cómo se ve la curva?**\n  - Está dividida en **dos ramas gemelas** separadas por el eje $Y$.\n  - Si $a > 0$: Ambas ramas están **ARRIBA** (cuadrantes I y II). Cerca de $x = 0$ suben al infinito como la erupción de un volcán ($+\\infty$) y hacia los lados se aplanan pegadas al eje $X$.\n  - Si $a < 0$: Ambas ramas están **ABAJO** (cuadrantes III y IV, volcán invertido disparado a $-\\infty$).\n\
  - **Simetría:** Es **simétrica respecto al eje $Y$** ($f(-x) = f(x)$).\n- **Asíntotas:** Nunca toca al eje $Y$ ($x = 0$) ni al eje $X$ ($y = 0$)."
explicacion_formal: "Sea $f: \\mathbb{R} \\setminus \\{0\\} \\to \\mathbb{R}$ definida por $f(x) = \\frac{a}{x^{2k}}$ con $k \\in \\mathbb{Z}^+$ y $a \\in \\mathbb{R}^*$.\n\n**Propiedades asintóticas y de paridad**:\n1. **Paridad simétrica**:\n   $$f(-x) = \\frac{a}{(-x)^{2k}} = \\frac{a}{x^{2k}} = f(x) \\implies \\text{Simetría axial respecto al eje } Y$$\n2. **Límites asintóticos en el origen**:\n   $$\\lim_{x \\to 0^+} \\frac{a}{x^{2k}} = \\lim_{x \\to 0^-} \\frac{a}{x^{2k}} = \\begin{cases} +\\infty & \\text{si } a > 0 \\\\ -\\infty & \\text{si } a < 0 \\end{cases} \\implies \\mathcal{A}_V: x = 0$$\n3. **Límites asintóticos en el infinito**:\n   $$\\lim_{x \\to +\\infty} f(x) = \\lim_{x \\to -\\infty} f(x) = 0 \\implies \\mathcal{A}_H: y = 0$$\n4. **Recorrido**:\n   $$\\operatorname{Rec}(f) = \\begin{cases} ]0, +\\infty[ & \\text{si } a > 0 \\\\ ]-\\infty, 0[ & \\text{si } a < 0 \\end{cases}$$"
definiciones_clave: '- **Gráfica tipo volcán**: Curva discontinua de dos ramas con divergencia hacia el mismo signo infinito en la asíntota vertical.

  - **Asíntota bilateral homóloga**: Límites laterales en $x = 0$ con idéntico signo infinito.'
propiedades_relaciones: '- **Puntos pivote**: Pasa por $(-1, a)$ y $(1, a)$ a la misma altura.

  - **No anulación**: $f(x) \neq 0$ para todo $x$, por lo que el recorrido no contiene al cero.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la gráfica para funciones potencia con exponente entero negativo par $f(x) = \frac{a}{x^{2k}}$ ($k \in \mathbb{Z}^+, a \neq 0$) describe una curva en forma de volcán simétrica respecto al eje $Y$, con asíntota vertical $\mathcal{A}_V: x = 0$ y horizontal $\mathcal{A}_H: y = 0$, y recorrido $]0, +\infty[$ para $a > 0$ (o $]-\infty, 0[$ para $a < 0$)](/static/img/nodos/analisis-de-la-grafica-para-exponentes-enteros-negativos-pares-ejemplos.svg)



    Analiza la gráfica de $f(x) = \frac{2}{x^2}$:

    1) Halla los valores para $x = -2, -1, -0{,}5, 0{,}5, 1, 2$.

    2) Identifica las asíntotas y la simetría.

    3) Determina el dominio y recorrido.'
  pasos:
  - 'Paso 1: Puntos calculados:

    - $f(-2) = 2/4 = \mathbf{0{,}5} \implies (-2; 0{,}5)$.

    - $f(-1) = 2/1 = \mathbf{2} \implies (-1, 2)$.

    - $f(-0{,}5) = 2/0{,}25 = \mathbf{8} \implies (-0{,}5; 8)$.

    - $f(0{,}5) = \mathbf{8} \implies (0{,}5; 8)$.

    - $f(1) = \mathbf{2} \implies (1, 2)$.

    - $f(2) = \mathbf{0{,}5} \implies (2; 0{,}5)$.'
  - 'Paso 2: Simétrica respecto al eje $Y$ ($f(-x) = f(x)$). Asíntota vertical $\mathcal{A}_V: x = 0$ y horizontal $\mathcal{A}_H: y = 0$.'
  - 'Paso 3: $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$ y $\operatorname{Rec}(f) = ]0, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué cuadrantes se ubica la gráfica de la función $f(x) = \frac{5}{x^4}$?
  choices:
  - text: Cuadrantes I y II (ambas ramas arriba)
    is_correct: true
  - text: Cuadrantes I y III
    is_correct: false
  - text: Cuadrantes III y IV
    is_correct: false
  - text: Cuadrantes II y IV
    is_correct: false
  explanation: La alternativa correcta es 'Cuadrantes I y II (ambas ramas arriba)'. Al ser el exponente par negativo y $a = 5 > 0$, todos los valores de $y$ son estrictamente positivos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el recorrido de la función $g(x) = -\frac{3}{x^2}$?
  choices:
  - text: ']-∞, 0[ (abierto en cero)'
    is_correct: true
  - text: ']-∞, 0]'
    is_correct: false
  - text: ']0, +∞['
    is_correct: false
  - text: ℝ \ {0}
    is_correct: false
  explanation: La alternativa correcta es ']-∞, 0[ (abierto en cero)'. Como $a = -3 < 0$, las ramas apuntan hacia $-\infty$, y el cero nunca se alcanza (abierto en 0).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el exponente sea un número negativo par ($n = -2, -4, -6...$).'
- 'Paso 2: Trazar las asíntotas vertical $x = 0$ (eje $Y$) y horizontal $y = 0$ (eje $X$).'
- 'Paso 3: Si $a > 0$, ubicar las dos ramas en cuadrantes I y II divergentes a $+\infty$ en $x = 0$.'
- 'Paso 4: Si $a < 0$, ubicar las dos ramas en cuadrantes III y IV divergentes a $-\infty$ en $x = 0$.'
errores_correccion: '- **Error común:** Dibujar la gráfica pasando por el origen $(0, 0)$ o cruzando el eje $X$.

  - **Cómo corregirlo:** La función con exponente negativo **JAMÁS corta los ejes**: tiene **asíntotas en $x = 0$ e $y = 0$**.'
ejemplos:
- titulo: 'Ejemplo 1: Simetría de volcán'
  enunciado: ¿Qué simetría tiene la gráfica de $f(x) = \frac{1}{x^6}$?
  alternativas:
  - Simetría respecto al eje Y (función par)
  - Simetría respecto al origen
  - Simetría respecto a y = x
  - Sin simetría
  respuesta: Simetría respecto al eje Y (función par)
  solucion_pasos:
  - 'Paso 1: $f(-x) = \frac{1}{(-x)^6} = \frac{1}{x^6} = f(x) \implies$ simetría axial eje Y.'
- titulo: 'Ejemplo 2: Comportamiento cerca de cero'
  enunciado: Cuando $x \to 0$, ¿qué le ocurre a $f(x) = \frac{4}{x^2}$?
  alternativas:
  - Tiende a +infinito
  - Tiende a 0
  - Tiende a 4
  - Tiende a -infinito
  respuesta: Tiende a +infinito
  solucion_pasos:
  - 'Paso 1: $\lim_{x \to 0} \frac{4}{x^2} = +\infty$.'
- titulo: 'Ejemplo 3: Ramas invertidas'
  enunciado: 'La gráfica de $g(x) = -\frac{2}{x^4}$ se ubica en los cuadrantes:'
  alternativas:
  - III y IV
  - I y II
  - I y III
  - II y IV
  respuesta: III y IV
  solucion_pasos:
  - 'Paso 1: Par negativo con $a = -2 < 0 \implies$ cuadrantes III y IV.'
- titulo: 'Ejemplo 4: Recorrido par positivo'
  enunciado: ¿Por qué $y = 0$ no pertenece al recorrido de $y = 1/x^2$?
  alternativas:
  - Porque una fracción con numerador 1 nunca puede valer 0
  - Porque x = 0 no está en el dominio
  - Porque la función es cuadrática
  - Sí pertenece
  respuesta: Porque una fracción con numerador 1 nunca puede valer 0
  solucion_pasos:
  - 'Paso 1: $1/x^2 = 0 \implies 1 = 0$ (imposible) $\implies 0 \notin \operatorname{Rec}$.'
errores_frecuentes:
- Trazar una rama positiva y otra negativa en exponentes pares negativos.
- Incluir el cero en el recorrido cerrando el corchete.
- Olvidar que las dos ramas divergen hacia el mismo sentido del infinito.
afirmaciones_verdaderas:
- Las funciones potencia con exponente negativo par generan gráficas en forma de volcán simétricas al eje Y.
- Poseen asíntota vertical en x = 0 y horizontal en y = 0, sin intersección con los ejes.
al_terminar_debes_poder: '**QUÉ:** Analizar y graficar funciones potencia con exponente entero negativo par.


  **CÓMO:** Identificando la forma de volcán simétrica al eje Y, las asíntotas x = 0, y = 0 y el recorrido abierto en cero.


