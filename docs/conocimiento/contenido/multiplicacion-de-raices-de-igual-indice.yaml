resumen_inicial: 'Al multiplicar raíces que comparten el mismo índice $\sqrt[n]{a}
  \cdot \sqrt[n]{b}$, se multiplican los radicandos dentro de un único radical conservando
  el índice común: $\sqrt[n]{a \cdot b}$ ($a, b \ge 0$ si $n$ es par).'
explicacion_simple: Cuando multiplicamos dos raíces que tienen el mismo número pequeñito
  arriba (el mismo índice), podemos juntar todo dentro de una sola raíz manteniendo
  ese mismo índice y multiplicando los números de adentro entre sí.
explicacion_formal: 'Para todo $a, b \in \mathbb{R}$ (con $a, b \ge 0$ si $n$ es par)
  y $n \in \mathbb{N}_{\ge 2}$, el **Producto de Raíces de Igual Índice** satisface:


  $$\sqrt[n]{a} \cdot \sqrt[n]{b} = \sqrt[n]{a \cdot b}$$


  **Demostración mediante exponente fraccionario:**

  $$\sqrt[n]{a} \cdot \sqrt[n]{b} = a^{\frac{1}{n}} \cdot b^{\frac{1}{n}} = (a \cdot
  b)^{\frac{1}{n}} = \sqrt[n]{a \cdot b}$$


  > **Complemento didáctico:** La propiedad NO permite multiplicar raíces con índices
  distintos sin antes igualar sus órdenes.'
definiciones_clave: '- **Multiplicación de raíces de igual índice**: Regla $\sqrt[n]{a}
  \cdot \sqrt[n]{b} = \sqrt[n]{a \cdot b}$ que unifica radicandos bajo el índice común.'
propiedades_relaciones: '- **Agrupación de radicandos**: Multiplica $a \cdot b$ dentro
  del radical único.'
ejemplo_guiado:
  enunciado: Multiplique y simplifique las raíces $\sqrt{2} \cdot \sqrt{8}$ y $\sqrt[3]{3}
    \cdot \sqrt[3]{9}$.
  pasos:
  - 'Paso 1: Para $\sqrt{2} \cdot \sqrt{8}$, como tienen índice $2$, multiplicar dentro:
    $\sqrt{2 \cdot 8} = \sqrt{16} = 4$.'
  - 'Paso 2: Para $\sqrt[3]{3} \cdot \sqrt[3]{9}$, como tienen índice $3$, multiplicar
    dentro: $\sqrt[3]{3 \cdot 9} = \sqrt[3]{27} = 3$.'
  - 'Conclusión: $\sqrt{2} \cdot \sqrt{8} = 4$ y $\sqrt[3]{3} \cdot \sqrt[3]{9} =
    3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué procedimiento se aplica al multiplicar dos raíces que comparten el
    mismo índice n?
  choices:
  - text: Se multiplican los radicandos dentro de una sola raíz manteniendo el índice
      (sqrt[n]{a · b})
    is_correct: true
  - text: Se suman los índices y se multiplican las raíces
    is_correct: false
  - text: Se restan las raíces
    is_correct: false
  - text: Se dividen los radicandos
    is_correct: false
  explanation: La alternativa correcta es 'Se multiplican los radicandos dentro de
    una sola raíz manteniendo el índice (sqrt[n]{a · b})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt(2) · sqrt(8), ¿cuál fue el resultado entero
    final?
  choices:
  - text: 4 (porque sqrt(16) = 4)
    is_correct: true
  - text: '16'
    is_correct: false
  - text: '10'
    is_correct: false
  - text: sqrt(10)
    is_correct: false
  explanation: La alternativa correcta es '4 (porque sqrt(16) = 4)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de simplificar productos de raíces
  de igual índice $\sqrt[n]{a} \cdot \sqrt[n]{b} = \sqrt[n]{a \cdot b}$, multiplicando
  sus radicandos bajo un índice común.
semantic_id: MAT.NUM.RAICES_PROPIEDADES.MULTIPLICACION_IGUAL_INDICE
procedimiento:
- 'Paso 1: Verificar las condiciones de los radicales e índices.'
- 'Paso 2: Aplicar la ley algebraica correspondiente a la propiedad.'
- 'Paso 3: Escribir el radical resultante en forma simplificada.'
errores_correccion: '- **Error 1: Distribuir la raíz sobre la suma ($\sqrt{a+b} =
  \sqrt{a} + \sqrt{b}$).** **Cómo corregirlo:** La radicación NO es distributiva sobre
  la adición (ej: $\sqrt{9+16} = 5 \neq 3+4=7$).


  - **Error 2: Sumar o restar los índices durante las operaciones.** **Cómo corregirlo:**
  Los índices se MANTIENEN o multiplican según la ley específica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAICES_PROPIEDADES.MULTIPLICACION_IGUAL_INDICE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad de raíces.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal del radical.
- titulo: ¿Conserva el resultado la equivalencia en los reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las leyes algebraicas de los radicales.
- titulo: ¿Es distributiva la raíz respecto a la suma?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a+b} \neq \sqrt{a} + \sqrt{b}$.
errores_frecuentes:
- Distribuir la raíz sobre los términos de una adición o sustracción de la forma $\sqrt{a+b}
  = \sqrt{a} + \sqrt{b}$.
- Sumar los índices de las raíces al realizar operaciones de multiplicación o división.
- Sumar los radicandos al realizar la adición de radicales semejantes.
- Ingresar un factor a una raíz multiplicándolo por el índice en lugar de elevarlo
  a él.
- Declarar como semejantes a dos raíces que tienen radicandos diferentes.
afirmaciones_verdaderas:
- Las propiedades de las raíces permiten transformar y simplificar expresiones radicales
  en $\mathbb{R}$.
- La radicación se distribuye sobre la multiplicación y la división, pero no sobre
  la suma o la resta.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
