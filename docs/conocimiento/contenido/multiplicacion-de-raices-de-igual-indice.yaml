semantic_id: MAT.NUM.RAICES_PROPIEDADES.MULTIPLICACION_IGUAL_INDICE
resumen_inicial: 'La multiplicación de raíces de igual índice permite multiplicar sus radicandos bajo una sola raíz común con el mismo índice: $\sqrt[n]{a} \cdot \sqrt[n]{b} = \sqrt[n]{a \cdot b}$.'
explicacion_simple: |
  Cuando tienes dos raíces que comparten el mismo número pequeñito arriba (el índice, como la raíz cuadrada $\sqrt{}$ o la raíz cúbica $\sqrt[3]{}$), no necesitas calcular cada raíz por separado. Puedes unir la multiplicación en una sola casa o radical, multiplicando los números de adentro (los radicandos) bajo la misma raíz. Por ejemplo, $\sqrt{2} \cdot \sqrt{8} = \sqrt{2 \cdot 8} = \sqrt{16} = 4$.
explicacion_formal: |
  ### Definición formal
  La **propiedad de multiplicación de radicales de igual índice** establece que para cualesquiera números reales $a, b \in \mathbb{R}$ y todo índice $n \in \mathbb{Z}^+ \setminus \{1\}$ (con $a, b \ge 0$ si $n$ es par):
  $$\sqrt[n]{a} \cdot \sqrt[n]{b} = \sqrt[n]{a \cdot b}$$

  ### Demostración mediante exponentes fraccionarios
  Expresando las raíces como potencias de exponente fraccionario y aplicando la propiedad distributiva de la potencia sobre el producto:
  $$\sqrt[n]{a} \cdot \sqrt[n]{b} = a^{1/n} \cdot b^{1/n} = (a \cdot b)^{1/n} = \sqrt[n]{a \cdot b}$$

  ### Síntesis didáctica
  - Condición de aplicación: Los índices deben ser estrictamente iguales ($n = n$).
  - Operación subradical: Se conserva el índice común $n$ y se multiplican los radicandos internos ($a \cdot b$).
definiciones_clave: |
  - **Multiplicación de igual índice**: Propiedad algebraica de unificación de radicales de igual grado en un solo producto subradical.
  - **Índice común $n$**: Grado del radical que se mantiene inalterado tras la multiplicación.
  - **Radicando resultante $a \cdot b$**: Producto de los números interiores de cada raíz individual.
propiedades_relaciones: |
  - **Inversa de la descomposición**: La propiedad funciona bidireccionalmente para descomponer raíces complejas: $\sqrt[n]{a \cdot b} = \sqrt[n]{a} \cdot \sqrt[n]{b}$.
  - **Restricción para índices pares**: Exige $a \ge 0$ y $b \ge 0$ para evitar el producto de cantidades imaginarias en $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Calcula el valor exacto del producto de raíces de igual índice $P = \sqrt[3]{4} \cdot \sqrt[3]{16}$ simplificando el resultado.'
  pasos:
    - 'Paso 1: Verificamos que los índices de ambas raíces sean iguales ($n = 3$).'
    - 'Paso 2: Aplicamos la propiedad multiplicando los radicandos internos bajo una sola raíz cúbica: $P = \sqrt[3]{4 \cdot 16} = \sqrt[3]{64}$.'
    - 'Paso 3: Calculamos la raíz cúbica resultante buscando un número cuya tercera potencia sea 64: $4^3 = 64$.'
    - 'Paso 4: Conclusión: $P = 4$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué procedimiento debe aplicarse para multiplicar dos raíces de igual índice como $\sqrt[n]{a}$ y $\sqrt[n]{b}$?'
    choices:
      - {text: 'Se multiplican los radicandos dentro de una sola raíz conservando el índice común $\sqrt[n]{a \cdot b}$', is_correct: true}
      - {text: 'Se suman los radicandos y se multiplican los índices', is_correct: false}
      - {text: 'Se suman las raíces sin multiplicar sus interiores', is_correct: false}
      - {text: 'Se multiplican únicamente los índices conservando los radicandos', is_correct: false}
    explanation: 'La alternativa correcta es ''Se multiplican los radicandos dentro de una sola raíz conservando el índice común $\sqrt[n]{a \cdot b}$''. La propiedad conserva el índice $n$ y unifica el producto $a \cdot b$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el resultado de simplificar el producto $\sqrt{3} \cdot \sqrt{27}$?'
    choices:
      - {text: '$9$, pues $\sqrt{3 \cdot 27} = \sqrt{81} = 9$', is_correct: true}
      - {text: '$\sqrt{30}$, sumando los radicandos', is_correct: false}
      - {text: '$81$, olvidando extraer la raíz cuadrada', is_correct: false}
      - {text: '$3$, dividiendo los radicandos', is_correct: false}
    explanation: 'La alternativa correcta es ''$9$, pues $\sqrt{3 \cdot 27} = \sqrt{81} = 9$''. Multiplicamos $3 \cdot 27 = 81$ y extraemos $\sqrt{81} = 9$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Comprobar que los índices de todas las raíces de la multiplicación sean idénticos ($n$).'
  - 'Paso 2: Escribir un solo símbolo radical conservando el índice común $n$.'
  - 'Paso 3: Multiplicar los números o expresiones interiores (radicandos) bajo ese único radical.'
  - 'Paso 4: Simplificar el radicando resultante o calcular la raíz exacta si corresponde.'
errores_correccion: |
  - **Error 1:** Sumar los índices de las raíces al multiplicar (ej: escribir $\sqrt{2} \cdot \sqrt{8} = \sqrt[4]{16}$). **Cómo corregirlo:** Los índices **no se suman ni se multiplican**; el índice común $n$ se conserva exactamente igual: $\sqrt{2 \cdot 8} = \sqrt{16}$.
  - **Error 2:** Multiplicar raíces con índices diferentes como si fueran iguales (ej: $\sqrt{2} \cdot \sqrt[3]{4} = \sqrt[3]{8}$). **Cómo corregirlo:** La propiedad sólo aplica para raíces de **igual índice**. Si los índices son distintos, primero deben homogenizarse expresándose como potencias de exponente fraccionario.
ejemplos:
  - titulo: 'Multiplicación de raíces cuadradas simples'
    enunciado: '¿Cuál es el valor de $\sqrt{2} \cdot \sqrt{18}$?'
    alternativas:
      - '$6$, pues $\sqrt{36} = 6$'
      - '$\sqrt{20}$'
      - '$36$'
    respuesta: '$6$, pues $\sqrt{36} = 6$'
    solucion_pasos:
      - '1. Unificamos radicandos: $\sqrt{2 \cdot 18} = \sqrt{36}$.'
      - '2. Calculamos $\sqrt{36} = 6$.'
  - titulo: 'Multiplicación de raíces cúbicas'
    enunciado: '¿El producto $\sqrt[3]{5} \cdot \sqrt[3]{25}$ es igual a $5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt[3]{5 \cdot 25} = \sqrt[3]{125} = 5$.'
  - titulo: 'Multiplicación con coeficientes algebraicos'
    enunciado: '¿El producto $2\sqrt{3} \cdot 4\sqrt{3}$ resulta en $24$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Multiplicamos coeficientes $(2 \cdot 4 = 8)$ y raíces $(\sqrt{3 \cdot 3} = \sqrt{9} = 3) \implies 8 \cdot 3 = 24$.'
  - titulo: 'Conservación del índice en multiplicación'
    enunciado: '¿La propiedad de multiplicación mantiene intacto el índice original $n$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El índice $n$ se conserva en la raíz unificada $\sqrt[n]{a \cdot b}$.'
errores_frecuentes:
  - 'La multiplicación de raíces cuadradas $\sqrt{a} \cdot \sqrt{b}$ es igual a la suma $\sqrt{a + b}$.'
  - 'Al multiplicar $\sqrt{3} \cdot \sqrt{12}$, los índices se suman dando la raíz cuarta $\sqrt[4]{36}$.'
  - 'Se pueden multiplicar directamente radicandos de raíces con índices distintos sin igualar sus índices previamente.'
  - 'Multiplicar $\sqrt{5} \cdot \sqrt{5}$ entrega como resultado la raíz $\sqrt{10}$.'
  - 'El producto de dos raíces reales de índice par sobre números negativos está definido en los números reales.'
afirmaciones_verdaderas:
  - 'La propiedad de multiplicación de raíces de igual índice unifica el producto de radicandos bajo un mismo radical: $\sqrt[n]{a} \cdot \sqrt[n]{b} = \sqrt[n]{a \cdot b}$.'
  - 'La propiedad se demuestra convirtiendo las raíces a potencias de exponente fraccionario $a^{1/n} \cdot b^{1/n} = (a \cdot b)^{1/n}$.'
al_terminar_debes_poder: 'Simplificar y calcular productos de raíces de igual índice agrupando sus radicandos bajo un solo radical común.'
