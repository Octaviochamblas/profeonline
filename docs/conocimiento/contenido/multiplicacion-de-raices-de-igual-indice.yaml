semantic_id: MAT.NUM.RAICES_PROPIEDADES.MULTIPLICACION_IGUAL_INDICE
resumen_inicial: Al multiplicar raíces que tienen el mismo índice, se mantiene el índice y
  se multiplican los radicandos ($\sqrt[n]{a} \cdot \sqrt[n]{b} = \sqrt[n]{a \cdot b}$).
explicacion_simple: 'Si multiplicas dos raíces del mismo tipo (por ejemplo dos raíces cuadradas
  o dos raíces cúbicas), puedes juntar los números de adentro en una sola raíz:

  $$\sqrt{2} \cdot \sqrt{8} = \sqrt{2 \cdot 8} = \sqrt{16} = 4$$

  Esta propiedad es muy útil para resolver multiplicaciones de raíces irracionales que al
  juntarse dan una raíz exacta.'
explicacion_formal: 'Para todo $a, b \ge 0$ (o todo $a, b \in \mathbb{R}$ si $n$ es impar)
  y $n \in \mathbb{N}, n \ge 2$, se cumple:

  $$\sqrt[n]{a} \cdot \sqrt[n]{b} = \sqrt[n]{a \cdot b}$$'
definiciones_clave: '- **Agrupación bajo radical común**: Multiplicación de los radicandos
  $a \cdot b$ bajo el mismo índice $n$.'
propiedades_relaciones: '- **Distributividad del radical respecto al producto**: $\sqrt[n]{a
  \cdot b} = \sqrt[n]{a} \cdot \sqrt[n]{b}$.'
ejemplo_guiado:
  enunciado: Calcula el valor de $\sqrt[3]{3} \cdot \sqrt[3]{9}$.
  pasos:
  - 'Verificar que ambas raíces tengan el mismo índice: $n = 3$.'
  - 'Multiplicar los radicandos dentro de una sola raíz cúbica: $\sqrt[3]{3 \cdot 9}$.'
  - 'Calcular el producto interno: $3 \cdot 9 = 27$.'
  - 'Extraer la raíz exacta: $\sqrt[3]{27} = 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale el producto $\sqrt{3} \cdot \sqrt{12}$?
  choices:
  - text: '6'
    is_correct: true
  - text: '36'
    is_correct: false
  - text: \sqrt{15}
    is_correct: false
  - text: '18'
    is_correct: false
  explanation: 'La correcta es: 6. $\sqrt{3 \cdot 12} = \sqrt{36} = 6$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Simplifica $\sqrt[4]{2} \cdot \sqrt[4]{8}$.
  choices:
  - text: '2'
    is_correct: true
  - text: '16'
    is_correct: false
  - text: \sqrt[4]{10}
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: 'La correcta es: 2. $\sqrt[4]{2 \cdot 8} = \sqrt[4]{16} = 2$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que los índices de las raíces sean iguales.'
- 'Paso 2: Multiplicar los radicandos entre sí.'
- 'Paso 3: Colocar el resultado del producto dentro del mismo radical.'
- 'Paso 4: Simplificar o calcular el valor final de la raíz.'
errores_correccion: No multipliques raíces con índices distintos sin igualarlos primero. $\sqrt{2}
  \cdot \sqrt[3]{2} \neq \sqrt[6]{4}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\sqrt{5} \cdot \sqrt{5}$.
  alternativas:
  - '5'
  - '25'
  - \sqrt{10}
  respuesta: '5'
  solucion_pasos:
  - $\sqrt{5 \cdot 5} = \sqrt{25} = 5$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale raíz cuadrada de 6 por raíz cuadrada de 24?
  alternativas:
  - '12'
  - '144'
  - raíz cuadrada de 30
  respuesta: '12'
  solucion_pasos:
  - raíz cuadrada de (6·24) = raíz cuadrada de 144 = 12.
- titulo: Ejemplo 3
  enunciado: ¿A qué equivale raíz cúbica de 4 por raíz cúbica de 16?
  alternativas:
  - '4'
  - raíz cúbica de 20
  - '8'
  respuesta: '4'
  solucion_pasos:
  - raíz cúbica de (4·16) = raíz cúbica de 64 = 4.
- titulo: ¿Es correcto multiplicar directamente raíz cuadrada de 3 por raíz cúbica de 3 usando
    esta propiedad?
  respuesta: 'No'
  solucion_pasos:
  - Los índices son distintos (2 y 3); esta propiedad exige índices iguales.
errores_frecuentes:
- Multiplicar raíces de distinto índice directamente.
- Multiplicar raíces de distinto índice sin igualarlos primero.
- Sumar los radicandos en lugar de multiplicarlos.
- Olvidar simplificar el radical resultante cuando el producto de los radicandos es una potencia
  perfecta.
- Multiplicar los índices en lugar de mantenerlos constantes.
afirmaciones_verdaderas:
- $\sqrt[n]{a} \cdot \sqrt[n]{b} = \sqrt[n]{ab}$.
- Esta propiedad requiere que las raíces tengan exactamente el mismo índice; si los índices
  difieren, deben igualarse antes de multiplicar.
al_terminar_debes_poder: Multiplicar raíces del mismo índice agrupando los radicandos.
fuente: Texto escolar MINEDUC.
estado: publicado
