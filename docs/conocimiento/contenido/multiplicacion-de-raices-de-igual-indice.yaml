semantic_id: MAT.NUM.RAICES_PROPIEDADES.MULTIPLICACION_IGUAL_INDICE
resumen_inicial: 'El producto de dos o más raíces de igual índice es igual a la raíz del producto de sus radicandos: $\sqrt[n]{a} \cdot \sqrt[n]{b} = \sqrt[n]{a \cdot b}$, conservando el índice común.'
explicacion_simple: '![Multiplicación de raíces de igual índice](/static/img/nodos/multiplicacion-de-raices-de-igual-indice-intro.svg)


  Cuando multiplicas raíces que tienen el mismo número en el gancho (el mismo índice $n$), la regla es muy simple: **conservas el índice y multiplicas los números de adentro (los radicandos)**.

  Por ejemplo, $\sqrt{2}$ y $\sqrt{8}$ por separado son números decimales infinitos (irracionales), pero al multiplicarlos:

  $$\sqrt{2} \cdot \sqrt{8} = \sqrt{2 \cdot 8} = \sqrt{16} = 4$$

  ¡Obtenemos un número entero exacto! Si hay números multiplicando afuera (coeficientes), multiplicas los de afuera entre sí y las raíces entre sí: $(2\sqrt{3}) \cdot (5\sqrt{3}) = (2 \cdot 5)\sqrt{3 \cdot 3} = 10 \cdot 3 = 30$.'
explicacion_formal: 'Sean $a, b \in \mathbb{R}$ y $n \in \mathbb{N}$ con $n \ge 2$, donde $a \ge 0$ y $b \ge 0$ si $n$ es par. La **Propiedad del Producto de Radicales Homogéneos** establece:


  $$\sqrt[n]{a} \cdot \sqrt[n]{b} = \sqrt[n]{a \cdot b}$$


  **Demostración mediante potencias racionales:**

  Por la definición de exponente fraccionario y distributividad de la potencia sobre el producto:

  $$\sqrt[n]{a} \cdot \sqrt[n]{b} = a^{1/n} \cdot b^{1/n} = (a \cdot b)^{1/n} = \sqrt[n]{a \cdot b}$$


  **Extensión con coeficientes escalares:**

  $$(p \sqrt[n]{a}) \cdot (q \sqrt[n]{b}) = (p \cdot q) \sqrt[n]{a \cdot b} \quad (\forall p, q \in \mathbb{R})$$'
definiciones_clave: '- **Radicales homogéneos**: Raíces que comparten exactamente el mismo índice $n$.

  - **Fusión subradical**: Unificación de factores bajo un único operador radical común.

  - **Multiplicación con coeficientes**: Producto independiente de la parte escalar y la parte radical.'
propiedades_relaciones: '- **Asociatividad y conmutatividad**: $\sqrt[n]{a} \cdot \sqrt[n]{b} \cdot \sqrt[n]{c} = \sqrt[n]{a \cdot b \cdot c}$.

  - **Cuadrado de una raíz**: $\sqrt{a} \cdot \sqrt{a} = (\sqrt{a})^2 = a$ para todo $a \ge 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de multiplicación de raíces](/static/img/nodos/multiplicacion-de-raices-de-igual-indice-ejemplos.svg)


    Calcule y simplifique las operaciones $\sqrt{3} \cdot \sqrt{12}$, $\sqrt[3]{4} \cdot \sqrt[3]{2}$ y $(2\sqrt{5}) \cdot (3\sqrt{5})$.'
  pasos:
  - 'Paso 1: Evaluar $\sqrt{3} \cdot \sqrt{12}$: Mismo índice $2$. Multiplicar radicandos: $\sqrt{3 \cdot 12} = \sqrt{36} = 6$.'
  - 'Paso 2: Evaluar $\sqrt[3]{4} \cdot \sqrt[3]{2}$: Mismo índice $3$. Multiplicar radicandos: $\sqrt[3]{4 \cdot 2} = \sqrt[3]{8} = 2$.'
  - 'Paso 3: Evaluar $(2\sqrt{5}) \cdot (3\sqrt{5})$: Multiplicar coeficientes $(2 \cdot 3 = 6)$ y raíces $(\sqrt{5} \cdot \sqrt{5} = 5) \implies 6 \cdot 5 = 30$.'
  - 'Conclusión: Los resultados son $6$, $2$ y $30$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de $\sqrt{2} \cdot \sqrt{32}$?
  choices:
  - text: $8$ (porque $\sqrt{2 \cdot 32} = \sqrt{64} = 8$)
    is_correct: true
  - text: $\sqrt{34}$
    is_correct: false
  - text: $16$
    is_correct: false
  - text: $4$
    is_correct: false
  explanation: La alternativa correcta es '$8$ (porque $\sqrt{2 \cdot 32} = \sqrt{64} = 8$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $(2\sqrt{5}) \cdot (3\sqrt{5}) = 30$?
  choices:
  - text: Porque $2 \cdot 3 = 6$ y $\sqrt{5} \cdot \sqrt{5} = 5$, dando $6 \cdot 5 = 30$
    is_correct: true
  - text: Porque se suman los números
    is_correct: false
  - text: Porque $\sqrt{5} \cdot \sqrt{5} = 25$
    is_correct: false
  - text: Porque $5 \cdot 5 = 25$ y se multiplica por $6$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $2 \cdot 3 = 6$ y $\sqrt{5} \cdot \sqrt{5} = 5$, dando $6 \cdot 5 = 30$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que todas las raíces compartan el mismo índice $n$.'
- 'Paso 2: Multiplicar los coeficientes numéricos externos entre sí.'
- 'Paso 3: Multiplicar los radicandos dentro de un solo radical de índice $n$ y simplificar el resultado final.'
errores_correccion: '- **Error 1: Multiplicar raíces con distinto índice sin igualar exponentes ($\sqrt{2} \cdot \sqrt[3]{2} = \sqrt{4}$).** **Cómo corregirlo:** Solo se unen bajo una raíz si los índices son idénticos.

  - **Error 2: Sumar los radicandos en vez de multiplicarlos ($\sqrt{3} \cdot \sqrt{5} = \sqrt{8}$).** **Cómo corregirlo:** Se multiplican: $\sqrt{3 \cdot 5} = \sqrt{15}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\sqrt{6} \cdot \sqrt{6}$?
  alternativas:
  - $6$
  - $36$
  - $\sqrt{12}$
  respuesta: $6$
  solucion_pasos:
  - $\sqrt{6 \cdot 6} = \sqrt{36} = 6$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de $\sqrt[3]{9} \cdot \sqrt[3]{3}$?
  alternativas:
  - $3$
  - $9$
  - $\sqrt[3]{12}$
  respuesta: $3$
  solucion_pasos:
  - $\sqrt[3]{9 \cdot 3} = \sqrt[3]{27} = 3$.
- titulo: ¿Es (3√2) · (4√2) igual a 24?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(3 \cdot 4) \cdot (\sqrt{2} \cdot \sqrt{2}) = 12 \cdot 2 = 24$.
  alternativas:
  - texto: Sí, 12 · 2 = 24
    es_correcta: true
    retroalimentacion: ¡Correcto! Multiplicación de coeficientes y raíces.
  - texto: No, es igual a 12√2
    es_correcta: false
    retroalimentacion: Incorrecto, olvidaste multiplicar $\sqrt{2} \cdot \sqrt{2} = 2$.
  - texto: No, es igual a 48
    es_correcta: false
    retroalimentacion: Incorrecto, $12 \cdot 2 = 24$.
- titulo: ¿Es √a · √b igual a √(a + b)?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{a} \cdot \sqrt{b} = \sqrt{a \cdot b}$, los radicandos se multiplican, no se suman.
  alternativas:
  - texto: No, es igual a √(a · b)
    es_correcta: true
    retroalimentacion: ¡Correcto! Ley de producto de radicales.
  - texto: Sí, se suman los radicandos
    es_correcta: false
    retroalimentacion: Incorrecto, la multiplicación genera un producto subradical.
  - texto: Sí, si a y b son positivos
    es_correcta: false
    retroalimentacion: Incorrecto, la igualdad es falsa para cualquier valor no nulo.
errores_frecuentes:
- Sumar radicandos en la multiplicación de raíces.
- Multiplicar los índices radicales entre sí.
- Intentar aplicar la regla directamente a raíces con distinto índice.
- Olvidar multiplicar los coeficientes exteriores.
- No simplificar la raíz resultante del producto.
afirmaciones_verdaderas:
- El producto de raíces de igual índice es igual a la raíz del producto de sus radicandos.
- La multiplicación de dos raíces cuadradas iguales devuelve el radicando original ($(\sqrt{a})^2 = a$).
- Los coeficientes exteriores se multiplican de forma independiente al operador radical.
al_terminar_debes_poder: '![Síntesis de multiplicación de raíces](/static/img/nodos/multiplicacion-de-raices-de-igual-indice-resumen.svg)


  QUÉ: Multiplicar y simplificar raíces que comparten el mismo índice radical.


  CÓMO: Conservando el índice común $n$, multiplicando los coeficientes escalares por separado y multiplicando los radicandos bajo un único radical $\sqrt[n]{a \cdot b}$ para su posterior simplificación.'
