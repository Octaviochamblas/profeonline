semantic_id: MAT.ALG.FUNDAMENTOS.CONCEPTO_CONSTANTE
resumen_inicial: 'Una constante algebraica es un símbolo o número que mantiene un valor cuantitativo fijo e inmutable en el contexto de un problema o cálculo determinado.'
explicacion_simple: |
  - A diferencia de una variable (que va cambiando de valor), una **constante** se queda siempre fija.
  - Existen **constantes numéricas explícitas**, como el número $5$, $-\frac{3}{4}$, o el número irracional $\pi \approx 3,14159\dots$
  - También existen **constantes literales** (como la letra $k$ en una fórmula de física), que representan un número fijo pero no especificado de antemano.
  - En la expresión $3x + 7$, el número $7$ es el término constante: no importa cuánto valga $x$, el $7$ no cambia.

  ![Constante Algebraica](/static/img/nodos/concepto-de-constante-algebraica-intro.svg)
explicacion_formal: |
  ### Definición formal
  Una **constante** es un objeto matemático $c \in \mathbb{R}$ cuyo valor permanece invariante bajo cualquier transformación o evaluación de las variables del sistema:

  $$\forall x \in D, \quad \frac{d}{dx}(c) = 0$$

  ### Clasificación de constantes
  1. **Constantes numéricas absolutas:** Valores universales fijos e invariables en cualquier rama matemática:
     $$e \approx 2,71828\dots, \quad \pi \approx 3,14159\dots, \quad \sqrt{2}, \quad 0, \quad 1$$
  2. **Constantes arbitrarias o parámetros:** Símbolos literales ($a, b, c, k$) fijados para un caso particular dentro de una familia de modelos:
     $$f(x) = kx, \quad k = \text{constante de proporcionalidad}$$
  3. **Término independiente:** En un polinomio $P(x) = a_n x^n + \dots + a_1 x + a_0$, el coeficiente $a_0$ es la constante aditiva pura (no contiene a la variable $x$).
definiciones_clave: |
  - **Constante**: Cantidad fija que no cambia su valor durante el análisis o cálculo matemático.
  - **Constante absoluta**: Número universalmente determinado cuyo valor es independiente de cualquier contexto (ej. $\pi$).
  - **Término independiente**: Término de una expresión algebraica que no contiene factores variables.
propiedades_relaciones: |
  - **Derivada nula**: La tasa de variación de una constante respecto a cualquier variable es idénticamente cero ($\Delta c = 0$).
  - **Elemento neutro y absorbente**: Las constantes $0$ y $1$ actúan respectivamente como neutro aditivo ($x + 0 = x$) y neutro multiplicativo ($x \cdot 1 = x$).
ejemplo_guiado:
  enunciado: 'En el polinomio $P(x) = 4x^3 - 2x^2 + 5x - 9$, identifica todos los coeficientes constantes y el término independiente.'
  imagen: '/static/img/nodos/concepto-de-constante-algebraica-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los términos que contienen a la variable $x$: $4x^3, -2x^2, 5x$.'
    - 'Paso 2: Los coeficientes numéricos constantes de dichos términos son **$4$**, **$-2$** y **$5$**.'
    - 'Paso 3: Identificamos el término que no contiene a la variable $x$, que es **$-9$**.'
    - 'Paso 4: Conclusión: El término independiente constante del polinomio es **$-9$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad define fundamentalmente a una constante en comparación con una variable?'
    choices:
      - text: 'Mantiene un valor cuantitativo fijo e invariante a lo largo de todo el cálculo'
        is_correct: true
      - text: 'Debe cambiar de valor cada vez que se evalúa la función'
        is_correct: false
      - text: 'Solo puede tomar valores negativos'
        is_correct: false
      - text: 'Es obligatoriamente una incógnita por despejar'
        is_correct: false
    explanation: 'La alternativa correcta es ''Mantiene un valor cuantitativo fijo e invariante a lo largo de todo el cálculo''. Por definición, las constantes no varían.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la fórmula de la energía cinética $E_k = \frac{1}{2} m v^2$, ¿cuál de los siguientes elementos es una constante numérica absoluta?'
    choices:
      - text: '$\frac{1}{2}$'
        is_correct: true
      - text: '$v$ (velocidad)'
        is_correct: false
      - text: '$E_k$ (energía)'
        is_correct: false
      - text: 'El exponente 2 aplicado a $m$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$\frac{1}{2}$''. Es el coeficiente numérico constante invariable de la fórmula.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar la expresión algebraica o fórmula matemática.'
  - 'Paso 2: Identificar las variables dinámicas del modelo ($x, y, t$).'
  - 'Paso 3: Aislar los números fijos y símbolos literales que no varían con las variables ($a, b, k, \pi$).'
  - 'Paso 4: Distinguir entre coeficientes que multiplican a variables y términos independientes puros.'
errores_correccion: |
  - **Error 1:** Tratar a una constante paramétrica $k$ como una variable al derivar o simplificar. **Cómo corregirlo:** Si $k$ es constante, se trata **exactamente igual que un número fijo** como el $5$.
  - **Error 2:** Omitir el signo negativo del término independiente. **Cómo corregirlo:** En $3x - 8$, el término independiente constante es **$-8$**, incluyendo su signo.
ejemplos:
  - titulo: 'Término independiente en función lineal'
    enunciado: 'En la ecuación de la recta $y = 3x - 11$, ¿cuál es el valor de la constante aditiva (término independiente)?'
    alternativas:
      - '$-11$'
      - '$11$'
      - '$3$'
    respuesta: '$-11$'
    solucion_pasos:
      - '1. El término independiente no está acompañado de la variable $x$.'
      - '2. Conservando el signo de la resta, el valor constante es $-11$.'
  - titulo: 'Constante universal en geometría'
    enunciado: '¿Cuál de los siguientes símbolos representa una constante matemática universal fija?'
    alternativas:
      - '$\pi$'
      - '$x$'
      - '$y$'
    respuesta: '$\pi$'
    solucion_pasos:
      - '1. $\pi$ representa la razón fija entre el perímetro y diámetro de cualquier círculo ($\,\approx 3,14159\dots$).'
      - '2. $x$ e $y$ son variables.'
  - titulo: 'Invarianza de las constantes'
    enunciado: '¿Permanece constante el valor de una constante numérica cuando la variable $x$ de una función cambia de valor?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Por definición, las constantes no dependen del valor de las variables.'
      - '2. Permanecen invariantes.'
  - titulo: 'Naturaleza de los coeficientes'
    enunciado: '¿Es el coeficiente numérico $5$ en el monomio $5x^2$ una variable que cambia según el valor de $x$?'
    respuesta: 'No'
    solucion_pasos:
      - '1. El número $5$ es un factor constante fijo multiplicador.'
      - '2. Solo la potencia $x^2$ varía.'
errores_frecuentes:
  - 'Olvidar el signo negativo al identificar el término independiente de un polinomio.'
  - 'Tratar los coeficientes constantes como si fueran variables adicionales de la función.'
  - 'Modificar el valor de una constante arbitraria en medio del proceso algebraico de resolución.'
  - 'Confundir una constante absoluta universal como $\pi$ con una variable libre desconocida.'
  - 'Creer que un término independiente es cero cuando no está escrito al final de la expresión.'
afirmaciones_verdaderas:
  - 'Una constante algebraica mantiene un valor numérico fijo e invariante durante todo el cálculo.'
  - 'En todo polinomio, el término independiente es aquel que no contiene a la variable.'
al_terminar_debes_poder: |
  ![Resumen de Constante Algebraica](/static/img/nodos/concepto-de-constante-algebraica-resumen.svg)

  QUÉ: Identificar, clasificar y operar con constantes numéricas y literales, diferenciándolas de las variables y reconociendo términos independientes.
  CÓMO: Aislando los factores y términos invariantes ($c \in \mathbb{R}, \pi$) en polinomios y fórmulas como $P(x) = 4x^3 - 2x^2 + 5x - 9$.
