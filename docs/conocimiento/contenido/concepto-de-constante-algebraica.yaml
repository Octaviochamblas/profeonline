semantic_id: MAT.ALG.FUNDAMENTOS.CONCEPTO_CONSTANTE
resumen_inicial: 'Concepto de constante algebraica: concepto y propiedades en Fundamentos
  y notación algebraica.'
explicacion_simple: En el teatro de las matemáticas, algunos actores cambian de disfraz
  en cada obra (las variables), pero otros siempre interpretan el mismo papel, pase
  lo que pase.
explicacion_formal: '### Definición formal


  Una constante no muta. Es la roca fija alrededor de la cual el resto de las variables
  (los ríos) fluyen y cambian.


  ### Desarrollo didáctico


  A diferencia de las variables (usualmente $x$, $y$, $z$) que están esperando que
  les asignes un valor, las constantes nacen con su valor definido.

  En la fórmula del perímetro de una circunferencia $P = 2 \cdot \pi \cdot r$:

  - El $2$ es una constante numérica. Jamás dejará de ser dos.

  - $\pi$ es una constante (aprox. 3.14159.).

  - La $r$ (radio) es la variable, porque puedes tener círculos grandes o pequeños.


  En la expresión genérica $ax^2 + bx + c$, por convención matemática, asumimos que
  $a, b, c$ son constantes (números fijos que rellenaremos luego) y la $x$ es la única
  variable que mutará.'
definiciones_clave: '- **Concepto de constante algebraica**: Elemento fundamental
  del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Concepto de constante algebraica**: Reglas
