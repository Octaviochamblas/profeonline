resumen_inicial: Una constante algebraica es un valor numérico fijo que no cambia
  su magnitud durante todo el desarrollo de una operación o problema determinado.
explicacion_simple: 'Una constante es lo opuesto a una variable: es un número o símbolo
  que tiene un valor fijo e inmutable. Números como $5$, $-8$ o $\frac{3}{4}$ son
  constantes numéricas explícitas. Símbolos como $\pi$ ($3{,}14159\dots$) o la velocidad
  de la luz $c$ son constantes universales cuyo valor no varía jamás.'
explicacion_formal: 'Sea $c \in \mathbb{R}$ un escalar fijo. Una **Constante Algebraica**
  es un elemento cuya derivada funcional respecto a cualquier variable es nula:


  $$\forall x \in X, \quad \frac{\partial c}{\partial x} = 0$$


  > **Complemento didáctico:** Las constantes fijan la escala y los puntos de referencia
  fijos dentro de las transformaciones algebraicas.'
definiciones_clave: '- **Constante numérica**: Número real explícito ($5, -2, 3/4$).

  - **Constante universal / matemática**: Símbolo de valor fijo e inalterable ($\pi,
  e$).'
propiedades_relaciones: '- **Invarianza**: El valor de una constante no depende de
  las variables presentes en la expresión.'
ejemplo_guiado:
  enunciado: En la fórmula del perímetro de una circunferencia $P = 2 \pi r$, identifique
    las constantes y la variable.
  pasos:
  - 'Paso 1: Identificar los números explícitos: el número $2$ es una constante numérica
    fija.'
  - 'Paso 2: Identificar el símbolo constante universal: $\pi \approx 3{,}14159\dots$
    es constante.'
  - 'Paso 3: Identificar la letra variable: $r$ (el radio puede variar de una circunferencia
    a otra).'
  - 'Conclusión: Las constantes son $2$ y $\pi$, mientras que $r$ es la variable.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué define formalmente a una constante algebraica en una expresión?
  choices:
  - text: Es un valor numérico o escalar fijo que permanece inalterable durante el
      cálculo
    is_correct: true
  - text: Es una letra que cambia de valor continuamente
    is_correct: false
  - text: Es el resultado de sumar todas las variables
    is_correct: false
  - text: Es un exponente negativo obligatorio
    is_correct: false
  explanation: La alternativa correcta es 'Es un valor numérico o escalar fijo que
    permanece inalterable durante el cálculo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para P = 2 * pi * r, ¿cuáles fueron las constantes
    del sistema?
  choices:
  - text: El número 2 y el símbolo pi
    is_correct: true
  - text: Únicamente la letra r
    is_correct: false
  - text: El perímetro P y el radio r
    is_correct: false
  - text: Ninguna constante
    is_correct: false
  explanation: La alternativa correcta es 'El número 2 y el símbolo pi'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los números enteros, decimales o fraccionarios explícitos de
  la expresión.'
- 'Paso 2: Identificar los símbolos matemáticos universales de valor fijo ($\pi, e$).'
- 'Paso 3: Declarar dichos elementos como constantes algebraicas.'
errores_correccion: '- **Error 1: Declarar que $\pi$ es una variable porque se escribe
  como una letra griega.** **Cómo corregirlo:** $\pi$ es el símbolo de una constante
  universal de valor inmutable ($3{,}14159\dots$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes elementos representa una constante universal
    en matemática?
  alternativas:
  - pi
  - x
  - y
  - z
  respuesta: pi
  solucion_pasos:
  - 1. pi representa el valor fijo e inmutable 3,14159... Es una constante universal.
- titulo: Ejemplo 2
  enunciado: En la expresión 7x^2 - 4, ¿cuáles son las constantes numéricas?
  alternativas:
  - 7 y -4
  - x
  - '2'
  - x y 2
  respuesta: 7 y -4
  solucion_pasos:
  - 1. 7 es la constante coeficiente y -4 es la constante del término independiente.
- titulo: ¿Permanecen inalterados los valores de las constantes numéricas al evaluar
    un polinomio en diferentes valores de x?
  respuesta: Sí
  solucion_pasos:
  - Sí, las constantes no varían al cambiar los valores de las variables.
- titulo: ¿Varía el número 5 en la expresión 5x cuando x cambia de 2 a 10?
  respuesta: 'No'
  solucion_pasos:
  - No, el coeficiente 5 es constante y permanece igual; sólo cambia el valor de la
    variable x.
errores_frecuentes:
- Declarar constantes representadas por letras griegas (como pi) con variables literales
  ordinarias.
- Declarar que las constantes cambian de valor cuando cambia la variable del polinomio.
- Declarar que una constante no puede llevar signo negativo.
- Omitir las constantes numéricas al analizar la estructura de un término.
- Declarar la constante de un término con el grado del exponente.
afirmaciones_verdaderas:
- Una constante es un valor numérico escalar inmutable que no varía en el cálculo.
- Símbolos como pi o e representan constantes universales de valor fijo.
al_terminar_debes_poder: Al terminar serás capaz de identificar y clasificar constantes
  numéricas y universales en expresiones algebraicas.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Fundamentos.
estado: publicado
