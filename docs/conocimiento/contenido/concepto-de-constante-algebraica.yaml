procedimiento:
- 'Paso 1: Identifica los números explícitos o constantes universales (como pi o e).'
- 'Paso 2: Según el contexto del problema, identifica letras de inicio del abecedario
  (a, b, k) que funcionen como parámetros fijos.'
- 'Paso 3: Distínguelas de las letras finales (x, y, z) o variables que cambian su
  valor dinámicamente.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar concepto de constante algebraica.
ejemplos:
- titulo: El elenco de la fórmula
  enunciado: En la fórmula física de la velocidad en caída libre v = g*t (donde g
    es la gravedad de la Tierra y t el tiempo), identifica la constante y la variable.
  solucion_pasos:
  - La gravedad de la Tierra 'g' no cambia, es un valor fijo (9.8 m/s^2). Es la constante.
  - El tiempo 't' fluye y cambia constantemente. Es la variable.
  - La velocidad 'v' cambia dependiendo de 't', por lo que también es variable.
- titulo: Un programador diseña un algoritmo para calcular el costo de un viaje en
    taxi. Escribe el mo
  enunciado: 'Un programador diseña un algoritmo para calcular el costo de un viaje
    en taxi. Escribe el modelo: $Costo = BajadaDeBandera + (PrecioPorKm \cdot KmRecorridos)$.
    Para una ciudad particular donde las tarifas están reguladas por ley y no cambian,
    ¿qué elementos del modelo deben ser declarados como ''constantes'' en el código?
    (v1)


    Opciones: A) La Bajada de Bandera y el Precio por Km. · B) Únicamente los Kilómetros
    Recorridos. · C) El Costo Total y los Kilómetros Recorridos. · D) Todas las letras
    son variables por definición en un programa.'
  solucion_pasos:
  - La tarifa de inicio y el costo por kilómetro son fijos para la ciudad (son las
    reglas del juego). Lo único que varía entre un pasajero y otro son los kilómetros
    recorridos (variable independiente) y el costo final (variable dependiente).
  - 'Respuesta: La Bajada de Bandera y el Precio por Km.'
- titulo: 'Respecto de «Concepto de constante algebraica»: ¿Describe adecuadamente
    el concepto esta fra'
  enunciado: 'Respecto de «Concepto de constante algebraica»: ¿Describe adecuadamente
    el concepto esta frase? «Una **Constante** es un valor fijo que no cambia bajo
    ninguna circunstancia dentro de un problema»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una **Constante** es un valor
    fijo que no cambia bajo ninguna circunstancia dentro de un problema.'
- titulo: 'Respecto de «Concepto de constante algebraica»: ¿Se puede aceptar esta
    afirmación? «Creer qu'
  enunciado: 'Respecto de «Concepto de constante algebraica»: ¿Se puede aceptar esta
    afirmación? «Creer que todas las letras son variables por el simple hecho de ser
    letras. A veces usamos letras para guardar números constantes»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una **Constante** es un valor
    fijo que no cambia bajo ninguna circunstancia dentro de un problema.'
errores_frecuentes:
- Creer que todas las letras son variables por el simple hecho de ser letras. A veces
  usamos letras para guardar números constantes.
- Confundir constante con coeficiente. El coeficiente es un tipo específico de constante
  que multiplica a una variable.
- La constante siempre se representa con un número y jamás puede ser representada
  con una letra.
- La constante debe ser obligatoriamente un número positivo, mientras la variable
  puede ser negativa.
- La constante es el resultado final de la ecuación.
afirmaciones_verdaderas:
- La notación de concepto de constante algebraica sigue las convenciones del lenguaje
  algebraico.
