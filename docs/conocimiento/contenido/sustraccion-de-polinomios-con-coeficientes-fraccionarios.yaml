semantic_id: MAT.ALG.SUSTRACCION_POL.COEFICIENTES_FRACCIONARIOS
resumen_inicial: 'Sustracción de polinomios con coeficientes fraccionarios: procedimiento
  y reglas en Sustracción de polinomios.'
explicacion_simple: 'La resta de polinomios con fracciones combina dos habilidades:
  la inversión de signos del sustraendo y la operatoria con fracciones. Bien ordenadas,
  ambas son completamente manejables.'
explicacion_formal: '### Definición formal


  La resta siempre se convierte en suma del opuesto primero.


  ### Desarrollo didáctico


  Resta: $(\frac{3}{4}x + \frac{1}{2}) - (\frac{1}{4}x - \frac{1}{3})$.


  Convertimos en suma del opuesto:

  $(\frac{3}{4}x + \frac{1}{2}) + (-\frac{1}{4}x + \frac{1}{3})$.


  Familia $x$: $\frac{3}{4} - \frac{1}{4} = \frac{2}{4} = \frac{1}{2}$.

  Constantes: $\frac{1}{2} + \frac{1}{3} = \frac{3}{6} + \frac{2}{6} = \frac{5}{6}$.


  Resultado: $\frac{1}{2}x + \frac{5}{6}$.'
definiciones_clave: '- **Sustracción de polinomios con coeficientes fraccionarios**:
  Operación o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a sustracción de polinomios con coeficientes fraccionarios.'
ejemplo_guiado:
  enunciado: Aplica sustracción de polinomios con coeficientes fraccionarios en una
    expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de sustracción de polinomios
    con coeficientes fraccionarios.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
