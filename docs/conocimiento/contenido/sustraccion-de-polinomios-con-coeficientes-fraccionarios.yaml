semantic_id: MAT.ALG.SUSTRACCION_POL.COEFICIENTES_FRACCIONARIOS
resumen_inicial: La sustracción de polinomios con coeficientes fraccionarios consiste en restar expresiones polinómicas racionales cambiando el signo a las fracciones del sustraendo y calculando el MCM por clase.
explicacion_simple: "Para restar dos polinomios que contienen **coeficientes en forma de fracción**:\n- **Paso 1**: Cambia el signo de **TODOS los coeficientes fraccionarios del sustraendo**.\n- **Paso 2**: Agrupa los coeficientes fraccionarios de cada clase de término semejante.\n- **Paso 3**: Calcula el **mínimo común múltiplo (MCM)** de los denominadores en cada clase.\n- **Paso 4**: Amplifica, resta o suma los numeradores y simplifica la fracción final.\n- **Ejemplo**: Restar $\\left(\\frac{3}{4}x + 2\\right) - \\left(\\frac{1}{4}x - \\frac{1}{2}\\right)$:\n  - Cambiamos signos al sustraendo: $-\\frac{1}{4}x + \\frac{1}{2}$.\n  - Clase $x$: $\\frac{3}{4} - \\frac{1}{4} = \\frac{2}{4} = \\mathbf{\\frac{1}{2}x}$.\n  - Constantes: $+2 + \\frac{1}{2} = \\frac{4}{2} + \\frac{1}{2} = \\mathbf{+\\frac{5}{2}}$.\n  - Resultado final: **$\\frac{1}{2}x + \\frac{5}{2}$**.\n\n![Sustracción con Coeficientes Fraccionarios](/static/img/nodos/sustraccion-de-polinomios-con-coeficientes-fraccionarios-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $P(x) = \sum \frac{a_i}{b_i} x^i$ y $Q(x) = \sum \frac{c_i}{d_i} x^i$ dos polinomios en $\mathbb{Q}[x]$. La **sustracción polinómica racional** combina la inversión aditiva del sustraendo con el cálculo del denominador común $D_k = \operatorname{mcm}(b_k, d_k)$ para cada grado $k$:


  $$(P - Q)(x) = \sum_{k=0}^{\max(n,m)} \left( \frac{a_k \cdot \frac{D_k}{b_k} - c_k \cdot \frac{D_k}{d_k}}{D_k} \right) x^k$$


  ### Normalización de Coeficientes en $\mathbb{Q}$

  Cada resta de fracciones resultante se simplifica mediante su máximo común divisor para presentar el coeficiente en su mínima expresión racional.


  ### Síntesis didáctica

  La resta de polinomios racionales integra la regla de distribución de signos con el cálculo operacional del mínimo común múltiplo.

  '
definiciones_clave: '- **Sustracción polinómica racional**: Resta de expresiones algebraicas con coeficientes en el cuerpo de los números racionales $\mathbb{Q}$.

  - **Inversión fraccionaria**: Cambio de signo aplicado a las fracciones del polinomio sustraendo.

  - **MCM por clase de grado**: Homogeneización de denominadores restringida exclusivamente a cada columna de términos semejantes.

  '
propiedades_relaciones: '- **Independencia de denominadores entre clases**: La fracción del término de grado 2 se homogeneiza sin afectar la fracción del término de grado 1.

  - **Compatibilidad con enteros**: Un número entero $c$ se expresa como $\frac{c}{1}$ al restarse con coeficientes fraccionarios.

  '
ejemplo_guiado:
  enunciado: Resta los polinomios $P = \frac{4}{5}x^2 - \frac{1}{3}x + 2$ y $Q = \frac{1}{5}x^2 + \frac{1}{6}x - \frac{1}{2}$.
  pasos:
  - 'Paso 1: Escribimos el opuesto del sustraendo $Q$: $-\frac{1}{5}x^2 - \frac{1}{6}x + \frac{1}{2}$.'
  - 'Paso 2: Operamos la Clase $x^2$: $\left(\frac{4}{5} - \frac{1}{5}\right)x^2 = \frac{3}{5}x^2$.'
  - 'Paso 3: Operamos la Clase $x$: $\left(-\frac{1}{3} - \frac{1}{6}\right)x$. - $\operatorname{mcm}(3, 6) = 6 \implies -\frac{2}{6} - \frac{1}{6} = -\frac{3}{6}x = -\frac{1}{2}x$.'
  - 'Paso 4: Operamos las Constantes: $2 + \frac{1}{2} = \frac{4}{2} + \frac{1}{2} = +\frac{5}{2}$.'
  - 'Paso 5: Consolidamos el polinomio resultante: $\frac{3}{5}x^2 - \frac{1}{2}x + \frac{5}{2}$.'
  - 'Conclusión: El polinomio diferencia es **$\frac{3}{5}x^2 - \frac{1}{2}x + \frac{5}{2}$**.'
  imagen: /static/img/nodos/sustraccion-de-polinomios-con-coeficientes-fraccionarios-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué dos operaciones clave se deben combinar para realizar la sustracción de polinomios con coeficientes fraccionarios?
  choices:
  - text: Cambiar los signos a las fracciones del sustraendo y calcular el MCM de los denominadores por cada clase semejante
    is_correct: true
  - text: Multiplicar las fracciones del minuendo por las del sustraendo
    is_correct: false
  - text: Sumar directamente todos los denominadores
    is_correct: false
  - text: Eliminar las fracciones y trabajar solo con los numeradores
    is_correct: false
  explanation: La alternativa correcta es 'Cambiar los signos a las fracciones del sustraendo y calcular el MCM de los denominadores por cada clase semejante'. Inversión del sustraendo + MCM por clase.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de restar $\left(\frac{2}{3}x + 1\right) - \left(\frac{1}{3}x - \frac{1}{2}\right)$?
  choices:
  - text: El resultado es $\frac{1}{3}x + \frac{3}{2}$, al cambiar signos a $-\frac{1}{3}x + \frac{1}{2}$ y operar $1 + 1/2 = 3/2$
    is_correct: true
  - text: El resultado es $\frac{1}{3}x + \frac{1}{2}$
    is_correct: false
  - text: El resultado es $\frac{3}{3}x - \frac{1}{2}$
    is_correct: false
  - text: El resultado es $\frac{1}{3}x - \frac{3}{2}$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $\frac{1}{3}x + \frac{3}{2}$, al cambiar signos a $-\frac{1}{3}x + \frac{1}{2}$ y operar $1 + 1/2 = 3/2$'. $\frac{2-1}{3}x + \frac{2+1}{2} = \frac{1}{3}x + \frac{3}{2}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el polinomio minuendo y a continuación el sustraendo invirtiendo los signos de cada fracción.'
- 'Paso 2: Reagrupar las fracciones resultantes según el factor literal de sus términos semejantes.'
- 'Paso 3: Determinar el MCM de los denominadores para cada clase independiente.'
- 'Paso 4: Operar los numeradores, simplificar cada coeficiente fraccionario e integrar el polinomio final.'
errores_correccion: '- **Error 1:** Excluir la inversión de signo a la fracción constante del sustraendo (escribir $-\left(\frac{1}{2}x - \frac{1}{3}\right) = -\frac{1}{2}x - \frac{1}{3}$). **Cómo corregirlo:** La inversión **CAMBIA TODOS LOS SIGNOS ($-\frac{1}{2}x + \frac{1}{3}$)**.

  - **Error 2:** Restar los denominadores de las fracciones al reducir una clase (escribir $\frac{5}{8}x - \frac{1}{4}x = \frac{3}{4}x$). **Cómo corregirlo:** Los denominadores **NO SE RESTAN; se busca MCM ($\frac{5}{8} - \frac{2}{8} = \frac{3}{8}x$)**.

  '
ejemplos:
- titulo: Resta de fracciones con igual denominador
  enunciado: ¿Cuál es el resultado de $\left(\frac{7}{9}a + 4\right) - \left(\frac{2}{9}a + 1\right)$?
  alternativas:
  - $\frac{5}{9}a + 3$
  - $\frac{5}{0}a + 3$
  - $\frac{9}{9}a + 5$
  respuesta: $\frac{5}{9}a + 3$
  solucion_pasos:
  - '1. Opuesto: $-\frac{2}{9}a - 1$.'
  - '2. Resta: $\frac{7-2}{9}a = \frac{5}{9}a$.'
  - '3. Constantes: $4 - 1 = 3$.'
  - '4. Resultado: $\frac{5}{9}a + 3$.'
- titulo: Entero menos fracción
  enunciado: ¿Cuál es el resultado de $x - \left(\frac{1}{4}x + 2\right)$?
  alternativas:
  - $\frac{3}{4}x - 2$
  - $\frac{1}{4}x - 2$
  - $\frac{5}{4}x + 2$
  respuesta: $\frac{3}{4}x - 2$
  solucion_pasos:
  - 1. $1x = \frac{4}{4}x$.
  - '2. Resta: $\frac{4}{4} - \frac{1}{4} = \frac{3}{4}x - 2$.'
- titulo: Inversión de fracción negativa
  enunciado: Al restar $-\left(-\frac{2}{3}x\right)$, ¿se convierte el término en $+\frac{2}{3}x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, menos por menos da más.
- titulo: Conservación de exponente
  enunciado: En la resta $\frac{3}{5}x^3 - \frac{1}{5}x^3 = \frac{2}{5}x^3$, ¿permanece el exponente $3$ inalterado?
  respuesta: Sí
  solucion_pasos:
  - Sí, el factor literal no se modifica al restar coeficientes.
errores_frecuentes:
- Restar directamente los denominadores entre sí al simplificar coeficientes de la misma clase.
- La inversión del signo de las fracciones secundarias dentro del polinomio sustraendo no se ejecuta.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Buscar un único MCM para denominadores correspondientes a potencias o variables distintas.
- Multiplicar las fracciones en lugar de restarlas.
afirmaciones_verdaderas:
- La sustracción de polinomios con coeficientes fraccionarios requiere cambiar el signo al sustraendo y operar por MCM cada clase.
- Los denominadores de las fracciones no se restan entre sí; se homogeneizan mediante el mínimo común múltiplo.
