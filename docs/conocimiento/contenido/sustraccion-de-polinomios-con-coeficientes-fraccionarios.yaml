resumen_inicial: La sustracción de polinomios con coeficientes fraccionarios aplica
  las reglas formales de la sustracción e inversión de signos en expresiones polinómicas.
explicacion_simple: Al trabajar con sustracción de polinomios con coeficientes fraccionarios,
  aseguramos cambiar correctamente los signos de todos los términos restados para
  obtener el resultado simplificado exacto.
explicacion_formal: 'Dados polinomios con la estructura dada, la **Sustracción de
  polinomios con coeficientes fraccionarios** establece:


  $$\text{"la resta (3/4 x - 1/2 y) - (1/4 x + 1/6 y)"} \implies (1/2)x - (2/3)y$$


  > **Complemento didáctico:** La formalización rigurosa previene equivocaciones estructurales
  al operar con inversos aditivos.'
definiciones_clave: '- **Sustracción de polinomios con coeficientes fraccionarios**:
  Aplicación exacta de las reglas de resta y supresión de signos sobre polinomios.'
propiedades_relaciones: '- **Distributividad del signo menos**: El operador $-$ afecta
  individualmente a cada sumando del bloque.'
ejemplo_guiado:
  enunciado: 'Efectúe la sustracción de polinomios con coeficientes fraccionarios
    para: ''la resta (3/4 x - 1/2 y) - (1/4 x + 1/6 y)''.'
  pasos:
  - 'Paso 1: Identificar el sustraendo o los términos a restar.'
  - 'Paso 2: Invertir el signo de todos los elementos involucrados.'
  - 'Paso 3: Reducir los términos semejantes.'
  - 'Conclusión: El resultado es (1/2)x - (2/3)y.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar sustracción de polinomios con coeficientes
    fraccionarios a 'la resta (3/4 x - 1/2 y) - (1/4 x + 1/6 y)'?
  choices:
  - text: (1/2)x - (2/3)y
    is_correct: true
  - text: (1/2)x - (1/3)y
    is_correct: false
  - text: (2/4)x + y
    is_correct: false
  - text: (1/4)x
    is_correct: false
  explanation: La alternativa correcta es '(1/2)x - (2/3)y'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'la resta (3/4 x - 1/2 y) - (1/4 x + 1/6 y)',
    ¿qué expresión reducida se obtuvo?
  choices:
  - text: (1/2)x - (2/3)y
    is_correct: true
  - text: (1/2)x - (1/3)y
    is_correct: false
  - text: (2/4)x + y
    is_correct: false
  - text: (1/4)x
    is_correct: false
  explanation: La alternativa correcta es '(1/2)x - (2/3)y'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar paréntesis al sustraendo.'
- 'Paso 2: Distribuir el signo menos invirtiendo cada signo.'
- 'Paso 3: Agrupar y reducir términos semejantes.'
errores_correccion: '- **Error 1: Invertir sólo parte de los signos en sustracción
  de polinomios con coeficientes fraccionarios.** **Cómo corregirlo:** Cambiar obligatoriamente
  los signos de todos los términos contenidos en el sustraendo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la solución correcta para sustracción de polinomios con coeficientes
    fraccionarios en 'la resta (3/4 x - 1/2 y) - (1/4 x + 1/6 y)'?
  alternativas:
  - (1/2)x - (2/3)y
  - (1/2)x - (1/3)y
  - (2/4)x + y
  - (1/4)x
  respuesta: (1/2)x - (2/3)y
  solucion_pasos:
  - 1. Aplicar la inversión de signos.
  - 2. Obtener (1/2)x - (2/3)y.
- titulo: Ejemplo 2
  enunciado: Al simplificar 'la resta (3/4 x - 1/2 y) - (1/4 x + 1/6 y)' por sustracción
    de polinomios con coeficientes fraccionarios, ¿qué resultado se obtiene?
  alternativas:
  - (1/2)x - (2/3)y
  - (1/2)x - (1/3)y
  - (2/4)x + y
  - (1/4)x
  respuesta: (1/2)x - (2/3)y
  solucion_pasos:
  - 1. Operar los coeficientes resultantes.
  - 2. Concluir (1/2)x - (2/3)y.
- titulo: ¿Es el resultado de la sustracción en 'la resta (3/4 x - 1/2 y) - (1/4 x
    + 1/6 y)' igual a (1/2)x - (2/3)y?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando el cambio de signos se obtiene (1/2)x - (2/3)y.
- titulo: ¿Da la resta en 'la resta (3/4 x - 1/2 y) - (1/4 x + 1/6 y)' una diferencia
    igual a (1/2)x - (1/3)y?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es (1/2)x - (2/3)y.
errores_frecuentes:
- Omitir la inversión de signo en términos secundarios en sustracción de polinomios
  con coeficientes fraccionarios.
- Sumar los exponentes al restar términos en sustracción de polinomios con coeficientes
  fraccionarios.
- Omitir encfallar el sustraendo entre paréntesis en sustracción de polinomios con
  coeficientes fraccionarios.
- Declarar el inverso aditivo de un polinomio con su recíproco multiplicativo.
- Declarar que restar un término negativo da como resultado un valor negativo.
afirmaciones_verdaderas:
- La sustracción de polinomios con coeficientes fraccionarios exige la distribución
  completa del signo negativo sobre todo el sustraendo.
- El inverso aditivo de un polinomio se forma cambiando el signo a cada uno de sus
  términos.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la sustracción de polinomios
  con coeficientes fraccionarios aplicando rigurosamente la regla del inverso aditivo
  sobre los términos restados.
