procedimiento:
- 'Paso 1: Invierte el signo de cada término del sustraendo (convierte la resta en
  suma).'
- 'Paso 2: Agrupa por familias de términos semejantes.'
- 'Paso 3: Para cada familia, suma o resta las fracciones con denominador común.'
- 'Paso 4: Simplifica las fracciones del resultado si es posible.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en sustracción de polinomios con coeficientes fraccionarios.
ejemplos:
- titulo: Fracciones de restar
  enunciado: 'Calcula: (2/3)a - (1/6)a.'
  solucion_pasos:
  - 'Suma del opuesto: (2/3)a + (-1/6)a.'
  - MCD de 3 y 6 es 6.
  - 2/3 = 4/6.
  - 4/6 - 1/6 = 3/6 = 1/2.
  - 'Resultado: (1/2)a.'
- titulo: Una receta requiere $\frac{3}{4}$ kg de harina del tipo A. Ya se usaron
    $\frac{1}{3}$ kg. ¿C
  enunciado: 'Una receta requiere $\frac{3}{4}$ kg de harina del tipo A. Ya se usaron
    $\frac{1}{3}$ kg. ¿Cuánto queda por agregar? (v1)


    Opciones: A) $\frac{5}{12}$ kg · B) $\frac{2}{1}$ kg · C) $\frac{2}{7}$ kg · D)
    $\frac{1}{6}$ kg'
  solucion_pasos:
  - 'MCD de 4 y 3 es 12. $\frac{3}{4}=\frac{9}{12}$, $\frac{1}{3}=\frac{4}{12}$. Resta:
    $\frac{9-4}{12}=\frac{5}{12}$.'
  - 'Respuesta: $\frac{5}{12}$ kg'
- titulo: 'Respecto de «Sustracción de polinomios con coeficientes fraccionarios»:
    ¿Se ajusta a la defi'
  enunciado: 'Respecto de «Sustracción de polinomios con coeficientes fraccionarios»:
    ¿Se ajusta a la definición esta afirmación? «En la **Sustracción con Coeficientes
    Fraccionarios**, primero se transforma la resta en suma del opuesto (invirtiendo
    signos del sustraendo), y luego se suman los coeficientes fraccionarios de cada
    familia usando denominador común»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: En la **Sustracción con Coeficientes
    Fraccionarios**, primero se transforma la resta en suma del opuesto (invirtiendo
    signos del sustraendo), y luego se suman los coeficientes fraccionarios de cada
    familia usando denominador común.'
- titulo: 'Respecto de «Sustracción de polinomios con coeficientes fraccionarios»:
    ¿Es compatible con e'
  enunciado: 'Respecto de «Sustracción de polinomios con coeficientes fraccionarios»:
    ¿Es compatible con el procedimiento esta afirmación? «Olvidar invertir el signo
    del sustraendo antes de sumar las fracciones»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: En la **Sustracción con Coeficientes
    Fraccionarios**, primero se transforma la resta en suma del opuesto (invirtiendo
    signos del sustraendo), y luego se suman los coeficientes fraccionarios de cada
    familia usando denominador común.'
errores_frecuentes:
- Olvidar invertir el signo del sustraendo antes de sumar las fracciones.
- Operar las fracciones sin buscar el denominador común.
- Para «Al calcular $(\frac{3}{5})m - (\frac{1}{5})m$, ¿cuál es el primer paso? (v1)»,
  la respuesta correcta es Multiplicar numeradores y denominadores.
- 'Restar directamente: $\frac{3-1}{5-5} = \frac{2}{0}$.'
- Para «Al calcular $(\frac{3}{5})m - (\frac{1}{5})m$, ¿cuál es el primer paso? (v1)»,
  la respuesta correcta es Elevar al cuadrado ambas fracciones.
afirmaciones_verdaderas:
- La reducción en sustracción de polinomios con coeficientes fraccionarios conserva
  los exponentes de la parte literal.
al_terminar_debes_poder: Operar y reducir expresiones algebraicas utilizando sustracción
  de polinomios con coeficientes fraccionarios.
