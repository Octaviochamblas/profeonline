semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.POTENCIA_DE_BASE_LOGARITMICA
resumen_inicial: Una potencia cuya base coincide exactamente con la base del logaritmo
  en su exponente se simplifica directamente al argumento del logaritmo ($b^{\log_b(x)}
  = x$ para $x > 0$).
explicacion_simple: 'Como elevar a una base $b$ y calcular el logaritmo en base $b$
  son operaciones completamente opuestas, se cancelan mutuamente de forma instantánea:

  $$10^{\log(7)} = 7$$

  $$2^{\log_2(15)} = 15$$

  La base y el logaritmo desaparecen dejando solo el argumento.'
explicacion_formal: 'Dadas las funciones mutuamente inversas $f(x) = b^x$ y $f^{-1}(x)
  = \log_b(x)$ con $b > 0, b \neq 1$, la composición $(f \circ f^{-1})(x) = f(f^{-1}(x))$
  produce la identidad:

  $$b^{\log_b(x)} = x \quad \forall x > 0$$'
definiciones_clave: '- **Cancelación exponencial-logarítmica**: Propiedad de identidad
  de funciones inversas compuestas.'
propiedades_relaciones: '- **Resultado directo**: La expresión completa se reduce
  exactamente al valor del argumento $x$.'
ejemplo_guiado:
  enunciado: Calcula el valor de la expresión $E = 5^{\log_5(18)} + e^{\ln(4)}$.
  pasos:
  - 'Aplicar $b^{\log_b(x)} = x$ al primer término: $5^{\log_5(18)} = 18$.'
  - 'Aplicar la misma propiedad al segundo término: $e^{\ln(4)} = 4$.'
  - 'Sumar los resultados: $18 + 4 = 22$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la expresión $3^{\log_3(25)}$?
  choices:
  - text: '25'
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '75'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: 'La correcta es: 25. Por propiedad de cancelación $b^{\log_b(x)} =
    x$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el valor de $10^{\log(9)}$.
  choices:
  - text: '9'
    is_correct: true
  - text: '10'
    is_correct: false
  - text: '90'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: 'La correcta es: 9. Recuerda que $\log$ sin base escrita es base 10.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la base de la potencia principal coincida con la base del
  logaritmo en el exponente.'
- 'Paso 2: Cancelar ambas bases.'
- 'Paso 3: Retornar como resultado final el argumento del logaritmo.'
errores_correccion: No multipliques la base por el argumento. $2^{\log_2(5)}$ no es
  $10$, sino $5$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $7^{\log_7(11)}$.
  alternativas:
  - '11'
  - '7'
  - '77'
  respuesta: '11'
  solucion_pasos:
  - $7^{\log_7(11)} = 11$.
errores_frecuentes:
- Multiplicar la base por el argumento del logaritmo.
afirmaciones_verdaderas:
- $b^{\log_b(x)} = x$ para $x > 0$.
al_terminar_debes_ponder: Simplificar de forma inmediata expresiones del tipo $b^{\log_b(x)}$.
fuente: Texto escolar MINEDUC.
estado: publicado
