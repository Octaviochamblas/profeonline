semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.POTENCIA_DE_BASE_LOGARITMICA
resumen_inicial: 'Una potencia cuya base coincide con la base del logaritmo en el exponente se cancela directamente, dejando solo el argumento: $b^{\log_b(a)} = a$ ($b > 0, b \neq 1, a > 0$).'
explicacion_simple: '![Potencia con base coincidente](/static/img/nodos/potencia-cuya-base-coincide-con-la-base-del-logaritmo-intro.svg)


  Cuando elevas una base $b$ a un logaritmo que tiene exactamente la misma base $b$, se neutralizan por completo:

  - Ejemplo directo: $5^{\log_5(17)} = 17$.

  - Con logaritmo decimal: $10^{\log(9)} = 9$.

  - Con logaritmo natural: $e^{\ln(x)} = x$.

  - Esto ocurre porque la función exponencial $b^x$ y la función logarítmica $\log_b(x)$ son operaciones inversas mutuas.'
explicacion_formal: 'Sean $b \in \mathbb{R}^+ \setminus \{1\}$ y $a \in \mathbb{R}^+$. Por definición, si $c = \log_b(a)$, entonces por equivalencia exponencial se tiene $b^c = a$.


  Sustituyendo la expresión de $c$ en la potencia, se obtiene la **identidad fundamental de cancelación exponencial-logaritmo**:


  $$b^{\log_b(a)} = a$$


  **Condición de Aplicación:**

  La base de la potencia debe coincidir con la base del logaritmo sin coeficientes intermediarios. Si existe un coeficiente, debe ingresarse previamente al argumento: $b^{k \cdot \log_b(a)} = b^{\log_b(a^k)} = a^k$.'
definiciones_clave: '- **Cancelación exponencial-logaritmo**: Identidad $b^{\log_b(a)} = a$.

  - **Funciones inversas**: Composición $f(f^{-1}(a)) = a$ donde $f(x) = b^x$ y $f^{-1}(x) = \log_b(x)$.

  - **Coeficiente previo**: Factor que debe elevarse como potencia antes de cancelar.'
propiedades_relaciones: '- **Universalidad**: Válido para toda base admisible en $\mathbb{R}$.

  - **Despeje de ecuaciones logarítmicas**: Aplicar base $b^{(\cdot)}$ a ambos lados de $\log_b(x) = k \implies x = b^k$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de potencia con base coincidente](/static/img/nodos/potencia-cuya-base-coincide-con-la-base-del-logaritmo-ejemplos.svg)


    Calcule el valor de $7^{\log_7(43)}$ y resuelva la expresión $3^{2 \cdot \log_3(5)}$.'
  pasos:
  - 'Paso 1: Para $7^{\log_7(43)}$: La base 7 coincide con la base del logaritmo $\implies 43$.'
  - 'Paso 2: Para $3^{2 \cdot \log_3(5)}$: Subir el 2 como exponente del argumento: $3^{\log_3(5^2)} = 3^{\log_3(25)}$.'
  - 'Paso 3: Cancelar base y logaritmo: el resultado es $25$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor simplificado de $10^{\log(85)}$?
  choices:
  - text: $85$ (por la identidad de cancelación $b^{\log_b(a)} = a$)
    is_correct: true
  - text: $10$
    is_correct: false
  - text: $850$
    is_correct: false
  - text: $1$
    is_correct: false
  explanation: La alternativa correcta es '$85$ (por la identidad de cancelación $b^{\log_b(a)} = a$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $3^{2 \cdot \log_3(5)} = 25$?
  choices:
  - text: 'Porque el 2 sube como exponente de 5: $3^{\log_3(5^2)} = 25$'
    is_correct: true
  - text: Porque se multiplica $2 \times 5 = 10$
    is_correct: false
  - text: Porque $3^2 = 9$
    is_correct: false
  - text: Porque se cancela el 3 dando $2 \times 5 = 10$
    is_correct: false
  explanation: 'La alternativa correcta es ''Porque el 2 sube como exponente de 5: $3^{\log_3(5^2)} = 25$''.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la base de la potencia coincida con la base del logaritmo.'
- 'Paso 2: Si el logaritmo tiene un coeficiente multiplicativo al frente, subirlo como exponente del argumento.'
- 'Paso 3: Aplicar la identidad de cancelación directa $b^{\log_b(a)} = a$.'
errores_correccion: '- **Error 1: Cancelar sin subir los coeficientes ($b^{2\log_b(a)} = 2a$).** **Cómo corregirlo:** El coeficiente sube como exponente del argumento: $b^{2\log_b(a)} = b^{\log_b(a^2)} = a^2$.

  - **Error 2: Intentar cancelar con bases distintas ($4^{\log_2(x)} = x$).** **Cómo corregirlo:** Expresar $4 = 2^2$, dando $(2^2)^{\log_2(x)} = 2^{2\log_2(x)} = x^2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué equivale $2^{\log_2(64)}$?
  alternativas:
  - $64$
  - $2$
  - $128$
  respuesta: $64$
  solucion_pasos:
  - Por cancelación directa $b^{\log_b(x)} = x$, el resultado es $64$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $e^{\ln(15)}$?
  alternativas:
  - $15$
  - $e^{15}$
  - $\ln(15)$
  respuesta: $15$
  solucion_pasos:
  - $e^{\ln(x)} = x \implies e^{\ln(15)} = 15$.
- titulo: ¿Es 9^(log₃(4)) = 16?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $9 = 3^2 \implies (3^2)^{\log_3(4)} = 3^{\log_3(4^2)} = 4^2 = 16$.
  alternativas:
  - texto: Sí, (3²)^log₃(4) = 4² = 16
    es_correcta: true
    retroalimentacion: ¡Correcto! Descomposición previa de la base 9.
  - texto: No, es 4
    es_correcta: false
    retroalimentacion: Incorrecto, la base 9 es $3^2$, eleva al cuadrado.
  - texto: No, es 36
    es_correcta: false
    retroalimentacion: Incorrecto, $4^2 = 16$.
- titulo: ¿Es 5^(log₅(1)) = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\log_5(1) = 0 \implies 5^0 = 1$ (o por cancelación directa).
  alternativas:
  - texto: Sí, el resultado es el argumento 1
    es_correcta: true
    retroalimentacion: ¡Correcto! Cancelación inmediata de funciones inversas.
  - texto: No, es 0
    es_correcta: false
    retroalimentacion: Incorrecto, $5^0 = 1$, no 0.
  - texto: No, es 5
    es_correcta: false
    retroalimentacion: Incorrecto, el argumento es 1.
errores_frecuentes:
- Cancelar bases cuando hay coeficientes multiplicando al logaritmo.
- Asumir que bases distintas se cancelan sin descomposición previa.
- Multiplicar la base por el argumento en vez de cancelar.
- Olvidar que el argumento debe ser estrictamente positivo.
afirmaciones_verdaderas:
- La identidad $b^{\log_b(a)} = a$ es consecuencia directa de que la potencia y el logaritmo son funciones inversas.
- Para bases decimal y natural se cumple $10^{\log(x)} = x$ y $e^{\ln(x)} = x$.
- Cualquier coeficiente multiplicativo en el exponente debe elevarse como potencia antes de cancelar.
al_terminar_debes_poder: '![Síntesis de potencia con base coincidente](/static/img/nodos/potencia-cuya-base-coincide-con-la-base-del-logaritmo-resumen.svg)


  QUÉ: Aplicar la identidad de neutralización $b^{\log_b(a)} = a$ en potencias con exponentes logarítmicos.


  CÓMO: Verificando la coincidencia de bases, reubicando posibles coeficientes como potencias del argumento y cancelando directamente la operación para obtener $a$.'
