resumen_inicial: 'Una potencia cuya base es $b$ elevada a un logaritmo en esa misma
  base $\log_b(a)$ se cancela devolviendo exactamente el argumento original: $b^{\log_b(a)}
  = a$ ($a > 0$).'
explicacion_simple: Elevar el número $b$ a la potencia de un logaritmo que tiene como
  base a ese mismo número $b$ hace que la potencia y el logaritmo se destruyan mutuamente,
  dejando libre al número del argumento.
explicacion_formal: 'Para todo $a > 0$ y base $b > 0, b \neq 1$, la **Potencia de
  Base Logarítmica Identica** cumple:


  $$b^{\log_b(a)} = a$$


  **Demostración:**

  Sea $c = \log_b(a)$. Por definición de logaritmo, $b^c = a$.

  Sustituyendo $c$: $b^{\log_b(a)} = a$.'
definiciones_clave: '- **Potencia de base logarítmica**: Identidad $b^{\log_b(a)}
  = a$ que cancela la base con el operador logaritmo.'
propiedades_relaciones: '- **Cancelación izquierda**: $b^{\log_b(a)} = a$ para todo
  $a > 0$.'
ejemplo_guiado:
  enunciado: Calcule el valor de las expresiones $5^{\log_5(9)}$ y $10^{\log(4)}$.
  pasos:
  - 'Paso 1: Para $5^{\log_5(9)}$, la base de la potencia ($5$) coincide con la base
    del logaritmo ($5$) $\implies$ resultado $9$.'
  - 'Paso 2: Para $10^{\log(4)}$, la base decimal implícita es $10$, que coincide
    con la base de la potencia ($10$) $\implies$ resultado $4$.'
  - 'Conclusión: $5^{\log_5(9)} = 9$ y $10^{\log(4)} = 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué valor resulta de la expresión b^{log_b(a)} cuando la base de la potencia
    coincide con la del logaritmo?
  choices:
  - text: Devuelve exactamente el argumento a por cancelación
    is_correct: true
  - text: Devuelve la base b
    is_correct: false
  - text: Devuelve 1
    is_correct: false
  - text: Devuelve 0
    is_correct: false
  explanation: La alternativa correcta es 'Devuelve exactamente el argumento a por
    cancelación'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5^{log_5(9)}, ¿cuál fue el resultado final?
  choices:
  - text: '9'
    is_correct: true
  - text: '5'
    is_correct: false
  - text: '45'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '9'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de simplificar expresiones del tipo
  $b^{\log_b(a)} = a$, aplicando la cancelación directa entre potencias y logaritmos
  de igual base.
semantic_id: MAT.NUM.LOGARITMOS_PROPIEDADES.POTENCIA_DE_BASE_LOGARITMICA
procedimiento:
- 'Paso 1: Identificar la propiedad logarítmica correspondiente a la estructura del
  argumento o las bases.'
- 'Paso 2: Aplicar la ley algebraica transformando el logaritmo según la regla.'
- 'Paso 3: Evaluar y reducir numéricamente la expresión simplificada.'
errores_correccion: '- **Error 1: Confundir el logaritmo de una suma con la suma de
  logaritmos (escribir $\log(x+y) = \log(x) + \log(y)$).** **Cómo corregirlo:** El
  logaritmo NO es distributivo sobre la suma; la suma de logaritmos proviene del PRODUCTO
  ($\log(x \cdot y) = \log(x) + \log(y)$).


  - **Error 2: Confundir el cociente de logaritmos con el logaritmo del cociente.**
  **Cómo corregirlo:** $\log\left(\frac{x}{y}\right) = \log(x) - \log(y)$, mientras
  $\frac{\log(x)}{\log(y)}$ es la fórmula de cambio de base.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de aplicación de MAT.NUM.LOGARITMOS_PROPIEDADES.POTENCIA_DE_BASE_LOGARITMICA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la propiedad logarítmica.
- titulo: Ejemplo 2
  enunciado: Verificación de validez formal.
  alternativas:
  - Cumple la propiedad
  - No cumple
  - Indeterminado
  respuesta: Cumple la propiedad
  solucion_pasos:
  - Demostración de equivalencia en R.
- titulo: ¿Es distributivo el logaritmo respecto a la adición?
  respuesta: 'No'
  solucion_pasos:
  - No, $\log(x+y) \neq \log(x) + \log(y)$.
- titulo: ¿Conserva el resultado la igualdad matemática original?
  respuesta: Sí
  solucion_pasos:
  - Sí, por las propiedades de los logaritmos.
errores_frecuentes:
- Distribuir el logaritmo sobre los términos de una suma escribiendo $\log_b(x+y)
  = \log_b(x) + \log_b(y)$.
- Multiplicar los logaritmos individuales al calcular el logaritmo de un producto.
- Dividir los logaritmos individuales al calcular el logaritmo de un cociente.
- La expresión $\log(x^2)$ equivale numéricamente a elevar al cuadrado todo el logaritmo
  $(\log(x))^2$.
- Restar las bases al aplicar el cambio de base en un logaritmo.
afirmaciones_verdaderas:
- Las propiedades de los logaritmos transforman productos en sumas, cocientes en restas
  y potencias en multiplicaciones.
- 'El logaritmo de un producto es la suma de los logaritmos de sus factores: $\log_b(x
  \cdot y) = \log_b(x) + \log_b(y)$ ($x,y>0$).'
fuente: Texto escolar MINEDUC — Números 2° Medio / PAES.
