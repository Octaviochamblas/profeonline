procedimiento:
- 'Paso 1: Identifica las coordenadas de los dos extremos del segmento: A(x₁,y₁) y
  B(x₂,y₂).'
- 'Paso 2: Calcula el promedio de las abscisas: (x₁+x₂)/2.'
- 'Paso 3: Calcula el promedio de las ordenadas: (y₁+y₂)/2, obteniendo así las coordenadas
  completas del punto medio M.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con fórmula de las coordenadas del punto medio de un segmento.
