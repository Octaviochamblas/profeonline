semantic_id: MAT.GEO.SEGMENTO_METRICA.PUNTO_MEDIO_FORMULA
resumen_inicial: 'Fórmula de las coordenadas del punto medio de un segmento: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: El punto medio de un segmento es simplemente el 'promedio' de
  las coordenadas de sus dos extremos.
explicacion_formal: '![Fórmula del punto medio de un segmento](/static/img/geometria/cartesiano-vectores/segmento-punto-medio-formula.svg)


  ### Definición formal


  El punto medio $M$ de un segmento $AB$, con $A(x_1,y_1)$ y $B(x_2,y_2)$, tiene coordenadas
  $M=\left(\frac{x_1+x_2}{2},\frac{y_1+y_2}{2}\right)$: el promedio de las abscisas
  y el promedio de las ordenadas.


  ### Desarrollo didáctico


  En la figura, el punto medio $M$ del segmento $AB$ se ubica exactamente a la misma
  distancia de $A$ que de $B$, calculado promediando cada coordenada por separado.'
definiciones_clave: '- **Fórmula de las coordenadas del punto medio de un segmento**:
