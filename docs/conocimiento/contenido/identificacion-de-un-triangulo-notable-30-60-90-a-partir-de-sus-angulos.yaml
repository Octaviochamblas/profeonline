semantic_id: MAT.GEO.TRIANGULOS_NOTABLES_METRICA.IDENTIFICACION_30_60_90
resumen_inicial: 'El triángulo notable $30^\circ-60^\circ-90^\circ$ es el semi-equilátero obtenido al cortar un triángulo equilátero por su altura, con cateto menor opuesto a $30^\circ$ igual a la mitad de la hipotenusa.'
explicacion_simple: |
  ![Triángulo Notable 30°-60°-90°: Semi-Equilátero](/static/img/nodos/identificacion-de-un-triangulo-notable-30-60-90-a-partir-de-sus-angulos-intro.svg)

  Es un triángulo equilátero cortado exactamente por la mitad: el lado más corto está frente al ángulo chico ($30^\circ$) y mide la mitad de la hipotenusa.
explicacion_formal: |
  ### Definición y teorema formal
  En el plano euclidiano $\mathbb{R}^2$, un triángulo rectángulo $\Delta ABC$ es **notable $30^\circ-60^\circ-90^\circ$** si y solo si sus ángulos interiores satisfacen:

  $$\{\alpha, \beta, \gamma\} = \{30^\circ, 60^\circ, 90^\circ\}$$

  Por la propiedad de la altura en el triángulo equilátero de lado $L = 2k$:

  $$\text{Cateto opuesto a } 30^\circ = k = \frac{L}{2} = \frac{c}{2}$$

  ### Desglose simbólico y geométrico
  - $c = 2k$: Hipotenusa del triángulo (lado del equilátero original).
  - $a = k$: Cateto menor, opuesto al ángulo de $30^\circ$.
  - $b = k\sqrt{3}$: Cateto mayor, opuesto al ángulo de $60^\circ$ (altura del equilátero original).
  - Deducción por Pitágoras:

  $$b = \sqrt{c^2 - a^2} = \sqrt{(2k)^2 - k^2} = \sqrt{4k^2 - k^2} = \sqrt{3k^2} = k\sqrt{3}$$

  ### Síntesis didáctica
  El triángulo $30^\circ-60^\circ-90^\circ$ es la piedra angular de la trigonometría circular ($\sin 30^\circ = \frac{1}{2}$, $\cos 30^\circ = \frac{\sqrt{3}}{2}$, $\tan 30^\circ = \frac{\sqrt{3}}{3}$).
definiciones_clave: |
  - **Triángulo notable**: Triángulo rectángulo con ángulos fijos cuyas proporciones entre lados son constantes conocidas.
  - **Triángulo 45°-45°-90°**: Rectángulo isósceles de lados proporcionales a $1 : 1 : \sqrt2$.
  - **Triángulo 30°-60°-90°**: Semi-equilátero de lados proporcionales a $1 : \sqrt3 : 2$.
  - **Factor de escala ($k$)**: Constante multiplicativa lineal que define las dimensiones reales de los lados.
propiedades_relaciones: |
  - **Proporción 45-45-90**: $a = k, \ b = k, \ c = k\sqrt2$.
  - **Proporción 30-60-90**: $a = k \ (30^\circ), \ b = k\sqrt3 \ (60^\circ), \ c = 2k \ (90^\circ)$.
  - **Invarianza angular**: Los ángulos permanecen constantes al cambiar el factor de escala $k$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Triángulo Notable 30°-60°-90°: Semi-Equilátero](/static/img/nodos/identificacion-de-un-triangulo-notable-30-60-90-a-partir-de-sus-angulos-ejemplos.svg)

    Aplica la proporción del triángulo notable y el factor de escala $k$ para determinar las medidas lineales incógnitas.
  pasos:
  - 'Paso 1: Identificar el tipo de triángulo notable a partir de sus ángulos ($45^\circ-45^\circ-90^\circ$ o $30^\circ-60^\circ-90^\circ$).'
  - 'Paso 2: Escribir la terna proporcional base ($1 : 1 : \sqrt2$ o $1 : \sqrt3 : 2$).'
  - 'Paso 3: Igualar la medida conocida a su término homólogo para hallar el factor de escala $k$.'
  - 'Paso 4: Multiplicar los demás términos de la terna por $k$ y racionalizar si es necesario.'
  - 'Paso 5: Registrar los valores finales acompañados de su unidad métrica.'
