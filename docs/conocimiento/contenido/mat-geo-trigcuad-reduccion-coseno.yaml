semantic_id: MAT.GEO.TRIG_CUADRANTES.REDUCCION_COSENO
resumen_inicial: 'Reducción del coseno al primer cuadrante usando ángulo de referencia:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Al igual que con el seno, el coseno de cualquier ángulo puede
  obtenerse a partir del coseno de su ángulo de referencia (agudo), ajustando el signo
  según el cuadrante.
explicacion_formal: '![Reducción del coseno al primer cuadrante](/static/img/geometria/trigonometria/trigcuad-reduccion-coseno.svg)


  ### Definición formal


  Si $\alpha$ es el ángulo de referencia de $\theta$, entonces $|\cos\theta|=\cos\alpha$,
  y el signo de $\cos\theta$ se determina según el cuadrante de $\theta$ (positivo
  en I y IV, negativo en II y III).


  ### Desarrollo didáctico


  Para $\theta=210°$ (tercer cuadrante), el ángulo de referencia es $\alpha=30°$.
  Como el coseno es negativo en el tercer cuadrante, $\cos210°=-\cos30°=-\dfrac{\sqrt3}{2}$.'
definiciones_clave: '- **Reducción del coseno al primer cuadrante usando ángulo de
