semantic_id: MAT.GEO.TRANSVERSAL_BARICENTRO.BARICENTRO_RAZON_DOS_UNO
resumen_inicial: 'El baricentro ($G$) divide a cada transversal de gravedad en dos
  segmentos que están en la razón $2:1$ medida desde el vértice: el segmento que va
  del vértice a $G$ mide $\frac{2}{3}$ de la transversal y el que va de $G$ al punto
  medio mide $\frac{1}{3}$.'
explicacion_simple: '![Razón 2:1 del Baricentro](/static/img/nodos/propiedad-del-baricentro-division-de-cada-transversal-de-gravedad-en-razon-21-desde-el-vertice-intro.svg)


  El baricentro $G$ no corta la transversal por la mitad, sino que la divide en 3
  pedazos iguales:


  - **2 pedazos hacia la esquina (vértice)**: El segmento largo va desde la esquina
  hasta $G$ ($\frac{2}{3}$ del total).

  - **1 pedazo hacia el lado (punto medio)**: El segmento corto va desde $G$ hasta
  la mitad del lado ($\frac{1}{3}$ del total).

  - **El largo es el doble del corto**: Si el pedacito corto mide $4\text{ cm}$, el
  largo mide $8\text{ cm}$ y la transversal completa mide $12\text{ cm}$.

  '
explicacion_formal: '### Teorema de partición 2:1 del baricentro

  El baricentro $G$ divide a cada transversal de gravedad en dos segmentos tales que
  la distancia desde el vértice al baricentro es el **doble** de la distancia desde
  el baricentro al punto medio del lado:


  $$\frac{AG}{GM_a} = 2 \iff AG = 2 \cdot GM_a$$


  $$AG = \frac{2}{3} t_a \quad \land \quad GM_a = \frac{1}{3} t_a$$


  ### Desglose simbólico y geométrico

  - Segmento mayor ($2/3$): Tramo que une el vértice con el baricentro.

  - Segmento menor ($1/3$): Tramo que une el baricentro con el punto medio de la base.

  - Universalidad: La proporción $2:1$ se cumple simultáneamente en las tres transversales
  de gravedad: $BG = 2 GM_b$ y $CG = 2 GM_c$.


  ### Síntesis didáctica

  La regla $2:1$ del baricentro es la propiedad métrica más utilizada para calcular
  longitudes de medianas y posiciones en física y geometría.'
definiciones_clave: '- **Razón 2:1**: Relación de proporcionalidad en la que una cantidad
  es exactamente el doble de la otra.

  - **Segmento baricéntrico mayor**: Segmento desde el vértice hasta el baricentro
  ($2/3$ de la mediana).

  - **Segmento baricéntrico menor**: Segmento desde el baricentro hasta el punto medio
  ($1/3$ de la mediana).

  '
propiedades_relaciones: '- **Ecuaciones fundamentales**: $AG = 2 \cdot GM_a$, $BG
  = 2 \cdot GM_b$, $CG = 2 \cdot GM_c$.

  - **Fracciones del total**: $AG = \frac{2}{3} t_a$, $GM_a = \frac{1}{3} t_a$.

  - **Relación total**: $t_a = AG + GM_a = 3 \cdot GM_a = \frac{3}{2} AG$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Razón 2:1](/static/img/nodos/propiedad-del-baricentro-division-de-cada-transversal-de-gravedad-en-razon-21-desde-el-vertice-ejemplos.svg)


    En un triángulo $ABC$, la transversal de gravedad que parte del vértice $A$ mide
    $t_a = 24\text{ cm}$. Las transversales se cortan en el baricentro $G$. Calcula
    las longitudes de los segmentos $AG$ y $GM_a$.

    '
  pasos:
  - 'Paso 1: Recordar las fórmulas de partición del baricentro: $AG = \frac{2}{3}
    t_a$ y $GM_a = \frac{1}{3} t_a$.'
  - 'Paso 2: Calcular el segmento mayor $AG$: $AG = \frac{2}{3} \times 24 = \frac{48}{3}
    = 16\text{ cm}$.'
  - 'Paso 3: Calcular el segmento menor $GM_a$: $GM_a = \frac{1}{3} \times 24 = 8\text{
    cm}$.'
  - 'Paso 4: Verificar la relación: $AG + GM_a = 16 + 8 = 24\text{ cm}$ y $16 = 2
    \times 8$.'
  - 'Paso 5: Concluir que $AG = 16\text{ cm}$ y $GM_a = 8\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué razón divide el baricentro a cada transversal de gravedad desde
    el vértice?
  choices:
  - text: En razón 2:1 (el tramo al vértice es el doble del tramo a la base)
    is_correct: true
  - text: En razón 1:1 (por la mitad exacta)
    is_correct: false
  - text: En razón 3:1
    is_correct: false
  - text: En razón 1:2 desde el vértice
    is_correct: false
  explanation: El baricentro divide a cada transversal en razón 2:1 (el tramo al vértice
    es el doble del tramo a la base) respecto al punto medio.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el segmento desde el baricentro G hasta el punto medio Ma mide 5 cm,
    ¿cuánto mide la transversal de gravedad completa ta?
  choices:
  - text: $15\text{ cm}$
    is_correct: true
  - text: $10\text{ cm}$
    is_correct: false
  - text: $7.5\text{ cm}$
    is_correct: false
  - text: $20\text{ cm}$
    is_correct: false
  explanation: Mide $15\text{ cm}$, ya que $AG = 2 \times 5 = 10\text{ cm}$ y la transversal
    total es $t_a = 10 + 5 = 15\text{ cm}$ ($3 \times 5\text{ cm}$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar qué dato se conoce: la transversal completa ($t$), el tramo
  mayor ($AG$) o el tramo menor ($GM$).'
- 'Paso 2: Si se conoce $t$, calcular $AG = \frac{2}{3} t$ y $GM = \frac{1}{3} t$.'
- 'Paso 3: Si se conoce $GM$, calcular $AG = 2 \cdot GM$ y $t = 3 \cdot GM$.'
- 'Paso 4: Si se conoce $AG$, calcular $GM = \frac{AG}{2}$ y $t = \frac{3}{2} AG$.'
errores_correccion: Recuerda que el tramo que va al vértice es el que mide el doble
  (2/3) y el tramo que va a la base mide la mitad de este (1/3).
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo con baricentro $G$, el segmento $BG = 14\text{ cm}$.
    ¿Cuánto mide el segmento $GM_b$?
  alternativas:
  - $7\text{ cm}$
  - $28\text{ cm}$
  - $14\text{ cm}$
  respuesta: $7\text{ cm}$
  solucion_pasos:
  - $GM_b = \frac{BG}{2} = \frac{14}{2} = 7\text{ cm}$.
- titulo: Ejemplo 2
  enunciado: Si la transversal de gravedad completa $t_c = 27\text{ cm}$, ¿cuánto
    mide el segmento $CG$ desde el vértice hasta el baricentro?
  alternativas:
  - $18\text{ cm}$
  - $9\text{ cm}$
  - $13.5\text{ cm}$
  respuesta: $18\text{ cm}$
  solucion_pasos:
  - $CG = \frac{2}{3} \times 27 = 18\text{ cm}$.
- titulo: ¿El baricentro divide a la transversal de gravedad en dos partes de exactamente
    igual longitud?
  respuesta: 'No'
  solucion_pasos:
  - No, la divide en razón $2:1$ ($\frac{2}{3}$ hacia el vértice y $\frac{1}{3}$ hacia
    el punto medio).
- titulo: ¿El segmento desde el vértice al baricentro es el doble del segmento desde
    el baricentro al punto medio?
  respuesta: Sí
  solucion_pasos:
  - Sí, $AG = 2 \cdot GM_a$ es la propiedad fundamental del baricentro.
errores_frecuentes:
- Creer que el baricentro es el punto medio de la transversal de gravedad.
- Invertir las proporciones y asignarle $2/3$ al tramo que va a la base.
- Dividir entre 2 en lugar de dividir entre 3 al calcular los tercios.
- Olvidar que $AG = 2 \cdot GM$.
- Asumir que la razón 2:1 solo se cumple en triángulos equiláteros.
afirmaciones_verdaderas:
- El baricentro divide a cada transversal de gravedad en razón $2:1$ medida desde
  el vértice.
- La longitud desde el vértice al baricentro es igual a $\frac{2}{3}$ de la longitud
  total de la transversal de gravedad.
al_terminar_debes_poder: '**QUÉ:** Calcular longitudes de segmentos divididos por
  el baricentro en transversales de gravedad.


  **CÓMO:** Aplicando la razón fundamental $2:1$ ($AG = 2 \cdot GM_a$) y las fracciones
  $AG = \frac{2}{3} t_a$ y $GM_a = \frac{1}{3} t_a$.


  ![Resumen de Razón 2:1](/static/img/nodos/propiedad-del-baricentro-division-de-cada-transversal-de-gravedad-en-razon-21-desde-el-vertice-resumen.svg)

  '
