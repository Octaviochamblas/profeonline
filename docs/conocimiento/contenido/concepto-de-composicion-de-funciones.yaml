semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.CONCEPTO
resumen_inicial: 'La composición de funciones es la operación que consiste en aplicar sucesivamente dos funciones, alimentando la función externa con el resultado de la función interna: $(f \circ g)(x) = f(g(x))$.'
explicacion_simple: '![La composición de funciones es la operación que consiste en aplicar sucesivamente dos funciones, alimentando la función externa con el resultado de la función interna: $(f \circ g)(x) = f(g(x))$](/static/img/nodos/concepto-de-composicion-de-funciones-intro.svg)



  Imagina dos máquinas conectadas en serie en una fábrica:

  1. Metes la materia prima $x$ en la primera máquina $g$. La máquina $g$ hace su trabajo y entrega un producto intermedio $g(x)$.

  2. Tomas ese producto $g(x)$ y lo metes directamente en la segunda máquina $f$.

  3. La máquina $f$ entrega el producto terminado: **$f(g(x))$**.


  Esto es la **composición de funciones**: aplicar una función tras otra en cadena.'
explicacion_formal: 'Dadas dos funciones $g: A \to B$ y $f: B \to C$, la **función compuesta** $f \circ g: A \to C$ es la aplicación definida formalmente por:

  $$(f \circ g)(x) = f(g(x)), \quad \forall x \in A$$


  **Estructura del proceso:**

  - **Función interna (previa)**: $g(x)$ actúa en primer lugar sobre el dominio original.

  - **Función externa (posterior)**: $f(u)$ actúa en segundo lugar sobre la imagen intermedia $u = g(x)$.

  - **Cadena de asignación**: $x \in A \xrightarrow{\quad g \quad} g(x) \in B \xrightarrow{\quad f \quad} f(g(x)) \in C$.'
definiciones_clave: '- **Función compuesta $(f \circ g)$**: Encadenamiento secuencial de dos reglas de correspondencia.

  - **Función interna / externa**: Jerarquía operativa donde la función interna se evalúa antes que la externa.'
propiedades_relaciones: '- **Asociatividad**: La composición es asociativa: $f \circ (g \circ h) = (f \circ g) \circ h$.

  - **No conmutatividad**: En general, $f \circ g \neq g \circ f$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La composición de funciones es la operación que consiste en aplicar sucesivamente dos funciones, alimentando la función externa con el resultado de la función interna: $(f \circ g)(x) = f(g(x))$](/static/img/nodos/concepto-de-composicion-de-funciones-ejemplos.svg)



    Sean $g(x) = 2x + 1$ y $f(u) = u^2$. Explica el proceso de composición para calcular $(f \circ g)(3)$.'
  pasos:
  - 'Paso 1: Identificar la función interna: $g$ se aplica primero a la entrada $x = 3$.'
  - 'Paso 2: Calcular el valor intermedio: $g(3) = 2(3) + 1 = 6 + 1 = 7$.'
  - 'Paso 3: Identificar la función externa: $f$ procesa el valor intermedio $u = 7$.'
  - 'Paso 4: Evaluar la función externa: $f(7) = 7^2 = 49$.'
  - 'Paso 5: Concluir que $(f \circ g)(3) = f(g(3)) = 49$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la composición $(f \circ g)(x) = f(g(x))$, ¿cuál función actúa en primer lugar sobre la entrada $x$?
  choices:
  - text: La funcion interna g(x).
    is_correct: true
  - text: La funcion externa f(x).
    is_correct: false
  - text: Ambas actuan exactamente al mismo tiempo.
    is_correct: false
  - text: La derivada de f.
    is_correct: false
  explanation: La alternativa correcta es 'La funcion interna g(x).'. Se evalúa de adentro hacia afuera.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $g(4) = 10$ y $f(10) = 3$, ¿cuál es el valor de $(f \circ g)(4)$?
  choices:
  - text: '3'
    is_correct: true
  - text: '10'
    is_correct: false
  - text: '30'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: La alternativa correcta es '3'. $(f \circ g)(4) = f(g(4)) = f(10) = 3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar claramente la función interna (la más cercana a la variable $x$).'
- 'Paso 2: Evaluar la preimagen en la función interna para obtener el resultado intermedio.'
- 'Paso 3: Tomar dicho resultado intermedio e introducirlo como entrada de la función externa.'
- 'Paso 4: Operar la función externa para obtener la salida final.'
errores_correccion: '- **Error común:** Multiplicar las funciones pensando que $(f \circ g)(x) = f(x) \cdot g(x)$.

  - **Cómo corregirlo:** El símbolo $\circ$ representa **composición (anidación)**, no multiplicación; debes evaluar una función **dentro** de la otra.'
ejemplos:
- titulo: 'Ejemplo 1: Evaluación encadenada'
  enunciado: Si $g(2) = 5$ y $f(5) = -1$, ¿cuánto vale $(f \circ g)(2)$?
  alternativas:
  - '-1'
  - '5'
  - '-5'
  - '2'
  respuesta: '-1'
  solucion_pasos:
  - 'Paso 1: $(f \circ g)(2) = f(g(2)) = f(5) = -1$.'
- titulo: 'Ejemplo 2: Diagrama de flechas'
  enunciado: Si $1 \xrightarrow{\ g\ } 4 \xrightarrow{\ f\ } 9$, ¿qué valor tiene $(f \circ g)(1)$?
  alternativas:
  - '9'
  - '4'
  - '36'
  - '1'
  respuesta: '9'
  solucion_pasos:
  - 'Paso 1: La cadena completa lleva $1$ hasta $9$, luego $(f \circ g)(1) = 9$.'
- titulo: 'Ejemplo 3: Auto-composición'
  enunciado: Si $f(x) = 2x$, ¿qué representa $(f \circ f)(x)$?
  alternativas:
  - f(f(x)) = 2(2x) = 4x
  - f(x) * f(x) = 4x^2
  - 2x + 2x = 4x
  - f(2x)
  respuesta: f(f(x)) = 2(2x) = 4x
  solucion_pasos:
  - 'Paso 1: Componer una función consigo misma: $f(f(x)) = 2(2x) = 4x$.'
- titulo: 'Ejemplo 4: Distinción de operaciones'
  enunciado: ¿Qué diferencia a $(f \circ g)(x)$ de $(f + g)(x)$?
  alternativas:
  - En f o g se anidan las funciones, mientras que en f + g se suman sus salidas
  - Son idénticas
  - f o g es solo para polinomios
  - f + g no es una función
  respuesta: En f o g se anidan las funciones, mientras que en f + g se suman sus salidas
  solucion_pasos:
  - 'Paso 1: Composición es evaluación anidada; suma es operación algebraica directa.'
errores_frecuentes:
- Confundir composición con producto de funciones.
- Evaluar primero la función externa.
- Olvidar que la salida de la primera es la entrada de la segunda.
afirmaciones_verdaderas:
- 'La composición de funciones consiste en aplicar la función externa al resultado de la interna: (f o g)(x) = f(g(x)).'
- La composición de funciones es una operación asociativa pero generalmente no conmutativa.
al_terminar_debes_poder: '**QUÉ:** Comprender e interpretar el concepto de composición de funciones como encadenamiento secuencial.


  **CÓMO:** Identificando las funciones interna y externa y describiendo el flujo de transformación x ⟼ g(x) ⟼ f(g(x)).


  ![Resumen La composición de funciones es la operación que consiste en aplicar sucesivamente dos funciones, alimentando la función externa con el resultado de la función interna: $(f \circ g)(x) = f(g(x))$](/static/img/nodos/concepto-de-composicion-de-funciones-resumen.svg)'
