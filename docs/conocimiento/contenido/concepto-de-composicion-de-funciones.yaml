semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.CONCEPTO
resumen_inicial: 'La composición de funciones combina dos funciones aplicando sucesivamente
  una después de la otra: el resultado de la primera pasa como entrada de la segunda.'
explicacion_simple: 'La **composición de funciones** es como una cadena de procesamiento
  de dos máquinas en serie:

  1. Ingresas un número $x$ en la primera máquina $g$, la cual entrega el resultado
  intermedio $g(x)$.

  2. Tomas ese resultado $g(x)$ y lo introduces dentro de la segunda máquina $f$.

  3. La salida final es $f(g(x))$, denotada $(f \circ g)(x)$ (''$f$ compuesta con
  $g$'').'
explicacion_formal: 'Dadas las funciones $g: A \to B$ y $f: B \to C$, la **función
  compuesta** $f \circ g: A \to C$ se define formalmente como:


  $$(f \circ g)(x) = f(g(x)) \quad \forall x \in \operatorname{Dom}(f \circ g)$$


  **Desglose de la fórmula:**

  - Mapeo encadenado secuencial donde la función interna $g$ actúa primero sobre $x$,
  e inmediatamente la función externa $f$ actúa sobre la imagen $g(x)$.'
definiciones_clave: '- **Composición de funciones ($f \circ g$)**: Operación binaria
  entre funciones que consiste en evaluar $f$ en el argumento resultante de $g(x)$.

  - **Función interna ($g$)**: Función que se evalúa en primer lugar sobre la preimagen
  $x$.

  - **Función externa ($f$)**: Función que se evalúa en segundo lugar sobre el resultado
  $g(x)$.'
propiedades_relaciones: '- **Asociatividad**: $(f \circ g) \circ h = f \circ (g \circ
  h)$.'
ejemplo_guiado:
  enunciado: Dadas las funciones $g(x) = x + 3$ y $f(x) = x^2$, explica el concepto
    de $(f \circ g)(x)$ y evalúalo para $x = 2$.
  pasos:
  - 'Paso 1: Identificar la función interna $g(x) = x + 3$ y la función externa $f(x)
    = x^2$.Paso 2: Aplicar primero la función interna a $x = 2$: $g(2) = 2 + 3 = 5$.Paso
    3: Aplicar la función externa al resultado intermedio $5$: $f(g(2)) = f(5) = 5^2
    = 25$.Paso 4: Concluir que el valor de la composición en $x = 2$ es $(f \circ
    g)(2) = 25$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar la composición $(f \circ g)(2)$ con $g(x) = x + 3$ y $f(x)
    = x^2$, ¿cuál es el resultado final?
  choices:
  - text: $(f \circ g)(2) = 25$
    is_correct: true
  - text: $(f \circ g)(2) = 7$
    is_correct: false
  - text: $(f \circ g)(2) = 10$
    is_correct: false
  - text: $(f \circ g)(2) = 12$
    is_correct: false
  explanation: La alternativa correcta es '$(f \circ g)(2) = 25$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la notación de composición $(f \circ g)(x)$, ¿cuál de las dos funciones
    se evalúa en primer lugar?
  choices:
  - text: La función interna $g(x)$, que está más cerca de la variable de entrada
      $x$.
    is_correct: true
  - text: La función externa $f(x)$.
    is_correct: false
  - text: Se evalúan simultáneamente.
    is_correct: false
  - text: Se evalúa primero la que tenga mayor grado algebráico.
    is_correct: false
  explanation: La alternativa correcta es 'La función interna $g(x)$, que está más
    cerca de la variable de entrada $x$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la función que actúa como interna (más a la derecha) e identificar
  la externa (más a la izquierda).'
- 'Paso 2: Calcular el valor intermedio evaluando la entrada en la función interna.'
- 'Paso 3: Sustituir dicho resultado dentro de la función externa.'
- 'Paso 4: Obtener el valor final de la composición.'
errores_correccion: '- **Error común:** Pensar que $(f \circ g)(x)$ significa multiplicar
  $f(x)$ por $g(x)$.

  - **Cómo corregirlo:** La composición NO ES una multiplicación; es introducir la
  salida de $g$ dentro del argumento de $f$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de composición de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de composición de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La composición de funciones (f o g)(x) equivale a f(g(x))?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición notacional de composición de funciones.
- titulo: ¿La composición de funciones es conmutativa en general?
  respuesta: 'No'
  solucion_pasos:
  - No, en general (f o g)(x) != (g o f)(x).
errores_frecuentes:
- Confundir la composición de funciones $(f \circ g)(x)$ con la multiplicación de
  funciones $(f \cdot g)(x)$.
- Evaluar primero la función externa de la izquierda en lugar de la función interna
  de la derecha.
- Asumir falsamente que la composición de funciones es conmutativa ($(f \circ g)(x)
  = (g \circ f)(x)$).
- Olvidar distribuir coeficientes al sustituir expresiones compuestas en el cálculo
  algebraico.
- Determinar el dominio únicamente desde la fórmula reducida final ignorando las restricciones
  del proceso intermedio.
afirmaciones_verdaderas:
- La composición de funciones $(f \circ g)(x) = f(g(x))$ consiste en evaluar la función
  externa $f$ en el resultado de la función interna $g(x)$.
- El dominio de la composición $\operatorname{Dom}(f \circ g)$ hereda todas las restricciones
  de la función interna $g(x)$ y exige que $g(x) \in \operatorname{Dom}(f)$.
al_terminar_debes_poder: Al finalizar este recurso podrás comprender, evaluar numéricamente
  y calcular algebraicamente composiciones de funciones, reconociendo la no conmutatividad
  y analizando sus dominios resultantes.
