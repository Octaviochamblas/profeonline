semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.CONCEPTO
resumen_inicial: 'Concepto de composición de funciones: conceptos, representación
  y propiedades en Composición de funciones.'
explicacion_simple: 'Imagina dos máquinas conectadas en línea: la salida de la primera
  se convierte directamente en la entrada de la segunda. Eso es exactamente componer
  funciones.'
explicacion_formal: '### Definición formal


  Dadas $g: A \to B$ y $f: B \to C$, la composición $f \circ g: A \to C$ se define
  por $(f \circ g)(x) = f(g(x))$ para todo $x \in A$. Para que la composición esté
  bien definida, el recorrido de $g$ debe estar contenido en el dominio de $f$.


  ### Desarrollo didáctico


  El orden importa: en $f \circ g$, se aplica primero $g$ (la función más cercana
  a $x$) y después $f$ (la función exterior).


  Si $g(x)=x+3$ y $f(x)=x^2$, entonces $(f \circ g)(x) = f(g(x)) = f(x+3) = (x+3)^2$:
  primero se suma 3, luego se eleva al cuadrado el resultado.'
definiciones_clave: '- **Concepto de composición de funciones**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a concepto de composición de funciones.'
ejemplo_guiado:
