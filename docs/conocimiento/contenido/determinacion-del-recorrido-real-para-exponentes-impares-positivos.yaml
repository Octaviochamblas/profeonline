semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.RECORRIDO_IMPAR
resumen_inicial: La determinación del recorrido para funciones potencia con exponente impar positivo ($n = 2k+1$) demuestra que $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$ para cualquier coeficiente no nulo $a \neq 0$, debido a la existencia universal de raíces impares reales para todo número real positivo, nulo o negativo.
explicacion_simple: "![La determinación del recorrido para funciones potencia con exponente impar positivo ($n = 2k+1$) demuestra que $\\operatorname{Rec}(f) = \\mathbb{R} = ]-\\infty, +\\infty[$ para cualquier coeficiente no nulo $a \\neq 0$, debido a la existencia universal de raíces impares reales para todo número real positivo, nulo o negativo](/static/img/nodos/determinacion-del-recorrido-real-para-exponentes-impares-positivos-intro.svg)\n\n\nCuando el exponente es **impar positivo ($1, 3, 5, 7...$)**:\n\n$$\\operatorname{Rec}(f) = \\mathbb{R} = ]-\\infty, +\\infty[ \\quad (\\text{¡Cubre Absolutamente TODOS los Reales!})$$\n\n- **¿Por qué cubre toda la recta numérica?**\n  - Las potencias impares **conservan el signo**: si elevas un número negativo a la 3 o a la 5, **¡te da un resultado negativo real!** ($(-2)^3 = -8$).\n  - Si elevas un positivo, te da positivo ($2^3 = 8$).\n  - En el cero da cero ($0^3 = 0$).\n- **Cualquier altura $y$ tiene respuesta:** No importa qué número elijas\
  \ en el eje vertical (positivo, negativo o decimal gigante), **siempre existe un valor de $x$ real** que lo produce mediante la raíz impar: $x = \\sqrt[n]{y/a}$."
explicacion_formal: 'Sea $f(x) = a \cdot x^{2k+1}$ con $k \in \mathbb{Z}^+$ y $a \in \mathbb{R}^*$.

  Para determinar el conjunto imagen $\operatorname{Rec}(f)$, consideremos cualquier $y_0 \in \mathbb{R}$ y planteemos la ecuación de preimagen:

  $$a \cdot x^{2k+1} = y_0 \Longleftrightarrow x^{2k+1} = \frac{y_0}{a}$$

  Dado que el orden radical $2k+1$ es un entero impar, la aplicación $t \mapsto \sqrt[2k+1]{t}$ es una función continua y biyectiva definida sobre la totalidad de $\mathbb{R}$:

  $$x_0 = \sqrt[2k+1]{\frac{y_0}{a}} \in \mathbb{R}$$


  **Conclusión de sobreyectividad global**:

  Para todo $y_0 \in \mathbb{R}$, existe un único $x_0 \in \mathbb{R}$ tal que $f(x_0) = y_0$, demostrando que:

  $$\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$$'
definiciones_clave: '- **Sobreyectividad en $\mathbb{R}$**: Propiedad funcional donde cada elemento del codominio posee al menos una preimagen.

  - **Raíz impar real**: Operador radical que admite radicandos de cualquier signo sin generar números complejos.'
propiedades_relaciones: '- **Biyectividad estricta**: Las funciones potencia impares son inyectivas y sobreyectivas simultáneamente en $\mathbb{R}$.

  - **Preimagen única**: A diferencia de las pares (que tienen 2 preimágenes), cada $y$ tiene una **única preimagen real**.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del recorrido para funciones potencia con exponente impar positivo ($n = 2k+1$) demuestra que $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$ para cualquier coeficiente no nulo $a \neq 0$, debido a la existencia universal de raíces impares reales para todo número real positivo, nulo o negativo](/static/img/nodos/determinacion-del-recorrido-real-para-exponentes-impares-positivos-ejemplos.svg)



    Dada la función $f(x) = 2x^5$:

    1) Determina su recorrido.

    2) Encuentra la preimagen exacta de $y = -64$.

    3) Demuestra que $f(x)$ no tiene cotas superiores ni inferiores.'
  pasos:
  - 'Paso 1: Como $n = 5$ es un entero impar positivo, la función cubre todos los números reales $\implies$ **$\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$**.'
  - 'Paso 2: Resolver $2x^5 = -64$:

    - $x^5 = -32$.

    - Extraer raíz quinta: $x = \sqrt[5]{-32} = \mathbf{-2} \in \mathbb{R}$.'
  - 'Paso 3: Como $\lim_{x \to +\infty} 2x^5 = +\infty$ y $\lim_{x \to -\infty} 2x^5 = -\infty$, la función no está acotada superior ni inferiormente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el recorrido de la función $f(x) = -4x^3$?
  choices:
  - text: ℝ (todos los números reales)
    is_correct: true
  - text: ']-∞, 0]'
    is_correct: false
  - text: '[0, +∞['
    is_correct: false
  - text: ℝ \ {0}
    is_correct: false
  explanation: La alternativa correcta es 'ℝ (todos los números reales)'. Las funciones potencia con exponente impar positivo tienen siempre recorrido $\mathbb{R}$, independientemente del signo de $a$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántas preimágenes reales tiene cualquier valor y ∈ ℝ en la función $f(x) = x^7$?
  choices:
  - text: Exactamente una preimagen única
    is_correct: true
  - text: Dos preimágenes
    is_correct: false
  - text: Ninguna si y < 0
    is_correct: false
  - text: Siete preimágenes
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente una preimagen única'. Al ser una función biyectiva creciente, $x = \sqrt[7]{y}$ es única en $\mathbb{R}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente $n$ de la función potencia $f(x) = a x^n$.'
- 'Paso 2: Comprobar que $n$ sea un entero impar positivo ($n \in \{1, 3, 5, 7, \dots\}$).'
- 'Paso 3: Verificar que el coeficiente $a$ sea un número real no nulo ($a \neq 0$).'
- 'Paso 4: Enunciar directamente que el recorrido es todo el conjunto real $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$.'
errores_correccion: '- **Error común:** Creer que si $a > 0$, el recorrido de una función cúbica solo incluye números positivos ($[0, +\infty[$).

  - **Cómo corregirlo:** Las potencias impares de bases negativas **producen números negativos**: $(-3)^3 = -27$, por lo que el recorrido **cubre todos los reales negativos y positivos: $\mathbb{R}$**.'
ejemplos:
- titulo: 'Ejemplo 1: Recorrido en grado 7'
  enunciado: 'El recorrido de $f(x) = 10x^7$ es:'
  alternativas:
  - R
  - '[0, +inf['
  - ']-inf, 0]'
  - '[10, +inf['
  respuesta: R
  solucion_pasos:
  - 'Paso 1: Impar positivo $\implies \operatorname{Rec}(f) = \mathbb{R}$.'
- titulo: 'Ejemplo 2: Preimagen negativa en cúbica'
  enunciado: 'Halla la preimagen de $y = -27$ en $g(x) = x^3$:'
  alternativas:
  - x = -3
  - x = 3
  - No existe en R
  - x = -9
  respuesta: x = -3
  solucion_pasos:
  - 'Paso 1: $x^3 = -27 \implies x = \sqrt[3]{-27} = -3$.'
- titulo: 'Ejemplo 3: Recorrido con coeficiente negativo'
  enunciado: 'El recorrido de $h(x) = -6x^5$ es:'
  alternativas:
  - ']-inf, +inf['
  - ']-inf, 0]'
  - '[0, +inf['
  - R \ {-6}
  respuesta: ']-inf, +inf['
  solucion_pasos:
  - 'Paso 1: Impar $\implies \operatorname{Rec}(h) = \mathbb{R} = ]-\infty, +\infty[$.'
- titulo: 'Ejemplo 4: Biyectividad de potencias impares'
  enunciado: ¿Es inyectiva y sobreyectiva la función $p(x) = 3x^3$ en $\mathbb{R}$?
  alternativas:
  - Sí, es biyectiva en todo R
  - Solo inyectiva
  - Solo sobreyectiva
  - Ninguna de las anteriores
  respuesta: Sí, es biyectiva en todo R
  solucion_pasos:
  - 'Paso 1: Al ser estrictamente creciente con recorrido $\mathbb{R}$, es biyectiva.'
errores_frecuentes:
- Asumir que las potencias impares tienen recorrido acotado por cero.
- Olvidar que las raíces impares de números negativos son reales y existen.
- Confundir el comportamiento de exponente impar con exponente par.
afirmaciones_verdaderas:
- Toda función potencia con exponente impar positivo tiene recorrido igual a todo ℝ.
- Para cualquier valor y ∈ ℝ existe una única preimagen real dada por x = (y/a)^(1/n).
al_terminar_debes_poder: '**QUÉ:** Determinar y fundamentar el recorrido real de funciones potencia con exponente impar positivo.


  **CÓMO:** Demostrando la sobreyectividad global y la existencia universal de raíces impares en ℝ.


