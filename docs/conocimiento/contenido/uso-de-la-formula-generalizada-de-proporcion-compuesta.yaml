resumen_inicial: 'La fórmula generalizada de la proporcionalidad compuesta establece
  la igualdad de las constantes entre el estado inicial ($1$) y el estado final ($2$):
  $\frac{X_1}{D_{1,1} \cdot D_{1,2}} \cdot I_{1,1} = \frac{X_2}{D_{2,1} \cdot D_{2,2}}
  \cdot I_{2,1}$.'
explicacion_simple: 'Para resolver directamente cualquier problema compuesto de una
  sola vez, usamos la fórmula generalizada: igualamos la razón de la incógnita ($X_2/X_1$)
  al producto de las razones de cada variable, dejando la razón tal cual si es directa
  o invirtiéndola si es inversa.'
explicacion_formal: 'Para despejar la incógnita $X_2$ en un problema de proporcionalidad
  compuesta, la **Fórmula Generalizada de Producto de Razones** se expresa como:


  $$\frac{X_2}{X_1} = \left( \prod \text{Razones Directas} \right) \cdot \left( \prod
  \text{Razones Inversas Invertidas} \right)$$


  $$\implies X_2 = X_1 \cdot \left( \frac{D_{2,1}}{D_{1,1}} \right) \cdot \left( \frac{I_{1,1}}{I_{2,1}}
  \right)$$'
definiciones_clave: '- **Fórmula generalizada de proporción compuesta**: Ecuación
  $X_2 = X_1 \cdot \prod R_d \cdot \prod R_i^{-1}$.'
propiedades_relaciones: '- **Regla del producto de razones**: Multiplica el valor
  inicial de la incógnita por los factores de escala de cada magnitud.'
ejemplo_guiado:
  enunciado: Si $6$ grifos abiertos $4\text{ horas}$ gastan \$18.000, ¿cuánto gastarán
    $9$ grifos abiertos $5\text{ horas}$?
  pasos:
  - 'Paso 1: Variable incógnita: Gasto ($X_1 = 18.000$).'
  - 'Paso 2: Grifos es Directa $\implies R_{dir,1} = \frac{9}{6}$. Horas es Directa
    $\implies R_{dir,2} = \frac{5}{4}$.'
  - 'Paso 3: Aplicar la fórmula generalizada: $X_2 = 18.000 \cdot \frac{9}{6} \cdot
    \frac{5}{4}$.'
  - 'Paso 4: Resolver el producto: $X_2 = 18.000 \cdot 1,5 \cdot 1,25 = 33.750$.'
  - 'Conclusión: Gastarán \$33.750.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se estructura la fórmula generalizada para calcular la incógnita
    X2?
  choices:
  - text: X2 = X1 · (Producto de razones directas) · (Producto de razones inversas
      invertidas)
    is_correct: true
  - text: X2 = X1 + R1 + R2
    is_correct: false
  - text: X2 = X1 / (R1 · R2)
    is_correct: false
  - text: X2 = R1 · R2
    is_correct: false
  explanation: La alternativa correcta es 'X2 = X1 · (Producto de razones directas)
    · (Producto de razones inversas invertidas)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para los 9 grifos y 5 horas, ¿cuál fue el gasto final
    X2 obtenido?
  choices:
  - text: 33.750 $
    is_correct: true
  - text: 25.000 $
    is_correct: false
  - text: 18.000 $
    is_correct: false
  - text: 45.000 $
    is_correct: false
  explanation: La alternativa correcta es '33.750 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de despejar la incógnita $X_2$ en
  proporcionalidad compuesta aplicando la fórmula generalizada del producto de razones.
semantic_id: MAT.NUM.PROP_COMPUESTA.FORMULA_GENERALIZADA
procedimiento:
- 'Paso 1: Identificar la variable incógnita y comparar individualmente cada magnitud
  auxiliar con ella (fijando las demás).'
- 'Paso 2: Clasificar cada magnitud como directamente proporcional (mantener razón)
  o inversamente proporcional (invertir razón).'
- 'Paso 3: Formar la ecuación generalizada y calcular la respuesta reduciendo los
  factores multiplicativos.'
errores_correccion: '- **Error 1: Comparar las magnitudes auxiliares entre sí en lugar
  de compararlas con la variable incógnita.** **Cómo corregirlo:** La comparación
  de proporcionalidad directa o inversa se DEBE hacer siempre respecto a la columna
  de la INCÓGNITA.


  - **Error 2: No invertir la razón de las magnitudes inversas al armar la fórmula.**
  **Cómo corregirlo:** Las magnitudes inversas cambian su posición $\frac{a_1}{a_2}
  \to \frac{a_2}{a_1}$ al multiplicar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_COMPUESTA.FORMULA_GENERALIZADA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las leyes de proporcionalidad compuesta.
- titulo: Ejemplo 2
  enunciado: Verificación de la fórmula del producto de razones.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por producto de razones.
- titulo: ¿Se invierten las razones de las magnitudes inversas en la fórmula generalizada?
  respuesta: Sí
  solucion_pasos:
  - Sí, para compensar la variación inversamente proporcional.
- titulo: ¿Es necesario congelar las otras variables al clasificar una magnitud?
  respuesta: Sí
  solucion_pasos:
  - Sí, para aislar el efecto puro de esa variable sobre la incógnita.
errores_frecuentes:
- Comparar dos magnitudes auxiliares entre sí en lugar de analizar su relación individual
  con la incógnita.
- Mantener sin invertir la fracción correspondiente a una magnitud de relación inversamente
  proporcional.
- Multiplicar todos los datos numéricos del problema sin distinguir su carácter directo
  o inverso.
- Omitir congelar mentalmente las demás variables al determinar si una relación es
  directa o inversa.
- Declarar que si participan más de tres variables la relación es siempre directamente
  proporcional.
afirmaciones_verdaderas:
- La proporcionalidad compuesta combina tres o más magnitudes analizando la relación
  directa o inversa de cada una con la incógnita.
- En la fórmula generalizada de resolución, la razón de una magnitud inversa se invierte
  respecto a su estado inicial.
