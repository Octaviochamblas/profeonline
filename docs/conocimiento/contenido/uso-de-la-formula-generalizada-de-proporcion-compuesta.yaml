semantic_id: MAT.NUM.PROP_COMPUESTA.FORMULA_GENERALIZADA
resumen_inicial: 'La fórmula generalizada de la proporcionalidad compuesta permite despejar directamente la incógnita $Y^{(2)}$ multiplicando el valor inicial $Y^{(1)}$ por el producto de los factores de razón de cada variable independiente.'
explicacion_simple: |
  La fórmula generalizada es la manera más rápida y elegante de resolver cualquier problema de proporcionalidad compuesta en un solo paso. La regla de oro es:
  $$\text{Resultado Final } Y^{(2)} = \text{Valor Inicial } Y^{(1)} \cdot \left(\text{Factor}_1\right) \cdot \left(\text{Factor}_2\right) \cdots$$
  - Si la variable es **Directa**: el factor se escribe tal cual ($\frac{\text{Valor Final}}{\text{Valor Inicial}}$).
  - Si la variable es **Inversa**: el factor se escribe al revés ($\frac{\text{Valor Inicial}}{\text{Valor Final}}$).
explicacion_formal: |
  ### Definición formal
  Dada una incógnita $Y$ y un conjunto de variables independientes $D_1, D_2, \dots, D_m$ (directas a $Y$) e $I_1, I_2, \dots, I_p$ (inversas a $Y$), la **fórmula generalizada de proporcionalidad compuesta** establece:
  $$Y^{(2)} = Y^{(1)} \cdot \prod_{a=1}^m \left(\frac{D_a^{(2)}}{D_a^{(1)}}\right) \cdot \prod_{b=1}^p \left(\frac{I_b^{(1)}}{I_b^{(2)}}\right)$$

  ### Método alternativo del producto constante generalizado
  En todo sistema de proporcionalidad compuesta, se conserva el cociente fundamental:
  $$\frac{Y^{(1)} \cdot I_1^{(1)} \cdot I_2^{(1)} \cdots}{D_1^{(1)} \cdot D_2^{(1)} \cdots} = \frac{Y^{(2)} \cdot I_1^{(2)} \cdot I_2^{(2)} \cdots}{D_1^{(2)} \cdot D_2^{(2)} \cdots} = k$$
  lo cual permite despejar la incógnita $Y^{(2)}$ mediante un simple cruce algebraico de términos.

  ### Esquema de construcción de fracciones
  | Tipo de Relación | Posición en la Fracción Multiplicativa | Formato del Factor |
  |---|---|---|
  | **Directa** | Normal (Final / Inicial) | $\frac{D^{(2)}}{D^{(1)}}$ |
  | **Inversa** | Invertida (Inicial / Final) | $\frac{I^{(1)}}{I^{(2)}}$ |

  ### Síntesis didáctica
  - Ecuación directa: $Y^{(2)} = Y^{(1)} \cdot \text{Factores Directos} \cdot \text{Factores Inversos Invertidos}$.
definiciones_clave: |
  - **Fórmula generalizada**: Ecuación producto que agrupa todos los factores de razón en una única expresión multiplicativa.
  - **Factores de razón**: Fracciones numéricas formadas por las parejas de datos de cada variable independiente.
  - **Ecuación de conservación de constante**: Igualdad de la forma $\frac{Y \cdot \text{Inversos}}{\text{Directos}} = k$.
propiedades_relaciones: |
  - **Invariancia estructural**: La fórmula generalizada funciona exactamente igual sin importar la cantidad de variables involucradas (3, 4, 5 o más).
  - **Cancelación de unidades**: Al multiplicar las fracciones adimensionales de razón, el resultado $Y^{(2)}$ conserva automáticamente las unidades de $Y^{(1)}$.
ejemplo_guiado:
  enunciado: 'En una fábrica, $6$ máquinas trabajando $8\text{ horas/día}$ fabrican $3.000$ envases en $5\text{ días}$. ¿Cuántos envases ($Y$) fabricarán $10$ máquinas trabajando $6\text{ horas/día}$ en $4\text{ días}$?'
  pasos:
    - 'Paso 1: Identificamos la incógnita: envases ($Y^{(1)} = 3.000$).'
    - 'Paso 2: Clasificamos cada variable respecto a los envases:\n- Máquinas (Directa): $6 \to 10 \implies \text{Factor } \frac{10}{6}$.\n- Horas/día (Directa): $8 \to 6 \implies \text{Factor } \frac{6}{8}$.\n- Días (Directa): $5 \to 4 \implies \text{Factor } \frac{4}{5}$.'
    - 'Paso 3: Formulamos la ecuación generalizada:\n$$Y^{(2)} = 3.000 \cdot \frac{10}{6} \cdot \frac{6}{8} \cdot \frac{4}{5}$$'
    - 'Paso 4: Simplificamos los factores: $3.000 \cdot \frac{10 \cdot 6 \cdot 4}{6 \cdot 8 \cdot 5} = 3.000 \cdot \frac{240}{240} = 3.000 \cdot 1 = 3.000\text{ envases}$. Fabricarán **3.000 envases**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la fórmula generalizada $Y^{(2)} = Y^{(1)} \cdot \text{Factores}$, ¿cómo se escribe el factor numérico correspondiente a una variable que es inversamente proporcional a la incógnita?'
    choices:
      - {text: 'Con el valor inicial en el numerador y el valor final en el denominador ($\frac{I^{(1)}}{I^{(2)}}$)', is_correct: true}
      - {text: 'Con el valor final en el numerador y el inicial en el denominador ($\frac{I^{(2)}}{I^{(1)}}$)', is_correct: false}
      - {text: 'Multiplicando ambos valores en lugar de dividirlos', is_correct: false}
      - {text: 'Restando el valor final al inicial', is_correct: false}
    explanation: 'La alternativa correcta es ''Con el valor inicial en el numerador y el valor final en el denominador ($\frac{I^{(1)}}{I^{(2)}}$)''. Las variables inversas entran con su razón invertida.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $Y^{(1)} = 500$, la variable $D$ directa pasa de $2$ a $6$, y la variable $I$ inversa pasa de $4$ a $2$, ¿cuál es el valor de $Y^{(2)}$?'
    choices:
      - {text: '$3.000$, calculando $500 \cdot \frac{6}{2} \cdot \frac{4}{2} = 500 \cdot 3 \cdot 2 = 3.000$', is_correct: true}
      - {text: '$750$, dividiendo en lugar de multiplicar', is_correct: false}
      - {text: '$500$, sin cambios', is_correct: false}
      - {text: '$1.500$, olvidando invertir la variable $I$', is_correct: false}
    explanation: 'La alternativa correcta es ''$3.000$, calculando $500 \cdot \frac{6}{2} \cdot \frac{4}{2} = 500 \cdot 3 \cdot 2 = 3.000$''. Factor $D = 6/2 = 3$; Factor $I = 4/2 = 2 \implies 500 \cdot 3 \cdot 2 = 3.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir el valor conocido de la incógnita $Y^{(1)}$.'
  - 'Paso 2: Determinar para cada variable independiente si es directa o inversa a $Y$.'
  - 'Paso 3: Construir las fracciones de razón: $(\frac{\text{Final}}{\text{Inicial}})$ para directas y $(\frac{\text{Inicial}}{\text{Final}})$ para inversas.'
  - 'Paso 4: Multiplicar $Y^{(1)}$ por todas las fracciones construidas y simplificar la expresión numérica.'
errores_correccion: |
  - **Error 1:** Invertir la fracción de una variable que es directamente proporcional a la incógnita. **Cómo corregirlo:** Las variables directas se escriben en su **orden natural: $\frac{\text{Valor Nuevo}}{\text{Valor Antiguo}}$**. Solo las inversas se invierten.
  - **Error 2:** Olvidar incluir una de las variables independientes en la cadena multiplicativa. **Cómo corregirlo:** Revisa que **todas las columnas de la tabla de datos** tengan su respectiva fracción en la fórmula final.
ejemplos:
  - titulo: 'Aplicación de fórmula con 3 variables'
    enunciado: 'Para $Y^{(1)}=100$, factor directo $\frac{4}{2}$ y factor inverso $\frac{5}{10}$, ¿el resultado es $100 \cdot 2 \cdot 0.5 = 100$?'
    alternativas:
      - 'Sí, pues $100 \cdot (4/2) \cdot (5/10) = 100$'
      - 'No, el resultado es 400'
      - 'No, el resultado es 50'
    respuesta: 'Sí, pues $100 \cdot (4/2) \cdot (5/10) = 100$'
    solucion_pasos:
      - '1. Factor directo $4/2 = 2$.'
      - '2. Factor inverso $5/10 = 0.5$.'
      - '3. Producto: $100 \cdot 2 \cdot 0.5 = 100$.'
  - titulo: 'Simplificación de fracciones antes de multiplicar'
    enunciado: 'Al simplificar las fracciones en la fórmula generalizada, ¿se obtiene exactamente la misma cifra que multiplicando todo directamente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la propiedad asociativa y conmutativa de los números reales.'
  - titulo: 'Fórmula para calcular días de trabajo'
    enunciado: 'Si Días $Y^{(2)} = \text{Días}^{(1)} \cdot \left(\frac{\text{Obreros}^{(1)}}{\text{Obreros}^{(2)}}\right) \cdot \left(\frac{\text{Obra}^{(2)}}{\text{Obra}^{(1)}}\right)$, ¿está bien planteada?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Obreros es inversa (invertida) y Obra es directa (normal).'
  - titulo: 'Comprobación de conservación de constante'
    enunciado: '¿La fórmula generalizada se deduce directamente de la conservación de la constante compuesta $k = \frac{Y \cdot \text{Inversas}}{\text{Directas}}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Igualando los cocientes $k_1 = k_2$ y despejando $Y^{(2)}$.'
errores_frecuentes:
  - 'Invertir la fracción de una variable que es directamente proporcional a la incógnita.'
  - 'No invertir la fracción correspondiente a una variable que es inversamente proporcional.'
  - 'En la fórmula generalizada se pueden descartar magnitudes independientes si el cálculo es muy extenso.'
  - 'Sumar los factores de razón en lugar de multiplicarlos en la fórmula generalizada.'
  - 'Reemplazar las fracciones por diferencias restadas entre los valores iniciales y finales.'
afirmaciones_verdaderas:
  - 'La fórmula generalizada de proporcionalidad compuesta calcula $Y^{(2)}$ multiplicando $Y^{(1)}$ por las razones directas $(\frac{\text{Nuevo}}{\text{Viejo}})$ e inversas $(\frac{\text{Viejo}}{\text{Nuevo}})$.'
  - 'El método del producto constante generalizado $\frac{Y \cdot \text{Inversas}}{\text{Directas}} = k$ produce el mismo resultado que la fórmula de razones compuestas.'
al_terminar_debes_poder: 'Aplicar la fórmula generalizada de proporcionalidad compuesta para calcular la incógnita en un solo paso multiplicativo.'
