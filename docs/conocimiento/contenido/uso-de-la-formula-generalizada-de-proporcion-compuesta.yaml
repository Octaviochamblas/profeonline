procedimiento:
- 'Paso 1: Identifica si cada variable secundaria es directa o inversa respecto a la principal.'
- 'Paso 2: Escribe la fórmula $K = (Principal \cdot Inversas) / Directas$.'
- 'Paso 3: Iguala la fórmula con los datos del Escenario 1 a la fórmula con los datos del
  Escenario 2, y despeja la incógnita.'
errores_correccion: Evita confundir los datos de entrada al operar con uso de la fórmula generalizada
  de proporción compuesta.
ejemplos:
- titulo: Aplicando la fórmula generalizada
  enunciado: La producción ($P$, principal) depende de los Obreros ($O$, directa) y de las
    Horas ($H$, directa).
  solucion_pasos:
  - Como $O$ y $H$ son directas respecto a $P$, van en el denominador.
  - 'Fórmula: $K = P / (O \cdot H)$.'
  - 'Si nos dan datos, igualamos: $P_1 / (O_1 \cdot H_1) = P_2 / (O_2 \cdot H_2)$.'
- titulo: Ejemplo 2
  enunciado: Si el tiempo T es inverso a los obreros O y directo a los metros M, ¿cuál es
    la fórmula de K?
  alternativas:
  - K = (T por O) / M
  - K = T / (O por M)
  - K = (O por M) / T
  respuesta: K = (T por O) / M
  solucion_pasos:
  - T es la incógnita principal, O es inversa (multiplica) y M es directa (divide).
- titulo: Ejemplo 3
  enunciado: Con K igual a (P por V) dividido entre D, y datos iniciales P=4, V=6, D=2, ¿cuál
    es K?
  alternativas:
  - '12'
  - '48'
  - 0,33
  respuesta: '12'
  solucion_pasos:
  - (4 por 6) dividido entre 2 es igual a 24 dividido entre 2, o sea 12.
- titulo: ¿La constante K calculada en la situación inicial debe ser igual a la de la situación
    final?
  respuesta: Sí
  solucion_pasos:
  - Esa igualdad es justamente la que permite despejar la incógnita.
errores_frecuentes:
- Poner las variables inversas en el denominador y las directas en el numerador.
- Olvidarse de incluir la variable principal en el numerador.
- Multiplicar todo en línea sin hacer división.
- Colocar las magnitudes directas en el numerador y las inversas en el denominador, invirtiendo
  la regla.
- Olvidar incluir la magnitud principal, la incógnita, al plantear la constante K.
afirmaciones_verdaderas:
- La propiedad de uso de la fórmula generalizada de proporción compuesta preserva la consistencia
  lógica.
- En la fórmula generalizada, las magnitudes con relación directa a la incógnita van en el
  denominador, y las inversas multiplican en el numerador junto a la incógnita.
al_terminar_debes_poder: Resolver problemas aplicados que involucren uso de la fórmula generalizada
  de proporción compuesta.
