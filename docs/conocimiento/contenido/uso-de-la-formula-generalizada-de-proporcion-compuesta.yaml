semantic_id: MAT.NUM.PROP_COMPUESTA.FORMULA_GENERALIZADA
resumen_inicial: 'Uso de la fórmula generalizada de proporción compuesta: concepto
  y propiedades fundamentales en Proporcionalidad compuesta.'
explicacion_simple: 'Si el método de las fracciones te parece lento, existe un ''atajo''
  usado por los ingenieros: la fórmula generalizada de proporcionalidad. Con ella,
  agruparás todas las variables en un solo paso matemático.'
explicacion_formal: 'En lugar de armar fracciones e invertirlas, podemos definir una
  gran **Constante de Proporcionalidad Compuesta ($K$)**.


  Para armarla, tomamos la variable principal (usualmente la que tiene la incógnita)
  y miramos su relación con las demás:

  - Si $A$ es **Inversa** a la principal, se **multiplica** ($A \cdot \text{Principal}$).

  - Si $B$ es **Directa** a la principal, se **divide** ($Principal / B$).


  Entonces, la expresión queda: $K = \frac{\text{Principal} \cdot \text{Inversas}}{\text{Directas}}$

  Esta expresión debe arrojar el mismo valor $K$ para la situación inicial y para
  la situación final.'
definiciones_clave: '- **Uso de la fórmula generalizada de proporción compuesta**:
  Elemento central dentro del estudio de Proporcionalidad compuesta.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a uso de la fórmula generalizada de proporción compuesta.'
ejemplo_guiado:
  enunciado: Aplica el concepto de uso de la fórmula generalizada de proporción compuesta
    en un ejercicio paso a paso.
  pasos:
  - Identificar los datos dados en el problema.
  - Aplicar la regla o fórmula correspondiente a uso de la fórmula generalizada de
    proporción compuesta.
  - Efectuar los cálculos aritméticos necesarios.
  - Concluir con el resultado final simplificado.
