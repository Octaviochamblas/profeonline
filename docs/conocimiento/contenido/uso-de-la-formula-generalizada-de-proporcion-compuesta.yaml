semantic_id: MAT.NUM.RAZONES_PROPORCIONES.COMPUESTA_FORMULA_GENERAL
resumen_inicial: 'La fórmula generalizada de proporcionalidad compuesta iguala la razón de la incógnita al producto de todas las razones directas y las razones inversas invertidas: $\frac{A_1}{A_2} = \prod \left(\frac{B_1}{B_2}\right) \cdot \prod \left(\frac{C_2}{C_1}\right)$.'
explicacion_simple: "![Fórmula generalizada](/static/img/nodos/uso-de-la-formula-generalizada-de-proporcion-compuesta-intro.svg)\n\nLa **fórmula generalizada** es la forma más rápida y elegante de resolver cualquier problema compuesto en un solo renglón:\n$$\\frac{A_1}{A_2} = \\left(\\frac{B_1}{B_2}\\right) \\cdot \\left(\\frac{C_2}{C_1}\\right) \\cdot \\left(\\frac{D_1}{D_2}\\right) \\cdots$$\n- **Regla mnemotécnica infalible:**\n  - **Lado izquierdo:** La razón de la incógnita siempre se escribe $\\frac{A_1}{A_2}$ (o $\\frac{A_1}{x}$).\n  - **Lado derecho:** Multiplicamos las razones de todas las demás magnitudes:\n    - Si es **Directa**: Se escribe tal cual $\\frac{B_1}{B_2}$ (1 sobre 2).\n    - Si es **Inversa**: Se da vuelta $\\frac{C_2}{C_1}$ (2 sobre 1).\n- **Consejo PRO:** Simplifica siempre las fracciones del lado derecho antes de despejar la $x$ final."
explicacion_formal: 'Sea un sistema general con $n$ variables donde $A$ es la variable dependiente.


  **Formulación Canónica del Producto de Razones:**


  $$\frac{A_1}{A_2} = \prod_{i \in \mathcal{D}} \left(\frac{X_{i,1}}{X_{i,2}}\right) \cdot \prod_{j \in \mathcal{I}} \left(\frac{X_{j,2}}{X_{j,1}}\right)$$


  donde $\mathcal{D}$ es el conjunto de índices de magnitudes directamente proporcionales a $A$ e $\mathcal{I}$ es el conjunto de índices de magnitudes inversamente proporcionales a $A$.


  **Despeje Explícito de la Incógnita $A_2 = x$:**


  $$x = A_1 \cdot \prod_{i \in \mathcal{D}} \left(\frac{X_{i,2}}{X_{i,1}}\right) \cdot \prod_{j \in \mathcal{I}} \left(\frac{X_{j,1}}{X_{j,2}}\right)$$'
definiciones_clave: '- **Fórmula canónica**: Ecuación producto $\frac{A_1}{A_2} = \prod R_D \cdot \prod R_I$.

  - **Simplificación previa**: Reducción de términos comunes antes del despeje algebraico.

  - **Factor global multiplicativo**: Escalar resultante del producto de razones.'
propiedades_relaciones: '- **Compactación**: Reduce $N$ etapas intermedias a una única línea operativa.

  - **Escalabilidad**: Aplica de manera idéntica para $3, 4, 5$ o más variables simultáneas.'
ejemplo_guiado:
  enunciado: '![Ejemplos de fórmula generalizada](/static/img/nodos/uso-de-la-formula-generalizada-de-proporcion-compuesta-ejemplos.svg)


    Resuelva usando la fórmula generalizada: $5$ impresoras imprimen $1.000$ libros en $4\text{ días}$. ¿Cuántos días tardarán $8$ impresoras en imprimir $3.200$ libros?'
  pasos:
  - 'Paso 1: Incógnita Días ($D$). Analizar tipos: Impresoras es INVERSA (más impresoras, menos días $\implies \frac{8}{5}$) y Libros es DIRECTA (más libros, más días $\implies \frac{1000}{3200}$).'
  - 'Paso 2: Estructurar la fórmula: $\frac{4}{x} = \left(\frac{8}{5}\right) \cdot \left(\frac{1000}{3200}\right)$.'
  - 'Paso 3: Simplificar: $\frac{1000}{3200} = \frac{5}{16} \implies \frac{4}{x} = \left(\frac{8}{5}\right) \cdot \left(\frac{5}{16}\right) = \frac{8}{16} = \frac{1}{2}$.'
  - 'Paso 4: Despejar $x$: $\frac{4}{x} = \frac{1}{2} \implies x = 4 \cdot 2 = 8\text{ días}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la estructura correcta de la fórmula generalizada para una incógnita A con B directa y C inversa?
  choices:
  - text: $\frac{A_1}{A_2} = \left(\frac{B_1}{B_2}\right) \cdot \left(\frac{C_2}{C_1}\right)$
    is_correct: true
  - text: $\frac{A_1}{A_2} = \left(\frac{B_2}{B_1}\right) \cdot \left(\frac{C_1}{C_2}\right)$
    is_correct: false
  - text: $\frac{A_1}{A_2} = \frac{B_1 + C_2}{B_2 + C_1}$
    is_correct: false
  - text: $\frac{A_1}{A_2} = B_1 \cdot B_2 \cdot C_1 \cdot C_2$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{A_1}{A_2} = \left(\frac{B_1}{B_2}\right) \cdot \left(\frac{C_2}{C_1}\right)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo ayudó simplificar (8/5) · (5/16) a 1/2 antes de despejar?
  choices:
  - text: Permitió reducir la ecuación a $4/x = 1/2$ despejando directamente $x = 8$ sin manejar números gigantes
    is_correct: true
  - text: Evitó tener que usar calculadora científica obligatoria
    is_correct: false
  - text: Cambió el resultado a un número entero
    is_correct: false
  - text: Permitió eliminar la incógnita x
    is_correct: false
  explanation: La alternativa correcta es 'Permitió reducir la ecuación a $4/x = 1/2$ despejando directamente $x = 8$ sin manejar números gigantes'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la razón de la incógnita $\frac{A_1}{x}$ en el lado izquierdo de la ecuación.'
- 'Paso 2: Escribir en el lado derecho el producto de las razones: $\frac{B_1}{B_2}$ para directas y $\frac{C_2}{C_1}$ para inversas.'
- 'Paso 3: Simplificar todos los factores comunes del lado derecho y despejar $x$ mediante producto cruzado básico.'
errores_correccion: '- **Error 1: Multiplicar numeradores gigantes sin simplificar.** **Cómo corregirlo:** Cancelar ceros y factores comunes (ej: $5$ con $5$, $8$ con $16$) antes de operar.

  - **Error 2: Confundir el orden de las fracciones inversas.** **Cómo corregirlo:** Verificar mnemotécnicamente: Directa = $1/2$, Inversa = $2/1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En la ecuación $\frac{6}{x} = \frac{3}{4} \cdot \frac{8}{9}$, ¿cuál es el valor de $x$ tras simplificar?
  alternativas:
  - $9$
  - $6$
  - $12$
  respuesta: $9$
  solucion_pasos:
  - $\frac{3}{4} \cdot \frac{8}{9} = \frac{24}{36} = \frac{2}{3} \implies \frac{6}{x} = \frac{2}{3} \implies 2x = 18 \implies x = 9$.
- titulo: Ejemplo 2
  enunciado: Si $\frac{10}{x} = \frac{2}{5} \cdot \frac{5}{2}$, ¿cuánto vale $x$?
  alternativas:
  - $10$
  - $20$
  - $5$
  respuesta: $10$
  solucion_pasos:
  - $\frac{2}{5} \cdot \frac{5}{2} = 1 \implies \frac{10}{x} = 1 \implies x = 10$.
- titulo: ¿Permite la fórmula generalizada resolver problemas con 4 o más magnitudes?
  respuesta: Sí
  solucion_pasos:
  - Sí, simplemente se siguen multiplicando razones al lado derecho.
  alternativas:
  - texto: Sí, la fórmula es extensible a cualquier número arbitrario de variables
    es_correcta: true
    retroalimentacion: ¡Correcto! Extensibilidad universal.
  - texto: No, está limitada estrictamente a 3 magnitudes
    es_correcta: false
    retroalimentacion: Incorrecto, soporta infinitas magnitudes acopladas.
  - texto: No, con 4 magnitudes se usa cálculo diferencial
    es_correcta: false
    retroalimentacion: Incorrecto, el producto de razones sigue aplicando.
- titulo: ¿Facilita la simplificación previa la resolución manual?
  respuesta: Sí
  solucion_pasos:
  - Sí, reduce drásticamente el tamaño de los números y previene errores aritméticos.
  alternativas:
  - texto: Sí, minimiza operaciones complejas y simplifica el despeje
    es_correcta: true
    retroalimentacion: ¡Correcto! Buena práctica algebraica.
  - texto: No, es obligatorio multiplicar todo primero
    es_correcta: false
    retroalimentacion: Incorrecto, simplificar antes es más eficiente.
  - texto: No, altera el resultado final
    es_correcta: false
    retroalimentacion: Incorrecto, simplificar fracciones preserva su valor exacto.
errores_frecuentes:
- Invertir magnitudes directas o mantener en orden original magnitudes inversas.
- Olvidar multiplicar las razones del lado derecho.
- Cometer errores de simplificación en fracciones compuestas.
- Colocar la incógnita invertida en el lado izquierdo.
afirmaciones_verdaderas:
- La fórmula generalizada iguala $\frac{A_1}{A_2}$ al producto de todas las razones de las variables auxiliares.
- Las variables directas se expresan como $\frac{B_1}{B_2}$ y las inversas como $\frac{C_2}{C_1}$.
- La simplificación cruzada de factores acelera y asegura la precisión del despeje.
al_terminar_debes_poder: '![Síntesis de fórmula generalizada](/static/img/nodos/uso-de-la-formula-generalizada-de-proporcion-compuesta-resumen.svg)


  QUÉ: Aplicar con destreza la fórmula generalizada de proporcionalidad compuesta.


  CÓMO: Estructurando la ecuación $\frac{A_1}{A_2} = \prod \left(\frac{B_1}{B_2}\right) \cdot \prod \left(\frac{C_2}{C_1}\right)$, simplificando los factores del producto y despejando la incógnita mediante multiplicación cruzada.'
