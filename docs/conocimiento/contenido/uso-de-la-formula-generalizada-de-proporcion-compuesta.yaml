semantic_id: MAT.NUM.PROP_COMPUESTA.FORMULA_GENERALIZADA
resumen_inicial: 'Uso de la fórmula generalizada de proporción compuesta: concepto y propiedades
  fundamentales en Proporcionalidad compuesta.'
explicacion_simple: 'Si el método de las fracciones te parece lento, existe un ''atajo'' usado
  por los ingenieros: la fórmula generalizada de proporcionalidad. Con ella, agruparás todas
  las variables en un solo paso matemático.'
explicacion_formal: 'En lugar de armar fracciones e invertirlas, podemos definir una gran
  **Constante de Proporcionalidad Compuesta ($K$)**.


  Para armarla, tomamos la variable principal (usualmente la que tiene la incógnita) y miramos
  su relación con las demás:

  - Si $A$ es **Inversa** a la principal, se **multiplica** ($A \cdot \text{Principal}$).

  - Si $B$ es **Directa** a la principal, se **divide** ($Principal / B$).


  Entonces, la expresión queda: $K = \frac{\text{Principal} \cdot \text{Inversas}}{\text{Directas}}$

  Esta expresión debe arrojar el mismo valor $K$ para la situación inicial y para la situación
  final.'
definiciones_clave: '- **Uso de la fórmula generalizada de proporción compuesta**: Elemento
  central dentro del estudio de Proporcionalidad compuesta.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a uso de la fórmula generalizada de proporción compuesta.'
ejemplo_guiado:
  enunciado: La producción P de una fábrica depende directamente de los obreros O y de las
    horas H trabajadas. Si con 5 obreros y 8 horas se producen 200 unidades, ¿cuántas unidades
    se producen con 7 obreros y 10 horas?
  pasos:
  - 'Como O y H son directas respecto a P, van en el denominador de la constante: K igual
    a P dividido entre (O por H).'
  - 'Calculo K con los datos iniciales: 200 dividido entre (5 por 8), es decir 200 dividido
    entre 40, igual a 5.'
  - 'Igualo K con la nueva situación: 5 igual a P2 dividido entre (7 por 10); despejo P2 igual
    a 5 por 70, o sea 350 unidades.'
checkpoints:
