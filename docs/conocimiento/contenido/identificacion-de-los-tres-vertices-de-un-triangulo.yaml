semantic_id: MAT.GEO.TRIANGULOS_DEF.VERTICES
resumen_inicial: Los vértices de un triángulo son los tres puntos no colineales donde
  se intersectan los pares de lados consecutivos, denotados formalmente con letras
  mayúsculas (A, B, C).
explicacion_simple: '![Vértices de un Triángulo](/static/img/nodos/identificacion-de-los-tres-vertices-de-un-triangulo-intro.svg)


  Las tres esquinas o puntas de un triángulo se llaman **vértices**. Siempre se escriben
  con letras mayúsculas de imprenta como $A$, $B$ y $C$. El nombre completo del triángulo
  se forma uniendo las letras de sus tres vértices: $\triangle ABC$.'
explicacion_formal: '### Definición formal

  En un triángulo $\Delta ABC$, los **vértices** son los tres puntos extremos no colineales
  donde intersectan los pares de segmentos de frontera:


  $$\operatorname{Vértices}(\Delta ABC) = \{A, B, C\} = \{ \overline{AB} \cap \overline{CA},
  \; \overline{AB} \cap \overline{BC}, \; \overline{BC} \cap \overline{CA} \}$$


  ### Desglose simbólico y geométrico

  - $A, B, C$: Puntos discretos en el plano designados obligatoriamente con letras
  mayúsculas de imprenta.

  - Puntos de concurrencia: Cada vértice es el origen de dos rayos que contienen a
  los lados del triángulo y delimitan un ángulo interior.

  - Sistema de referencia afín: Tres vértices no colineales determinan de manera unívoca
  el plano que contiene a la figura.


  ### Síntesis didáctica

  Los vértices son los nodos estructurales que determinan completamente las longitudes
  de los lados, las aberturas angulares y la posición espacial del triángulo.'
definiciones_clave: '- **Vértice**: Punto del plano donde se unen dos lados de un
  triángulo.

  - **Conjunto de vértices**: Tres puntos $\{A, B, C\}$ que definen la posición espacial
  del polígono.

  - **Vértice opuesto**: El vértice que no pertenece a un lado dado (el vértice $A$
  es opuesto al lado $\overline{BC}$). '
propiedades_relaciones: '- **Independencia del orden**: Los nombres $\triangle ABC$,
  $\triangle BCA$, $\triangle CAB$, $\triangle CBA$, $\triangle BAC$ y $\triangle
  ACB$ refieren todos al mismo objeto geométrico.

  - **Coordenadas cartesianas**: En geometría analítica, los tres vértices se representan
  por sus pares ordenados $(x_A, y_A), (x_B, y_B), (x_C, y_C)$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Vértices](/static/img/nodos/identificacion-de-los-tres-vertices-de-un-triangulo-ejemplos.svg)


    En un triángulo cuyos lados son los segmentos $\overline{MN}$, $\overline{NP}$
    y $\overline{PM}$, identifica cuáles son sus tres vértices y escribe el nombre
    del triángulo.'
  pasos:
  - 'Paso 1: Observar los puntos extremos de cada segmento: $M, N$ y $P$.'
  - 'Paso 2: Verificar las intersecciones: $\overline{MN} \cap \overline{NP} = N$,
    $\overline{NP} \cap \overline{PM} = P$, $\overline{PM} \cap \overline{MN} = M$.'
  - 'Paso 3: Identificar los 3 vértices: $M$, $N$ y $P$.'
  - 'Paso 4: Escribir el nombre del triángulo con la notación formal: $\triangle MNP$.'
checkpoints:
