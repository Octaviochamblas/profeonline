  question: ¿Cómo se deben escribir formalmente los nombres de los vértices de un
    triángulo?
  choices:
  - text: Con letras mayúsculas de imprenta (como A, B, C)
    is_correct: true
  - text: Con letras minúsculas (como a, b, c)
    is_correct: false
  - text: Con números arábigos únicamente
    is_correct: false
  - text: Con letras griegas únicamente
    is_correct: false
  explanation: En la convención matemática formal los vértices son puntos y se escriben
    con letras mayúsculas de imprenta (como A, B, C).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántos vértices tiene exactamente cualquier triángulo plano?
  choices:
  - text: Exactamente 3 vértices
    is_correct: true
  - text: 4 vértices
    is_correct: false
  - text: 6 vértices
    is_correct: false
  - text: 2 vértices
    is_correct: false
  explanation: Todo triángulo posee por definición exactamente 3 vértices.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar las 3 esquinas o intersecciones del triángulo.'
- 'Paso 2: Asignar una letra mayúscula de imprenta a cada punto ($A, B, C$).'
- 'Paso 3: Usar las tres letras para nombrar el triángulo con el prefijo $\triangle$.'
errores_correccion: 'No uses letras minúsculas para nombrar vértices: las minúsculas
  se reservan para nombrar las longitudes de los lados.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un triángulo tiene vértices en $R$, $S$ y $T$, ¿cuál es una notación
    válida para este triángulo?
  alternativas:
  - $ riangle RST$
  - $ riangle rst$
  - $\angle RST$
  respuesta: $ riangle RST$
  solucion_pasos:
  - Se usa el símbolo de triángulo $ riangle$ acompañado de las letras mayúsculas de sus vértices: $
      riangle RST$.
- titulo: Ejemplo 2
  enunciado: En el triángulo $ riangle ABC$, ¿cuál es el vértice opuesto al lado $\overline{BC}$?
  alternativas:
  - El vértice $A$
  - El vértice $B$
  - El vértice $C$
  respuesta: El vértice $A$
  solucion_pasos:
  - El lado $\overline{BC}$ conecta $B$ y $C$; por lo tanto, el tercer vértice no
    perteneciente a dicho segmento es $A$.
- titulo: ¿Un triángulo tiene exactamente 3 vértices?
  respuesta: Sí
  solucion_pasos:
  - Sí, todo triángulo está determinado por exactamente 3 vértices.
- titulo: ¿Los vértices de un triángulo se pueden denotar con letras minúsculas como
    a, b, c?
  respuesta: 'No'
  solucion_pasos:
  - No, por convención geométrica los vértices son puntos y se denotan obligatoriamente
    con letras mayúsculas.
errores_frecuentes:
- Usar letras minúsculas para los vértices.
- Confundir vértice (punto adimensional) con lado (segmento unidimensional).
- Confundir vértice con la medida del ángulo interior.
- Pensar que cambiar el orden de las letras al nombrar el triángulo altera la figura
  geométrica.
- Olvidar el símbolo $\triangle$ al referirse a un triángulo en una demostración.
afirmaciones_verdaderas:
- Los vértices de un triángulo son los puntos de intersección de sus lados.
- Todo triángulo plano tiene exactamente 3 vértices no colineales.
al_terminar_debes_poder: '**QUÉ:** Identificar, ubicar y denotar correctamente los
  tres vértices de cualquier triángulo.


  **CÓMO:** Reconociendo las intersecciones de los lados y aplicando la notación formal
  con letras mayúsculas ($A, B, C$).


  ![Resumen de los Vértices del Triángulo](/static/img/nodos/identificacion-de-los-tres-vertices-de-un-triangulo-resumen.svg)'
