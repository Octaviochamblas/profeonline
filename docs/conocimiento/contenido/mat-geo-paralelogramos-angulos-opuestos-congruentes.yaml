semantic_id: MAT.GEO.PARALELOGRAMOS.ANGULOS_OPUESTOS_CONGRUENTES
resumen_inicial: 'Propiedad de ángulos opuestos congruentes en paralelogramos: conceptos,
  teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Así como ocurre con los lados, los ángulos de un paralelogramo
  también siguen un patrón de igualdad entre sus elementos opuestos.
explicacion_formal: '![Ángulos opuestos congruentes en un paralelogramo](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-angulos-opuestos-congruentes.svg)


  ### Definición formal


  En un paralelogramo $ABCD$, se cumple $\angle A=\angle C$ y $\angle B=\angle D$.
  Además, los ángulos consecutivos (adyacentes) son suplementarios: $\angle A+\angle
  B=180°$.


  ### Desarrollo didáctico


  Un paralelogramo con un ángulo de 70° tiene su ángulo opuesto también de 70°, y
  sus dos ángulos adyacentes (consecutivos) de $180°-70°=110°$ cada uno.'
