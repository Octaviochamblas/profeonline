semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.INTERPRETACION_EXPONENTE
resumen_inicial: 'El exponente $n$ en un modelo de función potencia $f(x) = a x^n$ determina la elasticidad de escala, la dimensión geométrica o la ley de física que gobierna el fenómeno.'
explicacion_simple: |
  En un modelo de función potencia $f(x) = a x^n$, el exponente $n$ no es simplemente un número decorativo; es la "huella digital" física del fenómeno. El signo y el valor de $n$ nos dicen qué tipo de fenómeno estamos midiendo:
  - $n = 1$: Proporcionalidad directa lineal (medidas de longitud).
  - $n = 2$: Crecimiento de superficie o área plana (fenómenos bidimensionales).
  - $n = 3$: Crecimiento de volumen o masa (fenómenos tridimensionales).
  - $n = -1$ o $n = -2$: Relaciones inversas de atenuación o dispersión de energía en la distancia.
explicacion_formal: |
  ### Definición formal
  La **interpretación contextual del exponente $n$** en el modelo $f(x) = a x^n$ define la **elasticidad de la respuesta** frente a variaciones porcentuales de la variable independiente:
  $$n = \frac{d(\ln y)}{d(\ln x)} = \frac{\% \Delta y}{\% \Delta x}$$
  El exponente $n$ indica que ante un cambio proporcional de un $1\%$ en la variable $x$, la variable $y$ responde con una variación aproximada del $n\%$.

  ### Taxonomía Contextual de los Exponentes $n$
  1. **$n = 2$ (Exponente Cuadrático)**: Fenómenos geométricos de área ($A \propto r^2$), energía cinética ($E \propto v^2$) y presión hidrodinámica ($q \propto v^2$).
  2. **$n = 3$ (Exponente Cúbico)**: Fenómenos tridimensionales de volumen ($V \propto s^3$), masa ($M \propto r^3$) y potencia eólica ($P \propto v^3$).
  3. **$n = -2$ (Exponente Cuadrado Inverso)**: Leyes de atenuación de campos de fuerza conservativos (gravedad, radiación, sonido, ley de Coulomb).
  4. **$n = 1/2$ (Exponente Fraccionario Un Medio)**: Fenómenos de velocidad de escape, periodos de péndulo o ley de difusión de Fick.

  ### Síntesis didáctica
  Significado del signo de $n$:
  - Exponente $n > 0 \implies$ Relación directa de crecimiento (al aumentar $x$, aumenta $y$).
  - Exponente $n < 0 \implies$ Relación inversa de atenuación (al aumentar $x$, disminuye $y$).
definiciones_clave: |
  - **Exponente $n$**: Potencia matemática que establece la ley de escala y sensibilidad entre las variables.
  - **Elasticidad de escala**: Variación porcentual de la respuesta ante un cambio porcentual unitario del insumo.
  - **Dimensión del modelo**: Dimensión geométrica o física (longitud $n=1$, superficie $n=2$, espacio $n=3$).
propiedades_relaciones: |
  - **Adimensionalidad del exponente $n$**: El exponente $n$ es un número adimensional puro que carece de unidades de medida físicas.
  - **Independencia del parámetro $a$**: El parámetro $n$ dicta la forma de la curva y el factor de escala proporcional $c^n$, con independencia del coeficiente $a$.
ejemplo_guiado:
  enunciado: 'Un astrofísico estudia la aceleración de la gravedad $g(r) = G \cdot M \cdot r^{-2}$ que ejerce un planeta a una distancia $r$. Interpreta el significado físico del exponente $n = -2$ y analiza qué le sucede a la gravedad si un satélite se aleja al triple de distancia.'
  pasos:
    - 'Paso 1: Significado del signo negativo ($n < 0$): Indica un decrecimiento o atenuación; a mayor distancia $r$, menor aceleración de gravedad.'
    - 'Paso 2: Significado del valor numérico ($|-2| = 2$): Indica la ley del cuadrado inverso, donde la fuerza decae con la superficie esférica de propagación de campo.'
    - 'Paso 3: Triplicación de la distancia ($c = 3$): La aceleración se multiplica por el factor $3^{-2} = \frac{1}{3^2} = \frac{1}{9}$.'
    - 'Paso 4: Conclusión: El exponente $n = -2$ determina que al triplicar la distancia, la gravedad disminuye a la novena parte de su valor.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un estudio de biometría animal, el consumo metabólico basal $M(w) = a w^{3/4}$ de un mamífero depende de su peso $w$. ¿Qué representa contextualmente el exponente $n = 3/4$?'
    choices:
      - {text: 'Representa la ley de escala biológica que establece que por cada $1\%$ de aumento en el peso del animal, el consumo metabólico aumenta en un $0.75\%$', is_correct: true}
      - {text: 'Representa la velocidad máxima a la que corre el animal', is_correct: false}
      - {text: 'Representa el peso inicial cuando el metabolismo es cero', is_correct: false}
      - {text: 'Representa la temperatura corporal en grados Celsius', is_correct: false}
    explanation: 'La alternativa correcta es ''Representa la ley de escala biológica que establece que por cada $1\%$ de aumento en el peso del animal, el consumo metabólico aumenta en un $0.75\%$''. La elasticidad $n = 3/4 = 0.75$ indica la tasa de respuesta porcentual.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en un modelo potencia $y = a x^n$ sabemos que el signo del exponente es negativo ($n < 0$), ¿qué tipo de relación existe entre la variable de entrada $x$ y la respuesta $y$?'
    choices:
      - {text: 'Existe una relación inversa de atenuación, donde la respuesta $y$ disminuye a medida que la variable $x$ aumenta', is_correct: true}
      - {text: 'Existe una relación de crecimiento acelerado polinomial', is_correct: false}
      - {text: 'La variable de respuesta $y$ es constante e inmóvil', is_correct: false}
      - {text: 'La respuesta es siempre un número complejo', is_correct: false}
    explanation: 'La alternativa correcta es ''Existe una relación inversa de atenuación, donde la respuesta $y$ disminuye a medida que la variable $x$ aumenta''. El signo negativo de $n$ invierte el sentido de la variación.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el exponente $n$ en la fórmula de la función potencia $y = a x^n$.'
  - 'Paso 2: Analizar el signo de $n$: declarar crecimiento directo (si $n > 0$) o atenuación inversa (si $n < 0$).'
  - 'Paso 3: Analizar el valor entero o fraccionario de $n$: vincularlo con la dimensión espacial (superficie 2, volumen 3) o elasticidad.'
  - 'Paso 4: Explicar el factor de amplificación de salida $c^n$ cuando la entrada escala por $c$.'
errores_correccion: |
  - **Error 1:** Confundir el signo del exponente $n$ con el signo del coeficiente $a$. **Cómo corregirlo:** El signo del coeficiente $a$ determina si la gráfica abre hacia arriba o hacia abajo (orientación vertical). El signo del exponente $n$ determina si el modelo es de crecimiento directo ($n > 0$) o decrecimiento inverso ($n < 0$).
  - **Error 2:** Creer que el exponente $n$ tiene unidades físicas de medida. **Cómo corregirlo:** El exponente $n$ es una potencia matemática pura y adimensional; no lleva unidades de metros o segundos.
ejemplos:
  - titulo: 'Interpretación de exponente 2 en superficies'
    enunciado: 'En $A(r) = \pi r^2$, ¿el exponente 2 representa la dimensión bidimensional del área?'
    alternativas:
      - 'Sí, dimensión bidimensional de superficie'
      - 'No, representa el volumen'
      - 'No, representa el perímetro'
    respuesta: 'Sí, dimensión bidimensional de superficie'
    solucion_pasos:
      - '1. El exponente $n = 2$ es característico de áreas bidimensionales.'
      - '2. Mide la superficie plana.'
  - titulo: 'Interpretación de exponente negativo en propagación'
    enunciado: 'En $I(d) = k d^{-2}$, ¿el exponente $-2$ indica una atenuación cuadrática en la distancia?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El signo negativo indica atenuación y el 2 indica dispersión en superficie esférica.'
  - titulo: 'Elasticidad en exponente unitario'
    enunciado: 'Si $n = 1$ en $y = a x^1$, ¿un aumento de $1\%$ en $x$ aumenta $y$ en $1\%$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En modelos lineales de exponente 1, la elasticidad es unitaria.'
  - titulo: 'Adimensionalidad del exponente'
    enunciado: '¿El exponente $n$ en $y = a x^n$ carece de unidades de medida?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Los exponentes son números adimensionales puros.'
errores_frecuentes:
  - 'El signo del exponente $n$ en un modelo de potencia indica si el coeficiente $a$ es positivo o negativo.'
  - 'Un exponente $n = 3$ representa la medición de una superficie bidimensional plana.'
  - 'El exponente $n$ de una función potencia lleva unidades de metros al cuadrado.'
  - 'Si el exponente $n$ es negativo, la respuesta del modelo $y$ es siempre un número negativo.'
  - 'El exponente $n$ cambia de valor cuando duplicamos la variable independiente $x$.'
afirmaciones_verdaderas:
  - 'En un modelo de función potencia $f(x) = a x^n$, el exponente $n$ es un parámetro adimensional que define la ley física de escala, la dimensión geométrica y la elasticidad de respuesta.'
  - 'Un exponente positivo $n > 0$ indica una relación de crecimiento directo, mientras que un exponente negativo $n < 0$ indica una relación de atenuación inversa.'
al_terminar_debes_poder: |
  QUÉ: Interpretar la sensibilidad y dimensión del exponente $n$ en un modelo contextual.
  CÓMO: Evaluar el grado de respuesta o intensidad de cambio de la variable dependiente ante variaciones en la base.
