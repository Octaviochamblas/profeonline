semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.INTERES_COMPUESTO
resumen_inicial: 'Aplicación de la función exponencial en problemas de interés compuesto:
  conceptos, asíntotas, propiedades e inversidad en Análisis gráfico y modelamiento
  exponencial.'
explicacion_simple: A diferencia del interés simple (que suma siempre la misma cantidad),
  el interés compuesto reinvierte las ganancias anteriores, generando un crecimiento
  exponencial del capital.
explicacion_formal: '### Definición formal


  El capital $C(t)$ acumulado tras $t$ períodos de inversión a una tasa de interés
  $i$ (como decimal) por período, con capitalización compuesta, es $C(t)=C_0\cdot(1+i)^t$,
  donde $C_0$ es el capital inicial invertido.


  ### Desarrollo didáctico


  Es fundamental verificar que la tasa de interés y el número de períodos estén expresados
  en las mismas unidades de tiempo (por ejemplo, ambos en años, o ambos en meses).


  Con un capital inicial de $\$1.000.000$ a una tasa anual del $5\%$: el modelo es
  $C(t)=1.000.000\cdot(1{,}05)^t$; después de $10$ años, $C(10)=1.000.000\cdot(1{,}05)^{10}\approx\$1.628.895$.'
definiciones_clave: '- **Aplicación de la función exponencial en problemas de interés
  compuesto**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a aplicación de la función exponencial en problemas de interés compuesto.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de aplicación
    de la función exponencial en problemas de interés compuesto.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de aplicación de la función exponencial
    en problemas de interés compuesto.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    aplicación de la función exponencial en problemas de interés compuesto?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis gráfico
      y modelamiento exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis gráfico y modelamiento exponencial. Es la condición
    de existencia para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en aplicación de la función exponencial en problemas de interés compuesto?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el capital inicial $C_0$ y la tasa de interés $i$ por período.'
- 'Paso 2: Convierte la tasa a decimal y calcula la base $1+i$.'
- 'Paso 3: Plantea el modelo $C(t)=C_0\cdot(1+i)^t$.'
- 'Paso 4: Evalúa el modelo en el número de períodos solicitado.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en aplicación
  de la función exponencial en problemas de interés compuesto.
ejemplos:
- titulo: Cálculo de capital acumulado
  enunciado: Se invierten $\$500.000$ a una tasa anual del $8\%$ con capitalización
    compuesta. Calcula el capital después de $2$ años.
  solucion_pasos:
  - 'Modelo: $C(t)=500.000\cdot(1{,}08)^t$.'
  - $C(2)=500.000\cdot(1{,}08)^2=500.000\cdot1{,}1664=\$583.200$.
- titulo: Planteamiento del modelo desde datos del problema
  enunciado: Un capital de $\$2.000.000$ se invierte a una tasa mensual del $1{,}5\%$.
    Plantea el modelo de interés compuesto.
  solucion_pasos:
  - La tasa decimal es $0{,}015$.
  - $C(t)=2.000.000\cdot(1{,}015)^t$, donde $t$ se mide en meses.
- titulo: ¿El interés compuesto crece más rápido que el interés simple a largo plazo?
  enunciado: ¿El interés compuesto crece más rápido que el interés simple a largo
    plazo?
  respuesta: Sí
  solucion_pasos:
  - El interés compuesto reinvierte las ganancias anteriores, generando un crecimiento
    exponencial más rápido que el crecimiento lineal del interés simple.
- titulo: ¿Es necesario que la tasa y el número de períodos estén en la misma unidad
    de tiempo?
  enunciado: ¿Es necesario que la tasa y el número de períodos estén en la misma unidad
    de tiempo?
  respuesta: Sí
  solucion_pasos:
  - Si la tasa es anual, $t$ debe medirse en años; si es mensual, $t$ debe medirse
    en meses.
errores_frecuentes:
- Usar el porcentaje directamente (por ejemplo, 8) en vez de su forma decimal (0,08)
  en la base.
- Declarar la tasa por período con la tasa anual cuando la capitalización es más frecuente
  que anual.
- No verificar que las unidades de la tasa y del tiempo coincidan.
- Declarar el modelo de interés compuesto con el de interés simple, que crece linealmente.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando aplicación de la función exponencial en problemas de interés compuesto.
