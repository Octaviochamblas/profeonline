semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.INTERES_COMPUESTO
resumen_inicial: 'El interés compuesto aplica la función exponencial $C(t) = C_0 \cdot (1 + i)^t$ para calcular el capital acumulado al reinvertir periódicamente los intereses generados.'
explicacion_simple: |
  El interés compuesto es la fuerza más potente de las finanzas personales porque genera "interés sobre interés". A diferencia del interés simple (donde la ganancia se calcula siempre sobre el dinero original), en el interés compuesto los intereses ganados al final de cada periodo se suman al capital, de modo que en el siguiente periodo se ganan intereses sobre un pozo más grande. Esto sigue exactamente una fórmula exponencial $C(t) = C_0 \cdot (1 + i)^t$.
explicacion_formal: |
  ### Definición formal
  El **modelo de capitalización por interés compuesto** para un capital inicial $C_0 > 0$, una tasa de interés nominal anual $i > 0$ y una frecuencia de capitalización de $n$ periodos por año se define analíticamente mediante la función exponencial de monto acumulado $M: \mathbb{R}^+ \to \mathbb{R}^+$:
  $$M(t) = C_0 \cdot \left(1 + \frac{i}{n}\right)^{n t}$$
  donde $t$ es el tiempo en años y $n t$ es el número total de periodos de capitalización transcurridos.

  ### Desglose simbólico
  - Capitalización anual ($n = 1$): $M(t) = C_0 \cdot (1 + i)^t$.
  - Capitalización mensual ($n = 12$): $M(t) = C_0 \cdot \left(1 + \frac{i}{12}\right)^{12 t}$.
  - Ganancia neta de intereses: $I(t) = M(t) - C_0 = C_0 \left[\left(1 + \frac{i}{n}\right)^{n t} - 1\right]$.
  - Límite de capitalización continua ($n \to +\infty$): $M(t) = C_0 \cdot e^{i t}$.

  ### Síntesis didáctica
  Diferenciar interés simple de compuesto: En el interés simple $M(t) = C_0 (1 + i \cdot t)$, la ganancia crece linealmente. En el interés compuesto $M(t) = C_0 (1 + i)^t$, la ganancia crece exponencialmente porque los intereses pasados generan nuevos intereses.
definiciones_clave: |
  - **Capital inicial $C_0$**: Monto original depositado o invertido en el periodo $t = 0$.
  - **Tasa de interés $i$**: Porcentaje de rendimiento por periodo de capitalización expresado como fracción decimal.
  - **Periodo de capitalización $n$**: Frecuencia anual en la que los intereses se liquidan e incorporan al capital.
propiedades_relaciones: |
  - **Efecto de la frecuencia $n$**: A mayor frecuencia de capitalización $n$ (ej: diaria vs anual), mayor es el monto final acumulado $M(t)$ para la misma tasa nominal $i$.
  - **Regla del 72 (Aproximación)**: El tiempo aproximado en años necesario para duplicar un capital a tasa $i\%$ es $t_{\text{dup}} \approx \frac{72}{100i}$.
ejemplo_guiado:
  enunciado: 'Un inversionista deposita un capital de 2.000.000 de pesos a una tasa de interés compuesto anual del $6\%$ con capitalización anual. Formula la función del monto $M(t)$, calcula el dinero acumulado al cabo de 3 años y determina la ganancia neta en pesos.'
  pasos:
    - 'Paso 1: Identificamos $C_0 = 2000000$, tasa $i = 6\% = 0.06$ y capitalización anual $n = 1$.'
    - 'Paso 2: La base es $b = 1 + 0.06 = 1.06$. La función es $M(t) = 2000000 \cdot (1.06)^t$.'
    - 'Paso 3: Para $t = 3\text{ años}$, evaluamos $M(3) = 2000000 \cdot (1.06)^3$.'
    - 'Paso 4: Calculamos $(1.06)^3 = 1.191016$. Sustituimos: $M(3) = 2000000 \cdot 1.191016 = 2382032\text{ pesos}$.'
    - 'Paso 5: La ganancia de interés neta es $I = 2382032 - 2000000 = 382032\text{ pesos}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si se deposita un capital $C_0 = 500000$ pesos a una tasa de interés compuesto del $8\%$ anual capitalizable anualmente, ¿cuál es la función de monto acumulado $M(t)$ al cabo de $t$ años?'
    choices:
      - {text: '$M(t) = 500000 \cdot (1.08)^t$', is_correct: true}
      - {text: '$M(t) = 500000 \cdot (0.08)^t$', is_correct: false}
      - {text: '$M(t) = 500000 + 40000t$', is_correct: false}
      - {text: '$M(t) = 540000t$', is_correct: false}
    explanation: 'La alternativa correcta es ''$M(t) = 500000 \cdot (1.08)^t$''. La base se obtiene sumando la unidad a la tasa decimal: $b = 1 + 0.08 = 1.08$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Un depósito de 1.000.000 de pesos se coloca a una tasa de interés compuesto del $10\%$ anual. ¿Cuál es el monto total acumulado al cabo de 2 años con capitalización anual?'
    choices:
      - {text: '1.210.000 pesos', is_correct: true}
      - {text: '1.200.000 pesos', is_correct: false}
      - {text: '1.100.000 pesos', is_correct: false}
      - {text: '2.100.000 pesos', is_correct: false}
    explanation: 'La alternativa correcta es ''1.210.000 pesos''. Calculamos $M(2) = 1000000 \cdot (1.10)^2 = 1000000 \cdot 1.21 = 1210000\text{ pesos}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el capital inicial $C_0$ y la tasa de interés nominal $i$ (convertida a número decimal).'
  - 'Paso 2: Identificar la frecuencia de capitalización anual $n$ (ej: $n = 1$ para anual, $n = 12$ para mensual).'
  - 'Paso 3: Construir la función de monto acumulado $M(t) = C_0 \cdot \left(1 + \frac{i}{n}\right)^{n t}$.'
  - 'Paso 4: Evaluar la función en el tiempo $t$ solicitado y restar $C_0$ si se pregunta por el interés ganado.'
errores_correccion: |
  - **Error 1:** Usar la fórmula de interés simple en un problema de interés compuesto. **Cómo corregirlo:** El interés compuesto exige que el tiempo $t$ actúe como exponente $(1+i)^t$, no como multiplicador lineal $1 + i \cdot t$.
  - **Error 2:** Olvidar convertir el porcentaje de tasa a decimal (ej: usar $i = 5$ en lugar de $i = 0.05$). **Cómo corregirlo:** La tasa debe ser dividida por 100 antes de incorporarla al paréntesis de la base: $1 + \frac{5}{100} = 1.05$.
ejemplos:
  - titulo: 'Formulación de modelo de interés compuesto'
    enunciado: '¿Cuál es la base $b$ para un depósito con interés compuesto del $4\%$ anual?'
    alternativas:
      - '$b = 1.04$'
      - '$b = 0.04$'
      - '$b = 4$'
    respuesta: '$b = 1.04$'
    solucion_pasos:
      - '1. Tasa $i = 4\% = 0.04$.'
      - '2. Base $b = 1 + 0.04 = 1.04$.'
  - titulo: 'Diferencia con el interés simple'
    enunciado: 'A 2 años, con $C_0 = 100$ e $i = 10\%$, ¿el interés compuesto ($121$) rinde más que el simple ($120$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En el año 2, el compuesto genera el $10\%$ sobre $110$ (ganando $11$), alcanzando $121$.'
  - titulo: 'Capitalización semestral'
    enunciado: 'Si una tasa del $10\%$ anual se capitaliza semestralmente ($n = 2$), ¿la tasa del periodo es $5\%$ ($i/2 = 0.05$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dividimos la tasa anual entre los 2 semestres del año: $\frac{10\%}{2} = 5\% = 0.05$.'
  - titulo: 'Monto inicial a tiempo cero'
    enunciado: 'En la función de interés compuesto $M(t) = C_0 (1.05)^t$, ¿evaluar $t = 0$ devuelve el capital inicial $C_0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $M(0) = C_0 (1.05)^0 = C_0 \cdot 1 = C_0$.'
errores_frecuentes:
  - 'El monto en interés compuesto se calcula sumando la tasa al capital y multiplicando por el tiempo $M(t) = C_0 + i \cdot t$.'
  - 'Una tasa de interés compuesto del $5\%$ anual genera una base $b = 0.05$ en la función exponencial.'
  - 'El interés compuesto produce exactamente la misma ganancia de dinero en todos los periodos anuales.'
  - 'Al capitalizar mensualmente una tasa anual $i$, el exponente del tiempo en años sigue siendo simplemente $t$.'
  - 'El capital inicial $C_0$ se obtiene multiplicando la base exponencial por el número de años.'
afirmaciones_verdaderas:
  - 'El interés compuesto se modela mediante la función exponencial $M(t) = C_0 \cdot (1 + i)^t$, donde los intereses generados se reinvierten en cada periodo.'
  - 'En el interés compuesto, la ganancia de dinero acumulada por periodo es estrictamente creciente debido al efecto multiplicativo de la potencia.'
