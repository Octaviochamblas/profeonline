semantic_id: MAT.ALG.INECUACIONES_LINEALES.VERIFICACION_SOLUCION
resumen_inicial: Verificar una solución particular consiste en sustituir un número en la inecuación original y comprobar que la desigualdad resultante sea verdadera.
explicacion_simple: '![Verificación de una solución particular en una inecuación](/static/img/nodos/verificacion-de-una-solucion-particular-en-una-inecuacion-intro.svg)


  Para comprobar si un número específico (como $x = 5$) es solución de una inecuación (como $2x - 3 < 10$):

  Reemplazamos la $x$ por $5$ en la inecuación inicial y calculamos:

  $2(5) - 3 = 10 - 3 = 7 < 10$.

  Como $7 < 10$ es VERDADERO, confirmamos que $x = 5$ es una solución particular válida.'
explicacion_formal: 'Dada la inecuación $P(x) \ R \ Q(x)$ y una constante $c \in \mathbb{R}$, el **criterio de pertenencia particular** exige comprobar:


  $$P(c) \ R \ Q(c) \quad \text{es una proposición numérica verdadera}$$


  $$\text{Si } P(c) \ R \ Q(c) \text{ es verdadero } \implies c \in S$$

  $$\text{Si } P(c) \ R \ Q(c) \text{ es falso } \implies c \notin S$$'
definiciones_clave: '- **Solución particular**: Valor numérico individual $c$ que satisface la inecuación.

  - **Verificación por sustitución**: Prueba directa para determinar la validez de un número puntual en el conjunto solución.'
propiedades_relaciones: '- **Herramienta de control**: Permite confirmar si el intervalo solución despejado fue calculado correctamente.'
ejemplo_guiado:
  enunciado: '![Ejemplo Verificación de una solución particular en una inecuación](/static/img/nodos/verificacion-de-una-solucion-particular-en-una-inecuacion-ejemplos.svg)


    Verifica si los números particulares $x = 4$ y $x = 10$ son soluciones válidas para la inecuación $3x + 2 < 20$.'
  pasos:
  - 'Paso 1: Evaluar para $x = 4$: $3(4) + 2 = 12 + 2 = 14 < 20$ (VERDADERO $\implies x = 4$ SI es solución).Paso 2: Evaluar para $x = 10$: $3(10) + 2 = 30 + 2 = 32 < 20$ (FALSO $\implies x = 10$ NO es solución).Paso 3: Concluir que $4 \in S$ y $10 \notin S$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al verificar $x = 4$ en la inecuación $3x + 2 < 20$, ¿cuál es el resultado del primer miembro y su veracidad?
  choices:
  - text: $14 < 20$ (Verdadero, luego 4 es solución).
    is_correct: true
  - text: $14 > 20$ (Falso).
    is_correct: false
  - text: $12 < 20$ (Incompleto).
    is_correct: false
  - text: $20 < 20$ (Falso).
    is_correct: false
  explanation: La alternativa correcta es '$14 < 20$ (Verdadero, luego 4 es solución).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar $x = 10$ en $3x + 2 < 20$, ¿por qué la prueba falla demostrando que no es solución?
  choices:
  - text: Porque resulta $32 < 20$, lo cual es totalmente Falso.
    is_correct: true
  - text: Porque 10 es un número entero par.
    is_correct: false
  - text: Porque el resultado dio 32.
    is_correct: false
  - text: Porque las inecuaciones prohíben el número 10.
    is_correct: false
  explanation: La alternativa correcta es 'Porque resulta $32 < 20$, lo cual es totalmente Falso.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar cada ocurrencia de $x$ por el número candidato $c$ en la inecuación original.'
- 'Paso 2: Calcular por separado las operaciones del primer y segundo miembro.'
- 'Paso 3: Comparar ambos resultados usando el símbolo de orden.'
- 'Paso 4: Validar la pertenencia de $c$ si la desigualdad resultante es verdadera.'
errores_correccion: '- **Error común:** Evaluar la solución en un paso intermedio donde se cometió un error de signo.

  - **Cómo corregirlo:** La verificación debe hacerse SIEMPRE en la inecuación inicial del problema.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- Comprobar que $x = 4$ satisface $2x + 1 > 5$ demuestra que $x = 4$ es la solución única de la inecuación.
- Sustituir una solución particular en una inecuación exige transformar el operador de orden en una igualdad ($=$).
- Si al reemplazar $x = 2$ en $3x - 1 < 10$ se obtiene $5 < 10$, se concluye que $x = 2$ no es una solución válida.
- La verificación de un valor en el extremo abierto de un intervalo debe resultar siempre en una desigualdad verdadera.
- Evaluar un número candidato que no pertenece al conjunto solución produce una proposición matemáticamente verdadera.
afirmaciones_verdaderas:
- Verificar una solución particular consiste en sustituir el valor en la inecuación original y comprobar que la proposición numérica resultante es verdadera.
- Un valor candidato no pertenece al conjunto solución si al reemplazarlo produce una contradicción numérica falsa.
al_terminar_debes_poder: '**QUÉ:** Verificar si un valor numérico particular es solución de una inecuación.


  **CÓMO:** Sustituyendo el valor en la expresión original y evaluando si la proposición aritmética resultante es verdadera.


  ![Resumen Verificación de una solución particular en una inecuación](/static/img/nodos/verificacion-de-una-solucion-particular-en-una-inecuacion-resumen.svg)'
