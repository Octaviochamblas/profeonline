semantic_id: MAT.GEO.CIRCULO_RECTAS.RADIO_TANGENTE_PERPENDICULAR
resumen_inicial: El radio trazado hacia el punto de tangencia es estrictamente perpendicular a la recta tangente, formando un ángulo de 90°.
explicacion_simple: 'Esta es una de las reglas de oro más importantes y útiles de toda la geometría: **el radio que llega al punto de tangencia es SIEMPRE perpendicular a la recta tangente (forma un ángulo recto de $90^\circ$)**.


  ¿Por qué es tan genial esta propiedad? Porque en el momento en que unes el centro con un punto exterior sobre la recta tangente, ¡inmediatamente aparece un **triángulo rectángulo**! Y con ese triángulo de $90^\circ$, puedes aplicar el **Teorema de Pitágoras** para calcular distancias, el radio o el largo del segmento tangente: **$OP^2 = r^2 + PT^2$**.


  ![Perpendicularidad radio-tangente](/static/img/nodos/propiedad-de-perpendicularidad-entre-el-radio-y-la-tangente-en-el-punto-de-tangencia-intro.svg)

  '
explicacion_formal: '### Teorema fundamental de perpendicularidad radio-tangente

  Sea $\mathcal{C}(O, r)$ una circunferencia y sea $\mathcal{L}$ una recta tangente a $\mathcal{C}$ en el punto $T$. El segmento radial $\overline{OT}$ es estrictamente perpendicular a la recta tangente $\mathcal{L}$:

  $$\overline{OT} \perp \mathcal{L} \iff \angle(OT, \mathcal{L}) = 90^\circ$$


  ### Demostración geométrica por reducción al absurdo

  1. Supóngase que $\overline{OT}$ no es perpendicular a $\mathcal{L}$.

  2. Entonces existe otro punto $T'' \in \mathcal{L}$ tal que $\overline{OT''} \perp \mathcal{L}$.

  3. En el triángulo rectángulo $\triangle OT T''$, la hipotenusa sería $\overline{OT}$ (con longitud $r$).

  4. Por la propiedad fundamental de los triángulos rectángulos, el cateto es estrictamente menor que la hipotenusa: $OT'' < OT = r$.

  5. Pero si $d(O, T'') < r$, el punto $T''$ sería interior a la circunferencia, lo que forzaría a la recta $\mathcal{L}$ a ser secante, contradiciendo la hipótesis de que es tangente.

  6. Por reducción al absurdo, el punto de mínima distancia es $T$ y necesariamente $\overline{OT} \perp \mathcal{L}$.


  ### Relación métrica de Pitágoras

  Para cualquier punto $P$ sobre la recta tangente, el triángulo $\triangle OTP$ es rectángulo en $T$ con hipotenusa $OP$:

  $$OP^2 = r^2 + PT^2 \implies PT = \sqrt{OP^2 - r^2}$$


  > **Complemento didáctico:** Grábate este reflejo para la PAES: en cualquier ejercicio donde veas una tangente tocando un círculo, dibuja inmediatamente el radio hacia ese punto y marca un cuadradito de $90^\circ$. El 99% de esos problemas se resuelven aplicando Pitágoras con la hipotenusa que va desde el centro hasta el punto exterior.

  '
definiciones_clave: '- **Perpendicularidad ortogonal**: Intersección angular a $90^\circ$ entre dos líneas rectas.

  - **Triángulo rectángulo de tangencia**: Triángulo $\triangle OTP$ con ángulo recto en el punto de contacto $T$.

  - **Segmento tangente ($PT$)**: Segmento rectilíneo sobre la recta tangente comprendido entre un punto exterior $P$ y el punto de tangencia $T$.

  '
propiedades_relaciones: '- **Condición analítica de pendientes**: Si la recta del radio tiene pendiente $m_{\text{rad}}$, la tangente tiene pendiente ortogonal $m_T = -\frac{1}{m_{\text{rad}}}$.

  - **Hipotenusa siempre al centro**: En el triángulo $\triangle OTP$, el segmento que une el centro con el punto exterior ($OP$) es siempre la hipotenusa ($OP > r$ y $OP > PT$).

  - **Trigonometría en el círculo**: $\operatorname{sen}(\angle OPT) = \frac{r}{OP}$ y $\tan(\angle OPT) = \frac{r}{PT}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de perpendicularidad radio-tangente](/static/img/nodos/propiedad-de-perpendicularidad-entre-el-radio-y-la-tangente-en-el-punto-de-tangencia-ejemplos.svg)


    Desde un punto exterior $P$ situado a $13\text{ cm}$ del centro de una circunferencia de radio $r = 5\text{ cm}$, se traza un segmento tangente hasta el punto de contacto $T$. Calcula la longitud del segmento tangente $\overline{PT}$.'
  pasos:
  - 'Paso 1: Aplicar la propiedad de perpendicularidad: El radio $OT$ es perpendicular a la tangente en $T$, por lo que $\angle OTP = 90^\circ$.'
  - 'Paso 2: Reconocer los lados del triángulo rectángulo $\triangle OTP$: La hipotenusa es $OP = 13\text{ cm}$, un cateto es el radio $OT = r = 5\text{ cm}$ y el otro cateto es el segmento tangente $PT$.'
  - 'Paso 3: Aplicar el Teorema de Pitágoras: $OP^2 = OT^2 + PT^2 \implies 13^2 = 5^2 + PT^2$.'
  - 'Paso 4: Despejar $PT$: $169 = 25 + PT^2 \implies PT^2 = 144 \implies PT = \sqrt{144} = 12\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ángulo forman entre sí el radio de una circunferencia y la recta tangente en el punto de contacto?
  choices:
  - text: Un ángulo recto de exactamente 90°.
    is_correct: true
  - text: Un ángulo agudo de 45°.
    is_correct: false
  - text: Un ángulo obtuso de 120°.
    is_correct: false
  - text: Depende de la posición de la recta en el plano.
    is_correct: false
  explanation: La alternativa correcta es 'Un ángulo recto de exactamente 90°.' El radio es siempre rigurosamente perpendicular a la recta tangente en el punto de tangencia.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un triángulo rectángulo OTP formado por el centro O, el punto de tangencia T y un punto exterior P, ¿cuál de los segmentos es la hipotenusa?
  choices:
  - text: El segmento OP (que une el centro con el punto exterior).
    is_correct: true
  - text: El radio OT.
    is_correct: false
  - text: El segmento tangente PT.
    is_correct: false
  - text: Cualquiera de los tres segmentos.
    is_correct: false
  explanation: La alternativa correcta es 'El segmento OP (que une el centro con el punto exterior).' Como el ángulo recto está en el vértice $T$, el lado opuesto es la hipotenusa $OP$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Localizar el centro $O$, el punto de tangencia $T$ y el punto exterior $P$.

  2. Establecer el ángulo recto $\angle OTP = 90^\circ$.

  3. Identificar la hipotenusa $OP$ y los catetos $r$ y $PT$.

  4. Aplicar la relación pitagórica $OP^2 = r^2 + PT^2$ para despejar la incógnita.

  '
errores_correccion: '- **Error común 1:** Considerar al segmento tangente $PT$ como hipotenusa. **Corrección:** El ángulo recto está en $T$, por lo que la hipotenusa es siempre el segmento al centro $OP$.

  - **Error común 2:** Asumir que el radio no forma $90^\circ$ si la recta tangente está inclinada. **Corrección:** La perpendicularidad se cumple con cualquier orientación espacial de la recta.

  '
ejemplos:
- tipo: A
  titulo: Cálculo de distancia al centro
  enunciado: Si el radio de una circunferencia es $r = 8\text{ cm}$ y el segmento tangente mide $PT = 15\text{ cm}$, ¿a qué distancia del centro se encuentra el punto $P$?
  alternativas:
  - text: $17\text{ cm}$.
    is_correct: true
  - text: $23\text{ cm}$.
    is_correct: false
  - text: $7\text{ cm}$.
    is_correct: false
  - text: $\sqrt{161}\text{ cm}$.
    is_correct: false
  explicacion: 'Por Pitágoras: $OP = \sqrt{8^2 + 15^2} = \sqrt{64 + 225} = \sqrt{289} = 17\text{ cm}$.'
- tipo: B
  titulo: Ángulo recto con la tangente
  enunciado: ¿Es el radio trazado al punto de tangencia siempre perpendicular a la recta tangente?
  respuesta: Sí
  explicacion: 'Sí. Es un teorema fundamental de la geometría euclidiana: el radio y la recta tangente forman invariablemente $90^\circ$ en el punto de contacto.'
errores_frecuentes:
- '''Confundir qué lado es la hipotenusa en el triángulo rectángulo $\triangle OTP$.'''
- '''Olvidar que el ángulo recto está localizado en el punto de tangencia $T$.'''
- '''Restar en lugar de sumar en el Teorema de Pitágoras al buscar la hipotenusa $OP$.'''
afirmaciones_verdaderas:
- '''El radio trazado al punto de tangencia es estrictamente perpendicular a la recta tangente.'''
- '''El triángulo formado por el centro, el punto de tangencia y un punto exterior es siempre rectángulo.'''
- '''En el triángulo de tangencia $\triangle OTP$, se verifica la relación pitagórica $OP^2 = r^2 + PT^2$.'''
al_terminar_debes_poder: '**QUÉ:** Aplicar la perpendicularidad radio-tangente para resolver triángulos rectángulos mediante Pitágoras y trigonometría.


  **CÓMO:** Empleando $\overline{OT} \perp \mathcal{L}_T$ y $OP^2 = r^2 + PT^2$.


