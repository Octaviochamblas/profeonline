semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.RECORRIDO_IMPAR
resumen_inicial: 'El conjunto recorrido de cualquier función potencia de exponente entero impar positivo $f(x) = a x^{2k+1}$ es la totalidad de los números reales $\operatorname{Rec}(f) = \mathbb{R}$.'
explicacion_simple: |
  A diferencia de las funciones de exponente par que están acotadas hacia arriba o hacia abajo, las funciones potencia con exponente entero impar positivo (como $x^3, x^5, x^7$) pueden entregar cualquier resultado real imaginable. Como las potencias impares conservan los signos de las entradas ($(-2)^3 = -8$ y $2^3 = 8$), la gráfica se extiende sin límites desde abajo en $-\infty$ hasta arriba en $+\infty$. Por esta razón, su recorrido es el conjunto entero de los números reales $\mathbb{R}$.
explicacion_formal: |
  ### Definición formal
  Para toda función potencia $f(x) = a x^n$ definida en $\mathbb{R}$ con exponente impar positivo $n = 2k+1 (k \in \mathbb{Z}^+)$ y coeficiente multiplicativo $a \in \mathbb{R} \setminus \{0\}$, el **conjunto recorrido o conjunto imagen** es ilimitado en ambas direcciones:
  $$\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$$

  ### Demostración analítica
  1. **Existencia de preimagen en todo $\mathbb{R}$**: Para cualquier valor de salida deseado $y_0 \in \mathbb{R}$, existe siempre una única preimagen real $x_0 \in \mathbb{R}$ dada por el despeje explícito:
     $$y_0 = a x_0^{2k+1} \implies x_0 = \sqrt[2k+1]{\frac{y_0}{a}}$$
  2. **Continuidad y Biyectividad**: Dado que la raíz de índice impar $\sqrt[2k+1]{\cdot}$ está bien definida para todo número real positivo, nulo o negativo, todo $y_0 \in \mathbb{R}$ posee preimagen.
  3. **Comportamiento en los extremos**:
     - Si $a > 0 \implies \lim_{x \to -\infty} f(x) = -\infty$ y $\lim_{x \to +\infty} f(x) = +\infty$.
     - Si $a < 0 \implies \lim_{x \to -\infty} f(x) = +\infty$ y $\lim_{x \to +\infty} f(x) = -\infty$.

  ### Síntesis didáctica
  Diferencia de acotación de recorridos:
  - Exponente Par: Recorrido acotado por un extremo en el origen ($[0, +\infty[$ o $]-\infty, 0]$).
  - Exponente Impar: Recorrido totalmente no acotado en ambas direcciones ($\mathbb{R}$).
definiciones_clave: |
  - **Recorrido universal $\mathbb{R}$**: Totalidad de números reales adoptados por la variable dependiente $y$.
  - **Ausencia de acotación**: Inexistencia de máximos o mínimos absolutos en la función.
  - **Biyectividad en $\mathbb{R}$**: Propiedad por la cual cada ordenada $y$ proviene de una única abscisa $x$.
propiedades_relaciones: |
  - **Sobreyectividad universal**: La función potencia de exponente impar positivo es una función sobreyectiva sobre $\mathbb{R}$.
  - **Invariancia por el signo de $a$**: El recorrido permanece igual a $\mathbb{R}$ tanto si $a > 0$ como si $a < 0$.
ejemplo_guiado:
  enunciado: 'Determina el conjunto recorrido de las funciones potencia $f(x) = 2x^3$ y $g(x) = -4x^5$, e halla la preimagen $x$ que produce la salida $y = -16$ en $f(x)$ y la salida $y = 128$ en $g(x)$.'
  pasos:
    - 'Paso 1: Para $f(x) = 2x^3$, el exponente $n = 3$ es impar positivo. Su recorrido es $\operatorname{Rec}(f) = \mathbb{R}$.'
    - 'Paso 2: Buscamos preimagen para $y = -16$: $2x^3 = -16 \implies x^3 = -8 \implies x = \sqrt[3]{-8} = -2$. Preimagen válida.'
    - 'Paso 3: Para $g(x) = -4x^5$, el exponente $n = 5$ es impar positivo. Su recorrido es $\operatorname{Rec}(g) = \mathbb{R}$.'
    - 'Paso 4: Buscamos preimagen para $y = 128$: $-4x^5 = 128 \implies x^5 = -32 \implies x = \sqrt[5]{-32} = -2$. Preimagen válida.'
checkpoints:
