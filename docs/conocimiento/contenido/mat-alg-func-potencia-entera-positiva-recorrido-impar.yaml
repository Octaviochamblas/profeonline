semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.RECORRIDO_IMPAR
resumen_inicial: 'Determinación del recorrido real para exponentes impares positivos:
  forma general $f(x) = a x^n$, simetría, dominio y recorrido en Comportamiento con
  exponente entero positivo.'
explicacion_simple: A diferencia del caso par, cuando el exponente es impar la función
  alcanza tanto valores positivos como negativos, sin límite en ninguna dirección.
explicacion_formal: '### Definición formal


  Para $n$ impar, la función $f(x)=a\cdot x^n$ (con $a\neq0$) es estrictamente monótona
  (creciente si $a>0$, decreciente si $a<0$) en todo $\mathbb{R}$, con $f(x)\to-\infty$
  en un extremo y $f(x)\to+\infty$ en el otro. Al ser continua y cubrir ambos extremos
  infinitos sin saltos, alcanza todos los valores reales.


  ### Desarrollo didáctico


  $f(x)=x^3$ toma valores tan negativos como se quiera para $x$ suficientemente negativo,
  y tan positivos como se quiera para $x$ suficientemente positivo, pasando por todos
  los valores intermedios sin excepción.'
definiciones_clave: '- **Determinación del recorrido real para exponentes impares
  positivos**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a determinación del recorrido real para exponentes impares positivos.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de determinación del recorrido real para exponentes impares positivos.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de determinación del recorrido
    real para exponentes impares positivos.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
