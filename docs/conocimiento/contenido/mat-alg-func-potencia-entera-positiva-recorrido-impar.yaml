procedimiento:
- 'Paso 1: Verifica que $n$ sea un entero positivo impar.'
- 'Paso 2: Reconoce que la función no tiene máximos ni mínimos que acoten el recorrido.'
- 'Paso 3: Concluye que el recorrido es todo $\mathbb{R}$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en determinación del recorrido real para exponentes impares positivos.
ejemplos:
- titulo: Determinación del recorrido de $x^3$
  enunciado: Determina el recorrido de $f(x)=x^3$.
  solucion_pasos:
  - El exponente $3$ es impar, así que no hay restricciones de signo en el resultado.
  - El recorrido es todo $\mathbb{R}$.
- titulo: Determinación del recorrido de $-4x^5$
  enunciado: Determina el recorrido de $f(x)=-4x^5$.
  solucion_pasos:
  - El exponente $5$ es impar; el coeficiente negativo solo invierte la dirección
    del crecimiento.
  - El recorrido sigue siendo todo $\mathbb{R}$.
- titulo: ¿El recorrido de una función con exponente impar depende del signo de $a$?
  enunciado: ¿El recorrido de $f(x)=a\cdot x^n$ (con $n$ impar) cambia según el signo
    de $a$?
  respuesta: 'No'
  solucion_pasos:
  - El recorrido es todo $\mathbb{R}$ sin importar si $a$ es positivo o negativo.
- titulo: ¿Puede $f(x)=x^7$ tomar cualquier valor real?
  enunciado: ¿La función $f(x)=x^7$ puede tomar cualquier valor real, sin excepción?
  respuesta: Sí
  solucion_pasos:
  - Al ser estrictamente creciente y no acotada en ningún extremo, cubre todos los
    valores reales posibles.
errores_frecuentes:
- Declarar el recorrido con exponente impar (todo $\mathbb{R}$) con el caso par (semirrecta).
- Suponer que el signo de $a$ restringe el recorrido cuando el exponente es impar.
- No distinguir entre el comportamiento del dominio (siempre $\mathbb{R}$) y el del
  recorrido, que sí varía según la paridad.
- Omitir verificar que la función no tiene extremos que acoten el recorrido.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  determinación del recorrido real para exponentes impares positivos.
