    question: '¿Cuál es el conjunto recorrido de la función potencia de exponente impar $f(x) = -7x^5$?'
    choices:
      - {text: 'El conjunto completo de los números reales $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$', is_correct: true}
      - {text: 'El intervalo de reales no positivos $]-\infty, 0]$', is_correct: false}
      - {text: 'El intervalo de reales no negativos $[0, +\infty[$', is_correct: false}
      - {text: 'El conjunto $\mathbb{R} \setminus \{0\}$', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto completo de los números reales $\operatorname{Rec}(f) = \mathbb{R} = ]-\infty, +\infty[$''. Todas las funciones potencia de exponente entero impar positivo poseen recorrido $\mathbb{R}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Existe algún número real de altura $y \in \mathbb{R}$ que la función potencia $f(x) = 3x^3$ no pueda alcanzar en su gráfica?'
    choices:
      - {text: 'No, la función alcanza todos los números reales de salida $y \in \mathbb{R}$ porque no posee cotas superiores ni inferiores', is_correct: true}
      - {text: 'Sí, los números reales negativos', is_correct: false}
      - {text: 'Sí, el valor cero $y = 0$', is_correct: false}
      - {text: 'Sí, los números fraccionarios', is_correct: false}
    explanation: 'La alternativa correcta es ''No, la función alcanza todos los números reales de salida $y \in \mathbb{R}$ porque no posee cotas superiores ni inferiores''. Al ser el recorrido $\mathbb{R}$, no existen restricciones verticales.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar que el exponente $n$ sea un número entero positivo impar ($n = 3, 5, 7\dots$).'
  - 'Paso 2: Comprobar que el coeficiente $a \neq 0$.'
  - 'Paso 3: Declarar directamente que el conjunto recorrido es el conjunto completo de los números reales $\operatorname{Rec}(f) = \mathbb{R}$.'
errores_correccion: |
  - **Error 1:** Afirmar que el recorrido de $f(x) = -x^3$ se limita a los números negativos. **Cómo corregirlo:** Para $x < 0$, $f(x) = -(-x)^3 = +x^3 > 0$. El recorrido abarca todos los números reales $\mathbb{R}$ (positivos, cero y negativos).
  - **Error 2:** Creer que la función impar tiene un mínimo en el origen. **Cómo corregirlo:** Las funciones potencia impares no tienen mínimos ni máximos; atraviesan el origen con un punto de inflexión continuando hacia el infinito opuesto.
ejemplos:
  - titulo: 'Recorrido de potencia cúbica mónica'
    enunciado: '¿Cuál es el recorrido de $f(x) = x^3$?'
    alternativas:
      - '$\mathbb{R}$'
      - '$[0, +\infty[$'
      - '$\mathbb{R} \setminus \{0\}$'
    respuesta: '$\mathbb{R}$'
    solucion_pasos:
      - '1. El exponente $n = 3$ es entero impar positivo.'
      - '2. El recorrido es $\operatorname{Rec}(f) = \mathbb{R}$.'
  - titulo: 'Recorrido con coeficiente negativo'
    enunciado: '¿La función $g(x) = -5x^7$ tiene recorrido igual a $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En potencias impares el recorrido es siempre $\mathbb{R}$ sin importar el signo de $a$.'
  - titulo: 'Cálculo de preimagen negativa'
    enunciado: '¿La altura $y = -27$ es alcanzada por la función $f(x) = x^3$ en $x = -3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(-3) = (-3)^3 = -27$.'
  - titulo: 'Ausencia de cotas verticales'
    enunciado: '¿Las funciones potencia impares carecen de máximos y mínimos absolutos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Su recorrido $\mathbb{R}$ se extiende indefinidamente hacia $-\infty$ y $+\infty$.'
errores_frecuentes:
  - 'El conjunto recorrido de la función potencia $f(x) = -x^3$ es el intervalo $]-\infty, 0]$.'
  - 'Las funciones de exponente impar positivo tienen como recorrido únicamente los reales positivos.'
  - 'El coeficiente negativo en $f(x) = -2x^5$ acota el recorrido por arriba en $y = 0$.'
  - 'El valor cero $y = 0$ no forma parte del recorrido de $f(x) = x^5$.'
  - 'Las funciones de exponente impar poseen una asíntota horizontal que frena su recorrido.'
afirmaciones_verdaderas:
  - 'El conjunto recorrido de cualquier función potencia de exponente entero impar positivo $f(x) = a x^{2k+1}$ es la totalidad de los números reales $\operatorname{Rec}(f) = \mathbb{R}$.'
  - 'Debido a que las potencias impares conservan el signo de la entrada, la función no posee cotas superiores ni inferiores, alcanzando cualquier valor real $y$.'
