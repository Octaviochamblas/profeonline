semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_BASE_DISTINTA_UNO
resumen_inicial: La base de un logaritmo no puede ser igual a uno ($b \neq 1$), ya
  que las potencias de 1 siempre dan 1, impidiendo definir una función inversa válida.
explicacion_simple: 'Si la base fuese 1:

  - $1^x$ siempre daría 1, sin importar el valor de $x$ ($1^2=1, 1^5=1$).

  - Entonces $\log_1(5)$ pediría buscar a qué exponente elevar 1 para dar 5, lo cual
  es imposible.

  - Y $\log_1(1)$ tendría infinitos resultados ($1, 2, 3, \dots$).

  Por eso, la base 1 está estrictamente **prohibida**.'
explicacion_formal: Para $b = 1$, la función $f(x) = 1^x = 1$ es constante y no es
  inyectiva. Por lo tanto, no posee función inversa. De ahí que la definición de $\log_b(a)$
  imponga la restricción $b \neq 1$.
definiciones_clave: '- **Restricción de base no unitaria**: Condición de existencia
  $b \neq 1$.'
propiedades_relaciones: '- **Condiciones completas de la base**: $b > 0$ y $b \neq
  1$ (es decir, $b \in ]0, 1[ \cup ]1, \infty[$).'
ejemplo_guiado:
  enunciado: Determina si $\log_1(8)$ existe.
  pasos:
  - 'Identificar la base: $b = 1$.'
  - 'Recordar la propiedad de restricciones de la base: $b > 0$ y $b \neq 1$.'
  - Como la base es exactamente 1, la expresión no está definida.
  - Concluir que $\log_1(8)$ NO existe.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué no existe el logaritmo en base 1 ($\log_1(a)$ con $a \neq 1$)?
  choices:
  - text: Porque 1 elevado a cualquier exponente sigue siendo 1
    is_correct: true
  - text: Porque 1 no es un número entero
    is_correct: false
  - text: Porque da como resultado 0
    is_correct: false
  - text: Porque 1 es un número primo
    is_correct: false
  explanation: 'La correcta es: Porque 1 elevado a cualquier exponente sigue siendo
    1. No es posible obtener $a \neq 1$ mediante potencias de 1.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la expresión $\log_{x-3}(5)$, ¿qué valor de $x$ está prohibido por
    la regla de la base no unitaria?
  choices:
  - text: x = 4
    is_correct: true
  - text: x = 3
    is_correct: false
  - text: x = 5
    is_correct: false
  - text: x = 0
    is_correct: false
  explanation: 'La correcta es: x = 4. Si $x = 4$, la base vale $4 - 3 = 1$, lo cual
    está prohibido.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión de la base $b$.'
- 'Paso 2: Plantear la restricción $b \neq 1$.'
- 'Paso 3: Excluir los valores que hagan la base igual a 1.'
errores_correccion: No intentes evaluar logaritmos con base 1. Están fuera del dominio.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es válido $\log_1(1)$?
  alternativas:
  - No, la base no puede ser 1
  - Sí, vale 1
  respuesta: No, la base no puede ser 1
  solucion_pasos:
  - La base $b=1$ está excluida de la definición de logaritmo.
errores_frecuentes:
- Aceptar la base 1 como válida.
afirmaciones_verdaderas:
- La base de un logaritmo debe cumplir $b \neq 1$.
al_terminar_debes_ponder: Excluir la base 1 en el análisis de existencia de logaritmos.
fuente: Texto escolar MINEDUC.
estado: publicado
