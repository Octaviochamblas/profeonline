semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_BASE_DISTINTA_UNO
resumen_inicial: La base de un logaritmo no puede ser igual a 1 ($b \neq 1$), porque $1^c = 1$ para todo exponente, lo que generaría ausencia de solución o infinitas soluciones.
explicacion_simple: "![Restricción de base distinta de 1](/static/img/nodos/restriccion-de-base-distinta-de-uno-en-un-logaritmo-intro.svg)\n\n¿Por qué la base no puede ser $1$?\n- Como $1$ elevado a cualquier número sigue siendo $1$ ($1^2 = 1, 1^{10} = 1, 1^{-5} = 1$):\n  - $\\log_1(5)$ no tiene solución: ningún exponente puede convertir el $1$ en $5$.\n  - $\\log_1(1)$ tiene infinitas soluciones: cualquier exponente sirve, perdiendo la unicidad.\n- Por eso, la base debe ser siempre distinta de 1: $b \neq 1$."
explicacion_formal: 'En el sistema de los números reales, la función exponencial $f(x) = b^x$ con $b = 1$ se reduce a la función constante $f(x) = 1$. Dicha función **no es inyectiva ni sobreyectiva** en $\mathbb{R}^+$, por lo que carece de función inversa.


  **Casos de Falla Algebraica:**

  1. **Si $a \neq 1$:** La ecuación $1^c = a$ tiene conjunto solución vacío $\emptyset$.

  2. **Si $a = 1$:** La ecuación $1^c = 1$ se satisface para todo $c \in \mathbb{R}$, produciendo indeterminación.


  Por lo tanto, se exige la condición de base $b \in \mathbb{R}^+ \setminus \{1\} = ]0, 1[ \cup ]1, +\infty[.'
definiciones_clave: '- **Base distinta de uno ($b \neq 1$)**: Restricción de no unitariedad obligatoria para la base logarítmica.

  - **Inyectividad**: Propiedad requerida para que a cada argumento le corresponda un único logaritmo.

  - **Indeterminación logarítmica**: Pérdida de unicidad provocada por la base 1.'
propiedades_relaciones: '- **Dominio de bases**: $b \in ]0, 1[ \cup ]1, +\infty[$.

  - **Bases decrecientes**: Si $0 < b < 1$, la función logarítmica es estrictamente decreciente.

  - **Bases crecientes**: Si $b > 1$, la función logarítmica es estrictamente creciente.'
ejemplo_guiado:
  enunciado: '![Ejemplos de base distinta de 1](/static/img/nodos/restriccion-de-base-distinta-de-uno-en-un-logaritmo-ejemplos.svg)


    Analice la existencia y unicidad de $\log_1(9)$, $\log_1(1)$ y $\log_2(1)$.'
  pasos:
  - 'Paso 1: Para $\log_1(9)$: Plantear $1^c = 9$. Como $1^c = 1$ siempre, no tiene solución.'
  - 'Paso 2: Para $\log_1(1)$: Plantear $1^c = 1$. Todo $c \in \mathbb{R}$ lo cumple, generando indeterminación.'
  - 'Paso 3: Para $\log_2(1)$: La base es $2 \neq 1$. Es válida y su valor único es $0$ ($2^0 = 1$).'
  - 'Conclusión: La base debe ser estrictamente distinta de 1 para garantizar solución única.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué no existe el logaritmo $\log_1(7)$?
  choices:
  - text: Porque $1^c = 1$ para todo número real, por lo que nunca puede dar $7$
    is_correct: true
  - text: Porque $7$ es un número primo
    is_correct: false
  - text: Porque el logaritmo de $1$ es $0$
    is_correct: false
  - text: Porque $1 \times 7 = 7$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $1^c = 1$ para todo número real, por lo que nunca puede dar $7$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver $\log_{x-2}(10) = 3$, ¿qué valor de $x$ queda prohibido por la restricción $b \neq 1$?
  choices:
  - text: $x = 3$ (porque $3 - 2 = 1$, haciendo la base igual a 1)
    is_correct: true
  - text: $x = 2$
    is_correct: false
  - text: $x = 0$
    is_correct: false
  - text: $x = 5$
    is_correct: false
  explanation: La alternativa correcta es '$x = 3$ (porque $3 - 2 = 1$, haciendo la base igual a 1)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión de la base $b$.'
- 'Paso 2: Plantear la restricción $b \neq 1$ además de $b > 0$.'
- 'Paso 3: Excluir de las soluciones finales cualquier valor que anule la condición $b \neq 1$.'
errores_correccion: "- **Error 1: Creer que $\\log_1(1) = 1$.** **Cómo corregirlo:** La base 1 está excluida universalmente por generar infinitas soluciones ($1^0 = 1, 1^1 = 1, 1^2 = 1$).\n- **Error 2: Olvidar comprobar $b \neq 1$ en ecuaciones algebraicas.** **Cómo corregirlo:** Al resolver ecuaciones con incógnitas en la base, descartar siempre los valores donde la base resulte 1."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\log_1(100)$?
  alternativas:
  - No existe en $\mathbb{R}$
  - $100$
  - $0$
  respuesta: No existe en $\mathbb{R}$
  solucion_pasos:
  - La base es 1, por lo que la expresión carece de solución en $\mathbb{R}$.
- titulo: Ejemplo 2
  enunciado: ¿Para qué valores de $x$ está definida la base en $\log_{x}(8)$?
  alternativas:
  - $x > 0$ con $x \neq 1$
  - $x > 0$
  - $x \neq 1$
  respuesta: $x > 0$ con $x \neq 1$
  solucion_pasos:
  - 'La base debe ser estrictamente positiva y distinta de 1: $x \in ]0, 1[ \cup ]1, +\infty[$.'
- titulo: ¿Es log_b(a) válido si b = 1?
  respuesta: 'No'
  solucion_pasos:
  - No, la base 1 está excluida de la definición de logaritmo.
  alternativas:
  - texto: No, la base debe ser distinta de 1
    es_correcta: true
    retroalimentacion: ¡Correcto! $b \neq 1$ es una restricción fundamental.
  - texto: Sí, siempre que a = 1
    es_correcta: false
    retroalimentacion: Incorrecto, incluso $\log_1(1)$ está indefinido.
  - texto: Sí, para todo argumento positivo
    es_correcta: false
    retroalimentacion: Incorrecto, la base 1 no es admisible.
- titulo: ¿Es log_{0,5}(4) = -2 una expresión válida?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $b = 0,5 > 0$ y $0,5 \neq 1$, y $(0,5)^{-2} = (1/2)^{-2} = 4$.
  alternativas:
  - texto: Sí, 0,5 > 0 y 0,5 ≠ 1
    es_correcta: true
    retroalimentacion: ¡Correcto! Base en el intervalo ]0, 1[.
  - texto: No, las bases decimales no existen
    es_correcta: false
    retroalimentacion: Incorrecto, cualquier número positivo distinto de 1 es válido.
  - texto: No, es igual a 2
    es_correcta: false
    retroalimentacion: Incorrecto, $(1/2)^2 = 1/4$, se requiere exponente negativo.
errores_frecuentes:
- Asignar un valor arbitrario a $\log_1(1)$.
- Olvidar excluir el valor $b = 1$ en inecuaciones de dominio.
- Confundir la restricción de la base ($b \neq 1$) con el argumento (el argumento sí puede ser 1).
- Permitir bases unitarias en problemas de modelamiento.
afirmaciones_verdaderas:
- La base de un logaritmo debe ser estrictamente distinta de 1 ($b \neq 1$).
- El argumento sí puede ser igual a 1, dando como resultado $\log_b(1) = 0$.
- La restricción $b \neq 1$ garantiza la inyectividad y unicidad de la función logarítmica.
al_terminar_debes_poder: '![Síntesis de restricción de base distinta de 1](/static/img/nodos/restriccion-de-base-distinta-de-uno-en-un-logaritmo-resumen.svg)


  QUÉ: Comprender y aplicar la restricción de base distinta de uno $b \neq 1$ en logaritmos.


  CÓMO: Verificando que la base pertenezca al conjunto $]0, 1[ \cup ]1, +\infty[$ y excluyendo los valores que anulen la condición en ecuaciones algebraicas.'
