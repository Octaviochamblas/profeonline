resumen_inicial: La base $b$ de un logaritmo $\log_b(a)$ debe ser distinta de uno
  ($b \neq 1$), ya que la potencia $1^c = 1$ no permite despejar exponentes para argumentos
  $a \neq 1$.
explicacion_simple: No podemos usar el número 1 como base de un logaritmo porque 1
  elevado a cualquier exponente siempre sigue dando 1. Esto impediría calcular logaritmos
  para cualquier otro número y generaría indefinición.
explicacion_formal: 'Para todo $\log_b(a)$, la **Restricción de Exclusión de la Unidad**
  exige:


  $$b \neq 1$$


  **Demostración de indefinición/inconsistencia para $b = 1$:**

  - Si $a \neq 1$ (ej: $\log_1(5) = c \implies 1^c = 5$), no existe solución ($1^c
  = 1 \neq 5$).

  - Si $a = 1$ (ej: $\log_1(1) = c \implies 1^c = 1$), existen infinitas soluciones
  (indeterminación).'
definiciones_clave: '- **Restricción de base distinta de uno**: Condición $b \neq
  1$ para garantizar la inyectividad de la función exponencial.'
propiedades_relaciones: '- **Inyectividad exponencial**: Previene constantes degeneradas
  $f(x) = 1^x = 1$.'
ejemplo_guiado:
  enunciado: Justifique por qué las expresiones $\log_1(7)$ y $\log_1(1)$ no están
    admitidas en la definición formal de logaritmos.
  pasos:
  - 'Paso 1: Para $\log_1(7) = c \implies 1^c = 7$, no existe ningún exponente $c$
    real que satisfaga la ecuación.'
  - 'Paso 2: Para $\log_1(1) = c \implies 1^c = 1$, todo número real $c$ satisface
    la ecuación (infinitas respuestas).'
  - 'Conclusión: La base $b = 1$ genera inconsistencia o indefinición, por lo que
    se exige $b \neq 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué se exige la restricción b != 1 en la base de un logaritmo log_b(a)?
  choices:
  - text: Porque 1^c = 1 siempre, imposibilitando un valor unívoco para otros argumentos
    is_correct: true
  - text: Porque el número 1 es negativo
    is_correct: false
  - text: Porque 1 no es un número real
    is_correct: false
  - text: Para evitar multiplicar por cero
    is_correct: false
  explanation: La alternativa correcta es 'Porque 1^c = 1 siempre, imposibilitando
    un valor unívoco para otros argumentos'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿qué ocurre si intentamos evaluar log_1(7)?
  choices:
  - text: No existe ningún valor c tal que 1^c = 7
    is_correct: true
  - text: Da como resultado 7
    is_correct: false
  - text: Da como resultado 1
    is_correct: false
  - text: Da como resultado cero
    is_correct: false
  explanation: La alternativa correcta es 'No existe ningún valor c tal que 1^c =
    7'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de fundamentar y aplicar la restricción
  $b \neq 1$ en la base de todo logaritmo $\log_b(a)$.
semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_BASE_DISTINTA_UNO
procedimiento:
- 'Paso 1: Verificar que el argumento $a > 0$ y la base $b > 0, b \neq 1$ cumplan
  las restricciones.'
- 'Paso 2: Formular la equivalencia de potencia $b^c = a$.'
- 'Paso 3: Calcular el valor del exponente $c$ o simplificar la expresión logarítmica.'
errores_correccion: '- **Error 1: Intentar calcular logaritmos de números negativos
  o cero ($\log_2(-4)$ o $\log_2(0)$).** **Cómo corregirlo:** El argumento debe ser
  estrictamente positivo ($a > 0$); en $\mathbb{R}$ no existen.


  - **Error 2: Confundir la base con el argumento (escribir $\log_2(8) = 8^2 = 64$).**
  **Cómo corregirlo:** La base $2$ se eleva al RESULTADO para dar el argumento ($2^3
  = 8 \implies \log_2(8) = 3$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.LOGARITMOS_CONCEPTO.RESTRICCION_BASE_DISTINTA_UNO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la definición logarítmica.
- titulo: Ejemplo 2
  enunciado: Verificación de la regla.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en R.
- titulo: ¿Cumple el logaritmo las restricciones de base y argumento?
  respuesta: Sí
  solucion_pasos:
  - Sí, $b > 0, b \neq 1$ y $a > 0$.
- titulo: ¿Es log_b(1) siempre igual a 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $b^0 = 1$ para toda base válida.
errores_frecuentes:
- '[''Calcular logaritmos con bases negativas en el conjunto de los números reales.'',
  ''Evaluar el logaritmo de cero o de números negativos obteniendo números reales
  negativos.'', ''Utilizar el número 1 como la base de un logaritmo en expresiones
  algebraicas.'', ''El logaritmo de uno $\\log_b(1)$ es numéricamente igual a la base
  $b$.'', ''Declarar la sigla del logaritmo decimal $\\log$ con la sigla del logaritmo
  natural $\\ln$.'']'
afirmaciones_verdaderas:
- El logaritmo $\log_b(a) = c$ se define formalmente mediante la ecuación exponencial
  $b^c = a$ para $b > 0, b \neq 1, a > 0$.
- El logaritmo de 1 en cualquier base válida es 0 y el logaritmo de la base es 1.
