semantic_id: MAT.FUND.CONECTIVOS_LOGICOS.NEGACION
resumen_inicial: 'Definición, tabla de verdad y propiedades del conectivo unario de negación ($\neg$ o $\sim$), que invierte el valor de verdad de una proposición.'
explicacion_simple: |
  La **negación** es el conectivo lógico más simple: toma una afirmación y le da la vuelta por completo a su valor de verdad. Si una frase es verdadera, su negación se vuelve **falsa**; si una frase es falsa, su negación se vuelve **verdadera**. En el lenguaje cotidiano usamos palabras como "no", "es falso que" o "no es cierto que". Por ejemplo, si $p$ es "El $4$ es par" (que es verdadero), $\neg p$ es "El $4$ no es par" (que es falso).

  ![Introducción didáctica: Negación lógica](/static/img/nodos/negacion-logica-intro.svg)
explicacion_formal: |
  ### Definición formal
  En el cálculo proposicional, la **negación lógica** es un operador monádico (o conectivo unario) $\neg: \mathcal{P} \to \mathcal{P}$ definido por la función veritativa booleana $f_\neg: \{V, F\} \to \{V, F\}$ tal que:
  $$v(\neg p) = \begin{cases} F & \text{si } v(p) = V \\ V & \text{si } v(p) = F \end{cases}$$
  En notación algebraica booleana sobre $\{0, 1\}$, se expresa como $v(\neg p) = 1 - v(p)$.

  ### Desglose simbólico
  - Símbolos equivalentes: $\neg p$, $\sim p$, $\bar{p}$.
  - Tabla de verdad canónica:
    $$\begin{array}{|c|c|} \hline p & \neg p \\ \hline V & F \\ F & V \\ \hline \end{array}$$
  - Ley de Doble Negación (Involución): $\neg(\neg p) \equiv p$.

  ### Síntesis didáctica
  La negación es el único conectivo fundamental que opera sobre una sola proposición a la vez (conectivo unario). Su efecto es invertir estrictamente el estado de verdad del operando.
definiciones_clave: |
  - **Negación lógica ($\neg p$)**: Operador unario que produce un valor de verdad opuesto al de la proposición original.
  - **Involución / Doble negación**: Principio lógico por el cual la negación de una negación es lógicamente equivalente a la afirmación original ($\neg\neg p \equiv p$).
  - **Alcance de la negación**: Segmento de la fórmula sobre el cual actúa el símbolo $\neg$, delimitado por paréntesis si es compuesta.
propiedades_relaciones: |
  - **Principio de No Contradicción**: $p \land \neg p \equiv F$ (una proposición y su negación nunca pueden ser simultáneamente verdaderas).
  - **Principio del Tercero Excluido**: $p \lor \neg p \equiv V$ (una proposición o su negación es siempre verdadera).
ejemplo_guiado:
  enunciado: |
    Sea la proposición $p$: "$15$ es un número primo". Determina su valor de verdad $v(p)$, formula su negación en lenguaje natural y halla el valor de verdad $v(\neg p)$.

    ![Ejemplos prácticos: Negación lógica](/static/img/nodos/negacion-logica-ejemplos.svg)
  pasos:
    - 'Paso 1: Evaluar la proposición simple $p$: Los divisores de $15$ son $\{1, 3, 5, 15\}$. Al tener más de dos divisores, $15$ es compuesto. Por lo tanto, $v(p) = F$.'
    - 'Paso 2: Redactar la negación en lenguaje natural: $\neg p$: "El número $15$ no es un número primo" (o "Es falso que $15$ sea primo").'
    - 'Paso 3: Aplicar la tabla de verdad de la negación: Como $v(p) = F$, se tiene que $v(\neg p) = V$.'
    - 'Paso 4: Concluir que la proposición negada $\neg p$ es una afirmación matemáticamente verdadera.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una proposición $p$ es falsa ($v(p) = F$), ¿cuál es el valor de verdad de su doble negación $\neg(\neg p)$?'
    choices:
      - {text: 'Falso ($F$)', is_correct: true}
      - {text: 'Verdadero ($V$)', is_correct: false}
      - {text: 'Indefinido', is_correct: false}
      - {text: 'Nulo', is_correct: false}
    explanation: 'La alternativa correcta es ''Falso ($F$)''. Por la ley de doble negación $\neg(\neg p) \equiv p$, conservando el valor original $F$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes opciones expresa la negación formal del enunciado "Todos los triángulos son equiláteros"?'
    choices:
      - {text: 'Existe al menos un triángulo que no es equilátero', is_correct: true}
      - {text: 'Ningún triángulo es equilátero', is_correct: false}
      - {text: 'Todos los triángulos son rectángulos', is_correct: false}
      - {text: 'Todos los triángulos son isósceles', is_correct: false}
    explanation: 'La alternativa correcta es ''Existe al menos un triángulo que no es equilátero''. La negación de un cuantificador universal "todos" es la existencia de al menos un contraejemplo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la proposición que se desea negar y determinar su valor de verdad inicial $v(p)$.'
  - 'Paso 2: Anteponer el símbolo de negación $\neg$ a la variable o fórmula entre paréntesis: $\neg p$ o $\neg(A)$.'
  - 'Paso 3: Invertir el valor de verdad aplicando la tabla de la negación ($V \mapsto F$ y $F \mapsto V$).'
  - 'Paso 4: Para el lenguaje natural, incorporar partículas como "no" o "no es cierto que" respetando la semántica.'
errores_correccion: |
  - **Error 1:** Negar "todos" afirmando "ninguno". **Cómo corregirlo:** La negación lógica de una afirmación universal como "Todos los números pares son divisibles por $4$" es "Existe al menos un número par que no es divisible por $4$" (un contraejemplo basta para refutarlo).
  - **Error 2:** Creer que la negación de una proposición compuesta $\neg(p \land q)$ es simplemente $\neg p \land \neg q$. **Cómo corregirlo:** Para negar conectivos binarios deben aplicarse las Leyes de De Morgan: $\neg(p \land q) \equiv \neg p \lor \neg q$.
ejemplos:
  - titulo: 'Negación de una desigualdad'
    enunciado: '¿Cuál es la negación de la afirmación "$x > 5$" en los números reales?'
    alternativas:
      - '$x \leq 5$'
      - '$x < 5$'
      - '$x \geq 5$'
    respuesta: '$x \leq 5$'
    solucion_pasos:
      - '1. El complemento estricto de mayor que ($>$) es menor o igual que ($\leq$).'
      - '2. La negación es $x \leq 5$.'
  - titulo: 'Negación de una igualdad'
    enunciado: '¿Cuál es la negación formal de "$a = b$"?'
    alternativas:
      - '$a \neq b$'
      - '$a < b$'
      - '$a > b$'
    respuesta: '$a \neq b$'
    solucion_pasos:
      - '1. La negación directa de una igualdad es la desigualdad no estricta $a \neq b$.'
  - titulo: 'Valor de verdad de negación simple'
    enunciado: 'Si $p$: "$2 + 2 = 4$", ¿cuánto vale $v(\neg p)$?'
    alternativas:
      - '$F$ (Falso)'
      - '$V$ (Verdadero)'
      - 'Indefinido'
    respuesta: '$F$ (Falso)'
    solucion_pasos:
      - '1. Como $v(p) = V$, su negación es falsa: $v(\neg p) = F$.'
  - titulo: 'Tautología con negación'
    enunciado: '¿La fórmula $p \lor \neg p$ es siempre verdadera sin importar el valor de $p$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Sí, es el principio del tercero excluido, una tautología fundamental.'
errores_frecuentes:
  - 'La afirmación de que la negación de un enunciado que contiene "todos" se expresa usando la palabra "ninguno".'
  - 'La afirmación de que la negación de la desigualdad estricta $x > 0$ es la desigualdad estricta $x < 0$.'
  - 'La afirmación de que negar una fórmula dos veces seguidas $\neg\neg p$ altera su valor de verdad inicial.'
  - 'La afirmación de que el conectivo de negación requiere dos proposiciones para poder operar.'
  - 'La afirmación de que una proposición y su negación pueden ser simultáneamente verdaderas en el mismo contexto.'
afirmaciones_verdaderas:
  - 'La negación lógica $\neg p$ es un conectivo unario que invierte estrictamente el valor de verdad de su operando, convirtiendo $V$ en $F$ y $F$ en $V$.'
  - 'Por la ley de involución o doble negación, la expresión $\neg(\neg p)$ es lógicamente equivalente a la proposición original $p$.'
al_terminar_debes_poder: |
  QUÉ: Definir, calcular y aplicar el conectivo lógico de negación ($\neg p$) y la ley de doble negación.
  CÓMO: Invertir valores veritativos en tablas de verdad y construir negaciones correctas en lenguaje simbólico y natural.

  ![Cuadro resumen: Negación lógica](/static/img/nodos/negacion-logica-resumen.svg)
