procedimiento:
- 'Paso 1: Identifica un segmento de la figura original y su correspondiente en la
  figura imagen.'
- 'Paso 2: Verifica que ambos segmentos tengan la misma dirección (sean paralelos).'
- 'Paso 3: Si todos los pares de segmentos correspondientes son paralelos, es consistente
  con una relación de homotecia.'
