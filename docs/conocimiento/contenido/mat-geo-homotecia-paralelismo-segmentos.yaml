semantic_id: MAT.GEO.HOMOTECIA.PARALELISMO_SEGMENTOS_HOMOLOGOS
resumen_inicial: 'Propiedad de paralelismo entre segmentos homólogos en una homotecia:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: Una propiedad geométrica notable de la homotecia, que la distingue
  de otras transformaciones, es la relación de paralelismo que se genera entre segmentos
  correspondientes.
explicacion_formal: '![Paralelismo de segmentos homólogos](/static/img/geometria/congruencia-semejanza/homotecia-paralelismo-segmentos.svg)


  ### Definición formal


  Si $A''=O+k(A-O)$ y $B''=O+k(B-O)$, entonces $B''-A''=k(B-A)$, es decir, el vector
  $A''B''$ es un múltiplo escalar del vector $AB$, lo que implica que ambos segmentos
  son paralelos.


  ### Desarrollo didáctico


  Esta propiedad es muy útil para verificar visualmente si dos figuras están relacionadas
  por una homotecia: basta con comprobar que los lados correspondientes son paralelos
  entre sí (además de proporcionales en longitud).'
definiciones_clave: '- **Propiedad de paralelismo entre segmentos homólogos en una
  homotecia**: Elemento o propiedad fundamental en el estudio de congruencia, semejanza
  y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a propiedad de paralelismo entre segmentos homólogos
  en una homotecia.'
ejemplo_guiado:
  enunciado: En la aplicación de propiedad de paralelismo entre segmentos homólogos
    en una homotecia, se establece una razón $k = 2.0$ entre dos figuras homólogas
    de longitud original $L = 40\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de propiedad de paralelismo entre segmentos homólogos
    en una homotecia.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 2.0 \cdot 40$.'
  - Concluir que la medida obtenida en propiedad de paralelismo entre segmentos homólogos
    en una homotecia es $L' = 80.0\text{ cm}$.
