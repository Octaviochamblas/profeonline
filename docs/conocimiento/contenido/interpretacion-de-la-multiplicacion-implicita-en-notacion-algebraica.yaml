procedimiento:
- 'Paso 1: Observa si dos elementos están adyacentes sin un signo ''+'' ni ''-'' entre
  ellos.'
- 'Paso 2: Si al menos uno de ellos es una letra o un paréntesis, asume que están
  multiplicándose.'
- 'Paso 3: Si ambos son números arábigos sueltos (ej. 4 y 7 formados como 47), no
  hay multiplicación, es la conformación posicional del número.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar interpretación de la multiplicación implícita en notación
  algebraica.
ejemplos:
- titulo: Traductor explícito
  enunciado: Reescribe la expresión 4xyz(a+b) mostrando todas sus multiplicaciones
    ocultas.
  solucion_pasos:
  - 'Entre el 4 y la x hay multiplicación: 4 * x'
  - 'Entre x, y, z hay multiplicación: x * y * z'
  - 'Entre la z y el paréntesis hay multiplicación: z * (a+b)'
  - 'Resultado: 4 * x * y * z * (a+b)'
- titulo: Una estudiante modela el área de un terreno rectangular en su cuaderno.
    Al costado del terre
  enunciado: 'Una estudiante modela el área de un terreno rectangular en su cuaderno.
    Al costado del terreno anota la letra $A$, y en el borde inferior anota la letra
    $B$. Luego escribe dentro del rectángulo la expresión $AB$. Su compañero le dice
    que está mal, porque el área se calcula multiplicando y ella no puso el signo
    ''por''. ¿Quién tiene la razón matemática? (v1)


    Opciones: A) La estudiante tiene la razón, ya que la convención algebraica establece
    que dos letras adyacentes sin signo se están multiplicando entre sí. · B) El compañero
    tiene la razón, sin el signo ''$\times$'' o ''$\cdot$'', la expresión $AB$ significa
    la suma de los lados. · C) El compañero tiene la razón, porque $AB$ representa
    un número de dos dígitos donde A son las decenas y B las unidades. · D) Ambos
    se equivocan, debió escribir $A^B$.'
  solucion_pasos:
  - El lenguaje algebraico no requiere símbolos explícitos de multiplicación para
    el producto de variables. AB es el área correcta.
  - 'Respuesta: La estudiante tiene la razón, ya que la convención algebraica establece
    que dos letras adyacentes sin signo se están multiplicando entre sí.'
- titulo: 'Respecto de «Interpretación de la multiplicación implícita en notación
    algebraica»: ¿Es corr'
  enunciado: 'Respecto de «Interpretación de la multiplicación implícita en notación
    algebraica»: ¿Es correcta esta caracterización? «La **Multiplicación Implícita**
    es la convención algebraica donde **la ausencia de un signo de operación entre
    números, letras o paréntesis indica obligatoriamente una multiplicación**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La **Multiplicación Implícita**
    es la convención algebraica donde **la ausencia de un signo de operación entre
    números, letras o paréntesis indica obligatoriamente una multiplicación**.'
- titulo: 'Respecto de «Interpretación de la multiplicación implícita en notación
    algebraica»: ¿Es váli'
  enunciado: 'Respecto de «Interpretación de la multiplicación implícita en notación
    algebraica»: ¿Es válida esta afirmación? «Confundir la multiplicación implícita
    con adición. (Ej: pensar que $xy$ significa $x + y$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La **Multiplicación Implícita**
    es la convención algebraica donde **la ausencia de un signo de operación entre
    números, letras o paréntesis indica obligatoriamente una multiplicación**.'
errores_frecuentes:
- 'Confundir la multiplicación implícita con adición. (Ej: pensar que $xy$ significa
  $x + y$).'
- 'Aplicar la regla a números fijos (ej: al reemplazar $x=2$ en $3x$, escribir 32
  en lugar de $3 \cdot 2 = 6$).'
- Para «En el lenguaje algebraico formal, ¿qué operación matemática se asume implícitamente
  cuando dos variables se escriben adyacentes una de la otra sin ningún signo intermedio
  (por ejemplo, $pq$)? (v1)», la respuesta correcta es Suma.
- División.
- Elevación a potencia.
afirmaciones_verdaderas:
- La notación de interpretación de la multiplicación implícita en notación algebraica
  sigue las convenciones del lenguaje algebraico.
