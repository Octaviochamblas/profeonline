semantic_id: MAT.ALG.FUNDAMENTOS.MULTIPLICACION_IMPLICITA
resumen_inicial: 'Interpretación de la multiplicación implícita en notación algebraica:
  concepto y propiedades en Fundamentos y notación algebraica.'
explicacion_simple: En matemáticas, a veces el mayor mensaje es el que no está escrito.
  Cuando las letras y los números se abrazan sin separadores en medio, hay una operación
  invisible ocurriendo.
explicacion_formal: '### Definición formal


  La yuxtaposición (colocar cosas juntas) de letras o de un número con una letra denota
  siempre producto o multiplicación.


  ### Desarrollo didáctico


  El signo ''por'' ($\cdot$ o $\times$) a menudo se omite por estética y velocidad.

  - Entre un número y una letra: $5x$ significa $5 \cdot x$.

  - Entre dos letras: $ab$ significa $a \cdot b$.

  - Antes de un paréntesis: $3(x + 2)$ significa $3 \cdot (x + 2)$.

  - Entre dos paréntesis: $(a)(b)$ significa $(a) \cdot (b)$.


  ATENCIÓN: Esto NO aplica entre dos números explícitos. $52$ es cincuenta y dos,
  NO es $5 \cdot 2$. Para multiplicar números explicitamente debes usar el punto ($5
  \cdot 2$) o paréntesis $5(2)$.'
definiciones_clave: '- **Interpretación de la multiplicación implícita en notación
