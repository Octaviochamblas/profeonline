semantic_id: MAT.GEO.TRIG_APLICACIONES.MODELO_TRIANGULO_RECTANGULO
resumen_inicial: 'Modelamiento de una situación contextual mediante un triángulo rectángulo:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría en el Triángulo
  Rectángulo.'
explicacion_simple: Antes de aplicar cualquier razón trigonométrica, es necesario
  dibujar la situación real como un triángulo rectángulo, identificando qué dato corresponde
  a cada cateto, a la hipotenusa y al ángulo relevante.
explicacion_formal: '![Modelamiento con triángulo rectángulo](/static/img/geometria/trigonometria/trigapli-modelo-triangulo.svg)


  ### Definición formal


  Dada una situación con un elemento vertical (altura), un elemento horizontal (distancia)
  y un ángulo de observación, se construye un triángulo rectángulo donde el ángulo
  recto está entre la altura y la distancia horizontal, y el ángulo dado corresponde
  a uno de los ángulos agudos.


  ### Desarrollo didáctico


  Por ejemplo, si un cable sujeta la punta de un poste al suelo formando un ángulo
  de 50° con el suelo, el poste es el cateto opuesto al ángulo, el suelo (desde la
  base del poste hasta el punto de anclaje) es el cateto adyacente, y el cable es
  la hipotenusa. Una vez modelada la situación así, se puede aplicar la razón trigonométrica
  adecuada.'
definiciones_clave: '- **Modelamiento de una situación contextual mediante un triángulo
