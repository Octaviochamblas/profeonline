procedimiento:
- 'Paso 1: Lee el problema e identifica los tres elementos: una longitud vertical,
  una longitud horizontal y un ángulo.'
- 'Paso 2: Dibuja un triángulo rectángulo, ubicando el ángulo recto entre el elemento
  vertical y el horizontal.'
- 'Paso 3: Rotula cada lado como cateto opuesto, cateto adyacente o hipotenusa según
  la posición del ángulo dado.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
