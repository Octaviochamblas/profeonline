semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PROPORCIONALIDAD_DIRECTA
resumen_inicial: 'Interpretación de la función lineal como proporcionalidad directa:
  conceptos, representación y propiedades en Función constante y función lineal.'
explicacion_simple: 'Cuando el precio total de una compra depende solo de la cantidad
  de productos, a un mismo precio unitario, estás usando exactamente el modelo de
  una función lineal: la proporcionalidad directa.'
explicacion_formal: '### Definición formal


  Dos magnitudes $x$ e $y$ son directamente proporcionales si existe una constante
  $k \neq 0$ tal que $y = kx$ para todo par de valores correspondientes; equivalentemente,
  el cociente $\frac{y}{x}$ es constante e igual a $k$ para todo $x \neq 0$.


  ### Desarrollo didáctico


  La proporcionalidad directa es la interpretación contextual de la función lineal:
  al duplicar $x$, $y$ también se duplica; al triplicar $x$, $y$ también se triplica.


  Si un kilogramo de manzanas cuesta \$1200, el costo total $C(n) = 1200n$ es directamente
  proporcional a la cantidad $n$ de kilogramos comprados: comprar el doble de kilos
  cuesta el doble.'
definiciones_clave: '- **Interpretación de la función lineal como proporcionalidad
  directa**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a interpretación de la función lineal como
  proporcionalidad directa.'
ejemplo_guiado:
