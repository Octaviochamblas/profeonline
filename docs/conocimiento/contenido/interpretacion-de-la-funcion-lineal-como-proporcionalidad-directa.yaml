semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PROPORCIONALIDAD_DIRECTA
resumen_inicial: La función lineal $f(x) = mx$ representa el modelo matemático exacto de una relación de proporcionalidad directa entre dos variables.
explicacion_simple: |
  Dos cantidades guardan **proporcionalidad directa** si cuando una se multiplica por $k$, la otra también se multiplica por $k$.

  Por ejemplo, si compras manzanas a $\$500$ el kilo ($f(x) = 500x$):
  - $1$ kilo cuesta $\$500$.
  - $2$ kilos cuestan $\$1.000$ (el doble).
  - $3$ kilos cuestan $\$1.500$ (el triple).

  La división $\frac{y}{x} = 500$ siempre da el mismo número constante: la pendiente $m$.
explicacion_formal: |
  Sean $x$ e $y$ dos variables reales. La relación $y = f(x)$ es de **proporcionalidad directa** si y solo si la razón entre la salida y la entrada es una constante fija $k \neq 0$:

  $$\frac{y}{x} = k \iff y = kx$$

  **Identificación con la función lineal:**
  - $k = m$: La constante de proporcionalidad equivale numéricamente a la pendiente de la recta lineal $f(x) = mx$.
definiciones_clave: |
  - **Constante de proporcionalidad ($k$)**: Cociente constante $\frac{y}{x}$ que vincula a dos magnitudes directamente proporcionales.
propiedades_relaciones: |
  - **Paso por el origen**: Todo modelo de proporcionalidad directa pasa necesariamente por $(0, 0)$ (cero insumo genera cero producto).
ejemplo_guiado:
  enunciado: "Un automóvil consume combustible a razón constante. Si recorre $150$ km con $10$ litros de gasolina, escribe la función lineal $D(L)$ del modelo e identifica la constante de proporcionalidad."
  pasos:
    - 'Paso 1: Calcular la razón de proporcionalidad: $k = \frac{\text{Distancia}}{\text{Litros}} = \frac{150}{10} = 15$ km/l.'
    - 'Paso 2: Formular la función lineal: $D(L) = 15L$.'
    - 'Paso 3: Identificar la pendiente: la constante de proporcionalidad es $m = 15$.'
    - 'Paso 4: Concluir que la distancia recorrida es directamente proporcional a los litros consumidos con $D(L) = 15L$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Si $10$ litros permiten recorrer $150$ km a razón constante, ¿cuál es la función lineal $D(L)$ que modela la distancia?"
    choices:
      - {text: "$D(L) = 15L$", is_correct: true}
      - {text: "$D(L) = 150L$", is_correct: false}
      - {text: "$D(L) = L / 15$", is_correct: false}
      - {text: "$D(L) = 15L + 10$", is_correct: false}
    explanation: "La alternativa correcta es '$D(L) = 15L$'. La constante es $k = 150/10 = 15$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué propiedad debe cumplir la razón $\\frac{y}{x}$ en una función de proporcionalidad directa?"
    choices:
      - {text: "Debe ser constante para cualquier par de valores no nulos.", is_correct: true}
      - {text: "Debe aumentar linealmente con el tiempo.", is_correct: false}
      - {text: "Debe ser igual a cero.", is_correct: false}
      - {text: "Debe ser inversamente proporcional al cuadrado de $x$.", is_correct: false}
    explanation: "La alternativa correcta es 'Debe ser constante para cualquier par de valores no nulos.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar las magnitudes pareadas del problema.'
  - 'Paso 2: Calcular el cociente $k = \frac{y}{x}$ verificando su constancia.'
  - 'Paso 3: Redactar la expresión de la función lineal $f(x) = kx$.'
  - 'Paso 4: Interpretar la constante $k$ como la tasa unitaria o pendiente de la situación.'
errores_correccion: |
  - **Error común:** Confundir proporcionalidad directa ($y = kx$) con proporcionalidad inversa ($y = \frac{k}{x}$).
  - **Cómo corregirlo:** En la proporcionalidad directa, las magnitudes se **DIVIDEN** para dar una constante ($\frac{y}{x} = k$); en la inversa se **MULTIPLICAN** ($x \cdot y = k$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función constante y lineal.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función constante y lineal.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En una función lineal $f(x) = mx$, si la variable $x$ se duplica, la variable $y$ se reduce a la mitad.'
  - 'La razón entre la variable dependiente e independiente $\frac{y}{x}$ varía constantemente en una función lineal.'
  - 'Una relación de proporcionalidad directa se grafica como una curva parabólica en el primer cuadrante.'
  - 'El valor de la constante de proporcionalidad $k$ es siempre independiente de la pendiente $m$ de la recta.'
  - 'Una función afín $f(x) = mx + b$ con $b \neq 0$ representa una relación de proporcionalidad directa perfecta.'
afirmaciones_verdaderas:
  - 'La función lineal $y = mx$ modela una relación de proporcionalidad directa entre $x$ e $y$, donde la constante de proporcionalidad es la pendiente $m = \frac{y}{x}$.'
  - 'Dos magnitudes son directamente proporcionales si su cociente $\frac{y}{x}$ permanece constante para todo par $(x, y)$ con $x \neq 0$.'
al_terminar_debes_poder: |
  QUÉ: Interpretar la función lineal como un modelo algebraico de proporcionalidad directa.
  CÓMO: Verificar la constancia de la razón $\frac{y}{x} = m$ y resolver problemas de cambio proporcional directo.
