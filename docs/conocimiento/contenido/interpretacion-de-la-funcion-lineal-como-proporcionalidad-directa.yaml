semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PROPORCIONALIDAD_DIRECTA
resumen_inicial: La función lineal $f(x) = mx$ es el modelo algebraico exacto de la proporcionalidad directa, donde la pendiente $m$ es la constante de proporcionalidad $k$.
explicacion_simple: '![La función lineal $f(x) = mx$ es el modelo algebraico exacto de la proporcionalidad directa, donde la pendiente $m$ es la constante de proporcionalidad $k$](/static/img/nodos/interpretacion-de-la-funcion-lineal-como-proporcionalidad-directa-intro.svg)



  Dos variables son **directamente proporcionales** cuando al multiplicar una por un número, la otra queda multiplicada por ese mismo número:

  - La razón entre ambas es constante: $\frac{y}{x} = k$.

  - Al despejar $y$, obtenemos la fórmula: $y = kx$.


  Esta es exactamente la fórmula de una **función lineal** $f(x) = mx$, donde la **pendiente $m$ es la constante de proporcionalidad $k$**.'
explicacion_formal: 'Dos magnitudes variables $x$ e $y$ están en **proporcionalidad directa** si su cociente es invariante:

  $$\frac{y}{x} = k \quad (k \in \mathbb{R} \setminus \{0\}, \ x \neq 0) \Longleftrightarrow y = kx$$


  **Correspondencia con el modelo lineal:**

  - La relación funcional asociada es $f(x) = mx$ con $m = k$.

  - **Propiedad de escala**: $f(cx) = m(cx) = c(mx) = c f(x)$ para todo escalar $c$.

  - **Origen forzado**: Para que exista proporcionalidad directa estricta, la gráfica DEBE pasar por el origen $(0, 0)$ ($n = 0$). Una función afín con $n \neq 0$ no representa proporcionalidad directa porque $\frac{mx+n}{x} = m + \frac{n}{x} \neq \text{cte}$.'
definiciones_clave: '- **Proporcionalidad directa**: Relación donde el cociente entre dos variables es constante.

  - **Constante de proporcionalidad ($k$)**: Razón constante $\frac{y}{x}$ que coincide con la pendiente $m$ de la función lineal.'
propiedades_relaciones: '- **Modelamiento físico**: Ley de Hooke ($F = kx$), Movimiento Rectilíneo Uniforme ($d = vt$), Ley de Ohm ($V = IR$).

  - **Exclusión de función afín**: Toda función afín con intercepto $n \neq 0$ no es de proporcionalidad directa.'
ejemplo_guiado:
  enunciado: '![Ejemplo La función lineal $f(x) = mx$ es el modelo algebraico exacto de la proporcionalidad directa, donde la pendiente $m$ es la constante de proporcionalidad $k$](/static/img/nodos/interpretacion-de-la-funcion-lineal-como-proporcionalidad-directa-ejemplos.svg)



    Un automóvil viaja a velocidad constante recorriendo $180\text{ km}$ en $2\text{ horas}$. Escribe la función lineal de la distancia en función del tiempo y calcula la constante de proporcionalidad.'
  pasos:
  - 'Paso 1: Identificar las variables: tiempo $t$ (horas) y distancia $d$ (km).'
  - 'Paso 2: Calcular la constante de proporcionalidad: $k = \frac{d}{t} = \frac{180}{2} = 90\text{ km/h}$.'
  - 'Paso 3: Igualar la constante a la pendiente: $m = 90$.'
  - 'Paso 4: Escribir la función lineal: $d(t) = 90t$.'
  - 'Paso 5: Verificar: en $t = 0$, $d(0) = 0\text{ km}$ (pasa por el origen).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué una función afín como $f(x) = 3x + 5$ NO representa una relación de proporcionalidad directa?
  choices:
  - text: Porque el cociente y/x no es constante y la recta no pasa por el origen.
    is_correct: true
  - text: Porque su pendiente es 3.
    is_correct: false
  - text: Porque no es una función real.
    is_correct: false
  - text: Porque es decreciente.
    is_correct: false
  explanation: La alternativa correcta es 'Porque el cociente y/x no es constante y la recta no pasa por el origen.'. En una función afín, $\frac{3x+5}{x} = 3 + \frac{5}{x}$, que varía según el valor de $x$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el precio de $4\text{ kg}$ de manzanas es $\$6.000$, ¿cuál es la función lineal del precio $P(x)$ según los kilos $x$?
  choices:
  - text: P(x) = 1500x
    is_correct: true
  - text: P(x) = 6000x
    is_correct: false
  - text: P(x) = 4x + 6000
    is_correct: false
  - text: P(x) = 1500x + 4
    is_correct: false
  explanation: La alternativa correcta es 'P(x) = 1500x'. $k = \frac{6000}{4} = 1500$, luego $P(x) = 1500x$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las variables dependiente ($y$) e independiente ($x$).'
- 'Paso 2: Calcular el cociente $k = \frac{y}{x}$ con un par de datos conocidos.'
- 'Paso 3: Establecer la pendiente $m = k$.'
- 'Paso 4: Escribir la fórmula de la función lineal $f(x) = kx$ y verificar su paso por $(0, 0)$.'
errores_correccion: '- **Error común:** Afirmar que $y = 2x + 10$ es proporcionalidad directa porque es una recta.

  - **Cómo corregirlo:** La proporcionalidad directa exige que si $x$ es cero, $y$ debe ser cero ($y = 0$). Si hay un cobro fijo o término constante $n \neq 0$, no es proporcionalidad directa.'
ejemplos:
- titulo: 'Ejemplo 1: Constante de proporcionalidad'
  enunciado: Si $y$ es directamente proporcional a $x$, y cuando $x = 5$ se tiene $y = 35$, ¿cuál es la constante de proporcionalidad?
  alternativas:
  - '7'
  - '175'
  - 5/35
  - '30'
  respuesta: '7'
  solucion_pasos:
  - 'Paso 1: $k = \frac{35}{5} = 7$.'
- titulo: 'Ejemplo 2: Escalamiento directo'
  enunciado: En la función de proporcionalidad $f(x) = 12x$, si la entrada se triplica ($3x$), ¿qué ocurre con la salida?
  alternativas:
  - Se triplica (3f(x))
  - Se multiplica por 12
  - Aumenta en 3
  - Se multiplica por 36
  respuesta: Se triplica (3f(x))
  solucion_pasos:
  - 'Paso 1: $f(3x) = 12(3x) = 3(12x) = 3f(x)$.'
- titulo: 'Ejemplo 3: Identificación de tabla proporcional'
  enunciado: ¿Cuál de las siguientes tablas representa una función lineal de proporcionalidad directa?
  alternativas:
  - 'x: [1, 2, 3] -> y: [4, 8, 12]'
  - 'x: [1, 2, 3] -> y: [5, 7, 9]'
  - 'x: [1, 2, 3] -> y: [1, 4, 9]'
  - 'x: [1, 2, 3] -> y: [6, 6, 6]'
  respuesta: 'x: [1, 2, 3] -> y: [4, 8, 12]'
  solucion_pasos:
  - 'Paso 1: En la primera tabla, $4/1 = 8/2 = 12/3 = 4$ (cociente constante $k = 4$).'
- titulo: 'Ejemplo 4: Aplicación contextual'
  enunciado: Un grifo vierte agua a razón de $15\text{ litros por minuto}$. ¿Qué función modela el volumen $V(t)$ en $t$ minutos?
  alternativas:
  - V(t) = 15t
  - V(t) = t/15
  - V(t) = 15 + t
  - V(t) = 15t + 10
  respuesta: V(t) = 15t
  solucion_pasos:
  - 'Paso 1: $V(t) = 15t$, función lineal directa con constante $k = 15$.'
errores_frecuentes:
- Confundir proporcionalidad directa (y = kx) con función afín (y = mx + n).
- Invertir la constante calculando x/y en vez de y/x.
- Asumir que si dos cantidades crecen juntas siempre son directamente proporcionales (pueden crecer sin razón constante).
afirmaciones_verdaderas:
- Toda relación de proporcionalidad directa se modela mediante una función lineal f(x) = kx con constante k = m.
- La gráfica de una relación de proporcionalidad directa es siempre una línea recta que pasa por el origen (0, 0).
al_terminar_debes_poder: '**QUÉ:** Modelar e interpretar problemas de proporcionalidad directa mediante funciones lineales.


  **CÓMO:** Identificando la constante de proporcionalidad k como la pendiente m de la recta y = kx y verificando el paso por el origen.


  ![Resumen La función lineal $f(x) = mx$ es el modelo algebraico exacto de la proporcionalidad directa, donde la pendiente $m$ es la constante de proporcionalidad $k$](/static/img/nodos/interpretacion-de-la-funcion-lineal-como-proporcionalidad-directa-resumen.svg)'
