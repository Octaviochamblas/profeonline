semantic_id: MAT.ALG.FUNCION_RECTAS_BASE.PROPORCIONALIDAD_DIRECTA
resumen_inicial: La función lineal $f(x) = m x$ es el modelo algebraico de dos magnitudes
  directamente proporcionales, donde $m$ es la constante de proporcionalidad.
explicacion_simple: 'Dos magnitudes son **directamente proporcionales** si al duplicar
  una, la otra también se duplica; y al triplicarla, se triplica.

  La relación entre dos variables directamente proporcionales se modela mediante la
  **función lineal** $y = k \cdot x$ (donde $k = m$ es la constante de proporcionalidad).

  La razón entre cualquier imagen y su preimagen es constante: $\frac{y}{x} = k$.'
explicacion_formal: 'Dos variables $x, y \in \mathbb{R}$ están en **proporcionalidad
  directa** si y solo si la razón $\frac{y}{x}$ permanece constante:


  $$\frac{y}{x} = k \iff y = k \cdot x \iff f(x) = m \cdot x \quad (\text{con } k
  = m)$$


  **Desglose de la fórmula:**

  - $k = m$: Pendiente de la recta lineal equivalente a la constante de proporcionalidad
  directa.'
definiciones_clave: '- **Proporcionalidad directa**: Relación constante entre dos
  variables tal que el cociente entre cada salida y entrada es invariable.

  - **Constante de proporcionalidad ($k$)**: Valor fijo del cociente $\frac{y}{x}$
  correspondiente a la pendiente de la función lineal.'
propiedades_relaciones: '- **Propiedad de escala**: $f(c \cdot x) = c \cdot f(x)$
  para cualquier escalar $c \in \mathbb{R}$.'
ejemplo_guiado:
  enunciado: Si $3\text{ kg}$ de manzanas cuestan $\$2.400$, halla la constante de
    proporcionalidad $k$, escribe la función lineal y calcula el costo de $7\text{
    kg}$.
  pasos:
  - 'Paso 1: Calcular la constante de proporcionalidad: $k = \frac{2400}{3} = 800\text{
    pesos/kg}$.Paso 2: Escribir la función lineal: $f(x) = 800x$.Paso 3: Evaluar para
    $x = 7$: $f(7) = 800(7) = 5.600$.Paso 4: Concluir que el costo de $7\text{ kg}$
    de manzanas es $\$5.600$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $3\text{ kg}$ de manzanas cuestan $\$2.400$, ¿cuál es la función lineal
    $f(x)$ que modela el costo en función de los kilogramos $x$?
  choices:
  - text: $f(x) = 800x$
    is_correct: true
  - text: $f(x) = 2400x$
    is_correct: false
  - text: $f(x) = 800 + x$
    is_correct: false
  - text: $f(x) = \frac{x}{800}$
    is_correct: false
  explanation: La alternativa correcta es '$f(x) = 800x$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa la pendiente $m = 800$ de la función lineal en el contexto
    de la compra de manzanas?
  choices:
  - text: El precio unitario constante por cada kilogramo de manzana ($\$800/\text{kg}$).
    is_correct: true
  - text: El número total de manzanas compradas.
    is_correct: false
  - text: El descuento aplicado.
    is_correct: false
  - text: El presupuesto máximo disponible.
    is_correct: false
  explanation: La alternativa correcta es 'El precio unitario constante por cada kilogramo
    de manzana ($\$800/\text{kg}$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir la variable de salida entre la entrada dada para obtener $k = \frac{y}{x}$.'
- 'Paso 2: Formular la función lineal $f(x) = k \cdot x$.'
- 'Paso 3: Evaluar la función en la nueva cantidad solicitada.'
errores_correccion: '- **Error común:** Intentar modelar la proporcionalidad directa
  agregando un término fijo (escribir $f(x) = k x + b$).

  - **Cómo corregirlo:** La proporcionalidad directa exige paso por el origen ($b
  = 0$), por lo que se modela EXCLUSIVAMENTE con la función lineal $f(x) = k x$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función constante y lineal.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de pendiente de rectas.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda función lineal pasa obligatoriamente por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque f(0) = m(0) = 0.
- titulo: ¿Una pendiente positiva m > 0 indica que la función es estrictamente creciente?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta sube de izquierda a derecha en el plano.
errores_frecuentes:
- Confundir la función lineal $f(x) = m x$ (pasa por el origen) con la función afín
  $f(x) = m x + b$ (no pasa por el origen).
- Invertir los términos de la fórmula de la pendiente calculando $\frac{\Delta x}{\Delta
  y}$ en lugar de $\frac{\Delta y}{\Delta x}$.
- Creer que las rectas verticales $x = k$ representan funciones constantes (las rectas
  verticales no son funciones).
- Creer que una función con pendiente negativa no puede tomar valores o imágenes positivas.
- Confundir pendiente nula ($m = 0$, recta horizontal) con pendiente indefinida (división
  por cero, recta vertical).
afirmaciones_verdaderas:
- La gráfica de toda función lineal $f(x) = m x$ es una recta que pasa obligatoriamente
  por el origen de coordenadas $(0, 0)$.
- La pendiente $m = \frac{y_2 - y_1}{x_2 - x_1}$ es la tasa constante de variación
  que mide la inclinación de la recta en el plano cartesiano.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, graficar y analizar
  funciones constantes y lineales, calculando e interpretando el significado de la
  pendiente.
