procedimiento:
- 'Paso 1: Verifica que la razón entre las dos magnitudes sea constante para todos
  los pares de datos.'
- 'Paso 2: Si es constante, identifica ese valor como la constante de proporcionalidad
  $k$.'
- 'Paso 3: Modela la relación mediante la función lineal $f(x) = kx$.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar interpretación de la función lineal como proporcionalidad directa.
ejemplos:
- titulo: Verificación de proporcionalidad directa
  enunciado: 'Una tabla muestra: 2 horas $\to$ 100 km; 4 horas $\to$ 200 km; 6 horas
    $\to$ 300 km. ¿Es proporcionalidad directa?'
  solucion_pasos:
  - Se calcula la razón en cada caso - $100/2=50$; $200/4=50$; $300/6=50$.
  - La razón es constante, así que es proporcionalidad directa con $k=50$.
- titulo: Modelamiento con constante de proporcionalidad
  enunciado: Si el costo de $n$ entradas al cine es directamente proporcional a $n$,
    y 3 entradas cuestan \$15.000, determina la fórmula.
  solucion_pasos:
  - Se calcula $k = 15000/3 = 5000$.
  - $C(n) = 5000n$.
- titulo: ¿Toda función lineal representa una proporcionalidad directa?
  enunciado: ¿Toda función lineal representa una proporcionalidad directa?
  respuesta: Sí
  solucion_pasos:
  - Por definición, $f(x)=mx$ satisface $y/x=m$ constante, que es exactamente la condición
    de proporcionalidad directa.
- titulo: ¿Una función afín $f(x)=mx+n$ con $n\neq 0$ representa proporcionalidad
    directa?
  enunciado: ¿Una función afín $f(x)=mx+n$ con $n\neq 0$ representa proporcionalidad
    directa?
  respuesta: 'No'
  solucion_pasos:
  - La razón $y/x$ no es constante cuando hay un término independiente distinto de
    cero.
errores_frecuentes:
- Confundir proporcionalidad directa con cualquier relación creciente entre dos magnitudes.
- No verificar que la razón sea constante para TODOS los pares de datos, solo para
  algunos.
- Aplicar el modelo de proporcionalidad directa a relaciones que en realidad son afines
  (con intercepto distinto de cero).
- Calcular la constante de proporcionalidad usando solo un par de datos sin verificar
  consistencia con los demás.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando interpretación
  de la función lineal como proporcionalidad directa.
