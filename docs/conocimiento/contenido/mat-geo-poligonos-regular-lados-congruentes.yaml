semantic_id: MAT.GEO.POLIGONOS_METRICA.REGULAR_LADOS_CONGRUENTES
resumen_inicial: 'Propiedad de lados congruentes en un polígono regular: conceptos,
  teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: 'Los polígonos regulares tienen una característica visual muy
  reconocible: perfecta uniformidad en la longitud de sus lados.'
explicacion_formal: '![Lados congruentes en un polígono regular](/static/img/geometria/poligonos-cuadrilateros/poligonos-regular-lados-congruentes.svg)


  ### Definición formal


  Un polígono regular de $n$ lados tiene todos sus lados de igual longitud $l$, por
  lo que su perímetro es $P=n\times l$.


  ### Desarrollo didáctico


  Un hexágono regular con lado de 5 cm tiene los 6 lados exactamente iguales, y su
  perímetro es $6\times5=30$ cm. Esta propiedad simplifica enormemente los cálculos
  de perímetro en polígonos regulares, comparado con los irregulares.'
