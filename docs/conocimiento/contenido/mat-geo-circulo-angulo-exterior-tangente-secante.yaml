  tangente y una secante.'
ejemplo_guiado:
  enunciado: Para analizar medida de un ángulo exterior formado por una tangente y
    una secante, considera un ángulo $\alpha = 119^\circ$ ubicado en la posición dada.
    Determina el valor de la medida asociada sabiendo que $x + 1044^\circ = 119^\circ$.
  pasos:
  - Identificar la propiedad de medida de un ángulo exterior formado por una tangente
    y una secante referida a $\alpha = 119^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1044 = 119 \implies x = 119 - 1044$.'
  - Concluir que la medida calculada para medida de un ángulo exterior formado por
    una tangente y una secante es $x = -925^\circ$.
