procedimiento:
- 'Paso 1: Identifica el punto exterior P, el punto de tangencia T y los dos puntos
  de corte de la secante (A cercano, B lejano).'
- 'Paso 2: Identifica el arco lejano TB y el arco cercano TA (ambos medidos desde
  el punto de tangencia).'
- 'Paso 3: Resta el arco cercano al arco lejano y divide el resultado entre 2 para
  obtener la medida del ángulo en P.'
