semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_EXTERIOR_TANGENTE_SECANTE
resumen_inicial: 'Medida de un ángulo exterior formado por una tangente y una secante:
  conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Cuando desde un punto exterior se traza una tangente y también
  una secante, el ángulo entre ambas también depende de una semidiferencia de arcos,
  igual que con dos secantes.
explicacion_formal: '![Ángulo exterior formado por tangente y secante](/static/img/geometria/circunferencia-circulo/circulo-angulo-exterior-tangente-secante.svg)


  ### Definición formal


  Si desde un punto exterior $P$ se traza una tangente (que toca la circunferencia
  en $T$) y una secante (que la corta en $A$ y $B$, con $B$ el punto más alejado de
  $P$), entonces $m(\angle P)=\frac{m(\text{arco }TB)-m(\text{arco }TA)}{2}$, la semidiferencia
  entre el arco lejano y el arco cercano (ambos medidos desde el punto de tangencia
  $T$).


  ### Desarrollo didáctico


  Si el arco lejano $TB$ mide 110° y el arco cercano $TA$ mide 40°, el ángulo en $P$
  mide $\frac{110°-40°}{2}=35°$. Esta fórmula es análoga a la del ángulo exterior
  de dos secantes, reemplazando uno de los puntos de intersección por el punto de
  tangencia.'
definiciones_clave: '- **Medida de un ángulo exterior formado por una tangente y una
  secante**: Elemento o propiedad fundamental en el estudio de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
