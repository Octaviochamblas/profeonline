semantic_id: MAT.NUM.FRACCIONES_CONCEPTO.NUMERADOR_IDENTIFICACION
resumen_inicial: El numerador es el término superior de la fracción $\frac{a}{b}$
  que indica el número de partes consideradas o tomadas de la unidad.
explicacion_simple: El numerador es la cifra que se ubica por encima de la raya de
  fracción. Su función consiste en numerar o contar exactamente cuántas de las partes
  iguales se están tomando, seleccionando, pintando o analizando.
explicacion_formal: 'En la fracción $\frac{a}{b}$, el **Numerador** $a \in \mathbb{Z}$
  es la función de conteo discreto que determina el número de unidades fraccionarias
  de magnitud $\frac{1}{b}$ que constituyen la cifra total:


  $$a = \operatorname{num}\left(\frac{a}{b}\right) = \frac{a}{b} \cdot b$$


  **Desglose de la fórmula:**

  - $\operatorname{num}\left(\frac{a}{b}\right) = a$: Operador de extracción del valor
  superior de la fracción.

  - $a \in \mathbb{Z}$: Término entero que indica el número de piezas o unidades fraccionarias
  seleccionadas.


  > **Complemento didáctico:** Etimológicamente ''numerador'' proviene del latín *numerator*,
  que significa ''el que cuenta''.'
definiciones_clave: '- **Numerador**: Término superior $a$ de una fracción que contabiliza
  la cantidad de partes consideradas.'
propiedades_relaciones: '- **Posición estructural**: Ubicado en el nivel superior
  por encima de la raya de fracción.'
ejemplo_guiado:
  enunciado: Identifique el numerador en la fracción $\frac{7}{12}$ y explique su
    significado en el modelo parte-todo.
  pasos:
  - 'Paso 1: Observar la posición de los números respecto a la raya divisoria.'
  - 'Paso 2: El número ubicado arriba es el $7$, por lo tanto el numerador es $7$.'
  - 'Paso 3: Interpretar: el $7$ indica que se están tomando $7$ partes de las $12$
    partes iguales disponibles.'
  - 'Conclusión: El numerador es $7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué posición de la fracción a/b se ubica el numerador?
  choices:
  - text: En la parte superior (arriba de la línea de fracción)
    is_correct: true
  - text: En la parte inferior (abajo de la línea)
    is_correct: false
  - text: A la derecha del signo igual
    is_correct: false
  - text: No tiene posición fija
    is_correct: false
  explanation: La alternativa correcta es 'En la parte superior (arriba de la línea
    de fracción)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado con la fracción 7/12, ¿cuál es el numerador?
  choices:
  - text: '7'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '19'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: La alternativa correcta es '7'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la línea o barra horizontal de la fracción.'
- 'Paso 2: Identificar el número ubicado justo por encima de dicha línea.'
- 'Paso 3: Declarar dicho valor superior como el numerador de la fracción.'
errores_correccion: '- **Error 1: Confundir el numerador con el denominador.** **Cómo
  corregirlo:** Recordar que el NUMERADOR se ubica ARRIBA de la raya de fracción.


  - **Error 2: Pensar que el numerador no puede ser cero.** **Cómo corregirlo:** El
  numerador SÍ puede ser cero ($\frac{0}{b} = 0$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el numerador en la fracción 9/4?
  alternativas:
  - '9'
  - '4'
  - '13'
  respuesta: '9'
  solucion_pasos:
  - El valor superior por encima de la barra es 9.
- titulo: Ejemplo 2
  enunciado: Si en una fracción el numerador vale 0 y el denominador 5, ¿cuál es la
    fracción?
  alternativas:
  - 0/5
  - 5/0
  - '0'
  respuesta: 0/5
  solucion_pasos:
  - 'El numerador 0 va arriba: 0/5.'
- titulo: ¿Se ubica el numerador arriba de la barra divisoria?
  respuesta: Sí
  solucion_pasos:
  - Sí, el numerador es la parte superior de la fracción.
- titulo: ¿Es el 8 el numerador en la fracción 3/8?
  respuesta: 'No'
  solucion_pasos:
  - No, el 8 está abajo por lo que es el denominador; el numerador es 3.
errores_frecuentes:
- El numerador se localiza en la parte inferior de la barra de fracción.
- El numerador de una fracción no puede adoptar valores negativos ni el cero.
- En la fracción $a/b$, el numerador representa en cuántas partes se corta el objeto.
- Si el numerador es mayor que el denominador la expresión deja de ser una fracción.
- El numerador se calcula sumando 1 al denominador.
afirmaciones_verdaderas:
- El numerador es el término ubicado en la parte superior de una fracción que cuenta
  las partes seleccionadas.
- El numerador de un número racional puede tomar el valor de cero o valores negativos.
al_terminar_debes_poder: Al terminar serás capaz de identificar el numerador en cualquier
  fracción, reconociendo su posición superior y su función de contar las partes seleccionadas.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
