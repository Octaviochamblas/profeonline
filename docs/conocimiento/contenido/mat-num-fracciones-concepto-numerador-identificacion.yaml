semantic_id: MAT.NUM.FRACCIONES_CONCEPTO.NUMERADOR_IDENTIFICACION
resumen_inicial: "El numerador es el número ubicado sobre la barra de fracción que indica cuántas partes iguales del entero se están considerando o tomando."
explicacion_simple: |
  Cuando escribes una fracción como $\frac{3}{5}$, el número que va arriba (el $3$) se llama numerador. Piensa en él como el 'contador' de tu fracción: responde exactamente a la pregunta '¿cuántas partes de las que dividí me voy a comer o llevar?'. Si el numerador es cero, no estás tomando ninguna parte; si es igual al denominador, te estás llevando el entero completo.
explicacion_formal: |
  En la notación simbólica de una fracción $\frac{a}{b}$ (con $b \neq 0$), el **numerador** es el número entero $a$ posicionado por encima de la barra divisoria o vinculum.

  Desde la perspectiva cuantitativa, el numerador actúa como un operador multiplicativo sobre la unidad fraccionaria $\frac{1}{b}$, de modo que:
  $$\frac{a}{b} = a \cdot \left(\frac{1}{b}\right) = \underbrace{\frac{1}{b} + \frac{1}{b} + \dots + \frac{1}{b}}_{a\text{ veces}}$$
  El valor del numerador $a$ determina si la fracción es nula ($a = 0$), propia ($a < b$), unitaria ($a = b$) u impropia ($a > b$).
definiciones_clave: |
  - **Numerador**: Término superior de una fracción que expresa el número de partes consideradas de la unidad.
  - **Vinculum o barra de fracción**: Línea horizontal o inclinada que separa el numerador del denominador y representa la división.
  - **Contador de unidades fraccionarias**: Función matemática del numerador al iterar la suma de la unidad fraccionaria $\frac{1}{b}$.
propiedades_relaciones: |
  - **Proporcionalidad directa**: Al mantener fijo el denominador $b$, el valor de la fracción varía de manera directamente proporcional al numerador $a$.
  - **Numerador cero**: Si $a = 0$ y $b \neq 0$, la fracción equivale exactamente a $0$ ($\frac{0}{b} = 0$).
  - **Igualdad al denominador**: Si $a = b$, la fracción equivale a la unidad entera ($\frac{b}{b} = 1$).
ejemplo_guiado:
  enunciado: "En la fracción $\\frac{7}{9}$, identifica el numerador, explica su significado en la relación parte-todo y exprésalo como múltiplo de la unidad fraccionaria."
  pasos:
    - "Identificar la posición superior en la barra de fracción: el número que está arriba es $7$."
    - "Determinar el rol conceptual: el numerador $7$ indica que de un entero dividido en $9$ partes iguales, se consideran exactamente $7$ partes."
    - "Expresar como múltiplo de la unidad fraccionaria $\\frac{1}{9}$: la fracción es equivalente a $7 \\cdot \\left(\\frac{1}{9}\\right)$."
checkpoints:
  - placement: after_explicacion_formal
    question: "En la fracción $\\frac{a}{b}$, ¿qué rol cumple el numerador $a$ con respecto a la unidad fraccionaria $\\frac{1}{b}$?"
    choices:
      - {text: "$Actúa como un contador o factor que indica cuántas veces se repite la unidad fraccionaria \\frac{1}{b}.$", is_correct: true}
      - {text: "Indica la cantidad total de partes iguales en que se dividió la unidad.", is_correct: false}
      - {text: "Representa el residuo de dividir $a$ entre $b$.", is_correct: false}
      - {text: "Indica el valor decimal exacto que debe sumarse al entero.", is_correct: false}
    explanation: "$La correcta es Actúa como un contador o factor que indica cuántas veces se repite la unidad fraccionaria \\frac{1}{b}.: el numerador cuantifica las iteraciones de la unidad fraccionaria en la expresión.$"
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Dada la fracción $\\frac{13}{8}$, ¿cuál es su numerador y qué indica sobre la cantidad de enteros?"
    choices:
      - {text: "El numerador es $13$ e indica que se consideran más partes que las que componen un solo entero.", is_correct: true}
      - {text: "El numerador es $8$ e indica que el entero se dividió en $13$ partes.", is_correct: false}
      - {text: "El numerador es $13$ e indica que la fracción es exactamente igual a 1 entero.", is_correct: false}
      - {text: "El numerador es $5$ porque es la diferencia entre $13$ y $8$.", is_correct: false}
    explanation: "La correcta es El numerador es $13$ e indica que se consideran más partes que las que componen un solo entero.: $13$ es el término superior y al ser mayor que $8$, supera la unidad."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Localizar la barra de fracción (vinculum)."
  - "Paso 2: Identificar el número ubicado inmediatamente arriba de la barra; ese número es el numerador."
  - "Paso 3: Interpretar el numerador como el total de partes o elementos tomados de la unidad."
errores_correccion: |
  Un error habitual es confundir el numerador con el denominador e interpretar que el número de arriba indica las partes totales. Para evitarlo, recuerda siempre la regla nemotécnica: **N**umerador va **N**orte (arriba), y cuenta el número de partes consideradas.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Se tiene la fracción $\\frac{5}{12}$. Identifica cuál es el numerador y determina cuántas unidades fraccionarias de $\\frac{1}{12}$ representa."
    alternativas:
      - "$El numerador es 5 y representa 5 unidades fraccionarias de \\frac{1}{12}.$"
      - "$El numerador es 12 y representa 5 unidades fraccionarias de \\frac{1}{5}.$"
      - "$El numerador es 5 y representa 12 unidades fraccionarias de \\frac{1}{5}.$"
    respuesta: "$El numerador es 5 y representa 5 unidades fraccionarias de \\frac{1}{12}.$"
    solucion_pasos:
      - "El término superior por encima de la barra es el 5."
      - "La fracción se compone sumando 5 veces la unidad fraccionaria $\\frac{1}{12}$."
  - titulo: "Ejemplo 2"
    enunciado: "Un estudiante comió $\\frac{3}{4}$ de un paquete de galletas. ¿Qué número cumple el rol de numerador y qué representa en este problema?"
    alternativas:
      - "El numerador es 3 y representa las galletas consumidas respecto al total de 4 partes del paquete."
      - "El numerador es 4 y representa las galletas que venían originalmente en el paquete."
      - "El numerador es 1 y representa la galleta sobrante."
    respuesta: "El numerador es 3 y representa las galletas consumidas respecto al total de 4 partes del paquete."
    solucion_pasos:
      - "Ubicamos el número en la parte superior de $\\frac{3}{4}$, que corresponde al 3."
      - "El 3 expresa la cantidad de porciones o partes consideradas (las galletas comidas)."
  - titulo: "¿Es posible que el numerador de una fracción sea igual a cero?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, si el numerador es 0, significa que se consideran 0 partes del entero, resultando $\\frac{0}{b} = 0$ (con $b \\neq 0$)."
  - titulo: "¿Si el numerador de una fracción es mayor que su denominador, la fracción representa un valor mayor que 1?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, cuando el numerador supera al denominador ($a > b$), se están tomando más partes que las de un solo entero (fracción impropia)."
errores_frecuentes:
  - "Confundir la ubicación del numerador creyendo que es el número escrito debajo de la barra."
  - "Creer que el numerador indica siempre la cantidad de partes sobrantes en lugar de las partes consideradas."
  - "Pensar que el numerador no puede ser mayor que el denominador."
  - "Asumir que si el numerador es 0, la fracción no está definida (confundiendo con denominador 0)."
  - "Olvidar que el numerador es un contador de partes iguales y no una cantidad absoluta sin referencia al entero."
afirmaciones_verdaderas:
  - "El numerador es el término que se ubica por encima de la barra de fracción."
  - "Si el numerador es igual al denominador (con $b \\neq 0$), el valor de la fracción es exactamente $1$."
al_terminar_debes_ponder: |
  Debes ser capaz de identificar inmediatamente el numerador de cualquier fracción $\frac{a}{b}$, interpretar su significado como contador de partes consideradas y relacionarlo con el valor global de la expresión.
