semantic_id: MAT.ALG.ECUACION_BASE.MIEMBROS_ECUACION
resumen_inicial: 'Los miembros de una ecuación son las dos expresiones completas separadas
  por el signo igual: el primer miembro a la izquierda y el segundo miembro a la derecha.'
explicacion_simple: 'Toda ecuación se divide exactamente en dos partes o lados:

  - **Primer miembro**: Es todo lo que está escrito a la izquierda del signo de igual
  ($=$).

  - **Segundo miembro**: Es todo lo que está escrito a la derecha del signo de igual
  ($=$).'
explicacion_formal: 'Dada una ecuación $A(x) = B(x)$, las expresiones $A(x)$ y $B(x)$
  constituyen los **miembros de la ecuación**:


  $$\underbrace{A(x)}_{\text{1.er Miembro}} = \underbrace{B(x)}_{\text{2.º Miembro}}$$


  **Desglose de la fórmula:**

  - Primer Miembro ($A(x)$): Expresión algebraica antecedente a la izquierda del operador
  de igualdad.

  - Segundo Miembro ($B(x)$): Expresión algebraica consecuente a la derecha del operador
  de igualdad.'
definiciones_clave: '- **Primer miembro**: Expresión completa a la izquierda del signo
  igual.

  - **Segundo miembro**: Expresión completa a la derecha del signo igual.'
propiedades_relaciones: '- **Intercambiabilidad de miembros**: Por la propiedad simétrica,
  intercambiar el primer y segundo miembro no altera la solución de la ecuación: $A(x)
  = B(x) \iff B(x) = A(x)$.'
ejemplo_guiado:
  enunciado: Dada la ecuación $5x - 8 = 2x + 13$, identifica su primer y segundo miembro
    y evalúa ambos miembros para la solución $x = 7$.
  pasos:
  - 'Paso 1: Identificar el primer miembro a la izquierda del signo $=$: $5x - 8$.Paso
    2: Identificar el segundo miembro a la derecha del signo $=$: $2x + 13$.Paso 3:
    Evaluar el primer miembro en $x = 7$: $5(7) - 8 = 35 - 8 = 27$.Paso 4: Evaluar
    el segundo miembro en $x = 7$: $2(7) + 13 = 14 + 13 = 27$.Paso 5: Comprobar que
    ambos miembros toman el valor numérico $27$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la ecuación $5x - 8 = 2x + 13$, ¿cuál es el segundo miembro?
  choices:
  - text: $2x + 13$
    is_correct: true
  - text: $5x - 8$
    is_correct: false
  - text: $5x$
    is_correct: false
  - text: $13$
    is_correct: false
  explanation: La alternativa correcta es '$2x + 13$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar ambos miembros para $x = 7$, ¿cuál es el valor numérico común
    obtenido?
  choices:
  - text: $27$
    is_correct: true
  - text: $35$
    is_correct: false
  - text: $14$
    is_correct: false
  - text: $20$
    is_correct: false
  explanation: La alternativa correcta es '$27$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar el signo igual ($=$) en la ecuación.'
- 'Paso 2: Seleccionar toda la expresión escrita a la izquierda del signo $=$ como
  Primer Miembro.'
- 'Paso 3: Seleccionar toda la expresión escrita a la derecha del signo $=$ como Segundo
  Miembro.'
errores_correccion: '- **Error común:** Confundir miembros con términos (creer que
  $5x$ es un miembro).

  - **Cómo corregirlo:** Los miembros son las DOS EXPRESIONES COMPLETAS a cada lado
  del igual. Los términos son las partes separadas por signos $+$ o $-$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de igualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de igualdades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar la misma cantidad en ambos miembros preserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Una ecuación se cumple para todos los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una ecuación condicional solo se cumple para valores específicos.
errores_frecuentes:
- Confundir la definición de una igualdad numérica con la de una expresión algebraica.
- Asumir que las identidades solo son válidas para números enteros positivos.
- Confundir los miembros de una ecuación con sus términos individuales.
- Sumar o restar una cantidad en un solo lado de la ecuación al intentar despejar.
- Dividir ambos miembros de la ecuación entre cero.
afirmaciones_verdaderas:
- Una ecuación es una igualdad condicionada que se verifica solo para determinados
  valores de la incógnita.
- Aplicar las propiedades aditiva y multiplicativa en ambos miembros de una ecuación
  genera ecuaciones equivalentes.
al_terminar_debes_poder: Al finalizar este recurso podrás definir conceptos fundamentales
  de ecuaciones de primer grado y aplicar las propiedades de la igualdad.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Primer Grado
