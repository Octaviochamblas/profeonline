semantic_id: MAT.ALG.ECUACION_BASE.MIEMBROS_ECUACION
resumen_inicial: 'Identificación de miembros de una ecuación: propiedades, resolución
  y modelamiento en Ecuación de primer grado: conceptos y propiedades.'
explicacion_simple: Para hablar el lenguaje del álgebra fluido, necesitas saber cómo
  llamar a las partes de una ecuación. Cuando hablemos de 'pasar de un lado a otro',
  debemos usar los nombres oficiales.
explicacion_formal: '### Definición formal


  Es el nombre formal en álgebra para todo el bloque izquierdo.


  ### Desarrollo didáctico


  Dada la ecuación: $3x + 4 = 2x - 1$


  - **El Signo Igual ($=$)** es la frontera, el muro que divide los dos países.

  - **Primer Miembro (Miembro Izquierdo):** Es TODO lo que está a la izquierda del
  $=$. En este caso, $3x + 4$.

  - **Segundo Miembro (Miembro Derecho):** Es TODO lo que está a la derecha del $=$.
  En este caso, $2x - 1$.


  Es fundamental ver estos miembros como ''paquetes'' completos. Si multiplicas la
  ecuación por 2, debes multiplicar TODO el primer miembro y TODO el segundo miembro.
  No puedes multiplicar partes sueltas.'
definiciones_clave: '- **Identificación de miembros de una ecuación**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a identificación de miembros de una ecuación.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando identificación
    de miembros de una ecuación.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de identificación de
    miembros de una ecuación.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
