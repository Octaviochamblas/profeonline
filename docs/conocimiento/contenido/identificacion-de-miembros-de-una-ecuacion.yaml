semantic_id: MAT.ALG.ECUACION_BASE.MIEMBROS_ECUACION
resumen_inicial: 'Los miembros de una ecuación son las dos expresiones completas separadas por el signo igual: el primer miembro a la izquierda y el segundo miembro a la derecha.'
explicacion_simple: |
  Toda ecuación se estructura dividiéndose exactamente en dos expresiones separadas por el operador de igualdad:

  - **Primer miembro**: Es toda la expresión algebraica o numérica ubicada a la izquierda del signo de igual ($=$).
  - **Segundo miembro**: Es toda la expresión algebraica o numérica ubicada a la derecha del signo de igual ($=$).
explicacion_formal: |
  ### Definición formal
  Dada una ecuación arbitraria $A(x) = B(x)$, las expresiones completas $A(x)$ y $B(x)$ constituyen los **miembros de la ecuación**:

  $$\underbrace{A(x)}_{\text{1.er Miembro}} = \underbrace{B(x)}_{\text{2.º Miembro}}$$

  ### Desglose de la fórmula
  - Primer Miembro ($A(x)$): Expresión algebraica antecedente situada a la izquierda del operador de igualdad.
  - Segundo Miembro ($B(x)$): Expresión algebraica consecuente situada a la derecha del operador de igualdad.

  ### Síntesis didáctica
  Por la propiedad simétrica de la igualdad, intercambiar el primer y segundo miembro no altera en absoluto el conjunto solución de la ecuación: $A(x) = B(x) \iff B(x) = A(x)$.
definiciones_clave: |
  - **Primer miembro**: Expresión completa a la izquierda del signo igual ($=$).
  - **Segundo miembro**: Expresión completa a la derecha del signo igual ($=$).
propiedades_relaciones: |
  - **Intercambiabilidad simétrica**: La relación $A(x) = B(x)$ es totalmente equivalente a $B(x) = A(x)$.
  - **Igualdad de evaluación**: Al sustituir una solución válida $x = k$, ambos miembros producen el mismo valor numérico exacto.
ejemplo_guiado:
  enunciado: 'Dada la ecuación $5x - 8 = 2x + 13$, identifica su primer y segundo miembro y evalúa ambos miembros para la solución $x = 7$.'
  pasos:
    - 'Paso 1: Identificar el primer miembro ubicado a la izquierda del signo $=$: $5x - 8$.'
    - 'Paso 2: Identificar el segundo miembro ubicado a la derecha del signo $=$: $2x + 13$.'
    - 'Paso 3: Evaluar el primer miembro para $x = 7$: $5(7) - 8 = 35 - 8 = 27$.'
    - 'Paso 4: Evaluar el segundo miembro para $x = 7$: $2(7) + 13 = 14 + 13 = 27$.'
    - 'Paso 5: Comprobar que ambos miembros toman el mismo valor numérico $27$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la ecuación $5x - 8 = 2x + 13$, ¿cuál es la expresión completa que constituye el segundo miembro?'
    choices:
      - {text: '$2x + 13$', is_correct: true}
      - {text: '$5x - 8$', is_correct: false}
      - {text: '$5x$', is_correct: false}
      - {text: '$13$', is_correct: false}
    explanation: 'La alternativa correcta es ''$2x + 13$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar ambos miembros de $5x - 8 = 2x + 13$ para $x = 7$, ¿cuál es el valor numérico obtenido?'
    choices:
      - {text: '$27$', is_correct: true}
      - {text: '$35$', is_correct: false}
      - {text: '$14$', is_correct: false}
      - {text: '$20$', is_correct: false}
    explanation: 'La alternativa correcta es ''$27$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar la posición del signo igual ($=$) en la ecuación.'
  - 'Paso 2: Seleccionar toda la expresión escrita a la izquierda del signo $=$ como el Primer Miembro.'
  - 'Paso 3: Seleccionar toda la expresión escrita a la derecha del signo $=$ como el Segundo Miembro.'
  - 'Paso 4: Verificar que cada miembro contenga todos los sumandos de su respectivo lado.'
errores_correccion: |
  - **Error 1:** Confundir miembros con términos individuales (creer que un solo sumando como $5x$ es un miembro). **Cómo corregirlo:** Los miembros son las **DOS EXPRESIONES ALGEBRAICAS COMPLETAS A CADA LADO DEL SIGNO $=$, MIENTRAS QUE LOS TÉRMINOS SON LOS SUMANDOS INDIVIDUALES**.
  - **Error 2:** Omitir el signo del término independiente al identificar un miembro. **Cómo corregirlo:** El miembro **INCLYE TODOS LOS TÉRMINOS Y SUS SIGNOS OPERATIVOS CORRESPONDIENTES**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'En la ecuación $7 - 3x = 4x + 1$, ¿cuál es el primer miembro?'
    alternativas:
      - '$7 - 3x$'
      - '$4x + 1$'
      - '$-3x$'
    respuesta: '$7 - 3x$'
    solucion_pasos:
      - '1. Ubicar el signo $=$.'
      - '2. La expresión completa a la izquierda es $7 - 3x$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Si el primer miembro es $x + 5$ y el segundo miembro es $12$, ¿cuál es la ecuación planteada?'
    alternativas:
      - '$x + 5 = 12$'
      - '$12(x + 5) = 0$'
      - '$x = 5 + 12$'
    respuesta: '$x + 5 = 12$'
    solucion_pasos:
      - '1. Primer miembro: $x + 5$.'
      - '2. Signo de igual: $=$.'
      - '3. Segundo miembro: $12 \implies x + 5 = 12$.'
  - titulo: 'Intercambio de miembros'
    enunciado: '¿La ecuación $2x + 1 = 9$ tiene el mismo conjunto solución que $9 = 2x + 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, intercambiar los miembros completos conserva la igualdad por simetría.'
  - titulo: 'Miembro constante'
    enunciado: '¿El segundo miembro de una ecuación puede ser un único número real constante como el $0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en la forma canónica $ax + b = 0$ el segundo miembro es $0$.'
errores_frecuentes:
  - 'En la ecuación $5x - 8 = 2x + 13$, el término individual $5x$ se considera como el primer miembro completo.'
  - 'El primer miembro de la ecuación $7 - 3x = 4x + 1$ abarca únicamente a los términos que contienen a la variable $x$.'
  - 'Al identificar los miembros de la ecuación $x + 5 = 12$, la constante independiente $+5$ se excluye de la expresión del primer miembro.'
  - 'Al intercambiar por simetría los miembros completos en $2x + 1 = 9$ produciendo $9 = 2x + 1$, el signo del término $2x$ cambia a $-2x$.'
  - 'El signo de igual $=$ en la ecuación $ax + b = 0$ forma parte del contenido del segundo miembro.'
afirmaciones_verdaderas:
  - 'Los miembros de una ecuación son las expresiones algebraicas completas situadas a la izquierda y derecha del signo $=$.'
  - 'La propiedad simétrica garantiza que intercambiar el primer y segundo miembro no altera la solución.'
al_terminar_debes_poder: |
  QUÉ: Identificar el primer y segundo miembro de cualquier ecuación lineal.
  CÓMO: Reconocer la división estructural establecida por el signo de igual y diferenciar miembros de términos individuales.
fuente: 'Texto escolar MINEDUC — Álgebra 7° Básico / Ecuaciones Lineales.'
