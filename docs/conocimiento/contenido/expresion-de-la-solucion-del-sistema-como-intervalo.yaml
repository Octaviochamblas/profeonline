procedimiento:
- Resolver cada inecuación del sistema de forma independiente.
- Representar los valores obtenidos para cada inecuación en una misma recta numérica
  real.
- Identificar gráficamente la región donde se interceptan (superponen) todas las soluciones
  de las inecuaciones.
- Escribir la región interceptada utilizando la notación de intervalos, cuidando emplear
  paréntesis y corchetes según el tipo de desigualdad en los extremos.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en expresión de la solución
  del sistema como intervalo.
ejemplos:
- titulo: Sistema con solución acotada
  enunciado: Exprese en notación de intervalo el conjunto solución del sistema conformado
    por $x > -1$ y $x \\le 4$.
  solucion_pasos:
  - La primera inecuación requiere valores estrictamente mayores a $-1$, correspondiente
    a $(-1, \\infty)$.
  - La segunda inecuación exige valores menores o iguales a $4$, correspondiente a
    $(-\\infty, 4]$.
  - La intersección de ambos conjuntos resulta en los valores simultáneamente mayores
    a $-1$ y menores o iguales a $4$.
  - La notación final es el intervalo semiabierto $(-1, 4]$.
- titulo: Intersección con el vacío
  enunciado: Indique el intervalo solución del sistema $x < 2$ y $x > 5$.
  solucion_pasos:
  - Se observa que los conjuntos son $(-\\infty, 2)$ y $(5, \\infty)$.
  - Al graficar en la recta real, las áreas sombreadas no se solapan en ningún punto.
  - En consecuencia, no hay valores que satisfagan ambas condiciones a la vez.
  - La solución se denota como el conjunto vacío, $\\emptyset$.
- titulo: Traducción de una desigualdad continua
  respuesta: Verdadero
  solucion_pasos:
  - Dada la expresión compuesta $0 \le x < 7$, se identifica el extremo inferior como
    $0$ incluido y el superior como $7$ excluido.
  - Se traduce esto como el intervalo cerrado por la izquierda y abierto por la derecha.
  - La notación final obtenida es $[0, 7)$.
- titulo: Un extremo al infinito
  respuesta: Falso
  solucion_pasos:
  - Se recibe el sistema formado por las condiciones simultáneas $x > 3$ y $x > 8$.
  - La intersección de $(3, \\infty)$ y $(8, \\infty)$ es el conjunto más restrictivo.
  - El conjunto que cumple ambas es únicamente $(8, \\infty)$.
errores_frecuentes:
- Utilizar un corchete al indicar el infinito en un intervalo, escribiendo, por ejemplo,
  $[2, \\infty]$.
- Al unir las condiciones de $x < 3$ y $x < -1$, concluir que la solución es el intervalo
  $(-1, 3)$, asumiendo incorrectamente que forma un tramo cerrado.
- Confundir el intervalo de intersección de $x > 2$ y $x < -3$ con la unión de intervalos,
  dando como respuesta $(-\\infty, -3) \cup (2, \\infty)$ en lugar del conjunto vacío.
- Escribir los intervalos de manera desordenada, colocando el número mayor a la izquierda
  y el menor a la derecha, por ejemplo, $(5, 2)$.
- Asumir que las desigualdades estrictas se asocian a corchetes en lugar de paréntesis.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  expresión de la solución del sistema como intervalo.
