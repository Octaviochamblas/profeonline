semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.TRADUCCION_INTERVALO
resumen_inicial: Expresar la solución de un sistema como intervalo consiste en escribir la intersección $S_1 \cap S_2$ en la notación formal de corchetes.
explicacion_simple: '![Expresión de la solución del sistema como intervalo](/static/img/nodos/expresion-de-la-solucion-del-sistema-como-intervalo-intro.svg)


  Una vez encontrada la región común (por ejemplo $2 < x \le 6$), la traducimos al formato de intervalos:


  - El límite inferior $2$ no está incluido (desigualdad estricta $>$), por lo que lleva corchete abierto hacia afuera $]2$.

  - El límite superior $6$ sí está incluido (desigualdad no estricta $\le$), por lo que lleva corchete cerrado hacia adentro $6]$.


  El resultado final escrito como intervalo es $S = ]2, 6]$.'
explicacion_formal: 'Dada la solución simultánea descrita por la doble desigualdad $a < x \le b$ con $a, b \in \mathbb{R}$, el **intervalo solución del sistema** se define como:


  $$S = ]a, b] = \{x \in \mathbb{R} \mid a < x \le b\}$$


  **Desglose de la fórmula:**

  - $]a$: Corchete abierto indica exclusión de la cota $a$.

  - $b]$: Corchete cerrado indica inclusión de la cota $b$.

  '
definiciones_clave: '- **Notación de intervalo de sistema**: Representación simbólica con corchetes de los valores continuos que satisfacen todas las inecuaciones del sistema.

  '
propiedades_relaciones: '- **Traducción de cotas**: $x > a \implies ]a, +\infty[$. $x \le b \implies ]-\infty, b]$. Su intersección es $]a, b]$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Expresión de la solución del sistema como intervalo](/static/img/nodos/expresion-de-la-solucion-del-sistema-como-intervalo-ejemplos.svg)


    Expresa la solución simultánea del sistema $x > -1$ y $x \le 5$ en notación de intervalo.'
  pasos:
  - 'Paso 1: Identificar la cota inferior: $x > -1 \implies -1$ (excluido, corchete $]-1$).'
  - 'Paso 2: Identificar la cota superior: $x \le 5 \implies 5$ (incluido, corchete $5]$).'
  - 'Paso 3: Unir ambas cotas en una condición continua: $-1 < x \le 5$.'
  - 'Paso 4: Escribir la solución en notación de intervalo: $S = ]-1, 5]$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la notación de intervalo correcta para la solución simultánea $-1 < x \le 5$?
  choices:
  - text: $S = ]-1, 5]$
    is_correct: true
  - text: $S = [-1, 5[$
    is_correct: false
  - text: $S = ]-1, 5[$
    is_correct: false
  - text: $S = [-1, 5]$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-1, 5]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué tipo de corchete se utiliza para el límite $-1$ en la desigualdad estricta $x > -1$?
  choices:
  - text: Corchete abierto mirando hacia afuera ($]-1$).
    is_correct: true
  - text: Corchete cerrado mirando hacia adentro ($[-1$).
    is_correct: false
  - text: Paréntesis redondo únicamente.
    is_correct: false
  - text: Llave de conjunto $\{ -1 \}$.
    is_correct: false
  explanation: La alternativa correcta es 'Corchete abierto mirando hacia afuera ($]-1$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las cotas numéricas de la intersección.'
- 'Paso 2: Determinar si cada cota es abierta ($<, >$) o cerrada ($\le, \ge$).'
- 'Paso 3: Escribir la cota inferior a la izquierda y la cota superior a la derecha separadas por coma.'
- 'Paso 4: Encerrar con los corchetes adecuados.'
errores_correccion: '- **Error común:** Escribir corchete cerrado en cotas strictly ($>$ o $<$).

  - **Cómo corregirlo:** Si la desigualdad es estricta ($>$ o $<$), el extremo NO pertenece al conjunto y el corchete debe mirar hacia afuera.

  '
ejemplos:
- titulo: 'Ejemplo 1: Intervalo acotado'
  enunciado: Si la solución final es $-3 < x \leq 5$, ¿cómo se escribe como intervalo?
  alternativas:
  - $]-3, 5]$
  - $[-3, 5]$
  - $]-3, 5[$
  - $[-3, 5[$
  respuesta: $]-3, 5]$
  solucion_pasos:
  - 'Paso 1: Abierto en $-3$ y cerrado en $5$.'
  - 'Paso 2: $S = ]-3, 5]$.'
- titulo: 'Ejemplo 2: Intervalo no acotado'
  enunciado: Si la intersección resulta $x \geq 2$, ¿cuál es su notación de intervalo?
  alternativas:
  - $[2, +\infty[$
  - $]2, +\infty[$
  - $]-\infty, 2]$
  - $]-\infty, 2[$
  respuesta: $[2, +\infty[$
  solucion_pasos:
  - 'Paso 1: Cerrado en $2$ hacia el infinito positivo.'
  - 'Paso 2: $S = [2, +\infty[$.'
- titulo: 'Ejemplo 3: Sistema sin solución'
  enunciado: ¿Cómo se formaliza el conjunto solución cuando las inecuaciones son disjuntas?
  alternativas:
  - $S = \emptyset$
  - $S = [0, 0]$
  - $S = ]-\infty, +\infty[$
  - $S = \{0\}$
  respuesta: $S = \emptyset$
  solucion_pasos:
  - 'Paso 1: Al no haber traslape, el conjunto solución es vacío.'
  - 'Paso 2: Se denota $S = \emptyset$.'
- titulo: 'Ejemplo 4: Corchete en el infinito'
  enunciado: ¿Cuál es la regla fundamental para el corchete en $+\infty$ o $-\infty$?
  alternativas:
  - El corchete en el infinito siempre es abierto ($[$ o $]$)
  - Puede ser cerrado si la inecuación tiene $\geq$
  - Es cerrado solo en $+\infty$
  - Depende del signo de los coeficientes
  respuesta: El corchete en el infinito siempre es abierto ($[$ o $]$)
  solucion_pasos:
  - 'Paso 1: El infinito no es un número real alcanzable.'
  - 'Paso 2: Siempre lleva corchete hacia afuera.'
errores_frecuentes:
- La solución de un sistema dada por $2 < x \le 6$ se escribe en notación de intervalo como $[2, 6[$.
- Expresar la intersección $x > 4$ y $x \le 9$ en notación de intervalo produce el conjunto abierto $]4, 9[$.
- Cuando un sistema carece de intersección ($S = \emptyset$), se expresa en notación de intervalo como $[0, 0]$.
- Traducir la solución simultánea de $x \le 3$ y $x < 7$ resulta en el intervalo $]3, 7[$.
- Los límites de un intervalo de sistema pueden ordenarse colocando la cota mayor en la posición izquierda.
afirmaciones_verdaderas:
- El conjunto solución de un sistema se expresa como un único intervalo o combinación de intervalos mediante corchetes según las cotas de la intersección.
- La desigualdad doble $a < x \le b$ se traduce de manera unívoca al intervalo semiabierto por la izquierda $]a, b]$.
al_terminar_debes_poder: '**QUÉ:** Formalizar la solución del sistema en notación de intervalo.


  **CÓMO:** Escribiendo la región de intersección resultante mediante corchetes reales ($]a, b]$, $[a, +\infty[$ o $\emptyset$).


  ![Resumen Expresión de la solución del sistema como intervalo](/static/img/nodos/expresion-de-la-solucion-del-sistema-como-intervalo-resumen.svg)'
