semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.TRADUCCION_INTERVALO
resumen_inicial: 'Expresión de la solución del sistema como intervalo: relaciones
  de orden, intervalos y resolución en Sistemas de inecuaciones lineales con una incógnita.'
explicacion_simple: Una vez que se resuelven las inecuaciones de un sistema, la solución
  es el conjunto de todos los valores que cumplen simultáneamente todas las condiciones.
  La notación de intervalos es una herramienta estandarizada que permite comunicar
  estas soluciones con precisión y sin ambigüedades.
explicacion_formal: '### Definición formal

  La notación de intervalos es un sistema sintáctico empleado para describir subconjuntos
  conexos de la recta real $\\mathbb{R}$. Un intervalo definido por desigualdades
  del tipo $a < x < b$ corresponde al intervalo abierto $(a, b)$, mientras que $a
  \\le x \\le b$ corresponde al intervalo cerrado $[a, b]$. Si las condiciones provienen
  de un sistema de inecuaciones, el conjunto solución $S$ es la intersección de los
  intervalos que resuelven cada inecuación, es decir, $S = I_1 \\cap I_2 \\cap \\dots
  \\cap I_n$.


  ### Desarrollo didáctico

  Tras resolver cada inecuación de un sistema, obtenemos desigualdades separadas,
  por ejemplo, $x > 2$ y $x \\le 5$. El desafío consiste en unificar ambas condiciones
  en un solo conjunto. Resulta muy útil representar las desigualdades en una recta
  numérica, trazando las regiones válidas para cada una de ellas y buscando dónde
  se superponen. Las zonas de superposición determinan la intersección. Posteriormente,
  se traduce esta región a la notación de intervalos. Los corchetes indican que el
  punto extremo está incluido, mientras que los paréntesis indican que el extremo
  está excluido. Si la región se extiende indefinidamente, se utiliza el símbolo de
  infinito, que siempre se acompaña de un paréntesis.'
definiciones_clave: '- **Expresión de la solución del sistema como intervalo**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a expresión de la solución del sistema
  como intervalo.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de expresión de la
    solución del sistema como intervalo.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de expresión de la solución del sistema como
    intervalo, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
