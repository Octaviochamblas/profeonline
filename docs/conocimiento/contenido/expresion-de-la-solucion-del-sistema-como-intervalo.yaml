semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.TRADUCCION_INTERVALO
resumen_inicial: Expresar la solución de un sistema como intervalo consiste en escribir
  en notación de corchetes el tramo de intersección obtenido.
explicacion_simple: 'Una vez hallada la zona común de un sistema (por ejemplo $2 \le
  x < 8$):

  Escribimos la solución final directamente como un intervalo formal entre corchetes:

  $S = [2, 8[$.

  Revisamos cuidadosamente la inclusión de los bordes para colocar el corchete hacia
  adentro $[$ o hacia afuera $]$.'
explicacion_formal: 'La **formalización en notación de intervalo** para el sistema
  con solución $S = S_1 \cap S_2$ establece:


  $$a < x \le b \iff S = ]a, b]$$

  $$a \le x \le b \iff S = [a, b]$$

  $$x > a \land x > b \iff S = ]\max(a, b), +\infty[$$'
definiciones_clave: '- **Formato de intervalo para sistemas**: Notación estándar de
  corchetes que representa la intersección $S_1 \cap S_2$.'
propiedades_relaciones: '- **Máximos y mínimos de cota**: La intersección de intervalos
  infinitos hacia la derecha adopta como cota el mayor de los valores iniciales ($\max(a,
  b)$).'
ejemplo_guiado:
  enunciado: Expresa en notación de intervalo la solución del sistema $\begin{cases}
    x \ge 3 \\ x > 7 \end{cases}$.
  pasos:
  - 'Paso 1: Analizar $S_1 = [3, +\infty[$ (números mayores o iguales a 3).Paso 2:
    Analizar $S_2 = ]7, +\infty[$ (números estrictamente mayores a 7).Paso 3: Buscar
    la zona común: los números que son mayores que 3 Y A LA VEZ mayores que 7 son
    los números mayores que 7.Paso 4: Calcular la intersección: $S = [3, +\infty[
    \ \cap \ ]7, +\infty[ \ = ]7, +\infty[$.Paso 5: Escribir la respuesta en notación
    de intervalo: $S = ]7, +\infty[$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al calcular la intersección entre $x \ge 3$ y $x > 7$, ¿cuál es el intervalo
    solución $S$ del sistema?
  choices:
  - text: $S = ]7, +\infty[$
    is_correct: true
  - text: $S = [3, +\infty[$
    is_correct: false
  - text: $S = [3, 7]$
    is_correct: false
  - text: $S = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]7, +\infty[$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para dos restricciones de mayor que ($x \ge a$ y $x > b$ con $a < b$),
    ¿qué cota prevalece en la intersección?
  choices:
  - text: La cota superior más restrictiva (el número mayor $b$).
    is_correct: true
  - text: La cota menor $a$.
    is_correct: false
  - text: El promedio entre $a$ y $b$.
    is_correct: false
  - text: El conjunto vacío.
    is_correct: false
  explanation: La alternativa correcta es 'La cota superior más restrictiva (el número
    mayor $b$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver ambas inecuaciones obteniendo las desigualdades despejadas.'
- 'Paso 2: Intersecar las condiciones en la recta real.'
- 'Paso 3: Escribir la notación de intervalo respetando los corchetes abiertos $]$
  ó cerrados $[$.'
- 'Paso 4: Verificar los infinitos con corchete abierto.'
errores_correccion: '- **Error común:** Escribir $[3, +\infty[$ creyendo que se debe
  tomar la cota más pequeña en un sistema del tipo ''mayor que''.

  - **Cómo corregirlo:** Para que se cumplan AMBAS condiciones de ser mayor que 3
  y mayor que 7, el número debe ser estrictamente MAYOR QUE 7 ($]7, +\infty[$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de un sistema de inecuaciones requiere calcular la intersección
    de soluciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se exige la simultaneidad de todas las desigualdades.
- titulo: ¿Si dos intervalos no se cruzan en la recta numérica el sistema no tiene
    solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, la intersección es vacía ($S = \\emptyset$).
errores_frecuentes:
- Calcular la unión de intervalos en lugar de la intersección al resolver un sistema
  de inecuaciones.
- Intentar sumar o restar las inecuaciones del sistema como si fuera un sistema de
  ecuaciones lineales.
- Creer que basta con que un número cumpla una sola inecuación para ser solución del
  sistema.
- Olvidar invertir el símbolo al despejar coeficientes negativos dentro de alguna
  inecuación individual.
- Inventar un intervalo arbitrario cuando los sombreados de los intervalos van en
  direcciones opuestas sin cruzarse.
afirmaciones_verdaderas:
- La solución final de un sistema de inecuaciones lineales es la intersección de los
  conjuntos solución individuales de cada inecuación.
- Si las regiones de solución de las inecuaciones no tienen puntos comunes en la recta
  numérica, el sistema no tiene solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver sistemas de inecuaciones
  lineales con una incógnita, determinando su conjunto intersección en notación de
  intervalo y gráfica.
