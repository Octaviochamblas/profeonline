semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.SIMETRAL_DEFINICION
resumen_inicial: 'Definición de simetral como recta perpendicular a un lado en su
  punto medio: conceptos, teoremas, propiedades geométricas y cálculo en Elementos
  Secundarios del Triángulo.'
explicacion_simple: 'A diferencia de la altura (que parte de un vértice), la simetral
  no nace en ningún vértice: es una recta asociada a un lado, que lo corta perpendicularmente
  justo en su mitad.'
explicacion_formal: '![Simetral de un lado del triángulo](/static/img/geometria/elementos-secundarios/simetral-circuncentro-simetral-definicion.svg)


  ### Definición formal


  La simetral del lado BC de un triángulo es la recta perpendicular a BC que pasa
  por su punto medio M.


  ### Desarrollo didáctico


  Cada triángulo tiene tres simetrales, una por cada lado. A diferencia de las alturas,
  bisectrices y transversales de gravedad, la simetral no pasa necesariamente por
  ningún vértice del triángulo.'
