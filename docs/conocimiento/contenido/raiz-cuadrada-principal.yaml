procedimiento:
- 'Paso 1: Identificar si se está evaluando un radical aritmético $\sqrt{a}$ o resolviendo una ecuación $x^2 = a$.'
- 'Paso 2: Si es el radical $\sqrt{a}$, entregar únicamente el valor positivo o cero ($b \ge 0$).'
- 'Paso 3: Si es la ecuación $x^2 = a$, entregar las dos soluciones simétricas $x = \pm \sqrt{a}$.'
errores_correccion: '- **Error 1: Decir que $\sqrt{36} = \pm 6$.** **Cómo corregirlo:** La raíz cuadrada principal es siempre un número positivo o cero: $\sqrt{36} = +6$.

  - **Error 2: Olvidar una de las soluciones al resolver ecuaciones ($x^2 = 9 \implies x = 3$).** **Cómo corregirlo:** En la ecuación hay dos raíces: $x = +3$ y $x = -3$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\sqrt{49}$?
  alternativas:
  - $7$
  - $\pm 7$
  - $-7$
  respuesta: $7$
  solucion_pasos:
  - $\sqrt{49} = +7$ por definición de raíz principal.
- titulo: Ejemplo 2
  enunciado: ¿Cuáles son las soluciones de la ecuación $x^2 = 36$?
  alternativas:
  - $x = 6$ y $x = -6$
  - $x = 6$ solamente
  - $x = 18$ y $x = -18$
  respuesta: $x = 6$ y $x = -6$
  solucion_pasos:
  - $x = \pm\sqrt{36} = \pm 6$.
- titulo: ¿Es √0 igual a 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, $0^2 = 0 \implies \sqrt{0} = 0$.
  alternativas:
  - texto: Sí, √0 = 0
    es_correcta: true
    retroalimentacion: ¡Correcto! El cero es el único número cuya raíz cuadrada es él mismo.
  - texto: No, no está definida
    es_correcta: false
    retroalimentacion: Incorrecto, $\sqrt{0} = 0 \in \mathbb{R}$.
  - texto: No, es un número indeterminado
    es_correcta: false
    retroalimentacion: Incorrecto, es un valor perfectamente determinado.
- titulo: ¿Es √81 igual a ±9?
  respuesta: 'No'
  solucion_pasos:
  - No, la raíz cuadrada principal entrega exclusivamente el valor no negativo $+9$.
  alternativas:
  - texto: No, el símbolo √ denota la raíz principal (+9)
    es_correcta: true
    retroalimentacion: ¡Correcto! El doble signo solo aplica en ecuaciones cuadráticas.
  - texto: Sí, porque (-9)² = 81
    es_correcta: false
    retroalimentacion: Incorrecto, aunque $(-9)^2 = 81$, la función raíz cuadrada solo devuelve el valor positivo.
  - texto: Sí, toda raíz cuadrada tiene dos valores
    es_correcta: false
    retroalimentacion: Incorrecto, la función radical es unívoca.
errores_frecuentes:
- Atribuir doble signo $\pm$ al operador radical aritmético $\sqrt{a}$.
- Olvidar el signo negativo al despejar $x^2 = a$ en ecuaciones.
- Creer que $\sqrt{0}$ no está definido.
- Confundir $-\sqrt{a}$ con $\sqrt{-a}$.
- Afirmar que una longitud geométrica puede ser negativa.
afirmaciones_verdaderas:
- La raíz cuadrada principal de un número no negativo es siempre mayor o igual a cero.
- El operador radical $\sqrt{x}$ es una función matemática con una única salida real.
- La ecuación cuadrática $x^2 = a$ ($a > 0$) admite dos soluciones reales simétricas $\pm \sqrt{a}$.
al_terminar_debes_poder: '![Síntesis de raíz cuadrada principal](/static/img/nodos/raiz-cuadrada-principal-resumen.svg)


  QUÉ: Comprender y aplicar rigurosamente el concepto de raíz cuadrada principal.


  CÓMO: Evaluando el operador radical $\sqrt{a} \ge 0$ como un valor único no negativo y distinguiéndolo claramente de las soluciones dobles $\pm\sqrt{a}$ en ecuaciones cuadráticas.'
