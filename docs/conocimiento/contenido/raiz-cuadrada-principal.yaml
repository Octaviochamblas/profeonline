semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_CUADRADA_PRINCIPAL
resumen_inicial: La raíz cuadrada principal de un número real no negativo $a \ge 0$ es por definición el único número real no negativo $b \ge 0$ tal que $b^2 = a$, de modo que $\sqrt{a} \ge 0$ siempre.
explicacion_simple: '![Raíz cuadrada principal](/static/img/nodos/raiz-cuadrada-principal-intro.svg)


  Existe una confusión muy común en matemáticas:

  - Cuando calculas la operación $\sqrt{9}$, el resultado es **única y exclusivamente $+3$** (nunca $\pm 3$). Por definición, el símbolo radical entrega siempre un valor positivo o cero.

  - El doble signo $\pm$ solo aparece cuando resuelves una **ecuación** como $x^2 = 9$, cuyas dos soluciones son $x = +\sqrt{9} = +3$ y $x = -\sqrt{9} = -3$.'
explicacion_formal: "Sea $a \\in \\mathbb{R}$ con $a \\ge 0$. La **Raíz Cuadrada Principal** de $a$, denotada por $\\sqrt{a}$, se define como la función unívoca:\n\n$$\\sqrt{a} = b \\iff b^2 = a \\quad \\text{con } b \\ge 0$$\n\n**Diferenciación conceptual fundamental:**\n1. **Operador Radical (Función $\\sqrt{\\cdot}: [0, \\infty) \\to [0, \\infty)$):**\n   - Es una función bien definida con un único valor de salida no negativo:\n     $$\\sqrt{25} = +5 \\quad (\\text{Afirmar } \\sqrt{25} = \\pm 5 \\text{ es matemáticamente erróneo})$$\n2. **Ecuación Cuadrática ($x^2 = a$):**\n   - Posee dos soluciones reales simétricas en el cuerpo $\\mathbb{R}$:\n     $$x^2 = a \\iff x = \\pm \\sqrt{a} \\iff x \\in \\{+\\sqrt{a}, -\\sqrt{a}\\}$$\n   - El símbolo $\\pm$ no emana del operador radical, sino del conjunto de soluciones de la ecuación cuadrática."
definiciones_clave: '- **Raíz cuadrada principal**: Valor no negativo de la raíz de índice 2.

  - **Unicidad funcional**: Propiedad de la función raíz cuadrada de asignar un solo valor en su codominio $[0, \infty)$.

  - **Soluciones de $x^2=a$**: Conjunto bipuntual $\{+\sqrt{a}, -\sqrt{a}\}$.'
propiedades_relaciones: '- **No negatividad intrínseca**: $\sqrt{a} \ge 0$ para todo $a \ge 0$.

  - **Opuesto de la raíz**: Para obtener el valor negativo se debe anteponer explícitamente el signo menos: $-\sqrt{a} \le 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de raíz cuadrada principal](/static/img/nodos/raiz-cuadrada-principal-ejemplos.svg)


    Evalúe $\sqrt{64}$, $-\sqrt{100}$ y resuelva la ecuación cuadrática $x^2 = 25$ distinguiendo operador de ecuación.'
  pasos:
  - 'Paso 1: Evaluar $\sqrt{64}$: Por definición de raíz principal, es el valor no negativo $b \ge 0$ tal que $b^2 = 64 \implies +8$.'
  - 'Paso 2: Evaluar $-\sqrt{100}$: Se calcula $\sqrt{100} = +10$ y se aplica el signo menos exterior $\implies -10$.'
  - 'Paso 3: Resolver $x^2 = 25$: Aplicar raíz cuadrada a ambos lados considerando soluciones positiva y negativa $\implies x = \pm\sqrt{25} = \pm 5$.'
  - 'Conclusión: $\sqrt{64} = 8$, $-\sqrt{100} = -10$ y el conjunto solución de $x^2=25$ es $\{+5, -5\}$.'
