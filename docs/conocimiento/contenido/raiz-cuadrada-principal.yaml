semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_CUADRADA_PRINCIPAL
resumen_inicial: La raíz cuadrada principal de un número real no negativo $a \ge 0$ es la
  única solución REAL NO NEGATIVA (positiva o cero) denotada por $\sqrt{a}$.
explicacion_simple: 'Aunque tanto $3$ como $-3$ al elevarse al cuadrado dan $9$ ($3^2 = 9$
  y $(-3)^2 = 9$), por convención matemática el símbolo $\sqrt{9}$ representa **únicamente
  el valor positivo**: $\sqrt{9} = +3$.

  Si quieres referirte al valor negativo, debes anteponer un signo menos: $-\sqrt{9} = -3$.'
explicacion_formal: Para todo $a \in \mathbb{R}, a \ge 0$, la raíz cuadrada principal $\sqrt{a}$
  se define como el único número real $y \ge 0$ tal que $y^2 = a$. Por ende, $\sqrt{x^2} =
  |x|$ para todo $x \in \mathbb{R}$.
definiciones_clave: '- **Raíz principal**: Valor no negativo devuelto por la función radical
  $\sqrt{x}$.'
propiedades_relaciones: '- **Valor absoluto**: $\sqrt{x^2} = |x|$.'
ejemplo_guiado:
  enunciado: Evalúa A) $\sqrt{16}$ y B) $-\sqrt{16}$.
  pasos:
  - 'Para A: $\sqrt{16}$ pide la raíz principal positiva, luego $\sqrt{16} = 4$.'
  - 'Para B: $-\sqrt{16}$ mantiene el signo negativo exterior, luego $-\sqrt{16} = -4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\sqrt{25}$ según la definición de raíz principal?
  choices:
  - text: '5'
    is_correct: true
  - text: '-5'
    is_correct: false
  - text: ±5
    is_correct: false
  - text: '25'
    is_correct: false
  explanation: 'La correcta es: 5. El símbolo $\sqrt{}$ entrega exclusivamente la raíz no
    negativa (positiva).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el valor de $\sqrt{(-6)^2}$.
  choices:
  - text: '6'
    is_correct: true
  - text: '-6'
    is_correct: false
  - text: ±6
    is_correct: false
  - text: '36'
    is_correct: false
  explanation: 'La correcta es: 6. Por propiedad $\sqrt{x^2} = |x|$, se tiene $\sqrt{(-6)^2}
    = |-6| = 6$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el número no negativo bajo la raíz cuadrada.'
- 'Paso 2: Hallar el número positivo o cero que al elevarse al cuadrado da dicho valor.'
- 'Paso 3: Retornar exclusivamente la solución no negativa.'
errores_correccion: No respondas $\sqrt{9} = \pm 3$. Las dos soluciones $\pm 3$ aparecen al
  resolver la ecuación $x^2 = 9$, pero la función $\sqrt{9}$ da solo $+3$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\sqrt{49}$.
  alternativas:
  - '7'
  - '-7'
  - ±7
  respuesta: '7'
  solucion_pasos:
  - $\sqrt{49} = 7$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de la raíz cuadrada de 36?
  alternativas:
  - '6'
  - '-6'
  - ±6
  respuesta: '6'
  solucion_pasos:
  - La raíz cuadrada principal siempre es no negativa.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de la raíz cuadrada de (-5) al cuadrado?
  alternativas:
  - '5'
  - '-5'
  - '25'
  respuesta: '5'
  solucion_pasos:
  - Raíz cuadrada de x² = |x|, entonces |-5| = 5.
- titulo: ¿Es lo mismo -√16 que √(-16)?
  respuesta: 'No'
  solucion_pasos:
  - -√16 = -4 sí existe, mientras que √(-16) no está definida en los reales.
errores_frecuentes:
- Confundir evaluar $\sqrt{a}$ con resolver la ecuación cuadrática $x^2 = a$.
- Responder con ambos signos (positivo y negativo) al calcular la raíz cuadrada principal
  de un número.
- Aplicar la raíz cuadrada principal a un radicando negativo sin notar que no existe en R.
- Confundir √(x²) con x, olvidando el valor absoluto cuando x es negativo.
- Pensar que -√9 y √(-9) representan lo mismo.
afirmaciones_verdaderas:
- $\sqrt{a} \ge 0$ para todo $a \ge 0$.
- La raíz cuadrada principal de un número negativo no existe en los números reales.
al_terminar_debes_poder: Evaluar raíces cuadradas principales obteniendo siempre resultados
  no negativos.
fuente: Texto escolar MINEDUC.
estado: publicado
