semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_CUADRADA_PRINCIPAL
resumen_inicial: La raíz cuadrada principal de un número no negativo $a \ge 0$ es
  el valor real único no negativo $\sqrt{a} \ge 0$ cuyo cuadrado da $a$.
explicacion_simple: Aunque la ecuación $x^2 = 9$ tiene dos respuestas ($+3$ y $-3$),
  el símbolo de la raíz cuadrada $\sqrt{9}$ se refiere única y exclusivamente a la
  respuesta positiva $+3$. Esta solución única positiva se conoce como la raíz cuadrada
  principal.
explicacion_formal: 'Para todo real no negativo $a \ge 0$, la **Raíz Cuadrada Principal**
  $\sqrt{a}$ se define como la función no negativa:


  $$\sqrt{a} = b \iff (b^2 = a \quad \wedge \quad b \ge 0)$$


  **Diferencia entre ecuación y función radical:**

  - Ecuación cuadrática: $x^2 = 9 \implies x = \pm \sqrt{9} = \pm 3$.

  - Función raíz principal: $\sqrt{9} = 3$ (jamás es $-3$).'
definiciones_clave: '- **Raíz cuadrada principal**: Resultado unívoco no negativo
  $\sqrt{a} \ge 0$ asignado al símbolo radical.'
propiedades_relaciones: '- **Unicidad positiva**: $\sqrt{a} \ge 0$ para todo $a \ge
  0$.'
ejemplo_guiado:
  enunciado: Evalúe el valor de la raíz cuadrada principal $\sqrt{25}$ y compárelo
    con las soluciones de la ecuación $x^2 = 25$.
  pasos:
  - 'Paso 1: Por definición de función raíz principal, $\sqrt{25}$ da el valor único
    no negativo $+5$.'
  - 'Paso 2: Por definición de ecuación cuadrática $x^2 = 25$, existen dos valores
    $x = +5$ y $x = -5$.'
  - 'Conclusión: $\sqrt{25} = 5$, pero la ecuación $x^2 = 25$ tiene como soluciones
    $\{5, -5\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el signo del resultado de la raíz cuadrada principal sqrt(a)
    para a > 0?
  choices:
  - text: Es siempre un valor real no negativo (positivo)
    is_correct: true
  - text: Es siempre negativo
    is_correct: false
  - text: Entrega dos resultados simultáneos + y -
    is_correct: false
  - text: Es un número imaginario
    is_correct: false
  explanation: La alternativa correcta es 'Es siempre un valor real no negativo (positivo)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt(25), ¿cuál es el valor exacto de la raíz
    cuadrada principal?
  choices:
  - text: '+5'
    is_correct: true
  - text: '-5'
    is_correct: false
  - text: +5 y -5 simultáneamente
    is_correct: false
  - text: '25'
    is_correct: false
  explanation: La alternativa correcta es '+5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el símbolo radical representa la función raíz cuadrada
  principal.'
- 'Paso 2: Encontrar el número no negativo $b \ge 0$ cuyo cuadrado $b^2$ sea igual
  al radicando.'
- 'Paso 3: Escribir $b$ como el resultado único no negativo de la expresión.'
errores_correccion: '- **Error 1: Escribir que $\sqrt{49} = -7$.** **Cómo corregirlo:**
  El símbolo $\sqrt{49}$ representa por definición el valor principal positivo $+7$.


  - **Error 2: Confundir $\sqrt{a}$ con la solución completa de la ecuación $x^2 =
  a$.** **Cómo corregirlo:** La ecuación requiere $\pm \sqrt{a}$, mientras el símbolo
  $\sqrt{a}$ en sí da solo $+b$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $\sqrt{81}$.
  alternativas:
  - '9'
  - '-9'
  - +9 y -9
  respuesta: '9'
  solucion_pasos:
  - La raíz cuadrada principal de $81$ es $9$.
- titulo: Ejemplo 2
  enunciado: Calcule $\sqrt{0}$.
  alternativas:
  - '0'
  - '1'
  - Indefinido
  respuesta: '0'
  solucion_pasos:
  - $\sqrt{0} = 0$.
- titulo: ¿Es sqrt(144) igual a 12?
  respuesta: Sí
  solucion_pasos:
  - Sí, $12^2 = 144$ y $12 \ge 0$.
- titulo: ¿Es la raíz cuadrada principal de un número positivo un número positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de la función raíz cuadrada principal.
errores_frecuentes:
- El símbolo de la raíz cuadrada $\sqrt{a}$ entrega simultáneamente un valor positivo
  y uno negativo.
- La raíz cuadrada principal de 36 es numéricamente igual a $-6$.
- Calcular la raíz cuadrada principal exige sumar el número 2 a la solución.
- Las ecuaciones cuadráticas $x^2 = a$ tienen una única solución positiva idéntica
  al símbolo radical.
- La raíz cuadrada de cero es un número positivo no real.
afirmaciones_verdaderas:
- La raíz cuadrada principal $\sqrt{a}$ asigna un único valor no negativo a cada real
  $a \ge 0$.
- El signo negativo en $-\sqrt{a}$ antecede al operador radical y no proviene del
  valor principal.
al_terminar_debes_poder: Al terminar serás capaz de evaluar raíces cuadradas principales
  $\sqrt{a} \ge 0$, distinguiendo su valor unívoco positivo de las soluciones dobles
  de una ecuación cuadrática.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
