semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_DECIMAL
resumen_inicial: 'Representación decimal de un porcentaje: concepto y propiedades
  fundamentales en Porcentajes.'
explicacion_simple: Las calculadoras no tienen un botón mágico para los porcentajes
  internos, operan con decimales. Si le pides el 20%, ella silenciosamente multiplicará
  por 0.20.
explicacion_formal: 'Como un porcentaje es una fracción de denominador 100 ($x/100$),
  su **representación decimal** se obtiene simplemente ejecutando esa división.


  - $80\% = 80 \div 100 = 0.80$

  - $5\% = 5 \div 100 = 0.05$ (¡Atención al cero!)

  - $150\% = 150 \div 100 = 1.50$


  Para el proceso inverso (de decimal a porcentaje), haces lo contrario: multiplicar
  el decimal por 100 y agregar el símbolo $\%$.

  - $0.12 = 0.12 \cdot 100 = 12\%$.'
definiciones_clave: '- **Representación decimal de un porcentaje**: Elemento central
  dentro del estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a representación decimal de un porcentaje.'
