semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_DECIMAL
resumen_inicial: La representación decimal de un porcentaje $p\%$ se obtiene dividiendo
  $p$ entre 100, lo que equivale a desplazar la coma decimal dos lugares hacia la
  izquierda ($p\% = p \div 100$).
explicacion_simple: '![Representación decimal de un porcentaje](/static/img/nodos/representacion-decimal-de-un-porcentaje-intro.svg)


  Todo porcentaje se puede escribir directamente como un número decimal dividiendo
  por $100$. Esto es tan sencillo como **correr la coma dos lugares hacia la izquierda**.
  Por ejemplo, $45\% = 0,45$ y $8\% = 0,08$. Si quieres hacer el camino inverso (de
  decimal a porcentaje), solo debes correr la coma dos lugares a la derecha: $0,32
  = 32\%$.

  '
explicacion_formal: "### Definición y operador de conversión\nLa conversión de porcentaje\
  \ a número decimal es una función biyectiva $f: \\mathbb{R}^+ \\to \\mathbb{R}^+$\
  \ definida por:\n$$p\\% = \\frac{p}{100} = p \\cdot 10^{-2}$$\n\n### Regla de desplazamiento\
  \ de la coma\n- **De Porcentaje a Decimal**: Se divide entre $100$ desplazando el\
  \ separador decimal $2$ posiciones a la izquierda:\n  $$p\\% \\xrightarrow{\\div\
  \ 100} p_{\\text{dec}}$$\n- **De Decimal a Porcentaje**: Se multiplica por $100\\\
  %$ desplazando el separador decimal $2$ posiciones a la derecha:\n  $$d \\xrightarrow{\\\
  times 100\\%} (d \\cdot 100)\\%$$\n\n### Clasificación por órdenes de magnitud\n\
  - Porcentajes menores al $10\\%$: $d < 0,10$ con cero inmediatamente tras la coma\
  \ (ej: $4\\% = 0,04$).\n- Porcentajes entre $10\\%$ y $99\\%$: $0,10 \\le d < 1,00$\
  \ (ej: $68\\% = 0,68$).\n- Porcentajes mayores al $100\\%$: $d \\ge 1,00$ con parte\
  \ entera no nula (ej: $135\\% = 1,35$).\n"
definiciones_clave: '- **Forma decimal de un porcentaje**: Expresión numérica $p \div
  100$ utilizada para multiplicaciones directas.

  - **Factor multiplicador**: Coeficiente decimal que al multiplicarse por la base
  produce directamente la parte buscada.

  - **Desplazamiento posicional**: Movimiento de 2 órdenes de magnitud hacia la izquierda
  en el sistema decimal.

  '
propiedades_relaciones: '- **Equivalencia de la unidad**: El número decimal $1,0$
  equivale exactamente al $100\%$.

  - **Preservación del valor**: $p\% = \frac{p}{100} = p_{\text{dec}}$ representan
  exactamente el mismo número real.

  '
ejemplo_guiado:
  enunciado: Convierte $7,5\%$ a su forma decimal y luego transforma el número decimal
    $0,06$ a porcentaje.
  pasos:
  - 'Paso 1: Para $7,5\%$, dividimos entre 100 corriendo la coma 2 lugares a la izquierda:
    $7,5 \div 100 = 0,075$.'
  - 'Paso 2: Comprobamos: agregamos un cero a la izquierda del 7 para completar los
    dos saltos decimales.'
  - 'Paso 3: Para el decimal $0,06$, multiplicamos por 100% corriendo la coma 2 lugares
    a la derecha: $0,06 \cdot 100\% = 6\%$.'
  - 'Paso 4: Conclusiones: $7,5\% = 0,075$ y $0,06 = 6\%$.'
  imagen: /static/img/nodos/representacion-decimal-de-un-porcentaje-ejemplos.svg
