semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_DECIMAL
resumen_inicial: 'La representación decimal de un porcentaje $p\%$ es el número real $d$ obtenido al dividir el porcentaje entre 100 ($d = \frac{p}{100}$), lo que equivale a desplazar la coma decimal dos lugares a la izquierda.'
explicacion_simple: |
  Para convertir cualquier porcentaje a número decimal, simplemente **divides el número entre 100**. Una forma rápida de hacerlo sin calculadora es desplazar la coma decimal dos posiciones hacia la izquierda:
  - $25\% \to 25 \div 100 = 0,25$
  - $7\% \to 7 \div 100 = 0,07$
  - $150\% \to 150 \div 100 = 1,5$
  Expresar los porcentajes como decimales es muy útil porque permite calcularlos directamente en una multiplicación.
explicacion_formal: |
  ### Definición formal
  La **expresión decimal equivalente $d$** de un porcentaje $p\%$ es el cociente obtenido al evaluar la razón básica:
  $$d = \frac{p}{100} = p \cdot 10^{-2} \quad (d \in \mathbb{R}^+)$$

  ### Regla de desplazamiento del punto decimal
  Al efectuar la división por $100 = 10^2$, el valor posicional de cada dígito se reduce en dos órdenes de magnitud, trasladando la coma decimal dos posiciones hacia la izquierda:
  $$p = a_k a_{k-1} \dots a_0 , a_{-1} \dots \implies d = a_k \dots a_2 , a_1 a_0 a_{-1} \dots$$

  ### Clasificación según el valor del porcentaje
  - **Porcentajes menores al $100\%$ ($p < 100$)**: Dan lugar a decimales estrictamente menores que la unidad ($d < 1$).
  - **Porcentaje igual al $100\%$ ($p = 100$)**: Corresponde al entero $d = 1$.
  - **Porcentajes mayores al $100\%$ ($p > 100$)**: Dan lugar a números decimales mayores que la unidad ($d > 1$).

  ### Síntesis didáctica
  - Conversión: $d = p \div 100$.
  - Regla práctica: Mover la coma decimal dos lugares a la izquierda.
definiciones_clave: |
  - **Decimal equivalente ($d$)**: Valor numérico real resultado de dividir el tanto por ciento entre 100.
  - **Factor multiplicativo decimal**: Operador multiplicativo $d$ que calcula de forma directa el tanto por ciento sobre una cantidad.
  - **Desplazamiento posicional**: Regla operativa de división entre potencias de diez.
propiedades_relaciones: |
  - **Operación directa de cálculo**: Para hallar el $p\%$ de una cantidad $C$, basta con multiplicar la cantidad por su decimal equivalente: $p\% \text{ de } C = d \cdot C$.
  - **Inversión de conversión**: Para transformar un número decimal $d$ a porcentaje $p\%$, se multiplica por 100 ($p = d \cdot 100$).
ejemplo_guiado:
  enunciado: 'Convierte los porcentajes $85\%$, $6\%$ y $145\%$ a sus representaciones decimales equivalentes.'
  pasos:
    - 'Paso 1: Para $85\%$, dividimos por 100 o corremos la coma dos lugares a la izquierda: $85 \div 100 = 0,85$.'
    - 'Paso 2: Para $6\%$, agregamos un cero a la izquierda al correr la coma: $6 \div 100 = 0,06$.'
    - 'Paso 3: Para $145\%$, al ser mayor que 100, el decimal supera la unidad: $145 \div 100 = 1,45$.'
    - 'Paso 4: Respuestas: **$0,85$**, **$0,06$** y **$1,45$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la representación decimal del porcentaje $8\%$'
    choices:
      - {text: '$0,08$, desplazando la coma dos lugares a la izquierda ($8 \div 100 = 0,08$)', is_correct: true}
      - {text: '$0,8$, desplazando solo un lugar', is_correct: false}
      - {text: '$8,0$, sin alterar el número', is_correct: false}
      - {text: '$800$, multiplicando por 100', is_correct: false}
    explanation: 'La alternativa correcta es ''$0,08$, desplazando la coma dos lugares a la izquierda ($8 \div 100 = 0,08$)''. $8\% = 8 / 100 = 0,08$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el factor decimal asignado a un producto es $1,25$, ¿a qué porcentaje equivale dicha expresión?'
    choices:
      - {text: 'Al $125\%$, multiplicando el decimal por 100 ($1,25 \cdot 100 = 125\%$)', is_correct: true}
      - {text: 'Al $12.5\%$, multiplicando por 10', is_correct: false}
      - {text: 'Al $1.25\%$, manteniendo la cifra', is_correct: false}
      - {text: 'Al $0.125\%$, dividiendo por 10', is_correct: false}
    explanation: 'La alternativa correcta es ''Al $125\%$, multiplicando el decimal por 100 ($1,25 \cdot 100 = 125\%$)''. $1,25 \cdot 100 = 125\%$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar el número $p$ del porcentaje.'
  - 'Paso 2: Dividir $p$ entre 100 o mover la coma decimal dos lugares hacia la izquierda (agregando ceros si es necesario).'
  - 'Paso 3: Eliminar el símbolo de porcentaje $\%$.'
  - 'Paso 4: Usar el número decimal $d$ para operaciones multiplicativas directas.'
errores_correccion: |
  - **Error 1:** Desplazar la coma un solo lugar a la izquierda al convertir un porcentaje de un solo dígito (ej: escribir que $5\% = 0,5$). **Cómo corregirlo:** La división es por 100, por lo que **DEBES desplazar la coma DOS lugares completando con ceros**: $5\% = 0,05$.
  - **Error 2:** Mantener el símbolo $\%$ al lado del número decimal (ej: escribir $0,25\%$). **Cómo corregirlo:** Al pasar a decimal, **el símbolo $\%$ SE ELIMINA**, pues la división por 100 ya fue ejecutada.
ejemplos:
  - titulo: 'Conversión de 50%'
    enunciado: '¿La representación decimal del $50\%$ es $0,5$?'
    alternativas:
      - 'Sí, pues $50 / 100 = 0.5$'
      - 'No, es 0.05'
      - 'No, es 5.0'
    respuesta: 'Sí, pues $50 / 100 = 0.5$'
    solucion_pasos:
      - '1. Dividimos $50 \div 100 = 0,5$.'
  - titulo: 'Conversión de porcentaje de 1 dígito'
    enunciado: '¿La representación decimal del $3\%$ es $0,03$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $3 \div 100 = 0,03$.'
  - titulo: 'Conversión inversa de decimal a porcentaje'
    enunciado: '¿El número decimal $0,42$ equivale al $42\%$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $0,42 \cdot 100 = 42\%$.'
  - titulo: 'Cálculo directo usando decimal'
    enunciado: 'Para calcular el $20\%$ de $300$, ¿se multiplica directamente $0,2 \cdot 300 = 60$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $20\% = 0,2 \implies 0,2 \cdot 300 = 60$.'
errores_frecuentes:
  - 'Mover la coma decimal un solo lugar hacia la izquierda al convertir porcentajes menores a 10.'
  - 'Conservar el símbolo de porcentaje al lado del número decimal ya transformado.'
  - 'Multiplicar por 100 en lugar de dividir al transformar un porcentaje a formato decimal.'
  - 'Considerar que los decimales mayores que 1 no representan porcentajes válidos.'
  - 'Los números decimales menores a la unidad se escriben omitiendo el cero inicial antes de la coma.'
afirmaciones_verdaderas:
  - 'La representación decimal de un porcentaje $p\%$ se obtiene dividiendo el tanto por ciento entre 100 ($d = \frac{p}{100}$).'
  - 'Para transformar un número decimal a porcentaje, se multiplica el valor decimal por 100 ($p = d \cdot 100$).'
al_terminar_debes_poder: 'Convertir porcentajes a su representación decimal equivalente $d = \frac{p}{100}$ desplazando la coma dos posiciones.'
