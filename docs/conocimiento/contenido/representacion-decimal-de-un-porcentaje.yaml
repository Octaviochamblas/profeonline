semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_DECIMAL
resumen_inicial: 'Representación decimal de un porcentaje: concepto y propiedades fundamentales
  en Porcentajes.'
explicacion_simple: Las calculadoras no tienen un botón mágico para los porcentajes internos,
  operan con decimales. Si le pides el 20%, ella silenciosamente multiplicará por 0.20.
explicacion_formal: 'Como un porcentaje es una fracción de denominador 100 ($x/100$), su **representación
  decimal** se obtiene simplemente ejecutando esa división.


  - $80\% = 80 \div 100 = 0.80$

  - $5\% = 5 \div 100 = 0.05$ (¡Atención al cero!)

  - $150\% = 150 \div 100 = 1.50$


  Para el proceso inverso (de decimal a porcentaje), haces lo contrario: multiplicar el decimal
  por 100 y agregar el símbolo $\%$.

  - $0.12 = 0.12 \cdot 100 = 12\%$.'
definiciones_clave: '- **Representación decimal de un porcentaje**: Elemento central dentro
  del estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a representación decimal de un porcentaje.'
ejemplo_guiado:
  enunciado: Convierte 7% a número decimal y explica por qué se debe tener cuidado con el
    cero.
  pasos:
  - 'Tomo el número del porcentaje sin el símbolo: 7.'
  - 'Divido entre 100, lo que equivale a mover la coma dos lugares a la izquierda: 7 dividido
    entre 100 es igual a 0,07.'
  - 'Explico el cuidado con el cero: como 7 tiene un solo dígito, se agrega un cero antes
    para completar las dos posiciones decimales, dando 0,07 y no 0,7, que sería 70%.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con representación decimal de un porcentaje?
  choices:
  - text: Identificar correctamente la relación de porcentajes
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de porcentajes. Fundamento
    conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de representación decimal de un porcentaje, ¿qué
    paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
    clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Toma el número del porcentaje y retira el símbolo %.'
- 'Paso 2: Mueve el punto decimal dos posiciones hacia la izquierda.'
- 'Paso 3: Si faltan dígitos, rellena con ceros. (Ej: $2\% \rightarrow 0.02$).'
errores_correccion: Evita confundir los datos de entrada al operar con representación decimal
  de un porcentaje.
ejemplos:
- titulo: Conversión decimal
  enunciado: Convierte 3.5% a número decimal.
  solucion_pasos:
  - 'Retiramos el símbolo: 3.5'
  - 'Corremos la coma dos espacios a la izquierda: $0.035$.'
  - El número decimal para operar en calculadora es $0.035$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la representación decimal de 45%?
  alternativas:
  - 0,45
  - 4,5
  - 0,045
  respuesta: 0,45
  solucion_pasos:
  - 45 dividido entre 100 es igual a 0,45.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es la representación decimal de 120%?
  alternativas:
  - 1,2
  - 0,12
  - '12'
  respuesta: 1,2
  solucion_pasos:
  - 120 dividido entre 100 es igual a 1,2.
- titulo: ¿El decimal de 5% es 0,5?
  respuesta: 'No'
  solucion_pasos:
  - El decimal correcto de 5% es 0,05; 0,5 corresponde a 50%.
errores_frecuentes:
- Convertir el $5\%$ en $0.5$ (eso es el $50\%$). Lo correcto es $0.05$.
- Creer que $100\%$ es $100.0$ en decimal (es $1.0$).
- No saber qué hacer con porcentajes menores a 1, como $0.2\%$ (su decimal es $0.002$).
- Escribir 100% como 100,0 en vez de 1,0 en su forma decimal.
- No saber representar porcentajes menores a 1%, como 0,3%, cuyo decimal es 0,003.
afirmaciones_verdaderas:
- La propiedad de representación decimal de un porcentaje preserva la consistencia lógica.
- Para convertir un porcentaje a decimal, siempre se divide entre 100, sin importar si el
  número es entero, decimal o mayor a 100.
al_terminar_debes_poder: Resolver problemas aplicados que involucren representación decimal
  de un porcentaje.
fuente: Currículum Nacional MINEDUC.
