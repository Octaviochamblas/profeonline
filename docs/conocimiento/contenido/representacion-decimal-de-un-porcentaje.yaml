procedimiento:
- 'Paso 1: Para pasar de porcentaje a decimal, eliminar el símbolo $\%$ y dividir
  el número por $100$.'
- 'Paso 2: Desplazar la coma decimal dos posiciones hacia la izquierda, rellenando
  con ceros si faltan cifras.'
- 'Paso 3: Para pasar de decimal a porcentaje, multiplicar el número por $100$ (desplazar
  la coma dos posiciones a la derecha) y agregar el símbolo $\%$.'
errores_correccion: '- **Error 1:** Confundir porcentajes de un solo dígito con décimas
  (ej: escribir $5\% = 0,5$). **Cómo corregirlo:** $0,5$ es $50\%$. Para $5\%$ se
  debe escribir un cero tras la coma: **$5\% = 0,05$**.

  - **Error 2:** Olvidar que porcentajes con decimales corren dos posiciones desde
  la coma original (ej: $0,4\% = 0,004$).

  '
ejemplos:
- titulo: Conversión de porcentaje de 1 dígito
  enunciado: ¿A qué número decimal equivale el $4\%$?
  alternativas:
  - $0,04$
  - $0,4$
  - $4,0$
  - $0,004$
  respuesta: $0,04$
  solucion_pasos:
  - '1. Dividimos entre 100: $4 \div 100 = 0,04$.'
  - 2. Verificamos que $0,4 = 40\%$, por ende $4\% = 0,04$.
- titulo: Conversión con decimal original
  enunciado: ¿El $12,5\%$ equivale al decimal $0,125$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $12,5 \div 100 = 0,125$.
- titulo: Decimal mayor a 1
  enunciado: ¿El número decimal $2,4$ equivale al $240\%$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $2,4 \cdot 100\% = 240\%$.
- titulo: Porcentaje menor a 1%
  enunciado: ¿El $0,5\%$ equivale al decimal $0,005$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $0,5 \div 100 = 0,005$.
errores_frecuentes:
- 'Escribir porcentajes de una cifra como décimas en vez de centésimas (ej: 7% como
  0,7 en lugar de 0,07).'
- Correr la coma en la dirección opuesta al convertir de decimal a porcentaje.
- 'Olvidar colocar la coma decimal en porcentajes mayores a 100% (ej: 150% como 15
  en vez de 1,5).'
afirmaciones_verdaderas:
- Para convertir un porcentaje a decimal se divide entre 100, desplazando la coma
  2 lugares a la izquierda.
- El número decimal 0,08 equivale exactamente al 8%.
al_terminar_debes_poder: '![Resumen de representación decimal de un porcentaje](/static/img/nodos/representacion-decimal-de-un-porcentaje-resumen.svg)


  QUÉ: Convertir bidireccionalmente entre porcentajes y números decimales con fluidez
  y precisión posicional.

  CÓMO: Dividiendo entre 100 (desplazando la coma dos lugares a la izquierda) para
  obtener el decimal ($p\% = p \div 100$), o multiplicando por 100% para obtener el
  porcentaje ($d \cdot 100\%$).

  '
