resumen_inicial: 'La representación decimal de un porcentaje $P\%$ se obtiene dividiendo
  el valor $P$ entre $100$, desplazando la coma decimal dos lugares hacia la izquierda:
  $P\% = \frac{P}{100} = d$.'
explicacion_simple: Para convertir un porcentaje a número decimal, simplemente corremos
  la coma dos espacios hacia la izquierda o dividimos por 100. Por ejemplo, el 45%
  se convierte en el número decimal 0,45.
explicacion_formal: 'Para todo porcentaje $P\%$, su **Expresión Decimal $d$** viene
  dada por el cociente de división por cien:


  $$d = \frac{P}{100} \iff P\% = d$$


  **Ejemplos de conversión directa:**

  - $75\% = \frac{75}{100} = 0,75$.

  - $8\% = \frac{8}{100} = 0,08$.

  - $150\% = \frac{150}{100} = 1,5$.'
definiciones_clave: '- **Representación decimal**: Número decimal $d = P / 100$ equivalente
  a $P\%$.'
propiedades_relaciones: '- **Desplazamiento decimal**: Mueve la coma 2 posiciones
  a la izquierda.'
ejemplo_guiado:
  enunciado: Convierta a número decimal los porcentajes $60\%$, $3,5\%$ y $200\%$.
  pasos:
  - 'Paso 1: Para $60\%$, dividir $60 : 100 = 0,6$.'
  - 'Paso 2: Para $3,5\%$, desplazar la coma dos lugares a la izquierda $\implies
    0,035$.'
  - 'Paso 3: Para $200\%$, dividir $200 : 100 = 2$.'
  - 'Conclusión: Los números decimales son $0,6$, $0,035$ y $2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se convierte un porcentaje P% a su representación decimal d?
  choices:
  - text: Dividiendo el porcentaje entre 100 (d = P / 100)
    is_correct: true
  - text: Multiplicando d = P · 100
    is_correct: false
  - text: Sumando d = P + 100
    is_correct: false
  - text: Restando d = 100 - P
    is_correct: false
  explanation: La alternativa correcta es 'Dividiendo el porcentaje entre 100 (d =
    P / 100)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3,5%, ¿cuál fue la representación decimal obtenida?
  choices:
  - text: 0,035
    is_correct: true
  - text: 0,35
    is_correct: false
  - text: 3,5
    is_correct: false
  - text: '350'
    is_correct: false
  explanation: La alternativa correcta es '0,035'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de convertir porcentajes a su forma
  decimal $d = \frac{P}{100}$ desplazar la coma dos posiciones a la izquierda.
semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_DECIMAL
procedimiento:
- 'Paso 1: Convertir el porcentaje $P\%$ a su forma decimal $d = P/100$ o fracción
  irreducible.'
- 'Paso 2: Formular la ecuación de proporción correspondiente ($V = d \cdot N$, $P
  = (A/B) \cdot 100$ o $N = V/d$).'
- 'Paso 3: Resolver numéricamente y verificar la coherencia de la respuesta.'
errores_correccion: '- **Error 1: Multiplicar directamente por el número del porcentaje
  sin dividir entre 100 ($15\% \text{ de } 80 = 15 \cdot 80 = 1200$).** **Cómo corregirlo:**
  El porcentaje DEBE convertirse a decimal dividiendo por 100 antes de multiplicar
  ($0,15 \cdot 80 = 12$).


  - **Error 2: Confundir el cálculo del valor de un porcentaje con el cálculo del
  total.** **Cómo corregirlo:** Si se busca el total $100\%$ dada una parte $V$, se
  DEBE dividir por el porcentaje ($N = V / d$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PORCENTAJES.REPRESENTACION_DECIMAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de porcentajes.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia decimal.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por división de base cien.
- titulo: ¿Equivale el P% a la fracción P/100?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de porcentaje.
- titulo: ¿Se obtiene el 10% de N dividiendo N entre 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10\% = 10/100 = 1/10$.
errores_frecuentes:
- Multiplicar una cantidad por el valor entero del porcentaje sin dividir entre cien.
- Sumar directamente dos porcentajes sucesivos aplicados sobre cantidades distintas.
- Desplazar la coma decimal hacia la derecha al convertir un porcentaje a su forma
  decimal.
- El porcentaje $50\%$ de una cantidad equivale a dividir dicha cantidad entre cincuenta.
- Declarar la parte dada con el total $100\%$ al despejar incógnitas de proporción.
afirmaciones_verdaderas:
- Un porcentaje $P\%$ es una razón de denominador cien $P\% = \frac{P}{100}$ que equivale
  al número decimal $P/100$.
- 'El $c\%$ de una cantidad $N$ se obtiene multiplicando $N$ por su equivalente decimal:
  $V = \left(\frac{c}{100}\right) \cdot N$.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
