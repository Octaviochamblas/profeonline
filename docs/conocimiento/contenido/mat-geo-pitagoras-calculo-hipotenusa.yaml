semantic_id: MAT.GEO.PITAGORAS.CALCULO_HIPOTENUSA
resumen_inicial: 'Cálculo de la hipotenusa dados los dos catetos: conceptos, teoremas,
  propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: Conocer los dos catetos de un triángulo rectángulo es suficiente
  para determinar completamente la medida de su hipotenusa, aplicando directamente
  el teorema de Pitágoras.
explicacion_formal: '![Cálculo de la hipotenusa con los dos catetos](/static/img/geometria/areas-pitagoras/pitagoras-calculo-hipotenusa.svg)


  ### Definición formal


  Si un triángulo rectángulo tiene catetos $a$ y $b$, su hipotenusa es $c=\sqrt{a^2+b^2}$.


  ### Desarrollo didáctico


  Con catetos 3 y 4: $c=\sqrt{3^2+4^2}=\sqrt{9+16}=\sqrt{25}=5$.'
