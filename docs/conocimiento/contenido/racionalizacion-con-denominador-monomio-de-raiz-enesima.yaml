resumen_inicial: 'La racionalización de un denominador con raíz $n$-ésima $\frac{a}{\sqrt[n]{b^k}}$
  ($k < n$) requiere amplificar por $\frac{\sqrt[n]{b^{n-k}}}{\sqrt[n]{b^{n-k}}}$,
  completando el exponente a $n$ para liberar la base $b$: $\frac{a \sqrt[n]{b^{n-k}}}{b}$.'
explicacion_simple: Para eliminar una raíz de índice cualquiera (como cúbica o quinta)
  del denominador, debemos multiplicar por una raíz del mismo índice cuyo exponente
  interno complete la cantidad necesaria para llegar al índice y cancelar la raíz.
explicacion_formal: 'Para todo $a \in \mathbb{R}$, $b > 0$, $n \in \mathbb{N}_{\ge
  2}$ y $1 \le k < n$, la **Racionalización de Raíz $n$-ésima** se efectúa amplificando
  por $\frac{\sqrt[n]{b^{n-k}}}{\sqrt[n]{b^{n-k}}}$:


  $$\frac{a}{\sqrt[n]{b^k}} = \frac{a}{\sqrt[n]{b^k}} \cdot \frac{\sqrt[n]{b^{n-k}}}{\sqrt[n]{b^{n-k}}}
  = \frac{a \cdot \sqrt[n]{b^{n-k}}}{\sqrt[n]{b^k \cdot b^{n-k}}} = \frac{a \cdot
  \sqrt[n]{b^{n-k}}}{\sqrt[n]{b^n}} = \frac{a \sqrt[n]{b^{n-k}}}{b}$$


  **Desglose del exponente complementario:**

  - El exponente del factor amplificador es $n - k$, que garantiza $k + (n-k) = n$
  para cancelar la raíz.


  > **Complemento didáctico:** Ejemplo: Para $\frac{4}{\sqrt[3]{2^1}}$, se amplifica
  por $\sqrt[3]{2^{3-1}} = \sqrt[3]{2^2} = \sqrt[3]{4}$, obteniendo $\frac{4\sqrt[3]{4}}{2}
  = 2\sqrt[3]{4}$.'
definiciones_clave: '- **Racionalización monomio enésimo**: Regla $\frac{a}{\sqrt[n]{b^k}}
  = \frac{a \sqrt[n]{b^{n-k}}}{b}$ que completa el exponente a $n$.'
propiedades_relaciones: '- **Exponente complementario**: Amplifica por $\sqrt[n]{b^{n-k}}$
  donde $n-k$ es el complemento a la orden $n$.'
ejemplo_guiado:
  enunciado: Racionalice la expresión $\frac{5}{\sqrt[5]{3^2}}$.
  pasos:
  - 'Paso 1: Identificar el índice $n=5$ y el exponente del radicando $k=2$.'
  - 'Paso 2: Calcular el exponente complementario: $n - k = 5 - 2 = 3$.'
  - 'Paso 3: Amplificar la fracción por $\frac{\sqrt[5]{3^3}}{\sqrt[5]{3^3}}$: $\frac{5
    \cdot \sqrt[5]{3^3}}{\sqrt[5]{3^2 \cdot 3^3}} = \frac{5\sqrt[5]{27}}{\sqrt[5]{3^5}}
    = \frac{5\sqrt[5]{27}}{3}$.'
  - 'Conclusión: El resultado racionalizado es $\frac{5\sqrt[5]{27}}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué factor de raíz enésima se debe amplificar la fracción a / sqrt[n]{b^k}
    (k < n)?
  choices:
  - text: Por la raíz sqrt[n]{b^{n-k}} (con exponente complementario n - k)
    is_correct: true
  - text: Por la misma raíz sqrt[n]{b^k}
    is_correct: false
  - text: Por b^n / b^n
    is_correct: false
  - text: Por n / k
    is_correct: false
  explanation: La alternativa correcta es 'Por la raíz sqrt[n]{b^{n-k}} (con exponente
    complementario n - k)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5 / sqrt[5]{3^2}, ¿cuál fue el resultado racionalizado?
  choices:
  - text: (5 · sqrt[5]{27}) / 3
    is_correct: true
  - text: (5 · sqrt[5]{9}) / 3
    is_correct: false
  - text: 5 · sqrt[5]{3}
    is_correct: false
  - text: 15 / sqrt[5]{27}
    is_correct: false
  explanation: La alternativa correcta es '(5 · sqrt[5]{27}) / 3'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de racionalizar denominadores con
  raíces $n$-ésimas $\frac{a}{\sqrt[n]{b^k}} = \frac{a \sqrt[n]{b^{n-k}}}{b}$, amplificando
  por la raíz del exponente complementario $n-k$.
semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_MONOMIO_RAIZ_ENESIMA
procedimiento:
- 'Paso 1: Identificar la estructura del denominador (monomio de raíz cuadrada, monomio
  $n$-ésimo o binomio).'
- 'Paso 2: Determinar el factor de amplificación conveniente (raíz idéntica, raíz
  de exponente complementario o conjugado).'
- 'Paso 3: Amplificar la fracción (numerador y denominador) por dicho factor.'
- 'Paso 4: Simplificar los radicales del denominador y reducir los coeficientes resultantes.'
errores_correccion: '- **Error 1: Multiplicar solo el denominador olvidando el numerador.**
  **Cómo corregirlo:** La racionalización es una AMPLIFICACIÓN de fracción; se DEBE
  multiplicar numerador y denominador por el mismo factor.


  - **Error 2: Amplificar un binomio $(\sqrt{a} + \sqrt{b})$ por la misma suma en
  lugar del conjugado.** **Cómo corregirlo:** El cuadrado de binomio deja el término
  $2\sqrt{ab}$; se debe amplificar por el CONJUGADO $(\sqrt{a} - \sqrt{b})$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de racionalización para MAT.NUM.RACIONALIZACION.DENOMINADOR_MONOMIO_RAIZ_ENESIMA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del procedimiento de racionalización.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia numéríca.
  alternativas:
  - Conserva el valor
  - Altera el valor
  - Indeterminado
  respuesta: Conserva el valor
  solucion_pasos:
  - Demostración por amplificación por el elemento neutro 1.
- titulo: ¿Elimina la racionalización el valor irracional del denominador?
  respuesta: Sí
  solucion_pasos:
  - Sí, transforma el denominador en un número entero racional.
- titulo: ¿Altera la racionalización el valor cuantitativo de la fracción?
  respuesta: 'No'
  solucion_pasos:
  - No, es una amplificación equivalente por el número 1.
errores_frecuentes:
- Multiplicar únicamente la raíz del denominador sin modificar el numerador de la
  fracción.
- Amplificar un denominador de raíz $n$-ésima por la misma raíz sin usar el exponente
  complementario.
- Usar el cuadrado de binomio para racionalizar una suma de raíces cuadradas.
- La racionalización de $\frac{1}{\sqrt{2}}$ equivale al entero 2 tras eliminar la
  raíz.
- Cambiar los signos de los numeradores al aplicar el conjugado del denominador.
afirmaciones_verdaderas:
- La racionalización consiste en transformar una fracción con radicales en el denominador
  a una fracción equivalente con denominador racional.
- Amplificar por el factor de racionalización no altera el valor de la fracción por
  ser equivalente a multiplicar por 1.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
