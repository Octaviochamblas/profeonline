semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_MONOMIO_RAIZ_ENESIMA
resumen_inicial: Para racionalizar un monomio de raíz enésima $\sqrt[n]{b^k}$, se amplifica la fracción por el factor complementario $\frac{\sqrt[n]{b^{n-k}}}{\sqrt[n]{b^{n-k}}}$, completando la potencia $n$-ésima perfecta en el denominador.
explicacion_simple: "![Racionalización con denominador monomio de raíz enésima](/static/img/nodos/racionalizacion-con-denominador-monomio-de-raiz-enesima-intro.svg)\n\nCuando el denominador tiene una raíz de índice mayor a $2$ (como raíz cúbica $\\sqrt[3]{2}$ o raíz quinta $\\sqrt[5]{x^2}$), **no sirve multiplicar por la misma raíz**.\n- **¿Por qué?** Porque $\\sqrt[3]{2} \\cdot \\sqrt[3]{2} = \\sqrt[3]{4}$, ¡y $4$ no tiene raíz cúbica exacta!\n- **La regla del exponente que falta:** Te preguntas: *¿Cuánto le falta al exponente para llegar al índice $n$?*\n  - En $\\frac{4}{\\sqrt[3]{2^1}}$, al exponente $1$ le faltan $3 - 1 = 2$ para llegar a $3$.\n  - Multiplicas arriba y abajo por $\\sqrt[3]{2^2} = \\sqrt[3]{4}$:\n$$\\frac{4}{\\sqrt[3]{2}} \\cdot \\frac{\\sqrt[3]{2^2}}{\\sqrt[3]{2^2}} = \\frac{4\\sqrt[3]{4}}{\\sqrt[3]{2^3}} = \\frac{4\\sqrt[3]{4}}{2} = 2\\sqrt[3]{4}$$"
explicacion_formal: 'Sea la fracción $\frac{a}{\sqrt[n]{b^k}}$ con $a \in \mathbb{R}$, $b \in \mathbb{R}^+$, $n \in \mathbb{N}_{\ge 2}$ y $1 \le k < n$. El **Factor Racionalizante de Orden $n$** se define mediante el exponente complementario:


  $$e = n - k$$


  **Teorema de Racionalización Enésima:**

  $$\frac{a}{\sqrt[n]{b^k}} = \frac{a}{\sqrt[n]{b^k}} \cdot \frac{\sqrt[n]{b^{n-k}}}{\sqrt[n]{b^{n-k}}} = \frac{a \sqrt[n]{b^{n-k}}}{\sqrt[n]{b^k \cdot b^{n-k}}} = \frac{a \sqrt[n]{b^{n-k}}}{\sqrt[n]{b^n}} = \frac{a \sqrt[n]{b^{n-k}}}{b}$$


  **Condición de Aplicación:**

  Si el radicando es un número compuesto (como $27$), debe expresarse previamente en su descomposición prima ($27 = 3^3$) para calcular con precisión el exponente complementario $n - k$.'
definiciones_clave: '- **Exponente complementario ($n - k$)**: Cantidad que le falta a la potencia del radicando para igualar al índice del radical.

  - **Factor racionalizante enésimo**: Expresión $\sqrt[n]{b^{n-k}}$ que permite completar la potencia $b^n$.

  - **Descomposición prima previa**: Representación en factores primos obligatoria antes de racionalizar.'
propiedades_relaciones: '- **Cancelación exacta**: $\sqrt[n]{b^k} \cdot \sqrt[n]{b^{n-k}} = \sqrt[n]{b^{k + (n-k)}} = \sqrt[n]{b^n} = b$.

  - **Caso $k = 1$ en raíz cúbica**: $\frac{1}{\sqrt[3]{b}} = \frac{\sqrt[3]{b^2}}{b}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de racionalización enésima](/static/img/nodos/racionalizacion-con-denominador-monomio-de-raiz-enesima-ejemplos.svg)


    Racionalice y simplifique las fracciones $\frac{4}{\sqrt[3]{2}}$, $\frac{6}{\sqrt[5]{x^2}}$ y $\frac{3}{\sqrt[4]{27}}$.'
  pasos:
  - 'Paso 1: Racionalizar $\frac{4}{\sqrt[3]{2}}$: Falta $3 - 1 = 2$. Multiplicar por $\frac{\sqrt[3]{2^2}}{\sqrt[3]{2^2}} \implies \frac{4\sqrt[3]{4}}{2} = 2\sqrt[3]{4}$.'
  - 'Paso 2: Racionalizar $\frac{6}{\sqrt[5]{x^2}}$: Falta $5 - 2 = 3$. Multiplicar por $\frac{\sqrt[5]{x^3}}{\sqrt[5]{x^3}} \implies \frac{6\sqrt[5]{x^3}}{x}$.'
  - 'Paso 3: Racionalizar $\frac{3}{\sqrt[4]{27}}$: Descomponer $27 = 3^3$. Falta $4 - 3 = 1$. Multiplicar por $\frac{\sqrt[4]{3}}{\sqrt[4]{3}} \implies \frac{3\sqrt[4]{3}}{3} = \sqrt[4]{3}$.'
  - 'Conclusión: Las formas racionalizadas son $2\sqrt[3]{4}$, $\frac{6\sqrt[5]{x^3}}{x}$ y $\sqrt[4]{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué factor se debe amplificar la fracción $\frac{1}{\sqrt[3]{5}}$ para racionalizarla?
  choices:
  - text: Por $\frac{\sqrt[3]{5^2}}{\sqrt[3]{5^2}} = \frac{\sqrt[3]{25}}{\sqrt[3]{25}}$ (porque $3 - 1 = 2$)
    is_correct: true
  - text: Por $\frac{\sqrt[3]{5}}{\sqrt[3]{5}}$
    is_correct: false
  - text: Por $\frac{\sqrt{5}}{\sqrt{5}}$
    is_correct: false
  - text: Por $5$
    is_correct: false
  explanation: La alternativa correcta es 'Por $\frac{\sqrt[3]{5^2}}{\sqrt[3]{5^2}} = \frac{\sqrt[3]{25}}{\sqrt[3]{25}}$ (porque $3 - 1 = 2$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué para $\frac{3}{\sqrt[4]{27}}$ se amplificó por $\sqrt[4]{3}$?
  choices:
  - text: Porque $27 = 3^3$, por lo que al exponente $3$ le falta $4 - 3 = 1$ para llegar a $4$
    is_correct: true
  - text: 'Porque $27 : 3 = 9$'
    is_correct: false
  - text: Porque $27$ es impar
    is_correct: false
  - text: Porque se divide por $3$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $27 = 3^3$, por lo que al exponente $3$ le falta $4 - 3 = 1$ para llegar a $4$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Descomponer la base del radicando en potencias de números primos $b^k$.'
- 'Paso 2: Calcular el exponente complementario $e = n - k$.'
- 'Paso 3: Amplificar la fracción multiplicando numerador y denominador por $\sqrt[n]{b^e}$, cancelando la raíz en el denominador a $b$ y simplificando.'
errores_correccion: "- **Error 1: Multiplicar por la misma raíz sin ajustar exponentes ($\frac{1}{\\sqrt[3]{2}} \\cdot \frac{\\sqrt[3]{2}}{\\sqrt[3]{2}} = \frac{\\sqrt[3]{2}}{\\sqrt[3]{4}}$).** **Cómo corregirlo:** La potencia debe completar el índice: usar $\\sqrt[3]{2^2} = \\sqrt[3]{4}$ para que el denominador sea $\\sqrt[3]{8} = 2$.\n- **Error 2: No descomponer números compuestos antes de buscar el exponente complementario.** **Cómo corregirlo:** Escribir siempre $8 = 2^3$, $27 = 3^3$, $16 = 2^4$ antes de calcular $n - k$."
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la forma racionalizada de $\frac{2}{\sqrt[3]{4}}$?
  alternativas:
  - $\sqrt[3]{2}$
  - $2\sqrt[3]{2}$
  - $\sqrt[3]{4}$
  respuesta: $\sqrt[3]{2}$
  solucion_pasos:
  - $4 = 2^2$, falta $3-2=1 \implies \frac{2\sqrt[3]{2}}{2} = \sqrt[3]{2}$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale racionalizar $\frac{1}{\sqrt[5]{a^3}}$?
  alternativas:
  - $\frac{\sqrt[5]{a^2}}{a}$
  - $\frac{\sqrt[5]{a^3}}{a}$
  - $\sqrt[5]{a^2}$
  respuesta: $\frac{\sqrt[5]{a^2}}{a}$
  solucion_pasos:
  - Falta $5 - 3 = 2 \implies \frac{\sqrt[5]{a^2}}{a}$.
- titulo: ¿Es 5 / ∛5 igual a ∛25?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{5}{\sqrt[3]{5}} \cdot \frac{\sqrt[3]{25}}{\sqrt[3]{25}} = \frac{5\sqrt[3]{25}}{5} = \sqrt[3]{25}$.
  alternativas:
  - texto: Sí, 5 / ∛5 = ∛25
    es_correcta: true
    retroalimentacion: ¡Correcto! Factor complementario ∛5² = ∛25.
  - texto: No, es igual a ∛5
    es_correcta: false
    retroalimentacion: Incorrecto, $5/5 = 1$, queda $\sqrt[3]{25}$.
  - texto: No, es igual a 5∛5
    es_correcta: false
    retroalimentacion: Incorrecto, los 5 se cancelan.
- titulo: ¿Es el factor racionalizante de 1 / ∜(x³) igual a ∜x?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $4 - 3 = 1 \implies \sqrt[4]{x^1} = \sqrt[4]{x}$.
  alternativas:
  - texto: Sí, falta 4 - 3 = 1 dando ∜x
    es_correcta: true
    retroalimentacion: ¡Correcto! Exponente complementario unitario.
  - texto: No, es ∜(x³)
    es_correcta: false
    retroalimentacion: Incorrecto, ese factor no eliminaría la raíz.
  - texto: No, es x
    es_correcta: false
    retroalimentacion: Incorrecto, debe ser un radical de índice 4.
errores_frecuentes:
- Amplificar por la misma raíz de orden $n$ sin elevar al exponente complementario.
- No descomponer bases numéricas en potencias primas antes de calcular $n - k$.
- Restar incorrectamente $n - k$.
- Olvidar que en el denominador la raíz se cancela por completo.
- Cambiar el índice de la raíz durante la amplificación.
afirmaciones_verdaderas:
- Para racionalizar un monomio de raíz enésima se amplifica por $\sqrt[n]{b^{n-k}}$.
- La suma de los exponentes interior y complementario debe ser exactamente igual al índice $n$.
- La descomposición en factores primos es un paso previo fundamental para no inflar los cálculos.
al_terminar_debes_poder: '![Síntesis de racionalización enésima](/static/img/nodos/racionalizacion-con-denominador-monomio-de-raiz-enesima-resumen.svg)


  QUÉ: Racionalizar fracciones cuyo denominador sea un monomio con raíz enésima $\sqrt[n]{b^k}$.


  CÓMO: Expresando la base en factores primos, calculando el exponente complementario $e = n - k$, amplificando por $\frac{\sqrt[n]{b^e}}{\sqrt[n]{b^e}}$ y cancelando el radical en el denominador.'
