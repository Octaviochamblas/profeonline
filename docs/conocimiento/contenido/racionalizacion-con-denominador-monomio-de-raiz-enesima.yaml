semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_MONOMIO_RAIZ_ENESIMA
resumen_inicial: Para racionalizar un denominador de la forma $\sqrt[n]{a^k}$ con
  $k < n$, se amplifica por $\sqrt[n]{a^{n-k}}$ completando la potencia perfecta $n$-ésima
  en el radicando.
explicacion_simple: 'Cuando la raíz en el denominador tiene un índice mayor a 2 (ejemplo:
  $\sqrt[3]{2}$), necesitas que el exponente dentro llegue a ser igual al índice (llegar
  a $3$).

  Si tienes $\frac{5}{\sqrt[3]{2^1}}$, amplificas por $\sqrt[3]{2^2}$ porque $1 +
  2 = 3$:

  $$\frac{5 \cdot \sqrt[3]{2^2}}{\sqrt[3]{2^1} \cdot \sqrt[3]{2^2}} = \frac{5\sqrt[3]{4}}{\sqrt[3]{2^3}}
  = \frac{5\sqrt[3]{4}}{2}$$'
explicacion_formal: 'Para todo $A \in \mathbb{R}$, $a > 0$ y $1 \le k < n$, el factor
  racionalizante de $\sqrt[n]{a^k}$ es $\sqrt[n]{a^{n-k}}$:

  $$\frac{A}{\sqrt[n]{a^k}} = \frac{A \cdot \sqrt[n]{a^{n-k}}}{\sqrt[n]{a^k} \cdot
  \sqrt[n]{a^{n-k}}} = \frac{A \sqrt[n]{a^{n-k}}}{\sqrt[n]{a^n}} = \frac{A \sqrt[n]{a^{n-k}}}{a}$$'
definiciones_clave: '- **Factor racionalizante $n$-ésimo**: $\sqrt[n]{a^{n-k}}$, término
  que complementa el exponente $k$ hasta alcanzar $n$.'
propiedades_relaciones: '- **Complemento de exponente**: $k + (n-k) = n$.'
ejemplo_guiado:
  enunciado: Racionaliza $\frac{4}{\sqrt[5]{x^2}}$ ($x > 0$).
  pasos:
  - Identificar índice $n = 5$ y exponente del radicando $k = 2$.
  - 'Calcular el exponente complementario: $n - k = 5 - 2 = 3$.'
  - El factor racionalizante es $\sqrt[5]{x^3}$.
  - 'Amplificar: $\frac{4 \cdot \sqrt[5]{x^3}}{\sqrt[5]{x^2} \cdot \sqrt[5]{x^3}}
    = \frac{4\sqrt[5]{x^3}}{\sqrt[5]{x^5}} = \frac{4\sqrt[5]{x^3}}{x}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por cuál factor se debe amplificar la fracción $\frac{1}{\sqrt[3]{7^1}}$
    para racionalizar su denominador?
  choices:
  - text: \sqrt[3]{7^2}
    is_correct: true
  - text: \sqrt[3]{7^1}
    is_correct: false
  - text: \sqrt{7}
    is_correct: false
  - text: 7^3
    is_correct: false
  explanation: 'La correcta es: \sqrt[3]{7^2}. El exponente complementario es $3 -
    1 = 2$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Racionaliza $\frac{6}{\sqrt[3]{3^1}}$.
  choices:
  - text: 2\sqrt[3]{9}
    is_correct: true
  - text: 6\sqrt[3]{9}
    is_correct: false
  - text: 2\sqrt[3]{3}
    is_correct: false
  - text: '18'
    is_correct: false
  explanation: 'La correcta es: 2\sqrt[3]{9}. $\frac{6\sqrt[3]{3^2}}{3} = \frac{6\sqrt[3]{9}}{3}
    = 2\sqrt[3]{9}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar índice $n$ y exponente $k$ del radicando en el denominador.'
- 'Paso 2: Calcular el exponente faltante $n - k$.'
- 'Paso 3: Amplificar la fracción por $\sqrt[n]{a^{n-k}}$.'
- 'Paso 4: Reemplazar el denominador por $a$ y simplificar.'
errores_correccion: No amplifiques por la misma raíz si el índice es mayor a 2. $\sqrt[3]{2}
  \cdot \sqrt[3]{2} = \sqrt[3]{4} \neq 2$. Debes amplificar por $\sqrt[3]{2^2}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Racionaliza $\frac{1}{\sqrt[4]{x}}$.
  alternativas:
  - \sqrt[4]{x^3}/x
  - \sqrt[4]{x}/x
  - x^3
  respuesta: \sqrt[4]{x^3}/x
  solucion_pasos:
  - Factor racionalizante $\sqrt[4]{x^{4-1}} = \sqrt[4]{x^3} \implies \frac{\sqrt[4]{x^3}}{x}$.
errores_frecuentes:
- Amplificar por $\sqrt[n]{a^k}$ en lugar de $\sqrt[n]{a^{n-k}}$.
afirmaciones_verdaderas:
- $\frac{A}{\sqrt[n]{a^k}} = \frac{A\sqrt[n]{a^{n-k}}}{a}$.
al_terminar_debes_ponder: Racionalizar denominadores con raíces n-ésimas monomias.
fuente: Texto escolar MINEDUC.
estado: publicado
