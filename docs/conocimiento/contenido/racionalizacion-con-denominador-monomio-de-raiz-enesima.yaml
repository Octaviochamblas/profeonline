semantic_id: MAT.NUM.RACIONALIZACION.DENOMINADOR_MONOMIO_RAIZ_ENESIMA
resumen_inicial: 'La racionalización de un denominador monomio de raíz enésima $\sqrt[n]{b^k}$ elimina el radical amplificando la fracción por $\sqrt[n]{b^{n-k}}$, completando el exponente necesario para cancelar la raíz.'
explicacion_simple: |
  Para quitar una raíz de mayor grado del denominador (como una raíz cúbica $\sqrt[3]{b}$ o una raíz quinta $\sqrt[5]{b^2}$), no basta con multiplicar por la misma raíz. Debes "completar la diferencia" que le falta al exponente para alcanzar el valor del índice $n$. Si abajo tienes $\sqrt[3]{2^1}$, a ese 1 le faltan 2 para llegar a 3. Por ende, amplificas por $\sqrt[3]{2^2}$. Al multiplicar $\sqrt[3]{2^1} \cdot \sqrt[3]{2^2} = \sqrt[3]{2^3} = 2$, logras cancelar la raíz del denominador.
explicacion_formal: |
  ### Definición formal
  La **racionalización de un monomio de raíz enésima** de la forma $\frac{a}{\sqrt[n]{b^k}}$ (con $1 \le k < n$) requiere encontrar el **factor racionalizante de complemento**:
  $$\text{Factor Racionalizante} = \sqrt[n]{b^{n-k}}$$
  al multiplicar por este factor, se aplica la ley de suma de exponentes de igual índice:
  $$\frac{a}{\sqrt[n]{b^k}} = \frac{a \cdot \sqrt[n]{b^{n-k}}}{\sqrt[n]{b^k} \cdot \sqrt[n]{b^{n-k}}} = \frac{a \cdot \sqrt[n]{b^{n-k}}}{\sqrt[n]{b^{k + (n-k)}}} = \frac{a \cdot \sqrt[n]{b^{n-k}}}{\sqrt[n]{b^n}} = \frac{a \cdot \sqrt[n]{b^{n-k}}}{b}$$

  ### Regla del exponente complementario $(n - k)$
  - Índice del radical: $n$.
  - Exponente actual del radicando: $k$.
  - Exponente del factor racionalizante: $n - k$ (lo que falta para completar la potencia $n$-ésima perfecta).

  ### Síntesis didáctica
  - Factor de amplificación: $\frac{\sqrt[n]{b^{n-k}}}{\sqrt[n]{b^{n-k}}}$.
  - Numerador resultante: $a \cdot \sqrt[n]{b^{n-k}}$.
  - Denominador resultante: $b$ (entero racional libre de raíz).
definiciones_clave: |
  - **Exponente complementario $n - k$**: Cantidad que falta sumar al exponente interno $k$ para alcanzar el índice $n$.
  - **Factor racionalizante enésimo $\sqrt[n]{b^{n-k}}$**: Radical que al multiplicarse por $\sqrt[n]{b^k}$ completa la potencia exacta $\sqrt[n]{b^n} = b$.
  - **Cancelación enésima**: Propiedad $\sqrt[n]{b^n} = b$ que elimina la raíz del denominador.
propiedades_relaciones: |
  - **Generalización del caso cuadrático**: Para $n = 2$ y $k = 1$, el complemento es $2 - 1 = 1$, reduciéndose al caso particular $\sqrt{b}$.
  - **Condición $k < n$**: Si $k \ge n$, primero se extraen factores del radical antes de determinar el complemento necesario.
ejemplo_guiado:
  enunciado: 'Racionaliza el denominador de la fracción $M = \frac{6}{\sqrt[3]{2}}$ completando el exponente necesario en el radicando.'
  pasos:
    - 'Paso 1: Identificamos el índice $n = 3$ y el exponente del radicando $k = 1$ en $\sqrt[3]{2^1}$.'
    - 'Paso 2: Calculamos el exponente complementario: $n - k = 3 - 1 = 2$. El factor racionalizante es $\sqrt[3]{2^2} = \sqrt[3]{4}$.'
    - 'Paso 3: Amplificamos la fracción multiplicando arriba y abajo por $\sqrt[3]{2^2}$: $M = \frac{6 \cdot \sqrt[3]{2^2}}{\sqrt[3]{2^1} \cdot \sqrt[3]{2^2}} = \frac{6\sqrt[3]{4}}{\sqrt[3]{2^{1+2}}} = \frac{6\sqrt[3]{4}}{\sqrt[3]{2^3}}$.'
    - 'Paso 4: Cancelamos la raíz cúbica del denominador obteniendo el entero $2$ y simplificamos los números exteriores: $M = \frac{6\sqrt[3]{4}}{2} = 3\sqrt[3]{4}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué factor radical debe amplificarse la fracción $\frac{a}{\sqrt[n]{b^k}}$ para racionalizar su denominador?'
    choices:
      - {text: 'Por $\frac{\sqrt[n]{b^{n-k}}}{\sqrt[n]{b^{n-k}}}$, multiplicando por la raíz cuyo exponente complementario es $n - k$', is_correct: true}
      - {text: 'Por la misma raíz $\frac{\sqrt[n]{b^k}}{\sqrt[n]{b^k}}$ sin modificar el exponente', is_correct: false}
      - {text: 'Por una raíz cuadrada simple $\frac{\sqrt{b}}{\sqrt{b}}$', is_correct: false}
      - {text: 'Por la potencia $b^n$ sin raíz', is_correct: false}
    explanation: 'La alternativa correcta es ''Por $\frac{\sqrt[n]{b^{n-k}}}{\sqrt[n]{b^{n-k}}}$, multiplicando por la raíz cuyo exponente complementario es $n - k$''. El exponente $n - k$ es la cantidad exacta necesaria para completar $k + (n-k) = n$ y cancelar la raíz.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el factor racionalizante necesario para eliminar el radical en el denominador de $\frac{5}{\sqrt[5]{3^2}}$?'
    choices:
      - {text: '$\sqrt[5]{3^3}$, pues el exponente complementario es $5 - 2 = 3$', is_correct: true}
      - {text: '$\sqrt[5]{3^2}$, multiplicando por la misma expresión', is_correct: false}
      - {text: '$\sqrt[5]{3^5}$, elevando al índice', is_correct: false}
      - {text: '$\sqrt{3}$, reduciendo a raíz cuadrada', is_correct: false}
    explanation: 'La alternativa correcta es ''$\sqrt[5]{3^3}$, pues el exponente complementario es $5 - 2 = 3$''. Como $k = 2$ y $n = 5$, el complemento es $5 - 2 = 3 \implies \sqrt[5]{3^3}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el índice $n$ de la raíz y el exponente $k$ del radicando en el denominador $\sqrt[n]{b^k}$.'
  - 'Paso 2: Calcular el exponente complementario $n - k$.'
  - 'Paso 3: Multiplicar el numerador y el denominador por el factor racionalizante $\sqrt[n]{b^{n-k}}$.'
  - 'Paso 4: Sumar los exponentes del denominador $k + (n-k) = n$, simplificar la raíz $\sqrt[n]{b^n} = b$ y reducir coeficientes.'
errores_correccion: |
  - **Error 1:** Multiplicar por el mismo radical $\sqrt[n]{b^k}$ creyendo que elimina cualquier raíz (ej: hacer $\sqrt[3]{2} \cdot \sqrt[3]{2} = \sqrt[3]{4}$, que NO elimina la raíz). **Cómo corregirlo:** En raíces de grado $n \ge 3$, debes multiplicar por el exponente **complementario** $n - k$ para alcanzar la potencia $n$: $\sqrt[3]{2^1} \cdot \sqrt[3]{2^2} = \sqrt[3]{2^3} = 2$.
  - **Error 2:** Restar el índice del exponente al calcular el complemento (ej: hacer $k - n$). **Cómo corregirlo:** El complemento se calcula **restando el exponente actual del índice**: $n - k$.
ejemplos:
  - titulo: 'Racionalización raíz cúbica simple'
    enunciado: '¿La racionalización de $\frac{4}{\sqrt[3]{2}}$ equivale a $2\sqrt[3]{4}$?'
    alternativas:
      - 'Sí, pues $\frac{4\sqrt[3]{2^2}}{2} = 2\sqrt[3]{4}$'
      - 'No, equivale a $4\sqrt[3]{2}$'
      - 'No, equivale a $2\sqrt[3]{2}$'
    respuesta: 'Sí, pues $\frac{4\sqrt[3]{2^2}}{2} = 2\sqrt[3]{4}$'
    solucion_pasos:
      - '1. Complemento para $n=3, k=1$: $3-1 = 2 \implies$ factor $\sqrt[3]{2^2} = \sqrt[3]{4}$.'
      - '2. Amplificamos: $\frac{4\sqrt[3]{4}}{\sqrt[3]{2^3}} = \frac{4\sqrt[3]{4}}{2} = 2\sqrt[3]{4}$.'
  - titulo: 'Racionalización raíz cuarta'
    enunciado: '¿Para racionalizar $\frac{1}{\sqrt[4]{5^3}}$ se amplifica por $\sqrt[4]{5^1}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Complemento: $4 - 3 = 1 \implies$ factor $\sqrt[4]{5^1} \implies \frac{\sqrt[4]{5}}{5}$.'
  - titulo: 'Simplificación de enteros'
    enunciado: '¿El resultado de racionalizar $\frac{10}{\sqrt[3]{5}}$ es $2\sqrt[3]{25}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{10\sqrt[3]{5^2}}{5} = 2\sqrt[3]{25}$.'
  - titulo: 'Cancelación final'
    enunciado: '¿El producto de los radicales del denominador $\sqrt[n]{b^k} \cdot \sqrt[n]{b^{n-k}}$ resulta siempre en el entero $b$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt[n]{b^{k + n - k}} = \sqrt[n]{b^n} = b$.'
errores_frecuentes:
  - 'Amplificar una fracción de raíz cúbica $\frac{a}{\sqrt[3]{b}}$ por el mismo radical $\sqrt[3]{b}$ elimina la raíz del denominador.'
  - 'El exponente complementario de la racionalización enésima se calcula dividiendo el índice entre el exponente.'
  - 'La racionalización de $\frac{1}{\sqrt[5]{x^2}}$ requiere multiplicar por la raíz cuadrada $\sqrt{x}$.'
  - 'Sumar el índice al exponente actual al buscar el factor racionalizante enésimo.'
  - 'Multiplicar los radicandos del denominador mediante la suma de índices.'
afirmaciones_verdaderas:
  - 'La racionalización con denominador monomio de raíz enésima $\sqrt[n]{b^k}$ exige amplificar por la raíz complementaria $\sqrt[n]{b^{n-k}}$ para completar la potencia $n$-ésima perfecta $b^n$.'
  - 'El exponente del factor racionalizante $n - k$ representa exactamente la cantidad de potencias que le faltan al radicando para cancelar la raíz de índice $n$.'
al_terminar_debes_poder: 'Racionalizar denominadores monomios de raíz enésima calculando el exponente complementario $n - k$ para cancelar la raíz.'
