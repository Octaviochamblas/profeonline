procedimiento:
- 'Paso 1: Identifica el ángulo inscrito y el arco que subtiende (el arco que no contiene
  al vértice).'
- 'Paso 2: Si conoces el arco, divide su medida entre 2 para obtener el ángulo inscrito.'
- 'Paso 3: Si conoces el ángulo inscrito, multiplica su medida por 2 para obtener
  el arco.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
