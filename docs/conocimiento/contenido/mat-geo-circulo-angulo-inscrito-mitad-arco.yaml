semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_INSCRITO_MITAD_ARCO
resumen_inicial: 'Relación entre ángulo inscrito y mitad del arco correspondiente:
  conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Un ángulo inscrito siempre mide exactamente la mitad del arco
  que abarca (el arco que no contiene a su vértice).
explicacion_formal: '![Ángulo inscrito igual a la mitad del arco](/static/img/geometria/circunferencia-circulo/circulo-angulo-inscrito-mitad-arco.svg)


  ### Definición formal


  Si $\angle ACB$ es un ángulo inscrito que subtiende el arco $AB$, entonces $m(\angle
  ACB)=\frac{m(\text{arco }AB)}{2}$. Esto equivale a decir que el ángulo inscrito
  mide la mitad del ángulo del centro que subtiende el mismo arco.


  ### Desarrollo didáctico


  Si el arco $AB$ mide 80° (y por lo tanto el ángulo del centro $\angle AOB$ también
  mide 80°), el ángulo inscrito $\angle ACB$ que subtiende ese mismo arco mide $\frac{80°}{2}=40°$,
  es decir, la mitad.'
definiciones_clave: '- **Relación entre ángulo inscrito y mitad del arco correspondiente**:
