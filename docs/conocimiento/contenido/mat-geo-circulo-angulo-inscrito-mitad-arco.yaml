ejemplo_guiado:
  enunciado: Para analizar relación entre ángulo inscrito y mitad del arco correspondiente,
    considera un ángulo $\alpha = 133^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1046^\circ = 133^\circ$.
  pasos:
  - Identificar la propiedad de relación entre ángulo inscrito y mitad del arco correspondiente
    referida a $\alpha = 133^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1046 = 133 \implies x = 133 - 1046$.'
  - Concluir que la medida calculada para relación entre ángulo inscrito y mitad del
    arco correspondiente es $x = -913^\circ$.
