procedimiento:
- 'Paso 1: Verifica que el vértice del ángulo sea el punto de tangencia entre una
  recta y la circunferencia.'
- 'Paso 2: Identifica los dos lados: la recta tangente y la cuerda que parte del mismo
  punto.'
- 'Paso 3: Reconoce el arco subtendido: el arco comprendido dentro de la abertura
  del ángulo.'
