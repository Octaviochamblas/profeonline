- titulo: ¿Se cumple siempre la propiedad principal de definición de ángulo semiinscrito
    formado por una tangente y una cuerda en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede definición de ángulo semiinscrito formado por una tangente y una
    cuerda asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
