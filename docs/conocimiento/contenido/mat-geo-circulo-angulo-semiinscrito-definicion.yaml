semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_SEMIINSCRITO_DEFINICION
resumen_inicial: 'Definición de ángulo semiinscrito formado por una tangente y una
  cuerda: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia
  y Círculo.'
explicacion_simple: Cuando una recta tangente a una circunferencia y una cuerda se
  encuentran en el punto de tangencia, forman un ángulo especial llamado ángulo semiinscrito.
explicacion_formal: '![Ángulo semiinscrito (tangente y cuerda)](/static/img/geometria/circunferencia-circulo/circulo-angulo-semiinscrito-definicion.svg)


  ### Definición formal


  Un ángulo semiinscrito tiene su vértice en el punto de tangencia $T$ entre una recta
  tangente y la circunferencia, y sus lados son la recta tangente y una cuerda $TB$
  que parte del mismo punto $T$. El arco $TB$ comprendido dentro del ángulo se llama
  arco subtendido.


  ### Desarrollo didáctico


  En la figura, la recta vertical es tangente a la circunferencia en $T$, y $TB$ es
  una cuerda. El ángulo formado entre la tangente y la cuerda $TB$ es un ángulo semiinscrito,
  a medio camino conceptual entre el ángulo del centro y el ángulo inscrito.'
definiciones_clave: '- **Definición de ángulo semiinscrito formado por una tangente
