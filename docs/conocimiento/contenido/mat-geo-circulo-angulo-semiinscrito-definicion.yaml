  por una tangente y una cuerda.'
ejemplo_guiado:
  enunciado: Para analizar definición de ángulo semiinscrito formado por una tangente
    y una cuerda, considera un ángulo $\alpha = 154^\circ$ ubicado en la posición
    dada. Determina el valor de la medida asociada sabiendo que $x + 1049^\circ =
    154^\circ$.
  pasos:
  - Identificar la propiedad de definición de ángulo semiinscrito formado por una
    tangente y una cuerda referida a $\alpha = 154^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1049 = 154 \implies x = 154 - 1049$.'
  - Concluir que la medida calculada para definición de ángulo semiinscrito formado
    por una tangente y una cuerda es $x = -895^\circ$.
