semantic_id: MAT.ALG.EC_CUADR_BASE.COMPLETA
resumen_inicial: 'Una ecuación cuadrática es completa si sus tres coeficientes son estrictamente distintos de cero: $ax^2 + bx + c = 0$ con $a \neq 0$, $b \neq 0$ y $c \neq 0$.'
explicacion_simple: '![Una ecuación cuadrática es completa si sus tres coeficientes son estrictamente distintos de cero: $ax^2 + bx + c = 0$ con $a \neq 0$, $b \neq 0$ y $c \neq 0$](/static/img/nodos/identificacion-de-ecuaciones-cuadraticas-completas-intro.svg)



  Una ecuación cuadrática es **completa** cuando tiene su "familia al completo", es decir, posee los tres términos:

  1. **Término cuadrático:** con $x^2$ ($a \neq 0$).

  2. **Término lineal:** con $x$ ($b \neq 0$).

  3. **Término independiente:** número suelto ($c \neq 0$).


  Por ejemplo, $2x^2 - 5x + 3 = 0$ es completa porque $a = 2$, $b = -5$ y $c = 3$ (ninguno es cero).

  Para resolverlas se utiliza la fórmula general, completación de cuadrados o factorización de trinomios.'
explicacion_formal: "Una ecuación cuadrática $P(x) = 0$ se clasifica como **completa** si y solo si su polinomio asociado es un trinomio cuadrático estricto:\n$$ax^2 + bx + c = 0 \\quad \\Longleftrightarrow \\quad a \\cdot b \\cdot c \\neq 0$$\n\n**Características operacionales de las completas:**\n- **No admite factor común simple directo con $x$**: Debido a que $c \\neq 0$, $x = 0$ nunca es solución ($P(0) = c \\neq 0$).\n- **No admite despeje directo por raíz cuadrada simple**: Debido a que $b \\neq 0$, la variable $x$ aparece en dos potencias distintas no desacoplables directamente sin completación de cuadrados.\n- **Métodos canónicos de resolución**:\n  1. Factorización de trinomios ($x^2 + px + q$ o $ax^2 + bx + c$).\n  2. Completación del trinomio cuadrado perfecto.\n  3. Fórmula resolvente cuadrática universal: $x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$."
definiciones_clave: '- **Ecuación cuadrática completa**: Ecuación donde coexisten simultáneamente los tres términos no nulos ($a, b, c \neq 0$).

  - **Trinomio de segundo grado**: Expresión polinómica compuesta por tres monomios de grados 2, 1 y 0.'
propiedades_relaciones: '- **Discriminante trinomio**: El discriminante $\Delta = b^2 - 4ac$ depende de los tres coeficientes y define la naturaleza de las dos raíces.

  - **Vértice fuera del eje Y**: Como $b \neq 0$, el eje de simetría $x_v = -\frac{b}{2a} \neq 0$, por lo que la parábola nunca tiene su vértice sobre el eje $Y$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una ecuación cuadrática es completa si sus tres coeficientes son estrictamente distintos de cero: $ax^2 + bx + c = 0$ con $a \neq 0$, $b \neq 0$ y $c \neq 0$](/static/img/nodos/identificacion-de-ecuaciones-cuadraticas-completas-ejemplos.svg)



    Clasifica la ecuación $3x(x - 2) = 5 - 4x$ determinando si es completa tras reducirla a la forma canónica.'
  pasos:
  - 'Paso 1: Desarrollar el producto: $3x^2 - 6x = 5 - 4x$.'
  - 'Paso 2: Transponer todos los términos al miembro izquierdo: $3x^2 - 6x + 4x - 5 = 0$.'
  - 'Paso 3: Reducir términos semejantes: $3x^2 - 2x - 5 = 0$.'
  - 'Paso 4: Extraer la terna de coeficientes: $a = 3 \neq 0$, $b = -2 \neq 0$, $c = -5 \neq 0$.'
  - 'Paso 5: Concluir que al ser los tres coeficientes distintos de cero, es una ecuación cuadrática completa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes ecuaciones es una ecuación cuadrática completa?
  choices:
  - text: 2x^2 - 3x + 1 = 0
    is_correct: true
  - text: 5x^2 - 20 = 0
    is_correct: false
  - text: 4x^2 + 8x = 0
    is_correct: false
  - text: 7x^2 = 0
    is_correct: false
  explanation: La alternativa correcta es '2x^2 - 3x + 1 = 0'. Posee $a = 2, b = -3, c = 1$, todos distintos de cero.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Puede el número x = 0 ser solución de una ecuación cuadrática completa $ax^2 + bx + c = 0$?
  choices:
  - text: No, porque al ser c != 0, al evaluar en 0 queda c = 0, lo cual es falso.
    is_correct: true
  - text: Si, siempre es solucion de cualquier ecuacion.
    is_correct: false
  - text: Solo si el discriminante es positivo.
    is_correct: false
  - text: Solo si a = 1.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque al ser c != 0, al evaluar en 0 queda c = 0, lo cual es falso.'. En una completa $c \neq 0$, por lo que $P(0) = c \neq 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Llevar la ecuación a su forma canónica $ax^2 + bx + c = 0$.'
- 'Paso 2: Identificar los tres coeficientes $a$, $b$ y $c$.'
- 'Paso 3: Verificar si $a \neq 0$, $b \neq 0$ y $c \neq 0$.'
- 'Paso 4: Si ninguno de los tres es cero, clasificar formalmente como ecuación cuadrática completa.'
errores_correccion: '- **Error común:** Clasificar una ecuación como completa mirando una forma no reducida como $x^2 + 3x - 5 = 3x$ (donde $3x$ se cancela).

  - **Cómo corregirlo:** Reduce siempre la ecuación primero ($x^2 - 5 = 0$), lo que revela que **$b = 0$ (es incompleta pura)**.'
ejemplos:
- titulo: 'Ejemplo 1: Trinomio canónico'
  enunciado: ¿Es completa la ecuación $x^2 - 7x + 10 = 0$?
  alternativas:
  - Sí, porque a = 1, b = -7 y c = 10 (ninguno es cero)
  - No, porque a = 1
  - Es incompleta pura
  - Es incompleta binomia
  respuesta: Sí, porque a = 1, b = -7 y c = 10 (ninguno es cero)
  solucion_pasos:
  - 'Paso 1: Posee los tres coeficientes no nulos, es completa.'
- titulo: 'Ejemplo 2: Cancelación lineal tras reducción'
  enunciado: Al reducir $2x^2 + 4x - 8 = 4x$, ¿es completa?
  alternativas:
  - No, porque al cancelarse 4x queda 2x^2 - 8 = 0 con b = 0
  - Sí, porque tenía 4x originalmente
  - Es de grado 1
  - Es monomia
  respuesta: No, porque al cancelarse 4x queda 2x^2 - 8 = 0 con b = 0
  solucion_pasos:
  - 'Paso 1: $2x^2 - 8 = 0$ tiene $b = 0$, es incompleta pura.'
- titulo: 'Ejemplo 3: Coeficientes negativos'
  enunciado: En $-3x^2 - 2x - 1 = 0$, ¿es completa?
  alternativas:
  - Sí, los tres coeficientes son no nulos (-3, -2, -1)
  - No, porque son negativos
  - Es incompleta
  - No es cuadrática
  respuesta: Sí, los tres coeficientes son no nulos (-3, -2, -1)
  solucion_pasos:
  - 'Paso 1: El signo no afecta la cualidad de completa mientras sean $\neq 0$.'
- titulo: 'Ejemplo 4: Fraccionaria completa'
  enunciado: La ecuación $\frac{1}{2}x^2 - \frac{3}{4}x + \frac{5}{8} = 0$, ¿qué tipo es?
  alternativas:
  - Ecuación cuadrática completa
  - Ecuación incompleta binomia
  - Ecuación incompleta pura
  - Ecuación racional
  respuesta: Ecuación cuadrática completa
  solucion_pasos:
  - 'Paso 1: Todos los coeficientes son números reales no nulos.'
errores_frecuentes:
- Juzgar si una ecuación es completa sin antes reducir términos semejantes.
- Creer que los coeficientes deben ser positivos para que sea completa.
- Confundir ecuaciones completas con ecuaciones factorizadas.
afirmaciones_verdaderas:
- Una ecuación cuadrática es completa si y solo si a, b y c son todos distintos de cero.
- En toda ecuación cuadrática completa, el número 0 no es solución.
al_terminar_debes_poder: '**QUÉ:** Identificar y clasificar ecuaciones cuadráticas completas.


  **CÓMO:** Reduciendo a la forma canónica y verificando la condición de no nulidad simultánea a · b · c ≠ 0.


  ![Resumen Una ecuación cuadrática es completa si sus tres coeficientes son estrictamente distintos de cero: $ax^2 + bx + c = 0$ con $a \neq 0$, $b \neq 0$ y $c \neq 0$](/static/img/nodos/identificacion-de-ecuaciones-cuadraticas-completas-resumen.svg)'
