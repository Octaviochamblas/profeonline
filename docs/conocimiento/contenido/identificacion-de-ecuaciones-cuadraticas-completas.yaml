semantic_id: MAT.ALG.EC_CUADR_BASE.COMPLETA
resumen_inicial: Una ecuación cuadrática es completa si sus tres coeficientes $a$, $b$ y $c$ son estrictamente distintos de cero.
explicacion_simple: |
  Una **ecuación cuadrática completa** es aquella que tiene **sus tres términos visibles**:

  $$ax^2 + bx + c = 0 \quad \text{con } a \neq 0, \ b \neq 0 \text{ y } c \neq 0$$

  - **Ejemplo**: $2x^2 - 7x + 3 = 0$.
    - Coeficiente cuadrático: $a = 2 \neq 0$.
    - Coeficiente lineal: $b = -7 \neq 0$.
    - Término independiente: $c = 3 \neq 0$.
  - Como ninguno de los tres coeficientes vale cero, la ecuación se clasifica como **COMPLETA**.
explicacion_formal: |
  Dada la ecuación de segundo grado en forma canónica $ax^2 + bx + c = 0$ con $a \in \mathbb{R} \setminus \{0\}$, se define como **ecuación cuadrática completa** a la expresión cuyo vector de coeficientes $(a, b, c) \in \mathbb{R}^3$ satisface la condición de no nula presencia:

  $$a \neq 0 \ \land \ b \neq 0 \ \land \ c \neq 0$$

  **Métodos de resolución típicos:**
  Para resolver ecuaciones completas se suelen emplear la factorización por trinomios, el método de completar el cuadrado o la fórmula general de segundo grado.
definiciones_clave: |
  - **Ecuación cuadrática completa**: Expresión de segundo grado donde el coeficiente cuadrático, el coeficiente lineal y el término independiente son simultáneamente no nulos.
propiedades_relaciones: |
  - **Parábola asociada no centrada en $Y$ ni en el origen**: La función cuadrática asociada a una ecuación completa posee un vértice que no se encuentra sobre el eje $Y$ ni coincide con el origen cartesiano.
ejemplo_guiado:
  enunciado: 'Clasifica si la ecuación $4x^2 = 5x - 2$ es completa o incompleta tras reducirla a la forma general.'
  pasos:
    - 'Paso 1: Transponer todos los términos al lado izquierdo: $4x^2 - 5x + 2 = 0$.'
    - 'Paso 2: Identificar los coeficientes: $a = 4$, $b = -5$, $c = 2$.'
    - 'Paso 3: Verificar la condición de no nulidad: $a = 4 \neq 0$, $b = -5 \neq 0$, $c = 2 \neq 0$.'
    - 'Paso 4: Concluir que al ser los tres coeficientes distintos de cero, la ecuación es COMPLETA.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición deben cumplir los coeficientes $a$, $b$ y $c$ para que una ecuación cuadrática sea COMPLETA?'
    choices:
      - {text: 'Los tres coeficientes deben ser estrictamente distintos de cero ($a \neq 0$, $b \neq 0$, $c \neq 0$).', is_correct: true}
      - {text: 'El término independiente $c$ debe ser cero.', is_correct: false}
      - {text: 'El coeficiente lineal $b$ debe ser igual a cero.', is_correct: false}
      - {text: 'Los tres coeficientes deben ser números positivos.', is_correct: false}
    explanation: 'La alternativa correcta es ''Los tres coeficientes deben ser estrictamente distintos de cero ($a \neq 0$, $b \neq 0$, $c \neq 0$).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes ecuaciones es una ecuación cuadrática COMPLETA?'
    choices:
      - {text: '$3x^2 - 2x + 7 = 0$', is_correct: true}
      - {text: '$3x^2 - 2x = 0$', is_correct: false}
      - {text: '$3x^2 + 7 = 0$', is_correct: false}
      - {text: '$3x^2 = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$3x^2 - 2x + 7 = 0$''. Posee los tres términos no nulos ($a=3$, $b=-2$, $c=7$).'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Transponer y reducir la ecuación a la forma general $ax^2 + bx + c = 0$.'
  - 'Paso 2: Extraer los valores numéricos de los tres coeficientes $a$, $b$ y $c$.'
  - 'Paso 3: Comprobar que $a \neq 0$, $b \neq 0$ y $c \neq 0$.'
  - 'Paso 4: Clasificar formalmente la ecuación como una ecuación cuadrática completa.'
errores_correccion: |
  - **Error común:** Clasificar una ecuación como incompleta mirando la forma desordenada antes de transponer los términos.
  - **Cómo corregirlo:** Ordena e iguala a cero la ecuación ($ax^2 + bx + c = 0$) antes de evaluar si falta algún coeficiente.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Identificación de ecuación completa.
    alternativas:
      - '$x^2 - 5x + 6 = 0$'
      - '$x^2 - 5x = 0$'
      - '$x^2 + 6 = 0$'
    respuesta: '$x^2 - 5x + 6 = 0$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Clasificación tras reducción.
    alternativas:
      - '$2x^2 + 3x - 1 = 0$'
      - '$2x^2 + 3x = 0$'
      - '$2x^2 = 0$'
    respuesta: '$2x^2 + 3x - 1 = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La expresión $x^2 - 4x = 0$ es una ecuación cuadrática completa porque contiene dos términos algebraicos.'
  - 'Una ecuación cuadrática completa exige que todos sus coeficientes sean números enteros positivos.'
  - 'Si el término independiente $c$ es negativo ($c = -5$), la ecuación pierde su carácter de completa.'
  - 'Una ecuación de segundo grado completa no puede resolverse utilizando la fórmula general.'
  - 'La ecuación $0x^2 + 3x + 2 = 0$ es una ecuación cuadrática completa con $a = 0$.'
afirmaciones_verdaderas:
  - 'Una ecuación cuadrática es completa si y solo si posee término cuadrático, término lineal y término independiente no nulos.'
  - 'La forma general de una ecuación completa $ax^2 + bx + c = 0$ presenta $a \neq 0$, $b \neq 0$ y $c \neq 0$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y clasificar ecuaciones cuadráticas completas.
  CÓMO: Llevar la ecuación a la forma general y verificar que sus tres coeficientes $a$, $b$ y $c$ sean distintos de cero.
