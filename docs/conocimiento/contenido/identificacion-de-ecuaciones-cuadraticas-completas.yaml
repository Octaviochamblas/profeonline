semantic_id: MAT.ALG.EC_CUADR_BASE.COMPLETA
resumen_inicial: Una ecuación cuadrática es completa si sus tres coeficientes son
  distintos de cero ($a \neq 0$, $b \neq 0$ y $c \neq 0$).
explicacion_simple: 'Una **ecuación cuadrática completa** posee todos sus términos
  visibles:

  - Tiene término cuadrático ($a x^2$).

  - Tiene término lineal ($b x$).

  - Tiene término independiente ($c$).

  - Ninguno de sus coeficientes es cero ($a \neq 0$, $b \neq 0$, $c \neq 0$).

  - Ejemplo: $2x^2 - 7x + 3 = 0$.'
explicacion_formal: 'Dada la forma canónica $a x^2 + b x + c = 0$, la ecuación es
  **completa** si y solo si sus tres coeficientes pertenecen al conjunto no nulo:


  $$a, b, c \in \mathbb{R} \setminus \{0\} \iff a \cdot b \cdot c \neq 0$$


  **Desglose de la fórmula:**

  - Condición de producto no nulo: la multiplicación de los tres coeficientes $a \cdot
  b \cdot c$ resulta distinta de cero.'
definiciones_clave: '- **Ecuación cuadrática completa**: Ecuación de segundo grado
  de la forma $a x^2 + b x + c = 0$ con $a \neq 0$, $b \neq 0$ y $c \neq 0$.'
propiedades_relaciones: '- **Resolución general**: Las ecuaciones completas se resuelven
  habitualmente mediante factorización de trinomios, completación de cuadrados o fórmula
  general.'
ejemplo_guiado:
  enunciado: Determina si la ecuación $3x^2 + 5x = 4$ es completa identificando sus
    tres coeficientes.
  pasos:
  - 'Paso 1: Trasponer el 4 para escribir en forma general: $3x^2 + 5x - 4 = 0$.Paso
    2: Extraer los coeficientes: $a = 3$, $b = 5$, $c = -4$.Paso 3: Comprobar la no
    anulación: $3 \neq 0$, $5 \neq 0$ y $-4 \neq 0$.Paso 4: Concluir que al tener
    sus tres coeficientes distintos de cero, es una ECUACIÓN COMPLETA.'
checkpoints:
- placement: after_explicacion_formal
  question: Al analizar la ecuación $3x^2 + 5x - 4 = 0$, ¿por qué se clasifica como
    una ecuación cuadrática completa?
  choices:
  - text: Porque sus tres coeficientes ($a = 3$, $b = 5$, $c = -4$) son distintos
      de cero.
    is_correct: true
  - text: Porque no tiene números negativos.
    is_correct: false
  - text: Porque está igualada a cero.
    is_correct: false
  - text: Porque es una función afín.
    is_correct: false
  explanation: La alternativa correcta es 'Porque sus tres coeficientes ($a = 3$,
    $b = 5$, $c = -4$) son distintos de cero.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál de las siguientes ecuaciones es un ejemplo de ecuación cuadrática
    completa?
  choices:
  - text: $x^2 - 3x + 2 = 0$
    is_correct: true
  - text: $x^2 - 9 = 0$
    is_correct: false
  - text: $4x^2 + 5x = 0$
    is_correct: false
  - text: $7x^2 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$x^2 - 3x + 2 = 0$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la ecuación en la forma general $a x^2 + b x + c = 0$.'
- 'Paso 2: Identificar los coeficientes numéricos $a$, $b$ y $c$.'
- 'Paso 3: Verificar que ninguno de los tres coeficientes sea igual a cero.'
- 'Paso 4: Declarar que la ecuación es completa.'
errores_correccion: '- **Error común:** Clasificar $3x^2 + 5x = 4$ como incompleta
  por tener el 4 al lado derecho.

  - **Cómo corregirlo:** Primero debes trasponer todos los términos e igualar a cero
  para evaluar la presencia de los tres coeficientes.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Segundo Grado
