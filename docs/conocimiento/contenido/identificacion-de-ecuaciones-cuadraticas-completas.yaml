semantic_id: MAT.ALG.EC_CUADR_BASE.COMPLETA
resumen_inicial: 'Identificación de ecuaciones cuadráticas completas: concepto, discriminante,
  soluciones y modelamiento en Conceptos y formas de la ecuación cuadrática.'
explicacion_simple: Cuando una ecuación cuadrática tiene presentes sus tres términos
  —cuadrático, lineal e independiente—, con ninguno de ellos ausente, se dice que
  está completa.
explicacion_formal: '### Definición formal


  Una ecuación de segundo grado $ax^2+bx+c=0$ es completa si $a \neq 0$, $b \neq 0$
  y $c \neq 0$ simultáneamente. Si al menos uno de $b$ o $c$ es igual a cero, la ecuación
  se clasifica como incompleta.


  ### Desarrollo didáctico


  Para clasificar una ecuación como completa, basta con revisar que, en su forma general
  ya ordenada, ningún coeficiente ($a$, $b$ o $c$) sea cero.


  La ecuación $2x^2-5x+3=0$ es completa: $a=2$, $b=-5$ y $c=3$, todos distintos de
  cero.'
definiciones_clave: '- **Identificación de ecuaciones cuadráticas completas**: Elemento
  o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en identificación
  de ecuaciones cuadráticas completas.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando identificación de
    ecuaciones cuadráticas completas.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a identificación de ecuaciones
    cuadráticas completas.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
