procedimiento:
- 'Paso 1: Escribe la ecuación en su forma general $ax^2+bx+c=0$.'
- 'Paso 2: Identifica los valores de $a$, $b$ y $c$.'
- 'Paso 3: Si ninguno de los tres es cero, la ecuación es completa.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en identificación de ecuaciones cuadráticas completas.
ejemplos:
- titulo: Reconocimiento de ecuación completa
  enunciado: ¿Es $4x^2+7x-2=0$ una ecuación cuadrática completa?
  solucion_pasos:
  - $a=4$, $b=7$, $c=-2$, ninguno es cero.
  - Sí, es completa.
- titulo: Reconocimiento de ecuación no completa
  enunciado: ¿Es $3x^2-9=0$ una ecuación cuadrática completa?
  solucion_pasos:
  - $a=3$, $b=0$, $c=-9$.
  - No es completa, porque $b=0$.
- titulo: ¿Una ecuación completa puede tener coeficientes negativos?
  enunciado: ¿Una ecuación completa puede tener coeficientes negativos?
  respuesta: Sí
  solucion_pasos:
  - Solo se exige que ningún coeficiente sea cero; el signo de cada uno no afecta
    la clasificación.
- titulo: ¿Basta con que $a$ y $b$ sean distintos de cero para que la ecuación sea
    completa?
  enunciado: ¿Basta con que $a$ y $b$ sean distintos de cero para que la ecuación
    sea completa?
  respuesta: 'No'
  solucion_pasos:
  - También se exige que $c$ sea distinto de cero; si falta cualquiera de los tres,
    la ecuación es incompleta.
errores_frecuentes:
- Clasificar una ecuación como completa sin verificar todos los coeficientes, especialmente
  $c$.
- Confundir "completa" con "tiene solución"; ambos conceptos son independientes.
- No normalizar la ecuación antes de revisar si algún coeficiente es cero.
- Suponer que una ecuación con muchos términos escritos es automáticamente completa,
  sin reducir primero términos semejantes que podrían cancelarse.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_ponder: Resolver y analizar ecuaciones cuadráticas utilizando identificación
  de ecuaciones cuadráticas completas.
