semantic_id: MAT.ALG.FUNC_CUADR_BASE.DEFINICION
resumen_inicial: Una función cuadrática es una regla de correspondencia polinómica de segundo grado expresada como $f(x) = ax^2 + bx + c$ con $a \neq 0$.
explicacion_simple: |
  Una **función cuadrática** es una relación matemática donde la variable independiente $x$ está elevada al exponente $2$ como su máxima potencia:

  $$f(x) = ax^2 + bx + c$$

  - La variable $x$ entra en la máquina y sale el valor $f(x)$ o $y$.
  - **Ejemplo**: Si $f(x) = 2x^2 - 3x + 1$:
    - Para $x = 2 \implies f(2) = 2(2)^2 - 3(2) + 1 = 8 - 6 + 1 = 3$.
  - La única regla obligatoria es que la letra $a$ **NO PUEDE SER CERO** ($a \neq 0$), porque si $a = 0$, el término $x^2$ desaparece y deja de ser cuadrática.
explicacion_formal: |
  Sea $\mathbb{R}$ el cuerpo de los números reales. Una **función cuadrática real** es una aplicación $f: \mathbb{R} \to \mathbb{R}$ definida por un polinomio de segundo grado de la forma:

  $$f(x) = ax^2 + bx + c \quad \text{con } a, b, c \in \mathbb{R} \ \text{y } a \neq 0$$

  **Componentes algebraicos:**
  - $a \in \mathbb{R} \setminus \{0\}$: Coeficiente principal o cuadrático.
  - $b \in \mathbb{R}$: Coeficiente del término lineal.
  - $c \in \mathbb{R}$: Coeficiente constante o término independiente.
definiciones_clave: |
  - **Función cuadrática**: Regla polinómica de segundo grado cuyo gráfico en el plano cartesiano $\mathbb{R}^2$ corresponde a una curva simétrica llamada parábola.
propiedades_relaciones: |
  - **Continua y derivable**: Toda función cuadrática $f(x) = ax^2 + bx + c$ es continua y infinitamente derivable en todo su dominio $\mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Dada la función cuadrática $f(x) = 3x^2 - 4x + 5$, calcula el valor de la imagen para $x = -1$.'
  pasos:
    - 'Paso 1: Identificar la expresión funcional $f(x) = 3x^2 - 4x + 5$.'
    - 'Paso 2: Sustituir la variable $x$ por $-1$ usando paréntesis: $f(-1) = 3(-1)^2 - 4(-1) + 5$.'
    - 'Paso 3: Evaluar las potencias primero: $3(1) - 4(-1) + 5 = 3 + 4 + 5$.'
    - 'Paso 4: Sumar los términos para obtener la imagen final: $f(-1) = 12$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la condición fundamental que deben cumplir los coeficientes para que $f(x) = ax^2 + bx + c$ sea una función cuadrática?'
    choices:
      - {text: 'El coeficiente cuadrático $a$ debe ser distinto de cero ($a \neq 0$).', is_correct: true}
      - {text: 'El término independiente $c$ debe ser mayor que cero.', is_correct: false}
      - {text: 'El coeficiente lineal $b$ debe ser igual a 1.', is_correct: false}
      - {text: 'Todos los coeficientes deben ser números pares.', is_correct: false}
    explanation: 'La alternativa correcta es ''El coeficiente cuadrático $a$ debe ser distinto de cero ($a \neq 0$).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la imagen $f(2)$ de la función cuadrática $f(x) = x^2 - 5x + 6$?'
    choices:
      - {text: '$f(2) = 0$', is_correct: true}
      - {text: '$f(2) = 2$', is_correct: false}
      - {text: '$f(2) = 20$', is_correct: false}
      - {text: '$f(2) = -4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(2) = 0$''. Reemplazando $f(2) = 2^2 - 5(2) + 6 = 4 - 10 + 6 = 0$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Verificar que la regla de correspondencia contenga el término $x^2$ como máxima potencia.'
  - 'Paso 2: Identificar el valor numérico de los coeficientes $a$, $b$ y $c$.'
  - 'Paso 3: Confirmar la restricción $a \neq 0$.'
  - 'Paso 4: Evaluar imágenes $f(x_0)$ reemplazando el valor de entrada en cada ocurrencia de $x$.'
errores_correccion: |
  - **Error común:** Confundir la función cuadrática $f(x) = ax^2 + bx + c$ con una ecuación cuadrática $ax^2 + bx + c = 0$.
  - **Cómo corregirlo:** La función asigna imágenes $y = f(x)$ para **TODO EL DOMINIO $x \in \mathbb{R}$**; la ecuación busca valores específicos donde $f(x) = 0$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Evaluación con x negativo.
    alternativas:
      - '$f(-2) = 13$'
      - '$f(-2) = 1$'
      - '$f(-2) = 5$'
    respuesta: '$f(-2) = 13$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Función cuadrática pura.
    alternativas:
      - '$f(3) = 18$'
      - '$f(3) = 36$'
      - '$f(3) = 0$'
    respuesta: '$f(3) = 18$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 0x^2 + 4x + 1$, es correcto afirmar que corresponde a una función cuadrática válida.'
  - 'La expresión $f(x) = x^3 - x^2 + 2$ define una función de segundo grado por contener el término $x^2$.'
  - 'Evaluar $f(-3)$ en $f(x) = x^2$ produce el resultado numérico negativo $-9$.'
  - 'Una función cuadrática sólo existe si el término independiente $c$ es diferente de cero.'
  - 'La función cuadrática asigna a cada valor del dominio $x$ exactamente dos valores de imagen en el recorrido.'
afirmaciones_verdaderas:
  - 'Una función cuadrática se expresa como $f(x) = ax^2 + bx + c$ con la condición necesaria y suficiente de que $a \neq 0$.'
  - 'La evaluación funcional $f(x_0)$ reemplaza $x_0$ entre paréntesis respetando la prioridad de la potencia de exponente 2.'
al_terminar_debes_poder: |
  QUÉ: Definir y evaluar expresiones funcionales cuadráticas $f(x) = ax^2 + bx + c$.
  CÓMO: Identificar $a \neq 0$, aplicar notación funcional y calcular imágenes $f(x_0)$ respetando la jerarquía de operaciones.
