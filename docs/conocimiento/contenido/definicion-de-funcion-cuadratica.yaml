  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observa la regla de la función y ordénala si es necesario.'
- 'Paso 2: Identifica el mayor exponente presente en la variable $x$.'
- 'Paso 3: Si ese mayor exponente es 2, con coeficiente distinto de cero, la función
  es cuadrática.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en definición de función cuadrática.
ejemplos:
- titulo: Reconocimiento de una función cuadrática
  enunciado: ¿Es $f(x)=-3x^2+4$ una función cuadrática?
  solucion_pasos:
  - El mayor exponente de $x$ presente es 2, con coeficiente $-3 \neq 0$.
  - Sí, es una función cuadrática.
- titulo: Reconocimiento de una función que no es cuadrática
  enunciado: ¿Es $g(x)=7x+2$ una función cuadrática?
  solucion_pasos:
  - No hay ningún término con $x^2$ en la regla.
  - No, es una función afín (de primer grado).
- titulo: ¿Toda función con un término $x^2$ visible es necesariamente cuadrática?
  enunciado: ¿Toda función con un término $x^2$ visible es necesariamente cuadrática?
  respuesta: 'No'
  solucion_pasos:
  - Solo lo es si el coeficiente de $x^2$ es distinto de cero tras simplificar la
    regla completa.
- titulo: ¿Una función cuadrática puede tener término lineal igual a cero?
  enunciado: ¿Una función cuadrática puede tener término lineal igual a cero?
  respuesta: Sí
  solucion_pasos:
  - Basta con que el coeficiente $a$ del término cuadrático sea distinto de cero;
    el coeficiente $b$ puede ser cero.
errores_frecuentes:
- Clasificar como cuadrática una función donde el término $x^2$ se cancela al simplificar,
  quedando coeficiente cero.
- Confundir una función cuadrática con una ecuación cuadrática, que son objetos matemáticos
  distintos.
- No ordenar la regla de la función antes de identificar el mayor exponente presente.
- Creer que una función cuadrática necesariamente tiene los tres términos ($x^2$,
  $x$ y constante).
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  definición de función cuadrática.
