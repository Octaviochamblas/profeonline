semantic_id: MAT.ALG.FUNC_CUADR_BASE.DEFINICION
resumen_inicial: 'Una función cuadrática es una relación funcional donde la variable independiente tiene exponente 2 como mayor grado, generando una curva simétrica llamada parábola.'
explicacion_simple: |
  Cuando la regla de asociación de una función incluye un término con la variable elevada al cuadrado ($x^2$) y este es el exponente más alto, la función deja de ser una recta y se convierte en una curva simétrica denominada parábola. Esta curva posee un punto extremo de inflexión llamado vértice y cambia la dirección de su crecimiento a ambos lados de dicho punto.
explicacion_formal: |
  ### Definición formal
  Una función $f: \mathbb{R} \to \mathbb{R}$ es una **función cuadrática** si se puede expresar de la forma:
  $$f(x) = ax^2 + bx + c$$
  donde $a, b, c \in \mathbb{R}$ son constantes reales conocidas como coeficientes, con la restricción fundamental $a \neq 0$.

  ### Desglose simbólico
  - $x$: Variable independiente o entrada de la función.
  - $f(x)$: Variable dependiente o valor de salida (habitualmente denotado por $y$).
  - $a$: Coeficiente cuadrático que multiplica a $x^2$. Su signo determina la concavidad de la parábola.
  - $b$: Coeficiente lineal que multiplica a $x$.
  - $c$: Término independiente o constante que indica la ordenada del punto de corte con el eje $y$.

  ### Síntesis didáctica
  La condición $a \neq 0$ asegura la existencia del término de segundo grado $x^2$, otorgando a la función su comportamiento no lineal y su simetría respecto a una recta vertical llamada eje de simetría.
definiciones_clave: |
  - **Función cuadrática**: Función polinomial de segundo grado de la forma $f(x) = ax^2 + bx + c$ con $a \neq 0$.
  - **Parábola**: Representación gráfica curva en el plano cartesiano de una función cuadrática.
  - **Vértice**: Punto extremo de la parábola donde alcanza su valor máximo o mínimo absoluto.
propiedades_relaciones: |
  - **Grado polinomial**: Su grado es exactamente 2. Si $a = 0$, la función se degrada a una función afín o lineal de primer grado.
  - **Simetría axial**: Toda parábola es simétrica respecto al eje vertical $x = -\frac{b}{2a}$.
ejemplo_guiado:
  enunciado: 'Dada la función $f(x) = 3x^2 - 12x + 5$, clasifica su tipo según el grado polinomial, identifica sus coeficientes $a$, $b$ y $c$, y calcula el valor de salida para la entrada $x = 2$.'
  pasos:
    - 'Paso 1: Observamos que el mayor exponente de la variable $x$ es 2 y su coeficiente es $3 \neq 0$, por lo que $f(x)$ es una función cuadrática de segundo grado.'
    - 'Paso 2: Comparamos $f(x) = 3x^2 - 12x + 5$ con la forma $ax^2 + bx + c$, obteniendo los coeficientes $a = 3$, $b = -12$ y $c = 5$.'
    - 'Paso 3: Sustituimos $x = 2$ en la regla funcional: $f(2) = 3(2)^2 - 12(2) + 5 = 3(4) - 24 + 5 = 12 - 24 + 5 = -7$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes condiciones es estrictamente necesaria para que una expresión $f(x) = ax^2 + bx + c$ defina una función cuadrática?'
    choices:
      - {text: '$a \neq 0$', is_correct: true}
      - {text: '$b \neq 0$', is_correct: false}
      - {text: '$c \neq 0$', is_correct: false}
      - {text: '$a > b > c$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a \neq 0$''. Si el coeficiente cuadrático $a$ fuera cero, el término $ax^2$ se anularía y la función pasaría a ser de primer grado.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar la función cuadrática $g(x) = -2x^2 + 5x - 1$ en $x = -1$, ¿cuál es el valor de $g(-1)$?'
    choices:
      - {text: '$-8$', is_correct: true}
      - {text: '$-2$', is_correct: false}
      - {text: '$2$', is_correct: false}
      - {text: '$6$', is_correct: false}
    explanation: 'La alternativa correcta es ''$-8$''. Calculamos $g(-1) = -2(-1)^2 + 5(-1) - 1 = -2(1) - 5 - 1 = -8$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Inspeccionar la regla de la función y simplificar términos semejantes si existieran.'
  - 'Paso 2: Verificar que el mayor exponente de la variable independiente sea exactamente 2.'
  - 'Paso 3: Confirmar que el coeficiente del término $x^2$ sea un número real distinto de cero ($a \neq 0$).'
errores_correccion: |
  - **Error 1:** Considerar que $h(x) = 0x^2 + 4x - 9$ es cuadrática porque incluye el símbolo $x^2$. **Cómo corregirlo:** Al multiplicar por 0, el término cuadrático desaparece ($0x^2 = 0$), resultando en $h(x) = 4x - 9$, que es una función afín.
  - **Error 2:** Confundir la función cuadrática $f(x) = ax^2 + bx + c$ con una ecuación cuadrática $ax^2 + bx + c = 0$. **Cómo corregirlo:** La función relaciona conjuntos numéricos mediante infinitos pares $(x, y)$, mientras que la ecuación es una igualdad fija que se satisface para valores puntuales de $x$.
ejemplos:
  - titulo: 'Reconocimiento de grado cuadrático'
    enunciado: '¿Cuál de las siguientes expresiones corresponde a una función cuadrática?'
    alternativas:
      - '$f(x) = 5 - 2x^2$'
      - '$g(x) = 3x + 1$'
      - '$h(x) = x^3 - 2x^2$'
    respuesta: '$f(x) = 5 - 2x^2$'
    solucion_pasos:
      - '1. En $g(x) = 3x + 1$, el mayor exponente es 1 (función afín).'
      - '2. En $h(x) = x^3 - 2x^2$, el mayor exponente es 3 (función cúbica).'
      - '3. En $f(x) = 5 - 2x^2$, el mayor exponente de $x$ es 2 y su coeficiente es $-2 \neq 0$. Por lo tanto, $f(x)$ es cuadrática.'
  - titulo: 'Identificación de coeficientes'
    enunciado: '¿Cuáles son los coeficientes $a$, $b$ y $c$ en la función cuadrática $f(x) = x^2 - 4x$?'
    alternativas:
      - '$a = 1$, $b = -4$, $c = 0$'
      - '$a = 1$, $b = 4$, $c = 0$'
      - '$a = 0$, $b = -4$, $c = 1$'
    respuesta: '$a = 1$, $b = -4$, $c = 0$'
    solucion_pasos:
      - '1. Reescribimos la función en forma general: $f(x) = 1x^2 + (-4)x + 0$.'
      - '2. Identificamos $a = 1$ (coeficiente de $x^2$), $b = -4$ (coeficiente de $x$) y $c = 0$ (término independiente).'
  - titulo: 'Forma curva de la gráfica'
    enunciado: '¿La gráfica de una función cuadrática $f(x) = ax^2 + bx + c$ con $a \neq 0$ es siempre una línea recta?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La presencia del término de segundo grado $ax^2$ genera una variación de tasa no constante, produciendo una gráfica curva llamada parábola.'
  - titulo: 'Existencia de término independiente'
    enunciado: '¿Una función cuadrática puede tener su término independiente $c$ igual a cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Si $c = 0$, la función toma la forma $f(x) = ax^2 + bx$, la cual sigue siendo cuadrática mientras se cumpla $a \neq 0$.'
errores_frecuentes:
  - 'El término $0x^2 + 3x + 2$ representa una función cuadrática de coeficiente $a = 0$.'
  - 'Toda expresión algebraica con exponentes mayores a 2 es una función cuadrática.'
  - 'Una función cuadrática requiere obligatoriamente que sus tres coeficientes $a$, $b$ y $c$ sean distintos de cero.'
  - 'El gráfico cartesiano de la función $f(x) = x^2$ es una recta diagonal a $45^\circ$.'
  - 'Las funciones cuadráticas y las ecuaciones cuadráticas son el mismo concepto matemático.'
afirmaciones_verdaderas:
  - 'El coeficiente principal $a$ en $f(x) = ax^2 + bx + c$ debe ser siempre distinto de cero en toda función cuadrática.'
  - 'La representación gráfica de cualquier función cuadrática en el plano real es una parábola.'
al_terminar_debes_poder: 'Identificar funciones cuadráticas mediante el grado de su regla algebraica y determinar con precisión sus coeficientes $a$, $b$ y $c$ en cualquier representación.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
