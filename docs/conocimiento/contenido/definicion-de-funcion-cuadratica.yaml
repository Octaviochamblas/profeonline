semantic_id: MAT.ALG.FUNC_CUADR_BASE.DEFINICION
resumen_inicial: Una función cuadrática es una función polinómica de segundo grado de la forma $f(x) = ax^2 + bx + c$, con coeficientes reales $a, b, c \in \mathbb{R}$ y $a \neq 0$, cuya representación gráfica en el plano cartesiano es una parábola.
explicacion_simple: '![Una función cuadrática es una función polinómica de segundo grado de la forma $f(x) = ax^2 + bx + c$, con coeficientes reales $a, b, c \in \mathbb{R}$ y $a \neq 0$, cuya representación gráfica en el plano cartesiano es una parábola](/static/img/nodos/definicion-de-funcion-cuadratica-intro.svg)



  Una **función cuadrática** es una máquina matemática donde el número que metes ($x$) se eleva al cuadrado:

  $$f(x) = ax^2 + bx + c$$


  - **¿Por qué se llama cuadrática?** Porque el exponente más grande de la $x$ es un **2** ($x^2$).

  - **¿Cómo se ve en el gráfico?** Siempre dibuja una curva suave en forma de U llamada **parábola** (puede abrir hacia arriba $\cup$ o hacia abajo $\cap$).

  - **Regla sagrada:** El número $a$ que acompaña a $x^2$ **NUNCA puede ser cero** (si $a = 0$, la $x^2$ desaparece y se convierte en una línea recta aburrida).'
explicacion_formal: 'Formalmente, una **función cuadrática real** es una aplicación $f: \mathbb{R} \to \mathbb{R}$ definida por un polinomio de grado 2:

  $$f(x) = ax^2 + bx + c, \quad a \in \mathbb{R} \setminus \{0\}, \; b, c \in \mathbb{R}$$


  **Propiedades analíticas fundamentales**:

  - **Grado polinomial estricto**: $\deg(f) = 2$.

  - **Lugar geométrico**: La gráfica $\text{Gr}(f) = \{(x, y) \in \mathbb{R}^2 \mid y = ax^2 + bx + c\}$ es una cónica parabólica con eje de simetría vertical paralelo al eje $Y$.

  - **Clase de regularidad**: $f \in C^\infty(\mathbb{R})$, siendo suave e infinitamente diferenciable.'
definiciones_clave: '- **Función cuadrática**: Función polinómica de segundo grado $f(x) = ax^2 + bx + c$ con $a \neq 0$.

  - **Parábola**: Curva abierta y simétrica resultante de graficar una función cuadrática en el plano cartesiano.'
propiedades_relaciones: '- **Diferencia entre función y ecuación**: $f(x) = ax^2 + bx + c$ es una regla de correspondencia que genera infinitos puntos $(x, y)$, mientras que $ax^2 + bx + c = 0$ es una ecuación que busca los ceros o cortes de la curva con el eje $X$.

  - **No linealidad**: Su tasa de cambio no es constante, exhibiendo derivadas lineales $f''(x) = 2ax + b$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una función cuadrática es una función polinómica de segundo grado de la forma $f(x) = ax^2 + bx + c$, con coeficientes reales $a, b, c \in \mathbb{R}$ y $a \neq 0$, cuya representación gráfica en el plano cartesiano es una parábola](/static/img/nodos/definicion-de-funcion-cuadratica-ejemplos.svg)



    Determina cuáles de las siguientes expresiones corresponden a funciones cuadráticas justificando con sus coeficientes:

    1) $f(x) = 4x^2 - 3x + 1$

    2) $g(x) = 2x - 7$

    3) $h(x) = (x + 3)^2 - x^2$'
  pasos:
  - 'Paso 1: Para $f(x) = 4x^2 - 3x + 1$: El término cuadrático tiene $a = 4 \neq 0$ y el grado es 2. **Sí es cuadrática**.'
  - 'Paso 2: Para $g(x) = 2x - 7$: Carece de término $x^2$ ($a = 0$); es de grado 1. **No es cuadrática** (es función afín).'
  - 'Paso 3: Para $h(x) = (x + 3)^2 - x^2$: Desarrollar algebraicamente:

    $h(x) = (x^2 + 6x + 9) - x^2 = 6x + 9$.

    - Como $x^2$ se cancela ($a = 0$), es de grado 1. **No es cuadrática**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes condiciones es estrictamente obligatoria para que f(x) sea una función cuadrática?
  choices:
  - text: El coeficiente cuadrático 'a' debe ser distinto de cero (a ≠ 0).
    is_correct: true
  - text: El término independiente 'c' debe ser distinto de cero.
    is_correct: false
  - text: El coeficiente lineal 'b' debe ser mayor que cero.
    is_correct: false
  - text: La función debe estar igualada a cero.
    is_correct: false
  explanation: La alternativa correcta es 'El coeficiente cuadrático 'a' debe ser distinto de cero (a ≠ 0).'. Si $a = 0$, la función degenera en grado 1.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al simplificar la función $f(x) = 2(x - 1)^2 - 2x^2 + 5$, ¿qué tipo de función se obtiene?
  choices:
  - text: Una función afín lineal (f(x) = -4x + 7), no es cuadrática.
    is_correct: true
  - text: Una función cuadrática con a = 2.
    is_correct: false
  - text: Una función constante f(x) = 5.
    is_correct: false
  - text: Una función cuadrática con a = -2.
    is_correct: false
  explanation: La alternativa correcta es 'Una función afín lineal (f(x) = -4x + 7), no es cuadrática.'. Al desarrollar $2(x^2 - 2x + 1) - 2x^2 + 5 = 2x^2 - 4x + 2 - 2x^2 + 5 = -4x + 7$, el término $x^2$ se cancela.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Expandir y simplificar completamente la expresión algebraica de la función.'
- 'Paso 2: Identificar el mayor exponente de la variable independiente $x$.'
- 'Paso 3: Constatar que el mayor exponente sea exactamente 2.'
- 'Paso 4: Verificar que el coeficiente principal $a$ que acompaña a $x^2$ sea distinto de cero ($a \neq 0$).'
- 'Paso 5: Concluir que la expresión define una función cuadrática.'
errores_correccion: '- **Error común:** Clasificar una función como cuadrática solo por ver un $(x+2)^2$ antes de simplificarla.

  - **Cómo corregirlo:** **Desarrolla y reduce términos semejantes siempre** para comprobar si el término $x^2$ sobrevive.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación canónica directa'
  enunciado: ¿Es $f(x) = -5x^2 + 8$ una función cuadrática?
  alternativas:
  - Sí, es cuadrática con a = -5, b = 0, c = 8
  - No, porque le falta el término bx
  - No, porque a es negativo
  - Es una función lineal
  respuesta: Sí, es cuadrática con a = -5, b = 0, c = 8
  solucion_pasos:
  - 'Paso 1: $a = -5 \neq 0$, exponente máximo 2 $\implies$ es cuadrática incompleta pura.'
- titulo: 'Ejemplo 2: Cancelación de término cuadrático'
  enunciado: En $g(x) = (x - 2)^2 - x^2 + 3x$, ¿qué grado tiene la función?
  alternativas:
  - Grado 1 (Función afín g(x) = -x + 4)
  - Grado 2 (Función cuadrática)
  - Grado 0 (Constante)
  - Grado 3
  respuesta: Grado 1 (Función afín g(x) = -x + 4)
  solucion_pasos:
  - 'Paso 1: $x^2 - 4x + 4 - x^2 + 3x = -x + 4 \implies$ grado 1.'
- titulo: 'Ejemplo 3: Función cuadrática monomia'
  enunciado: ¿Es $h(x) = \frac{1}{3}x^2$ una función cuadrática?
  alternativas:
  - Sí, con a = 1/3, b = 0, c = 0
  - No, porque no tiene 3 términos
  - No, porque a es una fracción
  - Es una función racional
  respuesta: Sí, con a = 1/3, b = 0, c = 0
  solucion_pasos:
  - 'Paso 1: $a = 1/3 \neq 0 \implies$ es cuadrática monomia.'
- titulo: 'Ejemplo 4: Grado superior no cuadrático'
  enunciado: ¿Es $f(x) = x^3 - 2x^2 + 1$ cuadrática?
  alternativas:
  - No, es cúbica (grado 3)
  - Sí, porque contiene x²
  - Sí, con a = -2
  - Es afín
  respuesta: No, es cúbica (grado 3)
  solucion_pasos:
  - 'Paso 1: El grado dominante es 3, por lo que no es cuadrática.'
errores_frecuentes:
- Confundir funciones cuadráticas con ecuaciones cuadráticas.
- Asumir que b y c no pueden ser 0.
- Olvidar simplificar expresiones con binomios restados.
afirmaciones_verdaderas:
- Una función cuadrática es una función polinómica de grado 2 donde a ≠ 0.
- La gráfica de toda función cuadrática en el plano cartesiano es una parábola.
al_terminar_debes_poder: '**QUÉ:** Definir y reconocer formalmente una función cuadrática real.


  **CÓMO:** Verificando que la expresión simplificada sea de grado 2 con coeficiente principal a ≠ 0.


