semantic_id: MAT.ALG.FUNC_CUADR_BASE.DEFINICION
resumen_inicial: 'Definición de función cuadrática: parábola, vértice, concavidad
  y formas de Definición y elementos básicos.'
explicacion_simple: Cuando la regla de una función involucra a la variable elevada
  al cuadrado como su mayor potencia, la función deja de ser una recta y se convierte
  en una curva con forma de parábola.
explicacion_formal: '### Definición formal


  Una función $f$ es cuadrática si puede expresarse como $f(x)=ax^2+bx+c$, donde $a,b,c
  \in \mathbb{R}$ y $a \neq 0$. El nombre "cuadrática" proviene de que el mayor exponente
  de $x$ presente en la regla es 2.


  ### Desarrollo didáctico


  Para reconocer una función cuadrática, basta con verificar que, tras simplificar
  su regla, aparezca un término con $x^2$ cuyo coeficiente sea distinto de cero.


  $f(x)=2x^2-3x+1$ es cuadrática, porque el mayor exponente de $x$ es 2 y su coeficiente
  ($2$) es distinto de cero. En cambio, $g(x)=5x-7$ es una función afín, no cuadrática,
  pues no tiene término en $x^2$.'
definiciones_clave: '- **Definición de función cuadrática**: Elemento o parámetro
  esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  definición de función cuadrática.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando definición
    de función cuadrática.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a definición
    de función cuadrática.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
