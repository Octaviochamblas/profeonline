semantic_id: MAT.FUND.OPERACIONES_CONJUNTOS.INTERSECCION
resumen_inicial: Definición, propiedades algebraicas, representación en diagrama de Venn y cálculo de la intersección de conjuntos ($A \cap B$).
explicacion_simple: '![Infografía: Definición formal y región central de la intersección](/static/img/nodos/interseccion-de-conjuntos-con-diagrama-de-venn-intro.svg)


  La **intersección de dos conjuntos** (escrita como **$A \cap B$**, con el símbolo de una "herradura" hacia abajo $\cap$) es la operación que selecciona **únicamente los elementos que están en AMBOS conjuntos al mismo tiempo** (conjunción lógica "y"). Si un elemento está solo en $A$ o solo en $B$, queda fuera de la intersección. Si no tienen ningún elemento común, la intersección es el **conjunto vacío ($\emptyset$)**. En un diagrama de Venn, la intersección se representa **sombreando únicamente la zona central donde los dos círculos se cruzan**.

  '
explicacion_formal: "### Definición formal\nEn la teoría axiomática de conjuntos ($\text{ZFC}$), la **intersección** de dos conjuntos $A$ y $B$ se define mediante el esquema de axiomas de separación:\n$$A \\cap B = \\{x \\in \\mathcal{U} \\mid x \\in A \\land x \\in B\\}$$\nPara una familia indexada de conjuntos $\\{A_i\\}_{i \\in I}$ (con $I \neq \\emptyset$):\n$$\\bigcap_{i \\in I} A_i = \\{x \\in \\mathcal{U} \\mid \\forall i \\in I \\, (x \\in A_i)\\}$$\n\n### Desglose simbólico\n- Conectivo lógico subyacente: Conjunción estricta ($\\land$).\n- Propiedades algebraicas (Álgebra de Boole):\n  - Conmutatividad: $A \\cap B = B \\cap A$.\n  - Asociatividad: $(A \\cap B) \\cap C = A \\cap (B \\cap C)$.\n  - Idempotencia: $A \\cap A = A$.\n  - Elemento absorbente: $A \\cap \\emptyset = \\emptyset$.\n  - Elemento neutro: $A \\cap \\mathcal{U} = A$.\n- Criterio de conjuntos disjuntos: $A \\cap B = \\emptyset$.\n\n> **Complemento didáctico:** La intersección es la mayor cota inferior (ínfimo) en\
  \ el retículo booleano: $(A \\cap B) \\subseteq A$ y $(A \\cap B) \\subseteq B$.\n"
definiciones_clave: '- **Intersección de conjuntos ($A \cap B$)**: Conjunto formado por los elementos compartidos simultáneamente por $A$ y $B$.

  - **Conjunción lógica ($\land$)**: Operador que exige la veracidad simultánea de ambas condiciones.

  - **Ínfimo conjuntista**: Máximo subconjunto común contenido simultáneamente en todos los operandos.

  '
propiedades_relaciones: '- **Distributividad con la unión**: $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$.

  - **Leyes de De Morgan**: $(A \cap B)^c = A^c \cup B^c$.

  '
ejemplo_guiado:
  enunciado: '![Diagrama: Intersección discreta y singulete de números primos y pares](/static/img/nodos/interseccion-de-conjuntos-con-diagrama-de-venn-ejemplos.svg)


    Dados los conjuntos $A = \{2, 4, 6, 8, 10\}$ y $B = \{4, 8, 12, 16\}$, determina $A \cap B$, calcula su cardinalidad y descríbelo en un diagrama de Venn.'
  pasos:
  - 'Paso 1: Examinar cada elemento de $A$ y comprobar si pertenece a $B$: - $2 \in A$, pero $2 \notin B$. - $4 \in A$ y $4 \in B$ (elemento común). - $6 \in A$, pero $6 \notin B$. - $8 \in A$ y $8 \in B$ (elemento común). - $10 \in A$, pero $10 \notin B$.'
  - 'Paso 2: Agrupar los elementos compartidos entre llaves: - $A \cap B = \{4, 8\}$.'
  - 'Paso 3: Calcular la cardinalidad: $|A \cap B| = 2$.'
  - 'Paso 4: En el diagrama de Venn, colocar $\{4, 8\}$ en la región central compartida.'
  - 'Paso 5: Sombrear únicamente dicha zona central para representar gráficamente la intersección.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué conectivo lógico rige la pertenencia de un elemento a la intersección $A \cap B$?
  choices:
  - text: 'La conjunción: $x \in A \land x \in B$'
    is_correct: true
  - text: 'La disyunción inclusiva: $x \in A \lor x \in B$'
    is_correct: false
  - text: 'El bicondicional: $x \in A \leftrightarrow x \in B$'
    is_correct: false
  - text: 'La disyunción exclusiva: $x \in A \oplus x \in B$'
    is_correct: false
  explanation: 'La alternativa correcta es ''La conjunción: $x \in A \land x \in B$''. Exige que el elemento pertenezca a ambos conjuntos simultáneamente.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $A = \{1, 3, 5\}$ y $B = \{2, 4, 6\}$, ¿cuál es el resultado de $A \cap B$?
  choices:
  - text: $\emptyset$ (conjunto vacío)
    is_correct: true
  - text: $\{1, 2, 3, 4, 5, 6\}$
    is_correct: false
  - text: $\{0\}$
    is_correct: false
  - text: $\mathcal{U}$
    is_correct: false
  explanation: La alternativa correcta es '$\emptyset$ (conjunto vacío)'. No comparten ningún elemento común, por lo que son conjuntos disjuntos.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los elementos de ambos conjuntos $A$ y $B$.'
- 'Paso 2: Comparar miembro a miembro y extraer exclusivamente los elementos repetidos o comunes.'
- 'Paso 3: Escribir el nuevo conjunto entre llaves conteniendo los elementos compartidos.'
- 'Paso 4: Si no existe ningún elemento común, escribir $A \cap B = \emptyset$.'
- 'Paso 5: En el diagrama de Venn, sombrear únicamente la región central de solapamiento.'
errores_correccion: '- **Error 1:** Incluir elementos que están en un solo conjunto dentro de la intersección. **Cómo corregirlo:** La intersección exige que el elemento resida en ambos conjuntos sin excepción ($x \in A \land x \in B$).

  - **Error 2:** Creer que $A \cap \emptyset = A$. **Cómo corregirlo:** El conjunto vacío es absorbente para la intersección: $A \cap \emptyset = \emptyset$, pues ningún elemento puede estar en el vacío.

  '
ejemplos:
- titulo: Intersección con inclusión
  enunciado: Si $A \subseteq B$, ¿cuánto vale $A \cap B$?
  alternativas:
  - $A$
  - $B$
  - $\emptyset$
  respuesta: $A$
  solucion_pasos:
  - 1. Al estar $A$ dentro de $B$, todos los elementos de $A$ son comunes a ambos.
- titulo: Intersección con el conjunto universal
  enunciado: ¿Cuánto vale $A \cap \mathcal{U}$?
  respuesta: $A$
  solucion_pasos:
  - El universo es el elemento neutro de la intersección.
  alternativas:
  - $A$
  - $\mathcal{U}$
  - $\emptyset$
  - $A^c$
- titulo: Intersección de números primos y pares
  enunciado: ¿Cuál es la intersección entre los números primos $\mathbb{P}$ y los números pares enteros?
  respuesta: $\{2\}$
  solucion_pasos:
  - El único número entero que es primo y par simultáneamente es el 2.
  alternativas:
  - $\{2\}$
  - $\emptyset$
  - $\{2, 4\}$
  - Infinito
- titulo: Intersección de intervalos
  enunciado: ¿Cuál es la intersección de $[1, 5)$ y $[3, 7]$?
  respuesta: $[3, 5)$
  solucion_pasos:
  - Los reales comunes van desde 3 (incluido) hasta 5 (sin incluir).
  alternativas:
  - $[3, 5)$
  - $[1, 7]$
  - $(3, 5)$
  - $[3, 5]$
errores_frecuentes:
- La afirmación de que la intersección reúne todos los elementos de ambos conjuntos como la unión.
- La afirmación de que la intersección de dos conjuntos disjuntos da como resultado el conjunto $\{0\}$.
- La afirmación de que la intersección de un conjunto con el conjunto vacío produce el conjunto original.
- La afirmación de que la intersección de conjuntos no es distributiva con respecto a la unión.
- La afirmación de que un elemento puede pertenecer a $A \cap B$ estando presente únicamente en $A$.
afirmaciones_verdaderas:
- La intersección $A \cap B$ es el conjunto de todos los elementos que pertenecen simultáneamente a $A$ y a $B$ ($\{x \mid x \in A \land x \in B\}$).
- El conjunto universal es el elemento neutro de la intersección ($A \cap \mathcal{U} = A$) y el conjunto vacío es el absorbente ($A \cap \emptyset = \emptyset$).
al_terminar_debes_poder: 'QUÉ: Definir, calcular y sombrear en diagramas de Venn la intersección de conjuntos ($A \cap B$).

  CÓMO: Aplicar el conectivo conjuntivo $\land$, aislar los elementos comunes compartidos y operar con las leyes distributivas y de De Morgan.


