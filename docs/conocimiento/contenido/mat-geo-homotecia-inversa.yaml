semantic_id: MAT.GEO.HOMOTECIA.INVERSA
resumen_inicial: 'Homotecia inversa con razón negativa: conceptos, teoremas, propiedades
  geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: 'El segundo tipo de homotecia, según el signo de su razón, produce
  un efecto visual muy distinto al de la homotecia directa: invierte la posición de
  la figura respecto al centro.'
explicacion_formal: '![Homotecia inversa (razón negativa)](/static/img/geometria/congruencia-semejanza/homotecia-inversa.svg)


  ### Definición formal


  Si $k<0$, la homotecia se llama inversa: para cada punto $P$, su imagen $P''=O+k(P-O)$
  se ubica en el rayo opuesto al que parte de $O$ y pasa por $P$.


  ### Desarrollo didáctico


  En una homotecia inversa, la figura imagen queda "al otro lado" del centro respecto
  a la original, como si se reflejara a través del punto O; visualmente parece una
  rotación de 180° combinada con un cambio de tamaño.'
definiciones_clave: '- **Homotecia inversa con razón negativa**: Elemento o propiedad
  fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a homotecia inversa con razón negativa.'
ejemplo_guiado:
  enunciado: En la aplicación de homotecia inversa con razón negativa, se establece
    una razón $k = 1.6$ entre dos figuras homólogas de longitud original $L = 35\text{
    cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de homotecia inversa con razón negativa.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 1.6 \cdot 35$.'
  - Concluir que la medida obtenida en homotecia inversa con razón negativa es $L'
    = 56.0\text{ cm}$.
