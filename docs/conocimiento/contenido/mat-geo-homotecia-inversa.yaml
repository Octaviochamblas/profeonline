procedimiento:
- 'Paso 1: Observa el signo de la razón de homotecia k.'
- 'Paso 2: Si k es negativo, la homotecia es inversa.'
- 'Paso 3: Verifica que cada punto imagen esté del lado opuesto del centro respecto
  a su punto original.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con homotecia inversa con razón negativa.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de homotecia inversa con razón negativa para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando homotecia inversa con razón negativa.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de homotecia inversa con razón negativa
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de homotecia inversa con razón negativa.
- titulo: ¿Se cumple siempre la propiedad principal de homotecia inversa con razón
    negativa en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede homotecia inversa con razón negativa asumir un valor negativo cuando
    representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en homotecia inversa con razón negativa.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en homotecia inversa
  con razón negativa.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en homotecia inversa
  con razón negativa.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de homotecia
  inversa con razón negativa.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
al_terminar_debes_poder: Identificar, calcular y aplicar las propiedades de homotecia
