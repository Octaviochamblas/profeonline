semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.SEMEJANZA_FIGURAS_CONCEPTO
resumen_inicial: 'Concepto de semejanza de figuras como igualdad de forma y posible
  diferencia de tamaño: conceptos, teoremas, propiedades geométricas y cálculo en
  Congruencia, Semejanza y Homotecia.'
explicacion_simple: 'A diferencia de la congruencia, donde dos figuras deben coincidir
  exactamente en forma y tamaño, existe una relación más amplia que solo exige que
  la forma sea la misma: la semejanza.'
explicacion_formal: '![Semejanza: misma forma, distinto tamaño](/static/img/geometria/congruencia-semejanza/semejanza-figuras-concepto.svg)


  ### Definición formal


  Dos figuras son semejantes si una es una ampliación o reducción exacta de la otra
  (posiblemente combinada con traslación, rotación o reflexión), de modo que conserven
  la misma forma.


  ### Desarrollo didáctico


  Una fotografía y su versión ampliada son semejantes: cada detalle mantiene las mismas
  proporciones relativas entre sí, aunque el tamaño total cambie. Toda figura congruente
  es también semejante (con tamaño idéntico), pero no toda figura semejante es congruente.'
definiciones_clave: '- **Concepto de semejanza de figuras como igualdad de forma y
  posible diferencia de tamaño**: Elemento o propiedad fundamental en el estudio de
  congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a concepto de semejanza de figuras como igualdad
  de forma y posible diferencia de tamaño.'
