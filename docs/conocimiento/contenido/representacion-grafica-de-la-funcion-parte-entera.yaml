semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_GRAFICO
resumen_inicial: La representación gráfica de la función parte entera se compone de una serie infinita de escalones horizontales discontinuos.
explicacion_simple: |
  La gráfica de la **función parte entera $f(x) = \lfloor x \rfloor$** se parece a una **escalera**:

  - En cada tramo entre dos enteros (por ejemplo entre $x = 0$ y $x = 1$), la gráfica es una **línea horizontal plana** a la altura $y = 0$.
  - **Puntos extremos**: En el extremo izquierdo del tramo ($x = 0$) la línea tiene un **círculo lleno $\bullet$** (incluye el punto), y en el extremo derecho ($x = 1$) tiene un **círculo vacío $\circ$** (no incluye el punto).
  - Al pasar a $x = 1$, la gráfica da un "salto" vertical al siguiente escalón a la altura $y = 1$.
explicacion_formal: |
  Sea $f(x) = \lfloor x \rfloor$. La gráfica $G_f = \bigcup_{n \in \mathbb{Z}} S_n$ se compone de la unión disjunta de segmentos horizontales semiabiertos $S_n$:

  $$S_n = \{(x, n) \in \mathbb{R}^2 \mid n \le x < n + 1\}$$

  **Características geométricas:**
  - **Extremo izquierdo:** Cierre mediante punto sólido $(n, n)$.
  - **Extremo derecho:** Apertura mediante círculo hueco o frontera no incluida $(n+1, n)$.
  - **Longitud del escalón:** $\Delta x = 1$ para la función parte entera canónica.
  - **Discontinuidades:** Saltos finitos de altura $\Delta y = 1$ en cada $x \in \mathbb{Z}$.
definiciones_clave: |
  - **Gráfica escalonada**: Representación en el plano compuesta por tramos horizontales paralelos discontinuos.
propiedades_relaciones: |
  - **Transformaciones de escala y traslación**: La función $f(x) = a \lfloor bx + c \rfloor + d$ modifica la altura del escalón con $a$, la longitud del tramo con $\frac{1}{|b|}$ y desplaza la posición con $c$ y $d$.
ejemplo_guiado:
  enunciado: "Describe los puntos extremos del escalón de la gráfica $f(x) = \\lfloor x \\rfloor$ correspondiente al intervalo $2 \\le x < 3$."
  pasos:
    - 'Paso 1: Identificar el número entero base $n = 2$.'
    - 'Paso 2: La altura del escalón en todo ese tramo es $y = 2$.'
    - 'Paso 3: Determinar el punto de inicio en el extremo izquierdo $x = 2$: es el punto cerrado $(2, 2)$.'
    - 'Paso 4: Determinar el punto final en el extremo derecho $x = 3$: es el punto abierto o círculo hueco $(3, 2)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cómo se representan los extremos izquierdo y derecho de cada escalón en la gráfica de la función parte entera?"
    choices:
      - {text: "Extremo izquierdo con punto cerrado y extremo derecho con punto abierto.", is_correct: true}
      - {text: "Ambos extremos con puntos cerrados.", is_correct: false}
      - {text: "Ambos extremos con puntos abiertos.", is_correct: false}
      - {text: "Extremo izquierdo con punto abierto y derecho con punto cerrado.", is_correct: false}
    explanation: "La alternativa correcta es 'Extremo izquierdo con punto cerrado y extremo derecho con punto abierto.'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "En el intervalo $2 \\le x < 3$, ¿a qué altura constante $y$ se ubica el escalón de $f(x) = \\lfloor x \\rfloor$?"
    choices:
      - {text: "$y = 2$", is_correct: true}
      - {text: "$y = 3$", is_correct: false}
      - {text: "$y = 2{,}5$", is_correct: false}
      - {text: "$y = 0$", is_correct: false}
    explanation: "La alternativa correcta es '$y = 2$'. Para todo $x \\in [2, 3[$, la parte entera es 2."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Dibujar los ejes cartesianos e identificar las marcas enteras en los ejes $X$ e $Y$.'
  - 'Paso 2: Para cada intervalo entero $[n, n+1[$, trazar un segmento horizontal a la altura $y = n$.'
  - 'Paso 3: Colocar un círculo sólido en el punto $(n, n)$ y un círculo hueco en el punto $(n+1, n)$.'
  - 'Paso 4: Repetir el patrón para valores positivos y negativos obteniendo la gráfica en escalera.'
errores_correccion: |
  - **Error común:** Dibujar la función parte entera uniendo los escalones con líneas verticales continuas.
  - **Cómo corregirlo:** La gráfica es **DISCONTINUA**; NO se deben trazar líneas verticales conectando los escalones, solo círculos abiertos y cerrados.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones especiales.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones especiales.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La gráfica de la función parte entera es una curva parabólica suave que pasa por el origen.'
  - 'Los escalones de la gráfica de $f(x) = \lfloor x \rfloor$ se conectan mediante segmentos verticales continuos.'
  - 'El extremo derecho de cada escalón de la función parte entera incluye un punto sólido relleno.'
  - 'La altura del escalón para el intervalo $-2 \le x < -1$ se ubica a la altura $y = -1$.'
  - 'La longitud horizontal de los escalones de la función parte entera canónica depende del valor de $y$.'
afirmaciones_verdaderas:
  - 'La representación gráfica de la función parte entera $f(x) = \lfloor x \rfloor$ consta de segmentos horizontales semirrectos de longitud 1 con saltos de discontinuidad en cada valor entero.'
  - 'Cada escalón de la gráfica parte entera posee un extremo izquierdo cerrado $(n, n)$ y un extremo derecho abierto $(n+1, n)$.'
al_terminar_debes_poder: |
  QUÉ: Representar e interpretar la gráfica escalonada de la función parte entera.
  CÓMO: Trazar segmentos horizontales en los intervalos $[n, n+1[$ a la altura $y = n$ marcando extremos cerrados y abiertos.
