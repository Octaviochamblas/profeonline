semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_GRAFICO
resumen_inicial: La representación gráfica de la función parte entera es una función escalonada formada por segmentos horizontales de longitud 1, con extremo izquierdo cerrado $\bullet$ en $(k, k)$ y derecho abierto $\circ$ en $(k+1, k)$.
explicacion_simple: '![La representación gráfica de la función parte entera es una función escalonada formada por segmentos horizontales de longitud 1, con extremo izquierdo cerrado $\bullet$ en $(k, k)$ y derecho abierto $\circ$ en $(k+1, k)$](/static/img/nodos/representacion-grafica-de-la-funcion-parte-entera-intro.svg)



  El dibujo de la función parte entera $y = \lfloor x \rfloor$ parece una **escalera infinita**:

  - Cada escalón mide $1\text{ unidad}$ de largo y está a una altura entera constante $y = k$.

  - **El extremo izquierdo está CERRADO (punto relleno $\bullet$):** porque en $x = k$, el valor es exactamente $k$.

  - **El extremo derecho está ABIERTO (círculo vacío $\circ$):** porque justo al llegar a $k+1$, la función da un salto al siguiente escalón de arriba.'
explicacion_formal: "La gráfica cartesiana $\\text{Graf}(\\lfloor \\cdot \\rfloor)$ es la unión numerable disjunta de segmentos horizontales semiabiertos:\n$$\\text{Graf}(\\lfloor \\cdot \\rfloor) = \\bigcup_{k \\in \\mathbb{Z}} \\left( [k, k+1[ \\times \\{k\\} \\right)$$\n\n**Características topológicas y analíticas:**\n- **Discontinuidades de salto**: Presenta discontinuidad esencial de salto finito de magnitud $\\Delta y = 1$ en cada punto entero $x \\in \\mathbb{Z}$:\n  $$\\lim_{x \\to k^+} \\lfloor x \\rfloor = k, \\quad \\lim_{x \\to k^-} \\lfloor x \\rfloor = k - 1$$\n- **Continuidad lateral**: Es continua por la derecha en todo $\\mathbb{R}$ ($f(k^+) = f(k)$), pero discontinua por la izquierda en $\\mathbb{Z}$.\n- **Derivada nula casi en todas partes**: $f'(x) = 0$ para todo $x \\in \\mathbb{R} \\setminus \\mathbb{Z}$."
definiciones_clave: '- **Función escalonada**: Función constante por tramos en intervalos contiguos.

  - **Punto de salto**: Valor de la abscisa donde la función experimenta una discontinuidad no evitable.'
propiedades_relaciones: '- **Orientación de extremos**: Siempre cerrado a la izquierda $(k, k)$ y abierto a la derecha $(k+1, k)$.

  - **Modificaciones de escala**: En $y = a\lfloor bx \rfloor$, la longitud de cada escalón es $\frac{1}{|b|}$ y la altura del salto es $|a|$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La representación gráfica de la función parte entera es una función escalonada formada por segmentos horizontales de longitud 1, con extremo izquierdo cerrado $\bullet$ en $(k, k)$ y derecho abierto $\circ$ en $(k+1, k)$](/static/img/nodos/representacion-grafica-de-la-funcion-parte-entera-ejemplos.svg)



    Describe y grafica los escalones de la función $f(x) = \lfloor x \rfloor$ en el intervalo $[-2, 2[$.'
  pasos:
  - 'Paso 1: Para $x \in [-2, -1[$: segmento a altura $y = -2$, con punto cerrado en $(-2, -2)$ y abierto en $(-1, -2)$.'
  - 'Paso 2: Para $x \in [-1, 0[$: segmento a altura $y = -1$, con punto cerrado en $(-1, -1)$ y abierto en $(0, -1)$.'
  - 'Paso 3: Para $x \in [0, 1[$: segmento sobre el eje X ($y = 0$), con punto cerrado en $(0, 0)$ y abierto en $(1, 0)$.'
  - 'Paso 4: Para $x \in [1, 2[$: segmento a altura $y = 1$, con punto cerrado en $(1, 1)$ y abierto en $(2, 1)$.'
  - 'Paso 5: Constatar la estructura de escalera con saltos unitarios en cada entero.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo son los extremos de cada escalón en la gráfica de la función parte entera $y = \lfloor x \rfloor$?
  choices:
  - text: Cerrado (relleno) a la izquierda y abierto (vacio) a la derecha.
    is_correct: true
  - text: Abierto a la izquierda y cerrado a la derecha.
    is_correct: false
  - text: Ambos extremos cerrados.
    is_correct: false
  - text: Ambos extremos abiertos.
    is_correct: false
  explanation: La alternativa correcta es 'Cerrado (relleno) a la izquierda y abierto (vacio) a la derecha.'. En $[k, k+1[$ el valor en $k$ es $k$ y en $k+1$ salta.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué puntos presenta discontinuidades la gráfica de $f(x) = \lfloor x \rfloor$?
  choices:
  - text: En todos los numeros enteros x ∈ Z.
    is_correct: true
  - text: Solo en el origen x = 0.
    is_correct: false
  - text: En ningun punto (es continua).
    is_correct: false
  - text: Solo en los numeros negativos.
    is_correct: false
  explanation: La alternativa correcta es 'En todos los numeros enteros x ∈ Z.'. En cada entero salta al escalón siguiente.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el eje $X$ en intervalos unitarios semiabiertos $[k, k+1[$.'
- 'Paso 2: Trazar un segmento horizontal a la altura entera $y = k$ para cada tramo.'
- 'Paso 3: Marcar un punto relleno $\bullet$ en el extremo izquierdo $(k, k)$.'
- 'Paso 4: Marcar un círculo vacío $\circ$ en el extremo derecho $(k+1, k)$.'
- 'Paso 5: No unir los escalones con líneas verticales.'
errores_correccion: '- **Error común:** Dibujar líneas verticales continuas conectando los escalones.

  - **Cómo corregirlo:** La función es **discontinua**; no debe dibujarse ninguna línea vertical entre los escalones.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de intervalo'
  enunciado: En la gráfica de $y = \lfloor x \rfloor$, ¿a qué altura se encuentra el escalón para $x \in [3, 4[$?
  alternativas:
  - y = 3
  - y = 4
  - y = 3.5
  - y = 0
  respuesta: y = 3
  solucion_pasos:
  - 'Paso 1: Para todo $x \in [3, 4[$, $\lfloor x \rfloor = 3$.'
- titulo: 'Ejemplo 2: Corte con el eje Y'
  enunciado: ¿En qué punto corta al eje Y la gráfica de $y = \lfloor x \rfloor$?
  alternativas:
  - (0, 0)
  - (0, 1)
  - (0, -1)
  - No corta al eje Y
  respuesta: (0, 0)
  solucion_pasos:
  - 'Paso 1: Para $x = 0$, $\lfloor 0 \rfloor = 0 \implies (0, 0)$.'
- titulo: 'Ejemplo 3: Longitud con escala'
  enunciado: En $f(x) = \lfloor 2x \rfloor$, ¿cuánto mide la longitud de cada escalón horizontal?
  alternativas:
  - 0.5 unidades (1/2)
  - 2 unidades
  - 1 unidad
  - 4 unidades
  respuesta: 0.5 unidades (1/2)
  solucion_pasos:
  - 'Paso 1: $k \le 2x < k+1 \implies \frac{k}{2} \le x < \frac{k+1}{2}$, longitud $\frac{1}{2} = 0.5$.'
- titulo: 'Ejemplo 4: Altura negativa'
  enunciado: ¿Qué intervalo en el eje X corresponde al escalón a altura $y = -3$?
  alternativas:
  - '[-3, -2['
  - '[-2, -3['
  - '[-3, -4['
  - ']-3, -2]'
  respuesta: '[-3, -2['
  solucion_pasos:
  - 'Paso 1: $\lfloor x \rfloor = -3 \iff x \in [-3, -2[$.'
errores_frecuentes:
- Dibujar los círculos vacíos a la izquierda y los rellenos a la derecha.
- Unir los escalones con líneas verticales continuas.
- Olvidar la escala del intervalo al modificar el argumento interno.
afirmaciones_verdaderas:
- La gráfica de la función parte entera está formada por segmentos horizontales de longitud 1.
- Cada escalón posee extremo izquierdo cerrado [k, k) y extremo derecho abierto (k+1, k).
al_terminar_debes_poder: '**QUÉ:** Representar e interpretar gráficamente la función parte entera y sus transformaciones escalonadas.


  **CÓMO:** Trazando segmentos horizontales en intervalos [k, k+1[ con extremo izquierdo cerrado y derecho abierto.


