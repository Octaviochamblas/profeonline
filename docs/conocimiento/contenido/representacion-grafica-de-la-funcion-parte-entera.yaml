semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_GRAFICO
resumen_inicial: La gráfica de la función parte entera es una escalera formada por
  segmentos horizontales con un extremo izquierdo cerrado y un extremo derecho abierto.
explicacion_simple: 'La gráfica de la **función parte entera** se llama ''función
  escalonada'':

  - Se compone de infinitos escalones horizontales de longitud $1$.

  - Cada escalón tiene un **punto cerrado ($\bullet$)** a la izquierda en $(k, k)$
  y un **punto abierto ($\circ$)** a la derecha en $(k+1, k)$.

  - Es una función discontinua que pega un ''salto'' de 1 unidad al llegar a cada
  entero.'
explicacion_formal: 'La **gráfica cartesiana de la función parte entera** es la unión
  disjunta numerable de segmentos horizontales semiabiertos por la derecha:


  $$G([x]) = \bigcup_{k \in \mathbb{Z}} \big( [k, k+1[ \times \{k\} \big) \subset
  \mathbb{R}^2$$


  **Desglose de la fórmula:**

  - Para todo $x \in [k, k+1[$, la altura de la gráfica es la constante $y = k$.'
definiciones_clave: '- **Gráfica escalonada**: Trazado discontinuo formado por peldaños
  horizontales de longitud unitaria.'
propiedades_relaciones: '- **Discontinuidad de salto finito**: Presenta saltos finitos
  de altura $1$ en cada número entero $x = k \in \mathbb{Z}$.'
ejemplo_guiado:
  enunciado: Describe el segmento de la gráfica de $f(x) = [x]$ en el intervalo de
    entradas $[2, 3[$.
  pasos:
  - 'Paso 1: Para cualquier $x$ tal que $2 \le x < 3$, la parte entera vale $[x] =
    2$.Paso 2: Trazar un segmento horizontal a la altura constante $y = 2$.Paso 3:
    Marcar con círculo cerrado ($\bullet$) el extremo izquierdo en el punto $(2, 2)$.Paso
    4: Marcar con círculo abierto ($\circ$) el extremo derecho en el punto $(3, 2)$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la gráfica de $f(x) = [x]$ sobre el intervalo $[2, 3[$, ¿dónde se ubican
    los puntos cerrado y abierto?
  choices:
  - text: Punto cerrado en $(2, 2)$ y punto abierto en $(3, 2)$.
    is_correct: true
  - text: Punto abierto en $(2, 2)$ y punto cerrado en $(3, 2)$.
    is_correct: false
  - text: Ambos puntos cerrados.
    is_correct: false
  - text: Ambos puntos abiertos.
    is_correct: false
  explanation: La alternativa correcta es 'Punto cerrado en $(2, 2)$ y punto abierto
    en $(3, 2)$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué puntos del eje X se producen los saltos de discontinuidad en la
    gráfica de la parte entera?
  choices:
  - text: En cada uno de los números enteros $x \in \mathbb{Z}$.
    is_correct: true
  - text: Únicamente en $x = 0$.
    is_correct: false
  - text: En los números decimales terminados en ,5.
    is_correct: false
  - text: La gráfica es continua y no tiene saltos.
    is_correct: false
  explanation: La alternativa correcta es 'En cada uno de los números enteros $x \in
    \mathbb{Z}$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar los ejes cartesiano con marcas enteras.'
- 'Paso 2: Para cada intervalo $[k, k+1[$, trazar un segmento horizontal a la altura
  $y = k$.'
- 'Paso 3: Colocar punto relleno en $(k, k)$ y punto hueco en $(k+1, k)$.'
errores_correccion: '- **Error común:** Unir los escalones horizontales con líneas
  verticales inclinadas.

  - **Cómo corregirlo:** La función parte entera NO TIENE líneas verticales que unan
  los escalones; es una gráfica discontinua a saltos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de simetrías y funciones especiales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de simetrías y funciones especiales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función par cumple la identidad de simetría f(-x) = f(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de función par con simetría en el eje Y.
- titulo: ¿La función parte entera [x] devuelve el mayor entero menor o igual a x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de la función piso o parte entera.
errores_frecuentes:
- Confundir las funciones pares (simetría eje Y) con las funciones impares (simetría
  respecto al origen).
- Asumir que toda función real debe ser obligatoriamente par o impar, ignorando el
  caso sin paridad.
- Creer que una función impar o par debe tener coeficientes pares o impares respectivamente.
- 'Calcular la parte entera de números negativos truncando decimales en lugar de redondear
  al entero menor (ej: $[-1{,}2] = -2$).'
- Unir los escalones horizontales de la función parte entera con líneas verticales
  en lugar de dejarlos discontinuos.
afirmaciones_verdaderas:
- Una función es par si $f(-x) = f(x)$ (simétrica respecto al eje $Y$) e impar si
  $f(-x) = -f(x)$ (simétrica respecto al origen $(0,0)$).
- La función parte entera $f(x) = [x]$ asigna a cada real el mayor entero menor o
  igual a $x$, generando una gráfica escalonada discontinua.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y clasificar
  simetrías de funciones pares e impares, así como graficar y aplicar la función parte
  entera en contextos de cobro por tramos y finanzas.
