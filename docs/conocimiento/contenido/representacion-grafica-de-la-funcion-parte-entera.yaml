semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARTE_ENTERA_GRAFICO
resumen_inicial: 'Representación gráfica de la función parte entera: conceptos, representación
  y propiedades en Simetrías y funciones especiales.'
explicacion_simple: 'La gráfica de esta función no es una curva suave: parece una
  escalera, con tramos horizontales que saltan de golpe al siguiente escalón.'
explicacion_formal: '### Definición formal


  Para $x \in [n, n+1[$ con $n \in \mathbb{Z}$, se cumple $\lfloor x \rfloor = n$.
  Por tanto, la gráfica consiste en la unión de segmentos horizontales $\{(x,n) :
  x \in [n,n+1[\}$ para cada entero $n$, generando discontinuidades de salto en cada
  valor entero.


  ### Desarrollo didáctico


  Cada "escalón" horizontal comienza exactamente en un número entero (con punto sólido,
  porque ese entero sí pertenece al tramo) y termina justo antes del siguiente entero
  (con punto abierto, porque ese siguiente valor ya pertenece al escalón de arriba).


  Entre $x=2$ y $x=3$ (sin incluirlo), la función vale constantemente $2$. En $x=3$
  exactamente, salta abruptamente a valer $3$.'
definiciones_clave: '- **Representación gráfica de la función parte entera**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a representación gráfica de la función parte
  entera.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a representación gráfica
    de la función parte entera.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a representación gráfica de la función
    parte entera.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
