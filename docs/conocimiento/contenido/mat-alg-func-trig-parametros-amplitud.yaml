semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.AMPLITUD
resumen_inicial: 'Análisis del efecto del parámetro A en la amplitud de la gráfica:
  círculo unitario, amplitud, período y transformaciones de Parámetros y transformaciones
  de funciones periódicas.'
explicacion_simple: El coeficiente que multiplica a la función seno o coseno determina
  qué tan "alta" y "baja" llega la onda respecto a su línea central.
explicacion_formal: '### Definición formal


  Como $\sin(x)$ y $\cos(x)$ oscilan entre $-1$ y $1$, multiplicar por $a$ produce
  una oscilación entre $-|a|$ y $|a|$. La amplitud, definida como la mitad de la distancia
  entre el máximo y el mínimo, es entonces $\dfrac{|a|-(-|a|)}{2}=|a|$.


  ### Desarrollo didáctico


  $f(x)=5\sin(x)$ tiene amplitud $5$: oscila entre $-5$ y $5$. $f(x)=-3\cos(x)$ tiene
  amplitud $3$ (no $-3$, porque la amplitud es siempre no negativa), y oscila entre
  $-3$ y $3$.'
definiciones_clave: '- **Análisis del efecto del parámetro A en la amplitud de la
  gráfica**: Función periódica fundamentada en las coordenadas del círculo unitario
  o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a análisis del efecto del parámetro a en la amplitud de la gráfica.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    análisis del efecto del parámetro a en la amplitud de la gráfica.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de análisis del efecto del parámetro a en la amplitud
    de la gráfica.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
