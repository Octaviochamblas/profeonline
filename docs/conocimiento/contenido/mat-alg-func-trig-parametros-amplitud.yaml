  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el coeficiente $a$ que multiplica a la función seno o coseno.'
- 'Paso 2: Calcula su valor absoluto $|a|$.'
- 'Paso 3: Ese valor es la amplitud, y la curva oscila entre $-|a|$ y $|a|$.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en análisis del efecto del
  parámetro a en la amplitud de la gráfica.
ejemplos:
- titulo: Cálculo de la amplitud con coeficiente positivo
  enunciado: Calcula la amplitud de $f(x)=7\sin(x)$.
  solucion_pasos:
  - Se identifica $a=7$.
  - La amplitud es $|7|=7$.
- titulo: Cálculo de la amplitud con coeficiente negativo
  enunciado: Calcula la amplitud de $f(x)=-4\cos(x)$.
  solucion_pasos:
  - Se identifica $a=-4$.
  - La amplitud es $|-4|=4$.
- titulo: ¿La amplitud puede ser un número negativo?
  enunciado: ¿Puede la amplitud de una función trigonométrica transformada ser un
    valor negativo?
  respuesta: 'No'
  solucion_pasos:
  - La amplitud se define como un valor absoluto, siempre no negativo.
- titulo: ¿La amplitud de $f(x)=-2\sin(x)$ es igual a la de $g(x)=2\sin(x)$?
  enunciado: ¿La amplitud de $f(x)=-2\sin(x)$ es igual a la de $g(x)=2\sin(x)$?
  respuesta: Sí
  solucion_pasos:
  - Ambas tienen amplitud $|{-2}|=|2|=2$, aunque una esté reflejada respecto a la
    otra.
errores_frecuentes:
- Declarar la amplitud con el coeficiente $a$ sin aplicar el valor absoluto.
- Reportar una amplitud negativa cuando $a$ es negativo.
- Declarar la amplitud con el periodo de la función.
- No verificar el coeficiente correcto cuando la función incluye otros parámetros.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  análisis del efecto del parámetro a en la amplitud de la gráfica.
