semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.AMPLITUD
resumen_inicial: 'Análisis del efecto del parámetro $A$ en la amplitud y el estiramiento o compresión vertical de la gráfica trigonométrica.'
explicacion_simple: |
  El parámetro **$A$** actúa como el volumen o estirador vertical de la onda. Si multiplicas la función seno o coseno por un número mayor que 1 (como $y = 3\sin x$), la onda se estira hacia arriba y hacia abajo, alcanzando crestas más altas y valles más profundos. Si multiplicas por un número entre 0 y 1 (como $y = 0.5\sin x$), la onda se aplasta verticalmente. La **amplitud** mide la altura desde la línea central hasta la cresta y viene dada por el valor absoluto de $A$ ($|A|$).
explicacion_formal: |
  ### Definición formal
  En las funciones trigonométricas armónicas $f(x) = A\sin(Bx + C) + D$ y $g(x) = A\cos(Bx + C) + D$, la **amplitud** de la onda representa el factor de transformación por dilatación o contracción vertical y viene dada analíticamente por:
  $$\text{Amplitud} = |A|$$
  donde $|A| > 0$.

  ### Desglose simbólico
  - $|A| > 1$: Dilatación (estiramiento) vertical por un factor de $|A|$.
  - $0 < |A| < 1$: Contracción (atenuación) vertical por un factor de $|A|$.
  - $|A| = 1$: Amplitud unitaria base.

  ### Síntesis didáctica
  Modificar el parámetro $A$ altera de manera directa el recorrido de la función, desplazando las cotas extremas a $[D - |A|, D + |A|]$. Sin embargo, **no modifica** los ceros de la función base ni la distancia horizontal del período $T$.
definiciones_clave: |
  - **Dilatación vertical ($|A| > 1$)**: Estiramiento de la gráfica que aumenta la distancia vertical entre crestas y valles.
  - **Contracción vertical ($|A| < 1$)**: Aplanamiento de la gráfica que reduce la altura de las oscilaciones.
  - **Amplitud ($|A|$)**: Magnitud escalar que mide la altura de la cresta sobre la línea media.
propiedades_relaciones: |
  - **Invariancia del período**: El parámetro $A$ modifica exclusivamente el eje Y (vertical); no altera en absoluto el período $T = \frac{2\pi}{|B|}$ ni la frecuencia del eje X.
  - **Efecto en la pendiente**: A mayor amplitud $|A|$, mayor es la inclinación de la pendiente de la curva al cruzar por la línea media.
ejemplo_guiado:
  enunciado: 'Compara la amplitud y el recorrido de la función base $f(x) = \sin(x)$ con los de la función transformada $g(x) = 4.5\sin(x)$.'
  pasos:
    - 'Paso 1: Determinar la amplitud de la función base $f(x)$: $A_1 = 1 \implies \text{Amplitud} = 1$. Recorrido: $[-1, 1]$.'
    - 'Paso 2: Determinar el coeficiente $A$ de la función $g(x)$: $A_2 = 4.5$.'
    - 'Paso 3: Calcular la nueva amplitud: $|A_2| = |4.5| = 4.5$.'
    - 'Paso 4: Calcular el nuevo recorrido: como $D = 0$, $\operatorname{Rec}(g) = [-4.5, 4.5]$. La gráfica se ha estirado verticalmente $4.5$ veces.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué transformación gráfica ocurre sobre la onda sinusoide cuando el coeficiente $A$ cambia de $1$ a $4$?'
    choices:
      - {text: 'Se produce una dilatación vertical estirando la onda $4$ veces su altura original', is_correct: true}
      - {text: 'La onda se comprime horizontalmente a la cuarta parte de su ancho', is_correct: false}
      - {text: 'La gráfica se desplaza $4$ unidades hacia la derecha', is_correct: false}
      - {text: 'El período de la onda se multiplica por $4$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se produce una dilatación vertical estirando la onda $4$ veces su altura original''. El parámetro $A$ afecta la altura vertical.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función seno tiene la forma $y = 0.2\sin(x)$, ¿cuál es su recorrido?'
    choices:
      - {text: '$[-0.2, 0.2]$', is_correct: true}
      - {text: '$[-1, 1]$', is_correct: false}
      - {text: '$[0, 0.2]$', is_correct: false}
      - {text: '$[-5, 5]$', is_correct: false}
    explanation: 'La alternativa correcta es ''$[-0.2, 0.2]$''. Con $A = 0.2$ y $D = 0$, la onda oscila entre $-0.2$ y $+0.2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el coeficiente multiplicativo $A$ delante de la función trigonométrica.'
  - 'Paso 2: Calcular la amplitud aplicando el valor absoluto $|A|$.'
  - 'Paso 3: Interpretar si se trata de una dilatación ($|A| > 1$) o una contracción ($0 < |A| < 1$).'
  - 'Paso 4: Multiplicar los valores extremos de la función base por $|A|$ para hallar las nuevas alturas.'
errores_correccion: |
  - **Error 1:** Creer que cambiar la amplitud altera la velocidad a la que se repite la onda (el período). **Cómo corregirlo:** La amplitud actúa únicamente sobre la altura vertical (eje Y); la frecuencia horizontal (período) depende exclusivamente del coeficiente $B$.
  - **Error 2:** Confundir la contracción vertical con una traslación. **Cómo corregirlo:** La contracción aplasta la gráfica hacia la línea media, reduciendo su rango, mientras que la traslación mueve toda la estructura sin deformar su altura.
ejemplos:
  - titulo: 'Amplitud decimal'
    enunciado: '¿Cuál es la amplitud de la función $f(x) = \frac{1}{3}\cos(x)$?'
    alternativas:
      - '$\frac{1}{3}$'
      - '$3$'
      - '$1$'
    respuesta: '$\frac{1}{3}$'
    solucion_pasos:
      - '1. El parámetro es $A = \frac{1}{3}$.'
      - '2. La amplitud es $\left|\frac{1}{3}\right| = \frac{1}{3}$.'
  - titulo: 'Conservación de intersecciones en el eje X'
    enunciado: '¿La función $f(x) = 10\sin(x)$ se anula en los mismos puntos $x = k\pi$ que la función base $\sin(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $10 \cdot 0 = 0$, conservando exactas las intersecciones con la línea media.'
  - titulo: 'Dilatación de crestas'
    enunciado: '¿En la función $y = 5\cos(x)$ la cresta alcanza la altura $y = 5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $y_{\max} = 5 \cdot 1 = 5$.'
  - titulo: 'Efecto de A en el recorrido'
    enunciado: '¿Modificar el parámetro $A$ cambia siempre el recorrido de la función si $D$ permanece constante?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el recorrido pasa a ser $[- |A| + D, |A| + D]$.'
errores_frecuentes:
  - 'La afirmación de que aumentar el valor del parámetro $A$ acorta el período horizontal de la onda.'
  - 'La afirmación de que el parámetro $A$ traslada la línea media hacia arriba o hacia abajo.'
  - 'La afirmación de que si $A = 0.5$, la onda se estira verticalmente alcanzando el doble de altura.'
  - 'La afirmación de que los ceros de la función $y = A\sin(x)$ se desplazan al modificar la amplitud $A$.'
  - 'La afirmación de que el parámetro $A$ modifica el desfase de la función.'
afirmaciones_verdaderas:
  - 'El parámetro $|A|$ determina el factor de escala vertical de la función trigonométrica, estirándola si $|A| > 1$ o contrayéndola si $0 < |A| < 1$.'
  - 'La variación de la amplitud $|A|$ no altera la ubicación de las intersecciones con la línea media ni la longitud del período fundamental.'
al_terminar_debes_poder: |
  QUÉ: Analizar y determinar el efecto del parámetro $A$ en la amplitud y deformación vertical de funciones trigonométricas.
  CÓMO: Obtener el valor absoluto $|A|$ para clasificar la transformación en dilatación ($|A|>1$) o contracción ($|A|<1$) vertical.
