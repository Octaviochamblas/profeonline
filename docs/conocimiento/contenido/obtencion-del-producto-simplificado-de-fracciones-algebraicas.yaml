semantic_id: MAT.ALG.FRACCIONES_MULT.PRODUCTO_RESULTANTE
resumen_inicial: 'Obtención del producto simplificado de fracciones algebraicas: concepto,
  reglas operativas y simplificación en Multiplicación de fracciones algebraicas.'
explicacion_simple: Una vez que la 'matanza' de factores cruzados termina, solo queda
  recoger a los sobrevivientes y armar la respuesta final.
explicacion_formal: '### Definición formal


  La cancelación es una división, por lo tanto a/a = 1, no 0.


  ### Desarrollo didáctico


  Una vez que has factorizado, simplificado en cruz y tachado todo lo tachablemente
  posible, llega el momento de recoger los escombros y armar tu respuesta final.


  El producto resultante es simplemente la multiplicación de los factores ''supervivientes''
  en el numerador y los ''supervivientes'' en el denominador.


  Regla de estilo matemático: Es perfectamente válido, y muchas veces preferible,
  dejar el resultado expresado como multiplicaciones indicadas de factores primos
  en lugar de desarrollar la multiplicación. Es decir, dejar la respuesta como $\frac{(x-5)}{(x+2)(x-3)}$
  suele ser mejor (y más útil para ver el dominio) que expandirlo a $\frac{x-5}{x^2-x-6}$.
  Sigue la instrucción de la prueba o de tu profesor.'
definiciones_clave: '- **Obtención del producto simplificado de fracciones algebraicas**:
  Procedimiento o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a obtención del producto simplificado
  de fracciones algebraicas.'
ejemplo_guiado:
  enunciado: Simplifica o resuelve la expresión aplicando obtención del producto simplificado
    de fracciones algebraicas.
  pasos:
  - Factorizar los numeradores y denominadores involucrados.
  - Identificar restricciones del dominio (denominador no nulo).
  - Aplicar la regla o procedimiento correspondiente a obtención del producto simplificado
    de fracciones algebraicas.
  - Simplificar los factores comunes y escribir el resultado final irreducible.
