procedimiento:
- 'Paso 1: Identifica qué factores quedaron sin tachar en la línea de numeradores.'
- 'Paso 2: Multiplícalos o déjalos expresados juntos.'
- 'Paso 3: Haz lo mismo con los denominadores sobrevivientes.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en obtención del producto simplificado de fracciones algebraicas.
ejemplos:
- titulo: 'Sobrevivientes de un problema: $\frac{x-1}{1} \cdot \frac{3}{x+2}$. Escribe
    el final'
  enunciado: 'Sobrevivientes de un problema: $\frac{x-1}{1} \cdot \frac{3}{x+2}$.
    Escribe el final.'
  solucion_pasos:
  - 'Arriba: $(x-1) \cdot 3 = 3(x-1)$.'
  - 'Abajo: $1 \cdot (x+2) = x+2$.'
  - 'Resultado: $\frac{3(x-1)}{x+2}$.'
- titulo: ¿Cuál es el producto de $\frac{2}{x} \cdot \frac{x+1}{3}$?
  solucion_pasos:
  - 2*(x+1) = 2x+2 arriba, x*3 = 3x abajo.
- titulo: 'Respecto de «Obtención del producto simplificado de fracciones algebraicas»:
    ¿Es correcta es'
  enunciado: 'Respecto de «Obtención del producto simplificado de fracciones algebraicas»:
    ¿Es correcta esta caracterización? «Multiplica todos los factores que no fueron
    cancelados en el numerador para formar tu numerador final, y lo mismo en el denominador»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Multiplica todos los factores
    que no fueron cancelados en el numerador para formar tu numerador final, y lo
    mismo en el denominador.'
- titulo: 'Respecto de «Obtención del producto simplificado de fracciones algebraicas»:
    ¿Es válida esta'
  enunciado: 'Respecto de «Obtención del producto simplificado de fracciones algebraicas»:
    ¿Es válida esta afirmación? «Olvidar algún factor que sobrevivió a la cancelación»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Multiplica todos los factores
    que no fueron cancelados en el numerador para formar tu numerador final, y lo
    mismo en el denominador.'
errores_frecuentes:
- Olvidar algún factor que sobrevivió a la cancelación.
- Escribir 0 en el numerador si se canceló todo (debe ser 1).
- Para «Si en un proceso de multiplicación todos los factores del numerador de una
  fracción se cancelan, ¿qué número queda en su lugar», la respuesta correcta es 0.
- Para «Si en un proceso de multiplicación todos los factores del numerador de una
  fracción se cancelan, ¿qué número queda en su lugar», la respuesta correcta es La
  variable x.
- Para «Si en un proceso de multiplicación todos los factores del numerador de una
  fracción se cancelan, ¿qué número queda en su lugar», la respuesta correcta es El
  signo negativo.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando obtención
  del producto simplificado de fracciones algebraicas.
