semantic_id: MAT.ALG.CUADRADO_BINOMIO.SIMETRIA_DIFERENCIA
resumen_inicial: 'El uso de la equivalencia entre cuadrados de diferencias opuestas establece que $(a-b)^2 = (b-a)^2$ para todos los números reales $a,b$, debido a que elevar al cuadrado el factor opuesto $-1$ no altera el resultado.'
explicacion_simple: |
  En álgebra existe una propiedad de simetría muy útil:
  - **REGLA DE EQUIVALENCIA OPUSTA**:
    $$(a - b)^2 = (b - a)^2$$
  - **Por qué funciona**:
    - Nota que $(b - a)$ es exactamente el opuesto de $(a - b)$, es decir: $(b - a) = -(a - b)$.
    - Al elevar al cuadrado: $[-(a - b)]^2 = (-1)^2 \cdot (a - b)^2 = \mathbf{1 \cdot (a - b)^2 = (a - b)^2}$.
  - **Comprobación con un trinomio**:
    - $(x - 5)^2 = x^2 - 10x + 25$.
    - $(5 - x)^2 = 25 - 10x + x^2 = \mathbf{x^2 - 10x + 25}$.
    - ¡Ambas expresiones producen exactamente el mismo trinomio cuadrado perfecto!
explicacion_formal: |
  ### Definición formal
  Sea la función potencia cuadrática $f: \mathbb{R} \to \mathbb{R}$ definida por $f(z) = z^2$. Debido a que $f$ es una función par ($f(-z) = f(z)$), para cualquier elemento de la forma $z = (a - b) \in \mathbb{R}[x,y]$, se cumple:

  $$(b - a)^2 = \left( -1 \cdot (a - b) \right)^2 = (-1)^2 \cdot (a - b)^2 = 1 \cdot (a - b)^2 = (a - b)^2$$

  ### Invarianza en la Forma Canónica del TCP
  Desarrollando de forma expandida ambos cuadrados:
  - Expansión $1$: $(a - b)^2 = a^2 - 2ab + b^2$.
  - Expansión $2$: $(b - a)^2 = b^2 - 2ba + a^2 = a^2 - 2ab + b^2$.

  Por la propiedad conmutativa de la adición en el cuerpo $\mathbb{R}$, las expansiones son algebraicamente idénticas en todos sus términos.

  ### Síntesis didáctica
  Reconocer que $(a-b)^2 = (b-a)^2$ permite simplificar fracciones algebraicas y factorizar expresiones sin preocuparse por el orden de la resta interna.
definiciones_clave: |
  - **Equivalencia de cuadrados opuestos**: Identidad algebraica que establece que el cuadrado de una resta es igual al cuadrado de su resta opuesta: $(a-b)^2 = (b-a)^2$.
  - **Paridad de la función cuadrática ($f(-z) = z^2$)**: Propiedad por la cual elevar un número real o su opuesto aditivo genera el mismo valor.
  - **Factor de simetría opuesta ($-1$)**: Extracción del factor $-1$ de la resta tal que $[-(a-b)]^2 = (-1)^2(a-b)^2$.
propiedades_relaciones: |
  - **Invarianza de valor numérico**: Para cualquier par de valores reales $a, b \in \mathbb{R}$, la distancia al cuadrado entre $a$ y $b$ es simétrica: $(a-b)^2 = (b-a)^2 = |a-b|^2$.
  - **Utilidad en simplificación de fracciones**: Expresiones como $\frac{(a-b)^2}{b-a}$ se simplifican a $\frac{(b-a)^2}{b-a} = b-a$.
ejemplo_guiado:
  enunciado: 'Demuestra algebraicamente que $(3 - x)^2$ y $(x - 3)^2$ dan como resultado el mismo trinomio cuadrado perfecto.'
  pasos:
    - 'Paso 1: Expandimos el primer cuadrado $(3 - x)^2$ aplicando la regla:
       $(3)^2 - 2(3)(x) + (x)^2 = \mathbf{9 - 6x + x^2}$.'
    - 'Paso 2: Reordenamos decrecientemente las potencias: $\mathbf{x^2 - 6x + 9}$.'
    - 'Paso 3: Expandimos el segundo cuadrado $(x - 3)^2$ aplicando la regla:
       $(x)^2 - 2(x)(3) + (3)^2 = \mathbf{x^2 - 6x + 9}$.'
    - 'Paso 4: Comparamos los dos trinomios obtenidos:
       $x^2 - 6x + 9 \equiv x^2 - 6x + 9$.'
    - 'Conclusión: Ambas expresiones son estrictamente idénticas confirmando que **$(3 - x)^2 = (x - 3)^2$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la expresión $(x - y)^2$ es idéntica a $(y - x)^2$?'
    choices:
      - {text: 'Porque $(y-x)$ es igual a $-(x-y)$, y al elevar el factor $-1$ al cuadrado se obtiene $(-1)^2 = +1$, conservando el resultado', is_correct: true}
      - {text: 'Porque las variables $x$ e $y$ siempre valen cero', is_correct: false}
      - {text: 'Porque la resta es una operación conmutativa', is_correct: false}
      - {text: 'Porque se eliminan los signos menos de la expresión', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque $(y-x)$ es igual a $-(x-y)$, y al elevar el factor $-1$ al cuadrado se obtiene $(-1)^2 = +1$, conservando el resultado''. Paridad cuadrática de factor $-1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿A qué trinomio cuadrado perfecto equivale la expresión $(2 - a)^2$?'
    choices:
      - {text: 'Equivale a $a^2 - 4a + 4$, exactamente el mismo trinomio que $(a - 2)^2$', is_correct: true}
      - {text: 'Equivale a $a^2 - 4$', is_correct: false}
      - {text: 'Equivale a $-a^2 + 4a - 4$', is_correct: false}
      - {text: 'Equivale a $4 + a^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''Equivale a $a^2 - 4a + 4$, exactamente el mismo trinomio que $(a - 2)^2$''. $(2-a)^2 = (a-2)^2 = a^2 - 4a + 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el binomio resta y escribir su forma opuesta invirtiendo el orden de los términos.'
  - 'Paso 2: Explicitar el factor opuesto $-1$ tal que $(b-a) = -1 \cdot (a-b)$.'
  - 'Paso 3: Elevar ambos miembros al cuadrado demostrando que $(-1)^2 = 1$.'
  - 'Paso 4: Utilizar la equivalencia $(a-b)^2 = (b-a)^2$ para reordenar o simplificar expresiones algebraicas.'
errores_correccion: |
  - **Error 1:** Afirmar que $(a-b)^2 = -(b-a)^2$ anteponiendo un signo menos al resultado. **Cómo corregirlo:** El cuadrado cancela el signo negativo **(($-1)^2 = +1 \implies (a-b)^2 = (b-a)^2$)**.
  - **Error 2:** Declarar que la resta sin elevar al cuadrado es conmutativa (escribir $a-b = b-a$). **Cómo corregirlo:** La resta sin cuadrado **INVIERTE SU SIGNO ($a-b = -(b-a)$); sólo al elevar al cuadrado son iguales**.
ejemplos:
  - titulo: 'Equivalencia numérica'
    enunciado: 'Para $a=5$ y $b=2$, ¿comprueba $(5-2)^2 = 3^2 = 9$ y $(2-5)^2 = (-3)^2 = 9$ que son iguales?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $(5-2)^2 = 3^2 = 9$.'
      - '2. $(2-5)^2 = (-3)^2 = 9$.'
      - '3. Ambas dan 9.'
  - titulo: 'Simplificación de fracción'
    enunciado: '¿Cuál es la simplificación de $\frac{(x - 4)^2}{4 - x}$?'
    alternativas:
      - '$4 - x$'
      - '$x - 4$'
      - '$-1$'
    respuesta: '$4 - x$'
    solucion_pasos:
      - '1. $(x-4)^2 = (4-x)^2$.'
      - '2. $\frac{(4-x)^2}{4-x} = 4 - x$.'
  - titulo: 'Identidad de desarrollo'
    enunciado: '¿Producen $(1 - y)^2$ e $(y - 1)^2$ el trinomio $y^2 - 2y + 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, ambos se expanden a $y^2 - 2y + 1$.'
  - titulo: 'Invarianza bajo signo menos'
    enunciado: 'En la expresión $[-(x-y)]^2$, ¿elimina la potencia cuadrática el signo negativo exterior?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(-1)^2 = +1$.'
errores_frecuentes:
  - 'Anteponer un signo menos al resultado declarando erróneamente que (a-b)^2 = -(b-a)^2.'
  - 'Intercambiar la equivalencia de los cuadrados opuestos con una supuesta conmutatividad de la resta sin elevar al cuadrado.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Alterar los signos de los términos del trinomio al cambiar el orden de la resta en el binomio.'
  - 'Multiplicar por $-1$ dentro del paréntesis sin elevar al cuadrado el factor.'
afirmaciones_verdaderas:
  - 'La propiedad de simetría establece que el cuadrado de una resta es igual al cuadrado de su resta opuesta: $(a-b)^2 = (b-a)^2$.'
  - 'La equivalencia se sostiene porque el factor opuesto $-1$ al elevarse al cuadrado resulta en $+1$.'
al_terminar_debes_poder: 'Utilizar la equivalencia entre cuadrados de diferencias opuestas para reordenar y simplificar expresiones algebraicas.'
