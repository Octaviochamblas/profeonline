resumen_inicial: 'La propiedad de simetría establece que el cuadrado de la diferencia
  de dos números es idéntico al cuadrado de la diferencia inversa: $(a - b)^2 = (b
  - a)^2$.'
explicacion_simple: Si restas $5 - 3 = 2$ y lo elevas al cuadrado obtienes $4$. Si
  cambias el orden y restas $3 - 5 = -2$ y lo elevas al cuadrado, también obtienes
  $4$ porque todo número negativo al cuadrado resulta positivo. Por eso $(a - b)^2$
  y $(b - a)^2$ son exactamente iguales.
explicacion_formal: 'Para cualesquiera $a, b \in \mathbb{R}$, la identidad de **Simetría
  de la Diferencia Cuadrática** se demuestra por factorización de $-1$:


  $$(b - a)^2 = [-(a - b)]^2 = (-1)^2 \cdot (a - b)^2 = 1 \cdot (a - b)^2 = (a - b)^2$$


  **Desglose simbólico:**

  - $[-(a-b)]$: Factorización del signo negativo del binomio opuesto.

  - $(-1)^2 = 1$: Invarianza escalar al elevar al cuadrado la constante opuesta en
  $\mathbb{R}$.

  - $(a - b)^2$: Trinomio cuadrado perfecto $a^2 - 2ab + b^2$.


  > **Complemento didáctico:** Muestra la paridad de la función potencia $f(x) = x^2$,
  donde $f(-x) = f(x)$, permitiendo conmutar la resta dentro de un exponente par.'
definiciones_clave: '- **Binomios opuestos**: Expresiones $(a - b)$ y $(b - a)$ cuya
  suma es cero.

  - **Paridad cuadrática**: Propiedad por la cual $(-x)^2 = x^2$ para todo $x \in
  \mathbb{R}$.'
propiedades_relaciones: '- **Invarianza bajo conmutación**: En simplificación de fracciones
  algebraicas, $(a-b)^2$ se puede reemplazar directamente por $(b-a)^2$.'
ejemplo_guiado:
  enunciado: Verifique que los desarrollos de $(3 - x)^2$ y $(x - 3)^2$ son idénticos
    utilizando la regla del cuadrado de binomio.
  pasos:
  - 'Paso 1: Desarrollar $(3 - x)^2 = 3^2 - 2(3)(x) + x^2 = 9 - 6x + x^2$.'
  - 'Paso 2: Desarrollar $(x - 3)^2 = x^2 - 2(x)(3) + 3^2 = x^2 - 6x + 9$.'
  - 'Paso 3: Ordenar los términos de menor a mayor grado: Ambos resultan $x^2 - 6x
    + 9$.'
  - 'Conclusión: Queda verificado que $(3 - x)^2 = (x - 3)^2 = x^2 - 6x + 9$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la relación matemática exacta entre $(a - b)^2$ y $(b - a)^2$?
  choices:
  - text: 'Son exactamente iguales: $(a - b)^2$ = $(b - a)^2$'
    is_correct: true
  - text: 'Son de signos opuestos: $(a - b)^2$ = -$(b - a)^2$'
    is_correct: false
  - text: Difieren en el término central
    is_correct: false
  - text: No se pueden relacionar
    is_correct: false
  explanation: 'La alternativa correcta es ''Son exactamente iguales: $(a - b)^2$
    = $(b - a)^2$''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al desarrollar $(5 - 2x)^2$ y $(2x - 5)^2$, ¿qué trinomio se obtiene en
    ambos casos?
  choices:
  - text: $4x^2 - 20x + 25$
    is_correct: true
  - text: $4x^2 + 20x + 25$
    is_correct: false
  - text: $25 - 4x^2$
    is_correct: false
  - text: $-4x^2 + 20x - 25$
    is_correct: false
  explanation: La alternativa correcta es '$4x^2 - 20x + 25$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar el signo negativo del binomio $b - a \to -(a - b)$.'
- 'Paso 2: Elevar la constante $-1$ al cuadrado obteniendo $+1$.'
- 'Paso 3: Concluir que la expresión trinómica desarrollada es la misma.'
errores_correccion: '- **Error 1: Anteponer un signo negativo al trinomio creyendo
  que $(b - a)^2 = -(a - b)^2$.** **Cómo corregirlo:** La potencia 2 elimina el signo
  negativo del factor $-1$, por lo que el resultado es exactamente POSITIVO e igual.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué trinomio equivale la expresión $(7 - m)^2$?
  alternativas:
  - $m^2 - 14m + 49$
  - $49 - m^2$
  - $m^2 + 14m + 49$
  respuesta: $m^2 - 14m + 49$
  solucion_pasos:
  - 1. Por simetría $(7 - m)^2 = (m - 7)^2$.
  - '2. Desarrollando: $m^2 - 2(m)(7) + 49 = m^2 - 14m + 49$.'
- titulo: Ejemplo 2
  enunciado: Simplifique la fracción $\frac{(x - 4)^2}{(4 - x)^2}$.
  alternativas:
  - $1$
  - $-1$
  - $(x - 4)$
  respuesta: $1$
  solucion_pasos:
  - 1. Como $(4 - x)^2 = (x - 4)^2$, la fracción es de la forma $\frac{K}{K} = 1$.
- titulo: ¿Es la igualdad $(x - y)^2 = (y - x)^2$ válida para todo número real $x$
    e $y$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la potencia par convierte los valores opuestos $(-k)^2$ y $k^2$ en el mismo
    resultado.
- titulo: ¿Da el desarrollo de $(2 - x)^2$ un resultado distinto al de $(x - 2)^2$?
  respuesta: 'No'
  solucion_pasos:
  - No, ambos desarrollan exactamente el trinomio $x^2 - 4x + 4$.
errores_frecuentes:
- Declarar que $(a - b)^2$ es igual a $-$(b - a)^2$ agregando un signo menos innecesario.
- Declarar que la conmutatividad no aplica al elevar diferencias a exponentes pares.
- Afirmar que $(x - 3)^2$ y $(3 - x)^2$ tienen términos independientes de distinto
  signo.
- Cambiar únicamente el signo del doble producto al invertir los términos del binomio
  resta.
- Declarar que $(a - b)^2$ + $(b - a)^2$ = 0$ cancelando términos idénticos.
afirmaciones_verdaderas:
- La igualdad $(a - b)^2$ = $(b - a)^2$ se cumple para cualquier par de números reales
  $a$ y $b$.
- La cociente de $(a - b)^2$ entre $(b - a)^2$ es igual a 1 para todo $a \neq b$.
al_terminar_debes_poder: Al terminar serás capaz de simplificar expresiones algebraicas
  aplicando la simetría $(a - b)^2 = (b - a)^2$.
