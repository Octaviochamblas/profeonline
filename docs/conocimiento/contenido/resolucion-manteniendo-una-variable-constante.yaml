semantic_id: MAT.NUM.RAZONES_PROPORCIONES.COMPUESTA_VARIABLE_CONSTANTE
resumen_inicial: La resolución manteniendo una variable constante descompone un problema de proporcionalidad compuesta en dos o más reglas de tres simples sucesivas mediante el cálculo de un valor intermedio o puente.
explicacion_simple: "![Resolución por etapas](/static/img/nodos/resolucion-manteniendo-una-variable-constante-intro.svg)\n\nEl **método por etapas** es una alternativa muy intuitiva a la fórmula general:\n- En lugar de cambiar todo al mismo tiempo, **cambiamos una sola magnitud a la vez**:\n1. **Etapa 1:** Dejamos fija la tercera magnitud y cambiamos solo la primera para calcular un **resultado intermedio puente ($y'$)** usando una regla de tres simple.\n2. **Etapa 2:** Usamos ese resultado intermedio $y'$ y ahora cambiamos la otra magnitud para llegar al **resultado final ($x$)**.\n- **Ejemplo:** Si $3$ obreros hacen $120\\text{ m}$ en $8$ días, ¿cuánto tardan $5$ obreros en hacer $200\\text{ m}$?\n  - *Etapa 1 (fijar $120\\text{ m}$):* $3$ obreros = $8$ días $\\implies 5$ obreros = $y' = \\frac{3 \\cdot 8}{5} = 4,8\\text{ días}$.\n  - *Etapa 2 (fijar $5$ obreros):* $120\\text{ m}$ = $4,8$ días $\\implies 200\\text{ m}$ = $x = \\frac{4,8 \\cdot 200}{120} = 8\\text{ días}$."
explicacion_formal: 'Sea la transformación del estado $(A_1, B_1, C_1)$ al estado $(A_2, B_2, C_2)$ donde $A$ es la incógnita.


  **Descomposición en Cadena de Homomorfismos:**

  Se define un estado intermedio ficticio $(A'', B_2, C_1)$:


  1. **Paso 1 (Transición $B_1 \to B_2$ con $C_1 = \text{cte}$):**

  $$A'' = A_1 \cdot \phi_B(B_1, B_2)$$

  donde $\phi_B = \frac{B_2}{B_1}$ (si es directa) o $\phi_B = \frac{B_1}{B_2}$ (si es inversa).


  2. **Paso 2 (Transición $C_1 \to C_2$ con $B_2 = \text{cte}$):**

  $$A_2 = A'' \cdot \phi_C(C_1, C_2) = A_1 \cdot \phi_B(B_1, B_2) \cdot \phi_C(C_1, C_2)$$

  demostrando la estricta equivalencia matemática con la fórmula generalizada.'
definiciones_clave: '- **Estado puente / intermedio ($A''$)**: Valor que adoptaría la incógnita si solo variase la primera magnitud.

  - **Reglas de tres sucesivas**: Aplicación encadenada de proporciones simples.

  - **Invarianza de trayectoria**: El resultado final $A_2$ es idéntico independientemente de qué magnitud se varíe primero.'
propiedades_relaciones: '- **Conmutatividad**: Variar primero $B$ y luego $C$, o variar primero $C$ y luego $B$, arroja exactamente el mismo resultado final.

  - **Didáctica conceptual**: Evita la abstracción de fórmulas directas al visualizar cada paso por separado.'
ejemplo_guiado:
  enunciado: '![Ejemplos de resolución manteniendo variable constante](/static/img/nodos/resolucion-manteniendo-una-variable-constante-ejemplos.svg)


    Si $3$ obreros construyen $120\text{ m}$ de camino en $8\text{ días}$, resuelva paso a paso mediante variables constantes cuántos días tardarán $5$ obreros en construir $200\text{ m}$.'
  pasos:
  - 'Paso 1: Etapa 1: Mantener fijos los $120\text{ m}$ y variar obreros de $3$ a $5$.'
  - 'Paso 2: Como obreros y días son inversos: $y'' = \frac{3 \cdot 8}{5} = 4,8\text{ días}$ (para hacer $120\text{ m}$ con $5$ obreros).'
  - 'Paso 3: Etapa 2: Mantener fijos los $5$ obreros y variar la obra de $120\text{ m}$ a $200\text{ m}$.'
  - 'Paso 4: Como obra y días son directos: $\frac{120}{4,8} = \frac{200}{x} \implies x = \frac{4,8 \cdot 200}{120} = 8\text{ días}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué el método de etapas sucesivas produce exactamente el mismo resultado que la fórmula compuesta general?
  choices:
  - text: Porque encadena multiplicativamente las mismas razones de escala de cada magnitud paso a paso
    is_correct: true
  - text: Porque se suman los resultados intermedios
    is_correct: false
  - text: Porque solo funciona cuando los números son enteros
    is_correct: false
  - text: Por una aproximación decimal coincidente
    is_correct: false
  explanation: La alternativa correcta es 'Porque encadena multiplicativamente las mismas razones de escala de cada magnitud paso a paso'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿qué representa el valor intermedio $y' = 4,8\text{ días}$?
  choices:
  - text: Los días que tardarían los 5 obreros en hacer los 120 metros iniciales
    is_correct: true
  - text: El tiempo total para los 200 metros
    is_correct: false
  - text: Los días ahorrados en la obra
    is_correct: false
  - text: El promedio de días entre ambos grupos
    is_correct: false
  explanation: La alternativa correcta es 'Los días que tardarían los 5 obreros en hacer los 120 metros iniciales'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la primera regla de tres simple variando una sola magnitud y manteniendo fijas las restantes para hallar el valor intermedio $y''$.'
- 'Paso 2: Plantear la segunda regla de tres simple usando $y''$ como punto de partida y variando la segunda magnitud.'
- 'Paso 3: Despejar la incógnita definitiva $x$ y verificar la coherencia del resultado.'
errores_correccion: '- **Error 1: Olvidar usar el valor intermedio $y''$ en la segunda etapa.** **Cómo corregirlo:** La segunda etapa DEBE tomar como base el valor $y''$ recién calculado, no el dato original del inicio.

  - **Error 2: Redondear excesivamente $y''$.** **Cómo corregirlo:** Mantener fracciones o decimales exactos en el cálculo intermedio.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $2$ bombas llenan $500\text{ L}$ en $3\text{ h}$, ¿cuántas horas tardan $4$ bombas en llenar $500\text{ L}$ (etapa 1 a volumen constante)?
  alternativas:
  - $1,5\text{ h}$
  - $6\text{ h}$
  - $2\text{ h}$
  respuesta: $1,5\text{ h}$
  solucion_pasos:
  - 'Bombas vs Horas es inversa: $t'' = \frac{2 \cdot 3}{4} = 1,5\text{ h}$.'
- titulo: Ejemplo 2
  enunciado: Con $4$ bombas que tardan $1,5\text{ h}$ en $500\text{ L}$, ¿cuánto tardan en llenar $1.500\text{ L}$ (etapa 2 a bombas constantes)?
  alternativas:
  - $4,5\text{ h}$
  - $3\text{ h}$
  - $6\text{ h}$
  respuesta: $4,5\text{ h}$
  solucion_pasos:
  - 'Volumen vs Horas es directa: $t = \frac{1,5 \cdot 1500}{500} = 1,5 \cdot 3 = 4,5\text{ h}$.'
- titulo: ¿Importa el orden en que se elijan las magnitudes para hacer las etapas?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa de la multiplicación el resultado final es siempre idéntico.
  alternativas:
  - texto: No, el orden de las etapas no altera el resultado final
    es_correcta: true
    retroalimentacion: ¡Correcto! Propiedad conmutativa.
  - texto: Sí, las directas deben ir siempre primero
    es_correcta: false
    retroalimentacion: Incorrecto, da el mismo resultado en cualquier orden.
  - texto: Sí, las inversas deben ir primero
    es_correcta: false
    retroalimentacion: Incorrecto, el producto es conmutativo.
- titulo: ¿Es el método por etapas equivalente a la fórmula compuesta general?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambas técnicas son rigurosamente equivalentes.
  alternativas:
  - texto: Sí, ambos métodos conducen a la misma solución exacta
    es_correcta: true
    retroalimentacion: ¡Correcto! Equivalencia matemática total.
  - texto: No, el método por etapas es una aproximación
    es_correcta: false
    retroalimentacion: Incorrecto, es una solución matemática exacta.
  - texto: No, la fórmula compuesta da un resultado distinto
    es_correcta: false
    retroalimentacion: Incorrecto, ambas dan el mismo valor.
errores_frecuentes:
- Usar el dato original en lugar del valor puente $y'$ en la etapa 2.
- Clasificar mal la proporción simple en alguna de las etapas.
- Acumular errores de redondeo en el cálculo intermedio.
- Perder la noción de qué variable se mantuvo constante en cada paso.
afirmaciones_verdaderas:
- El método por etapas descompone el problema compuesto en reglas de tres simples sucesivas.
- Calcula un valor puente $y'$ que sirve de entrada para la siguiente etapa.
- Es completamente equivalente a la fórmula generalizada de proporcionalidad compuesta.
al_terminar_debes_poder: '![Síntesis de resolución por etapas](/static/img/nodos/resolucion-manteniendo-una-variable-constante-resumen.svg)


  QUÉ: Resolver problemas de proporcionalidad compuesta mediante reglas de tres simples encadenadas.


  CÓMO: Manteniendo una variable constante a la vez, calculando el valor puente intermedio $y''$ y completando la segunda transición hasta el valor final $x$.'
