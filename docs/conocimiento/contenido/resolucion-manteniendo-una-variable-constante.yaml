procedimiento:
- 'Paso 1: Ordena en una tabla de 3 o más columnas. Pon la incógnita al final.'
- 'Paso 2: Escribe la ecuación poniendo la fracción de la columna incógnita sola en un lado.'
- 'Paso 3: Multiplica el resto de columnas. Si una era inversa, dales la vuelta a sus números
  antes de multiplicar. Despeja $x$.'
errores_correccion: Evita confundir los datos de entrada al operar con resolución manteniendo
  una variable constante.
ejemplos:
- titulo: Problema completo
  enunciado: 5 obreros hacen 10 metros de muro en 4 días. ¿Cuántos días ($x$) demoran 10 obreros
    en hacer 20 metros?
  solucion_pasos:
  - 'Incógnita: Días. Días con Obreros es Inversa (invierte). Días con Metros es Directa (mantiene).'
  - 'Fracción incógnita: $4 / x$. Fracciones: Obreros $5/10$ (invierte a $10/5$), Metros $10/20$
    (mantiene $10/20$).'
  - 'Ecuación: $4/x = (10/5) \cdot (10/20) = 100/100 = 1$.'
  - $4/x = 1 \implies x = 4$ días.
- titulo: Ejemplo 2
  enunciado: Si 8 obreros hacen una obra en 15 días, ¿cuántos días demorarán 12 obreros?
  alternativas:
  - '10'
  - 22,5
  - '20'
  respuesta: '10'
  solucion_pasos:
  - 15 dividido entre x es igual a 12 dividido entre 8 (invertida); 15 por 8 es igual a 12
    por x; 120 es igual a 12x; x es igual a 10.
- titulo: Ejemplo 3
  enunciado: Si 3 impresoras imprimen 900 hojas en 2 horas, ¿cuántas horas demorarán 6 impresoras
    en imprimir la misma cantidad?
  alternativas:
  - '1'
  - '4'
  - '3'
  respuesta: '1'
  solucion_pasos:
  - 2 dividido entre x es igual a 6 dividido entre 3 (invertida); 2 por 3 es igual a 6 por
    x; 6 es igual a 6x; x es igual a 1.
- titulo: ¿Al resolver con el método de fracciones, se debe dejar la fracción de la incógnita
    sola en un lado de la ecuación?
  respuesta: Sí
  solucion_pasos:
  - Así se despeja directamente su valor con producto cruzado.
errores_frecuentes:
- Equivocarse en la simplificación de las fracciones antes de multiplicar.
- Invertir la fracción de la incógnita en lugar de la variable inversa.
- Sumar las fracciones en vez de multiplicarlas.
- No escribir los datos ordenados en la tabla, mezclando filas.
- Multiplicar las fracciones sin haber invertido antes la fracción de la magnitud inversa.
afirmaciones_verdaderas:
- La propiedad de resolución manteniendo una variable constante preserva la consistencia lógica.
- En el método de igualación de fracciones, la fracción de la magnitud con la incógnita se
  deja sola en un lado de la ecuación.
al_terminar_debes_poder: Resolver problemas aplicados que involucren resolución manteniendo
  una variable constante.
