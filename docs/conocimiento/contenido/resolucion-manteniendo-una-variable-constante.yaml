semantic_id: MAT.NUM.PROP_COMPUESTA.VARIABLE_CONSTANTE
resumen_inicial: 'Resolución manteniendo una variable constante: concepto y propiedades fundamentales
  en Proporcionalidad compuesta.'
explicacion_simple: Ahora que sabes desarmar un problema compuesto identificando qué es directo
  y qué es inverso, es hora de armar el rompecabezas. Crearemos una gran ecuación matemática
  donde todo encaja perfectamente.
explicacion_formal: 'El método general de **reducción a la unidad** o de **igualación de razones**
  para resolver proporciones compuestas sigue la siguiente estructura:


  $\frac{\text{Dato incógnita}}{\text{Incógnita } x} = (\text{Fracción } A) \cdot (\text{Fracción
  } B) \cdot ...$$


  Donde:

  - Si la variable $A$ es Directa, su fracción se escribe tal cual (Arriba/Abajo).

  - Si la variable $B$ es Inversa, su fracción se escribe invertida (Abajo/Arriba).


  Finalmente, se multiplican las fracciones del lado derecho y se aplica la regla de la cuarta
  proporcional (producto cruzado) para hallar $x$.'
definiciones_clave: '- **Resolución manteniendo una variable constante**: Elemento central
  dentro del estudio de Proporcionalidad compuesta.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a resolución manteniendo una variable constante.'
ejemplo_guiado:
  enunciado: Si 6 grifos llenan una piscina en 10 horas, ¿cuántas horas demorarán 4 grifos
    en llenar la misma piscina?
  pasos:
  - 'Identifico la incógnita: horas con 4 grifos. La relación entre grifos y horas es inversa,
    así que invierto esa fracción.'
  - 'Planteo la ecuación: 10 dividido entre x es igual a 4 dividido entre 6.'
  - 'Resuelvo con producto cruzado: 10 por 6 es igual a 4 por x, entonces 60 es igual a 4x,
    y x es igual a 15 horas.'
checkpoints:
