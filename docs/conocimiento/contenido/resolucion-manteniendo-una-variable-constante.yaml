resumen_inicial: El método de reducción por variable constante aísla los efectos parciales
  descomponiendo un problema compuesto en dos o más etapas de proporcionalidad simple
  consecutivas.
explicacion_simple: Una forma fácil de resolver proporcionalidad compuesta es hacerlo
  por pasos de dos en dos. Primero dejamos congelada una variable y calculamos el
  cambio con las otras dos; luego usamos ese resultado intermedio para calcular el
  paso final.
explicacion_formal: 'Dadas las magnitudes $A, B, C$, el **Método de Reducción por
  Variable Constante** efectúa la resolución en dos pasos de proporcionalidad simple:


  $$\text{Paso 1: Resolver } A \to A'' \text{ variando } B \text{ con } C = cst$$

  $$\text{Paso 2: Resolver } A'' \to A'''' \text{ variando } C \text{ con } B = cst$$


  El valor final $A''''$ es la solución exacta del problema compuesto.'
definiciones_clave: '- **Reducción por variable constante**: Estrategia de resolución
  por etapas encadenadas de proporcionalidad simple.'
propiedades_relaciones: '- **Descomposición por etapas**: Resuelve $A(B, C)$ descomponiendo
  en $A_1(B)$ y luego $A_2(C)$.'
ejemplo_guiado:
  enunciado: Si $2$ costureras hacen $10$ vestidos en $5$ días, ¿cuántos vestidos
    harán $4$ costureras en $5$ días?
  pasos:
  - 'Paso 1: Identificar que los días se mantienen constantes ($5$ días).'
  - 'Paso 2: Aplicar proporción directa simple entre Costureras y Vestidos: si $2$
    costureras hacen $10$, el doble ($4$) hará el doble de vestidos.'
  - 'Paso 3: Calcular $10 \cdot 2 = 20$ vestidos.'
  - 'Conclusión: Harán $20$ vestidos (manteniendo constantes los días).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste la estrategia de reducción por variable constante?
  choices:
  - text: En descomponer el problema compuesto en etapas sucesivas de regla de tres
      simple fijando variables
    is_correct: true
  - text: En borrar una variable de la tabla
    is_correct: false
  - text: En sumar todos los datos de la tabla
    is_correct: false
  - text: En multiplicar todo por 100
    is_correct: false
  explanation: La alternativa correcta es 'En descomponer el problema compuesto en
    etapas sucesivas de regla de tres simple fijando variables'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado de las costureras con días constantes, ¿cuántos vestidos
    hicieron 4 costureras?
  choices:
  - text: 20 vestidos
    is_correct: true
  - text: 10 vestidos
    is_correct: false
  - text: 40 vestidos
    is_correct: false
  - text: 15 vestidos
    is_correct: false
  explanation: La alternativa correcta es '20 vestidos'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de resolver problemas de proporcionalidad
  compuesta descomponiendo la situación en etapas de proporcionalidad simple mediante
  el congelamiento de variables.
semantic_id: MAT.NUM.PROP_COMPUESTA.VARIABLE_CONSTANTE
procedimiento:
- 'Paso 1: Identificar la variable incógnita y comparar individualmente cada magnitud
  auxiliar con ella (fijando las demás).'
- 'Paso 2: Clasificar cada magnitud como directamente proporcional (mantener razón)
  o inversamente proporcional (invertir razón).'
- 'Paso 3: Formar la ecuación generalizada y calcular la respuesta reduciendo los
  factores multiplicativos.'
errores_correccion: '- **Error 1: Comparar las magnitudes auxiliares entre sí en lugar
  de compararlas con la variable incógnita.** **Cómo corregirlo:** La comparación
  de proporcionalidad directa o inversa se DEBE hacer siempre respecto a la columna
  de la INCÓGNITA.


  - **Error 2: No invertir la razón de las magnitudes inversas al armar la fórmula.**
  **Cómo corregirlo:** Las magnitudes inversas cambian su posición $\frac{a_1}{a_2}
  \to \frac{a_2}{a_1}$ al multiplicar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_COMPUESTA.VARIABLE_CONSTANTE.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las leyes de proporcionalidad compuesta.
- titulo: Ejemplo 2
  enunciado: Verificación de la fórmula del producto de razones.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por producto de razones.
- titulo: ¿Se invierten las razones de las magnitudes inversas en la fórmula generalizada?
  respuesta: Sí
  solucion_pasos:
  - Sí, para compensar la variación inversamente proporcional.
- titulo: ¿Es necesario congelar las otras variables al clasificar una magnitud?
  respuesta: Sí
  solucion_pasos:
  - Sí, para aislar el efecto puro de esa variable sobre la incógnita.
errores_frecuentes:
- Comparar dos magnitudes auxiliares entre sí en lugar de analizar su relación individual
  con la incógnita.
- Mantener sin invertir la fracción correspondiente a una magnitud de relación inversamente
  proporcional.
- Multiplicar todos los datos numéricos del problema sin distinguir su carácter directo
  o inverso.
- Omitir congelar mentalmente las demás variables al determinar si una relación es
  directa o inversa.
- Declarar que si participan más de tres variables la relación es siempre directamente
  proporcional.
afirmaciones_verdaderas:
- La proporcionalidad compuesta combina tres o más magnitudes analizando la relación
  directa o inversa de cada una con la incógnita.
- En la fórmula generalizada de resolución, la razón de una magnitud inversa se invierte
  respecto a su estado inicial.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
