  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo tiene ángulos de 70°, 70° y 40°, y uno de los lados opuestos
    a un ángulo de 70° mide 10 cm, ¿cuánto mide el otro lado opuesto a 70°?
  choices:
  - text: 10 cm exactamente (por la equivalencia lados-ángulos opuestos)
