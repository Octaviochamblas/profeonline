semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.ISOSCELES_LADOS_ANGULOS
resumen_inicial: 'En geometría euclidiana existe una equivalencia lógica bicondicional
  fundamental: un triángulo tiene dos lados congruentes si y sólo si los dos ángulos
  opuestos a ellos son congruentes.'
explicacion_simple: '![Equivalencia Lados y Ángulos](/static/img/nodos/equivalencia-entre-lados-iguales-y-angulos-opuestos-iguales-en-un-triangulo-isosceles-intro.svg)


  En los triángulos, los lados y los ángulos opuestos son inseparables: si dos lados
  miden lo mismo, **los dos ángulos que tienen al frente miden lo mismo**; y al revés,
  si descubres que dos ángulos miden lo mismo, **los dos lados de enfrente miden exactamente
  lo mismo**. ¡Es una calle de doble sentido!'
explicacion_formal: '### Teorema de congruencia lado-ángulo

  En cualquier triángulo $\Delta ABC$, dos lados son de igual medida si y solo si
  sus respectivos ángulos interiores opuestos son congruentes:


  $$a = b \iff \alpha = \beta$$


  $$\overline{BC} \cong \overline{AC} \iff \angle A \cong \angle B$$


  ### Desglose simbólico y geométrico

  - Doble implicación $(\iff)$: Caracteriza tanto la definición del isósceles/equilátero
  como su teorema recíproco.

  - Caso 3 lados: $a = b = c \iff \alpha = \beta = \gamma = 60^\circ$.


  ### Síntesis didáctica

  La equivalencia bicondicional entre igualdad de lados e igualdad de ángulos es la
  regla de oro para identificar triángulos isósceles en demostraciones geométricas.'
definiciones_clave: '- **Teorema bicondicional**: Doble implicación lógica $P \iff
  Q$ ($P \implies Q$ y $Q \implies P$).

  - **Teorema recíproco**: Demostración de que la igualdad angular produce la igualdad
  métrica de lados.

  - **Correspondencia opuesta**: Cada lado determina el ángulo que se encuentra al
  frente de él. '
propiedades_relaciones: '- **Ley de Senos**: Esta equivalencia es la base directa
  del Teorema del Seno: $\frac{b}{\\sin\beta} = \frac{c}{\\sin\gamma} \implies \\sin\beta
  = \\sin\gamma \iff b = c$.

  - **Extensión a tres elementos**: $a = b = c \iff \alpha = \beta = \gamma$ (caracterización
  completa del equilátero). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Equivalencia](/static/img/nodos/equivalencia-entre-lados-iguales-y-angulos-opuestos-iguales-en-un-triangulo-isosceles-ejemplos.svg)


    En un triángulo $\\triangle ABC$, los ángulos interiores miden $\alpha = 50^\circ$
    y $\beta = 65^\circ$. Si el lado opuesto a $\beta$ mide $b = 8\text{ cm}$, calcula
    la medida del ángulo $\gamma$ y la longitud del lado $c$.'
  pasos:
  - 'Paso 1: Calcular el tercer ángulo interior: $\gamma = 180^\circ - (50^\circ +
    65^\circ) = 180^\circ - 115^\circ = 65^\circ$.'
  - 'Paso 2: Observar que $\beta = \gamma = 65^\circ$ (dos ángulos interiores son
    iguales).'
  - 'Paso 3: Aplicar el teorema recíproco: como $\beta = \gamma$, los lados opuestos
    deben ser iguales ($b = c$).'
  - 'Paso 4: Deducir la longitud del lado $c$: como $b = 8\text{ cm}$, entonces $c
    = 8\text{ cm}$.'
  - 'Paso 5: Concluir que $\gamma = 65^\circ$ y el lado $c = 8\text{ cm}$.'
