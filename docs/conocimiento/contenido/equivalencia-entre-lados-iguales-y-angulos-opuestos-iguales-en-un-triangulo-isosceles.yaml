  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si los datos dados son dos lados iguales o dos ángulos iguales.'
- 'Paso 2: Si se conocen dos lados iguales, deducir que sus ángulos opuestos son iguales.'
- 'Paso 3: Si se conocen dos ángulos iguales, deducir que sus lados opuestos son de
  igual longitud.'
- 'Paso 4: Utilizar esta correspondencia para plantear y resolver ecuaciones geométricas.'
errores_correccion: Asegúrate de emparejar cada ángulo con el lado que tiene enfrente
  (lado opuesto), no con los lados que salen de su vértice.
ejemplos:
- titulo: Ejemplo 1
  enunciado: En el triángulo $\triangle ABC$, si $\angle A = \angle B$, ¿cuáles dos
    lados son obligatoriamente iguales?
  alternativas:
  - $\overline{BC} = \overline{AC}$
  - $\overline{AB} = \overline{BC}$
  - $\overline{AB} = \overline{AC}$
  respuesta: $\overline{BC} = \overline{AC}$
  solucion_pasos:
  - El lado opuesto a $\angle A$ es $\overline{BC}$ y el lado opuesto a $\angle B$
    es $\overline{AC}$. Por tanto $\overline{BC} = \overline{AC}$.
- titulo: Ejemplo 2
  enunciado: Si en un triángulo $\overline{PQ} = \overline{PR} = 14\text{ cm}$, ¿cuáles
    dos ángulos son iguales?
  alternativas:
  - $\angle Q = \angle R$
  - $\angle P = \angle Q$
  - $\angle P = \angle R$
  respuesta: $\angle Q = \angle R$
  solucion_pasos:
  - El vértice $P$ es el común; por tanto, los ángulos en los extremos $Q$ y $R$ son
    iguales ($\angle Q = \angle R$).
- titulo: ¿Si dos ángulos de un triángulo son iguales, sus lados opuestos son iguales?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el Teorema Recíproco del Triángulo Isósceles.
- titulo: ¿Un lado igual se corresponde con el ángulo contiguo que comparte su mismo
    vértice?
  respuesta: 'No'
  solucion_pasos:
  - No, la correspondencia es estrictamente con el ángulo OPUESTO que está enfrente.
errores_frecuentes:
- Emparejar el lado con el ángulo adyacente en vez del opuesto.
- No reconocer que la propiedad funciona en ambos sentidos ($\iff$).
- Pensar que se requiere conocer la base para aplicar el teorema.
- Asumir que la equivalencia solo es válida si el triángulo está en posición estándar.
- Confundir los nombres de los vértices al enunciar los lados opuestos.
afirmaciones_verdaderas:
- Dos lados de un triángulo son iguales si y sólo si sus ángulos opuestos son iguales.
- La equivalencia permite clasificar un triángulo como isósceles a partir de sus ángulos
  o de sus lados indistintamente.
al_terminar_debes_poder: '**QUÉ:** Aplicar la equivalencia bicondicional entre lados
  congruentes y ángulos opuestos congruentes.


  **CÓMO:** Deducir longitudes de lados a partir de ángulos conocidos y viceversa
  ($b = c \iff \beta = \gamma$).


  ![Resumen de Equivalencia Lados-Ángulos](/static/img/nodos/equivalencia-entre-lados-iguales-y-angulos-opuestos-iguales-en-un-triangulo-isosceles-resumen.svg)'
