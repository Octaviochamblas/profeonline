semantic_id: MAT.ALG.FRACCIONES_BASE.FACTORES_OPUESTOS
resumen_inicial: 'Simplificación de factores opuestos mediante factor negativo: concepto,
  reglas operativas y simplificación en Fracciones algebraicas base.'
explicacion_simple: ¿Qué pasa si intentas simplificar dos expresiones que son idénticas,
  pero donde alguien las escribió exactamente al revés? En las restas algebraicas
  esto sucede todo el tiempo.
explicacion_formal: '### Definición formal


  (x-y) = -(-x+y) = -(y-x). Al dividir por (y-x), queda el -1.


  ### Desarrollo didáctico


  En tu camino algebraico te encontrarás con una confusión visual muy común: los factores
  opuestos. Tienes un paréntesis arriba como $(a - b)$ y abajo tienes $(b - a)$.


  Se ven casi idénticos, pero están al revés debido a la resta. No puedes tacharlos
  directamente. $(5 - 3)$ no es lo mismo que $(3 - 5)$.


  Sin embargo, puedes aplicar un truco maestro de factorización:

  **Extracción del factor negativo (-1).**


  Si sacas un signo negativo fuera de un paréntesis, los signos internos se invierten.

  - Tienes $(b - a)$.

  - Sacas un $-1$: $-( -b + a )$.

  - Lo reordenas para que se vea bonito: $-(a - b)$.


  relación algebraica. Ahora tienes el mismo paréntesis que arriba, pero con un signo
  menos adelante. Si tenías $\frac{a - b}{b - a}$, esto se convierte en $\frac{a -
  b}{-(a - b)}$. Ahora puedes tachar los paréntesis idénticos. El resultado no es
  1, es **$-1$**.'
