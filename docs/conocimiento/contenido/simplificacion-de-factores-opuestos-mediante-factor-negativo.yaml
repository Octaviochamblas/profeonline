semantic_id: MAT.ALG.FRACCIONES_BASE.FACTORES_OPUESTOS
resumen_inicial: La simplificación de factores opuestos mediante factor negativo consiste en extraer un $-1$ de un binomio
  de la forma $(b - a)$ para transformarlo en $-(a - b)$ y cancelar el factor común resultando en un cociente $-1$.
explicacion_simple: "A veces en una fracción encuentras paréntesis que **PARECEN CASI IGUALES, PERO TIENEN LOS SIGNOS AL REVÉS**\
  \ (ej: $\\frac{a - b}{b - a}$):\n- **TÉCNICA DEL FACTOR NEGATIVO (EL TRUCO DEL $-1$)**:\n  1. Reemplaza el paréntesis invertido\
  \ $(b - a)$ por **$-(a - b)$**:\n     $$\\frac{a - b}{b - a} = \\frac{a - b}{-(a - b)}$$\n  2. Ahora los paréntesis son\
  \ exactamente iguales. ¡Los cancelas!:\n     $$\\frac{\\cancel{(a - b)}}{-\\cancel{(a - b)}} = \\mathbf{\\frac{1}{-1} =\
  \ -1}$$\n- **REGLA DE ORO DE LOS FACTORES OPUESTOS**:\n  $$\\mathbf{\\frac{a - b}{b - a} = -1} \\quad \\text{y} \\quad \\\
  mathbf{\\frac{x - y}{y - x} = -1}$$\n  - ¡Al dividir dos binomios restados con los términos invertidos, el resultado de\
  \ la cancelación es **SIEMPRE $-1$**!\n\n![Simplificación de factores opuestos](/static/img/nodos/simplificacion-de-factores-opuestos-mediante-factor-negativo-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $A(x), B(x) \in \mathbb{K}[x]$ con $A(x) \neq B(x)$. Los binomios $H_1(x) = A(x) - B(x)$ y $H_2(x) = B(x) - A(x)$ son
  **factores opuestos aditivos** en el Anillo de Polinomios, satisfaciendo la relación exacta:


  $$H_2(x) = -1 \cdot H_1(x) \iff (B(x) - A(x)) = -(A(x) - B(x))$$


  ### Teorema de Simplificación de Opuestos

  Para cualquier función racional conteniendo factores opuestos en el numerador y denominador:


  $$\frac{P(x)(A(x) - B(x))}{Q(x)(B(x) - A(x))} = \frac{P(x)(A(x) - B(x))}{Q(x)(-(A(x) - B(x)))} = \frac{P(x)}{-Q(x)} = \mathbf{-\frac{P(x)}{Q(x)}}$$


  con la restricción de dominio obligatoria $A(x) \neq B(x)$.


  ### Síntesis didáctica

  Dividir dos factores binómicos restados con términos invertidos equivale a cancelar dichos factores introduciendo un coeficiente
  negativo $-1$ en el resultado.

  '
definiciones_clave: '- **Factores opuestos aditivos**: Par de binomios restados cuyos términos tienen signos contrarios ($(a
  - b)$ y $(b - a)$).

  - **Factorización del $-1$**: Extracción de una constante negativa que invierte el orden de la sustracción: $b - a = -(a
  - b)$.

  - **Cociente de opuestos**: Resultado numérico constante igual a $-1$ obtenido al simplificar $\frac{a - b}{b - a}$.

  '
propiedades_relaciones: '- **Diferencia con suma de términos**: Los factores sumados $(a + b)$ y $(b + a)$ son IDENTICOS por
  conmutatividad ($\frac{a+b}{b+a} = +1$), pero los restados invertidos son OPUESTOS ($\frac{a-b}{b-a} = -1$).

  '
ejemplo_guiado:
  enunciado: Simplifica la fracción algebraica $\frac{x^2 - 16}{4 - x}$.
  pasos:
  - 'Paso 1: Factorizamos la diferencia de cuadrados en el numerador: $x^2 - 16 = (x - 4)(x + 4)$.'
  - 'Paso 2: Reescribimos la fracción con el denominador original: $\frac{(x - 4)(x + 4)}{4 - x}$.'
  - 'Paso 3: Observamos que $(x - 4)$ y $(4 - x)$ son factores opuestos. Factorizamos $-1$ del denominador: $4 - x = -(x -
    4)$.'
  - 'Paso 4: Sustituimos y cancelamos el factor común $(x - 4)$: $\frac{(x - 4)(x + 4)}{-(x - 4)} = \frac{\cancel{(x - 4)}(x
    + 4)}{-\cancel{(x - 4)}} = \frac{x + 4}{-1} = \mathbf{-(x + 4)}$.'
  - 'Paso 5: Distribuimos el signo menos: $-(x + 4) = \mathbf{-x - 4}$.'
  - 'Conclusión: La expresión simplificada es **$-(x + 4)$** (o $-x - 4$) con $x \neq 4$.'
  imagen: /static/img/nodos/simplificacion-de-factores-opuestos-mediante-factor-negativo-ejemplos.svg
