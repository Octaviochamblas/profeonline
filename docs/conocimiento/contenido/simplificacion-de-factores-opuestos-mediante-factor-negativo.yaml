procedimiento:
- 'Paso 1: Identificar si en el numerador y denominador existen binomios con la misma resta en orden invertido ($(a - b)$
  y $(b - a)$).'
- 'Paso 2: Factorizar $-1$ en uno de los dos binomios, transformando por ejemplo $(b - a)$ en $-(a - b)$.'
- 'Paso 3: Cancelar el factor binómico idéntico resultante.'
- 'Paso 4: Multiplicar el resto de la expresión por el factor constante $-1$ o cambiar el signo del resultado final.'
errores_correccion: '- **Error 1:** Cancelar $(a - b)$ con $(b - a)$ obteniendo $+1$ en lugar de $-1$. **Cómo corregirlo:**
  La resta no es conmutativa; la división de factores opuestos **GENERA OBLIGATORIAMENTE UN FACTOR CONSTANTE DE $-1$ ($\frac{a-b}{b-a}
  = -1$)**.

  - **Error 2:** Declarar que la suma $a + b$ y $b + a$ son factores opuestos. **Cómo corregirlo:** La suma es conmutativa;
  el cociente $\frac{a+b}{b+a}$ **ES IGUAL A $+1$ (no lleva signo negativo)**.

  '
ejemplos:
- titulo: División directa de opuestos
  enunciado: Para $\frac{x - 5}{5 - x}$, ¿es el resultado $-1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, son factores opuestos.
- titulo: Suma conmutativa
  enunciado: Para $\frac{x + 5}{5 + x}$, ¿es el resultado $+1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la suma es conmutativa.
- titulo: Simplificación con binomio opuesto
  enunciado: Para $\frac{2(x - 1)}{1 - x}$, ¿es el resultado $-2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2 \cdot (-1) = -2$.
- titulo: Cuadrado de resta
  enunciado: Para $(x - y)^2$ y $(y - x)^2$, ¿son expresiones idénticas?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-1)^2 = 1$.
errores_frecuentes:
- Cancelar factores opuestos aditivos produciendo $+1$ en lugar del signo correcto $-1$.
- Tratar la suma $(b + a)$ como si fuera un factor opuesto a $(a + b)$ en lugar de reconocer su igualdad.
- La distribución del signo negativo al resto de los factores tras simplificar opuestos no es ejecutada.
- Invertir arbitrariamente el signo de una suma.
- Olvidar que la resta es anti-conmutativa mientras que la adición es conmutativa.
afirmaciones_verdaderas:
- La simplificación de dos factores opuestos de la forma $\frac{a - b}{b - a}$ genera siempre el coeficiente $-1$.
- La adición es conmutativa ($\frac{a+b}{b+a} = 1$), pero la sustracción es anti-conmutativa ($\frac{a-b}{b-a} = -1$).
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/simplificacion-de-factores-opuestos-mediante-factor-negativo-resumen.svg)


  QUÉ: Simplificar factores opuestos aditivos extrayendo el factor $-1$ para obtener fracciones irreductibles.

  CÓMO: Identificar binomios con restas invertidas $(a - b)$ y $(b - a)$, factorizar $-1$ para transformar $b - a = -(a -
  b)$, y cancelar el factor común asignando el cociente resultante igual a $-1$ ($\frac{a-b}{b-a} = -1$).

  '
