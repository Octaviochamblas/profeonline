semantic_id: MAT.ALG.FRACCIONES_BASE.FACTORES_OPUESTOS
resumen_inicial: Los factores opuestos de la forma (a - b) y (b - a) se simplifican
  a -1 mediante la factorización de un signo negativo.
explicacion_simple: 'A veces en una fracción aparecen factores casi idénticos pero
  con restas invertidas, como (x - 3) arriba y (3 - x) abajo.

  Estos términos se llaman factores opuestos. Para simplificarlos, factorizamos un
  signo menos (-1) de uno de ellos, convirtiendo (3 - x) en -(x - 3).

  Al cancelar el paréntesis común (x - 3), el cociente entre dos factores opuestos
  es siempre igual a -1.'
explicacion_formal: 'Para cualquier par de expresiones no nulas $(a - b)$ y $(b -
  a)$ con $a \neq b$, la **propiedad de factores opuestos** establece:


  $$(b - a) = -(a - b) \quad \implies \quad \frac{a - b}{b - a} = \frac{a - b}{-(a
  - b)} = -1$$


  **Desglose de la fórmula:**

  - $(b - a) = -(a - b)$: Factorización del signo $-1$ para igualar los términos entre
  paréntesis.

  - $\frac{a - b}{b - a} = -1$: Resultado constante de simplificar dos binomios opuestos
  en cualquier fracción algebraica.'
definiciones_clave: '- **Factores opuestos**: Binomios de la forma $(a - b)$ y $(b
  - a)$ cuyo cociente es siempre igual a $-1$.

  - **Factorización de signo negativo**: Extracción de un factor $-1$ para invertir
  el orden de una resta.'
propiedades_relaciones: '- **Cociente constante**: La simplificación de dos factores
  opuestos jamás da $1$, da exactamente $-1$.

  - **Cuadrados de opuestos**: $(a - b)^2 = (b - a)^2$, por lo que con exponentes
  pares el signo negativo desaparece.'
ejemplo_guiado:
  enunciado: Simplifica la fracción $\frac{x^2 - 25}{5 - x}$ utilizando la propiedad
    de factores opuestos y evalúa el resultado para $x = 3$.
  pasos:
  - 'Paso 1: Factorizar el numerador por diferencia de cuadrados: $x^2 - 25 = (x -
    5)(x + 5)$.Paso 2: Reescribir el denominador $5 - x$ factorizando un signo menos:
    $5 - x = -(x - 5)$.Paso 3: Sustituir y cancelar $(x - 5)$: $\frac{(x - 5)(x +
    5)}{-(x - 5)} = \frac{x + 5}{-1} = -(x + 5)$.Paso 4: Evaluar para $x = 3$: $-(3
    + 5) = -8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué valor equivale el cociente entre dos factores opuestos $\frac{a
    - b}{b - a}$ para $a \neq b$?
  choices:
  - text: $-1$
    is_correct: true
  - text: $1$
    is_correct: false
  - text: $0$
    is_correct: false
  - text: $a - b$
    is_correct: false
  explanation: La alternativa correcta es '$-1$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al simplificar $\frac{x^2 - 25}{5 - x}$ y evaluar la expresión reducida
    para $x = 3$, ¿cuál es el resultado obtenido?
  choices:
  - text: $-8$
    is_correct: true
  - text: $8$
    is_correct: false
  - text: $-2$
    is_correct: false
  - text: $2$
    is_correct: false
  explanation: La alternativa correcta es '$-8$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar el numerador y denominador de la fracción.'
- 'Paso 2: Identificar si existen binomios opuestos con signos invertidos de la forma
  $(a - b)$ y $(b - a)$.'
- 'Paso 3: Extraer un factor $-1$ de uno de los binomios opuestos para igualar los
  paréntesis.'
- 'Paso 4: Cancelar los paréntesis idénticos conservando el factor $-1$ multiplicando
  a la fracción restante.'
errores_correccion: '- **Error común:** Cancelar $(x - 5)$ con $(5 - x)$ y asumir
  que el cociente es igual a $+1$.

  - **Cómo corregirlo:** Recuerda que $(x - 5)$ y $(5 - x)$ son OPUESTOS. Al cancelarlos
  siempre queda un factor $-1$ en la expresión.'
