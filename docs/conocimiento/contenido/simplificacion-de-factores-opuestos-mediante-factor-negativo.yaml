procedimiento:
- 'Paso 1: Revisa si el polinomio de arriba tiene EXACTAMENTE los mismos términos
  que el de abajo, pero con todos los signos invertidos.'
- 'Paso 2: Esta situación es muy común en restas invertidas como $(a-b)$ y $(b-a)$.'
- 'Paso 3: Cancela todo el bloque de arriba con todo el de abajo y reemplázalos por
  un $-1$.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en simplificación de factores opuestos mediante factor negativo.
ejemplos:
- titulo: Simplifica $\frac{3m - 2n}{2n - 3m}$
  enunciado: Simplifica $\frac{3m - 2n}{2n - 3m}$.
  solucion_pasos:
  - La 'm' arriba es $+3$, abajo es $-3$.
  - La 'n' arriba es $-2$, abajo es $+2$.
  - Son opuestos perfectos.
  - Cancelamos y el resultado es $-1$.
- titulo: Simplifica $\frac{x+y}{y+x}$.
  solucion_pasos:
  - ¡Cuidado! Son sumas, y la suma es conmutativa. $x+y$ es exactamente igual a $y+x$,
    no son opuestos. El resultado es 1.
- titulo: 'Respecto de «Simplificación de factores opuestos mediante factor negativo»:
    ¿Se ajusta a la'
  enunciado: 'Respecto de «Simplificación de factores opuestos mediante factor negativo»:
    ¿Se ajusta a la definición esta afirmación? «Cualquier binomio dividido por su
    exacto opuesto invertido matemáticamente, de la forma $\frac{a-b}{b-a}$, siempre
    da como resultado $-1$ (siempre que $a \neq b$)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Cualquier binomio dividido por
    su exacto opuesto invertido matemáticamente, de la forma $\frac{a-b}{b-a}$, siempre
    da como resultado $-1$ (siempre que $a \neq b$).'
- titulo: 'Respecto de «Simplificación de factores opuestos mediante factor negativo»:
    ¿Es compatible c'
  enunciado: 'Respecto de «Simplificación de factores opuestos mediante factor negativo»:
    ¿Es compatible con el procedimiento esta afirmación? «Creer que $\frac{a-b}{b-a}
    = 1$ (ignorar los signos)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Cualquier binomio dividido por
    su exacto opuesto invertido matemáticamente, de la forma $\frac{a-b}{b-a}$, siempre
    da como resultado $-1$ (siempre que $a \neq b$).'
errores_frecuentes:
- Creer que $\frac{a-b}{b-a} = 1$ (ignorar los signos).
- Confundir la suma con la resta (creer que $\frac{a+b}{b+a} = -1$).
- Tachar un $(a-b)$ con un $(a+b)$ que no son opuestos, sino diferentes.
- Para «¿Cuál es la justificación matemática de que $\frac{x-y}{y-x} = -1$», la respuesta
  correcta es Porque las variables se anulan a cero y queda un uno.
- Para «¿Cuál es la justificación matemática de que $\frac{x-y}{y-x} = -1$», la respuesta
  correcta es Es un axioma indemostrable.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
