  - text: Ambas expresiones dan como resultado $-1$
    is_correct: false
  - text: Ninguna se puede simplificar
    is_correct: false
  explanation: La alternativa correcta es 'La suma $\frac{x+2}{2+x} = +1$ (conmutativa), mientras que la resta $\frac{x-2}{2-x}
    = -1$ (factores opuestos)'. Conmutatividad de la adición vs anti-conmutatividad de la sustracción.
