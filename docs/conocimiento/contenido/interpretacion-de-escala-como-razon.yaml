procedimiento:
- 'Paso 1: Lee la escala en el formato 1:E.'
- 'Paso 2: Recuerda que el ''1'' representa el dibujo y la ''E'' representa la realidad.'
- 'Paso 3: Interpreta: ''1 cm en el mapa son E cm en la vida real''.'
errores_correccion: Evita confundir los datos de entrada al operar con interpretación de escala
  como razón.
ejemplos:
- titulo: Escala de un mapa
  enunciado: ¿Qué significa que un mapa tenga escala 1:50.000?
  solucion_pasos:
  - El primer número (1) es el plano. El segundo (50.000) es la realidad.
  - Significa que 1 centímetro en el mapa equivale a 50.000 centímetros reales.
  - (Que equivalen a 500 metros).
- titulo: Escala de ampliación
  enunciado: ¿Qué significa una escala 10:1 en un microscopio?
  solucion_pasos:
  - Significa que el dibujo o lente muestra 10 unidades por cada 1 unidad real.
  - Es una ampliación (el dibujo es más grande que la realidad).
- titulo: Ejemplo 3
  enunciado: ¿Qué representa el 500 en una escala 1:500?
  alternativas:
  - Que 1 unidad del plano equivale a 500 unidades reales
  - Que el plano mide 500 veces menos que 1
  - Que hay 500 planos distintos
  respuesta: Que 1 unidad del plano equivale a 500 unidades reales
  solucion_pasos:
  - Así se interpreta el segundo número de la escala.
- titulo: ¿Una escala 5:1 representa una ampliación?
  respuesta: Sí
  solucion_pasos:
  - El dibujo es 5 veces más grande que el objeto real.
errores_frecuentes:
- Creer que la escala 1:100 significa que 1 cm equivale a 100 metros (son 100 centímetros,
  o sea 1 metro).
- Invertir los números creyendo que 100:1 es una reducción.
- Olvidar que las escalas son adimensionales (no llevan la palabra 'cm' pegada en la razón).
- Creer que la escala 1:100 significa que 1 centímetro equivale a 100 metros, cuando en realidad
  equivale a 100 centímetros, o sea 1 metro.
- Invertir los números de la escala, confundiendo una ampliación con una reducción.
afirmaciones_verdaderas:
- La propiedad de interpretación de escala como razón preserva la consistencia lógica.
- En una escala 1:E, el número E siempre representa cuántas veces más grande es la medida
  real respecto a la del plano.
al_terminar_debes_poder: Resolver problemas aplicados que involucren interpretación de escala
  como razón.
