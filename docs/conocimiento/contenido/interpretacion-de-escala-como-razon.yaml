semantic_id: MAT.NUM.REPARTO_ESCALAS.ESCALA_RAZON
resumen_inicial: 'La escala $E$ es la razón matemática de proporcionalidad entre la dimensión de un objeto representado en un plano, mapa o dibujo ($d$) y la dimensión real correspondiente ($R$): $E = \frac{d}{R}$.'
explicacion_simple: |
  Una escala indica cuántas veces se ha achicado o agrandado la realidad para poder dibujarla en un papel o pantalla. Se escribe como una razón $1 : N$ o $\frac{1}{N}$. Por ejemplo, una escala de $1 : 100$ en un plano significa que **$1\text{ centímetro}$ en el plano representa $100\text{ centímetros}$ ($1\text{ metro}$) en el mundo real**. Para usar escalas correctamente, debes asegurarte de medir ambas cantidades en la misma unidad de medida.
explicacion_formal: |
  ### Definición formal
  La **escala numérico-lineal** $E$ de una representación gráfica es el cociente constante entre la longitud en la representación $d$ y la longitud real $R$, expresadas en la **misma unidad de medida**:
  $$E = \frac{d}{R} \quad \iff \quad d = E \cdot R$$

  ### Tipos de escalas numéricas
  1. **Escala de reducción ($E < 1$ o $1 : N$ con $N > 1$)**: La representación es más pequeña que la realidad (ej: $1 : 50.000$ en un mapa geográfico).
  2. **Escala natural ($E = 1$ o $1 : 1$)**: Las dimensiones del dibujo coinciden exactamente con la realidad.
  3. **Escala de ampliación ($E > 1$ o $N : 1$ con $N > 1$)**: La representación es más grande que el objeto real (ej: $10 : 1$ al dibujar una célula bajo un microscopio).

  ### Unificación estricta de unidades de medida
  Para que la escala $1 : N$ sea correcta, la razón debe calcularse en unidades homogéneas (ej: $\text{cm}$ sobre $\text{cm}$).
  $$1\text{ km} = 1.000\text{ m} = 100.000\text{ cm}$$

  ### Síntesis didáctica
  - Fórmula fundamental: $E = \frac{\text{Dibujo}}{\text{Realidad}}$.
  - Formato estándar de reducción: $1 : N \implies 1\text{ cm en el plano} = N\text{ cm en la realidad}$.
definiciones_clave: |
  - **Escala numérica $1:N$**: Razón que compara las dimensiones lineales del dibujo respecto a la realidad en las mismas unidades.
  - **Escala gráfica**: Barra graduada impresa en un mapa que representa visualmente las distancias reales en el terreno.
  - **Factor de escala $N$**: Denominador de la razón de reducción que actúa como multiplicador para hallar la medida real.
propiedades_relaciones: |
  - **Escala de áreas ($E^2$)**: La razón entre el área en el dibujo $A_d$ y el área en la realidad $A_R$ es igual al cuadrado de la escala lineal: $\frac{A_d}{A_R} = E^2 = \frac{1}{N^2}$.
  - **Independencia de unidades en la razón**: Una escala $1 : 500$ es una constante adimensional; funciona igual midiendo en centímetros, metros o pulgadas.
ejemplo_guiado:
  enunciado: 'En un mapa la escala es $1 : 250.000$. Interpreta su significado cuantitativo en centímetros y metros.'
  pasos:
    - 'Paso 1: Escribimos la razón de la escala: $E = \frac{1}{250.000}$.'
    - 'Paso 2: Interpretamos en la unidad base (centímetros): $1\text{ cm}$ en el mapa representa $250.000\text{ cm}$ en el terreno real.'
    - 'Paso 3: Convertimos los centímetros reales a metros dividiendo entre $100$: $250.000\text{ cm} = 2.500\text{ metros}$.'
    - 'Paso 4: Convertimos los metros a kilómetros dividiendo entre $1.000$: $2.500\text{ m} = 2.5\text{ km}$. Conclusión: **$1\text{ cm}$ en el mapa equivale a $2.5\text{ km}$ en la realidad**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué significa que un plano arquitectónico tenga una escala de $1 : 50$?'
    choices:
      - {text: 'Que $1\text{ cm}$ en el plano representa $50\text{ cm}$ ($0.5\text{ metros}$) en la construcción real', is_correct: true}
      - {text: 'Que el dibujo es 50 veces más grande que la realidad', is_correct: false}
      - {text: 'Que la casa mide 50 metros cuadrados', is_correct: false}
      - {text: 'Que hay 50 habitaciones en el plano', is_correct: false}
    explanation: 'La alternativa correcta es ''Que $1\text{ cm}$ en el plano representa $50\text{ cm}$ ($0.5\text{ metros}$) en la construcción real''. $1:N$ indica que $1\text{ unidad dibujo} = N\text{ unidades reales}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si al dibujar un insecto de $5\text{ mm}$ de largo en una lámina mide $50\text{ mm}$, ¿cuál es la escala utilizada y de qué tipo es?'
    choices:
      - {text: 'Escala $10 : 1$, que es una escala de ampliación ($50 / 5 = 10$)', is_correct: true}
      - {text: 'Escala $1 : 10$, de reducción', is_correct: false}
      - {text: 'Escala $1 : 1$, de tamaño natural', is_correct: false}
      - {text: 'Escala $1 : 50$, de reducción', is_correct: false}
    explanation: 'La alternativa correcta es ''Escala $10 : 1$, que es una escala de ampliación ($50 / 5 = 10$)''. $E = 50 / 5 = 10 / 1 \implies$ Ampliación $10:1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la medida del dibujo $d$ y la medida de la realidad $R$.'
  - 'Paso 2: Convertir ambas medidas a la misma unidad de longitud (ej: ambas a centímetros).'
  - 'Paso 3: Formar la fracción de razón $E = \frac{d}{R}$.'
  - 'Paso 4: Simplificar la fracción hasta dejarla en el formato $1 : N$ (reducción) o $N : 1$ (ampliación).'
errores_correccion: |
  - **Error 1:** Calcular la escala mezclando unidades diferentes (ej: poner centímetros en el numerador y kilómetros en el denominador sin convertir). **Cómo corregirlo:** La escala exige **igualar las unidades de medida antes de simplificar** la razón.
  - **Error 2:** Confundir la escala de reducción ($1:N$) con la de ampliación ($N:1$). **Cómo corregirlo:** Si el dibujo es más pequeño que la realidad, **el 1 va a la izquierda ($1:N$)**; si el dibujo es más grande, **el 1 va a la derecha ($N:1$)**.
ejemplos:
  - titulo: 'Interpretación de escala de mapa'
    enunciado: 'En un mapa $1 : 100.000$, ¿$1\text{ cm}$ en el mapa representa $1\text{ km}$ en la realidad?'
    alternativas:
      - 'Sí, pues $100.000\text{ cm} = 1.000\text{ m} = 1\text{ km}$'
      - 'No, representa 10 km'
      - 'No, representa 100 m'
    respuesta: 'Sí, pues $100.000\text{ cm} = 1.000\text{ m} = 1\text{ km}$'
    solucion_pasos:
      - '1. Escala: $1\text{ cm} = 100.000\text{ cm}$.'
      - '2. Conversión: $100.000 / 100 = 1.000\text{ m} = 1\text{ km}$.'
  - titulo: 'Escala adimensional'
    enunciado: '¿La razón de escala $1 : 500$ carece de unidades fijas y se aplica igual a pulgadas o metros?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser un cociente de magnitudes homogéneas, es adimensional.'
  - titulo: 'Escala de plano de casa'
    enunciado: 'En una escala $1 : 50$, ¿$2\text{ cm}$ en el plano corresponden a $1\text{ metro}$ real?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $2\text{ cm} \cdot 50 = 100\text{ cm} = 1\text{ m}$.'
  - titulo: 'Relación de escala de superficies'
    enunciado: 'Si la escala lineal es $1 : 100$, ¿la escala de superficies es $1 : 10.000$ ($100^2$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Las superficies se escalan al cuadrado de la escala lineal ($E^2$).'
errores_frecuentes:
  - 'Calcular el valor de la escala combinando unidades de medida distintas sin realizar la conversión previa.'
  - 'Invertir la escala escribiendo la medida real en el numerador $R / d$.'
  - 'Las escalas de reducción $1:N$ poseen idéntica estructura que las escalas de ampliación $N:1$.'
  - 'La escala de áreas varía en la misma proporción lineal $E$ que las distancias.'
  - 'Considerar que la escala es una cantidad con dimensión física expresada obligatoriamente en centímetros.'
afirmaciones_verdaderas:
  - 'La escala $E = \frac{d}{R}$ es la razón adimensional que compara la dimensión del dibujo $d$ con la dimensión real $R$ en unidades idénticas.'
  - 'Una escala de reducción de la forma $1 : N$ indica que 1 unidad medida en el plano equivale a $N$ unidades de la misma medida en la realidad.'
al_terminar_debes_poder: 'Interpretar y formular escalas como razones de proporcionalidad $E = \frac{d}{R}$ en unidades homogéneas.'
