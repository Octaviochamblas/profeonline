resumen_inicial: 'Una escala de dibujo o mapa es la razón entre la medida representada
  en el plano $d$ y su medida real correspondiente $R$, expresada como $\text{Escala}
  = \frac{d}{R} = 1 : n$.'
explicacion_simple: 'La escala de un plano o mapa nos dice cuántas veces se redujo
  o amplió la realidad para dibujarla en el papel. Una escala de $1 : 100$ significa
  que cada $1\text{ cm}$ en el papel representa $100\text{ cm}$ reales.'
explicacion_formal: 'La **Escala $E$** es la razón adimensional entre la medida en
  la representación $d$ y la medida en el mundo real $R$, expresadas en las mismas
  unidades de medida:


  $$E = \frac{d}{R} = \frac{1}{n} \iff d : R = 1 : n$$


  **Clasificación de escalas:**

  - Escala de reducción: $1 : n$ con $n > 1$ (ej: $1 : 50.000$).

  - Escala de ampliación: $n : 1$ con $n > 1$ (ej: $10 : 1$).

  - Escala natural: $1 : 1$.'
definiciones_clave: '- **Escala**: Razón por cociente $E = \frac{d}{R}$ entre la distancia
  dibujada $d$ y la distancia real $R$.'
propiedades_relaciones: '- **Homogeneidad dimensional**: $d$ y $R$ se deben convertir
  a la misma unidad antes de simplificar.'
ejemplo_guiado:
  enunciado: 'Interprete el significado de un mapa dibujado a escala $1 : 50.000$.'
  pasos:
  - 'Paso 1: Escribir la razón de escala: $E = \frac{d}{R} = \frac{1}{50.000}$.'
  - 'Paso 2: Interpretar en unidades comunes: $1\text{ cm}$ en el mapa equivale a
    $50.000\text{ cm}$ reales.'
  - 'Paso 3: Convertir a metros o kilómetros: $50.000\text{ cm} = 500\text{ m} = 0,5\text{
    km}$.'
  - 'Conclusión: Cada centímetro en el plano equivale a medio kilómetro real.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define la escala E de un plano o mapa?
  choices:
  - text: Como la razón entre la distancia en el dibujo y la distancia real en la
      misma unidad (E = d / R)
    is_correct: true
  - text: Como la resta E = R - d
    is_correct: false
  - text: Como el producto E = d · R
    is_correct: false
  - text: Como la suma de las unidades
    is_correct: false
  explanation: La alternativa correcta es 'Como la razón entre la distancia en el
    dibujo y la distancia real en la misma unidad (E = d / R)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado para la escala 1 : 50.000, ¿a cuántos metros reales
    equivale 1 cm dibujado?'
  choices:
  - text: 500 metros (0,5 km)
    is_correct: true
  - text: 50 metros
    is_correct: false
  - text: 5.000 metros
    is_correct: false
  - text: 5 metros
    is_correct: false
  explanation: La alternativa correcta es '500 metros (0,5 km)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de interpretar la escala como una
  razón $E = \frac{d}{R}$, convirtiendo unidades para relacionar medidas dibujadas
  y reales.
semantic_id: MAT.NUM.REPARTO_ESCALAS.ESCALA_RAZON
procedimiento:
- 'Paso 1: Identificar el tipo de problema (reparto proporcional directo/inverso o
  cálculo de escalas).'
- 'Paso 2: Convertir unidades de medida a un sistema homogéneo común (en el caso de
  escalas).'
- 'Paso 3: Calcular la constante de proporcionalidad $k$ o la escala $E$ y resolver
  la incógnita solicitada.'
errores_correccion: '- **Error 1: Calcular la escala dividiendo medidas en distintas
  unidades (ej: metros entre centímetros directamente).** **Cómo corregirlo:** Se
  DEBEN convertir ambas distancias a la MISMA unidad de medida antes de calcular $n
  = R / d$.


  - **Error 2: Tratar un reparto inverso como si fuera directo dividiendo el total
  por los índices sin invertirlos.** **Cómo corregirlo:** En el reparto inverso se
  DEBEN invertir previamente los coeficientes ($1/a_i$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.REPARTO_ESCALAS.ESCALA_RAZON.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del reparto proporcional o escalas.
- titulo: Ejemplo 2
  enunciado: Verificación de la constante k o escala E.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal de equivalencia proporcional.
- titulo: ¿Conserva el reparto proporcional la suma del total T?
  respuesta: Sí
  solucion_pasos:
  - Sí, la suma de las partes repartidas equivale a $T$.
- titulo: ¿Exige la escala expresarse en las mismas unidades de medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, para obtener una razón adimensional $1:n$.
errores_frecuentes:
- Calcular una escala dividiendo la distancia en metros entre los centímetros del
  plano sin convertir unidades.
- Realizar un reparto proporcional inverso sumando los coeficientes directamente como
  si fuera un reparto directo.
- Invertir el orden de la escala dividiendo la medida del plano por la medida real
  ($d / R$) para la constante $n$.
- Omitir multiplicar la constante de reparto $k$ por cada uno de los coeficientes
  individuales al finalizar.
- Restar los coeficientes al calcular el total repartido en una serie de razones.
afirmaciones_verdaderas:
- El reparto proporcional directo distribuye un total multiplicando la constante $k
  = \frac{T}{\sum a_i}$ por cada índice.
- 'La escala de un plano $E = \frac{d}{R} = 1 : n$ relaciona la distancia dibujada
  y la real expresadas en idéntica unidad.'
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
