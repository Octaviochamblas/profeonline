semantic_id: MAT.NUM.REPARTO_ESCALAS.ESCALA_RAZON
resumen_inicial: 'Interpretación de escala como razón: concepto y propiedades fundamentales
  en Reparto proporcional y escalas.'
explicacion_simple: '¿Cómo cabe el mapa de todo un país en la pantalla de tu celular? Gracias
  a las escalas. Una escala es simplemente una promesa matemática: ''Por cada centímetro que
  veas aquí, en la vida real hay tantos más''.'
explicacion_formal: 'Una **escala** es una aplicación directa del concepto de razón. Compara
  la dimensión de un objeto en una representación (mapa, maqueta, plano) con su dimensión
  en la realidad.


  Fórmula fundamental de la escala:

  $Escala = \frac{\text{Medida en el Plano}}{\text{Medida en la Realidad}}$


  Se suele escribir en la forma **1 : E** (por ejemplo, 1:100), lo que significa que **1 unidad**
  en el plano equivale a **E unidades** en la realidad. ¡Ojo! Ambas deben estar en la misma
  unidad de medida (si el plano está en cm, la realidad en la razón también está en cm).'
definiciones_clave: '- **Interpretación de escala como razón**: Elemento central dentro del
  estudio de Reparto proporcional y escalas.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a interpretación de escala como razón.'
ejemplo_guiado:
  enunciado: Un plano tiene escala 1:200. Si una habitación mide 3 cm en el plano, ¿qué representa
    el número 200 y cuántos metros mide la habitación en la realidad?
  pasos:
  - Interpreto que el 200 significa que 1 unidad en el plano equivale a 200 unidades reales.
  - 'Calculo la medida real en centímetros: 3 por 200 es igual a 600 centímetros.'
  - 'Convierto a metros: 600 dividido entre 100 es igual a 6 metros.'
