semantic_id: MAT.NUM.RAZONES_PROPORCIONES.ESCALA_CONCEPTO
resumen_inicial: 'La escala es la razón matemática adimensional entre la dimensión en el dibujo o mapa y la dimensión real correspondiente: $\text{Escala} = \frac{\text{Medida en el plano}}{\text{Medida real}} = 1 : N$, expresada en las mismas unidades de longitud.'
explicacion_simple: "![Concepto de escala](/static/img/nodos/interpretacion-de-escala-como-razon-intro.svg)\n\nLa **escala** es una razón matemática que nos dice **cuántas veces se achicó o agrandó un objeto** en un mapa, plano o maqueta:\n$$\text{Escala} = \frac{\text{Medida en el plano}}{\text{Medida real}} = 1 : N$$\n- **¿Cómo se interpreta una escala $1 : 50.000$?**\n  - Significa que **$1\text{ cm}$ en el mapa representa $50.000\text{ cm}$ en la realidad** ($500\text{ metros}$ o $0,5\text{ km}$).\n- **Tipos de escala:**\n  - **Reducción ($1 : N$ con $N > 1$):** El dibujo es más chico que la realidad (mapas, planos de casas).\n  - **Natural ($1 : 1$):** El dibujo tiene el tamaño exacto del objeto real.\n  - **Ampliación ($N : 1$ con $N > 1$):** El dibujo es más grande que el objeto (microchips, bacterias).\n- **Regla de oro:** ¡La escala no tiene unidades! Por eso, ambas medidas deben estar convertidas a la misma unidad (centímetros)."
explicacion_formal: 'Sea $\mathcal{O} \subset \mathbb{R}^3$ un objeto físico real y $\mathcal{D} \subset \mathbb{R}^2$ su representación gráfica o cartográfica.


  **Definición de Escala Lineal:**

  La escala $E$ se define como la razón geométrica invariante de homotecia:


  $$E = \frac{\|\mathbf{x}_{\mathcal{D}}\|}{\|\mathbf{x}_{\mathcal{O}}\|} = \frac{D_{\text{plano}}}{D_{\text{real}}} \in \mathbb{R}^+$$


  **Clasificación Homotética:**

  1. **Reducción ($E < 1$):** Formato canónico $1 : N$ donde $N = \frac{1}{E} > 1$.

  2. **Natural ($E = 1$):** Formato $1 : 1$.

  3. **Ampliación ($E > 1$):** Formato canónico $N : 1$ con $N = E > 1$.


  Al ser una razón de magnitudes homogéneas $[L]/[L]$, la escala es estrictamente **adimensional**.'
definiciones_clave: '- **Escala ($E$)**: Razón adimensional $\frac{D_{\text{plano}}}{D_{\text{real}}}$.

  - **Escala de reducción ($1 : N$)**: Representación donde la realidad se divide por $N$.

  - **Escala de ampliación ($N : 1$)**: Representación donde el dibujo es $N$ veces el tamaño real.'
propiedades_relaciones: '- **Homotecia geométrica**: Preserva ángulos y proporciones lineales.

  - **Escalamiento de áreas**: El área en el plano escala con el cuadrado de la escala: $A_{\text{plano}} = E^2 \cdot A_{\text{real}} = \frac{A_{\text{real}}}{N^2}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de interpretación de escala](/static/img/nodos/interpretacion-de-escala-como-razon-ejemplos.svg)


    Interprete el significado práctico de una escala cartográfica $1 : 250.000$ y analice el tipo y significado de una escala $10 : 1$ utilizada en el diseño de un microprocesador.'
  pasos:
  - 'Paso 1: Para $1 : 250.000$: Significa que $1\text{ cm en el mapa} = 250.000\text{ cm reales}$.'
  - 'Paso 2: Convertir a kilómetros: $250.000\text{ cm} = 2.500\text{ m} = 2,5\text{ km}$ (cada centímetro en el mapa son $2,5\text{ km}$ de terreno).'
  - 'Paso 3: Para $10 : 1$: El numerador es $10$ y el denominador es $1$ $\implies$ Escala de AMPLIACIÓN.'
  - 'Paso 4: Interpretación: $10\text{ cm en el plano}$ representan $1\text{ cm real}$ (el dibujo es $10$ veces más grande que el chip).'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Qué representa una escala numérica 1 : 100.000 en un mapa geográfico?'
  choices:
  - text: Que 1 cm en el mapa equivale a 100.000 cm en la realidad (es decir, 1 km)
    is_correct: true
  - text: Que el mapa mide 100.000 metros de ancho
    is_correct: false
  - text: Que 1 metro en el mapa son 100 cm reales
    is_correct: false
  - text: Que el terreno es 100 veces más pequeño que el papel
    is_correct: false
  explanation: La alternativa correcta es 'Que 1 cm en el mapa equivale a 100.000 cm en la realidad (es decir, 1 km)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado, ¿por qué la escala 10 : 1 es de ampliación y no de reducción?'
  choices:
  - text: Porque el número del dibujo (10) es mayor que el de la realidad (1), haciendo el plano más grande que el objeto real
    is_correct: true
  - text: Porque 10 es un número compuesto
    is_correct: false
  - text: Porque los microchips son caros
    is_correct: false
  - text: Por una convención óptica
    is_correct: false
  explanation: La alternativa correcta es 'Porque el número del dibujo (10) es mayor que el de la realidad (1), haciendo el plano más grande que el objeto real'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si la escala es de reducción ($1 : N$), natural ($1 : 1$) o ampliación ($N : 1$).'
- 'Paso 2: Interpretar el antecedente como medida en el plano y el consecuente como medida real en la misma unidad.'
- 'Paso 3: Convertir los centímetros reales a metros ($\div 100$) o kilómetros ($\div 100.000$) para dar contexto geográfico.'
errores_correccion: '- **Error 1: Pensar que la escala tiene unidades escritas (ej: $1\text{ cm} : 50\text{ km}$).** **Cómo corregirlo:** La escala es adimensional ($1 : 5.000.000$); se deben homogeneizar las unidades primero.

  - **Error 2: Invertir el orden dibujo / realidad.** **Cómo corregirlo:** Recordar siempre: $\text{Escala} = \frac{\text{Plano}}{\text{Realidad}}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: '¿A cuántos metros equivale $1\text{ cm}$ en un plano con escala $1 : 500$?'
  alternativas:
  - $5\text{ metros}$
  - $50\text{ metros}$
  - $0,5\text{ metros}$
  respuesta: $5\text{ metros}$
  solucion_pasos:
  - $1\text{ cm} = 500\text{ cm} = 5\text{ metros}$.
- titulo: Ejemplo 2
  enunciado: '¿Qué tipo de escala es $50 : 1$?'
  alternativas:
  - Ampliación
  - Reducción
  - Natural
  respuesta: Ampliación
  solucion_pasos:
  - 'Numerador $> 1$ en formato $N : 1 \implies$ Ampliación.'
- titulo: ¿Es la escala matemática una razón adimensional sin unidades?
  respuesta: Sí
  solucion_pasos:
  - Sí, al comparar longitudes en la misma unidad, las dimensiones se cancelan.
  alternativas:
  - texto: Sí, es una razón pura adimensional
    es_correcta: true
    retroalimentacion: ¡Correcto! Adimensionalidad estricta.
  - texto: No, se mide en cm/km
    es_correcta: false
    retroalimentacion: Incorrecto, las unidades se homogeneizan y cancelan.
  - texto: No, se mide en grados
    es_correcta: false
    retroalimentacion: Incorrecto, la escala lineal no es angular.
- titulo: '¿Equivale 1 : 100.000 a que 1 cm representa 1 km?'
  respuesta: Sí
  solucion_pasos:
  - Sí, $100.000\text{ cm} = 1.000\text{ m} = 1\text{ km}$.
  alternativas:
  - texto: Sí, 100.000 cm equivalen exactamente a 1 kilómetro
    es_correcta: true
    retroalimentacion: ¡Correcto! Conversión métrica directa.
  - texto: No, equivale a 10 km
    es_correcta: false
    retroalimentacion: Incorrecto, $10\text{ km} = 1.000.000\text{ cm}$.
  - texto: No, equivale a 100 metros
    es_correcta: false
    retroalimentacion: Incorrecto, $100\text{ m} = 10.000\text{ cm}$.
errores_frecuentes:
- Creer que el número $N$ representa metros o kilómetros directamente sin convertir.
- Invertir la fracción poniendo la realidad en el numerador.
- Confundir escalas de reducción con escalas de ampliación.
- Olvidar que $1\text{ km} = 100.000\text{ cm}$.
afirmaciones_verdaderas:
- La escala es la razón $\text{Escala} = \frac{\text{Medida en el plano}}{\text{Medida real}}$.
- 'Una escala $1 : N$ es de reducción y significa que la realidad es $N$ veces mayor que el dibujo.'
- La escala es un número adimensional que requiere la misma unidad en ambos términos.
al_terminar_debes_poder: '![Síntesis de concepto de escala](/static/img/nodos/interpretacion-de-escala-como-razon-resumen.svg)


  QUÉ: Interpretar escalas numéricas como razones geométricas adimensionales en planos y mapas.


  CÓMO: Relacionando la proporción $\text{Escala} = \frac{D_{\text{plano}}}{D_{\text{real}}} = 1 : N$ y realizando conversiones métricas entre centímetros, metros y kilómetros ($1\text{ km} = 100.000\text{ cm}$).'
