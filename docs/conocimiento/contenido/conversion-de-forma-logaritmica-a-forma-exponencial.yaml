semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.FORMA_LOGARITMICA_A_EXPONENCIAL
resumen_inicial: Para despejar o comprender una ecuación logarítmica $\log_b(a) =
  c$, se convierte a su forma exponencial equivalente $b^c = a$.
explicacion_simple: 'Para quitar la palabra ''log'' y pasar a potencias:

  - Tomas la pequeña base $b$.

  - La elevas al resultado del otro lado ($c$).

  - Lo igualas al argumento ($a$).

  Ejemplo: $\log_x(16) = 2 \implies x^2 = 16 \implies x = 4$.'
explicacion_formal: Dada la proposición logarítmica $\log_b(a) = c$, la regla de transformación
  exponencial es $b^c = a$. Esta conversión es la herramienta primaria para resolver
  ecuaciones logarítmicas simples.
definiciones_clave: '- **Paso a potencia**: Técnica de despeje de variables ubicadas
  en el argumento o en la base de un logaritmo.'
propiedades_relaciones: '- **Conservación de restricciones**: $b > 0, b \neq 1$ y
  $a > 0$.'
ejemplo_guiado:
  enunciado: Resuelve la ecuación $\log_2(x+1) = 3$.
  pasos:
  - 'Convertir a forma exponencial: la base 2 elevada a 3 es igual a $(x+1)$.'
  - 'Escribir la ecuación: $2^3 = x + 1$.'
  - 'Calcular la potencia: $8 = x + 1$.'
  - 'Despejar $x$: $x = 8 - 1 = 7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $x$ en $\log_5(x) = 3$?
  choices:
  - text: '125'
    is_correct: true
  - text: '15'
    is_correct: false
  - text: '243'
    is_correct: false
  - text: '8'
    is_correct: false
  explanation: 'La correcta es: 125. Pasando a potencia $5^3 = x \implies x = 125$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Halla $x$ en $\log_x(9) = 2$.
  choices:
  - text: '3'
    is_correct: true
  - text: '81'
    is_correct: false
  - text: 4,5
    is_correct: false
  - text: '18'
    is_correct: false
  explanation: 'La correcta es: 3. Pasando a potencia $x^2 = 9 \implies x = 3$ (la
    base debe ser positiva).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$, el argumento $a$ y el resultado $c$.'
- 'Paso 2: Aplicar la fórmula de conversión $b^c = a$.'
- 'Paso 3: Resolver la ecuación resultante.'
errores_correccion: No confundas $b^c$ con $c^b$. En $\log_2(x) = 5$, se hace $2^5
  = 32$, no $5^2 = 25$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Resuelve $\log_3(x) = 4$.
  alternativas:
  - '81'
  - '12'
  - '64'
  respuesta: '81'
  solucion_pasos:
  - $3^4 = x \implies x = 81$.
errores_frecuentes:
- Elevar el resultado a la base en vez de la base al resultado.
afirmaciones_verdaderas:
- $\log_b(a) = c \implies b^c = a$.
al_terminar_debes_ponder: Resolver ecuaciones logarítmicas pasando a forma exponencial.
fuente: Texto escolar MINEDUC.
