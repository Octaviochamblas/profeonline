semantic_id: MAT.ALG.FUNCION_REPRESENTACION.DIAGRAMA_SAGITAL
resumen_inicial: 'Representación mediante diagrama sagital: conceptos, representación
  y propiedades en Representación de funciones.'
explicacion_simple: 'Un diagrama sagital dibuja los dos conjuntos como nubes de puntos,
  y flechas que conectan cada elemento del dominio con su imagen: literalmente, "sagital"
  significa "de flechas".'
explicacion_formal: '### Definición formal


  Un diagrama sagital de una correspondencia $f$ entre conjuntos $A$ y $B$ dibuja
  ambos conjuntos como colecciones de puntos, y traza una flecha desde cada $x \in
  A$ hacia cada elemento $y \in B$ tal que $(x,y) \in f$. Es función si y solo si
  de cada punto de $A$ sale exactamente una flecha.


  ### Desarrollo didáctico


  El criterio visual es simple: cuenta cuántas flechas salen de cada elemento del
  conjunto de partida.


  Si de algún elemento de $A$ no sale ninguna flecha, falla la existencia. Si de algún
  elemento salen dos o más flechas hacia elementos distintos de $B$, falla la unicidad.
  Si de cada elemento sale exactamente una flecha, el diagrama representa una función.'
definiciones_clave: '- **Representación mediante diagrama sagital**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a representación mediante diagrama sagital.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a representación mediante
    diagrama sagital.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a representación mediante diagrama
    sagital.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    representación mediante diagrama sagital?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en representación de funciones
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en representación de funciones. Es la condición
    de existencia y unicidad en representación mediante diagrama sagital.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en representación mediante
    diagrama sagital, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observa cada elemento del conjunto de partida (dominio).'
- 'Paso 2: Cuenta cuántas flechas salen de cada uno de esos elementos.'
- 'Paso 3: Si algún elemento no tiene flecha saliente, o tiene más de una, el diagrama
  no representa función.'
- 'Paso 4: Si cada elemento tiene exactamente una flecha saliente, es función.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar representación mediante diagrama sagital.
ejemplos:
- titulo: Diagrama con una flecha por elemento
  enunciado: En un diagrama sagital de $A=\{1,2,3\}$ a $B=\{4,5,6\}$, cada elemento
    de $A$ tiene exactamente una flecha saliente. ¿Representa una función?
  solucion_pasos:
  - Se cumple la condición de una sola flecha por elemento del dominio.
  - Representa una función.
- titulo: Diagrama con un elemento sin flecha
  enunciado: En un diagrama sagital de $A=\{1,2,3\}$ a $B$, el elemento 3 no tiene
    ninguna flecha saliente. ¿Representa una función?
  solucion_pasos:
  - Falla la condición de existencia, pues el elemento 3 no tiene imagen asignada.
  - No representa una función.
- titulo: ¿Puede una función tener dos flechas apuntando al mismo elemento de $B$?
  enunciado: ¿Puede una función tener dos flechas apuntando al mismo elemento de $B$?
  respuesta: Sí
  solucion_pasos:
  - Distintos elementos del dominio pueden compartir la misma imagen sin violar la
    definición de función.
- titulo: ¿Puede un elemento del dominio tener dos flechas salientes en una función?
  enunciado: ¿Puede un elemento del dominio tener dos flechas salientes en una función?
  respuesta: 'No'
  solucion_pasos:
  - Esto violaría directamente la condición de unicidad de imagen.
errores_frecuentes:
- Contar flechas que llegan a un elemento de $B$ en vez de contar las que salen de
  $A$.
- Confundir un elemento sin flecha saliente con un elemento sin flecha entrante.
- Asumir que todo elemento de $B$ debe recibir al menos una flecha.
- No revisar todos los elementos del dominio antes de concluir si es función.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando representación
  mediante diagrama sagital.
