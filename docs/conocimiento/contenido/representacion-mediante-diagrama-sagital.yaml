semantic_id: MAT.ALG.FUNCION_REPRESENTACION.DIAGRAMA_SAGITAL
resumen_inicial: Un diagrama sagital representa una función mediante dos óvalos (conjuntos)
  unidos por flechas que van del dominio al codominio.
explicacion_simple: 'Un **diagrama sagital** (o de Venn con flechas) dibuja:

  - Un óvalo a la izquierda con los elementos del dominio $A$.

  - Un óvalo a la derecha con los elementos del codominio $B$.

  - Una **flecha dirigida** desde cada número $x$ hacia su única salida $y = f(x)$.

  Es una herramienta gráfica muy intuitiva para verificar la unicidad de las funciones.'
explicacion_formal: 'El **diagrama sagital de una función** $f: A \to B$ es el digrafo
  dirigido con vértices $V = A \cup B$ y aristas dirigidas:


  $$E = \{(x, f(x)) \mid x \in A\}$$


  **Desglose de la fórmula:**

  - Cada vértice $x \in A$ posee grado de salida $d^+(x) = 1$ (exactamente una flecha
  partiendo de él).'
definiciones_clave: '- **Diagrama sagital**: Representación esquemática mediante conjuntos
  circulares y flechas direccionales.'
propiedades_relaciones: '- **Grado de salida unitario**: Para ser función, de CADA
  elemento del óvalo izquierdo debe salir EXACTAMENTE UNA flecha.'
ejemplo_guiado:
  enunciado: 'Representa mediante un diagrama sagital la función $f: \{1, 2, 3\} \to
    \{2, 4, 6\}$ definida por $f(x) = 2x$.'
  pasos:
  - 'Paso 1: Dibujar el conjunto $A = \{1, 2, 3\}$ a la izquierda.Paso 2: Dibujar
    el conjunto $B = \{2, 4, 6\}$ a la derecha.Paso 3: Trazar una flecha desde $1$
    hacia $2$, desde $2$ hacia $4$, y desde $3$ hacia $6$.Paso 4: Verificar que de
    cada elemento de $A$ sale una sola flecha.'
checkpoints:
- placement: after_explicacion_formal
  question: 'En un diagrama sagital de una función $f: A \to B$, ¿cuántas flechas
    deben salir de cada elemento del conjunto $A$?'
  choices:
  - text: Exactamente una flecha.
    is_correct: true
  - text: Dos o más flechas.
    is_correct: false
  - text: Ninguna flecha.
    is_correct: false
  - text: Depende de la cantidad de elementos de B.
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente una flecha.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en un diagrama sagital hay un elemento del conjunto $A$ del cual parten
    dos flechas hacia elementos distintos de $B$, ¿qué se puede afirmar?
  choices:
  - text: Que el diagrama representa una relación que NO es una función.
    is_correct: true
  - text: Que es una función biyectiva.
    is_correct: false
  - text: Que la función es constante.
    is_correct: false
  - text: Que el recorrido es el conjunto vacío.
    is_correct: false
  explanation: La alternativa correcta es 'Que el diagrama representa una relación
    que NO es una función.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar dos óvalos etiquetados como dominio $A$ y codominio $B$.'
- 'Paso 2: Escribir los elementos numéricos dentro de sus respectivos óvalos.'
- 'Paso 3: Trazar flechas orientadas desde cada elemento $x \in A$ hacia su única
  imagen $f(x) \in B$.'
errores_correccion: '- **Error común:** Dibujar la flecha apuntando desde $B$ hacia
  $A$.

  - **Cómo corregirlo:** La flecha apunta SIEMPRE del conjunto de partida (dominio
  $A$) hacia el conjunto de llegada (codominio $B$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de representación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de representación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El criterio de la línea vertical sirve para identificar si un gráfico representa
    a una función?
  respuesta: Sí
  solucion_pasos:
  - Sí, si ninguna recta vertical corta al gráfico en más de un punto, es función.
- titulo: ¿El dominio de una función se lee sobre el eje horizontal X en su gráfica?
  respuesta: Sí
  solucion_pasos:
  - Sí, el dominio es el ancho continuo proyectado en el eje X.
errores_frecuentes:
- Invertir el orden de las componentes en los pares ordenados escribiendo $(y, x)$
  en vez de $(x, y)$.
- Trazar las flechas en un diagrama sagital en sentido contrario, del codominio al
  dominio.
- Confundir el criterio de la línea vertical (usado para probar funciones) con el
  de la línea horizontal (usado para inyectividad).
- Leer los valores del eje vertical $Y$ para determinar el dominio o los del eje $X$
  para hallar el recorrido.
- Usar la coordenada $x$ de un vértice en lugar de la coordenada $y$ para determinar
  el mínimo del recorrido en una gráfica.
afirmaciones_verdaderas:
- Una relación representada gráficamente es una función si y solo si cualquier línea
  vertical corta a su gráfico a lo sumo en un punto.
- El dominio se determina en el gráfico proyectando el trazo sobre el eje horizontal
  $X$, mientras que el recorrido se obtiene proyectándolo sobre el eje vertical $Y$.
al_terminar_debes_poder: Al finalizar este recurso podrás representar funciones mediante
  tablas, pares ordenados, diagramas sagitales y gráficos en el plano cartesiano,
  identificando dominio y recorrido.
fuente: Texto escolar MINEDUC — Álgebra / Representación de Funciones
estado: publicado
