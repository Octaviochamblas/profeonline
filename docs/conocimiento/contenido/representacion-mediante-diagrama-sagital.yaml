semantic_id: MAT.ALG.FUNCION_REPRESENTACION.DIAGRAMA_SAGITAL
resumen_inicial: Representar una función mediante un diagrama sagital consiste en ilustrar mediante flechas las asignaciones entre dos diagramas de Venn.
explicacion_simple: '![Representar una función mediante un diagrama sagital consiste en ilustrar mediante flechas las asignaciones entre dos diagramas de Venn](/static/img/nodos/representacion-mediante-diagrama-sagital-intro.svg)



  Un **diagrama sagital** (o diagrama de flechas) es una forma muy visual de entender una función:

  - Dibujas dos óvalos: el de la izquierda es el **conjunto de partida $A$** y el de la derecha es el **conjunto de llegada $B$**.

  - Trazas flechas que van desde los elementos de $A$ hacia sus imágenes en $B$.


  **Regla de oro visual:** De **CADA** elemento del óvalo izquierdo debe salir **EXACTAMENTE UNA** flecha.'
explicacion_formal: 'Un **diagrama sagital** es un grafo bipartito dirigido que representa la relación $f \subseteq A \times B$:

  $$\forall x \in A, \ \text{deg}^{+}(x) = 1$$


  Donde $\text{deg}^{+}(x)$ representa el grado de salida (número de flechas emitidas por el nodo $x$).


  **Propiedades visuales:**

  - **Existencia**: Ningún elemento de $A$ puede quedar sin flecha de salida.

  - **Unicidad**: Ningún elemento de $A$ puede emitir 2 o más flechas.

  - **Codominio vs Recorrido**: El óvalo $B$ completo es el codominio; los elementos de $B$ que reciben flechas forman el recorrido.'
definiciones_clave: '- **Diagrama sagital**: Representación esquemática con flechas dirigida entre dos conjuntos.

  - **Grado de salida**: Cantidad de flechas que parten desde un elemento del conjunto inicial.'
propiedades_relaciones: '- **Inyectividad visual**: Cada elemento de llegada recibe a lo más una flecha.

  - **Sobreyectividad visual**: Todos los elementos de llegada reciben al menos una flecha.'
ejemplo_guiado:
  enunciado: '![Ejemplo Representar una función mediante un diagrama sagital consiste en ilustrar mediante flechas las asignaciones entre dos diagramas de Venn](/static/img/nodos/representacion-mediante-diagrama-sagital-ejemplos.svg)



    En un diagrama sagital de $A = \{1, 2, 3\}$ en $B = \{a, b, c, d\}$, las flechas son: $1 \to a$, $2 \to b$, $3 \to b$. Determina si es función, y escribe su dominio, codominio y recorrido.'
  pasos:
  - 'Paso 1: Comprobar el conjunto de partida $A$: de $1, 2, 3$ sale exactamente una flecha por cada uno. SÍ es función.'
  - 'Paso 2: Dominio: $\text{Dom}(f) = A = \{1, 2, 3\}$.'
  - 'Paso 3: Codominio: $\text{Codom}(f) = B = \{a, b, c, d\}$.'
  - 'Paso 4: Recorrido (solo los que reciben flecha): $\text{Rec}(f) = \{a, b\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: En un diagrama sagital, si de un elemento del conjunto de partida salen 2 flechas, ¿qué ocurre?
  choices:
  - text: La relación no es una función porque viola la unicidad de imagen.
    is_correct: true
  - text: Es una función sobreyectiva.
    is_correct: false
  - text: Es una función lineal doble.
    is_correct: false
  - text: El codominio se duplica.
    is_correct: false
  explanation: La alternativa correcta es 'La relación no es una función porque viola la unicidad de imagen.'. Cada preimagen debe tener una sola flecha de salida.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué elementos del conjunto de llegada forman el recorrido en un diagrama sagital?
  choices:
  - text: Exclusivamente los elementos que reciben al menos una flecha.
    is_correct: true
  - text: Todos los elementos del óvalo de llegada sin excepción.
    is_correct: false
  - text: Solo los elementos que no reciben flechas.
    is_correct: false
  - text: Los elementos que emiten flechas.
    is_correct: false
  explanation: La alternativa correcta es 'Exclusivamente los elementos que reciben al menos una flecha.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar los óvalos del conjunto de partida $A$ y del conjunto de llegada $B$.'
- 'Paso 2: Ubicar los elementos correspondientes en cada óvalo.'
- 'Paso 3: Trazar las flechas desde cada preimagen hacia su respectiva imagen.'
- 'Paso 4: Verificar que cada elemento de $A$ emita una y solo una flecha hacia $B$.'
errores_correccion: '- **Error común:** Creer que no es función cuando sobran elementos en el óvalo de llegada $B$ sin recibir flechas.

  - **Cómo corregirlo:** En el óvalo de llegada $B$ pueden sobrar elementos; donde es obligatorio que todos los elementos tengan flecha única es en el conjunto de partida $A$.'
ejemplos:
- titulo: 'Ejemplo 1: Convergencia de flechas'
  enunciado: Si de $x_1$ y $x_2$ salen flechas hacia el mismo elemento $y_1$, ¿es función?
  alternativas:
  - Sí, es totalmente válido que dos entradas compartan la misma salida
  - No, las flechas no pueden cruzarse ni converger
  - Solo si y1 es cero
  - No, porque falta una flecha
  respuesta: Sí, es totalmente válido que dos entradas compartan la misma salida
  solucion_pasos:
  - 'Paso 1: Cada entrada emite una sola flecha.'
  - 'Paso 2: Cumple la condición de función perfectamente.'
- titulo: 'Ejemplo 2: Elemento huérfano'
  enunciado: En $A = \{1, 2, 3\}$, si $1 \to a$ y $2 \to b$, pero el $3$ no tiene flecha, ¿es función?
  alternativas:
  - No, porque todo elemento del dominio debe tener una imagen asignada
  - Sí, porque 1 y 2 tienen asignación única
  - Sí, con dominio {1, 2}
  - Depende del conjunto B
  respuesta: No, porque todo elemento del dominio debe tener una imagen asignada
  solucion_pasos:
  - 'Paso 1: El elemento $3 \in A$ no tiene imagen.'
  - 'Paso 2: Falla la existencia en el dominio declarado.'
- titulo: 'Ejemplo 3: Identificación del recorrido'
  enunciado: Si $A=\{1, 2\}$, $B=\{10, 20, 30\}$ con $1 \to 20$ y $2 \to 20$, ¿cuál es el recorrido?
  alternativas:
  - '{20}'
  - '{10, 20, 30}'
  - '{1, 2}'
  - '{10, 30}'
  respuesta: '{20}'
  solucion_pasos:
  - 'Paso 1: El único elemento que recibe flecha es el $20$.'
  - 'Paso 2: $\text{Rec}(f) = \{20\}$.'
- titulo: 'Ejemplo 4: Clasificación inyectiva'
  enunciado: Si en un diagrama sagital ningún elemento del conjunto de llegada recibe más de una flecha, ¿qué propiedad posee?
  alternativas:
  - Es una función inyectiva (uno a uno)
  - Es una función constante
  - Es una relación no funcional
  - Es una función periódica
  respuesta: Es una función inyectiva (uno a uno)
  solucion_pasos:
  - 'Paso 1: No hay convergencia de flechas, por ende cada imagen proviene de una única preimagen.'
errores_frecuentes:
- Confundir la condición de salida única con la llegada única.
- Olvidar trazar flechas para todos los elementos del conjunto de partida.
- Confundir el conjunto de llegada completo con el conjunto de imágenes.
afirmaciones_verdaderas:
- Un diagrama sagital muestra las asignaciones funcionales mediante flechas orientadas desde el dominio hacia el codominio.
- Una relación es función si y solo si de cada elemento del conjunto de partida parte exactamente una flecha.
al_terminar_debes_poder: '**QUÉ:** Representar e interpretar funciones mediante diagramas sagitales de flechas.


  **CÓMO:** Trazando flechas dirigidas y comprobando que cada elemento del conjunto de partida emita una sola asignación hacia el codominio.


  ![Resumen Representar una función mediante un diagrama sagital consiste en ilustrar mediante flechas las asignaciones entre dos diagramas de Venn](/static/img/nodos/representacion-mediante-diagrama-sagital-resumen.svg)'
