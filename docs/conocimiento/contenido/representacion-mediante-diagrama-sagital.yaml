semantic_id: MAT.ALG.FUNCION_REPRESENTACION.DIAGRAMA_SAGITAL
resumen_inicial: El diagrama sagital representa visualmente las asignaciones de una función trazando flechas desde el conjunto de partida hacia el conjunto de llegada.
explicacion_simple: |
  Un **diagrama sagital** utiliza dos globos u óvalos:
  - El primer globo representa el conjunto de partida $A$ (dominio).
  - El segundo globo representa el conjunto de llegada $B$ (codominio).
  - Las **flechas** van desde un elemento del primer globo hacia su resultado en el segundo globo.

  **Regla de oro:** Para ser función, de **CADA elemento del primer globo debe salir UNA Y SOLO UNA flecha**.
explicacion_formal: |
  Sea $f: A \to B$ una función. El **diagrama sagital** es un grafo dirigido bipartito donde los vértices pertenecen a $A \cup B$ y el conjunto de aristas dirigidas es:

  $$E = \{(x, y) \mid x \in A, \ y \in B, \ y = f(x)\}$$

  **Condiciones visuales para ser función:**
  1. Grado de salida (out-degree) de todo $x \in A$ es exactamente $1$ ($\deg^+(x) = 1$).
  2. Grado de entrada (in-degree) de los elementos de $B$ puede ser $0, 1$ o mayor.
definiciones_clave: |
  - **Diagrama sagital**: Representación esquemática mediante flechas dirigidas entre dos conjuntos de elementos.
propiedades_relaciones: |
  - **Recorrido en el diagrama**: Corresponde al conjunto de elementos del conjunto $B$ que reciben al menos una flecha.
ejemplo_guiado:
  enunciado: 'En un diagrama sagital, el conjunto $A = \{1, 2, 3\}$ se relaciona con $B = \{a, b, c\}$. Salen las flechas $1 \to a$, $2 \to b$ y $3 \to b$. Determina si el diagrama representa una función y entrega su recorrido.'
  pasos:
    - 'Paso 1: Comprobar el conjunto de partida $A$: de $1$ sale una flecha, de $2$ sale una flecha, de $3$ sale una flecha.'
    - 'Paso 2: Como cada elemento de $A$ tiene exactamente una flecha de salida, SÍ representa una función.'
    - 'Paso 3: Identificar los elementos de $B$ que reciben flecha: reciben flecha los elementos $a$ y $b$.'
    - 'Paso 4: Concluir que la relación es función y su recorrido es $\text{Rec}(f) = \{a, b\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué el diagrama sagital con flechas $1 \to a$, $2 \to b$ y $3 \to b$ representa una función válida?'
    choices:
      - {text: 'Porque de cada elemento del conjunto de partida sale exactamente una flecha.', is_correct: true}
      - {text: 'Porque todos los elementos del conjunto de llegada reciben flecha.', is_correct: false}
      - {text: 'Porque las flechas son paralelas.', is_correct: false}
      - {text: 'Porque es una función sobreyectiva.', is_correct: false}
    explanation: "La alternativa correcta es 'Porque de cada elemento del conjunto de partida sale exactamente una flecha.'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En un diagrama sagital, si un elemento del conjunto de partida carece de flecha de salida, ¿qué ocurre?'
    choices:
      - {text: 'La relación no corresponde a una función.', is_correct: true}
      - {text: 'La relación es una función inyectiva.', is_correct: false}
      - {text: 'El recorrido es igual al codominio.', is_correct: false}
      - {text: 'No afecta en nada a la función.', is_correct: false}
    explanation: "La alternativa correcta es 'La relación no corresponde a una función.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Dibujar dos óvalos representando el conjunto de partida $A$ y de llegada $B$.'
  - 'Paso 2: Ubicar los elementos dentro de cada óvalo correspondiente.'
  - 'Paso 3: Trazar una flecha desde cada $x \in A$ hasta su imagen $y = f(x) \in B$.'
  - 'Paso 4: Comprobar que de cada elemento de $A$ salga exactamente una flecha.'
errores_correccion: |
  - **Error común:** Creer que no es función porque al elemento $b$ de llegada le llegan dos flechas ($2 \to b$ y $3 \to b$).
  - **Cómo corregirlo:** Varios elementos de partida PUEDEN enviar flechas al mismo elemento de llegada; lo prohibido es que de UN elemento de partida salgan DOS flechas.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de representación de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de representación de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En un diagrama sagital, si del conjunto de partida sale más de una flecha desde un mismo elemento, la relación es función.'
  - 'Un diagrama sagital representa una función si al menos un elemento del conjunto de partida carece de flecha de salida.'
  - 'El conjunto de llegada en un diagrama sagital es siempre exactamente igual al conjunto de elementos que reciben flecha.'
  - 'Las flechas en un diagrama sagital apuntan desde el codominio hacia el dominio de la función.'
  - 'Si dos flechas distintas llegan al mismo elemento del conjunto de llegada, el diagrama deja de representar una función.'
afirmaciones_verdaderas:
  - 'En un diagrama sagital, una relación es función si de CADA elemento del conjunto de partida sale EXACTAMENTE UNA flecha hacia el conjunto de llegada.'
  - 'Los elementos que reciben flecha forman el recorrido de la función, mientras que el conjunto de llegada completo es el codominio.'
al_terminar_debes_poder: |
  QUÉ: Representar e interpretar funciones mediante diagramas sagitales (de conjuntos).
  CÓMO: Dibujar los conjuntos de partida $A$ y llegada $B$, trazar flechas desde cada $x \in A$ a su única imagen $y \in B$, y verificar las condiciones de función.
fuente: 'Texto escolar MINEDUC — Álgebra / Representación de Funciones'
estado: publicado
