semantic_id: MAT.GEO.RELACIONES_TR.CATETO_MEDIA_GEOMETRICA
resumen_inicial: 'El teorema de Euclides respecto al cateto establece que en todo triángulo rectángulo, el cuadrado de cada cateto es igual al producto de la hipotenusa por la proyección de dicho cateto sobre ella: $a^2 = c \cdot q$ y $b^2 = c \cdot p$.'
explicacion_simple: |
  ![Euclides para Catetos](/static/img/nodos/propiedad-cada-cateto-es-media-geometrica-entre-la-hipotenusa-y-su-proyeccion-sobre-ella-intro.svg)

  El Teorema de Euclides te da una fórmula directa para conectar un cateto con su propia sombra:

  - **Para el cateto izquierdo ($b$)**: Multiplicas el piso completo ($c$) por su sombra izquierda ($p$): $b^2 = c \times p$.
  - **Para el cateto derecho ($a$)**: Multiplicas el piso completo ($c$) por su sombra derecha ($q$): $a^2 = c \times q$.
  - Para encontrar la medida del cateto, solo le sacas la raíz cuadrada a esa multiplicación: $b = \sqrt{c \cdot p}$ y $a = \sqrt{c \cdot q}$.
explicacion_formal: |
  ### Teorema formal de Euclides (Relativo al cateto)
  En cualquier triángulo rectángulo $\Delta ABC$ con ángulo recto en $C$ ($\gamma = 90^\circ$), el cuadrado de la longitud de cada cateto es estrictamente igual al producto de la longitud de la hipotenusa $c$ por la longitud de su respectiva proyección ortogonal:

  $$b^2 = c \cdot p \iff \frac{c}{b} = \frac{b}{p} \iff b = \sqrt{c \cdot p}$$

  $$a^2 = c \cdot q \iff \frac{c}{a} = \frac{a}{q} \iff a = \sqrt{c \cdot q}$$

  ### Desglose simbólico y geométrico
  - $a, b$: Longitudes de los catetos perpendiculares.
  - $c$: Longitud total de la hipotenusa ($c = p + q$).
  - $p, q$: Proyecciones ortogonales correspondientes ($p = AD, q = DB$).
  - Demostración por semejanza:
    - De $\Delta ADC \sim \Delta ACB \implies \frac{AC}{AB} = \frac{AD}{AC} \implies \frac{b}{c} = \frac{p}{b} \implies b^2 = c \cdot p$.
    - De $\Delta CDB \sim \Delta ACB \implies \frac{BC}{AB} = \frac{DB}{BC} \implies \frac{a}{c} = \frac{q}{a} \implies a^2 = c \cdot q$.
  - Deducción de Pitágoras: Sumando miembro a miembro: $a^2 + b^2 = c \cdot q + c \cdot p = c(q + p) = c \cdot c = c^2$.

  ### Síntesis didáctica
  Este teorema formaliza la noción de media geométrica o media proporcional en geometría, demostrando que cada cateto es el promedio geométrico entre el todo (hipotenusa) y su parte proyectada.
definiciones_clave: |
  - **Teorema de Euclides para el cateto**: Proposición métrica $a^2 = c \cdot q$ y $b^2 = c \cdot p$.
  - **Media geométrica (o proporcional)**: Un valor $x$ es media geométrica entre $u$ y $v$ si $x = \sqrt{u \cdot v} \iff x^2 = u \cdot v$.
  - **Razón de semejanza de catetos**: Proporción $\frac{c}{a} = \frac{a}{q}$ y $\frac{c}{b} = \frac{b}{p}$.
propiedades_relaciones: |
  - **Deducción de Pitágoras**: $a^2 + b^2 = c(p + q) = c^2$.
  - **Razón de catetos al cuadrado**: $\frac{a^2}{b^2} = \frac{c \cdot q}{c \cdot p} = \frac{q}{p}$.
  - **Media proporcional**: $b$ es media geométrica entre $c$ y $p$; $a$ es media geométrica entre $c$ y $q$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Euclides para Catetos](/static/img/nodos/propiedad-cada-cateto-es-media-geometrica-entre-la-hipotenusa-y-su-proyeccion-sobre-ella-ejemplos.svg)

    En un triángulo rectángulo, la hipotenusa mide $c = 18\text{ cm}$ y la proyección del cateto $b$ sobre la hipotenusa es $p = 2\text{ cm}$. Calcula la longitud exacta del cateto $b$.
  pasos:
  - 'Paso 1: Identificar los datos: hipotenusa $c = 18\text{ cm}$ y proyección $p = 2\text{ cm}$.'
  - 'Paso 2: Plantear el Teorema de Euclides para el cateto $b$: $b^2 = c \cdot p$.'
  - 'Paso 3: Multiplicar los valores: $b^2 = 18 \times 2 = 36$.'
  - 'Paso 4: Extraer la raíz cuadrada: $b = \sqrt{36} = 6\text{ cm}$.'
  - 'Paso 5: Concluir que el cateto $b$ mide exactamente $6\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula del teorema de Euclides para el cateto b en función de la hipotenusa c y su proyección p?
  choices:
  - text: $b^2 = c \cdot p$
    is_correct: true
  - text: $b = c \cdot p$
    is_correct: false
  - text: $b^2 = c + p$
    is_correct: false
  - text: $b^2 = p \cdot q$
    is_correct: false
  explanation: 'El teorema de Euclides establece que $b^2 = c \cdot p$, es decir, el cuadrado del cateto es igual al producto de la hipotenusa por su proyección.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en un triángulo rectángulo la hipotenusa mide 8 cm y la proyección q mide 2 cm, ¿cuánto mide el cateto a?
  choices:
  - text: $4\text{ cm}$
    is_correct: true
  - text: $16\text{ cm}$
    is_correct: false
  - text: $6\text{ cm}$
    is_correct: false
  - text: $10\text{ cm}$
    is_correct: false
  explanation: 'Mide $4\text{ cm}$, ya que $a^2 = c \cdot q = 8 \times 2 = 16 \implies a = \sqrt{16} = 4\text{ cm}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el cateto que se desea calcular ($a$ o $b$).'
- 'Paso 2: Identificar la hipotenusa completa $c$ y la proyección correspondiente ($q$ para $a$, $p$ para $b$).'
- 'Paso 3: Multiplicar la hipotenusa por la proyección: $c \cdot p$ o $c \cdot q$.'
- 'Paso 4: Extraer la raíz cuadrada del producto para obtener la medida lineal del cateto.'
errores_correccion: 'Asegúrate de multiplicar la hipotenusa total $c$ por la proyección propia del cateto, no por la otra proyección.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $c = 32\text{ cm}$ y $p = 2\text{ cm}$, ¿cuál es el valor del cateto $b$?
  alternativas:
  - $8\text{ cm}$
  - $16\text{ cm}$
  - $64\text{ cm}$
  respuesta: $8\text{ cm}$
  solucion_pasos:
  - '$b = \sqrt{c \cdot p} = \sqrt{32 \times 2} = \sqrt{64} = 8\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: Si $c = 50\text{ cm}$ y $q = 18\text{ cm}$, ¿cuál es el valor del cateto $a$?
  alternativas:
  - $30\text{ cm}$
  - $25\text{ cm}$
  - $35\text{ cm}$
  respuesta: $30\text{ cm}$
  solucion_pasos:
  - '$a = \sqrt{c \cdot q} = \sqrt{50 \times 18} = \sqrt{900} = 30\text{ cm}$.'
- titulo: ¿Cada cateto es media geométrica entre la hipotenusa y su proyección?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, porque $b = \sqrt{c \cdot p}$ y $a = \sqrt{c \cdot q}$.'
- titulo: ¿La fórmula del cateto a es a² = p · q?
  respuesta: 'No'
  solucion_pasos:
  - 'No, $p \cdot q$ corresponde al cuadrado de la altura ($h_c^2 = p \cdot q$). Para el cateto $a$ es $a^2 = c \cdot q$.'
errores_frecuentes:
- 'Multiplicar $p \cdot q$ en vez de $c \cdot p$ para hallar un cateto.'
- 'Olvidar sacar la raíz cuadrada del producto $c \cdot p$.'
- 'Cruzar las proyecciones (usar $q$ para calcular $b$).'
- 'Sumar la hipotenusa y la proyección en lugar de multiplicarlas.'
- 'Confundir la hipotenusa $c$ con una de las proyecciones.'
afirmaciones_verdaderas:
- 'En todo triángulo rectángulo, $a^2 = c \cdot q$ y $b^2 = c \cdot p$.'
- 'Sumando las ecuaciones de Euclides para ambos catetos se obtiene directamente el teorema de Pitágoras.'
al_terminar_debes_poder: |
  **QUÉ:** Enunciar y aplicar el teorema de Euclides relativo a los catetos ($a^2 = c \cdot q$ y $b^2 = c \cdot p$).

  **CÓMO:** Multiplicando la hipotenusa completa por la proyección adyacente y extrayendo la raíz cuadrada.

