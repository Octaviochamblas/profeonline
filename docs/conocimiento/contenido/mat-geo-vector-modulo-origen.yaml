procedimiento:
- 'Paso 1: Verifica que el vector tenga su origen en el punto (0,0) del sistema cartesiano.'
- 'Paso 2: Identifica directamente sus componentes (vx,vy), que coinciden con las
  coordenadas de su extremo.'
- 'Paso 3: Aplica la fórmula |v|=√(vx²+vy²) para obtener el módulo.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con cálculo del módulo de un vector representado desde el origen.
