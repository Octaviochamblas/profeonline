semantic_id: MAT.GEO.VECTORES_OPERATORIA.MODULO_VECTOR_ORIGEN
resumen_inicial: 'Cálculo del módulo de un vector representado desde el origen: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Cuando un vector 'parte desde cero', calcular su longitud es tan
  simple como aplicar el teorema de Pitágoras a sus dos componentes.
explicacion_formal: '![Módulo de un vector desde el origen](/static/img/geometria/cartesiano-vectores/vector-modulo-origen.svg)


  ### Definición formal


  Cuando el origen de un vector coincide con el origen del sistema cartesiano, sus
  componentes $(v_x,v_y)$ coinciden con las coordenadas de su extremo, y el módulo
  se calcula directamente como $|\vec{v}|=\sqrt{v_x^2+v_y^2}$, sin necesidad de restar
  coordenadas.


  ### Desarrollo didáctico


  En la figura, el vector $\vec{v}=(4,3)$, anclado en el origen, tiene módulo $|\vec{v}|=\sqrt{4^2+3^2}=\sqrt{25}=5$.'
