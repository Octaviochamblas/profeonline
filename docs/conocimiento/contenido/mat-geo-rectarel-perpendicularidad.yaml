semantic_id: MAT.GEO.RECTA_RELACIONES.PERPENDICULARIDAD
resumen_inicial: 'Aplicación del producto de pendientes igual a -1 en rectas perpendiculares:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: 'Cuando dos rectas se cruzan formando un ángulo recto, sus pendientes
  cumplen una relación algebraica muy específica: ser recíprocas y de signo opuesto
  entre sí.'
explicacion_formal: '![Rectas perpendiculares](/static/img/geometria/analitica/rectarel-perpendicularidad.svg)


  ### Definición formal


  Dos rectas no verticales son perpendiculares si y solo si el producto de sus pendientes
  es $-1$: $m_1\cdot m_2=-1$, equivalentemente $m_2=-\dfrac{1}{m_1}$.


  ### Desarrollo didáctico


  Las rectas $y=x$ (m=1) e $y=-x$ (m=-1) son perpendiculares, ya que $1\times(-1)=-1$,
  formando un ángulo recto en su intersección (el origen).'
