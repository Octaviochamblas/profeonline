semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.TRASLACION_VERTICAL
resumen_inicial: La traslación vertical de una función potencia $g(x) = ax^n + k$ desplaza rígidamente la gráfica de $f(x) = ax^n$ en $k$ unidades a lo largo del eje $Y$, ubicando el nuevo vértice o centro en $(0, k)$ y modificando los límites del recorrido.
explicacion_simple: '![La traslación vertical de una función potencia $g(x) = ax^n + k$ desplaza rígidamente la gráfica de $f(x) = ax^n$ en $k$ unidades a lo largo del eje $Y$, ubicando el nuevo vértice o centro en $(0, k)$ y modificando los límites del recorrido](/static/img/nodos/descripcion-de-la-traslacion-vertical-de-una-funcion-potencia-intro.svg)



  Cuando sumas o restas un número **fuera de la potencia ($ax^n + k$)**, la gráfica completa **sube o baja a lo largo del eje $Y$**:


  - **Hacia ARRIBA:** Si tienes $x^4 + \mathbf{3}$, todas las alturas suben $3$ unidades (el vértice queda en $(0, 3)$ y el recorrido pasa a ser $[3, +\infty[$).

  - **Hacia ABAJO:** Si tienes $x^4 - \mathbf{5}$, todas las alturas bajan $5$ unidades (el vértice queda en $(0, -5)$ y el recorrido pasa a ser $[-5, +\infty[$).

  - **En funciones impares:** Si tienes $x^3 + 2$, la curva sube completa y corta al eje $Y$ en $(0, 2)$.'
explicacion_formal: 'Sea $f(x) = ax^n$ con $a \in \mathbb{R}^*$ y $n \in \mathbb{Z}^*$. La transformación geométrica de traslación por el vector vertical $\vec{v} = (0, k)$ con $k \in \mathbb{R}$ se define como:

  $$\mathcal{T}_{(0, k)}: \operatorname{Gr}(f) \to \operatorname{Gr}(g), \quad (x, y) \mapsto (x, y + k)$$

  La ecuación de la función transformada es:

  $$g(x) = f(x) + k = ax^n + k$$


  **Efecto en el conjunto imagen (Recorrido)**:

  - Para $n$ par y $a > 0$: $\operatorname{Rec}(g) = [k, +\infty[$.

  - Para $n$ par y $a < 0$: $\operatorname{Rec}(g) = ]-\infty, k]$.

  - Para $n$ impar: $\operatorname{Rec}(g) = \mathbb{R}$ (invariante).'
definiciones_clave: '- **Traslación vertical**: Desplazamiento rígido paralelo al eje de ordenadas originado por sumar una constante $k$.

  - **Término independiente $k$**: Parámetro que determina la cota inferior o superior del recorrido en potencias pares.'
propiedades_relaciones: '- **Intercepto con el eje $Y$**: Al evaluar $x = 0$, $g(0) = a(0)^n + k = k$, por lo que el intercepto vertical es siempre $(0, k)$.

  - **Invarianza de simetría axial**: El eje de simetría $x = 0$ no cambia en traslaciones verticales puras.'
ejemplo_guiado:
  enunciado: '![Ejemplo La traslación vertical de una función potencia $g(x) = ax^n + k$ desplaza rígidamente la gráfica de $f(x) = ax^n$ en $k$ unidades a lo largo del eje $Y$, ubicando el nuevo vértice o centro en $(0, k)$ y modificando los límites del recorrido](/static/img/nodos/descripcion-de-la-traslacion-vertical-de-una-funcion-potencia-ejemplos.svg)



    Determina el nuevo vértice, el intercepto con el eje $Y$ y el recorrido de:

    1) $f(x) = 3x^4 + 7$

    2) $g(x) = -x^2 - 9$'
  pasos:
  - 'Paso 1: Para $f(x) = 3x^4 + 7$:

    - $k = +7 \implies$ Vértice en **$(0, 7)$**.

    - Intercepto con el eje $Y$: **$(0, 7)$**.

    - Recorrido: Como $a = 3 > 0 \implies$ **$\operatorname{Rec}(f) = [7, +\infty[$**.'
  - 'Paso 2: Para $g(x) = -x^2 - 9$:

    - $k = -9 \implies$ Vértice en **$(0, -9)$**.

    - Intercepto con el eje $Y$: **$(0, -9)$**.

    - Recorrido: Como $a = -1 < 0 \implies$ **$\operatorname{Rec}(g) = ]-\infty, -9]$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el recorrido de la función potencia $f(x) = 2x^6 + 10$?
  choices:
  - text: '[10, +∞['
    is_correct: true
  - text: '[0, +∞['
    is_correct: false
  - text: '[2, +∞['
    is_correct: false
  - text: ℝ
    is_correct: false
  explanation: La alternativa correcta es '[10, +∞['. Al sumarle 10 a una potencia par con coeficiente positivo, el valor mínimo pasa de 0 a 10.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué punto corta al eje Y la función $g(x) = -5x^3 - 4$?
  choices:
  - text: (0, -4)
    is_correct: true
  - text: (0, 4)
    is_correct: false
  - text: (-4, 0)
    is_correct: false
  - text: (0, -5)
    is_correct: false
  explanation: La alternativa correcta es '(0, -4)'. Evaluando $x = 0$, $g(0) = -5(0)^3 - 4 = -4$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la constante exterior $k$ sumada o restada a la potencia.'
- 'Paso 2: Ubicar el nuevo vértice o punto de inflexión en las coordenadas $(0, k)$.'
- 'Paso 3: Si la función es de exponente par, actualizar el recorrido a $[k, +\infty[$ (si $a > 0$) o $]-\infty, k]$ (si $a < 0$).'
- 'Paso 4: Trazar la gráfica desplazando rígidamente cada punto $k$ unidades hacia arriba o abajo.'
errores_correccion: '- **Error común:** Mantener el recorrido como $[0, +\infty[$ cuando la función tiene un $+ k$ exterior.

  - **Cómo corregirlo:** La constante $k$ **mueve todo el recorrido**: si sumas $k$, el nuevo piso mínimo es **$[k, +\infty[$**.'
ejemplos:
- titulo: 'Ejemplo 1: Recorrido traslación positiva'
  enunciado: 'El recorrido de $f(x) = x^4 + 15$ es:'
  alternativas:
  - '[15, +inf['
  - '[0, +inf['
  - ']-inf, 15]'
  - R
  respuesta: '[15, +inf['
  solucion_pasos:
  - 'Paso 1: Par positivo con $k = 15 \implies \operatorname{Rec} = [15, +\infty[$.'
- titulo: 'Ejemplo 2: Recorrido traslación negativa'
  enunciado: 'El recorrido de $g(x) = -2x^6 - 8$ es:'
  alternativas:
  - ']-inf, -8]'
  - '[-8, +inf['
  - ']-inf, 0]'
  - R
  respuesta: ']-inf, -8]'
  solucion_pasos:
  - 'Paso 1: Par negativo con $k = -8 \implies \operatorname{Rec} = ]-\infty, -8]$.'
- titulo: 'Ejemplo 3: Vértice trasladado'
  enunciado: 'El vértice de la curva $y = 4x^2 - 11$ es:'
  alternativas:
  - (0, -11)
  - (-11, 0)
  - (0, 11)
  - (4, -11)
  respuesta: (0, -11)
  solucion_pasos:
  - 'Paso 1: Sin traslación horizontal $\implies (0, k) = (0, -11)$.'
- titulo: 'Ejemplo 4: Intercepto impar'
  enunciado: 'La curva $y = x^5 + 6$ corta al eje vertical en:'
  alternativas:
  - (0, 6)
  - (6, 0)
  - (0, 0)
  - (0, 1)
  respuesta: (0, 6)
  solucion_pasos:
  - 'Paso 1: $y(0) = 0 + 6 = 6 \implies (0, 6)$.'
errores_frecuentes:
- No modificar el recorrido en funciones pares trasladadas verticalmente.
- Confundir la coordenada del vértice (0, k) con (k, 0).
- Pensar que la traslación vertical afecta al dominio.
afirmaciones_verdaderas:
- La constante exterior k desplaza la gráfica verticalmente a lo largo del eje Y.
- En potencias pares con a > 0, el recorrido se transforma exactamente en [k, +∞[.
al_terminar_debes_poder: '**QUÉ:** Describir y graficar la traslación vertical de una función potencia.


  **CÓMO:** Identificando la constante k, ubicando el vértice en (0, k) y actualizando el recorrido a [k, +∞[ o ]-∞, k].


