semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.AREA_DELTOIDE
resumen_inicial: 'El área de un deltoide equivale al semiproducto de sus diagonales perpendiculares: A = (D · d) / 2.'
explicacion_simple: 'Calcular el área de un deltoide (volantín) es exactamente igual de fácil que en un rombo: como sus dos diagonales se cruzan formando una cruz recta de $90^\circ$, su área es simplemente **la mitad del producto de sus diagonales**.


  Multiplicas la longitud de la diagonal larga ($D$) por la de la diagonal corta ($d$) y **divides por 2**: **$A = \frac{D \cdot d}{2}$**. Por ejemplo, si una diagonal mide 10 cm y la otra mide 6 cm, su área es $\frac{10 \cdot 6}{2} = \frac{60}{2} = 30\text{ cm}^2$.


  ![Cálculo del área del deltoide mediante sus diagonales](/static/img/nodos/calculo-del-area-del-deltoide-mediante-sus-diagonales-intro.svg)

  '
explicacion_formal: '### Teorema del área del deltoide

  Sea $\mathcal{ABCD}$ un deltoide con diagonales perpendiculares $\overline{AC}$ (longitud $D$) y $\overline{BD}$ (longitud $d$). El área superficial $A$ viene dada por:

  $$A = \frac{D \cdot d}{2} = \frac{d_1 \cdot d_2}{2}$$


  ### Demostración geométrica

  1. La diagonal principal $\overline{AC}$ divide al deltoide en dos triángulos congruentes: $\triangle ABC$ y $\triangle ADC$.

  2. En el triángulo $\triangle ABC$, la base es $AC = D$ y la altura relativa a dicha base es el segmento de semidiagonal $BM = \frac{d}{2}$.

  3. El área de $\triangle ABC$ es:

  $$A(\triangle ABC) = \frac{\text{base} \cdot \text{altura}}{2} = \frac{D \cdot \frac{d}{2}}{2} = \frac{D \cdot d}{4}$$

  4. Por simetría axial reflexiva, el triángulo inferior tiene exactamente la misma área: $A(\triangle ADC) = \frac{D \cdot d}{4}$.

  5. Sumando ambas áreas parciales:

  $$A = A(\triangle ABC) + A(\triangle ADC) = \frac{D \cdot d}{4} + \frac{D \cdot d}{4} = \frac{2(D \cdot d)}{4} = \frac{D \cdot d}{2}$$


  > **Complemento didáctico:** Esta fórmula $A = \frac{d_1 \cdot d_2}{2}$ es universal para CUALQUIER cuadrilátero que tenga diagonales perpendiculares a $90^\circ$ (funciona para el rombo, el deltoide y el cuadrado). Si las diagonales forman $90^\circ$, el área siempre es su semiproducto.

  '
definiciones_clave: '- **Semiproducto de diagonales**: Producto de las longitudes de dos diagonales dividido por dos.

  - **Área ortodiagonal**: Propiedad por la cual todo cuadrilátero con diagonales perpendiculares cumple $A = \frac{d_1 d_2}{2}$.

  - **Diagonal mayor ($D$)**: Longitud de la diagonal principal del deltoide.

  '
propiedades_relaciones: '- **Despeje de una diagonal**: Conocida el área y una diagonal, $D = \frac{2A}{d}$ y $d = \frac{2A}{D}$.

  - **Independencia de los lados**: El área depende exclusivamente de las diagonales; dos deltoides con lados muy distintos pueden tener la misma área si sus diagonales coinciden.

  - **Relación con el rectángulo contenedor**: Las diagonales definen un rectángulo exterior de lados $D$ y $d$ cuya área es $D \cdot d$; el deltoide ocupa exactamente el $50\%$ de dicho rectángulo.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de área del deltoide](/static/img/nodos/calculo-del-area-del-deltoide-mediante-sus-diagonales-ejemplos.svg)


    Un cometa con forma de deltoide tiene una varilla principal de $20$ cm y una varilla transversal de $12$ cm. Calcula el área de tela necesaria para construirlo y determina la longitud de la varilla transversal de otro cometa que tenga la misma área pero cuya varilla principal mida $16$ cm.'
  pasos:
  - 'Paso 1: Calcular el área del primer cometa con $D = 20$ cm y $d = 12$ cm: $A = \frac{D \cdot d}{2} = \frac{20 \cdot 12}{2} = \frac{240}{2} = 120\text{ cm}^2$.'
  - 'Paso 2: Igualar el área para el segundo cometa: $\frac{16 \cdot d_2}{2} = 120$.'
  - 'Paso 3: Simplificar y despejar $d_2$: $8 \cdot d_2 = 120 \implies d_2 = \frac{120}{8} = 15$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el área de un deltoide a partir de sus diagonales D y d?
  choices:
  - text: A = (D · d) / 2.
    is_correct: true
  - text: A = D · d.
    is_correct: false
  - text: A = 2 · D · d.
    is_correct: false
  - text: A = (D + d) / 2.
    is_correct: false
  explanation: La alternativa correcta es 'A = (D · d) / 2.' El área del deltoide equivale al semiproducto de sus diagonales perpendiculares.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si las diagonales de un deltoide miden 14 cm y 5 cm, ¿cuál es su área?
  choices:
  - text: 35 cm².
    is_correct: true
  - text: 70 cm².
    is_correct: false
  - text: 19 cm².
    is_correct: false
  - text: 17,5 cm².
    is_correct: false
  explanation: La alternativa correcta es '35 cm².' $A = \frac{14 \cdot 5}{2} = \frac{70}{2} = 35\text{ cm}^2$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar las longitudes de las dos diagonales perpendiculares $D$ y $d$.

  2. Multiplicar ambas longitudes: $D \cdot d$.

  3. Dividir el producto obtenido entre 2: $A = (D \cdot d) / 2$.

  4. Si se conoce el área y una diagonal, despejar la otra mediante $d = 2A / D$.

  '
errores_correccion: '- **Error común 1:** Olvidar dividir entre 2 y responder $D \cdot d$. **Corrección:** $D \cdot d$ es el área de un rectángulo completo; el deltoide ocupa la mitad.

  - **Error común 2:** Multiplicar los lados adyacentes $a \cdot b$. **Corrección:** La fórmula es con las diagonales perpendiculares, no con los lados exteriores.

  '
ejemplos:
- tipo: A
  titulo: Área de deltoide directa
  enunciado: Un deltoide tiene diagonales de $18\text{ cm}$ y $10\text{ cm}$. ¿Cuál es su área?
  alternativas:
  - text: $90\text{ cm}^2$.
    is_correct: true
  - text: $180\text{ cm}^2$.
    is_correct: false
  - text: $45\text{ cm}^2$.
    is_correct: false
  - text: $28\text{ cm}^2$.
    is_correct: false
  explicacion: $A = \frac{18 \cdot 10}{2} = 90\text{ cm}^2$.
- tipo: B
  titulo: Fórmula ortodiagonal
  enunciado: ¿Es la fórmula del área del deltoide la misma que la del área del rombo en función de diagonales?
  respuesta: Sí
  explicacion: Sí. Ambas figuras tienen diagonales perpendiculares y comparten la fórmula $A = \frac{D \cdot d}{2}$.
errores_frecuentes:
- '''Olvidar dividir entre 2 al calcular el área del deltoide.'''
- '''Multiplicar los lados contiguos creyendo que dan el área.'''
- '''Confundir las diagonales con las semidiagonales.'''
afirmaciones_verdaderas:
- '''El área de un deltoide es igual al semiproducto de sus diagonales ($A = \frac{D \cdot d}{2}$).'''
- '''Cualquier cuadrilátero con diagonales perpendiculares tiene área $A = \frac{d_1 \cdot d_2}{2}$.'''
- '''El deltoide ocupa exactamente la mitad del área del rectángulo delimitado por sus diagonales.'''
al_terminar_debes_poder: '**QUÉ:** Calcular el área de deltoides a partir de sus diagonales y resolver ecuaciones de áreas equivalentes.


  **CÓMO:** Empleando la relación ortodiagonal $A = \frac{D \cdot d}{2}$ derivada de la partición en triángulos congruentes.


  ![Síntesis de área de deltoide](/static/img/nodos/calculo-del-area-del-deltoide-mediante-sus-diagonales-resumen.svg)

  '
