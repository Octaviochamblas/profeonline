- placement: after_explicacion_formal
  question: En un problema de rectángulo con área 40 m², el largo es x + 3 y el ancho es x. Si se halla x = 5, ¿cuál es el perímetro del rectángulo?
  choices:
  - text: 26 m
    is_correct: true
  - text: 5 m
    is_correct: false
  - text: 13 m
    is_correct: false
  - text: 40 m
    is_correct: false
  explanation: La alternativa correcta es '26 m'. Con $x = 5$, los lados son $5\text{ m}$ y $8\text{ m}$. El perímetro es $2(5 + 8) = 26\text{ m}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una pregunta pide "la suma de las edades de dos hermanos" y x es la edad del menor (x = 12) y el mayor tiene x + 4, ¿cuál es la respuesta final?
  choices:
  - text: 28 años
    is_correct: true
  - text: 12 años
    is_correct: false
  - text: 16 años
    is_correct: false
  - text: 24 años
    is_correct: false
  explanation: La alternativa correcta es '28 años'. Hermano menor $= 12$, hermano mayor $= 16 \implies \text{Suma} = 12 + 16 = 28\text{ años}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Releer con atención la pregunta final formulada en el enunciado.'
- 'Paso 2: Tomar el valor validado de la incógnita $x$.'
- 'Paso 3: Sustituir $x$ en la fórmula de la magnitud solicitada (perímetro, costo, otra dimensión).'
- 'Paso 4: Efectuar las operaciones y adjuntar la unidad de medida correspondiente.'
- 'Paso 5: Redactar la respuesta en forma clara y completa.'
errores_correccion: '- **Error común:** Marcar el valor de $x$ en las alternativas cuando la pregunta pedía el perímetro o el costo total.

  - **Cómo corregirlo:** **Relee la última línea de la pregunta** antes de marcar la alternativa para asegurarte de que calculaste lo que realmente se pedía.'
ejemplos:
- titulo: 'Ejemplo 1: Pregunta por la dimensión mayor'
  enunciado: Un rectángulo tiene área 35 m² y sus lados son $x$ y $x + 2$. ¿Cuánto mide el lado mayor?
  alternativas:
  - 7 m
  - 5 m
  - 12 m
  - 24 m
  respuesta: 7 m
  solucion_pasos:
  - 'Paso 1: $x(x + 2) = 35 \implies x = 5 \implies \text{Lado mayor} = 5 + 2 = 7\text{ m}$.'
- titulo: 'Ejemplo 2: Perímetro de triángulo rectángulo'
  enunciado: Los catetos de un triángulo miden $x$ y $x + 2$, y la hipotenusa mide 10. ¿Cuál es su perímetro?
  alternativas:
  - '24'
  - '6'
  - '8'
  - '14'
  respuesta: '24'
  solucion_pasos:
  - 'Paso 1: $x^2 + (x + 2)^2 = 100 \implies 2x^2 + 4x - 96 = 0 \implies x = 6$.

    Catetos: 6 y 8, hipotenusa: 10 $\implies \mathcal{P} = 6 + 8 + 10 = 24$.'
- titulo: 'Ejemplo 3: Reparto de dinero'
  enunciado: Se reparten $\$120.000$ entre $x$ personas. Si fueran 2 personas menos, cada una recibiría $\$10.000$ más. ¿Cuánto recibió cada persona originalmente?
  alternativas:
  - $20.000
  - $30.000
  - 6 personas
  - $10.000
  respuesta: $20.000
  solucion_pasos:
  - 'Paso 1: Ecuación da $x = 6$ personas $\implies \text{Monto original} = \$120.000 / 6 = \$20.000$.'
- titulo: 'Ejemplo 4: Tiempo de permanencia'
  enunciado: Un cohete está sobre 100 m en $t = 2\text{ s}$ y $t = 7\text{ s}$. ¿Cuánto tiempo estuvo sobre esa altura?
  alternativas:
  - 5 s
  - 9 s
  - 7 s
  - 2 s
  respuesta: 5 s
  solucion_pasos:
  - 'Paso 1: $\Delta t = 7 - 2 = 5\text{ segundos}$.'
errores_frecuentes:
- Entregar el valor de la incógnita x sin responder a la pregunta final del problema.
- Omitir las unidades de medida en la respuesta.
- Confundir dimensiones intermedias con la cantidad demandada.
afirmaciones_verdaderas:
- La resolución de un problema contextual culmina al calcular la magnitud demandada por la pregunta final.
- El valor de la incógnita x suele ser solo un paso intermedio para hallar el perímetro, costo o intervalo solicitado.
al_terminar_debes_poder: '**QUÉ:** Interpretar contextualmente las soluciones de una ecuación de segundo grado.


  **CÓMO:** Sustituyendo el valor de x en la función objetivo del enunciado y expresando la respuesta con sus unidades de medida.


  ![Resumen La interpretación contextual de las soluciones consiste en traducir el valor numérico obtenido para la incógnita $x$ en la respuesta explícita, formal y con unidades de medida requerida por la pregunta final del problema](/static/img/nodos/interpretacion-contextual-de-las-soluciones-de-una-ecuacion-cuadratica-resumen.svg)'
