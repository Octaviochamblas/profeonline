procedimiento:
- 'Paso 1: Verifica exactamente qué cantidad pregunta el problema (puede no ser directamente
  $x$).'
- 'Paso 2: Calcula, si es necesario, la cantidad derivada a partir del valor válido
  de $x$.'
- 'Paso 3: Expresa la respuesta final con las unidades correspondientes y en el lenguaje
  del problema original.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en interpretación contextual de las soluciones de una ecuación cuadrática.
ejemplos:
- titulo: Interpretación de una cantidad derivada
  enunciado: Si el ancho de un terreno es $x=7$ m y el largo es $x+3$, ¿cuál es la
    respuesta a "determina el largo del terreno"?
  solucion_pasos:
  - El largo es $x+3=7+3=10$.
  - El largo del terreno mide $10$ metros.
- titulo: Interpretación de un tiempo de caída
  enunciado: Si al resolver $h(t)=0$ se obtiene $t=4$ segundos, ¿cómo se interpreta
    esta solución?
  solucion_pasos:
  - $t=4$ representa el instante, medido en segundos desde el lanzamiento, en que
    el objeto toca el suelo.
  - La respuesta se expresa como "el objeto toca el suelo a los 4 segundos".
- titulo: ¿Basta con entregar el valor numérico de $x$ como respuesta final de un
    problema aplicado?
  enunciado: ¿Basta con entregar el valor numérico de $x$ como respuesta final de
    un problema aplicado?
  respuesta: 'No'
  solucion_pasos:
  - Se debe traducir ese valor al contexto del problema, incluyendo unidades y, si
    corresponde, calcular la cantidad realmente preguntada.
- titulo: ¿La pregunta de un problema siempre corresponde exactamente al valor de
    la incógnita definida?
  enunciado: ¿La pregunta de un problema siempre corresponde exactamente al valor
    de la incógnita definida?
  respuesta: 'No'
  solucion_pasos:
  - Muchas veces se pregunta por una cantidad derivada de la incógnita, que debe calcularse
    a partir de su valor.
errores_frecuentes:
- Entregar el valor de $x$ como respuesta final sin verificar qué cantidad se preguntó
  realmente.
- Omitir las unidades de medida en la respuesta final.
- No calcular las cantidades derivadas necesarias para responder completamente la
  pregunta del problema.
- Confundir la solución matemática de la ecuación con la respuesta completa al problema
  original.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando interpretación
  contextual de las soluciones de una ecuación cuadrática.
