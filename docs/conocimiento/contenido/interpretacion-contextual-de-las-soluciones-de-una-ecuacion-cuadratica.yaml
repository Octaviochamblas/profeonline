semantic_id: MAT.ALG.EC_CUADR_MODELO.INTERPRETACION_SOLUCION
resumen_inicial: La interpretación contextual de las soluciones traduce el significado práctico de las raíces dentro del problema real planteado.
explicacion_simple: |
  Resolver la ecuación cuadrática es solo la mitad del trabajo; la otra mitad es **interpretar qué significa el número dentro del problema**:

  - Si estabas calculando el precio de una entrada $x$ y obtienes $x = 15$:
    - Significa que el **precio de venta es de $15$**.
  - Si estabas calculando el tiempo de vuelo de un cohete $t$ y obtienes $t_1 = 3$ y $t_2 = 8$:
    - Significa que el cohete alcanza los $100$ metros **al subir a los 3 segundos** y vuelve a pasar por los $100$ metros **al bajar a los 8 segundos**.
  - **Requisito final**: Da siempre la respuesta completa en el lenguaje del problema original (incluyendo unidades como metros, segundos, pesos, personas).
explicacion_formal: |
  Dada la resolución matemática $x_0 \in S_{val}$ de la ecuación de modelo $ax^2 + bx + c = 0$, la **interpretación contextual** formaliza el mapeo semántico inverso desde el espacio abstracto de soluciones reales hacia el dominio del problema:

  $$\Phi^{-1}: S_{val} \to \text{Dominio Físico / Aplicado}$$

  **Componentes de la interpretación completa:**
  1. **Asignación de magnitud:** Identificar a qué propiedad física o matemática corresponde el valor $x_0$.
  2. **Inclusión de dimensiones:** Expresar el resultado acompañado de sus unidades de medida del Sistema Internacional o del contexto ($\text{m}, \text{s}, \text{kg}, \text{CLP}$).
  3. **Explicación funcional:** Argumentar el significado de los dos instantes o puntos de encuentro si existen raíces múltiples válidas.
definiciones_clave: |
  - **Interpretación contextual**: Proceso de traducción que le otorga significado práctico, unidades y explicación física a los resultados algebraicos obtenidos.
propiedades_relaciones: |
  - **Puntos de equilibrio económico o físico**: En aplicaciones comerciales, las raíces de $R(x) - C(x) = 0$ representan los puntos de equilibrio exactos donde los ingresos igualan a los costos.
ejemplo_guiado:
  enunciado: 'Un modelo de ingresos por ventas de boletos da la ecuación $-2p^2 + 80p - 600 = 0$, donde $p$ es el precio del boleto en dólares. Las raíces son $p_1 = 10$ y $p_2 = 30$. Interpreta este resultado.'
  pasos:
    - 'Paso 1: Identificar el significado de la variable $p$: precio por boleto en dólares.'
    - 'Paso 2: Evaluar la condición de igualación a cero: la ecuación busca los precios donde el beneficio neto es igual a cero.'
    - 'Paso 3: Analizar ambas raíces válidas: $p_1 = 10 \ \$ $ y $p_2 = 30 \ \$ $.'
    - 'Paso 4: Concluir que si el boleto se cobra a $10 \ \$ $ o a $30 \ \$ $, la empresa no obtiene ni pérdidas ni ganancias (puntos de equilibrio).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un modelo de trayectoria de un balón $h(t) = -5t^2 + 20t$, la solución $h(t) = 0$ entrega $t_1 = 0$ s y $t_2 = 4$ s. ¿Qué significan estos dos valores?'
    choices:
      - {text: '$t_1 = 0$ s es el instante del puntapié inicial y $t_2 = 4$ s es el instante en que el balón cae al suelo.', is_correct: true}
      - {text: 'Que el balón recorrió 4 metros de distancia horizontal.', is_correct: false}
      - {text: 'Que la altura máxima fue alcanzada a los 4 segundos.', is_correct: false}
      - {text: 'Que la velocidad inicial fue de 0 m/s.', is_correct: false}
    explanation: 'La alternativa correcta es ''$t_1 = 0$ s es el instante del puntapié inicial y $t_2 = 4$ s es el instante en que el balón cae al suelo.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Al calcular el ancho $x$ de una piscina se obtiene $x = 6$. ¿Cuál es la redacción adecuada para la respuesta del problema?'
    choices:
      - {text: 'El ancho de la piscina mide 6 metros.', is_correct: true}
      - {text: 'La solución es x = 6.', is_correct: false}
      - {text: 'El resultado es 6 unidades cuadradas.', is_correct: false}
      - {text: 'La piscina tiene un área de 6.', is_correct: false}
    explanation: 'La alternativa correcta es ''El ancho de la piscina mide 6 metros.''. Debe explicarse la magnitud con sus unidades.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Tomar el valor de la raíz válida $x_0$ obtenida en la etapa de resolución.'
  - 'Paso 2: Consultar la definición inicial de la variable $x$ dada en el planteamiento.'
  - 'Paso 3: Añadir las unidades de medida correspondientes al contexto del problema.'
  - 'Paso 4: Redactar una oración afirmativa clara que responda directamente a la pregunta formulada.'
errores_correccion: |
  - **Error común:** Limitarse a escribir "$x = 5$" como respuesta final en lugar de explicar su significado.
  - **Cómo corregirlo:** **REDACTA UNA RESPUESTA COMPLETA** con palabras y unidades (ej. "El tiempo necesario es de 5 segundos").
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Puntos de beneficio nulo.
    alternativas:
      - 'Los precios de equilibrio son $10 y $30'
      - 'x = 10 y x = 30'
      - 'El precio es $20'
    respuesta: 'Los precios de equilibrio son $10 y $30'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Tiempo de vuelo total.
    alternativas:
      - 'El objeto cae a los 6 segundos'
      - 't = 6'
      - 'El objeto cae a los -2 segundos'
    respuesta: 'El objeto cae a los 6 segundos'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Escribir únicamente el valor abstracto $x = k$ sin indicar las unidades de medida correspondientes al contexto.'
  - 'La equivalencia errónea entre las dos raíces de tiempo positivas y un valor de altura máxima.'
  - 'La falta de redacción afirmativa que responda en forma explícita a la pregunta formulada en el problema original.'
  - 'La equiparación de unidades de superficie ($m^2$) con unidades de longitud ($m$) al redactar la conclusión.'
  - 'Ignorar el significado de los puntos de cruce en problemas de oferta y demanda o costo e ingreso.'
afirmaciones_verdaderas:
  - 'Interpretar contextualmente exige acompañar los valores de las raíces por sus unidades de medida e indicar su significado práctico dentro del enunciado.'
  - 'En problemas de movimiento cuadrático, la presencia de dos raíces de tiempo positivas representa los instantes de ida y vuelta a través de un mismo nivel.'
al_terminar_debes_poder: |
  QUÉ: Interpretar contextualmente el significado de las soluciones de una ecuación de segundo grado en problemas aplicados.
  CÓMO: Asociar la raíz $x_0$ a la variable inicial, adjuntar unidades de medida y redactar la conclusión en el lenguaje del problema.
fuente: 'Texto escolar MINEDUC — Álgebra / Ecuaciones de Segundo Grado'
