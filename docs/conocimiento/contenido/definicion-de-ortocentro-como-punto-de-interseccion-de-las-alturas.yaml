semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.ORTOCENTRO_INTERSECCION
resumen_inicial: El ortocentro ($H$) es el punto notable donde se intersectan las
  tres alturas de un triángulo (o las rectas que las contienen). Es uno de los cuatro
  puntos notables fundamentales de la geometría euclidiana y su posición depende del
  tipo de triángulo según sus ángulos.
explicacion_simple: '![Definición de Ortocentro](/static/img/nodos/definicion-de-ortocentro-como-punto-de-interseccion-de-las-alturas-intro.svg)


  El **ortocentro** (que se representa con la letra **$H$**) es el punto exacto de
  encuentro donde se cruzan las tres alturas de un triángulo:


  - **Cruce de las 3 alturas**: Si dibujas las 3 alturas desde los 3 vértices, todas
  se cruzan obligatoriamente en el mismo punto.

  - **Basta trazar dos**: Como las tres alturas se cortan en el mismo lugar, basta
  cruzar 2 alturas para encontrar la ubicación de $H$.

  - **Punto notable**: Es uno de los puntos más importantes de la geometría junto
  con el baricentro, incentro y circuncentro.

  '
explicacion_formal: '### Definición formal y teorema de concurrencia

  En todo triángulo $\Delta ABC$, las tres rectas soportes que contienen a las alturas
  son estrictamente concurrentes en un único punto $H$, denominado **ortocentro**:


  $$\{H\} = \overleftrightarrow{h_a} \cap \overleftrightarrow{h_b} \cap \overleftrightarrow{h_c}$$


  ### Desglose simbólico y geométrico

  - $H$: Ortocentro del triángulo.

  - Propiedad de dualidad ortocéntrica: Si $H$ es el ortocentro de $\Delta ABC$, entonces
  $A$ es el ortocentro de $\Delta HBC$, $B$ es el ortocentro de $\Delta HAC$, y $C$
  es el ortocentro de $\Delta HAB$ (cuadruplete ortocéntrico).


  ### Síntesis didáctica

  El ortocentro es uno de los cuatro centros clásicos de la geometría euclidiana,
  cuya posición relativa es el indicador más claro de la clasificación angular del
  triángulo.'
definiciones_clave: '- **Ortocentro ($H$)**: Punto de concurrencia de las tres alturas
  o de sus rectas soportes en un triángulo.

  - **Concurrencia**: Propiedad geométrica por la cual tres o más rectas pasan exactamente
  por un mismo punto.

  - **Triángulo órtico**: Triángulo cuyos vértices son los tres pies de las alturas
  ($H_a, H_b, H_c$).

  '
propiedades_relaciones: '- **Concurrencia exacta**: $\overleftrightarrow{AH_a} \cap
  \overleftrightarrow{BH_b} \cap \overleftrightarrow{CH_c} = \{H\}$.

  - **Suplementariedad angular**: $\angle BHC + \angle BAC = 180^\circ$.

  - **Relación con la Recta de Euler**: El ortocentro $H$, el baricentro $G$ y el
  circuncentro $O$ son colineales y cumplen $HG = 2GO$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ortocentro](/static/img/nodos/definicion-de-ortocentro-como-punto-de-interseccion-de-las-alturas-ejemplos.svg)


    En un triángulo acutángulo $ABC$, el ángulo en el vértice $A$ mide $65^\circ$.
    Calcula la medida del ángulo $\angle BHC$ formado por las alturas en el ortocentro
    $H$.

    '
  pasos:
  - 'Paso 1: Identificar que $H$ es el ortocentro donde se intersectan las alturas
    $\overline{BH_b}$ y $\overline{CH_c}$.'
  - 'Paso 2: Observar el cuadrilátero $A H_c H H_b$, cuyos ángulos en $H_c$ y $H_b$
    son rectos ($90^\circ$ cada uno).'
  - 'Paso 3: Como la suma de ángulos de un cuadrilátero es $360^\circ$, los ángulos
    opuestos son suplementarios: $\angle A + \angle H_cHH_b = 180^\circ$.'
  - 'Paso 4: Por ángulos opuestos por el vértice, $\angle BHC = \angle H_cHH_b = 180^\circ
    - \angle A$.'
  - 'Paso 5: Calcular: $\angle BHC = 180^\circ - 65^\circ = 115^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué líneas notables se intersectan en el ortocentro de un triángulo?
  choices:
  - text: Las tres alturas del triángulo (o sus rectas soportes)
    is_correct: true
  - text: Las tres transversales de gravedad
    is_correct: false
  - text: Las tres bisectrices interiores
    is_correct: false
  - text: Las tres simetrales de los lados
    is_correct: false
  explanation: En el ortocentro concurren las tres alturas del triángulo (o sus rectas
    soportes) en un único punto notable de intersección.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en un triángulo acutángulo el ángulo en el vértice C mide 50°, ¿cuánto
    mide el ángulo AHB formado en el ortocentro?
  choices:
  - text: $130^\circ$
    is_correct: true
  - text: $50^\circ$
    is_correct: false
  - text: $100^\circ$
    is_correct: false
  - text: $90^\circ$
    is_correct: false
  explanation: El ángulo mide $130^\circ$, pues por propiedad de suplementariedad
    en el ortocentro se tiene $\angle AHB = 180^\circ - 50^\circ = 130^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar o trazar al menos dos alturas desde dos vértices distintos
  del triángulo.'
- 'Paso 2: Prolongar las líneas de ambas alturas hasta encontrar su punto de intersección.'
- 'Paso 3: Denotar dicho punto de concurrencia como el ortocentro $H$.'
- 'Paso 4: Verificar que la tercera altura trazada desde el vértice restante pase
  obligatoriamente por $H$.'
errores_correccion: 'No confundas el ortocentro con el baricentro (punto de transversales)
  ni con el incentro (punto de bisectrices): el ortocentro proviene exclusivamente
  de las alturas ($90^\circ$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo $ABC$ con ortocentro $H$ se sabe que $\angle BHC =
    124^\circ$, ¿cuánto mide el ángulo interior $\angle A$?
  alternativas:
  - $56^\circ$
  - $66^\circ$
  - $124^\circ$
  respuesta: $56^\circ$
  solucion_pasos:
  - 'Por la propiedad de suplementariedad: $\angle A = 180^\circ - \angle BHC = 180^\circ
    - 124^\circ = 56^\circ$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuántas alturas es necesario trazar como mínimo para determinar la posición
    exacta del ortocentro en el plano?
  alternativas:
  - $2\text{ alturas}$
  - $3\text{ alturas}$
  - $1\text{ altura}$
  respuesta: $2\text{ alturas}$
  solucion_pasos:
  - Dos rectas no paralelas se intersectan en un único punto; por el teorema de concurrencia,
    la tercera altura pasará automáticamente por esa misma intersección.
- titulo: ¿Las tres alturas de cualquier triángulo siempre se intersectan en un único
    punto?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental de la geometría euclidiana válido para todo triángulo.
- titulo: ¿El ortocentro equidista siempre de los tres vértices del triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, el punto que equidista de los tres vértices es el circuncentro ($O$), no el
    ortocentro ($H$).
errores_frecuentes:
- Confundir el ortocentro con el incentro, baricentro o circuncentro.
- Creer que se necesitan trazar obligatoriamente las 3 alturas para encontrar $H$
  (bastan 2).
- Olvidar la relación de suplementariedad entre el ángulo del ortocentro y el ángulo
  opuesto.
- Asumir erróneamente que $H$ siempre es el centro de gravedad del triángulo.
- Intentar buscar $H$ dentro del triángulo en triángulos obtusángulos.
afirmaciones_verdaderas:
- Las tres alturas de un triángulo son concurrentes en un único punto llamado ortocentro.
- El ángulo que forman dos alturas en el ortocentro es suplementario al ángulo del
  tercer vértice en triángulos acutángulos.
al_terminar_debes_poder: '**QUÉ:** Definir, identificar y aplicar las propiedades
  angulares del ortocentro en triángulos.


  **CÓMO:** Determinando el punto de intersección de las alturas y aplicando la relación
  de suplementariedad angular $\angle BHC = 180^\circ - \angle A$.


  ![Resumen de Ortocentro](/static/img/nodos/definicion-de-ortocentro-como-punto-de-interseccion-de-las-alturas-resumen.svg)

  '
