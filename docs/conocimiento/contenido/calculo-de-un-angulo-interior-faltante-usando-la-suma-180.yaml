semantic_id: MAT.GEO.TRIANGULOS_ANGULOS.CALCULO_ANGULO_FALTANTE
resumen_inicial: El cálculo de un ángulo interior desconocido en un triángulo se realiza
  mediante el despeje algebraico directo x = 180° - (α + β), garantizando la suma
  euclidiana de 180°.
explicacion_simple: '![Cálculo de Ángulo Faltante](/static/img/nodos/calculo-de-un-angulo-interior-faltante-usando-la-suma-180-intro.svg)


  Si conoces dos ángulos de adentro de un triángulo, encontrar el que falta es muy
  fácil: primero **suma los dos que tienes** y luego **réstale ese resultado a $180^\circ$**.
  Por ejemplo, si tienes $50^\circ$ y $60^\circ$, suman $110^\circ$, por lo que el
  que falta mide $180^\circ - 110^\circ = 70^\circ$.'
explicacion_formal: '### Algoritmo formal

  Dados dos ángulos interiores conocidos $\alpha$ y $\beta$ en un triángulo $\Delta
  ABC$, la medida del tercer ángulo interior desconocido $\gamma$ se calcula mediante
  el despeje lineal unívoco:


  $$\gamma = 180^\circ - (\alpha + \beta)$$


  $$\begin{cases} \gamma = 180^\circ - \alpha - \beta & (\text{en grados}) \\ \gamma
  = \pi - \alpha - \beta & (\text{en radianes}) \end{cases}$$


  ### Desglose simbólico y geométrico

  - $\alpha, \beta$: Ángulos interiores dados que satisfacen $\alpha + \beta < 180^\circ$.

  - $\gamma$: Ángulo incógnita estrictamente positivo ($\gamma > 0^\circ$).


  ### Síntesis didáctica

  Este algoritmo es el método analítico estándar para completar los datos angulares
  de cualquier triángulo a partir de dos medidas conocidas.'
definiciones_clave: '- **Fórmula del ángulo faltante**: $x = 180^\circ - (\alpha +
  \beta)$.

  - **Suma parcial**: $S = \alpha + \beta$ (acumulado de los dos ángulos dados).

  - **Ecuación lineal triangular**: Ecuación donde la suma de términos con incógnita
  se iguala a $180^\circ$. '
propiedades_relaciones: '- **Triángulo rectángulo**: Si se conoce un ángulo agudo
  $\alpha$, el otro agudo faltante es directamente su complemento: $x = 90^\circ -
  \alpha$.

  - **Triángulo isósceles**: Si se conoce el ángulo desigual $\alpha$, cada ángulo
  basal faltante es $x = (180^\circ - \alpha)/2$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Cálculo Faltante](/static/img/nodos/calculo-de-un-angulo-interior-faltante-usando-la-suma-180-ejemplos.svg)


    En un triángulo, los tres ángulos interiores miden $x$, $2x + 10^\circ$ y $3x
    - 10^\circ$. Determina el valor de $x$ y la medida de cada uno de los tres ángulos.'
  pasos:
  - 'Paso 1: Plantear la ecuación sumando los tres ángulos e igualando a $180^\circ$:
    $x + (2x + 10^\circ) + (3x - 10^\circ) = 180^\circ$.'
  - 'Paso 2: Reducir términos semejantes: $(1 + 2 + 3)x + (10^\circ - 10^\circ) =
    180^\circ \implies 6x = 180^\circ$.'
  - 'Paso 3: Despejar $x$: $x = 180^\circ / 6 = 30^\circ$.'
  - 'Paso 4: Calcular la medida de cada ángulo sustituyendo $x = 30^\circ$: Primer
    ángulo $= 30^\circ$, Segundo ángulo $= 2(30^\circ) + 10^\circ = 70^\circ$, Tercer
    ángulo $= 3(30^\circ) - 10^\circ = 80^\circ$.'
  - 'Paso 5: Comprobar: $30^\circ + 70^\circ + 80^\circ = 180^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el procedimiento correcto para hallar el tercer ángulo interior
    conociendo dos ángulos de 45° y 85°?
  choices:
  - text: Sumar 45° + 85° = 130° y restar 180° - 130° = 50°
    is_correct: true
  - text: Restar 85° - 45° = 40°
    is_correct: false
  - text: Sumar 45° + 85° = 130° y dejar ese valor
    is_correct: false
  - text: Restar de 360° obteniendo 230°
    is_correct: false
  explanation: El procedimiento formal es sumar 45° + 85° = 130° y restar 180° - 130°
    = 50°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un triángulo rectángulo, uno de los ángulos agudos mide 32°. ¿Cuánto
    mide el otro ángulo agudo?
  choices:
  - text: 58° (porque 90° - 32° = 58°)
    is_correct: true
  - text: 68°
    is_correct: false
  - text: 48°
    is_correct: false
  - text: 148°
    is_correct: false
  explanation: En un triángulo rectángulo los agudos suman 90°, luego 58° (porque
    90° - 32° = 58°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los dos ángulos conocidos o las expresiones en $x$.'
- 'Paso 2: Sumar los términos e igualar a $180^\circ$.'
- 'Paso 3: Resolver la ecuación lineal y verificar que el resultado esté en el rango
  $(0^\circ, 180^\circ)$.'
errores_correccion: 'No olvides restar de 180°: la suma de los dos ángulos conocidos
  no es el resultado final.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si dos ángulos interiores de un triángulo miden $54^\circ$ y $66^\circ$,
    ¿cuánto mide el tercer ángulo?
  alternativas:
  - $60^\circ$
  - $70^\circ$
  - $50^\circ$
  respuesta: $60^\circ$
  solucion_pasos:
  - $180^\circ - (54^\circ + 66^\circ) = 180^\circ - 120^\circ = 60^\circ$.
- titulo: Ejemplo 2
  enunciado: En un triángulo isósceles el ángulo del vértice mide $100^\circ$. ¿Cuánto
    mide cada uno de los otros dos ángulos iguales?
  alternativas:
  - $40^\circ$
  - $50^\circ$
  - $80^\circ$
  respuesta: $40^\circ$
  solucion_pasos:
  - $(180^\circ - 100^\circ) / 2 = 80^\circ / 2 = 40^\circ$.
- titulo: ¿Conociendo dos ángulos interiores de un triángulo siempre es posible calcular
    el tercero de forma única?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la suma euclidiana de 180° determina unívocamente el valor faltante.
- titulo: ¿Si dos ángulos suman 120°, el tercer ángulo mide 120°?
  respuesta: 'No'
  solucion_pasos:
  - No, mide $180^\circ - 120^\circ = 60^\circ$.
errores_frecuentes:
- Dar como respuesta la suma parcial de los dos ángulos conocidos.
- Restar la suma de 360° o 90° en triángulos no rectángulos.
- Cometer errores algebraicos al reducir términos con $x$.
- Asumir que un triángulo es equilátero o isósceles sin que el enunciado lo indique.
- Olvidar comprobar la suma final de los 3 ángulos.
afirmaciones_verdaderas:
- El tercer ángulo interior siempre equivale a $180^\circ - (\alpha + \beta)$.
- En un triángulo rectángulo los ángulos agudos suman $90^\circ$.
al_terminar_debes_poder: '**QUÉ:** Calcular con exactitud la medida de un ángulo interior
  faltante en cualquier triángulo.


  **CÓMO:** Aplicando el algoritmo de despeje $x = 180^\circ - (\alpha + \beta)$ y
  resolviendo ecuaciones lineales.


  ![Resumen de Cálculo de Ángulo Faltante](/static/img/nodos/calculo-de-un-angulo-interior-faltante-usando-la-suma-180-resumen.svg)'
