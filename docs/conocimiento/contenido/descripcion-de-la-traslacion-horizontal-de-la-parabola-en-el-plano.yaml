semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.TRASLACION_HORIZONTAL
resumen_inicial: 'La traslación horizontal desplaza rígidamente la gráfica de una función cuadrática a lo largo del eje $x$ mediante la transformación $g(x) = f(x - h)$, sin modificar su forma ni concavidad.'
explicacion_simple: |
  Trasladar horizontalmente una parábola significa mover toda la curva hacia la izquierda o hacia la derecha como un bloque rígido sobre el eje $x$. Al cambiar $f(x) = x^2$ por $g(x) = (x - h)^2$, cada punto de la parábola original se desplaza $h$ unidades hacia los lados. El tamaño, el ancho y la apertura de los brazos se mantienen exactamente iguales.
explicacion_formal: |
  ### Definición formal
  Dada la función cuadrática base $f(x) = ax^2$, la **traslación horizontal** por un vector $(h, 0)$ genera la nueva función $g: \mathbb{R} \to \mathbb{R}$ definida por:
  $$g(x) = f(x - h) = a(x - h)^2$$

  ### Desglose simbólico
  - Transformación rígida de puntos: $P(x_0, y_0) \in \text{Graf}(f) \implies P'(x_0 + h, y_0) \in \text{Graf}(g)$.
  - Isometría gráfica: La distancia entre cualesquiera dos puntos de la parábola trasladada es idéntica a la distancia entre sus preimágenes originales.
  - Desplazamiento del eje de simetría: El eje de simetría se desplaza de $x = 0$ a la nueva recta $x = h$.

  ### Síntesis didáctica
  La traslación horizontal modifica la entrada $x$ de la función antes de realizar la elevación al cuadrado. Esto explica por qué el cambio ocurre en el eje horizontal y por qué el vértice se traslada desde el origen $(0,0)$ al nuevo punto $(h, 0)$.
definiciones_clave: |
  - **Traslación horizontal**: Transformación geométrica isométrica que desplaza la gráfica a lo largo del eje de las abscisas.
  - **Transformación $f(x - h)$**: Alteración de la variable independiente $x$ en $h$ unidades.
  - **Isometría**: Propiedad de las transformaciones que preservan las distancias y la forma de las figuras.
propiedades_relaciones: |
  - **Conservación del recorrido**: Puesto que la traslación es únicamente horizontal ($k = 0$), el conjunto recorrido no se altera: $\operatorname{Rec}(g) = \operatorname{Rec}(f)$.
  - **Movimiento del vértice**: El vértice se desplaza desde $(0, 0)$ hasta $(h, 0)$.
ejemplo_guiado:
  enunciado: 'Dada la parábola patrón $f(x) = x^2$, describe la traslación geométrica sufrida por la función $g(x) = (x - 4)^2$, calcula la nueva posición de su vértice y verifica la imagen para $x = 6$.'
  pasos:
    - 'Paso 1: Identificamos la transformación estructural $g(x) = f(x - 4)$, con $h = 4$.'
    - 'Paso 2: Concluimos que la parábola $f(x) = x^2$ se desplaza rígidamente 4 unidades hacia la derecha a lo largo del eje $x$.'
    - 'Paso 3: El vértice original $V(0,0)$ se traslada al nuevo punto de vértice $V(4, 0)$.'
    - 'Paso 4: Evaluamos $g(6) = (6 - 4)^2 = 2^2 = 4$, comprobando que la altura $y = 4$ que ocurría en $x = 2$ en la función original ocurre ahora en $x = 6$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la gráfica de $f(x) = 3x^2$ se traslada horizontalmente 5 unidades hacia la derecha, ¿cuál es la regla algebraica de la nueva función $g(x)$?'
    choices:
      - {text: '$g(x) = 3(x - 5)^2$', is_correct: true}
      - {text: '$g(x) = 3(x + 5)^2$', is_correct: false}
      - {text: '$g(x) = 3x^2 - 5$', is_correct: false}
      - {text: '$g(x) = (3x - 5)^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = 3(x - 5)^2$''. Desplazar 5 unidades a la derecha exige la sustitución $x \to (x - 5)$ dentro de la potencia cuadrática.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué propiedad de la parábola $f(x) = x^2$ PERMANECE INALTERADA al aplicar una traslación horizontal pura de la forma $g(x) = (x - h)^2$?'
    choices:
      - {text: 'La concavidad, la apertura de las ramas y la ordenada del vértice $k = 0$', is_correct: true}
      - {text: 'La posición del eje de simetría $x = 0$', is_correct: false}
      - {text: 'La abscisa del vértice $h$', is_correct: false}
      - {text: 'Los puntos de corte con el eje de las abscisas', is_correct: false}
    explanation: 'La alternativa correcta es ''La concavidad, la apertura de las ramas y la ordenada del vértice $k = 0$''. La traslación horizontal es una isometría que sólo mueve las abscisas.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la función base $f(x) = ax^2$ y el valor de desplazamiento $h$ en $g(x) = a(x - h)^2$.'
  - 'Paso 2: Determinar la magnitud del desplazamiento como $|h|$ unidades.'
  - 'Paso 3: Aplicar el desplazamiento sobre el eje $x$ moviendo el vértice desde $(0,0)$ hasta $(h,0)$ y trazando la curva idéntica.'
errores_correccion: |
  - **Error 1:** Modificar la apertura o el ancho de las ramas de la parábola al trasladarla horizontalmente. **Cómo corregirlo:** La traslación es una transformación isométrica. El valor de $a$ no cambia, por lo que las ramas conservan exactamente la misma forma y apertura.
  - **Error 2:** Confundir la traslación horizontal de la entrada $x$ con una traslación vertical de la salida $y$. **Cómo corregirlo:** Si la constante está dentro del paréntesis elevado al cuadrado $(x - h)^2$, la traslación es horizontal. Si la constante está fuera del cuadrado $x^2 + k$, es vertical.
ejemplos:
  - titulo: 'Traslación horizontal de parábola mónica'
    enunciado: '¿Hacia dónde se desplaza la gráfica de $f(x) = x^2$ para obtener $g(x) = (x - 7)^2$?'
    alternativas:
      - '7 unidades hacia la derecha'
      - '7 unidades hacia la izquierda'
      - '7 unidades hacia arriba'
    respuesta: '7 unidades hacia la derecha'
    solucion_pasos:
      - '1. La transformación es $g(x) = f(x - 7)$.'
      - '2. La resta $(x - 7)$ dentro del binomio desplaza la curva 7 unidades hacia la derecha.'
  - titulo: 'Ubicación del nuevo vértice'
    enunciado: '¿Cuáles son las coordenadas del vértice de la parábola $f(x) = -2(x - 3)^2$?'
    alternativas:
      - '$V(3, 0)$'
      - '$V(-3, 0)$'
      - '$V(0, 3)$'
    respuesta: '$V(3, 0)$'
    solucion_pasos:
      - '1. Es una traslación horizontal pura con $h = 3$ y $k = 0$.'
      - '2. El vértice trasladado se ubica en $V(3, 0)$.'
  - titulo: 'Conservación de la concavidad'
    enunciado: 'Al trasladar horizontalmente una parábola cóncava hacia abajo, ¿la nueva parábola sigue siendo cóncava hacia abajo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La traslación no altera el signo del coeficiente cuadrático $a$, por lo que mantiene su concavidad.'
  - titulo: 'Impacto sobre el eje de simetría'
    enunciado: '¿El eje de simetría de la parábola $g(x) = (x - 4)^2$ es la recta $x = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al desplazar la curva 4 unidades a la derecha, el eje de simetría se desplaza de $x = 0$ a $x = 4$.'
errores_frecuentes:
  - 'La traslación horizontal de la función $f(x) = x^2$ dada por $g(x) = (x - 3)^2$ hace que las ramas de la parábola sean más angostas.'
  - 'La función $g(x) = (x - 2)^2$ se obtiene desplazando la gráfica de $y = x^2$ en 2 unidades hacia abajo.'
  - 'Una traslación horizontal pura modifica la cota mínima del conjunto recorrido de la función.'
  - 'El vértice de la parábola $f(x) = (x + 5)^2$ se ubica en la coordenada $(0, 5)$.'
  - 'Al aplicar una traslación horizontal a una parábola, la distancia entre sus ceros se duplica.'
afirmaciones_verdaderas:
  - 'La traslación horizontal $g(x) = f(x - h)$ mueve rígidamente la parábola a lo largo del eje $x$ sin alterar su concavidad ni su apertura.'
  - 'La traslación horizontal de una parábola modifica la posición de su eje de simetría a la recta $x = h$.'
