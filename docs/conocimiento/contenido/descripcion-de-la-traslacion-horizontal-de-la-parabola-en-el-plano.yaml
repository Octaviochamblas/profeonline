procedimiento:
- 'Paso 1: Identifica la función base $f(x)=x^2$ y la función transformada $g(x)=(x-h)^2$.'
- 'Paso 2: Reconoce que la gráfica de $g$ es la de $f$ desplazada horizontalmente
  $h$ unidades.'
- 'Paso 3: Ubica el nuevo vértice trasladando el vértice original $(0,0)$ a $(h,0)$.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en descripción de la traslación horizontal de la
  parábola en el plano.
ejemplos:
- titulo: Descripción de una traslación hacia la derecha
  enunciado: Describe la traslación horizontal de $g(x)=(x-5)^2$ respecto a $f(x)=x^2$.
  solucion_pasos:
  - La gráfica de $f$ se traslada $5$ unidades.
  - El vértice pasa de $(0,0)$ a $(5,0)$, desplazándose hacia la derecha.
- titulo: Descripción de una traslación hacia la izquierda
  enunciado: Describe la traslación horizontal de $g(x)=(x+4)^2$ respecto a $f(x)=x^2$.
  solucion_pasos:
  - Reescribiendo como $(x-(-4))^2$, la traslación es de $-4$ unidades.
  - El vértice pasa de $(0,0)$ a $(-4,0)$, desplazándose hacia la izquierda.
- titulo: ¿La traslación horizontal cambia la forma de la parábola?
  enunciado: ¿La traslación horizontal cambia la forma de la parábola?
  respuesta: 'No'
  solucion_pasos:
  - Solo desplaza la posición de la curva; su forma, concavidad y abertura permanecen
    exactamente iguales.
- titulo: ¿La traslación horizontal afecta la coordenada $y$ del vértice?
  enunciado: ¿La traslación horizontal afecta la coordenada $y$ del vértice?
  respuesta: 'No'
  solucion_pasos:
  - Solo afecta la coordenada $x$ del vértice; la coordenada $y$ permanece igual a
    la de la función original.
errores_frecuentes:
- Declarar la dirección de la traslación, moviendo hacia la izquierda cuando debería
  ser hacia la derecha o viceversa.
- Aplicar la traslación a la coordenada $y$ del vértice en vez de a la coordenada
  $x$.
- No reescribir correctamente el binomio para identificar el valor real de $h$.
- Declarar la traslación horizontal con la traslación vertical.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
