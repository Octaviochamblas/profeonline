semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.TRASLACION_HORIZONTAL
resumen_inicial: La traslación horizontal desplaza la parábola $y = ax^2$ a lo largo del eje X al reemplazar $x$ por $(x - h)$, obteniendo $g(x) = a(x - h)^2$.
explicacion_simple: |
  Una **traslación horizontal** desplaza toda la gráfica de la parábola hacia la izquierda o hacia la derecha a lo largo del eje X:

  $$g(x) = f(x - h) = a(x - h)^2$$

  - **Cuidado con los signos intuitivos**:
    - ** Si ves $(x - h)^2$ con $h > 0$**: La parábola se mueve hacia la **DERECHA $h$ unidades**.
    - ** Si ves $(x + h)^2$ con $h > 0$**: La parábola se mueve hacia la **IZQUIERDA $h$ unidades**.

  **Ejemplos**:
  - $g(x) = (x - 3)^2$: Se desplaza 3 unidades a la **derecha** (vértice en $(3, 0)$).
  - $h(x) = (x + 5)^2$: Se desplaza 5 unidades a la **izquierda** (vértice en $(-5, 0)$).
explicacion_formal: |
  Dada la función cuadrática madre $f(x) = ax^2$, la transformación geométrica de **traslación horizontal** por un vector desplazamiento $\vec{v} = (h, 0)$ define la función $g: \mathbb{R} \to \mathbb{R}$:

  $$g(x) = f(x - h) = a(x - h)^2 \quad \text{con } h \in \mathbb{R}$$

  **Propiedades geométricas de la traslación horizontal:**
  1. **Movimiento del eje de simetría:** La recta del eje de simetría se desplaza de $x = 0$ a la nueva recta $x = h$.
  2. **Movimiento del vértice:** El punto extremo pasa de $V_0(0,0)$ a $V_g(h, 0)$.
  3. **Invariantes:** La abertura ($|a|$), la orientación de las ramas ($\text{sgn}(a)$) y la altura del vértice ($y_v = 0$) permanecen constantes.
definiciones_clave: |
  - **Traslación horizontal**: Desplazamiento rígido paralelo al eje X que transforma la función $f(x)$ en $f(x - h)$.
propiedades_relaciones: |
  - **Invariancia del recorrido**: La traslación horizontal pura $g(x) = a(x - h)^2$ no altera el recorrido de la función, manteniéndose $[0, +\infty)$ si $a > 0$ o $(-\infty, 0]$ si $a < 0$.
ejemplo_guiado:
  enunciado: 'Describe la transformación aplicada a $f(x) = -2x^2$ para obtener $g(x) = -2(x - 4)^2$ e indica la nueva recta del eje de simetría.'
  pasos:
    - 'Paso 1: Observar el término modificado dentro de la base cuadrática: $(x - 4)$.'
    - 'Paso 2: Aislar la abscisa del vértice: $h = 4$.'
    - 'Paso 3: Declarar la traslación: desplazamiento de 4 unidades hacia la derecha.'
    - 'Paso 4: Indicar la nueva recta del eje de simetría: $x = 4$ (pasando por el vértice $(4,0)$).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la función cuadrática $f(x) = x^2$ se traslada 6 unidades hacia la izquierda en el plano cartesiano, ¿cuál es su nueva fórmula?'
    choices:
      - {text: '$g(x) = (x + 6)^2$', is_correct: true}
      - {text: '$g(x) = (x - 6)^2$.', is_correct: false}
      - {text: '$g(x) = x^2 + 6$.', is_correct: false}
      - {text: '$g(x) = x^2 - 6$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = (x + 6)^2$''. Trasladar 6 unidades a la izquierda reemplaza $x$ por $x - (-6) = x + 6$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Para la parábola traslada horizontalmente $g(x) = -5(x - 2)^2$, ¿cuál es su punto de vértice en el plano?'
    choices:
      - {text: '$V(2, 0)$', is_correct: true}
      - {text: '$V(-2, 0)$.', is_correct: false}
      - {text: '$V(0, 2)$.', is_correct: false}
      - {text: '$V(0, -5)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$V(2, 0)$''. Al ser traslación horizontal pura de $h = 2$, el vértice queda en $(2, 0)$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la constante $h$ dentro de la expresión elevada al cuadrado $(x - h)^2$.'
  - 'Paso 2: Si la expresión interna es $(x - h)$ con $h > 0$, declarar traslación hacia la derecha.'
  - 'Paso 3: Si la expresión interna es $(x + h)$ con $h > 0$, declarar traslación hacia la izquierda.'
  - 'Paso 4: Actualizar las coordenadas del vértice a $V(h, 0)$ y fijar la recta del eje de simetría en $x = h$.'
errores_correccion: |
  - **Error común:** Pensar que $(x + 3)^2$ desplaza la curva a la derecha porque tiene un signo positivo $+3$.
  - **Cómo corregirlo:** En la traslación horizontal los signos son **CONTRARIOS A LA INTUICIÓN**: $+h$ mueve a la **IZQUIERDA** y $-h$ mueve a la **DERECHA**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Traslación a la derecha.
    alternativas:
      - 'Desplazamiento 5 unidades a la derecha, V(5, 0)'
      - 'Desplazamiento 5 unidades a la izquierda'
      - 'Desplazamiento 5 unidades hacia arriba'
    respuesta: 'Desplazamiento 5 unidades a la derecha, V(5, 0)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Traslación a la izquierda.
    alternativas:
      - 'Desplazamiento 1 unidad a la izquierda, V(-1, 0)'
      - 'Desplazamiento 1 unidad a la derecha'
      - 'Desplazamiento 1 unidad hacia abajo'
    respuesta: 'Desplazamiento 1 unidad a la izquierda, V(-1, 0)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $g(x) = (x + 4)^2$, es correcto afirmar que la gráfica se traslada 4 unidades hacia la derecha.'
  - 'La traslación horizontal altera la ordenada del vértice elevándola o bajándola del eje X.'
  - 'La suposición de que traslaciones horizontales cambian la longitud de la abertura de la parábola.'
  - 'Equiparar la traslación horizontal $f(x-h)$ con la traslación vertical $f(x)-h$.'
  - 'La creencia de que el eje de simetría de $g(x) = a(x - h)^2$ sigue siendo el eje vertical $x = 0$.'
afirmaciones_verdaderas:
  - 'La traslación horizontal $g(x) = a(x - h)^2$ desplaza la parábola $h$ unidades a la derecha si $h > 0$ o a la izquierda si $h < 0$.'
  - 'Al realizar una traslación horizontal, la recta del eje de simetría se desplaza de manera idéntica a la ecuación $x = h$.'
al_terminar_debes_poder: |
  QUÉ: Describir y aplicar traslaciones horizontales en la gráfica de una función cuadrática.
  CÓMO: Analizar $(x - h)^2$, interpretar los signos invertidos, desplazar el eje de simetría a $x = h$ y fijar el vértice $V(h, 0)$.
