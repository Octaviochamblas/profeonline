semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.TRASLACION_HORIZONTAL
resumen_inicial: 'Descripción de la traslación horizontal de la parábola en el plano:
  parábola, vértice, concavidad y formas de Traslaciones y transformaciones.'
explicacion_simple: Partiendo de la parábola más simple, $f(x)=x^2$, es posible deslizarla
  hacia la izquierda o hacia la derecha sin cambiar su forma, simplemente modificando
  un parámetro dentro del paréntesis.
explicacion_formal: '### Definición formal


  Dada $f(x)=x^2$, la función $g(x)=f(x-h)=(x-h)^2$ representa una traslación horizontal
  de la gráfica de $f$ en $h$ unidades. Cada punto $(x,y)$ de la gráfica original
  se traslada a $(x+h,y)$ en la nueva gráfica.


  ### Desarrollo didáctico


  La traslación horizontal no altera la forma ni la abertura de la parábola: solo
  desplaza toda la curva a lo largo del eje $x$, incluyendo su vértice.


  La gráfica de $g(x)=(x-3)^2$ es idéntica a la de $f(x)=x^2$, pero desplazada $3$
  unidades hacia la derecha, con vértice en $(3,0)$ en vez de $(0,0)$.'
definiciones_clave: '- **Descripción de la traslación horizontal de la parábola en
  el plano**: Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  descripción de la traslación horizontal de la parábola en el plano.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando descripción
    de la traslación horizontal de la parábola en el plano.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a descripción
    de la traslación horizontal de la parábola en el plano.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
