semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.TRASLACION_HORIZONTAL
resumen_inicial: La traslación horizontal de la parábola transforma la función matriz $y = ax^2$ en $g(x) = a(x - h)^2$, desplazando rígidamente toda la gráfica $h$ unidades a lo largo del eje $X$ y situando el nuevo vértice en $(h, 0)$.
explicacion_simple: "![La traslación horizontal de la parábola transforma la función matriz $y = ax^2$ en $g(x) = a(x - h)^2$, desplazando rígidamente toda la gráfica $h$ unidades a lo largo del eje $X$ y situando el nuevo vértice en $(h, 0)$](/static/img/nodos/descripcion-de-la-traslacion-horizontal-de-la-parabola-en-el-plano-intro.svg)\n\n\nLa **traslación horizontal** consiste en deslizar la parábola hacia la izquierda o hacia la derecha como un riel sin deformarla:\n\n- **¿Cómo se escribe?** Modificando directamente a la variable $x$ dentro de un paréntesis al cuadrado:\n  $$g(x) = a(x - h)^2$$\n- **¿Hacia dónde se mueve?**\n  - Si tienes $g(x) = (x - 4)^2 \\implies$ la parábola se mueve **4 unidades a la DERECHA** (vértice en $(4, 0)$).\n  - Si tienes $g(x) = (x + 3)^2 \\implies$ la parábola se mueve **3 unidades a la IZQUIERDA** (vértice en $(-3, 0)$).\n- **El eje de simetría acompaña al vértice:** Se convierte en la recta vertical **$x = h$**."
explicacion_formal: 'Sea $f(x) = ax^2$ ($a \neq 0$) y sea un vector de traslación horizontal $\vec{v} = (h, 0) \in \mathbb{R}^2$. La **acción del operador traslacional** $\mathcal{T}_h: \mathcal{C}(\mathbb{R}) \to \mathcal{C}(\mathbb{R})$ define la nueva función:

  $$g(x) = (\mathcal{T}_h f)(x) = f(x - h) = a(x - h)^2$$


  **Propiedades invariantes**:

  1. **Isometría rígida**: Preserva distancias, apertura y curvatura instantánea ($\kappa(x)$).

  2. **Traslación del espectro crítico**: El punto crítico satisface $g''(x) = 2a(x - h) = 0 \Longleftrightarrow x_v = h$.

  3. **Cero único tangente**: La gráfica es tangente al eje $X$ en el punto $(h, 0)$.'
definiciones_clave: '- **Traslación horizontal**: Desplazamiento paralelo al eje de abscisas mediante el cambio de argumento $x \mapsto x - h$.

  - **Vértice trasladado horizontalmente**: Punto de contacto $(h, 0)$.'
propiedades_relaciones: '- **Eje de simetría trasladado**: La recta de simetría pasa de $x = 0$ a $x = h$.

  - **Invarianza de concavidad y recorrido**: La concavidad ($a$) y el recorrido ($[0, +\infty[$ ó $]-\infty, 0]$) se mantienen inalterados.'
ejemplo_guiado:
  enunciado: '![Ejemplo La traslación horizontal de la parábola transforma la función matriz $y = ax^2$ en $g(x) = a(x - h)^2$, desplazando rígidamente toda la gráfica $h$ unidades a lo largo del eje $X$ y situando el nuevo vértice en $(h, 0)$](/static/img/nodos/descripcion-de-la-traslacion-horizontal-de-la-parabola-en-el-plano-ejemplos.svg)



    Describe la transformación geométrica que experimenta $y = x^2$ para convertirse en $g(x) = (x - 5)^2$, indicando su nuevo vértice y eje de simetría.'
  pasos:
  - 'Paso 1: Identificar el cambio en el argumento: La función base $f(x) = x^2$ fue sustituida por $f(x - 5) = (x - 5)^2$.

    - Aquí $h = 5 > 0$.'
  - 'Paso 2: Determinar el sentido del desplazamiento: Como $h = 5$, la parábola se traslada **5 unidades hacia la derecha** a lo largo del eje $X$.'
  - 'Paso 3: Calcular el nuevo vértice y eje de simetría:

    - Vértice: $V(5, 0)$.

    - Eje de simetría: recta vertical $x = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Hacia dónde y cuántas unidades se desplaza la parábola $y = x^2$ al transformarse en $g(x) = (x + 7)^2$?
  choices:
  - text: 7 unidades hacia la izquierda
    is_correct: true
  - text: 7 unidades hacia la derecha
    is_correct: false
  - text: 7 unidades hacia arriba
    is_correct: false
  - text: 7 unidades hacia abajo
    is_correct: false
  explanation: La alternativa correcta es '7 unidades hacia la izquierda'. Como $(x + 7) = (x - (-7))$, el parámetro es $h = -7$, desplazando la curva a la izquierda.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el vértice de la parábola $f(x) = -3(x - 2)^2$?
  choices:
  - text: V(2, 0)
    is_correct: true
  - text: V(-2, 0)
    is_correct: false
  - text: V(0, 2)
    is_correct: false
  - text: V(2, -3)
    is_correct: false
  explanation: La alternativa correcta es 'V(2, 0)'. Al no haber traslación vertical ($k = 0$), el vértice queda en $(h, 0) = (2, 0)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la función base $y = ax^2$.'
- 'Paso 2: Extraer el valor del desplazamiento $h$ en la expresión $a(x - h)^2$.'
- 'Paso 3: Si $h > 0$, desplazar la curva $|h|$ unidades a la derecha; si $h < 0$, desplazar $|h|$ unidades a la izquierda.'
- 'Paso 4: Fijar el nuevo vértice en $(h, 0)$ y el eje de simetría en $x = h$.'
errores_correccion: '- **Error común:** Creer que $(x - 5)^2$ se mueve a la izquierda por el signo menos.

  - **Cómo corregirlo:** La fórmula base es $(x - h)$; por tanto, **el signo menos indica traslación a la DERECHA** ($h = +5$).'
ejemplos:
- titulo: 'Ejemplo 1: Traslación hacia la derecha'
  enunciado: En $f(x) = (x - 6)^2$, ¿cuál es el eje de simetría?
  alternativas:
  - x = 6
  - x = -6
  - y = 6
  - x = 0
  respuesta: x = 6
  solucion_pasos:
  - 'Paso 1: $h = 6 \implies$ eje de simetría en la recta $x = 6$.'
- titulo: 'Ejemplo 2: Traslación hacia la izquierda'
  enunciado: ¿Qué fórmula describe trasladar $y = 2x^2$ en 4 unidades a la izquierda?
  alternativas:
  - y = 2(x + 4)^2
  - y = 2(x - 4)^2
  - y = 2x^2 + 4
  - y = 2x^2 - 4
  respuesta: y = 2(x + 4)^2
  solucion_pasos:
  - 'Paso 1: $h = -4 \implies y = 2(x - (-4))^2 = 2(x + 4)^2$.'
- titulo: 'Ejemplo 3: Vértice de función desplazada'
  enunciado: ¿Dónde se ubica el vértice de $g(x) = -(x + 9)^2$?
  alternativas:
  - V(-9, 0)
  - V(9, 0)
  - V(0, -9)
  - V(-9, -1)
  respuesta: V(-9, 0)
  solucion_pasos:
  - 'Paso 1: $h = -9, k = 0 \implies V(-9, 0)$.'
- titulo: 'Ejemplo 4: Distancia entre vértices'
  enunciado: ¿A qué distancia están los vértices de $f(x) = (x - 3)^2$ y $g(x) = (x + 2)^2$?
  alternativas:
  - 5 unidades
  - 1 unidad
  - 6 unidades
  - 0 unidades
  respuesta: 5 unidades
  solucion_pasos:
  - 'Paso 1: $V_1(3, 0)$ y $V_2(-2, 0) \implies |3 - (-2)| = 5\text{ unidades}$.'
errores_frecuentes:
- Confundir el sentido de la traslación horizontal invirtiendo izquierda por derecha.
- Asumir que la traslación horizontal cambia el ancho de la parábola.
- Olvidar que el vértice mantiene ordenada y = 0 cuando no hay término vertical k.
afirmaciones_verdaderas:
- La expresión g(x) = a(x - h)² traslada la parábola horizontalmente h unidades.
- El eje de simetría de g(x) = a(x - h)² es siempre la recta vertical x = h.
al_terminar_debes_poder: '**QUÉ:** Describir y graficar la traslación horizontal de una parábola.


  **CÓMO:** Identificando el parámetro h en g(x) = a(x - h)² y trasladando el vértice a (h, 0).


