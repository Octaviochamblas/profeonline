semantic_id: MAT.GEO.HOMOTECIA.SIMETRIA_CENTRAL_K_MENOS_UNO
resumen_inicial: 'Relación entre homotecia de razón -1 y simetría central: conceptos,
  teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: 'Existe un caso particular muy especial dentro de las homotecias
  inversas, en el que la transformación coincide exactamente con otra transformación
  geométrica bien conocida: la simetría central.'
explicacion_formal: '![Simetría central como homotecia de razón -1](/static/img/geometria/congruencia-semejanza/homotecia-simetria-central.svg)


  ### Definición formal


  Con $k=-1$, la fórmula $P''=O+k(P-O)$ se convierte en $P''=O-(P-O)=2O-P$, que es
  exactamente la fórmula de la simetría central de centro $O$: el centro $O$ es el
  punto medio del segmento $PP''$.


  ### Desarrollo didáctico


  A diferencia de otras homotecias, con $k=-1$ el tamaño de la figura no cambia (ya
  que $|-1|=1$), solo su posición: la figura imagen es congruente con la original,
  pero rotada 180° respecto al centro O.'
