procedimiento:
- 'Paso 1: Verifica que la razón de homotecia sea exactamente k=-1.'
- 'Paso 2: Reconoce que, en ese caso, la transformación es una simetría central respecto
  al centro O.'
- 'Paso 3: Calcula la imagen de cada punto usando P''=2O-P (equivalente a la fórmula
  de homotecia con k=-1).'
