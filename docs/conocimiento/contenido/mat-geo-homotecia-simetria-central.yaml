- titulo: ¿Se cumple siempre la propiedad principal de relación entre homotecia de
    razón -1 y simetría central en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede relación entre homotecia de razón -1 y simetría central asumir un
