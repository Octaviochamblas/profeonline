procedimiento:
- 'Paso 1: Lista los elementos conocidos (lados y ángulos) de ambos triángulos.'
- 'Paso 2: Determina si esos elementos incluyen tres lados, dos lados y un ángulo,
  o dos ángulos y un lado.'
- 'Paso 3: Si hay un ángulo y dos lados (o dos ángulos y un lado), verifica su posición
  (comprendido u opuesto al mayor) para elegir entre LAL, ALA o LLA mayor.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con selección del criterio de congruencia adecuado a partir
  de datos dados.
