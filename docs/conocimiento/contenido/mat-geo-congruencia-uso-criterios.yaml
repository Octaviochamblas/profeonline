semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.USO_CRITERIOS
resumen_inicial: 'Selección del criterio de congruencia adecuado a partir de datos
  dados: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: Con los cuatro criterios de congruencia ya conocidos, el último
  paso es desarrollar la capacidad de identificar, frente a un problema concreto,
  cuál criterio es el adecuado según los datos que se entregan.
explicacion_formal: '![Selección del criterio de congruencia adecuado](/static/img/geometria/congruencia-semejanza/congruencia-uso-criterios.svg)


  ### Definición formal


  Dados ciertos elementos conocidos de dos triángulos (lados y/o ángulos), se selecciona
  el criterio de congruencia (LLL, LAL, ALA o LLA mayor) cuya condición coincide exactamente
  con los datos disponibles.


  ### Desarrollo didáctico


  Por ejemplo, si se conocen los tres lados de ambos triángulos, se usa LLL; si se
  conocen dos lados y el ángulo entre ellos, LAL; si se conocen dos ángulos y el lado
  entre ellos, ALA; y si se conocen dos lados y el ángulo opuesto específicamente
  al mayor de ellos, LLA mayor. Reconocer rápidamente qué datos se tienen es la habilidad
  clave de este tema.'
definiciones_clave: '- **Selección del criterio de congruencia adecuado a partir de
  datos dados**: Elemento o propiedad fundamental en el estudio de congruencia, semejanza
  y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a selección del criterio de congruencia adecuado
  a partir de datos dados.'
ejemplo_guiado:
  enunciado: Para analizar selección del criterio de congruencia adecuado a partir
    de datos dados, considera un ángulo $\alpha = 149^\circ$ ubicado en la posición
    dada. Determina el valor de la medida asociada sabiendo que $x + 1094^\circ =
    149^\circ$.
  pasos:
  - Identificar la propiedad de selección del criterio de congruencia adecuado a partir
    de datos dados referida a $\alpha = 149^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1094 = 149 \implies x = 149 - 1094$.'
  - Concluir que la medida calculada para selección del criterio de congruencia adecuado
    a partir de datos dados es $x = -945^\circ$.
