procedimiento:
- 'Paso 1: Identificar el área total del triángulo original o el área del triángulo
  medial.'
- 'Paso 2: Para hallar el área del triángulo medial, dividir el área total entre 4:
  $\text{Área}_{\text{medial}} = \frac{\text{Área}_{\text{total}}}{4}$.'
- 'Paso 3: Para hallar el área total, multiplicar el área medial por 4: $\text{Área}_{\text{total}}
  = 4 \cdot \text{Área}_{\text{medial}}$.'
- 'Paso 4: Asignar las unidades de área cuadradas correspondientes.'
errores_correccion: No confundas el factor de escala de lados (1/2) con el factor
  de escala de áreas ((1/2)² = 1/4).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el área total de un triángulo es $100\text{ cm}^2$, ¿cuál es el área
    del triángulo medial central?
  alternativas:
  - $25\text{ cm}^2$
  - $50\text{ cm}^2$
  - $12.5\text{ cm}^2$
  respuesta: $25\text{ cm}^2$
  solucion_pasos:
  - $\text{Área} = \frac{100}{4} = 25\text{ cm}^2$.
- titulo: Ejemplo 2
  enunciado: ¿Qué porcentaje del área total del triángulo representa la suma de los
    tres triángulos exteriores adyacentes a los vértices?
  alternativas:
  - $75\%$ ($3/4$ del total)
  - $50\%$ ($1/2$ del total)
  - $25\%$ ($1/4$ del total)
  respuesta: $75\%$ ($3/4$ del total)
  solucion_pasos:
  - Cada triángulo exterior ocupa $\frac{1}{4}$ ($25\%$). La suma de los tres es $3
    \times 25\% = 75\% = \frac{3}{4}$.
- titulo: ¿El área del triángulo medial es igual a un cuarto del área del triángulo
    original?
  respuesta: Sí
  solucion_pasos:
  - Sí, debido a que la razón de semejanza es $1/2$ y $(1/2)^2 = 1/4$.
- titulo: ¿El área del triángulo medial es igual a la mitad del área del triángulo
    original?
  respuesta: 'No'
  solucion_pasos:
  - No, es igual a la cuarta parte ($1/4$), no a la mitad.
errores_frecuentes:
- Dividir entre 2 en vez de dividir entre 4 al calcular el área medial.
- Confundir la razón de perímetro (1:2) con la razón de área (1:4).
- Creer que el área depende de la forma del triángulo (la razón 1:4 se cumple en todos).
- Olvidar que $k^2 = (1/2)^2 = 1/4$.
- Confundir el área del triángulo medial con la división en 6 áreas del baricentro.
afirmaciones_verdaderas:
- El área del triángulo central formado por los segmentos medios es un cuarto del
  área del triángulo original.
- La razón entre el área del triángulo medial y el triángulo original es 1:4.
al_terminar_debes_poder: '**QUÉ:** Calcular y fundamentar la razón de área 1:4 del
  triángulo medial respecto al triángulo original.


  **CÓMO:** Aplicando la relación cuadrática de semejanza $k^2 = (1/2)^2 = 1/4$ y
  la fórmula $\text{Área}(\Delta M_a M_b M_c) = \frac{1}{4}\text{Área}(\Delta ABC)$.


  ![Resumen de Razón 1:4](/static/img/nodos/razon-de-area-14-entre-el-triangulo-central-formado-por-segmentos-medios-y-el-triangulo-original-resumen.svg)

  '
