semantic_id: MAT.GEO.SEGMENTO_MEDIO.TRIANGULO_CENTRAL_AREA_UN_CUARTO
resumen_inicial: 'El área del triángulo central (o medial) formado al unir los tres
  segmentos medios es exactamente igual a la cuarta parte del área del triángulo original:
  $\text{Área}(\Delta M_a M_b M_c) = \frac{1}{4}\text{Área}(\Delta ABC)$, lo que corresponde
  a la razón de áreas $1:4$.'
explicacion_simple: '![Razón de Área 1:4](/static/img/nodos/razon-de-area-14-entre-el-triangulo-central-formado-por-segmentos-medios-y-el-triangulo-original-intro.svg)


  Como los 3 segmentos medios parten el triángulo en 4 partes idénticas:


  - **El del centro ocupa una cuarta parte**: El triángulo medial central tiene exactamente
  $\frac{1}{4}$ del espacio total ($25\%$).

  - **Razón $1:4$**: Si el triángulo grande tiene un área de $100\text{ cm}^2$, el
  del centro tiene $25\text{ cm}^2$.

  - **Los lados a la mitad, el área a la cuarta parte**: Como los lados se achicaron
  a la mitad ($k = 1/2$), el área se achica al cuadrado: $k^2 = (1/2)^2 = 1/4$.

  '
explicacion_formal: '### Teorema de la razón de áreas 1:4

  El área del triángulo medial central formado por los tres segmentos medios es exactamente
  igual a la **cuarta parte** del área del triángulo original:


  $$\operatorname{Área}(\Delta M_a M_b M_c) = \frac{1}{4} \operatorname{Área}(\Delta
  ABC) \iff \frac{\operatorname{Área}_{\text{medial}}}{\operatorname{Área}_{\text{total}}}
  = k^2 = \left(\frac{1}{2}\right)^2 = \frac{1}{4}$$


  ### Desglose simbólico y geométrico

  - Razón cuadrática de semejanza: Al ser la razón lineal $k = 1/2$, la razón de áreas
  poligonales es $k^2 = 1/4$.

  - Área exterior restante: Los tres triángulos exteriores en los vértices suman juntos
  las tres cuartas partes ($3/4$ o $75\%$) del área total.


  ### Síntesis didáctica

  La relación $1:4$ fundamenta el escalamiento de superficies en geometría y fractales
  como el triángulo de Sierpinski.'
definiciones_clave: '- **Razón de área ($1:4$)**: Relación proporcional entre la superficie
  del triángulo medial y el triángulo fundamental.

  - **Razón de semejanza cuadrática ($k^2$)**: Propiedad geométrica según la cual
  las áreas de figuras semejantes varían con el cuadrado del factor de escala lineal.

  - **Triángulo medial**: Triángulo cuyos vértices son los tres puntos medios de los
  lados.

  '
propiedades_relaciones: '- **Área del triángulo medial**: $\text{Área}(\Delta M_a
  M_b M_c) = \frac{1}{4}\text{Área}(\Delta ABC)$.

  - **Razón de áreas**: $\frac{\text{Área}(\Delta M_a M_b M_c)}{\text{Área}(\Delta
  ABC)} = \frac{1}{4}$.

  - **Área de los tres triángulos exteriores**: $\text{Área}(\Delta_1 + \Delta_2 +
  \Delta_3) = \frac{3}{4}\text{Área}(\Delta ABC)$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Razón 1:4](/static/img/nodos/razon-de-area-14-entre-el-triangulo-central-formado-por-segmentos-medios-y-el-triangulo-original-ejemplos.svg)


    Un terreno triangular tiene un área total de $480\text{ m}^2$. Se delimita una
    zona central conectando los puntos medios de sus tres linderos. ¿Cuál es el área
    de la zona central y cuál es el área de la superficie restante?

    '
  pasos:
  - 'Paso 1: Aplicar la relación de área del triángulo medial: $\text{Área central}
    = \frac{1}{4}\text{Área total}$.'
  - 'Paso 2: Calcular el área central: $\frac{480\text{ m}^2}{4} = 120\text{ m}^2$.'
  - 'Paso 3: Calcular el área restante restando la zona central: $480 - 120 = 360\text{
    m}^2 = \frac{3}{4}(480)$.'
  - 'Paso 4: Concluir que la zona central mide $120\text{ m}^2$ y la superficie restante
    mide $360\text{ m}^2$.'
checkpoints:
- placement: after_explicacion_formal
