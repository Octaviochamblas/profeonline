semantic_id: MAT.ALG.CLASIFICACION_TECNICA.EXPRESION_IRRACIONAL
resumen_inicial: 'La identificación de expresión algebraica irracional consiste en reconocer aquellas expresiones en las cuales al menos una variable o letra se encuentra dentro de un signo radical o posee un exponente fraccionario.'
explicacion_simple: |
  Una **expresión algebraica irracional** es una expresión en la que **hay letras dentro de una raíz**:
  - **Condición clave**: Al menos una variable o letra debe estar encerrada por un radical (como $\sqrt{x}$, $\sqrt[3]{y}$) o elevada a una fracción (como $x^{1/2}, y^{3/4}$).
  - Ejemplos de expresiones irracionales: $\sqrt{x} + 5$, $3x\sqrt{y - 1}$, $x^{2/3} - 4$.
  - **¡Cuidado con la trampa!** Si ves $\sqrt{9} \cdot x$ o $\sqrt{5} \cdot x$, esas expresiones **NO son irracionales**, porque la raíz está sobre un número ($9$ o $5$), no sobre la letra $x$.
  - Para eliminar una raíz en una ecuación irracional se suele elevar ambos miembros a la potencia del índice del radical.
explicacion_formal: |
  ### Definición formal
  Una expresión algebraica $E(x_1, \dots, x_k)$ es **irracional** respecto a la variable $x_i$ si la variable se encuentra en la base de una potencia cuyo exponente es un número racional no entero:

  $$E(x_1, \dots, x_k) \notin \mathbb{R}(x_1, \dots, x_k) \iff \exists x_i, \quad \operatorname{exp}(x_i) = \frac{p}{q} \in \mathbb{Q} \setminus \mathbb{Z} \quad (q \ge 2)$$

  lo que equivale sintácticamente a la presencia del operador radical $\sqrt[q]{x_i^p}$ actuando sobre la variable.

  ### Restricción de Dominio por Radicación Par
  Si el índice del radical $q$ es un número par ($q = 2, 4, 6\dots$), la cantidad subradical que contiene a la variable exige la condición de no negatividad en $\mathbb{R}$:

  $$\sqrt[2n]{U(x_1, \dots, x_k)} \implies \operatorname{Dom}(E) = \{(x_1, \dots, x_k) \in \mathbb{R}^k \mid U(x_1, \dots, x_k) \ge 0\}$$

  ### Síntesis didáctica
  La irracionalidad algebraica requiere el uso de propiedades de radicación y potencia fraccionaria ($x^{p/q} = \sqrt[q]{x^p}$). Sus ecuaciones pueden generar raíces extrañas al elevar al cuadrado.
definiciones_clave: |
  - **Expresión algebraica irracional**: Expresión que contiene al menos una variable sometida a radicación o exponente fraccionario.
  - **Cantidad subradical**: Expresión contenida en el interior de un signo radical.
  - **Índice del radical**: Número entero $q \ge 2$ que define el orden de la raíz ($\sqrt[q]{}$).
propiedades_relaciones: |
  - **Racionalización**: Procedimiento algebraico que elimina los radicales del denominador o numerador mediante la multiplicación por un factor conjugado adecuado.
  - **Transformación a potencia**: Todo radical con variable se puede reescribir como una potencia de exponente fraccionario: $\sqrt[q]{x^p} = x^{p/q}$.
ejemplo_guiado:
  enunciado: 'Dado el objeto algebraico $E(x) = \sqrt{x - 3} + 4x$, justifica por qué es una expresión irracional y calcula su dominio de definición real.'
  pasos:
    - 'Paso 1: Observamos que la variable $x$ se encuentra contenida dentro del radical de índice par $2$ ($\sqrt{x - 3}$) $\implies$ **Es una expresión irracional**.'
    - 'Paso 2: Como es una raíz cuadrada real, exigimos que la cantidad subradical sea mayor o igual a cero: $x - 3 \ge 0$.'
    - 'Paso 3: Despejamos la desigualdad: $x \ge 3$.'
    - 'Conclusión: Es una **expresión irracional** cuyo dominio real es el intervalo **$[3, +\infty[$** (es decir, la variable $x$ debe ser mayor o igual a $3$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué característica define indispensablemente a una expresión algebraica como irracional?'
    choices:
      - {text: 'Tener al menos una variable o letra dentro de una raíz o elevada a un exponente fraccionario', is_correct: true}
      - {text: 'Tener coeficientes numéricos que son números irracionales como pi ($\pi$)', is_correct: false}
      - {text: 'Tener un denominador con números enteros impares', is_correct: false}
      - {text: 'Estar formada por más de cuatro términos algebraicos', is_correct: false}
    explanation: 'La alternativa correcta es ''Tener al menos una variable o letra dentro de una raíz o elevada a un exponente fraccionario''. Definición de expresión irracional.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la expresión irracional con raíz cuadrada real $\sqrt{2x - 8}$, ¿cuál es el dominio de valores reales permisibles para la variable $x$?'
    choices:
      - {text: 'El intervalo $x \ge 4$, para asegurar que la cantidad subradical sea no negativa ($2x - 8 \ge 0$)', is_correct: true}
      - {text: 'Todo el conjunto de los números reales sin ninguna restricción', is_correct: false}
      - {text: 'Únicamente el valor $x = 0$', is_correct: false}
      - {text: 'Únicamente los números negativos', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo $x \ge 4$, para asegurar que la cantidad subradical sea no negativa ($2x - 8 \ge 0$)''. $2x \ge 8 \implies x \ge 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Buscar en la expresión la presencia de signos radicales ($\sqrt{}$) o exponentes fraccionarios.'
  - 'Paso 2: Comprobar que dentro de la raíz o en la base del exponente fraccionario figure una variable o letra.'
  - 'Paso 3: Si al menos una letra está bajo raíz o en exponente fraccionario, clasificar como **Irracional**.'
  - 'Paso 4: Para raíces de índice par, calcular el dominio imponiendo que la cantidad subradical sea mayor o igual a cero ($\ge 0$).'
errores_correccion: |
  - **Error 1:** Clasificar como irracional a expresiones como $\sqrt{5} \cdot x$ donde la raíz sólo afecta al número $5$. **Cómo corregirlo:** Para ser irracional **la RAÍZ DEBE AFECTAR A LA VARIABLE**, no al coeficiente constante.
  - **Error 2:** Declarar que una expresión con exponente fraccionario como $x^{1/3}$ es racional por tener una fracción como exponente. **Cómo corregirlo:** El exponente fraccionario en la letra equivale a una raíz ($\sqrt[3]{x}$), por lo que **es IRRACIONAL**.
ejemplos:
  - titulo: 'Identificación de expresión irracional'
    enunciado: '¿Cuál de las siguientes expresiones es irracional?'
    alternativas:
      - '$5\sqrt{x} + 2$'
      - '$\sqrt{5} \cdot x + 2$'
      - '$\frac{x}{5} + 2$'
    respuesta: '$5\sqrt{x} + 2$'
    solucion_pasos:
      - '1. En $5\sqrt{x} + 2$, la variable $x$ está dentro de la raíz.'
      - '2. Es una expresión irracional.'
  - titulo: 'Exponente fraccionario como irracional'
    enunciado: 'La expresión $y^{3/5} - 1$, ¿es una expresión irracional?'
    alternativas:
      - 'Sí, equivale a la raíz $\sqrt[5]{y^3} - 1$'
      - 'No, es una expresión racional fraccionaria'
      - 'No, es un monomio entero'
    respuesta: 'Sí, equivale a la raíz $\sqrt[5]{y^3} - 1$'
    solucion_pasos:
      - '1. El exponente de $y$ es la fracción $3/5$.'
      - '2. Equivale a $\sqrt[5]{y^3} \implies$ Es irracional.'
  - titulo: 'Raíz impar en irracional'
    enunciado: 'En la expresión $\sqrt[3]{x}$, ¿está el dominio definido para todos los reales $\mathbb{R}$ por ser de índice impar 3?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, las raíces de índice impar admiten cantidades subradicales negativas.'
  - titulo: 'Simplificación a expresión racional'
    enunciado: 'Si tenemos $\sqrt{x^2}$ para $x > 0$, ¿se simplifica a la variable $x$, transformándose en racional?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\sqrt{x^2} = x$ para $x > 0$, eliminando la irracionalidad.'
errores_frecuentes:
  - 'Una expresión con la raíz de un número constante como raíz de 2 que multiplica a x es una expresión irracional.'
  - 'Las expresiones irracionales con raíces impares requieren que su cantidad subradical sea estrictamente positiva.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Elevar una expresión irracional a una potencia entera elimina la variable de la expresión.'
  - 'Las expresiones algebraicas irracionales son numéricamente idénticas a los números reales trascendentes.'
afirmaciones_verdaderas:
  - 'Una expresión algebraica es irracional si al menos una de sus variables se encuentra dentro de una raíz o con exponente fraccionario.'
  - 'Para raíces cuadradas reales de expresiones irracionales, la cantidad subradical con variables debe ser mayor o igual a cero.'
