procedimiento:
- 'Paso 1: Escanea la expresión en busca del símbolo radical ($\sqrt{}$).'
- 'Paso 2: Observa el interior del radical (el radicando).'
- 'Paso 3: Si encuentras al menos una letra en el radicando, la expresión completa
  se clasifica como Irracional.'
- 'Paso 4: También busca exponentes fraccionarios sobre letras (ej. $x^{2/3}$); si
  los hay, también es Irracional.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar identificación de expresión algebraica irracional.
ejemplos:
- titulo: Bajo techo
  enunciado: Verifica la clasificación de la expresión 4x + √(xy) - 8.
  solucion_pasos:
  - El primer término es entero (4x).
  - El segundo término tiene el símbolo radical.
  - Dentro del radical están las letras 'x' e 'y'.
  - Por la presencia de este segundo término, la expresión total es Irracional.
- titulo: Al analizar el modelo matemático del tiempo de caída de un objeto $t(h)
    = \sqrt{\frac{2h}{g}
  enunciado: 'Al analizar el modelo matemático del tiempo de caída de un objeto $t(h)
    = \sqrt{\frac{2h}{g}}$, donde $h$ (altura) es la única variable independiente
    del experimento y $g$ es una constante, un equipo debe clasificar la función.
    ¿Cuál es la clasificación técnica correcta de la expresión con respecto a $h$?
    (v1)


    Opciones: A) Es una expresión Irracional, porque la variable $h$ se encuentra
    operando desde dentro de un signo radical. · B) Es una expresión Racional Entera,
    porque $h$ está en el numerador de la fracción interna. · C) Es una expresión
    Racional Fraccionaria, porque hay una división. · D) Es un polinomio de primer
    grado.'
  solucion_pasos:
  - Al margen de que sea una fracción ($2h/g$), todo el bloque está atrapado dentro
    de una gran raíz cuadrada. Al estar la variable bajo ese techo, la expresión principal
    es Irracional.
  - 'Respuesta: Es una expresión Irracional, porque la variable $h$ se encuentra operando
    desde dentro de un signo radical.'
- titulo: 'Respecto de «Identificación de expresión algebraica irracional»: ¿La siguiente
    formulación e'
  enunciado: 'Respecto de «Identificación de expresión algebraica irracional»: ¿La
    siguiente formulación es correcta? «Una **Expresión Algebraica Irracional** es
    aquella en la que **al menos una de sus variables (letras) se encuentra dentro
    del signo de una raíz (radical)**, o bien, está elevada a un exponente fraccionario»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una **Expresión Algebraica Irracional**
    es aquella en la que **al menos una de sus variables (letras) se encuentra dentro
    del signo de una raíz (radical)**, o bien, está elevada a un exponente fraccionario.'
- titulo: 'Respecto de «Identificación de expresión algebraica irracional»: ¿La siguiente
    conclusión es'
  enunciado: 'Respecto de «Identificación de expresión algebraica irracional»: ¿La
    siguiente conclusión es correcta? «Clasificar como irracional a una expresión
    que tiene un número irracional, pero letras normales (ej. $\sqrt{5} \cdot x$).
    La irracionalidad algebraica requiere *variables* en la raíz»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una **Expresión Algebraica Irracional**
    es aquella en la que **al menos una de sus variables (letras) se encuentra dentro
    del signo de una raíz (radical)**, o bien, está elevada a un exponente fraccionario.'
errores_frecuentes:
- Clasificar como irracional a una expresión que tiene un número irracional, pero
  letras normales (ej. $\sqrt{5} \cdot x$). La irracionalidad algebraica requiere
  *variables* en la raíz.
- No reconocer que una letra elevada a una fracción (ej. $a^{3/4}$) es una expresión
  irracional oculta.
- La presencia de números infinitos no periódicos como $\pi$ o $e$ multiplicando a
  las variables.
- Para «¿Qué característica técnica obliga a que una expresión algebraica sea clasificada
  inmediatamente como 'Irracional'? (v1)», la respuesta correcta es La presencia de
  variables elevadas a exponentes negativos.
- El hecho de que la expresión no se pueda factorizar.
afirmaciones_verdaderas:
- La notación de identificación de expresión algebraica irracional sigue las convenciones
  del lenguaje algebraico.
al_terminar_debes_ponder: Identificar y operar con conceptos relativos a identificación
  de expresión algebraica irracional.
