semantic_id: MAT.ALG.CLASIFICACION_TECNICA.EXPRESION_IRRACIONAL
resumen_inicial: 'Identificación de expresión algebraica irracional: concepto y propiedades
  en Clasificación técnica de expresiones algebraicas.'
explicacion_simple: A veces, las variables se quedan atrapadas bajo un techo del cual
  no pueden salir fácilmente. Ese 'techo' es el símbolo de la raíz.
explicacion_formal: '### Definición formal


  La irracionalidad se define por el confinamiento de la incógnita dentro de una raíz.


  ### Desarrollo didáctico


  El término ''irracional'' aquí significa que no se puede escribir como una simple
  razón (fracción) de polinomios ordinarios.

  - $\sqrt{x}$ es una expresión irracional pura.

  - $5x^2 + \sqrt[3]{y} - 2$ es irracional. (El polinomio entero $5x^2$ se ''contagia''
  de irracionalidad con la sola presencia de $\sqrt[3]{y}$).

  - $z^{1/2}$ es irracional, porque un exponente fraccionario es la forma moderna
  de escribir una raíz ($z^{1/2} = \sqrt{z}$).


  El desafío con las expresiones irracionales de índice par (como la raíz cuadrada)
  es que su dominio está severamente restringido: lo que está dentro de la raíz no
  puede ser negativo en los números reales.'
definiciones_clave: '- **Identificación de expresión algebraica irracional**: Elemento
  fundamental del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Identificación de expresión algebraica
  irracional**: Reglas de notación y clasificación en clasificación técnica de expresiones
  algebraicas.'
ejemplo_guiado:
