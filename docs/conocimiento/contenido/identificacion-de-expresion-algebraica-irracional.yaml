resumen_inicial: Una expresión algebraica irracional es aquella en la que al menos
  una de sus variables literales se encuentra bajo un signo de radicación o con exponente
  fraccionario.
explicacion_simple: Decimos que una expresión es 'irracional' cuando las letras están
  encerradas dentro de una raíz (como $\sqrt{x}$, $\sqrt[3]{xy}$ o $x^{1/2}$). A diferencia
  de las racionales, estas expresiones requieren condiciones especiales para calcular
  su valor sobre números reales.
explicacion_formal: 'Se define la **Expresión Algebraica Irracional** $I(X)$ como
  aquella donde al menos una variable $x_j$ posee un exponente no entero $e_j \in
  \mathbb{Q} \setminus \mathbb{Z}$:


  $$\exists j \quad / \quad x_j^{p/q} \quad \text{con } q \ge 2, \quad p,q \in \mathbb{Z}
  \iff \sqrt[q]{x_j^p}$$


  > **Complemento didáctico:** Las expresiones irracionales introducen las funciones
  raíz y exigen dominios restringidos a la no negatividad en índices pares.'
definiciones_clave: '- **Expresión irracional**: Expresión con variables afectadas
  por radicación (exponentes en $\mathbb{Q} \setminus \mathbb{Z}$).

  - **Condición de radicando par**: $x_j \ge 0$ para $\sqrt[2k]{x_j}$.'
propiedades_relaciones: '- **Exponente fraccionario**: $\sqrt[n]{x^m} = x^{m/n}$.'
ejemplo_guiado:
  enunciado: Verifique si $E(x,y) = 5x^2 - 3\sqrt{y} + 8$ es una expresión algebraica
    irracional.
  pasos:
  - 'Paso 1: Examinar los términos de la expresión.'
  - 'Paso 2: En el término $-3\sqrt{y}$, la variable $y$ está dentro del signo de
    raíz cuadrada $\sqrt{y} = y^{1/2}$.'
  - 'Paso 3: Comprobar el exponente de $y$: $\frac{1}{2} \notin \mathbb{Z}$ (exponente
    fraccionario).'
  - 'Conclusión: Dado que contiene una variable en un radicando, SÍ es una expresión
    algebraica irracional.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué característica define a una expresión algebraica irracional?
  choices:
  - text: Que al menos una de sus variables figura dentro de un signo de radicación
      o con exponente fraccionario
    is_correct: true
  - text: Que no tiene números racionales en sus coeficientes
    is_correct: false
  - text: Que sus exponentes son enteros positivos superiores a 10
    is_correct: false
  - text: Que tiene un solo término de valor cero
    is_correct: false
  explanation: La alternativa correcta es 'Que al menos una de sus variables figura
    dentro de un signo de radicación o con exponente fraccionario'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5x^2 - 3sqrt(y) + 8, ¿por qué fue clasificada
    como irracional?
  choices:
  - text: Porque la variable y se encuentra afectada por la raíz cuadrada sqrt(y)
    is_correct: true
  - text: Porque el número 8 es una constante
    is_correct: false
  - text: Porque la variable x está elevada al cuadrado
    is_correct: false
  - text: Porque no contiene variables
    is_correct: false
  explanation: La alternativa correcta es 'Porque la variable y se encuentra afectada
    por la raíz cuadrada sqrt(y)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Inspeccionar la presencia de signos de radicación en la expresión.'
- 'Paso 2: Verificar si dentro de alguna raíz figura una variable o si hay exponentes
  fraccionarios.'
- 'Paso 3: Confirmar la clasificación como expresión algebraica irracional.'
errores_correccion: '- **Error 1: Clasificar $\sqrt{x^2}$ simplificada a $|x|$ como
  irracional en todo contexto.** **Cómo corregirlo:** Si la raíz se simplifica de
  forma exacta eliminando el radical en las variables, la expresión se reduce a racional.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes es una expresión irracional?
  alternativas:
  - 4x + sqrt(y) - 1
  - 3x^2 + 5/x
  - x/2 + y/3
  - (x + 1)^3
  respuesta: 4x + sqrt(y) - 1
  solucion_pasos:
  - 1. 4x + sqrt(y) - 1 posee la variable y bajo un signo de raíz. Es irracional.
- titulo: Ejemplo 2
  enunciado: La expresión x^(2/3) + 5, ¿es una expresión irracional?
  alternativas:
  - Sí, porque el exponente 2/3 de la variable es fraccionario (raíz cúbica)
  - No, es una expresión entera
  - No, es una expresión fraccionaria
  - Indeterminado
  respuesta: Sí, porque el exponente 2/3 de la variable es fraccionario (raíz cúbica)
  solucion_pasos:
  - 1. x^(2/3) equivale a root(3, x^2), ubicando a la variable en un radical irracional.
- titulo: ¿Es la expresión 7x - sqrt(x + 2) una expresión irracional?
  respuesta: Sí
  solucion_pasos:
  - Sí, contiene el término radical sqrt(x+2) sobre las variables.
- titulo: ¿Es la expresión sqrt(9)x^2 una expresión irracional?
  respuesta: 'No'
  solucion_pasos:
  - No, sqrt(9) = 3; la expresión se simplifica a 3x^2, que es racional y entera.
errores_frecuentes:
- Declarar irracional a una expresión donde la raíz afecta solo a una constante numéricamente
  real.
- Omitir simplificar raíces de variables que se reducen de forma exacta (como sqrt(x^2)).
- Declarar que las expresiones irracionales no pertenecen al álgebra elemental.
- Declarar exponentes negativos (fraccionarias) con exponentes fraccionarios (irracionales).
- Declarar que una expresión irracional jamás se puede evaluar numéricamente.
afirmaciones_verdaderas:
- Una expresión es irracional cuando contiene variables bajo signos de radicación
  o con exponentes fraccionarios.
- Las raíces que afectan únicamente a coeficientes numéricos no convierten a la expresión
  en irracional.
al_terminar_debes_ponder: Al terminar serás capaz de identificar una expresión algebraica
  irracional verificando si sus variables están bajo radicación o tienen exponentes
  fraccionarios.
