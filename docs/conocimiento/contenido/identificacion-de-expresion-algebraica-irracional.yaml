semantic_id: MAT.ALG.CLASIFICACION_TECNICA.EXPRESION_IRRACIONAL
resumen_inicial: 'Una expresión algebraica es irracional cuando al menos una de sus variables se encuentra bajo el signo de radicación o posee un exponente fraccionario irreductible.'
explicacion_simple: |
  - Una expresión algebraica es **irracional** cuando tiene **al menos una letra dentro de una raíz** o con un **exponente en fracción**.
  - Ejemplos típicos:
    - $3\sqrt{x} + 5y$ (la letra $x$ está dentro de la raíz cuadrada).
    - $4x^{2/3} - 7$ (el exponente de $x$ es la fracción $\frac{2}{3}$).
    - $\sqrt{x^2 + y^2}$ (las variables están bajo el radical).
  - **¡Cuidado con la trampa!** Si la raíz es solo de un número (como $\sqrt{3} \cdot x^2$), la expresión **NO es irracional**, porque la letra $x$ no está dentro de la raíz.

  ![Expresión Algebraica Irracional](/static/img/nodos/identificacion-de-expresion-algebraica-irracional-intro.svg)
explicacion_formal: |
  ### Definición formal
  Una expresión algebraica $E(x_1, \dots, x_n)$ es **irracional** si no puede representarse como el cociente de dos polinomios en $\mathbb{K}[x_1, \dots, x_n]$.
  Formalmente, contiene al menos una variable $x_k$ sometida a un operador de radicación irreducible o con exponente fraccionario:

  $$\exists x_k, \quad x_k^{m/n} \quad \text{con } m, n \in \mathbb{Z}, \; n \ge 2, \; \gcd(m, n) = 1$$

  ### Dominio y restricciones de radicación
  Para expresiones con radicales de índice par ($n = 2k$), el radicando que contiene variables debe satisfacer la condición de no negatividad en el cuerpo real:
  $$\sqrt[2k]{R(x)} \implies \operatorname{Dom}(E) = \{x \in \mathbb{R} : R(x) \ge 0\}$$
definiciones_clave: |
  - **Expresión algebraica irracional**: Expresión con variables afectadas por radicación o exponentes no enteros.
  - **Radicando variable**: Subexpresión algebraica con literales ubicada en el interior de un signo radical.
  - **Restricción de paridad**: Condición $R(x) \ge 0$ para raíces de índice par en $\mathbb{R}$.
propiedades_relaciones: |
  - **Radicales aparentes (simplificación)**: Si una raíz se simplifica exactamente para todo el dominio (ej. $\sqrt{x^2} = |x|$), la expresión es racional a trozos.
  - **Racionalización**: Proceso algebraico mediante el cual se transforman expresiones irracionales en expresiones con denominadores racionales.
ejemplo_guiado:
  enunciado: 'Determina si las siguientes expresiones son algebraicas irracionales justificando en cada caso: a) $P(x) = 5\sqrt{x^3} - 2x + 1$, b) $Q(x) = \sqrt{7}x^2 - 4x + 3$, c) $R(x, y) = 3x^{3/4}y^2 + 8$.'
  imagen: '/static/img/nodos/identificacion-de-expresion-algebraica-irracional-ejemplos.svg'
  pasos:
    - 'Paso 1: Analizamos $P(x) = 5\sqrt{x^3} - 2x + 1$: la variable $x$ está bajo la raíz cuadrada ($x^{3/2}$) $\implies$ **Es expresión algebraica irracional**.'
    - 'Paso 2: Analizamos $Q(x) = \sqrt{7}x^2 - 4x + 3$: la raíz cuadrada solo afecta al número 7; la variable $x$ tiene exponentes 2 y 1 (enteros) $\implies$ **NO es irracional (es Racional Entera)**.'
    - 'Paso 3: Analizamos $R(x, y) = 3x^{3/4}y^2 + 8$: la variable $x$ tiene exponente fraccionario no entero $\frac{3}{4}$ $\implies$ **Es expresión algebraica irracional**.'
    - 'Paso 4: Conclusión: $P(x)$ y $R(x, y)$ son irracionales; $Q(x)$ es racional entera.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes expresiones algebraicas es irracional?'
    choices:
      - text: '$4\sqrt{x} - 5x^2 + 1$'
        is_correct: true
      - text: '$\sqrt{5}x^3 - 2x + 7$'
        is_correct: false
      - text: '$\frac{3x + 1}{x^2 - 4}$'
        is_correct: false
      - text: '$2x^4 - 7x^2 + 9$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$4\sqrt{x} - 5x^2 + 1$''. La variable $x$ se encuentra bajo el signo de raíz cuadrada ($x^{1/2}$).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la expresión $E(x) = \sqrt{2}x^3 + \pi x$ NO es una expresión irracional?'
    choices:
      - text: 'Porque las raíces y constantes irracionales afectan solo a los números escalares, mientras que la variable $x$ tiene exponentes enteros ($3$ y $1$)'
        is_correct: true
      - text: 'Porque tiene dos términos'
        is_correct: false
      - text: 'Porque es una fracción'
        is_correct: false
      - text: 'Porque no tiene término independiente'
        is_correct: false
    explanation: 'La alternativa correcta es ''Porque las raíces y constantes irracionales afectan solo a los números escalares, mientras que la variable $x$ tiene exponentes enteros ($3$ y $1$)''. La clasificación técnica depende exclusivamente de las variables.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar todos los signos de raíz y exponentes de las variables.'
  - 'Paso 2: Comprobar si alguna variable figura en el radicando o tiene exponente fraccionario irreductible.'
  - 'Paso 3: Si al menos una variable está bajo radical o con exponente fraccionario, clasificar como expresión irracional.'
  - 'Paso 4: Establecer las restricciones de no negatividad para radicandos de índice par.'
errores_correccion: |
  - **Error 1:** Clasificar como irracional una expresión con números irracionales en los coeficientes (ej. $\sqrt{3}x^2$). **Cómo corregirlo:** La radicación debe afectar a **las variables literales**, no solo a los coeficientes.
  - **Error 2:** No convertir exponentes fraccionarios a raíces. **Cómo corregirlo:** Reconocer que $x^{m/n} = \sqrt[n]{x^m}$ es **estrictamente una expresión irracional**.
ejemplos:
  - titulo: 'Exponente fraccionario en variable'
    enunciado: '¿Es la expresión $P(x) = 2x^{1/3} + 5x - 1$ irracional?'
    alternativas:
      - 'Sí, porque $x^{1/3} = \sqrt[3]{x}$'
      - 'No, porque 5 y 1 son enteros'
      - 'Es una expresión fraccionaria'
    respuesta: 'Sí, porque $x^{1/3} = \sqrt[3]{x}$'
    solucion_pasos:
      - '1. El exponente $\frac{1}{3}$ no es entero.'
      - '2. Equivale a la raíz cúbica $\sqrt[3]{x}$.'
      - '3. Es una expresión irracional.'
  - titulo: 'Raíz numérica escalar'
    enunciado: '¿Es la expresión $\sqrt{5}x^2 + \sqrt{2}x$ irracional?'
    alternativas:
      - 'No, es una expresión racional entera porque las raíces son constantes numéricas'
      - 'Sí, tiene dos raíces'
      - 'Es fraccionaria'
    respuesta: 'No, es una expresión racional entera porque las raíces son constantes numéricas'
    solucion_pasos:
      - '1. Las raíces afectan a 5 y 2 (escalares).'
      - '2. La variable $x$ tiene potencias enteras 2 y 1.'
      - '3. Es racional entera.'
  - titulo: 'Presencia de radical en dos variables'
    enunciado: '¿Es $\sqrt{x} + \sqrt{y}$ una expresión algebraica irracional?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Ambas variables se encuentran dentro de radicales.'
      - '2. Es irracional.'
  - titulo: 'Exponente entero negativo vs irracional'
    enunciado: '¿Es la expresión $x^{-2}$ una expresión irracional?'
    respuesta: 'No'
    solucion_pasos:
      - '1. El exponente $-2$ es un número entero en $\mathbb{Z}$.'
      - '2. Es una expresión racional fraccionaria ($\frac{1}{x^2}$), no irracional.'
errores_frecuentes:
  - 'Confundir raíces que afectan a constantes numéricas (ej: $\sqrt{2}$) con expresiones irracionales.'
  - 'No identificar los exponentes fraccionarios como operadores de radicación.'
  - 'Creer que una expresión con potencias enteras negativas es irracional (es racional fraccionaria).'
  - 'Olvidar imponer la condición de no negatividad en el radicando para raíces de índice par.'
  - 'Suponer que una expresión irracional no puede combinarse con términos polinomiales enteros.'
afirmaciones_verdaderas:
  - 'Una expresión algebraica es irracional si al menos una de sus variables figura bajo un signo de radicación o con exponente fraccionario.'
  - 'La presencia de constantes irracionales en los coeficientes no altera el carácter racional de las variables.'
al_terminar_debes_poder: |
  ![Resumen de Expresión Irracional](/static/img/nodos/identificacion-de-expresion-algebraica-irracional-resumen.svg)

  QUÉ: Identificar y justificar la condición de irracionalidad en expresiones algebraicas evaluando variables bajo radicales y exponentes fraccionarios.
  CÓMO: Constatando la presencia de exponentes no enteros ($x^{m/n}$) o literales bajo raíces ($\sqrt[n]{R(x)}$) distinguiéndolos de coeficientes irracionales escalares.
