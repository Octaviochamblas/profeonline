semantic_id: MAT.GEO.RECTA_RELACIONES.PENDIENTE_DOS_PUNTOS
resumen_inicial: 'Cálculo de la pendiente de una recta dados dos puntos: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: La pendiente mide qué tan inclinada está una recta, y se puede
  calcular directamente a partir de dos puntos cualesquiera que pertenezcan a ella.
explicacion_formal: '![Pendiente entre dos puntos](/static/img/geometria/analitica/rectarel-pendiente-dos-puntos.svg)


  ### Definición formal


  La pendiente entre $(x_1,y_1)$ y $(x_2,y_2)$ es $m=\dfrac{y_2-y_1}{x_2-x_1}$, siempre
  que $x_1\neq x_2$.


  ### Desarrollo didáctico


  Para los puntos $(-2,-2)$ y $(3,3)$: $m=\dfrac{3-(-2)}{3-(-2)}=\dfrac{5}{5}=1$.'
