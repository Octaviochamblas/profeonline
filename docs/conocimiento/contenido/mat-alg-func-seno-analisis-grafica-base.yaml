semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.GRAFICA_BASE
resumen_inicial: 'Construcción de la gráfica base f(x) = sen(x): círculo unitario,
  amplitud, período y transformaciones de Análisis de la función seno.'
explicacion_simple: Al conectar los puntos de la tabla de valores, la función seno
  revela una curva suave y repetitiva que sube y baja de forma predecible.
explicacion_formal: '### Definición formal


  La gráfica de $f(x)=\sin(x)$ es el conjunto de puntos $(x,\sin(x))$ para todo $x\in\mathbb{R}$.
  Es una curva continua y suave (sin esquinas ni saltos), que oscila entre $-1$ y
  $1$, pasando por el origen.


  ### Desarrollo didáctico


  Partiendo de $(0,0)$, la curva sube hasta el máximo $(\pi/2,1)$, desciende cruzando
  el eje $x$ en $(\pi,0)$, sigue bajando hasta el mínimo $(3\pi/2,-1)$, y vuelve a
  subir hasta $(2\pi,0)$, completando un ciclo.'
definiciones_clave: '- **Construcción de la gráfica base f(x) = sen(x)**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a construcción de la gráfica base f(x) = sen(x).'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    construcción de la gráfica base f(x) = sen(x).
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de construcción de la gráfica base f(x) = sen(x).
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
