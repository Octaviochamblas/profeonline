semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.GRAFICA_BASE
resumen_inicial: 'Construcción y propiedades visuales de la gráfica base de la función seno $y = \sin(x)$ (la sinusoide).'
explicacion_simple: |
  La representación gráfica de $y = \sin(x)$ se conoce como **sinusoide**. Es una curva ondulante, continua y suave que sube y baja de manera fluida. Pasa exactamente por el origen $(0,0)$, sube hasta una cresta de altura $1$ cuando llega a $x = \frac{\pi}{2}$, baja cruzando el eje horizontal en $x = \pi$, cae hasta un valle profundo de $-1$ en $x = \frac{3\pi}{2}$ y regresa al eje horizontal en $x = 2\pi$. A partir de ese punto, la misma forma de onda se repite infinitamente en ambas direcciones.
explicacion_formal: |
  ### Definición formal
  La **gráfica de la función seno base** es el lugar geométrico del plano cartesiano compuesto por el conjunto continuo de puntos:
  $$\mathcal{G}_{\sin} = \{(x,y) \in \mathbb{R}^2 : y = \sin(x)\}$$
  Se caracteriza por ser una curva trascendente plana, acotada, periódica de período $T = 2\pi$ y simétrica respecto al origen de coordenadas.

  ### Desglose simbólico
  - Cero inicial: $(0,0)$
  - Máximo principal (cresta): $\left(\frac{\pi}{2}, 1\right)$
  - Cero intermedio: $(\pi, 0)$
  - Mínimo principal (valle): $\left(\frac{3\pi}{2}, -1\right)$
  - Cero final del ciclo: $(2\pi, 0)$

  ### Síntesis didáctica
  Visualizar la sinusoide permite comprender que la función no tiene esquinas ni saltos (es infinitamente derivable). Su comportamiento oscila de forma regular entre sus dos barreras horizontales invisibles $y = 1$ e $y = -1$.
definiciones_clave: |
  - **Sinusoide**: Nombre técnico de la curva ondulada suave producida por la gráfica de $y = \sin x$.
  - **Cresta**: Punto más alto alcanzado por la gráfica, ubicado en $y = 1$.
  - **Valle**: Punto más bajo alcanzado por la gráfica, ubicado en $y = -1$.
propiedades_relaciones: |
  - **Simetría con el origen**: Al rotar la curva $180^\circ$ alrededor del origen $(0,0)$, la gráfica coincide exactamente consigo misma (propiedad de función impar).
  - **Continuidad global**: Carece de discontinuidades, asíncronas o saltos bruscos.
ejemplo_guiado:
  enunciado: 'Identifica la concavidad de la gráfica de $y = \sin(x)$ en el intervalo $[0, \pi]$ y en el intervalo $[\pi, 2\pi]$.'
  pasos:
    - 'Paso 1: Observar la gráfica en el intervalo $[0, \pi]$ (semicírculo superior): la curva está por encima del eje X y se curva hacia abajo.'
    - 'Paso 2: Concluir que en $[0, \pi]$ la gráfica es **cóncava hacia abajo** (concavidad negativa).'
    - 'Paso 3: Observar la gráfica en el intervalo $[\pi, 2\pi]$ (semicírculo inferior): la curva está por debajo del eje X y se curva hacia arriba.'
    - 'Paso 4: Concluir que en $[\pi, 2\pi]$ la gráfica es **cóncava hacia arriba** (concavidad positiva), siendo el punto $(\pi, 0)$ un punto de inflexión.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por cuál de los siguientes puntos pasa la gráfica de la función seno base $y = \sin(x)$?'
    choices:
      - {text: 'Por el origen de coordenadas $(0, 0)$', is_correct: true}
      - {text: 'Por el punto de coordenadas $(0, 1)$', is_correct: false}
      - {text: 'Por el punto de coordenadas $(0, -1)$', is_correct: false}
      - {text: 'Por el punto de coordenadas $(1, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Por el origen de coordenadas $(0, 0)$''. Puesto que $\sin(0) = 0$, la gráfica interseca al eje Y en $y = 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿En qué valor de $x$ alcanza la sinusoide base $y = \sin(x)$ su primer pico más alto (cresta) positivo?'
    choices:
      - {text: '$x = \frac{\pi}{2}$', is_correct: true}
      - {text: '$x = \pi$', is_correct: false}
      - {text: '$x = \frac{3\pi}{2}$', is_correct: false}
      - {text: '$x = 2\pi$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \frac{\pi}{2}$''. En $x = \frac{\pi}{2}$ ($90^\circ$), la sinusoide alcanza su altura máxima de $1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Trazar el eje horizontal graduado en múltiplos de $\frac{\pi}{2}$ y el eje vertical entre $-1$ y $1$.'
  - 'Paso 2: Marcar los cinco puntos clave del ciclo: $(0,0)$, $\left(\frac{\pi}{2}, 1\right)$, $(\pi, 0)$, $\left(\frac{3\pi}{2}, -1\right)$ y $(2\pi, 0)$.'
  - 'Paso 3: Unir los puntos mediante una curva suave en forma de "S" acostada.'
  - 'Paso 4: Repetir el patrón sinusoidal periódicamente a lo largo de todo el eje horizontal.'
errores_correccion: |
  - **Error 1:** Dibujar la gráfica del seno como segmentos de recta rectos formando triángulos tipo serrucho. **Cómo corregirlo:** La sinusoide es una curva suave y redondeada en las crestas y valles; nunca debe dibujarse con esquinas en punta.
  - **Error 2:** Iniciar la curva del seno en la altura $1$ como si fuera un coseno. **Cómo corregirlo:** La curva del seno pasa por el origen $(0,0)$ e inicia subiendo en el primer cuadrante.
ejemplos:
  - titulo: 'Intersección con el eje Y'
    enunciado: '¿En qué valor del eje Y corta la gráfica de $y = \sin(x)$ al eje vertical?'
    alternativas:
      - 'En $y = 0$'
      - 'En $y = 1$'
      - 'En $y = -1$'
    respuesta: 'En $y = 0$'
    solucion_pasos:
      - '1. Para el eje Y, $x = 0$.'
      - '2. $y = \sin(0) = 0$.'
      - '3. Corta en la coordenada $(0,0)$.'
  - titulo: 'Comportamiento en pi medios'
    enunciado: '¿La gráfica del seno alcanza la altura $y = 1$ en $x = \frac{\pi}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es el punto más alto del primer ciclo.'
  - titulo: 'Forma de onda repetitiva'
    enunciado: '¿La forma gráfica de la sinusoide entre $0$ y $2\pi$ se repite idénticamente entre $2\pi$ y $4\pi$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la propiedad de periodicidad de período $T = 2\pi$.'
  - titulo: 'Punto de inflexión en pi'
    enunciado: '¿El punto $(\pi, 0)$ es un punto donde la curva pasa de ser cóncava hacia abajo a cóncava hacia arriba?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en $(\pi, 0)$ la curva cruza el eje X cambiando el sentido de su concavidad.'
errores_frecuentes:
  - 'La afirmación de que la gráfica de la función seno base interseca al eje Y en la posición $y = 1$.'
  - 'La afirmación de que la sinusoide está compuesta por segmentos planos rectos con picos en punta.'
  - 'La afirmación de que la gráfica del seno se detiene al llegar a $x = 2\pi$.'
  - 'La afirmación de que el valle inferior del seno se ubica en $x = \pi$.'
  - 'La afirmación de que la gráfica del seno es simétrica respecto al eje Y.'
afirmaciones_verdaderas:
  - 'La gráfica de la función seno base $y = \sin(x)$ es una curva suave y continua llamada sinusoide que pasa por el origen $(0,0)$.'
  - 'Un ciclo completo de la sinusoide se extiende en el intervalo $[0, 2\pi]$, alcanzando su cresta en $\left(\frac{\pi}{2}, 1\right)$ y su valle en $\left(\frac{3\pi}{2}, -1\right)$.'
al_terminar_debes_poder: |
  QUÉ: Reconocer y graficar la sinusoide base de la función seno $y = \sin(x)$.
  CÓMO: Identificar y ubicar los puntos clave $(0,0)$, $\left(\frac{\pi}{2}, 1\right)$, $(\pi, 0)$, $\left(\frac{3\pi}{2}, -1\right)$ y $(2\pi, 0)$ sobre el plano cartesiano.
