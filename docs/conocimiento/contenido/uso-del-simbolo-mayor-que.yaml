semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.SIMBOLO_MAYOR
resumen_inicial: El símbolo de desigualdad mayor que ($>$) indica estrictamente que
  la cantidad de la izquierda es superior a la de la derecha.
explicacion_simple: 'El símbolo **mayor que** ($>$) abre sus dos puntas hacia el número
  más grande y apunta con su vértice cerrado hacia el número más pequeño.

  Escribir $a > b$ se lee ''$a$ es mayor que $b$'' y significa que en la recta numérica
  el número $a$ se encuentra estrictamente a la derecha del número $b$.'
explicacion_formal: 'Para toda pareja de números reales $a, b \in \mathbb{R}$, la
  proposición **estrictamente mayor que** se define mediante:


  $$a > b \iff a - b > 0$$


  **Desglose de la fórmula:**

  - $a > b$: La diferencia del primer término menos el segundo es un número estrictamente
  positivo (perteneciente a $\mathbb{R}^+$).'
definiciones_clave: '- **Símbolo mayor que ($>$)**: Operador de relación de orden
  estricto que indica que el primer término es mayor que el segundo.

  - **Desigualdad estricta**: Relación que excluye la posibilidad de igualdad entre
  los números comparados.'
propiedades_relaciones: '- **Equivalencia de sentido**: Escribir $a > b$ equivale
  de forma totalmente equivalente a escribir $b < a$.'
ejemplo_guiado:
  enunciado: Verifica la validez de la desigualdad estricta $8 > 3$ evaluando la diferencia
    $8 - 3$ y representa su equivalencia con el símbolo menor que.
  pasos:
  - 'Paso 1: Calcular la diferencia: $8 - 3 = 5$.Paso 2: Comprobar que $5 > 0$ es
    positivo, validando que $8 > 3$ es una proposición VERDADERA.Paso 3: Escribir
    la equivalencia invirtiendo los términos y el símbolo: $3 < 8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué proposición es totalmente equivalente a la desigualdad $a > b$?
  choices:
  - text: $b < a$
    is_correct: true
  - text: $b > a$
    is_correct: false
  - text: $a = b$
    is_correct: false
  - text: $a + b < 0$
    is_correct: false
  explanation: La alternativa correcta es '$b < a$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comprobar $8 > 3$, ¿cuál es el resultado de la diferencia $8 - 3$ que
    confirma la veracidad de la desigualdad?
  choices:
  - text: $5$ (número positivo)
    is_correct: true
  - text: $-5$ (número negativo)
    is_correct: false
  - text: $0$
    is_correct: false
  - text: $11$
    is_correct: false
  explanation: La alternativa correcta es '$5$ (número positivo)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar la cantidad más grande a la izquierda del símbolo $>$.'
- 'Paso 2: Colocar la cantidad más pequeña a la derecha del símbolo $>$.'
- 'Paso 3: Verificar que la diferencia de la izquierda menos la derecha sea positiva.'
errores_correccion: '- **Error común:** Confundir la orientación del símbolo e invertir
  su lectura (leer $8 > 3$ como ''8 es menor que 3'').

  - **Cómo corregirlo:** La abertura ancha de la boca del símbolo SIEMPRE señala hacia
  el número mayor.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de orden.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de orden.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El conjunto de los números reales es un conjunto ordenado?
  respuesta: Sí
  solucion_pasos:
  - Sí, permite comparar cualquier par de números reales.
- titulo: ¿La frase 'a lo sumo' se traduce con el símbolo menor o igual que?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'a lo sumo' establece una cota superior inclusiva ($\\le$).
errores_frecuentes:
- Creer que el número con mayor valor absoluto negativo es el número mayor.
- Confundir la orientación de los símbolos mayor que ($>$) y menor que ($<$).
- Pensar que las desigualdades no estrictas ($\ge, \le$) prohíben la igualdad exacta.
- Traducir frases de cota como 'al menos' excluyendo el número límite.
- Tratar una desigualdad numérica cerrada como si tuviera una variable por despejar.
afirmaciones_verdaderas:
- 'La ley de tricotomía garantiza que para dos números reales $a$ y $b$ se cumple
  una y solo una de las tres opciones: $a < b$, $a = b$ o $a > b$.'
- La expresión 'como máximo $k$' se traduce mediante la desigualdad no estricta $x
  \le k$.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar la relación de orden
  en $\mathbb{R}$, emplear los símbolos de desigualdad e interpretar restricciones
  verbales.
fuente: Texto escolar MINEDUC — Álgebra / Desigualdades e Inecuaciones
estado: publicado
