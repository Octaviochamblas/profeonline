semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.DEFINICION
resumen_inicial: El logaritmo en base $b$ de un número $a$ es el exponente $c$ al que se debe elevar la base $b$ para obtener el argumento $a$, denotado como $\log_b(a) = c \Longleftrightarrow b^c = a$, con $b > 0, b \neq 1$ y $a > 0$.
explicacion_simple: "![El logaritmo en base $b$ de un número $a$ es el exponente $c$ al que se debe elevar la base $b$ para obtener el argumento $a$, denotado como $\\log_b(a) = c \\Longleftrightarrow b^c = a$, con $b > 0, b \\neq 1$ y $a > 0$](/static/img/nodos/definicion-de-logaritmo-como-exponente-de-una-potencia-intro.svg)\n\n\nUn **logaritmo** no es más que una pregunta sobre potencias:\n\n$$\\log_b(a) = c \\quad \\Longleftrightarrow \\quad \\text{\"¿A qué exponente } c \\text{ debo elevar } b \\text{ para que dé } a\\text{?\"}$$\n\n- **Ejemplos rápidos:**\n  - $\\log_2(8) = \\mathbf{3}$ porque $2^3 = 8$.\n  - $\\log_3(81) = \\mathbf{4}$ porque $3^4 = 81$.\n  - $\\log_{10}(100) = \\mathbf{2}$ porque $10^2 = 100$.\n  - $\\log_5(5) = \\mathbf{1}$ porque $5^1 = 5$.\n- **¡Recuerda!** El resultado de un logaritmo **ES UN EXPONENTE**."
explicacion_formal: 'Sea $b \in \mathbb{R}^+ \setminus \{1\}$ y $a \in \mathbb{R}^+$. Dado que la función exponencial $\exp_b: \mathbb{R} \to \mathbb{R}^+$ con $\exp_b(x) = b^x$ es una biyección continua estrictamente monótona, existe una única aplicación inversa continua $\log_b: \mathbb{R}^+ \to \mathbb{R}$ tal que:

  $$\log_b(a) = c \Longleftrightarrow b^c = a$$


  **Condiciones de existencia axiomáticas**:

  1. **Base $b$**: $b > 0 \land b \neq 1$.

  2. **Argumento $a$**: $a > 0$ (el codominio de $b^c$ es estrictamente $\mathbb{R}^+$).

  3. **Valor del logaritmo $c$**: $c \in \mathbb{R}$ (puede ser positivo, negativo o cero).'
definiciones_clave: '- **Logaritmo**: Exponente necesario para producir una potencia dada desde una base fija.

  - **Base del logaritmo ($b$)**: Número real positivo distinto de 1 que actúa como base de la potencia.

  - **Argumento ($a$)**: Resultado positivo de la potencia evaluada.'
propiedades_relaciones: '- **Inversa funcional**: $\log_b(b^x) = x$ para todo $x \in \mathbb{R}$, y $b^{\log_b(y)} = y$ para todo $y \in \mathbb{R}^+$.

  - **Isomorfismo de grupos**: $\log_b$ es un isomorfismo del grupo multiplicativo $(\mathbb{R}^+, \cdot)$ al grupo aditivo $(\mathbb{R}, +)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El logaritmo en base $b$ de un número $a$ es el exponente $c$ al que se debe elevar la base $b$ para obtener el argumento $a$, denotado como $\log_b(a) = c \Longleftrightarrow b^c = a$, con $b > 0, b \neq 1$ y $a > 0$](/static/img/nodos/definicion-de-logaritmo-como-exponente-de-una-potencia-ejemplos.svg)



    Calcula el valor exacto de los siguientes logaritmos aplicando la definición fundamental:

    1) $\log_2(64)$

    2) $\log_3\left(\frac{1}{27}\right)$

    3) $\log_7(\sqrt{7})$'
  pasos:
  - 'Paso 1: Para $\log_2(64)$:

    - Plantear la ecuación exponencial: $2^c = 64$.

    - Expresar 64 en base 2: $64 = 2^6 \implies c = 6$.

    - Por tanto, $\log_2(64) = 6$.'
  - 'Paso 2: Para $\log_3(1/27)$:

    - Plantear: $3^c = \frac{1}{27}$.

    - Expresar $1/27$ en base 3: $\frac{1}{27} = 3^{-3} \implies c = -3$.

    - Por tanto, $\log_3(1/27) = -3$.'
  - 'Paso 3: Para $\log_7(\sqrt{7})$:

    - Plantear: $7^c = 7^{1/2} \implies c = 1/2$.

    - Por tanto, $\log_7(\sqrt{7}) = \frac{1}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\log_5(125)$?
  choices:
  - text: 3 (porque 5³ = 125)
    is_correct: true
  - text: 25 (125 dividido por 5)
    is_correct: false
  - text: '15'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: La alternativa correcta es '3 (porque 5³ = 125)'. El logaritmo busca el exponente de 5 que da 125, que es 3.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuánto vale $\log_2(0,25)$?
  choices:
  - text: -2 (porque 0,25 = 1/4 = 2⁻²)
    is_correct: true
  - text: 0,5
    is_correct: false
  - text: -0,5
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: La alternativa correcta es '-2 (porque 0,25 = 1/4 = 2⁻²)'. $2^{-2} = \frac{1}{4} = 0,25 \implies \log_2(0,25) = -2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la ecuación exponencial equivalente $b^c = a$.'
- 'Paso 2: Descomponer el argumento $a$ en factores primos para expresarlo en base $b$.'
- 'Paso 3: Igualar los exponentes de las potencias de igual base.'
- 'Paso 4: Enunciar el exponente $c$ como el valor numérico del logaritmo.'
errores_correccion: '- **Error común:** Dividir el argumento por la base (ej: $\log_2(8) = 4$).

  - **Cómo corregirlo:** El logaritmo **busca el EXPONENTE de la potencia**: $2^3 = 8 \implies \log_2(8) = \mathbf{3}$.'
ejemplos:
- titulo: 'Ejemplo 1: Base entera'
  enunciado: ¿Cuál es el valor de $\log_4(16)$?
  alternativas:
  - '2'
  - '4'
  - '8'
  - '1'
  respuesta: '2'
  solucion_pasos:
  - 'Paso 1: $4^2 = 16 \implies \log_4(16) = 2$.'
- titulo: 'Ejemplo 2: Exponente negativo'
  enunciado: 'Calcula $\log_{10}(0{,}001)$:'
  alternativas:
  - '-3'
  - '3'
  - '-2'
  - 0,01
  respuesta: '-3'
  solucion_pasos:
  - 'Paso 1: $10^{-3} = 0{,}001 \implies \log(0{,}001) = -3$.'
- titulo: 'Ejemplo 3: Base fraccionaria'
  enunciado: ¿Cuánto vale $\log_{1/2}(8)$?
  alternativas:
  - '-3'
  - '3'
  - '4'
  - '-4'
  respuesta: '-3'
  solucion_pasos:
  - 'Paso 1: $(1/2)^{-3} = 2^3 = 8 \implies \log_{1/2}(8) = -3$.'
- titulo: 'Ejemplo 4: Raíz en el argumento'
  enunciado: 'Calcula $\log_3(\sqrt[4]{3})$:'
  alternativas:
  - 1/4
  - '4'
  - 3/4
  - '1'
  respuesta: 1/4
  solucion_pasos:
  - 'Paso 1: $3^{1/4} = \sqrt[4]{3} \implies \log_3(\sqrt[4]{3}) = 1/4$.'
errores_frecuentes:
- Dividir el argumento entre la base en lugar de buscar el exponente de la potencia.
- Asumir que logaritmos con argumentos menores a 1 son negativos sin entender la ley de potencias.
- Intentar calcular logaritmos de números negativos o cero.
afirmaciones_verdaderas:
- Un logaritmo representa formalmente el exponente de una potencia.
- El valor de un logaritmo puede ser cualquier número real positivo, negativo o cero.
al_terminar_debes_poder: '**QUÉ:** Calcular y definir logaritmos como exponentes de potencias.


  **CÓMO:** Planteando la equivalencia log_b(a) = c ⟺ b^c = a y resolviendo la ecuación exponencial asociada.


