procedimiento:
- 'Paso 1: Calcula el vértice $(x_v,y_v)$ de la función.'
- 'Paso 2: Identifica si $y_v$ es un mínimo o un máximo según el signo de $a$.'
- 'Paso 3: Interpreta $y_v$ como el límite absoluto de la función en esa dirección.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en interpretación del valor extremo de la función
  cuadrática.
ejemplos:
- titulo: Interpretación de un valor extremo mínimo
  enunciado: Con vértice $(3,-2)$ y $a>0$, ¿qué se puede afirmar sobre los valores
    de $f(x)$?
  solucion_pasos:
  - El valor extremo es un mínimo.
  - $f(x)\geq-2$ para todo $x$ real; $-2$ es el valor más pequeño posible.
- titulo: Interpretación de un valor extremo máximo
  enunciado: Con vértice $(1,9)$ y $a<0$, ¿qué se puede afirmar sobre los valores
    de $f(x)$?
  solucion_pasos:
  - El valor extremo es un máximo.
  - $f(x)\leq9$ para todo $x$ real; $9$ es el valor más grande posible.
- titulo: ¿Puede la función tomar un valor menor que su mínimo (si $a>0$)?
  enunciado: ¿Puede la función tomar un valor menor que su mínimo (si $a>0$)?
  respuesta: 'No'
  solucion_pasos:
  - Por definición, el mínimo es el valor más pequeño que la función puede alcanzar;
    ningún otro valor es menor.
- titulo: ¿El valor extremo corresponde a la coordenada $x$ o a la coordenada $y$
    del vértice?
  enunciado: ¿El valor extremo corresponde a la coordenada $x$ o a la coordenada $y$
    del vértice?
  respuesta: 'No'
  solucion_pasos:
  - El valor extremo corresponde exclusivamente a la coordenada $y$ del vértice, no
    a la coordenada $x$.
errores_frecuentes:
- Declarar el valor extremo (coordenada $y$) con la posición donde ocurre (coordenada
  $x$).
- Afirmar incorrectamente que el valor extremo es un máximo cuando en realidad es
  un mínimo, o viceversa.
- No verificar el signo de $a$ antes de interpretar si el valor es un límite superior
  o inferior.
- Suponer que existen valores de la función más extremos que el del vértice.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  interpretación del valor extremo de la función cuadrática.
