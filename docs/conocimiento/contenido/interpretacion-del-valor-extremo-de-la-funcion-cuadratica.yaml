semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.VALOR_EXTREMO
resumen_inicial: La interpretación del valor extremo distingue rigurosamente entre el valor de la variable independiente $x_v$ (dónde o cuándo se alcanza la optimización) y el valor extremo de la función $y_v = f(x_v)$ (cuánto vale la magnitud óptima máxima o mínima).
explicacion_simple: "![La interpretación del valor extremo distingue rigurosamente entre el valor de la variable independiente $x_v$ (dónde o cuándo se alcanza la optimización) y el valor extremo de la función $y_v = f(x_v)$ (cuánto vale la magnitud óptima máxima o mínima)](/static/img/nodos/interpretacion-del-valor-extremo-de-la-funcion-cuadratica-intro.svg)\n\n\nEn los problemas de la vida real (física, economía, geometría), **el vértice te da dos respuestas distintas**:\n\n1. **La coordenada $x_v$ (¿DÓNDE / CUÁNDO?):**\n   - El tiempo $t$ en segundos para alcanzar la altura máxima.\n   - La cantidad de productos $x$ que debes fabricar para tener el costo más bajo.\n   - La medida del ancho de un terreno para tener la mayor área.\n2. **La coordenada $y_v$ (¿CUÁNTO?):**\n   - La altura máxima en metros ($h_{\text{máx}}$).\n   - El costo mínimo en pesos ($\\_\text{mín}$).\n   - El área máxima en metros cuadrados ($\\mathcal{A}_{\text{máx}}$).\n- **Regla de oro:** ¡Lee con atención qué\
  \ te preguntan para no responder $x$ cuando pedían $y$!"
explicacion_formal: 'Sea un modelo cuadrático de optimización $f: \mathcal{D} \to \mathbb{R}$ con $f(x) = ax^2 + bx + c$. El **par óptimo** $(x^*, y^*) \in \mathbb{R}^2$ satisface:

  $$x^* = x_v = -\frac{b}{2a} = \arg\max_{x \in \mathcal{D}} f(x) \quad (\text{o } \arg\min), \qquad y^* = y_v = f(x^*) = \max_{x \in \mathcal{D}} f(x) \quad (\text{o } \min)$$


  **Diccionario de variables en modelación aplicada**:

  1. **Cinemática vertical**: $h(t) = -\frac{1}{2}gt^2 + v_0t + h_0 \implies t_v = \frac{v_0}{g}$ (tiempo a altura máx [s]), $h_{\text{máx}} = h(t_v)$ (altura máxima [m]).

  2. **Economía de ingresos**: $I(p) = -k p^2 + m p \implies p_v$ (precio óptimo [\$]), $I_{\text{máx}} = I(p_v)$ (ingreso máximo [\$]).

  3. **Geometría perimetral**: $\mathcal{A}(x) = x(S - x) \implies x_v$ (dimensión óptima [m]), $\mathcal{A}_{\text{máx}}$ (área máxima [m²]).'
definiciones_clave: '- **Argumento óptimo ($x_v$ / argmax / argmin)**: Valor de entrada que optimiza el sistema.

  - **Magnitud óptima ($y_v$)**: Valor numérico extremo resultante tras la evaluación.'
propiedades_relaciones: '- **Dualidad contextual**: Toda optimización cuadrática aplicada vincula inseparablemente la causa ($x_v$) con el efecto ($y_v$).

  - **Consistencia dimensional**: $x_v$ tiene las unidades de la variable independiente; $y_v$ tiene las unidades de la función objetivo.'
ejemplo_guiado:
  enunciado: '![Ejemplo La interpretación del valor extremo distingue rigurosamente entre el valor de la variable independiente $x_v$ (dónde o cuándo se alcanza la optimización) y el valor extremo de la función $y_v = f(x_v)$ (cuánto vale la magnitud óptima máxima o mínima)](/static/img/nodos/interpretacion-del-valor-extremo-de-la-funcion-cuadratica-ejemplos.svg)



    La altura de un proyectil lanzado verticalmente viene dada por $h(t) = 40t - 5t^2$, donde $t$ se mide en segundos y $h$ en metros.

    1) ¿A los cuántos segundos alcanza su altura máxima?

    2) ¿Cuál es la altura máxima alcanzada?'
  pasos:
  - 'Paso 1: Reordenar la función: $h(t) = -5t^2 + 40t$ ($a = -5, b = 40, c = 0$).'
  - 'Paso 2: Responder la pregunta 1 ("¿A los cuántos segundos?" $\implies t_v$):

    $t_v = -\frac{b}{2a} = -\frac{40}{2(-5)} = \frac{40}{10} = 4\text{ segundos}$.'
  - 'Paso 3: Responder la pregunta 2 ("¿Cuál es la altura máxima?" $\implies h_v$):

    $h(4) = 40(4) - 5(4)^2 = 160 - 5(16) = 160 - 80 = 80\text{ metros}$.'
  - 'Paso 4: Concluir formalmente: El proyectil alcanza su altura máxima a los **4 segundos**, y dicha altura es de **80 metros**.'
checkpoints:
- placement: after_explicacion_formal
  question: En un problema de ganancias $G(x) = -2x^2 + 120x - 1000$, si preguntan "¿cuántos artículos x se deben vender para obtener la ganancia máxima?", ¿qué coordenada se debe calcular?
  choices:
  - text: La abscisa del vértice x_v = -b/(2a)
    is_correct: true
  - text: La ordenada del vértice y_v = f(x_v)
    is_correct: false
  - text: El término independiente c
    is_correct: false
  - text: El discriminante
    is_correct: false
  explanation: La alternativa correcta es 'La abscisa del vértice x_v = -b/(2a)'. La pregunta pide la cantidad de artículos ($x$), que corresponde a la abscisa del vértice.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una función de costo es $C(x) = x^2 - 10x + 60$ y se halla $x_v = 5$ y $y_v = 35$, ¿cuál es el costo mínimo?
  choices:
  - text: $35
    is_correct: true
  - text: 5 unidades
    is_correct: false
  - text: $60
    is_correct: false
  - text: $10
    is_correct: false
  explanation: La alternativa correcta es '$35'. El costo mínimo es el valor de la función en el vértice ($y_v = 35$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar qué magnitud representa $x$ (tiempo, unidades, longitud) y qué magnitud representa $y = f(x)$ (altura, ganancia, costo).'
- 'Paso 2: Calcular la abscisa del vértice $x_v = -\frac{b}{2a}$.'
- 'Paso 3: Calcular la ordenada del vértice $y_v = f(x_v)$.'
- 'Paso 4: Responder con precisión la interrogante del problema adjuntando las unidades físicas correctas.'
errores_correccion: '- **Error común:** Responder con el valor de $x$ (ej: $4\text{ s}$) cuando la pregunta pide "la altura máxima" ($80\text{ m}$).

  - **Cómo corregirlo:** Si piden el valor extremo, **debes entregar la ordenada $y_v$ calculada**.'
ejemplos:
- titulo: 'Ejemplo 1: Tiempo a la altura máxima'
  enunciado: En $h(t) = 50t - 5t^2$, ¿en qué segundo alcanza la mayor altura?
  alternativas:
  - A los 5 segundos
  - A los 10 segundos
  - A los 125 segundos
  - A los 2.5 segundos
  respuesta: A los 5 segundos
  solucion_pasos:
  - 'Paso 1: $t_v = -50/(2(-5)) = 5\text{ segundos}$.'
- titulo: 'Ejemplo 2: Altura máxima alcanzada'
  enunciado: En $h(t) = 50t - 5t^2$, ¿cuál es la altura máxima?
  alternativas:
  - 125 metros
  - 50 metros
  - 5 metros
  - 250 metros
  respuesta: 125 metros
  solucion_pasos:
  - 'Paso 1: $h(5) = 50(5) - 5(25) = 250 - 125 = 125\text{ metros}$.'
- titulo: 'Ejemplo 3: Producción para costo mínimo'
  enunciado: Si $C(x) = 3x^2 - 18x + 100$, ¿cuántas unidades minimizan el costo?
  alternativas:
  - 3 unidades
  - 18 unidades
  - 73 unidades
  - 6 unidades
  respuesta: 3 unidades
  solucion_pasos:
  - 'Paso 1: $x_v = -(-18)/(2(3)) = 18/6 = 3\text{ unidades}$.'
- titulo: 'Ejemplo 4: Área máxima rectangular'
  enunciado: El área de un jardín con 40 m de cerca es $\mathcal{A}(x) = x(20 - x)$. ¿Cuál es el área máxima?
  alternativas:
  - 100 m²
  - 10 m²
  - 200 m²
  - 20 m²
  respuesta: 100 m²
  solucion_pasos:
  - 'Paso 1: $x_v = 10 \implies \mathcal{A}(10) = 10(10) = 100\text{ m}^2$.'
errores_frecuentes:
- Confundir la variable independiente con la dependiente en la respuesta.
- Omitir las unidades de medida en el contexto del problema.
- No verificar si el extremo calculado corresponde a un máximo o a un mínimo.
afirmaciones_verdaderas:
- La abscisa del vértice indica el punto o instante donde ocurre la optimización.
- La ordenada del vértice cuantifica la magnitud máxima o mínima alcanzada.
al_terminar_debes_poder: '**QUÉ:** Interpretar contextualmente los valores extremos de una función cuadrática.


  **CÓMO:** Distinguiendo entre el punto de optimización x_v y el valor extremo y_v en problemas aplicados.


  ![Resumen La interpretación del valor extremo distingue rigurosamente entre el valor de la variable independiente $x_v$ (dónde o cuándo se alcanza la optimización) y el valor extremo de la función $y_v = f(x_v)$ (cuánto vale la magnitud óptima máxima o mínima)](/static/img/nodos/interpretacion-del-valor-extremo-de-la-funcion-cuadratica-resumen.svg)'
