semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.VALOR_EXTREMO
resumen_inicial: La interpretación del valor extremo traduce la ordenada del vértice $y_v$ al significado práctico del contexto aplicado (máxima ganancia, altura máxima, costo mínimo).
explicacion_simple: |
  En los problemas cotidianos o científicos modelados por funciones cuadráticas, el vértice te da la respuesta a preguntas clave como *"¿cuál es la máxima altura?"* o *"¿cuál es el costo mínimo?"*:

  - **Distinción crucial de las dos respuestas**:
    1. **"¿CUÁNDO o CON QUÉ VALOR ocurre el extremo?"**: Se refiere a la variable de entrada **$x = h = -\frac{b}{2a}$** (ej. a los $3$ segundos, vendiendo $50$ unidades).
    2. **"¿CUÁL ES el valor máximo o mínimo alcanzado?"**: Se refiere a la variable de salida **$y = k = f(h)$** (ej. la altura máxima es $45 \text{ m}$, la ganancia máxima es $\$100.000$).
explicacion_formal: |
  Sea el modelo contextual $y = f(x) = ax^2 + bx + c$ con dominio $D_{ctx} \subseteq \mathbb{R}$. La **interpretación del valor extremo** define la aplicación biyectiva entre las coordenadas del vértice $V(h, k)$ y el problema real:

  $$\Psi: V(h, k) \to (\text{Condición de Optimización}, \text{Valor Óptimo})$$

  **Matriz semántica de interpretación:**
  - $h = -\frac{b}{2a}$: Valor crítico del dominio donde se produce el punto de inflexión funcional.
  - $k = f(h)$: Magnitud del extremo absoluto (máximo o mínimo) en las unidades de la variable dependiente $y$.
definiciones_clave: |
  - **Valor extremo contextual**: Resultado de aplicar la coordenada vertical $k$ del vértice a una situación práctica de optimización no lineal.
propiedades_relaciones: |
  - **Invariancia contextual del tipo de extremo**: El carácter de máximo o mínimo depende del coeficiente $a$ generado por las leyes físicas o de costos del modelo.
ejemplo_guiado:
  enunciado: 'La ganancia de una empresa en miles de pesos por producir $x$ artículos es $G(x) = -x^2 + 20x - 30$. Interpreta las coordenadas del vértice $V(10, 70)$.'
  pasos:
    - 'Paso 1: Identificar el significado de $x$: cantidad de artículos producidos.'
    - 'Paso 2: Identificar el significado de $G(x)$: ganancia en miles de pesos.'
    - 'Paso 3: Interpretar la abscisa $h = 10$: la empresa debe producir **10 artículos** para lograr el mejor resultado.'
    - 'Paso 4: Interpretar la ordenada $k = 70$: la **ganancia máxima** alcanzada es de **70 mil pesos**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un problema de tiro parabólico de una pelota $h(t) = -5t^2 + 30t$, si el vértice es $V(3, 45)$, ¿cuál es la altura máxima alcanzada?'
    choices:
      - {text: 'La altura máxima es de 45 metros', is_correct: true}
      - {text: 'La altura máxima es de 3 metros.', is_correct: false}
      - {text: 'La altura máxima es de 30 metros.', is_correct: false}
      - {text: 'La altura máxima es de 5 metros.', is_correct: false}
    explanation: 'La alternativa correcta es ''La altura máxima es de 45 metros''. La ordenada $k = 45$ representa la altura máxima alcanzada.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En el mismo problema $h(t) = -5t^2 + 30t$ con vértice $V(3, 45)$, ¿en qué instante de tiempo se alcanza dicha altura máxima?'
    choices:
      - {text: 'A los 3 segundos de lanzamiento', is_correct: true}
      - {text: 'A los 45 segundos de lanzamiento.', is_correct: false}
      - {text: 'A los 30 segundos de lanzamiento.', is_correct: false}
      - {text: 'A los 5 segundos de lanzamiento.', is_correct: false}
    explanation: 'La alternativa correcta es ''A los 3 segundos de lanzamiento''. La abscisa $h = 3$ representa el tiempo en el que ocurre el máximo.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Leer la pregunta del problema identificando si pide el punto de control ($x$) o el valor óptimo ($y$).'
  - 'Paso 2: Calcular el vértice $V(h, k)$ de la función cuadrática del problema.'
  - 'Paso 3: Si la pregunta indaga por el "cuándo" o "cuántos", entregar $x = h$ con sus unidades.'
  - 'Paso 4: Si la pregunta indaga por el "cuánto es el máximo/mínimo", entregar $y = k$ con sus unidades.'
errores_correccion: |
  - **Error común:** Dar la respuesta de la variable $x$ cuando el problema preguntaba por el valor máximo $y$.
  - **Cómo corregirlo:** Lee con atención: **$x$ RESPONDE A "CUÁNDO / CUÁNTOS"**; **$y$ RESPONDE A "CUÁL ES EL MÁXIMO / MÍNIMO"**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Interpretación de ingreso máximo.
    alternativas:
      - 'Ingreso máximo de $500 cobrando $25 por entrada'
      - 'Ingreso máximo de $25 cobrando $500'
      - 'Ingreso constante de $25'
    respuesta: 'Ingreso máximo de $500 cobrando $25 por entrada'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Interpretación de costo mínimo.
    alternativas:
      - 'Costo mínimo de $120 produciendo 15 unidades'
      - 'Costo mínimo de $15 produciendo 120 unidades'
      - 'Costo nulo en x = 15'
    respuesta: 'Costo mínimo de $120 produciendo 15 unidades'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Entregar la coordenada $h$ cuando la pregunta exige el valor extremo de la función $k$.'
  - 'La falta de inclusión de las unidades de medida adecuadas ($\text{m}, \text{s}, \text{pesos}$) al redactar la respuesta contextual.'
  - 'La equivalencia errónea entre las preguntas de valor crítico de entrada y la evaluación de la imagen máxima o mínima.'
  - 'La suposición de que el valor extremo ocurre en el instante $x = 0$ o en el término independiente $c$.'
  - 'Responder con ambas coordenadas $(h, k)$ sin responder de forma explícita a la magnitud solicitada.'
afirmaciones_verdaderas:
  - 'La coordenada $h$ del vértice especifica la condición donde se alcanza el óptimo y la coordenada $k$ da el valor del máximo o mínimo.'
  - 'Interpretar el valor extremo requiere acompañar la ordenada $k$ por las unidades físicas o económicas propias de la situación real.'
al_terminar_debes_poder: |
  QUÉ: Interpretar contextualmente la coordenada $h$ y la ordenada $k$ del vértice en problemas de optimización.
  CÓMO: Distinguir si la pregunta solicita la variable de entrada $h$ o el valor extremo $k$ e incluir sus unidades correspondientes.
fuente: 'Texto escolar MINEDUC — Álgebra / Función Cuadrática'
