semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.VALOR_EXTREMO
resumen_inicial: 'Interpretación del valor extremo de la función cuadrática: parábola,
  vértice, concavidad y formas de El vértice, el eje de simetría y el recorrido.'
explicacion_simple: 'La coordenada $y$ del vértice no es un valor cualquiera: es el
  límite absoluto que la función puede alcanzar, ya sea hacia arriba o hacia abajo.'
explicacion_formal: '### Definición formal


  Si $(x_v,y_v)$ es el vértice de $f(x)=ax^2+bx+c$, entonces $y_v$ es el valor extremo
  de la función: si $a>0$, $y_v=\min\{f(x):x\in\mathbb{R}\}$; si $a<0$, $y_v=\max\{f(x):x\in\mathbb{R}\}$.


  ### Desarrollo didáctico


  Interpretar el valor extremo implica afirmar con seguridad que ningún otro valor
  de $x$ produce un resultado más extremo: para $a>0$, ningún $x$ da un $f(x)$ menor
  que $y_v$; para $a<0$, ninguno da un $f(x)$ mayor.


  Para $f(x)=x^2-4x+7$, con vértice $(2,3)$: el valor extremo es $3$, y se puede afirmar
  que $f(x)\geq3$ para todo $x$ real, sin excepción.'
definiciones_clave: '- **Interpretación del valor extremo de la función cuadrática**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  interpretación del valor extremo de la función cuadrática.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando interpretación
    del valor extremo de la función cuadrática.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a interpretación
    del valor extremo de la función cuadrática.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
