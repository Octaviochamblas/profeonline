semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.VALOR_EXTREMO
resumen_inicial: 'La interpretación del valor extremo distingue entre el valor óptimo de entrada $h = -\frac{b}{2a}$ y el valor óptimo alcanzado $k = f(h)$ en un problema de optimización.'
explicacion_simple: |
  En problemas de la vida real (como ganar la mayor cantidad de dinero o lograr la máxima altura de una pelota), las dos coordenadas del vértice responden a dos preguntas distintas: la abscisa $h$ responde a "¿cuánto o cuándo debo elegir?" (por ejemplo, a qué precio vender o en qué segundo), mientras que la ordenada $k$ responde a "¿cuál es el resultado máximo o mínimo obtenido?" (por ejemplo, la ganancia máxima o la altura máxima).
explicacion_formal: |
  ### Definición formal
  En la resolución de problemas de optimización cuadráticos $y = f(x) = ax^2 + bx + c$:
  - **Punto de optimización (preimagen óptima)**: $x_{\text{óptimo}} = h = -\frac{b}{2a} \in \text{Dom}(f)$.
  - **Valor óptimo alcanzado (extremo funcional)**: $y_{\text{óptimo}} = k = f(h) \in \text{Rec}(f)$.

  ### Desglose simbólico
  - Si $a < 0$: El valor $k = f(h)$ es el **máximo contextual** del modelo.
  - Si $a > 0$: El valor $k = f(h)$ es el **mínimo contextual** del modelo.

  ### Síntesis didáctica
  Leer cuidadosamente la pregunta en problemas verbales es decisivo. Si la pregunta pide la condición óptima (ej: "tiempo", "distancia", "cantidad de artículos"), la respuesta es $h$. Si la pregunta pide la cota optimizada (ej: "ganancia máxima", "altura máxima", "costo mínimo"), la respuesta es $k$.
definiciones_clave: |
  - **Valor extremo $k$**: Salida $f(h)$ que representa el resultado numérico optimizado del problema.
  - **Preimagen óptima $h$**: Entrada $x = -\frac{b}{2a}$ que genera el resultado extremo.
  - **Optimización cuadrática**: Proceso de encontrar el valor máximo o mínimo de un modelo expresado como función de segundo grado.
propiedades_relaciones: |
  - **Independencia de unidades**: Las unidades de $h$ corresponden a las de la variable independiente $x$, mientras que las unidades de $k$ corresponden a las de la variable dependiente $y$.
  - **Restricción de dominio físico**: Si $h$ no pertenece al dominio físico válido (ej: $h < 0$ para tiempo), el valor extremo en el contexto debe evaluarse en las fronteras del intervalo permitido.
ejemplo_guiado:
  enunciado: 'Un granjero modela el área en $m^2$ de un terreno rectangular mediante $A(x) = -2x^2 + 40x$, donde $x$ es el ancho en metros. Determina el ancho $x$ que maximiza el terreno y calcula el área máxima que se puede cercar.'
  pasos:
    - 'Paso 1: Identificamos los coeficientes: $a = -2 < 0$, $b = 40$, $c = 0$. Como $a < 0$, la función posee un máximo.'
    - 'Paso 2: Calculamos el ancho óptimo (abscisa $h$): $h = -\frac{b}{2a} = -\frac{40}{2(-2)} = -\frac{40}{-4} = 10\text{ metros}$.'
    - 'Paso 3: Evaluamos el área máxima alcanzada (ordenada $k$): $k = A(10) = -2(10)^2 + 40(10) = -2(100) + 400 = 200\text{ m}^2$.'
    - 'Paso 4: Interpretamos: el ancho que maximiza el terreno es $x = 10\text{ m}$, y el área máxima obtenida es de $200\text{ m}^2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un modelo de costos $C(x) = 3x^2 - 18x + 50$, donde $x$ es la cantidad de productos en miles, ¿qué representa el valor $h = 3$ obtenido de $h = -\frac{b}{2a}$?'
    choices:
      - {text: 'La cantidad de productos (3000 unidades) que minimiza el costo total', is_correct: true}
      - {text: 'El costo mínimo total de la empresa en miles de pesos', is_correct: false}
      - {text: 'El costo máximo alcanzado en el punto de equilibrio', is_correct: false}
      - {text: 'El número de productos que anula la ganancia', is_correct: false}
    explanation: 'La alternativa correcta es ''La cantidad de productos (3000 unidades) que minimiza el costo total''. La abscisa $h$ responde a la cantidad de entrada $x$ que minimiza la función.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'La altura de un proyectil en metros viene dada por $h(t) = -5t^2 + 30t + 2$. ¿Cuál es la altura máxima alcanzada por el proyectil y en qué segundo ocurre?'
    choices:
      - {text: 'Altura máxima de 47 metros a los 3 segundos', is_correct: true}
      - {text: 'Altura máxima de 3 metros a los 47 segundos', is_correct: false}
      - {text: 'Altura máxima de 30 metros a los 5 segundos', is_correct: false}
      - {text: 'Altura máxima de 45 metros a los 2 segundos', is_correct: false}
    explanation: 'La alternativa correcta es ''Altura máxima de 47 metros a los 3 segundos''. Calculamos el tiempo óptimo $t = -\frac{30}{2(-5)} = 3\text{ s}$ y la altura máxima $h(3) = -5(9) + 30(3) + 2 = 47\text{ m}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las variables del problema: variable independiente $x$ (entrada) y variable dependiente $y$ (salida).'
  - 'Paso 2: Calcular $h = -\frac{b}{2a}$ para responder a preguntas sobre la condición o preimagen óptima.'
  - 'Paso 3: Evaluar $k = f(h)$ para responder a preguntas sobre el valor extremo o cota alcanzada.'
errores_correccion: |
  - **Error 1:** Responder con el valor de $h$ cuando la pregunta solicita el valor máximo o mínimo $k$. **Cómo corregirlo:** La cota óptima es la salida $k = f(h)$. La abscisa $h$ solo indica la condición sobre la variable independiente.
  - **Error 2:** Confundir las unidades de medida asignando la unidad de $x$ al valor del extremo $k$. **Cómo corregirlo:** Verificar las dimensiones físicas: $h$ lleva las unidades de $x$ (ej: segundos, metros, artículos) y $k$ lleva las de $y$ (ej: metros, pesos, m²).
ejemplos:
  - titulo: 'Interpretación en modelos de utilidad'
    enunciado: 'Si la utilidad en dólares al fabricar $x$ objetos es $U(x) = -x^2 + 10x - 9$, ¿cuál es la utilidad máxima obtenida?'
    alternativas:
      - '16 dólares'
      - '5 dólares'
      - '9 dólares'
    respuesta: '16 dólares'
    solucion_pasos:
      - '1. Obtenemos el objeto óptimo $h = -\frac{10}{2(-1)} = 5$ objetos.'
      - '2. Evaluamos la utilidad máxima: $k = U(5) = -(5)^2 + 10(5) - 9 = -25 + 50 - 9 = 16$ dólares.'
      - '3. La utilidad máxima es 16 dólares.'
  - titulo: 'Diferenciación entre entrada y salida extrema'
    enunciado: 'En la función de altura de un objeto $h(t) = -4.9t^2 + 19.6t$, ¿el valor $t = 2$ representa el tiempo de vuelo hasta alcanzar la altura máxima?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Calculamos $h = -\frac{19.6}{2(-4.9)} = 2$ segundos, el cual indica el tiempo transcurrido hasta la máxima elevación.'
  - titulo: 'Extremo en problemas de área'
    enunciado: 'Si $A(x) = -x^2 + 12x$ representa el área de un rectángulo, ¿el área máxima se logra para $x = 6$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La abscisa $h = -\frac{12}{2(-1)} = 6$ es el valor que maximiza la función de área.'
  - titulo: 'Rol de k en funciones de costo'
    enunciado: 'En un modelo de costos cuadrático cóncavo hacia arriba, ¿la ordenada $k = f(h)$ representa el costo mínimo posible?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser $a > 0$, el vértice es un mínimo y la ordenada $k$ da el valor del costo mínimo.'
errores_frecuentes:
  - 'En un problema de optimización, la respuesta a la ganancia máxima es siempre la abscisa $h = -\frac{b}{2a}$.'
  - 'La cantidad $h$ en un modelo cuadrático de tiempo versus altura representa la altura máxima alcanzada.'
  - 'El valor extremo $k$ en una función cuadrática se calcula multiplicando el vértice por el término independiente $c$.'
  - 'Si la abscisa del vértice resulta $h = -4$ en un problema de producción física real, el modelo está siempre mal planteado.'
  - 'La ordenada del vértice $k$ indica el instante en que un objeto toca el suelo.'
afirmaciones_verdaderas:
  - 'La abscisa del vértice $h = -\frac{b}{2a}$ indica la preimagen o condición que optimiza una función cuadrática.'
  - 'La ordenada del vértice $k = f(h)$ representa el valor numérico extremo (máximo o mínimo) alcanzado por la función.'
al_terminar_debes_poder: 'Interpretar y aplicar el valor extremo $k$ y la condición óptima $h$ en la resolución de problemas contextualizados de optimización.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
