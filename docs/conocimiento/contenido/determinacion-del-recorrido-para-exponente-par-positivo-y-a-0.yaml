semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.RECORRIDO_PAR_A_POSITIVO
resumen_inicial: La determinación del recorrido para una función potencia con exponente par positivo y coeficiente positivo ($n = 2k, a > 0$) establece que $\operatorname{Rec}(f) = [0, +\infty[$, alcanzando un mínimo absoluto global en el vértice $(0, 0)$ debido al acotamiento inferior $x^{2k} \ge 0$.
explicacion_simple: "![La determinación del recorrido para una función potencia con exponente par positivo y coeficiente positivo ($n = 2k, a > 0$) establece que $\\operatorname{Rec}(f) = [0, +\\infty[$, alcanzando un mínimo absoluto global en el vértice $(0, 0)$ debido al acotamiento inferior $x^{2k} \\ge 0$](/static/img/nodos/determinacion-del-recorrido-para-exponente-par-positivo-y-a-0-intro.svg)\n\n\nCuando el exponente es **par positivo ($2, 4, 6...$)** y el número de afuera es **positivo ($a > 0$)**:\n\n$$\\operatorname{Rec}(f) = [0, +\\infty[ \\quad (\\text{Desde Cero Hasta Más Infinito})$$\n\n- **¿Por qué nunca da números negativos?**\n  - Cualquier número real elevado a un exponente par da siempre **cero o positivo** ($(-3)^4 = +81$).\n  - Al multiplicarlo por $a > 0$, el resultado sigue siendo **cero o positivo**.\n- **El punto más bajo (mínimo absoluto):** En el origen $(0, 0)$, donde $y = 0$.\n- **¡Cuidado con el corchete!** El cero sí se alcanza ($f(0) = 0$), por eso va con\
  \ **corchete cerrado $[0$**."
explicacion_formal: 'Sea $f(x) = a \cdot x^{2k}$ con $k \in \mathbb{Z}^+$ y $a \in \mathbb{R}^+$ ($a > 0$).

  Por el axioma de orden de los números reales:

  $$\forall x \in \mathbb{R}: \quad x^2 \ge 0 \implies x^{2k} = (x^2)^k \ge 0$$

  Al multiplicar por el escalar positivo $a > 0$, el sentido de la desigualdad se conserva idénticamente:

  $$a \cdot x^{2k} \ge a \cdot 0 = 0 \implies f(x) \ge 0, \; \forall x \in \mathbb{R}$$


  **Determinación del recorrido**:

  1. **Cota inferior alcanzable**: $f(0) = a \cdot 0^{2k} = 0 \implies 0 \in \operatorname{Rec}(f)$.

  2. **Sobreyectividad en $[0, +\infty[$**: Para todo $y_0 \ge 0$, existe al menos una preimagen real $x_0 = \pm \sqrt[2k]{y_0 / a} \in \mathbb{R}$ tal que $f(x_0) = y_0$.

  Por lo tanto:

  $$\operatorname{Rec}(f) = [0, +\infty[$$'
definiciones_clave: '- **Recorrido semiacotado inferiormente**: Intervalo $[0, +\infty[$ cerrado en cero.

  - **Mínimo absoluto global**: Valor $y = 0$ alcanzado exclusivamente en $x = 0$.'
propiedades_relaciones: '- **Preimágenes dobles**: Para cada $y > 0$, existen exactamente dos soluciones simétricas $x = \pm \sqrt[2k]{y/a}$.

  - **No inyectividad en $\mathbb{R}$**: Al generar preimágenes dobles, la función par no es inyectiva en su dominio completo.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del recorrido para una función potencia con exponente par positivo y coeficiente positivo ($n = 2k, a > 0$) establece que $\operatorname{Rec}(f) = [0, +\infty[$, alcanzando un mínimo absoluto global en el vértice $(0, 0)$ debido al acotamiento inferior $x^{2k} \ge 0$](/static/img/nodos/determinacion-del-recorrido-para-exponente-par-positivo-y-a-0-ejemplos.svg)



    Dada la función $f(x) = 3x^4$:

    1) Determina su recorrido.

    2) Encuentra todas las preimágenes para $y = 48$.

    3) Justifica por qué $y = -5$ no pertenece al recorrido.'
  pasos:
  - 'Paso 1: Como $n = 4$ (par) y $a = 3 > 0$, la cota inferior es $f(0) = 0$. Por lo tanto, **$\operatorname{Rec}(f) = [0, +\infty[$**.'
  - 'Paso 2: Resolver $3x^4 = 48$:

    - $x^4 = 16 \implies x = \pm \sqrt[4]{16} = \mathbf{\pm 2}$. Ambas pertenecen al dominio.'
  - 'Paso 3: Si planteamos $3x^4 = -5 \implies x^4 = -5/3 < 0$, lo cual carece de soluciones reales en $\mathbb{R}$, demostrando que **$-5 \notin \operatorname{Rec}(f)$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el recorrido de la función $f(x) = 7x^6$?
  choices:
  - text: '[0, +∞[ (cerrado en cero)'
    is_correct: true
  - text: ']0, +∞[ (abierto en cero)'
    is_correct: false
  - text: ℝ
    is_correct: false
  - text: '[7, +∞['
    is_correct: false
  explanation: La alternativa correcta es '[0, +∞[ (cerrado en cero)'. Al ser exponente par y $a = 7 > 0$, el valor mínimo es $f(0) = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántas preimágenes reales tiene el valor y = 80 en la función $f(x) = 5x^4$?
  choices:
  - text: Dos preimágenes simétricas (x = 2 y x = -2)
    is_correct: true
  - text: Una sola preimagen
    is_correct: false
  - text: Ninguna preimagen
    is_correct: false
  - text: Cuatro preimágenes reales
    is_correct: false
  explanation: La alternativa correcta es 'Dos preimágenes simétricas (x = 2 y x = -2)'. $5x^4 = 80 \implies x^4 = 16 \implies x = \pm 2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Constatar que el exponente $n$ sea un entero par positivo.'
- 'Paso 2: Verificar que el coeficiente principal $a$ sea estrictamente positivo ($a > 0$).'
- 'Paso 3: Evaluar el mínimo global en el vértice $f(0) = 0$.'
- 'Paso 4: Escribir el recorrido como el intervalo cerrado por la izquierda $\operatorname{Rec}(f) = [0, +\infty[$.'
errores_correccion: '- **Error común:** Escribir el recorrido con corchete abierto $]0, +\infty[$ excluyendo el 0.

  - **Cómo corregirlo:** El punto $(0, 0)$ **SÍ pertenece a la curva** ($f(0) = 0$), por lo que el cero debe incluirse obligatoriamente: **$[0, +\infty[$**.'
ejemplos:
- titulo: 'Ejemplo 1: Recorrido directo'
  enunciado: 'El recorrido de $f(x) = 0{,}2x^8$ es:'
  alternativas:
  - '[0, +inf['
  - ']0, +inf['
  - R
  - '[0,2, +inf['
  respuesta: '[0, +inf['
  solucion_pasos:
  - 'Paso 1: Exponente par con $a = 0{,}2 > 0 \implies \operatorname{Rec}(f) = [0, +\infty[$.'
- titulo: 'Ejemplo 2: Preimagen en el vértice'
  enunciado: ¿Qué valor de $x$ genera la cota inferior $y = 0$ en $f(x) = 4x^4$?
  alternativas:
  - x = 0
  - x = 4
  - x = 1
  - x = -4
  respuesta: x = 0
  solucion_pasos:
  - 'Paso 1: $4x^4 = 0 \implies x = 0$.'
- titulo: 'Ejemplo 3: Pertenencia al recorrido'
  enunciado: ¿Pertenece $y = 100$ al recorrido de $g(x) = x^2$?
  alternativas:
  - Sí, con preimágenes x = 10 y x = -10
  - No, es muy grande
  - Solo x = 10
  - Solo si x > 0
  respuesta: Sí, con preimágenes x = 10 y x = -10
  solucion_pasos:
  - 'Paso 1: $x^2 = 100 \implies x = \pm 10 \implies 100 \in [0, +\infty[$.'
- titulo: 'Ejemplo 4: No pertenencia de negativos'
  enunciado: ¿Por qué $y = -1$ no está en el recorrido de $f(x) = 6x^4$?
  alternativas:
  - Porque una potencia par multiplicada por un número positivo nunca es negativa
  - Porque -1 no es entero
  - Porque 6 es mayor que 1
  - Sí pertenece
  respuesta: Porque una potencia par multiplicada por un número positivo nunca es negativa
  solucion_pasos:
  - 'Paso 1: $6x^4 \ge 0 > -1$ para todo $x \in \mathbb{R}$.'
errores_frecuentes:
- Excluir el cero del recorrido colocando corchete abierto.
- Confundir el recorrido con todo R.
- 'Asumir que el recorrido comienza en el valor del coeficiente a (ej: [a, +inf[).'
afirmaciones_verdaderas:
- Toda función potencia con exponente par positivo y a > 0 tiene recorrido [0, +∞[.
- El valor y = 0 es el mínimo absoluto de la función y se alcanza en x = 0.
al_terminar_debes_poder: '**QUÉ:** Determinar el recorrido de funciones potencia con exponente par positivo y a > 0.


  **CÓMO:** Demostrando la no negatividad x²ᵏ ≥ 0 y el mínimo global f(0) = 0 para establecer Rec(f) = [0, +∞[.


