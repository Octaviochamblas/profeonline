semantic_id: MAT.NUM.FRACCIONES_COMPARACION.PRODUCTO_CRUZADO
resumen_inicial: "La comparación de fracciones mediante producto cruzado permite determinar qué fracción es mayor multiplicando en diagonal sus términos sin necesidad de calcular el m.c.m."
explicacion_simple: |
  Existe un atajo rápido para saber cuál de dos fracciones es mayor sin tener que buscar el mínimo común múltiplo. Si quieres comparar $\frac{3}{7}$ con $\frac{4}{9}$, multiplicas en diagonal:
  1. Multiplicas el numerador de la primera ($3$) por el denominador de la segunda ($9$): $3 \times 9 = 27$. Este número representa a la primera fracción.
  2. Multiplicas el denominador de la primera ($7$) por el numerador de la segunda ($4$): $7 \times 4 = 28$. Este número representa a la segunda fracción.
  Como $27 < 28$, sabemos de inmediato que la segunda fracción es mayor: $\frac{3}{7} < \frac{4}{9}$. ¡Así de rápido y fácil!
explicacion_formal: |
  Formalmente, dadas dos fracciones positivas $\frac{a}{b}$ y $\frac{c}{d}$ con $b, d \in \mathbb{Z}^+$:

  $\frac{a}{b} > \frac{c}{d} \iff a \cdot d > b \cdot c$
  $\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$
  $\frac{a}{b} < \frac{c}{d} \iff a \cdot d < b \cdot c$

  Demostración: al amplificar ambas fracciones al común denominador $b \cdot d > 0$, se obtienen las expresiones equivalente $\frac{a \cdot d}{b \cdot d}$ y $\frac{b \cdot c}{b \cdot d}$. Dado que el denominador $b \cdot d$ es estrictamente positivo, la relación de orden entre ambas depende de forma exclusiva de la desigualdad entre los numeradores resultantes $a \cdot d$ y $b \cdot c$.
definiciones_clave: |
  - **Producto cruzado de comparación**: Multiplicación diagonal $a \cdot d$ (asociado a $\frac{a}{b}$) y $b \cdot c$ (asociado a $\frac{c}{d}$).
  - **Conservación del orden**: Principio que establece que $a \cdot d > b \cdot c \iff \frac{a}{b} > \frac{c}{d}$ para $b, d > 0$.
  - **Asociación de término**: Regla por la cual el resultado de $a \cdot d$ le corresponde a la fracción del lado izquierdo ($\frac{a}{b}$).
propiedades_relaciones: |
  - **Rapidez algorítmica**: Es el método más veloz para comparar exactamente 2 fracciones sin requerir factorización ni simplificación previa.
  - **Requisito de denominadores positivos**: Si alguno de los denominadores fuera negativo, se debe normalizar el signo a los numeradores antes de aplicar la regla para no invertir la desigualdad.
  - **Invarianza de escala**: El método es insensible a si las fracciones están simplificadas o no.
ejemplo_guiado:
  enunciado: "Compara las fracciones $\\frac{7}{11}$ y $\\frac{5}{8}$ utilizando el método de productos cruzados."
  pasos:
    - 'Calcular el producto cruzado del lado izquierdo: multiplicar el numerador de la primera ($7$) por el denominador de la segunda ($8$): $7 \cdot 8 = 56$.'
    - 'Calcular el producto cruzado del lado derecho: multiplicar el denominador de la primera ($11$) por el numerador de la segunda ($5$): $11 \cdot 5 = 55$.'
    - "Comparar ambos productos enteros obtenidos: $56$ vs $55$. Observamos que $56 > 55$."
    - 'Concluir la relación entre las fracciones originales asociando los resultados: como $56 > 55$, la primera fracción es mayor: $\frac{7}{11} > \frac{5}{8}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al comparar las fracciones $\frac{a}{b}$ y $\frac{c}{d}$ (con $b,d > 0$) mediante productos cruzados, ¿a cuál de las dos fracciones representa el resultado del producto $a \cdot d$?'
    choices:
      - {text: 'A la primera fracción $\frac{a}{b}$, porque contiene a su numerador $a$.', is_correct: true}
      - {text: 'A la segunda fracción $\frac{c}{d}$.', is_correct: false}
      - {text: 'A la suma de ambas fracciones.', is_correct: false}
      - {text: 'A ninguna, representa solo al denominador común.', is_correct: false}
    explanation: 'La correcta es A la primera fracción $\frac{a}{b}$, porque contiene a su numerador $a$.: el numerador $a$ define el valor del lado izquierdo al amplificar a denominador $b \cdot d$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Usando productos cruzados, ¿cuál es la relación correcta entre $\frac{4}{9}$ y $\frac{3}{7}$?'
    choices:
      - {text: '$\frac{4}{9} > \frac{3}{7}$, porque $4 \cdot 7 = 28 > 9 \cdot 3 = 27$.', is_correct: true}
      - {text: '$\frac{4}{9} < \frac{3}{7}$, porque $28 < 27$.', is_correct: false}
      - {text: '$\frac{4}{9} = \frac{3}{7}$, porque son fracciones equivalentes.', is_correct: false}
      - {text: 'No se pueden comparar sin hallar el m.c.m.', is_correct: false}
    explanation: 'La correcta es $\frac{4}{9} > \frac{3}{7}$, porque $4 \cdot 7 = 28 > 9 \cdot 3 = 27$.: calculamos $4 \cdot 7 = 28$ y $9 \cdot 3 = 27$, donde $28 > 27$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir las dos fracciones ordenadamente: $\frac{a}{b}$ a la izquierda y $\frac{c}{d}$ a la derecha (asegurando denominadores positivos).'
  - 'Paso 2: Multiplicar el numerador izquierdo por el denominador derecho: $P_1 = a \cdot d$.'
  - 'Paso 3: Multiplicar el denominador izquierdo por el numerador derecho: $P_2 = b \cdot c$.'
  - 'Paso 4: Comparar $P_1$ y $P_2$: la desigualdad entre $P_1$ y $P_2$ es exactamente la misma desigualdad entre $\frac{a}{b}$ y $\frac{c}{d}$.'
errores_correccion: |
  Un error habitual es desordenar los resultados de la multiplicación e inscribir el valor de $b \cdot c$ bajo la primera fracción. Recuerda siempre: **el producto que lleva el numerador de una fracción es el valor que la representa a ella**.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál fracción es menor: $\\frac{5}{12}$ o $\\frac{4}{9}$?"
    alternativas:
      - '\frac{5}{12} es menor porque $5 \cdot 9 = 45 < 12 \cdot 4 = 48$.'
      - '\frac{4}{9} es menor porque $48 < 45$.'
      - "Son iguales."
    respuesta: "\\frac{5}{12} es menor porque $5 \\cdot 9 = 45 < 12 \\cdot 4 = 48$."
    solucion_pasos:
      - 'Primer producto (lado izquierdo): $5 \cdot 9 = 45$.'
      - 'Segundo producto (lado derecho): $12 \cdot 4 = 48$.'
      - 'Como $45 < 48$, $\frac{5}{12} < \frac{4}{9}$.'
  - titulo: "Ejemplo 2"
    enunciado: "Compara $\\frac{8}{15}$ y $\\frac{11}{20}$."
    alternativas:
      - '\frac{8}{15} < \frac{11}{20} porque $8 \cdot 20 = 160 < 15 \cdot 11 = 165$.'
      - '\frac{8}{15} > \frac{11}{20} porque $160 > 165$.'
      - "Son equivalentes."
    respuesta: "\\frac{8}{15} < \\frac{11}{20} porque $8 \\cdot 20 = 160 < 15 \\cdot 11 = 165$."
    solucion_pasos:
      - 'Lado izquierdo: $8 \cdot 20 = 160$.'
      - 'Lado derecho: $15 \cdot 11 = 165$.'
      - 'Dado que $160 < 165$, concluimos que $\frac{8}{15} < \frac{11}{20}$.'
  - titulo: "¿El método de productos cruzados sirve también para verificar si dos fracciones son exactamente iguales?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, si $a \cdot d = b \cdot c$, las fracciones son equivalentes ($= $).'
  - titulo: "¿Es necesario simplificar las fracciones antes de aplicar los productos cruzados?"
    respuesta: "No"
    solucion_pasos:
      - "No es obligatorio, el método funciona con cualquier fracción de denominadores no nulos."
errores_frecuentes:
  - "Asignar el resultado del producto cruzado a la fracción equivocada."
  - "Multiplicar en línea recta (numerador por numerador) en lugar de en cruz."
  - "Aplicar el método con denominadores negativos sin corregir el signo previamente."
  - "Intentar usar productos cruzados para comparar 3 o más fracciones simultáneamente en un solo cálculo."
  - "Olvidar mantener la orientación original de las fracciones al redactar la conclusión."
afirmaciones_verdaderas:
  - 'Al comparar $\frac{a}{b}$ y $\frac{c}{d}$ con denominadores positivos, la relación de orden entre las fracciones es idéntica a la relación entre los enteros $a \cdot d$ y $b \cdot c$.'
  - "El método de productos cruzados evita tener que calcular el mínimo común múltiplo de los denominadores."
al_terminar_debes_poder: |
  Debes ser capaz de aplicar los productos cruzados para comparar de forma veloz dos fracciones cualesquiera de denominadores positivos.
