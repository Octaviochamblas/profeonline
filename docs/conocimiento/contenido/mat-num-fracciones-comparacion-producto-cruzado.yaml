procedimiento:
- 'Paso 1: Multiplicar el numerador de la primera fracción por el denominador de la segunda ($a \cdot d$).'
- 'Paso 2: Multiplicar el denominador de la primera fracción por el numerador de la segunda ($b \cdot c$).'
- 'Paso 3: Asignar el signo de relación entre los productos enteros $a \cdot d$ y $b \cdot c$ a las fracciones originales.'
errores_correccion: '- **Error 1: Asignar el producto $a \cdot d$ a la fracción de la derecha.** **Cómo corregirlo:** El producto $a \cdot d$ corresponde SIEMPRE al lado de la primera fracción $\frac{a}{b}$.


  - **Error 2: Aplicar el producto cruzado con denominadores negativos sin corregir los signos.** **Cómo corregirlo:** Garantizar que los denominadores sean positivos antes de multiplicar en cruz.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Compare 3/5 y 5/8 con producto cruzado.
  alternativas:
  - 3/5 < 5/8 (24 < 25)
  - 3/5 > 5/8
  - Son iguales
  respuesta: 3/5 < 5/8 (24 < 25)
  solucion_pasos:
  - $3 \cdot 8 = 24$ y $5 \cdot 5 = 25$. Como $24 < 25 \implies 3/5 < 5/8$.
- titulo: Ejemplo 2
  enunciado: Compare 7/10 y 2/3 mediante producto cruzado.
  alternativas:
  - 7/10 > 2/3 (21 > 20)
  - 7/10 < 2/3
  - Son equivalentes
  respuesta: 7/10 > 2/3 (21 > 20)
  solucion_pasos:
  - $7 \cdot 3 = 21$ y $10 \cdot 2 = 20$. Como $21 > 20 \implies 7/10 > 2/3$.
- titulo: ¿Evita la comparación cruzada tener que calcular el m.c.m. de los denominadores?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un algoritmo directo mediante dos multiplicaciones de enteros.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la relación de orden o propiedad de densidad analizada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la comparación de fracciones determina un resultado estricto y unívoco.
  - texto: No es posible ordenar las fracciones
    es_correcta: false
    retroalimentacion: Incorrecto, los métodos de homogeneización y producto cruzado permiten ordenar cualquier conjunto de racionales.
- titulo: ¿Es 4/9 mayor que 3/7 por producto cruzado?
  respuesta: Sí
  solucion_pasos:
  - Sí, $4 \cdot 7 = 28$ y $9 \cdot 3 = 27$. Como $28 > 27 \implies 4/9 > 3/7$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la relación de orden o propiedad de densidad analizada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la comparación de fracciones determina un resultado estricto y unívoco.
  - texto: No es posible ordenar las fracciones
    es_correcta: false
    retroalimentacion: Incorrecto, los métodos de homogeneización y producto cruzado permiten ordenar cualquier conjunto de racionales.
errores_frecuentes:
- El producto $a \cdot d$ se compara contra la suma de $b + c$ para determinar la relación de orden.
- Invertir la posición de los resultados de los productos cruzados no afecta la decisión de orden.
- El método del producto cruzado produce siempre resultados aproximados e inexactos.
- Para aplicar productos cruzados es obligatorio que los numeradores sean iguales a 1.
- Multiplicar los denominadores entre sí define cuál fracción es mayor.
afirmaciones_verdaderas:
- La comparación por producto cruzado $\frac{a}{b} > \frac{c}{d}$ equivale estrictamente a $a \cdot d > b \cdot c$ ($b,d > 0$).
- Es un método aritmético directo que compara fracciones sin requerir su homogenización explícita.
al_terminar_debes_poder: '**QUÉ:** Determinar con máxima rapidez el orden relativo entre dos fracciones cualesquiera sin calcular decimales ni el MCM.


  **CÓMO:** Evaluando los productos $a \cdot d$ y $b \cdot c$ ($b, d > 0$) y aplicando el teorema $\frac{a}{b} < \frac{c}{d} \iff a \cdot d < b \cdot c$ trasladando previamente cualquier signo negativo al numerador.


  ![Resumen Comparación de fracciones mediante producto cruzado](/static/img/nodos/comparacion-de-fracciones-mediante-producto-cruzado-resumen.svg)'
