semantic_id: MAT.NUM.FRACCIONES_COMPARACION.PRODUCTO_CRUZADO
resumen_inicial: 'Para comparar dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$ con denominadores positivos, se efectúan los productos cruzados: $\frac{a}{b} > \frac{c}{d} \iff a \cdot d > b \cdot c$.'
explicacion_simple: 'El método del producto cruzado es un truco rápido para comparar dos fracciones sin necesidad de buscar el m.c.m. Multiplicamos el numerador de la izquierda por el denominador de la derecha ($a \cdot d$) y el denominador de la izquierda por el numerador de la derecha ($b \cdot c$); la fracción cuyo producto cruzado sea mayor será la fracción mayor.


  ![Comparación de fracciones mediante producto cruzado](/static/img/nodos/comparacion-de-fracciones-mediante-producto-cruzado-intro.svg)'
explicacion_formal: 'Para dos fracciones $\frac{a}{b}, \frac{c}{d} \in \mathbb{Q}$ con denominadores positivos $b, d > 0$, el **Criterio de Producto Cruzado** establece:


  $$\frac{a}{b} > \frac{c}{d} \iff a \cdot d > b \cdot c$$


  $$\frac{a}{b} < \frac{c}{d} \iff a \cdot d < b \cdot c$$


  **Desglose de la fórmula:**

  - $a \cdot d$: Producto del numerador de la izquierda por el denominador opuesto.

  - $b \cdot c$: Producto del denominador de la izquierda por el numerador opuesto.

  - Preservación del orden: Válido al garantizar que $b \cdot d > 0$.


  > **Complemento didáctico:** Es el método algebraico más eficiente para comparar rápidamente dos fracciones en preguntas de selección múltiple.'
definiciones_clave: '- **Criterio de comparación cruzada**: Algoritmo de decisión de orden basado en las desigualdades de los enteros $a \cdot d$ y $b \cdot c$.'
propiedades_relaciones: '- **Criterio directo de desigualdad**: Preserva los signos de orden sin necesidad de calcular denominadores comunes.'
ejemplo_guiado:
  enunciado: 'Compare las fracciones $\frac{5}{8}$ y $\frac{4}{7}$ utilizando la prueba del producto cruzado.


    ![Ejemplo Comparación de fracciones mediante producto cruzado](/static/img/nodos/comparacion-de-fracciones-mediante-producto-cruzado-ejemplos.svg)'
  pasos:
  - 'Paso 1: Calcular el primer producto cruzado (numerador izquierdo $\cdot$ denominador derecho): $5 \cdot 7 = 35$.'
  - 'Paso 2: Calcular el segundo producto cruzado (denominador izquierdo $\cdot$ numerador derecho): $8 \cdot 4 = 32$.'
  - 'Paso 3: Comparar ambos productos obtenidos: $35 > 32$.'
  - 'Conclusión: Como $35 > 32$, se deduce directamente que $\frac{5}{8} > \frac{4}{7}$.'
