semantic_id: MAT.NUM.DIVISIBILIDAD.OBTENCION_DIVISORES
resumen_inicial: 'Los divisores de $n$ se obtienen buscando parejas de factores $(a,
  b)$ cuyo producto sea igual a $n$: $a \cdot b = n$.'
explicacion_simple: Para encontrar todos los divisores de un número de forma ordenada
  y sin olvidar ninguno, buscamos parejas de números que multiplicados entre sí den
  como resultado el número original. Cada pareja de factores encontrada nos entrega
  dos divisores de la lista final.
explicacion_formal: 'Para un entero positivo $n \in \mathbb{N}$, el **Conjunto Finito
  de Divisores** $D(n)$ se construye mediante el método de los pares conjugados:


  $$D(n) = \{ a \in \mathbb{N} \mid \exists b \in \mathbb{N}, \, a \cdot b = n \}
  \subseteq \{1, 2, \dots, n\}$$


  **Desglose de la fórmula:**

  - $a \cdot b = n$: Par de divisores conjugados donde si $a \in D(n)$, entonces $b
  = n/a \in D(n)$.

  - Cota superior de búsqueda: Basta probar valores de $a$ hasta $a \le \sqrt{n}$.


  > **Complemento didáctico:** Para $n = 36$, probamos hasta $\sqrt{36} = 6$. Parejas:
  $(1,36), (2,18), (3,12), (4,9), (6,6)$. Divisores: $\{1, 2, 3, 4, 6, 9, 12, 18,
  36\}$.'
definiciones_clave: '- **Pares conjugados de divisores**: Pareja $(a, b)$ tal que
  $a \cdot b = n$, entregando dos divisores simultáneamente.

  - **Cota de la raíz cuadrada**: Límite $\sqrt{n}$ que reduce drásticamente las comprobaciones
  necesarias.'
propiedades_relaciones: '- **Simetría de factores**: Si $a$ divide a $n$, su pareja
  $n/a$ también divide a $n$.'
ejemplo_guiado:
  enunciado: Halle todos los divisores del número $18$ buscando sus pares de factores
    multiplicativos.
  pasos:
  - 'Paso 1: Probar $a = 1$: $1 \cdot 18 = 18 \implies$ Pareja $(1, 18)$.'
  - 'Paso 2: Probar $a = 2$: $2 \cdot 9 = 18 \implies$ Pareja $(2, 9)$.'
  - 'Paso 3: Probar $a = 3$: $3 \cdot 6 = 18 \implies$ Pareja $(3, 6)$.'
  - 'Paso 4: Probar $a = 4, 5$: no producen enteros exactos. Como $4 > \sqrt{18} \approx
    4.24$, detendremos la búsqueda.'
  - 'Conclusión: El conjunto ordenado de divisores de $18$ es $D(18) = \{1, 2, 3,
    6, 9, 18\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Hasta qué número es suficiente buscar para hallar todos los divisores
    de n mediante pares?
  choices:
  - text: Hasta la raíz cuadrada de n (√n)
    is_correct: true
  - text: Hasta el número n multiplicado por 2
    is_correct: false
  - text: Hasta el infinito
    is_correct: false
  - text: Solo los primeros tres números
    is_correct: false
  explanation: La alternativa correcta es 'Hasta la raíz cuadrada de n (√n)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuántos divisores positivos se obtuvieron para
    el número 18?
  choices:
  - text: '6 divisores: {1, 2, 3, 6, 9, 18}'
    is_correct: true
  - text: '3 divisores: {1, 2, 3}'
    is_correct: false
  - text: '4 divisores: {2, 3, 6, 9}'
    is_correct: false
  - text: Infinitos divisores
    is_correct: false
  explanation: 'La alternativa correcta es ''6 divisores: {1, 2, 3, 6, 9, 18}''.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Probar números enteros $a$ comenzando desde 1 hasta $\sqrt{n}$.'
- 'Paso 2: Si la división $n : a$ es exacta, registrar el par $(a, n/a)$.'
- 'Paso 3: Ordenar todos los divisores encontrados de menor a mayor en el conjunto
  $D(n)$.'
errores_correccion: '- **Error 1: Olvidar la pareja del número encontrado (ej: anotar
  el 2 y olvidar el 9 al evaluar 18).** **Cómo corregirlo:** Registrar siempre ambos
  términos del par $(a, n/a)$.


  - **Error 2: Continuar probando innecesariamente más allá de $\sqrt{n}$.** **Cómo
  corregirlo:** La búsqueda se completa al superar la raíz cuadrada del número.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Encuentre todos los divisores de 12.
  alternativas:
  - '{1, 2, 3, 4, 6, 12}'
  - '{2, 4, 6, 12}'
  - '{1, 3, 12}'
  respuesta: '{1, 2, 3, 4, 6, 12}'
  solucion_pasos:
  - 'Pares: $(1,12), (2,6), (3,4)$. Divisores: $\{1, 2, 3, 4, 6, 12\}$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuántos divisores tiene un número cuadrado perfecto como 9?
  alternativas:
  - Cantidad impar de divisores (3)
  - Cantidad par de divisores
  - Infinitos
  respuesta: Cantidad impar de divisores (3)
  solucion_pasos:
  - $D(9) = \{1, 3, 9\}$, que tiene 3 divisores (impar).
- titulo: ¿Es cierto que los cuadrados perfectos tienen una cantidad impar de divisores?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la pareja del número central se repite a sí misma ($a \cdot a = n$).
- titulo: ¿El conjunto de divisores de 20 es {1, 2, 4, 5, 10, 20}?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, pares: $(1,20), (2,10), (4,5)$.'
errores_frecuentes:
- Para obtener los divisores de un número hay que probar todos los números hasta $n$
  sin usar cotas.
- Los divisores de un número se obtienen multiplicando el número por $1, 2, 3, 4\ldots$
- Los números impares no pueden tener divisores que sean pares.
- Omitir incluir al propio número $n$ dentro de su lista de divisores.
- Un número cuadrado perfecto tiene una cantidad par de divisores positivos.
afirmaciones_verdaderas:
- Los divisores de $n$ se obtienen hallando parejas de factores $(a, b)$ tales que
  $a \cdot b = n$.
- Los números cuadrados perfectos son los únicos enteros que poseen una cantidad impar
  de divisores.
al_terminar_debes_poder: Al terminar serás capaz de encontrar todos los divisores
  de un número entero, buscando parejas de factores $a \cdot b = n$ hasta la cota
  $\sqrt{n}$.
