semantic_id: MAT.NUM.DIVISIBILIDAD.OBTENCION_DIVISORES
resumen_inicial: "Para hallar todos los divisores de $n$, basta probar hasta $\\sqrt{n}$: cada divisor encontrado trae su complementario."
explicacion_simple: |
  Tienes 24 baldosas y quieres formar un rectángulo con todas. Podrías hacer uno de
  1×24, otro de 2×12, otro de 3×8, otro de 4×6. Los divisores de 24 son los números que
  aparecen en esas combinaciones: 1, 2, 3, 4, 6, 8, 12 y 24. Los divisores siempre vienen
  en parejas que al multiplicarse dan 24, así que solo hay que probar hasta
  $\sqrt{24}\approx4{,}9$, es decir, hasta el 4.
explicacion_formal: |
  Si $d\mid n$, entonces $n/d$ también es divisor de $n$: los divisores forman pares
  $(d, n/d)$ con $d\cdot(n/d)=n$. Basta probar $d$ desde 1 hasta $\lfloor\sqrt{n}\rfloor$.
  Si $n$ no es cuadrado perfecto, $|D(n)|$ es par; si $n$ es cuadrado perfecto, $|D(n)|$
  es impar (la raíz se empareja consigo misma).
definiciones_clave: |
  **Pares complementarios**: $(d, n/d)$ tales que $d\cdot(n/d)=n$. **Cuadrado perfecto**:
  número de la forma $k^2$, cuya raíz es divisor de sí mismo sin complementario distinto.
propiedades_relaciones: |
  Todo número natural tiene al menos dos divisores (1 y él mismo). La cantidad total de
  divisores es par, salvo que el número sea un cuadrado perfecto, en cuyo caso es impar.
ejemplo_guiado:
  enunciado: "Encuentra todos los divisores de 28."
  pasos:
    - '$\sqrt{28}\approx5{,}3$, se prueba desde 1 hasta 5.'
    - '$1\mid28$ (par 1 y 28); $2\mid28$ (par 2 y 14); $4\mid28$ (par 4 y 7); $3$ y $5$ no dividen a 28.'
    - '$D(28)=\{1,2,4,7,14,28\}$ — 6 divisores (par, 28 no es cuadrado perfecto).'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Hasta qué valor basta probar divisores para encontrar todos los de $n$?"
    choices:
      - {text: "Hasta $n$", is_correct: false}
      - {text: "Hasta $\\sqrt{n}$", is_correct: true}
      - {text: "Hasta $n/2$", is_correct: false}
      - {text: "Hasta $2n$", is_correct: false}
    explanation: "La correcta es Hasta $\\sqrt{n}$: cada divisor menor tiene su complementario mayor, ya cubierto."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuántos divisores tiene 25?"
    choices:
      - {text: "3 (impar, porque 25 es cuadrado perfecto)", is_correct: true}
      - {text: "2 (par)", is_correct: false}
      - {text: "25", is_correct: false}
      - {text: "5", is_correct: false}
    explanation: "La correcta es 3 (impar, porque 25 es cuadrado perfecto): $D(25)=\\{1,5,25\\}$, y el 5 se empareja consigo mismo."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Calcular $\lfloor\sqrt{n}\rfloor$ para conocer hasta dónde probar.'
  - 'Paso 2: Probar si 1, 2, 3, ..., $\lfloor\sqrt{n}\rfloor$ dividen exactamente a $n$.'
  - "Paso 3: Por cada divisor $d$ encontrado, agregar también el complementario $n/d$."
  - 'Paso 4: Si $d = \sqrt{n}$, contar ese divisor una sola vez.'
  - "Paso 5: Ordenar todos los divisores encontrados de menor a mayor."
errores_correccion: |
  Un error frecuente es probar todos los números hasta $n$ en vez de detenerse en
  $\sqrt{n}$, haciendo el trabajo innecesariamente largo. Otro error es olvidar agregar
  el complementario $n/d$ cada vez que se encuentra un divisor $d$.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Encuentra todos los divisores de 36."
    alternativas:
      - '$\{1,2,3,4,6,9,12,18,36\}$'
      - '$\{1,2,3,4,6,12,18,36\}$'
      - '$\{1,3,6,9,12,36\}$'
    respuesta: "$\\{1,2,3,4,6,9,12,18,36\\}$"
    solucion_pasos:
      - '$\sqrt{36} = 6$, así que probamos divisores desde 1 hasta 6.'
      - '$1 \mid 36$ (par: 1 y 36); $2 \mid 36$ (par: 2 y 18); $3 \mid 36$ (par: 3 y 12).'
      - '$4 \mid 36$ (par: 4 y 9); $5 \nmid 36$; $6 \mid 36$ ($6 = \sqrt{36}$, un solo divisor).'
      - '$D(36) = \{1, 2, 3, 4, 6, 9, 12, 18, 36\}$ — 9 divisores (impar: 36 es cuadrado perfecto).'
  - titulo: "Ejemplo 2"
    enunciado: "Encuentra todos los divisores de 48."
    alternativas:
      - '$\{1,2,3,4,6,8,12,16,24,48\}$'
      - '$\{1,2,4,6,8,12,24,48\}$'
      - '$\{2,3,4,6,8,12,16,24\}$'
    respuesta: "$\\{1,2,3,4,6,8,12,16,24,48\\}$"
    solucion_pasos:
      - '$\sqrt{48} \approx 6{,}9$, así que probamos divisores desde 1 hasta 6.'
      - '$1 \mid 48$ (par: 1 y 48); $2 \mid 48$ (par: 2 y 24); $3 \mid 48$ (par: 3 y 16).'
      - '$4 \mid 48$ (par: 4 y 12); $5 \nmid 48$; $6 \mid 48$ (par: 6 y 8).'
      - '$D(48) = \{1, 2, 3, 4, 6, 8, 12, 16, 24, 48\}$ — 10 divisores (par: 48 no es cuadrado perfecto).'
  - titulo: "¿El número 1 siempre es divisor de cualquier número natural?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Para cualquier $n$ natural, $n = 1 \cdot n$: la división $n \div 1 = n$ es exacta.'
      - 'Por lo tanto, $1 \mid n$ para todo número natural $n$.'
      - "1 y $n$ son siempre los divisores triviales de $n$."
  - titulo: "¿Los cuadrados perfectos tienen un número par de divisores?"
    respuesta: "No"
    solucion_pasos:
      - 'En un cuadrado perfecto $n = k^2$, la raíz $k = \sqrt{n}$ es divisor de $n$.'
      - "Este divisor no tiene un complementario distinto (se empareja consigo mismo)."
      - "Por eso los cuadrados perfectos tienen un número IMPAR de divisores."
errores_frecuentes:
  - "Para encontrar todos los divisores de $n$ hay que probar todos los números hasta $n$."
  - "El mayor divisor propio de $n$ (distinto de $n$) es siempre $n/2$."
  - "Si $n$ es par, todos sus divisores también son pares."
  - "Los cuadrados perfectos tienen un número par de divisores."
  - "Un número con más divisores que otro siempre es el más grande de los dos."
afirmaciones_verdaderas:
  - "Los divisores de un número se pueden buscar en parejas de factores."
  - "Todo número entero positivo tiene una cantidad finita de divisores."
al_terminar_debes_poder: |
  Obtener el conjunto completo de divisores de cualquier número natural usando la
  estrategia de pares complementarios hasta $\sqrt{n}$.
fuente: "Matemática 7° Básico Tomo 1 — Teoría de Números"
estado: publicado
