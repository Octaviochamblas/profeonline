semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_4
resumen_inicial: "Un número es divisible por 4 si sus dos últimas cifras forman un múltiplo de 4, o si termina en 00."
explicacion_simple: |
  Organizas un torneo y necesitas equipos de exactamente 4 personas. Si llegan 512
  jugadores, ¿alcanzan justo? Solo mira las últimas dos cifras: 12. Como 12 está en la
  tabla del 4 ($4\times3=12$), ¡sí se pueden armar equipos de 4 exactos! No importa cuán
  grande sea el número, solo importan sus dos últimas cifras.
explicacion_formal: |
  Cualquier número $N=abcde$ se escribe como $N=abcd\times100+de$. Como $100$ es
  divisible por $4$ ($100=4\times25$), el término $abcd\times100$ siempre lo es. Por lo
  tanto, la divisibilidad de $N$ por 4 depende solo de que $de$ (las dos últimas cifras)
  sea múltiplo de 4, o sea $00$.
definiciones_clave: |
  **Dos últimas cifras**: el número de dos dígitos formado por las cifras de decenas y
  unidades.
propiedades_relaciones: |
  Todo número que termine en 00 es divisible por 4 (y también por 100). No basta con que
  la última cifra sea par: eso solo garantiza divisibilidad por 2, no por 4.
ejemplo_guiado:
  enunciado: "Determina si 2.716 es divisible por 4."
  pasos:
    - "Las dos últimas cifras son $16$."
    - '$16\div4=4$ con resto $0$.'
    - "Conclusión: 2.716 es divisible por 4."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿De qué depende la divisibilidad por 4 de un número?"
    choices:
      - {text: "De su última cifra", is_correct: false}
      - {text: "De sus dos últimas cifras", is_correct: true}
      - {text: "De la suma de todas sus cifras", is_correct: false}
      - {text: "De sus tres últimas cifras", is_correct: false}
    explanation: "La correcta es De sus dos últimas cifras: el resto del número siempre es múltiplo de 4 (por ser múltiplo de 100)."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 8.530 divisible por 4?"
    choices:
      - {text: "No, $30\\div4$ no es exacto", is_correct: true}
      - {text: "Sí, termina en cifra par", is_correct: false}
      - {text: "Sí, $30\\div4$ es exacto", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es No, $30\\div4$ no es exacto: $30\\div4=7$ con resto $2$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar las dos últimas cifras de la derecha del número dado."
  - "Paso 2: Si las dos últimas cifras son 00, el número es divisible por 4."
  - "Paso 3: Si no son 00, comprobar si el número de dos cifras que forman es múltiplo de 4. Si lo es, el número completo es divisible por 4."
errores_correccion: |
  Un error frecuente es creer que basta con que la última cifra sea par (eso es el
  criterio del 2, no del 4). Otro error es confundir este criterio con el del 3 y sumar
  las cifras en vez de tomar las dos últimas juntas.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determina si el número 3.828 es divisible por 4."
    alternativas:
      - 'Sí, $28\div4$ es exacto'
      - 'No, $28\div4$ no es exacto'
      - "No se puede determinar"
    respuesta: "Sí, $28\\div4$ es exacto"
    solucion_pasos:
      - "Fijamos la atención en las dos últimas cifras de 3.828, que son $28$."
      - 'Comprobamos si 28 es divisible por 4: $28 \div 4 = 7$ con resto 0.'
      - "Dado que 28 es múltiplo de 4, concluimos que 3.828 es divisible por 4."
  - titulo: "Ejemplo 2"
    enunciado: "Determina si el número 9.418 es divisible por 4."
    alternativas:
      - 'No, $18\div4$ no es exacto'
      - 'Sí, $18\div4$ es exacto'
      - "No se puede determinar"
    respuesta: "No, $18\\div4$ no es exacto"
    solucion_pasos:
      - "Fijamos la atención en las dos últimas cifras de 9.418, que son $18$."
      - 'Comprobamos si 18 es divisible por 4: $18 \div 4 = 4$ con resto 2 (ya que $4 \cdot 4 = 16$).'
      - "Como el resto no es 0, concluimos que 9.418 no es divisible por 4."
  - titulo: "¿Es divisible por 4 el número 7.200?"
    respuesta: "Sí"
    solucion_pasos:
      - "Identificamos las dos últimas cifras de 7.200, que son $00$."
      - "Por el criterio de divisibilidad, cualquier número que termine en doble cero (00) es divisible por 4."
      - "Conclusión: 7.200 es divisible por 4."
  - titulo: "¿Es divisible por 4 el número 1.050?"
    respuesta: "No"
    solucion_pasos:
      - "Identificamos las dos últimas cifras de 1.050, que son $50$."
      - 'Comprobamos si 50 es divisible por 4. Al dividir $50 \div 4$ obtenemos $12$ con resto $2$.'
      - "Dado que 50 no es múltiplo de 4, concluimos que 1.050 no es divisible por 4."
errores_frecuentes:
  - "Creer que basta con que la última cifra sea par para ser divisible por 4 (por ejemplo, 14 termina en 4 pero no es divisible por 4)."
  - "Olvidar que el término '00' cumple con el criterio y dividir innecesariamente números como 500 o 1.200."
  - "Confundir el criterio del 4 con el del 2 y pensar que todo número par es divisible por 4."
  - "Tratar de sumar las cifras (criterio del 3) en lugar de tomar las últimas dos cifras juntas."
  - "Pensar que un número impar podría ser divisible por 4 si sus dos últimas cifras son especiales."
afirmaciones_verdaderas:
  - "Un número es divisible por 4 si sus dos últimas cifras forman un múltiplo de 4."
  - "El número 316 es divisible por 4."
al_terminar_debes_poder: |
  Determinar la divisibilidad por 4 de cualquier número observando solo sus dos últimas
  cifras, sin dividir el número completo.
fuente: "Matemática 7° Básico Tomo 1 — Teoría de Números"
estado: publicado
