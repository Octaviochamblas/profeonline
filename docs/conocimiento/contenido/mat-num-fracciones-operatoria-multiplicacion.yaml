semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.MULTIPLICACION
resumen_inicial: "La multiplicación de fracciones consiste en multiplicar en línea recta numeradores con numeradores y denominadores con denominadores."
explicacion_simple: |
  Multiplicar fracciones es la operación más directa de todas: **multiplicas en línea recta**. Si quieres calcular $\frac{2}{3} \times \frac{4}{5}$, multiplicas el de arriba por el de arriba ($2 \times 4 = 8$) y el de abajo por el de abajo ($3 \times 5 = 15$), obteniendo $\frac{8}{15}$. Geométricamente, calcular $\frac{2}{3} \times \frac{4}{5}$ significa averiguar cuánto representa 'dos tercios de cuatro quintos' de una cantidad entera.
explicacion_formal: |
  Formalmente, dadas dos fracciones $\frac{a}{b}$ y $\frac{c}{d}$ con $a, c \in \mathbb{Z}$ y $b, d \in \mathbb{Z} \setminus \{0\}$:
  $\frac{a}{b} \cdot$ \frac{c}{d}$ = \frac{a \cdot c}{b \cdot d}$

  Justificación geométrica sobre el área unitaria: si se considera un cuadrado de lado $1$ (área $1$), recortar un rectángulo de lados $\frac{a}{b}$ y $\frac{c}{d}$ produce exactamente $a \cdot c$ rectángulos pequeños de una malla total de $b \cdot d$ rectángulos congruentes.
definiciones_clave: |
  - **Multiplicación de fracciones**: Operación producto $\frac{a \cdot c}{b \cdot d}$ en línea recta.
  - **Producto de numeradores ($a \cdot c$)**: Nuevo numerador del resultado.
  - **Producto de denominadores ($b \cdot c$)**: Nuevo denominador del resultado.
  - **Simplificación cruzada previa**: Cancelación de factores comunes entre numeradores y denominadores antes de multiplicar.
propiedades_relaciones: |
  - **Conmutatividad**: $\frac{a}{b} \cdot \frac{c}{d} = \frac{c}{d} \cdot \frac{a}{b}$.
  - **Asociatividad**: $(\frac{a}{b} \cdot \frac{c}{d}) \cdot \frac{e}{f} = \frac{a}{b} \cdot (\frac{c}{d} \cdot \frac{e}{f})$.
  - **Elemento neutro ($1$)**: $\frac{a}{b} \cdot 1 = \frac{a}{b} \cdot \frac{1}{1} = \frac{a}{b}$.
  - **Elemento absorbente ($0$)**: $\frac{a}{b} \cdot 0 = 0$.
ejemplo_guiado:
  enunciado: "Calcula el producto $\\frac{15}{28} \\cdot \\frac{14}{25}$ utilizando simplificación cruzada previa."
  pasos:
    - 'Escribir el producto: $\frac{15 \cdot 14}{28 \cdot 25}$.'
    - "Simplificar cruzadamente los numeradores con denominadores:"
    - "Dividir $15$ y $25$ por su divisor común $5$: quedan $3$ en el numerador y $5$ en el denominador."
    - "Dividir $14$ y $28$ por su divisor común $14$: quedan $1$ en el numerador y $2$ en el denominador."
    - 'Multiplicar los valores reducidos: $\frac{3 \cdot 1}{2 \cdot 5} = \frac{3}{10}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es la regla para multiplicar dos fracciones $\\frac{a}{b}$ y $\\frac{c}{d}$?"
    choices:
      - {text: "Multiplicar en línea recta: numerador por numerador y denominador por denominador ($\\frac{a \\cdot c}{b \\cdot d}$).", is_correct: true}
      - {text: "Multiplicar en cruz y sumar los resultados.", is_correct: false}
      - {text: "Buscar el m.c.m. de los denominadores obligatoriamente.", is_correct: false}
      - {text: "Sumar numeradores y multiplicar denominadores.", is_correct: false}
    explanation: "La correcta es Multiplicar en línea recta: numerador por numerador y denominador por denominador ($\\frac{a \\cdot c}{b \\cdot d}$).: la multiplicación opera directamente término a término."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Al calcular $\\frac{3}{4} \\cdot \\frac{8}{9}$, ¿cuál es el resultado final simplificado?"
    choices:
      - {text: '\$\frac{2}{3}$', is_correct: true}
      - {text: '\$\frac{24}{36}$', is_correct: false}
      - {text: '\$\frac{12}{13}$', is_correct: false}
      - {text: '\$\frac{3}{2}$', is_correct: false}
    explanation: "La correcta es \\frac{2}{3}: $\\frac{3 \\cdot 8}{4 \\cdot 9} = \\frac{24}{36}$, que al simplificarse entre $12$ resulta $\\frac{2}{3}$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Disponer las fracciones a multiplicar $\frac{a}{b} \cdot \frac{c}{d}$.'
  - "Paso 2: (Optativo pero recomendable) Simplificar de manera cruzada dividiendo cualquier numerador con cualquier denominador por sus divisores comunes."
  - 'Paso 3: Multiplicar numeradores entre sí para obtener el nuevo numerador ($a \cdot c$).'
  - 'Paso 4: Multiplicar denominadores entre sí para obtener el nuevo denominador ($b \cdot d$).'
  - "Paso 5: Reducir a fracción irreductible si no se realizó la simplificación previa."
errores_correccion: |
  Un error frecuente es intentar buscar el m.c.m. de los denominadores para multiplicar fracciones. **En la multiplicación NUNCA se busca m.c.m.**; simplemente se multiplica horizontalmente en línea recta.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Calcula $\\frac{5}{7} \\cdot \\frac{3}{4}$."
    alternativas:
      - '\$\frac{15}{28}$'
      - '\$\frac{8}{11}$'
      - '\$\frac{20}{21}$'
    respuesta: '\$\frac{15}{28}$'
    solucion_pasos:
      - 'Multiplicamos numeradores: $5 \cdot 3 = 15$.'
      - 'Multiplicamos denominadores: $7 \cdot 4 = 28$.'
      - 'Resultado: $\frac{15}{28}$.'
  - titulo: "Ejemplo 2"
    enunciado: "Un terreno agrícola tiene una superficie de $\\frac{4}{5}$ de hectárea. Si se siembra maíz en los $\\frac{2}{3}$ de esa superficie, ¿qué fracción de hectárea está sembrada de maíz?"
    alternativas:
      - '\$\frac{8}{15}$ de hectárea.'
      - '\$\frac{6}{8}$ de hectárea.'
      - '\$\frac{2}{15}$ de hectárea.'
    respuesta: '\$\frac{8}{15}$ de hectárea.'
    solucion_pasos:
      - 'Calculamos $\frac{2}{3} \cdot \frac{4}{5} = \frac{2 \cdot 4}{3 \cdot 5} = \frac{8}{15}$.'
  - titulo: "¿Multiplicar un entero $n$ por una fracción $\\frac{a}{b}$ equivale a escribir el entero como $\\frac{n}{1}$?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, $n \cdot \frac{a}{b} = \frac{n}{1} \cdot \frac{a}{b} = \frac{n \cdot a}{b}$.'
  - titulo: "¿Se pueden cancelar números iguales que aparezcan simultáneamente en el numerador y en el denominador durante una multiplicación de fracciones?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, por ejemplo $\frac{a}{b} \cdot \frac{b}{c} = \frac{a \cdot b}{b \cdot c} = \frac{a}{c}$.'
errores_frecuentes:
  - "Buscar denominador común (m.c.m.) para multiplicar fracciones."
  - "Multiplicar en cruz en lugar de multiplicar en línea recta."
  - "Simplificar numeradores con numeradores o denominadores con denominadores (solo se cancela un numerador con un denominador)."
  - "Olvidar simplificar el resultado."
  - "Sumar en lugar de multiplicar."
afirmaciones_verdaderas:
  - "La multiplicación de fracciones se realiza multiplicando en línea recta: numeradores con numeradores y denominadores con denominadores."
  - "La simplificación cruzada previa agiliza los cálculos y produce directamente la fracción irreductible."
al_terminar_debes_ponder: |
  Debes ser capaz de multiplicar cualquier par o conjunto de fracciones aplicando simplificación cruzada previa para obtener la fracción irreductible resultante.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
estado: publicado
