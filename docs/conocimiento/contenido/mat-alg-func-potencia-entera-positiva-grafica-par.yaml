semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.GRAFICA_PAR
resumen_inicial: 'La gráfica de una función potencia de exponente entero par positivo $f(x) = a x^{2k}$ posee forma de copa parabólica, simétrica respecto al eje $y$, con vértice en el origen $(0, 0)$.'
explicacion_simple: |
  Cuando una función potencia tiene un exponente entero par positivo (como $x^2, x^4, x^6$), su gráfica adquiere la forma característica de una copa o letra "U". Si el número $a$ es positivo, la copa abre hacia arriba recibiendo agua; si $a$ es negativo, la copa se da vuelta patas arriba abriendo hacia abajo. Todas estas funciones pasan exactamente por el origen de coordenadas $(0, 0)$ y se ven idénticas a la derecha y a la izquierda del eje vertical $y$.
explicacion_formal: |
  ### Definición formal
  La **gráfica de la función potencia de exponente par positivo** $f(x) = a x^n$ con $n = 2k (k \in \mathbb{Z}^+)$ se define como una curva continua simétrica en el plano cartesiano $G = \{(x, a x^{2k}) \mid x \in \mathbb{R}\}$ caracterizada analíticamente por:
  1. **Comportamiento en el Origen**: Posee un único punto crítico de vértice en $(0, 0)$ que constituye un extremum absoluto global.
  2. **Comportamiento Asintótico Infinito**:
     - Si $a > 0 \implies \lim_{x \to \pm\infty} f(x) = +\infty$ (Ambas ramas se elevan infinitamente).
     - Si $a < 0 \implies \lim_{x \to \pm\infty} f(x) = -\infty$ (Ambas ramas caen infinitamente).
  3. **Efecto de la magnitud del grado $n$**: A mayor exponente par $n = 4, 6, 8$, la base de la copa se vuelve más aplanada y cuadrada cerca de cero ($x \in ]-1, 1[$), elevándose mucho más empinada para $|x| > 1$.

  ### Síntesis didáctica
  Puntos nodales universales para la forma mónica $y = x^{2k}$:
  - $(-1, 1)$, $(0, 0)$, $(1, 1)$.
definiciones_clave: |
  - **Curva parabólica generalizada**: Forma geométrica en U propia de potencias de exponente par positivo.
  - **Vértice en el origen**: Punto extremo absoluto $(0, 0)$ común a toda la familia $f(x) = a x^{2k}$.
  - **Aplastamiento central**: Achatamiento horizontal de la curva cerca del origen al aumentar el exponente par $n$.
propiedades_relaciones: |
  - **Simetría respecto al eje $y$**: $f(-x) = f(x)$ para todo $x \in \mathbb{R}$.
  - **Invariancia de cuadrantes**: Para $a > 0$, habita exclusivamente en los cuadrantes I y II. Para $a < 0$, en III y IV.
ejemplo_guiado:
  enunciado: 'Grafica cualitativamente y compara los puntos representativos de la función potencia par $f(x) = 3x^4$ para $x \in \{-1, 0, 1, 2\}$, identificando la orientación de sus ramas.'
  pasos:
    - 'Paso 1: Evaluamos puntos: $f(-1) = 3(-1)^4 = 3(1) = 3$, $f(0) = 3(0)^4 = 0$, $f(1) = 3(1)^4 = 3$, $f(2) = 3(2)^4 = 3(16) = 48$.'
    - 'Paso 2: Observamos que $f(-1) = f(1) = 3$, confirmando simetría par respecto al eje $y$.'
    - 'Paso 3: El vértice se ubica en el origen $(0, 0)$.'
    - 'Paso 4: Como $a = 3 > 0$, la curva en U abre hacia arriba en los cuadrantes I y II, elevándose velozmente al pasar de $x = 1$ a $x = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué aspecto geométrico caracteriza a la gráfica de una función potencia con exponente par positivo como $f(x) = 2x^6$?'
    choices:
      - {text: 'Una curva continua en forma de U parabólica centrada, simétrica respecto al eje $y$, con vértice en el origen $(0, 0)$', is_correct: true}
      - {text: 'Una curva en forma de S que cruza el origen desde el cuadrante III al I', is_correct: false}
      - {text: 'Una recta inclinada que pasa por el origen', is_correct: false}
      - {text: 'Una hipérbola discontinua de dos ramas', is_correct: false}
    explanation: 'La alternativa correcta es ''Una curva continua en forma de U parabólica centrada, simétrica respecto al eje $y$, con vértice en el origen $(0, 0)$''. Todos los exponentes pares positivos $n = 2, 4, 6\dots$ generan curvas en U.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cómo cambia la forma de la curva de $y = x^4$ respecto a la curva de $y = x^2$ en el intervalo de valores $x \in ]-1, 1[$ cerca del origen?'
    choices:
      - {text: 'La curva $y = x^4$ se vuelve más aplanada y pegada al eje $x$ cerca del origen que $y = x^2$', is_correct: true}
      - {text: 'La curva $y = x^4$ se vuelve más empinada cerca del origen que $y = x^2$', is_correct: false}
      - {text: 'La curva $y = x^4$ se transforma en una recta horizontal', is_correct: false}
      - {text: 'Ambas curvas son idénticas en todos los puntos', is_correct: false}
    explanation: 'La alternativa correcta es ''La curva $y = x^4$ se vuelve más aplanada y pegada al eje $x$ cerca del origen que $y = x^2$''. Para valores $|x| < 1$, las potencias mayores producen resultados más pequeños.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar que el exponente $n$ sea un número entero positivo par ($n = 2, 4, 6\dots$).'
  - 'Paso 2: Ubicar el vértice en el origen cartesiano $(0, 0)$.'
  - 'Paso 3: Trazar la ordenada en $x = 1$ en la altura $y = a$ y la ordenada en $x = -1$ en la altura $y = a$.'
  - 'Paso 4: Dibujar la curva continua en forma de U simétrica respecto al eje $y$, abriendo hacia arriba si $a > 0$ o hacia abajo si $a < 0$.'
errores_correccion: |
  - **Error 1:** Dibujar una función potencia par como si fuera una parábola estándar cuando $n \ge 4$. **Cómo corregirlo:** Para $n = 4, 6, 8\dots$, la curva no es una parábola cuadrática perfecta; posee un "piso" más achatado cerca de cero y paredes más verticales para $|x| > 1$.
  - **Error 2:** Creer que las ramas de la gráfica de exponente par apuntan a direcciones opuestas. **Cómo corregirlo:** En exponentes pares, ambas ramas apuntan en la misma dirección vertical (ambas hacia $+\infty$ si $a > 0$ o ambas hacia $-\infty$ si $a < 0$).
ejemplos:
  - titulo: 'Forma de gráfica para exponente 4'
    enunciado: '¿La gráfica de $f(x) = x^4$ es una curva continua en forma de U?'
    alternativas:
      - 'Sí, por tener exponente par positivo'
      - 'No, es en forma de S'
      - 'No, es una recta'
    respuesta: 'Sí, por tener exponente par positivo'
    solucion_pasos:
      - '1. Exponente $n = 4$ es par positivo.'
      - '2. La gráfica es continua y simétrica respecto al eje $y$ con forma de U.'
  - titulo: 'Gráfica par con coeficiente negativo'
    enunciado: '¿La gráfica de $g(x) = -2x^4$ abre hacia abajo en los cuadrantes III y IV?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = -2 < 0$, las ramas apuntan hacia $-\infty$ habitando cuadrantes III y IV.'
  - titulo: 'Puntos de paso universales'
    enunciado: '¿La curva de $y = 5x^2$ pasa por los puntos $(-1, 5)$, $(0, 0)$ y $(1, 5)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(-1) = 5(-1)^2 = 5$, $f(0) = 0$, $f(1) = 5(1)^2 = 5$.'
  - titulo: 'Comportamiento en el infinito'
    enunciado: 'Para $f(x) = 3x^6$, ¿ambas ramas tienden a $+\infty$ cuando $x \to \pm\infty$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Con $a = 3 > 0$ y exponente par, los extremos tienden a $+\infty$.'
errores_frecuentes:
  - 'La gráfica de la función potencia $f(x) = x^4$ se extiende desde el cuadrante III hasta el cuadrante I.'
  - 'Una función potencia de exponente par con $a < 0$ abre hacia arriba en el plano cartesiano.'
  - 'La curva de $f(x) = x^6$ no pasa por el origen de coordenadas $(0, 0)$.'
  - 'Las funciones de exponente par $n = 4$ y $n = 2$ se grafican con una recta inclinada.'
  - 'La gráfica de $f(x) = a x^{2k}$ pierde su simetría cuando $a$ es fraccionario.'
afirmaciones_verdaderas:
  - 'Toda función potencia de exponente entero par positivo $f(x) = a x^{2k}$ posee una gráfica continua en forma de U simétrica respecto al eje $y$, con vértice en $(0, 0)$.'
  - 'Al aumentar el exponente par $n = 4, 6, 8\dots$, la gráfica se aplanar progresivamente en el intervalo $]-1, 1[$ y se vuelve más empinada para $|x| > 1$.'
al_terminar_debes_poder: 'Graficar y analizar el comportamiento de funciones potencia de exponente entero par positivo.'
