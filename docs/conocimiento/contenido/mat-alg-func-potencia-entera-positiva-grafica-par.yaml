semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.GRAFICA_PAR
resumen_inicial: 'Gráfica de una función potencia con exponente par positivo: forma
  general $f(x) = a x^n$, simetría, dominio y recorrido en Comportamiento con exponente
  entero positivo.'
explicacion_simple: Las funciones con exponente par positivo, como $x^2$ o $x^4$,
  comparten una forma de "copa" reconocible, aunque más o menos abierta según el exponente.
explicacion_formal: '### Definición formal


  Para $n\in\mathbb{Z}^+$ par y $a>0$, la función $f(x)=a\cdot x^n$ satisface $f(x)\geq0$
  para todo $x$, con $f(0)=0$ como único mínimo, y $f(x)\to+\infty$ cuando $|x|\to\infty$.
  La gráfica desciende hasta el origen y luego asciende, formando una curva simétrica
  respecto al eje $y$.


  ### Desarrollo didáctico


  Comparando $f(x)=x^2$ y $g(x)=x^4$ en el intervalo $[-1,1]$: $g$ queda más "aplanada"
  cerca de $0$, pero fuera de ese intervalo crece más rápido que $f$. Ambas comparten
  la forma general de copa y el mismo punto mínimo en el origen.'
definiciones_clave: '- **Gráfica de una función potencia con exponente par positivo**:
  Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a gráfica de una función potencia con exponente par positivo.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de gráfica de una función potencia con exponente par positivo.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de gráfica de una función
    potencia con exponente par positivo.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
