procedimiento:
- 'Paso 1: Verifica que el exponente $n$ sea un entero positivo par.'
- 'Paso 2: Ubica el punto $(0,0)$ como vértice de la curva.'
- 'Paso 3: Calcula puntos adicionales simétricos respecto al eje $y$ para trazar la
  forma de copa.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en gráfica de una función potencia con exponente par positivo.
ejemplos:
- titulo: Descripción de la gráfica de $x^2$
  enunciado: Describe la forma general de la gráfica de $f(x)=x^2$.
  solucion_pasos:
  - El exponente $2$ es par, así que la gráfica tiene forma de copa.
  - El vértice está en $(0,0)$ y la curva es simétrica respecto al eje $y$.
- titulo: Comparación de dos exponentes pares
  enunciado: Compara la forma de $f(x)=x^2$ y $g(x)=x^6$ cerca del origen.
  solucion_pasos:
  - Ambas tienen forma de copa con vértice en el origen.
  - $g(x)=x^6$ queda más aplanada cerca de $0$ que $f(x)=x^2$, pero crece más rápido
    lejos del origen.
- titulo: ¿La gráfica de $f(x)=x^4$ tiene un único punto mínimo?
  enunciado: ¿La gráfica de $f(x)=x^4$ tiene exactamente un punto mínimo, ubicado
    en el origen?
  respuesta: Sí
  solucion_pasos:
  - Con exponente par positivo y $a>0$, el único mínimo se encuentra en $(0,0)$.
- titulo: ¿La gráfica de $f(x)=x^2$ tiene dos ramas independientes que se cruzan en
    dos puntos?
  enunciado: ¿La gráfica de una función potencia con exponente par cruza el eje $x$
    en más de un punto?
  respuesta: 'No'
  solucion_pasos:
  - Solo toca el eje $x$ en el origen, que es simultáneamente su único mínimo.
errores_frecuentes:
- Declarar la forma de copa del exponente par con la forma de "s" del exponente impar.
- Suponer que todas las funciones con exponente par tienen exactamente la misma "apertura".
- Omitir verificar el signo de $a$ antes de decidir si el vértice es mínimo o máximo.
- No reconocer que el vértice siempre está en el origen para la función básica $x^n$
  sin traslaciones.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  gráfica de una función potencia con exponente par positivo.
