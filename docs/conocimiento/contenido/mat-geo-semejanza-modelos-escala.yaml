ejemplo_guiado:
  enunciado: Para analizar aplicación de semejanza y proporcionalidad en modelos a
    escala, considera un ángulo $\alpha = 11^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1280^\circ = 11^\circ$.
  pasos:
  - Identificar la propiedad de aplicación de semejanza y proporcionalidad en modelos
    a escala referida a $\alpha = 11^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1280 = 11 \implies x = 11 - 1280$.'
  - Concluir que la medida calculada para aplicación de semejanza y proporcionalidad
    en modelos a escala es $x = -1269^\circ$.
