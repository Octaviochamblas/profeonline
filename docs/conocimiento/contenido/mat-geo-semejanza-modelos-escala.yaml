- titulo: ¿Se cumple siempre la propiedad principal de aplicación de semejanza y proporcionalidad
    en modelos a escala en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede aplicación de semejanza y proporcionalidad en modelos a escala asumir
    un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
