semantic_id: MAT.GEO.SEMEJANZA_TRIANGULOS_POLIGONOS.MODELOS_ESCALA
resumen_inicial: 'Aplicación de semejanza y proporcionalidad en modelos a escala:
  conceptos, teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza
  y Homotecia.'
explicacion_simple: Los modelos a escala (maquetas, planos, mapas) son una de las
  aplicaciones más frecuentes de la semejanza en la vida cotidiana y profesional.
explicacion_formal: '![Modelos a escala](/static/img/geometria/congruencia-semejanza/semejanza-modelos-escala.svg)


  ### Definición formal


  Una escala 1:$n$ indica que cada unidad de longitud en el modelo representa $n$
  unidades en la realidad; la razón de semejanza del modelo respecto a la realidad
  es $\frac{1}{n}$.


  ### Desarrollo didáctico


  Una maqueta a escala 1:100 significa que 1 cm en la maqueta representa 100 cm (1
  m) en la realidad. Si un edificio mide 25 m de alto, su representación en la maqueta
  mide $\frac{2500\text{ cm}}{100}=25$ cm.'
