semantic_id: MAT.NUM.RAZONES_PROPORCIONES.COMPUESTA_RELACION_INVERSA
resumen_inicial: 'En un contexto compuesto, una magnitud es inversamente proporcional a la incógnita si, bajo ceteris paribus, al aumentar dicha magnitud la incógnita disminuye en el factor recíproco, requiriendo que su razón se invierta en la ecuación: $\frac{C_2}{C_1}$.'
explicacion_simple: "![Relación inversa en compuesta](/static/img/nodos/identificacion-de-una-relacion-inversa-en-contexto-compuesto-intro.svg)\n\nPara identificar si una magnitud auxiliar es **inversa con la incógnita**:\n1. **Congela las demás magnitudes (*ceteris paribus*)**.\n2. **Hazte la pregunta clave:**\n   - *«Si aumento esta magnitud, ¿la incógnita disminuye?»*\n   - Si la respuesta es **SÍ**, la relación es **INVERSA**.\n3. **Efecto crucial en la fórmula:** Su razón se **DEBE INVERTIR** $\\left(\\frac{C_2}{C_1}\\right)$ (el dato final arriba y el inicial abajo).\n- **Ejemplos clásicos de relaciones inversas:**\n  - Número de obreros vs Días necesarios (a obra fija).\n  - Horas de trabajo diario vs Días totales de ejecución.\n  - Velocidad de transporte vs Horas de trayecto."
explicacion_formal: 'Sea el modelo compuesto multivariable $Y = f(X_1, \dots, X_n)$ con incógnita $Y$.


  **Definición de Magnitud Parcialmente Inversa:**

  La variable $X_j$ mantiene una relación inversamente proporcional con $Y$ si su derivada parcial satisface:


  $$\frac{\partial Y}{\partial X_j} = -\frac{k_g \cdot \prod X^{\text{directas}}}{X_j^2 \cdot \prod_{m \neq j} X_m^{\text{inversas}}} < 0 \quad (\forall X > 0)$$


  lo que exige que en la ecuación de razones de estado, el factor correspondiente a $X_j$ se incorpore invertido:


  $$R(X_j) = \frac{X_j^{(2)}}{X_j^{(1)}}$$'
definiciones_clave: '- **Razón inversa invertida**: Fracción $\frac{C_2}{C_1}$ que sitúa el estado final en el numerador.

  - **Monotonía parcial negativa**: Incremento de la variable produce decremento de la incógnita.

  - **Compensación recíproca**: Conservación del producto parcial $Y \cdot X_j = \text{cte}$.'
propiedades_relaciones: '- **Transformación de razón**: Invierte la dirección de la escala para alinearse con la igualdad proporcional.

  - **Multiplicación en el producto derecho**: Entra multiplicando a las demás razones directas e inversas.'
ejemplo_guiado:
  enunciado: '![Ejemplos de relaciones inversas en compuesta](/static/img/nodos/identificacion-de-una-relacion-inversa-en-contexto-compuesto-ejemplos.svg)


    Analice la relación de la incógnita Días ($D$) frente a Obreros ($O$) y Horas diarias de trabajo ($H$), y determine la razón para el Tiempo de viaje ($T$) frente a la Rapidez media ($v$).'
  pasos:
  - 'Paso 1: $D$ vs Obreros (a $H$ y obra fija): Más obreros tardan menos días $\implies$ INVERSA (se invierte a $\frac{O_2}{O_1}$).'
  - 'Paso 2: $D$ vs Horas/día (a obreros y obra fija): Más horas diarias implican menos días $\implies$ INVERSA (se invierte a $\frac{H_2}{H_1}$).'
  - 'Paso 3: $T$ vs Rapidez (a distancia fija): A mayor rapidez, menor tiempo $\implies$ INVERSA.'
  - 'Paso 4: Razón resultante en la fórmula: Se invierte a $\frac{v_2}{v_1}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué transformación debe realizarse a la razón de una magnitud inversamente proporcional en la fórmula compuesta?
  choices:
  - text: 'Invertir la fracción escribiendo el valor final en el numerador: $\frac{C_2}{C_1}$'
    is_correct: true
  - text: Mantener la fracción en el orden original $\frac{C_1}{C_2}$
    is_correct: false
  - text: Restarle la constante de proporcionalidad
    is_correct: false
  - text: Multiplicarla por cero
    is_correct: false
  explanation: 'La alternativa correcta es ''Invertir la fracción escribiendo el valor final en el numerador: $\frac{C_2}{C_1}$''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué tanto los obreros como las horas diarias son inversas respecto a los días?
  choices:
  - text: Porque aumentar cualquiera de las dos permite completar la misma obra en menos días totales
    is_correct: true
  - text: Porque las horas y los obreros se miden en las mismas unidades
    is_correct: false
  - text: Porque los números son divisibles entre sí
    is_correct: false
  - text: Por una coincidencia del enunciado
    is_correct: false
  explanation: La alternativa correcta es 'Porque aumentar cualquiera de las dos permite completar la misma obra en menos días totales'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Fijar mentalmente todas las demás variables como constantes.'
- 'Paso 2: Comprobar si al aumentar la variable analizada, la incógnita disminuye.'
- 'Paso 3: Si disminuye, catalogar como INVERSA e invertir su razón a $\frac{C_2}{C_1}$ en la ecuación general.'
errores_correccion: "- **Error 1: No invertir la razón de la magnitud inversa.** **Cómo corregirlo:** Recordar: INVERSA = SE INVIERTE ($\frac{C_2}{C_1}$).\n- **Error 2: Invertir también la incógnita.** **Cómo corregirlo:** La incógnita se mantiene como $\frac{A_1}{A_2}$ al lado izquierdo."
ejemplos:
- titulo: Ejemplo 1
  enunciado: En una obra, si la incógnita son los Días ($D$) y participan $8$ obreros inicialmente y $12$ al final, ¿cómo entra la razón de obreros?
  alternativas:
  - 'Invertida: $\frac{12}{8}$'
  - 'Directa: $\frac{8}{12}$'
  - 'Como suma: $12 + 8$'
  respuesta: 'Invertida: $\frac{12}{8}$'
  solucion_pasos:
  - Obreros vs Días es inversa $\implies$ se invierte a $\frac{12}{8} = \frac{3}{2}$.
- titulo: Ejemplo 2
  enunciado: Si $6$ grifos llenan una piscina en $10\text{ horas}$, ¿qué tipo de relación tienen los Grifos frente al Tiempo de llenado?
  alternativas:
  - 'Inversa: más grifos tardan menos horas'
  - 'Directa: más grifos tardan más horas'
  - No hay proporción
  respuesta: 'Inversa: más grifos tardan menos horas'
  solucion_pasos:
  - Más caudal llena la piscina en menor tiempo $\implies$ INVERSA.
- titulo: ¿Se debe invertir obligatoriamente la razón de una magnitud inversa en la ecuación compuesta?
  respuesta: Sí
  solucion_pasos:
  - Sí, de no invertirse se generaría un resultado opuesto al comportamiento real.
  alternativas:
  - texto: Sí, la inversión C₂ / C₁ es obligatoria para reflejar la relación inversa
    es_correcta: true
    retroalimentacion: ¡Correcto! Inversión mandatoria.
  - texto: No, se mantiene C₁ / C₂
    es_correcta: false
    retroalimentacion: Incorrecto, eso representaría una relación directa.
  - texto: No, se le cambia solo el signo
    es_correcta: false
    retroalimentacion: Incorrecto, la operación es multiplicativa recíproca.
- titulo: ¿Es inversa la relación entre rendimiento de un trabajador y el tiempo que tarda?
  respuesta: Sí
  solucion_pasos:
  - Sí, a mayor rendimiento o eficiencia, menor es el tiempo necesario para la labor.
  alternativas:
  - texto: Sí, mayor rendimiento implica menor tiempo de ejecución
    es_correcta: true
    retroalimentacion: ¡Correcto! Rendimiento vs Tiempo es inverso.
  - texto: No, es directa
    es_correcta: false
    retroalimentacion: Incorrecto, un trabajador más rápido no tarda más tiempo.
  - texto: No, el rendimiento es constante
    es_correcta: false
    retroalimentacion: Incorrecto, puede variar entre diferentes grupos.
errores_frecuentes:
- Olvidar invertir la razón de las magnitudes inversas.
- Invertir magnitudes directas por confusión.
- Invertir la fracción de la incógnita $\frac{A_1}{A_2}$.
- No verificar que la respuesta tenga sentido lógico.
afirmaciones_verdaderas:
- Una magnitud es inversa con la incógnita si bajo ceteris paribus al aumentar una la otra disminuye.
- La razón de una magnitud inversa se incorpora como $\frac{C_2}{C_1}$ en la ecuación general.
- La inversión de la razón asegura que la relación recíproca se preserve algebraicamente.
al_terminar_debes_poder: '![Síntesis de relación inversa en compuesta](/static/img/nodos/identificacion-de-una-relacion-inversa-en-contexto-compuesto-resumen.svg)


  QUÉ: Identificar magnitudes inversamente proporcionales respecto a una incógnita en problemas compuestos.


  CÓMO: Aplicando el análisis ceteris paribus e incorporando la razón invertida $\frac{C_2}{C_1}$ en el producto de la proporción general.'
