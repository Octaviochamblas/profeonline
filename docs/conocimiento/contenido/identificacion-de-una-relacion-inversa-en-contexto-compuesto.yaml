procedimiento:
- 'Paso 1: Fija mentalmente las demás variables.'
- 'Paso 2: Hazte la pregunta: ''A más de esto, ¿más o menos de la incógnita?''.'
- 'Paso 3: Si la respuesta es ''menos'', anota una ''I'' (inversa) y recuerda invertir esa
  fracción al operar.'
errores_correccion: Evita confundir los datos de entrada al operar con identificación de una
  relación inversa en contexto compuesto.
ejemplos:
- titulo: Pintores, casas y días
  enunciado: La incógnita es 'Días'. Las otras variables son Casas y Pintores. ¿Cómo es la
    relación Días-Pintores?
  solucion_pasos:
  - Congelamos las Casas (es la misma obra).
  - 'Pregunta: A más Pintores trabajando, ¿se demorarán más o menos Días?'
  - 'Respuesta: Menos días. Por tanto, es Inversa.'
- titulo: Ejemplo 2
  enunciado: En un problema con velocidad y tiempo de viaje, a distancia fija, ¿cómo es la
    relación?
  alternativas:
  - Inversa
  - Directa
  - No hay relación
  respuesta: Inversa
  solucion_pasos:
  - A más velocidad, menos tiempo de viaje.
- titulo: Ejemplo 3
  enunciado: ¿Cuál situación describe una relación inversa?
  alternativas:
  - Más grifos abiertos, menos horas para llenar un estanque
  - Más kilos comprados, más dinero pagado
  - Más días trabajados, más dinero ganado
  respuesta: Más grifos abiertos, menos horas para llenar un estanque
  solucion_pasos:
  - Una magnitud sube mientras la otra baja.
- titulo: ¿En una relación inversa, al aumentar una magnitud la otra también aumenta?
  respuesta: 'No'
  solucion_pasos:
  - En una relación inversa, al aumentar una magnitud, la otra disminuye.
errores_frecuentes:
- Olvidar invertir la fracción en la ecuación matemática a pesar de haber deducido correctamente
  que era inversa.
- Invertir la fracción de la incógnita en lugar de las fracciones de los datos.
- Pensar que 'más horas = más cansancio' es una relación matemática de proporción.
- Olvidar invertir la fracción correspondiente a la magnitud inversa al armar la ecuación.
- Confundir una relación inversa con una directa por no fijar correctamente las demás variables.
afirmaciones_verdaderas:
- La propiedad de identificación de una relación inversa en contexto compuesto preserva la
  consistencia lógica.
- En el método de fracciones, cuando una magnitud tiene relación inversa con la incógnita,
  su fracción se escribe invertida antes de multiplicarla.
al_terminar_debes_poder: Resolver problemas aplicados que involucren identificación de una
  relación inversa en contexto compuesto.
