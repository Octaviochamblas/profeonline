semantic_id: MAT.NUM.PROP_COMPUESTA.RELACION_INVERSA
resumen_inicial: 'En un problema de proporcionalidad compuesta, una magnitud mantiene una relación inversa con la incógnita si, al aumentar esa magnitud (dejando las demás fijas), la incógnita disminuye en la misma proporción.'
explicacion_simple: |
  Para identificar si una variable en un problema complejo se relaciona de manera **inversa** con la incógnita, hazte la siguiente pregunta congelando todas las demás variables: *"Si aumento esta variable, ¿la respuesta final disminuye?"*. Si la respuesta es SÍ, la relación es **inversa**. Por ejemplo, para construir una casa de dimensiones fijas, si aumentas la cantidad de obreros trabajando, la cantidad de días necesarios para terminarla disminuye.
explicacion_formal: |
  ### Definición formal
  En un sistema compuesto $Y = f(X_1, X_2, \dots, X_n)$, la variable independiente $X_j$ mantiene una **relación de proporcionalidad inversa con la incógnita $Y$** si, manteniendo las demás variables congeladas ($X_i = c_i, \forall i \neq j$), el producto multiplicativo se conserva constante:
  $$Y \cdot X_j = k_j \quad \iff \quad Y = \frac{k_j}{X_j} \quad (k_j > 0)$$

  ### Regla del producto constante y razón invertida
  Al aislar la variable $X_j$ frente a $Y$, la igualdad de productos establece:
  $$Y^{(1)} \cdot X_j^{(1)} = Y^{(2)} \cdot X_j^{(2)} \implies \frac{Y^{(2)}}{Y^{(1)}} = \frac{X_j^{(1)}}{X_j^{(2)}}$$
  lo cual obliga a **invertir la razón** de la variable ($\frac{X_j^{(1)}}{X_j^{(2)}}$) al armar la fórmula de la proporción compuesta global.

  ### Casos típicos de relación inversa en contextos compuestos
  - **Obreros o Máquinas vs. Días u Horas**: Más trabajadores disminuyen el tiempo de entrega.
  - **Velocidad vs. Tiempo de recorrido**: Mayor velocidad reduce el tiempo para una distancia fija.
  - **Horas diarias de trabajo vs. Días totales**: Trabajar más horas por día reduce el número total de días necesarios.

  ### Síntesis didáctica
  - Criterio: A más $X_j \implies$ menos $Y$ (con demás variables fijas).
  - Efecto algebraico: La razón de la variable entra invertida ($\frac{X_j^{(1)}}{X_j^{(2)}}$).
definiciones_clave: |
  - **Relación inversa aislada**: Comportamiento donde la incógnita cambia en sentido recíproco al variar la magnitud evaluada.
  - **Factor de razón invertida**: Fracción $\frac{X_j^{(1)}}{X_j^{(2)}}$ que invierte los datos originales al calcular el resultado compuesto.
  - **Compensación de esfuerzo**: Principio donde la adición de recursos reduce el tiempo o la duración requerida.
propiedades_relaciones: |
  - **Ubicación en el numerador de la constante**: Si $X_j$ es inversa a $Y$, en la constante compuesta $k = \frac{Y \cdot \prod X_{\text{Inversas}}}{\prod X_{\text{Directas}}}$, $X_j$ se ubica en el numerador multiplicando a $Y$.
  - **Reciprocidad funcional**: Multiplicar la variable inversa por $n$ implica dividir la incógnita $Y$ exactamente por $n$.
ejemplo_guiado:
  enunciado: 'Para realizar un trabajo de imprenta, $4$ máquinas tardan $10$ días trabajando $6$ horas al día. Determina si la variable "número de máquinas" es directa o inversa respecto a la incógnita "días totales".'
  pasos:
    - 'Paso 1: Identificamos la incógnita: días totales ($Y$).'
    - 'Paso 2: Congelamos las horas al día: fijamos la jornada laboral en $6\text{ horas/día}$.'
    - 'Paso 3: Razonamos: si ponemos MÁS máquinas a imprimir la misma cantidad de trabajo, ¿tardarán MÁS o MENOS días?'
    - 'Paso 4: Como MÁS máquinas tardan MENOS días, concluimos que la relación entre número de máquinas y días es **INVERSA**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué transformación se debe realizar a la razón de una variable $X_j$ al incluirla en la ecuación de proporcionalidad compuesta si se determinó que es inversamente proporcional a la incógnita?'
    choices:
      - {text: 'Invertir la fracción de la razón, escribiendo $\frac{X_j^{(1)}}{X_j^{(2)}}$ en lugar de la razón original', is_correct: true}
      - {text: 'Mantener la razón sin cambios exactamente igual que en la proporción directa', is_correct: false}
      - {text: 'Restar la razón al valor inicial', is_correct: false}
      - {text: 'Elevar la razón al cuadrado', is_correct: false}
    explanation: 'La alternativa correcta es ''Invertir la fracción de la razón, escribiendo $\frac{X_j^{(1)}}{X_j^{(2)}}$ en lugar de la razón original''. Las variables inversas entran invertidas en el producto.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En un problema donde se busca el tiempo en horas para llenar un estanque, ¿qué relación tiene la variable "número de grifos idénticos abiertos" con las horas de llenado?'
    choices:
      - {text: 'Relación inversa, porque a mayor número de grifos abiertos, menor es el tiempo en horas para llenar el estanque', is_correct: true}
      - {text: 'Relación directa, porque más grifos aumentan las horas', is_correct: false}
      - {text: 'Relación nula o constante', is_correct: false}
      - {text: 'Relación exponencial', is_correct: false}
    explanation: 'La alternativa correcta es ''Relación inversa, porque a mayor número de grifos abiertos, menor es el tiempo en horas para llenar el estanque''. A más grifos, menos tiempo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la magnitud que contiene la incógnita $Y$.'
  - 'Paso 2: Seleccionar la magnitud independiente $X_j$ a evaluar.'
  - 'Paso 3: Asumir que las demás magnitudes del problema permanecen fijas (constantes).'
  - 'Paso 4: Verificar si un incremento en $X_j$ produce una disminución en $Y$. De ser así, clasificar la relación como **INVERSA**.'
errores_correccion: |
  - **Error 1:** Olvidar invertir los datos de la variable al armar la fórmula compuesta. **Cómo corregirlo:** Toda variable clasificada como inversa debe colocarse patas arriba en la proporción: **$\frac{\text{Valor Inicial}}{\text{Valor Final}}$**.
  - **Error 2:** Evaluar la relación de la variable contra otra magnitud independiente en lugar de compararla directamente contra la incógnita. **Cómo corregirlo:** La comparación **SIEMPRE debe hacerse contra la variable que contiene la incógnita ($Y$)**.
ejemplos:
  - titulo: 'Relación entre velocidad y tiempo'
    enunciado: 'Para una distancia fija y número de pasajeros constante, ¿la velocidad de un autobús es inversamente proporcional al tiempo de viaje?'
    alternativas:
      - 'Sí, a mayor velocidad menor tiempo de viaje'
      - 'No, es directamente proporcional'
      - 'No hay relación'
    respuesta: 'Sí, a mayor velocidad menor tiempo de viaje'
    solucion_pasos:
      - '1. Fijamos la distancia del viaje.'
      - '2. MÁS velocidad $\implies$ MENOS tiempo $\implies$ Relación Inversa.'
  - titulo: 'Relación entre obreros y días'
    enunciado: 'En la construcción de una barda, ¿el número de albañiles es inversamente proporcional a los días requeridos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. A más albañiles trabajando, menos días se necesitan para terminar la obra.'
  - titulo: 'Relación entre horas diarias y días totales'
    enunciado: 'Para realizar un informe, si se trabajan más horas por día, ¿disminuye el número total de días necesarios?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. MÁS horas diarias $\implies$ MENOS días totales $\implies$ Relación Inversa.'
  - titulo: 'Relación entre número de llaves y tiempo de llenado'
    enunciado: 'Para un tanque de agua, ¿la cantidad de llaves abiertas es inversamente proporcional al tiempo de llenado?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. MÁS llaves arrojando agua $\implies$ MENOS tiempo de llenado.'
errores_frecuentes:
  - 'Las variables inversamente proporcionales se ingresan en la fórmula respetando su orden directo original.'
  - 'La presencia de una variable inversa transforma automáticamente a todas las demás en inversas.'
  - 'Evaluar la relación inversa comparando dos magnitudes independientes entre sí en lugar de compararlas con la incógnita.'
  - 'Todas las variables con números grandes deben ser tratadas automáticamente como relaciones inversas.'
  - 'Sumar los valores de las variables inversas en lugar de multiplicar la razón invertida.'
afirmaciones_verdaderas:
  - 'Una magnitud es inversamente proporcional a la incógnita si, al aumentar su valor (con las demás fijas), la incógnita disminuye en la misma proporción.'
  - 'Al aplicar la regla de proporción compuesta, las razones de las magnitudes inversas deben ingresarse en forma invertida $\frac{X^{(1)}}{X^{(2)}}$.'
al_terminar_debes_poder: 'Identificar magnitudes inversamente proporcionales en un problema compuesto e invertir su razón al formular la ecuación.'
