  question: ¿Cuál es el aspecto fundamental al trabajar con identificación de una relación
    inversa en contexto compuesto?
  choices:
  - text: Identificar correctamente la relación de proporcionalidad compuesta
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de proporcionalidad
