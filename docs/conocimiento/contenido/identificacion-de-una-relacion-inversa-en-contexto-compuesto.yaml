semantic_id: MAT.NUM.PROP_COMPUESTA.RELACION_INVERSA
resumen_inicial: 'Identificación de una relación inversa en contexto compuesto: concepto y
  propiedades fundamentales en Proporcionalidad compuesta.'
explicacion_simple: Así como hay relaciones directas, a veces aislar dos variables nos revela
  un sube y baja. Identificar esta inversión es crítico para no equivocarse al armar la ecuación
  final.
explicacion_formal: 'Continuando con el método, comparamos la incógnita ($X$) con otra magnitud
  $B$.


  Si la pregunta ''A mayor cantidad de $B$, ¿se necesitará más o menos $X$?'' tiene como respuesta
  ''MENOS'' (funcionan como un balancín), la relación es **inversa**.


  En el método algorítmico tradicional, cuando una columna tiene relación inversa con la incógnita,
  su fracción se escribe ''de cabeza'' (se invierten el numerador y denominador) antes de
  multiplicarla.'
definiciones_clave: '- **Identificación de una relación inversa en contexto compuesto**: Elemento
  central dentro del estudio de Proporcionalidad compuesta.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a identificación de una relación inversa en contexto compuesto.'
ejemplo_guiado:
  enunciado: 'Un mismo trabajo se reparte entre obreros: con 4 obreros demora 12 días. ¿Cómo
    es la relación entre el número de obreros y los días necesarios, a igual cantidad de trabajo?'
  pasos:
  - 'Congelo mentalmente la cantidad total de trabajo, que no cambia: 48 obreros-día.'
  - 'Me pregunto: si se duplican los obreros a 8, ¿se necesitan más o menos días? Calculo:
    48 dividido entre 8 es igual a 6 días, menos que los 12 originales.'
  - Como el número de obreros subió y los días bajaron, concluyo que la relación entre obreros
    y días es inversa.
checkpoints:
