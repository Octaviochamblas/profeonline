resumen_inicial: En un contexto compuesto, una magnitud es inversamente proporcional
  a la variable incógnita si al aumentar dicha magnitud (manteniendo fijas las otras),
  la incógnita disminuye en la misma proporción.
explicacion_simple: 'Para identificar una relación inversa en un problema compuesto,
  congelamos las otras variables y evaluamos: si aumentamos esta magnitud, ¿la incógnita
  baja? Si disminuye, la relación es inversa y su fracción deberá invertirse al resolver.'
explicacion_formal: 'Para un sistema de magnitudes $\{X, Y_1, Y_2, \dots\}$, la variable
  $Y_2$ es **Inversamente Proporcional a la Incógnita $X$** si:


  $$X \cdot Y_2 = cst \quad \text{al mantener } Y_1, Y_3, \dots \text{ constantes}$$


  **Ubicación en el algoritmo de resolución:**

  - Al armar la ecuación de proporciones, la razón de la magnitud inversa se invierte
  (se multiplica por $\frac{y_2}{y_1}$ en lugar de $\frac{y_1}{y_2}$).'
definiciones_clave: '- **Relación inversa compuesta**: Disminución de la incógnita
  al incrementar la magnitud manteniendo las demás fijas.'
propiedades_relaciones: '- **Inversión de razón**: La relación se invierte al formar
  el producto en la ecuación de resolución.'
ejemplo_guiado:
  enunciado: En la construcción de un camino (Máquinas, Días, Kilómetros), determine
    la relación entre Máquinas y Días.
  pasos:
  - 'Paso 1: Mantener constante la cantidad de Kilómetros a construir.'
  - 'Paso 2: Preguntar: si usamos más Máquinas, ¿necesitaremos más o menos Días?'
  - 'Paso 3: A mayor número de máquinas se requieren menos días de trabajo.'
  - 'Conclusión: La relación entre Máquinas y Días es Inversa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se comporta la incógnita frente a una magnitud inversamente proporcional
    en un contexto compuesto?
  choices:
  - text: Disminuye proporcionalmente al aumentar dicha magnitud (manteniendo fijas
      las otras)
    is_correct: true
  - text: Aumenta en la misma proporción
    is_correct: false
  - text: Permanece invariable en todo momento
    is_correct: false
  - text: Se transforma en cero
    is_correct: false
  explanation: La alternativa correcta es 'Disminuye proporcionalmente al aumentar
    dicha magnitud (manteniendo fijas las otras)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado entre Máquinas y Días, ¿por qué se clasificó como
    relación inversa?
  choices:
  - text: Porque al aumentar la cantidad de máquinas disminuye el número de días necesarios
    is_correct: true
  - text: Porque más máquinas requieren más días
    is_correct: false
  - text: Porque los kilómetros se duplicaron
    is_correct: false
  - text: Because es una resta
    is_correct: false
  explanation: La alternativa correcta es 'Porque al aumentar la cantidad de máquinas
    disminuye el número de días necesarios'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar relaciones de proporcionalidad
  inversa con la incógnita en contextos compuestos para invertir su razón en el algoritmo
  de resolución.
semantic_id: MAT.NUM.PROP_COMPUESTA.RELACION_INVERSA
procedimiento:
- 'Paso 1: Identificar la variable incógnita y comparar individualmente cada magnitud
  auxiliar con ella (fijando las demás).'
- 'Paso 2: Clasificar cada magnitud como directamente proporcional (mantener razón)
  o inversamente proporcional (invertir razón).'
- 'Paso 3: Formar la ecuación generalizada y calcular la respuesta reduciendo los
  factores multiplicativos.'
errores_correccion: '- **Error 1: Comparar las magnitudes auxiliares entre sí en lugar
  de compararlas con la variable incógnita.** **Cómo corregirlo:** La comparación
  de proporcionalidad directa o inversa se DEBE hacer siempre respecto a la columna
  de la INCÓGNITA.


  - **Error 2: No invertir la razón de las magnitudes inversas al armar la fórmula.**
  **Cómo corregirlo:** Las magnitudes inversas cambian su posición $\frac{a_1}{a_2}
  \to \frac{a_2}{a_1}$ al multiplicar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_COMPUESTA.RELACION_INVERSA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las leyes de proporcionalidad compuesta.
- titulo: Ejemplo 2
  enunciado: Verificación de la fórmula del producto de razones.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por producto de razones.
- titulo: ¿Se invierten las razones de las magnitudes inversas en la fórmula generalizada?
  respuesta: Sí
  solucion_pasos:
  - Sí, para compensar la variación inversamente proporcional.
- titulo: ¿Es necesario congelar las otras variables al clasificar una magnitud?
  respuesta: Sí
  solucion_pasos:
  - Sí, para aislar el efecto puro de esa variable sobre la incógnita.
errores_frecuentes:
- Comparar dos magnitudes auxiliares entre sí en lugar de analizar su relación individual
  con la incógnita.
- Mantener sin invertir la fracción correspondiente a una magnitud de relación inversamente
  proporcional.
- Multiplicar todos los datos numéricos del problema sin distinguir su carácter directo
  o inverso.
- Omitir congelar mentalmente las demás variables al determinar si una relación es
  directa o inversa.
- Declarar que si participan más de tres variables la relación es siempre directamente
  proporcional.
afirmaciones_verdaderas:
- La proporcionalidad compuesta combina tres o más magnitudes analizando la relación
  directa o inversa de cada una con la incógnita.
- En la fórmula generalizada de resolución, la razón de una magnitud inversa se invierte
  respecto a su estado inicial.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
