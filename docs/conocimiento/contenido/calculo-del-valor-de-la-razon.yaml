semantic_id: MAT.NUM.RAZONES_PROPORCIONES.VALOR_RAZON
resumen_inicial: 'El valor de la razón $k$ es el cociente numérico resultante de dividir el antecedente por el consecuente: $k = \frac{a}{b} = a \div b$, expresado como número entero, decimal o fracción irreducible.'
explicacion_simple: "![Cálculo del valor de la razón](/static/img/nodos/calculo-del-valor-de-la-razon-intro.svg)\n\nEl **valor de la razón** (llamado $k$) es el número que resulta de hacer la división:\n- Se calcula dividiendo el número de arriba entre el de abajo: $k = a \\div b$.\n- Nos dice **cuántas veces es más grande o más pequeño el antecedente respecto al consecuente**.\n- Ejemplos:\n  - En $14 : 4 \\implies k = \\frac{14}{4} = 3,5$ (el antecedente es $3,5$ veces el consecuente).\n  - En $3 : 8 \\implies k = \\frac{3}{8} = 0,375$.\n- Si dos razones tienen el **mismo valor $k$**, decimos que son **equivalentes** y forman una proporción."
explicacion_formal: "Sea la razón $r = a : b$ con $a, b \\in \\mathbb{R}$ y $b \\neq 0$. Se define el **valor de la razón** como el escalar $k \\in \\mathbb{R}$ tal que:\n\n$$k = \\frac{a}{b} = a \\div b$$\n\n**Propiedades de la Constante $k$:**\n1. **Factor de Escala:** $a = k \\cdot b$.\n2. **Equivalencia:** Dos razones $\\frac{a}{b}$ y $\\frac{c}{d}$ son equivalentes si y solo si $\\frac{a}{b} = \\frac{c}{d} = k$.\n3. **Casos de Magnitud:**\n   - Si $k > 1$: El antecedente es mayor que el consecuente ($a > b$).\n   - Si $k = 1$: Ambas magnitudes son idénticas ($a = b$).\n   - Si $0 < k < 1$: El antecedente es menor que el consecuente ($a < b$)."
definiciones_clave: '- **Valor de la razón ($k$)**: Cociente escalar $k = \frac{a}{b}$.

  - **Constante de proporcionalidad**: Factor multiplicativo uniforme entre magnitudes.

  - **Razones equivalentes**: Razones distintas que producen el mismo valor $k$.'
propiedades_relaciones: '- **Invarianza**: $\frac{m \cdot a}{m \cdot b} = k$ para todo $m \neq 0$.

  - **Inversión**: El valor de la razón inversa $\frac{b}{a}$ es el recíproco $\frac{1}{k}$ ($a \neq 0$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de valor de la razón](/static/img/nodos/calculo-del-valor-de-la-razon-ejemplos.svg)


    Calcule el valor de la razón $k$ para $14 : 4$ y para $3 : 8$, e interprete su significado numérico.'
  pasos:
  - 'Paso 1: Para $14 : 4$: Dividir antecedente $14$ entre consecuente $4 \implies \frac{14}{4} = \frac{7}{2} = 3,5$.'
  - 'Paso 2: Interpretación: El antecedente contiene $3,5$ veces al consecuente.'
  - 'Paso 3: Para $3 : 8$: Dividir $3$ entre $8 \implies \frac{3}{8} = 0,375$.'
  - 'Paso 4: Interpretación: El antecedente representa el $37,5\%$ del consecuente.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuál es el valor de la razón para $45 : 15$?'
  choices:
  - text: $3$
    is_correct: true
  - text: $30$
    is_correct: false
  - text: $0,33$
    is_correct: false
  - text: $675$
    is_correct: false
  explanation: La alternativa correcta es '$3$'. Dividiendo $45 \div 15 = 3$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿qué indica que el valor de la razón sea $k = 3,5$?
  choices:
  - text: Que la primera cantidad es 3,5 veces mayor que la segunda
    is_correct: true
  - text: Que la suma de las cantidades es 3,5
    is_correct: false
  - text: Que la diferencia entre ambas es 3,5
    is_correct: false
  - text: Que el consecuente vale 3,5
    is_correct: false
  explanation: La alternativa correcta es 'Que la primera cantidad es 3,5 veces mayor que la segunda'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el antecedente $a$ y el consecuente $b$ en forma de fracción $\frac{a}{b}$.'
- 'Paso 2: Realizar la división decimal $a \div b$ o simplificar a fracción irreducible.'
- 'Paso 3: Expresar el valor $k$ obtenido e interpretar la relación multiplicativa entre ambas cantidades.'
errores_correccion: "- **Error 1: Restar en vez de dividir para hallar el valor ($14 - 4 = 10$).** **Cómo corregirlo:** La razón geométrica es **estrictamente una división**: $14 \\div 4 = 3,5$.\n- **Error 2: Dividir al revés ($4 \\div 14 \approx 0,28$).** **Cómo corregirlo:** Se divide siempre el antecedente entre el consecuente: $k = a \\div b$."
ejemplos:
- titulo: Ejemplo 1
  enunciado: '¿Cuál es el valor de la razón $50 : 20$?'
  alternativas:
  - $2,5$
  - $0,4$
  - $30$
  respuesta: $2,5$
  solucion_pasos:
  - $50 \div 20 = 2,5$.
- titulo: Ejemplo 2
  enunciado: '¿Son equivalentes las razones $6 : 8$ y $15 : 20$?'
  alternativas:
  - Sí, ambas tienen valor k = 0,75
  - No, sus números son distintos
  - No, una es par y la otra impar
  respuesta: Sí, ambas tienen valor k = 0,75
  solucion_pasos:
  - $\frac{6}{8} = 0,75$ y $\frac{15}{20} = 0,75$. Como tienen el mismo valor $k$, son equivalentes.
- titulo: '¿Es el valor de la razón 1 : 2 igual a 0,5?'
  respuesta: Sí
  solucion_pasos:
  - Sí, $1 \div 2 = 0,5$.
  alternativas:
  - texto: Sí, 1 dividido por 2 es exactamente 0,5
    es_correcta: true
    retroalimentacion: ¡Correcto! Valor decimal de la razón.
  - texto: No, es 2
    es_correcta: false
    retroalimentacion: 'Incorrecto, 2 es la razón inversa $2 : 1$.'
  - texto: No, es -1
    es_correcta: false
    retroalimentacion: Incorrecto, no es una resta.
- titulo: ¿Cambia el valor de la razón al amplificar por 10?
  respuesta: 'No'
  solucion_pasos:
  - No, $\frac{10a}{10b} = \frac{a}{b} = k$.
  alternativas:
  - texto: No, el valor k se mantiene estrictamente invariante
    es_correcta: true
    retroalimentacion: ¡Correcto! Propiedad fundamental de las fracciones equivalentes.
  - texto: Sí, se multiplica por 10
    es_correcta: false
    retroalimentacion: Incorrecto, se simplifica el factor 10 en numerador y denominador.
  - texto: Sí, se multiplica por 100
    es_correcta: false
    retroalimentacion: Incorrecto, la constante de proporcionalidad no cambia.
errores_frecuentes:
- Calcular la resta en lugar del cociente de las cantidades.
- Dividir el consecuente por el antecedente ($b \div a$).
- Creer que dos razones con números distintos no pueden tener el mismo valor $k$.
- Cometer errores en la división decimal con números no exactos.
afirmaciones_verdaderas:
- El valor de la razón es el cociente numérico $k = \frac{a}{b}$.
- Dos razones son equivalentes si y solo si producen exactamente el mismo valor de la razón $k$.
- El valor de la razón expresa cuántas veces el antecedente contiene al consecuente.
al_terminar_debes_poder: '![Síntesis de valor de la razón](/static/img/nodos/calculo-del-valor-de-la-razon-resumen.svg)


  QUÉ: Calcular e interpretar el valor numérico $k$ de cualquier razón matemática.


  CÓMO: Efectuando la división $k = a \div b$, expresando el resultado en forma decimal, entera o fraccionaria irreducible y utilizándolo para verificar la equivalencia entre razones.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
