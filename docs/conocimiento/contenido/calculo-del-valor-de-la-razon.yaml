resumen_inicial: 'El valor de la razón es el número constante $k$ obtenido al efectuar
  la división numérica entre el antecedente y el consecuente: $k = \frac{a}{b}$.'
explicacion_simple: El valor de la razón es la respuesta numérica que obtenemos al
  dividir el primer número entre el segundo. Por ejemplo, en la razón 6 a 2, el valor
  de la razón es 3 porque 6 dividido entre 2 es igual a 3.
explicacion_formal: 'Para toda razón $\frac{a}{b}$, el **Valor de la Razón $k$** es
  el cociente escalar real:


  $$k = \frac{a}{b} \implies a = k \cdot b$$


  **Interpretación de la constante $k$:**

  - Si $k > 1$, el antecedente es $k$ veces mayor que el consecuente.

  - Si $0 < k < 1$, el antecedente es una fracción o parte del consecuente.'
definiciones_clave: '- **Valor de la razón $k$**: Resultado numérico $k = \frac{a}{b}$
  que expresa el factor multiplicativo.'
propiedades_relaciones: '- **Constante de proporcionalidad**: $a = k \cdot b$.'
ejemplo_guiado:
  enunciado: Calcule el valor de la razón para $a = 15$ y $b = 6$.
  pasos:
  - 'Paso 1: Plantear la división entre el antecedente y el consecuente: $k = \frac{15}{6}$.'
  - 'Paso 2: Simplificar la fracción o calcular la división decimal: $\frac{15:3}{6:3}
    = \frac{5}{2} = 2,5$.'
  - 'Conclusión: El valor de la razón es $k = 2,5$ (el antecedente es $2,5$ veces
    el consecuente).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula el valor de la razón k a partir del antecedente a y el
    consecuente b?
  choices:
  - text: Efectuando la división k = a / b
    is_correct: true
  - text: Restando k = a - b
    is_correct: false
  - text: Sumando k = a + b
    is_correct: false
  - text: Multiplicando k = a · b
    is_correct: false
  explanation: La alternativa correcta es 'Efectuando la división k = a / b'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para a = 15 y b = 6, ¿cuál fue el valor de la razón
    k?
  choices:
  - text: 2,5 (o 5/2)
    is_correct: true
  - text: '9'
    is_correct: false
  - text: '90'
    is_correct: false
  - text: 0,4
    is_correct: false
  explanation: La alternativa correcta es '2,5 (o 5/2)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el valor de la razón
  $k = \frac{a}{b}$, expresándolo como número decimal o fracción simplificada.
semantic_id: MAT.NUM.RAZONES.VALOR_RAZON
procedimiento:
- 'Paso 1: Identificar el antecedente $a$ y el consecuente $b$ en la comparación por
  cociente.'
- 'Paso 2: Calcular el valor de la razón $k = a / b$ o aplicar las propiedades de
  series de razones.'
- 'Paso 3: Simplificar y expresar la respuesta en términos del problema planteado.'
errores_correccion: '- **Error 1: Confundir la comparación por cociente con la comparación
  por diferencia (resta).** **Cómo corregirlo:** La razón matemática es multiplicativa
  por división ($a/b$), no por resta ($a-b$).


  - **Error 2: Invertir el orden entre antecedente y consecuente.** **Cómo corregirlo:**
  Respetar estrictamente el orden nombrado en el enunciado ($a:b$ pone a $a$ arriba
  y a $b$ abajo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.RAZONES.VALOR_RAZON.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de razones.
- titulo: Ejemplo 2
  enunciado: Verificación de la relación proporcional.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por cociente.
- titulo: ¿Es el consecuente de una razón siempre distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división por cero.
- titulo: ¿Se conserva la constante k al sumar antecedentes y consecuentes en una
    serie?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de las series de razones.
errores_frecuentes:
- Calcular la razón entre dos magnitudes mediante la resta de sus valores numéricos.
- Invertir la posición del antecedente y del consecuente alterando el valor escalar
  de la razón.
- Utilizar el número cero como el consecuente de una razón matemática.
- La constante de la razón $k$ en una serie de razones cambia al sumar los antecedentes.
- Sumar directamente los términos de la razón sin multiplicar por la constante $k$.
afirmaciones_verdaderas:
- 'Una razón es la comparación por cociente $a : b = \frac{a}{b}$ entre dos magnitudes
  con $b \neq 0$.'
- En una serie de razones iguales $\frac{a}{b} = \frac{c}{d} = k$, la razón entre
  la suma de antecedentes y la suma de consecuentes equivale a $k$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
