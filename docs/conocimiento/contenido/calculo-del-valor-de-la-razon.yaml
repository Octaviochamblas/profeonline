semantic_id: MAT.NUM.RAZONES.VALOR_RAZON
resumen_inicial: El valor de una razón es el resultado numérico (cociente o decimal)
  obtenido al dividir el antecedente entre el consecuente ($k = \frac{a}{b}$).
explicacion_simple: 'Para calcular el **valor de la razón**, simplemente efectúas
  la división entre el antecedente y el consecuente:

  - En la razón $12:4$, el valor es $12 \div 4 = 3$.

  - En la razón $3:5$, el valor es $3 \div 5 = 0{,}6$.

  Este resultado $k$ se conoce como constante de razón.'
explicacion_formal: Dada la razón $\frac{a}{b}$ con $b \neq 0$, se define el valor
  de la razón como el escalar $k \in \mathbb{R}$ tal que $k = a / b \iff a = k \cdot
  b$.
definiciones_clave: '- **Valor de la razón ($k$)**: Cociente numérico $a \div b$.'
propiedades_relaciones: '- **Relación multiplicativa**: El antecedente es igual al
  consecuente multiplicado por la constante de razón ($a = k \cdot b$).'
ejemplo_guiado:
  enunciado: Calcula el valor de la razón $15:6$.
  pasos:
  - Identificar antecedente $a = 15$ y consecuente $b = 6$.
  - 'Dividir el antecedente por el consecuente: $15 \div 6$.'
  - 'Expresar como fracción simplificada: $\frac{15}{6} = \frac{5}{2}$.'
  - 'Expresar en forma decimal: $2{,}5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de la razón $20:5$?
  choices:
  - text: '4'
    is_correct: true
  - text: 0,25
    is_correct: false
  - text: '15'
    is_correct: false
  - text: '100'
    is_correct: false
  explanation: 'La correcta es: 4. Puesto que $20 \div 5 = 4$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el valor decimal de la razón $3:4$.
  choices:
  - text: 0,75
    is_correct: true
  - text: 1,33
    is_correct: false
  - text: 0,5
    is_correct: false
  - text: 1,25
    is_correct: false
  explanation: 'La correcta es: 0,75. Puesto que $3 \div 4 = 0{,}75$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir el antecedente entre el consecuente.'
- 'Paso 2: Expresar el resultado como entero, fracción irreducible o decimal según
  se requiera.'
errores_correccion: No dividas al revés. En $2:8$, el valor es $2 \div 8 = 0{,}25$,
  no $8 \div 2 = 4$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula el valor de la razón $8:2$.
  alternativas:
  - '4'
  - 0,25
  - '6'
  respuesta: '4'
  solucion_pasos:
  - $8 \div 2 = 4$.
errores_frecuentes:
- Dividir el consecuente entre el antecedente.
afirmaciones_verdaderas:
- El valor de una razón es el cociente $k = a/b$.
al_terminar_debes_ponder: Calcular la constante $k$ de una razón dada.
fuente: Texto escolar MINEDUC.
estado: publicado
