semantic_id: MAT.NUM.RAZONES.VALOR_RAZON
resumen_inicial: 'El valor de la razón $k$ es la constante numérica obtenida al efectuar la división entre el antecedente $a$ y el consecuente $b$: $k = \frac{a}{b}$.'
explicacion_simple: |
  El valor de la razón es el número que obtienes cuando haces la división entre los dos valores de la razón. Se calcula dividiendo el antecedente por el consecuente ($a \div b$). Por ejemplo, si tienes la razón $12 : 4$, su valor es $k = 12 \div 4 = 3$. Esto significa que la primera cantidad es exactamente 3 veces más grande que la segunda. Si la razón es $1 : 2$, su valor es $k = 0.5$, lo que indica que la primera cantidad es la mitad de la segunda.
explicacion_formal: |
  ### Definición formal
  El **valor de la razón (o constante de proporcionalidad simple)** $k \in \mathbb{R}$ es el cociente cuantitativo resultante de evaluar la división del antecedente $a$ por el consecuente $b$:
  $$k = \frac{a}{b} = a : b \quad (b \neq 0)$$

  ### Representación escalar y porcentaje
  El valor de la razón $k$ admite tres representaciones equivalentes:
  1. **Fracción irreducible**: $k = \frac{p}{q}$.
  2. **Número decimal**: $k = d \in \mathbb{R}$.
  3. **Porcentaje**: $P\% = k \cdot 100\%$.

  ### Propiedad de conservación en proporciones
  Dos razones distintas $\frac{a}{b}$ y $\frac{c}{d}$ son equivalentes si y solo si poseen exactamente el mismo valor de la razón:
  $$\frac{a}{b} = \frac{c}{d} \iff k_1 = k_2$$

  ### Síntesis didáctica
  - Operación: Dividir el numerador por el denominador $a \div b$.
  - Significado: Factor de escala multiplicativo que relaciona ambas cantidades.
definiciones_clave: |
  - **Valor de la razón $k$**: Escalar constante $k = \frac{a}{b}$ que indica el número de veces que el consecuente está contenido en el antecedente.
  - **Factor de escala**: Valor numérico que permite convertir la medida de referencia en la medida evaluada ($a = k \cdot b$).
  - **Razones equivalentes**: Conjunto de razones que comparten el mismo valor constante $k$.
propiedades_relaciones: |
  - **Interpretación física**: En magnitudes derivadas (como la densidad $\rho = \frac{m}{V}$ o la velocidad $v = \frac{d}{t}$), el valor de la razón representa una tasa de variación o densidad física.
  - **Relación con porcentajes**: Un valor de razón $k = 0.75$ equivale al $75\%$ de la cantidad de referencia.
ejemplo_guiado:
  enunciado: 'Calcula el valor de la razón entre un volumen de $45\text{ ml}$ de concentrado y $60\text{ ml}$ de agua, exprésalo como número decimal y como porcentaje.'
  pasos:
    - 'Paso 1: Identificamos el antecedente $a = 45$ y el consecuente $b = 60$.'
    - 'Paso 2: Planteamos la división para hallar el valor de la razón: $k = \frac{45}{60}$.'
    - 'Paso 3: Simplificamos la fracción dividiendo entre 15: $k = \frac{3}{4}$.'
    - 'Paso 4: Convertimos a decimal dividiendo $3 \div 4 = 0.75$ y a porcentaje multiplicando por 100: $0.75 \cdot 100\% = 75\%$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿De qué forma se calcula el valor numérico de la razón $k$ entre dos cantidades $a$ y $b$?'
    choices:
      - {text: 'Dividiendo el antecedente entre el consecuente ($k = \frac{a}{b}$)', is_correct: true}
      - {text: 'Multiplicando ambas cantidades ($k = a \cdot b$)', is_correct: false}
      - {text: 'Restando el consecuente al antecedente ($k = a - b$)', is_correct: false}
      - {text: 'Sumando las dos cantidades ($k = a + b$)', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividiendo el antecedente entre el consecuente ($k = \frac{a}{b}$)''. El valor de la razón es el cociente de la división $a / b$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor decimal de la razón $15 : 6$?'
    choices:
      - {text: '$2.5$, efectundo la división $15 \div 6 = 2.5$', is_correct: true}
      - {text: '$0.4$, dividiendo al revés $6 \div 15$', is_correct: false}
      - {text: '$9$, restando $15 - 6$', is_correct: false}
      - {text: '$90$, multiplicando $15 \cdot 6$', is_correct: false}
    explanation: 'La alternativa correcta es ''$2.5$, efectundo la división $15 \div 6 = 2.5$''. Dividimos $15 / 6 = 5 / 2 = 2.5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el antecedente $a$ y el consecuente $b$ en la razón dada.'
  - 'Paso 2: Formular la operación de división $k = \frac{a}{b}$.'
  - 'Paso 3: Realizar la división numérica para obtener el valor decimal o la fracción irreducible.'
  - 'Paso 4: Interpretar el resultado $k$ como la cantidad de veces que el consecuente cabe en el antecedente.'
errores_correccion: |
  - **Error 1:** Dividir el consecuente por el antecedente al calcular el valor de la razón (ej: en $4 : 20$, calcular $20 \div 4 = 5$). **Cómo corregirlo:** La división **siempre es Antecedente $\div$ Consecuente**: $k = \frac{4}{20} = 0.2$.
  - **Error 2:** Restar los números para dar el "valor de la razón" (ej: decir que el valor de la razón de $15 : 5$ es 10). **Cómo corregirlo:** La razón matemática **se evalúa mediante la división**: $k = 15 \div 5 = 3$.
ejemplos:
  - titulo: 'Cálculo de valor entero'
    enunciado: '¿El valor de la razón $36 : 9$ es igual a $4$?'
    alternativas:
      - 'Sí, pues $36 \div 9 = 4$'
      - 'No, es igual a 27'
      - 'No, es igual a 0.25'
    respuesta: 'Sí, pues $36 \div 9 = 4$'
    solucion_pasos:
      - '1. Dividimos antecedente por consecuente: $36 \div 9$.'
      - '2. El cociente resulta $k = 4$.'
  - titulo: 'Cálculo de valor fraccionario'
    enunciado: '¿El valor de la razón $2 : 8$ equivale al decimal $0.25$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $2 \div 8 = 1/4 = 0.25$.'
  - titulo: 'Equivalencia de razones por igual valor'
    enunciado: '¿Las razones $6 : 4$ y $15 : 10$ tienen el mismo valor de la razón $k = 1.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $6/4 = 1.5$ y $15/10 = 1.5$.'
  - titulo: 'Valor de razón en escalas'
    enunciado: '¿El valor de la razón para una escala $1 : 500$ es $0.002$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1 \div 500 = 0.002$.'
errores_frecuentes:
  - 'Dividir el consecuente entre el antecedente invirtiendo el orden de la división.'
  - 'Restar las dos cantidades creyendo que el resultado es el valor de la razón.'
  - 'Expresar el valor de la razón conservando las unidades de medida en lugar de dar un escalar adimensional.'
  - 'La fracción que expresa el valor de la razón se debe presentar siempre en forma no simplificada.'
  - 'Multiplicar las cantidades para determinar la constante de la razón.'
afirmaciones_verdaderas:
  - 'El valor de la razón $k$ es el cociente resultante de dividir el antecedente entre el consecuente ($k = \frac{a}{b}$).'
  - 'Dos razones son equivalentes si y solo si poseen exactamente el mismo valor de la razón $k$.'
al_terminar_debes_poder: 'Calcular el valor numérico de la razón $k = \frac{a}{b}$ expresándolo en forma decimal, fraccionaria o porcentual.'
