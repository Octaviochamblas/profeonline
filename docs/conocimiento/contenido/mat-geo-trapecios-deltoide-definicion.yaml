semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.DELTOIDE_DEFINICION
resumen_inicial: 'Definición de deltoide como trapezoide simétrico: conceptos, teoremas,
  propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: 'Dentro de los trapezoides (cuadriláteros sin lados paralelos),
  existe un caso particular con una propiedad de simetría muy reconocible: el deltoide.'
explicacion_formal: '![Deltoide: dos pares de lados adyacentes congruentes](/static/img/geometria/poligonos-cuadrilateros/trapecios-deltoide-definicion.svg)


  ### Definición formal


  Un deltoide $ABCD$ cumple $AB=AD$ y $CB=CD$ (dos pares de lados consecutivos iguales,
  a diferencia del paralelogramo donde los lados iguales son los opuestos).


  ### Desarrollo didáctico


  A diferencia del rombo (que tiene los cuatro lados iguales), el deltoide solo exige
  que los lados sean iguales en pares consecutivos, formando una figura con un eje
  de simetría a lo largo de una de sus diagonales, similar a la forma de una cometa
  voladora.'
