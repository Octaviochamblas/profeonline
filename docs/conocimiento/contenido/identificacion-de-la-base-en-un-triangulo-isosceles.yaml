semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.BASE_ISOSCELES
resumen_inicial: La base de un triángulo isósceles es el lado no necesariamente congruente
  que conecta los dos ángulos basales de igual medida, independientemente de su orientación
  espacial en el plano.
explicacion_simple: '![Base en Triángulo Isósceles](/static/img/nodos/identificacion-de-la-base-en-un-triangulo-isosceles-intro.svg)


  En el lenguaje diario "base" significa "lo que está apoyado en el piso", pero en
  geometría la **base de un triángulo isósceles** es el **lado desigual** (el que
  está entre los dos ángulos iguales). Si giras el triángulo y la base queda vertical
  o arriba, ¡sigue siendo la base matemática del triángulo!'
explicacion_formal: '### Definición formal

  En un triángulo isósceles $\Delta ABC$ con lados congruentes $AB = AC$, se define
  la **base** como el lado opuesto al vértice principal $A$, sobre el cual descansan
  los ángulos basales congruentes:


  $$\operatorname{Base}(\Delta ABC) = \overline{BC} \iff \overline{AB} \cong \overline{AC}$$


  ### Desglose simbólico y geométrico

  - Vértice principal $A$: Vértice común entre los dos lados congruentes.

  - Base $\overline{BC}$: Lado delimitado por los vértices de los ángulos basales
  iguales $\angle B \cong \angle C$.

  - Altura sobre la base: Divide a la base exactamente en dos mitades simétricas:
  $BD = DC = a/2$.


  ### Síntesis didáctica

  Identificar la base desigual en un triángulo isósceles es el paso esencial para
  aplicar el teorema de Pitágoras y trazar el eje de simetría correcto.'
definiciones_clave: '- **Base geométrica**: El lado comprendido entre los dos ángulos
  congruentes de un triángulo isósceles.

  - **Vértice principal (ápice)**: Vértice opuesto a la base donde concurren los dos
  lados congruentes.

  - **Invarianza por rotación**: La denominación de base no depende de la orientación
  horizontal o vertical del dibujo. '
propiedades_relaciones: '- **Altura principal**: El segmento perpendicular trazado
  desde el vértice principal a la base es a la vez altura, mediana, mediatriz y bisectriz.

  - **Identificación por ángulos**: Si $\angle B = \angle C$, el lado opuesto al tercer
  vértice $A$ es necesariamente la base $\\overline{BC}$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Identificación de Base](/static/img/nodos/identificacion-de-la-base-en-un-triangulo-isosceles-ejemplos.svg)


    En un triángulo $\\triangle PQR$, los lados miden $\\overline{PQ} = 12\text{ cm}$,
    $\\overline{QR} = 12\text{ cm}$ y $\\overline{PR} = 7\text{ cm}$. Identifica cuál
    es la base y cuáles son los ángulos basales iguales.'
  pasos:
  - 'Paso 1: Identificar los dos lados congruentes: $\\overline{PQ} = \\overline{QR}
    = 12\text{ cm}$.'
  - 'Paso 2: Localizar el vértice común de los lados congruentes: es el vértice $Q$
    (vértice principal).'
  - 'Paso 3: Identificar el lado no congruente: es $\\overline{PR} = 7\text{ cm}$.'
  - 'Paso 4: Concluir que la base es el segmento $\\overline{PR}$.'
  - 'Paso 5: Los ángulos basales iguales son los adyacentes a la base: $\angle P$
    y $\angle R$ ($\angle QPR \\cong \angle QRP$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se identifica con certeza la base de un triángulo isósceles?
  choices:
  - text: Es el lado que une los dos ángulos de igual medida (opuesto al vértice principal)
    is_correct: true
  - text: Es siempre el lado que está dibujado en la parte inferior horizontal
    is_correct: false
  - text: Es el lado más largo obligatoriamente
    is_correct: false
  - text: Es cualquiera de los dos lados iguales
    is_correct: false
  explanation: En la definición geométrica, la base es el lado que une los dos ángulos
    de igual medida (opuesto al vértice principal).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en el triángulo DEF se cumple que DE = DF = 9 cm y EF = 5 cm, ¿cuál
    segmento es la base?
  choices:
  - text: El segmento EF (lado desigual opuesto al vértice D)
    is_correct: true
  - text: El segmento DE
    is_correct: false
  - text: El segmento DF
    is_correct: false
  - text: Ninguno, no es isósceles
    is_correct: false
  explanation: Como DE y DF son los lados congruentes, la base es el segmento EF (lado
    desigual opuesto al vértice D).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los dos lados de igual medida.'
- 'Paso 2: Determinar el vértice común donde se unen (vértice principal).'
- 'Paso 3: Declarar como base al segmento opuesto al vértice principal.'
- 'Paso 4: Identificar los ángulos basales en los extremos de dicha base.'
errores_correccion: 'No te guíes por la posición física del dibujo: la base es el
  lado opuesto al vértice de unión de los dos lados iguales.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un triángulo isósceles está dibujado con su base en posición vertical
    a la derecha, ¿sigue siendo la base?
  alternativas:
  - Sí, porque la base es una propiedad geométrica invariante ante rotaciones
  - No, la base debe ser horizontal
  - No, ahora es una altura
  respuesta: Sí, porque la base es una propiedad geométrica invariante ante rotaciones
  solucion_pasos:
  - La orientación en el papel no cambia las relaciones métricas del triángulo.
- titulo: Ejemplo 2
  enunciado: En el triángulo $\triangle ABC$, si $\angle A = \angle B = 65^\circ$,
    ¿cuál es la base?
  alternativas:
  - $\overline{AB}$
  - $\overline{BC}$
  - $\overline{AC}$
  respuesta: $\overline{AB}$
  solucion_pasos:
  - La base une los dos vértices cuyos ángulos son iguales ($A$ y $B$); por tanto,
    es $\overline{AB}$.
- titulo: ¿La base de un triángulo isósceles es el lado comprendido entre los dos
    ángulos iguales?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición geométrica euclidiana.
- titulo: ¿La base de un triángulo isósceles debe ser obligatoriamente horizontal?
  respuesta: 'No'
  solucion_pasos:
  - No, un triángulo puede rotarse libremente en el plano sin alterar cuál segmento
    es su base.
errores_frecuentes:
- Confundir la base geométrica con la base visual (línea inferior horizontal).
- Pensar que la base siempre debe ser menor que los lados laterales.
- Creer que al rotar un triángulo su base deja de ser la base.
- Confundir los ángulos basales con el ángulo del vértice principal.
- No identificar correctamente la base cuando el triángulo es obtusángulo isósceles.
afirmaciones_verdaderas:
- La base de un triángulo isósceles es el lado no necesariamente congruente.
- Los dos ángulos adyacentes a la base son siempre de igual medida.
al_terminar_debes_poder: '**QUÉ:** Identificar con precisión la base y los lados congruentes
  de cualquier triángulo isósceles.


  **CÓMO:** Reconociendo el lado que une los ángulos congruentes sin importar la orientación
  espacial de la figura.


  ![Resumen de Identificación de Base](/static/img/nodos/identificacion-de-la-base-en-un-triangulo-isosceles-resumen.svg)'
