semantic_id: MAT.ALG.INECUACIONES_LINEALES.EXPRESION_INTERVALO
resumen_inicial: Expresar la solución de una inecuación como intervalo requiere traducir la desigualdad despejada a la notación de corchetes reales.
explicacion_simple: '![Expresión del conjunto solución como intervalo](/static/img/nodos/expresion-del-conjunto-solucion-como-intervalo-intro.svg)


  Una vez que tenemos la desigualdad despejada (como $x \ge 3$), debemos escribirla en notación de intervalo entre corchetes.

  - Si $x > a \implies ]a, +\infty[$

  - Si $x \ge a \implies [a, +\infty[$

  - Si $x < b \implies ]-\infty, b[$

  - Si $x \le b \implies ]-\infty, b]$'
explicacion_formal: 'La **traducción estándar de soluciones inequivalentes a intervalos** mapea:


  $$x > a \iff S = ]a, +\infty[$$

  $$x \ge a \iff S = [a, +\infty[$$

  $$x < b \iff S = ]-\infty, b[$$

  $$x \le b \iff S = ]-\infty, b]$$'
definiciones_clave: '- **Formato de intervalo solución**: Representación compacta entre corchetes del conjunto $S \subset \mathbb{R}$.'
propiedades_relaciones: '- **Corchete del infinito**: El extremo infinito ($+\infty$ ó $-\infty$) lleva SIEMPRE corchete abierto.'
ejemplo_guiado:
  enunciado: '![Ejemplo Expresión del conjunto solución como intervalo](/static/img/nodos/expresion-del-conjunto-solucion-como-intervalo-ejemplos.svg)


    Expresa las soluciones deseadas $x > -2$ y $x \le 7$ en su formato de intervalo correspondiente.'
  pasos:
  - 'Paso 1: Para $x > -2$: inicia en $-2$ (excluido) y crece sin límite hasta $+\infty \implies S_1 = ]-2, +\infty[$.Paso 2: Para $x \le 7$: proviene desde $-\infty$ hasta $7$ (incluido) $\implies S_2 = ]-\infty, 7]$.Paso 3: Verificar que los infinitos lleven corchetes abiertos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión de intervalo para la desigualdad $x \le 7$?
  choices:
  - text: $]-\infty, 7]$
    is_correct: true
  - text: $]-\infty, 7[$
    is_correct: false
  - text: $[7, +\infty[$
    is_correct: false
  - text: $[-\infty, 7]$
    is_correct: false
  explanation: La alternativa correcta es '$]-\infty, 7]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al expresar la desigualdad $x > -2$ como intervalo, ¿cuál es la opción válida?
  choices:
  - text: $]-2, +\infty[$
    is_correct: true
  - text: $[-2, +\infty[$
    is_correct: false
  - text: $]-\infty, -2[$
    is_correct: false
  - text: $]-2, +\infty]$
    is_correct: false
  explanation: La alternativa correcta es '$]-2, +\infty[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar la desigualdad despejada.'
- 'Paso 2: Determinar si la solución tiene cota inferior o superior.'
- 'Paso 3: Colocar corchete cerrado en el número si es $\le$ ó $\ge$. Colocar abierto si es $<$ ó $>$.'
- 'Paso 4: Colocar $+\infty$ ó $-\infty$ con corchete abierto.'
errores_correccion: '- **Error común:** Poner corchete cerrado al infinito (escribir $]-\infty, 7]$ con $[-\infty$).

  - **Cómo corregirlo:** El infinito no es un número alcanzable, por lo que SIEMPRE lleva corchete abierto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- La solución de la inecuación $x > 5$ se traduce en notación de intervalo como el conjunto cerrado $[5, +\infty[$.
- El conjunto solución $x \le -2$ se expresa mediante el intervalo semiabierto $[-2, -\infty[$.
- Al representar soluciones de inecuaciones en intervalos, el símbolo de infinito se cierra con corchete $[$ o $]$.
- La inecuación $-1 \le x < 4$ se escribe en notación de intervalo como $]-1, 4]$.
- Traducir la solución $x < 3$ a intervalo produce el conjunto $]3, -\infty[$.
afirmaciones_verdaderas:
- Las desigualdades estrictas ($<, >$) se traducen a intervalos con corchetes abiertos ($], [$), mientras que ($\le, \ge$) usan corchetes cerrados ($[, ]$).
- El conjunto solución de $x \ge a$ se escribe como el intervalo $[a, +\infty[$.
al_terminar_debes_poder: '**QUÉ:** Expresar el conjunto solución de una inecuación en notación de intervalo.


  **CÓMO:** Mapeando la desigualdad resultante a corchetes reales ($]a, +\infty[$, $]-\infty, b]$) respetando la inclusión o exclusión de la frontera.


  ![Resumen Expresión del conjunto solución como intervalo](/static/img/nodos/expresion-del-conjunto-solucion-como-intervalo-resumen.svg)'
