semantic_id: MAT.ALG.INECUACIONES_LINEALES.EXPRESION_INTERVALO
resumen_inicial: 'Expresión del conjunto solución como intervalo: relaciones de orden,
  intervalos y resolución en Resolución de inecuaciones lineales.'
explicacion_simple: Una vez que resolvemos una inecuación lineal, el resultado nos
  indica un conjunto infinito de números que satisfacen la condición inicial. Aprender
  a expresar este rango como un intervalo es fundamental para comunicar la respuesta
  de forma estandarizada y compacta.
explicacion_formal: '### Definición formal

  Una inecuación lineal es una expresión de la forma $mx + n \ge 0$, donde $m, n \in
  \mathbb{R}$ y $m \neq 0$ (o utilizando otros símbolos de orden). Su solución es
  un conjunto $S \subseteq \mathbb{R}$. Dependiendo de la desigualdad resultante tras
  despejar $x$, el conjunto solución se denota mediante un intervalo que se extiende
  hasta el infinito positivo o negativo. Los símbolos de orden estricto ($<$ o $>$)
  generan intervalos abiertos denotados con paréntesis redondos, y los de orden no
  estricto ($\le$ o $\ge$) incluyen al extremo con un corchete recto cerrado.


  ### Desarrollo didáctico

  Despejar una inecuación lineal es muy similar a resolver una ecuación, con la salvedad
  de que multiplicar o dividir por un número negativo invierte el signo de la desigualdad.
  Por ejemplo, al llegar a la conclusión $x \ge 4$, leemos "todos los números mayores
  o iguales a $4$". Si representamos esto en la recta numérica, dibujaríamos un punto
  relleno en el $4$ y sombrearíamos todo hacia la derecha. La notación de intervalo
  resume ese dibujo como $[4, \infty)$. Si el resultado fuera $x < 4$, sería un círculo
  sin rellenar en el $4$ sombreado hacia la izquierda, denotado como $(-\infty, 4)$.'
definiciones_clave: '- **Expresión del conjunto solución como intervalo**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a expresión del conjunto solución como
  intervalo.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de expresión del
    conjunto solución como intervalo.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de expresión del conjunto solución como intervalo,
    invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
