semantic_id: MAT.ALG.INECUACIONES_LINEALES.EXPRESION_INTERVALO
resumen_inicial: Expresar la solución de una inecuación como intervalo requiere traducir
  la desigualdad despejada a la notación de corchetes reales.
explicacion_simple: 'Una vez que tenemos la desigualdad despejada (como $x \ge 3$),
  debemos escribirla en notación de intervalo entre corchetes.

  - Si $x > a \implies ]a, +\infty[$

  - Si $x \ge a \implies [a, +\infty[$

  - Si $x < b \implies ]-\infty, b[$

  - Si $x \le b \implies ]-\infty, b]$'
explicacion_formal: 'La **traducción estándar de soluciones inequivalentes a intervalos**
  mapea:


  $$x > a \iff S = ]a, +\infty[$$

  $$x \ge a \iff S = [a, +\infty[$$

  $$x < b \iff S = ]-\infty, b[$$

  $$x \le b \iff S = ]-\infty, b]$$'
definiciones_clave: '- **Formato de intervalo solución**: Representación compacta
  entre corchetes del conjunto $S \subset \mathbb{R}$.'
propiedades_relaciones: '- **Corchete del infinito**: El extremo infinito ($+\infty$
  ó $-\infty$) lleva SIEMPRE corchete abierto.'
ejemplo_guiado:
  enunciado: Expresa las soluciones deseadas $x > -2$ y $x \le 7$ en su formato de
    intervalo correspondiente.
  pasos:
  - 'Paso 1: Para $x > -2$: inicia en $-2$ (excluido) y crece sin límite hasta $+\infty
    \implies S_1 = ]-2, +\infty[$.Paso 2: Para $x \le 7$: proviene desde $-\infty$
    hasta $7$ (incluido) $\implies S_2 = ]-\infty, 7]$.Paso 3: Verificar que los infinitos
    lleven corchetes abiertos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión de intervalo para la desigualdad $x \le 7$?
  choices:
  - text: $]-\infty, 7]$
    is_correct: true
  - text: $]-\infty, 7[$
    is_correct: false
  - text: $[7, +\infty[$
    is_correct: false
  - text: $[-\infty, 7]$
    is_correct: false
  explanation: La alternativa correcta es '$]-\infty, 7]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al expresar la desigualdad $x > -2$ como intervalo, ¿cuál es la opción
    válida?
  choices:
  - text: $]-2, +\infty[$
    is_correct: true
  - text: $[-2, +\infty[$
    is_correct: false
  - text: $]-\infty, -2[$
    is_correct: false
  - text: $]-2, +\infty]$
    is_correct: false
  explanation: La alternativa correcta es '$]-2, +\infty[$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar la desigualdad despejada.'
- 'Paso 2: Determinar si la solución tiene cota inferior o superior.'
- 'Paso 3: Colocar corchete cerrado en el número si es $\le$ ó $\ge$. Colocar abierto
  si es $<$ ó $>$.'
- 'Paso 4: Colocar $+\infty$ ó $-\infty$ con corchete abierto.'
errores_correccion: '- **Error común:** Poner corchete cerrado al infinito (escribir
  $]-\infty, 7]$ con $[-\infty$).

  - **Cómo corregirlo:** El infinito no es un número alcanzable, por lo que SIEMPRE
  lleva corchete abierto.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de
    números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
- Olvidar invertir el sentido del símbolo de desigualdad al dividir o multiplicar
  por un coeficiente negativo.
- Confundir la solución de una inecuación con una solución puntual única propia de
  una ecuación.
- Multiplicar por el m.c.m. los términos fraccionarios pero omitir los términos enteros
  independientes.
- Poner corchete cerrado en las cotas infinitas $+\infty$ ó $-\infty$.
- Confundir una inecuación sin solución ($S = \emptyset$) con una que tiene solución
  real total ($S = \mathbb{R}$).
afirmaciones_verdaderas:
- Una inecuación lineal de primer grado es una desigualdad algebraica cuya solución
  se expresa comúnmente como un intervalo real.
- Si las variables se cancelan por completo y resulta una constante numérica verdadera,
  el conjunto solución abarca a todos los números reales ($S = \mathbb{R}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver analíticamente
  cualquier inecuación lineal, expresando su conjunto solución en notación de intervalo
  y gráfica.
fuente: Texto escolar MINEDUC — Álgebra / Inecuaciones Lineales
