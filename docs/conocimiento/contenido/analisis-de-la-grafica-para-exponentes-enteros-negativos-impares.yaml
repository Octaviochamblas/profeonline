semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.GRAFICA_NEGATIVO_IMPAR
resumen_inicial: 'El análisis de la gráfica para funciones potencia con exponente entero negativo impar $f(x) = \frac{a}{x^{2k+1}}$ ($k \in \mathbb{Z}^+, a \neq 0$) describe una hipérbola generalizada con dos ramas en cuadrantes alternos, simetría central respecto al origen $(0, 0)$, asíntota vertical $\mathcal{A}_V: x = 0$, asíntota horizontal $\mathcal{A}_H: y = 0$ y recorrido $\operatorname{Rec}(f) = \mathbb{R} \setminus \{0\}$.'
explicacion_simple: "![El análisis de la gráfica para funciones potencia con exponente entero negativo impar $f(x) = \\frac{a}{x^{2k+1}}$ ($k \\in \\mathbb{Z}^+, a \\neq 0$) describe una hipérbola generalizada con dos ramas en cuadrantes alternos, simetría central respecto al origen $(0, 0)$, asíntota vertical $\\mathcal{A}_V: x = 0$, asíntota horizontal $\\mathcal{A}_H: y = 0$ y recorrido $\\operatorname{Rec}(f) = \\mathbb{R} \\setminus \\{0\\}$](/static/img/nodos/analisis-de-la-grafica-para-exponentes-enteros-negativos-impares-intro.svg)\n\n\nCuando el exponente es un **número negativo IMPAR ($-1, -3, -5...$)**, la gráfica es la clásica **HIPÉRBOLA**:\n\n- **¿Cómo son sus dos ramas?**\n  - Están en **cuadrantes opuestos cruzados en diagonal**:\n  - Si $a > 0$ (como $1/x$): Una rama en el **cuadrante I** (arriba a la derecha) y la otra en el **cuadrante III** (abajo a la izquierda).\n  - Si $a < 0$ (como $-1/x$): Una rama en el **cuadrante II** y la otra en el **cuadrante IV**.\n- **Simetría\
  \ central:** Es **simétrica respecto al origen $(0, 0)$** ($f(-x) = -f(x)$).\n- **Asíntotas:** Las ramas se pegan al eje vertical $x = 0$ y al eje horizontal $y = 0$ sin tocarlos jamás."
explicacion_formal: "Sea $f: \\mathbb{R} \\setminus \\{0\\} \\to \\mathbb{R}$ definida por $f(x) = \\frac{a}{x^{2k+1}}$ con $k \\in \\mathbb{Z}^+$ y $a \\in \\mathbb{R}^*$.\n\n**Análisis de simetría y discontinuidad infinita**:\n1. **Imparidad central**:\n   $$f(-x) = \\frac{a}{(-x)^{2k+1}} = \\frac{a}{-x^{2k+1}} = -f(x) \\implies \\text{Simetría central respecto a } (0, 0)$$\n2. **Límites laterales opuestos en $x = 0$**:\n   $$\\lim_{x \\to 0^+} f(x) = +\\infty \\quad \\text{y} \\quad \\lim_{x \\to 0^-} f(x) = -\\infty \\quad (\\text{para } a > 0) \\implies \\mathcal{A}_V: x = 0$$\n3. **Límites en el infinito**:\n   $$\\lim_{x \\to \\pm\\infty} f(x) = 0 \\implies \\mathcal{A}_H: y = 0$$\n4. **Recorrido completo sin cero**:\n   $$\\operatorname{Rec}(f) = \\mathbb{R} \\setminus \\{0\\} = ]-\\infty, 0[ \\cup ]0, +\\infty[$$"
definiciones_clave: '- **Hipérbola generalizada**: Curva formada por dos ramas asintóticas simétricas respecto al origen.

  - **Discontinuidad esencial de salto infinito**: Ruptura total de la curva en $x = 0$ con límites laterales de signos opuestos.'
propiedades_relaciones: '- **Monotonía por ramas**: Para $a > 0$, la función es estrictamente decreciente en $]-\infty, 0[$ y decreciente en $]0, +\infty[$.

  - **Puntos pivote antípodas**: Pasa por $(1, a)$ y $(-1, -a)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la gráfica para funciones potencia con exponente entero negativo impar $f(x) = \frac{a}{x^{2k+1}}$ ($k \in \mathbb{Z}^+, a \neq 0$) describe una hipérbola generalizada con dos ramas en cuadrantes alternos, simetría central respecto al origen $(0, 0)$, asíntota vertical $\mathcal{A}_V: x = 0$, asíntota horizontal $\mathcal{A}_H: y = 0$ y recorrido $\operatorname{Rec}(f) = \mathbb{R} \setminus \{0\}$](/static/img/nodos/analisis-de-la-grafica-para-exponentes-enteros-negativos-impares-ejemplos.svg)



    Analiza la hipérbola cúbica $f(x) = \frac{1}{x^3}$:

    1) Evalúa en $x = -2, -1, -0{,}5, 0{,}5, 1, 2$.

    2) Describe la ubicación de sus ramas y sus asíntotas.

    3) Halla su dominio y recorrido.'
  pasos:
  - 'Paso 1: Puntos calculados:

    - $f(-2) = 1/(-8) = \mathbf{-0{,}125} \implies (-2; -0{,}125)$ (C III).

    - $f(-1) = 1/(-1) = \mathbf{-1} \implies (-1, -1)$.

    - $f(-0{,}5) = 1/(-0{,}125) = \mathbf{-8} \implies (-0{,}5; -8)$.

    - $f(0{,}5) = 1/0{,}125 = \mathbf{8} \implies (0{,}5; 8)$ (C I).

    - $f(1) = 1/1 = \mathbf{1} \implies (1, 1)$.

    - $f(2) = 1/8 = \mathbf{0{,}125} \implies (2; 0{,}125)$.'
  - 'Paso 2: Ramas en cuadrantes I y III; simétrica a $(0, 0)$. Asíntotas en $\mathcal{A}_V: x = 0$ y $\mathcal{A}_H: y = 0$.'
  - 'Paso 3: $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$ y $\operatorname{Rec}(f) = \mathbb{R} \setminus \{0\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué cuadrantes se ubican las ramas de la hipérbola $f(x) = -\frac{4}{x}$?
  choices:
  - text: Cuadrantes II y IV (debido al coeficiente negativo a = -4)
    is_correct: true
  - text: Cuadrantes I y III
    is_correct: false
  - text: Cuadrantes I y II
    is_correct: false
  - text: Cuadrantes III y IV
    is_correct: false
  explanation: La alternativa correcta es 'Cuadrantes II y IV (debido al coeficiente negativo a = -4)'. Al ser $a < 0$, si $x > 0 \implies y < 0$ (C IV) y si $x < 0 \implies y > 0$ (C II).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el recorrido de la función $f(x) = \frac{1}{x^3}$?
  choices:
  - text: ℝ \ {0} (todos los números reales excepto el cero)
    is_correct: true
  - text: ℝ (todos los reales)
    is_correct: false
  - text: ']0, +∞['
    is_correct: false
  - text: ']-∞, 0]'
    is_correct: false
  explanation: La alternativa correcta es 'ℝ \ {0} (todos los números reales excepto el cero)'. La función toma todos los valores positivos y negativos posibles, pero jamás se anula.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente entero negativo impar ($n = -1, -3, -5...$).'
- 'Paso 2: Trazar las rectas asíntotas $x = 0$ (eje $Y$) e $y = 0$ (eje $X$).'
- 'Paso 3: Si $a > 0$, graficar las ramas hiperbólicas en los cuadrantes I y III.'
- 'Paso 4: Si $a < 0$, graficar las ramas hiperbólicas en los cuadrantes II y IV con simetría central en $(0, 0)$.'
errores_correccion: '- **Error común:** Conectar las dos ramas de la hipérbola cruzando el origen $(0, 0)$.

  - **Cómo corregirlo:** Las ramas están **completamente separadas**: en $x = 0$ la función **NO EXISTE** y las ramas divergen a $+\infty$ y $-\infty$.'
ejemplos:
- titulo: 'Ejemplo 1: Cuadrantes canónicos'
  enunciado: 'La función $f(x) = \frac{10}{x}$ tiene sus ramas en los cuadrantes:'
  alternativas:
  - I y III
  - II y IV
  - I y II
  - III y IV
  respuesta: I y III
  solucion_pasos:
  - 'Paso 1: Impar negativo con $a = 10 > 0 \implies$ cuadrantes I y III.'
- titulo: 'Ejemplo 2: Simetría respecto al origen'
  enunciado: 'Si $(3, 2)$ pertenece a $f(x) = 6/x$, su punto simétrico antípoda es:'
  alternativas:
  - (-3, -2)
  - (-3, 2)
  - (3, -2)
  - (2, 3)
  respuesta: (-3, -2)
  solucion_pasos:
  - 'Paso 1: Simetría central $(x, y) \leftrightarrow (-x, -y) \implies (-3, -2)$.'
- titulo: 'Ejemplo 3: Límites laterales en el origen'
  enunciado: Para $f(x) = 1/x$, ¿cuánto vale $\lim_{x \to 0^-} f(x)$?
  alternativas:
  - -infinito
  - +infinito
  - '0'
  - '1'
  respuesta: -infinito
  solucion_pasos:
  - 'Paso 1: Por la izquierda de cero ($x < 0$), $1/x \to -\infty$.'
- titulo: 'Ejemplo 4: Recorrido hiperbólico'
  enunciado: 'El recorrido de $g(x) = -\frac{5}{x^5}$ es:'
  alternativas:
  - R \ {0}
  - R
  - ']0, +inf['
  - ']-inf, 0]'
  respuesta: R \ {0}
  solucion_pasos:
  - 'Paso 1: Toda hipérbola elemental impar tiene recorrido $\mathbb{R} \setminus \{0\}$.'
errores_frecuentes:
- Unir las ramas de la hipérbola a través del origen.
- Confundir la posición de cuadrantes entre a > 0 y a < 0.
- Asumir que el recorrido contiene al cero.
afirmaciones_verdaderas:
- Las funciones potencia con exponente negativo impar generan hipérbolas simétricas respecto al origen (0, 0).
- Presentan asíntotas ortogonales en x = 0 e y = 0, y su recorrido es ℝ \ {0}.
al_terminar_debes_poder: '**QUÉ:** Analizar y graficar funciones potencia con exponente entero negativo impar.


  **CÓMO:** Identificando la estructura hiperbólica en cuadrantes alternos, la simetría central y las asíntotas x = 0 e y = 0.


