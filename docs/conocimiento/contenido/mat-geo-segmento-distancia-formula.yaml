semantic_id: MAT.GEO.SEGMENTO_METRICA.DISTANCIA_DOS_PUNTOS
resumen_inicial: 'Fórmula de distancia entre dos puntos en el plano cartesiano: conceptos,
  teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: La distancia entre dos puntos en el plano se calcula igual que
  la hipotenusa de un triángulo rectángulo, usando el teorema de Pitágoras con las
  diferencias de coordenadas.
explicacion_formal: '![Fórmula de distancia entre dos puntos](/static/img/geometria/cartesiano-vectores/segmento-distancia-formula.svg)


  ### Definición formal


  La fórmula de distancia se deduce del teorema de Pitágoras: la diferencia de abscisas
  ($\Delta x=x_2-x_1$) y la diferencia de ordenadas ($\Delta y=y_2-y_1$) forman los
  catetos de un triángulo rectángulo, cuya hipotenusa es exactamente la distancia
  entre los puntos: $d(A,B)=\sqrt{(\Delta x)^2+(\Delta y)^2}$.


  ### Desarrollo didáctico


  En la figura, los puntos $A(-3,-2)$ y $B(4,3)$ forman, junto con el punto auxiliar
  $(4,-2)$, un triángulo rectángulo. Los catetos son $\Delta x=4-(-3)=7$ y $\Delta
  y=3-(-2)=5$, y la distancia $AB$ es la hipotenusa de ese triángulo.'
