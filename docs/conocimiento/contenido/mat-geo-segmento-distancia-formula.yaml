- titulo: ¿Se cumple siempre la propiedad principal de fórmula de distancia entre
    dos puntos en el plano cartesiano en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede fórmula de distancia entre dos puntos en el plano cartesiano asumir
