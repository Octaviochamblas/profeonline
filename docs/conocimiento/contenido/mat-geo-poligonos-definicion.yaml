semantic_id: MAT.GEO.POLIGONOS_BASE.DEFINICION_POLIGONO
resumen_inicial: 'Definición de polígono como figura plana cerrada formada por segmentos:
  conceptos, teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Antes de estudiar triángulos y cuadriláteros como casos particulares,
  es importante entender qué caracteriza en general a cualquier polígono.
explicacion_formal: '![Polígono: figura plana cerrada de segmentos](/static/img/geometria/poligonos-cuadrilateros/poligonos-definicion.svg)


  ### Definición formal


  Un polígono es una figura plana delimitada por una línea poligonal cerrada: una
  secuencia de segmentos de recta consecutivos donde el último segmento termina en
  el punto donde comenzó el primero, y ningún segmento se cruza con otro no adyacente.


  ### Desarrollo didáctico


  Un triángulo, un cuadrado y un pentágono son todos polígonos, con 3, 4 y 5 lados
  respectivamente. En cambio, una figura formada por una curva (como un círculo) o
  por segmentos que no cierran completamente no es un polígono.'
