semantic_id: MAT.NUM.DECIMAL_FRACCION.SEMIPERIODICO
resumen_inicial: Para convertir un decimal semiperiódico a fracción, el numerador
  es la resta del número sin coma menos la parte no periódica, y el denominador tiene
  tantos 9s como cifras del período seguidos de tantos 0s como cifras del anteperíodo.
explicacion_simple: 'Para convertir un decimal semiperiódico a fracción, el número
  de arriba se calcula restando el número completo sin coma menos todo lo que está
  antes de la barra. Abajo colocamos una combinación de nueves y ceros: tantos nueves
  como cifras tenga la barra, seguidos de tantos ceros como dígitos tenga el anteperíodo.'
explicacion_formal: 'Dado un decimal semiperiódico $d = a_0, c_1 \dots c_m \overline{p_1
  \dots p_k}$, su **Fracción Generatriz Semiperiódica** se obtiene mediante:


  $$d = \frac{N - NP}{\underbrace{99\dots9}_{k \text{ nueves}} \underbrace{00\dots0}_{m
  \text{ ceros}}}$$


  **Desglose de la fórmula:**

  - $N$: Número entero completo formado al omitir coma y barra ($a_0 c_1 \dots c_m
  p_1 \dots p_k$).

  - $NP$: Parte no periódica (entero formado por la parte entera y el anteperíodo
  $a_0 c_1 \dots c_m$).

  - $k$ nueves: Cantidad de dígitos bajo la barra del período.

  - $m$ ceros: Cantidad de dígitos del anteperíodo ubicados entre la coma y la barra.


  > **Complemento didáctico:** Los ceros del denominador representan la presencia
  del anteperíodo y equivalen al factor de potencia de 10 utilizado en la demostración
  algebraica.'
definiciones_clave: '- **Fracción generatriz de decimal semiperiódico**: Estructura
  de fracción $\frac{N - NP}{9\dots90\dots0}$ simplificada a su forma irreductible.'
propiedades_relaciones: '- **Estructura Mixta Denominadora**: Combina 9s (período)
  y 0s (anteperíodo) en el denominador.'
ejemplo_guiado:
  enunciado: Convierta el decimal semiperiódico $0,1666... = 0,1\overline{6}$ a fracción
    irreductible.
  pasos:
  - 'Paso 1: Identificar el número sin coma ni barra: $N = 16$.'
  - 'Paso 2: Identificar la parte no periódica (entero + anteperíodo): $NP = 1$.'
  - 'Paso 3: Restar en el numerador: $16 - 1 = 15$.'
  - 'Paso 4: Armar el denominador: $1$ cifra bajo la barra (un $9$) y $1$ cifra en
    anteperíodo (un $0$) $\implies 90$.'
  - 'Paso 5: Formar la fracción generatriz: $\frac{15}{90}$.'
  - 'Paso 6: Simplificar dividiendo entre $15$: $\frac{15 : 15}{90 : 15} = \frac{1}{6}$.'
  - 'Conclusión: $0,1\overline{6} = \frac{1}{6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se forma el denominador de la fracción generatriz de un decimal
    semiperiódico?
  choices:
  - text: Tantos 9s como cifras tenga el período seguidos de tantos 0s como cifras
      tenga el anteperíodo
    is_correct: true
  - text: Solo nueves sin ningún cero
    is_correct: false
  - text: Solo ceros seguidos de nueves
    is_correct: false
  - text: Una potencia de 10 pura
    is_correct: false
  explanation: La alternativa correcta es 'Tantos 9s como cifras tenga el período
    seguidos de tantos 0s como cifras tenga el anteperíodo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: "En el ejemplo guiado para 0,1\bar{6}, ¿cuál fue la fracción irreductible\
    \ obtenida?"
  choices:
  - text: 1/6
    is_correct: true
  - text: 15/90
    is_correct: false
  - text: 16/90
    is_correct: false
  - text: 1/9
    is_correct: false
  explanation: La alternativa correcta es '1/6'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Restar en el numerador el número completo sin coma ni barra menos la parte
  no periódica ($N - NP$).'
- 'Paso 2: Construir el denominador escribiendo tantos 9s como cifras tenga el período
  seguidos de tantos 0s como cifras tenga el anteperíodo.'
- 'Paso 3: Simplificar la fracción hasta su forma irreductible.'
errores_correccion: '- **Error 1: Restar solo la parte entera en lugar de toda la
  parte no periódica.** **Cómo corregirlo:** Se debe restar la parte entera JUNTO
  al anteperíodo ($NP$).


  - **Error 2: Invertir el orden de nueves y ceros en el denominador (poner ceros
  antes que los nueves).** **Cómo corregirlo:** Los nueves van SIEMPRE primero a la
  izquierda y los ceros van después a la derecha ($99..00..$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Convierta $0,4\overline{6}$ a fracción irreductible.
  alternativas:
  - 7/15
  - 42/90
  - 46/90
  respuesta: 7/15
  solucion_pasos:
  - 'Numerador: $46 - 4 = 42$. Denominador: $90$. Fracción: $42/90 = 7/15$.'
- titulo: Ejemplo 2
  enunciado: Convierta $1,2\overline{3}$ a fracción.
  alternativas:
  - 37/30
  - 111/90
  - 123/90
  respuesta: 37/30
  solucion_pasos:
  - 'Numerador: $123 - 12 = 111$. Denominador: $90 \implies 111/90 = 37/30$.'
- titulo: ¿Es 0,0\overline{5} igual a 1/18?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(5-0)/90 = 5/90 = 1/18$.
- titulo: ¿Se escriben los ceros a la derecha de los nueves en el denominador semiperiódico?
  respuesta: Sí
  solucion_pasos:
  - Sí, la estructura es $99..00..$.
errores_frecuentes:
- Restar únicamente la parte entera en el numerador ignorando las cifras del anteperíodo.
- Colocar los ceros antes que los nueves en el denominador de la fracción generatriz.
- Contar las cifras de la parte entera para definir el número de ceros del denominador.
- El número decimal $0,1\overline{6}$ equivale a la fracción $16/90$.
- Los decimales semiperiódicos no pueden simplificarse a fracciones irreductibles.
afirmaciones_verdaderas:
- Para convertir un decimal semiperiódico a fracción se resta $N - NP$ en el numerador.
- El denominador contiene tantos nueves como cifras periódicas seguidos de tantos
  ceros como cifras anteperiódicas.
al_terminar_debes_poder: Al terminar serás capaz de convertir cualquier decimal semiperiódico
  a su fracción generatriz irreductible, restando la parte no periódica y estructurando
  el denominador con nueves y ceros.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
