semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.CONCEPTO
resumen_inicial: El máximo común divisor (M.C.D.) de dos o más enteros es el mayor entero positivo que los divide a todos exactamente sin residuo.
explicacion_simple: 'El máximo común divisor representa el tamaño más grande posible que podemos usar para dividir o agrupar varias cantidades diferentes en partes exactamente iguales sin que sobre nada. Por ejemplo, al cortar dos piezas de tela de distinto largo en tiras iguales lo más grandes posible, la longitud buscada es el M.C.D.


  ![Concepto de máximo común divisor](/static/img/nodos/concepto-de-maximo-comun-divisor-intro.svg)'
explicacion_formal: 'Para un conjunto de enteros $a_1, a_2, \ldots, a_k \in \mathbb{Z} \setminus \{0\}$, el **Máximo Común Divisor** $\operatorname{MCD}(a_1, \dots, a_k)$ se define formalmente como:


  $$\operatorname{MCD}(a_1, \dots, a_k) = \max \left( \bigcap_{i=1}^k D^+(a_i) \right)$$


  **Desglose de la fórmula:**

  - $D^+(a_i)$: Conjunto finito de los divisores enteros positivos del número $a_i$.

  - $\bigcap_{i=1}^k$: Intersección de los conjuntos de divisores (divisores comunes a todos).

  - $\max(\dots)$: Selección del mayor entero positivo de dicha intersección.


  > **Complemento didáctico:** El M.C.D. es como mínimo igual a 1 (para números sin divisores primos compartidos) y como máximo igual al menor de los números dados.'
definiciones_clave: '- **Máximo común divisor (M.C.D.)**: El mayor divisor compartido que divide exactamente a varios enteros.

  - **Intersección de divisores**: Colección de factores que dividen simultáneamente a todas las cantidades.'
propiedades_relaciones: '- **Acotamiento superior**: $\operatorname{MCD}(a, b) \le \min(|a|, |b|)$.

  - **Identidad de Bezout**: Existen enteros $x, y$ tales que $a x + b y = \operatorname{MCD}(a, b)$.'
ejemplo_guiado:
  enunciado: 'Halle el máximo común divisor entre $12$ y $18$ comparando sus divisores positivos.


    ![Ejemplo Concepto de máximo común divisor](/static/img/nodos/concepto-de-maximo-comun-divisor-ejemplos.svg)'
  pasos:
  - 'Paso 1: Obtener divisores de 12: $D^+(12) = \{1, 2, 3, 4, 6, 12\}$.'
  - 'Paso 2: Obtener divisores de 18: $D^+(18) = \{1, 2, 3, 6, 9, 18\}$.'
  - 'Paso 3: Intersectar los divisores comunes: $D^+(12) \cap D^+(18) = \{1, 2, 3, 6\}$.'
  - 'Paso 4: Seleccionar el mayor divisor común: $\max(\{1, 2, 3, 6\}) = 6$.'
  - 'Conclusión: $\operatorname{MCD}(12, 18) = 6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa el máximo común divisor de dos enteros a y b?
  choices:
  - text: El mayor entero positivo que divide exactamente tanto a a como a b
    is_correct: true
  - text: La suma de a + b
    is_correct: false
  - text: El menor múltiplo positivo común
    is_correct: false
  - text: El producto a · b
    is_correct: false
  explanation: La alternativa correcta es 'El mayor entero positivo que divide exactamente tanto a a como a b'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado entre 12 y 18, ¿cuál fue el mayor divisor común obtenido?
  choices:
  - text: '6'
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '12'
    is_correct: false
  - text: '36'
    is_correct: false
  explanation: La alternativa correcta es '6'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la lista de divisores de cada uno de los números dados.'
- 'Paso 2: Encontrar los divisores en los que coinciden todas las listas.'
- 'Paso 3: Seleccionar el divisor más grande de la intersección común como el $\operatorname{MCD}$.'
errores_correccion: '- **Error 1: Confundir el M.C.D. con el m.c.m. calculando un número más grande.** **Cómo corregirlo:** El M.C.D. es un DIVISOR, por lo que es MENOR o igual que el menor de los números dados.


  - **Error 2: Pensar que si los números son impares el M.C.D. no existe.** **Cómo corregirlo:** El M.C.D. siempre existe y vale al menos 1.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el M.C.D. entre 20 y 30.
  alternativas:
  - '10'
  - '60'
  - '5'
  respuesta: '10'
  solucion_pasos:
  - 'Divisores de 20: 1, 2, 4, 5, 10, 20. Divisores de 30: 1, 2, 3, 5, 6, 10, 15, 30. MCD = 10.'
- titulo: Ejemplo 2
  enunciado: Queremos cortar dos cuerdas de 15 m y 25 m en trozos iguales del mayor tamaño posible. ¿Cuánto medirá cada trozo?
  alternativas:
  - 5 metros
  - 75 metros
  - 15 metros
  respuesta: 5 metros
  solucion_pasos:
  - $\operatorname{MCD}(15, 25) = 5$ metros.
- titulo: ¿El M.C.D. de cualquier pareja de números enteros es siempre mayor o igual a 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, el 1 es divisor universal de todos los enteros.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al mayor divisor común obtenido mediante el algoritmo correspondiente.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo del MCD entrega un valor entero único bien determinado.
  - texto: No es posible calcularlo con los métodos estándar
    es_correcta: false
    retroalimentacion: Incorrecto, los métodos de listas, tabla común, potencias primas y algoritmo de Euclides son deterministas y exactos.
- titulo: ¿Puede el M.C.D. de 8 y 12 ser igual a 24?
  respuesta: 'No'
  solucion_pasos:
  - No, 24 es un múltiplo (m.c.m.), el M.C.D. debe ser menor o igual a 8 ($MCD=4$).
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al mayor divisor común obtenido mediante el algoritmo correspondiente.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo del MCD entrega un valor entero único bien determinado.
  - texto: No es posible calcularlo con los métodos estándar
    es_correcta: false
    retroalimentacion: Incorrecto, los métodos de listas, tabla común, potencias primas y algoritmo de Euclides son deterministas y exactos.
errores_frecuentes:
- El máximo común divisor de dos números enteros puede ser un valor mayor que ambos números.
- El número cero se clasifica como el máximo común divisor de los enteros positivos.
- Dos números enteros impares no poseen ningún divisor común en la recta numérica.
- El máximo común divisor es equivalente a la suma de los factores primos no comunes.
- El M.C.D. de dos números primos distintos da como resultado cero.
afirmaciones_verdaderas:
- El máximo común divisor es el mayor entero positivo que divide exactamente a dos o más números.
- El M.C.D. de cualquier pareja de enteros positivos es siempre menor o igual que el menor de ellos.
al_terminar_debes_poder: "**QUÉ:** Definir y comprender formalmente el concepto de máximo común divisor (MCD) de dos o más números naturales.\n\n**CÓMO:** Identificando el mayor número natural que divide exactamente a los términos dados simultáneamente ($\text{mcd}(a, b) = \\max(D(a) \\cap D(b))$) y aplicando las propiedades $1 \\le \text{mcd}(a, b) \\le \\min(a, b)$ y $\text{mcd}(a, b) \\cdot \text{mcm}(a, b) = a \\cdot b$.\n\n![Resumen Concepto de máximo común divisor](/static/img/nodos/concepto-de-maximo-comun-divisor-resumen.svg)"
