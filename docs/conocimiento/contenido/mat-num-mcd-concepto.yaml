semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.CONCEPTO
resumen_inicial: "El Máximo Común Divisor (MCD) de dos o más números enteros es el mayor número que los divide a todos de forma exacta."
explicacion_simple: |
  Imagina que tienes 12 chocolates de frutilla y 18 de vainilla, y quieres armar bolsas de
  regalo sin mezclar sabores ni que sobre ningún chocolate. Necesitas encontrar un número
  que divida exactamente a 12 y a 18; y si quieres el mayor número posible de bolsas,
  necesitas el mayor divisor que tengan en común. Ese número especial es el MCD.
explicacion_formal: |
  El **Máximo Común Divisor (MCD)** de un conjunto de números es el mayor de sus divisores
  comunes positivos. Por ejemplo, para $12$ y $18$: divisores de $12=\{1,2,3,4,6,12\}$,
  divisores de $18=\{1,2,3,6,9,18\}$; los comunes son $\{1,2,3,6\}$, y el mayor es $6$, por
  lo que $\text{MCD}(12,18)=6$. Si $a$ es divisor de $b$, entonces $\text{MCD}(a,b)=a$.
definiciones_clave: |
  **Divisor común**: número que divide exactamente a dos o más números a la vez. El MCD es
  el mayor de esos divisores comunes.
propiedades_relaciones: |
  El MCD de cualquier par de números naturales siempre existe y es al menos 1. El MCD de
  dos números primos distintos es siempre 1.
ejemplo_guiado:
  enunciado: "Encuentra el MCD entre 10 y 15."
  pasos:
    - 'Divisores de 10: $\{1,2,5,10\}$. Divisores de 15: $\{1,3,5,15\}$.'
    - 'Divisores comunes: $\{1,5\}$.'
    - 'Conclusión: el mayor es 5, por lo que $\text{MCD}(10,15)=5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué es el Máximo Común Divisor de dos números?"
    choices:
      - {text: "El mayor de los divisores comunes a ambos números", is_correct: true}
      - {text: "El menor múltiplo común a ambos números", is_correct: false}
      - {text: "La suma de los divisores comunes", is_correct: false}
      - {text: "El producto de ambos números", is_correct: false}
    explanation: "La correcta es El mayor de los divisores comunes a ambos números: esa es la definición del MCD."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el MCD entre 6 y 18?"
    choices:
      - {text: "6, porque 6 es divisor de 18", is_correct: true}
      - {text: "18, el mayor de los dos números", is_correct: false}
      - {text: "1, porque no comparten factores", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 6, porque 6 es divisor de 18: cuando un número es divisor del otro, ese menor número es directamente el MCD."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identifica los números a los cuales deseas calcularles el Máximo Común Divisor (MCD).'
  - 'Paso 2: Encuentra los divisores comunes de dichos números (números que los dividen a todos de manera exacta).'
  - 'Paso 3: Identifica cuál es el mayor de todos esos divisores comunes. Ese valor es el MCD.'
errores_correccion: |
  Un error frecuente es confundir el MCD con el MCM, buscando un número mayor que los
  originales en vez de un divisor. Otro error es olvidar que el MCD siempre debe ser menor
  o igual al menor de los números dados.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Encuentra el Máximo Común Divisor (MCD) entre $8$ y $12$.
    alternativas:
      - "4"
      - "2"
      - "24"
    respuesta: "4"
    solucion_pasos:
      - 'Paso a: Listamos los divisores de $8$: $\{1, 2, 4, 8\}$.'
      - 'Paso b: Listamos los divisores de $12$: $\{1, 2, 3, 4, 6, 12\}$.'
      - 'Paso c: Buscamos los divisores que tienen en común: $\{1, 2, 4\}$.'
      - 'Paso d: Seleccionamos el mayor de ellos, que es $4$. Por lo tanto, $\text{MCD}(8, 12) = 4$.'
  - titulo: Ejemplo 2
    enunciado: Encuentra el MCD entre $15$ y $20$.
    alternativas:
      - "5"
      - "1"
      - "300"
    respuesta: "5"
    solucion_pasos:
      - 'Paso a: Listamos los divisores de $15$: $\{1, 3, 5, 15\}$.'
      - 'Paso b: Listamos los divisores de $20$: $\{1, 2, 4, 5, 10, 20\}$.'
      - 'Paso c: Buscamos los divisores comunes, los cuales son $\{1, 5\}$.'
      - 'Paso d: El mayor de los divisores comunes es $5$. Por lo tanto, $\text{MCD}(15, 20) = 5$.'
  - titulo: '¿Es el Máximo Común Divisor (MCD) de $9$ y $15$ igual a $3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Los divisores de $9$ son $\{1, 3, 9\}$.'
      - 'Los divisores de $15$ son $\{1, 3, 5, 15\}$.'
      - 'Los divisores en común son $\{1, 3\}$, y el mayor es $3$. Por ende, $\text{MCD}(9, 15) = 3$.'
  - titulo: '¿El Máximo Común Divisor de $6$ y $18$ es $18$?'
    respuesta: 'No'
    solucion_pasos:
      - 'El número $18$ es divisor de $18$, pero no divide de manera exacta a $6$ (ya que $18 > 6$).'
      - 'De hecho, como $6$ divide a $18$, el $\text{MCD}(6, 18) = 6$.'
errores_frecuentes:
  - Confundir el MCD con el Mínimo Común Múltiplo (MCM), buscando un número más grande que los originales en lugar de un divisor.
  - Pensar que el MCD de dos números siempre debe ser un número primo.
  - Creer que el MCD puede ser mayor que el menor de los números dados (el MCD siempre es menor o igual al menor de los números).
  - Olvidar que el 1 es siempre un divisor común de todos los números naturales.
  - No considerar que el MCD debe dividir a todos los números del conjunto simultáneamente, no solo a algunos de ellos.
afirmaciones_verdaderas:
  - "El MCD siempre es menor o igual que el menor de los números comparados."
  - "El MCD entre 8 y 12 es 4."
al_terminar_debes_poder: |
  Definir el concepto de Máximo Común Divisor y calcularlo por comparación de divisores
  comunes.
fuente: Teoría de Números
estado: publicado
