semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.CRECIMIENTO_POLINOMIAL
resumen_inicial: 'Interpretación de crecimiento polinomial mediante funciones potencia
  de exponente positivo: forma general $f(x) = a x^n$, simetría, dominio y recorrido
  en Modelamiento y aplicaciones en contexto.'
explicacion_simple: Cuando una cantidad depende de otra elevada a una potencia positiva,
  como el área o el volumen, pequeños aumentos de la variable independiente producen
  aumentos mucho mayores en el resultado.
explicacion_formal: '### Definición formal


  En un modelo $y=a\cdot x^n$ con $a>0$ y $n$ entero positivo, la magnitud $y$ crece
  sin límite a medida que $x$ aumenta, y la rapidez de ese crecimiento también aumenta
  (para $n\geq2$), a diferencia de un crecimiento lineal donde la rapidez es constante.


  ### Desarrollo didáctico


  Si el costo de producción depende del cuadrado de las unidades fabricadas, $C(x)=2x^2$:
  al pasar de $10$ a $20$ unidades, el costo pasa de $200$ a $800$, cuadruplicándose
  en vez de duplicarse, como ocurriría en un modelo lineal.'
definiciones_clave: '- **Interpretación de crecimiento polinomial mediante funciones
  potencia de exponente positivo**: Función de la forma $f(x) = a x^n$ con $a \neq
  0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a interpretación de crecimiento polinomial mediante funciones
  potencia de exponente positivo.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de interpretación de crecimiento polinomial mediante funciones potencia de exponente
    positivo.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de interpretación de crecimiento
    polinomial mediante funciones potencia de exponente positivo.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
