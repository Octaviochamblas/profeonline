procedimiento:
- 'Paso 1: Identifica el modelo $y=a\cdot x^n$ que describe la situación.'
- 'Paso 2: Evalúa el modelo en los valores de $x$ requeridos por el problema.'
- 'Paso 3: Interpreta el resultado en el contexto original, prestando atención a la
  rapidez de crecimiento.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en interpretación de crecimiento polinomial mediante funciones potencia
  de exponente positivo.
ejemplos:
- titulo: Interpretación de un modelo de área
  enunciado: Si el área de un terreno cuadrado es $A(x)=x^2$, ¿cuánto aumenta el área
    al duplicar el lado?
  solucion_pasos:
  - Se comparan $A(x)$ y $A(2x)=(2x)^2=4x^2$.
  - El área se cuadruplica, no se duplica, al duplicar el lado.
- titulo: Cálculo directo en un modelo de crecimiento
  enunciado: Con $C(x)=3x^2$, calcula el costo para $x=5$ unidades.
  solucion_pasos:
  - Se evalúa $C(5)=3\cdot25=75$.
  - El costo para $5$ unidades es $75$.
- titulo: ¿Un modelo con $n=1$ describe un crecimiento polinomial de orden superior?
  enunciado: ¿El modelo $y=a\cdot x^1$ (lineal) es un ejemplo de crecimiento polinomial
    de orden superior?
  respuesta: 'No'
  solucion_pasos:
  - Con $n=1$, la relación es lineal, sin la aceleración característica de exponentes
    mayores.
- titulo: ¿Duplicar $x$ siempre duplica el resultado en un modelo $y=a\cdot x^n$ con
    $n>1$?
  enunciado: ¿Duplicar la variable independiente $x$ siempre duplica el valor de $y$
    en un modelo con $n>1$?
  respuesta: 'No'
  solucion_pasos:
  - El resultado se multiplica por $2^n$, no solo por $2$, cuando $n>1$.
errores_frecuentes:
- Suponer que duplicar $x$ siempre duplica el resultado, ignorando el efecto del exponente.
- Confundir el crecimiento polinomial con el crecimiento exponencial.
- No verificar las unidades correctas al interpretar el resultado en el contexto real.
- Aplicar el modelo fuera de su dominio de validez física (por ejemplo, con valores
  negativos sin sentido).
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  interpretación de crecimiento polinomial mediante funciones potencia de exponente
  positivo.
