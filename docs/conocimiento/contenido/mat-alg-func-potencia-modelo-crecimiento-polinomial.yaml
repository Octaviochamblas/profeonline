semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.CRECIMIENTO_POLINOMIAL
resumen_inicial: 'El crecimiento polinomial descrito por funciones potencia de exponente entero positivo $f(x) = a x^n$ ($n \ge 2$) genera un incremento acelerado de la salida proporcionales a la potencia del insumo.'
explicacion_simple: |
  En el crecimiento polinomial o de potencia (como $y = x^2$ o $y = x^3$), al aumentar la variable independiente, las salidas no crecen de forma pareja como en una recta, sino que crecen cada vez más rápido. Sin embargo, a largo plazo, el crecimiento polinomial es más moderado y predecible que el crecimiento exponencial. Por ejemplo, al duplicar la velocidad de un auto, la distancia de frenado (que depende de $v^2$) no se duplica, sino que se cuadruplica ($2^2 = 4$).
explicacion_formal: |
  ### Definición formal
  El **crecimiento polinomial de una función potencia** $f(x) = a x^n$ con $a > 0$ y exponente entero positivo **$n \ge 2$** se define analíticamente por la tasa de cambio acelerada positiva:
  $$\frac{df}{dx} = n a x^{n-1} > 0 \quad \text{y} \quad \frac{d^2f}{dx^2} = n(n-1) a x^{n-2} > 0 \quad (\text{para } x > 0)$$

  ### Jerarquía Asintótica de Crecimiento
  Para valores muy grandes de la variable independiente ($x \to +\infty$), la velocidad de crecimiento respeta la jerarquía estricta:
  $$\text{Crecimiento Lineal } (x) \ll \text{Crecimiento Polinomial } (x^2 \ll x^3 \ll x^n) \ll \text{Crecimiento Exponencial } (b^x)$$
  demostrado por el límite de razones $\lim_{x \to +\infty} \frac{x^n}{b^x} = 0$ (para $b > 1$).

  ### Síntesis didáctica
  Diferencia de crecimiento por tasa de variación:
  - Crecimiento Lineal: Tasa de cambio constante ($\Delta y$ fijo).
  - Crecimiento Polinomial ($x^n$): Tasa de cambio creciente proporcional a $x^{n-1}$.
  - Crecimiento Exponencial ($b^x$): Tasa de cambio proporcional a la función misma ($y$).
definiciones_clave: |
  - **Crecimiento polinomial**: Incremento de salida de tasa acelerada gobernado por la potencia $x^n$.
  - **Efecto cuadrático $x^2$**: Cuadruplicación de la salida al duplicar la entrada ($2^2 = 4$).
  - **Efecto cúbico $x^3$**: Octuplicación de la salida al duplicar la entrada ($2^3 = 8$).
propiedades_relaciones: |
  - **Comportamiento en el intervalo $]0, 1[$**: Cerca del origen, las potencias de mayor grado $x^3$ crecen **más lento** que $x^2$ ($x^3 < x^2$ para $x \in ]0, 1[$).
  - **Dominancia en el infinito**: Para $x > 1$, las potencias mayores superan y crecen **más rápido** que las potencias menores ($x^3 > x^2$ para $x > 1$).
ejemplo_guiado:
  enunciado: 'Un modelo de distancia de frenado de un vehículo en metros viene dado por la función potencia cuadrática $d(v) = 0.01 v^2$, donde $v$ es la velocidad en km/h. Calcula la distancia de frenado a $50$ km/h y a $100$ km/h, y analiza cómo influye el crecimiento polinomial al duplicar la velocidad.'
  pasos:
    - 'Paso 1: Evaluamos a $v = 50$: $d(50) = 0.01 (50)^2 = 0.01(2500) = 25$ metros.'
    - 'Paso 2: Evaluamos a $v = 100$: $d(100) = 0.01 (100)^2 = 0.01(10000) = 100$ metros.'
    - 'Paso 3: Calculamos la razón de distancias: $\frac{d(100)}{d(50)} = \frac{100}{25} = 4$.'
    - 'Paso 4: Conclusión: Al duplicar la velocidad ($50 \to 100$), la distancia de frenado no se duplica, sino que se cuadruplica ($2^2 = 4$), debido al crecimiento polinomial cuadrático.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se compara el comportamiento a largo plazo ($x \to +\infty$) del crecimiento polinomial $y = x^3$ con el crecimiento exponencial $y = 2^x$?'
    choices:
      - {text: 'A largo plazo, el crecimiento exponencial $2^x$ supera y crece infinitamente más rápido que el crecimiento polinomial $x^3$', is_correct: true}
      - {text: 'El crecimiento polinomial $x^3$ crece más rápido que el exponencial $2^x$', is_correct: false}
      - {text: 'Ambos crecimientos avanzan a la misma velocidad constante', is_correct: false}
      - {text: 'El crecimiento polinomial se detiene en una asíntota horizontal', is_correct: false}
    explanation: 'La alternativa correcta es ''A largo plazo, el crecimiento exponencial $2^x$ supera y crece infinitamente más rápido que el crecimiento polinomial $x^3$''. La jerarquía analítica establece que los modelos exponenciales dominan sobre los polinomiales.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En un modelo de volumen $V(s) = s^3$, si la arista de un cubo $s$ se triplica ($s \to 3s$), ¿cuántas veces aumenta el volumen resultante?'
    choices:
      - {text: 'Aumenta $27$ veces su valor inicial, pues $3^3 = 27$', is_correct: true}
      - {text: 'Aumenta $3$ veces su valor inicial', is_correct: false}
      - {text: 'Aumenta $9$ veces su valor inicial', is_correct: false}
      - {text: 'Aumenta $6$ veces su valor inicial', is_correct: false}
    explanation: 'La alternativa correcta es ''Aumenta $27$ veces su valor inicial, pues $3^3 = 27$''. En la potencia cúbica, el factor de escala 3 se eleva al cubo dando $3^3 = 27$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el exponente entero positivo $n \ge 2$ en la función potencia $f(x) = a x^n$.'
  - 'Paso 2: Reconocer que la velocidad de variación crece de forma acelerada con la variable $x$.'
  - 'Paso 3: Calcular el factor de amplificación de salida $c^n$ al multiplicar la entrada por un factor $c$.'
  - 'Paso 4: Distinguir este crecimiento del comportamiento de modelos de tasa constante (lineales) o de base constante (exponenciales).'
errores_correccion: |
  - **Error 1:** Asumir que si la entrada se duplica en un modelo cuadrático $y = x^2$, la salida también se duplica. **Cómo corregirlo:** La duplicación de la entrada produce una cuadruplicación de la salida ($2^2 = 4$). La duplicación directa sólo ocurre en modelos lineales.
  - **Error 2:** Creer que las funciones potencia de mayor exponente (ej: $x^3$) son mayores que las de menor exponente (ej: $x^2$) en todo el dominio. **Cómo corregirlo:** En el intervalo entre 0 y 1 ($0 < x < 1$), las potencias mayores producen valores **menores** (ej: $0.5^3 = 0.125 < 0.5^2 = 0.25$). La dominancia de $x^3 > x^2$ ocurre recién para $x > 1$.
ejemplos:
  - titulo: 'Escalamiento cuadrático de área'
    enunciado: 'En $A(s) = s^2$, ¿si la arista $s$ se duplica, el área aumenta 4 veces?'
    alternativas:
      - 'Sí, por el factor $2^2 = 4$'
      - 'No, aumenta 2 veces'
      - 'No, aumenta 8 veces'
    respuesta: 'Sí, por el factor $2^2 = 4$'
    solucion_pasos:
      - '1. $A(2s) = (2s)^2 = 4s^2 = 4 A(s)$.'
      - '2. El área se cuadruplica.'
  - titulo: 'Crecimiento en el intervalo cero a uno'
    enunciado: 'Para $x = 0.1$, ¿$x^3$ es menor que $x^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $0.1^3 = 0.001$ y $0.1^2 = 0.01 \implies 0.001 < 0.01$.'
  - titulo: 'Escalamiento cúbico de masa'
    enunciado: 'Si la masa de un objeto es proporcional a $r^3$, ¿al duplicar el radio la masa se octuplica?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $2^3 = 8 \implies$ la masa se multiplica por 8.'
  - titulo: 'Comparación con modelo lineal'
    enunciado: '¿La tasa de cambio de $f(x) = x^2$ aumenta a medida que $x$ crece?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Su derivada $f''(x) = 2x$ aumenta continuamente, a diferencia del modelo lineal de tasa fija.'
errores_frecuentes:
  - 'En un modelo de crecimiento cuadrático $y = x^2$, duplicar la variable independiente duplica la salida.'
  - 'El crecimiento polinomial de grado 3 es superior al crecimiento exponencial $2^x$ para valores gigantes de $x$.'
  - 'Para cualquier valor de $x > 0$, la función $y = x^3$ entrega valores mayores que $y = x^2$.'
  - 'El crecimiento polinomial presenta una tasa de cambio constante en todos los puntos.'
  - 'Triplicar la arista en un modelo de volumen cuadrático multiplica el resultado por 27.'
afirmaciones_verdaderas:
  - 'El crecimiento polinomial en funciones potencia $f(x) = a x^n$ ($n \ge 2$) genera tasas de cambio aceleradas donde duplicar la entrada multiplica la salida por $2^n$.'
  - 'Aunque el crecimiento polinomial es más veloz que el lineal, es asintóticamente superado por el crecimiento exponencial a largo plazo.'
