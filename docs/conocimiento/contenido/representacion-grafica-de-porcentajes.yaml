semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_GRAFICA
resumen_inicial: 'La representación gráfica de un porcentaje visualiza la proporción $p\%$ mediante una cuadrícula de $10 \times 10$ (100 cuadritos), un gráfico de sectores circulares o una barra dividida.'
explicacion_simple: |
  Para ver un porcentaje con tus propios ojos, la forma más fácil es usar una cuadrícula de 100 cuadritos (10 filas por 10 columnas). Si quieres pintar el $25\%$, pintas exactamente $25$ cuadritos de los $100$. En un gráfico circular (de torta), el círculo completo es el $100\%$ ($360^\circ$); para representar el $50\%$, pintas la mitad exacta del círculo ($180^\circ$).
explicacion_formal: |
  ### Definición formal
  La **representación gráfica de un porcentaje $p\%$** es la visualización geométrica del área ocupada por la fracción $\frac{p}{100}$ respecto al área total de una figura geométrica patrón arbitraria tomada como $100\%$ ($A_{\text{total}} = 1$).

  ### Principales formatos gráficos
  1. **Cuadrícula de $10 \times 10$ (Gráfico de 100 cuadrados)**:
     - El área total consta de $100$ cuadritos congruentes.
     - Se colorean exactamente $p$ cuadritos.
  2. **Gráfico de sectores circulares (Gráfico de Torta)**:
     - El círculo completo representa el $100\%$ y su ángulo central total es $\theta_{\text{total}} = 360^\circ$.
     - El ángulo del sector de $p\%$ se calcula mediante la proporción:
       $$\theta = \left(\frac{p}{100}\right) \cdot 360^\circ = p \cdot 3.6^\circ$$
  3. **Gráfico de barra porcentual**:
     - Una barra rectangular de longitud $L$ subdividida proporcionalmente en segmentos de longitud $L_p = \frac{p}{100} \cdot L$.

  ### Síntesis didáctica
  - Cuadrícula $10 \times 10$: $p$ cuadritos pintados de 100.
  - Sector circular: Ángulo $\theta = p \cdot 3.6^\circ$.
definiciones_clave: |
  - **Cuadrícula de $10 \times 10$**: Representación bidimensional estándar dividida en 100 cuadrados idénticos.
  - **Ángulo central del sector ($\theta$)**: Grados sexagesimales ocupados por un porcentaje en un gráfico circular.
  - **Barra de 100 unidades**: Representación gráfica lineal subdividida en 10 tramos del 10% cada uno.
propiedades_relaciones: |
  - **Conservación de área relativa**: El porcentaje representado gráficamente depende exclusivamente de la razón de áreas $\frac{A_{\text{sombra}}}{A_{\text{total}}}$, no del tamaño físico del gráfico.
  - **Aditividad de sectores gráficos**: La suma de los ángulos centrales de todos los sectores de un gráfico circular suma estrictamente $360^\circ$ ($100\%$).
ejemplo_guiado:
  enunciado: 'Determina cuántos cuadritos de una cuadrícula de $10 \times 10$ se deben colorear para representar el $45\%$, y calcula el ángulo central $\theta$ que le correspondería en un gráfico circular.'
  pasos:
    - 'Paso 1: En la cuadrícula de $10 \times 10$, el total de cuadritos es $100$. Para el $45\%$, pintamos exactamente $45$ cuadritos.'
    - 'Paso 2: Para el gráfico circular, recordamos que el círculo completo ($100\%$) mide $360^\circ$.'
    - 'Paso 3: Calculamos el ángulo central multiplicando el porcentaje por $3.6^\circ$:\n$$\theta = 45 \cdot 3.6^\circ = 162^\circ$$'
    - 'Paso 4: Conclusión: Se colorean **45 cuadritos** y en el gráfico circular le corresponde un **ángulo de $162^\circ$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se calcula el ángulo central $\theta$ en un gráfico circular para representar el $25\%$?'
    choices:
      - {text: 'Multiplicando la fracción $\frac{25}{100}$ por $360^\circ$, obteniendo $\theta = 90^\circ$', is_correct: true}
      - {text: 'Sumando $25 + 360 = 385^\circ$', is_correct: false}
      - {text: 'Dividiendo $360^\circ$ entre $25$, obteniendo $14.4^\circ$', is_correct: false}
      - {text: 'Asignando siempre un ángulo fijo de $45^\circ$', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicando la fracción $\frac{25}{100}$ por $360^\circ$, obteniendo $\theta = 90^\circ$''. $\theta = (25/100) \cdot 360^\circ = 90^\circ$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en una cuadrícula de $10 \times 10$ hay $60$ cuadritos pintados de azul, ¿qué porcentaje representa dicha superficie?'
    choices:
      - {text: 'El $60\%$, pues son 60 partes de un total de 100 cuadritos', is_correct: true}
      - {text: 'El $6\%$, dividiendo por 10', is_correct: false}
      - {text: 'El $40\%$, contando los descoloreados', is_correct: false}
      - {text: 'El $100\%$, al ser una figura completa', is_correct: false}
    explanation: 'La alternativa correcta es ''El $60\%$, pues son 60 partes de un total de 100 cuadritos''. $60 / 100 = 60\%$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el porcentaje $p\%$ a representar.'
  - 'Paso 2: Para cuadrículas $10 \times 10$, contar y colorear exactamente $p$ cuadritos.'
  - 'Paso 3: Para gráficos circulares, calcular el ángulo central $\theta = p \cdot 3.6^\circ$ y trazar el sector con transportador.'
  - 'Paso 4: Comprobar que la superficie sombreada mantiene la razón $\frac{p}{100}$ respecto al área total.'
errores_correccion: |
  - **Error 1:** Confundir el porcentaje con el ángulo central en grados sin multiplicar por $3.6^\circ$ (ej: dibujar un sector de $25^\circ$ para el $25\%$). **Cómo corregirlo:** El ángulo total es $360^\circ$, no 100; debes **multiplicar el porcentaje por $3.6^\circ$ ($\theta = p \cdot 3.6^\circ$)**.
  - **Error 2:** Usar una cuadrícula con un número distinto de cuadritos (ej: de 50) y contar $p$ cuadritos sin ajustar la proporción. **Cómo corregirlo:** Si la cuadrícula no es de 100, calcula el número de cuadritos a pintar como **$\frac{p}{100} \cdot \text{Total de cuadritos}$**.
ejemplos:
  - titulo: 'Representación del 50% en sector circular'
    enunciado: '¿Al $50\%$ le corresponde un ángulo central de $180^\circ$ (medio círculo)?'
    alternativas:
      - 'Sí, pues $50 \cdot 3.6^\circ = 180^\circ$'
      - 'No, le corresponde $50^\circ$'
      - 'No, le corresponde $90^\circ$'
    respuesta: 'Sí, pues $50 \cdot 3.6^\circ = 180^\circ$'
    solucion_pasos:
      - '1. Ángulo $\theta = (50/100) \cdot 360^\circ$.'
      - '2. Calculamos $\theta = 180^\circ \implies$ Semicírculo.'
  - titulo: 'Representación del 75% en cuadrícula 10x10'
    enunciado: '¿Para el $75\%$ se pintan 75 cuadritos de 100 en la cuadrícula?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. 75 partes de 100.'
  - titulo: 'Representación del 100% en gráfico circular'
    enunciado: '¿El $100\%$ abarca la totalidad del círculo de $360^\circ$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $100 \cdot 3.6^\circ = 360^\circ$.'
  - titulo: 'Representación en cuadrícula no estandarizada'
    enunciado: 'En una cuadrícula de $20$ cuadritos totales, ¿el $50\%$ se representa pintando $10$ cuadritos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(50/100) \cdot 20 = 10\text{ cuadritos}$.'
errores_frecuentes:
  - 'Considerar que el porcentaje en un gráfico circular es igual al número de grados sin multiplicar por 3.6.'
  - 'Pintar $p$ cuadritos en una grilla que no tiene 100 cuadrados sin recalcular la proporción.'
  - 'La suma de las áreas de todos los sectores de una figura puede diferir del 100% total.'
  - 'El tamaño físico del papel o pantalla altera el valor del porcentaje representado.'
  - 'Invertir las zonas sombreadas pintando el complemento descoloreado.'
afirmaciones_verdaderas:
  - 'En una cuadrícula de $10 \times 10$, el porcentaje $p\%$ se representa coloreando exactamente $p$ de los 100 cuadrados.'
  - 'En un gráfico circular, al porcentaje $p\%$ le corresponde un ángulo central de $\theta = p \cdot 3.6^\circ$.'
al_terminar_debes_poder: 'Representar gráficamente porcentajes en cuadrículas de 100 cuadrados y gráficos circulares calculando el ángulo $\theta = p \cdot 3.6^\circ$.'
