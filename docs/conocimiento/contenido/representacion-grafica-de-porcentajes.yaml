semantic_id: MAT.NUM.PORCENTAJES.REP_GRAFICA
resumen_inicial: 'La representación gráfica de porcentajes permite visualizar la relación parte-todo mediante cuadrículas de 100 casillas ($10 \times 10$), barras proporcionales y sectores circulares proporcionales.'
explicacion_simple: |
  ![Representación gráfica de porcentajes](/static/img/nodos/representacion-grafica-de-porcentajes-intro.svg)

  Para visualizar un porcentaje, el modelo más directo es la **cuadrícula de $10 \times 10$**, que contiene exactamente $100$ cuadritos iguales. Cada cuadrito pintado representa el $1\%$ del total. Si pintas $30$ cuadritos, tienes el $30\%$. En gráficos circulares, el círculo completo ($360^\circ$) representa el $100\%$, por lo que un sector de $90^\circ$ equivale exactamente al $25\%$ del total.
explicacion_formal: |
  ### Modelo de cuadrícula centesimal ($10 \times 10$)
  El área total está discretizada en $100$ unidades cuadradas idénticas de área unitaria $u$:
  $$A_{\text{total}} = 100u \implies A(p\%) = p \cdot u$$

  ### Modelo de sector circular
  En un diagrama de sectores circulares, la medida angular $\alpha$ del sector asociado a un porcentaje $p\%$ es directamente proporcional al ángulo completo ($360^\circ$):
  $$\frac{\alpha}{360^\circ} = \frac{p}{100} \implies \alpha = \left(\frac{p}{100}\right) \cdot 360^\circ$$

  ### Modelo de barra proporcional
  Una barra de longitud total $L$ subdividida proporcionalmente:
  $$L(p\%) = \left(\frac{p}{100}\right) \cdot L$$
definiciones_clave: |
  - **Cuadrícula centesimal**: Matriz de $10 \times 10 = 100$ celdas donde cada celda equivale al $1\%$.
  - **Sector circular proporcional**: Porción de círculo cuyo ángulo central satisface $\alpha = \frac{p \cdot 360^\circ}{100}$.
  - **Relación parte-todo visual**: Representación geométrica donde el área sombreada refleja la razón $\frac{p}{100}$.
propiedades_relaciones: |
  - **Conservación de área total**: La suma de todas las áreas porcentuales parciales suma el $100\%$ del área del gráfico.
  - **Equivalencia angular del 25%**: Un $25\%$ corresponde siempre a un ángulo recto exacto de $90^\circ$ en un gráfico circular.
ejemplo_guiado:
  enunciado: 'Determina cuántos cuadritos de una cuadrícula de $10 \times 10$ se deben pintar para representar el $45\%$ y calcula el ángulo que le correspondería en un gráfico circular.'
  pasos:
    - 'Paso 1: En la cuadrícula de $100$ casillas, cada casilla equivale a $1\%$. Por lo tanto, para el $45\%$ se pintan exactamente **45 cuadritos** (4 filas completas y 5 casillas de la quinta fila).'
    - 'Paso 2: Para el gráfico circular, aplicamos la fórmula del ángulo central: $\alpha = \left(\frac{45}{100}\right) \cdot 360^\circ$.'
    - 'Paso 3: Calculamos: $\alpha = 0,45 \cdot 360^\circ = 162^\circ$.'
    - 'Paso 4: Conclusión: El $45\%$ se representa con 45 cuadritos o con un sector angular de **162°**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un gráfico circular, ¿qué ángulo central corresponde exactamente al $50\%$ de los datos?'
    choices:
      - {text: '$180^\circ$ (medio círculo)', is_correct: true}
      - {text: '$90^\circ$ (un cuadrante)', is_correct: false}
      - {text: '$50^\circ$', is_correct: false}
      - {text: '$270^\circ$', is_correct: false}
    explanation: 'La alternativa correcta es $180^\circ$. $\alpha = \frac{50}{100} \cdot 360^\circ = 0,5 \cdot 360^\circ = 180^\circ$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en una cuadrícula de 100 casillas hay 64 casillas pintadas de azul, ¿qué porcentaje representan?'
    choices:
      - {text: '$64\%$', is_correct: true}
      - {text: '$6,4\%$', is_correct: false}
      - {text: '$36\%$', is_correct: false}
      - {text: '$0,64\%$', is_correct: false}
    explanation: 'La alternativa correcta es $64\%$. Al ser una cuadrícula de 100 unidades, 64 casillas equivalen a $\frac{64}{100} = 64\%$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el tipo de gráfico (cuadrícula de 100, barra continua o sector circular).'
  - 'Paso 2: En cuadrículas de 100, sombrear exactamente $p$ casillas para representar el $p\%$.'
  - 'Paso 3: En gráficos circulares, calcular el ángulo central mediante $\alpha = \frac{p}{100} \cdot 360^\circ$.'
  - 'Paso 4: Verificar que el total de partes sombreadas más las no sombreadas complete el $100\%$ ($100$ casillas o $360^\circ$).'
errores_correccion: |
  - **Error 1:** Asumir que cualquier cuadrícula tiene 100 casillas sin contar las filas y columnas. **Cómo corregirlo:** Si la cuadrícula es de $5 \times 5 = 25$ casillas, cada casilla vale $\frac{100\%}{25} = 4\%$, no $1\%$.
  - **Error 2:** Usar directamente el número del porcentaje como los grados del círculo (ej: creer que 30% son 30°). **Cómo corregirlo:** Siempre multiplicar la fracción decimal por $360^\circ$: $\alpha = 0,30 \cdot 360^\circ = 108^\circ$.
ejemplos:
  - titulo: 'Lectura de cuadrícula de 100'
    enunciado: 'Si en un tablero de $10 \times 10$ hay $28$ casillas sombreadas, ¿a qué porcentaje corresponde?'
    alternativas:
      - '$28\%$'
      - '$2,8\%$'
      - '$72\%$'
      - '$0,28\%$'
    respuesta: '$28\%$'
    solucion_pasos:
      - '1. El total de casillas es $10 \times 10 = 100$.'
      - '2. La razón es $\frac{28}{100} = 28\%$.'
  - titulo: 'Ángulo para el 25%'
    enunciado: '¿El $25\%$ de un gráfico circular corresponde a un sector de $90^\circ$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\alpha = \frac{25}{100} \cdot 360^\circ = \frac{1}{4} \cdot 360^\circ = 90^\circ$.'
  - titulo: 'Cuadrícula no centesimal'
    enunciado: 'En una cuadrícula de $20$ casillas totales, pintar $5$ casillas representa el $25\%$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La razón es $\frac{5}{20} = \frac{1}{4} = \frac{25}{100} = 25\%$.'
  - titulo: 'Porcentaje complementario'
    enunciado: '¿Si en un círculo un sector ocupa $108^\circ$ ($30\%$), el sector restante ocupa $252^\circ$ ($70\%$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $360^\circ - 108^\circ = 252^\circ$, y $100\% - 30\% = 70\%$.'
errores_frecuentes:
  - 'Confundir el valor del porcentaje con la medida angular en grados sin multiplicar por 360°.'
  - 'No verificar el número total de divisiones en cuadrículas que no son de 10x10.'
  - 'Olvidar que la suma angular total en un gráfico circular debe ser exactamente 360°.'
afirmaciones_verdaderas:
  - 'En una cuadrícula de 100 casillas, cada casilla sombreada representa exactamente el 1%.'
  - 'Un sector circular de 90° representa exactamente el 25% del total.'
al_terminar_debes_poder: |
  ![Resumen de representación gráfica de porcentajes](/static/img/nodos/representacion-grafica-de-porcentajes-resumen.svg)

  QUÉ: Representar e interpretar visualmente porcentajes en cuadrículas centesimales, barras y diagramas circulares.
  CÓMO: Sombreando $p$ casillas en cuadrículas $10 \times 10$, o calculando el ángulo central proporcional $\alpha = \left(\frac{p}{100}\right) \cdot 360^\circ$ para gráficos de sectores.
