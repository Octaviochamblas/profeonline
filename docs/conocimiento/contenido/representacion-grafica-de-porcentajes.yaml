semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_GRAFICA
resumen_inicial: 'Representación gráfica de porcentajes: concepto y propiedades fundamentales
  en Porcentajes.'
explicacion_simple: Si ves un gráfico circular en las noticias donde la mitad está pintada
  de azul, sabes instantáneamente que es un 50%. Nuestro cerebro entiende los porcentajes
  mucho mejor cuando están dibujados como porciones de un todo.
explicacion_formal: 'Visualmente, el $100\%$ representa **el entero**. Todo dibujo que represente
  porcentajes asume que la figura completa vale 100.


  - **Cuadrícula 10x10**: Se dibuja un cuadrado dividido en 100 cuadraditos iguales. Pintar
  25 cuadraditos representa el $25\%$.

  - **Gráfico circular (torta)**: Los $360^\circ$ del círculo representan el $100\%$. Para
  saber el ángulo de un sector, multiplicas el porcentaje por $3.6$. Por ejemplo, $50\%$ es
  la mitad del círculo ($180^\circ$).

  - **Barra de progreso**: Un rectángulo largo donde rellenar la mitad es $50\%$ y llenarlo
  entero es $100\%$.'
definiciones_clave: '- **Representación gráfica de porcentajes**: Elemento central dentro
  del estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a representación gráfica de porcentajes.'
ejemplo_guiado:
  enunciado: Un gráfico circular representa el presupuesto de una familia. El sector de alimentación
    ocupa 90°. ¿Qué porcentaje del presupuesto representa?
  pasos:
  - Reconozco que los 360° del círculo representan el 100% del presupuesto.
  - 'Planteo la relación: si 360° es 100%, entonces 90° es a x%.'
  - 'Calculo: 90 dividido entre 3,6 es igual a 25. El sector de alimentación representa el
    25% del presupuesto.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con representación gráfica de porcentajes?
  choices:
  - text: Identificar correctamente la relación de porcentajes
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de porcentajes. Fundamento
    conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de representación gráfica de porcentajes, ¿qué
    paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
    clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica qué figura representa el total (100%).'
- 'Paso 2: Observa la proporción sombreada.'
- 'Paso 3: Si es una cuadrícula de 100, cuenta los cuadros. Si es circular, estima si es la
  mitad (50%), un cuarto (25%), etc.'
errores_correccion: Evita confundir los datos de entrada al operar con representación gráfica
  de porcentajes.
ejemplos:
- titulo: Cuadrícula sombreada
  enunciado: Hay un cuadrado de 10x10. Tiene 2 filas completas pintadas y 3 cuadritos más.
    ¿Qué porcentaje es?
  solucion_pasos:
  - 2 filas de 10 = 20 cuadritos.
  - 20 + 3 = 23 cuadritos.
  - Como el total es 100, representa el 23%.
- titulo: Ejemplo 2
  enunciado: ¿Cuántos grados representa el 40% de un círculo?
  alternativas:
  - '144'
  - '40'
  - '360'
  respuesta: '144'
  solucion_pasos:
  - 40 por 3,6 es igual a 144.
- titulo: Ejemplo 3
  enunciado: Una cuadrícula de 10x10 tiene 35 cuadritos pintados. ¿Qué porcentaje representa?
  alternativas:
  - 35%
  - 3,5%
  - 350%
  respuesta: 35%
  solucion_pasos:
  - Cada cuadrito de una cuadrícula de 100 vale 1%.
- titulo: ¿El 50% de un círculo corresponde a 180°?
  respuesta: Sí
  solucion_pasos:
  - Porque 50 por 3,6 es igual a 180.
errores_frecuentes:
- Creer que en una cuadrícula de 5x5 cada cuadro vale 1% (cada uno vale 4%, ya que 100/25
  = 4).
- Confundir el 25% en un círculo con un tercio de la torta.
- Asumir que si la figura crece de tamaño, los porcentajes cambian (el 50% de un círculo gigante
  sigue siendo la mitad).
- Creer que en una cuadrícula de 5x5 cada cuadro vale 1%, cuando en realidad cada uno vale
  4%, ya que 100 dividido entre 25 es 4.
- Confundir el 25% de un círculo con un tercio de la figura completa.
afirmaciones_verdaderas:
- La propiedad de representación gráfica de porcentajes preserva la consistencia lógica.
- En un gráfico circular, cada 3,6 grados del círculo representan 1% del total.
al_terminar_debes_poder: Resolver problemas aplicados que involucren representación gráfica
  de porcentajes.
