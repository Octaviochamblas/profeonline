semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_GRAFICA
resumen_inicial: 'Representación gráfica de porcentajes: concepto y propiedades fundamentales
  en Porcentajes.'
explicacion_simple: Si ves un gráfico circular en las noticias donde la mitad está
  pintada de azul, sabes instantáneamente que es un 50%. Nuestro cerebro entiende
  los porcentajes mucho mejor cuando están dibujados como porciones de un todo.
explicacion_formal: 'Visualmente, el $100\%$ representa **el entero**. Todo dibujo
  que represente porcentajes asume que la figura completa vale 100.


  - **Cuadrícula 10x10**: Se dibuja un cuadrado dividido en 100 cuadraditos iguales.
  Pintar 25 cuadraditos representa el $25\%$.

  - **Gráfico circular (torta)**: Los $360^\circ$ del círculo representan el $100\%$.
  Para saber el ángulo de un sector, multiplicas el porcentaje por $3.6$. Por ejemplo,
  $50\%$ es la mitad del círculo ($180^\circ$).

  - **Barra de progreso**: Un rectángulo largo donde rellenar la mitad es $50\%$ y
  llenarlo entero es $100\%$.'
definiciones_clave: '- **Representación gráfica de porcentajes**: Elemento central
  dentro del estudio de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a representación gráfica de porcentajes.'
