resumen_inicial: La representación gráfica de un porcentaje $P\%$ visualiza las $P$
  cuadrículas pintadas dentro de una rejilla cuadrada dividida en $100$ sectores iguales
  ($10 \times 10$).
explicacion_simple: Para ver un porcentaje de forma visual, dibujamos una rejilla
  de 100 cuadritos iguales. Si queremos representar el 30%, pintamos exactamente 30
  cuadritos de los 100 totales.
explicacion_formal: 'La **Representación Gráfica de Porcentaje** se modela sobre el
  área de una figura dividida en $100$ regiones congruentes $A_i$:


  $$\text{Área Pintada} = P \cdot A_i, \quad \text{Área Total} = 100 \cdot A_i \implies
  \frac{\text{Área Pintada}}{\text{Área Total}} = \frac{P}{100} = P\%$$


  **Formas gráficas alternativas:**

  - Cuadrícula $10 \times 10$.

  - Gráfico circular o de sectores (donde $P\%$ corresponde al ángulo $\theta = P
  \cdot 3,6^\circ$).'
definiciones_clave: '- **Representación gráfica**: Visualización de $P\%$ mediante
  $P$ sectores sombreados de un total de $100$.'
propiedades_relaciones: '- **Proporción de área**: El área sombreada representa la
  fracción $P/100$ de la superficie total.'
ejemplo_guiado:
  enunciado: Calcule el ángulo central en un gráfico circular para representar el
    $25\%$ de los datos.
  pasos:
  - 'Paso 1: Recordar que la circunferencia completa ($100\%$) equivale a $360^\circ$.'
  - 'Paso 2: Multiplicar el porcentaje por la constante de grado ($3,6^\circ$ por
    cada $1\%$): $25 \cdot 3,6^\circ = 90^\circ$.'
  - 'Conclusión: El $25\%$ se representa mediante un ángulo recto de $90^\circ$ en
    el gráfico circular.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántas cuadrículas se deben pintar en una rejilla de 10x10 para representar
    el P%?
  choices:
  - text: Se deben pintar exactamente P cuadrículas de las 100 totales
    is_correct: true
  - text: Se pintan 10 cuadrículas siempre
    is_correct: false
  - text: Se pintan P/10 cuadrículas
    is_correct: false
  - text: Se pinta la mitad de la rejilla
    is_correct: false
  explanation: La alternativa correcta es 'Se deben pintar exactamente P cuadrículas
    de las 100 totales'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el 25% en un gráfico circular, ¿cuál fue el
    ángulo central?
  choices:
  - text: 90°
    is_correct: true
  - text: 180°
    is_correct: false
  - text: 45°
    is_correct: false
  - text: 25°
    is_correct: false
  explanation: La alternativa correcta es '90°'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de representar gráficamente porcentajes
  en cuadrículas de 100 sectores o mediante ángulos centrales en gráficos circulares.
semantic_id: MAT.NUM.PORCENTAJES.REPRESENTACION_GRAFICA
procedimiento:
- 'Paso 1: Convertir el porcentaje $P\%$ a su forma decimal $d = P/100$ o fracción
  irreducible.'
- 'Paso 2: Formular la ecuación de proporción correspondiente ($V = d \cdot N$, $P
  = (A/B) \cdot 100$ o $N = V/d$).'
- 'Paso 3: Resolver numéricamente y verificar la coherencia de la respuesta.'
errores_correccion: '- **Error 1: Multiplicar directamente por el número del porcentaje
  sin dividir entre 100 ($15\% \text{ de } 80 = 15 \cdot 80 = 1200$).** **Cómo corregirlo:**
  El porcentaje DEBE convertirse a decimal dividiendo por 100 antes de multiplicar
  ($0,15 \cdot 80 = 12$).


  - **Error 2: Confundir el cálculo del valor de un porcentaje con el cálculo del
  total.** **Cómo corregirlo:** Si se busca el total $100\%$ dada una parte $V$, se
  DEBE dividir por el porcentaje ($N = V / d$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PORCENTAJES.REPRESENTACION_GRAFICA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de porcentajes.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia decimal.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por división de base cien.
- titulo: ¿Equivale el P% a la fracción P/100?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de porcentaje.
- titulo: ¿Se obtiene el 10% de N dividiendo N entre 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10\% = 10/100 = 1/10$.
errores_frecuentes:
- Multiplicar una cantidad por el valor entero del porcentaje sin dividir entre cien.
- Sumar directamente dos porcentajes sucesivos aplicados sobre cantidades distintas.
- Desplazar la coma decimal hacia la derecha al convertir un porcentaje a su forma
  decimal.
- El porcentaje $50\%$ de una cantidad equivale a dividir dicha cantidad entre cincuenta.
- Declarar la parte dada con el total $100\%$ al despejar incógnitas de proporción.
afirmaciones_verdaderas:
- Un porcentaje $P\%$ es una razón de denominador cien $P\% = \frac{P}{100}$ que equivale
  al número decimal $P/100$.
- 'El $c\%$ de una cantidad $N$ se obtiene multiplicando $N$ por su equivalente decimal:
  $V = \left(\frac{c}{100}\right) \cdot N$.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
