semantic_id: MAT.FUND.CARDINALIDAD_CONJUNTOS.PROBLEMA_VENN_TRES_CONJUNTOS
resumen_inicial: Metodología sistemática de resolución de problemas verbales de conteo con tres conjuntos mediante diagramas de Venn y llenado de adentro hacia afuera.
explicacion_simple: 'Para resolver problemas de conteo con **tres conjuntos** (por ejemplo: preferencias de tres deportes o tres asignaturas), se utiliza un diagrama de Venn de **tres círculos secantes** siguiendo un **orden estricto de adentro hacia afuera**:

  1. **Centro absoluto**: registrar cuántos cumplen las **tres cosas a la vez** ($A \cap B \cap C$).

  2. **Intersecciones dobles**: restar el centro a las parejas para hallar los que cumplen **"solo $A$ y $B$"**, **"solo $A$ y $C$"**, **"solo $B$ y $C$"**.

  3. **Regiones individuales**: restar las tres zonas vecinas a los totales para hallar **"solo $A$"**, **"solo $B$"** y **"solo $C$"**.

  4. **Exterior**: sumar las $7$ regiones internas y restarlas de $\mathcal{U}$ para hallar **"ninguno"**.


  ![problema-de-conteo-con-diagrama-de-venn-de-tres-conjuntos](/static/img/nodos/problema-de-conteo-con-diagrama-de-venn-de-tres-conjuntos-intro.svg)'
explicacion_formal: '### Definición formal

  En la resolución algorítmica de problemas de conteo, un **problema de 3 conjuntos sobre $\mathcal{U}$** consiste en resolver el sistema lineal de 8 variables disjuntas $\{x_{111}, x_{110}, x_{101}, x_{011}, x_{100}, x_{010}, x_{001}, x_{000}\}$:

  $$\begin{cases} x_{111} = |A \cap B \cap C| & \text{(Triple central)} \\ x_{110} = |A \cap B| - x_{111} & \text{(Solo } A \text{ y } B\text{)} \\ x_{101} = |A \cap C| - x_{111} & \text{(Solo } A \text{ y } C\text{)} \\ x_{011} = |B \cap C| - x_{111} & \text{(Solo } B \text{ y } C\text{)} \\ x_{100} = |A| - (x_{110} + x_{101} + x_{111}) & \text{(Solo } A\text{)} \\ x_{010} = |B| - (x_{110} + x_{011} + x_{111}) & \text{(Solo } B\text{)} \\ x_{001} = |C| - (x_{101} + x_{011} + x_{111}) & \text{(Solo } C\text{)} \\ x_{000} = |\mathcal{U}| - \sum_{i=1}^7 x_i & \text{(Ninguno)} \end{cases}$$


  ### Desglose simbólico

  - Flujo de resolución: $x_{111} \longrightarrow (x_{110}, x_{101}, x_{011}) \longrightarrow (x_{100}, x_{010}, x_{001}) \longrightarrow x_{000}$.

  - Condición de consistencia: Todas las variables $x_{ijk} \geq 0$.


  > **Complemento didáctico:** El flujo algorítmico jerárquico garantiza que cada deducción descuente exactamente los términos solapados calculados en el nivel previo.

  '
definiciones_clave: '- **Problema de conteo de 3 conjuntos**: Problema de modelado combinatorio que involucra tres propiedades simultáneas.

  - **Estrategia centrífuga**: Técnica de deducción que avanza desde el núcleo atómico ($x_{111}$) hacia las periferias ($x_{000}$).

  - **Conservación del universo**: Condición que exige que la suma de los 8 átomos iguale la población total $|\mathcal{U}|$.

  '
propiedades_relaciones: "- **Suma de niveles de Hamming**:\n  - Nivel 3 (tres): $x_{111}$.\n  - Nivel 2 (exactamente dos): $x_{110} + x_{101} + x_{011}$.\n  - Nivel 1 (exactamente uno): $x_{100} + x_{010} + x_{001}$.\n  - Nivel 0 (ninguno): $x_{000}$.\n"
ejemplo_guiado:
  enunciado: 'En un colegio de $120$ alumnos ($\mathcal{U}$): $60$ juegan fútbol ($F$), $50$ básquetbol ($B$), $45$ vóleibol ($V$), $20$ juegan $F$ y $B$, $18$ juegan $F$ y $V$, $15$ juegan $B$ y $V$, y $8$ juegan los tres deportes. Resuelve el diagrama de Venn y determina: (a) cuántos juegan solo fútbol, (b) cuántos juegan exactamente dos deportes, y (c) cuántos no juegan ningún deporte.


    ![Ejemplo problema-de-conteo-con-diagrama-de-venn-de-tres-conjuntos](/static/img/nodos/problema-de-conteo-con-diagrama-de-venn-de-tres-conjuntos-ejemplos.svg)'
  pasos:
  - 'Paso 1: Colocar la triple intersección central: - $x_{111} = |F \cap B \cap V| = 8$.'
  - 'Paso 2: Calcular las tres dobles exclusivas: - Solo $F$ y $B$: $20 - 8 = 12$. - Solo $F$ y $V$: $18 - 8 = 10$. - Solo $B$ y $V$: $15 - 8 = 7$.'
  - 'Paso 3: Calcular las tres regiones individuales exclusivas: - Solo $F$: $60 - (12 + 10 + 8) = 60 - 30 = 30$. - Solo $B$: $50 - (12 + 7 + 8) = 50 - 27 = 23$. - Solo $V$: $45 - (10 + 7 + 8) = 45 - 25 = 20$.'
  - 'Paso 4: Responder preguntas (a) y (b): - (a) Solo fútbol = $30$ alumnos. - (b) Exactamente dos deportes = $12 + 10 + 7 = 29$ alumnos.'
  - 'Paso 5: Calcular el total de deportistas y la región exterior (c): - Unión $= 30 + 23 + 20 + 12 + 10 + 7 + 8 = 110$ alumnos. - (c) Ningún deporte $= 120 - 110 = 10$ alumnos.'
checkpoints:
