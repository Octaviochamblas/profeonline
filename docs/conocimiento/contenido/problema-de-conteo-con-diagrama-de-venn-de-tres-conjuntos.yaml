procedimiento:
- 'Paso 1: Dibujar el rectángulo universal y los tres círculos secantes rotulados.'
- 'Paso 2: Registrar en el centro la cantidad de la triple intersección $x_{111}$.'
- 'Paso 3: Calcular las 3 regiones dobles exclusivas restando $x_{111}$ a cada dato de intersección de pares.'
- 'Paso 4: Calcular las 3 regiones individuales exclusivas restando las 3 zonas ya calculadas al total de cada conjunto.'
- 'Paso 5: Sumar las 7 regiones internas y restar de $|\mathcal{U}|$ para obtener la región exterior "Ninguno".'
errores_correccion: '- **Error 1:** Anotar el dato de intersección de dos conjuntos directamente en la región doble sin restar el centro. **Cómo corregirlo:** La región doble es exclusiva ($(A \cap B) \setminus C$); se debe restar obligatoriamente la cantidad que está en el centro triple.

  - **Error 2:** Restar solo el centro al calcular "Solo $A$". **Cómo corregirlo:** Al total de $A$ se le deben restar TRES regiones: las dos dobles adyacentes y la triple central.

  '
ejemplos:
- titulo: Cálculo de dobles exclusivas
  enunciado: Si $|A \cap B| = 14$ y $|A \cap B \cap C| = 6$, ¿cuántos hay en "Solo A y B"?
  alternativas:
  - $8$
  - $14$
  - $20$
  respuesta: $8$
  solucion_pasos:
  - 1. $(A \cap B) \setminus C = 14 - 6 = 8$.
- titulo: Cálculo de individual exclusiva
  enunciado: Si $|A| = 40$, y las zonas de solapamiento de A suman 25, ¿cuánto vale "Solo A"?
  respuesta: $15$
  solucion_pasos:
  - $40 - 25 = 15$.
  alternativas:
  - texto: $15$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad y cálculo cardinal.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el principio de conteo entrega un valor determinado y exacto.
  - texto: No se puede determinar con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del enunciado bastan para despejar la incógnita.
- titulo: Exactamente dos características
  enunciado: Si las tres dobles exclusivas valen 5, 8 y 7, ¿cuántos cumplen exactamente dos?
  respuesta: $20$
  solucion_pasos:
  - $5 + 8 + 7 = 20$.
  alternativas:
  - texto: $20$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad y cálculo cardinal.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el principio de conteo entrega un valor determinado y exacto.
  - texto: No se puede determinar con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del enunciado bastan para despejar la incógnita.
- titulo: Conservación del universo
  enunciado: Si la unión interna suma 85 en un universo de 100, ¿cuántos hay en la región exterior?
  respuesta: $15$
  solucion_pasos:
  - $100 - 85 = 15$.
  alternativas:
  - texto: $15$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad y cálculo cardinal.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el principio de conteo entrega un valor determinado y exacto.
  - texto: No se puede determinar con los datos dados
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del enunciado bastan para despejar la incógnita.
errores_frecuentes:
- La afirmación de que el dato de una intersección de dos conjuntos puede registrarse en el diagrama sin deducir el valor central.
- La afirmación de que para calcular la región "Solo A" basta con deducir únicamente una de las regiones compartidas.
- La afirmación de que la región exterior es igual a la resta de los tres totales directos del universo.
- La afirmación de que la suma de los que practican exactamente un deporte incluye a los que practican dos.
- La afirmación de que un diagrama de tres conjuntos divide al plano en siete regiones en lugar de ocho.
afirmaciones_verdaderas:
- La resolución de problemas de conteo con tres conjuntos exige un procedimiento secuencial de adentro hacia afuera a partir de la triple intersección central.
- El conjunto universal $\mathcal{U}$ se particiona en exactamente 8 átomos booleanos disjuntos cuya suma equivale a la cardinalidad total de la población.
al_terminar_debes_poder: 'QUÉ: Resolver problemas verbales de conteo con tres conjuntos utilizando diagramas de Venn.

  CÓMO: Deducir secuencialmente los 8 átomos booleanos de adentro hacia afuera y calcular preguntas de exclusividad, multiplicidad y complementación.


