al_terminar_debes_poder: '**QUÉ:** Evaluar la divisibilidad por 10 y potencias de diez en el sistema decimal posicional.


  **CÓMO:** Verificando que la cifra de las unidades sea cero ($u = 0$) para divisibilidad por 10, y generalizando a $k$ ceros finales para divisibilidad por $10^k$.


  ![Resumen Criterio de divisibilidad por 10](/static/img/nodos/criterio-de-divisibilidad-por-10-resumen.svg)'
