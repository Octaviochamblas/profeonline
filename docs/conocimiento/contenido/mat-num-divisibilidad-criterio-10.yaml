semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_10
resumen_inicial: Un número es divisible por 10 si su última cifra es exactamente 0.
explicacion_simple: 'El criterio de divisibilidad por 10 nos permite determinar rápidamente si un número entero se puede dividir exactamente por dicho valor sin necesidad de realizar la división larga completa. Aplicamos una regla sobre las cifras del número.


  ![Criterio de divisibilidad por 10](/static/img/nodos/criterio-de-divisibilidad-por-10-intro.svg)'
explicacion_formal: 'Un entero $n$ es divisible por $10$ si y solo si su dígito de las unidades $a_0 = 0$.


  $$a_0 = 0 \iff n \equiv 0 \pmod{10}$$


  > **Complemento didáctico:** Los criterios de divisibilidad son simplificaciones algebraicas basadas en la aritmética modular sobre las potencias de 10.'
definiciones_clave: '- **Criterio de divisibilidad**: Regla rápida sobre las cifras de un número para verificar si la división es exacta.'
propiedades_relaciones: '- **Aritmética modular**: Simplificación de cálculos al trabajar con residuos de potencias de 10.'
ejemplo_guiado:
  enunciado: 'Aplique el criterio de divisibilidad por 10 para verificar si la cifra dada cumple la condición.


    ![Ejemplo Criterio de divisibilidad por 10](/static/img/nodos/criterio-de-divisibilidad-por-10-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el procedimiento del criterio: verificar que termine en 0.'
  - 'Paso 2: Aplicar la prueba: 1.450 es divisible por 10 porque su última cifra es 0..'
  - 'Conclusión: El número cumple el criterio de divisibilidad.'
