semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_10
resumen_inicial: "Un número es divisible por 10 si y solo si su última cifra es 0."
explicacion_simple: |
  Tienes monedas de $10 y quieres formar una cantidad exacta de dinero. ¿Qué número debe
  estar al final del total para que no te sobren monedas sueltas? ¡El cero! Si un número
  termina en cero, siempre se puede dividir perfectamente en grupos de 10.
explicacion_formal: |
  Como $10=2\times5$, un número divisible por 10 debe cumplir a la vez el criterio del 2
  (terminar en cifra par) y el del 5 (terminar en 0 o 5). La única cifra que satisface
  ambas condiciones simultáneamente es el $0$.
definiciones_clave: |
  **Divisibilidad por 10**: caso particular donde se combinan los criterios del 2 y del 5,
  resultando en la única condición de terminar en cifra $0$.
propiedades_relaciones: |
  Todo número divisible por 10 es también divisible por 2 y por 5. La cantidad de ceros al
  final no importa para este criterio, solo que la última cifra sea 0.
ejemplo_guiado:
  enunciado: "Determina si 5.830 es divisible por 10."
  pasos:
    - "La última cifra de 5.830 es $0$."
    - "Cumple el criterio."
    - "Conclusión: 5.830 es divisible por 10."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué la única cifra final válida para divisibilidad por 10 es el 0?"
    choices:
      - {text: "Porque cumple a la vez los criterios del 2 y del 5", is_correct: true}
      - {text: "Porque es la cifra más pequeña", is_correct: false}
      - {text: "Porque 10 es par", is_correct: false}
      - {text: "No hay una razón, es una convención", is_correct: false}
    explanation: "La correcta es Porque cumple a la vez los criterios del 2 y del 5: $10=2\\times5$, y solo el 0 satisface ambos."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 6.405 divisible por 10?"
    choices:
      - {text: "No, termina en 5", is_correct: true}
      - {text: "Sí, termina en cifra válida", is_correct: false}
      - {text: "Sí, porque es divisible por 5", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es No, termina en 5: para divisibilidad por 10 la última cifra debe ser exactamente 0."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Observa la cifra que se encuentra en la posición de las unidades (la última cifra del número)."
  - "Paso 2: Verifica si esa cifra es 0. Si lo es, el número es divisible por 10. Si la última cifra es cualquier número diferente de 0, entonces el número no es divisible por 10."
errores_correccion: |
  Un error frecuente es confundir las unidades con otras posiciones (como decenas o
  centenas) al analizar el número. Otro error es pensar que basta con ser par para ser
  divisible por 10; también debe cumplir el criterio del 5.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determina si el número $4.580$ es divisible por $10$."
    alternativas:
      - "Sí, termina en 0"
      - "No, termina en cifra inválida"
      - "No se puede determinar"
    respuesta: "Sí, termina en 0"
    solucion_pasos:
      - "Paso a: Localizamos la última cifra del número $4.580$, la cual es $0$."
      - "Paso b: Como la última cifra es $0$, de acuerdo con el criterio, el número es divisible por $10$."
  - titulo: "Ejemplo 2"
    enunciado: "Averigua si el número $395$ es divisible por $10$."
    alternativas:
      - "No, termina en 5"
      - "Sí, termina en cifra válida"
      - "No se puede determinar"
    respuesta: "No, termina en 5"
    solucion_pasos:
      - "Paso a: Localizamos la última cifra del número $395$, la cual es $5$."
      - "Paso b: Dado que la última cifra no es $0$, el número no es divisible por $10$ (al dividirlo por 10 sobra 5)."
  - titulo: "¿Es el número $90.000$ divisible por $10$?"
    respuesta: "Sí"
    solucion_pasos:
      - "Observamos la última cifra del número $90.000$."
      - "La cifra de las unidades es $0$."
      - "Por lo tanto, cumple con la regla de divisibilidad por $10$."
  - titulo: "¿Es el número $702$ divisible por $10$?"
    respuesta: "No"
    solucion_pasos:
      - "La última cifra del número $702$ es $2$."
      - "Dado que es diferente de $0$, el número no es divisible por $10$."
errores_frecuentes:
  - "Creer que basta con ser par para ser divisible por 10, sin verificar que también termine en 0."
  - "Pensar que un número que termina en 5 es divisible por 10 (confundiendo con el criterio del 5)."
  - "Confundir las unidades con otras posiciones decimales (como las decenas o centenas) al analizar el número."
  - "Asociar erróneamente que todos los números pares son divisibles por 10."
  - "Pensar que la cantidad de ceros influye en si es divisible o no; basta con que tenga al menos un cero en la posición de las unidades."
al_terminar_debes_poder: |
  Determinar la divisibilidad por 10 de cualquier número observando únicamente su última
  cifra.
fuente: "Teoría de Números"
estado: publicado
