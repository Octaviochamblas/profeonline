semantic_id: MAT.NUM.PORCENTAJES.CALC_PARTE
resumen_inicial: El cálculo del $c\%$ de una cantidad total $T$ consiste en multiplicar
  la cantidad por la razón $\frac{c}{100}$ o por su correspondiente factor decimal
  $c_{\text{dec}}$ ($\text{Parte} = \frac{c \cdot T}{100} = c_{\text{dec}} \cdot T$).
explicacion_simple: '![Cálculo del c% de una cantidad](/static/img/nodos/calculo-del-c-de-una-cantidad-intro.svg)


  Para calcular el porcentaje de una cantidad, la forma más rápida es transformar
  el porcentaje en un número decimal y multiplicarlo por el total. Por ejemplo, para
  calcular el $20\%$ de $\$60.000$, convertimos el $20\%$ en $0,20$ y multiplicamos:
  $0,20 \cdot 60.000 = $\$12.00$0$. En matemáticas, la palabra *"de"* equivale directamente
  a una multiplicación.

  '
explicacion_formal: "### Formulación matemática general\nSea $T \\in \\mathbb{R}^+$\
  \ la cantidad base y $c\\% \\in \\mathbb{R}^+$ el porcentaje dado. El valor de la\
  \ parte $P$ viene dado por:\n$$P = \\left(\\frac{c}{100}\\right) \\cdot T = \\frac{c\
  \ \\cdot T}{100} = c_{\\text{dec}} \\cdot T$$\n\n### Métodos equivalentes de resolución\n\
  1. **Método decimal**: Multiplicar por el factor decimal:\n   $$P = (c \\div 100)\
  \ \\cdot T$$\n2. **Método fraccionario**: Multiplicar por la fracción simplificada:\n\
  \   $$P = \\left(\\frac{a}{b}\\right) \\cdot T$$\n3. **Método de regla de tres simple\
  \ directa**:\n   $$\\begin{aligned}\n   T &\\longrightarrow 100\\% \\\\\n   P &\\\
  longrightarrow c\\%\n   \\end{aligned} \\implies P = \\frac{c \\cdot T}{100}$$\n"
definiciones_clave: '- **Parte o Cuota ($P$)**: Magnitud absoluta correspondiente
  a la fracción porcentual de la base.

  - **Total o Base ($T$)**: Magnitud de referencia que representa el $100\%$.

  - **Tasa porcentual ($c$)**: Valor numérico que indica las partes tomadas por cada
  100.

  '
propiedades_relaciones: '- **Linealidad**: El $c\%$ de una suma es la suma de los
  porcentajes: $c\%(A + B) = c\%(A) + c\%(B)$.

  - **Escalamiento directo**: Duplicar la cantidad base duplica exactamente el valor
  de la parte porcentual.

  '
ejemplo_guiado:
  enunciado: Un artículo tiene un precio de $\$80.000$ y se le aplica un descuento
    del $15\%$. Calcula el monto exacto del descuento y el precio final a pagar.
  pasos:
  - 'Paso 1: Convertimos el $15\%$ a su forma decimal: $15\% = 0,15$.'
  - 'Paso 2: Multiplicamos el factor decimal por el total: $\text{Descuento} = 0,15
    \cdot 80.000 = $\$12.00$0$.'
  - 'Paso 3: Restamos el descuento del precio original para obtener el precio final:
    $\$80.000 - $\$12.000$ = $\$68.00$0$.'
  - 'Paso 4: Conclusión: El descuento es de **$12.000** y el precio final a pagar
    es de **$68.000**.'
  imagen: /static/img/nodos/calculo-del-c-de-una-cantidad-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el $30\%$ de $250$?
  choices:
  - text: $75$
    is_correct: true
  - text: $7,5$
    is_correct: false
  - text: $83,3$
    is_correct: false
  - text: $750$
    is_correct: false
  explanation: La alternativa correcta es $75$. $P = 0,30 \cdot 250 = 75$ (o $\frac{30
    \cdot 250}{100} = \frac{7500}{100} = 75$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una persona gana un sueldo de $\$600.000$ y destina el $25\%$ al arriendo,
    ¿cuánto dinero paga por el arriendo?
  choices:
  - text: $\$150.000$ (la cuarta parte)
    is_correct: true
  - text: $\$240.000$
    is_correct: false
  - text: $\$120.000$
    is_correct: false
  - text: $\$15.000$
    is_correct: false
  explanation: La alternativa correcta es $\$150.000$. $25\% = \frac{1}{4} \implies
    \frac{600.000}{4} = $\$150.00$0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la cantidad base $T$ y el porcentaje $c\%$ solicitado.'
- 'Paso 2: Convertir el porcentaje $c\%$ a número decimal dividiendo por $100$ ($c_{\text{dec}}
  = c \div 100$).'
- 'Paso 3: Multiplicar el número decimal obtenido por la cantidad total ($P = c_{\text{dec}}
  \cdot T$).'
- 'Paso 4: Evaluar la coherencia del resultado (si $c < 100$, la parte debe ser menor
  que el total).'
errores_correccion: '- **Error 1:** Dividir el total directamente entre el número
  $c$ (ej: calcular el $20\%$ dividiendo por $20$ en lugar de multiplicar por $0,20$
  o dividir entre $5$).

  - **Error 2:** Multiplicar por $c$ y olvidar dividir entre $100$ (ej: $15 \cdot
  80.000 = 1.200.000$ en vez de $12.000$).

  '
ejemplos:
- titulo: Cálculo de porcentaje con decimales
  enunciado: ¿Cuál es el $12\%$ de $\$45.000$?
  alternativas:
  - $\$5.400$
  - $\$540$
  - $\$54.000$
  - $\$3.750$
  respuesta: $\$5.400$
  solucion_pasos:
  - '1. Convertimos $12\%$ a decimal: $0,12$.'
  - 2. Multiplicamos $0,12 \cdot 45.000 = $\$5.40$0$.
- titulo: Cálculo mediante fracción notable
  enunciado: ¿Calcular el $50\%$ de $\$90.000$ equivale a dividir $\$90.000$ entre
    $2$ dando $\$45.000$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $50\% = \frac{1}{2}$, por lo que $\frac{90.000}{2} = $\$45.00$0$.
- titulo: Cálculo con porcentaje mayor a 100
  enunciado: ¿El $150\%$ de $80$ es igual a $120$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $1,50 \cdot 80 = 120$.
- titulo: Cálculo de tasa pequeña
  enunciado: ¿El $2\%$ de $\$300.000$ es igual a $\$6.000$?
  respuesta: Sí
  solucion_pasos:
  - Sí. $0,02 \cdot 300.000 = $\$6.00$0$.
errores_frecuentes:
- Dividir el total directamente por el número del porcentaje en lugar de multiplicar
  por la tasa decimal.
- Olvidar colocar los ceros decimales al multiplicar por porcentajes de un solo dígito
  (usar 0,5 en vez de 0,05).
- Confundir el valor del descuento o aumento con el valor final total.
afirmaciones_verdaderas:
- Para calcular el c% de una cantidad se multiplica dicha cantidad por el factor decimal
  c/100.
- El 10% de cualquier número se calcula dividiendo directamente la cantidad entre
  10.
al_terminar_debes_poder: '![Resumen de cálculo del c% de una cantidad](/static/img/nodos/calculo-del-c-de-una-cantidad-resumen.svg)


  QUÉ: Calcular de manera exacta y rápida la parte correspondiente al $c\%$ de cualquier
  cantidad dada.

  CÓMO: Multiplicando la cantidad base $T$ por la razón $\frac{c}{100}$ o por su expresión
  decimal equivalente ($P = c_{\text{dec}} \cdot T$).

  '
