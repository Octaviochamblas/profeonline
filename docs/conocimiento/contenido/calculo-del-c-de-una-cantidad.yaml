  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el porcentaje a calcular ($c$) y la cantidad base ($N$).'
- 'Paso 2: Plantea la multiplicación $N \cdot (c/100)$.'
- 'Paso 3: Realiza la operación (multiplica y luego divide por 100, o usa decimales).'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del c% de una
  cantidad.
ejemplos:
- titulo: Cálculo estándar
  enunciado: Calcula el 15% de 400.
  solucion_pasos:
  - Multiplicamos $400 \cdot 15 = 6000$.
  - 'Dividimos por 100: $6000 / 100 = 60$.'
  - El 15% de 400 es 60.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el 12% de 500?
  alternativas:
  - '60'
  - '50'
  - '120'
  respuesta: '60'
  solucion_pasos:
  - 500 por 12 dividido entre 100 es igual a 60.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el 8% de 150?
  alternativas:
  - '12'
  - '15'
  - '8'
  respuesta: '12'
  solucion_pasos:
  - 150 por 8 dividido entre 100 es igual a 12.
- titulo: ¿Calcular el c% de N es lo mismo que multiplicar N por c y dividir por 100?
  respuesta: Sí
  solucion_pasos:
  - Esa es la fórmula directa del cálculo porcentual.
errores_frecuentes:
- Dividir la cantidad $N$ por el porcentaje $c$ (ej. $400 / 15$).
- Calcular el porcentaje pero olvidar restarlo o sumarlo si el problema preguntaba por un
  descuento o aumento final.
- Olvidar los ceros al multiplicar por decimales.
- Dividir la cantidad N por el porcentaje c en vez de multiplicar.
- Olvidar los ceros al multiplicar por la forma decimal del porcentaje.
afirmaciones_verdaderas:
- La propiedad de cálculo del c% de una cantidad preserva la consistencia lógica.
- Calcular el c% de una cantidad N se puede hacer multiplicando N por c y dividiendo entre
  100, o multiplicando N directamente por la forma decimal de c%.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del c% de una
  cantidad.
