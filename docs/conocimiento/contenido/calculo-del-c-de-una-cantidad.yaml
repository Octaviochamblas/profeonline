resumen_inicial: 'El cálculo del $c\%$ de una cantidad $N$ consiste en multiplicar
  la cantidad $N$ por el porcentaje expresado en decimal o fracción: $V = \frac{c}{100}
  \cdot N$.'
explicacion_simple: Para calcular cuánto es un porcentaje de una cantidad (por ejemplo,
  el 15% de 80), multiplicamos la cantidad por el porcentaje y dividimos el resultado
  entre 100. También podemos multiplicar la cantidad directamente por el número decimal
  (80 por 0,15).
explicacion_formal: 'Para un porcentaje $c\%$ y una cantidad total $N$, el **Valor
  del Porcentaje $V$** se determina mediante la ecuación de proporción:


  $$V = \frac{c}{100} \cdot N = c\% \cdot N = d \cdot N$$


  **Propiedad conmutativa:**

  - El $c\%$ de $N$ equivale exactamente al $N\%$ de $c$: $\frac{c}{100} \cdot N =
  \frac{N}{100} \cdot c$.'
definiciones_clave: '- **Cálculo de valor $V$**: Resultado $V = \frac{c}{100} \cdot
  N$ correspondiente al porcentaje $c\%$.'
propiedades_relaciones: '- **Conmutatividad porcentual**: $c\% \text{ de } N = N\%
  \text{ de } c$.'
ejemplo_guiado:
  enunciado: Calcule el $15\%$ de \$80.000.
  pasos:
  - 'Paso 1: Expresar el porcentaje como decimal: $15\% = 0,15$.'
  - 'Paso 2: Multiplicar la cantidad por el decimal: $V = 80.000 \cdot 0,15$.'
  - 'Paso 3: Calcular el producto: $80.000 \cdot \frac{15}{100} = 800 \cdot 15 = 12.000$.'
  - 'Conclusión: El $15\%$ de \$80.000 es \$12.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el valor V correspondiente al c% de
    una cantidad N?
  choices:
  - text: V = (c / 100) · N
    is_correct: true
  - text: V = (N / c) · 100
    is_correct: false
  - text: V = N - c
    is_correct: false
  - text: V = c · N · 100
    is_correct: false
  explanation: La alternativa correcta es 'V = (c / 100) · N'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el 15% de $80.000, ¿cuál fue el valor obtenido?
  choices:
  - text: 12.000 $
    is_correct: true
  - text: 15.000 $
    is_correct: false
  - text: 8.000 $
    is_correct: false
  - text: 1.200 $
    is_correct: false
  explanation: La alternativa correcta es '12.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el valor numérico $V
  = \frac{c}{100} \cdot N$ correspondiente al $c\%$ de una cantidad $N$.
semantic_id: MAT.NUM.PORCENTAJES.CALCULO_VALOR
procedimiento:
- 'Paso 1: Convertir el porcentaje $P\%$ a su forma decimal $d = P/100$ o fracción
  irreducible.'
- 'Paso 2: Formular la ecuación de proporción correspondiente ($V = d \cdot N$, $P
  = (A/B) \cdot 100$ o $N = V/d$).'
- 'Paso 3: Resolver numéricamente y verificar la coherencia de la respuesta.'
errores_correccion: '- **Error 1: Multiplicar directamente por el número del porcentaje
  sin dividir entre 100 ($15\% \text{ de } 80 = 15 \cdot 80 = 1200$).** **Cómo corregirlo:**
  El porcentaje DEBE convertirse a decimal dividiendo por 100 antes de multiplicar
  ($0,15 \cdot 80 = 12$).


  - **Error 2: Confundir el cálculo del valor de un porcentaje con el cálculo del
  total.** **Cómo corregirlo:** Si se busca el total $100\%$ dada una parte $V$, se
  DEBE dividir por el porcentaje ($N = V / d$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PORCENTAJES.CALCULO_VALOR.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de los conceptos de porcentajes.
- titulo: Ejemplo 2
  enunciado: Verificación de equivalencia decimal.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal por división de base cien.
- titulo: ¿Equivale el P% a la fracción P/100?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de porcentaje.
- titulo: ¿Se obtiene el 10% de N dividiendo N entre 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10\% = 10/100 = 1/10$.
errores_frecuentes:
- Multiplicar una cantidad por el valor entero del porcentaje sin dividir entre cien.
- Sumar directamente dos porcentajes sucesivos aplicados sobre cantidades distintas.
- Desplazar la coma decimal hacia la derecha al convertir un porcentaje a su forma
  decimal.
- El porcentaje $50\%$ de una cantidad equivale a dividir dicha cantidad entre cincuenta.
- Declarar la parte dada con el total $100\%$ al despejar incógnitas de proporción.
afirmaciones_verdaderas:
- Un porcentaje $P\%$ es una razón de denominador cien $P\% = \frac{P}{100}$ que equivale
  al número decimal $P/100$.
- 'El $c\%$ de una cantidad $N$ se obtiene multiplicando $N$ por su equivalente decimal:
  $V = \left(\frac{c}{100}\right) \cdot N$.'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
