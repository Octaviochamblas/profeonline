semantic_id: MAT.NUM.PORCENTAJES.CALCULO_VALOR
resumen_inicial: 'Cálculo del c% de una cantidad: concepto y propiedades fundamentales en
  Porcentajes.'
explicacion_simple: Si la tienda anuncia un 30% de descuento en una zapatilla de $50.000,
  ¿cuántos billetes te estás ahorrando exactamente? Este es el cálculo porcentual más usado
  en el mundo real.
explicacion_formal: 'Calcular el porcentaje de una cantidad significa encontrar esa porción
  específica sobre un número base.


  Matemáticamente, la palabra ''de'' significa multiplicación. Por ende, el ''$c\%$ de $N$''
  se traduce como:

  $\text{Valor} = N \cdot$ \frac{c}{100}$


  Puedes hacerlo de tres formas (elige la más cómoda para los números que tengas):

  1. Multiplicar $N \cdot c$ y luego dividir por $100$.

  2. Convertir $c\%$ a decimal y multiplicar: $N \cdot 0.c$.

  3. Usar fracciones equivalentes si es un porcentaje famoso (ej. para $25\%$, divides $N$
  por $4$).'
definiciones_clave: '- **Cálculo del c% de una cantidad**: Elemento central dentro del estudio
  de Porcentajes.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo del c% de una cantidad.'
ejemplo_guiado:
  enunciado: Calcula el 35% de 240.
  pasos:
  - 'Multiplico la cantidad por el porcentaje: 240 por 35.'
  - 'Calculo el producto: 8.400.'
  - 'Divido entre 100: 8.400 dividido entre 100 es igual a 84. El 35% de 240 es 84.'
