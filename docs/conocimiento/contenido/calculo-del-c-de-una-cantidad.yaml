semantic_id: MAT.NUM.PORCENTAJES.CALCULO_VALOR
resumen_inicial: 'El cálculo del $p\%$ de una cantidad $C$ determina el valor parcial $P$ resultante de multiplicar la cantidad total por el tanto por ciento y dividir el producto entre 100: $P = \frac{p \cdot C}{100}$.'
explicacion_simple: |
  Para calcular cuánto dinero o cantidad representa el $p\%$ de una cifra dada $C$:
  1. Multiplicas el porcentaje $p$ por la cantidad total $C$.
  2. Divides el resultado entre 100.
  Por ejemplo, para saber cuánto es el $20\%$ de $\$50.000$, multiplicas $20 \cdot 50.000 = 1.000.000$ y divides entre 100: $1.000.000 \div 100 = \$10.000$. También puedes usar el número decimal multiplicando $0,20 \cdot 50.000 = \$10.000$.
explicacion_formal: |
  ### Definición formal
  El **valor parcial o porcentaje de una cantidad** $P$ correspondiente al $p\%$ de un valor total $C \in \mathbb{R}^+$ es la función lineal homogénea:
  $$P(C) = \left(\frac{p}{100}\right) \cdot C = d \cdot C = \frac{p \cdot C}{100}$$

  ### Métodos alternativos de cálculo
  1. **Método de la razón decimal**:
     $$P = d \cdot C \quad \text{donde} \quad d = \frac{p}{100}$$
  2. **Método de la regla de tres simple directa**:
     $$\begin{array}{ccc} \text{Cantidad} & & \text{Porcentaje} \\ C & \longrightarrow & 100\% \\ P & \longrightarrow & p\% \end{array} \implies P = \frac{C \cdot p}{100}$$
  3. **Método de fracción irreducible**:
     $$P = \left(\frac{a}{b}\right) \cdot C \quad \text{donde} \quad \frac{a}{b} = \frac{p}{100}$$

  ### Síntesis didáctica
  - Ecuación del valor parcial: $P = \frac{p \cdot C}{100}$.
  - Alternativa decimal: $P = d \cdot C$.
definiciones_clave: |
  - **Valor parcial ($P$)**: Cantidad cuantitativa resultado de aplicar el tanto por ciento a la base $C$.
  - **Base o total ($C$)**: Cantidad numérica sobre la cual actúa el porcentaje.
  - **Operador porcentual**: Fracción $\frac{p}{100}$ que escala linealmente el valor de $C$.
propiedades_relaciones: |
  - **Monotonía y linealidad**: El valor parcial $P$ es directamente proporcional a la cantidad total $C$ y al tanto por ciento $p$.
  - **Suma de partes porcentuales**: Si un total $C$ se divide en $p_1\%$ y $p_2\%$ con $p_1 + p_2 = 100$, entonces $P_1 + P_2 = C$.
ejemplo_guiado:
  enunciado: 'Un computador tiene un precio de $\$600.000$. Si tiene un descuento especial del $15\%$, calcula el monto exacto del descuento en dinero.'
  pasos:
    - 'Paso 1: Identificamos el porcentaje $p = 15$ y el total $C = 600.000$.'
    - 'Paso 2: Escribimos la fórmula del cálculo del valor parcial: $P = \frac{15 \cdot 600.000}{100}$.'
    - 'Paso 3: Simplificamos los dos ceros del 100 con los del 600.000: $P = 15 \cdot 6.000$.'
    - 'Paso 4: Multiplicamos: $P = 90.000$. El monto del descuento es de **$\$90.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular el valor parcial $P$ que representa el $p\%$ de una cantidad total $C$?'
    choices:
      - {text: 'Multiplicar la cantidad $C$ por el porcentaje $p$ y dividir entre 100 ($P = \frac{p \cdot C}{100}$)', is_correct: true}
      - {text: 'Dividir la cantidad $C$ entre el porcentaje $p$ y multiplicar por 100', is_correct: false}
      - {text: 'Restar el porcentaje $p$ a la cantidad $C$', is_correct: false}
      - {text: 'Sumar $p$ y $C$ y dividir entre dos', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar la cantidad $C$ por el porcentaje $p$ y dividir entre 100 ($P = \frac{p \cdot C}{100}$)''. Es la fórmula del valor parcial.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuánto es el $30\%$ de $\$80.000$?'
    choices:
      - {text: '$\$24.000$, calculando $\frac{30 \cdot 80.000}{100} = 30 \cdot 800 = 24.000$', is_correct: true}
      - {text: '$\$2.400$, dividiendo por 1.000', is_correct: false}
      - {text: '$\$240.000$, multiplicando sin dividir por 100', is_correct: false}
      - {text: '$\$50.000$, restando $80.000 - 30.000$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$24.000$, calculando $\frac{30 \cdot 80.000}{100} = 30 \cdot 800 = 24.000$''. $P = 30 \cdot 800 = 24.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la cantidad total $C$ y el porcentaje $p\%$.'
  - 'Paso 2: Convertir el porcentaje a decimal ($d = p/100$) o a fracción.'
  - 'Paso 3: Multiplicar la cantidad total $C$ por el decimal $d$ o la fracción ($P = d \cdot C$).'
  - 'Paso 4: Expresar la respuesta en las unidades originales de la cantidad.'
errores_correccion: |
  - **Error 1:** Olvidar dividir entre 100 al calcular el porcentaje (ej: calcular el $15\%$ de $40$ haciendo $15 \cdot 40 = 600$). **Cómo corregirlo:** Recuerda que el porcentaje expresa partes de cien; **debes dividir el producto final entre 100**: $600 \div 100 = 6$.
  - **Error 2:** Restar o sumar directamente el porcentaje al número sin calcular la cantidad de dinero (ej: restar $600.000 - 15 = 599.985$). **Cómo corregirlo:** Primero se calcula la **cantidad en dinero ($P = 90.000$)** y luego se aplica al total si el problema pide la diferencia.
ejemplos:
  - titulo: 'Cálculo del 10% de una cifra'
    enunciado: '¿El $10\%$ de $\$250.000$ es $\$25.000$?'
    alternativas:
      - 'Sí, pues $250.000 \cdot 0.10 = 25.000$'
      - 'No, es $2.500$'
      - 'No, es $250$'
    respuesta: 'Sí, pues $250.000 \cdot 0.10 = 25.000$'
    solucion_pasos:
      - '1. Formulamos $P = (10 \cdot 250.000) / 100$.'
      - '2. Dividimos: $P = \$25.000$.'
  - titulo: 'Cálculo del 25% (cuarta parte)'
    enunciado: '¿El $25\%$ de $80$ personas corresponde a $20$ personas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $80 / 4 = 20\text{ personas}$.'
  - titulo: 'Cálculo de porcentaje superior al 100%'
    enunciado: '¿El $200\%$ de $45$ es $90$ (el doble)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $2 \cdot 45 = 90$.'
  - titulo: 'Cálculo de porcentaje decimal'
    enunciado: '¿El $0.5\%$ (medio por ciento) de $\$10.000$ es $\$50$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(0.5 / 100) \cdot 10.000 = 0.005 \cdot 10.000 = \$50$.'
errores_frecuentes:
  - 'Multiplicar la cantidad por el porcentaje sin realizar la división requerida por 100.'
  - 'Restar o sumar el número del porcentaje directamente a la cantidad total sin calcular el valor en unidades.'
  - 'Dividir la cantidad total entre el porcentaje en lugar de multiplicarla.'
  - 'Invertir las cifras multiplicando 100 por la cantidad y dividiendo por el porcentaje.'
  - 'El porcentaje parcial calculado es numéricamente igual al valor final con descuento.'
afirmaciones_verdaderas:
  - 'El valor parcial $P$ que representa el $p\%$ de una cantidad $C$ se calcula multiplicando $P = \frac{p \cdot C}{100}$.'
  - 'Calcular el $p\%$ de una cantidad equivale a multiplicar esa cantidad por la representación decimal $d = \frac{p}{100}$.'
al_terminar_debes_poder: 'Calcular el valor parcial de cualquier cantidad mediante la fórmula $P = \frac{p \cdot C}{100}$ o multiplicación decimal $P = d \cdot C$.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
