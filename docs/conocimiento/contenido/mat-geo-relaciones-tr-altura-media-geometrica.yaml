semantic_id: MAT.GEO.RELACIONES_TR.ALTURA_MEDIA_GEOMETRICA
resumen_inicial: 'Propiedad: la altura sobre la hipotenusa es media geométrica de
  las dos proyecciones: conceptos, teoremas, propiedades geométricas y cálculo en
  Perímetros, Áreas y Teoremas.'
explicacion_simple: Así como cada cateto se relaciona con su propia proyección y la
  hipotenusa, la altura misma tiene su propia relación exacta con las dos proyecciones
  que ella genera.
explicacion_formal: '![Altura como media geométrica de las proyecciones](/static/img/geometria/areas-pitagoras/relaciones-tr-altura-media-geometrica.svg)


  ### Definición formal


  Si $m$ y $n$ son las proyecciones de los dos catetos sobre la hipotenusa, la altura
  $h$ cumple $h^2=m\cdot n$.


  ### Desarrollo didáctico


  Si las proyecciones son 4 y 9, la altura es $h=\sqrt{4\times9}=\sqrt{36}=6$.'
definiciones_clave: '- **Propiedad: la altura sobre la hipotenusa es media geométrica
