semantic_id: MAT.NUM.INTERES_COMPUESTO.CALCULO_INTERES
resumen_inicial: 'El cálculo del interés ganado en capitalización compuesta evalúa el beneficio neto restando el principal al monto acumulado: $I = M - C = C \cdot [(1 + i)^n - 1]$.'
explicacion_simple: |
  Si colocas un dinero $C$ en el banco y al final del plazo retiras un monto total $M$, la ganancia que obtuviste por intereses es simplemente la **diferencia entre lo que retiraste y lo que depositaste al inicio**.
  Por ejemplo, si depositaste $\$300.000$ y al cabo de 2 años tienes $\$363.000$, tu interés ganado fue $\$363.000 - $\$300.000$ = $\$63.00$0$.

  ![Interés ganado en capitalización compuesta](/static/img/nodos/calculo-del-interes-ganado-en-capitalizacion-compuesta-intro.svg)
explicacion_formal: |
  ### Definición formal
  El **interés total devengado $I$** en un régimen de interés compuesto es el excedente financiero producido por el capital $C$ al término de $n$ períodos de capitalización a la tasa periódica $i$:
  $$I = M - C$$
  Sustituyendo la expresión del monto compuesto $M = C \cdot (1 + i)^n$:
  $$I = C \cdot (1 + i)^n - C = C \cdot \left[(1 + i)^n - 1\right]$$
  donde:
  - $\left[(1 + i)^n - 1\right]$ es el **factor de interés compuesto**.

  ### Síntesis didáctica
  - Ecuación por diferencia: $I = M - C$.
  - Ecuación factorizada directa: $I = C \cdot \left[(1 + i)^n - 1\right]$.
definiciones_clave: |
  - **Interés devengado ($I$)**: Rentabilidad neta generada exclusivamente por la capitalización del principal.
  - **Factor de interés compuesto**: Expresión adimensional $[(1+i)^n - 1]$ que escala directamente el capital inicial.
propiedades_relaciones: |
  - **Descomposición del monto**: El monto final siempre satisface $M = C + I$.
  - **Crecimiento no lineal del interés**: El interés generado en el período $k+1$ es estrictamente mayor que el generado en el período $k$ ($I_{k+1} = I_k \cdot (1+i)$).
ejemplo_guiado:
  enunciado: 'Un capital de $\$300.000$ se deposita al $10\%$ de interés compuesto anual durante $2$ años. Calcula el interés total ganado.'
  imagen: '/static/img/nodos/calculo-del-interes-ganado-en-capitalizacion-compuesta-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos $C = 300.000$, tasa decimal $i = 0,10$ y períodos $n = 2$.'
    - 'Paso 2: Calculamos el monto final: $M = 300.000 \cdot (1 + 0,10)^2 = 300.000 \cdot 1,21 = 363.000$.'
    - 'Paso 3: Restamos el capital inicial: $I = M - C = 363.000 - 300.000 = 63.000$.'
    - 'Paso 4: Conclusión: El interés total ganado es de **$\$63.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula factorizada para calcular directamente el interés ganado $I$ en régimen compuesto?'
    choices:
      - {text: 'Multiplicar el capital por el factor $[(1+i)^n - 1]$ ($I = C \cdot [(1+i)^n - 1]$)', is_correct: true}
      - {text: 'Multiplicar el capital por la tasa y el tiempo ($I = C \cdot i \cdot n$)', is_correct: false}
      - {text: 'Dividir el monto final entre el capital inicial', is_correct: false}
      - {text: 'Elevar el capital a la potencia $n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar el capital por el factor $[(1+i)^n - 1]$ ($I = C \cdot [(1+i)^n - 1]$)''. Se factoriza $C$ de $M - C$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si inviertes $\$100.000$ al $20\%$ anual compuesto durante $2$ años ($(1,20)^2 = 1,44$), ¿cuánto interés ganas?'
    choices:
      - {text: '$\$44.000$, calculando $100.000 \cdot (1,44 - 1) = 44.000$', is_correct: true}
      - {text: '$\$144.000$, confundiendo el interés con el monto final', is_correct: false}
      - {text: '$\$40.000$, usando interés simple', is_correct: false}
      - {text: '$\$20.000$, calculando solo 1 año', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$44.000$, calculando $100.000 \cdot (1,44 - 1) = 44.000$''. $I = 144.000 - 100.000 = $\$44.00$0$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar capital inicial $C$, tasa decimal $i$ y plazo $n$.'
  - 'Paso 2: Calcular el monto acumulado $M = C \cdot (1 + i)^n$.'
  - 'Paso 3: Restar el capital inicial al monto ($I = M - C$).'
  - 'Paso 4: Alternativamente, calcular $I = C \cdot [(1 + i)^n - 1]$.'
errores_correccion: |
  - **Error 1:** Entregar el monto acumulado $M$ como respuesta cuando se solicita el interés ganado. **Cómo corregirlo:** Debes **restar siempre el capital inicial**: **$I = M - C$**.
  - **Error 2:** Restar el 1 antes de elevar a la potencia (hacer $(1+i-1)^n = i^n$). **Cómo corregirlo:** La potencia se calcula **PRIMERO sobre $(1+i)$** y luego se resta 1 al resultado.
ejemplos:
  - titulo: 'Interés compuesto a 2 años'
    enunciado: 'Si $C = $\$200.00$0$, $i = 0,10$ anual y $n = 2$ años ($(1,10)^2 = 1,21$), ¿cuál es el interés ganado?'
    alternativas:
      - '$\$42.000$'
      - '$\$40.000$'
      - '$\$242.000$'
    respuesta: '$\$42.000$'
    solucion_pasos:
      - '1. $M = 200.000 \cdot 1,21 = 242.000$.'
      - '2. $I = 242.000 - 200.000 = $\$42.00$0$.'
  - titulo: 'Interés con tasa del 5%'
    enunciado: 'Para $\$100.000$ al $5\%$ anual compuesto en 2 años ($(1,05)^2 = 1,1025$), ¿cuánto es el interés?'
    alternativas:
      - '$\$10.250$'
      - '$\$10.000$'
      - '$\$110.250$'
    respuesta: '$\$10.250$'
    solucion_pasos:
      - '1. $I = 100.000 \cdot (1,1025 - 1) = 100.000 \cdot 0,1025 = $\$10.25$0$.'
  - titulo: 'Despeje del capital inicial desde el interés'
    enunciado: 'Si el interés ganado a interés compuesto es $I = $\$21.00$0$ en 2 años al $10\%$ anual, ¿el capital inicial fue $\$100.000$?'
    alternativas:
      - 'Sí, pues $C = 21.000 / [(1,10)^2 - 1] = 21.000 / 0,21 = $\$100.00$0$'
      - 'No, el capital fue $\$210.000$'
      - 'No, el capital fue $\$50.000$'
    respuesta: 'Sí, pues $C = 21.000 / [(1,10)^2 - 1] = 21.000 / 0,21 = $\$100.00$0$'
    solucion_pasos:
      - '1. $C = I / [(1+i)^n - 1] = 21.000 / 0,21 = $\$100.00$0$.'
  - titulo: 'Comparación con ganancia a interés simple'
    enunciado: '¿El interés ganado a interés compuesto en 3 períodos al $10\%$ supera al interés simple en $\$3.100$ para un capital de $\$100.000$?'
    alternativas:
      - 'Sí, pues $I_{\text{comp}} = $\$33.10$0$ e $I_{\text{simp}} = $\$30.00$0$'
      - 'No, rinden exactamente lo mismo'
      - 'No, el interés simple es mayor'
    respuesta: 'Sí, pues $I_{\text{comp}} = $\$33.10$0$ e $I_{\text{simp}} = $\$30.00$0$'
    solucion_pasos:
      - '1. $I_{\text{comp}} = 100.000 \cdot (1,331 - 1) = 33.100$.'
      - '2. $I_{\text{simp}} = 100.000 \cdot 0,10 \cdot 3 = 30.000$.'
      - '3. Diferencia: $33.100 - 30.000 = $\$3.10$0$.'
errores_frecuentes:
  - 'El valor del monto final acumulado $M$ se entrega como el interés ganado sin restar el capital inicial $C$.'
  - 'La resta de la constante $1$ se efectúa dentro de la base del paréntesis antes de elevar al exponente $n$.'
  - 'El interés ganado a interés compuesto se evalúa sumando multiplicativamente los intereses de un solo período.'
  - 'La cantidad de interés producida en el segundo período es idéntica a la generada en el primer período.'
  - 'El factor de interés $[(1+i)^n - 1]$ se multiplica por la tasa $i$ en lugar de multiplicar por el capital $C$.'
afirmaciones_verdaderas:
  - 'El interés ganado a interés compuesto es la diferencia entre el monto final y el capital inicial ($I = M - C$).'
  - 'La fórmula factorizada del interés compuesto corresponde a $I = C \cdot \left[(1 + i)^n - 1\right]$.'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/calculo-del-interes-ganado-en-capitalizacion-compuesta-resumen.svg)

  QUÉ: Calcular el interés neto devengado en operaciones de capitalización compuesta.
  CÓMO: Evaluar la diferencia $I = M - C$ o aplicar la expresión factorizada $I = C \cdot \left[(1 + i)^n - 1\right]$, aislando el rendimiento del principal.
