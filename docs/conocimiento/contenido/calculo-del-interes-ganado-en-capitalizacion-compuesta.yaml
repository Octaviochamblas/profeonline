semantic_id: MAT.NUM.INTERES_COMPUESTO.CALCULO_INTERES
resumen_inicial: 'Cálculo del interés ganado en capitalización compuesta: concepto y propiedades
  fundamentales en Interés compuesto.'
explicacion_simple: 'Si la fórmula del interés compuesto te da siempre el total (con tu capital
  incluido), ¿cómo haces para saber exactamente cuánta ''ganancia pura'' obtuviste? Simple
  lógica: al total, réstale lo que tú pusiste.'
explicacion_formal: "En interés compuesto, la fórmula principal es $M = C(1+i)^t$.\nSi un\
  \ problema te pregunta **exclusivamente por la ganancia** (los intereses), debes proceder\
  \ en dos pasos ineludibles:\n\n1. Usa la fórmula principal para encontrar el dinero total\
  \ que hay en la cuenta al final ($M$).\n2. Al resultado anterior ($M$), réstale tu capital\
  \ inicial ($C$).\n\nFórmula derivada: \n$$I = C(1+i)^t - C$$\nFactorizando C, también se\
  \ puede escribir como:\n$$I = C \\cdot [ (1+i)^t - 1 ]$$"
definiciones_clave: '- **Cálculo del interés ganado en capitalización compuesta**: Elemento
  central dentro del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo del interés ganado en capitalización compuesta.'
ejemplo_guiado:
  enunciado: Se invierten 15.000 pesos al 6% de interés compuesto anual durante 2 años. Calcula
    solo el interés ganado.
  pasos:
  - 'Calculo el Monto Final: 15.000 por (1,06 elevado a 2), es decir 15.000 por 1,1236.'
  - 'Calculo el monto: 15.000 por 1,1236 es igual a 16.854.'
  - 'Resto el capital inicial: 16.854 menos 15.000 es igual a 1.854. Se ganaron 1.854 pesos
    de interés puro.'
