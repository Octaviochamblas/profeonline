procedimiento:
- 'Paso 1: Calcula el Monto Final $M = C \cdot (1+i)^t$.'
- 'Paso 2: Al resultado $M$, réstale el capital inicial $C$.'
- 'Paso 3: El número resultante es el interés puro ganado.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del interés
  ganado en capitalización compuesta.
ejemplos:
- titulo: Obteniendo la ganancia pura
  enunciado: Se invierten $10.000 al 10% de interés compuesto anual por 2 años. ¿Cuánto dinero
    se ganó solo por concepto de intereses?
  solucion_pasos:
  - 'Calculamos el Monto Final: $M = 10.000 \cdot (1.10)^2$.'
  - 'Resolvemos la potencia: $(1.10)^2 = 1.21$.'
  - M = $10.000 \cdot 1.21 = 12.100$. (Ese es el total en la cuenta).
  - 'Restamos el capital: Interés = $12.100 - 10.000 = 2.100$. Se ganaron $2.100 puros.'
- titulo: Ejemplo 2
  enunciado: Con capital 8.000, tasa 0,05 y tiempo 2 años, ¿cuál es el interés ganado?
  alternativas:
  - '820'
  - '800'
  - '20'
  respuesta: '820'
  solucion_pasos:
  - M es 8.000 por 1,1025, o sea 8.820; el interés es 8.820 menos 8.000, o sea 820.
- titulo: Ejemplo 3
  enunciado: Con capital 20.000, tasa 0,10 y tiempo 1 año, ¿cuál es el interés ganado?
  alternativas:
  - '2.000'
  - '22.000'
  - '200'
  respuesta: '2.000'
  solucion_pasos:
  - M es 20.000 por 1,10, o sea 22.000; el interés es 22.000 menos 20.000, o sea 2.000.
- titulo: ¿La fórmula I=C·[(1+i)^t - 1] da el mismo resultado que calcular M y luego restar
    C?
  respuesta: Sí
  solucion_pasos:
  - Es la misma fórmula, solo que factorizada de otra forma.
errores_frecuentes:
- Responder con el Monto Final cuando se pregunta por 'los intereses'.
- Tratar de usar la fórmula $I = C \cdot i \cdot t$ (que es solo para interés simple).
- Responder con el Monto Final cuando la pregunta pide específicamente los intereses.
- Tratar de usar la fórmula I igual a C por i por t, que corresponde solo al interés simple.
- Olvidar restar el capital inicial después de calcular el monto total, dejando el resultado
  incompleto.
afirmaciones_verdaderas:
- La propiedad de cálculo del interés ganado en capitalización compuesta preserva la consistencia
  lógica.
- Para obtener el interés puro en capitalización compuesta, siempre se debe calcular primero
  el Monto Final y luego restarle el capital inicial.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del interés ganado
  en capitalización compuesta.
