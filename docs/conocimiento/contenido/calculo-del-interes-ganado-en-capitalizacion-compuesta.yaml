semantic_id: MAT.NUM.INTERES_COMPUESTO.CALCULO_INTERES
resumen_inicial: 'El cálculo del interés ganado en capitalización compuesta determina la utilidad neta $I$ mediante la resta entre el monto final y el capital inicial: $I = M - C = C \cdot \left[(1 + i)^n - 1\right]$.'
explicacion_simple: |
  Para saber **únicamente cuánto dinero ganaste de intereses** (sin incluir tu capital original):
  1. Calculas primero el monto final total acumulado $M = C \cdot (1 + i)^n$.
  2. Le restas el dinero original que pusiste $C$: $I = M - C$.
  Por ejemplo, si invertiste $\$100.000$ y al cabo de 3 años tienes un monto final de $\$133.100$, la ganancia pura en intereses es $\$133.100 - \$100.000 = \$33.100$. También puedes usar la fórmula directa multiplicando el capital por la expresión $[(1+i)^n - 1]$.
explicacion_formal: |
  ### Definición formal
  El **interés ganado o costo financiero acumulado $I$** bajo régimen de capitalización compuesta es la diferencia entre el valor futuro $M$ y el principal original $C$:
  $$I = M - C$$

  ### Expresión en función del Capital Inicial
  Sustituyendo la fórmula del monto $M = C \cdot (1 + i)^n$:
  $$I = C \cdot (1 + i)^n - C = C \cdot \left[(1 + i)^n - 1\right]$$
  donde:
  - $[(1 + i)^n - 1]$ es el **factor de interés compuesto neto**.
  - $i$ es la tasa periódica efectiva.
  - $n$ es el número total de períodos de capitalización.

  ### Comparación de Rendimientos por Período
  A diferencia del régimen simple (donde la ganancia de cada período es fija $I_k = C \cdot i$), en capitalización compuesta la ganancia del período $k$ es estrictamente mayor que la del período $k-1$:
  $$\Delta I_k = M_k - M_{k-1} = C \cdot i \cdot (1 + i)^{k-1}$$

  ### Síntesis didáctica
  - Ecuación por resta: $I = M - C$.
  - Ecuación por factor neto: $I = C \cdot \left[(1 + i)^n - 1\right]$.
definiciones_clave: |
  - **Interés ganado ($I$)**: Ganancia monetaria neta resultante del proceso de capitalización.
  - **Factor de interés neto**: Término $[(1 + i)^n - 1]$ que escala el capital para entregar solo la utilidad.
  - **Margen de rentabilidad sobre el principal**: Razón $\frac{I}{C} = (1 + i)^n - 1$.
propiedades_relaciones: |
  - **Crecimiento acelerado**: El interés generado en el período $n$ es mayor que el generado en cualquier período anterior debido a la acumulación de la base.
  - **Independencia del capital depositado**: La tasa de rendimiento relativo $\frac{I}{C}$ depende únicamente de la tasa $i$ y del número de períodos $n$.
ejemplo_guiado:
  enunciado: 'Un inversionista deposita $\$500.000$ a una tasa del $10\%$ anual de interés compuesto durante $2$ años. Calcula únicamente el monto del interés ganado.'
  pasos:
    - 'Paso 1: Identificamos $C = 500.000$, tasa decimal $i = 0,10$ y períodos $n = 2$.'
    - 'Paso 2: Calculamos el monto acumulado final $M = 500.000 \cdot (1,10)^2 = 500.000 \cdot 1,21 = 605.000$.'
    - 'Paso 3: Restamos el capital inicial al monto acumulado: $I = M - C = 605.000 - 500.000$.'
    - 'Paso 4: Calculamos: $I = 105.000$. El interés neto ganado es de **$\$105.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular directamente el interés neto ganado $I$ sin obtener previamente la cifra del monto final?'
    choices:
      - {text: 'Multiplicar el capital inicial por el factor neto ($I = C \cdot \left[(1 + i)^n - 1\right]$)', is_correct: true}
      - {text: 'Multiplicar el capital por la tasa y el tiempo ($I = C \cdot i \cdot n$)', is_correct: false}
      - {text: 'Restar la tasa decimal al capital inicial', is_correct: false}
      - {text: 'Dividir el capital entre el número de períodos', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar el capital inicial por el factor neto ($I = C \cdot \left[(1 + i)^n - 1\right]$)''. Factoriza $C$ en $M - C$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una inversión de $\$200.000$ alcanza un monto final de $\$242.000$ a interés compuesto, ¿cuánto fue el interés ganado?'
    choices:
      - {text: '$\$42.000$, restando el monto final menos el capital inicial ($242.000 - 200.000 = 42.000$)', is_correct: true}
      - {text: '$\$242.000$, entregando el monto final', is_correct: false}
      - {text: '$\$20.000$, dividiendo por dos', is_correct: false}
      - {text: '$\$442.000$, sumando ambas cifras', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$42.000$, restando el monto final menos el capital inicial ($242.000 - 200.000 = 42.000$)''. $I = M - C$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular el monto acumulado total $M = C \cdot (1 + i)^n$.'
  - 'Paso 2: Restar el capital inicial $C$ al monto final obtenido ($I = M - C$).'
  - 'Paso 3: Alternativamente, evaluar el factor neto $[(1 + i)^n - 1]$ y multiplicarlo por el capital $C$.'
  - 'Paso 4: Expresar el interés ganado en unidades monetarias.'
errores_correccion: |
  - **Error 1:** Confundir el monto acumulado final $M$ con la respuesta del interés ganado $I$. **Cómo corregirlo:** La ganancia neta exige **restar el capital inicial: $I = M - C$**.
  - **Error 2:** Usar la fórmula de interés simple $C \cdot i \cdot n$ para calcular las ganancias. **Cómo corregirlo:** En régimen compuesto los intereses crecen; la fórmula correcta es **$I = C \cdot [(1+i)^n - 1]$**.
ejemplos:
  - titulo: 'Cálculo de interés neto a 3 años'
    enunciado: 'Para $\$100.000$ al $10\%$ compuesto por 3 años ($M = \$133.100$), ¿el interés ganado es $\$33.100$?'
    alternativas:
      - 'Sí, pues $I = 133.100 - 100.000 = 33.100$'
      - 'No, es $\$30.000$'
      - 'No, es $\$133.100$'
    respuesta: 'Sí, pues $I = 133.100 - 100.000 = 33.100$'
    solucion_pasos:
      - '1. Monto $M = 100.000 \cdot 1,1^3 = 133.100$.'
      - '2. Interés $I = 133.100 - 100.000 = 33.100$.'
  - titulo: 'Interés neto con factor directo'
    enunciado: 'Para $\$200.000$ al $5\%$ por 2 años, ¿el factor neto es $1,05^2 - 1 = 0,1025$ y el interés es $\$20.500$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $200.000 \cdot 0,1025 = \$20.500$.'
  - titulo: 'Ganancia en el segundo período'
    enunciado: 'En el ejemplo anterior, ¿el interés del año 1 es $\$10.000$ y el del año 2 es $\$10.500$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Año 1: $100.000 \cdot 0,05 = 5.000$. Año 2: $105.000 \cdot 0,05 = 5.250$ (para $100k$). Para $200k$: $10k$ y $10,5k$.'
  - titulo: 'Porcentaje de ganancia sobre el principal'
    enunciado: '¿El porcentaje de ganancia sobre el principal es $\frac{I}{C} \cdot 100\%$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Mide el rendimiento relativo acumulado.'
errores_frecuentes:
  - 'Entregar la cifra del monto acumulado $M$ como respuesta final omitiendo la resta del capital inicial.'
  - 'Calcular los intereses mediante el producto lineal de interés simple $C \cdot i \cdot n$.'
  - 'La ganancia de interés acumulado en régimen compuesto permanece constante año a año.'
  - 'Restar la constante 1 antes de elevar el factor a la potencia del número de períodos.'
  - 'Dividir el monto final entre el tiempo para intentar hallar el interés ganado.'
afirmaciones_verdaderas:
  - 'El interés ganado en capitalización compuesta se calcula restando el capital inicial al monto final ($I = M - C$).'
  - 'La ganancia periódica a interés compuesto es estrictamente creciente a lo largo del tiempo.'
al_terminar_debes_poder: 'Calcular la ganancia o utilidad neta $I = M - C = C \cdot \left[(1 + i)^n - 1\right]$ en operaciones compuestas.'
