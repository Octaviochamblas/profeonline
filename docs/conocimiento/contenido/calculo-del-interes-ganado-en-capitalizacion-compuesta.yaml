semantic_id: MAT.NUM.INTERES_COMPUESTO.CALCULO_INTERES
resumen_inicial: 'Cálculo del interés ganado en capitalización compuesta: concepto
  y propiedades fundamentales en Interés compuesto.'
explicacion_simple: 'Si la fórmula del interés compuesto te da siempre el total (con
  tu capital incluido), ¿cómo haces para saber exactamente cuánta ''ganancia pura''
  obtuviste? Simple lógica: al total, réstale lo que tú pusiste.'
explicacion_formal: "En interés compuesto, la fórmula principal es $M = C(1+i)^t$.\n\
  Si un problema te pregunta **exclusivamente por la ganancia** (los intereses), debes\
  \ proceder en dos pasos ineludibles:\n\n1. Usa la fórmula principal para encontrar\
  \ el dinero total que hay en la cuenta al final ($M$).\n2. Al resultado anterior\
  \ ($M$), réstale tu capital inicial ($C$).\n\nFórmula derivada: \n$$I = C(1+i)^t\
  \ - C$$\nFactorizando C, también se puede escribir como:\n$$I = C \\cdot [ (1+i)^t\
  \ - 1 ]$$"
definiciones_clave: '- **Cálculo del interés ganado en capitalización compuesta**:
  Elemento central dentro del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo del interés ganado en capitalización compuesta.'
