resumen_inicial: 'El interés ganado $I$ en capitalización compuesta se obtiene restando
  el capital inicial $C$ al monto final acumulado $M$: $I = M - C = C \cdot \left[(1
  + i)^n - 1\right]$.'
explicacion_simple: Para calcular únicamente la ganancia o interés total que produjo
  nuestra inversión compuesta, sacamos el monto final $M$ y le restamos el capital
  inicial $C$ que habíamos puesto de nuestro bolsillo.
explicacion_formal: 'La **Fórmula de la Ganancia de Interés Compuesto $I$** se define
  por la resta entre el valor futuro y el presente:


  $$I = M - C = C \cdot (1 + i)^n - C = C \cdot \left[ (1 + i)^n - 1 \right]$$


  **Factor de ganancia compuesto:**

  - $F_{int} = (1 + i)^n - 1$ representa el porcentaje neto de rendimiento total generado
  por la inversión sobre el capital original.'
definiciones_clave: '- **Interés compuesto ganado $I$**: Beneficio neto $I = C \cdot
  \left[(1 + i)^n - 1\right]$.'
propiedades_relaciones: '- **Ganancia neta sobre capital**: Razón de ganancia total
  $I / C = (1 + i)^n - 1$.'
ejemplo_guiado:
  enunciado: Un capital de \$500.000 se invierte al $8\%$ compuesto anual durante
    $2$ años. Calcule únicamente el interés ganado.
  pasos:
  - 'Paso 1: Calcular el monto acumulado: $M = 500.000 \cdot 1,08^2 = 500.000 \cdot
    1,1664 = 583.200$.'
  - 'Paso 2: Restar el capital inicial: $I = 583.200 - 500.000 = 83.200$.'
  - 'Conclusión: El interés compuesto ganado es de \$83.200.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se obtiene el interés ganado I en capitalización compuesta?
  choices:
  - text: Restando el capital inicial C al monto acumulado final M (I = M - C)
    is_correct: true
  - text: Multiplicando I = M · C
    is_correct: false
  - text: Sumando I = M + C
    is_correct: false
  - text: Dividiendo I = C / M
    is_correct: false
  explanation: La alternativa correcta es 'Restando el capital inicial C al monto
    acumulado final M (I = M - C)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $500.000 al 8% compuesto en 2 años, ¿cuál fue
    el interés ganado?
  choices:
  - text: 83.200 $
    is_correct: true
  - text: 80.000 $
    is_correct: false
  - text: 583.200 $
    is_correct: false
  - text: 40.000 $
    is_correct: false
  explanation: La alternativa correcta es '83.200 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la ganancia neta de interés
  $I = C \cdot \left[(1 + i)^n - 1\right]$ restando el capital inicial al monto final.
semantic_id: MAT.NUM.INTERES_COMPUESTO.CALCULO_INTERES
procedimiento:
- 'Paso 1: Identificar las variables financieras ($C, i, n, M, I, R$) e igualar la
  tasa al período de capitalización.'
- 'Paso 2: Aplicar la fórmula exponencial de capitalización $M = C \cdot (1 + i)^n$
  o su variante correspondiente.'
- 'Paso 3: Resolver numéricamente o mediante logaritmos y verificar la coherencia
  económica.'
errores_correccion: '- **Error 1: Calcular el interés compuesto multiplicando el tiempo
  por la tasa en forma lineal ($C \cdot i \cdot n$).** **Cómo corregirlo:** En régimen
  compuesto el factor es exponencial $(1 + i)^n$, NO lineal.


  - **Error 2: No ajustar la tasa de interés a la frecuencia de capitalización (ej:
  usar tasa anual en capitalización mensual).** **Cómo corregirlo:** La tasa DEBE
  dividirse entre el número de períodos del año ($i = r / m$) y el tiempo multiplicarse
  ($n = m \cdot t$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_COMPUESTO.CALCULO_INTERES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés compuesto.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización exponencial.
  alternativas:
  - Cumple el modelo
  - No cumple
  - Indeterminado
  respuesta: Cumple el modelo
  solucion_pasos:
  - Demostración formal por $M = C(1+i)^n$.
- titulo: ¿Supera el interés compuesto al simple para t > 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, debido al efecto acumulativo de la capitalización de intereses.
- titulo: ¿Se requiere logaritmo para despejar el número de períodos n?
  respuesta: Sí
  solucion_pasos:
  - Sí, para bajar el exponente $n$ mediante la propiedad logarítmica.
errores_frecuentes:
- Usar la fórmula lineal del interés simple $C \cdot i \cdot t$ para resolver problemas
  de capitalización compuesta.
- No dividir la tasa de interés anual entre 12 cuando el período de capitalización
  es mensual.
- Omitir restar el capital inicial $C$ al monto acumulado final $M$ al calcular únicamente
  el interés ganado.
- Declarar que dos cuotas de interés compuesto acumulado crecen en forma de progresión
  aritmética constante.
- Sumar directamente las cuotas de amortización sin descontar la tasa de interés en
  el valor presente.
afirmaciones_verdaderas:
- El interés compuesto se caracteriza porque los intereses de cada período se suman
  al capital para generar nuevos intereses.
- El monto acumulado en régimen compuesto sigue un modelo de función exponencial $M
  = C \cdot (1 + i)^n$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
