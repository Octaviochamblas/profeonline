procedimiento:
- 'Paso 1: Localizar el ángulo agudo dato en el triángulo rectángulo.'
- 'Paso 2: Reconocer cuál es el cateto opuesto (frontal) y cuál es el cateto adyacente (contiguo).'
- 'Paso 3: Aplicar $\sin(\alpha) = a/c$, $\cos(\alpha) = b/c$ o $\tan(\alpha) = a/b$.'
- 'Paso 4: Resolver la ecuación lineal resultante para hallar la longitud o razón pedida.'
- 'Paso 5: Comprobar la coherencia del resultado con el Teorema de Pitágoras.'
errores_correccion: 'Ten siempre presente el ángulo de referencia: si cambias al otro ángulo agudo, los roles de cateto opuesto y adyacente se invierten exactamente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor correspondiente calculado a partir de la definición trigonométrica?
  alternativas:
  - '$\frac{3}{5} = 0{,}6$'
  - 'Valor incorrecto 1'
  - 'Valor incorrecto 2'
  respuesta: '$\frac{3}{5} = 0{,}6$'
  solucion_pasos:
  - 'Vale $\frac{3}{5} = 0{,}6$, ya que $\sin(\alpha) = \frac{\text{Opuesto}}{\text{Hipotenusa}} = \frac{3}{5} = 0{,}6$.'
- titulo: Ejemplo 2
  enunciado: ¿El seno y el coseno de un ángulo agudo pueden ser mayores que 1 en un triángulo rectángulo?
  alternativas:
  - No, siempre son estrictamente menores que 1 porque ningún cateto puede superar a la hipotenusa
  - Sí, siempre son mayores que 1
  - Solo si los catetos son iguales
  respuesta: No, siempre son estrictamente menores que 1 porque ningún cateto puede superar a la hipotenusa
  solucion_pasos:
  - 'Como la hipotenusa $c$ es el lado más largo ($c > a$ y $c > b$), las fracciones $a/c$ y $b/c$ son siempre menores que 1.'
- titulo: ¿La tangente de un ángulo agudo es igual al seno dividido por el coseno?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $\tan(\alpha) = \frac{\sin(\alpha)}{\cos(\alpha)} = \frac{a/c}{b/c} = \frac{a}{b}$.'
- titulo: ¿La razón seno utiliza el cateto adyacente dividido por la hipotenusa?
  respuesta: 'No'
  solucion_pasos:
  - 'No, el seno usa el cateto OPUESTO dividido por la hipotenusa ($a/c$). El cateto adyacente sobre la hipotenusa corresponde al COSENO ($b/c$).'
errores_frecuentes:
- 'Confundir el cateto opuesto con el adyacente al cambiar el ángulo de referencia.'
- 'Dividir por el cateto en vez de por la hipotenusa al calcular el seno o coseno.'
- 'Creer que la tangente no puede ser mayor que 1 (la tangente sí puede superar a 1 cuando el opuesto es mayor que el adyacente).'
- 'Olvidar que las razones trigonométricas en triángulos rectángulos solo aplican a ángulos agudos.'
- 'No verificar el modo de la calculadora (Grados sexagesimales DEG vs Radianes RAD).'
afirmaciones_verdaderas:
- 'En todo triángulo rectángulo, $\sin(\alpha) = \frac{\text{Cateto Opuesto}}{\text{Hipotenusa}}$ y $\cos(\alpha) = \frac{\text{Cateto Adyacente}}{\text{Hipotenusa}}$.'
- 'La identidad pitagórica fundamental establece que $\sin^2(\alpha) + \cos^2(\alpha) = 1$.'
al_terminar_debes_poder: |
  **QUÉ:** Definir, identificar y calcular el seno, coseno y tangente de ángulos agudos en triángulos rectángulos.

  **CÓMO:** Reconociendo los catetos opuesto y adyacente respecto al ángulo de referencia y aplicando las razones $\sin\alpha = \frac{a}{c}$, $\cos\alpha = \frac{b}{c}$ y $\tan\alpha = \frac{a}{b}$.

  ![Resumen de Razones Trigonométricas](/static/img/nodos/definicion-del-seno-de-un-angulo-agudo-como-razon-cateto-opuesto-hipotenusa-resumen.svg)
