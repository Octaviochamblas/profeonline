    Aplica la definición trigonométrica y el procedimiento de despeje para determinar el valor solicitado en el triángulo rectángulo.
  pasos:
  - 'Paso 1: Identificar el ángulo agudo de referencia $\alpha$ y clasificar los lados en cateto opuesto, cateto adyacente e hipotenusa.'
  - 'Paso 2: Seleccionar la razón trigonométrica adecuada (seno, coseno o tangente).'
  - 'Paso 3: Escribir la ecuación trigonométrica y sustituir los valores numéricos conocidos.'
  - 'Paso 4: Despejar algebraicamente la incógnita mediante multiplicación o división.'
  - 'Paso 5: Registrar la solución acompañada de su unidad métrica o como valor adimensional.'
