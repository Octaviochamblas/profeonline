- placement: after_ejemplo_guiado
  question: En un triángulo rectángulo de catetos 3 cm y 4 cm con hipotenusa 5 cm, ¿cuánto vale el seno del ángulo opuesto al cateto de 3 cm?
  choices:
  - text: $\frac{3}{5} = 0{,}6$
