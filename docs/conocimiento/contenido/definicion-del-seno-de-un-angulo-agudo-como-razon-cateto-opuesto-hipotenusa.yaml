semantic_id: MAT.GEO.TRIGONOMETRIA_BASICA.SENO_DEFINICION
resumen_inicial: 'El seno de un ángulo agudo $\alpha$ en un triángulo rectángulo es la razón entre la longitud del cateto opuesto y la longitud de la hipotenusa: $\sin(\alpha) = \frac{\text{Cateto Opuesto}}{\text{Hipotenusa}}$.'
explicacion_simple: |
  ![Definición del Seno: sen(α) = Opuesto / Hipotenusa](/static/img/nodos/definicion-del-seno-de-un-angulo-agudo-como-razon-cateto-opuesto-hipotenusa-intro.svg)

  Divides el lado que está al frente del ángulo por la hipotenusa (el lado más largo).
explicacion_formal: |
  ### Definición formal
  En un triángulo rectángulo $\Delta ABC$ con ángulo recto en $C$ ($\gamma = 90^\circ$) y ángulo agudo $\alpha = \angle A$, se define el **seno** del ángulo $\alpha$, denotado $\sin(\alpha)$, como la razón geométrica invariante:

  $$\sin(\alpha) = \frac{\|\overline{BC}\|}{\|\overline{AB}\|} = \frac{\text{Cateto Opuesto}}{\text{Hipotenusa}} = \frac{a}{c}$$

  ### Desglose simbólico y geométrico
  - $a = \|\overline{BC}\|$: Cateto opuesto al vértice $A$.
  - $c = \|\overline{AB}\|$: Hipotenusa del triángulo rectángulo ($c > a > 0$).
  - Acotamiento estricto: Como $a < c$, se cumple $0 < \sin(\alpha) < 1$ para todo ángulo agudo $\alpha \in ]0^\circ, 90^\circ[$.
  - Invarianza por semejanza: Por el criterio AA, todo triángulo rectángulo con ángulo $\alpha$ es semejante, garantizando que el cociente $\frac{a}{c}$ dependa únicamente del ángulo $\alpha$ y no del tamaño del triángulo.

  ### Síntesis didáctica
  El seno cuantifica la proyección vertical normalizada de un segmento en el plano y es la base de las ondas armónicas y la física ondulatoria.
definiciones_clave: |
  - **Cateto Opuesto**: Lado situado enfrente del ángulo agudo considerado.
  - **Cateto Adyacente**: Lado que forma parte del ángulo agudo considerado junto con la hipotenusa.
  - **Hipotenusa**: Lado de mayor longitud opuesto al ángulo recto de $90^\circ$.
  - **Razón trigonométrica**: Cociente adimensional entre dos lados de un triángulo rectángulo.
propiedades_relaciones: |
  - **SOH-CAH-TOA**: Regla mnemotécnica para $\sin = \text{Op}/\text{Hip}$, $\cos = \text{Ady}/\text{Hip}$, $\tan = \text{Op}/\text{Ady}$.
  - **Identidad pitagórica**: $\sin^2(\alpha) + \cos^2(\alpha) = 1$.
  - **Cociente de tangente**: $\tan(\alpha) = \frac{\sin(\alpha)}{\cos(\alpha)}$.
ejemplo_guiado:
