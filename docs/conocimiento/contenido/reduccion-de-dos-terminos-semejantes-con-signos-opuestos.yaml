semantic_id: MAT.ALG.REDUCCION_OPERATIVA.SIGNOS_OPUESTOS
resumen_inicial: 'La reducción de dos términos semejantes con signos opuestos consiste en restar el menor del mayor en valor absoluto, asignar al resultado el signo del coeficiente de mayor valor absoluto y mantener el factor literal.'
explicacion_simple: |
  Para reducir dos términos semejantes que tienen **signos opuestos** (uno positivo y uno negativo):
  - **Paso 1: Restar** el coeficiente de menor valor absoluto del coeficiente de mayor valor absoluto.
  - **Paso 2: Asignar el signo** del coeficiente que tenga **mayor valor absoluto**.
  - **Paso 3: Conservar el factor literal** idéntico.
  - **Caso Especial (Cancelación)**: Si los coeficientes son opuestos exactos (ej: $5x$ y $-5x$), el resultado es **$0$**.
  - **Ejemplo 1**: $9x - 4x$
    - Restamos: $9 - 4 = 5$.
    - Signo del mayor ($9$ es positivo): $+$.
    - Resultado: **$5x$**.
  - **Ejemplo 2**: $-12a^2 + 5a^2$
    - Restamos: $12 - 5 = 7$.
    - Signo del mayor ($12$ es negativo): $-$.
    - Resultado: **$-7a^2$**.
explicacion_formal: |
  ### Definición formal
  Sean $T_1 = c_1 M$ y $T_2 = c_2 M$ dos monomios semejantes de coeficientes no nulos con signos opuestos ($\operatorname{sgn}(c_1) = -\operatorname{sgn}(c_2)$). La reducción aditiva viene dada por la diferencia de magnitudes ajustada por la signatura dominante:

  $$c_1 M + c_2 M = (c_1 + c_2) M = \operatorname{sgn}(c_{\max}) \cdot \Big| |c_1| - |c_2| \Big| \cdot M$$

  donde $c_{\max} = \arg\max_{c \in \{c_1, c_2\}} |c|$.

  ### Elemento Neutro y Cancelación de Opuestos Aditivos
  Si los coeficientes son inversos aditivos exactos ($c_1 = -c_2 \iff c_1 + c_2 = 0$):

  $$c_1 M + (-c_1 M) = (c_1 - c_1) M = 0 \cdot M = 0$$

  ### Síntesis didáctica
  La reducción con signos opuestos es el mecanismo de balance nulo en ecuaciones de primer grado y conservación de energía.
definiciones_clave: |
  - **Reducción por signos opuestos**: Sustracción de magnitudes absolutas entre dos coeficientes de distinta signatura.
  - **Signo del mayor valor absoluto**: Criterio por el cual el resultado hereda el signo de la constante de mayor tamaño.
  - **Cancelación aditiva ($c M - c M = 0$)**: Anulación completa del término cuando los coeficientes son opuestos exactos.
propiedades_relaciones: |
  - **Disminución de magnitud**: El valor absoluto del coeficiente resultante es estrictamente menor que el mayor de los coeficientes iniciales ($|c_1 + c_2| < \max(|c_1|, |c_2|)$).
  - **Simetría de cancelación**: $A - A = 0$ para cualquier término algebraico $A$.
ejemplo_guiado:
  enunciado: 'Reduce la expresión $8x^2 y - 15x^2 y$.'
  pasos:
    - 'Paso 1: Verificamos la semejanza: Ambos términos poseen el factor literal $x^2 y$.'
    - 'Paso 2: Identificamos los signos: $+8$ y $-15$ (signos opuestos).'
    - 'Paso 3: Restamos los valores absolutos: $15 - 8 = 7$.'
    - 'Paso 4: Determinamos el signo del coeficiente de mayor valor absoluto: $|-15| = 15 > 8 = |8| \implies$ Signo negativo $-$.'
    - 'Paso 5: Escribimos el coeficiente final con el factor literal: $-7x^2 y$.'
    - 'Conclusión: La expresión reducida es **$-7x^2 y$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué resultado se obtiene al reducir dos términos semejantes de coeficientes opuestos exactos como $7k$ y $-7k$?'
    choices:
      - {text: 'El resultado es cero ($0$), por la propiedad del inverso aditivo', is_correct: true}
      - {text: 'El resultado es $14k$', is_correct: false}
      - {text: 'El resultado es $k$', is_correct: false}
      - {text: 'El resultado es $-14k$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es cero ($0$), por la propiedad del inverso aditivo''. Cancelación $7 - 7 = 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la reducción de la expresión $-10m + 16m$?'
    choices:
      - {text: 'El resultado es $+6m$, porque se resta $16 - 10 = 6$ y se conserva el signo del mayor ($+16$)', is_correct: true}
      - {text: 'El resultado es $-26m$', is_correct: false}
      - {text: 'El resultado es $-6m$', is_correct: false}
      - {text: 'El resultado es $26m$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $+6m$, porque se resta $16 - 10 = 6$ y se conserva el signo del mayor ($+16$)''. Resta $16 - 10 = +6$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar que los dos términos compartan el mismo factor literal.'
  - 'Paso 2: Restar los valores absolutos de los coeficientes (mayor menos menor).'
  - 'Paso 3: Asignar al número obtenido el signo del coeficiente que tiene mayor valor absoluto.'
  - 'Paso 4: Adjuntar el factor literal sin modificar sus potencias.'
errores_correccion: |
  - **Error 1:** Sumar los coeficientes en lugar de restarlos cuando tienen signos opuestos (escribir $-8x + 3x = -11x$). **Cómo corregirlo:** Al tener signos opuestos **SE DEBEN RESTAR ($8 - 3 = 5 \implies -5x$)**.
  - **Error 2:** Poner siempre signo positivo por la regla de menos por más. **Cómo corregirlo:** En la resta **SE HEREDA EL SIGNO DEL MAYOR EN VALOR ABSOLUTO**, no se usa la regla de signos del producto.
ejemplos:
  - titulo: 'Mayor positivo'
    enunciado: '¿Cuál es la reducción de $-5a + 12a$?'
    alternativas:
      - '$7a$'
      - '$-17a$'
      - '$-7a$'
    respuesta: '$7a$'
    solucion_pasos:
      - '1. Resta: $12 - 5 = 7$.'
      - '2. Signo de $+12 \implies +7a$.'
  - titulo: 'Mayor negativo'
    enunciado: '¿Cuál es la reducción de $4x^2 - 11x^2$?'
    alternativas:
      - '$-7x^2$'
      - '$7x^2$'
      - '$-15x^2$'
    respuesta: '$-7x^2$'
    solucion_pasos:
      - '1. Resta: $11 - 4 = 7$.'
      - '2. Signo de $-11 \implies -7x^2$.'
  - titulo: 'Cancelación total'
    enunciado: '¿Es la reducción de $-9y^4 + 9y^4$ igual a $0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-9 + 9 = 0 \implies 0 \cdot y^4 = 0$.'
  - titulo: 'Coeficiente unitario implícito'
    enunciado: 'Para $-x + 6x$, ¿se resta $6 - 1 = 5$ dando $5x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-x$ tiene coeficiente $-1 \implies -1 + 6 = +5x$.'
errores_frecuentes:
  - 'Sumar los coeficientes numéricos en lugar de restarlos al reducir dos términos con signos opuestos.'
  - 'Aplicar erróneamente la regla de signos del producto al seleccionar el signo del resultado final.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Dejar la variable sola x al anularse los coeficientes opuestos en lugar de escribir cero.'
  - 'Modificar los exponentes de las variables al ejecutar la resta de coeficientes.'
afirmaciones_verdaderas:
  - 'Al reducir dos términos semejantes de signos opuestos se restan sus coeficientes en valor absoluto y se hereda el signo del de mayor magnitud.'
  - 'La suma de dos términos semejantes con coeficientes opuestos exactos da como resultado cero.'
al_terminar_debes_poder: 'Reducir dos términos semejantes con signos opuestos restando sus coeficientes y aplicando el signo del de mayor valor absoluto.'
