resumen_inicial: La reducción de dos términos semejantes con signos opuestos se efectúa
  restando el coeficiente de menor valor absoluto del mayor y anteponiendo el signo
  del coeficiente dominante.
explicacion_simple: Cuando tenemos dos términos semejantes con signos distintos (uno
  positivo y otro negativo), en lugar de sumar, restamos los números y le dejamos
  a la respuesta el signo del número más grande. Por ejemplo, $8x - 3x = 5x$, y en
  $-10y + 4y = -6y$.
explicacion_formal: 'Dados $T_1 = c_1 L$ y $T_2 = c_2 L$ con $\text{sgn}(c_1) \neq
  \text{sgn}(c_2)$, la **Reducción de Signos Opuestos** establece:


  $$T_1 + T_2 = (c_1 + c_2)L$$


  $$\text{Si } |c_1| > |c_2| \implies \text{sgn}(c_1 + c_2) = \text{sgn}(c_1) \quad
  \text{y } |c_1 + c_2| = |c_1| - |c_2|$$


  > **Complemento didáctico:** La reducción de signos opuestos realiza la cancelación
  parcial de magnitudes escalares opuestas.'
definiciones_clave: '- **Reducción de signos opuestos**: Sustracción de coeficientes
  conservando el signo del término de mayor valor absoluto.'
propiedades_relaciones: '- **Inverso aditivo**: Si $c_1 = -c_2$, la reducción de $c_1
  L + c_2 L = 0$ (se anulan completamente).'
ejemplo_guiado:
  enunciado: Reduzca la expresión $E = 14x^2y - 19x^2y$.
  pasos:
  - 'Paso 1: Identificar la parte literal común: $L = x^2y$.

    - Paso 2: Identificar coeficientes: $+14$ y $-19$ (signos opuestos).'
  - 'Paso 3: Determinar el mayor valor absoluto: $|-19| = 19 > |14| = 14$.'
  - 'Paso 4: Restar las magnitudes: $19 - 14 = 5$.'
  - 'Paso 5: Asignar el signo del mayor ($-19 \to$ negativo): $-5$.'
  - 'Conclusión: El resultado reducido es $-5x^2y$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué signo se le asigna al resultado al reducir dos términos semejantes
    con signos opuestos?
  choices:
  - text: El signo del coeficiente que tiene el mayor valor absoluto
    is_correct: true
  - text: Siempre el signo positivo
    is_correct: false
  - text: Siempre el signo negativo
    is_correct: false
  - text: Se multiplica el signo del primero por el del segundo
    is_correct: false
  explanation: La alternativa correcta es 'El signo del coeficiente que tiene el mayor
    valor absoluto'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 14x^2y - 19x^2y, ¿cuál fue el resultado reducido?
  choices:
  - text: -5x^2y
    is_correct: true
  - text: 5x^2y
    is_correct: false
  - text: -33x^2y
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: La alternativa correcta es '-5x^2y'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las magnitudes absolutas de ambos coeficientes.'
- 'Paso 2: Restar el valor menor del mayor.'
- 'Paso 3: Anteponer al resultado el signo del coeficiente de mayor magnitud y escribir
  la parte literal.'
errores_correccion: '- **Error 1: Aplicar ley de signos de la multiplicación (decir
  que en $-8x + 3x$ menos por más da menos y sumar $8+3=11$).** **Cómo corregirlo:**
  La reducción es una suma/resta; se restan magnitudes $8-3=5$ y el resultado toma
  el signo del mayor ($-5x$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Reduzca la expresión -15a + 9a.
  alternativas:
  - -6a
  - 6a
  - -24a
  - 24a
  respuesta: -6a
  solucion_pasos:
  - '1. Magnitudes: 15 > 9. Resta: 15 - 9 = 6.'
  - '2. Signo del mayor (-15): negativo -> -6a.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de reducir 20m^3 - 20m^3?
  alternativas:
  - '0'
  - 40m^3
  - m^3
  - '1'
  respuesta: '0'
  solucion_pasos:
  - '1. Coeficientes opuestos: 20 - 20 = 0.'
  - 2. 0 · m^3 = 0.
- titulo: ¿Es el resultado de reducir 12x - 5x igual a 7x?
  respuesta: Sí
  solucion_pasos:
  - Sí, 12 - 5 = 7 positivo.
- titulo: ¿Produce la suma de dos términos opuestos como 6y - 6y un término de grado
    1?
  respuesta: 'No'
  solucion_pasos:
  - No, al ser opuestos se anulan por completo dando como resultado el número cero
    (0).
errores_frecuentes:
- Aplicar la regla de multiplicar signos (menos por más) para sumar coeficientes en
  lugar de restar.
- Sumar las magnitudes numéricas de los coeficientes cuando sus signos son opuestos.
- Asignar siempre signo positivo al resultado sin revisar cuál coeficiente posee mayor
  valor absoluto.
- Escribir la parte literal cuando la reducción de coeficientes opuestos da exactamente
  cero.
- Restar los exponentes de las letras al reducir términos de signos opuestos.
afirmaciones_verdaderas:
- Al reducir términos de signos opuestos se restan sus magnitudes y se conserva el
  signo del mayor.
- La reducción de dos términos con coeficientes opuestos e igual parte literal resulta
  en el número 0.
al_terminar_debes_poder: Al terminar serás capaz de reducir dos términos semejantes
  de signos opuestos restando sus coeficientes y aplicando el signo del término dominante.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Reducción.
estado: publicado
