semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.TRASLACION_VERTICAL
resumen_inicial: 'La traslación vertical desplaza rígidamente la gráfica exponencial a lo largo del eje $y$ mediante la adición de una constante $k$, modificando la asíntota horizontal a $y = k$.'
explicacion_simple: |
  Cuando le sumamos o restamos un número $k$ al final de una función exponencial, como en $g(x) = 2^x + 5$, toda la gráfica sube o baja de forma rígida sobre el eje vertical $y$. Si le sumamos $+5$, la curva completa sube 5 unidades: el punto de corte sube 5 posiciones y la línea invisible asíntota se eleva desde $y = 0$ a la nueva recta $y = 5$. El recorrido también se desplaza.
explicacion_formal: |
  ### Definición formal
  Dada la función exponencial básica $f(x) = a \cdot b^x$, la **traslación vertical** por un vector $(0, k)$ genera la nueva función $g: \mathbb{R} \to \mathbb{R}$ definida por:
  $$g(x) = f(x) + k = a \cdot b^x + k$$

  ### Desglose simbólico
  - Desplazamiento de la asíntota horizontal: De la recta $y = 0$ a la nueva recta $y = k$.
  - Desplazamiento del intercepto con el eje $y$: $P_y = (0, f(0) + k) = (0, a + k)$.
  - Reorganización del conjunto recorrido:
    - Si $a > 0 \implies \operatorname{Rec}(g) = ]k, +\infty[$.
    - Si $a < 0 \implies \operatorname{Rec}(g) = ]-\infty, k[$.

  ### Síntesis didáctica
  Reconocer el rol de $k$ como nuevo suelo de la función: En la función exponencial trasladada $g(x) = a \cdot b^x + k$, la constante libre $k$ dicta de forma exclusiva la posición de la asíntota horizontal $y = k$.
definiciones_clave: |
  - **Traslación vertical $g(x) = a \cdot b^x + k$**: Transformación isométrica que desplaza la curva $k$ unidades en el eje $y$.
  - **Asíntota desplazada $y = k$**: Nueva recta frontera horizontal hacia la cual se aproxima la curva trasladada.
  - **Recorrido trasladado**: Conjunto de imágenes ajustado al intervalo $]k, +\infty[$ o $]-\infty, k[$.
propiedades_relaciones: |
  - **Generación de intersección con el eje $x$**: A diferencia de la función básica que nunca toca el eje $x$, una función trasladada $a \cdot b^x + k$ puede cortar al eje $x$ si los signos de $a$ y $k$ son opuestos ($\operatorname{sgn}(a) \neq \operatorname{sgn}(k)$).
  - **Invariancia de la monotonía**: Sumar una constante $k$ no altera la derivada $g'(x) = f'(x)$, por lo que la monotonía de la curva se mantiene idéntica.
ejemplo_guiado:
  enunciado: 'Dada la función exponencial trasladada $g(x) = 3 \cdot 2^x - 8$, determina la ecuación de su asíntota horizontal, su intercepto con el eje $y$, su conjunto recorrido y su punto de corte con el eje $x$.'
  pasos:
    - 'Paso 1: Identificamos los parámetros: $a = 3$, $b = 2$, $k = -8$.'
    - 'Paso 2: La asíntota horizontal se desplaza a la recta $y = k \implies y = -8$.'
    - 'Paso 3: El intercepto con el eje $y$ se obtiene evaluando $g(0) = 3 \cdot 2^0 - 8 = 3(1) - 8 = -5 \implies (0, -5)$.'
    - 'Paso 4: Como $a = 3 > 0$, el recorrido ajustado es $\operatorname{Rec}(g) = ]-8, +\infty[$.'
    - 'Paso 5: Para el corte con el eje $x$, igualamos a cero: $3 \cdot 2^x - 8 = 0 \implies 2^x = \frac{8}{3} \implies x = \log_2\left(\frac{8}{3}\right)$. Como $a = 3 > 0$ y $k = -8 < 0$ (signos opuestos), la intersección existe.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación de la asíntota horizontal y el conjunto recorrido de la función exponencial $f(x) = 5 \cdot 4^x + 12$?'
    choices:
      - {text: 'Asíntota horizontal $y = 12$ y recorrido $\operatorname{Rec}(f) = ]12, +\infty[$', is_correct: true}
      - {text: 'Asíntota horizontal $y = 5$ y recorrido $\operatorname{Rec}(f) = ]5, +\infty[$', is_correct: false}
      - {text: 'Asíntota horizontal $y = 0$ y recorrido $\operatorname{Rec}(f) = ]0, +\infty[$', is_correct: false}
      - {text: 'Asíntota vertical $x = 12$ y recorrido $\operatorname{Rec}(f) = \mathbb{R}$', is_correct: false}
    explanation: 'La alternativa correcta es ''Asíntota horizontal $y = 12$ y recorrido $\operatorname{Rec}(f) = ]12, +\infty[$''. La constante $+12$ desplaza la asíntota a $y = 12$ y el piso del recorrido a $]12, +\infty[$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿En qué punto cartesiano cruza al eje $y$ la función exponencial trasladada $g(x) = -2 \cdot 3^x + 7$?'
    choices:
      - {text: '$(0, 5)$', is_correct: true}
      - {text: '$(0, 7)$', is_correct: false}
      - {text: '$(0, -2)$', is_correct: false}
      - {text: '$(0, 1)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(0, 5)$''. Evaluamos $x = 0 \implies g(0) = -2 \cdot 3^0 + 7 = -2(1) + 7 = 5$, resultando en $(0, 5)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la constante independiente $k$ sumada o restada al final de la expresión $a \cdot b^x + k$.'
  - 'Paso 2: Declarar la asíntota horizontal en la recta $y = k$.'
  - 'Paso 3: Calcular el corte con el eje $y$ evaluando $g(0) = a + k$ para obtener el punto $(0, a + k)$.'
  - 'Paso 4: Declarar el recorrido ajustado $\operatorname{Rec}(g) = ]k, +\infty[$ (si $a > 0$) o $\operatorname{Rec}(g) = ]-\infty, k[$ (si $a < 0$).'
errores_correccion: |
  - **Error 1:** Afirmar que el intercepto con el eje $y$ sigue siendo $(0, a)$ tras una traslación vertical. **Cómo corregirlo:** La traslación desplaza todos los puntos. El intercepto pasa a ser $(0, a + k)$ al evaluar $g(0) = a \cdot b^0 + k = a + k$.
  - **Error 2:** Creer que la asíntota horizontal no cambia al sumar $k$. **Cómo corregirlo:** La constante $k$ desplaza verticalmente la gráfica completa, incluyendo su asíntota horizontal a la recta $y = k$.
ejemplos:
  - titulo: 'Asíntota en traslación hacia abajo'
    enunciado: '¿Cuál es la asíntota de $f(x) = 2^x - 4$?'
    alternativas:
      - 'La recta $y = -4$'
      - 'La recta $y = 0$'
      - 'La recta $x = -4$'
    respuesta: 'La recta $y = -4$'
    solucion_pasos:
      - '1. La constante de traslación es $k = -4$.'
      - '2. La asíntota horizontal es $y = -4$.'
  - titulo: 'Recorrido de función trasladada'
    enunciado: '¿El recorrido de $g(x) = 5 \cdot 3^x + 2$ es $]2, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = 5 > 0$ y $k = 2$, el recorrido ajustado es $]2, +\infty[$.'
  - titulo: 'Corte con el eje x en función trasladada'
    enunciado: '¿La función $h(x) = 2^x - 8$ corta al eje $x$ en el punto $(3, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Resolvemos $2^x - 8 = 0 \implies 2^x = 8 \implies x = 3$. El corte es $(3, 0)$.'
  - titulo: 'Invariancia de la monotonía'
    enunciado: '¿Trasladar $f(x) = 3^x$ a $g(x) = 3^x - 10$ conserva la propiedad de ser estrictamente creciente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La traslación vertical desplaza la gráfica pero no altera su derivada ni su monotonía.'
errores_frecuentes:
  - 'La asíntota horizontal de la función $f(x) = 4^x + 5$ se mantiene en la recta $y = 0$.'
  - 'El intercepto con el eje $y$ de $g(x) = 2 \cdot 3^x + 4$ es el punto $(0, 2)$.'
  - 'Una función exponencial trasladada $a \cdot b^x + k$ jamás puede cortar al eje $x$.'
  - 'El recorrido de $f(x) = 3^x - 6$ es el conjunto de todos los números reales $\mathbb{R}$.'
  - 'Sumar una constante $+k$ modifica la base $b$ de la función exponencial.'
afirmaciones_verdaderas:
  - 'La traslación vertical $g(x) = a \cdot b^x + k$ desplaza la asíntota horizontal a la recta $y = k$ y el corte con el eje $y$ al punto $(0, a + k)$.'
  - 'Una función exponencial trasladada corta al eje $x$ únicamente cuando el coeficiente $a$ y la constante $k$ poseen signos algebraicos opuestos.'
