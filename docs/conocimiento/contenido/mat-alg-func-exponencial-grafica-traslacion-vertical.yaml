semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.TRASLACION_VERTICAL
resumen_inicial: 'Efecto de una traslación vertical en la gráfica exponencial: conceptos,
  asíntotas, propiedades e inversidad en Análisis gráfico y modelamiento exponencial.'
explicacion_simple: Así como con la parábola, la curva exponencial también puede deslizarse
  hacia arriba o hacia abajo sumándole un número constante, sin alterar su forma característica.
explicacion_formal: '### Definición formal


  Dada $f(x)=a\cdot b^x$, la función $g(x)=f(x)+k=a\cdot b^x+k$ representa una traslación
  vertical de $f$ en $k$ unidades. Cada punto $(x,y)$ de la gráfica original se traslada
  a $(x,y+k)$ en la nueva gráfica.


  ### Desarrollo didáctico


  El signo de $k$ se interpreta directamente: positivo sube toda la curva, negativo
  la baja, sin alterar su forma de crecimiento o decrecimiento exponencial.


  La gráfica de $g(x)=2^x-3$ es idéntica a la de $f(x)=2^x$, pero desplazada $3$ unidades
  hacia abajo.'
definiciones_clave: '- **Efecto de una traslación vertical en la gráfica exponencial**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a efecto de una traslación vertical en la gráfica exponencial.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de efecto de
    una traslación vertical en la gráfica exponencial.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de efecto de una traslación vertical
    en la gráfica exponencial.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    efecto de una traslación vertical en la gráfica exponencial?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en análisis gráfico
      y modelamiento exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en análisis gráfico y modelamiento exponencial. Es la condición
    de existencia para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en efecto de una traslación vertical en la gráfica exponencial?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica la función base $f(x)=a\cdot b^x$ y la constante $k$ sumada.'
- 'Paso 2: Si $k>0$, concluye que la traslación es hacia arriba.'
- 'Paso 3: Si $k<0$, concluye que la traslación es hacia abajo.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en efecto
  de una traslación vertical en la gráfica exponencial.
ejemplos:
- titulo: Descripción de una traslación hacia arriba
  enunciado: Describe la traslación vertical de $g(x)=3^x+5$ respecto a $f(x)=3^x$.
  solucion_pasos:
  - $k=5>0$.
  - Se traslada $5$ unidades hacia arriba.
- titulo: Descripción de una traslación hacia abajo
  enunciado: Describe la traslación vertical de $g(x)=2^x-7$ respecto a $f(x)=2^x$.
  solucion_pasos:
  - $k=-7<0$.
  - Se traslada $7$ unidades hacia abajo.
- titulo: ¿La traslación vertical cambia la forma de crecimiento o decrecimiento de
    la curva?
  enunciado: ¿La traslación vertical cambia la forma de crecimiento o decrecimiento
    de la curva?
  respuesta: 'No'
  solucion_pasos:
  - Solo desplaza toda la curva verticalmente; el ritmo de crecimiento o decrecimiento
    permanece igual.
- titulo: ¿La traslación vertical afecta el dominio de la función?
  enunciado: ¿La traslación vertical afecta el dominio de la función?
  respuesta: 'No'
  solucion_pasos:
  - El dominio de una función exponencial trasladada verticalmente sigue siendo todo
    $\mathbb{R}$.
errores_frecuentes:
- Confundir la dirección de la traslación, invirtiendo el signo de $k$.
- Aplicar a $k$ la lógica de reescritura usada para las traslaciones horizontales
  de otras funciones.
- Asumir incorrectamente que la traslación vertical cambia el dominio de la función.
- Confundir la traslación vertical con un cambio en el valor de la base $b$.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando efecto de una traslación vertical en la gráfica exponencial.
