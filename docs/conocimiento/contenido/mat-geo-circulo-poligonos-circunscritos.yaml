procedimiento:
- 'Paso 1: Identifica los puntos de tangencia en cada lado del polígono circunscrito.'
- 'Paso 2: En cada vértice, identifica los dos segmentos tangentes (iguales entre
  sí) que llegan a ese vértice.'
- 'Paso 3: Usa esas igualdades para plantear ecuaciones y calcular longitudes de lados
  o el perímetro total.'
