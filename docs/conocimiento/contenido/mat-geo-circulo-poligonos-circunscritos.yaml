semantic_id: MAT.GEO.CIRCULO_RECTAS.POLIGONOS_CIRCUNSCRITOS_TANGENTES
resumen_inicial: 'Cálculo de perímetros en polígonos circunscritos usando segmentos
  tangentes congruentes: conceptos, teoremas, propiedades geométricas y cálculo en
  Circunferencia y Círculo.'
explicacion_simple: La propiedad de tangentes congruentes desde un punto exterior
  tiene una aplicación muy práctica en polígonos cuyos lados son todos tangentes a
  una misma circunferencia.
explicacion_formal: '![Polígono circunscrito a una circunferencia](/static/img/geometria/circunferencia-circulo/circulo-poligonos-circunscritos.svg)


  ### Definición formal


  En un polígono circunscrito a una circunferencia, cada vértice tiene dos segmentos
  tangentes (hacia los dos lados que se encuentran en ese vértice) que son congruentes
  entre sí, gracias a la propiedad de tangentes desde un punto exterior.


  ### Desarrollo didáctico


  En un triángulo circunscrito con lados $a$, $b$, $c$, cada vértice genera un par
  de segmentos tangentes iguales; sumando todos los segmentos tangentes de los tres
  vértices se puede reconstruir el perímetro del triángulo de forma alternativa, útil
  en problemas donde se conocen los segmentos tangentes en vez de los lados completos.'
definiciones_clave: '- **Cálculo de perímetros en polígonos circunscritos usando segmentos
  tangentes congruentes**: Elemento o propiedad fundamental en el estudio de circunferencia
  y círculo.'
