  - text: Todos los estudiantes reprobaron el examen
    is_correct: false
  - text: La mayoría de los estudiantes aprobó
    is_correct: false
  explanation: La alternativa correcta es 'Existe al menos un estudiante de la clase que no aprobó el examen'. Para negar "todos", basta un contraejemplo.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la proposición universal inicial: $\forall x \in \mathcal{U}, P(x)$.'
- 'Paso 2: Sustituir el cuantificador universal $\forall$ por el cuantificador existencial $\exists$.'
- 'Paso 3: Conservar exactamente el mismo dominio de discurso $\mathcal{U}$.'
- 'Paso 4: Negar el predicado interior: $P(x) \mapsto \neg P(x)$.'
- 'Paso 5: Simplificar algebraicamente la condición resultante $\neg P(x)$.'
errores_correccion: '- **Error 1:** Creer que la negación de "todos cumplen $P$" es "ninguno cumple $P$". **Cómo corregirlo:** "Ninguno cumple $P$" es $\forall x \neg P(x)$, lo cual es un extremo innecesario; la negación formal exacta es $\exists x \neg P(x)$ ("al menos uno no cumple").

  - **Error 2:** Negar el dominio de discurso además del predicado. **Cómo corregirlo:** El dominio $\mathcal{U}$ define el contexto invariable; solo se cambia el cuantificador ($\forall \to \exists$) y se niega el predicado $P(x)$.

  '
ejemplos:
- titulo: Negación de propiedad geométrica
  enunciado: ¿Cómo se niega "Todos los triángulos son equiláteros"?
  alternativas:
  - Existe al menos un triángulo que no es equilátero
  - Ningún triángulo es equilátero
  - Todos los triángulos son escalenos
  respuesta: Existe al menos un triángulo que no es equilátero
  solucion_pasos:
  - 1. $\neg(\forall x T(x)) \equiv \exists x \neg T(x)$.
  - '2. Traducción: "Existe al menos un triángulo que no es equilátero".'
- titulo: Negación de desigualdad
  enunciado: ¿Cuál es la negación de $\forall x \in \mathbb{R}, x + 1 > 0$?
  respuesta: $\exists x \in \mathbb{R}, \; x + 1 \leq 0$
  solucion_pasos:
  - 1. El cuantificador pasa a $\exists$.
  - 2. La negación de $> 0$ es $\leq 0$.
  alternativas:
  - $\exists x \in \mathbb{R}, \; x + 1 \leq 0$
  - $\forall x \in \mathbb{R}, \; x + 1 < 0$
  - $\exists x \in \mathbb{R}, \; x + 1 > 0$
- titulo: Conservación del dominio
  enunciado: ¿El dominio de discurso permanece intacto al aplicar la negación?
  respuesta: Sí
  solucion_pasos:
  - Sí, la negación no afecta al conjunto $\mathcal{U}$.
- titulo: Equivalencia de De Morgan
  enunciado: ¿La negación de $\forall$ es una extensión de la ley de De Morgan para la conjunción?
  respuesta: Sí
  solucion_pasos:
  - Sí, generaliza $\neg(A \land B) \equiv \neg A \lor \neg B$ a dominios arbitrarios.
errores_frecuentes:
- La afirmación de que la negación de una proposición universal $\forall x P(x)$ es $\forall x \neg P(x)$.
- La afirmación de que negar una proposición universal requiere negar también el dominio de discurso.
- La afirmación de que la negación de una afirmación universal verdadera produce otra afirmación verdadera.
- La afirmación de que para refutar $\forall x P(x)$ es obligatorio demostrar que $P(x)$ falla para todos los elementos.
- La afirmación de que el cuantificador universal se transforma en bicondicional al ser negado.
afirmaciones_verdaderas:
- La negación de una proposición universal $\forall x \in \mathcal{U}, P(x)$ es lógicamente equivalente a la proposición existencial $\exists x \in \mathcal{U}, \neg P(x)$.
- Refutar una afirmación universal requiere únicamente la existencia de un único elemento contraejemplo que no satisfaga el predicado.
al_terminar_debes_poder: 'QUÉ: Negar rigurosamente proposiciones universales aplicando el teorema de dualidad ($\neg(\forall x P(x)) \equiv \exists x \neg P(x)$).

  CÓMO: Transformar el cuantificador a existencial, negar el predicado asociado y conservar inalterado el dominio de discurso.


  ![Cuadro resumen: Regla de dualidad, transformación de cuantificadores y conservación del dominio](/static/img/nodos/negacion-de-una-proposicion-universal-resumen.svg)

  '
