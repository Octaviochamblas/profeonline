semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.CANONICA_A_GENERAL
resumen_inicial: La conversión de la forma canónica $f(x) = a(x - h)^2 + k$ a la forma general $f(x) = ax^2 + bx + c$ se realiza desarrollando algebraicamente el cuadrado de binomio $(x - h)^2 = x^2 - 2hx + h^2$, distribuyendo el coeficiente $a$ y reduciendo los términos independientes.
explicacion_simple: '![La conversión de la forma canónica $f(x) = a(x - h)^2 + k$ a la forma general $f(x) = ax^2 + bx + c$ se realiza desarrollando algebraicamente el cuadrado de binomio $(x - h)^2 = x^2 - 2hx + h^2$, distribuyendo el coeficiente $a$ y reduciendo los términos independientes](/static/img/nodos/conversion-de-la-forma-canonica-a-la-forma-general-intro.svg)



  Pasar de la forma canónica a la general es simplemente **hacer los cálculos y abrir los paréntesis**:


  **Paso a paso:**

  1. Desarrolla el binomio al cuadrado: **$(x - h)^2 = x^2 - 2hx + h^2$**.

  2. Multiplica todo lo de adentro por el número $a$ de afuera.

  3. Súmale la constante $k$ que estaba al final.

  4. Junta los números semejantes y te quedará en la forma estándar **$ax^2 + bx + c$**.


  *Ejemplo:* $f(x) = 2(x - 3)^2 + 1$

  - $(x - 3)^2 = x^2 - 6x + 9$.

  - Multiplicar por 2: $2x^2 - 12x + 18$.

  - Sumar 1: $2x^2 - 12x + 18 + 1 = \mathbf{2x^2 - 12x + 19}$.'
explicacion_formal: 'Sea $f(x) = a(x - h)^2 + k$. La **expansión polinomial canónica** aplica el Teorema del Binomio de Newton para grado 2:

  $$(x - h)^2 = x^2 - 2hx + h^2$$


  Sustituyendo y aplicando la propiedad distributiva del producto sobre la suma en $\mathbb{R}$:

  $$f(x) = a(x^2 - 2hx + h^2) + k = ax^2 - (2ah)x + (ah^2 + k)$$


  **Correspondencia unívoca de coeficientes**:

  $$\begin{cases} a_{\text{gen}} = a \\ b_{\text{gen}} = -2ah \\ c_{\text{gen}} = ah^2 + k \end{cases}$$'
definiciones_clave: '- **Expansión algebraica**: Desarrollo formal de potencias y productos para expresar un polinomio en su base canónica.

  - **Forma general resultante**: Polinomio $ax^2 + bx + c$ ordenado en potencias decrecientes.'
propiedades_relaciones: '- **Invarianza de ''a''**: El coeficiente cuadrático $a$ permanece idéntico en ambas formas.

  - **Recuperación del corte con eje Y**: La constante resultante $c = ah^2 + k$ proporciona inmediatamente el corte $(0, c)$ con el eje vertical.'
ejemplo_guiado:
  enunciado: '![Ejemplo La conversión de la forma canónica $f(x) = a(x - h)^2 + k$ a la forma general $f(x) = ax^2 + bx + c$ se realiza desarrollando algebraicamente el cuadrado de binomio $(x - h)^2 = x^2 - 2hx + h^2$, distribuyendo el coeficiente $a$ y reduciendo los términos independientes](/static/img/nodos/conversion-de-la-forma-canonica-a-la-forma-general-ejemplos.svg)



    Convierte la función cuadrática $f(x) = -3(x + 2)^2 + 7$ a su forma general canónica $ax^2 + bx + c$.'
  pasos:
  - 'Paso 1: Desarrollar el binomio al cuadrado $(x + 2)^2$:

    $(x + 2)^2 = x^2 + 2(x)(2) + 2^2 = x^2 + 4x + 4$.'
  - 'Paso 2: Sustituir en la expresión funcional:

    $f(x) = -3(x^2 + 4x + 4) + 7$.'
  - 'Paso 3: Distribuir el factor $-3$ a los tres términos del trinomio:

    $f(x) = -3x^2 - 12x - 12 + 7$.'
  - 'Paso 4: Reducir los términos constantes independientes:

    $-12 + 7 = -5$.'
  - 'Paso 5: Conclusión: La forma general es $f(x) = -3x^2 - 12x - 5$ ($a = -3, b = -12, c = -5$).'
checkpoints:
- placement: after_explicacion_formal
  question: Al convertir $f(x) = (x - 5)^2 - 9$ a su forma general, ¿cuál es el resultado?
  choices:
  - text: f(x) = x² - 10x + 16
    is_correct: true
  - text: f(x) = x² - 25 - 9 = x² - 34
    is_correct: false
  - text: f(x) = x² - 10x + 25
    is_correct: false
  - text: f(x) = x² + 10x + 16
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = x² - 10x + 16'. $(x^2 - 10x + 25) - 9 = x^2 - 10x + 16$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor del término independiente c al expandir $f(x) = 2(x - 3)^2 + 4$?
  choices:
  - text: c = 22 (porque 2 · 9 + 4 = 22)
    is_correct: true
  - text: c = 13
    is_correct: false
  - text: c = 4
    is_correct: false
  - text: c = 9
    is_correct: false
  explanation: La alternativa correcta es 'c = 22 (porque 2 · 9 + 4 = 22)'. $c = ah^2 + k = 2(9) + 4 = 18 + 4 = 22$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Desarrollar el binomio al cuadrado $(x - h)^2 = x^2 - 2hx + h^2$.'
- 'Paso 2: Multiplicar cada término del trinomio resultante por el coeficiente exterior $a$.'
- 'Paso 3: Sumar algebraicamente la constante $k$ al término numérico libre.'
- 'Paso 4: Ordenar en potencias decrecientes para formular $ax^2 + bx + c$.'
errores_correccion: '- **Error común:** Elevar al cuadrado como $(x - 3)^2 = x^2 - 9$, olvidando el doble producto central $-6x$.

  - **Cómo corregirlo:** Recuerda la regla del cuadrado de binomio: **$(x - h)^2 = x^2 - 2hx + h^2$**.'
ejemplos:
- titulo: 'Ejemplo 1: Conversión con a = 1'
  enunciado: Convierte $f(x) = (x - 4)^2 + 3$ a forma general.
  alternativas:
  - x^2 - 8x + 19
  - x^2 - 8x + 16
  - x^2 - 16 + 3
  - x^2 + 8x + 19
  respuesta: x^2 - 8x + 19
  solucion_pasos:
  - 'Paso 1: $x^2 - 8x + 16 + 3 = x^2 - 8x + 19$.'
- titulo: 'Ejemplo 2: Conversión con factor negativo'
  enunciado: Convierte $g(x) = -(x + 3)^2 + 10$ a forma general.
  alternativas:
  - -x^2 - 6x + 1
  - -x^2 + 6x + 1
  - -x^2 - 9 + 10
  - -x^2 - 6x + 19
  respuesta: -x^2 - 6x + 1
  solucion_pasos:
  - 'Paso 1: $-(x^2 + 6x + 9) + 10 = -x^2 - 6x - 9 + 10 = -x^2 - 6x + 1$.'
- titulo: 'Ejemplo 3: Conversión con a = 4'
  enunciado: Expande $h(x) = 4(x - 1)^2 - 5$.
  alternativas:
  - 4x^2 - 8x - 1
  - 4x^2 - 8x + 4
  - 4x^2 - 4x - 1
  - 4x^2 - 8x - 5
  respuesta: 4x^2 - 8x - 1
  solucion_pasos:
  - 'Paso 1: $4(x^2 - 2x + 1) - 5 = 4x^2 - 8x + 4 - 5 = 4x^2 - 8x - 1$.'
- titulo: 'Ejemplo 4: Identificación de b'
  enunciado: Al convertir $f(x) = 3(x - 2)^2 + 1$, ¿cuánto vale b?
  alternativas:
  - '-12'
  - '-6'
  - '12'
  - '-2'
  respuesta: '-12'
  solucion_pasos:
  - 'Paso 1: $b = -2ah = -2(3)(2) = -12$.'
errores_frecuentes:
- Omitir el término del doble producto al desarrollar el binomio al cuadrado.
- Olvidar multiplicar la constante h² por a antes de sumarle k.
- Cometer errores de signos al distribuir factores negativos.
afirmaciones_verdaderas:
- Expandir a(x - h)² + k produce exactamente la forma general ax² + bx + c.
- El término independiente resultante es c = ah² + k.
al_terminar_debes_poder: '**QUÉ:** Convertir una función cuadrática de forma canónica a forma general.


  **CÓMO:** Desarrollando el cuadrado de binomio (x - h)², distribuyendo el factor a y agrupando los términos semejantes.


  ![Resumen La conversión de la forma canónica $f(x) = a(x - h)^2 + k$ a la forma general $f(x) = ax^2 + bx + c$ se realiza desarrollando algebraicamente el cuadrado de binomio $(x - h)^2 = x^2 - 2hx + h^2$, distribuyendo el coeficiente $a$ y reduciendo los términos independientes](/static/img/nodos/conversion-de-la-forma-canonica-a-la-forma-general-resumen.svg)'
