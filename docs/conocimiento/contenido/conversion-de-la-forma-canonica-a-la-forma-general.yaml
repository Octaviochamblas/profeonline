semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.CANONICA_A_GENERAL
resumen_inicial: 'La conversión de la forma canónica a la forma general se realiza desarrollando el cuadrado de binomio $(x - h)^2$, distribuyendo el coeficiente $a$ y reduciendo términos constantes.'
explicacion_simple: |
  Para pasar una función desde la forma canónica $a(x - h)^2 + k$ a la forma general $ax^2 + bx + c$, simplemente seguimos las reglas habituales del álgebra: primero resolvemos el cuadrado del binomio dentro del paréntesis, luego multiplicamos todo el trinomio resultante por el número $a$, y finalmente sumamos o restamos la constante $k$ que estaba afuera.
explicacion_formal: |
  ### Definición formal
  El procedimiento analítico de **conversión canónica a general** transforma la expresión $f(x) = a(x - h)^2 + k$ en el trinomio ordenado $f(x) = ax^2 + bx + c$ mediante la aplicación de identidades notables y leyes distributivas:

  ### Desglose simbólico
  1. Desarrollo del cuadrado de binomio: $(x - h)^2 = x^2 - 2hx + h^2$.
  2. Distribución del coeficiente principal $a$: $a(x^2 - 2hx + h^2) = ax^2 - 2ahx + ah^2$.
  3. Adición del término independiente $k$: $f(x) = ax^2 - 2ahx + (ah^2 + k)$.
  4. Identificación final de coeficientes:
     - Coeficiente cuadrático: $a = a$.
     - Coeficiente lineal: $b = -2ah$.
     - Coeficiente independiente: $c = ah^2 + k$.

  ### Síntesis didáctica
  Este desarrollo algebraico confirma de forma bidireccional la equivalencia absoluta entre ambas representaciones: evaluar el trinomio en $x = 0$ entrega el corte con el eje $y$ en $c = ah^2 + k$.
definiciones_clave: |
  - **Desarrollo de cuadrado de binomio**: Aplicación del producto notable $(u \pm v)^2 = u^2 \pm 2uv + v^2$.
  - **Distribución del escalar $a$**: Multiplicación del coeficiente exterior por cada uno de los tres términos del trinomio desarrollado.
  - **Reducción de constantes semejantes**: Combinación aritmética de las constantes $ah^2 + k$ en un único término $c$.
propiedades_relaciones: |
  - **Invariancia del coeficiente cuadrático**: El coeficiente principal $a$ no sufre modificación alguna durante todo el proceso de conversión.
  - **Obtención del corte con el eje $y$**: Al convertir a forma general, el último número resultante $c = ah^2 + k$ representa directamente la ordenada de corte con el eje $y$.
ejemplo_guiado:
  enunciado: 'Convierte la función cuadrática en forma canónica $f(x) = -3(x - 2)^2 + 7$ a su correspondiente forma general $f(x) = ax^2 + bx + c$ especificando los coeficientes finales $a$, $b$ y $c$.'
  pasos:
    - 'Paso 1: Desarrollamos el cuadrado de binomio interno: $(x - 2)^2 = x^2 - 4x + 4$.'
    - 'Paso 2: Sustituimos el trinomio en la función y distribuimos el $-3$: $f(x) = -3(x^2 - 4x + 4) + 7 = -3x^2 + 12x - 12 + 7$.'
    - 'Paso 3: Reducimos las constantes numéricas $-12 + 7 = -5$: $f(x) = -3x^2 + 12x - 5$.'
    - 'Paso 4: Comparamos con $ax^2 + bx + c$, concluyendo que la forma general es $f(x) = -3x^2 + 12x - 5$, con $a = -3$, $b = 12$ y $c = -5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la forma general obtenida al desarrollar la función en forma canónica $g(x) = 2(x + 3)^2 - 5$?'
    choices:
      - {text: '$g(x) = 2x^2 + 12x + 13$', is_correct: true}
      - {text: '$g(x) = 2x^2 + 6x + 13$', is_correct: false}
      - {text: '$g(x) = 2x^2 + 12x + 18$', is_correct: false}
      - {text: '$g(x) = 2x^2 + 12x + 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = 2x^2 + 12x + 13$''. Desarrollamos $(x + 3)^2 = x^2 + 6x + 9$. Multiplicamos por 2: $2x^2 + 12x + 18$. Restamos 5: $2x^2 + 12x + 13$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al convertir $p(x) = -(x - 4)^2 + 10$ a su forma general, ¿cuál es el valor del término independiente $c$?'
    choices:
      - {text: '$c = -6$', is_correct: true}
      - {text: '$c = 26$', is_correct: false}
      - {text: '$c = 10$', is_correct: false}
      - {text: '$c = -16$', is_correct: false}
    explanation: 'La alternativa correcta es ''$c = -6$''. Desarrollamos $-(x^2 - 8x + 16) + 10 = -x^2 + 8x - 16 + 10 = -x^2 + 8x - 6$, luego $c = -6$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Aplicar la propiedad del cuadrado de binomio $(x \pm h)^2 = x^2 \pm 2hx + h^2$.'
  - 'Paso 2: Multiplicar cada término del trinomio resultante por el coeficiente externo $a$.'
  - 'Paso 3: Sumar o restar la constante libre $k$ con la última constante producida por $ah^2$.'
  - 'Paso 4: Ordenar en la forma polinomial estándar $ax^2 + bx + c$.'
errores_correccion: |
  - **Error 1:** Olvidar el término doble producto $2hx$ al elevar el binomio al cuadrado (ej: escribir $(x - 3)^2 = x^2 + 9$). **Cómo corregirlo:** La elevación de un binomio exige la estructura $u^2 \pm 2uv + v^2$. Por lo tanto, $(x - 3)^2 = x^2 - 6x + 9$.
  - **Error 2:** Multiplicar la constante libre $k$ por el coeficiente $a$. **Cómo corregirlo:** La constante $k$ está fuera del paréntesis sobre el que actúa $a$. Únicamente los términos del binomio $(x - h)^2$ se multiplican por $a$.
ejemplos:
  - titulo: 'Conversión con coeficiente a = 1'
    enunciado: '¿Cuál es la forma general de $f(x) = (x - 5)^2 + 2$?'
    alternativas:
      - '$f(x) = x^2 - 10x + 27$'
      - '$f(x) = x^2 - 10x + 25$'
      - '$f(x) = x^2 - 5x + 27$'
    respuesta: '$f(x) = x^2 - 10x + 27$'
    solucion_pasos:
      - '1. Desarrollamos el cuadrado: $(x - 5)^2 = x^2 - 10x + 25$.'
      - '2. Sumamos la constante 2: $f(x) = x^2 - 10x + 25 + 2 = x^2 - 10x + 27$.'
  - titulo: 'Conversión con coeficiente a negativo'
    enunciado: 'Convierte $g(x) = -(x + 1)^2 + 4$ a forma general.'
    alternativas:
      - '$g(x) = -x^2 - 2x + 3$'
      - '$g(x) = -x^2 + 2x + 3$'
      - '$g(x) = -x^2 - 2x + 5$'
    respuesta: '$g(x) = -x^2 - 2x + 3$'
    solucion_pasos:
      - '1. Desarrollamos: $(x + 1)^2 = x^2 + 2x + 1$.'
      - '2. Aplicamos signo menos: $-(x^2 + 2x + 1) = -x^2 - 2x - 1$.'
      - '3. Sumamos 4: $g(x) = -x^2 - 2x - 1 + 4 = -x^2 - 2x + 3$.'
  - titulo: 'Preservación del valor en x = 0'
    enunciado: '¿Evaluar $x = 0$ en la forma canónica $f(x) = 2(x - 1)^2 + 3$ da el mismo resultado que evaluar $x = 0$ en su forma general $f(x) = 2x^2 - 4x + 5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ambas representaciones corresponden a la misma función. En canónica: $2(0 - 1)^2 + 3 = 2(1) + 3 = 5$. En general: $2(0)^2 - 4(0) + 5 = 5$.'
  - titulo: 'Generación del término lineal b'
    enunciado: 'En la conversión de $f(x) = a(x - h)^2 + k$, ¿el coeficiente lineal resulta $b = -2ah$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al multiplicar $a$ por el doble producto $-2hx$, se obtiene el término lineal $-2ahx$, por lo que $b = -2ah$.'
errores_frecuentes:
  - 'Al convertir $f(x) = 2(x - 3)^2 + 1$ a forma general, se obtiene $f(x) = 2x^2 + 18 + 1 = 2x^2 + 19$.'
  - 'El desarrollo del cuadrado del binomio $(x + 4)^2$ produce el polinomio $x^2 + 16$.'
  - 'Al distribuir el coeficiente $a = 3$ en $3[(x - 1)^2 + 2]$, la constante 2 no se multiplica por 3.'
  - 'La conversión de forma canónica a general altera las raíces reales de la función cuadrática.'
  - 'El coeficiente $a$ en la forma general es diferente al coeficiente $a$ de la forma canónica original.'
afirmaciones_verdaderas:
  - 'Para convertir una función desde la forma canónica a la forma general se debe desarrollar el cuadrado de binomio, distribuir el coeficiente principal $a$ y reducir términos independientes.'
  - 'La constante independiente $c$ de la forma general resultante es igual a la suma $ah^2 + k$.'
al_terminar_debes_poder: 'Convertir cualquier función cuadrática desde su forma canónica a su forma general aplicando reglas de productos notables y reducción algebraica.'
