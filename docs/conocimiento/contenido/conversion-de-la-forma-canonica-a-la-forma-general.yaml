  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Desarrolla el binomio al cuadrado $(x-h)^2$ usando la fórmula del cuadrado
  de un binomio.'
- 'Paso 2: Distribuye el coeficiente $a$ en cada término del desarrollo.'
- 'Paso 3: Suma la constante $k$ al resultado.'
- 'Paso 4: Reduce términos semejantes si es necesario para dejar la función en forma
  general.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en conversión de la forma canónica a la forma general.
ejemplos:
- titulo: Conversión con coeficiente a igual a 1
  enunciado: Convierte a forma general $f(x)=(x-5)^2+2$.
  solucion_pasos:
  - 'Desarrollando: $(x-5)^2=x^2-10x+25$.'
  - $f(x)=x^2-10x+27$.
- titulo: Conversión con coeficiente a distinto de 1
  enunciado: Convierte a forma general $f(x)=-2(x+1)^2+3$.
  solucion_pasos:
  - 'Desarrollando: $(x+1)^2=x^2+2x+1$.'
  - 'Multiplicando por $-2$: $-2x^2-4x-2$.'
  - $f(x)=-2x^2-4x+1$.
- titulo: ¿Convertir de forma canónica a forma general cambia la gráfica de la función?
  enunciado: ¿Convertir de forma canónica a forma general cambia la gráfica de la
    función?
  respuesta: 'No'
  solucion_pasos:
  - Son la misma función expresada de dos maneras algebraicamente equivalentes; la
    gráfica es idéntica.
- titulo: ¿El coeficiente $a$ cambia al convertir de forma canónica a forma general?
  enunciado: ¿El coeficiente $a$ cambia al convertir de forma canónica a forma general?
  respuesta: 'No'
  solucion_pasos:
  - El coeficiente principal se mantiene idéntico entre ambas formas equivalentes.
errores_frecuentes:
- Olvidar distribuir el coeficiente $a$ en todos los términos del binomio desarrollado.
- Cometer errores de signo al desarrollar el cuadrado de un binomio con $h$ negativo.
- No sumar correctamente la constante $k$ al final del proceso.
- Confundir el desarrollo de $(x-h)^2$ con $(x-h) \cdot 2$, aplicando una operación
  incorrecta.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_ponder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  conversión de la forma canónica a la forma general.
