semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.CANONICA_A_GENERAL
resumen_inicial: La conversión de forma canónica a general expande el cuadrado del binomio $a(x - h)^2 + k$ para obtener la forma $ax^2 + bx + c$.
explicacion_simple: |
  Pasar de la forma canónica $f(x) = a(x - h)^2 + k$ a la forma general $f(x) = ax^2 + bx + c$ es un proceso algebraico muy directo:

  1. **Desarrollas el cuadrado de binomio**:
     $$(x - h)^2 = x^2 - 2hx + h^2$$
  2. **Multiplicas todo por el coeficiente $a$**:
     $$a(x^2 - 2hx + h^2) = ax^2 - 2ahx + ah^2$$
  3. **Le sumas la constante $k$ final y agrupas los números**:
     $$f(x) = ax^2 - 2ahx + (ah^2 + k)$$

  **Ejemplo**: Pasar $f(x) = 3(x - 2)^2 + 1$ a forma general:
  - $(x - 2)^2 = x^2 - 4x + 4$
  - $3(x^2 - 4x + 4) = 3x^2 - 12x + 12$
  - Sumar $+1$: $3x^2 - 12x + 12 + 1 = 3x^2 - 12x + 13$.
explicacion_formal: |
  Dada la función cuadrática en forma canónica $f(x) = a(x - h)^2 + k$, el algoritmo algebraico de **desarrollo polinómico y reducción de términos semejantes** transforma la expresión al formato canónico general $f(x) = ax^2 + bx + c$:

  $$f(x) = a(x^2 - 2hx + h^2) + k = ax^2 + (-2ah)x + (ah^2 + k)$$

  **Ecuaciones de equivalencia entre coeficientes:**
  - Coeficiente cuadrático: $a_{gen} = a_{can}$
  - Coeficiente lineal: $b = -2ah$
  - Coeficiente independiente: $c = ah^2 + k$
definiciones_clave: |
  - **Conversión canónica a general**: Procedimiento de expansión algebraica que pasa del formato centrado en el vértice $a(x - h)^2 + k$ al formato ordenado $ax^2 + bx + c$.
propiedades_relaciones: |
  - **Invariancia del coeficiente cuadrático**: El parámetro $a$ permanece exactamente idéntico en las tres formas de representación de la función cuadrática (general, canónica y factorizada).
ejemplo_guiado:
  enunciado: 'Convierte la función $f(x) = -2(x + 3)^2 + 5$ a la forma general $ax^2 + bx + c$.'
  pasos:
    - 'Paso 1: Desarrollar el cuadrado de binomio $(x + 3)^2$: $x^2 + 6x + 9$.'
    - 'Paso 2: Multiplicar por el coeficiente $a = -2$: $-2(x^2 + 6x + 9) = -2x^2 - 12x - 18$.'
    - 'Paso 3: Sumar la constante libre $+5$: $-2x^2 - 12x - 18 + 5$.'
    - 'Paso 4: Agrupar términos independientes: $f(x) = -2x^2 - 12x - 13$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al convertir $f(x) = (x - 4)^2 + 6$ a forma general, ¿cuál es el valor del término independiente $c$?'
    choices:
      - {text: '$c = 22$', is_correct: true}
      - {text: '$c = 6$.', is_correct: false}
      - {text: '$c = 10$.', is_correct: false}
      - {text: '$c = 16$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$c = 22$''. Desarrollando $x^2 - 8x + 16 + 6 = x^2 - 8x + 22$, luego $c = 22$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la forma general equivalente de la función canónica $f(x) = 2(x - 1)^2 - 3$?'
    choices:
      - {text: '$f(x) = 2x^2 - 4x - 1$', is_correct: true}
      - {text: '$f(x) = 2x^2 - 2x - 1$.', is_correct: false}
      - {text: '$f(x) = 2x^2 - 4x - 3$.', is_correct: false}
      - {text: '$f(x) = 4x^2 - 4x - 1$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = 2x^2 - 4x - 1$''. $2(x^2 - 2x + 1) - 3 = 2x^2 - 4x + 2 - 3 = 2x^2 - 4x - 1$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Aplicar la propiedad del cuadrado de binomio $(x \pm h)^2 = x^2 \pm 2hx + h^2$.'
  - 'Paso 2: Distribuir el coeficiente externo $a$ a cada término del trinomio desarrollado.'
  - 'Paso 3: Sumar algebraicamente la constante $k$ externa con el término constante $ah^2$.'
  - 'Paso 4: Ordenar los términos en grado descendente $ax^2 + bx + c$.'
errores_correccion: |
  - **Error común:** Elevar al cuadrado los términos individualmente haciendo $(x - 3)^2 = x^2 - 9$ (olvidando el término central $-2hx$).
  - **Cómo corregirlo:** Recuerda la fórmula completa del cuadrado de binomio: **$(x - h)^2 = x^2 - 2hx + h^2$** (¡tiene 3 términos!).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Expansión de función mónica.
    alternativas:
      - 'f(x) = x^2 + 10x + 21'
      - 'f(x) = x^2 + 25 - 4'
      - 'f(x) = x^2 + 5x + 21'
    respuesta: 'f(x) = x^2 + 10x + 21'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Expansión con a negativo.
    alternativas:
      - 'f(x) = -x^2 + 6x - 7'
      - 'f(x) = -x^2 - 9 + 2'
      - 'f(x) = -x^2 - 6x - 7'
    respuesta: 'f(x) = -x^2 + 6x - 7'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la expresión $(x - 3)^2$, es correcto afirmar que su desarrollo algebraico es igual a $x^2 - 9$.'
  - 'La distribución parcial del factor $a$ únicamente sobre la variable $x^2$ omitiendo el término lineal $-2hx$ y la constante $h^2$.'
  - 'Cometer errores de signo en el doble producto central cuando la abscisa $h$ es negativa.'
  - 'La suposición de que el término independiente de la forma general $c$ es idéntico a la constante $k$ de la forma canónica.'
  - 'La adición de la constante $k$ previa a la distribución del coeficiente multiplicativo $a$.'
afirmaciones_verdaderas:
  - 'Al desarrollar la forma canónica $a(x - h)^2 + k$, el término lineal de la forma general resulta ser $b = -2ah$.'
  - 'El término independiente $c$ de la forma general equivale a la combinación constante $ah^2 + k$ de la forma canónica.'
al_terminar_debes_poder: |
  QUÉ: Convertir una función cuadrática de forma canónica a forma general $ax^2 + bx + c$.
  CÓMO: Desarrollar el cuadrado de binomio $(x-h)^2$, distribuir $a$, agrupar términos independientes y ordenar en grado descendente.
fuente: 'Texto escolar MINEDUC — Álgebra / Función Cuadrática'
