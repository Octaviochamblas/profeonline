semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.CANONICA_A_GENERAL
resumen_inicial: 'Conversión de la forma canónica a la forma general: parábola, vértice,
  concavidad y formas de Formas de la función cuadrática.'
explicacion_simple: Aunque la forma canónica es útil para ver el vértice, muchas veces
  es necesario volver a la forma general, por ejemplo para identificar los coeficientes
  $a$, $b$ y $c$ directamente.
explicacion_formal: '### Definición formal


  Dada $f(x)=a(x-h)^2+k$, desarrollando el binomio: $(x-h)^2=x^2-2hx+h^2$. Multiplicando
  por $a$ y sumando $k$: $f(x)=ax^2-2ahx+(ah^2+k)$, que es la forma general con $b=-2ah$
  y $c=ah^2+k$.


  ### Desarrollo didáctico


  El procedimiento consiste en aplicar el cuadrado de un binomio, distribuir el coeficiente
  $a$ en cada término, y finalmente sumar la constante $k$ para obtener la forma general
  completa.


  Para $f(x)=2(x-3)^2+4$: desarrollando, $(x-3)^2=x^2-6x+9$; multiplicando por $2$:
  $2x^2-12x+18$; sumando $4$: $f(x)=2x^2-12x+22$.'
definiciones_clave: '- **Conversión de la forma canónica a la forma general**: Elemento
  o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  conversión de la forma canónica a la forma general.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando conversión
    de la forma canónica a la forma general.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a conversión
    de la forma canónica a la forma general.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
