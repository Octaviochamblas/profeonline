semantic_id: MAT.NUM.RAZONES_PROPORCIONES.REPARTO_INVERSO
resumen_inicial: El reparto proporcional inverso distribuye una cantidad $T$ en partes inversamente proporcionales a $c_1, c_2, \dots, c_n$, lo cual equivale a realizar un reparto proporcional directo respecto a los recíprocos $\frac{1}{c_1}, \frac{1}{c_2}, \dots, \frac{1}{c_n}$.
explicacion_simple: "![Reparto proporcional inverso](/static/img/nodos/calculo-de-reparto-proporcional-inverso-intro.svg)\n\nEn el **reparto proporcional inverso**, **el que tiene el índice más bajo recibe la cuota más grande**:\n- Se usa comúnmente en **premios por menor cantidad de faltas, menos tardanzas o menor tiempo de carrera**.\n- **Método estándar en 3 pasos:**\n  1. **Invertir cada índice**: Los índices $c_1, c_2, c_3$ se convierten en fracciones recíprocas $\frac{1}{c_1}, \frac{1}{c_2}, \frac{1}{c_3}$.\n  2. **Multiplicar por el MCM**: Multiplicamos todas las fracciones por el mínimo común múltiplo para convertirlas en **números enteros directos**.\n  3. **Aplicar reparto directo estándar**: Calculamos la constante $k$ con los nuevos enteros y multiplicamos."
explicacion_formal: 'Sea la cantidad total $T \in \mathbb{R}^+$ sujeta a partición en sumandos $x_1, x_2, \dots, x_n$ tales que:


  $$\sum_{i=1}^{n} x_i = T \quad \text{y} \quad x_1 \cdot c_1 = x_2 \cdot c_2 = \dots = x_n \cdot c_n = k_{\text{inv}}$$


  **Teorema de Reducción a Reparto Directo:**

  Reescribiendo la condición de producto:


  $$\frac{x_1}{1/c_1} = \frac{x_2}{1/c_2} = \dots = \frac{x_n}{1/c_n} = k_{\text{inv}}$$


  Multiplicando los denominadores por $M = \operatorname{mcm}(c_1, \dots, c_n)$, se obtienen índices enteros equivalentes $c''_i = \frac{M}{c_i}$, reduciendo el problema a:


  $$k = \frac{T}{\sum_{i=1}^{n} c''_i} \implies x_i = c''_i \cdot k \quad (\forall i)$$'
definiciones_clave: '- **Reparto inverso**: Distribución donde $x_i \cdot c_i = \text{constante}$.

  - **Índices recíprocos**: Fracciones $\frac{1}{c_i}$.

  - **MCM transformador**: Mínimo común múltiplo empleado para eliminar denominadores.'
propiedades_relaciones: '- **Monotonía inversa**: $c_i < c_j \implies x_i > x_j$.

  - **Equivalencia directa**: Todo reparto inverso de orden $n$ es isomorfo a un reparto directo con índices transformados $c''_i$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de reparto inverso](/static/img/nodos/calculo-de-reparto-proporcional-inverso-ejemplos.svg)


    Reparta un premio de $\$260.000$ de forma inversamente proporcional a las faltas cometidas por tres empleados: $2$, $3$ y $4$ faltas, y determine cuánto recibe cada uno en un bono de $\$90.000$ con $1$ y $2$ faltas.'
  pasos:
  - 'Paso 1: Para $2, 3, 4$ faltas: Invertir a $\frac{1}{2}, \frac{1}{3}, \frac{1}{4}$.'
  - 'Paso 2: Hallar $\operatorname{mcm}(2,3,4) = 12$ y multiplicar: $12 \cdot \frac{1}{2} = 6$, $12 \cdot \frac{1}{3} = 4$, $12 \cdot \frac{1}{4} = 3$ (suma $= 13$).'
  - 'Paso 3: Calcular $k = \frac{260000}{13} = $\$20.00$0$. Partes: $6k = $\$120.00$0$, $4k = $\$80.00$0$, $3k = $\$60.00$0$.'
  - 'Paso 4: Para $1$ y $2$ faltas: Invertir a $1$ y $\frac{1}{2}$ (MCM $= 2 \implies 2$ y $1$, suma $= 3$). $k = \frac{90000}{3} = $\$30.000$ \implies $\$60.00$0$ y $\$30.000$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el paso algebraico clave para resolver un reparto proporcional inverso?
  choices:
  - text: Invertir los índices originales a sus recíprocos $1/c_i$ y convertirlos a enteros multiplicando por el MCM
    is_correct: true
  - text: Restar cada índice del total a repartir
    is_correct: false
  - text: Dividir el total directamente entre los índices originales
    is_correct: false
  - text: Elevar al cuadrado cada índice
    is_correct: false
  explanation: La alternativa correcta es 'Invertir los índices originales a sus recíprocos $1/c_i$ y convertirlos a enteros multiplicando por el MCM'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué el empleado con 2 faltas recibió más dinero ($120.000) que el de 4 faltas ($60.000)?
  choices:
  - text: Porque al tener la mitad de faltas, en el reparto inverso le corresponde el doble de premio
    is_correct: true
  - text: Porque 2 es un número primo
    is_correct: false
  - text: Por antigüedad en la empresa
    is_correct: false
  - text: Por una decisión de la administración
    is_correct: false
  explanation: La alternativa correcta es 'Porque al tener la mitad de faltas, en el reparto inverso le corresponde el doble de premio'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir los inversos multiplicativos $\frac{1}{c_1}, \frac{1}{c_2}, \dots, \frac{1}{c_n}$.'
- 'Paso 2: Calcular el $\operatorname{mcm}$ de los denominadores y multiplicar cada fracción por el $\operatorname{mcm}$ para obtener enteros $c''_i$.'
- 'Paso 3: Efectuar el reparto directo clásico con los índices enteros: $k = \frac{T}{\sum c''_i}$ y $x_i = c''_i \cdot k$.'
errores_correccion: '- **Error 1: Repartir directo con los números originales.** **Cómo corregirlo:** En el reparto inverso DEBEN invertirse los índices a $\frac{1}{c_i}$.

  - **Error 2: No amplificar por el mismo MCM a todas las fracciones.** **Cómo corregirlo:** Multiplicar CADA recíproco estrictamente por el mismo valor del $\operatorname{mcm}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Repartir $\$100.000$ inversamente a $2$ y $3$. ¿Cuánto recibe el primero?
  alternativas:
  - $\$60.000$
  - $\$40.000$
  - $\$50.000$
  respuesta: $\$60.000$
  solucion_pasos:
  - Inversos $\frac{1}{2}, \frac{1}{3} \implies$ MCM $= 6 \implies 3$ y $2$ (suma $= 5$). $k = 20.000 \implies 3k = $\$60.00$0$.
- titulo: Ejemplo 2
  enunciado: En una carrera se reparten $\$33.000$ inversamente a los puestos $1$, $2$ y $3$. ¿Cuánto recibe el 1° lugar?
  alternativas:
  - $\$18.000$
  - $\$11.000$
  - $\$6.000$
  respuesta: $\$18.000$
  solucion_pasos:
  - Inversos $1, \frac{1}{2}, \frac{1}{3} \implies$ MCM $= 6 \implies 6, 3, 2$ (suma $= 11$). $k = \frac{33000}{11} = 3000 \implies 6k = $\$18.00$0$.
- titulo: ¿Recibe la mayor parte quien tiene el menor índice en un reparto inverso?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la propiedad definitoria del reparto inversamente proporcional.
  alternativas:
  - texto: Sí, menor índice genera mayor cuota relativa al invertirse
    es_correcta: true
    retroalimentacion: ¡Correcto! Principio inverso.
  - texto: No, recibe la menor parte
    es_correcta: false
    retroalimentacion: Incorrecto, eso ocurriría en el reparto directo.
  - texto: No, todos reciben partes iguales
    es_correcta: false
    retroalimentacion: Incorrecto, las partes son proporcionales a los recíprocos.
- titulo: ¿Equivale el reparto inverso a un reparto directo de los recíprocos 1/c?
  respuesta: Sí
  solucion_pasos:
  - Sí, matemáticamente es un isomorfismo directo sobre los inversos.
  alternativas:
  - texto: Sí, es el método formal de resolución algebraica
    es_correcta: true
    retroalimentacion: ¡Correcto! Teorema de equivalencia recíproca.
  - texto: No, son conceptos incompatibles
    es_correcta: false
    retroalimentacion: Incorrecto, la inversión conecta ambos procedimientos.
  - texto: No, se deben restar los valores
    es_correcta: false
    retroalimentacion: Incorrecto, la relación es multiplicativa.
errores_frecuentes:
- Repartir directamente sin invertir los coeficientes.
- Sumar denominadores de forma incorrecta al sacar el MCM.
- Asignar la mayor cantidad al número original más alto.
- No comprobar la suma del total final.
afirmaciones_verdaderas:
- El reparto inverso asigna cuotas mayores a los índices numéricos más bajos.
- Se resuelve transformando los índices a sus recíprocos $\frac{1}{c_i}$ y multiplicando por el MCM.
- La suma de las partes calculadas es exactamente igual a la cantidad total repartida.
al_terminar_debes_poder: '![Síntesis de reparto inverso](/static/img/nodos/calculo-de-reparto-proporcional-inverso-resumen.svg)


  QUÉ: Resolver problemas de reparto proporcional inverso en contextos reales de optimización y premios.


  CÓMO: Invirtiendo los índices a $\frac{1}{c_i}$, amplificándolos por el $\operatorname{mcm}$ a coeficientes enteros $c''_i$ y ejecutando el reparto directo con $k = \frac{T}{\sum c''_i}$.'
