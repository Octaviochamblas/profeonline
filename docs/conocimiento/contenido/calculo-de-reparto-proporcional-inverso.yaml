semantic_id: MAT.NUM.REPARTO_ESCALAS.REPARTO_INVERSO
resumen_inicial: 'El reparto proporcional inverso distribuye una cantidad total $C$ atribuyendo partes mayores a los números o índices menores, convirtiendo los índices a sus recíprocos $\frac{1}{a_1}, \frac{1}{a_2}, \dots, \frac{1}{a_n}$.'
explicacion_simple: |
  El reparto proporcional inverso responde a un principio de compensación o penalización: *"quien comete menos faltas, llega con menos atrasos o tarda menos tiempo, recibe un premio más grande"*. La regla de oro para resolverlo es **transformarlo en un reparto directo usando los recíprocos**:
  1. Tomas los números originales y los das vuelta como fracciones ($\frac{1}{a}, \frac{1}{b}, \frac{1}{c}$).
  2. Sumas esas fracciones.
  3. Divides la cantidad total por esa suma de fracciones para hallar la constante $k$.
  4. Multiplicas $k$ por cada fracción recíproca.
explicacion_formal: |
  ### Definición formal
  El **reparto proporcional inverso** de una cantidad $C$ en $n$ partes $\{x_1, x_2, \dots, x_n\}$ inversamente proporcionales a los índices $\{a_1, a_2, \dots, a_n\}$ ($a_i > 0$) equivale algebraicamente a un **reparto proporcional directo de $C$ respecto a los recíprocos**:
  $$\left\{\frac{1}{a_1}, \frac{1}{a_2}, \dots, \frac{1}{a_n}\right\}$$
  satisfaciendo las ecuaciones:
  $$x_1 \cdot a_1 = x_2 \cdot a_2 = \dots = x_n \cdot a_n = k \quad \text{con} \quad \sum_{i=1}^n x_i = C$$

  ### Cálculo de la constante de reparto recíproca $k$
  Se suman las fracciones de los recíprocos $S_{\text{rec}} = \sum_{i=1}^n \frac{1}{a_i}$ (usando el mínimo común múltiplo de los denominadores) y se obtiene:
  $$k = \frac{C}{\sum_{i=1}^n \frac{1}{a_i}}$$

  ### Determinación de cada parte
  Cada asignación individual viene dada por la multiplicación de la constante $k$ por el recíproco correspondiente:
  $$x_i = k \cdot \left(\frac{1}{a_i}\right) = \frac{k}{a_i}$$

  ### Síntesis didáctica
  - Transformación: $a_i \implies \frac{1}{a_i}$.
  - Suma de recíprocos: $S_{\text{rec}} = \frac{1}{a_1} + \frac{1}{a_2} + \dots + \frac{1}{a_n}$.
  - Parte individual: $x_i = \frac{k}{a_i}$.
definiciones_clave: |
  - **Reparto proporcional inverso**: Distribución donde a menor valor del índice le corresponde una mayor proporción del total.
  - **Índice recíproco $\frac{1}{a}$**: Transformación fraccionaria que convierte una proporción inversa en una directa equivalente.
  - **Penalización o compensación proporcional**: Criterio de reparto donde la variable actúa como factor reductor.
propiedades_relaciones: |
  - **Inversión de orden de beneficios**: Si $a_1 < a_2 < a_3$, en el reparto inverso se cumple estrictamente que $x_1 > x_2 > x_3$.
  - **Equivalencia a directo con MCM**: Al multiplicar todos los recíprocos por el $\text{mcm}(a_1, \dots, a_n)$, se obtienen números enteros equivalentes para un reparto directo estándar.
ejemplo_guiado:
  enunciado: 'Se reparten $\$33.000$ entre dos trabajadores en partes inversamente proporcionales a sus días de inasistencia: $2$ días y $3$ días. Calcula cuánto dinero recibe cada uno.'
  pasos:
    - 'Paso 1: Escribimos los recíprocos de los días de inasistencia: $\frac{1}{2}$ y $\frac{1}{3}$.'
    - 'Paso 2: Sumamos los recíprocos buscando MCM $= 6$: $S_{\text{rec}} = \frac{1}{2} + \frac{1}{3} = \frac{3 + 2}{6} = \frac{5}{6}$.'
    - 'Paso 3: Calculamos la constante de reparto: $k = \frac{33.000}{\frac{5}{6}} = 33.000 \cdot \frac{6}{5} = 6.600 \cdot 6 = 39.600$.'
    - 'Paso 4: Calculamos cada parte multiplicando $k$ por su recíproco:\n- Trabajador 1 (2 faltas): $x_1 = \frac{39.600}{2} = \$19.800$.\n- Trabajador 2 (3 faltas): $x_2 = \frac{39.600}{3} = \$13.200$.\n- Verificación: $19.800 + 13.200 = \$33.000$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el primer paso fundamental para resolver un reparto proporcional inverso con índices $a, b, c$?'
    choices:
      - {text: 'Transformar los índices a sus recíprocos fraccionarios $\frac{1}{a}, \frac{1}{b}, \frac{1}{c}$ y sumarlos', is_correct: true}
      - {text: 'Sumar directamente los índices $a + b + c$', is_correct: false}
      - {text: 'Restar los índices a la cantidad total $C$', is_correct: false}
      - {text: 'Multiplicar los índices entre sí $a \cdot b \cdot c$', is_correct: false}
    explanation: 'La alternativa correcta es ''Transformar los índices a sus recíprocos fraccionarios $\frac{1}{a}, \frac{1}{b}, \frac{1}{c}$ y sumarlos''. Así se convierte en reparto directo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si se reparten $\$11.000$ en partes inversamente proporcionales a $2$ y $9$, ¿cuál es el total de la parte que recibe el primer número ($2$)?'
    choices:
      - {text: '$\$9.000$, pues los recíprocos son $\frac{1}{2}$ y $\frac{1}{9}$ (razón $9 : 2$), $11.000 \cdot \frac{9}{11} = 9.000$', is_correct: true}
      - {text: '$\$2.000$, correspondiente a la proporción menor', is_correct: false}
      - {text: '$\$5.500$, repartiendo a la mitad', is_correct: false}
      - {text: '$\$1.000$, restando $2$ a $9$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$9.000$, pues los recíprocos son $\frac{1}{2}$ y $\frac{1}{9}$ (razón $9 : 2$), $11.000 \cdot \frac{9}{11} = 9.000$''. Razón entera recíproca $9:2$; parte de 2 es $\frac{9}{11} \cdot 11.000 = 9.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Convertir cada uno de los índices $a_i$ a su recíproco fraccionario $\frac{1}{a_i}$.'
  - 'Paso 2: Sumar las fracciones de los recíprocos hallando un común denominador: $S_{\text{rec}} = \sum \frac{1}{a_i}$.'
  - 'Paso 3: Calcular la constante de reparto dividiendo el total $C$ entre la suma de recíprocos ($k = \frac{C}{S_{\text{rec}}}$).'
  - 'Paso 4: Multiplicar la constante $k$ por cada fracción recíproca ($x_i = \frac{k}{a_i}$) y verificar que sumen el total $C$.'
errores_correccion: |
  - **Error 1:** Sumar los números originales sin invertirlos al hacer un reparto inverso. **Cómo corregirlo:** En un reparto inverso **JAMÁS se suman los números directos**; debes convertirlos primero a **fracciones recíprocas ($\frac{1}{a}$)**.
  - **Error 2:** Asignar la mayor cantidad de dinero al participante que tiene el número o índice más alto. **Cómo corregirlo:** En el reparto inverso ocurre lo contrario: **el número menor recibe la mayor tajada**.
ejemplos:
  - titulo: 'Reparto inverso entre 2 y 4'
    enunciado: 'Para repartir $\$60.000$ inversamente a $2$ y $4$, los recíprocos son $1/2$ y $1/4$ (razón $2:1$). ¿Las partes son $\$40.000$ y $\$20.000$?'
    alternativas:
      - 'Sí, pues $2/3$ de 60.000 es 40.000 y $1/3$ es 20.000'
      - 'No, son 20.000 y 40.000'
      - 'No, son 30.000 cada uno'
    respuesta: 'Sí, pues $2/3$ de 60.000 es 40.000 y $1/3$ es 20.000'
    solucion_pasos:
      - '1. Recíprocos: $1/2$ y $1/4$. Multiplicando por MCM 4: enteros $2$ y $1$.'
      - '2. Suma enteros: $2 + 1 = 3$.'
      - '3. Partes: $60.000 \cdot (2/3) = 40.000$ y $60.000 \cdot (1/3) = 20.000$.'
  - titulo: 'Verificación de la mayor cuota'
    enunciado: 'En el reparto inverso a 2 y 4, ¿el número menor (2) recibió el doble que el número mayor (4)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $40.000 = 2 \cdot 20.000$. Cumple la propiedad inversa.'
  - titulo: 'Masa de tres números en inverso'
    enunciado: 'Para repartir inversamente a $2, 3, 6$, ¿los recíprocos multiplicados por 6 dan los enteros $3, 2, 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $6 \cdot (1/2) = 3$, $6 \cdot (1/3) = 2$, $6 \cdot (1/6) = 1$.'
  - titulo: 'Suma de las partes en reparto inverso'
    enunciado: '¿La suma de las partes resultantes en un reparto inverso coincide exactamente con el total repartido?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la propiedad de conservación de la cantidad total.'
errores_frecuentes:
  - 'Sumar directamente los índices originales sin convertirlos a sus fracciones recíprocas $1/a$.'
  - 'Asignar la parte de mayor valor al índice de mayor tamaño en un reparto inverso.'
  - 'Las fracciones recíprocas se pueden sumar directamente sumando numeradores con denominadores.'
  - 'Multiplicar los índices originales por la constante de reparto en lugar de dividirlos.'
  - 'Considerar que el reparto inverso es numéricamente idéntico al reparto directo.'
afirmaciones_verdaderas:
  - 'El reparto proporcional inverso equivale a realizar un reparto directo sobre los recíprocos de los índices $\frac{1}{a_1}, \frac{1}{a_2}, \dots, \frac{1}{a_n}$.'
  - 'En todo reparto proporcional inverso, el índice de menor valor numérico recibe la mayor parte asignada.'
al_terminar_debes_poder: 'Calcular repartos proporcionales inversos transformando los índices a recíprocos $\frac{1}{a_i}$ y calculando la constante $k$.'
