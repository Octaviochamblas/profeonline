semantic_id: MAT.NUM.REPARTO_ESCALAS.REPARTO_INVERSO
resumen_inicial: 'Cálculo de reparto proporcional inverso: concepto y propiedades
  fundamentales en Reparto proporcional y escalas.'
explicacion_simple: ¿Cómo repartir un premio a la puntualidad? Quien tenga MÁS faltas
  debe recibir MENOS premio. En estos casos el reparto directo es injusto, debemos
  usar el reparto inverso.
explicacion_formal: 'El **reparto inverso** consiste en distribuir una cantidad $T$
  de forma inversamente proporcional a los índices $a, b, c$.


  El truco matemático para no enredarse es **transformar el reparto inverso en uno
  directo**. Para hacerlo, simplemente invertimos los índices (calcular sus recíprocos):

  - Índice $a \rightarrow$ Nuevo índice: $1/a$

  - Índice $b \rightarrow$ Nuevo índice: $1/b$


  Una vez tienes los nuevos índices fraccionarios, haces el procedimiento del reparto
  directo: los sumas, divides el total por esa suma para obtener $K$, y multiplicas
  $K$ por cada fracción.'
definiciones_clave: '- **Cálculo de reparto proporcional inverso**: Elemento central
  dentro del estudio de Reparto proporcional y escalas.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo de reparto proporcional inverso.'
