resumen_inicial: El reparto proporcional inverso distribuye una cantidad total $T$
  en forma inversamente proporcional a los índices $\{a, b, c, \dots\}$, equivaliendo
  a un reparto directo según sus inversos multiplicativos $\left\{\frac{1}{a}, \frac{1}{b},
  \frac{1}{c}, \dots\right\}$.
explicacion_simple: Repartir inversamente significa que quien tiene un número mayor
  recibe una tajada más pequeña (por ejemplo, dar un premio donde quien cometió menos
  faltas recibe más). Para resolverlo, invertimos los números dados haciéndolos fracciones
  $1/a$ y hacemos un reparto directo normal con esas fracciones.
explicacion_formal: 'Para un total $T > 0$ a repartir de forma inversamente proporcional
  a los coeficientes $\{a, b, c\}$, la **Regla de Reparto Proporcional Inverso** transforma
  los índices a sus recíprocos:


  $$k = \frac{T}{\frac{1}{a} + \frac{1}{b} + \frac{1}{c}} \implies x = \frac{k}{a},
  \quad y = \frac{k}{b}, \quad z = \frac{k}{c}$$


  **Verificación:**

  $$x + y + z = k \cdot \left( \frac{1}{a} + \frac{1}{b} + \frac{1}{c} \right) = T$$'
definiciones_clave: '- **Reparto proporcional inverso**: Distribución de $T$ usando
  los inversos multiplicativos $1/a_i$ como índices directos.'
propiedades_relaciones: '- **Transformación a recíprocos**: Transforma índices $\{a,
  b\}$ en $\{1/a, 1/b\}$.'
ejemplo_guiado:
  enunciado: Reparta \$110.000 en forma inversamente proporcional a $2$ y $3$.
  pasos:
  - 'Paso 1: Obtener los recíprocos de los índices: $\frac{1}{2}$ y $\frac{1}{3}$.'
  - 'Paso 2: Sumar los recíprocos: $\frac{1}{2} + \frac{1}{3} = \frac{3 + 2}{6} =
    \frac{5}{6}$.'
  - 'Paso 3: Calcular la constante $k = \frac{110.000}{5/6} = 110.000 \cdot \frac{6}{5}
    = 132.000$.'
  - 'Paso 4: Multiplicar $k$ por cada recíproco:

    - Primera parte ($a=2$): $132.000 \cdot \frac{1}{2} = 66.000$

    - Segunda parte ($b=3$): $132.000 \cdot \frac{1}{3} = 44.000$.'
  - 'Conclusión: Las partes son \$66.000 y \$44.000 (verificable: $66.000+44.000=110.000$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste el primer paso para resolver un reparto proporcional
    inverso entre los coeficientes a, b, c?
  choices:
  - text: En transformar los coeficientes a sus inversos multiplicativos 1/a, 1/b,
      1/c
    is_correct: true
  - text: En elevar al cuadrado los números a, b, c
    is_correct: false
  - text: En multiplicar todo por cero
    is_correct: false
  - text: En restar a los datos el total T
    is_correct: false
  explanation: La alternativa correcta es 'En transformar los coeficientes a sus inversos
    multiplicativos 1/a, 1/b, 1/c'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $110.000 en forma inversa a 2 y 3, ¿cuál fue
    la primera parte asignada a 2?
  choices:
  - text: 66.000 $
    is_correct: true
  - text: 44.000 $
    is_correct: false
  - text: 55.000 $
    is_correct: false
  - text: 22.000 $
    is_correct: false
  explanation: La alternativa correcta es '66.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de efectuar el reparto proporcional
  inverso de un total $T$ convirtiendo los índices a sus recíprocos $1/a_i$.
semantic_id: MAT.NUM.REPARTO_ESCALAS.REPARTO_INVERSO
procedimiento:
- 'Paso 1: Identificar el tipo de problema (reparto proporcional directo/inverso o
  cálculo de escalas).'
- 'Paso 2: Convertir unidades de medida a un sistema homogéneo común (en el caso de
  escalas).'
- 'Paso 3: Calcular la constante de proporcionalidad $k$ o la escala $E$ y resolver
  la incógnita solicitada.'
errores_correccion: '- **Error 1: Calcular la escala dividiendo medidas en distintas
  unidades (ej: metros entre centímetros directamente).** **Cómo corregirlo:** Se
  DEBEN convertir ambas distancias a la MISMA unidad de medida antes de calcular $n
  = R / d$.


  - **Error 2: Tratar un reparto inverso como si fuera directo dividiendo el total
  por los índices sin invertirlos.** **Cómo corregirlo:** En el reparto inverso se
  DEBEN invertir previamente los coeficientes ($1/a_i$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.REPARTO_ESCALAS.REPARTO_INVERSO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del reparto proporcional o escalas.
- titulo: Ejemplo 2
  enunciado: Verificación de la constante k o escala E.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal de equivalencia proporcional.
- titulo: ¿Conserva el reparto proporcional la suma del total T?
  respuesta: Sí
  solucion_pasos:
  - Sí, la suma de las partes repartidas equivale a $T$.
- titulo: ¿Exige la escala expresarse en las mismas unidades de medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, para obtener una razón adimensional $1:n$.
errores_frecuentes:
- Calcular una escala dividiendo la distancia en metros entre los centímetros del
  plano sin convertir unidades.
- Realizar un reparto proporcional inverso sumando los coeficientes directamente como
  si fuera un reparto directo.
- Invertir el orden de la escala dividiendo la medida del plano por la medida real
  ($d / R$) para la constante $n$.
- Omitir multiplicar la constante de reparto $k$ por cada uno de los coeficientes
  individuales al finalizar.
- Restar los coeficientes al calcular el total repartido en una serie de razones.
afirmaciones_verdaderas:
- El reparto proporcional directo distribuye un total multiplicando la constante $k
  = \frac{T}{\sum a_i}$ por cada índice.
- 'La escala de un plano $E = \frac{d}{R} = 1 : n$ relaciona la distancia dibujada
  y la real expresadas en idéntica unidad.'
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
