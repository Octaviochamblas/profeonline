semantic_id: MAT.NUM.REPARTO_ESCALAS.REPARTO_INVERSO
resumen_inicial: 'Cálculo de reparto proporcional inverso: concepto y propiedades fundamentales
  en Reparto proporcional y escalas.'
explicacion_simple: ¿Cómo repartir un premio a la puntualidad? Quien tenga MÁS faltas debe
  recibir MENOS premio. En estos casos el reparto directo es injusto, debemos usar el reparto
  inverso.
explicacion_formal: 'El **reparto inverso** consiste en distribuir una cantidad $T$ de forma
  inversamente proporcional a los índices $a, b, c$.


  El truco matemático para no enredarse es **transformar el reparto inverso en uno directo**.
  Para hacerlo, simplemente invertimos los índices (calcular sus recíprocos):

  - Índice $a \rightarrow$ Nuevo índice: $1/a$

  - Índice $b \rightarrow$ Nuevo índice: $1/b$


  Una vez tienes los nuevos índices fraccionarios, haces el procedimiento del reparto directo:
  los sumas, divides el total por esa suma para obtener $K$, y multiplicas $K$ por cada fracción.'
definiciones_clave: '- **Cálculo de reparto proporcional inverso**: Elemento central dentro
  del estudio de Reparto proporcional y escalas.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo de reparto proporcional inverso.'
ejemplo_guiado:
  enunciado: 'Reparte 120.000 pesos en forma inversamente proporcional a las faltas de dos
    vendedores: Juan con 2 faltas y Pedro con 4 faltas.'
  pasos:
  - 'Invierto los índices: 1/2 para Juan y 1/4 para Pedro.'
  - 'Sumo las fracciones: 1/2 más 1/4 es igual a 2/4 más 1/4, o sea 3/4.'
  - 'Calculo K: 120.000 dividido entre 3/4, es decir 120.000 por 4/3, igual a 160.000. Juan
    recibe 160.000 por 1/2, o sea 80.000, y Pedro recibe 160.000 por 1/4, o sea 40.000.'
