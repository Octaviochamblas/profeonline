procedimiento:
- 'Paso 1: Invierte los índices originales ($3 \rightarrow 1/3$).'
- 'Paso 2: Suma estas nuevas fracciones.'
- 'Paso 3: Divide el Total por esa suma fraccionaria para obtener $K$.'
- 'Paso 4: Multiplica cada índice fraccionario por $K$.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de reparto
  proporcional inverso.
ejemplos:
- titulo: Premio por menos faltas
  enunciado: Reparte 200.000 pesos en forma inversamente proporcional a las faltas de Ana
    (2 faltas) y Beto (3 faltas). ¿Cuánto recibe Ana?
  alternativas:
  - '120.000'
  - '80.000'
  - '100.000'
  respuesta: '120.000'
  solucion_pasos:
  - 'Índices inversos: 1/2 para Ana, 1/3 para Beto.'
  - 'Suma de fracciones: 1/2 más 1/3 es igual a 5/6.'
  - K es igual a 200.000 dividido entre 5/6, o sea 240.000. Ana recibe 240.000 por 1/2, es
    decir 120.000.
- titulo: Ejemplo 2
  enunciado: Reparte 90.000 pesos de forma inversa entre dos personas con 1 y 5 faltas respectivamente.
    ¿Cuánto recibe la persona con 5 faltas?
  alternativas:
  - '15.000'
  - '75.000'
  - '45.000'
  respuesta: '15.000'
  solucion_pasos:
  - 'Índices inversos: 1/1 y 1/5; su suma es 6/5.'
  - K es igual a 90.000 dividido entre 6/5, o sea 75.000. La persona con 5 faltas recibe 75.000
    por 1/5, es decir 15.000.
- titulo: ¿En un reparto inverso, la persona con el índice más grande recibe la mayor parte?
  respuesta: 'No'
  solucion_pasos:
  - Recibe la menor parte; quien tiene el índice más pequeño es quien recibe más.
- titulo: ¿Para resolver un reparto inverso se deben invertir los índices originales antes
    de repartir?
  respuesta: Sí
  solucion_pasos:
  - Así se transforma el reparto inverso en uno directo, usando los nuevos índices fraccionarios.
errores_frecuentes:
- Restar los índices en lugar de invertirlos fraccionariamente.
- Sumar los índices originales y luego tratar de repartir usando división, lo que genera errores
  de proporción.
- Olvidar que el que tiene el número más pequeño DEBE llevarse la mayor parte.
- Restar los índices en lugar de invertirlos fraccionariamente.
- Olvidar que quien tiene el número más pequeño debe llevarse la mayor parte.
afirmaciones_verdaderas:
- La propiedad de cálculo de reparto proporcional inverso preserva la consistencia lógica.
- En un reparto proporcional inverso, quien tiene el índice más pequeño recibe la mayor parte
  del total.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de reparto proporcional
