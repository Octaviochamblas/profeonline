semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.INVERSO_MULTIPLICATIVO
resumen_inicial: El inverso multiplicativo (o recíproco) de una fracción no nula $\frac{a}{b}$
  es $\frac{b}{a}$, tal que $\frac{a}{b} \cdot \frac{b}{a} = 1$.
explicacion_simple: 'El inverso multiplicativo o recíproco de una fracción se obtiene
  dando vuelta o invirtiendo la posición de sus números: el de arriba pasa a estar
  abajo y el de abajo pasa a estar arriba. Si multiplicamos una fracción por su inverso,
  el resultado es siempre igual a 1.'
explicacion_formal: 'Para toda fracción no nula $\frac{a}{b} \in \mathbb{Q} \setminus
  \{0\}$ (con $a, b \neq 0$), su **Inverso Multiplicativo** $\left(\frac{a}{b}\right)^{-1}$
  satisface la propiedad del neutro multiplicativo:


  $$\left(\frac{a}{b}\right)^{-1} = \frac{b}{a} \iff \frac{a}{b} \cdot \frac{b}{a}
  = \frac{a \cdot b}{b \cdot a} = 1$$


  **Desglose de la fórmula:**

  - $\frac{b}{a}$: Fracción invertida con $a \neq 0$.

  - Neutro $1$: Elemento neutro de la multiplicación en el cuerpo de los números racionales
  $\mathbb{Q}$.


  > **Complemento didáctico:** El número entero cero ($0 = \frac{0}{1}$) es el ÚNICO
  elemento en $\mathbb{Q}$ que no posee inverso multiplicativo.'
definiciones_clave: '- **Inverso multiplicativo (recíproco)**: Fracción $\frac{b}{a}$
  resultante de intercambiar el numerador $a$ y el denominador $b$ ($a \neq 0$).'
propiedades_relaciones: '- **Propiedad del neutro**: $q \cdot q^{-1} = 1$ para todo
  $q \in \mathbb{Q} \setminus \{0\}$.'
ejemplo_guiado:
  enunciado: Halle el inverso multiplicativo de $\frac{5}{8}$ y verifique su producto.
  pasos:
  - 'Paso 1: Invertir el numerador ($5$) y el denominador ($8$): $\frac{8}{5}$.'
  - 'Paso 2: Multiplicar la fracción original por su inverso: $\frac{5}{8} \cdot \frac{8}{5}
    = \frac{40}{40}$.'
  - 'Paso 3: Calcular la división: $\frac{40}{40} = 1$.'
  - 'Conclusión: El inverso multiplicativo de $\frac{5}{8}$ es $\frac{8}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el inverso multiplicativo (recíproco) de la fracción a/b con
    a, b != 0?
  choices:
  - text: b/a (la fracción invertida)
    is_correct: true
  - text: -a/b (el opuesto aditivo)
    is_correct: false
  - text: a · b
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es 'b/a (la fracción invertida)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5/8, ¿cuál es su inverso multiplicativo?
  choices:
  - text: 8/5
    is_correct: true
  - text: -5/8
    is_correct: false
  - text: 5/8
    is_correct: false
  - text: 1/5
    is_correct: false
  explanation: La alternativa correcta es '8/5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar la fracción dada $\frac{a}{b}$ con $a \neq 0$.'
- 'Paso 2: Intercambiar la posición de sus términos colocando $b$ arriba y $a$ abajo.'
- 'Paso 3: Declarar $\frac{b}{a}$ como el inverso multiplicativo o recíproco.'
errores_correccion: '- **Error 1: Confundir inverso multiplicativo con opuesto aditivo
  (poner $-\frac{a}{b}$).** **Cómo corregirlo:** El inverso multiplicativo INVIERTE
  posiciones ($\frac{b}{a}$); el opuesto aditivo cambia de signo ($\frac{-a}{b}$).


  - **Error 2: Intentar hallar el inverso multiplicativo del cero.** **Cómo corregirlo:**
  El cero NO TIENE inverso multiplicativo porque no se puede dividir por cero.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el inverso multiplicativo de 3?
  alternativas:
  - 1/3
  - '-3'
  - 3/1
  respuesta: 1/3
  solucion_pasos:
  - $3 = \frac{3}{1} \implies$ su inverso multiplicativo es $\frac{1}{3}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el recíproco de -4/7?
  alternativas:
  - -7/4
  - 7/4
  - 4/7
  respuesta: -7/4
  solucion_pasos:
  - 'Mantiene el signo menos e invierte términos: $-\frac{7}{4}$.'
- titulo: ¿Es el producto de una fracción por su inverso multiplicativo siempre igual
    a 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{a}{b} \cdot \frac{b}{a} = 1$ por definición.
- titulo: ¿Tiene el número 0 inverso multiplicativo en Q?
  respuesta: 'No'
  solucion_pasos:
  - No, el 0 es el único elemento sin inverso multiplicativo.
errores_frecuentes:
- El inverso multiplicativo de una fracción se calcula únicamente cambiando su signo.
- El número cero posee un inverso multiplicativo bien definido igual a cero.
- Multiplicar una fracción por su inverso multiplicativo da como resultado el entero
  cero.
- El inverso multiplicativo de $1/4$ es el número entero 14.
- El recíproco de una fracción negativa se convierte en una fracción positiva.
afirmaciones_verdaderas:
- El inverso multiplicativo de $\frac{a}{b}$ es $\frac{b}{a}$ ($a \neq 0$), cumpliendo
  $\frac{a}{b} \cdot \frac{b}{a} = 1$.
- El cero es el único número en $\mathbb{Q}$ que carece de inverso multiplicativo.
al_terminar_debes_poder: Al terminar serás capaz de hallar el inverso multiplicativo
  (recíproco) de cualquier fracción no nula, verificando que su producto por la fracción
  original sea igual a 1.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
