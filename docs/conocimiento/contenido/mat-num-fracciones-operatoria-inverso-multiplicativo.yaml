semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.INVERSO_MULTIPLICATIVO
resumen_inicial: El inverso multiplicativo o recíproco de una fracción no nula es
  aquella otra fracción que resulta de dar vuelta sus términos (invertir numerador
  y denominador), tal que su producto es 1.
explicacion_simple: 'El **inverso multiplicativo** (también llamado recíproco) de
  una fracción es simplemente darla vuelta ''cabeza abajo''. Si tienes la fracción
  $\frac{3}{5}$, su inverso multiplicativo es $\frac{5}{3}$. ¿Por qué se le llama
  inverso? Porque si multiplicas la fracción original por su inverso ($\frac{3}{5}
  \times \frac{5}{3}$), el resultado es exactamente **1**. El único número que no
  tiene inverso multiplicativo es el cero.

  '
explicacion_formal: 'Formalmente, dada una fracción no nula $\frac{a}{b} \in \mathbb{Q}
  \setminus \{0\}$ (con $a, b \neq 0$), su **inverso multiplicativo** o **recíproco**
  se denota como $\left(\frac{a}{b}\right)^{-1}$ y se define como:

  $\left(\frac{a}{b}\right)^{-1} = \frac{b}{a}$


  Propiedad fundamental del neutro multiplicativo:

  $\frac{a}{b} \cdot \left(\frac{a}{b}\right)^{-1} = \frac{a}{b} \cdot$ \frac{b}{a}$
  = \frac{a \cdot b}{b \cdot a} = 1$

  '
definiciones_clave: '- **Inverso multiplicativo (Recíproco)**: Fracción $\frac{b}{a}$
  asociada a $\frac{a}{b}$ que satisface $\frac{a}{b} \cdot \frac{b}{a} = 1$.

  - **Propiedad del elemento inverso**: Axioma que garantiza que todo racional no
  nulo posee un único inverso multiplicativo en $\mathbb{Q}$.

  - **Notación de potencia $-1$**: Expresión $\left(\frac{a}{b}\right)^{-1} = \frac{b}{a}$.

  '
propiedades_relaciones: '- **Involución**: El inverso del inverso de una fracción
  devuelve la fracción original: $\left(\left(\frac{a}{b}\right)^{-1}\right)^{-1}
  = \frac{a}{b}$.

  - **Conservación de signo**: Una fracción positiva posee un inverso positivo y una
  fracción negativa posee un inverso negativo (ejemplo: el inverso de $-\frac{2}{7}$
  es $-\frac{7}{2}$).

  - **Inverso del entero $n \neq 0$**: El inverso multiplicativo de un entero $n$
  es la unidad fraccionaria $\frac{1}{n}$.

  - **Inexistencia del inverso de $0$**: El número $0$ no posee inverso multiplicativo
  porque la división entre cero no está definida.

  '
ejemplo_guiado:
  enunciado: Halla el inverso multiplicativo de la fracción $-\frac{4}{9}$, demuestra
    la propiedad fundamental multiplicando ambos números y calcula el inverso del
    número entero $6$.
  pasos:
  - 'Invertir la fracción manteniendo el signo negativo: $-\frac{4}{9} \implies \text{Inverso:
    } -\frac{9}{4}$.'
  - 'Verificar multiplicando: $\left(-\frac{4}{9}\right) \cdot \left(-\frac{9}{4}\right)
    = +\frac{36}{36} = 1$.'
  - 'Expresar el entero $6$ como fracción: $6 = \frac{6}{1}$.'
  - 'Invertir el entero $6$: $\left(\frac{6}{1}\right)^{-1} = \frac{1}{6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué valor numérico se obtiene siempre al multiplicar cualquier fracción
    no nula $\frac{a}{b}$ por su inverso multiplicativo $\frac{b}{a}$?
  choices:
  - text: Se obtiene siempre exactamente 1 (el elemento neutro multiplicativo).
    is_correct: true
  - text: Se obtiene siempre 0.
    is_correct: false
  - text: Se obtiene el cuadrado de la fracción original.
    is_correct: false
  - text: Se obtiene un número negativo.
    is_correct: false
  explanation: 'La correcta es Se obtiene siempre exactamente 1 (el elemento neutro
    multiplicativo).: por definición, $\frac{a}{b} \cdot \frac{b}{a} = \frac{a \cdot
    b}{a \cdot b} = 1$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el inverso multiplicativo del número mixto $2\frac{1}{3}$?
  choices:
  - text: \$\frac{3}{7}$
    is_correct: true
  - text: 2\$\frac{3}{1}$
    is_correct: false
  - text: \$\frac{7}{3}$
    is_correct: false
  - text: -\$\frac{7}{3}$
    is_correct: false
  explanation: 'La alternativa correcta es: \$\frac{3}{7}$. La correcta es \frac{3}{7}:
    primero convertimos $2\frac{1}{3} = \frac{7}{3}$, y su inverso recíproco es $\frac{3}{7}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Si se trata de un número mixto o entero, convertirlo primero a una fracción
  impropia estándar $\frac{a}{b}$.'
- 'Paso 2: Intercambiar de lugar los términos: el numerador $a$ pasa al denominador
  y el denominador $b$ pasa al numerador.'
- 'Paso 3: Mantener el signo original de la fracción.'
- 'Paso 4: Verificar que el producto de la fracción original y la nueva fracción resulte
  $1$.'
errores_correccion: 'Un error frecuente es cambiarle el signo al hallar el inverso
  multiplicativo (confundirlo con el inverso aditivo). Recuerda: **el inverso multiplicativo
  NO cambia el signo**, solo invierte la posición del numerador y denominador.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el inverso multiplicativo de $\frac{8}{11}$?
  alternativas:
  - \$\frac{11}{8}$
  - -\$\frac{8}{11}$
  - -\$\frac{11}{8}$
  respuesta: \$\frac{11}{8}$
  solucion_pasos:
  - 'Invertimos los términos: $\frac{8}{11} \implies \frac{11}{8}$.'
  - 'Comprobamos: $\frac{8}{11} \cdot \frac{11}{8} = 1$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el inverso multiplicativo de $-\frac{1}{5}$?
  alternativas:
  - -5 (o -\$\frac{5}{1}$)
  - '+5'
  - \$\frac{1}{5}$
  respuesta: -5 (o -\$\frac{5}{1}$)
  solucion_pasos:
  - 'Invertimos el número conservando el signo negativo: $-\frac{5}{1} = -5$.'
- titulo: ¿Tiene el número cero ($0$) inverso multiplicativo en $\mathbb{Q}$?
  respuesta: 'No'
  solucion_pasos:
  - No, porque $0 = \frac{0}{1}$ tendría como supuesto inverso $\frac{1}{0}$, lo cual
    es una indeterminación matemática (división entre cero).
- titulo: ¿Es el número $1$ su propio inverso multiplicativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, el inverso de $1 = \frac{1}{1}$ es $\frac{1}{1} = 1$, y de $-1$ es $-1$.
errores_frecuentes:
- Confundir el inverso multiplicativo (recíproco) con el inverso aditivo (opuesto
  de signo).
- Intentar hallar el inverso multiplicativo de 0.
- Intentar invertir un número mixto sin haberlo transformado previamente en fracción
  impropia.
- Olvidar mantener el signo negativo al invertir una fracción negativa.
- Creer que invertir una fracción cambia su valor en la suma.
afirmaciones_verdaderas:
- El inverso multiplicativo de una fracción no nula $\frac{a}{b}$ es $\frac{b}{a}$,
  y satisface $\frac{a}{b} \cdot \frac{b}{a} = 1$.
- Todo número racional no nulo posee un único inverso multiplicativo en $\mathbb{Q}$
  que conserva su mismo signo.
al_terminar_debes_ponder: 'Debes ser capaz de identificar e invertir cualquier número
  racional no nulo, distinguiéndolo claramente del inverso aditivo.

  '
fuente: Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números
  racionales.
