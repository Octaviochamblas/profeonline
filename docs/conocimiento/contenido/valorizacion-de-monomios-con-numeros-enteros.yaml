semantic_id: MAT.ALG.VALORIZACION.MONOMIO_ENTEROS
resumen_inicial: 'Valorización de monomios con números enteros: traducción, reglas
  y aplicación práctica en Valorización de expresiones algebraicas.'
explicacion_simple: Un monomio es un bloque sólido de álgebra, sin sumas ni restas
  que lo dividan. Todo está conectado por la multiplicación. Es el ladrillo fundamental.
explicacion_formal: '### Definición formal


  Las potencias siempre tienen prioridad sobre las multiplicaciones. El cuadrado solo
  afecta a la $x$, no al 5 ni a la $y$.


  ### Desarrollo didáctico


  Ejemplo de monomio: $7m^2n$.

  Este término es en realidad una multiplicación triple oculta: $7 \cdot m^2 \cdot
  n$.

  Si $m=2$ y $n=3$:

  1. Sustituimos: $7 \cdot (2)^2 \cdot (3)$.

  2. Papomudas nos obliga a resolver la potencia primero: $2^2 = 4$.

  3. La expresión queda como una cadena de multiplicaciones puras: $7 \cdot 4 \cdot
  3$.

  4. Resolvemos de izquierda a derecha (o en el orden que prefieras, la multiplicación
  es conmutativa): $28 \cdot 3 = 84$.'
definiciones_clave: '- **Valorización de monomios con números enteros**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de valorización de monomios con números enteros.'
