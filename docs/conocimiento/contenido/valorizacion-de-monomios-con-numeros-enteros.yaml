resumen_inicial: La valorización de monomios con números enteros calcula el producto
  del coeficiente por las potencias de los enteros asignados a sus variables.
explicacion_simple: 'Para calcular el valor de un monomio como $-3x^2y$ cuando nos
  dan números enteros (por ejemplo $x = 2$ e $y = 5$), reemplazamos las letras respetando
  los exponentes: $-3 \cdot (2)^2 \cdot (5) = -3 \cdot 4 \cdot 5 = -60$.'
explicacion_formal: 'Sea $M = c \prod_{j=1}^m x_j^{e_j}$ un monomio. Su **Valorización
  Entera** para el vector $v = (v_1, \dots, v_m) \in \mathbb{Z}^m$ se define como:


  $$V_v(M) = c \cdot \prod_{j=1}^m v_j^{e_j} \in \mathbb{Z}$$


  > **Complemento didáctico:** La evaluación del monomio sintetiza la regla de los
  signos del producto con el cálculo de potencias enteras.'
definiciones_clave: '- **Valorización de monomio**: Producto escalar $c \cdot v_1^{e_1}
  \dots v_m^{e_m}$.'
propiedades_relaciones: '- **Regla de signos**: Potencias pares de enteros negativos
  producen valores positivos; potencias impares conservan el signo negativo.'
ejemplo_guiado:
  enunciado: Valorice el monomio $M = -2x^3y^2$ para $x = -2$ e $y = 3$.
  pasos:
  - 'Paso 1: Calcular la potencia $(-2)^3 = -8$ (exponente impar conserva signo negativo).'
  - 'Paso 2: Calcular la potencia $(3)^2 = 9$.'
  - 'Paso 3: Multiplicar el coeficiente por las potencias: $-2 \cdot (-8) \cdot 9$.'
  - 'Paso 4: Multiplicar signos y valores: $+16 \cdot 9 = 144$.'
  - 'Conclusión: El valor del monomio es $144$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué resultado se obtiene al elevar un entero negativo a un exponente
    par durante la valorización?
  choices:
  - text: Un valor entero positivo
    is_correct: true
  - text: Un valor entero negativo
    is_correct: false
  - text: Un resultado igual a cero
    is_correct: false
  - text: Una fracción irracional
    is_correct: false
  explanation: La alternativa correcta es 'Un valor entero positivo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para -2x^3y^2 con x = -2 e y = 3, ¿cuál fue el resultado
    final?
  choices:
  - text: '144'
    is_correct: true
  - text: '-144'
    is_correct: false
  - text: '72'
    is_correct: false
  - text: '-36'
    is_correct: false
  explanation: La alternativa correcta es '144'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular primero las potencias de cada entero asignado.'
- 'Paso 2: Aplicar la ley de signos correspondiente a los exponentes.'
- 'Paso 3: Multiplicar los resultados obtenidos por el coeficiente numérico.'
errores_correccion: '- **Error 1: Multiplicar el coeficiente por la base antes de
  elevar a la potencia (por ejemplo en $2x^3$ con $x=3$ hacer $(2 \cdot 3)^3 = 216$).**
  **Cómo corregirlo:** La potencia se calcula primero: $2(3^3) = 2(27) = 54$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Valorice el monomio 4x^2y para x = -3 e y = 2.
  alternativas:
  - '72'
  - '-72'
  - '36'
  - '-36'
  respuesta: '72'
  solucion_pasos:
  - '1. Potencia: (-3)^2 = 9.'
  - '2. Multiplicar: 4(9)(2) = 72.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de -5ab^3 para a = 2 y b = -1?
  alternativas:
  - '10'
  - '-10'
  - '30'
  - '-30'
  respuesta: '10'
  solucion_pasos:
  - '1. Potencia: (-1)^3 = -1.'
  - '2. Multiplicar: -5(2)(-1) = 10.'
- titulo: ¿Es el valor del monomio x^4 para x = -2 igual a 16?
  respuesta: Sí
  solucion_pasos:
  - Sí, (-2)^4 = 16 por tener exponente par.
- titulo: ¿Produce (-1)^3 un resultado positivo igual a +1?
  respuesta: 'No'
  solucion_pasos:
  - 'No, al ser el exponente impar el resultado conserva el signo negativo: -1.'
errores_frecuentes:
- Multiplicar la base por el coeficiente antes de calcular la potencia del término.
- Declarar que elevar un entero negativo a un exponente par da resultado negativo.
- Omitir el signo negativo del coeficiente al multiplicar las potencias calculadas.
- Multiplicar la base por el exponente en lugar de elevar a la potencia.
- Declarar que los exponentes negativos se aplican directamente como multiplicadores.
afirmaciones_verdaderas:
- Las potencias se calculan siempre antes de multiplicar por el coeficiente del monomio.
- Un entero negativo elevado a un exponente par resulta en una cantidad positiva.
al_terminar_debes_poder: Al terminar serás capaz de valorizar monomios sustituyendo
  enteros y aplicando correctamente potencias y leyes de signos.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Valorización.
