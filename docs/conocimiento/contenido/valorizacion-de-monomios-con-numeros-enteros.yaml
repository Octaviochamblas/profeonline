semantic_id: MAT.ALG.VALORIZACION.MONOMIO_ENTEROS
resumen_inicial: La valorización de monomios con números enteros consiste en calcular el producto del coeficiente numérico por cada una de las variables elevadas a sus exponentes, sustituidas por números enteros.
explicacion_simple: "Un **monomio** es un solo término algebraico formado por la multiplicación de un número (coeficiente) y letras (variables):\n- Para valorizar un monomio con **números enteros** (positivos o negativos):\n  - **Paso 1**: Reemplaza cada letra por su número entero asignado **usando paréntesis**.\n  - **Paso 2**: Eleva cada entero a su exponente respectivo (¡cuidado con la regla de los signos en potencias!).\n  - **Paso 3**: Multiplica el coeficiente por los resultados de las potencias.\n- **Ejemplo**: Valorizar $-4x^2 y$ para $x = -3$ e $y = 2$:\n  - Sustitución: $-4(-3)^2(2)$.\n  - Potencia: $(-3)^2 = 9 \\implies -4(9)(2)$.\n  - Producto final: $-36(2) = \\mathbf{-72}$.\n\n![Valorización de Monomios con Enteros](/static/img/nodos/valorizacion-de-monomios-con-numeros-enteros-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $M(x_1, \dots, x_k) = c \cdot x_1^{a_1} x_2^{a_2} \dots x_k^{a_k}$ un monomio de coeficiente $c \in \mathbb{Z}$ y grado total $G = \sum a_i$. La **valorización en números enteros** es la evaluación puntual sobre la k-tupla $(z_1, \dots, z_k) \in \mathbb{Z}^k$:


  $$M(z_1, \dots, z_k) = c \cdot \prod_{i=1}^k z_i^{a_i}$$


  ### Regla de Signos en Potencias de Enteros

  Para cualquier entero negativo $z < 0$ y exponente entero $a \in \mathbb{N}_0$:


  $$z^a = \begin{cases} > 0 & \text{si } a \text{ es par} \\ < 0 & \text{si } a \text{ es impar} \end{cases}$$


  ### Síntesis didáctica

  La correcta aplicación de los paréntesis al sustituir bases enteras negativas evita errores sistemáticos de signo en la física y el cálculo de volúmenes.

  '
definiciones_clave: '- **Valorización de monomio**: Evaluación del producto único $c \cdot x^a y^b \dots$ al reemplazar variables por constantes enteras.

  - **Base entera negativa ($(-z)^a$)**: Elemento cuya paridad del exponente $a$ determina si el resultado es positivo o negativo.

  - **Producto de coeficientes**: Multiplicación final de todos los factores numéricos obtenidos.

  '
propiedades_relaciones: '- **Factor nulo**: Si alguna de las variables toma el valor $0$, el resultado de la valorización de todo el monomio es idénticamente $0$.

  - **Paridad del monomio de grado par**: Si todas las variables están elevadas a exponentes pares, sustituir $z$ o $-z$ produce el mismo resultado.

  '
ejemplo_guiado:
  enunciado: Calcula el valor numérico del monomio $-5x^3 y^2$ para $x = -2$ e $y = -3$.
  pasos:
  - 'Paso 1: Reemplazamos las variables por sus enteros entre paréntesis: $-5(-2)^3(-3)^2$.'
  - 'Paso 2: Calculamos $(-2)^3$: Al ser exponente impar 3, el resultado es negativo $\implies -8$.'
  - 'Paso 3: Calculamos $(-3)^2$: Al ser exponente par 2, el resultado es positivo $\implies 9$.'
  - 'Paso 4: Sustituimos las potencias en el monomio: $-5(-8)(9)$.'
  - 'Paso 5: Multiplicamos progresivamente: $-5 \cdot (-8) = +40 \implies +40 \cdot 9 = +360$.'
  - 'Conclusión: El valor numérico del monomio es **$360$**.'
  imagen: /static/img/nodos/valorizacion-de-monomios-con-numeros-enteros-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué signo se obtiene al elevar una base entera negativa a un exponente par en la valorización de un monomio?
  choices:
  - text: Se obtiene un resultado positivo, por la regla $(-z)^{\text{par}} > 0$
    is_correct: true
  - text: Se obtiene siempre un resultado negativo
    is_correct: false
  - text: El resultado es indeterminado
    is_correct: false
  - text: El resultado es cero
    is_correct: false
  explanation: La alternativa correcta es 'Se obtiene un resultado positivo, por la regla $(-z)^{\text{par}} > 0$'. Exponente par elimina el signo negativo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor del monomio $3a^2 b$ para $a = -4$ y $b = 2$?
  choices:
  - text: El valor es $96$, obtenido mediante $3(-4)^2(2) = 3(16)(2) = 96$
    is_correct: true
  - text: El valor es $-96$
    is_correct: false
  - text: El valor es $-24$
    is_correct: false
  - text: El valor es $48$
    is_correct: false
  explanation: La alternativa correcta es 'El valor es $96$, obtenido mediante $3(-4)^2(2) = 3(16)(2) = 96$'. $(-4)^2 = 16 \implies 3(16)(2) = 96$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar cada variable del monomio por su entero asignado encerrado entre paréntesis.'
- 'Paso 2: Calcular las potencias determinando el signo según la paridad del exponente.'
- 'Paso 3: Multiplicar el coeficiente numérico por el resultado de las potencias.'
- 'Paso 4: Aplicar la regla general de signos para el producto final de enteros.'
errores_correccion: '- **Error 1:** Escribir $-3^2 = -9$ al sustituir $x = -3$ en $x^2$. **Cómo corregirlo:** La base sustituida **debe llevar paréntesis $(-3)^2 = +9$**; sin paréntesis se mantiene el signo negativo.

  - **Error 2:** Excluir el coeficiente en el producto final de las potencias. **Cómo corregirlo:** El coeficiente **debe multiplicarse al final ($c \cdot \text{potencias}$)**.

  '
ejemplos:
- titulo: Monomio simple con negativo
  enunciado: ¿Cuál es el valor de $-2x^3$ para $x = -3$?
  alternativas:
  - $54$
  - $-54$
  - $18$
  respuesta: $54$
  solucion_pasos:
  - '1. Sustitución: $-2(-3)^3$.'
  - '2. Potencia: $(-3)^3 = -27$.'
  - '3. Producto: $-2(-27) = +54$.'
- titulo: Monomio con dos variables
  enunciado: ¿Cuál es el valor de $4a b^2$ para $a = 5$ y $b = -2$?
  alternativas:
  - $80$
  - $-80$
  - $40$
  respuesta: $80$
  solucion_pasos:
  - '1. Sustitución: $4(5)(-2)^2$.'
  - '2. Operaciones: $4(5)(4) = 80$.'
- titulo: Variable cero
  enunciado: Para $x = 0$, ¿es el valor de $-7x^4 y^3$ igual a $0$ independientemente de $y$?
  respuesta: Sí
  solucion_pasos:
  - Sí, cualquier número multiplicado por cero da cero.
- titulo: Monomio de grado par
  enunciado: ¿Producen $x = 2$ y $x = -2$ el mismo resultado en la valorización del monomio $5x^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(2)^2 = 4$ y $(-2)^2 = 4 \implies 5(4) = 20$.
errores_frecuentes:
- Los paréntesis no son incluidos al sustituir bases enteras negativas produciendo errores de signo en las potencias.
- El coeficiente numérico inicial no es multiplicado por el producto de las potencias.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Declarar que la potencia con exponente impar de un entero negativo produce un resultado positivo.
- Sumar los coeficientes y potencias en lugar de multiplicarlos dentro del monomio.
afirmaciones_verdaderas:
- La valorización de un monomio multiplica su coeficiente por el valor de cada variable elevada a su respectivo exponente.
- Una base entera negativa elevada a un exponente par da siempre un resultado positivo.
al_terminar_debes_poder: '![Resumen de valorización de monomios con enteros](/static/img/nodos/valorizacion-de-monomios-con-numeros-enteros-resumen.svg)


  QUÉ: Evaluar numéricamente monomios simples y multivariables con valores enteros.


  CÓMO: Calcular primero las potencias de cada base entera $(c_i)^{e_i}$ y multiplicar ordenadamente los factores resultantes por el coeficiente escalar.'
