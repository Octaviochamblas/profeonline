- titulo: 'Respecto de «Valorización de monomios con números enteros»: ¿La siguiente
    conclusión es corr'
  enunciado: 'Respecto de «Valorización de monomios con números enteros»: ¿La siguiente
    conclusión es correcta? «Multiplicar primero y elevar a la potencia después. (Ej:
    $(2 \cdot 3)^2$ en lugar de $2 \cdot 3^2$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para valorizar un **Monomio**,
    se sustituyen sus variables por los números dados y se realiza la **multiplicación
    continuada** entre el coeficiente (el número inicial) y los valores de las letras.'
errores_frecuentes:
- 'Multiplicar primero y elevar a la potencia después. (Ej: $(2 \cdot 3)^2$ en lugar
  de $2 \cdot 3^2$).'
- Ignorar el signo negativo del coeficiente inicial.
- La multiplicación de $5$ por $x$, y luego elevar ese resultado al cuadrado.
- La multiplicación de $x$ por $y$.
- Es indiferente, en la multiplicación el orden no altera el producto.
