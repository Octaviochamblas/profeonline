procedimiento:
- 'Paso 1: Identifica el coeficiente (el número grande adelante) y anótalo.'
- 'Paso 2: Sustituye las letras por sus valores numéricos entre paréntesis.'
- 'Paso 3: Aplica los exponentes a los valores que los tengan.'
- 'Paso 4: Multiplica todos los números resultantes para obtener el valor final del
  monomio.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  valorización de monomios con números enteros.
ejemplos:
- titulo: El bloque irrompible
  enunciado: Valora -3xy^3 para x=4, y=2.
  solucion_pasos:
  - 'Sustituyendo: -3 * (4) * (2)^3.'
  - 'Potencia primero: 2^3 = 8.'
  - 'Expresión: -3 * 4 * 8.'
  - 'Multiplicando: -12 * 8 = -96.'
- titulo: La fórmula para el volumen de una pirámide de base cuadrada es $V = \frac13
    a^2 h$, donde $a
  enunciado: 'La fórmula para el volumen de una pirámide de base cuadrada es $V =
    \frac13 a^2 h$, donde $a$ es la arista de la base y $h$ la altura. Si un arquitecto
    diseña una pirámide con $a = 6$ m y $h = 10$ m, ¿cuál será su volumen en metros
    cúbicos? (v1)


    Opciones: A) $120$ · B) $360$ · C) $400$ · D) $40$'
  solucion_pasos:
  - 'Sustituimos en el monomio: $V = \frac{1}{3} (6)^2 (10)$. Potencia: $6^2 = 36$.
    Multiplicamos: $\frac{1}{3} \cdot 36 = 12$. Finalmente, $12 \cdot 10 = 120$.'
  - 'Respuesta: $120$'
- titulo: 'Respecto de «Valorización de monomios con números enteros»: ¿La siguiente
    formulación es cor'
  enunciado: 'Respecto de «Valorización de monomios con números enteros»: ¿La siguiente
    formulación es correcta? «Para valorizar un **Monomio**, se sustituyen sus variables
    por los números dados y se realiza la **multiplicación continuada** entre el coeficiente
    (el número inicial) y los valores de las letras»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para valorizar un **Monomio**,
