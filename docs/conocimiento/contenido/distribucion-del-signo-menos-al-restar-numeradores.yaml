semantic_id: MAT.ALG.FRACCIONES_RESTA.DISTRIBUCION_SIGNO_MENOS
resumen_inicial: El signo negativo de la sustracción debe distribuirse cambiando el
  signo a cada uno de los términos del polinomio del segundo numerador.
explicacion_simple: 'Cuando restamos una fracción cuyo numerador contiene más de un
  término (como $3x - 5$), el signo menos delante de la fracción actúa como un $-1$
  multiplicando a todo ese polinomio.

  Esto significa que al eliminar el paréntesis del segundo numerador, DEBEMOS cambiar
  el signo de absolutamente todos sus términos:

  Los términos positivos se vuelven negativos y los términos negativos se convierten
  en positivos.'
explicacion_formal: 'Dada la resta de polinomios numeradores $A(x) - (B_1 x^k + B_2
  x^{k-1} + \dots + B_0)$, la **propiedad distributiva de la negación** establece:


  $$- (B_1 x^k + B_2 x^{k-1} + \dots + B_0) = -B_1 x^k - B_2 x^{k-1} - \dots - B_0$$


  $$\frac{A(x)}{D(x)} - \frac{B_1 x + B_0}{D(x)} = \frac{A(x) - B_1 x - B_0}{D(x)}$$


  **Desglose de la fórmula:**

  - $-B_1 x - B_0$: Inversión explícita del signo de cada término individual del polinomio
  sustraendo.'
definiciones_clave: '- **Distribución del signo menos**: Aplicación de la ley de signos
  a todos los sumandos de un polinomio entre paréntesis.

  - **Inversión de signos del sustraendo**: Cambio de positivo a negativo y viceversa
  en el segundo numerador.'
propiedades_relaciones: '- **Precedencia de paréntesis**: Los paréntesis del sustraendo
  tienen máxima prioridad y deben resolverse antes de reducir términos semejantes.

  - **Error de signo único**: Cambiar solo el primer término del sustraendo altera
  completamente la función racional resultante.'
ejemplo_guiado:
  enunciado: Aplica la distribución correcta del signo menos en la sustracción $\frac{x^2
    + 6x}{x + 1} - \frac{2x - 3}{x + 1}$, reduce el numerador y evalúa para $x = 2$.
  pasos:
  - 'Paso 1: Escribir el numerador como la resta de polinomios: $x^2 + 6x - (2x -
    3)$.Paso 2: Distribuir el signo menos cambiando ambos signos: $- (2x - 3) = -2x
    + 3$.Paso 3: Unir y reducir términos semejantes: $x^2 + 6x - 2x + 3 = x^2 + 4x
    + 3$.Paso 4: Escribir la fracción con denominador común: $\frac{x^2 + 4x + 3}{x
    + 1}$.Paso 5: Factorizar el numerador $x^2 + 4x + 3 = (x + 1)(x + 3)$ y cancelar
    $(x + 1)$: resultado $x + 3$ para $x \neq -1$.Paso 6: Evaluar para $x = 2$: $2
    + 3 = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión reducida simplificada al restar $\frac{x^2 + 6x}{x
    + 1} - \frac{2x - 3}{x + 1}$?
  choices:
  - text: $x + 3$
    is_correct: true
  - text: $\frac{x^2 + 4x - 3}{x + 1}$
    is_correct: false
  - text: $x - 3$
    is_correct: false
  - text: $\frac{x^2 + 8x + 3}{x + 1}$
    is_correct: false
  explanation: La alternativa correcta es '$x + 3$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la resta simplificada final $x + 3$ para $x = 2$, ¿cuál es
    el resultado?
  choices:
  - text: $5$
    is_correct: true
  - text: $1$
    is_correct: false
  - text: $9$
    is_correct: false
  - text: $3$
    is_correct: false
  explanation: La alternativa correcta es '$5$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir los numeradores sobre el denominador común utilizando paréntesis
  en el segundo polinomio.'
- 'Paso 2: Observar cada término dentro del paréntesis del sustraendo.'
- 'Paso 3: Cambiar el signo positivo por negativo y el negativo por positivo en cada
  término al quitar el paréntesis.'
- 'Paso 4: Sumar o restar los términos semejantes resultantes.'
- 'Paso 5: Verificar si el polinomio del numerador admite factorización final.'
errores_correccion: '- **Error común:** Escribir $-(2x - 3) = -2x - 3$ conservando
  el signo negativo de $-3$.

  - **Cómo corregirlo:** Recuerda la regla de los signos: menos por menos da MÁS.
  Por ende, $-(2x - 3) = -2x + 3$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sustracción.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sustracción.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El signo menos afecta a todo el segundo numerador?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la ley distributiva de la resta.
- titulo: ¿Es conmutativa la sustracción de fracciones?
  respuesta: 'No'
  solucion_pasos:
  - No, restar $A - B$ da un resultado opuesto a $B - A$.
errores_frecuentes:
- Restar los denominadores al realizar la sustracción de fracciones algebraicas.
- Olvidar colocar paréntesis en el segundo numerador al restar.
- Cambiar solo el signo del primer término del sustraendo.
- Restar numeradores de fracciones de distinto denominador sin homogeneizar.
- Confundir el m.c.m. con el producto simple de los denominadores.
afirmaciones_verdaderas:
- Al restar fracciones algebraicas se conserva el denominador común y se restan los
  numeradores.
- El signo negativo de la sustracción invierte el signo de todos los términos del
  segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás efectuar sustracciones de
  fracciones algebraicas aplicando correctamente la distribución de signos y simplificación
  del resultado.
