semantic_id: MAT.FUND.LOGICA_BASICA.VARIABLE_PROPOSICIONAL
resumen_inicial: 'Definición y uso de variables proposicionales ($p, q, r$) como símbolos abstractos que representan proposiciones simples y adoptan valores en $\{V, F\}$.'
explicacion_simple: |
  Así como en álgebra usamos letras como $x$ o $y$ para representar números desconocidos, en lógica usamos letras minúsculas como **$p$, $q$, $r$, $s$** para representar frases u oraciones completas. Estas letras se llaman **variables proposicionales**. Gracias a ellas, no necesitamos escribir oraciones largas repetidamente y podemos analizar la estructura pura del razonamiento sin distraernos con el tema del que se habla. Cada variable proposicional puede tomar solo uno de dos valores: **Verdadero ($V$)** o **Falso ($F$)**.
explicacion_formal: |
  ### Definición formal
  En el lenguaje formal de la lógica proposicional $\mathcal{L}_0$, una **variable proposicional** (o átomo lógico) es un símbolo perteneciente a un conjunto numerable de variables atómicas $\mathcal{V} = \{p, q, r, s, t, p_1, p_2, \dots\}$. Formalmente, cada variable proposicional $p \in \mathcal{V}$ actúa como un elemento primitivo de la sintaxis cuyo dominio semántico de asignación de verdad es:
  $$\operatorname{Dom}(v(p)) = \mathbb{V} = \{V, F\}$$

  ### Desglose simbólico
  - Símbolos atómicos estándar: Letras latinas minúsculas $p, q, r, s$.
  - Espacio de estados para $n$ variables: $\mathbb{V}^n = \{V, F\}^n$, con cardinalidad $|\mathbb{V}^n| = 2^n$.
  - Abstracción semántica: La variable $p$ captura la condición veritativa de un enunciado sin depender del significado empírico de las palabras.

  ### Síntesis didáctica
  Las variables proposicionales permiten traducir oraciones del lenguaje natural a fórmulas matemáticas manipulables mediante álgebra de Boole y tablas de verdad.
definiciones_clave: |
  - **Variable proposicional**: Símbolo literal ($p, q, r$) que representa una proposición simple arbitraria.
  - **Átomo lógico**: Expresión mínima indivisible en la sintaxis del cálculo proposicional.
  - **Asignación de variable**: Fijación de un valor de verdad específico ($v(p) = V$ o $v(p) = F$) a una variable lógica.
propiedades_relaciones: |
  - **Distinción respecto a variables algebraicas**: Una variable algebraica $x$ representa una cantidad numérica en $\mathbb{R}$, mientras que una variable proposicional $p$ representa un estado de verdad en $\{V, F\}$.
  - **Consistencia veritativa**: Dentro de una misma fórmula o deducción lógica, una variable proposicional $p$ debe mantener el mismo valor de verdad en todas sus apariciones.
ejemplo_guiado:
  enunciado: 'Define variables proposicionales para representar simbólicamente el siguiente razonamiento: "Si $16$ es divisible por $4$, entonces $16$ es un número par".'
  pasos:
    - 'Paso 1: Identificar la primera proposición simple del enunciado: "16 es divisible por 4".'
    - 'Paso 2: Asignar la primera variable proposicional: Sea $p$: "$16$ es divisible por $4$".'
    - 'Paso 3: Identificar la segunda proposición simple: "16 es un número par".'
    - 'Paso 4: Asignar la segunda variable proposicional: Sea $q$: "$16$ es un número par". La estructura lógica simbolizada es $p \to q$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué tipo de símbolos se utilizan por convención estándar para denotar variables proposicionales en lógica matemática?'
    choices:
      - {text: 'Letras latinas minúsculas como $p, q, r, s$', is_correct: true}
      - {text: 'Números romanos como I, II, III', is_correct: false}
      - {text: 'Signos de puntuación como comas y puntos', is_correct: false}
      - {text: 'Letras griegas mayúsculas como $\Omega, \Sigma$', is_correct: false}
    explanation: 'La alternativa correcta es ''Letras latinas minúsculas como $p, q, r, s$''. Son los símbolos universales para variables proposicionales atómicas.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la diferencia esencial entre una variable algebraica $x$ y una variable proposicional $p$?'
    choices:
      - {text: 'La variable algebraica toma valores numéricos, mientras que la proposicional toma valores de verdad $\{V, F\}$', is_correct: true}
      - {text: 'La variable algebraica es siempre verdadera y la proposicional es siempre falsa', is_correct: false}
      - {text: 'No existe ninguna diferencia conceptual entre ambas variables', is_correct: false}
      - {text: 'La variable proposicional solo se puede sumar y restar', is_correct: false}
    explanation: 'La alternativa correcta es ''La variable algebraica toma valores numéricos, mientras que la proposicional toma valores de verdad $\{V, F\}$''. Tienen dominios de definición completamente distintos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las proposiciones atómicas individuales presentes en el texto.'
  - 'Paso 2: Asignar una letra minúscula única ($p, q, r, \dots$) a cada proposición atómica distinta.'
  - 'Paso 3: Declarar explícitamente el diccionario de equivalencias (ej. Sea $p$: "El triángulo es isósceles").'
  - 'Paso 4: Utilizar las variables asignadas para construir y operar con la fórmula lógica correspondiente.'
errores_correccion: |
  - **Error 1:** Asignar la misma letra proposicional a dos afirmaciones diferentes. **Cómo corregirlo:** Cada proposición simple con significado distinto debe recibir una variable proposicional diferente ($p$ para la primera, $q$ para la segunda).
  - **Error 2:** Creer que una variable proposicional $p$ posee un valor de verdad fijo inmutable a priori. **Cómo corregirlo:** Una variable proposicional es un símbolo abstracto que puede asumir tanto el valor $V$ como el valor $F$ según el contexto o la fila de la tabla de verdad.
ejemplos:
  - titulo: 'Asignación de variables'
    enunciado: '¿Cuáles son las variables proposicionales para "Hoy es lunes o está soleado"?'
    alternativas:
      - 'Sea $p$: "Hoy es lunes", sea $q$: "Está soleado"'
      - 'Sea $x$: "Hoy es lunes", sea $y$: "Lunes soleado"'
      - 'Sea $p$: "Hoy es lunes o está soleado"'
    respuesta: 'Sea $p$: "Hoy es lunes", sea $q$: "Está soleado"'
    solucion_pasos:
      - '1. Se descomponen las dos ideas simples.'
      - '2. Se asignan letras minúsculas distintas $p$ y $q$.'
  - titulo: 'Dominio de una variable proposicional'
    enunciado: '¿El conjunto de valores que puede tomar una variable proposicional $p$ es $\{V, F\}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en la lógica bivalente solo puede tomar los valores Verdadero o Falso.'
  - titulo: 'Consistencia de variable'
    enunciado: '¿Si $p$ es verdadera en una premisa, debe evaluarse como verdadera en todas las apariciones de esa misma premisa?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la asignación de verdad de una variable debe ser consistente dentro del mismo argumento.'
  - titulo: 'Variables proposicionales idénticas'
    enunciado: '¿En la fórmula $p \land p$ se utiliza la misma variable proposicional dos veces?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, ambas posiciones corresponden a la misma proposición atómica $p$.'
errores_frecuentes:
  - 'La afirmación de que una variable proposicional $p$ representa un número real desconocido como en el álgebra.'
  - 'La afirmación de que la variable $p$ tiene un valor de verdad siempre fijado en Verdadero en cualquier tabla.'
  - 'La afirmación de que dos proposiciones simples con significados diferentes pueden nombrarse con la misma letra $p$.'
  - 'La afirmación de que las preguntas y las órdenes pueden representarse formalmente mediante variables proposicionales.'
  - 'La afirmación de que una variable proposicional puede tomar un tercer valor distinto de $V$ o $F$.'
afirmaciones_verdaderas:
  - 'Una variable proposicional es un símbolo literal atómico que representa una proposición simple arbitraria y asume valores en $\{V, F\}$.'
  - 'Las variables proposicionales permiten abstraer la estructura lógica de los argumentos independientemente del contenido semántico de las afirmaciones.'
al_terminar_debes_poder: |
  QUÉ: Definir, asignar y utilizar variables proposicionales ($p, q, r$) para abstraer proposiciones simples.
  CÓMO: Asociar una letra minúscula distinta a cada afirmación atómica e interpretar su dominio de evaluación en $\{V, F\}$.
