resumen_inicial: La evaluación de un polinomio en un valor dado consiste en sustituir
  la variable por un número específico $x = a$ para calcular el valor numérico resultante
  $P(a)$.
explicacion_simple: 'Para evaluar un polinomio como $P(x) = x^2 - 5x + 6$ en $x =
  2$, se reemplaza cada $x$ por $2$ y se resuelve la aritmética: $P(2) = 2^2 - 5(2)
  + 6 = 4 - 10 + 6 = 0$.'
explicacion_formal: 'Sea $P(x) = a_n x^n + a_{n-1} x^{n-1} + \dots + a_1 x + a_0$
  un polinomio con coeficientes en $\mathbb{R}$.


  La **Evaluación Polinomial** define un valor numérico $P(c) \in \mathbb{R}$ mediante
  la aplicación directa del principio de sustitución para $x = c$:


  $$P(c) = a_n c^n + a_{n-1} c^{n-1} + \dots + a_1 c + a_0$$


  **Propiedad del Resto (Teorema del Resto):**

  Al dividir $P(x)$ por el binomio lineal $(x - c)$, el residuo constante $R$ coincide
  exactamente con el valor del polinomio evaluado en $c$:


  $$P(x) = (x - c) Q(x) + R \implies P(c) = (c - c) Q(c) + R = R$$'
definiciones_clave: '- **Valor numérico de un polinomio**: Resultado de resolver las
  operaciones aritméticas indicadas tras sustituir la variable por una constante $c$.

  - **Teorema del Resto**: Afirma que el residuo de la división $P(x) \div (x - c)$
  es igual a $P(c)$.'
propiedades_relaciones: '- **Sustitución directa**: $P(c)$ cuantifica el comportamiento
  del polinomio en el punto numérico $c$. Si $P(c) = 0$, $c$ adquiere la propiedad
  especial de ser un cero o raíz de $P(x)$.'
ejemplo_guiado:
  enunciado: Evalúe el polinomio $P(x) = 2x^3 - 3x^2 + x - 5$ en $x = -2$.
  pasos:
  - 'Paso 1: Sustituir la variable $x$ por $(-2)$ en cada término: $P(-2) = 2(-2)^3
    - 3(-2)^2 + (-2) - 5$.'
  - 'Paso 2: Calcular las potencias respetando los signos: $(-2)^3 = -8$ y $(-2)^2
    = 4$.'
  - 'Paso 3: Multiplicar los coeficientes: $2(-8) - 3(4) - 2 - 5 = -16 - 12 - 2 -
    5$.'
  - 'Paso 4: Sumar los términos algebraicamente: $-16 - 12 - 2 - 5 = -35$. Por ende,
    $P(-2) = -35$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar $P(x) = x^3 - 4x + 1$ en $x = 3$, ¿cuál es el resultado de
    $P(3)$?
  choices:
  - text: $P(3) = 16$
    is_correct: true
  - text: $P(3) = 22$
    is_correct: false
  - text: $P(3) = 10$
    is_correct: false
  - text: $P(3) = 28$
    is_correct: false
  explanation: Calculamos $P(3) = 3^3 - 4(3) + 1 = 27 - 12 + 1 = 16$. Por lo tanto,
    el resultado es $P(3) = 16$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué establece el Teorema del Resto al dividir $P(x)$ por $(x - 5)$?
  choices:
  - text: El resto de la división equivale al valor numérico $P(5)$
    is_correct: true
  - text: El resto de la división equivale a $P(-5)$
    is_correct: false
  - text: El resto de la división es siempre igual a cero
    is_correct: false
  - text: El resto coincide con el grado del polinomio $P(x)$
    is_correct: false
  explanation: Por el Teorema del Resto, el resto de la división equivale al valor
    numérico $P(5)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar formalmente cada instancia de la variable por la constante $c$
  utilizando paréntesis.'
- 'Paso 2: Elevar el valor $c$ a las distintas potencias del polinomio aplicando las
  reglas de signos.'
- 'Paso 3: Multiplicar las potencias por sus coeficientes respectivos.'
- 'Paso 4: Efectuar las sumas y restas finales para obtener $P(c)$.'
errores_correccion: '- **Error 1: Elevar al exponente únicamente la magnitud del número
  e ignorar el signo negativo en $(-2)^2$.** **Cómo corregirlo:** Usar paréntesis
  al sustituir bases negativas: $(-2)^2 = +4$, a diferencia de $-2^2 = -4$.'
ejemplos:
- titulo: Evaluación con término constante independiente
  enunciado: Calcule $P(0)$ para el polinomio $P(x) = 7x^4 - 2x^2 + 9x - 13$.
  respuesta: $P(0) = -13$
  solucion_pasos:
  - 1. $P(0) = 7(0)^4 - 2(0)^2 + 9(0) - 13$.
  - 2. $P(0) = 0 - 0 + 0 - 13 = -13$.
- titulo: ¿Es $P(c)$ igual a cero cuando la división es exacta?
  respuesta: Sí
  solucion_pasos:
  - Sí, si el divisor $(x-c)$ divide exactamente a $P(x)$, el resto $R = P(c) = 0$.
- titulo: ¿El valor $P(-1)$ de $x^3 + x^2 + x + 1$ es nulo?
  respuesta: Sí
  solucion_pasos:
  - $P(-1) = (-1)^3 + (-1)^2 + (-1) + 1 = -1 + 1 - 1 + 1 = 0$.
errores_frecuentes:
- Cálculo de la potencia aplicado solo al valor absoluto sin incluir el signo negativo
  en $(-c)^n$.
- Multiplicación previa del coeficiente por la variable antes de elevar la variable
  a la potencia dada.
- Evaluación directa en $+c$ cuando el divisor lineal se presenta con la forma $(x
  + c)$.
- Suma simple de coeficientes numéricos sin calcular las potencias correspondientes
  de la variable.
- Identificación del valor del residuo $P(c)$ con los términos del cociente polinomial.
afirmaciones_verdaderas:
- El Teorema del Resto asegura que el residuo de $P(x) \div (x - c)$ es igual a $P(c)$.
- Para cualquier polinomio, $P(0)$ equivale al término independiente constante del
  polinomio.
al_terminar_debes_poder: Al terminar serás capaz de evaluar cualquier polinomio en
  un valor dado y relacionar el resultado con el Teorema del Resto.
