procedimiento:
- 'Paso 1: Escribe el polinomio original.'
- 'Paso 2: Sustituye todas las ''x'' por el valor numérico, usando siempre paréntesis
  (ej. $(-3)$).'
- 'Paso 3: Resuelve las potencias primero (cuidado con los signos en potencias pares/impares).'
- 'Paso 4: Resuelve las multiplicaciones.'
- 'Paso 5: Suma y resta los valores resultantes para obtener el número final.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en evaluación de un polinomio en un valor dado.
ejemplos:
- titulo: Evalúa $P(x) = x^2 - 3x + 1$ para $x = -4$
  enunciado: Evalúa $P(x) = x^2 - 3x + 1$ para $x = -4$.
  solucion_pasos:
  - 'Sustitución: $P(-4) = (-4)^2 - 3(-4) + 1$.'
  - 'Potencias: $16 - 3(-4) + 1$.'
  - 'Multiplicación: $16 + 12 + 1$.'
  - 'Suma final: $29$. Por tanto $P(-4) = 29$.'
- titulo: Si $M(y) = 5y^3 - 2y$, halla $M(1)$.
  solucion_pasos:
  - 5(1)^3 - 2(1) = 5(1) - 2 = 5 - 2 = 3.
- titulo: 'Respecto de «Evaluación de un polinomio en un valor dado»: ¿Describe adecuadamente
    el concep'
  enunciado: 'Respecto de «Evaluación de un polinomio en un valor dado»: ¿Describe
    adecuadamente el concepto esta frase? «Evaluar un polinomio $P(x)$ en $x=a$ consiste
    en reemplazar cada aparición de ''$x$'' por el número ''$a$'', y luego realizar
    las operaciones aritméticas en el orden correcto (potencias, multiplicaciones,
    sumas) para obtener un resultado final $P(a)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Evaluar un polinomio $P(x)$
    en $x=a$ consiste en reemplazar cada aparición de ''$x$'' por el número ''$a$'',
    y luego realizar las operaciones aritméticas en el orden correcto (potencias,
    multiplicaciones, sumas) para obtener un resultado final $P(a)$.'
- titulo: 'Respecto de «Evaluación de un polinomio en un valor dado»: ¿Se puede aceptar
    esta afirmación'
  enunciado: 'Respecto de «Evaluación de un polinomio en un valor dado»: ¿Se puede
    aceptar esta afirmación? «Olvidar los paréntesis al evaluar números negativos.
    (Ej: escribir $-2^2$ en vez de $(-2)^2$, lo que da $-4$ en lugar del correcto
    $+4$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Evaluar un polinomio $P(x)$
    en $x=a$ consiste en reemplazar cada aparición de ''$x$'' por el número ''$a$'',
    y luego realizar las operaciones aritméticas en el orden correcto (potencias,
    multiplicaciones, sumas) para obtener un resultado final $P(a)$.'
errores_frecuentes:
- 'Olvidar los paréntesis al evaluar números negativos. (Ej: escribir $-2^2$ en vez
  de $(-2)^2$, lo que da $-4$ en lugar del correcto $+4$).'
- 'Multiplicar antes de elevar a la potencia. (Ej: en $3(2)^2$, hacer $6^2=36$ en
  vez de $3(4)=12$).'
- Evaluar un polinomio consiste en sustituir la variable solo en el término de mayor
  grado.
- En una evaluación se realizan las sumas antes que las potencias.
- Las expresiones $(-a)^2$ y $-a^2$ representan siempre el mismo valor.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_ponder: Descomponer en factores irreducibles expresiones algebraicas
  aplicando evaluación de un polinomio en un valor dado.
