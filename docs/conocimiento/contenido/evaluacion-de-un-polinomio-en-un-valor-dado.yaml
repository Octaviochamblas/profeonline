semantic_id: MAT.ALG.TEOREMA_FACTOR.EVALUACION_POLINOMIAL
resumen_inicial: 'Evaluación de un polinomio en un valor dado: concepto, método de
  descomposición y reglas en Teorema del factor y división sintética.'
explicacion_simple: 'Un polinomio es como una máquina de fábrica: tú le entregas una
  materia prima (un número que representa a ''x''), la máquina lo procesa, y te devuelve
  un producto final (el valor numérico). Este es el primer paso vital para entender
  la factorización avanzada.'
explicacion_formal: "### Definición formal\n\nPara un polinomio $P(x) = a_nx^n + a_{n-1}x^{n-1}\
  \ + \\dots + a_1x + a_0$, evaluarlo en $x=c$ consiste en calcular $P(c) = a_nc^n\
  \ + a_{n-1}c^{n-1} + \\dots + a_1c + a_0$, sustituyendo cada ocurrencia de la variable\
  \ por el valor $c$ y respetando la jerarquía de operaciones (potencias, luego productos,\
  \ luego sumas).\n\n### Desarrollo didáctico\n\nSupongamos que tenemos el polinomio\
  \ $P(x) = 2x^3 - 4x^2 + 5x - 7$.\nQueremos evaluarlo para $x = 2$. ¿Cómo lo hacemos?\n\
  \nCambiamos cada 'x' por un (2) entre paréntesis:\n$P(2) = 2(2)^3 - 4(2)^2 + 5(2)\
  \ - 7$\n\nAhora resolvemos usando PEMDAS (jerarquía de operaciones):\n1. Primero\
  \ potencias:\n   $(2)^3 = 8$\n   $(2)^2 = 4$\n   Queda: $2(8) - 4(4) + 5(2) - 7$\n\
  \n2. Luego multiplicaciones:\n   $16 - 16 + 10 - 7$\n\n3. Por último, sumas y restas\
  \ de izquierda a derecha:\n   $0 + 10 - 7 = 3$.\n\nEl valor numérico del polinomio\
  \ cuando $x=2$ es $3$. Se escribe como $P(2) = 3$."
definiciones_clave: '- **Evaluación de un polinomio en un valor dado**: Técnica de
  factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en evaluación de un polinomio en un valor dado.'
