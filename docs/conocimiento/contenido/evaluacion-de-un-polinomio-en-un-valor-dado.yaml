semantic_id: MAT.ALG.TEOREMA_FACTOR.EVALUACION_POLINOMIAL
resumen_inicial: La evaluación de un polinomio en un valor dado consiste en sustituir la variable indeterminada $x$ por un
  valor constante $k$ para calcular numéricamente el valor $P(k)$.
explicacion_simple: "Para **evaluar un polinomio** $P(x)$ en un número específico $x = k$ (ej: $P(x) = x^3 - 4x + 6$ en $x\
  \ = 2$):\n- **PROCEDIMIENTO PASO A PASO**:\n  1. **Reemplaza cada $x$ por un paréntesis $(k)$**:\n     - $P(2) = (2)^3 -\
  \ 4(2) + 6$.\n  2. **Calcula primero las potencias**:\n     - $(2)^3 = 8$.\n  3. **Resuelve las multiplicaciones**:\n  \
  \   - $-4(2) = -8$.\n  4. **Suma y resta numéricamente los resultados**:\n     - $P(2) = 8 - 8 + 6 = \\mathbf{6}$.\n- **Interpretación\
  \ del Teorema del Resto**:\n  - ¡El valor $P(k)$ obtenido es exactamente el **resto o residuo** de dividir el polinomio\
  \ $P(x)$ por el binomio $(x - k)$!\n\n![Evaluación de un polinomio y teorema del resto](/static/img/nodos/evaluacion-de-un-polinomio-en-un-valor-dado-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea el polinomio en una variable $P(x) = \sum_{i=0}^n a_i x^i \in \mathbb{R}[x]$ de grado $n \ge 1$ y sea $k \in \mathbb{R}$.
  La **función de evaluación polinomial** en el punto $k$ define el morfismo de sustitución:


  $$\operatorname{eval}_k : \mathbb{R}[x] \to \mathbb{R}, \quad P(x) \mapsto P(k) = a_n k^n + a_{n-1} k^{n-1} + \dots + a_1
  k + a_0$$


  ### Teorema del Resto (Teorema de D''Alembert)

  Para todo polinomio $P(x) \in \mathbb{R}[x]$ y cualquier constante $k \in \mathbb{R}$, al dividir $P(x)$ entre el binomio
  de primer grado $(x - k)$, existe un único polinomio cociente $Q(x)$ y una constante resto $R \in \mathbb{R}$ tales que:


  $$P(x) = Q(x)(x - k) + R$$


  Evaluando la identidad en $x = k$:


  $$P(k) = Q(k)(k - k) + R = Q(k)(0) + R = \mathbf{R}$$


  Por tanto, el resto de la división polinomial $P(x) \div (x - k)$ coincide idénticamente con el valor numérico **$P(k)$**.


  ### Síntesis didáctica

  Sustituir $x = k$ en un polinomio $P(x)$ calcula el valor funcional $P(k)$, el cual equivale al residuo de la división por
  $(x - k)$.

  '
definiciones_clave: '- **Evaluación polinomial ($P(k)$)**: Valor numérico real obtenido al reemplazar la variable $x$ por
  la constante $k$.

  - **Teorema del Resto**: Teorema que establece que el resto de dividir $P(x)$ entre $(x - k)$ es $P(k)$.

  - **Morfismo de sustitución**: Regla matemática que preserva las operaciones de suma y producto al reemplazar $x$ por un
  número.

  '
propiedades_relaciones: '- **Equivalencia de residuo**: Si $P(k) = 0$, la división por $(x - k)$ es exacta y no deja residuo.

  '
ejemplo_guiado:
  enunciado: Evalúa el polinomio $P(x) = 2x^3 - 5x^2 + 3x - 7$ en $x = 3$ y determina el resto de la división por $(x - 3)$.
  pasos:
  - 'Paso 1: Sustituimos la variable $x$ por $3$: $P(3) = 2(3)^3 - 5(3)^2 + 3(3) - 7$.'
  - 'Paso 2: Calculamos las potencias de 3: - $3^3 = 27$. - $3^2 = 9$.'
  - 'Paso 3: Efectuamos los productos: - $2(27) = 54$. - $-5(9) = -45$. - $3(3) = 9$.'
  - 'Paso 4: Sumamos los resultados numéricos: $P(3) = 54 - 45 + 9 - 7 = \mathbf{11}$.'
  - 'Conclusión: El valor del polinomio evaluado es **$P(3) = 11$**, y por el Teorema del Resto, la división de $P(x)$ por
    $(x - 3)$ deja un resto igual a **$11$**.'
  imagen: /static/img/nodos/evaluacion-de-un-polinomio-en-un-valor-dado-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Según el Teorema del Resto, ¿a qué equivale el residuo de dividir el polinomio $P(x) = x^4 - 2x + 5$ por el binomio
    $(x - 2)$?
  choices:
  - text: Equivale a evaluar $P(2) = 2^4 - 2(2) + 5 = 16 - 4 + 5 = 17$
    is_correct: true
  - text: Equivale a evaluar $P(-2) = 16 + 4 + 5 = 25$
    is_correct: false
  - text: Equivale a dividir 5 por 2
    is_correct: false
  - text: Equivale a 0
    is_correct: false
  explanation: 'La alternativa correcta es ''Equivale a evaluar $P(2) = 2^4 - 2(2) + 5 = 16 - 4 + 5 = 17$''. Teorema del Resto:
    $R = P(k) \implies P(2) = 17$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si al evaluar un polinomio $P(x)$ en $x = -1$ obtenemos $P(-1) = 0$, ¿qué representa este resultado?
  choices:
  - text: Representa que la división de $P(x)$ por $(x + 1)$ es exacta con resto 0
    is_correct: true
  - text: Representa que el polinomio no tiene soluciones
    is_correct: false
  - text: Representa que la división por $(x - 1)$ deja resto 1
    is_correct: false
  - text: Representa que el polinomio es de grado 0
    is_correct: false
  explanation: La alternativa correcta es 'Representa que la división de $P(x)$ por $(x + 1)$ es exacta con resto 0'. $R =
    P(-1) = 0 \implies (x - (-1)) = (x + 1)$ divide exactamente a $P(x)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar todas las apariciones de la variable $x$ por el valor constante $k$ entre paréntesis.'
- 'Paso 2: Desarrollar en primer lugar las potencias cuadráticas, cúbicas o superiores de $k$.'
- 'Paso 3: Realizar las multiplicaciones de los coeficientes por los resultados numéricos de las potencias.'
- 'Paso 4: Sumar y restar algebraicamente todos los términos para obtener la constante final $P(k)$.'
errores_correccion: '- **Error 1:** Multiplicar el coeficiente por la variable antes de elevar a la potencia (escribir $2(3)^3
  = (6)^3 = 216$). **Cómo corregirlo:** La jerarquía de operaciones **EXIGE ELEVAR PRIMERO A LA POTENCIA Y LUEGO MULTIPLICAR
  POR EL COEFICIENTE ($2(3)^3 = 2(27) = 54$)**.

  - **Error 2:** Evaluar en el signo opuesto al binomio divisor (evaluar $P(-3)$ cuando el divisor es $(x - 3)$). **Cómo corregirlo:**
  Para el divisor $(x - k)$ **SE DEBE EVALUAR EN EL VALOR POSITIVO $x = +k$ (la raíz del divisor)**.

  '
ejemplos:
- titulo: Evaluación básica en 1
  enunciado: Para $P(x) = x^2 + 3x + 2$, ¿es $P(1) = 1 + 3 + 2 = 6$?
  respuesta: Sí
  solucion_pasos:
  - Sí, sustitución directa.
- titulo: Evaluación en número negativo
  enunciado: Para $P(x) = x^2 - 4$, ¿es $P(-2) = (-2)^2 - 4 = 4 - 4 = 0$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-2)^2 = 4$.
- titulo: Jerarquía de potencia
  enunciado: En $3(2)^2$, ¿se calcula $3(4) = 12$ y no $6^2 = 36$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la potencia antecede al producto.
- titulo: Teorema del Resto
  enunciado: ¿Es el resto de dividir $P(x)$ por $(x - 5)$ igual a $P(5)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema de D´Alembert.
errores_frecuentes:
- Multiplicar el coeficiente por la base antes de resolver la potencia indicada.
- Evaluar en el signo contrario al sustituir el valor k del binomio divisor (x - k).
- Cometer errores de signos al elevar números negativos a potencias pares o impares.
- Intercambiar el valor evaluado P(k) con el cociente de la división en lugar de con el resto.
- Olvidar que un resto $R=0$ implica que la división es exacta.
afirmaciones_verdaderas:
- Evaluar un polinomio $P(x)$ en $x = k$ consiste en sustituir $x$ por $k$ en la expresión.
- El valor resultante $P(k)$ representa exactamente el resto de dividir $P(x)$ por $(x - k)$.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/evaluacion-de-un-polinomio-en-un-valor-dado-resumen.svg)


  QUÉ: Evaluar polinomios en valores constantes k e interpretar el resultado como el resto de la división por (x - k).

  CÓMO: Sustituir $x = k$ en la expresión polinomial $P(x)$, resolviendo según la jerarquía de operaciones primero potencias,
  luego productos y finalmente sumas ($R = P(k)$).

  '
