semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CONSTRUCCION_PUNTOS
resumen_inicial: 'La gráfica de una función cuadrática se construye ubicando sus puntos clave en el plano cartesiano y uniéndolos mediante un trazo curvo continuo y suave.'
explicacion_simple: |
  Una vez calculados los pares ordenados $(x, y)$ en una tabla de valores, el siguiente paso es marcarlos como puntos discretos en el plano cartesiano. Posteriormente, se dibuja una curva suave y fluida que pase por todos ellos, asegurando que el punto del vértice no quede en forma de esquina en "V", sino redondeado, mostrando el cambio continuo de dirección.
explicacion_formal: |
  ### Definición formal
  La **construcción gráfica** de una función cuadrática $f(x)$ a partir de un conjunto finito de puntos $S = \{(x_i, y_i)\}_{i=1}^n$ consiste en el trazado de la curva diferenciable continua $y = f(x)$ que contiene al conjunto $S$.

  ### Desglose simbólico
  - $P_i(x_i, y_i)$: Puntos del plano cartesiano obtenidos de la evaluación funcional.
  - $V(h, k)$: Vértice de giro donde el gradiente de la curva se anula ($\text{pendiente} = 0$).
  - Curvatura suave: Característica de las funciones polinomiales diferenciables en todo $\mathbb{R}$.

  ### Síntesis didáctica
  Conectar los puntos tabulados con reglas cuadradas rectas o segmentos lineales es un error visual común. La naturaleza de la potencia de segundo grado exige que la velocidad de cambio aumente a medida que las preimágenes se alejan del vértice, produciendo la forma acampanada característica de la parábola.
definiciones_clave: |
  - **Trazado de la gráfica**: Dibujo de la curva continua que une los puntos tabulados en el plano.
  - **Curva suave (diferenciable)**: Trazo sin esquinas, picos ni quiebres angulares bruscos.
  - **Gradiente nulo en el vértice**: Propiedad geométrica donde la tangente a la curva en el vértice es totalmente horizontal.
propiedades_relaciones: |
  - **Suficiencia de tres puntos**: Tres puntos no colineales determinan de manera única una parábola con eje vertical.
  - **Proyección de simetría**: Si se grafican los puntos del lado izquierdo de la parábola, se pueden proyectar inmediatamente los del lado derecho a la misma altura respecto al eje de simetría.
ejemplo_guiado:
  enunciado: 'Ubica los puntos $(-1, 5)$, $(0, 2)$, $(1, 1)$, $(2, 2)$ y $(3, 5)$ en el plano cartesiano y describe los pasos para trazar la gráfica de la función $f(x) = x^2 - 2x + 2$.'
  pasos:
    - 'Paso 1: Dibujamos los ejes cartesianos $x$ e $y$ y marcamos los 5 pares ordenados como puntos $P_1(-1,5)$, $P_2(0,2)$, $P_3(1,1)$, $P_4(2,2)$ y $P_5(3,5)$.'
    - 'Paso 2: Identificamos el punto más bajo en $P_3(1,1)$, el cual corresponde al vértice $V(1,1)$ de la parábola.'
    - 'Paso 3: Unimos los puntos mediante una curva redondeada en el vértice $(1,1)$, evitando formar un pico en V.'
    - 'Paso 4: Extendemos las ramas hacia arriba en forma suave pasando por $(0,2)$ y $(-1,5)$ a la izquierda, y por $(2,2)$ y $(3,5)$ a la derecha, agregando flechas en los extremos.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo debe dibujarse la curva alrededor del vértice al unir los puntos de una función cuadrática en el plano?'
    choices:
      - {text: 'Con un trazo curvado y redondeado de pendiente tangente horizontal', is_correct: true}
      - {text: 'Con una esquina en punta filosa en forma de triángulo', is_correct: false}
      - {text: 'Con un segmento rectilíneo horizontal de 2 cm de ancho', is_correct: false}
      - {text: 'Con una discontinuidad de salto vertical', is_correct: false}
    explanation: 'La alternativa correcta es ''Con un trazo curvado y redondeado de pendiente tangente horizontal''. El vértice de una parábola es un punto suave de inflexión continua, nunca una punta en esquina.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si al ubicar los puntos de una función en el plano cartesiano se obtiene que todos yacen exactamente sobre una misma línea recta, ¿qué podemos concluir sobre la función cuadrática?'
    choices:
      - {text: 'Que se ha cometido un error en los cálculos o que la función no es de segundo grado', is_correct: true}
      - {text: 'Que la parábola tiene coeficiente $a = 1$', is_correct: false}
      - {text: 'Que el vértice está en el infinito', is_correct: false}
      - {text: 'Que la concavidad es nula y correcta', is_correct: false}
    explanation: 'La alternativa correcta es ''Que se ha cometido un error en los cálculos o que la función no es de segundo grado''. Ninguna parábola cuadrática de $a \neq 0$ genera puntos colineales.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Graficar los ejes cartesianos ordenados y escalar ambas rectas con unidades uniformes.'
  - 'Paso 2: Marcar con precisión la ubicación de cada par ordenado $(x, y)$ previamente calculado en la tabla de valores.'
  - 'Paso 3: Trazar una curva continua y redondeada en el vértice que conecte todos los puntos de manera fluida, extendiendo las ramas hacia los extremos con flechas de continuidad.'
errores_correccion: |
  - **Error 1:** Unir los puntos marcados utilizando una regla lisa en forma de segmentos rectilíneos conectados. **Cómo corregirlo:** La gráfica de una función cuadrática no es un polígono lineal a trozos. Se debe trazar a mano alzada o con una plantilla curva una línea continua redondeada.
  - **Error 2:** Detener la línea exactamente en los puntos calculados sin extender la curva. **Cómo corregirlo:** Las parábolas de dominio $\mathbb{R}$ se extienden indefinidamente. Se deben dibujar las ramas sobrepasando los puntos extremos agregando flechas en las puntas.
ejemplos:
  - titulo: 'Trazo a partir de tres puntos principales'
    enunciado: 'Dadas las coordenadas de los cortes con el eje $x$ en $(-2, 0)$ y $(2, 0)$, y el vértice en $(0, -4)$, ¿hacia dónde abren las ramas de la gráfica construida?'
    alternativas:
      - 'Hacia arriba'
      - 'Hacia abajo'
      - 'Hacia la derecha'
    respuesta: 'Hacia arriba'
    solucion_pasos:
      - '1. El vértice $(0, -4)$ está ubicado por debajo del eje de las abscisas.'
      - '2. Los cortes con el eje $x$ están en una posición más elevada ($y = 0$).'
      - '3. Al unir el vértice con los cortes, las ramas ascienden abriéndose hacia arriba.'
  - titulo: 'Reconocimiento de gráfica errónea en V'
    enunciado: 'Un estudiante une los puntos $(-1, 1)$, $(0, 0)$ y $(1, 1)$ dibujando una letra V con dos rectas que se cruzan en el origen. ¿Es este el trazado correcto de $y = x^2$?'
    alternativas:
      - 'No, el trazado correcto es una curva parabólica redondeada en el origen'
      - 'Sí, las funciones cuadráticas se dibujan con líneas rectas'
      - 'Sí, siempre que pase por los tres puntos'
    respuesta: 'No, el trazado correcto es una curva parabólica redondeada en el origen'
    solucion_pasos:
      - '1. El gráfico en forma de V corresponde a la función valor absoluto $y = |x|$.'
      - '2. La función cuadrática $y = x^2$ genera una curva suave y redondeada en el vértice $(0,0)$.'
  - titulo: 'Uso de flechas en las ramas'
    enunciado: '¿Es recomendable colocar flechas en los extremos de las ramas de una parábola trazada en un dominio no restringido?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Las flechas simbolizan que la curva continúa extendiéndose al infinito en todo el dominio $\mathbb{R}$.'
  - titulo: 'Continuidad del trazo'
    enunciado: '¿La gráfica de una función cuadrática puede presentar interrupciones o huecos sin curva?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Las funciones cuadráticas son continuas en todos los números reales, por lo que su representación gráfica es una sola curva ininterrumpida.'
errores_frecuentes:
  - 'La gráfica de una función cuadrática se construye uniendo los puntos con segmentos rectos usando regla.'
  - 'El punto del vértice en la gráfica dibujada debe ser un ángulo agudo en punta de lanza.'
  - 'La curva de la parábola debe interrumpirse abruptamente al llegar al último punto anotado en la tabla.'
  - 'Conectar tres puntos mediante un trazado de parábola requiere obligatoriamente que uno de ellos sea el origen $(0,0)$.'
  - 'Las ramas de una parábola dibujada en el plano cartesiano pueden cruzarse entre sí.'
afirmaciones_verdaderas:
  - 'La gráfica de una función cuadrática es una curva continua y diferenciable que no posee picos ni esquinas angulares.'
  - 'El vértice de la parábola es el único punto donde la curva cambia de sentido de variación (de decreciente a creciente o viceversa).'
al_terminar_debes_poder: 'Representar gráficamente funciones cuadráticas trazando curvas suaves y continuas a partir de coordenadas de puntos en el plano cartesiano.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
