semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CONSTRUCCION_PUNTOS
resumen_inicial: La construcción de la gráfica traza la parábola uniendo de forma continua y curva los puntos característicos $(x, y)$ en el plano cartesiano.
explicacion_simple: |
  Para **dibujar a mano o construir la gráfica** de una parábola a partir de sus puntos:

  1. **Ubicas los puntos clave en el plano**:
     - El **Vértice** $V(x_v, y_v)$ (el punto de giro).
     - El **Corte con el eje Y** $(0, c)$.
     - Los **Cortes con el eje X** $(x_1, 0)$ y $(x_2, 0)$ (si existen).
     - Puntos simétricos auxiliares.
  2. **Unes los puntos con una línea suave y curva** (nunca rectilínea ni con picos en forma de V).
  3. **Extiendes las ramas** hacia arriba o hacia abajo indicando que continúan al infinito.
explicacion_formal: |
  Sea el conjunto finito de puntos de muestra $S = \{(x_k, y_k)\} \subset \mathbb{R}^2$. La **construcción del dibujo de la parábola** interpola numéricamente el grafo continuo $G(f) = \{(x, f(x)) \mid x \in \mathbb{R}\}$:

  $$\text{Interpola}(S) \longrightarrow \mathcal{P}: y = ax^2 + bx + c$$

  **Criterios de trazado cartesiano correcto:**
  1. **Suavidad del vértice:** En el vértice $V(x_v, y_v)$, la curva presenta una tangente perfectamente horizontal (derivada $f'(x_v) = 0$).
  2. **Simetría bilateral:** El trazo a la izquierda y derecha de la recta $x = x_v$ guarda proporcionalidad de reflejo.
  3. **No angulosidad:** Queda strictly prohibido el uso de trazos rectos articulados tipo polígonos.
definiciones_clave: |
  - **Trazado de la parábola**: Representación gráfica cartesiana que une los puntos característicos mediante una curva continua de curvatura parabólica.
propiedades_relaciones: |
  - **Identificación unívoca por 3 puntos**: Dados 3 puntos no colineales en el plano cartesiano con abscisas distintas, existe una única parábola vertical que pasa por ellos.
ejemplo_guiado:
  enunciado: 'Construye la gráfica de $f(x) = x^2 - 4x + 3$ identificando su vértice y puntos de corte.'
  pasos:
    - 'Paso 1: Hallar el vértice: $x_v = -(-4)/(2) = 2 \implies f(2) = -1 \implies V(2, -1)$.'
    - 'Paso 2: Hallar corte en Y: $(0, 3)$.'
    - 'Paso 3: Hallar cortes en X: $x^2 - 4x + 3 = 0 \implies (x-1)(x-3) = 0 \implies (1,0)$ y $(3,0)$.'
    - 'Paso 4: Marcar los puntos $V(2,-1), (0,3), (1,0), (3,0)$ y su simétrico $(4,3)$, uniendo con una curva suave.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo debe dibujarse el trazado en la zona del vértice de la parábola?'
    choices:
      - {text: 'Como una curva redondeada suave con recta tangente horizontal', is_correct: true}
      - {text: 'Como una punta afilada en forma de ángulo recto.', is_correct: false}
      - {text: 'Como un segmento horizontal plano de 5 cm.', is_correct: false}
      - {text: 'Como una esquina en V.', is_correct: false}
    explanation: 'La alternativa correcta es ''Como una curva redondeada suave con recta tangente horizontal''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuántos puntos no colineales con distintas abscisas son necesarios para definir de manera única una parábola?'
    choices:
      - {text: 'Exactamente 3 puntos', is_correct: true}
      - {text: 'Exactamente 1 punto.', is_correct: false}
      - {text: 'Exactamente 10 puntos.', is_correct: false}
      - {text: 'Un mínimo de 100 puntos.', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente 3 puntos''. Tres puntos determinan de forma única los coeficientes $a, b, c$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Calcular y ubicar en el plano las coordenadas del vértice $V(x_v, y_v)$.'
  - 'Paso 2: Ubicar los puntos de corte con los ejes cartesiano $(0, c)$, $(x_1, 0)$ y $(x_2, 0)$.'
  - 'Paso 3: Marcar los puntos simétricos respecto al eje de simetría $x = x_v$.'
  - 'Paso 4: Unir suavemente los puntos trazando una curva parabólica continua que se extiende en las ramas.'
errores_correccion: |
  - **Error común:** Dibujar la parábola uniendo los puntos con segmentos de recta formando un gráfico poligonal o una punta en V.
  - **Cómo corregirlo:** La parábola **ES UNA CURVA SUAVE Y REDONDEADA**; redondea la base en el vértice y usa trazos continuos.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Trazado de parábola mónica.
    alternativas:
      - 'Curva suave pasando por V(0,0), (1,1), (-1,1)'
      - 'Línea recta en V'
      - 'Ángulo afilado en cero'
    respuesta: 'Curva suave pasando por V(0,0), (1,1), (-1,1)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Trazado con concavidad negativa.
    alternativas:
      - 'Cúpula suave con ramas descendentes'
      - 'Triángulo equilátero'
      - 'Recta inclinada'
    respuesta: 'Cúpula suave con ramas descendentes'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Unir los puntos cartesiano mediante segmentos de recta rígidos construyendo un polígono.'
  - 'Dibujar la zona del vértice con una punta afilada en forma de letra V en lugar de una curva redondeada.'
  - 'Trazar ramas que se curvan hacia adentro cerrando la parábola como un óvalo.'
  - 'La ausencia de trazado del eje de simetría al ubicar los puntos simétricos auxiliares.'
  - 'Detener el dibujo en los últimos puntos graficados sin proyectar la extensión infinita de las ramas.'
afirmaciones_verdaderas:
  - 'La gráfica de la parábola se construye uniendo sus puntos notables mediante una curva suave continua sin ángulos afilados.'
  - 'La tangente en la curva del vértice es perfectamente horizontal por ser un punto extremo de derivada nula.'
al_terminar_debes_poder: |
  QUÉ: Construir y dibujar la gráfica de una función cuadrática a partir de sus puntos representativos.
  CÓMO: Ubicar vértice, cortes y puntos simétricos, trazar la curva suave continua y proyectar sus ramas ilimitadas.
