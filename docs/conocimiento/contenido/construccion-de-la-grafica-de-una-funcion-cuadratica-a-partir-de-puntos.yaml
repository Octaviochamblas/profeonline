semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CONSTRUCCION_PUNTOS
resumen_inicial: 'Construcción de la gráfica de una función cuadrática a partir de
  puntos: parábola, vértice, concavidad y formas de Análisis gráfico: parábola, concavidad
  e intersecciones.'
explicacion_simple: Una vez calculados varios pares ordenados, el paso final es marcarlos
  en el plano cartesiano y unirlos con la curva suave y simétrica característica de
  toda parábola.
explicacion_formal: '### Definición formal


  Dada una tabla de pares ordenados $(x_i,f(x_i))$ de una función cuadrática, la gráfica
  se construye marcando cada punto en el plano cartesiano y trazando la curva continua
  y suave que los une, extendiéndola más allá de los puntos calculados según la tendencia
  observada.


  ### Desarrollo didáctico


  Al trazar la curva, nunca se deben unir los puntos con segmentos rectos: la parábola
  es una curva suave sin esquinas, y el trazo debe reflejar esa suavidad, especialmente
  cerca del vértice.


  Con los puntos $(0,3)$, $(1,0)$, $(2,-1)$, $(3,0)$, $(4,3)$ de $f(x)=x^2-4x+3$:
  se marcan en el plano y se traza una curva suave en forma de "U" que pasa por todos
  ellos, con el vértice en $(2,-1)$.'
definiciones_clave: '- **Construcción de la gráfica de una función cuadrática a partir
  de puntos**: Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  construcción de la gráfica de una función cuadrática a partir de puntos.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando construcción
    de la gráfica de una función cuadrática a partir de puntos.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a construcción
    de la gráfica de una función cuadrática a partir de puntos.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
