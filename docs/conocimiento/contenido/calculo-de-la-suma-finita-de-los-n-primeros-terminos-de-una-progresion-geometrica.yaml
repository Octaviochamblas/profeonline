procedimiento:
- 'Paso 1: Identifica $a_1, r$ y la cantidad de términos a sumar ($n$).'
- 'Paso 2: Calcula la potencia $r^n$.'
- 'Paso 3: Resta 1 a ese resultado en el numerador.'
- 'Paso 4: Multiplica el numerador por $a_1$.'
- 'Paso 5: Divide todo por $(r - 1)$.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en cálculo de la suma finita de los n primeros términos de una progresión geométrica.
ejemplos:
- titulo: Ahorros multiplicados
  enunciado: Ahorras $2 el primer día y cada día duplicas lo del día anterior. ¿Cuánto sumarás
    en total luego de 5 días?
  solucion_pasos:
  - a1 = 2, r = 2, n = 5.
  - 'Fórmula: S5 = 2 * (2^5 - 1) / (2 - 1)'
  - S5 = 2 * (32 - 1) / 1
  - S5 = 2 * 31 = 62.
  - Suman 62 en total.
- titulo: Ejemplo 1
  enunciado: Si a_1 es 1, r es 2 y n es 4, ¿cuál es la suma?
  alternativas:
  - '15'
  - '16'
  - '8'
  respuesta: '15'
  solucion_pasos:
  - 1 por (2 elevado a 4 menos 1) dividido entre (2 menos 1) es igual a 15 dividido entre
    1, o sea 15.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la suma de los primeros 3 términos de la progresión 3, 9, 27?
  alternativas:
  - '39'
  - '27'
  - '36'
  respuesta: '39'
  solucion_pasos:
  - 3 por (3 elevado a 3 menos 1) dividido entre (3 menos 1) es igual a 3 por 26 dividido
    entre 2, o sea 39.
- titulo: ¿La fórmula de la suma finita usa el exponente n directamente, sin restarle 1?
  respuesta: Sí
  solucion_pasos:
  - A diferencia de la fórmula del término general, aquí se usa n completo en el exponente.
- titulo: ¿S_n representa el valor del último término sumado?
  respuesta: 'No'
  solucion_pasos:
  - S_n es la suma acumulada de todos los primeros n términos, no el valor de uno solo.
errores_frecuentes:
- Elevar '$r$' a la '$(n-1)$' en vez de '$n$' por inercia o confusión con la fórmula del término
  general.
- Dividir por $(r-1)$ antes de multiplicar el numerador completo.
- Elevar r a (n menos 1) en vez de a n, confundiendo esta fórmula con la del término general.
- Dividir por (r menos 1) antes de multiplicar el numerador completo por a_1.
- Olvidar restar 1 al resultado de r elevado a n.
afirmaciones_verdaderas:
- La formulación de cálculo de la suma finita de los n primeros términos de una progresión
  geométrica mantiene la regularidad de la sucesión.
- En la fórmula de la suma finita de una progresión geométrica, la razón se eleva exactamente
  a n, no a (n menos 1).
