procedimiento:
- 'Paso 1: Identifica $a_1, r$ y la cantidad de términos a sumar ($n$).'
- 'Paso 2: Calcula la potencia $r^n$.'
- 'Paso 3: Resta 1 a ese resultado en el numerador.'
- 'Paso 4: Multiplica el numerador por $a_1$.'
- 'Paso 5: Divide todo por $(r - 1)$.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en cálculo de la suma finita de los n primeros términos de una progresión
  geométrica.
ejemplos:
- titulo: Ahorros multiplicados
  enunciado: Ahorras $2 el primer día y cada día duplicas lo del día anterior. ¿Cuánto
    sumarás en total luego de 5 días?
  solucion_pasos:
  - a1 = 2, r = 2, n = 5.
  - 'Fórmula: S5 = 2 * (2^5 - 1) / (2 - 1)'
  - S5 = 2 * (32 - 1) / 1
  - S5 = 2 * 31 = 62.
  - Suman 62 en total.
errores_frecuentes:
- Elevar '$r$' a la '$(n-1)$' en vez de '$n$' por inercia o confusión con la fórmula
  del término general.
- Dividir por $(r-1)$ antes de multiplicar el numerador completo.
