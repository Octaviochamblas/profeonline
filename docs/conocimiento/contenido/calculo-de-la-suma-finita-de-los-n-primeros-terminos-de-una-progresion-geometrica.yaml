resumen_inicial: La suma de los $n$ primeros términos de una progresión geométrica
  $S_n$ (con $r \neq 1$) se calcula mediante la fórmula $S_n = a_1 \cdot \left[ \frac{r^n
  - 1}{r - 1} \right] = \frac{a_n \cdot r - a_1}{r - 1}$.
explicacion_simple: 'Para sumar todos los números de una progresión geométrica sin
  sumarlos uno a uno, usamos la fórmula de suma geométrica: tomamos el primer número,
  lo multiplicamos por $(r^n - 1)$ y dividimos entre $(r - 1)$.'
explicacion_formal: 'La **Suma Finita de $n$ Términos de una P.G. $S_n$** se obtiene
  multiplicando la serie por $r$ y restando:


  $$S_n = \sum_{k=1}^n a_k = a_1 + a_1 r + a_1 r^2 + \dots + a_1 r^{n-1}$$


  $$S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right] = a_1 \cdot \left[ \frac{1
  - r^n}{1 - r} \right] \quad (r \neq 1)$$'
definiciones_clave: '- **Suma finita $S_n$**: Expresión $S_n = a_1 \cdot \left[ \frac{r^n
  - 1}{r - 1} \right]$ para la suma de $n$ términos.'
propiedades_relaciones: '- **Caso particular $r=1$**: Si $r=1$, la suma degenera en
  $S_n = n \cdot a_1$.'
ejemplo_guiado:
  enunciado: Calcule la suma de los primeros $6$ términos de la P.G. $(2, 6, 18, 54,
    \dots)$.
  pasos:
  - 'Paso 1: Identificar $a_1 = 2$, $r = 3$ y $n = 6$.'
  - 'Paso 2: Aplicar la fórmula $S_6 = 2 \cdot \left[ \frac{3^6 - 1}{3 - 1} \right]$.'
  - 'Paso 3: Calcular la potencia $3^6 = 729 \implies S_6 = 2 \cdot \left[ \frac{728}{2}
    \right] = 728$.'
  - 'Conclusión: La suma de los primeros $6$ términos es $728$.'
