semantic_id: MAT.NUM.PROG_GEOMETRICA.SUMA_FINITA
resumen_inicial: 'Cálculo de la suma finita de los n primeros términos de una progresión geométrica:
  concepto y desarrollo dentro de Progresión geométrica.'
explicacion_simple: El inventor del ajedrez le pidió al rey 1 grano de trigo por la primera
  casilla, 2 por la segunda, 4 por la tercera... El rey pensó que era barato. No sabía que
  sumar progresiones geométricas arroja números monumentales. Descubramos cómo calcular ese
  total.
explicacion_formal: 'Sumar una P.G. a mano es muy agotador. Usaremos una fórmula cerrada:

  $S_n = \frac{a_1 \cdot (r^n - 1)}{r - 1}$


  Analicemos sus partes:

  - **$S_n$**: La suma total de todo lo acumulado en esos ''$n$'' casilleros.

  - **$a_1$**: Lo que había en el primer casillero.

  - **$r^n$**: La razón elevada a la cantidad de términos que sumarás. **¡ALERTA!** En esta
  fórmula SÍ elevamos a ''$n$'', NO a ''$(n-1)$''. Este es el error número uno en las pruebas.


  Ejemplo: Suma los 4 primeros términos de la serie $5, 15, 45, 135$. (Sabemos que suman 200).

  - $a_1 = 5, r = 3, n = 4$.

  - $S_4 = \frac{5 \cdot (3^4 - 1)}{3 - 1}$

  - $S_4 = \frac{5 \cdot (81 - 1)}{2}$

  - $S_4 = \frac{5 \cdot 80}{2} = \frac{400}{2} = 200$.'
definiciones_clave: '- **Cálculo de la suma finita de los n primeros términos de una progresión
  geométrica**: Concepto fundamental dentro del estudio de Progresión geométrica.'
propiedades_relaciones: '- **Propiedades de Cálculo de la suma finita de los n primeros términos
  de una progresión geométrica**: Relaciones de cambio y fórmulas estructurales de progresión
  geométrica.'
ejemplo_guiado:
  enunciado: Calcula la suma de los primeros 5 términos de la progresión geométrica 2, 6,
    18.
  pasos:
  - Identifico a_1 igual a 2, r igual a 3, n igual a 5.
  - 'Aplico la fórmula: S_5 igual a 2 por (3 elevado a 5 menos 1) dividido entre (3 menos
    1).'
  - Calculo 3 elevado a 5 igual a 243; 243 menos 1 es 242; 2 por 242 es 484; 484 dividido
    entre 2 es igual a 242. La suma es 242.
