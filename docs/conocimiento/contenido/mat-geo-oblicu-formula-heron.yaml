semantic_id: MAT.GEO.TRIG_OBLICUANGULOS.FORMULA_HERON
resumen_inicial: 'Cálculo del área de un triángulo mediante la fórmula de Herón: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Cuando se conocen los tres lados de un triángulo pero ningún ángulo,
  la fórmula de Herón permite calcular el área directamente a partir del semiperímetro.
explicacion_formal: '![Fórmula de Herón](/static/img/geometria/trigonometria/oblicu-formula-heron.svg)


  ### Definición formal


  Dado un triángulo de lados $a$, $b$, $c$, se calcula primero el semiperímetro $s=\dfrac{a+b+c}{2}$,
  y luego el área como $\text{Área}=\sqrt{s(s-a)(s-b)(s-c)}$.


  ### Desarrollo didáctico


  Para un triángulo de lados $a=7$, $b=8$, $c=9$: $s=\dfrac{7+8+9}{2}=12$, y $\text{Área}=\sqrt{12\times5\times4\times3}=\sqrt{720}\approx26{,}83$.'
definiciones_clave: '- **Cálculo del área de un triángulo mediante la fórmula de Herón**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
