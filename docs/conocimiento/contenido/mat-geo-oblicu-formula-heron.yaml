  la fórmula de herón.'
ejemplo_guiado:
  enunciado: Para analizar cálculo del área de un triángulo mediante la fórmula de
    herón, considera un ángulo $\alpha = 26^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1145^\circ = 26^\circ$.
  pasos:
  - Identificar la propiedad de cálculo del área de un triángulo mediante la fórmula
    de herón referida a $\alpha = 26^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1145 = 26 \implies x = 26 - 1145$.'
  - Concluir que la medida calculada para cálculo del área de un triángulo mediante
    la fórmula de herón es $x = -1119^\circ$.
