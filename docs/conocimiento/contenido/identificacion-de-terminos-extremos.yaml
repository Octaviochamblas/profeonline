resumen_inicial: 'En la proporción $a : b = c : d$ o $\frac{a}{b} = \frac{c}{d}$,
  los términos extremos son el primer término $a$ y el cuarto término $d$.'
explicacion_simple: 'Cuando escribimos una proporción en fila usando puntos $a : b
  = c : d$, los extremos son literalmente los dos números que quedan en los bordes
  de afuera: el primero ($a$) y el último ($d$).'
explicacion_formal: 'Dada la proporción $a : b = c : d$, los **Términos Extremos**
  son las cantidades ubicadas en las posiciones limítrofes inicial y final:


  $$\text{Extremos} = \{a, d\}$$


  **En notación fraccionaria $\frac{a}{b} = \frac{c}{d}$:**

  - $a$: Numerador de la primera razón.

  - $d$: Denominador de la segunda razón.'
definiciones_clave: '- **Términos extremos**: Elementos $a$ y $d$ en la proporción
  $a : b = c : d$.'
propiedades_relaciones: '- **Posiciones limítrofes**: Primer y cuarto término de la
  proporción.'
ejemplo_guiado:
  enunciado: En la proporción $\frac{3}{5} = \frac{12}{20}$, identifique los términos
    extremos.
  pasos:
  - 'Paso 1: Escribir en notación de línea: $3 : 5 = 12 : 20$.'
  - 'Paso 2: Identificar el primer número ($3$) y el último número ($20$).'
  - 'Conclusión: Los términos extremos son $3$ y $20$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuáles son los términos extremos en la proporción a : b = c : d?'
  choices:
  - text: El primer término a y el cuarto término d
    is_correct: true
  - text: El segundo término b y el tercer término c
    is_correct: false
  - text: Únicamente el número a
    is_correct: false
  - text: Los dos denominadores b y d
    is_correct: false
  explanation: La alternativa correcta es 'El primer término a y el cuarto término
    d'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3/5 = 12/20, ¿cuáles son los extremos?
  choices:
  - text: 3 y 20
    is_correct: true
  - text: 5 y 12
    is_correct: false
  - text: 3 y 5
    is_correct: false
  - text: 12 y 20
    is_correct: false
  explanation: La alternativa correcta es '3 y 20'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar los términos extremos
  $a$ y $d$ en cualquier proporción $\frac{a}{b} = \frac{c}{d}$.
semantic_id: MAT.NUM.PROPORCIONES.TERMINOS_EXTREMOS
procedimiento:
- 'Paso 1: Identificar los términos extremos $(a, d)$ y medios $(b, c)$ en la proporción
  $a/b = c/d$.'
- 'Paso 2: Aplicar la propiedad o regla requerida (producto cruzado, cuarta/media/tercera
  proporcional o composición/descomposición).'
- 'Paso 3: Resolver algebraicamente y verificar la igualdad de las razones resultantes.'
errores_correccion: '- **Error 1: Multiplicar numeradores con numeradores en lugar
  del producto cruzado ($a \cdot c = b \cdot d$).** **Cómo corregirlo:** El producto
  cruzado combina EXTREMOS con MEDIOS ($a \cdot d = b \cdot c$).


  - **Error 2: Confundir la media proporcional con la media aritmética (promedio).**
  **Cómo corregirlo:** La media proporcional es una media GEOMÉTRICA ($x = \sqrt{ab}$),
  no un promedio sumar/dividir.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROPORCIONES.TERMINOS_EXTREMOS.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de proporciones.
- titulo: Ejemplo 2
  enunciado: Verificación de igualdad cruzada.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración por producto cruzado a · d = b · c.
- titulo: ¿Es a · d = b · c válido para toda proporción?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema Fundamental de las Proporciones.
- titulo: ¿Permite la composición mantener la equivalencia de razones?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(a+b)/b = (c+d)/d$ conserva la razón equivalente.
errores_frecuentes:
- Multiplicar los numeradores entre sí al aplicar la prueba del producto cruzado en
  una proporción.
- Declarar la posición de los términos medios con los términos extremos en una proporción
  escrita en fila.
- Calcular la media proporcional utilizando el promedio aritmético sumar y dividir
  entre dos.
- Invertir únicamente uno de los dos lados de la igualdad al aplicar la composición
  proporcional.
- Restar los términos extremos en lugar de despejar la cuarta proporcional por división.
afirmaciones_verdaderas:
- Una proporción es la igualdad entre dos razones $\frac{a}{b} = \frac{c}{d}$ que
  satisface el producto cruzado $a \cdot d = b \cdot c$.
- La media proporcional entre dos números positivos $a$ y $b$ equivale a su media
  geométrica $x = \sqrt{a \cdot b}$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
