semantic_id: MAT.NUM.PROPORCIONES.TERMINOS_EXTREMOS
resumen_inicial: 'Los términos extremos de una proporción son los números situados en los extremos de la notación horizontal $a : b = c : d$, correspondiendo al primer término $a$ y al cuarto término $d$.'
explicacion_simple: |
  En una proporción escrita en fila como $a : b = c : d$, hay cuatro números. Si miras la fila de izquierda a derecha, los dos números que están en las puntas (el primero $a$ y el último $d$) se llaman **términos extremos**. Por ejemplo, en la proporción $3 : 5 = 6 : 10$, los extremos son el 3 y el 10. En una fracción $\frac{a}{b} = \frac{c}{d}$, el antecedente de la primera ($a$) y el consecuente de la segunda ($d$) forman la pareja de extremos.
explicacion_formal: |
  ### Definición formal
  En una proporción geométrica $a : b = c : d$ o $\frac{a}{b} = \frac{c}{d}$:
  - Los **términos extremos** son la pareja de elementos compuesta por el antecedente de la primera razón ($a$) y el consecuente de la segunda razón ($d$):
    $$\text{Términos Extremos} = \{a, d\}$$

  ### Ubicación estructural según la representación
  1. **Notación en fila $a : b = c : d$**:
     - Primer término ($a$): Extremo inicial (izquierda).
     - Cuarto término ($d$): Extremo final (derecha).
  2. **Notación en fracción $\frac{a}{b} = \frac{c}{d}$**:
     - Numerador de la primera fracción ($a$).
     - Denominador de la segunda fracción ($d$).

  ### Rol en el Teorema Fundamental
  Los extremos definen el producto de extremos en la igualdad fundamental:
  $$\text{Producto de Extremos} = a \cdot d$$

  ### Síntesis didáctica
  - Posición visual: Las puntas u orillas de la igualdad $a : b = c : d$.
  - Integrantes: El 1.º y el 4.º número de la lista en orden de lectura.
definiciones_clave: |
  - **Términos extremos $\{a, d\}$**: Pareja de elementos inicial y final que delimitan los bordes de una proporción.
  - **Producto de extremos $a \cdot d$**: Resultado multiplicativo entre el primer y cuarto término de la proporción.
  - **Primer y cuarto término**: Posición numérica correlativa asignada en la secuencia de lectura $a : b = c : d$.
propiedades_relaciones: |
  - **Igualdad con producto de medios**: En toda proporción válida, el producto de los términos extremos es idéntico al producto de los términos medios ($a \cdot d = b \cdot c$).
  - **Permutación de extremos**: Intercambiar la posición de los dos extremos entre sí ($d : b = c : a$) conserva la validez de la proporción.
ejemplo_guiado:
  enunciado: 'Dada la proporción escrita en forma fraccionaria $\frac{4}{7} = \frac{12}{21}$, identifica los términos extremos y calcula su producto.'
  pasos:
    - 'Paso 1: Escribimos la proporción en su notación de fila para visualizar las puntas: $4 : 7 = 12 : 21$.'
    - 'Paso 2: Identificamos el primer número escrito ($a = 4$) y el cuarto número escrito ($d = 21$).'
    - 'Paso 3: Concluimos que los **términos extremos son 4 y 21**.'
    - 'Paso 4: Calculamos su producto multiplicando ambos valores: $4 \cdot 21 = 84$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué elementos forman los términos extremos en la proporción $a : b = c : d$?'
    choices:
      - {text: 'El primer término $a$ y el cuarto término $d$, situados en las puntas exteriores de la expresión', is_correct: true}
      - {text: 'El segundo término $b$ y el tercer término $c$, situados al centro', is_correct: false}
      - {text: 'Los dos numeradores $a$ y $c$', is_correct: false}
      - {text: 'Los dos denominadores $b$ y $d$', is_correct: false}
    explanation: 'La alternativa correcta es ''El primer término $a$ y el cuarto término $d$, situados en las puntas exteriores de la expresión''. Los extremos son el 1.º y 4.º término.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son los términos extremos en la proporción $\frac{5}{9} = \frac{20}{36}$?'
    choices:
      - {text: '$5$ y $36$', is_correct: true}
      - {text: '$9$ y $20$', is_correct: false}
      - {text: '$5$ y $20$', is_correct: false}
      - {text: '$9$ y $36$', is_correct: false}
    explanation: 'La alternativa correcta es ''$5$ y $36$''. El numerador de la primera ($5$) y el denominador de la segunda ($36$) son los extremos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la proporción en el orden de lectura $a : b = c : d$ o $\frac{a}{b} = \frac{c}{d}$.'
  - 'Paso 2: Ubicar el primer número escrito en la expresión ($a$).'
  - 'Paso 3: Ubicar el cuarto o último número escrito en la expresión ($d$).'
  - 'Paso 4: Declarar al par de números $\{a, d\}$ como los términos extremos.'
errores_correccion: |
  - **Error 1:** Confundir los términos extremos con los términos medios (ej: en $2 : 3 = 8 : 12$, decir que los extremos son 3 y 8). **Cómo corregirlo:** Los **extremos son las puntas exteriores** (2 y 12). Los números del centro (3 y 8) son los medios.
  - **Error 2:** Creer que los extremos son los dos números de la primera razón (ej: decir que los extremos de $\frac{a}{b} = \frac{c}{d}$ son $a$ y $b$). **Cómo corregirlo:** Un extremo pertenece a la **primera razón ($a$)** y el otro a la **segunda razón ($d$)**.
ejemplos:
  - titulo: 'Identificación en notación de puntos'
    enunciado: 'En la proporción $2 : 5 = 10 : 25$, ¿los términos extremos son $2$ y $25$?'
    alternativas:
      - 'Sí, por estar en las puntas exteriores'
      - 'No, son 5 y 10'
      - 'No, son 2 y 10'
    respuesta: 'Sí, por estar en las puntas exteriores'
    solucion_pasos:
      - '1. Leemos en orden: 1.º es 2, 4.º es 25.'
      - '2. Concluimos que los extremos son 2 y 25.'
  - titulo: 'Cálculo de producto de extremos'
    enunciado: 'Para la proporción $\frac{3}{4} = \frac{15}{20}$, ¿el producto de sus extremos es $3 \cdot 20 = 60$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Extremos 3 y 20 $\implies 3 \cdot 20 = 60$.'
  - titulo: 'Permutación de extremos'
    enunciado: 'Si los extremos de $a : b = c : d$ se permutan como $d : b = c : a$, ¿el producto de extremos sigue siendo $a \cdot d$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El producto conmutativo $d \cdot a = a \cdot d$.'
  - titulo: 'Extremos en números decimales'
    enunciado: 'En la proporción $\frac{0.5}{2} = \frac{2.5}{10}$, ¿los extremos son $0.5$ y $10$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Primer y cuarto término de la expresión.'
errores_frecuentes:
  - 'Los términos extremos corresponden a las dos cantidades centrales de la igualdad.'
  - 'Los términos extremos son siempre los dos numeradores de la proporción.'
  - 'El producto de extremos $a \cdot d$ se calcula mediante la suma $a + d$.'
  - 'Los términos extremos sólo existen cuando las fracciones de la proporción están irreducibles.'
  - 'En una proporción en fila se considera que la segunda y cuarta cantidad constituyen los extremos.'
afirmaciones_verdaderas:
  - 'Los términos extremos de una proporción $a : b = c : d$ son el primer término $a$ y el cuarto término $d$.'
  - 'En toda proporción geométrica verdadera, el producto de los términos extremos es igual al producto de los términos medios ($a \cdot d = b \cdot c$).'
al_terminar_debes_poder: 'Identificar los términos extremos $\{a, d\}$ de cualquier proporción $a : b = c : d$ y calcular su producto $a \cdot d$.'
