semantic_id: MAT.NUM.PROPORCIONES.TERMINOS_EXTREMOS
resumen_inicial: En la proporción $a:b = c:d$ (o $\frac{a}{b} = \frac{c}{d}$), los
  extremos son el primer término $a$ y el cuarto término $d$.
explicacion_simple: 'Si escribes la proporción en una sola línea ($a:b = c:d$), los
  **extremos** son literalmente los números que están en los bordes exteriores: el
  primero ($a$) y el último ($d$).

  Ejemplo: En $2:5 = 6:15$, los extremos son $2$ y $15$.'
explicacion_formal: En la proporción $a:b = c:d$, la pareja $(a, d)$ se denomina extremos
  de la proporción, donde $a$ es el primer término y $d$ es el cuarto término.
definiciones_clave: '- **Extremos ($a, d$)**: Términos primero y último de la proporción.'
propiedades_relaciones: '- **Producto de extremos**: $a \cdot d$ en la regla de multiplicación
  cruzada.'
ejemplo_guiado:
  enunciado: Identifica los extremos en la proporción $\frac{4}{7} = \frac{12}{21}$.
  pasos:
  - 'Escribir en notación continua: $4 : 7 = 12 : 21$.'
  - Localizar el primer número ($4$) y el último número ($21$).
  - Concluir que los extremos son $4$ y $21$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los extremos en la proporción $3:8 = 9:24$?
  choices:
  - text: 3 y 24
    is_correct: true
  - text: 8 y 9
    is_correct: false
  - text: 3 y 9
    is_correct: false
  - text: 8 y 24
    is_correct: false
  explanation: 'La correcta es: 3 y 24. El primer término (3) y el último (24) son
    los extremos.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la proporción $\frac{5}{6} = \frac{10}{12}$, ¿cuál es el producto de
    los extremos?
  choices:
  - text: '60'
    is_correct: true
  - text: '50'
    is_correct: false
  - text: '72'
    is_correct: false
  - text: '120'
    is_correct: false
  explanation: 'La correcta es: 60. Extremos son 5 y 12 $\implies 5 \cdot 12 = 60$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la proporción en el orden $a:b = c:d$.'
- 'Paso 2: Tomar el primer término $a$ y el último término $d$.'
errores_correccion: No confundas los extremos con los medios. Los extremos son los
  números de la punta exterior.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuáles son los extremos en $1:2 = 5:10$?
  alternativas:
  - 1 y 10
  - 2 y 5
  - 1 y 5
  respuesta: 1 y 10
  solucion_pasos:
  - Primer y último término son 1 y 10.
errores_frecuentes:
- Confundir los extremos con los medios.
afirmaciones_verdaderas:
- Los extremos son el primer y cuarto término de la proporción.
al_terminar_debes_ponder: Identificar con precisión los extremos de una proporción.
fuente: Texto escolar MINEDUC.
estado: publicado
