semantic_id: MAT.NUM.RAZONES_PROPORCIONES.TERMINOS_EXTREMOS
resumen_inicial: 'En una proporción $a : b = c : d$ o $\frac{a}{b} = \frac{c}{d}$, los términos extremos son el primero y el cuarto término: $a$ y $d$, situados en las posiciones exteriores de la igualdad.'
explicacion_simple: '![Términos extremos](/static/img/nodos/identificacion-de-terminos-extremos-intro.svg)


  En una proporción $a : b = c : d$:

  - Los **extremos** son los números que quedan en las **orillas o puntas externas**: **$a$ y $d$**.

  - En la forma de fracciones $\frac{a}{b} = \frac{c}{d}$, forman la **diagonal principal descendente** (el de arriba a la izquierda $a$ y el de abajo a la derecha $d$).

  - Ejemplo: En $3 : 5 = 12 : 20$, los extremos son **$3$ y $20$**.

  - Su producto ($3 \cdot 20 = 60$) es la mitad fundamental del producto cruzado.'
explicacion_formal: 'Dada la proporción geométrica ordenada $(a, b, c, d) \in \mathbb{R}^4$ con $b, d \neq 0$ tal que $\frac{a}{b} = \frac{c}{d}$, se definen los **términos extremos** como el par ordenado:


  $$\operatorname{Ext}(\mathcal{P}) = (a, d)$$


  donde $a$ es el primer término (antecedente de la 1ª razón) y $d$ es el cuarto término (consecuente de la 2ª razón).


  **Producto de Extremos:**

  El escalar $P_{\text{ext}} = a \cdot d$ interviene directamente en la condición de proporcionalidad $P_{\text{ext}} = P_{\text{med}}$.'
definiciones_clave: '- **Términos extremos**: $a$ (1° término) y $d$ (4° término).

  - **Posición en la diagonal**: Numerador del 1° miembro y denominador del 2° miembro.

  - **Producto de extremos**: Resultado de multiplicar $a \cdot d$.'
propiedades_relaciones: '- **Intercambiabilidad**: Los extremos pueden permutarse entre sí sin alterar la validez de la proporción: $\frac{d}{b} = \frac{c}{a}$.

  - **Igualdad al producto de medios**: $a \cdot d = b \cdot c$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de términos extremos](/static/img/nodos/identificacion-de-terminos-extremos-ejemplos.svg)


    Identifique los términos extremos en la proporción $3 : 5 = 12 : 20$ y en la ecuación fraccionaria $\frac{x}{4} = \frac{9}{12}$, y calcule su producto.'
  pasos:
  - 'Paso 1: En $3 : 5 = 12 : 20$: Los términos en los bordes exteriores son $3$ (primero) y $20$ (último) $\implies$ Extremos = $3$ y $20$.'
  - 'Paso 2: Calcular el producto de extremos: $3 \cdot 20 = 60$.'
  - 'Paso 3: En $\frac{x}{4} = \frac{9}{12}$: El numerador izquierdo es $x$ y el denominador derecho es $12$ $\implies$ Extremos = $x$ y $12$.'
  - 'Paso 4: Producto de extremos: $x \cdot 12 = 12x$.'
checkpoints:
