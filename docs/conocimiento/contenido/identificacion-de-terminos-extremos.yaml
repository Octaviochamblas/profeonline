procedimiento:
- 'Paso 1: Escribir la proporción en formato estándar $a : b = c : d$ o $\frac{a}{b} = \frac{c}{d}$.'
- 'Paso 2: Localizar el primer término ($a$) y el cuarto término ($d$).'
- 'Paso 3: Multiplicar ambos términos para obtener el producto de extremos $a \cdot d$.'
errores_correccion: '- **Error 1: Confundir extremos con la primera fracción ($a$ y $b$).** **Cómo corregirlo:** Los extremos son las puntas opuestas de la proporción: $a$ y $d$.

  - **Error 2: Tomar los dos numeradores como extremos.** **Cómo corregirlo:** Los extremos ocupan posiciones diagonales: numerador izquierdo y denominador derecho.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: '¿Cuáles son los términos extremos en la proporción $5 : 8 = 15 : 24$?'
  alternativas:
  - $5$ y $24$
  - $8$ y $15$
  - $5$ y $15$
  respuesta: $5$ y $24$
  solucion_pasos:
  - Primer término = $5$, cuarto término = $24$ $\implies$ Extremos = $5$ y $24$.
- titulo: Ejemplo 2
  enunciado: Si los extremos de una proporción son $4$ y $9$, ¿cuál es su producto?
  alternativas:
  - $36$
  - $13$
  - $2,25$
  respuesta: $36$
  solucion_pasos:
  - $4 \cdot 9 = 36$.
- titulo: ¿Son 1 y 12 los extremos en la proporción 1/4 = 3/12?
  respuesta: Sí
  solucion_pasos:
  - Sí, $1$ es el numerador de la primera razón y $12$ es el denominador de la segunda.
  alternativas:
  - texto: Sí, corresponden al primer y cuarto término
    es_correcta: true
    retroalimentacion: ¡Correcto! Diagonal principal.
  - texto: No, son 4 y 3
    es_correcta: false
    retroalimentacion: Incorrecto, 4 y 3 son los términos medios.
  - texto: No, son 1 y 3
    es_correcta: false
    retroalimentacion: Incorrecto, esos son los numeradores.
- titulo: ¿Permuta el valor del producto de extremos si cambiamos a · d por d · a?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa de la multiplicación de números reales $a \cdot d = d \cdot a$.
  alternativas:
  - texto: No, el producto es conmutativo y da exactamente el mismo resultado
    es_correcta: true
    retroalimentacion: ¡Correcto! Propiedad conmutativa.
  - texto: Sí, el resultado se invierte
    es_correcta: false
    retroalimentacion: Incorrecto, el producto no cambia de valor.
  - texto: Sí, cambia de signo
    es_correcta: false
    retroalimentacion: Incorrecto, no hay cambio de signo.
errores_frecuentes:
- Creer que los extremos son los números de la primera razón.
- Confundir extremos con los numeradores de ambas fracciones.
- Olvidar que en $\frac{a}{b} = \frac{c}{d}$, el término $d$ es un extremo.
- Desordenar la posición al plantear la ecuación lineal.
afirmaciones_verdaderas:
- Los términos extremos son el primer término ($a$) y el cuarto término ($d$) de la proporción.
- En la representación fraccionaria $\frac{a}{b} = \frac{c}{d}$, forman la diagonal descendente.
- El producto de los extremos es igual al producto de los medios en toda proporción válida.
al_terminar_debes_poder: '![Síntesis de términos extremos](/static/img/nodos/identificacion-de-terminos-extremos-resumen.svg)


  QUÉ: Identificar y operar con los términos extremos de una proporción matemática.


  CÓMO: Localizando el primer ($a$) y cuarto ($d$) término en $a : b = c : d$, o la diagonal descendente en $\frac{a}{b} = \frac{c}{d}$, y calculando su producto $a \cdot d$.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
