semantic_id: MAT.NUM.COMPLEJOS.CONJUGADO
resumen_inicial: El conjugado de un número complejo $z = a + bi$ es otro complejo
  denotado por $\bar{z} = a - bi$, obtenido invirtiendo únicamente el signo de su
  parte imaginaria.
explicacion_simple: 'Para hallar el **conjugado** de un número complejo, simplemente
  **cambias el signo de la parte imaginaria** (el signo que acompaña a la $i$):

  - Si $z = 3 + 4i \implies \bar{z} = 3 - 4i$.

  - Si $z = -2 - 5i \implies \bar{z} = -2 + 5i$.

  - La parte real NO cambia su signo.'
explicacion_formal: Sea $z = a + bi \in \mathbb{C}$. Se define el conjugado $\bar{z}
  = a - bi$. Geométricamente representa la reflexión del afijo $(a,b)$ respecto al
  eje real. Se cumple $z \cdot \bar{z} = a^2 + b^2 \in \mathbb{R}_{\ge 0}$.
definiciones_clave: '- **Conjugado ($\bar{z}$)**: Operación $a + bi \to a - bi$.'
propiedades_relaciones: '- **Producto por el conjugado**: $z \cdot \bar{z} = a^2 +
  b^2 = |z|^2$ (siempre da un número real no negativo).'
ejemplo_guiado:
  enunciado: Calcula el producto de $z = 4 + 3i$ por su conjugado $\bar{z}$.
  pasos:
  - 'Hallar el conjugado: $\bar{z} = 4 - 3i$.'
  - 'Multiplicar: $(4 + 3i)(4 - 3i)$.'
  - 'Aplicar la propiedad $z \cdot \bar{z} = a^2 + b^2$:'
  - $4^2 + 3^2 = 16 + 9 = 25$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el conjugado de $z = -6 + 2i$?
  choices:
  - text: -6 - 2i
    is_correct: true
  - text: 6 - 2i
    is_correct: false
  - text: 6 + 2i
    is_correct: false
  - text: -6 + 2i
    is_correct: false
  explanation: 'La correcta es: -6 - 2i. Se invierte únicamente el signo de la parte
    imaginaria (+2i a -2i). La parte real (-6) se conserva.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el producto $z \cdot \bar{z}$ para $z = 5 - 2i$.
  choices:
  - text: '29'
    is_correct: true
  - text: '21'
    is_correct: false
  - text: 25 - 4i
    is_correct: false
  - text: 29i
    is_correct: false
  explanation: 'La correcta es: 29. $a^2 + b^2 = 5^2 + (-2)^2 = 25 + 4 = 29$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la parte real $a$ y la parte imaginaria $b$.'
- 'Paso 2: Conservar el signo de $a$.'
- 'Paso 3: Invertir el signo de $b$.'
- 'Paso 4: Escribir $\bar{z} = a - bi$.'
errores_correccion: No le cambies el signo a la parte real. El conjugado de $-3 +
  4i$ es $-3 - 4i$, NUNCA $+3 - 4i$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el conjugado de $z = 7i$?
  alternativas:
  - -7i
  - 7i
  - '-7'
  respuesta: -7i
  solucion_pasos:
  - Parte imaginaria 7 cambia a -7 $\implies -7i$.
errores_frecuentes:
- Cambiar el signo a la parte real.
afirmaciones_verdaderas:
- $z \cdot \bar{z} = a^2 + b^2 \in \mathbb{R}$.
al_terminar_debes_poder: Hallar el conjugado de un número complejo y calcular $z
  \cdot \bar{z}$.
fuente: Texto escolar MINEDUC.
estado: publicado
