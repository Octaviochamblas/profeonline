resumen_inicial: El conjugado de un número complejo $z = a + bi$ es el complejo $\bar{z}
  = a - bi$, obtenido invirtiendo únicamente el signo de la parte imaginaria.
explicacion_simple: Para encontrar el conjugado de un número complejo, simplemente
  le cambiamos el signo al término que tiene la $i$, dejando el número de la parte
  real exactamente igual.
explicacion_formal: 'Para todo $z = a + bi \in \mathbb{C}$, el **Conjugado Complejo
  $\bar{z}$** se define como:


  $$\bar{z} = a - bi$$


  **Propiedades geométricas y algebraicas:**

  - Reflexión axial: $\bar{z}$ es la simetría especular de $z$ respecto al eje real
  $X$.

  - Producto conjugado real: $z \cdot \bar{z} = (a + bi)(a - bi) = a^2 + b^2 \in \mathbb{R}^+_{0}$.'
definiciones_clave: '- **Conjugado complejo $\bar{z}$**: Expresión $\bar{z} = a -
  bi$ con inversión de signo en $\text{Im}(z)$.'
propiedades_relaciones: '- **Producto real positivo**: $z \cdot \bar{z} = a^2 + b^2
  \in \mathbb{R}$.'
ejemplo_guiado:
  enunciado: Calcule el conjugado $\bar{z}$ y el producto $z \cdot \bar{z}$ para $z
    = 3 + 4i$.
  pasos:
  - 'Paso 1: Cambiar el signo a la parte imaginaria: $\bar{z} = 3 - 4i$.'
  - 'Paso 2: Calcular el producto $z \cdot \bar{z} = (3 + 4i)(3 - 4i) = 3^2 + 4^2
    = 9 + 16 = 25$.'
  - 'Conclusión: $\bar{z} = 3 - 4i$ y $z \cdot \bar{z} = 25$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué modificación se realiza a z = a + bi para obtener su conjugado bar{z}?
  choices:
  - text: Se invierte únicamente el signo de la parte imaginaria (a - bi)
    is_correct: true
  - text: Se invierten los signos de a y b
    is_correct: false
  - text: Se cambia el signo de la parte real solamente
    is_correct: false
  - text: Se divide por i
    is_correct: false
  explanation: La alternativa correcta es 'Se invierte únicamente el signo de la parte
    imaginaria (a - bi)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para z = 3 + 4i, ¿cuál fue el producto real z · bar{z}?
  choices:
  - text: 25 (porque 3^2 + 4^2 = 25)
    is_correct: true
  - text: '7'
    is_correct: false
  - text: '-25'
    is_correct: false
  - text: 25i
    is_correct: false
  explanation: La alternativa correcta es '25 (porque 3^2 + 4^2 = 25)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de obtener el conjugado $\bar{z}
  = a - bi$ y calcular productos reales $z \cdot \bar{z} = a^2 + b^2$.
semantic_id: MAT.NUM.COMPLEJOS.CONJUGADO
procedimiento:
- 'Paso 1: Identificar los componentes $a = \text{Re}(z)$ y $b = \text{Im}(z)$.'
- 'Paso 2: Aplicar la definición o fórmula requerida (binomial, cartesiana, conjugado
  o módulo).'
- 'Paso 3: Simplificar y expresar el resultado final en el conjunto $\mathbb{C}$ o
  $\mathbb{R}$.'
errores_correccion: '- **Error 1: Incluir la letra $i$ dentro de la parte imaginaria
  (escribir $\text{Im}(3+4i) = 4i$).** **Cómo corregirlo:** La parte imaginaria es
  solo el coeficiente escalar real ($\text{Im}(z) = 4$).


  - **Error 2: Cambiar el signo de la parte real al calcular el conjugado.** **Cómo
  corregirlo:** El conjugado invierte ÚNICAMENTE el signo de la parte imaginaria ($\bar{z}
  = a - bi$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.COMPLEJOS.CONJUGADO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del concepto de números complejos.
- titulo: Ejemplo 2
  enunciado: Verificación formal en el plano de Argand.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en C.
- titulo: ¿Es el módulo de un número complejo un valor siempre no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|z| = \sqrt{a^2+b^2} \ge 0$ por ser una distancia.
- titulo: ¿Es z · bar{z} un número real no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $z \cdot \bar{z} = a^2 + b^2 \in \mathbb{R}^+_{0}$.
errores_frecuentes:
- Incluir la unidad imaginaria $i$ como parte integrante del coeficiente de la parte
  imaginaria $\text{Im}(z)$.
- Invertir el signo de la parte real al calcular el conjugado de un número complejo.
- Establecer relaciones de orden de mayor o menor ($z_1 > z_2$) entre números complejos
  en $\mathbb{C}$.
- El módulo de un número complejo $z = a + bi$ da como resultado un número imaginario
  negativo.
- Restar los términos reales e imaginarios al calcular la distancia al origen.
afirmaciones_verdaderas:
- Todo número complejo $z = a + bi$ combina una parte real $\text{Re}(z) = a$ y una
  parte imaginaria escalar $\text{Im}(z) = b$.
- 'El producto de un número complejo por su conjugado da como resultado su módulo
  al cuadrado: $z \cdot \bar{z} = |z|^2 = a^2 + b^2$.'
