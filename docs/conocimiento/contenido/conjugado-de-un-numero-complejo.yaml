semantic_id: MAT.NUM.COMPLEJOS.CONJUGADO
resumen_inicial: El conjugado de un número complejo $z = a + bi$ es $\overline{z} = a - bi$, obtenido al invertir ÚNICAMENTE el signo de su parte imaginaria.
explicacion_simple: "![Conjugado de un número complejo](/static/img/nodos/conjugado-de-un-numero-complejo-intro.svg)\n\nEl **conjugado** de un número complejo se denota con una barra arriba ($\\overline{z}$):\n- Se obtiene **cambiando únicamente el signo de la parte imaginaria** (la parte real queda exactamente igual).\n- Ejemplos:\n  - Si $z = 3 + 2i \\implies \\overline{z} = 3 - 2i$.\n  - Si $z = -7 - 4i \\implies \\overline{z} = -7 + 4i$.\n- **Propiedad estrella:** Al multiplicar un número por su conjugado, el resultado es siempre un número real positivo: $z \\cdot \\overline{z} = a^2 + b^2$."
explicacion_formal: "Sea $z = a + bi \\in \\mathbb{C}$ con $a, b \\in \\mathbb{R}$. Se define el **complejo conjugado** de $z$, denotado por $\\overline{z}$, como:\n\n$$\\overline{z} = a - bi$$\n\n**Propiedades del Conjugado:**\n1. **Involución:** $\\overline{\\overline{z}} = z$.\n2. **Distributividad con operaciones:**\n   - $\\overline{z_1 \\pm z_2} = \\overline{z_1} \\pm \\overline{z_2}$\n   - $\\overline{z_1 \\cdot z_2} = \\overline{z_1} \\cdot \\overline{z_2}$\n   - $\\overline{\\left(\\frac{z_1}{z_2}\\right)} = \\frac{\\overline{z_1}}{\\overline{z_2}}$\n3. **Producto Notabilísimo:** $z \\cdot \\overline{z} = a^2 + b^2 = |z|^2 \\in \\mathbb{R}_{\\ge 0}$.\n4. **Simetría:** En el plano complejo, $\\overline{z}$ es la reflexión axial de $z$ respecto al Eje Real."
definiciones_clave: '- **Conjugado ($\overline{z} = a - bi$)**: Inversión del signo de la parte imaginaria.

  - **Involución**: Propiedad donde conjugar dos veces devuelve el número original ($\overline{\overline{z}} = z$).

  - **Suma por diferencia compleja**: Identidad $(a+bi)(a-bi) = a^2 + b^2$.'
propiedades_relaciones: '- **División de números complejos**: Se multiplica numerador y denominador por el conjugado del divisor: $\frac{z}{w} = \frac{z \cdot \overline{w}}{w \cdot \overline{w}} = \frac{z \cdot \overline{w}}{|w|^2}$.

  - **Caracterización de reales e imaginarios**: $z \in \mathbb{R} \iff \overline{z} = z$, y $z \in \mathbb{I} \iff \overline{z} = -z$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de conjugado de un complejo](/static/img/nodos/conjugado-de-un-numero-complejo-ejemplos.svg)


    Calcule el conjugado $\overline{z}$ para $z_1 = -7 - 4i$ y determine el producto notable $(3 + 2i)(3 - 2i)$.'
  pasos:
  - 'Paso 1: Para $z_1 = -7 - 4i$: Mantener la parte real $a = -7$ e invertir el signo de $-4i \implies \overline{z}_1 = -7 + 4i$.'
  - 'Paso 2: Para $(3 + 2i)(3 - 2i)$: Aplicar la fórmula del producto $a^2 + b^2$.'
  - 'Paso 3: Calcular $3^2 + 2^2 = 9 + 4 = 13$.'
  - 'Conclusión: $\overline{z}_1 = -7 + 4i$ y el producto es el número real $13$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el conjugado del número complejo $z = -5 + 8i$?
  choices:
  - text: $-5 - 8i$ (solo cambia el signo de la parte imaginaria)
    is_correct: true
  - text: $5 - 8i$
    is_correct: false
  - text: $5 + 8i$
    is_correct: false
  - text: $-5 + 8$
    is_correct: false
  explanation: La alternativa correcta es '$-5 - 8i$ (solo cambia el signo de la parte imaginaria)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el resultado del producto $(3 + 2i)(3 - 2i)$?
  choices:
  - text: $13$ (porque $3^2 + 2^2 = 9 + 4 = 13$)
    is_correct: true
  - text: $5$
    is_correct: false
  - text: $9 - 4i$
    is_correct: false
  - text: $13i$
    is_correct: false
  explanation: La alternativa correcta es '$13$ (porque $3^2 + 2^2 = 9 + 4 = 13$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la parte real $a$ y la parte imaginaria $b$ en $z = a + bi$.'
- 'Paso 2: Conservar la parte real $a$ intacta con su signo original.'
- 'Paso 3: Invertir exclusivamente el signo de la parte imaginaria: $+b \to -b$ o $-b \to +b$ para obtener $\overline{z} = a - bi$.'
errores_correccion: '- **Error 1: Cambiar también el signo de la parte real (decir que el conjugado de $-3+4i$ es $3-4i$).** **Cómo corregirlo:** El conjugado **SOLO cambia el signo imaginario**: $\overline{-3+4i} = -3-4i$ (cambiar ambos es el opuesto $-z$).

  - **Error 2: Creer que $z \cdot \overline{z} = a^2 - b^2$.** **Cómo corregirlo:** Al aplicar $i^2 = -1$, la resta se transforma en **suma de cuadrados**: $a^2 - (bi)^2 = a^2 + b^2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el conjugado de $z = 10i$?
  alternativas:
  - $-10i$
  - $10$
  - $10i$
  respuesta: $-10i$
  solucion_pasos:
  - $z = 0 + 10i \implies \overline{z} = 0 - 10i = -10i$.
- titulo: Ejemplo 2
  enunciado: ¿A qué número real equivale $(4 - i)(4 + i)$?
  alternativas:
  - $17$
  - $15$
  - $16 - i$
  respuesta: $17$
  solucion_pasos:
  - $4^2 + 1^2 = 16 + 1 = 17$.
- titulo: ¿Es el conjugado de un número real el mismo número real?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, porque su parte imaginaria es 0: $\overline{a + 0i} = a - 0i = a$.'
  alternativas:
  - texto: Sí, el conjugado de todo real es él mismo
    es_correcta: true
    retroalimentacion: ¡Correcto! $\overline{x} = x$ para todo $x \in \mathbb{R}$.
  - texto: No, cambia a signo negativo
    es_correcta: false
    retroalimentacion: Incorrecto, ese es el opuesto $-x$.
  - texto: No, los reales no tienen conjugado
    es_correcta: false
    retroalimentacion: Incorrecto, todos los números complejos tienen conjugado.
- titulo: ¿Es z · z̄ siempre mayor o igual a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, $z \cdot \overline{z} = a^2 + b^2 \ge 0$ para todos los reales $a, b$.
  alternativas:
  - texto: Sí, suma de cuadrados es siempre no negativa
    es_correcta: true
    retroalimentacion: ¡Correcto! Solo es cero cuando $z = 0$.
  - texto: No, puede ser negativo si b es negativo
    es_correcta: false
    retroalimentacion: Incorrecto, $b^2 \ge 0$ siempre.
  - texto: No, da un número imaginario
    es_correcta: false
    retroalimentacion: Incorrecto, siempre es un número real.
errores_frecuentes:
- Cambiar el signo de la parte real en lugar de la imaginaria.
- Calcular $z \cdot \overline{z}$ como $a^2 - b^2$ en vez de $a^2 + b^2$.
- Olvidar que $\overline{bi} = -bi$.
- Confundir conjugado $\overline{z}$ con opuesto aditivo $-z$.
afirmaciones_verdaderas:
- El conjugado de $z = a + bi$ es $\overline{z} = a - bi$.
- 'El producto de un número complejo por su conjugado es siempre un número real no negativo: $z \cdot \overline{z} = a^2 + b^2$.'
- Geométricamente, el conjugado representa la reflexión respecto al Eje Real en el plano complejo.
al_terminar_debes_poder: '![Síntesis de conjugado](/static/img/nodos/conjugado-de-un-numero-complejo-resumen.svg)


  QUÉ: Calcular y aplicar las propiedades del complejo conjugado $\overline{z}$.


  CÓMO: Invirtiendo exclusivamente el signo de la parte imaginaria $\overline{a + bi} = a - bi$ y utilizando el producto $z \cdot \overline{z} = a^2 + b^2$ para simplificar operaciones y racionalizar denominadores complejos.'
