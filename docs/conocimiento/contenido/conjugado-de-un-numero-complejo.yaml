semantic_id: MAT.NUM.COMPLEJOS.CONJUGADO
resumen_inicial: 'El conjugado de un número complejo $z = a + bi$ es otro complejo denotado por $\bar{z} = a - bi$, obtenido invirtiendo únicamente el signo de su parte imaginaria.'
explicacion_simple: |
  Para encontrar el conjugado de un número complejo (que se escribe poniendo una barrita arriba de la $z$, es decir, $\bar{z}$), solo tienes que cambiarle el signo al número que acompaña a la $i$. La parte real se queda exactamente igual. Por ejemplo, si $z = 4 + 5i$, su conjugado es $\bar{z} = 4 - 5i$. Si $z = -3 - 2i$, su conjugado es $\bar{z} = -3 + 2i$.
explicacion_formal: |
  ### Definición formal
  El **conjugado** de un número complejo $z = a + bi \in \mathbb{C}$ es la operación de reflexión espectral definida formalmente por:
  $$\bar{z} = a - bi \quad (a, b \in \mathbb{R})$$

  ### Propiedades algebraicas del conjugado
  Para cualesquiera números complejos $z, z_1, z_2 \in \mathbb{C}$:
  1. **Involución (Doble conjugación)**: $\overline{(\bar{z})} = z$
  2. **Conjugado de la suma/resta**: $\overline{z_1 \pm z_2} = \bar{z}_1 \pm \bar{z}_2$
  3. **Conjugado del producto**: $\overline{z_1 \cdot z_2} = \bar{z}_1 \cdot \bar{z}_2$
  4. **Conjugado del cociente**: $\overline{\left(\frac{z_1}{z_2}\right)} = \frac{\bar{z}_1}{\bar{z}_2} \quad (z_2 \neq 0)$
  5. **Producto de un complejo por su conjugado (Realización)**:
     $$z \cdot \bar{z} = (a + bi)(a - bi) = a^2 - b^2 i^2 = a^2 + b^2 \in \mathbb{R}^+_0$$

  ### Racionalización / División de números complejos
  El producto $z \cdot \bar{z} = a^2 + b^2$ se utiliza para **dividir números complejos**, multiplicando numerador y denominador por el conjugado del divisor:
  $$\frac{z_1}{z_2} = \frac{z_1 \cdot \bar{z}_2}{z_2 \cdot \bar{z}_2} = \frac{(a + bi)(c - di)}{c^2 + d^2}$$

  ### Síntesis didáctica
  - Operación: Cambiar el signo del término imaginario $bi \to -bi$.
  - Simetría geométrica: Es la reflexión del afijo respecto al eje real $X$.
definiciones_clave: |
  - **Conjugado $\bar{z}$**: Número complejo $a - bi$ simétrico a $z = a + bi$ respecto al eje real.
  - **Identidad de producto $z \cdot \bar{z} = a^2 + b^2$**: Multiplicación que elimina la unidad imaginaria devolviendo la suma de los cuadrados de sus componentes.
  - **Operación de reflexión especular**: Transformación geométrica que invierte el signo de la ordenada en el plano de Argand.
propiedades_relaciones: |
  - **Caracterización de números reales y puros**:
    - $z \in \mathbb{R} \iff \bar{z} = z$ (Un número es real puro si y solo si es igual a su conjugado).
    - $z \in \mathbb{I} \iff \bar{z} = -z$ (Un número es imaginario puro si y solo si su conjugado es su opuesto).
  - **Raíces complejas en polinomios reales**: Si un polinomio con coeficientes reales tiene a $z$ como raíz, entonces su conjugado $\bar{z}$ también es obligatoriamente una raíz.
ejemplo_guiado:
  enunciado: 'Calcula el producto de un número complejo $z = 3 + 4i$ por su conjugado $\bar{z}$ comprobando que el resultado es un número real positivo.'
  pasos:
    - 'Paso 1: Hallamos el conjugado de $z = 3 + 4i$ invirtiendo el signo de la parte imaginaria: $\bar{z} = 3 - 4i$.'
    - 'Paso 2: Planteamos la multiplicación entre el complejo y su conjugado: $z \cdot \bar{z} = (3 + 4i)(3 - 4i)$.'
    - 'Paso 3: Aplicamos el producto notable de suma por su diferencia: $(3)^2 - (4i)^2 = 9 - 16i^2$.'
    - 'Paso 4: Sustituimos $i^2 = -1$ y resolvemos la suma de cuadrados: $9 - 16(-1) = 9 + 16 = 25 \in \mathbb{R}^+$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué resultado se obtiene al multiplicar cualquier número complejo $z = a + bi$ por su conjugado $\bar{z} = a - bi$?'
    choices:
      - {text: '$a^2 + b^2$, entregando la suma de los cuadrados de sus componentes como un número real no negativo', is_correct: true}
      - {text: '$a^2 - b^2$, conservando la resta de cuadrados', is_correct: false}
      - {text: '$2a + 2bi$, duplicando el número', is_correct: false}
      - {text: '$0$, anulando el producto', is_correct: false}
    explanation: 'La alternativa correcta es ''$a^2 + b^2$, entregando la suma de los cuadrados de sus componentes como un número real no negativo''. $(a+bi)(a-bi) = a^2 - b^2i^2 = a^2 + b^2$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el conjugado $\bar{z}$ del número complejo $z = -8 - 3i$?'
    choices:
      - {text: '$-8 + 3i$, invirtiendo únicamente el signo de la parte imaginaria', is_correct: true}
      - {text: '$8 + 3i$, cambiando los dos signos', is_correct: false}
      - {text: '$8 - 3i$, cambiando solo el signo real', is_correct: false}
      - {text: '$-8 - 3i$, conservando el mismo número', is_correct: false}
    explanation: 'La alternativa correcta es ''$-8 + 3i$, invirtiendo únicamente el signo de la parte imaginaria''. La parte real $-8$ no cambia; la imaginaria $-3i$ pasa a $+3i$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la parte real $a$ y la parte imaginaria $b$ del número complejo $z = a + bi$.'
  - 'Paso 2: Conservar inalterada la parte real $a$ con su signo original.'
  - 'Paso 3: Cambiar el signo del término imaginario $+bi \to -bi$ (o $-bi \to +bi$).'
  - 'Paso 4: Escribir la respuesta final etiquetándola como $\bar{z} = a - bi$.'
errores_correccion: |
  - **Error 1:** Cambiar el signo de la parte real al calcular el conjugado (ej: decir que el conjugado de $-3 + 4i$ es $+3 - 4i$). **Cómo corregirlo:** El conjugado **solo invierte el signo de la parte imaginaria**. La parte real se mantiene exactamente igual: $\bar{z} = -3 - 4i$. (Cambiar ambos signos da el **opuesto** $-z$).
  - **Error 2:** Creer que el conjugado de un número real puro cambia de signo (ej: decir que el conjugado de 7 es -7). **Cómo corregirlo:** Como la parte imaginaria de un número real es cero ($7 = 7 + 0i$), su conjugado es **idéntico al número original**: $\bar{7} = 7$.
ejemplos:
  - titulo: 'Conjugado con parte real negativa'
    enunciado: '¿El conjugado de $z = -5 + 2i$ es $\bar{z} = -5 - 2i$?'
    alternativas:
      - 'Sí, pues solo se invierte el signo imaginario'
      - 'No, es 5 - 2i'
      - 'No, es 5 + 2i'
    respuesta: 'Sí, pues solo se invierte el signo imaginario'
    solucion_pasos:
      - '1. Conservamos la parte real: $-5$.'
      - '2. Invertimos la parte imaginaria: $+2i \to -2i \implies -5 - 2i$.'
  - titulo: 'Conjugado de un número real'
    enunciado: '¿El conjugado del número real $z = 10$ es $\bar{z} = 10$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Para todo número real $x \in \mathbb{R}$, $\bar{x} = x$.'
  - titulo: 'Conjugado de un imaginario puro'
    enunciado: '¿El conjugado del número imaginario puro $z = 6i$ es $\bar{z} = -6i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cambiamos el signo de $+6i$ a $-6i$.'
  - titulo: 'Producto por el conjugado'
    enunciado: '¿El producto de $z = 1 + 2i$ por su conjugado $\bar{z} = 1 - 2i$ resulta en $5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1^2 + 2^2 = 1 + 4 = 5$.'
errores_frecuentes:
  - 'El conjugado de un número complejo se obtiene invirtiendo los signos de la parte real y de la parte imaginaria simultáneamente.'
  - 'La operación de conjugación de un número complejo prescinde de todo símbolo o barra denotativa.'
  - 'Restar las componentes al multiplicar un complejo por su conjugado en lugar de sumar los cuadrados $a^2 + b^2$.'
  - 'La operación de conjugación de un número complejo prescinde de todo símbolo o barra denotativa.'
  - 'Aplicar la conjugación únicamente cuando el número complejo está escrito en forma cartesiana.'
afirmaciones_verdaderas:
  - 'El conjugado de un número complejo $z = a + bi$ es $\bar{z} = a - bi$, obtenido cambiando únicamente el signo de su parte imaginaria.'
  - 'El producto de cualquier número complejo por su conjugado es siempre un número real no negativo igual a la suma de los cuadrados de sus componentes: $z \cdot \bar{z} = a^2 + b^2$.'
