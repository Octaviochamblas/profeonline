semantic_id: MAT.GEO.SIMETRIAS.CENTRAL_ORIGEN
resumen_inicial: 'Simetría central respecto del origen de coordenadas: conceptos,
  teoremas, propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'Cuando el centro de simetría es exactamente el origen del plano,
  la regla se simplifica: solo hay que cambiar el signo de ambas coordenadas.'
explicacion_formal: '![Simetría central respecto del origen](/static/img/geometria/isometrias/simetria-central-origen.svg)


  ### Definición formal


  Si el centro de simetría es el origen $(0,0)$, la fórmula general $P''=(2x_O-x_P,\,2y_O-y_P)$
  se simplifica a $P''=(-x_P,-y_P)$, ya que $x_O=y_O=0$.


  ### Desarrollo didáctico


  En la figura, el punto $P(-3,2)$ tiene como imagen respecto del origen $P''(3,-2)$:
  simplemente se invierte el signo de cada coordenada.'
