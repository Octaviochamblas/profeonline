semantic_id: MAT.GEO.CIRCULO_METRICA.LONGITUD_ARCO_GRADOS
resumen_inicial: La longitud de un arco de circunferencia se calcula multiplicando el perímetro completo 2πr por la proporción del ángulo central respecto a 360°, s = (α / 360°) · 2πr.
explicacion_simple: 'Un **arco** es un pedacito del borde curvo de la circunferencia. Para saber cuánto mide ese pedacito, solo tienes que pensar en qué fracción de una pizza completa representa el ángulo del centro.


  Una vuelta completa son $360^\circ$. Por lo tanto, si tu ángulo central mide $\alpha$ grados, el arco representa la fracción **$\frac{\alpha}{360^\circ}$** de toda la orilla. Multiplicas esa fracción por el perímetro total de la circunferencia ($2\pi r$) y ¡listo!: **$s = \frac{\alpha}{360^\circ} \cdot 2\pi r$** (que al simplificar el $2$ con el $360$ queda como **$\frac{\alpha \pi r}{180^\circ}$**).


  ![Longitud de arco en grados](/static/img/nodos/calculo-de-longitud-de-arco-mediante-proporcion-respecto-de-360-intro.svg)

  '
explicacion_formal: '### Deducción por regla de tres y proporcionalidad directa

  Sea $\mathcal{C}(O, r)$ una circunferencia de radio $r$. La longitud total de la curva ($2\pi r$) corresponde a un giro completo de $360^\circ$. Por linealidad de la medida angular con respecto a la métrica de arco euclidiana:

  $$\frac{s}{2\pi r} = \frac{\alpha}{360^\circ} \implies s = \frac{\alpha}{360^\circ} \cdot 2\pi r = \frac{\alpha \pi r}{180^\circ}$$


  ### Despeje del ángulo central a partir del arco

  Conocida la longitud lineal del arco $s$ y el radio $r$, el ángulo central en grados sexagesimales se despeja mediante:

  $$\alpha = \frac{s \cdot 360^\circ}{2\pi r} = \frac{180^\circ s}{\pi r}$$


  > **Complemento didáctico:** Para agilizar tus cálculos en la PAES, aprende de memoria las fracciones de $360^\circ$: $180^\circ = 1/2$, $120^\circ = 1/3$, $90^\circ = 1/4$, $60^\circ = 1/6$, $45^\circ = 1/8$, $30^\circ = 1/12$. Por ejemplo, para un arco de $60^\circ$, simplemente calcula el perímetro total $2\pi r$ y divídelo entre $6$.

  '
definiciones_clave: '- **Longitud de arco ($s$)**: Distancia métrica a lo largo de la curva comprendida entre dos puntos de la circunferencia.

  - **Ángulo central ($\alpha$)**: Ángulo con vértice en el centro $O$ que subtiende el arco.

  - **Factor de proporcionalidad ($\frac{\alpha}{360^\circ}$)**: Porción de la circunferencia correspondiente al ángulo.

  '
propiedades_relaciones: '- **Linealidad con el radio**: Si el radio se duplica manteniendo $\alpha$, la longitud de arco se duplica.

  - **Linealidad con el ángulo**: Si el ángulo se duplica manteniendo $r$, la longitud de arco se duplica.

  - **Equivalencia angular**: $\frac{s_1}{\alpha_1} = \frac{s_2}{\alpha_2} = \frac{\pi r}{180^\circ}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de longitud de arco en grados](/static/img/nodos/calculo-de-longitud-de-arco-mediante-proporcion-respecto-de-360-ejemplos.svg)


    En una circunferencia de radio $r = 12\text{ cm}$, un ángulo central mide $\alpha = 60^\circ$. Calcula la longitud del arco que subtiende. Además, determina el ángulo central correspondiente a un arco de longitud $5\pi\text{ cm}$ en una circunferencia de radio $r = 15\text{ cm}$.'
  pasos:
  - 'Paso 1: Calcular la fracción de giro para $\alpha = 60^\circ$: $\frac{60^\circ}{360^\circ} = \frac{1}{6}$.'
  - 'Paso 2: Calcular el perímetro total: $P = 2\pi(12) = 24\pi\text{ cm}$.'
  - 'Paso 3: Multiplicar por la fracción: $s = \frac{1}{6} \cdot 24\pi = 4\pi\text{ cm}$.'
  - 'Paso 4: Para el segundo ejercicio, calcular el perímetro: $P = 2\pi(15) = 30\pi\text{ cm}$. La fracción es $\frac{5\pi}{30\pi} = \frac{1}{6}$, luego $\alpha = \frac{1}{6} \cdot 360^\circ = 60^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula simplificada para calcular la longitud de arco s con el ángulo central α en grados?
  choices:
  - text: s = (α · π · r) / 180°.
    is_correct: true
  - text: s = (α · π · r²) / 360°.
    is_correct: false
  - text: s = (α · 2πr) / 180°.
    is_correct: false
  - text: s = (α · r) / 360°.
    is_correct: false
  explanation: La alternativa correcta es 's = (α · π · r) / 180°.' Al simplificar $2/360 = 1/180$, la expresión se reduce a $\frac{\alpha \pi r}{180^\circ}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En una circunferencia de radio r = 8 cm, ¿cuánto mide el arco subtendido por un ángulo central recto de 90°?
  choices:
  - text: 4π cm.
    is_correct: true
  - text: 8π cm.
    is_correct: false
  - text: 2π cm.
    is_correct: false
  - text: 16π cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''4π cm.'' Como $90^\circ$ es $1/4$ de vuelta: $s = \frac{1}{4} \cdot 2\pi(8) = \frac{16\pi}{4} = 4\pi$ cm.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el ángulo central $\alpha$ en grados y el radio $r$.

  2. Calcular la fracción respecto a $360^\circ$: $\frac{\alpha}{360^\circ}$.

  3. Calcular el perímetro completo: $2\pi r$.

  4. Multiplicar la fracción por el perímetro: $s = \frac{\alpha}{360^\circ} \cdot 2\pi r$.

  '
errores_correccion: '- **Error común 1:** Multiplicar por $\pi r^2$ en vez de $2\pi r$. **Corrección:** $\pi r^2$ calcula el área del sector; el arco es una longitud lineal y se calcula con $2\pi r$.

  - **Error común 2:** Dividir por $180^\circ$ manteniendo el $2$ en el numerador. **Corrección:** Si usas $180^\circ$, el $2$ ya fue cancelado: $s = \frac{\alpha \pi r}{180^\circ}$.

  '
ejemplos:
- tipo: A
  titulo: Arco de 45 grados
  enunciado: Calcula la longitud del arco correspondiente a un ángulo de $45^\circ$ en una circunferencia de radio $16\text{ cm}$.
  alternativas:
  - text: $4\pi\text{ cm}$.
    is_correct: true
  - text: $2\pi\text{ cm}$.
    is_correct: false
  - text: $8\pi\text{ cm}$.
    is_correct: false
  - text: $32\pi\text{ cm}$.
    is_correct: false
  explicacion: $s = \frac{45^\circ}{360^\circ} \cdot 2\pi(16) = \frac{1}{8} \cdot 32\pi = 4\pi\text{ cm}$.
- tipo: B
  titulo: Proporción lineal de arco
  enunciado: ¿Es la longitud del arco directamente proporcional a la medida del ángulo central que lo subtiende?
  respuesta: Sí
  explicacion: Sí. Al duplicar el ángulo central, la longitud del arco se duplica proporcionalmente.
errores_frecuentes:
- '''Confundir la longitud de arco con el área del sector circular.'''
- '''Dividir entre $180^\circ$ sin simplificar el $2$ de la fórmula del perímetro.'''
- '''Usar el diámetro directamente en la fórmula sin dividirlo entre 2.'''
afirmaciones_verdaderas:
- '''La longitud de arco es proporcional al ángulo central que lo subtiende respecto a $360^\circ$.'''
- "'La fórmula simplificada de la longitud de arco en grados es $s = \frac{\\alpha \\pi r}{180^\\circ}$.'"
- '''Un ángulo central de $90^\circ$ subtiende exactamente un cuarto de la circunferencia total.'''
al_terminar_debes_poder: '**QUÉ:** Calcular la longitud de un arco en grados y despejar el ángulo central correspondiente.


  **CÓMO:** Empleando $s = \frac{\alpha}{360^\circ} \cdot 2\pi r = \frac{\alpha \pi r}{180^\circ}$.


  ![Síntesis de arco en grados](/static/img/nodos/calculo-de-longitud-de-arco-mediante-proporcion-respecto-de-360-resumen.svg)

  '
