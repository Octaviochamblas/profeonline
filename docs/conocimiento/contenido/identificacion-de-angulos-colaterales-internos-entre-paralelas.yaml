semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.COLATERALES_INTERNOS_IDENTIFICACION
resumen_inicial: Los ángulos colaterales internos (o conjugados internos) son aquellos
  situados en la franja interior entre las dos paralelas y al mismo lado de la recta
  transversal.
explicacion_simple: '![Identificación de Colaterales Internos](/static/img/nodos/identificacion-de-angulos-colaterales-internos-entre-paralelas-intro.svg)


  Si te imaginas una letra "C" o una "U" acostada formada por las dos paralelas y
  la secante, los dos ángulos que quedan atrapados adentro al mismo lado son los ángulos
  colaterales internos. Como uno es agudo y el otro es obtuso, juntos se complementan
  para sumar 180°.'
explicacion_formal: '### Definición formal

  Dadas dos rectas paralelas $L_1 \parallel L_2$ y una transversal $T$, los **ángulos
  colaterales internos** (o conjugados internos) son aquellos que se ubican en el
  mismo lado de la transversal (mismo semiplano) y dentro de la franja comprendida
  entre las paralelas:


  $$\operatorname{Colat\_Int}(L_1, L_2, T) = \{(\alpha, \beta) \mid \text{mismo lado
  de } T \land \text{interiores a } L_1, L_2\}$$


  ### Desglose simbólico y geométrico

  - Franja interna compartida entre ambas paralelas.

  - Mismo semiplano respecto a la secante $T$ (ambos a la izquierda o ambos a la derecha).

  - Forma visual ''C'': Forman la figura de una letra ''C'' o ''U''.


  ### Síntesis didáctica

  Identificar los ángulos colaterales internos permite reconocer de inmediato pares
  de ángulos suplementarios en trapecios y paralelogramos.'
definiciones_clave: '- **Ángulos colaterales internos**: Pareja de ángulos interiores
  ubicados al mismo lado de la secante.

  - **Patrón en C**: Mnemotecnia visual que describe las esquinas de una letra C entre
  las paralelas. '
propiedades_relaciones: '- **Dos pares colaterales internos**: $(\angle 3, \angle
  6)$ en el semiplano izquierdo y $(\angle 4, \angle 5)$ en el semiplano derecho.

  - **Composición angular**: Siempre está formado por un ángulo agudo y un ángulo
  obtuso (salvo si son rectos de $90^\circ$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Colaterales Internos](/static/img/nodos/identificacion-de-angulos-colaterales-internos-entre-paralelas-ejemplos.svg)


    En una figura con $L_1 \parallel L_2$ y secante $T$, los ángulos interiores se
    numeran como $\angle 3, \angle 4$ en la recta superior y $\angle 6, \angle 5$
    en la inferior. Identifica los dos pares de ángulos colaterales internos.'
  pasos:
  - 'Paso 1: Localizar los cuatro ángulos de la región interior: $\angle 3, \angle
    4, \angle 5, \angle 6$.'
  - 'Paso 2: Observar el semiplano izquierdo de la secante $T$: los ángulos interiores
    son $\angle 3$ y $\angle 6$.'
  - 'Paso 3: Formar el primer par colateral interno: $(\angle 3, \angle 6)$.'
  - 'Paso 4: Observar el semiplano derecho de la secante $T$: los ángulos interiores
    son $\angle 4$ y $\angle 5$.'
  - 'Paso 5: Formar el segundo par colateral interno: $(\angle 4, \angle 5)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubican los ángulos colaterales internos?
  choices:
  - text: Entre las dos rectas paralelas y al mismo lado de la transversal
    is_correct: true
  - text: Entre las dos rectas paralelas y a lados opuestos de la transversal
    is_correct: false
  - text: Fuera de las rectas paralelas y a lados opuestos
    is_correct: false
  - text: En el mismo vértice de cruce
    is_correct: false
  explanation: Por definición se ubican entre las dos rectas paralelas y al mismo
    lado de la transversal.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué letra mnemotécnica describe a los ángulos colaterales internos?
  choices:
  - text: La letra C (las esquinas interiores al mismo lado)
    is_correct: true
  - text: La letra Z
    is_correct: false
  - text: La letra F
    is_correct: false
  - text: La letra X
    is_correct: false
  explanation: El patrón visual mnemotécnico clásico es la letra C (las esquinas interiores
    al mismo lado).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las rectas paralelas $L_1 \parallel L_2$ y la transversal $T$.'
- 'Paso 2: Delimitar la región interna comprendida entre las paralelas.'
- 'Paso 3: Elegir un lado de la transversal (izquierda o derecha) y seleccionar los
  dos ángulos interiores correspondientes.'
errores_correccion: No confundas colaterales internos (mismo lado de T) con alternos
  internos (lados opuestos de T).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\angle 3$ es el ángulo interior izquierdo en $L_1$, ¿cuál es su colateral
    interno en $L_2$?
  alternativas:
  - $\angle 6$ (interior izquierdo en $L_2$)
  - $\angle 5$ (interior derecho en $L_2$)
  - $\angle 7$ (exterior izquierdo en $L_2$)
  respuesta: $\angle 6$ (interior izquierdo en $L_2$)
  solucion_pasos:
  - El colateral interno está al mismo lado (izquierdo) en la recta $L_2$: $\angle
      6$.
- titulo: Ejemplo 2
  enunciado: ¿Cuántos pares de ángulos colaterales internos existen en total?
  alternativas:
  - 2 pares
  - 4 pares
  - 1 par
  respuesta: 2 pares
  solucion_pasos:
  - Hay un par en el semiplano izquierdo y otro par en el semiplano derecho (2 pares
    en total).
- titulo: ¿Los ángulos colaterales internos están al mismo lado de la transversal?
  respuesta: Sí
  solucion_pasos:
  - Sí, el prefijo "co-" indica que comparten el mismo lado respecto a la recta transversal.
- titulo: ¿Los ángulos colaterales internos son de igual medida por defecto?
  respuesta: 'No'
  solucion_pasos:
  - No, son suplementarios (suman 180°), no necesariamente iguales (solo si miden
    90°).
errores_frecuentes:
- Confundir colaterales internos con alternos internos.
- Seleccionar ángulos de la región exterior.
- Igualar sus medidas creyendo que son congruentes (en realidad suman $180^\circ$).
- Confundir el patrón en C con el patrón en Z.
- No verificar que los ángulos pertenezcan a vértices diferentes.
afirmaciones_verdaderas:
- Los ángulos colaterales internos están entre las paralelas y al mismo lado de la
  transversal.
- Existen exactamente 2 pares de ángulos colaterales internos.
al_terminar_debes_poder: '**QUÉ:** Identificar y reconocer pares de ángulos colaterales
  internos en sistemas de paralelas y transversales.


  **CÓMO:** Verificando la pertenencia a la franja interior y la ubicación en el mismo
  semiplano respecto a $T$ (patrón en C).


  ![Resumen de Identificación de Colaterales Internos](/static/img/nodos/identificacion-de-angulos-colaterales-internos-entre-paralelas-resumen.svg)'
