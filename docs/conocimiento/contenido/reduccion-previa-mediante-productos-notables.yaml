procedimiento:
- 'Paso 1: Identificar todos los productos notables o elevaciones al cuadrado entre paréntesis.'
- 'Paso 2: Desarrollar cada producto notable aplicando la identidad correspondiente.'
- 'Paso 3: Distribuir los signos negativos antecedentes sobre los términos del desarrollo.'
- 'Paso 4: Identificar y reducir los términos semejantes por clases de factor literal.'
errores_correccion: '- **Error 1:** Elevar los términos del binomio por separado sin incluir el término del doble producto (escribir $(x+3)^2 = x^2 + 9$). **Cómo corregirlo:** El cuadrado de un binomio **INCLUYE EL DOBLE PRODUCTO ($x^2 + 2(x)(3) + 9 = x^2 + 6x + 9$)**.

  - **Error 2:** No cambiar todos los signos de la expansión cuando le antecede un signo negativo (escribir $-(x^2 + 4x + 4) = -x^2 + 4x + 4$). **Cómo corregirlo:** El signo negativo **CAMBIA TODOS LOS SIGNOS DEL INTERIOR ($-x^2 - 4x - 4$)**.

  '
ejemplos:
- titulo: Cuadrado de binomio y resta
  enunciado: ¿Cuál es la simplificación de $(x + 1)^2 - 2x$?
  alternativas:
  - $x^2 + 1$
  - $x^2 + 4x + 1$
  - $x^2 - 1$
  respuesta: $x^2 + 1$
  solucion_pasos:
  - '1. Expansión: $x^2 + 2x + 1$.'
  - '2. Resta: $x^2 + 2x + 1 - 2x = x^2 + 1$.'
- titulo: Suma por diferencia y cancelación
  enunciado: ¿Cuál es la simplificación de $(a + 5)(a - 5) + 25$?
  alternativas:
  - $a^2$
  - $a^2 - 50$
  - $a^2 + 50$
  respuesta: $a^2$
  solucion_pasos:
  - '1. Expansión: $a^2 - 25$.'
  - '2. Suma: $a^2 - 25 + 25 = a^2$.'
- titulo: Distribución de signo negativo
  enunciado: Para $-(x + 2)^2$, ¿es la expansión correcta $-x^2 - 4x - 4$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el signo menos afecta a los tres términos del desarrollo.
- titulo: Reducción de grado
  enunciado: Al simplificar $(x + 3)^2 - x^2$, ¿se obtiene una expresión de primer grado $6x + 9$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^2 + 6x + 9 - x^2 = 6x + 9$.
errores_frecuentes:
- El término central del doble producto no es incluido al expandir el cuadrado de un binomio.
- La distribución del signo negativo antecedente a todos los términos del desarrollo parentético no se ejecuta.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Intentar reducir términos semejantes antes de expandir los productos notables.
- Intercambiar la identidad de suma por diferencia con el cuadrado de un binomio.
afirmaciones_verdaderas:
- La reducción previa mediante productos notables requiere expandir las potencias de binomios antes de sumar términos semejantes.
- Un signo negativo antecedente a un producto notable cambia el signo de cada término de su desarrollo.
al_terminar_debes_poder: '![Resumen de reducción mediante productos notables](/static/img/nodos/reduccion-previa-mediante-productos-notables-resumen.svg)


  QUÉ: Simplificar expresiones algebraicas que contienen binomios al cuadrado o productos notables.


  CÓMO: Desarrollar algebraicamente los productos notables, eliminar los paréntesis distribuyendo los signos negativos externos y reducir todos los monomios semejantes resultantes.'
