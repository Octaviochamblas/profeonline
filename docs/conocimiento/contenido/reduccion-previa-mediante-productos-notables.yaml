  question: ¿Qué paso se debe realizar antes de reducir términos semejantes en una expresión que contiene $(a + b)^2$?
  choices:
  - text: Desarrollar el producto notable como $a^2 + 2ab + b^2$ eliminando el paréntesis de la potencia
    is_correct: true
  - text: Sumar directamente los términos sin elevar al cuadrado
    is_correct: false
  - text: Eliminar el exponente dos sin cambiar la base
    is_correct: false
  - text: Multiplicar los coeficientes por dos sin expandir
    is_correct: false
  explanation: La alternativa correcta es 'Desarrollar el producto notable como $a^2 + 2ab + b^2$ eliminando el paréntesis de la potencia'. Expansión previa.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de simplificar $(x + 4)(x - 4) - x^2$?
  choices:
