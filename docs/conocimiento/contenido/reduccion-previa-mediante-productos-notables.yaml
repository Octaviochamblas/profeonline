procedimiento:
- 'Paso 1: Busca si hay subexpresiones que se pueden simplificar de inmediato (ej.
  término igual con mismo signo, o término que se cancela).'
- 'Paso 2: Aplica esa simplificación previa.'
- 'Paso 3: Con la expresión más simple, aplica la reducción estándar.'
- 'Paso 4: Verifica que el resultado sea más simple que si hubieras ignorado las identidades.'
errores_correccion: Evita cambiar los exponentes de las letras al sumar o restar términos
  semejantes en reducción previa mediante productos notables.
ejemplos:
- titulo: El shortcut algebraico
  enunciado: 'Reduce: 5x + (3x - 3x) + 2x.'
  solucion_pasos:
  - 'Identidad previa: 3x - 3x = 0.'
  - 'Expresión simplificada: 5x + 0 + 2x.'
  - 'Reducción: 5x + 2x = 7x.'
- titulo: El costo de producción se modela como $C = 3r + (2s - 2s) + 4r + (t - t)
    - r + 5$. Usando id
  enunciado: 'El costo de producción se modela como $C = 3r + (2s - 2s) + 4r + (t
    - t) - r + 5$. Usando identidades previas, ¿cuál es la expresión simplificada?
    (v1)


    Opciones: A) $6r + 5$ · B) $6r + 4s + 5$ · C) $7r + 5$ · D) $6r$'
  solucion_pasos:
  - '$(2s-2s)=0$ y $(t-t)=0$. Quedan: $3r+4r-r+5$. Familia $r$: $3+4-1=6r$. Constante:
    $5$. Resultado: $6r+5$.'
  - 'Respuesta: $6r + 5$'
- titulo: 'Respecto de «Reducción previa mediante productos notables»: ¿Describe adecuadamente
    el conce'
  enunciado: 'Respecto de «Reducción previa mediante productos notables»: ¿Describe
    adecuadamente el concepto esta frase? «La estrategia de **Identidades Previas**
    consiste en reconocer si algún subgrupo de términos corresponde a una forma algebraica
    conocida (como $a + a = 2a$ o $a - a = 0$), aplicarla y simplificar el paso de
    reducción»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La estrategia de **Identidades
    Previas** consiste en reconocer si algún subgrupo de términos corresponde a una
    forma algebraica conocida (como $a + a = 2a$ o $a - a = 0$), aplicarla y simplificar
    el paso de reducción.'
- titulo: 'Respecto de «Reducción previa mediante productos notables»: ¿Se puede aceptar
    esta afirmació'
  enunciado: 'Respecto de «Reducción previa mediante productos notables»: ¿Se puede
    aceptar esta afirmación? «No notar la cancelación previa y realizar más operaciones
    de las necesarias»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La estrategia de **Identidades
    Previas** consiste en reconocer si algún subgrupo de términos corresponde a una
    forma algebraica conocida (como $a + a = 2a$ o $a - a = 0$), aplicarla y simplificar
    el paso de reducción.'
errores_frecuentes:
- No notar la cancelación previa y realizar más operaciones de las necesarias.
- Aplicar la identidad incorrectamente (ej. creer que $2x + 3x = 5x^2$ en lugar de
  $5x$).
- No aporta ninguna ventaja, el proceso es el mismo.
- Para «¿Cuál es la ventaja de reconocer la identidad $x - x = 0$ antes de reducir
  la expresión completa $4a + (x - x) + 3a$? (v1)», la respuesta correcta es Permite
  multiplicar los coeficientes restantes.
- Cambia el valor final de la expresión.
afirmaciones_verdaderas:
- La reducción en reducción previa mediante productos notables conserva los exponentes
  de la parte literal.
al_terminar_debes_poder: Operar y reducir expresiones algebraicas utilizando reducción
  previa mediante productos notables.
