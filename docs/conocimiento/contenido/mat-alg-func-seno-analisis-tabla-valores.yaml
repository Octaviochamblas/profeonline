semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.TABLA_VALORES
resumen_inicial: 'Construcción de una tabla de valores notables para la función seno $f(x) = \sin(x)$ en el intervalo principal $[0, 2\pi]$.'
explicacion_simple: |
  Para dibujar la curva del seno a mano o entender cómo cambia su altura paso a paso, se construye una tabla con los ángulos más importantes (los ángulos notables y cuadrantales). Comenzamos en $0$, avanzamos por el primer cuadrante subiendo gradualmente de $0$ a $1$ en $\frac{\pi}{2}$, luego bajamos a $0$ en $\pi$, descendemos a $-1$ en $\frac{3\pi}{2}$ y finalmente regresamos a $0$ en $2\pi$. Organizar estos puntos en una tabla permite ubicar con precisión los pares $(x, y)$ sobre el plano cartesiano.
explicacion_formal: |
  ### Definición formal
  La **tabla de valores fundamentales de la función seno** sistematiza los pares ordenados $(x, f(x)) = (x, \sin x)$ para los ángulos notables y cuadrantales en un período completo $x \in [0, 2\pi]$:

  $$\begin{array}{|c|c|c|c|c|c|c|c|c|c|}
  \hline
  x \text{ (rad)} & 0 & \frac{\pi}{6} & \frac{\pi}{4} & \frac{\pi}{3} & \frac{\pi}{2} & \pi & \frac{3\pi}{2} & 2\pi \\
  \hline
  x \text{ (deg)} & 0^\circ & 30^\circ & 45^\circ & 60^\circ & 90^\circ & 180^\circ & 270^\circ & 360^\circ \\
  \hline
  \sin(x) & 0 & \frac{1}{2} & \frac{\sqrt{2}}{2} & \frac{\sqrt{3}}{2} & 1 & 0 & -1 & 0 \\
  \hline
  \text{Decimal} & 0 & 0.5 & \approx 0.707 & \approx 0.866 & 1.0 & 0 & -1.0 & 0 \\
  \hline
  \end{array}$$

  ### Desglose simbólico
  - Crecimiento en I C ($0$ a $\frac{\pi}{2}$): $f(x)$ aumenta de $0$ a $1$.
  - Decrecimiento en II C y III C ($\frac{\pi}{2}$ a $\frac{3\pi}{2}$): $f(x)$ disminuye de $1$ a $-1$.
  - Crecimiento en IV C ($\frac{3\pi}{2}$ a $2\pi$): $f(x)$ aumenta de $-1$ a $0$.

  ### Síntesis didáctica
  La tabla de valores muestra la fluidez y simetría de la función seno. Permite comprobar visualmente que la función pasa por el origen $(0,0)$, alcanza su cresta máxima en $\left(\frac{\pi}{2}, 1\right)$ y su valle mínimo en $\left(\frac{3\pi}{2}, -1\right)$.
definiciones_clave: |
  - **Tabla de valores**: Matriz de datos que relaciona cada ángulo en radianes $x$ con su ordenada $y = \sin x$.
  - **Puntos característicos**: Pares ordenados $(0,0)$, $\left(\frac{\pi}{2}, 1\right)$, $(\pi, 0)$, $\left(\frac{3\pi}{2}, -1\right)$ y $(2\pi, 0)$ que estructuran la onda.
  - **Valores aproximados**: Expresiones decimales útiles para ubicar puntos en el gráfico cartesiano.
propiedades_relaciones: |
  - **Simetría cuadrantal**: Los valores absolutos registrados en el primer cuadrante ($\frac{1}{2}, \frac{\sqrt{2}}{2}, \frac{\sqrt{3}}{2}$) se repiten en los demás cuadrantes con sus respectivos signos cartesiano.
  - **Continuidad de tendencia**: La tabla muestra claramente los intervalos de monotonía (crecimiento y decrecimiento).
ejemplo_guiado:
  enunciado: 'Construye los pares ordenados $(x, y)$ de la tabla para los ángulos $x = \frac{\pi}{3}$ y $x = \frac{2\pi}{3}$ y compara sus valores.'
  pasos:
    - 'Paso 1: Evaluar la función en $x = \frac{\pi}{3}$ ($60^\circ$): $\sin\left(\frac{\pi}{3}\right) = \frac{\sqrt{3}}{2}$. Par ordenado: $A\left(\frac{\pi}{3}, \frac{\sqrt{3}}{2}\right)$.'
    - "Paso 2: Evaluar la función en $x = \\frac{2\\pi}{3}$ ($120^\\circ$): ángulo de referencia $x' = \\pi - \\frac{2\\pi}{3} = \\frac{\\pi}{3}$. Como en II C $y > 0 \\implies \\sin\\left(\\frac{2\\pi}{3}\\right) = \\frac{\\sqrt{3}}{2}$. Par ordenado: $B\\left(\\frac{2\\pi}{3}, \\frac{\\sqrt{3}}{2}\\right)$."
    - 'Paso 3: Comparar las ordenadas: ambos pares tienen exactamente la misma altura $y = \frac{\sqrt{3}}{2} \approx 0.866$.'
    - 'Paso 4: Concluir que la gráfica es simétrica con respecto a la recta vertical $x = \frac{\pi}{2}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la tabla de valores de la función seno base $f(x) = \sin x$, ¿cuáles son los pares ordenados de la cresta máxima y del valle mínimo?'
    choices:
      - {text: 'Cresta $\left(\frac{\pi}{2}, 1\right)$ y Valle $\left(\frac{3\pi}{2}, -1\right)$', is_correct: true}
      - {text: 'Cresta $(0, 1)$ y Valle $(\pi, -1)$', is_correct: false}
      - {text: 'Cresta $(\pi, 1)$ y Valle $(2\pi, -1)$', is_correct: false}
      - {text: 'Cresta $\left(\frac{\pi}{4}, 1\right)$ y Valle $\left(\frac{3\pi}{4}, -1\right)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Cresta $\left(\frac{\pi}{2}, 1\right)$ y Valle $\left(\frac{3\pi}{2}, -1\right)$''. Son los puntos extremos característicos de un ciclo completo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la tabla de valores, ¿cuál es el valor numérico de $\sin\left(\frac{\pi}{6}\right)$?'
    choices:
      - {text: '$\frac{1}{2}$', is_correct: true}
      - {text: '$\frac{\sqrt{3}}{2}$', is_correct: false}
      - {text: '$\frac{\sqrt{2}}{2}$', is_correct: false}
      - {text: '$1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{1}{2}$''. $\frac{\pi}{6}$ equivale a $30^\circ$, cuyo seno vale exacto $\frac{1}{2} = 0.5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Listar en la primera fila los ángulos principales en radianes dentro del intervalo deseado.'
  - 'Paso 2: Calcular el valor del seno para cada ángulo usando la definición del círculo unitario.'
  - 'Paso 3: Registrar los resultados en fracciones radicales exactas ($\frac{1}{2}, \frac{\sqrt{2}}{2}, \frac{\sqrt{3}}{2}$).'
  - 'Paso 4: Graficar los puntos $(x, y)$ sobre las coordenadas cartesianas para trazar la curva sinusoide.'
errores_correccion: |
  - **Error 1:** Mezclar la columna de grados sexagesimales directamente en la escala numérica del eje $X$. **Cómo corregirlo:** La variable independiente $x$ para el gráfico funcional debe expresarse obligatoriamente en radianes (números reales continuos).
  - **Error 2:** Asignar $y = 1$ en $x = 0$ al construir la tabla del seno. **Cómo corregirlo:** La función seno comienza en el origen $(0,0)$; la función que inicia en $(0,1)$ es la función coseno.
ejemplos:
  - titulo: 'Par ordenado del punto medio en la tabla'
    enunciado: '¿Cuál es el par ordenado $(x, y)$ de la función seno en $x = \pi$?'
    alternativas:
      - '$(\pi, 0)$'
      - '$(\pi, 1)$'
      - '$(\pi, -1)$'
    respuesta: '$(\pi, 0)$'
    solucion_pasos:
      - '1. $\sin(\pi) = 0$.'
      - '2. El par ordenado en la tabla es $(\pi, 0)$.'
  - titulo: 'Valor para pi cuartos'
    enunciado: '¿Qué valor le corresponde a $x = \frac{\pi}{4}$ en la tabla de la función seno?'
    alternativas:
      - '$\frac{\sqrt{2}}{2}$'
      - '$\frac{1}{2}$'
      - '$\frac{\sqrt{3}}{2}$'
    respuesta: '$\frac{\sqrt{2}}{2}$'
    solucion_pasos:
      - '1. $\frac{\pi}{4} = 45^\circ$.'
      - '2. $\sin\left(\frac{\pi}{4}\right) = \frac{\sqrt{2}}{2} \approx 0.707$.'
  - titulo: 'Cero en dos pi'
    enunciado: '¿La tabla de valores marca $y = 0$ para $x = 2\pi$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al completar un giro de $2\pi$ la altura del seno retorna al valor nulo $y = 0$.'
  - titulo: 'Monotonía en el primer cuadrante'
    enunciado: '¿En la tabla de valores los resultados aumentan continuamente desde $0$ hasta $1$ al pasar de $x = 0$ a $x = \frac{\pi}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $0 < \frac{1}{2} < \frac{\sqrt{2}}{2} < \frac{\sqrt{3}}{2} < 1$, mostrando crecimiento estricto.'
errores_frecuentes:
  - 'La afirmación de que el par ordenado inicial de la función seno es $(0, 1)$.'
  - 'La afirmación de que en $x = \pi$ el valor de la función seno alcanza su punto más bajo de $-1$.'
  - 'La afirmación de que en $x = \frac{\pi}{2}$ la función seno vale cero.'
  - 'La afirmación de que la tabla de valores del seno requiere usar ángulos medidos únicamente en grados sexagesimales.'
  - 'La afirmación de que los valores de la función seno disminuyen en el primer cuadrante.'
afirmaciones_verdaderas:
  - 'La tabla de valores del seno base muestra los puntos clave $(0,0)$, $\left(\frac{\pi}{2}, 1\right)$, $(\pi, 0)$, $\left(\frac{3\pi}{2}, -1\right)$ y $(2\pi, 0)$.'
  - 'Los valores de la función seno aumentan estrictamente en el primer cuadrante de $0$ a $1$ y disminuyen en el segundo cuadrante de $1$ a $0$.'
al_terminar_debes_poder: |
  QUÉ: Construir e interpretar la tabla de valores notables de la función seno $f(x) = \sin x$.
  CÓMO: Asignar a cada ángulo característico $x$ su ordenada $y = \sin x$ para estructurar los pares ordenados de la onda.
