semantic_id: MAT.ALG.VALORIZACION.EXPRESIONES_POTENCIAS
resumen_inicial: La valorización de expresiones con potencias consiste en evaluar potencias algebraicas de la forma $x^n$, $(x+y)^n$ o $a x^n$ sustituyendo la variable y aplicando la jerarquía estricta que exige resolver la potencia antes que el coeficiente multiplicador.
explicacion_simple: "En expresiones algebraicas que contienen **potencias** ($x^n$), debes seguir una regla de oro fundamental:\n- **REGLA DE ORO**: **Las potencias se calculan SIEMPRE ANTES que las multiplicaciones y sumas/restas**.\n- **Casos típicos**:\n  1. **Coeficiente con potencia ($c x^n$)**:\n     - Para $3x^2$ con $x = 4$: Eleva $4^2 = 16$ primero, luego multiplica $3 \\cdot 16 = \\mathbf{48}$.\n  2. **Potencia de una suma/resta ($(x + y)^n$)**:\n     - Para $(x + y)^2$ con $x = 2, y = 3$: Resuelve el paréntesis $(2 + 3) = 5$ primero, luego eleva $5^2 = \\mathbf{25}$.\n  3. **Suma de potencias ($x^n + y^n$)**:\n     - Para $x^2 + y^2$ con $x = 2, y = 3$: Eleva $2^2 = 4$ y $3^2 = 9$, luego suma $4 + 9 = \\mathbf{13}$.\n\n![Valorización de Expresiones con Potencias](/static/img/nodos/valorizacion-de-expresiones-con-potencias-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $E(x_1, \dots, x_k) = \sum c_j P_j(x_1, \dots, x_k)^{n_j}$ una expresión que involucra potencias de exponente entero $n_j \in \mathbb{N}_0$. La valorización bajo la asignación $(c_1, \dots, c_k) \in \mathbb{R}^k$ aplica la función exponencial discreta sobre las bases evaluadas:


  $$\operatorname{ev}(c_j P_j^{n_j}) = c_j \cdot \left[ P_j(c_1, \dots, c_k) \right]^{n_j}$$


  ### Distinción Sintáctica: Base Compuesta vs Coeficiente Escalar

  - **Potencia de expresión entre paréntesis**: $(a x)^n = a^n x^n \implies \operatorname{ev}( (a x)^n ) = a^n c^n$.

  - **Potencia aplicada sólo a la variable**: $a x^n \implies \operatorname{ev}( a x^n ) = a \cdot c^n$.


  ### Propiedad de las Potencias con Exponente Cero

  Para cualquier valor real no nulo asignado a la base $x = c \neq 0$:


  $$x^0 = 1 \implies \operatorname{ev}(a x^0) = a \cdot 1 = a$$


  ### Síntesis didáctica

  La priorización de las potencias en la valorización previene distorsiones numéricas exponenciales en modelos de crecimiento, áreas y energías cinéticas ($E_k = \frac{1}{2} m v^2$).

  '
definiciones_clave: '- **Valorización de potencias**: Cálculo numérico de potencias exponenciales tras sustituir las bases por números constantes.

  - **Prioridad de la potencia**: Regla por la cual el exponente opera sobre la base antes de cualquier multiplicación escalar externa.

  - **Exponente cero ($x^0 = 1$)**: Propiedad por la cual toda base distinta de cero elevada a $0$ resulta igual a $1$.

  '
propiedades_relaciones: '- **Distinción entre $(x+y)^2$ y $x^2+y^2$**: La potencia de una suma requiere sumar antes de elevar, mientras que la suma de potencias requiere elevar antes de sumar.

  - **Independencia de signo en exponentes pares**: $(c)^2 = (-c)^2$, mientras que en impares $(c)^3 = -(-c)^3$.

  '
ejemplo_guiado:
  enunciado: Calcula el valor de la expresión $2(x - 1)^3 + 5x^2$ para $x = -2$.
  pasos:
  - 'Paso 1: Sustituimos $x = -2$ en ambos términos usando paréntesis: $2((-2) - 1)^3 + 5(-2)^2$.'
  - 'Paso 2: Resolvemos la base del primer paréntesis: $(-2 - 1) = -3 \implies 2(-3)^3 + 5(-2)^2$.'
  - 'Paso 3: Calculamos las potencias: $(-3)^3 = -27$ y $(-2)^2 = +4 \implies 2(-27) + 5(4)$.'
  - 'Paso 4: Realizamos las multiplicaciones: $2(-27) = -54$ y $5(4) = +20$.'
  - 'Paso 5: Sumamos los enteros resultantes: $-54 + 20 = -34$.'
  - 'Conclusión: El valor numérico final es **$-34$**.'
  imagen: /static/img/nodos/valorizacion-de-expresiones-con-potencias-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué operación se debe resolver en primer lugar en la expresión $5x^3$ para $x = 2$?
  choices:
  - text: Se debe resolver primero la potencia $2^3 = 8$ y luego multiplicar por $5$
    is_correct: true
  - text: Se debe multiplicar primero $5 \cdot 2 = 10$ y luego elevar al cubo $10^3$
    is_correct: false
  - text: Se debe sumar el coeficiente con el exponente $5 + 3$
    is_correct: false
  - text: Se deben multiplicar los exponentes
    is_correct: false
  explanation: La alternativa correcta es 'Se debe resolver primero la potencia $2^3 = 8$ y luego multiplicar por $5$'. Prioridad de la potencia $x^n$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor numérico de $(x + 3)^2$ para $x = -5$?
  choices:
  - text: El valor es $4$, obtenido al resolver el paréntesis $(-5 + 3) = -2$ y elevar $(-2)^2 = 4$
    is_correct: true
  - text: El valor es $28$
    is_correct: false
  - text: El valor es $-4$
    is_correct: false
  - text: El valor es $34$
    is_correct: false
  explanation: La alternativa correcta es 'El valor es $4$, obtenido al resolver el paréntesis $(-5 + 3) = -2$ y elevar $(-2)^2 = 4$'. Paréntesis primero, luego potencia.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar la variable por su constante entre paréntesis dentro de las potencias.'
- 'Paso 2: Si hay agrupaciones entre paréntesis $(x \pm y)$, resolver la operación interna primero.'
- 'Paso 3: Calcular el valor de cada potencia respetando el exponente.'
- 'Paso 4: Multiplicar los coeficientes externos por los valores de las potencias y sumar los términos.'
errores_correccion: '- **Error 1:** Multiplicar el coeficiente por la variable ANTES de elevar a la potencia (escribir $3 \cdot 2 = 6 \implies 6^3 = 216$ para $3x^3$ con $x=2$). **Cómo corregirlo:** Se debe **elevar a la potencia primero ($2^3 = 8$)** y luego multiplicar ($3 \cdot 8 = 24$).

  - **Error 2:** Escribir $x^2 + y^2$ para la potencia de una suma $(x+y)^2$. **Cómo corregirlo:** En $(x+y)^2$ **se suma PRIMERO dentro del paréntesis** antes de elevar al cuadrado.

  '
ejemplos:
- titulo: Potencia con coeficiente
  enunciado: ¿Cuál es el valor de $4x^3$ para $x = 2$?
  alternativas:
  - $32$
  - $216$
  - $24$
  respuesta: $32$
  solucion_pasos:
  - '1. Potencia: $2^3 = 8$.'
  - '2. Producto: $4 \cdot 8 = 32$.'
- titulo: Potencia de una suma
  enunciado: ¿Cuál es el valor de $(a + b)^3$ para $a = 1$ y $b = 2$?
  alternativas:
  - $27$
  - $9$
  - $15$
  respuesta: $27$
  solucion_pasos:
  - '1. Paréntesis: $(1 + 2) = 3$.'
  - '2. Potencia: $3^3 = 27$.'
- titulo: Exponente cero
  enunciado: Para $x = -8$, ¿es la valorización de $7x^0$ igual a $7 \cdot 1 = 7$?
  respuesta: Sí
  solucion_pasos:
  - Sí, toda base no nula elevada a cero es igual a 1.
- titulo: Diferencia de potencias
  enunciado: ¿Difiere el valor de $(2 + 3)^2 = 25$ del valor de $2^2 + 3^2 = 13$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $25 \neq 13$, demostrando la prioridad del paréntesis.
errores_frecuentes:
- Multiplicar el coeficiente externo por la variable antes de calcular la potencia correspondiente.
- Igualar la valorización de la potencia de una suma (x+y)^2 con la suma de los cuadrados x^2 + y^2.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Declarar que elevar una base distinta de cero a exponente cero resulta igual a cero.
- La resolución de los paréntesis internos no se efectúa antes de aplicar el exponente externo.
afirmaciones_verdaderas:
- En la valorización de expresiones con potencias, las potencias tienen prioridad sobre las multiplicaciones por coeficientes.
- La valorización de una expresión entre paréntesis (x+y)^n exige sumar las variables antes de elevar la base al exponente n.
al_terminar_debes_poder: '![Resumen de valorización de expresiones con potencias](/static/img/nodos/valorizacion-de-expresiones-con-potencias-resumen.svg)


  QUÉ: Evaluar expresiones algebraicas donde las variables actúan como bases o exponentes de potencias.


  CÓMO: Resolver prioritariamente las potencias antes de cualquier multiplicación escalar, respetando que $a \cdot b^n \equiv a \cdot (b^n) \neq (ab)^n$.'
