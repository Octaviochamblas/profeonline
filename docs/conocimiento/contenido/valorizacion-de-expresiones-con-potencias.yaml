semantic_id: MAT.ALG.VALORIZACION.EXPRESIONES_POTENCIAS
resumen_inicial: 'Valorización de expresiones con potencias: traducción, reglas y
  aplicación práctica en Valorización de expresiones algebraicas.'
explicacion_simple: Hasta ahora las letras se mantenían en el suelo. Pero a veces,
  las incógnitas deciden volar y sentarse en el exponente. Esto es el corazón del
  crecimiento exponencial (como las pandemias o el interés compuesto).
explicacion_formal: '### Definición formal


  Mientras que $3x$ para $x=4$ es sumar 3 cuatro veces ($3+3+3+3=12$), el modelo $3^x$
  es multiplicar 3 cuatro veces ($3 \cdot 3 \cdot 3 \cdot 3 = 81$).


  ### Desarrollo didáctico


  Observa la expresión $2^x$.

  Si $x = 3$:

  1. Sustituimos la $x$ en el ''cielo'': $2^{(3)}$.

  2. Esto NO es $2 \cdot 3$. Es una potencia.

  3. Calculamos: $2 \cdot 2 \cdot 2 = 8$.


  Si la expresión es más compleja, como $3^{x+1}$ con $x=1$:

  Primero debes resolver la suma ''en el cielo'' antes de aplicar la potencia.

  - Cielo: $1 + 1 = 2$.

  - Potencia: $3^2 = 9$.'
definiciones_clave: '- **Valorización de expresiones con potencias**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
