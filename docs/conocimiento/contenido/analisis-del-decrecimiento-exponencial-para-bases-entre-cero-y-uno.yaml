errores_frecuentes:
  - 'Dada la función $f(x) = (1/4)^x$, la afirmación de que al avanzar hacia la derecha la gráfica atraviesa el eje X hacia ordenadas negativas.'
  - 'La confusión entre una función exponencial decreciente ($0 < b < 1$) y una función con coeficiente negativo $-b^x$.'
  - 'La afirmación de que los exponentes negativos $x < 0$ hacen que la función decreciente dé resultados cercanos a cero.'
  - 'La afirmación de que el decrecimiento exponencial se detiene al alcanzar el punto del intercepto $(0, 1)$.'
  - 'La afirmación de que elevar una base entre 0 y 1 a exponentes positivos grandes genera indeterminación.'
afirmaciones_verdaderas:
  - 'Si la base satisface $0 < b < 1$, la función exponencial $f(x) = b^x$ es estrictamente decreciente en todo su dominio real.'
  - 'En el decrecimiento exponencial ($0 < b < 1$), el eje X de ecuación $y = 0$ opera como asíntota horizontal cuando $x \to +\infty$.'
al_terminar_debes_poder: |
  QUÉ: Caracterizar y graficar el decrecimiento exponencial para bases $0 < b < 1$.
  CÓMO: Verificar $0 < b < 1$, describir el descenso desde $+\infty$ por la izquierda y la aproximación asintótica a $y = 0^+$ hacia $+\infty$.
