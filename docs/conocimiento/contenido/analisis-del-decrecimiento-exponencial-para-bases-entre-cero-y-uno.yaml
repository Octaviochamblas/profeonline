semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.DECRECIMIENTO_BASE_ENTRE_CERO_UNO
resumen_inicial: El decrecimiento exponencial ocurre cuando la base cumple $0 < b < 1$, provocando que la curva descienda asintóticamente hacia el eje X.
explicacion_simple: |
  Cuando la base de una función exponencial es un **número positivo menor que uno ($0 < b < 1$)**, como $b = 0.5 = 1/2$, $b = 0.1$ o $b = 3/4$, la función experimenta un **decrecimiento o decaimiento exponencial**:

  - **Por la izquierda ($x \to -\infty$)**: La curva viene desde valores muy altos en el infinito positivo ($+\infty$).
  - **En el centro ($x = 0$)**: Pasa por el punto $(0, a)$.
  - **Por la derecha ($x \to +\infty$)**: La gráfica **cae rípidamente y se aproxima al eje X ($y = 0$)**, sin llegar nunca a tocarlo.
explicacion_formal: |
  Dada la función exponencial $f(x) = a \cdot b^x$ sobre $\mathbb{R}$ con $a > 0$ y $0 < b < 1$, la condición $b \in ]0, 1[$ dicta la **estricta monotonía decreciente** de la función:

  **Propiedades analíticas del decrecimiento exponencial ($0 < b < 1$):**
  1. **Monotonía Decreciente:**
     $$\forall x_1, x_2 \in \mathbb{R}, \, x_1 < x_2 \implies b^{x_1} > b^{x_2}$$
  2. **Comportamiento Asintótico y Limítrofe:**
     $$\lim_{x \to -\infty} f(x) = +\infty \quad \text{y} \quad \lim_{x \to +\infty} f(x) = 0^+$$
  3. **Tasa de Variación Negativa:** Como $\ln(b) < 0$ para $0 < b < 1$, la derivada primera $f'(x) = a \cdot \ln(b) \cdot b^x < 0$ es estrictamente negativa para todo $x$.
definiciones_clave: |
  - **Decrecimiento exponencial**: Comportamiento de una función $f(x) = a \cdot b^x$ con $0 < b < 1$ caracterizado por una disminución continua y desacelerada hacia cero a medida que $x$ aumenta.
propiedades_relaciones: |
  - **Transformación de simetría**: Una función decreciente $f(x) = (1/b)^x$ con $b > 1$ es algebraicamente equivalente a $g(x) = b^{-x}$, representando una reflexión horizontal respecto del eje Y de la función creciente $b^x$.
ejemplo_guiado:
  enunciado: 'Analiza el decrecimiento de la función $f(x) = (1/2)^x$ evaluando en $x = -2$, $x = 0$, $x = 1$ y $x = 3$.'
  pasos:
    - 'Paso 1: Identificar la base $b = 1/2 = 0.5$. Como $0 < 0.5 < 1$, la función es decreciente.'
    - 'Paso 2: Evaluar en $x = -2 \implies f(-2) = (1/2)^{-2} = 2^2 = 4$.'
    - 'Paso 3: Evaluar en $x = 0 \implies f(0) = (1/2)^0 = 1$.'
    - 'Paso 4: Evaluar en $x = 1 \implies f(1) = 0.5$ y en $x = 3 \implies f(3) = (1/2)^3 = 1/8 = 0.125$. Observar cómo las ordenadas bajan de 4 a 1, luego a 0.5 y a 0.125.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para la función exponencial $f(x) = (0.2)^x$, ¿cuál es el límite del valor de $y$ cuando $x$ se dirige hacia el infinito positivo ($x \to +\infty$)?'
    choices:
      - {text: 'El valor de $y$ se aproxima a cero ($y \to 0^+$)', is_correct: true}
      - {text: 'El valor de $y$ crece sin límite hacia $+\infty$.', is_correct: false}
      - {text: 'El valor de $y$ se vuelve negativo.', is_correct: false}
      - {text: 'El valor de $y$ se estabiliza en $y = 0.2$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor de $y$ se aproxima a cero ($y \to 0^+$)''. Al ser $0 < 0.2 < 1$, la asíntota $y=0$ actúa a la derecha.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Por qué la función $g(x) = 3^{-x}$ es una función exponencial decreciente?'
    choices:
      - {text: 'Porque $3^{-x}$ equivale a $(1/3)^x$, cuya base satisface $0 < 1/3 < 1$', is_correct: true}
      - {text: 'Porque la base 3 es un número impar.', is_correct: false}
      - {text: 'Porque el exponente negativo cambia el signo del resultado a negativo.', is_correct: false}
      - {text: 'Porque interseca al eje Y en un punto negativo.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque $3^{-x}$ equivale a $(1/3)^x$, cuya base satisface $0 < 1/3 < 1$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la constante de la base $b$ en la expresión $f(x) = a \cdot b^x$.'
  - 'Paso 2: Comprobar que la base se encuentre estrictamente en el intervalo abierto $0 < b < 1$.'
  - 'Paso 3: Verificar que el coeficiente $a > 0$ mantenga la función en el semiplano superior.'
  - 'Paso 4: Trazar o describir la curva viniendo de $+\infty$ por la izquierda y aproximándose asintóticamente a $y = 0$ por la derecha.'
errores_correccion: |
  - **Error común:** Creer que porque la función decrece, las ordenadas $y$ se vuelven negativas.
  - **Cómo corregirlo:** La función decrece pero **NUNCA PASA ABAJO DEL EJE X**: las ordenadas disminuyen haciéndose cada vez más pequeñas pero se mantienen estrictamente **POSITIVAS ($y > 0$)**.
