semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.DECRECIMIENTO_BASE_ENTRE_CERO_UNO
resumen_inicial: El análisis del decaimiento exponencial para bases entre cero y uno ($0 < b < 1$) demuestra que la función $f(x) = b^x$ es estrictamente decreciente y convexa en todo $\mathbb{R}$, divergiendo a $+\infty$ hacia $-\infty$ y aproximándose asintóticamente a $y = 0$ hacia $+\infty$.
explicacion_simple: "![El análisis del decaimiento exponencial para bases entre cero y uno ($0 < b < 1$) demuestra que la función $f(x) = b^x$ es estrictamente decreciente y convexa en todo $\\mathbb{R}$, divergiendo a $+\\infty$ hacia $-\\infty$ y aproximándose asintóticamente a $y = 0$ hacia $+\\infty$](/static/img/nodos/analisis-del-decrecimiento-exponencial-para-bases-entre-cero-y-uno-intro.svg)\n\n\nCuando la base es una **fracción propia entre 0 y 1** (como $(0,5)^x, (1/3)^x, (0,8)^x$), la función describe un **decaimiento exponencial**:\n\n- **¿Cómo es su recorrido de izquierda a derecha?**\n  - A la **izquierda** ($x$ negativo): Proviene de alturas gigantescas hacia $+\\infty$ (ej: $(0,5)^{-4} = 2^4 = 16$).\n  - En el **centro** ($x = 0$): Cruza por el punto canónico **$(0, 1)$**.\n  - A la **derecha** ($x$ positivo): Cae progresivamente acercándose al piso ($y = 0$) como una asíntota horizontal ($\\searrow$).\n- **Relación espejo:** La curva de $(1/2)^x$ es exactamente el reflejo\
  \ de $2^x$ mirando a través del espejo del eje vertical $Y$."
explicacion_formal: "Sea $f: \\mathbb{R} \\to \\mathbb{R}^+$ con $f(x) = b^x$ y $0 < b < 1$. Haciendo $b = \\frac{1}{B}$ con $B > 1$:\n$$f(x) = \\left(\\frac{1}{B}\\right)^x = B^{-x}$$\n\n**Propiedades analíticas de decaimiento**:\n1. **Monotonía estrictamente decreciente**: Como $\\ln(b) < 0$, la derivada $f'(x) = b^x \\ln(b) < 0$ para todo $x \\in \\mathbb{R}$, lo que implica $x_1 < x_2 \\implies b^{x_1} > b^{x_2}$.\n2. **Convexidad estricta**: $f''(x) = b^x (\\ln(b))^2 > 0$ en todo $\\mathbb{R}$.\n3. **Límites en el infinito**:\n   $$\\lim_{x \\to +\\infty} b^x = 0 \\implies \\mathcal{A}_H: y = 0 \\quad \\land \\quad \\lim_{x \\to -\\infty} b^x = +\\infty$$"
definiciones_clave: '- **Decaimiento asintótico**: Proceso donde la variable dependiente se extingue exponencialmente sin cruzar jamás la cota cero.

  - **Reflexión par-impar funcional**: Transformación $x \mapsto -x$ que vincula bases inversas $b^x$ y $(1/b)^x$.'
propiedades_relaciones: '- **Simetría axial respecto al eje Y**: Las gráficas de $y = b^x$ e $y = (1/b)^x$ son imágenes especulares mutuamente reflejadas respecto a la recta $x = 0$.

  - **No anulación**: Para cualquier $x \in \mathbb{R}$, $b^x > 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis del decaimiento exponencial para bases entre cero y uno ($0 < b < 1$) demuestra que la función $f(x) = b^x$ es estrictamente decreciente y convexa en todo $\mathbb{R}$, divergiendo a $+\infty$ hacia $-\infty$ y aproximándose asintóticamente a $y = 0$ hacia $+\infty$](/static/img/nodos/analisis-del-decrecimiento-exponencial-para-bases-entre-cero-y-uno-ejemplos.svg)



    Analiza la función $f(x) = (0{,}5)^x$, evalúa en $x = -2, 0, 2$ y demuestra que es estrictamente decreciente con asíntota en $+\infty$.'
  pasos:
  - 'Paso 1: Evaluar en $x = -2$: $f(-2) = (0{,}5)^{-2} = \left(\frac{1}{2}\right)^{-2} = 2^2 = 4$.'
  - 'Paso 2: Evaluar en $x = 0$: $f(0) = (0{,}5)^0 = 1$.'
  - 'Paso 3: Evaluar en $x = 2$: $f(2) = (0{,}5)^2 = 0{,}25 = \frac{1}{4}$.'
  - 'Paso 4: Comprobar la monotonía:

    - Como $-2 < 0 < 2$ y $4 > 1 > 0{,}25$, la función es **estrictamente decreciente**.'
  - 'Paso 5: Límite: $\lim_{x \to +\infty} (0{,}5)^x = 0 \implies$ asíntota horizontal $y = 0$ hacia $+\infty$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la función de decaimiento f(x) = (1/4)ˣ, ¿hacia dónde se encuentra su asíntota horizontal y = 0?
  choices:
  - text: Hacia el infinito positivo (x → +∞)
    is_correct: true
  - text: Hacia el infinito negativo (x → -∞)
    is_correct: false
  - text: En x = 1/4
    is_correct: false
  - text: No tiene asíntota
    is_correct: false
  explanation: La alternativa correcta es 'Hacia el infinito positivo (x → +∞)'. Al ser $b = 1/4 < 1$, cuando $x \to +\infty$, $(1/4)^x \to 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué relación geométrica existe entre las gráficas de y = 3ˣ e y = (1/3)ˣ?
  choices:
  - text: Son simétricas respecto del eje Y (reflexión horizontal)
    is_correct: true
  - text: Son simétricas respecto del eje X
    is_correct: false
  - text: Son rectas paralelas
    is_correct: false
  - text: Son idénticas
    is_correct: false
  explanation: La alternativa correcta es 'Son simétricas respecto del eje Y (reflexión horizontal)'. Como $(1/3)^x = 3^{-x} = f(-x)$, representa una reflexión respecto al eje vertical.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la base pertenezca al intervalo $0 < b < 1$.'
- 'Paso 2: Establecer que la función es estrictamente decreciente ($\searrow$) en todo $\mathbb{R}$.'
- 'Paso 3: Marcar el punto de intersección $(0, 1)$.'
- 'Paso 4: Trazar la curva descendente que proviene de $+\infty$ por la izquierda y se aplasta contra $y = 0$ por la derecha.'
errores_correccion: '- **Error común:** Pensar que $(0,5)^x$ se vuelve negativa para valores grandes de $x$.

  - **Cómo corregirlo:** Una potencia de base positiva **siempre da un número positivo ($> 0$)**; se aproxima a cero pero jamás lo cruza.'
ejemplos:
- titulo: 'Ejemplo 1: Base fraccionaria decreciente'
  enunciado: ¿Cuál de las siguientes funciones es estrictamente decreciente?
  alternativas:
  - f(x) = (2/3)ˣ
  - f(x) = (3/2)ˣ
  - f(x) = 2ˣ
  - f(x) = (1,05)ˣ
  respuesta: f(x) = (2/3)ˣ
  solucion_pasos:
  - 'Paso 1: $2/3 \approx 0{,}67 \in ]0, 1[ \implies$ decreciente.'
- titulo: 'Ejemplo 2: Evaluación en exponente positivo grande'
  enunciado: En $g(x) = (0{,}1)^x$, ¿a qué valor tiende cuando $x \to +\infty$?
  alternativas:
  - '0'
  - +infinito
  - -infinito
  - 0,1
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $\lim_{x \to +\infty} (0{,}1)^x = 0$.'
- titulo: 'Ejemplo 3: Reflexión de base inversa'
  enunciado: 'La gráfica de $f(x) = 5^{-x}$ es equivalente a:'
  alternativas:
  - g(x) = (1/5)ˣ
  - g(x) = -5ˣ
  - g(x) = (-5)ˣ
  - g(x) = 5ˣ - 1
  respuesta: g(x) = (1/5)ˣ
  solucion_pasos:
  - 'Paso 1: $5^{-x} = (5^{-1})^x = (1/5)^x$.'
- titulo: 'Ejemplo 4: Comportamiento en x negativo'
  enunciado: Para $x = -3$, ¿cuánto vale $f(x) = (1/2)^x$?
  alternativas:
  - '8'
  - 1/8
  - '-8'
  - -1/8
  respuesta: '8'
  solucion_pasos:
  - 'Paso 1: $(1/2)^{-3} = 2^3 = 8$.'
errores_frecuentes:
- Creer que las funciones con 0 < b < 1 cruzan al semiplano inferior y < 0.
- Confundir la base 3/2 (que es 1,5 > 1, creciente) con una base decreciente.
- Asumir que la asíntota horizontal está en -infinito en vez de +infinito.
afirmaciones_verdaderas:
- Para 0 < b < 1, la función f(x) = bˣ es estrictamente decreciente en todo ℝ.
- La gráfica de una función con 0 < b < 1 tiene asíntota horizontal y = 0 hacia +∞.
al_terminar_debes_poder: '**QUÉ:** Analizar y caracterizar el decaimiento exponencial para bases 0 < b < 1.


  **CÓMO:** Demostrando su monotonía decreciente y su comportamiento asintótico hacia +∞.


