      - 'Función discontinua en x = 0'
    respuesta: 'Función decreciente, 0 < 0.75 < 1, asíntota y = 0 a la derecha'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Decrecimiento en exponente opuesto.
