semantic_id: MAT.GEO.TRIANGULOS_NOTABLES_METRICA.IDENTIFICACION_45_45_90
resumen_inicial: 'El triángulo notable $45^\circ-45^\circ-90^\circ$ es el triángulo rectángulo isósceles formado por la mitad de un cuadrado, caracterizado por tener catetos de igual longitud ($a = b = k$).'
explicacion_simple: |
  ![Triángulo Notable 45°-45°-90°: Rectángulo Isósceles](/static/img/nodos/identificacion-de-un-triangulo-notable-45-45-90-a-partir-de-sus-angulos-intro.svg)

  Es la mitad de una baldosa cuadrada cortada por la diagonal: sus dos catetos miden lo mismo y sus dos esquinas agudas son de $45^\circ$.
explicacion_formal: |
  ### Definición y teorema formal
  En el plano euclidiano $\mathbb{R}^2$, un triángulo rectángulo $\Delta ABC$ es **notable $45^\circ-45^\circ-90^\circ$** si y solo si sus ángulos interiores satisfacen:

  $$\{\alpha, \beta, \gamma\} = \{45^\circ, 45^\circ, 90^\circ\}$$

  Por el teorema de los ángulos en la base del triángulo isósceles:

  $$\alpha = \beta = 45^\circ \iff \overline{AC} \cong \overline{BC} \iff a = b = k$$

  ### Desglose simbólico y geométrico
  - $a = b = k$: Longitud común de los dos catetos ortogonales.
  - $c$: Hipotenusa opuesta al ángulo recto de $90^\circ$.
  - Deducción de la hipotenusa por Pitágoras:

  $$c^2 = a^2 + b^2 = k^2 + k^2 = 2k^2 \implies c = k\sqrt{2}$$

  - Eje de simetría: La bisectriz del ángulo de $90^\circ$ coincide con la transversal de gravedad, la altura y la mediatriz de la hipotenusa, midiendo $h_c = \frac{k\sqrt{2}}{2} = \frac{c}{2}$.

  ### Síntesis didáctica
  El triángulo $45^\circ-45^\circ-90^\circ$ es la estructura base de las diagonales en polígonos regulares y en las razones trigonométricas fundamentales ($\sin 45^\circ = \cos 45^\circ = \frac{\sqrt{2}}{2}$, $\tan 45^\circ = 1$).
definiciones_clave: |
  - **Triángulo notable**: Triángulo rectángulo con ángulos fijos cuyas proporciones entre lados son constantes conocidas.
  - **Triángulo 45°-45°-90°**: Rectángulo isósceles de lados proporcionales a $1 : 1 : \sqrt2$.
  - **Triángulo 30°-60°-90°**: Semi-equilátero de lados proporcionales a $1 : \sqrt3 : 2$.
  - **Factor de escala ($k$)**: Constante multiplicativa lineal que define las dimensiones reales de los lados.
propiedades_relaciones: |
  - **Proporción 45-45-90**: $a = k, \ b = k, \ c = k\sqrt2$.
  - **Proporción 30-60-90**: $a = k \ (30^\circ), \ b = k\sqrt3 \ (60^\circ), \ c = 2k \ (90^\circ)$.
  - **Invarianza angular**: Los ángulos permanecen constantes al cambiar el factor de escala $k$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Triángulo Notable 45°-45°-90°: Rectángulo Isósceles](/static/img/nodos/identificacion-de-un-triangulo-notable-45-45-90-a-partir-de-sus-angulos-ejemplos.svg)

    Aplica la proporción del triángulo notable y el factor de escala $k$ para determinar las medidas lineales incógnitas.
  pasos:
  - 'Paso 1: Identificar el tipo de triángulo notable a partir de sus ángulos ($45^\circ-45^\circ-90^\circ$ o $30^\circ-60^\circ-90^\circ$).'
  - 'Paso 2: Escribir la terna proporcional base ($1 : 1 : \sqrt2$ o $1 : \sqrt3 : 2$).'
  - 'Paso 3: Igualar la medida conocida a su término homólogo para hallar el factor de escala $k$.'
  - 'Paso 4: Multiplicar los demás términos de la terna por $k$ y racionalizar si es necesario.'
  - 'Paso 5: Registrar los valores finales acompañados de su unidad métrica.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las medidas de los ángulos interiores de un triángulo rectángulo isósceles?
  choices:
  - text: $45^\circ, 45^\circ \text{ y } 90^\circ$
    is_correct: true
  - text: Opción incorrecta de prueba A
    is_correct: false
  - text: Opción incorrecta de prueba B
    is_correct: false
  - text: Opción incorrecta de prueba C
    is_correct: false
  explanation: 'Las medidas son $45^\circ, 45^\circ \text{ y } 90^\circ$, ya que al tener dos lados congruentes los ángulos agudos miden $(180^\circ - 90^\circ)/2 = 45^\circ$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo rectángulo tiene un ángulo de 45°, ¿cuánto mide el otro ángulo agudo?
  choices:
  - text: $45^\circ$
    is_correct: true
  - text: $10\text{ cm}$
    is_correct: false
  - text: $100\text{ cm}$
    is_correct: false
  - text: $5\text{ cm}$
    is_correct: false
  explanation: 'Mide $45^\circ$, porque la suma de los ángulos agudos en todo triángulo rectángulo debe ser $90^\circ$ ($90^\circ - 45^\circ = 45^\circ$).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer los ángulos interiores del triángulo rectángulo notable.'
- 'Paso 2: Determinar si el patrón corresponde a $1 : 1 : \sqrt2$ o $1 : \sqrt3 : 2$.'
- 'Paso 3: Despejar el factor de escala $k$ a partir del lado dato.'
- 'Paso 4: Calcular los lados incógnitos multiplicando el factor $k$ por las razones canónicas.'
- 'Paso 5: Verificar la consistencia mediante el Teorema de Pitágoras $a^2 + b^2 = c^2$.'
errores_correccion: 'Ubica con cuidado el ángulo de 30°: el cateto menor $k$ siempre se opone a 30°, mientras que el cateto mediano $k\sqrt3$ se opone a 60°.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la medida del lado calculada a partir de las proporciones del triángulo notable?
  alternativas:
  - '$45^\circ$'
  - 'Valor incorrecto 1'
  - 'Valor incorrecto 2'
  respuesta: '$45^\circ$'
  solucion_pasos:
  - 'Mide $45^\circ$, porque la suma de los ángulos agudos en todo triángulo rectángulo debe ser $90^\circ$ ($90^\circ - 45^\circ = 45^\circ$).'
- titulo: Ejemplo 2
  enunciado: ¿En un triángulo 30°-60°-90°, el cateto opuesto a 30° es la mitad de la hipotenusa?
  alternativas:
  - Sí, siempre es exactamente la mitad de la hipotenusa
  - No, es igual a la hipotenusa multiplicada por raíz de 3
  - Solo si el triángulo es equilátero
  respuesta: Sí, siempre es exactamente la mitad de la hipotenusa
  solucion_pasos:
  - 'En la terna $k : k\sqrt3 : 2k$, el cateto opuesto a $30^\circ$ es $k$, que equivale exactamente a la mitad de la hipotenusa $2k$.'
- titulo: ¿En el triángulo 45°-45°-90° los dos catetos tienen siempre la misma longitud?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, por ser un triángulo rectángulo isósceles, ambos catetos son congruentes ($a = b = k$).'
- titulo: ¿La hipotenusa en el triángulo 45°-45°-90° es igual al cateto multiplicado por √3?
  respuesta: 'No'
  solucion_pasos:
  - 'No, en el triángulo 45-45-90 la hipotenusa es $k\sqrt2$. El factor $\sqrt3$ corresponde al cateto opuesto a $60^\circ$ en el triángulo 30-60-90.'
errores_frecuentes:
- 'Invertir la posición de $k$ y $k\sqrt{3}$ en el triángulo 30-60-90.'
- 'Usar $\sqrt{3}$ en el triángulo 45-45-90 en vez de $\sqrt{2}$.'
- 'Olvidar que la hipotenusa en el triángulo 30-60-90 es $2k$ (el doble del cateto menor).'
- 'No racionalizar denominadores como $\frac{10}{\sqrt{2}} = 5\sqrt{2}$.'
- 'Confundir las razones trigonométricas con las longitudes escaladas.'
afirmaciones_verdaderas:
- 'En el triángulo 45°-45°-90°, la hipotenusa es igual al cateto multiplicado por $\sqrt{2}$ ($c = k\sqrt{2}$).'
- 'En el triángulo 30°-60°-90°, el cateto menor opuesto a 30° es la mitad de la hipotenusa ($a = c/2$).'
al_terminar_debes_poder: |
  **QUÉ:** Identificar y calcular lados en triángulos notables $45^\circ-45^\circ-90^\circ$ y $30^\circ-60^\circ-90^\circ$.

  **CÓMO:** Aplicando las ternas canónicas $1 : 1 : \sqrt{2}$ y $1 : \sqrt{3} : 2$ y multiplicando por el factor de escala $k$.

