semantic_id: MAT.GEO.CIRCULO_RECTAS.PUNTO_TANGENCIA
resumen_inicial: 'Identificación del punto de tangencia entre una recta tangente y
  una circunferencia: conceptos, teoremas, propiedades geométricas y cálculo en Circunferencia
  y Círculo.'
explicacion_simple: Toda recta tangente tiene un punto característico y único que
  merece un nombre específico, dado su rol central en esta relación geométrica.
explicacion_formal: '![Punto de tangencia](/static/img/geometria/circunferencia-circulo/circulo-punto-tangencia.svg)


  ### Definición formal


  Si $L$ es tangente a una circunferencia de centro $O$, el punto de tangencia $T$
  es el único punto que pertenece tanto a $L$ como a la circunferencia.


  ### Desarrollo didáctico


  El punto de tangencia es también el punto de la circunferencia más cercano a la
  recta tangente (de hecho, es el único punto de la circunferencia que realmente toca
  la recta); todos los demás puntos de la circunferencia están a una distancia mayor
  de la recta.'
definiciones_clave: '- **Identificación del punto de tangencia entre una recta tangente
  y una circunferencia**: Elemento o propiedad fundamental en el estudio de circunferencia
  y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del punto de tangencia entre
  una recta tangente y una circunferencia.'
