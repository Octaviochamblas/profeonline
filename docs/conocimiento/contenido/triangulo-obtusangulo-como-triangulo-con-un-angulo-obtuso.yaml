semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.OBTUSANGULO
resumen_inicial: Un triángulo obtusángulo es aquel que posee exactamente un ángulo
  interior obtuso (mayor a 90° y menor a 180°), lo que determina que sus otros dos
  ángulos sean agudos y sumen menos de 90°.
explicacion_simple: '![Triángulo Obtusángulo](/static/img/nodos/triangulo-obtusangulo-como-triangulo-con-un-angulo-obtuso-intro.svg)


  Un **triángulo obtusángulo** es un triángulo "abierto" o inclinado que tiene **una
  esquina muy abierta que mide más de $90^\circ$** (por ejemplo $110^\circ$ o $130^\circ$).
  Como esa esquina consume la mayor parte de los $180^\circ$, las otras dos esquinas
  son pequeñas y afiladas (agudas).'
explicacion_formal: '### Definición formal

  Un triángulo $\Delta ABC$ es **obtusángulo** si posee exactamente un ángulo interior
  obtuso (estrictamente mayor que $90^\circ$ y menor que $180^\circ$):


  $$\Delta ABC \text{ es obtusángulo} \iff \exists \, \theta \in \{\alpha, \beta,
  \gamma\}, \; 90^\circ < \theta < 180^\circ$$


  $$\gamma > 90^\circ \implies c^2 > a^2 + b^2 \quad (\text{con } c \text{ el lado
  mayor})$$


  ### Desglose simbólico y geométrico

  - Unicidad del obtuso: Es imposible tener más de un ángulo obtuso porque la suma
  excedería los $180^\circ$.

  - Puntos notables exteriores: Tanto el ortocentro $H$ como el circuncentro $O$ se
  ubican en el exterior del triángulo.


  ### Síntesis didáctica

  Los triángulos obtusángulos caracterizan aberturas amplias y requieren el trazado
  de alturas y simetrales sobre las prolongaciones exteriores de sus lados.'
definiciones_clave: '- **Triángulo obtusángulo**: Triángulo con exactamente un ángulo
  interior obtuso ($> 90^\circ$).

  - **Ángulo obtuso**: Ángulo con medida en el intervalo $(90^\circ, 180^\circ)$.

  - **Criterio métrico obtusángulo**: $a^2 + b^2 < c^2$ (donde $c$ es el lado de mayor
  longitud). '
propiedades_relaciones: '- **Ortocentro y circuncentro exteriores**: En todo triángulo
  obtusángulo, tanto el ortocentro como el circuncentro se sitúan estrictamente en
  la región exterior del triángulo.

  - **Compatibilidad con lados**: Puede ser isósceles (ej: $120^\circ, 30^\circ, 30^\circ$)
  o escaleno (ej: $100^\circ, 35^\circ, 45^\circ$). No puede ser equilátero. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Triángulo Obtusángulo](/static/img/nodos/triangulo-obtusangulo-como-triangulo-con-un-angulo-obtuso-ejemplos.svg)


    En un triángulo $\\triangle ABC$, dos de sus ángulos interiores miden $28^\circ$
    y $37^\circ$. Determina la medida del tercer ángulo y clasifica el triángulo según
    sus ángulos.'
  pasos:
  - 'Paso 1: Sumar los dos ángulos conocidos: $28^\circ + 37^\circ = 65^\circ$.'
  - 'Paso 2: Calcular el tercer ángulo interior: $\gamma = 180^\circ - 65^\circ =
    115^\circ$.'
  - 'Paso 3: Analizar la medida del ángulo mayor: como $115^\circ > 90^\circ$, es
    un ángulo obtuso.'
  - 'Paso 4: Clasificar el triángulo como **triángulo obtusángulo**.'
  - 'Paso 5: Como los tres ángulos son distintos ($28^\circ \neq 37^\circ \neq 115^\circ$),
    es un triángulo obtusángulo escaleno.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos ángulos obtusos puede tener como máximo cualquier triángulo plano?
  choices:
  - text: Exactamente uno como máximo (porque dos sumarían más de 180°)
    is_correct: true
  - text: Dos ángulos obtusos
    is_correct: false
  - text: Tres ángulos obtusos
    is_correct: false
  - text: Ninguno obligatoriamente
    is_correct: false
  explanation: Por el teorema de suma 180°, puede tener exactamente uno como máximo
    (porque dos sumarían más de 180°).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo tiene lados de 3 cm, 5 cm y 7 cm, ¿cómo se clasifica según
    sus ángulos?
  choices:
  - text: Triángulo obtusángulo (porque 3^2 + 5^2 = 34 < 7^2 = 49)
    is_correct: true
  - text: Triángulo acutángulo
    is_correct: false
  - text: Triángulo rectángulo
    is_correct: false
  - text: Triángulo equilátero
    is_correct: false
  explanation: Aplicando el criterio métrico, es un triángulo obtusángulo (porque
    3^2 + 5^2 = 34 < 7^2 = 49).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar o calcular los tres ángulos interiores.'
- 'Paso 2: Verificar si existe un ángulo cuya medida sea estrictamente mayor a $90^\circ$.'
- 'Paso 3: Si existe dicho ángulo, clasificar inmediatamente como triángulo obtusángulo.'
errores_correccion: 'No creas que un triángulo obtusángulo no puede ser isósceles:
  el triángulo con ángulos 120°, 30° y 30° es a la vez obtusángulo e isósceles.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un triángulo tiene ángulos de $105^\circ, 40^\circ$ y $35^\circ$,
    ¿cómo se clasifica?
  alternativas:
  - Triángulo obtusángulo
  - Triángulo acutángulo
  - Triángulo rectángulo
  respuesta: Triángulo obtusángulo
  solucion_pasos:
  - Tiene un ángulo de $105^\circ > 90^\circ$, por lo que es obtusángulo.
- titulo: Ejemplo 2
  enunciado: ¿Puede un triángulo ser isósceles y obtusángulo al mismo tiempo?
  alternativas:
  - Sí, por ejemplo con ángulos de 110°, 35° y 35°
  - No, los isósceles solo son acutángulos
  - No, porque tendrían dos ángulos obtusos
  respuesta: Sí, por ejemplo con ángulos de 110°, 35° y 35°
  solucion_pasos:
  - Tiene dos ángulos basales iguales de $35^\circ$ y un ángulo obtuso principal de
    $110^\circ$.
- titulo: ¿Un triángulo con un ángulo de 95° es obtusángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $95^\circ > 90^\circ$ califica como ángulo obtuso.
- titulo: ¿Un triángulo puede tener dos ángulos obtusos?
  respuesta: 'No'
  solucion_pasos:
  - No, dos ángulos mayores a 90° superarían los 180° permitidos.
errores_frecuentes:
- Intentar construir un triángulo con dos ángulos mayores a 90°.
- Confundir el criterio de clasificación por lados con el de ángulos.
- Asumir que el lado opuesto al ángulo obtuso puede ser menor que los otros lados.
- Creer que el ortocentro de un obtusángulo queda dentro de la figura (queda afuera).
- Confundir ángulo obtuso con ángulo reflejo o cóncavo (> 180°).
afirmaciones_verdaderas:
- Un triángulo obtusángulo tiene exactamente un ángulo interior mayor a $90^\circ$.
- El lado opuesto al ángulo obtuso es estrictamente el lado de mayor longitud.
al_terminar_debes_poder: '**QUÉ:** Identificar, definir y clasificar triángulos obtusángulos.


  **CÓMO:** Verificando la presencia de un ángulo interior $> 90^\circ$ o aplicando
  el criterio métrico $a^2 + b^2 < c^2$.


  ![Resumen de Triángulo Obtusángulo](/static/img/nodos/triangulo-obtusangulo-como-triangulo-con-un-angulo-obtuso-resumen.svg)'
