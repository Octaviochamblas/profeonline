semantic_id: MAT.ALG.EC_CUADR_MODELO.SELECCION_RAIZ_VALIDA
resumen_inicial: La selección de la raíz válida discrimina entre las dos soluciones algebraicas $x_1, x_2$ aquella que satisface el dominio físico o contextual del problema.
explicacion_simple: |
  Una ecuación cuadrática siempre entrega **dos soluciones matemáticas** en su resolución. Sin embargo, en los problemas aplicados:

  - **Contexto de Edades**: Una edad no puede ser un número negativo (ej. si obtienes $x_1 = 15$ y $x_2 = -3$, la edad es solo $15$ años).
  - **Contexto de Tiempo**: El tiempo transcurrido desde un evento no puede ser negativo ($t \ge 0$).
  - **Contexto de Cantidad de Personas**: La cantidad de objetos o personas debe ser un número entero positivo ($n \in \mathbb{Z}^+$).
  - **Regla de oro**: **REVISA SIEMPRE SI LAS RAÍCES TIENEN SENTIDO EN EL MUNDO REAL** antes de marcar la respuesta final.
explicacion_formal: |
  Sea $S_{alg} = \{x_1, x_2\}$ el conjunto solución algebraico obtenido de resolver $ax^2 + bx + c = 0$, y sea $D_{ctx} \subset \mathbb{R}$ el dominio de definición impuesto por el contexto de aplicación (físico, geométrico o socioeconómico). El **operador de selección contextual** define el conjunto solución real válido $S_{val}$ como la intersección:

  $$S_{val} = S_{alg} \cap D_{ctx}$$

  **Tipologías de dominios de restricción $D_{ctx}$:**
  - **Magnitudes Geométricas / Físicas:** $D_{ctx} = \{x \in \mathbb{R} \mid x > 0\}$.
  - **Contadores Discretos:** $D_{ctx} = \{x \in \mathbb{Z} \mid x \ge 1\}$.
  - **Dominio Temporal Positivo:** $D_{ctx} = \{t \in \mathbb{R} \mid t \ge 0\}$.
definiciones_clave: |
  - **Selección de raíz válida**: Criterio de validación contextual que descarta soluciones algebraicas reales que contradicen las restricciones físicas o de definición del enunciado.
propiedades_relaciones: |
  - **Soluciones extrañas contextuales**: Raíces matemáticas perfectas de la ecuación cuadrática que quedan invalidadas por pertenecer fuera del dominio del problema real.
ejemplo_guiado:
  enunciado: 'Al resolver la ecuación que modela el número de personas en una excursión se obtienen las raíces $n_1 = 18$ y $n_2 = -2.5$. ¿Cuál es la respuesta válida?'
  pasos:
    - 'Paso 1: Identificar las restricciones del contexto: el número de personas debe ser un entero positivo ($n \in \mathbb{Z}^+$).'
    - 'Paso 2: Evaluar $n_1 = 18$: es entero positivo ($18 \in \mathbb{Z}^+$).'
    - 'Paso 3: Evaluar $n_2 = -2.5$: es negativo y decimal (inválido).'
    - 'Paso 4: Seleccionar como respuesta válida $n = 18$ personas.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al resolver un problema sobre la cantidad de productos vendidos se obtienen las soluciones $x_1 = 25$ y $x_2 = -4$. ¿Por qué se descarta la raíz $x_2 = -4$?'
    choices:
      - {text: 'Porque no se pueden vender cantidades negativas de productos ($x \in \mathbb{Z}^+$).', is_correct: true}
      - {text: 'Porque la solución $-4$ es un número primo.', is_correct: false}
      - {text: 'Porque la ecuación cuadrática no tiene soluciones reales.', is_correct: false}
      - {text: 'Porque el discriminante fue igual a cero.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque no se pueden vender cantidades negativas de productos ($x \in \mathbb{Z}^+$).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Un problema sobre el tiempo en segundos en que una pelota toca el suelo da como soluciones $t_1 = -2$ y $t_2 = 3$. ¿Cuál es la respuesta del tiempo de vuelo?'
    choices:
      - {text: '$t = 3 \text{ segundos}$', is_correct: true}
      - {text: '$t = -2 \text{ segundos}$', is_correct: false}
      - {text: 'Ambas soluciones son válidas.', is_correct: false}
      - {text: 'Ninguna solución es válida.', is_correct: false}
    explanation: 'La alternativa correcta es ''$t = 3 \text{ segundos}$''. El tiempo transcurrido debe ser un valor no negativo ($t \ge 0$).'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Obtener las dos soluciones algebraicas $x_1$ y $x_2$ de la ecuación de segundo grado.'
  - 'Paso 2: Identificar las restricciones de naturaleza física o práctica del enunciado (longitud $> 0$, tiempo $\ge 0$, personas $\in \mathbb{Z}^+$).'
  - 'Paso 3: Comprobar cada solución matemática contra las restricciones declaradas.'
  - 'Paso 4: Seleccionar la raíz válida y redactar la respuesta contextual adecuada.'
errores_correccion: |
  - **Error común:** Dar ambas soluciones matemáticas ($x_1$ y $x_2$) como respuesta final en un problema aplicado de edades o distancias.
  - **Cómo corregirlo:** **COMPRUEBA EL CONTEXTO** y descarta explícitamente la raíz que carezca de sentido en la realidad.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Problema de edades.
    alternativas:
      - 'Edad = 14 años'
      - 'Edad = -6 años'
      - 'Edad = 14 o -6 años'
    respuesta: 'Edad = 14 años'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Conteo discreto de objetos.
    alternativas:
      - '10 objetos'
      - '-12 objetos'
      - '10 o -12 objetos'
    respuesta: '10 objetos'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Entregar las dos soluciones matemáticas $x_1$ y $x_2$ como respuestas válidas en un problema de distancias o edades.'
  - 'Aceptar soluciones fraccionarias o decimales en problemas que exigen el conteo de objetos discretos indivisibles.'
  - 'Descartar la solución positiva por asumirse incorrectamente que ambas soluciones cuadráticas deben ser rechazadas.'
  - 'La sustitución errónea de la variable de resultado $x$ con las preguntas compuestas del problema (ej. dar $x$ en lugar de $x+5$).'
  - 'No verificar las soluciones encontradas sustituyendo en las expresiones contextuales originales.'
afirmaciones_verdaderas:
  - 'Seleccionar la raíz válida requiere intersectar el conjunto solución algebraico $S_{alg}$ con el dominio de restricción físico del problema $D_{ctx}$.'
  - 'Las magnitudes de tiempo, distancia, edad y cantidades de objetos discretos imponen restricciones de no negatividad o entero positivo sobre las raíces.'
al_terminar_debes_poder: |
  QUÉ: Filtrar y seleccionar la raíz algebraicamente válida que satisface las restricciones del contexto aplicado.
  CÓMO: Obtener $x_1, x_2$, contrastar con el dominio físico del enunciado ($x > 0, t \ge 0$) y declarar la respuesta contextual correcta.
fuente: 'Texto escolar MINEDUC — Álgebra / Ecuaciones de Segundo Grado'
