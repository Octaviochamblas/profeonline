semantic_id: MAT.ALG.EC_CUADR_MODELO.SELECCION_RAIZ_VALIDA
resumen_inicial: 'Selección de la raíz válida según las restricciones del contexto:
  concepto, discriminante, soluciones y modelamiento en Modelamiento y resolución
  de problemas.'
explicacion_simple: Resolver correctamente la ecuación es solo la mitad del trabajo
  en un problema aplicado; la otra mitad es decidir cuál de las soluciones algebraicas
  realmente responde a la pregunta planteada.
explicacion_formal: '### Definición formal


  Una ecuación cuadrática que modela un problema aplicado entrega, en general, dos
  soluciones matemáticas. La solución del problema real es el subconjunto de esas
  raíces que satisface además las restricciones impuestas por el contexto (por ejemplo,
  $x>0$ para una longitud, o $x \in \mathbb{N}$ para una cantidad de objetos).


  ### Desarrollo didáctico


  El criterio de selección depende de qué representa la incógnita: longitudes, tiempos
  y cantidades físicas exigen valores positivos; cantidades de objetos exigen valores
  enteros; edades exigen valores razonables dentro de un rango humano.


  Si la ecuación de un problema de área da $x=5$ o $x=-8$, y $x$ representa el ancho
  de un terreno, se descarta $x=-8$ por no ser una longitud válida, quedando $x=5$
  como única solución del problema.'
definiciones_clave: '- **Selección de la raíz válida según las restricciones del contexto**:
  Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en selección
  de la raíz válida según las restricciones del contexto.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando selección de la raíz
    válida según las restricciones del contexto.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a selección de la raíz
    válida según las restricciones del contexto.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
