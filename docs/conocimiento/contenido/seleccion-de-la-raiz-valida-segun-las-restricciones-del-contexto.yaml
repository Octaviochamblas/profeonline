semantic_id: MAT.ALG.EC_CUADR_MODELO.SELECCION_RAIZ_VALIDA
resumen_inicial: La selección de la raíz válida consiste en someter las soluciones matemáticas obtenidas de la ecuación cuadrática $\mathcal{S} = \{x_1, x_2\}$ al filtro riguroso de las restricciones de dominio impuestas por la naturaleza física o contextual del problema.
explicacion_simple: "![La selección de la raíz válida consiste en someter las soluciones matemáticas obtenidas de la ecuación cuadrática $\\mathcal{S} = \\{x_1, x_2\\}$ al filtro riguroso de las restricciones de dominio impuestas por la naturaleza física o contextual del problema](/static/img/nodos/seleccion-de-la-raiz-valida-segun-las-restricciones-del-contexto-intro.svg)\n\n\nUna ecuación cuadrática siempre te entrega 2 soluciones matemáticas, pero **en la vida real no todas tienen sentido**:\n\n**El filtro de la realidad:**\n1. **Magnitudes que NO pueden ser negativas:**\n   - Longitudes, distancias, perímetros, áreas ($d > 0$).\n   - Tiempo transcurrido ($t \\ge 0$).\n   - Número de personas, animales, objetos contables ($n \\in \\mathbb{N}$). \n   - Precios o tarifas de dinero en compras ($p > 0$).\n2. **Restricciones ocultas en los lados:**\n   - Si un lado mide $x - 8$, no solo $x$ debe ser positivo: **$x$ tiene que ser mayor que 8 ($x > 8$)** para que ese lado no dé negativo ni cero.\n\
  3. **Criterio:** Te quedas solo con la solución que pasa todos los filtros."
explicacion_formal: 'Sea una ecuación cuadrática $P(x) = 0$ con conjunto solución algebraico $\mathcal{S}_{\text{alg}} = \{x_1, x_2\} \subset \mathbb{R}$. Sea $\mathcal{D}_{\text{contexto}} \subset \mathbb{R}$ el dominio admisible de restricciones físicas.


  **Operador de filtrado contextual**:

  $$\mathcal{S}_{\text{físico}} = \mathcal{S}_{\text{alg}} \cap \mathcal{D}_{\text{contexto}}$$


  **Casos de filtrado formal**:

  - **Positividad estricta**: $\mathcal{D} = \mathbb{R}^+ = ]0, +\infty[$ (dimensiones geométricas, escalas).

  - **No negatividad temporal**: $\mathcal{D} = \mathbb{R}_0^+ = [0, +\infty[$ (tiempo de evolución cinemática).

  - **Integralidad positiva**: $\mathcal{D} = \mathbb{N} = \{1, 2, 3, \dots\}$ (elementos discretos, personas).

  - **Restricción acotada**: $\mathcal{D} = ]a, b[$ (porciones recortadas de una lámina fija).'
definiciones_clave: '- **Solución espuria / Inadmisible**: Solución matemáticamente correcta de la ecuación que viola las leyes o restricciones del contexto real.

  - **Dominio contextual**: Subconjunto de números reales compatibles con la realidad del fenómeno modelado.'
propiedades_relaciones: '- **Unicidad contextual frecuente**: En problemas geométricos y económicos suele quedar exactamente una raíz válida.

  - **Dualidad física válida**: En problemas cinemáticos de altura ambas raíces positivas pueden ser plenamente válidas (subida y bajada).'
ejemplo_guiado:
  enunciado: '![Ejemplo La selección de la raíz válida consiste en someter las soluciones matemáticas obtenidas de la ecuación cuadrática $\mathcal{S} = \{x_1, x_2\}$ al filtro riguroso de las restricciones de dominio impuestas por la naturaleza física o contextual del problema](/static/img/nodos/seleccion-de-la-raiz-valida-segun-las-restricciones-del-contexto-ejemplos.svg)



    Se desea construir una caja sin tapa recortando cuadrados de lado $x$ de las cuatro esquinas de una lámina de cartón de $20\text{ cm} \times 30\text{ cm}$. Si el área de la base resultante es de $200\text{ cm}^2$, determina el valor admisible de $x$.'
  pasos:
  - 'Paso 1: Dimensiones de la base de la caja: Largo $= 30 - 2x$, Ancho $= 20 - 2x$.'
  - 'Paso 2: Determinar las restricciones físicas de corte:

    Para que las dimensiones sean positivas: $20 - 2x > 0 \implies 2x < 20 \implies x < 10\text{ cm}$ y $x > 0$.

    Dominio admisible: $x \in ]0, 10[$.'
  - 'Paso 3: Plantear la ecuación del área de la base: $(30 - 2x)(20 - 2x) = 200$.'
  - 'Paso 4: Desarrollar: $600 - 100x + 4x^2 = 200 \implies 4x^2 - 100x + 400 = 0$.'
  - 'Paso 5: Dividir por 4: $x^2 - 25x + 100 = 0$.'
  - 'Paso 6: Factorizar: $(x - 20)(x - 5) = 0 \implies x_1 = 5, \; x_2 = 20$.'
  - 'Paso 7: Aplicar el filtro de dominio contextual ($x \in ]0, 10[$):

    - $x = 20$ es matemáticamente correcto pero físicamente imposible (no se pueden cortar 20 cm de una lámina de 20 cm).

    - Conclusión: La única solución válida es $x = 5\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver un problema de cantidad de obreros se obtienen las raíces n = 12 y n = -4. ¿Cuál es la respuesta correcta?
  choices:
  - text: 12 obreros (la cantidad de personas no puede ser negativa)
    is_correct: true
  - text: -4 obreros
    is_correct: false
  - text: 8 obreros
    is_correct: false
  - text: Ambas son validas
    is_correct: false
  explanation: La alternativa correcta es '12 obreros (la cantidad de personas no puede ser negativa)'. Los conjuntos de personas pertenecen a los números naturales $\mathbb{N}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una dimensión está dada por (x - 7) y las soluciones cuadráticas son x = 10 y x = 4, ¿cuál es la solución admisible?
  choices:
  - text: x = 10 solamente, porque x = 4 haria que la dimension fuera 4 - 7 = -3 (longitud negativa imposible)
    is_correct: true
  - text: x = 4 solamente
    is_correct: false
  - text: Ambas soluciones son validas porque ambas son positivas
    is_correct: false
  - text: Ninguna solucion
    is_correct: false
  explanation: La alternativa correcta es 'x = 10 solamente, porque x = 4 haria que la dimension fuera 4 - 7 = -3 (longitud negativa imposible)'. Aunque $x = 4 > 0$, anula y vuelve negativa la dimensión $(x - 7)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Definir claramente el dominio admisible $\mathcal{D}$ según la naturaleza del problema (longitud, tiempo, personas).'
- 'Paso 2: Resolver la ecuación cuadrática obteniendo las soluciones algebraicas $x_1$ y $x_2$.'
- 'Paso 3: Probar cada solución en las expresiones originales del problema.'
- 'Paso 4: Descartar las soluciones que violen las restricciones físicas o dimensionales.'
- 'Paso 5: Enunciar con certeza la raíz válida.'
errores_correccion: '- **Error común:** Aceptar $x = 4$ solo porque es un número positivo, sin notar que al reemplazarlo en un lado $(x - 6)$ da una longitud negativa de $-2$.

  - **Cómo corregirlo:** **Prueba siempre el valor de $x$ en todas las medidas del problema** para confirmar que todas las longitudes resulten positivas.'
ejemplos:
- titulo: 'Ejemplo 1: Filtrado por dimensión negativa'
  enunciado: Un lado mide $x$ y el otro $(x - 5)$. Si el área es 24, ¿cuánto vale x?
  alternativas:
  - x = 8
  - x = -3
  - x = 8 y x = -3
  - x = 3
  respuesta: x = 8
  solucion_pasos:
  - 'Paso 1: $x(x - 5) = 24 \implies x^2 - 5x - 24 = (x - 8)(x + 3) = 0 \implies x = 8$ (se descarta $-3$).'
- titulo: 'Ejemplo 2: Personas en un grupo'
  enunciado: Un grupo de $n$ personas debe repartirse $\$60.000$. Al resolver la ecuación se obtienen $n = 10$ y $n = -12$. ¿Cuántas personas son?
  alternativas:
  - 10 personas
  - 12 personas
  - Ambas respuestas
  - 2 personas
  respuesta: 10 personas
  solucion_pasos:
  - 'Paso 1: $n \in \mathbb{N} \implies n = 10$.'
- titulo: 'Ejemplo 3: Tiempo de llenado de estanques'
  enunciado: Una llave demora $t$ horas en llenar un depósito. Se obtienen $t = 6$ y $t = -2$. ¿Cuál es el tiempo?
  alternativas:
  - 6 horas
  - -2 horas
  - 4 horas
  - 8 horas
  respuesta: 6 horas
  solucion_pasos:
  - 'Paso 1: El tiempo no puede ser negativo $\implies t = 6\text{ h}$.'
- titulo: 'Ejemplo 4: Restricción de corte en lámina'
  enunciado: Se corta $x$ cm de una tira de 12 cm. Si las raíces son $x = 4$ y $x = 15$, ¿cuál es la admisible?
  alternativas:
  - x = 4 cm
  - x = 15 cm
  - Ambas
  - Ninguna
  respuesta: x = 4 cm
  solucion_pasos:
  - 'Paso 1: No se puede cortar más de 12 cm ($x < 12$) $\implies x = 4\text{ cm}$.'
errores_frecuentes:
- No verificar las restricciones internas en cada dimensión del problema.
- Asumir que toda raíz positiva es automáticamente válida.
- Olvidar descartar soluciones que anulen denominadores o produzcan raíces imaginarias.
afirmaciones_verdaderas:
- El filtrado de soluciones descarta aquellas raíces algebraicas que violan las restricciones del contexto real.
- Una raíz positiva puede ser descartada si al evaluarla en una dimensión produce una longitud negativa.
al_terminar_debes_poder: '**QUÉ:** Seleccionar y filtrar con criterio la raíz contextualmente admisible de una ecuación cuadrática.


  **CÓMO:** Evaluando cada solución matemática frente a las restricciones físicas, geométricas y lógicas del problema.


