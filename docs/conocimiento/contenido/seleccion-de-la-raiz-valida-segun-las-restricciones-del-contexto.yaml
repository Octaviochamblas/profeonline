procedimiento:
- 'Paso 1: Resuelve completamente la ecuación cuadrática, obteniendo ambas soluciones
  algebraicas.'
- 'Paso 2: Identifica qué representa la incógnita en el contexto del problema (longitud,
  tiempo, cantidad, etc.).'
- 'Paso 3: Determina las restricciones que esa cantidad debe cumplir (positividad,
  ser entero, rango razonable).'
- 'Paso 4: Descarta las soluciones que no cumplan esas restricciones y conserva las
  que sí.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en selección de la raíz válida según las restricciones del contexto.
ejemplos:
- titulo: Selección con restricción de positividad
  enunciado: Al resolver un problema de área se obtiene $x=6$ o $x=-9$, donde $x$
    representa el largo de un jardín. ¿Cuál es la solución válida?
  solucion_pasos:
  - Una longitud no puede ser negativa.
  - La solución válida es $x=6$.
- titulo: Selección con ambas soluciones válidas
  enunciado: Al resolver un problema de altura se obtiene $t=2$ o $t=6$, ambos tiempos
    positivos, representando los instantes en que un objeto alcanza cierta altura.
    ¿Son ambas válidas?
  solucion_pasos:
  - Ambos tiempos son positivos y corresponden a instantes reales (subida y bajada).
  - Sí, ambas soluciones son válidas en este contexto.
- titulo: ¿Siempre se debe descartar la solución negativa de una ecuación cuadrática
    aplicada?
  enunciado: ¿Siempre se debe descartar la solución negativa de una ecuación cuadrática
    aplicada?
  respuesta: 'No'
  solucion_pasos:
  - Solo se descarta si el contexto exige valores positivos (como una longitud); en
    otros contextos (por ejemplo, una posición en una recta numérica) un valor negativo
    puede ser perfectamente válido.
- titulo: ¿Puede un problema aplicado tener las dos soluciones algebraicas como válidas
    simultáneamente?
  enunciado: ¿Puede un problema aplicado tener las dos soluciones algebraicas como
    válidas simultáneamente?
  respuesta: Sí
  solucion_pasos:
  - Ocurre cuando ambas soluciones cumplen las restricciones del contexto, como en
    el ejemplo de las dos alturas alcanzadas durante un lanzamiento.
errores_frecuentes:
- Descartar automáticamente la solución negativa sin verificar si realmente viola
  una restricción del contexto.
- Aceptar ambas soluciones sin verificar si alguna incumple una restricción implícita
  del problema.
- No identificar correctamente qué representa la incógnita antes de decidir qué restricciones
  aplicar.
- Olvidar verificar restricciones adicionales, como que la solución sea un número
  entero si se piden unidades completas.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando selección
  de la raíz válida según las restricciones del contexto.
