semantic_id: MAT.ALG.EC_CUADR_MODELO.SELECCION_RAIZ_VALIDA
resumen_inicial: Seleccionar la raíz válida exige contrastar las dos soluciones algebraicas
  contra las limitaciones físicas del problema (tiempos $t \ge 0$, dimensiones $d
  > 0$).
explicacion_simple: 'Una ecuación cuadrática entrega dos números como respuesta matemática
  ($x_1$ y $x_2$), pero **debes usar el sentido común del contexto real**:

  - Si $x$ representa el tiempo de vuelo de una pelota y obtienes $t_1 = 3\text{ s}$
  y $t_2 = -2\text{ s}$, la respuesta física es únicamente **$3\text{ s}$**.

  - Si $x$ representa el ancho de un terreno y obtienes $x_1 = 12\text{ m}$ y $x_2
  = -15\text{ m}$, el ancho real es **$12\text{ m}$**.'
explicacion_formal: Definición formal y restricciones físicas en el modelamiento cuadrático
  de problemas contextuales.
definiciones_clave: '- **Dominio del contexto**: Conjunto de valores numéricos que
  poseen sentido físico en la realidad modelada.'
propiedades_relaciones: '- **Filtrado de soluciones extrañas**: Descarte de raíces
  algebraicas que violan las restricciones del dominio del contexto.'
ejemplo_guiado:
  enunciado: Modelamiento y resolución de problemas cuadráticos en contexto real.
  pasos:
  - 'Paso 1: Asignar la variable x con sus unidades correspondientes.'
  - 'Paso 2: Construir la ecuación cuadrática del problema.'
  - 'Paso 3: Resolver la ecuación obteniendo x1 y x2.'
  - 'Paso 4: Seleccionar la raíz válida e interpretar la respuesta final en lenguaje
    verbal.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver un problema de lanzamiento de proyectiles donde $h(t) = -5t^2
    + 20t = 0$, se obtienen $t_1 = 0\text{ s}$ y $t_2 = 4\text{ s}$. ¿En qué segundo
    vuelve a tocar el suelo?
  choices:
  - text: A los $4\text{ segundos}$ de haber sido lanzado.
    is_correct: true
  - text: A los $0\text{ segundos}$.
    is_correct: false
  - text: A los $20\text{ segundos}$.
    is_correct: false
  - text: A los $5\text{ segundos}$.
    is_correct: false
  explanation: La alternativa correcta es 'A los $4\text{ segundos}$ de haber sido
    lanzado.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué se deben descartar las soluciones negativas al calcular dimensiones
    de terrenos o distancias?
  choices:
  - text: Porque las distancias y longitudes geométricas son siempre cantidades estrictamente
      positivas.
    is_correct: true
  - text: Porque los números negativos no tienen raíz cuadrada.
    is_correct: false
  - text: Porque la ecuación se destruye.
    is_correct: false
  - text: Porque el área sería cero.
    is_correct: false
  explanation: La alternativa correcta es 'Porque las distancias y longitudes geométricas
    son siempre cantidades estrictamente positivas.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Traducir el enunciado verbal a una ecuación de segundo grado $a x^2 + b
  x + c = 0$.'
- 'Paso 2: Resolver la ecuación mediante factorización o fórmula general.'
- 'Paso 3: Evaluar la validez de $x_1$ y $x_2$ en el contexto del problema.'
- 'Paso 4: Redactar la respuesta verbal conclusiva con unidades.'
errores_correccion: '- **Error común:** Dar ambas soluciones matemáticas sin verificar
  si una de ellas es físicamente imposible.

  - **Cómo corregirlo:** Analiza siempre si las variables representan tiempo, distancia
  o cantidad de personas para descartar soluciones no válidas.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento cuadrático.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de resolución contextual.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se deben descartar soluciones negativas al calcular distancias o tiempos?
  respuesta: Sí
  solucion_pasos:
  - Sí, las magnitudes físicas de longitud y tiempo en física clásica son no negativas.
- titulo: ¿Un proyectil lanzado verticalmente h(t) = -5t^2 + v0*t vuelve al suelo
    cuando h(t) = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, tocar el suelo equivale a tener altura h = 0.
errores_frecuentes:
- Aceptar soluciones negativas en problemas donde la variable representa magnitudes
  no negativas como edades o medidas de lados.
- Confundir la pregunta por la incógnita $x$ con la pregunta por la superficie o perímetro
  completo.
- Plantear incorrectamente la ecuación de área olvidando multiplicar los paréntesis
  del largo y ancho.
- Olvidar colocar unidades físicas (metros, segundos, pesos) en la respuesta contextual
  final.
- Sumar en lugar de multiplicar al traducir frases de producto entre números.
afirmaciones_verdaderas:
- El modelamiento cuadrático traduce enunciados reales a ecuaciones $a x^2 + b x +
  c = 0$ cuyas soluciones deben filtrarse según las restricciones físicas del problema.
- En problemas de lanzamiento de proyectiles $h(t) = -g t^2 + v_0 t + h_0$, el instante
  de retorno al suelo se halla igualando la altura a cero ($h(t) = 0$).
al_terminar_debes_poder: Al finalizar este recurso podrás traducir enunciados verbales
  a ecuaciones cuadráticas, resolver problemas de áreas, números y movimiento, seleccionando
  la raíz válida e interpretando la solución.
fuente: Texto escolar MINEDUC — Álgebra / Modelamiento Cuadrático
estado: publicado
