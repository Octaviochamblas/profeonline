semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.RESTRICCION_ARGUMENTO
resumen_inicial: 'El argumento $a$ de todo logaritmo $\log_b(a)$ debe ser estrictamente positivo ($a > 0$), debido a que la potencia de una base positiva es siempre positiva.'
explicacion_simple: |
  En cualquier logaritmo, el número que colocamos dentro del argumento debe ser estrictamente mayor que cero ($a > 0$). No existen logaritmos de números negativos ni tampoco logaritmo de cero en los números reales. La razón es muy sencilla: cuando elevamos una base positiva (como $2$ o $10$) a cualquier exponente (positivo, negativo o cero), el resultado siempre nos da un número positivo. Por eso es imposible obtener cero o un número negativo como resultado de esa potencia.
explicacion_formal: |
  ### Definición formal
  El **dominio de existencia del argumento** $a \in \mathbb{R}$ en la expresión $\log_b(a)$ es el conjunto de los reales estrictamente positivos:
  $$\operatorname{Dom}_{\text{arg}}(\log_b) = ]0, +\infty[ = \mathbb{R}^+$$
  demostrado analíticamente por la contradicción producida al suponer $a \le 0$:
  1. **Imposibilidad para $a = 0$**: Si $\log_b(0) = c \iff b^c = 0$. Dado que $b > 0$, la función exponencial $b^c > 0$ jamás se anula para ningún $c \in \mathbb{R}$.
  2. **Imposibilidad para $a < 0$**: Si $\log_b(-k) = c \iff b^c = -k < 0$ (con $k > 0$). Es absurdo, pues $b > 0 \implies b^c > 0, \forall c \in \mathbb{R}$.

  ### Desglose simbólico
  - $a > 0 \implies \log_b(a) \in \mathbb{R}$ (Perfectamente definido).
  - $a = 0 \implies \log_b(0)$ no existe en $\mathbb{R}$ (Asíntota vertical $x = 0$, $\lim_{x \to 0^+} \log_b(x) = -\infty$ para $b > 1$).
  - $a < 0 \implies \log_b(a)$ no existe en $\mathbb{R}$.

  ### Síntesis didáctica
  Determinación del dominio de expresiones algebraicas dentro del logaritmo: Para hallar el dominio de $f(x) = \log_b(P(x))$, debemos plantear obligatoriamente la inecuación estricta $P(x) > 0$.
definiciones_clave: |
  - **Restricción de argumento $a > 0$**: Requisito de positivismo estricto para la existencia del logaritmo real.
  - **Indefinición en cero**: Imposibilidad de encontrar un exponente finito $c$ tal que $b^c = 0$.
  - **Dominio de definición de funciones logarítmicas**: Solución de la desigualdad $P(x) > 0$ para el argumento.
propiedades_relaciones: |
  - **Asíntota vertical en $x = 0$**: La gráfica de $y = \log_b(x)$ se aproxima infinitamente al eje $y$ ($x = 0$) a medida que el argumento se acerca a cero por la derecha ($x \to 0^+$).
  - **Preservación del signo por exponentes**: Los exponentes negativos en el logaritmo cambian la escala pero jamás vuelven negativo al argumento.
ejemplo_guiado:
  enunciado: 'Determina el conjunto dominio para los cuales están bien definidas en $\mathbb{R}$ las siguientes expresiones logarítmicas: A) $\log_2(x - 5)$, B) $\ln(8 - 2x)$, C) $\log(x^2 + 1)$.'
  pasos:
    - 'Paso 1: Para $\log_2(x - 5)$, exigimos argumento positivo: $x - 5 > 0 \implies x > 5$. Dominio: $]5, +\infty[$.'
    - 'Paso 2: Para $\ln(8 - 2x)$, exigimos argumento positivo: $8 - 2x > 0 \implies 8 > 2x \implies x < 4$. Dominio: $]-\infty, 4[$.'
    - 'Paso 3: Para $\log(x^2 + 1)$, exigimos $x^2 + 1 > 0$. Como $x^2 \ge 0$ para todo $x \in \mathbb{R}$, $x^2 + 1 \ge 1 > 0$ siempre es cierto. Dominio: todo $\mathbb{R}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la expresión $\log_3(-9)$ no está definida en el conjunto de los números reales?'
    choices:
      - {text: 'Porque no existe ningún exponente real $c$ tal que al elevar la base positiva $3^c$ resulte el número negativo $-9$', is_correct: true}
      - {text: 'Porque $-9$ es un número impar', is_correct: false}
      - {text: 'Porque la base 3 es mayor que cero', is_correct: false}
      - {text: 'Porque el resultado debería ser igual a 0', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque no existe ningún exponente real $c$ tal que al elevar la base positiva $3^c$ resulte el número negativo $-9$''. Las potencias de base positiva son siempre estrictamente positivas.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el dominio de definición real de la función $f(x) = \log_5(3x - 12)$?'
    choices:
      - {text: '$\operatorname{Dom}(f) = ]4, +\infty[$', is_correct: true}
      - {text: '$\operatorname{Dom}(f) = [4, +\infty[$', is_correct: false}
      - {text: '$\operatorname{Dom}(f) = \mathbb{R}$', is_correct: false}
      - {text: '$\operatorname{Dom}(f) = ]-\infty, 4[$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\operatorname{Dom}(f) = ]4, +\infty[$''. Resolvemos la desigualdad estricta $3x - 12 > 0 \implies 3x > 12 \implies x > 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la expresión que actúa como argumento del logaritmo.'
  - 'Paso 2: Plantear la desigualdad de argumento estrictamente positivo: $\text{Argumento} > 0$.'
  - 'Paso 3: Resolver la inecuación para despejar el intervalo de valores permitidos para la variable.'
  - 'Paso 4: Escribir el dominio como un intervalo abierto en su cota inferior.'
errores_correccion: |
  - **Error 1:** Incluir el número cero en el dominio usando corchete cerrado (ej: escribir $[5, +\infty[$ para $\log(x-5)$). **Cómo corregirlo:** El argumento debe ser estrictamente mayor que cero ($x - 5 > 0 \implies x > 5$). El cero no pertenece al dominio, por lo que el intervalo es abierto $]5, +\infty[$.
  - **Error 2:** Confundir el signo del argumento con el signo del resultado del logaritmo. **Cómo corregirlo:** El argumento debe ser siempre positivo ($a > 0$). El resultado del logaritmo sí puede ser negativo (ej: $\log_2(0.25) = -2$).
ejemplos:
  - titulo: 'Evaluación en argumento cero'
    enunciado: '¿Existe el valor numérico de $\log_2(0)$ en los números reales?'
    alternativas:
      - 'No existe en los reales'
      - 'Es igual a 0'
      - 'Es igual a 1'
    respuesta: 'No existe en los reales'
    solucion_pasos:
      - '1. La ecuación $2^c = 0$ no posee solución real.'
      - '2. $\log_2(0)$ no está definido.'
  - titulo: 'Dominio de logaritmo lineal'
    enunciado: '¿El dominio de $f(x) = \ln(x + 2)$ es $]-2, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Exigimos $x + 2 > 0 \implies x > -2$, lo que corresponde al intervalo $]-2, +\infty[$.'
  - titulo: 'Argumento con valor absoluto'
    enunciado: '¿La función $g(x) = \log(|x|)$ está definida para todo $x \in \mathbb{R} \setminus \{0\}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Para todo $x \neq 0$, $|x| > 0$, satisfaciendo la restricción del argumento.'
  - titulo: 'Diferencia entre argumento y resultado'
    enunciado: 'En la expresión $\log_2(0.125) = -3$, ¿el argumento $0.125$ es positivo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El argumento es $a = 0.125 > 0$. El resultado es $c = -3 < 0$, lo cual es perfectamente válido.'
errores_frecuentes:
  - 'El valor de $\log_2(0)$ es igual a cero.'
  - 'Los logaritmos de números negativos existen en $\mathbb{R}$ y dan como resultado números negativos.'
  - 'El dominio de la función $f(x) = \log(x - 3)$ incluye al valor $x = 3$ en el intervalo $[3, +\infty[$.'
  - 'Si el resultado de un logaritmo es $-4$, significa que el argumento evaluado era un número negativo.'
  - 'La restricción del argumento exige que el valor de $x$ sea siempre un número positivo.'
afirmaciones_verdaderas:
  - 'El argumento de todo logaritmo real debe ser estrictamente positivo ($a > 0$) para garantizar la existencia de la función.'
  - 'El valor cero y los números negativos están excluidos del dominio de argumentos de cualquier logaritmo real.'
al_terminar_debes_poder: |
  QUÉ: Identificar la restricción del argumento en funciones y expresiones logarítmicas.
  CÓMO: Plantear la inecuación de positividad estricta $a > 0$ para garantizar valores reales en el dominio.
