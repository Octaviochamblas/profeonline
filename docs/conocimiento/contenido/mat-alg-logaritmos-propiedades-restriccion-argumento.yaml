semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.RESTRICCION_ARGUMENTO
resumen_inicial: 'Identificación de la restricción positiva del argumento en un logaritmo:
  conceptos, asíntotas, propiedades e inversidad en Logaritmos y sus propiedades.'
explicacion_simple: Al separar o combinar logaritmos, el argumento cambia de forma,
  y es fácil perder de vista si sigue siendo positivo en cada nueva expresión.
explicacion_formal: '### Definición formal


  Al aplicar $\log_b(xy)=\log_b(x)+\log_b(y)$, se exige $x>0$ y $y>0$ por separado,
  no solo que el producto $xy>0$. Esta distinción es crucial: $xy$ puede ser positivo
  aunque $x$ e $y$ sean ambos negativos, pero en ese caso $\log_b(x)$ y $\log_b(y)$
  no estarían definidos.


  ### Desarrollo didáctico


  Considera $\log_b((-2)\cdot(-3))=\log_b(6)$, que sí está definido. Sin embargo,
  separarlo como $\log_b(-2)+\log_b(-3)$ no es válido, porque ni $-2$ ni $-3$ son
  argumentos positivos. La propiedad del producto solo puede aplicarse cuando ambos
  factores son positivos por separado.'
definiciones_clave: '- **Identificación de la restricción positiva del argumento en
  un logaritmo**: Concepto fundamental en el estudio del crecimiento/decaimiento exponencial
  y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a identificación de la restricción positiva del argumento en un logaritmo.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de identificación
    de la restricción positiva del argumento en un logaritmo.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de identificación de la restricción
    positiva del argumento en un logaritmo.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    identificación de la restricción positiva del argumento en un logaritmo?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en logaritmos y sus
      propiedades
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en logaritmos y sus propiedades. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en identificación de la restricción positiva del argumento en un logaritmo?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica cada argumento individual involucrado en la expresión logarítmica.'
- 'Paso 2: Verifica que cada uno cumpla la condición de ser estrictamente positivo
  por separado.'
- 'Paso 3: Aplica la propiedad solo si todos los argumentos individuales son válidos.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en identificación
  de la restricción positiva del argumento en un logaritmo.
ejemplos:
- titulo: Verificación de argumentos antes de separar un producto
  enunciado: ¿Se puede aplicar $\log_2(xy)=\log_2(x)+\log_2(y)$ si $x=5$ e $y=3$?
  solucion_pasos:
  - Se verifica que $x=5>0$ e $y=3>0$ por separado.
  - Sí, ambos son positivos, así que la propiedad es aplicable.
- titulo: Detección de un argumento inválido al separar
  enunciado: ¿Se puede aplicar la propiedad del producto a $\log_3((-4)\cdot(-5))$
    separando en dos logaritmos?
  solucion_pasos:
  - Se verifica cada factor por separado: $-4<0$ y $-5<0$.
  - No, aunque el producto $20$ sea positivo, no se puede separar porque los factores
    individuales son negativos.
- titulo: ¿Basta con que el producto de los argumentos sea positivo para separar el
    logaritmo?
  enunciado: ¿Es suficiente que $xy>0$ para poder aplicar $\log_b(xy)=\log_b(x)+\log_b(y)$?
  respuesta: 'No'
  solucion_pasos:
  - Se exige que $x>0$ y $y>0$ por separado, no solo que su producto sea positivo.
- titulo: ¿La restricción del argumento aplica también al cociente?
  enunciado: ¿La condición de positividad por separado también se exige en $\log_b(x/y)=\log_b(x)-\log_b(y)$?
  respuesta: Sí
  solucion_pasos:
  - Tanto $x$ como $y$ deben ser positivos individualmente para que ambos logaritmos
    estén definidos.
errores_frecuentes:
- Suponer que basta con que el resultado final del argumento sea positivo, ignorando
  los factores individuales.
- Separar $\log_b(xy)$ en $\log_b(x)+\log_b(y)$ sin verificar el signo de $x$ e $y$
  por separado.
- Aplicar la propiedad del cociente sin comprobar que numerador y denominador sean
  ambos positivos.
- Declarar la restricción del argumento con la restricción de la base.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando identificación de la restricción positiva del argumento en un logaritmo.
