semantic_id: MAT.GEO.SEGMENTO_MEDIO.CUATRO_TRIANGULOS_CONGRUENTES
resumen_inicial: Al trazar los tres segmentos medios de un triángulo, este queda dividido
  en cuatro triángulos exactamente congruentes entre sí ($\Delta AM_c M_b \cong \Delta
  M_c B M_a \cong \Delta M_b M_a C \cong \Delta M_a M_b M_c$).
explicacion_simple: '![Cuatro Triángulos Congruentes](/static/img/nodos/division-del-triangulo-en-cuatro-triangulos-congruentes-por-sus-segmentos-medios-intro.svg)


  Si unes los tres puntos medios de un triángulo formando los 3 segmentos medios:


  - **Se forman 4 triángulos idénticos**: La figura se parte en 4 triángulos que son
  clones perfectos entre sí (misma forma y tamaño exacto).

  - **Sus lados miden lo mismo**: Cada uno de los 4 triangulitos tiene lados que miden
  la mitad de los lados originales ($\frac{a}{2}, \frac{b}{2}, \frac{c}{2}$).

  - **El del medio está al revés**: El triángulo central está rotado de cabeza ($180^\circ$)
  encajando como una pieza de rompecabezas perfecta.

  '
explicacion_formal: '### Teorema de los cuatro triángulos congruentes

  Al trazar los tres segmentos medios en un triángulo $\Delta ABC$, este queda descompuesto
  en exactamente cuatro triángulos menores **congruentes entre sí**:


  $$\Delta AM_c M_b \cong \Delta M_c B M_a \cong \Delta M_b M_a C \cong \Delta M_a
  M_b M_c$$


  ### Desglose simbólico y geométrico

  - Criterio Lado-Lado-Lado (LLL): Cada uno de los cuatro triángulos posee lados de
  medidas $\{\frac{a}{2}, \frac{b}{2}, \frac{c}{2}\}$.

  - Ángulos interiores idénticos: Cada triángulo reproduce la terna angular $\{\alpha,
  \beta, \gamma\}$.

  - Inversión central: El triángulo medial $\Delta M_a M_b M_c$ está invertido $180^\circ$
  respecto a los tres triángulos de los vértices.


  ### Síntesis didáctica

  Los segmentos medios actúan como un rompecabezas perfecto que subdivide al triángulo
  en cuatro copias exactas a escala reducida.'
definiciones_clave: '- **Triángulos congruentes ($\cong$)**: Figuras geométricas que
  poseen exactamente las mismas dimensiones y la misma forma (lados y ángulos homólogos
  iguales).

  - **Criterio LLL**: Postulado de congruencia según el cual dos triángulos con tres
  lados correspondientes iguales son congruentes.

  - **Rompecabezas medial**: Descomposición exacta de un triángulo en 4 piezas congruentes.

  '
propiedades_relaciones: '- **Congruencia cuádruple**: $\Delta AM_c M_b \cong \Delta
  M_c B M_a \cong \Delta M_b M_a C \cong \Delta M_a M_b M_c$.

  - **Lados de cada triángulo**: Lados iguales a $\{\frac{a}{2}, \frac{b}{2}, \frac{c}{2}\}$.

  - **Ángulos de cada triángulo**: Ángulos correspondientes idénticos $\{\alpha, \beta,
  \gamma\}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Cuatro Triángulos Congruentes](/static/img/nodos/division-del-triangulo-en-cuatro-triangulos-congruentes-por-sus-segmentos-medios-ejemplos.svg)


    Un triángulo $ABC$ tiene lados que miden $8\text{ cm}$, $12\text{ cm}$ y $14\text{
    cm}$. Al trazar sus tres segmentos medios se forman cuatro triángulos menores.
    ¿Cuáles son las medidas de los lados de cada uno de los cuatro triángulos formados?

    '
  pasos:
  - 'Paso 1: Recordar que los cuatro triángulos formados son congruentes por el criterio
    LLL.'
  - 'Paso 2: Calcular la longitud del primer lado: $\frac{8}{2} = 4\text{ cm}$.'
  - 'Paso 3: Calcular la longitud del segundo lado: $\frac{12}{2} = 6\text{ cm}$.'
  - 'Paso 4: Calcular la longitud del tercer lado: $\frac{14}{2} = 7\text{ cm}$.'
  - 'Paso 5: Concluir que cada uno de los cuatro triángulos tiene lados que miden
    exactamente $4\text{ cm}$, $6\text{ cm}$ y $7\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué criterio geométrico son congruentes los cuatro triángulos formados
    por los segmentos medios?
  choices:
  - text: Por el criterio Lado-Lado-Lado (LLL), ya que todos tienen lados a/2, b/2
      y c/2
    is_correct: true
  - text: Por el criterio Ángulo-Lado-Ángulo (ALA) exclusivamente
    is_correct: false
  - text: Solo son congruentes si el triángulo es equilátero
    is_correct: false
  - text: No son congruentes, solo tienen igual área
    is_correct: false
  explanation: Son congruentes por el criterio Lado-Lado-Lado (LLL), ya que todos
    tienen lados a/2, b/2 y c/2.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el triángulo original tiene perímetro 36 cm, ¿cuál es el perímetro
    de cada uno de los cuatro triángulos congruentes?
  choices:
  - text: $18\text{ cm}$
    is_correct: true
  - text: $9\text{ cm}$
    is_correct: false
  - text: $36\text{ cm}$
    is_correct: false
  - text: $12\text{ cm}$
    is_correct: false
  explanation: El perímetro es $18\text{ cm}$, ya que cada lado es la mitad del lado
    original ($36 / 2 = 18\text{ cm}$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las longitudes de los lados originales $a, b, c$.'
- 'Paso 2: Dividir cada lado por 2 para obtener los lados de los cuatro triángulos
  menores: $\{\frac{a}{2}, \frac{b}{2}, \frac{c}{2}\}$.'
- 'Paso 3: Aplicar el criterio LLL para justificar la congruencia de los 4 triángulos.'
- 'Paso 4: Utilizar la congruencia para calcular perímetros, ángulos o relaciones
  métricas.'
errores_correccion: No confundas congruencia (misma forma y tamaño) con mera equivalencia
  de área (las transversales dividen en 6 de igual área pero distinta forma; los segmentos
  medios dividen en 4 CONGRUENTES).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si uno de los cuatro triángulos formados por los segmentos medios tiene
    un perímetro de $15\text{ cm}$, ¿cuál es el perímetro del triángulo grande original?
  alternativas:
  - $30\text{ cm}$
  - $60\text{ cm}$
  - $15\text{ cm}$
  respuesta: $30\text{ cm}$
  solucion_pasos:
  - 'El perímetro del triángulo grande es el doble del perímetro de cualquiera de
    los triángulos congruentes: $2 \times 15 = 30\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: ¿Qué orientación tiene el triángulo central respecto a los otros tres
    triángulos en los vértices?
  alternativas:
  - Está invertido (rotado $180^\circ$)
  - Tiene exactamente la misma orientación
  - Está inclinado $90^\circ$
  respuesta: Está invertido (rotado $180^\circ$)
  solucion_pasos:
  - El triángulo medial central tiene su vértice apuntando en sentido opuesto al vértice
    principal del triángulo original.
- titulo: ¿Los cuatro triángulos formados por los tres segmentos medios son congruentes
    entre sí?
  respuesta: Sí
  solucion_pasos:
  - Sí, los cuatro tienen lados de medidas $a/2, b/2, c/2$, cumpliendo el criterio
    LLL.
- titulo: ¿Los cuatro triángulos formados por los segmentos medios tienen perímetros
    diferentes?
  respuesta: 'No'
  solucion_pasos:
  - No, al ser congruentes tienen exactamente el mismo perímetro.
errores_frecuentes:
- Creer que los 4 triángulos solo tienen la misma área pero diferente forma (son 100%
  congruentes).
- Confundir la división en 4 congruentes (por segmentos medios) con la división en
  6 áreas iguales (por transversales).
- Olvidar que el perímetro de cada triángulo menor es la mitad del perímetro original.
- Asumir que la congruencia solo se da en triángulos equiláteros.
- Invertir la escala al calcular lados.
afirmaciones_verdaderas:
- Los tres segmentos medios dividen al triángulo en cuatro triángulos congruentes
  entre sí.
- Cada uno de los cuatro triángulos menores tiene lados que miden $a/2, b/2, c/2$.
al_terminar_debes_poder: '**QUÉ:** Demostrar y aplicar la división del triángulo en
  cuatro triángulos congruentes mediante sus segmentos medios.


  **CÓMO:** Verificando el criterio LLL ($\text{lados } a/2, b/2, c/2$) y deduciendo
  la congruencia de los cuatro triángulos ($\Delta_1 \cong \Delta_2 \cong \Delta_3
  \cong \Delta_4$).


  ![Resumen de Cuatro Congruentes](/static/img/nodos/division-del-triangulo-en-cuatro-triangulos-congruentes-por-sus-segmentos-medios-resumen.svg)

  '
