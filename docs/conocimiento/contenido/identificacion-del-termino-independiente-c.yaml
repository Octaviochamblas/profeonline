semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_C
resumen_inicial: El término independiente $c$ es la constante numérica real que no contiene la incógnita ($x^0$) en la forma general $ax^2 + bx + c = 0$, siendo $c = 0$ si la ecuación carece de término constante libre.
explicacion_simple: '![El término independiente $c$ es la constante numérica real que no contiene la incógnita ($x^0$) en la forma general $ax^2 + bx + c = 0$, siendo $c = 0$ si la ecuación carece de término constante libre](/static/img/nodos/identificacion-del-termino-independiente-c-intro.svg)



  El **término independiente $c$** es el número "solitario" que no tiene ninguna letra $x$ a su lado:

  - En $2x^2 + 5x - 7 = 0$, el término independiente es **$c = -7$**.

  - En $x^2 - 3x + 12 = 0$, el término independiente es **$c = 12$**.

  - **¡Ojo!** Si todos los términos tienen la letra $x$ (como en $3x^2 + 6x = 0$), significa que **$c = 0$**.

  - Cuando $c = 0$, la gráfica de la parábola pasa exactamente por el **origen $(0, 0)$** y una de las soluciones de la ecuación es siempre **$x = 0$**.'
explicacion_formal: 'En la estructura polinómica canónica $P(x) = ax^2 + bx + c = 0$, el término independiente $c$ corresponde a la evaluación del polinomio en cero:

  $$c = P(0) \in \mathbb{R}$$


  **Propiedades analíticas y geométricas:**

  - **Intercepto con el eje de ordenadas ($Y$)**: La gráfica de la parábola corta siempre al eje $Y$ en el punto cartesiano $(0, c)$.

  - **Producto de las raíces (Relaciones de Cardano-Vieta)**: El producto de las soluciones reales o complejas de la ecuación cuadrática es $x_1 \cdot x_2 = \frac{c}{a}$.

  - **Condición de raíz nula**: La ecuación tiene al menos una raíz $x = 0 \Longleftrightarrow c = 0$.'
definiciones_clave: '- **Término independiente $c$**: Constante libre de grado 0 en el polinomio cuadrático.

  - **Ecuación binomia**: Ecuación cuadrática donde el término independiente es nulo ($c = 0$).'
propiedades_relaciones: '- **Traslación vertical**: Modificar el valor de $c$ produce un desplazamiento vertical rígido de la parábola asociada sin alterar su eje de simetría.

  - **Signo del discriminante**: Si $a$ y $c$ tienen signos opuestos ($ac < 0$), el discriminante $\Delta = b^2 - 4ac > 0$, garantizando siempre dos soluciones reales distintas.'
ejemplo_guiado:
  enunciado: '![Ejemplo El término independiente $c$ es la constante numérica real que no contiene la incógnita ($x^0$) en la forma general $ax^2 + bx + c = 0$, siendo $c = 0$ si la ecuación carece de término constante libre](/static/img/nodos/identificacion-del-termino-independiente-c-ejemplos.svg)



    Determina el valor del término independiente $c$ en las siguientes ecuaciones:

    1) $3x^2 - 4x - 9 = 0$

    2) $5x^2 + 10x = 0$

    3) $x^2 - 6x = -8$'
  pasos:
  - 'Paso 1: En $3x^2 - 4x - 9 = 0$: la constante numérica sin incógnita es $-9 \implies c = -9$.'
  - 'Paso 2: En $5x^2 + 10x = 0$: no hay término constante libre, por lo que $c = 0$.'
  - 'Paso 3: En $x^2 - 6x = -8$: transponer al lado izquierdo $x^2 - 6x + 8 = 0 \implies c = 8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué punto corta al eje Y la parábola asociada a la ecuación $2x^2 - 3x - 5 = 0$?
  choices:
  - text: En el punto (0, -5)
    is_correct: true
  - text: En el punto (0, 2)
    is_correct: false
  - text: En el punto (0, -3)
    is_correct: false
  - text: En el punto (0, 0)
    is_correct: false
  explanation: La alternativa correcta es 'En el punto (0, -5)'. El corte con el eje Y ocurre siempre en $(0, c) = (0, -5)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una ecuación cuadrática tiene como término independiente $c = 0$, ¿qué se puede afirmar con certeza?
  choices:
  - text: Que x = 0 es siempre una de sus soluciones.
    is_correct: true
  - text: Que la ecuacion no tiene soluciones reales.
    is_correct: false
  - text: Que la ecuacion deja de ser cuadratica.
    is_correct: false
  - text: Que ambas soluciones son obligatoriamente iguales a 1.
    is_correct: false
  explanation: La alternativa correcta es 'Que x = 0 es siempre una de sus soluciones.'. Al sustituir $x = 0$ se obtiene $a(0)^2 + b(0) + 0 = 0$, lo que satisface la igualdad.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Transponer todos los términos para dejar un miembro igual a 0.'
- 'Paso 2: Localizar el número real que no está multiplicado por ninguna potencia de $x$.'
- 'Paso 3: Registrar el valor de $c$ junto con su signo correspondiente.'
- 'Paso 4: Si todos los términos presentes contienen a la incógnita $x$, registrar $c = 0$.'
errores_correccion: '- **Error común:** Tomar el valor del lado derecho antes de transponerlo (por ejemplo, en $x^2 + 2x = 7$, decir que $c = 7$).

  - **Cómo corregirlo:** Primero debes **igualar a cero** ($x^2 + 2x - 7 = 0$), lo que da **$c = -7$**.'
ejemplos:
- titulo: 'Ejemplo 1: Constante negativa'
  enunciado: En $2x^2 + 3x - 14 = 0$, ¿cuál es el valor de c?
  alternativas:
  - '-14'
  - '14'
  - '2'
  - '3'
  respuesta: '-14'
  solucion_pasos:
  - 'Paso 1: El término independiente es $-14$, luego $c = -14$.'
- titulo: 'Ejemplo 2: Ausencia de término libre'
  enunciado: ¿Cuánto vale c en $6x^2 - 18x = 0$?
  alternativas:
  - '0'
  - '-18'
  - '6'
  - '3'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: Como no hay constante independiente, $c = 0$.'
- titulo: 'Ejemplo 3: Transposición obligatoria'
  enunciado: Para la ecuación $x^2 - 5x = 6$, ¿cuánto vale c?
  alternativas:
  - '-6'
  - '6'
  - '0'
  - '-5'
  respuesta: '-6'
  solucion_pasos:
  - 'Paso 1: Transponer: $x^2 - 5x - 6 = 0 \implies c = -6$.'
- titulo: 'Ejemplo 4: Términos constantes en ambos lados'
  enunciado: En $2x^2 + 4 = 10$, ¿cuál es el valor de c en la forma canónica?
  alternativas:
  - '-6'
  - '4'
  - '10'
  - '6'
  respuesta: '-6'
  solucion_pasos:
  - 'Paso 1: $2x^2 + 4 - 10 = 0 \implies 2x^2 - 6 = 0 \implies c = -6$.'
errores_frecuentes:
- Identificar c antes de transponer todos los términos al miembro izquierdo.
- Olvidar cambiar el signo al mover una constante de un lado a otro.
- Creer que c no puede ser cero.
afirmaciones_verdaderas:
- El término independiente c representa la constante que no acompaña a la variable en la forma general.
- Si c = 0, la ecuación cuadrática admite siempre a x = 0 como una de sus raíces.
al_terminar_debes_poder: '**QUÉ:** Identificar y extraer con exactitud el término independiente c de una ecuación cuadrática.


  **CÓMO:** Normalizando la ecuación a la forma canónica e identificando la constante libre de grado cero.


