procedimiento:
- 'Paso 1: Ordena la ecuación en forma general si aún no lo está.'
- 'Paso 2: Localiza el término numérico que no está multiplicado por ninguna potencia
  de $x$.'
- 'Paso 3: Ese número, con su signo, es el término independiente $c$; si no aparece,
  $c=0$.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en identificación del término independiente c.
ejemplos:
- titulo: Identificación directa del término independiente
  enunciado: Identifica el término independiente $c$ en $2x^2-5x+7=0$.
  solucion_pasos:
  - El único término sin $x$ es $7$.
  - $c=7$.
- titulo: Identificación de término independiente nulo
  enunciado: Identifica el término independiente $c$ en $8x^2-3x=0$.
  solucion_pasos:
  - No hay ningún término numérico suelto.
  - $c=0$.
- titulo: ¿El término independiente debe ser distinto de cero para que la ecuación
    sea cuadrática?
  enunciado: ¿El término independiente debe ser distinto de cero para que la ecuación
    sea cuadrática?
  respuesta: 'No'
  solucion_pasos:
  - Solo se exige que $a$ sea distinto de cero; $c$ puede valer cero sin afectar el
    carácter cuadrático.
- titulo: ¿El término independiente puede ser negativo?
  enunciado: ¿El término independiente puede ser negativo?
  respuesta: Sí
  solucion_pasos:
  - El signo que precede al término numérico forma parte del valor de $c$.
errores_frecuentes:
- Olvidar identificar $c=0$ cuando el término independiente no aparece explícitamente
  en la ecuación.
- Confundir el término independiente con el coeficiente $b$ cuando la ecuación no
  está ordenada.
- Omitir el signo negativo del término independiente al leer su valor.
- Pasar por alto un término independiente ubicado antes del término cuadrático o lineal
  en la ecuación sin reordenar.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_ponder: Resolver y analizar ecuaciones cuadráticas utilizando identificación
  del término independiente c.
