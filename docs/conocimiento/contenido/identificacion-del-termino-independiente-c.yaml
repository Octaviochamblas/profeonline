semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_C
resumen_inicial: 'Identificación del término independiente c: concepto, discriminante,
  soluciones y modelamiento en Conceptos y formas de la ecuación cuadrática.'
explicacion_simple: El término independiente es el único que no lleva la incógnita
  $x$ acompañándolo; es simplemente un número suelto en la ecuación.
explicacion_formal: '### Definición formal


  En la forma general $ax^2+bx+c=0$, el término independiente $c$ es el número real
  que no acompaña a ninguna potencia de $x$ (equivalentemente, el coeficiente del
  término $x^0$). No existe restricción sobre su valor: $c$ puede ser cualquier número
  real, incluido cero.


  ### Desarrollo didáctico


  Para identificar $c$, se localiza el término numérico que aparece solo, sin ninguna
  $x$ junto a él, respetando su signo. Si ese término no aparece, $c=0$.


  En $3x^2+2x-9=0$, el término independiente es $-9$. En $x^2+4x=0$, no hay término
  numérico suelto, por lo que $c=0$.'
definiciones_clave: '- **Identificación del término independiente c**: Elemento o
  técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en identificación
  del término independiente c.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando identificación del
    término independiente c.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a identificación del término
    independiente c.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
