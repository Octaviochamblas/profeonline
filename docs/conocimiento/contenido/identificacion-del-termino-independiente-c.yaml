semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_C
resumen_inicial: El término independiente $c$ es el número real constante (sin variable
  $x$) que figura en la forma general.
explicacion_simple: "Para identificar el **término independiente $c$**:\n- Busca el\
  \ número suelto que NO tiene la variable $x$.\n- Incluye siempre su signo positivo\
  \ o negativo.\n- Ejemplos:\n  - En $x^2 - 4x + 7 = 0 \\implies c = 7$.\n  - En $2x^2\
  \ + 5x - 9 = 0 \\implies c = -9$.\n  - En $x^2 - 6x = 0 \\implies c = 0$ (si no\
  \ hay número constante suelto, $c = 0$)."
explicacion_formal: 'En el polinomio $a x^2 + b x + c$, el término $c$ es la **constante
  aditiva o monomio de grado 0**:


  $$c = P(0) \quad \text{con } c \in \mathbb{R}$$


  **Desglose de la fórmula:**

  - Evaluación polinómica en el origen $x = 0$, que aísla la constante libre $c$.'
definiciones_clave: '- **Término independiente ($c$)**: Constante numérica que no
  depende de los valores que adopte la incógnita $x$.'
propiedades_relaciones: '- **Anulación de $c$**: Cuando $c = 0$, la ecuación cuadrática
  $a x^2 + b x = 0$ posee siempre la raíz trivial $x = 0$.'
ejemplo_guiado:
  enunciado: Identifica el término independiente $c$ en la ecuación $x^2 - 8x = 0$.
  pasos:
  - 'Paso 1: Observar los términos del miembro izquierdo: $x^2$ y $-8x$.Paso 2: Notar
    que ambos términos poseen la variable $x$.Paso 3: Comprobar la ausencia de una
    constante numérica libre (término de grado 0).Paso 4: Concluir que el término
    independiente es $c = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: En la ecuación $x^2 - 8x = 0$, ¿cuál es el valor del término independiente
    $c$?
  choices:
  - text: $c = 0$
    is_correct: true
  - text: $c = -8$
    is_correct: false
  - text: $c = 1$
    is_correct: false
  - text: No está definida la ecuación.
    is_correct: false
  explanation: La alternativa correcta es '$c = 0$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la ecuación $3x^2 - 5x - 14 = 0$, ¿cuál es el valor del término independiente
    $c$?
  choices:
  - text: $c = -14$
    is_correct: true
  - text: $c = 14$
    is_correct: false
  - text: $c = -5$
    is_correct: false
  - text: $c = 3$
    is_correct: false
  explanation: La alternativa correcta es '$c = -14$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trasponer todos los términos y simplificar la ecuación en la forma $a x^2
  + b x + c = 0$.'
- 'Paso 2: Identificar el término constante no acompañado de la variable $x$.'
- 'Paso 3: Extraer su valor numérico conservando su signo original.'
- 'Paso 4: Si no existe término constante, declarar $c = 0$.'
errores_correccion: '- **Error común:** Olvidar el signo negativo al declarar el término
  independiente (decir $c = 14$ en lugar de $c = -14$).

  - **Cómo corregirlo:** El signo $-$, $+$, forma parte indisoluble del coeficiente
  numérico $c$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
