semantic_id: MAT.ALG.EC_CUADR_BASE.COEFICIENTE_C
resumen_inicial: La identificación del término independiente $c$ reconoce el número constante que no contiene la incógnita en la forma general.
explicacion_simple: |
  El **término independiente $c$** es el número suelto o libre de la ecuación, que no tiene ninguna letra $x$ multiplicándolo:

  - En $3x^2 + 2x - 8 = 0$, el término independiente incluye su signo negativo: $c = -8$.
  - En $x^2 - 4x + 15 = 0$, la constante es $c = 15$.
  - En $5x^2 - 2x = 0$, **no hay constante suelta**; por lo tanto, $c = 0$.
  - **Función gráfica**: En la parábola correspondiente, $c$ es exactamente la altura donde la gráfica corta al eje vertical $Y$ en el punto $(0, c)$.
explicacion_formal: |
  Sea la ecuación cuadrática expresada en forma canónica $ax^2 + bx + c = 0$. El **término independiente $c$** es el coeficiente del término de grado 0 ($c \cdot x^0$):

  $$c = \text{coef}(x^0) \in \mathbb{R}$$

  **Propiedad de intersección ordenada:**
  El valor de $c$ determina la intersección de la curva parabólica $y = ax^2 + bx + c$ con el eje de las ordenadas (eje $Y$). Si $c = 0$, la parábola pasa obligatoriamente por el origen de coordenadas $(0,0)$.
definiciones_clave: |
  - **Término independiente $c$**: Constante numérica que no depende de la variable o incógnita en una ecuación polinómica.
propiedades_relaciones: |
  - **Relación con el producto de raíces (Vieta)**: En toda ecuación cuadrática con raíces reales $x_1$ y $x_2$, el término $c$ satisface que el producto de las soluciones es $x_1 \cdot x_2 = \frac{c}{a}$.
ejemplo_guiado:
  enunciado: 'Identifica el término independiente $c$ en las ecuaciones: a) $2x^2 + 5x - \frac{3}{4} = 0$, b) $7x^2 - 3x = 0$.'
  pasos:
    - 'Paso 1: Para $2x^2 + 5x - \frac{3}{4} = 0$, identificar la constante sin incógnita.'
    - 'Paso 2: Concluir que el término independiente es $c = -\frac{3}{4}$.'
    - 'Paso 3: Para $7x^2 - 3x = 0$, observar que no hay término constante escrito.'
    - 'Paso 4: Concluir que al no existir constante libre, $c = 0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor del término independiente $c$ en la ecuación cuadrática $x^2 + 4x - 9 = 0$?'
    choices:
      - {text: '$c = -9$', is_correct: true}
      - {text: '$c = 9$', is_correct: false}
      - {text: '$c = 4$', is_correct: false}
      - {text: '$c = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$c = -9$''. La constante numérica sin variable incluye su signo negativo.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué valor toma el término independiente $c$ en la ecuación incompleta binomia $5x^2 + 2x = 0$?'
    choices:
      - {text: '$c = 0$', is_correct: true}
      - {text: '$c = 2$', is_correct: false}
      - {text: '$c = 5$', is_correct: false}
      - {text: '$c = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$c = 0$''. Al no figurar una constante libre de incógnita, $c$ toma el valor cero.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reducir y transponer la ecuación a la forma general $ax^2 + bx + c = 0$.'
  - 'Paso 2: Buscar el término numérico constante que no contenga la incógnita $x$.'
  - 'Paso 3: Extraer dicho valor constante manteniendo su signo positivo o negativo.'
  - 'Paso 4: Si todos los términos de la ecuación reducida poseen la variable $x$, establecer $c = 0$.'
errores_correccion: |
  - **Error común:** Confundir el término independiente con el valor de la ecuación antes de igualar a cero.
  - **Cómo corregirlo:** Si la ecuación es $x^2 + 2x = 5$, **DEBES PASAR EL 5 RESTANDO** ($x^2 + 2x - 5 = 0$) para obtener $c = -5$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Término independiente fraccionario.
    alternativas:
      - '$c = -1/2$'
      - '$c = 1/2$'
      - '$c = 0$'
    respuesta: '$c = -1/2$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Término nulo en ecuación binomia.
    alternativas:
      - '$c = 0$'
      - '$c = 3$'
      - '$c = -1$'
    respuesta: '$c = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En la ecuación $x^2 + 3x = 8$, el término independiente $c$ es directamente igual a $8$ positivo sin transponer.'
  - 'El término independiente $c$ de una ecuación cuadrática debe ser un número entero diferente de cero.'
  - 'Si el término independiente $c = 0$, la ecuación cuadrática carece de soluciones numéricas.'
  - 'En la expresión $2x^2 - 4x + 7 = 0$, el término independiente es la constante $-4$.'
  - 'El término independiente $c$ incluye la variable $x^0$ escrita explícitamente en el desarrollo final.'
afirmaciones_verdaderas:
  - 'El término independiente $c$ es el coeficiente constante de grado cero en la forma general $ax^2 + bx + c = 0$, representando el valor donde la parábola corta al eje $Y$.'
  - 'En ecuaciones incompletas binomias de la forma $ax^2 + bx = 0$, el término independiente $c$ es nulo ($c = 0$).'
al_terminar_debes_poder: |
  QUÉ: Identificar y extraer correctamente el término independiente $c$ en ecuaciones cuadráticas.
  CÓMO: Igualar la ecuación a cero, localizar la constante sin variable e identificar su signo o asignar $c = 0$ si no está presente.
