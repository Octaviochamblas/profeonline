semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.ORTOCENTRO_OBTUSANGULO
resumen_inicial: En todo triángulo obtusángulo (aquel que posee un ángulo interior
  mayor a $90^\circ$), dos de sus alturas caen sobre las prolongaciones exteriores
  de los lados. En consecuencia, el ortocentro ($H$) se ubica estrictamente en el
  exterior del triángulo, detrás del vértice del ángulo obtuso.
explicacion_simple: '![Ortocentro en Triángulo Obtusángulo](/static/img/nodos/ubicacion-exterior-del-ortocentro-en-un-triangulo-obtusangulo-intro.svg)


  Cuando un triángulo tiene un ángulo **obtuso** (abierto, mayor que $90^\circ$):


  - **Alturas que caen afuera**: Dos de las tres alturas no caen dentro de la base,
  sino sobre la **prolongación** exterior del lado.

  - **Ortocentro exterior**: Para que las tres líneas se crucen, hay que alargarlas
  hacia afuera hasta que se toquen en el **exterior**.

  - **Detrás de la esquina obtusa**: El punto $H$ siempre queda flotando afuera, detrás
  del vértice del ángulo obtuso.

  '
explicacion_formal: "### Teorema formal\nEn todo triángulo obtusángulo $\\Delta ABC$\
  \ con ángulo obtuso en el vértice $A$ ($\alpha > 90^\\circ$), las alturas relativas\
  \ a los vértices agudos caen fuera de los lados y el ortocentro $H$ se ubica estrictamente\
  \ en el **exterior** del triángulo:\n\n$$\\alpha > 90^\\circ \\implies H \\in \\\
  operatorname{Ext}(\\Delta ABC)$$\n\n### Desglose simbólico y geométrico\n- Prolongación\
  \ de lados: Las alturas $h_b$ y $h_c$ caen sobre las prolongaciones exteriores de\
  \ $\\overline{AC}$ y $\\overline{AB}$.\n- Posición de $H$: Se sitúa en la región\
  \ exterior angular opuesta al vértice obtuso $A$.\n\n### Síntesis didáctica\nEn\
  \ triángulos obtusángulos es indispensable extender las rectas soportes de los lados\
  \ hacia el exterior para localizar el cruce de las alturas."
definiciones_clave: '- **Triángulo obtusángulo**: Triángulo que posee un ángulo interior
  estrictamente mayor que $90^\circ$ y menor que $180^\circ$.

  - **Ortocentro exterior**: Ubicación de $H$ fuera del recinto o área delimitada
  por el triángulo.

  - **Prolongación de un lado**: Extensión en línea recta de un segmento más allá
  de sus vértices extremos.

  '
propiedades_relaciones: '- **Existencia de ángulo obtuso**: $\exists \theta > 90^\circ
  \iff H \in \text{Ext}(\Delta ABC)$.

  - **Ángulo en el ortocentro exterior**: $\angle BHC = 180^\circ - \angle A$ (el
  ángulo en $H$ es agudo pues $\angle A > 90^\circ$).

  - **Cuadrilátero órtico**: El conjunto de puntos $\{A, B, C, H\}$ forma un sistema
  ortocéntrico donde cada punto es el ortocentro del triángulo formado por los otros
  tres.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ortocentro en Obtusángulo](/static/img/nodos/ubicacion-exterior-del-ortocentro-en-un-triangulo-obtusangulo-ejemplos.svg)


    En un triángulo obtusángulo $ABC$, el ángulo obtuso en el vértice $A$ mide $120^\circ$.
    Deduce la posición del ortocentro $H$ respecto al triángulo y calcula la medida
    del ángulo $\angle BHC$ que forman las alturas en dicho punto exterior.

    '
  pasos:
  - 'Paso 1: Identificar el tipo de triángulo: al tener un ángulo de $120^\circ >
    90^\circ$, es un triángulo obtusángulo.'
  - 'Paso 2: Aplicar el teorema de localización del ortocentro: en todo triángulo
    obtusángulo, el ortocentro $H$ se ubica estrictamente en el exterior.'
  - 'Paso 3: Identificar la relación angular en el ortocentro: el ángulo $\angle BHC$
    es suplementario al ángulo obtuso en $A$.'
  - 'Paso 4: Calcular la medida del ángulo: $\angle BHC = 180^\circ - \angle A = 180^\circ
    - 120^\circ = 60^\circ$.'
  - 'Paso 5: Concluir que $H$ es exterior y el ángulo $\angle BHC$ mide $60^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubica el ortocentro de un triángulo con ángulos de 25°, 35°
    y 120°?
  choices:
  - text: En el exterior del triángulo, porque tiene un ángulo obtuso ($120^\circ$)
    is_correct: true
  - text: En el interior del triángulo
    is_correct: false
  - text: En el vértice del ángulo de 120°
    is_correct: false
  - text: En el punto medio del lado más largo
    is_correct: false
  explanation: El ortocentro se ubica en el exterior del triángulo, porque tiene un
    ángulo obtuso ($120^\circ$), detrás del vértice obtuso.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en un triángulo obtusángulo el ángulo obtuso mide 135°, ¿cuánto mide
    el ángulo agudo formado por las alturas en el ortocentro exterior?
  choices:
  - text: $45^\circ$
    is_correct: true
  - text: $135^\circ$
    is_correct: false
  - text: $90^\circ$
    is_correct: false
  - text: $22.5^\circ$
    is_correct: false
  explanation: 'El ángulo agudo mide $45^\circ$, ya que es suplementario al ángulo
    obtuso: $180^\circ - 135^\circ = 45^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el vértice que contiene al ángulo obtuso ($> 90^\circ$).'
- 'Paso 2: Prolongar con líneas discontinuas los dos lados que forman el ángulo obtuso.'
- 'Paso 3: Trazar perpendiculares desde los dos vértices agudos hacia las prolongaciones
  de los lados opuestos.'
- 'Paso 4: Extender las líneas de las alturas hacia afuera del triángulo hasta que
  se intersecten en el ortocentro exterior $H$.'
errores_correccion: 'No intentes forzar las alturas dentro del triángulo si este es
  obtusángulo: dos de ellas caen obligatoriamente sobre las prolongaciones exteriores.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el ángulo obtuso de un triángulo mide $110^\circ$, ¿cuál es la medida
    del ángulo formado por las alturas en el ortocentro exterior?
  alternativas:
  - $70^\circ$
  - $110^\circ$
  - $20^\circ$
  respuesta: $70^\circ$
  solucion_pasos:
  - 'Por suplementariedad: $180^\circ - 110^\circ = 70^\circ$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuántas alturas de un triángulo obtusángulo quedan situadas en el exterior
    de la región triangular?
  alternativas:
  - $2\text{ alturas}$
  - $3\text{ alturas}$
  - $1\text{ altura}$
  respuesta: $2\text{ alturas}$
  solucion_pasos:
  - La altura desde el vértice obtuso cae dentro de la base opuesta (interior), mientras
    que las dos alturas desde los vértices agudos caen sobre las prolongaciones exteriores.
- titulo: ¿El ortocentro de un triángulo obtusángulo está siempre fuera del triángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una propiedad geométrica invariable de todos los triángulos obtusángulos.
- titulo: ¿Un triángulo obtusángulo puede tener dos ángulos mayores a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, porque la suma de los tres ángulos interiores debe ser estrictamente $180^\circ$.
errores_frecuentes:
- Intentar trazar las tres alturas dentro de un triángulo obtusángulo.
- Creer que un triángulo obtusángulo no tiene ortocentro porque las alturas divergen
  en el interior.
- Olvidar prolongar los lados para encontrar el pie de la altura exterior.
- Confundir la ubicación exterior del ortocentro con la del circuncentro (ambos son
  exteriores en obtusángulos, pero en posiciones distintas).
- Calcular erróneamente el ángulo del ortocentro restando de 90° en vez de 180°.
afirmaciones_verdaderas:
- En todo triángulo obtusángulo el ortocentro se ubica estrictamente en el exterior
  del triángulo.
- Exactamente dos de las tres alturas de un triángulo obtusángulo caen sobre las prolongaciones
  exteriores de los lados.
al_terminar_debes_poder: '**QUÉ:** Identificar, trazar y justificar la posición exterior
  del ortocentro en triángulos obtusángulos.


  **CÓMO:** Prolongando los lados adyacentes al ángulo obtuso, proyectando las alturas
  perpendiculares exteriores y calculando el ángulo suplementario en $H$ ($\angle
  BHC = 180^\circ - \angle A$).


  ![Resumen de Ortocentro en Obtusángulo](/static/img/nodos/ubicacion-exterior-del-ortocentro-en-un-triangulo-obtusangulo-resumen.svg)

  '
