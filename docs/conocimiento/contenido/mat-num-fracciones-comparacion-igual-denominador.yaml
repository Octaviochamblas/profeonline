semantic_id: MAT.NUM.FRACCIONES_COMPARACION.IGUAL_DENOMINADOR
resumen_inicial: "Al comparar fracciones que tienen el mismo denominador positivo, es mayor aquella fracción que posee el mayor numerador."
explicacion_simple: |
  Imagina dos pizzas exactamente iguales, ambas cortadas en 8 rebanadas. Si en la primera mesa sirven 3 rebanadas ($\frac{3}{8}$) y en la segunda sirven 5 rebanadas ($\frac{5}{8}$), ¿dónde hay más pizza? Obviamente en la segunda mesa. Como los trozos tienen exactamente el mismo tamaño (el denominador es 8), basta con mirar cuál de las dos fracciones tiene **más trozos** (el numerador más grande). Por eso, entre $\frac{5}{8}$ y $\frac{3}{8}$, $\frac{5}{8}$ es mayor.
explicacion_formal: |
  Formalmente, dadas dos fracciones $\frac{a}{c}$ y $\frac{b}{c}$ con denominador común positivo $c \in \mathbb{Z}^+$ y $a, b \in \mathbb{Z}$:
  $$\frac{a}{c} > \frac{b}{c} \iff a > b$$

  La relación de orden entre las fracciones es directamente isomorfa a la relación de orden entre sus numeradores enteros. Esto se justifica porque ambas fracciones representan múltiplos de la misma unidad fraccionaria $\frac{1}{c}$:
  $$\frac{a}{c} - \frac{b}{c} = \frac{a - b}{c}$$
  Dado que $c > 0$, la diferencia es positiva si y solo si $a - b > 0 \iff a > b$.
definiciones_clave: |
  - **Comparación de igual denominador**: Criterio directo que establece que $\frac{a}{c} > \frac{b}{c} \iff a > b$ para $c > 0$.
  - **Unidad fraccionaria común**: Unidad de medida $\frac{1}{c}$ compartida por ambas fracciones.
  - **Orden de numeradores**: Dominancia numérica determinada exclusivamente por los valores enteros de $a$ y $b$.
propiedades_relaciones: |
  - **Proporcionalidad directa**: Con denominador constante, el valor de la fracción crece proporcionalmente a medida que aumenta el numerador.
  - **Orden estricto**: Conserva las propiedades de tricotomía: exactamente una de las relaciones es cierta ($\frac{a}{c} < \frac{b}{c}$, $\frac{a}{c} = \frac{b}{c}$ o $\frac{a}{c} > \frac{b}{c}$).
  - **Aplicabilidad en adición**: Facilita el ordenamiento de listas de fracciones previamente homogenizadas a un común denominador.
ejemplo_guiado:
  enunciado: "Ordena de menor a mayor las siguientes fracciones de igual denominador: $\\frac{7}{12}$, $\\frac{2}{12}$, $\\frac{11}{12}$ y $\\frac{5}{12}$."
  pasos:
    - "Verificar que todas las fracciones compartan el mismo denominador positivo: $c = 12 > 0$."
    - 'Extraer la lista de numeradores enteros: $\{7, 2, 11, 5\}$.'
    - "Ordenar los numeradores de menor a mayor: $2 < 5 < 7 < 11$."
    - "Construir la secuencia ordenada de fracciones: $\\frac{2}{12} < \\frac{5}{12} < \\frac{7}{12} < \\frac{11}{12}$."
checkpoints:
  - placement: after_explicacion_formal
    question: "Dadas dos fracciones de igual denominador positivo $\\frac{a}{c}$ y $\\frac{b}{c}$, ¿cuál es el criterio directo para determinar cuál de ellas es mayor?"
    choices:
      - {text: 'Es mayor la fracción que tenga el mayor numerador ($a > b \implies \frac{a}{c} > \frac{b}{c}$).', is_correct: true}
      - {text: "Es mayor la fracción que tenga el menor numerador.", is_correct: false}
      - {text: "Ambas fracciones son siempre iguales por tener el mismo denominador.", is_correct: false}
      - {text: "Se deben multiplicar siempre los numeradores entre sí.", is_correct: false}
    explanation: 'La correcta es Es mayor la fracción que tenga el mayor numerador ($a > b \implies \frac{a}{c} > \frac{b}{c}$).: al compartir la misma unidad fraccionaria $\frac{1}{c}$, el mayor numerador acumula más partes.'
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Si comparas $\\frac{9}{15}$ con $\\frac{14}{15}$, ¿cuál es la relación de orden correcta?"
    choices:
      - {text: "\\frac{9}{15} < \\frac{14}{15}", is_correct: true}
      - {text: "\\frac{9}{15} > \\frac{14}{15}", is_correct: false}
      - {text: "\\frac{9}{15} = \\frac{14}{15}", is_correct: false}
      - {text: "No se pueden comparar porque falta simplificarlas.", is_correct: false}
    explanation: "La correcta es \\frac{9}{15} < \\frac{14}{15}: como el denominador es $15$ para ambas, comparamos numeradores $9 < 14$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Comprobar que los denominadores sean exactamente iguales y positivos."
  - "Paso 2: Comparar directamente los numeradores enteros $a$ y $b$."
  - 'Paso 3: Escribir la desigualdad final manteniendo la misma dirección de los numeradores ($a > b \implies \frac{a}{c} > \frac{b}{c}$).'
errores_correccion: |
  Un error común es confundir este criterio con el de igual numerador y pensar que el número de abajo es el que mandaba. Recuerda que si el denominador es el **mismo**, las partes miden lo mismo, por lo que **gana el que tiene el numerador más grande**.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál de las fracciones $\\frac{4}{9}$ o $\\frac{7}{9}$ representa la mayor cantidad?"
    alternativas:
      - "\\frac{7}{9} es mayor porque 7 > 4."
      - "\\frac{4}{9} es mayor porque 4 es menor."
      - "Son iguales."
    respuesta: "\\frac{7}{9} es mayor porque 7 > 4."
    solucion_pasos:
      - "Ambas tienen denominador 9."
      - "Comparamos los numeradores: $7 > 4$."
      - "Por lo tanto, $\\frac{7}{9} > \\frac{4}{9}$."
  - titulo: "Ejemplo 2"
    enunciado: "En un maratón, Pedro ha recorrido $\\frac{5}{8}$ de la pista y Ana ha recorrido $\\frac{3}{8}$. ¿Quién va más adelantado?"
    alternativas:
      - "Pedro va más adelantado porque \\frac{5}{8} > \\frac{3}{8}."
      - "Ana va más adelantada."
      - "Van exactamente empatados."
    respuesta: "Pedro va más adelantado porque \\frac{5}{8} > \\frac{3}{8}."
    solucion_pasos:
      - "Como las fracciones tienen igual denominador 8, comparamos $5$ y $3$."
      - "Dado que $5 > 3$, Pedro lleva una mayor fracción recorrida."
  - titulo: "¿Si dos fracciones tienen igual denominador positivo y sus numeradores son iguales, las fracciones son equivalentes?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, si $a = b$, entonces $\\frac{a}{c} = \\frac{b}{c}$."
  - titulo: "¿Se aplica la misma regla para comparar fracciones negativas de igual denominador?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, en $\\mathbb{R}$ se cumple $-\\frac{a}{c} > -\\frac{b}{c} \\iff -a > -b$."
errores_frecuentes:
  - "Invertir el signo de la desigualdad creyendo que menor numerador significa mayor valor."
  - "Intentar sacar mcm de denominadores cuando ya son exactamente iguales."
  - "Confundir el criterio de igual denominador con el de igual numerador."
  - "Olvidar verificar que los denominadores sean positivos antes de comparar los numeradores."
  - "Creer que las fracciones con denominadores grandes invierten el orden de sus numeradores."
afirmaciones_verdaderas:
  - "Para comparar dos fracciones positivas con igual denominador, basta comparar sus numeradores: a mayor numerador, mayor es la fracción."
  - "La fracción $\\frac{a}{c}$ es mayor que $\\frac{b}{c}$ (con $c > 0$) si y solo si $a > b$."
al_terminar_debes_ponder: |
  Debes ser capaz de comparar y ordenar listas de fracciones con igual denominador de forma inmediata analizando sus numeradores.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
