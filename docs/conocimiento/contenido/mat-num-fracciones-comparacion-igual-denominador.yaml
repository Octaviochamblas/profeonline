semantic_id: MAT.NUM.FRACCIONES_COMPARACION.IGUAL_DENOMINADOR
resumen_inicial: 'Para comparar fracciones positivas con el mismo denominador, es
  mayor la que tenga el mayor numerador: $\frac{a}{b} > \frac{c}{b} \iff a > c$ (con
  $b > 0$).'
explicacion_simple: Cuando dos fracciones tienen exactamente el mismo número en el
  denominador, significa que ambas están divididas en partes del mismo tamaño. Por
  lo tanto, la fracción que tenga el número de arriba más grande representa una mayor
  cantidad de esos trozos y es la mayor.
explicacion_formal: 'Dadas dos fracciones $\frac{a}{b}, \frac{c}{b} \in \mathbb{Q}$
  con denominador común positivo $b > 0$, la **Regla de Comparación Homogénea** establece
  el isomorfismo de orden:


  $$\frac{a}{b} > \frac{c}{b} \iff a > c$$


  **Desglose de la fórmula:**

  - $b > 0$: Denominador común estrictamente positivo que fija la misma escala de
  medida.

  - $a > c$: Comparación directa en el conjunto de los enteros $\mathbb{Z}$.


  > **Complemento didáctico:** Para denominadores positivos, la relación de orden
  en $\mathbb{Q}$ se reduce de forma idéntica a la relación de orden de sus numeradores
  en $\mathbb{Z}$.'
definiciones_clave: '- **Comparación de fracciones homogéneas**: Ordenamiento de fracciones
  que comparten un mismo denominador positivo $b > 0$.'
propiedades_relaciones: '- **Monotonía de la suma**: Preserva el orden estricto al
  sumar numeradores manteniendo el denominador.'
ejemplo_guiado:
  enunciado: Compare las fracciones $\frac{7}{9}$ y $\frac{4}{9}$ determinando cuál
    de ellas es mayor.
  pasos:
  - 'Paso 1: Observar los denominadores de ambas fracciones: ambos valen $9$ (denominador
    común positivo).'
  - 'Paso 2: Comparar los numeradores: $7$ y $4$.'
  - 'Paso 3: Establecer la desigualdad en los enteros: $7 > 4$.'
  - 'Conclusión: Como los numeradores cumplen $7 > 4$, la fracción $\frac{7}{9} >
    \frac{4}{9}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el criterio para comparar dos fracciones a/b y c/b que tienen
    el mismo denominador positivo b?
  choices:
  - text: Es mayor la que tiene el mayor numerador (a > c)
    is_correct: true
  - text: Es mayor la que tiene el menor numerador
    is_correct: false
  - text: Ambas son siempre iguales
    is_correct: false
  - text: Se deben sumar los denominadores
    is_correct: false
  explanation: La alternativa correcta es 'Es mayor la que tiene el mayor numerador
    (a > c)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado entre 7/9 y 4/9, ¿cuál es la fracción mayor?
  choices:
  - text: 7/9
    is_correct: true
  - text: 4/9
    is_correct: false
  - text: Son iguales
    is_correct: false
  - text: Ninguna
    is_correct: false
  explanation: La alternativa correcta es '7/9'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que los denominadores de las fracciones sean exactamente iguales
  y positivos.'
- 'Paso 2: Comparar directamente los números ubicados en los numeradores.'
- 'Paso 3: Declarar mayor a la fracción que posea el numerador más grande.'
errores_correccion: '- **Error 1: Creer que la fracción con menor numerador es la
  mayor en denominadores iguales.** **Cómo corregirlo:** Al tener partes del mismo
  tamaño, más partes implica MAYOR cantidad ($\frac{7}{9} > \frac{4}{9}$).


  - **Error 2: Ignorar los signos negativos al comparar numeradores homogenizados.**
  **Cómo corregirlo:** En negativos, el entero mayor está más cerca del cero ($-\frac{2}{5}
  > -\frac{4}{5}$ porque $-2 > -4$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Ordene de menor a mayor las fracciones: 5/11, 2/11, 9/11.'
  alternativas:
  - 2/11 < 5/11 < 9/11
  - 9/11 < 5/11 < 2/11
  - 5/11 < 2/11 < 9/11
  respuesta: 2/11 < 5/11 < 9/11
  solucion_pasos:
  - 'Comparando numeradores: $2 < 5 < 9 \implies 2/11 < 5/11 < 9/11$.'
- titulo: Ejemplo 2
  enunciado: ¿Es la fracción 11/15 mayor que 14/15?
  alternativas:
  - No, porque 11 < 14
  - Sí, porque 15 es igual
  - Sí, porque 11 es primo
  respuesta: No, porque 11 < 14
  solucion_pasos:
  - $11 < 14 \implies 11/15 < 14/15$.
- titulo: ¿Si dos fracciones tienen igual denominador se decide cuál es mayor mirando
    sus numeradores?
  respuesta: Sí
  solucion_pasos:
  - Sí, a igual denominador la fracción mayor tiene el numerador mayor.
- titulo: ¿Es 3/8 mayor que 5/8?
  respuesta: 'No'
  solucion_pasos:
  - No, $3 < 5$ por lo que $3/8 < 5/8$.
errores_frecuentes:
- Al comparar fracciones de igual denominador positivo es mayor la que posee el menor
  numerador.
- Sumar el denominador a los numeradores invierte la desigualdad en las fracciones
  homogéneas.
- Para fracciones de igual denominador se debe calcular previamente su mínimo común
  múltiplo.
- La fracción $-3/7$ es menor que $-5/7$ en la recta numérica.
- Dos fracciones con el mismo denominador son siempre equivalentes entre sí.
afirmaciones_verdaderas:
- Para fracciones de igual denominador positivo, la de mayor numerador representa
  la cantidad de mayor valor.
- La relación de orden entre $\frac{a}{b}$ y $\frac{c}{b}$ ($b > 0$) equivale estrictamente
  al orden de $a$ y $c$ en $\mathbb{Z}$.
al_terminar_debes_poder: Al terminar serás capaz de comparar fracciones de igual denominador,
  ordenándolas directamente mediante la comparación de sus numeradores enteros.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
