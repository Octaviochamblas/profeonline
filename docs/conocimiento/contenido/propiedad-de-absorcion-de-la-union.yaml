semantic_id: MAT.FUND.PROPIEDADES_CONJUNTOS.ABSORCION_UNION
resumen_inicial: 'Demostración lógica, propiedades y consecuencias de las leyes de absorción de la unión: $A \cup (A \cap B) = A$ y absorción universal $A \cup \mathcal{U} = \mathcal{U}$.'
explicacion_simple: 'La **propiedad de absorción de la unión** se presenta en dos formas fundamentales:

  1. **Absorción conjuntista**: Al unir un conjunto $A$ con la intersección de $A$ y $B$, el resultado es simplemente el propio conjunto $A$: **$A \cup (A \cap B) = A$**. Esto pasa porque la intersección $A \cap B$ ya está completamente contenida dentro de $A$, así que no le aporta nada nuevo.

  2. **Absorción universal**: Al unir cualquier conjunto $A$ con el conjunto universal $\mathcal{U}$, el universo absorbe todo y el resultado es el universo: **$A \cup \mathcal{U} = \mathcal{U}$**.


  ![propiedad-de-absorcion-de-la-union](/static/img/nodos/propiedad-de-absorcion-de-la-union-intro.svg)'
explicacion_formal: "### Definición formal\nEn la teoría de conjuntos y el retículo booleano $(\\mathcal{P}(\\mathcal{U}), \\cup, \\cap)$, las **leyes de absorción de la unión** son:\n1. **Ley de absorción reticular**:\n   $$\\forall A, B \\subseteq \\mathcal{U}, \\quad A \\cup (A \\cap B) = A$$\n   Demostración formal: Como $(A \\cap B) \\subseteq A$ y $A \\subseteq A$, por la propiedad de unión de subconjuntos $X \\subseteq Y \\implies X \\cup Y = Y$, se deduce inmediatamente que $(A \\cap B) \\cup A = A$.\n2. **Ley de dominación / absorción universal**:\n   $$\\forall A \\subseteq \\mathcal{U}, \\quad A \\cup \\mathcal{U} = \\mathcal{U}$$\n   Demostración: $x \\in (A \\cup \\mathcal{U}) \\iff x \\in A \\lor x \\in \\mathcal{U} \\iff x \\in A \\lor V \\iff V \\iff x \\in \\mathcal{U}$.\n\n### Desglose simbólico\n- Tautologías lógicas subyacentes:\n  - Absorción lógica: $P \\lor (P \\land Q) \\equiv P$.\n  - Dominación lógica: $P \\lor V \\equiv V$.\n- Invarianza en diagramas de Venn: La\
  \ superficie de $A \\cup (A \\cap B)$ coincide exactamente con el círculo de $A$.\n\n> **Complemento didáctico:** La absorción simplifica expresiones mixtas donde un término contiene estructuralmente al otro.\n"
definiciones_clave: '- **Ley de absorción reticular**: Identidad $A \cup (A \cap B) = A$ que colapsa una operación mixta en el operando principal.

  - **Elemento absorbente (dominación)**: El conjunto $\mathcal{U}$ que absorbe a cualquier conjunto bajo la unión ($A \cup \mathcal{U} = \mathcal{U}$).

  - **Inclusión subordinada**: Principio por el cual la unión con un subconjunto no expande el conjunto contenedor.

  '
propiedades_relaciones: '- **Dualidad con la intersección**: La ley dual de absorción para la intersección es $A \cap (A \cup B) = A$ y $A \cap \emptyset = \emptyset$.

  - **Estructura de retículo**: Las leyes de absorción son los axiomas que vinculan las operaciones $\cup$ y $\cap$ para asegurar la coherencia del orden parcial $\subseteq$.

  '
ejemplo_guiado:
  enunciado: 'Dados los conjuntos $A = \{1, 2, 3\}$ y $B = \{2, 3, 4, 5\}$, demuestra por extensión que $A \cup (A \cap B) = A$.


    ![Ejemplo propiedad-de-absorcion-de-la-union](/static/img/nodos/propiedad-de-absorcion-de-la-union-ejemplos.svg)'
  pasos:
  - 'Paso 1: Calcular la intersección del paréntesis $A \cap B$: - Elementos comunes a $A$ y $B$: $\{2, 3\}$.'
  - 'Paso 2: Plantear la unión de $A$ con el resultado obtenido: - $A \cup (A \cap B) = \{1, 2, 3\} \cup \{2, 3\}$.'
  - 'Paso 3: Realizar la unión reuniendo los elementos sin duplicar: - $\{1, 2, 3\} \cup \{2, 3\} = \{1, 2, 3\}$.'
  - 'Paso 4: Comparar con el conjunto inicial: $\{1, 2, 3\} = A$.'
  - 'Paso 5: Concluir formalmente la validez de la ley de absorción $A \cup (A \cap B) = A$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale directamente la expresión booleana $X \cup (X \cap Y)$ por la ley de absorción?
  choices:
  - text: $X$
    is_correct: true
  - text: $Y$
    is_correct: false
  - text: $X \cap Y$
    is_correct: false
  - text: $X \cup Y$
    is_correct: false
  explanation: La alternativa correcta es '$X$'. La ley de absorción de la unión establece que $X \cup (X \cap Y) = X$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿Cuál es el resultado de operar cualquier conjunto $A$ con el conjunto universal mediante la unión: $A \cup \mathcal{U}$?'
  choices:
  - text: $\mathcal{U}$ (el conjunto universal absorbe a $A$)
    is_correct: true
  - text: $A$
    is_correct: false
  - text: $\emptyset$
    is_correct: false
  - text: $A^c$
    is_correct: false
  explanation: La alternativa correcta es '$\mathcal{U}$ (el conjunto universal absorbe a $A$)'. El universo es el elemento absorbente de la unión.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar en una expresión la forma $A \cup (A \cap B)$ o $A \cup \mathcal{U}$.'
- 'Paso 2: Comprobar que el término exterior $A$ se repite dentro de la intersección subordinada.'
- 'Paso 3: Aplicar la ley lógica $P \lor (P \land Q) \equiv P$ para colapsar toda la expresión en $A$.'
- 'Paso 4: Si se trata de $A \cup \mathcal{U}$, aplicar la ley de dominación $P \lor V \equiv V$ para colapsar en $\mathcal{U}$.'
errores_correccion: '- **Error 1:** Desarrollar distributivamente $A \cup (A \cap B)$ como $(A \cup A) \cap (A \cup B)$ sin reconocer la absorción directa. **Cómo corregirlo:** La absorción colapsa directamente en $A$ sin necesidad de pasos intermedios complejos.

  - **Error 2:** Creer que $A \cup \mathcal{U} = A$. **Cómo corregirlo:** En la unión con el universo, el resultado es el universo completo $\mathcal{U}$ (absorbente); el que da $A$ es la intersección $A \cap \mathcal{U} = A$ (neutro).

  '
ejemplos:
- titulo: Absorción con números
  enunciado: Dado $A = \{10, 20\}$ y $B = \{20, 30\}$, ¿cuál es $A \cup (A \cap B)$?
  alternativas:
  - $\{10, 20\}$
  - $\{20\}$
  - $\{10, 20, 30\}$
  respuesta: $\{10, 20\}$
  solucion_pasos:
  - 1. Por la ley de absorción, el resultado es $A = \{10, 20\}$.
- titulo: Absorción universal con el vacío
  enunciado: ¿Cuánto vale $\emptyset \cup \mathcal{U}$?
  respuesta: $\mathcal{U}$
  solucion_pasos:
  - El universo absorbe a cualquier conjunto en la unión.
  alternativas:
  - texto: $\mathcal{U}$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
- titulo: Simplificación de expresión anidada
  enunciado: Simplifica $(A \cup B) \cup ((A \cup B) \cap C)$.
  respuesta: $A \cup B$
  solucion_pasos:
  - Llamando $X = A \cup B$, la expresión es $X \cup (X \cap C) = X = A \cup B$.
  alternativas:
  - texto: $A \cup B$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
- titulo: Absorción con complementos
  enunciado: ¿A qué es igual $A \cup (A \cap A^c)$?
  respuesta: $A$
  solucion_pasos:
  - $A \cup \emptyset = A$.
  alternativas:
  - texto: $A$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
errores_frecuentes:
- La afirmación de que $A \cup (A \cap B)$ es igual a la intersección $A \cap B$.
- La afirmación de que la unión de un conjunto con el conjunto universal produce el conjunto $A$.
- La afirmación de que la ley de absorción de la unión requiere que $A$ y $B$ sean conjuntos disjuntos.
- La afirmación de que la absorción no es aplicable a expresiones con uniones compuestas.
- La afirmación de que $A \cup \mathcal{U}$ es igual al conjunto vacío.
afirmaciones_verdaderas:
- La ley de absorción de la unión establece que $A \cup (A \cap B) = A$ para cualquier par de conjuntos $A$ y $B$.
- El conjunto universal $\mathcal{U}$ es el elemento absorbente de la unión, cumpliendo $A \cup \mathcal{U} = \mathcal{U}$ para todo $A \subseteq \mathcal{U}$.
al_terminar_debes_poder: 'QUÉ: Enunciar, demostrar y aplicar las leyes de absorción de la unión ($A \cup (A \cap B) = A$ y $A \cup \mathcal{U} = \mathcal{U}$).

  CÓMO: Simplificar expresiones booleanas aplicando la tautología $P \lor (P \land Q) \equiv P$ y la dominación disyuntiva $P \lor V \equiv V$.


  ![Resumen propiedad-de-absorcion-de-la-union](/static/img/nodos/propiedad-de-absorcion-de-la-union-resumen.svg)'
