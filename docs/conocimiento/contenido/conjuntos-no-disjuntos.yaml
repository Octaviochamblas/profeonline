semantic_id: MAT.FUND.RELACIONES_CONJUNTOS.CONJUNTOS_NO_DISJUNTOS
resumen_inicial: Definición, características y condición algebraica ($A \cap B \neq \emptyset$) de los conjuntos no disjuntos o secantes.
explicacion_simple: '![Infografía: Conjuntos secantes, solape de elementos e inclusión-exclusión](/static/img/nodos/conjuntos-no-disjuntos-intro.svg)


  Dos conjuntos son **no disjuntos** (o secantes/solapados) cuando **tienen al menos un elemento en común** (su intersección no está vacía: **$A \cap B \neq \emptyset$**). Por ejemplo, si $A = \{1, 2, 3\}$ y $B = \{3, 4, 5\}$, ambos conjuntos comparten el número **$3$**, por lo que son **no disjuntos**. En los diagramas de Venn, los conjuntos no disjuntos se dibujan como dos círculos que se cruzan y forman una zona central compartida.

  '
explicacion_formal: '### Definición formal

  En la teoría de conjuntos, dos conjuntos $A$ y $B$ son **no disjuntos (o secantes)** si y solo si su intersección es no vacía:

  $$A \cap B \neq \emptyset \quad \iff \quad \exists x \, (x \in A \land x \in B)$$

  La existencia de al menos un elemento común $x_0 \in A \cap B$ obliga a aplicar el **Principio de Inclusión-Exclusión** para el cómputo de la cardinalidad de la unión:

  $$|A \cup B| = |A| + |B| - |A \cap B| < |A| + |B|$$


  ### Desglose simbólico

  - Condición formal: $\exists x_0 \in \mathcal{U}, \, (x_0 \in A \land x_0 \in B)$.

  - Zona de solapamiento en diagramas de Venn: Región central no vacía $A \cap B$.

  - Desigualdad de no inclusión en el complemento: $A \cap B \neq \emptyset \iff A \not\subseteq B^c$.


  ### Síntesis didáctica

  Los conjuntos no disjuntos estructuran los problemas de probabilidad conjunta y los sistemas de clasificación múltiple donde los objetos comparten características simultáneas.

  '
definiciones_clave: '- **Conjuntos no disjuntos**: Dos conjuntos que comparten al menos un elemento común ($A \cap B \neq \emptyset$).

  - **Región de intersección**: Conjunto formado por todos los miembros compartidos simultáneamente por $A$ y $B$.

  - **Principio de inclusión-exclusión**: Regla de conteo requerida para no duplicar los elementos de la intersección al calcular la unión.

  '
propiedades_relaciones: '- **Relación con subconjuntos**: Si $A \subseteq B$ y $A \neq \emptyset$, entonces $A$ y $B$ son necesariamente no disjuntos ($A \cap B = A \neq \emptyset$).

  - **Diferencia de conjuntos no disjuntos**: Si $A \cap B \neq \emptyset$, entonces $A \setminus B \subsetneq A$.

  '
ejemplo_guiado:
  enunciado: '![Diagrama: Intersección de divisores y primos con pares](/static/img/nodos/conjuntos-no-disjuntos-ejemplos.svg)


    Determina si los conjuntos $A = \{x \in \mathbb{N} \mid x \text{ es divisor de } 12\}$ y $B = \{x \in \mathbb{N} \mid x \text{ es divisor de } 18\}$ son no disjuntos y halla su intersección.'
  pasos:
  - 'Paso 1: Escribir el conjunto $A$ por extensión: $A = \{1, 2, 3, 4, 6, 12\}$.'
  - 'Paso 2: Escribir el conjunto $B$ por extensión: $B = \{1, 2, 3, 6, 9, 18\}$.'
  - 'Paso 3: Calcular la intersección $A \cap B$ extrayendo los elementos comunes: - Elementos compartidos: $1, 2, 3, 6$. - $A \cap B = \{1, 2, 3, 6\}$.'
  - 'Paso 4: Comprobar que $|A \cap B| = 4 \neq 0$, por lo que $A \cap B \neq \emptyset$.'
  - 'Paso 5: Concluir formalmente que $A$ y $B$ son **conjuntos no disjuntos** (secantes).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición matemática define que dos conjuntos $A$ y $B$ sean no disjuntos?
  choices:
  - text: Que su intersección contenga al menos un elemento ($A \cap B \neq \emptyset$)
    is_correct: true
  - text: Que su intersección sea estrictamente el conjunto vacío ($A \cap B = \emptyset$)
    is_correct: false
  - text: Que la unión de ambos sea un conjunto infinito
    is_correct: false
  - text: Que tengan exactamente la misma cardinalidad
    is_correct: false
  explanation: La alternativa correcta es 'Que su intersección contenga al menos un elemento ($A \cap B \neq \emptyset$)'. Es la definición formal de conjuntos no disjuntos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $|A| = 10$, $|B| = 8$ y $A$ y $B$ son no disjuntos con $|A \cap B| = 3$, ¿cuál es el valor de $|A \cup B|$?
  choices:
  - text: $15$
    is_correct: true
  - text: $18$
    is_correct: false
  - text: $21$
    is_correct: false
  - text: $5$
    is_correct: false
  explanation: 'La alternativa correcta es ''$15$''. Aplicando inclusión-exclusión: $|A \cup B| = 10 + 8 - 3 = 15$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar los elementos de ambos conjuntos $A$ y $B$.'
- 'Paso 2: Buscar si existe al menos un elemento común en ambos conjuntos.'
- 'Paso 3: Si se encuentra al menos un elemento compartido $x_0$, listar la intersección $A \cap B$.'
- 'Paso 4: Concluir que los conjuntos son no disjuntos ($A \cap B \neq \emptyset$).'
- 'Paso 5: Aplicar la fórmula $|A \cup B| = |A| + |B| - |A \cap B|$ si se requiere calcular cardinalidades.'
errores_correccion: '- **Error 1:** Sumar directamente $|A| + |B|$ para calcular la unión de conjuntos no disjuntos. **Cómo corregirlo:** En conjuntos no disjuntos los elementos comunes se sumarían dos veces; se debe aplicar la fórmula de inclusión-exclusión: $|A \cup B| = |A| + |B| - |A \cap B|$.

  - **Error 2:** Creer que para ser no disjuntos todos los elementos deben coincidir. **Cómo corregirlo:** La coincidencia total es igualdad ($A = B$); para ser no disjuntos basta que coincida un solo elemento ($|A \cap B| \geq 1$).

  '
ejemplos:
- titulo: Primos y pares
  enunciado: ¿Son el conjunto de primos $\mathbb{P}$ y el de pares positivos $P$ conjuntos no disjuntos?
  alternativas:
  - Sí, comparten al elemento 2
  - No, los primos son impares
  - No, su intersección es vacía
  respuesta: Sí, comparten al elemento 2
  solucion_pasos:
  - 1. $\mathbb{P} \cap P = \{2\} \neq \emptyset$.
  - 2. Son conjuntos no disjuntos.
- titulo: Inclusión como caso particular
  enunciado: Si $A \subsetneq B$ con $A \neq \emptyset$, ¿son $A$ y $B$ conjuntos no disjuntos?
  respuesta: Sí
  solucion_pasos:
  - Sí, pues $A \cap B = A \neq \emptyset$.
- titulo: Cardinalidad estricta de la unión
  enunciado: Para conjuntos no disjuntos finitos, ¿se cumple que $|A \cup B| < |A| + |B|$?
  respuesta: Sí
  solucion_pasos:
  - Sí, debido a que $|A \cap B| > 0$.
- titulo: Conjuntos con múltiples elementos comunes
  enunciado: Si $A = \{1, 2, 3, 4\}$ y $B = \{3, 4, 5, 6\}$, ¿cuántos elementos tiene la intersección?
  respuesta: $2$ elementos ($A \cap B = \{3, 4\}$)
  solucion_pasos:
  - Los elementos comunes son 3 y 4.
  alternativas:
  - $2$ elementos ($A \cap B = \{3, 4\}$)
  - $4$ elementos
  - $1$ elemento
  - $0$ elementos
errores_frecuentes:
- La afirmación de que la cardinalidad de la unión de conjuntos no disjuntos es igual a la suma directa de sus cardinalidades.
- La afirmación de que dos conjuntos deben tener todos sus elementos idénticos para clasificarse como no disjuntos.
- La afirmación de que el conjunto vacío puede ser no disjunto con algún otro conjunto.
- La afirmación de que la diferencia $A \setminus B$ de dos conjuntos no disjuntos es igual al conjunto $A$ completo.
- La afirmación de que la intersección de dos conjuntos no disjuntos es igual al conjunto universal.
afirmaciones_verdaderas:
- Dos conjuntos $A$ y $B$ son no disjuntos si y solo si poseen al menos un elemento común en su intersección ($A \cap B \neq \emptyset$).
- Para conjuntos finitos no disjuntos, el cálculo de la cardinalidad de la unión requiere la deducción de la intersección ($|A \cup B| = |A| + |B| - |A \cap B|$).
al_terminar_debes_poder: 'QUÉ: Identificar, caracterizar y operar con conjuntos no disjuntos ($A \cap B \neq \emptyset$).

  CÓMO: Hallar elementos compartidos, representarlos en diagramas de Venn y aplicar el principio de inclusión-exclusión.


  ![Cuadro resumen: Conjuntos no disjuntos, principio aditivo e inclusión](/static/img/nodos/conjuntos-no-disjuntos-resumen.svg)

  '
