procedimiento:
- 'Paso 1: Escribe la ecuación principal y=mx+b.'
- 'Paso 2: Pasa todos los términos a un lado de la ecuación, igualando a cero: mx-y+b=0.'
- 'Paso 3: Si conviene, multiplica toda la ecuación por un número para eliminar fracciones
  o decimales.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con conversión de la ecuación principal a la forma general.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de conversión de la ecuación principal a la forma
    general para determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando conversión de la ecuación principal a la forma
    general.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de conversión de la ecuación principal
    a la forma general y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de conversión de la ecuación principal a la forma
    general.
- titulo: ¿Se cumple siempre la propiedad principal de conversión de la ecuación principal
    a la forma general en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede conversión de la ecuación principal a la forma general asumir un
    valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en conversión de la ecuación principal
  a la forma general.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en conversión
  de la ecuación principal a la forma general.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en conversión de
  la ecuación principal a la forma general.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de conversión
  de la ecuación principal a la forma general.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
