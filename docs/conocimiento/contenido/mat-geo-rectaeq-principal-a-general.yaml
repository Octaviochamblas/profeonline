semantic_id: MAT.GEO.RECTA_ECUACIONES.PRINCIPAL_A_GENERAL
resumen_inicial: 'Conversión de la ecuación principal a la forma general: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Algunos procedimientos (como el cálculo de distancia de un punto
  a una recta) requieren la ecuación en forma general, por lo que es necesario saber
  convertir desde la forma principal.
explicacion_formal: '![Conversión: forma principal a general](/static/img/geometria/analitica/rectaeq-principal-a-general.svg)


  ### Definición formal


  De $y=mx+b$, pasando todos los términos a un lado: $mx-y+b=0$. Si se desea evitar
  coeficientes fraccionarios, se puede multiplicar toda la ecuación por un número
  conveniente.


  ### Desarrollo didáctico


  Para $y=-0{,}5x+2$: reagrupando, $0{,}5x+y-2=0$, o equivalentemente (multiplicando
  por 2) $x+2y-4=0$, evitando el coeficiente decimal.'
definiciones_clave: '- **Conversión de la ecuación principal a la forma general**:
  Elemento o propiedad fundamental en el estudio de geometría analítica ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a conversión de la ecuación principal a la forma
  general.'
