semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.NOTACION_CONGRUENCIA
resumen_inicial: 'El símbolo $\cong$ expresa congruencia geométrica combinando la virgulilla de semejanza ($\sim$) con el signo igual ($=$). El orden de las letras determina estrictamente los vértices homólogos.'
explicacion_simple: |
  ![Notación de Congruencia: El Símbolo ≅](/static/img/nodos/notacion-de-congruencia-mediante-el-simbolo-intro.svg)

  Se escribe $\Delta ABC \cong \Delta DEF$ para decir que dos figuras son idénticas en forma y tamaño, respetando el orden de las letras de cada esquina.
explicacion_formal: |
  ### Definición formal
  La relación de congruencia entre figuras geométricas se denota mediante el símbolo formal $\cong$. Para dos triángulos $\Delta ABC$ y $\Delta DEF$:

  $$\Delta ABC \cong \Delta DEF \iff \begin{cases} \overline{AB} \cong \overline{DE}, \ \overline{BC} \cong \overline{EF}, \ \overline{CA} \cong \overline{FD} \\ \angle A \cong \angle D, \ \angle B \cong \angle E, \ \angle C \cong \angle F \end{cases}$$

  ### Desglose simbólico y geométrico
  - $\sim$: Morfismo que preserva proporciones y ángulos (semejanza).
  - $=$: Escala unitaria de proporcionalidad ($k = 1$).
  - Distinción fundamental:
    - Notación geométrica de figuras: $\Delta ABC \cong \Delta DEF$ (figuras congruentes).
    - Notación algebraica de medidas: $AB = DE$ o $\|\overline{AB}\| = \|\overline{DE}\|$ (igualdad de números reales).

  ### Síntesis didáctica
  Escribir $\Delta ABC \cong \Delta DEF$ es una afirmación de 6 igualdades simultáneas (3 lados y 3 ángulos) ordenadas posicionalmente.
definiciones_clave: |
  - **Congruencia de figuras ($\cong$)**: Relación geométrica donde dos figuras tienen idéntica forma y tamaño.
  - **Isometría**: Transformación del plano (traslación, rotación o reflexión) que conserva distancias y ángulos.
  - **Vértices homólogos**: Vértices que ocupan la misma posición relativa en figuras congruentes.
  - **Lados y ángulos homólogos**: Elementos correspondientes que tienen exactamente la misma medida.
propiedades_relaciones: |
  - **CPCTC**: Las partes correspondientes de triángulos congruentes son congruentes entre sí.
  - **Invarianza métrica**: Si $\Delta ABC \cong \Delta DEF$, entonces $P(\Delta ABC) = P(\Delta DEF)$ y $\text{Área}(\Delta ABC) = \text{Área}(\Delta DEF)$.
  - **Cuatro Criterios Básicos**: LLL, LAL, ALA y $\text{LLA}_{>}$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Notación de Congruencia: El Símbolo ≅](/static/img/nodos/notacion-de-congruencia-mediante-el-simbolo-ejemplos.svg)

    Identifica la correspondencia de vértices y aplica los criterios de congruencia para deducir las medidas y relaciones solicitadas.
  pasos:
  - 'Paso 1: Analizar los datos geométricos dados (lados, ángulos y su posición relativa).'
  - 'Paso 2: Establecer la correspondencia de vértices homólogos entre ambos triángulos.'
  - 'Paso 3: Verificar qué criterio de congruencia (LLL, LAL, ALA o $\text{LLA}_{>}$) se cumple.'
  - 'Paso 4: Concluir formalmente $\Delta ABC \cong \Delta DEF$.'
  - 'Paso 5: Transferir las medidas incógnitas mediante el principio CPCTC.'
