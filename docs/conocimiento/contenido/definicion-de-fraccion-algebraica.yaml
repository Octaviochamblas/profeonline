errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en definición de fracción algebraica.
ejemplos:
- titulo: Conceptualmente, identifica numerador y denominador de $\frac{2a+b}{3a^2}$
  enunciado: Conceptualmente, identifica numerador y denominador de $\frac{2a+b}{3a^2}$.
  solucion_pasos:
  - 'Numerador (parte de arriba): $2a+b$.'
  - 'Denominador (parte de abajo): $3a^2$.'
  - Es el cociente de un binomio dividido por un monomio.
- titulo: Un polinomio normal como $x^2 + 5$ puede considerarse una fracción algebraica
    con denominado
  enunciado: ¿Un polinomio normal como $x^2 + 5$ puede considerarse una fracción algebraica
    con denominador 1?
  solucion_pasos:
  - Correcto, toda expresión puede escribirse sobre 1 matemáticamente.
  - 'Respuesta: Verdadero'
- titulo: 'Respecto de «Definición de fracción algebraica»: ¿Se ajusta a la definición
    esta afirmación?'
  enunciado: 'Respecto de «Definición de fracción algebraica»: ¿Se ajusta a la definición
    esta afirmación? «Una fracción algebraica es el cociente de dos expresiones algebraicas
    (generalmente polinomios), donde el denominador debe ser distinto de cero»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una fracción algebraica es el
    cociente de dos expresiones algebraicas (generalmente polinomios), donde el denominador
    debe ser distinto de cero.'
- titulo: 'Respecto de «Definición de fracción algebraica»: ¿Es compatible con el
    procedimiento esta af'
  enunciado: 'Respecto de «Definición de fracción algebraica»: ¿Es compatible con
    el procedimiento esta afirmación? «Confundir numerador con denominador»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una fracción algebraica es el
    cociente de dos expresiones algebraicas (generalmente polinomios), donde el denominador
    debe ser distinto de cero.'
errores_frecuentes:
- Confundir numerador con denominador.
- Creer que una fracción sin variables en el denominador (como $x/2$) no es algebraica.
  Sí lo es, pero también se puede escribir como un polinomio regular (1/2)*x.
- Para «¿Qué representa la línea horizontal en una fracción algebraica», la respuesta
  correcta es Una suma oculta.
- Para «¿Qué representa la línea horizontal en una fracción algebraica», la respuesta
  correcta es Una resta entre los polinomios.
- El límite de la ecuación.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando definición
