semantic_id: MAT.ALG.FRACCIONES_BASE.DEFINICION_FRACCION
resumen_inicial: 'Definición de fracción algebraica: concepto, reglas operativas y
  simplificación en Fracciones algebraicas base.'
explicacion_simple: Las fracciones no son solo para números enteros. En álgebra, dividimos
  polinomios enteros entre otros polinomios, creando fracciones algebraicas. Funcionan
  casi igual que las numéricas, pero con letras.
explicacion_formal: '### Definición formal


  Toda fracción es, por definición, una división del numerador entre el denominador.


  ### Desarrollo didáctico


  Una fracción algebraica es simplemente la división indicada de dos polinomios. Funciona
  exactamente con las mismas reglas lógicas que una fracción numérica tradicional
  (como 3/4), pero en lugar de números, sus ''pisos'' están ocupados por letras y
  expresiones algebraicas.


  Tiene dos partes fundamentales:

  - **El Numerador (Piso superior):** Es la expresión algebraica que está siendo dividida.
  Representa la ''cantidad que tienes''.

  - **El Denominador (Piso inferior):** Es la expresión algebraica que divide. Representa
  ''en cuántas partes estás dividiendo''.


  Por ejemplo: $\frac{P(x)}{Q(x)}$.

  El hecho de que sean polinomios no cambia las leyes matemáticas subyacentes. Las
  fracciones algebraicas se simplifican, se amplifican, se suman, restan, multiplican
  y dividen siguiendo exactamente los mismos protocolos que usabas en la escuela primaria
  con fracciones numéricas.'
definiciones_clave: '- **Definición de fracción algebraica**: Procedimiento o concepto
