semantic_id: MAT.ALG.FRACCIONES_BASE.DEFINICION_FRACCION
resumen_inicial: La definición de fracción algebraica consiste en expresar el cociente indicado $\frac{P(x)}{Q(x)}$ entre
  dos polinomios donde el denominador $Q(x)$ es no nulo y contiene al menos una variable.
explicacion_simple: "Una **Fracción Algebraica** es el cociente indicado entre dos expresiones algebraicas (polinomios), escrita\
  \ en la forma:\n$$\\mathbf{\frac{P(x)}{Q(x)}}$$\n- **3 CONDICIONES INDISPENSABLES**:\n  1. **Numerador $P(x)$**: Puede\
  \ ser cualquier número, monomio o polinomio (ej: $3x + 5$).\n  2. **Denominador $Q(x)$**: ¡Debe contener obligatoriamente\
  \ **al menos una variable** (letra)! (ej: $x - 2$).\n     - $\frac{3x}{5}$ **NO** es una fracción algebraica (es un polinomio\
  \ con coeficiente fraccionario $\frac{3}{5}x$).\n     - $\frac{3}{x}$ **SÍ** es una fracción algebraica.\n  3. **Denominador\
  \ no nulo ($Q(x) \neq 0$)**: ¡La división entre 0 no está definida en matemáticas!\n\n![Definición de fracción algebraica](/static/img/nodos/definicion-de-fraccion-algebraica-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $\mathbb{K}[x_1, \dots, x_n]$ el anillo de polinomios en $n$ variables sobre el cuerpo $\mathbb{K}$. Una **fracción
  algebraica** es un elemento del cuerpo de fracciones o cuerpo de funciones racionales $\mathbb{K}(x_1, \dots, x_n)$, representado
  como el cociente ordenado de dos polinomios:


  $$f(x_1, \dots, x_n) = \frac{P(x_1, \dots, x_n)}{Q(x_1, \dots, x_n)} \quad \text{con } Q \notin \mathbb{K} \text{ y } Q(x_1,
  \dots, x_n) \neq 0$$


  ### Dominio de Definición

  El dominio de la función racional asociada $f$ es el subconjunto de $\mathbb{R}^n$ donde el denominador no se anula:


  $$\operatorname{Dom}(f) = \{(x_1, \dots, x_n) \in \mathbb{R}^n \mid Q(x_1, \dots, x_n) \neq 0\}$$


  ### Síntesis didáctica

  Una fracción algebraica es un cociente entre dos polinomios que exige la presencia de variables en el denominador y restringe
  los valores que anulan a dicho denominador.

  '
definiciones_clave: '- **Fracción algebraica**: Cociente indicado $\frac{P(x)}{Q(x)}$ donde el denominador $Q(x)$ es un polinomio
  de grado mayor o igual a 1.

  - **Dominio de una fracción racional**: Conjunto de todos los números reales para los cuales el denominador no se reduce
  a cero.

  - **Polinomio numerador y denominador**: Polinomio superior $P(x)$ y polinomio inferior $Q(x)$ de la expresión fraccionaria.

  '
propiedades_relaciones: '- **Diferencia con polinomios de coeficientes fraccionarios**: Expresiones como $\frac{x}{2} = \frac{1}{2}x$
  son polinomios, mientras que $\frac{2}{x}$ es una fracción algebraica estricta.

  '
ejemplo_guiado:
  enunciado: 'Identifica cuáles de las siguientes expresiones son fracciones algebraicas: I) $\frac{x^2 - 4}{x + 2}$, II)
    $\frac{5x^3 + 1}{7}$, III) $\frac{9}{x^2 + 1}$.'
  pasos:
  - 'Paso 1: Analizamos la expresión I) $\frac{x^2 - 4}{x + 2}$: - El denominador $x + 2$ tiene la variable $x$ (grado 1).
    - **Sí es una fracción algebraica**.'
  - 'Paso 2: Analizamos la expresión II) $\frac{5x^3 + 1}{7}$: - El denominador es el número constante $7$ (no contiene variables).
    - **No es una fracción algebraica** (es un polinomio con coeficiente fraccionario).'
  - 'Paso 3: Analizamos la expresión III) $\frac{9}{x^2 + 1}$: - El denominador $x^2 + 1$ contiene la variable $x$. - **Sí
    es una fracción algebraica**.'
  - 'Conclusión: Las expresiones **I y III son fracciones algebraicas**.'
  imagen: /static/img/nodos/definicion-de-fraccion-algebraica-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la expresión $\frac{4x^2 - 1}{3}$ NO se clasifica como una fracción algebraica estricta?
  choices:
  - text: Porque su denominador es la constante 3 y no contiene ninguna variable algebraica
    is_correct: true
  - text: Porque el numerador es de grado 2
    is_correct: false
  - text: Porque no se puede simplificar
    is_correct: false
  - text: Porque 3 es un número primo
    is_correct: false
  explanation: 'La alternativa correcta es ''Porque su denominador es la constante 3 y no contiene ninguna variable algebraica''.
    Definición: el denominador debe ser un polinomio no constante con al menos una variable.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la condición fundamental que debe cumplir el denominador $Q(x)$ en toda fracción algebraica $\frac{P(x)}{Q(x)}$?
  choices:
  - text: Debe contener al menos una variable algebraica y su valor evaluado debe ser distinto de cero ($Q(x) \neq 0$)
    is_correct: true
  - text: Debe ser igual a 1
    is_correct: false
  - text: Debe ser de mayor grado que el numerador
    is_correct: false
  - text: Debe ser un número entero positivo
    is_correct: false
  explanation: La alternativa correcta es 'Debe contener al menos una variable algebraica y su valor evaluado debe ser distinto
    de cero ($Q(x) \neq 0$)'. Condición de denominadores racionales no nulos.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Inspeccionar la expresión y localizar la barra de división principal.'
- 'Paso 2: Verificar que el denominador (la expresión inferior) contenga al menos una variable.'
- 'Paso 3: Comprobar que el denominador no sea una constante numérica sin letras.'
- 'Paso 4: Declarar la expresión como una fracción algebraica válida estableciendo que el denominador debe ser distinto de
  cero.'
errores_correccion: '- **Error 1:** Clasificar polinomios de coeficientes fraccionarios (como $\frac{x}{3}$) como fracciones
  algebraicas. **Cómo corregirlo:** Una fracción algebraica **DEBE LLEVAR OBLIGATORIAMENTE LA VARIABLE EN EL DENOMINADOR ($\frac{3}{x}$)**.

  - **Error 2:** Evaluar una fracción en un valor que anula el denominador. **Cómo corregirlo:** El denominador **NUNCA PUEDE
  SER IGUAL A CERO; SE DEBEN EXCLUIR LAS RAÍCES DEL DENOMINADOR DEL DOMINIO**.

  '
ejemplos:
- titulo: Denominador con variable
  enunciado: Para $\frac{5}{x - 1}$, ¿es una fracción algebraica?
  respuesta: Sí
  solucion_pasos:
  - Sí, el denominador tiene variable.
- titulo: Denominador constante
  enunciado: Para $\frac{x^2 + 4}{2}$, ¿es una fracción algebraica estricta?
  respuesta: 'No'
  solucion_pasos:
  - No, el denominador es constante.
- titulo: Numerador constante
  enunciado: En $\frac{7}{y^3}$, ¿es una fracción algebraica válida?
  respuesta: Sí
  solucion_pasos:
  - Sí, $y^3$ está en el denominador.
- titulo: Restricción de valor
  enunciado: En $\frac{1}{x - 2}$, ¿se exige que $x \neq 2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2-2=0$ indefinido.
errores_frecuentes:
- Clasificar un polinomio con coeficientes fraccionarios como si fuese una fracción algebraica.
- Evaluar la fracción en valores numéricos que anulan el denominador.
- Intercambiar el grado del numerador con la condición de existencia de la fracción.
- Olvidar que el numerador puede ser constante pero el denominador debe llevar variables.
- Declarar que la división por cero da cero en lugar de indefinido.
afirmaciones_verdaderas:
- Una fracción algebraica es el cociente $\frac{P(x)}{Q(x)}$ donde el denominador $Q(x)$ contiene al menos una variable.
- El denominador de una fracción algebraica nunca puede ser igual a cero.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/definicion-de-fraccion-algebraica-resumen.svg)


  QUÉ: Definir e identificar fracciones algebraicas verificando que el denominador contenga variables no nulas.

  CÓMO: Analizar el cociente $\frac{P(x)}{Q(x)}$ comprobando que $Q(x)$ sea un polinomio no constante ($\operatorname{grado}(Q)
  \ge 1$) y estableciendo la condición de existencia $Q(x) \neq 0$.

  '
