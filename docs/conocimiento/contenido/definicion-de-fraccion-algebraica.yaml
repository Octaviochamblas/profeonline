semantic_id: MAT.ALG.FRACCIONES_BASE.DEFINICION_FRACCION
resumen_inicial: Una fracción algebraica es el cociente de dos expresiones algebraicas
  donde el denominador debe ser un polinomio no nulo.
explicacion_simple: 'Una fracción algebraica es una división indicada entre dos expresiones
  algebraicas, escrita en forma de fracción P/Q.

  Al igual que en las fracciones numéricas comunes, el término superior P se llama
  numerador y el inferior Q es el denominador.

  La única exigencia matemática indispensable es que el denominador Q contenga al
  menos una variable y no sea igual a cero.'
explicacion_formal: 'Una **fracción algebraica** se define como el cociente racional
  entre dos polinomios $P(x)$ y $Q(x)$ pertenecientes al anillo de polinomios $\mathbb{R}[x]$:


  $$F(x) = \frac{P(x)}{Q(x)} \quad \text{con } Q(x) \neq 0$$


  **Desglose de la fórmula:**

  - $P(x)$: Polinomio numerador de grado $\operatorname{gr}(P) \ge 0$.

  - $Q(x)$: Polinomio denominador no nulo con grado $\operatorname{gr}(Q) \ge 1$.

  - $Q(x) \neq 0$: Restricción fundamental que evita la indeterminación por división
  entre cero en los números reales.'
definiciones_clave: '- **Fracción algebraica**: Cociente indicado entre dos polinomios
  de la forma $\frac{P(x)}{Q(x)}$.

  - **Numerador y Denominador**: Expresión superior (dividendo) e inferior (divisor
  no nulo) de la fracción.'
propiedades_relaciones: '- **Cuerpos de cocientes**: Las fracciones algebraicas forman
  el cuerpo de funciones racionales sobre un anillo polinomial.

  - **Indeterminación**: La fracción carece de valor en los reales para los valores
  de $x$ que anulan el denominador.'
ejemplo_guiado:
  enunciado: Dada la expresión $F(x) = \frac{2x + 6}{x^2 - 4}$, identifica su numerador
    y denominador, confirma si es una fracción algebraica y evalúa su valor para $x
    = 3$.
  pasos:
  - 'Paso 1: Identificar el numerador $P(x) = 2x + 6$ y el denominador $Q(x) = x^2
    - 4$.'
  - 'Paso 2: Como $Q(x) = x^2 - 4$ es un polinomio no nulo con variable $x$, la expresión
    es una fracción algebraica válida.'
  - 'Paso 3: Sustituir $x = 3$: $F(3) = \frac{2(3) + 6}{(3)^2 - 4} = \frac{6 + 6}{9
    - 4} = \frac{12}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición obligatoria para que la expresión $\frac{P(x)}{Q(x)}$
    sea una fracción algebraica válida?
  choices:
  - text: El denominador $Q(x)$ debe ser un polinomio no nulo con al menos una variable.
    is_correct: true
  - text: El numerador $P(x)$ debe ser siempre de mayor grado que $Q(x)$.
    is_correct: false
  - text: El denominador $Q(x)$ debe ser una constante numérica entera.
    is_correct: false
  - text: Tanto $P(x)$ como $Q(x)$ deben ser números primos.
    is_correct: false
  explanation: La alternativa correcta es 'El denominador $Q(x)$ debe ser un polinomio
    no nulo con al menos una variable.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la fracción algebraica $\frac{2x + 6}{x^2 - 4}$ para $x = 3$,
    ¿cuál es el valor obtenido?
  choices:
  - text: $\frac{12}{5}$
    is_correct: true
  - text: $\frac{6}{5}$
    is_correct: false
  - text: $12$
    is_correct: false
  - text: $\frac{12}{13}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{12}{5}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las expresiones algebraicas en el numerador y denominador.'
- 'Paso 2: Verificar que el denominador contenga variables y no sea identicamente
  igual a cero.'
- 'Paso 3: Determinar el dominio de definición de la variable en la fracción.'
- 'Paso 4: Evaluar o simplificar la fracción según el valor o método requerido.'
errores_correccion: '- **Error común:** Confundir una expresión polinómica entera
  (como $\frac{x}{3}$) con una fracción algebraica verdadera.

  - **Cómo corregirlo:** Una expresión como $\frac{x}{3}$ es un polinomio con coeficiente
  $\frac{1}{3}$. Para ser fracción algebraica, la variable debe estar en el DENOMINADOR.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de fracción algebraica'
  enunciado: ¿Cuál de las siguientes expresiones representa una fracción algebraica
    verdadera?
  alternativas:
  - $\frac{5}{x + 2}$
  - $\frac{x + 4}{7}$
  - $3x^2 + 5x$
  respuesta: $\frac{5}{x + 2}$
  solucion_pasos:
  - 1. En $\frac{5}{x + 2}$, el denominador $x + 2$ contiene la variable $x$.
  - 2. Por tanto, $\frac{5}{x + 2}$ es una fracción algebraica.
- titulo: 'Ejemplo 2: Evaluación con resultado entero'
  enunciado: Evalúa $\frac{x^2 - 1}{x + 1}$ para $x = 4$.
  alternativas:
  - $3$
  - $5$
  - $15$
  respuesta: $3$
  solucion_pasos:
  - '1. Sustituir $x = 4$: $\frac{4^2 - 1}{4 + 1} = \frac{16 - 1}{5} = \frac{15}{5}
    = 3$.'
- titulo: ¿La expresión $\frac{x + 1}{x}$ es una fracción algebraica válida?
  respuesta: Sí
  solucion_pasos:
  - Sí. Tiene numerador $x+1$ y denominador $x$ no nulo.
- titulo: ¿La expresión $\frac{x^2 + 3}{2}$ es una fracción algebraica?
  respuesta: 'No'
  solucion_pasos:
  - No. El denominador $2$ es una constante sin variable, por lo que la expresión
    es un polinomio.
errores_frecuentes:
- La expresión $\frac{x^2}{5}$ es una fracción algebraica.
- Una fracción algebraica está definida aunque su denominador sea igual a cero.
- El numerador de una fracción algebraica jamás puede ser un número entero constante.
- Las fracciones algebraicas solo existen si el numerador y denominador tienen el
  mismo grado.
- Evaluar una fracción algebraica en $x=0$ siempre produce cero.
afirmaciones_verdaderas:
- Una fracción algebraica requiere necesariamente que la variable figure en el denominador
  de la expresión.
- El denominador de una fracción algebraica no puede tomar el valor numérico cero
  en su dominio.
al_terminar_debes_poder: Al finalizar este recurso podrás definir qué es una fracción
  algebraica e identificar correctamente numeradores y denominadores válidos.
