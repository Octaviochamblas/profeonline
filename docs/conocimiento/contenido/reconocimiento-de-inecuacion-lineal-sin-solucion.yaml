semantic_id: MAT.ALG.INECUACIONES_LINEALES.INECUACION_SIN_SOLUCION
resumen_inicial: 'Reconocimiento de inecuación lineal sin solución: relaciones de
  orden, intervalos y resolución en Resolución de inecuaciones lineales.'
explicacion_simple: En el estudio de las inecuaciones lineales, existen casos donde
  las variables se cancelan y resulta en una falsedad lógica. Esto significa que ningún
  valor real satisface la desigualdad.
explicacion_formal: '### Definición formal

  Sea una inecuación lineal de la forma $ax + b < cx + d$. Si $a = c$, la inecuación
  se reduce a $b < d$. Si la proposición matemática resultante es falsa, el conjunto
  solución es el conjunto vacío, denotado como $S = \\emptyset$.


  ### Desarrollo didáctico

  Al resolver inecuaciones, el procedimiento estándar consiste en agrupar los términos
  con la variable en un lado de la desigualdad y las constantes en el otro. Cuando
  los coeficientes de la variable son idénticos en ambos miembros, su resta resulta
  en $0x$, eliminando la variable.

  En este punto, la veracidad de la inecuación depende exclusivamente de las constantes.
  Si la desigualdad numérica resultante es absurda (por ejemplo, $3 < 1$ o $0 \\geq
  5$), se concluye que no existe ningún número real $x$ que haga verdadera la expresión
  inicial.'
definiciones_clave: '- **Reconocimiento de inecuación lineal sin solución**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a reconocimiento de inecuación lineal sin
  solución.'
