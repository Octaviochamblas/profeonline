semantic_id: MAT.ALG.INECUACIONES_LINEALES.INECUACION_SIN_SOLUCION
resumen_inicial: Una inecuación no tiene solución ($S = \emptyset$) cuando las variables
  se cancelan y se obtiene una contradicción numérica falsa.
explicacion_simple: 'A veces, al resolver una inecuación (como $2x + 5 < 2x + 1$),
  las $x$ de ambos lados se cancelan por completo ($2x - 2x = 0$).

  Al reducir los números nos queda una mentira matemática como $5 < 1$.

  Como $5 < 1$ es una contradicción imposible, concluimos que la inecuación **NO TIENE
  SOLUCIÓN** y su conjunto solución es el conjunto vacío $S = \emptyset$.'
explicacion_formal: 'Dada la inecuación reducida $0 \cdot x < b - a$ donde $b - a
  \le 0$, el **conjunto solución vacío** se formaliza como:


  $$0 < k \quad (\text{con } k \le 0) \implies \text{Contradicción matemática } \implies
  S = \emptyset$$


  **Desglose of la fórmula:**

  - $S = \emptyset$: Ningún número real $x \in \mathbb{R}$ es capaz de satisfacer
  una falsedad numérica.'
definiciones_clave: '- **Inecuación inconsistente / sin solución**: Inecuación que
  no posee soluciones en los números reales ($S = \emptyset$).

  - **Contradicción numérica**: Proposición falsa resultante tras la cancelación de
  variables (como $5 < 1$ o $0 > 4$).'
propiedades_relaciones: '- **Vacuidad del conjunto**: $|S| = 0$, ningún punto de la
  recta real satisface la inecuación.'
ejemplo_guiado:
  enunciado: Resuelve la inecuación $4x + 7 < 4x + 2$, analiza la proposición obtenida
    y determina el conjunto solución $S$.
  pasos:
  - 'Paso 1: Trasponer $4x$ al primer miembro: $4x - 4x + 7 < 2$.Paso 2: Cancelar
    las variables: $0x + 7 < 2 \implies 7 < 2$.Paso 3: Analizar la desigualdad numérica
    $7 < 2$: es una contradicción FALSO.Paso 4: Concluir que la inecuación carece
    de solución y su conjunto es $S = \emptyset$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al reducir la inecuación $4x + 7 < 4x + 2$, se obtiene la expresión $7
    < 2$. ¿Cuál es su conjunto solución $S$?
  choices:
  - text: $S = \emptyset$ (conjunto vacío, sin solución)
    is_correct: true
  - text: $S = \mathbb{R}$ (todos los números reales)
    is_correct: false
  - text: $S = [2, 7]$
    is_correct: false
  - text: $S = \{0\}$
    is_correct: false
  explanation: La alternativa correcta es '$S = \emptyset$ (conjunto vacío, sin solución)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué condición provoca que una inecuación lineal no tenga solución en
    $\mathbb{R}$?
  choices:
  - text: Que las variables se cancelen totalmente y resulte una desigualdad numérica
      falsa.
    is_correct: true
  - text: Que la variable sea multiplicada por un número positivo.
    is_correct: false
  - text: Que la solución contenga números decimales.
    is_correct: false
  - text: Que el resultado sea un intervalo abierto.
    is_correct: false
  explanation: La alternativa correcta es 'Que las variables se cancelen totalmente
    y resulte una desigualdad numérica falsa.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Agrupar las variables $x$ en un miembro.'
- 'Paso 2: Notar que los coeficientes de $x$ son idénticos y se cancelan ($0x = 0$).'
- 'Paso 3: Evaluar la veracidad de la constante restante.'
- 'Paso 4: Si la constante es Falsa, declarar $S = \emptyset$.'
errores_correccion: '- **Error común:** Escribir $S = \{0\}$ al obtener $0 < -5$.

  - **Cómo corregirlo:** $S = \{0\}$ significa que el número cero es solución. Si
  es imposible, se escribe el conjunto vacío $S = \emptyset$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de
    números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
  - 'Al reducir una inecuación a la falsedad $0x > 5$, se concluye que el conjunto solución es todo $\mathbb{R}$.'
  - 'Una inecuación que resulta en una contradicción numérica como $-2 > 3$ admite a $x = 0$ como solución particular.'
  - 'El conjunto vacío $\emptyset$ como solución de una inecuación significa que la ecuación cuadrática asociada tiene dos raíces reales.'
  - 'La inecuación $x + 1 < x$ se satisface para todos los números reales negativos.'
  - 'Toda inecuación lineal sin solución debe contener coeficientes irracionales o complejos.'
afirmaciones_verdaderas:
  - 'Si el despeje de una inecuación elimina la variable y conduce a una contradicción numérica ($0x > k$ con $k > 0$), el conjunto solución es el conjunto vacío $\emptyset$.'
  - 'Una inecuación sin solución carece de elementos en $\mathbb{R}$ que hagan verdadera la desigualdad.'
al_terminar_debes_poder: |
  QUÉ: Reconocer e interpretar inecuaciones lineales que carecen de solución en $\mathbb{R}$.
  CÓMO: Simplificar la inecuación, verificar la anulación de la variable $0x$, identificar la contradicción numérica constante y declarar $S = \emptyset$.
fuente: 'Texto escolar MINEDUC — Álgebra / Inecuaciones Lineales'
