procedimiento:
- Simplificar las expresiones algebraicas en ambos lados de la inecuación.
- Agrupar los términos con la incógnita en un miembro y las constantes en el otro.
- Observar si los términos con la variable se anulan mutuamente, resultando en $0x$.
- Evaluar la desigualdad numérica resultante; si es una falsedad, concluir que el
  conjunto solución es vacío.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en reconocimiento de inecuación
  lineal sin solución.
ejemplos:
- titulo: Inecuación con términos idénticos restados
  enunciado: Resolver la inecuación $2x + 5 > 2x + 8$.
  solucion_pasos:
  - Restar $2x$ en ambos lados para agrupar las variables - $2x - 2x + 5 > 8$.
  - Simplificar - $5 > 8$.
  - Como $5 > 8$ es una afirmación falsa, la inecuación original no tiene solución.
    $S = \\emptyset$.
- titulo: Inecuación con desarrollo de paréntesis
  enunciado: Encontrar el conjunto solución de $3(x - 2) \\leq 3x - 10$.
  solucion_pasos:
  - Distribuir el $3$ en el lado izquierdo - $3x - 6 \\leq 3x - 10$.
  - Restar $3x$ en ambos miembros - $-6 \\leq -10$.
  - Analizar la desigualdad numérica - $-6$ no es menor o igual a $-10$, por lo tanto,
    es falsa.
  - Concluir que no existe solución real. $S = \\emptyset$.
- titulo: Pregunta sobre veracidad tras simplificar
  respuesta: Falso
  solucion_pasos:
  - '{"Analizar la afirmación": "si al cancelar las variables obtenemos $4 < 4$, la
    afirmación es falsa porque $4$ es igual a $4$, no estrictamente menor."}'
  - Al ser una proposición falsa, la inecuación no tiene solución.
- titulo: Pregunta sobre conjunto solución vacío con cero
  respuesta: Verdadero
  solucion_pasos:
  - '{"Identificar la forma de la inecuación": "al restar los términos semejantes
    se obtiene $0 \\\\geq 7$."}'
  - Comprobar que $0$ no es mayor o igual que $7$, lo que constituye una contradicción
    matemática.
  - Por lo tanto, es correcto afirmar que el conjunto solución es vacío.
errores_frecuentes:
- Asumir que $0x > 5$ implica que $x$ puede tomar cualquier valor real.
- Concluir que $x = 0$ es la solución cuando la variable se cancela al reducir términos
  semejantes.
- Confundir la falsedad de la proposición numérica con un error de cálculo y forzar
  una solución.
- Creer que una desigualdad estricta falsa como $2 < 2$ tiene a $x = 2$ como solución.
- Anotar el conjunto solución como el número cero en lugar del conjunto vacío $\\emptyset$.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  reconocimiento de inecuación lineal sin solución.
