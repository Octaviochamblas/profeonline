semantic_id: MAT.GEO.CARTESIANO_BASE.ORIGEN_COORDENADAS
resumen_inicial: 'Identificación del origen del sistema cartesiano: conceptos, teoremas,
  propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: 'El origen es el ''punto cero'' del plano cartesiano: el lugar
  exacto donde ambos ejes se cruzan, la referencia desde la cual se miden todas las
  coordenadas.'
explicacion_formal: '![Origen del sistema cartesiano](/static/img/geometria/cartesiano-vectores/cartesiano-origen.svg)


  ### Definición formal


  El origen $O$ del sistema cartesiano es el único punto donde se intersectan el eje
  de las abscisas y el eje de las ordenadas. Sus coordenadas son siempre $(0,0)$.


  ### Desarrollo didáctico


  En la figura, el punto resaltado en el cruce de ambos ejes es el origen. Todas las
  coordenadas de cualquier otro punto del plano se miden tomando como referencia este
  punto.'
definiciones_clave: '- **Identificación del origen del sistema cartesiano**: Elemento
  o propiedad fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del origen del sistema cartesiano.'
ejemplo_guiado:
  enunciado: En el plano cartesiano referente a identificación del origen del sistema
    cartesiano, se consideran las coordenadas $A(8, 7)$ y $B(5, 8)$. Determina la
    medida o vector resultante.
  pasos:
  - Aplicar la fórmula cartesiana de identificación del origen del sistema cartesiano.
  - Sustituir las coordenadas $A(8, 7)$ y $B(5, 8)$.
  - Obtener el resultado final en el plano cartesiano.
