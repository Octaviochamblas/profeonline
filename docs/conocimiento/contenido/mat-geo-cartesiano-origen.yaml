procedimiento:
- 'Paso 1: Identifica el punto donde se cruzan el eje de las abscisas y el eje de
  las ordenadas.'
- 'Paso 2: Reconoce ese punto como el origen del sistema cartesiano.'
- 'Paso 3: Recuerda que las coordenadas del origen son siempre (0,0).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con identificación del origen del sistema cartesiano.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de identificación del origen del sistema cartesiano
    para determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando identificación del origen del sistema cartesiano.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de identificación del origen del sistema
    cartesiano y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de identificación del origen del sistema cartesiano.
- titulo: ¿Se cumple siempre la propiedad principal de identificación del origen del
    sistema cartesiano en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación del origen del sistema cartesiano asumir un valor
    negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en identificación del origen del sistema
  cartesiano.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en identificación
  del origen del sistema cartesiano.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en identificación
  del origen del sistema cartesiano.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de identificación
  del origen del sistema cartesiano.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
al_terminar_debes_poder: Identificar, calcular y aplicar las propiedades de identificación
