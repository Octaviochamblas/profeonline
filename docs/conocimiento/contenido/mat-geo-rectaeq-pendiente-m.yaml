semantic_id: MAT.GEO.RECTA_ECUACIONES.PENDIENTE_M
resumen_inicial: 'Identificación de la pendiente m en la ecuación principal de la
  recta: conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica
  Ampliada.'
explicacion_simple: 'La pendiente indica qué tan inclinada está una recta y en qué
  dirección: cuánto cambia y por cada unidad que cambia x.'
explicacion_formal: '![Pendiente m de una recta](/static/img/geometria/analitica/rectaeq-pendiente-m.svg)


  ### Definición formal


  La pendiente $m$ de una recta $y=mx+b$ es el coeficiente que acompaña a $x$, e indica
  que por cada aumento de 1 unidad en $x$, $y$ aumenta (o disminuye, si $m<0$) en
  $m$ unidades.


  ### Desarrollo didáctico


  En la figura, la recta tiene pendiente $m=1{,}5$: al avanzar 2 unidades en x (Δx=2),
  y aumenta 3 unidades (Δy=3), cumpliéndose que $m=\dfrac{3}{2}=1{,}5$.'
