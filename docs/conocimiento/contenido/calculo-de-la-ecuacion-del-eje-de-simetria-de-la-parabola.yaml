errores_frecuentes:
  - 'Escribir el resultado como una constante numérica sin anteponer $x =$ omitiendo la forma de ecuación de recta.'
  - 'La equiparación de la recta vertical $x = h$ con una recta horizontal $y = k$.'
  - 'La ausencia del signo menos al aplicar la fórmula $x = -b / (2a)$.'
  - 'La creencia de que si $b = 0$, la parábola carece de eje de simetría.'
  - 'La equiparación entre las raíces $x_1, x_2$ y la posición del eje de simetría en parábolas asimétricas respecto al origen.'
afirmaciones_verdaderas:
  - 'La ecuación del eje de simetría de una parábola es siempre la recta vertical $x = -b/(2a)$ que pasa por la abscisa del vértice.'
  - 'Puntos de la parábola situados a la misma altura $y$ se encuentran a distancias exactamente iguales del eje de simetría.'
al_terminar_debes_poder: |
  QUÉ: Calcular y escribir la ecuación del eje de simetría de una parábola.
  CÓMO: Aplicar $x = -b/(2a)$ o el punto medio de ceros reales y formular la ecuación de la recta vertical $x = k$.
