semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.EJE_SIMETRIA
resumen_inicial: El cálculo de la ecuación del eje de simetría de la parábola determina la recta vertical $x = -\frac{b}{2a}$ que biseca la curva en dos ramas especularmente simétricas, pasando exactamente por el vértice.
explicacion_simple: "![El cálculo de la ecuación del eje de simetría de la parábola determina la recta vertical $x = -\\frac{b}{2a}$ que biseca la curva en dos ramas especularmente simétricas, pasando exactamente por el vértice](/static/img/nodos/calculo-de-la-ecuacion-del-eje-de-simetria-de-la-parabola-intro.svg)\n\n\nEl **eje de simetría** es la línea vertical imaginaria que parte la parábola exactamente en dos mitades iguales:\n\n- **¿Cómo se calcula?** Con la fórmula mágica:\n  $$x = -\\frac{b}{2a}$$\n- **¿Cómo se escribe?** Al ser una recta vertical, su ecuación SIEMPRE se escribe como **$x = \\text{número}$** (ej: $x = 3$). ¡Nunca escribas solo el número suelto!\n- **Propiedad del espejo:** Si tomas cualquier punto en la parábola y mides la distancia horizontal hacia el eje de simetría, al otro lado a la misma distancia encontrarás su punto gemelo con la misma altura."
explicacion_formal: 'Sea $f(x) = ax^2 + bx + c$ con $a \neq 0$. El **eje de simetría axial** $\mathcal{L}_{\text{sim}}$ es la variedad afín unidimensional vertical:

  $$\mathcal{L}_{\text{sim}} = \left\{ (x, y) \in \mathbb{R}^2 \;\middle|\; x = -\frac{b}{2a} \right\}$$


  **Teorema de Simetría Especular Reflexiva**:

  Para cualquier traslación horizontal $h \in \mathbb{R}$:

  $$f(x_v + h) = f(x_v - h)$$

  Demostración: $f(x_v \pm h) = a(x_v \pm h)^2 + b(x_v \pm h) + c = a h^2 + f(x_v)$, que es par respecto a $h$.


  **Cálculo alternativo mediante ceros reales**:

  Si $\mathcal{Z}(f) = \{x_1, x_2\}$, el eje de simetría es la mediatriz del segmento que une los ceros:

  $$x = \frac{x_1 + x_2}{2}$$'
definiciones_clave: '- **Eje de simetría**: Recta vertical $x = -\frac{b}{2a}$ respecto a la cual la gráfica es invariante por reflexión bilateral.

  - **Abscisa de simetría**: Valor $x_v$ que define la posición horizontal de la recta.'
propiedades_relaciones: '- **Perpendicularidad al eje X**: El eje de simetría es siempre ortogonal al eje de abscisas y paralelo al eje de ordenadas.

  - **Caso de eje en el origen**: Si $b = 0$, la ecuación del eje de simetría es $x = 0$ (el propio eje $Y$).'
ejemplo_guiado:
  enunciado: '![Ejemplo El cálculo de la ecuación del eje de simetría de la parábola determina la recta vertical $x = -\frac{b}{2a}$ que biseca la curva en dos ramas especularmente simétricas, pasando exactamente por el vértice](/static/img/nodos/calculo-de-la-ecuacion-del-eje-de-simetria-de-la-parabola-ejemplos.svg)



    Calcula la ecuación del eje de simetría para:

    1) $f(x) = 3x^2 - 12x + 7$

    2) Una parábola cuyos cortes con el eje X están en $x_1 = -4$ y $x_2 = 10$.'
  pasos:
  - 'Paso 1: Para $f(x) = 3x^2 - 12x + 7$:

    - Coeficientes: $a = 3, b = -12$.

    - Aplicar fórmula: $x = -\frac{-12}{2(3)} = \frac{12}{6} = 2$.

    - Ecuación formal: Recta $x = 2$.'
  - 'Paso 2: Para los ceros $x_1 = -4$ y $x_2 = 10$:

    - Punto medio: $x = \frac{-4 + 10}{2} = \frac{6}{2} = 3$.

    - Ecuación formal: Recta $x = 3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación del eje de simetría de la función $f(x) = -2x^2 + 8x - 1$?
  choices:
  - text: x = 2
    is_correct: true
  - text: x = -2
    is_correct: false
  - text: y = 2
    is_correct: false
  - text: x = 4
    is_correct: false
  explanation: La alternativa correcta es 'x = 2'. $x = -8/(2(-2)) = -8/(-4) = 2 \implies x = 2$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola tiene como ceros a x = -6 y x = 2, ¿cuál es su eje de simetría?
  choices:
  - text: x = -2
    is_correct: true
  - text: x = -4
    is_correct: false
  - text: x = 2
    is_correct: false
  - text: x = 0
    is_correct: false
  explanation: La alternativa correcta es 'x = -2'. $x = (-6 + 2)/2 = -4/2 = -2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer los coeficientes $a$ y $b$ de la función.'
- 'Paso 2: Sustituir en la expresión $x = -\frac{b}{2a}$ o calcular el promedio de ceros $\frac{x_1 + x_2}{2}$.'
- 'Paso 3: Resolver la fracción simplificando signos.'
- 'Paso 4: Escribir la ecuación en la forma lineal vertical $x = k$.'
errores_correccion: '- **Error común:** Escribir la respuesta como $y = 3$ o simplemente el número $3$.

  - **Cómo corregirlo:** Al ser una recta vertical, **debe escribirse obligatoriamente como $x = 3$**.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficientes enteros'
  enunciado: En $f(x) = x^2 - 10x + 21$, ¿cuál es el eje de simetría?
  alternativas:
  - x = 5
  - x = -5
  - y = 5
  - x = 10
  respuesta: x = 5
  solucion_pasos:
  - 'Paso 1: $x = -(-10)/(2(1)) = 5 \implies x = 5$.'
- titulo: 'Ejemplo 2: Función cuadrática pura (b = 0)'
  enunciado: ¿Cuál es la ecuación del eje de simetría de $g(x) = -5x^2 + 8$?
  alternativas:
  - x = 0 (Eje Y)
  - x = 8
  - y = 0
  - x = -5
  respuesta: x = 0 (Eje Y)
  solucion_pasos:
  - 'Paso 1: $b = 0 \implies x = 0$.'
- titulo: 'Ejemplo 3: Eje fraccionario'
  enunciado: En $h(x) = 2x^2 + 3x - 1$, ¿cuál es el eje de simetría?
  alternativas:
  - x = -3/4
  - x = 3/4
  - x = -3/2
  - x = 3/2
  respuesta: x = -3/4
  solucion_pasos:
  - 'Paso 1: $x = -3/(2(2)) = -3/4$.'
- titulo: 'Ejemplo 4: Eje a partir de puntos con igual imagen'
  enunciado: Si $f(-1) = 9$ y $f(7) = 9$, ¿cuál es la ecuación del eje de simetría?
  alternativas:
  - x = 3
  - x = 4
  - x = 6
  - y = 9
  respuesta: x = 3
  solucion_pasos:
  - 'Paso 1: $x = (-1 + 7)/2 = 6/2 = 3 \implies x = 3$.'
errores_frecuentes:
- Escribir 'y =' en lugar de 'x ='.
- Omitir el signo negativo de la fórmula -b/(2a).
- Confundir el eje de simetría con el discriminante.
afirmaciones_verdaderas:
- La ecuación del eje de simetría de una parábola es la recta vertical x = -b/(2a).
- El eje de simetría equidista de cualquier par de puntos con la misma ordenada y.
al_terminar_debes_poder: '**QUÉ:** Calcular y formular la ecuación de la recta del eje de simetría de una parábola.


  **CÓMO:** Aplicando la relación x = -b/(2a) o calculando el punto medio entre ceros reales.


