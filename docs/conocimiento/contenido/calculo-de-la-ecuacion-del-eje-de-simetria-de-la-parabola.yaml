semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.EJE_SIMETRIA
resumen_inicial: 'El eje de simetría de una parábola es la recta vertical de ecuación $x = -\frac{b}{2a}$ que biseca exactamente a la curva en dos ramas especulares.'
explicacion_simple: |
  El eje de simetría es una línea vertical imaginaria que pasa justo por el centro de la parábola, dividiéndola en dos mitades exactamente iguales. Al doblar el gráfico por esta línea, la rama izquierda coincide perfectamente con la rama derecha. La ecuación de esta recta se escribe siempre como $x = \text{número}$, especificando la posición horizontal por donde pasa.
explicacion_formal: |
  ### Definición formal
  El **eje de simetría** de la función cuadrática $f(x) = ax^2 + bx + c$ es la recta vertical perpendicular al eje $x$ dada por la ecuación:
  $$x = -\frac{b}{2a}$$

  ### Desglose simbólico
  - $x = h$: Recta de pendiente indefinida constante en el plano cartesiano $\mathbb{R}^2$.
  - Propiedad de simetría axial: $\forall d \in \mathbb{R}, \quad f(h - d) = f(h + d)$.
  - Intersección con el vértice: El eje de simetría contiene al vértice $V(h, k)$ como su único punto de intersección con la curva de la parábola.

  ### Síntesis didáctica
  Escribir únicamente el número $-\frac{b}{2a}$ es un error de notación. El eje de simetría no es un valor numérico aislado ni un punto, sino una **linea recta vertical**, por lo que su expresión matemática completa requiere la igualdad $x = -\frac{b}{2a}$.
definiciones_clave: |
  - **Eje de simetría**: Recta vertical $x = -\frac{b}{2a}$ que actúa como eje de reflexión de la parábola.
  - **Reflexión axial**: Transformación geométrica que asigna a cada punto de la parábola un punto simétrico a igual distancia del eje.
  - **Punto medio de abscisas**: Abscisa $h$ correspondiente al promedio aritmético de las raíces $h = \frac{x_1 + x_2}{2}$.
propiedades_relaciones: |
  - **Eje $y$ como caso particular**: Si $b = 0$, la ecuación del eje de simetría se reduce a $x = 0$, coincidiendo con el eje de las ordenadas.
  - **Equidistancia de los ceros**: Si la función tiene raíces reales $x_1$ y $x_2$, el eje de simetría se encuentra a igual distancia de ambas: $|x_1 - h| = |x_2 - h|$.
ejemplo_guiado:
  enunciado: 'Calcula la ecuación formal del eje de simetría de la función cuadrática $f(x) = 2x^2 + 8x - 5$ y verifica la propiedad de simetría para $d = 2$.'
  pasos:
    - 'Paso 1: Identificamos los coeficientes: $a = 2$, $b = 8$, $c = -5$.'
    - 'Paso 2: Aplicamos la fórmula de la recta de simetría: $x = -\frac{b}{2a} = -\frac{8}{2(2)} = -\frac{8}{4} = -2$. La ecuación es $x = -2$.'
    - 'Paso 3: Evaluamos $f(h - d) = f(-2 - 2) = f(-4) = 2(-4)^2 + 8(-4) - 5 = 32 - 32 - 5 = -5$.'
    - 'Paso 4: Evaluamos $f(h + d) = f(-2 + 2) = f(0) = 2(0)^2 + 8(0) - 5 = -5$. Comprobamos que $f(-4) = f(0) = -5$, verificando la simetría.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación correcta que representa el eje de simetría de la función cuadrática $g(x) = -3x^2 + 12x + 1$?'
    choices:
      - {text: 'La recta vertical de ecuación $x = 2$', is_correct: true}
      - {text: 'El punto $h = 2$', is_correct: false}
      - {text: 'La recta horizontal de ecuación $y = 2$', is_correct: false}
      - {text: 'La recta de ecuación $x = -2$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta vertical de ecuación $x = 2$''. Calculamos $x = -\frac{12}{2(-3)} = -\frac{12}{-6} = 2$. Debe escribirse como recta $x = 2$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una parábola posee ceros en $x_1 = -5$ y $x_2 = 3$, ¿cuál es la ecuación de su eje de simetría?'
    choices:
      - {text: '$x = -1$', is_correct: true}
      - {text: '$x = 1$', is_correct: false}
      - {text: '$x = -2$', is_correct: false}
      - {text: '$y = -1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = -1$''. Calculamos la abscisa media $x = \frac{-5 + 3}{2} = \frac{-2}{2} = -1$, produciendo la recta $x = -1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los coeficientes $a$ y $b$ de la función cuadrática.'
  - 'Paso 2: Calcular el valor numérico de la división $-\frac{b}{2a}$.'
  - 'Paso 3: Redactar la solución como la ecuación de una recta vertical en la forma $x = -\frac{b}{2a}$.'
errores_correccion: |
  - **Error 1:** Escribir el eje de simetría como una constante simple (ej: "Eje = 3") o como una recta horizontal ($y = 3$). **Cómo corregirlo:** El eje de simetría es una recta vertical en el plano cartesiano, por lo que su expresión algebraica obligatoria es de la forma $x = h$.
  - **Error 2:** Omitir el signo menos inicial de la fórmula $x = -\frac{b}{2a}$. **Cómo corregirlo:** La fórmula requiere anteponer el signo menos al coeficiente $b$. Si $b$ es negativo, el resultado pasa a ser positivo.
ejemplos:
  - titulo: 'Cálculo de eje de simetría en función desordenada'
    enunciado: '¿Cuál es la ecuación del eje de simetría de $f(x) = 6x - x^2 + 4$?'
    alternativas:
      - '$x = 3$'
      - '$x = -3$'
      - '$x = 6$'
    respuesta: '$x = 3$'
    solucion_pasos:
      - '1. Reordenamos: $f(x) = -1x^2 + 6x + 4$, de donde $a = -1$ y $b = 6$.'
      - '2. Aplicamos la fórmula: $x = -\frac{6}{2(-1)} = -\frac{6}{-2} = 3$.'
      - '3. La ecuación del eje de simetría es $x = 3$.'
  - titulo: 'Eje de simetría para b = 0'
    enunciado: '¿Cuál es el eje de simetría de $g(x) = 4x^2 - 9$?'
    alternativas:
      - '$x = 0$'
      - '$x = \frac{9}{4}$'
      - '$x = 2$'
    respuesta: '$x = 0$'
    solucion_pasos:
      - '1. Como $b = 0$, calculamos $x = -\frac{0}{2(4)} = 0$.'
      - '2. La recta de simetría es $x = 0$ (el eje $y$).'
  - titulo: 'Carácter vertical del eje de simetría'
    enunciado: '¿El eje de simetría de una parábola dada por $y = ax^2 + bx + c$ es perpendicular al eje de las abscisas (eje $x$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Toda recta de ecuación $x = h$ es una recta vertical, la cual forma un ángulo de 90° con el eje $x$.'
  - titulo: 'Simetría de alturas respecto al eje'
    enunciado: 'Si el eje de simetría es $x = 4$, ¿la función toma el mismo valor en $x = 1$ y en $x = 7$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La distancia de $x = 1$ a $x = 4$ es 3 unidades, y la distancia de $x = 7$ a $x = 4$ es también 3 unidades, por lo que $f(1) = f(7)$.'
errores_frecuentes:
  - 'El eje de simetría de una parábola se expresa mediante una constante $y = -\frac{b}{2a}$.'
  - 'En la función $f(x) = x^2 - 4x + 3$, la ecuación del eje de simetría es $x = -2$.'
  - 'El eje de simetría corta a la parábola en dos puntos diferentes de la curva.'
  - 'Si la parábola es cóncava hacia abajo, la fórmula del eje de simetría cambia a $x = +\frac{b}{2a}$.'
  - 'La recta $x = 0$ no puede ser eje de simetría de una función cuadrática.'
afirmaciones_verdaderas:
  - 'La ecuación del eje de simetría de una parábola es siempre de la forma $x = -\frac{b}{2a}$, representando una recta vertical en el plano cartesiano.'
  - 'El eje de simetría pasa exactamente por la abscisa del vértice y divide a la parábola en dos ramas congruentes.'
al_terminar_debes_poder: 'Calcular y formular la ecuación de la recta del eje de simetría $x = -\frac{b}{2a}$ para cualquier función cuadrática.'
