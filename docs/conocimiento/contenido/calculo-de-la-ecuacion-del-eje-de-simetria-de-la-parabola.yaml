semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.EJE_SIMETRIA
resumen_inicial: 'Cálculo de la ecuación del eje de simetría de la parábola: parábola,
  vértice, concavidad y formas de El vértice, el eje de simetría y el recorrido.'
explicacion_simple: Toda parábola es simétrica respecto a una recta vertical imaginaria
  que pasa exactamente por su vértice, dividiéndola en dos mitades que son reflejo
  exacto una de la otra.
explicacion_formal: '### Definición formal


  El eje de simetría de la parábola $f(x)=ax^2+bx+c$ es la recta vertical $x=-\dfrac{b}{2a}$.
  Esta recta divide la parábola en dos mitades simétricas: para cualquier punto $(x_0,y_0)$
  de la gráfica, el punto reflejado $(2\cdot(-b/2a)-x_0,y_0)$ también pertenece a
  la gráfica.


  ### Desarrollo didáctico


  Calcular el eje de simetría es idéntico a calcular la coordenada $x$ del vértice;
  la diferencia es que el eje de simetría se expresa como una ecuación de recta ($x=\ldots$),
  no como un número aislado.


  Para $f(x)=x^2-8x+12$: el eje de simetría es $x=-\dfrac{-8}{2(1)}=4$, es decir,
  la recta vertical $x=4$.'
definiciones_clave: '- **Cálculo de la ecuación del eje de simetría de la parábola**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  cálculo de la ecuación del eje de simetría de la parábola.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando cálculo de
    la ecuación del eje de simetría de la parábola.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a cálculo
    de la ecuación del eje de simetría de la parábola.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
