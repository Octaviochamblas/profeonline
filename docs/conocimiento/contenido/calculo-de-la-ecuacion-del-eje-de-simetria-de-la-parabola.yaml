semantic_id: MAT.ALG.FUNC_CUADR_VERTICE.EJE_SIMETRIA
resumen_inicial: El cálculo de la ecuación del eje de simetría establece la recta vertical de ecuación $x = -b/(2a)$ que biseca simétricamente a la parábola.
explicacion_simple: |
  El **eje de simetría** es la línea recta imaginaria que corta a la parábola exactamente por la mitad, como si fuera un espejo:

  - Es una **recta vertical** que pasa por el vértice.
  - Su ecuación se escribe siempre como **$x = \text{número}$**:
    $$x = -\frac{b}{2a}$$
  - **Ejemplo**: Si el vértice de una parábola está en $V(4, 9)$, la ecuación del eje de simetría es simplemente **$x = 4$**.
  - **Propiedad**: Si doblas el plano por esta recta $x = 4$, la rama izquierda y la rama derecha de la parábola coinciden perfectamente.
explicacion_formal: |
  Sea la función $f(x) = ax^2 + bx + c$. El **eje de simetría de la parábola** $\mathcal{L}_s$ se define analíticamente como la recta vertical del plano cartesiano que actúa como espejo ortogonal bajo la transformación de reflexión:

  $$\mathcal{L}_s: x = -\frac{b}{2a}$$

  **Invariancia por simetría axial:**
  Para cualquier punto de la parábola $(x_v + t, y)$ perteneciente al grafo $G(f)$, su punto simétrico $(x_v - t, y)$ también pertenece al grafo, satisfaciéndose la igualdad:

  $$f\left(-\frac{b}{2a} + t\right) = f\left(-\frac{b}{2a} - t\right), \quad \forall t \in \mathbb{R}$$
definiciones_clave: |
  - **Eje de simetría**: Recta vertical $x = -b/(2a)$ que divide a la gráfica de la función cuadrática en dos mitades congruentes y simétricas.
propiedades_relaciones: |
  - **Simetría de raíces reales**: Si la función posee raíces reales $x_1$ y $x_2$, la recta del eje de simetría pasa exactamente por su punto medio: $x = \frac{x_1 + x_2}{2}$.
ejemplo_guiado:
  enunciado: 'Halla la ecuación del eje de simetría de la parábola dada por la función $f(x) = 3x^2 + 12x - 1$.'
  pasos:
    - 'Paso 1: Identificar los coeficientes: $a = 3, b = 12$.'
    - 'Paso 2: Aplicar la fórmula del eje de simetría: $x = -\frac{b}{2a} = -\frac{12}{2(3)}$.'
    - 'Paso 3: Resolver la fracción: $x = -\frac{12}{6} = -2$.'
    - 'Paso 4: Declarar la ecuación de la recta vertical: $x = -2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación del eje de simetría para una parábola cuyo vértice es el punto $V(-5, 3)$?'
    choices:
      - {text: 'La recta vertical de ecuación $x = -5$', is_correct: true}
      - {text: 'La recta horizontal de ecuación $y = 3$.', is_correct: false}
      - {text: 'La recta oblicua de ecuación $y = -5x + 3$.', is_correct: false}
      - {text: 'El punto aislado $(-5, 3)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta vertical de ecuación $x = -5$''. El eje de simetría es la recta $x = x_v$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si las raíces de una función cuadrática son $x_1 = 2$ y $x_2 = 10$, ¿cuál es la ecuación de su eje de simetría?'
    choices:
      - {text: 'La recta $x = 6$', is_correct: true}
      - {text: 'La recta $x = 8$.', is_correct: false}
      - {text: 'La recta $x = 12$.', is_correct: false}
      - {text: 'La recta $y = 6$.', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta $x = 6$''. El eje de simetría pasa por el punto medio $(2 + 10)/2 = 6$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer los coeficientes $a$ y $b$ de la función cuadrática.'
  - 'Paso 2: Calcular el valor numérico sustituyendo en la fórmula $x_v = -\frac{b}{2a}$.'
  - 'Paso 3: Escribir la letra $x$ acompañada del signo de igualdad e insertar el número obtenido.'
  - 'Paso 4: Expresar la respuesta final como una ecuación de recta vertical de la forma $x = k$.'
errores_correccion: |
  - **Error común:** Escribir solo el número (ej. "$-2$") en lugar de dar la ecuación completa de la recta ($x = -2$).
  - **Cómo corregirlo:** El eje de simetría **ES UNA RECTA**, por lo que requiere obligatoriamente incluir la letra $x$: **$x = -\frac{b}{2a}$**.
