semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_REDUCCION
resumen_inicial: El método de reducción suma o resta las ecuaciones multiplicadas
  por escalares para eliminar una de las incógnitas.
explicacion_simple: 'El método de **reducción** (también llamado de suma y resta)
  es habitualmente el más rápido:

  1. Multiplicamos una o ambas ecuaciones por números adecuados para que los coeficientes
  de una letra sean opuestos (por ejemplo $+3y$ y $-3y$).

  2. Sumamos las dos ecuaciones verticalmente para que esa letra se cancelen ($+3y
  - 3y = 0$).

  3. Resolvemos la ecuación simple de una sola variable resultante.'
explicacion_formal: 'Dado el sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x +
  b_2 y = c_2 \end{cases}$, el **algoritmo de reducción por adición** multiplica por
  $k_1 = b_2$ y $k_2 = -b_1$:


  $$\begin{cases} b_2 a_1 x + b_2 b_1 y = b_2 c_1 \\ -b_1 a_2 x - b_1 b_2 y = -b_1
  c_2 \end{cases}$$


  $$\text{Sumar verticalmente: } (b_2 a_1 - b_1 a_2) x + 0 = b_2 c_1 - b_1 c_2$$


  $$x = \frac{b_2 c_1 - b_1 c_2}{b_2 a_1 - b_1 a_2}$$'
definiciones_clave: '- **Método de reducción / eliminación**: Técnica de resolución
  consistente en cancelar una incógnita mediante combinación lineal de ecuaciones.

  - **Combinación lineal de ecuaciones**: Suma de múltiplos constantes de las ecuaciones
  del sistema.'
propiedades_relaciones: '- **Rapidez operativa**: Minimiza el trabajo con fracciones
  respecto a sustitución e igualación.'
ejemplo_guiado:
  enunciado: Resuelve por el método de reducción el sistema $\begin{cases} 3x + 2y
    = 13 \\ 5x - 2y = 11 \end{cases}$ y evalúa el par $(x, y)$.
  pasos:
  - 'Paso 1: Observar que los coeficientes de $y$ son opuestos aditivos ($+2y$ y $-2y$).'
  - 'Paso 2: Sumar ambas ecuaciones miembro a miembro verticalmente: $(3x + 5x) +
    (2y - 2y) = 13 + 11$.Paso 3: Simplificar: $8x + 0 = 24 \implies 8x = 24$.Paso
    4: Trasponer $8$ dividiendo: $x = \frac{24}{8} = 3$.Paso 5: Reemplazar $x = 3$
    en la primera ecuación: $3(3) + 2y = 13 \implies 9 + 2y = 13 \implies 2y = 4 \implies
    y = 2$.Paso 6: Concluir la solución $(x, y) = (3, 2)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al sumar verticalmente las ecuaciones $\begin{cases} 3x + 2y = 13 \\ 5x
    - 2y = 11 \end{cases}$, ¿cuál es la ecuación resultante al eliminarse $y$?
  choices:
  - text: $8x = 24$
    is_correct: true
  - text: $2x = 2$
    is_correct: false
  - text: $8x + 4y = 24$
    is_correct: false
  - text: $15x = 143$
    is_correct: false
  explanation: La alternativa correcta es '$8x = 24$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver el sistema por reducción, ¿cuál es la solución del par $(x,
    y)$?
  choices:
  - text: $(3, 2)$
    is_correct: true
  - text: $(2, 3)$
    is_correct: false
  - text: $(4, 1)$
    is_correct: false
  - text: $(3, 5)$
    is_correct: false
  explanation: La alternativa correcta es '$(3, 2)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar la incógnita que se desea eliminar.'
- 'Paso 2: Multiplicar las ecuaciones por escalares para lograr que los coeficientes
  de esa incógnita sean opuestos.'
- 'Paso 3: Sumar verticalmente miembro a miembro las ecuaciones.'
- 'Paso 4: Despejar la variable restante.'
- 'Paso 5: Reemplazar el valor hallado en cualquier ecuación original para encontrar
  la otra variable.'
errores_correccion: '- **Error común:** Multiplicar los coeficientes de la primera
  ecuación pero no multiplicar la constante del segundo miembro.

  - **Cómo corregirlo:** Al multiplicar una ecuación por un número, DEBES multiplicar
  TODOS los términos en ambos miembros.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas 2x2.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas 2x2.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución de un sistema 2x2 debe satisfacer ambas ecuaciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la definición de solución de un sistema de ecuaciones.
- titulo: ¿La regla de Cramer requiere que el determinante del sistema sea distinto
    de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división entre cero.
errores_frecuentes:
- Verificar la solución $(x, y)$ únicamente en la primera ecuación del sistema.
- Sustituir la expresión despejada en la misma ecuación de donde fue extraída al usar
  sustitución.
- Despejar variables distintas en cada ecuación antes de aplicar el método de igualación.
- Multiplicar solo el primer miembro al aplicar reducción olvidando el término constante.
- Calcular el determinante $2 \times 2$ sumando las diagonales en lugar de restarlas.
afirmaciones_verdaderas:
- Un sistema de ecuaciones 2x2 tiene como solución el par ordenado que satisface simultáneamente
  ambas ecuaciones.
- El método de reducción elimina una de las variables sumando combinaciones lineales
  de las ecuaciones.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver, verificar y modelar
  sistemas de ecuaciones lineales 2x2 mediante los métodos algebraicos y matriciales.
