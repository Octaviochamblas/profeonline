semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_REDUCCION
resumen_inicial: El método de reducción consiste en multiplicar las ecuaciones del sistema por escalares numéricos convenientes para eliminar una de las incógnitas al sumar miembro a miembro.
explicacion_simple: |
  El método de **reducción** (también denominado de eliminación por suma y resta) es por lo general el procedimiento más directo y eficiente:

  1. Multiplicamos una o ambas ecuaciones por números seleccionados para lograr que los coeficientes de una de las incógnitas sean inversos aditivos o números opuestos (por ejemplo $+2y$ y $-2y$).
  2. Sumamos verticalmente ambas ecuaciones miembro a miembro para anular dicha variable ($+2y - 2y = 0$).
  3. Resolvemos la ecuación lineal de una sola variable resultante y luego sustituimos su valor en cualquiera de las ecuaciones originales para hallar la incógnita restante.
explicacion_formal: |
  ### Definición formal
  Dado el sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$, el **algoritmo de reducción por adición** amplifica por los escalares $k_1 = b_2$ y $k_2 = -b_1$:

  $$\begin{cases} b_2 a_1 x + b_2 b_1 y = b_2 c_1 \\ -b_1 a_2 x - b_1 b_2 y = -b_1 c_2 \end{cases}$$

  $$\text{Suma membreal vertical: } (b_2 a_1 - b_1 a_2) x + 0 = b_2 c_1 - b_1 c_2 \implies x = \frac{b_2 c_1 - b_1 c_2}{b_2 a_1 - b_1 a_2}$$

  ### Síntesis didáctica
  Este método evita el manejo de expresiones fraccionarias intermedias al transformar el sistema en una suma lineal con cancelación de términos.
definiciones_clave: |
  - **Método de reducción / eliminación**: Procedimiento de resolución basado en combinar linealmente las ecuaciones para anular temporalmente una variable.
  - **Combinación lineal de ecuaciones**: Igualdad equivalente obtenida al sumar múltiplos numéricos de las ecuaciones del sistema.
propiedades_relaciones: |
  - **Inversos aditivos de coeficientes**: El objetivo de la amplificación es conseguir que el coeficiente de una incógnita en la primera ecuación sea el opuesto aditivo (mismo valor numérico, signo contrario) de su coeficiente en la segunda.
  - **Invariancia del conjunto solución**: Multiplicar ambos miembros por un escalar no nulo preserva el conjunto solución original.
ejemplo_guiado:
  enunciado: 'Resuelve por el método de reducción el sistema $\begin{cases} 3x + 2y = 13 \\ 5x - 2y = 11 \end{cases}$ y evalúa el par solución $(x, y)$.'
  pasos:
    - 'Paso 1: Observar que los coeficientes de $y$ ya son opuestos aditivos idénticos en magnitud ($+2$ y $-2$).'
    - 'Paso 2: Sumar ambas ecuaciones miembro a miembro verticalmente: $(3x + 5x) + (2y - 2y) = 13 + 11$.'
    - 'Paso 3: Reducir los términos semejantes cancelando la variable $y$: $8x + 0 = 24 \implies 8x = 24$.'
    - 'Paso 4: Trasponer el coeficiente $8$ dividiendo: $x = \frac{24}{8} = 3$.'
    - 'Paso 5: Reemplazar $x = 3$ en la primera ecuación: $3(3) + 2y = 13 \implies 9 + 2y = 13 \implies 2y = 4 \implies y = 2$.'
    - 'Paso 6: Concluir que la solución verificada es $(x, y) = (3, 2)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al sumar miembro a miembro las ecuaciones $\begin{cases} 3x + 2y = 13 \\ 5x - 2y = 11 \end{cases}$, ¿cuál es la ecuación lineal resultante en una variable?'
    choices:
      - {text: '$8x = 24$', is_correct: true}
      - {text: '$2x = 2$', is_correct: false}
      - {text: '$8x + 4y = 24$', is_correct: false}
      - {text: '$15x = 143$', is_correct: false}
    explanation: 'La alternativa correcta es ''$8x = 24$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al finalizar la resolución del sistema por reducción, ¿cuál es el par ordenado solución $(x, y)$?'
    choices:
      - {text: '$(3, 2)$', is_correct: true}
      - {text: '$(2, 3)$', is_correct: false}
      - {text: '$(4, 1)$', is_correct: false}
      - {text: '$(3, 5)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(3, 2)$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Seleccionar la variable que se desea eliminar ($x$ o $y$).'
  - 'Paso 2: Multiplicar todos los términos de una o ambas ecuaciones por números adecuados para obtener coeficientes opuestos.'
  - 'Paso 3: Sumar verticalmente miembro a miembro las ecuaciones transformadas para cancelar dicha variable.'
  - 'Paso 4: Resolver la ecuación lineal de una sola variable restante.'
  - 'Paso 5: Sustituir el valor obtenido en cualquiera de las ecuaciones originales para determinar la segunda variable.'
errores_correccion: |
  - **Error 1:** Multiplicar los términos del primer miembro por el escalar y olvidar multiplicar la constante del segundo miembro. **Cómo corregirlo:** Al amplificar una ecuación por un escalar $k$, **TODOS Y CADA UNO DE LOS TÉRMINOS DE AMBOS MIEMBROS DEBEN MULTIPLICARSE POR $k$ ($k \cdot a x + k \cdot b y = k \cdot c$)**.
  - **Error 2:** Sumar las ecuaciones cuando los coeficientes tienen el mismo signo (ej. $+2y$ y $+2y$) sin multiplicar por $-1$. **Cómo corregirlo:** Para que la suma cancele la variable, **LOS COEFICIENTES DEBEN TENER SIGNOS OPUESTOS ($+2y$ Y $-2y$); SI SON IGUALES, SE DEBE MULTIPLICAR UNA ECUACIÓN POR $-1$**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Resuelve por reducción el sistema $\begin{cases} x + y = 6 \\ x - y = 2 \end{cases}$.'
    alternativas:
      - '$(4, 2)$'
      - '$(2, 4)$'
      - '$(5, 1)$'
    respuesta: '$(4, 2)$'
    solucion_pasos:
      - '1. Sumar verticalmente: $2x + 0 = 8 \implies x = 4$.'
      - '2. Sustituir $x = 4$: $4 + y = 6 \implies y = 2$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al resolver por reducción $\begin{cases} 2x + 3y = 12 \\ 2x + y = 8 \end{cases}$, ¿qué operación conviene realizar?'
    alternativas:
      - 'Restar la segunda ecuación de la primera para eliminar $2x$'
      - 'Sumar ambas ecuaciones directamente'
      - 'Multiplicar ambas por cero'
    respuesta: 'Restar la segunda ecuación de la primera para eliminar $2x$'
    solucion_pasos:
      - '1. Restar: $(2x - 2x) + (3y - y) = 12 - 8 \implies 2y = 4 \implies y = 2$.'
      - '2. Sustituir: $2x + 2 = 8 \implies 2x = 6 \implies x = 3$.'
  - titulo: 'Multiplicación en ambos miembros'
    enunciado: '¿Multiplicar una ecuación por un escalar exige afectar tanto al primer miembro como al término del segundo miembro?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, previene alterar la igualdad matemática de la ecuación.'
  - titulo: 'Cancelación de variables'
    enunciado: '¿La suma vertical cancela la incógnita elegida cuando sus coeficientes son opuestos aditivos?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $k + (-k) = 0$.'
errores_frecuentes:
  - 'Al amplificar la ecuación $2x + 3y = 12$ por el escalar $2$, el término independiente del segundo miembro se omite obteniendo $4x + 6y = 12$.'
  - 'Al sumar verticalmente las ecuaciones $\begin{cases} 2x + 3y = 12 \\ 2x + y = 8 \end{cases}$, los términos de la variable $x$ se cancelan directamente sin multiplicar por $-1$.'
  - 'Al restar miembro a miembro las ecuaciones de un sistema, el signo negativo de la sustracción no invierte el signo de los términos del segundo miembro.'
  - 'Al resolver la ecuación sumada $8x = 24$ obteniendo $x = 3$, el ejercicio se declara finalizado sin hallar la incógnita $y$.'
  - 'El método de reducción requiere que la suma vertical cancele obligatoriamente ambas variables a la vez.'
afirmaciones_verdaderas:
  - 'El método de reducción elimina una de las variables sumando combinaciones lineales de las ecuaciones del sistema.'
  - 'Para anular una incógnita por reducción, sus coeficientes en ambas ecuaciones deben ser opuestos aditivos.'
al_terminar_debes_poder: |
  QUÉ: Resolver sistemas de ecuaciones lineales 2x2 mediante el método de reducción.
  CÓMO: Amplificar las ecuaciones por escalares para obtener coeficientes opuestos, sumar miembro a miembro para anular una variable, despejar la primera incógnita y calcular la segunda.
