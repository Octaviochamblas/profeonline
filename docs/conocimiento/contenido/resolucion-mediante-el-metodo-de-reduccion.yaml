procedimiento:
- Elige qué incógnita quieres eliminar.
- Multiplica las ecuaciones por números convenientes para que los coeficientes de
  esa incógnita sean iguales pero de signo contrario.
- Suma ambas ecuaciones columna por columna (las x con las x, las y con las y, los
  números con los números).
- Resuelve la ecuación resultante de una sola incógnita.
- Reemplaza el valor en una ecuación original para hallar la otra.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en resolución mediante el método de reducción.
