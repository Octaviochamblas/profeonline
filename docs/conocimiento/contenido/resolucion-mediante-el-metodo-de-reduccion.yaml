semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_REDUCCION
resumen_inicial: 'Resolución mediante el método de reducción: propiedades, resolución
  y modelamiento en Sistemas de ecuaciones lineales 2x2.'
explicacion_simple: 'Para que se se eliminen, debes tener exactamente la misma cantidad
  de una letra, pero con signos opuestos (ej: $+3y$ arriba y $-3y$ abajo).'
explicacion_formal: '### Definición formal


  El método de reducción elimina una incógnita mediante combinaciones lineales equivalentes
  de las ecuaciones del sistema. Dado

  $$\begin{cases} a_1x+b_1y=c_1,\\ a_2x+b_2y=c_2, \end{cases}$$

  se multiplican, si es necesario, una o ambas ecuaciones por constantes no nulas
  para obtener coeficientes opuestos o iguales en una misma incógnita. Al sumar o
  restar las ecuaciones resultantes, dicha incógnita desaparece y el sistema se reduce
  a una ecuación lineal en una sola variable.


  ### Desarrollo didáctico


  Para que se se eliminen, debes tener exactamente la misma cantidad de una letra,
  pero con signos opuestos (ej: $+3y$ arriba y $-3y$ abajo).

  Si no los tienes, los creas. Multiplicas una (o ambas) ecuaciones por un número
  estratégico para forzar esa situación.

  Una vez forzada, sumas hacia abajo: las ''y'' desaparecen ($3y - 3y = 0$), las ''x''
  se suman, los números se suman, y te queda una micro-ecuación rapidísima de resolver.'
definiciones_clave: '- **Resolución mediante el método de reducción**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a resolución mediante el método de reducción.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando resolución mediante
    el método de reducción.
  pasos:
