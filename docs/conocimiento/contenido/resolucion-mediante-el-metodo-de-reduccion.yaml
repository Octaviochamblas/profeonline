errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Elige qué incógnita quieres
  eliminar».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Multiplica las
  ecuaciones por números convenientes para que los coeficientes de esa incógnita sean
  iguales pero de signo contrario».'
- La definición sigue cumpliéndose aunque no se considere que el método de reducción
  es el más rápido, poderoso y elegante (y el favorito en pruebas PAES). Se trata
  de sumar las dos ecuaciones verticalmente para que una de las letras se 'aniquile'.
- Basta con ejecutar una parte del procedimiento; no es necesario revisar «Resuelve
  la ecuación resultante de una sola incógnita».
- La comprobación del resultado vuelve innecesaria la condición «Reemplaza el valor
  en una ecuación original para hallar la otra».
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
