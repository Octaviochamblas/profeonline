semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.FRECUENCIA_RELATIVA_B
resumen_inicial: 'Interpretación del coeficiente B como cambio de frecuencia gráfica:
  círculo unitario, amplitud, período y transformaciones de Parámetros y transformaciones
  de funciones periódicas.'
explicacion_simple: Además de determinar el periodo, el parámetro $b$ tiene una interpretación
  directa relacionada con cuántas oscilaciones completas ocurren en un tramo fijo.
explicacion_formal: '### Definición formal


  Como el periodo es $T=2\pi/|b|$, en un intervalo de longitud $2\pi$ caben $2\pi/T=|b|$
  periodos completos. Por eso, $|b|$ se interpreta como la cantidad de oscilaciones
  completas dentro de ese intervalo de referencia.


  ### Desarrollo didáctico


  $f(x)=\sin(3x)$ completa $3$ ciclos en el intervalo $[0,2\pi]$, mientras que $\sin(x)$
  completa solo $1$. Esto se relaciona directamente con que su periodo, $2\pi/3$,
  cabe exactamente $3$ veces en $2\pi$.'
definiciones_clave: '- **Interpretación del coeficiente B como cambio de frecuencia
  gráfica**: Función periódica fundamentada en las coordenadas del círculo unitario
  o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a interpretación del coeficiente b como cambio de frecuencia gráfica.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    interpretación del coeficiente b como cambio de frecuencia gráfica.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de interpretación del coeficiente b como cambio de frecuencia
    gráfica.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
