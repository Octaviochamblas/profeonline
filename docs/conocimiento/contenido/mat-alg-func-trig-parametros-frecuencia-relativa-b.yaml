procedimiento:
  - 'Paso 1: Extraer el parámetro $B$ de la expresión trigonométrica.'
  - 'Paso 2: Calcular el valor absoluto $|B|$.'
  - 'Paso 3: Declarar que $|B|$ representa la cantidad exacta de oscilaciones en un tramo de $2\pi$.'
  - 'Paso 4: Dividir la ventana de $2\pi$ entre $|B|$ para verificar que la longitud de cada oscilación concuerde con $T = \frac{2\pi}{|B|}$.'
errores_correccion: |
  - **Error 1:** Confundir la cantidad de ciclos $B$ con la longitud de cada ciclo $T$. **Cómo corregirlo:** $B$ es la **cantidad** de ciclos en $2\pi$ (ej. 4 ciclos), mientras que $T$ es la **longitud** de un solo ciclo (ej. $\frac{\pi}{2}$).
  - **Error 2:** Creer que si $B$ es decimal la función no realiza ciclos. **Cómo corregirlo:** Si $B = 0.25$, en $2\pi$ entra un cuarto de ciclo, requiriendo un tramo mayor de $8\pi$ para completar una onda entera.
ejemplos:
  - titulo: 'Ciclos de onda en coseno'
    enunciado: '¿Cuántos ciclos completos de la función $y = \cos(6x)$ entran en el intervalo de $0$ a $2\pi$?'
    alternativas:
      - '6 ciclos'
      - '3 ciclos'
      - '12 ciclos'
    respuesta: '6 ciclos'
    solucion_pasos:
      - '1. El coeficiente $B = 6$.'
      - '2. Entran 6 ciclos completos en $2\pi$.'
  - titulo: 'Frecuencia unitaria'
    enunciado: 'En la función base $y = \sin(x)$, ¿cuántas ondas completas entran en $2\pi$?'
    alternativas:
      - '1 onda completa'
      - '2 ondas completas'
      - '0 ondas completas'
    respuesta: '1 onda completa'
    solucion_pasos:
      - '1. Puesto que $B = 1$, entra exactamente 1 ciclo en $2\pi$.'
  - titulo: 'Interpretación gráfica'
    enunciado: '¿La gráfica de $y = \sin(4x)$ se ve 4 veces más apretada horizontalmente que $y = \sin(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al haber 4 ciclos en el mismo espacio de $2\pi$, la compresión es de un factor de 4.'
  - titulo: 'Suma de períodos'
    enunciado: 'Si entran 2 ciclos en $2\pi$, ¿cada ciclo mide $\pi$ unidades?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\pi + \pi = 2\pi$.'
errores_frecuentes:
  - 'La afirmación de que el parámetro $B$ representa el valor máximo vertical que alcanza la cresta.'
  - 'La afirmación de que en la función $y = \sin(2x)$ entran medio ciclo en la ventana de $2\pi$.'
  - 'La afirmación de que la cantidad de ciclos contenidos en $2\pi$ depende del valor de la amplitud $A$.'
  - 'La afirmación de que si $B = 3$, el período fundamental de la función es igual a 3.'
  - 'La afirmación de que la frecuencia relativa $B$ puede alterar el valor de la línea media.'
afirmaciones_verdaderas:
  - 'El coeficiente $|B|$ representa la frecuencia relativa o número exacto de ciclos completos de la función trigonométrica contenidos en el intervalo de longitud $2\pi$.'
  - 'A mayor valor del coeficiente $|B|$, mayor es la concentración de ondas por unidad de longitud y más comprimida se observa la gráfica cartesiana.'
