semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.FRECUENCIA_RELATIVA_B
resumen_inicial: 'Interpretación del coeficiente $B$ como la frecuencia relativa de ciclos completos en un intervalo estándar de $2\pi$.'
explicacion_simple: |
  Mientras que el período $T$ indica cuánto mide **una sola onda**, el coeficiente **$B$** indica **cuántas ondas completas entran** en una ventana fija de largo $2\pi$ (un giro completo de $360^\circ$). Si $B = 3$ en $y = \sin(3x)$, significa que en el espacio donde antes entraba un solo ciclo de la onda base, ahora caben exactamente 3 ciclos completos. Por ello, $B$ se denomina la **frecuencia relativa** de la función.
explicacion_formal: |
  ### Definición formal
  En el modelo trigonométrico general $f(x) = A\sin(Bx + C) + D$, el parámetro **$|B|$** representa la **frecuencia angular (o frecuencia relativa)**, definida como la densidad o número de ciclos completos contenidos en el intervalo canónico de longitud $2\pi$:
  $$|B| = \frac{2\pi}{T} = \text{Número de ciclos en } [0, 2\pi]$$

  ### Desglose simbólico
  - $|B| = 1$: La función realiza exactamente $1$ ciclo completo en $2\pi$ unidades.
  - $|B| = 2$: La función realiza exactamente $2$ ciclos completos en $2\pi$ unidades.
  - $|B| = \frac{1}{2}$: La función realiza únicamente $\frac{1}{2}$ ciclo (medio ciclo) en $2\pi$ unidades.

  ### Síntesis didáctica
  Visualizar $B$ como la cantidad de ondas en un tramo de $2\pi$ permite graficar con gran rapidez: para graficar $y = \sin(4x)$ entre $0$ y $2\pi$, basta con dividir la ventana de $2\pi$ en 4 partes iguales y dibujar una onda completa en cada una de ellas.
definiciones_clave: |
  - **Frecuencia relativa ($B$)**: Cantidad de oscilaciones completas que ocurren en un intervalo horizontal de longitud $2\pi$.
  - **Densidad de ondas**: Concentración de ciclos por unidad de longitud cartesiana.
  - **Frecuencia ordinaria ($f$)**: Número de ciclos por unidad de longitud ($f = \frac{|B|}{2\pi} = \frac{1}{T}$).
propiedades_relaciones: |
  - **Relación con la velocidad angular**: En física, el parámetro $B$ equivale a la velocidad angular $\omega$, que mide la rapidez con la que rota el sistema oscilante.
  - **Independencia del desfase**: El desfase $C$ desplaza horizontalmente las ondas, pero la cantidad total de ondas en cualquier ventana de tamaño $2\pi$ sigue siendo igual a $|B|$.
ejemplo_guiado:
  enunciado: '¿Cuántos ciclos completos realiza la función $g(x) = \cos(5x)$ en el intervalo $[0, 2\pi]$ y cuánto mide cada ciclo?'
  pasos:
    - 'Paso 1: Identificar el coeficiente multiplicativo dentro de la función: $B = 5$.'
    - 'Paso 2: Interpretar el valor de $B$: la función realiza exactamente $5$ ciclos completos en el intervalo de $2\pi$.'
    - 'Paso 3: Calcular la longitud de cada ciclo (período fundamental): $T = \frac{2\pi}{B} = \frac{2\pi}{5}$.'
    - 'Paso 4: Comprobar multiplicando $5 \text{ ciclos} \times \frac{2\pi}{5} \text{ longitud/ciclo} = 2\pi$.'
