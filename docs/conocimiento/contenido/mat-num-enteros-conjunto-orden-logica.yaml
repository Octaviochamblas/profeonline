semantic_id: MAT.NUM.ENTEROS_CONJUNTO.ORDEN_LOGICA
resumen_inicial: Todo entero ubicado a la derecha de otro en la recta numérica es
  estrictamente mayor que él.
explicacion_simple: 'Para saber cuál de dos números enteros es mayor, solo debemos
  mirar su posición en la recta numérica: todo número ubicado a la derecha de otro
  es estrictamente mayor. Por esta razón, cualquier número positivo es mayor que cero,
  el cero es mayor que cualquier negativo, y entre dos negativos, es mayor el que
  esté más cerca del cero.'
explicacion_formal: 'Dados dos enteros $a, b \in \mathbb{Z}$, la **Regla Geométrica
  de Orden** establece que:


  $$a > b \iff \text{Pos}(a) \text{ se ubica estrictamente a la derecha de } \text{Pos}(b)
  \text{ en la recta orientada}$$


  **Desglose de la fórmula:**

  - $a > b$: Desigualdad que indica que $a$ es estrictamente mayor que $b$.

  - $\text{Pos}(a) > \text{Pos}(b)$: Posición coordenada en la recta numérica orientada.

  - En particular: $\forall p \in \mathbb{Z}^+, n \in \mathbb{Z}^-: \quad p > 0 >
  n$. Para negativos $n_1, n_2 \in \mathbb{Z}^-$: $n_1 > n_2 \iff |n_1| < |n_2|$.


  > **Complemento didáctico:** En los enteros negativos, el número mayor es el que
  posee menor valor absoluto por estar más próximo al cero.'
definiciones_clave: '- **Relación de orden ($>$)**: Comparación que establece que
  un número es mayor si se sitúa a la derecha en la recta.

  - **Proximidad al origen**: En enteros negativos, menor distancia al cero implica
  mayor valor algebraico.'
propiedades_relaciones: '- **Mayoría de positivos**: Todo positivo es mayor que cualquier
  negativo ($p > n$).

  - **Negativo mayor**: $-2 > -10$ porque $-2$ está más a la derecha que $-10$.'
ejemplo_guiado:
  enunciado: Compare los enteros $-7$ y $-2$ e indique cuál de ellos es estrictamente
    mayor.
  pasos:
  - 'Paso 1: Graficar o ubicar ambos enteros negativos en la recta numérica.'
  - 'Paso 2: Observar que $-2$ se ubica más cerca del cero y a la derecha de $-7$.'
  - 'Conclusión: $-2 > -7$ ($-2$ es estrictamente mayor que $-7$).'
checkpoints:
- placement: after_explicacion_formal
  question: Entre dos números enteros negativos, ¿cuál de ellos es el mayor?
  choices:
  - text: El que se encuentra más cerca del cero (a la derecha)
    is_correct: true
  - text: El que se encuentra más lejos del cero
    is_correct: false
  - text: El que tiene mayor cifra numérica absoluta
    is_correct: false
  - text: Ambos son siempre iguales
    is_correct: false
  explanation: La alternativa correcta es 'El que se encuentra más cerca del cero
    (a la derecha)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la comparación entre -7 y -2, ¿cuál es la relación de orden correcta?
  choices:
  - text: -2 > -7
    is_correct: true
  - text: -7 > -2
    is_correct: false
  - text: -7 = -2
    is_correct: false
  - text: -2 < -7
    is_correct: false
  explanation: La alternativa correcta es '-2 > -7'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar los dos números en la recta numérica.'
- 'Paso 2: Identificar cuál de los dos puntos se encuentra más hacia la derecha.'
- 'Paso 3: Concluir que el número posicionado a la derecha es el mayor.'
errores_correccion: '- **Error 1: Creer que $-10$ es mayor que $-2$ porque el dígito
  10 es más grande.** **Cómo corregirlo:** En la recta, $-2$ está a la derecha de
  $-10$, por lo que $-2 > -10$.


  - **Error 2: Pensar que entre dos negativos, el mayor es el de mayor distancia al
  cero.** **Cómo corregirlo:** La mayor distancia al cero disminuye el valor de un
  número negativo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Ordene de menor a mayor los siguientes enteros: $4, -9, 0, -2$.'
  alternativas:
  - -9 < -2 < 0 < 4
  - -2 < -9 < 0 < 4
  - 0 < -2 < -9 < 4
  respuesta: -9 < -2 < 0 < 4
  solucion_pasos:
  - $-9$ es el que está más a la izquierda, seguido de $-2$, $0$ y $4$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el mayor número entero negativo de un solo dígito?
  alternativas:
  - '-1'
  - '-9'
  - '0'
  respuesta: '-1'
  solucion_pasos:
  - $-1$ es el entero negativo más cercano al cero y el mayor de todos los enteros
    negativos.
- titulo: ¿Es cierto que el número 0 es mayor que cualquier entero negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, el cero se ubica a la derecha de todos los enteros negativos.
- titulo: ¿Es -5 mayor que -1?
  respuesta: 'No'
  solucion_pasos:
  - No, $-1$ está a la derecha de $-5$, por lo que $-1 > -5$.
errores_frecuentes:
- El número entero $-15$ es estrictamente mayor que el número entero $-3$.
- Cualquier número entero negativo es mayor que el número cero.
- Entre dos números negativos, el de mayor valor es aquel que se encuentra más alejado
  del cero.
- El entero $-1$ es menor que el entero $-100$ en la recta numérica.
- El número $0$ es strictly menor que cualquier entero negativo.
afirmaciones_verdaderas:
- Todo entero situado a la derecha de otro en la recta numérica es estrictamente mayor.
- -1 es el mayor de todos los números enteros negativos.
al_terminar_debes_poder: Al terminar serás capaz de comparar dos enteros cualesquiera
  y determinar cuál es mayor, identificando cuál de los dos se sitúa más a la derecha
  en la recta numérica.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
