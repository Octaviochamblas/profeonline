semantic_id: MAT.NUM.ENTEROS_CONJUNTO.ORDEN_LOGICA
resumen_inicial: "Entre dos enteros, es mayor el que está más a la derecha en la recta numérica. Entre dos negativos, el más cercano a cero es el mayor."
explicacion_simple: |
  Para saber cuál número es mayor, piensa en la recta numérica: el que está más a la derecha
  siempre es el mayor. Por eso 5 es mayor que 2, y 0 es mayor que -4. Lo que puede sorprender: entre
  dos negativos, el que parece "más grande" es en realidad el menor. -2 es mayor que -10, porque -2
  está más a la derecha. Cuanto más negativo, más pequeño.
explicacion_formal: |
  Para comparar enteros $a$ y $b$: si ambos son positivos, es mayor el de mayor valor absoluto; si
  uno es positivo y el otro negativo, el positivo siempre es mayor; si ambos son negativos, es mayor
  el de **menor** valor absoluto (el más cercano a cero).
definiciones_clave: |
  **Relación de orden**: comparación entre dos enteros usando $>$, $<$ o $=$, basada en su posición
  en la recta numérica (más a la derecha es mayor).
propiedades_relaciones: |
  Todo entero positivo es mayor que cualquier entero negativo. Entre dos negativos, el orden se
  invierte respecto al valor absoluto: mayor valor absoluto significa menor número.
ejemplo_guiado:
  enunciado: "Ordena de menor a mayor: $-15$, $6$, $-1$, $0$."
  pasos:
    - "Se separan los negativos ($-15$, $-1$) de los no negativos ($6$, $0$)."
    - "Entre los negativos, $-15$ tiene mayor valor absoluto, así que es el menor; $-1$ es el mayor de los dos."
    - "Entre los no negativos, $0$ es menor que $6$."
    - "Resultado: $-15 < -1 < 0 < 6$."
checkpoints:
  - placement: after_explicacion_formal
    question: "Entre dos enteros negativos, ¿cuál de los dos criterios determina cuál es mayor?"
    choices:
      - {text: "El de mayor valor absoluto es mayor", is_correct: false}
      - {text: "El de menor valor absoluto es mayor", is_correct: true}
      - {text: "Siempre son iguales", is_correct: false}
      - {text: "No se pueden comparar dos negativos", is_correct: false}
    explanation: "La correcta es El de menor valor absoluto es mayor, porque está más cerca de cero y por lo tanto más a la derecha."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el mayor entre $-20$ y $-3$?"
    choices:
      - {text: "$-20$", is_correct: false}
      - {text: "$-3$", is_correct: true}
      - {text: "Son iguales", is_correct: false}
      - {text: "Depende del contexto", is_correct: false}
    explanation: "La correcta es $-3$, porque tiene menor valor absoluto que $-20$ y está más cerca de cero."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Ubicar mentalmente o físicamente ambos números en la recta numérica."
  - "Paso 2: Identificar cuál de los dos números está situado más a la derecha."
  - "Paso 3: Aplicar el símbolo de desigualdad correspondiente ($>$ para el que está a la derecha, $<$ para el de la izquierda)."
errores_correccion: |
  Un error frecuente es pensar que $-10 > -2$ "porque $10 > 2$": eso compara valores absolutos, no
  los números con signo. Para corregirlo, recuerda que entre negativos manda la cercanía a cero, no
  la magnitud. Otro error es creer que un negativo puede ser mayor que un positivo si su valor
  absoluto es más grande; todo positivo es siempre mayor que cualquier negativo.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Compare los números $-5$ y $9$ usando la lógica de posición."
    alternativas:
      - "$-5 < 9$"
      - "$-5 > 9$"
      - "$-5 = 9$"
    respuesta: "$-5 < 9$"
    solucion_pasos:
      - "$-5$ se ubica a la izquierda del cero."
      - "$9$ se ubica a la derecha del cero."
      - "Como $9$ está más a la derecha, $9$ es mayor."
      - "Resultado: $-5 < 9$."
  - titulo: "Ejemplo 2"
    enunciado: 'Ordene de menor a mayor los siguientes números: $-12,\ -4,\ -1,\ 0,\ 8$.'
    alternativas:
      - '$-12 < -4 < -1 < 0 < 8$'
      - '$8 < 0 < -1 < -4 < -12$'
      - '$-1 < -4 < -12 < 0 < 8$'
    respuesta: '$-12 < -4 < -1 < 0 < 8$'
    solucion_pasos:
      - "Entre los negativos, $-12$ es el que está más a la izquierda (menor)."
      - "Le sigue $-4$ y luego $-1$, que es el negativo más cercano al cero."
      - "El cero separa negativos de positivos."
      - "El $8$ es el positivo y está más a la derecha."
      - "Resultado: $-12 < -4 < -1 < 0 < 8$."
  - titulo: "¿Es correcto afirmar que $-8 < -3$?"
    respuesta: "Sí"
    solucion_pasos:
      - "$-8$ tiene mayor valor absoluto que $-3$, por lo que está más alejado del cero hacia la izquierda."
      - "En la recta numérica, $-8$ se ubica a la izquierda de $-3$."
      - "Por lo tanto, $-8 < -3$ es correcto."
  - titulo: "¿Es correcto afirmar que $-2 > 1$?"
    respuesta: "No"
    solucion_pasos:
      - "$-2$ es negativo y se ubica a la izquierda del cero."
      - "$1$ es positivo y se ubica a la derecha del cero."
      - "Todo positivo es mayor que cualquier negativo, por lo tanto $-2 < 1$."
errores_frecuentes:
  - "El número negativo de mayor valor absoluto es el mayor porque 'es más grande'."
  - "$-10 > -2$ porque $10 > 2$."
  - "Un número negativo puede ser mayor que un número positivo si su valor absoluto es mayor."
  - "El cero es el número más grande de los enteros no positivos."
  - "Para comparar negativos basta comparar los números sin el signo."
al_terminar_debes_poder: |
  Comparar y ordenar cualquier lista de enteros positivos y negativos, aplicando correctamente el
  criterio invertido de valor absoluto para los números negativos.

fuente: "Manual Esencial Santillana p.48"
estado: publicado
