semantic_id: MAT.GEO.CUERPOS_REDONDOS_METRICA.ESFERA_VOLUMEN
resumen_inicial: 'Cálculo del volumen de la esfera: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: El volumen de una esfera indica cuánto espacio tridimensional
  ocupa una figura perfectamente redonda, como una pelota.
explicacion_formal: '![Volumen de la esfera](/static/img/geometria/espacio-cuerpos/esfera-volumen.svg)


  ### Definición formal


  El volumen de una esfera de radio $r$ es $V=\frac{4}{3}\pi r^3$.


  ### Desarrollo didáctico


  Si una esfera tiene radio 3 cm, su volumen es $V=\frac{4}{3}\pi(3)^3=\frac{4}{3}\times27\pi=36\pi\approx113,04$
  cm³ (usando π≈3,14). Esta fórmula fue descubierta por Arquímedes, quien demostró
  que el volumen de la esfera es dos tercios del volumen del cilindro que la circunscribe.'
definiciones_clave: '- **Cálculo del volumen de la esfera**: Elemento o propiedad
  fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo del volumen de la esfera.'
