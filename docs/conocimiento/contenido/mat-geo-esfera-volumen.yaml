procedimiento:
- 'Paso 1: Identifica el radio (r) de la esfera.'
- 'Paso 2: Eleva el radio al cubo (multiplícalo por sí mismo tres veces).'
- 'Paso 3: Multiplica ese resultado por 4π y divide entre 3 para obtener el volumen:
  V=(4πr³)/3.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con cálculo del volumen de la esfera.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de cálculo del volumen de la esfera para determinar
    la medida solicitada.
  alternativas:
