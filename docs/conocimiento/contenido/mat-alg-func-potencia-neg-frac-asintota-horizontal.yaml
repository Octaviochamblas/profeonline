semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.ASINTOTA_HORIZONTAL
resumen_inicial: 'La asíntota horizontal de una función potencia de exponente entero negativo $f(x) = a x^{-m}$ ($m \in \mathbb{Z}^+$) es la recta del eje $x$ de ecuación $y = 0$.'
explicacion_simple: |
  En una función potencia de exponente negativo como $f(x) = \frac{1}{x}$ o $f(x) = \frac{1}{x^2}$, cuando probamos valores para la variable $x$ cada vez más gigantescos (como $1000$ o $1.000.000$), la fracción se vuelve cada vez más pequeña, acercándose casi a cero (como $0.001$ o $0.000001$). Por esta razón, cuando la gráfica se extiende hacia los extremos muy lejanos a la derecha o a la izquierda, las ramas se aplanan bordando la línea horizontal del suelo (el eje $x$, de ecuación $y = 0$).
explicacion_formal: |
  ### Definición formal
  La **asíntota horizontal en el infinito** para la función potencia recíproca $f(x) = a x^{-m} \equiv \frac{a}{x^m}$ con $m \in \mathbb{Z}^+$ y $a \neq 0$ es la recta cartesiana de ecuación:
  $$y = 0 \quad (\text{eje } x)$$
  determinada analíticamente por la convergencia a cero del límite al infinito:
  $$\lim_{x \to +\infty} \frac{a}{x^m} = 0 \quad \text{y} \quad \lim_{x \to -\infty} \frac{a}{x^m} = 0$$

  ### Aproximación según el signo del coeficiente $a$ y la paridad de $m$
  1. **Aproximación por Arriba ($y \to 0^+$)**: Ocurre si la salida del límite es positiva para $x \to \pm\infty$.
     - En exponente par $m = 2k$ con $a > 0$: Ambas ramas bordean el eje $x$ por arriba ($y > 0$).
     - En exponente impar $m = 2k+1$ con $a > 0$: La rama derecha ($x \to +\infty$) bordea el eje $x$ por arriba.
  2. **Aproximación por Abajo ($y \to 0^-$)**: Ocurre si la salida del límite es negativa para $x \to \pm\infty$.
     - En exponente par $m = 2k$ con $a < 0$: Ambas ramas bordean el eje $x$ por abajo ($y < 0$).
     - En exponente impar $m = 2k+1$ con $a > 0$: La rama izquierda ($x \to -\infty$) bordea el eje $x$ por abajo.

  ### Síntesis didáctica
  Exclusión de la cota $y = 0$: Como $\lim_{x \to \pm\infty} f(x) = 0$ pero $f(x) \neq 0$ para todo $x \in \mathbb{R} \setminus \{0\}$, la gráfica jamás corta ni toca la recta asíntota horizontal $y = 0$.
definiciones_clave: |
  - **Asíntota horizontal $y = 0$**: Recta horizontal cartesiana a la que converge el valor de la función en el extremo infinito.
  - **Límite al infinito nulo**: Propiedad analítica por la cual $\frac{a}{x^m} \to 0$ cuando $|x| \to \infty$.
  - **Aproximación asintótica**: Acercamiento continuo sin intersección finita entre la curva y el eje de abscisas.
propiedades_relaciones: |
  - **Unicidad de la asíntota horizontal**: Las funciones potencia no trasladadas de exponente negativo poseen exactamente una asíntota horizontal en $y = 0$.
  - **Efecto de traslaciones verticales**: Si se suma una constante $k$ ($f(x) = a x^{-m} + k$), la asíntota horizontal se desplaza a la recta $y = k$.
ejemplo_guiado:
  enunciado: 'Identifica la asíntota horizontal y describe la aproximación gráfica cuando $x \to +\infty$ y $x \to -\infty$ para las funciones potencia: A) $f(x) = \frac{5}{x^2}$, B) $g(x) = \frac{-2}{x^3}$.'
  pasos:
    - 'Paso 1: Para $f(x) = \frac{5}{x^2}$, calculamos límites: $\lim_{x \to \pm\infty} \frac{5}{x^2} = 0$. La asíntota horizontal es la recta $y = 0$ (eje $x$).'
    - 'Paso 2: Como $a = 5 > 0$ y $x^2 > 0$, las salidas son siempre positivas. Ambas ramas se aproxima a la asíntota $y = 0$ por arriba.'
    - 'Paso 3: Para $g(x) = \frac{-2}{x^3}$, calculamos límites: $\lim_{x \to \pm\infty} \frac{-2}{x^3} = 0$. La asíntota horizontal es la recta $y = 0$ (eje $x$).'
    - 'Paso 4: Para $x \to +\infty$, $\frac{-2}{+}=\text{negativo} \implies$ se aproxima a $y = 0$ por abajo. Para $x \to -\infty$, $\frac{-2}{-}=\text{positivo} \implies$ se aproxima a $y = 0$ por arriba.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la ecuación de la asíntota horizontal de la función potencia con exponente negativo $f(x) = -8x^{-2} = \frac{-8}{x^2}$?'
    choices:
      - {text: 'La recta horizontal de ecuación $y = 0$ (el eje $x$)', is_correct: true}
      - {text: 'La recta vertical de ecuación $x = 0$ (el eje $y$)', is_correct: false}
      - {text: 'La recta horizontal de ecuación $y = -8$', is_correct: false}
      - {text: 'La recta de ecuación $y = -2$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta horizontal de ecuación $y = 0$ (el eje $x$)''. Las potencias de exponente negativo convergen a cero en el infinito, fijando la asíntota horizontal en $y = 0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la gráfica de la función potencia $f(x) = \frac{3}{x^4}$ jamás interseca al eje de las abscisas (eje $x$)?'
    choices:
      - {text: 'Porque para todo $x \neq 0$, la fracción $\frac{3}{x^4}$ es estrictamente mayor que cero, haciendo que $y = 0$ sea una asíntota horizontal inalcanzable', is_correct: true}
      - {text: 'Porque el eje $x$ no pertenece al plano cartesiano', is_correct: false}
      - {text: 'Porque la función no se puede evaluar para números grandes', is_correct: false}
      - {text: 'Porque el exponente 4 convierte el resultado en cero', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque para todo $x \neq 0$, la fracción $\frac{3}{x^4}$ es estrictamente mayor que cero, haciendo que $y = 0$ sea una asíntota horizontal inalcanzable''. El numerador constante 3 impide que la fracción valga cero.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar que la función sea una potencia de exponente negativo $f(x) = a x^{-m} = \frac{a}{x^m}$.'
  - 'Paso 2: Evaluar el límite cuando la variable tiende al infinito: $\lim_{x \to \pm\infty} \frac{a}{x^m} = 0$.'
  - 'Paso 3: Declarar la ecuación de la asíntota horizontal como la recta $y = 0$ (eje $x$).'
  - 'Paso 4: Analizar los signos de las ordenadas para determinar si la aproximación asintótica ocurre por arriba ($y > 0$) o por abajo ($y < 0$).'
errores_correccion: |
  - **Error 1:** Afirmar que la asíntota horizontal se ubica en $y = a$. **Cómo corregirlo:** En la función potencia canónica $a x^{-m}$, el parámetro $a$ está en el numerador. Al tender $x \to \infty$, la división por $x^m$ lleva el resultado a 0, no a $a$. La asíntota es $y = 0$.
  - **Error 2:** Creer que las funciones potencia de exponente positivo también tienen asíntota horizontal. **Cómo corregirlo:** Las funciones de exponente positivo ($n > 0$) divergen a $\pm\infty$ en los extremos; sólo las de exponente negativo ($n < 0$) convergen a la asíntota horizontal $y = 0$.
ejemplos:
  - titulo: 'Asíntota horizontal recíproca mónica'
    enunciado: '¿Cuál es la asíntota horizontal de $f(x) = x^{-3}$?'
    alternativas:
      - 'La recta $y = 0$'
      - 'La recta $x = 0$'
      - 'La recta $y = -3$'
    respuesta: 'La recta $y = 0$'
    solucion_pasos:
      - '1. Es la función $f(x) = \frac{1}{x^3}$.'
      - '2. Su asíntota horizontal es el eje $x$, de ecuación cartesiana $y = 0$.'
  - titulo: 'Aproximación por abajo'
    enunciado: 'Para $g(x) = -\frac{6}{x^2}$, ¿las ramas se aproximan a la asíntota $y = 0$ por abajo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = -6 < 0$ y $x^2 > 0$, las salidas son negativas ($y < 0$), bordeando el eje $x$ por abajo.'
  - titulo: 'Invariancia del valor asintótico'
    enunciado: '¿Todas las funciones potencia de la forma $f(x) = a x^{-m}$ tienen la misma asíntota horizontal $y = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser no trasladadas, el límite en el infinito es $y = 0$ para cualquier $a \neq 0$ y $m \in \mathbb{Z}^+$.'
  - titulo: 'Desplazamiento por constante'
    enunciado: '¿La función $h(x) = \frac{1}{x^2} + 5$ tiene su asíntota horizontal en $y = 5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Sumar 5 desplaza verticalmente la asíntota horizontal de $y = 0$ a $y = 5$.'
errores_frecuentes:
  - 'La asíntota horizontal de la función potencia $f(x) = 4x^{-2}$ es la recta $y = 4$.'
  - 'Las funciones de exponente positivo poseen asíntota horizontal en $y = 0$.'
  - 'La curva de la función $f(x) = \frac{1}{x^2}$ corta al eje de las abscisas en $x = 100$.'
  - 'La asíntota horizontal de $f(x) = x^{-1}$ es la recta vertical $x = 0$.'
  - 'El valor $a < 0$ desplaza la asíntota horizontal a la región negativa $y = a$.'
afirmaciones_verdaderas:
  - 'Toda función potencia de exponente entero negativo $f(x) = a x^{-m}$ ($m \in \mathbb{Z}^+$) posee una asíntota horizontal en la recta $y = 0$ (el eje $x$).'
  - 'En el infinito ($x \to \pm\infty$), la división por potencias de $x$ reduce las ordenadas tendiendo continuamente a cero sin llegar a tocar el eje $x$.'
