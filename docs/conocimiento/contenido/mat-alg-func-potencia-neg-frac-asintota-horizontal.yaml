semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.ASINTOTA_HORIZONTAL
resumen_inicial: 'Identificación de la asíntota horizontal y = 0 en funciones potencia
  de exponente negativo: forma general $f(x) = a x^n$, simetría, dominio y recorrido
  en Exponentes negativos y fraccionarios.'
explicacion_simple: A medida que $x$ crece o decrece sin límite, dividir por una potencia
  cada vez más grande hace que el resultado se acerque cada vez más a cero.
explicacion_formal: '### Definición formal


  Como $f(x)=a/x^n$, cuando $|x|\to\infty$, el denominador $x^n\to\infty$, así que
  $f(x)\to0$. La recta $y=0$ es asíntota horizontal, ya que la gráfica se aproxima
  a ella sin cruzarla (para $x\neq0$) tanto en $+\infty$ como en $-\infty$.


  ### Desarrollo didáctico


  $f(x)=1/x$: para $x=10$, $f(10)=0{,}1$; para $x=1000$, $f(1000)=0{,}001$. Mientras
  más grande es $x$, más se acerca $f(x)$ a $0$, pero nunca llega exactamente a ser
  $0$.'
definiciones_clave: '- **Identificación de la asíntota horizontal y = 0 en funciones
  potencia de exponente negativo**: Función de la forma $f(x) = a x^n$ con $a \neq
  0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a identificación de la asíntota horizontal y = 0 en funciones
  potencia de exponente negativo.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de identificación de la asíntota horizontal y = 0 en funciones potencia de exponente
    negativo.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de identificación de la
    asíntota horizontal y = 0 en funciones potencia de exponente negativo.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
