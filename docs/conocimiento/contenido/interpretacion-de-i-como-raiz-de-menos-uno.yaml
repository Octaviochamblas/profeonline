semantic_id: MAT.NUM.IMAGINARIOS.RAIZ_DE_MENOS_UNO
resumen_inicial: La representación $i = \sqrt{-1}$ permite operar radicales con radicandos
  negativos extrayendo el signo negativo como el factor $i$.
explicacion_simple: 'Cuando veas una raíz cuadrada de un número negativo, como $\sqrt{-b}$
  ($b>0$), puedes separarla como la raíz del número positivo multiplicada por $i$:

  $$\sqrt{-b} = \sqrt{b} \cdot i$$

  Ejemplo: $\sqrt{-9} = \sqrt{9} \cdot i = 3i$.'
explicacion_formal: Para todo $k > 0$, la raíz cuadrada en $\mathbb{C}$ se define
  por $\sqrt{-k} = i \sqrt{k}$. Al trabajar con radicales negativos, debe convertirse
  primero a notación en $i$ antes de aplicar leyes de multiplicación para evitar falsas
  paradojas.
definiciones_clave: '- **Extracción del signo menos**: $\sqrt{-k} = i\sqrt{k}$ para
  $k > 0$.'
propiedades_relaciones: '- **Precaución operacional**: $\sqrt{-a} \cdot \sqrt{-b}
  \neq \sqrt{(-a)(-b)}$. Se debe transformar primero a $(i\sqrt{a})(i\sqrt{b}) = -\sqrt{ab}$.'
ejemplo_guiado:
  enunciado: Calcula el producto $\sqrt{-4} \cdot \sqrt{-9}$ sin caer en la falsa
    paradoja.
  pasos:
  - 'Convertir ambas raíces a notación $i$ PRIMERO:'
  - $\sqrt{-4} = 2i$
  - $\sqrt{-9} = 3i$
  - 'Multiplicar los resultados: $(2i) \cdot (3i) = 6 i^2 = 6(-1) = -6$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de $\sqrt{-2} \cdot \sqrt{-8}$?
  choices:
  - text: '-4'
    is_correct: true
  - text: '4'
    is_correct: false
  - text: 4i
    is_correct: false
  - text: -4i
    is_correct: false
  explanation: 'La correcta es: -4. $(i\sqrt{2}) \cdot (i\sqrt{8}) = i^2 \sqrt{16}
    = -1 \cdot 4 = -4$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Simplifica $\sqrt{-12}$.
  choices:
  - text: 2i\sqrt{3}
    is_correct: true
  - text: 2\sqrt{3}
    is_correct: false
  - text: 4i\sqrt{3}
    is_correct: false
  - text: -2\sqrt{3}
    is_correct: false
  explanation: 'La correcta es: 2i\sqrt{3}. $\sqrt{12} \cdot i = 2\sqrt{3}i = 2i\sqrt{3}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar inmediatamente toda raíz de negativo $\sqrt{-k}$ por $i\sqrt{k}$.'
- 'Paso 2: Operar algebraicamente los términos con $i$.'
- 'Paso 3: Aplicar $i^2 = -1$ al finalizar.'
errores_correccion: No hagas $\sqrt{-4} \cdot \sqrt{-4} = \sqrt{(-4)(-4)} = \sqrt{16}
  = 4$. ¡Está mal! Debes hacer $(2i)(2i) = 4i^2 = -4$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Expresa $\sqrt{-50}$ simplificada.
  alternativas:
  - 5i\sqrt{2}
  - 5\sqrt{2}
  - 25i\sqrt{2}
  respuesta: 5i\sqrt{2}
  solucion_pasos:
  - $\sqrt{50} \cdot i = 5\sqrt{2}i$.
errores_frecuentes:
- Multiplicar radicandos negativos dentro de la raíz sin extraer $i$ primero.
afirmaciones_verdaderas:
- $\sqrt{-k} = i\sqrt{k}$ para $k > 0$.
al_terminar_debes_ponder: Resolver correctamente operaciones con raíces cuadradas
  de números negativos.
fuente: Texto escolar MINEDUC.
estado: publicado
