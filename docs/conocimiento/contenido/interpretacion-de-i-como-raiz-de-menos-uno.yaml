- placement: after_explicacion_formal
  question: ¿Cuál es la forma correcta de expresar $\sqrt{-49}$?
  choices:
  - text: $7i$ (extrayendo la raíz positiva multiplicada por $i$)
    is_correct: true
  - text: $-7$
    is_correct: false
  - text: $7$
    is_correct: false
  - text: $-7i$
    is_correct: false
  explanation: La alternativa correcta es '$7i$ (extrayendo la raíz positiva multiplicada por $i$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\sqrt{-4} \cdot \sqrt{-9} = -6$ y NO $+6$?
  choices:
  - text: Porque primero se convierte a $(2i)(3i) = 6i^2 = 6(-1) = -6$
    is_correct: true
  - text: Porque se multiplican los signos dando positivo
    is_correct: false
  - text: Porque la raíz de un producto siempre es negativa
    is_correct: false
  - text: Porque $-4 \times -9 = -36$
    is_correct: false
  explanation: La alternativa correcta es 'Porque primero se convierte a $(2i)(3i) = 6i^2 = 6(-1) = -6$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el número positivo $a$ dentro de la raíz negativa $\sqrt{-a}$.'
- 'Paso 2: Extraer el signo negativo convirtiéndolo en la unidad imaginaria exterior $i$: $\sqrt{a} \cdot i$.'
- 'Paso 3: Simplificar el radical real $\sqrt{a}$ si es exacto o descomponerlo en factores primos si es inexacto.'
errores_correccion: '- **Error 1: Multiplicar directamente raíces negativas ($\sqrt{-4} \cdot \sqrt{-9} = \sqrt{36} = 6$).** **Cómo corregirlo:** La regla $\sqrt{x}\sqrt{y} = \sqrt{xy}$ falla en negativos. Se DEBE convertir primero a $(2i)(3i) = 6i^2 = -6$.

  - **Error 2: Dejar el signo menos dentro del radical tras escribir $i$.** **Cómo corregirlo:** Al escribir $i$ afuera, el radicando queda positivo: $\sqrt{-25} = 5i$ (no $\sqrt{25i}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué equivale $\sqrt{-64}$?
  alternativas:
  - $8i$
  - $-8$
  - $8$
  respuesta: $8i$
  solucion_pasos:
  - $\sqrt{-64} = \sqrt{64} \cdot i = 8i$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la simplificación de $\sqrt{-50}$?
  alternativas:
  - $5\sqrt{2}i$
  - $25\sqrt{2}i$
  - $50i$
  respuesta: $5\sqrt{2}i$
  solucion_pasos:
  - $\sqrt{-50} = \sqrt{25 \cdot 2} \cdot i = 5\sqrt{2}i$.
- titulo: ¿Es √(-1) · √(-1) = -1?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $i \cdot i = i^2 = -1$.
  alternativas:
  - texto: Sí, i · i = i² = -1
    es_correcta: true
    retroalimentacion: ¡Correcto! Definición directa de la unidad imaginaria.
  - texto: No, es √1 = 1
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad de producto no aplica a radicandos negativos simultáneos.
  - texto: No, es i
    es_correcta: false
    retroalimentacion: Incorrecto, $i \cdot i = -1$.
- titulo: ¿Es √(-81) / √(-9) = 3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{9i}{3i} = \frac{9}{3} = 3$ (las unidades $i$ se cancelan).
  alternativas:
  - texto: Sí, (9i) / (3i) = 3
    es_correcta: true
    retroalimentacion: ¡Correcto! Cancelación de la unidad imaginaria en la división.
  - texto: No, es 3i
    es_correcta: false
    retroalimentacion: Incorrecto, la unidad $i$ se divide entre sí misma dando 1.
  - texto: No, es -3
    es_correcta: false
    retroalimentacion: Incorrecto, los signos negativos se transforman en $i$ y se cancelan.
errores_frecuentes:
- Multiplicar radicandos negativos antes de extraer la unidad imaginaria $i$.
- Olvidar que $\sqrt{-a}$ genera una unidad $i$ multiplicativa externa.
- Asumir que $\sqrt{-1} = 1$ o $\sqrt{-1} = -1$.
- Aplicar leyes de exponentes reales sin verificar la positividad de las bases.
afirmaciones_verdaderas:
- Cualquier raíz cuadrada de un número negativo $-a$ ($a > 0$) equivale a $\sqrt{a} \cdot i$.
- La propiedad $\sqrt{x}\sqrt{y} = \sqrt{xy}$ no es válida cuando ambos números son negativos.
- Toda operación con radicales negativos debe convertirse a múltiplos de $i$ antes de operar.
al_terminar_debes_poder: '![Síntesis de interpretación de i como raíz de menos uno](/static/img/nodos/interpretacion-de-i-como-raiz-de-menos-uno-resumen.svg)


  QUÉ: Interpretar y simplificar radicales con radicandos negativos empleando la equivalencia $i = \sqrt{-1}$.


  CÓMO: Transformando $\sqrt{-a}$ en $\sqrt{a} \cdot i$ para todo $a > 0$ y convirtiendo previamente cada radical a su forma imaginaria antes de efectuar productos o divisiones.'
