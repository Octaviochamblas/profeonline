semantic_id: MAT.NUM.NUMEROS_IMAGINARIOS.I_RAIZ_MENOS_UNO
resumen_inicial: 'La unidad imaginaria se interpreta como la raíz cuadrada del número negativo $-1$: $i = \sqrt{-1}$, permitiendo descomponer cualquier radical negativo como $\sqrt{-a} = \sqrt{a} \cdot i$ para todo $a > 0$.'
explicacion_simple: '![Interpretación de i como raíz de menos uno](/static/img/nodos/interpretacion-de-i-como-raiz-de-menos-uno-intro.svg)


  ¿Cómo calcular la raíz cuadrada de un número negativo?

  - Separas el número positivo del signo menos: $\sqrt{-100} = \sqrt{100 \cdot (-1)} = \sqrt{100} \cdot \sqrt{-1}$.

  - Como $\sqrt{100} = 10$ y $\sqrt{-1} = i$, el resultado es **$10i$**.

  - En general: **todo signo menos adentro de una raíz cuadrada sale afuera convertido en $i$**: $\sqrt{-a} = \sqrt{a} \cdot i$ ($a > 0$).

  - ¡Cuidado! Para multiplicar raíces negativas, **primero debes convertirlas a $i$** antes de multiplicar.'
explicacion_formal: 'Sea $a \in \mathbb{R}^+ = ]0, +\infty[$. La **raíz cuadrada principal de un número real negativo** $-a$ se define formalmente en $\mathbb{C}$ mediante:


  $$\sqrt{-a} = \sqrt{a \cdot (-1)} = \sqrt{a} \cdot \sqrt{-1} = \sqrt{a} \cdot i$$


  **Fallo de la Propiedad Multiplicativa de Radicales en $\mathbb{R}^-$:**

  La identidad $\sqrt{x \cdot y} = \sqrt{x} \cdot \sqrt{y}$ **NO es válida** cuando $x < 0$ e $y < 0$ simultáneamente:

  $$\sqrt{-a} \cdot \sqrt{-b} = (\sqrt{a}i) \cdot (\sqrt{b}i) = \sqrt{ab} \cdot i^2 = -\sqrt{ab} \neq \sqrt{(-a)(-b)} = \sqrt{ab}$$

  Por esta razón, la conversión a la unidad imaginaria $i$ debe realizarse obligatoriamente antes de cualquier producto o cociente.'
definiciones_clave: '- **Raíz cuadrada imaginaria**: Transformación $\sqrt{-a} = \sqrt{a} \cdot i$ para $a > 0$.

  - **Radical negativo**: Expresión $\sqrt{-a}$ con radicando real estrictamente menor que cero.

  - **Falsa multiplicación de radicales**: Falacia algebraica de agrupar signos negativos directos dentro de una sola raíz.'
propiedades_relaciones: '- **Extracción de cuadrados perfectos**: $\sqrt{-4} = 2i, \sqrt{-9} = 3i, \sqrt{-16} = 4i, \sqrt{-25} = 5i$.

  - **Radicales inexactos**: $\sqrt{-12} = \sqrt{4 \cdot 3}i = 2\sqrt{3}i$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de raíz de menos uno](/static/img/nodos/interpretacion-de-i-como-raiz-de-menos-uno-ejemplos.svg)


    Calcule el valor de $\sqrt{-100}$ y resuelva correctamente el producto $\sqrt{-4} \cdot \sqrt{-9}$.'
  pasos:
  - 'Paso 1: Para $\sqrt{-100}$: Factorizar como $\sqrt{100} \cdot \sqrt{-1}$.'
  - 'Paso 2: Sustituir $\sqrt{100} = 10$ y $\sqrt{-1} = i \implies 10i$.'
  - 'Paso 3: Para $\sqrt{-4} \cdot \sqrt{-9}$: Convertir PRIMERO cada radical a forma imaginaria: $(2i) \cdot (3i)$.'
  - 'Paso 4: Multiplicar los números imaginarios: $6 \cdot i^2 = 6 \cdot (-1) = -6$.'
