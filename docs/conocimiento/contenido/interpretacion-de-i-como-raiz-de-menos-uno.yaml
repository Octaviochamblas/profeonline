semantic_id: MAT.NUM.IMAGINARIOS.RAIZ_DE_MENOS_UNO
resumen_inicial: 'La interpretación de $i = \sqrt{-1}$ establece que la unidad imaginaria es el factor que permite extraer el signo negativo de cualquier raíz cuadrada, convirtiéndola en un número imaginario puro.'
explicacion_simple: |
  Interpretar $i$ como $\sqrt{-1}$ es la herramienta principal para resolver ecuaciones de segundo grado cuyos discriminantes son negativos (como $x^2 + 9 = 0 \implies x^2 = -9$). Al aplicar la raíz cuadrada, separas la parte numérica positiva de la parte negativa: $\sqrt{-9} = \sqrt{9} \cdot \sqrt{-1} = 3i$. Esto demuestra que la unidad imaginaria actúa como un "extraedor de negativos" dentro de las raíces cuadradas.
explicacion_formal: |
  ### Definición formal
  La **interpretación de $i$ como raíz de menos uno** establece la equivalencia de notación y solución operacional de la ecuación de grado dos:
  $$x^2 + 1 = 0 \implies x^2 = -1 \implies x = \pm \sqrt{-1} = \pm i$$

  ### Regla de extracción del factor imaginario
  Para todo número real $a \in \mathbb{R}^+$:
  $$\sqrt{-a} = \sqrt{a} \cdot \sqrt{-1} = \sqrt{a} \cdot i$$

  ### Incompatibilidad de propiedades reales en radicales negativos
  En el cuerpo complejo $\mathbb{C}$, la propiedad distributiva de las raíces reales sobre la multiplicación $\sqrt{x \cdot y} = \sqrt{x} \cdot \sqrt{y}$ **NO se aplica directamente a dos números negativos simultáneos**:
  $$\text{Incorrecto: } \sqrt{-a} \cdot \sqrt{-b} = \sqrt{(-a)(-b)} = \sqrt{ab}$$
  $$\text{Correcto: } \sqrt{-a} \cdot \sqrt{-b} = (\sqrt{a}i) \cdot (\sqrt{b}i) = \sqrt{ab} \cdot i^2 = -\sqrt{ab}$$

  ### Síntesis didáctica
  - Factor imaginario extraíble: $\sqrt{-1} = i$.
  - Manejo de signos en radicales: Extraer obligatoriamente la unidad $i$ **antes** de multiplicar o simplificar expresiones de raíces cuadradas negativas.
definiciones_clave: |
  - **Factor imaginario extraíble**: Reemplazo directo del símbolo $\sqrt{-1}$ por la constante $i$.
  - **Incompatibilidad de propiedades en $\mathbb{R}$**: Restricción que impide multiplicar radicandos negativos antes de extraer la unidad imaginaria.
  - **Solución compleja de $x^2 + c = 0$**: Conjunto solución $x = \pm \sqrt{c}i$ para ecuaciones puras cuadráticas con $c > 0$.
propiedades_relaciones: |
  - **Resolución de ecuaciones de segundo grado**: Permite aplicar la fórmula general cuadrática $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$ cuando el discriminante $\Delta = b^2 - 4ac < 0$.
  - **Plano de Argand**: Ubicación sobre el eje vertical imaginario de la coordenada $(0, 1)$.
ejemplo_guiado:
  enunciado: 'Resuelve la ecuación cuadrática pura $x^2 + 36 = 0$ en el conjunto de los números complejos $\mathbb{C}$ aplicando la interpretación $i = \sqrt{-1}$.'
  pasos:
    - 'Paso 1: Despejamos el término cuadrático restando 36 a ambos lados: $x^2 = -36$.'
    - 'Paso 2: Aplicamos la raíz cuadrada a ambos miembros añadiendo el doble signo: $x = \pm \sqrt{-36}$.'
    - 'Paso 3: Separamos la raíz cuadrada del positivo y el factor $-1$: $x = \pm \sqrt{36 \cdot (-1)} = \pm \sqrt{36} \cdot \sqrt{-1}$.'
    - 'Paso 4: Sustituimos $\sqrt{36} = 6$ y la interpretación $\sqrt{-1} = i$: $x_1 = 6i, \; x_2 = -6i$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué se debe extraer la unidad imaginaria $i = \sqrt{-1}$ antes de multiplicar dos raíces cuadradas negativas como $\sqrt{-4} \cdot \sqrt{-9}$?'
    choices:
      - {text: 'Porque la propiedad real $\sqrt{a \cdot b} = \sqrt{a} \cdot \sqrt{b}$ falla al aplicarse simultáneamente a dos radicandos negativos, dando un signo incorrecto', is_correct: true}
      - {text: 'Porque los números negativos no se pueden multiplicar entre sí', is_correct: false}
      - {text: 'Porque las raíces cuadradas siempre resultan en números positivos', is_correct: false}
      - {text: 'Porque la letra i se destruye al multiplicar por 2', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque la propiedad real $\sqrt{a \cdot b} = \sqrt{a} \cdot \sqrt{b}$ falla al aplicarse simultáneamente a dos radicandos negativos, dando un signo incorrecto''. Multiplicar $(-4)(-9) = 36$ da $+6$, mientras que la respuesta correcta usando $i$ es $-6$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son las soluciones complejas de la ecuación $x^2 + 100 = 0$?'
    choices:
      - {text: '$x = \pm 10i$', is_correct: true}
      - {text: '$x = \pm 10$', is_correct: false}
      - {text: '$x = -100$', is_correct: false}
      - {text: '$x = 100i$, sin extraer raíz', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \pm 10i$''. Despejamos $x^2 = -100 \implies x = \pm \sqrt{-100} = \pm 10i$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la raíz cuadrada con radicando negativo $\sqrt{-a}$.'
  - 'Paso 2: Reescribir el radical separando la parte positiva y el factor $-1$: $\sqrt{a} \cdot \sqrt{-1}$.'
  - 'Paso 3: Sustituir inmediatamente el símbolo $\sqrt{-1}$ por la unidad imaginaria $i$.'
  - 'Paso 4: Realizar las operaciones de multiplicación o simplificación sobre los números imaginarios resultantes.'
errores_correccion: |
  - **Error 1:** Resolver $\sqrt{-a} \cdot \sqrt{-b} = \sqrt{ab}$ multiplicando los radicandos negativos antes de convertir a $i$ (ej: $\sqrt{-4} \cdot \sqrt{-9} = \sqrt{36} = 6$). **Cómo corregirlo:** La propiedad $\sqrt{x} \sqrt{y} = \sqrt{xy}$ es **inválida cuando ambos radicandos son negativos**. Primero debes convertir a imaginarios: $(2i)(3i) = 6i^2 = -6$.
  - **Error 2:** Creer que la solución de $x^2 = -9$ es sólo $+3i$. **Cómo corregirlo:** Toda ecuación cuadrática $x^2 = -a$ (con $a > 0$) tiene **dos soluciones complejas conjugadas**: $x = + \sqrt{a}i$ y $x = - \sqrt{a}i$.
ejemplos:
  - titulo: 'Extracción de factor negativo en raíz'
    enunciado: '¿La expresión $\sqrt{-64}$ es igual a $8i$?'
    alternativas:
      - 'Sí, pues $\sqrt{64} \cdot \sqrt{-1} = 8i$'
      - 'No, es igual a -8'
      - 'No, es igual a 64i'
    respuesta: 'Sí, pues $\sqrt{64} \cdot \sqrt{-1} = 8i$'
    solucion_pasos:
      - '1. Separamos el factor negativo: $\sqrt{64} \cdot \sqrt{-1}$.'
      - '2. Evaluamos $\sqrt{64} = 8$ y $\sqrt{-1} = i \implies 8i$.'
  - titulo: 'Multiplicación de tres raíces negativas'
    enunciado: '¿El producto $\sqrt{-1} \cdot \sqrt{-1} \cdot \sqrt{-1}$ resulta en $-i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $i \cdot i \cdot i = i^3 = -i$.'
  - titulo: 'Solución de ecuación cuadrática pura'
    enunciado: '¿La ecuación $x^2 + 16 = 0$ tiene por soluciones a $x_1 = 4i$ y $x_2 = -4i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $x^2 = -16 \implies x = \pm \sqrt{-16} = \pm 4i$.'
  - titulo: 'Fracción con raíz negativa'
    enunciado: '¿La expresión $\frac{\sqrt{-81}}{3}$ equivale a $3i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{9i}{3} = 3i$.'
errores_frecuentes:
  - 'Multiplicar directamente dos radicales negativos aplicando $\sqrt{-a} \cdot \sqrt{-b} = \sqrt{a \cdot b}$ obteniendo un resultado con signo incorrecto.'
  - 'Considerar únicamente la solución positiva al resolver la ecuación cuadrática $x^2 = -a$.'
  - 'El reemplazo directo de la expresión $\sqrt{-1}$ es equivalente al número entero positivo $+1$.'
  - 'La raíz cuadrada de un radicando negativo resulta únicamente en el valor absoluto real del número.'
  - 'Afirmar que las raíces de números negativos carecen de todo tipo de representación matemática.'
afirmaciones_verdaderas:
  - 'La interpretación de $i = \sqrt{-1}$ exige convertir cualquier raíz cuadrada negativa a su forma imaginaria $bi$ antes de realizar operaciones de multiplicación o división.'
  - 'Las ecuaciones cuadráticas puras de la forma $x^2 + a = 0$ (con $a > 0$) poseen dos soluciones complejas puras imaginarias conjugadas $x = \pm \sqrt{a}i$.'
al_terminar_debes_poder: 'Interpretar $i = \sqrt{-1}$ para extraer el signo negativo de radicales y resolver ecuaciones cuadráticas con discriminante negativo.'
