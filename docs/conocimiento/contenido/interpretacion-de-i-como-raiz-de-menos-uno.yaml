resumen_inicial: La interpretación de $i = \sqrt{-1}$ permite resolver raíces cuadradas
  de cualquier número real negativo expresándolas como $a \cdot i$ ($a > 0$).
explicacion_simple: Interpretar la unidad imaginaria como $\sqrt{-1}$ nos permite
  separar cualquier raíz cuadrada de un número negativo en la raíz del número positivo
  multiplicada por $i$. Por ejemplo, $\sqrt{-25} = \sqrt{25} \cdot i = 5i$.
explicacion_formal: 'Para todo real positivo $a > 0$, la **Extracción de la Raíz Negativa**
  satisface la regla:


  $$\sqrt{-a} = \sqrt{a \cdot (-1)} = \sqrt{a} \cdot \sqrt{-1} = \sqrt{a} \cdot i$$


  **Precaución con la propiedad del producto radical:**

  La propiedad $\sqrt{x \cdot y} = \sqrt{x} \cdot \sqrt{y}$ rige si al menos uno de
  los dos es no negativo. NUNCA se aplica a dos negativos simultáneos: $\sqrt{-a}
  \cdot \sqrt{-b} \neq \sqrt{(-a)(-b)} = \sqrt{ab}$.

  Correcto: $\sqrt{-a} \cdot \sqrt{-b} = (i\sqrt{a}) \cdot (i\sqrt{b}) = i^2 \sqrt{ab}
  = -\sqrt{ab}$.'
definiciones_clave: '- **Interpretación $i = \sqrt{-1}$**: Regla de extracción del
  signo negativo del radical como la unidad imaginaria $i$.'
propiedades_relaciones: '- **Resolución de negativos**: $\sqrt{-a} = i\sqrt{a}$ para
  todo $a > 0$.'
ejemplo_guiado:
  enunciado: Calcule el valor exacto de la multiplicación de raíces negativas $\sqrt{-4}
    \cdot \sqrt{-9}$.
  pasos:
  - 'Paso 1: Convertir cada raíz negativa a forma imaginaria: $\sqrt{-4} = 2i$ y $\sqrt{-9}
    = 3i$.'
  - 'Paso 2: Multiplicar los números imaginarios puros: $(2i) \cdot (3i) = 6i^2$.'
  - 'Paso 3: Aplicar $i^2 = -1$: $6 \cdot (-1) = -6$.'
  - 'Conclusión: $\sqrt{-4} \cdot \sqrt{-9} = -6$ (¡atención: NO es $\sqrt{36} = +6$!).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se expresa la raíz cuadrada de un real negativo sqrt(-a) (con a
    > 0)?
  choices:
  - text: Como el producto de la raíz positiva por i (sqrt(a) · i)
    is_correct: true
  - text: Como el entero negativo -a
    is_correct: false
  - text: Como la raíz positiva sqrt(a) solamente
    is_correct: false
  - text: Como cero
    is_correct: false
  explanation: La alternativa correcta es 'Como el producto de la raíz positiva por
    i (sqrt(a) · i)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt{-4} · sqrt{-9}, ¿cuál fue el resultado
    correcto?
  choices:
  - text: -6 (al pasar a 2i · 3i = 6i^2 = -6)
    is_correct: true
  - text: +6 (errando por sqrt(36))
    is_correct: false
  - text: 6i
    is_correct: false
  - text: '36'
    is_correct: false
  explanation: La alternativa correcta es '-6 (al pasar a 2i · 3i = 6i^2 = -6)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de evaluar y operar raíces cuadradas
  de números negativos $\sqrt{-a} = i\sqrt{a}$, evitando la falsa aplicación del producto
  radical directo sobre dos negativos.
semantic_id: MAT.NUM.IMAGINARIOS.RAIZ_DE_MENOS_UNO
procedimiento:
- 'Paso 1: Identificar las expresiones con raíces negativas o potencias de $i$.'
- 'Paso 2: Aplicar la definición fundamental $i^2 = -1$ o el ciclo periódico modular
  $4$.'
- 'Paso 3: Simplificar la expresión resultando en un número imaginario puro o real.'
errores_correccion: '- **Error 1: Aplicar la propiedad $\sqrt{ab} = \sqrt{a}\sqrt{b}$
  a dos números negativos ($(\sqrt{-2})(\sqrt{-8}) = \sqrt{16} = 4$).** **Cómo corregirlo:**
  Se DEBE pasar primero a forma imaginaria ($i\sqrt{2} \cdot i\sqrt{8} = i^2 \sqrt{16}
  = -4$).


  - **Error 2: Confundir $i^2$ con $+1$.** **Cómo corregirlo:** La definición fundamental
  exige que $i^2 = -1$ (signo negativo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.IMAGINARIOS.RAIZ_DE_MENOS_UNO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de los números imaginarios.
- titulo: Ejemplo 2
  enunciado: Verificación de la unidad imaginaria.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal con i^2 = -1.
- titulo: ¿Es i^4 igual al número entero 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $i^4 = (i^2)^2 = (-1)^2 = 1$.
- titulo: ¿Permite la unidad imaginaria resolver ecuaciones como x^2 + 1 = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^2 = -1 \implies x = \pm i$.
errores_frecuentes:
- Afirmar que la elevación de la unidad imaginaria al cuadrado $i^2$ resulta en el
  entero positivo $+1$.
- Multiplicar dos raíces de números negativos aplicando directamente el producto radical
  sin extraer la unidad imaginaria $i$.
- Intentar las potencias de la unidad imaginaria como una secuencia lineal sin periodicidad
  de 4 pasos.
- La expresión $\sqrt{-16}$ equivale numéricamente al entero real $-4$.
- Sumar las potencias de $i$ de exponentes consecutivos sin simplificar sus residuos
  modulares.
afirmaciones_verdaderas:
- La unidad imaginaria $i$ se define mediante la igualdad fundamental $i^2 = -1$ o
  $i = \sqrt{-1}$.
- 'Las potencias enteras de $i$ se repiten en un ciclo periódico de cuatro valores:
  $i, -1, -i, 1$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
