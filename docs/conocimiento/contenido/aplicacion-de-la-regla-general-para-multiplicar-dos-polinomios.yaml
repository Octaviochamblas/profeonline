semantic_id: MAT.ALG.MULT_POLINOMIOS.REGLA_GENERAL
resumen_inicial: La aplicación de la regla general para multiplicar dos polinomios establece que se multiplica cada término del primer polinomio por todos y cada uno de los términos del segundo polinomio y se reducen los términos semejantes.
explicacion_simple: "Para multiplicar **dos polinomios de cualquier tamaño** (ej: $(2x + 3) \\cdot (x^2 - 4x + 5)$):\n- **REGLA GENERAL**: **TODOS LOS TÉRMINOS del primer polinomio MULTIPLICAN A TODOS LOS TÉRMINOS del segundo polinomio**.\n- **Paso a paso**:\n  1. Toma el **primer término** del primer polinomio y multiplícalo por cada término del segundo.\n  2. Toma el **segundo término** del primer polinomio y multiplícalo por cada término del segundo.\n  3. Junta todas las multiplicaciones parciales obtenidas.\n  4. **Reduce los términos semejantes** (suma o resta las potencias iguales).\n- **Ejemplo**: $(2x + 3) \\cdot (x^2 - 4x + 5)$:\n  - Con $2x$: $2x(x^2) - 2x(4x) + 2x(5) = \\mathbf{2x^3 - 8x^2 + 10x}$.\n  - Con $+3$: $3(x^2) - 3(4x) + 3(5) = \\mathbf{+3x^2 - 12x + 15}$.\n  - Suma total de términos: $2x^3 - 8x^2 + 10x + 3x^2 - 12x + 15$.\n  - Reducción semejante: $2x^3 + (-8x^2 + 3x^2) + (10x - 12x) + 15 = \\mathbf{2x^3 - 5x^2 - 2x + 15}$.\n\n![Regla General para Multiplicar Dos Polinomios](/static/img/nodos/aplicacion-de-la-regla-general-para-multiplicar-dos-polinomios-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $A(x) = \sum_{i=1}^m a_i x^{\alpha_i}$ y $B(x) = \sum_{j=1}^n b_j x^{\beta_j}$ dos polinomios en $\mathbb{R}[x]$. La **multiplicación polinómica general** es el operador bilinear que expande la suma doble de productos monómicos parciales:


  $$(A \cdot B)(x) = \sum_{i=1}^m \sum_{j=1}^n (a_i \cdot b_j) x^{\alpha_i + \beta_j}$$


  seguida por la proyección reductiva sobre la familia canónica de grados:


  $$(A \cdot B)(x) = \sum_{k=0}^{\operatorname{deg}(A)+\operatorname{deg}(B)} c_k x^k \quad \text{donde } c_k = \sum_{\alpha_i + \beta_j = k} a_i b_j$$


  ### Número Inicial de Productos Parciales

  Antes de cualquier reducción de términos semejantes, la multiplicación de un polinomio de $m$ términos por uno de $n$ términos genera exactamente $m \cdot n$ productos parciales monómicos.


  ### Síntesis didáctica

  La regla general es la extensión cartesiana total de la distributividad, garantizando la interacción de cada sumando de un polinomio con todos los del otro.

  '
definiciones_clave: '- **Regla general de multiplicación de polinomios**: Operador por el cual cada sumando $a_i$ del multiplicando se distribuye sobre cada sumando $b_j$ del multiplicador.

  - **Matriz de productos parciales ($m \cdot n$)**: Conjunto de los $m \times n$ resultados monómicos generados antes de la consolidación aditiva.

  - **Consolidación aditiva por grado ($c_k$)**: Suma de coeficientes asociados a potencias coincidentes $\alpha_i + \beta_j = k$.

  '
propiedades_relaciones: '- **Cota exacta de grado**: $\operatorname{deg}(A \cdot B) = \operatorname{deg}(A) + \operatorname{deg}(B)$ (para polinomios no nulos sobre un cuerpo).

  - **Conmutatividad del producto de polinomios**: $A(x) \cdot B(x) = B(x) \cdot A(x)$.

  '
ejemplo_guiado:
  enunciado: Multiplica el polinomio $A = 3x - 2$ por el polinomio $B = 2x^2 + 5x - 4$.
  pasos:
  - 'Paso 1: Identificamos que $A$ tiene 2 términos y $B$ tiene 3 términos $\implies$ Generaremos $2 \cdot 3 = 6$ productos parciales.'
  - 'Paso 2: Distribuimos el primer término del primer polinomio ($3x$): - $3x \cdot 2x^2 = \mathbf{6x^3}$. - $3x \cdot 5x = \mathbf{+15x^2}$. - $3x \cdot (-4) = \mathbf{-12x}$.'
  - 'Paso 3: Distribuimos el segundo término del primer polinomio ($-2$): - $-2 \cdot 2x^2 = \mathbf{-4x^2}$. - $-2 \cdot 5x = \mathbf{-10x}$. - $-2 \cdot (-4) = \mathbf{+8}$.'
  - 'Paso 4: Escribimos los 6 productos parciales continuos: $6x^3 + 15x^2 - 12x - 4x^2 - 10x + 8$.'
  - 'Paso 5: Reducimos los términos semejantes: - Clase $x^3$: $\mathbf{6x^3}$. - Clase $x^2$: $+15x^2 - 4x^2 = \mathbf{+11x^2}$. - Clase $x$: $-12x - 10x = \mathbf{-22x}$. - Constante: $\mathbf{+8}$.'
  - 'Conclusión: El polinomio producto resultante es **$6x^3 + 11x^2 - 22x + 8$**.'
  imagen: /static/img/nodos/aplicacion-de-la-regla-general-para-multiplicar-dos-polinomios-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos productos parciales monómicos se generan inicialmente al multiplicar un polinomio de 3 términos por un polinomio de 4 términos antes de reducir términos semejantes?
  choices:
  - text: Se generan exactamente 12 productos parciales ($3 \cdot 4 = 12$)
    is_correct: true
  - text: Se generan 7 productos parciales ($3 + 4 = 7$)
    is_correct: false
  - text: Se generan 4 productos parciales
    is_correct: false
  - text: Se generan 3 productos parciales
    is_correct: false
  explanation: La alternativa correcta es 'Se generan exactamente 12 productos parciales ($3 \cdot 4 = 12$)'. Matriz de productos parciales $m \cdot n$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de multiplicar $(x + 2) \cdot (x^2 - 3)$?
  choices:
  - text: El resultado es $x^3 + 2x^2 - 3x - 6$, al distribuir todos los términos y ordenar por grados
    is_correct: true
  - text: El resultado es $x^3 - 6$
    is_correct: false
  - text: El resultado es $x^3 + 2x - 6$
    is_correct: false
  - text: El resultado es $x^2 + 2x - 6$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $x^3 + 2x^2 - 3x - 6$, al distribuir todos los términos y ordenar por grados'. $x(x^2-3)+2(x^2-3) = x^3-3x+2x^2-6 = x^3+2x^2-3x-6$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Contar los términos de ambos polinomios y determinar la cantidad esperada de productos parciales ($m \cdot n$).'
- 'Paso 2: Tomar secuencialmente cada término del primer polinomio y multiplicarlo por todos los términos del segundo polinomio.'
- 'Paso 3: Escribir la cadena completa de monomios resultantes respetando las leyes de signos y potencias.'
- 'Paso 4: Identificar y reducir las clases de términos semejantes para presentar el polinomio final ordenado.'
errores_correccion: '- **Error 1:** Multiplicar únicamente los primeros términos y los últimos términos entre sí (escribir $(x+2)(x+3) = x^2 + 6$). **Cómo corregirlo:** Se deben **MULTIPLICAR TODOS LOS TÉRMINOS CON TODOS ($x^2 + 3x + 2x + 6 = x^2 + 5x + 6$)**.

  - **Error 2:** Excluir la reducción de los términos semejantes al finalizar la expansión cartesiana. **Cómo corregirlo:** La respuesta final **DEBE CONSOLIDAR LAS POTENCIAS IGUALES**.

  '
ejemplos:
- titulo: Binomio por binomio
  enunciado: ¿Cuál es el producto de $(a + 3) \cdot (a + 4)$?
  alternativas:
  - $a^2 + 7a + 12$
  - $a^2 + 12$
  - $a^2 + 7a + 7$
  respuesta: $a^2 + 7a + 12$
  solucion_pasos:
  - '1. Productos: $a^2 + 4a + 3a + 12$.'
  - '2. Reducción: $a^2 + 7a + 12$.'
- titulo: Binomio por trinomio
  enunciado: ¿Cuál es el producto de $(x - 1) \cdot (x^2 + x + 1)$?
  alternativas:
  - $x^3 - 1$
  - $x^3 + 2x^2 - 1$
  - $x^3 - x^2 - 1$
  respuesta: $x^3 - 1$
  solucion_pasos:
  - 1. $x^3 + x^2 + x - x^2 - x - 1$.
  - '2. Cancelación de semejantes: $x^3 - 1$.'
- titulo: Suma de grados en producto
  enunciado: Al multiplicar un polinomio de grado 2 por uno de grado 3, ¿tiene el producto resultante grado 5?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\operatorname{deg}(A \cdot B) = 2 + 3 = 5$.
- titulo: Conmutatividad comprobada
  enunciado: ¿Es el resultado de $(x + 5)(x - 2)$ idéntico al de $(x - 2)(x + 5)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la multiplicación de polinomios es conmutativa.
errores_frecuentes:
- Multiplicar únicamente los términos correspondientes en la misma posición omitiendo las multiplicaciones cruzadas.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Dejar la respuesta expresada como suma de productos parciales sin reducir los términos semejantes.
- Intercambiar la suma de exponentes al multiplicar potencias con la adición de coeficientes.
- Alterar los signos del segundo polinomio al distribuir si el término del primer polinomio es negativo.
afirmaciones_verdaderas:
- La multiplicación de dos polinomios exige multiplicar cada término del primero por todos los términos del segundo y reducir semejantes.
- El grado del polinomio producto es igual a la suma de los grados de los polinomios multiplicandos.
al_terminar_debes_poder: '![Resumen de regla general de multiplicación](/static/img/nodos/aplicacion-de-la-regla-general-para-multiplicar-dos-polinomios-resumen.svg)


  QUÉ: Multiplicar dos polinomios cualesquiera aplicando la regla general de distribución.


  CÓMO: Multiplicar cada término del primer polinomio por todos los términos del segundo $P(x) \cdot Q(x) = \sum a_i b_j x^{i+j}$, sumando algebraicamente los términos semejantes resultantes.'
