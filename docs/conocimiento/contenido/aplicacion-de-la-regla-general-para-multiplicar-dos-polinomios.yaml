semantic_id: MAT.ALG.MULT_POLINOMIOS.REGLA_GENERAL
resumen_inicial: 'Aplicación de la regla general para multiplicar dos polinomios:
  leyes, procedimiento y aplicación en Multiplicación de polinomios.'
explicacion_simple: Si la multiplicación de monomio por polinomio era un cartero entregando
  cartas en una cuadra, la multiplicación de polinomios es como si todos los carteros
  de una oficina entregaran cartas en todas las casas de la cuadra. Absolutamente
  todos se multiplican con todos.
explicacion_formal: '### Definición formal


  Sean $P(x)=\sum_{i=0}^{m} a_i x^i$ y $Q(x)=\sum_{j=0}^{n} b_j x^j$ dos polinomios.
  Su producto se define por

  $$P(x)Q(x)=\sum_{i=0}^{m}\sum_{j=0}^{n} a_i b_j x^{i+j}.$$

  Al reagrupar los términos del mismo grado, también puede escribirse como

  $$P(x)Q(x)=\sum_{k=0}^{m+n}\left(\sum_{i+j=k} a_i b_j\right)x^k.$$

  Esto expresa que multiplicar dos polinomios consiste en aplicar la distributividad
  a todos los pares de términos y luego reducir los términos semejantes. Si $P$ tiene
  $r$ términos no nulos y $Q$ tiene $s$ términos no nulos, entonces aparecen $r\cdot
  s$ productos parciales antes de la reducción.


  ### Desarrollo didáctico


  Multiplica: $(2x + 3)(x - 4)$.


  Aplicamos la distribución extendida:

  1. $(2x)(x) = 2x^2$.

  2. $(2x)(-4) = -8x$.

  3. $(3)(x) = +3x$.

  4. $(3)(-4) = -12$.


  Unimos los términos: $2x^2 - 8x + 3x - 12$.

  Reducimos semejantes (familia $x$): $-8x + 3x = -5x$.

  Resultado final: $2x^2 - 5x - 12$.'
definiciones_clave: '- **Aplicación de la regla general para multiplicar dos polinomios**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a aplicación de la regla general para multiplicar
  dos polinomios.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de aplicación de la regla
    general para multiplicar dos polinomios.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de aplicación de la regla general para multiplicar
    dos polinomios.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
