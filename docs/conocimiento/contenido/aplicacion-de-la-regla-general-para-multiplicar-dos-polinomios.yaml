procedimiento:
- 'Paso 1: Identifica todos los términos de cada polinomio y decide un orden de trabajo
  claro.'
- 'Paso 2: Multiplica cada término del primer polinomio por cada término del segundo,
  sin omitir ninguna combinación.'
- 'Paso 3: Escribe todos los productos parciales conservando signos, coeficientes
  y potencias.'
- 'Paso 4: Agrupa los términos que tengan la misma parte literal y el mismo exponente.'
- 'Paso 5: Reduce los términos semejantes y ordena el resultado final.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en aplicación de la regla general para multiplicar dos polinomios.
ejemplos:
- titulo: El producto cruzado
  enunciado: 'Multiplica: (a + b)(a - b).'
  solucion_pasos:
  - (a)(a) = a^2.
  - (a)(-b) = -ab.
  - (b)(a) = +ab (ordenado).
  - (b)(-b) = -b^2.
  - 'Línea completa: a^2 - ab + ab - b^2.'
  - 'Reducción: -ab + ab = 0.'
  - 'Resultado: a^2 - b^2.'
- titulo: Un parque rectangular tiene largo $(x + 8)$ metros y ancho $(x - 3)$ metros.
    ¿Qué expresión
  enunciado: 'Un parque rectangular tiene largo $(x + 8)$ metros y ancho $(x - 3)$
    metros. ¿Qué expresión algebraica describe el área total del parque? (v1)


    Opciones: A) $x^2 + 5x - 24$ metros cuadrados. · B) $x^2 - 24$ metros cuadrados.
    · C) $x^2 + 5x + 24$ metros cuadrados. · D) $2x + 5$ metros cuadrados.'
  solucion_pasos:
  - Área = largo × ancho $= (x+8)(x-3) = x^2 - 3x + 8x - 24 = x^2 + 5x - 24$.
  - 'Respuesta: $x^2 + 5x - 24$ metros cuadrados.'
- titulo: 'Respecto de «Aplicación de la regla general para multiplicar dos polinomios»:
    ¿La siguiente'
  enunciado: 'Respecto de «Aplicación de la regla general para multiplicar dos polinomios»:
    ¿La siguiente formulación es correcta? «La **Multiplicación de Polinomios** consiste
    en multiplicar cada término del primer polinomio por cada uno de los términos
    del segundo polinomio»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La **Multiplicación de Polinomios**
    consiste en multiplicar cada término del primer polinomio por cada uno de los
    términos del segundo polinomio.'
- titulo: 'Respecto de «Aplicación de la regla general para multiplicar dos polinomios»:
    ¿La siguiente'
  enunciado: 'Respecto de «Aplicación de la regla general para multiplicar dos polinomios»:
    ¿La siguiente conclusión es correcta? «Multiplicar solo términos en la misma posición
    (ej. creer que $(x+1)(x+2) = x^2 + 2$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La **Multiplicación de Polinomios**
    consiste en multiplicar cada término del primer polinomio por cada uno de los
    términos del segundo polinomio.'
errores_frecuentes:
- Multiplicar solo términos en la misma posición (ej. creer que $(x+1)(x+2) = x^2
  + 2$).
- Olvidar la regla de signos en algunos de los productos cruzados.
- Para «Al multiplicar un binomio de 2 términos por un trinomio de 3 términos, ¿cuántas
  multiplicaciones de monomios individuales se deben realizar antes de reducir semejantes?
  (v1)», la respuesta correcta es $5$ multiplicaciones.
- Para «Al multiplicar un binomio de 2 términos por un trinomio de 3 términos, ¿cuántas
  multiplicaciones de monomios individuales se deben realizar antes de reducir semejantes?
  (v1)», la respuesta correcta es $4$ multiplicaciones.
- Para «Al multiplicar un binomio de 2 términos por un trinomio de 3 términos, ¿cuántas
  multiplicaciones de monomios individuales se deben realizar antes de reducir semejantes?
  (v1)», la respuesta correcta es $2$ multiplicaciones.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
al_terminar_debes_ponder: Resolver productos algebraicos utilizando aplicación de
  la regla general para multiplicar dos polinomios.
