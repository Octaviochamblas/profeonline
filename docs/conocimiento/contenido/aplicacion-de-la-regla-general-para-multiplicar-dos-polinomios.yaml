resumen_inicial: La aplicación de la regla general para multiplicar dos polinomios
  aplica rigurosamente las leyes distributivas, de signos y de potencias en expresiones
  algebraicas.
explicacion_simple: Al trabajar con aplicación de la regla general para multiplicar
  dos polinomios, multiplicamos los coeficientes numéricos, aplicamos la regla de
  signos y sumamos los exponentes de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Aplicación de la regla general
  para multiplicar dos polinomios** viene dada por:


  $$\text{"el producto (x + 3)(x^2 - 2x + 4)"} \implies x^3 + x^2 - 2x + 12$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Aplicación de la regla general para multiplicar dos polinomios**:
  Operación de multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule aplicación de la regla general para multiplicar dos polinomios
    para: ''el producto (x + 3)(x^2 - 2x + 4)''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es x^3 + x^2 - 2x + 12.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar aplicación de la regla general para multiplicar
    dos polinomios a 'el producto (x + 3)(x^2 - 2x + 4)'?
  choices:
  - text: x^3 + x^2 - 2x + 12
    is_correct: true
  - text: x^3 - 2x^2 + 12
    is_correct: false
  - text: x^3 + 5x^2 + 12
    is_correct: false
  - text: x^3 - 6
    is_correct: false
  explanation: La alternativa correcta es 'x^3 + x^2 - 2x + 12'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto (x + 3)(x^2 - 2x + 4)', ¿qué expresión
    resultante se obtuvo?
  choices:
  - text: x^3 + x^2 - 2x + 12
    is_correct: true
  - text: x^3 - 2x^2 + 12
    is_correct: false
  - text: x^3 + 5x^2 + 12
    is_correct: false
  - text: x^3 - 6
    is_correct: false
  explanation: La alternativa correcta es 'x^3 + x^2 - 2x + 12'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante aplicación de la regla general para multiplicar dos polinomios.** **Cómo
  corregirlo:** Al multiplicar potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de aplicación de la regla general para multiplicar
    dos polinomios en 'el producto (x + 3)(x^2 - 2x + 4)'?
  alternativas:
  - x^3 + x^2 - 2x + 12
  - x^3 - 2x^2 + 12
  - x^3 + 5x^2 + 12
  - x^3 - 6
  respuesta: x^3 + x^2 - 2x + 12
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener x^3 + x^2 - 2x + 12.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto (x + 3)(x^2 - 2x + 4)' por aplicación de la
    regla general para multiplicar dos polinomios, ¿qué expresión resulta?
  alternativas:
  - x^3 + x^2 - 2x + 12
  - x^3 - 2x^2 + 12
  - x^3 + 5x^2 + 12
  - x^3 - 6
  respuesta: x^3 + x^2 - 2x + 12
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir x^3 + x^2 - 2x + 12.
- titulo: ¿Es la multiplicación en 'el producto (x + 3)(x^2 - 2x + 4)' equivalente
    a x^3 + x^2 - 2x + 12?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene x^3 + x^2 - 2x + 12.
- titulo: ¿Da el producto de 'el producto (x + 3)(x^2 - 2x + 4)' un resultado igual
    a x^3 - 2x^2 + 12?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es x^3 + x^2 - 2x + 12.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar aplicación de la regla
  general para multiplicar dos polinomios.
- Omitir distribuir el monomio o término sobre todos los sumandos en aplicación de
  la regla general para multiplicar dos polinomios.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La aplicación de la regla general para multiplicar dos polinomios requiere sumar
  los exponentes de las variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la aplicación de la regla
  general para multiplicar dos polinomios aplicando distributividad, ley de signos
  y suma de exponentes.
