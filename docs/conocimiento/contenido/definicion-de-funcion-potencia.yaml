semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.DEFINICION
resumen_inicial: La función potencia es una función real de la forma $f(x) = a \cdot x^n$, donde la variable $x$ actúa como la base de la potencia, el coeficiente $a \in \mathbb{R}^*$ es un número real no nulo y el exponente $n \in \mathbb{Z} \setminus \{0\}$ (o $n \in \mathbb{Q}$) es una constante fija.
explicacion_simple: "![La función potencia es una función real de la forma $f(x) = a \\cdot x^n$, donde la variable $x$ actúa como la base de la potencia, el coeficiente $a \\in \\mathbb{R}^*$ es un número real no nulo y el exponente $n \\in \\mathbb{Z} \\setminus \\{0\\}$ (o $n \\in \\mathbb{Q}$) es una constante fija](/static/img/nodos/definicion-de-funcion-potencia-intro.svg)\n\n\nUna **función potencia** es una fórmula donde la variable $x$ está en la base y está elevada a un exponente fijo $n$:\n\n$$f(x) = \\mathbf{a} \\cdot \\mathbf{x}^n$$\n\n- **¿Quién es quién?**\n  - **$x$ (la base):** Es la variable independiente que va cambiando.\n  - **$a$ (el coeficiente):** Es un número multiplicando por fuera (¡nunca puede ser cero!).\n  - **$n$ (el exponente):** Es un número fijo constante ($2, 3, 4, -1, -2$, etc.).\n- **¡No la confundas con la exponencial!**\n  - En la potencia: $f(x) = x^{\\mathbf{2}}$ (la $x$ está **abajo**, en la base).\n  - En la exponencial: $g(x) = \\mathbf{2}^x$ (la\
  \ $x$ está **arriba**, en el exponente)."
explicacion_formal: "Sea $a \\in \\mathbb{R}^* = \\mathbb{R} \\setminus \\{0\\}$ y $n \\in \\mathbb{Z}^* = \\mathbb{Z} \\setminus \\{0\\}$ (o $n \\in \\mathbb{Q}^*$). Se define la función potencia elemental $f: \\mathcal{D} \\subseteq \\mathbb{R} \\to \\mathbb{R}$ mediante la regla de correspondencia:\n$$f(x) = a \\cdot x^n$$\n\n**Propiedades analíticas fundamentales**:\n1. **Dominio dependiente del exponente**:\n   - Si $n \\in \\mathbb{Z}^+$: $\\operatorname{Dom}(f) = \\mathbb{R}$.\n   - Si $n \\in \\mathbb{Z}^-$: $\\operatorname{Dom}(f) = \\mathbb{R} \\setminus \\{0\\}$ (asíntota vertical en $x = 0$).\n   - Si $n = p/q \\in \\mathbb{Q}^+$ con $q$ par: $\\operatorname{Dom}(f) = [0, +\\infty[$.\n2. **Punto canónico de paso**:\n   - Para todo $n > 0$, $f(0) = 0 \\implies (0, 0) \\in \\operatorname{Gr}(f)$.\n   - Para todo $n$, $f(1) = a \\implies (1, a) \\in \\operatorname{Gr}(f)$."
definiciones_clave: '- **Función potencia**: Monomio de una sola variable de la forma $f(x) = a x^n$.

  - **Coeficiente principal ($a$)**: Factor escalar que escala y orienta verticalmente la función.

  - **Grado o exponente ($n$)**: Constante que define la curvatura, paridad y dominio de la función.'
propiedades_relaciones: '- **Diferenciación con exponencial**: En $f(x) = x^n$ la base varía y el exponente es fijo; en $g(x) = b^x$ la base es fija y el exponente varía.

  - **Punto pivote de escala**: La gráfica siempre contiene el punto $(1, a)$ y, si $n > 0$, el origen $(0, 0)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La función potencia es una función real de la forma $f(x) = a \cdot x^n$, donde la variable $x$ actúa como la base de la potencia, el coeficiente $a \in \mathbb{R}^*$ es un número real no nulo y el exponente $n \in \mathbb{Z} \setminus \{0\}$ (o $n \in \mathbb{Q}$) es una constante fija](/static/img/nodos/definicion-de-funcion-potencia-ejemplos.svg)



    Clasifica las siguientes funciones indicando si son funciones potencia (identificando $a$ y $n$) o funciones exponenciales:

    1) $f(x) = 3x^4$

    2) $g(x) = 4 \cdot 5^x$

    3) $h(x) = \frac{2}{x^3}$'
  pasos:
  - 'Paso 1: Para $f(x) = 3x^4$:

    - La variable $x$ está en la base y el exponente 4 es constante.

    - **Es Función Potencia con $a = 3$ y $n = 4$**.'
  - 'Paso 2: Para $g(x) = 4 \cdot 5^x$:

    - La variable $x$ está en el exponente sobre base fija 5.

    - **Es Función Exponencial (NO es función potencia)**.'
  - 'Paso 3: Para $h(x) = \frac{2}{x^3}$:

    - Reescribir como potencia: $h(x) = 2x^{-3}$.

    - La variable $x$ está en la base con exponente negativo.

    - **Es Función Potencia con $a = 2$ y $n = -3$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes expresiones corresponde a una función potencia?
  choices:
  - text: f(x) = 5x³ (la variable x está en la base)
    is_correct: true
  - text: g(x) = 3 · 5ˣ (la variable está en el exponente)
    is_correct: false
  - text: h(x) = 2ˣ + 4
    is_correct: false
  - text: p(x) = 0 · x⁴
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 5x³ (la variable x está en la base)'. En una función potencia la variable independiente $x$ es la base de la potencia.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la función $f(x) = \frac{x^5}{4}$, ¿cuáles son los valores de a y n?
  choices:
  - text: a = 1/4, n = 5
    is_correct: true
  - text: a = 4, n = 5
    is_correct: false
  - text: a = 1, n = 5/4
    is_correct: false
  - text: a = 5, n = 4
    is_correct: false
  explanation: La alternativa correcta es 'a = 1/4, n = 5'. Se reescribe como $f(x) = \frac{1}{4} x^5$, identificando $a = 1/4$ y $n = 5$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la ubicación de la variable independiente $x$.'
- 'Paso 2: Verificar que $x$ actúe como base elevada a una constante $n$.'
- 'Paso 3: Reescribir la expresión en la forma canónica $f(x) = a \cdot x^n$.'
- 'Paso 4: Extraer el coeficiente $a \neq 0$ y el exponente $n$.'
errores_correccion: '- **Error común:** Confundir la función potencia $x^n$ con la función exponencial $b^x$.

  - **Cómo corregirlo:** Si la **incógnita está ABAJO en la base** ($x^3$), es **POTENCIA**; si la **incógnita está ARRIBA en el exponente** ($3^x$), es **EXPONENCIAL**.'
ejemplos:
- titulo: 'Ejemplo 1: Potencia entera positiva'
  enunciado: En $f(x) = -2x^6$, ¿cuáles son los parámetros?
  alternativas:
  - a = -2, n = 6
  - a = 6, n = -2
  - a = 2, n = 6
  - a = -12, n = 1
  respuesta: a = -2, n = 6
  solucion_pasos:
  - 'Paso 1: Coeficiente $a = -2$ y exponente $n = 6$.'
- titulo: 'Ejemplo 2: Potencia racional fraccionaria'
  enunciado: 'Reescribe $g(x) = 5\sqrt[3]{x^2}$ en la forma $a x^n$:'
  alternativas:
  - 5 x^(2/3)
  - 5 x^(3/2)
  - 2/3 x⁵
  - 5x⁶
  respuesta: 5 x^(2/3)
  solucion_pasos:
  - 'Paso 1: $\sqrt[3]{x^2} = x^{2/3} \implies 5 x^{2/3}$.'
- titulo: 'Ejemplo 3: Potencia en denominador'
  enunciado: 'Reescribe $h(x) = \frac{7}{x^4}$ como función potencia:'
  alternativas:
  - 7 x⁻⁴
  - -7 x⁴
  - 1/7 x⁴
  - 7/4 x
  respuesta: 7 x⁻⁴
  solucion_pasos:
  - 'Paso 1: $\frac{7}{x^4} = 7 x^{-4} \implies a = 7, n = -4$.'
- titulo: 'Ejemplo 4: Distinción funcional'
  enunciado: ¿Qué tipo de función es $p(x) = 10^x$?
  alternativas:
  - Función exponencial
  - Función potencia
  - Función polinómica
  - Función lineal
  respuesta: Función exponencial
  solucion_pasos:
  - 'Paso 1: La variable $x$ está en el exponente $\implies$ exponencial.'
errores_frecuentes:
- Confundir funciones potencia con funciones exponenciales.
- Asignar a = 0 en funciones constantes.
- Olvidar invertir el signo del exponente al subir variables del denominador.
afirmaciones_verdaderas:
- En la función potencia f(x) = a · xⁿ la variable independiente es la base y el exponente es una constante.
- El coeficiente principal a debe ser un número real no nulo (a ≠ 0).
al_terminar_debes_poder: '**QUÉ:** Definir y reconocer formalmente una función potencia f(x) = a · xⁿ.


  **CÓMO:** Identificando la variable en la base, extrayendo el coeficiente a ≠ 0 y distinguiéndola de la función exponencial.


