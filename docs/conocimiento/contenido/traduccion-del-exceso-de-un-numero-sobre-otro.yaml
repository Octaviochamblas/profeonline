semantic_id: MAT.ALG.LENGUAJE_RELACIONES.EXCESO_NUMERO
resumen_inicial: 'Traducción del exceso de un número sobre otro: traducción, reglas
  y aplicación práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: Cuando decimos que un camión 'excede' el límite de peso por 500
  kilos, estamos hablando de lo que le sobra. Y la única forma matemática de calcular
  cuánto le sobra a algo, es mediante la resta.
explicacion_formal: '### Definición formal


  El exceso mide cuánto más grande es A en comparación con B. Eso es, por definición,
  la distancia entre ellos en la recta numérica, lo que se calcula restando $A - B$.


  ### Desarrollo didáctico


  Palabras clave:

  - El exceso de A sobre B: $A - B$

  - A excede a B en C: $A - B = C$

  - Lo que B es excedido por A: $A - B$


  Frecuentemente, el concepto de exceso asusta por su redacción rebuscada. Sin embargo,
  ''el exceso de 10 sobre 7'' es simplemente preguntar ''¿cuánto le sobra al 10 para
  igualar al 7?''. La respuesta es la resta: $10 - 7 = 3$.

  En álgebra, ''El exceso del doble de un número sobre 5 es 11'' se traduce como:
  $2x - 5 = 11$.'
definiciones_clave: '- **Traducción del exceso de un número sobre otro**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción del exceso de un número sobre otro.'
