procedimiento:
- 'Paso 1: Identifica a la entidad mayor (la que excede). Escríbela primero.'
- 'Paso 2: Escribe el signo de resta (-).'
- 'Paso 3: Identifica a la entidad menor (la que es superada). Escríbela después del
  signo menos.'
- 'Paso 4: Si te dan el valor exacto del exceso, iguálalo a la resta (Ej. . = 10).'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  traducción del exceso de un número sobre otro.
ejemplos:
- titulo: Lo que sobra
  enunciado: 'Traduce algebraicamente: ''El exceso de tu salario sobre tus gastos
    es de mil dólares''.'
  solucion_pasos:
  - 'El que excede (el mayor): Salario (S).'
  - 'El superado (el menor): Gastos (G).'
  - 'La resta del exceso: S - G.'
  - 'El valor del exceso es mil: S - G = 1000.'
- titulo: 'Un contrato de alquiler estipula: ''La multa a pagar será equivalente al
    cuadrado del exceso'
  enunciado: 'Un contrato de alquiler estipula: ''La multa a pagar será equivalente
    al cuadrado del exceso de los días de retraso ($d$) sobre los días de gracia permitidos
    ($g$)''. ¿Cuál es la fórmula matemática que define la multa ($M$)? (v1)


    Opciones: A) $M = (d - g)^2$ · B) $M = d^2 - g^2$ · C) $M = d + g^2$ · D) $M =
    (g - d)^2$'
  solucion_pasos:
  - 'Primero determinamos el exceso de retraso sobre gracia: $d - g$. Luego se nos
    pide el cuadrado de esa cantidad entera (del exceso). Entonces encerramos en paréntesis
    y elevamos: $(d - g)^2$.'
  - 'Respuesta: $M = (d - g)^2$'
- titulo: 'Respecto de «Traducción del exceso de un número sobre otro»: ¿Se ajusta
    a la definición esta'
  enunciado: 'Respecto de «Traducción del exceso de un número sobre otro»: ¿Se ajusta
    a la definición esta afirmación? «El **Exceso de un número sobre otro** se traduce
    planteando una **resta** donde la primera cantidad (el que excede) es el minuendo,
    y la segunda (el que es excedido) es el sustraendo: **$x - y$**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Exceso de un número sobre
    otro** se traduce planteando una **resta** donde la primera cantidad (el que excede)
    es el minuendo, y la segunda (el que es excedido) es el sustraendo: **$x - y$**.'
- titulo: 'Respecto de «Traducción del exceso de un número sobre otro»: ¿Es compatible
    con el procedimi'
  enunciado: 'Respecto de «Traducción del exceso de un número sobre otro»: ¿Es compatible
    con el procedimiento esta afirmación? «Confundir el ''exceso'' con un ''aumento'',
    y sumar las variables ($A+B$) en lugar de restarlas»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Exceso de un número sobre
    otro** se traduce planteando una **resta** donde la primera cantidad (el que excede)
    es el minuendo, y la segunda (el que es excedido) es el sustraendo: **$x - y$**.'
errores_frecuentes:
- Confundir el 'exceso' con un 'aumento', y sumar las variables ($A+B$) en lugar de
  restarlas.
- Invertir el orden de la resta (escribir $B - A$ en lugar de $A - B$).
- Una adición, sumando el exceso a la cantidad menor.
- Una división entre $A$ y $B$.
- Un cálculo de porcentaje sobre $A$.
afirmaciones_verdaderas:
- La traducción de traducción del exceso de un número sobre otro preserva el significado
  matemático del enunciado.
al_terminar_debes_ponder: Traducir y evaluar expresiones que involucren traducción
