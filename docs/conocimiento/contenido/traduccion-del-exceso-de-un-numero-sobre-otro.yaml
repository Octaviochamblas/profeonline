semantic_id: MAT.ALG.LENGUAJE_RELACIONES.EXCESO_NUMERO
resumen_inicial: 'La traducción del exceso de un número sobre otro consiste en expresar la diferencia positiva $A - B$ que indica cuánto mayor es la primera cantidad respecto a la segunda.'
explicacion_simple: |
  En matemáticas, el **exceso de un número sobre otro** es simplemente **la resta o diferencia entre el número mayor y el número menor**:
  - Frases equivalentes: *"El exceso de $A$ sobre $B$"*, *"Cuánto excede $A$ a $B$"*, *"$A$ supera a $B$ en..."*.
  - Traducción algebraicamente idéntica: **$A - B$**.
  - Ejemplo 1: "El exceso de $20$ sobre $15$" $\implies 20 - 15 = 5$ (el $20$ excede al $15$ en $5$ unidades).
  - Ejemplo 2: "El exceso de un número $x$ sobre $8$" $\implies **x - 8**$.
  - Ejemplo 3: "El exceso del triple de $x$ sobre el doble de $y$" $\implies **3x - 2y**$.
explicacion_formal: |
  ### Definición formal
  La **relación de exceso aditivo** mapea un par ordenado de expresiones $(A, B) \in \mathbb{R}[x]^2$ con $A \ge B$ en la magnitud de su diferencia no negativa $E(A,B) \in \mathbb{R}[x]$:

  $$\Phi(\text{"El exceso de } A \text{ sobre } B\text{"}) = A - B \quad \text{donde } A = \text{Cantidad excedente}, \quad B = \text{Cantidad de referencia}$$

  ### Igualdad de Exceso
  Si se afirma que "El exceso de $A$ sobre $B$ es igual a $k$", la relación algebraica se traduce en la ecuación:

  $$A - B = k \iff A = B + k$$

  ### Síntesis didáctica
  La traducción del exceso transforma comparaciones de magnitud en restas directas, siendo fundamental para el planteo de ecuaciones de edades, geometría y ganancias netas.
definiciones_clave: |
  - **Exceso de $A$ sobre $B$**: Expresión $A - B$ que mide la cantidad de unidades en que $A$ sobrepasa a $B$.
  - **Cantidad excedente ($A$)**: Magnitud mayor o minuendo de la diferencia.
  - **Cantidad de referencia ($B$)**: Magnitud menor o sustraendo restado.
propiedades_relaciones: |
  - **Simetría respecto al complemento**: "El exceso de $A$ sobre $B$ es $k$" equivale a decir " $B$ es menor que $A$ en $k$ unidades".
  - **No conmutatividad**: El exceso de $A$ sobre $B$ ($A - B$) es la cantidad opuesta al exceso de $B$ sobre $A$ ($B - A$).
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "El exceso del quíntuple de la edad de Juan ($j$) sobre la edad de Pedro ($p$) es igual a doce años".'
  pasos:
    - 'Paso 1: Identificamos la cantidad excedente (minuendo): "El quíntuple de la edad de Juan" $\implies 5j$.'
    - 'Paso 2: Identificamos la cantidad de referencia (sustraendo): "La edad de Pedro" $\implies p$.'
    - 'Paso 3: Formamos la diferencia del exceso: $5j - p$.'
    - 'Paso 4: Igualamos a las $12$ unidades: $5j - p = 12$.'
    - 'Conclusión: La ecuación traducida es **$5j - p = 12$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué operador matemático se utiliza para traducir el enunciado "El exceso de $A$ sobre $B$"?'
    choices:
      - {text: 'El operador de resta o sustracción de la forma $A - B$', is_correct: true}
      - {text: 'El operador de adición de la forma $A + B$', is_correct: false}
      - {text: 'El operador de división de la forma $\frac{A}{B}$', is_correct: false}
      - {text: 'El operador de potencia $A^B$', is_correct: false}
    explanation: 'La alternativa correcta es ''El operador de resta o sustracción de la forma $A - B$''. El exceso es la diferencia $A - B$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cómo se traduce al lenguaje algebraico "El exceso del cuadrado de $x$ sobre el triple de $y$"? '
    choices:
      - {text: 'Se traduce como la diferencia $x^2 - 3y$', is_correct: true}
      - {text: 'Se traduce como la suma $x^2 + 3y$', is_correct: false}
      - {text: 'Se traduce como el cociente $\frac{x^2}{3y}$', is_correct: false}
      - {text: 'Se traduce como la resta $(x - 3y)^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se traduce como la diferencia $x^2 - 3y$''. Excedente $x^2$, referencia $3y$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar en la frase la cantidad que excede (ubicada inmediatamente tras las palabras "el exceso de").'
  - 'Paso 2: Identificar la cantidad sobre la cual se mide el exceso (ubicada tras la palabra "sobre").'
  - 'Paso 3: Escribir la resta de la forma `Cantidad_Excedente - Cantidad_Referencia`.'
  - 'Paso 4: Igualar al valor numérico constante si el enunciado establece una equivalencia.'
errores_correccion: |
  - **Error 1:** Sumar las dos cantidades en lugar de restarlas al traducir la palabra "exceso" (escribir $A + B$ para el exceso de $A$ sobre $B$). **Cómo corregirlo:** La palabra "exceso" **exige una RESTA ($A - B$)**, pues mide una diferencia de tamaño.
  - **Error 2:** Invertir los términos escribiendo $B - A$. **Cómo corregirlo:** La primera cantidad nombrada $A$ **va ANTES del signo menos ($A - B$)**.
ejemplos:
  - titulo: 'Exceso básico'
    enunciado: '¿Cuál es la traducción de "El exceso de $x$ sobre $10$"?'
    alternativas:
      - '$x - 10$'
      - '$10 - x$'
      - '$x + 10$'
    respuesta: '$x - 10$'
    solucion_pasos:
      - '1. Excedente: $x$. Referencia: $10$.'
      - '2. Exceso: $x - 10$.'
  - titulo: 'Exceso entre productos'
    enunciado: '¿Cuál es la traducción de "El exceso del triple de $a$ sobre el doble de $b$"?'
    alternativas:
      - '$3a - 2b$'
      - '$2b - 3a$'
      - '$3a + 2b$'
    respuesta: '$3a - 2b$'
    solucion_pasos:
      - '1. Excedente: $3a$. Referencia: $2b$.'
      - '2. Resultado: $3a - 2b$.'
  - titulo: 'Ecuación de exceso'
    enunciado: 'Si "El exceso de $n$ sobre $4$ es $15$", ¿la ecuación traducida es $n - 4 = 15$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $n - 4 = 15 \implies n = 19$.'
  - titulo: 'Exceso de cuadrados'
    enunciado: 'La frase "El exceso de $x^2$ sobre $y^2$", ¿se traduce como $x^2 - y^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, representa la diferencia de cuadrados $x^2 - y^2$.'
errores_frecuentes:
  - 'Escribir la suma A + B al traducir la frase el exceso de A sobre B.'
  - 'Invertir la posición de las cantidades escribiendo B - A en lugar de A - B.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Reemplazar el exceso por la división fraccionaria de las dos cantidades.'
  - 'Declarar que el exceso entre dos variables es un valor conmutativo.'
afirmaciones_verdaderas:
  - 'La traducción del exceso de una cantidad sobre otra se expresa como la resta del excedente menos la referencia.'
  - 'La expresión A - B = k indica que la cantidad A supera a la cantidad B en k unidades.'
al_terminar_debes_poder: 'Traducir enunciados de exceso entre cantidades al lenguaje algebraico expresando la resta del término excedente menos la referencia.'
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Lenguaje Algebraico.'
