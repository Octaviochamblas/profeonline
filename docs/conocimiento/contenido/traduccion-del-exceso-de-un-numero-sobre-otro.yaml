resumen_inicial: El exceso de un número sobre otro representa la diferencia sustraíble
  obtenida al restar la cantidad menor a la mayor.
explicacion_simple: Cuando decimos 'el exceso de $x$ sobre $y$', nos referimos a cuánto
  más grande es $x$ en comparación con $y$. En lenguaje matemático, esto se traduce
  simplemente como la resta $x - y$. Por ejemplo, el exceso de $10$ sobre $6$ es $10
  - 6 = 4$.
explicacion_formal: 'Dados $a, b \in \mathbb{R}$, el **Exceso de** $a$ **sobre** $b$,
  denotado $E(a,b)$, se define como la diferencia orientada no negativa:


  $$E(a,b) = a - b \quad \text{con } a \ge b$$


  > **Complemento didáctico:** La noción de exceso traduce enunciados verbales de
  comparación cuantitativa a expresiones aditivas ordenadas.'
definiciones_clave: '- **Exceso de $a$ sobre $b$**: Expresión $a - b$ que mide la
  distancia aditiva orientada.'
propiedades_relaciones: '- **Invarianza por traslación**: $E(a+c, b+c) = a - b = E(a,b)$.'
ejemplo_guiado:
  enunciado: 'Traduzca al lenguaje algebraico: ''El exceso del triple de un número
    sobre 5 equivale a 16''.'
  pasos:
  - 'Paso 1: Identificar el número como la variable $x$.'
  - 'Paso 2: Expresar el ''triple de un número'': $3x$.'
  - 'Paso 3: Aplicar el concepto de exceso sobre 5: $3x - 5$.'
  - 'Paso 4: Igualar al resultado 16: $3x - 5 = 16$.'
  - 'Conclusión: La ecuación traducida es $3x - 5 = 16$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se traduce algebraicamente la frase 'el exceso de x sobre y'?
  choices:
  - text: x - y
    is_correct: true
  - text: x + y
    is_correct: false
  - text: x / y
    is_correct: false
  - text: y - x
    is_correct: false
  explanation: La alternativa correcta es 'x - y'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue la traducción de 'el exceso del triple
    de x sobre 5 equivale a 16'?
  choices:
  - text: 3x - 5 = 16
    is_correct: true
  - text: 3x + 5 = 16
    is_correct: false
  - text: 5 - 3x = 16
    is_correct: false
  - text: x^3 - 5 = 16
    is_correct: false
  explanation: La alternativa correcta es '3x - 5 = 16'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la cantidad mayor que excede.'
- 'Paso 2: Identificar la cantidad menor sobre la cual se calcula el exceso.'
- 'Paso 3: Escribir la resta (Cantidad Mayor - Cantidad Menor).'
errores_correccion: '- **Error 1: Traducir ''el exceso de $x$ sobre $y$'' como $y
  - x$.** **Cómo corregirlo:** La cantidad que excede es la primera ($x$), por lo
  que es el minuendo de la resta ($x - y$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Traduzca al lenguaje algebraico: ''El exceso del doble de un número
    sobre 8''.'
  alternativas:
  - 2n - 8
  - 8 - 2n
  - 2n + 8
  - n^2 - 8
  respuesta: 2n - 8
  solucion_pasos:
  - '1. Doble del número: 2n.'
  - '2. Exceso sobre 8: 2n - 8.'
- titulo: Ejemplo 2
  enunciado: Si el exceso de 20 sobre x es igual a 7, ¿cuál es la ecuación correcta?
  alternativas:
  - 20 - x = 7
  - x - 20 = 7
  - 20 + x = 7
  - 20/x = 7
  respuesta: 20 - x = 7
  solucion_pasos:
  - 1. La cantidad mayor es 20 y la menor es x. El exceso es 20 - x = 7.
- titulo: ¿Es la traducción del exceso de a sobre b equivalente a la expresión a -
    b?
  respuesta: Sí
  solucion_pasos:
  - Sí, mide la diferencia positiva a - b.
- titulo: ¿Representa la expresión x + 15 el exceso de x sobre 15?
  respuesta: 'No'
  solucion_pasos:
  - No, la adición x + 15 representa un número aumentado, mientras que el exceso es
    x - 15.
errores_frecuentes:
- Invertir el orden de los términos escribiendo la cantidad menor como minuendo (y
  - x).
- Traducir la palabra exceso mediante una suma en lugar de una resta.
- Declarar que el exceso es una división entre ambas cantidades.
- Declarar la expresión 'exceso de a sobre b' con la suma de ambos números.
- Declarar que el exceso siempre debe ser un número entero negativo.
afirmaciones_verdaderas:
- El exceso de a sobre b se expresa algebraicamente como a - b.
- En la expresión del exceso, la cantidad que excede actúa como el minuendo de la
  resta.
al_terminar_debes_poder: Al terminar serás capaz de traducir cualquier enunciado verbal
  de exceso a su representación sustraíble orientada.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Relaciones.
estado: publicado
