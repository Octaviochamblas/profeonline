semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.CONTRACCION_VERTICAL
resumen_inicial: El análisis de la contracción vertical cuando $0 < |a| < 1$ en $f(x) = ax^n$ describe una compresión vertical de factor $|a|$, reduciendo la tasa de crecimiento y ensanchando la abertura de la gráfica hacia el eje de abscisas.
explicacion_simple: "![El análisis de la contracción vertical cuando $0 < |a| < 1$ en $f(x) = ax^n$ describe una compresión vertical de factor $|a|$, reduciendo la tasa de crecimiento y ensanchando la abertura de la gráfica hacia el eje de abscisas](/static/img/nodos/analisis-de-la-contraccion-vertical-cuando-0-a-1-intro.svg)\n\n\nCuando el número que multiplica a la potencia es una **fracción entre 0 y 1 ($a = \\frac{1}{2}, \\frac{1}{4}, 0{,}2...$)**, la gráfica sufre una **contracción o compresión vertical (se vuelve más ancha y aplanada)**:\n\n- **¿Qué le pasa a las alturas?**\n  - Cada ordenada se reduce a una fracción de su tamaño original, creciendo mucho más lento.\n  - Por ejemplo, en $y = x^2$, para $x = 2$ la altura es $4$. Pero en $y = \\mathbf{\\frac{1}{4}}x^2$, para $x = 2$ la altura es solo **$1$**.\n- **Efecto visual:** Las ramas de la curva **se abren ampliamente y se aplanan pegándose al eje horizontal $X$**."
explicacion_formal: "Sea $f(x) = x^n$ y $g(x) = ax^n$ con $0 < |a| < 1$. La transformación es una homotecia vertical de razón $|a| \\in ]0, 1[$:\n$$\\mathcal{H}_{(O_y, a)}: (x, y) \\mapsto (x, ay)$$\n\n**Comportamiento de la tasa de variación y apertura**:\n1. **Reducción de derivada**: $|g'(x)| = |a| \\cdot |f'(x)| < |f'(x)|$ para todo $x \\neq 0$. El crecimiento es estrictamente más amortiguado.\n2. **Abertura ensanchada**: Para cualquier nivel de altura fija $y_0 > 0$ en funciones pares, la distancia horizontal entre ramas satisface:\n   $$\\Delta x_g = 2\\sqrt[n]{y_0 / a} > 2\\sqrt[n]{y_0} = \\Delta x_f$$\n   Demostrando que la curva $g(x)$ presenta una apertura horizontal estrictamente mayor."
definiciones_clave: '- **Contracción vertical / Compresión**: Reducción escalar de ordenadas por un factor fraccionario $0 < |a| < 1$.

  - **Curva más ancha / abierta**: Incremento de la distancia horizontal entre ramas para un mismo valor de $y$.'
propiedades_relaciones: '- **Puntos fraccionarios**: En $x = 1$, la altura es la fracción $g(1) = a < 1$.

  - **Invarianza del vértice**: En $x = 0$, el origen $(0, 0)$ permanece inalterado.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la contracción vertical cuando $0 < |a| < 1$ en $f(x) = ax^n$ describe una compresión vertical de factor $|a|$, reduciendo la tasa de crecimiento y ensanchando la abertura de la gráfica hacia el eje de abscisas](/static/img/nodos/analisis-de-la-contraccion-vertical-cuando-0-a-1-ejemplos.svg)



    Compara las ordenadas y la abertura entre $f(x) = x^2$ y $g(x) = \frac{1}{3}x^2$:

    1) Evalúa en $x = 3, 6$.

    2) Explica por qué $g(x)$ es más ancha que $f(x)$.'
  pasos:
  - 'Paso 1: Comparación numérica:

    - En $x = 3$: $f(3) = 3^2 = 9$, mientras que $g(3) = \frac{1}{3}(9) = \mathbf{3}$ (un tercio de la altura).

    - En $x = 6$: $f(6) = 6^2 = 36$, mientras que $g(6) = \frac{1}{3}(36) = \mathbf{12}$.'
  - 'Paso 2: Como las alturas crecen a un tercio de la velocidad, la curva necesita extenderse mucho más hacia los lados en el eje $X$ para alcanzar la misma altura, resultando en una **gráfica mucho más ancha y abierta**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes funciones potencia posee la gráfica con mayor abertura (más ancha)?
  choices:
  - text: f(x) = 0,1x²
    is_correct: true
  - text: f(x) = 0,5x²
    is_correct: false
  - text: f(x) = x²
    is_correct: false
  - text: f(x) = 4x²
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 0,1x²'. A menor valor absoluto de $|a|$ en $]0, 1[$, mayor es la compresión vertical y más ancha es la gráfica.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $g(x) = -\frac{1}{5}x^4$, ¿qué transformaciones de escala y signo presenta?
  choices:
  - text: Contracción vertical de factor 1/5 y reflexión respecto al eje X
    is_correct: true
  - text: Dilatación vertical de factor 5
    is_correct: false
  - text: Traslación vertical hacia abajo
    is_correct: false
  - text: Traslación horizontal
    is_correct: false
  explanation: La alternativa correcta es 'Contracción vertical de factor 1/5 y reflexión respecto al eje X'. Como $|a| = 1/5 < 1$, se comprime verticalmente, y el signo menos la refleja.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar el valor absoluto del coeficiente $|a|$.'
- 'Paso 2: Verificar que satisfaga $0 < |a| < 1$.'
- 'Paso 3: Multiplicar las ordenadas de los puntos de referencia por la fracción $|a|$.'
- 'Paso 4: Trazar una curva más aplanada y con mayor abertura de ramas alejándose del eje $Y$.'
errores_correccion: '- **Error común:** Creer que multiplicar por $\frac{1}{2}$ desplaza la gráfica hacia abajo.

  - **Cómo corregirlo:** Multiplicar por $\frac{1}{2}$ **ESCALA** las alturas (contracción vertical), manteniendo el vértice en $(0, 0)$. Para trasladar hacia abajo se debe **restar** una constante.'
ejemplos:
- titulo: 'Ejemplo 1: Factor fraccionario'
  enunciado: 'La función $f(x) = \frac{1}{8}x^3$ sufre una:'
  alternativas:
  - Contracción vertical de factor 1/8
  - Dilatación vertical de factor 8
  - Traslación horizontal
  - Traslación vertical
  respuesta: Contracción vertical de factor 1/8
  solucion_pasos:
  - 'Paso 1: $|a| = 1/8 < 1 \implies$ contracción vertical.'
- titulo: 'Ejemplo 2: Contracción decimal'
  enunciado: 'En $g(x) = 0{,}25x^4$, la gráfica es:'
  alternativas:
  - Más ancha que y = x⁴
  - Más angosta que y = x⁴
  - Idéntica a y = x⁴
  - Una recta
  respuesta: Más ancha que y = x⁴
  solucion_pasos:
  - 'Paso 1: $0{,}25 < 1 \implies$ ramas más abiertas y anchas.'
- titulo: 'Ejemplo 3: Contracción negativa'
  enunciado: 'Para $h(x) = -0{,}4x^2$, el factor de contracción es:'
  alternativas:
  - 0,4
  - -0,4
  - 2,5
  - -2,5
  respuesta: 0,4
  solucion_pasos:
  - 'Paso 1: $|a| = |-0{,}4| = 0{,}4$.'
- titulo: 'Ejemplo 4: Altura en x = 1'
  enunciado: Si $f(x) = \frac{3}{7}x^5$, ¿cuánto vale $f(1)$?
  alternativas:
  - 3/7
  - 7/3
  - '1'
  - 15/7
  respuesta: 3/7
  solucion_pasos:
  - 'Paso 1: $f(1) = \frac{3}{7}(1)^5 = \frac{3}{7}$.'
errores_frecuentes:
- Confundir contracción vertical con traslación hacia abajo.
- Creer que un coeficiente decimal o fraccionario hace la curva más estrecha.
- Olvidar que el origen (0, 0) sigue siendo el vértice.
afirmaciones_verdaderas:
- Si 0 < |a| < 1, la gráfica experimenta una contracción vertical por un factor |a|.
- Las ramas de una función contraída verticalmente son más anchas y aplanadas hacia el eje X.
al_terminar_debes_poder: '**QUÉ:** Analizar y graficar la contracción vertical de funciones potencia con 0 < |a| < 1.


  **CÓMO:** Calculando el factor de compresión |a| y trazando ramas más abiertas y aplanadas hacia el eje X.


