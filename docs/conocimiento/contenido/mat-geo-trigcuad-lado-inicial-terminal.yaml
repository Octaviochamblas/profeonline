semantic_id: MAT.GEO.TRIG_CUADRANTES.LADO_INICIAL_TERMINAL
resumen_inicial: 'Identificación del lado inicial y terminal de un ángulo: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: 'Todo ángulo en posición general queda determinado por dos lados:
  uno fijo (el lado inicial) y uno que rota (el lado terminal), y reconocer cuál es
  cuál es esencial para ubicar correctamente el ángulo.'
explicacion_formal: '![Lado inicial y lado terminal](/static/img/geometria/trigonometria/trigcuad-lado-inicial-terminal.svg)


  ### Definición formal


  En un ángulo $\theta$ en posición general, el lado inicial es el rayo que parte
  del origen sobre el semieje positivo de las x, y el lado terminal es el rayo que
  parte del origen formando el ángulo $\theta$ con el lado inicial.


  ### Desarrollo didáctico


  En la figura, el segmento horizontal hacia la derecha es el lado inicial (siempre
  el mismo, sin importar el ángulo), mientras que el rayo hacia el punto $P$, a 120°
  de rotación, es el lado terminal. El lado terminal es el que cambia de posición
  según la medida del ángulo representado.'
definiciones_clave: '- **Identificación del lado inicial y terminal de un ángulo**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
