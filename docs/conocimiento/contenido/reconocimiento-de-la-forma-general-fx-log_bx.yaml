semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.FORMA_GENERAL
resumen_inicial: 'El reconocimiento de la forma general $f(x) = a \log_b(x - h) + k$ permite identificar el impacto geométrico de cada parámetro: la dilatación o reflexión vertical ($a$), la traslación horizontal y asíntota vertical $x = h$ ($h$), y el desplazamiento vertical ($k$).'
explicacion_simple: "![El reconocimiento de la forma general $f(x) = a \\log_b(x - h) + k$ permite identificar el impacto geométrico de cada parámetro: la dilatación o reflexión vertical ($a$), la traslación horizontal y asíntota vertical $x = h$ ($h$), y el desplazamiento vertical ($k$)](/static/img/nodos/reconocimiento-de-la-forma-general-fx-log_bx-intro.svg)\n\n\nLa **forma general completa** de una función logarítmica traslada y estira la curva en el plano:\n\n$$f(x) = \\mathbf{a} \\cdot \\log_b(x - \\mathbf{h}) + \\mathbf{k}$$\n\n- **¿Qué hace cada letra?**\n  - **$a$ (Escala vertical):** Si $a > 1$ estira verticalmente; si $a < 0$ refleja la curva respecto al eje horizontal.\n  - **$h$ (Traslación horizontal y ASÍNTOTA):** Mueve la curva a la derecha ($h > 0$) o izquierda ($h < 0$). **¡La asíntota vertical se mueve exactamente a la recta $x = h$!**\n  - **$k$ (Traslación vertical):** Sube ($k > 0$) o baja ($k < 0$) la gráfica completa.\n- **Dominio general:** $\\operatorname{Dom}(f)\
  \ = ]h, +\\infty[$."
explicacion_formal: 'Sea $f: ]h, +\infty[ \to \mathbb{R}$ la familia general de funciones logarítmicas de base $b \in \mathbb{R}^+ \setminus \{1\}$ parametrizada por $(a, h, k) \in \mathbb{R}^* \times \mathbb{R} \times \mathbb{R}$:

  $$f(x) = a \log_b(x - h) + k$$


  **Efectos analíticos de los parámetros**:

  1. **Asíntota vertical $\mathcal{A}_V$**: Determinada por la singularidad del argumento $x - h = 0 \implies \mathcal{A}_V: x = h$.

  2. **Dominio trasladado**: $\operatorname{Dom}(f) = \{x \in \mathbb{R} \mid x - h > 0\} = ]h, +\infty[$.

  3. **Corte con el eje $X$**: $a \log_b(x - h) + k = 0 \implies x = h + b^{-k/a}$.

  4. **Punto pivote trasladado**: El punto canónico $(1, 0)$ se traslada a $(1 + h, k)$.'
definiciones_clave: '- **Parámetro $h$**: Desplazamiento horizontal que define la posición de la asíntota vertical $x = h$.

  - **Parámetro $k$**: Desplazamiento vertical de toda la curva sin alterar la asíntota.

  - **Parámetro $a$**: Factor de escala y orientación vertical.'
propiedades_relaciones: '- **Invarianza de la asíntota ante $k$**: Modificar $k$ sube o baja la gráfica, pero la recta vertical $x = h$ no cambia.

  - **Recorrido invariante**: $\operatorname{Rec}(f) = \mathbb{R}$ para cualquier valor real de $a \neq 0$, $h$ y $k$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El reconocimiento de la forma general $f(x) = a \log_b(x - h) + k$ permite identificar el impacto geométrico de cada parámetro: la dilatación o reflexión vertical ($a$), la traslación horizontal y asíntota vertical $x = h$ ($h$), y el desplazamiento vertical ($k$)](/static/img/nodos/reconocimiento-de-la-forma-general-fx-log_bx-ejemplos.svg)



    Analiza la función $f(x) = -2 \log_3(x - 5) + 4$ e identifica:

    1) Los parámetros $a, b, h, k$.

    2) La ecuación de su asíntota vertical.

    3) Su dominio y recorrido.

    4) El punto al que se trasladó el pivote original $(1, 0)$.'
  pasos:
  - 'Paso 1: Identificación de parámetros:

    - $a = -2$ (reflejada verticalmente y dilatada al doble).

    - $b = 3$ (base de la función logarítmica).

    - $h = 5$ (desplazada 5 unidades a la derecha).

    - $k = 4$ (desplazada 4 unidades hacia arriba).'
  - 'Paso 2: Ecuación de la asíntota vertical:

    - Argumento igual a cero: $x - 5 = 0 \implies \mathbf{x = 5}$.'
  - 'Paso 3: Dominio y recorrido:

    - $\operatorname{Dom}(f) = ]5, +\infty[$.

    - $\operatorname{Rec}(f) = \mathbb{R}$.'
  - 'Paso 4: Traslación del punto pivote $(1, 0)$:

    - $(1 + h, k) = (1 + 5, 4) = \mathbf{(6, 4)}$.'
