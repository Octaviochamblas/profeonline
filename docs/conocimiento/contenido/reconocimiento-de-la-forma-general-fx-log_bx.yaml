    is_correct: true
  - text: '[4, +∞['
    is_correct: false
  - text: ']-∞, 4['
    is_correct: false
  - text: ']10, +∞['
    is_correct: false
  explanation: 'La alternativa correcta es '']4, +∞[''. El argumento debe ser estrictamente positivo: $x - 4 > 0 \implies x > 4$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comparar la función dada con el modelo canónico $f(x) = a \log_b(x - h) + k$.'
- 'Paso 2: Extraer $h$ del argumento (cambiando de signo si es necesario) para fijar la asíntota vertical $x = h$.'
- 'Paso 3: Establecer el dominio como $]h, +\infty[$ y el recorrido como $\mathbb{R}$.'
- 'Paso 4: Identificar el estiramiento o reflexión vertical mediante el coeficiente $a$.'
errores_correccion: '- **Error común:** Escribir la asíntota vertical como $y = h$ en lugar de $x = h$.

  - **Cómo corregirlo:** Las rectas verticales tienen **ecuación $x = \text{constante}$**: $\mathcal{A}_V: \mathbf{x = h}$.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de asíntota'
  enunciado: ¿Cuál es la asíntota vertical de $f(x) = \log_3(x - 8) + 2$?
  alternativas:
  - x = 8
  - x = -8
  - y = 2
  - x = 2
  respuesta: x = 8
  solucion_pasos:
  - 'Paso 1: $x - 8 = 0 \implies x = 8$.'
- titulo: 'Ejemplo 2: Dominio tras traslación'
  enunciado: 'El dominio de $g(x) = 2\log(x + 3)$ es:'
  alternativas:
  - ']-3, +inf['
  - ']3, +inf['
  - '[-3, +inf['
  - ']0, +inf['
  respuesta: ']-3, +inf['
  solucion_pasos:
  - 'Paso 1: $x + 3 > 0 \implies x > -3 \implies ]-3, +\infty[$.'
- titulo: 'Ejemplo 3: Reflexión vertical'
  enunciado: En $h(x) = -\log_2(x)$, ¿qué efecto produce el signo menos exterior?
  alternativas:
  - Refleja la gráfica verticalmente respecto al eje X
  - Mueve la gráfica hacia la izquierda
  - Refleja la gráfica respecto al eje Y
  - Cambia el dominio a los negativos
  respuesta: Refleja la gráfica verticalmente respecto al eje X
  solucion_pasos:
  - 'Paso 1: El factor $a = -1$ invierte las alturas de la curva.'
- titulo: 'Ejemplo 4: Punto pivote trasladado'
  enunciado: ¿Por cuál punto pasa la función $f(x) = \log_5(x - 2) + 3$ cuando el argumento vale 1?
  alternativas:
  - (3, 3)
  - (1, 3)
  - (2, 3)
  - (3, 0)
  respuesta: (3, 3)
  solucion_pasos:
  - 'Paso 1: $x - 2 = 1 \implies x = 3$, y $f(3) = \log_5(1) + 3 = 0 + 3 = 3 \implies (3, 3)$.'
errores_frecuentes:
- Confundir la traslación vertical k con una modificación de la asíntota.
- Olvidar cambiar de signo a h al leer el argumento (x - h).
- Asumir que el coeficiente 'a' modifica el dominio de la función.
afirmaciones_verdaderas:
- En la forma general f(x) = a · log_b(x - h) + k, la asíntota vertical es exactamente la recta x = h.
- El dominio de la función trasladada f(x) = log_b(x - h) es ]h, +∞[.
al_terminar_debes_poder: '**QUÉ:** Reconocer e interpretar la forma general f(x) = a · log_b(x - h) + k.


  **CÓMO:** Extrayendo los parámetros a, b, h, k para determinar asíntotas verticales x = h y dominios ]h, +∞[.


