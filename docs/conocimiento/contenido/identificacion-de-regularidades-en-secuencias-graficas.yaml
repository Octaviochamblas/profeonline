resumen_inicial: La regularidad gráfica identifica patrones de variación espacial,
  conteo de figuras o figuras geométricas ordenadas para traducirlas a una sucesión
  numérica de término general $a_n$.
explicacion_simple: En las secuencias gráficas nos dan dibujos que van creciendo (como
  torres de fósforos o bloques). Contamos cuántos elementos tiene cada dibujo para
  formar una lista de números y descubrir su regla.
explicacion_formal: 'Dada una secuencia visual de figuras $\{F_1, F_2, F_3, \dots\}$,
  el **Modelamiento de Regularidad Gráfica** construye la función de conteo $N(n)$:


  $$N: F_n \to a_n \in \mathbb{N} \implies (a_n) = (N(F_1), N(F_2), N(F_3), \dots)$$


  **Traducción de geometría a álgebra:**

  - Convierte incrementos visuales de áreas, bordes o puntos en regularidades numéricas
  aditivas o cuadráticas.'
definiciones_clave: '- **Regularidad gráfica**: Traducción de patrones geométricos
  o de conteo de figuras a sucesiones algebraicas.'
propiedades_relaciones: '- **Función de conteo $N(n)$**: Asigna a la figura de posición
  $n$ la cantidad entera de elementos.'
ejemplo_guiado:
  enunciado: Una secuencia de figuras formadas por fósforos tiene $3$ fósforos en
    la figura 1, $5$ en la figura 2 y $7$ en la figura 3. Halle el término general
    del número de fósforos.
  pasos:
  - 'Paso 1: Escribir la sucesión de conteo: $(3, 5, 7, \dots)$.'
  - 'Paso 2: La regularidad es agregar $2$ fósforos en cada nueva figura ($d=2$).'
  - 'Paso 3: Formular el término general: $a_n = 2n + 1$ (verificable: $a_1 = 3$,
    $a_2 = 5$, $a_3 = 7$).'
  - 'Conclusión: El número de fósforos en la figura $n$ es $a_n = 2n + 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la metodología para resolver un problema de regularidad gráfica
    de figuras?
  choices:
  - text: Contar los elementos de las primeras figuras para formar una sucesión numérica
      y deducir an
    is_correct: true
  - text: Medir con regla el tamaño del papel
    is_correct: false
  - text: Sumar los ángulos de los dibujos
    is_correct: false
  - text: Pintar las figuras de distinto color
    is_correct: false
  explanation: La alternativa correcta es 'Contar los elementos de las primeras figuras
    para formar una sucesión numérica y deducir an'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado de las figuras con fósforos (3, 5, 7, ...), ¿cuál
    fue el término general an?
  choices:
  - text: an = 2n + 1
    is_correct: true
  - text: an = 3n
    is_correct: false
  - text: an = n + 2
    is_correct: false
  - text: an = 2n
    is_correct: false
  explanation: La alternativa correcta es 'an = 2n + 1'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de traducir regularidades gráficas
  y patrones de figuras en sucesiones numéricas algebraicas $a_n = f(n)$.
semantic_id: MAT.NUM.SUCESIONES_BASE.REGULARIDAD_GRAFICA
procedimiento:
- 'Paso 1: Identificar el tipo de definición de la sucesión (término general explícito
  $a_n = f(n)$ o relación de recurrencia $a_n = g(a_{n-1})$).'
- 'Paso 2: Sustituir los índices de posición $n = 1, 2, 3, \dots$ para calcular los
  términos requeridos.'
- 'Paso 3: Verificar la consistencia de la secuencia numérica obtenida.'
errores_correccion: '- **Error 1: Sustituir $n=0$ en el término general pretendiendo
  obtener el primer término.** **Cómo corregirlo:** En el convenio escolar estándar,
  la posición del primer término empieza estrictamente en $n=1$.


  - **Error 2: Intentar calcular un término lejano en una definición recursiva sin
  conocer la condición inicial.** **Cómo corregirlo:** Una fórmula recursiva EXIGE
  conocer al menos el primer término $a_1$ para iterar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.SUCESIONES_BASE.REGULARIDAD_GRAFICA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de conceptos de sucesiones numéricas.
- titulo: Ejemplo 2
  enunciado: Verificación de la notación por subíndices.
  alternativas:
  - Cumple la notación
  - No cumple
  - Indeterminado
  respuesta: Cumple la notación
  solucion_pasos:
  - Demostración formal por $a_n = f(n)$.
- titulo: ¿Comienza la posición n del primer término en n = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, en el dominio estándar $\mathbb{N}^+$.
- titulo: ¿Altera el orden de los elementos la identidad de una sucesión?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la posición determina la asignación de cada término.
errores_frecuentes:
- Evaluar $n = 0$ para encontrar el primer término de una sucesión definida en los
  enteros positivos.
- Declarar el valor numérico del término $a_n$ con la posición ordinal $n$ en la fórmula
  general.
- Intentar una sucesión como si fuera un conjunto desordenado donde el orden de los
  elementos no importa.
- Usar una relación recursiva para calcular la posición 100 sin conocer los 99 términos
  anteriores.
- Declarar que toda secuencia gráfica responde a un crecimiento lineal simple sin
  probar la diferencia.
afirmaciones_verdaderas:
- Una sucesión numérica es una función de dominio entero positivo $\mathbb{N}^+$ a
  valores reales.
- El término general $a_n = f(n)$ permite calcular el valor de cualquier posición
  $n$ en un solo paso de evaluación.
