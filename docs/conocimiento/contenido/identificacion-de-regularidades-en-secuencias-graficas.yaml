semantic_id: MAT.NUM.SUCESIONES_BASE.REGULARIDAD_GRAFICA
resumen_inicial: 'Identificación de regularidades en secuencias gráficas: concepto
  y desarrollo dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: 'No todos los patrones son solo números en una pizarra. A veces,
  los patrones son visuales: pirámides de puntos, baldosas en el piso o fractales.
  Traducir dibujos a números es un superpoder geométrico.'
explicacion_formal: 'En las pruebas suelen presentarse dibujos de cuadrados apilados,
  puntos formando triángulos o palitos de fósforo armando figuras.


  Para resolverlos sin enredarte, sigue el ''método de traducción'':

  1. Mira la **Figura 1**. Cuenta sus elementos (ej. tiene 3 palitos). Escribe un
  $3$.

  2. Mira la **Figura 2**. Cuenta sus elementos (ej. tiene 5 palitos). Escribe un
  $5$.

  3. Mira la **Figura 3**. Cuenta sus elementos (ej. tiene 7 palitos). Escribe un
  $7$.


  Acabas de transformar los dibujos en una sucesión numérica simple: $3, 5, 7\dots$

  Ahora aplicas lo que ya sabes: el patrón numérico es $+2$. La siguiente figura tendrá
  $9$ palitos.'
definiciones_clave: '- **Identificación de regularidades en secuencias gráficas**:
  Concepto fundamental dentro del estudio de Conceptos fundamentales de sucesiones.'
propiedades_relaciones: '- **Propiedades de Identificación de regularidades en secuencias
