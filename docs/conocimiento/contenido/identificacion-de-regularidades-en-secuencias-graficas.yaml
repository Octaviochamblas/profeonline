semantic_id: MAT.NUM.SUCESIONES_BASE.REGULARIDAD_GRAFICA
resumen_inicial: 'La identificación de regularidades gráficas traduce patrones visuales y geométricos de etapas consecutivas $n = 1, 2, 3, \dots$ en expresiones algebraicas de conteo $C_n = f(n)$.'
explicacion_simple: |
  En problemas visuales con figuras geométricas (como figuras hechas con fósforos, puntos o baldosas):
  - La **etapa** o número de figura es la variable de posición: **$n = 1, 2, 3, \dots$**
  - El **conteo** es la cantidad de elementos que tiene esa figura ($C_n$).
  - Por ejemplo, si un cuadrado usa 4 fósforos, dos cuadrados unidos usan 7 fósforos, y tres cuadrados unidos usan 10 fósforos:
    - Etapa 1: 4 fósforos
    - Etapa 2: 7 fósforos ($+3$)
    - Etapa 3: 10 fósforos ($+3$)
  - Como cada nuevo cuadrado añade 3 fósforos, la fórmula es **$C_n = 3n + 1$**.

  ![Regularidades en secuencias gráficas](/static/img/nodos/identificacion-de-regularidades-en-secuencias-graficas-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sea $(F_n)_{n \ge 1}$ una secuencia ordenada de configuraciones geométricas o grafos conexos. El problema de modelamiento consiste en determinar la función de conteo cardinal $C: \mathbb{N} \to \mathbb{N}$ tal que:
  $$n \longmapsto C_n = |V(F_n)| \quad \text{o} \quad C_n = |E(F_n)|$$
  donde $V$ y $E$ representan respectivamente el conjunto de vértices (puntos) o aristas (segmentos/fósforos) de la figura en la etapa $n$.

  ### Metodología de Traducción Gráfico-Algebraica
  1. **Construcción de la tabla de valores discretos**:
     $$\begin{array}{c|ccccc} n & 1 & 2 & 3 & 4 & \dots \\ \hline C_n & C_1 & C_2 & C_3 & C_4 & \dots \end{array}$$
  2. **Identificación de partes fijas y partes variables**:
     $$C_n = \text{Base fija} + (n - 1) \cdot \text{Incremento por etapa}$$
  3. **Control de elementos compartidos**: Descontar aristas o vértices adyacentes comunes para evitar sobreconteo.

  ### Síntesis didáctica
  - Ecuación de conteo: $C_n = d \cdot n + c$.
  - Descomposición: Identificar qué piezas se conservan y cuántas se agregan por paso.
definiciones_clave: |
  - **Secuencia gráfica**: Serie ordenada de figuras o patrones geométricos que evolucionan según una regla espacial.
  - **Función de conteo ($C_n$)**: Expresión algebraica que entrega el número total de elementos en la figura $n$.
  - **Elemento compartido**: Arista o vértice que pertenece simultáneamente a dos subfiguras adyacentes.
propiedades_relaciones: |
  - **Isomorfismo visual-numérico**: Toda secuencia gráfica regular es equivalente a una sucesión numérica de conteo discreto.
  - **Números figurados**: Patrones bidimensionales (triángulos de puntos, cuadrados de puntos) generan sucesiones cuadráticas $C_n = \frac{n(n+1)}{2}$ o $C_n = n^2$.
ejemplo_guiado:
  enunciado: 'Una secuencia de figuras se forma con hexágonos regulares unidos por un lado. La figura 1 tiene 1 hexágono (6 fósforos), la figura 2 tiene 2 hexágonos (11 fósforos) y la figura 3 tiene 3 hexágonos (16 fósforos). Encuentra la fórmula de fósforos $F_n$ y calcula cuántos fósforos se necesitan para la figura 15.'
  imagen: '/static/img/nodos/identificacion-de-regularidades-en-secuencias-graficas-ejemplos.svg'
  pasos:
    - 'Paso 1: Armamos la tabla de conteo: $F_1 = 6, F_2 = 11, F_3 = 16$.'
    - 'Paso 2: Calculamos la diferencia entre etapas: $11 - 6 = 5$ y $16 - 11 = 5$. Cada nuevo hexágono agrega 5 fósforos ($d = 5$).'
    - 'Paso 3: Formulamos $F_n = 5n + c$. Para $n=1 \implies 5(1) + c = 6 \implies c = 1$. Fórmula: **$F_n = 5n + 1$**.'
    - 'Paso 4: Evaluamos para la figura 15 ($n=15$): $F_{15} = 5(15) + 1 = 75 + 1 = **76\text{ fósforos}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En una secuencia gráfica donde la figura 1 tiene 4 fósforos y cada figura siguiente agrega 3 fósforos, ¿cuál es la fórmula general de conteo $F_n$?'
    choices:
      - {text: '$F_n = 3n + 1$', is_correct: true}
      - {text: '$F_n = 4n + 3$', is_correct: false}
      - {text: '$F_n = 3n + 4$', is_correct: false}
      - {text: '$F_n = 4n$', is_correct: false}
    explanation: 'La alternativa correcta es ''$F_n = 3n + 1$''. Con diferencia $d=3$, para $n=1$ se cumple $3(1) + 1 = 4$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si la fórmula de una secuencia de figuras es $P_n = 2n + 5$, ¿cuántos puntos contiene la figura 8?'
    choices:
      - {text: '$21$ puntos, calculando $2(8) + 5 = 16 + 5 = 21$', is_correct: true}
      - {text: '$26$ puntos, multiplicando $8 \cdot 3 + 2$', is_correct: false}
      - {text: '$13$ puntos, sumando $8 + 5$', is_correct: false}
      - {text: '$16$ puntos, olvidando sumar 5', is_correct: false}
    explanation: 'La alternativa correcta es ''$21$ puntos, calculando $2(8) + 5 = 16 + 5 = 21$''. Sustituyendo $n=8$: $2(8) + 5 = 21$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Contar cuidadosamente el número de elementos (puntos, segmentos, baldosas) en las figuras $n=1, 2, 3$.'
  - 'Paso 2: Registrar los valores en una tabla discreta $(n, C_n)$.'
  - 'Paso 3: Calcular la diferencia constante $d$ entre etapas sucesivas para establecer el término lineal $d \cdot n$.'
  - 'Paso 4: Ajustar la constante aditiva $c$ con la figura $n=1$ y validar en las figuras posteriores.'
errores_correccion: |
  - **Error 1:** Multiplicar el número de piezas de una figura aislada por $n$ sin descontar los lados compartidos. **Cómo corregirlo:** Las figuras adyacentes **comparten aristas**: calcula siempre la diferencia real observada entre etapas.
  - **Error 2:** Confundir el número de etapa $n$ con el número de elementos contados. **Cómo corregirlo:** $n$ es el **número de la figura** y $C_n$ es el **total de elementos** que contiene.
ejemplos:
  - titulo: 'Conteo de fósforos en triángulos en hilera'
    enunciado: 'Un triángulo usa 3 fósforos, 2 triángulos unidos usan 5 fósforos y 3 usan 7 fósforos. ¿Cuál es la fórmula $F_n$?'
    alternativas:
      - '$F_n = 2n + 1$'
      - '$F_n = 3n$'
      - '$F_n = 2n + 3$'
    respuesta: '$F_n = 2n + 1$'
    solucion_pasos:
      - '1. $F_1 = 3, F_2 = 5, F_3 = 7 \implies d = 2$.'
      - '2. $F_n = 2n + c \implies 2(1) + c = 3 \implies c = 1$.'
  - titulo: 'Puntos en cuadrícula cuadrada'
    enunciado: 'Si la figura $n$ es una cuadrícula de $n \times n$ puntos, ¿cuántos puntos tiene la figura 6?'
    alternativas:
      - '$36$ puntos'
      - '$12$ puntos'
      - '$24$ puntos'
    respuesta: '$36$ puntos'
    solucion_pasos:
      - '1. Fórmula cuadrática: $C_n = n^2 \implies C_6 = 6^2 = 36$.'
  - titulo: 'Baldosas perimetrales'
    enunciado: '¿La regularidad en patrones geométricos permite predecir el número de piezas de una figura de tamaño 100 sin dibujarla?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. La fórmula algebraica modela exactamente cualquier etapa $n$.'
  - titulo: 'Incremento constante'
    enunciado: '¿Si cada nueva figura de una serie agrega exactamente 4 elementos, la función de conteo es lineal?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Todo incremento aditivo constante genera un modelo de primer grado $C_n = 4n + c$.'
errores_frecuentes:
  - 'El conteo total de fósforos en figuras compuestas se obtiene multiplicando los lados del polígono aislado por el número de figuras sin descontar bordes comunes.'
  - 'El número de etapa $n$ de la figura es idéntico a la cantidad total de piezas que la forman.'
  - 'Las secuencias gráficas no pueden modelarse mediante ecuaciones algebraicas formales.'
  - 'Una figura compuesta por cuadrados unidos siempre agrega cuatro fósforos por cada nuevo cuadrado.'
  - 'Los números triangulares de puntos crecen de forma lineal con diferencia constante.'
afirmaciones_verdaderas:
  - 'Toda secuencia gráfica con incremento aditivo constante entre figuras sucesivas se modela mediante una función lineal $C_n = d \cdot n + c$.'
  - 'Al unir figuras geométricas contiguas, los elementos compartidos reducen el número de piezas necesarias respecto a figuras independientes.'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/identificacion-de-regularidades-en-secuencias-graficas-resumen.svg)

  QUÉ: Modelar algebraicamente secuencias y patrones gráficos determinando su regla general de conteo.
  CÓMO: Tabular la cantidad de elementos por etapa $(n, C_n)$, deducir la razón de cambio considerando partes compartidas y formular la ecuación $C_n = f(n)$.
