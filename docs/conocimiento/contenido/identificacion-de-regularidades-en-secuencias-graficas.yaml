procedimiento:
- 'Paso 1: Asigna un número a cada etapa o ''Figura n''.'
- 'Paso 2: Cuenta metódicamente los elementos (puntos, lados, áreas) de la Figura
  1 y anótalo.'
- 'Paso 3: Repite para las Figuras 2 y 3 para crear tu lista ordenada de números.'
- 'Paso 4: Encuentra la regularidad matemática de esos números.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en identificación de regularidades en secuencias gráficas.
ejemplos:
- titulo: Triángulos de fósforos
  enunciado: La Figura 1 es un triángulo (3 fósforos). La Figura 2 son dos triángulos
    unidos por un lado (5 fósforos). La Figura 3 son tres triángulos unidos en fila
    (7 fósforos). ¿Cuántos fósforos tendrá la Figura 4?
  solucion_pasos:
  - 'Traducimos a números: a1=3, a2=5, a3=7.'
  - La regularidad es +2 por cada nuevo triángulo adherido.
  - La figura 4 tendrá 7 + 2 = 9 fósforos.
errores_frecuentes:
- Intentar dibujar la figura número 10 o 20 a mano en lugar de usar la lógica matemática
  de la secuencia.
- Contar mal los elementos que se 'comparten' entre figuras geométricas adyacentes.
afirmaciones_verdaderas:
- La formulación de identificación de regularidades en secuencias gráficas mantiene
  la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando identificación de
  regularidades en secuencias gráficas.
