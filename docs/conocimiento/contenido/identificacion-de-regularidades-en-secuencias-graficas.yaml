procedimiento:
- 'Paso 1: Asigna un número a cada etapa o ''Figura n''.'
- 'Paso 2: Cuenta metódicamente los elementos (puntos, lados, áreas) de la Figura 1 y anótalo.'
- 'Paso 3: Repite para las Figuras 2 y 3 para crear tu lista ordenada de números.'
- 'Paso 4: Encuentra la regularidad matemática de esos números.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en identificación de regularidades en secuencias gráficas.
ejemplos:
- titulo: Triángulos de fósforos
  enunciado: La Figura 1 es un triángulo (3 fósforos). La Figura 2 son dos triángulos unidos
    por un lado (5 fósforos). La Figura 3 son tres triángulos unidos en fila (7 fósforos).
    ¿Cuántos fósforos tendrá la Figura 4?
  solucion_pasos:
  - 'Traducimos a números: a1=3, a2=5, a3=7.'
  - La regularidad es +2 por cada nuevo triángulo adherido.
  - La figura 4 tendrá 7 + 2 = 9 fósforos.
- titulo: Ejemplo 1
  enunciado: La Figura 1 tiene 2 puntos, la Figura 2 tiene 5 puntos y la Figura 3 tiene 8
    puntos. ¿Cuál es la regularidad?
  alternativas:
  - Sumar 3
  - Sumar 2
  - Multiplicar por 2
  respuesta: Sumar 3
  solucion_pasos:
  - 5 menos 2 es 3, y 8 menos 5 también es 3.
- titulo: Ejemplo 2
  enunciado: Con esa misma regularidad, ¿cuántos puntos tendrá la Figura 4?
  alternativas:
  - '11'
  - '10'
  - '13'
  respuesta: '11'
  solucion_pasos:
  - La Figura 3 tiene 8 puntos, y la regularidad es sumar 3, así que 8 más 3 es igual a 11.
- titulo: ¿Se puede resolver una secuencia gráfica sin dibujar todas las figuras?
  respuesta: Sí
  solucion_pasos:
  - Basta con traducir las primeras figuras a números y aplicar la regularidad o el término
    general encontrado.
- titulo: ¿Las figuras de una secuencia gráfica siempre aumentan de tamaño?
  respuesta: 'No'
  solucion_pasos:
  - Algunas secuencias gráficas decrecen o incluso mantienen el mismo número de elementos
    en cada figura.
errores_frecuentes:
- Intentar dibujar la figura número 10 o 20 a mano en lugar de usar la lógica matemática de
  la secuencia.
- Contar mal los elementos que se 'comparten' entre figuras geométricas adyacentes.
- Contar mal los elementos que se comparten o repiten entre una figura y la siguiente.
- Intentar dibujar figuras muy avanzadas en vez de traducir el patrón a números.
- Asumir que el patrón gráfico siempre crece por sumas, sin verificar si en realidad es multiplicativo.
afirmaciones_verdaderas:
- La formulación de identificación de regularidades en secuencias gráficas mantiene la regularidad
  de la sucesión.
- Toda secuencia gráfica se puede traducir a una sucesión numérica contando los elementos
  de cada figura.
al_terminar_debes_poder: Resolver problemas prácticos utilizando identificación de regularidades
  en secuencias gráficas.
