semantic_id: MAT.GEO.TRANSVERSAL_BARICENTRO.BARICENTRO_CENTRO_GRAVEDAD
resumen_inicial: 'Interpretación del baricentro como centro de gravedad del triángulo:
  conceptos, teoremas, propiedades geométricas y cálculo en Elementos Secundarios
  del Triángulo.'
explicacion_simple: 'Más allá de la geometría pura, el baricentro tiene una interpretación
  física: es el punto donde se podría sostener (equilibrar) una lámina triangular
  hecha de un material uniforme.'
explicacion_formal: '![Baricentro como centro de gravedad](/static/img/geometria/elementos-secundarios/transversal-baricentro-baricentro-centro-gravedad.svg)


  ### Definición formal


  Si se recorta una lámina triangular de densidad uniforme, su centro de masa coincide
  exactamente con el baricentro G, calculado como el promedio de las coordenadas de
  sus tres vértices.


  ### Desarrollo didáctico


  Si se intenta sostener un triángulo de cartón sobre la punta de un lápiz, el único
  punto donde queda perfectamente equilibrado (sin caerse hacia ningún lado) es su
  baricentro.'
definiciones_clave: '- **Interpretación del baricentro como centro de gravedad del
  triángulo**: Elemento o propiedad fundamental en el estudio de elementos secundarios
  del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a interpretación del baricentro como centro
  de gravedad del triángulo.'
