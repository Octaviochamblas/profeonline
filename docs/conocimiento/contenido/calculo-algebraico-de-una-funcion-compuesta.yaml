semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.CALCULO_ALGEBRAICO
resumen_inicial: 'Cálculo algebraico de una función compuesta: conceptos, representación
  y propiedades en Composición de funciones.'
explicacion_simple: En vez de evaluar número por número, esta vez el objetivo es obtener
  una fórmula completa que sirva para cualquier valor de $x$ de una sola vez.
explicacion_formal: '### Definición formal


  Dadas $f(x)$ y $g(x)$ como expresiones algebraicas, $(f\circ g)(x) = f(g(x))$ se
  obtiene reemplazando formalmente cada ocurrencia de la variable en la fórmula de
  $f$ por la expresión completa de $g(x)$, y aplicando las reglas algebraicas de simplificación
  sobre el resultado.


  ### Desarrollo didáctico


  Es fundamental usar paréntesis al sustituir, para no perder términos ni cometer
  errores de signo, especialmente cuando $g(x)$ tiene más de un término.


  Si $f(x)=x^2+3x$ y $g(x)=x-1$: $(f\circ g)(x)=f(x-1)=(x-1)^2+3(x-1)=x^2-2x+1+3x-3=x^2+x-2$.'
definiciones_clave: '- **Cálculo algebraico de una función compuesta**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a cálculo algebraico de una función compuesta.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a cálculo algebraico
    de una función compuesta.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a cálculo algebraico de una función
    compuesta.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
