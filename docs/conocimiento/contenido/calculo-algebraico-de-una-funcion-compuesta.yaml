semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.CALCULO_ALGEBRAICO
resumen_inicial: El cálculo algebraico de una función compuesta $(f \circ g)(x)$ consiste en sustituir la expresión completa de $g(x)$ en cada aparición de la variable $x$ de la función $f(x)$ y simplificar.
explicacion_simple: '![El cálculo algebraico de una función compuesta $(f \circ g)(x)$ consiste en sustituir la expresión completa de $g(x)$ en cada aparición de la variable $x$ de la función $f(x)$ y simplificar](/static/img/nodos/calculo-algebraico-de-una-funcion-compuesta-intro.svg)



  Para encontrar la **fórmula algebraica** de $(f \circ g)(x)$:

  1. Tomas la fórmula de la función de afuera $f(x)$.

  2. Borras cada letra $x$ que veas en $f$ y abres un paréntesis gigante: $( \dots )$.

  3. Metes la fórmula entera de $g(x)$ dentro de esos paréntesis.

  4. Haces el álgebra (multiplicas, quitas paréntesis y juntas términos semejantes).


  Por ejemplo, si $f(x) = 3x + 2$ y $g(x) = 4x - 1$:

  $f(g(x)) = 3(4x - 1) + 2 = 12x - 3 + 2 = 12x - 1$.'
explicacion_formal: "Dadas las reglas algebraicas $f(x)$ y $g(x)$, la regla analítica de la función compuesta $(f \\circ g)(x)$ se obtiene mediante la **operación formal de sustitución simbólica**:\n$$(f \\circ g)(x) = f(g(x)) = f(x)\\Big|_{x = g(x)}$$\n\n**Composición de polinomios:**\n- Si $f(x) = ax + b$ y $g(x) = cx + d$ (funciones afines):\n  $$(f \\circ g)(x) = a(cx + d) + b = (ac)x + (ad + b)$$\n  La composición de dos funciones afines es **siempre otra función afín** con pendiente $m_{\\text{comp}} = a \\cdot c$ y coeficiente de posición $n_{\\text{comp}} = ad + b$."
definiciones_clave: '- **Sustitución simbólica**: Reemplazo de la variable independiente por una expresión algebraica completa.

  - **Grado del polinomio compuesto**: $\text{gr}(f \circ g) = \text{gr}(f) \cdot \text{gr}(g)$.'
propiedades_relaciones: '- **Composición de lineales**: La composición de funciones lineales puras es lineal ($a(cx) = (ac)x$).

  - **Preservación polinómica**: La composición de polinomios es siempre un polinomio.'
ejemplo_guiado:
  enunciado: '![Ejemplo El cálculo algebraico de una función compuesta $(f \circ g)(x)$ consiste en sustituir la expresión completa de $g(x)$ en cada aparición de la variable $x$ de la función $f(x)$ y simplificar](/static/img/nodos/calculo-algebraico-de-una-funcion-compuesta-ejemplos.svg)



    Dadas las funciones $f(x) = x^2 - 4x + 1$ y $g(x) = 2x + 3$, calcula la fórmula simplificada de $(f \circ g)(x)$.'
  pasos:
  - 'Paso 1: Plantear la sustitución: $(f \circ g)(x) = f(g(x)) = (g(x))^2 - 4(g(x)) + 1$.'
  - 'Paso 2: Insertar la expresión de $g(x)$: $(2x + 3)^2 - 4(2x + 3) + 1$.'
  - 'Paso 3: Desarrollar el cuadrado de binomio: $(2x + 3)^2 = 4x^2 + 12x + 9$.'
  - 'Paso 4: Distribuir el producto: $-4(2x + 3) = -8x - 12$.'
  - 'Paso 5: Agrupar todos los términos: $4x^2 + 12x + 9 - 8x - 12 + 1$.'
  - 'Paso 6: Reducir términos semejantes: $4x^2 + 4x - 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $f(x) = 2x + 5$ y $g(x) = 3x - 4$, ¿cuál es la fórmula de $(f \circ g)(x)$?
  choices:
  - text: 6x - 3
    is_correct: true
  - text: 6x + 1
    is_correct: false
  - text: 6x - 8
    is_correct: false
  - text: 5x + 1
    is_correct: false
  explanation: La alternativa correcta es '6x - 3'. $f(g(x)) = 2(3x - 4) + 5 = 6x - 8 + 5 = 6x - 3$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Con las mismas funciones $f(x) = 2x + 5$ y $g(x) = 3x - 4$, ¿cuál es $(g \circ f)(x)$?
  choices:
  - text: 6x + 11
    is_correct: true
  - text: 6x - 3
    is_correct: false
  - text: 6x + 15
    is_correct: false
  - text: 5x + 9
    is_correct: false
  explanation: La alternativa correcta es '6x + 11'. $g(f(x)) = 3(2x + 5) - 4 = 6x + 15 - 4 = 6x + 11$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la estructura de la función externa $f$ usando paréntesis en lugar de la variable $x$.'
- 'Paso 2: Insertar la expresión completa de la función interna $g(x)$ dentro de cada paréntesis.'
- 'Paso 3: Desarrollar las potencias, productos y propiedades distributivas.'
- 'Paso 4: Reducir términos semejantes y ordenar el polinomio resultante.'
errores_correccion: '- **Error común:** Olvidar colocar paréntesis al sustituir $g(x)$, por ejemplo escribir $2 \cdot 3x - 4 + 5$ en vez de $2(3x - 4) + 5$.

  - **Cómo corregirlo:** Usa **siempre paréntesis obligatorios** para encerrar la expresión de la función interna al sustituirla.'
ejemplos:
- titulo: 'Ejemplo 1: Composición de funciones afines'
  enunciado: Si $f(x) = -3x + 2$ y $g(x) = 5x - 4$, calcula $(f \circ g)(x)$.
  alternativas:
  - -15x + 14
  - -15x - 10
  - -15x + 6
  - 15x - 14
  respuesta: -15x + 14
  solucion_pasos:
  - 'Paso 1: $f(g(x)) = -3(5x - 4) + 2 = -15x + 12 + 2 = -15x + 14$.'
- titulo: 'Ejemplo 2: Cuadrática con lineal'
  enunciado: Si $f(x) = x^2$ y $g(x) = x - 3$, halla $(f \circ g)(x)$.
  alternativas:
  - x^2 - 6x + 9
  - x^2 - 9
  - x^2 - 3
  - x^2 + 9
  respuesta: x^2 - 6x + 9
  solucion_pasos:
  - 'Paso 1: $f(g(x)) = (x - 3)^2 = x^2 - 6x + 9$.'
- titulo: 'Ejemplo 3: Lineal con cuadrática'
  enunciado: Con $f(x) = x^2$ y $g(x) = x - 3$, halla $(g \circ f)(x)$.
  alternativas:
  - x^2 - 3
  - x^2 - 6x + 9
  - (x - 3)^2
  - x^2 + 3
  respuesta: x^2 - 3
  solucion_pasos:
  - 'Paso 1: $g(f(x)) = g(x^2) = x^2 - 3$.'
- titulo: 'Ejemplo 4: Composición con constante'
  enunciado: Si $f(x) = 7$ (función constante) y $g(x) = 4x^3 - 5$, ¿cuánto es $(f \circ g)(x)$?
  alternativas:
  - '7'
  - 28x^3 - 35
  - 4x^3 + 2
  - '0'
  respuesta: '7'
  solucion_pasos:
  - 'Paso 1: Para cualquier entrada, la función constante devuelve $7$, luego $f(g(x)) = 7$.'
errores_frecuentes:
- No aplicar la propiedad distributiva a todo el binomio interno.
- Desarrollar incorrectamente cuadrados de binomio.
- Sustituir f en g cuando se pide f o g.
afirmaciones_verdaderas:
- El cálculo algebraico de (f o g)(x) se realiza reemplazando x por g(x) en la fórmula de f.
- La composición de dos funciones afines es siempre otra función afín.
al_terminar_debes_poder: '**QUÉ:** Calcular y simplificar la expresión algebraica de funciones compuestas.


  **CÓMO:** Sustituyendo simbólicamente la función interna en la externa y reduciendo los términos algebraicos resultantes.


