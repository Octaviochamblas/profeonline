semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.CALCULO_ALGEBRAICO
resumen_inicial: El cálculo algebraico de una función compuesta obtiene la fórmula explícita de $(f \circ g)(x)$ sustituyendo la expresión de $g(x)$ en $f$.
explicacion_simple: |
  Para hallar la fórmula de la **composición $(f \circ g)(x)$**:

  1. Tomas la fórmula de la función de afuera **$f(u)$**.
  2. En cada lugar donde aparece la variable $u$ (o $x$) en $f$, borras la variable y **colocas entre paréntesis la expresión entera de $g(x)$**.
  3. Desarrollas el álgebra (multiplicaciones, potencias, reducción de términos semejantes) para obtener la fórmula simplificada.
explicacion_formal: |
  Sean las funciones $f(x)$ y $g(x)$. El **algoritmo algebraico de composición** para construir la función regla $(f \circ g)(x)$ se define por la operación de sustitución simbólica de expresiones:

  $$(f \circ g)(x) = f\big(g(x)\big)$$

  **Pasos algebraicos:**
  1. Identificar la regla de asignación de la función principal externa $f(\cdot)$.
  2. Reemplazar formalmente el argumento variable por el bloque algebraico $g(x)$.
  3. Expandir las operaciones algebraicas respetando la prioridad de los operadores en $\mathbb{R}$.
definiciones_clave: |
  - **Sustitución de expresiones**: Procedimiento algebraico mediante el cual se reemplaza una variable formal por una fórmula funcional completa.
propiedades_relaciones: |
  - **No conmutatividad general**: Por lo general, $(f \circ g)(x) \neq (g \circ f)(x)$, lo que demuestra que el orden algebraico de sustitución altera el resultado final.
ejemplo_guiado:
  enunciado: 'Dadas $f(x) = 2x^2 - 3$ y $g(x) = x + 4$, encuentra las expresiones algebraicas de $(f \circ g)(x)$ y $(g \circ f)(x)$.'
  pasos:
    - 'Paso 1: Para $(f \circ g)(x) = f(g(x))$, sustituir $g(x)$ en $f$: $f(x + 4) = 2(x + 4)^2 - 3$.'
    - 'Paso 2: Desarrollar el cuadrado del binomio: $2(x^2 + 8x + 16) - 3 = 2x^2 + 16x + 32 - 3 = 2x^2 + 16x + 29$.'
    - 'Paso 3: Para $(g \circ f)(x) = g(f(x))$, sustituir $f(x)$ en $g$: $g(2x^2 - 3) = (2x^2 - 3) + 4 = 2x^2 + 1$.'
    - 'Paso 4: Concluir que $(f \circ g)(x) = 2x^2 + 16x + 29$ y $(g \circ f)(x) = 2x^2 + 1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si $f(x) = 2x^2 - 3$ y $g(x) = x + 4$, ¿cuál es la expresión reducida de $(f \circ g)(x)$?'
    choices:
      - {text: '$(f \\circ g)(x) = 2x^2 + 16x + 29$', is_correct: true}
      - {text: '$(f \\circ g)(x) = 2x^2 + 1$', is_correct: false}
      - {text: '$(f \\circ g)(x) = 2x^2 + 5$', is_correct: false}
      - {text: '$(f \\circ g)(x) = 2x + 5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(f \\circ g)(x) = 2x^2 + 16x + 29$''. $f(x+4) = 2(x+4)^2 - 3 = 2(x^2+8x+16) - 3 = 2x^2+16x+29$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Para la misma pareja de funciones, ¿cuál es el resultado de $(g \circ f)(x)$?'
    choices:
      - {text: '$(g \\circ f)(x) = 2x^2 + 1$', is_correct: true}
      - {text: '$(g \\circ f)(x) = 2x^2 + 16x + 29$', is_correct: false}
      - {text: '$(g \\circ f)(x) = 2x^2 + 8x + 16$', is_correct: false}
      - {text: '$(g \\circ f)(x) = 2x + 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(g \\circ f)(x) = 2x^2 + 1$''. $g(f(x)) = (2x^2 - 3) + 4 = 2x^2 + 1$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir la expresión genérica $(f \circ g)(x) = f(g(x))$.'
  - 'Paso 2: Escribir la fórmula de $f(x)$ reemplazando cada $x$ por un paréntesis vacío $( \ )$.'
  - 'Paso 3: Insertar la fórmula de $g(x)$ dentro de cada paréntesis.'
  - 'Paso 4: Realizar la simplificación algebraica resolviendo productos, potencias y agrupando términos semejantes.'
errores_correccion: |
  - **Error común:** Multiplicar las fórmulas $f(x) \cdot g(x)$ en lugar de realizar la sustitución de funciones $f(g(x))$.
  - **Cómo corregirlo:** La composición implica **SUSTITUIR LA FÓRMULA INTERNA DENTRO DE LA EXTERNA**, no multiplicar las expresiones.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de composición de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de composición de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El cálculo de $(f \circ g)(x)$ se realiza multiplicando algebraicamente las fórmulas $f(x) \cdot g(x)$.'
  - 'Al sustituir $g(x) = x + 4$ en $f(x) = 2x^2 - 3$, se obtiene la expresión sin paréntesis $2x + 4^2 - 3$.'
  - 'Las expresiones de $(f \circ g)(x)$ y $(g \circ f)(x)$ son siempre algebraicamente idénticas para cualquier par de funciones.'
  - 'Calcular $(f \circ g)(x)$ requiere sumar las pendientes de ambas funciones y restar los interceptos.'
  - 'Sustituir una función en otra altera el grado del polinomio sumando los grados en vez de multiplicarlos.'
afirmaciones_verdaderas:
  - 'El cálculo algebraico de $(f \circ g)(x)$ consiste en reemplazar formalmente la variable independiente de la función externa $f$ por la regla algebraica completa de la función interna $g(x)$.'
  - 'En general, las funciones compuestas $(f \circ g)(x)$ y $(g \circ f)(x)$ producen expresiones algebraicas distintas debido a la no conmutatividad de la composición.'
al_terminar_debes_poder: |
  QUÉ: Calcular e identificar la expresión algebraica simplificada de una función compuesta $(f \circ g)(x)$.
  CÓMO: Sustituir $g(x)$ dentro de $f(x)$, desarrollar los productos o potencias requeridas y simplificar términos semejantes.
