semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.CALCULO_ALGEBRAICO
resumen_inicial: El cálculo algebraico de $(f \circ g)(x)$ consiste en reemplazar
  la variable $x$ en la fórmula de $f(x)$ por la expresión completa de $g(x)$.
explicacion_simple: 'Para hallar la fórmula general de la función compuesta $(f \circ
  g)(x)$:

  1. Escribimos la estructura de la función externa $f(x)$ dejando paréntesis vacíos
  en cada $x$.

  2. Copiamos toda la fórmula de la función interna $g(x)$ dentro de esos paréntesis
  vacíos.

  3. Desarrollamos las operaciones algebraicas (distributiva, productos notables)
  y reducimos términos semejantes.'
explicacion_formal: 'Dadas las expresiones explícitas $f(x)$ y $g(x)$, la **fórmula
  compuesta $(f \circ g)(x)$** se obtiene por la sustitución de expresiones:


  $$(f \circ g)(x) = f(g(x)) = \left. f(u) \right|_{u = g(x)}$$


  **Desglose de la fórmula:**

  - Sustitución algebraica formal del bloque de variables de $g(x)$ en el dominio
  de definición de la regla $f$.'
definiciones_clave: '- **Fórmula de composición**: Expresión algebraica simplificada
  resultante de la composición de dos funciones.'
propiedades_relaciones: '- **Preservación del tipo**: La composición de dos funciones
  afines resulta siempre en otra función afín.'
ejemplo_guiado:
  enunciado: Dadas las funciones $f(x) = 2x - 5$ y $g(x) = 4x + 3$, halla la fórmula
    reducida para $(f \circ g)(x)$.
  pasos:
  - 'Paso 1: Escribir la estructura de $f(x)$ con paréntesis vacíos: $f(\cdot) = 2(\cdot)
    - 5$.Paso 2: Introducir $g(x) = 4x + 3$ dentro del paréntesis: $(f \circ g)(x)
    = 2(4x + 3) - 5$.Paso 3: Aplicar la propiedad distributiva: $2 \cdot 4x + 2 \cdot
    3 - 5 = 8x + 6 - 5$.Paso 4: Reducir términos semejantes: $8x + 1$.Paso 5: Concluir
    que la fórmula reducida es $(f \circ g)(x) = 8x + 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al simplificar la composición $(f \circ g)(x)$ para $f(x) = 2x - 5$ y
    $g(x) = 4x + 3$, ¿cuál es la fórmula resultante?
  choices:
  - text: $(f \circ g)(x) = 8x + 1$
    is_correct: true
  - text: $(f \circ g)(x) = 8x + 6$
    is_correct: false
  - text: $(f \circ g)(x) = 8x - 2$
    is_correct: false
  - text: $(f \circ g)(x) = 6x - 2$
    is_correct: false
  explanation: La alternativa correcta es '$(f \circ g)(x) = 8x + 1$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué técnica algebraica evita cometer errores al sustituir $g(x)$ dentro
    de $f(x)$?
  choices:
  - text: Utilizar paréntesis alrededor de toda la expresión de $g(x)$ antes de expandir.
    is_correct: true
  - text: Eliminar todas las constantes.
    is_correct: false
  - text: Sumar los exponentes de las x.
    is_correct: false
  - text: Dividir todo entre dos.
    is_correct: false
  explanation: La alternativa correcta es 'Utilizar paréntesis alrededor de toda la
    expresión de $g(x)$ antes de expandir.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la función de la izquierda $f$ usando paréntesis grandes $(\dots)$
  en lugar de $x$.'
- 'Paso 2: Reemplazar el contenido de esos paréntesis con la fórmula de $g(x)$.'
- 'Paso 3: Expandir multiplicaciones y potencias.'
- 'Paso 4: Reducir y ordenar los términos algebraicos finales.'
errores_correccion: '- **Error común:** Olvidar distribuir el coeficiente multiplicativo
  a todos los términos de $g(x)$ (escribir $2(4x+3)-5 = 8x + 3 - 5$).

  - **Cómo corregirlo:** La propiedad distributiva exige multiplicar el coeficiente
  externo por CADA término dentro del paréntesis: $2(4x+3) = 8x + 6$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de composición de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de composición de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La composición de funciones (f o g)(x) equivale a f(g(x))?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición notacional de composición de funciones.
- titulo: ¿La composición de funciones es conmutativa en general?
  respuesta: 'No'
  solucion_pasos:
  - No, en general (f o g)(x) != (g o f)(x).
errores_frecuentes:
- Confundir la composición de funciones $(f \circ g)(x)$ con la multiplicación de
  funciones $(f \cdot g)(x)$.
- Evaluar primero la función externa de la izquierda en lugar de la función interna
  de la derecha.
- Asumir falsamente que la composición de funciones es conmutativa ($(f \circ g)(x)
  = (g \circ f)(x)$).
- Olvidar distribuir coeficientes al sustituir expresiones compuestas en el cálculo
  algebraico.
- Determinar el dominio únicamente desde la fórmula reducida final ignorando las restricciones
  del proceso intermedio.
afirmaciones_verdaderas:
- La composición de funciones $(f \circ g)(x) = f(g(x))$ consiste en evaluar la función
  externa $f$ en el resultado de la función interna $g(x)$.
- El dominio de la composición $\operatorname{Dom}(f \circ g)$ hereda todas las restricciones
  de la función interna $g(x)$ y exige que $g(x) \in \operatorname{Dom}(f)$.
al_terminar_debes_poder: Al finalizar este recurso podrás comprender, evaluar numéricamente
  y calcular algebraicamente composiciones de funciones, reconociendo la no conmutatividad
  y analizando sus dominios resultantes.
