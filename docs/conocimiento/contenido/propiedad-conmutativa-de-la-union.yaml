semantic_id: MAT.FUND.PROPIEDADES_CONJUNTOS.CONMUTATIVA_UNION
resumen_inicial: 'Demostración lógica, propiedades y aplicación de la propiedad conmutativa de la unión de conjuntos: $A \cup B = B \cup A$.'
explicacion_simple: |
  La **propiedad conmutativa de la unión** establece que el orden en que unimos dos conjuntos no altera el resultado final: **$A \cup B = B \cup A$**. Ya sea que pongas primero los elementos de $A$ o primero los de $B$, la bolsa final que los reúne a todos es **exactamente la misma**. Por ejemplo, si $A = \{1, 2\}$ y $B = \{3, 4\}$, entonces $\{1, 2\} \cup \{3, 4\} = \{1, 2, 3, 4\}$, que es idéntico a $\{3, 4\} \cup \{1, 2\} = \{3, 4, 1, 2\}$.
explicacion_formal: |
  ### Definición formal
  En la teoría de conjuntos y el álgebra de Boole, la operación binaria de unión $\cup: \mathcal{P}(\mathcal{U}) \times \mathcal{P}(\mathcal{U}) \to \mathcal{P}(\mathcal{U})$ es **conmutativa**:
  $$\forall A, B \subseteq \mathcal{U}, \quad A \cup B = B \cup A$$
  Demostración formal basada en la conmutatividad de la disyunción lógica ($\lor$):
  $$x \in (A \cup B) \iff (x \in A \lor x \in B) \iff (x \in B \lor x \in A) \iff x \in (B \cup A)$$
  Por el axioma de extensionalidad, se concluye formalmente que $A \cup B = B \cup A$.

  ### Desglose simbólico
  - Ley lógica subyacente: $P \lor Q \equiv Q \lor P$.
  - Invarianza de diagramas de Venn: La superficie total sombreada de $A \cup B$ es topológicamente indistinguible de la de $B \cup A$.
  - Extensión a $n$ conjuntos: $\bigcup_{i=1}^n A_{\sigma(i)} = \bigcup_{i=1}^n A_i$ para cualquier permutación $\sigma \in S_n$.

  ### Síntesis didáctica
  La conmutatividad garantiza la simetría total en la recolección de elementos sin importar el punto de partida.
definiciones_clave: |
  - **Propiedad conmutativa**: Propiedad de una operación binaria donde permutar el orden de los operandos no modifica el resultado.
  - **Conmutatividad de la disyunción**: Equivalencia tautológica $P \lor Q \equiv Q \lor P$.
  - **Axioma de extensionalidad**: Fundamento que confirma la igualdad de conjuntos a partir de la equivalencia lógica de membresía.
propiedades_relaciones: |
  - **Estructura de semigrupo conmutativo**: $(\mathcal{P}(\mathcal{U}), \cup)$ es un monoide conmutativo con elemento neutro $\emptyset$.
  - **Compatibilidad con inclusión**: $A \subseteq B \iff A \cup B = B \iff B \cup A = B$.
ejemplo_guiado:
  enunciado: 'Dados los conjuntos $A = \{a, b, c\}$ y $B = \{c, d, e\}$, demuestra paso a paso por extensión que $A \cup B = B \cup A$.'
  pasos:
    - 'Paso 1: Calcular $A \cup B$ tomando los elementos de $A$ y agregando los de $B$:
      - $A \cup B = \{a, b, c\} \cup \{c, d, e\} = \{a, b, c, d, e\}$.'
    - 'Paso 2: Calcular $B \cup A$ tomando los elementos de $B$ y agregando los de $A$:
      - $B \cup A = \{c, d, e\} \cup \{a, b, c\} = \{c, d, e, a, b\}$.'
    - 'Paso 3: Comparar la membresía de ambos conjuntos resultantes:
      - Ambos conjuntos contienen exactamente los mismos 5 elementos $\{a, b, c, d, e\}$.'
    - 'Paso 4: Aplicar el axioma de extensionalidad (el orden dentro de las llaves no altera el conjunto).'
    - 'Paso 5: Concluir formalmente que $A \cup B = B \cup A$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿En qué propiedad de la lógica proposicional se fundamenta la demostración de que $A \cup B = B \cup A$?'
    choices:
      - {text: 'En la conmutatividad de la disyunción lógica ($P \lor Q \equiv Q \lor P$)', is_correct: true}
      - {text: 'En la no contradicción de la conjunción', is_correct: false}
      - {text: 'En la transitividad del condicional', is_correct: false}
      - {text: 'En la ley de doble negación', is_correct: false}
    explanation: 'La alternativa correcta es ''En la conmutatividad de la disyunción lógica ($P \lor Q \equiv Q \lor P$)''. La pertenencia a la unión es disyuntiva.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $A \cup B = \{1, 3, 5, 7, 9\}$, ¿cuál es el resultado de $B \cup A$?'
    choices:
      - {text: '$\{1, 3, 5, 7, 9\}$', is_correct: true}
      - {text: '$\emptyset$', is_correct: false}
      - {text: '$\{9, 7, 5, 3, 1\}^c$', is_correct: false}
      - {text: 'Indeterminado sin conocer $A$ y $B$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\{1, 3, 5, 7, 9\}$''. Por la propiedad conmutativa, $B \cup A$ es exactamente el mismo conjunto que $A \cup B$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Expresar la condición de pertenencia $x \in (A \cup B)$ como $x \in A \lor x \in B$.'
  - 'Paso 2: Conmutar la proposición lógica a $x \in B \lor x \in A$.'
  - 'Paso 3: Reescribir como condición de conjunto $x \in (B \cup A)$.'
  - 'Paso 4: Concluir por extensionalidad que $A \cup B = B \cup A$.'
errores_correccion: |
  - **Error 1:** Creer que $A \cup B$ y $B \cup A$ son conjuntos distintos porque sus elementos se escriben en diferente orden. **Cómo corregirlo:** En la teoría de conjuntos, el orden de escritura no altera la identidad del conjunto ($\{1, 2\} = \{2, 1\}$).
  - **Error 2:** Extrapolar la conmutatividad de la unión a la diferencia de conjuntos. **Cómo corregirlo:** La unión sí es conmutativa ($A \cup B = B \cup A$), pero la diferencia no lo es ($A \setminus B \neq B \setminus A$).
ejemplos:
  - titulo: 'Conmutatividad con números'
    enunciado: '¿Es $\{1, 4\} \cup \{2, 3\}$ igual a $\{2, 3\} \cup \{1, 4\}$?'
    alternativas:
      - 'Sí, ambos son $\{1, 2, 3, 4\}$'
      - 'No, difieren en orden'
      - 'No, el primero es mayor'
    respuesta: 'Sí, ambos son $\{1, 2, 3, 4\}$'
    solucion_pasos:
      - '1. La unión es conmutativa y produce los mismos elementos.'
  - titulo: 'Conmutatividad con el conjunto vacío'
    enunciado: '¿$A \cup \emptyset = \emptyset \cup A$?'
    respuesta: 'Sí, ambos dan $A$'
    solucion_pasos:
      - 'Por conmutatividad y elemento neutro.'
  - titulo: 'Conmutatividad con inclusión'
    enunciado: 'Si $A \subseteq B$, ¿$A \cup B = B \cup A = B$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Ambas expresiones conmutadas evalúan al conjunto mayor $B$.'
  - titulo: 'Simetría en diagramas de Venn'
    enunciado: '¿Cambia el sombreado de un diagrama de Venn al conmutar la unión?'
    respuesta: 'No, el área total sombreada es idéntica'
    solucion_pasos:
      - 'Representa la misma región del plano.'
errores_frecuentes:
  - 'La afirmación de que el orden de los conjuntos en la unión produce conjuntos distintos debido a la secuencia de escritura.'
  - 'La afirmación de que la propiedad conmutativa de la unión solo es válida para conjuntos disjuntos.'
  - 'La afirmación de que la diferencia de conjuntos también cumple la propiedad conmutativa.'
  - 'La afirmación de que la unión de conjuntos infinitos no obedece la ley conmutativa.'
  - 'La afirmación de que conmutar los operandos de la unión altera su cardinalidad final.'
afirmaciones_verdaderas:
  - 'La unión de conjuntos es estrictamente conmutativa para cualquier par de conjuntos ($A \cup B = B \cup A$).'
  - 'La validez de la conmutatividad conjuntista se deriva directamente de la conmutatividad de la disyunción lógica ($P \lor Q \equiv Q \lor P$).'
al_terminar_debes_poder: |
  QUÉ: Enunciar, demostrar y aplicar la propiedad conmutativa de la unión ($A \cup B = B \cup A$).
  CÓMO: Traducir la unión a disyunción lógica ($\lor$), conmutar proposiciones y aplicar el axioma de extensionalidad.
