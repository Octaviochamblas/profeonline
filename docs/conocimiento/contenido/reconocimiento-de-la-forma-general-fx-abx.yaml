semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.FORMA_GENERAL
resumen_inicial: El reconocimiento de la forma general $f(x) = a \cdot b^x$ identifica el factor de escala inicial $a$ y la tasa de crecimiento o decrecimiento $b$.
explicacion_simple: |
  En la práctica y en los problemas aplicados, la función exponencial suele incluir un **número multiplicativo $a$ al principio**:

  $$f(x) = a \cdot b^x$$

  - **$a$ es el valor inicial**: Representa la cantidad que tienes al comienzo cuando $x = 0$, porque $f(0) = a \cdot b^0 = a \cdot 1 = a$.
  - **$b$ es el factor de cambio**: Indica por cuánto se multiplica la cantidad en cada paso de $x$.
  - **Ejemplo**: Si tienes $\$5.000$ ahorrados y se duplican cada año: $f(x) = 5000 \cdot 2^x$.
explicacion_formal: |
  Dada la función $f: \mathbb{R} \to \mathbb{R}$, se define la **forma general de la función exponencial** mediante la expresión:

  $$f(x) = a \cdot b^x \quad \text{con } a \in \mathbb{R} \setminus \{0\}, \, b \in \mathbb{R}^+ \setminus \{1\}$$

  **Análisis de componentes parámetros:**
  1. **Parámetro $a$ (Valor inicial / Escala vertical):** Determina la intersección con el eje Y en $(0, a)$. Si $a > 0$, el recorrido es $]0, +\infty[$; si $a < 0$, invierte la gráfica situándola en $]-\infty, 0[$.
  2. **Parámetro $b$ (Base / Factor multiplicativo):** Dicta la tasa de variación. Si $b > 1$, es una función de crecimiento; si $0 < b < 1$, es de decrecimiento.
definiciones_clave: |
  - **Forma general exponencial**: Estructura algebraica $f(x) = a \cdot b^x$ donde $a$ es la escala inicial y $b$ es la base exponencial.
propiedades_relaciones: |
  - **Corte con el eje Y**: En la función general $f(x) = a \cdot b^x$, el punto de intersección con el eje vertical coincide exactamente con la constante multiplicativa $a$.
ejemplo_guiado:
  enunciado: 'Para la función exponencial $f(x) = 250 \cdot (1.05)^x$, identifica el valor inicial $a$, la base $b$ y calcula la intersección con el eje Y.'
  pasos:
    - 'Paso 1: Identificar el coeficiente multiplicativo $a = 250$.'
    - 'Paso 2: Identificar la base del exponente $b = 1.05$.'
    - 'Paso 3: Calcular el valor en $x = 0$: $f(0) = 250 \cdot (1.05)^0 = 250 \cdot 1 = 250$.'
    - 'Paso 4: Concluir que la intersección con el eje Y es el punto cartesiano $(0, 250)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la función exponencial general $f(x) = 80 \cdot 3^x$, ¿cuál es el valor del parámetro inicial $a$ y en qué punto corta al eje Y?'
    choices:
      - {text: '$a = 80$ y corta al eje Y en $(0, 80)$', is_correct: true}
      - {text: '$a = 3$ y corta al eje Y en $(0, 3)$.', is_correct: false}
      - {text: '$a = 240$ y corta al eje Y en $(0, 240)$.', is_correct: false}
      - {text: '$a = 1$ y corta al eje Y en $(0, 1)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = 80$ y corta al eje Y en $(0, 80)$''. $f(0) = 80 \cdot 3^0 = 80$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Dada la función $g(x) = -4 \cdot 2^x$, ¿cuál es la ordenada del punto de corte con el eje Y?'
    choices:
      - {text: 'La ordenada es $y = -4$', is_correct: true}
      - {text: 'La ordenada es $y = 2$.', is_correct: false}
      - {text: 'La ordenada es $y = -8$.', is_correct: false}
      - {text: 'La ordenada es $y = 0$.', is_correct: false}
    explanation: 'La alternativa correcta es ''La ordenada es $y = -4$''. $g(0) = -4 \cdot 2^0 = -4 \cdot 1 = -4$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Comparar la función dada con la estructura $f(x) = a \cdot b^x$.'
  - 'Paso 2: Aislar el coeficiente constante $a$ fuera de la potencia.'
  - 'Paso 3: Aislar la base $b$ que sostiene a la variable variable $x$.'
  - 'Paso 4: Comprobar que $f(0) = a$ e interpretar $a$ como el valor inicial.'
errores_correccion: |
  - **Error común:** Multiplicar $a \cdot b$ antes de evaluar el exponente $x$ (ej. decir que $3 \cdot 2^x = 6^x$).
  - **Cómo corregirlo:** La potencia se resuelve **ANTES QUE LA MULTIPLICACIÓN por $a$**. Nunca multipliques $a$ por $b$ si $b$ tiene exponente $x$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Identificación de parámetros.
    alternativas:
      - 'a = 100, b = 2, corte Y en (0, 100)'
      - 'a = 2, b = 100, corte Y en (0, 2)'
      - 'a = 200, corte Y en (0, 200)'
    respuesta: 'a = 100, b = 2, corte Y en (0, 100)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Parámetro inicial negativo.
    alternativas:
      - 'a = -15, b = 4, corte Y en (0, -15)'
      - 'a = 4, b = -15'
      - 'corte Y en (0, 0)'
    respuesta: 'a = -15, b = 4, corte Y en (0, -15)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la expresión $f(x) = 5 \cdot 2^x$, la equivalencia afirmada de que es igual a la función $10^x$.'
  - 'La afirmación errónea de que el punto de intersección con el eje Y en la forma general es siempre el punto $(0, 1)$.'
  - 'La adición del coeficiente $a$ al exponente en lugar de mantenerlo como factor multiplicativo exterior.'
  - 'Afirmar que la presencia de un parámetro $a$ negativo cambia el valor de la base $b$ a un número negativo.'
  - 'La falta de distinción entre el valor inicial $a = f(0)$ y la tasa de variación constante $b$.'
afirmaciones_verdaderas:
  - 'En la forma general $f(x) = a \cdot b^x$, el parámetro $a$ representa la imagen en el origen $f(0) = a$.'
  - 'La operación de potenciación $b^x$ tiene prioridad algebraica estricta sobre el producto por la constante $a$.'
al_terminar_debes_poder: |
  QUÉ: Reconocer e interpretar los parámetros $a$ y $b$ de la forma general exponencial $f(x) = a \cdot b^x$.
  CÓMO: Aislar la constante $a$, identificar la base $b$, calcular la intersección $(0, a)$ y evitar la multiplicación no permitida $a \cdot b$.
