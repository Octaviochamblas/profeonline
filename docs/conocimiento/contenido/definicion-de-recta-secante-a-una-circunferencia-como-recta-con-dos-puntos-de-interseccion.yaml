semantic_id: MAT.GEO.CIRCULO_RECTAS.SECANTE
resumen_inicial: Una recta secante es aquella que corta a la circunferencia en exactamente dos puntos distintos, situándose a una distancia del centro menor que el radio.
explicacion_simple: 'Una **recta secante** es como una brocheta o una aguja que atraviesa una fruta de lado a lado: entra por un punto, pasa por el interior del círculo y sale por otro punto.


  Por eso, la recta secante siempre corta a la circunferencia en **exactamente dos puntos distintos** ($A$ y $B$). El trozo de recta que queda atrapado adentro entre esos dos puntos es una **cuerda**. La clave para reconocerla matemáticamente es que la distancia desde el centro a la recta ($d$) es **menor que el radio ($r$)**: como pasa cerca del centro ($d < r$), inevitablemente perfora el borde dos veces.


  ![Definición de recta secante](/static/img/nodos/definicion-de-recta-secante-a-una-circunferencia-como-recta-con-dos-puntos-de-interseccion-intro.svg)

  '
explicacion_formal: '### Definición geométrica conjuntista

  Sea $\mathcal{C}(O, r)$ una circunferencia en $\mathbb{R}^2$. Una recta coplanar $\mathcal{L}$ se define como **recta secante** a $\mathcal{C}$ si y solo si interseca a la curva en una cardinalidad exactamente igual a dos puntos:

  $$\mathcal{L} \text{ es secante a } \mathcal{C} \iff |\mathcal{L} \cap \mathcal{C}| = 2 \iff \mathcal{L} \cap \mathcal{C} = \{A, B\} \ (A \neq B)$$


  ### Criterio métrico de distancia al centro

  La distancia euclidiana perpendicular desde el centro $O$ a la recta secante es estrictamente menor que el radio:

  $$d(O, \mathcal{L}) < r$$

  Si $d(O, \mathcal{L}) = 0$, la recta pasa por el centro y se denomina **secante diametral** (la cuerda interceptada es un diámetro).


  ### Relación con la cuerda interceptada

  Los dos puntos de corte definen el segmento $\overline{AB}$, que constituye una cuerda de la circunferencia. Su longitud métrica satisface el Teorema de Pitágoras:

  $$\text{long}(AB) = 2\sqrt{r^2 - d^2}$$


  > **Complemento didáctico:** Una confusión muy común es creer que secante y cuerda son lo mismo. ¡Ojo! La cuerda es un segmento acotado que termina en la circunferencia; la recta secante es infinita y continúa hacia afuera por ambos lados.

  '
definiciones_clave: '- **Recta secante**: Recta infinita que corta a la circunferencia en dos puntos distintos.

  - **Cuerda interceptada**: Segmento de la secante cuyos extremos pertenecen a la circunferencia.

  - **Secante diametral**: Recta secante cuya distancia al centro es cero ($d = 0$).

  '
propiedades_relaciones: '- **Discriminante positivo**: El sistema algebraico recta-circunferencia genera una ecuación cuadrática con $\Delta > 0$.

  - **Partición del círculo**: Toda secante divide al círculo en dos segmentos circulares desiguales (o dos semicírculos si pasa por el centro).

  - **Punto medio de la cuerda**: La proyección ortogonal del centro $O$ sobre la recta secante es el punto medio exacto de la cuerda generada.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de recta secante](/static/img/nodos/definicion-de-recta-secante-a-una-circunferencia-como-recta-con-dos-puntos-de-interseccion-ejemplos.svg)


    Una circunferencia de radio $r = 5\text{ cm}$ tiene centro en $O(0, 0)$. Una recta dista $d = 3\text{ cm}$ del centro. Determina si la recta es secante y calcula la longitud de la cuerda interceptada.'
  pasos:
  - 'Paso 1: Comparar distancia y radio: Como $d = 3\text{ cm} < r = 5\text{ cm}$, la recta es rigurosamente secante y corta en dos puntos.'
  - 'Paso 2: Plantear el triángulo rectángulo con la mitad de la cuerda: Hipotenusa $r = 5$, cateto $d = 3$ y semicateto $x$.'
  - 'Paso 3: Aplicar Pitágoras: $x = \sqrt{r^2 - d^2} = \sqrt{5^2 - 3^2} = \sqrt{25 - 9} = \sqrt{16} = 4\text{ cm}$.'
  - 'Paso 4: Calcular la longitud de la cuerda completa: $\text{Cuerda} = 2x = 2(4) = 8\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición métrica de distancia al centro d para que una recta sea secante a una circunferencia de radio r?
  choices:
  - text: d < r.
    is_correct: true
  - text: d = r.
    is_correct: false
  - text: d > r.
    is_correct: false
  - text: d = 2r.
    is_correct: false
  explanation: La alternativa correcta es 'd < r.' Para cortar a la circunferencia en dos puntos, la distancia desde el centro a la recta debe ser estrictamente menor que el radio.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una recta pasa exactamente por el centro de una circunferencia de radio r (d = 0), ¿cuánto mide la cuerda interceptada?
  choices:
  - text: 2r (es un diámetro).
    is_correct: true
  - text: r (es un radio).
    is_correct: false
  - text: 0 cm.
    is_correct: false
  - text: 4r.
    is_correct: false
  explanation: La alternativa correcta es '2r (es un diámetro).' Cuando $d = 0$, la cuerda interceptada es la cuerda máxima, es decir, el diámetro $2r$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Calcular o identificar la distancia perpendicular $d$ desde el centro a la recta.

  2. Verificar la condición $d < r$ para clasificar como secante.

  3. Para hallar los puntos de corte, resolver el sistema de ecuaciones sustituyendo la recta en la circunferencia.

  4. Para calcular la longitud de la cuerda interceptada, aplicar $L = 2\sqrt{r^2 - d^2}$.

  '
errores_correccion: '- **Error común 1:** Confundir la recta secante con la cuerda. **Corrección:** La secante es la recta completa que se prolonga indefinidamente; la cuerda es solo el segmento interior.

  - **Error común 2:** Olvidar multiplicar por 2 al calcular la cuerda con Pitágoras. **Corrección:** $\sqrt{r^2 - d^2}$ es la mitad de la cuerda; se debe duplicar.

  '
ejemplos:
- tipo: A
  titulo: Puntos de corte de secante
  enunciado: ¿En cuántos puntos interseca a la circunferencia una recta que dista $2\text{ cm}$ del centro si el radio mide $6\text{ cm}$?
  alternativas:
  - text: En exactamente 2 puntos.
    is_correct: true
  - text: En 1 punto.
    is_correct: false
  - text: En 0 puntos.
    is_correct: false
  - text: En 4 puntos.
    is_correct: false
  explicacion: Como $d = 2 < r = 6$, la recta es secante y corta en exactamente 2 puntos.
- tipo: B
  titulo: Secante y paso por el centro
  enunciado: ¿Puede una recta secante pasar por el centro de la circunferencia?
  respuesta: Sí
  explicacion: Sí. Si pasa por el centro ($d = 0 < r$), la recta es una secante diametral y corta a la circunferencia en los extremos de un diámetro.
errores_frecuentes:
- '''Creer que una recta secante solo corta a la circunferencia en un punto.'''
- '''Confundir el valor de la distancia $d$ con la longitud de la cuerda.'''
- '''Asumir que las rectas secantes no pueden pasar por el centro.'''
afirmaciones_verdaderas:
- '''Una recta secante interseca a la circunferencia en exactamente dos puntos distintos.'''
- '''La distancia desde el centro a una recta secante es estrictamente menor que el radio ($d < r$).'''
- '''La porción de recta secante comprendida entre los puntos de corte es una cuerda de la circunferencia.'''
al_terminar_debes_poder: '**QUÉ:** Identificar rectas secantes y calcular la longitud de la cuerda interceptada.


  **CÓMO:** Verificando $d(O, \mathcal{L}) < r$ y aplicando $L = 2\sqrt{r^2 - d^2}$.


