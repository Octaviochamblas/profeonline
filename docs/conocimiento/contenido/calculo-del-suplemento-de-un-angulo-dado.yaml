semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.SUPLEMENTO_CALCULO
resumen_inicial: El suplemento de un ángulo α se calcula restando su medida de 180°,
  mediante la fórmula S(α) = 180° - α.
explicacion_simple: '![Cálculo del Suplemento](/static/img/nodos/calculo-del-suplemento-de-un-angulo-dado-intro.svg)


  Para saber cuánto le falta a un ángulo para formar una línea recta completa de 180°,
  simplemente tomas 180° y le restas el ángulo que tienes. Por ejemplo, el suplemento
  de 110° es 180° - 110° = 70°.'
explicacion_formal: '### Definición formal

  Dado un ángulo convexo de medida $\alpha \in [0^\circ, 180^\circ]$, se define el
  **suplemento** de $\alpha$ (denotado $S(\alpha)$) como el operador de sustracción
  respecto al ángulo extendido:


  $$S(\alpha) = 180^\circ - \alpha \iff S(\alpha) = \pi - \alpha$$


  ### Desglose simbólico y geométrico

  - $S(\alpha)$: Operador suplemento evaluado en grados sexagesimales o radianes.

  - Dominio admisible: $\alpha \in [0^\circ, 180^\circ]$.

  - Involución de orden 2: $S(S(\alpha)) = 180^\circ - (180^\circ - \alpha) = \alpha$.


  ### Síntesis didáctica

  El cálculo del suplemento permite hallar de forma exacta el ángulo adyacente necesario
  para completar una línea recta horizontal o transversal.'
definiciones_clave: '- **Fórmula del suplemento**: $S(\alpha) = 180^\circ - \alpha$.

  - **Ángulo dado**: Ángulo convexo original $\alpha$ para el cual se halla su suplemento. '
propiedades_relaciones: '- **Involución del suplemento**: El suplemento del suplemento
  de $\alpha$ devuelve el ángulo original: $S(S(\alpha)) = 180^\circ - (180^\circ
  - \alpha) = \alpha$.

  - **Relación con el complemento**: El suplemento de un ángulo siempre es $90^\circ$
  mayor que su complemento: $S(\alpha) - C(\alpha) = 90^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Cálculo de Suplemento](/static/img/nodos/calculo-del-suplemento-de-un-angulo-dado-ejemplos.svg)


    Calcula el suplemento del ángulo $\alpha = 125^\circ 45''$ y expresa el resultado
    en grados y minutos sexagesimales.'
  pasos:
  - 'Paso 1: Expresar $180^\circ$ en forma de grados y minutos: $180^\circ = 179^\circ
    60''$.'
  - 'Paso 2: Plantear la resta: $S(\alpha) = 179^\circ 60'' - 125^\circ 45''$.'
  - 'Paso 3: Restar los minutos: $60'' - 45'' = 15''$.'
  - 'Paso 4: Restar los grados: $179^\circ - 125^\circ = 54^\circ$.'
  - 'Paso 5: Concluir que el suplemento es $54^\circ 15''$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular el suplemento de un ángulo α?
  choices:
  - text: S(α) = 180° - α
    is_correct: true
  - text: S(α) = 90° - α
    is_correct: false
  - text: S(α) = 360° - α
    is_correct: false
  - text: S(α) = α - 180°
    is_correct: false
  explanation: El suplemento se calcula restando la medida de 180° (S(α) = 180° -
    α).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el suplemento de un ángulo que mide 135°?
  choices:
  - text: 45° (porque 180° - 135° = 45°)
    is_correct: true
  - text: 145°
    is_correct: false
  - text: 55°
    is_correct: false
  - text: 225°
    is_correct: false
  explanation: Aplicando la fórmula, 180° - 135° = 45°, por lo que el suplemento es
    45° (porque 180° - 135° = 45°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el valor numérico o algebraico del ángulo $\alpha$.'
- 'Paso 2: Aplicar la fórmula $S(\alpha) = 180^\circ - \alpha$.'
- 'Paso 3: Realizar la sustracción en grados o radianes.'
- 'Paso 4: Comprobar que $\alpha + S(\alpha) = 180^\circ$.'
errores_correccion: Asegúrate de restar de 180° y no de 90°.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el suplemento de 60°?
  alternativas:
  - $120^\circ$
  - $30^\circ$
  - $90^\circ$
  respuesta: $120^\circ$
  solucion_pasos:
  - $S(60^\circ) = 180^\circ - 60^\circ = 120^\circ$.
- titulo: Ejemplo 2
  enunciado: Si el suplemento de un ángulo es el triple del ángulo, ¿cuánto mide el
    ángulo?
  alternativas:
  - $45^\circ$
  - $60^\circ$
  - $30^\circ$
  respuesta: $45^\circ$
  solucion_pasos:
  - $180^\circ - x = 3x \implies 4x = 180^\circ \implies x = 45^\circ$.
- titulo: ¿El suplemento de 90° es 90°?
  respuesta: Sí
  solucion_pasos:
  - Sí, 180° - 90° = 90°.
- titulo: ¿El suplemento de un ángulo obtuso es otro ángulo obtuso?
  respuesta: 'No'
  solucion_pasos:
  - No, si $\alpha > 90^\circ$, entonces $180^\circ - \alpha < 90^\circ$ (es agudo).
errores_frecuentes:
- Confundir la fórmula del suplemento ($180^\circ - \alpha$) con la del complemento
  ($90^\circ - \alpha$).
- Olvidar restar minutos al desagrupar un grado ($180^\circ = 179^\circ 60''$).
- Obtener resultados negativos por plantear $\alpha - 180^\circ$.
- No aplicar paréntesis en expresiones como $180^\circ - (2x + 15^\circ) = 165^\circ
  - 2x$.
- Creer que el suplemento de un ángulo agudo puede ser otro ángulo agudo.
afirmaciones_verdaderas:
- El suplemento de un ángulo $\alpha$ se calcula como $180^\circ - \alpha$.
- El suplemento de cualquier ángulo agudo es siempre un ángulo obtuso.
al_terminar_debes_poder: '**QUÉ:** Calcular con exactitud el suplemento de ángulos
  agudos, rectos y obtusos en contextos geométricos y algebraicos.


  **CÓMO:** Aplicando la fórmula $S(\alpha) = 180^\circ - \alpha$ y resolviendo ecuaciones
  con pares lineales.


  ![Resumen de Cálculo del Suplemento](/static/img/nodos/calculo-del-suplemento-de-un-angulo-dado-resumen.svg)'
