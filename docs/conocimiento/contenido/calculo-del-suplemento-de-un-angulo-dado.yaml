semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.SUPLEMENTO_CALCULO
resumen_inicial: Los ángulos suplementarios suman 180° formando una recta continua,
  siendo la base para calcular ángulos adyacentes y resolver sistemas de ecuaciones.
explicacion_simple: Imagina una línea recta horizontal de 180° partida en dos pedazos
  por una línea oblicua. Los dos pedazos son suplementarios porque juntos forman la
  línea recta completa.
explicacion_formal: Dos ángulos $\theta$ y $\phi$ son **suplementarios** si la suma
  de sus medidas es exactamente $180^\circ$ ($\theta + \phi = 180^\circ$). El suplemento
  de $\theta$ se obtiene mediante $\phi = 180^\circ - \theta$.
definiciones_clave: '- **Cálculo del suplemento de un ángulo dado**: Elemento o relación
  angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en cálculo del suplemento de un ángulo dado se mantiene invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: El suplemento de un ángulo $\theta$ es igual al cuádruple de dicho ángulo.
    Calcula la medida de $\theta$.
  pasos:
  - 'Paso 1: Denotar el ángulo por $\theta$ y su suplemento por $180^\circ - \theta$.'
  - 'Paso 2: Plantear la relación dada: $180 - \theta = 4\theta \implies 180 = 5\theta$.'
  - 'Paso 3: Dividir entre 5: $\theta = \frac{180}{5} = 36^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de cálculo del suplemento de
    un ángulo dado?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el suplemento de un ángulo $\theta$ equivale a 4 veces $\theta$, ¿cuánto
    mide $\theta$?
  choices:
  - text: 36°
    is_correct: true
  - text: 45°
    is_correct: false
  - text: 144°
    is_correct: false
  - text: 30°
    is_correct: false
  explanation: La alternativa correcta es '36°', ya que $5\theta = 180 \implies \theta
    = 36^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en cálculo del suplemento de un ángulo dado.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en cálculo del suplemento
  de un ángulo dado sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 16^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 164°
  - 16°
  - 90°
  respuesta: 164°
  solucion_pasos:
  - Despejando $x = 180 - 16 = 164^\circ$.
- titulo: Ejemplo 2
  enunciado: En cálculo del suplemento de un ángulo dado, si dos ángulos son suplementarios
    y uno mide 16°, ¿cuánto mide el otro?
  alternativas:
  - 164°
  - 74°
  - 360°
  respuesta: 164°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 16 = 164^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en cálculo del
    suplemento de un ángulo dado?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en cálculo del suplemento de un ángulo
    dado es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de cálculo del suplemento de un ángulo dado.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
