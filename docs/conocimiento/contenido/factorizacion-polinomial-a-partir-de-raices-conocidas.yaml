semantic_id: MAT.ALG.TEOREMA_FACTOR.FACTORIZACION_POR_RAICES
resumen_inicial: 'Factorización polinomial a partir de raíces conocidas: concepto,
  método de descomposición y reglas en Teorema del factor y división sintética.'
explicacion_simple: 'A veces el problema te da la solución en bandeja: "Construye
  un polinomio sabiendo que sus raíces son estas". Esta es la ingeniería inversa definitiva
  del Teorema del Factor. Pasarás de tener puntos dispersos en un plano a construir
  la ecuación maestra que los rige.'
explicacion_formal: '### Definición formal


  Por el Teorema del Factor, cada raíz $r_i$ de un polinomio $P(x)$ de grado $n$ aporta
  un factor lineal $(x-r_i)$. Si $P$ tiene exactamente $n$ raíces $r_1, \dots, r_n$
  (contando multiplicidad), estos $n$ factores agotan el grado del polinomio, por
  lo que $P(x) = a(x-r_1)(x-r_2)\dots(x-r_n)$ para alguna constante $a$ que ajusta
  la escala vertical.


  ### Desarrollo didáctico


  Imagínate que alguien te dice: "Tengo un polinomio de tercer grado. Sus raíces son
  $5$, $-2$ y $0$.

  ¿Puedes reconstruirlo?


  Por supuesto.

  - Si la raíz es $5$, su factor es $(x - 5)$.

  - Si la raíz es $-2$, su factor es $(x - (-2)) = (x + 2)$.

  - Si la raíz es $0$, su factor es $(x - 0) = x$.


  Multiplicamos las piezas maestras:

  $P(x) = x \cdot (x - 5) \cdot (x + 2)$.


  Si te pidieran la forma expandida, simplemente multiplicas todo:

  $x \cdot (x^2 - 3x - 10) = x^3 - 3x^2 - 10x$.


  La única trampa es el "coeficiente $a$". Si el problema te dice que el polinomio
  cruza el eje Y en 20, tendrás que añadir una letra ''$a$'' multiplicando al frente:
  $P(x) = a(x)(x-5)(x+2)$ y resolver para ''$a$'' evaluando en un punto dado.'
definiciones_clave: '- **Factorización polinomial a partir de raíces conocidas**:
  Técnica de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
