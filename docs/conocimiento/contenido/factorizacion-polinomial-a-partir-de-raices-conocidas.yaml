semantic_id: MAT.ALG.TEOREMA_FACTOR.FACTORIZACION_POR_RAICES
resumen_inicial: 'La factorización polinomial a partir de raíces conocidas consiste en reconstruir el polinomio $P(x)$ expresándolo en la forma factorizada fundamental $P(x) = a_n (x - r_1)(x - r_2) \dots (x - r_n)$ dada la totalidad de sus raíces reales o complejas.'
explicacion_simple: |
  Si conoces de antemano todas las **soluciones o raíces** de un polinomio $P(x)$ (ej: $r_1 = 1, r_2 = -2, r_3 = 4$ y coeficiente principal $a = 3$):
  - **FÓRMULA RECONSTRUCTORA DE POLINOMIOS**:
    $$\mathbf{P(x) = a(x - r_1)(x - r_2)(x - r_3) \dots (x - r_n)}$$
  - **Pasos para construir los factores**:
    1. **Para $r_1 = 1$**: El factor es **$(x - 1)$**.
    2. **Para $r_2 = -2$**: El factor es **$(x + 2)$** (¡inviertes el signo!).
    3. **Para $r_3 = 4$**: El factor es **$(x - 4)$**.
    4. **Antepones el coeficiente principal $a = 3$**:
       - $\mathbf{P(x) = 3(x - 1)(x + 2)(x - 4)}$.
  - **Multiplicidad de Raíces**:
    - Si una raíz como $r = 5$ se repite $2$ veces (multiplicidad 2), su factor se eleva al cuadrado: **$(x - 5)^2$**.
explicacion_formal: |
  ### Definición formal
  Sea $P(x) \in \mathbb{C}[x]$ un polinomio de grado $n \ge 1$ con coeficiente principal $a_n \neq 0$. Por el **Teorema Fundamental del Álgebra**, $P(x)$ posee exactamente $n$ raíces contadas con su correspondiente multiplicidad algebraica $m_i \in \mathbb{N}$ ($\sum m_i = n$). La **Forma Factorizada Canónica** del polinomio se define como:

  $$\mathbf{P(x) = a_n \prod_{i=1}^k (x - r_i)^{m_i} = a_n (x - r_1)^{m_1} (x - r_2)^{m_2} \dots (x - r_k)^{m_k}}$$

  ### Propiedades del Producto de Raíces
  - **Inversión de signo de raíces**: A cada raíz $r_i \in \mathbb{R}$ le corresponde el factor lineal divisible $(x - r_i)$.
  - **Raíces compuestas complejas**: Si los coeficientes son reales y $z = \alpha + \beta i$ es una raíz compleja, su conjugado $\bar{z} = \alpha - \beta i$ también es una raíz, produciendo el trinomio real irreducible $(x - \alpha)^2 + \beta^2$.

  ### Síntesis didáctica
  Dadas las raíces de un polinomio, su forma factorizada se obtiene multiplicando el coeficiente principal $a_n$ por los binomios $(x - r_i)$ elevados a su respectiva multiplicidad.
definiciones_clave: |
  - **Forma factorizada canónica**: Expresión de $P(x)$ como el producto de $a_n$ por todos sus factores binómicos $(x - r_i)^{m_i}$.
  - **Multiplicidad de una raíz ($m_i$)**: Número de veces que una misma raíz anula al polinomio, determinando el exponente del factor $(x - r_i)^{m_i}$.
  - **Teorema Fundamental del Álgebra**: Garantía matemática de que todo polinomio de grado $n$ tiene exactamente $n$ raíces en el cuerpo complejo.
propiedades_relaciones: |
  - **Unicidad de la representación**: Salvo el orden de los factores, la representación canónica en función de las raíces es única.
ejemplo_guiado:
  enunciado: 'Construye la forma factorizada de un polinomio $P(x)$ de grado 4 sabiendo que su coeficiente principal es $a_4 = 5$, tiene una raíz doble en $r_1 = 2$ y raíces simples en $r_2 = -3$ y $r_3 = 0$.'
  pasos:
    - 'Paso 1: Identificamos los factores según la multiplicidad de las raíces:
       - Para $r_1 = 2$ (multiplicidad 2): $(x - 2)^2$.
       - Para $r_2 = -3$ (multiplicidad 1): $(x - (-3)) = (x + 3)$.
       - Para $r_3 = 0$ (multiplicidad 1): $(x - 0) = x$.'
    - 'Paso 2: Identificamos el coeficiente principal: $a_4 = \mathbf{5}$.'
    - 'Paso 3: Ensamblamos el producto canónico $P(x) = a_n \prod (x - r_i)^{m_i}$:
       $P(x) = 5 \cdot x \cdot (x + 3) \cdot (x - 2)^2$.'
    - 'Conclusión: El polinomio factorizado es **$P(x) = 5x(x + 3)(x - 2)^2$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si un polinomio de grado 3 tiene raíces en $x_1 = 1, x_2 = 1, x_3 = 1$ (raíz triple) y coeficiente principal $a = 4$, ¿cuál es su expresión factorizada?'
    choices:
      - {text: 'La expresión es $4(x - 1)^3$, elevando el factor $(x - 1)$ al exponente de su multiplicidad 3', is_correct: true}
      - {text: 'La expresión es $(x - 4)^3$', is_correct: false}
      - {text: 'La expresión es $4(x + 1)^3$', is_correct: false}
      - {text: 'La expresión es $4(x - 3)^1$', is_correct: false}
    explanation: 'La alternativa correcta es ''La expresión es $4(x - 1)^3$, elevando el factor $(x - 1)$ al exponente de su multiplicidad 3''. Exponente por multiplicidad: $m=3 \implies (x-1)^3$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué ocurre con la raíz $r = 0$ al formar su factor lineal en la expresión factorizada de un polinomio?'
    choices:
      - {text: 'Se convierte en el monomio simple $x$, puesto que $(x - 0) = x$', is_correct: true}
      - {text: 'Se elimina del polinomio', is_correct: false}
      - {text: 'Se convierte en el número 1', is_correct: false}
      - {text: 'Produce una división por cero', is_correct: false}
    explanation: 'La alternativa correcta es ''Se convierte en el monomio simple $x$, puesto que $(x - 0) = x$''. Factor de raíz nula: $(x-0) = x$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las raíces $r_i$ y sus correspondientes multiplicidades $m_i$.'
  - 'Paso 2: Escribir para cada raíz el factor lineal $(x - r_i)$, invirtiendo el signo de la raíz.'
  - 'Paso 3: Elevar cada factor $(x - r_i)$ a la potencia dada por su multiplicidad $m_i$.'
  - 'Paso 4: Multiplicar todos los factores formados por el coeficiente principal $a_n$.'
errores_correccion: |
  - **Error 1:** Excluir el exponente de la multiplicidad de una raíz repetida (escribir $(x - 2)$ para una raíz doble $r=2$). **Cómo corregirlo:** Si una raíz tiene multiplicidad $m$, **EL FACTOR BINÓMICO SE DEBE ELEVAR AL EXPONENTE DE DICHA MULTIPLICIDAD ($(x - 2)^m$)**.
  - **Error 2:** Excluir el coeficiente principal $a_n$ en el ensamble del producto. **Cómo corregirlo:** La fórmula canónica **REQUIERE OBLIGATORIAMENTE MULTIPLICAR TODO EL PRODUCTO POR EL COEFICIENTE PRINCIPAL $a_n$**.
ejemplos:
  - titulo: 'Raíz simple'
    enunciado: 'Para raíz $r = 4$, ¿es el factor $(x - 4)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $x - 4$.'
  - titulo: 'Raíz doble'
    enunciado: 'Para raíz $r = 3$ de multiplicidad 2, ¿es el factor $(x - 3)^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, se eleva a 2.'
  - titulo: 'Raíz cero'
    enunciado: 'Para raíz $r = 0$, ¿es el factor el monomio $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(x - 0) = x$.'
  - titulo: 'Coeficiente principal'
    enunciado: 'Para $a = -2$ y raíces 1 y 5, ¿es el polinomio $-2(x - 1)(x - 5)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $-2(x-1)(x-5)$.'
errores_frecuentes:
  - 'La elevación de los factores binómicos a sus correspondientes multiplicidades algebraicas no es ejecutada.'
  - 'El coeficiente principal an no es escrito multiplicando al producto de binomios.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Conservar el mismo signo de la raíz en lugar de invertirlo dentro del paréntesis.'
  - 'El factor x correspondiente a la raíz nula r = 0 no es escrito.'
afirmaciones_verdaderas:
  - 'Dadas las raíces de un polinomio, su forma factorizada es $P(x) = a_n (x - r_1)^{m_1} (x - r_2)^{m_2} \dots (x - r_k)^{m_k}$.'
  - 'La multiplicidad $m_i$ representa el exponente al cual está elevado el factor binómico $(x - r_i)$.'
al_terminar_debes_poder: 'Reconstruir y factorizar polinomios a partir de la totalidad de sus raíces conocidas y su coeficiente principal.'
