resumen_inicial: La factorización por raíces reconstruye la expresión multiplicativa
  de un polinomio a partir del conocimiento explícito de todas sus raíces $r_1, r_2,
  \dots, r_n$ y su coeficiente principal $a_n$.
explicacion_simple: Si conocemos las soluciones o raíces de una ecuación polinomial,
  podemos escribir directamente el polinomio como el producto del coeficiente principal
  por cada bloque $(x - \text{raíz})$.
explicacion_formal: 'Sea $P(x) = a_n x^n + a_{n-1} x^{n-1} + \dots + a_0$ un polinomio
  de grado $n$ con coeficientes reales o complejos.


  Por el **Teorema Fundamental del Álgebra** y el Teorema del Factor, si $r_1, r_2,
  \dots, r_n$ son las $n$ raíces (contando multiplicidades) de $P(x)$, entonces la
  **Factorización Canónica por Raíces** se expresa como:


  $$P(x) = a_n (x - r_1)(x - r_2) \cdots (x - r_n)$$


  **Propiedad de Conjugación:**

  Si los coeficientes de $P(x)$ son reales y $z = a + bi$ es una raíz compleja no
  real, su conjugado $\bar{z} = a - bi$ es también una raíz de $P(x)$, generando un
  factor cuadrático irreducible real de la forma $(x^2 - 2ax + a^2 + b^2)$.'
definiciones_clave: '- **Factorización Canónica**: Representación única de un polinomio
  como producto de su coeficiente principal $a_n$ por sus factores lineales de la
  forma $(x - r_i)$.

  - **Coeficiente líder o principal ($a_n$)**: Coeficiente numérico que multiplica
  a la potencia de mayor grado $x^n$.'
propiedades_relaciones: '- **Construcción explícita**: Conocer las raíces no basta
  para determinar el polinomio de forma única; es imprescindible incluir el coeficiente
  líder $a_n$.'
ejemplo_guiado:
  enunciado: Reconstruya y factorice el polinomio de grado 3 cuyo coeficiente principal
    es $a_3 = 4$ y sus raíces son $r_1 = 1$, $r_2 = -2$ y $r_3 = \frac{1}{2}$.
  pasos:
  - 'Paso 1: Escribir cada raíz como un factor lineal $(x - r_i)$:

    - Para $r_1 = 1 \implies (x - 1)$.

    - Para $r_2 = -2 \implies (x - (-2)) = (x + 2)$.

    - Para $r_3 = \frac{1}{2} \implies (x - \frac{1}{2})$.'
  - 'Paso 2: Formar la estructura del producto con el coeficiente principal $a_3 =
    4$:

    $$P(x) = 4(x - 1)(x + 2)\left(x - \frac{1}{2}\right)$$'
  - 'Paso 3: Distribuir si se desea el factor $4$ en el término fraccionario: $4\left(x
    - \frac{1}{2}\right) = 2(2x - 1)$.'
  - 'Paso 4: Expresar la factorización final equivalente: $P(x) = 2(x - 1)(x + 2)(2x
    - 1)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma factorizada de un polinomio mónico de grado 2 cuyas
    raíces son $r_1 = 3$ y $r_2 = -5$?
  choices:
  - text: $P(x) = (x - 3)(x + 5)$
    is_correct: true
  - text: $P(x) = (x + 3)(x - 5)$
    is_correct: false
  - text: $P(x) = (x - 3)(x - 5)$
    is_correct: false
  - text: $P(x) = (x + 3)(x + 5)$
    is_correct: false
  explanation: Para un polinomio mónico ($a_2 = 1$), la expresión resultante es $P(x)
    = (x - 3)(x + 5)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un polinomio cuadrático tiene raíces $r_1 = 2$ y $r_2 = 4$, y cumple $P(0)
    = 24$. ¿Cuál es su coeficiente principal $a_2$?
  choices:
  - text: $a_2 = 3$
    is_correct: true
  - text: $a_2 = 2$
    is_correct: false
  - text: $a_2 = 4$
    is_correct: false
  - text: $a_2 = 6$
    is_correct: false
  explanation: 'Evaluando en $x = 0$: $P(0) = a_2(-2)(-4) = 8a_2 = 24 \implies a_2
    = 3$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las $n$ raíces $r_1, r_2, \dots, r_n$ del polinomio junto con
  sus multiplicidades.'
- 'Paso 2: Escribir cada factor de la forma $(x - r_i)$.'
- 'Paso 3: Multiplicar todos los factores lineales entre sí.'
- 'Paso 4: Multiplicar el producto completo por el coeficiente principal $a_n$ para
  obtener $P(x)$.'
errores_correccion: '- **Error 1: Omitir la multiplicación por el coeficiente principal
  $a_n$.** **Cómo corregirlo:** Anteponer siempre $a_n$ al producto de factores lineales.'
ejemplos:
- titulo: Factorización canónica a partir de raíces
  enunciado: Escriba la forma factorizada de un polinomio con $a_n = -2$ y raíces
    $0, 1, 3$.
  respuesta: $P(x) = -2x(x - 1)(x - 3)$
  solucion_pasos:
  - '1. Factores: $(x - 0) = x$, $(x - 1)$ y $(x - 3)$.'
  - '2. Multiplicar por $a_n = -2$: $P(x) = -2x(x - 1)(x - 3)$.'
- titulo: ¿Si un polinomio mónico de grado 2 tiene raíces $-1$ y $-1$ (doble), cuál
    es su forma factorizada?
  respuesta: $P(x) = (x + 1)^2$
  solucion_pasos:
  - '1. Factores: $(x - (-1))(x - (-1)) = (x + 1)(x + 1)$.'
  - '2. Forma factorizada: $(x + 1)^2$.'
- titulo: ¿Dos polinomios con las mismas raíces son necesariamente idénticos?
  respuesta: 'No'
  solucion_pasos:
  - No; pueden diferir por una constante multiplicativa no nula correspondiente a
    sus coeficientes principales $a_n$.
errores_frecuentes:
- Omisión del coeficiente principal $a_n$ al armar la representación multiplicativa.
- Inversión no justificada de los signos de las raíces en las estructuras $(x - r_i)$.
- Consideración de una raíz múltiple como si fuese una raíz simple única.
- Identificación errónea entre las raíces numéricas y los coeficientes de las potencias
  de $x$.
- Distribución del signo negativo del coeficiente principal dentro de todos los factores.
afirmaciones_verdaderas:
- Un polinomio de grado $n$ queda completamente determinado por sus $n$ raíces y su
  coeficiente principal $a_n$.
- Si $r$ es una raíz de multiplicidad $k$, el factor $(x - r)$ aparece elevado a la
  potencia $k$ en la factorización.
al_terminar_debes_poder: Al terminar serás capaz de construir y factorizar un polinomio
  a partir de sus raíces y su coeficiente principal.
