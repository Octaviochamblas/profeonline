procedimiento:
- 'Paso 1: Transforma cada raíz $r$ dada en un factor $(x - r)$.'
- 'Paso 2: Multiplica todos los factores entre sí.'
- 'Paso 3: Si te dan el coeficiente líder de $x^n$, colócalo multiplicando al frente
  de todo.'
- 'Paso 4: Si te piden la forma general, aplica distributiva múltiple para expandir
  los paréntesis.'
- 'Se invierten los signos: (x - 6) y (x - (-1)).'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en factorización polinomial a partir de raíces conocidas.
ejemplos:
- titulo: Construye un polinomio factorizado con raíces $1, 2$ y $3$
  enunciado: Construye un polinomio factorizado con raíces $1, 2$ y $3$.
  solucion_pasos:
  - 'Factores: $(x-1)$, $(x-2)$, $(x-3)$.'
  - 'Ensamblaje: $P(x) = (x-1)(x-2)(x-3)$.'
- titulo: Crea un polinomio cuadrático con raíz doble en -4.
  solucion_pasos:
  - Una raíz doble significa que el factor aparece dos veces. El factor es (x - (-4))
    = (x+4). Al repetirlo, es (x+4)^2.
- titulo: 'Respecto de «Factorización polinomial a partir de raíces conocidas»: ¿Describe
    adecuadamente'
  enunciado: 'Respecto de «Factorización polinomial a partir de raíces conocidas»:
    ¿Describe adecuadamente el concepto esta frase? «Si un polinomio tiene raíces
    $r_1, r_2, \dots, r_n$, su factorización completa se expresa como $P(x) = a(x
    - r_1)(x - r_2)\dots(x - r_n)$, donde ''$a$'' es un coeficiente líder (constante
    de ajuste de escala)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Si un polinomio tiene raíces
    $r_1, r_2, \dots, r_n$, su factorización completa se expresa como $P(x) = a(x
    - r_1)(x - r_2)\dots(x - r_n)$, donde ''$a$'' es un coeficiente líder (constante
    de ajuste de escala).'
- titulo: 'Respecto de «Factorización polinomial a partir de raíces conocidas»: ¿Se
    puede aceptar esta'
  enunciado: 'Respecto de «Factorización polinomial a partir de raíces conocidas»:
    ¿Se puede aceptar esta afirmación? «Olvidar cambiar el signo al meter la raíz
    en el paréntesis. (Ej: con raíz $3$, poner $(x+3)$ en lugar de $(x-3)$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Si un polinomio tiene raíces
    $r_1, r_2, \dots, r_n$, su factorización completa se expresa como $P(x) = a(x
    - r_1)(x - r_2)\dots(x - r_n)$, donde ''$a$'' es un coeficiente líder (constante
    de ajuste de escala).'
errores_frecuentes:
- 'Olvidar cambiar el signo al meter la raíz en el paréntesis. (Ej: con raíz $3$,
  poner $(x+3)$ en lugar de $(x-3)$).'
- Si te dan una raíz fraccionaria como $1/2$, escribir $(x - 1/2)$ está bien, pero
  es más elegante (y algebraicamente preferido) escribirlo como $(2x - 1)$ para evitar
  fracciones.
- $(x+6)(x-1)$.
- Para «Si el problema indica que el coeficiente de la variable de mayor grado (coeficiente
  principal o líder) es 3, ¿dónde se ubica en la factorización», la respuesta correcta
  es Se suma al final.
- Para «Si el problema indica que el coeficiente de la variable de mayor grado (coeficiente
  principal o líder) es 3, ¿dónde se ubica en la factorización», la respuesta correcta
  es Se eleva al cuadrado.
