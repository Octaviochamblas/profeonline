semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.CONVEXO
resumen_inicial: Un ángulo convexo es aquel cuya medida es estrictamente mayor que
  0° y menor que 180°, abarcando a la familia de los ángulos agudos, rectos y obtusos.
explicacion_simple: '![Ángulo Convexo](/static/img/nodos/angulo-convexo-con-medida-mayor-que-0-y-menor-que-180-intro.svg)


  "Convexo" es una gran familia que agrupa a todos los ángulos que miden menos que
  una línea recta (180°). Si tomas dos puntos cualquiera dentro de un ángulo convexo
  y trazas una línea entre ellos, esa línea queda siempre 100% atrapada dentro del
  ángulo.'
explicacion_formal: '### Definición formal

  Un ángulo $\angle AOB$ es **convexo** si su medida angular $\alpha$ satisface que
  el segmento que une cualquier par de puntos de su región interior está totalmente
  contenido dentro del ángulo:


  $$0^\circ < \mu(\angle AOB) < 180^\circ \iff \alpha \in (0^\circ, 180^\circ)$$


  $$\forall P, Q \in \operatorname{Región}(\angle AOB) \implies \overline{PQ} \subset
  \operatorname{Región}(\angle AOB)$$


  ### Desglose simbólico y geométrico

  - Subconjunto de convexos: Incluye a los ángulos agudos, rectos y obtusos.

  - Condición de convexidad topológica: No presenta entrantes ni dobleces hacia el
  interior.

  - Geometría escolar estándar: Salvo indicación expresa, en polígonos se trabaja
  con ángulos interiores convexos.


  ### Síntesis didáctica

  La convexidad es la propiedad geométrica que garantiza la estabilidad y convexidad
  de los polígonos regulares y triángulos euclidianos.'
definiciones_clave: '- **Ángulo convexo**: Ángulo con medida en el intervalo abierto
  $(0^\circ, 180^\circ)$.

  - **Conjunto convexo**: Región donde el segmento que une cualquier par de puntos
  interiores está completamente contenido en ella. '
propiedades_relaciones: '- **Subconjuntos**: Contiene a los ángulos agudos, rectos
  y obtusos: $\text{Convexos} = \text{Agudos} \cup \{\text{Recto}\} \cup \text{Obtusos}$.

  - **Polígonos convexos**: Un polígono es convexo si todos sus ángulos interiores
  son ángulos convexos ($<180^\circ$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Convexo](/static/img/nodos/angulo-convexo-con-medida-mayor-que-0-y-menor-que-180-ejemplos.svg)


    Un cuadrilátero tiene ángulos interiores que miden $60^\circ$, $110^\circ$, $90^\circ$
    y $100^\circ$. Clasifica cada uno en la categoría convexa/cóncava y determina
    si el polígono es convexo.'
  pasos:
  - 'Paso 1: Evaluar cada ángulo: $60^\circ < 180^\circ$, $110^\circ < 180^\circ$,
    $90^\circ < 180^\circ$ y $100^\circ < 180^\circ$.'
  - 'Paso 2: Comprobar que todos los ángulos son estrictamente mayores a $0^\circ$
    y menores a $180^\circ$.'
  - 'Paso 3: Concluir que los cuatro ángulos son convexos.'
  - 'Paso 4: Dado que todos sus ángulos interiores son convexos, el cuadrilátero es
    un polígono convexo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición define a la familia de los ángulos convexos?
  choices:
  - text: Medir estrictamente más de 0° y menos de 180°
    is_correct: true
  - text: Medir estrictamente más de 180° y menos de 360°
    is_correct: false
  - text: Medir exactamente 90°
    is_correct: false
  - text: Medir exactamente 360°
    is_correct: false
  explanation: La familia de ángulos convexos se define por medir estrictamente más
    de 0° y menos de 180°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuáles de las siguientes clases de ángulos pertenecen a la familia de
    los ángulos convexos?
  choices:
  - text: Los ángulos agudos, rectos y obtusos
    is_correct: true
  - text: Únicamente los ángulos obtusos
    is_correct: false
  - text: Los ángulos cóncavos y completos
    is_correct: false
  - text: Únicamente los ángulos llanos de 180°
    is_correct: false
  explanation: La familia convexa engloba a los ángulos agudos, rectos y obtusos.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Medir o identificar el valor de $\theta$ en grados.'
- 'Paso 2: Comprobar la desigualdad $0^\circ < \theta < 180^\circ$.'
- 'Paso 3: Clasificar como ángulo convexo (identificando si es agudo, recto u obtuso).'
errores_correccion: Recuerda que agudo, recto y obtuso son todos subconjuntos de los
  ángulos convexos.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Un ángulo de 150° es convexo?
  alternativas:
  - Sí, es un ángulo convexo (específicamente obtuso)
  - No, es un ángulo cóncavo
  - No, es un ángulo llano
  respuesta: Sí, es un ángulo convexo (específicamente obtuso)
  solucion_pasos:
  - 150° está entre 0° y 180°, por lo que es convexo (específicamente obtuso).
- titulo: Ejemplo 2
  enunciado: ¿Cuál de los siguientes ángulos NO es convexo?
  alternativas:
  - $200^\circ$
  - $45^\circ$
  - $90^\circ$
  respuesta: $200^\circ$
  solucion_pasos:
  - $200^\circ > 180^\circ$, por lo que es cóncavo y no convexo.
- titulo: ¿Un ángulo agudo es siempre convexo?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque todo ángulo agudo mide menos de 90°, lo cual está dentro del rango
    convexo (< 180°).
- titulo: ¿Un ángulo de 270° es convexo?
  respuesta: 'No'
  solucion_pasos:
  - No, 270° es mayor que 180°, por lo que es un ángulo cóncavo.
errores_frecuentes:
- Creer que "convexo" excluye a los ángulos agudos o rectos.
- Confundir ángulos convexos ($<180^\circ$) con ángulos cóncavos ($>180^\circ$).
- Incluir $180^\circ$ o $0^\circ$ como parte del intervalo abierto de convexos.
- Afirmar que un triángulo puede tener ángulos no convexos (todos los ángulos de un
  triángulo son convexos).
- Olvidar la definición geométrica de conjunto convexo en el plano.
afirmaciones_verdaderas:
- Los ángulos agudos, rectos y obtusos son ángulos convexos.
- Un ángulo convexo mide menos de $180^\circ$.
al_terminar_debes_poder: '**QUÉ:** Identificar, clasificar y agrupar ángulos en la
  categoría convexa ($0^\circ < \theta < 180^\circ$).


  **CÓMO:** Verificando la condición $0^\circ < \theta < 180^\circ$ y reconociendo
  sus subclases (agudos, rectos y obtusos).


  ![Resumen de Ángulo Convexo](/static/img/nodos/angulo-convexo-con-medida-mayor-que-0-y-menor-que-180-resumen.svg)'
