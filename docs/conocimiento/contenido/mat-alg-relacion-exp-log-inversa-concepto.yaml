semantic_id: MAT.ALG.RELACION_EXP_LOG.INVERSA_CONCEPTO
resumen_inicial: 'Reconocimiento de la función logarítmica como inversa de la función
  exponencial: conceptos, asíntotas, propiedades e inversidad en Relación de funciones
  inversas.'
explicacion_simple: Dos funciones son inversas cuando una deshace exactamente lo que
  hace la otra. La función logarítmica y la exponencial cumplen precisamente esa relación.
explicacion_formal: '### Definición formal


  Dos funciones $f$ y $g$ son inversas si $f(g(x))=x$ para todo $x$ del dominio de
  $g$, y $g(f(x))=x$ para todo $x$ del dominio de $f$. Para $g(x)=b^x$ y $f(x)=\log_b(x)$,
  ambas composiciones se cumplen, lo que confirma que son funciones inversas.


  ### Desarrollo didáctico


  Si $g(2)=b^2$, aplicar $f$ a ese resultado debe devolver $2$: $f(b^2)=\log_b(b^2)=2$.
  De la misma manera, si $f(x)=\log_b(x)$ da un resultado $y$, aplicar $g$ a $y$ devuelve
  el $x$ original: $g(y)=b^y=x$.'
definiciones_clave: '- **Reconocimiento de la función logarítmica como inversa de
  la función exponencial**: Concepto fundamental en el estudio del crecimiento/decaimiento
  exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a reconocimiento de la función logarítmica como inversa de la función
  exponencial.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de reconocimiento
    de la función logarítmica como inversa de la función exponencial.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de reconocimiento de la función
    logarítmica como inversa de la función exponencial.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    reconocimiento de la función logarítmica como inversa de la función exponencial?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en relación de funciones
      inversas
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en relación de funciones inversas. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en reconocimiento de la función logarítmica como inversa de la función exponencial?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica la función exponencial $g(x)=b^x$ y su base $b$.'
- 'Paso 2: Reconoce que su inversa es $f(x)=\log_b(x)$, con la misma base $b$.'
- 'Paso 3: Verifica la relación aplicando una función sobre el resultado de la otra.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en reconocimiento
  de la función logarítmica como inversa de la función exponencial.
ejemplos:
- titulo: Identificación de un par de funciones inversas
  enunciado: ¿Cuál es la función inversa de $g(x)=5^x$?
  solucion_pasos:
  - Se identifica la base $b=5$.
  - La función inversa es $f(x)=\log_5(x)$.
- titulo: Verificación de la relación inversa
  enunciado: Verifica que $f(x)=\log_2(x)$ y $g(x)=2^x$ son inversas evaluando en
    $x=3$.
  solucion_pasos:
  - Se calcula $g(3)=2^3=8$.
  - 'Se aplica $f$ al resultado: $f(8)=\log_2(8)=3$, recuperando el valor original.'
- titulo: ¿Toda función logarítmica tiene una función exponencial inversa?
  enunciado: ¿Toda función $f(x)=\log_b(x)$ tiene como inversa a una función exponencial
    con la misma base?
  respuesta: Sí
  solucion_pasos:
  - Por definición, $\log_b(x)$ y $b^x$ son siempre funciones inversas entre sí.
- titulo: ¿Pueden dos funciones logarítmicas de distinta base ser inversas entre sí?
  enunciado: ¿Puede $f(x)=\log_2(x)$ ser la inversa de $h(x)=\log_5(x)$?
  respuesta: 'No'
  solucion_pasos:
  - La inversa de una función logarítmica es siempre una función exponencial de igual
    base, no otra logarítmica.
errores_frecuentes:
- Suponer que la inversa de $\log_b(x)$ es otra función logarítmica en vez de una
  exponencial.
- Usar una base distinta para la función inversa.
- Declarar "función inversa" con "función recíproca" ($1/f(x)$).
- Omitir verificar la relación mediante composición para confirmar que efectivamente
  son inversas.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando reconocimiento de la función logarítmica como inversa de la función exponencial.
