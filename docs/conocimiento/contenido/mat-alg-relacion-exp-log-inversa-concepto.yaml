semantic_id: MAT.ALG.RELACION_EXP_LOG.INVERSA_CONCEPTO
resumen_inicial: 'La función logarítmica $f^{-1}(x) = \log_b(x)$ es la función inversa de la función exponencial $f(x) = b^x$, intercambiando de manera recíproca su dominio y su recorrido.'
explicacion_simple: |
  En matemáticas, dos funciones son inversas cuando una deshace exactamente lo que hace la otra. Si la función exponencial $f(x) = 2^x$ toma un 3 y lo convierte en un 8 ($2^3 = 8$), la función logarítmica $f^{-1}(x) = \log_2(x)$ toma ese 8 y nos devuelve el 3 original ($\log_2(8) = 3$). Debido a este intercambio perfecto, lo que era el conjunto de entradas (dominio) en una pasa a ser el conjunto de salidas (recorrido) en la otra.
explicacion_formal: |
  ### Definición formal
  Para una base fija $b \in \mathbb{R}^+ \setminus \{1\}$, la **relación de inversibilidad biyectiva** entre la función exponencial $f: \mathbb{R} \to \mathbb{R}^+$ dada por $f(x) = b^x$ y la función logarítmica $g: \mathbb{R}^+ \to \mathbb{R}$ dada por $g(x) = \log_b(x)$ se expresa analíticamente por las propiedades duplas de composición:
  1. $(g \circ f)(x) = \log_b(b^x) = x, \quad \forall x \in \mathbb{R}$.
  2. $(f \circ g)(x) = b^{\log_b(x)} = x, \quad \forall x \in \mathbb{R}^+$.

  ### Desglose de Intercambio de Dominios y Recorridos
  - Función Exponencial $f(x) = b^x$:
    - $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$
    - $\operatorname{Rec}(f) = ]0, +\infty[ = \mathbb{R}^+$
  - Función Logarítmica $g(x) = \log_b(x)$:
    - $\operatorname{Dom}(g) = \operatorname{Rec}(f) = ]0, +\infty[ = \mathbb{R}^+$
    - $\operatorname{Rec}(g) = \operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$

  ### Síntesis didáctica
  Regla de las coordenadas invertidas: Si el par cartesiano $(u, v)$ pertenece a la curva de la función exponencial $y = b^x$, entonces el par invertido $(v, u)$ pertenece obligatoriamente a la curva de la función logarítmica $y = \log_b(x)$.
definiciones_clave: |
  - **Función inversa $f^{-1}$**: Función que revierte la asignación de $f$ tal que $f^{-1}(f(x)) = x$.
  - **Intercambio recíproco de conjuntos**: Propiedad $\operatorname{Dom}(f^{-1}) = \operatorname{Rec}(f)$ y $\operatorname{Rec}(f^{-1}) = \operatorname{Dom}(f)$.
  - **Pares simétricos $(u, v) \leftrightarrow (v, u)$**: Inversión de coordenadas entre las gráficas de ambas funciones.
propiedades_relaciones: |
  - **Biyectividad estricta**: Tanto $f(x) = b^x$ como $g(x) = \log_b(x)$ son estrictamente monótonas e inyectivas, garantizando la existencia de su inversa en todo su dominio.
  - **Identidad funcional**: La composición de ambas funciones produce la función identidad $I(x) = x$.
ejemplo_guiado:
  enunciado: 'Dada la función exponencial $f(x) = 5^x$, determina su función inversa $f^{-1}(x)$, indica el dominio y recorrido de ambas funciones, y encuentra el punto correspondiente en $f^{-1}$ para la coordenada $(2, 25)$ de $f$.'
  pasos:
    - 'Paso 1: Para hallar la inversa de $y = 5^x$, despejamos $x$ aplicando logaritmo en base 5: $x = \log_5(y)$. Intercambiamos variables: $f^{-1}(x) = \log_5(x)$.'
    - 'Paso 2: Dominio y recorrido de $f(x) = 5^x$: $\operatorname{Dom}(f) = \mathbb{R}$, $\operatorname{Rec}(f) = ]0, +\infty[$.'
    - 'Paso 3: Dominio y recorrido de $f^{-1}(x) = \log_5(x)$: $\operatorname{Dom}(f^{-1}) = ]0, +\infty[$, $\operatorname{Rec}(f^{-1}) = \mathbb{R}$.'
    - 'Paso 4: Como el punto $(2, 25)$ pertenece a $f$ (pues $5^2 = 25$), el punto invertido $(25, 2)$ pertenece a $f^{-1}$ (pues $\log_5(25) = 2$).'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si $f(x) = 3^x$ es una función exponencial con dominio $\mathbb{R}$ y recorrido $]0, +\infty[$, ¿cuáles son el dominio y el recorrido de su función inversa $f^{-1}(x) = \log_3(x)$?'
    choices:
      - {text: 'Dominio $\operatorname{Dom}(f^{-1}) = ]0, +\infty[$ y Recorrido $\operatorname{Rec}(f^{-1}) = \mathbb{R}$', is_correct: true}
      - {text: 'Dominio $\operatorname{Dom}(f^{-1}) = \mathbb{R}$ y Recorrido $\operatorname{Rec}(f^{-1}) = ]0, +\infty[$', is_correct: false}
      - {text: 'Dominio $\operatorname{Dom}(f^{-1}) = \mathbb{R}$ y Recorrido $\operatorname{Rec}(f^{-1}) = \mathbb{R}$', is_correct: false}
      - {text: 'Dominio $\operatorname{Dom}(f^{-1}) = ]0, 3[$ y Recorrido $\operatorname{Rec}(f^{-1}) = ]3, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''Dominio $\operatorname{Dom}(f^{-1}) = ]0, +\infty[$ y Recorrido $\operatorname{Rec}(f^{-1}) = \mathbb{R}$''. Las funciones inversas intercambian de forma exacta sus conjuntos dominio y recorrido.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si el punto $(0, 1)$ pertenece a la gráfica de la función exponencial $f(x) = b^x$, ¿qué punto pertenece obligatoriamente a la gráfica de su función inversa $g(x) = \log_b(x)$?'
    choices:
      - {text: 'El punto de coordenadas $(1, 0)$', is_correct: true}
      - {text: 'El punto de coordenadas $(0, 0)$', is_correct: false}
      - {text: 'El punto de coordenadas $(-1, 0)$', is_correct: false}
      - {text: 'El punto de coordenadas $(1, 1)$', is_correct: false}
    explanation: 'La alternativa correcta es ''El punto de coordenadas $(1, 0)$''. Al ser funciones inversas, invierten sus pares ordenados $(x, y) \to (y, x)$, transformando el punto $(0, 1)$ en $(1, 0)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la función exponencial como $y = b^x$.'
  - 'Paso 2: Aplicar la definición de logaritmo para despejar la variable $x$: $x = \log_b(y)$.'
  - 'Paso 3: Intercambiar las variables $x$ e $y$ para obtener la expresión explícita de la función inversa $f^{-1}(x) = \log_b(x)$.'
  - 'Paso 4: Confirmar que el dominio de $f^{-1}$ coincide con el recorrido de $f$, y que el recorrido de $f^{-1}$ coincide con el dominio de $f$.'
errores_correccion: |
  - **Error 1:** Creer que la función inversa de $f(x) = 2^x$ es la función recíproca $g(x) = \frac{1}{2^x} = 2^{-x}$. **Cómo corregirlo:** La función recíproca $\frac{1}{f(x)}$ no es la función inversa $f^{-1}(x)$. La función inversa que deshace la potencia de base 2 es la función logarítmica $f^{-1}(x) = \log_2(x)$.
  - **Error 2:** Asumir que el dominio de la función logarítmica inversa son todos los números reales. **Cómo corregirlo:** El dominio de la inversa es el recorrido de la exponencial, el cual exige valores estrictamente positivos $]0, +\infty[$.
ejemplos:
  - titulo: 'Obtención de función inversa'
    enunciado: '¿Cuál es la función inversa de $f(x) = 10^x$?'
    alternativas:
      - '$f^{-1}(x) = \log(x)$'
      - '$f^{-1}(x) = 10^{-x}$'
      - '$f^{-1}(x) = \frac{1}{10^x}$'
    respuesta: '$f^{-1}(x) = \log(x)$'
    solucion_pasos:
      - '1. De $y = 10^x$ despejamos $x = \log_{10}(y)$.'
      - '2. Intercambiamos variables: $f^{-1}(x) = \log(x)$.'
  - titulo: 'Inversa del logaritmo natural'
    enunciado: '¿La función inversa de $g(x) = \ln(x)$ es la función exponencial $g^{-1}(x) = e^x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. De $y = \ln(x) = \log_e(x)$ despejamos $x = e^y \implies g^{-1}(x) = e^x$.'
  - titulo: 'Inversión de pares cartesiano'
    enunciado: 'Si $f(3) = 8$ en $f(x) = 2^x$, ¿$f^{-1}(8) = 3$ en $f^{-1}(x) = \log_2(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La función inversa asigna al valor de salida 8 su preimagen original 3.'
  - titulo: 'Composición cancelatoria'
    enunciado: '¿La composición $f^{-1}(f(x)) = \log_b(b^x)$ devuelve exactamente el valor $x$ para todo $x \in \mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por definición de funciones inversas, $f^{-1}(f(x)) = x$.'
errores_frecuentes:
  - 'La función inversa de $f(x) = b^x$ se obtiene invirtiendo la fracción $\frac{1}{b^x}$.'
  - 'El dominio de la función logarítmica inversa es idéntico al dominio de la función exponencial.'
  - 'La función exponencial y la función logarítmica son dos funciones independientes sin relación algebraica entre sí.'
  - 'La imagen de $x = 0$ en la función inversa de $f(x) = 2^x$ es igual a 1.'
  - 'Si la función exponencial pasa por $(2, 9)$, su función inversa pasa por el punto $(-2, -9)$.'
afirmaciones_verdaderas:
  - 'La función logarítmica $f^{-1}(x) = \log_b(x)$ es la función inversa de la función exponencial $f(x) = b^x$.'
  - 'Las funciones inversas intercambian recíprocamente sus conjuntos dominio y recorrido, así como sus pares ordenados de coordenadas $(u, v) \leftrightarrow (v, u)$.'
