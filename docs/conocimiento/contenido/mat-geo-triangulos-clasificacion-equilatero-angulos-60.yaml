semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.EQUILATERO_ANGULOS_60
resumen_inicial: El triángulo equilátero es aquel que posee sus tres lados de igual
  longitud y sus tres ángulos interiores iguales a 60° exactamente.
explicacion_simple: Piensa en una señal de tránsito de 'Ceda el paso'. Sus tres lados
  miden exactamente lo mismo y sus tres esquinas interiores tienen la misma abertura
  de 60°.
explicacion_formal: 'Un triángulo $\triangle ABC$ es **equilátero** si $a = b = c$.
  Como consecuencia directa de la isoscelidad en sus tres pares de lados, es equiángulo:
  $\alpha = \beta = \gamma = 60^\circ$.'
definiciones_clave: '- **Triángulo equilátero**: Polígono regular de 3 lados congruentes
  ($a=b=c$).

  - **Equiángulo**: Figura cuyos ángulos interiores son todos iguales ($60^\circ$).'
propiedades_relaciones: '- **Ángulos de 60°**: Todo triángulo equilátero tiene tres
  ángulos interiores idénticos de $60^\circ$.

  - **Simetría máxima**: Posee 3 ejes de simetría axial coincidentes con sus tres
  alturas y bisectrices.'
ejemplo_guiado:
  enunciado: Una señal de tránsito en forma de triángulo equilátero tiene un perímetro
    de $180\text{ cm}$. Calcula la medida de cada uno de sus tres lados y de sus tres
    ángulos interiores.
  pasos:
  - 'Paso 1: Aplicar la definición de triángulo equilátero: sus 3 lados $a, b, c$
    son de igual medida.'
  - 'Paso 2: Dividir el perímetro entre 3: $\text{lado} = \frac{180}{3} = 60\text{
    cm}$.'
  - 'Paso 3: Concluir que cada lado mide $60\text{ cm}$ y que sus tres ángulos interiores
    miden $60^\circ$ cada uno.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto mide siempre cada ángulo interior de un triángulo equilátero?
  choices:
  - text: 60°
    is_correct: true
  - text: 90°
    is_correct: false
  - text: 45°
    is_correct: false
  - text: 120°
    is_correct: false
  explanation: La alternativa correcta es '60°', pues $180^\circ / 3 = 60^\circ$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la señal equilátera tiene un perímetro de 180 cm, ¿cuánto mide cada
    lado?
  choices:
  - text: 60 cm
    is_correct: true
  - text: 180 cm
    is_correct: false
  - text: 70 cm
    is_correct: false
  - text: 120 cm
    is_correct: false
  explanation: La alternativa correcta es '60 cm', dividiendo el perímetro entre 3.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados y el teorema geométrico del concepto.'
- 'Paso 2: Plantear la ecuación algebraica o relación correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar su coherencia geométrica.'
errores_correccion: Evita confundir las propiedades de los lados con las de los ángulos
  interiores al clasificar la figura.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo dos ángulos interiores miden 80° y 75°, ¿cuánto mide
    el tercero?
  alternativas:
  - 25°
  - 155°
  - 90°
  respuesta: 25°
  solucion_pasos:
  - Despejar $x = 180 - (80 + 75) = 25^\circ$.
- titulo: Ejemplo 2
  enunciado: Si dos lados de un triángulo miden 55 cm y 75 cm, ¿cuál puede ser la
    medida del tercer lado?
  alternativas:
  - 128 cm
  - 135 cm
  - 0 cm
  respuesta: 128 cm
  solucion_pasos:
  - Por Desigualdad Triangular, el tercer lado debe ser menor que 130 cm.
- titulo: ¿La suma de los tres ángulos interiores de cualquier triángulo en el plano
    es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental e invariante de la geometría euclidiana.
- titulo: ¿Un triángulo puede tener dos ángulos rectos de 90° en su interior?
  respuesta: 'No'
  solucion_pasos:
  - No, porque 90° + 90° = 180°, dejando 0° para el tercer ángulo, lo cual imposibilita
    cerrar la figura.
errores_frecuentes:
- Declarar la suma de ángulos interiores (180°) con la suma de ángulos exteriores
  (360°).
- Afirmar que un triángulo isósceles tiene sus tres lados iguales (eso corresponde
  al equilátero).
- Declarar que cualquier trío de medidas de varillas puede formar un triángulo sin
  verificar la Desigualdad Triangular.
- Declarar los catetos con la hipotenusa en triángulos rectángulos orientados en distintas
  posiciones.
- Omitir que en un triángulo equilátero cada uno de sus tres ángulos interiores mide
  exactamente 60°.
afirmaciones_verdaderas:
- La suma de los ángulos interiores de todo triángulo en el plano es siempre igual
  a 180°.
- En todo triángulo rectángulo, la hipotenusa es el lado de mayor longitud opuesto
  al ángulo recto.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar y calcular las
  propiedades de propiedad de los tres ángulos interiores de 60° en un triángulo equilátero
  resolviendo problemas geométricos con rigurosidad.
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Propiedades de Triángulos.
