semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.DELTA_POSITIVO
resumen_inicial: Cuando el discriminante es estrictamente positivo ($\Delta > 0$), la ecuación cuadrática posee exactamente dos soluciones reales y distintas ($x_1 \neq x_2$), lo que geométricamente representa dos puntos de corte de la parábola con el eje $X$.
explicacion_simple: "![Cuando el discriminante es estrictamente positivo ($\\Delta > 0$), la ecuación cuadrática posee exactamente dos soluciones reales y distintas ($x_1 \\neq x_2$), lo que geométricamente representa dos puntos de corte de la parábola con el eje $X$](/static/img/nodos/interpretacion-de-discriminante-positivo-como-dos-soluciones-reales-distintas-intro.svg)\n\n\nSi al calcular el discriminante obtienes un número positivo (por ejemplo $\\Delta = 25$ o $\\Delta = 8$):\n- Como $\\Delta > 0$, la raíz $\\sqrt{\\Delta}$ sí existe en los números reales y da un número mayor a cero.\n- Al sumar y restar esa raíz en la fórmula general ($x = \\frac{-b \\pm \\sqrt{\\Delta}}{2a}$), obtienes **dos resultados completamente distintos**:\n  - $x_1 = \\frac{-b + \\sqrt{\\Delta}}{2a}$\n  - $x_2 = \\frac{-b - \\sqrt{\\Delta}}{2a}$\n- **En el gráfico:** La parábola cruza el eje horizontal $X$ en dos lugares distintos: $(x_1, 0)$ y $(x_2, 0)$."
explicacion_formal: 'Sea $P(x) = ax^2 + bx + c = 0$ con $a \neq 0$. Si $\Delta = b^2 - 4ac > 0$, entonces $\sqrt{\Delta} \in \mathbb{R}^+$.


  **Propiedades topológicas y analíticas**:

  1. **Cardinalidad del conjunto solución**: $\text{Card}(\mathcal{S}) = 2$ con $\mathcal{S} = \{x_1, x_2\} \subset \mathbb{R}$.

  2. **Separación entre raíces**: $|x_1 - x_2| = \frac{\sqrt{\Delta}}{|a|} > 0$.

  3. **Cortes con el eje de las abscisas**: La función cuadrática $f(x) = ax^2 + bx + c$ satisface $f(x_1) = 0$ y $f(x_2) = 0$.

  4. **Teorema de Bolzano**: La función cuadrática cambia de signo en el intervalo $]x_1, x_2[$ respecto al exterior del intervalo.'
definiciones_clave: '- **Soluciones reales distintas**: Par de raíces $x_1, x_2 \in \mathbb{R}$ tales que $x_1 \neq x_2$.

  - **Puntos de corte con el eje X**: Coordenadas $(x_1, 0)$ y $(x_2, 0)$ donde la curva interseca la recta $y = 0$.'
propiedades_relaciones: '- **Racionales vs Irracionales**: Si $\Delta$ es cuadrado perfecto, $x_1, x_2 \in \mathbb{Q}$; si no lo es, $x_1, x_2 \in \mathbb{R} \setminus \mathbb{Q}$.

  - **Distancia al eje de simetría**: Cada solución dista $d = \frac{\sqrt{\Delta}}{2|a|}$ del vértice.'
ejemplo_guiado:
  enunciado: '![Ejemplo Cuando el discriminante es estrictamente positivo ($\Delta > 0$), la ecuación cuadrática posee exactamente dos soluciones reales y distintas ($x_1 \neq x_2$), lo que geométricamente representa dos puntos de corte de la parábola con el eje $X$](/static/img/nodos/interpretacion-de-discriminante-positivo-como-dos-soluciones-reales-distintas-ejemplos.svg)



    Determina el número de puntos de intersección con el eje X y la naturaleza de las raíces para la ecuación $2x^2 - 3x - 5 = 0$.'
  pasos:
  - 'Paso 1: Identificar coeficientes: $a = 2, b = -3, c = -5$.'
  - 'Paso 2: Calcular el discriminante: $\Delta = (-3)^2 - 4(2)(-5) = 9 + 40 = 49$.'
  - 'Paso 3: Interpretar el resultado: $\Delta = 49 > 0$ (positivo).'
  - 'Paso 4: Concluir analíticamente: La ecuación tiene dos soluciones reales distintas racionales ($x_1 = 5/2, x_2 = -1$).'
  - 'Paso 5: Concluir geométricamente: La parábola corta al eje X en dos puntos: $(5/2, 0)$ y $(-1, 0)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una ecuación cuadrática tiene discriminante Δ = 7, ¿cuántas soluciones reales tiene?
  choices:
  - text: Dos soluciones reales distintas (irracionales).
    is_correct: true
  - text: Ninguna, porque 7 no tiene raiz exacta.
    is_correct: false
  - text: Una sola solucion real.
    is_correct: false
  - text: Siete soluciones reales.
    is_correct: false
  explanation: La alternativa correcta es 'Dos soluciones reales distintas (irracionales).'. Todo $\Delta > 0$ garantiza dos soluciones reales distintas, sean racionales o irracionales.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Geométricamente, ¿qué significa que la ecuación cuadrática asociada a una parábola tenga Δ > 0?
  choices:
  - text: Que la parabola corta al eje X en dos puntos distintos.
    is_correct: true
  - text: Que la parabola es tangente al eje X.
    is_correct: false
  - text: Que la parabola no toca al eje X.
    is_correct: false
  - text: Que el vertice esta en el origen.
    is_correct: false
  explanation: La alternativa correcta es 'Que la parabola corta al eje X en dos puntos distintos.'. $\Delta > 0$ equivale a dos intersecciones reales.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el valor del discriminante $\Delta = b^2 - 4ac$.'
- 'Paso 2: Comprobar la condición $\Delta > 0$.'
- 'Paso 3: Afirmar la existencia de dos soluciones reales distintas en $\mathbb{R}$.'
- 'Paso 4: Identificar si son racionales ($\Delta$ cuadrado perfecto) o irracionales conjugadas.'
errores_correccion: '- **Error común:** Creer que si $\Delta$ no tiene raíz exacta (como $\Delta = 11$), no tiene soluciones reales.

  - **Cómo corregirlo:** Si $\Delta > 0$, **SIEMPRE tiene dos soluciones reales**, solo que son números irracionales con raíz (ej: $x = \frac{-b \pm \sqrt{11}}{2a}$).'
ejemplos:
- titulo: 'Ejemplo 1: Raíces enteras'
  enunciado: ¿Qué revela Δ en $x^2 - 7x + 12 = 0$?
  alternativas:
  - 'Δ = 1 > 0: Dos soluciones reales distintas (x = 3 y x = 4)'
  - 'Δ = 0: Una raíz doble'
  - 'Δ < 0: Sin raíces'
  - 'Δ = 49: Siete raíces'
  respuesta: 'Δ = 1 > 0: Dos soluciones reales distintas (x = 3 y x = 4)'
  solucion_pasos:
  - 'Paso 1: $\Delta = 49 - 48 = 1 > 0 \implies 2$ soluciones reales distintas.'
- titulo: 'Ejemplo 2: Raíces irracionales'
  enunciado: En $x^2 - 2x - 1 = 0$, ¿cómo son sus raíces?
  alternativas:
  - Dos soluciones reales distintas irracionales (Δ = 8)
  - No tiene soluciones reales
  - Una raíz doble en x = 1
  - Dos soluciones enteras
  respuesta: Dos soluciones reales distintas irracionales (Δ = 8)
  solucion_pasos:
  - 'Paso 1: $\Delta = 4 - 4(1)(-1) = 8 > 0$.'
- titulo: 'Ejemplo 3: Cortes en el eje X'
  enunciado: ¿Cuántas veces interseca la curva $y = 3x^2 - x - 2$ al eje horizontal?
  alternativas:
  - 2 veces
  - 1 vez
  - 0 veces
  - 3 veces
  respuesta: 2 veces
  solucion_pasos:
  - 'Paso 1: $\Delta = 1 - 4(3)(-2) = 25 > 0 \implies 2$ cortes.'
- titulo: 'Ejemplo 4: Coeficiente c negativo'
  enunciado: Si $a > 0$ y $c < 0$, ¿qué se puede asegurar del número de soluciones?
  alternativas:
  - Siempre tiene dos soluciones reales distintas
  - No tiene soluciones reales
  - Tiene una raíz doble
  - Depende de b
  respuesta: Siempre tiene dos soluciones reales distintas
  solucion_pasos:
  - 'Paso 1: $ac < 0 \implies -4ac > 0 \implies \Delta = b^2 + |4ac| > 0$.'
errores_frecuentes:
- Confundir raíces irracionales con inexistencia de soluciones reales.
- Asociar erróneamente Δ > 0 con que las raíces deban ser números positivos.
- Olvidar que la gráfica corta dos veces al eje X.
afirmaciones_verdaderas:
- Un discriminante positivo garantiza la existencia de dos raíces reales distintas.
- El signo positivo de Δ indica que la parábola corta al eje de las abscisas en dos puntos.
al_terminar_debes_poder: '**QUÉ:** Interpretar el caso Δ > 0 como la existencia de dos soluciones reales distintas.


  **CÓMO:** Reconociendo analíticamente las dos ramas de solución y geométricamente los dos puntos de corte con el eje X.


