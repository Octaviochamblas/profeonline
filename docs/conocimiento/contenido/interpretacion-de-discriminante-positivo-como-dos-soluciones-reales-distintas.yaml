semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.DELTA_POSITIVO
resumen_inicial: 'Interpretación de discriminante positivo como dos soluciones reales
  distintas: concepto, discriminante, soluciones y modelamiento en El discriminante
  y la naturaleza de las raíces.'
explicacion_simple: Cuando el discriminante resulta positivo, la raíz cuadrada que
  aparece en la fórmula general existe y no es cero, lo que abre paso a dos resultados
  diferentes.
explicacion_formal: '### Definición formal


  Cuando $\Delta>0$, la raíz cuadrada $\sqrt{\Delta}$ es un número real positivo distinto
  de cero. Al aplicar $x=\dfrac{-b\pm\sqrt{\Delta}}{2a}$, el signo $\pm$ genera dos
  valores distintos, ya que se suma y se resta una cantidad no nula.


  ### Desarrollo didáctico


  El signo positivo del discriminante es la señal directa de que existen exactamente
  dos puntos donde la parábola asociada corta al eje $x$.


  En $x^2-5x+6=0$, $\Delta=25-24=1>0$, por lo que hay dos soluciones reales distintas:
  $x=\dfrac{5\pm1}{2}$, es decir $x=3$ y $x=2$.'
definiciones_clave: '- **Interpretación de discriminante positivo como dos soluciones
  reales distintas**: Elemento o técnica fundamental en la resolución de ecuaciones
  cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en interpretación
  de discriminante positivo como dos soluciones reales distintas.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando interpretación de
    discriminante positivo como dos soluciones reales distintas.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a interpretación de discriminante
    positivo como dos soluciones reales distintas.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
