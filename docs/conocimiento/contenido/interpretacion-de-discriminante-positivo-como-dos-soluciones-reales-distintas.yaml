procedimiento:
- 'Paso 1: Calcula el discriminante $\Delta=b^2-4ac$.'
- 'Paso 2: Verifica que $\Delta>0$.'
- 'Paso 3: Concluye que existen dos soluciones reales distintas, sin necesidad de
  calcularlas aún.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en interpretación de discriminante positivo como dos soluciones reales distintas.
ejemplos:
- titulo: Interpretación con discriminante positivo
  enunciado: Sin resolver la ecuación, ¿cuántas soluciones reales tiene $3x^2+5x-2=0$
    si $\Delta=49$?
  solucion_pasos:
  - $\Delta=49>0$.
  - Tiene dos soluciones reales distintas.
- titulo: Verificación previa a resolver
  enunciado: Verifica si $x^2+2x-8=0$ tiene dos soluciones reales distintas.
  solucion_pasos:
  - $\Delta=2^2-4(1)(-8)=4+32=36$.
  - Como $\Delta=36>0$, tiene dos soluciones reales distintas.
- titulo: ¿Cuando $\Delta>0$, las dos soluciones son siempre números opuestos?
  enunciado: ¿Cuando $\Delta>0$, las dos soluciones son siempre números opuestos?
  respuesta: 'No'
  solucion_pasos:
  - Solo son opuestas en el caso particular en que $b=0$; en general son dos valores
    distintos cualesquiera.
- titulo: ¿Un discriminante positivo garantiza que la parábola corta al eje $x$ en
    dos puntos?
  enunciado: ¿Un discriminante positivo garantiza que la parábola corta al eje $x$
    en dos puntos?
  respuesta: Sí
  solucion_pasos:
  - Las dos soluciones reales corresponden exactamente a los dos puntos de intersección
    con el eje $x$.
errores_frecuentes:
- Concluir "dos soluciones" sin verificar realmente que $\Delta$ sea estrictamente
  mayor que cero.
- Confundir "dos soluciones distintas" con "dos soluciones iguales" (que corresponde
  a $\Delta=0$).
- Olvidar el signo $\pm$ al calcular explícitamente ambas soluciones tras confirmar
  $\Delta>0$.
- Asumir que ambas soluciones son siempre positivas o siempre de igual signo.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando interpretación
  de discriminante positivo como dos soluciones reales distintas.
