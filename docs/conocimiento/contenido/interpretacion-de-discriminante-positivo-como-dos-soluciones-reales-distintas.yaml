semantic_id: MAT.ALG.EC_CUADR_DISCRIMINANTE.DELTA_POSITIVO
resumen_inicial: La interpretación de discriminante positivo ($\Delta > 0$) asegura la existencia de exactamente dos soluciones reales y distintas ($x_1 \neq x_2$).
explicacion_simple: |
  Cuando el discriminante de una ecuación cuadrática da un número **estrictamente mayor que cero** ($\Delta > 0$):

  - La raíz del discriminante $\sqrt{\Delta}$ es un número real positivo perfectamente definido.
  - Al aplicar el signo $\pm$ en la fórmula general:
    - Con $+$ obtienes una primera solución real: $x_1 = \frac{-b + \sqrt{\Delta}}{2a}$.
    - Con $-$ obtienes una segunda solución real diferente: $x_2 = \frac{-b - \sqrt{\Delta}}{2a}$.
  - **Conclusión**: La ecuación tiene **DOS SOLUCIONES REALES DISTINTAS** ($x_1 \neq x_2$).
  - **Geometría**: La gráfica de la parábola **corta al eje $X$ en dos puntos diferentes**.
explicacion_formal: |
  Sea la ecuación cuadrática $ax^2 + bx + c = 0$ con $a \neq 0$. Si el discriminante satisface la desigualdad escalar estricta $\Delta = b^2 - 4ac > 0$:

  1. **Existencia y Distinción en $\mathbb{R}$:**
     Existen dos raíces reales $x_1, x_2 \in \mathbb{R}$ tales que $x_1 \neq x_2$:
     $$x_1 = \frac{-b + \sqrt{\Delta}}{2a} \quad \text{y} \quad x_2 = \frac{-b - \sqrt{\Delta}}{2a}$$

  2. **Intersección Bipuntual en la Gráfica:**
     La curva parabólica de la función $f(x) = ax^2 + bx + c$ se interseca con el eje horizontal en los dos puntos de corte $(x_1, 0)$ y $(x_2, 0)$, siendo la distancia entre las raíces igual a $\frac{\sqrt{\Delta}}{|a|}$.
definiciones_clave: |
  - **Raíces reales distintas**: Dos soluciones numéricamente diferentes $x_1 \neq x_2$ pertenecientes al conjunto de los números reales $\mathbb{R}$, producidas por un discriminante $\Delta > 0$.
propiedades_relaciones: |
  - **Distancia entre interceptos**: La distancia euclidiana entre los dos puntos donde la parábola interseca al eje $X$ viene dada por la expresión $|x_1 - x_2| = \frac{\sqrt{\Delta}}{|a|}$.
ejemplo_guiado:
  enunciado: 'Verifica la naturaleza de las soluciones de la ecuación $x^2 - 5x + 4 = 0$ a través de su discriminante.'
  pasos:
    - 'Paso 1: Extraer coeficientes: $a = 1$, $b = -5$, $c = 4$.'
    - 'Paso 2: Calcular el discriminante: $\Delta = (-5)^2 - 4(1)(4) = 25 - 16 = 9$.'
    - 'Paso 3: Identificar que $\Delta = 9 > 0$.'
    - 'Paso 4: Concluir que la ecuación posee dos soluciones reales y distintas ($x_1 = 4$ y $x_2 = 1$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad cumple la gráfica de una función cuadrática cuando su discriminante es mayor que cero ($\Delta > 0$)?'
    choices:
      - {text: 'Interseca al eje $X$ en dos puntos reales distintos.', is_correct: true}
      - {text: 'No interseca al eje $X$ en ningún punto.', is_correct: false}
      - {text: 'Es tangente al eje $X$ únicamente en el origen.', is_correct: false}
      - {text: 'Se convierte en una línea recta horizontal.', is_correct: false}
    explanation: 'La alternativa correcta es ''Interseca al eje $X$ en dos puntos reales distintos.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Al obtener un discriminante de $\Delta = 25$ en una ecuación de segundo grado, ¿cuántas soluciones reales distintas tiene?'
    choices:
      - {text: 'Tiene exactamente 2 soluciones reales distintas.', is_correct: true}
      - {text: 'Tiene 1 única solución real doble.', is_correct: false}
      - {text: 'No tiene ninguna solución en los reales.', is_correct: false}
      - {text: 'Tiene 25 soluciones reales.', is_correct: false}
    explanation: 'La alternativa correcta es ''Tiene exactamente 2 soluciones reales distintas.''. Al ser $\Delta = 25 > 0$, existen 2 soluciones reales diferentes.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Calcular el valor numérico del discriminante $\Delta = b^2 - 4ac$.'
  - 'Paso 2: Comprobar la estricta positividad del resultado ($\Delta > 0$).'
  - 'Paso 3: Extraer la raíz cuadrada $\sqrt{\Delta} > 0$.'
  - 'Paso 4: Concluir que existen dos raíces reales y diferentes $x_1 \neq x_2$ formando el conjunto solución $S = \{x_1, x_2\}$.'
errores_correccion: |
  - **Error común:** Concluir que si $\Delta > 0$, las dos soluciones deben ser números positivos.
  - **Cómo corregirlo:** El signo de $\Delta > 0$ indica que las soluciones **SON DISTINTAS Y REALES**, pero sus signos individuales dependen de los coeficientes $a$, $b$ y $c$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Discriminante positivo cuadrado perfecto.
    alternativas:
      - '$S = \{-1, 5\}$ (2 soluciones distintas)'
      - '$S = \{2\}$'
      - '$\emptyset$'
    respuesta: '$S = \{-1, 5\}$ (2 soluciones distintas)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Discriminante positivo no cuadrado perfecto.
    alternativas:
      - '$S = \{2 \pm \sqrt{3}\}$ (2 soluciones reales irracionales distintas)'
      - '$S = \{2\}$'
      - '$\emptyset$'
    respuesta: '$S = \{2 \pm \sqrt{3}\}$ (2 soluciones reales irracionales distintas)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Deducir que un discriminante positivo $\Delta > 0$ garantiza que ambas soluciones $x_1$ y $x_2$ sean números positivos.'
  - 'La equiparación entre las dos soluciones reales distintas de un discriminante positivo y una solución doble.'
  - 'La suposición de que si $\Delta > 0$ no es un cuadrado perfecto, la ecuación carece de soluciones reales.'
  - 'Afirmar que una parábola con $\Delta > 0$ solo interseca al eje $X$ si abre hacia arriba ($a > 0$).'
  - 'Evaluar las raíces de la ecuación sumando únicamente $\sqrt{\Delta}$ y omitiendo la resta del signo $\pm$.'
afirmaciones_verdaderas:
  - 'Un discriminante strictly positivo ($\Delta > 0$) garantiza que la ecuación cuadrática posee exactamente dos soluciones reales y distintas ($x_1 \neq x_2$).'
  - 'Geométricamente, $\Delta > 0$ se traduce en dos puntos de corte distintos entre la curva parabólica y el eje de las abscisas.'
al_terminar_debes_poder: |
  QUÉ: Interpretar el significado de un discriminante positivo ($\Delta > 0$) en ecuaciones de segundo grado.
  CÓMO: Verificar $\Delta > 0$, deducir la existencia de dos raíces reales distintas $x_1 \neq x_2$ e identificar los dos puntos de corte con el eje $X$.
