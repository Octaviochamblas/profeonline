semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.RESTRICCION_ALEACION
resumen_inicial: El modelamiento de aleaciones utiliza inecuaciones de masa para garantizar la pureza de metales o materiales sólidos.
explicacion_simple: '![Modelamiento de restricciones de aleaciones mediante desigualdades](/static/img/nodos/modelamiento-de-restricciones-de-aleaciones-mediante-desigualdades-intro.svg)


  Al fundir y mezclar metales (como oro, cobre o plata) para crear una **aleación**:

  Multiplicamos la masa de cada lingote por su porcentaje de pureza para obtener la cantidad de metal precioso puro.

  La inecuación exige que el porcentaje de ley de la aleación resultante cumpla con el estándar mínimo requerido (por ejemplo, tener al menos $18\text{ quilates}$ u $80\%$ de pureza).'
explicacion_formal: 'Dadas dos masas de metales $m_1$ y $m_2$ con leyes o purezas de metal precioso $p_1$ y $p_2$, el **modelo de ley de aleación** $P_{\text{ley}}$ establece:


  $$\frac{p_1 m_1 + p_2 m_2}{m_1 + m_2} \ge P_{\text{ley}}$$


  **Desglose de la fórmula:**

  - $p_1 m_1 + p_2 m_2$: Masa total de metal precioso puro en la aleación fundida.

  - $m_1 + m_2$: Masa total del bloque metálico resultante.

  '
definiciones_clave: '- **Ley de una aleación**: Proporción en peso de metal fino o precioso contenida en la masa total de la aleación.

  - **Inecuación de aleación**: Desigualdad que garantiza una ley metálica mínima o máxima en la fundición.

  '
propiedades_relaciones: '- **Conservación de masa metálica**: La masa de fino no cambia durante el proceso de fundición.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Modelamiento de restricciones de aleaciones mediante desigualdades](/static/img/nodos/modelamiento-de-restricciones-de-aleaciones-mediante-desigualdades-ejemplos.svg)


    Se tienen $600\text{ gramos}$ de una aleación de oro al $70\%$ de pureza. ¿Cuántos gramos $x$ de oro puro al $100\%$ se deben fundir junto a ella para lograr una aleación de al menos el $80\%$ de pureza?'
  pasos:
  - 'Paso 1: Expresar el oro fino inicial: $0{,}70 \cdot 600 = 420\text{ gramos}$.'
  - 'Paso 2: Expresar el oro fino agregado: $1{,}00 \cdot x = x\text{ gramos}$.'
  - 'Paso 3: Formular la inecuación de ley: $\frac{420 + x}{600 + x} \ge 0{,}80$.'
  - 'Paso 4: Multiplicar por $(600 + x) > 0$: $420 + x \ge 0{,}8(600 + x) \implies 420 + x \ge 480 + 0{,}8x$.'
  - 'Paso 5: Despejar $x$: $0{,}2x \ge 60 \implies x \ge \frac{60}{0{,}2} = 300\text{ gramos}$.'
  - 'Paso 6: Concluir que se deben fundir al menos $300\text{ gramos}$ de oro puro.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver la inecuación de aleación de oro $420 + x \ge 480 + 0{,}8x$, ¿cuál es la masa mínima de oro puro $x$ a fundir?
  choices:
  - text: $300\text{ gramos}$
    is_correct: true
  - text: $600\text{ gramos}$
    is_correct: false
  - text: $150\text{ gramos}$
    is_correct: false
  - text: $480\text{ gramos}$
    is_correct: false
  explanation: La alternativa correcta es '$300\text{ gramos}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa la expresión $420 + x$ en el numerador de la inecuación?
  choices:
  - text: La masa total de oro puro fino contenida en la mezcla.
    is_correct: true
  - text: El peso de todo el bloque de metal.
    is_correct: false
  - text: El volumen de agua desplazado.
    is_correct: false
  - text: El costo del lingote.
    is_correct: false
  explanation: La alternativa correcta es 'La masa total de oro puro fino contenida en la mezcla.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la masa de fino multiplicando la masa inicial por su ley.'
- 'Paso 2: Sumar la masa de fino del ingrediente adicionado.'
- 'Paso 3: Dividir entre la masa total sumada y comparar con la ley mínima requerida.'
- 'Paso 4: Despejar la variable $x$.'
errores_correccion: '- **Error común:** Olvidar que la masa agregada $x$ debe sumarse tanto en el numerador (fino) como en el denominador (masa total).

  - **Cómo corregirlo:** La variable $x$ afecta a la masa fina Y TAMBIÉN a la masa total de la aleación en el denominador.

  '
ejemplos:
- titulo: 'Ejemplo 1: Balance de metal fino'
  enunciado: Se tienen $200\text{ g}$ de oro de ley $0,750$ y se agregan $x\text{ g}$ de oro puro (ley $1,000$). ¿Cuál es la expresión de la masa fina total?
  alternativas:
  - $0,750(200) + 1,000x = 150 + x$
  - $200 + x$
  - $0,750(200) + 0,750x$
  - $150 + 0,750x$
  respuesta: $0,750(200) + 1,000x = 150 + x$
  solucion_pasos:
  - 'Paso 1: Masa fina inicial = $0,750 \cdot 200 = 150\text{ g}$.'
  - 'Paso 2: Masa fina agregada = $1,000 \cdot x = x\text{ g}$.'
  - 'Paso 3: Total = $150 + x$.'
- titulo: 'Ejemplo 2: Planteamiento de ley mínima'
  enunciado: Para que la mezcla anterior tenga una ley de al menos $0,900$, ¿qué inecuación se debe resolver?
  alternativas:
  - $\frac{150 + x}{200 + x} \geq 0,900$
  - $\frac{150 + x}{200 + x} \leq 0,900$
  - $\frac{150}{200 + x} \geq 0,900$
  - $\frac{x}{200 + x} \geq 0,900$
  respuesta: $\frac{150 + x}{200 + x} \geq 0,900$
  solucion_pasos:
  - 'Paso 1: Ley = Masa fina total / Masa total.'
  - 'Paso 2: $\frac{150 + x}{200 + x} \ge 0,900$.'
- titulo: 'Ejemplo 3: Resolución del balance de oro'
  enunciado: Resolviendo $\frac{150 + x}{200 + x} \geq 0,900$, ¿cuántos gramos de oro puro se deben fundir como mínimo?
  alternativas:
  - $300\text{ g}$
  - $150\text{ g}$
  - $200\text{ g}$
  - $100\text{ g}$
  respuesta: $300\text{ g}$
  solucion_pasos:
  - 'Paso 1: $150 + x \ge 0,900(200 + x) = 180 + 0,90x$.'
  - 'Paso 2: $0,10x \ge 30 \implies x \ge 300\text{ g}$.'
- titulo: 'Ejemplo 4: Ley de cobre en plata'
  enunciado: Si se mezcla plata pura (ley $1,000$) con metal común (ley $0,000$), ¿qué representa la ley $0,000$?
  alternativas:
  - Aporte cero de metal precioso (todo es metal base)
  - Aporte del $100\%$
  - Una ley indeterminada
  - Plata esterlina
  respuesta: Aporte cero de metal precioso (todo es metal base)
  solucion_pasos:
  - 'Paso 1: El metal base (cobre) no contiene plata.'
  - 'Paso 2: Su ley respecto a la plata es $0,000$.'
errores_frecuentes:
- En una mezcla de metales, el porcentaje de cobre en la aleación final se calcula sumando directamente los porcentajes de los componentes.
- Modelar la pureza mínima de una aleación al combinar $x$ gramos de metal al $40\%$ con $100$ gramos al $70\%$ se expresa como $0{,}40x + 0{,}70(100) \le 0{,}50(x + 100)$.
- La cantidad de masa total en una mezcla de aleaciones no influye en la concentración porcentual resultante.
- Exigir una concentración de oro "de al menos el $60\%$" se modela algebraicamente mediante el operador estricto $< 0{,}60$.
- En aleaciones de metales no aplica el principio de conservación de la masa total de la mezcla.
afirmaciones_verdaderas:
- El modelamiento de aleaciones relaciona la suma de las masas puras de cada componente con el porcentaje total ponderado de la mezcla final.
- La inecuación de aleación de masa total $x + m_2$ con concentración requerida $c$ adopta la forma $c_1 x + c_2 m_2 \ge c (x + m_2)$.
al_terminar_debes_poder: '**QUÉ:** Modelar problemas de aleaciones metálicas mediante desigualdades.


  **CÓMO:** Calculando la proporción de metal fino $\frac{\ell_1 M_1 + \ell_2 x}{M_1 + x} \ge \ell_{\min}$ para garantizar que la ley de la aleación cumpla el estándar exigido.


  ![Resumen Modelamiento de restricciones de aleaciones mediante desigualdades](/static/img/nodos/modelamiento-de-restricciones-de-aleaciones-mediante-desigualdades-resumen.svg)'
