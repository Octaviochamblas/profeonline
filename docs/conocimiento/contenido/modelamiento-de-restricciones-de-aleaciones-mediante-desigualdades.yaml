semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.RESTRICCION_ALEACION
resumen_inicial: 'Modelamiento de restricciones de aleaciones mediante desigualdades:
  relaciones de orden, intervalos y resolución en Modelamiento con desigualdades.'
explicacion_simple: En problemas de aleaciones no siempre se pide una proporción exacta.
  Con frecuencia se exige que un metal no baje de cierto porcentaje o que una impureza
  no supere un máximo permitido.
explicacion_formal: '### Definición formal

  Si una aleación contiene una cantidad de componente controlado $C(x)$ y una masa
  total $T(x)$, una condición de pureza o composición se representa mediante una desigualdad
  del tipo


  $\frac{C(x)}{T(x)} \leq p \qquad \text{o} \qquad$ \frac{C(x)}{T(x)}$ \geq p,$


  donde $p$ es la proporción exigida y $T(x)>0$. En muchos problemas escolares esta
  relación puede transformarse en una desigualdad lineal equivalente después de eliminar
  el denominador.


  ### Desarrollo didáctico

  En una aleación importa la relación entre una parte y el total final, no solo la
  cantidad aislada que se agrega. Por eso, al modelar, el paso decisivo es construir
  correctamente el numerador y el denominador. Frases como “al menos 60% de cobre”
  o “no más de 15% de impureza” indican si la comparación debe hacerse con una cota
  mínima o máxima.'
definiciones_clave: '- **Modelamiento de restricciones de aleaciones mediante desigualdades**:
