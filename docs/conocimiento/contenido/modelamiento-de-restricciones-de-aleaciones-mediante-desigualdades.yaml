procedimiento:
- Identificar qué metal, impureza o componente está siendo controlado por la restricción.
- Expresar la masa de ese componente en función de la variable del problema.
- Expresar la masa total final de la aleación.
- Construir la razón entre componente controlado y masa total, y compararla con la
  proporción dada.
- Simplificar la desigualdad obtenida y revisar si refleja con precisión la condición
  contextual.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en modelamiento de restricciones
  de aleaciones mediante desigualdades.
ejemplos:
- titulo: Aleación con mínimo de cobre
  enunciado: Se agregan $x$ kg de cobre puro a una aleación de $10$ kg que ya contiene
    $4$ kg de cobre. Si la nueva aleación debe tener al menos $50\%$ de cobre, plantea
    la desigualdad.
  solucion_pasos:
  - La masa de cobre después de agregar es $4+x$.
  - La masa total final es $10+x$.
  - La condición “al menos $50\%$” se modela como $\frac{4+x}{10+x} \geq 0.50$.
- titulo: Aleación con máximo de impureza
  enunciado: Una mezcla tiene $3$ kg de impureza y $17$ kg de metal útil. Se agregan
    $x$ kg de metal puro. Si la proporción de impureza no debe superar el $12\%$,
    modela la condición.
  solucion_pasos:
  - La masa de impureza se mantiene en $3$ kg.
  - La masa total final pasa a ser $20+x$.
  - La restricción “no debe superar el $12\%$” se expresa como $\frac{3}{20+x} \leq
    0.12$.
- titulo: ¿En una aleación la proporción se calcula respecto del total final y no
    solo del material agregado?
  respuesta: Sí
  solucion_pasos:
  - La pureza o composición se mide sobre la mezcla completa.
  - Por eso el denominador debe representar el total final de la aleación.
- titulo: ¿Una condición de “al menos $70\%$ de plata” se modela con $\leq 0.70$?
  respuesta: false
  solucion_pasos:
  - “Al menos $70\%$” significa $70\%$ o más.
  - La desigualdad correcta debe ser de tipo $\geq 0.70$.
errores_frecuentes:
- Usar como total solo la masa agregada y no la masa final de la aleación.
- Convertir mal un porcentaje a número decimal.
- Plantear una igualdad exacta cuando el problema habla de mínimo o máximo.
- Asociar la restricción al componente equivocado del problema.
- Sacar conclusiones desde la masa absoluta del metal sin compararla con la masa total.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_poder: Resolver e interpretar inecuaciones e intervalos utilizando
