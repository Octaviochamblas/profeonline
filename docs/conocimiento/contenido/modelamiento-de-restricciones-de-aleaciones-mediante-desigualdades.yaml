semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.RESTRICCION_ALEACION
resumen_inicial: El modelamiento de aleaciones utiliza inecuaciones de masa para garantizar
  la pureza de metales o materiales sólidos.
explicacion_simple: 'Al fundir y mezclar metales (como oro, cobre o plata) para crear
  una **aleación**:

  Multiplicamos la masa de cada lingote por su porcentaje de pureza para obtener la
  cantidad de metal precioso puro.

  La inecuación exige que el porcentaje de ley de la aleación resultante cumpla con
  el estándar mínimo requerido (por ejemplo, tener al menos $18\text{ quilates}$ u
  $80\%$ de pureza).'
explicacion_formal: 'Dadas dos masas de metales $m_1$ y $m_2$ con leyes o purezas
  de metal precioso $p_1$ y $p_2$, el **modelo de ley de aleación** $P_{\text{ley}}$
  establece:


  $$\frac{p_1 m_1 + p_2 m_2}{m_1 + m_2} \ge P_{\text{ley}}$$


  **Desglose de la fórmula:**

  - $p_1 m_1 + p_2 m_2$: Masa total de metal precioso puro en la aleación fundida.

  - $m_1 + m_2$: Masa total del bloque metálico resultante.'
definiciones_clave: '- **Ley de una aleación**: Proporción en peso de metal fino o
  precioso contenida en la masa total de la aleación.

  - **Inecuación de aleación**: Desigualdad que garantiza una ley metálica mínima
  o máxima en la fundición.'
propiedades_relaciones: '- **Conservación de masa metálica**: La masa de fino fino
  no cambia durante el proceso de fundición.'
ejemplo_guiado:
  enunciado: Se tienen $600\text{ gramos}$ de una aleación de oro al $70\%$ de pureza.
    ¿Cuántos gramos $x$ de oro puro al $100\%$ se deben fundir junto a ella para lograr
    una aleación de al menos el $80\%$ de pureza?
  pasos:
  - 'Paso 1: Expresar el oro fino inicial: $0{,}70 \cdot 600 = 420\text{ gramos}$.Paso
    2: Expresar el oro fino agregado: $1{,}00 \cdot x = x\text{ gramos}$.Paso 3: Formular
    la inecuación de ley: $\frac{420 + x}{600 + x} \ge 0{,}80$.Paso 4: Multiplicar
    por $(600 + x) > 0$: $420 + x \ge 0{,}8(600 + x) \implies 420 + x \ge 480 + 0{,}8x$.Paso
    5: Despejar $x$: $0{,}2x \ge 60 \implies x \ge \frac{60}{0{,}2} = 300\text{ gramos}$.Paso
    6: Concluir que se deben fundir al menos $300\text{ gramos}$ de oro puro.'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver la inecuación de aleación de oro $420 + x \ge 480 + 0{,}8x$,
    ¿cuál es la masa mínima de oro puro $x$ a fundir?
  choices:
  - text: $300\text{ gramos}$
    is_correct: true
  - text: $600\text{ gramos}$
    is_correct: false
  - text: $150\text{ gramos}$
    is_correct: false
  - text: $480\text{ gramos}$
    is_correct: false
  explanation: La alternativa correcta es '$300\text{ gramos}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué representa la expresión $420 + x$ en el numerador de la inecuación?
  choices:
  - text: La masa total de oro puro fino contenida en la mezcla.
    is_correct: true
  - text: El peso de todo el bloque de metal.
    is_correct: false
  - text: El volumen de agua desplazado.
    is_correct: false
  - text: El costo del lingote.
    is_correct: false
  explanation: La alternativa correcta es 'La masa total de oro puro fino contenida
    en la mezcla.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la masa de fino multiplicando la masa inicial por su ley.'
- 'Paso 2: Sumar la masa de fino del ingrediente adicionado.'
- 'Paso 3: Dividir entre la masa total sumada y comparar con la ley mínima requerida.'
- 'Paso 4: Despejar la variable $x$.'
errores_correccion: '- **Error común:** Olvidar que la masa agregada $x$ debe sumarse
  tanto en el numerador (fino) como en el denominador (masa total).

  - **Cómo corregirlo:** La variable $x$ afecta a la masa fina Y TAMBIÉN a la masa
  total de la aleación en el denominador.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento con desigualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Frases como 'como máximo' se traducen con la desigualdad no estricta \\le?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'como máximo' fija un límite superior inclusivo ($\\le$).
- titulo: ¿Es necesario descartar soluciones negativas al modelar magnitudes físicas
    reales como masa o personas?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el dominio físico impone restricciones de no negatividad ($x \\ge 0$).
errores_frecuentes:
- Usar el signo igual (=) en lugar de una desigualdad al modelar restricciones contextuales
  de límites máximos o mínimos.
- Sumar directamente porcentajes de concentración o aleación en lugar de calcular
  las masas de componente puro.
- Olvidar que la masa o volumen agregado afecta tanto al numerador (fino) como al
  denominador (total) de la mezcla.
- Redondear soluciones discretas en la dirección contraria a la exigida por la inecuación
  de restricción.
- Aceptar soluciones matemáticas negativas en problemas que involucran variables físicas
  reales como tiempo, masa o personas.
afirmaciones_verdaderas:
- Al modelar restricciones de presupuesto o capacidad máxima se deben emplear desigualdades
  del tipo $M(x) \le K$.
- El conjunto solución matemáticamente obtenido debe filtrarse con el dominio físico
  real descartando valores negativos o incompatibles.
al_terminar_debes_poder: Al finalizar este recurso podrás modelar problemas contextuales
  mediante inecuaciones, interpretando y descartando soluciones según la realidad
  física.
