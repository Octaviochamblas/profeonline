semantic_id: MAT.GEO.CIRCULO_RECTAS.EXTERIOR
resumen_inicial: 'Definición de recta exterior a una circunferencia como recta sin
  puntos de intersección: conceptos, teoremas, propiedades geométricas y cálculo en
  Circunferencia y Círculo.'
explicacion_simple: Al analizar la posición relativa entre una recta y una circunferencia,
  existen tres casos posibles según cuántos puntos comparten; el primero es cuando
  no comparten ninguno.
explicacion_formal: '![Recta exterior: sin puntos de intersección](/static/img/geometria/circunferencia-circulo/circulo-recta-exterior.svg)


  ### Definición formal


  Una recta $L$ es exterior a una circunferencia de centro $O$ y radio $r$ si la distancia
  de $O$ a $L$ es mayor que $r$: $d(O,L)>r$.


  ### Desarrollo didáctico


  Si la recta está lo suficientemente lejos del centro (más allá del radio), nunca
  llegará a tocar la circunferencia, sin importar cuánto se extienda la recta en cualquiera
  de sus dos direcciones.'
