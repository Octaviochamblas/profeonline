resumen_inicial: La identificación de la estructura de binomios con término común
  consiste en aislar el monomio repetido $x$ y los valores no comunes $a$ y $b$, incluso
  cuando la expresión está desordenada.
explicacion_simple: A veces las expresiones no vienen escritas en orden bonito. Si
  ves $(3 + x)(x - 8)$, nota que el término que se repite en ambos paréntesis con
  el mismo signo es la $x$. Ese es el término común. Los números $+3$ y $-8$ son los
  no comunes. Ordenándolo queda $(x + 3)(x - 8)$.
explicacion_formal: 'Dados dos binomios $P_1$ y $P_2$, se clasifican como **Binomios
  con Término Común** si existen expresiones $T, K_1, K_2$ con $K_1 \neq \pm K_2$
  tales que:


  $$P_1 = T + K_1 \quad \text{y} \quad P_2 = T + K_2$$


  **Criterio de descomposición estructural:**

  - $T$: Término común invariante de posición (ej. $x, 2a, y^2$).

  - $K_1, K_2$: Términos no comunes (constantes o monomios distintos).


  $$P_1 \cdot P_2 = T^2 + (K_1 + K_2)T + K_1 K_2$$


  > **Complemento didáctico:** Permite distinguir este producto notable del cuadrado
  de binomio ($K_1 = K_2$) y de la suma por diferencia ($K_1 = -K_2$).'
definiciones_clave: '- **Identificación de término común ($T$)**: Elemento con idéntico
  signo y valor en ambos paréntesis.

  - **Discriminación de productos notables**: Distinción entre los tres casos principales
  según la relación entre $K_1$ y $K_2$.'
propiedades_relaciones: '- **Matriz de productos notables**: Si $K_1 = K_2 \to$ Cuadrado
  de Binomio. Si $K_1 = -K_2 \to$ Suma por Diferencia. Si $K_1 \neq \pm K_2 \to$ Término
  Común.'
ejemplo_guiado:
  enunciado: Reordene la expresión $(4 + y)(y - 9)$, identifique $T, K_1, K_2$ y obtenga
    su desarrollo.
  pasos:
  - 'Paso 1: Identificar el término común $T = y$ por aparecer positivo en ambos binomios.'
  - 'Paso 2: Identificar los términos no comunes $K_1 = 4$ y $K_2 = -9$.'
  - 'Paso 3: Reordenar los factores a la forma canónica: $(y + 4)(y - 9)$.'
  - 'Paso 4: Calcular $T^2 = y^2$, $(K_1 + K_2)T = (4 - 9)y = -5y$, y $K_1 K_2 = 4(-9)
    = -36$.'
  - 'Paso 5: Ensamblar los términos: $y^2 - 5y - 36$.'
  - 'Conclusión: La expresión desarrollada es $y^2 - 5y - 36$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación debe cumplirse entre $K_1$ y $K_2$ para que la expresión
    $(T + K_1)(T + K_2)$ sea un producto de binomios con término común general?
  choices:
  - text: $K_1 \neq \pm K_2$ (son distintos y no son opuestos exactos)
    is_correct: true
  - text: $K_1 = K_2$
    is_correct: false
  - text: $K_1 = -K_2$
    is_correct: false
  - text: $K_1 + K_2 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$K_1 \neq \pm K_2$ (son distintos y no
    son opuestos exactos)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la reordenación de $(4 + y)(y - 9)$, ¿cuál es el coeficiente del término
    lineal $-5y$?
  choices:
  - text: $-5$, resultante de $4 + (-9)$
    is_correct: true
  - text: $-36$, resultante de $4 \cdot (-9)$
    is_correct: false
  - text: $+5$
    is_correct: false
  - text: $+13$
    is_correct: false
  explanation: La alternativa correcta es '$-5$, resultante de $4 + (-9)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Detectar la variable o monomio que aparece igual en ambos binomios ($T$).'
- 'Paso 2: Extraer las constantes o monomios secundarios ($K_1, K_2$).'
- 'Paso 3: Reescribir en forma $(T + K_1)(T + K_2)$ y aplicar la regla de expansión.'
errores_correccion: '- **Error 1: Considerar como término común al elemento que cambia
  de signo.** **Cómo corregirlo:** El término común DEBE tener el mismo signo en ambos
  binomios; si cambia de signo es el término variante de una diferencia de cuadrados.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Reordene y desarrolle $(2 + a)(a + 5)$.
  alternativas:
  - $a^2 + 7a + 10$
  - $a^2 + 10a + 7$
  - $a^2 + 7a + 7$
  respuesta: $a^2 + 7a + 10$
  solucion_pasos:
  - '1. Forma canónica: $(a + 2)(a + 5)$.'
  - '2. Suma: $2 + 5 = 7$. Producto: $2 \cdot 5 = 10$. Resultado: $a^2 + 7a + 10$.'
- titulo: Ejemplo 2
  enunciado: En la expresión $(x^2 - 3)(x^2 + 8)$, ¿cuál es el término común $T$?
  alternativas:
  - $x^2$
  - $x$
  - $-3$
  respuesta: $x^2$
  solucion_pasos:
  - 1. El término presente idénticamente en ambos paréntesis es $x^2$.
- titulo: ¿Es $(m + 4)(m - 4)$ un caso especial de binomios con término común donde
    $K_2 = -K_1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, cuando $K_2 = -K_1$, la suma $(K_1 + K_2) = 0$ y se reduce a la diferencia
    de cuadrados.
- titulo: ¿La expresión $(2x + 1)(3x + 1)$ tiene como término común al número $+1$?
  respuesta: 'No'
  solucion_pasos:
  - No en la forma canónica con variable común al inicio; requiere el método de binomios
    no mónicos.
errores_frecuentes:
- Declarar que el término común es aquel que cambia de signo entre los binomios.
- Declarar que $(3 + x)(x - 5)$ no se puede desarrollar mediante la regla del término
  común.
- Sumar las constantes no comunes sin considerar sus signos originales.
- Afirmar que $K_1 = K_2$ define un producto de binomios con término común no nulo.
- Asignar la variable $x$ al término independiente en la expansión.
afirmaciones_verdaderas:
- El término común es el elemento que conserva idéntico valor y signo en ambos factores.
- Reordenar los sumandos de los binomios facilita la aplicación directa de la fórmula
  de Stevin.
al_terminar_debes_poder: Al terminar serás capaz de identificar la estructura de binomios
  con término común e identificar $T, K_1, K_2$ en cualquier expresión.
