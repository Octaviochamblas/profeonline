semantic_id: MAT.ALG.TERMINO_COMUN.IDENTIFICACION_ESTRUCTURA
resumen_inicial: 'La identificación de binomios con término común consiste en auditar la estructura de dos binomios verificando la presencia de un elemento idéntico $x$ y dos elementos distintos $a$ y $b$ con sus respectivos signos.'
explicacion_simple: |
  Para saber si puedes aplicar el producto notable de **término común** sobre un par de binomios:
  - **CRITERIOS DE RECONOCIMIENTO**:
    1. **Término Común**: Debe ser **IDÉNTICO en ambos binomios** (misma variable, mismo exponente y mismo signo).
    2. **Términos No Comunes**: Tienen que ser **DISTINTOS entre sí** (números o variables diferentes).
  - **Ejemplos de verificación**:
    - $(x + 5)$ y $(x + 2) \implies$ Término común: $\mathbf{x}$; No comunes: $\mathbf{+5}$ y $\mathbf{+2}$.
    - $(2a - 3)$ y $(2a + 7) \implies$ Término común: $\mathbf{2a}$; No comunes: $\mathbf{-3}$ y $\mathbf{+7}$.
    - $(x^2 - 4)$ y $(x^2 - 1) \implies$ Término común: $\mathbf{x^2}$; No comunes: $\mathbf{-4}$ y $\mathbf{-1}$.
  - **Diferencia clave con otros productos notables**:
    - Si los no comunes son opuestos ($+a$ y $-a$), son **binomios conjugados**.
    - Si los no comunes son idénticos ($+a$ y $+a$), es un **cuadrado de binomio**.
explicacion_formal: |
  ### Definición formal
  Sean $B_1 = (u + a)$ y $B_2 = (v + b)$ dos binomios en $\mathbb{R}[x]$. Se define la **estructura de término común** $\mathcal{T}(B_1, B_2)$ si y sólo si:

  $$u \equiv v \quad \text{(Monomio idéntico en base, exponente y signo)}$$
  $$a \neq b \quad \land \quad a \neq -b \quad \text{(Términos no comunes generales)}$$

  En cuyo caso el producto adopta la forma canónica funcional:

  $$B_1 \cdot B_2 = u^2 + (a + b)u + ab$$

  ### Generalización a Monomios Comunes Complejos
  El término común $u$ no se restringe a una variable lineal $x$; puede ser un monomio de mayor grado o compuesto $u = c x^\alpha y^\beta$. Al elevarlo al cuadrado se aplica $(u)^2 = c^2 x^{2\alpha} y^{2\beta}$, y el término central multiplica a $u$ intacto: $(a+b)u$.

  ### Síntesis didáctica
  Reconocer el término común exacto evita confundir el algoritmo con el de binomios conjugados o cuadrados de binomio.
definiciones_clave: |
  - **Estructura de término común**: Configuración de dos binomios que comparten exactamente un sumando idéntico $u$.
  - **Monomio común compuesto ($u = c x^\alpha y^\beta$)**: Término idéntico de grado superior o multivariable.
  - **Términos no comunes libres ($a, b$)**: Constantes o monomios distintos que no satisfacen relaciones de igualdad ni de oposición directa.
propiedades_relaciones: |
  - **Independencia de la posición**: El término común puede estar escrito al inicio o al final del binomio: $(a + x)(b + x) = (x + a)(x + b) = x^2 + (a+b)x + ab$.
  - **Jerarquía de clasificación**: Todo par de binomios mónicos lineales pertenece a una de tres categorías: cuadrado de binomio ($a=b$), binomios conjugados ($a=-b$) o término común ($a \neq \pm b$).
ejemplo_guiado:
  enunciado: 'Identifica el término común y los no comunes en $(3x^2 - 4) \cdot (3x^2 + 9)$ y calcula el trinomio expandido.'
  pasos:
    - 'Paso 1: Inspeccionamos los dos binomios: $(3x^2 - 4)$ y $(3x^2 + 9)$.'
    - 'Paso 2: Identificamos el término común: $+3x^2$ es idéntico en ambos $\implies u = 3x^2$.'
    - 'Paso 3: Identificamos los no comunes: $a = -4$ y $b = +9$.'
    - 'Paso 4: Calculamos el cuadrado del común: $(3x^2)^2 = \mathbf{9x^4}$.'
    - 'Paso 5: Calculamos la suma de los no comunes por el común: $(-4 + 9)(3x^2) = (5)(3x^2) = \mathbf{+15x^2}$.'
    - 'Paso 6: Calculamos el producto de los no comunes: $(-4) \cdot (+9) = \mathbf{-36}$.'
    - 'Conclusión: El trinomio expandido es **$9x^4 + 15x^2 - 36$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condiciones debe cumplir un término para ser clasificado como el "término común" de dos binomios?'
    choices:
      - {text: 'Debe ser estrictamente idéntico en ambos binomios, conservando la misma variable, exponente y signo', is_correct: true}
      - {text: 'Debe tener signos opuestos en ambos binomios', is_correct: false}
      - {text: 'Debe ser una constante numérica sin variables', is_correct: false}
      - {text: 'Debe tener exponentes diferentes en cada binomio', is_correct: false}
    explanation: 'La alternativa correcta es ''Debe ser estrictamente idéntico en ambos binomios, conservando la misma variable, exponente y signo''. Monomio idéntico en base, exponente y signo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al inspeccionar $(5 + y) \cdot (-2 + y)$, ¿cuál es el término común y cuál es el resultado de la expansión?'
    choices:
      - {text: 'El término común es $y$ (positivo en ambos), los no comunes son $5$ y $-2$, produciendo $y^2 + 3y - 10$', is_correct: true}
      - {text: 'El término común es $5$ produciendo $25 - y^2$', is_correct: false}
      - {text: 'El término común es $-2$ produciendo $y^2 - 10$', is_correct: false}
      - {text: 'No tienen término común', is_correct: false}
    explanation: 'La alternativa correcta es ''El término común es $y$ (positivo en ambos), los no comunes son $5$ y $-2$, produciendo $y^2 + 3y - 10$''. $u=y \implies y^2 + (5-2)y + (5)(-2) = y^2 + 3y - 10$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Comparar los componentes de ambos binomios buscando el elemento idéntico en magnitud y signo.'
  - 'Paso 2: Registrar dicho elemento como el término común $u$.'
  - 'Paso 3: Clasificar los segundos elementos como los términos no comunes $a$ y $b$.'
  - 'Paso 4: Elevar $u$ al cuadrado, sumar $a+b$ multiplicándolo por $u$, y multiplicar $a \cdot b$.'
errores_correccion: |
  - **Error 1:** Considerar como término común dos elementos con signos opuestos (clasificar $+x$ y $-x$ como comunes). **Cómo corregirlo:** El término común **DEBE TENER EL MISMO SIGNO EN AMBOS BINOMIOS**.
  - **Error 2:** Excluir la variable del término común al multiplicar la suma de los no comunes (escribir $(x+3)(x+4) = x^2 + 7 + 12$). **Cómo corregirlo:** La suma de no comunes **SE MULTIPLICA POR EL TÉRMINO COMÚN ($7x$)**.
ejemplos:
  - titulo: 'Identificación de término común'
    enunciado: 'En $(2a + 3) \cdot (2a - 8)$, ¿cuál es el término común?'
    alternativas:
      - '$2a$'
      - '$a$'
      - '$3$'
    respuesta: '$2a$'
    solucion_pasos:
      - '1. El elemento $+2a$ es idéntico en ambos binomios.'
      - '2. Los no comunes son $+3$ y $-8$.'
      - '3. Término común: $2a$.'
  - titulo: 'Término común con potencia'
    enunciado: 'Para $(x^3 + 5) \cdot (x^3 - 2)$, ¿cuál es el término común elevable?'
    alternativas:
      - '$x^3$'
      - '$x^6$'
      - '$x$'
    respuesta: '$x^3$'
    solucion_pasos:
      - '1. El término común es $x^3$.'
      - '2. Al elevarlo al cuadrado se obtiene $(x^3)^2 = x^6$.'
  - titulo: 'Independencia de orden'
    enunciado: 'En $(4 + m) \cdot (m - 9)$, ¿es $m$ el término común a pesar del desorden en la escritura?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $+m$ está presente con signo positivo en ambos.'
  - titulo: 'No comunes con variables distintas'
    enunciado: 'En $(x + a) \cdot (x + b)$, ¿son $a$ y $b$ los términos no comunes?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, representan las constantes o términos libres.'
errores_frecuentes:
  - 'Considerar como término común elementos que tienen distinto signo en cada binomio.'
  - 'La multiplicación por el término común en la componente central del trinomio no es realizada.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intercambiar un producto de término común desordenado con una diferencia de cuadrados.'
  - 'Sumar los exponentes del término común al elevarlo al cuadrado en lugar de multiplicarlos por 2.'
afirmaciones_verdaderas:
  - 'El término común es el elemento que se repite exactamente con la misma variable, exponente y signo en ambos binomios.'
  - 'El término central del trinomio resultante es el producto de la suma de los no comunes por el término común.'
al_terminar_debes_poder: 'Identificar el término común y los no comunes en binomios ordenados o desordenados para aplicar la regla.'
