semantic_id: MAT.GEO.CUERPOS_REDONDOS_METRICA.ESFERA_AREA
resumen_inicial: 'Cálculo del área total de la esfera: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: El área de una esfera resulta ser exactamente 4 veces el área
  de un círculo máximo (un círculo del mismo radio que la esfera).
explicacion_formal: '![Área total de la esfera](/static/img/geometria/espacio-cuerpos/esfera-area.svg)


  ### Definición formal


  El área total de la superficie de una esfera de radio $r$ es $A_T=4\pi r^2$, es
  decir, exactamente 4 veces el área de un círculo del mismo radio ($\pi r^2$).


  ### Desarrollo didáctico


  Si una esfera tiene radio 5 cm, su área total es $A_T=4\pi(5)^2=100\pi\approx314$
  cm² (usando π≈3,14). Este resultado, descubierto por Arquímedes, relaciona de forma
  elegante la superficie esférica con el área de un círculo simple.'
definiciones_clave: '- **Cálculo del área total de la esfera**: Elemento o propiedad
  fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a cálculo del área total de la esfera.'
ejemplo_guiado:
