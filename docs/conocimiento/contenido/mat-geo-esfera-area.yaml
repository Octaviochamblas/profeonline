procedimiento:
- 'Paso 1: Identifica el radio (r) de la esfera.'
- 'Paso 2: Eleva el radio al cuadrado y multiplícalo por π (obteniendo el área de
  un círculo del mismo radio).'
- 'Paso 3: Multiplica ese resultado por 4 para obtener el área total de la esfera:
  A_T=4πr².'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con cálculo del área total de la esfera.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de cálculo del área total de la esfera para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando cálculo del área total de la esfera.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de cálculo del área total de la esfera
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de cálculo del área total de la esfera.
- titulo: ¿Se cumple siempre la propiedad principal de cálculo del área total de la
    esfera en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede cálculo del área total de la esfera asumir un valor negativo cuando
    representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en cálculo del área total de la esfera.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en cálculo del
  área total de la esfera.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en cálculo del
  área total de la esfera.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de cálculo
  del área total de la esfera.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
