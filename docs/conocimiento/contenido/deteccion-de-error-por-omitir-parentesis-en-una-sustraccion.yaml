semantic_id: MAT.ALG.FRACCIONES_RESTA.ERROR_PARENTESIS
resumen_inicial: Omitir los paréntesis al restar numeradores compuestos genera un error de signo en los términos secundarios.
explicacion_simple: |
  Al restar una fracción algebraica que cuenta con un numerador compuesto por varios términos, omitir los paréntesis altera la expresión.

  Escribir $A - B_1 x + B_0$ en lugar de $A - (B_1 x + B_0) = A - B_1 x - B_0$ modifica el valor real de la fracción resultando en una respuesta incorrecta.

  Detectar a tiempo la falta de paréntesis permite restituir el cambio de signo necesario en los términos secundarios del sustraendo.
explicacion_formal: |
  ### Definición formal
  Sea la resta $\frac{P(x)}{D(x)} - \frac{Q(x)}{D(x)}$. El **error por omisión de paréntesis** altera la expresión a:

  $$\text{Erróneo: } P(x) - Q_1 x + Q_0 \quad \neq \quad \text{Correcto: } P(x) - (Q_1 x + Q_0) = P(x) - Q_1 x - Q_0$$

  ### Desglose de la fórmula
  - La ausencia de paréntesis evita que el signo menos invierta el signo del término independiente $Q_0$.

  ### Síntesis didáctica
  Identificar la omisión de paréntesis permite corregir la inversión de signo omitida en los sumandos del sustraendo.
definiciones_clave: |
  - **Error de omisión de paréntesis**: Ausencia de paréntesis al restar un polinomio que distorsiona la distribución de signos.
propiedades_relaciones: |
  - **Sensibilidad de signo**: Un solo signo cambiado altera los ceros y el comportamiento gráfico de la función racional.
ejemplo_guiado:
  enunciado: 'Corrige el error por omitir paréntesis en la resta $\frac{8x}{x - 1} - \frac{3x - 4}{x - 1}$ y evalúa el resultado correcto para $x = 2$.'
  pasos:
    - 'Paso 1: Aplicar paréntesis al sustraendo: $\frac{8x - (3x - 4)}{x - 1}$.'
    - 'Paso 2: Distribuir el signo menos correctamente: $8x - 3x + 4$.'
    - 'Paso 3: Reducir términos semejantes: $5x + 4$.'
    - 'Paso 4: Escribir la expresión corregida: $\frac{5x + 4}{x - 1}$ para $x \neq 1$.'
    - 'Paso 5: Evaluar para $x = 2$: $\frac{5(2) + 4}{2 - 1} = \frac{10 + 4}{1} = 14$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la expresión reducida correcta tras aplicar paréntesis en $\frac{8x}{x - 1} - \frac{3x - 4}{x - 1}$?'
    choices:
      - {text: '$\frac{5x + 4}{x - 1}$', is_correct: true}
      - {text: '$\frac{5x - 4}{x - 1}$', is_correct: false}
      - {text: '$\frac{11x - 4}{x - 1}$', is_correct: false}
      - {text: '$\frac{5x + 4}{0}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{5x + 4}{x - 1}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar la resta corregida $\frac{5x + 4}{x - 1}$ para $x = 2$, ¿cuál es el resultado?'
    choices:
      - {text: '$14$', is_correct: true}
      - {text: '$6$', is_correct: false}
      - {text: '$10$', is_correct: false}
      - {text: '$18$', is_correct: false}
    explanation: 'La alternativa correcta es ''$14$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las restas entre fracciones con numeradores compuestos.'
  - 'Paso 2: Colocar un paréntesis protector sobre el segundo numerador.'
  - 'Paso 3: Cambiar el signo a todos los términos al quitar el paréntesis.'
  - 'Paso 4: Reducir términos semejantes.'
errores_correccion: |
  - **Error 1:** Escribir $A - B + C$ al restar la fracción $\frac{B - C}{D}$ (omitir el paréntesis). **Cómo corregirlo:** Se debe **COLOCAR OBLIGATORIAMENTE PARÉNTESIS Y ESCRIBIR $A - (B - C) = A - B + C$**.
  - **Error 2:** Asumir que el signo menos solo afecta al primer término del polinomio sustraendo. **Cómo corregirlo:** El signo menos **DISTRIBUYE SU NEGACIÓN A TODOS Y CADA UNO DE LOS TÉRMINOS DEL SUSTRAENDO**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es la forma correcta de expresar la resta en el numerador de $\frac{7}{x} - \frac{x-5}{x}$?'
    alternativas:
      - '$7 - (x - 5)$'
      - '$7 - x - 5$'
      - '$7 - x + 0$'
    respuesta: '$7 - (x - 5)$'
    solucion_pasos:
      - '1. Colocar paréntesis: $7 - (x - 5)$.'
      - '2. Distribuir: $7 - x + 5$.'
      - '3. Reducir: $12 - x$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al evaluar $\frac{10}{x+1} - \frac{4-x}{x+1}$ para $x=2$, ¿cuál es la diferencia entre el cálculo correcto y el sin paréntesis?'
    alternativas:
      - 'El correcto da $\frac{8}{3}$ y el erróneo $\frac{4}{3}$.'
      - 'Ambos dan $\frac{8}{3}$.'
      - 'El correcto da $2$ y el erróneo $4$.'
    respuesta: 'El correcto da $\frac{8}{3}$ y el erróneo $\frac{4}{3}$.'
    solucion_pasos:
      - '1. Correcto: $10 - (4 - x) = 10 - 4 + x = 6 + x$. Para $x=2 \implies \frac{8}{3}$.'
      - '2. Sin paréntesis: $10 - 4 - x = 6 - x$. Para $x=2 \implies \frac{4}{3}$.'
  - titulo: 'Detección de omisión de paréntesis'
    enunciado: '¿La falta de paréntesis en la sustracción de polinomios altera el resultado final?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al alterar el signo de las constantes se descompensa la expresión.'
  - titulo: 'Equivalencia entre formas'
    enunciado: '¿Es equivalente $A - B - C$ a la resta $A - (B - C)$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, $A - (B - C) = A - B + C$, que difiere en el signo de $C$.'
errores_frecuentes:
  - 'Escribir la resta de un polinomio sin incluir paréntesis protectores en el sustraendo.'
  - 'Asumir que $A - (B - C)$ equivale a $A - B - C$.'
  - 'Conservar el signo original de las constantes del sustraendo al eliminar el paréntesis.'
  - 'Omitir la revisión de signos antes de agrupar términos semejantes.'
  - 'Cambiar el signo de los términos del minuendo en lugar del sustraendo.'
afirmaciones_verdaderas:
  - 'La omisión de paréntesis en el sustraendo invierte erróneamente los signos de sus términos independientes o secundarios.'
  - 'Interpolar un paréntesis protector en el sustraendo restaura la validez matemática del procedimiento.'
al_terminar_debes_poder: |
  Detectar y corregir la omisión de paréntesis en la sustracción de fracciones algebraicas para garantizar la correcta inversión de signos en todos los términos del sustraendo.
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.'
estado: publicado
