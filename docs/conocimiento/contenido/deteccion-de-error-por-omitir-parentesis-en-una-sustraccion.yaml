semantic_id: MAT.ALG.FRACCIONES_RESTA.ERROR_PARENTESIS
resumen_inicial: Omitir los paréntesis al restar numeradores compuestos genera un
  error de signo en los términos secundarios.
explicacion_simple: 'Cuando se resta una fracción algebraica con un numerador compuesto,
  omitir los paréntesis es el error más recurrente.

  Escribir $A - B_1 x + B_0$ en lugar de $A - (B_1 x + B_0) = A - B_1 x - B_0$ altera
  el resultado de la fracción.

  Es fundamental identificar esta falta de paréntesis para corregir los signos a tiempo.'
explicacion_formal: 'Sea la resta $\frac{P(x)}{D(x)} - \frac{Q(x)}{D(x)}$. El **error
  por omisión de paréntesis** altera la expresión a:


  $$\text{Erróneo: } P(x) - Q_1 x + Q_0 \quad \neq \quad \text{Correcto: } P(x) -
  (Q_1 x + Q_0) = P(x) - Q_1 x - Q_0$$


  **Desglose de la fórmula:**

  - La falta de paréntesis evita que el signo menos invierta el signo del término
  independiente $Q_0$.'
definiciones_clave: '- **Error de omisión de paréntesis**: Ausencia de paréntesis
  al restar un polinomio que distorsiona la distribución de signos.'
propiedades_relaciones: '- **Sensibilidad de signo**: Un solo signo cambiado altera
  los ceros y el comportamiento gráfico de la función racional.'
ejemplo_guiado:
  enunciado: Corrige el error por omitir paréntesis en la resta $\frac{8x}{x - 1}
    - \frac{3x - 4}{x - 1}$ y evalúa el resultado correcto para $x = 2$.
  pasos:
  - 'Paso 1: Aplicar paréntesis al sustraendo: $\frac{8x - (3x - 4)}{x - 1}$.Paso
    2: Distribuir el signo menos correctamente: $8x - 3x + 4$.Paso 3: Reducir términos
    semejantes: $5x + 4$.Paso 4: Escribir la expresión corregida: $\frac{5x + 4}{x
    - 1}$ para $x \neq 1$.Paso 5: Evaluar para $x = 2$: $\frac{5(2) + 4}{2 - 1} =
    \frac{10 + 4}{1} = 14$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión reducida correcta tras aplicar paréntesis en $\frac{8x}{x
    - 1} - \frac{3x - 4}{x - 1}$?
  choices:
  - text: $\frac{5x + 4}{x - 1}$
    is_correct: true
  - text: $\frac{5x - 4}{x - 1}$
    is_correct: false
  - text: $\frac{11x - 4}{x - 1}$
    is_correct: false
  - text: $\frac{5x + 4}{0}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{5x + 4}{x - 1}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la resta corregida $\frac{5x + 4}{x - 1}$ para $x = 2$, ¿cuál
    es el resultado?
  choices:
  - text: $14$
    is_correct: true
  - text: $6$
    is_correct: false
  - text: $10$
    is_correct: false
  - text: $18$
    is_correct: false
  explanation: La alternativa correcta es '$14$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las restas entre fracciones con numeradores compuestos.'
- 'Paso 2: Colocar un paréntesis protector sobre el segundo numerador.'
- 'Paso 3: Cambiar el signo a todos los términos al quitar el paréntesis.'
- 'Paso 4: Reducir términos semejantes.'
errores_correccion: '- **Error común:** No poner paréntesis al escribir el segundo
  numerador tras el signo menos.

  - **Cómo corregirlo:** Escribe SIEMPRE un paréntesis inmediatamente después del
  signo menos al restar un polinomio.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sustracción.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sustracción.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El signo menos afecta a todo el segundo numerador?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la ley distributiva de la resta.
- titulo: ¿Es conmutativa la sustracción de fracciones?
  respuesta: 'No'
  solucion_pasos:
  - No, restar $A - B$ da un resultado opuesto a $B - A$.
errores_frecuentes:
- Restar los denominadores al realizar la sustracción de fracciones algebraicas.
- Olvidar colocar paréntesis en el segundo numerador al restar.
- Cambiar solo el signo del primer término del sustraendo.
- Restar numeradores de fracciones de distinto denominador sin homogeneizar.
- Confundir el m.c.m. con el producto simple de los denominadores.
afirmaciones_verdaderas:
- Al restar fracciones algebraicas se conserva el denominador común y se restan los
  numeradores.
- El signo negativo de la sustracción invierte el signo de todos los términos del
  segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás efectuar sustracciones de
  fracciones algebraicas aplicando correctamente la distribución de signos y simplificación
  del resultado.
fuente: Texto escolar MINEDUC — Álgebra / Fracciones Algebraicas
