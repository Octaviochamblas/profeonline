resumen_inicial: 'El cálculo de la tasa periódica $i$ despeja la base multiplicativa
  a partir de la razón entre el monto final $M$ y el capital $C$: $i = \sqrt[n]{\frac{M}{C}}
  - 1$.'
explicacion_simple: Si sabemos cuánto invertimos, cuántos períodos duró la inversión
  y cuánta plata juntamos al final en interés compuesto, podemos calcular la tasa
  de interés periódica dividiendo el monto final entre el inicial, sacándole la raíz
  de orden $n$ y restándole 1.
explicacion_formal: 'Dada la ecuación $M = C \cdot (1 + i)^n$, el **Despeje de la
  Tasa Periódica $i$** requiere aplicar la raíz $n$-ésima:


  $$\frac{M}{C} = (1 + i)^n \implies 1 + i = \sqrt[n]{\frac{M}{C}} \implies i = \left(
  \frac{M}{C} \right)^{\frac{1}{n}} - 1$$


  $$r\% = \left[ \left( \frac{M}{C} \right)^{\frac{1}{n}} - 1 \right] \cdot 100\%$$'
definiciones_clave: '- **Tasa periódica compuesta $i$**: Despeje $i = \sqrt[n]{\frac{M}{C}}
  - 1$ mediante la raíz enésima.'
propiedades_relaciones: '- **Raíz enésima de capitalización**: Invierte la potencia
  $n$ del factor de acumulación.'
ejemplo_guiado:
  enunciado: Un capital de \$100.000 se convirtió en \$144.000 en $2$ años de capitalización
    compuesta. Calcule la tasa de interés anual.
  pasos:
  - 'Paso 1: Formar la razón $M/C = 144.000 / 100.000 = 1,44$.'
  - 'Paso 2: Extraer la raíz cuadrada ($n=2$): $\sqrt{1,44} = 1,20$.'
  - 'Paso 3: Restar $1$: $1,20 - 1 = 0,20 \implies 20\%$.'
  - 'Conclusión: La tasa periódica de interés compuesto fue del $20\%$ anual.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se despeja la tasa periódica i a partir del monto M, capital C y
    n períodos en régimen compuesto?
  choices:
  - text: i = (M / C)^(1/n) - 1 (raíz enésima de M/C menos 1)
    is_correct: true
  - text: i = (M / C) · n
    is_correct: false
  - text: i = M - C - n
    is_correct: false
  - text: i = (M - C) / n
    is_correct: false
  explanation: La alternativa correcta es 'i = (M / C)^(1/n) - 1 (raíz enésima de
    M/C menos 1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $100.000 que subió a $144.000 en 2 años, ¿cuál
    fue la tasa anual?
  choices:
  - text: 20% anual
    is_correct: true
  - text: 44% anual
    is_correct: false
  - text: 22% anual
    is_correct: false
  - text: 12% anual
    is_correct: false
  explanation: La alternativa correcta es '20% anual'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la tasa periódica $i
  = \sqrt[n]{\frac{M}{C}} - 1$ aplicando la raíz enésima sobre la razón entre monto
  y capital.
semantic_id: MAT.NUM.INTERES_COMPUESTO.TASA_PERIODICA
procedimiento:
- 'Paso 1: Identificar las variables financieras ($C, i, n, M, I, R$) e igualar la
  tasa al período de capitalización.'
- 'Paso 2: Aplicar la fórmula exponencial de capitalización $M = C \cdot (1 + i)^n$
  o su variante correspondiente.'
- 'Paso 3: Resolver numéricamente o mediante logaritmos y verificar la coherencia
  económica.'
errores_correccion: '- **Error 1: Calcular el interés compuesto multiplicando el tiempo
  por la tasa en forma lineal ($C \cdot i \cdot n$).** **Cómo corregirlo:** En régimen
  compuesto el factor es exponencial $(1 + i)^n$, NO lineal.


  - **Error 2: No ajustar la tasa de interés a la frecuencia de capitalización (ej:
  usar tasa anual en capitalización mensual).** **Cómo corregirlo:** La tasa DEBE
  dividirse entre el número de períodos del año ($i = r / m$) y el tiempo multiplicarse
  ($n = m \cdot t$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_COMPUESTO.TASA_PERIODICA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés compuesto.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización exponencial.
  alternativas:
  - Cumple el modelo
  - No cumple
  - Indeterminado
  respuesta: Cumple el modelo
  solucion_pasos:
  - Demostración formal por $M = C(1+i)^n$.
- titulo: ¿Supera el interés compuesto al simple para t > 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, debido al efecto acumulativo de la capitalización de intereses.
- titulo: ¿Se requiere logaritmo para despejar el número de períodos n?
  respuesta: Sí
  solucion_pasos:
  - Sí, para bajar el exponente $n$ mediante la propiedad logarítmica.
errores_frecuentes:
- Usar la fórmula lineal del interés simple $C \cdot i \cdot t$ para resolver problemas
  de capitalización compuesta.
- No dividir la tasa de interés anual entre 12 cuando el período de capitalización
  es mensual.
- Omitir restar el capital inicial $C$ al monto acumulado final $M$ al calcular únicamente
  el interés ganado.
- Declarar que dos cuotas de interés compuesto acumulado crecen en forma de progresión
  aritmética constante.
- Sumar directamente las cuotas de amortización sin descontar la tasa de interés en
  el valor presente.
afirmaciones_verdaderas:
- El interés compuesto se caracteriza porque los intereses de cada período se suman
  al capital para generar nuevos intereses.
- El monto acumulado en régimen compuesto sigue un modelo de función exponencial $M
  = C \cdot (1 + i)^n$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
