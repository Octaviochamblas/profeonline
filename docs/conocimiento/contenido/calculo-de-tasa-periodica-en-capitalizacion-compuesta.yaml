semantic_id: MAT.NUM.INTERES_COMPUESTO.TASA_PERIODICA
resumen_inicial: 'El cálculo de la tasa periódica efectiva $i$ en capitalización compuesta despeja el rendimiento por período extrayendo la raíz $n$-ésima de la razón entre el monto y el capital: $i = \sqrt[n]{\frac{M}{C}} - 1$.'
explicacion_simple: |
  Si sabes cuánto dinero tenías al principio ($C$), cuánto dinero reuniste al final ($M$) y cuántos períodos pasaron ($n$), pero quieres **averiguar qué tasa de interés periódica te dieron**:
  1. Divides el monto final entre el capital inicial: $\frac{M}{C}$.
  2. Le sacas la raíz $n$-ésima a ese resultado: $\sqrt[n]{\frac{M}{C}}$.
  3. Le restas $1$ al resultado para obtener la tasa en decimal.
  Por ejemplo, si $\$100.000$ se convirtieron en $\$121.000$ en $2$ años: la razón es $121.000 \div 100.000 = 1,21$. La raíz cuadrada es $\sqrt{1,21} = 1,10$. Al restar $1$ te da $0,10$, es decir, un **$10\%$ de tasa anual**.
explicacion_formal: |
  ### Definición formal
  La **tasa de interés periódica efectiva $i$** obtenida a partir de una meta de acumulación en $n$ períodos se despeja invirtiendo la potencia del factor de acumulación:
  $$M = C \cdot (1 + i)^n \implies (1 + i)^n = \frac{M}{C} \implies 1 + i = \left(\frac{M}{C}\right)^{1/n} \implies i = \sqrt[n]{\frac{M}{C}} - 1$$

  ### Conversión a Tasa Nominal Porcentual ($r\%$)
  $$r\% = \left[\left(\sqrt[n]{\frac{M}{C}} - 1\right) \cdot 100\right]\%$$

  ### Propiedades Algebraicas del Despeje
  - La operación inversa de la potencia $n$-ésima $(1+i)^n$ en $\mathbb{R}^+$ es la radicación $n$-ésima $\sqrt[n]{x} = x^{1/n}$.
  - Para $n = 2$ períodos $\implies i = \sqrt{\frac{M}{C}} - 1$.
  - Para $n = 3$ períodos $\implies i = \sqrt[3]{\frac{M}{C}} - 1$.

  ### Síntesis didáctica
  - Ecuación decimal de la tasa: $i = \left(\frac{M}{C}\right)^{1/n} - 1$.
  - Ecuación porcentual: $r\% = \left[\left(\frac{M}{C}\right)^{1/n} - 1\right] \cdot 100\%$.
definiciones_clave: |
  - **Tasa efectiva por período ($i$)**: Rendimiento percentil real obtenido en cada ciclo de capitalización.
  - **Raíz $n$-ésima de rendimiento**: Operación matemática empleada para desarmar la potencia del compuesto.
  - **Factor de crecimiento medio por período**: Valor de la razón multiplicativa $\sqrt[n]{M/C}$.
propiedades_relaciones: |
  - **Sensibilidad al exponente**: A mayor número de períodos $n$ transcurridos para lograr la misma razón $\frac{M}{C}$, menor resulta ser la tasa de interés periódica $i$ requerida.
  - **No linealidad de la tasa**: La tasa compuesta necesaria para duplicar el dinero en $n$ años no es simplemente $\frac{100\%}{n}$, sino que es estrictamente menor debido a la capitalización.
ejemplo_guiado:
  enunciado: 'Un capital de $\$500.000$ se convirtió en $\$605.000$ en $2$ años a interés compuesto con capitalización anual. Determina la tasa de interés anual aplicada.'
  pasos:
    - 'Paso 1: Identificamos $C = 500.000$, $M = 605.000$ y períodos $n = 2$.'
    - 'Paso 2: Calculamos la razón entre el monto y el capital: $\frac{M}{C} = \frac{605.000}{500.000} = 1,21$.'
    - 'Paso 3: Extraemos la raíz cuadrada (ya que $n = 2$): $\sqrt{1,21} = 1,10$.'
    - 'Paso 4: Restamos 1 y multiplicamos por 100: $i = 1,10 - 1 = 0,10 \implies r\% = 10\%$. La tasa es del **$10\%$ anual**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la tasa de interés periódica $i$ en función del monto final $M$, del capital $C$ y de los períodos $n$?'
    choices:
      - {text: 'Restar 1 a la raíz $n$-ésima del cociente entre el monto y el capital ($i = \sqrt[n]{\frac{M}{C}} - 1$)', is_correct: true}
      - {text: 'Multiplicar el monto por el capital y elevar a $n$', is_correct: false}
      - {text: 'Dividir el monto entre el capital y restar el tiempo $n$', is_correct: false}
      - {text: 'Restar el capital al monto y dividir entre $n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Restar 1 a la raíz $n$-ésima del cociente entre el monto y el capital ($i = \sqrt[n]{\frac{M}{C}} - 1$)''. Despeja $i$ de $M = C(1+i)^n$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $\$100.000$ se convierten en $\$144.000$ en $2$ años a interés compuesto, ¿cuál fue la tasa de interés anual?'
    choices:
      - {text: 'El $20\%$ anual, calculando $\sqrt{1,44} - 1 = 1,20 - 1 = 0,20 \implies 20\%$', is_correct: true}
      - {text: 'El $44\%$ anual, dividiendo directamente por 100', is_correct: false}
      - {text: 'El $22\%$ anual, dividiendo 44 entre 2', is_correct: false}
      - {text: 'El $12\%$ anual, extrayendo raíz a 144', is_correct: false}
    explanation: 'La alternativa correcta es ''El $20\%$ anual, calculando $\sqrt{1,44} - 1 = 1,20 - 1 = 0,20 \implies 20\%$''. $\sqrt{1,44} = 1,20 \implies 20\%$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Dividir el monto final $M$ entre el capital inicial $C$ para hallar la razón $\frac{M}{C}$.'
  - 'Paso 2: Calcular la raíz $n$-ésima de dicho cociente: $\left(\frac{M}{C}\right)^{1/n}$.'
  - 'Paso 3: Restar 1 al valor numérico obtenido para aislar la tasa decimal $i$.'
  - 'Paso 4: Multiplicar $i$ por 100 para expresar el resultado como tasa porcentual periódica.'
errores_correccion: |
  - **Error 1:** Dividir la ganancia entre el número de períodos y el capital como si fuera interés simple (ej: hacer $i = \frac{M-C}{C \cdot n}$). **Cómo corregirlo:** En régimen compuesto el despeje de la potencia $n$ exige la **operación de radicación: $i = \sqrt[n]{M/C} - 1$**.
  - **Error 2:** Olvidar restar la constante 1 tras calcular la raíz de la razón $\frac{M}{C}$. **Cómo corregirlo:** La raíz entrega el factor completo $1+i$; **DEBES restar 1 para tener la tasa $i$**.
ejemplos:
  - titulo: 'Despeje de tasa a 2 años'
    enunciado: 'Si $C = \$200.000$ y $M = \$288.000$ en 2 años, ¿la tasa es $20\%$ anual?'
    alternativas:
      - 'Sí, pues $\sqrt{288.000 / 200.000} - 1 = \sqrt{1,44} - 1 = 1,20 - 1 = 0,20 \implies 20\%$'
      - 'No, es del 44%'
      - 'No, es del 22%'
    respuesta: 'Sí, pues $\sqrt{288.000 / 200.000} - 1 = \sqrt{1,44} - 1 = 1,20 - 1 = 0,20 \implies 20\%$'
    solucion_pasos:
      - '1. Razón: $288.000 / 200.000 = 1,44$.'
      - '2. Raíz cuadrada: $\sqrt{1,44} = 1,20$.'
      - '3. Tasa: $1,20 - 1 = 0,20 \implies 20\%$.'
  - titulo: 'Despeje de tasa a 3 años'
    enunciado: 'Si $\$100.000$ se convierten en $\$133.100$ en 3 años, ¿la tasa es del $10\%$ anual?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt[3]{1,331} - 1 = 1,10 - 1 = 0,10 \implies 10\%$.'
  - titulo: 'Tasa necesaria para duplicar en 2 años'
    enunciado: 'Para duplicar el dinero ($M/C = 2$) en 2 años a interés compuesto, ¿se requiere una tasa del $\approx 41,4\%$ ($\sqrt{2} - 1 \approx 0,414$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt{2} \approx 1,4142 \implies 41,42\%$.'
  - titulo: 'Tasa nula'
    enunciado: 'Si el monto final $M$ es idéntico al capital $C$, ¿la tasa calculada resulta $0\%$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt[n]{1} - 1 = 1 - 1 = 0\%$.'
errores_frecuentes:
  - 'Dividir directamente la ganancia total entre el número de períodos aplicando la fórmula del interés simple.'
  - 'La raíz $n$-ésima del cociente $M/C$ entrega directamente la tasa decimal sin restar 1.'
  - 'Extraer la raíz al monto $M$ sin dividir previamente entre el capital inicial $C$.'
  - 'La tasa periódica calculada resulta ser inversamente proporcional al cuadrado del capital.'
  - 'Sumar el capital inicial a la razón $M/C$ antes de aplicar el operador raíz.'
afirmaciones_verdaderas:
  - 'La tasa de interés periódica a interés compuesto se calcula mediante la fórmula $i = \sqrt[n]{\frac{M}{C}} - 1$.'
  - 'Para despejar la tasa compuesta se requiere aplicar la radicación $n$-ésima a la razón entre el monto y el capital.'
al_terminar_debes_poder: 'Calcular la tasa periódica en capitalización compuesta aplicando la fórmula $i = \sqrt[n]{\frac{M}{C}} - 1$.'
