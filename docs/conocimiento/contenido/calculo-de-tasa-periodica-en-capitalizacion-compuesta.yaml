semantic_id: MAT.NUM.INTERES_COMPUESTO.TASA_PERIODICA
resumen_inicial: 'El cálculo de la tasa periódica en capitalización compuesta despeja el rendimiento aplicando la raíz enésima a la razón de acumulación: $i = \sqrt[n]{\frac{M}{C}} - 1$.'
explicacion_simple: |
  Si invertiste una cantidad inicial $C$ y al cabo de $n$ años obtuviste un monto final $M$, para calcular **qué tasa de interés anual compuesta te aplicaron**:
  1. Divides el monto final entre el capital inicial ($M / C$).
  2. Le extraes la raíz enésima (según los años $n$).
  3. Le restas 1 al resultado y multiplicas por 100 para tener el porcentaje $\%$.
  Por ejemplo, si $\$100.000$ se convirtieron en $\$121.000$ en 2 años: $121.000 \div 100.000 = 1,21$. La raíz cuadrada de $1,21$ es $1,10$. Al restar 1 queda $0,10$ (**$10\%$ anual**).

  ![Cálculo de tasa periódica en capitalización compuesta](/static/img/nodos/calculo-de-tasa-periodica-en-capitalizacion-compuesta-intro.svg)
explicacion_formal: |
  ### Definición formal
  La **tasa de interés periódica decimal $i$** en un modelo de capitalización compuesta se obtiene aislando la incógnita $i$ en la ecuación exponencial fundamental:
  $$M = C \cdot (1 + i)^n \implies (1 + i)^n = \frac{M}{C}$$
  Extrayendo la raíz enésima a ambos lados de la igualdad:
  $$1 + i = \sqrt[n]{\frac{M}{C}} = \left(\frac{M}{C}\right)^{\frac{1}{n}} \implies i = \sqrt[n]{\frac{M}{C}} - 1$$
  Para expresar la tasa en formato porcentual nominal $r\%$:
  $$r\% = \left(\sqrt[n]{\frac{M}{C}} - 1\right) \cdot 100\%$$

  ### Síntesis didáctica
  - Ecuación de la tasa periódica: $i = (M / C)^{1/n} - 1$.
  - Ecuación porcentual: $r\% = i \cdot 100\%$.
definiciones_clave: |
  - **Razón de acumulación ($M / C$)**: Factor total en que se multiplicó el capital durante todo el horizonte de inversión.
  - **Raíz enésima del factor**: Desagregación del factor multiplicativo total en su componente constante por período.
propiedades_relaciones: |
  - **No linealidad del despeje**: La tasa compuesta requiere radicación; a diferencia de la tasa simple que solo requiere división ($i_{\text{simple}} = \frac{M-C}{C \cdot n}$).
  - **Relación de magnitud**: Para un mismo monto final y plazo ($n > 1$), la tasa periódica compuesta requerida es estrictamente menor que la tasa simple equivalente.
ejemplo_guiado:
  enunciado: 'Un capital de $\$400.000$ colocado a interés compuesto se transformó en un monto final de $\$484.000$ al cabo de $2$ años. Determina la tasa de interés compuesta anual aplicada.'
  imagen: '/static/img/nodos/calculo-de-tasa-periodica-en-capitalizacion-compuesta-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos $C = 400.000$, $M = 484.000$ y plazo $n = 2\text{ años}$.'
    - 'Paso 2: Calculamos la razón de acumulación: $\frac{M}{C} = \frac{484.000}{400.000} = 1,21$.'
    - 'Paso 3: Extraemos la raíz cuadrada ($n = 2$): $\sqrt{1,21} = 1,10$.'
    - 'Paso 4: Restamos 1 y multiplicamos por 100: $i = 1,10 - 1 = 0,10 \implies r\% = 0,10 \cdot 100 = 10\%$. La tasa es del **$10\%$ anual**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para despejar la tasa de interés periódica $i$ en un régimen de interés compuesto?'
    choices:
      - {text: 'Restar 1 a la raíz enésima de la razón entre monto y capital ($i = \sqrt[n]{\frac{M}{C}} - 1$)', is_correct: true}
      - {text: 'Dividir el monto entre el capital y el tiempo ($i = \frac{M}{C \cdot n}$)', is_correct: false}
      - {text: 'Restar el capital al monto y multiplicar por $n$', is_correct: false}
      - {text: 'Elevar la razón $M/C$ a la potencia $n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Restar 1 a la raíz enésima de la razón entre monto y capital ($i = \sqrt[n]{\frac{M}{C}} - 1$)''. Se extrae raíz de orden $n$ a $(1+i)^n = M/C$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $\$100.000$ se transforman en $\$133.100$ en $3$ años a interés compuesto ($\sqrt[3]{1,331} = 1,10$), ¿cuál fue la tasa anual?'
    choices:
      - {text: 'El $10\%$ anual, pues $\sqrt[3]{1,331} - 1 = 1,10 - 1 = 0,10$', is_correct: true}
      - {text: 'El $33,1\%$ anual, dividiendo entre 1', is_correct: false}
      - {text: 'El $11,03\%$ anual, dividiendo linealmente', is_correct: false}
      - {text: 'El $3\%$ anual', is_correct: false}
    explanation: 'La alternativa correcta es ''El $10\%$ anual, pues $\sqrt[3]{1,331} - 1 = 1,10 - 1 = 0,10$''. La tasa efectiva es $i = 0,10 = 10\%$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar capital inicial $C$, monto final $M$ y número de períodos $n$.'
  - 'Paso 2: Calcular el cociente de acumulación $\frac{M}{C}$.'
  - 'Paso 3: Extraer la raíz enésima $\sqrt[n]{\frac{M}{C}}$ o calcular $\left(\frac{M}{C}\right)^{1/n}$.'
  - 'Paso 4: Restar 1 al resultado y multiplicar por 100 para obtener la tasa porcentual $r\%$.'
errores_correccion: |
  - **Error 1:** Despejar la tasa mediante una división lineal (hacer $i = \frac{M - C}{C \cdot n}$). **Cómo corregirlo:** En régimen compuesto la tasa se encuentra en la base de una potencia; **se DEBE aplicar radicación enésima**: **$i = \sqrt[n]{M/C} - 1$**.
  - **Error 2:** Olvidar restar 1 al valor de la raíz (responder que la tasa es $1,10$ en vez de $0,10$). **Cómo corregirlo:** La raíz entrega $(1 + i)$; **debes restar 1 para aislar la tasa de ganancia**.
ejemplos:
  - titulo: 'Tasa en 2 períodos'
    enunciado: 'Si $\$100.000$ se convierten en $\$121.000$ en 2 años, ¿cuál es la tasa anual compuesta?'
    alternativas:
      - '$10\%$ anual'
      - '$21\%$ anual'
      - '$10,5\%$ anual'
    respuesta: '$10\%$ anual'
    solucion_pasos:
      - '1. Razón: $121.000 / 100.000 = 1,21$.'
      - '2. Raíz cuadrada: $\sqrt{1,21} = 1,10$.'
      - '3. Tasa: $1,10 - 1 = 0,10 \implies 10\%$ anual.'
  - titulo: 'Tasa en 3 períodos'
    enunciado: 'Si $\$200.000$ se convierten en $\$266.200$ en 3 años, ¿cuál es la tasa anual compuesta?'
    alternativas:
      - '$10\%$ anual'
      - '$33,1\%$ anual'
      - '$11\%$ anual'
    respuesta: '$10\%$ anual'
    solucion_pasos:
      - '1. Razón: $266.200 / 200.000 = 1,331$.'
      - '2. Raíz cúbica: $\sqrt[3]{1,331} = 1,10$.'
      - '3. Tasa: $1,10 - 1 = 0,10 \implies 10\%$ anual.'
  - titulo: 'Tasa para duplicar en 2 años'
    enunciado: 'Para duplicar un capital en 2 años a interés compuesto ($M/C = 2$), ¿la tasa anual debe ser aproximadamente $41,4\%$ ($\sqrt{2} \approx 1,414$)?'
    alternativas:
      - 'Sí, pues $i = \sqrt{2} - 1 \approx 1,414 - 1 = 0,414 \implies 41,4\%$'
      - 'No, la tasa debe ser del $50\%$ anual'
      - 'No, la tasa debe ser del $100\%$ anual'
    respuesta: 'Sí, pues $i = \sqrt{2} - 1 \approx 1,414 - 1 = 0,414 \implies 41,4\%$'
    solucion_pasos:
      - '1. $i = \sqrt{2} - 1 \approx 1,4142 - 1 = 0,4142 \implies 41,42\%$.'
  - titulo: 'Tasa con capitalización semestral'
    enunciado: 'Si un capital gana $44\%$ en 1 año con 2 capitalizaciones semestrales, ¿la tasa semestral es del $20\%$?'
    alternativas:
      - 'Sí, pues $\sqrt{1,44} = 1,20 \implies i_{\text{sem}} = 20\%$'
      - 'No, es del $22\%$ semestral'
      - 'No, es del $44\%$ semestral'
    respuesta: 'Sí, pues $\sqrt{1,44} = 1,20 \implies i_{\text{sem}} = 20\%$'
    solucion_pasos:
      - '1. $M/C = 1,44$.'
      - '2. $1 + i_{\text{sem}} = \sqrt{1,44} = 1,20 \implies i_{\text{sem}} = 20\%$.'
errores_frecuentes:
  - 'La tasa periódica compuesta se calcula mediante división lineal del interés entre el producto de capital por tiempo.'
  - 'El valor de la raíz enésima $\sqrt[n]{M/C}$ se entrega directamente como tasa sin restar la constante 1.'
  - 'La tasa porcentual periódica se obtiene multiplicando la razón $M/C$ por el número de períodos $n$.'
  - 'La tasa requerida para duplicar un capital a interés compuesto en dos años es exactamente del $50\%$.'
  - 'El cálculo de la tasa compuesta omite la radicación y utiliza la resta aritmética simple de porcentajes.'
afirmaciones_verdaderas:
  - 'La tasa de interés periódica a interés compuesto se despeja mediante $i = \sqrt[n]{\frac{M}{C}} - 1$.'
  - 'La tasa compuesta periódica requerida para alcanzar una meta financiera es menor que la tasa simple correspondiente para $n > 1$.'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/calculo-de-tasa-periodica-en-capitalizacion-compuesta-resumen.svg)

  QUÉ: Calcular la tasa periódica efectiva en un régimen de interés compuesto.
  CÓMO: Resolver la ecuación radical $i = \sqrt[n]{\frac{M}{C}} - 1$, extrayendo la raíz enésima de la razón de acumulación y restando la unidad.
