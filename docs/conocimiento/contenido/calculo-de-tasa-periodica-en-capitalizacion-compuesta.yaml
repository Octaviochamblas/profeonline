semantic_id: MAT.NUM.INTERES_COMPUESTO.TASA_PERIODICA
resumen_inicial: 'Cálculo de tasa periódica en capitalización compuesta: concepto
  y propiedades fundamentales en Interés compuesto.'
explicacion_simple: Los bancos son astutos. Te dicen 'Tasa de 12% anual', pero luego
  en letra chica agregan 'capitalizable mensualmente'. ¿Significa que te cobran 12%
  cada mes? No. Significa que fraccionan ese 12% en pequeñas cuotas mensuales.
explicacion_formal: 'En interés compuesto puro, la tasa debe coincidir con los períodos
  de tiempo en la fórmula. Pero los bancos suelen publicitar una **Tasa Anual Nominal
  (TAN)** acompañada de un período de capitalización distinto (ej. mensual).


  Para aplicar la fórmula $M = C(1+i)^t$, la tasa $i$ debe ser la **Tasa Periódica**.


  **¿Cómo se calcula?**

  Divide la Tasa Nominal por la cantidad de períodos que hay en un año:

  - Si dice ''Capitalizable mensualmente'': $i_p = \text{Tasa Anual} / 12$.

  - Si dice ''Capitalizable semestralmente'': $i_p = \text{Tasa Anual} / 2$.

  - Si dice ''Capitalizable trimestralmente'': $i_p = \text{Tasa Anual} / 4$.


  Ejemplo: Un $24\%$ anual capitalizable mensualmente, significa que cada mes te aplicarán
  un $24\% / 12 = 2\%$ mensual. Usarás $i = 0.02$ en la fórmula.'
definiciones_clave: '- **Cálculo de tasa periódica en capitalización compuesta**:
  Elemento central dentro del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
