procedimiento:
- 'Paso 1: Lee la ''letra chica'' para ver la frecuencia de capitalización.'
- 'Paso 2: Divide la tasa anual dada por el número de esos períodos que caben en un año.'
- 'Paso 3: Esa tasa fraccionada es la que debes transformar a decimal para usar en $(1+i)$.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de tasa periódica
  en capitalización compuesta.
ejemplos:
- titulo: Capitalización Trimestral
  enunciado: Un banco ofrece un 16% de interés anual capitalizable trimestralmente. ¿Cuál
    es la tasa periódica que se usa en la fórmula?
  solucion_pasos:
  - Un año tiene 4 trimestres (3 meses x 4 = 12).
  - Tasa periódica = $16\% / 4 = 4\%$ trimestral.
  - En la fórmula usarás $i = 0.04$.
- titulo: Ejemplo 2
  enunciado: Un 24% anual capitalizable semestralmente, ¿cuál es la tasa periódica?
  alternativas:
  - 12%
  - 24%
  - 2%
  respuesta: 12%
  solucion_pasos:
  - 24% dividido entre 2 semestres es igual a 12%.
- titulo: Ejemplo 3
  enunciado: Un 12% anual capitalizable mensualmente, ¿cuál es la tasa periódica?
  alternativas:
  - 1%
  - 12%
  - 6%
  respuesta: 1%
  solucion_pasos:
  - 12% dividido entre 12 meses es igual a 1%.
- titulo: ¿La capitalización trimestral implica dividir la tasa anual entre 4?
  respuesta: Sí
  solucion_pasos:
  - Porque hay 4 trimestres en un año.
errores_frecuentes:
- Dividir por 3 cuando dice trimestral (Trimestre son 3 meses, pero hay 4 trimestres en el
  año, se divide por 4).
- Usar el 16% directamente en la fórmula como si fuera anual, ignorando la capitalización.
- Dividir por 3 cuando la capitalización es trimestral, en vez de dividir por 4, que es la
  cantidad de trimestres en un año.
- Usar la tasa anual directamente en la fórmula sin dividirla, ignorando la capitalización
  indicada.
- Confundir la cantidad de periodos de capitalización semestral, que es 2, con la mensual,
  que es 12.
afirmaciones_verdaderas:
- La propiedad de cálculo de tasa periódica en capitalización compuesta preserva la consistencia
  lógica.
- La tasa periódica siempre se obtiene dividiendo la tasa anual nominal por la cantidad de
  periodos de capitalización que hay en un año.
