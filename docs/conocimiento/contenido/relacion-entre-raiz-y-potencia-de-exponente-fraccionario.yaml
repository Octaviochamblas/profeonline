semantic_id: MAT.NUM.RAICES_CONCEPTO.EXPONENTE_FRACCIONARIO
resumen_inicial: La relación entre raíz y potencia establece que toda raíz $\sqrt[n]{a^m}$
  puede escribirse como una potencia de exponente fraccionario $a^{m/n}$.
explicacion_simple: Las raíces y las potencias son dos formas de escribir el mismo
  concepto. La regla dorada para transformar una raíz en potencia es convertir el
  exponente interno en el numerador y el índice de la raíz en el denominador de la
  fracción exponente.
explicacion_formal: 'Para todo $a > 0$ y $\frac{m}{n} \in \mathbb{Q}$ ($n \ge 2$),
  la **Equivalencia de Exponente Fraccionario** establece:


  $$\sqrt[n]{a^m} = a^{\frac{m}{n}}$$


  **Desglose de conversión:**

  - Numerador $m$: Exponente del radicando dentro de la raíz.

  - Denominador $n$: Índice de la raíz enésima fuera del radical.'
definiciones_clave: '- **Relación raíz y exponente fraccionario**: Identidad $\sqrt[n]{a^m}
  = a^{m/n}$ que unifica la potenciación y la radicación.'
propiedades_relaciones: '- **Transformación bidireccional**: $\sqrt[n]{a^m} = a^{m/n}$.'
ejemplo_guiado:
  enunciado: Exprese como potencia de exponente fraccionario $\sqrt[3]{x^5}$ y como
    raíz la potencia $y^{3/4}$.
  pasos:
  - 'Paso 1: Para $\sqrt[3]{x^5}$, el exponente interno es $5$ y el índice es $3 \implies
    x^{5/3}$.'
  - 'Paso 2: Para $y^{3/4}$, el numerador $3$ es exponente y el denominador $4$ es
    índice $\implies \sqrt[4]{y^3}$.'
  - 'Conclusión: $\sqrt[3]{x^5} = x^{5/3}$ y $y^{3/4} = \sqrt[4]{y^3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué posición de la fracción exponente m/n se ubica el índice n de
    la raíz al convertir sqrt[n]{a^m}?
  choices:
  - text: En el denominador de la fracción exponente (m/n)
    is_correct: true
  - text: En el numerador de la fracción
    is_correct: false
  - text: Como base principal
    is_correct: false
  - text: Se multiplica por 2
    is_correct: false
  explanation: La alternativa correcta es 'En el denominador de la fracción exponente
    (m/n)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sqrt[3]{x^5}, ¿cuál fue la potencia equivalente?
  choices:
  - text: x^{5/3}
    is_correct: true
  - text: x^{3/5}
    is_correct: false
  - text: x^{15}
    is_correct: false
  - text: 5x^3
    is_correct: false
  explanation: La alternativa correcta es 'x^{5/3}'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente $m$ del radicando y el índice $n$ de la raíz.'
- 'Paso 2: Formar la fracción exponente $\frac{m}{n}$ dividiendo el exponente interno
  por el índice.'
- 'Paso 3: Escribir la base $a$ elevada a la fracción $a^{m/n}$.'
errores_correccion: '- **Error 1: Invertir la fracción escribiendo $\sqrt[3]{x^5}
  = x^{3/5}$.** **Cómo corregirlo:** El índice $3$ va SIEMPRE en el denominador (abajo):
  $x^{5/3}$.


  - **Error 2: Olvidar que la raíz cuadrada sin número tiene índice 2 ($\sqrt{x^3}
  = x^{3/2}$).** **Cómo corregirlo:** El índice implícito es $2$, por lo que el denominador
  es $2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Convierta $\sqrt{x^7}$ a exponente fraccionario.
  alternativas:
  - x^{7/2}
  - x^{2/7}
  - x^{14}
  respuesta: x^{7/2}
  solucion_pasos:
  - $\sqrt[2]{x^7} = x^{7/2}$.
- titulo: Ejemplo 2
  enunciado: Convierta $z^{2/5}$ a raíz.
  alternativas:
  - sqrt[5]{z^2}
  - sqrt[2]{z^5}
  - 5z^2
  respuesta: sqrt[5]{z^2}
  solucion_pasos:
  - $z^{2/5} = \sqrt[5]{z^2}$.
- titulo: ¿Es sqrt[4]{a^4} igual a a^{4/4} = a^1 = a?
  respuesta: Sí
  solucion_pasos:
  - Sí, $4/4 = 1 \implies a^1 = a$.
- titulo: ¿Equivale a^{1/2} a la raíz cuadrada de a?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a^{1/2} = \sqrt[2]{a^1} = \sqrt{a}$.
errores_frecuentes:
- Ubicar el índice de la raíz en el numerador de la fracción exponente al convertir
  $\sqrt[n]{a^m}$.
- La expresión $\sqrt{x^5}$ equivale a la potencia de exponente fraccionario $x^{5/1}$.
- Multiplicar el índice por el exponente interno para formar una potencia de exponente
  entero.
- Convertir una raíz cuadrada a exponente fraccionario requiere usar el denominador
  10.
- Las expresiones con exponente fraccionario no pueden simplificarse utilizando las
  leyes de potencias.
afirmaciones_verdaderas:
- Toda raíz $\sqrt[n]{a^m}$ equivale a una potencia con exponente fraccionario $a^{m/n}$.
- El índice $n$ de la raíz se ubica en el denominador de la fracción y el exponente
  $m$ del radicando en el numerador.
al_terminar_debes_poder: Al terminar serás capaz de transformar bidireccionalmente
  raíces y potencias de exponente fraccionario $\sqrt[n]{a^m} = a^{m/n}$, aplicando
  sus equivalencias algebraicas.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
