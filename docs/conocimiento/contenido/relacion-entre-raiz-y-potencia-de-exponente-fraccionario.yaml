semantic_id: MAT.NUM.RAICES_CONCEPTO.EXPONENTE_FRACCIONARIO
resumen_inicial: Toda raíz se puede expresar como una potencia de exponente fraccionario mediante la equivalencia $\sqrt[n]{a^m} = a^{m/n}$, donde el numerador $m$ es el exponente del radicando y el denominador $n$ es el índice del radical.
explicacion_simple: '![Raíz y exponente fraccionario](/static/img/nodos/relacion-entre-raiz-y-potencia-de-exponente-fraccionario-intro.svg)


  Las raíces y las potencias son dos formas de escribir exactamente lo mismo: **una raíz es una potencia con exponente en fracción**.

  - La regla para no olvidarlo nunca es: **''el de abajo de la fracción es el índice de la raíz''** (el que va en el gancho).

  - Por ejemplo, $8^{2/3}$ significa $\sqrt[3]{8^2} = (\sqrt[3]{8})^2 = 2^2 = 4$.

  - Esta regla te permite aplicar todas las propiedades de potencias (multiplicar sumando exponentes, dividir restando exponentes) a expresiones con raíces.'
explicacion_formal: "Sean $a \\in \\mathbb{R}^+$, $m \\in \\mathbb{Z}$ y $n \\in \\mathbb{N}$ con $n \\ge 2$. La **Definición de Potencia con Exponente Racional** establece la equivalencia:\n\n$$a^{m/n} = \\sqrt[n]{a^m} = (\\sqrt[n]{a})^m$$\n\n**Propiedades algebraicas unificadas:**\n1. **Exponente unitario:** $a^{1/n} = \\sqrt[n]{a}$.\n2. **Exponente fraccionario negativo:** $a^{-m/n} = \\frac{1}{a^{m/n}} = \\frac{1}{\\sqrt[n]{a^m}}$.\n3. **Leyes de exponentes en radicales:**\n   - **Producto de raíces con distinta base o índice:** $\\sqrt{a} \\cdot \\sqrt[3]{a} = a^{1/2} \\cdot a^{1/3} = a^{1/2 + 1/3} = a^{5/6} = \\sqrt[6]{a^5}$.\n   - **Cociente de raíces:** $\\frac{\\sqrt[3]{a^2}}{\\sqrt{a}} = a^{2/3 - 1/2} = a^{1/6} = \\sqrt[6]{a}$."
definiciones_clave: '- **Exponente fraccionario ($m/n$)**: Notación exponencial donde el numerador es la potencia y el denominador es el índice.

  - **Unificación de leyes**: Aplicación directa de propiedades de potencias a operadores radicales.

  - **Potencia fraccionaria negativa**: Inversión multiplicativa $a^{-m/n} = 1/a^{m/n}$.'
propiedades_relaciones: '- **Conmutatividad de operadores**: $\sqrt[n]{a^m} = (\sqrt[n]{a})^m$ para toda base $a > 0$.

  - **Simplificación de fracciones**: $a^{4/6} = a^{2/3} = \sqrt[3]{a^2}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de exponente fraccionario](/static/img/nodos/relacion-entre-raiz-y-potencia-de-exponente-fraccionario-ejemplos.svg)


    Calcule el valor de $16^{3/4}$, exprese $\sqrt[5]{x^3}$ en forma de potencia y simplifique $4^{-1/2}$.'
  pasos:
  - 'Paso 1: Evaluar $16^{3/4}$: Transformar a radical $(\sqrt[4]{16})^3$. Como $\sqrt[4]{16} = 2$, se calcula $2^3 = 8$.'
  - 'Paso 2: Expresar $\sqrt[5]{x^3}$: Numerador es exponente $3$, denominador es índice $5 \implies x^{3/5}$.'
  - 'Paso 3: Evaluar $4^{-1/2}$: Exponente negativo invierte la base $\frac{1}{4^{1/2}} = \frac{1}{\sqrt{4}} = \frac{1}{2}$.'
  - 'Conclusión: Los resultados son $8$, $x^{3/5}$ y $\frac{1}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente a $27^{2/3}$?
  choices:
  - text: $9$ (porque $(\sqrt[3]{27})^2 = 3^2 = 9$)
    is_correct: true
  - text: $18$
    is_correct: false
  - text: $3$
    is_correct: false
  - text: $81$
    is_correct: false
  explanation: La alternativa correcta es '$9$ (porque $(\sqrt[3]{27})^2 = 3^2 = 9$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se escribe $\sqrt[3]{\sqrt{x}}$ usando exponentes fraccionarios?
  choices:
  - text: $x^{1/6}$ (porque $(x^{1/2})^{1/3} = x^{1/6}$)
    is_correct: true
  - text: $x^{5/6}$
    is_correct: false
  - text: $x^{2/3}$
    is_correct: false
  - text: $x^{3/2}$
    is_correct: false
  explanation: La alternativa correcta es '$x^{1/6}$ (porque $(x^{1/2})^{1/3} = x^{1/6}$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el numerador (potencia $m$) y el denominador (índice $n$) del exponente racional.'
- 'Paso 2: Escribir la equivalencia $\sqrt[n]{a^m}$ o $(\sqrt[n]{a})^m$.'
- 'Paso 3: Para calcular valores numéricos, evaluar primero la raíz $\sqrt[n]{a}$ y luego elevar el resultado a la potencia $m$.'
errores_correccion: '- **Error 1: Invertir los roles de numerador y denominador ($x^{2/3} = \sqrt{x^3}$).** **Cómo corregirlo:** Recordar siempre: el DENOMINADOR es el índice de la raíz ($x^{2/3} = \sqrt[3]{x^2}$).

  - **Error 2: Elevar primero a potencias enormes antes de extraer la raíz ($(\sqrt[3]{27})^2$ vs $\sqrt[3]{27^2}$).** **Cómo corregirlo:** Extraer la raíz primero: $(\sqrt[3]{27})^2 = 3^2 = 9$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué es igual $25^{1/2}$?
  alternativas:
  - $\sqrt{25} = 5$
  - $12,5$
  - $25/2$
  respuesta: $\sqrt{25} = 5$
  solucion_pasos:
  - $25^{1/2} = \sqrt{25} = 5$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la forma exponencial de $\sqrt[4]{a^7}$?
  alternativas:
  - $a^{7/4}$
  - $a^{4/7}$
  - $a^{28}$
  respuesta: $a^{7/4}$
  solucion_pasos:
  - Numerador 7, denominador 4 $\implies a^{7/4}$.
- titulo: ¿Es 8^(2/3) igual a 4?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(\sqrt[3]{8})^2 = 2^2 = 4$.
  alternativas:
  - texto: Sí, (∛8)² = 2² = 4
    es_correcta: true
    retroalimentacion: ¡Correcto! Se extrae la raíz cúbica y se eleva al cuadrado.
  - texto: No, es igual a 8/3
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente no multiplica a la base.
  - texto: No, es igual a 16
    es_correcta: false
    retroalimentacion: Incorrecto, $2^2 = 4$.
- titulo: ¿Es 9^(-1/2) igual a 1/3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $9^{-1/2} = 1/\sqrt{9} = 1/3$.
  alternativas:
  - texto: Sí, 1 / √9 = 1/3
    es_correcta: true
    retroalimentacion: ¡Correcto! Exponente negativo invierte y 1/2 es raíz cuadrada.
  - texto: No, es igual a -3
    es_correcta: false
    retroalimentacion: Incorrecto, el signo menos invierte la base, no el resultado.
  - texto: No, es igual a -1/3
    es_correcta: false
    retroalimentacion: Incorrecto, la raíz de 9 es positiva (+3).
errores_frecuentes:
- Invertir la fracción del exponente colocando el índice en el numerador.
- Multiplicar la base por la fracción en vez de calcular la potencia.
- Confundir exponente fraccionario negativo con resultado negativo.
- Calcular potencias complejas antes de extraer la raíz.
- Olvidar que $\sqrt{x} = x^{1/2}$.
afirmaciones_verdaderas:
- El denominador del exponente fraccionario corresponde siempre al índice del radical.
- La notación exponencial unifica las leyes de potencias y raíces.
- Para bases positivas se cumple $(\sqrt[n]{a})^m = \sqrt[n]{a^m} = a^{m/n}$.
al_terminar_debes_poder: '![Síntesis de exponente fraccionario](/static/img/nodos/relacion-entre-raiz-y-potencia-de-exponente-fraccionario-resumen.svg)


  QUÉ: Convertir, operar y simplificar expresiones entre radicales y potencias de exponente fraccionario.


  CÓMO: Aplicando la equivalencia $a^{m/n} = \sqrt[n]{a^m} = (\sqrt[n]{a})^m$, identificando el denominador como índice y el numerador como exponente, y empleando leyes de potencias racionales.'
