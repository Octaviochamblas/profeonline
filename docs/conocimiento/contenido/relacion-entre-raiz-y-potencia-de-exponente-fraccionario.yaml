semantic_id: MAT.NUM.RAICES_CONCEPTO.EXPONENTE_FRACCIONARIO
resumen_inicial: Toda raíz $n$-ésima puede expresarse como una potencia de exponente fraccionario
  ($\sqrt[n]{a^m} = a^{m/n}$), conectando directamente las propiedades de ambos temas.
explicacion_simple: 'Las raíces y las potencias son dos formas de escribir la misma idea matemática:

  $$\sqrt[n]{a^m} = a^{\frac{m}{n}}$$

  - El exponente de adentro ($m$) va arriba en la fracción (numerador).

  - El índice de la raíz ($n$) va abajo en la fracción (denominador).

  Ejemplo: $\sqrt[3]{x^2} = x^{2/3}$ y $\sqrt{y} = y^{1/2}$.'
explicacion_formal: Para todo $a \in \mathbb{R}^+$ y $m, n \in \mathbb{N}$ con $n \ge 2$,
  se define la equivalencia fundamental $\sqrt[n]{a^m} = a^{m/n}$. Esta notación unifica la
  operatoria algebraica de potencias y radicales bajo las mismas leyes de exponentes.
definiciones_clave: '- **Exponente fraccionario ($m/n$)**: Notación de potencia equivalente
  al radical $\sqrt[n]{a^m}$.'
propiedades_relaciones: '- **Raíz cuadrada básica**: $\sqrt{a} = a^{1/2}$.'
ejemplo_guiado:
  enunciado: Escribe en forma de exponente fraccionario A) $\sqrt[4]{x^3}$ y B) $\sqrt{5}$.
  pasos:
  - 'Para A: $\sqrt[4]{x^3} = x^{3/4}$ (numerador 3, denominador 4).'
  - 'Para B: $\sqrt{5} = \sqrt[2]{5^1} = 5^{1/2}$ (numerador 1, denominador 2).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se escribe el radical $\sqrt[5]{a^2}$ en forma de potencia?
  choices:
  - text: a^{2/5}
    is_correct: true
  - text: a^{5/2}
    is_correct: false
  - text: a^{10}
    is_correct: false
  - text: 2a / 5
    is_correct: false
  explanation: 'La correcta es: a^{2/5}. El exponente del radicando (2) va al numerador y
    el índice (5) al denominador.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Escribe la potencia $8^{1/3}$ en forma de radical.
  choices:
  - text: $\sqrt[3]{8}$
    is_correct: true
  - text: $\sqrt{8^3}$
    is_correct: false
  - text: 8 / 3
    is_correct: false
  - text: $\sqrt[8]{3}$
    is_correct: false
  explanation: 'La correcta es: $\sqrt[3]{8}$. El denominador 3 indica la raíz cúbica del
    número 8.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el índice $n$ de la raíz y el exponente $m$ del radicando.'
- 'Paso 2: Formar la fracción exponente con $m$ en el numerador y $n$ en el denominador.'
- 'Paso 3: Escribir la base elevada al exponente fraccionario $a^{m/n}$.'
errores_correccion: 'No inviertas los términos de la fracción. En $\sqrt[3]{x^4}$, el $4$
  va arriba y el $3$ abajo: $x^{4/3}$, no $x^{3/4}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Expresa $\sqrt{x}$ como potencia.
  alternativas:
  - x^{1/2}
  - x^2
  - x^{-2}
  respuesta: x^{1/2}
  solucion_pasos:
  - $\sqrt{x} = x^{1/2}$.
- titulo: Ejemplo 2
  enunciado: ¿Cómo se escribe la raíz cúbica de x^5 como potencia?
  alternativas:
  - x^{5/3}
  - x^{3/5}
  - x^{15}
  respuesta: x^{5/3}
  solucion_pasos:
  - El exponente 5 va al numerador y el índice 3 al denominador.
- titulo: Ejemplo 3
  enunciado: ¿Cómo se escribe 16^{3/4} como radical?
  alternativas:
  - Raíz cuarta de 16, elevada al cubo
  - Raíz cúbica de 16, elevada a la cuarta
  - 16 dividido en 3/4
  respuesta: Raíz cuarta de 16, elevada al cubo
  solucion_pasos:
  - El denominador 4 es el índice y el numerador 3 es el exponente del radicando.
- titulo: ¿Es correcto que la raíz cuadrada de a es igual a a^{1/2}?
  respuesta: Sí
  solucion_pasos:
  - El índice 2 (implícito) va al denominador del exponente fraccionario.
errores_frecuentes:
- Invertir el numerador y denominador del exponente fraccionario.
- Invertir el numerador y el denominador al convertir un radical a exponente fraccionario.
- Olvidar que el índice de la raíz corresponde siempre al denominador del exponente fraccionario.
- Aplicar el exponente fraccionario solo al radicando y no al índice completo de la raíz.
- Confundir la raíz cuadrada de a con a elevado a 2, en vez de a elevado a 1/2.
afirmaciones_verdaderas:
- $\sqrt[n]{a^m} = a^{m/n}$.
- El exponente fraccionario m/n debe estar simplificado para reflejar correctamente el índice
  real de la raíz equivalente.
al_terminar_debes_poder: Convertir bidireccionalmente entre radicales y potencias fraccionarias.
fuente: Texto escolar MINEDUC.
estado: publicado
