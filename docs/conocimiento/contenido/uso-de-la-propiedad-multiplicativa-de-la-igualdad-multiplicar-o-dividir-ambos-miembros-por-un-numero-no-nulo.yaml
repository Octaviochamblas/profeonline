errores_frecuentes:
- Dividir por 0 (matemáticamente imposible y explota el universo).
- En un lado dividir por 3 y en el otro por -3 (arruina el signo final).
- Moviste físicamente el número por arte de magia.
- Sumaste ese número repetidas veces.
- Cambiaste el signo de la división.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_ponder: Resolver ecuaciones y sistemas lineales aplicando uso de
  la propiedad multiplicativa de la igualdad (multiplicar o dividir ambos miembros
  por un número no nulo).
