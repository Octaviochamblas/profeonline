  enunciado: 'Respecto de «Uso de la propiedad multiplicativa de la igualdad (multiplicar
    o dividir ambos miembros por un número no nulo)»: ¿Es válida esta afirmación?
    «Dividir por 0 (matemáticamente imposible y explota el universo)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Si multiplicas o divides TODO
    el Primer Miembro y TODO el Segundo Miembro de una ecuación por la misma cantidad
