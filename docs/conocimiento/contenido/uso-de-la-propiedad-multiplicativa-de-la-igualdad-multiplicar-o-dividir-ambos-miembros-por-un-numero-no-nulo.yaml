semantic_id: MAT.ALG.ECUACION_BASE.PROPIEDAD_MULTIPLICATIVA
resumen_inicial: La propiedad multiplicativa de la igualdad establece que si se multiplica o divide ambos miembros por una cantidad no nula, la equivalencia de la ecuación se conserva.
explicacion_simple: |
  Si duplicas o reduces a la mitad la masa en ambos platillos de una balanza equilibrada de forma simultánea, la balanza se mantendrá en perfecto equilibrio.

  La **propiedad multiplicativa** nos autoriza a multiplicar o dividir el primer y segundo miembro de una ecuación por un mismo número real (siempre que sea distinto de cero) para simplificar coeficientes o despejar la incógnita sin alterar las soluciones.
explicacion_formal: |
  ### Definición formal
  Para cualesquiera expresiones $A, B, C \in \mathbb{R}$ con la restricción $C \neq 0$, la **propiedad multiplicativa de la igualdad** establece:

  $$A = B \iff A \cdot C = B \cdot C \quad \land \quad \frac{A}{C} = \frac{B}{C}$$

  ### Desglose de la fórmula
  - $C \neq 0$: Restricción indispensable para evitar la multiplicación por cero (que destruiría la información transformando todo en $0 = 0$) o la división por cero (operación no definida).

  ### Síntesis didáctica
  La regla procedimental de despeje ("lo que está multiplicando en un miembro pasa dividiendo al otro") es la consecuencia directa de dividir ambos miembros entre el coeficiente no nulo de la incógnita.
definiciones_clave: |
  - **Propiedad multiplicativa de la igualdad**: Principio uniforme que permite multiplicar o dividir ambos miembros por una constante no nula conservando el conjunto solución.
  - **Inverso multiplicativo (recíproco)**: Número $\frac{1}{C}$ que al multiplicarse por $C \neq 0$ produce el elemento neutro del producto ($C \cdot \frac{1}{C} = 1$).
propiedades_relaciones: |
  - **Prohibición del cero**: Multiplicar ambos lados por cero anula la ecuación produciendo una tautología trivial $0 = 0$ que destruye el conjunto solución original.
  - **Invarianza de soluciones**: Multiplicar o dividir por $C \neq 0$ genera siempre una ecuación equivalente.
ejemplo_guiado:
  enunciado: 'Aplica formalmente la propiedad multiplicativa para despejar la incógnita en la ecuación $4x = 20$ dividiendo ambos miembros entre $4$.'
  pasos:
    - 'Paso 1: Escribir la ecuación inicial: $4x = 20$.'
    - 'Paso 2: Aplicar la propiedad multiplicativa dividiendo ambos miembros entre $4 \neq 0$: $\frac{4x}{4} = \frac{20}{4}$.'
    - 'Paso 3: Simplificar los coeficientes $\frac{4}{4} = 1$: $1x = 5 \implies x = 5$.'
    - 'Paso 4: Verificar en la ecuación original sustituyendo $x = 5$: $4(5) = 20$, comprobando la veracidad de la igualdad.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición matemática obligatoria exige el divisor $C$ al aplicar la propiedad multiplicativa $\frac{A}{C} = \frac{B}{C}$?'
    choices:
      - {text: 'Debe ser un número real estrictamente distinto de cero ($C \neq 0$).', is_correct: true}
      - {text: 'Debe ser un número entero positivo únicamente.', is_correct: false}
      - {text: 'Debe coincidir obligatoriamente con la incógnita $x$.', is_correct: false}
      - {text: 'Debe ser mayor que el término independiente del segundo miembro.', is_correct: false}
    explanation: 'La alternativa correcta es ''Debe ser un número real estrictamente distinto de cero ($C \neq 0$).''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al aplicar la propiedad multiplicativa dividiendo entre $4$ a ambos miembros de $4x = 20$, ¿cuál es la solución obtenida?'
    choices:
      - {text: '$x = 5$', is_correct: true}
      - {text: '$x = 80$', is_correct: false}
      - {text: '$x = 16$', is_correct: false}
      - {text: '$x = 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 5$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el coeficiente numérico $a$ que multiplica a la incógnita $x$.'
  - 'Paso 2: Confirmar la condición $a \neq 0$.'
  - 'Paso 3: Dividir (o multiplicar por el recíproco $\frac{1}{a}$) el primer y segundo miembro de la ecuación.'
  - 'Paso 4: Simplificar los coeficientes para aislar la variable obteniendo $x = c$.'
errores_correccion: |
  - **Error 1:** Multiplicar o dividir ambos miembros por cero para eliminar términos. **Cómo corregirlo:** Multiplicar por cero elimina la variable **Y CONVIERTE LA ECUACIÓN EN LA TAUTOLOGÍA $0 = 0$, PERDIENDO EL CONJUNTO SOLUCIÓN ORIGINAL**.
  - **Error 2:** Dividir únicamente el primer miembro entre el coeficiente olvidando dividir el segundo. **Cómo corregirlo:** La propiedad multiplicativa **EXIGE OPERAR EXACTAMENTE EL MISMO FACTOR O DIVISOR EN AMBOS MIEMBROS A LA VEZ**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Qué operación en ambos miembros despeja la incógnita en la ecuación $\frac{x}{3} = 7$?'
    alternativas:
      - 'Multiplicar ambos miembros por $3$'
      - 'Dividir ambos miembros entre $3$'
      - 'Sumar $3$ a ambos miembros'
    respuesta: 'Multiplicar ambos miembros por $3$'
    solucion_pasos:
      - '1. El divisor de $x$ es $3$.'
      - '2. Aplicar multiplicativa por $3$: $\left(\frac{x}{3}\right) \cdot 3 = 7 \cdot 3 \implies x = 21$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al resolver $-2x = 14$ aplicando la propiedad multiplicativa, ¿cuál es el divisor adecuado para ambos miembros?'
    alternativas:
      - 'Dividir entre $-2$'
      - 'Dividir entre $2$'
      - 'Multiplicar por $-14$'
    respuesta: 'Dividir entre $-2$'
    solucion_pasos:
      - '1. Coeficiente de $x$ es $-2$.'
      - '2. Dividir entre $-2$: $\frac{-2x}{-2} = \frac{14}{-2} \implies x = -7$.'
  - titulo: 'Multiplicación por constante negativa'
    enunciado: '¿Multiplicar ambos miembros por $-1$ revierte los signos de la ecuación manteniendo la equivalencia?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $-1 \neq 0$ y preserva las soluciones.'
  - titulo: 'División por cero'
    enunciado: '¿Está permitido dividir ambos miembros de una ecuación por una expresión que se anula?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, la división entre cero no está definida en $\mathbb{R}$.'
errores_frecuentes:
  - 'Dividir únicamente el coeficiente del primer miembro sin aplicar la división al término independiente del segundo.'
  - 'Intentar aplicar la propiedad multiplicativa dividiendo o multiplicando entre cero.'
  - 'Olvidar el signo negativo del coeficiente principal al dividir ambos miembros.'
  - 'Confundir la multiplicación por el recíproco con la adición del opuesto aditivo.'
  - 'Multiplicar solo el primer sumando de un miembro compuesto omitiendo la distribución.'
afirmaciones_verdaderas:
  - 'La propiedad multiplicativa garantiza que multiplicar o dividir ambos miembros por $C \neq 0$ genera ecuaciones equivalentes.'
  - 'Dividir ambos miembros entre el coeficiente de la variable es la base formal para despejar la incógnita.'
al_terminar_debes_poder: |
  QUÉ: Aplicar la propiedad multiplicativa de la igualdad para despejar la incógnita en ecuaciones lineales.
  CÓMO: Multiplicar o dividir ambos miembros por un mismo factor no nulo $C \neq 0$ y simplificar los coeficientes para obtener $x = c$.
fuente: 'Texto escolar MINEDUC — Álgebra 7° Básico / Ecuaciones Lineales.'
