semantic_id: MAT.ALG.ECUACION_BASE.PROPIEDAD_MULTIPLICATIVA
resumen_inicial: La propiedad multiplicativa establece que si se multiplica o divide
  ambos miembros de una igualdad por un número no nulo, la igualdad permanece.
explicacion_simple: 'Si duplicas o divides a la mitad el peso en ambos lados de una
  balanza equilibrada, la balanza sigue en equilibrio.

  La **propiedad multiplicativa** nos autoriza a multiplicar o dividir el primer y
  el segundo miembro de una ecuación por el mismo número (siempre que no sea cero)
  para despejar el coeficiente de la incógnita.'
explicacion_formal: 'Para todas las expresiones $A, B, C \in \mathbb{R}$ con $C \neq
  0$, la **propiedad multiplicativa de la igualdad** establece:


  $$A = B \iff A \cdot C = B \cdot C \quad \land \quad \frac{A}{C} = \frac{B}{C}$$


  **Desglose de la fórmula:**

  - $C \neq 0$: Restricción fundamental que evita multiplicar por cero (lo que destruiría
  la información de la ecuación) o dividir por cero (indeterminado).'
definiciones_clave: '- **Propiedad multiplicativa de la igualdad**: Ley que permite
  multiplicar o dividir ambos miembros por un escalar no nulo conservando las soluciones.

  - **Coeficiente no nulo**: Factor $C \neq 0$ utilizado para operar la multiplicación
  o división.'
propiedades_relaciones: '- **Fundamento del despeje final**: La regla de ''lo que
  está multiplicando pasa dividiendo'' es consecuencia de dividir ambos miembros entre
  el coeficiente de la variable.'
ejemplo_guiado:
  enunciado: Aplica formalmente la propiedad multiplicativa para despejar la incógnita
    en la ecuación $4x = 20$ dividiendo ambos miembros entre $4$.
  pasos:
  - 'Paso 1: Escribir la ecuación inicial: $4x = 20$.Paso 2: Aplicar la propiedad
    multiplicativa dividiendo ambos miembros entre $4 \neq 0$: $\frac{4x}{4} = \frac{20}{4}$.Paso
    3: Simplificar $\frac{4}{4} = 1$: $1x = 5 \implies x = 5$.Paso 4: Verificar en
    la ecuación original: $4(5) = 20$ (se verifica la igualdad).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición obligatoria debe cumplir el número $C$ al aplicar la propiedad
    multiplicativa $\frac{A}{C} = \frac{B}{C}$?
  choices:
  - text: Debe ser un número distinto de cero ($C \neq 0$).
    is_correct: true
  - text: Debe ser un número entero positivo únicamente.
    is_correct: false
  - text: Debe ser igual a la variable $x$.
    is_correct: false
  - text: Debe ser mayor que el primer miembro.
    is_correct: false
  explanation: La alternativa correcta es 'Debe ser un número distinto de cero ($C
    \neq 0$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al aplicar la propiedad multiplicativa dividiendo entre $4$ a ambos lados
    de $4x = 20$, ¿cuál es la solución obtenida?
  choices:
  - text: $x = 5$
    is_correct: true
  - text: $x = 80$
    is_correct: false
  - text: $x = 16$
    is_correct: false
  - text: $x = 4$
    is_correct: false
  explanation: La alternativa correcta es '$x = 5$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el coeficiente numérico $a$ que multiplica a la incógnita $x$.'
- 'Paso 2: Verificar que $a \neq 0$.'
- 'Paso 3: Dividir el primer y segundo miembro de la ecuación entre el coeficiente
  $a$.'
- 'Paso 4: Simplificar las fracciones en ambos lados para obtener $x = c$.'
errores_correccion: '- **Error común:** Multiplicar o dividir ambos miembros por cero
  para ''hacer desaparecer'' los términos.

  - **Cómo corregirlo:** Multiplicar por cero elimina la variable y convierte cualquier
  ecuación en $0 = 0$, perdiendo la solución.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de igualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de igualdades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar la misma cantidad en ambos miembros preserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Una ecuación se cumple para todos los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una ecuación condicional solo se cumple para valores específicos.
errores_frecuentes:
- Confundir la definición de una igualdad numérica con la de una expresión algebraica.
- Asumir que las identidades solo son válidas para números enteros positivos.
- Confundir los miembros de una ecuación con sus términos individuales.
- Sumar o restar una cantidad en un solo lado de la ecuación al intentar despejar.
- Dividir ambos miembros de la ecuación entre cero.
afirmaciones_verdaderas:
- Una ecuación es una igualdad condicionada que se verifica solo para determinados
  valores de la incógnita.
- Aplicar las propiedades aditiva y multiplicativa en ambos miembros de una ecuación
  genera ecuaciones equivalentes.
al_terminar_debes_poder: Al finalizar este recurso podrás definir conceptos fundamentales
  de ecuaciones de primer grado y aplicar las propiedades de la igualdad.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Primer Grado
