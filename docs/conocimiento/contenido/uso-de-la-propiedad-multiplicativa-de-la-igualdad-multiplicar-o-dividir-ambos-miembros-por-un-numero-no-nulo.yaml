procedimiento:
- 'Paso 1: Asegúrate de que el término que tiene la incógnita esté aislado (ya aplicaste
  sumas y restas).'
- 'Paso 2: Identifica el coeficiente (el número que multiplica a la incógnita).'
- 'Paso 3: Divide a ambos lados de la ecuación por ese mismo coeficiente.'
- 'Paso 4: Simplifica las fracciones para obtener tu ''x'' desnuda.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en uso de la propiedad multiplicativa de la igualdad (multiplicar o dividir
  ambos miembros por un número no nulo).
ejemplos:
- titulo: 'Despeja aplicando la propiedad: $5y = 35$'
  enunciado: 'Despeja aplicando la propiedad: $5y = 35$.'
  solucion_pasos:
  - El 5 está multiplicando a la 'y'.
  - 'Dividimos ambos lados entre 5: $\frac{5y}{5} = \frac{35}{5}$.'
  - 'Simplificamos: $1y = 7$.'
  - 'Respuesta: $y = 7$.'
- titulo: Si tengo $\frac{x}{2} = 8$, ¿qué operación aplico?
  solucion_pasos:
  - Multiplicar por 2 elimina la división por 2 del lado izquierdo.
- titulo: Respecto de «Uso de la propiedad multiplicativa de la igualdad (multiplicar
    o dividir ambos
  enunciado: 'Respecto de «Uso de la propiedad multiplicativa de la igualdad (multiplicar
    o dividir ambos miembros por un número no nulo)»: ¿Es correcta esta caracterización?
    «Si multiplicas o divides TODO el Primer Miembro y TODO el Segundo Miembro de
    una ecuación por la misma cantidad (distinta de cero), la igualdad se mantiene»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Si multiplicas o divides TODO
    el Primer Miembro y TODO el Segundo Miembro de una ecuación por la misma cantidad
    (distinta de cero), la igualdad se mantiene.'
- titulo: Respecto de «Uso de la propiedad multiplicativa de la igualdad (multiplicar
