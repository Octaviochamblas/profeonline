semantic_id: MAT.ALG.ECUACION_BASE.PROPIEDAD_MULTIPLICATIVA
resumen_inicial: 'Uso de la propiedad multiplicativa de la igualdad (multiplicar o
  dividir ambos miembros por un número no nulo): propiedades, resolución y modelamiento
  en Ecuación de primer grado: conceptos y propiedades.'
explicacion_simple: Si podemos añadir pesas a la balanza, también podemos duplicar
  todo su peso o reducirlo a la mitad, siempre y cuando lo hagamos parejo. Esta es
  la segunda gran regla de las ecuaciones.
explicacion_formal: '### Definición formal


  Al multiplicar ambos lados, el número de la división en la izquierda se cancela,
  y aparece multiplicando en la derecha.


  ### Desarrollo didáctico


  Situación común: $3x = 12$.

  Significa ''El triple de mi incógnita pesa 12''.

  ¿Cómo descubro el peso de una sola $x$? Dividiendo ambas partes entre 3.

  $\frac{3x}{3} = \frac{12}{3}$

  Los tres de la izquierda se simplifican (dan $1x$, que es $x$).

  $x = 4$.


  Esto es lo que conoces como ''si está multiplicando, pasa dividiendo''.


  **OJO (Advertencia Letal):** Cuando divides o multiplicas, afecta a TODO EL MIEMBRO.

  Si la ecuación fuera $3x + 1 = 12$, y decides dividir por 3, debes dividir todo:
  $\frac{3x + 1}{3} = \frac{12}{3}$. Por eso siempre se recomienda hacer sumas/restas
  PRIMERO, y dejar esta regla de multiplicar/dividir para el final, cuando la $x$
  esté sola con su coeficiente.'
definiciones_clave: '- **Uso de la propiedad multiplicativa de la igualdad (multiplicar
  o dividir ambos miembros por un número no nulo)**: Herramienta matemática para determinar
  valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a uso de la propiedad multiplicativa de la
  igualdad (multiplicar o dividir ambos miembros por un número no nulo).'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando uso de la propiedad
    multiplicativa de la igualdad (multiplicar o dividir ambos miembros por un número
    no nulo).
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de uso de la propiedad
    multiplicativa de la igualdad (multiplicar o dividir ambos miembros por un número
    no nulo).
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
