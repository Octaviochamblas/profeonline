semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.RECONOCIMIENTO_MODELO
resumen_inicial: 'Reconocimiento de situaciones que pueden modelarse mediante funciones
  potencia: forma general $f(x) = a x^n$, simetría, dominio y recorrido en Modelamiento
  y aplicaciones en contexto.'
explicacion_simple: Muchas situaciones cotidianas, como el área de una figura o la
  fuerza de atracción entre objetos, siguen relaciones donde una cantidad depende
  de otra elevada a una potencia fija.
explicacion_formal: '### Definición formal


  Una situación se modela con una función potencia si existe una constante $a\neq0$
  y un exponente fijo $n$ tal que la magnitud dependiente $y$ se relaciona con la
  magnitud independiente $x$ mediante $y=a\cdot x^n$, sin que $x$ aparezca en el exponente
  ni dentro de un logaritmo.


  ### Desarrollo didáctico


  El área de un cuadrado de lado $x$ es $A(x)=x^2$: es una función potencia con $a=1$,
  $n=2$. En cambio, el crecimiento de una población que se duplica cada año, $P(t)=P_0\cdot2^t$,
  no es función potencia, porque la variable está en el exponente.'
definiciones_clave: '- **Reconocimiento de situaciones que pueden modelarse mediante
  funciones potencia**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in
  \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a reconocimiento de situaciones que pueden modelarse mediante
  funciones potencia.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de reconocimiento de situaciones que pueden modelarse mediante funciones potencia.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de reconocimiento de situaciones
    que pueden modelarse mediante funciones potencia.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar reconocimiento de situaciones que pueden modelarse mediante funciones
    potencia?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en modelamiento y aplicaciones en contexto
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en modelamiento y aplicaciones en contexto.
    El exponente n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en reconocimiento de situaciones que pueden modelarse mediante
    funciones potencia?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica la magnitud independiente y la dependiente en la situación descrita.'
- 'Paso 2: Verifica si la variable independiente aparece en la base, con exponente
  fijo.'
- 'Paso 3: Si se cumple, escribe el modelo en la forma $y=a\cdot x^n$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en reconocimiento de situaciones que pueden modelarse mediante funciones
  potencia.
ejemplos:
- titulo: Reconocimiento en el área de un círculo
  enunciado: ¿El área de un círculo $A(r)=\pi r^2$ es un modelo de función potencia?
  solucion_pasos:
  - La variable $r$ está en la base, elevada al exponente fijo $2$.
  - Sí, es un modelo de función potencia con $a=\pi$ y $n=2$.
- titulo: Distinción respecto a un modelo exponencial
  enunciado: ¿El interés compuesto $C(t)=1000\cdot1{,}05^t$ es un modelo de función
    potencia?
  solucion_pasos:
  - La variable $t$ está en el exponente, no en la base.
  - No, corresponde a un modelo exponencial, no a una función potencia.
- titulo: ¿Todo modelo con exponente visible es una función potencia?
  enunciado: ¿Cualquier modelo matemático que incluya un exponente es automáticamente
    una función potencia?
  respuesta: 'No'
  solucion_pasos:
  - Solo lo es si la variable independiente está en la base y el exponente es constante.
- titulo: ¿El volumen de un cubo de arista $x$ es un modelo de función potencia?
  enunciado: ¿El volumen $V(x)=x^3$ de un cubo de arista $x$ corresponde a una función
    potencia?
  respuesta: Sí
  solucion_pasos:
  - La variable $x$ está en la base, elevada al exponente fijo $3$.
errores_frecuentes:
- Declarar un modelo de función potencia con uno exponencial por tener ambos un exponente.
- No identificar correctamente cuál magnitud es la variable independiente.
- Suponer que el exponente debe ser necesariamente $2$ o $3$, ignorando otros valores
  posibles.
- Ignorar el coeficiente $a$ al describir el modelo, dejándolo implícito sin justificación.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  reconocimiento de situaciones que pueden modelarse mediante funciones potencia.
