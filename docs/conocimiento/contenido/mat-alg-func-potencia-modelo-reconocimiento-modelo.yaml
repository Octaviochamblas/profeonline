semantic_id: MAT.ALG.FUNC_POTENCIA_MODELO.RECONOCIMIENTO_MODELO
resumen_inicial: 'Un modelo de función potencia $f(x) = a x^n$ describe relaciones donde la magnitud variable constituye la base $x$ elevada a una potencia constante $n$.'
explicacion_simple: |
  En el mundo real, muchas situaciones físicas, geométricas y económicas se pueden modelar con una función potencia $f(x) = a x^n$. La clave para reconocer este modelo es identificar que la variable que cambia (como el lado de un cuadrado, la velocidad del viento o el radio de una esfera) está en la base $x$, mientras que la potencia $n$ es un exponente numérico fijo (como 2, 3 o -1). Esto se diferencia de los modelos exponenciales $f(x) = a \cdot b^x$, donde la variable está arriba en el exponente.
explicacion_formal: |
  ### Definición formal
  El **reconocimiento analítico del modelo de función potencia** en contextos aplicados exige verificar que la cantidad dependiente $y = f(x)$ responda a la estructura multiplicativa escalar de base variable:
  $$y = a \cdot x^n \quad (a \in \mathbb{R} \setminus \{0\}, \; n \in \mathbb{R} \setminus \{0\})$$

  ### Criterios de diferenciación de modelos
  1. **Modelo de Función Potencia ($y = a x^n$)**:
     - Variable $x$ en la **base** de la potencia.
     - Exponente $n$ constante y fijo.
     - Ejemplo: Áreas ($A = s^2$), Volúmenes ($V = s^3$), Fuerza gravitacional ($F = k \cdot r^{-2}$).
  2. **Modelo Exponencial ($y = a \cdot b^x$)**:
     - Variable $x$ en el **exponente**.
     - Base $b > 0$ constante y fija.
     - Ejemplo: Interés compuesto, crecimiento bacteriano ($N = N_0 \cdot 2^t$).

  ### Síntesis didáctica
  Regla de proporcionalidad escalada: En un modelo potencia $y = a x^n$, si la entrada se multiplica por un factor de escala $c$, la salida se multiplica por $c^n$:
  $$f(c \cdot x) = a (c \cdot x)^n = c^n \cdot (a x^n) = c^n \cdot f(x)$$
definiciones_clave: |
  - **Modelo potencia $a x^n$**: Ecuación matemática donde la variable independiente actúa como la base de una potencia fija.
  - **Factor de escala $c^n$**: Factor multiplicativo por el cual cambia la salida al escalar la entrada por $c$.
  - **Base variable $x$**: Magnitud independiente que cambia en la situación contextual.
propiedades_relaciones: |
  - **Relación con variaciones proporcionales**: Si $n = 1$, la función potencia coincide con la variación de proporcionalidad directa $y = a x$.
  - **Identificación en tablas de datos**: Comprobar si al duplicar $x$, la respuesta $y$ se quadruplica ($2^2 = 4$) para exponente 2, o se octuplica ($2^3 = 8$) para exponente 3.
ejemplo_guiado:
  enunciado: 'Determina si las siguientes situaciones corresponden a un modelo de función potencia $y = a x^n$ o exponencial $y = a b^x$: A) El área de una superficie circular de radio $r$ dada por $A(r) = \pi r^2$, B) El crecimiento de bacterias $N(t) = 500 \cdot 3^t$ según las horas $t$.'
  pasos:
    - 'Paso 1: Para $A(r) = \pi r^2$, la variable independiente es el radio $r$. El radio $r$ se ubica en la **base** elevada al exponente constante $2$. Es un **modelo de función potencia**.'
    - 'Paso 2: Para $N(t) = 500 \cdot 3^t$, la variable independiente es el tiempo $t$. El tiempo $t$ se ubica en el **exponente** sobre la base fija $3$. Es un **modelo exponencial**.'
    - 'Paso 3: Conclusión: $A(r)$ es función potencia y $N(t)$ es función exponencial.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué rasgo algebraico fundamental permite clasificar a la fórmula física de la energía cinetica $E(v) = \frac{1}{2} m v^2$ como un modelo de función potencia respecto a la velocidad $v$?'
    choices:
      - {text: 'Que la variable independiente $v$ actúa como la base elevada a la potencia constante 2', is_correct: true}
      - {text: 'Que la velocidad $v$ aparece en el exponente sobre la masa $m$', is_correct: false}
      - {text: 'Que la masa $m$ es una variable que cambia continuamente', is_correct: false}
      - {text: 'Que la fórmula no tiene coeficientes constantes', is_correct: false}
    explanation: 'La alternativa correcta es ''Que la variable independiente $v$ actúa como la base elevada a la potencia constante 2''. En las funciones potencia la variable $v$ es la base de la potencia.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en un modelo potencia $f(x) = a x^3$ se duplica el valor de la variable de entrada de $x$ a $2x$, ¿por qué factor se multiplica el valor de salida $f(x)$?'
    choices:
      - {text: 'Por un factor de $8$, ya que el factor de escala se eleva al cubo ($2^3 = 8$)', is_correct: true}
      - {text: 'Por un factor de $2$, manteniéndose igual', is_correct: false}
      - {text: 'Por un factor de $6$, multiplicando $2 \cdot 3$', is_correct: false}
      - {text: 'Por un factor de $3$, igual al exponente', is_correct: false}
    explanation: 'La alternativa correcta es ''Por un factor de $8$, ya que el factor de escala se eleva al cubo ($2^3 = 8$)''. En $f(c x) = a(c x)^n = c^n a x^n$, duplicar la entrada en grado 3 eleva $2^3 = 8$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la variable independiente $x$ y la variable dependiente $y$ en el contexto planteado.'
  - 'Paso 2: Comprobar que la variable independiente $x$ esté ubicada en la base de la potencia.'
  - 'Paso 3: Verificar que el exponente $n$ sea una constante fija (entero, negativo o fraccionario).'
  - 'Paso 4: Confirmar la estructura $y = a x^n$ y distinguirla de modelos lineales o exponenciales.'
errores_correccion: |
  - **Error 1:** Confundir la función potencia $y = a x^n$ con la función exponencial $y = a \cdot b^x$. **Cómo corregirlo:** Si la variable está en la base (ej: $x^3$), es una función **potencia**. Si la variable está en el exponente (ej: $3^x$), es una función **exponencial**.
  - **Error 2:** Creer que un modelo potencia no puede tener coeficientes constantes como $\pi$ o $\frac{1}{2}$. **Cómo corregirlo:** Los coeficientes constantes corresponden al parámetro de escala $a$, el cual multiplica la potencia de base variable $a x^n$.
ejemplos:
  - titulo: 'Reconocimiento en modelo geométrico'
    enunciado: '¿El volumen de una esfera $V(r) = \frac{4}{3}\pi r^3$ es una función potencia?'
    alternativas:
      - 'Sí, con variable $r$ en la base y exponente 3'
      - 'No, es exponencial'
      - 'No, es lineal'
    respuesta: 'Sí, con variable $r$ en la base y exponente 3'
    solucion_pasos:
      - '1. La variable $r$ es la base de la potencia $r^3$.'
      - '2. Es una función potencia con $a = \frac{4}{3}\pi$ y $n = 3$.'
  - titulo: 'Reconocimiento en modelo de física'
    enunciado: '¿La intensidad de luz $I(d) = \frac{k}{d^2} = k d^{-2}$ es una función potencia?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La distancia $d$ es la base con exponente negativo $-2$.'
  - titulo: 'Escalamiento de la entrada en exponente cuadrático'
    enunciado: 'En $f(x) = a x^2$, si triplicamos $x$, ¿la salida se multiplica por 9?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(3x) = a(3x)^2 = 3^2 (a x^2) = 9 f(x)$.'
  - titulo: 'Diferenciación con modelo exponencial'
    enunciado: '¿La función $f(t) = 100 \cdot 2^t$ es una función potencia?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. La variable $t$ está en el exponente, por lo que es una función exponencial.'
errores_frecuentes:
  - 'Un modelo de función potencia presenta la variable independiente ubicada en el exponente.'
  - 'La función $f(x) = 3^x$ se clasifica como una función potencia.'
  - 'Al triplicar la entrada $x$ en el modelo $y = a x^2$, la salida se triplica de forma lineal.'
  - 'Los coeficientes constantes como $\pi$ en $A(r) = \pi r^2$ impiden que la expresión sea una función potencia.'
  - 'Las funciones potencia sólo aceptan coeficientes enteros en su formulación.'
afirmaciones_verdaderas:
  - 'En un modelo de función potencia $y = a x^n$, la magnitud variable constituye la base de la potencia y se eleva a un exponente constante.'
  - 'Si en un modelo potencia $y = a x^n$ se escala la variable de entrada por un factor $c$, la salida se escala por el factor $c^n$.'
al_terminar_debes_poder: |
  QUÉ: Reconocer situaciones contextuales que obedecen a un modelo de función potencia $y = a \cdot x^n$.
  CÓMO: Evaluar si la relación entre variables presenta tasas de variación proporcionales a potencias directas o inversas.
