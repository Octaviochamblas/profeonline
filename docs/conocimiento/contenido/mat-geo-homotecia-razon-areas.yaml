semantic_id: MAT.GEO.HOMOTECIA.RAZON_AREAS
resumen_inicial: 'Relación entre áreas de figuras homotéticas como cuadrado de la
  razón de homotecia: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia,
  Semejanza y Homotecia.'
explicacion_simple: Al igual que ocurre con la semejanza en general, las áreas de
  figuras relacionadas por una homotecia siguen una regla de escalamiento cuadrática.
explicacion_formal: '![Razón entre áreas homotéticas](/static/img/geometria/congruencia-semejanza/homotecia-razon-areas.svg)


  ### Definición formal


  Si $A_1$ es el área de la figura original y $A_2$ el área de su imagen bajo homotecia
  de razón $k$, entonces $\frac{A_2}{A_1}=k^2$.


  ### Desarrollo didáctico


  Una homotecia con razón $k=-3$ aplicada a un triángulo de área 8 cm² produce una
  imagen de área $8\times(-3)^2=8\times9=72$ cm²; nótese que se usa $k^2$ (siempre
  positivo), no $|k|$, aunque para el área el resultado sea equivalente ya que $k^2=|k|^2$.'
definiciones_clave: '- **Relación entre áreas de figuras homotéticas como cuadrado
  de la razón de homotecia**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación entre áreas de figuras homotéticas
  como cuadrado de la razón de homotecia.'
