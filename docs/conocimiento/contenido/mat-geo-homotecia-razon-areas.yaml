    como cuadrado de la razón de homotecia.
  - Sustituir las magnitudes conocidas $a = 18$ y $b = 24$.
  - Calcular el valor numérico final para relación entre áreas de figuras homotéticas
    como cuadrado de la razón de homotecia.
