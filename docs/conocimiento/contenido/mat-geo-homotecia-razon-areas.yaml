procedimiento:
- 'Paso 1: Identifica el área de la figura original y la razón de homotecia k.'
- 'Paso 2: Eleva la razón k al cuadrado (el resultado siempre será positivo).'
- 'Paso 3: Multiplica el área original por k² para obtener el área de la figura imagen.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con relación entre áreas de figuras homotéticas como cuadrado
  de la razón de homotecia.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de relación entre áreas de figuras homotéticas como
