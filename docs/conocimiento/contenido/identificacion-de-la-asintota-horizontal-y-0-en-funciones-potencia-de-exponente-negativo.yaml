semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.ASINTOTA_HORIZONTAL
resumen_inicial: La identificación de la asíntota horizontal $y = 0$ en funciones potencia con exponente negativo $f(x) = \frac{a}{x^k}$ demuestra que $\lim_{x \to \pm\infty} f(x) = 0$, estableciendo que la recta horizontal del eje de abscisas es el límite asintótico global cuando la variable tiende a infinito.
explicacion_simple: "![La identificación de la asíntota horizontal $y = 0$ en funciones potencia con exponente negativo $f(x) = \\frac{a}{x^k}$ demuestra que $\\lim_{x \\to \\pm\\infty} f(x) = 0$, estableciendo que la recta horizontal del eje de abscisas es el límite asintótico global cuando la variable tiende a infinito](/static/img/nodos/identificacion-de-la-asintota-horizontal-y-0-en-funciones-potencia-de-exponente-negativo-intro.svg)\n\n\n¿Qué pasa cuando $x$ se vuelve un número gigantesco ($x = 1.000, 1.000.000$) en una función como $f(x) = \\frac{1}{x}$ o $f(x) = \\frac{4}{x^2}$?\n\n- **Cálculo con números enormes:**\n  - Si $x = 100 \\implies 1 / 100 = \\mathbf{0{,}01}$.\n  - Si $x = 1.000.000 \\implies 1 / 1.000.000 = \\mathbf{0{,}000001}$ (casi cero).\n- **La Asíntota Horizontal:**\n  - A medida que te alejas hacia la derecha ($+\\infty$) o hacia la izquierda ($-\\infty$), la altura $y$ **se acerca cada vez más a cero**.\n  - La curva se aplasta sobre la recta horizontal **$y =\
  \ 0$ (el eje $X$)**, pero **NUNCA la toca** porque el numerador $a$ no es cero."
explicacion_formal: 'Sea $f(x) = a \cdot x^{-k} = \frac{a}{x^k}$ con $k \in \mathbb{Z}^+$ y $a \in \mathbb{R}^*$.

  Por la definición formal de asíntota horizontal, una recta $\mathcal{A}_H: y = L$ es asíntota horizontal si $\lim_{x \to +\infty} f(x) = L$ o $\lim_{x \to -\infty} f(x) = L$.


  Evaluando los límites en el infinito:

  $$\lim_{x \to +\infty} \frac{a}{x^k} = a \cdot \lim_{x \to +\infty} \frac{1}{x^k} = a \cdot 0 = 0$$

  $$\lim_{x \to -\infty} \frac{a}{x^k} = a \cdot \lim_{x \to -\infty} \frac{1}{x^k} = a \cdot 0 = 0$$

  Dado que ambos límites convergen idénticamente a cero, la recta horizontal:

  $$\mathcal{A}_H: y = 0$$

  es la asíntota horizontal bilateral de la función.'
definiciones_clave: '- **Asíntota horizontal**: Recta horizontal $y = L$ hacia la cual se estabiliza la curva en el infinito.

  - **Convergencia asintótica nula**: Fenómeno donde las ordenadas tienden infinitesimalmente a cero.'
propiedades_relaciones: '- **Ecuación del eje $X$**: La recta $y = 0$ coincide exactamente con el eje de abscisas.

  - **No intersección en el finito**: La ecuación $\frac{a}{x^k} = 0 \iff a = 0$, lo cual es imposible pues $a \neq 0$, garantizando que la curva no cruza jamás su asíntota horizontal.'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación de la asíntota horizontal $y = 0$ en funciones potencia con exponente negativo $f(x) = \frac{a}{x^k}$ demuestra que $\lim_{x \to \pm\infty} f(x) = 0$, estableciendo que la recta horizontal del eje de abscisas es el límite asintótico global cuando la variable tiende a infinito](/static/img/nodos/identificacion-de-la-asintota-horizontal-y-0-en-funciones-potencia-de-exponente-negativo-ejemplos.svg)



    Analiza los límites en el infinito y comprueba la asíntota horizontal para:

    1) $f(x) = \frac{8}{x^3}$

    2) Demuestra que $f(x)$ nunca toca al eje $X$.'
  pasos:
  - 'Paso 1: Límites en infinito:

    - $\lim_{x \to +\infty} \frac{8}{x^3} = \frac{8}{+\infty} = \mathbf{0}$.

    - $\lim_{x \to -\infty} \frac{8}{x^3} = \frac{8}{-\infty} = \mathbf{0}$.

    - Como el límite es cero $\implies$ **Asíntota Horizontal: $\mathcal{A}_H: y = 0$**.'
  - 'Paso 2: Plantear intersección con el eje $X$ ($y = 0$):

    - $\frac{8}{x^3} = 0 \implies 8 = 0 \cdot x^3 \implies 8 = 0$ (Contradicción).

    - Esto demuestra formalmente que la curva **se aproxima asintóticamente a $y = 0$ sin cruzarla jamás**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la ecuación de la asíntota horizontal de la función $f(x) = -6x^{-4}$?
  choices:
  - text: y = 0 (la recta del eje X)
    is_correct: true
  - text: x = 0 (la recta del eje Y)
    is_correct: false
  - text: y = -6
    is_correct: false
  - text: x = -6
    is_correct: false
  explanation: La alternativa correcta es 'y = 0 (la recta del eje X)'. Cuando $x \to \pm\infty$, el cociente $-6/x^4$ tiende a 0.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la función $f(x) = 5/x$ no corta al eje X en ningún punto?
  choices:
  - text: Porque 5/x = 0 requeriría que el numerador fuera 0, lo cual es falso
    is_correct: true
  - text: Porque corta al eje Y
    is_correct: false
  - text: Porque x no puede ser negativo
    is_correct: false
  - text: Sí corta al eje X en x = 5
    is_correct: false
  explanation: La alternativa correcta es 'Porque 5/x = 0 requeriría que el numerador fuera 0, lo cual es falso'. Una fracción no nula nunca se anula.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear los límites en el infinito $\lim_{x \to +\infty} \frac{a}{x^k}$ y $\lim_{x \to -\infty} \frac{a}{x^k}$.'
- 'Paso 2: Concluir que al ser el grado del denominador mayor que el del numerador, el límite es 0.'
- 'Paso 3: Formular la ecuación de la asíntota horizontal como $\mathcal{A}_H: y = 0$.'
- 'Paso 4: Trazar la curva aproximándose al eje $X$ sin intersectarlo.'
errores_correccion: '- **Error común:** Escribir la asíntota horizontal como $x = 0$ o como $y = a$.

  - **Cómo corregirlo:** Las rectas **horizontales** tienen la forma **$y = \text{constante}$**, y como el límite es cero, la asíntota horizontal es **$y = 0$**.'
ejemplos:
- titulo: 'Ejemplo 1: Límite en más infinito'
  enunciado: 'Calcula $\lim_{x \to +\infty} \frac{100}{x^2}$:'
  alternativas:
  - '0'
  - +infinito
  - '100'
  - '1'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $100 / (+\infty) = 0$.'
- titulo: 'Ejemplo 2: Ecuación de la asíntota'
  enunciado: 'La asíntota horizontal de $g(x) = \frac{2}{x^5}$ es:'
  alternativas:
  - y = 0
  - x = 0
  - y = 2
  - x = 2
  respuesta: y = 0
  solucion_pasos:
  - 'Paso 1: La recta asintótica en el infinito es $y = 0$.'
- titulo: 'Ejemplo 3: Coincidencia con eje X'
  enunciado: ¿Qué recta del plano representa a la asíntota horizontal $y = 0$?
  alternativas:
  - El eje X (eje de abscisas)
  - El eje Y (eje de ordenadas)
  - La recta diagonal
  - Una recta oblicua
  respuesta: El eje X (eje de abscisas)
  solucion_pasos:
  - 'Paso 1: La ecuación $y = 0$ define el eje X.'
- titulo: 'Ejemplo 4: Límite en menos infinito'
  enunciado: 'Calcula $\lim_{x \to -\infty} \left(-\frac{7}{x^3}\right)$:'
  alternativas:
  - '0'
  - -infinito
  - +infinito
  - '-7'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $-7 / (-\infty) = 0$.'
errores_frecuentes:
- Confundir la asíntota horizontal (y = 0) con la vertical (x = 0).
- Creer que la asíntota horizontal es el valor del coeficiente a.
- Asumir que la función corta al eje X en valores muy lejanos.
afirmaciones_verdaderas:
- Toda función potencia con exponente entero negativo posee una asíntota horizontal en la recta y = 0.
- Cuando |x| tiende a infinito, la gráfica se aproxima asintóticamente al eje X sin intersectarlo jamás.
al_terminar_debes_poder: '**QUÉ:** Identificar y justificar la asíntota horizontal y = 0 en funciones potencia con exponente negativo.


  **CÓMO:** Calculando el límite en el infinito lim x→±∞ a/xᵏ = 0 para establecer la ecuación de la recta y = 0.


