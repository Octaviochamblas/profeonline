semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.INCENTRO_EQUIDISTANCIA_LADOS
resumen_inicial: 'Propiedad del incentro como punto equidistante de los lados del
  triángulo: conceptos, teoremas, propiedades geométricas y cálculo en Elementos Secundarios
  del Triángulo.'
explicacion_simple: Una propiedad notable del incentro es que, sin importar la forma
  del triángulo, su distancia perpendicular a cada uno de los tres lados es siempre
  la misma.
explicacion_formal: '![Incentro equidistante de los tres lados](/static/img/geometria/elementos-secundarios/bisectriz-incentro-incentro-equidistancia-lados.svg)


  ### Definición formal


  Si I es el incentro de un triángulo ABC, las distancias perpendiculares de I a los
  lados AB, BC y CA son todas iguales entre sí, y esa distancia común es el radio
  de la circunferencia inscrita.


  ### Desarrollo didáctico


  Esta propiedad es consecuencia directa de que I está sobre las tres bisectrices:
  todo punto de una bisectriz es equidistante de los dos lados que forman ese ángulo,
  y al estar I en las tres bisectrices a la vez, queda equidistante de los tres lados.'
