procedimiento:
- 'Paso 1: Identifica la base circular y el vértice (fuera del plano de la base) del
  cuerpo.'
- 'Paso 2: Reconoce la superficie lateral curva que conecta el vértice con el borde
  de la base.'
- 'Paso 3: Identifica el radio (r), la altura (h) y la generatriz (g), relacionados
  por g²=r²+h².'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con definición de cono.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de definición de cono para determinar la medida
    solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando definición de cono.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de definición de cono y elige la respuesta
    adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de definición de cono.
- titulo: ¿Se cumple siempre la propiedad principal de definición de cono en figuras
    congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede definición de cono asumir un valor negativo cuando representa una
    longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en definición de cono.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en definición
  de cono.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en definición de
  cono.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de definición
  de cono.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
