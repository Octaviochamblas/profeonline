semantic_id: MAT.GEO.CUERPOS_REDONDOS_BASE.CONO_DEFINICION
resumen_inicial: 'Definición de cono: conceptos, teoremas, propiedades geométricas
  y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'Un cono es como un helado de barquillo o un gorro de fiesta:
  una base circular que se estrecha hasta un único punto (el vértice).'
explicacion_formal: '![Definición de cono](/static/img/geometria/espacio-cuerpos/cono-definicion.svg)


  ### Definición formal


  Un cono recto tiene una base circular de radio $r$, un vértice (o cúspide) ubicado
  a una altura $h$ sobre el centro de la base, y una superficie lateral curva. La
  distancia desde el vértice hasta cualquier punto del borde de la base se llama generatriz
  ($g$).


  ### Desarrollo didáctico


  En la figura, el cono tiene su base circular de radio $r$, su altura $h$ (distancia
  perpendicular desde el vértice hasta el centro de la base) y su generatriz $g$ (la
  línea inclinada desde el vértice hasta el borde de la base). Por el teorema de Pitágoras,
  $g^2=r^2+h^2$.'
definiciones_clave: '- **Definición de cono**: Elemento o propiedad fundamental en
  el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a definición de cono.'
