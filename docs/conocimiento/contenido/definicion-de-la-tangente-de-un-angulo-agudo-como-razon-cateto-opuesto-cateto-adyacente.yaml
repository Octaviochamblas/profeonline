semantic_id: MAT.GEO.TRIGONOMETRIA_BASICA.TANGENTE_DEFINICION
resumen_inicial: 'La tangente de un ángulo agudo $\alpha$ en un triángulo rectángulo es la razón entre el cateto opuesto y el cateto adyacente: $\tan(\alpha) = \frac{\text{Cateto Opuesto}}{\text{Cateto Adyacente}} = \frac{\sin(\alpha)}{\cos(\alpha)}$.'
explicacion_simple: |
  ![Definición de la Tangente: tan(α) = Opuesto / Adyacente](/static/img/nodos/definicion-de-la-tangente-de-un-angulo-agudo-como-razon-cateto-opuesto-cateto-adyacente-intro.svg)

  Divides el cateto de enfrente (opuesto) por el cateto de al lado (adyacente). ¡No se usa la hipotenusa!
explicacion_formal: |
  ### Definición formal
  En un triángulo rectángulo $\Delta ABC$ con $\gamma = 90^\circ$ y ángulo agudo $\alpha = \angle A$, se define la **tangente** del ángulo $\alpha$, denotada $\tan(\alpha)$, como la razón entre ambos catetos:

  $$\tan(\alpha) = \frac{\|\overline{BC}\|}{\|\overline{AC}\|} = \frac{\text{Cateto Opuesto}}{\text{Cateto Adyacente}} = \frac{a}{b}$$

  ### Desglose simbólico y geométrico
  - $a$: Cateto opuesto a $\alpha$.
  - $b$: Cateto adyacente a $\alpha$.
  - Identidad trigonométrica por cociente:

  $$\tan(\alpha) = \frac{a/c}{b/c} = \frac{\sin(\alpha)}{\cos(\alpha)}$$

  - Interpretación como pendiente de una recta: La inclinación de una recta de ecuación $y = mx + n$ satisface $m = \tan(\theta)$, donde $\theta$ es el ángulo formado con el eje positivo de las abscisas.

  ### Síntesis didáctica
  La tangente relaciona directamente ambos catetos sin depender de la hipotenusa, siendo la herramienta primordial para calcular alturas inaccesibles y pendientes topográficas.
definiciones_clave: |
  - **Cateto Opuesto**: Lado situado enfrente del ángulo agudo considerado.
  - **Cateto Adyacente**: Lado que forma parte del ángulo agudo considerado junto con la hipotenusa.
  - **Hipotenusa**: Lado de mayor longitud opuesto al ángulo recto de $90^\circ$.
  - **Razón trigonométrica**: Cociente adimensional entre dos lados de un triángulo rectángulo.
propiedades_relaciones: |
  - **SOH-CAH-TOA**: Regla mnemotécnica para $\sin = \text{Op}/\text{Hip}$, $\cos = \text{Ady}/\text{Hip}$, $\tan = \text{Op}/\text{Ady}$.
  - **Identidad pitagórica**: $\sin^2(\alpha) + \cos^2(\alpha) = 1$.
  - **Cociente de tangente**: $\tan(\alpha) = \frac{\sin(\alpha)}{\cos(\alpha)}$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Definición de la Tangente: tan(α) = Opuesto / Adyacente](/static/img/nodos/definicion-de-la-tangente-de-un-angulo-agudo-como-razon-cateto-opuesto-cateto-adyacente-ejemplos.svg)

    Aplica la definición trigonométrica y el procedimiento de despeje para determinar el valor solicitado en el triángulo rectángulo.
  pasos:
  - 'Paso 1: Identificar el ángulo agudo de referencia $\alpha$ y clasificar los lados en cateto opuesto, cateto adyacente e hipotenusa.'
  - 'Paso 2: Seleccionar la razón trigonométrica adecuada (seno, coseno o tangente).'
  - 'Paso 3: Escribir la ecuación trigonométrica y sustituir los valores numéricos conocidos.'
  - 'Paso 4: Despejar algebraicamente la incógnita mediante multiplicación o división.'
  - 'Paso 5: Registrar la solución acompañada de su unidad métrica o como valor adimensional.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define la tangente de un ángulo agudo α en un triángulo rectángulo?
  choices:
  - text: $\tan(\alpha) = \frac{\text{Cateto Opuesto}}{\text{Cateto Adyacente}}$
    is_correct: true
  - text: Opción incorrecta de prueba A
    is_correct: false
  - text: Opción incorrecta de prueba B
    is_correct: false
  - text: Opción incorrecta de prueba C
    is_correct: false
  explanation: 'Se define como $\tan(\alpha) = \frac{\text{Cateto Opuesto}}{\text{Cateto Adyacente}}$, es decir, el cociente entre el cateto opuesto y el cateto adyacente.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en un triángulo rectángulo el cateto opuesto mide 6 cm y el cateto adyacente mide 8 cm, ¿cuánto vale tan(α)?
  choices:
  - text: $\frac{6}{8} = 0{,}75$
    is_correct: true
  - text: $10\text{ cm}$
    is_correct: false
  - text: $100\text{ cm}$
    is_correct: false
  - text: $5\text{ cm}$
    is_correct: false
  explanation: 'Vale $\frac{6}{8} = 0{,}75$, ya que $\tan(\alpha) = \frac{6}{8} = \frac{3}{4} = 0{,}75$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el ángulo agudo dato en el triángulo rectángulo.'
- 'Paso 2: Reconocer cuál es el cateto opuesto (frontal) y cuál es el cateto adyacente (contiguo).'
- 'Paso 3: Aplicar $\sin(\alpha) = a/c$, $\cos(\alpha) = b/c$ o $\tan(\alpha) = a/b$.'
- 'Paso 4: Resolver la ecuación lineal resultante para hallar la longitud o razón pedida.'
- 'Paso 5: Comprobar la coherencia del resultado con el Teorema de Pitágoras.'
errores_correccion: 'Ten siempre presente el ángulo de referencia: si cambias al otro ángulo agudo, los roles de cateto opuesto y adyacente se invierten exactamente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor correspondiente calculado a partir de la definición trigonométrica?
  alternativas:
  - '$\frac{6}{8} = 0{,}75$'
  - 'Valor incorrecto 1'
  - 'Valor incorrecto 2'
  respuesta: '$\frac{6}{8} = 0{,}75$'
  solucion_pasos:
  - 'Vale $\frac{6}{8} = 0{,}75$, ya que $\tan(\alpha) = \frac{6}{8} = \frac{3}{4} = 0{,}75$.'
- titulo: Ejemplo 2
  enunciado: ¿El seno y el coseno de un ángulo agudo pueden ser mayores que 1 en un triángulo rectángulo?
  alternativas:
  - No, siempre son estrictamente menores que 1 porque ningún cateto puede superar a la hipotenusa
  - Sí, siempre son mayores que 1
  - Solo si los catetos son iguales
  respuesta: No, siempre son estrictamente menores que 1 porque ningún cateto puede superar a la hipotenusa
  solucion_pasos:
  - 'Como la hipotenusa $c$ es el lado más largo ($c > a$ y $c > b$), las fracciones $a/c$ y $b/c$ son siempre menores que 1.'
- titulo: ¿La tangente de un ángulo agudo es igual al seno dividido por el coseno?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $\tan(\alpha) = \frac{\sin(\alpha)}{\cos(\alpha)} = \frac{a/c}{b/c} = \frac{a}{b}$.'
- titulo: ¿La razón seno utiliza el cateto adyacente dividido por la hipotenusa?
  respuesta: 'No'
  solucion_pasos:
  - 'No, el seno usa el cateto OPUESTO dividido por la hipotenusa ($a/c$). El cateto adyacente sobre la hipotenusa corresponde al COSENO ($b/c$).'
errores_frecuentes:
- 'Confundir el cateto opuesto con el adyacente al cambiar el ángulo de referencia.'
- 'Dividir por el cateto en vez de por la hipotenusa al calcular el seno o coseno.'
- 'Creer que la tangente no puede ser mayor que 1 (la tangente sí puede superar a 1 cuando el opuesto es mayor que el adyacente).'
- 'Olvidar que las razones trigonométricas en triángulos rectángulos solo aplican a ángulos agudos.'
- 'No verificar el modo de la calculadora (Grados sexagesimales DEG vs Radianes RAD).'
afirmaciones_verdaderas:
- 'En todo triángulo rectángulo, $\sin(\alpha) = \frac{\text{Cateto Opuesto}}{\text{Hipotenusa}}$ y $\cos(\alpha) = \frac{\text{Cateto Adyacente}}{\text{Hipotenusa}}$.'
- 'La identidad pitagórica fundamental establece que $\sin^2(\alpha) + \cos^2(\alpha) = 1$.'
al_terminar_debes_poder: |
  **QUÉ:** Definir, identificar y calcular el seno, coseno y tangente de ángulos agudos en triángulos rectángulos.

  **CÓMO:** Reconociendo los catetos opuesto y adyacente respecto al ángulo de referencia y aplicando las razones $\sin\alpha = \frac{a}{c}$, $\cos\alpha = \frac{b}{c}$ y $\tan\alpha = \frac{a}{b}$.

  ![Resumen de Razones Trigonométricas](/static/img/nodos/definicion-de-la-tangente-de-un-angulo-agudo-como-razon-cateto-opuesto-cateto-adyacente-resumen.svg)
