procedimiento:
- 'Paso 1: Identificar una expresión con el complemento de una intersección: $(A \cap B)^c$.'
- 'Paso 2: Distribuir el complemento a cada conjunto operando: $A \mapsto A^c$ y $B \mapsto B^c$.'
- 'Paso 3: Transformar el operador de intersección $\cap$ en operador de unión $\cup$.'
- 'Paso 4: Escribir la expresión resultante como $A^c \cup B^c$.'
- 'Paso 5: En el diagrama de Venn, sombrear todo el rectángulo universal excepto la región central compartida $A \cap B$.'
errores_correccion: '- **Error 1:** Distribuir el complemento manteniendo el operador de intersección (ej. escribir $(A \cap B)^c = A^c \cap B^c$). **Cómo corregirlo:** La ley de De Morgan exige invertir el operador: la intersección $\cap$ se convierte obligatoriamente en unión $\cup$.

  - **Error 2:** Creer que $(A \cap B)^c = \emptyset$ cuando los conjuntos son disjuntos. **Cómo corregirlo:** Si $A \cap B = \emptyset$, entonces $(A \cap B)^c = \emptyset^c = \mathcal{U}$ (abarca todo el universo).

  '
ejemplos:
- titulo: De Morgan con conjuntos disjuntos
  enunciado: Si $A \cap B = \emptyset$, ¿cuánto vale $A^c \cup B^c$?
  alternativas:
  - $\mathcal{U}$
  - $\emptyset$
  - $A \cup B$
  respuesta: $\mathcal{U}$
  solucion_pasos:
  - 1. $(A \cap B)^c = \emptyset^c = \mathcal{U}$.
  - 2. Por De Morgan, $A^c \cup B^c = \mathcal{U}$.
- titulo: De Morgan con tres conjuntos
  enunciado: ¿A qué equivale $(A \cap B \cap C)^c$?
  respuesta: $A^c \cup B^c \cup C^c$
  solucion_pasos:
  - Se niega cada conjunto y las intersecciones pasan a ser uniones.
  alternativas:
  - texto: $A^c \cup B^c \cup C^c$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
- titulo: Complemento de diferencia
  enunciado: Expresa $(A \setminus B)^c$ usando leyes de De Morgan.
  respuesta: $A^c \cup B$
  solucion_pasos:
  - $(A \setminus B)^c = (A \cap B^c)^c = A^c \cup (B^c)^c = A^c \cup B$.
  alternativas:
  - texto: $A^c \cup B$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la propiedad estudiada.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la propiedad garantiza equivalencia unívoca.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos dados permiten calcular el resultado con precisión.
- titulo: Región en diagrama de Venn
  enunciado: ¿Qué región representa $(A \cap B)^c$ en el diagrama de Venn?
  respuesta: Todo el universo excepto la intersección central
  solucion_pasos:
  - Cubre solo A, solo B y la región exterior.
  alternativas:
  - texto: Todo el universo excepto la intersección central
