semantic_id: MAT.FUND.PROPIEDADES_CONJUNTOS.DE_MORGAN_COMPLEMENTO_INTERSECCION
resumen_inicial: 'Demostración lógica, propiedades, diagramas de Venn y aplicación de la Segunda Ley de De Morgan: $(A \cap B)^c = A^c \cup B^c$.'
explicacion_simple: 'La **Segunda Ley de De Morgan** establece que el **complemento de una intersección es igual a la unión de los complementos**:

  $$(A \cap B)^c = A^c \cup B^c$$

  En palabras simples: no estar en la intersección de $A$ y $B$ significa **no estar en $A$ O no estar en $B$** (basta con estar fuera de al menos uno de ellos). La regla práctica para distribuir el complemento es: **se niega cada conjunto ($A^c$ y $B^c$) y el símbolo de intersección $\cap$ se da vuelta para transformarse en unión $\cup$**. En un diagrama de Venn, representa **todo el universo excepto la pequeña zona central donde se cruzan los círculos**.


  ![ley-de-de-morgan-para-el-complemento-de-una-interseccion](/static/img/nodos/ley-de-de-morgan-para-el-complemento-de-una-interseccion-intro.svg)'
explicacion_formal: "### Definición formal\nEn la teoría de conjuntos y el álgebra booleana, la **Segunda Ley de De Morgan** establece la dualidad de la intersección bajo la complementación:\n$$\\forall A, B \\subseteq \\mathcal{U}, \\quad (A \\cap B)^c = A^c \\cup B^c$$\nDemostración formal basada en la negación lógica de la conjunción:\n$$x \\in (A \\cap B)^c \\iff \\neg(x \\in (A \\cap B)) \\iff \\neg(x \\in A \\land x \\in B) \\iff (\\neg(x \\in A) \\lor \\neg(x \\in B)) \\iff (x \\in A^c \\lor x \\in B^c) \\iff x \\in (A^c \\cup B^c)$$\nPor el axioma de extensionalidad, se concluye formalmente que $(A \\cap B)^c = A^c \\cup B^c$.\n\n### Desglose simbólico\n- Ley lógica subyacente: $\\neg(P \\land Q) \\equiv \\neg P \\lor \\neg Q$.\n- Generalización a familias indexadas:\n  $$\\left(\\bigcap_{i \\in I} A_i\\right)^c = \\bigcup_{i \\in I} A_i^c$$\n- En diagramas de Venn: Representa todo el rectángulo $\\mathcal{U}$ excluyendo exclusivamente la lenteja central $A \\cap B$.\n\n### Síntesis\
  \ didáctica\nLa Segunda Ley de De Morgan convierte la negación de una membresía conjunta en una disyunción de exclusiones individuales.\n"
definiciones_clave: '- **Segunda Ley de De Morgan**: Teorema fundamental que establece $(A \cap B)^c = A^c \cup B^c$.

  - **Dualidad de conjunción y disyunción**: Principio por el cual la negación permuta los roles de $\land$ y $\lor$.

  - **Negación de la conjunción**: Equivalencia lógica $\neg(P \land Q) \equiv \neg P \lor \neg Q$.

  '
propiedades_relaciones: '- **Cardinalidad del complemento de la intersección**: $|(A \cap B)^c| = |\mathcal{U}| - |A \cap B|$.

  - **Diferencia relativa en De Morgan**: Permite reescribir $(A \setminus B)^c = (A \cap B^c)^c = A^c \cup B$.

  '
ejemplo_guiado:
  enunciado: 'Dado el universo $\mathcal{U} = \{1, 2, 3, 4, 5, 6\}$ y los subconjuntos $A = \{1, 2, 3\}$ y $B = \{2, 3, 4\}$, demuestra la Segunda Ley de De Morgan calculando $(A \cap B)^c$ y $A^c \cup B^c$.


    ![Ejemplo ley-de-de-morgan-para-el-complemento-de-una-interseccion](/static/img/nodos/ley-de-de-morgan-para-el-complemento-de-una-interseccion-ejemplos.svg)'
  pasos:
  - 'Paso 1: Resolver el lado izquierdo $(A \cap B)^c$: - Calcular la intersección: $A \cap B = \{1, 2, 3\} \cap \{2, 3, 4\} = \{2, 3\}$. - Calcular el complemento respecto a $\mathcal{U}$: $(A \cap B)^c = \mathcal{U} \setminus \{2, 3\} = \{1, 4, 5, 6\}$.'
  - 'Paso 2: Resolver el lado derecho $A^c \cup B^c$: - Calcular $A^c = \mathcal{U} \setminus \{1, 2, 3\} = \{4, 5, 6\}$. - Calcular $B^c = \mathcal{U} \setminus \{2, 3, 4\} = \{1, 5, 6\}$. - Unir ambos complementos: $A^c \cup B^c = \{4, 5, 6\} \cup \{1, 5, 6\} = \{1, 4, 5, 6\}$.'
  - 'Paso 3: Comparar ambos resultados: $\{1, 4, 5, 6\} = \{1, 4, 5, 6\}$.'
  - 'Paso 4: Concluir formalmente que $(A \cap B)^c = A^c \cup B^c$.'
