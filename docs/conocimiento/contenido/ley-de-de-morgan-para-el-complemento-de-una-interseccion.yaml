errores_frecuentes:
- La afirmación de que el complemento de la intersección es igual a la intersección de los complementos ($(A \cap B)^c = A^c \cap B^c$).
- La afirmación de que $(A \cap B)^c$ es siempre igual al conjunto vacío.
- La afirmación de que la Segunda Ley de De Morgan no es aplicable en conjuntos infinitos.
- La afirmación de que la unión de complementos $A^c \cup B^c$ sombrea únicamente la región central.
- La afirmación de que la ley de De Morgan para la intersección no permite la simplificación de complementos de diferencias.
afirmaciones_verdaderas:
- La Segunda Ley de De Morgan establece que el complemento de la intersección es idéntico a la unión de los complementos ($(A \cap B)^c = A^c \cup B^c$).
- La validez de esta ley se fundamenta en la tautología lógica de la negación de una conjunción ($\neg(P \land Q) \equiv \neg P \lor \neg Q$).
al_terminar_debes_poder: 'QUÉ: Enunciar, demostrar y aplicar la Segunda Ley de De Morgan ($(A \cap B)^c = A^c \cup B^c$).

  CÓMO: Transformar el complemento de una intersección en la unión de complementos aplicando la ley lógica $\neg(P \land Q) \equiv \neg P \lor \neg Q$ e interpretarlo en diagramas de Venn.


