semantic_id: MAT.ALG.EC_CUADR_BASE.INCOMPLETA_MONOMIA
resumen_inicial: 'Identificación de ecuaciones cuadráticas incompletas de la forma
  ax² = 0: concepto, discriminante, soluciones y modelamiento en Conceptos y formas
  de la ecuación cuadrática.'
explicacion_simple: 'En el caso más simplificado de todos, la ecuación cuadrática
  se reduce a un único término: el cuadrático.'
explicacion_formal: '### Definición formal


  Una ecuación de segundo grado es incompleta monomia si tiene la forma $ax^2=0$,
  es decir, $b=0$ y $c=0$ simultáneamente, mientras $a \neq 0$. Solo permanece el
  término cuadrático.


  ### Desarrollo didáctico


  Se reconoce porque, al ordenar la ecuación en forma general, no queda ningún otro
  término aparte de $ax^2$. Al dividir ambos lados por $a$, se obtiene directamente
  $x^2=0$, cuya única solución es $x=0$ (raíz doble).


  La ecuación $7x^2=0$ es incompleta monomia: solo está presente el término cuadrático,
  y su única solución es $x=0$.'
definiciones_clave: '- **Identificación de ecuaciones cuadráticas incompletas de la
  forma ax² = 0**: Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en identificación
  de ecuaciones cuadráticas incompletas de la forma ax² = 0.'
