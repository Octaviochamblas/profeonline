semantic_id: MAT.ALG.EC_CUADR_BASE.INCOMPLETA_MONOMIA
resumen_inicial: Una ecuación cuadrática es monomia de la forma $a x^2 = 0$ cuando
  tanto su coeficiente lineal como su término independiente son cero ($b = 0$ y $c
  = 0$).
explicacion_simple: 'Una **ecuación cuadrática monomia** es la versión más reducida
  posible ($a x^2 = 0$):

  - No tiene término lineal ($b = 0$).

  - No tiene término independiente ($c = 0$).

  - Ejemplo: $7x^2 = 0$.

  - Su única solución real es el número cero repetido dos veces ($x_1 = x_2 = 0$,
  solución doble).'
explicacion_formal: 'La **ecuación cuadrática incompleta de la forma $a x^2 = 0$**
  es la monomia cuadrática reducida:


  $$a x^2 = 0 \quad \text{con } a \neq 0 \quad \land \quad b = 0, c = 0$$


  **Desglose de la fórmula:**

  - Raíz doble o de multiplicidad 2 en el origen: $x^2 = 0 \implies x_1 = x_2 = 0$.'
definiciones_clave: '- **Incompleta monomia ($a x^2 = 0$)**: Ecuación cuadrática de
  un solo término donde $b = 0$ y $c = 0$.

  - **Solución doble / de multiplicidad 2**: Solución repetida dos veces para la misma
  ecuación cuadrática.'
propiedades_relaciones: '- **Unicidad de solución**: $x = 0$ es la única solución
  real existente para cualquier ecuación monomia $a x^2 = 0$.'
ejemplo_guiado:
  enunciado: Identifica los coeficientes y resuelve la ecuación cuadrática $-4x^2
    = 0$.
  pasos:
  - 'Paso 1: Identificar los coeficientes: $a = -4$, $b = 0$ y $c = 0$.Paso 2: Confirmar
    que es una ECUACIÓN MONOMIA de la forma $a x^2 = 0$.Paso 3: Dividir entre $-4$:
    $x^2 = \frac{0}{-4} \implies x^2 = 0$.Paso 4: Extraer raíz cuadrada: $x = 0$ (raíz
    doble).'
checkpoints:
- placement: after_explicacion_formal
  question: En la ecuación cuadrática $-4x^2 = 0$, ¿cuáles son los valores de sus
    coeficientes $b$ y $c$?
  choices:
  - text: $b = 0$ y $c = 0$, siendo una ecuación monomia.
    is_correct: true
  - text: $b = -4$ y $c = 0$
    is_correct: false
  - text: $b = 0$ y $c = -4$
    is_correct: false
  - text: $b = 1$ y $c = 1$
    is_correct: false
  explanation: La alternativa correcta es '$b = 0$ y $c = 0$, siendo una ecuación
    monomia.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el conjunto solución de cualquier ecuación de la forma $a x^2
    = 0$ con $a \neq 0$?
  choices:
  - text: S = \{0\} (solución real única doble en cero).
    is_correct: true
  - text: S = \{a, -a\}
    is_correct: false
  - text: S = \emptyset$ (conjunto vacío).
    is_correct: false
  - text: S = \mathbb{R}$ (todos los reales).
    is_correct: false
  explanation: La alternativa correcta es 'S = \{0\} (solución real única doble en
    cero).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la ecuación en la forma $a x^2 = 0$.'
- 'Paso 2: Comprobar que $b = 0$ y $c = 0$.'
- 'Paso 3: Dividir la ecuación entre el coeficiente $a$ para despejar $x^2 = 0$.'
- 'Paso 4: Concluir que la única solución es $x = 0$ (raíz doble).'
errores_correccion: '- **Error común:** Creer que $-4x^2 = 0$ no tiene solución porque
  el coeficiente es negativo.

  - **Cómo corregirlo:** Al dividir $0 / -4$ da $0$, obteniendo $x^2 = 0 \implies
  x = 0$ sin inconvenientes de signos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de ecuación cuadrática.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de ecuación cuadrática.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Toda ecuación cuadrática requiere a != 0 en ax^2 + bx + c = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, a != 0 es la condición indispensable para mantener el grado 2.
- titulo: ¿La forma general de una ecuación cuadrática está igualada a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, ax^2 + bx + c = 0 es la forma estándar canónica igualada a cero.
errores_frecuentes:
- Declarar que una ecuación es cuadrática sin antes simplificar los términos $x^2$
  que podrían cancelarse.
- Extraer los coeficientes $a, b, c$ antes de haber igualado la ecuación a cero en
  su forma general.
- Incluir la letra $x$ o $x^2$ al dar el valor numérico de un coeficiente (decir $a
  = 2x^2$ en lugar de $a = 2$).
- Confundir la ecuación incompleta binomia ($a x^2 + b x = 0$) con la incompleta pura
  ($a x^2 + c = 0$).
- Dividir una ecuación por la incógnita $x$ eliminando la solución fundamental $x
  = 0$.
afirmaciones_verdaderas:
- Una ecuación es de segundo grado si en su forma reducida $a x^2 + b x + c = 0$ el
  coeficiente principal satisface $a \neq 0$.
- Toda ecuación cuadrática incompleta de la forma $a x^2 + b x = 0$ admite obligatoriamente
  a $x = 0$ como una de sus soluciones reales.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, clasificar, normalizar
  y reconocer la forma general y los coeficientes a, b y c de ecuaciones cuadráticas
  completas e incompletas.
