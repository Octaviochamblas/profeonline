semantic_id: MAT.ALG.FUNC_CUADR_BASE.FORMA_GENERAL
resumen_inicial: 'La forma general de una función cuadrática representa su regla mediante el trinomio ordenado $f(x) = ax^2 + bx + c$, donde cada término cumple un rol estructural preciso.'
explicacion_simple: |
  La forma general es la manera canónica de escribir la regla de una función cuadrática ordenando sus términos desde la potencia más alta hasta la constante. Se presenta como tres términos sumados: el término cuadrático en $x^2$, el término lineal en $x$ y el término independiente constante sin variable.
explicacion_formal: |
  ### Definición formal
  La **forma general** de una función cuadrática es la representación polinomial desarrollada:
  $$f(x) = ax^2 + bx + c$$
  donde los coeficientes pertenecen al conjunto de los números reales ($a, b, c \in \mathbb{R}$) con la condición $a \neq 0$.

  ### Desglose simbólico
  - $ax^2$: **Término cuadrático**. Es el elemento dominante que le da la curvatura a la gráfica. Su coeficiente es $a$.
  - $bx$: **Término lineal**. Modula el desplazamiento horizontal del vértice y la inclinación de la parábola al cruzar el eje $y$. Su coeficiente es $b$.
  - $c$: **Término independiente**. Es una constante pura que corresponde al valor $f(0)$, indicando la posición del corte con el eje vertical.

  ### Síntesis didáctica
  Toda función cuadrática expresada en otras formas (canónica o factorizada) puede llevarse a la forma general mediante el desarrollo algebraico de sus productos y la reducción de términos semejantes.
definiciones_clave: |
  - **Forma general de la función cuadrática**: Expresión polinomial del tipo $f(x) = ax^2 + bx + c$ ordenada en potencias decrecientes de $x$.
  - **Término cuadrático**: Sub-expresión $ax^2$ cuyo exponente es 2.
  - **Término lineal**: Sub-expresión $bx$ de exponente 1.
  - **Término independiente**: Constante $c$ que no posee variable $x$.
propiedades_relaciones: |
  - **Identificación directa del corte con el eje $y$**: En la forma general, la parábola interseca al eje $y$ exactamente en el punto de coordenadas $(0, c)$.
  - **Reordenamiento algebraico**: Expresiones como $f(x) = c + bx + ax^2$ o $f(x) = bx + ax^2$ corresponden a la misma forma general una vez identificados los coeficientes según el grado de la variable.
ejemplo_guiado:
  enunciado: 'Expresa la función $f(x) = (2x - 1)(x + 3) - 4$ en su forma general $f(x) = ax^2 + bx + c$ y especifica el valor numérico de los coeficientes $a$, $b$ y $c$.'
  pasos:
    - 'Paso 1: Aplicamos la propiedad distributiva para multiplicar los binomios: $(2x - 1)(x + 3) = 2x^2 + 6x - x - 3 = 2x^2 + 5x - 3$.'
    - 'Paso 2: Sustituimos el producto en la función y restamos la constante externa: $f(x) = (2x^2 + 5x - 3) - 4 = 2x^2 + 5x - 7$.'
    - 'Paso 3: Comparamos $f(x) = 2x^2 + 5x - 7$ con $ax^2 + bx + c$, identificando $a = 2$, $b = 5$ y $c = -7$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Dada la función cuadrática $f(x) = 7 - 4x + 2x^2$, ¿cuál es su correcta presentación en forma general ordenada y sus coeficientes correspondientes?'
    choices:
      - {text: '$f(x) = 2x^2 - 4x + 7$, con $a = 2$, $b = -4$, $c = 7$', is_correct: true}
      - {text: '$f(x) = 7 - 4x + 2x^2$, con $a = 7$, $b = -4$, $c = 2$', is_correct: false}
      - {text: '$f(x) = -4x + 2x^2 + 7$, con $a = -4$, $b = 2$, $c = 7$', is_correct: false}
      - {text: '$f(x) = 2x^2 + 4x + 7$, con $a = 2$, $b = 4$, $c = 7$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = 2x^2 - 4x + 7$, con $a = 2$, $b = -4$, $c = 7$''. El coeficiente $a$ acompaña a $x^2$, $b$ acompaña a $x$, y $c$ es la constante.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al desarrollar y llevar a la forma general la función $g(x) = -(x - 3)^2 + 5$, ¿cuáles son sus coeficientes $a$, $b$ y $c$?'
    choices:
      - {text: '$a = -1$, $b = 6$, $c = -4$', is_correct: true}
      - {text: '$a = -1$, $b = -6$, $c = 14$', is_correct: false}
      - {text: '$a = 1$, $b = -6$, $c = 4$', is_correct: false}
      - {text: '$a = -1$, $b = 3$, $c = 5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = -1$, $b = 6$, $c = -4$''. Desarrollamos $g(x) = -(x^2 - 6x + 9) + 5 = -x^2 + 6x - 9 + 5 = -x^2 + 6x - 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Desarrollar todos los productos, cuadrados de binomio o paréntesis presentes en la regla funcional.'
  - 'Paso 2: Agrupar y sumar/restar los términos semejantes de segundo grado ($x^2$), de primer grado ($x$) y las constantes numéricas.'
  - 'Paso 3: Ordenar la expresión final en forma decreciente: $ax^2 + bx + c$ y extraer los valores de $a$, $b$ y $c$ respetando sus signos.'
errores_correccion: |
  - **Error 1:** Asignar los coeficientes $a$, $b$ y $c$ según el orden de aparición en el texto y no por la potencia de la variable. **Cómo corregirlo:** El coeficiente $a$ es siempre el que acompaña a $x^2$, independientemente de si se ubica al principio o al final de la fórmula.
  - **Error 2:** Omitir incluir el signo negativo en los coeficientes. **Cómo corregirlo:** En la función $f(x) = x^2 - 5x - 3$, la forma general es $1x^2 + (-5)x + (-3)$, por lo que $b = -5$ y $c = -3$.
ejemplos:
  - titulo: 'Desarrollo de forma canónica a forma general'
    enunciado: '¿Cuál es la forma general de la función $f(x) = 2(x + 1)^2 - 3$?'
    alternativas:
      - '$f(x) = 2x^2 + 4x - 1$'
      - '$f(x) = 2x^2 + 2x - 1$'
      - '$f(x) = 2x^2 + 4x + 1$'
    respuesta: '$f(x) = 2x^2 + 4x - 1$'
    solucion_pasos:
      - '1. Desarrollamos el cuadrado de binomio: $(x + 1)^2 = x^2 + 2x + 1$.'
      - '2. Multiplicamos por 2: $2(x^2 + 2x + 1) = 2x^2 + 4x + 2$.'
      - '3. Restamos 3: $f(x) = 2x^2 + 4x + 2 - 3 = 2x^2 + 4x - 1$.'
  - titulo: 'Reordenamiento de términos desordenados'
    enunciado: '¿Cuáles son los coeficientes $a$, $b$ y $c$ de la función $g(x) = 8 - x^2 + 3x$?'
    alternativas:
      - '$a = -1$, $b = 3$, $c = 8$'
      - '$a = 8$, $b = -1$, $c = 3$'
      - '$a = 1$, $b = 3$, $c = 8$'
    respuesta: '$a = -1$, $b = 3$, $c = 8$'
    solucion_pasos:
      - '1. Ordenamos los términos de mayor a menor grado: $g(x) = -1x^2 + 3x + 8$.'
      - '2. Leemos directamente los coeficientes: $a = -1$, $b = 3$ y $c = 8$.'
  - titulo: 'Presencia de los tres términos en la forma general'
    enunciado: 'En la forma general $f(x) = ax^2 + bx + c$, ¿es indispensable que los tres términos $ax^2$, $bx$ y $c$ tengan valor distinto de cero?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Los coeficientes $b$ y $c$ pueden ser cero. Solamente se requiere que $a \neq 0$.'
  - titulo: 'Identificación del corte con el eje y'
    enunciado: 'Dada la forma general $f(x) = ax^2 + bx + c$, ¿el punto de corte de la gráfica con el eje de las ordenadas es $(0, c)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al evaluar en $x = 0$, los términos $a(0)^2$ y $b(0)$ se anulan, resultando $f(0) = c$.'
errores_frecuentes:
  - 'En la expresión $f(x) = 5 + 3x - 2x^2$, el coeficiente cuadrático $a$ es igual a $5$ por ser el primer número escrito.'
  - 'El signo negativo del coeficiente lineal en la función $f(x) = ax^2 - bx + c$ se desestima asignando siempre $b > 0$.'
  - 'El término independiente $c$ de la forma general representa la abscisa del vértice.'
  - 'Toda función cuadrática en forma general posee únicamente coeficientes enteros positivos.'
  - 'La forma general $f(x) = ax^2 + bx + c$ se convierte en función lineal cuando $c = 0$.'
afirmaciones_verdaderas:
  - 'En la forma general $f(x) = ax^2 + bx + c$, el coeficiente $a$ corresponde siempre al número real que multiplica a la potencia de segundo grado $x^2$.'
  - 'Al evaluar $x = 0$ en la forma general $f(x) = ax^2 + bx + c$, el valor de salida es igual a la constante $c$.'
al_terminar_debes_poder: 'Transformar cualquier función cuadrática a su forma general $f(x) = ax^2 + bx + c$ y extraer sin errores los valores de sus coeficientes $a$, $b$ y $c$.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
