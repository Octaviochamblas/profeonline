semantic_id: MAT.ALG.FUNC_CUADR_BASE.FORMA_GENERAL
resumen_inicial: 'Reconocimiento de la forma general f(x) = ax² + bx + c: parábola,
  vértice, concavidad y formas de Definición y elementos básicos.'
explicacion_simple: Toda función cuadrática, sin importar cómo se presente originalmente,
  puede reescribirse en un único formato estándar de tres términos ordenados.
explicacion_formal: '### Definición formal


  La forma general de una función cuadrática es $f(x)=ax^2+bx+c$, con $a,b,c \in \mathbb{R}$
  y $a \neq 0$. Los tres coeficientes determinan completamente la función y, por tanto,
  su gráfica.


  ### Desarrollo didáctico


  Reconocer la forma general implica ubicar, en orden, el término cuadrático, el término
  lineal y el término constante dentro de la regla de la función.


  En $f(x)=4x^2-5x+2$, la forma general ya está presente: el coeficiente cuadrático
  es $4$, el lineal es $-5$ y el término independiente es $2$.'
definiciones_clave: '- **Reconocimiento de la forma general f(x) = ax² + bx + c**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  reconocimiento de la forma general f(x) = ax² + bx + c.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando reconocimiento
    de la forma general f(x) = ax² + bx + c.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a reconocimiento
    de la forma general f(x) = ax² + bx + c.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
