semantic_id: MAT.ALG.FUNC_CUADR_BASE.FORMA_GENERAL
resumen_inicial: El reconocimiento de la forma general $f(x) = ax^2 + bx + c$ identifica los tres coeficientes reales ordenados de mayor a menor exponente.
explicacion_simple: |
  La **forma general** es la manera más común de escribir una función cuadrática:

  $$f(x) = ax^2 + bx + c$$

  - Está ordenada en potencias decrecientes de $x$:
    1. Primero el **término cuadrático** ($ax^2$).
    2. Luego el **término lineal** ($bx$).
    3. Al final el **término independiente** ($c$).
  - **Ejemplo**: Si $f(x) = 5 - 2x + 4x^2$, la ordenas de mayor a menor exponente:
    $$f(x) = 4x^2 - 2x + 5 \implies a = 4, \ b = -2, \ c = 5$$
explicacion_formal: |
  Sea $f: \mathbb{R} \to \mathbb{R}$ una función cuadrática. La **forma polinómica canónica o forma general** expresa la regla funcional como la suma de tres monomios ordenados según su grado algebraico:

  $$f(x) = ax^2 + bx + c \quad \text{con } a \in \mathbb{R}^* \ \text{y } b, c \in \mathbb{R}$$

  **Propiedades estructurales:**
  - Si $b = 0$, la función adopta la forma incompleta pura $f(x) = ax^2 + c$.
  - Si $c = 0$, la función adopta la forma incompleta binomia $f(x) = ax^2 + bx$.
  - Si $b = 0$ y $c = 0$, la función adopta la forma monomia $f(x) = ax^2$.
definiciones_clave: |
  - **Forma general cuadrática**: Representación polinómica $f(x) = ax^2 + bx + c$ desglosada en término cuadrático, lineal y constante.
propiedades_relaciones: |
  - **Intersección con el eje Y**: En la forma general, la evaluación $f(0) = c$ entrega directamente el punto de corte con el eje vertical $(0, c)$.
ejemplo_guiado:
  enunciado: 'Ordena en forma general la función $f(x) = 7 - x^2 + 3x$ y determina sus coeficientes $a$, $b$ y $c$.'
  pasos:
    - 'Paso 1: Identificar el término cuadrático: $-x^2$ (coeficiente $a = -1$).'
    - 'Paso 2: Identificar el término lineal: $+3x$ (coeficiente $b = 3$).'
    - 'Paso 3: Identificar el término constante: $+7$ (coeficiente $c = 7$).'
    - 'Paso 4: Escribir la forma general ordenada: $f(x) = -x^2 + 3x + 7$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la forma general ordenada de la función cuadrática $f(x) = 4 - 3x^2$?'
    choices:
      - {text: '$f(x) = -3x^2 + 4$ (con $a = -3, b = 0, c = 4$)', is_correct: true}
      - {text: '$f(x) = 4x^2 - 3$', is_correct: false}
      - {text: '$f(x) = -3x + 4$', is_correct: false}
      - {text: '$f(x) = 3x^2 - 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = -3x^2 + 4$ (con $a = -3, b = 0, c = 4$)''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué coeficientes $a, b, c$ corresponden a la forma general $f(x) = 2x - 5x^2 + 1$?'
    choices:
      - {text: '$a = -5, b = 2, c = 1$', is_correct: true}
      - {text: '$a = 2, b = -5, c = 1$', is_correct: false}
      - {text: '$a = 5, b = 2, c = -1$', is_correct: false}
      - {text: '$a = 1, b = 2, c = -5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$a = -5, b = 2, c = 1$''. Al ordenar los términos según el grado de $x$, el coeficiente de $x^2$ es $-5$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Agrupar y simplificar todos los términos semejantes de la expresión funcional.'
  - 'Paso 2: Ordenar los monomios de mayor a menor exponente ($x^2$, $x^1$, $x^0$).'
  - 'Paso 3: Extraer los coeficientes numéricos $a$, $b$ y $c$ conservando sus signos.'
  - 'Paso 4: Escribir la expresión canónica en la forma $f(x) = ax^2 + bx + c$.'
errores_correccion: |
  - **Error común:** Tomar el primer número que aparece como el coeficiente $a$ sin importar qué exponente tiene $x$.
  - **Cómo corregirlo:** El coeficiente $a$ **ES SIEMPRE EL NÚMERO QUE MULTIPLICA A $x^2$**, sin importar la posición en que esté escrito.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Ordenamiento de términos desordenados.
    alternativas:
      - '$f(x) = -2x^2 + 6x - 3$'
      - '$f(x) = 6x^2 - 2x - 3$'
      - '$f(x) = -3x^2 + 6x - 2$'
    respuesta: '$f(x) = -2x^2 + 6x - 3$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Forma general incompleta binomia.
    alternativas:
      - '$f(x) = 4x^2 - 8x$ (con $c = 0$)'
      - '$f(x) = -8x^2 + 4$'
      - '$f(x) = 4x^2 + 8$'
    respuesta: '$f(x) = 4x^2 - 8x$ (con $c = 0$)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Asignar $a = 6$ en la función desordenada $f(x) = 6x - x^2 + 2$ tomando la primera constante observada.'
  - 'La creencia de que si el término independiente no aparece escrito, la función no posee forma general.'
  - 'La falta de inclusión del signo negativo del coeficiente cuadrático al reordenar la expresión funcional.'
  - 'La equiparación del coeficiente $b$ del término lineal con el exponente 2 de la variable $x$.'
  - 'Afirmar que los tres coeficientes $a, b, c$ deben ser distintos de cero obligatoriamente.'
afirmaciones_verdaderas:
  - 'La forma general $f(x) = ax^2 + bx + c$ ordena los monomios en potencias decrecientes de $x$, donde $a \neq 0$ multiplica a $x^2$.'
  - 'En la forma general, la constante $c$ representa la coordenada de intersección de la parábola con el eje vertical $Y$ en el punto $(0, c)$.'
al_terminar_debes_poder: |
  QUÉ: Reconocer e identificar los coeficientes $a, b, c$ en la forma general $f(x) = ax^2 + bx + c$.
  CÓMO: Reordenar los términos en grados decrecientes de $x$, aislar $a$ de $x^2$, $b$ de $x$ y el término constante $c$.
fuente: 'Texto escolar MINEDUC — Álgebra / Función Cuadrática'
