procedimiento:
- 'Paso 1: Identifica el polinomio de mayor grado como Dividendo y el menor como Divisor.'
- 'Paso 2: Realiza la división larga polinomial.'
- 'Paso 3: Si el residuo es 0, el divisor actual es el MCD.'
- 'Paso 4: Si el residuo no es 0, toma tu divisor actual y divídelo entre el residuo
  que acabas de encontrar.'
- 'Paso 5: Repite hasta obtener residuo 0.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en cálculo del m.c.d. por divisiones sucesivas (algoritmo de
  euclides).
ejemplos:
- titulo: 'Concepto en números: MCD de 1071 y 462'
  enunciado: 'Concepto en números: MCD de 1071 y 462.'
  solucion_pasos:
  - 1071 / 462 = 2, resto 147.
  - 462 / 147 = 3, resto 21.
  - 147 / 21 = 7, resto 0.
  - El último divisor fue 21. El MCD es 21. El álgebra polinomial usa la misma lógica
    exacta.
- titulo: ¿Qué se hace cuando el resto de la primera división de P(x) / Q(x) no es
    cero?
  solucion_pasos:
  - 'La regla es empujar los términos: el divisor se convierte en dividendo, y el
    resto en divisor.'
- titulo: 'Respecto de «Cálculo del M.C.D. por divisiones sucesivas (algoritmo de
    Euclides)»: ¿Se ajust'
  enunciado: 'Respecto de «Cálculo del M.C.D. por divisiones sucesivas (algoritmo
    de Euclides)»: ¿Se ajusta a la definición esta afirmación? «El Algoritmo de Euclides
    halla el MCD de dos polinomios dividiendo el de mayor grado entre el de menor
    grado»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El Algoritmo de Euclides halla
    el MCD de dos polinomios dividiendo el de mayor grado entre el de menor grado.'
- titulo: 'Respecto de «Cálculo del M.C.D. por divisiones sucesivas (algoritmo de
    Euclides)»: ¿Es compa'
  enunciado: 'Respecto de «Cálculo del M.C.D. por divisiones sucesivas (algoritmo
    de Euclides)»: ¿Es compatible con el procedimiento esta afirmación? «Confundir
    quién se divide por quién en las iteraciones siguientes (siempre es el divisor
    viejo entre el resto nuevo)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El Algoritmo de Euclides halla
    el MCD de dos polinomios dividiendo el de mayor grado entre el de menor grado.'
errores_frecuentes:
- Confundir quién se divide por quién en las iteraciones siguientes (siempre es el
  divisor viejo entre el resto nuevo).
- Olvidar que los coeficientes pueden multiplicarse o simplificarse por constantes
  durante el proceso sin alterar el MCD algebraico esencial.
- Es más corto que factorizar.
- Para «¿Cuál es la principal ventaja del Algoritmo de Euclides para polinomios»,
  la respuesta correcta es Siempre da como resultado 1.
- Para «¿Cuál es la principal ventaja del Algoritmo de Euclides para polinomios»,
  la respuesta correcta es Funciona para el MCM.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
