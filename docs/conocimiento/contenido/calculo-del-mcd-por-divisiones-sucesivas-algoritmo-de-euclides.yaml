procedimiento:
- 'Paso 1: Ordenar los dos polinomios en potencias decrecientes y verificar que el dividendo sea de igual o mayor grado que
  el divisor.'
- 'Paso 2: Realizar la división polinomial de $A(x)$ por $B(x)$ para obtener el primer resto $R_1(x)$.'
- 'Paso 3: Si el resto $R_1(x)$ es nulo (0), el M.C.D. es $B(x)$. Si no es nulo, pasar a dividir $B(x)$ entre $R_1(x)$.'
- 'Paso 4: Repetir el proceso de división tomando el divisor anterior y el último resto obtenido hasta que el residuo sea
  0, y seleccionar el último resto no nulo como el M.C.D.'
errores_correccion: '- **Error 1:** Declarar como M.C.D. el resto igual a 0 en lugar del último resto no nulo. **Cómo corregirlo:**
  El M.C.D. **ES EL ÚLTIMO RESTO NO NULO QUE PRECEDE AL RESTO CERO**.

  - **Error 2:** Declarar el polinomio cociente final en lugar del resto como M.C.D. **Cómo corregirlo:** El Algoritmo de
  Euclides **ENTREGA EL M.C.D. EN LOS RESTOS O RESIDUOS, NO EN LOS COCIENTES DE LA DIVISIÓN**.

  '
ejemplos:
- titulo: División directa
  enunciado: Si $A(x) \div B(x)$ da resto 0 en la primera división, ¿es $B(x)$ el M.C.D.?
  respuesta: Sí
  solucion_pasos:
  - Sí, $B(x)$ divide a $A(x)$.
- titulo: Reducción de grado
  enunciado: ¿Es el grado de cada nuevo resto estrictamente menor que el grado del divisor anterior?
  respuesta: Sí
  solucion_pasos:
  - Sí, garantiza la terminación.
- titulo: Constante numérica de simplificación
  enunciado: Si el resto es $2x - 4$, ¿se puede simplificar a $x - 2$ para la siguiente división?
  respuesta: Sí
  solucion_pasos:
  - Sí, dividir por 2 no altera la divisibilidad.
- titulo: Último resto no nulo
  enunciado: Si en la tercera división el resto da 0, ¿es el resto de la segunda división el M.C.D.?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el último resto no nulo.
errores_frecuentes:
- Tomar el resto igual a cero como M.C.D. en lugar del residuo anterior no nulo.
- Intercambiar los cocientes de las divisiones con el M.C.D.
- Dividir el polinomio de menor grado entre el de mayor grado al iniciar el algoritmo.
- Cometer errores de signos durante la sustracción de términos en la división de polinomios.
- Olvidar que el último resto no nulo normalizado a mónico es el M.C.D.
afirmaciones_verdaderas:
- El Algoritmo de Euclides calcula el M.C.D. por divisiones polinomiales sucesivas sin necesidad de factorizar.
- El M.C.D. corresponde al último resto no nulo obtenido antes de la división exacta.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/calculo-del-mcd-por-divisiones-sucesivas-algoritmo-de-euclides-resumen.svg)


  QUÉ: Calcular el M.C.D. entre dos polinomios aplicando el Algoritmo de Euclides por divisiones sucesivas.

  CÓMO: Dividir el polinomio de mayor grado por el de menor grado y encadenar divisiones sucesivas reemplazando el divisor
  por el resto hasta obtener residuo nulo ($R_k=0$), seleccionando el último resto no nulo $R_{k-1}(x)$.

  '
