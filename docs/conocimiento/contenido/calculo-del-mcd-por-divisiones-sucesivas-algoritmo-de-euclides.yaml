semantic_id: MAT.ALG.MCD_ALGEBRAICO.ALGORITMO_EUCLIDES
resumen_inicial: El cálculo del M.C.D. por divisiones sucesivas (Algoritmo de Euclides) consiste en dividir el polinomio de
  mayor grado entre el de menor grado y reemplazar sucesivamente los dividendo y divisor por el resto obtenido hasta alcanzar
  un residuo nulo.
explicacion_simple: "Cuando dos polinomios son de grado alto y son difíciles de factorizar directamente (ej: $P(x)$ y $Q(x)$):\n\
  - **ALGORITMO DE EUCLIDES PARA POLINOMIOS**:\n  1. **Divide el polinomio de mayor grado entre el de menor grado**:\n   \
  \  - $P(x) = Q(x) \\cdot C_1(x) + R_1(x)$.\n  2. **Si el resto $R_1(x)$ no es 0**:\n     - Pasas a dividir el **divisor\
  \ anterior $Q(x)$** entre el **nuevo resto $R_1(x)$**:\n     - $Q(x) = R_1(x) \\cdot C_2(x) + R_2(x)$.\n  3. **Repites la\
  \ división hasta que el resto sea EXACTAMENTE CERO ($R_k = 0$)**:\n  4. **¡El M.C.D. es el ÚLTIMO RESTO NO NULO ($R_{k-1}$)!**\n\
  - **Ventaja**: ¡No necesitas factorizar ningún polinomio! Funciona por divisiones sucesivas directas.\n\n![Cálculo del M.C.D.\
  \ por divisiones sucesivas (Euclides)](/static/img/nodos/calculo-del-mcd-por-divisiones-sucesivas-algoritmo-de-euclides-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $A(x), B(x) \in \mathbb{K}[x]$ dos polinomios no nulos con $\operatorname{grado}(A) \ge \operatorname{grado}(B)$. El
  **Algoritmo de Euclides Polinomial** genera una secuencia finita de divisiones euclidianas exactas en el Anillo $\mathbb{K}[x]$:


  $$\begin{aligned} A(x) &= Q_1(x) B(x) + R_1(x) & \quad \text{con } \operatorname{grado}(R_1) < \operatorname{grado}(B) \\
  B(x) &= Q_2(x) R_1(x) + R_2(x) & \quad \text{con } \operatorname{grado}(R_2) < \operatorname{grado}(R_1) \\ R_1(x) &= Q_3(x)
  R_2(x) + R_3(x) & \quad \text{con } \operatorname{grado}(R_3) < \operatorname{grado}(R_2) \\ &\;\;\vdots \\ R_{k-2}(x) &=
  Q_k(x) R_{k-1}(x) + 0 & \quad \text{con resto final } R_k(x) = 0 \end{aligned}$$


  El Teorema de Euclides garantiza la cadena de equivalencias algebraicas de ideales:


  $$\operatorname{MCD}(A, B) = \operatorname{MCD}(B, R_1) = \operatorname{MCD}(R_1, R_2) = \dots = \operatorname{MCD}(R_{k-2},
  R_{k-1}) = \mathbf{R_{k-1}(x)}$$


  Por consiguiente, el **último resto no nulo $R_{k-1}(x)$** (normalizado a mónico) es idénticamente el M.C.D. de $A(x)$ y
  $B(x)$.


  ### Síntesis didáctica

  El Algoritmo de Euclides calcula el M.C.D. encadenando divisiones de polinomios donde cada nuevo divisor es el resto de
  la división anterior hasta obtener un resto cero.

  '
definiciones_clave: '- **Algoritmo de Euclides polinomial**: Método iterativo de divisiones sucesivas para hallar el M.C.D.
  sin necesidad de factorizar.

  - **Último resto no nulo ($R_{k-1}(x)$)**: Residuo previo a la división exacta que constituye el M.C.D. de los polinomios.

  - **Reducción estricta de grados**: Propiedad por la cual $\operatorname{grado}(R_i) < \operatorname{grado}(R_{i-1})$, asegurando
  que el algoritmo termina en un número finito de pasos.

  '
propiedades_relaciones: '- **Invarianza por multiplicación de constantes**: Durante el algoritmo, cualquier resto $R_i(x)$
  puede multiplicarse o dividirse por una constante numérica no nula para evitar fracciones en los coeficientes sin alterar
  el M.C.D. final.

  '
ejemplo_guiado:
  enunciado: Calcula el M.C.D. entre $A(x) = x^3 - x^2 - x - 2$ y $B(x) = x^2 - 4$ aplicando el Algoritmo de Euclides por
    divisiones sucesivas.
  pasos:
  - 'Paso 1: Dividimos el polinomio de grado 3 $A(x)$ entre el de grado 2 $B(x)$: - $(x^3 - x^2 - x - 2) \div (x^2 - 4)$.
    - Cociente: $Q_1(x) = x - 1$. - Resto obtenido: $R_1(x) = \mathbf{3x - 6}$.'
  - 'Paso 2: Como $R_1(x) = 3x - 6 \neq 0$, simplificamos la constante $3$ para mayor comodidad: $R_1^\prime(x) = \mathbf{x
    - 2}$.'
  - 'Paso 3: Dividimos el divisor anterior $B(x) = x^2 - 4$ entre el resto simplificado $x - 2$: - $(x^2 - 4) \div (x - 2)$.
    - Cociente: $Q_2(x) = x + 2$. - Resto obtenido: $R_2(x) = \mathbf{0}$ (¡División exacta!).'
  - 'Paso 4: Identificamos el último resto no nulo: Fue $R_1^\prime(x) = \mathbf{x - 2}$.'
  - 'Conclusión: El M.C.D. entre los dos polinomios es **$(x - 2)$**.'
  imagen: /static/img/nodos/calculo-del-mcd-por-divisiones-sucesivas-algoritmo-de-euclides-ejemplos.svg
