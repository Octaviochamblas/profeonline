semantic_id: MAT.ALG.MCD_ALGEBRAICO.ALGORITMO_EUCLIDES
resumen_inicial: 'Cálculo del M.C.D. por divisiones sucesivas (algoritmo de Euclides):
  concepto, reglas operativas y simplificación en M.C.D. algebraico.'
explicacion_simple: '¿Qué pasa si te topas con dos polinomios extensoscos que no sabes
  cómo factorizar? Euclides, hace miles de años, inventó un truco brillante para números,
  que resulta que también funciona con polinomios: las divisiones sucesivas.'
explicacion_formal: '### Definición formal


  Factorizar polinomios de grado 5 o superior puede ser analíticamente imposible.
  Euclides siempre funciona porque usa división matemática básica.


  ### Desarrollo didáctico


  El Algoritmo de Euclides es un método legendario y avanzado para encontrar el MCD
  entre dos polinomios que son muy difíciles de factorizar a simple vista. Se basa
  en divisiones sucesivas.


  La lógica detrás de Euclides es simple: Si un término divide a $A$ y a $B$, también
  debe dividir al resto (residuo) de la división entre $A$ y $B$.


  **Pasos del algoritmo:**

  1. Se divide el polinomio de mayor grado ($P_1$) por el de menor grado ($P_2$).

  2. Si el residuo es cero, el MCD es $P_2$.

  3. Si hay un residuo ($R_1$), se divide $P_2$ por $R_1$.

  4. Se repite el proceso (dividiendo el divisor anterior por el residuo actual) hasta
  que el residuo sea cero.

  5. El **último divisor no nulo** es el MCD.


  Este método es muy mecánico, pero requiere dominar a la perfección la división larga
  de polinomios.'
