semantic_id: MAT.ALG.MCD_ALGEBRAICO.ALGORITMO_EUCLIDES
resumen_inicial: El algoritmo de Euclides permite hallar el M.C.D. entre polinomios
  mediante divisiones sucesivas sin necesidad de factorizar.
explicacion_simple: 'Cuando dos polinomios son de grado alto o difíciles de factorizar
  directamente, se utiliza el Algoritmo de Euclides (divisiones sucesivas):

  1. Se divide el polinomio de mayor grado entre el de menor grado, obteniendo un
  cociente y un resto.

  2. Si el resto es cero, el divisor actual es el M.C.D.

  3. Si el resto no es cero, se reemplaza el dividendo por el divisor anterior y el
  divisor por el resto obtenido, y se vuelve a dividir.

  4. El proceso se repite hasta obtener un resto igual a cero. El último divisor no
  nulo (normalizado para que su coeficiente principal sea 1) es el M.C.D.'
explicacion_formal: 'Dados dos polinomios $P(x)$ y $Q(x)$ con $\operatorname{gr}(P)
  \ge \operatorname{gr}(Q)$, el **Algoritmo de Euclides para polinomios** genera una
  secuencia de divisiones con resto:


  $$P(x) = Q(x) \cdot q_1(x) + R_1(x) \quad \text{con } \operatorname{gr}(R_1) < \operatorname{gr}(Q)$$

  $$Q(x) = R_1(x) \cdot q_2(x) + R_2(x) \quad \text{con } \operatorname{gr}(R_2) <
  \operatorname{gr}(R_1)$$

  $$\dots$$

  $$R_{k-2}(x) = R_{k-1}(x) \cdot q_k(x) + R_k(x) \quad \text{con } R_k(x) = 0$$


  **Propiedades fundamentales:**

  - $\operatorname{gcd}(P, Q) = \operatorname{gcd}(Q, R_1) = \operatorname{gcd}(R_1,
  R_2) = \dots = \operatorname{gcd}(R_{k-2}, R_{k-1}) = c \cdot R_{k-1}(x)$, donde
  $c$ es una constante para hacer el polinomio mónico.

  - El último resto no nulo $R_{k-1}(x)$ es, salvo un factor constante, el **M.C.D.
  algebraico** entre $P(x)$ y $Q(x)$.


  > **Complemento didáctico:** Este algoritmo garantiza encontrar el M.C.D. incluso
  cuando los polinomios no pueden ser factorizados mediante inspección simple ni raíces
  racionales.'
definiciones_clave: '- **Divisiones sucesivas**: Algoritmo iterativo donde cada nuevo
  divisor es el resto no nulo obtenido en la división inmediatamente anterior.

  - **Polinomio mónico**: Polinomio cuyo coeficiente principal (el que acompaña a
  la máxima potencia) es igual a $1$.'
propiedades_relaciones: '- **Invarianza del M.C.D. por resto**: En cada paso de división
  $P = Q \cdot q + R$, se cumple que todo divisor común de $P$ y $Q$ divide a $R$,
  y todo divisor común de $Q$ y $R$ divide a $P$.

  - **Multiplicación por constantes**: Se pueden multiplicar o dividir los restos
  por constantes numéricas en cualquier paso sin alterar el M.C.D. polinomial final.'
ejemplo_guiado:
  enunciado: Aplica el algoritmo de Euclides para hallar el M.C.D. entre $P(x) = x^3
    - 2x^2 - x + 2$ y $Q(x) = x^2 - 3x + 2$. Realiza la primera división obteniendo
    residuo cero $(x - 2)$ y evalúa su valor para $x = 6$.
  pasos:
  - 'Paso 1: Dividir $P(x) = x^3 - 2x^2 - x + 2$ por $Q(x) = x^2 - 3x + 2$. Al realizar
    la división sintética o larga: $(x^3 - 2x^2 - x + 2) = (x^2 - 3x + 2)(x + 1) +
    0$.'
  - 'Paso 2: Como el residuo obtenido en el primer paso es $0$, el divisor $Q(x) =
    x^2 - 3x + 2$ es un divisor común. Factorizando $Q(x) = (x - 1)(x - 2)$ se identifican
    sus factores.'
  - 'Paso 3: El factor común de menor grado que actúa como divisor de menor orden
    o factor irreducible buscado es $(x - 2)$.'
  - 'Paso 4: Evaluar para $x = 6$: $6 - 2 = 4$.'
