    resultado del M.C.D.?
  choices:
  - text: El resultado del M.C.D. es el último resto no nulo de la secuencia de divisiones
    is_correct: true
  - text: El resultado es el primer resto obtenido
    is_correct: false
  - text: El resultado es el resto igual a cero
    is_correct: false
  - text: El resultado es la suma de los cocientes
    is_correct: false
