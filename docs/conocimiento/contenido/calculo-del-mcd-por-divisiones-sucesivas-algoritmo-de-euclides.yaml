procedimiento:
- 'Paso 1: Ordenar los dos polinomios $P(x)$ y $Q(x)$ en forma decreciente según sus
  exponentes, asegurando $\operatorname{gr}(P) \ge \operatorname{gr}(Q)$.'
- 'Paso 2: Dividir $P(x)$ por $Q(x)$ para obtener el cociente $q_1(x)$ y el resto
  $R_1(x)$.'
- 'Paso 3: Si $R_1(x) = 0$, el M.C.D. es $Q(x)$ (normalizado a mónico). Si $R_1(x)
  \neq 0$, dividir $Q(x)$ entre $R_1(x)$.'
- 'Paso 4: Repetir el proceso dividiendo el divisor anterior por el resto obtenido
  hasta que el resto sea igual a $0$.'
- 'Paso 5: Tomar el último resto distinto de cero y ajustarlo para que su coeficiente
  principal sea $1$.'
errores_correccion: '- **Error común:** Confundir el último resto no nulo con el cociente
  de la división final.

  - **Cómo corregirlo:** Recuerda que el M.C.D. proviene de la serie de restos no
  nulos ($R_{k-1}(x)$), no de los cocientes ($q(x)$) generados durante la división.'
ejemplos:
- titulo: 'Ejemplo 1: División con resto no nulo en el primer paso'
  enunciado: Calcula el M.C.D. entre $P(x) = x^3 - x^2 - x + 1$ y $Q(x) = x^2 - 1$
    aplicando divisiones.
  alternativas:
  - $x^2 - 1$
  - $x - 1$
  - $x + 1$
  respuesta: $x^2 - 1$
  solucion_pasos:
  - '1. Dividir $P(x)$ entre $Q(x)$: $(x^3 - x^2 - x + 1) \div (x^2 - 1) = (x - 1)$
    con residuo $0$.'
  - 2. Como el resto es $0$ desde el primer paso, el divisor $Q(x) = x^2 - 1$ es el
    M.C.D.
- titulo: 'Ejemplo 2: Algoritmo con dos pasos de división'
  enunciado: Si al dividir $P(x)$ por $Q(x)$ se obtiene resto $R_1(x) = 3x - 6$, y
    al dividir $Q(x)$ por $R_1(x)$ el resto es $0$, ¿cuál es el M.C.D. mónico?
  alternativas:
  - $x - 2$
  - $3x - 6$
  - $x + 2$
  respuesta: $x - 2$
  solucion_pasos:
  - 1. El último resto no nulo es $R_1(x) = 3x - 6$.
  - '2. Factorizar el coeficiente principal: $3(x - 2)$.'
  - 3. Al normalizar a polinomio mónico (coeficiente principal $1$), el M.C.D. es
    $x - 2$.
- titulo: ¿Se puede multiplicar un resto por un número constante durante el algoritmo
    de Euclides sin cambiar el M.C.D. final?
  respuesta: Sí
  solucion_pasos:
  - Sí. Las constantes numéricas no alteran los factores polinomiales ni el grado
    del M.C.D. resultante.
- titulo: ¿El algoritmo de Euclides se detiene únicamente cuando se obtiene un resto
    igual a cero?
  respuesta: Sí
  solucion_pasos:
  - Sí. El resto cero indica que el divisor del paso anterior es el último divisor
    común exacto.
errores_frecuentes:
- El M.C.D. en el algoritmo de Euclides es el cociente obtenido cuando el resto es
  cero.
- Si en el primer paso el resto no es cero, los polinomios no tienen M.C.D.
- Multiplicar un resto por un entero negativo altera la validez del algoritmo de Euclides.
- El resto cero es el M.C.D. entre dos polinomios.
- El algoritmo de Euclides solo funciona cuando los polinomios son de grado 1.
afirmaciones_verdaderas:
- El algoritmo de Euclides permite hallar el M.C.D. de dos polinomios mediante divisiones
  sucesivas sin necesidad de factorizarlos.
- El M.C.D. de dos polinomios según el algoritmo de Euclides corresponde al último
  resto no nulo normalizado a mónico.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar el algoritmo de
  Euclides de divisiones sucesivas para calcular el M.C.D. entre polinomios de cualquier
  grado.
