semantic_id: MAT.GEO.CUERPOS_REDONDOS_METRICA.CONO_VOLUMEN
resumen_inicial: 'Cálculo del volumen del cono: conceptos, teoremas, propiedades geométricas
  y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: El volumen de un cono es exactamente un tercio del volumen de
  un cilindro con la misma base y altura.
explicacion_formal: '![Volumen del cono](/static/img/geometria/espacio-cuerpos/cono-volumen.svg)


  ### Definición formal


  El volumen de un cono es un tercio del producto entre el área de su base circular
  ($\pi r^2$) y su altura ($h$): $V=\frac{\pi r^2 h}{3}$.


  ### Desarrollo didáctico


  Si un cono tiene radio 3 cm y altura 6 cm, su volumen es $V=\frac{\pi(3)^2(6)}{3}=\frac{54\pi}{3}=18\pi\approx56,52$
  cm³ (usando π≈3,14). Puede verificarse experimentalmente que se necesitan exactamente
  3 conos de estas medidas para llenar un cilindro de igual radio y altura.'
definiciones_clave: '- **Cálculo del volumen del cono**: Elemento o propiedad fundamental
