semantic_id: MAT.GEO.PARALELOGRAMOS.CUADRADO_LADOS_CONGRUENTES
resumen_inicial: En el cuadrado, los cuatro lados son congruentes entre sí y su perímetro equivale a P = 4s.
explicacion_simple: 'El cuadrado es el paralelogramo perfecto: no solo tiene lados opuestos iguales, sino que **los cuatro lados miden exactamente lo mismo** ($s$). Esto significa que el cuadrado es un polígono equilátero.


  Debido a esta maravillosa simetría, calcular su contorno (perímetro) es tan fácil como multiplicar la longitud de un lado por cuatro: **$P = 4s$**. Además, al cortar el cuadrado por la mitad con una diagonal, se forma un triángulo rectángulo clásico cuyos lados cumplen el Teorema de Pitágoras, dando como resultado que la diagonal siempre mide **$d = s\sqrt{2}$**.


  ![Cuatro lados congruentes en el cuadrado](/static/img/nodos/propiedad-de-cuatro-lados-congruentes-en-el-cuadrado-intro.svg)

  '
explicacion_formal: '### Definición métrica del cuadrado

  Un **cuadrado** es un paralelogramo que es simultáneamente equilátero y equiángulo. La propiedad de lados congruentes establece:

  $$\overline{AB} \cong \overline{BC} \cong \overline{CD} \cong \overline{DA} \iff s_1 = s_2 = s_3 = s_4 = s \in \mathbb{R}^+$$


  ### Métricas asociadas

  - **Perímetro lineal:**

  $$P = s + s + s + s = 4s$$

  - **Área superficial:**

  $$A = s \cdot s = s^2$$

  - **Longitud de la diagonal (Teorema de Pitágoras):**

  $$d^2 = s^2 + s^2 = 2s^2 \implies d = s\sqrt{2}$$

  - Despeje del lado conociendo la diagonal:

  $$s = \frac{d}{\sqrt{2}} = \frac{d\sqrt{2}}{2}$$


  > **Complemento didáctico:** El valor $d = s\sqrt{2}$ es uno de los resultados más evaluados en la PAES. Cada vez que veas un cuadrado de lado $s$, su diagonal se calcula de inmediato agregando $\sqrt{2}$ al lado, sin necesidad de rehacer Pitágoras desde cero.

  '
definiciones_clave: '- **Cuadrado**: Paralelogramo regular de cuatro lados congruentes y cuatro ángulos rectos.

  - **Polígono equilátero**: Figura plana que tiene todos sus lados de la misma medida métrica.

  - **Diagonal del cuadrado**: Segmento que une vértices opuestos, con medida invariante $d = s\sqrt{2}$.

  '
propiedades_relaciones: '- **Relación con el rombo**: El cuadrado es un rombo especial cuyos ángulos interiores son rectos.

  - **Relación con el rectángulo**: El cuadrado es un rectángulo especial cuyos lados contiguos son congruentes.

  - **Área en función de la diagonal**: Como en todo rombo, $A = \frac{d \cdot d}{2} = \frac{d^2}{2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de lados en el cuadrado](/static/img/nodos/propiedad-de-cuatro-lados-congruentes-en-el-cuadrado-ejemplos.svg)


    Un terreno cuadrado tiene un perímetro de $48$ metros. Calcula la longitud de cada uno de sus lados, su área superficial y la longitud de la diagonal que lo cruza.'
  pasos:
  - 'Paso 1: Calcular la longitud del lado: Como $P = 4s$, despejamos $s = \frac{P}{4} = \frac{48}{4} = 12$ metros.'
  - 'Paso 2: Calcular el área: $A = s^2 = 12^2 = 144\text{ m}^2$.'
  - 'Paso 3: Calcular la diagonal aplicando Pitágoras o la fórmula directa: $d = s\sqrt{2} = 12\sqrt{2}$ metros.'
checkpoints:
- placement: after_explicacion_formal
  question: Si un cuadrado tiene un lado de 7 cm, ¿cuánto mide exactamente su diagonal?
  choices:
  - text: $7\sqrt{2}\text{ cm}$.
    is_correct: true
  - text: $14\text{ cm}$.
    is_correct: false
  - text: $7\text{ cm}$.
    is_correct: false
  - text: $49\text{ cm}$.
    is_correct: false
  explanation: La alternativa correcta es '$7\sqrt{2}\text{ cm}$.' Por Pitágoras, la diagonal de un cuadrado de lado $s$ es siempre $d = s\sqrt{2}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la diagonal de un cuadrado mide 10 cm, ¿cuánto mide su área?
  choices:
  - text: 50 cm².
    is_correct: true
  - text: 100 cm².
    is_correct: false
  - text: 25 cm².
    is_correct: false
  - text: 20 cm².
    is_correct: false
  explanation: La alternativa correcta es '50 cm².' El área de un cuadrado en función de su diagonal es $A = \frac{d^2}{2} = \frac{10^2}{2} = \frac{100}{2} = 50\text{ cm}^2$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el dato proporcionado (lado $s$, perímetro $P$ o diagonal $d$).

  2. Para hallar el lado dado el perímetro: $s = P / 4$.

  3. Para hallar la diagonal dado el lado: $d = s\sqrt{2}$.

  4. Para hallar el área: $A = s^2$ o $A = d^2 / 2$.

  '
errores_correccion: '- **Error común 1:** Creer que la diagonal mide $2s$. **Corrección:** La diagonal mide $s\sqrt{2} \approx 1{,}414s$, jamás $2s$.

  - **Error común 2:** Confundir la fórmula de perímetro ($4s$) con la de área ($s^2$). **Corrección:** El perímetro es una medida de longitud lineal; el área es producto de dimensiones en unidades cuadradas.

  '
