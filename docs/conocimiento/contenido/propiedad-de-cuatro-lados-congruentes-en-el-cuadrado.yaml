- tipo: A
  titulo: Perímetro de un cuadrado
  enunciado: Si el lado de un cuadrado mide $6{,}5\text{ cm}$, ¿cuál es su perímetro?
  alternativas:
  - text: $26\text{ cm}$.
    is_correct: true
  - text: $42{,}25\text{ cm}$.
    is_correct: false
  - text: $13\text{ cm}$.
    is_correct: false
  - text: $19{,}5\text{ cm}$.
    is_correct: false
  explicacion: $P = 4 \cdot 6{,}5 = 26\text{ cm}$.
- tipo: B
  titulo: Equilaterismo en el cuadrado
  enunciado: ¿Todos los lados de un cuadrado tienen la misma medida?
  respuesta: Sí
  explicacion: Sí. Por definición, el cuadrado es un cuadrilátero equilátero.
errores_frecuentes:
- '''Olvidar el factor $\sqrt{2}$ al calcular diagonales de cuadrados.'''
- '''Asumir que un cuadrilátero con cuatro lados congruentes es obligatoriamente un cuadrado (puede ser un rombo).'''
- '''Dividir entre 2 en lugar de 4 al despejar el lado a partir del perímetro.'''
afirmaciones_verdaderas:
- '''El cuadrado tiene sus cuatro lados de igual medida métrica.'''
- '''El perímetro de un cuadrado de lado $s$ es $P = 4s$.'''
- '''La diagonal de un cuadrado de lado $s$ mide estrictamente $d = s\sqrt{2}$.'''
al_terminar_debes_poder: '**QUÉ:** Calcular lados, perímetros, diagonales y áreas de cuadrados aplicando sus propiedades de equilaterismo.


  **CÓMO:** Empleando las relaciones $P = 4s$ y $d = s\sqrt{2}$ basadas en el Teorema de Pitágoras.


