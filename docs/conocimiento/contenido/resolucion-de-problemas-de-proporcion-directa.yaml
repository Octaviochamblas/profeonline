semantic_id: MAT.NUM.PROP_DIRECTA.PROBLEMAS_CONTEXTO
resumen_inicial: 'Resolución de problemas de proporción directa: concepto y propiedades fundamentales
  en Proporcionalidad directa.'
explicacion_simple: ¿Cómo calculan las constructoras el material para 100 casas si solo hicieron
  los planos de una? Las proporciones directas son herramientas de la vida real usadas a diario
  para escalar ingredientes, costos, tiempo y materiales.
explicacion_formal: 'Para resolver un problema de la vida cotidiana usando **proporcionalidad
  directa**, lo más crítico es leer con cuidado para confirmar que no haya ''cargos fijos''
  o relaciones inversas (ej. más obreros $\rightarrow$ menos tiempo, eso es inverso).


  Una vez seguros de que es directa (ej. más kilos $\rightarrow$ más dinero; más tiempo $\rightarrow$
  más distancia), usamos la regla de tres cruzada o calculamos $k$ para despejar la incógnita.
  Plantear los datos en una tabla rápida mental o en papel evita cruzar los números equivocados.'
definiciones_clave: '- **Resolución de problemas de proporción directa**: Elemento central
  dentro del estudio de Proporcionalidad directa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a resolución de problemas de proporción directa.'
ejemplo_guiado:
  enunciado: Un trabajador gana 8.000 pesos por cada 2 horas trabajadas. ¿Cuánto ganará si
    trabaja 9 horas, manteniendo la misma tarifa?
  pasos:
  - 'Confirmo que la relación es directa: más horas trabajadas significa más dinero ganado,
    en la misma proporción.'
  - 'Calculo la constante: k igual a 8.000 dividido entre 2, o sea 4.000 pesos por hora.'
  - 'Calculo la ganancia por 9 horas: 4.000 por 9 es igual a 36.000 pesos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con resolución de problemas de proporción
    directa?
  choices:
  - text: Identificar correctamente la relación de proporcionalidad directa
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de proporcionalidad
    directa. Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de resolución de problemas de proporción directa,
    ¿qué paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
    clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Lee el enunciado y asegúrate de que la relación crezca o decrezca simultáneamente
  (si duplico A, debe duplicarse B).'
- 'Paso 2: Ordena los datos conocidos en un planteo de dos columnas.'
- 'Paso 3: Multiplica cruzado y divide por el dato restante (cuarta proporcional) para hallar
  la respuesta.'
errores_correccion: Evita confundir los datos de entrada al operar con resolución de problemas
  de proporción directa.
ejemplos:
- titulo: Ingredientes de receta
  enunciado: Una receta para 4 personas necesita 600g de pollo. ¿Cuánto pollo se necesita
    para 10 personas?
  solucion_pasos:
  - 'Confirmamos: el doble de personas requerirá el doble de pollo (es directa).'
  - 'Planteo: $4$ personas $\rightarrow 600g$ \n $10$ personas $\rightarrow x$.'
  - 'Operación: $x = (10 \cdot 600) / 4 = 6000 / 4 = 1500g$. Se necesitan 1.5 kilos.'
- titulo: Ejemplo 1
  enunciado: Si 3 kilos de manzanas cuestan 2.400 pesos, ¿cuánto cuestan 7 kilos?
  alternativas:
  - '5.600'
  - '4.800'
  - '2.800'
  respuesta: '5.600'
  solucion_pasos:
  - k es igual a 2.400 dividido entre 3, o sea 800; 800 por 7 es igual a 5.600.
- titulo: Ejemplo 2
  enunciado: Si 5 entradas cuestan 15.000 pesos, ¿cuánto cuestan 8 entradas?
  alternativas:
  - '24.000'
  - '18.000'
  - '20.000'
  respuesta: '24.000'
  solucion_pasos:
  - k es igual a 15.000 dividido entre 5, o sea 3.000; 3.000 por 8 es igual a 24.000.
- titulo: ¿La relación entre el número de trabajadores y el tiempo para terminar una obra
    es una proporción directa?
  respuesta: 'No'
  solucion_pasos:
  - 'Es una relación inversa: a mayor cantidad de trabajadores, menor es el tiempo necesario.'
errores_frecuentes:
- Aplicar regla de tres directa en problemas de proporción inversa (como velocidad y tiempo).
- Cruzar erróneamente los datos al armar las columnas.
- Ignorar las unidades de medida (ej. mezclar gramos con kilos en la regla de tres).
- Apurarse sin comprobar que la constante inicial era correcta.
- Aplicar el modelo de proporción directa a una situación que en realidad es de proporcionalidad
  inversa.
afirmaciones_verdaderas:
- La propiedad de resolución de problemas de proporción directa preserva la consistencia lógica.
- Antes de aplicar una proporción directa a un problema, hay que confirmar que ambas magnitudes
  efectivamente aumentan o disminuyen en la misma proporción.
al_terminar_debes_poder: Resolver problemas aplicados que involucren resolución de problemas
  de proporción directa.
fuente: Currículum Nacional MINEDUC.
estado: publicado
