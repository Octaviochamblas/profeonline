semantic_id: MAT.NUM.RAZONES_PROPORCIONES.PROBLEMAS_PROP_DIRECTA
resumen_inicial: 'La resolución de problemas de proporcionalidad directa consiste en identificar magnitudes que varían en el mismo sentido multiplicativo, plantear una proporción $\frac{A_1}{B_1} = \frac{A_2}{x}$ y despejar la incógnita mediante producto cruzado: $x = \frac{B_1 \cdot A_2}{A_1}$.'
explicacion_simple: "![Resolución de problemas directos](/static/img/nodos/resolucion-de-problemas-de-proporcion-directa-intro.svg)\n\nPara resolver cualquier problema de **proporcionalidad directa**, sigue este método infalible en 3 pasos:\n\n1. **Paso 1: Validar el comportamiento**\n   - Pregúntate: *«¿Si la primera magnitud aumenta al doble, la segunda también aumenta al doble?»*\n   - Si la respuesta es SÍ, es proporción directa.\n2. **Paso 2: Ordenar los datos en una tabla o proporción**\n   $$\\frac{A_1}{B_1} = \\frac{A_2}{x}$$\n3. **Paso 3: Multiplicar cruzado y despejar**\n   $$x = \\frac{B_1 \\cdot A_2}{A_1}$$\n\n- **Ejemplo:** Si $5\\text{ litros}$ de pintura cubren $40\\text{ m}^2$, ¿cuántos litros se necesitan para $120\\text{ m}^2$?\n  - Planteamos: $\\frac{5}{40} = \\frac{x}{120}$.\n  - Multiplicamos en cruz: $x = \\frac{5 \\cdot 120}{40} = \\frac{600}{40} = 15\\text{ litros}$."
explicacion_formal: 'Sea un problema en contexto con magnitudes $A$ y $B$ tales que $B = k \cdot A$.


  **Algoritmo Formal de Solución:**

  1. **Verificación de la Hipótesis de Proporcionalidad:** Demostrar que $\frac{dB}{dA} = k = \text{cte} > 0$.

  2. **Planteamiento Proporcional:**

  $$\frac{A_1}{B_1} = \frac{A_2}{B_2}$$

  3. **Despeje por Teorema Fundamental:**

  $$A_1 \cdot B_2 = B_1 \cdot A_2 \implies B_2 = \frac{B_1 \cdot A_2}{A_1} \quad (A_1 \neq 0)$$

  4. **Análisis Dimensional:** Comprobar la coherencia de las unidades de medida resultantes:

  $$[B_2] = \frac{[B_1] \cdot [A_2]}{[A_1]} = [B_1] \quad (\text{dado que } [A_2] = [A_1])$$'
definiciones_clave: '- **Problema de proporción directa**: Situación contextual modelada por $B = kA$.

  - **Planteamiento de regla de tres**: Formato tabular $\frac{A_1}{B_1} = \frac{A_2}{x}$.

  - **Consistencia de unidades**: Homogeneidad en las dimensiones de las magnitudes comparadas.'
propiedades_relaciones: '- **Escalabilidad**: El factor de escala $n = \frac{A_2}{A_1}$ se aplica directamente a la respuesta: $B_2 = n \cdot B_1$.

  - **Doble enfoque**: Puede resolverse por proporción cruzada o por valor unitario $k$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de problemas directos](/static/img/nodos/resolucion-de-problemas-de-proporcion-directa-ejemplos.svg)


    Si $5\text{ litros}$ de pintura cubren $40\text{ m}^2$, ¿cuántos litros se necesitan para $120\text{ m}^2$? Además, si un trabajador gana $\$180.000$ en $6\text{ días}$, ¿cuánto ganará en $14\text{ días}$?'
  pasos:
  - 'Paso 1: Para la pintura: Plantear la proporción directa $\frac{5\text{ L}}{40\text{ m}^2} = \frac{x}{120\text{ m}^2}$.'
  - 'Paso 2: Despejar en cruz: $x = \frac{5 \cdot 120}{40} = \frac{600}{40} = 15\text{ L}$.'
  - 'Paso 3: Para el salario: Calcular el valor diario $k = \frac{180.000}{6} = \$30.000\text{/día}$.'
  - 'Paso 4: Multiplicar por los días trabajados: $S = 30.000 \cdot 14 = \$420.000$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el primer paso indispensable antes de aplicar la regla de tres directa?
  choices:
  - text: Verificar que las dos magnitudes realmente aumenten o disminuyan en el mismo factor multiplicativo
    is_correct: true
  - text: Sumar los números del enunciado
    is_correct: false
  - text: Multiplicar todos los datos entre sí
    is_correct: false
  - text: Convertir todos los números a porcentaje
    is_correct: false
  explanation: La alternativa correcta es 'Verificar que las dos magnitudes realmente aumenten o disminuyan en el mismo factor multiplicativo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué para pintar el triple de superficie (120 m² vs 40 m²) se necesitó el triple de pintura (15 L vs 5 L)?
  choices:
  - text: Porque en la proporcionalidad directa, al triplicar la entrada (superficie), la salida (litros) se triplica obligatoriamente
    is_correct: true
  - text: Porque 120 menos 40 es 80
    is_correct: false
  - text: Porque 5 es un número primo
    is_correct: false
  - text: Por una coincidencia numérica
    is_correct: false
  explanation: La alternativa correcta es 'Porque en la proporcionalidad directa, al triplicar la entrada (superficie), la salida (litros) se triplica obligatoriamente'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el problema e identificar las dos magnitudes y sus respectivas unidades de medida.'
- 'Paso 2: Verificar la hipótesis de proporcionalidad directa (más produce más multiplicativamente).'
- 'Paso 3: Plantear la proporción $\frac{A_1}{B_1} = \frac{A_2}{x}$ y resolver aplicando producto cruzado: $x = \frac{B_1 \cdot A_2}{A_1}$.'
errores_correccion: '- **Error 1: Aplicar regla directa a problemas de proporción inversa.** **Cómo corregirlo:** Analizar siempre el contexto: si más obreros tardan MENOS días, la proporción es INVERSA, no directa.

  - **Error 2: Mezclar unidades (ej: horas con minutos).** **Cómo corregirlo:** Convertir todas las cantidades a la misma unidad antes de operar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $3\text{ kg}$ de paltas cuestan $\$10.500$, ¿cuánto costarán $8\text{ kg}$?
  alternativas:
  - $\$28.000$
  - $\$24.000$
  - $\$31.500$
  respuesta: $\$28.000$
  solucion_pasos:
  - $k = \frac{10.500}{3} = 3.500\text{ \$/kg} \implies 3.500 \cdot 8 = \$28.000$.
- titulo: Ejemplo 2
  enunciado: Un automóvil consume $6\text{ litros}$ de bencina cada $90\text{ km}$. ¿Cuántos litros consumirá en un viaje de $450\text{ km}$?
  alternativas:
  - $30\text{ litros}$
  - $25\text{ litros}$
  - $36\text{ litros}$
  respuesta: $30\text{ litros}$
  solucion_pasos:
  - $\frac{6}{90} = \frac{x}{450} \implies x = \frac{6 \cdot 450}{90} = 6 \cdot 5 = 30\text{ litros}$.
- titulo: ¿Se puede resolver un problema directo calculando primero el valor unitario k?
  respuesta: Sí
  solucion_pasos:
  - Sí, calcular el valor unitario $k = \frac{y}{x}$ y luego multiplicar es un método equivalente y muy intuitivo.
  alternativas:
  - texto: Sí, el método del valor unitario es completamente equivalente a la regla de tres
    es_correcta: true
    retroalimentacion: ¡Correcto! Enfoque por tasa unitaria.
  - texto: No, solo se puede resolver con la regla de tres formal
    es_correcta: false
    retroalimentacion: Incorrecto, ambos métodos son matemáticamente idénticos.
  - texto: No, da un resultado aproximado
    es_correcta: false
    retroalimentacion: Incorrecto, da el resultado exacto.
- titulo: ¿Es directamente proporcional el número de fotocopias y el precio total a pagar?
  respuesta: Sí
  solucion_pasos:
  - Sí, a mayor número de copias, mayor es el costo total en proporción fija por hoja.
  alternativas:
  - texto: Sí, el costo aumenta en proporción fija por cada copia adicional
    es_correcta: true
    retroalimentacion: ¡Correcto! Proporcionalidad directa estándar.
  - texto: No, es inversamente proporcional
    es_correcta: false
    retroalimentacion: Incorrecto, no disminuye el costo al sacar más copias.
  - texto: No, es una relación cuadrática
    es_correcta: false
    retroalimentacion: Incorrecto, la tasa unitaria es constante.
errores_frecuentes:
- Aplicar proporción directa a situaciones inversas o afines.
- No convertir unidades heterogéneas antes de plantear la proporción.
- Desordenar la posición de las magnitudes en la tabla cruzada.
- Cometer errores de cálculo en la división final.
afirmaciones_verdaderas:
- En la proporcionalidad directa, las magnitudes escalan en el mismo factor multiplicativo.
- El problema se resuelve planteando $\frac{A_1}{B_1} = \frac{A_2}{x}$ o mediante la constante $k$.
- Es indispensable verificar la homogeneidad de unidades de medida antes de calcular.
al_terminar_debes_poder: '![Síntesis de resolución de problemas directos](/static/img/nodos/resolucion-de-problemas-de-proporcion-directa-resumen.svg)


  QUÉ: Resolver problemas contextuales aplicando el modelo y las propiedades de la proporcionalidad directa.


  CÓMO: Validando la naturaleza directa de las variables, ordenando los datos en la proporción $\frac{A_1}{B_1} = \frac{A_2}{x}$ y despejando la incógnita mediante producto cruzado $x = \frac{B_1 \cdot A_2}{A_1}$ o tasa unitaria $k$.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
