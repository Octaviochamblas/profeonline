semantic_id: MAT.NUM.PROP_DIRECTA.PROBLEMAS_CONTEXTO
resumen_inicial: 'Resolución de problemas de proporción directa: concepto y propiedades
  fundamentales en Proporcionalidad directa.'
explicacion_simple: ¿Cómo calculan las constructoras el material para 100 casas si
  solo hicieron los planos de una? Las proporciones directas son herramientas de la
  vida real usadas a diario para escalar ingredientes, costos, tiempo y materiales.
explicacion_formal: 'Para resolver un problema de la vida cotidiana usando **proporcionalidad
  directa**, lo más crítico es leer con cuidado para confirmar que no haya ''cargos
  fijos'' o relaciones inversas (ej. más obreros $\rightarrow$ menos tiempo, eso es
  inverso).


  Una vez seguros de que es directa (ej. más kilos $\rightarrow$ más dinero; más tiempo
  $\rightarrow$ más distancia), usamos la regla de tres cruzada o calculamos $k$ para
  despejar la incógnita. Plantear los datos en una tabla rápida mental o en papel
  evita cruzar los números equivocados.'
definiciones_clave: '- **Resolución de problemas de proporción directa**: Elemento
  central dentro del estudio de Proporcionalidad directa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a resolución de problemas de proporción directa.'
ejemplo_guiado:
  enunciado: Aplica el concepto de resolución de problemas de proporción directa en
    un ejercicio paso a paso.
  pasos:
  - Identificar los datos dados en el problema.
  - Aplicar la regla o fórmula correspondiente a resolución de problemas de proporción
    directa.
  - Efectuar los cálculos aritméticos necesarios.
  - Concluir con el resultado final simplificado.
