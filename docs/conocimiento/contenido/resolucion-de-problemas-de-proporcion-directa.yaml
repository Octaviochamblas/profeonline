resumen_inicial: La resolución de problemas de proporción directa en contexto utiliza
  la regla de tres directa $\frac{x_1}{y_1} = \frac{x_2}{y_2}$ o el modelo $y = kx$
  para hallar magnitudes desconocidas en la vida cotidiana.
explicacion_simple: Para resolver problemas cotidianos (como escalar recetas, convertir
  monedas o calcular sueldos por horas trabajadas), identificamos que al aumentar
  una cantidad la otra también aumenta proporcionalmente y aplicamos el producto cruzado.
explicacion_formal: 'Dado un problema en contexto con magnitudes directamente proporcionales
  $\{(x_1, y_1), (x_2, y_2)\}$, el **Procedimiento de Resolución Contextual** exige:


  $$\frac{y_1}{x_1} = \frac{y_2}{x_2} \implies y_2 = \frac{y_1 \cdot x_2}{x_1}$$


  **Verificación de hipótesis contextual:**

  - Validar que el contexto físico o económico garantice la constancia de la razón
  $k$ (ej: precio unitario constante, velocidad constante).'
definiciones_clave: '- **Resolución contextual**: Aplicación de $\frac{y_1}{x_1} =
  \frac{y_2}{x_2}$ en problemas cotidianos.'
propiedades_relaciones: '- **Regla de tres directa contextual**: Proporción $y_2 =
  \frac{y_1 \cdot x_2}{x_1}$.'
ejemplo_guiado:
  enunciado: Si una impresora imprime $35$ páginas en $5\text{ minutos}$, ¿cuántas
    páginas imprimirá en $12\text{ minutos}$ trabajando a velocidad constante?
  pasos:
  - 'Paso 1: Identificar las variables: tiempo ($x$) y páginas ($y$). Verificar proporción
    directa.'
  - 'Paso 2: Plantear la proporción: $\frac{35}{5} = \frac{y_2}{12}$.'
  - 'Paso 3: Calcular la constante $k = 35 / 5 = 7\text{ pág/min}$.'
  - 'Paso 4: Multiplicar por el nuevo tiempo: $y_2 = 7 \cdot 12 = 84\text{ páginas}$.'
  - 'Conclusión: Imprimirá $84$ páginas en $12$ minutos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ecuación de regla de tres resuelve problemas de proporcionalidad
    directa entre dos pares de datos?
  choices:
  - text: y2 = (y1 · x2) / x1 (derivada de la igualdad de cocientes y1/x1 = y2/x2)
    is_correct: true
  - text: y2 = y1 · x1 · x2
    is_correct: false
  - text: y2 = x1 + x2 - y1
    is_correct: false
  - text: y2 = (x1 · y1) / x2
    is_correct: false
  explanation: La alternativa correcta es 'y2 = (y1 · x2) / x1 (derivada de la igualdad
    de cocientes y1/x1 = y2/x2)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado de la impresora (35 pág en 5 min), ¿cuántas páginas
    imprime en 12 min?
  choices:
  - text: 84 páginas
    is_correct: true
  - text: 60 páginas
    is_correct: false
  - text: 70 páginas
    is_correct: false
  - text: 100 páginas
    is_correct: false
  explanation: La alternativa correcta es '84 páginas'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de resolver problemas reales de proporcionalidad
  directa aplicando la constante $k$ o la regla de tres directa $y_2 = \frac{y_1 \cdot
  x_2}{x_1}$.
semantic_id: MAT.NUM.PROP_DIRECTA.PROBLEMAS_CONTEXTO
procedimiento:
- 'Paso 1: Verificar que el cociente $y / x = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = k \cdot x$ o el gráfico de recta que pasa por
  $(0,0)$.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Creer que una recta con desfase $y = kx + c$ ($c
  \neq 0$) representa proporcionalidad directa.** **Cómo corregirlo:** La proporcionalidad
  directa exige obligatoriamente pasar por el origen $(0,0)$, sin término independiente
  $c$.


  - **Error 2: Usar el producto $x \cdot y$ en lugar del cociente $y / x$ para hallar
  $k$.** **Cómo corregirlo:** El producto constante corresponde a proporcionalidad
  INVERSA; la directa usa el cociente $y/x = k$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_DIRECTA.PROBLEMAS_CONTEXTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad directa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de cociente.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por cociente constante y/x.
- titulo: ¿Pasa la gráfica de una proporción directa por el origen (0,0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $x=0 \implies y=0$.
- titulo: ¿Permite el modelo y = kx calcular valores desconocidos?
  respuesta: Sí
  solucion_pasos:
  - Sí, multiplicando el valor de $x$ por la constante $k$.
errores_frecuentes:
- Clasificar como proporcionalidad directa una relación cuya gráfica es una recta
  que no pasa por el origen $(0,0)$.
- Multiplicar las variables entre sí ($x \cdot y$) pretendiendo obtener la constante
  de proporcionalidad directa.
- Sumar una cantidad fija a ambas variables pensando que se mantiene la relación de
  proporción.
- Declarar que si una variable aumenta y la otra también aumenta, existe proporcionalidad
  directa sin comprobar la constancia de $y/x$.
- Omitir incluir la unidad de medida compuesta en el valor de la constante de proporcionalidad
  $k$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son directamente proporcionales si su cociente es constante:
  $\frac{y}{x} = k$.'
- El gráfico de una relación de proporcionalidad directa es siempre una línea recta
  que pasa por el origen $(0,0)$.
