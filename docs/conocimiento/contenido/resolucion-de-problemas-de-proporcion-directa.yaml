semantic_id: MAT.NUM.PROP_DIRECTA.PROBLEMAS_CONTEXTO
resumen_inicial: 'La resolución de problemas de proporción directa consiste en aplicar la constante $k = \frac{y}{x}$ o la regla del producto cruzado $\frac{a}{b} = \frac{c}{x}$ para predecir cantidades desconocidas en situaciones reales.'
explicacion_simple: |
  Los problemas de proporción directa aparecen constantemente en la vida diaria: al cocinar recetas para más personas, al calcular cuánto pagarás por varios kilos de fruta, al convertir monedas extranjeras o al calcular la distancia recorrida en un viaje. El método infalible para resolverlos es la **regla de tres simple directa**: colocas las tres cantidades conocidas en forma de proporción y usas el producto cruzado para encontrar el número que falta.
explicacion_formal: |
  ### Definición formal
  Un **problema de proporción directa en contexto real** es aquel en el que dos magnitudes físicas o económicas $X$ e $Y$ están vinculadas por la ley de escala $y = k \cdot x$. Dado un par de datos de referencia $(x_1, y_1)$ y un nuevo valor $x_2$, el valor incógnito $y_2$ satisface la ecuación proporcional:
  $$\frac{y_1}{x_1} = \frac{y_2}{x_2} \implies y_2 = \frac{y_1 \cdot x_2}{x_1}$$

  ### Algoritmo de la Regla de Tres Simple Directa
  1. **Disposición tabular de datos**:
     $$\begin{array}{ccc} \text{Magnitud } X & & \text{Magnitud } Y \\ x_1 & \longrightarrow & y_1 \\ x_2 & \longrightarrow & y_2 \end{array}$$
  2. **Multiplicación en diagonal y división**:
     $$y_2 = \frac{x_2 \cdot y_1}{x_1}$$

  ### Principales ámbitos de aplicación
  - **Conversión de divisas**: Dólares a pesos chilenos ($\text{CLP} = \text{Tasa} \cdot \text{USD}$).
  - **Recetas de cocina**: Cantidad de ingredientes por número de porciones.
  - **Escalas en planos y mapas**: Distancia en el mapa a distancia real ($\text{Distancia real} = \text{Escala} \cdot \text{Distancia plano}$).

  ### Síntesis didáctica
  - Algoritmo práctico: $x_{\text{buscado}} = \frac{\text{Diagonal conocida}}{\text{Dato restante}}$.
definiciones_clave: |
  - **Regla de tres simple directa**: Algoritmo que permite hallar un cuarto término en problemas donde dos magnitudes son directamente proporcionales.
  - **Escala de mapa / plano**: Razón de proporcionalidad entre las dimensiones de un dibujo y las dimensiones reales de un objeto.
  - **Factor de conversión de unidades**: Razón igual a 1 que permite transformar unidades de medida manteniendo la proporcionalidad.
propiedades_relaciones: |
  - **Conservación de porcentajes**: Los problemas de porcentaje simple ($P\%$) constituyen casos particulares de proporcionalidad directa donde el consecuente de referencia es siempre 100.
  - **Verificación de sentido común**: Si la cantidad independiente aumenta, la cantidad dependiente calculada debe ser obligatoriamente mayor a la inicial.
ejemplo_guiado:
  enunciado: 'Para preparar un pastel para 6 personas se necesitan 300 gramos de harina. ¿Cuántos gramos de harina se requerirán para preparar el mismo pastel para 15 personas?'
  pasos:
    - 'Paso 1: Planteamos la regla de tres simple verificando que es proporción directa (a más personas, más harina): 6 personas $\to$ 300 g ; 15 personas $\to x$ g.'
    - 'Paso 2: Formamos la proporción de razones equivalentes: $\frac{6}{300} = \frac{15}{x}$.'
    - 'Paso 3: Aplicamos el producto cruzado: $6 \cdot x = 300 \cdot 15 \implies 6x = 4.500$.'
    - 'Paso 4: Despejamos $x$ dividiendo entre 6: $x = \frac{4.500}{6} = 750\text{ gramos}$. Se necesitan **750 gramos de harina**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el procedimiento de la regla de tres simple directa para calcular la incógnita $y_2$ en la tabla $x_1 \to y_1$ y $x_2 \to y_2$?'
    choices:
      - {text: 'Multiplicar la diagonal conocida $x_2 \cdot y_1$ y dividir entre el dato restante $x_1$ ($y_2 = \frac{x_2 \cdot y_1}{x_1}$)', is_correct: true}
      - {text: 'Multiplicar en horizontal $x_1 \cdot y_1$ y dividir entre $x_2$', is_correct: false}
      - {text: 'Restar $x_2 - x_1$ y sumarlo a $y_1$', is_correct: false}
      - {text: 'Multiplicar los tres datos conocidos entre sí', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar la diagonal conocida $x_2 \cdot y_1$ y dividir entre el dato restante $x_1$ ($y_2 = \frac{x_2 \cdot y_1}{x_1}$)''. Es la resolución mediante producto cruzado.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $3$ entradas para el teatro cuestan $\$18.000$, ¿cuánto se debe pagar por $7$ entradas?'
    choices:
      - {text: '$\$42.000$, calculando el costo unitario de $\$6.000$ y multiplicando por $7$', is_correct: true}
      - {text: '$\$36.000$, duplicando el valor', is_correct: false}
      - {text: '$\$54.000$, triplicando el valor', is_correct: false}
      - {text: '$\$25.000$, sumando $\$7.000$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$42.000$, calculando el costo unitario de $\$6.000$ y multiplicando por $7$''. Costo unitario: $18.000 / 3 = 6.000$; para 7 entradas: $7 \cdot 6.000 = 42.000$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer atentamente el problema e identificar las dos magnitudes que intervienen.'
  - 'Paso 2: Comprobar que las magnitudes son directamente proporcionales (si una se duplica, la otra se duplica).'
  - 'Paso 3: Organizar los datos en una tabla de tres valores conocidos y una incógnita $x$.'
  - 'Paso 4: Aplicar la regla de tres simple directa multiplicando en diagonal y dividiendo por el dato restante.'
errores_correccion: |
  - **Error 1:** Aplicar la regla de tres directa en problemas donde las magnitudes son inversamente proporcionales (ej: velocidad y tiempo de viaje). **Cómo corregirlo:** Antes de hacer el producto cruzado, **comprueba el tipo de relación**: si a más cantidad de una corresponde MENOS de la otra, la proporción es inversa, no directa.
  - **Error 2:** Desalinear las unidades de medida al armar la tabla de datos (ej: mezclar horas con minutos en la misma columna). **Cómo corregirlo:** Convierte todas las mediciones de una misma magnitud a la **misma unidad antes de formular la proporción**.
ejemplos:
  - titulo: 'Problema de receta culinaria'
    enunciado: 'Si $400\text{ g}$ de harina rinden para $8$ porciones, ¿para cuántas porciones rendirán $1.000\text{ g}$ de harina?'
    alternativas:
      - ' Rendirán para 20 porciones'
      - 'Rendirán para 15 porciones'
      - 'Rendirán para 25 porciones'
    respuesta: ' Rendirán para 20 porciones'
    solucion_pasos:
      - '1. Razón unitaria: $400 / 8 = 50\text{ g por porción}$.'
      - '2. Porciones con 1.000 g: $1.000 / 50 = 20\text{ porciones}$.'
  - titulo: 'Problema de conversión de divisas'
    enunciado: 'Si $1\text{ USD} = 900\text{ CLP}$, ¿cuántos pesos chilenos equivalen a $50\text{ USD}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $50 \cdot 900 = 45.000\text{ CLP}$.'
  - titulo: 'Problema de escala en mapa'
    enunciado: 'En un mapa a escala $1 : 50.000$, una distancia mide $4\text{ cm}$. ¿La distancia real es de $2\text{ km}$ ($200.000\text{ cm}$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $4 \cdot 50.000 = 200.000\text{ cm} = 2\text{ km}$.'
  - titulo: 'Problema de rendimiento laboral'
    enunciado: 'Un obrero pinta $18\text{ m}^2$ en $2\text{ horas}$. ¿Cuántos $\text{m}^2$ pintará en $5\text{ horas}$ a ritmo constante?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Tasa: $18 / 2 = 9\text{ m}^2/\text{h} \implies 9 \cdot 5 = 45\text{ m}^2$.'
errores_frecuentes:
  - 'Aplicar la regla de tres simple directa en problemas de proporción inversa.'
  - 'Mezclar unidades de medida diferentes en una misma columna de la tabla de datos.'
  - 'Multiplicar en horizontal los datos de la tabla en lugar de multiplicar en diagonal.'
  - 'El valor numérico obtenido en la regla de tres puede ser incoherente con el crecimiento de la magnitud.'
  - 'Sumar la diferencia de datos en lugar de aplicar el factor de escala multiplicativo.'
afirmaciones_verdaderas:
  - 'En todo problema de proporcionalidad directa, el cociente entre la variable dependiente e independiente se mantiene constante en todas las situaciones.'
  - 'La regla de tres simple directa resuelve problemas cotidianos mediante la fórmula $y_2 = \frac{x_2 \cdot y_1}{x_1}$.'
al_terminar_debes_poder: 'Resolver problemas en contexto real aplicando la regla de tres simple directa y la constante de proporcionalidad $k = \frac{y}{x}$.'
