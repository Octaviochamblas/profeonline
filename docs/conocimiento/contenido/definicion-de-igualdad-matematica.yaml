semantic_id: MAT.ALG.ECUACION_BASE.DEFINICION_IGUALDAD
resumen_inicial: Una igualdad matemática es la relación de equivalencia que afirma que dos expresiones representan el mismo valor numérico o algebraico.
explicacion_simple: |
  Una igualdad matemática funciona exactamente como una balanza en perfecto equilibrio.

  Utiliza el símbolo igual ($=$) para establecer que la expresión ubicada en el lado izquierdo posee exactamente el mismo valor cuantitativo que la del lado derecho.

  Para mantener este equilibrio, cualquier operación (adición, sustracción, multiplicación o división) realizada en un miembro debe aplicarse idénticamente en el otro.
explicacion_formal: |
  ### Definición formal
  Una **igualdad matemática** es una proposición o relación binaria $A = B$ definida sobre un conjunto numérico o de funciones $\mathbb{R}$:

  $$A = B \iff v(A) = v(B)$$

  ### Desglose de la fórmula
  - $A, B$: Expresiones algebraicas o numéricas denominadas primer miembro y segundo miembro.
  - $v(A) = v(B)$: La función de evaluación asigna valores numéricos idénticos a ambos miembros.

  ### Síntesis didáctica
  La igualdad es una relación de equivalencia que satisface reflexividad ($A = A$), simetría (si $A = B \implies B = A$) y transitividad (si $A = B$ y $B = C \implies A = C$).
definiciones_clave: |
  - **Igualdad matemática**: Afirmación de equivalencia cuantitativa entre dos expresiones unidas por el signo $=$.
  - **Relación de equivalencia**: Propiedad lógica que satisface reflexividad, simetría y transitividad en todo conjunto numérico.
propiedades_relaciones: |
  - **Propiedad simétrica**: Si $A = B$, entonces $B = A$.
  - **Propiedad transitiva**: Si $A = B$ y $B = C$, entonces $A = C$.
ejemplo_guiado:
  enunciado: 'Verifica si la relación entre las expresiones $3(4 + 2)$ y $2(7 + 2)$ constituye una igualdad matemática válida y determina su valor equivalente.'
  pasos:
    - 'Paso 1: Evaluar el primer miembro: $A = 3(4 + 2) = 3(6) = 18$.'
    - 'Paso 2: Evaluar el segundo miembro: $B = 2(7 + 2) = 2(9) = 18$.'
    - 'Paso 3: Comparar ambos valores numéricos: $18 = 18$.'
    - 'Paso 4: Concluir que $3(4 + 2) = 2(7 + 2)$ es una igualdad matemática válida de valor $18$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad asegura que si la expresión $A$ es igual a $B$, entonces $B$ es igual a $A$?'
    choices:
      - {text: 'Propiedad simétrica de la igualdad.', is_correct: true}
      - {text: 'Propiedad transitiva de la igualdad.', is_correct: false}
      - {text: 'Propiedad distributiva del producto.', is_correct: false}
      - {text: 'Propiedad conmutativa de la resta.', is_correct: false}
    explanation: 'La alternativa correcta es ''Propiedad simétrica de la igualdad.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar $3(4 + 2)$ y $2(7 + 2)$, ¿cuál es el valor común comprobado?'
    choices:
      - {text: '$18$', is_correct: true}
      - {text: '$12$', is_correct: false}
      - {text: '$14$', is_correct: false}
      - {text: '$36$', is_correct: false}
    explanation: 'La alternativa correcta es ''$18$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las expresiones algebraicas o numéricas a ambos lados del signo $=$.'
  - 'Paso 2: Evaluar numéricamente la expresión del primer miembro.'
  - 'Paso 3: Evaluar numéricamente la expresión del segundo miembro.'
  - 'Paso 4: Confirmar la validez de la igualdad si ambos resultados coinciden exactamente.'
errores_correccion: |
  - **Error 1:** Considerar que el signo $=$ representa únicamente una instrucción de cálculo o resultado final. **Cómo corregirlo:** El signo $=$ **ES UNA DECLARACIÓN DE EQUIVALENCIA GLOBAL ENTRE DOS MIEMBROS DE IGUAL VALOR NUMÉRICO**.
  - **Error 2:** Alterar el valor de un solo miembro realizando una operación no simétrica. **Cómo corregirlo:** Toda operación matemática **DEBE APLICARSE EXACTAMENTE EN AMBOS MIEMBROS PARA PRESERVAR EL EQUILIBRIO DE LA IGUALDAD**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál de las siguientes expresiones representa una igualdad matemática válida?'
    alternativas:
      - '$5 + 3 = 2 \cdot 4$'
      - '$5 + 3 = 10 - 3$'
      - '$5 + 3 = 4 \cdot 3$'
    respuesta: '$5 + 3 = 2 \cdot 4$'
    solucion_pasos:
      - '1. Miembro izquierdo: $5 + 3 = 8$.'
      - '2. Miembro derecho: $2 \cdot 4 = 8$.'
      - '3. Puesto que $8 = 8$, es una igualdad válida.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Si $a + b = 10$ y $10 = c$, ¿qué afirmación es correcta por propiedad transitiva?'
    alternativas:
      - '$a + b = c$'
      - '$a = b + c$'
      - '$a \cdot b = c$'
    respuesta: '$a + b = c$'
    solucion_pasos:
      - '1. Primera igualdad: $a + b = 10$.'
      - '2. Segunda igualdad: $10 = c$.'
      - '3. Por transitividad: $a + b = c$.'
  - titulo: 'Simetría de la igualdad'
    enunciado: '¿La proposición $x = 5$ es lógicamente equivalente a $5 = x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la propiedad simétrica de la igualdad.'
  - titulo: 'Preservación por adición'
    enunciado: '¿Sumar $7$ a ambos miembros de la igualdad $x = y$ mantiene la equivalencia?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, aplicar la misma suma a ambos lados no altera el equilibrio.'
errores_frecuentes:
  - 'El signo $=$ indica únicamente una instrucción para calcular una respuesta a la derecha.'
  - 'La propiedad simétrica $A = B \implies B = A$ cambia el signo de las expresiones.'
  - 'La adición de una cantidad constante en un solo miembro preserva el equilibrio numérico.'
  - 'Dividir ambos miembros de una igualdad entre cero mantiene una equivalencia válida.'
  - 'Dos expresiones con diferente valor numérico forman una igualdad condicionada.'
afirmaciones_verdaderas:
  - 'Una igualdad matemática es una relación de equivalencia que satisface reflexividad, simetría y transitividad.'
  - 'Aplicar la misma operación matemática en ambos miembros de una igualdad genera una igualdad equivalente.'
al_terminar_debes_poder: |
  QUÉ: Definir el concepto de igualdad matemática y sus propiedades fundamentales.
  CÓMO: Verificar la equivalencia numérica entre miembros y aplicar las propiedades simétrica, transitiva y uniforme.
