semantic_id: MAT.ALG.ECUACION_BASE.DEFINICION_IGUALDAD
resumen_inicial: Una igualdad matemática es la relación de equivalencia que afirma
  que dos expresiones representan el mismo valor numérico o algebraico.
explicacion_simple: 'Una igualdad matemática es como una balanza perfectamente equilibrada.

  Utiliza el símbolo igual ($=$) para indicar que lo que está al lado izquierdo tiene
  exactamente el mismo valor numérico que lo que está al lado derecho.

  Si alteramos un lado sumando o multiplicando algo, debemos hacer exactamente lo
  mismo en el otro lado para que la balanza siga equilibrada.'
explicacion_formal: 'Una **igualdad matemática** se expresa como la relación binaria
  $A = B$ sobre un conjunto numérico o de funciones $\mathbb{R}$:


  $$A = B \iff v(A) = v(B)$$


  **Desglose de la fórmula:**

  - $A, B$: Expresiones numéricas o algebraicas (primer y segundo miembro).

  - $v(A) = v(B)$: La evaluación o valor numérico asignado a la expresión $A$ es estrictamente
  idéntico al de $B$.'
definiciones_clave: '- **Igualdad matemática**: Declaración de equivalencia entre
  dos expresiones unidas por el signo $=$.

  - **Relación de equivalencia**: Propiedad que cumple reflexividad ($A = A$), simetría
  (si $A = B \implies B = A$) y transitividad (si $A = B$ y $B = C \implies A = C$).'
propiedades_relaciones: '- **Simetría**: Si $A = B$, entonces $B = A$.

  - **Transitividad**: Si $A = B$ y $B = C$, entonces $A = C$.'
ejemplo_guiado:
  enunciado: Verifica si la relación entre las expresiones $3(4 + 2)$ y $2(7 + 2)$
    constituye una igualdad matemática válida.
  pasos:
  - 'Paso 1: Evaluar el miembro izquierdo $A = 3(4 + 2) = 3(6) = 18$.Paso 2: Evaluar
    el miembro derecho $B = 2(7 + 2) = 2(9) = 18$.Paso 3: Comparar ambos valores:
    $18 = 18$.Paso 4: Concluir que $3(4 + 2) = 2(7 + 2)$ es una igualdad matemática
    válida.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué propiedad asegura que si la expresión $A$ es igual a $B$, entonces
    $B$ es igual a $A$?
  choices:
  - text: Propiedad simétrica de la igualdad.
    is_correct: true
  - text: Propiedad transitiva de la igualdad.
    is_correct: false
  - text: Propiedad distributiva del producto.
    is_correct: false
  - text: Propiedad conmutativa de la resta.
    is_correct: false
  explanation: La alternativa correcta es 'Propiedad simétrica de la igualdad.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la expresión $3(4 + 2)$ y $2(7 + 2)$, ¿cuál es el valor común
    comprobado?
  choices:
  - text: $18$
    is_correct: true
  - text: $12$
    is_correct: false
  - text: $14$
    is_correct: false
  - text: $36$
    is_correct: false
  explanation: La alternativa correcta es '$18$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las expresiones situadas a la izquierda y derecha del signo
  $=$.'
- 'Paso 2: Evaluar numéricamente la expresión del primer miembro.'
- 'Paso 3: Evaluar numéricamente la expresión del segundo miembro.'
- 'Paso 4: Confirmar la validez de la igualdad comparando ambos resultados numéricos.'
errores_correccion: '- **Error común:** Asumir que el signo $=$ significa solo ''el
  resultado de la operación''.

  - **Cómo corregirlo:** El signo $=$ no es una orden para calcular, es una declaración
  de EQUIVALENCIA entre dos miembros.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de igualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de igualdades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar la misma cantidad en ambos miembros preserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Una ecuación se cumple para todos los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una ecuación condicional solo se cumple para valores específicos.
errores_frecuentes:
- Confundir la definición de una igualdad numérica con la de una expresión algebraica.
- Asumir que las identidades solo son válidas para números enteros positivos.
- Confundir los miembros de una ecuación con sus términos individuales.
- Sumar o restar una cantidad en un solo lado de la ecuación al intentar despejar.
- Dividir ambos miembros de la ecuación entre cero.
afirmaciones_verdaderas:
- Una ecuación es una igualdad condicionada que se verifica solo para determinados
  valores de la incógnita.
- Aplicar las propiedades aditiva y multiplicativa en ambos miembros de una ecuación
  genera ecuaciones equivalentes.
al_terminar_debes_poder: Al finalizar este recurso podrás definir conceptos fundamentales
  de ecuaciones de primer grado y aplicar las propiedades de la igualdad.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Primer Grado
