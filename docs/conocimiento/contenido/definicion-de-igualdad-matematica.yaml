procedimiento:
- 'Paso 1: Identifica el signo $=$ como el centro de la expresión.'
- 'Paso 2: Reconoce todo lo que está a la izquierda como la ''expresión izquierda''
  (peso izquierdo).'
- 'Paso 3: Reconoce todo lo que está a la derecha como la ''expresión derecha'' (peso
  derecho).'
- 'Paso 4: Entiende que ambas expresiones representan la misma cantidad total.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en definición de igualdad matemática.
ejemplos:
- titulo: La expresión $4 \cdot 2 = 10 - 2$ es una igualdad verdadera
  enunciado: ¿La expresión $4 \cdot 2 = 10 - 2$ es una igualdad verdadera?
  solucion_pasos:
  - 'Lado izquierdo: $4 \cdot 2 = 8$.'
  - 'Lado derecho: $10 - 2 = 8$.'
  - Ambos lados valen 8. Por lo tanto, $8 = 8$, la igualdad es verdadera y está en
    equilibrio.
- titulo: Toda expresión matemática que contenga números y letras es automáticamente
    una igualdad
  enunciado: Toda expresión matemática que contenga números y letras es automáticamente
    una igualdad.
  solucion_pasos:
  - Si no tiene el signo '=', es solo una expresión (un polinomio o monomio), no una
    igualdad.
  - 'Respuesta: Falso'
- titulo: 'Respecto de «Definición de igualdad matemática»: ¿Se ajusta a la definición
    esta afirmación?'
  enunciado: 'Respecto de «Definición de igualdad matemática»: ¿Se ajusta a la definición
    esta afirmación? «Una igualdad matemática es una afirmación que establece que
    dos expresiones tienen exactamente el mismo valor numérico o algebraico»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Una igualdad matemática es una
    afirmación que establece que dos expresiones tienen exactamente el mismo valor
    numérico o algebraico.'
- titulo: 'Respecto de «Definición de igualdad matemática»: ¿Es compatible con el
    procedimiento esta af'
  enunciado: 'Respecto de «Definición de igualdad matemática»: ¿Es compatible con
    el procedimiento esta afirmación? «Creer que el signo = significa ''aquí va la
    respuesta''»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Una igualdad matemática es una
    afirmación que establece que dos expresiones tienen exactamente el mismo valor
    numérico o algebraico.'
errores_frecuentes:
- Creer que el signo = significa 'aquí va la respuesta'.
- Confundir una expresión algebraica simple (ej. $2x+3$) con una igualdad (ej. $2x+3=0$).
- Se debe calcular la operación de la izquierda para poner el resultado a la derecha.
- Para «En matemáticas, el signo de igualdad ($=$) indica que:», la respuesta correcta
  es El lado izquierdo es mayor que el derecho.
- Las expresiones son idénticas en su forma escrita.
afirmaciones_verdaderas:
- Una ecuación lineal de primer grado tiene como máximo una única solución en los
  números reales.
al_terminar_debes_poder: Resolver ecuaciones y sistemas lineales aplicando definición
