semantic_id: MAT.ALG.ECUACION_BASE.DEFINICION_IGUALDAD
resumen_inicial: 'Definición de igualdad matemática: propiedades, resolución y modelamiento
  en Ecuación de primer grado: conceptos y propiedades.'
explicacion_simple: 'Antes de correr, hay que caminar. Y antes de resolver ecuaciones,
  hay que entender qué significa el signo más famoso de las matemáticas: el igual
  ($=$). No es una orden para ''calcular el resultado'', es una declaración de equilibrio.'
explicacion_formal: '### Definición formal


  El signo = declara que ambas cantidades, aunque estén escritas de forma distinta,
  representan la misma magnitud o valor.


  ### Desarrollo didáctico


  ¿Qué significa realmente escribir $A = B$?

  Significa que, aunque se vean distintos, lo que está a la izquierda pesa exactamente
  lo mismo que lo que está a la derecha.


  Piensa en una balanza antigua de dos platillos. Si tienes 5 kilos de plomo a la
  izquierda y 5 kilos de plumas a la derecha, la balanza no se mueve. Visualmente
  son diferentes, pero en ''valor'' son idénticos.


  Existen dos tipos de igualdades básicas:

  1. **Igualdades Numéricas:** Tienen solo números. Ej: $3 + 2 = 5$. Esto es siempre
  verdadero.

  2. **Igualdades Algebraicas:** Tienen letras (variables). Ej: $x + 2 = 5$. Esta
  igualdad depende del valor que tome la $x$ para ser verdadera o falsa.


  El signo $=$ actúa como el pivote central de esta balanza. Todo lo que hagas a un
  lado, deberás hacerlo al otro para mantener ese delicado equilibrio.'
definiciones_clave: '- **Definición de igualdad matemática**: Herramienta matemática
  para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
