semantic_id: MAT.GEO.TRIG_CUADRANTES.CUADRANTE_ANGULO
resumen_inicial: 'Determinación del cuadrante al que pertenece un ángulo: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: El plano cartesiano se divide en cuatro cuadrantes (I, II, III,
  IV), y según el rango en que se encuentre la medida de un ángulo, su lado terminal
  cae en uno de ellos.
explicacion_formal: '![Cuadrante de un ángulo](/static/img/geometria/trigonometria/trigcuad-cuadrante-angulo.svg)


  ### Definición formal


  Dado un ángulo $\theta$ en posición general con $0°\le\theta<360°$, se determina
  su cuadrante comparando su medida con los límites 90°, 180° y 270°.


  ### Desarrollo didáctico


  En la figura, el ángulo de 210° tiene su lado terminal en el tercer cuadrante, ya
  que 210° está entre 180° y 270°. Si el lado terminal cae exactamente sobre un eje
  (0°, 90°, 180°, 270°), el ángulo no pertenece a ningún cuadrante, se dice que es
  un ángulo cuadrantal.'
definiciones_clave: '- **Determinación del cuadrante al que pertenece un ángulo**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a determinación del cuadrante al que pertenece
  un ángulo.'
ejemplo_guiado:
