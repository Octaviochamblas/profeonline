procedimiento:
- 'Paso 1: Verifica que la medida del ángulo esté entre 0° y 360° (reduciéndola si
  es necesario).'
- 'Paso 2: Compara la medida con los límites 90°, 180° y 270°.'
- 'Paso 3: Determina el cuadrante según el rango correspondiente (I: 0°-90°, II: 90°-180°,
  III: 180°-270°, IV: 270°-360°).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con determinación del cuadrante al que pertenece un ángulo.
