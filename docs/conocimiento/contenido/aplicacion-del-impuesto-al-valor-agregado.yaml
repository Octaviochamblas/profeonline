semantic_id: MAT.NUM.VARIACION_PORCENTUAL.IVA
resumen_inicial: 'Aplicación del Impuesto al Valor Agregado: concepto y propiedades fundamentales
  en Variaciones porcentuales.'
explicacion_simple: Todo lo que compras en una tienda formal ya trae el IVA escondido. El
  gobierno recauda el 19% extra sobre el precio original (neto). ¿Sabrías cómo 'quitarle'
  ese IVA a un producto para saber cuánto gana realmente el vendedor?
explicacion_formal: 'El **IVA (Impuesto al Valor Agregado)** es un aumento porcentual estándar
  fijado por el Estado (en Chile, 19%).


  Términos comerciales:

  - **Precio Neto:** Valor real del producto sin impuestos (es el $100\%$ base).

  - **Valor del IVA:** Monto de dinero que va al gobierno ($19\%$ del neto).

  - **Precio Bruto (Final):** Lo que pagas en caja ($119\%$ del neto).


  **Para agregar el IVA:**

  Multiplicas el precio neto por $1.19$ (es un aumento porcentual).

  **Para ''sacarle'' el IVA a un precio final:**

  Como $Bruto = Neto \cdot 1.19$, entonces $Neto = Bruto \div 1.19$. (¡Nunca calcules el 19%
  del bruto para restarlo, eso matemáticamente está mal porque la base era el neto!).'
definiciones_clave: '- **Aplicación del Impuesto al Valor Agregado**: Elemento central dentro
  del estudio de Variaciones porcentuales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a aplicación del impuesto al valor agregado.'
ejemplo_guiado:
  enunciado: Un producto tiene un precio bruto, con IVA incluido, de $23.800. Calcula el precio
    neto, sabiendo que el IVA es del 19%.
  pasos:
  - Identifico que el precio bruto es 119% del precio neto, es decir el factor es 1,19.
  - 'Planteo la ecuación: Neto igual a Bruto dividido entre 1,19.'
  - 'Calculo: 23.800 dividido entre 1,19 es igual a 20.000. El precio neto es 20.000 pesos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con aplicación del impuesto al valor
    agregado?
  choices:
  - text: Identificar correctamente la relación de variaciones porcentuales
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de variaciones porcentuales.
    Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de aplicación del impuesto al valor agregado,
    ¿qué paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
    clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica si el dato dado es el Neto (sin impuesto) o el Bruto (con impuesto ya
  metido).'
- 'Paso 2: Si te dan el Neto y piden el Bruto, multiplica por $1.19$.'
- 'Paso 3: Si te dan el Bruto (lo pagado en caja) y piden el Neto, divide por $1.19$.'
errores_correccion: Evita confundir los datos de entrada al operar con aplicación del impuesto
  al valor agregado.
ejemplos:
- titulo: Despejando el Neto
  enunciado: Pagas $11.900 por un audífono. ¿Cuánto es el precio neto sin IVA?
  solucion_pasos:
  - 11.900 es el Precio Bruto.
  - Para hallar el neto, dividimos por el factor 1.19.
  - $11.900 / 1.19 = 10.000$.
  - El precio sin IVA era $10.000. (El Estado se llevó $1.900).
- titulo: Ejemplo 2
  enunciado: Un producto neto cuesta $40.000. ¿Cuál es su precio con IVA del 19%?
  alternativas:
  - '47.600'
  - '40.190'
  - '59.000'
  respuesta: '47.600'
  solucion_pasos:
  - 40.000 por 1,19 es igual a 47.600.
- titulo: Ejemplo 3
  enunciado: Un producto bruto cuesta $59.500. ¿Cuál es su precio neto?
  alternativas:
  - '50.000'
  - '48.195'
  - '40.500'
  respuesta: '50.000'
  solucion_pasos:
  - 59.500 dividido entre 1,19 es igual a 50.000.
- titulo: ¿El IVA se calcula siempre sobre el precio neto, no sobre el bruto?
  respuesta: Sí
  solucion_pasos:
  - Por eso para 'sacar' el IVA de un precio final se divide por 1,19, no se resta directamente
    el 19%.
errores_frecuentes:
- Creer que si un producto cuesta $10.000 bruto, el IVA es $1.900 (Falso, el IVA se calcula
  sobre el neto, en este caso sería $10.000 / 1.19 = 8.403$, y el IVA es $1.597$).
- Restar el 19% del Precio Bruto para intentar hallar el Neto.
- Restar el 19% del Precio Bruto para intentar hallar el Neto, lo cual es matemáticamente
  incorrecto.
- Confundir el precio neto con el precio bruto al identificar los datos del problema.
- Multiplicar por 1,19 cuando se busca el neto, en vez de dividir.
afirmaciones_verdaderas:
- La propiedad de aplicación del impuesto al valor agregado preserva la consistencia lógica.
- Para calcular el precio neto a partir del precio bruto, siempre se divide por el factor
  1,19, nunca se resta directamente el 19% del bruto.
al_terminar_debes_poder: Resolver problemas aplicados que involucren aplicación del impuesto
  al valor agregado.
