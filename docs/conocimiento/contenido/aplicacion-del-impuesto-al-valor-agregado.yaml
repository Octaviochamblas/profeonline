resumen_inicial: 'El Impuesto al Valor Agregado (IVA) en Chile es un recargo porcentual
  del $19\%$ aplicado sobre el precio neto de un bien o servicio: $\text{Precio Bruto}
  = \text{Precio Neto} \cdot 1,19$.'
explicacion_simple: El IVA en Chile es un impuesto del 19% que se le agrega a los
  productos. Para pasar de un precio Neto (sin impuesto) a precio Bruto (con impuesto),
  multiplicamos por 1,19. Para sacar el neto a partir del bruto, dividimos entre 1,19.
explicacion_formal: 'En el sistema tributario chileno, el **Impuesto al Valor Agregado
  (IVA = $19\%$)** establece la relación entre el **Precio Neto ($P_{neto}$)** y el
  **Precio Bruto ($P_{bruto}$)**:


  $$P_{bruto} = P_{neto} \cdot \left(1 + \frac{19}{100}\right) = P_{neto} \cdot 1,19$$


  $$\text{Monto IVA} = P_{neto} \cdot 0,19 = P_{bruto} - P_{neto}$$


  $$P_{neto} = \frac{P_{bruto}}{1,19}$$'
definiciones_clave: '- **IVA (19%)**: Impuesto del 19% aplicado sobre el precio neto
  $P_{bruto} = P_{neto} \cdot 1,19$.'
propiedades_relaciones: '- **Conversión Bruto/Neto**: Multiplicar por 1,19 para agregar
  IVA; dividir por 1,19 para extraer IVA.'
ejemplo_guiado:
  enunciado: Un producto tiene un precio Neto de \$50.000. Calcule el valor del IVA
    ($19\%$) y el precio Bruto final.
  pasos:
  - 'Paso 1: Calcular el monto del IVA: $\text{Monto IVA} = 50.000 \cdot 0,19 = 9.500$.'
  - 'Paso 2: Calcular el precio Bruto multiplicando por $1,19$: $P_{bruto} = 50.000
    \cdot 1,19 = 59.500$.'
  - 'Conclusión: El IVA es de \$9.500 y el precio Bruto es \$59.500.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué factor se multiplica el Precio Neto para obtener directamente
    el Precio Bruto con el 19% de IVA?
  choices:
  - text: Por el factor 1,19
    is_correct: true
  - text: Por el factor 0,19
    is_correct: false
  - text: Por 19
    is_correct: false
  - text: Por 1,019
    is_correct: false
  explanation: La alternativa correcta es 'Por el factor 1,19'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para un Neto de $50.000, ¿cuál fue el Precio Bruto
    final?
  choices:
  - text: 59.500 $
    is_correct: true
  - text: 59.000 $
    is_correct: false
  - text: 50.950 $
    is_correct: false
  - text: 69.500 $
    is_correct: false
  explanation: La alternativa correcta es '59.500 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular precios Netos, Brutos
  y montos de IVA ($19\%$) utilizando los factores $1,19$ y $0,19$.
semantic_id: MAT.NUM.VARIACION_PORCENTUAL.IVA
procedimiento:
- 'Paso 1: Identificar la tasa de variación $P\%$ y determinar si es aumento ($1 +
  p$) o descuento ($1 - p$).'
- 'Paso 2: Multiplicar el valor inicial por el factor multiplicativo correspondiente.'
- 'Paso 3: Resolver numéricamente y verificar que el resultado final responda a la
  situación planteada.'
errores_correccion: '- **Error 1: Sumar o restar porcentajes sucesivos directamente
  (pensar que $-20\%$ y $-10\%$ dan $-30\%$).** **Cómo corregirlo:** Los porcentajes
  sucesivos se MULTIPLICAN por sus factores decimales ($0,80 \cdot 0,90 = 0,72 \implies
  -28\%$).


  - **Error 2: Usar el valor final como denominador al calcular la variación porcentual.**
  **Cómo corregirlo:** El denominador para el cambio relativo es SIEMPRE el valor
  inicial $V_i$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.VARIACION_PORCENTUAL.IVA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de factores de variación porcentual.
- titulo: Ejemplo 2
  enunciado: Verificación de factor multiplicativo.
  alternativas:
  - Cumple el factor
  - No cumple
  - Indeterminado
  respuesta: Cumple el factor
  solucion_pasos:
  - Demostración formal por $1 \pm p$.
- titulo: ¿Equivale el IVA en Chile a multiplicar el neto por 1,19?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $1 + 0,19 = 1,19$.
- titulo: ¿Altera el orden en que se aplican dos descuentos sucesivos el precio final?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa del producto de factores.
errores_frecuentes:
- Sumar directamente dos porcentajes de descuento sucesivos aplicados sobre un mismo
  producto.
- Utilizar el precio final como el denominador de referencia al calcular la variación
  porcentual relativa.
- Dividir por 0,19 para extraer el Impuesto al Valor Agregado (IVA) de un precio Bruto.
- Un descuento del $20\%$ seguido de un aumento del $20\%$ devuelve el producto a
  su precio original.
- Restar el número entero del porcentaje al precio sin convertirlo a su factor decimal
  $1 - d$.
afirmaciones_verdaderas:
- El aumento o descuento porcentual se calcula directamente multiplicando el valor
  inicial por el factor $(1 \pm p)$.
- Dos descuentos sucesivos del $a\%$ y $b\%$ equivalen al factor acumulado $(1 - a/100)(1
  - b/100)$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
