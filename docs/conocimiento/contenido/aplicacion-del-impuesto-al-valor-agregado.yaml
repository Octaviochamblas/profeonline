semantic_id: MAT.NUM.VARIACION_PORCENTUAL.IVA
estado: publicado
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES / Legislación Tributaria
resumen_inicial: 'El Impuesto al Valor Agregado (IVA) en Chile es un recargo legal
  del $19\%$ sobre el Valor Neto: $\text{Bruto} = \text{Neto} \cdot 1,19$, y el Valor
  Neto se extrae mediante la división $\text{Neto} = \frac{\text{Bruto}}{1,19}$.'
explicacion_simple: 'El IVA es el impuesto al consumo que se agrega al valor de los
  bienes y servicios. El precio sin impuesto se llama Valor Neto (100%), el impuesto
  es el IVA (19%) y el precio final que paga el consumidor es el Valor Bruto (119%).
  Para pasar de Neto a Bruto multiplicamos por $1,19$, y para desglosar el Neto desde
  el Bruto dividimos entre $1,19$.


  ![aplicacion-del-impuesto-al-valor-agregado](/static/img/nodos/aplicacion-del-impuesto-al-valor-agregado-intro.svg)

  '
explicacion_formal: 'En la legislación tributaria chilena, con una tasa impositiva
  del $19\%$, las relaciones fundamentales entre el **Valor Neto** ($N$), el **Impuesto
  al Valor Agregado** ($\text{IVA}$) y el **Valor Bruto** ($B$) son:


  $$\text{IVA} = N \cdot 0,19$$


  $$B = N + \text{IVA} = N \cdot (1 + 0,19) = N \cdot 1,19$$


  $$N = \frac{B}{1,19}$$


  $$\text{IVA} = B - N = B - \frac{B}{1,19} = B \cdot \left(1 - \frac{1}{1,19}\right)
  = B \cdot \left(\frac{0,19}{1,19}\right) \approx B \cdot 0,15966$$'
definiciones_clave: '- **Valor Neto**: Precio del bien o servicio antes de aplicar
  el tributo fiscal ($100\%$ base).

  - **IVA (19%)**: Monto recaudado correspondiente al tributo fiscal sobre el valor
  neto.

  - **Valor Bruto**: Precio total facturado o boleteado al consumidor final ($119\%$).'
propiedades_relaciones: '- **Cálculo de Neto desde Bruto**: La extracción del neto
  SIEMPRE se realiza dividiendo entre $1,19$ (¡nunca multiplicando por $0,81$!).

  - **Proporcionalidad**: El IVA contenido en una boleta bruta equivale aproximadamente
  al $15,97\%$ del valor total bruto.'
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/aplicacion-del-impuesto-al-valor-agregado-resumen.svg)


  QUÉ: Calcular el IVA, el valor bruto y el valor neto de bienes y servicios. CÓMO:
  Aplicando $B = N \cdot 1,19$ para obtener el valor bruto y $N = \frac{B}{1,19}$
  para extraer el valor neto.'
