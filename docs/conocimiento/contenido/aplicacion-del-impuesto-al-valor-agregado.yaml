procedimiento:
- 'Paso 1: Identificar si la cantidad conocida es el Valor Neto ($N$) o el Valor Bruto
  ($B$).'
- 'Paso 2: Si se conoce el Neto, calcular el Bruto multiplicando $B = N \cdot 1,19$,
  y el IVA como $N \cdot 0,19$.'
- 'Paso 3: Si se conoce el Bruto, calcular el Neto dividiendo $N = \frac{B}{1,19}$,
  y el IVA restando $\text{IVA} = B - N$.'
ejemplo_guiado:
  enunciado: Una boleta de compraventa emitida en un supermercado tiene un total a
    pagar de $\$238.000$ (IVA incluido). Calcule el valor neto y el monto pagado por
    concepto de IVA.
  pasos:
  - 'Paso 1: Identificar que $\$238.000$ corresponde al Valor Bruto $B$ (incluye el
    $19\%$ de IVA).'
  - 'Paso 2: Calcular el Valor Neto dividiendo por $1,19$: $N = \frac{238.000}{1,19}
    = 200.000$.'
  - 'Paso 3: Calcular el IVA por diferencia: $\text{IVA} = 238.000 - 200.000 = 38.000$.'
  - 'Conclusión: El Valor Neto es de $\$200.000$ y el impuesto IVA corresponde a $\$38.000$.'
  imagen: /static/img/nodos/aplicacion-del-impuesto-al-valor-agregado-ejemplos.svg
