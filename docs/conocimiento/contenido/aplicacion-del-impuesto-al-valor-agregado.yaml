errores_correccion: '- **Error 1: Multiplicar el valor bruto por $0,81$ para calcular
  el neto.** **Cómo corregirlo:** El $19\%$ se calcula sobre el neto, no sobre el
  bruto. Para volver al neto, la operación matemática correcta es $\frac{\text{Bruto}}{1,19}$.

  - **Error 2: Calcular el $19\%$ del bruto creyendo que ese es el IVA.** **Cómo corregirlo:**
  El IVA es el $19\%$ del neto, lo que equivale aproximadamente al $15,97\%$ del bruto.'
ejemplos:
- titulo: Factura por compra de materiales
  enunciado: Una empresa adquiere insumos por un valor neto de $\$500.000$. ¿Cuál es
    el monto del IVA y el valor total de la factura?
  alternativas:
  - IVA = $\$95.000$ | Total = $\$595.000$
  - IVA = $\$50.000$ | Total = $\$550.000$
  - IVA = $\$95.000$ | Total = $\$500.000$
  - IVA = $\$100.000$ | Total = $\$600.000$
  respuesta: IVA = $\$95.000$ | Total = $\$595.000$
  solucion_pasos:
  - 'Calcular IVA: $500.000 \cdot 0,19 = 95.000$ pesos.'
  - 'Calcular Total: $500.000 \cdot 1,19 = 595.000$ pesos.'
- titulo: Desglose de boleta de restaurante
  enunciado: La cuenta final en un restaurante es de $\$47.600$ con IVA incluido. ¿Cuál
    fue el consumo neto?
  alternativas:
  - $\$40.000$
  - $\$38.556$
  - $\$42.000$
  - $\$39.000$
  respuesta: $\$40.000$
  solucion_pasos:
  - 'Dividir por 1,19: $\text{Neto} = \frac{47.600}{1,19} = 40.000$ pesos.'
- titulo: ¿Equivale el IVA en Chile a multiplicar el valor neto por 1,19 para obtener
    el total bruto?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $1 + 0,19 = 1,19$.
- titulo: ¿Multiplicar un precio bruto por 0,81 entrega el valor neto exacto?
  respuesta: 'No'
  solucion_pasos:
  - No, porque $1,19 \cdot 0,81 = 0,9639 \neq 1$. Para obtener el neto exacto se debe
    dividir por $1,19$.
errores_frecuentes:
- Multiplicar el precio bruto por 0,81 para calcular el precio neto.
- Calcular el 19% directamente sobre el total bruto para deducir el IVA.
- Olvidar que el IVA se suma al neto y no se resta al bruto para tasar operaciones
  comerciales.
afirmaciones_verdaderas:
- El Valor Bruto se obtiene multiplicando el Valor Neto por $1,19$.
- El Valor Neto se obtiene dividiendo el Valor Bruto entre $1,19$.
