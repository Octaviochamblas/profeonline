semantic_id: MAT.NUM.VARIACION_PORCENTUAL.IVA
resumen_inicial: 'Aplicación del Impuesto al Valor Agregado: concepto y propiedades
  fundamentales en Variaciones porcentuales.'
explicacion_simple: Todo lo que compras en una tienda formal ya trae el IVA escondido.
  El gobierno recauda el 19% extra sobre el precio original (neto). ¿Sabrías cómo
  'quitarle' ese IVA a un producto para saber cuánto gana realmente el vendedor?
explicacion_formal: 'El **IVA (Impuesto al Valor Agregado)** es un aumento porcentual
  estándar fijado por el Estado (en Chile, 19%).


  Términos comerciales:

  - **Precio Neto:** Valor real del producto sin impuestos (es el $100\%$ base).

  - **Valor del IVA:** Monto de dinero que va al gobierno ($19\%$ del neto).

  - **Precio Bruto (Final):** Lo que pagas en caja ($119\%$ del neto).


  **Para agregar el IVA:**

  Multiplicas el precio neto por $1.19$ (es un aumento porcentual).

  **Para ''sacarle'' el IVA a un precio final:**

  Como $Bruto = Neto \cdot 1.19$, entonces $Neto = Bruto \div 1.19$. (¡Nunca calcules
  el 19% del bruto para restarlo, eso matemáticamente está mal porque la base era
  el neto!).'
definiciones_clave: '- **Aplicación del Impuesto al Valor Agregado**: Elemento central
  dentro del estudio de Variaciones porcentuales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a aplicación del impuesto al valor agregado.'
ejemplo_guiado:
