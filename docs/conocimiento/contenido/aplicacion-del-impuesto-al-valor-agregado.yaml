procedimiento:
- 'Paso 1: Identifica si el dato dado es el Neto (sin impuesto) o el Bruto (con impuesto
  ya metido).'
- 'Paso 2: Si te dan el Neto y piden el Bruto, multiplica por $1.19$.'
- 'Paso 3: Si te dan el Bruto (lo pagado en caja) y piden el Neto, divide por $1.19$.'
errores_correccion: Evita confundir los datos de entrada al operar con aplicación
  del impuesto al valor agregado.
ejemplos:
- titulo: Despejando el Neto
  enunciado: Pagas $11.900 por un audífono. ¿Cuánto es el precio neto sin IVA?
  solucion_pasos:
  - 11.900 es el Precio Bruto.
  - Para hallar el neto, dividimos por el factor 1.19.
  - $11.900 / 1.19 = 10.000$.
  - El precio sin IVA era $10.000. (El Estado se llevó $1.900).
errores_frecuentes:
- Creer que si un producto cuesta $10.000 bruto, el IVA es $1.900 (Falso, el IVA se
  calcula sobre el neto, en este caso sería $10.000 / 1.19 = 8.403$, y el IVA es $1.597$).
- Restar el 19% del Precio Bruto para intentar hallar el Neto.
afirmaciones_verdaderas:
- La propiedad de aplicación del impuesto al valor agregado preserva la consistencia
  lógica.
al_terminar_debes_poder: Resolver problemas aplicados que involucren aplicación del
  impuesto al valor agregado.
