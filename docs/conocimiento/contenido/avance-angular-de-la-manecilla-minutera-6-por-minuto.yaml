semantic_id: MAT.GEO.ANGULOS_APLICACIONES.MANECILLA_MINUTERA_AVANCE
resumen_inicial: La manecilla minutera de un reloj de manecillas completa una vuelta
  entera (360°) en 60 minutos, lo que representa una rapidez angular constante de
  exactamente 6° por cada minuto.
explicacion_simple: '![Avance de la Manecilla Minutera](/static/img/nodos/avance-angular-de-la-manecilla-minutera-6-por-minuto-intro.svg)


  Un reloj es un círculo completo de $360^\circ$. El minutero da toda la vuelta en
  60 minutos. Si divides $360^\circ$ entre 60, obtienes exactamente **$6^\circ$ por
  cada minuto**. Por ejemplo, en 5 minutos avanza $5 \times 6^\circ = 30^\circ$ (el
  espacio entre dos números consecutivos).'
explicacion_formal: '### Definición formal

  La manecilla minutera de un reloj de esfera circular recorre una circunferencia
  completa ($360^\circ$) en un intervalo de 60 minutos. Su **velocidad angular media
  constante** $\omega_m$ se calcula como:


  $$\omega_m = \frac{360^\circ}{60 \text{ min}} = 6^\circ/\text{min} \iff \theta_m(t)
  = 6 \cdot t \quad (t \text{ en minutos})$$


  ### Desglose simbólico y geométrico

  - $\omega_m = 6^\circ/\text{min}$: Razón de cambio angular de la manecilla minutera.

  - $\theta_m(t)$: Posición angular en grados recorrida por el minutero desde el origen
  (las 12:00) tras $t$ minutos.

  - Cada marca de minuto en la esfera representa un arco de $6^\circ$.


  ### Síntesis didáctica

  La tasa constante de $6^\circ$ por minuto permite modelar linealmente la trayectoria
  del minutero y resolver problemas de encuentro y separación de manecillas.'
definiciones_clave: '- **Velocidad angular minutera ($v_m$)**: Constante angular de
  $6^\circ/\text{min}$ (o $360^\circ/\text{h}$).

  - **Posición horaria de referencia**: Las 12:00 en la carátula corresponde a $\theta
  = 0^\circ$.

  - **Espacio de 5 minutos**: Intervalo entre dos números adyacentes del reloj ($5
  \times 6^\circ = 30^\circ$). '
propiedades_relaciones: '- **Relación de proporcionalidad directa**: El ángulo barrido
  es estrictamente proporcional a los minutos transcurridos ($\theta_m = 6^\circ \cdot
  M$).

  - **Velocidad en segundos**: En 1 segundo avanza $\frac{6^\circ}{60} = 0{,}1^\circ/\text{s}$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Avance del Minutero](/static/img/nodos/avance-angular-de-la-manecilla-minutera-6-por-minuto-ejemplos.svg)


    ¿Qué ángulo barre la manecilla minutera de un reloj analógico entre las 10:10
    y las 10:35?'
  pasos:
  - 'Paso 1: Calcular el tiempo transcurrido en minutos: $35 - 10 = 25\text{ minutos}$.'
  - 'Paso 2: Recordar la velocidad angular del minutero: $v_m = 6^\circ/\text{min}$.'
  - 'Paso 3: Multiplicar el tiempo por la velocidad: $\theta_m = 25 \times 6^\circ$.'
  - 'Paso 4: Calcular el producto: $25 \times 6 = 150^\circ$.'
  - 'Paso 5: Concluir que el minutero barre un ángulo de $150^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué rapidez angular constante se desplaza la manecilla minutera de
    un reloj?
  choices:
  - text: A razón de 6° por cada minuto (porque 360° / 60 min = 6°/min)
    is_correct: true
  - text: A razón de 0,5° por cada minuto
    is_correct: false
  - text: A razón de 1° por cada minuto
    is_correct: false
  - text: A razón de 30° por cada minuto
    is_correct: false
  explanation: Como recorre 360° en 60 minutos, su velocidad es a razón de 6° por
    cada minuto (porque 360° / 60 min = 6°/min).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuántos grados sexagesimales barre la manecilla minutera en 15 minutos
    (un cuarto de hora)?
  choices:
  - text: 90° (porque 15 × 6° = 90°)
    is_correct: true
  - text: 45°
    is_correct: false
  - text: 60°
    is_correct: false
  - text: 180°
    is_correct: false
  explanation: En 15 minutos barre 15 × 6° = 90° (porque 15 × 6° = 90°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar el número de minutos transcurridos $M$.'
- 'Paso 2: Multiplicar los minutos por la constante $6^\circ/\text{min}$.'
- 'Paso 3: Expresar el ángulo barrido $\theta_m = 6^\circ \cdot M$.'
errores_correccion: No confundas el avance del minutero (6°/min) con el de la manecilla
  horaria (0,5°/min).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántos grados barre el minutero en 10 minutos?
  alternativas:
  - $60^\circ$
  - $30^\circ$
  - $10^\circ$
  respuesta: $60^\circ$
  solucion_pasos:
  - $10 \times 6^\circ = 60^\circ$.
- titulo: Ejemplo 2
  enunciado: Si el minutero ha girado un ángulo de $180^\circ$, ¿cuántos minutos han
    transcurrido?
  alternativas:
  - $30\text{ minutos}$
  - $15\text{ minutos}$
  - $45\text{ minutos}$
  respuesta: $30\text{ minutos}$
  solucion_pasos:
  - $\frac{180^\circ}{6^\circ/\text{min}} = 30\text{ minutos}$.
- titulo: ¿El minutero avanza 6° en cada minuto de tiempo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $360^\circ / 60\text{ min} = 6^\circ/\text{min}$.
- titulo: ¿En media hora el minutero barre 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, en 30 minutos barre $30 \times 6^\circ = 180^\circ$ (media vuelta).
errores_frecuentes:
- Confundir la velocidad de 6°/min con 0,5°/min.
- Creer que cada minuto equivale a 1° de giro.
- Olvidar que el reloj tiene 12 divisiones principales de 30° cada una.
- Dividir 360 entre 12 en vez de 60 al calcular el avance por minuto.
- No considerar el tiempo transcurrido exacto en minutos.
afirmaciones_verdaderas:
- La velocidad angular del minutero es $6^\circ$ por minuto.
- En 60 minutos el minutero completa una rotación de $360^\circ$.
al_terminar_debes_poder: '**QUÉ:** Calcular desplazamientos y posiciones angulares
  de la manecilla minutera de un reloj.


  **CÓMO:** Aplicando la tasa constante de rotación $\theta_m = 6^\circ \cdot M$.


  ![Resumen de Manecilla Minutera](/static/img/nodos/avance-angular-de-la-manecilla-minutera-6-por-minuto-resumen.svg)'
