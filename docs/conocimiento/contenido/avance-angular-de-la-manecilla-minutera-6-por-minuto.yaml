semantic_id: MAT.GEO.ANGULOS_APLICACIONES.MANECILLA_MINUTERA_AVANCE
resumen_inicial: La manecilla minutera de un reloj gira a una velocidad angular constante
  de 6° por cada minuto, permitiendo calcular giros en función del tiempo.
explicacion_simple: 'Al trabajar con avance angular de la manecilla minutera: 6° por
  minuto, analizamos la relación entre aberturas angulares y cómo se aplican las reglas
  geométricas para encontrar valores desconocidos.'
explicacion_formal: 'En la teoría geométrica de avance angular de la manecilla minutera:
  6° por minuto, se aplican teoremas y relaciones algebraicas sobre rectas y vértices
  para estructurar demostraciones e igualdades angulares precisas.'
definiciones_clave: '- **Velocidad angular del minutero**: Tasa constante de $6^\circ$
  de rotación por minuto.

  - **Ángulo de barrido**: Medida del ángulo generado por el desplazamiento de la
  aguja en un tiempo determinado.

  '
propiedades_relaciones: '- **Relación con la aguja horaria**: Mientras el minutero
  avanza $6^\circ$ por minuto, la aguja horaria avanza $0.5^\circ$ por minuto ($30^\circ$
  en 60 min).

  - **Proporcionalidad directa**: El ángulo generado es directamente proporcional
  al tiempo transcurrido en minutos.

  '
ejemplo_guiado:
  enunciado: Si han transcurrido 15 minutos en el reloj, calcula el ángulo de rotación
    barrido por la manecilla minutera sabiendo que avanza a 6° por minuto.
  pasos:
  - 'Paso 1: Identificar la velocidad angular del minutero: $6^\circ$ por minuto.'
  - 'Paso 2: Multiplicar la tasa angular por el tiempo de 15 minutos: $\theta = 6^\circ
    \cdot 15$.'
  - 'Paso 3: Calcular el ángulo resultante: $\theta = 90^\circ$ (un ángulo recto).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos grados avanza la manecilla minutera por cada minuto que transcurre?
  choices:
  - text: 6° por minuto
    is_correct: true
  - text: 0.5° por minuto
    is_correct: false
  - text: 12° por minuto
    is_correct: false
  - text: 30° por minuto
    is_correct: false
  explanation: La alternativa correcta es '6° por minuto', obtenida al dividir 360°
    entre 60 minutos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué ángulo barre la manecilla minutera al cabo de 20 minutos?
  choices:
  - text: 120°
    is_correct: true
  - text: 90°
    is_correct: false
  - text: 180°
    is_correct: false
  - text: 60°
    is_correct: false
  explanation: La alternativa correcta es '120°', calculada como $6^\circ \cdot 20
    = 120^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el tiempo transcurrido en minutos ($t$).'
- 'Paso 2: Multiplicar los minutos por la constante de $6^\circ$.'
- 'Paso 3: Expresar el ángulo resultante en grados sexagesimales.'
errores_correccion: Evita confundir la velocidad del minutero (6°/min) con la de la
  aguja horaria (0.5°/min).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántos grados habrá girado el minutero después de transcurridos 10
    minutos?
  alternativas:
  - 60°
  - 30°
  - 120°
  respuesta: 60°
  solucion_pasos:
  - 'Multiplicar 10 minutos por 6°/min: $\theta = 6^\circ \cdot 10 = 60^\circ$.'
- titulo: Ejemplo 2
  enunciado: Si el minutero ha girado un ángulo de $180^\circ$, ¿cuántos minutos han
    pasado?
  alternativas:
  - 30 minutos
  - 15 minutos
  - 45 minutos
  respuesta: 30 minutos
  solucion_pasos:
  - 'Dividir el ángulo entre la tasa: $t = \frac{180^\circ}{6^\circ/\text{min}} =
    30\text{ minutos}$.'
- titulo: ¿En media hora (30 minutos) el minutero barre un ángulo de 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, en 30 minutos gira $6^\circ \cdot 30 = 180^\circ$ (media vuelta al reloj).
- titulo: ¿En 15 minutos el minutero genera un ángulo obtuso mayor a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, en 15 minutos gira $6^\circ \cdot 15 = 90^\circ$, formando un ángulo recto
    exactamente.
errores_frecuentes:
- Declarar los 6° por minuto del minutero con los 0.5° por minuto de la aguja horaria.
- Multiplicar los minutos por 30 en lugar de por 6.
- Afirmar que en 15 minutos el minutero da media vuelta completa al reloj.
- Omitir que un giro completo del minutero equivale a 360° en 60 minutos.
- Restar el tiempo en lugar de multiplicarlo por la constante de velocidad angular.
afirmaciones_verdaderas:
- La manecilla minutera gira 6° por cada minuto que pasa.
- El ángulo girado por el minutero es directamente proporcional al tiempo en minutos.
al_terminar_debes_poder: Al finalizar este recurso podrás calcular el ángulo de rotación
  de la manecilla minutera en función del tiempo transcurrido en minutos.
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Aplicaciones del sistema sexagesimal.
estado: publicado
