resumen_inicial: Las potencias enteras de la unidad imaginaria $i^n$ siguen un ciclo
  periódico de cuatro valores $\{i, -1, -i, 1\}$, determinado por el residuo de la
  división del exponente $n$ entre 4.
explicacion_simple: 'Al elevar $i$ a exponentes cada vez más grandes, los resultados
  se repiten en un patrón cíclico de cuatro pasos: $i$, $-1$, $-i$, $1$. Para saber
  el valor de cualquier potencia grande como $i^{43}$, dividimos 43 entre 4 y usamos
  el resto para hallar el resultado en el ciclo.'
explicacion_formal: 'Para todo $n \in \mathbb{N}_0$, el **Ciclo de Potencias de $i$**
  se rige por la división modular entre $4$ ($n = 4q + r$ con $0 \le r < 4$):


  $$i^n = i^{4q + r} = (i^4)^q \cdot i^r = (1)^q \cdot i^r = i^r$$


  **Tabla del ciclo según el residuo $r$:**

  - Residuo $r = 0 \implies i^0 = 1$

  - Residuo $r = 1 \implies i^1 = i$

  - Residuo $r = 2 \implies i^2 = -1$

  - Residuo $r = 3 \implies i^3 = -i$'
definiciones_clave: '- **Ciclo de potencias de $i$**: Patrón periódico de 4 valores
  $\{1, i, -1, -i\}$ gobernado por $i^n = i^r$ ($r = n \pmod 4$).'
propiedades_relaciones: '- **Periodicidad modular 4**: $i^4 = 1 \implies i^{4k} =
  1$ para todo entero $k$.'
ejemplo_guiado:
  enunciado: 'Calcule el valor exacto de las potencias de $i$: $i^{25}$ e $i^{42}$.'
  pasos:
  - 'Paso 1: Para $i^{25}$, dividir $25 : 4 = 6$ con residuo $r = 1 \implies i^{25}
    = i^1 = i$.'
  - 'Paso 2: Para $i^{42}$, dividir $42 : 4 = 10$ con residuo $r = 2 \implies i^{42}
    = i^2 = -1$.'
  - 'Conclusión: $i^{25} = i$ e $i^{42} = -1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos valores distintos toma el ciclo periódico de las potencias enteras
    de i?
  choices:
  - text: Toma exactamente 4 valores (i, -1, -i, 1)
    is_correct: true
  - text: Toma infinitos valores distintos
    is_correct: false
  - text: Toma solo 2 valores (1 y -1)
    is_correct: false
  - text: Toma 0 valores
    is_correct: false
  explanation: La alternativa correcta es 'Toma exactamente 4 valores (i, -1, -i,
    1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para i^{25}, ¿cuál fue el resultado al obtener residuo
    1?
  choices:
  - text: i
    is_correct: true
  - text: '-1'
    is_correct: false
  - text: -i
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es 'i'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular cualquier potencia entera
  de la unidad imaginaria $i^n = i^r$, utilizando el residuo $r$ de la división del
  exponente por 4.
semantic_id: MAT.NUM.IMAGINARIOS.POTENCIAS_DE_I
procedimiento:
- 'Paso 1: Identificar las expresiones con raíces negativas o potencias de $i$.'
- 'Paso 2: Aplicar la definición fundamental $i^2 = -1$ o el ciclo periódico modular
  $4$.'
- 'Paso 3: Simplificar la expresión resultando en un número imaginario puro o real.'
errores_correccion: '- **Error 1: Aplicar la propiedad $\sqrt{ab} = \sqrt{a}\sqrt{b}$
  a dos números negativos ($(\sqrt{-2})(\sqrt{-8}) = \sqrt{16} = 4$).** **Cómo corregirlo:**
  Se DEBE pasar primero a forma imaginaria ($i\sqrt{2} \cdot i\sqrt{8} = i^2 \sqrt{16}
  = -4$).


  - **Error 2: Confundir $i^2$ con $+1$.** **Cómo corregirlo:** La definición fundamental
  exige que $i^2 = -1$ (signo negativo).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.IMAGINARIOS.POTENCIAS_DE_I.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de los números imaginarios.
- titulo: Ejemplo 2
  enunciado: Verificación de la unidad imaginaria.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal con i^2 = -1.
- titulo: ¿Es i^4 igual al número entero 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $i^4 = (i^2)^2 = (-1)^2 = 1$.
- titulo: ¿Permite la unidad imaginaria resolver ecuaciones como x^2 + 1 = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^2 = -1 \implies x = \pm i$.
errores_frecuentes:
- Afirmar que la elevación de la unidad imaginaria al cuadrado $i^2$ resulta en el
  entero positivo $+1$.
- Multiplicar dos raíces de números negativos aplicando directamente el producto radical
  sin extraer la unidad imaginaria $i$.
- Intentar las potencias de la unidad imaginaria como una secuencia lineal sin periodicidad
  de 4 pasos.
- La expresión $\sqrt{-16}$ equivale numéricamente al entero real $-4$.
- Sumar las potencias de $i$ de exponentes consecutivos sin simplificar sus residuos
  modulares.
afirmaciones_verdaderas:
- La unidad imaginaria $i$ se define mediante la igualdad fundamental $i^2 = -1$ o
  $i = \sqrt{-1}$.
- 'Las potencias enteras de $i$ se repiten en un ciclo periódico de cuatro valores:
  $i, -1, -i, 1$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
