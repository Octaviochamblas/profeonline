semantic_id: MAT.NUM.IMAGINARIOS.POTENCIAS_DE_I
resumen_inicial: 'Las potencias enteras de la unidad imaginaria forman un ciclo periódico de cuatro valores que se repite indefinidamente: $i^1 = i$, $i^2 = -1$, $i^3 = -i$, $i^4 = 1$.'
explicacion_simple: |
  Cuando elevas la unidad imaginaria $i$ a exponentes cada vez más grandes, descubres un patrón mágico que se repite cada 4 pasos:
  1. $i^1 = i$
  2. $i^2 = -1$
  3. $i^3 = -i$
  4. $i^4 = 1$

  ¡A partir de $i^5$, los resultados vuelven a empezar! ($i^5 = i, i^6 = -1, i^7 = -i, i^8 = 1$). Para calcular cualquier potencia gigante como $i^{99}$, simplemente divides el exponente $99$ entre $4$ y miras el **resto de la división** ($99 = 4 \cdot 24 + 3$). El resto es $3$, por lo que $i^{99} = i^3 = -i$.
explicacion_formal: |
  ### Definición formal
  El **ciclo de potencias de la unidad imaginaria** es la secuencia periódica de período $T = 4$ generada por el grupo cíclico de orden 4 bajo la multiplicación:
  $$i^n = i^r \quad \text{donde } r = n \pmod 4 \quad (r \in \{0, 1, 2, 3\})$$

  ### Valores fundamentales del ciclo básico
  1. **Exponente $r = 1$**: $i^1 = i$
  2. **Exponente $r = 2$**: $i^2 = -1$
  3. **Exponente $r = 3$**: $i^3 = i^2 \cdot i = (-1) \cdot i = -i$
  4. **Exponente $r = 0$ (o múltiplo de 4)**: $i^4 = i^2 \cdot i^2 = (-1) \cdot (-1) = 1 \implies i^0 = 1$

  ### Algoritmo de reducción para exponentes grandes $n \in \mathbb{Z}$
  Dada la división entera $n = 4q + r$ (con $q \in \mathbb{Z}$ y $0 \le r < 4$):
  $$i^n = i^{4q + r} = (i^4)^q \cdot i^r = (1)^q \cdot i^r = 1 \cdot i^r = i^r$$

  ### Síntesis didáctica
  - Período de repetición: $4$.
  - Múltiplos exactos de 4: Toda potencia de la forma $i^{4k}$ es estrictamente igual al entero positivo $1$.
definiciones_clave: |
  - **Ciclo periódico de orden 4**: Secuencia periódica $\{i, -1, -i, 1\}$ que adquieren las potencias sucesivas de $i$.
  - **Resto de la división por 4 ($n \pmod 4$)**: Valor entero entre 0 y 3 que determina a cuál de las cuatro potencias básicas equivale $i^n$.
  - **Múltiplo de 4 ($i^{4k} = 1$)**: Potencia de $i$ con exponente divisible por 4 que anula la unidad imaginaria transformándola en 1.
propiedades_relaciones: |
  - **Suma de 4 potencias consecutivas**: La suma de cuatro potencias enteras consecutivas de $i$ es siempre igual a cero: $i^k + i^{k+1} + i^{k+2} + i^{k+3} = i - 1 - i + 1 = 0$.
  - **Potencias negativas**: $i^{-n} = \frac{1}{i^n} = \frac{i^4}{i^n} = i^{4 - n}$.
ejemplo_guiado:
  enunciado: 'Calcula el valor simplificado de la potencia de exponente elevado $A = i^{235}$.'
  pasos:
    - 'Paso 1: Tomamos el exponente $235$ y lo dividimos por $4$ mediante la división entera con resto.'
    - 'Paso 2: Realizamos la división: $235 \div 4 = 58$ con resto $r = 3$ (ya que $4 \cdot 58 = 232$, y $235 - 232 = 3$).'
    - 'Paso 3: Aplicamos el algoritmo de reducción $i^n = i^r$, reemplazando el exponente $235$ por el resto $3$: $i^{235} = i^3$.'
    - 'Paso 4: Evaluamos el valor del ciclo básico para exponente 3: $i^3 = -i \implies A = -i$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor del ciclo de potencias cuando el exponente es un múltiplo exacto de 4 ($i^{4k}$)?'
    choices:
      - {text: '$1$, ya que $i^4 = 1$ y $1^k = 1$', is_correct: true}
      - {text: '$i$, devolviendo la unidad imaginaria', is_correct: false}
      - {text: '$-1$, por ser un número par', is_correct: false}
      - {text: '$-i$, por la alternancia de signo', is_correct: false}
    explanation: 'La alternativa correcta es ''$1$, ya que $i^4 = 1$ y $1^k = 1$''. Los múltiplos de 4 dan como resultado 1.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor reducido de la potencia $i^{42}$?'
    choices:
      - {text: '$-1$, pues $42 \div 4$ deja resto $2$, e $i^2 = -1$', is_correct: true}
      - {text: '$1$, asumiendo división exacta', is_correct: false}
      - {text: '$i$, asumiendo resto 1', is_correct: false}
      - {text: '$-i$, asumiendo resto 3', is_correct: false}
    explanation: 'La alternativa correcta es ''$-1$, pues $42 \div 4$ deja resto $2$, e $i^2 = -1$''. $42 = 4 \cdot 10 + 2 \implies i^{42} = i^2 = -1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar el exponente entero $n$ de la potencia $i^n$.'
  - 'Paso 2: Dividir el exponente $n$ por $4$ y determinar el resto $r \in \{0, 1, 2, 3\}$.'
  - 'Paso 3: Reescribir la potencia equivalente reducida $i^r$.'
  - 'Paso 4: Sustituir el valor según la tabla del ciclo: $i^0 = 1, i^1 = i, i^2 = -1, i^3 = -i$.'
errores_correccion: |
  - **Error 1:** Usar el cociente de la división en lugar del resto para reducir el exponente (ej: para $i^{13}$, dividir $13 \div 4 = 3$ y decir $i^3 = -i$). **Cómo corregirlo:** La propiedad utiliza el **resto de la división**: $13 = 4 \cdot 3 + 1 \implies \text{resto } r = 1 \implies i^{13} = i^1 = i$.
  - **Error 2:** Creer que las potencias de $i$ producen números diferentes a los 4 del ciclo (ej: pensar que $i^5 = 5i$). **Cómo corregirlo:** Toda potencia de $i$ con exponente entero **sólo puede dar uno de estos cuatro valores**: $\{i, -1, -i, 1\}$.
ejemplos:
  - titulo: 'Potencia con resto 1'
    enunciado: '¿El valor de $i^{101}$ es igual a $i$?'
    alternativas:
      - 'Sí, pues $101 \div 4$ deja resto $1 \implies i^1 = i$'
      - 'No, es igual a -1'
      - 'No, es igual a 1'
    respuesta: 'Sí, pues $101 \div 4$ deja resto $1 \implies i^1 = i$'
    solucion_pasos:
      - '1. Dividimos $101 \div 4 = 25$ con resto 1.'
      - '2. Evaluamos $i^1 = i$.'
  - titulo: 'Suma de cuatro potencias consecutivas'
    enunciado: '¿La suma $i^1 + i^2 + i^3 + i^4$ resulta en $0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $i + (-1) + (-i) + 1 = 0$.'
  - titulo: 'Potencia múltiplo de 4'
    enunciado: '¿El valor de $i^{1000}$ equivale a $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. 1000 es divisible exactamente por 4 (resto 0), por lo que $i^0 = 1$.'
  - titulo: 'Evaluación de exponente 3'
    enunciado: '¿El valor de $i^{15}$ resulta en $-i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $15 = 4 \cdot 3 + 3 \implies i^{15} = i^3 = -i$.'
errores_frecuentes:
  - 'Utilizar el cociente de la división por 4 como el nuevo exponente de $i$ en lugar de utilizar el resto.'
  - 'Las potencias enteras de la unidad imaginaria $i^n$ crecen de forma ilimitada hacia el infinito.'
  - 'Asignar el valor $-1$ a cualquier potencia con exponente número par independientemente de si es múltiplo de 4.'
  - 'El resto $r = 0$ al dividir por 4 equivale al exponente $i^1 = i$.'
  - 'Multiplicar la base $i$ por el exponente $n$ al evaluar $i^n$.'
afirmaciones_verdaderas:
  - 'Las potencias enteras de la unidad imaginaria son periódicas de período 4 con ciclo de valores $\{i, -1, -i, 1\}$.'
  - 'El valor de cualquier potencia $i^n$ es equivalente a $i^r$, donde $r$ es el resto de dividir el exponente $n$ entre 4.'
al_terminar_debes_poder: 'Calcular potencias elevadas de la unidad imaginaria $i^n$ utilizando la división por 4 para hallar el resto equivalente del ciclo.'
