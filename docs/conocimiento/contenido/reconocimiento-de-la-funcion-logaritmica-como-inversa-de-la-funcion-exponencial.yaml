semantic_id: MAT.ALG.RELACION_EXP_LOG.INVERSA_CONCEPTO
resumen_inicial: 'El reconocimiento de la función logarítmica como inversa de la función exponencial establece que $f(x) = b^x \Longleftrightarrow f^{-1}(x) = \log_b(x)$ con $b > 0, b \neq 1$, intercambiando exactamente los conjuntos dominio y recorrido: $\operatorname{Dom}(f) = \operatorname{Rec}(f^{-1}) = \mathbb{R}$ y $\operatorname{Rec}(f) = \operatorname{Dom}(f^{-1}) = \mathbb{R}^+$.'
explicacion_simple: "![El reconocimiento de la función logarítmica como inversa de la función exponencial establece que $f(x) = b^x \\Longleftrightarrow f^{-1}(x) = \\log_b(x)$ con $b > 0, b \\neq 1$, intercambiando exactamente los conjuntos dominio y recorrido: $\\operatorname{Dom}(f) = \\operatorname{Rec}(f^{-1}) = \\mathbb{R}$ y $\\operatorname{Rec}(f) = \\operatorname{Dom}(f^{-1}) = \\mathbb{R}^+$](/static/img/nodos/reconocimiento-de-la-funcion-logaritmica-como-inversa-de-la-funcion-exponencial-intro.svg)\n\n\nLa **función exponencial** y la **función logarítmica** son inversas exactas, como subir y bajar una escalera:\n\n- **La función exponencial $f(x) = b^x$:**\n  - Toma **cualquier número real** en el exponente ($x \\in \\mathbb{R}$).\n  - Devuelve siempre un **número estrictamente positivo** ($y > 0$).\n- **La función logarítmica $f^{-1}(x) = \\log_b(x)$:**\n  - Toma solo **números positivos** ($x > 0$).\n  - Devuelve **el exponente original** ($y \\in \\mathbb{R}$).\n- **Pares\
  \ ordenados que se dan vuelta:** Si $(3, 8)$ está en $y = 2^x$, entonces $(8, 3)$ está en $y = \\log_2(x)$."
explicacion_formal: 'Sea $b \in \mathbb{R}^+ \setminus \{1\}$ y consideremos la aplicación exponencial $\exp_b: \mathbb{R} \to \mathbb{R}^+$ definida por $\exp_b(x) = b^x$. Dado que $\exp_b$ es continua y estrictamente monótona, es un homeomorfismo biyectivo sobre su imagen. Por el teorema de la función inversa global, existe una única aplicación inversa $\exp_b^{-1} = \log_b: \mathbb{R}^+ \to \mathbb{R}$ tal que:

  $$\forall x \in \mathbb{R}, \forall y \in \mathbb{R}^+: \quad y = b^x \Longleftrightarrow x = \log_b(y)$$


  **Intercambio de espacios fundamentales**:

  - $\operatorname{Dom}(\log_b) = \operatorname{Rec}(\exp_b) = \mathbb{R}^+ = ]0, +\infty[$.

  - $\operatorname{Rec}(\log_b) = \operatorname{Dom}(\exp_b) = \mathbb{R} = ]-\infty, +\infty[$.'
definiciones_clave: '- **Función inversa biyectiva**: Operador que revierte exactamente la acción de la función original.

  - **Dualidad de espacios**: Principio por el cual el dominio de una función coincide con el recorrido de su inversa.'
propiedades_relaciones: '- **Identidad en composición**: $(f \circ f^{-1})(x) = x$ para todo $x > 0$ y $(f^{-1} \circ f)(x) = x$ para todo $x \in \mathbb{R}$.

  - **Inversas canónicas**: $y = 10^x \leftrightarrow y = \log(x)$ y $y = e^x \leftrightarrow y = \ln(x)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El reconocimiento de la función logarítmica como inversa de la función exponencial establece que $f(x) = b^x \Longleftrightarrow f^{-1}(x) = \log_b(x)$ con $b > 0, b \neq 1$, intercambiando exactamente los conjuntos dominio y recorrido: $\operatorname{Dom}(f) = \operatorname{Rec}(f^{-1}) = \mathbb{R}$ y $\operatorname{Rec}(f) = \operatorname{Dom}(f^{-1}) = \mathbb{R}^+$](/static/img/nodos/reconocimiento-de-la-funcion-logaritmica-como-inversa-de-la-funcion-exponencial-ejemplos.svg)



    Dada la función exponencial $f(x) = 3^x$:

    1) Determina la expresión de su función inversa $f^{-1}(x)$.

    2) Si $f(4) = 81$, ¿cuánto vale $f^{-1}(81)$?

    3) Indica el dominio y recorrido de $f^{-1}(x)$.'
  pasos:
  - 'Paso 1: Expresión de la función inversa:

    - Despejar $x$ en $y = 3^x \implies x = \log_3(y)$.

    - Intercambiar variables: **$f^{-1}(x) = \log_3(x)$**.'
  - 'Paso 2: Evaluación inversa:

    - Como $f(4) = 3^4 = 81$, por definición inversa **$f^{-1}(81) = \log_3(81) = 4$**.'
  - 'Paso 3: Dominios y recorridos:

    - $\operatorname{Dom}(f^{-1}) = \operatorname{Rec}(f) = ]0, +\infty[$.

    - $\operatorname{Rec}(f^{-1}) = \operatorname{Dom}(f) = \mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la función inversa de $f(x) = 10^x$?
  choices:
  - text: f⁻¹(x) = log₁₀(x)
    is_correct: true
  - text: f⁻¹(x) = 1 / 10ˣ
    is_correct: false
  - text: f⁻¹(x) = 10⁻ˣ
    is_correct: false
  - text: f⁻¹(x) = ln(x)
    is_correct: false
  explanation: La alternativa correcta es 'f⁻¹(x) = log₁₀(x)'. La función inversa de la exponencial en base 10 es el logaritmo decimal.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un punto (2, 25) pertenece a la gráfica de $f(x) = 5^x$, ¿qué punto pertenece obligatoriamente a $f^{-1}(x)$?
  choices:
  - text: (25, 2)
    is_correct: true
  - text: (-2, -25)
    is_correct: false
  - text: (2, -25)
    is_correct: false
  - text: (1/25, 1/2)
    is_correct: false
  explanation: 'La alternativa correcta es ''(25, 2)''. Las funciones inversas intercambian las coordenadas de cada par ordenado: $(x, y) \leftrightarrow (y, x)$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base $b$ de la función exponencial dada $f(x) = b^x$.'
- 'Paso 2: Escribir la función inversa directamente como $f^{-1}(x) = \log_b(x)$.'
- 'Paso 3: Verificar que el dominio de la inversa sea $]0, +\infty[$ y su recorrido $\mathbb{R}$.'
- 'Paso 4: Comprobar la correspondencia de pares ordenados $(a, b^a) \leftrightarrow (b^a, a)$.'
errores_correccion: '- **Error común:** Confundir la función inversa $f^{-1}(x) = \log_b(x)$ con la recíproca $1 / b^x = b^{-x}$.

  - **Cómo corregirlo:** La inversa de una potencia **es el LOGARITMO**, mientras que $b^{-x}$ es solo una potencia con exponente negativo.'
ejemplos:
- titulo: 'Ejemplo 1: Inversa de base 2'
  enunciado: ¿Cuál es la función inversa de $f(x) = 2^x$?
  alternativas:
  - f⁻¹(x) = log₂(x)
  - f⁻¹(x) = 2⁻ˣ
  - f⁻¹(x) = 1/2ˣ
  - f⁻¹(x) = √x
  respuesta: f⁻¹(x) = log₂(x)
  solucion_pasos:
  - 'Paso 1: La inversa de la exponencial en base 2 es $\log_2(x)$.'
- titulo: 'Ejemplo 2: Intercambio de coordenadas'
  enunciado: Si $f(x) = e^x$ pasa por $(0, 1)$, ¿por qué punto pasa $f^{-1}(x) = \ln(x)$?
  alternativas:
  - (1, 0)
  - (0, 1)
  - (e, 0)
  - (0, e)
  respuesta: (1, 0)
  solucion_pasos:
  - 'Paso 1: Invertir coordenadas $(0, 1) \to (1, 0)$.'
- titulo: 'Ejemplo 3: Dominio de la función inversa'
  enunciado: ¿Cuál es el dominio de la inversa de $f(x) = 7^x$?
  alternativas:
  - ']0, +inf['
  - R
  - '[0, +inf['
  - ']1, +inf['
  respuesta: ']0, +inf['
  solucion_pasos:
  - 'Paso 1: $\operatorname{Dom}(f^{-1}) = \operatorname{Rec}(f) = ]0, +\infty[$.'
- titulo: 'Ejemplo 4: Inversa de base fraccionaria'
  enunciado: 'La inversa de $g(x) = (1/3)^x$ es:'
  alternativas:
  - g⁻¹(x) = log₁/₃(x)
  - g⁻¹(x) = 3ˣ
  - g⁻¹(x) = -3ˣ
  - g⁻¹(x) = log₃(-x)
  respuesta: g⁻¹(x) = log₁/₃(x)
  solucion_pasos:
  - 'Paso 1: $g^{-1}(x) = \log_{1/3}(x)$.'
errores_frecuentes:
- Confundir la inversa funcional f⁻¹ con la recíproca 1/f.
- Cambiar la base numérica al plantear el logaritmo inverso.
- Olvidar que el dominio de la función inversa no admite valores negativos ni cero.
afirmaciones_verdaderas:
- La función logarítmica es la inversa biyectiva continua de la función exponencial de igual base.
- El dominio de la exponencial es el recorrido del logaritmo, y el recorrido de la exponencial es el dominio del logaritmo.
al_terminar_debes_poder: '**QUÉ:** Reconocer y definir la función logarítmica como la inversa de la función exponencial.


  **CÓMO:** Estableciendo la equivalencia f(x) = bˣ ⟺ f⁻¹(x) = log_b(x) e intercambiando dominio y recorrido.


