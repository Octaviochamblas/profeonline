semantic_id: MAT.GEO.PARALELOGRAMOS.DIAGONALES_BISECAN
resumen_inicial: En todo paralelogramo, las diagonales se cortan mutuamente en sus puntos medios (se dimidian entre sí).
explicacion_simple: 'Si trazas las dos líneas diagonales de un paralelogramo, notarás algo fascinante: se cruzan en un punto exacto que parte a ambas diagonales en dos mitades idénticas. En matemáticas a esta acción se le llama **dimidiar** o bisecar.


  Si una diagonal mide 12 cm, el punto de corte la dividirá en dos pedazos de 6 cm. Y si la otra mide 8 cm, quedará dividida en dos pedazos de 4 cm. El punto de cruce es el auténtico centro de equilibrio (centro de simetría) de toda la figura.


  ![Diagonales que se dimidian en paralelogramos](/static/img/nodos/propiedad-de-las-diagonales-de-un-paralelogramo-que-se-dimidian-entre-si-intro.svg)

  '
explicacion_formal: '### Teorema de la bisección de diagonales

  Sea $\mathcal{ABCD}$ un paralelogramo y sean $\overline{AC}$ y $\overline{BD}$ sus diagonales que se intersecan en el punto $M$. Entonces $M$ es simultáneamente el punto medio de ambas diagonales:

  $$M = \overline{AC} \cap \overline{BD} \implies \overline{AM} \cong \overline{MC} \quad \wedge \quad \overline{BM} \cong \overline{MD}$$


  ### Demostración geométrica

  1. Considérense los triángulos opuestos formados por las diagonales: $\triangle ABM$ y $\triangle CDM$.

  2. Por lados opuestos del paralelogramo: $\overline{AB} \cong \overline{CD}$.

  3. Por alternos internos entre $\overline{AB} \parallel \overline{CD}$ con secante $\overline{AC}$: $\angle BAM \cong \angle DCM$.

  4. Por alternos internos entre $\overline{AB} \parallel \overline{CD}$ con secante $\overline{BD}$: $\angle ABM \cong \angle CDM$.

  5. Por criterio **ALA**, $\triangle ABM \cong \triangle CDM$.

  6. Al ser congruentes, sus lados correspondientes son iguales: $AM = MC$ y $BM = MD$.


  > **Complemento didáctico:** Recuerda que ''dimidiar'' no significa que las dos diagonales midan lo mismo entre sí, sino que cada una queda partida exactamente por la mitad por la otra. Solo en el rectángulo y cuadrado las dos diagonales tienen la misma longitud total.

  '
definiciones_clave: '- **Dimidiar**: Dividir un segmento o magnitud geométrica exactamente en dos partes iguales (bisecar).

  - **Punto medio ($M$)**: Punto que divide a un segmento en dos segmentos congruentes.

  - **Centro de simetría**: Punto del plano respecto al cual la figura coincide consigo misma tras una rotación de $180^\circ$.

  '
propiedades_relaciones: '- **Criterio de suficiencia**: Si las diagonales de un cuadrilátero se dimidian entre sí, el cuadrilátero es obligatoriamente un paralelogramo.

  - **División de áreas**: Las dos diagonales dividen al paralelogramo en cuatro triángulos de exactamente la misma área ($A/4$).

  - **Comportamiento en trapecios**: En los trapecios las diagonales se intersecan, pero nunca se dimidian.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de diagonales que se dimidian](/static/img/nodos/propiedad-de-las-diagonales-de-un-paralelogramo-que-se-dimidian-entre-si-ejemplos.svg)


    En un paralelogramo $ABCD$ cuyas diagonales se cortan en $M$, se sabe que $AM = 2x - 3$ cm, $MC = x + 4$ cm, y la diagonal $BD$ mide $16$ cm. Calcula la longitud de la diagonal $AC$ y la medida del segmento $BM$.'
  pasos:
  - 'Paso 1: Aplicar la propiedad de bisección para la diagonal $AC$: $M$ es punto medio, luego $AM = MC$.'
  - 'Paso 2: Resolver la ecuación: $2x - 3 = x + 4 \implies x = 7$.'
  - 'Paso 3: Calcular las semidiagonales de $AC$: $AM = 2(7) - 3 = 11$ cm; $MC = 7 + 4 = 11$ cm.'
  - 'Paso 4: Calcular la longitud total de $AC$: $AC = AM + MC = 11 + 11 = 22$ cm.'
  - 'Paso 5: Calcular $BM$ usando la bisección de $BD$: $BM = \frac{BD}{2} = \frac{16}{2} = 8$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué significa geométricamente que las diagonales de un paralelogramo 'se dimidian'?
  choices:
  - text: Que el punto de intersección es el punto medio de ambas diagonales.
    is_correct: true
  - text: Que las dos diagonales tienen exactamente la misma longitud métrica.
    is_correct: false
  - text: Que las diagonales se cruzan formando un ángulo de 90°.
    is_correct: false
  - text: Que cada diagonal divide al paralelogramo en dos polígonos irregulares.
    is_correct: false
  explanation: La alternativa correcta es 'Que el punto de intersección es el punto medio de ambas diagonales.' 'Dimidiar' significa cortar por la mitad a cada una.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si las semidiagonales de un paralelogramo miden 5 cm y 7 cm, ¿cuánto miden las diagonales completas?
  choices:
  - text: 10 cm y 14 cm.
    is_correct: true
  - text: 5 cm y 7 cm.
    is_correct: false
  - text: 12 cm y 12 cm.
    is_correct: false
  - text: 20 cm y 28 cm.
    is_correct: false
  explanation: La alternativa correcta es '10 cm y 14 cm.' Al dimidiarse, la longitud completa de cada diagonal es el doble de su semidiagonal ($2 \cdot 5 = 10$ y $2 \cdot 7 = 14$).
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el punto de corte $M$ de las diagonales.

  2. Igualar los segmentos correspondientes de una misma diagonal: $AM = MC$ y $BM = MD$.

  3. Despejar incógnitas lineales.

  4. Multiplicar por 2 la semidiagonal si se busca la longitud de la diagonal completa.

  '
errores_correccion: '- **Error común 1:** Igualar la mitad de una diagonal con la mitad de la otra ($AM = BM$). **Corrección:** En general las diagonales tienen distinta longitud total; solo se igualan las mitades de una MISMA diagonal.

  - **Error común 2:** Creer que las diagonales se dimidian en los trapecios. **Corrección:** En los trapecios se cortan pero las mitades no son congruentes.

  '
ejemplos:
- tipo: A
  titulo: Punto medio de diagonales
  enunciado: En un paralelogramo, la diagonal $AC$ mide $18$ cm y $M$ es el punto de cruce con la otra diagonal. ¿Cuánto mide el segmento $AM$?
  alternativas:
  - text: $9$ cm.
    is_correct: true
  - text: $18$ cm.
    is_correct: false
  - text: $6$ cm.
    is_correct: false
  - text: $4{,}5$ cm.
    is_correct: false
  explicacion: 'Como las diagonales se dimidian, $M$ es el punto medio: $AM = 18 / 2 = 9$ cm.'
- tipo: B
  titulo: Dimidiar en paralelogramos
  enunciado: ¿En cualquier paralelogramo las diagonales se cortan en su punto medio?
  respuesta: Sí
  explicacion: Sí. Es una propiedad universal de todos los paralelogramos (cuadrado, rectángulo, rombo y romboide).
errores_frecuentes:
- '''Asumir que porque se dimidian, las diagonales deben medir lo mismo en total.'''
- '''Asumir que las diagonales siempre se cortan en ángulo recto en cualquier paralelogramo.'''
- '''Confundir el concepto de dimidiar con el de dividir en tres partes.'''
afirmaciones_verdaderas:
- '''En todo paralelogramo, cada diagonal biseca a la otra diagonal en su punto medio.'''
- '''Si las diagonales de un cuadrilátero se dimidian entre sí, el cuadrilátero es un paralelogramo.'''
- '''El punto de corte de las diagonales de un paralelogramo es su centro de simetría.'''
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad de bisección mutua de diagonales para resolver problemas métricos y algebraicos en paralelogramos.


  **CÓMO:** Planteando igualdades $AM = MC$ y $BM = MD$ y reconociendo al punto $M$ como baricentro y centro de simetría.


  ![Síntesis de diagonales que se dimidian](/static/img/nodos/propiedad-de-las-diagonales-de-un-paralelogramo-que-se-dimidian-entre-si-resumen.svg)

  '
