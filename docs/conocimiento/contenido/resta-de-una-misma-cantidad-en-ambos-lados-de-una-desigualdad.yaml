semantic_id: MAT.ALG.DESIG_PROPIEDADES.RESTA_MISMA_CANTIDAD
resumen_inicial: Restar una misma cantidad en ambos miembros de una desigualdad preserva
  sin cambios el sentido original de la desigualdad.
explicacion_simple: 'Restar un número $c$ a ambos lados de una desigualdad equivale
  a desplazar ambas posiciones hacia la izquierda en la recta numérica la misma distancia.

  Como ambas posiciones retroceden exactamente lo mismo, la que estaba más a la izquierda
  sigue quedando más a la izquierda.

  Por ello, si $a > b$, entonces $a - c > b - c$.'
explicacion_formal: 'Para todas las constantes $a, b, c \in \mathbb{R}$, la **propiedad
  de sustracción conservativa** se formula como:


  $$a > b \iff a - c > b - c$$

  $$a \le b \iff a - c \le b - c$$


  **Desglose de la fórmula:**

  - Restar $c$ es equivalente a sumar el opuesto aditivo $(-c)$, heredando directamente
  la conservación de la propiedad aditiva.'
definiciones_clave: '- **Sustracción en desigualdades**: Operación de restar la misma
  constante a ambos lados manteniendo la relación de orden intacta.'
propiedades_relaciones: '- **Translación rígida**: La distancia entre ambos números
  se mantiene constante: $(a - c) - (b - c) = a - b$.'
ejemplo_guiado:
  enunciado: Dada la desigualdad $10 > 4$, resta el número $c = 6$ en ambos miembros
    y comprueba la validez del resultado.
  pasos:
  - 'Paso 1: Escribir la desigualdad inicial: $10 > 4$.Paso 2: Restar $6$ en el primer
    miembro: $10 - 6 = 4$.Paso 3: Restar $6$ en el segundo miembro: $4 - 6 = -2$.Paso
    4: Comparar ambos resultados: $4 > -2$.Paso 5: Concluir que el sentido $>$ se
    conserva inalterado.'
checkpoints:
- placement: after_explicacion_formal
  question: Al restar $6$ a ambos lados de la desigualdad $10 > 4$, ¿cuál es el resultado
    obtenido?
  choices:
  - text: $4 > -2$
    is_correct: true
  - text: $4 < -2$
    is_correct: false
  - text: $16 > 10$
    is_correct: false
  - text: $4 = -2$
    is_correct: false
  explanation: La alternativa correcta es '$4 > -2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué sucede con la orientación del símbolo $>$ cuando se resta una constante
    a ambos lados?
  choices:
  - text: Se mantiene exactamente en el mismo sentido ($>$).
    is_correct: true
  - text: Se invierte al sentido opuesto ($<$).
    is_correct: false
  - text: Se transforma en una igualdad ($=$).
    is_correct: false
  - text: Depende de si la constante es par o impar.
    is_correct: false
  explanation: La alternativa correcta es 'Se mantiene exactamente en el mismo sentido
    ($>$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los dos miembros de la desigualdad.'
- 'Paso 2: Restar la misma cantidad $c$ a ambos miembros.'
- 'Paso 3: Calcular las sustracciones numéricas.'
- 'Paso 4: Mantener la misma dirección del símbolo de desigualdad.'
errores_correccion: '- **Error común:** Cambiar la dirección del símbolo de desigualdad
  al restar un número grande.

  - **Cómo corregirlo:** La resta NUNCA cambia la orientación del símbolo de desigualdad.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
- Invertir el sentido de la desigualdad al sumar o restar un número negativo.
- Olvidar invertir el sentido del símbolo al multiplicar o dividir por una cantidad
  negativa.
- Extraer raíz cuadrada a términos negativos en una desigualdad de números reales.
- Tomar recíprocos en números de distinto signo invirtiendo el símbolo incorrectamente.
- Mantener el mismo símbolo al elevar al cuadrado desigualdades formadas por números
  negativos.
afirmaciones_verdaderas:
- Sumar o restar una misma cantidad en ambos miembros conserva siempre el sentido
  de la desigualdad.
- Multiplicar o dividir ambos miembros por un escalar estrictamente negativo exige
  invertir la orientación del símbolo de la desigualdad.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar rigurosamente las
  propiedades de las desigualdades al sumar, multiplicar, dividir y tomar potencias
  o raíces.
