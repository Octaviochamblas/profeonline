semantic_id: MAT.ALG.DESIG_PROPIEDADES.RESTA_MISMA_CANTIDAD
resumen_inicial: 'Resta de una misma cantidad en ambos lados de una desigualdad: relaciones
  de orden, intervalos y resolución en Propiedades de las desigualdades.'
explicacion_simple: Restar una cantidad en ambos lados de una desigualdad es una herramienta
  clave para despejar variables, garantizando que el orden de los valores se conserve.
explicacion_formal: '### Definición formal

  Sean $a, b, c \in \mathbb{R}$. Si $a > b$, entonces $a - c > b - c$. Esta propiedad
  aplica de manera análoga para $<, \leq$ y $\geq$.


  ### Desarrollo didáctico

  Dado que la resta es matemáticamente equivalente a la suma de un número negativo,
  la misma lógica de conservación del orden se aplica cuando restamos valores.'
definiciones_clave: '- **Resta de una misma cantidad en ambos lados de una desigualdad**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a resta de una misma cantidad en ambos
  lados de una desigualdad.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de resta de una misma
    cantidad en ambos lados de una desigualdad.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de resta de una misma cantidad en ambos lados
    de una desigualdad, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
