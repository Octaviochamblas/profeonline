semantic_id: MAT.ALG.INTERVALOS.TRADUCCION_INTERVALO_DESIGUALDAD
resumen_inicial: 'Traducción de intervalo a desigualdad: relaciones de orden, intervalos
  y resolución en Intervalos reales y su representación.'
explicacion_simple: Las notaciones matemáticas ofrecen múltiples formas de describir
  conjuntos. Convertir de un intervalo a una desigualdad nos permite incorporar la
  restricción fácilmente en ecuaciones y problemas algebraicos.
explicacion_formal: '### Definición formal

  Sea $I$ un intervalo con extremos $a$ y $b$ ($a < b$). La transformación a desigualdad
  $D$ se realiza estableciendo la relación de un elemento $x$ respecto a $a$ y $b$.
  Un corchete cerrado $[$ o $]$ adyacente a un extremo finito implica una relación
  no estricta ($\leq$ o $\geq$). Un corchete abierto $] [$, $($ o $)$ o la presencia
  de $\pm \infty$ implica una relación estricta ($<$ o $>$). Así, $I = [a, b[$ se
  traduce lógicamente a la desigualdad compuesta $a \leq x < b$.


  ### Desarrollo didáctico

  Traducir un intervalo a una desigualdad es como escribir una frase usando símbolos
  matemáticos. Si el intervalo nos da un límite inferior y uno superior, colocamos
  una variable, usualmente $x$, en el medio. Luego, observamos los "muros" (corchetes):
  si el muro es recto y nos abraza (corchete cerrado), usamos el símbolo "menor o
  igual" ($\leq$). Si el muro nos da la espalda o es curvo (corchete abierto o paréntesis),
  usamos el símbolo "estrictamente menor" ($<$). Si hay un infinito, solo necesitamos
  un símbolo de desigualdad.'
definiciones_clave: '- **Traducción de intervalo a desigualdad**: Concepto fundamental
  de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a traducción de intervalo a desigualdad.'
ejemplo_guiado:
