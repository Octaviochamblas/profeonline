semantic_id: MAT.ALG.INTERVALOS.TRADUCCION_INTERVALO_DESIGUALDAD
resumen_inicial: Traducir un intervalo a desigualdad convierte la notación de corchetes en una expresión simbólica de orden con la variable $x$.
explicacion_simple: '![Traducción de intervalo a desigualdad](/static/img/nodos/traduccion-de-intervalo-a-desigualdad-intro.svg)


  Para pasar de un intervalo (como $[2, 9[$) a una desigualdad con $x$:

  1. Escribimos la $x$ en el centro entre las dos constantes ($2$ y $9$).

  2. Miramos los corchetes: si el corchete está cerrado $[$, usamos $\le$. Si el corchete está abierto $ [ $, usamos $<$.

  En este caso, $[2, 9[$ se traduce como $2 \le x < 9$.'
explicacion_formal: 'La **regla de traducción de intervalo a desigualdad** establece la equivalencia de compresión:


  $$]a, b] \iff a < x \le b$$

  $$[a, b] \iff a \le x \le b$$

  $$]-\infty, b[ \iff x < b$$

  $$[a, +\infty[ \iff x \ge a$$'
definiciones_clave: '- **Traducción de intervalo a desigualdad**: Reescritura de un subconjunto expresado entre corchetes a su notación de conjunto por comprensión.'
propiedades_relaciones: '- **Mapeo directo de bordes**: Corchete cerrado $\implies$ signo igual incluido ($\le, \ge$). Corchete abierto $\implies$ desigualdad estricta ($<, >$).'
ejemplo_guiado:
  enunciado: '![Ejemplo Traducción de intervalo a desigualdad](/static/img/nodos/traduccion-de-intervalo-a-desigualdad-ejemplos.svg)


    Traduce el intervalo semiabierto por la izquierda $]-5, 1]$ a su desigualdad por comprensión correspondiente.'
  pasos:
  - 'Paso 1: Identificar las cotas: límite inferior $-5$ y límite superior $1$.Paso 2: Observar el corchete izquierdo $]-5$: es abierto, luego se traduce como $-5 < x$.Paso 3: Observar el corchete derecho $1]$: es cerrado, luego se traduce como $x \le 1$.Paso 4: Unir las dos cotas: $\{x \in \mathbb{R} \mid -5 < x \le 1\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la desigualdad equivalente para el intervalo $]-5, 1]$?
  choices:
  - text: $-5 < x \le 1$
    is_correct: true
  - text: $-5 \le x < 1$
    is_correct: false
  - text: $-5 < x < 1$
    is_correct: false
  - text: $-5 \le x \le 1$
    is_correct: false
  explanation: La alternativa correcta es '$-5 < x \le 1$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al traducir el intervalo infinito $[7, +\infty[$, ¿cuál es la desigualdad obtenida?
  choices:
  - text: $x \ge 7$
    is_correct: true
  - text: $x > 7$
    is_correct: false
  - text: $x \le 7$
    is_correct: false
  - text: $x < 7$
    is_correct: false
  explanation: La alternativa correcta es '$x \ge 7$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el extremo inferior a la izquierda, la variable $x$ al centro y el extremo superior a la derecha.'
- 'Paso 2: Si el extremo izquierdo es cerrado $[$, poner $\le$. Si es abierto $]$, poner $<$.'
- 'Paso 3: Si el extremo derecho es cerrado $]$, poner $\le$. Si es abierto $[$, poner $<$.'
- 'Paso 4: Presentar la desigualdad $a < x \le b$.'
errores_correccion: '- **Error común:** Escribir los símbolos de desigualdad al revés (poner $-5 > x \ge 1$).

  - **Cómo corregirlo:** En desigualdades dobles, las flechas de orden se escriben de menor a mayor apuntando SIEMPRE hacia la izquierda ($a < x < b$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
- La notación por comprensión $\{x \in \mathbb{R} \mid x \ge -2\}$ se traduce como el intervalo cerrado por ambos lados $[-2, +\infty]$.
- El conjunto $\{x \in \mathbb{R} \mid 1 < x < 6\}$ se expresa en notación de intervalo como $[1, 6]$.
- La expresión de conjuntos $\{x \in \mathbb{R} \mid x < 0\}$ equivale al intervalo infinito positivo $]0, +\infty[$.
- En notación por comprensión, la condición $x \in \mathbb{Z}$ sustituye la continuidad real del intervalo por puntos aislados manteniendo la misma notación.
- La traducción del intervalo semiabierto $]-5, 3]$ a compresión omite la restricción del dominio real $x \in \mathbb{R}$.
afirmaciones_verdaderas:
- La notación por comprensión $\{x \in \mathbb{R} \mid a \le x \le b\}$ equivale rigurosamente al intervalo cerrado $[a, b]$.
- Toda expresión de conjunto continuo en $\mathbb{R}$ delimitada por cotas posee su equivalente unívoco en notación de intervalo.
al_terminar_debes_poder: '**QUÉ:** Traducir una notación de intervalo a una relación de desigualdad equivalente.


  **CÓMO:** Mapeando corchetes cerrados a operadores $\le / \ge$ y corchetes abiertos a operadores estrictos $< / >$.


  ![Resumen Traducción de intervalo a desigualdad](/static/img/nodos/traduccion-de-intervalo-a-desigualdad-resumen.svg)'
