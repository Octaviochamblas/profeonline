semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.DIVISION_IGUAL_EXPONENTE
resumen_inicial: 'Para dividir potencias de distinta base pero igual exponente, se dividen las bases entre sí y se conserva el exponente común: $\frac{a^n}{b^n} = \left(\frac{a}{b}\right)^n$ para $b \neq 0$.'
explicacion_simple: '![División de potencias de igual exponente](/static/img/nodos/division-de-potencias-de-igual-exponente-intro.svg)


  Cuando tienes una división entre dos potencias con bases distintas pero que tienen exactamente el mismo exponente, puedes dividir las bases primero y dejar el exponente afuera. Por ejemplo, en lugar de calcular $18^3 = 5832$ y $6^3 = 216$ para luego dividir $5832 : 216$, simplemente divides $18 : 6 = 3$ y calculas $3^3 = 27$. ¡El resultado es instantáneo! El exponente no se resta ni cambia, se mantiene intacto.'
explicacion_formal: 'Sean $a, b \in \mathbb{R}$ con $b \neq 0$ y $n \in \mathbb{R}$. El **Teorema del Cociente de Potencias de Igual Exponente** establece que:


  $$\frac{a^n}{b^n} = \left(\frac{a}{b}\right)^n = (a : b)^n$$


  **Demostración para $n \in \mathbb{N}$:**

  $$\frac{a^n}{b^n} = \frac{\overbrace{a \cdot a \dots a}^{n \text{ factores}}}{\underbrace{b \cdot b \dots b}_{n \text{ factores}}} = \underbrace{\frac{a}{b} \cdot \frac{a}{b} \dots \frac{a}{b}}_{n \text{ factores}} = \left(\frac{a}{b}\right)^n$$


  **Diferencia estructural fundamental:**

  - **Igual base ($\frac{a^m}{a^n}$):** Se conserva la base $a$ y se restan los exponentes ($a^{m-n}$).

  - **Igual exponente ($\frac{a^n}{b^n}$):** Se dividen las bases ($\frac{a}{b}$) y se conserva el exponente común ($n$).'
definiciones_clave: '- **Cociente de igual exponente**: División donde el exponente $n$ actúa como operador común sobre la razón de las bases.

  - **Razón de bases**: Fracción o cociente $\frac{a}{b}$ resultante de la división de bases.'
propiedades_relaciones: '- **División exacta**: Si $b$ divide exactamente a $a$, el resultado es un entero elevado a $n$ ($20^4 / 5^4 = 4^4 = 256$).

  - **Fracción irreducible**: Si no es división exacta, se reduce la fracción antes de potenciar ($6^3 / 9^3 = (2/3)^3 = 8/27$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de división de igual exponente](/static/img/nodos/division-de-potencias-de-igual-exponente-ejemplos.svg)


    Calcule el valor de las expresiones $\frac{15^3}{5^3}$, $\frac{(-12)^2}{4^2}$ y $\frac{8^{-2}}{4^{-2}}$.'
  pasos:
  - 'Paso 1: Evaluar $\frac{15^3}{5^3}$: Exponente común $3$. Dividir bases: $\left(\frac{15}{5}\right)^3 = 3^3 = 27$.'
  - 'Paso 2: Evaluar $\frac{(-12)^2}{4^2}$: Exponente común $2$. Dividir bases: $\left(\frac{-12}{4}\right)^2 = (-3)^2 = 9$.'
  - 'Paso 3: Evaluar $\frac{8^{-2}}{4^{-2}}$: Exponente común $-2$. Dividir bases: $\left(\frac{8}{4}\right)^{-2} = 2^{-2} = \frac{1}{2^2} = \frac{1}{4}$.'
  - 'Conclusión: Los resultados son $27$, $9$ y $\frac{1}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de simplificar $\frac{20^4}{5^4}$?
  choices:
  - text: '$4^4 = 256$ (dividiendo $20 : 5 = 4$ y conservando exponente $4$)'
    is_correct: true
  - text: $4^0 = 1$
    is_correct: false
  - text: $4^1 = 4$
    is_correct: false
  - text: $15^4$
    is_correct: false
  explanation: 'La alternativa correcta es ''$4^4 = 256$ (dividiendo $20 : 5 = 4$ y conservando exponente $4$)''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué en $\frac{15^3}{5^3}$ el exponente final fue $3$ y no $0$?
  choices:
  - text: Porque al tener bases distintas e igual exponente, el exponente común se conserva y NO se resta
    is_correct: true
  - text: Porque $3 - 3 = 3$
    is_correct: false
  - text: Porque $15$ es múltiplo de $5$
    is_correct: false
  - text: Porque el exponente es impar
    is_correct: false
  explanation: La alternativa correcta es 'Porque al tener bases distintas e igual exponente, el exponente común se conserva y NO se resta'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que las potencias a dividir compartan el mismo exponente $n$ y el divisor tenga base no nula ($b \neq 0$).'
- 'Paso 2: Realizar la división o simplificación de las bases dentro de un paréntesis: $\left(\frac{a}{b}\right)$.'
- 'Paso 3: Conservar el exponente común $n$ y evaluar la potencia simplificada.'
errores_correccion: '- **Error 1: Restar los exponentes al tener igual exponente ($20^4 / 5^4 = 4^0 = 1$).** **Cómo corregirlo:** La resta de exponentes solo aplica cuando las BASES son iguales. Aquí las bases son distintas, por lo que el exponente se CONSERVA ($4^4 = 256$).

  - **Error 2: Restar las bases en lugar de dividirlas ($15^3 / 5^3 = 10^3$).** **Cómo corregirlo:** Las bases se DIVIDEN ($15 : 5 = 3 \implies 3^3 = 27$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\frac{24^3}{8^3}$?
  alternativas:
  - $3^3 = 27$
  - $3^0 = 1$
  - $16^3$
  respuesta: $3^3 = 27$
  solucion_pasos:
  - $\frac{24^3}{8^3} = \left(\frac{24}{8}\right)^3 = 3^3 = 27$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale $\frac{6^4}{9^4}$ en fracción irreducible?
  alternativas:
  - $\frac{16}{81}$
  - $\frac{2}{3}$
  - $\frac{8}{27}$
  respuesta: $\frac{16}{81}$
  solucion_pasos:
  - $\left(\frac{6}{9}\right)^4 = \left(\frac{2}{3}\right)^4 = \frac{16}{81}$.
- titulo: ¿Es 100² / 25² igual a 16?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(100 / 25)^2 = 4^2 = 16$.
  alternativas:
  - texto: Sí, 100/25 = 4 y 4² = 16
    es_correcta: true
    retroalimentacion: ¡Correcto! $\frac{a^n}{b^n} = (a/b)^n$.
  - texto: No, es igual a 4
    es_correcta: false
    retroalimentacion: Incorrecto, falta elevar al cuadrado ($4^2 = 16$).
  - texto: No, es igual a 75²
    es_correcta: false
    retroalimentacion: Incorrecto, las bases se dividen, no se restan.
- titulo: ¿Es 12³ / 4³ igual a 3⁰?
  respuesta: 'No'
  solucion_pasos:
  - No, $12^3 / 4^3 = (12/4)^3 = 3^3 = 27$, el exponente no se resta.
  alternativas:
  - texto: No, el exponente común se conserva (da 3³ = 27)
    es_correcta: true
    retroalimentacion: ¡Correcto! Solo se restan exponentes si las bases fueran iguales.
  - texto: Sí, porque 3 - 3 = 0
    es_correcta: false
    retroalimentacion: Incorrecto, eso solo aplica para igual base.
  - texto: No, es igual a 8³
    es_correcta: false
    retroalimentacion: Incorrecto, las bases no se restan.
errores_frecuentes:
- Restar los exponentes dando exponente cero ($a^n / b^n = (a/b)^0 = 1$).
- Restar las bases en lugar de dividirlas ($12^3 / 4^3 = 8^3$).
- Dividir también los exponentes entre sí.
- Olvidar elevar el resultado de la división al exponente común.
- Dividir por base cero sin verificar la condición de existencia ($b \neq 0$).
afirmaciones_verdaderas:
- Para toda base $a, b$ con $b \neq 0$, $\frac{a^n}{b^n} = (\frac{a}{b})^n$.
- Al dividir potencias de igual exponente, el exponente se conserva inalterado.
- La simplificación de la razón de bases $\frac{a}{b}$ optimiza drásticamente el cálculo aritmético.
al_terminar_debes_poder: '![Síntesis de división de igual exponente](/static/img/nodos/division-de-potencias-de-igual-exponente-resumen.svg)


  QUÉ: Dividir potencias de igual exponente y distinta base.


  CÓMO: Dividiendo o simplificando las bases entre sí y conservando inalterado el exponente común ($\frac{a^n}{b^n} = (\frac{a}{b})^n$ para $b \neq 0$), evitando restar exponentes o restar bases.'
