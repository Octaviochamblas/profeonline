semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.DIVISION_IGUAL_EXPONENTE
resumen_inicial: 'Al dividir potencias de distintas bases pero igual exponente $\frac{a^n}{b^n}$,
  se dividen las bases y se conserva el exponente común: $\frac{a^n}{b^n} = \left(\frac{a}{b}\right)^n$
  ($b \neq 0$).'
explicacion_simple: Cuando dividimos potencias con bases distintas pero que comparten
  el mismo exponente, dividimos primero las dos bases entre sí dentro de un paréntesis
  y dejamos el mismo exponente rodeando la división.
explicacion_formal: 'Para todo $a \in \mathbb{R}$, $b \in \mathbb{R} \setminus \{0\}$
  y exponente común $n \in \mathbb{R}$, la **Agrupación de Cociente por Igual Exponente**
  afirma:


  $$\frac{a^n}{b^n} = \left(\frac{a}{b}\right)^n$$


  **Desglose:**

  - Simplificación de fracciones: Si la división $a/b$ resulta en un número entero
  exacto, la potencia se simplifica drásticamente.

  - Lectura inversa: Corresponde a la simetría de la potencia de un cociente.


  > **Complemento didáctico:** Ejemplo: $\frac{12^3}{4^3} = \left(\frac{12}{4}\right)^3
  = 3^3 = 27$.'
definiciones_clave: '- **División de potencias de igual exponente**: Regla $\frac{a^n}{b^n}
  = \left(\frac{a}{b}\right)^n$ de división de bases manteniendo el exponente común.'
propiedades_relaciones: '- **Agrupación de cociente**: $a^n / b^n = (a/b)^n$ para
  $b \neq 0$.'
ejemplo_guiado:
  enunciado: Calcule de forma simplificada $\frac{15^3}{5^3}$.
  pasos:
  - 'Paso 1: Identificar que los exponentes son iguales ($n=3$) y el divisor $5 \neq
    0$.'
  - 'Paso 2: Dividir las bases entre sí dentro del paréntesis: $\left(\frac{15}{5}\right)^3$.'
  - 'Paso 3: Resolver la división interna: $3^3 = 27$.'
  - 'Conclusión: $\frac{15^3}{5^3} = 27$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué procedimiento se aplica al dividir potencias de distintas bases pero
    igual exponente (a^n / b^n)?
  choices:
  - text: Se dividen las bases y se conserva el exponente común ((a/b)^n)
    is_correct: true
  - text: Se restan los exponentes y se restan las bases
    is_correct: false
  - text: Se multiplican los exponentes
    is_correct: false
  - text: Se elimina la fracción
    is_correct: false
  explanation: La alternativa correcta es 'Se dividen las bases y se conserva el exponente
    común ((a/b)^n)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 15^3 / 5^3, ¿cuál fue el resultado final?
  choices:
  - text: 27 (3^3)
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '125'
    is_correct: false
  - text: '9'
    is_correct: false
  explanation: La alternativa correcta es '27 (3^3)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Constatar que los exponentes de numerador y denominador sean iguales.'
- 'Paso 2: Dividir la base del numerador por la del denominador dentro de un paréntesis.'
- 'Paso 3: Elevar el cociente resultante al exponente común $\left(\frac{a}{b}\right)^n$.'
errores_correccion: '- **Error 1: Restar o dividir los exponentes al agrupar ($\frac{12^4}{3^4}
  = 4^1$).** **Cómo corregirlo:** El exponente común se MANTIENE intacto ($\frac{12^4}{3^4}
  = 4^4 = 256$).


  - **Error 2: Restar las bases en lugar de dividirlas ($\frac{10^2}{2^2} = 8^2$).**
  **Cómo corregirlo:** Las bases se DIVIDEN ($10 : 2 = 5 \implies 5^2 = 25$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $\frac{20^2}{10^2}$.
  alternativas:
  - '4'
  - '2'
  - '400'
  respuesta: '4'
  solucion_pasos:
  - $\left(\frac{20}{10}\right)^2 = 2^2 = 4$.
- titulo: Ejemplo 2
  enunciado: Simplifique $\frac{a^4}{b^4}$ con $b \neq 0$.
  alternativas:
  - (a/b)^4
  - a/b
  - (a-b)^4
  respuesta: (a/b)^4
  solucion_pasos:
  - $\left(\frac{a}{b}\right)^4$.
- titulo: ¿Es 18^2 / 6^2 igual a 9?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(18/6)^2 = 3^2 = 9$.
- titulo: ¿Se conserva el exponente común al dividir las bases?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{a^n}{b^n} = \left(\frac{a}{b}\right)^n$.
errores_frecuentes:
- Restar los exponentes al realizar la división de potencias de distinta base e igual
  exponente.
- Restar las bases entre sí conservando el exponente común en la fracción.
- Dividir los exponentes entre sí alterando el orden de la potencia.
- La expresión $\frac{16^3}{4^3}$ da como resultado la potencia $4^0$ por resta errónea
  de exponentes.
- Aplicar la regla de división de igual exponente con denominador igual a cero.
afirmaciones_verdaderas:
- 'Al dividir potencias de igual exponente se dividen las bases y se mantiene el exponente
  común: $\frac{a^n}{b^n} = \left(\frac{a}{b}\right)^n$ ($b \neq 0$).'
- Esta regla permite simplificar fracciones de potencias evaluando el cociente directo
  de las bases.
al_terminar_debes_poder: Al terminar serás capaz de simplificar cocientes de potencias
  de igual exponente $\frac{a^n}{b^n} = \left(\frac{a}{b}\right)^n$, dividiendo las
  bases y conservando el exponente común.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
