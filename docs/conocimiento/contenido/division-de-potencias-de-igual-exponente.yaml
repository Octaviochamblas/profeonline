semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.DIVISION_IGUAL_EXPONENTE
resumen_inicial: Al dividir potencias de distinto número de base pero IGUAL exponente,
  se dividen las bases y se conserva el exponente común ($a^n \div b^n = (a \div b)^n$
  para $b \neq 0$).
explicacion_simple: 'Si divides dos potencias que tienen bases distintas pero comparten
  el mismo exponente, divides las bases entre sí y mantienes el exponente afuera:

  $$\frac{12^3}{4^3} = \left(\frac{12}{4}\right)^3 = 3^3 = 27$$

  Comprobación individual: $12^3 = 1728$, $4^3 = 64$, y $1728 \div 64 = 27$.'
explicacion_formal: 'Para todo $a \in \mathbb{R}$, $b \in \mathbb{R} \setminus \{0\}$
  y $n \in \mathbb{R}$, se cumple:

  $$\frac{a^n}{b^n} = \left(\frac{a}{b}\right)^n$$'
definiciones_clave: '- **División de bases**: Cociente $\frac{a}{b}$ elevado al exponente
  común $n$.'
propiedades_relaciones: '- **Lectura inversa de la potencia de un cociente**: Permite
  simplificar fracciones de potencias.'
ejemplo_guiado:
  enunciado: Calcula $\frac{15^4}{5^4}$.
  pasos:
  - Observar que el exponente común es $n = 4$ y las bases son $15$ y $5$.
  - 'Agrupar la división de bases: $\left(\frac{15}{5}\right)^4$.'
  - 'Dividir las bases: $15 \div 5 = 3$.'
  - 'Calcular la potencia: $3^4 = 81$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la cociente $\frac{18^2}{6^2}$?
  choices:
  - text: '9'
    is_correct: true
  - text: '3'
    is_correct: false
  - text: '36'
    is_correct: false
  - text: 3^4
    is_correct: false
  explanation: 'La correcta es: 9. Dividimos las bases ($18 \div 6 = 3$) y elevamos
    a 2: $3^2 = 9$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Simplifica la expresión $\frac{a^7}{b^7}$ para $b \neq 0$.
  choices:
  - text: (a/b)^7
    is_correct: true
  - text: (a/b)^1
    is_correct: false
  - text: a/b^7
    is_correct: false
  - text: (a-b)^7
    is_correct: false
  explanation: 'La correcta es: (a/b)^7. Agrupamos la fracción bajo el exponente común
    7.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que el exponente sea idéntico en el dividendo y en el divisor.'
- 'Paso 2: Dividir la base del dividendo por la del divisor.'
- 'Paso 3: Elevar el cociente resultante al exponente común.'
- 'Paso 4: Calcular el resultado final.'
errores_correccion: No restes los exponentes cuando las bases son distintas y los
  exponentes iguales. $\frac{8^3}{2^3}$ es $(8 \div 2)^3 = 4^3 = 64$, no $4^0 = 1$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\frac{20^2}{10^2}$.
  alternativas:
  - '4'
  - '2'
  - '400'
  respuesta: '4'
  solucion_pasos:
  - $(20 \div 10)^2 = 2^2 = 4$.
errores_frecuentes:
- Restar los exponentes cuando lo que es igual es el exponente y no la base.
afirmaciones_verdaderas:
- $\frac{a^n}{b^n} = \left(\frac{a}{b}\right)^n$ para $b \neq 0$.
al_terminar_debes_ponder: Resolver divisiones de potencias de igual exponente mediante
  la división de sus bases.
fuente: Texto escolar MINEDUC.
estado: publicado
