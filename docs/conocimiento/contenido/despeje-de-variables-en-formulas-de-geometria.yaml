semantic_id: MAT.ALG.ECUACIONES_LITERALES.DESPEJE_FORMULA_GEOMETRIA
resumen_inicial: El despeje en fórmulas geométricas permite reexpresar dimensiones
  como alturas, bases o radios en función de áreas o perímetros.
explicacion_simple: 'Las fórmulas geométricas (como la del área del triángulo $A =
  \frac{b \cdot h}{2}$) son ecuaciones literales.

  Si conocemos el área y la base y queremos calcular la altura $h$, despejamos la
  variable $h$ manipulando la fórmula exactamente como cualquier ecuación literal.'
explicacion_formal: 'Dada la fórmula del área del trapecio $A = \frac{(B + b) \cdot
  h}{2}$, el **despeje de la altura** $h$ o de la base menor $b$ se define como:


  $$2 A = (B + b) \cdot h \implies h = \frac{2 A}{B + b} \quad \text{y} \quad b =
  \frac{2 A}{h} - B$$


  **Desglose de la fórmula:**

  - $A$: Área de la figura geométrica.

  - $B, b$: Bases mayor y menor del trapecio.

  - $h$: Altura aislada en función de las demás magnitudes geométricas.'
definiciones_clave: '- **Fórmula geométrica**: Igualdad literal que relaciona las
  medidas de una figura geométrica (áreas, perímetros, volúmenes).

  - **Magnitud despejada**: Variable de la fórmula aislada en el primer miembro.'
propiedades_relaciones: '- **Positividad geométrica**: En contextos geométricos reales,
  las variables representan longitudes o áreas, por lo que son estrictamente mayores
  que cero ($h > 0, b > 0$).'
ejemplo_guiado:
  enunciado: Dada la fórmula del área de un trapecio $A = \frac{(B + b) \cdot h}{2}$,
    despeja la base menor $b$ en función de $A$, $B$ y $h$.
  pasos:
  - 'Paso 1: Multiplicar por $2$ en ambos lados: $2A = (B + b) \cdot h$.Paso 2: Dividir
    entre la altura $h \neq 0$: $\frac{2A}{h} = B + b$.Paso 3: Trasponer la base mayor
    $B$ restando: $b = \frac{2A}{h} - B$.Paso 4: Expresar en una sola fracción homogeneizada:
    $b = \frac{2A - B \cdot h}{h}$ para $h > 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar la altura $h$ en la fórmula del área del triángulo $A = \frac{b
    \cdot h}{2}$, ¿cuál es la expresión obtenida?
  choices:
  - text: $h = \frac{2A}{b}$
    is_correct: true
  - text: $h = \frac{A}{2b}$
    is_correct: false
  - text: $h = 2A \cdot b$
    is_correct: false
  - text: $h = \frac{A - 2}{b}$
    is_correct: false
  explanation: La alternativa correcta es '$h = \frac{2A}{b}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al despejar la base menor $b$ en la fórmula del trapecio $A = \frac{(B
    + b)h}{2}$, ¿cuál es la expresión equivalente?
  choices:
  - text: $b = \frac{2A - Bh}{h}$
    is_correct: true
  - text: $b = \frac{2A + Bh}{h}$
    is_correct: false
  - text: $b = 2A - Bh$
    is_correct: false
  - text: $b = \frac{A - B}{2h}$
    is_correct: false
  explanation: La alternativa correcta es '$b = \frac{2A - Bh}{h}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la fórmula geométrica original y la variable específica a despejar.'
- 'Paso 2: Eliminar denominadores multiplicando por el divisor en el miembro opuesto.'
- 'Paso 3: Deshacer paréntesis si la variable está encerrada.'
- 'Paso 4: Trasponer los términos adicionales mediante sustracción o adición.'
- 'Paso 5: Presentar la magnitud despejada.'
errores_correccion: '- **Error común:** Trasponer términos sin eliminar primero el
  denominador global de la fórmula.

  - **Cómo corregirlo:** Si toda la expresión está dividida entre 2, multiplica primero
  por 2 antes de restar o sumar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de despeje.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de despeje.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se pueden usar las reglas comunes de transposición en ecuaciones literales?
  respuesta: Sí
  solucion_pasos:
  - Sí, los parámetros se comportan exactamente igual que los números.
- titulo: ¿Dividir entre un parámetro exige la condición de ser distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la indefinición por cero.
errores_frecuentes:
- Confundir la incógnita a despejar con las letras que actúan como parámetros.
- Olvidar factorizar la incógnita cuando aparece en más de un término.
- Sumar o trasponer parámetros cambiando su operación equivocadamente.
- Dividir entre un parámetro sin aclarar la restricción de ser no nulo.
- Tratar las variables físicas con subíndices como si fueran términos idénticos.
afirmaciones_verdaderas:
- Una ecuación literal expresa la incógnita en función de constantes simbólicas o
  parámetros.
- Si la incógnita figura en múltiples términos, debe agruparse y factorizarse para
  realizar su despeje.
al_terminar_debes_poder: Al finalizar este recurso podrás despejar cualquier variable
  en ecuaciones literales y fórmulas científicas indicando sus restricciones.
