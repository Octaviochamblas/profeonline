semantic_id: MAT.ALG.ECUACIONES_LITERALES.DESPEJE_FORMULA_GEOMETRIA
resumen_inicial: El despeje en fórmulas geométricas permite reexpresar dimensiones como alturas, bases o radios en función
  de áreas, perímetros o volúmenes.
explicacion_simple: 'Las fórmulas geométricas conocidas (como el área del triángulo $A = \frac{b \cdot h}{2}$) son ecuaciones
  literales que relacionan distintas medidas de una figura.


  Si conocemos el área y la base y requerimos calcular la altura $h$, despejamos la variable $h$ manipulando la fórmula exactamente
  como cualquier ecuación literal de primer grado.


  En geometría, es clave considerar que las variables representan magnitudes físicas reales (longitudes o superficies), por
  lo que toman valores estrictamente positivos.


  ![Despeje en fórmulas de geometría](/static/img/nodos/despeje-de-variables-en-formulas-de-geometria-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la fórmula del área del trapecio $A = \frac{(B + b) \cdot h}{2}$, el **despeje de la altura** $h$ o de la base menor
  $b$ se define mediante las transformaciones:


  $$2 A = (B + b) \cdot h \implies h = \frac{2 A}{B + b} \quad \text{y} \quad b = \frac{2 A}{h} - B = \frac{2 A - B \cdot
  h}{h}$$


  ### Desglose de la fórmula

  - $A$: Superficie o área del trapecio.

  - $B, b$: Longitudes de la base mayor y base menor de la figura.

  - $h$: Altura aislada en función de las demás magnitudes geométricas.


  ### Síntesis didáctica

  En fórmulas con denominadores (como la división por $2$), el primer paso debe ser siempre multiplicar ambos miembros por
  el denominador para enterizar la ecuación.

  '
definiciones_clave: '- **Fórmula geométrica**: Ecuación literal que relaciona las medidas métricas (longitudes, áreas, volúmenes)
  de una figura o cuerpo geométrico.

  - **Variable geométrica aislada**: Magnitud geométrica objetivo expresada como el único término del primer miembro.

  '
propiedades_relaciones: '- **Positividad estricta en geometría**: Las variables de longitud, área y volumen representan cantidades
  métricas reales estrictamente mayores que cero ($h > 0, b > 0$).

  - **Equivalencia de unidades**: Las dimensiones del despeje resultante deben conservar consistencia de unidades métricas.

  '
ejemplo_guiado:
  enunciado: Dada la fórmula del área de un trapecio $A = \frac{(B + b) \cdot h}{2}$, despeja la base menor $b$ en función
    de $A$, $B$ y $h$.
  pasos:
  - 'Paso 1: Multiplicar ambos miembros por $2$ para eliminar el denominador: $2A = (B + b) \cdot h$.'
  - 'Paso 2: Dividir entre la altura $h \neq 0$: $\frac{2A}{h} = B + b$.'
  - 'Paso 3: Trasponer la base mayor $B$ restando al miembro opuesto: $b = \frac{2A}{h} - B$.'
  - 'Paso 4: Homogeneizar a una sola fracción algebraica: $b = \frac{2A - B \cdot h}{h}$ declarando $h > 0$.'
  imagen: /static/img/nodos/despeje-de-variables-en-formulas-de-geometria-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar la altura $h$ en la fórmula del área del triángulo $A = \frac{b \cdot h}{2}$, ¿cuál es la expresión
    obtenida?
  choices:
  - text: $h = \frac{2A}{b}$
    is_correct: true
  - text: $h = \frac{A}{2b}$
    is_correct: false
  - text: $h = 2A \cdot b$
    is_correct: false
  - text: $h = \frac{A - 2}{b}$
    is_correct: false
  explanation: La alternativa correcta es '$h = \frac{2A}{b}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al despejar la base menor $b$ en la fórmula del trapecio $A = \frac{(B + b)h}{2}$, ¿cuál es la expresión homogénea
    resultante?
  choices:
  - text: $b = \frac{2A - B h}{h}$
    is_correct: true
  - text: $b = \frac{2A + B h}{h}$
    is_correct: false
  - text: $b = 2A - B h$
    is_correct: false
  - text: $b = \frac{A - B}{2h}$
    is_correct: false
  explanation: La alternativa correcta es '$b = \frac{2A - B h}{h}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la fórmula geométrica original y la variable específica que se desea aislar.'
- 'Paso 2: Multiplicar por los denominadores constantes numéricos para enterizar la ecuación.'
- 'Paso 3: Eliminar los paréntesis mediante propiedad distributiva o trasponer el factor divisor.'
- 'Paso 4: Trasponer los sumandos independientes mediante sustracción.'
- 'Paso 5: Escribir la magnitud despejada indicando la condición de positividad geométrica ($h > 0$).'
errores_correccion: '- **Error 1:** Trasponer la base $B$ restando antes de eliminar la división por $2$ (escribir $A - B
  = \frac{b \cdot h}{2}$). **Cómo corregirlo:** Si toda la suma está dividida por $2$, **DEBE MULTIPLICARSE PRIMERO AMBOS
  MIEMBROS POR $2$ ANTES DE MOVER SUMANDOS DEL NUMERADOR ($2A = (B + b)h$)**.

  - **Error 2:** Omitir multiplicar la variable $B$ por $h$ al homogenizar la fracción $b = \frac{2A}{h} - B$. **Cómo corregirlo:**
  Al reducir a una sola fracción, **EL TÉRMINO INDEPENDIENTE $B$ DEBE MULTIPLICARSE POR EL DENOMINADOR COMÚN $h$ ($b = \frac{2A
  - Bh}{h}$)**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: En la fórmula del perímetro del rectángulo $P = 2(a + b)$, despeja el ancho $b$.
  alternativas:
  - $b = \frac{P}{2} - a$
  - $b = \frac{P - a}{2}$
  - $b = 2P - a$
  respuesta: $b = \frac{P}{2} - a$
  solucion_pasos:
  - '1. Dividir por $2$: $\frac{P}{2} = a + b$.'
  - '2. Restar $a$: $b = \frac{P}{2} - a = \frac{P - 2a}{2}$.'
- titulo: Ejemplo 2
  enunciado: En la fórmula del volumen del cilindro $V = A_b \cdot h$, despeja la altura $h$.
  alternativas:
  - $h = \frac{V}{A_b}$
  - $h = V \cdot A_b$
  - $h = V - A_b$
  respuesta: $h = \frac{V}{A_b}$
  solucion_pasos:
  - 1. Trasponer área de la base $A_b \neq 0$ dividiendo.
  - 2. $h = \frac{V}{A_b}$.
- titulo: Positividad de magnitudes
  enunciado: ¿Las variables de longitud y superficie en geometría representan cantidades estrictamente positivas?
  respuesta: Sí
  solucion_pasos:
  - Sí, pues miden dimensiones físicas reales.
- titulo: Enterización de área
  enunciado: ¿Multiplicar por $2$ la fórmula $A = \frac{b \cdot h}{2}$ produce la ecuación entera $2A = b \cdot h$?
  respuesta: Sí
  solucion_pasos:
  - Sí, elimina el denominador $2$.
errores_frecuentes:
- Al despejar en fórmulas con semiproducto como $A = \frac{b \cdot h}{2}$, olvidar multiplicar el área por $2$ produciendo
  $h = \frac{A}{b}$.
- Restar factores multiplicativos contiguos en lugar de trasponerlos dividiendo.
- Al despejar en el perímetro $P = 2a + 2b$, dividir solo el término $P$ entre $2$ olvidando la simplificación global.
- Invertir indebidamente el numerador y denominador al despejar la base mayor en la fórmula del trapecio.
- Aceptar longitudes o dimensiones geométricas negativas como soluciones físicamente válidas.
afirmaciones_verdaderas:
- Despejar una dimensión en una fórmula geométrica permite calcularla directamente a partir de áreas o volúmenes conocidos.
- En fórmulas con denominadores globales, se debe multiplicar primero por el denominador para enterizar la ecuación.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/despeje-de-variables-en-formulas-de-geometria-resumen.svg)


  QUÉ: Despejar dimensiones y variables en fórmulas geométricas estándar.

  CÓMO: Aplicar operaciones inversas sobre fórmulas de área, perímetro y volumen ($A = \frac{b \cdot h}{2} \iff h = \frac{2A}{b}$),
  despejar la longitud requerida y verificar su validez física ($b > 0, h > 0$).

  '
