    del otro.
  - Aplicar el procedimiento de despeje o método de solución de despeje de variables
    en fórmulas de geometría.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
