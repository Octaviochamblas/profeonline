semantic_id: MAT.ALG.ECUACIONES_LITERALES.DESPEJE_FORMULA_GEOMETRIA
resumen_inicial: 'Despeje de variables en fórmulas de geometría: propiedades, resolución
  y modelamiento en Ecuaciones literales y despeje.'
explicacion_simple: ¿Qué pasa si conoces el Área ($A$), la altura ($h$) y la base
  menor ($b$), pero necesitas calcular la Base mayor ($B$)? Debes despejar $B$.
explicacion_formal: '### Definición formal


  Despejar una variable geométrica $V$ en una fórmula $F(V, p_1, \dots, p_k) = 0$,
  donde $p_1,\dots,p_k$ son las demás magnitudes conocidas, sigue el mismo procedimiento
  que despejar una incógnita en cualquier ecuación literal: se invierten, en orden
  inverso, las operaciones que afectan a $V$.


  ### Desarrollo didáctico


  ¿Qué pasa si conoces el Área ($A$), la altura ($h$) y la base menor ($b$), pero
  necesitas calcular la Base mayor ($B$)? Debes despejar $B$.


  Trata a las demás letras como operaciones que acompañan a la variable:

  - El 2 divide, pasa multiplicando: $2A = (B+b)h$.

  - La $h$ multiplica a todo el paréntesis, pasa dividiendo: $\frac{2A}{h} = B+b$.

  - La $b$ está sumando, pasa restando: $\frac{2A}{h} - b = B$.


  Ahora tienes una fórmula explícita para calcular bases mayores.'
definiciones_clave: '- **Despeje de variables en fórmulas de geometría**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a despeje de variables en fórmulas de geometría.'
ejemplo_guiado:
