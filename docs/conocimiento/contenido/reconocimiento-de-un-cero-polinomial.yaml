semantic_id: MAT.ALG.TEOREMA_FACTOR.CERO_POLINOMIAL
resumen_inicial: 'El reconocimiento de un cero polinomial consiste en identificar valores numéricos $x = r$ que satisfacen la ecuación $P(r) = 0$, anulando exactamente el polinomio y demostrando que son raíces.'
explicacion_simple: |
  Un número $r$ es un **CERO o RAÍZ** de un polinomio $P(x)$ si al reemplazar la $x$ por ese número, el resultado final es **EXACTAMENTE CERO ($0$)**:
  - **CONCEPTO CLAVE**:
    - Si $P(x) = x^3 - 6x^2 + 11x - 6$:
      - Probemos $x = 1$: $P(1) = 1^3 - 6(1)^2 + 11(1) - 6 = 1 - 6 + 11 - 6 = \mathbf{0}$.
      - Como el resultado dio $0$, ¡entonces **$x = 1$ es un Cero o Raíz del polinomio**!
  - **¿Para qué sirven los Ceros?**:
    - **Ceros Posibles**: Si el polinomio tiene coeficientes enteros, ¡sus ceros enteros o racionales sólo pueden ser **divisores del último término independiente** (Teorema de la Raíz Racional)!
    - En $x^3 - 6x^2 + 11x - 6$, los candidatos a ceros son los divisores de $-6$: $\{\pm 1, \pm 2, \pm 3, \pm 6\}$.
explicacion_formal: |
  ### Definición formal
  Sea el polinomio $P(x) \in \mathbb{C}[x]$. Un elemento $\alpha \in \mathbb{C}$ se define como un **cero o raíz del polinomio** $P(x)$ si pertenece al núcleo del operador de evaluación:

  $$\alpha \in \operatorname{Ker}(\operatorname{eval}) \iff \mathbf{P(\alpha) = 0}$$

  ### Teorema de las Raíces Racionales (Teorema de Gauss)
  Sea el polinomio de coeficientes enteros $P(x) = a_n x^n + a_{n-1} x^{n-1} + \dots + a_1 x + a_0 \in \mathbb{Z}[x]$ con $a_n \neq 0$ y $a_0 \neq 0$. Si la fracción irreducible $\frac{p}{q} \in \mathbb{Q}$ ($\operatorname{mcd}(p, q) = 1$) es un cero racional de $P(x)$, entonces:

  $$\begin{cases} p \mid a_0 & \text{($p$ es divisor exacto del término independiente $a_0$)} \\ q \mid a_n & \text{($q$ es divisor exacto del coeficiente principal $a_n$)} \end{cases}$$

  ### Síntesis didáctica
  Un cero polinomial es cualquier número que anula al polinomio ($P(r) = 0$), y para buscarlo se inspeccionan los divisores del término libre divididos por los del término de mayor grado.
definiciones_clave: |
  - **Cero o raíz del polinomio ($\alpha$)**: Valor constante que satisface $P(\alpha) = 0$.
  - **Teorema de la Raíz Racional**: Criterio de prueba de candidatos a ceros racionales dividiendo los divisores de $a_0$ por los divisores de $a_n$.
  - **Divisores del término independiente**: Lista de enteros positivos y negativos $\{\pm 1, \pm d_1, \dots\}$ que pueden anular al polinomio.
propiedades_relaciones: |
  - **Relación con el Teorema del Resto**: Un valor $\alpha$ es cero de $P(x)$ si y sólo si el resto de dividir $P(x)$ por $(x - \alpha)$ es $R = 0$.
ejemplo_guiado:
  enunciado: 'Encuentra un cero entero para el polinomio $P(x) = x^3 - 4x^2 + x + 6$ utilizando el Teorema de las Raíces Racionales.'
  pasos:
    - 'Paso 1: Identificamos el término independiente $a_0 = 6$ y el coeficiente principal $a_3 = 1$.'
    - 'Paso 2: Listamos los candidatos a ceros enteros (divisores de 6):
       $\{\pm 1, \pm 2, \pm 3, \pm 6\}$.'
    - 'Paso 3: Probamos el primer candidato $x = 1$:
       $P(1) = 1^3 - 4(1)^2 + 1 + 6 = 1 - 4 + 1 + 6 = 4 \neq 0$ (no es cero).'
    - 'Paso 4: Probamos el candidato $x = -1$:
       $P(-1) = (-1)^3 - 4(-1)^2 + (-1) + 6 = -1 - 4 - 1 + 6 = \mathbf{0}$.'
    - 'Conclusión: Dado que $P(-1) = 0$, el número **$x = -1$ es un cero del polinomio**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si un polinomio tiene término independiente $a_0 = -8$ y coeficiente principal $a_n = 1$, ¿cuál de los siguientes números NO es un candidato a cero entero según el Teorema de las Raíces Racionales?'
    choices:
      - {text: 'El número 5 no es candidato, porque 5 no divide exactamente a -8', is_correct: true}
      - {text: 'El número 2 es candidato', is_correct: false}
      - {text: 'El número -4 es candidato', is_correct: false}
      - {text: 'El número 1 es candidato', is_correct: false}
    explanation: 'La alternativa correcta es ''El número 5 no es candidato, porque 5 no divide exactamente a -8''. Teorema de la Raíz Racional: los candidatos deben ser divisores enteros de $a_0 = -8$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si al evaluar un polinomio $P(x)$ en $x = 3$ el resultado es $P(3) = 0$, ¿qué afirma el concepto de cero polinomial?'
    choices:
      - {text: 'Afirma que $x = 3$ es una raíz de $P(x)$ y que el polinomio se anula en ese punto', is_correct: true}
      - {text: 'Afirma que el polinomio es divisible por $(x + 3)$', is_correct: false}
      - {text: 'Afirma que el grado del polinomio es 3', is_correct: false}
      - {text: 'Afirma que el residuo de la división por $(x-3)$ es 3', is_correct: false}
    explanation: 'La alternativa correcta es ''Afirma que $x = 3$ es una raíz de $P(x)$ y que el polinomio se anula en ese punto''. Definición $P(r) = 0 \iff r$ es cero.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el término independiente $a_0$ y listar todos sus divisores enteros positivos y negativos.'
  - 'Paso 2: Sustituir secuencialmente los candidatos en el polinomio $P(x)$.'
  - 'Paso 3: Calcular el resultado numérico de cada evaluación.'
  - 'Paso 4: Seleccionar aquellos valores $r$ para los cuales la evaluación dé como resultado exactamente 0.'
errores_correccion: |
  - **Error 1:** Probar números que no son divisores del término independiente $a_0$. **Cómo corregirlo:** Para buscar ceros enteros **SE DEBEN PROBAR ÚNICAMENTE LOS DIVISORES EXACTOS DEL TÉRMINO INDEPENDIENTE $a_0$**.
  - **Error 2:** Declarar que un valor es cero cuando la evaluación da un número distinto de cero (como $P(2) = 4$). **Cómo corregirlo:** Un número **SÓLO ES CERO O RAÍZ SI LA EVALUACIÓN DA EXACTAMENTE 0 ($P(r) = 0$)**.
ejemplos:
  - titulo: 'Cero verificado'
    enunciado: 'Para $P(x) = x^2 - 9$, si $P(3) = 3^2 - 9 = 0$, ¿es $x = 3$ un cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, anula el polinomio.'
  - titulo: 'Cero negativo'
    enunciado: 'Para $P(x) = x^2 - 9$, si $P(-3) = (-3)^2 - 9 = 0$, ¿es $x = -3$ un cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(-3)^2 = 9$.'
  - titulo: 'Lista de candidatos'
    enunciado: 'En $x^3 + 2x - 4$, ¿son $\{\pm 1, \pm 2, \pm 4\}$ los candidatos a ceros enteros?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, son los divisores de -4.'
  - titulo: 'Valor no nulo'
    enunciado: 'Si $P(2) = 5$, ¿es $x = 2$ un cero de $P(x)$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, porque 5 es distinto de 0.'
errores_frecuentes:
  - 'Probar candidatos que no forman parte de los divisores del término independiente a0.'
  - 'Aceptar valores cuyo resultado evaluado es diferente de cero como ceros polinomiales.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Los valores negativos del conjunto de divisores no son probados.'
  - 'Intercambiar el coeficiente principal an con el término independiente a0 al buscar candidatos.'
afirmaciones_verdaderas:
  - 'Un cero o raíz de un polinomio $P(x)$ es cualquier valor $r$ que satisface $P(r) = 0$.'
  - 'Los candidatos a ceros enteros de un polinomio con coeficientes enteros son los divisores de su término independiente.'
al_terminar_debes_poder: 'Reconocer e identificar los ceros de un polinomio comprobando la condición $P(r) = 0$.'
