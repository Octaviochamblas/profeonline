resumen_inicial: Un cero o raíz de un polinomio $P(x)$ es cualquier valor constante
  $x = r$ que satisface la ecuación $P(r) = 0$.
explicacion_simple: Un cero de un polinomio es el valor numérico que al ser colocado
  en la variable hace que el resultado final sea exactamente cero. Por ejemplo, en
  $P(x) = x - 3$, el valor $x = 3$ es un cero porque $P(3) = 3 - 3 = 0$.
explicacion_formal: 'Sea $P(x)$ un polinomio en $\mathbb{R}[x]$. Un elemento $r \in
  \mathbb{C}$ se define como **Cero Polinomial** (o raíz de $P(x)$) si y solo si:


  $$P(r) = 0$$


  **Relación Fundamental de Raíces:**

  - Geometricamente, si $r \in \mathbb{R}$, el punto $(r, 0)$ corresponde a la intersección
  del gráfico de la función polinomial $y = P(x)$ con el eje de las abscisas ($eje
  X$).

  - Algebraicamente, la existencia de una raíz $r$ de multiplicidad $k$ implica que
  $P(x) = (x - r)^k Q(x)$ con $Q(r) \neq 0$.'
definiciones_clave: '- **Cero o Raíz de un polinomio**: Solución de la ecuación polinomial
  $P(x) = 0$.

  - **Multiplicidad de una raíz**: Número de veces que el factor $(x - r)$ aparece
  repetido en la factorización del polinomio.'
propiedades_relaciones: '- **Teorema del Cero**: Si $r$ es un cero de $P(x)$, entonces
  el residuo de dividir $P(x)$ por $(x - r)$ es estrictamente igual a $0$.'
ejemplo_guiado:
  enunciado: Verifique si $x = 2$ y $x = -1$ son ceros del polinomio $P(x) = x^2 -
    x - 2$.
  pasos:
  - 'Paso 1: Evaluar el polinomio en $x = 2$: $P(2) = 2^2 - 2 - 2 = 4 - 4 = 0$. Como
    $P(2) = 0$, $x = 2$ es un cero.'
  - 'Paso 2: Evaluar el polinomio en $x = -1$: $P(-1) = (-1)^2 - (-1) - 2 = 1 + 1
    - 2 = 0$. Como $P(-1) = 0$, $x = -1$ es un cero.'
  - 'Paso 3: Concluir que tanto $2$ como $-1$ son ceros o raíces del polinomio.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de los siguientes valores es un cero del polinomio $P(x) = 2x^2
    - 8$?
  choices:
  - text: $x = 2$
    is_correct: true
  - text: $x = 4$
    is_correct: false
  - text: $x = 0$
    is_correct: false
  - text: $x = 8$
    is_correct: false
  explanation: 'Evaluando en $x = 2$: $P(2) = 2(2)^2 - 8 = 2(4) - 8 = 0$. Por lo tanto,
    la opción correcta es $x = 2$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $r$ es un cero real del polinomio $P(x)$, ¿qué ocurre en la gráfica
    de $y = P(x)$?
  choices:
  - text: La gráfica intersecta al eje $X$ en el punto $(r, 0)$
    is_correct: true
  - text: La gráfica intersecta al eje $Y$ en el punto $(0, r)$
    is_correct: false
  - text: La gráfica presenta una asíntota vertical en $x = r$
    is_correct: false
  - text: El valor $r$ es la pendiente de la recta tangente en el origen
    is_correct: false
  explanation: Los ceros reales de un polinomio implican que La gráfica intersecta
    al eje $X$ en el punto $(r, 0)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Igualar la expresión polinomial a cero: $P(x) = 0$.'
- 'Paso 2: Sustituir un candidato a cero $r$ en la variable $x$.'
- 'Paso 3: Operar numéricamente hasta simplificar $P(r)$.'
- 'Paso 4: Declarar que $r$ es un cero si $P(r) = 0$; de lo contrario, descartar $r$.'
errores_correccion: '- **Error 1: Declarar un cero sin evaluar la expresión completa
  a cero.** **Cómo corregirlo:** La sustitución debe reducir toda la expresión a $0$
  de manera exacta.'
ejemplos:
- titulo: Comprobación de raíz cuadrática
  enunciado: Determine si $x = 5$ es cero de $P(x) = x^2 - 25$.
  respuesta: Sí, es un cero de $P(x)$.
  solucion_pasos:
  - 1. $P(5) = 5^2 - 25 = 25 - 25 = 0$.
  - 2. Al resultar $0$, $x = 5$ es un cero.
- titulo: ¿Un polinomio de grado $n$ puede tener más de $n$ ceros en los complejos?
  respuesta: 'No'
  solucion_pasos:
  - No, el Teorema Fundamental del Álgebra limita el número total de raíces al grado
    $n$ del polinomio.
- titulo: ¿Es $x = 0$ un cero de $P(x) = x^3 + 4x$?
  respuesta: Sí
  solucion_pasos:
  - $P(0) = 0^3 + 4(0) = 0$. Por lo tanto, $x = 0$ es un cero.
errores_frecuentes:
- Uso del término independiente $P(0)$ como sustituto directo de los ceros de la función.
- Definición de un cero como el divisor binómico $(x - r)$ en lugar del escalar constante
  $r$.
- Clasificación de un número como raíz cuando $P(r)$ arroja un valor diferente de
  cero.
- Rechazo automático de raíces negativas por presuponer únicamente valores positivos.
- Asignación de $x = 0$ como única raíz sin analizar la presencia de constantes independientes.
afirmaciones_verdaderas:
- Un número $r$ es cero del polinomio $P(x)$ si y solo si $P(r) = 0$.
- Todo polinomio de grado $n \geq 1$ con coeficientes complejos posee exactamente
  $n$ raíces contando multiplicidades.
al_terminar_debes_poder: Al terminar serás capaz de identificar y comprobar los ceros
  de un polinomio sustituyendo y resolviendo la ecuación $P(r) = 0$.
