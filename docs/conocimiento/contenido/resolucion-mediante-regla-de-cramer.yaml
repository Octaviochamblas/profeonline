semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_CRAMER
resumen_inicial: La regla de Cramer resuelve sistemas 2x2 mediante el cálculo de determinantes de matrices formadas por los coeficientes y términos constantes del sistema.
explicacion_simple: '![Resolución mediante regla de Cramer](/static/img/nodos/resolucion-mediante-regla-de-cramer-intro.svg)


  La **regla de Cramer** es un método matricial para resolver sistemas $2 \times 2$ empleando determinantes de orden $2$.


  Calculamos tres determinantes escalares sencillos (multiplicando en diagonal y restando los productos):


  - Determinante general del sistema $\Delta$.

  - Determinante de la incógnita $x$ ($\Delta_x$).

  - Determinante de la incógnita $y$ ($\Delta_y$).


  Las componentes de la solución se obtienen dividiendo: $x = \frac{\Delta_x}{\Delta}$ e $y = \frac{\Delta_y}{\Delta}$ (siempre que $\Delta \neq 0$).'
explicacion_formal: '### Definición formal

  Dado el sistema en forma canónica $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$, los **determinantes de Cramer** se definen según:


  $$\Delta = \begin{vmatrix} a_1 & b_1 \\ a_2 & b_2 \end{vmatrix} = a_1 b_2 - a_2 b_1$$


  $$\Delta_x = \begin{vmatrix} c_1 & b_1 \\ c_2 & b_2 \end{vmatrix} = c_1 b_2 - c_2 b_1 \quad \text{y} \quad \Delta_y = \begin{vmatrix} a_1 & c_1 \\ a_2 & c_2 \end{vmatrix} = a_1 c_2 - a_2 c_1$$


  $$x = \frac{\Delta_x}{\Delta} \quad \text{e} \quad y = \frac{\Delta_y}{\Delta} \quad (\text{para } \Delta \neq 0)$$


  ### Síntesis didáctica

  Para calcular $\Delta_x$, la columna de coeficientes de $x$ se reemplaza por los términos independientes $c_1, c_2$; análogamente para $\Delta_y$.

  '
definiciones_clave: '- **Regla de Cramer**: Algoritmo directo de resolución matricial para sistemas de ecuaciones lineales determinados.

  - **Determinante del sistema ($\Delta$)**: Valor escalar $a_1 b_2 - a_2 b_1$ que condiciona la existencia de solución única ($\Delta \neq 0$).

  '
propiedades_relaciones: '- **Condición de solución única**: El sistema posee una única solución en $\mathbb{R}^2$ si y solo si el determinante principal es no nulo ($\Delta \neq 0$).

  - **Diagonal principal menos diagonal secundaria**: El determinante de $\begin{vmatrix} p & q \\ r & s \end{vmatrix}$ se evalúa estrictamente como $p \cdot s - r \cdot q$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Resolución mediante regla de Cramer](/static/img/nodos/resolucion-mediante-regla-de-cramer-ejemplos.svg)


    Resuelve por la regla de Cramer el sistema $\begin{cases} 4x + 3y = 18 \\ 2x - y = 4 \end{cases}$ calculando $\Delta, \Delta_x, \Delta_y$.'
  pasos:
  - 'Paso 1: Calcular el determinante del sistema: $\Delta = \begin{vmatrix} 4 & 3 \\ 2 & -1 \end{vmatrix} = 4(-1) - (3)(2) = -4 - 6 = -10$.'
  - 'Paso 2: Calcular el determinante de $x$ reemplazando su columna: $\Delta_x = \begin{vmatrix} 18 & 3 \\ 4 & -1 \end{vmatrix} = 18(-1) - (3)(4) = -18 - 12 = -30$.'
  - 'Paso 3: Calcular el determinante de $y$ reemplazando su columna: $\Delta_y = \begin{vmatrix} 4 & 18 \\ 2 & 4 \end{vmatrix} = 4(4) - (18)(2) = 16 - 36 = -20$.'
  - 'Paso 4: Calcular las coordenadas dividiendo por $\Delta$: $x = \frac{-30}{-10} = 3$ e $y = \frac{-20}{-10} = 2$.'
  - 'Paso 5: Concluir que la solución del sistema es el par ordenado $(x, y) = (3, 2)$.'
