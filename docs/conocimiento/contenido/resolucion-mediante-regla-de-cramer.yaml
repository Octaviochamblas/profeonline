procedimiento:
- Ordena el sistema en la forma $Ax + By = C$.
- Calcula el determinante del sistema ($\Delta S$) usando los coeficientes de $x$
  e $y$.
- Calcula el determinante de $x$ ($\Delta x$) reemplazando la columna de $x$ por los
  términos independientes.
- Calcula el determinante de $y$ ($\Delta y$) reemplazando la columna de $y$ por los
  términos independientes.
- Encuentra las soluciones con $x = \Delta x / \Delta S$ e $y = \Delta y / \Delta
  S$.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en resolución mediante regla de cramer.
