procedimiento:
- 'Paso 1: Escribir el sistema en forma canónica ordenando las incógnitas $x$ e $y$.'
- 'Paso 2: Calcular el determinante del sistema $\Delta = a_1 b_2 - a_2 b_1$ y verificar $\Delta \neq 0$.'
- 'Paso 3: Sustituir la columna de $x$ por las constantes $c_1, c_2$ y evaluar $\Delta_x = c_1 b_2 - c_2 b_1$.'
- 'Paso 4: Sustituir la columna de $y$ por las constantes $c_1, c_2$ y evaluar $\Delta_y = a_1 c_2 - a_2 c_1$.'
- 'Paso 5: Dividir $x = \frac{\Delta_x}{\Delta}$ e $y = \frac{\Delta_y}{\Delta}$ para armar el par ordenado $(x, y)$.'
errores_correccion: '- **Error 1:** Sumar los productos de las diagonales en lugar de restarlos al evaluar un determinante $2 \times 2$ (calcular $a_1 b_2 + a_2 b_1$). **Cómo corregirlo:** El valor de un determinante $2 \times 2$ **ES SIEMPRE EL PRODUCTO DE LA DIAGONAL PRINCIPAL MENOS EL PRODUCTO DE LA DIAGONAL SECUNDARIA ($a_1 b_2 - a_2 b_1$)**.

  - **Error 2:** Colocar los términos constantes en una posición incorrecta al construir $\Delta_x$ o $\Delta_y$. **Cómo corregirlo:** Para $\Delta_x$, **LA COLUMNA DE LAS $x$ SE REEMPLAZA POR LAS CONSTANTES $\begin{pmatrix} c_1 \\ c_2 \end{pmatrix}$ CONSERVANDO LA COLUMNA DE LAS $y$**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: En el sistema $\begin{cases} x + y = 5 \\ x - y = 1 \end{cases}$, calcula $\Delta$.
  alternativas:
  - $\Delta = -2$
  - $\Delta = 2$
  - $\Delta = 0$
  respuesta: $\Delta = -2$
  solucion_pasos:
  - 1. $\Delta = \begin{vmatrix} 1 & 1 \\ 1 & -1 \end{vmatrix} = 1(-1) - (1)(1) = -1 - 1 = -2$.
- titulo: Ejemplo 2
  enunciado: Si $\Delta = 5, \Delta_x = 10, \Delta_y = 15$, ¿cuál es el par solución $(x, y)$?
  alternativas:
  - $(2, 3)$
  - $(3, 2)$
  - $(5, 10)$
  respuesta: $(2, 3)$
  solucion_pasos:
  - 1. $x = \frac{10}{5} = 2$.
  - '2. $y = \frac{15}{5} = 3$. Solución: $(2, 3)$.'
- titulo: Determinante no nulo
  enunciado: ¿La regla de Cramer exige estrictamente que el determinante del sistema $\Delta$ sea distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, previene la división por cero en las soluciones.
- titulo: Diagonal secundaria
  enunciado: ¿El producto de la diagonal secundaria se resta del producto de la diagonal principal al evaluar determinantes 2x2?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de determinante de orden 2.
errores_frecuentes:
- Al evaluar el determinante $\begin{vmatrix} 4 & 3 \\ 2 & -1 \end{vmatrix}$, los productos de las diagonales se suman en lugar de restarse obteniendo $-4 + 6 = 2$.
- Al construir el determinante de $x$ ($\Delta_x$), la columna de los términos constantes se coloca en la segunda columna en vez de sustituir a la primera.
- La regla de Cramer se aplica para resolver un sistema $2 \times 2$ cuyo determinante del sistema resulta igual a cero ($\Delta = 0$).
- Al calcular las coordenadas de la solución, los cocientes se invierten dividiendo $\frac{\Delta}{\Delta_x}$ en lugar de $\frac{\Delta_x}{\Delta}$.
- El determinante del sistema $\Delta$ se evalúa multiplicando las constantes del segundo miembro en lugar de los coeficientes de las variables.
afirmaciones_verdaderas:
- La regla de Cramer permite hallar directamente las coordenadas de la solución mediante el cálculo de tres determinantes $2 \times 2$.
- Un sistema de ecuaciones 2x2 admite solución única mediante regla de Cramer si y solo si el determinante del sistema es no nulo ($\Delta \neq 0$).
al_terminar_debes_poder: '**QUÉ:** Resolver sistemas de ecuaciones lineales 2x2 mediante la regla de Cramer.


  **CÓMO:** Calculando el determinante principal $\Delta = a_1 b_2 - a_2 b_1 \neq 0$ y los determinantes auxiliares $\Delta_x, \Delta_y$, obteniendo $x = \frac{\Delta_x}{\Delta}$ e $y = \frac{\Delta_y}{\Delta}$.


  ![Resumen Resolución mediante regla de Cramer](/static/img/nodos/resolucion-mediante-regla-de-cramer-resumen.svg)'
