procedimiento:
- 'Paso 1: Escribir la matriz de coeficientes y calcular el determinante $\Delta =
  a_1 b_2 - a_2 b_1$.'
- 'Paso 2: Reemplazar la columna de $x$ por las constantes $c_1, c_2$ y calcular $\Delta_x$.'
- 'Paso 3: Reemplazar la columna de $y$ por las constantes $c_1, c_2$ y calcular $\Delta_y$.'
- 'Paso 4: Calcular $x = \frac{\Delta_x}{\Delta}$ e $y = \frac{\Delta_y}{\Delta}$
  para $\Delta \neq 0$.'
errores_correccion: '- **Error común:** Olvidar restar el producto de la diagonal
  secundaria ($a_1 b_2 + a_2 b_1$ en vez de $a_1 b_2 - a_2 b_1$).

  - **Cómo corregirlo:** La fórmula del determinante $2 \times 2$ es SIEMPRE diagonal
  principal MENOS diagonal secundaria.'
