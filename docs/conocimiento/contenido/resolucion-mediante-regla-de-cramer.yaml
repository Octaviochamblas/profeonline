semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_CRAMER
resumen_inicial: 'Resolución mediante regla de Cramer: propiedades, resolución y modelamiento
  en Sistemas de ecuaciones lineales 2x2.'
explicacion_simple: 'Primero ordenas las ecuaciones: las ''x'' y las ''y'' a la izquierda,
  los números a la derecha.'
explicacion_formal: '### Definición formal


  La regla de Cramer aplica a sistemas lineales $2\times2$ cuyo determinante principal
  es no nulo. Para el sistema

  $$\begin{cases} ax+by=e,\\ cx+dy=f, \end{cases}$$

  se define el determinante del sistema como

  $$\Delta=\begin{vmatrix}a&b\\c&d\end{vmatrix}=ad-bc.$$

  Si $\Delta\neq0$, el sistema tiene solución única y viene dada por

  $x=\frac{\Delta_x}{\Delta},\qquad y=\frac{\Delta_y}{\Delta},$

  donde $\Delta_x$ y $\Delta_y$ se obtienen reemplazando, respectivamente, la columna
  de coeficientes de $x$ o de $y$ por la columna de términos independientes.


  ### Desarrollo didáctico


  Primero ordenas las ecuaciones: las ''x'' y las ''y'' a la izquierda, los números
  a la derecha.

  Luego calculas un número principal llamado ''Determinante del Sistema'' ($\Delta
  S$). Lo haces cruzando los coeficientes de $x$ e $y$: $(A \cdot D) - (B \cdot C)$.


  Calculas determinantes similares para la $x$ ($\Delta x$) y para la $y$ ($\Delta
  y$), reemplazando sus columnas por los números independientes.

  Al final, las soluciones son divisiones simples: $x = \frac{\Delta x}{\Delta S}$
  e $y = \frac{\Delta y}{\Delta S}$.

  Es el método ideal si odias las fracciones intermedias.'
definiciones_clave: '- **Resolución mediante regla de Cramer**: Herramienta matemática
  para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
