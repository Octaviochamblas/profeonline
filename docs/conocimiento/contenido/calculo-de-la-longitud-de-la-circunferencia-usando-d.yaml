semantic_id: MAT.GEO.CIRCULO_METRICA.LONGITUD_CIRCUNFERENCIA_DIAMETRO
resumen_inicial: La longitud de la circunferencia se calcula directamente a partir de su diámetro mediante la fórmula P = πd, que fundamenta la definición histórica del número pi.
explicacion_simple: 'Como el diámetro ($d$) es el doble exacto del radio ($d = 2r$), si reemplazas ''$2r$'' por ''$d$'' en la fórmula del perímetro, obtienes una expresión todavía más directa y elegante: **$P = \pi d$**.


  Esta fórmula encierra el verdadero significado histórico del número $\pi$: si mides el contorno de cualquier objeto circular con una cinta métrica ($P$) y lo divides por su ancho máximo pasando por el centro ($d$), **el resultado siempre da exactamente el mismo número**: **$\pi = \frac{P}{d} \approx 3,1416$**. Además, si en un problema de la PAES te dan el diámetro, usar $P = \pi d$ te ahorra tener que dividir entre dos.


  ![Longitud de circunferencia con πd](/static/img/nodos/calculo-de-la-longitud-de-la-circunferencia-usando-d-intro.svg)

  '
explicacion_formal: '### Deducción algebraica de la fórmula con diámetro

  Por la relación lineal intrínseca entre el diámetro $d$ y el radio $r$ ($d = 2r \iff r = \frac{d}{2}$), al sustituir en la definición del perímetro:

  $$P = 2\pi r = \pi(2r) = \pi d$$


  ### Definición analítica del número pi

  La constante universal $\pi$ se define rigurosamente en la geometría euclidiana como el cociente invariable entre la longitud del perímetro $P$ de una circunferencia y la longitud de su diámetro $d$:

  $$\pi = \frac{P}{d} = \text{constante} \quad (\forall \mathcal{C})$$


  ### Despeje métrico del diámetro

  Conociendo la longitud del contorno $P$, el diámetro se despeja de forma inmediata sin pasos intermedios:

  $$d = \frac{P}{\pi}$$


  > **Complemento didáctico:** Ten mucho cuidado al leer el enunciado: si te dan el **radio**, la fórmula lleva un dos ($P = 2\pi r$); pero si te dan el **diámetro**, ¡NO pongas el dos! Es simplemente $P = \pi d$. Poner $2\pi d$ es un error típico que duplica el resultado real.

  '
definiciones_clave: '- **Fórmula $P = \pi d$**: Expresión del perímetro de la circunferencia en función del diámetro.

  - **Razón fundamental $\frac{P}{d}$**: Definición geométrica universal de $\pi$.

  - **Despeje diametral ($d = \frac{P}{\pi}$)**: Determinación del ancho circular a partir de su perímetro.

  '
propiedades_relaciones: '- **Equivalencia estricta**: $P = \pi d \iff P = 2\pi r$.

  - **Proporcionalidad directa**: Duplicar el diámetro duplica exactamente el perímetro.

  - **Estimación práctica**: El perímetro es siempre un poco más del triple que el diámetro ($P \approx 3,14 \cdot d$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de longitud con πd](/static/img/nodos/calculo-de-la-longitud-de-la-circunferencia-usando-d-ejemplos.svg)


    Una rueda de bicicleta tiene un diámetro de $d = 60\text{ cm}$. Calcula la distancia exacta que recorre la bicicleta al dar una vuelta completa la rueda. Además, si un tronco circular tiene un perímetro de $157\text{ cm}$, calcula su diámetro usando $\pi \approx 3,14$.'
  pasos:
  - 'Paso 1: Aplicar $P = \pi d$ para la rueda con $d = 60\text{ cm}$: $P = \pi(60) = 60\pi\text{ cm}$.'
  - 'Paso 2: Concluir distancia por vuelta: La rueda avanza exactamente $60\pi\text{ cm}$ (aproximadamente $188,5\text{ cm}$).'
  - 'Paso 3: Plantear el despeje del diámetro para el tronco: $d = \frac{P}{\pi} = \frac{157}{3,14}$.'
  - 'Paso 4: Realizar la división decimal: $d = 50\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la relación matemática que define a pi a partir del perímetro P y el diámetro d de una circunferencia?
  choices:
  - text: π = P / d.
    is_correct: true
  - text: π = P · d.
    is_correct: false
  - text: π = d / P.
    is_correct: false
  - text: π = P / (2d).
    is_correct: false
  explanation: La alternativa correcta es 'π = P / d.' Pi se define universalmente como la razón constante entre el perímetro y el diámetro.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una circunferencia tiene un diámetro de 25 cm, ¿cuál es su longitud exacta?
  choices:
  - text: 25π cm.
    is_correct: true
  - text: 50π cm.
    is_correct: false
  - text: 12,5π cm.
    is_correct: false
  - text: 625π cm.
    is_correct: false
  explanation: La alternativa correcta es '25π cm.' Aplicando directamente $P = \pi d = 25\pi$ cm.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar la longitud del diámetro $d$.

  2. Aplicar la relación directa $P = \pi d$.

  3. Multiplicar el valor numérico del diámetro por $\pi$.

  4. Si se conoce $P$, despejar el diámetro mediante $d = \frac{P}{\pi}$.

  '
errores_correccion: '- **Error común 1:** Escribir $P = 2\pi d$. **Corrección:** El $2$ solo se usa con el radio ($2\pi r$); con el diámetro es simplemente $\pi d$.

  - **Error común 2:** Confundir diámetro con perímetro. **Corrección:** El diámetro es el ancho recto interior; el perímetro es el contorno curvo exterior.

  '
ejemplos:
- tipo: A
  titulo: Longitud a partir del diámetro
  enunciado: Un plato circular tiene un diámetro de $20\text{ cm}$. ¿Cuánto mide su perímetro?
  alternativas:
  - text: $20\pi\text{ cm}$.
    is_correct: true
  - text: $40\pi\text{ cm}$.
    is_correct: false
  - text: $10\pi\text{ cm}$.
    is_correct: false
  - text: $100\pi\text{ cm}$.
    is_correct: false
  explicacion: 'Usando $P = \pi d$: $P = 20\pi\text{ cm}$.'
- tipo: B
  titulo: Cociente de pi
  enunciado: ¿Es el cociente entre el perímetro y el diámetro de cualquier circunferencia siempre igual a pi?
  respuesta: Sí
  explicacion: 'Sí. Es la definición geométrica fundamental de $\pi$: $\frac{P}{d} = \pi$ para todo círculo.'
errores_frecuentes:
- '''Multiplicar por $2\pi$ el diámetro obteniendo el doble del perímetro real.'''
- '''Olvidar que el diámetro equivale a dos veces el radio ($d = 2r$).'''
- '''Dividir entre dos innecesariamente cuando la fórmula $P = \pi d$ ya usa el diámetro directo.'''
afirmaciones_verdaderas:
- '''La longitud de una circunferencia en función de su diámetro $d$ es $P = \pi d$.'''
- '''El diámetro de una circunferencia es igual a su perímetro dividido por $\pi$ ($d = \frac{P}{\pi}$).'''
- '''El valor de $\pi$ representa el número de veces que el diámetro cabe en el contorno de la circunferencia.'''
al_terminar_debes_poder: '**QUÉ:** Calcular el perímetro de la circunferencia usando su diámetro y despejar el diámetro a partir del perímetro.


  **CÓMO:** Utilizando las expresiones $P = \pi d$ y $d = \frac{P}{\pi}$.


  ![Síntesis de longitud πd](/static/img/nodos/calculo-de-la-longitud-de-la-circunferencia-usando-d-resumen.svg)

  '
