semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.SUPLEMENTARIOS_DEFINICION
resumen_inicial: Dos ángulos son suplementarios si la suma de sus medidas es exactamente
  igual a 180° (π rad), formando juntos un ángulo llano o extendido.
explicacion_simple: '![Ángulos Suplementarios](/static/img/nodos/definicion-de-angulos-suplementarios-como-angulos-cuya-suma-es-180-intro.svg)


  Si unes dos ángulos y juntos completan una línea recta perfecta de 180°, decimos
  que son ángulos suplementarios. Por ejemplo, 70° y 110° son suplementarios porque
  70° + 110° = 180°.'
explicacion_formal: '### Definición formal

  Dos ángulos $\alpha$ y $\beta$ son **suplementarios** si y solo si la suma de sus
  medidas angulares es igual a un ángulo extendido o llano ($180^\circ$ o $\pi \text{
  rad}$):


  $$\alpha + \beta = 180^\circ \iff \alpha + \beta = \pi \text{ rad}$$


  ### Desglose simbólico y geométrico

  - $\alpha, \beta > 0^\circ$: Medidas angulares de dos ángulos convexos.

  - Independencia espacial: Pueden ser contiguos (formando un par lineal) o estar
  separados en distintas figuras.

  - Relación trigonométrica: $\sin \alpha = \sin \beta$ y $\cos \alpha = -\cos \beta$.


  ### Síntesis didáctica

  El suplemento es el concepto métrico que rige las relaciones sobre líneas rectas,
  los ángulos adyacentes y los ángulos consecutivos en cuadriláteros cíclicos.'
definiciones_clave: '- **Ángulos suplementarios**: Pareja de ángulos cuya suma es
  exactamente $180^\circ$.

  - **Par lineal**: Dos ángulos suplementarios adyacentes apoyados sobre una misma
  línea recta. '
propiedades_relaciones: '- **Combinaciones posibles**: Un ángulo agudo y un ángulo
  obtuso, o bien dos ángulos rectos ($90^\circ + 90^\circ = 180^\circ$).

  - **Imposibilidad de dos agudos**: Dos ángulos agudos nunca pueden ser suplementarios
  porque su suma es siempre menor a $180^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulos Suplementarios](/static/img/nodos/definicion-de-angulos-suplementarios-como-angulos-cuya-suma-es-180-ejemplos.svg)


    Dos ángulos miden $\alpha = 115^\circ$ y $\beta = 65^\circ$. Justifica si son
    ángulos suplementarios y explica qué tipo de ángulo es cada uno.'
  pasos:
  - 'Paso 1: Sumar las medidas numéricas: $115^\circ + 65^\circ = 180^\circ$.'
  - 'Paso 2: Como la suma es $180^\circ$, confirmar que son ángulos suplementarios.'
  - 'Paso 3: Clasificar individualmente: $\alpha = 115^\circ$ es un ángulo obtuso
    y $\beta = 65^\circ$ es un ángulo agudo.'
  - 'Paso 4: Concluir que un ángulo obtuso y un ángulo agudo pueden ser suplementarios.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto deben sumar dos ángulos para ser suplementarios?
  choices:
  - text: Exactamente 180°
    is_correct: true
  - text: Exactamente 90°
    is_correct: false
  - text: Exactamente 360°
    is_correct: false
  - text: Más de 180°
    is_correct: false
  explanation: Dos ángulos son suplementarios si su suma es exactamente 180°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Pueden dos ángulos agudos ser suplementarios?
  choices:
  - text: No, porque su suma siempre será estrictamente menor que 180°
    is_correct: true
  - text: Sí, si ambos miden 45°
    is_correct: false
  - text: Sí, si están sobre una recta
    is_correct: false
  - text: Sí, en cualquier polígono regular
    is_correct: false
  explanation: No, porque su suma siempre será estrictamente menor que 180° (cada
    uno es menor a 90°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Medir o identificar las magnitudes de ambos ángulos $\alpha$ y $\beta$.'
- 'Paso 2: Realizar la suma $\alpha + \beta$.'
- 'Paso 3: Verificar si el resultado es igual a $180^\circ$.'
- 'Paso 4: Clasificar como suplementarios si la igualdad se cumple.'
errores_correccion: No confundas suplementarios (180°) con complementarios (90°).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes parejas de ángulos son suplementarios?
  alternativas:
  - $80^\circ$ y $100^\circ$
  - $40^\circ$ y $50^\circ$
  - $100^\circ$ y $90^\circ$
  respuesta: $80^\circ$ y $100^\circ$
  solucion_pasos:
  - $80^\circ + 100^\circ = 180^\circ$, por lo tanto son suplementarios.
- titulo: Ejemplo 2
  enunciado: Si dos ángulos suplementarios tienen la misma medida, ¿cuánto mide cada
    uno?
  alternativas:
  - $90^\circ$ (dos ángulos rectos)
  - $45^\circ$
  - $180^\circ$
  respuesta: $90^\circ$ (dos ángulos rectos)
  solucion_pasos:
  - $x + x = 180^\circ \implies 2x = 180^\circ \implies x = 90^\circ$.
- titulo: ¿Dos ángulos rectos son suplementarios?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque 90° + 90° = 180°.
- titulo: ¿Los ángulos de 120° y 70° son suplementarios?
  respuesta: 'No'
  solucion_pasos:
  - No, 120° + 70° = 190° (no suman 180°).
errores_frecuentes:
- Confundir ángulos suplementarios ($180^\circ$) con complementarios ($90^\circ$).
- Intentar sumar dos ángulos agudos para obtener $180^\circ$.
- Intentar sumar dos ángulos obtusos para obtener $180^\circ$ (sumarían $>180^\circ$).
- Creer que dos ángulos suplementarios deben ser obligatoriamente adyacentes.
- Olvidar que los ángulos internos consecutivos de un paralelogramo son suplementarios.
afirmaciones_verdaderas:
- Dos ángulos suplementarios suman exactamente $180^\circ$.
- Dos ángulos rectos son siempre suplementarios entre sí.
al_terminar_debes_poder: '**QUÉ:** Identificar, clasificar y verificar parejas de
  ángulos suplementarios que suman $180^\circ$.


  **CÓMO:** Comprobando la relación $\alpha + \beta = 180^\circ$ y reconociendo pares
  lineales sobre rectas continuas.


  ![Resumen de Ángulos Suplementarios](/static/img/nodos/definicion-de-angulos-suplementarios-como-angulos-cuya-suma-es-180-resumen.svg)'
