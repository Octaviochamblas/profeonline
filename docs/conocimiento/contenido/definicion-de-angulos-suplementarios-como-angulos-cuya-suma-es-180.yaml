semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.SUPLEMENTARIOS_DEFINICION
resumen_inicial: Los ángulos suplementarios suman 180° formando una recta continua,
  siendo la base para calcular ángulos adyacentes y resolver sistemas de ecuaciones.
explicacion_simple: Imagina una línea recta horizontal de 180° partida en dos pedazos
  por una línea oblicua. Los dos pedazos son suplementarios porque juntos forman la
  línea recta completa.
explicacion_formal: Dos ángulos $\theta$ y $\phi$ son **suplementarios** si la suma
  de sus medidas es exactamente $180^\circ$ ($\theta + \phi = 180^\circ$). El suplemento
  de $\theta$ se obtiene mediante $\phi = 180^\circ - \theta$.
definiciones_clave: '- **Definición de ángulos suplementarios como ángulos cuya suma
  es 180°**: Elemento o relación angular clave en geometría plana.

  - **Propiedad angular**: Regla matemática que relaciona las medidas de los ángulos
  involucrados.'
propiedades_relaciones: '- **Constancia matemática**: La suma o relación planteada
  en definición de ángulos suplementarios como ángulos cuya suma es 180° se mantiene
  invariante.

  - **Aplicación en paralelas y triángulos**: Permite calcular medidas desconocidas
  mediante ecuaciones de primer grado.'
ejemplo_guiado:
  enunciado: Un poste vertical sobre una calle inclinada forma dos ángulos suplementarios
    a ambos lados de su base. Si el ángulo del lado superior mide $115^\circ$, calcula
    el ángulo del lado inferior.
  pasos:
  - 'Paso 1: Usar la definición de suplementarios: suman $180^\circ$ a lo largo de
    la calle recta.'
  - 'Paso 2: Restar $115^\circ$ a $180^\circ$: $180^\circ - 115^\circ$.'
  - 'Paso 3: Concluir que el ángulo del lado inferior mide $65^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el principio geométrico central de definición de ángulos suplementarios
    como ángulos cuya suma es 180°?
  choices:
  - text: Relacionar las medidas angulares mediante ecuaciones numéricas exactas
    is_correct: true
  - text: Considerar que todos los ángulos miden siempre 90 grados
    is_correct: false
  - text: Ignorar la suma de los ángulos en las figuras planas
    is_correct: false
  - text: Asumir que las rectas paralelas se cortan en varios puntos
    is_correct: false
  explanation: La alternativa correcta es 'Relacionar las medidas angulares mediante
    ecuaciones numéricas exactas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el ángulo superior del poste mide 115°, ¿cuánto mide el ángulo suplementario
    del lado inferior?
  choices:
  - text: 65°
    is_correct: true
  - text: 25°
    is_correct: false
  - text: 115°
    is_correct: false
  - text: 75°
    is_correct: false
  explanation: La alternativa correcta es '65°', pues $180^\circ - 115^\circ = 65^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados en definición de ángulos suplementarios como
  ángulos cuya suma es 180°.'
- 'Paso 2: Plantear la ecuación algebraica o propiedad geométrica correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar el resultado.'
errores_correccion: Recuerda revisar siempre que los resultados en definición de ángulos
  suplementarios como ángulos cuya suma es 180° sean coherentes y tengan sentido geométrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x + 159^\circ = 180^\circ$, ¿cuál es el valor de $x$?
  alternativas:
  - 21°
  - 159°
  - 90°
  respuesta: 21°
  solucion_pasos:
  - Despejando $x = 180 - 159 = 21^\circ$.
- titulo: Ejemplo 2
  enunciado: En definición de ángulos suplementarios como ángulos cuya suma es 180°,
    si dos ángulos son suplementarios y uno mide 159°, ¿cuánto mide el otro?
  alternativas:
  - 21°
  - 11°
  - 360°
  respuesta: 21°
  solucion_pasos:
  - Los ángulos suplementarios suman 180°, luego $180 - 159 = 21^\circ$.
- titulo: ¿Se aplican ecuaciones algebraicas para calcular ángulos en definición de
    ángulos suplementarios como ángulos cuya suma es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, el álgebra permite despejar incógnitas angulares.
- titulo: ¿La suma de los ángulos suplementarios en definición de ángulos suplementarios
    como ángulos cuya suma es 180° es igual a 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, los suplementarios suman 180° (90° corresponden a complementarios).
errores_frecuentes:
- Declarar ángulos complementarios (suman 90°) con suplementarios (suman 180°).
- Omitir restar correctamente al despejar la incógnita en una ecuación angular.
- Declarar que dos ángulos son iguales sin que exista un teorema que lo justifique.
- Mezclar unidades de grados sexagesimales con radianes sin convertir.
- Afirmar que la orientación de la figura altera las relaciones angulares.
afirmaciones_verdaderas:
- Los ángulos suplementarios suman exactamente 180°.
- Los ángulos complementarios suman exactamente 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás plantear y resolver ecuaciones
  angulares aplicando las propiedades de definición de ángulos suplementarios como
  ángulos cuya suma es 180°.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
