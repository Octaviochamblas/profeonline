semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.CORRESPONDENCIA_VERTICES
resumen_inicial: 'Correspondencia de vértices en triángulos congruentes: conceptos,
  teoremas, propiedades geométricas y cálculo en Congruencia, Semejanza y Homotecia.'
explicacion_simple: Antes de poder comparar lados y ángulos entre dos triángulos congruentes,
  es fundamental saber identificar exactamente qué vértice de uno corresponde a cuál
  vértice del otro.
explicacion_formal: '![Correspondencia de vértices](/static/img/geometria/congruencia-semejanza/congruencia-correspondencia-vertices.svg)


  ### Definición formal


  Si $\triangle ABC\cong\triangle A''B''C''$, la correspondencia de vértices es $A\leftrightarrow
  A''$, $B\leftrightarrow B''$, $C\leftrightarrow C''$, determinada por el orden en
  que se escribieron los triángulos en la notación de congruencia.


  ### Desarrollo didáctico


  La correspondencia de vértices es la base para identificar lados y ángulos homólogos:
  una vez establecida (por ejemplo, A↔A'', B↔B'', C↔C''), se sabe automáticamente
  que el lado AB corresponde al lado A''B'', y el ángulo en A corresponde al ángulo
  en A''.'
definiciones_clave: '- **Correspondencia de vértices en triángulos congruentes**:
  Elemento o propiedad fundamental en el estudio de congruencia, semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a correspondencia de vértices en triángulos
  congruentes.'
ejemplo_guiado:
  enunciado: Para analizar correspondencia de vértices en triángulos congruentes,
    considera un ángulo $\alpha = 93^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1086^\circ = 93^\circ$.
  pasos:
  - Identificar la propiedad de correspondencia de vértices en triángulos congruentes
    referida a $\alpha = 93^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1086 = 93 \implies x = 93 - 1086$.'
  - Concluir que la medida calculada para correspondencia de vértices en triángulos
    congruentes es $x = -993^\circ$.
