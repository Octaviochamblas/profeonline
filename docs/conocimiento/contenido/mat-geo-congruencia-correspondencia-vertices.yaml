procedimiento:
- 'Paso 1: Observa el orden de los vértices en la notación de congruencia dada.'
- 'Paso 2: Empareja cada vértice del primer triángulo con el vértice en la misma posición
  del segundo.'
- 'Paso 3: Usa esa correspondencia para identificar lados y ángulos homólogos.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con correspondencia de vértices en triángulos congruentes.
