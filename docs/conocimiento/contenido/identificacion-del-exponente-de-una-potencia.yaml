semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_IDENTIFICACION
resumen_inicial: El exponente es el superíndice que determina la operación a realizar sobre la base, indicando multiplicaciones repetidas, inversiones o raíces.
explicacion_simple: '![Identificación del exponente](/static/img/nodos/identificacion-del-exponente-de-una-potencia-intro.svg)


  El exponente es el número pequeño que se escribe arriba y a la derecha de la base. Cumple el rol de dar la orden: cuántas veces multiplicar la base, si hay que darla vuelta (si es negativo) o si hay que extraerle una raíz (si es fracción). Cuando una letra o número está escrito solo sin exponente, como $x$ o $5$, siempre tiene un exponente $1$ invisible.'
explicacion_formal: 'En la expresión $a^n$, el **Exponente** $n$ es el escalar que determina el grado de aplicación del operador de exponenciación sobre la base $a$.


  **Tipología y rol matemático del exponente:**

  - **Exponente natural ($n \in \mathbb{N}$):** Multiplicación reiterada de $n$ factores.

  - **Exponente unitario implícito:** Toda entidad alfanumérica sin superíndice explícito posee exponente $1$ ($x \equiv x^1$, $a \equiv a^1$).

  - **Exponente nulo ($n = 0$):** $a^0 = 1$ para $a \neq 0$.

  - **Exponente entero negativo ($n \in \mathbb{Z}^-$):** Inversión multiplicativa $a^{-k} = \frac{1}{a^k}$.

  - **Exponente racional ($n = \frac{m}{p}$):** Radicación algebraica $a^{m/p} = \sqrt[p]{a^m}$.'
definiciones_clave: '- **Exponente**: Superíndice numérico o algebraico que modula la operación.

  - **Exponente implícito**: Convenio por el cual $x = x^1$.

  - **Grado o potencia**: Nivel de elevación indicado por el exponente.'
propiedades_relaciones: '- **Suma de exponentes implícitos**: En $x \cdot x^2$, se debe sumar $1 + 2 = 3 \implies x^3$.

  - **Jerarquía sintáctica**: En $a^{b^c}$, la operación se asocia de arriba hacia abajo ($a^{(b^c)}$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de identificación del exponente](/static/img/nodos/identificacion-del-exponente-de-una-potencia-ejemplos.svg)


    Identifique el exponente en las expresiones $4^{-3}$, la variable $x$ en el término $5x$, y en $8^{2/3}$.'
  pasos:
  - 'Paso 1: Analizar $4^{-3}$: El superíndice es $-3$. El exponente es el entero negativo $-3$ (indica invertir: $\frac{1}{4^3}$).'
  - 'Paso 2: Analizar $x$ en $5x$: Como no tiene número escrito arriba, su exponente es $1$ implícito ($x = x^1$).'
  - 'Paso 3: Analizar $8^{2/3}$: El superíndice es una fracción $\frac{2}{3}$. El exponente es racional (indica $\sqrt[3]{8^2}$).'
  - 'Conclusión: Los exponentes son $-3$, $1$ y $\frac{2}{3}$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el exponente de la variable $y$ en la expresión $7y$?
  choices:
  - text: $1$ (exponente implícito)
    is_correct: true
  - text: $0$
    is_correct: false
  - text: $7$
    is_correct: false
  - text: No tiene exponente
    is_correct: false
  explanation: La alternativa correcta es '$1$ (exponente implícito)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿qué indica el exponente fraccionario $\frac{2}{3}$ en $8^{2/3}$?
  choices:
  - text: Que se debe calcular la raíz cúbica de $8$ y luego elevar al cuadrado ($(\sqrt[3]{8})^2 = 4$)
    is_correct: true
  - text: Que se debe multiplicar $8$ por dos tercios
    is_correct: false
  - text: Que el resultado es $\frac{8}{3}$
    is_correct: false
  - text: Que la base es negativa
    is_correct: false
  explanation: La alternativa correcta es 'Que se debe calcular la raíz cúbica de $8$ y luego elevar al cuadrado ($(\sqrt[3]{8})^2 = 4$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la posición de superíndice en la parte superior derecha de la base.'
- 'Paso 2: Si hay un valor escrito (positivo, negativo, cero o fraccionario), ese es el exponente.'
- 'Paso 3: Si no hay superíndice visible, asignar el valor $1$ por defecto analítico.'
errores_correccion: '- **Error 1: Asumir que un término sin exponente tiene exponente 0 (pensar que $x = x^0$).** **Cómo corregirlo:** Si fuera $x^0$ valdría $1$. Un término solo siempre tiene exponente $1$ ($x = x^1$).

  - **Error 2: Confundir el exponente con el coeficiente multiplicativo.** **Cómo corregirlo:** En $3x$, el $3$ es coeficiente; en $x^3$, el $3$ es exponente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el exponente en la potencia $10^{-5}$?
  alternativas:
  - $-5$
  - $5$
  - $-50$
  respuesta: $-5$
  solucion_pasos:
  - El superíndice completo incluye el signo negativo $\implies$ Exponente = $-5$.
- titulo: Ejemplo 2
  enunciado: Al multiplicar $a \cdot a^4$, ¿qué exponente tiene el primer factor?
  alternativas:
  - $1$
  - $0$
  - $4$
  respuesta: $1$
  solucion_pasos:
  - $a = a^1$, por lo que $a^1 \cdot a^4 = a^{1+4} = a^5$.
- titulo: ¿Tiene la letra m en la expresión 4m exponente 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, toda variable sin superíndice explícito posee exponente 1 tácito ($m = m^1$).
  alternativas:
  - texto: Sí, posee exponente 1 tácito
    es_correcta: true
    retroalimentacion: ¡Correcto! $4m = 4m^1$.
  - texto: No, su exponente es 0
    es_correcta: false
    retroalimentacion: Incorrecto, si fuera 0 valdría 1.
  - texto: No, su exponente es 4
    es_correcta: false
    retroalimentacion: Incorrecto, 4 es el coeficiente que multiplica.
- titulo: ¿Es el exponente de x en x² / 3 igual a 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, la variable $x$ está elevada al superíndice $2$.
  alternativas:
  - texto: Sí, el exponente de x es 2
    es_correcta: true
    retroalimentacion: ¡Correcto! El 3 es el divisor del denominador.
  - texto: No, es 2/3
    es_correcta: false
    retroalimentacion: Incorrecto, 2/3 sería el exponente si estuviera escrito $x^{2/3}$.
  - texto: No, es 1
    es_correcta: false
    retroalimentacion: Incorrecto, el superíndice 2 es explícito.
errores_frecuentes:
- Asignar exponente 0 a números o variables que no tienen superíndice escrito.
- Confundir coeficientes con exponentes al aplicar propiedades algebraicas.
- Olvidar sumar el exponente 1 tácito en productos como $x \cdot x^3 = x^4$.
- Interpretar exponentes negativos como signos de resta.
- Confundir la base con el exponente en expresiones fraccionarias.
afirmaciones_verdaderas:
- El exponente se ubica en la posición superior derecha de la base.
- Todo número o variable sin exponente escrito posee un exponente $1$ implícito.
- El tipo de exponente (entero, negativo o racional) define la naturaleza de la operación matemática.
al_terminar_debes_poder: '![Síntesis de identificación del exponente](/static/img/nodos/identificacion-del-exponente-de-una-potencia-resumen.svg)


  QUÉ: Identificar y clasificar el exponente de una potencia en cualquier formato.


  CÓMO: Reconociendo la posición de superíndice, asignando el valor $1$ tácito a términos sin exponente explícito, y determinando el tipo de operación (multiplicación iterada, inverso o radicación) según el signo y conjunto numérico del exponente.'
