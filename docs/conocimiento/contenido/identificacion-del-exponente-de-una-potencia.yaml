semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_IDENTIFICACION
resumen_inicial: El exponente es el número o expresión ubicado en la posición superior derecha
  de la base que indica la operación a realizar.
explicacion_simple: 'El exponente es el superíndice (número pequeño arriba a la derecha de
  la base).

  - En $4^7$, el exponente es $7$.

  - En $x^{n+1}$, el exponente es la expresión completa $n+1$.

  - Cuando un número no tiene exponente escrito (como $8$), su exponente implícito es siempre
  $1$ ($8 = 8^1$).'
explicacion_formal: En la notación $a^b$, $b$ es el exponente. El exponente puede ser un entero
  positivo, cero, un entero negativo o un número racional/real. Si una expresión no muestra
  superíndice visible, se asume por convención que su exponente es $1$ ($a = a^1$).
definiciones_clave: '- **Superíndice / Exponente**: Término ubicado en la esquina superior
  derecha de la base.

  - **Exponente implícito**: Exponente $1$ que posee toda cantidad donde no se haya escrito
  superíndice.'
propiedades_relaciones: '- **Exponente 1 por defecto**: $x = x^1$.

  - **Exponente cero**: $x^0 = 1$ ($x \neq 0$).'
ejemplo_guiado:
  enunciado: Identifica los exponentes en la expresión $3x^4 + y - 5^2$.
  pasos:
  - En el término $3x^4$, la base es $x$ y el exponente es $4$.
  - En el término $y$, no hay superíndice visible, luego su exponente implícito es $1$.
  - En el término $5^2$, la base es $5$ y el exponente es $2$.
  - 'Concluir la lista de exponentes: $4$, $1$ y $2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el exponente del número $9$ en la expresión $9$?
  choices:
  - text: '1'
    is_correct: true
  - text: '0'
    is_correct: false
  - text: '9'
    is_correct: false
  - text: No tiene exponente
    is_correct: false
  explanation: 'La correcta es: 1. Por convención, todo número sin exponente explícito está
    elevado a 1.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el exponente en la expresión $2^{x+3}$?
  choices:
  - text: x + 3
    is_correct: true
  - text: '2'
    is_correct: false
  - text: x
    is_correct: false
  - text: '3'
    is_correct: false
  explanation: 'La correcta es: x + 3. Toda la expresión ubicada en el superíndice es el exponente.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar la base de la potencia.'
- 'Paso 2: Observar la posición superior derecha de la base.'
- 'Paso 3: Leer el valor numérico o algebraico del superíndice. Si está vacío, asignar el
  valor 1.'
errores_correccion: 'No debes confundir un número que no lleva superíndice con tener exponente
  $0$. Decir que $x = x^0$ es incorrecto porque $x^0 = 1$. **La ausencia de exponente escrito
  significa siempre exponente 1**: $x = x^1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el exponente en $7^3$?
  alternativas:
  - '3'
  - '7'
  - '343'
  respuesta: '3'
  solucion_pasos:
  - El superíndice es $3$, por ende el exponente es $3$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el exponente en la expresión (a+b)^5?
  alternativas:
  - '5'
  - a+b
  - a
  respuesta: '5'
  solucion_pasos:
  - Todo lo que está en el superíndice, en este caso 5, es el exponente.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el exponente implícito del número 12 en la expresión 12?
  alternativas:
  - '1'
  - '0'
  - '12'
  respuesta: '1'
  solucion_pasos:
  - Todo número sin superíndice visible tiene exponente 1.
- titulo: ¿El exponente de x en la expresión x^3 y^2 es 3?
  respuesta: Sí
  solucion_pasos:
  - El superíndice sobre la x es 3.
errores_frecuentes:
- Pensar que un número sin exponente escrito está elevado a cero.
- 'Confundir el coeficiente multiplicativo con el exponente (ej: en $3x$, pensar que $3$ es
  exponente).'
- Confundir el índice de una raíz con el exponente de una potencia.
- Pensar que el exponente siempre debe ser un número entero positivo pequeño.
- Ubicar el exponente en el lugar incorrecto al transcribir una expresión desde el enunciado.
afirmaciones_verdaderas:
- Todo número o variable sin exponente explícito posee exponente igual a 1.
- El exponente se ubica como superíndice a la derecha de la base.
al_terminar_debes_poder: Identificar de forma directa el exponente en cualquier término algebraico
  o numérico.
fuente: Texto escolar MINEDUC — Matemática 8° Básico.
estado: publicado
