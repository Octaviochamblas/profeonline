semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_IDENTIFICACION
resumen_inicial: El exponente es el número superíndice que indica el número de iteraciones
  o la naturaleza matemática del operador potencia asignado a una base.
explicacion_simple: El exponente es el número pequeño ubicado arriba y a la derecha
  de la base. Su función es mandar cuántas veces se multiplicará la base (si es positivo)
  o dar instrucciones de inversión o radicación (si es negativo o fraccionario).
explicacion_formal: 'En la expresión $a^n$, el **Exponente $n$** actúa como el parámetro
  de control de la operación:


  $$n \in \mathbb{R} \implies a^n$$


  **Desglose según el dominio del exponente:**

  - $n \in \mathbb{N}$: Conteo de factores multiplicativos.

  - $n = 0$: Operador de normalización a la unidad ($a^0 = 1$ para $a \neq 0$).

  - $n \in \mathbb{Z}^-$: Operador de inversión multiplicativa ($a^{-k} = \frac{1}{a^k}$).

  - $n \in \mathbb{Q}$: Operador de radicación ($a^{p/q} = \sqrt[q]{a^p}$).


  > **Complemento didáctico:** El exponente determina la ley operativa que debe aplicarse
  sobre la base.'
definiciones_clave: '- **Exponente**: Superíndice posicional que dicta la operación
  cuantitativa a realizar sobre la base.'
propiedades_relaciones: '- **Posición superíndice**: Se ubica arriba a la derecha
  de la base.'
ejemplo_guiado:
  enunciado: Identifique el exponente en las expresiones $5^4$, $x^{-2}$ y $8^{1/3}$.
  pasos:
  - 'Paso 1: En $5^4$, el superíndice pequeño es $4 \implies$ exponente natural $4$.'
  - 'Paso 2: En $x^{-2}$, el superíndice es $-2 \implies$ exponente entero negativo
    $-2$.'
  - 'Paso 3: En $8^{1/3}$, el superíndice es $\frac{1}{3} \implies$ exponente racional
    $\frac{1}{3}$.'
  - 'Conclusión: Los exponentes son $4$, $-2$ y $\frac{1}{3}$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué posición notacional se ubica el exponente de una potencia a^n?
  choices:
  - text: Como un número superíndice pequeño arriba a la derecha de la base
    is_correct: true
  - text: Como un subíndice abajo a la izquierda
    is_correct: false
  - text: Multiplicando antes del paréntesis
    is_correct: false
  - text: Debajo del denominador
    is_correct: false
  explanation: La alternativa correcta es 'Como un número superíndice pequeño arriba
    a la derecha de la base'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para x^{-2}, ¿cuál es el exponente?
  choices:
  - text: El exponente es -2
    is_correct: true
  - text: El exponente es x
    is_correct: false
  - text: El exponente es 2 positivo
    is_correct: false
  - text: No tiene exponente
    is_correct: false
  explanation: La alternativa correcta es 'El exponente es -2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el superíndice posicionado en la parte superior derecha de la
  base.'
- 'Paso 2: Identificar su signo (positivo, cero o negativo) y su tipo numérico (entero
  o racional).'
- 'Paso 3: Determinar el operador correspondiente (multiplicación, inversión o raíz).'
errores_correccion: '- **Error 1: Confundir la base con el exponente (pensar que en
  $2^3$ el exponente es 2).** **Cómo corregirlo:** La base es el número grande abajo
  ($2$) y el exponente es el superíndice pequeño arriba ($3$).


  - **Error 2: Tratar el exponente como un coeficiente multiplicativo.** **Cómo corregirlo:**
  El exponente no multiplica directamente a la base; ordena cuántas veces se reitera
  la base.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el exponente en la potencia $9^6$?
  alternativas:
  - '6'
  - '9'
  - '54'
  respuesta: '6'
  solucion_pasos:
  - El superíndice es $6$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el exponente implícito en el número $7$?
  alternativas:
  - '1'
  - '0'
  - '7'
  respuesta: '1'
  solucion_pasos:
  - Cualquier número sin exponente explícito posee exponente $1$ ($7 = 7^1$).
- titulo: ¿Es el exponente en y^3 igual al número 3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3$ es el superíndice que eleva a $y$.
- titulo: ¿Puede un exponente ser un número negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, indica inversión multiplicativa ($a^{-n} = 1/a^n$).
errores_frecuentes:
- El exponente de una potencia es el número de mayor tamaño escrito a la izquierda
  de la expresión.
- En la expresión $3^4$ el exponente es el número 3 y la base es el número 4.
- Un número que no lleva superíndice escrito tiene como exponente implícito al número
  0.
- El exponente se encarga de multiplicar a la base por 2 independientemente del valor
  que tenga.
- Los exponentes fraccionarios no pertenecen a la notación de las potencias.
afirmaciones_verdaderas:
- El exponente es el superíndice que indica las iteraciones o la transformación a
  aplicar sobre la base.
- Todo número real $x$ escrito en forma simple tiene un exponente implícito igual
  a $1$ ($x = x^1$).
al_terminar_debes_poder: Al terminar serás capaz de identificar el exponente de cualquier
  potencia, reconociendo su posición notacional y su significado operativo.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
