semantic_id: MAT.GEO.POLIGONOS_BASE.LADOS
resumen_inicial: 'Identificación de los lados de un polígono: conceptos, teoremas,
  propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Además de los vértices, el otro elemento fundamental que compone
  a todo polígono son sus lados, los segmentos que lo delimitan.
explicacion_formal: '![Lados de un polígono](/static/img/geometria/poligonos-cuadrilateros/poligonos-lados.svg)


  ### Definición formal


  En un polígono de $n$ vértices, existen exactamente $n$ lados, cada uno formado
  por el segmento que une dos vértices consecutivos.


  ### Desarrollo didáctico


  Un pentágono tiene exactamente 5 lados, cada uno conectando un vértice con el siguiente
  en el recorrido de la figura. El nombre de cada polígono deriva del número de lados
  que posee (por ejemplo, penta- significa cinco).'
definiciones_clave: '- **Identificación de los lados de un polígono**: Elemento o
  propiedad fundamental en el estudio de polígonos y cuadriláteros.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación de los lados de un polígono.'
