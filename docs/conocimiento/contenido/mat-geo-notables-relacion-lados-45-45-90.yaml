resumen_inicial: 'Relación de lados en el triángulo 45°-45°-90°: cateto = hipotenusa
  / √2: conceptos, teoremas, propiedades geométricas y cálculo en Perímetros, Áreas
  y Teoremas.'
explicacion_simple: En un triángulo 45-45-90, la proporción entre sus lados es siempre
  la misma, sin importar su tamaño, lo que permite calcular un lado a partir del otro
  sin usar el teorema de Pitágoras cada vez.
explicacion_formal: '![Relación de lados en el triángulo 45°-45°-90°](/static/img/geometria/areas-pitagoras/notables-relacion-lados-45-45-90.svg)


  ### Definición formal


  Esta relación se obtiene aplicando Pitágoras a los dos catetos iguales: $h^2=l^2+l^2=2l^2$,
  por lo que $h=l\sqrt2$.


  ### Desarrollo didáctico


  Un triángulo 45-45-90 con catetos de 5 cm tiene hipotenusa $h=5\sqrt2\approx7,07$
  cm. Si en cambio se conoce la hipotenusa (por ejemplo 10 cm), el cateto es $l=\frac{10}{\sqrt2}=5\sqrt2\approx7,07$
  cm.'
