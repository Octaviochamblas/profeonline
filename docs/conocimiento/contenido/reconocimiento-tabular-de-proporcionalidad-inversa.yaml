resumen_inicial: Para comprobar en una tabla si dos variables son inversamente proporcionales,
  se verifica que la multiplicación $x \cdot y$ de cada fila dé como resultado siempre
  la misma constante $k$.
explicacion_simple: Frente a una tabla con valores, multiplicamos el número de la
  izquierda por el de la derecha en cada fila. Si todas las multiplicaciones de las
  filas dan exactamente el mismo resultado $k$, las variables son inversamente proporcionales.
explicacion_formal: 'Dada la tabla de datos $\{(x_1, y_1), (x_2, y_2), \dots, (x_n,
  y_n)\}$, el **Criterio Tabular Inverso** exige la verificación estricta de la igualdad
  de productos:


  $$x_1 \cdot y_1 = x_2 \cdot y_2 = \dots = x_n \cdot y_n = k \quad (k \in \mathbb{R}^+)$$


  **Detección de falla:**

  - Si algún producto $x_i \cdot y_i \neq k$, la tabla no es de proporcionalidad inversa.'
definiciones_clave: '- **Reconocimiento tabular inverso**: Comprobación de igualdad
  de productos $x_i \cdot y_i = k$ en todas las filas.'
propiedades_relaciones: '- **Criterio de producto constante**: $x_i \cdot y_i = k$
  en toda la tabla.'
ejemplo_guiado:
  enunciado: Verifique si la tabla con pares $(2, 30)$, $(4, 15)$ y $(6, 10)$ corresponde
    a una proporción inversa.
  pasos:
  - 'Paso 1: Calcular $x_1 \cdot y_1 = 2 \cdot 30 = 60$.'
  - 'Paso 2: Calcular $x_2 \cdot y_2 = 4 \cdot 15 = 60$.'
  - 'Paso 3: Calcular $x_3 \cdot y_3 = 6 \cdot 10 = 60$.'
  - 'Conclusión: Todos los productos son iguales a $k = 60 \implies$ Sí es proporcionalidad
    inversa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué prueba tabular confirma la proporcionalidad inversa en una tabla
    de datos?
  choices:
  - text: Verificar que el producto x · y sea idéntico en todas las filas de la tabla
    is_correct: true
  - text: Dividir la primera columna entre la segunda
    is_correct: false
  - text: Comprobar que ambas columnas aumenten simultáneamente
    is_correct: false
  - text: Sumar los valores de cada columna
    is_correct: false
  explanation: La alternativa correcta es 'Verificar que el producto x · y sea idéntico
    en todas las filas de la tabla'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (2,30), (4,15) y (6,10), ¿cuál fue el producto
    constante k?
  choices:
  - text: '60'
    is_correct: true
  - text: '15'
    is_correct: false
  - text: '120'
    is_correct: false
  - text: '30'
    is_correct: false
  explanation: La alternativa correcta es '60'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de evaluar tablas de valores y determinar
  si responden a una proporcionalidad inversa mediante la constancia del producto
  $x \cdot y$.
semantic_id: MAT.NUM.PROP_INVERSA.RECONOCIMIENTO_TABULAR
procedimiento:
- 'Paso 1: Verificar que el producto $x \cdot y = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = \frac{k}{x}$ o la hipérbola decreciente.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Aplicar la regla de tres directa multiplicando cruzado
  en un problema inverso.** **Cómo corregirlo:** En la proporción inversa se multiplican
  los datos de la misma fila ($x_1 \cdot y_1 = x_2 \cdot y_2$).


  - **Error 2: Usar el cociente $y / x$ en lugar del producto $x \cdot y$ para calcular
  $k$.** **Cómo corregirlo:** La proporcionalidad inversa conserva el PRODUCTO $k
  = x \cdot y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_INVERSA.RECONOCIMIENTO_TABULAR.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad inversa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de producto.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por producto constante x · y.
- titulo: ¿Es la gráfica de una proporción inversa una recta?
  respuesta: 'No'
  solucion_pasos:
  - No, es una curva suave llamada rama de hipérbola.
- titulo: ¿Permite la constante k = x · y resolver ecuaciones inversas?
  respuesta: Sí
  solucion_pasos:
  - Sí, despejando $y = k / x$ o $x = k / y$.
errores_frecuentes:
- Aplicar la regla de tres directa para resolver problemas cuya naturaleza es inversamente
  proporcional.
- Dividir la variable dependiente entre la independiente ($y / x$) pretendiendo obtener
  la constante de proporción inversa.
- Graficar una proporcionalidad inversa mediante una línea recta que toca el origen
  $(0,0)$.
- Declarar que si una variable disminuye al aumentar otra, siempre son inversamente
  proporcionales sin comprobar $x \cdot y = k$.
- Omitir que el producto de los datos $x_1 \cdot y_1$ debe ser igual al producto $x_2
  \cdot y_2$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son inversamente proporcionales si su producto es constante:
  $x \cdot y = k$.'
- El gráfico de una relación de proporcionalidad inversa en el primer cuadrante es
  una rama de hipérbola decreciente.
