semantic_id: MAT.NUM.PROP_INVERSA.RECONOCIMIENTO_TABULAR
resumen_inicial: 'Reconocimiento tabular de proporcionalidad inversa: concepto y propiedades
  fundamentales en Proporcionalidad inversa.'
explicacion_simple: ¿Cómo distinguirías una tabla de proporción inversa de una tabla
  cualquiera donde los datos suben y bajan? La prueba ácida es multiplicar las filas.
explicacion_formal: 'Una **tabla de valores** puede modelar una proporcionalidad inversa.
  Para comprobarlo de forma matemática e irrefutable, debes multiplicar el valor de
  $x$ por su correspondiente valor de $y$ en cada uno de los pares de datos presentados.


  - Si todas las multiplicaciones arrojan el mismo número constante $k$, la tabla
  representa una proporción inversa.

  - Si al menos uno de los productos es distinto, la tabla NO es de proporción inversa
  (aunque visualmente parezca que una baja mientras la otra sube).'
definiciones_clave: '- **Reconocimiento tabular de proporcionalidad inversa**: Elemento
  central dentro del estudio de Proporcionalidad inversa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a reconocimiento tabular de proporcionalidad inversa.'
