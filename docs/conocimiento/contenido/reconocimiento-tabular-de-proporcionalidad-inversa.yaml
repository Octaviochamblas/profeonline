semantic_id: MAT.NUM.PROP_INVERSA.RECONOCIMIENTO_TABULAR
resumen_inicial: Una tabla de valores representa una proporcionalidad inversa si y solo si todos los pares de datos $(x_i, y_i)$ arrojan exactamente el mismo producto $x_i \cdot y_i = k$ constante.
explicacion_simple: "![Reconocimiento tabular inverso](/static/img/nodos/reconocimiento-tabular-de-proporcionalidad-inversa-intro.svg)\n\nPara verificar si una **tabla de datos** corresponde a una proporcionalidad inversa:\n1. **Multiplica los valores de cada columna**: $x_1 \\cdot y_1, x_2 \\cdot y_2, x_3 \\cdot y_3, \\dots$\n2. **Compara los resultados**:\n   - Si **todos los productos dan exactamente el mismo número $k$**, la tabla **SÍ es de proporcionalidad inversa**.\n   - Si **aunque sea un solo producto da diferente**, la tabla **NO es inversa**.\n3. **Completar datos faltantes:** Para rellenar casillas vacías, divide la constante $k$ por el número de la columna:\n$$y = \\frac{k}{x} \\quad \\text{o} \\quad x = \\frac{k}{y}$$"
explicacion_formal: 'Sea una tabla discreta de valores $\mathcal{T} = \{(x_1, y_1), (x_2, y_2), \dots, (x_n, y_n)\} \subset \mathbb{R}^+ \times \mathbb{R}^+$.


  **Criterio de Proporcionalidad Inversa Tabular:**

  $\mathcal{T}$ representa una relación de proporcionalidad inversa si y solo si:


  $$x_1 \cdot y_1 = x_2 \cdot y_2 = \dots = x_n \cdot y_n = k \quad (k \in \mathbb{R}^+, k = \text{constante})$$


  Si existe al menos un índice $j \in \{1, \dots, n\}$ tal que $x_j \cdot y_j \neq k$, la tabla no representa una proporcionalidad inversa.'
definiciones_clave: '- **Tabla proporcional inversa**: Tabla donde todas las columnas satisfacen $x_i \cdot y_i = k$.

  - **Verificación horizontal por columna**: Producto de las componentes de cada par ordenado.

  - **Relleno inverso**: Cálculo de celdas vacías mediante división por $k$.'
propiedades_relaciones: '- **Invarianza de área**: Cada columna define un rectángulo de área $k$.

  - **Sensibilidad a fallos**: Una única columna con producto divergente anula la proporcionalidad inversa de toda la tabla.'
ejemplo_guiado:
  enunciado: '![Ejemplos de tabla inversa](/static/img/nodos/reconocimiento-tabular-de-proporcionalidad-inversa-ejemplos.svg)


    Complete la casilla faltante en una tabla inversa donde $(x=3, y=20)$ y $(x=5, y=?)$, y determine si los pares $(2, 30), (3, 20), (4, 14)$ forman una tabla inversamente proporcional.'
  pasos:
  - 'Paso 1: Para completar la tabla: Calcular $k = 3 \cdot 20 = 60$.'
  - 'Paso 2: Para $x = 5$: $y = \frac{60}{5} = 12$.'
  - 'Paso 3: Para la segunda tabla: Multiplicar pares: $2 \cdot 30 = 60$, $3 \cdot 20 = 60$, $4 \cdot 14 = 56$.'
  - 'Paso 4: Comparar: Como $56 \neq 60$, la segunda tabla NO es inversamente proporcional.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se verifica si una tabla corresponde a una proporcionalidad inversa?
  choices:
  - text: Multiplicando x por y en cada columna y comprobando que todos los productos sean iguales a k
    is_correct: true
  - text: Dividiendo y entre x en cada columna
    is_correct: false
  - text: Sumando las dos filas
    is_correct: false
  - text: Verificando que la fila x siempre aumente
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando x por y en cada columna y comprobando que todos los productos sean iguales a k'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la tabla con pares (2,30), (3,20) y (4,14) falló como tabla inversa?
  choices:
  - text: Porque el tercer producto $4 \times 14 = 56$ no es igual a 60
    is_correct: true
  - text: Porque 14 es un número par
    is_correct: false
  - text: Porque hay solo tres columnas
    is_correct: false
  - text: Porque 30 es divisible por 3
    is_correct: false
  explanation: La alternativa correcta es 'Porque el tercer producto $4 \times 14 = 56$ no es igual a 60'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Crear una fila auxiliar calculando el producto $x_i \cdot y_i$ para cada columna.'
- 'Paso 2: Comprobar si todos los productos resultan idénticos a la constante $k$.'
- 'Paso 3: Si todos coinciden, completar casillas vacías mediante $y = \frac{k}{x}$ o $x = \frac{k}{y}$.'
errores_correccion: '- **Error 1: Dividir en vez de multiplicar.** **Cómo corregirlo:** La proporcionalidad inversa se prueba mediante el PRODUCTO $x \cdot y$.

  - **Error 2: No verificar todas las columnas.** **Cómo corregirlo:** Se debe multiplicar cada par individualmente hasta el final de la tabla.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En la tabla inversa $(x=2, y=18), (x=3, y=12), (x=9, y=?)$, ¿cuál es el valor de $y$ para $x = 9$?
  alternativas:
  - $4$
  - $6$
  - $2$
  respuesta: $4$
  solucion_pasos:
  - $k = 2 \cdot 18 = 36 \implies y = \frac{36}{9} = 4$.
- titulo: Ejemplo 2
  enunciado: ¿Es inversamente proporcional la tabla $(x=2, y=50), (x=4, y=25), (x=10, y=10)$?
  alternativas:
  - Sí, todos los productos dan k = 100
  - No, los números van disminuyendo
  - No, falta el punto x = 1
  respuesta: Sí, todos los productos dan k = 100
  solucion_pasos:
  - $2 \cdot 50 = 100$, $4 \cdot 25 = 100$, $10 \cdot 10 = 100$. Sí es inversa.
- titulo: ¿Es proporcional inversa una tabla si todos sus productos x · y dan 72?
  respuesta: Sí
  solucion_pasos:
  - Sí, la constancia del producto demuestra la proporcionalidad inversa.
  alternativas:
  - texto: Sí, cumple con el criterio de producto constante
    es_correcta: true
    retroalimentacion: ¡Correcto! Criterio de consistencia tabular.
  - texto: No, debe dar 1
    es_correcta: false
    retroalimentacion: Incorrecto, la constante puede ser cualquier valor real positivo.
  - texto: No, los cocientes deben ser iguales
    es_correcta: false
    retroalimentacion: Incorrecto, eso es para proporción directa.
- titulo: ¿Basta un solo producto discordante para descartar proporcionalidad inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, la relación matemática debe cumplirse en la totalidad de los datos tabulados.
  alternativas:
  - texto: Sí, una sola discordancia invalida la proporcionalidad inversa de la tabla
    es_correcta: true
    retroalimentacion: ¡Correcto! Criterio riguroso.
  - texto: No, se puede promediar el error
    es_correcta: false
    retroalimentacion: Incorrecto, en matemática exacta debe ser estricto.
  - texto: No, se ignora el último valor
    es_correcta: false
    retroalimentacion: Incorrecto, todos los pares definen la relación.
errores_frecuentes:
- Dividir $y/x$ en lugar de multiplicar $x \cdot y$.
- Multiplicar solo los dos primeros pares y asumir el resto.
- Multiplicar en vez de dividir al completar casillas faltantes.
- Confundir la tabla inversa con una directa decreciente.
afirmaciones_verdaderas:
- Una tabla es inversamente proporcional si todos sus pares satisfacen $x_i \cdot y_i = k$.
- La constante $k$ permite completar celdas vacías mediante $y = \frac{k}{x}$ o $x = \frac{k}{y}$.
- Un solo par con producto distinto invalida la relación proporcional inversa.
al_terminar_debes_poder: '![Síntesis de reconocimiento tabular inverso](/static/img/nodos/reconocimiento-tabular-de-proporcionalidad-inversa-resumen.svg)


  QUÉ: Reconocer, validar y completar tablas de valores inversamente proporcionales.


  CÓMO: Calculando el producto $x_i \cdot y_i$ en cada columna, verificando la igualdad universal a la constante $k$ y completando incógnitas mediante $y = \frac{k}{x}$ o $x = \frac{k}{y}$.'
