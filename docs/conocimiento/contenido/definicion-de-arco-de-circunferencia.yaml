semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.ARCO_DEFINICION
resumen_inicial: Un arco es una porción continua de circunferencia delimitada por dos de sus puntos, cuya longitud es proporcional al ángulo del centro.
explicacion_simple: 'Si tomas un trozo de alambre circular y lo cortas en dos partes, cada uno de esos trozos curvos es un **arco de circunferencia** (se anota como $\overset{\frown}{AB}$).


  Un arco tiene dos formas de medirse: 1) En **grados sexagesimales** (su apertura angular, que es exactamente igual al ángulo del centro que lo ilumina, de $0^\circ$ a $360^\circ$), y 2) En **centímetros o metros** (su longitud física real si lo estiras como una cuerda recta).


  Para calcular cuánto mide de largo un arco ($s$), solo tienes que calcular una regla de tres con la vuelta completa: divides el ángulo $\alpha$ entre $360^\circ$ y lo multiplicas por el perímetro completo: **$s = \frac{\alpha}{360^\circ} \cdot 2\pi r$**.


  ![Definición de arco](/static/img/nodos/definicion-de-arco-de-circunferencia-intro.svg)

  '
explicacion_formal: '### Definición formal de arco

  Sean $A, B \in \mathcal{C}(O, r)$ dos puntos distintos de una circunferencia. El conjunto de puntos de la curva comprendidos entre $A$ y $B$ en un sentido de recorrido dado se denomina **arco de circunferencia**, denotado por $\overset{\frown}{AB}$.


  ### Medida angular vs Longitud métrica lineal

  Es imperativo distinguir dos magnitudes de naturaleza física y matemática distinta:

  1. **Medida angular ($m(\overset{\frown}{AB})$):** Magnitud dimensional de rotación, idéntica a la medida del ángulo central subtendido:

  $$m(\overset{\frown}{AB}) = \alpha \quad (\text{en grados sexagesimales o radianes})$$


  2. **Longitud métrica lineal ($s = \text{long}(\overset{\frown}{AB})$):** Longitud de trayectoria unidimensional rectificable:

  $$s = \left(\frac{\alpha}{360^\circ}\right) \cdot 2\pi r = \frac{\alpha \pi r}{180^\circ}$$

  En radianes (donde $\theta = \frac{\alpha \pi}{180^\circ}$), la relación adquiere su forma más elegante: $s = r\theta$.


  > **Complemento didáctico:** ¡Cuidado con confundir la medida angular con la longitud métrica! Si dos circunferencias concéntricas (una chica y una gigante) tienen un ángulo central de $60^\circ$, AMBOS arcos miden $60^\circ$ en apertura angular, pero la longitud en centímetros del arco de la circunferencia gigante es muchísimo mayor.

  '
definiciones_clave: '- **Arco ($\overset{\frown}{AB}$)**: Sección continua de la curva de una circunferencia.

  - **Ángulo del centro ($\alpha$)**: Ángulo cuyo vértice es el centro $O$ y sus lados son radios que subtienden el arco.

  - **Longitud de arco ($s$)**: Distancia euclidiana recorrida a lo largo de la curva dada por $s = \frac{\alpha \pi r}{180^\circ}$.

  '
propiedades_relaciones: '- **Proporcionalidad directa**: La longitud del arco es directamente proporcional al ángulo del centro y al radio.

  - **Arco menor y arco mayor**: Dos puntos $A$ y $B$ determinan dos arcos complementarios cuya suma angular es $360^\circ$ y cuya suma métrica es $2\pi r$.

  - **Diferencia con la cuerda**: La longitud del arco $s$ es siempre estrictamente mayor que la longitud de la cuerda recta que une los mismos puntos ($s > L_{\text{cuerda}}$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de arco](/static/img/nodos/definicion-de-arco-de-circunferencia-ejemplos.svg)


    En una circunferencia de radio $r = 12\text{ cm}$, un ángulo del centro mide $\alpha = 60^\circ$. Calcula la longitud lineal del arco $\overset{\frown}{AB}$ subtendido.'
  pasos:
  - 'Paso 1: Calcular la fracción del giro completo: $\frac{\alpha}{360^\circ} = \frac{60^\circ}{360^\circ} = \frac{1}{6}$.'
  - 'Paso 2: Calcular el perímetro de la circunferencia completa: $P = 2\pi r = 2\pi(12) = 24\pi\text{ cm}$.'
  - 'Paso 3: Multiplicar la fracción por el perímetro total: $s = \frac{1}{6} \cdot 24\pi = 4\pi\text{ cm}$.'
  - 'Paso 4: Verificación alternativa con la fórmula directa: $s = \frac{60^\circ \cdot \pi \cdot 12}{180^\circ} = \frac{720\pi}{180} = 4\pi\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la longitud métrica lineal s de un arco de circunferencia de radio r y ángulo central α en grados?
  choices:
  - text: s = (α / 360°) · 2πr.
    is_correct: true
  - text: s = (α / 360°) · πr².
    is_correct: false
  - text: s = α · 2πr.
    is_correct: false
  - text: s = (α / 180°) · πr².
    is_correct: false
  explanation: La alternativa correcta es 's = (α / 360°) · 2πr.' El arco es la fracción $(\alpha / 360^\circ)$ del perímetro de la circunferencia ($2\pi r$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un arco mide 5π cm en una circunferencia de radio 10 cm, ¿cuánto mide su ángulo del centro?
  choices:
  - text: 90°.
    is_correct: true
  - text: 45°.
    is_correct: false
  - text: 60°.
    is_correct: false
  - text: 120°.
    is_correct: false
  explanation: 'La alternativa correcta es ''90°.'' Perímetro total $2\pi(10) = 20\pi$ cm. Fracción: $\frac{5\pi}{20\pi} = \frac{1}{4}$ de vuelta $\implies \frac{1}{4} \times 360^\circ = 90^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el radio $r$ y la medida del ángulo del centro $\alpha$.

  2. Calcular la fracción de circunferencia correspondiente: $\alpha / 360^\circ$.

  3. Multiplicar dicha fracción por la longitud de la circunferencia completa: $s = (\alpha / 360^\circ) \cdot 2\pi r$.

  4. Simplificar algebraicamente manteniendo el factor $\pi$ o reemplazando según solicite el ejercicio.

  '
errores_correccion: '- **Error común 1:** Multiplicar por $\pi r^2$ en lugar de $2\pi r$. **Corrección:** $\pi r^2$ es para el área del sector; el arco es una longitud lineal y usa el perímetro $2\pi r$.

  - **Error común 2:** Confundir la longitud métrica en cm con los grados sexagesimales del ángulo. **Corrección:** La apertura es en grados, la longitud es en cm.

  '
ejemplos:
- tipo: A
  titulo: Arco de 45°
  enunciado: En una circunferencia de radio $8\text{ cm}$, ¿cuál es la longitud de un arco correspondiente a un ángulo central de $45^\circ$?
  alternativas:
  - text: $2\pi\text{ cm}$.
    is_correct: true
  - text: $4\pi\text{ cm}$.
    is_correct: false
  - text: $8\pi\text{ cm}$.
    is_correct: false
  - text: \pi\text{ cm}.
    is_correct: false
  explicacion: $s = \frac{45^\circ}{360^\circ} \cdot 2\pi(8) = \frac{1}{8} \cdot 16\pi = 2\pi\text{ cm}$.
- tipo: B
  titulo: Comparación arco y cuerda
  enunciado: ¿Es la longitud de un arco siempre estrictamente mayor que la cuerda recta que une sus mismos extremos?
  respuesta: Sí
  explicacion: Sí. La línea recta es la distancia más corta entre dos puntos; por lo tanto, el arco curvo es siempre más largo que la cuerda recta.
errores_frecuentes:
- '''Usar la fórmula del área del círculo para calcular la longitud del arco.'''
- '''Confundir la medida angular en grados con la longitud métrica en cm.'''
- '''Olvidar dividir entre $360^\circ$ al relacionar el ángulo con la vuelta completa.'''
afirmaciones_verdaderas:
- '''Un arco es una porción continua de la curva de una circunferencia.'''
- '''La longitud del arco se calcula mediante $s = \frac{\alpha}{360^\circ} \cdot 2\pi r$.'''
- '''La medida angular de un arco coincide exactamente con la medida de su ángulo del centro correspondiente.'''
al_terminar_debes_poder: '**QUÉ:** Calcular la longitud lineal de arcos y relacionarlos con sus ángulos del centro.


  **CÓMO:** Empleando la proporción de escala $s = \frac{\alpha}{360^\circ} \cdot 2\pi r = \frac{\alpha \pi r}{180^\circ}$.


  ![Síntesis de arco](/static/img/nodos/definicion-de-arco-de-circunferencia-resumen.svg)

  '
