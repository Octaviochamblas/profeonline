semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.INCENTRO_INTERSECCION
resumen_inicial: El incentro ($I$) es el punto notable de un triángulo donde se intersectan
  sus tres bisectrices interiores. En cualquier triángulo (sea acutángulo, rectángulo
  u obtusángulo), el incentro siempre se ubica estrictamente en el interior.
explicacion_simple: '![Incentro de un Triángulo](/static/img/nodos/definicion-de-incentro-como-punto-de-interseccion-de-las-bisectrices-interiores-intro.svg)


  Si trazas las 3 bisectrices interiores de un triángulo, las tres líneas se cruzan
  exactamente en un único punto común llamado **incentro** ($I$):


  - **Siempre queda adentro**: Sin importar si el triángulo es agudo, recto o muy
  abierto (obtuso), el incentro $I$ **siempre está en el interior**.

  - **Bastan dos bisectrices**: Con solo cruzar 2 bisectrices ya encuentras el punto
  $I$; la tercera pasará obligatoriamente por ahí.

  - **Ángulo en el incentro**: El ángulo que forman dos bisectrices al cruzarse en
  $I$ siempre es obtuso y mide $90^\circ + \frac{\alpha}{2}$.

  '
explicacion_formal: '### Definición formal y teorema de concurrencia

  En todo triángulo $\Delta ABC$, las tres bisectrices interiores concurren en un
  único punto interior $I$, denominado **incentro**:


  $$\{I\} = b_a \cap b_b \cap b_c$$


  ### Desglose simbólico y geométrico

  - $I$: Incentro del triángulo.

  - Coordenadas baricéntricas: $I = \frac{aA + bB + cC}{a + b + c}$.

  - Existencia universal: Concurren siempre en un punto interior para todo tipo de
  triángulos.


  ### Síntesis didáctica

  El incentro es el centro de simetría angular del triángulo y el punto de partida
  para inscribir la circunferencia tangente interior.'
definiciones_clave: '- **Incentro ($I$)**: Punto de concurrencia de las tres bisectrices
  interiores de un triángulo.

  - **Concurrencia**: Propiedad geométrica por la cual tres o más rectas se intersectan
  en un único punto común.

  - **Ángulo en el incentro**: Ángulo obtuso formado por dos bisectrices que se cortan
  en $I$.

  '
propiedades_relaciones: '- **Concurrencia de bisectrices**: $b_\alpha \cap b_\beta
  \cap b_\gamma = \{I\}$.

  - **Interioridad universal**: $I \in \text{Int}(\Delta ABC)$ en todo triángulo acutángulo,
  rectángulo y obtusángulo.

  - **Relación angular**: $\angle BIC = 90^\circ + \frac{\angle A}{2}$, $\angle AIC
  = 90^\circ + \frac{\angle B}{2}$, $\angle AIB = 90^\circ + \frac{\angle C}{2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Incentro](/static/img/nodos/definicion-de-incentro-como-punto-de-interseccion-de-las-bisectrices-interiores-ejemplos.svg)


    En un triángulo $ABC$, el ángulo en el vértice $A$ mide $80^\circ$. Las bisectrices
    interiores de los vértices $B$ y $C$ se cortan en el incentro $I$. Calcula la
    medida del ángulo $\angle BIC$.

    '
  pasos:
  - 'Paso 1: Identificar los datos dados: $\angle A = 80^\circ$ y el punto $I$ es
    el incentro.'
  - 'Paso 2: Aplicar la fórmula del ángulo en el incentro: $\angle BIC = 90^\circ
    + \frac{\angle A}{2}$.'
  - 'Paso 3: Sustituir el valor del ángulo: $\angle BIC = 90^\circ + \frac{80^\circ}{2}
    = 90^\circ + 40^\circ = 130^\circ$.'
  - 'Paso 4: Concluir que el ángulo $\angle BIC$ formado en el incentro mide $130^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubica el incentro en un triángulo obtusángulo?
  choices:
  - text: Siempre en el interior del triángulo
    is_correct: true
  - text: En el exterior del triángulo
    is_correct: false
  - text: En el vértice del ángulo obtuso
    is_correct: false
  - text: En el punto medio del lado mayor
    is_correct: false
  explanation: El incentro se ubica siempre en el interior del triángulo, sin importar
    si este es acutángulo, rectángulo u obtusángulo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el ángulo en el vértice A de un triángulo mide 60°, ¿cuánto mide el
    ángulo formado en el incentro ∠BIC?
  choices:
  - text: $120^\circ$
    is_correct: true
  - text: $60^\circ$
    is_correct: false
  - text: $90^\circ$
    is_correct: false
  - text: $150^\circ$
    is_correct: false
  explanation: El ángulo mide $120^\circ$, ya que $\angle BIC = 90^\circ + \frac{60^\circ}{2}
    = 90^\circ + 30^\circ = 120^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Trazar las bisectrices interiores de al menos dos vértices del triángulo.'
- 'Paso 2: Marcar el punto de intersección de dichas líneas como el incentro $I$.'
- 'Paso 3: Verificar que $I$ se encuentra en la región interior del triángulo.'
- 'Paso 4: Si se requiere un ángulo en $I$, calcularlo mediante $\angle BIC = 90^\circ
  + \frac{\angle A}{2}$.'
errores_correccion: 'No confundas el incentro con el ortocentro o circuncentro: el
  incentro NUNCA es exterior, siempre está dentro del triángulo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo $ABC$ el ángulo $\angle A = 100^\circ$, ¿cuál es la
    medida del ángulo $\angle BIC$ en el incentro?
  alternativas:
  - $140^\circ$
  - $100^\circ$
  - $130^\circ$
  respuesta: $140^\circ$
  solucion_pasos:
  - $\angle BIC = 90^\circ + \frac{100^\circ}{2} = 90^\circ + 50^\circ = 140^\circ$.
- titulo: Ejemplo 2
  enunciado: ¿Cuántas bisectrices interiores es necesario trazar como mínimo para
    ubicar con certeza el incentro de un triángulo?
  alternativas:
  - $2\text{ bisectrices}$
  - $3\text{ bisectrices}$
  - $1\text{ bisectriz}$
  respuesta: $2\text{ bisectrices}$
  solucion_pasos:
  - Dos rectas no paralelas se cortan en un único punto; por el teorema de concurrencia,
    la tercera bisectriz pasará obligatoriamente por dicho punto.
- titulo: ¿El incentro de un triángulo puede encontrarse en el exterior de la figura?
  respuesta: 'No'
  solucion_pasos:
  - No, el incentro siempre está en el interior en todo tipo de triángulos.
- titulo: ¿El incentro es el punto donde se intersectan las tres bisectrices interiores?
  respuesta: Sí
  solucion_pasos:
  - Sí, esa es la definición geométrica fundamental del incentro.
errores_frecuentes:
- Pensar que en triángulos obtusángulos el incentro se sale del triángulo.
- Confundir las bisectrices con las alturas o simetrales.
- Olvidar la fórmula del ángulo en el incentro y asumir que $\angle BIC = 180^\circ
  - \angle A$.
- Creer que el incentro coincide con el baricentro en triángulos escalenos.
- Confundir el incentro (centro inscrito) con el circuncentro (centro circunscrito).
afirmaciones_verdaderas:
- El incentro es el punto de concurrencia de las tres bisectrices interiores de un
  triángulo.
- En todo triángulo el incentro se ubica estrictamente en la región interior.
al_terminar_debes_poder: '**QUÉ:** Definir, identificar y calcular ángulos asociados
  al incentro de un triángulo.


  **CÓMO:** Determinando el punto de corte de las bisectrices interiores y aplicando
  la relación angular $\angle BIC = 90^\circ + \frac{\angle A}{2}$.


  ![Resumen de Incentro](/static/img/nodos/definicion-de-incentro-como-punto-de-interseccion-de-las-bisectrices-interiores-resumen.svg)

  '
