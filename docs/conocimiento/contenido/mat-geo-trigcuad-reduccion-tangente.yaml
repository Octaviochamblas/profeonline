semantic_id: MAT.GEO.TRIG_CUADRANTES.REDUCCION_TANGENTE
resumen_inicial: 'Reducción de la tangente al primer cuadrante usando ángulo de referencia:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: La tangente de cualquier ángulo puede obtenerse a partir de la
  tangente de su ángulo de referencia (agudo), ajustando el signo según el cuadrante
  (positivo en I y III, negativo en II y IV).
explicacion_formal: '![Reducción de la tangente al primer cuadrante](/static/img/geometria/trigonometria/trigcuad-reduccion-tangente.svg)


  ### Definición formal


  Si $\alpha$ es el ángulo de referencia de $\theta$, entonces $|\tan\theta|=\tan\alpha$,
  y el signo de $\tan\theta$ se determina según el cuadrante de $\theta$ (positivo
  en I y III, negativo en II y IV).


  ### Desarrollo didáctico


  Para $\theta=120°$ (segundo cuadrante), el ángulo de referencia es $\alpha=60°$.
  Como la tangente es negativa en el segundo cuadrante, $\tan120°=-\tan60°=-\sqrt3$.'
definiciones_clave: '- **Reducción de la tangente al primer cuadrante usando ángulo
