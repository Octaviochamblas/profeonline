procedimiento:
- 'Paso 1: Identifica las coordenadas del punto P(x,y) que se desea rotar 180° alrededor
  del origen.'
- 'Paso 2: Invierte el signo de la abscisa: -x.'
- 'Paso 3: Invierte el signo de la ordenada: -y, obteniendo P''(-x,-y).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con regla de rotación de 180° en torno al origen.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de regla de rotación de 180° en torno al origen
    para determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
