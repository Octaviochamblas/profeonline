semantic_id: MAT.GEO.ROTACION_PLANO.REGLA_180_ORIGEN
resumen_inicial: 'Regla de rotación de 180° en torno al origen: conceptos, teoremas,
  propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'Rotar un punto 180° es como darle ''media vuelta completa'' alrededor
  del centro: termina exactamente en el lado opuesto.'
explicacion_formal: '![Regla de rotación de 180° en torno al origen](/static/img/geometria/isometrias/rotacion-regla-180-origen.svg)


  ### Definición formal


  La rotación de $180°$ en torno al origen transforma $P(x,y)$ en $P''(-x,-y)$: se
  invierte el signo de ambas coordenadas. Esta regla es idéntica en resultado a la
  simetría central respecto del origen, ya que ambos sentidos de giro (horario o antihorario)
  llegan al mismo punto final tras 180°.


  ### Desarrollo didáctico


  En la figura, el punto $P(3,2)$ rotado 180° alrededor del origen se transforma en
  $P''(-3,-2)$: ambas coordenadas cambian de signo.'
definiciones_clave: '- **Regla de rotación de 180° en torno al origen**: Elemento
