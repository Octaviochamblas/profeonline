resumen_inicial: 'La amortización de un préstamo a cuota fija (método francés) calcula
  el pago periódico constante $R$ necesario para cancelar una deuda $D_0$ a una tasa
  compuesta $i$ en $n$ cuotas: $R = D_0 \cdot \left[ \frac{i \cdot (1 + i)^n}{(1 +
  i)^n - 1} \right]$.'
explicacion_simple: Cuando pides un crédito o hipoteca a cuota fija, la cuota mensual
  se calcula con la fórmula de amortización. Una parte de cada cuota paga los intereses
  del mes y la otra parte sirve para reducir el saldo original de la deuda.
explicacion_formal: 'Para una deuda inicial $D_0$ a reembolsar en $n$ cuotas periódicas
  iguales $R$ a una tasa $i$, la **Cuota de Amortización Francesa $R$** satisface
  el valor presente:


  $$D_0 = R \cdot \left[ \frac{1 - (1 + i)^{-n}}{i} \right] \implies R = D_0 \cdot
  \left[ \frac{i \cdot (1 + i)^n}{(1 + i)^n - 1} \right]$$


  **Descomposición de la cuota:**

  - $R = \text{Interés del período } (D_{k-1} \cdot i) + \text{Amortización del capital
  real} (A_k)$.'
definiciones_clave: '- **Amortización de préstamo**: Valor de la cuota fija $R = D_0
  \cdot \left[ \frac{i \cdot (1 + i)^n}{(1 + i)^n - 1} \right]$.'
propiedades_relaciones: '- **Composición de cuota**: Cada pago cubre los intereses
  del período más una fracción amortizadora del principal.'
ejemplo_guiado:
  enunciado: Un préstamo de $D_0 = \$1.000.000$ se reembolsa en $2$ cuotas anuales
    iguales a una tasa compuesta del $10\%$ anual. Calcule el valor de cada cuota
    $R$.
  pasos:
  - 'Paso 1: Identificar $D_0 = 1.000.000$, $i = 0,10$ y $n = 2$.'
  - 'Paso 2: Calcular $1,10^2 = 1,21$.'
  - 'Paso 3: Aplicar la fórmula del factor de cuota: $R = 1.000.000 \cdot \left[ \frac{0,10
    \cdot 1,21}{1,21 - 1} \right] = 1.000.000 \cdot \left[ \frac{0,121}{0,21} \right]
    \approx 1.000.000 \cdot 0,57619 = 576.190$.'
  - 'Conclusión: El valor de cada cuota anual es \$576.190.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la cuota fija R de amortización de un
    préstamo D0 (sistema francés)?
  choices:
  - text: R = D0 · [(i · (1 + i)^n) / ((1 + i)^n - 1)]
    is_correct: true
  - text: R = D0 / n
    is_correct: false
  - text: R = D0 · (1 + i)^n
    is_correct: false
  - text: R = D0 · i · n
    is_correct: false
  explanation: La alternativa correcta es 'R = D0 · [(i · (1 + i)^n) / ((1 + i)^n
    - 1)]'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el préstamo de $1.000.000 al 10% en 2 cuotas,
    ¿cuál fue el valor de la cuota R?
  choices:
  - text: 576.190 $
    is_correct: true
  - text: 500.000 $
    is_correct: false
  - text: 550.000 $
    is_correct: false
  - text: 600.000 $
    is_correct: false
  explanation: La alternativa correcta es '576.190 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la cuota constante de
  amortización de un préstamo $R = D_0 \cdot \left[ \frac{i \cdot (1 + i)^n}{(1 +
  i)^n - 1} \right]$ descomponiendo interés y capital.
semantic_id: MAT.NUM.INTERES_COMPUESTO.AMORTIZACION_PRESTAMO
procedimiento:
- 'Paso 1: Identificar las variables financieras ($C, i, n, M, I, R$) e igualar la
  tasa al período de capitalización.'
- 'Paso 2: Aplicar la fórmula exponencial de capitalización $M = C \cdot (1 + i)^n$
  o su variante correspondiente.'
- 'Paso 3: Resolver numéricamente o mediante logaritmos y verificar la coherencia
  económica.'
errores_correccion: '- **Error 1: Calcular el interés compuesto multiplicando el tiempo
  por la tasa en forma lineal ($C \cdot i \cdot n$).** **Cómo corregirlo:** En régimen
  compuesto el factor es exponencial $(1 + i)^n$, NO lineal.


  - **Error 2: No ajustar la tasa de interés a la frecuencia de capitalización (ej:
  usar tasa anual en capitalización mensual).** **Cómo corregirlo:** La tasa DEBE
  dividirse entre el número de períodos del año ($i = r / m$) y el tiempo multiplicarse
  ($n = m \cdot t$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_COMPUESTO.AMORTIZACION_PRESTAMO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés compuesto.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización exponencial.
  alternativas:
  - Cumple el modelo
  - No cumple
  - Indeterminado
  respuesta: Cumple el modelo
  solucion_pasos:
  - Demostración formal por $M = C(1+i)^n$.
- titulo: ¿Supera el interés compuesto al simple para t > 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, debido al efecto acumulativo de la capitalización de intereses.
- titulo: ¿Se requiere logaritmo para despejar el número de períodos n?
  respuesta: Sí
  solucion_pasos:
  - Sí, para bajar el exponente $n$ mediante la propiedad logarítmica.
errores_frecuentes:
- Usar la fórmula lineal del interés simple $C \cdot i \cdot t$ para resolver problemas
  de capitalización compuesta.
- No dividir la tasa de interés anual entre 12 cuando el período de capitalización
  es mensual.
- Omitir restar el capital inicial $C$ al monto acumulado final $M$ al calcular únicamente
  el interés ganado.
- Declarar que dos cuotas de interés compuesto acumulado crecen en forma de progresión
  aritmética constante.
- Sumar directamente las cuotas de amortización sin descontar la tasa de interés en
  el valor presente.
afirmaciones_verdaderas:
- El interés compuesto se caracteriza porque los intereses de cada período se suman
  al capital para generar nuevos intereses.
- El monto acumulado en régimen compuesto sigue un modelo de función exponencial $M
  = C \cdot (1 + i)^n$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
