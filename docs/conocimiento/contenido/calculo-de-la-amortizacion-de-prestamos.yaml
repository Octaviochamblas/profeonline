semantic_id: MAT.NUM.INTERES_COMPUESTO.AMORTIZACION_PRESTAMO
resumen_inicial: 'Cálculo de la amortización de préstamos: concepto y propiedades
  fundamentales en Interés compuesto.'
explicacion_simple: ¿Has pagado una cuota de 300 lucas por tu casa y al mirar la deuda
  ves que solo bajó 50 lucas? No te están robando, es el proceso de amortización.
  Una parte es para el banco, otra parte achica la deuda.
explicacion_formal: 'Cuando pides un préstamo bancario (como un hipotecario) y pagas
  una cuota fija mensual, ese dinero se divide internamente en dos pedazos:


  1. **Interés:** Es el costo por usar el dinero del banco ese mes. Se calcula multiplicando
  el Saldo Adeudado actual por la tasa de interés.

  2. **Amortización:** Es lo que sobra de la cuota después de pagar el interés. Este
  dinero **resta** la deuda real que tienes.


  **Ecuación de la Cuota:**

  $$\text{Cuota} = \text{Amortización} + \text{Interés}$$


  Al principio de un crédito de 20 años, la deuda es tan grande que casi toda la cuota
  se va en pagar puros intereses (el banco se asegura su ganancia primero) y la amortización
  es ínfima. Al final del crédito, ocurre lo contrario.'
definiciones_clave: '- **Cálculo de la amortización de préstamos**: Elemento central
  dentro del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo de la amortización de préstamos.'
