semantic_id: MAT.NUM.INTERES_COMPUESTO.AMORTIZACION_PRESTAMO
resumen_inicial: 'Cálculo de la amortización de préstamos: concepto y propiedades fundamentales
  en Interés compuesto.'
explicacion_simple: ¿Has pagado una cuota de 300 lucas por tu casa y al mirar la deuda ves
  que solo bajó 50 lucas? No te están robando, es el proceso de amortización. Una parte es
  para el banco, otra parte achica la deuda.
explicacion_formal: 'Cuando pides un préstamo bancario (como un hipotecario) y pagas una cuota
  fija mensual, ese dinero se divide internamente en dos pedazos:


  1. **Interés:** Es el costo por usar el dinero del banco ese mes. Se calcula multiplicando
  el Saldo Adeudado actual por la tasa de interés.

  2. **Amortización:** Es lo que sobra de la cuota después de pagar el interés. Este dinero
  **resta** la deuda real que tienes.


  **Ecuación de la Cuota:**

  $$\text{Cuota} = \text{Amortización} + \text{Interés}$$


  Al principio de un crédito de 20 años, la deuda es tan grande que casi toda la cuota se
  va en pagar puros intereses (el banco se asegura su ganancia primero) y la amortización
  es ínfima. Al final del crédito, ocurre lo contrario.'
definiciones_clave: '- **Cálculo de la amortización de préstamos**: Elemento central dentro
  del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo de la amortización de préstamos.'
ejemplo_guiado:
  enunciado: Debes 6.000.000 de pesos. El interés de este mes es el 1,5% de esa deuda. Pagas
    una cuota de 200.000 pesos. Calcula cuánto se redujo realmente tu deuda.
  pasos:
  - 'Calculo el interés del mes: 1,5% de 6.000.000 es igual a 90.000.'
  - Identifico que de los 200.000 pagados, 90.000 se destinan a pagar el interés.
  - 'Calculo la amortización: 200.000 menos 90.000 es igual a 110.000. La deuda bajó realmente
    en 110.000, quedando en 5.890.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con cálculo de la amortización de
    préstamos?
  choices:
  - text: Identificar correctamente la relación de interés compuesto
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de interés compuesto.
    Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de cálculo de la amortización de préstamos, ¿qué
    paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
    clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconoce que Cuota Fija NO significa que la deuda baje esa misma cantidad.'
- 'Paso 2: Entiende que $Amortizacion = Cuota - Interes$.'
- 'Paso 3: Solo la ''Amortización'' disminuye el Saldo Insoluto (la deuda real).'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de la amortización
  de préstamos.
ejemplos:
- titulo: Descomponiendo la cuota
  enunciado: Debes $10.000.000. El interés de este mes es el 1% de esa deuda. Pagas una cuota
    de $300.000. ¿Cuánto se redujo realmente tu deuda?
  solucion_pasos:
  - 'Calculamos el interés del mes: 1% de $10.000.000 = $100.000.'
  - La cuota es de $300.000. De esos, $100.000 son para pagar el interés.
  - 'Lo que sobra es la Amortización: $300.000 - $100.000 = $200.000.'
  - Tu deuda bajó en $200.000. Ahora debes $9.800.000.
- titulo: Ejemplo 2
  enunciado: Debes 4.000.000 de pesos, el interés del mes es 2% y pagas una cuota de 150.000
    pesos. ¿Cuánto amortizas realmente?
  alternativas:
  - '70.000'
  - '150.000'
  - '80.000'
  respuesta: '70.000'
  solucion_pasos:
  - El interés es 4.000.000 por 0,02, o sea 80.000; la amortización es 150.000 menos 80.000,
    o sea 70.000.
- titulo: Ejemplo 3
  enunciado: Debes 1.000.000 de pesos, el interés del mes es 3% y pagas una cuota de 50.000
    pesos. ¿Cuánto amortizas realmente?
  alternativas:
  - '20.000'
  - '30.000'
  - '50.000'
  respuesta: '20.000'
  solucion_pasos:
  - El interés es 1.000.000 por 0,03, o sea 30.000; la amortización es 50.000 menos 30.000,
    o sea 20.000.
- titulo: ¿Al principio de un crédito largo, casi toda la cuota se destina a pagar intereses?
  respuesta: Sí
  solucion_pasos:
  - Porque la deuda inicial es grande, generando más interés, y la amortización real es pequeña
    al comienzo.
errores_frecuentes:
- Restarle el valor completo de la cuota al total de la deuda (ignorando que el banco cobra
  intereses).
- Creer que la palabra 'Amortizar' es sinónimo de 'Pagar Intereses'.
- Restar el valor completo de la cuota al total de la deuda, ignorando que una parte se destina
  a pagar intereses.
- Creer que la palabra amortizar es sinónimo de pagar intereses, cuando en realidad significa
  reducir la deuda real.
- Calcular el interés del mes sobre el monto original del préstamo en vez de sobre el saldo
  adeudado actual.
afirmaciones_verdaderas:
- La propiedad de cálculo de la amortización de préstamos preserva la consistencia lógica.
- En un préstamo con cuota fija, la parte de la cuota que efectivamente reduce la deuda, la
  amortización, es igual a la cuota total menos el interés del periodo.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de la amortización
  de préstamos.
fuente: Currículum Nacional MINEDUC.
