procedimiento:
- 'Paso 1: Reconoce que Cuota Fija NO significa que la deuda baje esa misma cantidad.'
- 'Paso 2: Entiende que $Amortizacion = Cuota - Interes$.'
- 'Paso 3: Solo la ''Amortización'' disminuye el Saldo Insoluto (la deuda real).'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de
  la amortización de préstamos.
ejemplos:
- titulo: Descomponiendo la cuota
  enunciado: Debes $10.000.000. El interés de este mes es el 1% de esa deuda. Pagas
    una cuota de $300.000. ¿Cuánto se redujo realmente tu deuda?
  solucion_pasos:
  - 'Calculamos el interés del mes: 1% de $10.000.000 = $100.000.'
  - La cuota es de $300.000. De esos, $100.000 son para pagar el interés.
  - 'Lo que sobra es la Amortización: $300.000 - $100.000 = $200.000.'
  - Tu deuda bajó en $200.000. Ahora debes $9.800.000.
errores_frecuentes:
- Restarle el valor completo de la cuota al total de la deuda (ignorando que el banco
  cobra intereses).
- Creer que la palabra 'Amortizar' es sinónimo de 'Pagar Intereses'.
afirmaciones_verdaderas:
- La propiedad de cálculo de la amortización de préstamos preserva la consistencia
  lógica.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de la
  amortización de préstamos.
