semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.COMPARACION_GRAFICAS
resumen_inicial: 'La comparación entre la función potencia base $f(x) = x^n$ y su transformación $g(x) = a(x - h)^n + k$ sintetiza la descomposición secuencial de transformaciones geométricas: escala y reflexión por $a$, traslación horizontal por $h$ y traslación vertical por $k$.'
explicacion_simple: "![La comparación entre la función potencia base $f(x) = x^n$ y su transformación $g(x) = a(x - h)^n + k$ sintetiza la descomposición secuencial de transformaciones geométricas: escala y reflexión por $a$, traslación horizontal por $h$ y traslación vertical por $k$](/static/img/nodos/comparacion-entre-la-funcion-potencia-base-y-su-transformacion-grafica-intro.svg)\n\n\nCualquier función potencia compleja $g(x) = a(x - h)^n + k$ se puede entender como una **receta de 3 pasos a partir de la curva básica $f(x) = x^n$**:\n\n1. **Paso 1 (Forma y Orientación - Parámetro $a$):**\n   - Si $|a| > 1$: La curva se **estira** (más cerrada).\n   - Si $0 < |a| < 1$: La curva se **comprime** (más ancha).\n   - Si $a < 0$: La curva se **refleja de cabeza** respecto al eje $X$.\n2. **Paso 2 (Desplazamiento Horizontal - Parámetro $h$):**\n   - Se desliza $h$ unidades a la derecha o izquierda.\n3. **Paso 3 (Desplazamiento Vertical - Parámetro $k$):**\n   - Se desliza $k$ unidades hacia\
  \ arriba o abajo, fijando el vértice definitivo en **$(h, k)$**."
explicacion_formal: 'Sea $f(x) = x^n$ la función potencia canónica. La función genérica transformada $g(x) = a(x - h)^n + k$ se obtiene formalmente mediante la composición estricta de tres operadores afines en el plano $\mathbb{R}^2$:

  $$g = \mathcal{T}_{(0, k)} \circ \mathcal{T}_{(h, 0)} \circ \mathcal{H}_{(O_y, a)}(f)$$


  **Tabla comparativa de invariantes y variantes**:

  - **Invariantes**: El tipo de simetría fundamental (axial en pares, central en impares) y la topología de las ramas.

  - **Variantes**: Coordenadas del centro $(0, 0) \to (h, k)$, eje de simetría $x = 0 \to x = h$, y extremos del recorrido $[0, +\infty[ \to [k, +\infty[$ (o $]-\infty, k]$).'
definiciones_clave: '- **Función canónica base**: Prototipo $f(x) = x^n$ no trasladado ni escalado.

  - **Descomposición geométrica secuencial**: Proceso analítico para descomponer $g(x)$ en escala, reflexión y traslaciones.'
propiedades_relaciones: '- **Jerarquía de transformaciones**: Las escalas/reflexiones multiplican a la potencia antes de sumar las traslaciones exteriores.'
ejemplo_guiado:
  enunciado: '![Ejemplo La comparación entre la función potencia base $f(x) = x^n$ y su transformación $g(x) = a(x - h)^n + k$ sintetiza la descomposición secuencial de transformaciones geométricas: escala y reflexión por $a$, traslación horizontal por $h$ y traslación vertical por $k$](/static/img/nodos/comparacion-entre-la-funcion-potencia-base-y-su-transformacion-grafica-ejemplos.svg)



    Describe la secuencia completa de transformaciones para obtener $g(x) = -2(x - 3)^4 + 5$ a partir de la función base $f(x) = x^4$:'
  pasos:
  - 'Paso 1: **Escala y Reflexión ($a = -2$):** Dilatación vertical de factor $2$ combinada con reflexión respecto al eje $X$ (las ramas apuntan hacia abajo).

    - Ecuación intermedia: $y = -2x^4$.'
  - 'Paso 2: **Traslación horizontal ($h = 3$):** Desplazamiento rígido de $3$ unidades hacia la derecha.

    - Ecuación intermedia: $y = -2(x - 3)^4$.'
  - 'Paso 3: **Traslación vertical ($k = 5$):** Desplazamiento de $5$ unidades hacia arriba, ubicando el vértice en **$(3, 5)$**.

    - Ecuación final: $g(x) = -2(x - 3)^4 + 5$ con recorrido **$]-\infty, 5]$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué secuencia de transformaciones convierte a $f(x) = x^3$ en $g(x) = 0{,}5(x + 4)^3 - 1$?
  choices:
  - text: Contracción vertical de factor 0,5, traslación 4 a la izquierda y 1 hacia abajo
    is_correct: true
  - text: Dilatación vertical de factor 0,5, traslación 4 a la derecha y 1 hacia arriba
    is_correct: false
  - text: Reflexión en X, traslación 4 a la izquierda y 1 hacia abajo
    is_correct: false
  - text: Contracción vertical de factor 0,5, traslación 4 a la derecha y 1 hacia abajo
    is_correct: false
  explanation: La alternativa correcta es 'Contracción vertical de factor 0,5, traslación 4 a la izquierda y 1 hacia abajo'. $a = 0{,}5$ contrae, $h = -4$ mueve a la izquierda y $k = -1$ baja.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Dada la gráfica con vértice en (1, -6), ramas hacia arriba y más estrecha que $x^2$, ¿cuál fórmula podría representarla?
  choices:
  - text: y = 3(x - 1)² - 6
    is_correct: true
  - text: y = -3(x - 1)² - 6
    is_correct: false
  - text: y = 0,3(x + 1)² - 6
    is_correct: false
  - text: y = 3(x + 1)² + 6
    is_correct: false
  explanation: La alternativa correcta es 'y = 3(x - 1)² - 6'. Tiene $a = 3 > 1$ (más estrecha y hacia arriba), $h = 1$ y $k = -6$ (vértice en (1, -6)).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la función potencia canónica base $f(x) = x^n$.'
- 'Paso 2: Analizar el factor $a$: determinar si hay dilatación ($|a| > 1$), contracción ($0 < |a| < 1$) o reflexión ($a < 0$).'
- 'Paso 3: Identificar $h$ e interpretar la traslación horizontal.'
- 'Paso 4: Identificar $k$ e interpretar la traslación vertical, estableciendo el vértice final en $(h, k)$.'
errores_correccion: '- **Error común:** Confundir el orden de aplicación de las transformaciones geométricas.

  - **Cómo corregirlo:** La transformación se aplica **de adentro hacia afuera**: primero la escala por $a$, luego la traslación horizontal $h$ y finalmente la vertical $k$.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación completa'
  enunciado: 'En $g(x) = -4(x - 6)^3 + 2$, los parámetros son:'
  alternativas:
  - a = -4, h = 6, k = 2
  - a = 4, h = -6, k = 2
  - a = -4, h = -6, k = -2
  - a = 2, h = 6, k = -4
  respuesta: a = -4, h = 6, k = 2
  solucion_pasos:
  - 'Paso 1: $a = -4$, $h = 6$, $k = 2$.'
- titulo: 'Ejemplo 2: Reconstrucción de fórmula'
  enunciado: 'La curva $y = x^4$ se refleja en X, se contrae a la mitad y se traslada 3 a la izquierda. Su fórmula es:'
  alternativas:
  - y = -0,5(x + 3)⁴
  - y = -2(x + 3)⁴
  - y = -0,5(x - 3)⁴
  - y = 0,5(x + 3)⁴
  respuesta: y = -0,5(x + 3)⁴
  solucion_pasos:
  - 'Paso 1: $a = -0{,}5$, $h = -3 \implies y = -0{,}5(x + 3)^4$.'
- titulo: 'Ejemplo 3: Vértice de transformación'
  enunciado: 'El punto clave de $y = 8(x - 5)^6 - 10$ es:'
  alternativas:
  - Vértice (5, -10)
  - Vértice (-5, -10)
  - Vértice (5, 10)
  - Inflexión (5, -10)
  respuesta: Vértice (5, -10)
  solucion_pasos:
  - 'Paso 1: Par con vértice en $(h, k) = (5, -10)$.'
- titulo: 'Ejemplo 4: Recorrido tras todas las transformaciones'
  enunciado: 'El recorrido de $f(x) = 2(x + 1)^4 + 7$ es:'
  alternativas:
  - '[7, +inf['
  - '[-1, +inf['
  - '[2, +inf['
  - R
  respuesta: '[7, +inf['
  solucion_pasos:
  - 'Paso 1: $a = 2 > 0$ y $k = 7 \implies \operatorname{Rec} = [7, +\infty[$.'
errores_frecuentes:
- Confundir parámetros de forma (a) con parámetros de posición (h, k).
- Invertir la traslación horizontal al escribir la fórmula.
- No deducir el recorrido directamente desde k y el signo de a.
afirmaciones_verdaderas:
- Cualquier función g(x) = a(x - h)ⁿ + k se obtiene aplicando escala, reflexión y traslación a f(x) = xⁿ.
- El parámetro a modifica la abertura y sentido, mientras que (h, k) fija la posición del centro.
al_terminar_debes_poder: '**QUÉ:** Comparar y transformar rigurosamente una función potencia base f(x) = xⁿ en g(x) = a(x - h)ⁿ + k.


  **CÓMO:** Desglosando secuencialmente los efectos de escala/reflexión por a y traslación vectorial por (h, k).


