semantic_id: MAT.GEO.PITAGORAS.APLICACION_GEOMETRICA
resumen_inicial: 'Aplicación del teorema de Pitágoras para calcular diagonales y distancias
  en figuras geométricas: conceptos, teoremas, propiedades geométricas y cálculo en
  Perímetros, Áreas y Teoremas.'
explicacion_simple: 'El teorema de Pitágoras no se limita a triángulos aislados: cualquier
  figura que contenga (o pueda dividirse en) un triángulo rectángulo puede aprovecharlo
  para calcular diagonales o distancias.'
explicacion_formal: '![Aplicación geométrica: diagonal de un rectángulo](/static/img/geometria/areas-pitagoras/pitagoras-aplicacion-geometrica.svg)


  ### Definición formal


  En un rectángulo de lados $a$ y $b$, la diagonal $d$ cumple $d^2=a^2+b^2$, ya que
  la diagonal, junto con dos lados consecutivos, forma un triángulo rectángulo.


  ### Desarrollo didáctico


  Un rectángulo de lados 6 y 8 tiene diagonal $d=\sqrt{6^2+8^2}=\sqrt{36+64}=\sqrt{100}=10$,
  aplicando exactamente la misma terna pitagórica 6-8-10.'
definiciones_clave: '- **Aplicación del teorema de Pitágoras para calcular diagonales
  y distancias en figuras geométricas**: Elemento o propiedad fundamental en el estudio
