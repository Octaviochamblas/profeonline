- titulo: ¿Se cumple siempre la propiedad principal de aplicación del teorema de pitágoras
    para calcular diagonales y distancias en figuras geométricas en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede aplicación del teorema de pitágoras para calcular diagonales y distancias
