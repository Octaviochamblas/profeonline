semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.SIMETRIA_PAR
resumen_inicial: La identificación de simetría respecto del eje $Y$ en funciones potencia con exponente par demuestra algebraicamente que $f(-x) = f(x)$ debido a la propiedad $(-x)^{2k} = x^{2k}$, estableciendo que el eje vertical $x = 0$ es el eje de simetría especular de la gráfica.
explicacion_simple: "![La identificación de simetría respecto del eje $Y$ en funciones potencia con exponente par demuestra algebraicamente que $f(-x) = f(x)$ debido a la propiedad $(-x)^{2k} = x^{2k}$, estableciendo que el eje vertical $x = 0$ es el eje de simetría especular de la gráfica](/static/img/nodos/identificacion-de-simetria-respecto-del-eje-y-en-exponentes-pares-intro.svg)\n\n\nToda función con exponente par positivo ($x^2, x^4, x^6$) es una **función par perfecta**:\n\n- **¿Qué significa?**\n  - Si metes un número positivo o su negativo opuesto, **¡la función te devuelve exactamente la misma altura $y$!**:\n    $$f(-\\mathbf{x}) = f(\\mathbf{x})$$\n  - Ejemplo con $f(x) = 3x^4$:\n    - $f(2) = 3(2)^4 = 3(16) = \\mathbf{48}$.\n    - $f(-2) = 3(-2)^4 = 3(16) = \\mathbf{48}$.\n- **Geométricamente:** El **eje $Y$ (recta $x = 0$)** actúa como un espejo exacto: la mitad izquierda es el reflejo idéntico de la mitad derecha."
explicacion_formal: 'Sea $f(x) = a \cdot x^{2k}$ con $k \in \mathbb{Z}^+$ y $a \in \mathbb{R}^*$.

  Aplicando la definición de paridad funcional para cualquier $x \in \operatorname{Dom}(f) = \mathbb{R}$:

  $$f(-x) = a \cdot (-x)^{2k} = a \cdot \left[(-1)^{2k} \cdot x^{2k}\right]$$

  Dado que $(-1)^{2k} = [(-1)^2]^k = 1^k = 1$ para todo $k \in \mathbb{Z}^+$:

  $$f(-x) = a \cdot (1) \cdot x^{2k} = a \cdot x^{2k} = f(x)$$


  **Propiedad de reflexión isométrica**:

  La gráfica $\operatorname{Gr}(f)$ es invariante bajo el operador de reflexión ortogonal $\sigma_Y: \mathbb{R}^2 \to \mathbb{R}^2$ dado por $\sigma_Y(x, y) = (-x, y)$, cumpliendo $\sigma_Y(\operatorname{Gr}(f)) = \operatorname{Gr}(f)$.'
definiciones_clave: '- **Simetría axial par**: Invarianza gráfica bajo reflexión respecto a una recta vertical.

  - **Eje de simetría ($x = 0$)**: Recta del eje de ordenadas que equidista de cada par de puntos $(-x_0, y_0)$ y $(x_0, y_0)$.'
propiedades_relaciones: '- **Pares conjugados**: Si $(x_0, y_0) \in \operatorname{Gr}(f) \implies (-x_0, y_0) \in \operatorname{Gr}(f)$.

  - **Derivada impar**: La derivada de una función par es siempre una función impar: $f''(-x) = -f''(x)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación de simetría respecto del eje $Y$ en funciones potencia con exponente par demuestra algebraicamente que $f(-x) = f(x)$ debido a la propiedad $(-x)^{2k} = x^{2k}$, estableciendo que el eje vertical $x = 0$ es el eje de simetría especular de la gráfica](/static/img/nodos/identificacion-de-simetria-respecto-del-eje-y-en-exponentes-pares-ejemplos.svg)



    Demuestra la simetría par y calcula los puntos simétricos para:

    1) $f(x) = 5x^6$

    2) Si $P(3, 3645) \in \operatorname{Gr}(f)$, ¿cuál es su punto simétrico?

    3) ¿Por qué la recta $x = 0$ es el eje de simetría?'
  pasos:
  - 'Paso 1: Demostración algebraica:

    - $f(-x) = 5(-x)^6 = 5(x^6) = f(x)$.

    - Como $f(-x) = f(x)$, **queda demostrado que es simétrica respecto al eje $Y$**.'
  - 'Paso 2: Punto simétrico:

    - Conservar la altura $y = 3645$ e invertir la abscisa: **$P''(-3, 3645)$**.'
  - 'Paso 3: El eje $Y$ ($x = 0$) es la mediatriz perpendicular de todos los segmentos horizontales que unen $(-x_0, y_0)$ con $(x_0, y_0)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición algebraica que garantiza que una función sea simétrica respecto al eje Y?
  choices:
  - text: f(-x) = f(x)
    is_correct: true
  - text: f(-x) = -f(x)
    is_correct: false
  - text: f(x) = -f(x)
    is_correct: false
  - text: f(1/x) = f(x)
    is_correct: false
  explanation: La alternativa correcta es 'f(-x) = f(x)'. Esta igualdad define formalmente a las funciones pares y su simetría axial respecto a $x = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el punto (-4, 128) pertenece a la gráfica de una función potencia par, ¿qué punto debe pertenecer obligatoriamente a la curva?
  choices:
  - text: (4, 128)
    is_correct: true
  - text: (4, -128)
    is_correct: false
  - text: (-4, -128)
    is_correct: false
  - text: (128, -4)
    is_correct: false
  explanation: La alternativa correcta es '(4, 128)'. En las funciones pares se cumple $(-x, y) \leftrightarrow (x, y)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Sustituir la variable $x$ por $(-x)$ en la expresión algebraica de la función.'
- 'Paso 2: Desarrollar la potencia $(-x)^{2k} = [(-1)^2]^k \cdot x^{2k} = x^{2k}$.'
- 'Paso 3: Comparar el resultado con la función original y constatar que $f(-x) = f(x)$.'
- 'Paso 4: Concluir que el eje $Y$ ($x = 0$) es el eje de simetría de la gráfica.'
errores_correccion: '- **Error común:** Pensar que si el coeficiente $a$ es negativo (ej: $-2x^4$), la función deja de ser par.

  - **Cómo corregirlo:** El signo de $a$ no altera la paridad: $(-x)^4 = x^4 \implies -2(-x)^4 = -2x^4$, por lo que **sigue siendo 100% simétrica al eje $Y$**.'
ejemplos:
- titulo: 'Ejemplo 1: Comprobación en grado 10'
  enunciado: 'La función $f(x) = -7x^{10}$ cumple:'
  alternativas:
  - f(-x) = f(x) (Simetría Eje Y)
  - f(-x) = -f(x)
  - f(-x) = -70x
  - No tiene simetría
  respuesta: f(-x) = f(x) (Simetría Eje Y)
  solucion_pasos:
  - 'Paso 1: $(-x)^{10} = x^{10} \implies f(-x) = f(x)$.'
- titulo: 'Ejemplo 2: Ecuación del eje de simetría'
  enunciado: ¿Cuál es la ecuación del eje de simetría de $y = 3x^4$?
  alternativas:
  - x = 0 (el eje Y)
  - y = 0 (el eje X)
  - y = x
  - x = 3
  respuesta: x = 0 (el eje Y)
  solucion_pasos:
  - 'Paso 1: El eje de simetría de toda potencia par elemental es la recta vertical $x = 0$.'
- titulo: 'Ejemplo 3: Pareja de puntos'
  enunciado: Si $(5, a)$ está en $y = 2x^2$, ¿qué otro punto tiene la misma altura?
  alternativas:
  - (-5, a)
  - (5, -a)
  - (-5, -a)
  - (a, 5)
  respuesta: (-5, a)
  solucion_pasos:
  - 'Paso 1: Por simetría par $(-5, a)$ pertenece a la curva.'
- titulo: 'Ejemplo 4: Paridad con coeficientes fraccionarios'
  enunciado: ¿Es simétrica al eje Y la función $g(x) = \frac{1}{4}x^6$?
  alternativas:
  - Sí, porque su exponente 6 es par
  - No, porque tiene una fracción
  - Solo en el intervalo [0, 1]
  - No, es simétrica al origen
  respuesta: Sí, porque su exponente 6 es par
  solucion_pasos:
  - 'Paso 1: El exponente 6 es par $\implies$ simetría axial en el eje Y.'
errores_frecuentes:
- Confundir la simetría del eje Y con simetría respecto al eje X.
- Asumir que las funciones con a < 0 pierden su paridad.
- Olvidar que (-x) elevado a exponente par resulta positivo.
afirmaciones_verdaderas:
- Toda función potencia con exponente par positivo cumple estrictamente f(-x) = f(x).
- La recta x = 0 (eje Y) es el eje de simetría especular de la gráfica.
al_terminar_debes_poder: '**QUÉ:** Demostrar y aplicar la simetría respecto del eje Y en funciones potencia pares.


  **CÓMO:** Verificando algebraicamente f(-x) = f(x) y asociando pares de puntos simétricos (-x, y) y (x, y).


