    is_correct: false
  explanation: La alternativa correcta es '$600$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar los coeficientes numéricos de cada monomio y calcular sus valores
  absolutos.'
- 'Paso 2: Descomponer cada número en sus factores primos.'
- 'Paso 3: Identificar todos los factores primos que aparezcan en cualquiera de los
  números.'
- 'Paso 4: Elevar cada factor primo a su mayor exponente registrado y multiplicarlos
  entre sí para obtener el m.c.m. numérico.'
errores_correccion: '- **Error común:** Tomar el menor exponente de los factores primos
  en lugar del mayor exponente al calcular el m.c.m. de los coeficientes.

  - **Cómo corregirlo:** Recuerda que el m.c.m. debe ser un múltiplo (un número más
  grande), por lo que requiere los factores primos comunes y no comunes elevados al
  MAYOR exponente.'
ejemplos:
- titulo: 'Ejemplo 1: m.c.m. con tres coeficientes'
  enunciado: ¿Cuál es el m.c.m. numérico entre $8x^2$, $12x^3$ y $18x$?
  alternativas:
  - $72$
  - $36$
  - $2$
  respuesta: $72$
  solucion_pasos:
  - '1. Factores primos: $8 = 2^3$, $12 = 2^2 \cdot 3$, $18 = 2 \cdot 3^2$.'
  - '2. Mayores potencias de primos presentes: $2^3$ y $3^2$.'
  - '3. m.c.m. numérico: $2^3 \cdot 3^2 = 8 \cdot 9 = 72$.'
- titulo: 'Ejemplo 2: Coeficientes negativos'
  enunciado: Determina el m.c.m. numérico entre $-9a^2$ y $15b^3$.
  alternativas:
  - $45$
  - $-45$
  - $135$
  respuesta: $45$
  solucion_pasos:
  - '1. Valores absolutos: $|-9| = 9 = 3^2$ y $|15| = 15 = 3 \cdot 5$.'
  - '2. Mayores potencias: $3^2 \cdot 5 = 9 \cdot 5 = 45$.'
  - 3. Por convención el m.c.m. numérico es un entero positivo ($45$).
- titulo: ¿El m.c.m. numérico de dos coeficientes primos entre sí (como 4 y 9) es
    igual a su producto?
  respuesta: Sí
  solucion_pasos:
  - Sí. Al no compartir factores primos comunes, el m.c.m. numérico es simplemente
    $4 \cdot 9 = 36$.
- titulo: ¿El m.c.m. numérico entre dos coeficientes puede ser menor que el mayor
    de los coeficientes dados?
  respuesta: 'No'
  solucion_pasos:
  - No. Por ser un múltiplo común, el m.c.m. numérico siempre es mayor o igual a cualquiera
    de los coeficientes originales.
errores_frecuentes:
- El m.c.m. numérico de $6x$ y $8y$ es $2$.
- El m.c.m. numérico de $-10a$ y $15b$ es $-30$.
- Para hallar el m.c.m. numérico se deben restar los coeficientes de los monomios.
- El m.c.m. numérico de $4$ y $8$ es $32$ en lugar del menor múltiplo $8$.
- Los factores primos no comunes se omiten al calcular el m.c.m. de los coeficientes.
afirmaciones_verdaderas:
- El m.c.m. numérico entre monomios se obtiene calculando el Mínimo Común Múltiplo
  sobre los valores absolutos de sus coeficientes.
- El m.c.m. numérico siempre es divisible exactamente por cada uno de los coeficientes
  de los monomios dados.
al_terminar_debes_poder: Al finalizar este recurso podrás determinar el m.c.m. numérico
  entre monomios aplicando la factorización prima de sus coeficientes.
