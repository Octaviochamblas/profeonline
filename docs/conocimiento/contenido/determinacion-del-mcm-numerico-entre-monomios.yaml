semantic_id: MAT.ALG.MCM_ALGEBRAICO.COEFICIENTE_MONOMIOS
resumen_inicial: La determinación del m.c.m. numérico entre monomios consiste en calcular el Mínimo Común Múltiplo de sus
  coeficientes enteros mediante la descomposición en factores primos y la selección de potencias mayores.
explicacion_simple: "Para hallar el **m.c.m. numérico** de los coeficientes de varios monomios (ej: $12x^2, 18y, 30z$):\n\
  - **PROCEDIMIENTO POR FACTORES PRIMOS**:\n  1. **Descompón cada coeficiente en factores primos**:\n     - $12 = 2^2 \\cdot\
  \ 3$.\n     - $18 = 2 \\cdot 3^2$.\n     - $30 = 2 \\cdot 3 \\cdot 5$.\n  2. **Toma TODOS los factores primos que aparezcan**\
  \ (comunes y no comunes):\n     - Los primos presentes son $2, 3$ y $5$. ¡Se toman los tres!\n  3. **Elige la MAYOR potencia\
  \ de cada primo**:\n     - Para $2$: exponentes $2, 1, 1 \\implies$ mayor exponente es $2^2 = 4$.\n     - Para $3$: exponentes\
  \ $1, 2, 1 \\implies$ mayor exponente es $3^2 = 9$.\n     - Para $5$: exponente $1 \\implies$ mayor exponente es $5^1 =\
  \ 5$.\n  4. **Multiplica las mayores potencias elegidas**:\n     - $\\mathbf{\\text{m.c.m. numérico} = 2^2 \\cdot 3^2 \\\
  cdot 5 = 4 \\cdot 9 \\cdot 5 = 180}$.\n\n![Determinación del m.c.m. numérico entre monomios](/static/img/nodos/determinacion-del-mcm-numerico-entre-monomios-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $c_1, c_2, \dots, c_k \in \mathbb{Z} \setminus \{0\}$ los coeficientes enteros de $k$ monomios. Considerando sus descomposiciones
  canónicas en factores primos $|c_i| = \prod_{p \in \mathbb{P}} p^{v_p(c_i)}$, el **Mínimo Común Múltiplo numérico** se define
  formalmente en $\mathbb{Z}^+$ como:


  $$\operatorname{mcm}(|c_1|, |c_2|, \dots, |c_k|) = \prod_{p \in \mathbb{P}} p^{\max_i(v_p(c_i))}$$


  donde $\max_i(v_p(c_i))$ selecciona la mayor valoración $p$-ádica para cada primo $p \in \mathbb{P}$ presente en cualquiera
  de las descomposiciones.


  ### Propiedad de Divisibilidad Entera

  El entero positivo $M = \operatorname{mcm}(|c_1|, \dots, |c_k|)$ es el menor entero positivo tal que $\frac{M}{|c_i|} \in
  \mathbb{Z}^+$ para todo $i \in \{1, 2, \dots, k\}$.


  ### Síntesis didáctica

  El m.c.m. numérico es el menor número positivo que contiene como factores exactos a todos los coeficientes numéricos de
  los monomios.

  '
definiciones_clave: '- **m.c.m. numérico**: Menor entero positivo divisible por todos los coeficientes de un conjunto de monomios.

  - **Factores primos no comunes**: Primos que aparecen en algunos coeficientes pero no en todos, los cuales deben ser incluidos
  en el m.c.m.

  - **Valoración $p$-ádica máxima ($\max(v_p)$)**: Exponente más alto con el que figura cada primo entre todas las descomposiciones.

  '
propiedades_relaciones: '- **Relación numérica fundamental**: $\operatorname{mcm}(a, b) \cdot \operatorname{MCD}(a, b) = |a
  \cdot b|$ para cualquier par de enteros $a, b \in \mathbb{Z}$.

  '
ejemplo_guiado:
  enunciado: Calcula el m.c.m. numérico entre los coeficientes de los monomios $-15a^2$, $20b^3$ y $24c$.
  pasos:
  - 'Paso 1: Tomamos los valores absolutos de los coeficientes: $15, 20$ y $24$.'
  - 'Paso 2: Descomponemos cada coeficiente en sus factores primos: - $15 = 3 \cdot 5$. - $20 = 2^2 \cdot 5$. - $24 = 2^3
    \cdot 3$.'
  - 'Paso 3: Identificamos todos los primos presentes ($2, 3, 5$) y elegimos la **mayor potencia**: - Primo $2$: mayor exponente
    es **$2^3 = 8$**. - Primo $3$: mayor exponente es **$3^1 = 3$**. - Primo $5$: mayor exponente es **$5^1 = 5$**.'
  - 'Paso 4: Multiplicamos las potencias seleccionadas: $\text{m.c.m.} = 2^3 \cdot 3 \cdot 5 = 8 \cdot 3 \cdot 5 = \mathbf{120}$.'
  - 'Conclusión: El m.c.m. numérico entre los coeficientes es **$120$**.'
  imagen: /static/img/nodos/determinacion-del-mcm-numerico-entre-monomios-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el m.c.m. numérico entre los coeficientes $8, 12$ y $18$?
  choices:
  - text: El m.c.m. numérico es 72, factorizando $8=2^3, 12=2^2 \cdot 3, 18=2 \cdot 3^2 \implies 2^3 \cdot 3^2 = 8 \cdot 9
      = 72$
    is_correct: true
  - text: El m.c.m. numérico es 2
    is_correct: false
  - text: El m.c.m. numérico es 24
    is_correct: false
  - text: El m.c.m. numérico es 1728
    is_correct: false
  explanation: 'La alternativa correcta es ''El m.c.m. numérico es 72, factorizando $8=2^3, 12=2^2 \cdot 3, 18=2 \cdot 3^2
    \implies 2^3 \cdot 3^2 = 8 \cdot 9 = 72$''. Mayores potencias de primos: $2^3 \cdot 3^2 = 72$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos coeficientes son $14$ y $35$, sabiendo que su $\operatorname{MCD}(14, 35) = 7$, ¿cuál es su m.c.m. numérico?
  choices:
  - text: El m.c.m. numérico es 70, calculando $\frac{14 \cdot 35}{7} = \frac{490}{7} = 70$
    is_correct: true
  - text: El m.c.m. numérico es 490
    is_correct: false
  - text: El m.c.m. numérico es 35
    is_correct: false
  - text: El m.c.m. numérico es 7
    is_correct: false
  explanation: 'La alternativa correcta es ''El m.c.m. numérico es 70, calculando $\frac{14 \cdot 35}{7} = \frac{490}{7} =
    70$''. Relación fundamental: $\operatorname{mcm} = \frac{a \cdot b}{\operatorname{MCD}} = \frac{490}{7} = 70$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener el valor absoluto de cada coeficiente numérico.'
- 'Paso 2: Descomponer cada número en factores primos.'
- 'Paso 3: Reunir todos los primos que aparezcan y seleccionar para cada uno el exponente más alto.'
- 'Paso 4: Multiplicar las potencias obtenidas para calcular el m.c.m. numérico final.'
errores_correccion: '- **Error 1:** Seleccionar la menor potencia de los primos compartidos como si fuera el M.C.D. **Cómo
  corregirlo:** Para el m.c.m. **SE DEBEN TOMAR LAS MAYORES POTENCIAS DE TODOS LOS PRIMOS QUE APAREZCAN**.

  - **Error 2:** Multiplicar todos los coeficientes directamente sin reducir factores comunes. **Cómo corregirlo:** Multiplicar
  directamente entrega un múltiplo muy grande pero **NO ES EL MÍNIMO COMÚN MÚLTIPLO**.

  '
ejemplos:
- titulo: m.c.m. numérico simple
  enunciado: Para coeficientes 4 y 6, ¿es el m.c.m. numérico 12?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2^2 \cdot 3 = 12$.
- titulo: Coeficientes primos entre sí
  enunciado: Para coeficientes 5 y 7, ¿es su m.c.m. numérico $5 \cdot 7 = 35$?
  respuesta: Sí
  solucion_pasos:
  - Sí, son coprimos.
- titulo: Coeficiente negativo
  enunciado: Para $-9$ y $12$, ¿es el m.c.m. $+36$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|-9|=9 \implies \operatorname{mcm}(9,12)=36$.
- titulo: Tres coeficientes
  enunciado: Para 6, 8 y 10, ¿es el m.c.m. 120?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2^3 \cdot 3 \cdot 5 = 120$.
errores_frecuentes:
- Tomar el menor exponente de los factores primos en lugar de seleccionar el mayor exponente.
- Los factores primos que no son comunes a todos los coeficientes no son incluidos.
- Multiplicar directamente los coeficientes sin descomponer en factores primos.
- Asignar un signo negativo al m.c.m. numérico final.
- Olvidar que el m.c.m. numérico debe ser divisible por cada uno de los coeficientes.
afirmaciones_verdaderas:
- El m.c.m. numérico entre monomios es el menor número entero positivo divisible por todos sus coeficientes.
- Se calcula seleccionando la mayor potencia de cada factor primo presente en cualquier coeficiente.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/determinacion-del-mcm-numerico-entre-monomios-resumen.svg)


  QUÉ: Determinar el m.c.m. numérico entre los coeficientes de cualquier grupo de monomios.

  CÓMO: Extraer los valores absolutos de los coeficientes, descomponerlos en factores primos y multiplicar las máximas potencias
  de todos los primos presentes ($\operatorname{mcm}(|c_i|) = \prod p^{\max(v_p)}$).

  '
