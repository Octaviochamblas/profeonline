semantic_id: MAT.ALG.MCM_ALGEBRAICO.COEFICIENTE_MONOMIOS
resumen_inicial: El m.c.m. numérico de un grupo de monomios es el menor entero positivo
  que es divisible por cada uno de sus coeficientes.
explicacion_simple: 'Para calcular el m.c.m. de los coeficientes de varios monomios,
  aislamos los números que multiplican a las variables e ignoramos temporalmente las
  letras.

  Buscamos el número entero positivo más pequeño que sea múltiplo común de todos esos
  coeficientes a la vez.

  Este valor corresponde al Mínimo Común Múltiplo aritmético tradicional entre los
  valores absolutos de los coeficientes.'
explicacion_formal: 'Dado un conjunto de monomios con coeficientes enteros $\{c_1,
  c_2, \dots, c_k\}$, el **m.c.m. numérico** $C_{\text{mcm}}$ se calcula formalmente
  como:


  $$C_{\text{mcm}} = \operatorname{lcm}(|c_1|, |c_2|, \dots, |c_k|) = \prod_{p} p^{\max_i(v_p(|c_i|))}$$


  **Desglose de la fórmula:**

  - \operatorname{lcm}(|c_1|, \dots, |c_k|): Representa la función Mínimo Común Múltiplo
  sobre los valores absolutos de los coeficientes.

  - \prod_p p^{\dots}: Es la multiplicación de todos los factores primos $p$ presentes
  en la descomposición de al menos uno de los coeficientes.

  - $v_p(|c_i|)$: Es el exponente del primo $p$ en el coeficiente $c_i$, tomando el
  valor máximo $\max_i$ para asegurar que el resultado sea múltiplo de todos.'
definiciones_clave: '- **m.c.m. de coeficientes**: El menor número entero positivo
  que es múltiplo simultáneo de todos los coeficientes numéricos de un conjunto de
  monomios.

  - **Factores primos no comunes**: Factores numéricos que aparecen solo en algunos
  coeficientes pero que deben incluirse en el m.c.m.'
propiedades_relaciones: '- **Positividad**: Por convenio algebraico, el m.c.m. numérico
  se expresa siempre como un número entero positivo.

  - **Independencia literal**: Se calcula única y exclusivamente sobre los coeficientes
  numéricos sin alterar ni considerar los exponentes de las letras.'
ejemplo_guiado:
  enunciado: Tres tanques de almacenamiento recargan combustible en intervalos de
    $15a^2$, $20ab$ y $30b^2$ minutos. Determina el m.c.m. numérico entre sus coeficientes
    y evalúa el bloque común $60ab$ para $a = 2$ y $b = 5$.
  pasos:
  - 'Paso 1: Descomponer los coeficientes en factores primos: $15 = 3 \cdot 5$, $20
    = 2^2 \cdot 5$ y $30 = 2 \cdot 3 \cdot 5$.'
  - 'Paso 2: Seleccionar todos los factores primos al mayor exponente: $2^2 \cdot
    3^1 \cdot 5^1 = 4 \cdot 3 \cdot 5 = 60$. El m.c.m. numérico es $60$.'
  - 'Paso 3: Evaluar la expresión $60ab$ para $a = 2$ y $b = 5$: $60 \cdot 2 \cdot
    5 = 600\text{ minutos}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el m.c.m. numérico de los coeficientes de los monomios $15a^2$,
