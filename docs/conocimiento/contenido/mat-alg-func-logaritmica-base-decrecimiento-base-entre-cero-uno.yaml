semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.DECRECIMIENTO_BASE_ENTRE_CERO_UNO
resumen_inicial: 'Análisis del decrecimiento de la función logarítmica para bases
  entre cero y uno: conceptos, asíntotas, propiedades e inversidad en Análisis de
  la función logarítmica.'
explicacion_simple: 'Cuando la base de un logaritmo es una fracción entre $0$ y $1$,
  el comportamiento se invierte respecto del caso $b>1$: a medida que el argumento
  crece, el valor del logaritmo disminuye.'
explicacion_formal: '### Definición formal


  Si $0<b<1$, entonces para todo par $x_1,x_2\in\mathbb{R}^+$ con $x_1<x_2$ se cumple
  $\log_b(x_1)>\log_b(x_2)$; es decir, $f(x)=\log_b(x)$ es estrictamente decreciente
  en todo su dominio.


  ### Desarrollo didáctico


  Con $b=0{,}5$: $\log_{0{,}5}(1)=0$, $\log_{0{,}5}(2)=-1$, $\log_{0{,}5}(4)=-2$,
  $\log_{0{,}5}(8)=-3$. Cada vez que $x$ se duplica, $f(x)$ disminuye en $1$ unidad;
  el valor de la función baja de forma sostenida a medida que el argumento aumenta.'
definiciones_clave: '- **Análisis del decrecimiento de la función logarítmica para
  bases entre cero y uno**: Concepto fundamental en el estudio del crecimiento/decaimiento
  exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a análisis del decrecimiento de la función logarítmica para bases entre
  cero y uno.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de análisis
    del decrecimiento de la función logarítmica para bases entre cero y uno.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de análisis del decrecimiento
    de la función logarítmica para bases entre cero y uno.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
