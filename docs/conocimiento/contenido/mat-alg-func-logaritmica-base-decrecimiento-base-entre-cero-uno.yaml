semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.DECRECIMIENTO_BASE_ENTRE_CERO_UNO
resumen_inicial: 'El decrecimiento logarítmico ocurre cuando la base satisface $0 < b < 1$, haciendo que la gráfica baje desde $+\infty$ cerca del eje $y$ y descienda hacia $-\infty$ a la derecha.'
explicacion_simple: |
  Cuando la base de una función logarítmica es una fracción comprimida entre 0 y 1 (como $b = 0.5$ o $b = 0.1$), la curva de la función va bajando de izquierda a derecha. Cerca del eje vertical $y$ (para valores de $x$ muy pequeños cercanos a cero), la curva proviene de alturas gigantescas positivas ($+\infty$). Tras cruzar el eje horizontal en el punto $(1, 0)$, la curva continúa cayendo hacia abajo en los números negativos.
explicacion_formal: |
  ### Definición formal
  Para una función logarítmica mónica $f(x) = \log_b(x)$, la condición de la base **$0 < b < 1$** define un **modelo estrictamente decreciente** en todo su dominio $]0, +\infty[$ caracterizado por:
  $$\forall x_1, x_2 \in \mathbb{R}^+, \quad x_1 < x_2 \implies \log_b(x_1) > \log_b(x_2)$$
  con derivada primera estrictamente negativa:
  $$f'(x) = \frac{1}{x \ln(b)} < 0 \quad (\text{dado que } x > 0 \text{ y } \ln(b) < 0 \text{ para } 0 < b < 1)$$

  ### Desglose simbólico
  - Comportamiento asintótico a la izquierda: $\lim_{x \to 0^+} \log_b(x) = +\infty$. La recta $x = 0$ es asíntota vertical por la derecha.
  - Comportamiento divergente a la derecha: $\lim_{x \to +\infty} \log_b(x) = -\infty$.
  - Concavidad permanente (Cóncava hacia arriba): La derivada segunda $f''(x) = -\frac{1}{x^2 \ln(b)} > 0$ es estrictamente positiva en todo $]0, +\infty[$, mostrando que la curva se suaviza a medida que cae a la derecha.

  ### Síntesis didáctica
  Relación de reflexión con la base mayor a 1: La gráfica de decaimiento logarítmico $f(x) = \log_{0.5}(x)$ es exactamente la gráfica de crecimiento logarítmico $g(x) = \log_2(x)$ reflejada patas arriba (reflejada respecto al eje $x$).
definiciones_clave: |
  - **Decrecimiento logarítmico ($0 < b < 1$)**: Descenso monótono continuo de la gráfica a medida que aumenta la variable $x$.
  - **Concavidad hacia arriba ($f''(x) > 0$)**: Curvatura gráfica con forma de copa que desacelera la caída.
  - **Divergencia asintótica a $+\infty$**: Elevación ilimitada de la curva al aproximarse a la asíntota $x = 0$ por la derecha.
propiedades_relaciones: |
  - **Identidad de base recíproca**: $\log_{1/b}(x) = -\log_b(x)$. Multiplicar por $-1$ invierte el sentido de variación de creciente a decreciente.
  - **Invariancia del corte $x$**: A pesar de ser decreciente, la curva sigue cruzando el eje $x$ en el punto $(1, 0)$.
ejemplo_guiado:
  enunciado: 'Dada la función logarítmica de decaimiento $f(x) = \log_{0.5}(x)$, evalúa los puntos $x = 0.25, 0.5, 1, 2, 4$ y describe el comportamiento de su gráfica.'
  pasos:
    - 'Paso 1: Evaluamos $f(0.25) = \log_{0.5}((0.5)^2) = 2$. Punto: $(0.25, 2)$.'
    - 'Paso 2: Evaluamos $f(0.5) = \log_{0.5}(0.5) = 1$. Punto: $(0.5, 1)$.'
    - 'Paso 3: Evaluamos $f(1) = \log_{0.5}(1) = 0$. Punto: $(1, 0)$.'
    - 'Paso 4: Evaluamos $f(2) = \log_{0.5}(2^1) = \log_{0.5}((0.5)^{-1}) = -1$. Punto: $(2, -1)$.'
    - 'Paso 5: Evaluamos $f(4) = \log_{0.5}((0.5)^{-2}) = -2$. Punto: $(4, -2)$. La gráfica desciende de forma continua.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué sucede con los valores de salida de la función logarítmica $f(x) = \log_{0.2}(x)$ a medida que $x$ se aproxima al origen por la derecha ($x \to 0^+$)?'
    choices:
      - {text: 'La función se eleva de manera ilimitada hacia $+\infty$', is_correct: true}
      - {text: 'La función cae de manera ilimitada hacia $-\infty$', is_correct: false}
      - {text: 'La función se aproxima a cero', is_correct: false}
      - {text: 'La función se vuelve constante en $y = 0.2$', is_correct: false}
    explanation: 'La alternativa correcta es ''La función se eleva de manera ilimitada hacia $+\infty$''. Al ser la base $0.2 < 1$, al aproximarnos a $x = 0$ por la derecha las potencias necesarias son exponentes negativos pequeños de base fraccionaria, resultando en valores positivos tendientes a $+\infty$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Para qué intervalo de la variable $x$ la función de decaimiento logarítmico $f(x) = \log_{0.5}(x)$ arroja valores de salida positivos ($y > 0$)?'
    choices:
      - {text: 'Para el intervalo de valores $x \in ]0, 1[$', is_correct: true}
      - {text: 'Para el intervalo de valores $x \in ]1, +\infty[$', is_correct: false}
      - {text: 'Para todo $x \in \mathbb{R}$', is_correct: false}
      - {text: 'Para ningún valor de $x$', is_correct: false}
    explanation: 'La alternativa correcta es ''Para el intervalo de valores $x \in ]0, 1[$''. Al ser decreciente, la curva viene de $+\infty$ en $]0, 1[$, cruza el eje $x$ en $(1, 0)$ y pasa a ser negativa para $x > 1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar que la base $b$ satisface $0 < b < 1$.'
  - 'Paso 2: Declarar la función logarítmica como estrictamente decreciente.'
  - 'Paso 3: Trazar la asíntota vertical $x = 0$ elevándose a $+\infty$ al acercarse a cero por la derecha.'
  - 'Paso 4: Trazar la curva descendiendo a través de $(1, 0)$ y cayendo suavemente hacia $-\infty$ a la derecha.'
errores_correccion: |
  - **Error 1:** Confundir la asíntota de decaimiento logarítmico con la de decaimiento exponencial. **Cómo corregirlo:** En el decaimiento logarítmico, la asíntota es **vertical** en $x = 0$ y sube a $+\infty$. En el decaimiento exponencial, la asíntota es **horizontal** en $y = 0$ a la derecha.
  - **Error 2:** Creer que una función logarítmica decreciente no puede tomar valores negativos. **Cómo corregirlo:** Su recorrido es todo $\mathbb{R}$. Para $x > 1$, las salidas de $\log_b(x)$ con $0 < b < 1$ son estrictamente negativas.
ejemplos:
  - titulo: 'Identificación de decaimiento logarítmico'
    enunciado: '¿La función $f(x) = \log_{1/4}(x)$ es estrictamente decreciente?'
    alternativas:
      - 'Sí, porque $0 < \frac{1}{4} < 1$'
      - 'No, es creciente'
      - 'No está definida'
    respuesta: 'Sí, porque $0 < \frac{1}{4} < 1$'
    solucion_pasos:
      - '1. La base es $b = 0.25 \in ]0, 1[$.'
      - '2. La función es estrictamente decreciente en $]0, +\infty[$.'
  - titulo: 'Signo de las imágenes en decaimiento'
    enunciado: 'Para $f(x) = \log_{0.5}(x)$, ¿evaluar $x = 8$ resulta en $-3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(0.5)^{-3} = 2^3 = 8 \implies \log_{0.5}(8) = -3$.'
  - titulo: 'Concavidad en decaimiento'
    enunciado: '¿La gráfica de decaimiento logarítmico $y = \log_{0.2}(x)$ es cóncava hacia arriba?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Su derivada segunda es estrictamente positiva $f''(x) > 0$, lo que significa concavidad hacia arriba.'
  - titulo: 'Inversión por cambio de base'
    enunciado: '¿La función $f(x) = -\log_5(x)$ se comporta exactamente como una función logarítmica de decaimiento?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $-\log_5(x) = \log_{1/5}(x) = \log_{0.2}(x)$, que es una función de decaimiento logarítmico.'
errores_frecuentes:
  - 'Una función logarítmica con base $0 < b < 1$ no está definida para argumentos mayores que 1.'
  - 'La gráfica de la función de decaimiento logarítmico $f(x) = \log_{0.5}(x)$ cruza el eje $x$ en el punto $(0, 1)$.'
  - 'Al acercarse a $x = 0$ por la derecha, la función logarítmica decreciente se aproxima a $-\infty$ e invierte el sentido de los valores.'
  - 'Las funciones de decaimiento logarítmico poseen un recorrido restringido a los números reales positivos.'
  - 'La concavidad de la función logarítmica decreciente es cóncava hacia abajo.'
afirmaciones_verdaderas:
  - 'Para $0 < b < 1$, la función logarítmica $f(x) = \log_b(x)$ es estrictamente decreciente y cóncava hacia arriba en todo su dominio $]0, +\infty[$.'
  - 'La gráfica de decaimiento logarítmico proviene de $+\infty$ en la asíntota vertical $x = 0$, cruza el eje $x$ en $(1, 0)$ y desciende de forma ilimitada hacia $-\infty$ a la derecha.'
al_terminar_debes_poder: |
  QUÉ: Analizar el comportamiento decreciente de la función logarítmica cuando $0 < b < 1$.
  CÓMO: Comprobar que a mayores valores del argumento $x_2 > x_1 > 0$ se obtienen menores valores de la ordenada $f(x_2) < f(x_1)$, identificando su monotonía, concavidad y asíntota.
