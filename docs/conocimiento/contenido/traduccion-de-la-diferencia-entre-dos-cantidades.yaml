resumen_inicial: La traducción de la diferencia entre dos cantidades en lenguaje algebraico
  vincula enunciados verbales con expresiones matemáticas precisas.
explicacion_simple: Para expresar la diferencia entre dos cantidades, identificamos
  las letras que representan los números y usamos el símbolo matemático adecuado.
explicacion_formal: 'Sea $x, y \in \mathbb{R}$. La **Traducción de La diferencia entre
  dos cantidades** establece la asignación:


  $$\text{"el exceso de a sobre b"} \implies a - b$$


  > **Complemento didáctico:** Esta traducción permite formalizar algebraicamente
  enunciados verbales en el dominio real.'
definiciones_clave: '- **La diferencia entre dos cantidades**: Representación simbólica
  en lenguaje algebraico.'
propiedades_relaciones: '- **Coherencia operacional**: a - b conserva el significado
  semántico del enunciado.'
ejemplo_guiado:
  enunciado: 'Traduzca a lenguaje algebraico: ''el exceso de a sobre b''.'
  pasos:
  - 'Paso 1: Identificar las cantidades y variables.'
  - 'Paso 2: Aplicar la operación correspondiente.'
  - 'Conclusión: La expresión exacta es a - b.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la representación algebraica de 'el exceso de a sobre b'?
  choices:
  - text: a - b
    is_correct: true
  - text: b - a
    is_correct: false
  - text: a + b
    is_correct: false
  - text: ab
    is_correct: false
  explanation: La alternativa correcta es 'a - b'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el exceso de a sobre b', ¿cuál fue la expresión
    obtenida?
  choices:
  - text: a - b
    is_correct: true
  - text: b - a
    is_correct: false
  - text: a + b
    is_correct: false
  - text: ab
    is_correct: false
  explanation: La alternativa correcta es 'a - b'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado identificando variables.'
- 'Paso 2: Escribir los operadores correspondientes.'
- 'Paso 3: Verificar el resultado.'
errores_correccion: '- **Error 1: Invertir términos al traducir la diferencia entre
  dos cantidades.** **Cómo corregirlo:** Mantener el orden sintáctico adecuado de
  los operandos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se expresa algebraicamente 'el exceso de a sobre b'?
  alternativas:
  - a - b
  - b - a
  - a + b
  - ab
  respuesta: a - b
  solucion_pasos:
  - 1. Analizar las variables.
  - 2. Traducir al símbolo a - b.
- titulo: Ejemplo 2
  enunciado: ¿Qué expresión traduce de forma correcta el enunciado de la diferencia
    entre dos cantidades 'el exceso de a sobre b'?
  alternativas:
  - a - b
  - b - a
  - a + b
  - ab
  respuesta: a - b
  solucion_pasos:
  - 1. Revisar la operación principal.
  - 2. Confirmar que la opción correcta es a - b.
- titulo: ¿Representa a - b el enunciado 'el exceso de a sobre b'?
  respuesta: Sí
  solucion_pasos:
  - Sí, coincide exactamente con el enunciado verbal.
- titulo: ¿Es la suma directa equivalente a a - b?
  respuesta: 'No'
  solucion_pasos:
  - No, cada operador matemático tiene un significado único.
errores_frecuentes:
- Invertir el orden de los elementos al traducir la frase de la diferencia entre dos
  cantidades.
- Multiplicar en lugar de dividir o restar según corresponda en la diferencia entre
  dos cantidades.
- Representar la adición de términos mediante la elevación a exponentes en la diferencia
  entre dos cantidades.
- Reemplazar variables por valores constantes específicos sin razón lógica.
- Omitir delimitadores de agrupamiento en expresiones compuestas de la diferencia
  entre dos cantidades.
afirmaciones_verdaderas:
- La expresión a - b representa la traducción fiel de la diferencia entre dos cantidades.
- Las variables permiten modelar cualquier caso en la diferencia entre dos cantidades.
al_terminar_debes_poder: Al terminar serás capaz de traducir enunciados sobre la diferencia
  entre dos cantidades construyendo la expresión algebraica a - b de manera correcta.
