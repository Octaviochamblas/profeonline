    utilizando el signo de sustracción ($-$)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La **Diferencia de Cantidades**
    se traduce utilizando el signo de sustracción ($-$).'
- titulo: 'Respecto de «Traducción de la diferencia entre dos cantidades»: ¿Es compatible
    con el proced'
  enunciado: 'Respecto de «Traducción de la diferencia entre dos cantidades»: ¿Es
    compatible con el procedimiento esta afirmación? «Traducir en el mismo orden de
    lectura sin analizar. (Ej: ''Cinco restado de $x$'' traducido equivocadamente
    como $5 - x$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La **Diferencia de Cantidades**
    se traduce utilizando el signo de sustracción ($-$).'
errores_frecuentes:
- 'Traducir en el mismo orden de lectura sin analizar. (Ej: ''Cinco restado de $x$''
  traducido equivocadamente como $5 - x$).'
- Asumir que 'la diferencia' siempre será positiva; en álgebra abstracta $x - y$ puede
  dar resultados negativos.
- Porque 'restado de' indica una división, mientras que 'menos' indica una resta convencional.
- Porque 'restado de' se usa exclusivamente para números enteros negativos.
- Porque 'restado de' indica que el resultado siempre será un número irracional.
afirmaciones_verdaderas:
- La traducción de traducción de la diferencia entre dos cantidades preserva el significado
  matemático del enunciado.
