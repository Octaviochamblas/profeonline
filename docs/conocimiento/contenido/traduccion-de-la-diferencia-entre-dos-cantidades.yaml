procedimiento:
- 'Paso 1: Identifica las variables involucradas.'
- 'Paso 2: Lee atentamente para descubrir de quién es la cantidad inicial (quién va
  a sufrir la resta).'
- 'Paso 3: Coloca esa cantidad inicial a la izquierda del signo menos (-), y la cantidad
  que se quita, a la derecha.'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  traducción de la diferencia entre dos cantidades.
ejemplos:
- titulo: El orden altera el producto
  enunciado: 'Traduce algebraicamente: ''Seis restado de un número cualquiera''.'
  solucion_pasos:
  - La palabra 'de' nos dice que el 'número cualquiera' es nuestro punto de partida.
    Lo llamamos x.
  - La cantidad 'seis' es lo que estamos quitando.
  - 'Traducción correcta: x - 6. (Escribir 6 - x sería ''un número restado de seis'').'
- titulo: 'En el examen de admisión, el problema plantea: ''Las ganancias líquidas
    de una empresa equiva'
  enunciado: 'En el examen de admisión, el problema plantea: ''Las ganancias líquidas
    de una empresa equivalen a sus costos fijos ($C$) restados de sus ingresos totales
    ($I$)''. Un estudiante apurado escribe la ecuación de ganancias como $G = C -
    I$ y entrega la prueba. ¿Qué consecuencia tendrá su error de traducción? (v1)


    Opciones: A) Su modelo calculará pérdidas financieras constantes en lugar de ganancias,
    ya que invirtió el orden de la resta al no respetar la preposición ''de''. · B)
    Ninguna, porque al igual que la suma, el orden de la resta no altera el resultado
    de las ganancias. · C) Su modelo calculará una multiplicación entre costos e ingresos.
    · D) El modelo fallará porque las variables C e I debieron sumarse para hallar
    ganancias líquidas.'
  solucion_pasos:
  - El enunciado dice 'costos fijos (C) restados DE sus ingresos (I)'. Es decir, partimos
    de I, y quitamos C. La ecuación correcta era $G = I - C$. Al escribir $C - I$,
    calculó un número negativo (pérdida).
  - 'Respuesta: Su modelo calculará pérdidas financieras constantes en lugar de ganancias,
    ya que invirtió el orden de la resta al no respetar la preposición ''de''.'
- titulo: 'Respecto de «Traducción de la diferencia entre dos cantidades»: ¿Se ajusta
