semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.DIFERENCIA_CANTIDADES
resumen_inicial: 'La traducción de la diferencia entre dos cantidades consiste en representar simbólicamente la resta o sustracción de dos expresiones mediante el operador $-$, respetando el orden estricto entre el minuendo y el sustraendo.'
explicacion_simple: |
  Traducir la **diferencia entre dos cantidades** es expresar la resta de un número menos otro usando el signo **$-$**:
  - **¡Regla de oro!** A diferencia de la suma, **LA RESTA NO ES CONMUTATIVA**. El orden en que se leen las palabras cambia todo el resultado:
    - *"La diferencia entre $A$ y $B$"* $\implies \mathbf{A - B}$ (el primer mencionado $A$ es el minuendo, el segundo $B$ es el sustraendo).
    - *"La diferencia entre $B$ y $A$"* $\implies \mathbf{B - A}$ (son expresiones totalmente distintas).
  - Ejemplos:
    - "La diferencia entre $x$ y $8$" $\implies **x - 8**$.
    - "La diferencia entre el triple de $a$ y el doble de $b$" $\implies **3a - 2b**$.
    - "El cuadrado de la diferencia entre $x$ e $y$" $\implies **(x - y)^2**$.
explicacion_formal: |
  ### Definición formal
  La **operación de resta o sustracción simbólica** mapea un par ordenado de expresiones $(A, B) \in \mathbb{R}[x]^2$ en su diferencia algebraica no conmutativa mediante el operador de resta $- \in \text{Op}$:

  $$\Phi(\text{"La diferencia entre } A \text{ y } B\text{"}) = A - B \quad \text{donde } A = \text{Minuendo}, \quad B = \text{Sustraendo}$$

  ### No Conmutatividad de la Diferencia
  Dado que la sustracción en los números reales no es conmutativa ($A - B \neq B - A$ para $A \neq B$):

  $$\Phi(\text{"La diferencia entre } A \text{ y } B\text{"}) \neq \Phi(\text{"La diferencia entre } B \text{ y } A\text{"})$$

  ### Diferencia de Cuadrados vs Cuadrado de la Diferencia
  - **Diferencia de los cuadrados de $x$ e $y$**: $x^2 - y^2$.
  - **Cuadrado de la diferencia entre $x$ e $y$**: $(x - y)^2$.

  ### Síntesis didáctica
  La estricta precedencia sintáctica del minuendo sobre el sustraendo es vital para evitar errores de signo en el planteo algebraico.
definiciones_clave: |
  - **Diferencia entre dos cantidades**: Expresión $A - B$ resultante de sustraer la cantidad $B$ (sustraendo) de la cantidad $A$ (minuendo).
  - **Minuendo**: Primera cantidad mencionada en el enunciado verbal que recibe la sustracción.
  - **Sustraendo**: Segunda cantidad mencionada en el enunciado verbal que se descuenta o resta.
propiedades_relaciones: |
  - **Relación de inversión de signo**: Cambiar el orden de los términos en una diferencia invierte el signo de la expresión ($B - A = -(A - B)$).
  - **Diferencia con el término "disminuido"**: "La diferencia entre $x$ y $5$" ($x - 5$) coincide en resultado numérico con " $x$ disminuido en $5$ ", pero conceptualmente la frase "diferencia entre A y B" exige nombrar primero el minuendo A.
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico las siguientes frases: a) "La diferencia entre el quíntuple de $x$ y doce", b) "La diferencia entre doce y el quíntuple de $x$".'
  pasos:
    - 'Paso 1: Analizamos a): El primer término (minuendo) es "el quíntuple de $x$" ($5x$) y el segundo (sustraendo) es "doce" ($12$).'
    - 'Paso 2: Formamos la diferencia en orden: **$5x - 12$**.'
    - 'Paso 3: Analizamos b): El primer término (minuendo) es "doce" ($12$) y el segundo (sustraendo) es "el quíntuple de $x$" ($5x$).'
    - 'Paso 4: Formamos la diferencia en orden: **$12 - 5x$**.'
    - 'Conclusión: La frase a) se traduce como **$5x - 12$** y la frase b) como **$12 - 5x$** (no son iguales).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué es fundamental respetar el orden exacto de los términos al traducir "La diferencia entre $A$ y $B$"?'
    choices:
      - {text: 'Porque la sustracción no es conmutativa y cambiar el orden altera el signo del resultado ($A - B \neq B - A$)', is_correct: true}
      - {text: 'Porque la variable $A$ siempre debe ser mayor que cero', is_correct: false}
      - {text: 'Porque la resta elimina automáticamente los exponentes de las letras', is_correct: false}
      - {text: 'Porque la diferencia exige que ambas cantidades sean números pares', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque la sustracción no es conmutativa y cambiar el orden altera el signo del resultado ($A - B \neq B - A$)''. El orden del enunciado rige minuendo y sustraendo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la traducción correcta de "El cuadrado de la diferencia entre $a$ y $b$"?'
    choices:
      - {text: 'Se traduce como la expresión $(a - b)^2$', is_correct: true}
      - {text: 'Se traduce como la expresión $a^2 - b^2$', is_correct: false}
      - {text: 'Se traduce como la expresión $a - b^2$', is_correct: false}
      - {text: 'Se traduce como la expresión $2(a - b)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se traduce como la expresión $(a - b)^2$''. Primero la diferencia entre paréntesis y luego elevada al cuadrado.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar en la frase verbal cuál es la cantidad nombrada en primer lugar (minuendo).'
  - 'Paso 2: Identificar cuál es la cantidad nombrada en segundo lugar (sustraendo).'
  - 'Paso 3: Escribir la estructura `Minuendo - Sustraendo` utilizando el signo $-$.'
  - 'Paso 4: Si la frase aplica una potencia u otra operación sobre la diferencia, envolver `(Minuendo - Sustraendo)` entre paréntesis.'
errores_correccion: |
  - **Error 1:** Invertir los términos al traducir la resta (escribir $8 - x$ al traducir "la diferencia entre $x$ y 8"). **Cómo corregirlo:** La primera cantidad nombrada **va ANTES del signo menos** ($x - 8$).
  - **Error 2:** Escribir $(x - y)^2$ al traducir "la diferencia de los cuadrados" ($x^2 - y^2$). **Cómo corregirlo:** En "cuadrado de la diferencia", **se resta primero entre paréntesis y luego se eleva al cuadrado**.
ejemplos:
  - titulo: 'Diferencia básica'
    enunciado: '¿Cuál es la traducción de "La diferencia entre un número $m$ y un número $n$"?'
    alternativas:
      - '$m - n$'
      - '$n - m$'
      - '$m + n$'
    respuesta: '$m - n$'
    solucion_pasos:
      - '1. Minuendo: $m$. Sustraendo: $n$.'
      - '2. Traducción: $m - n$.'
  - titulo: 'Diferencia de cuadrados'
    enunciado: '¿Cuál es la traducción de "La diferencia de los cuadrados de $x$ e $y$"?'
    alternativas:
      - '$x^2 - y^2$'
      - '$(x - y)^2$'
      - '$2x - 2y$'
    respuesta: '$x^2 - y^2$'
    solucion_pasos:
      - '1. Se eleva cada término al cuadrado: $x^2$ e $y^2$.'
      - '2. Se resta: $x^2 - y^2$.'
  - titulo: 'Inversión de signo'
    enunciado: 'Al cambiar el orden de $a - b$ por $b - a$, ¿se obtiene el valor opuesto $-(a - b)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $b - a = -(a - b)$.'
  - titulo: 'Diferencia con coeficientes'
    enunciado: 'La frase "La diferencia entre el triple de $x$ y $10$", ¿se traduce como $3x - 10$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, minuendo $3x$, sustraendo $10 \implies 3x - 10$.'
errores_frecuentes:
  - 'Invertir la posición del minuendo y el sustraendo escribiendo B - A al traducir la diferencia entre A y B.'
  - 'Intercambiar el cuadrado de la diferencia con la diferencia de los cuadrados al traducir el enunciado.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Reemplazar el signo de restar por un signo de división al traducir la palabra diferencia.'
  - 'Declarar que la diferencia entre dos variables distintas x - y es igual a cero.'
afirmaciones_verdaderas:
  - 'La traducción de la diferencia entre dos cantidades establece a la primera cantidad nombrada como el minuendo y a la segunda como el sustraendo.'
  - 'La resta no es conmutativa, por lo que el orden de los términos altera directamente el signo del resultado.'
al_terminar_debes_poder: 'Traducir enunciados de diferencia entre cantidades al lenguaje algebraico respetando el orden estricto de minuendo y sustraendo.'
