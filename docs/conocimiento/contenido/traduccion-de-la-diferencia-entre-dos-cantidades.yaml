semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.DIFERENCIA_CANTIDADES
resumen_inicial: 'Traducción de la diferencia entre dos cantidades: traducción, reglas
  y aplicación práctica en Lenguaje algebraico: operaciones y múltiplos.'
explicacion_simple: Si tú mides 1.80m y tu amigo 1.70m, ¿cuál es la diferencia de
  altura? La respuesta la da la operación de resta. En álgebra, la diferencia compara
  la distancia entre dos variables.
explicacion_formal: '### Definición formal


  Si traduces ''3 restado de x'' como 3 - x (está mal, es x - 3). Como la resta no
  es conmutativa, el error de traducción lleva a un error de cálculo.


  ### Desarrollo didáctico


  Palabras clave:

  - La diferencia entre

  - Menos

  - Restado a

  - Restado de


  Ejemplos clásicos:

  - ''La diferencia entre dos números'': $x - y$

  - ''El sueldo de Ana menos los gastos'': $S - G$


  *La Trampa Mortal del Lenguaje:* Cuidado con el orden de la palabra ''restado de''.

  - ''Si a $x$ le restamos $5$'' $\rightarrow$ $x - 5$.

  - ''Si $5$ es restado DE un número $x$'' $\rightarrow$ el número inicial es $x$,
  por lo tanto la traducción es $x - 5$. El que va después del ''DE'' es el dueño
  de la cantidad principal.'
