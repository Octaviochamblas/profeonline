semantic_id: MAT.NUM.PROG_ARITMETICA.RECONOCIMIENTO
resumen_inicial: 'Reconocimiento de una progresión aritmética a partir de sus términos: concepto
  y desarrollo dentro de Progresión aritmética.'
explicacion_simple: No todo lo que brilla es oro, y no toda secuencia que suma es aritmética.
  A veces un solo número fuera de lugar rompe toda la regla. Es hora de poner a prueba las
  secuencias.
explicacion_formal: 'Una trampa clásica en las pruebas es darte una secuencia que parece aritmética
  en sus primeros términos, pero falla al final.


  Secuencia sospechosa: $3, 7, 11, 16$

  1. $7 - 3 = 4$

  2. $11 - 7 = 4$

  3. $16 - 11 = 5$ $\rightarrow$ **¡Fallo!** Aunque empezó como P.A, no lo es. La regla se
  rompió.


  Otro caso de confusión son las sucesiones alternadas ($1, -1, 1, -1$). Al restar: $(-1)
  - 1 = -2$. Luego: $1 - (-1) = 2$. Como $-2$ es distinto de $2$, tampoco es una progresión
  aritmética.'
definiciones_clave: '- **Reconocimiento de una progresión aritmética a partir de sus términos**:
  Concepto fundamental dentro del estudio de Progresión aritmética.'
propiedades_relaciones: '- **Propiedades de Reconocimiento de una progresión aritmética a
  partir de sus términos**: Relaciones de cambio y fórmulas estructurales de progresión aritmética.'
ejemplo_guiado:
  enunciado: Determina si la sucesión 2, 5, 9, 14 es una progresión aritmética.
  pasos:
  - 'Resto el segundo menos el primero: 5 menos 2 es igual a 3.'
  - 'Resto el tercero menos el segundo: 9 menos 5 es igual a 4. Como 4 es distinto de 3, la
    regla ya no se cumple.'
  - Concluyo que no es una progresión aritmética, porque las diferencias no son constantes.
