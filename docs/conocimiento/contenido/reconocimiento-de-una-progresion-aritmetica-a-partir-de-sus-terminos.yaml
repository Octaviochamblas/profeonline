semantic_id: MAT.NUM.PROG_ARITMETICA.RECONOCIMIENTO
resumen_inicial: 'El reconocimiento de una progresión aritmética exige comprobar que las restas entre pares de términos consecutivos adyacentes arrojen exactamente el mismo valor constante $d$.'
explicacion_simple: |
  Si te presentan una lista de números (por ejemplo: $4, 7, 10, 14, 17$) y te preguntan **si es o no una progresión aritmética**:
  1. Restas el 2º término menos el 1º: $7 - 4 = 3$.
  2. Restas el 3º término menos el 2º: $10 - 7 = 3$.
  3. Restas el 4º término menos el 3º: $14 - 10 = 4$.
  ¡Atención! Como la resta dio $3$ al principio pero luego dio $4$, el salto no es constante. Por lo tanto, esa lista **NO es una progresión aritmética**. Para serlo, absolutamente todos los saltos deben dar el mismo número.
explicacion_formal: |
  ### Definición formal
  Dada una secuencia finita de términos $(a_1, a_2, a_3, \dots, a_k)$, es una **progresión aritmética** si y solo si el operador de diferencia primera $\Delta a_i$ satisface la condición de constancia estricta:
  $$\Delta a_1 = \Delta a_2 = \dots = \Delta a_{k-1} = d$$
  donde $\Delta a_i = a_{i+1} - a_i$.

  ### Criterio de verificación paso a paso
  1. Calcular $d_1 = a_2 - a_1$.
  2. Calcular $d_2 = a_3 - a_2$.
  3. Calcular $d_{k-1} = a_k - a_{k-1}$.
  4. Si $d_1 = d_2 = \dots = d_{k-1} \implies$ Es una P.A. de diferencia $d = d_1$.
  5. Si al menos una diferencia $d_i \neq d_j \implies$ No es una P.A.

  ### Síntesis didáctica
  - Test de constancia: $a_2 - a_1 = a_3 - a_2 = a_4 - a_3 = \dots = d$.
  - Un solo salto diferente invalida la condición de P.A.
definiciones_clave: |
  - **Test de diferencia constante**: Evaluación sistemática de las restas de todos los pares adyacentes de una muestra.
  - **Invarianza diferencial**: Propiedad por la cual la resta $a_{n+1} - a_n$ permanece inalterada a lo largo de toda la secuencia.
  - **Secuencia no aritmética**: Lista de números cuyo patrón de crecimiento no es lineal o cuya diferencia cambia.
propiedades_relaciones: |
  - **Diferencia con progresiones geométricas**: En una P.A. se comprueba la constancia de la RESTA ($a_{n+1} - a_n = d$); en una P.G. se comprueba la constancia de la DIVISION ($\frac{a_{n+1}}{a_n} = q$).
  - **Sensibilidad a la muestra completa**: No basta con que los primeros dos pares coincidan; se debe verificar toda la extensión de la lista conocida.
ejemplo_guiado:
  enunciado: 'Determina si la secuencia $12, 19, 26, 33, 40$ es una progresión aritmética.'
  pasos:
    - 'Paso 1: Evaluamos el primer par: $a_2 - a_1 = 19 - 12 = 7$.'
    - 'Paso 2: Evaluamos el segundo par: $a_3 - a_2 = 26 - 19 = 7$.'
    - 'Paso 3: Evaluamos el tercer par: $a_4 - a_3 = 33 - 26 = 7$.'
    - 'Paso 4: Evaluamos el cuarto par: $a_5 - a_4 = 40 - 33 = 7$. Como todas las restas entregan exactamente el mismo valor constante ($d = 7$), la secuencia **sí es una progresión aritmética**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué prueba matemática permite confirmar que una lista dada de 5 números forma una progresión aritmética?'
    choices:
      - {text: 'Calcular las restas $a_2 - a_1$, $a_3 - a_2$, $a_4 - a_3$ y $a_5 - a_4$ y verificar que todas sean iguales', is_correct: true}
      - {text: 'Sumar los 5 números y verificar que el resultado sea un número par', is_correct: false}
      - {text: 'Dividir el último número entre el primero y comprobar que sea un entero', is_correct: false}
      - {text: 'Multiplicar el primer número por el quinto', is_correct: false}
    explanation: 'La alternativa correcta es ''Calcular las restas $a_2 - a_1$, $a_3 - a_2$, $a_4 - a_3$ y $a_5 - a_4$ y verificar que todas sean iguales''. Es el test de diferencia constante.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la lista $2, 4, 8, 16, 32$, ¿es una progresión aritmética?'
    choices:
      - {text: 'No, porque las restas no son constantes ($4-2=2$, mientras que $8-4=4$)', is_correct: true}
      - {text: 'Sí, porque son todos números pares', is_correct: false}
      - {text: 'Sí, porque van aumentando de forma constante', is_correct: false}
      - {text: 'Sí, porque la diferencia es 2', is_correct: false}
    explanation: 'La alternativa correcta es ''No, porque las restas no son constantes ($4-2=2$, mientras que $8-4=4$)''. Es una progresión geométrica, no aritmética.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar los elementos de la secuencia dada en su orden de aparición.'
  - 'Paso 2: Restar consecutivamente cada término menos el que le antecede.'
  - 'Paso 3: Comparar todos los resultados obtenidos.'
  - 'Paso 4: Si todos los resultados son iguales, la lista es una P.A.; si algún resultado difiere, la lista no es una P.A.'
errores_correccion: |
  - **Error 1:** Declarar que es una P.A. revisando únicamente la resta entre los dos primeros términos. **Cómo corregirlo:** Se debe **verificar la diferencia en TODOS los pares de términos de la muestra**.
  - **Error 2:** Confundir un patrón multiplicativo (geométrico) con uno aditivo (aritmético). **Cómo corregirlo:** La P.A. exige que la **RESTA sea constante**, no la multiplicación.
ejemplos:
  - titulo: 'Verificación de P.A. válida'
    enunciado: '¿La lista $100, 90, 80, 70, 60$ es una progresión aritmética?'
    alternativas:
      - 'Sí, todas las restas valen -10'
      - 'No, porque es decreciente'
      - 'No, porque termina en 60'
    respuesta: 'Sí, todas las restas valen -10'
    solucion_pasos:
      - '1. Restas: $90-100 = -10, 80-90 = -10, 70-80 = -10, 60-70 = -10$.'
      - '2. La diferencia $d = -10$ es constante $\implies$ Sí es P.A.'
  - titulo: 'Verificación de secuencia no aritmética'
    enunciado: '¿La secuencia $1, 3, 6, 10, 15$ es una P.A.?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Restas: $3-1=2, 6-3=3, 10-6=4$. Las restas cambian.'
  - titulo: 'Verificación de P.A. fraccionaria'
    enunciado: '¿La secuencia $1, \frac{4}{3}, \frac{5}{3}, 2$ es una P.A.?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Restas: $4/3 - 1 = 1/3, 5/3 - 4/3 = 1/3, 2 - 5/3 = 1/3$. $d = 1/3$.'
  - titulo: 'Verificación con trampa al final'
    enunciado: '¿La secuencia $5, 10, 15, 20, 26$ es una P.A.?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Las primeras restas dan 5, pero la última da $26-20 = 6$. No es P.A.'
errores_frecuentes:
  - 'Validar que una secuencia es aritmética probando sólo los primeros dos números.'
  - 'Una progresión con diferencia negativa es siempre inválida para el cálculo de índices.'
  - 'La posición ordinal $n$ y el valor numérico del término $a_n$ son numéricamente idénticos en la ecuación.'
  - 'Una regla multiplicativa constante equivale algebraicamente a una regla aditiva en una P.A.'
  - 'No considerar los signos negativos al restar términos en sucesiones decrecientes.'
afirmaciones_verdaderas:
  - 'Una secuencia es una progresión aritmética si y solo si las restas de todos sus términos consecutivos adyacentes arrojan el mismo resultado.'
  - 'Si una sola resta entre términos consecutivos es distinta de las demás, la secuencia no es una progresión aritmética.'
al_terminar_debes_poder: 'Reconocer si una secuencia numérica dada es o no una progresión aritmética verificando la constancia de $a_{n+1} - a_n$.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
