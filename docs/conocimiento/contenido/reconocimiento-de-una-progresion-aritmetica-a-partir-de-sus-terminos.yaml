  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcula la diferencia entre el 2do y 1er término.'
- 'Paso 2: Calcula la diferencia entre el 3er y 2do término.'
- 'Paso 3: Continúa hasta agotar los números visibles.'
- 'Paso 4: Si absolutamente todas las restas dan el mismo número, puedes declararla oficialmente
  como P.A.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en reconocimiento de una progresión aritmética a partir de sus términos.
ejemplos:
- titulo: Desenmascarando al infiltrado
  enunciado: ¿Es $1/2, 1, 3/2, 2, 5/2$ una Progresión Aritmética?
  solucion_pasos:
  - 'Pasamos a decimales para verlo fácil: 0.5, 1.0, 1.5, 2.0, 2.5.'
  - 1.0 - 0.5 = 0.5
  - 1.5 - 1.0 = 0.5
  - 2.0 - 1.5 = 0.5
  - 2.5 - 2.0 = 0.5
  - Sí lo es, la diferencia constante es 0.5 (o 1/2).
- titulo: Ejemplo 1
  enunciado: ¿Es 3, 6, 10, 13 una progresión aritmética?
  alternativas:
  - 'No'
  - Sí
  - Solo si se ordena distinto
  respuesta: 'No'
  solucion_pasos:
  - 6 menos 3 es 3, pero 10 menos 6 es 4; las diferencias no son iguales.
- titulo: Ejemplo 2
  enunciado: ¿Cuál sucesión sí es una progresión aritmética?
  alternativas:
  - -5, -2, 1, 4
  - 1, 2, 4, 8
  - 2, 4, 7, 11
  respuesta: -5, -2, 1, 4
  solucion_pasos:
  - Todas sus diferencias consecutivas son 3.
- titulo: ¿Se puede confirmar que una sucesión es aritmética revisando solo dos términos?
  respuesta: 'No'
  solucion_pasos:
  - Hace falta comprobar la diferencia entre todos los pares consecutivos disponibles.
- titulo: ¿Una progresión aritmética puede tener términos con fracciones?
  respuesta: Sí
  solucion_pasos:
  - Por ejemplo 1/2, 1, 3/2, 2, con diferencia constante 1/2.
errores_frecuentes:
- Comprobar solo los primeros dos números y asumir que la regla se mantiene para el resto.
- 'Confundir una sucesión geométrica (donde se multiplica, ej: 2, 4, 8) con una aritmética.'
- Declarar una sucesión como progresión aritmética revisando solo el primer par de términos.
- Comparar términos con fracciones sin convertirlos antes a decimales.
- Creer que una progresión aritmética no puede tener términos negativos.
afirmaciones_verdaderas:
- La formulación de reconocimiento de una progresión aritmética a partir de sus términos mantiene
  la regularidad de la sucesión.
- Para confirmar que una sucesión es una progresión aritmética hay que comprobar la diferencia
  en todos los pares de términos consecutivos disponibles, no solo en el primero.
al_terminar_debes_poder: Resolver problemas prácticos utilizando reconocimiento de una progresión
  aritmética a partir de sus términos.
