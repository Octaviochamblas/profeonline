resumen_inicial: El reconocimiento de una progresión aritmética exige comprobar que
  la diferencia $a_{k+1} - a_k$ sea constante para todos los pares consecutivamente
  dados en la muestra numérica.
explicacion_simple: Para saber si una lista dada es una progresión aritmética, revisamos
  las restas entre vecinos. Si todas las restas dan exactamente el mismo número, la
  lista es una progresión aritmética.
explicacion_formal: 'Dada la secuencia $(x_1, x_2, x_3, \dots, x_N)$, el **Criterio
  de Reconocimiento P.A.** evalúa el sistema de diferencias:


  $$\Delta_1 = x_2 - x_1, \quad \Delta_2 = x_3 - x_2, \dots, \Delta_{N-1} = x_N -
  x_{N-1}$$


  $$\text{Es P.A. } \iff \Delta_1 = \Delta_2 = \dots = \Delta_{N-1} = d$$'
definiciones_clave: '- **Reconocimiento P.A.**: Criterio de verificación $\Delta_k
  = d$ constante para toda la secuencia.'
propiedades_relaciones: '- **Invarianza de diferencia**: Si una sola resta difiere,
  la secuencia NO es una progresión aritmética.'
ejemplo_guiado:
  enunciado: Determine si la sucesión $(4, 9, 14, 20)$ es una progresión aritmética.
  pasos:
  - 'Paso 1: $a_2 - a_1 = 9 - 4 = 5$.'
  - 'Paso 2: $a_3 - a_2 = 14 - 9 = 5$.'
  - 'Paso 3: $a_4 - a_3 = 20 - 14 = 6$.'
  - 'Paso 4: Comparar diferencias: la última diferencia ($6$) es distinta a las anteriores
    ($5$).'
  - 'Conclusión: NO es una progresión aritmética porque las diferencias no son constantes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué se debe verificar para confirmar que una lista de números es una
    progresión aritmética?
  choices:
  - text: Que la resta entre cualquier término y su anterior dé exactamente el mismo
      número en toda la lista
    is_correct: true
  - text: Que la suma de todos dé cien
    is_correct: false
  - text: Que los números sean todos impares
    is_correct: false
  - text: Que el primer número sea cero
    is_correct: false
  explanation: La alternativa correcta es 'Que la resta entre cualquier término y
    su anterior dé exactamente el mismo número en toda la lista'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (4, 9, 14, 20), ¿por qué NO se clasificó como
    P.A.?
  choices:
  - text: Porque la última diferencia (20 - 14 = 6) fue distinta a la diferencia previa
      de 5
    is_correct: true
  - text: Porque todos los números son pares
    is_correct: false
  - text: Because es una multiplicación
    is_correct: false
  - text: Porque comenzó en 4
    is_correct: false
  explanation: La alternativa correcta es 'Porque la última diferencia (20 - 14 =
    6) fue distinta a la diferencia previa de 5'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de reconocer si una secuencia es
  una progresión aritmética verificando la constancia de todas sus diferencias sucesivas.
semantic_id: MAT.NUM.PROG_ARITMETICA.RECONOCIMIENTO
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una diferencia aditiva constante $d
  = a_{n+1} - a_n$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 + (n - 1)d$ o de la suma
  $S_n = \frac{n(a_1 + a_n)}{2}$.'
- 'Paso 3: Resolver numéricamente el parámetro solicitado ($a_n, a_1, d, n$ o $S_n$).'
errores_correccion: '- **Error 1: Multiplicar la diferencia por $n$ en lugar de $(n-1)$
  en la fórmula del término general ($a_n = a_1 + n \cdot d$).** **Cómo corregirlo:**
  La diferencia $d$ se aplica a partir de la segunda posición, por lo que se multiplica
  por $(n-1)$.


  - **Error 2: Restar los términos en orden inverso al hallar la diferencia ($d =
  a_n - a_{n+1}$).** **Cómo corregirlo:** La diferencia DEBE calcularse restando el
  término posterior menos el anterior ($a_{n+1} - a_n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_ARITMETICA.RECONOCIMIENTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión aritmética.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} - a_n = d$.
- titulo: ¿Es constante la diferencia entre términos consecutivos en una P.A.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión aritmética.
- titulo: ¿Equivale la suma Sn al promedio de extremos multiplicado por el número
    de términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $S_n = \frac{n(a_1 + a_n)}{2}$.
errores_frecuentes:
- Multiplicar la diferencia común d por n en lugar de multiplicar por (n - 1) al calcular
  an.
- Restar el término posterior del término anterior al calcular el valor de la diferencia
  d.
- Sumar directamente los términos de los extremos sin dividir entre dos al calcular
  Sn.
- Declarar que una progresión con diferencia negativa es siempre invalida para el
  cálculo de índices.
- Declarar la posición ordinal n con el valor numérico del término an en la ecuación.
afirmaciones_verdaderas:
- Una progresión aritmética tiene una diferencia constante $d = a_{n+1} - a_n$ entre
  términos consecutivos.
- El término de cualquier posición $n$ se calcula mediante $a_n = a_1 + (n - 1) \cdot
  d$.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / PAES.
estado: publicado
