procedimiento:
- 'Paso 1: Calcula la diferencia entre el 2do y 1er término.'
- 'Paso 2: Calcula la diferencia entre el 3er y 2do término.'
- 'Paso 3: Continúa hasta agotar los números visibles.'
- 'Paso 4: Si absolutamente todas las restas dan el mismo número, puedes declararla
  oficialmente como P.A.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en reconocimiento de una progresión aritmética a partir de sus términos.
ejemplos:
- titulo: Desenmascarando al infiltrado
  enunciado: ¿Es $1/2, 1, 3/2, 2, 5/2$ una Progresión Aritmética?
  solucion_pasos:
  - 'Pasamos a decimales para verlo fácil: 0.5, 1.0, 1.5, 2.0, 2.5.'
  - 1.0 - 0.5 = 0.5
  - 1.5 - 1.0 = 0.5
  - 2.0 - 1.5 = 0.5
  - 2.5 - 2.0 = 0.5
  - Sí lo es, la diferencia constante es 0.5 (o 1/2).
errores_frecuentes:
- Comprobar solo los primeros dos números y asumir que la regla se mantiene para el
  resto.
- 'Confundir una sucesión geométrica (donde se multiplica, ej: 2, 4, 8) con una aritmética.'
afirmaciones_verdaderas:
- La formulación de reconocimiento de una progresión aritmética a partir de sus términos
  mantiene la regularidad de la sucesión.
al_terminar_debes_ponder: Resolver problemas prácticos utilizando reconocimiento de
  una progresión aritmética a partir de sus términos.
