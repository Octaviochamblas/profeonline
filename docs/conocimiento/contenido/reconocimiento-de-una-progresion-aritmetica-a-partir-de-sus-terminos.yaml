semantic_id: MAT.NUM.PROG_ARITMETICA.RECONOCIMIENTO
resumen_inicial: 'El reconocimiento de una progresión aritmética verifica que todas las diferencias consecutivas sean constantes ($a_2 - a_1 = a_3 - a_2 = \dots = d$) o que el término central sea la media aritmética de sus adyacentes.'
explicacion_simple: |
  Para saber si una lista de números es una **progresión aritmética**:
  - Restas cada número con el que tiene justo a la izquierda:
    $$a_2 - a_1, \quad a_3 - a_2, \quad a_4 - a_3, \dots$$
  - Si **todos los resultados dan exactamente el mismo número**, ¡es una PA!
  - Si al menos una resta da un número diferente, **NO es una PA**.
  - Por ejemplo, en $4, 9, 14, 19, 24$, las restas son $5, 5, 5, 5 \implies$ Sí es PA.
  - En $2, 4, 8, 16$, las restas son $2, 4, 8 \implies$ No es PA (las diferencias van cambiando).

  ![Reconocimiento de una PA a partir de sus términos](/static/img/nodos/reconocimiento-de-una-progresion-aritmetica-a-partir-de-sus-terminos-intro.svg)
explicacion_formal: |
  ### Definición formal
  Un conjunto ordenado de $k$ términos $\{a_1, a_2, \dots, a_k\}$ ($k \ge 3$) constituye una **progresión aritmética finita** si y solo si se verifica la condición de invariancia diferencial:
  $$\Delta a_1 = \Delta a_2 = \dots = \Delta a_{k-1} = d$$
  donde $\Delta a_i = a_{i+1} - a_i$.

  ### Criterio de la Media Aritmética Local
  Una condición equivalente para todo trío de términos consecutivos $(a_{n-1}, a_n, a_{n+1})$ es:
  $$a_n = \frac{a_{n-1} + a_{n+1}}{2} \iff 2a_n = a_{n-1} + a_{n+1}$$

  ### Distinción Frente a Otras Sucesiones
  - **Progresión Geométrica**: Cocientes constantes ($a_{n+1} / a_n = r$).
  - **Sucesión Cuadrática**: Segundas diferencias constantes ($\Delta^2 a_n = 	ext{cte}$).
  - **Sucesión de Fibonacci**: $a_n = a_{n-1} + a_{n-2}$ (diferencias crecientes).

  ### Síntesis didáctica
  - Regla de prueba: $a_{k+1} - a_k = d$ constante para todo $k$.
  - Propiedad: $2a_k = a_{k-1} + a_{k+1}$.
definiciones_clave: |
  - **Criterio de equidistancia**: Propiedad de las PA donde cada término equidistante mantiene diferencias constantes.
  - **Media aritmética local**: Propiedad donde cada término no extremo es el promedio exacto de sus dos vecinos.
  - **Segunda diferencia**: Diferencia entre las diferencias consecutivas (debe ser cero en una PA).
propiedades_relaciones: |
  - **Comprobación exhaustiva**: Para certificar que una secuencia finita es PA, se deben evaluar todas las diferencias consecutivas disponibles.
  - **Gráfica colineal**: Si se grafican los puntos $(n, a_n)$, estos quedan perfectamente alineados sobre una línea recta.
ejemplo_guiado:
  enunciado: 'Determina si la secuencia $(3, 8, 13, 18, 23)$ es una progresión aritmética utilizando el criterio de diferencias y verifica la media aritmética en el término central.'
  imagen: '/static/img/nodos/reconocimiento-de-una-progresion-aritmetica-a-partir-de-sus-terminos-ejemplos.svg'
  pasos:
    - 'Paso 1: Calculamos todas las diferencias consecutivas:'
    - '  - $a_2 - a_1 = 8 - 3 = 5$'
    - '  - $a_3 - a_2 = 13 - 8 = 5$'
    - '  - $a_4 - a_3 = 18 - 13 = 5$'
    - '  - $a_5 - a_4 = 23 - 18 = 5$'
    - 'Paso 2: Como todas las diferencias son iguales a $5$, **sí es una progresión aritmética con $d = 5$**.'
    - 'Paso 3: Verificamos el término central $a_3 = 13$ con sus vecinos $a_2 = 8$ y $a_4 = 18$: $\frac{8 + 18}{2} = \frac{26}{2} = 13$. Se cumple la media aritmética.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué propiedad matemática cumplen obligatoriamente tres términos consecutivos $(x, y, z)$ de una progresión aritmética?'
    choices:
      - {text: '$y = \frac{x + z}{2}$ (el término central es la media aritmética de los extremos)', is_correct: true}
      - {text: '$y = \sqrt{x \cdot z}$ (media geométrica)', is_correct: false}
      - {text: '$y = x \cdot z$', is_correct: false}
      - {text: '$x + y + z = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$y = \frac{x + z}{2}$ (el término central es la media aritmética de los extremos)''. En toda PA, el término medio equidista de sus vecinos adyacentes.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes secuencias corresponde a una progresión aritmética?'
    choices:
      - {text: '$(10, 16, 22, 28, 34)$, con diferencia constante $d=6$', is_correct: true}
      - {text: '$(1, 2, 4, 8, 16)$, con diferencias crecientes', is_correct: false}
      - {text: '$(1, 4, 9, 16, 25)$, de cuadrados perfectos', is_correct: false}
      - {text: '$(5, 8, 12, 17, 23)$, con diferencias $3, 4, 5, 6$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(10, 16, 22, 28, 34)$, con diferencia constante $d=6$''. Presenta diferencias idénticas: $16-10=6, 22-16=6, 28-22=6, 34-28=6$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular todas las restas consecutivas $a_{k+1} - a_k$ para $k = 1, 2, \dots, n-1$.'
  - 'Paso 2: Comparar los valores de las restas.'
  - 'Paso 3: Si todos los valores son idénticos, concluir que la secuencia es una PA con diferencia común $d$.'
  - 'Paso 4: Si al menos una resta difiere, concluir que la secuencia no es una PA.'
errores_correccion: |
  - **Error 1:** Probar la resta en una sola pareja y concluir precipitadamente que es PA (ej: en $2, 4, 7$, restar $4-2=2$ e ignorar $7-4=3$). **Cómo corregirlo:** Se deben **calcular y comparar todas las diferencias consecutivas** disponibles.
  - **Error 2:** Confundir secuencias de potencias ($2, 4, 8, 16$) con progresiones aritméticas. **Cómo corregirlo:** Las potencias tienen **cociente constante** (son geométricas), no diferencia aditiva constante.
ejemplos:
  - titulo: 'Verificación de PA aditiva'
    enunciado: '¿La secuencia $100, 85, 70, 55, 40$ es una progresión aritmética?'
    alternativas:
      - 'Sí, es una PA con diferencia constante $d = -15$'
      - 'No, las diferencias no son constantes'
      - 'No, los términos son decrecientes'
    respuesta: 'Sí, es una PA con diferencia constante $d = -15$'
    solucion_pasos:
      - '1. $85-100=-15, 70-85=-15, 55-70=-15, 40-55=-15$.'
  - titulo: 'Detección de no-PA'
    enunciado: '¿La secuencia $1, 3, 6, 10, 15$ es una progresión aritmética?'
    alternativas:
      - 'No, porque las diferencias son $2, 3, 4, 5$ (variables)'
      - 'Sí, porque los números van aumentando'
      - 'Sí, con diferencia $d=2$'
    respuesta: 'No, porque las diferencias son $2, 3, 4, 5$ (variables)'
    solucion_pasos:
      - '1. Las diferencias no son constantes: $3-1=2 \neq 6-3=3$.'
  - titulo: 'Media aritmética entre términos'
    enunciado: 'En la PA $(6, x, 14)$, ¿el valor de $x$ es necesariamente $10$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $x = (6 + 14) / 2 = 20 / 2 = 10$.'
  - titulo: 'Sucesión cuadrática vs PA'
    enunciado: '¿La sucesión de cuadrados $1, 4, 9, 16, 25$ es una progresión aritmética?'
    alternativas:
      - 'No, sus primeras diferencias son $3, 5, 7, 9$'
      - 'Sí, porque sigue un patrón algebraico'
      - 'Sí, con diferencia 3'
    respuesta: 'No, sus primeras diferencias son $3, 5, 7, 9$'
    solucion_pasos:
      - '1. Las diferencias no son constantes.'
errores_frecuentes:
  - 'Una sucesión es clasificada como progresión aritmética comprobando la diferencia únicamente en los dos primeros términos.'
  - 'La secuencia de potencias de base dos ($2, 4, 8, 16, 32$) es una progresión aritmética.'
  - 'El término central de tres elementos consecutivos en una PA es igual al producto de los extremos.'
  - 'Una sucesión numérica con términos decrecientes no puede ser una progresión aritmética.'
  - 'Las sucesiones cuadráticas presentan diferencias consecutivas constantes de primer orden.'
afirmaciones_verdaderas:
  - 'Una lista de números es una progresión aritmética si y solo si la resta entre cada término y su predecesor es exactamente la misma constante $d$.'
  - 'En cualquier progresión aritmética, cada término no extremo es la media aritmética exacta de sus dos términos adyacentes ($a_n = \frac{a_{n-1} + a_{n+1}}{2}$).'
