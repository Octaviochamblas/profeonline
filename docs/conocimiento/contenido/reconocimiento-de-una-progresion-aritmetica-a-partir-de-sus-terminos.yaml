  QUÉ: Reconocer y verificar si una secuencia dada constituye una progresión aritmética.
  CÓMO: Comprobar la constancia de las diferencias consecutivas $a_{k+1} - a_k = d$ y verificar el criterio de media aritmética local $2a_k = a_{k-1} + a_{k+1}$.
