semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.EQUIVALENCIA_EXPONENCIAL
resumen_inicial: 'La conversión entre forma logarítmica y forma exponencial aplica la equivalencia $\log_b(a) = c \iff b^c = a$ para despejar variables en exponentes o argumentos.'
explicacion_simple: |
  Las formas logarítmica y exponencial son dos idiomas diferentes para decir exactamente lo mismo. Para pasar del idioma logarítmico $\log_b(a) = c$ al exponencial, tomamos la base del subíndice $b$, la elevamos al resultado $c$ del otro lado de la igualdad, y eso nos da el argumento $a$ ($b^c = a$). Esta herramienta es la llave maestra para despejar incógnitas atrapadas dentro de un logaritmo.
explicacion_formal: |
  ### Definición formal
  La **conversión de representación de equivalencia** es un isomorfismo algebraico directo entre el lenguaje logarítmico y el lenguaje exponencial definido por el bicondicional:
  $$\forall a \in \mathbb{R}^+, b \in \mathbb{R}^+ \setminus \{1\}, c \in \mathbb{R}: \quad \log_b(a) = c \iff b^c = a$$

  ### Desglose simbólico
  - De Logarítmica a Exponencial:
    $$\log_b(x) = y \implies b^y = x$$
  - De Exponencial a Logarítmica:
    $$m^n = p \implies \log_m(p) = n$$
  - Técnica del "Bucle de Conversión": La base $b$ empuja hacia arriba al número $c$ del lado opuesto, convirtiéndolo en su exponente: $b \to b^c = a$.

  ### Síntesis didáctica
  Diferenciar posición de los elementos: En ambas formas, la base $b$ sigue siendo la base (subíndice en el logaritmo, base en la potencia). El resultado del logaritmo $c$ pasa a ser el exponente de la potencia, y el argumento $a$ pasa a ser el resultado de la potencia.
definiciones_clave: |
  - **Forma logarítmica**: Igualdad escrita en la estructura $\log_b(a) = c$.
  - **Forma exponencial**: Igualdad escrita en la estructura $b^c = a$.
  - **Bicondicional de conversión**: Propiedad que permite transitar libremente entre ambas representaciones sin alterar el valor de verdad.
propiedades_relaciones: |
  - **Resolución de ecuaciones logarítmicas básicas**: Si $\log_b(x) = c$, la conversión entrega directamente la solución explícita $x = b^c$.
  - **Resolución de ecuaciones exponenciales simples**: Si $b^x = a$, la conversión entrega el valor exacto $x = \log_b(a)$.
ejemplo_guiado:
  enunciado: 'Aplica la conversión de equivalencia para resolver las siguientes incógnitas: A) Halla $x$ en $\log_4(x) = 3$, B) Halla $y$ en $\log_y(49) = 2$, C) Convierte $e^5 = k$ a forma logarítmica.'
  pasos:
    - 'Paso 1: Para $\log_4(x) = 3$, convertimos a forma exponencial: $4^3 = x \implies x = 64$.'
    - 'Paso 2: Para $\log_y(49) = 2$, convertimos a forma exponencial: $y^2 = 49$. Como la base $y$ debe ser positiva ($y > 0$), $y = \sqrt{49} = 7$.'
    - 'Paso 3: Para $e^5 = k$, convertimos a forma logarítmica en base $e$: $\log_e(k) = 5 \implies \ln(k) = 5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor de la incógnita $x$ que satisface la ecuación logarítmica $\log_3(x) = 4$?'
    choices:
      - {text: '$x = 81$, aplicando la conversión a forma exponencial $3^4 = x$', is_correct: true}
      - {text: '$x = 12$, multiplicando $3 \cdot 4 = 12$', is_correct: false}
      - {text: '$x = 64$, elevando $4^3 = 64$', is_correct: false}
      - {text: '$x = \frac{4}{3}$, dividiendo $4 / 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 81$, aplicando la conversión a forma exponencial $3^4 = x$''. La base 3 elevada al resultado 4 entrega el argumento $x = 3^4 = 81$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al convertir la igualdad exponencial $10^{-2} = 0.01$ a su correspondiente forma logarítmica, ¿qué expresión se obtiene?'
    choices:
      - {text: '$\log_{10}(0.01) = -2$', is_correct: true}
      - {text: '$\log_{-2}(10) = 0.01$', is_correct: false}
      - {text: '$\log_{0.01}(-2) = 10$', is_correct: false}
      - {text: '$\log_{10}(-2) = 0.01$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\log_{10}(0.01) = -2$''. La base es 10, el argumento es el resultado 0.01 y el valor del logaritmo es el exponente -2.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las tres posiciones en la ecuación dada: base $b$, argumento/resultado $a$, exponente/resultado $c$.'
  - 'Paso 2: Si está en forma logarítmica $\log_b(a) = c$, reescribir como $b^c = a$.'
  - 'Paso 3: Si está en forma exponencial $b^c = a$, reescribir como $\log_b(a) = c$.'
  - 'Paso 4: Resolver la ecuación resultante para despejar la incógnita deseada.'
errores_correccion: |
  - **Error 1:** Confundir la base con el exponente al convertir (ej: escribir $\log_2(x) = 5 \implies x = 5^2 = 25$). **Cómo corregirlo:** El subíndice del logaritmo es la base de la potencia. Por lo tanto, $\log_2(x) = 5 \implies 2^5 = x \implies x = 32$.
  - **Error 2:** Omitir la condición de positivismo de la base cuando se busca $b$ en $\log_b(a) = 2$ (ej: de $b^2 = 16$ concluir $b = \pm 4$). **Cómo corregirlo:** La base de un logaritmo debe ser estrictamente positiva ($b > 0$), por lo que se descarta la solución negativa $b = -4$ conservando únicamente $b = 4$.
ejemplos:
  - titulo: 'Despeje de argumento'
    enunciado: '¿Cuál es el valor de $x$ en $\log_5(x) = -1$?'
    alternativas:
      - '$x = 0.2$'
      - '$x = -5$'
      - '$x = 1$'
    respuesta: '$x = 0.2$'
    solucion_pasos:
      - '1. Convertimos a forma exponencial: $5^{-1} = x$.'
      - '2. $x = \frac{1}{5} = 0.2$.'
  - titulo: 'Despeje de base'
    enunciado: 'Si $\log_b(64) = 3$, ¿el valor de la base es $b = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Convertimos: $b^3 = 64 \implies b = \sqrt[3]{64} = 4$.'
  - titulo: 'Conversión de logaritmo natural'
    enunciado: '¿La ecuación $\ln(x) = 2$ equivale a $x = e^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Dado que $\ln(x) = \log_e(x)$, al pasar a forma exponencial obtenemos $e^2 = x$.'
  - titulo: 'Conversión de potencia de base 10'
    enunciado: '¿La relación $10^4 = 10000$ equivale a $\log(10000) = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La base es 10, el argumento es 10000 y el exponente es 4, dando $\log_{10}(10000) = 4$.'
errores_frecuentes:
  - 'Al convertir $\log_3(x) = 2$ a forma exponencial, la afirmación de que $x = 2^3 = 8$.'
  - 'En la conversión de $\log_b(81) = 4$, la aceptación de una base negativa $b = -3$ como solución válida.'
  - 'La afirmación de que la expresión exponencial $5^3 = 125$ equivale al logaritmo $\log_3(125) = 5$.'
  - 'Al despejar $x$ en $\log_2(x) = 0$, la afirmación de que $x = 0$.'
  - 'La afirmación de que la relación $\ln(y) = x$ equivale a la potencia $y = 10^x$.'
afirmaciones_verdaderas:
  - 'La equivalencia $\log_b(a) = c \iff b^c = a$ permite despejar argumentos, bases o exponentes según cuál sea la incógnita.'
  - 'Al calcular la base $b$ mediante la equivalencia exponencial, solo se aceptan soluciones reales estrictamente positivas y distintas de uno.'
al_terminar_debes_poder: |
  QUÉ: Convertir expresiones algebraicas entre forma logarítmica y forma exponencial.
  CÓMO: Aplicar el principio de biyectividad $\log_b(a) = c \iff b^c = a$, reconociendo el rol de la base $b$, el argumento $a$ y el exponente $c$.
