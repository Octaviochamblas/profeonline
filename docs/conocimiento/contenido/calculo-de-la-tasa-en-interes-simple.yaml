semantic_id: MAT.NUM.INTERES_SIMPLE.TASA_INTERES
resumen_inicial: 'El cálculo de la tasa de interés simple $i$ determina el porcentaje de rendimiento periódico despejando la fórmula del interés: $i = \frac{I}{C \cdot t}$, expresando el resultado final como $r\% = i \cdot 100\%$.'
explicacion_simple: |
  Si prestaste un dinero $C$ durante un tiempo $t$ y recibiste una ganancia $I$, pero quieres saber **qué porcentaje de tasa de interés te cobraron o pagaron**:
  1. Multiplicas el capital por el tiempo ($C \cdot t$).
  2. Divides el interés ganado $I$ entre ese producto: $i = \frac{I}{C \cdot t}$.
  3. Multiplicas el resultado por 100 para tener la tasa en porcentaje $\%$.

  Por ejemplo, si prestaste $\$100.000$ por 2 años y ganaste $\$20.000$: el producto $C \cdot t = 200.000$. Al dividir $20.000 \div 200.000 = 0,10$, lo que multiplicado por 100 da una **tasa anual del $10\%$**.

  ![Cálculo de la tasa de interés simple](/static/img/nodos/calculo-de-la-tasa-en-interes-simple-intro.svg)
explicacion_formal: |
  ### Definición formal
  La **tasa de interés periódica decimal $i$** en un modelo de interés simple expresa la razón de ganancia por unidad de capital y de tiempo, obtenida al aislar la variable $i$:
  $$I = C \cdot i \cdot t \implies i = \frac{I}{C \cdot t} \quad (C > 0, t > 0)$$

  ### Conversión a Tasa Porcentual ($r\%$)
  La tasa $i$ calculada está expresada en formato decimal adimensional por período. Para presentar la tasa nominal porcentual $r\%$:
  $$r\% = \left(\frac{I}{C \cdot t} \cdot 100\right)\%$$

  ### Despeje alternativo desde el Monto Final $M$
  Si los datos conocidos son el monto final $M$ y el capital $C$:
  $$M = C \cdot (1 + i \cdot t) \implies \frac{M}{C} - 1 = i \cdot t \implies i = \frac{M - C}{C \cdot t} = \frac{I}{C \cdot t}$$

  ### Síntesis didáctica
  - Ecuación decimal de la tasa: $i = \frac{I}{C \cdot t}$.
  - Ecuación porcentual de la tasa: $r\% = \left(\frac{I}{C \cdot t}\right) \cdot 100\%$.
definiciones_clave: |
  - **Tasa periódica ($i$)**: Factor decimal que representa la ganancia generada por cada unidad monetaria de capital en un período.
  - **Tasa nominal porcentual ($r\%$)**: Expresión en tanto por ciento de la tasa periódica ($r = i \cdot 100$).
  - **Período de referencia de la tasa**: Unidad de tiempo (anual, mensual, semestral) definida por la medida empleada en $t$.
propiedades_relaciones: |
  - **Inversión con la base temporal**: Para un interés fijo $I$ generado por un capital $C$, a mayor tiempo transcurrido $t$, menor es la tasa de interés periódica $i$ aplicada.
  - **Equivalencia de tasas**: Una tasa anual $r_{\text{anual}}\%$ equivale a una tasa mensual de $r_{\text{mensual}}\% = \frac{r_{\text{anual}}}{12}\%$ a interés simple.
ejemplo_guiado:
  enunciado: 'Un capital de $\$400.000$ generó $\$48.000$ de interés simple en un plazo de $2$ años. Determina la tasa de interés simple anual aplicada.'
  imagen: '/static/img/nodos/calculo-de-la-tasa-en-interes-simple-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los datos: Interés $I = 48.000$, Capital $C = 400.000$, Tiempo $t = 2\text{ años}$.'
    - 'Paso 2: Calculamos el denominador $C \cdot t = 400.000 \cdot 2 = 800.000$.'
    - 'Paso 3: Evaluamos la razón decimal $i = \frac{48.000}{800.000} = 0,06$.'
    - 'Paso 4: Convertimos a porcentaje multiplicando por 100: $r\% = 0,06 \cdot 100 = 6\%$. La tasa es del **$6\%$ anual**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la tasa de interés simple decimal $i$ a partir del interés $I$, el capital $C$ y el tiempo $t$?'
    choices:
      - {text: 'Dividir el interés entre el producto del capital por el tiempo ($i = \frac{I}{C \cdot t}$)', is_correct: true}
      - {text: 'Multiplicar el interés por el capital y el tiempo ($i = I \cdot C \cdot t$)', is_correct: false}
      - {text: 'Dividir el capital entre el interés acumulado', is_correct: false}
      - {text: 'Restar el capital al interés y dividir por el tiempo', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividir el interés entre el producto del capital por el tiempo ($i = \frac{I}{C \cdot t}$)''. Despeja la incógnita $i$ de la ecuación $I = C \cdot i \cdot t$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una inversión de $\$100.000$ rinde $\$5.000$ de interés en $1$ año, ¿cuál es la tasa de interés anual?'
    choices:
      - {text: 'El $5\%$ anual, calculando $\frac{5.000}{100.000 \cdot 1} \cdot 100 = 5\%$', is_correct: true}
      - {text: 'El $50\%$ anual, dividiendo por 10.000', is_correct: false}
      - {text: 'El $0.5\%$ anual, dividiendo por 1.000.000', is_correct: false}
      - {text: 'El $10\%$ anual, duplicando la cifra', is_correct: false}
    explanation: 'La alternativa correcta es ''El $5\%$ anual, calculando $\frac{5.000}{100.000 \cdot 1} \cdot 100 = 5\%$''. $i = 5.000 / 100.000 = 0,05 \implies 5\%$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el interés $I$ (o calcularlo como $M - C$), el capital $C$ y el tiempo $t$.'
  - 'Paso 2: Multiplicar el capital $C$ por el tiempo $t$ en el denominador.'
  - 'Paso 3: Dividir el interés $I$ entre dicho producto para obtener la tasa decimal $i = \frac{I}{C \cdot t}$.'
  - 'Paso 4: Multiplicar $i$ por 100 y añadir el símbolo $\%$ especificando la unidad del período (anual, mensual, etc.).'
errores_correccion: |
  - **Error 1:** Olvidar multiplicar el decimal $i$ por 100 al entregar la respuesta final (ej: responder que la tasa es $0,06$ en lugar de $6\%$). **Cómo corregirlo:** La tasa comercial se expresa en porcentaje; **debes multiplicar por 100 para agregar el símbolo $\%$**: $0,06 \cdot 100 = 6\%$.
  - **Error 2:** Dividir el capital entre el interés (ej: $C / I$). **Cómo corregirlo:** El interés ganado $I$ es la cantidad observada y **va SIEMPRE en el numerador**: **$i = \frac{I}{C \cdot t}$**.
ejemplos:
  - titulo: 'Cálculo de tasa anual simple'
    enunciado: 'Si $C = $\$200.00$0$, $I = $\$30.00$0$ y $t = 3$ años, ¿cuál es la tasa anual aplicada?'
    alternativas:
      - '$5\%$ anual'
      - '$10\%$ anual'
      - '$15\%$ anual'
    respuesta: '$5\%$ anual'
    solucion_pasos:
      - '1. Denominador $C \cdot t = 200.000 \cdot 3 = 600.000$.'
      - '2. Razón decimal $i = 30.000 / 600.000 = 0,05$.'
      - '3. Multiplicamos por 100: $r\% = 0,05 \cdot 100 = 5\%$ anual.'
  - titulo: 'Cálculo de tasa mensual'
    enunciado: 'Si un capital de $\$100.000$ genera $\$2.000$ de interés en 1 mes, ¿cuál es la tasa mensual?'
    alternativas:
      - '$2\%$ mensual'
      - '$20\%$ mensual'
      - '$0,2\%$ mensual'
    respuesta: '$2\%$ mensual'
    solucion_pasos:
      - '1. $i = 2.000 / (100.000 \cdot 1) = 0,02$.'
      - '2. $r\% = 0,02 \cdot 100 = 2\%$ mensual.'
  - titulo: 'Cálculo de tasa a partir del monto final'
    enunciado: 'Si $C = $\$50.00$0$ se transforma en un monto final de $\$60.000$ al cabo de 2 años, ¿cuál es la tasa anual?'
    alternativas:
      - '$10\%$ anual'
      - '$20\%$ anual'
      - '$5\%$ anual'
    respuesta: '$10\%$ anual'
    solucion_pasos:
      - '1. Calculamos el interés: $I = 60.000 - 50.000 = $\$10.00$0$.'
      - '2. $i = 10.000 / (50.000 \cdot 2) = 10.000 / 100.000 = 0,10$.'
      - '3. $r\% = 0,10 \cdot 100 = 10\%$ anual.'
  - titulo: 'Conversión de tasa mensual a anual'
    enunciado: '¿Una tasa simple del $1,5\%$ mensual a cuánto equivale en tasa simple anual?'
    alternativas:
      - '$18\%$ anual'
      - '$15\%$ anual'
      - '$1,5\%$ anual'
    respuesta: '$18\%$ anual'
    solucion_pasos:
      - '1. Un año tiene 12 meses.'
      - '2. En régimen simple: $r_{\text{anual}} = 1,5\% \cdot 12 = 18\%$ anual.'
errores_frecuentes:
  - 'La tasa decimal $i$ obtenida del cociente representa directamente el porcentaje nominal sin requerir la multiplicación por $100$.'
  - 'La tasa de interés se calcula dividiendo el capital inicial entre el interés devengado ($i = \frac{C}{I}$).'
  - 'El tiempo $t$ se ubica en el numerador multiplicando al interés en la fórmula de la tasa ($i = \frac{I \cdot t}{C}$).'
  - 'Un cálculo de tasa con tiempo en meses entrega automáticamente una tasa de periodicidad anual.'
  - 'La tasa de interés simple varía progresivamente en cada período de tiempo transcurrido.'
afirmaciones_verdaderas:
  - 'La tasa de interés decimal se calcula dividiendo el interés por el producto del capital y el tiempo ($i = \frac{I}{C \cdot t}$).'
  - 'Multiplicar la tasa decimal $i$ por $100$ entrega el porcentaje nominal periódico de rendimiento ($r\% = i \cdot 100\%$).'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/calculo-de-la-tasa-en-interes-simple-resumen.svg)

  QUÉ: Calcular la tasa de interés periódica nominal y porcentual en un régimen de interés simple.
  CÓMO: Evaluar el cociente decimal $i = \frac{I}{C \cdot t}$ (o $i = \frac{M - C}{C \cdot t}$) y transformar a porcentaje nominal periódico mediante $r\% = i \cdot 100\%$, respetando la unidad temporal de $t$.
