semantic_id: MAT.NUM.INTERES_SIMPLE.TASA_INTERES
resumen_inicial: 'Cálculo de la tasa en interés simple: concepto y propiedades fundamentales
  en Interés simple.'
explicacion_simple: Prestas 100 y te devuelven 150 después de 2 años. ¡Genial! Pero, ¿qué
  porcentaje de ganancia tuviste exactamente por año? Para comparar negocios, necesitas encontrar
  la Tasa de Interés.
explicacion_formal: 'Para descubrir qué tasa de interés se aplicó a un préstamo o inversión,
  usamos la fórmula básica $I = C \cdot i \cdot t$ y despejamos la $i$:


  $i = \frac{I}{C \cdot t}$


  - **Ojo con los datos:** Necesitas el ''Interés puro ($I$)''. Si el problema te da el Monto
  Final Total ($M$), primero debes calcular el interés restando: $I = M - C$.

  - **El resultado es decimal:** Al hacer la división, obtendrás un número como $0.05$. Para
  responder como porcentaje, debes multiplicar por 100 ($5\%$).

  - **Unidad de tiempo:** La tasa obtenida tendrá la misma unidad que el tiempo $t$ que usaste
  en la fórmula. Si $t$ estaba en meses, la tasa será mensual.'
definiciones_clave: '- **Cálculo de la tasa en interés simple**: Elemento central dentro del
  estudio de Interés simple.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo de la tasa en interés simple.'
ejemplo_guiado:
  enunciado: Te prestaron 40.000 pesos y tras 2 años tuviste que devolver 48.000 pesos en
    total. Calcula la tasa de interés simple anual que te cobraron.
  pasos:
  - 'Calculo el interés puro: 48.000 menos 40.000 es igual a 8.000.'
  - 'Aplico la fórmula: i igual a I dividido entre (C por t), es decir 8.000 dividido entre
    (40.000 por 2).'
  - 'Calculo: 8.000 dividido entre 80.000 es igual a 0,10, es decir un 10% anual.'
