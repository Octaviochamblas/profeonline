resumen_inicial: 'El cálculo de la tasa de interés $i$ despeja el porcentaje periódico
  de ganancia a partir del interés producido $I$ o del monto acumulado $M$: $i = \frac{I}{C
  \cdot t}$.'
explicacion_simple: Si sabemos cuánto dinero colocamos al principio, cuántos años
  duró la inversión y cuánto ganamos, podemos averiguar cuál fue el porcentaje de
  tasa de interés que nos cobraron o nos pagaron por período.
explicacion_formal: 'Dada la ganancia $I$, el capital $C$ y el tiempo $t$, la **Tasa
  de Interés Periódica $i$** se despeja como:


  $$i = \frac{I}{C \cdot t} \implies r\% = \left( \frac{I}{C \cdot t} \right) \cdot
  100\%$$


  **Expresión de la tasa resultante:**

  - Si el tiempo $t$ se introdujo en años, el resultado $r\%$ corresponde automáticamente
  a la tasa de interés ANUAL.'
definiciones_clave: '- **Cálculo de tasa $i$**: Porcentaje periódico $i = \frac{I}{C
  \cdot t}$.'
propiedades_relaciones: '- **Constante de proporcionalidad temporal**: La tasa $i$
  indica la fracción del capital $C$ ganada por unidad de tiempo.'
ejemplo_guiado:
  enunciado: Un préstamo de \$500.000 generó un interés de \$60.000 en $2$ años. Calcule
    la tasa de interés simple anual aplicada.
  pasos:
  - 'Paso 1: Identificar $C = 500.000$, $I = 60.000$ y $t = 2$ años.'
  - 'Paso 2: Aplicar la fórmula $i = \frac{I}{C \cdot t} = \frac{60.000}{500.000 \cdot
    2}$.'
  - 'Paso 3: Resolver el cociente: $i = \frac{60.000}{1.000.000} = 0,06$.'
  - 'Paso 4: Convertir a porcentaje: $0,06 \cdot 100\% = 6\%$.'
  - 'Conclusión: La tasa de interés simple aplicada fue del $6\%$ anual.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula la tasa de interés simple i a partir de I, C y t?
  choices:
  - text: 'Dividiendo el interés producido entre el producto del capital por el tiempo:
      i = I / (C · t)'
    is_correct: true
  - text: Multiplicando i = I · C · t
    is_correct: false
  - text: Restando i = C - I
    is_correct: false
  - text: Dividiendo i = (C · t) / I
    is_correct: false
  explanation: 'La alternativa correcta es ''Dividiendo el interés producido entre
    el producto del capital por el tiempo: i = I / (C · t)''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $500.000 que generó $60.000 en 2 años, ¿cuál
    fue la tasa anual?
  choices:
  - text: 6% anual
    is_correct: true
  - text: 12% anual
    is_correct: false
  - text: 3% anual
    is_correct: false
  - text: 10% anual
    is_correct: false
  explanation: La alternativa correcta es '6% anual'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la tasa de interés periódica
  $i = \frac{I}{C \cdot t}$ expresándola como porcentaje $r\%$.
semantic_id: MAT.NUM.INTERES_SIMPLE.TASA_INTERES
procedimiento:
- 'Paso 1: Identificar los parámetros conocidos ($C, i, t, I, M$) e igualar las unidades
  de tiempo de la tasa y el plazo.'
- 'Paso 2: Sustituir en la fórmula fundamental del interés simple $I = C \cdot i \cdot
  t$ o del monto $M = C \cdot (1 + i \cdot t)$.'
- 'Paso 3: Despejar algebraicamente la variable buscada y comprobar el resultado numérico.'
errores_correccion: '- **Error 1: Ingresar el tiempo en meses cuando la tasa de interés
  es anual sin convertir unidades.** **Cómo corregirlo:** Se DEBE convertir el tiempo
  a años dividiendo entre 12 ($18\text{ meses} = 1,5\text{ años}$) o convertir la
  tasa anual a mensual dividiendo entre 12.


  - **Error 2: Sumar los intereses acumulados al capital inicial en cada período (tratarlo
  como interés compuesto).** **Cómo corregirlo:** En el interés simple el capital
  inicial $C$ permanece CONSTANTE en todos los períodos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_SIMPLE.TASA_INTERES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés simple.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización lineal.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por $M = C(1 + it)$.
- titulo: ¿Son idénticos los intereses ganados en cada período en el interés simple?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se calculan siempre sobre el mismo capital inicial $C$.
- titulo: ¿Debe coincidir la unidad de tiempo del plazo t con la unidad de la tasa
    de interés i?
  respuesta: Sí
  solucion_pasos:
  - Sí, para mantener la homogeneidad dimensional temporal.
errores_frecuentes:
- Ingresar el tiempo en meses manteniendo una tasa de interés expresada en términos
  anuales.
- Recapitalizar los intereses ganados al final de cada período sobre el capital inicial
  en régimen simple.
- Multiplicar por el número entero de la tasa de interés sin dividir previamente por
  cien.
- Declarar el valor del interés ganado $I$ con el monto final total acumulado $M$.
- Dividir el capital entre el tiempo sin incorporar la tasa de interés en el cálculo
  del saldo.
afirmaciones_verdaderas:
- El interés simple se caracteriza por generar ganancias periódicas constantes calculadas
  sobre el capital inicial $C$.
- El monto acumulado final en interés simple es una función lineal del tiempo $M =
  C \cdot (1 + i \cdot t)$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
