procedimiento:
- 'Paso 1: Asegúrate de tener el valor de la ganancia pura ($I$). Si tienes el Monto Final,
  resta el capital inicial ($I = M - C$).'
- 'Paso 2: Divide $I$ por el producto de $(Capital \cdot tiempo)$.'
- 'Paso 3: Multiplica el decimal resultante por 100.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de la tasa
  en interés simple.
ejemplos:
- titulo: Descubriendo la tasa del prestamista
  enunciado: Te prestaron $50.000 y tras 3 meses tuviste que devolver $56.000 en total (capital
    + intereses). ¿Qué tasa de interés simple mensual te cobraron?
  solucion_pasos:
  - 'Calculamos el interés puro: $56.000 - 50.000 = 6.000$.'
  - $i = I / (C \cdot t) = 6000 / (50000 \cdot 3)$.
  - $i = 6000 / 150000 = 0.04$.
  - 'En porcentaje: $0.04 \cdot 100 = 4\%$ mensual.'
- titulo: Ejemplo 2
  enunciado: Se prestan 20.000 pesos y a los 4 años se devuelven 24.000 pesos. ¿Cuál fue la
    tasa anual?
  alternativas:
  - 5%
  - 20%
  - 4%
  respuesta: 5%
  solucion_pasos:
  - (24.000 menos 20.000) dividido entre (20.000 por 4) es igual a 4.000 dividido entre 80.000,
    o sea 0,05, es decir 5%.
- titulo: Ejemplo 3
  enunciado: Un capital de 10.000 pesos generó 1.500 pesos de interés en 3 años. ¿Cuál fue
    la tasa anual?
  alternativas:
  - 5%
  - 15%
  - 1,5%
  respuesta: 5%
  solucion_pasos:
  - 1.500 dividido entre (10.000 por 3) es igual a 0,05, es decir 5%.
- titulo: ¿El resultado de dividir I entre (C por t) se debe multiplicar por 100 para expresarlo
    como porcentaje?
  respuesta: Sí
  solucion_pasos:
  - De lo contrario queda expresado como decimal en vez de porcentaje.
errores_frecuentes:
- Usar el Monto Final ($M$) en lugar del Interés ($I$) en el numerador.
- Olvidar multiplicar por 100 al final y decir que la tasa es del $0.05\%$ (cuando en realidad
  era $5\%$).
- Usar el Monto Final M en lugar del interés puro I en el numerador de la fórmula.
- Olvidar multiplicar por 100 al final, dejando la tasa como decimal en vez de porcentaje.
- Dividir el interés solo por el capital, sin multiplicar por el tiempo transcurrido.
afirmaciones_verdaderas:
- La propiedad de cálculo de la tasa en interés simple preserva la consistencia lógica.
- Para calcular la tasa de interés, primero se debe obtener el interés puro I; si solo se
  conoce el monto final, hay que restarle el capital inicial.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de la tasa en
  interés simple.
