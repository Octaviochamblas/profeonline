semantic_id: MAT.NUM.ENTEROS_OPERATORIA.DIV_SIGNOS_IGUALES
resumen_inicial: 'La división de dos enteros del mismo signo resulta siempre en un
  cociente positivo: $(+) : (+) = +$ y $(-) : (-) = +$.'
explicacion_simple: Al dividir dos números enteros que tienen exactamente el mismo
  signo (ambos positivos o ambos negativos), el cociente resultante es siempre un
  número positivo. Esto ocurre porque la división es la operación inversa de la multiplicación
  y sigue su misma regla de signos.
explicacion_formal: 'Para dos enteros $a, b \in \mathbb{Z}$ con $b \neq 0$ y $\operatorname{sgn}(a)
  = \operatorname{sgn}(b)$ donde $b \mid a$, la **División de Signos Iguales** se
  define como:


  $$a : b = +\left( |a| : |b| \right) > 0$$


  **Desglose de la fórmula:**

  - $|a| : |b|$: Cociente exacto entre las magnitudes absolutas del dividendo y divisor.

  - $+(\dots)$: Signo positivo del cociente asegurado por la concordancia de polaridad.


  > **Complemento didáctico:** $(-24) : (-6) = +4$, pues $(+4) \cdot (-6) = -24$ satisface
  la comprobación multiplicativa.'
definiciones_clave: '- **División exacta de signos iguales**: Operación cociente entre
  enteros de igual polaridad que entrega un resultado positivo.'
propiedades_relaciones: '- **Comprobación multiplicativa**: $a : b = c \iff c \cdot
  b = a$.'
ejemplo_guiado:
  enunciado: 'Calcule la división de enteros negativos $(-35) : (-7)$.'
  pasos:
  - 'Paso 1: Identificar los signos de dividendo y divisor: ambos son negativos.'
  - 'Paso 2: Aplicar la regla de signos iguales para división: $(-) : (-) = +$.'
  - 'Paso 3: Dividir los valores absolutos: $35 : 7 = 5$.'
  - 'Conclusión: $(-35) : (-7) = 5$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuál es el resultado de la división (-48) : (-6)?'
  choices:
  - text: '8'
    is_correct: true
  - text: '-8'
    is_correct: false
  - text: '-42'
    is_correct: false
  - text: '288'
    is_correct: false
  explanation: La alternativa correcta es '8', ya que la división de dos enteros negativos
    da resultado positivo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'En el ejemplo guiado (-35) : (-7), ¿cuál es el resultado final?'
  choices:
  - text: '5'
    is_correct: true
  - text: '-5'
    is_correct: false
  - text: '28'
    is_correct: false
  - text: '-28'
    is_correct: false
  explanation: La alternativa correcta es '5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dividir los valores absolutos del dividendo y divisor.'
- 'Paso 2: Verificar que ambos tengan el mismo signo.'
- 'Paso 3: Asignar un signo positivo ($+$) al cociente resultante.'
errores_correccion: '- **Error 1: Creer que la división de dos negativos da como resultado
  un número negativo.** **Cómo corregirlo:** Al ser de signos iguales, la división
  da positivo: $(-) : (-) = +$.


  - **Error 2: Confundir la división con la resta de negativos.** **Cómo corregirlo:**
  La división busca cuántas veces cabe el divisor en el dividendo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Calcule $(-63) : (-9)$.'
  alternativas:
  - '7'
  - '-7'
  - '54'
  respuesta: '7'
  solucion_pasos:
  - '$(-) : (-) = +$. $63 : 9 = 7$.'
- titulo: Ejemplo 2
  enunciado: 'Si una deuda de $100$ dólares se reparte entre 5 acreedores a los que
    se debe por igual, ¿cuál es el cociente $(-100) : (-5)$?'
  alternativas:
  - '20'
  - '-20'
  - '500'
  respuesta: '20'
  solucion_pasos:
  - '$(-100) : (-5) = 20$.'
- titulo: ¿La división de dos enteros negativos resulta siempre en un cociente positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de signos iguales en división.
- titulo: '¿El cociente (-16) : (-4) es igual a -4?'
  respuesta: 'No'
  solucion_pasos:
  - 'No, $(-16) : (-4) = +4$.'
errores_frecuentes:
- La división de dos números enteros negativos da como resultado un cociente negativo.
- Dividir dos enteros positivos resulta en un número con signo negativo.
- La regla de signos en la división depende de si el dividendo es mayor que el divisor.
- La división de dos enteros de igual signo resulta siempre en el entero cero.
- Dividir un entero negativo entre $-1$ invierte su magnitud a cero.
afirmaciones_verdaderas:
- La división de dos números enteros del mismo signo resulta siempre en un cociente
  positivo.
- 'Tanto $(+) : (+)$ como $(-) : (-)$ producen un cociente de signo positivo.'
al_terminar_debes_poder: Al terminar serás capaz de calcular la división de dos enteros
  de igual signo, dividiendo sus valores absolutos y asignando un signo positivo al
  cociente.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
