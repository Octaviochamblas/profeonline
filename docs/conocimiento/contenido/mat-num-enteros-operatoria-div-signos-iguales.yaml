semantic_id: MAT.NUM.ENTEROS_OPERATORIA.DIV_SIGNOS_IGUALES
resumen_inicial: "Al dividir dos enteros con el mismo signo, el cociente siempre es positivo: $(+)\\div(+)=(+)$ y $(-)\\div(-)=(+)$."
explicacion_simple: |
  La regla de signos para dividir es igual que para multiplicar. Si divides dos números
  que "se ponen de acuerdo" en su signo (ambos positivos o ambos negativos), el resultado
  es positivo. $12\div3=4$ (ambos positivos) y $-12\div(-3)=4$ (ambos negativos): ¡el
  resultado también es positivo!
explicacion_formal: |
  La división es la operación inversa de la multiplicación, por lo que hereda su regla de
  signos: $\frac{+a}{+b}=+(a\div b)$ y $\frac{-a}{-b}=+(a\div b)$. Si $-15\div(-3)=c$,
  entonces $c\cdot(-3)=-15$, y el único $c$ que cumple eso es $c=5$ (positivo).
definiciones_clave: |
  **Cociente**: el resultado de una división. **Dividendo** y **divisor**: el número que
  se divide y el número por el que se divide, respectivamente.
propiedades_relaciones: |
  En $\mathbb{Z}$ la división no siempre es exacta (ej: $5\div2$ no da un entero); esta
  regla de signos aplica a los casos donde el dividendo es múltiplo del divisor.
ejemplo_guiado:
  enunciado: "Calcula $(-72) \\div (-9)$."
  pasos:
    - "Ambos números son negativos: mismo signo."
    - "Se dividen los valores absolutos: $72\\div9=8$."
    - "El resultado es positivo: $8$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué signo tiene el cociente de dos enteros negativos?"
    choices:
      - {text: "Siempre positivo", is_correct: true}
      - {text: "Siempre negativo", is_correct: false}
      - {text: "Depende del divisor", is_correct: false}
      - {text: "No está definido", is_correct: false}
    explanation: "La correcta es Siempre positivo: dividir dos enteros del mismo signo siempre da un cociente positivo."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $(-56) \\div (-8)$?"
    choices:
      - {text: "$7$", is_correct: true}
      - {text: "$-7$", is_correct: false}
      - {text: "$64$", is_correct: false}
      - {text: "$-64$", is_correct: false}
    explanation: "La correcta es $7$: se dividen los valores absolutos ($56\\div8=7$) y el resultado es positivo por tener el mismo signo."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identifica el dividendo y el divisor de la operación y verifica que tengan el mismo signo (ambos positivos o ambos negativos).'
  - 'Paso 2: Calcula la división de los valores absolutos de los números (los números sin su signo).'
  - 'Paso 3: Asigna un signo positivo ($+$) al resultado final, de acuerdo con la ley de signos.'
errores_correccion: |
  Un error frecuente es pensar que dividir dos negativos da negativo. Otro error es
  aplicar la regla de la suma (conservar el signo del de mayor valor absoluto) en vez de
  la regla propia de la división.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Calcula el resultado de la división $(-35) \div (-5)$.'
    alternativas:
      - "$7$"
      - "$-7$"
      - "$-40$"
    respuesta: "$7$"
    solucion_pasos:
      - 'Paso a: Identificamos los signos. Tanto el dividendo ($-35$) como el divisor ($-5$) son negativos, por lo que tienen el mismo signo.'
      - 'Paso b: Dividimos sus valores absolutos: $35 \div 5 = 7$.'
      - 'Paso c: Como los signos son iguales, el resultado es positivo: $+7$ o simplemente $7$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve la expresión $\frac{-100}{-25}$.'
    alternativas:
      - "$4$"
      - "$-4$"
      - "$-125$"
    respuesta: "$4$"
    solucion_pasos:
      - 'Paso a: La fracción representa una división entre dos números negativos: $-100$ y $-25$.'
      - 'Paso b: Dividimos los valores absolutos: $100 \div 25 = 4$.'
      - 'Paso c: Aplicando la regla de signos iguales, el resultado es positivo: $4$.'
  - titulo: '¿Es el resultado de $(-8) \div (-2)$ un número entero positivo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'El dividendo ($-8$) y el divisor ($-2$) tienen el mismo signo (negativo).'
      - 'Calculamos $8 \div 2 = 4$.'
      - 'Por regla de signos iguales, el resultado es $+4$.'
  - titulo: '¿Da el mismo resultado dividir $24 \div 6$ que dividir $(-24) \div (-6)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Para $24 \div 6$, ambos son positivos, por lo que el resultado es $4$.'
      - 'Para $(-24) \div (-6)$, ambos son negativos, por lo que el resultado también es $4$.'
      - 'Por ende, ambas divisiones dan exactamente el mismo resultado.'
errores_frecuentes:
  - 'Creer que la división de dos números negativos da un resultado negativo (ej: $(-12) \div (-3) = -4$).'
  - 'Aplicar la regla de la suma (conservar el signo del mayor) en lugar de la regla de la división (ej: pensar que $(-20) \div (-2) = -10$ porque el $-20$ tiene mayor valor absoluto).'
  - 'Olvidar que el divisor no puede ser cero.'
  - 'Confundir el signo del cociente al resolver ejercicios combinados donde se alternan multiplicaciones y divisiones.'
  - 'Asociar incorrectamente el signo si hay más de una operación de división encadenada sin paréntesis.'
afirmaciones_verdaderas:
  - "Al dividir dos números negativos, el cociente es positivo."
  - "(-10)÷(-2) da como resultado un número positivo."
al_terminar_debes_poder: |
  Dividir dos enteros del mismo signo aplicando correctamente la regla de que el cociente
  siempre es positivo.
fuente: "Matemática 7° Básico Tomo 1 — Enteros, p. 48"
estado: publicado
