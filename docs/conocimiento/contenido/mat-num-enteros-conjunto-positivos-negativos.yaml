semantic_id: MAT.NUM.ENTEROS_CONJUNTO.POSITIVOS_NEGATIVOS
resumen_inicial: "Los enteros positivos están a la derecha del cero y los negativos, marcados con el signo $-$, a la izquierda. El cero no es positivo ni negativo."
explicacion_simple: |
  Imagina una escalera: los peldaños que subes son positivos (1, 2, 3…) y los que bajas son
  negativos (-1, -2, -3…). El piso donde estás parado, sin subir ni bajar, es el cero — que no es
  positivo ni negativo. Los positivos se escriben sin signo (o con un + opcional); los negativos
  siempre llevan el signo − adelante.
explicacion_formal: |
  Los enteros positivos ($\mathbb{Z}^+$) se ubican a la derecha del cero y pueden escribirse con o
  sin el signo $+$ (ej. $+3$ o $3$). Los enteros negativos ($\mathbb{Z}^-$) se ubican a la izquierda
  y llevan obligatoriamente el signo $-$ (ej. $-3$). El cero es neutro: no pertenece a $\mathbb{Z}^+$
  ni a $\mathbb{Z}^-$.
definiciones_clave: |
  **Enteros opuestos**: un número y su correspondiente con signo contrario (ej. $4$ y $-4$).
  **Signo obligatorio**: los negativos siempre requieren el símbolo $-$; los positivos pueden
  omitirlo.
propiedades_relaciones: |
  Todo entero no nulo pertenece a $\mathbb{Z}^+$ o a $\mathbb{Z}^-$, nunca a ambos (por tricotomía).
  Por convención, los negativos representan disminuciones, deudas o profundidades; los positivos,
  aumentos o alturas.
ejemplo_guiado:
  enunciado: "Representa con un número entero la situación: 'la cuenta bancaria bajó en 300 pesos'."
  pasos:
    - "Se identifica la palabra clave 'bajó', que indica una disminución respecto de un saldo de referencia (cero)."
    - "Una disminución se representa con signo negativo."
    - "El número resultante es $-300$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de estas escrituras es obligatoria (no puede omitirse) según la explicación formal?"
    choices:
      - {text: "El signo $+$ en un entero positivo", is_correct: false}
      - {text: "El signo $-$ en un entero negativo", is_correct: true}
      - {text: "Escribir el cero con signo", is_correct: false}
      - {text: "Escribir $3$ como $+3$", is_correct: false}
    explanation: "La correcta es El signo $-$ en un entero negativo: es obligatorio, mientras que el $+$ en los positivos es opcional."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo razonamiento del ejemplo guiado, ¿qué entero representa 'la temperatura subió 4 grados'?"
    choices:
      - {text: "$-4$", is_correct: false}
      - {text: "$4$", is_correct: true}
      - {text: "$0$", is_correct: false}
      - {text: "No se puede representar con un entero", is_correct: false}
    explanation: "La correcta es $4$, porque subir es un aumento y se representa con signo positivo."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Observar el signo que precede al número."
  - 'Paso 2: Si el signo es $-$, clasificarlo como entero negativo ($\mathbb{Z}^-$).'
  - 'Paso 3: Si no tiene signo o tiene un $+$, clasificarlo como entero positivo ($\mathbb{Z}^+$), siempre que sea distinto de cero.'
  - "Paso 4: Si el número es $0$, clasificarlo como elemento neutro (ni positivo ni negativo)."
errores_correccion: |
  Un error frecuente es pensar que el cero es positivo "porque está a la derecha de todos los
  negativos": el cero es neutro, ni positivo ni negativo, sin importar con qué se compare. Otro
  error es creer que un número sin signo escrito es negativo; sin signo explícito, un entero
  distinto de cero es positivo.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: 'Clasifique los siguientes números según su subconjunto en $\mathbb{Z}$: $-5,\ 12,\ 0$.'
    solucion_pasos:
      - '$-5$ tiene signo negativo, por lo tanto pertenece a $\mathbb{Z}^-$.'
      - '$12$ no tiene signo explícito y es mayor que cero: pertenece a $\mathbb{Z}^+$.'
      - "$0$ no es positivo ni negativo: es el elemento neutro."
  - titulo: "Ejemplo 2"
    enunciado: "Represente la situación 'un buzo a 20 metros de profundidad' usando un número entero."
    solucion_pasos:
      - "Se identifica la palabra clave 'profundidad', que indica una posición bajo el nivel del mar (referencia cero)."
      - "Se asigna el signo menos ($-$) por ser una posición menor que cero."
      - "El número resultante es $-20$."
  - titulo: "¿Es $+7$ un entero positivo?"
    respuesta: "Sí"
    solucion_pasos:
      - "El signo $+$ indica que el número está a la derecha del cero en la recta numérica."
      - '$+7 \in \mathbb{Z}^+$ (conjunto de enteros positivos).'
      - "Por lo tanto, $+7$ sí es un entero positivo."
  - titulo: "¿Es el cero un número entero negativo?"
    respuesta: "No"
    solucion_pasos:
      - "El cero no tiene signo positivo ni negativo."
      - '$0$ es el elemento neutro del conjunto $\mathbb{Z}$: $0 \notin \mathbb{Z}^-$ ni $0 \in \mathbb{Z}^+$.'
      - "Por lo tanto, el cero no es negativo."
errores_frecuentes:
  - "El cero es un número entero positivo porque está a la derecha de todos los negativos."
  - "El número $+5$ y el número $5$ son distintos."
  - "Los enteros negativos no son realmente números porque son 'imaginarios'."
  - "El opuesto de un número positivo también es positivo."
  - "Un número sin signo es siempre negativo."
al_terminar_debes_poder: |
  Clasificar cualquier número entero como positivo, negativo o neutro (cero), y traducir situaciones
  cotidianas (deudas, temperaturas, alturas) al entero con signo correcto que las representa.

fuente: "Matemática 7º Básico Tomo 1 p.207"
estado: publicado
