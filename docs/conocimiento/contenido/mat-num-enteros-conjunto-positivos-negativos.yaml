semantic_id: MAT.NUM.ENTEROS_CONJUNTO.POSITIVOS_NEGATIVOS
resumen_inicial: Los enteros se dividen en positivos ($x > 0$), negativos ($x < 0$)
  y el neutro cero ($x = 0$).
explicacion_simple: En el conjunto de los enteros, los números positivos indican valores
  por encima de una referencia (como ganancias o alturas), mientras que los negativos
  expresan pérdidas, faltantes o direcciones opuestas. El cero actúa como el punto
  neutro de separación entre ambas regiones.
explicacion_formal: 'Para cualquier elemento $x \in \mathbb{Z} \setminus \{0\}$, la
  **Partición por Signo** clasifica la cantidad según su posición respecto al origen
  neutro $0$:


  $$x \in \begin{cases} \mathbb{Z}^+ & \text{si } x > 0 \\ \mathbb{Z}^- & \text{si
  } x < 0 \end{cases} \qquad \text{con } 0 \notin \mathbb{Z}^+ \land 0 \notin \mathbb{Z}^-$$


  **Desglose de la fórmula:**

  - $\mathbb{Z}^+$: Conjunto de enteros estrictamente mayores que cero ($x > 0$).

  - $\mathbb{Z}^-$: Conjunto de enteros strictly menores que cero ($x < 0$).

  - $0 \notin \mathbb{Z}^+ \land 0 \notin \mathbb{Z}^-$: Afirmación del carácter neutro
  a-sígnico del cero.


  > **Complemento didáctico:** Los enteros positivos y negativos son opuestos aditivos
  ($x + (-x) = 0$), representando magnitudes de igual tamaño en sentidos opuestos.'
definiciones_clave: '- **Entero positivo**: Número $x \in \mathbb{Z}$ mayor que cero
  ($x > 0$).

  - **Entero negativo**: Número $x \in \mathbb{Z}$ menor que cero ($x < 0$).'
propiedades_relaciones: '- **Relación con el cero**: Todo entero positivo es mayor
  que cero ($p > 0$) y todo entero negativo es menor que cero ($n < 0$).

  - **Signo implícito**: Un número entero escrito sin signo se asume positivo ($+5
  = 5$).'
ejemplo_guiado:
  enunciado: Clasifique el saldo bancario de $-\$15.000$ indicando si representa un
    entero positivo, negativo o neutro.
  pasos:
  - 'Paso 1: Observar el signo antecedente de la cantidad: $-15000$.'
  - 'Paso 2: Verificar la condición de desigualdad: $-15000 < 0$.'
  - 'Conclusión: La cantidad representa un entero negativo pertenecientes a $\mathbb{Z}^-$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En cuál conjunto se ubica el número cero respecto al signo?
  choices:
  - text: Es el elemento neutro y no pertenece a Z+ ni a Z-
    is_correct: true
  - text: Pertenece únicamente a Z+
    is_correct: false
  - text: Pertenece únicamente a Z-
    is_correct: false
  - text: Pertenece a ambos conjuntos simultáneamente
    is_correct: false
  explanation: La alternativa correcta es 'Es el elemento neutro y no pertenece a
    Z+ ni a Z-'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un saldo de -$15.000$ pertenece a cuál de los siguientes subconjuntos
    de Z?
  choices:
  - text: Z- (enteros negativos)
    is_correct: true
  - text: Z+ (enteros positivos)
    is_correct: false
  - text: Al elemento neutro
    is_correct: false
  - text: A los naturales N
    is_correct: false
  explanation: La alternativa correcta es 'Z- (enteros negativos)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el signo que antecede a la cifra.'
- 'Paso 2: Si tiene el signo $-$, clasificar como entero negativo.'
- 'Paso 3: Si no tiene signo o tiene $+$, clasificar como entero positivo; si es $0$,
  clasificar como neutro.'
errores_correccion: '- **Error 1: Tratar al cero como si fuera un número entero positivo.**
  **Cómo corregirlo:** El cero separa ambas regiones y es estrictamente neutro.


  - **Error 2: Confundir el signo de un entero con el operador de resta.** **Cómo
  corregirlo:** El signo del entero indica su posición en la recta; el operador indica
  la acción de sustraer.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Identifique el signo del entero $-42$.
  alternativas:
  - Entero negativo
  - Entero positivo
  - Neutro
  respuesta: Entero negativo
  solucion_pasos:
  - $-42 < 0$, por lo que es un entero negativo.
- titulo: Ejemplo 2
  enunciado: ¿Qué representa un valor de $+800$ metros en altitud?
  alternativas:
  - Un entero positivo
  - Un entero negativo
  - Un valor neutro
  respuesta: Un entero positivo
  solucion_pasos:
  - $+800 > 0$, es una altura sobre el nivel del mar representada por un entero positivo.
- titulo: ¿Es el número -100 un entero negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, poseer el signo menos antecedente lo clasifica como entero negativo.
- titulo: ¿Es el cero un entero positivo?
  respuesta: 'No'
  solucion_pasos:
  - No, el cero es el elemento neutro a-sígnico.
errores_frecuentes:
- El número cero forma parte del conjunto de los números enteros positivos $\mathbb{Z}^+$.
- Un número entero negativo representa una magnitud de mayor valor mientras más grande
  sea su dígito.
- El producto de dos enteros negativos da como resultado otro entero negativo.
- Un número entero positivo escrito sin el signo $+$ se considera un número neutro.
- Los números enteros negativos están ubicados a la derecha del número cero en la
  recta numérica.
afirmaciones_verdaderas:
- Los números enteros negativos son estrictamente menores que el cero ($x < 0$).
- El cero no es positivo ni negativo.
al_terminar_debes_poder: Al terminar serás capaz de clasificar cualquier entero como
  positivo, negativo o neutro, verificando su signo explícito o implícito y comprobando
  su estatus respecto al cero.
