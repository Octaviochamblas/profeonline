semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.LINEA_MEDIA
resumen_inicial: 'Determinación de la línea media de una función trigonométrica transformada:
  círculo unitario, amplitud, período y transformaciones de Parámetros y transformaciones
  de funciones periódicas.'
explicacion_simple: Toda función periódica oscila de forma simétrica alrededor de
  una recta horizontal central, que sirve como referencia para describir su comportamiento.
explicacion_formal: '### Definición formal


  Como $a\sin(bx)$ oscila entre $-|a|$ y $|a|$, sumar $d$ desplaza ese rango a $[d-|a|,d+|a|]$.
  La recta $y=d$ queda exactamente en el punto medio de ese intervalo, siendo la línea
  media de la función.


  ### Desarrollo didáctico


  $f(x)=4\sin(x)+2$ tiene línea media $y=2$: oscila entre $2-4=-2$ y $2+4=6$, siempre
  a la misma distancia ($4$, la amplitud) por encima y por debajo de $y=2$.'
definiciones_clave: '- **Determinación de la línea media de una función trigonométrica
  transformada**: Función periódica fundamentada en las coordenadas del círculo unitario
  o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a determinación de la línea media de una función trigonométrica transformada.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    determinación de la línea media de una función trigonométrica transformada.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de determinación de la línea media de una función trigonométrica
    transformada.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
