semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.LINEA_MEDIA
resumen_inicial: 'Determinación de la línea media (eje central de oscilación) de una función trigonométrica dada por la recta $y = D$ o por el promedio $\frac{y_{\max} + y_{\min}}{2}$.'
explicacion_simple: |
  La **línea media** (o recta de equilibrio) es la línea horizontal invisible que pasa exactamente por la mitad de la onda senoidal o cosenoidal. La gráfica sube una distancia igual a la amplitud por encima de esta línea y baja la misma distancia por debajo. Si conocemos el punto más alto de la curva ($y_{\max}$) y el punto más bajo ($y_{\min}$), podemos encontrar la línea media calculando su promedio: $y = \frac{y_{\max} + y_{\min}}{2}$. En la fórmula algebraica, esta recta corresponde al parámetro $y = D$.
explicacion_formal: |
  ### Definición formal
  La **línea media (o eje central de oscilación)** de una función armónica acotada de la forma $f(x) = A\sin(Bx + C) + D$ o $g(x) = A\cos(Bx + C) + D$ es la recta horizontal de ecuación:
  $$y = D$$
  calculable geométricamente como la media aritmética exacta entre su valor máximo absoluto $y_{\max}$ y su valor mínimo absoluto $y_{\min}$:
  $$y_{\text{media}} = \frac{y_{\max} + y_{\min}}{2}$$

  ### Desglose simbólico
  - $y_{\max} = D + |A|$
  - $y_{\min} = D - |A|$
  - Promedio: $\frac{(D + |A|) + (D - |A|)}{2} = \frac{2D}{2} = D$.

  ### Síntesis didáctica
  La línea media actúa como el "eje de coordenadas X trasladado". En la función seno $y = A\sin(Bx+C) + D$, los puntos donde la curva cruza la línea media corresponden a los ceros de la función base, ocurriendo cuando $\sin(Bx+C) = 0$.
definiciones_clave: |
  - **Línea media ($y = D$)**: Recta horizontal de simetría vertical que divide a la onda en zonas de cresta y zonas de valle de igual altura.
  - **Promedio de cotas**: Fórmula $\frac{y_{\max} + y_{\min}}{2}$ para deducir la línea media a partir de datos gráficos o tablas.
  - **Intersecciones de equilibrio**: Puntos de la curva que yacen sobre la recta $y = D$.
propiedades_relaciones: |
  - **Equidistancia de crestas y valles**: La distancia vertical desde la línea media hasta cualquier cresta es $+|A|$, y la distancia vertical hasta cualquier valle es $-|A|$.
  - **Puntos de inflexión**: Para las funciones seno y coseno base transformadas, las intersecciones con la línea media son los puntos de inflexión donde cambia la concavidad de la onda.
ejemplo_guiado:
  enunciado: 'Dada una gráfica cosenoidal cuyo punto más alto está en $y_{\max} = 9$ y cuyo punto más bajo está en $y_{\min} = 1$, encuentra la ecuación de la línea media y el valor de la amplitud.'
  pasos:
    - 'Paso 1: Aplicar la fórmula del promedio para calcular la línea media: $y_{\text{media}} = \frac{y_{\max} + y_{\min}}{2} = \frac{9 + 1}{2} = \frac{10}{2} = 5$.'
    - 'Paso 2: Concluir que la línea media es la recta horizontal $y = 5$ ($D = 5$).'
    - 'Paso 3: Aplicar la fórmula de la amplitud: $\text{Amplitud} = \frac{y_{\max} - y_{\min}}{2} = \frac{9 - 1}{2} = \frac{8}{2} = 4$.'
    - 'Paso 4: Verificar que $y_{\max} = 5 + 4 = 9$ e $y_{\min} = 5 - 4 = 1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una gráfica trigonométrica oscila entre una cresta máxima en $y = 7$ y un valle mínimo en $y = -1$, ¿cuál es su línea media?'
    choices:
      - {text: 'La recta horizontal $y = 3$', is_correct: true}
      - {text: 'La recta horizontal $y = 4$', is_correct: false}
      - {text: 'La recta horizontal $y = 0$', is_correct: false}
      - {text: 'La recta horizontal $y = 6$', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta horizontal $y = 3$''. Calculando el promedio: $y = \frac{7 + (-1)}{2} = \frac{6}{2} = 3$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la función $f(x) = -4\sin(3x - \pi) - 2$, ¿cuál es la ecuación de su línea media?'
    choices:
      - {text: '$y = -2$', is_correct: true}
      - {text: '$y = -4$', is_correct: false}
      - {text: '$y = 2$', is_correct: false}
      - {text: '$y = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$y = -2$''. En la forma $A\sin(Bx + C) + D$, el valor de $D = -2$ fija la línea media en $y = -2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Si se conoce la fórmula algebraica $A\sin(Bx+C)+D$, identificar el parámetro $D$ para obtener $y = D$.'
  - 'Paso 2: Si se conocen las cotas máximas y mínimas desde una gráfica, calcular el promedio $y = \frac{y_{\max} + y_{\min}}{2}$.'
  - 'Paso 3: Trazar la recta horizontal $y = D$ como la línea central de oscilación.'
  - 'Paso 4: Comprobar que la cresta supere a la línea media en exactamente $|A|$ unidades.'
errores_correccion: |
  - **Error 1:** Confundir la línea media con el punto medio horizontal del período. **Cómo corregirlo:** La línea media es un concepto de la dimensión vertical (eje Y); mide la altura central, no la longitud horizontal del ciclo.
  - **Error 2:** Creer que la línea media es la resta de los extremos. **Cómo corregirlo:** La resta $y_{\max} - y_{\min}$ calcula el diámetro vertical completo (2 veces la amplitud). La línea media es la **suma dividida por 2** (el promedio).
ejemplos:
  - titulo: 'Línea media desde valores extremos'
    enunciado: '¿Cuál es la línea media de una sinusoide con máximos en $y = 12$ y mínimos en $y = 2$?'
    alternativas:
      - 'La recta $y = 7$'
      - 'La recta $y = 5$'
      - 'La recta $y = 10$'
    respuesta: 'La recta $y = 7$'
    solucion_pasos:
      - '1. Calculamos el promedio: $\frac{12 + 2}{2} = \frac{14}{2} = 7$.'
      - '2. La línea media es la recta $y = 7$.'
  - titulo: 'Línea media en función base'
    enunciado: '¿Cuál es la línea media de la función base $y = \cos(x)$?'
    alternativas:
      - 'El eje X ($y = 0$)'
      - 'La recta $y = 1$'
      - 'La recta $y = -1$'
    respuesta: 'El eje X ($y = 0$)'
    solucion_pasos:
      - '1. $D = 0 \implies y = 0$.'
      - '2. La línea media es el propio eje horizontal X.'
  - titulo: 'Eje de simetría de oscilación'
    enunciado: '¿La distancia desde la línea media hasta la cresta es exactamente la misma que de la línea media al valle?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, ambas distancias miden la amplitud $|A|$.'
  - titulo: 'Intersección del seno con la línea media'
    enunciado: '¿En una función senoidal $y = A\sin(Bx) + D$ la gráfica pasa por la línea media cuando $x = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $\sin(0) = 0 \implies y = A(0) + D = D$.'
errores_frecuentes:
  - 'La afirmación de que la línea media se calcula restando el valor mínimo del valor máximo.'
  - 'La afirmación de que la línea media de cualquier función trigonométrica transformada es siempre el eje horizontal $X = 0$.'
  - 'La afirmación de que la línea media de una función es una recta vertical en el eje Y.'
  - 'La afirmación de que la línea media depende exclusivamente del valor del coeficiente $B$.'
  - 'La afirmación de que la cresta máxima de la onda se encuentra a una distancia distinta de la línea media que el valle mínimo.'
afirmaciones_verdaderas:
  - 'La línea media de una función trigonométrica es la recta horizontal $y = D$, la cual equivale al promedio aritmético entre su valor máximo y su valor mínimo $y = \frac{y_{\max} + y_{\min}}{2}$.'
  - 'La sinusoide es simétrica verticalmente respecto a su línea media, distando de ella exactamente una magnitud igual a la amplitud $|A|$ tanto en sus crestas como en sus valles.'
al_terminar_debes_poder: |
  QUÉ: Determinar e interpretar la línea media de oscilación en funciones trigonométricas armónicas.
  CÓMO: Identificar el parámetro $D$ en la fórmula o calcular el promedio $\frac{y_{\max} + y_{\min}}{2}$ desde datos extremos.
