semantic_id: MAT.GEO.ESPACIO_FUNDAMENTOS.RECTAS_ALABEADAS
resumen_inicial: 'Posición relativa de rectas alabeadas en el espacio: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'En el espacio existe una tercera posición relativa entre rectas,
  que no tiene equivalente en la geometría plana: dos rectas pueden no cruzarse nunca
  y, sin embargo, no ser paralelas.'
explicacion_formal: '![Rectas alabeadas en el espacio](/static/img/geometria/espacio-cuerpos/espacio-rectas-alabeadas.svg)


  ### Definición formal


  Dos rectas $AB$ y $CG$ son alabeadas si no son coplanares: no existe ningún plano
  que las contenga a ambas. Como consecuencia, nunca se intersectan y, además, no
  son paralelas entre sí.


  ### Desarrollo didáctico


  En la figura, la arista $AB$ (borde inferior frontal) y la arista $CG$ (borde vertical
  trasero derecho) de un prisma no se tocan en ningún punto y tampoco tienen la misma
  dirección, por lo que no puede existir un único plano que las contenga a ambas:
  son rectas alabeadas. Esta posición relativa es exclusiva de la geometría del espacio;
  no existe en la geometría plana.'
definiciones_clave: '- **Posición relativa de rectas alabeadas en el espacio**: Elemento
  o propiedad fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
