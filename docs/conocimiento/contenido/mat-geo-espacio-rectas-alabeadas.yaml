procedimiento:
- 'Paso 1: Verifica que las dos rectas no compartan ningún punto en común (no son
  secantes).'
- 'Paso 2: Verifica que las rectas no tengan la misma dirección (no son paralelas).'
- 'Paso 3: Si se cumplen ambas condiciones, concluye que las rectas son alabeadas
  (no coplanares).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con posición relativa de rectas alabeadas en el espacio.
