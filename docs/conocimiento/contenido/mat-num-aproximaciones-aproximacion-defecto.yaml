semantic_id: MAT.NUM.APROXIMACIONES.APROXIMACION_DEFECTO
resumen_inicial: Una aproximación por defecto (o por cota inferior) es un valor menor o igual al número real original obtenido al conservar las cifras hasta el orden requerido.
explicacion_simple: '![Aproximación por defecto](/static/img/nodos/aproximacion-por-defecto-intro.svg)


  Aproximar por defecto a un orden decimal determinado (décimas, centésimas, milésimas) significa encontrar un número con la precisión solicitada que sea menor o igual al número original. Para números positivos, consiste simplemente en conservar las cifras hasta la posición indicada y descartar todo lo que venga después.'
explicacion_formal: 'Dado un número real $x \in \mathbb{R}^+$ y un orden de aproximación $k \in \mathbb{N}_0$, la **Aproximación por Defecto a $k$ decimales** $x_{\text{def}}$ se define formalmente mediante:


  $$x_{\text{def}} = \frac{\lfloor x \cdot 10^k \rfloor}{10^k}$$


  **Desglose formal de la fórmula:**

  - **$\lfloor u \rfloor$:** Función piso o parte entera, que devuelve el mayor entero menor o igual a $u$.

  - **Cota inferior estricta:** Satisface la desigualdad fundamental $x_{\text{def}} \le x < x_{\text{def}} + 10^{-k}$.

  - **Error absoluto:** El error por defecto cumple $0 \le x - x_{\text{def}} < 10^{-k}$.


  > **Complemento didáctico:** Para todo número decimal positivo, la aproximación por defecto coincide exactamente con la operación de truncamiento.'
definiciones_clave: '- **Aproximación por defecto**: Valor con precisión $10^{-k}$ que subestima o iguala al valor original ($x_{\text{def}} \le x$).

  - **Orden de aproximación ($k$)**: Posición decimal de corte (unidades $k=0$, décimas $k=1$, centésimas $k=2$, milésimas $k=3$).

  - **Cota inferior decimal**: Extremo izquierdo del intervalo unitario de longitud $10^{-k}$ que encierra al número.'
propiedades_relaciones: '- **Monotonía posicional**: Para $x > 0$, $x_{\text{def}} \le x$.

  - **Acotamiento del error**: $E = x - x_{\text{def}} \in [0, 10^{-k})$.

  - **Idempotencia**: Si $x$ ya tiene $k$ cifras decimales, $x_{\text{def}} = x$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de aproximación por defecto](/static/img/nodos/aproximacion-por-defecto-ejemplos.svg)


    Aproxime por defecto el número $5,483$ a la décima y a la centésima.'
  pasos:
  - 'Paso 1: Para la décima ($k=1$): Identificar la cifra en las décimas, que es $4$. Descartar centésimas y milésimas $\implies 5,4$.'
  - 'Paso 2: Comprobar la cota inferior: $5,4 \le 5,483$ (correcto).'
  - 'Paso 3: Para la centésima ($k=2$): Conservar hasta las centésimas ($5,48$) y descartar la milésima ($3$) $\implies 5,48$.'
  - 'Paso 4: Comprobar la cota inferior: $5,48 \le 5,483$ (correcto).'
  - 'Conclusión: A la décima es $5,4$ y a la centésima es $5,48$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación de orden cumple siempre la aproximación por defecto de un número positivo respecto a su valor real?
  choices:
  - text: Es siempre menor o igual al valor real ($x_{\text{def}} \le x$)
    is_correct: true
  - text: Es siempre estrictamente mayor al valor real
    is_correct: false
  - text: Depende de si la siguiente cifra es mayor a 5
    is_correct: false
  - text: Es igual al promedio entre defecto y exceso
    is_correct: false
  explanation: La alternativa correcta es 'Es siempre menor o igual al valor real ($x_{\text{def}} \le x$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $5,483$, ¿cuál fue la aproximación por defecto a la centésima?
  choices:
  - text: $5,48$
    is_correct: true
  - text: $5,49$
    is_correct: false
  - text: $5,50$
    is_correct: false
  - text: $5,40$
    is_correct: false
  explanation: La alternativa correcta es '$5,48$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la posición decimal requerida ($k$ lugares tras la coma).'
- 'Paso 2: Conservar el número exacto hasta dicha posición decimal.'
- 'Paso 3: Eliminar todas las cifras decimales que se encuentren a la derecha de la posición $k$ sin modificar las cifras conservadas.'
errores_correccion: '- **Error 1: Sumar +1 a la última cifra si la siguiente es mayor o igual a 5.** **Cómo corregirlo:** En la aproximación por DEFECTO nunca se suma 1; las cifras posteriores simplemente se eliminan.

  - **Error 2: Confundir aproximación por defecto con aproximación por exceso.** **Cómo corregirlo:** La aproximación por defecto produce un número MENOR o igual al original, no mayor.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aproxime $5,48$ por defecto a la décima.
  alternativas:
  - $5,4$
  - $5,5$
  - $5,0$
  respuesta: $5,4$
  solucion_pasos:
  - 'Se conserva hasta la décima: $5,4$.'
- titulo: Ejemplo 2
  enunciado: Aproxime $0,819$ por defecto a la centésima.
  alternativas:
  - $0,81$
  - $0,82$
  - $0,80$
  respuesta: $0,81$
  solucion_pasos:
  - 'Se conserva hasta la centésima: $0,81$.'
- titulo: ¿Es la aproximación por defecto de $4,12$ a la décima igual a $4,1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, conservando hasta las décimas resulta $4,1$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Descartando la centésima se obtiene $4,1$, que cumple $4,1 \le 4,12$.
  - texto: No, es 4,2
    es_correcta: false
    retroalimentacion: Incorrecto, $4,2$ es la aproximación por exceso.
  - texto: No, es 4,0
    es_correcta: false
    retroalimentacion: Incorrecto, la décima 1 se conserva.
- titulo: ¿Es la aproximación por defecto de un número positivo mayor que el número original?
  respuesta: 'No'
  solucion_pasos:
  - No, por definición la aproximación por defecto es menor o igual al valor real ($x_{\text{def}} \le x$).
  alternativas:
  - texto: No, es siempre menor o igual
    es_correcta: true
    retroalimentacion: ¡Correcto! Una aproximación por defecto jamás supera al valor original.
  - texto: Sí, siempre es mayor
    es_correcta: false
    retroalimentacion: Incorrecto, eso corresponde a la aproximación por exceso.
  - texto: Solo si tiene más de 3 decimales
    es_correcta: false
    retroalimentacion: Incorrecto, la cota inferior es universal.
errores_frecuentes:
- Aumentar en uno la cifra decimal cuando el dígito posterior es mayor o igual a cinco en aproximación por defecto.
- Confundir la aproximación por defecto con el redondeo estándar.
- Considerar que la aproximación por defecto de un entero genera números decimales.
- Afirmar que aproximar por defecto a la unidad un número como $7,9$ entrega $8$.
- Pensar que la aproximación por defecto incrementa el error respecto al exceso en todos los casos.
afirmaciones_verdaderas:
- La aproximación por defecto de un número decimal positivo es siempre menor o igual al valor exacto.
- Para números reales positivos, la aproximación por defecto a $k$ decimales coincide exactamente con el truncamiento a $k$ decimales.
- El error cometido en una aproximación por defecto es estrictamente menor que $10^{-k}$.
al_terminar_debes_poder: '![Síntesis de aproximación por defecto](/static/img/nodos/aproximacion-por-defecto-resumen.svg)


  QUÉ: Aproximar números reales por defecto a un orden decimal determinado ($k$ cifras).


  CÓMO: Conservando las cifras del número hasta la posición decimal solicitada y descartando todas las cifras posteriores, asegurando que el valor aproximado constituya una cota inferior válida ($x_{\text{def}} \le x$).'
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
