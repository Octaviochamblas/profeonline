semantic_id: MAT.NUM.APROXIMACIONES.APROXIMACION_DEFECTO
resumen_inicial: Una aproximación por defecto (o por cota inferior) es un valor cercano
  al número real o racional $x$ tal que la aproximación $x_{\text{def}}$ es estrictamente
  menor o igual al valor exacto ($x_{\text{def}} \le x$).
explicacion_simple: Aproximar un número por defecto significa elegir un valor cercano
  que se quede por debajo o 'corto' con respecto al valor exacto del número original.
  Es una aproximación que garantiza no pasarse de la cantidad real, siendo muy útil
  cuando se busca estimar un piso o límite inferior seguro.
explicacion_formal: 'Sea $x \in \mathbb{R}$, una **Aproximación por Defecto a nivel
  $10^{-k}$** se define como el valor $x_{\text{def}}$ que satisface la cota unilateral
  estricta:


  $$x_{\text{def}} \le x < x_{\text{def}} + 10^{-k}$$


  **Desglose de la fórmula:**

  - $x_{\text{def}} \le x$: La aproximación nunca supera al valor exacto $x$.

  - $10^{-k}$: Nivel de precisión prefijado (décimas $k=1$, centésimas $k=2$, etc.).

  - Para números positivos, el **truncamiento** a la $k$-ésima cifra decimal coincide
  exactamente con la aproximación por defecto.


  > **Complemento didáctico:** El error de aproximación $E = x - x_{\text{def}} \ge
  0$ es siempre no negativo.'
definiciones_clave: '- **Aproximación por defecto**: Estimación numérica $x_{\text{def}}$
  que satisface $x_{\text{def}} \le x$.'
propiedades_relaciones: '- **Coincidencia positiva con truncamiento**: Para números
  positivos, la aproximación por defecto coincide con cortar (truncar) los decimales
  sobrantes.'
ejemplo_guiado:
  enunciado: Aproxime el número $3,786$ por defecto a las centésimas ($k=2$).
  pasos:
  - 'Paso 1: Identificar las centésimas (segunda cifra tras la coma): en $3,786$ es
    la cifra $8$.'
  - 'Paso 2: Como es por defecto y el número es positivo, se toma el valor exacto
    cortando en la segunda cifra decimal: $3,78$.'
  - 'Paso 3: Verificar que $3,78 \le 3,786 < 3,79$.'
  - 'Conclusión: La aproximación por defecto a la centésima de $3,786$ es $3,78$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación de desigualdad cumple la aproximación por defecto x_def
    con respecto al número exacto x?
  choices:
  - text: x_def <= x (la aproximación es menor o igual al valor exacto)
    is_correct: true
  - text: x_def > x obligatoriamente
    is_correct: false
  - text: x_def = x + 10
    is_correct: false
  - text: x_def < 0 siempre
    is_correct: false
  explanation: La alternativa correcta es 'x_def <= x (la aproximación es menor o
    igual al valor exacto)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3,786 aproximado por defecto a la centésima,
    ¿cuál fue el resultado?
  choices:
  - text: 3,78
    is_correct: true
  - text: 3,79
    is_correct: false
  - text: 3,70
    is_correct: false
  - text: 3,80
    is_correct: false
  explanation: La alternativa correcta es '3,78'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la posición o unidad decimal requerida para la aproximación.'
- 'Paso 2: Seleccionar el número más cercano que no supere el valor original exacto.'
- 'Paso 3: Verificar que la diferencia $x - x_{\text{def}}$ sea no negativa ($E \ge
  0$).'
errores_correccion: '- **Error 1: Redondear hacia arriba cuando se pide por defecto.**
  **Cómo corregirlo:** En por defecto NUNCA se sube la cifra; el valor resultante
  debe quedar igual o menor que el número original.


  - **Error 2: Confundir por defecto en números negativos.** **Cómo corregirlo:**
  En negativos, el valor por defecto se ubica más a la izquierda en la recta numérica
  ($-2,4$ es la aproximación por defecto a la décima de $-2,35$ porque $-2,4 < -2,35$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aproxime 5,492 por defecto a la décima.
  alternativas:
  - 5,4
  - 5,5
  - 5,0
  respuesta: 5,4
  solucion_pasos:
  - $5,4 \le 5,492 \implies$ por defecto a la décima es $5,4$.
- titulo: Ejemplo 2
  enunciado: Aproxime 0,819 por defecto a la centésima.
  alternativas:
  - 0,81
  - 0,82
  - 0,80
  respuesta: 0,81
  solucion_pasos:
  - $0,81 \le 0,819 \implies$ por defecto a la centésima es $0,81$.
- titulo: ¿Es la aproximación por defecto de 4,12 a la décima igual a 4,1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $4,1 \le 4,12$.
- titulo: ¿Es la aproximación por defecto de un número positivo mayor que el número
    original?
  respuesta: 'No'
  solucion_pasos:
  - No, por definición la aproximación por defecto es menor o igual ($x_{\text{def}}
    \le x$).
errores_frecuentes:
- La aproximación por defecto de un número positivo entrega un resultado mayor que
  el valor original.
- Aproximar por defecto exige redondear hacia arriba la última cifra si el dígito
  siguiente es mayor que 5.
- La aproximación por defecto de $-3,14$ a las décimas es $-3,1$.
- El error de aproximación en una estimación por defecto es siempre un número negativo.
- Para los números positivos la aproximación por defecto entrega el mismo resultado
  que la aproximación por exceso.
afirmaciones_verdaderas:
- La aproximación por defecto satisface la relación de orden $x_{\text{def}} \le x$.
- Para números positivos, la aproximación por defecto a $k$ decimales coincide exactamente
  con el truncamiento a $k$ decimales.
al_terminar_debes_poder: Al terminar serás capaz de aproximar cualquier número por
  defecto a una posición decimal requerida, verificando que el resultado $x_{\text{def}}
  \le x$ se mantenga menor o igual al valor exacto.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
