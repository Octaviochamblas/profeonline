semantic_id: MAT.FUND.LOGICA_BASICA.EXPRESION_NO_PROPOSICIONAL
resumen_inicial: Identificación y clasificación de expresiones no proposicionales como preguntas, órdenes, exclamaciones, opiniones y enunciados abiertos con variables libres.
explicacion_simple: 'No todas las frases u oraciones que decimos o escribimos en matemáticas son proposiciones. Si alguien te pregunta "¿Qué hora es?", te da una orden como "¡Calcula el área!", expresa una emoción como "¡Qué difícil!" o da una opinión subjetiva, no tiene sentido responder "eso es verdadero" o "eso es falso". Además, fórmulas con letras libres como "$x + 2 = 10$" tampoco son proposiciones hasta que sepamos cuánto vale $x$. A todas estas frases se les llama **expresiones no proposicionales**.


  ![Expresiones no proposicionales](/static/img/nodos/expresiones-no-proposicionales-intro.svg)

  '
explicacion_formal: '### Definición formal

  En la semántica de la lógica clásica de primer orden, una **expresión no proposicional** es cualquier formulación lingüística o sintáctica $E$ que **no pertenece al dominio de la función de verdad** $\mathbb{V} = \{V, F\}$:

  $$v(E) \notin \{V, F\}$$

  debido a la ausencia de valor veritativo intrínseco, ambigüedad epistémica subjetiva o presencia de variables libres no acotadas por cuantificadores.


  ### Desglose simbólico

  Se clasifican en 5 categorías fundamentales:

  1. **Enunciados abiertos / Funciones proposicionales $P(x)$**: Fórmulas con variables libres (ej. $x^2 - 9 = 0$). Solo adquieren valor de verdad tras la instanciación de $x$ o la prefijación de cuantificadores ($\forall x, \exists x$).

  2. **Oraciones interrogativas**: Preguntas que solicitan información (ej. "¿Es $5$ un número primo?").

  3. **Oraciones imperativas**: Órdenes o algoritmos de acción (ej. "Simplifica la fracción").

  4. **Oraciones exclamativas o desiderativas**: Expresiones de afecto o deseo (ej. "¡Ojalá apruebe el examen!").

  5. **Juicios de valor u opiniones subjetivas**: Declaraciones dependientes del sujeto observador (ej. "La geometría es más entretenida que el cálculo").


  ### Síntesis didáctica

  Una expresión es no proposicional si carece de un valor de verdad objetivo ($V$ o $F$) determinado por la propia estructura del enunciado.

  '
definiciones_clave: '- **Expresión no proposicional**: Toda formulación lingüística o matemática a la que no se le puede asignar un valor de verdad binario ($V$ o $F$).

  - **Enunciado abierto / Predicado $P(x)$**: Expresión matemática que contiene una o más variables libres y se transforma en proposición al sustituir las variables por constantes del universo.

  - **Variable libre**: Símbolo en una fórmula que no está cuantificado ni tiene un valor numérico asignado.

  '
propiedades_relaciones: '- **Transformación mediante cuantificación**: Un enunciado abierto $P(x)$ se convierte en proposición anteponiendo cuantificadores universales ($\forall x, P(x)$) o existenciales ($\exists x, P(x)$).

  - **Criterio de objetividad**: La lógica matemática descarta los juicios subjetivos por no admitir una función de evaluación unívoca.

  '
ejemplo_guiado:
  enunciado: '![Matriz de clasificación de expresiones](/static/img/nodos/expresiones-no-proposicionales-ejemplos.svg)


    Clasifica las siguientes expresiones en proposiciones o expresiones no proposicionales, indicando su tipo: 1) "$2x + 1 = 7$", 2) "Calcula la raíz cuadrada de $64$", 3) "$2 + 2 = 4$".'
  pasos:
  - 'Paso 1: Analizar "$2x + 1 = 7$": Contiene la variable libre $x$. Su verdad depende del valor de $x$ (es $V$ solo si $x=3$). Es una **expresión no proposicional (enunciado abierto)**.'
  - 'Paso 2: Analizar "Calcula la raíz cuadrada de $64$": Es una instrucción en modo imperativo. No asevera nada ni tiene valor de verdad. Es una **expresión no proposicional (oración imperativa)**.'
  - 'Paso 3: Analizar "$2 + 2 = 4$": Es una afirmación declarativa cerrada con valor de verdad Verdadero ($V$). Es una **proposición matemática**.'
  - 'Paso 4: Concluir que las expresiones 1 y 2 son no proposicionales y la 3 es una proposición.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la igualdad algebraica "$x^2 = 25$" se clasifica como una expresión no proposicional?
  choices:
  - text: Porque contiene una variable libre $x$ que impide determinar un valor de verdad fijo
    is_correct: true
  - text: Porque es una ecuación cuadrática sin soluciones reales
    is_correct: false
  - text: Porque el número $25$ no tiene raíz cuadrada exacta
    is_correct: false
  - text: Porque las igualdades matemáticas nunca son proposiciones
    is_correct: false
  explanation: La alternativa correcta es 'Porque contiene una variable libre $x$ que impide determinar un valor de verdad fijo'. Al ser un enunciado abierto, su valor de verdad depende del valor que tome $x$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál de las siguientes frases es una expresión no proposicional del tipo imperativo?
  choices:
  - text: Factoriza el polinomio $x^2 - 4$
    is_correct: true
  - text: El número $4$ es un cuadrado perfecto
    is_correct: false
  - text: $10 > 20$
    is_correct: false
  - text: Todo número primo es impar
    is_correct: false
  explanation: La alternativa correcta es 'Factoriza el polinomio $x^2 - 4$'. Es una instrucción u orden de acción que carece de valor de verdad.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar si el enunciado presenta signos de interrogación, exclamación o verbos en modo imperativo.'
- 'Paso 2: Detectar si el enunciado incluye variables matemáticas libres ($x, y, z$) sin cuantificadores.'
- 'Paso 3: Verificar si el enunciado contiene adjetivos subjetivos o juicios de valor personal.'
- 'Paso 4: Si se cumple cualquiera de los pasos anteriores, clasificar la frase como expresión no proposicional especificando su categoría.'
errores_correccion: '- **Error 1:** Afirmar que una ecuación con variable libre es una proposición porque "se puede resolver". **Cómo corregirlo:** La ecuación "$x - 3 = 0$" es un enunciado abierto; solo se convierte en proposición cuando se reemplaza $x$ por un valor numérico específico o se cuantifica.

  - **Error 2:** Confundir una proposición falsa con una expresión no proposicional. **Cómo corregirlo:** Una afirmación declarativa falsa como "$5 < 2$" SÍ es una proposición (con valor $F$). Las expresiones no proposicionales son aquellas que ni siquiera pueden evaluarse como $V$ o $F$.

  '
ejemplos:
- titulo: Enunciado abierto con variable
  enunciado: ¿Es "$y > 0$" una proposición o una expresión no proposicional?
  alternativas:
  - Expresión no proposicional (enunciado abierto)
  - Proposición verdadera
  - Proposición falsa
  respuesta: Expresión no proposicional (enunciado abierto)
  solucion_pasos:
  - 1. La variable $y$ no tiene un valor fijado.
  - 2. No se puede afirmar si es verdadera o falsa.
- titulo: Pregunta matemática
  enunciado: ¿Es "¿Cuánto vale la hipotenusa?" una expresión no proposicional?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una oración interrogativa y carece de valor de verdad.
- titulo: Instrucción o comando
  enunciado: ¿Es "Grafica una parábola" una expresión no proposicional?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una orden imperativa que no afirma ni niega un hecho.
- titulo: Declaración falsa cerrada
  enunciado: ¿Es "$8 + 2 = 15$" una expresión no proposicional?
  respuesta: 'No'
  solucion_pasos:
  - No, es una proposición matemática válida cuyo valor de verdad es Falso ($F$).
errores_frecuentes:
- La afirmación de que las ecuaciones con variables libres como $x + 5 = 12$ son proposiciones matemáticas válidas.
- La afirmación de que las preguntas con respuesta numérica fija constituyen proposiciones lógicas.
- La afirmación de que las opiniones subjetivas poseen un valor de verdad objetivo en lógica matemática.
- La afirmación de que los enunciados falsos cerrados pertenecen a las expresiones no proposicionales.
- La afirmación de que las instrucciones imperativas pueden evaluarse como verdaderas o falsas.
afirmaciones_verdaderas:
- Una expresión no proposicional es aquella formulación a la que resulta imposible asignarle un valor de verdad único, objetivo y binario ($V$ o $F$).
- Los enunciados abiertos que contienen variables libres se transforman en proposiciones matemáticas una vez que las variables son instanciadas o acotadas por cuantificadores.
al_terminar_debes_poder: '![Checklist de expresiones no proposicionales](/static/img/nodos/expresiones-no-proposicionales-resumen.svg)


  QUÉ: Identificar y clasificar expresiones no proposicionales distinguiendo enunciados abiertos, preguntas, órdenes y opiniones.

  CÓMO: Detectar la presencia de variables libres, estructuras no declarativas o juicios subjetivos que impiden asignar un valor de verdad binario.

  '
