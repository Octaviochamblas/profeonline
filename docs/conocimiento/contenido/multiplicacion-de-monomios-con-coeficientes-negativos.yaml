procedimiento:
- 'Paso 1: Cuenta el número de signos negativos entre todos los factores.'
- 'Paso 2: Si el total es par, el resultado es positivo. Si es impar, es negativo.'
- 'Paso 3: Multiplica los valores absolutos de los coeficientes.'
- 'Paso 4: Multiplica las partes literales aplicando la suma de exponentes de igual
  base.'
- 'Paso 5: Combina el signo final con el coeficiente y las variables ordenadas alfabéticamente.'
errores_correccion: Evita multiplicar los exponentes en lugar de sumarlos al multiplicar
  bases iguales en multiplicación de monomios con coeficientes negativos.
ejemplos:
- titulo: Triple producto negativo
  enunciado: 'Multiplica: (-2x)(-3x^2)(-x^3).'
  solucion_pasos:
  - 'Signos: 3 negativos (impar) → -.'
  - 'Coeficientes: 2 × 3 × 1 = 6.'
  - 'Variable x: x^1 · x^2 · x^3 = x^6.'
  - 'Resultado: -6x^6.'
- titulo: Un modelo físico de disipación de energía calcula una pérdida como $E =
    (-2v^2)(-3v)(-v^3)$
  enunciado: 'Un modelo físico de disipación de energía calcula una pérdida como $E
    = (-2v^2)(-3v)(-v^3)$. Si $v > 0$, ¿cuál es la expresión reducida de la pérdida
    de energía? (v1)


    Opciones: A) $-6v^6$ · B) $6v^6$ · C) $-6v^5$ · D) $-5v^6$'
  solucion_pasos:
  - 'Operamos: $(-2v^2)(-3v)(-v^3)$. Signo: 3 negativos → $-$. Coef: $2 \times 3 \times
    1 = 6$. Letra: $v^2 \cdot v \cdot v^3 = v^6$. Resultado: $-6v^6$.'
- titulo: 'Respecto de «Multiplicación de monomios con coeficientes negativos»: ¿La
