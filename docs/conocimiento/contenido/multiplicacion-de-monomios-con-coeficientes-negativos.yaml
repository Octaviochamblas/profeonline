  enunciado: 'Respecto de «Multiplicación de monomios con coeficientes negativos»:
    ¿La siguiente formulación es correcta? «Al multiplicar **Monomios Negativos**,
    se calcula el signo final según la regla de signos (par o impar de negativos)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al multiplicar **Monomios Negativos**,
