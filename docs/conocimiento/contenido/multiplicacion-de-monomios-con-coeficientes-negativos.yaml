semantic_id: MAT.ALG.MULT_MONOMIOS.MONOMIOS_NEGATIVOS
resumen_inicial: La multiplicación de monomios con coeficientes negativos consiste en aplicar la ley de los signos para determinar la signatura final combinando los coeficientes y sumando los exponentes.
explicacion_simple: "Cuando multiplicas monomios que llevan **signos menos ($-$)** adelante:\n- **Procedimiento de 3 pasos**:\n  1. **Determina el signo del producto**:\n     - Negativo $\\cdot$ Negativo $= \\mathbf{\\text{POSITIVO (+)}}$.\n     - Negativo $\\cdot$ Positivo $= \\mathbf{\\text{NEGATIVO (-)}}$.\n  2. **Multiplica los valores absolutos de los coeficientes**.\n  3. **Suma los exponentes de las letras iguales**.\n- **Ejemplo 1**: $(-4x^3) \\cdot (-2x^5)$:\n  - Signo: $(-) \\cdot (-) = +$.\n  - Coeficiente: $4 \\cdot 2 = 8$.\n  - Letra: $x^{3+5} = x^8$.\n  - Resultado final: **$+8x^8$**.\n- **Ejemplo 2**: $(-5a^2 b) \\cdot (3a^4 b^3)$:\n  - Signo: $(-) \\cdot (+) = -$.\n  - Coeficiente: $5 \\cdot 3 = 15$.\n  - Letra $a$: $a^{2+4} = a^6$.\n  - Letra $b$: $b^{1+3} = b^4$.\n  - Resultado final: **$-15a^6 b^4$**.\n\n![Multiplicación con Coeficientes Negativos](/static/img/nodos/multiplicacion-de-monomios-con-coeficientes-negativos-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean $M_1 = c_1 \prod x_i^{\alpha_i}$ y $M_2 = c_2 \prod x_i^{\beta_i}$ dos monomios en $\mathbb{R}[x_1, \dots, x_n]$ donde al menos un coeficiente es estrictamente negativo ($c_1 < 0$ o $c_2 < 0$). El **producto de monomios con coeficientes reales con signo** aplica el homomorfismo de signatura $\operatorname{sgn}: \mathbb{R}^* \to \{-1, +1\}$:


  $$M_1 \cdot M_2 = \Big( \operatorname{sgn}(c_1) \cdot \operatorname{sgn}(c_2) \cdot |c_1| \cdot |c_2| \Big) \prod_{i=1}^n x_i^{\alpha_i + \beta_i}$$


  ### Preservación del Exponente en Coeficientes Negativos

  El signo menos del coeficiente no altera ni afecta a los exponentes de las variables constituyentes: el signo menos pertenece exclusivamente al multiplicador escalar $c_1 \in \mathbb{R}^-$.


  ### Síntesis didáctica

  Diferenciar el signo negativo del coeficiente escalar de los exponentes de las potencias es la regla fundamental para evitar errores de signatura en álgebra.

  '
definiciones_clave: '- **Monomio con coeficiente negativo**: Expresión monómica cuyo factor constante escalar pertenece al conjunto de los números reales negativos $\mathbb{R}^-$.

  - **Signatura escalar resultante**: Determinación del signo del coeficiente producto mediante $\operatorname{sgn}(c_1 c_2)$.

  - **Independencia signo-exponente**: Autonomía total entre la signatura antecedente del coeficiente y las potencias de las letras.

  '
propiedades_relaciones: '- **Doble negación cancelatoria**: Multiplicar dos monomios con coeficientes negativos anula el signo negativo produciendo un monomio de coeficiente positivo.

  - **Preservación de grado**: El signo del coeficiente no modifica en absoluto el grado absoluto ni los exponentes del monomio.

  '
ejemplo_guiado:
  enunciado: Calcula el producto de los monomios $M_1 = -7a^4 b^2$ y $M_2 = -3a^2 b^5 c$.
  pasos:
  - 'Paso 1: Identificamos los coeficientes numéricos con sus signos: $c_1 = -7$ y $c_2 = -3$.'
  - 'Paso 2: Aplicamos la regla de signos para el coeficiente: $(-7) \cdot (-3) = \mathbf{+21}$.'
  - 'Paso 3: Operamos la variable $a$: $a^4 \cdot a^2 = a^{4+2} = \mathbf{a^6}$.'
  - 'Paso 4: Operamos la variable $b$: $b^2 \cdot b^5 = b^{2+5} = \mathbf{b^7}$.'
  - 'Paso 5: Mantenemos la variable $c$: $\mathbf{c^1}$.'
  - 'Conclusión: El monomio producto es **$+21a^6 b^7 c$**.'
  imagen: /static/img/nodos/multiplicacion-de-monomios-con-coeficientes-negativos-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué signo tendrá el coeficiente del monomio resultante al multiplicar un monomio negativo por otro monomio negativo?
  choices:
  - text: Tendrá signo positivo ($+$), porque el producto de dos números negativos da un resultado positivo
    is_correct: true
  - text: Tendrá signo negativo ($-$)
    is_correct: false
  - text: El signo se anula y el coeficiente se convierte en cero
    is_correct: false
  - text: El signo depende de los exponentes de las variables
    is_correct: false
  explanation: La alternativa correcta es 'Tendrá signo positivo ($+$), porque el producto de dos números negativos da un resultado positivo'. Ley de signos $(-) \cdot (-) = +$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de multiplicar $(-6x^2) \cdot (2x^4)$?
  choices:
  - text: El resultado es $-12x^6$, multiplicando $(-6) \cdot 2 = -12$ y sumando $2 + 4 = 6$
    is_correct: true
  - text: El resultado es $+12x^6$
    is_correct: false
  - text: El resultado es $-12x^8$
    is_correct: false
  - text: El resultado es $-4x^6$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $-12x^6$, multiplicando $(-6) \cdot 2 = -12$ y sumando $2 + 4 = 6$'. Signos distintos $\implies -12x^{2+4}=-12x^6$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la ley de los signos al producto de los coeficientes numéricos determinando la signatura ($+$ o $-$).'
- 'Paso 2: Multiplicar los valores absolutos de los coeficientes numéricos.'
- 'Paso 3: Identificar las variables comunes y sumar sus exponentes.'
- 'Paso 4: Consolidar el monomio resultante combinando el signo, el coeficiente y las variables.'
errores_correccion: '- **Error 1:** Cambiar el signo del exponente por causa del coeficiente negativo (escribir $(-2x^3) \cdot (4x^2) = -8x^{-5}$). **Cómo corregirlo:** El signo menos **AFECTA SÓLO AL COEFICIENTE ($(-2) \cdot 4 = -8$); los exponentes se suman normalmente ($3+2=5 \implies -8x^5$)**.

  - **Error 2:** Aplicar regla de suma de enteros al multiplicar coeficientes negativos (escribir $(-4) \cdot (-3) = -7$). **Cómo corregirlo:** Se están **MULTIPLICANDO COEFICIENTES ($(-4) \cdot (-3) = +12$)**.

  '
ejemplos:
- titulo: Dos negativos
  enunciado: ¿Cuál es el producto de $(-3m^2) \cdot (-4m^3)$?
  alternativas:
  - $12m^5$
  - $-12m^5$
  - $-7m^5$
  respuesta: $12m^5$
  solucion_pasos:
  - '1. Coeficientes: $(-3) \cdot (-4) = +12$.'
  - '2. Exponentes: $2 + 3 = 5$.'
  - '3. Resultado: $12m^5$.'
- titulo: Positivo por negativo
  enunciado: ¿Cuál es el producto de $(5p^4) \cdot (-2p)$?
  alternativas:
  - $-10p^5$
  - $10p^5$
  - $-10p^4$
  respuesta: $-10p^5$
  solucion_pasos:
  - '1. Coeficientes: $5 \cdot (-2) = -10$.'
  - '2. Exponentes: $4 + 1 = 5$.'
  - '3. Resultado: $-10p^5$.'
- titulo: Invarianza de exponentes positivos
  enunciado: En el producto $(-8x^3) \cdot (-2x^4)$, ¿se obtiene $+16x^7$ con exponente positivo $7$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3 + 4 = 7$; el coeficiente negativo no afecta al exponente.
- titulo: Tres monomios negativos
  enunciado: Para $(-x) \cdot (-y) \cdot (-z)$, ¿es el resultado $-xyz$ con signo negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, 3 negativos (impar) $\implies -xyz$.
errores_frecuentes:
- Alterar los signos de los exponentes de las variables al multiplicar por un monomio de coeficiente negativo.
- Aplicar la regla de adición de enteros al multiplicar dos coeficientes negativos.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- El signo negativo del coeficiente resultante en productos de signos distintos no es incluido.
- Multiplicar los exponentes de las potencias al cambiar los signos de los coeficientes.
afirmaciones_verdaderas:
- El signo negativo de un monomio pertenece únicamente a su coeficiente numérico y no altera las potencias de sus variables.
- El producto de dos monomios con coeficientes negativos genera un monomio con coeficiente positivo.
al_terminar_debes_poder: '![Resumen de monomios con coeficientes negativos](/static/img/nodos/multiplicacion-de-monomios-con-coeficientes-negativos-resumen.svg)


  QUÉ: Multiplicar monomios que incluyen signos negativos sin alterar los exponentes literales.


  CÓMO: Encerrar los factores negativos entre paréntesis $(-c_1 X)$, multiplicar escalares según la ley de signos y sumar los exponentes normalmente.'
