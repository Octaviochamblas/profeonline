  enunciado: 'Respecto de «Multiplicación de monomios con coeficientes negativos»:
    ¿La siguiente conclusión es correcta? «Sumar los coeficientes negativos creyendo
    que es una adición (ej. $(-2)(-3) = -5$ en lugar de $+6$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al multiplicar **Monomios Negativos**,
