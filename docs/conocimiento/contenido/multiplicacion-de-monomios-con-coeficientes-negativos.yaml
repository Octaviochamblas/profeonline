semantic_id: MAT.ALG.MULT_MONOMIOS.MONOMIOS_NEGATIVOS
resumen_inicial: 'Multiplicación de monomios con coeficientes negativos: leyes, procedimiento
  y aplicación en Multiplicación de monomios.'
explicacion_simple: Los signos negativos en el álgebra pueden asustar, pero en la
  multiplicación son de lo más predecibles. Siguiendo las reglas de signos que ya
  conoces, los negativos simplemente se cancelan por pares o se mantienen si hay un
  número impar.
explicacion_formal: '### Definición formal


  Signo: $(-)(-) = +$. Coeficientes: $6 \times 2 = 12$. Letras: $a^3 \cdot a = a^4$
  y $b$. Resultado: $12a^4b$.


  ### Desarrollo didáctico


  Multiplica: $(-3x^2y^2)(-5xy^3)$.


  1. Signo: dos negativos multiplicando se cancelan → positivo.

  2. Coeficientes: $3 \times 5 = 15$.

  3. Parte literal: $x^2 \cdot x = x^3$ y $y^2 \cdot y^3 = y^5$.

  4. Resultado final: $15x^3y^5$.


  Si multiplicamos tres factores: $(-2a)(-a^2)(-3b)$:

  - 3 negativos (impar) → negativo.

  - Coeficientes: $2 \times 1 \times 3 = 6$.

  - Letras: $a \cdot a^2 \cdot b = a^3b$.

  - Resultado: $-6a^3b$.'
definiciones_clave: '- **Multiplicación de monomios con coeficientes negativos**:
  Propiedad o regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a multiplicación de monomios con coeficientes negativos.'
ejemplo_guiado:
