errores_frecuentes:
- Sumar los coeficientes negativos creyendo que es una adición (ej. $(-2)(-3) = -5$
  en lugar de $+6$).
- Omitir el signo negativo del coeficiente del resultado cuando hay un número impar
  de factores negativos.
- $-12a^4b$.
- $-8a^4b$.
- Para «¿Cuál es el resultado de multiplicar $(-6a^3)$ por $(-2ab)$? (v1)», la respuesta
  correcta es $12a^3b$.
afirmaciones_verdaderas:
- En el producto de monomios, los exponentes de bases iguales se suman.
