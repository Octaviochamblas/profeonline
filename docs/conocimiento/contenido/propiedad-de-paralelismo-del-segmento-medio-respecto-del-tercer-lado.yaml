semantic_id: MAT.GEO.SEGMENTO_MEDIO.PARALELISMO_TERCER_LADO
resumen_inicial: El segmento medio que une los puntos medios de dos lados de un triángulo
  es estrictamente paralelo al tercer lado ($\overline{M_c M_b} \parallel \overline{BC}$).
explicacion_simple: '![Paralelismo del Segmento Medio](/static/img/nodos/propiedad-de-paralelismo-del-segmento-medio-respecto-del-tercer-lado-intro.svg)


  Cuando unes los puntos medios de dos lados de un triángulo:


  - **Va en la misma dirección que la base**: La línea queda perfectamente **paralela**
  al tercer lado (nunca se chocarían si las prolongaras).

  - **Copia los mismos ángulos**: Los ángulos que forma con los lados laterales son
  exactamente iguales a los ángulos de las esquinas de abajo ($\angle AM_c M_b = \angle
  B$).

  - **Crea un triángulo en miniatura**: El triángulo pequeño de arriba ($\Delta AM_c
  M_b$) tiene la misma forma que el triángulo grande ($\Delta ABC$).

  '
explicacion_formal: '### Teorema de la base media (Paralelismo)

  En cualquier triángulo $\Delta ABC$, el segmento medio que une los puntos medios
  de dos lados es estrictamente **paralelo** al tercer lado:


  $$\overline{M_c M_b} \parallel \overline{BC} \implies \overleftrightarrow{M_c M_b}
  \parallel \overleftrightarrow{BC}$$


  $$\angle AM_c M_b \cong \angle B \quad \land \quad \angle AM_b M_c \cong \angle
  C \quad (\text{Ángulos correspondientes})$$


  ### Desglose simbólico y geométrico

  - Demostración por el Teorema recíproco de Tales: $\frac{AM_c}{AB} = \frac{AM_b}{AC}
  = \frac{1}{2} \implies \overline{M_c M_b} \parallel \overline{BC}$.

  - Triángulos semejantes: $\Delta AM_c M_b \sim \Delta ABC$ con factor de escala
  $k = 1/2$.


  ### Síntesis didáctica

  El paralelismo del segmento medio garantiza la conservación de ángulos y genera
  un triángulo superior semejante a escala 1:2.'
definiciones_clave: '- **Paralelismo ($\parallel$)**: Relación geométrica entre dos
  rectas o segmentos coplanares que no se intersectan en ningún punto.

  - **Ángulos correspondientes**: Parejas de ángulos en la misma posición relativa
  respecto a una secante que corta dos rectas paralelas.

  - **Teorema de la base media (Paralelismo)**: Teorema que demuestra que todo segmento
  medio es paralelo al lado opuesto.

  '
propiedades_relaciones: '- **Paralelismo**: $\overline{M_c M_b} \parallel \overline{BC}$,
  $\overline{M_a M_c} \parallel \overline{AC}$, $\overline{M_a M_b} \parallel \overline{AB}$.

  - **Ángulos correspondientes**: $\angle AM_c M_b = \angle B$ y $\angle AM_b M_c
  = \angle C$.

  - **Semejanza de triángulos**: $\Delta AM_c M_b \sim \Delta ABC$ con razón $k =
  \frac{1}{2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Paralelismo](/static/img/nodos/propiedad-de-paralelismo-del-segmento-medio-respecto-del-tercer-lado-ejemplos.svg)


    En un triángulo $ABC$, el ángulo en el vértice $B$ mide $58^\circ$ y el ángulo
    en el vértice $C$ mide $72^\circ$. Se traza el segmento medio $\overline{M_c M_b}$
    paralelo a la base $\overline{BC}$. Calcula las medidas de los ángulos interiores
    $\angle AM_c M_b$ y $\angle AM_b M_c$ del triángulo superior.

    '
  pasos:
  - 'Paso 1: Aplicar la propiedad de paralelismo: el segmento medio $\overline{M_c
    M_b}$ es paralelo a la base $\overline{BC}$.'
  - 'Paso 2: Identificar ángulos correspondientes entre paralelas: $\angle AM_c M_b
    = \angle B$ y $\angle AM_b M_c = \angle C$.'
  - 'Paso 3: Sustituir los valores conocidos: $\angle AM_c M_b = 58^\circ$ y $\angle
    AM_b M_c = 72^\circ$.'
  - 'Paso 4: Concluir que los ángulos correspondientes miden exactamente $58^\circ$
    y $72^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué elemento del triángulo es paralelo el segmento medio que une los
    puntos medios de AB y AC?
  choices:
  - text: Al tercer lado (lado BC)
    is_correct: true
  - text: A la altura desde el vértice A
    is_correct: false
  - text: A la bisectriz del ángulo A
    is_correct: false
  - text: Al lado AB
    is_correct: false
  explanation: El segmento medio que une los puntos medios de AB y AC es paralelo
    al tercer lado (lado BC).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en un triángulo el ángulo interior en el vértice B mide 45°, ¿cuánto
    mide el ángulo correspondiente ∠AMcMb formado por el segmento medio?
  choices:
  - text: $45^\circ$
    is_correct: true
  - text: $90^\circ$
    is_correct: false
  - text: $135^\circ$
    is_correct: false
  - text: $22.5^\circ$
    is_correct: false
  explanation: Mide $45^\circ$, ya que por paralelismo los ángulos correspondientes
    son iguales ($\angle AM_c M_b = \angle B = 45^\circ$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los dos lados cuyos puntos medios forman el segmento medio.'
- 'Paso 2: Identificar el tercer lado del triángulo (el lado restante).'
- 'Paso 3: Establecer la relación de paralelismo entre el segmento medio y dicho tercer
  lado.'
- 'Paso 4: Igualar los ángulos correspondientes formados con las rectas transversales.'
errores_correccion: El segmento medio siempre es paralelo al TERCER lado (aquel que
  no contiene a los puntos medios seleccionados).
ejemplos:
- titulo: Ejemplo 1
  enunciado: En el triángulo $ABC$, $\overline{DE}$ es el segmento medio paralelo
    a $BC$. Si el ángulo $\angle C = 80^\circ$, ¿cuánto mide el ángulo $\angle ADE$?
  alternativas:
  - $80^\circ$ si $E$ está en $AC$, o el ángulo en $B$ si $D$ está en $AB$
  - Siempre $90^\circ$
  - $40^\circ$
  respuesta: $80^\circ$ si $E$ está en $AC$, o el ángulo en $B$ si $D$ está en $AB$
  solucion_pasos:
  - Por paralelismo, los ángulos correspondientes son iguales a los ángulos basales
    del triángulo.
- titulo: Ejemplo 2
  enunciado: ¿El paralelismo del segmento medio se cumple en triángulos escalenos?
  alternativas:
  - Sí, se cumple en absolutamente todos los triángulos
  - No, solo en triángulos equiláteros
  - Solo en triángulos rectángulos
  respuesta: Sí, se cumple en absolutamente todos los triángulos
  solucion_pasos:
  - El Teorema de la base media es un teorema universal de la geometría euclidiana
    aplicable a todo triángulo.
- titulo: ¿El segmento medio de un triángulo es siempre paralelo al tercer lado?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una propiedad geométrica invariable demostrada por el teorema de Tales.
- titulo: ¿El segmento medio corta al tercer lado formando un ángulo de 90°?
  respuesta: 'No'
  solucion_pasos:
  - No, el segmento medio nunca corta al tercer lado porque es paralelo a él ($\overline{M_c
    M_b} \parallel \overline{BC}$).
errores_frecuentes:
- Creer que el paralelismo solo se cumple si el triángulo es isósceles.
- Confundir cuál de los tres lados es el paralelo.
- Pensar que los ángulos correspondientes se restan de 180° en lugar de ser iguales.
- Olvidar que el triángulo superior es semejante al original.
- Creer que el segmento medio puede cortar a la base.
afirmaciones_verdaderas:
- El segmento medio de un triángulo es paralelo al tercer lado.
- El segmento medio genera un triángulo superior semejante al triángulo original con
  razón 1:2.
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad de paralelismo del segmento
  medio respecto del tercer lado.


  **CÓMO:** Estableciendo la condición de paralelismo ($\overline{M_c M_b} \parallel
  \overline{BC}$) y calculando ángulos mediante la igualdad de ángulos correspondientes
  ($\angle AM_c M_b = \angle B$).


  ![Resumen de Paralelismo](/static/img/nodos/propiedad-de-paralelismo-del-segmento-medio-respecto-del-tercer-lado-resumen.svg)

  '
