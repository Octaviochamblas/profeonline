semantic_id: MAT.ALG.TERMINO.GRADO_ABSOLUTO_TERMINO
resumen_inicial: 'El grado absoluto de un término algebraico es la suma de los exponentes de todas las variables que conforman su parte literal.'
explicacion_simple: |
  - El **grado absoluto (GA)** mide la potencia total combinada de un término.
  - **¿Cómo se calcula?** Se suman los exponentes de **todas las letras** que aparecen en el término:
    - En $7x^4$, el grado absoluto es **$4$** (de 4° grado).
    - En $-3x^4y^2z$, sumamos los exponentes: $4 + 2 + 1 = **7$** (de 7° grado). Recuerda que $z = z^1$.
    - En una constante numérica pura como $9$ (sin letras), el grado absoluto es **$0$**.

  ![Grado Absoluto de un Término](/static/img/nodos/calculo-del-grado-absoluto-de-un-termino-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sea $T = c \cdot x_1^{e_1} x_2^{e_2} \cdots x_k^{e_k}$ un monomio no nulo con $c \neq 0$ y $e_i \in \mathbb{N}_0$. El **grado absoluto de $T$**, denotado por $\operatorname{GA}(T)$ o $\operatorname{gr}(T)$, es la suma escalar de los exponentes de todas sus variables:

  $$\operatorname{GA}(T) = \sum_{i=1}^k e_i = e_1 + e_2 + \dots + e_k$$

  ### Casos canónicos
  1. **Término monovariable:** $\operatorname{GA}(ax^n) = n$.
  2. **Término multivariable:** $\operatorname{GA}(ax^p y^q z^r) = p + q + r$.
  3. **Término constante independiente ($c \in \mathbb{R} \setminus \{0\}$):** $\operatorname{GA}(c) = 0$ (puesto que $c = c \cdot x^0$).
  4. **Polinomio nulo ($0$):** Por definición formal, carece de grado o su grado se define como $-\infty$.
definiciones_clave: |
  - **Grado absoluto (GA)**: Suma total de los exponentes de todas las variables de la parte literal.
  - **Término de grado cero**: Constante numérica no nula que no contiene variables literales ($GA = 0$).
  - **Monomio homogéneo**: Términos que poseen exactamente el mismo grado absoluto.
propiedades_relaciones: |
  - **Grado del producto de monomios**: El grado absoluto del producto de dos términos es la suma de sus grados absolutos: $\operatorname{GA}(T_1 \cdot T_2) = \operatorname{GA}(T_1) + \operatorname{GA}(T_2)$.
  - **Grado del cociente de monomios**: $\operatorname{GA}(T_1 / T_2) = \operatorname{GA}(T_1) - \operatorname{GA}(T_2)$.
ejemplo_guiado:
  enunciado: 'Calcula el grado absoluto del término algebraico $T = -8a^3b^4c^2d$.'
  imagen: '/static/img/nodos/calculo-del-grado-absoluto-de-un-termino-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos todas las variables presentes en la parte literal: $a, b, c, d$.'
    - 'Paso 2: Extraemos el exponente de cada variable:'
    - '  - Exponente de $a$: **$3$**'
    - '  - Exponente de $b$: **$4$**'
    - '  - Exponente de $c$: **$2$**'
    - '  - Exponente de $d$: **$1$** (exponente tácito)'
    - 'Paso 3: Sumamos todos los exponentes: $\operatorname{GA}(T) = 3 + 4 + 2 + 1 = **10$**.'
    - 'Paso 4: Conclusión: El término es de **décimo grado ($10^{\circ}$)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el grado absoluto del término algebraico $-5x^3y^2z$?'
    choices:
      - text: '$6$, porque la suma de los exponentes es $3 + 2 + 1 = 6$'
        is_correct: true
      - text: '$5$, porque solo se suman $3 + 2$'
        is_correct: false
      - text: '$3$, porque es el mayor exponente'
        is_correct: false
      - text: '$-5$, porque es el coeficiente'
        is_correct: false
    explanation: 'La alternativa correcta es ''$6$, porque la suma de los exponentes es $3 + 2 + 1 = 6$''. Se debe incluir el exponente 1 de la variable $z$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el grado absoluto de una constante numérica no nula como el número 12?'
    choices:
      - text: '$0$, porque no contiene variables literales ($12 = 12x^0$)'
        is_correct: true
      - text: '$12$'
        is_correct: false
      - text: '$1$'
        is_correct: false
      - text: 'No tiene definición'
        is_correct: false
    explanation: 'La alternativa correcta es ''$0$, porque no contiene variables literales ($12 = 12x^0$)''. Las constantes numéricas tienen grado absoluto cero.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar todas las letras de la parte literal.'
  - 'Paso 2: Escribir el exponente de cada letra (asignando $1$ si no lleva número visible).'
  - 'Paso 3: Sumar algebraicamente todos los exponentes obtenidos.'
  - 'Paso 4: El resultado es el grado absoluto del término (monomio).'
errores_correccion: |
  - **Error 1:** Olvidar sumar el exponente 1 de las letras sin superíndice escrito. **Cómo corregirlo:** En $x^2y$, el exponente de $y$ es **$1$**, por lo que $\operatorname{GA} = 2 + 1 = 3$.
  - **Error 2:** Sumar los exponentes de los números coeficientes (ej. en $2^3 x^4$, decir grado $3+4=7$). **Cómo corregirlo:** El grado solo suma **los exponentes de las variables literales** ($GA = 4$).
ejemplos:
  - titulo: 'Cálculo de GA con variable implícita'
    enunciado: '¿Cuál es el grado absoluto del monomio $15m^2np^4$?'
    alternativas:
      - '$7$'
      - '$6$'
      - '$15$'
    respuesta: '$7$'
    solucion_pasos:
      - '1. Exponentes: $m \rightarrow 2, n \rightarrow 1, p \rightarrow 4$.'
      - '2. Suma: $2 + 1 + 4 = 7$.'
      - '3. El grado absoluto es 7.'
  - titulo: 'Grado del producto de dos términos'
    enunciado: 'Si $T_1$ tiene grado 3 y $T_2$ tiene grado 4, ¿cuál es el grado absoluto del producto $T_1 \cdot T_2$?'
    alternativas:
      - '$7$'
      - '$12$'
      - '$4$'
    respuesta: '$7$'
    solucion_pasos:
      - '1. Al multiplicar potencias de igual base se suman los exponentes.'
      - '2. $\operatorname{GA}(T_1 \cdot T_2) = 3 + 4 = 7$.'
  - titulo: 'Grado absoluto de monomio de una letra'
    enunciado: '¿Es el grado absoluto de $-9x^5$ igual a 5?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Solo hay una variable ($x$) con exponente 5.'
      - '2. El grado absoluto es 5.'
  - titulo: 'Inclusión de exponentes del coeficiente'
    enunciado: '¿Es el grado absoluto del término $3^4 x^2$ igual a 6?'
    respuesta: 'No'
    solucion_pasos:
      - '1. $3^4 = 81$ es el coeficiente numérico constante.'
      - '2. El grado absoluto solo considera el exponente de la variable $x$, que es 2.'
errores_frecuentes:
  - 'Olvidar sumar el exponente 1 de las letras que no tienen superíndice escrito.'
  - 'Sumar el exponente del coeficiente numérico ($2^3 x^4$) al grado de las variables literales.'
  - 'Tomar el mayor exponente individual en lugar de sumar todos los exponentes del término.'
  - 'Confundir el coeficiente numérico con el grado absoluto del monomio.'
  - 'Afirmar que una constante numérica como el 7 tiene grado absoluto 1.'
afirmaciones_verdaderas:
  - 'El grado absoluto de un término algebraico es la suma de los exponentes de todas sus variables literales.'
  - 'Toda constante numérica real no nula posee un grado absoluto igual a cero.'
al_terminar_debes_poder: |
  ![Resumen de Grado Absoluto](/static/img/nodos/calculo-del-grado-absoluto-de-un-termino-resumen.svg)

  QUÉ: Calcular el grado absoluto de cualquier término algebraico monovariable o multivariable y comprender el grado de constantes numéricas.
  CÓMO: Sumando todos los exponentes de las variables literales ($\operatorname{GA} = e_1 + e_2 + \dots + e_k$) en términos como $-3x^4y^2z \implies 4 + 2 + 1 = 7$.
