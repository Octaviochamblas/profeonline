semantic_id: MAT.ALG.TERMINO.GRADO_ABSOLUTO_TERMINO
resumen_inicial: 'Cálculo del grado absoluto de un término: concepto y propiedades
  en Término algebraico.'
explicacion_simple: '¿Qué tan ''pesado'' matemáticamente es un vagón de tren algebraico?
  El Grado Absoluto es como pesar el término completo en una balanza: metemos todas
  las letras y sumamos su potencia total.'
explicacion_formal: '### Definición formal


  El grado absoluto es una medida global del término, sumando todas las potencias
  literales presentes.


  ### Desarrollo didáctico


  Para encontrar el grado absoluto, ignoramos completamente al coeficiente numérico
  y nos concentramos solo en la parte literal.

  Ejemplo 1: Termino $4x^3$.

  - Tiene solo una letra ($x$) con exponente $3$. Su grado absoluto es $3$.


  Ejemplo 2: Término $-5a^2b^3c$.

  - Exponente de $a$ = $2$.

  - Exponente de $b$ = $3$.

  - Exponente de $c$ = $1$ (el uno invisible).

  - Grado absoluto = $2 + 3 + 1 = 6$. Es un término de sexto grado.


  Ejemplo 3: Término $8$.

  - No hay letras. Matemáticamente es $8x^0$. Su grado absoluto es $0$.'
definiciones_clave: '- **Cálculo del grado absoluto de un término**: Elemento fundamental
