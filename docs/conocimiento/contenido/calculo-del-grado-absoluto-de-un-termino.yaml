semantic_id: MAT.ALG.TERMINO.GRADO_ABSOLUTO_TERMINO
resumen_inicial: 'El cálculo del grado absoluto de un término algebraico se efectúa sumando los exponentes de todas las variables que forman parte de su parte literal.'
explicacion_simple: |
  El **grado absoluto** mide la "potencia total" o dimensión combinada de un término algebraico:
  - Para calcularlo, **sumas todos los exponentes de las letras** que aparecen en el término.
  - Ejemplo 1: En $5x^3 y^2$, los exponentes son $3$ y $2 \implies$ Grado absoluto = $3 + 2 = 5$ (es de quinto grado).
  - Ejemplo 2: En $-4a^2 b c^3$, los exponentes son $2$, $1$ (para la $b$) y $3 \implies$ Grado absoluto = $2 + 1 + 3 = 6$ (es de sexto grado).
  - **Recuerda**: Las letras que no tienen exponente escrito valen $1$ en la suma. El número del coeficiente no se suma jamás.
explicacion_formal: |
  ### Definición formal
  Dado un término algebraico no nulo $M(x_1, \dots, x_k) = c \cdot x_1^{\alpha_1} x_2^{\alpha_2} \cdots x_k^{\alpha_k}$ con $c \neq 0$, el **grado absoluto** $\operatorname{grabs}(M)$ (o grado total) es la suma de los exponentes enteros de sus variables literales:

  $$\operatorname{grabs}(M) = \sum_{i=1}^k \alpha_i = \alpha_1 + \alpha_2 + \dots + \alpha_k$$

  ### Propiedades del Grado Absoluto
  1. **Término constante independizado**: Si un término consta únicamente de un número real no nulo $c \in \mathbb{R} \setminus \{0\}$ (sin letras), su parte literal es $x^0$, por lo que su grado absoluto es cero:
     $$\operatorname{grabs}(c) = 0$$
  2. **Multiplicación de términos**: El grado absoluto del producto de dos términos es la suma de sus grados absolutos individuales:
     $$\operatorname{grabs}(M_1 \cdot M_2) = \operatorname{grabs}(M_1) + \operatorname{grabs}(M_2)$$

  ### Síntesis didáctica
  El grado absoluto indica la dimensión polinómica global del monomio. Es una propiedad clave para ordenar polinomios y verificar homogeneidad en ecuaciones de física y geometría.
definiciones_clave: |
  - **Grado absoluto de un término**: Suma aritmética de todos los exponentes de las letras que constituyen su parte literal.
  - **Grado cero**: Grado asignado a cualquier número constante no nulo sin parte literal.
  - **Términos homogéneos**: Dos o más términos algebraicos que poseen exactamente el mismo grado absoluto.
propiedades_relaciones: |
  - **Grado del producto**: $\operatorname{grabs}(M_1 \cdot M_2) = \operatorname{grabs}(M_1) + \operatorname{grabs}(M_2)$.
  - **Grado del cociente**: $\operatorname{grabs}(M_1 / M_2) = \operatorname{grabs}(M_1) - \operatorname{grabs}(M_2)$.
ejemplo_guiado:
  enunciado: 'Calcula el grado absoluto de los siguientes términos algebraicos: a) $-7x^4 y^3$, b) $3a^2 b c^5$, c) $18$.'
  pasos:
    - 'Paso 1: Para $-7x^4 y^3$, identificamos los exponentes de sus letras ($x \to 4, y \to 3$). Sumamos: $4 + 3 = 7$. El grado absoluto es **$7$**.'
    - 'Paso 2: Para $3a^2 b c^5$, identificamos los exponentes ($a \to 2, b \to 1, c \to 5$). Sumamos: $2 + 1 + 5 = 8$. El grado absoluto es **$8$**.'
    - 'Paso 3: Para el número constante $18$, no posee variables en su parte literal ($18x^0$). El grado absoluto es **$0$**.'
    - 'Conclusión: Los grados absolutos son **$7$, $8$ y $0$** respectivamente.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se calcula el grado absoluto de un término algebraico que posee múltiples letras?'
    choices:
      - {text: 'Sumando los exponentes de todas las variables presentes en su parte literal', is_correct: true}
      - {text: 'Multiplicando el coeficiente numérico por el exponente mayor', is_correct: false}
      - {text: 'Restando el menor exponente al mayor exponente', is_correct: false}
      - {text: 'Tomando únicamente el exponente de la primera letra', is_correct: false}
    explanation: 'La alternativa correcta es ''Sumando los exponentes de todas las variables presentes en su parte literal''. Definición de grado absoluto.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el grado absoluto del término algebraico $-5 u^3 v w^2$?'
    choices:
      - {text: 'El grado absoluto es $6$, sumando $3 + 1 + 2 = 6$', is_correct: true}
      - {text: 'El grado absoluto es $5$, considerando solo $3 + 2$', is_correct: false}
      - {text: 'El grado absoluto es $-5$, igual a su coeficiente', is_correct: false}
      - {text: 'El grado absoluto es $3$, por ser el mayor exponente', is_correct: false}
    explanation: 'La alternativa correcta es ''El grado absoluto es $6$, sumando $3 + 1 + 2 = 6$''. No se debe olvidar sumar el exponente implícito $1$ de la $v$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar todas las variables o letras que componen la parte literal del término.'
  - 'Paso 2: Anotar el exponente de cada variable (recordando asignar $1$ a las letras sin superíndice escrito).'
  - 'Paso 3: Sumar numéricamente todos los exponentes obtenidos (ignorando el coeficiente numérico y su signo).'
  - 'Paso 4: Declarar el resultado de la suma como el grado absoluto del término.'
errores_correccion: |
  - **Error 1:** Incluir el número del coeficiente o su signo en la suma del grado absoluto (ej: en $4x^2 y^3$ decir que el grado es $4 + 2 + 3 = 9$). **Cómo corregirlo:** El grado absoluto **SÓLO suma los exponentes de las letras**, el coeficiente no se suma.
  - **Error 2:** Excluir el exponente implícito $1$ de una letra simple al sumar (ej: en $x^2 y$ declarar que el grado es $2$ en vez de $2 + 1 = 3$). **Cómo corregirlo:** Las letras simples **aportan $1$ a la suma del grado absoluto**.
ejemplos:
  - titulo: 'Cálculo de grado absoluto'
    enunciado: '¿Cuál es el grado absoluto del término $-2x^5 y^4 z$?'
    alternativas:
      - '$10$'
      - '$9$'
      - '$-2$'
    respuesta: '$10$'
    solucion_pasos:
      - '1. Exponentes: $x \to 5, y \to 4, z \to 1$.'
      - '2. Sumamos: $5 + 4 + 1 = 10$.'
  - titulo: 'Grado de término constante'
    enunciado: '¿Cuál es el grado absoluto del número constante $-45$?'
    alternativas:
      - '$0$'
      - '$-45$'
      - '$1$'
    respuesta: '$0$'
    solucion_pasos:
      - '1. No posee variables literales ($x^0$).'
      - '2. El grado absoluto es $0$.'
  - titulo: 'Comparación de términos homogéneos'
    enunciado: 'Los términos $4a^3 b^2$ y $-9a^4 b$, ¿tienen ambos el mismo grado absoluto igual a $5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $3 + 2 = 5$ y $4 + 1 = 5$. Tienen igual grado (homogéneos).'
  - titulo: 'Grado de un monomio simple'
    enunciado: 'En el término $7x$, ¿el grado absoluto es igual a $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la única variable $x$ tiene exponente $1$.'
errores_frecuentes:
  - 'El coeficiente numérico se suma con los exponentes al calcular el grado absoluto de un término.'
  - 'Una letra sin exponente escrito no aporta nada (aporta 0) al cálculo del grado absoluto.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'El grado absoluto de un término negativo se debe multiplicar por menos uno.'
  - 'El grado absoluto de un número constante sin letras es igual a uno.'
afirmaciones_verdaderas:
  - 'El grado absoluto de un término algebraico es la suma de los exponentes de todas las variables de su parte literal.'
  - 'Toda constante numérica no nula sin parte literal posee un grado absoluto igual a cero.'
al_terminar_debes_poder: 'Calcular el grado absoluto de cualquier término algebraico sumando los exponentes de sus variables e identificando términos homogéneos.'
