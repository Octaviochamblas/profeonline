resumen_inicial: El grado absoluto de un término algebraico es la suma de los exponentes
  de todas las variables contenidas en su parte literal.
explicacion_simple: 'Para calcular el grado absoluto de un solo término (como $-4x^3y^2z$),
  tomamos los exponentes de todas sus letras y los sumamos: $3 + 2 + 1 = 6$. El grado
  absoluto de ese término es $6$. Si el término es solo un número sin letras (como
  $+9$), su grado absoluto es $0$.'
explicacion_formal: 'Para un término $T = c \cdot \prod_{j=1}^m x_j^{e_j}$, el **Grado
  Absoluto del Término** $G.A.(T)$ es la suma escalar de sus exponentes literales:


  $$G.A.(T) = \sum_{j=1}^m e_j = e_1 + e_2 + \dots + e_m$$


  > **Complemento didáctico:** El grado absoluto del término cuantifica la dimensión
  conjunta de variación de su bloque de variables.'
definiciones_clave: '- **Grado absoluto de un término**: Suma total de los exponentes
  de todas las variables de la parte literal.'
propiedades_relaciones: '- **Término constante**: Un número real no nulo sin variables
  posee grado absoluto igual a $0$.'
ejemplo_guiado:
  enunciado: Calcule el grado absoluto del término $T = -8a^4b^3c^2$.
  pasos:
  - 'Paso 1: Identificar el exponente de $a$: $4$.'
  - 'Paso 2: Identificar el exponente de $b$: $3$.'
  - 'Paso 3: Identificar el exponente de $c$: $2$.'
  - 'Paso 4: Sumar los tres exponentes: $4 + 3 + 2 = 9$.'
  - 'Conclusión: El grado absoluto del término $-8a^4b^3c^2$ es $9$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula el grado absoluto de un término algebraico multivariable?
  choices:
  - text: Sumando los exponentes de todas las variables que forman su parte literal
    is_correct: true
  - text: Multiplicando los exponentes por el coeficiente numérico
    is_correct: false
  - text: Tomando únicamente el exponente de la primera letra
    is_correct: false
  - text: Restando los exponentes
    is_correct: false
  explanation: La alternativa correcta es 'Sumando los exponentes de todas las variables
    que forman su parte literal'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para -8a^4b^3c^2, ¿cuál fue su grado absoluto?
  choices:
  - text: '9'
    is_correct: true
  - text: '24'
    is_correct: false
  - text: '-8'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: La alternativa correcta es '9'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar todas las variables presentes en la parte literal.'
- 'Paso 2: Anotar el exponente de cada variable (recordando que si no lleva es $1$).'
- 'Paso 3: Sumar todos los exponentes anotados para obtener el grado absoluto.'
errores_correccion: '- **Error 1: Omitir el exponente 1 de una letra sin exponente
  escrito al sumar (por ejemplo en $x^3y$ sumar solo 3).** **Cómo corregirlo:** La
  letra $y$ posee exponente $1$, por lo que el grado absoluto es $3 + 1 = 4$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el grado absoluto del término 5x^3y^4z?
  alternativas:
  - '8'
  - '7'
  - '12'
  - '5'
  respuesta: '8'
  solucion_pasos:
  - '1. Exponente de x: 3.'
  - '2. Exponente de y: 4.'
  - '3. Exponente de z: 1.'
  - '4. Suma: 3 + 4 + 1 = 8.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el grado absoluto del término constante +15?
  alternativas:
  - '0'
  - '15'
  - '1'
  - Indefinido
  respuesta: '0'
  solucion_pasos:
  - 1. Un número constante sin variables no tiene letras.
  - 2. Su grado absoluto es 0.
- titulo: ¿Es el grado absoluto del término -2a^5b^2 igual a 7?
  respuesta: Sí
  solucion_pasos:
  - Sí, sumando los exponentes 5 + 2 = 7.
- titulo: ¿Se debe incluir el coeficiente numérico al sumar los exponentes para el
    grado absoluto?
  respuesta: 'No'
  solucion_pasos:
  - No, el grado absoluto depende únicamente de los exponentes de las letras.
errores_frecuentes:
- Omitir sumar el exponente 1 de las variables que no llevan superíndice escrito.
- Sumar el coeficiente numérico de adelante junto con los exponentes de las letras.
- Multiplicar los exponentes de las letras en lugar de sumarlos.
- Declarar que el grado absoluto de una constante numérica es 1 en lugar de 0.
- Declarar el grado absoluto de un término con su grado relativo respecto a una variable.
afirmaciones_verdaderas:
- El grado absoluto de un término se obtiene sumando los exponentes de todas sus variables.
- Un término constante sin parte literal posee grado absoluto igual a 0.
al_terminar_debes_poder: Al terminar serás capaz de calcular el grado absoluto de
  cualquier término algebraico sumando los exponentes de todas sus variables.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Término Algebraico.
estado: publicado
