procedimiento:
- 'Paso 1: Extrae la raíz cúbica de ambos términos ($a$ y $b$).'
- 'Paso 2: Escribe el binomio con la resta: $(a - b)$.'
- 'Paso 3: Escribe el trinomio abriendo paréntesis.'
- 'Paso 4: Eleva la primera raíz al cuadrado: $a^2$.'
- 'Paso 5: Multiplica ambas raíces y ponle signo positivo: $+ab$.'
- 'Paso 6: Eleva la segunda raíz al cuadrado y ponle signo positivo: $+b^2$.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en factorización de una diferencia de cubos perfectos.
ejemplos:
- titulo: Factoriza $y^3 - 1000$
  enunciado: Factoriza $y^3 - 1000$.
  solucion_pasos:
  - 'Raíces: $y$ y $10$.'
  - 'Binomio: $(y - 10)$.'
  - 'Trinomio: $y^2 + 10y + 100$.'
  - 'Respuesta final: $(y - 10)(y^2 + 10y + 100)$.'
- titulo: Factoriza $8m^6 - 1$.
  solucion_pasos:
  - 'Raíces: 2m^2 y 1. Binomio (2m^2-1). Trinomio: (2m^2)^2 = 4m^4. Producto = +2m^2.
    (1)^2 = +1.'
- titulo: 'Respecto de «Factorización de una diferencia de cubos perfectos»: ¿La siguiente
    formulación'
  enunciado: 'Respecto de «Factorización de una diferencia de cubos perfectos»: ¿La
    siguiente formulación es correcta? «La diferencia de cubos se factoriza como:
    $(a-b)(a^2 + ab + b^2)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La diferencia de cubos se factoriza
    como: $(a-b)(a^2 + ab + b^2)$.'
- titulo: 'Respecto de «Factorización de una diferencia de cubos perfectos»: ¿La siguiente
    conclusión e'
  enunciado: 'Respecto de «Factorización de una diferencia de cubos perfectos»: ¿La
    siguiente conclusión es correcta? «Poner un signo negativo en el término central
    del trinomio»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La diferencia de cubos se factoriza
    como: $(a-b)(a^2 + ab + b^2)$.'
errores_frecuentes:
- Poner un signo negativo en el término central del trinomio.
- 'Elevar incorrectamente la primera raíz al cuadrado si tiene coeficientes numéricos
  (Ej: raíz $3x$, poner $3x^2$ en vez de $9x^2$).'
- Para «Según la regla SOAP, ¿qué signo lleva el término del medio en el trinomio
  largo de la Diferencia de Cubos», la respuesta correcta es Negativo.
- Para «Según la regla SOAP, ¿qué signo lleva el término del medio en el trinomio
  largo de la Diferencia de Cubos», la respuesta correcta es El mismo del problema
  original.
- Para «Según la regla SOAP, ¿qué signo lleva el término del medio en el trinomio
  largo de la Diferencia de Cubos», la respuesta correcta es Depende de las variables.
