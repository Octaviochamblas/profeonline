resumen_inicial: 'La factorización de una diferencia de cubos perfectos descompone
  $a^3 - b^3$ en el producto de un binomio resta por un trinomio de términos todos
  positivos: $(a - b)(a^2 + ab + b^2)$.'
explicacion_simple: 'Para factorizar $x^3 - 8$, usas las bases $x$ y $2$. Armas dos
  paréntesis: 1) Un binomio con las bases restadas $(x - 2)$, y 2) Un trinomio donde
  TODO es positivo: el cuadrado del primero, MÁS el producto de ambos, MÁS el cuadrado
  del segundo: $(x^2 + 2x + 4)$. El resultado es $(x - 2)(x^2 + 2x + 4)$.'
explicacion_formal: 'Dada la diferencia de cubos $A^3 - B^3$, el **Teorema de Factorización
  de Diferencia de Cubos** establece la identidad algebraica en $\mathbb{R}$:


  $$A^3 - B^3 = (A - B)(A^2 + AB + B^2)$$


  **Desglose simbólico:**

  - $(A - B)$: Factor binomio resta formado por las bases cúbicas.

  - $(A^2 + AB + B^2)$: Factor trinomio cuadrático no perfecto con signos strictly
  positivos en todos sus términos.

  - Discriminante de $(A^2 + AB + B^2)$: $\Delta = B^2 - 4(1)(B^2) = -3B^2 < 0$, confirmando
  su irreducibilidad en $\mathbb{R}$.


  > **Complemento didáctico:** Siguiendo el principio SOAP, el binomio lleva la resta
  (SAME), mientras que el trinomio lleva la suma en el producto central (OPPOSITE)
  y en el término final (ALWAYS POSITIVE).'
definiciones_clave: '- **Factor binomio resta**: Expresión $(A - B)$ que contiene
  la diferencia de las bases.

  - **Trinomio positivo irreducible**: Expresión cuadrática $(A^2 + AB + B^2)$ con
  todos sus sumandos positivos e irreducible en $\mathbb{R}$.'
propiedades_relaciones: '- **Complementariedad con suma de cubos**: Cambia el signo
  de resta al primer paréntesis y convierte todos los signos del trinomio a positivos.'
ejemplo_guiado:
  enunciado: Factorice la diferencia de cubos $27x^3 - 8$.
  pasos:
  - 'Paso 1: Obtener las bases cúbicas $A = 3x$ y $B = 2$.'
  - 'Paso 2: Construir el factor binomio resta $(A - B)$: $(3x - 2)$.'
  - 'Paso 3: Calcular los tres términos positivos del factor trinomio:'
  - '  - Cuadrado de la primera base: $A^2 = (3x)^2 = 9x^2$.'
  - '  - Producto positivo de las bases: $+AB = +(3x)(2) = +6x$.'
  - '  - Cuadrado de la segunda base: $B^2 = 2^2 = 4$.'
  - 'Paso 4: Unir los factores: $(3x - 2)(9x^2 + 6x + 4)$.'
  - 'Conclusión: La factorización de $27x^3 - 8$ es $(3x - 2)(9x^2 + 6x + 4)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión factorizada de la diferencia de cubos $A^3 - B^3$?
  choices:
  - text: $(A - B)(A^2 + AB + B^2)$
    is_correct: true
  - text: $(A - B)(A^2 - AB + B^2)$
    is_correct: false
  - text: $(A + B)(A^2 - AB - B^2)$
    is_correct: false
  - text: $(A - B)^3$
    is_correct: false
  explanation: La alternativa correcta es '$(A - B)(A^2 + AB + B^2)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al factorizar $27x^3 - 8$ con $A = 3x$ y $B = 2$, ¿cuál es el trinomio
    obtenido en el segundo paréntesis?
  choices:
  - text: $9x^2 + 6x + 4$
    is_correct: true
  - text: $9x^2 - 6x + 4$
    is_correct: false
  - text: $9x^2 + 12x + 4$
    is_correct: false
  - text: $3x^2 + 6x + 4$
    is_correct: false
  explanation: La alternativa correcta es '$9x^2 + 6x + 4$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las bases cúbicas $A = \sqrt[3]{T_1}$ y $B = \sqrt[3]{|T_2|}$.'
- 'Paso 2: Escribir el primer paréntesis binomio con la resta de las bases: $(A -
  B)$.'
- 'Paso 3: Escribir el segundo paréntesis trinomio con todos sus términos positivos:
  $(A^2 + AB + B^2)$.'
errores_correccion: '- **Error 1: Escribir un signo negativo en el término central
  del trinomio resultando en $(A - B)(A^2 - AB + B^2)$.** **Cómo corregirlo:** En
  la diferencia de cubos, el trinomio resultante lleva TODOS sus signos positivos:
  $(A^2 + AB + B^2)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice la diferencia de cubos $x^3 - 64$.
  alternativas:
  - $(x - 4)(x^2 + 4x + 16)$
  - $(x - 4)(x^2 - 4x + 16)$
  - $(x + 4)(x^2 - 4x + 16)$
  respuesta: $(x - 4)(x^2 + 4x + 16)$
  solucion_pasos:
  - 1. Bases $A = x, B = 4$.
  - '2. Factorización: $(x - 4)(x^2 + 4x + 16)$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la forma factorizada de $8a^3 - 27b^3$?
  alternativas:
  - $(2a - 3b)(4a^2 + 6ab + 9b^2)$
  - $(2a - 3b)(4a^2 - 6ab + 9b^2)$
  - $(2a + 3b)(4a^2 - 6ab + 9b^2)$
  respuesta: $(2a - 3b)(4a^2 + 6ab + 9b^2)$
  solucion_pasos:
  - 1. Bases $A = 2a, B = 3b$.
  - '2. Factorización: $(2a - 3b)(4a^2 + 6ab + 9b^2)$.'
- titulo: En la diferencia de cubos $A^3 - B^3$, ¿todos los términos del trinomio
    $(A^2 + AB + B^2)$ son positivos?
  respuesta: Sí
  solucion_pasos:
  - Sí, la regla establece signos totalmente positivos en el trinomio.
- titulo: ¿Es $(x - 2)^3$ equivalente a la factorización de $x^3 - 8$?
  respuesta: 'No'
  solucion_pasos:
  - No, $(x - 2)^3 = x^3 - 6x^2 + 12x - 8$, lo cual difiere de $x^3 - 8$.
errores_frecuentes:
- Colocar el signo negativo en el término central del trinomio $-AB$ en lugar de mantenerlo
  positivo $+AB$.
- Agregar un coeficiente 2 en el término central creando un falso cuadrado de binomio
  $+2AB$.
- Declarar que la diferencia de cubos equivale al cubo del binomio resta $(A - B)^3$.
- Dejar las bases sin elevar al cuadrado al calcular los extremos $A^2$ y $B^2$ del
  trinomio.
- Asignar signo negativo al último término del trinomio $-B^2$.
afirmaciones_verdaderas:
- La factorización de $A^3 - B^3$ produce el producto del binomio $(A - B)$ por el
  trinomio $(A^2 + AB + B^2)$.
- Todos los sumandos dentro del trinomio $(A^2 + AB + B^2)$ poseen signo positivo.
al_terminar_debes_poder: Al terminar serás capaz de factorizar una diferencia de cubos
  perfectos aplicando la fórmula $(A - B)(A^2 + AB + B^2)$.
