semantic_id: MAT.ALG.FACTOR_CUBOS.FACTORIZACION_DIFERENCIA_CUBOS
resumen_inicial: 'Factorización de una diferencia de cubos perfectos: concepto, método
  de descomposición y reglas en Factorización asociada a cubos.'
explicacion_simple: Hora de desarmar la resta. La fórmula para factorizar la Diferencia
  de Cubos es casi un espejo de la suma, pero los signos se cambian de asiento. Si
  aprendes la mnemotecnia correcta (SOAP), jamás los confundirás.
explicacion_formal: "### Definición formal\n\nOpposite (Opuesto). Como el problema\
  \ es una resta (-), el opuesto es positivo (+).\n\n### Desarrollo didáctico\n\n\
  Fórmula: $A^3 - B^3 = (A - B)(A^2 + A \\cdot B + B^2)$.\n\n¿Cómo recordar los signos?\
  \ Usa el acrónimo en inglés **SOAP** (Same, Opposite, Always Positive):\n- **S**ame\
  \ (Mismo signo): El binomio inicial lleva el MISMO signo que el problema ($-$).\n\
  - **O**pposite (Signo opuesto): El primer signo del trinomio lleva el OPUESTO ($+$).\n\
  - **AP** (Siempre Positivo): El último signo del trinomio es siempre POSITIVO ($+$).\n\
  \nFactoricemos $27x^3 - 64$:\n1. Raíces: $A = 3x$, $B = 4$.\n2. Binomio (Same):\
  \ $(3x - 4)$.\n3. Trinomio (Opposite, AP):\n   - Cuadrado de A: $(3x)^2 = 9x^2$\n\
  \   - Producto (Opposite sign): $+(3x)(4) = +12x$\n   - Cuadrado de B (Always Positive):\
  \ $+(4)^2 = +16$\n\nResultado: $(3x - 4)(9x^2 + 12x + 16)$."
definiciones_clave: '- **Factorización de una diferencia de cubos perfectos**: Técnica
  de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en factorización de una diferencia de cubos perfectos.'
