semantic_id: MAT.ALG.FACTOR_CUBOS.FACTORIZACION_DIFERENCIA_CUBOS
resumen_inicial: 'La factorización de una diferencia de cubos perfectos establece la identidad $A^3 - B^3 = (A - B)(A^2 + AB + B^2)$ compuesta por el producto de un binomio resta y un trinomio irreducible con todos sus términos positivos.'
explicacion_simple: |
  Para factorizar una **Diferencia de Cubos** $A^3 - B^3$ (ej: $x^3 - 8$, con $A = x$ y $B = 2$):
  - **FÓRMULA MAESTRA DE DIFERENCIA DE CUBOS**:
    $$\mathbf{A^3 - B^3 = (A - B)(A^2 + AB + B^2)}$$
  - **Estructura de los 2 factores resultantes**:
    1. **Binomio Resta $(A - B)$**: Contiene la resta directa de las dos raíces cúbicas extracted: **$(x - 2)$**.
    2. **Trinomio Positivo $(A^2 + AB + B^2)$**:
       - Primer término al cuadrado: $A^2 \implies \mathbf{x^2}$.
       - Más el producto de las dos bases: $+AB \implies \mathbf{+2x}$ (¡aquí TODOS los términos son positivos!).
       - Más el segundo término al cuadrado: $+B^2 \implies +2^2 = \mathbf{+4}$.
    3. **Resultado final**: $\mathbf{(x - 2)(x^2 + 2x + 4)}$.
explicacion_formal: |
  ### Definición formal
  Sea la diferencia de cubos $P(A, B) = A^3 - B^3 \in \mathbb{R}[A, B]$. El **Teorema de Factorización de Cubos Sustraídos** establece la descomposición unívoca en factores de menor grado sobre $\mathbb{R}$:

  $$\mathbf{A^3 - B^3 = (A - B)(A^2 + AB + B^2)}$$

  ### Demostración por Multiplicación Distributiva
  Multiplicando el miembro derecho:

  $$(A - B)(A^2 + AB + B^2) = A(A^2 + AB + B^2) - B(A^2 + AB + B^2)$$
  $$= (A^3 + A^2B + AB^2) - (A^2B + AB^2 + B^3)$$

  Distribuyendo el signo negativo y cancelando términos opuestos ($+A^2B - A^2B = 0$ y $+AB^2 - AB^2 = 0$):

  $$= A^3 + A^2B + AB^2 - A^2B - AB^2 - B^3 = \mathbf{A^3 - B^3}$$

  ### Irreducibilidad del Trinomio Positivo
  El trinomio cuadrático resultante $Q(A) = A^2 + AB + B^2$ posee un discriminante estrictamente negativo $\Delta = (B)^2 - 4(1)(B^2) = -3B^2 < 0$ para todo $B \neq 0$, demostrando su **irreducibilidad en el cuerpo de los números reales $\mathbb{R}$**.

  ### Síntesis didáctica
  La diferencia de cubos se factoriza en la resta de sus bases multiplicada por el trinomio formado por el cuadrado de la primera base, más su producto, más el cuadrado de la segunda base.
definiciones_clave: |
  - **Factor binomio resta ($(A-B)$)**: Primer factor de la descomposición formado por la sustracción directa de las bases.
  - **Factor trinomio positivo ($(A^2 + AB + B^2)$)**: Segundo factor de la descomposición donde todos los signos son estrictamente de adición.
  - **Regla S.O.A.P. en diferencia**:
    - **S**ame: Signo igual en el binomio ($-$).
    - **O**pposite: Signo opuesto en el término medio ($+$).
    - **A**lways **P**ositive: Signo siempre positivo en el último término ($+$).
propiedades_relaciones: |
  - **Complementariedad de signos**: La diferencia de cubos traslada el signo negativo al binomio $(A-B)$, dejando todos los términos del trinomio positivos.
ejemplo_guiado:
  enunciado: 'Factoriza la diferencia de cubos $64x^3 - 27y^3$.'
  pasos:
    - 'Paso 1: Identificamos las bases cúbicas:
       - $A = \sqrt[3]{64x^3} = 4x$.
       - $B = \sqrt[3]{27y^3} = 3y$.'
    - 'Paso 2: Formamos el binomio resta $(A - B)$:
       $(4x - 3y)$.'
    - 'Paso 3: Construimos los tres términos del trinomio $(A^2 + AB + B^2)$:
       - $A^2 = (4x)^2 = 16x^2$.
       - $+AB = +(4x \cdot 3y) = +12xy$.
       - $+B^2 = (3y)^2 = 9y^2$.
       - Trinomio: $(16x^2 + 12xy + 9y^2)$.'
    - 'Paso 4: Multiplicamos los factores: $(4x - 3y)(16x^2 + 12xy + 9y^2)$.'
    - 'Conclusión: La factorización completa es **$(4x - 3y)(16x^2 + 12xy + 9y^2)$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué todos los signos dentro del trinomio $(A^2 + AB + B^2)$ en la diferencia de cubos $A^3 - B^3 = (A - B)(A^2 + AB + B^2)$ son positivos?'
    choices:
      - {text: 'Porque al multiplicar el binomio resta $-B$ por los términos positivos del trinomio se generan los opuestos aditivos ($-A^2B$ y $-AB^2$) necesarios para anular los términos positivos $+A^2B$ y $+AB^2$', is_correct: true}
      - {text: 'Por un acuerdo sin fundamento matemático', is_correct: false}
      - {text: 'Porque A y B son siempre números positivos', is_correct: false}
      - {text: 'Para que el trinomio sea un cuadrado perfecto', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque al multiplicar el binomio resta $-B$ por los términos positivos del trinomio se generan los opuestos aditivos ($-A^2B$ y $-AB^2$) necesarios para anular los términos positivos $+A^2B$ y $+AB^2$''. Cancelación de términos cruzados en expansión de $A^3-B^3$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la factorización de la diferencia de cubos $m^3 - 125$?'
    choices:
      - {text: 'La factorización es $(m - 5)(m^2 + 5m + 25)$, aplicando $A = m$ y $B = 5$', is_correct: true}
      - {text: 'La factorización es $(m - 5)(m^2 - 5m + 25)$', is_correct: false}
      - {text: 'La factorización es $(m + 5)(m^2 - 5m + 25)$', is_correct: false}
      - {text: 'La factorización es $(m - 5)^3$', is_correct: false}
    explanation: 'La alternativa correcta es ''La factorización es $(m - 5)(m^2 + 5m + 25)$, aplicando $A = m$ y $B = 5$''. Fórmula $A^3-B^3 = (A-B)(A^2 + AB + B^2)$ con $A=m, B=5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer las raíces cúbicas $A$ y $B$ de los términos del binomio.'
  - 'Paso 2: Escribir el primer factor binómico restando las bases: $(A - B)$.'
  - 'Paso 3: Calcular el trinomio con todos sus términos positivos: $A^2$, $+AB$ y $+B^2$.'
  - 'Paso 4: Expresar el producto factorizado final: $(A - B)(A^2 + AB + B^2)$.'
errores_correccion: |
  - **Error 1:** Colocar un signo de resta en el término central del trinomio (escribir $(A-B)(A^2 - AB + B^2)$). **Cómo corregirlo:** En la diferencia de cubos **TODOS LOS TÉRMINOS DEL TRINOMIO SON POSITIVOS ($A^2 + AB + B^2$)**.
  - **Error 2:** Multiplicar por 2 el término central del trinomio (escribir $+2AB$). **Cómo corregirlo:** El término central **ES SIMPLEMENTE EL PRODUCTO DIRECTO DE LAS BASES ($+AB$), SIN COEFICIENTE 2**.
ejemplos:
  - titulo: 'Diferencia de cubos básica'
    enunciado: 'Para $x^3 - 1$, ¿es la respuesta $(x - 1)(x^2 + x + 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, con $A = x$ y $B = 1$.'
  - titulo: 'Término medio positivo'
    enunciado: 'En la diferencia de cubos, ¿es el término medio del trinomio $+AB$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el trinomio tiene todos sus signos $+$.'
  - titulo: 'Constante 8'
    enunciado: 'Para $k^3 - 8$, ¿obtenemos $(k - 2)(k^2 + 2k + 4)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $B = 2 \implies 2^2 = 4$.'
  - titulo: 'Comprobación por multiplicación'
    enunciado: '¿Recupera $(x-3)(x^2 + 3x + 9) = x^3 - 27$ el binomio inicial?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, cancela $+3x^2-3x^2$ y $+9x-9x$.'
errores_frecuentes:
  - 'Colocar un signo de resta en el término central del trinomio resultante.'
  - 'Multiplicar por 2 el término central del trinomio tratándolo como un trinomio cuadrado perfecto.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intercambiar la diferencia de cubos con el cubo de una resta (escribir $(A-B)^3$).'
  - 'Colocar un signo de resta en el último término $B^2$ del trinomio.'
afirmaciones_verdaderas:
  - 'La diferencia de cubos $A^3 - B^3$ factoriza en $(A - B)(A^2 + AB + B^2)$.'
  - 'Todos los términos del trinomio resultante $A^2 + AB + B^2$ poseen signo positivo.'
al_terminar_debes_poder: 'Factorizar diferencias de cubos perfectos aplicando la fórmula $(A-B)(A^2 + AB + B^2)$.'
