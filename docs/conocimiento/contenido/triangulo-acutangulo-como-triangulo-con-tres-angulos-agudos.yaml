semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.ACUTANGULO
resumen_inicial: Un triángulo acutángulo es aquel cuyos tres ángulos interiores son
  estrictamente agudos, es decir, cada uno de ellos mide menos de 90°.
explicacion_simple: '![Triángulo Acutángulo](/static/img/nodos/triangulo-acutangulo-como-triangulo-con-tres-angulos-agudos-intro.svg)


  Un **triángulo acutángulo** es un triángulo "afilado" donde **sus tres esquinas
  de adentro miden menos de $90^\circ$** (ninguna es recta ni abierta). Todos los
  triángulos del mundo tienen al menos dos ángulos agudos, pero para ser llamado **acutángulo**,
  ¡los **tres** deben ser menores a $90^\circ$ obligatoriamente!'
explicacion_formal: '### Definición formal

  Un triángulo $\Delta ABC$ es **acutángulo** si y solo si sus tres ángulos interiores
  son estrictamente agudos (menores a $90^\circ$):


  $$\Delta ABC \text{ es acutángulo} \iff 0^\circ < \alpha < 90^\circ \; \land \;
  0^\circ < \beta < 90^\circ \; \land \; 0^\circ < \gamma < 90^\circ$$


  $$\max(\alpha, \beta, \gamma) < 90^\circ$$


  ### Desglose simbólico y geométrico

  - Criterio de Pitágoras generalizado: Si $a \le b \le c \implies c^2 < a^2 + b^2$.

  - Puntos notables interiores: El ortocentro $H$ y el circuncentro $O$ se ubican
  estrictamente en el interior del triángulo.


  ### Síntesis didáctica

  Los triángulos acutángulos poseen una estructura compacta y estable donde todos
  sus centros notables residen dentro de la región poligonal.'
definiciones_clave: '- **Triángulo acutángulo**: Triángulo con 3 ángulos interiores
  agudos ($< 90^\circ$).

  - **Ángulo agudo**: Ángulo cuya medida está en el intervalo $(0^\circ, 90^\circ)$.

  - **Criterio métrico**: $a^2 + b^2 > c^2$ (donde $c$ es el lado mayor). '
propiedades_relaciones: '- **Puntos notables interiores**: En todo triángulo acutángulo,
  tanto el ortocentro (intersección de alturas) como el circuncentro (centro de la
  circunferencia circunscrita) caen estrictamente en la región interior.

  - **Compatibilidad con lados**: Puede ser equilátero ($60^\circ, 60^\circ, 60^\circ$),
  isósceles ($50^\circ, 50^\circ, 80^\circ$) o escaleno ($40^\circ, 60^\circ, 80^\circ$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Triángulo Acutángulo](/static/img/nodos/triangulo-acutangulo-como-triangulo-con-tres-angulos-agudos-ejemplos.svg)


    Un triángulo tiene dos ángulos interiores que miden $48^\circ$ y $72^\circ$. Determina
    la medida del tercer ángulo y clasifica el triángulo según sus ángulos.'
  pasos:
  - 'Paso 1: Calcular el tercer ángulo interior $\gamma = 180^\circ - (48^\circ +
    72^\circ) = 180^\circ - 120^\circ = 60^\circ$.'
  - 'Paso 2: Comprobar la medida de los tres ángulos: $48^\circ < 90^\circ$, $72^\circ
    < 90^\circ$ y $60^\circ < 90^\circ$.'
  - 'Paso 3: Como los tres ángulos son estrictamente menores a $90^\circ$, clasificar
    como **triángulo acutángulo**.'
  - 'Paso 4: Adicionalmente, como $48^\circ \neq 60^\circ \neq 72^\circ$, es un triángulo
    acutángulo escaleno.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición deben cumplir los ángulos de un triángulo para que sea
    clasificado como acutángulo?
  choices:
  - text: Sus tres ángulos interiores deben ser estrictamente menores a 90° (agudos)
    is_correct: true
  - text: Basta con que dos ángulos sean menores a 90°
    is_correct: false
  - text: Debe tener un ángulo de 90°
    is_correct: false
  - text: Debe tener un ángulo mayor a 90°
    is_correct: false
  explanation: Para ser acutángulo, sus tres ángulos interiores deben ser estrictamente
    menores a 90° (agudos).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los ángulos de un triángulo son 50°, 60° y 70°, ¿cómo se clasifica?
  choices:
  - text: Triángulo acutángulo (porque 50°, 60° y 70° son todos menores a 90°)
    is_correct: true
  - text: Triángulo rectángulo
    is_correct: false
  - text: Triángulo obtusángulo
    is_correct: false
  - text: Triángulo equilátero
    is_correct: false
  explanation: Al ser los tres ángulos menores a 90°, es un triángulo acutángulo (porque
    50°, 60° y 70° son todos menores a 90°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Conocer o calcular los tres ángulos interiores del triángulo.'
- 'Paso 2: Verificar si los tres ángulos cumplen $\alpha < 90^\circ$, $\beta < 90^\circ$
  y $\gamma < 90^\circ$.'
- 'Paso 3: Si los tres son menores a $90^\circ$, clasificar como triángulo acutángulo.'
errores_correccion: 'No te conformes con revisar dos ángulos: todo triángulo tiene
  al menos dos ángulos agudos, la clave del acutángulo es que el tercero también sea
  agudo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes ternas de ángulos corresponde a un triángulo
    acutángulo?
  alternativas:
  - $50^\circ, 60^\circ, 70^\circ$
  - $90^\circ, 45^\circ, 45^\circ$
  - $100^\circ, 40^\circ, 40^\circ$
  respuesta: $50^\circ, 60^\circ, 70^\circ$
  solucion_pasos:
  - En $50^\circ, 60^\circ, 70^\circ$ los tres ángulos son menores a $90^\circ$ y
    suman $180^\circ$.
- titulo: Ejemplo 2
  enunciado: Si un triángulo tiene lados de $4\text{ cm}, 5\text{ cm}$ y $6\text{
    cm}$, ¿es acutángulo?
  alternativas:
  - Sí, porque 4^2 + 5^2 = 16 + 25 = 41 > 6^2 = 36
  - No, porque 4 + 5 > 6
  - No, es rectángulo
  respuesta: Sí, porque 4^2 + 5^2 = 16 + 25 = 41 > 6^2 = 36
  solucion_pasos:
  - Como $a^2 + b^2 > c^2$ ($41 > 36$), el triángulo es acutángulo.
- titulo: ¿Un triángulo con ángulos de 89°, 45° y 46° es acutángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, los tres ángulos son estrictamente menores a 90°.
- titulo: ¿Un triángulo con un ángulo de 90° puede ser acutángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, si tiene un ángulo de 90° es un triángulo rectángulo.
errores_frecuentes:
- Clasificar como acutángulo a un triángulo con ángulos 30°, 50°, 100° por ver dos
  ángulos agudos.
- Pensar que acutángulo es sinónimo de equilátero.
- Confundir el criterio métrico $a^2 + b^2 > c^2$ con la desigualdad triangular $a
  + b > c$.
- Creer que un triángulo puede tener 0 o 1 ángulo agudo.
- Olvidar que el ortocentro de un acutángulo queda dentro de la figura.
afirmaciones_verdaderas:
- Un triángulo acutángulo tiene sus tres ángulos interiores menores a $90^\circ$.
- Todo triángulo equilátero es acutángulo.
al_terminar_debes_poder: '**QUÉ:** Identificar, definir y clasificar triángulos acutángulos
  según sus ángulos interiores y lados.


  **CÓMO:** Verificando que $\alpha, \beta, \gamma < 90^\circ$ o aplicando el criterio
  métrico $a^2 + b^2 > c^2$.


  ![Resumen de Triángulo Acutángulo](/static/img/nodos/triangulo-acutangulo-como-triangulo-con-tres-angulos-agudos-resumen.svg)'
