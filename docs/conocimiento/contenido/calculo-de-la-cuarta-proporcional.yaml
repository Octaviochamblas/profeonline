semantic_id: MAT.NUM.RAZONES_PROPORCIONES.CUARTA_PROPORCIONAL
resumen_inicial: 'La cuarta proporcional es el cuarto término desconocido $x$ en una proporción discreta a partir de tres términos dados $a, b, c$: $\frac{a}{b} = \frac{c}{x} \implies x = \frac{b \cdot c}{a}$ ($a \neq 0$).'
explicacion_simple: "![Cálculo de cuarta proporcional](/static/img/nodos/calculo-de-la-cuarta-proporcional-intro.svg)\n\nLa **cuarta proporcional** es el valor desconocido $x$ cuando nos dan tres números distintos $a, b, c$:\n- Se plantea en orden: $\\frac{a}{b} = \\frac{c}{x}$.\n- Para calcular $x$, se multiplican los dos números cruzados y se divide por el número restante:\n$$x = \\frac{b \\cdot c}{a}$$\n- **Ejemplo:** La cuarta proporcional de $3, 5$ y $12$:\n  - Planteamos $\\frac{3}{5} = \\frac{12}{x}$.\n  - Multiplicamos en cruz: $x = \\frac{5 \\cdot 12}{3} = \\frac{60}{3} = 20$.\n- ¡Es exactamente el procedimiento de la **Regla de Tres Simple Directa**!"
explicacion_formal: 'Dados tres elementos $a, b, c \in \mathbb{R}$ con $a \neq 0$ y $b \neq 0$, se define formalmente como **cuarta proporcional** de $a, b, c$ al único escalar $x \in \mathbb{R}$ que satisface la proporción discreta:


  $$\frac{a}{b} = \frac{c}{x}$$


  **Fórmula de Cálculo:**

  Aplicando el Teorema Fundamental $a \cdot x = b \cdot c$:


  $$x = \frac{b \cdot c}{a}$$


  **Dependencia del Orden:**

  La cuarta proporcional depende estrictamente del orden de la terna $(a, b, c)$. Por ejemplo, la cuarta proporcional de $(a, c, b)$ es $x'' = \frac{c \cdot b}{a} = x$, pero la de $(b, a, c)$ es $x'''' = \frac{a \cdot c}{b} \neq x$.'
definiciones_clave: '- **Cuarta proporcional ($x$)**: Cuarto término que completa la proporción $\frac{a}{b} = \frac{c}{x}$.

  - **Proporción discreta**: Proporción donde intervienen 4 cantidades distintas.

  - **Terna ordenada $(a, b, c)$**: Conjunto de datos base en secuencia obligatoria.'
propiedades_relaciones: '- **Unicidad**: Para cada terna ordenada con $a \neq 0$, existe una única cuarta proporcional.

  - **Equivalencia a regla de tres**: Modelo matemático de la proporcionalidad directa simple.'
ejemplo_guiado:
  enunciado: '![Ejemplos de cuarta proporcional](/static/img/nodos/calculo-de-la-cuarta-proporcional-ejemplos.svg)


    Calcule la cuarta proporcional de los números $3, 5$ y $12$, y halle el término desconocido en la proporción $\frac{8}{x} = \frac{6}{9}$.'
  pasos:
  - 'Paso 1: Para $3, 5, 12$: Plantear en orden $\frac{3}{5} = \frac{12}{x}$.'
  - 'Paso 2: Multiplicar los medios conocidos: $5 \cdot 12 = 60$.'
  - 'Paso 3: Dividir por el extremo conocido: $x = \frac{60}{3} = 20$.'
  - 'Paso 4: Para $\frac{8}{x} = \frac{6}{9}$: Multiplicar extremos conocidos: $8 \cdot 9 = 72$.'
  - 'Paso 5: Dividir por el medio conocido: $x = \frac{72}{6} = 12$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para calcular la cuarta proporcional $x$ de $a, b, c$ en $\frac{a}{b} = \frac{c}{x}$?
  choices:
  - text: $x = \frac{b \cdot c}{a}$
    is_correct: true
  - text: $x = \frac{a \cdot b}{c}$
    is_correct: false
  - text: $x = a \cdot b \cdot c$
    is_correct: false
  - text: $x = \frac{a}{b \cdot c}$
    is_correct: false
  explanation: La alternativa correcta es '$x = \frac{b \cdot c}{a}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue la cuarta proporcional de 3, 5 y 12?
  choices:
  - text: $20$
    is_correct: true
  - text: $15$
    is_correct: false
  - text: $60$
    is_correct: false
  - text: $7,2$
    is_correct: false
  explanation: La alternativa correcta es '$20$'. Porque $(5 \times 12) / 3 = 20$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir los tres términos en la proporción $\frac{a}{b} = \frac{c}{x}$ manteniendo el orden en que se nombran.'
- 'Paso 2: Multiplicar los dos términos que forman la pareja cruzada completa ($b \cdot c$).'
- 'Paso 3: Dividir el resultado por el término restante ($a$) para obtener el valor exacto de $x$.'
errores_correccion: '- **Error 1: Cambiar el orden de los tres números dados.** **Cómo corregirlo:** La cuarta proporcional de $(a, b, c)$ coloca estrictamente $a$ como 1°, $b$ como 2°, $c$ como 3° y $x$ como 4°.

  - **Error 2: Dividir por el número equivocado.** **Cómo corregirlo:** Se divide SIEMPRE por el término opuesto en diagonal a la incógnita.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la cuarta proporcional de $2, 6$ y $7$?
  alternativas:
  - $21$
  - $14$
  - $18$
  respuesta: $21$
  solucion_pasos:
  - $\frac{2}{6} = \frac{7}{x} \implies x = \frac{6 \cdot 7}{2} = \frac{42}{2} = 21$.
- titulo: Ejemplo 2
  enunciado: Halle la cuarta proporcional de $10, 15$ y $8$.
  alternativas:
  - $12$
  - $16$
  - $20$
  respuesta: $12$
  solucion_pasos:
  - $\frac{10}{15} = \frac{8}{x} \implies x = \frac{15 \cdot 8}{10} = \frac{120}{10} = 12$.
- titulo: ¿Es 30 la cuarta proporcional de 4, 10 y 12?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x = \frac{10 \cdot 12}{4} = \frac{120}{4} = 30$.
  alternativas:
  - texto: Sí, porque (10 · 12) / 4 = 30
    es_correcta: true
    retroalimentacion: ¡Correcto! Cálculo exacto.
  - texto: No, es 24
    es_correcta: false
    retroalimentacion: Incorrecto, el producto cruzado da 30.
  - texto: No, es 48
    es_correcta: false
    retroalimentacion: Incorrecto, se debe dividir por 4.
- titulo: ¿Es el cálculo de la cuarta proporcional idéntico a la regla de tres simple directa?
  respuesta: Sí
  solucion_pasos:
  - Sí, la regla de tres simple es la aplicación algorítmica de la cuarta proporcional.
  alternativas:
  - texto: Sí, comparten exactamente la misma estructura matemática
    es_correcta: true
    retroalimentacion: ¡Correcto! Mismo fundamento algebraico.
  - texto: No, la regla de tres es solo para porcentajes
    es_correcta: false
    retroalimentacion: Incorrecto, aplica a cualquier magnitud proporcional.
  - texto: No, la regla de tres no usa fracciones
    es_correcta: false
    retroalimentacion: Incorrecto, se fundamenta en la proporción fraccionaria.
errores_frecuentes:
- Desordenar la terna de números inicial.
- Multiplicar los términos incorrectos en la diagonal.
- Cometer errores al simplificar antes de dividir.
- Confundir cuarta proporcional con media o tercera proporcional.
afirmaciones_verdaderas:
- La cuarta proporcional completa una proporción discreta a partir de tres términos dados.
- Se calcula mediante la fórmula $x = \frac{b \cdot c}{a}$.
- Es el fundamento algebraico de la regla de tres simple directa.
al_terminar_debes_poder: '![Síntesis de cuarta proporcional](/static/img/nodos/calculo-de-la-cuarta-proporcional-resumen.svg)


  QUÉ: Calcular la cuarta proporcional de tres cantidades dadas en una proporción discreta.


  CÓMO: Planteando $\frac{a}{b} = \frac{c}{x}$ en el orden establecido y despejando mediante la fórmula $x = \frac{b \cdot c}{a}$.'
