semantic_id: MAT.NUM.PROPORCIONES.CUARTA_PROPORCIONAL
resumen_inicial: 'La cuarta proporcional de tres números dados $a, b, c$ es el cuarto término desconocido $x$ que satisface la proporción discreta $\frac{a}{b} = \frac{c}{x}$, dado por $x = \frac{b \cdot c}{a}$.'
explicacion_simple: |
  Cuando tienes tres números ordenados (por ejemplo 2, 5 y 6) y quieres encontrar un cuarto número $x$ para que formen una proporción perfecta ($\frac{2}{5} = \frac{6}{x}$), ese número $x$ se llama **cuarta proporcional**. Para calcularlo, usas la regla del producto cruzado: multiplicas el segundo por el tercero ($5 \cdot 6 = 30$) y lo divides entre el primero ($30 \div 2 = 15$). Así, la cuarta proporcional de 2, 5 y 6 es 15.
explicacion_formal: |
  ### Definición formal
  En una proporción geométrica discreta (donde los cuatro términos son distintos entre sí):
  $$\frac{a}{b} = \frac{c}{x} \quad (a, b, c \neq 0)$$
  el cuarto término $x$ recibe el nombre de **cuarta proporcional** de los tres números $a, b$ y $c$ tomados en ese orden estricto.

  ### Fórmula de cálculo analítico
  Aplicando el Teorema Fundamental de las Proporciones:
  $$a \cdot x = b \cdot c \implies x = \frac{b \cdot c}{a}$$

  ### Dependencia del orden de los términos
  La cuarta proporcional depende estrictamente de la secuencia de los tres números dados:
  - La cuarta proporcional de $(a, b, c)$ es $x_1 = \frac{b \cdot c}{a}$.
  - La cuarta proporcional de $(a, c, b)$ es $x_2 = \frac{c \cdot b}{a} = x_1$.
  - La cuarta proporcional de $(b, a, c)$ es $x_3 = \frac{a \cdot c}{b}$.

  ### Síntesis didáctica
  - Ecuación canónica: $\frac{a}{b} = \frac{c}{x}$.
  - Algoritmo de despeje: $x = \frac{b \cdot c}{a}$.
definiciones_clave: |
  - **Cuarta proporcional $x$**: Término incógnito posicionado en el cuarto lugar de una proporción discreta.
  - **Proporción discreta**: Proporción en la cual sus cuatro términos son números independientes.
  - **Secuencia dada $(a, b, c)$**: Orden estricto de lectura en que se asignan los tres primeros términos de la relación.
propiedades_relaciones: |
  - **Relación con la regla de tres simple**: El algoritmo de la regla de tres simple directa consiste operacionalmente en hallar la cuarta proporcional de tres datos conocidos.
  - **Existencia y unicidad**: Para cualesquiera tres números reales $a, b, c$ con $a \neq 0$, existe una única cuarta proporcional $x \in \mathbb{R}$.
ejemplo_guiado:
  enunciado: 'Calcula la cuarta proporcional de los números $3, 8$ y $9$ tomados en ese orden.'
  pasos:
    - 'Paso 1: Planteamos la ecuación de la proporción discreta asignando $a = 3, b = 8, c = 9$ y la cuarta proporcional $x$: $\frac{3}{8} = \frac{9}{x}$.'
    - 'Paso 2: Aplicamos la regla del producto cruzado: $3 \cdot x = 8 \cdot 9$.'
    - 'Paso 3: Resolvemos la multiplicación: $3x = 72$.'
    - 'Paso 4: Despejamos $x$ dividiendo entre el primer término: $x = \frac{72}{3} = 24$. La cuarta proporcional es **24**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la cuarta proporcional $x$ de tres números $a, b, c$ en la proporción $\frac{a}{b} = \frac{c}{x}$?'
    choices:
      - {text: '$x = \frac{b \cdot c}{a}$, multiplicando el segundo por el tercero y dividiendo entre el primero', is_correct: true}
      - {text: '$x = a \cdot b \cdot c$, multiplicando los tres números', is_correct: false}
      - {text: '$x = \frac{a \cdot b}{c}$, dividiendo entre el tercero', is_correct: false}
      - {text: '$x = a + b + c$, sumando los tres valores', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \frac{b \cdot c}{a}$, multiplicando el segundo por el tercero y dividiendo entre el primero''. Es la fórmula de despeje $a \cdot x = b \cdot c$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la cuarta proporcional de los números $5, 10$ y $14$?'
    choices:
      - {text: '$28$, mediante el cálculo $x = \frac{10 \cdot 14}{5} = \frac{140}{5} = 28$', is_correct: true}
      - {text: '$7$, dividiendo $14 / 2$', is_correct: false}
      - {text: '$19$, sumando los valores', is_correct: false}
      - {text: '$70$, multiplicando $5 \cdot 14$', is_correct: false}
    explanation: 'La alternativa correcta es ''$28$, mediante el cálculo $x = \frac{10 \cdot 14}{5} = \frac{140}{5} = 28$''. Multiplicamos $10 \cdot 14 = 140$ y dividimos entre $5$, obteniendo $28$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Asignar en orden los tres datos dados: $a$ al primer término, $b$ al segundo y $c$ al tercero.'
  - 'Paso 2: Formular la proporción discreta $\frac{a}{b} = \frac{c}{x}$.'
  - 'Paso 3: Efectuar el producto del segundo por el tercer término ($b \cdot c$).'
  - 'Paso 4: Dividir el resultado entre el primer término $a$ para obtener la cuarta proporcional $x = \frac{b \cdot c}{a}$.'
errores_correccion: |
  - **Error 1:** Alterar el orden de los tres números dados al construir la proporción (ej: calcular la cuarta proporcional de 2, 4 y 6 como $\frac{4}{2} = \frac{6}{x}$). **Cómo corregirlo:** La cuarta proporcional respeta el **orden estricto del enunciado**: el 1.º va en el antecedente inicial, el 2.º en el consecuente inicial y el 3.º en el antecedente final.
  - **Error 2:** Dividir por el segundo término en lugar de dividir por el primero. **Cómo corregirlo:** Al despejar $a \cdot x = b \cdot c$, la división final **siempre se hace entre el primer término $a$**: $x = \frac{b \cdot c}{a}$.
ejemplos:
  - titulo: 'Cuarta proporcional entera'
    enunciado: '¿La cuarta proporcional de $4, 6$ y $10$ es igual a $15$?'
    alternativas:
      - 'Sí, pues $x = (6 \cdot 10) / 4 = 60 / 4 = 15$'
      - 'No, es 20'
      - 'No, es 12'
    respuesta: 'Sí, pues $x = (6 \cdot 10) / 4 = 60 / 4 = 15$'
    solucion_pasos:
      - '1. Planteamos: $\frac{4}{6} = \frac{10}{x}$.'
      - '2. Despejamos: $x = (6 \cdot 10) / 4 = 15$.'
  - titulo: 'Cuarta proporcional con decimales'
    enunciado: '¿La cuarta proporcional de $2, 3$ y $7$ equivale a $10.5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $x = (3 \cdot 7) / 2 = 21 / 2 = 10.5$.'
  - titulo: 'Cuarta proporcional en potencias de 10'
    enunciado: '¿La cuarta proporcional de $10, 100$ y $5$ es $50$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $x = (100 \cdot 5) / 10 = 50$.'
  - titulo: 'Verificación en la proporción'
    enunciado: 'Si la cuarta proporcional de $a, b, c$ es $x$, ¿se cumple la igualdad $\frac{a}{b} = \frac{c}{x}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es la definición canónica de la cuarta proporcional.'
errores_frecuentes:
  - 'Alterar el orden de los tres números dados al armar la estructura de la proporción discreta.'
  - 'Dividir entre el producto de los medios en lugar de dividir por el primer término.'
  - 'Sumar los tres números y restar el total para hallar la cuarta proporcional.'
  - 'La cuarta proporcional se calcula mediante la raíz cuadrada del producto de los tres datos.'
  - 'La fracción resultante de la cuarta proporcional se debe conservar sin simplificar.'
afirmaciones_verdaderas:
