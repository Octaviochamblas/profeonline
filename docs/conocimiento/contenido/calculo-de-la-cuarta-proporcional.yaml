resumen_inicial: La cuarta proporcional es el cuarto valor desconocido $x$ que satisface
  la proporción $\frac{a}{b} = \frac{c}{x}$, despejándose mediante $x = \frac{b \cdot
  c}{a}$.
explicacion_simple: Calcular la cuarta proporcional (o Regla de Tres simple) consiste
  en encontrar un valor desconocido $x$ entre tres datos conocidos, multiplicando
  los dos datos que quedan cruzados en diagonal y dividiendo por el dato restante.
explicacion_formal: 'Dados tres valores $a, b, c \in \mathbb{R}$ ($a \neq 0$), la
  **Cuarta Proporcional $x$** es la solución única de la ecuación de proporción:


  $$\frac{a}{b} = \frac{c}{x} \implies a \cdot x = b \cdot c \implies x = \frac{b
  \cdot c}{a}$$


  **Despeje algebraico:**

  - Se aplica el producto cruzado $a \cdot x = b \cdot c$ y se divide por el coeficiente
  $a$.'
definiciones_clave: '- **Cuarta proporcional**: Término $x = \frac{b \cdot c}{a}$
  desconocido en la proporción entre tres datos $a, b, c$.'
propiedades_relaciones: '- **Regla de tres simple**: Aplicación práctica del despeje
  de la cuarta proporcional.'
ejemplo_guiado:
  enunciado: Calcule la cuarta proporcional $x$ en la igualdad $\frac{4}{7} = \frac{12}{x}$.
  pasos:
  - 'Paso 1: Aplicar el producto cruzado: $4 \cdot x = 7 \cdot 12$.'
  - 'Paso 2: Efectuar la multiplicación de los medios: $7 \cdot 12 = 84$.'
  - 'Paso 3: Despejar $x$ dividiendo por $4$: $x = \frac{84}{4} = 21$.'
  - 'Conclusión: La cuarta proporcional es $x = 21$ (verificable: $4/7 = 12/21 = 0,5714...$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se despeja la cuarta proporcional x en la proporción a/b = c/x (a
    != 0)?
  choices:
  - text: 'Multiplicando medios y dividiendo por el extremo conocido: x = (b · c)
      / a'
    is_correct: true
  - text: Restando x = a - b - c
    is_correct: false
  - text: Sumando x = a + b + c
    is_correct: false
  - text: Dividiendo x = a / (b · c)
    is_correct: false
  explanation: 'La alternativa correcta es ''Multiplicando medios y dividiendo por
    el extremo conocido: x = (b · c) / a''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4/7 = 12/x, ¿cuál fue el valor de x?
  choices:
  - text: '21'
    is_correct: true
  - text: '28'
    is_correct: false
  - text: '14'
    is_correct: false
  - text: '48'
    is_correct: false
  explanation: La alternativa correcta es '21'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la cuarta proporcional
  $x = \frac{b \cdot c}{a}$ resolviendo problemas de regla de tres directa.
semantic_id: MAT.NUM.PROPORCIONES.CUARTA_PROPORCIONAL
procedimiento:
- 'Paso 1: Identificar los términos extremos $(a, d)$ y medios $(b, c)$ en la proporción
  $a/b = c/d$.'
- 'Paso 2: Aplicar la propiedad o regla requerida (producto cruzado, cuarta/media/tercera
  proporcional o composición/descomposición).'
- 'Paso 3: Resolver algebraicamente y verificar la igualdad de las razones resultantes.'
errores_correccion: '- **Error 1: Multiplicar numeradores con numeradores en lugar
  del producto cruzado ($a \cdot c = b \cdot d$).** **Cómo corregirlo:** El producto
  cruzado combina EXTREMOS con MEDIOS ($a \cdot d = b \cdot c$).


  - **Error 2: Confundir la media proporcional con la media aritmética (promedio).**
  **Cómo corregirlo:** La media proporcional es una media GEOMÉTRICA ($x = \sqrt{ab}$),
  no un promedio sumar/dividir.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROPORCIONES.CUARTA_PROPORCIONAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de proporciones.
- titulo: Ejemplo 2
  enunciado: Verificación de igualdad cruzada.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración por producto cruzado a · d = b · c.
- titulo: ¿Es a · d = b · c válido para toda proporción?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema Fundamental de las Proporciones.
- titulo: ¿Permite la composición mantener la equivalencia de razones?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(a+b)/b = (c+d)/d$ conserva la razón equivalente.
errores_frecuentes:
- Multiplicar los numeradores entre sí al aplicar la prueba del producto cruzado en
  una proporción.
- Declarar la posición de los términos medios con los términos extremos en una proporción
  escrita en fila.
- Calcular la media proporcional utilizando el promedio aritmético sumar y dividir
  entre dos.
- Invertir únicamente uno de los dos lados de la igualdad al aplicar la composición
  proporcional.
- Restar los términos extremos en lugar de despejar la cuarta proporcional por división.
afirmaciones_verdaderas:
- Una proporción es la igualdad entre dos razones $\frac{a}{b} = \frac{c}{d}$ que
  satisface el producto cruzado $a \cdot d = b \cdot c$.
- La media proporcional entre dos números positivos $a$ y $b$ equivale a su media
  geométrica $x = \sqrt{a \cdot b}$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
