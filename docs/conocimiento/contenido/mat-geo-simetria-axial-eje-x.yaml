semantic_id: MAT.GEO.SIMETRIAS.AXIAL_EJE_X
resumen_inicial: 'Simetría axial respecto del eje x: conceptos, teoremas, propiedades
  geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: Reflejar un punto respecto del eje X es como 'voltear' su posición
  vertical, manteniendo igual la posición horizontal.
explicacion_formal: '![Simetría axial respecto del eje X](/static/img/geometria/isometrias/simetria-axial-eje-x.svg)


  ### Definición formal


  Si el eje X es la recta de simetría, cada punto $P(x,y)$ se transforma en $P''(x,-y)$:
  la coordenada $x$ permanece igual, y la coordenada $y$ cambia de signo.


  ### Desarrollo didáctico


  En la figura, el punto $P(3,3)$ tiene como imagen respecto del eje X el punto $P''(3,-3)$:
  la abscisa se mantiene igual, y la ordenada se invierte.'
definiciones_clave: '- **Simetría axial respecto del eje x**: Elemento o propiedad
  fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a simetría axial respecto del eje x.'
