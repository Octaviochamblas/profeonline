  QUÉ: Identificar y calcular la razón geométrica $r$ a partir de términos adyacentes o distantes en una sucesión.
  CÓMO: Resolver la ecuación $r = \frac{a_{n+1}}{a_n}$ o despejar la raíz $r = \sqrt[q-p]{\frac{a_q}{a_p}}$ respetando las reglas de signos.
