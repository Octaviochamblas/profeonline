semantic_id: MAT.NUM.PROG_GEOMETRICA.RAZON_GEOMETRICA
resumen_inicial: 'Identificación de la razón geométrica en una sucesión: concepto
  y desarrollo dentro de Progresión geométrica.'
explicacion_simple: Si ves los números 3, 12, 48... sabes que algo se está multiplicando
  rápido. Descubrir por qué número se está multiplicando es aislar la 'Razón Geométrica',
  la huella digital de esta secuencia.
explicacion_formal: "1. **Términos Juntos:** \nSi te dan $5, 35, 245\\dots$ es fácil.\
  \ \n- $r = 35 / 5 = 7$.\n\n2. **Términos Separados (¡Ojo!):**\nSi te dan $a_1 =\
  \ 2$ y de pronto te dicen que $a_3 = 18$. ¿Cuál es la razón?\n- Piensa: para llegar\
  \ de $a_1$ a $a_3$ tuviste que multiplicar por '$r$' dos veces (dos saltos). \n\
  - Es decir: $a_1 \\cdot r \\cdot r = a_3 \\rightarrow 2 \\cdot r^2 = 18$.\n- Despejamos:\
  \ $r^2 = 18 / 2 = 9$. \n- Si $r^2 = 9$, entonces $r$ puede ser $3$ (o $-3$).\n\n\
  Este es el principio general: la distancia de posiciones indica el exponente de\
  \ '$r$'."
definiciones_clave: '- **Identificación de la razón geométrica en una sucesión**:
  Concepto fundamental dentro del estudio de Progresión geométrica.'
propiedades_relaciones: '- **Propiedades de Identificación de la razón geométrica
  en una sucesión**: Relaciones de cambio y fórmulas estructurales de progresión geométrica.'
ejemplo_guiado:
  enunciado: Resuelve un ejercicio práctico aplicando identificación de la razón geométrica
    en una sucesión.
  pasos:
  - Identificar los datos y términos conocidos de la sucesión.
  - Aplicar la regla o fórmula propia de identificación de la razón geométrica en
    una sucesión.
  - Efectuar las operaciones algebraicas o aritméticas.
  - Verificar y redactar el resultado final de forma clara.
