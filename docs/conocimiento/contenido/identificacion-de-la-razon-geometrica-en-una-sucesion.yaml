semantic_id: MAT.NUM.PROG_GEOMETRICA.RAZON_GEOMETRICA
resumen_inicial: 'La identificación de la razón geométrica $r$ calcula el factor multiplicativo constante mediante la división de términos consecutivos $r = \frac{a_{n+1}}{a_n}$ o la raíz $r = \sqrt[q-p]{\frac{a_q}{a_p}}$ para términos distantes.'
explicacion_simple: |
  Para descubrir cuál es la **razón geométrica** ($r$) de una progresión:
  - Si tienes términos seguidos: **divides** el término de la derecha entre el de la izquierda:
    $$r = \frac{a_2}{a_1} \quad \text{o} \quad r = \frac{a_3}{a_2}$$
  - Si tienes términos separados (por ejemplo, $a_2$ y $a_5$): divides sus valores y extraes la raíz correspondiente a la distancia entre posiciones:
    $$r^{5-2} = \frac{a_5}{a_2} \implies r^3 = \frac{a_5}{a_2} \implies r = \sqrt[3]{\frac{a_5}{a_2}}$$
  - La razón $r$ es el número por el que se multiplica en cada paso.

  ![Identificación de la razón geométrica](/static/img/nodos/identificacion-de-la-razon-geometrica-en-una-sucesion-intro.svg)
explicacion_formal: |
  ### Definición formal
  En una progresión geométrica $(a_n)_{n \ge 1}$, la **razón geométrica ($r$)** es el invariante multiplicativo definido por:
  $$r = \frac{a_{k+1}}{a_k} \quad \forall k \in \mathbb{N}$$

  ### Fórmula General para Términos No Consecutivos
  Dados dos términos no consecutivos $a_p$ y $a_q$ ($q > p$):
  $$a_q = a_p \cdot r^{q-p} \implies r^{q-p} = \frac{a_q}{a_p} \implies r = \sqrt[q-p]{\frac{a_q}{a_p}}$$

  ### Consideraciones sobre Raíces de Índice Par
  Si $(q - p)$ es un número par y $\frac{a_q}{a_p} > 0$, existen dos soluciones algebraicas $r = \pm \sqrt[q-p]{\frac{a_q}{a_p}}$. La elección del signo dependerá de si la sucesión presenta términos de signo constante ($r > 0$) o alternantes ($r < 0$).

  ### Síntesis didáctica
  - Términos adyacentes: $r = \frac{a_2}{a_1}$.
  - Términos distantes: $r = \sqrt[q-p]{\frac{a_q}{a_p}}$.
definiciones_clave: |
  - **Razón geométrica ($r$)**: Cociente constante obtenido al dividir cualquier término por su antecesor.
  - **Factor de amplificación**: Valor de $r$ cuando $|r| > 1$, que amplifica la magnitud de los términos.
  - **Factor de atenuación**: Valor de $r$ cuando $0 < |r| < 1$, que reduce progresivamente la magnitud.
propiedades_relaciones: |
  - **Invarianza de cocientes**: La división entre dos términos congruentes separados por $k$ posiciones siempre produce $r^k$.
  - **Independencia posicional**: La razón calculada entre $a_1$ y $a_2$ es estrictamente idéntica a la calculada entre $a_{100}$ y $a_{101}$.
ejemplo_guiado:
  enunciado: 'En una progresión geométrica de términos positivos, el segundo término es $a_2 = 6$ y el quinto término es $a_5 = 48$. Determina el valor de la razón geométrica $r$.'
  imagen: '/static/img/nodos/identificacion-de-la-razon-geometrica-en-una-sucesion-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los datos: $p = 2, a_2 = 6, q = 5, a_5 = 48$.'
    - 'Paso 2: Calculamos la distancia entre posiciones: $q - p = 5 - 2 = 3$.'
    - 'Paso 3: Planteamos la ecuación: $r^3 = \frac{a_5}{a_2} = \frac{48}{6} = 8$.'
    - 'Paso 4: Extraemos la raíz cúbica: $r = \sqrt[3]{8} = 2$. La razón geométrica es **$r = 2$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si en una PG se conoce que $a_3 = 12$ y $a_4 = 36$, ¿cuál es el valor de la razón geométrica $r$?'
    choices:
      - {text: '$r = 3$, calculando $\frac{36}{12} = 3$', is_correct: true}
      - {text: '$r = 24$, restando $36 - 12$', is_correct: false}
      - {text: '$r = \frac{1}{3}$', is_correct: false}
      - {text: '$r = 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$r = 3$, calculando $\frac{36}{12} = 3$''. La razón geométrica es la división del término posterior entre el anterior.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En una PG de términos positivos con $a_1 = 5$ y $a_3 = 45$, ¿cuál es la razón $r$?'
    choices:
      - {text: '$r = 3$, calculando $r^2 = \frac{45}{5} = 9 \implies r = \sqrt{9} = 3$', is_correct: true}
      - {text: '$r = 9$, olvidando sacar la raíz cuadrada', is_correct: false}
      - {text: '$r = 20$', is_correct: false}
      - {text: '$r = 40$', is_correct: false}
    explanation: 'La alternativa correcta es ''$r = 3$, calculando $r^2 = \frac{45}{5} = 9 \implies r = \sqrt{9} = 3$''. La distancia entre posiciones es $3-1=2$, por lo que se extrae raíz cuadrada.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar dos términos conocidos y sus posiciones $(p, a_p)$ y $(q, a_q)$.'
  - 'Paso 2: Calcular el cociente $\frac{a_q}{a_p}$.'
  - 'Paso 3: Calcular la diferencia entre posiciones $\Delta n = q - p$.'
  - 'Paso 4: Extraer la raíz de índice $(q - p)$: $r = \sqrt[q-p]{\frac{a_q}{a_p}}$.'
errores_correccion: |
  - **Error 1:** Restar los términos ($a_2 - a_1$) en vez de dividirlos al buscar la razón geométrica. **Cómo corregirlo:** En la PG **la razón se obtiene dividiendo**, no restando.
  - **Error 2:** Olvidar extraer la raíz $(q-p)$ al calcular la razón entre términos no consecutivos. **Cómo corregirlo:** La razón al cuadrado ($r^2$) o al cubo ($r^3$) **requiere extraer la raíz correspondiente**.
ejemplos:
  - titulo: 'Razón con términos consecutivos'
    enunciado: 'Para la PG $(6, 18, 54, 162)$, ¿cuál es la razón geométrica?'
    alternativas:
      - '$r = 3$'
      - '$r = 12$'
      - '$r = 6$'
    respuesta: '$r = 3$'
    solucion_pasos:
      - '1. $r = 18 / 6 = 3$.'
  - titulo: 'Razón fraccionaria'
    enunciado: 'Para la PG $(100, 50, 25, 12,5)$, ¿cuál es la razón geométrica?'
    alternativas:
      - '$r = 0,5 = \frac{1}{2}$'
      - '$r = -50$'
      - '$r = 2$'
    respuesta: '$r = 0,5 = \frac{1}{2}$'
    solucion_pasos:
      - '1. $r = 50 / 100 = 1/2 = 0,5$.'
  - titulo: 'Razón entre términos distantes'
    enunciado: 'Si $a_1 = 4$ y $a_4 = 108$, ¿la razón geométrica es $r = 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $r^3 = 108 / 4 = 27 \implies r = \sqrt[3]{27} = 3$.'
  - titulo: 'Razón negativa'
    enunciado: '¿La sucesión $5, -15, 45, -135$ tiene razón geométrica $r = -3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $-15 / 5 = -3$ y $45 / (-15) = -3$.'
errores_frecuentes:
  - 'La razón geométrica se calcula restando el término anterior al término posterior.'
  - 'Al calcular la razón entre términos separados por dos posiciones se omite la extracción de la raíz cuadrada.'
  - 'Dividir el primer término entre el segundo ($a_1 / a_2$) para determinar la razón geométrica.'
  - 'La razón geométrica no puede ser un número decimal ni menor que uno.'
  - 'Una sucesión con signos alternados tiene una razón geométrica positiva.'
afirmaciones_verdaderas:
  - 'La razón geométrica se determina dividiendo cualquier término por su término predecesor inmediato ($r = \frac{a_{n+1}}{a_n}$).'
  - 'Entre dos términos distantes $a_p$ y $a_q$, la razón satisface la relación $r^{q-p} = \frac{a_q}{a_p}$.'
