semantic_id: MAT.NUM.PROG_GEOMETRICA.RAZON_GEOMETRICA
resumen_inicial: 'Identificación de la razón geométrica en una sucesión: concepto y desarrollo
  dentro de Progresión geométrica.'
explicacion_simple: Si ves los números 3, 12, 48... sabes que algo se está multiplicando rápido.
  Descubrir por qué número se está multiplicando es aislar la 'Razón Geométrica', la huella
  digital de esta secuencia.
explicacion_formal: "1. **Términos Juntos:** \nSi te dan $5, 35, 245\\dots$ es fácil. \n-\
  \ $r = 35 / 5 = 7$.\n\n2. **Términos Separados (¡Ojo!):**\nSi te dan $a_1 = 2$ y de pronto\
  \ te dicen que $a_3 = 18$. ¿Cuál es la razón?\n- Piensa: para llegar de $a_1$ a $a_3$ tuviste\
  \ que multiplicar por '$r$' dos veces (dos saltos). \n- Es decir: $a_1 \\cdot r \\cdot r\
  \ = a_3 \\rightarrow 2 \\cdot r^2 = 18$.\n- Despejamos: $r^2 = 18 / 2 = 9$. \n- Si $r^2\
  \ = 9$, entonces $r$ puede ser $3$ (o $-3$).\n\nEste es el principio general: la distancia\
  \ de posiciones indica el exponente de '$r$'."
definiciones_clave: '- **Identificación de la razón geométrica en una sucesión**: Concepto
  fundamental dentro del estudio de Progresión geométrica.'
propiedades_relaciones: '- **Propiedades de Identificación de la razón geométrica en una sucesión**:
  Relaciones de cambio y fórmulas estructurales de progresión geométrica.'
ejemplo_guiado:
  enunciado: En una progresión geométrica, a_1 es igual a 4 y a_3 es igual a 100. Calcula
    la razón r.
  pasos:
  - Como hay dos saltos entre a_1 y a_3, planteo a_1 por r al cuadrado es igual a a_3.
  - 'Reemplazo: 4 por r al cuadrado es igual a 100, entonces r al cuadrado es igual a 25.'
  - 'Calculo la raíz cuadrada: r puede ser 5 o -5.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la clave al trabajar con identificación de la razón geométrica en una
    sucesión?
  choices:
  - text: Identificar correctamente el patrón de progresión geométrica
    is_correct: true
  - text: Sumar los índices al azar
    is_correct: false
  - text: Ignorar la posición de cada término
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar correctamente el patrón de progresión
    geométrica. Es la clave conceptual al estudiar identificación de la razón geométrica en
    una sucesión.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el cálculo paso a paso de identificación de la razón geométrica en una sucesión,
    ¿qué procedimiento se debe seguir?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir la comprobación numérica
    is_correct: false
  - text: Cambiar la posición de los términos arbitrariamente
    is_correct: false
  - text: Dividir entre la nada
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar la coherencia del resultado con el enunciado.
    Garantiza que los cálculos en identificación de la razón geométrica en una sucesión sean
    precisos.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Si tienes términos vecinos (como el 2do y el 1ro), simplemente divide el de la
  derecha entre el de la izquierda.'
- 'Paso 2: Si tienes términos separados (ej. $a_4$ y $a_1$), divide el mayor entre el menor
  para aislar $r^{\Delta n}$.'
- 'Paso 3: Aplica raíz para despejar ''r'' (Si la distancia es 3 saltos, sacas raíz cúbica).'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en identificación de la razón geométrica en una sucesión.
ejemplos:
- titulo: A un salto de distancia
  enunciado: Calcula la razón de la P.G. donde a_2 = -12 y a_3 = 36.
  solucion_pasos:
  - Están juntos, así que es directo.
  - r = a3 / a2 = 36 / -12
  - r = -3.
- titulo: Ejemplo 1
  enunciado: Si a_2 es 6 y a_3 es 18, ¿cuál es la razón r?
  alternativas:
  - '3'
  - '12'
  - 1/3
  respuesta: '3'
  solucion_pasos:
  - 18 dividido entre 6 es igual a 3.
- titulo: Ejemplo 2
  enunciado: Si a_1 es 3 y a_4 es 24, ¿cuál es la razón r?
  alternativas:
  - '2'
  - '8'
  - '21'
  respuesta: '2'
  solucion_pasos:
  - 'Hay 3 saltos entre a_1 y a_4: 3 por r al cubo es igual a 24, r al cubo es 8, entonces
    r es 2.'
- titulo: ¿Se puede calcular la razón dividiendo dos términos consecutivos cualesquiera?
  respuesta: Sí
  solucion_pasos:
  - Siempre que estén uno junto al otro en la sucesión.
- titulo: ¿Al despejar r de una ecuación como r al cuadrado igual a 16, la única solución
    es 4?
  respuesta: 'No'
  solucion_pasos:
  - También puede ser -4, ya que -4 al cuadrado también da 16.
errores_frecuentes:
- Restar los términos en lugar de dividirlos (creyendo que es aritmética).
- Al despejar $r^2$, olvidar que la razón podría ser un número negativo alternante ($-3$ al
  cuadrado también da $9$).
- Dividir directamente el término mayor entre el menor sin considerar cuántos saltos hay entre
  ellos.
- Olvidar que al despejar una raíz cuadrada existen dos soluciones posibles, una positiva
  y una negativa.
- Confundir el número de saltos entre dos términos con la posición de uno de ellos.
afirmaciones_verdaderas:
- La formulación de identificación de la razón geométrica en una sucesión mantiene la regularidad
  de la sucesión.
- Cuando dos términos de una progresión geométrica están separados por más de una posición,
  hay que elevar la razón a la cantidad de saltos entre ellos.
al_terminar_debes_poder: Resolver problemas prácticos utilizando identificación de la razón
  geométrica en una sucesión.
