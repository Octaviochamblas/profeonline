resumen_inicial: 'La razón geométrica $r$ se determina dividiendo cualquier término
  entre su término inmediatamente anterior: $r = \frac{a_{n+1}}{a_n} = \sqrt[k-m]{\frac{a_k}{a_m}}$.'
explicacion_simple: Para encontrar la razón de una progresión geométrica, dividimos
  un número de la lista entre el número que está justo a su izquierda. Ese cociente
  es el multiplicador que hace avanzar toda la secuencia.
explicacion_formal: 'En una P.G., la **Razón Geométrica $r$** se calcula a partir
  de dos términos consecutivos o dos términos distantes $a_k$ y $a_m$:


  $$r = \frac{a_{n+1}}{a_n}$$


  $$\text{Fórmula generalizada de razón: } r^{k-m} = \frac{a_k}{a_m} \implies r =
  \sqrt[k-m]{\frac{a_k}{a_m}}$$'
definiciones_clave: '- **Razón geométrica $r$**: Factor multiplicativo $r = \frac{a_{n+1}}{a_n}$.'
propiedades_relaciones: '- **Inversión por división**: Involucra la radicación para
  determinar la razón desde términos no contiguos.'
ejemplo_guiado:
  enunciado: En una P.G. el segundo término es $a_2 = 12$ y el quinto término es $a_5
    = 96$. Calcule la razón geométrica $r$.
  pasos:
  - 'Paso 1: Aplicar la fórmula generalizada: $r^{5-2} = \frac{a_5}{a_2} \implies
    r^3 = \frac{96}{12}$.'
  - 'Paso 2: Resolver la división: $r^3 = 8$.'
  - 'Paso 3: Extraer la raíz cúbica: $r = \sqrt[3]{8} = 2$.'
  - 'Conclusión: La razón geométrica es $r = 2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula la razón r en una P.G. conocidos dos términos ak y am?
  choices:
  - text: r = (ak / am)^(1 / (k - m)) (extraer la raíz k-m de la división de los términos)
    is_correct: true
  - text: r = (ak - am) / (k - m)
    is_correct: false
  - text: r = ak · am
    is_correct: false
  - text: r = k - m
    is_correct: false
  explanation: La alternativa correcta es 'r = (ak / am)^(1 / (k - m)) (extraer la
    raíz k-m de la división de los términos)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para a2 = 12 y a5 = 96, ¿cuál fue la razón r obtenida?
  choices:
  - text: r = 2
    is_correct: true
  - text: r = 8
    is_correct: false
  - text: r = 3
    is_correct: false
  - text: r = 4
    is_correct: false
  explanation: La alternativa correcta es 'r = 2'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de determinar la razón geométrica
  $r = \sqrt[k-m]{\frac{a_k}{a_m}}$ dividiendo los términos y aplicando radicación.
semantic_id: MAT.NUM.PROG_GEOMETRICA.RAZON_GEOMETRICA
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una razón multiplicativa constante
  $r = \frac{a_{n+1}}{a_n}$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 \cdot r^{n-1}$ o de la
  suma $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
- 'Paso 3: Resolver numéricamente o con logaritmos el parámetro solicitado ($a_n,
  a_1, r, n$ o $S_n$).'
errores_correccion: '- **Error 1: Elevar la razón $r$ a la potencia $n$ en lugar de
  $(n-1)$ en el término general ($a_n = a_1 \cdot r^n$).** **Cómo corregirlo:** La
  razón $r$ se aplica a partir de la segunda posición, por lo que el exponente correcto
  es $(n-1)$.


  - **Error 2: Usar la fórmula de la suma de progresión aritmética en una progresión
  geométrica.** **Cómo corregirlo:** En la P.G. la suma DEBE utilizar el factor multiplicativo
  $S_n = a_1 \cdot \left[ \frac{r^n - 1}{r - 1} \right]$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_GEOMETRICA.RAZON_GEOMETRICA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión geométrica.
- titulo: Ejemplo 2
  enunciado: Verificación de la razón constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} / a_n = r$.
- titulo: ¿Es constante el cociente entre términos consecutivos en una P.G.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión geométrica.
- titulo: ¿Corresponde la P.G. a una función exponencial discreta?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a_n = a_1 \cdot r^{n-1}$ es una potencia de base $r$.
errores_frecuentes:
- Elevar la razón r al exponente n en lugar de multiplicar por r^(n-1) al calcular
  an.
- Restar los términos en lugar de calcular el cociente de división para determinar
  la razón r.
- Usar la fórmula del promedio de Gauss propia de la progresión aritmética en una
  progresión geométrica.
- Declarar que una razón geométrica menor que 1 genera términos negativos en la secuencia.
- Declarar la razón porcentual P% con el factor multiplicativo r = 1 + P/100.
afirmaciones_verdaderas:
- Una progresión geométrica tiene una razón constante $r = \frac{a_{n+1}}{a_n}$ entre
  términos consecutivos.
- El término general de una P.G. se calcula mediante la función exponencial $a_n =
  a_1 \cdot r^{n-1}$.
