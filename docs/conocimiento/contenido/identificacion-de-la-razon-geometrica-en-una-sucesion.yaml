semantic_id: MAT.NUM.PROG_GEOMETRICA.RAZON_GEOMETRICA
resumen_inicial: 'La identificación de la razón geométrica $r$ en una progresión geométrica calcula el factor multiplicativo mediante la división de términos consecutivos ($r = \frac{a_{n+1}}{a_n}$) o aplicando la raíz del intervalo entre dos términos distantes: $r = \sqrt[k-m]{\frac{a_k}{a_m}}$.'
explicacion_simple: |
  Para averiguar **por cuánto se multiplica** (la razón $r$) en una progresión geométrica:
  - Si tienes términos seguidos (por ejemplo, el término 2 vale $12$ y el término 3 vale $36$):
    Divides el término posterior entre el anterior: $r = \frac{36}{12} = 3$.
  - Si los términos **no están seguidos** (por ejemplo, sabes que el término $a_2 = 5$ y el término $a_4 = 45$):
    1. Divides los valores: $\frac{45}{5} = 9$.
    2. Como pasaron $2$ saltos de posición ($4 - 2 = 2$), le sacas la raíz cuadrada a $9$: $\sqrt{9} = 3$.
    La razón geométrica es $r = 3$.
explicacion_formal: |
  ### Definición formal
  La **razón geométrica $r$** es la constante multiplicativa de cambio en una progresión geométrica.

  ### Métodos de Cálculo
  1. **A partir de términos consecutivos**:
     $$r = \frac{a_{n+1}}{a_n} \quad (\forall n \ge 1)$$
  2. **A partir de dos términos arbitrarios $a_m$ y $a_k$ (con $k > m$)**:
     Dado que $a_k = a_1 \cdot r^{k-1}$ y $a_m = a_1 \cdot r^{m-1}$:
     $$\frac{a_k}{a_m} = r^{k-m} \implies r = \sqrt[k-m]{\frac{a_k}{a_m}} = \left(\frac{a_k}{a_m}\right)^{\frac{1}{k-m}}$$

  ### Interpretación según la magnitud de $r$
  - Si $r > 1 \implies$ Factor de amplificación o crecimiento.
  - Si $0 < r < 1 \implies$ Factor de reducción o atenuación.
  - Si $r < 0 \implies$ Factor con inversión de polaridad o signo.

  ### Síntesis didáctica
  - Términos consecutivos: $r = \frac{a_{n+1}}{a_n}$.
  - Términos distantes: $r = \left(\frac{a_k}{a_m}\right)^{\frac{1}{k-m}}$.
definiciones_clave: |
  - **Razón geométrica ($r$)**: Cociente constante entre dos términos consecutivos cualesquiera de una P.G.
  - **Exponente de distancia ($k - m$)**: Diferencia de posiciones ordinales que determina el orden de la raíz.
  - **Cociente de amplitudes ($\frac{a_k}{a_m}$)**: Razón global acumulada entre el término distante y el término inicial dado.
propiedades_relaciones: |
  - **Multiplicación en $N$ pasos**: Para avanzar $N$ casillas en la progresión, el término actual se multiplica por $r^N$: $a_{m+N} = a_m \cdot r^N$.
  - **Independencia del par elegido**: El cociente $\frac{a_{n+1}}{a_n}$ entrega exactamente la misma constante $r$ para cualquier índice $n$.
ejemplo_guiado:
  enunciado: 'En una progresión geométrica de términos positivos se sabe que el segundo término es $a_2 = 12$ y el quinto término es $a_5 = 324$. Determina la razón geométrica $r$.'
  pasos:
    - 'Paso 1: Identificamos los datos: $m=2, a_2=12$ y $k=5, a_5=324$.'
    - 'Paso 2: Calculamos el intervalo de posiciones: $k - m = 5 - 2 = 3$ saltos.'
    - 'Paso 3: Calculamos el cociente de los términos: $\frac{a_5}{a_2} = \frac{324}{12} = 27$.'
    - 'Paso 4: Extraemos la raíz cúbica: $r = \sqrt[3]{27} = 3$. La razón geométrica es **$r = 3$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la razón geométrica $r$ dados dos términos no consecutivos $a_m$ y $a_k$ (con $k > m$)?'
    choices:
      - {text: 'Extraer la raíz $(k-m)$-ésima al cociente de los valores ($r = \sqrt[k-m]{\frac{a_k}{a_m}}$)', is_correct: true}
      - {text: 'Restar las posiciones y multiplicar por el cociente', is_correct: false}
      - {text: 'Dividir los valores y restar la diferencia de posiciones', is_correct: false}
      - {text: 'Multiplicar ambos términos y elevar al cuadrado', is_correct: false}
    explanation: 'La alternativa correcta es ''Extraer la raíz $(k-m)$-ésima al cociente de los valores ($r = \sqrt[k-m]{\frac{a_k}{a_m}}$)''. Sale de aislarl $r$ en $a_k / a_m = r^{k-m}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en una progresión geométrica $a_1 = 3$ y $a_3 = 48$, ¿cuál es el valor positivo de la razón geométrica $r$?'
    choices:
      - {text: '$r = 4$, calculando $\sqrt{\frac{48}{3}} = \sqrt{16} = 4$', is_correct: true}
      - {text: '$r = 16$, dividiendo únicamente $48 / 3$', is_correct: false}
      - {text: '$r = 8$, calculando la mitad de 16', is_correct: false}
      - {text: '$r = 2$, extrayendo raíz cuarta', is_correct: false}
    explanation: 'La alternativa correcta es ''$r = 4$, calculando $\sqrt{\frac{48}{3}} = \sqrt{16} = 4$''. $\sqrt{16} = 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los términos disponibles (consecutivos o distantes).'
  - 'Paso 2: Si son consecutivos, dividir $r = \frac{a_{n+1}}{a_n}$.'
  - 'Paso 3: Si son distantes $a_m$ y $a_k$, dividir el término mayor entre el menor: $\frac{a_k}{a_m}$.'
  - 'Paso 4: Calcular la diferencia de posiciones $(k - m)$ y extraer la raíz $(k-m)$-ésima para obtener $r$.'
errores_correccion: |
  - **Error 1:** Dividir al revés al calcular la razón (hacer $\frac{a_n}{a_{n+1}}$ en lugar de $\frac{a_{n+1}}{a_n}$). **Cómo corregirlo:** La razón se obtiene siempre dividiendo el **término posterior entre el anterior: $r = \frac{a_{n+1}}{a_n}$**.
  - **Error 2:** Restar las posiciones en lugar de usarlas como índice de la raíz al trabajar con términos distantes. **Cómo corregirlo:** La diferencia de posiciones $(k-m)$ **es el ÍNDICE DE LA RAÍZ: $r = \sqrt[k-m]{a_k / a_m}$**.
ejemplos:
  - titulo: 'Razón con consecutivos'
    enunciado: 'Si $a_3 = 20$ y $a_4 = 100$, ¿la razón es $r = \frac{100}{20} = 5$?'
    alternativas:
      - 'Sí, dividiendo el término 4 entre el término 3'
      - 'No, la razón es 80'
      - 'No, la razón es 0,2'
    respuesta: 'Sí, dividiendo el término 4 entre el término 3'
    solucion_pasos:
      - '1. Aplicamos $r = a_4 / a_3$.'
      - '2. $r = 100 / 20 = 5$.'
  - titulo: 'Razón con 2 saltos'
    enunciado: 'Si $a_2 = 8$ y $a_4 = 72$, ¿la razón positiva es $r = \sqrt{\frac{72}{8}} = \sqrt{9} = 3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $r^2 = 72/8 = 9 \implies r = 3$.'
  - titulo: 'Razón fraccionaria'
    enunciado: 'Si $a_1 = 80$ y $a_2 = 20$, ¿la razón es $r = \frac{20}{80} = \frac{1}{4} = 0,25$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $20 / 80 = 0,25$.'
  - titulo: 'Razón igual a 1'
    enunciado: 'Si $a_5 = 15$ y $a_8 = 15$, ¿la razón es $r = \sqrt[3]{15/15} = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\sqrt[3]{1} = 1$.'
errores_frecuentes:
  - 'Dividir el término anterior entre el posterior invirtiendo el valor de la razón geométrica.'
  - 'Una razón geométrica menor que 1 genera términos negativos en la secuencia.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Restar el valor de la diferencia de posiciones en lugar de extraer la raíz correspondiente.'
  - 'La razón geométrica de una sucesión debe ser siempre un número entero mayor que 1.'
afirmaciones_verdaderas:
  - 'La razón geométrica $r$ dados dos términos distantes $a_m$ y $a_k$ es $r = \sqrt[k-m]{\frac{a_k}{a_m}}$.'
  - 'El cociente entre cualquier término $a_{n+1}$ y su antecesor $a_n$ en una P.G. entrega la constante $r$.'
