semantic_id: MAT.GEO.VECTORES_OPERATORIA.RESTA_COMPONENTES
resumen_inicial: 'Sustracción de vectores por componentes: conceptos, teoremas, propiedades
  geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: Restar un vector v de un vector u es lo mismo que sumarle a u
  el vector opuesto de v.
explicacion_formal: '![Sustracción de vectores por componentes](/static/img/geometria/cartesiano-vectores/vectores-resta-componentes.svg)


  ### Definición formal


  La resta $\vec{u}-\vec{v}$ se calcula como $(u_x-v_x,\,u_y-v_y)$, y es equivalente
  a sumar $\vec{u}+(-\vec{v})$, donde $-\vec{v}$ es el vector opuesto de $\vec{v}$.


  ### Desarrollo didáctico


  Si $\vec{u}=(3,1)$ y $\vec{v}=(1,3)$, entonces $\vec{u}-\vec{v}=(3-1,\,1-3)=(2,-2)$.
  Geométricamente, este vector va desde el extremo de $\vec{v}$ hasta el extremo de
  $\vec{u}$ (ambos anclados en el origen).'
definiciones_clave: '- **Sustracción de vectores por componentes**: Elemento o propiedad
  fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a sustracción de vectores por componentes.'
