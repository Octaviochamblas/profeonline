semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.TRAPEZOIDE_ASIMETRICO
resumen_inicial: El trapezoide asimétrico es un cuadrilátero sin lados paralelos ni ejes de simetría, cuyos cuatro ángulos interiores suman 360°.
explicacion_simple: 'Un **trapezoide asimétrico** es un cuadrilátero totalmente irregular: no tiene **ningún lado paralelo** a otro (cero paralelas), sus cuatro lados suelen medir cosas distintas y sus cuatro esquinas tienen aperturas diferentes.


  No tiene ejes de simetría (no puedes doblarlo por ninguna línea para que coincida consigo mismo) ni centro de rotación. La única regla geométrica sagrada que siempre cumple es la de todos los cuadriláteros: **sus cuatro ángulos interiores suman $360^\circ$**. Para calcular su área, el truco universal es trazar una diagonal para partirlo en dos triángulos y calcular el área de cada uno por separado.


  ![Características del trapezoide asimétrico](/static/img/nodos/caracteristicas-del-trapezoide-asimetrico-intro.svg)

  '
explicacion_formal: '### Definición formal

  Un cuadrilátero simple $\mathcal{Q} = (A, B, C, D)$ es un **trapezoide asimétrico** si y solo si carece de lados paralelos y de elementos de simetría axial:

  $$\overline{AB} \not\parallel \overline{CD} \quad \wedge \quad \overline{BC} \not\parallel \overline{DA} \quad \wedge \quad \text{Sim}(\mathcal{Q}) = \{id\}$$


  ### Propiedades geométricas esenciales

  1. **Cero paralelismo:** No posee bases. Las cuatro rectas directrices de los lados se intersecan dos a dos en el plano.

  2. **Teorema de la suma angular:** Como todo cuadrilátero simple plano:

  $$\sum_{i=1}^4 \angle_i = \alpha + \beta + \gamma + \delta = 360^\circ$$

  3. **Diagonales:** Se cortan en un punto interior $M$, pero no son perpendiculares, ni congruentes, ni se dimidian entre sí.

  4. **Cálculo de área por triangulación:**

  Cualquiera de sus diagonales particiona al trapezoide en dos triángulos disjuntos $\triangle_1$ y $\triangle_2$:

  $$A_{\text{trapezoide}} = A(\triangle_1) + A(\triangle_2)$$


  > **Complemento didáctico:** La palabra clave es ''asimétrico'': nada es igual a nada. Ni lados iguales, ni lados paralelos, ni diagonales iguales. Si en la PAES te dan 3 ángulos de un trapezoide, simplemente súmalos y réstaselos a 360° para encontrar el cuarto ángulo.

  '
definiciones_clave: '- **Trapezoide asimétrico**: Cuadrilátero sin lados paralelos y sin ejes de simetría.

  - **Suma interior de cuadriláteros**: Propiedad universal por la cual $\sum \angle = 360^\circ$.

  - **Triangulación**: Técnica de particionar un polígono irregular en triángulos para sumar sus áreas.

  '
propiedades_relaciones: '- **Diferencia con el deltoide**: El deltoide es un trapezoide simétrico (con dos pares de lados congruentes); el trapezoide asimétrico carece de lados congruentes de a pares.

  - **Invarianza topológica**: Todo trapezoide convexo puede ser descompuesto en dos triángulos mediante cualquiera de sus dos diagonales.

  - **No inscriptibilidad general**: No admite circunferencia inscrita ni circunscrita en el caso general.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de trapezoide asimétrico](/static/img/nodos/caracteristicas-del-trapezoide-asimetrico-ejemplos.svg)


    En un trapezoide asimétrico $ABCD$, las medidas de tres de sus ángulos interiores son $\angle A = 105^\circ$, $\angle B = 78^\circ$ y $\angle C = 85^\circ$. Determina la medida del cuarto ángulo interior $\angle D$.'
  pasos:
  - 'Paso 1: Recordar el teorema de la suma angular de cuadriláteros: $\angle A + \angle B + \angle C + \angle D = 360^\circ$.'
  - 'Paso 2: Sumar los tres ángulos conocidos: $105^\circ + 78^\circ + 85^\circ = 268^\circ$.'
  - 'Paso 3: Despejar el cuarto ángulo: $\angle D = 360^\circ - 268^\circ = 92^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántos pares de lados paralelos posee un trapezoide asimétrico?
  choices:
  - text: Ninguno (cero pares de lados paralelos).
    is_correct: true
  - text: Exactamente un par de lados paralelos.
    is_correct: false
  - text: Dos pares de lados paralelos.
    is_correct: false
  - text: Depende de la suma de sus diagonales.
    is_correct: false
  explanation: La alternativa correcta es 'Ninguno (cero pares de lados paralelos).' Por definición, los trapezoides no tienen lados paralelos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los ángulos de un trapezoide asimétrico miden 2x, 3x, 4x y 6x, ¿cuánto mide el ángulo menor?
  choices:
  - text: 48°.
    is_correct: true
  - text: 24°.
    is_correct: false
  - text: 72°.
    is_correct: false
  - text: 36°.
    is_correct: false
  explanation: La alternativa correcta es '48°.' La suma total es $2x + 3x + 4x + 6x = 15x = 360^\circ \implies x = 24^\circ$. El ángulo menor es $2x = 2(24^\circ) = 48^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Verificar que el cuadrilátero no posea lados paralelos ni ejes de simetría.

  2. Para hallar ángulos faltantes, aplicar $\sum \angle = 360^\circ$.

  3. Para hallar el área, trazar una diagonal y calcular la suma de las áreas de los dos triángulos formados.

  4. Para el perímetro, sumar directamente las cuatro longitudes de lados: $P = a + b + c + d$.

  '
errores_correccion: '- **Error común 1:** Intentar aplicar la fórmula del trapecio $A = \frac{B + b}{2} \cdot h$. **Corrección:** El trapezoide no tiene bases paralelas ni altura constante; se debe triangular.

  - **Error común 2:** Asumir que los ángulos consecutivos suman $180^\circ$. **Corrección:** No hay paralelas, por lo que no existen ángulos colaterales suplementarios.

  '
ejemplos:
- tipo: A
  titulo: Suma de ángulos en trapezoide
  enunciado: En un trapezoide asimétrico, tres ángulos interiores miden $90^\circ$, $110^\circ$ y $60^\circ$. ¿Cuánto mide el cuarto ángulo?
  alternativas:
  - text: $100^\circ$.
    is_correct: true
  - text: $80^\circ$.
    is_correct: false
  - text: $120^\circ$.
    is_correct: false
  - text: $90^\circ$.
    is_correct: false
  explicacion: $360^\circ - (90^\circ + 110^\circ + 60^\circ) = 360^\circ - 260^\circ = 100^\circ$.
- tipo: B
  titulo: Lados paralelos en trapezoide
  enunciado: ¿Tiene el trapezoide asimétrico algún lado paralelo?
  respuesta: 'No'
  explicacion: No. Carece por completo de lados paralelos.
errores_frecuentes:
- '''Confundir el trapezoide con el trapecio intentando buscar bases paralelas.'''
- '''Creer que los ángulos interiores de un trapezoide suman $180^\circ$ como en un triángulo.'''
- '''Aplicar fórmulas de mediana o paralelismo en figuras trapezoidales.'''
afirmaciones_verdaderas:
- '''El trapezoide asimétrico carece de lados paralelos y de ejes de simetría.'''
- '''La suma de los cuatro ángulos interiores de cualquier trapezoide es siempre $360^\circ$.'''
- '''El área de un trapezoide asimétrico puede calcularse particionándolo en dos triángulos mediante una diagonal.'''
al_terminar_debes_poder: '**QUÉ:** Identificar trapezoides asimétricos y resolver problemas de ángulos y áreas mediante triangulación.


  **CÓMO:** Aplicando $\sum \angle = 360^\circ$ y la descomposición $A = A_1 + A_2$.


  ![Síntesis de trapezoide asimétrico](/static/img/nodos/caracteristicas-del-trapezoide-asimetrico-resumen.svg)

  '
