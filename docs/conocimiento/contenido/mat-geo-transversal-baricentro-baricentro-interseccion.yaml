semantic_id: MAT.GEO.TRANSVERSAL_BARICENTRO.BARICENTRO_INTERSECCION
resumen_inicial: 'Definición de baricentro como punto de intersección de las transversales
  de gravedad: conceptos, teoremas, propiedades geométricas y cálculo en Elementos
  Secundarios del Triángulo.'
explicacion_simple: 'Al igual que ocurre con las alturas y las bisectrices, las tres
  transversales de gravedad de un triángulo también concurren siempre en un único
  punto: el baricentro.'
explicacion_formal: '![Baricentro, intersección de las transversales de gravedad](/static/img/geometria/elementos-secundarios/transversal-baricentro-baricentro-interseccion.svg)


  ### Definición formal


  Dado un triángulo ABC, el baricentro G es el punto común a las tres transversales
  de gravedad trazadas desde A, B y C. Su coordenada es el promedio de los tres vértices:
  $G=\frac{A+B+C}{3}$.


  ### Desarrollo didáctico


  A diferencia del ortocentro y el circuncentro, el baricentro siempre se ubica en
  el interior del triángulo, sin importar su forma.'
