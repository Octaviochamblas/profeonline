semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CEROS_CONCEPTO
resumen_inicial: 'Los ceros o raíces de una función cuadrática son las preimágenes $x$ que hacen $f(x) = 0$, correspondiendo geométricamente a las intersecciones de la parábola con el eje $x$.'
explicacion_simple: |
  Un cero de una función es un número de entrada $x$ que produce una salida cero ($y = 0$). Gráficamente, cuando la altura $y$ vale cero, el punto se encuentra exactamente sobre la línea horizontal del eje $x$. Por eso, los ceros o raíces de una función cuadrática señalan los lugares precisos donde la parábola atraviesa o toca al eje horizontal.
explicacion_formal: |
  ### Definición formal
  Se denomina **cero o raíz real** de la función cuadrática $f(x) = ax^2 + bx + c$ a todo número $x_k \in \mathbb{R}$ tal que:
  $$f(x_k) = 0 \iff ax_k^2 + bx_k + c = 0$$
  Cada cero real $x_k$ determina un punto de intersección de la gráfica con el eje de las abscisas de coordenadas $(x_k, 0)$.

  ### Desglose simbólico
  - $f(x) = 0$: Condición algebraica del eje horizontal (eje $x$).
  - $(x_1, 0)$ y $(x_2, 0)$: Puntos cartesianos de corte con el eje $x$.
  - Eje de simetría $h = \frac{x_1 + x_2}{2}$: La abscisa del vértice se ubica exactamente en el punto medio entre los dos ceros reales.

  ### Síntesis didáctica
  Hallar los ceros de una función es equivalente a resolver la ecuación cuadrática asociada $ax^2 + bx + c = 0$. Gráficamente, una parábola puede cortar al eje $x$ en dos puntos distintos, tocarlo en un único punto tangente, o no tocarlo si no tiene raíces reales.
definiciones_clave: |
  - **Cero o raíz de una función**: Valor de entrada $x$ para el cual la variable dependiente resulta $f(x) = 0$.
  - **Intersecciones con el eje $x$**: Puntos cartesianos del tipo $(x_k, 0)$ donde la gráfica corta al eje horizontal.
  - **Punto medio entre raíces**: Propiedad que ubica la abscisa del vértice en $h = \frac{x_1 + x_2}{2}$.
propiedades_relaciones: |
  - **Forma factorizada**: Si la función tiene ceros reales $x_1$ y $x_2$, se puede expresar como $f(x) = a(x - x_1)(x - x_2)$.
  - **Simetría de raíces**: Los dos ceros reales equidistan del eje de simetría $h$.
ejemplo_guiado:
  enunciado: 'Dada la función cuadrática $f(x) = (x - 1)(x - 5)$, identifica sus ceros o raíces, determina las coordenadas de sus puntos de corte con el eje $x$ y halla la abscisa del vértice a partir del punto medio entre sus ceros.'
  pasos:
    - 'Paso 1: Igualamos la función a cero para hallar sus raíces: $(x - 1)(x - 5) = 0$.'
    - 'Paso 2: Por la propiedad del producto nulo, los ceros son $x_1 = 1$ y $x_2 = 5$.'
    - 'Paso 3: Escribimos los puntos de intersección con el eje $x$, los cuales son $(1, 0)$ y $(5, 0)$.'
    - 'Paso 4: Calculamos el punto medio entre las raíces para obtener el eje de simetría: $h = \frac{1 + 5}{2} = \frac{6}{2} = 3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si los ceros de la función cuadrática $f(x)$ son $x_1 = -2$ y $x_2 = 4$, ¿cuáles son los puntos de intersección de su gráfica con el eje $x$ y la posición de su eje de simetría?'
    choices:
      - {text: 'Intersecciones en $(-2, 0)$ y $(4, 0)$, con eje de simetría en $x = 1$', is_correct: true}
      - {text: 'Intersecciones en $(0, -2)$ y $(0, 4)$, con eje de simetría en $x = 2$', is_correct: false}
      - {text: 'Intersecciones en $(-2, 4)$ y $(4, -2)$, con eje de simetría en $x = 0$', is_correct: false}
      - {text: 'Intersecciones en $(2, 0)$ y $(-4, 0)$, con eje de simetría en $x = -1$', is_correct: false}
    explanation: 'La alternativa correcta es ''Intersecciones en $(-2, 0)$ y $(4, 0)$, con eje de simetría en $x = 1$''. Los puntos son de la forma $(x_k, 0)$ y la abscisa media es $h = \frac{-2 + 4}{2} = 1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Una parábola interseca al eje $x$ en un único punto de coordenadas $(3, 0)$. ¿Qué se puede afirmar sobre la posición de su vértice?'
    choices:
      - {text: 'El vértice se ubica exactamente sobre el eje $x$ en el punto $V(3, 0)$', is_correct: true}
      - {text: 'El vértice se encuentra en el origen de coordenadas $(0, 0)$', is_correct: false}
      - {text: 'El vértice está en el eje $y$ en $(0, 3)$', is_correct: false}
      - {text: 'La parábola no posee vértice', is_correct: false}
    explanation: 'La alternativa correcta es ''El vértice se ubica exactamente sobre el eje $x$ en el punto $V(3, 0)$''. Cuando hay un solo corte tangente, el vértice descansa sobre el eje $x$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Plantear la ecuación $f(x) = 0$ reemplazando la regla funcional.'
  - 'Paso 2: Resolver la ecuación cuadrática por factorización o fórmula general para encontrar las raíces reales $x_1$ y $x_2$.'
  - 'Paso 3: Expresar los ceros reales como puntos cartesianos de corte con el eje horizontal: $(x_1, 0)$ y $(x_2, 0)$.'
errores_correccion: |
  - **Error 1:** Confundir los ceros de la función (cortes con el eje $x$) con la intersección con el eje $y$. **Cómo corregirlo:** Los ceros se obtienen al resolver $f(x) = 0$ y tienen forma $(x_k, 0)$. El corte con el eje $y$ se obtiene evaluando $f(0)$ y tiene forma $(0, c)$.
  - **Error 2:** Creer que toda función cuadrática debe cortar obligatoriamente al eje $x$. **Cómo corregirlo:** Si la parábola flota sobre el eje $x$ o está completamente por debajo sin tocarlo, sus ceros son complejos no reales y no presenta intersecciones reales con el eje $x$.
ejemplos:
  - titulo: 'Identificación gráfica de ceros'
    enunciado: 'Si la gráfica de $f(x)$ pasa por los puntos $(-3, 0)$, $(0, -6)$ y $(2, 0)$, ¿cuáles son los ceros de la función?'
    alternativas:
      - '$x_1 = -3$ y $x_2 = 2$'
      - '$x = -6$'
      - '$x_1 = 3$ y $x_2 = -2$'
    respuesta: '$x_1 = -3$ y $x_2 = 2$'
    solucion_pasos:
      - '1. Los ceros son las preimágenes cuya ordenada es $y = 0$.'
      - '2. Los puntos $(-3, 0)$ y $(2, 0)$ tienen $y = 0$.'
      - '3. Por lo tanto, los ceros de la función son $x_1 = -3$ y $x_2 = 2$.'
  - titulo: 'Ceros de función en forma factorizada'
    enunciado: '¿Cuáles son los ceros de $g(x) = -2(x + 4)(x - 7)$?'
    alternativas:
      - '$x_1 = -4$ y $x_2 = 7$'
      - '$x_1 = 4$ y $x_2 = -7$'
      - '$x_1 = -2$ y $x_2 = 28$'
    respuesta: '$x_1 = -4$ y $x_2 = 7$'
    solucion_pasos:
      - '1. Igualamos a cero: $-2(x + 4)(x - 7) = 0$.'
      - '2. Despejamos cada factor: $x + 4 = 0 \implies x = -4$ y $x - 7 = 0 \implies x = 7$.'
      - '3. Los ceros son $x_1 = -4$ y $x_2 = 7$.'
  - titulo: 'Relación entre ceros y eje de simetría'
    enunciado: 'Si los ceros de una función cuadrática son $x_1 = -5$ y $x_2 = 1$, ¿su eje de simetría es $x = -2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Calculamos el punto medio $h = \frac{-5 + 1}{2} = \frac{-4}{2} = -2$.'
  - titulo: 'Coordenadas de los ceros en el plano'
    enunciado: '¿Los puntos de intersección con el eje de las abscisas se expresan siempre con ordenada $y = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por definición de eje $x$, todos sus puntos tienen la forma $(x, 0)$.'
errores_frecuentes:
  - 'Los ceros de la función $f(x) = x^2 - 9$ son los puntos $(0, 3)$ y $(0, -3)$.'
  - 'Para encontrar los ceros de una función cuadrática se debe evaluar $x = 0$ en la fórmula.'
  - 'El término independiente $c$ de la forma general es siempre uno de los ceros de la función.'
  - 'Toda parábola cuadrática posee exactamente dos intersecciones reales con el eje $x$.'
  - 'La suma de los ceros de una función cuadrática coincide siempre con la ordenada de su vértice.'
afirmaciones_verdaderas:
  - 'Los ceros de una función cuadrática son las soluciones reales de la ecuación $f(x) = 0$ y corresponden a los puntos de corte con el eje $x$.'
  - 'La abscisa del vértice de una parábola se encuentra exactamente en el punto medio entre sus dos ceros reales.'
al_terminar_debes_poder: 'Interpretar conceptual y gráficamente los ceros de una función cuadrática como los puntos de corte con el eje horizontal $x$.'
