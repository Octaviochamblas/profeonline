semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CEROS_CONCEPTO
resumen_inicial: Los ceros o raíces de una función cuadrática son los valores de $x$ que anulan la función ($f(x) = 0$), y representan geométricamente las coordenadas horizontales de los puntos donde la parábola interseca o hace contacto con el eje $X$ en $(x_i, 0)$.
explicacion_simple: "![Los ceros o raíces de una función cuadrática son los valores de $x$ que anulan la función ($f(x) = 0$), y representan geométricamente las coordenadas horizontales de los puntos donde la parábola interseca o hace contacto con el eje $X$ en $(x_i, 0)$](/static/img/nodos/interpretacion-de-los-ceros-de-la-funcion-como-intersecciones-con-el-eje-x-intro.svg)\n\n\nLos **ceros** o **raíces** de una función son los números que hacen que el resultado valga cero ($y = 0$):\n\n- **¿Qué significan en el dibujo?** Son los lugares exactos donde la parábola **cruza o toca la línea horizontal del eje $X$**.\n- **Diferencia clave:**\n  - Un **cero** es un número: $x = 3$.\n  - El **punto de intersección** es un par ordenado: **$(3, 0)$**.\n- Una parábola puede tener:\n  - **2 cortes:** si cruza el eje $X$ de lado a lado.\n  - **1 corte (tangente):** si solo toca el eje $X$ con la punta de su vértice y se devuelve.\n  - **0 cortes:** si flota por arriba o por abajo sin tocar el eje $X$."
explicacion_formal: 'Sea $f(x) = ax^2 + bx + c$ con $a \neq 0$. El conjunto de ceros $\mathcal{Z}(f)$ se define algebraicamente como el núcleo o kernel de la función:

  $$\mathcal{Z}(f) = \{x \in \mathbb{R} \mid f(x) = 0\}$$


  **Conexión geométrica con la intersección de variedades**:

  $$\text{Gr}(f) \cap (\text{Eje } X) = \{(x, y) \in \mathbb{R}^2 \mid y = f(x) \land y = 0\} = \{(x_0, 0) \mid x_0 \in \mathcal{Z}(f)\}$$


  **Casos de intersección según la multiplicidad algebraica**:

  1. **Raíces simples ($x_1 \neq x_2$)**: La parábola es **secante** al eje $X$, atravesándolo transversalmente en $(x_1, 0)$ y $(x_2, 0)$.

  2. **Raíz doble ($x_1 = x_2 = x_v$)**: La parábola es **tangente** al eje $X$, haciendo contacto exclusivamente en su vértice $(x_v, 0)$.

  3. **Raíces complejas conjugadas (sin raíces reales)**: La parábola es **disjunta** del eje $X$ (no existe contacto en el plano real $\mathbb{R}^2$).'
definiciones_clave: '- **Cero / Raíz de la función**: Valor $x_0 \in \mathbb{R}$ que satisface $f(x_0) = 0$.

  - **Intersección secante**: Contacto donde la curva atraviesa el eje horizontal en dos puntos distintos.'
propiedades_relaciones: '- **Simetría de los ceros**: Si existen dos ceros $x_1$ y $x_2$, el vértice equidista exactamente de ambos: $x_v = \frac{x_1 + x_2}{2}$.

  - **Cambio de signo**: En raíces simples, la función cambia de signo al cruzar el cero.'
ejemplo_guiado:
  enunciado: '![Ejemplo Los ceros o raíces de una función cuadrática son los valores de $x$ que anulan la función ($f(x) = 0$), y representan geométricamente las coordenadas horizontales de los puntos donde la parábola interseca o hace contacto con el eje $X$ en $(x_i, 0)$](/static/img/nodos/interpretacion-de-los-ceros-de-la-funcion-como-intersecciones-con-el-eje-x-ejemplos.svg)



    Interpreta geométricamente los ceros de la función $f(x) = x^2 - 2x - 8$ e indica los puntos de intersección con el eje X.'
  pasos:
  - 'Paso 1: Plantear la condición de cero: $f(x) = 0 \implies x^2 - 2x - 8 = 0$.'
  - 'Paso 2: Factorizar la ecuación cuadrática: $(x - 4)(x + 2) = 0$.'
  - 'Paso 3: Extraer los ceros numéricos: $x_1 = 4, \; x_2 = -2$.'
  - 'Paso 4: Formular los puntos de corte geométricos: $P_1(4, 0)$ y $P_2(-2, 0)$.'
  - 'Paso 5: Comprobación de simetría del vértice: $x_v = \frac{4 + (-2)}{2} = \frac{2}{2} = 1$ (coincide con $-\frac{-2}{2(1)} = 1$).'
checkpoints:
- placement: after_explicacion_formal
  question: Si una función cuadrática tiene ceros en x = -3 y x = 5, ¿cuáles son los puntos de corte con el eje X?
  choices:
  - text: (-3, 0) y (5, 0)
    is_correct: true
  - text: (0, -3) y (0, 5)
    is_correct: false
  - text: (-3, 5)
    is_correct: false
  - text: (2, 0)
    is_correct: false
  explanation: La alternativa correcta es '(-3, 0) y (5, 0)'. En el eje $X$, la ordenada $y$ siempre vale 0, formando los pares ordenados $(x_i, 0)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola tiene su vértice en (4, 0), ¿cuántos ceros reales tiene la función?
  choices:
  - text: Un único cero real (x = 4 con multiplicidad 2, tangente al eje X)
    is_correct: true
  - text: Dos ceros reales distintos
    is_correct: false
  - text: Ningún cero real
    is_correct: false
  - text: Cuatro ceros
    is_correct: false
  explanation: La alternativa correcta es 'Un único cero real (x = 4 con multiplicidad 2, tangente al eje X)'. Si el vértice está sobre el eje $X$, la curva es tangente y tiene un solo cero.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Igualar la regla de correspondencia a cero: $f(x) = 0$.'
- 'Paso 2: Resolver la ecuación cuadrática resultante.'
- 'Paso 3: Identificar los valores escalares de las raíces $x_i$.'
- 'Paso 4: Escribir los puntos de corte en el formato $(x_i, 0)$.'
errores_correccion: '- **Error común:** Escribir los cortes con el eje X como $(0, x_1)$ y $(0, x_2)$.

  - **Cómo corregirlo:** En el eje $X$, **la $y$ es cero ($y = 0$)**, por lo que se escribe **$(x_1, 0)$**.'
ejemplos:
- titulo: 'Ejemplo 1: Puntos de corte secantes'
  enunciado: Si los ceros de $f(x)$ son $x = 1$ y $x = 7$, ¿dónde corta la parábola al eje horizontal?
  alternativas:
  - (1, 0) y (7, 0)
  - (0, 1) y (0, 7)
  - (1, 7)
  - (4, 0)
  respuesta: (1, 0) y (7, 0)
  solucion_pasos:
  - 'Paso 1: En el eje $X$, la ordenada es 0 $\implies (1, 0)$ y $(7, 0)$.'
- titulo: 'Ejemplo 2: Vértice tangente como cero único'
  enunciado: La función $f(x) = (x - 5)^2$ tiene un cero en $x = 5$. ¿Qué ocurre gráficamente en ese punto?
  alternativas:
  - La parábola es tangente al eje X en (5, 0)
  - La parábola cruza el eje X
  - No toca el eje X
  - Corta al eje Y en (5, 0)
  respuesta: La parábola es tangente al eje X en (5, 0)
  solucion_pasos:
  - 'Paso 1: Raíz doble $\implies$ vértice tangente en $(5, 0)$.'
- titulo: 'Ejemplo 3: Parábola flotante sin ceros'
  enunciado: Si una parábola tiene vértice en $(2, 3)$ y abre hacia arriba ($a > 0$), ¿cuántos ceros tiene?
  alternativas:
  - 0 ceros reales (no corta al eje X)
  - 2 ceros reales
  - 1 cero real
  - 3 ceros
  respuesta: 0 ceros reales (no corta al eje X)
  solucion_pasos:
  - 'Paso 1: El punto más bajo está en $y = 3 > 0$ y sube $\implies$ nunca toca $y = 0$.'
- titulo: 'Ejemplo 4: Simetría entre ceros'
  enunciado: Si los ceros están en $x = -4$ y $x = 6$, ¿cuál es el eje de simetría?
  alternativas:
  - x = 1
  - x = 2
  - x = -1
  - x = 5
  respuesta: x = 1
  solucion_pasos:
  - 'Paso 1: $x_v = (-4 + 6)/2 = 2/2 = 1$.'
errores_frecuentes:
- Invertir las coordenadas escribiendo (0, x₀).
- Confundir el valor del cero x₀ con el valor de la función f(x₀).
- Asumir que toda función cuadrática siempre corta al eje X.
afirmaciones_verdaderas:
- Los ceros de una función cuadrática corresponden a las abscisas de corte con el eje horizontal X.
- El eje de simetría se ubica exactamente en el punto medio entre los dos ceros reales de la función.
al_terminar_debes_poder: '**QUÉ:** Interpretar los ceros de una función cuadrática como intersecciones con el eje X.


  **CÓMO:** Vinculando las raíces algebraicas de f(x) = 0 con los pares ordenados geométricos (x_i, 0).


  ![Resumen Los ceros o raíces de una función cuadrática son los valores de $x$ que anulan la función ($f(x) = 0$), y representan geométricamente las coordenadas horizontales de los puntos donde la parábola interseca o hace contacto con el eje $X$ en $(x_i, 0)$](/static/img/nodos/interpretacion-de-los-ceros-de-la-funcion-como-intersecciones-con-el-eje-x-resumen.svg)'
