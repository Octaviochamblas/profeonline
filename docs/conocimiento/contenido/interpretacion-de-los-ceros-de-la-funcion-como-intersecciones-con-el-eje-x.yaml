semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CEROS_CONCEPTO
resumen_inicial: La interpretación de los ceros comprende que las raíces $x_1, x_2$ donde $f(x) = 0$ representan las abscisas de corte de la parábola con el eje X.
explicacion_simple: |
  Los **ceros o raíces** de una función cuadrática son los valores de $x$ que hacen que la función valga cero ($f(x) = 0$):

  - Geométricamente, los ceros representan **LOS PUNTOS DONDE LA PARÁBOLA CRUZA O TOCA EL EJE HORIZONTAL (EJE X)**.
  - Si los ceros son $x_1 = 2$ y $x_2 = 5$:
    - Significa que la parábola pasa por los puntos cartesiano **$(2, 0)$ y $(5, 0)$**.
  - **Tres casos posibles**:
    1. **2 cortes**: La parábola atraviesa el eje X en dos puntos.
    2. **1 corte**: La parábola apenas "toca" el eje X en su vértice (punto de tangencia).
    3. **0 cortes**: La parábola "flota" por arriba o por debajo del eje X sin tocarlo nunca.
explicacion_formal: |
  Sea la función $f(x) = ax^2 + bx + c$. El conjunto de **ceros o raíces** $Z(f)$ se define como la preimagen del elemento cero:

  $$Z(f) = \{x \in \mathbb{R} \mid f(x) = 0\}$$

  **Relación con el grafo cartesiano:**
  Los puntos de intersección de la parábola $\mathcal{P}$ con el eje $X$ ($y = 0$) son exactamente las parejas ordenadas:

  $$\{(x_i, 0) \in \mathbb{R}^2 \mid x_i \in Z(f)\}$$

  - La cantidad de ceros reales coincide exactamente con la cardinalidad $|Z(f)| \in \{0, 1, 2\}$.
definiciones_clave: |
  - **Ceros de una función cuadrática**: Valores reales de entrada $x$ que producen una imagen nula $f(x) = 0$, correspondientes a las abscisas de corte con el eje X.
propiedades_relaciones: |
  - **Punto medio entre raíces**: El eje de simetría $x_v$ se ubica exactamente en el punto medio de los ceros reales de la función: $x_v = \frac{x_1 + x_2}{2}$.
ejemplo_guiado:
  enunciado: 'Si una función cuadrática tiene como ceros $x_1 = -3$ y $x_2 = 4$, escribe las coordenadas de sus puntos de intersección con el eje X.'
  pasos:
    - 'Paso 1: Recordar que la condición de cero funcional impone la ordenada $y = 0$.'
    - 'Paso 2: Formar el primer punto ordenado con la primera raíz: $(-3, 0)$.'
    - 'Paso 3: Formar el segundo punto ordenado con la segunda raíz: $(4, 0)$.'
    - 'Paso 4: Concluir que los cortes con el eje X son $(-3, 0)$ y $(4, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué coordenada fija comparten siempre todos los puntos de intersección de una parábola con el eje X?'
    choices:
      - {text: 'La ordenada $y$ es igual a cero ($y = 0$)', is_correct: true}
      - {text: 'La abscisa $x$ es igual a cero ($x = 0$).', is_correct: false}
      - {text: 'La constante independiente $c$ es igual a cero.', is_correct: false}
      - {text: 'El discriminante es mayor que cero.', is_correct: false}
    explanation: 'La alternativa correcta es ''La ordenada $y$ es igual a cero ($y = 0$)''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si el vértice de una parábola cóncava hacia arriba está ubicado en $(3, 0)$, ¿cuántos ceros reales posee la función?'
    choices:
      - {text: 'Un único cero real doble en $x = 3$', is_correct: true}
      - {text: 'Dos ceros reales distintos en $x = 3$ y $x = -3$.', is_correct: false}
      - {text: 'Ningún cero real.', is_correct: false}
      - {text: 'Exactamente cuatro ceros reales.', is_correct: false}
    explanation: 'La alternativa correcta es ''Un único cero real doble en $x = 3$''. Al ser el vértice tangente al eje X, el cero es único.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Plantear la condición de cero funcional $f(x) = 0$.'
  - 'Paso 2: Resolver la ecuación para obtener los valores numéricos $x_1$ y $x_2$.'
  - 'Paso 3: Construir las parejas ordenadas asignando cero en la segunda componente $(x_1, 0)$ y $(x_2, 0)$.'
  - 'Paso 4: Marcar las abscisas de corte sobre el eje horizontal X del plano cartesiano.'
errores_correccion: |
  - **Error común:** Confundir los ceros de la función (cortes con el eje X) con la intersección con el eje Y.
  - **Cómo corregirlo:** Los ceros satisfacen **$f(x) = 0$ (CORTE EN X)**; el corte en Y satisface **$x = 0$ (CORTE EN Y)**.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Dos raíces reales distintas.
    alternativas:
      - 'Cortes en (-2, 0) y (5, 0)'
      - 'Cortes en (0, -2) y (0, 5)'
      - 'Sin cortes'
    respuesta: 'Cortes en (-2, 0) y (5, 0)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Raíz real única.
    alternativas:
      - 'Corte único en (4, 0)'
      - 'Cortes en (4, 0) y (-4, 0)'
      - 'Corte en (0, 4)'
    respuesta: 'Corte único en (4, 0)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El intercambio de las coordenadas de los ceros expresando $(0, x_1)$ en lugar de $(x_1, 0)$.'
  - 'La creencia de que una función cuadrática siempre debe cortar obligatoriamente al eje X en dos puntos.'
  - 'La suposición de que si los ceros son negativos, la parábola no se puede graficar en el plano real.'
  - 'La equiparación del valor del cero $x_i$ con el valor de la ordenada $f(x_i)$.'
  - 'La falta de memoria de que cuando la parábola es tangente al eje X, el cero es único y coincide exactamente con el vértice.'
afirmaciones_verdaderas:
  - 'Los ceros de una función cuadrática corresponden a las abscisas $x$ donde la parábola interseca al eje X en los puntos $(x_i, 0)$.'
  - 'El eje de simetría de una parábola con dos raíces reales se ubica exactamente en el punto medio de sus ceros $x_v = (x_1 + x_2)/2$.'
al_terminar_debes_poder: |
  QUÉ: Interpretar los ceros de una función cuadrática como los puntos de intersección con el eje X.
  CÓMO: Resolver $f(x) = 0$, construir los pares ordenados $(x_i, 0)$ y relacionarlos con el eje de simetría de la parábola.
