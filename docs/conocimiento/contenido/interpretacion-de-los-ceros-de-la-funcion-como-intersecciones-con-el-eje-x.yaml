procedimiento:
- 'Paso 1: Recuerda que un cero de la función es un valor de $x$ que satisface $f(x)=0$.'
- 'Paso 2: Interpreta geométricamente cada cero como un punto $(x_0,0)$ sobre el eje
  $x$ donde pasa la gráfica.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en interpretación de los ceros de la función como
  intersecciones con el eje x.
ejemplos:
- titulo: Interpretación geométrica de un cero conocido
  enunciado: Si $f(3)=0$, ¿qué se puede afirmar sobre la gráfica de $f$?
  solucion_pasos:
  - El punto $(3,0)$ pertenece a la gráfica de la función.
  - La parábola pasa por ese punto sobre el eje $x$.
- titulo: Interpretación de la ausencia de ceros
  enunciado: Si una función cuadrática no tiene ceros reales, ¿qué indica esto sobre
    su gráfica?
  solucion_pasos:
  - La parábola no cruza ni toca en ningún punto al eje $x$.
  - Permanece completamente por encima o por debajo del eje $x$.
- titulo: ¿Puede una función cuadrática tener más de dos ceros reales?
  enunciado: ¿Puede una función cuadrática tener más de dos ceros reales?
  respuesta: 'No'
  solucion_pasos:
  - Al ser un polinomio de grado 2, tiene como máximo dos ceros distintos.
- titulo: ¿Los ceros de la función corresponden a intersecciones con el eje $y$?
  enunciado: ¿Los ceros de la función corresponden a intersecciones con el eje $y$?
  respuesta: 'No'
  solucion_pasos:
  - Los ceros corresponden a intersecciones con el eje $x$, no con el eje $y$.
errores_frecuentes:
- Declarar los ceros de la función con la intersección con el eje $y$.
- Declarar que toda función cuadrática necesariamente tiene dos ceros reales.
- Declarar el concepto de cero (un valor de $x$) con el punto geométrico completo
  $(x_0,0)$.
- No relacionar el concepto algebraico de cero con su interpretación gráfica sobre
  el eje $x$.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  interpretación de los ceros de la función como intersecciones con el eje x.
