semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.RESTRICCION_SIGNO
resumen_inicial: En problemas del mundo real se deben evaluar y descartar aquellas soluciones matemáticas que sean incompatibles
  con la naturaleza física o discreta del contexto.
explicacion_simple: 'En ocasiones, la manipulación algebraica nos entrega una solución numérica impecable en el papel (como
  un número negativo o una fracción decimal), pero que resulta físicamente imposible en la realidad.


  Por ejemplo, en un contexto real no existen cantidades negativas de objetos o personas ($-5$ estudiantes), ni tiempos negativos,
  ni tampoco es posible fraccionar elementos indivisibles (como $3{,}7$ automóviles).


  Al modelar problemas aplicados, es obligatorio pasar la solución algebraica por un filtro de compatibilidad contextual y
  descartar respuestas incoherentes con el mundo real.


  ![Exclusión de soluciones incompatibles](/static/img/nodos/exclusion-de-soluciones-incompatibles-con-el-contexto-intro.svg)

  '
explicacion_formal: '### Definición formal

  Sea la ecuación $A(x) = B(x)$ aplicada a un problema verbal con **dominio práctico o contexto de pertenencia** $\Omega \subset
  \mathbb{R}$. La solución real válida $x_{\text{válida}}$ satisface:


  $$x_{\text{válida}} \in S \cap \Omega \quad \text{donde } S = \{c \in \mathbb{R} \mid A(c) = B(c)\}$$


  ### Filtros de compatibilidad contextual usuales

  - **No-negatividad o positividad estricta** (edades, dimensiones métricas, precios, tiempo): $\Omega = \mathbb{R}^+ \cup
  \{0\} \implies x \ge 0$.

  - **Dominio discreto entero** (conteo de personas, animales, objetos indivisibles): $\Omega = \mathbb{N}_0 \implies x \in
  \{0, 1, 2, 3, \dots\}$.


  ### Síntesis didáctica

  Si la única raíz algebraica $c$ no pertenece al dominio contextual $\Omega$, la ecuación no posee solución realizable en
  el problema aplicado.

  '
definiciones_clave: '- **Incompatibilidad contextual**: Situación donde una solución algebraica numéricamente correcta carece
  de significado práctico o viabilidad física.

  - **Dominio de validez contextual ($\Omega$)**: Conjunto de valores numéricos admisibles según la naturaleza física o económica
  del problema.

  '
propiedades_relaciones: '- **Descarte de soluciones incoherentes**: Si $x \notin \Omega$, se concluye formalmente que el problema
  no tiene solución físicamente posible.

  - **Prevalencia de la realidad sobre el cálculo**: Un cálculo algebraico correcto se supedita a las restricciones impuestas
  por las leyes del contexto.

  '
ejemplo_guiado:
  enunciado: Un fabricante calcula la cantidad $n$ de cajas de mercadería a empaquetar mediante la ecuación $4n + 15 = 3$.
    Resuelve para $n$, analiza su compatibilidad contextual y concluye.
  pasos:
  - 'Paso 1: Resolver la ecuación lineal: $4n = 3 - 15 \implies 4n = -12 \implies n = -3$.'
  - 'Paso 2: Evaluar la solución algebraica obtenida: $n = -3$.'
  - 'Paso 3: Aplicar el filtro de compatibilidad contextual: la cantidad $n$ de cajas es una variable discreta de conteo que
    debe ser entera no negativa ($n \in \mathbb{N}_0$).'
  - 'Paso 4: Concluir que la solución $n = -3$ es **incompatible con el contexto real** (no existen $-3$ cajas), declarando
    que el problema carece de solución realizable.'
  imagen: /static/img/nodos/exclusion-de-soluciones-incompatibles-con-el-contexto-ejemplos.svg
