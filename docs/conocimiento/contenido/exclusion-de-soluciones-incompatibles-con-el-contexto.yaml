semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.RESTRICCION_SIGNO
resumen_inicial: 'Exclusión de soluciones incompatibles con el contexto: propiedades,
  resolución y modelamiento en Modelamiento con ecuaciones lineales.'
explicacion_simple: 'Existen restricciones del mundo físico:'
explicacion_formal: '### Definición formal


  La solución algebraica $x=k$ de una ecuación que modela un problema solo es válida
  como respuesta si $k$ pertenece al dominio de valores admisibles según el contexto
  (por ejemplo, $\mathbb{N}$ para conteos de personas, o $\mathbb{R}^+$ para magnitudes
  físicas); si $k$ viola esa restricción, el problema no tiene solución en el contexto
  planteado.


  ### Desarrollo didáctico


  Existen restricciones del mundo físico:

  - El número de personas debe ser un número Natural (positivo y sin decimales).

  - Las edades deben ser positivas.

  - Las distancias deben ser positivas.


  Si tu resultado viola las leyes de la física o del sentido común, debes descartarlo
  inmediatamente e indicar que el problema no tiene solución o revisar tu planteamiento
  inicial.'
definiciones_clave: '- **Exclusión de soluciones incompatibles con el contexto**:
  Herramienta matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a exclusión de soluciones incompatibles con
  el contexto.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando exclusión de soluciones
    incompatibles con el contexto.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de exclusión de soluciones
    incompatibles con el contexto.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
