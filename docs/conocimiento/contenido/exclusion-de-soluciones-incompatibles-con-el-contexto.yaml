procedimiento:
- 'Paso 1: Resolver la ecuación lineal matemática para obtener la solución numérica $x = c$.'
- 'Paso 2: Definir el conjunto de restricciones del contexto ($\Omega$: no negativos, enteros, positivos).'
- 'Paso 3: Comparar si la solución obtenida $c$ pertenece al conjunto admisible $\Omega$.'
- 'Paso 4: Si $c \notin \Omega$, descartar la solución y redactar la conclusión de irrealizabilidad.'
errores_correccion: '- **Error 1:** Aceptar ciegamente un valor negativo o decimal en problemas sobre conteo de personas u
  objetos indivisibles. **Cómo corregirlo:** Evaluar siempre **SI LA CANTIDAD PUEDE EXISTIR FÍSICAMENTE EN EL MUNDO REAL ($n
  \ge 0, n \in \mathbb{Z}$)**.

  - **Error 2:** Cambiar arbitrariamente el signo negativo a positivo (decir "como dio $-3$, entonces la respuesta es $+3$").
  **Cómo corregirlo:** Si la ecuación produce un resultado negativo incompatible, **NO SE CAMBIA EL SIGNO DE FORMA ARBITRARIA;
  SE DECLARA QUE EL PROBLEMA NO TIENE SOLUCIÓN**.

  '
ejemplos:
- titulo: 'Ejemplo 1: Conteo de personas'
  enunciado: Si una ecuación sobre número de estudiantes entrega $x = 14{,}5$, ¿cómo se interpreta esta solución?
  alternativas:
  - La solución es incompatible pues el número de estudiantes debe ser un entero
  - Asisten 14 estudiantes y medio
  - Se redondea automáticamente a 15
  respuesta: La solución es incompatible pues el número de estudiantes debe ser un entero
  solucion_pasos:
  - 1. Las personas forman un conjunto discreto $x \in \mathbb{N}_0$.
  - 2. $14{,}5 \notin \mathbb{N}_0$, la solución es incompatible.
- titulo: 'Ejemplo 2: Edades negativas'
  enunciado: Al resolver un problema de edades se obtiene $x = -5\text{ años}$. ¿Qué indica este resultado?
  alternativas:
  - El problema está mal planteado o las condiciones son físicamente imposibles
  - La persona nació hace 5 años
  - La edad real es $+5\text{ años}$
  respuesta: El problema está mal planteado o las condiciones son físicamente imposibles
  solucion_pasos:
  - 1. La edad debe ser una cantidad positiva.
  - 2. $-5 < 0$ implica una situación físicamente imposible.
- titulo: Filtro de compatibilidad
  enunciado: ¿Toda solución numérica obtenida en un modelo lineal debe someterse a verificación de compatibilidad con la realidad?
  respuesta: Sí
  solucion_pasos:
  - Sí, valida si el número pertenece al dominio admisible.
- titulo: Fábrica de objetos
  enunciado: ¿Una cantidad de artículos producidos debe ser un entero no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, no se pueden producir objetos negativos ni fracciones de productos indivisibles.
errores_frecuentes:
- Aceptar soluciones algebraicas negativas en contextos físicos o discretos de conteo de objetos o personas.
- Invertir arbitrariamente el signo de una solución negativa para forzarla a ser positiva en lugar de declarar el problema
  irrealizable.
- Aceptar valores decimales o fraccionarios en problemas sobre conjuntos discretos de personas o animales.
- Concluir que una persona tiene edad positiva tras obtener algebraicamente una raíz negativa.
- Asumir que todo problema verbal modelado matemáticamente tiene obligatoriamente una solución física admisible.
afirmaciones_verdaderas:
- Las soluciones matemáticas obtenidas en un modelamiento deben ser compatibles con las restricciones físicas del contexto
  real.
- Si una solución numérica viola las restricciones del dominio contextual, debe descartarse declarando que el problema no
  tiene solución aplicable.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/exclusion-de-soluciones-incompatibles-con-el-contexto-resumen.svg)


  QUÉ: Evaluar y descartar soluciones algebraicas incompatibles con el contexto en ecuaciones lineales.

  CÓMO: Definir las restricciones del dominio real ($\Omega$: enteros no negativos, positivos), verificar la pertenencia de
  la solución numérica a dicho dominio y redactar la conclusión contextual correspondiente.

  '
