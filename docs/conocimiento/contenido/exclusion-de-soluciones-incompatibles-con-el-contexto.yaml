errores_frecuentes:
- 'Puede omitirse esta condición sin cambiar el resultado: «Obtén el resultado matemático».'
- 'Es válido invertir el orden y dejar para el final esta acción: «Analiza qué entidad
  física representa (personas, tiempo, dinero, edad)».'
- La definición sigue cumpliéndose aunque no se considere que las matemáticas son
  ciegas al mundo real. Si tú planteas una ecuación para averiguar cuántas personas
