semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.RESTRICCION_SIGNO
resumen_inicial: En problemas del mundo real se deben descartar las soluciones matemáticas
  que sean incompatibles con la naturaleza física o discreta del contexto.
explicacion_simple: 'A veces las matemáticas nos dan un resultado que es impecable
  en el papel (como un número negativo o una fracción decimal), pero que no tiene
  sentido en el mundo real.

  Por ejemplo, no podemos tener una cantidad negativa de personas ($-5$ alumnos),
  ni un tiempo negativo, ni fraccionar objetos indivisibles (como $3{,}7$ personas).

  Cuando modelamos problemas reales, debemos verificar que la solución matemática
  sea compatible con la realidad física del problema.'
explicacion_formal: 'Sea el modelo lineal $A(x) = B(x)$ aplicado a un problema contextual
  con **dominio físico / continuo / discreto** $\Omega \subset \mathbb{R}$. La solución
  válida $x_{\text{val}}$ satisface:


  $$x_{\text{val}} \in S \cap \Omega$$


  **Filtros de compatibilidad contextual usuales:**

  - **Non-negatividad estricta** (edades, distancias, precios, objetos): $\Omega =
  \mathbb{R}^+ \cup \{0\} \implies x \ge 0$.

  - **Carácter discreto entero** (personas, animales, artículos indivisibles): $\Omega
  = \mathbb{N}_0 \implies x \in \mathbb{Z}^+$.'
definiciones_clave: '- **Incompatibilidad contextual**: Situación donde una solución
  matemática matemáticamente correcta carece de sentido en la realidad del problema.

  - **Dominio físico / práctico ($\Omega$)**: Conjunto de valores numéricos que son
  físicamente posibles dentro del contexto del problema.'
propiedades_relaciones: '- **Descarte de raíz incompatible**: Si el único valor de
  $x$ obtenido al resolver la ecuación no pertenece a $\Omega$, el problema real no
  tiene solución en la práctica.'
ejemplo_guiado:
  enunciado: Un fabricante calcula la cantidad $n$ de cajas de mercadería que puede
    empaquetar mediante la ecuación $4n + 15 = 3$. Resuelve para $n$, analiza la compatibilidad
    del resultado con el contexto de conteo de cajas y concluye.
  pasos:
  - 'Paso 1: Resolver la ecuación lineal: $4n = 3 - 15 \implies 4n = -12 \implies
    n = -3$.Paso 2: Analizar la solución matemática $n = -3$.Paso 3: Aplicar el filtro
    de compatibilidad contextual: la cantidad $n$ de cajas es una magnitud de conteo
    discreta que debe ser un entero positivo ($n \in \mathbb{N}_0$).Paso 4: Concluir
    que la solución $n = -3$ es **incompatible con el contexto real** (no existen
    $-3$ cajas), por lo que el problema no tiene solución físicamente posible.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué debe descartarse una solución matemática como $n = -3$ en un
    problema sobre conteo de objetos físicos?
  choices:
  - text: Porque no es posible tener un número negativo de objetos físicos o discretos.
    is_correct: true
  - text: Porque el número 3 es un número primo.
    is_correct: false
  - text: Porque las ecuaciones de primer grado prohíben las soluciones negativas.
    is_correct: false
  - text: Porque la ecuación no se pudo despejar.
    is_correct: false
  explanation: La alternativa correcta es 'Porque no es posible tener un número negativo
    de objetos físicos o discretos.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al descartar $n = -3$ por incompatibilidad con el contexto de empaquetado,
    ¿cuál es la conclusión real del problema?
  choices:
  - text: El problema no tiene solución físicamente realizable.
    is_correct: true
  - text: La solución real es $n = +3$ cajas.
    is_correct: false
  - text: La solución es empaquetar 0 cajas.
    is_correct: false
  - text: Se pueden empaquetar 12 cajas.
    is_correct: false
  explanation: La alternativa correcta es 'El problema no tiene solución físicamente
    realizable.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver la ecuación lineal matemática y obtener la solución numérica $x
  = c$.'
- 'Paso 2: Identificar las restricciones de la realidad del problema (¿puede ser negativo?,
  ¿puede ser decimal?).'
- 'Paso 3: Verificar si el número $c$ cumple con la naturaleza del contexto.'
- 'Paso 4: Si $c$ es incompatible, descartarlo y declarar que el problema no tiene
  solución en la práctica.'
errores_correccion: '- **Error común:** Aceptar automáticamente un resultado negativo
  o decimal en problemas sobre conteo de personas u objetos indivisibles.

  - **Cómo corregirlo:** Pregúntate siempre: ''¿Tiene sentido este resultado en el
  mundo real?''. Si la respuesta es no, descarta la solución.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El primer paso para resolver un problema verbal es definir la incógnita?
  respuesta: Sí
  solucion_pasos:
  - Sí, declarar la variable $x$ es indispensable.
- titulo: ¿Pueden existir soluciones matemáticas que se descarten por ser incompatibles
    con el contexto real?
  respuesta: Sí
  solucion_pasos:
  - Sí, como edades o cantidades de objetos negativas.
errores_frecuentes:
- Operar números del enunciado al azar sin definir la incógnita $x$.
- Olvidar los paréntesis al traducir frases como 'el triple de un número aumentado
  en 5'.
- Dar por terminado el problema al despejar $x$ sin responder la pregunta específica
  del enunciado.
- Omitir las unidades de medida en la respuesta final del problema.
- Aceptar soluciones negativas o decimales incompatibles con la realidad física del
  contexto.
afirmaciones_verdaderas:
- El modelamiento lineal traduce relaciones del lenguaje verbal a una ecuación de
  primer grado.
- Las soluciones obtenidas al modelar deben ser verificadas frente a las restricciones
  físicas del contexto real.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar la incógnita,
  plantear, resolver e interpretar problemas contextualizados mediante ecuaciones
  lineales.
