procedimiento:
- Obtén el resultado matemático.
- Analiza qué entidad física representa (personas, tiempo, dinero, edad).
- Evalúa si el número (su signo y si es decimal) tiene sentido lógico.
- Si es absurdo, descarta la solución.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en exclusión de soluciones incompatibles con el contexto.
ejemplos:
- titulo: $x = -4.5$
  enunciado: Justifica el procedimiento adecuado para el caso $x = -4.5$.
  solucion_pasos:
  - Las matemáticas son ciegas al mundo real. Si tú planteas una ecuación para averiguar
    cuántas personas asistieron a una fiesta y el álgebra te dice que $x = -4.5$,
    el álgebra no se equivocó, tú planteaste mal el problema (o el problema no tiene
    solución lógica).
  - Obtén el resultado matemático.
- titulo: $x = -4.5$
  enunciado: Determina qué debe hacerse en $x = -4.5$ y fundamenta cada transformación.
  solucion_pasos:
  - Las matemáticas son ciegas al mundo real. Si tú planteas una ecuación para averiguar
    cuántas personas asistieron a una fiesta y el álgebra te dice que $x = -4.5$,
    el álgebra no se equivocó, tú planteaste mal el problema (o el problema no tiene
    solución lógica).
  - Analiza qué entidad física representa (personas, tiempo, dinero, edad).
- titulo: 'Respecto de «Exclusión de soluciones incompatibles con el contexto»: ¿La
    siguiente formulaci'
  enunciado: 'Respecto de «Exclusión de soluciones incompatibles con el contexto»:
    ¿La siguiente formulación es correcta? «Las matemáticas son ciegas al mundo real»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Las matemáticas son ciegas al
    mundo real.'
- titulo: 'Respecto de «Exclusión de soluciones incompatibles con el contexto»: ¿La
    siguiente conclusió'
  enunciado: 'Respecto de «Exclusión de soluciones incompatibles con el contexto»:
    ¿La siguiente conclusión es correcta? «Puede omitirse esta condición sin cambiar
    el resultado: «Obtén el resultado matemático»»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Las matemáticas son ciegas al
