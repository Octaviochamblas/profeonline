semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.DEFINICION
resumen_inicial: Un sistema de inecuaciones lineales con una incógnita es un conjunto de dos o más inecuaciones que deben cumplirse simultáneamente.
explicacion_simple: '![Definición de sistema de inecuaciones lineales con una incógnita](/static/img/nodos/definicion-de-sistema-de-inecuaciones-lineales-con-una-incognita-intro.svg)


  Un **sistema de inecuaciones** consiste en dos o más desigualdades que comparten la misma variable (por ejemplo $x > 2$ y $x \le 7$).


  Resolver el sistema significa encontrar los valores de $x$ que hacen verdaderas a **TODAS** las inecuaciones al mismo tiempo.


  Por ello, la solución final es la **intersección** (la parte donde se cruzan o solapan) de las soluciones individuales.'
explicacion_formal: 'Un **sistema de $m$ inecuaciones lineales** con una incógnita $x \in \mathbb{R}$ se representa como:


  $$\begin{cases} a_1 x + b_1 \ R_1 \ 0 \\ a_2 x + b_2 \ R_2 \ 0 \\ \vdots \\ a_m x + b_m \ R_m \ 0 \end{cases} \quad \text{con } R_i \in \{<, >, \le, \ge\}$$


  **Desglose de la fórmula:**

  - Conjunto solución global $S = S_1 \cap S_2 \cap \dots \cap S_m$, donde $S_i$ es la solución de la $i$-ésima inecuación.

  '
definiciones_clave: '- **Sistema de inecuaciones lineales**: Conjunto de desigualdades con la misma variable que deben satisfacerse en simultáneo.

  - **Intersección de soluciones ($S_1 \cap S_2$)**: Conjunto formado por los elementos comunes que satisfacen todas las desigualdades del sistema.

  '
propiedades_relaciones: '- **Exigencia simultánea**: Un número solo es solución del sistema si pertenece al conjunto solución de CADA UNA de las inecuaciones.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Definición de sistema de inecuaciones lineales con una incógnita](/static/img/nodos/definicion-de-sistema-de-inecuaciones-lineales-con-una-incognita-ejemplos.svg)


    Verifica si el número $x = 4$ es solución del sistema de inecuaciones formado por $\begin{cases} x + 3 > 5 \\ 2x \le 10 \end{cases}$.'
  pasos:
  - 'Paso 1: Evaluar $x = 4$ en la primera inecuación: $4 + 3 = 7 > 5$ (VERDADERO $\implies 4 \in S_1$).'
  - 'Paso 2: Evaluar $x = 4$ en la segunda inecuación: $2(4) = 8 \le 10$ (VERDADERO $\implies 4 \in S_2$).'
  - 'Paso 3: Comprobar la simultaneidad: $x = 4$ satisface ambas inecuaciones.'
  - 'Paso 4: Concluir que $x = 4$ es una solución válida del sistema ($4 \in S_1 \cap S_2$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define formalmente el conjunto solución global $S$ de un sistema de inecuaciones?
  choices:
  - text: Como la intersección de los conjuntos solución individuales ($S = S_1 \cap S_2$).
    is_correct: true
  - text: Como la unión de todos los conjuntos solución ($S = S_1 \cup S_2$).
    is_correct: false
  - text: Como la suma de los valores límites.
    is_correct: false
  - text: Como la resta $S = S_1 - S_2$.
    is_correct: false
  explanation: La alternativa correcta es 'Como la intersección de los conjuntos solución individuales ($S = S_1 \cap S_2$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comprobar $x = 4$ en el sistema $\begin{cases} x + 3 > 5 \\ 2x \le 10 \end{cases}$, ¿por qué $4$ pertenece a la solución del sistema?
  choices:
  - text: Porque satisface simultáneamente ambas inecuaciones.
    is_correct: true
  - text: Porque satisface solo a la primera inecuación.
    is_correct: false
  - text: Porque es un número par.
    is_correct: false
  - text: Porque es mayor que 10.
    is_correct: false
  explanation: La alternativa correcta es 'Porque satisface simultáneamente ambas inecuaciones.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las inecuaciones individuales que conforman el sistema.'
- 'Paso 2: Evaluar la variable candidato en la primera inecuación.'
- 'Paso 3: Evaluar la variable candidato en la segunda inecuación.'
- 'Paso 4: Confirmar la validez solo si ambas evaluaciones resultan verdaderas.'
errores_correccion: '- **Error común:** Creer que basta con que un número cumpla una sola de las inecuaciones para ser solución del sistema.

  - **Cómo corregirlo:** En un sistema de inecuaciones, el número DEBE cumplir TODAS las inecuaciones a la vez (intersección $\cap$).

  '
ejemplos:
- titulo: 'Ejemplo 1: Identificación de sistema 1D'
  enunciado: ¿Cuál de las siguientes estructuras representa un sistema de inecuaciones lineales con una incógnita?
  alternativas:
  - $2x + 1 > 5$ y $x - 3 \leq 4$
  - $x + y > 5$ y $x - y < 2$
  - $x^2 - 1 > 0$ y $x + 2 < 3$
  - $2x + 3 = 7$ y $x - 1 = 2$
  respuesta: $2x + 1 > 5$ y $x - 3 \leq 4$
  solucion_pasos:
  - 'Paso 1: Ambas inecuaciones son lineales y contienen solo la variable $x$.'
  - 'Paso 2: La opción correcta es $2x + 1 > 5$ y $x - 3 \le 4$.'
- titulo: 'Ejemplo 2: Condición de simultaneidad'
  enunciado: Para que un número sea solución del sistema $x > 2$ y $x < 8$, ¿qué condición debe cumplir?
  alternativas:
  - Debe satisfacer ambas inecuaciones simultáneamente ($2 < x < 8$)
  - Basta con que cumpla cualquiera de las dos
  - Solo debe cumplir la primera
  - Ninguna de las anteriores
  respuesta: Debe satisfacer ambas inecuaciones simultáneamente ($2 < x < 8$)
  solucion_pasos:
  - 'Paso 1: Un sistema exige cumplimiento simultáneo (intersección).'
  - 'Paso 2: La solución es $]2, 8[$.'
- titulo: 'Ejemplo 3: Pertenencia al sistema'
  enunciado: ¿Es $x = 4$ solución del sistema $x \geq 0$ y $x \leq 5$?
  alternativas:
  - Sí, porque $4 \geq 0$ y $4 \leq 5$ son ambas verdaderas
  - No, solo cumple una
  - No, no pertenece a los extremos
  - Depende de la recta real
  respuesta: Sí, porque $4 \geq 0$ y $4 \leq 5$ son ambas verdaderas
  solucion_pasos:
  - 'Paso 1: Evaluar $4 \ge 0$ (V) y $4 \le 5$ (V).'
  - 'Paso 2: Como ambas se cumplen, $4 \in S$.'
- titulo: 'Ejemplo 4: Operación entre conjuntos'
  enunciado: ¿Qué operación conjuntista define la solución global $S$ de un sistema a partir de $S_1$ y $S_2$?
  alternativas:
  - $S = S_1 \cap S_2$ (Intersección)
  - $S = S_1 \cup S_2$ (Unión)
  - $S = S_1 \setminus S_2$ (Diferencia)
  - $S = S_1 \times S_2$ (Producto)
  respuesta: $S = S_1 \cap S_2$ (Intersección)
  solucion_pasos:
  - 'Paso 1: La simultaneidad lógica $\land$ equivale a la intersección de conjuntos $\cap$.'
  - 'Paso 2: $S = S_1 \cap S_2$.'
errores_frecuentes:
- Un sistema de inecuaciones lineales exige satisfacer al menos una de sus inecuaciones (operador unión $\cup$) para ser verdadero.
- El conjunto solución de un sistema de inecuaciones es la suma de los límites de cada desigualdad por separado.
- Un sistema de inecuaciones lineales con una incógnita solo puede tener soluciones si ambas desigualdades contienen el mismo operador de orden.
- Evaluar un número en un sistema exige probarlo en la primera inecuación y omitir su comprobación en las demás.
- Un sistema de dos inecuaciones lineales siempre genera dos intervalos inconexos independientes.
afirmaciones_verdaderas:
- Un sistema de inecuaciones lineales consta de dos o más inecuaciones que deben cumplirse simultáneamente en la misma incógnita.
- El conjunto solución global del sistema es la intersección ($S = S_1 \cap S_2$) de los conjuntos solución individuales.
al_terminar_debes_poder: '**QUÉ:** Definir e identificar un sistema de inecuaciones lineales con una incógnita.


  **CÓMO:** Reconociendo dos o más desigualdades en la misma variable $x$ cuya solución común exige la intersección de sus respectivos conjuntos ($S = S_1 \cap S_2$).


  ![Resumen Definición de sistema de inecuaciones lineales con una incógnita](/static/img/nodos/definicion-de-sistema-de-inecuaciones-lineales-con-una-incognita-resumen.svg)'
