semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.DEFINICION
resumen_inicial: 'Definición de sistema de inecuaciones lineales con una incógnita:
  relaciones de orden, intervalos y resolución en Sistemas de inecuaciones lineales
  con una incógnita.'
explicacion_simple: En muchas situaciones se deben cumplir simultáneamente varias
  condiciones o restricciones. Esto da origen a los sistemas de inecuaciones.
explicacion_formal: '### Definición formal

  Un sistema de inecuaciones lineales en una variable $x$ es un conjunto de dos o
  más inecuaciones, como $a_1 x + b_1 < 0$ y $a_2 x + b_2 \ge 0$. La solución del
  sistema es la intersección de los conjuntos solución de cada una de las inecuaciones
  individuales.


  ### Desarrollo didáctico

  Para resolver el sistema, se resuelve cada inecuación por separado y luego se busca
  la región de la recta numérica que satisfaga todas las condiciones al mismo tiempo.
  Es muy útil graficar cada conjunto solución en una recta para visualizar dónde se
  superponen. Si no hay intersección, el sistema no tiene solución.'
definiciones_clave: '- **Definición de sistema de inecuaciones lineales con una incógnita**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a definición de sistema de inecuaciones
  lineales con una incógnita.'
