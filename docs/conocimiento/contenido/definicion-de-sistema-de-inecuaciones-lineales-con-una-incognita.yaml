semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.DEFINICION
resumen_inicial: Un sistema de inecuaciones lineales con una incógnita es un conjunto
  de dos o más inecuaciones que deben cumplirse simultáneamente.
explicacion_simple: 'Un **sistema de inecuaciones** consiste en dos o más desigualdades
  que comparten la misma variable (por ejemplo $x > 2$ y $x \le 7$).

  Resolver el sistema significa encontrar los valores de $x$ que hacen verdaderas
  a **TODAS** las inecuaciones al mismo tiempo.

  Por ello, la solución final es la **intersección** (la parte donde se cruzan o solapan)
  de las soluciones individuales.'
explicacion_formal: 'Un **sistema de $m$ inecuaciones lineales** con una incógnita
  $x \in \mathbb{R}$ se representa como:


  $$\begin{cases} a_1 x + b_1 \ R_1 \ 0 \\ a_2 x + b_2 \ R_2 \ 0 \\ \vdots \\ a_m
  x + b_m \ R_m \ 0 \end{cases} \quad \text{con } R_i \in \{<, >, \le, \ge\}$$


  **Desglose de la fórmula:**

  - Conjunto solución global $S = S_1 \cap S_2 \cap \dots \cap S_m$, donde $S_i$ es
  la solución de la $i$-ésima inecuación.'
definiciones_clave: '- **Sistema de inecuaciones lineales**: Conjunto de desigualdades
  con la misma variable que deben satisfacerse en simultáneo.

  - **Intersección de soluciones ($S_1 \cap S_2$)**: Conjunto formado por los elementos
  comunes que satisfacen todas las desigualdades del sistema.'
propiedades_relaciones: '- **Exigencia simultánea**: Un número solo es solución del
  sistema si pertenece al conjunto solución de CADA UNA de las inecuaciones.'
ejemplo_guiado:
  enunciado: Verifica si el número $x = 4$ es solución del sistema de inecuaciones
    formado por $\begin{cases} x + 3 > 5 \\ 2x \le 10 \end{cases}$.
  pasos:
  - 'Paso 1: Evaluar $x = 4$ en la primera inecuación: $4 + 3 = 7 > 5$ (VERDADERO
    $\implies 4 \in S_1$).Paso 2: Evaluar $x = 4$ en la segunda inecuación: $2(4)
    = 8 \le 10$ (VERDADERO $\implies 4 \in S_2$).Paso 3: Comprobar la simultaneidad:
    $x = 4$ satisface ambas inecuaciones.Paso 4: Concluir que $x = 4$ es una solución
    válida del sistema ($4 \in S_1 \cap S_2$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define formalmente el conjunto solución global $S$ de un sistema
    de inecuaciones?
  choices:
  - text: Como la intersección de los conjuntos solución individuales ($S = S_1 \cap
      S_2$).
    is_correct: true
  - text: Como la unión de todos los conjuntos solución ($S = S_1 \cup S_2$).
    is_correct: false
  - text: Como la suma de los valores límites.
    is_correct: false
  - text: Como la resta $S = S_1 - S_2$.
    is_correct: false
  explanation: La alternativa correcta es 'Como la intersección de los conjuntos solución
    individuales ($S = S_1 \cap S_2$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comprobar $x = 4$ en el sistema $\begin{cases} x + 3 > 5 \\ 2x \le
    10 \end{cases}$, ¿por qué $4$ pertenece a la solución del sistema?
  choices:
  - text: Porque satisface simultáneamente ambas inecuaciones.
    is_correct: true
  - text: Porque satisface solo a la primera inecuación.
    is_correct: false
  - text: Porque es un número par.
    is_correct: false
  - text: Porque es mayor que 10.
    is_correct: false
  explanation: La alternativa correcta es 'Porque satisface simultáneamente ambas
    inecuaciones.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las inecuaciones individuales que conforman el sistema.'
- 'Paso 2: Evaluar la variable candidato en la primera inecuación.'
- 'Paso 3: Evaluar la variable candidato en la segunda inecuación.'
- 'Paso 4: Confirmar la validez solo si ambas evaluaciones resultan verdaderas.'
errores_correccion: '- **Error común:** Creer que basta con que un número cumpla una
  sola de las inecuaciones para ser solución del sistema.

  - **Cómo corregirlo:** En un sistema de inecuaciones, el número DEBE cumplir TODAS
  las inecuaciones a la vez (intersección $\cap$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de un sistema de inecuaciones requiere calcular la intersección
    de soluciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se exige la simultaneidad de todas las desigualdades.
- titulo: ¿Si dos intervalos no se cruzan en la recta numérica el sistema no tiene
    solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, la intersección es vacía ($S = \\emptyset$).
errores_frecuentes:
- Calcular la unión de intervalos en lugar de la intersección al resolver un sistema
  de inecuaciones.
- Intentar sumar o restar las inecuaciones del sistema como si fuera un sistema de
  ecuaciones lineales.
- Creer que basta con que un número cumpla una sola inecuación para ser solución del
  sistema.
- Olvidar invertir el símbolo al despejar coeficientes negativos dentro de alguna
  inecuación individual.
- Inventar un intervalo arbitrario cuando los sombreados de los intervalos van en
  direcciones opuestas sin cruzarse.
afirmaciones_verdaderas:
- La solución final de un sistema de inecuaciones lineales es la intersección de los
  conjuntos solución individuales de cada inecuación.
- Si las regiones de solución de las inecuaciones no tienen puntos comunes en la recta
  numérica, el sistema no tiene solución ($S = \mathbb{\emptyset}$).
al_terminar_debes_poder: Al finalizar este recurso podrás resolver sistemas de inecuaciones
  lineales con una incógnita, determinando su conjunto intersección en notación de
  intervalo y gráfica.
