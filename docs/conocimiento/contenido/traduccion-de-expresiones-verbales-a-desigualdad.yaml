semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.TRADUCCION_VERBAL
resumen_inicial: 'Traducción de expresiones verbales a desigualdad: relaciones de
  orden, intervalos y resolución en Relación de orden y símbolos de desigualdad.'
explicacion_simple: Muchos problemas del mundo real se enuncian con palabras y requieren
  ser transformados en lenguaje matemático.
explicacion_formal: '### Definición formal

  Sea un enunciado en lenguaje natural. Existe una asignación hacia las relaciones
  $\\mathcal{R} \\in \\{<, >, \\leq, \\geq\\}$ que modela matemáticamente la restricción.


  ### Desarrollo didáctico

  Identificar las palabras clave es el paso esencial para la correcta formulación
  del modelo algebraico sin pérdida de información.'
definiciones_clave: '- **Traducción de expresiones verbales a desigualdad**: Concepto
  fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a traducción de expresiones verbales a
  desigualdad.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de traducción de
    expresiones verbales a desigualdad.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de traducción de expresiones verbales a desigualdad,
    invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla de oro al multiplicar o dividir una desigualdad por
    un número negativo en traducción de expresiones verbales a desigualdad?
  choices:
  - text: Invertir el sentido de la desigualdad al multiplicar o dividir por un número
      negativo en relación de orden y símbolos de desigualdad
    is_correct: true
  - text: Mantener el mismo sentido de la desigualdad sin cambios
    is_correct: false
  - text: Cambiar la variable por cero
    is_correct: false
  - text: Transformar la inecuación en una igualdad exacta
    is_correct: false
  explanation: 'La alternativa correcta es: Invertir el sentido de la desigualdad
    al multiplicar o dividir por un número negativo en relación de orden y símbolos
    de desigualdad. Es la propiedad fundamental de orden en traducción de expresiones
    verbales a desigualdad.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver una inecuación y obtener su conjunto solución en traducción
    de expresiones verbales a desigualdad, ¿cómo se debe expresar el resultado?
  choices:
  - text: Representar el conjunto solución mediante notación de intervalo o gráficamente
      en la recta real
    is_correct: true
  - text: Como un único número aislado obligatoriamente
    is_correct: false
  - text: Igualando la variable a la constante
    is_correct: false
  - text: Eliminando los símbolos de desigualdad del resultado
    is_correct: false
  explanation: 'La alternativa correcta es: Representar el conjunto solución mediante
    notación de intervalo o gráficamente en la recta real. Forma estándar de representar
    conjuntos soluciones de inecuaciones.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Leer detenidamente el enunciado verbal.
- Subrayar las cantidades y las palabras clave de restricción.
- Asignar variables y escribir la desigualdad matemática correspondiente.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en traducción de expresiones
  verbales a desigualdad.
ejemplos:
- enunciado: Analizar la validez de la relación para $x = 3$ frente a $y = 2$.
  solucion_pasos:
  - Evaluar los valores asignados a cada variable.
  - Comparar los resultados obtenidos en el marco de la definición formal.
  titulo: Ejemplo de análisis 1 en el contexto de la relación matemática
- enunciado: Analizar la validez de la relación para $x = 4$ frente a $y = 4$.
  solucion_pasos:
  - Evaluar los valores asignados a cada variable.
  - Comparar los resultados obtenidos en el marco de la definición formal.
  titulo: Ejemplo de análisis 2 en el contexto de la relación matemática
- respuesta: Sí
  solucion_pasos:
  - Reemplazar el valor propuesto en la formulación.
  - Verificar la concordancia lógica positiva.
  titulo: ¿Cumple el número $5$ con la condición matemática descrita?
- respuesta: 'No'
  solucion_pasos:
  - Sustituir la cantidad constante en el modelo algebraico.
  - Demostrar que el valor no satisface la exigencia definida.
  titulo: ¿Cumple el número $-3$ con la condición matemática descrita?
errores_frecuentes:
- La expresión como máximo se traduce con el símbolo de mayor que.
- La expresión al menos se traduce con el símbolo de menor que.
- La palabra entre incluye siempre los extremos del intervalo.
- Traducir literalmente el orden de las palabras garantiza la desigualdad correcta.
- Una restricción verbal siempre resulta en una ecuación de igualdad.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  traducción de expresiones verbales a desigualdad.
fuente: Elaboración propia
