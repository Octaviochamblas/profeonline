semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.TRADUCCION_VERBAL
resumen_inicial: La traducción verbal a desigualdad convierte restricciones de lenguaje cotidiano a símbolos algebraicos de orden.
explicacion_simple: '![Traducción de expresiones verbales a desigualdad](/static/img/nodos/traduccion-de-expresiones-verbales-a-desigualdad-intro.svg)


  Para traducir frases en lenguaje verbal a desigualdades matemáticas, identificamos palabras clave de cota o límite:

  - ''es mayor que'' $\implies >$

  - ''es menor que'' $\implies <$

  - ''a lo sumo'', ''como máximo'', ''no supera'' $\implies \le$

  - ''al menos'', ''como mínimo'', ''no menor que'' $\implies \ge$'
explicacion_formal: 'El **diccionario de traducción de desigualdades** mapea enunciados verbales a desigualdades formales:


  $$\text{''A lo sumo } k\text{''} \iff x \le k$$

  $$\text{''Al menos } k\text{''} \iff x \ge k$$

  $$\text{''Supera a } k\text{''} \iff x > k$$

  $$\text{''No alcanza a } k\text{''} \iff x < k$$'
definiciones_clave: '- **Traducción verbal de desigualdades**: Conversión de expresiones lingüísticas de restricción a desigualdades algebraicas.

  - **Frases de cota**: Expresiones del idioma que fijan límites inclusivos o exclusivos en un problema contextual.'
propiedades_relaciones: '- **Importancia de la inclusión**: Distinguir si el valor límite $k$ está incluido ($\le, \ge$) o excluido ($<, >$) según el léxico utilizado.'
ejemplo_guiado:
  enunciado: '![Ejemplo Traducción de expresiones verbales a desigualdad](/static/img/nodos/traduccion-de-expresiones-verbales-a-desigualdad-ejemplos.svg)


    Traduce a desigualdad matemática la frase: ''Para aprobar una asignatura, la nota de un estudiante debe ser al menos un $4{,}0$ y como máximo un $7{,}0$''.'
  pasos:
  - 'Paso 1: Declarar la variable: sea $n = \text{nota del estudiante}$.Paso 2: Traducir ''al menos $4{,}0$'': $n \ge 4{,}0$.Paso 3: Traducir ''como máximo $7{,}0$'': $n \le 7{,}0$.Paso 4: Unir ambas restricciones en una desigualdad doble simultánea: $4{,}0 \le n \le 7{,}0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se traduce formalmente a desigualdad la expresión 'la masa $m$ debe ser como mínimo $50\text{ kg}$'?
  choices:
  - text: $m \ge 50$
    is_correct: true
  - text: $m \le 50$
    is_correct: false
  - text: $m > 50$
    is_correct: false
  - text: $m < 50$
    is_correct: false
  explanation: La alternativa correcta es '$m \ge 50$'. 'Como mínimo' significa que puede ser 50 o más.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al traducir 'la nota $n$ debe ser al menos $4{,}0$ y como máximo $7{,}0$', ¿cuál es la desigualdad simultánea obtenida?
  choices:
  - text: $4{,}0 \le n \le 7{,}0$
    is_correct: true
  - text: $4{,}0 < n < 7{,}0$
    is_correct: false
  - text: $n \ge 11{,}0$
    is_correct: false
  - text: $4{,}0 \ge n \ge 7{,}0$
    is_correct: false
  explanation: La alternativa correcta es '$4{,}0 \le n \le 7{,}0$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asignar una variable a la magnitud desconocida.'
- 'Paso 2: Identificar las palabras de cota en el texto (''al menos'', ''a lo sumo'', ''mayor que'').'
- 'Paso 3: Seleccionar el operador de orden correspondiente ($<, >, \le, \ge$).'
- 'Paso 4: Escribir la desigualdad individual o doble.'
errores_correccion: '- **Error común:** Traducir ''al menos 50'' como $x > 50$ en lugar de $x \ge 50$.

  - **Cómo corregirlo:** ''Al menos 50'' INCLUYE el número 50 como valor posible, por lo que exige el operador no estricto $\ge$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de orden.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de orden.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El conjunto de los números reales es un conjunto ordenado?
  respuesta: Sí
  solucion_pasos:
  - Sí, permite comparar cualquier par de números reales.
- titulo: ¿La frase 'a lo sumo' se traduce con el símbolo menor o igual que?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'a lo sumo' establece una cota superior inclusiva ($\le$).
errores_frecuentes:
- La expresión verbal "la masa debe ser al menos $50\text{ kg}$" se traduce algebraicamente mediante la desigualdad estricta $m > 50$.
- La frase verbal "a lo sumo $k$" se traduce algebraicamente como la relación mayor o igual $x \ge k$.
- La restricción "la nota debe ser como máximo $7{,}0$" exige el operador estricto mayor que $n > 7{,}0$.
- La expresión verbal "no supera los $20\text{ metros}$" excluye la posibilidad de que la medida sea exactamente igual a $20\text{ m}$.
- La traducción de "un número disminuido en 3 es menor que 10" se escribe como $3 - x < 10$.
afirmaciones_verdaderas:
- Las expresiones verbales "al menos" y "como mínimo" se traducen mediante desigualdades no estrictas del tipo $x \ge k$.
- Las expresiones "a lo sumo", "como máximo" y "no supera" se traducen mediante el símbolo no estricto $x \le k$.
al_terminar_debes_poder: '**QUÉ:** Traducir expresiones del lenguaje natural a relaciones de desigualdad algebraicas.


  **CÓMO:** Mapeando términos clave como «como mínimo / al menos» ($\ge$), «a lo más / como máximo» ($\le$) y «supera / excede» ($>$) a sus respectivos símbolos matemáticos.


  ![Resumen Traducción de expresiones verbales a desigualdad](/static/img/nodos/traduccion-de-expresiones-verbales-a-desigualdad-resumen.svg)'
