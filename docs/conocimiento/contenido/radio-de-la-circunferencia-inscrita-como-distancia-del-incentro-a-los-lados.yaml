semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.RADIO_INSCRITO_DISTANCIA_LADOS
resumen_inicial: El inradio ($r$) es la distancia perpendicular del incentro a los
  lados del triángulo. Se relaciona directamente con el área y el semiperímetro ($s$)
  mediante la fórmula fundamental $\text{Área} = r \cdot s$, de donde $r = \frac{\text{Área}}{s}$.
explicacion_simple: '![Inradio y Área](/static/img/nodos/radio-de-la-circunferencia-inscrita-como-distancia-del-incentro-a-los-lados-intro.svg)


  Si unes el incentro $I$ con los 3 vértices del triángulo, la figura se divide en
  3 triángulos más pequeños:


  - **Cada triángulo pequeño tiene altura $r$**: La base de cada uno es un lado ($a,
  b, c$) y la altura de los tres es el mismo inradio $r$.

  - **Suma de áreas**: El área total es la suma de las 3 áreas: $\frac{a \cdot r}{2}
  + \frac{b \cdot r}{2} + \frac{c \cdot r}{2} = r \cdot \left(\frac{a+b+c}{2}\right)
  = r \cdot s$.

  - **Para encontrar el radio $r$**: Simplemente divides el área total entre el semiperímetro:
  $r = \frac{\text{Área}}{s}$.

  '
explicacion_formal: '### Definición formal y fórmula del inradio

  El **inradio** ($r$) es la longitud del segmento perpendicular trazado desde el
  incentro $I$ hacia cualquiera de los tres lados del triángulo:


  $$r = \frac{A}{s} = \frac{2 \operatorname{Área}(\Delta ABC)}{a + b + c}$$


  $$A = \frac{1}{2}ar + \frac{1}{2}br + \frac{1}{2}cr = r \cdot \left(\frac{a+b+c}{2}\right)$$


  ### Desglose simbólico y geométrico

  - Descomposición en 3 subtriángulos: $\Delta IBC, \Delta IAC, \Delta IAB$, cada
  uno con base en un lado y altura común $r$.

  - Suma de áreas: $\operatorname{Área}(\Delta ABC) = A_1 + A_2 + A_3 = r \cdot s$.


  ### Síntesis didáctica

  La relación $A = r \cdot s$ es una fórmula geométrica fundamental que permite calcular
  el radio inscrito conociendo el área y los lados del triángulo.'
definiciones_clave: '- **Inradio ($r$)**: Radio de la circunferencia inscrita y distancia
  del incentro a los lados.

  - **Semiperímetro ($s$)**: Semisuma de las longitudes de los lados de un polígono
  ($s = \frac{a+b+c}{2}$).

  - **Fórmula $A = r \cdot s$**: Relación geométrica fundamental entre área, inradio
  y semiperímetro.

  '
propiedades_relaciones: '- **Fórmula de área**: $\text{Área} = r \cdot s$.

  - **Cálculo de inradio**: $r = \frac{\text{Área}}{s}$.

  - **Fórmula de Herón combinada**: $r = \sqrt{\frac{(s-a)(s-b)(s-c)}{s}}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Inradio y Área](/static/img/nodos/radio-de-la-circunferencia-inscrita-como-distancia-del-incentro-a-los-lados-ejemplos.svg)


    Un triángulo tiene un área de $60\text{ cm}^2$ y sus lados miden $10\text{ cm}$,
    $10\text{ cm}$ y $12\text{ cm}$. Calcula el semiperímetro $s$ del triángulo y
    la longitud del radio de su circunferencia inscrita ($r$).

    '
  pasos:
  - 'Paso 1: Calcular el semiperímetro $s$: $s = \frac{a + b + c}{2} = \frac{10 +
    10 + 12}{2} = \frac{32}{2} = 16\text{ cm}$.'
  - 'Paso 2: Aplicar la relación $r = \frac{\text{Área}}{s}$.'
  - 'Paso 3: Sustituir los valores dados: $r = \frac{60\text{ cm}^2}{16\text{ cm}}
    = 3.75\text{ cm} = \frac{15}{4}\text{ cm}$.'
  - 'Paso 4: Concluir que el radio inscrito mide $3.75\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula que relaciona el área de un triángulo con su inradio
    r y su semiperímetro s?
  choices:
  - text: $\text{Área} = r \cdot s$
    is_correct: true
  - text: $\text{Área} = \frac{r}{s}$
    is_correct: false
  - text: $\text{Área} = 2 \cdot r \cdot s$
    is_correct: false
  - text: $\text{Área} = r + s$
    is_correct: false
  explanation: La relación correcta es $\text{Área} = r \cdot s$, de donde se despeja
    el inradio como $r = \text{Área} / s$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo tiene un área de 36 cm² y un semiperímetro de 12 cm, ¿cuánto
    mide su inradio r?
  choices:
  - text: $3\text{ cm}$
    is_correct: true
  - text: $6\text{ cm}$
    is_correct: false
  - text: $4\text{ cm}$
    is_correct: false
  - text: $12\text{ cm}$
    is_correct: false
  explanation: El inradio mide $3\text{ cm}$, pues $r = \frac{\text{Área}}{s} = \frac{36}{12}
    = 3\text{ cm}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el semiperímetro sumando los lados y dividiendo por 2: $s = \frac{a+b+c}{2}$.'
- 'Paso 2: Determinar el área total del triángulo (por base y altura, Herón o fórmula
  conocida).'
- 'Paso 3: Dividir el área por el semiperímetro: $r = \frac{\text{Área}}{s}$.'
- 'Paso 4: Expresar el resultado con las unidades de longitud correspondientes.'
errores_correccion: Asegúrate de dividir por el semiperímetro (s) y no por el perímetro
  completo (P).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Un triángulo tiene perímetro $30\text{ cm}$ y área $45\text{ cm}^2$.
    ¿Cuánto mide el radio de su circunferencia inscrita?
  alternativas:
  - $3\text{ cm}$
  - $1.5\text{ cm}$
  - $6\text{ cm}$
  respuesta: $3\text{ cm}$
  solucion_pasos:
  - Semiperímetro $s = \frac{30}{2} = 15\text{ cm}$.
  - 'Inradio: $r = \frac{\text{Área}}{s} = \frac{45}{15} = 3\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: Si un triángulo equilátero tiene lado $6\text{ cm}$ y área $9\sqrt{3}\text{
    cm}^2$, ¿cuál es su inradio $r$?
  alternativas:
  - $\sqrt{3}\text{ cm}$
  - $3\sqrt{3}\text{ cm}$
  - $2\sqrt{3}\text{ cm}$
  respuesta: $\sqrt{3}\text{ cm}$
  solucion_pasos:
  - Semiperímetro $s = \frac{6 + 6 + 6}{2} = 9\text{ cm}$.
  - 'Inradio: $r = \frac{9\sqrt{3}}{9} = \sqrt{3}\text{ cm}$.'
- titulo: ¿El área de cualquier triángulo es igual al producto de su inradio por su
    semiperímetro?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\text{Área} = r \cdot s$ es un teorema fundamental aplicable a todo triángulo.
- titulo: ¿Para calcular el inradio r se divide el área entre el perímetro completo?
  respuesta: 'No'
  solucion_pasos:
  - No, se divide entre el semiperímetro $s = \frac{a+b+c}{2}$ (la mitad del perímetro).
errores_frecuentes:
- Dividir el área por el perímetro en vez del semiperímetro.
- Confundir el inradio $r$ con el circunradio $R$.
- Olvidar que las unidades del inradio son lineales ($\text{cm}$ y no $\text{cm}^2$).
- Asumir que la fórmula solo aplica a triángulos rectángulos (aplica a todos).
- Equivocar el cálculo del semiperímetro al sumar los lados.
afirmaciones_verdaderas:
- 'El área de todo triángulo es igual al producto de su inradio por su semiperímetro:
  $\text{Área} = r \cdot s$.'
- El inradio es la altura común de los tres triángulos interiores formados al unir
  el incentro con los vértices.
al_terminar_debes_poder: '**QUÉ:** Calcular y aplicar la relación entre el inradio,
  el área y el semiperímetro de un triángulo.


  **CÓMO:** Calculando el semiperímetro $s = \frac{a+b+c}{2}$ y despejando el inradio
  mediante $r = \frac{\text{Área}}{s}$.


  ![Resumen de Inradio y Área](/static/img/nodos/radio-de-la-circunferencia-inscrita-como-distancia-del-incentro-a-los-lados-resumen.svg)

  '
