semantic_id: MAT.ALG.FUNCION_REPRESENTACION.GRAFICA_PLANO_CARTESIANO
resumen_inicial: La representación gráfica en el plano cartesiano dibuja la curva
  continua o discreta formada por todos los puntos $(x, f(x))$.
explicacion_simple: 'Para graficar una función en el **plano cartesiano**:

  1. Construimos una tabla de valores con varios puntos $(x, y)$.

  2. Marcamos cada punto $(x, y)$ ubicando $x$ en el eje horizontal y su altura $y$
  en el eje vertical.

  3. Unimos los puntos marcados con una línea suave o curva continua.

  Ese trazo es la gráfica oficial de la función.'
explicacion_formal: 'La **gráfica cartesiana de una función** $f$ es el lugar geométrico
  $G(f)$ en el plano real $\mathbb{R}^2$:


  $$G(f) = \{(x, y) \in \mathbb{R}^2 \mid x \in \operatorname{Dom}(f) \quad \land
  \quad y = f(x)\}$$


  **Desglose de la fórmula:**

  - Proyección de infinitos pares ordenados en el sistema de ejes perpendiculares
  $X-Y$.'
definiciones_clave: '- **Gráfica de una función ($G(f)$)**: Conjunto de puntos $(x,
  y)$ en el plano cartesiano que satisfacen la ecuación $y = f(x)$.'
propiedades_relaciones: '- **Criterio de continuidad**: Las funciones polinómicas
  generan trazados continuos sin saltos ni interrupciones en el plano.'
ejemplo_guiado:
  enunciado: Grafica la función lineal $f(x) = 2x - 1$ obteniendo tres puntos de apoyo.
  pasos:
  - 'Paso 1: Calcular tres puntos: $x = 0 \implies (0, -1)$, $x = 1 \implies (1, 1)$,
    $x = 2 \implies (2, 3)$.Paso 2: Ubicar los puntos $(0, -1)$, $(1, 1)$ y $(2, 3)$
    en el plano $X-Y$.Paso 3: Trazar una línea recta continua que pase por los tres
    puntos.Paso 4: Concluir que la recta dibujada es la representación gráfica de
    $f(x) = 2x - 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al ubicar la función $f(x) = 2x - 1$ en el plano cartesiano, ¿por qué
    puntos pasa su gráfica?
  choices:
  - text: Por los puntos $(0, -1)$, $(1, 1)$ y $(2, 3)$.
    is_correct: true
  - text: Por los puntos $(0, 2)$, $(1, 2)$ y $(2, 2)$.
    is_correct: false
  - text: Por los puntos $(1, 0)$, $(2, 0)$ y $(3, 0)$.
    is_correct: false
  - text: Únicamente por el origen $(0,0)$.
    is_correct: false
  explanation: La alternativa correcta es 'Por los puntos $(0, -1)$, $(1, 1)$ y $(2,
    3)$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el plano cartesiano, ¿qué coordenadas tiene el punto donde la gráfica
    de $f(x) = 2x - 1$ corta al eje Y?
  choices:
  - text: $(0, -1)$
    is_correct: true
  - text: $(-1, 0)$
    is_correct: false
  - text: $(2, 0)$
    is_correct: false
  - text: $(1, 1)$
    is_correct: false
  explanation: La alternativa correcta es '$(0, -1)$'. (Para $x = 0$, $y = f(0) =
    -1$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar los ejes perpendiculares $X$ e $Y$ escalados.'
- 'Paso 2: Obtener una tabla con al menos $3$ puntos $(x, y)$.'
- 'Paso 3: Marcar los puntos en el plano.'
- 'Paso 4: Unir los puntos con la línea correspondiente a la familia de la función.'
errores_correccion: '- **Error común:** Graficar invirtiendo los ejes (poner la $x$
  en el eje vertical y la $y$ en el horizontal).

  - **Cómo corregirlo:** La variable independiente $x$ va SIEMPRE en el eje horizontal
  y la $y$ en el eje vertical.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de representación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de representación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El criterio de la línea vertical sirve para identificar si un gráfico representa
    a una función?
  respuesta: Sí
  solucion_pasos:
  - Sí, si ninguna recta vertical corta al gráfico en más de un punto, es función.
- titulo: ¿El dominio de una función se lee sobre el eje horizontal X en su gráfica?
  respuesta: Sí
  solucion_pasos:
  - Sí, el dominio es el ancho continuo proyectado en el eje X.
errores_frecuentes:
- Invertir el orden de las componentes en los pares ordenados escribiendo $(y, x)$
  en vez de $(x, y)$.
- Trazar las flechas en un diagrama sagital en sentido contrario, del codominio al
  dominio.
- Confundir el criterio de la línea vertical (usado para probar funciones) con el
  de la línea horizontal (usado para inyectividad).
- Leer los valores del eje vertical $Y$ para determinar el dominio o los del eje $X$
  para hallar el recorrido.
- Usar la coordenada $x$ de un vértice en lugar de la coordenada $y$ para determinar
  el mínimo del recorrido en una gráfica.
afirmaciones_verdaderas:
- Una relación representada gráficamente es una función si y solo si cualquier línea
  vertical corta a su gráfico a lo sumo en un punto.
- El dominio se determina en el gráfico proyectando el trazo sobre el eje horizontal
  $X$, mientras que el recorrido se obtiene proyectándolo sobre el eje vertical $Y$.
al_terminar_debes_poder: Al finalizar este recurso podrás representar funciones mediante
  tablas, pares ordenados, diagramas sagitales y gráficos en el plano cartesiano,
  identificando dominio y recorrido.
fuente: Texto escolar MINEDUC — Álgebra / Representación de Funciones
estado: publicado
