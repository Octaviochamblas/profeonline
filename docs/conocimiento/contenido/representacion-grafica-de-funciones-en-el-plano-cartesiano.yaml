semantic_id: MAT.ALG.FUNCION_REPRESENTACION.GRAFICA_PLANO_CARTESIANO
resumen_inicial: La representación gráfica muestra visualmente el comportamiento continuo o discreto de una función sobre el plano cartesiano.
explicacion_simple: |
  El **plano cartesiano** tiene dos ejes perpendiculares:
  - El **eje horizontal $X$** (eje de las abscisas): Representa los valores de entrada $x$.
  - El **eje vertical $Y$** (eje de las ordenadas): Representa los resultados de salida $y = f(x)$.

  Graficar una función es ubicar todos sus pares $(x, y)$ como puntos en el plano y unirlos para formar una línea o curva que describe la función.
explicacion_formal: |
  Dada una función $f: D \subseteq \mathbb{R} \to \mathbb{R}$, la **gráfica de la función** es el subconjunto del producto cartesiano $\mathbb{R}^2$ definido por:

  $$\text{Graf}(f) = \{(x, y) \in \mathbb{R}^2 \mid x \in D, \ y = f(x)\}$$

  **Desglose de ejes:**
  - Eje $X$: Conjunto dominio $\text{Dom}(f)$.
  - Eje $Y$: Conjunto recorrido $\text{Rec}(f)$.
definiciones_clave: |
  - **Gráfica de una función**: Conjunto de puntos $(x, f(x))$ representados en el plano cartesiano de dos dimensiones.
propiedades_relaciones: |
  - **Puntos de corte con los ejes**:
    - Con el eje $Y$: Ocurre en el punto $(0, f(0))$.
    - Con el eje $X$: Ocurre en las soluciones reales de $f(x) = 0$ (ceros de la función).
ejemplo_guiado:
  enunciado: 'Dada la función lineal $f(x) = 2x - 4$, encuentra las coordenadas de los puntos donde la gráfica corta al eje $X$ y al eje $Y$.'
  pasos:
    - 'Paso 1: Para el corte con el eje $Y$, evaluar en $x = 0$: $f(0) = 2(0) - 4 = -4$. El punto de corte es $(0, -4)$.'
    - 'Paso 2: Para el corte con el eje $X$, igualar $f(x) = 0$: $2x - 4 = 0 \implies 2x = 4 \implies x = 2$. El punto de corte es $(2, 0)$.'
    - 'Paso 3: Concluir que la gráfica corta al eje $Y$ en $(0, -4)$ y al eje $X$ en $(2, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Dada la función $f(x) = 2x - 4$, ¿en qué punto corta la gráfica al eje $X$?'
    choices:
      - {text: '$(2, 0)$', is_correct: true}
      - {text: '$(0, -4)$', is_correct: false}
      - {text: '$(-4, 0)$', is_correct: false}
      - {text: '$(0, 2)$', is_correct: false}
    explanation: "La alternativa correcta es '$(2, 0)$'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿En qué punto corta al eje $Y$ la gráfica de cualquier función $f(x)$?'
    choices:
      - {text: 'En el punto de coordenadas $(0, f(0))$.', is_correct: true}
      - {text: 'En el punto de coordenadas $(f(0), 0)$.', is_correct: false}
      - {text: 'En el origen $(0, 0)$ siempre.', is_correct: false}
      - {text: 'En el punto de intersección de la asíntota.', is_correct: false}
    explanation: "La alternativa correcta es 'En el punto de coordenadas $(0, f(0))$.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Determinar el dominio de la función $f(x)$.'
  - 'Paso 2: Construir una tabla de valores calculando pares ordenados $(x, f(x))$.'
  - 'Paso 3: Ubicar los puntos resultantes en el plano cartesiano identificando adecuadamente los ejes $X$ e $Y$.'
  - 'Paso 4: Unir los puntos mediante una curva suave o línea recta respetando el dominio.'
errores_correccion: |
  - **Error común:** Intercambiar las coordenadas escribiendo $(f(x), x)$ en lugar de $(x, f(x))$.
  - **Cómo corregirlo:** La primera componente SIEMPRE es la abscisa de entrada $x$ y la segunda componente SIEMPRE es la ordenada de salida $y$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de representación de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de representación de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Graficar una función consiste en unir los puntos de la tabla mediante rectas sin importar la naturaleza de la función.'
  - 'El eje de las ordenadas $Y$ se dibuja siempre de forma horizontal en el plano cartesiano estándar.'
  - 'Cualquier curva dibujada de forma continua en el plano cartesiano corresponde al gráfico de una función.'
  - 'El punto donde la gráfica intersecta al eje $X$ tiene coordenadas de la forma $(0, y)$.'
  - 'Graficar $f(x) = c$ (función constante) genera una recta vertical paralela al eje $Y$.'
afirmaciones_verdaderas:
  - 'La representación gráfica de una función $y = f(x)$ es el conjunto de todos los puntos $(x, y)$ del plano cartesiano que satisfacen la regla funcional.'
  - 'El eje horizontal $X$ alberga a la variable independiente (preimágenes) y el eje vertical $Y$ a la variable dependiente (imágenes).'
al_terminar_debes_poder: |
  QUÉ: Graficar funciones de variable real en el plano cartesiano a partir de su ecuación o tabla.
  CÓMO: Ubicar los puntos ordenados $(x, f(x))$ en los ejes $X$-$Y$ y trazar la curva o línea continua correspondiente respetando el dominio.
fuente: 'Texto escolar MINEDUC — Álgebra / Representación de Funciones'
estado: publicado
