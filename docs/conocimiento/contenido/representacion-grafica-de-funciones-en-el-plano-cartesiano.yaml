semantic_id: MAT.ALG.FUNCION_REPRESENTACION.GRAFICA_PLANO_CARTESIANO
resumen_inicial: La representación gráfica de una función en el plano cartesiano es el conjunto de todos los puntos $(x, f(x))$ que forman la curva de la función.
explicacion_simple: '![La representación gráfica de una función en el plano cartesiano es el conjunto de todos los puntos $(x, f(x))$ que forman la curva de la función](/static/img/nodos/representacion-grafica-de-funciones-en-el-plano-cartesiano-intro.svg)



  El plano cartesiano te permite **ver la forma geométrica de una función**:

  - Cada preimagen $x$ se ubica sobre el **eje horizontal (eje X)**.

  - Cada imagen $y = f(x)$ se ubica sobre el **eje vertical (eje Y)**.

  - El punto de encuentro de ambas coordenadas $(x, y)$ se marca en el plano.


  Al unir todos los puntos para un dominio real continuo, se forma una línea recta, una parábola u otra curva característica.'
explicacion_formal: 'El **gráfico** de una función real $f: \text{Dom}(f) \to \mathbb{R}$ es el lugar geométrico definido en $\mathbb{R}^2$ por:

  $$\text{Graf}(f) = \{(x, y) \in \mathbb{R}^2 \mid x \in \text{Dom}(f) \ \land \ y = f(x)\}$$


  **Elementos estructurales de la gráfica:**

  - **Intersección con eje $Y$**: Punto $(0, f(0))$.

  - **Intersecciones con eje $X$ (Ceros)**: Puntos $(x_0, 0)$ donde $f(x_0) = 0$.

  - **Comportamiento asintótico**: Líneas a las que la curva se aproxima indefinidamente sin tocarlas.'
definiciones_clave: '- **Gráfica cartesiana**: Visualización geométrica continua o discreta de la relación $y = f(x)$.

  - **Ejes coordenados**: Eje de abscisas horizontal ($X$) y eje de ordenadas vertical ($Y$).'
propiedades_relaciones: '- **Correspondencia biunívoca de puntos**: Cada punto $(a, b)$ de la curva equivale a la afirmación $f(a) = b$.

  - **Simetrías**: Funciones pares son simétricas respecto al eje $Y$; funciones impares son simétricas respecto al origen.'
ejemplo_guiado:
  enunciado: '![Ejemplo La representación gráfica de una función en el plano cartesiano es el conjunto de todos los puntos $(x, f(x))$ que forman la curva de la función](/static/img/nodos/representacion-grafica-de-funciones-en-el-plano-cartesiano-ejemplos.svg)



    Traza e identifica los puntos principales de la gráfica de la función afín $f(x) = -2x + 4$.'
  pasos:
  - 'Paso 1: Hallar el corte con el eje Y: evaluar $f(0) = -2(0) + 4 = 4 \implies (0, 4)$.'
  - 'Paso 2: Hallar el corte con el eje X: resolver $-2x + 4 = 0 \implies 2x = 4 \implies x = 2 \implies (2, 0)$.'
  - 'Paso 3: Calcular un punto de control: $f(3) = -2(3) + 4 = -2 \implies (3, -2)$.'
  - 'Paso 4: Trazar la línea recta continua que pasa por estos puntos en el plano cartesiano.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa geométricamente la gráfica de la función $f(x) = x^2$?
  choices:
  - text: Una parábola simétrica con vértice en el origen (0,0) abierta hacia arriba.
    is_correct: true
  - text: Una línea recta inclinada a 45 grados.
    is_correct: false
  - text: Una circunferencia de radio 1.
    is_correct: false
  - text: Una hipérbola equilátera.
    is_correct: false
  explanation: La alternativa correcta es 'Una parábola simétrica con vértice en el origen (0,0) abierta hacia arriba.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el punto $(5, -7)$ pertenece a la gráfica de $y = f(x)$, ¿cuál es la igualdad correcta?
  choices:
  - text: f(5) = -7
    is_correct: true
  - text: f(-7) = 5
    is_correct: false
  - text: f(0) = -7
    is_correct: false
  - text: f(5) = 0
    is_correct: false
  explanation: La alternativa correcta es 'f(5) = -7'. La primera coordenada es la entrada y la segunda es la salida.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Construir una tabla de valores con puntos estratégicos (cortes con ejes y extremos).'
- 'Paso 2: Dibujar los ejes coordenados $X$ e $Y$ graduados a una escala proporcional.'
- 'Paso 3: Marcar cada par $(x, y)$ como un punto puntual en el plano.'
- 'Paso 4: Unir los puntos con el trazo continuo correspondiente según el tipo de función.'
errores_correccion: '- **Error común:** Intercambiar las coordenadas al ubicar los puntos (marcar $(y, x)$ en vez de $(x, y)$).

  - **Cómo corregirlo:** Recordar la regla de desplazamiento: primero muévete horizontalmente en $X$ (derecha/izquierda) y luego verticalmente en $Y$ (arriba/abajo).'
ejemplos:
- titulo: 'Ejemplo 1: Corte con el eje Y'
  enunciado: En la función $f(x) = 3x - 9$, ¿en qué punto corta la gráfica al eje de las ordenadas?
  alternativas:
  - (0, -9)
  - (-9, 0)
  - (3, 0)
  - (0, 3)
  respuesta: (0, -9)
  solucion_pasos:
  - 'Paso 1: Evaluar en $x = 0$: $f(0) = 3(0) - 9 = -9$.'
  - 'Paso 2: El punto de intersección es $(0, -9)$.'
- titulo: 'Ejemplo 2: Cero de la función'
  enunciado: ¿En qué punto intersecta al eje de las abscisas la gráfica de $g(x) = 2x + 6$?
  alternativas:
  - (-3, 0)
  - (0, 6)
  - (3, 0)
  - (0, -3)
  respuesta: (-3, 0)
  solucion_pasos:
  - 'Paso 1: Igualar a cero: $2x + 6 = 0 \implies 2x = -6 \implies x = -3$.'
  - 'Paso 2: El punto de corte es $(-3, 0)$.'
- titulo: 'Ejemplo 3: Pertenencia de punto'
  enunciado: ¿Pasa la gráfica de $f(x) = x^2 - 2$ por el punto $(3, 7)$?
  alternativas:
  - Sí, porque f(3) = 3^2 - 2 = 7
  - No, porque 3^2 - 2 = 9
  - No, porque pasa por (7, 3)
  - Solo si x es positivo
  respuesta: Sí, porque f(3) = 3^2 - 2 = 7
  solucion_pasos:
  - 'Paso 1: Evaluar $f(3) = 9 - 2 = 7$.'
  - 'Paso 2: Como coincide con la segunda coordenada, el punto pertenece a la curva.'
- titulo: 'Ejemplo 4: Gráfica de función constante'
  enunciado: ¿Qué forma geométrica tiene la gráfica de $f(x) = 4$ en el plano?
  alternativas:
  - Una recta horizontal a la altura y = 4
  - Una recta vertical en x = 4
  - Una recta inclinada que pasa por (4, 4)
  - Un único punto en (0, 4)
  respuesta: Una recta horizontal a la altura y = 4
  solucion_pasos:
  - 'Paso 1: Para cualquier valor de $x$, la altura $y$ es constante e igual a $4$.'
errores_frecuentes:
- Ubicar la preimagen en el eje Y y la imagen en el eje X.
- Usar escalas diferentes de manera desproporcionada que distorsionen la geometría de la función.
- Unir puntos discretos con líneas continuas cuando el dominio son solo los números naturales.
afirmaciones_verdaderas:
- La gráfica cartesiana es el conjunto de puntos (x, y) donde cada y es el resultado de evaluar f(x).
- Los cortes con el eje X corresponden a las soluciones de la ecuación f(x) = 0.
al_terminar_debes_poder: '**QUÉ:** Graficar e interpretar funciones en el plano cartesiano con precisión.


  **CÓMO:** Determinando puntos clave (intersecciones con ejes y puntos notables) y trazando la curva según el dominio continuo o discreto.


