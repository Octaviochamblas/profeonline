resumen_inicial: El cálculo de una parte desconocida en un reparto proporcional determina
  el valor $x_i$ de una de las tajadas o del total $T$ a partir de la constante de
  proporcionalidad $k$ conocida.
explicacion_simple: Si en un reparto nos dan como pista cuánto le tocó a una de las
  personas, podemos descubrir el valor de la constante $k$ dividiendo esa tajada entre
  su número de participación. Con esa constante $k$, podemos hallar cuánto les tocó
  a las demás y el total sumado.
explicacion_formal: 'Dada la relación de reparto $x_i = k \cdot a_i$, si se conoce
  el valor de la parte $x_j$ y su índice $a_j$, la **Determinación de la Parte Desconóe
  $x_i$ o del Total $T$** se obtiene mediante:


  $$k = \frac{x_j}{a_j} \implies x_i = k \cdot a_i = \left( \frac{x_j}{a_j} \right)
  \cdot a_i \quad \text{y} \quad T = k \cdot \sum a_i$$'
definiciones_clave: '- **Parte desconocida en reparto**: Determinación de un sumando
  o total mediante la constante $k = x_j / a_j$.'
propiedades_relaciones: '- **Despeje por parte conocida**: $k = \frac{\text{Tajada
  conocida}}{\text{Índice conocido}}$.'
ejemplo_guiado:
  enunciado: 'Tres socios se reparten ganancias en la razón $3 : 5 : 7$. Si al segundo
    socio le corresponden \$250.000, halle el total de ganancias repartidas.'
  pasos:
  - 'Paso 1: Usar los datos del segundo socio ($x_2 = 250.000$, índice $a_2 = 5$)
    para hallar $k$: $k = \frac{250.000}{5} = 50.000$.'
  - 'Paso 2: Calcular la suma total de índices: $3 + 5 + 7 = 15$.'
  - 'Paso 3: Calcular el total repartido $T = k \cdot \sum a_i = 50.000 \cdot 15 =
    750.000$.'
  - 'Conclusión: El total repartido fue \$750.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula la constante de reparto k a partir de una tajada conocida
    xj y su índice aj?
  choices:
  - text: Dividiendo el valor de la tajada conocida entre su índice correspondiente
      (k = xj / aj)
    is_correct: true
  - text: Multiplicando k = xj · aj
    is_correct: false
  - text: Restando k = xj - aj
    is_correct: false
  - text: Sumando todos los coeficientes
    is_correct: false
  explanation: La alternativa correcta es 'Dividiendo el valor de la tajada conocida
    entre su índice correspondiente (k = xj / aj)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el segundo socio con $250.000 (índice 5), ¿cuál
    fue el total de ganancias T?
  choices:
  - text: 750.000 $
    is_correct: true
  - text: 500.000 $
    is_correct: false
  - text: 1.000.000 $
    is_correct: false
  - text: 350.000 $
    is_correct: false
  explanation: La alternativa correcta es '750.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular partes desconocidas o
  el total repartido $T$ despejando la constante $k = \frac{x_j}{a_j}$ a partir de
  un dato conocido.
semantic_id: MAT.NUM.REPARTO_ESCALAS.PARTE_DESCONOCIDA
procedimiento:
- 'Paso 1: Identificar el tipo de problema (reparto proporcional directo/inverso o
  cálculo de escalas).'
- 'Paso 2: Convertir unidades de medida a un sistema homogéneo común (en el caso de
  escalas).'
- 'Paso 3: Calcular la constante de proporcionalidad $k$ o la escala $E$ y resolver
  la incógnita solicitada.'
errores_correccion: '- **Error 1: Calcular la escala dividiendo medidas en distintas
  unidades (ej: metros entre centímetros directamente).** **Cómo corregirlo:** Se
  DEBEN convertir ambas distancias a la MISMA unidad de medida antes de calcular $n
  = R / d$.


  - **Error 2: Tratar un reparto inverso como si fuera directo dividiendo el total
  por los índices sin invertirlos.** **Cómo corregirlo:** En el reparto inverso se
  DEBEN invertir previamente los coeficientes ($1/a_i$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.REPARTO_ESCALAS.PARTE_DESCONOCIDA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del reparto proporcional o escalas.
- titulo: Ejemplo 2
  enunciado: Verificación de la constante k o escala E.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal de equivalencia proporcional.
- titulo: ¿Conserva el reparto proporcional la suma del total T?
  respuesta: Sí
  solucion_pasos:
  - Sí, la suma de las partes repartidas equivale a $T$.
- titulo: ¿Exige la escala expresarse en las mismas unidades de medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, para obtener una razón adimensional $1:n$.
errores_frecuentes:
- Calcular una escala dividiendo la distancia en metros entre los centímetros del
  plano sin convertir unidades.
- Realizar un reparto proporcional inverso sumando los coeficientes directamente como
  si fuera un reparto directo.
- Invertir el orden de la escala dividiendo la medida del plano por la medida real
  ($d / R$) para la constante $n$.
- Omitir multiplicar la constante de reparto $k$ por cada uno de los coeficientes
  individuales al finalizar.
- Restar los coeficientes al calcular el total repartido en una serie de razones.
afirmaciones_verdaderas:
- El reparto proporcional directo distribuye un total multiplicando la constante $k
  = \frac{T}{\sum a_i}$ por cada índice.
- 'La escala de un plano $E = \frac{d}{R} = 1 : n$ relaciona la distancia dibujada
  y la real expresadas en idéntica unidad.'
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
