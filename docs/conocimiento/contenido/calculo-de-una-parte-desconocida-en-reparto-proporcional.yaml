procedimiento:
- 'Paso 1: Toma el valor recibido por un participante y divídelo por su índice de reparto.
  Esto te da $K$.'
- 'Paso 2: Multiplica esa constante $K$ por el índice de otro participante para saber su parte.'
- 'Paso 3: Para hallar el Total, suma todas las partes o multiplica $K$ por la suma de todos
  los índices.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de una parte
  desconocida en reparto proporcional.
ejemplos:
- titulo: Descubriendo el total
  enunciado: Tres amigos invierten en razón 2:3:5. Si el que puso menos recibió $40.000 de
    ganancia, ¿cuál fue la ganancia total?
  solucion_pasos:
  - El que puso menos tiene índice 2. Recibió 40.000.
  - 'Hallamos K: $K = 40.000 / 2 = 20.000$.'
  - 'Suma de índices: $2+3+5 = 10$.'
  - 'Total repartido: $10 \cdot 20.000 = 200.000$.'
- titulo: Ejemplo 2
  enunciado: En un reparto en razón 4:6, la parte de índice 4 recibió 20.000 pesos. ¿Cuál
    es K?
  alternativas:
  - '5.000'
  - '4.000'
  - '6.000'
  respuesta: '5.000'
  solucion_pasos:
  - 20.000 dividido entre 4 es igual a 5.000.
- titulo: Ejemplo 3
  enunciado: Con K igual a 8.000 y razón 2:5:9, ¿cuál es el total repartido?
  alternativas:
  - '128.000'
  - '112.000'
  - '72.000'
  respuesta: '128.000'
  solucion_pasos:
  - (2 más 5 más 9) por 8.000 es igual a 16 por 8.000, o sea 128.000.
- titulo: ¿Se puede hallar el total repartido conociendo solo una parte y su índice?
  respuesta: Sí
  solucion_pasos:
  - Primero se calcula K con esa parte, y luego se multiplica por la suma de todos los índices.
errores_frecuentes:
- Dividir el monto recibido por la suma de todos los índices (en vez de dividirlo solo por
  su propio índice).
- Asumir que el monto recibido es el total y repartirlo de nuevo.
- Confundirse si los índices están dados en porcentajes.
- Dividir el monto recibido por la suma de todos los índices en vez de dividirlo solo por
  su propio índice.
- Asumir que el monto recibido por una parte ya es el total repartido.
afirmaciones_verdaderas:
- La propiedad de cálculo de una parte desconocida en reparto proporcional preserva la consistencia
  lógica.
- Conociendo el monto y el índice de una sola parte del reparto, se puede calcular la constante
  K y luego el total repartido.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de una parte
