semantic_id: MAT.NUM.REPARTO_ESCALAS.PARTE_DESCONOCIDA
resumen_inicial: 'Cálculo de una parte desconocida en reparto proporcional: concepto y propiedades
  fundamentales en Reparto proporcional y escalas.'
explicacion_simple: A veces sabemos cuánto le tocó a una persona y cuál era su proporción,
  pero ignoramos de cuánto era el premio total o cuánto recibió el resto. Con una sola porción
  del pastel, podemos reconstruirlo entero.
explicacion_formal: 'En problemas inversos de reparto, no nos dan el Total ($T$), sino que
  nos dicen cuánto recibió uno de los involucrados.


  El procedimiento es muy simple usando el método de Constante $K$:

  Si sabemos que la persona $A$ recibió un monto $M_a$, y su índice era $a$, como sabemos
  que $M_a = a \cdot K$, podemos despejar $K$ dividiendo:

  $K = \frac{M_a}{a}$


  Una vez que hallaste el valor de la cuota base ($K$), puedes multiplicarlo por los demás
  índices para hallar cuánto recibieron los otros, o sumarlo todo para hallar el Gran Total
  repartido.'
definiciones_clave: '- **Cálculo de una parte desconocida en reparto proporcional**: Elemento
  central dentro del estudio de Reparto proporcional y escalas.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo de una parte desconocida en reparto proporcional.'
ejemplo_guiado:
  enunciado: Dos socios invierten en razón 3:7. El socio con menor inversión recibió 30.000
    pesos de ganancia. ¿Cuál fue la ganancia total?
  pasos:
  - 'Identifico que el socio con índice 3 recibió 30.000, así que calculo K: 30.000 dividido
    entre 3 es igual a 10.000.'
  - 'Calculo lo que recibe el otro socio: 7 por 10.000 es igual a 70.000.'
  - 'Sumo ambas partes para el total: 30.000 más 70.000 es igual a 100.000.'
