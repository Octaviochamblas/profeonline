semantic_id: MAT.NUM.RAZONES_PROPORCIONES.REPARTO_PARTE_DESCONOCIDA
resumen_inicial: El cálculo de una parte desconocida en un reparto proporcional reconstruye la constante unitaria $k = \frac{x_{\text{conocido}}}{c_{\text{conocido}}}$ a partir de una única cuota identificada, permitiendo despejar cualquier otra parte o el monto total global.
explicacion_simple: "![Cálculo de parte desconocida](/static/img/nodos/calculo-de-una-parte-desconocida-en-reparto-proporcional-intro.svg)\n\nA veces un problema **no nos da el total a repartir**, sino que nos dice **cuánto recibió una de las partes**:\n- **¿Cómo lo resolvemos?**\n  1. **Hallamos la constante unitaria $k$ dividiendo esa parte conocida por su propio índice**:\n  $$k = \\frac{\\text{Parte conocida}}{\\text{Índice conocido}}$$\n  2. **Calculamos cualquier otra parte multiplicando su índice por $k$**:\n  $$\\text{Parte desconocida} = c_B \\cdot k$$\n  3. **Si nos piden el total**, sumamos todos los índices y los multiplicamos por $k$:\n  $$\\text{Total } T = (c_A + c_B + c_C + \\dots) \\cdot k$$"
explicacion_formal: 'Sea un reparto proporcional definido por los índices $c_1, c_2, \dots, c_n$ donde se conoce el valor exacto de la componente $x_j$ para algún índice $j \in \{1, \dots, n\}$.


  **Despeje de la Constante del Sistema:**

  Por la propiedad fundamental de las razones:


  $$k = \frac{x_j}{c_j} \in \mathbb{R}^+$$


  **Fórmulas de Reconstrucción:**

  1. **Valor de cualquier otra parte $x_m$ ($m \neq j$):**

  $$x_m = c_m \cdot k = c_m \cdot \left(\frac{x_j}{c_j}\right)$$

  2. **Total global acumulado $T$:**

  $$T = \sum_{i=1}^{n} x_i = k \cdot \sum_{i=1}^{n} c_i = \left(\frac{x_j}{c_j}\right) \cdot \sum_{i=1}^{n} c_i$$'
definiciones_clave: '- **Parte testigo / conocida ($x_j$)**: Cuota de referencia a partir de la cual se desbloquea la constante $k$.

  - **Reconstrucción de total**: Deducción de $T$ mediante $T = k \cdot \sum c_i$.

  - **Razón cruzada de partes**: Proporción binaria $\frac{x_A}{c_A} = \frac{x_B}{c_B}$.'
propiedades_relaciones: '- **Desacoplamiento del total**: Permite resolver el reparto sin necesidad de que el total $T$ sea explicitado a priori.

  - **Linealidad estricta**: La diferencia entre dos partes satisface $\Delta x = (c_A - c_B) \cdot k$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de parte desconocida](/static/img/nodos/calculo-de-una-parte-desconocida-en-reparto-proporcional-ejemplos.svg)


    En un reparto en razón $3 : 5$, si la persona $A$ recibe $\$18.000$, ¿cuánto recibe $B$? Además, en un reparto en razón $2 : 4 : 7$, si la menor de las partes es $\$14.000$, halle el total repartido.'
  pasos:
  - 'Paso 1: Para la razón $3:5$: El índice de $A$ es $3$. Hallar $k = \frac{18000}{3} = $\$6.00$0$.'
  - 'Paso 2: Calcular parte $B$: $B = 5 \cdot k = 5 \cdot 6.000 = $\$30.00$0$.'
  - 'Paso 3: Para la razón $2:4:7$: La menor parte tiene índice $2 \implies 2k = 14.000 \implies k = \frac{14000}{2} = $\$7.00$0$.'
  - 'Paso 4: Calcular total: Suma de índices $= 2 + 4 + 7 = 13 \implies \text{Total} = 13 \cdot 7.000 = $\$91.00$0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula la constante unitaria k cuando se conoce una de las partes del reparto?
  choices:
  - text: 'Dividiendo el valor de la parte conocida entre su índice de reparto respectivo: $k = \frac{x_j}{c_j}$'
    is_correct: true
  - text: Dividiendo la parte conocida entre el número total de participantes
    is_correct: false
  - text: Multiplicando la parte conocida por la suma de todos los índices
    is_correct: false
  - text: Restando el índice de la parte conocida
    is_correct: false
  explanation: 'La alternativa correcta es ''Dividiendo el valor de la parte conocida entre su índice de reparto respectivo: $k = \frac{x_j}{c_j}$''.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se obtuvo el total de $91.000 a partir de la menor parte de $14.000?
  choices:
  - text: Se calculó la constante k = 14.000 / 2 = 7.000 y se multiplicó por la suma de todos los índices (13 · 7.000 = 91.000)
    is_correct: true
  - text: Multiplicando 14.000 por 7
    is_correct: false
  - text: Sumando 14.000 + 2 + 4 + 7
    is_correct: false
  - text: Elevando al cuadrado el menor índice
    is_correct: false
  explanation: La alternativa correcta es 'Se calculó la constante k = 14.000 / 2 = 7.000 y se multiplicó por la suma de todos los índices (13 · 7.000 = 91.000)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la parte numérica conocida $x_j$ y su índice correspondiente $c_j$.'
- 'Paso 2: Despejar la constante unitaria dividiendo $k = \frac{x_j}{c_j}$.'
- 'Paso 3: Calcular las demás partes requeridas ($x_m = c_m \cdot k$) o el total global ($T = (\sum c_i) \cdot k$).'
errores_correccion: '- **Error 1: Dividir la parte conocida por la suma total de índices.** **Cómo corregirlo:** La parte conocida $x_j$ SOLO se divide por su propio índice individual $c_j$ ($k = \frac{x_j}{c_j}$).

  - **Error 2: Confundir una parte con la diferencia entre partes.** **Cómo corregirlo:** Si el dato es una diferencia $x_A - x_B$, se debe dividir por $(c_A - c_B)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'En un reparto en razón $4 : 7$, la parte mayor es $\$35.000$. ¿Cuánto vale la parte menor?'
  alternativas:
  - $\$20.000$
  - $\$15.000$
  - $\$28.000$
  respuesta: $\$20.000$
  solucion_pasos:
  - $k = \frac{35000}{7} = 5000 \implies 4k = 4 \cdot 5000 = $\$20.00$0$.
- titulo: Ejemplo 2
  enunciado: 'La diferencia entre dos partes en razón $3 : 8$ es $\$25.000$. ¿Cuál es el total repartido?'
  alternativas:
  - $\$55.000$
  - $\$50.000$
  - $\$40.000$
  respuesta: $\$55.000$
  solucion_pasos:
  - Diferencia de índices $= 8 - 3 = 5 \implies k = \frac{25000}{5} = 5000$. Suma $= 11 \implies 11 \cdot 5000 = $\$55.00$0$.
- titulo: ¿Basta conocer una sola parte y su índice para reconstruir todo el reparto?
  respuesta: Sí
  solucion_pasos:
  - Sí, la constante unitaria $k$ define completamente todo el sistema proporcional.
  alternativas:
  - texto: Sí, k desbloquea unívocamente todas las demás cuotas y el total
    es_correcta: true
    retroalimentacion: ¡Correcto! Reconstrucción completa.
  - texto: No, se necesita conocer obligatoriamente el total
    es_correcta: false
    retroalimentacion: Incorrecto, el total se puede calcular a partir de $k$.
  - texto: No, se necesitan al menos tres partes conocidas
    es_correcta: false
    retroalimentacion: Incorrecto, una sola parte es suficiente.
- titulo: ¿Se puede calcular la constante k a partir de la diferencia entre dos partes?
  respuesta: Sí
  solucion_pasos:
  - Sí, dividiendo la diferencia monetaria entre la resta de sus índices correspondientes.
  alternativas:
  - texto: Sí, dividiendo la diferencia de montos por la diferencia de índices
    es_correcta: true
    retroalimentacion: '¡Correcto! Propiedad de diferencias: $\Delta x / \Delta c = k$.'
  - texto: No, la diferencia no conserva la proporción
    es_correcta: false
    retroalimentacion: Incorrecto, la linealidad de la resta conserva la constante.
  - texto: No, solo se puede con la suma
    es_correcta: false
    retroalimentacion: Incorrecto, aplica tanto para sumas como para restas.
errores_frecuentes:
- Dividir el valor de la parte conocida entre la suma total de índices.
- Asociar el valor numérico al índice incorrecto.
- Confundir la parte individual con la diferencia entre partes.
- Olvidar multiplicar por la suma total cuando se solicita el monto global.
afirmaciones_verdaderas:
- La constante del reparto se obtiene mediante $k = \frac{x_j}{c_j}$.
- Conociendo una parte se puede calcular cualquier otra cuota o el total acumulado.
- La diferencia entre dos cuotas es proporcional a la diferencia de sus índices.
al_terminar_debes_poder: '![Síntesis de cálculo de parte desconocida](/static/img/nodos/calculo-de-una-parte-desconocida-en-reparto-proporcional-resumen.svg)


  QUÉ: Reconstruir partes desconocidas o el total repartido a partir de datos parciales.


  CÓMO: Despejando la constante unitaria $k = \frac{x_{\text{conocido}}}{c_{\text{conocido}}}$ y calculando las cuotas restantes ($x_m = c_m \cdot k$) o el total global ($T = (\sum c_i) \cdot k$).'
