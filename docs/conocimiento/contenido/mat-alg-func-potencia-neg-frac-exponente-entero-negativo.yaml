semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.EXPONENTE_ENTERO_NEGATIVO
resumen_inicial: 'Interpretación de una potencia de exponente entero negativo como
  recíproco: forma general $f(x) = a x^n$, simetría, dominio y recorrido en Exponentes
  negativos y fraccionarios.'
explicacion_simple: Un exponente negativo no indica un resultado negativo, sino que
  la potencia pasa a formar parte de un denominador.
explicacion_formal: '### Definición formal


  Para $n\in\mathbb{Z}^+$, se define $x^{-n}=\dfrac{1}{x^n}$ para todo $x\neq0$. Esta
  identidad traslada el análisis de exponentes negativos al de fracciones con potencias
  en el denominador.


  ### Desarrollo didáctico


  $f(x)=x^{-2}=\dfrac{1}{x^2}$: al evaluar en $x=3$, se obtiene $f(3)=1/9$; al evaluar
  en $x=-3$, se obtiene $f(-3)=1/9$ también, porque el exponente $-2$ hereda la paridad
  de $2$.'
definiciones_clave: '- **Interpretación de una potencia de exponente entero negativo
  como recíproco**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a interpretación de una potencia de exponente entero negativo
  como recíproco.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de interpretación de una potencia de exponente entero negativo como recíproco.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de interpretación de una
    potencia de exponente entero negativo como recíproco.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar interpretación de una potencia de exponente entero negativo como
    recíproco?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en exponentes negativos y fraccionarios
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en exponentes negativos y fraccionarios.
    El exponente n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en interpretación de una potencia de exponente entero negativo
    como recíproco?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el exponente negativo $-n$ en la expresión $x^{-n}$.'
- 'Paso 2: Reescribe la expresión como $1/x^n$, con $n$ positivo.'
- 'Paso 3: Excluye $x=0$ del dominio, ya que produce una división por cero.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en interpretación de una potencia de exponente entero negativo como
  recíproco.
ejemplos:
- titulo: Reescritura de un exponente negativo simple
  enunciado: Reescribe $f(x)=x^{-3}$ como fracción.
  solucion_pasos:
  - Se aplica la definición de exponente negativo.
  - Se obtiene $f(x)=1/x^3$.
- titulo: Evaluación con exponente negativo
  enunciado: Evalúa $f(x)=x^{-2}$ en $x=5$.
  solucion_pasos:
  - Se reescribe como $f(x)=1/x^2$.
  - 'Se evalúa: $f(5)=1/25$.'
- titulo: ¿$x^{-n}$ es siempre negativo?
  enunciado: ¿El resultado de $x^{-n}$ es siempre un número negativo?
  respuesta: 'No'
  solucion_pasos:
  - El signo del resultado depende del signo de $x$ y de la paridad de $n$, no del
    signo del exponente.
- titulo: ¿$x=0$ pertenece al dominio de $f(x)=x^{-n}$?
  enunciado: ¿El valor $x=0$ pertenece al dominio de $f(x)=x^{-n}$ para $n$ entero
    positivo?
  respuesta: 'No'
  solucion_pasos:
  - Se excluye porque produciría una división por cero al reescribir como $1/x^n$.
errores_frecuentes:
- Suponer que un exponente negativo siempre produce un resultado negativo.
- Olvidar excluir $x=0$ del dominio al reescribir la expresión como fracción.
- Confundir $x^{-n}$ con $-x^n$, que son expresiones completamente distintas.
- No aplicar correctamente la paridad de $n$ al determinar el signo del resultado.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_ponder: Analizar, graficar y evaluar funciones potencia aplicando
  interpretación de una potencia de exponente entero negativo como recíproco.
