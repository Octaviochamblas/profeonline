semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.EXPONENTE_ENTERO_NEGATIVO
resumen_inicial: 'Una función potencia de exponente entero negativo $f(x) = a x^{-m}$ ($m \in \mathbb{Z}^+$) se interpreta algebraicamente como la función recíproca escalada $f(x) = \frac{a}{x^m}$.'
explicacion_simple: |
  Cuando el exponente de una función potencia es un número entero negativo (como $x^{-1}, x^{-2}, x^{-3}$), la regla algebraica de las potencias nos indica que la variable baja al denominador pasando a tener exponente positivo. Por ejemplo, $f(x) = 5 x^{-2}$ equivale exactamente a escribir la fracción $f(x) = \frac{5}{x^2}$. Esta transformación ubica a la variable en el divisor, impidiendo que $x$ tome el valor cero ($x \neq 0$).
explicacion_formal: |
  ### Definición formal
  La **interpretación recíproca de la función potencia de exponente entero negativo** $f: \mathbb{R} \setminus \{0\} \to \mathbb{R}$ con $f(x) = a x^n$ donde $n = -m$ ($m \in \mathbb{Z}^+$) se rige por el axioma algebraico de la potencia de exponente negativo:
  $$f(x) = a \cdot x^{-m} \equiv \frac{a}{x^m}$$

  ### Propiedades analíticas de la forma recíproca
  1. **Indefinición por División por Cero**: La presencia de $x^m$ en el denominador restringe el dominio real eliminando al elemento neutro aditivo: $\operatorname{Dom}(f) = \mathbb{R} \setminus \{0\}$.
  2. **Inversión de Magnitud**:
     - Para $|x| > 1 \implies x^m$ crece, lo que provoca que $|f(x)| = \frac{|a|}{x^m}$ decrezca hacia 0.
     - Para $0 < |x| < 1 \implies x^m$ se encoge hacia 0, lo que provoca que $|f(x)| = \frac{|a|}{x^m}$ explote hacia $+\infty$.

  ### Síntesis didáctica
  Reescritura de potencias negativas:
  - $f(x) = x^{-1} = \frac{1}{x}$ (Función recíproca lineal).
  - $f(x) = x^{-2} = \frac{1}{x^2}$ (Función recíproca cuadrática).
  - $f(x) = 3 x^{-4} = \frac{3}{x^4}$ (Función recíproca escalada).
definiciones_clave: |
  - **Exponente entero negativo $n = -m$**: Exponente que representa la división recíproca por la potencia de exponente positivo $x^m$.
  - **Reescritura en fracción $\frac{a}{x^m}$**: Expresión canónica racional de una potencia de exponente negativo.
  - **Inversión de magnitud**: Comportamiento por el cual valores grandes de $x$ producen salidas cercanas a cero y valores pequeños de $x$ producen salidas infinitas.
propiedades_relaciones: |
  - **Paridad conservada**: La paridad de $m$ rige la paridad de la función recíproca: si $m$ es par, $f(x) = \frac{a}{x^m}$ es par; si $m$ es impar, $f(x) = \frac{a}{x^m}$ es impar.
  - **Presencia de dos asíntotas**: Asíntota vertical en $x = 0$ y asíntota horizontal en $y = 0$.
ejemplo_guiado:
  enunciado: 'Reescribe las siguientes funciones potencia de exponente negativo como fracciones algebraicas y evalúalas en $x = 2$ y $x = -2$: A) $f(x) = 4x^{-1}$, B) $g(x) = -3x^{-2}$.'
  pasos:
    - 'Paso 1: Para $f(x) = 4x^{-1}$, reescribimos como fracción: $f(x) = \frac{4}{x}$.'
    - 'Paso 2: Evaluamos $f(2) = \frac{4}{2} = 2$. Evaluamos $f(-2) = \frac{4}{-2} = -2$.'
    - 'Paso 3: Para $g(x) = -3x^{-2}$, reescribimos como fracción: $g(x) = \frac{-3}{x^2}$.'
    - 'Paso 4: Evaluamos $g(2) = \frac{-3}{2^2} = \frac{-3}{4} = -0.75$. Evaluamos $g(-2) = \frac{-3}{(-2)^2} = \frac{-3}{4} = -0.75$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿A qué expresión algebraica equivale la función potencia $f(x) = -6x^{-3}$ al convertir su exponente negativo en positivo?'
    choices:
      - {text: '$f(x) = \frac{-6}{x^3}$', is_correct: true}
      - {text: '$f(x) = \frac{6}{x^3}$', is_correct: false}
      - {text: '$f(x) = -6x^3$', is_correct: false}
      - {text: '$f(x) = -\frac{1}{6x^3}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = \frac{-6}{x^3}$''. El coeficiente $-6$ permanece en el numerador multiplicando a la potencia recíproca $x^{-3} = \frac{1}{x^3}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué valor entrega la función potencia $f(x) = 16 x^{-2}$ al ser evaluada en $x = 4$?'
    choices:
      - {text: '$1$, pues $f(4) = \frac{16}{4^2} = \frac{16}{16} = 1$', is_correct: true}
      - {text: '$-1$, conservando el signo del exponente', is_correct: false}
      - {text: '$64$, multiplicando $16 \cdot 4$', is_correct: false}
      - {text: '$0$, porque el exponente es negativo', is_correct: false}
    explanation: 'La alternativa correcta es ''$1$, pues $f(4) = \frac{16}{4^2} = \frac{16}{16} = 1$''. Reescribimos como $\frac{16}{x^2}$ y evaluamos en $x = 4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el exponente negativo $n = -m$ en la función $f(x) = a x^{-m}$.'
  - 'Paso 2: Reescribir la expresión trasladando la base $x$ al denominador con exponente positivo: $f(x) = \frac{a}{x^m}$.'
  - 'Paso 3: Conservar el coeficiente $a$ en el numerador con su signo original.'
  - 'Paso 4: Declarar la restricción del dominio $x \neq 0$ debida a la presencia del denominador.'
errores_correccion: |
  - **Error 1:** Bajar también el coeficiente $a$ al denominador (ej: escribir $5x^{-2}$ como $\frac{1}{5x^2}$). **Cómo corregirlo:** El exponente $-2$ afecta únicamente a la base $x$. El coeficiente 5 permanece multiplicando en el numerador: $\frac{5}{x^2}$.
  - **Error 2:** Asumir que un exponente negativo convierte el resultado de la función en un número negativo. **Cómo corregirlo:** Un exponente negativo invierte la posición de la variable ($\frac{1}{x^m}$), pero no altera los signos aritméticos de las evaluaciones.
ejemplos:
  - titulo: 'Reescritura de exponente negativo simple'
    enunciado: '¿La función $f(x) = x^{-4}$ equivale a $\frac{1}{x^4}$?'
    alternativas:
      - 'Sí, $\frac{1}{x^4}$'
      - 'No, $-x^4$'
      - 'No, $-\frac{1}{x^4}$'
    respuesta: 'Sí, $\frac{1}{x^4}$'
    solucion_pasos:
      - '1. Aplicamos la regla $x^{-m} = \frac{1}{x^m}$.'
      - '2. $f(x) = \frac{1}{x^4}$.'
  - titulo: 'Reescritura con coeficiente escalar'
    enunciado: '¿La función $g(x) = -2x^{-5}$ equivale a $\frac{-2}{x^5}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El coeficiente $-2$ queda en el numerador: $g(x) = \frac{-2}{x^5}$.'
  - titulo: 'Evaluación de entero negativo'
    enunciado: 'Para $h(x) = 12 x^{-1}$, ¿evaluar $x = 3$ entrega 4?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $h(3) = \frac{12}{3} = 4$.'
  - titulo: 'Restricción de división por cero'
    enunciado: '¿La función $p(x) = x^{-3}$ está indefinida en $x = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $p(0) = \frac{1}{0^3} = \frac{1}{0}$, lo cual es indefinido en $\mathbb{R}$.'
errores_frecuentes:
  - 'La función potencia $f(x) = 3x^{-2}$ se reescribe como la fracción $\frac{1}{3x^2}$.'
  - 'Un exponente negativo hace que todas las salidas de la función $f(x) = x^{-2}$ sean números negativos.'
  - 'La función $f(x) = x^{-1}$ se puede evaluar en $x = 0$ dando como resultado cero.'
  - 'Al convertir $f(x) = -4x^{-3}$ a fracción, el signo menos del coeficiente se elimina.'
  - 'Un exponente negativo representa una resta en lugar de una división recíproca.'
afirmaciones_verdaderas:
  - 'Una potencia de exponente entero negativo $f(x) = a x^{-m}$ se interpreta como la fracción recíproca $f(x) = \frac{a}{x^m}$, donde el coeficiente $a$ permanece en el numerador.'
  - 'La reescritura en forma de fracción ubica a la variable $x$ en el denominador, imponiendo la restricción $x \neq 0$ en el dominio.'
al_terminar_debes_poder: 'Interpretar y evaluar funciones potencia de exponente entero negativo reescribiéndolas como fracciones recíprocas.'
