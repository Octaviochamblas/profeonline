semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.REFLEXION_EJE_X
resumen_inicial: 'Análisis de la reflexión respecto del eje X cuando A es negativo:
  círculo unitario, amplitud, período y transformaciones de Parámetros y transformaciones
  de funciones periódicas.'
explicacion_simple: Igual que en otras familias de funciones, el signo del coeficiente
  principal determina si la curva se invierte respecto al eje horizontal.
explicacion_formal: '### Definición formal


  Para $f(x)=a\cdot g(x)$ con $a<0$, se cumple $f(x)=-|a|\cdot g(x)$, lo que invierte
  el signo de cada valor de $g(x)$. Geométricamente, esto refleja la gráfica respecto
  al eje $x$: donde $g$ sube, $f$ baja, y viceversa.


  ### Desarrollo didáctico


  $f(x)=-\sin(x)$ tiene su primer mínimo donde $\sin(x)$ tiene su máximo (en $x=\pi/2$),
  y su primer máximo donde $\sin(x)$ tiene su mínimo (en $x=3\pi/2$).'
definiciones_clave: '- **Análisis de la reflexión respecto del eje X cuando A es negativo**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a análisis de la reflexión respecto del eje x cuando a es negativo.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    análisis de la reflexión respecto del eje x cuando a es negativo.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de análisis de la reflexión respecto del eje x cuando
    a es negativo.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
