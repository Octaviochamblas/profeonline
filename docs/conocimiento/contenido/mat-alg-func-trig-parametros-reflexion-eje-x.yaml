semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.REFLEXION_EJE_X
resumen_inicial: 'Análisis de la reflexión respecto del eje X (o línea media) cuando el coeficiente $A$ es negativo ($A < 0$).'
explicacion_simple: |
  ¿Qué ocurre si colocas un signo menos delante del número que multiplica a la función, como en $y = -\sin(x)$ o $y = -3\cos(x)$? El signo negativo invierte verticalmente toda la gráfica como un reflejo en un espejo de agua. Lo que antes era una cresta apuntando hacia arriba ahora se convierte en un valle apuntando hacia abajo, y lo que era un valle se convierte en una cresta. La amplitud sigue siendo un número positivo ($|A|$), pero la gráfica parte en la dirección opuesta.
explicacion_formal: |
  ### Definición formal
  Sea la función trigonométrica $f(x) = A\sin(Bx + C) + D$ o $g(x) = A\cos(Bx + C) + D$. Si el coeficiente multiplicativo es estrictamente negativo (**$A < 0$**), la función experimenta una **reflexión vertical (o simetría especular)** con respecto a la recta de equilibrio (línea media $y = D$):
  $$f(x) = -|A|\sin(Bx + C) + D$$

  ### Desglose simbólico
  - Para el seno negativo $f(x) = -\sin(x)$:
    - En el intervalo $\left[0, \frac{\pi}{2}\right]$, en lugar de crecer de $0$ a $1$, **decrece de $0$ a $-1$**.
  - Para el coseno negativo $g(x) = -\cos(x)$:
    - En $x = 0$, en lugar de comenzar en el máximo $(0,1)$, **comienza en el mínimo $(0,-1)$**.
  - Amplitud: Se mantiene positiva como $|A|$.

  ### Síntesis didáctica
  El signo negativo en $A$ invierte el orden de los máximos y mínimos sin modificar el valor numérico de la amplitud, el período $T$, los ceros ni la posición de la línea media.
definiciones_clave: |
  - **Reflexión vertical / respecto a la línea media**: Transformación isométrica que invierte la orientación vertical de la gráfica ($y \mapsto -y$).
  - **Inversión de cresta a valle**: Fenómeno por el cual los puntos supremos se transforman en puntos ínfimos.
  - **Coeficiente negativo ($A < 0$)**: Condición algebraica que desencadena el reflejo especular.
propiedades_relaciones: |
  - **Relación con la simetría impar del seno**: La reflexión $y = -\sin(x)$ es exactamente igual a la evaluación con argumento negativo $y = \sin(-x)$.
  - **Relación con el coseno**: La reflexión $y = -\cos(x)$ NO es igual a $\cos(-x)$ (puesto que el coseno es par $\cos(-x) = \cos x$), sino que representa una traslación de fase de $\pi$ radianes: $-\cos(x) = \cos(x + \pi)$.
ejemplo_guiado:
  enunciado: 'Describe el comportamiento inicial en $x = 0$ de la función $f(x) = -2\cos(x) + 3$ en comparación con $g(x) = 2\cos(x) + 3$.'
  pasos:
    - 'Paso 1: Identificar la línea media común de ambas funciones: $D = 3 \implies y = 3$.'
    - 'Paso 2: Evaluar $g(0) = 2\cos(0) + 3 = 2(1) + 3 = 5$. La función positiva $g(x)$ arranca en su cresta máxima $(0, 5)$.'
    - 'Paso 3: Evaluar $f(0) = -2\cos(0) + 3 = -2(1) + 3 = 1$. La función reflejada $f(x)$ arranca en su valle mínimo $(0, 1)$.'
    - 'Paso 4: Concluir que el signo negativo en $A = -2$ ha invertido la cresta inicial en un valle mínimo.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si en la función $y = A\sin(x)$ el coeficiente es $A = -3$, ¿cuál es la amplitud de la función y qué ocurre con su gráfica?'
    choices:
      - {text: 'La amplitud es $3$ y la gráfica se encuentra invertida respecto a la línea media', is_correct: true}
      - {text: 'La amplitud es $-3$ y el período se vuelve negativo', is_correct: false}
      - {text: 'La amplitud es $3$ y la gráfica se desplaza $3$ unidades a la izquierda', is_correct: false}
      - {text: 'La amplitud es $0$ y la gráfica se convierte en una recta horizontal', is_correct: false}
    explanation: 'La alternativa correcta es ''La amplitud es $3$ y la gráfica se encuentra invertida respecto a la línea media''. La amplitud es $|-3|=3$ y el signo negativo invierte la curva.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Dónde inicia el primer ciclo de la función $y = -\cos(x)$ en $x = 0$?'
    choices:
      - {text: 'En su punto mínimo $y = -1$', is_correct: true}
      - {text: 'En su punto máximo $y = 1$', is_correct: false}
      - {text: 'En la línea media $y = 0$', is_correct: false}
      - {text: 'En el valor de la amplitud $y = 2$', is_correct: false}
    explanation: 'La alternativa correcta es ''En su punto mínimo $y = -1$''. La reflexión convierte la cresta inicial $(0,1)$ del coseno base en el valle $(0,-1)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Observar el signo del coeficiente $A$ multiplicativo.'
  - 'Paso 2: Si $A < 0$, registrar que la gráfica sufre una reflexión vertical respecto a la línea media $y = D$.'
  - 'Paso 3: Invertir el sentido de trazado: convertir el crecimiento inicial en decrecimiento (en el seno) o la cresta inicial en valle (en el coseno).'
  - 'Paso 4: Recordar que la amplitud sigue siendo el valor absoluto no negativo $|A|$.'
errores_correccion: |
  - **Error 1:** Afirmar que el signo negativo de $A$ hace que la amplitud sea negativa. **Cómo corregirlo:** La amplitud es la distancia entre la cresta y la línea media, por lo que siempre es un escalar positivo $|A|$. El signo negativo solo indica inversión gráfica.
  - **Error 2:** Confundir la reflexión respecto al eje de la línea media con un movimiento a la izquierda o derecha (desfase). **Cómo corregirlo:** La reflexión invierte arriba/abajo (eje Y); no traslada horizontalmente el inicio del ciclo (eje X).
ejemplos:
  - titulo: 'Seno invertido en el primer cuadrante'
    enunciado: '¿Hacia dónde se dirige la curva $y = -2\sin(x)$ inmediatamente después de $x = 0$?'
    alternativas:
      - 'Hacia abajo, alcanzando un valle en $-\frac{\pi}{2}$'
      - 'Hacia arriba, alcanzando una cresta en $\frac{\pi}{2}$'
      - 'Permanece constante en cero'
    respuesta: 'Hacia abajo, alcanzando un valle en $-\frac{\pi}{2}$'
    solucion_pasos:
      - '1. En $y = \sin x$, el primer cuadrante sube.'
      - '2. Con $A = -2$, la curva se invierte y desciende a $y = -2$ en $x = \frac{\pi}{2}$.'
  - titulo: 'Ceros en función invertida'
    enunciado: '¿La función $y = -\sin(x)$ se anula en los mismos puntos $x = k\pi$ que $y = \sin(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $-0 = 0$, conservando las intersecciones con el eje X.'
  - titulo: 'Inversión completa de ciclo'
    enunciado: '¿Un reflejo vertical transforma las crestas en valles y los valles en crestas?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la definición geométrica de la reflexión respecto al eje de la línea media.'
  - titulo: 'Conservación del período'
    enunciado: '¿La función $y = -\cos(x)$ mantiene el mismo período $2\pi$ que la función $y = \cos(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la reflexión vertical no altera la longitud del ciclo horizontal.'
errores_frecuentes:
  - 'La afirmación de que si el parámetro $A$ es negativo, la amplitud de la oscilación es una cantidad negativa.'
  - 'La afirmación de que un signo negativo en el coeficiente $A$ desplaza la gráfica de la función hacia la izquierda.'
  - 'La afirmación de que la reflexión vertical cambia el período fundamental de la onda.'
  - 'La afirmación de que los ceros de la función senoidal cambian de lugar cuando $A$ es negativo.'
  - 'La afirmación de que la función $y = -\cos(x)$ comienza en el origen de coordenadas $(0,0)$.'
afirmaciones_verdaderas:
  - 'Cuando el coeficiente $A$ es negativo ($A < 0$), la gráfica trigonométrica sufre una reflexión vertical respecto a su línea media, invirtiendo crestas por valles.'
  - 'La reflexión vertical provocada por $A < 0$ no altera la magnitud positiva de la amplitud $|A|$ ni la longitud del período $T = \frac{2\pi}{|B|}$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y graficar el efecto de la reflexión vertical cuando el coeficiente $A$ es negativo ($A < 0$).
  CÓMO: Invertir verticalmente la posición de crestas y valles respecto a la línea media manteniendo $|A|$ como amplitud positiva.
