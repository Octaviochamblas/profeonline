semantic_id: MAT.GEO.ANGULOS_RELACIONES_POSICION.OPUESTOS_VERTICE_DEFINICION
resumen_inicial: Dos ángulos son opuestos por el vértice cuando comparten el mismo
  vértice y los lados de uno son las semirrectas opuestas (prolongaciones) de los
  lados del otro.
explicacion_simple: '![Identificación de Opuestos por el Vértice](/static/img/nodos/identificacion-de-angulos-opuestos-por-el-vertice-intro.svg)


  Dibuja una letra "X" grande con dos líneas rectas que se cruzan. Se forman cuatro
  ángulos: los dos que están frente a frente (el de arriba con el de abajo, y el de
  la izquierda con el de la derecha) se llaman ángulos opuestos por el vértice.'
explicacion_formal: '### Definición formal

  Dos ángulos $\angle AOB$ y $\angle COD$ son **opuestos por el vértice** si los lados
  de uno son los rayos opuestos o prolongaciones colineales de los lados del otro:


  $$\vec{OC} = -\vec{OA} \quad \land \quad \vec{OD} = -\vec{OB}$$


  $$\overleftrightarrow{AC} \cap \overleftrightarrow{BD} = \{O\}$$


  ### Desglose simbólico y geométrico

  - Rectas secantes: Se forman exactamente dos pares de ángulos opuestos por el vértice
  al cruzarse dos rectas en $O$.

  - Posición especular: Los ángulos se miran frente a frente a través del vértice
  central $O$.


  ### Síntesis didáctica

  Identificar ángulos opuestos por el vértice permite reconocer pares de ángulos simétricos
  en cualquier configuración de líneas que se intersectan.'
definiciones_clave: '- **Ángulos opuestos por el vértice**: Pareja de ángulos no adyacentes
  formados por el cruce de dos rectas secantes.

  - **Rectas secantes**: Dos rectas que se cortan en un único punto en el plano. '
propiedades_relaciones: '- **Formación en parejas**: Al cortarse dos rectas secantes
  se originan exactamente dos parejas de ángulos opuestos por el vértice.

  - **No adyacencia**: Los ángulos de un par opuesto por el vértice nunca comparten
  un lado común. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Identificación de Opuestos](/static/img/nodos/identificacion-de-angulos-opuestos-por-el-vertice-ejemplos.svg)


    Dos rectas $L_1$ y $L_2$ se cortan en el punto $O$, numerándose consecutivamente
    los ángulos como $1, 2, 3, 4$ en sentido antihorario. Identifica cuáles pares
    de ángulos son opuestos por el vértice.'
  pasos:
  - 'Paso 1: Observar que los ángulos $1$ y $2$ son contiguos (adyacentes), al igual
    que $2$ y $3$, $3$ y $4$, y $4$ y $1$.'
  - 'Paso 2: Identificar los ángulos enfrentados que no comparten lado.'
  - 'Paso 3: Determinar el primer par enfrentado: el ángulo $1$ es opuesto por el
    vértice al ángulo $3$.'
  - 'Paso 4: Determinar el segundo par enfrentado: el ángulo $2$ es opuesto por el
    vértice al ángulo $4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se forman los ángulos opuestos por el vértice?
  choices:
  - text: Al cortarse dos rectas secantes, formando parejas de ángulos enfrentados
    is_correct: true
  - text: Al dividir un ángulo recto en dos partes iguales
    is_correct: false
  - text: Al colocar dos ángulos sobre una recta en forma de par lineal
    is_correct: false
  - text: Al sumar tres ángulos cualesquiera
    is_correct: false
  explanation: Se generan al cortarse dos rectas secantes, formando parejas de ángulos
    enfrentados.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el cruce de dos rectas con ángulos numerados 1, 2, 3, 4 en orden circular,
    ¿cuál es el ángulo opuesto al ángulo 2?
  choices:
  - text: El ángulo 4 (el ángulo enfrentado directamente)
    is_correct: true
  - text: El ángulo 1 (el ángulo adyacente)
    is_correct: false
  - text: El ángulo 3 (el ángulo contiguo)
    is_correct: false
  - text: Ninguno de los anteriores
    is_correct: false
  explanation: El ángulo opuesto a 2 en el cruce es el ángulo 4 (el ángulo enfrentado
    directamente).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la intersección de dos líneas rectas continuas.'
- 'Paso 2: Localizar los ángulos no adyacentes situados uno frente al otro.'
- 'Paso 3: Clasificar como par de ángulos opuestos por el vértice.'
errores_correccion: No confundas los ángulos opuestos por el vértice (enfrentados)
  con los ángulos contiguos (adyacentes).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si dos rectas se cruzan y se forman los ángulos $\angle A, \angle B,
    \angle C, \angle D$ en orden circular, ¿qué par es opuesto por el vértice?
  alternativas:
  - $\angle A$ y $\angle C$
  - $\angle A$ y $\angle B$
  - $\angle B$ y $\angle C$
  respuesta: $\angle A$ y $\angle C$
  solucion_pasos:
  - $\angle A$ y $\angle C$ están enfrentados en el cruce, por lo que son opuestos
    por el vértice.
- titulo: Ejemplo 2
  enunciado: ¿Cuántos pares de ángulos opuestos por el vértice se forman al cruzar
    dos rectas secantes?
  alternativas:
  - 2 pares
  - 4 pares
  - 1 par
  respuesta: 2 pares
  solucion_pasos:
  - Se forman 4 ángulos que constituyen exactamente 2 pares de ángulos opuestos.
- titulo: ¿Dos ángulos opuestos por el vértice comparten un lado común?
  respuesta: 'No'
  solucion_pasos:
  - No, solo comparten el vértice; sus lados son prolongaciones opuestas.
- titulo: ¿Dos rectas secantes forman ángulos opuestos por el vértice?
  respuesta: Sí
  solucion_pasos:
  - Sí, la intersección de dos rectas secantes siempre genera dos pares de opuestos.
errores_frecuentes:
- Confundir ángulos opuestos por el vértice con ángulos adyacentes contiguos.
- Identificar pares opuestos en rayos que no forman líneas rectas continuas.
- Creer que se forman 4 pares en vez de 2 pares de ángulos opuestos.
- Pensar que los ángulos opuestos deben ser rectos.
- Olvidar que comparten el mismo vértice central.
afirmaciones_verdaderas:
- Dos rectas secantes forman exactamente 2 pares de ángulos opuestos por el vértice.
- Los lados de los ángulos opuestos por el vértice son semirrectas opuestas.
al_terminar_debes_poder: '**QUÉ:** Identificar y señalar visual y formalmente parejas
  de ángulos opuestos por el vértice.


  **CÓMO:** Reconociendo el cruce de rectas secantes y seleccionando los ángulos no
  adyacentes enfrentados.


  ![Resumen de Identificación de Opuestos](/static/img/nodos/identificacion-de-angulos-opuestos-por-el-vertice-resumen.svg)'
