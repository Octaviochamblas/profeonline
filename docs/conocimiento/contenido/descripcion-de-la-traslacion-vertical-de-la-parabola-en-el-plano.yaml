semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.TRASLACION_VERTICAL
resumen_inicial: 'La traslación vertical desplaza rígidamente la gráfica de una función cuadrática a lo largo del eje $y$ mediante la transformación $g(x) = f(x) + k$, modificando su conjunto recorrido.'
explicacion_simple: |
  La traslación vertical consiste en subir o bajar toda la parábola como un ascensor sobre el eje vertical $y$. Si le sumamos un número positivo a la función, como en $g(x) = x^2 + 5$, la gráfica sube 5 unidades. Si le restamos un número, como en $g(x) = x^2 - 3$, la gráfica baja 3 unidades. El ancho, la concavidad y el eje de simetría no cambian, pero el vértice sube o baja.
explicacion_formal: |
  ### Definición formal
  Dada la función cuadrática $f(x) = ax^2 + bx + c$, la **traslación vertical** por un vector $(0, k)$ genera la nueva función $g: \mathbb{R} \to \mathbb{R}$ definida por:
  $$g(x) = f(x) + k = ax^2 + bx + (c + k)$$

  ### Desglose simbólico
  - **Si $k > 0$**: La gráfica se traslada $k$ unidades hacia **arriba** (sentido positivo del eje $y$).
  - **Si $k < 0$**: La gráfica se traslada $|k|$ unidades hacia **abajo** (sentido negativo del eje $y$).
  - Desplazamiento del vértice: $V(h, k_0) \to V'(h, k_0 + k)$.
  - Modificación del recorrido: Si $a > 0$, $\operatorname{Rec}(g) = [k_0 + k, +\infty[$. Si $a < 0$, $\operatorname{Rec}(g) = ]-\infty, k_0 + k]$.

  ### Síntesis didáctica
  A diferencia de la traslación horizontal, la constante $k$ se suma directamente al resultado final de la función $f(x)$. Por esta razón, su efecto gráfico es intuitivo: la suma eleva la curva y la resta la desciende.
definiciones_clave: |
  - **Traslación vertical**: Transformación isométrica que desplaza la parábola a lo largo del eje de las ordenadas.
  - **Transformación $f(x) + k$**: Adición directa de la constante $k$ a la variable dependiente $y$.
  - **Reorganización del recorrido**: Cambio directo de los límites del conjunto de salidas de la función.
propiedades_relaciones: |
  - **Invariancia del eje de simetría**: Subir o bajar la parábola no altera la recta del eje de simetría: $x = h$ se mantiene idéntico.
  - **Alteración de los ceros de la función**: Trasladar verticalmente una parábola puede hacer que gane o pierda cortes con el eje $x$ (ej: si $y = x^2$ sube 4 unidades a $y = x^2 + 4$, pierde sus cortes reales).
ejemplo_guiado:
  enunciado: 'Dada la función $f(x) = -2x^2$, describe la traslación geométrica sufrida por $g(x) = -2x^2 + 6$, calcula su nuevo vértice y determina su conjunto recorrido.'
  pasos:
    - 'Paso 1: Identificamos la transformación estructural $g(x) = f(x) + 6$, con $k = 6 > 0$.'
    - 'Paso 2: Concluimos que la parábola $f(x) = -2x^2$ se desplaza rígidamente 6 unidades hacia arriba a lo largo del eje $y$.'
    - 'Paso 3: El vértice original $V(0,0)$ sube a la nueva posición $V(0, 6)$.'
    - 'Paso 4: Dado que $a = -2 < 0$, la curva abre hacia abajo y alcanza su punto máximo en $y = 6$. Su recorrido es $\operatorname{Rec}(g) = ]-\infty, 6]$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la gráfica de la parábola $f(x) = x^2 - 4x$ se desplaza 7 unidades hacia abajo a lo largo del eje $y$, ¿cuál es la regla algebraica de la función resultante $g(x)$?'
    choices:
      - {text: '$g(x) = x^2 - 4x - 7$', is_correct: true}
      - {text: '$g(x) = x^2 - 4x + 7$', is_correct: false}
      - {text: '$g(x) = (x - 7)^2 - 4x$', is_correct: false}
      - {text: '$g(x) = x^2 - 11x$', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = x^2 - 4x - 7$''. Restar 7 unidades directamente al final de la función genera una traslación vertical hacia abajo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'La función $f(x) = x^2$ tiene recorrido $[0, +\infty[$. Si aplicamos la transformación $g(x) = f(x) - 9 = x^2 - 9$, ¿cuál es el nuevo recorrido de $g(x)$?'
    choices:
      - {text: '$\operatorname{Rec}(g) = [-9, +\infty[$', is_correct: true}
      - {text: '$\operatorname{Rec}(g) = [9, +\infty[$', is_correct: false}
      - {text: '$\operatorname{Rec}(g) = [0, +\infty[$', is_correct: false}
      - {text: '$\operatorname{Rec}(g) = ]-\infty, -9]$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\operatorname{Rec}(g) = [-9, +\infty[$''. El vértice baja a $(0, -9)$, desplazando la cota inferior del recorrido a $-9$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la constante libre $k$ sumada o restada al final de la regla funcional cuadrática.'
  - 'Paso 2: Si $k > 0$, desplazar toda la parábola $k$ unidades hacia arriba sobre el eje $y$. Si $k < 0$, desplazar $|k|$ unidades hacia abajo.'
  - 'Paso 3: Actualizar las coordenadas del vértice a $V(h, k_0 + k)$ y ajustar el intervalo del recorrido.'
errores_correccion: |
  - **Error 1:** Modificar la recta del eje de simetría al aplicar una traslación vertical. **Cómo corregirlo:** La traslación vertical sólo desplaza puntos a lo largo del eje $y$. El eje de simetría $x = h$ es una recta vertical que no se altera al subir o bajar la curva.
  - **Error 2:** Invertir el sentido del movimiento creyendo que $+k$ baja la función. **Cómo corregirlo:** A diferencia de la traslación horizontal, la traslación vertical sigue el sentido intuitivo directo del signo: $+k$ sube la gráfica y $-k$ la baja.
ejemplos:
  - titulo: 'Traslación vertical hacia arriba'
    enunciado: '¿Hacia dónde se desplaza $f(x) = x^2$ para formar $g(x) = x^2 + 3$?'
    alternativas:
      - '3 unidades hacia arriba'
      - '3 unidades hacia abajo'
      - '3 unidades hacia la derecha'
    respuesta: '3 unidades hacia arriba'
    solucion_pasos:
      - '1. La transformación es de la forma $g(x) = f(x) + 3$.'
      - '2. La adición externa de $+3$ eleva la parábola 3 unidades hacia arriba.'
  - titulo: 'Vértice en traslación vertical'
    enunciado: '¿Cuáles son las coordenadas del vértice de $f(x) = 4x^2 - 5$?'
    alternativas:
      - '$V(0, -5)$'
      - '$V(-5, 0)$'
      - '$V(0, 5)$'
    respuesta: '$V(0, -5)$'
    solucion_pasos:
      - '1. La función es una traslación vertical con $h = 0$ y $k = -5$.'
      - '2. El vértice se ubica en $V(0, -5)$.'
  - titulo: 'Conservación del ancho y concavidad'
    enunciado: '¿La traslación vertical altera la apertura de los brazos de la parábola?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Es una transformación isométrica rígida, por lo que las ramas conservan la misma apertura e inclinación.'
  - titulo: 'Cambio en las raíces'
    enunciado: 'Si desplazamos la parábola $f(x) = x^2 - 4$ en 4 unidades hacia arriba obteniendo $g(x) = x^2$, ¿la función $g(x)$ pasa a tener una sola raíz real?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $f(x) = x^2 - 4$ tenía dos raíces en $x = \pm 2$. Al subir 4 unidades a $g(x) = x^2$, apoya su vértice en el origen teniendo una sola raíz doble en $x = 0$.'
errores_frecuentes:
  - 'La función $g(x) = x^2 + 4$ se obtiene desplazando la gráfica de $f(x) = x^2$ en 4 unidades hacia la derecha.'
  - 'Una traslación vertical modifica la recta del eje de simetría de la parábola.'
  - 'En la función $f(x) = -3x^2 - 2$, el vértice se ubica en la posición $V(-2, 0)$.'
  - 'Sumar una constante $+k$ a la función hace que las ramas de la parábola abran hacia abajo.'
  - 'La traslación vertical no modifica el conjunto recorrido de la función cuadrática.'
afirmaciones_verdaderas:
  - 'La traslación vertical $g(x) = f(x) + k$ desplaza la gráfica a lo largo del eje $y$ manteniendo inalterado el eje de simetría $x = h$.'
  - 'La traslación vertical altera las coordenadas del vértice a $V(h, k)$ y modifica las cotas del conjunto recorrido.'
al_terminar_debes_poder: 'Describir y graficar la traslación vertical de una parábola identificando sus efectos sobre el vértice y el recorrido.'
