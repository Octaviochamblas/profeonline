semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.TRASLACION_VERTICAL
resumen_inicial: La traslación vertical de la parábola transforma la función $y = ax^2$ en $g(x) = ax^2 + k$, desplazando rígidamente toda la gráfica $k$ unidades a lo largo del eje $Y$, situando el vértice en $(0, k)$ y modificando el recorrido.
explicacion_simple: "![La traslación vertical de la parábola transforma la función $y = ax^2$ en $g(x) = ax^2 + k$, desplazando rígidamente toda la gráfica $k$ unidades a lo largo del eje $Y$, situando el vértice en $(0, k)$ y modificando el recorrido](/static/img/nodos/descripcion-de-la-traslacion-vertical-de-la-parabola-en-el-plano-intro.svg)\n\n\nLa **traslación vertical** es el movimiento más directo e intuitivo: es como subir o bajar en un ascensor:\n\n- **¿Cómo se escribe?** Sumando o restando un número suelto al final de la función:\n  $$g(x) = ax^2 + k$$\n- **¿Hacia dónde se mueve?** (¡Sigue exactamente el signo que ves!)\n  - Si tienes $g(x) = x^2 + 5 \\implies$ la parábola sube **5 unidades hacia ARRIBA** (vértice en $(0, 5)$).\n  - Si tienes $g(x) = x^2 - 8 \\implies$ la parábola baja **8 unidades hacia ABAJO** (vértice en $(0, -8)$).\n- **El recorrido cambia de inmediato:** Si subes la parábola a $+5$, el nuevo recorrido es $[5, +\\infty[$."
explicacion_formal: "Sea $f(x) = ax^2$ ($a \\neq 0$) y sea el vector de traslación vertical $\\vec{w} = (0, k) \\in \\mathbb{R}^2$. La **acción del operador aditivo vertical** $\\mathcal{A}_k$ define:\n$$g(x) = f(x) + k = ax^2 + k$$\n\n**Propiedades analíticas**:\n1. **Invarianza del eje de simetría**: Como la traslación es puramente ortogonal al eje $X$, el eje de simetría sigue siendo la recta $x = 0$ (el eje $Y$).\n2. **Traslación del extremo**: $g(0) = a(0)^2 + k = k \\implies V(0, k)$.\n3. **Corte directo con el eje Y**: El punto de corte es idénticamente $(0, k)$.\n4. **Modificación del conjunto imagen**:\n   $$\\text{Rec}(g) = \\begin{cases} [k, +\\infty[ & \\text{si } a > 0 \\\\ ]-\\infty, k] & \\text{si } a < 0 \\end{cases}$$"
definiciones_clave: '- **Traslación vertical**: Desplazamiento paralelo al eje de ordenadas mediante la adición de una constante $f(x) \mapsto f(x) + k$.

  - **Cota vertical trasladada**: Nuevo extremo global $y_v = k$.'
propiedades_relaciones: '- **Signo directo**: $+k$ desplaza hacia arriba; $-k$ desplaza hacia abajo (sin inversión de signos).

  - **Efecto sobre las intersecciones con el eje X**: Si $a > 0$ y $k > 0$, la parábola no corta al eje $X$ ($\Delta < 0$); si $a > 0$ y $k < 0$, corta en dos puntos simétricos $x = \pm \sqrt{-k/a}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La traslación vertical de la parábola transforma la función $y = ax^2$ en $g(x) = ax^2 + k$, desplazando rígidamente toda la gráfica $k$ unidades a lo largo del eje $Y$, situando el vértice en $(0, k)$ y modificando el recorrido](/static/img/nodos/descripcion-de-la-traslacion-vertical-de-la-parabola-en-el-plano-ejemplos.svg)



    Analiza la transformación de $y = -2x^2$ al convertirse en $g(x) = -2x^2 + 8$, determinando su vértice, eje de simetría, recorrido y cortes con el eje X.'
  pasos:
  - 'Paso 1: Identificar la transformación: La función $y = -2x^2$ tiene una constante exterior sumada $k = 8$.

    - La parábola se traslada **8 unidades hacia arriba**.'
  - 'Paso 2: Vértice y eje de simetría:

    - Vértice: $V(0, 8)$.

    - Eje de simetría: $x = 0$ (eje $Y$).'
  - 'Paso 3: Recorrido:

    - Como $a = -2 < 0$, abre hacia abajo $\implies \text{Rec}(g) = ]-\infty, 8]$.'
  - 'Paso 4: Cortes con el eje X:

    $-2x^2 + 8 = 0 \implies 2x^2 = 8 \implies x^2 = 4 \implies x = \pm 2$.

    - Cortes en $(-2, 0)$ y $(2, 0)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el recorrido de la función cuadrática $f(x) = 3x^2 - 7$?
  choices:
  - text: '[-7, +∞['
    is_correct: true
  - text: '[7, +∞['
    is_correct: false
  - text: ']-∞, -7]'
    is_correct: false
  - text: '[0, +∞['
    is_correct: false
  explanation: La alternativa correcta es '[-7, +∞['. Al ser $a = 3 > 0$, la parábola abre hacia arriba desde su vértice en $(0, -7)$, dando $\text{Rec}(f) = [-7, +\infty[$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola con $a = 1$ tiene vértice en $(0, 4)$, ¿cuántos cortes reales tiene con el eje X?
  choices:
  - text: 0 cortes (no corta al eje X porque su mínimo es 4 > 0)
    is_correct: true
  - text: 2 cortes
    is_correct: false
  - text: 1 corte
    is_correct: false
  - text: Infinitos cortes
    is_correct: false
  explanation: La alternativa correcta es '0 cortes (no corta al eje X porque su mínimo es 4 > 0)'. Al abrir hacia arriba desde $y = 4$, la curva nunca baja a $y = 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la constante exterior $k$ en $g(x) = ax^2 + k$.'
- 'Paso 2: Si $k > 0$, desplazar la curva hacia arriba; si $k < 0$, desplazarla hacia abajo.'
- 'Paso 3: Fijar el vértice en $(0, k)$.'
- 'Paso 4: Formular el recorrido según la concavidad: $[k, +\infty[$ si $a > 0$ o $]-\infty, k]$ si $a < 0$.'
errores_correccion: '- **Error común:** Invertir el signo de $k$ pensando que funciona como la traslación horizontal.

  - **Cómo corregirlo:** La traslación vertical **conserva su signo idéntico**: $+k$ sube y $-k$ baja.'
ejemplos:
- titulo: 'Ejemplo 1: Traslación hacia arriba'
  enunciado: En $f(x) = x^2 + 9$, ¿dónde está el vértice?
  alternativas:
  - V(0, 9)
  - V(0, -9)
  - V(9, 0)
  - V(-9, 0)
  respuesta: V(0, 9)
  solucion_pasos:
  - 'Paso 1: $h = 0, k = 9 \implies V(0, 9)$.'
- titulo: 'Ejemplo 2: Traslación hacia abajo'
  enunciado: ¿Qué función resulta de trasladar $y = -x^2$ en 6 unidades hacia abajo?
  alternativas:
  - y = -x^2 - 6
  - y = -x^2 + 6
  - y = -(x - 6)^2
  - y = -(x + 6)^2
  respuesta: y = -x^2 - 6
  solucion_pasos:
  - 'Paso 1: Restar 6 a la función: $y = -x^2 - 6$.'
- titulo: 'Ejemplo 3: Recorrido acotado'
  enunciado: Para $g(x) = -4x^2 - 5$, ¿cuál es el recorrido?
  alternativas:
  - ']-inf, -5]'
  - '[-5, +inf['
  - ']-inf, 0]'
  - '[-4, +inf['
  respuesta: ']-inf, -5]'
  solucion_pasos:
  - 'Paso 1: $a = -4 < 0 \implies ]-\infty, -5]$.'
- titulo: 'Ejemplo 4: Intersección con el eje Y'
  enunciado: ¿Dónde corta al eje Y la parábola $h(x) = 7x^2 - 13$?
  alternativas:
  - (0, -13)
  - (0, 13)
  - (-13, 0)
  - (7, -13)
  respuesta: (0, -13)
  solucion_pasos:
  - 'Paso 1: $f(0) = -13 \implies (0, -13)$.'
errores_frecuentes:
- Cambiar el signo de k al determinar las coordenadas del vértice.
- Confundir la traslación vertical con una traslación horizontal.
- Olvidar que el eje de simetría permanece en x = 0.
afirmaciones_verdaderas:
- La función g(x) = ax² + k tiene su vértice en el punto (0, k).
- La traslación vertical no altera la ecuación del eje de simetría x = 0.
al_terminar_debes_poder: '**QUÉ:** Describir y formular la traslación vertical de una parábola.


  **CÓMO:** Identificando el término independiente k en g(x) = ax² + k para trasladar el vértice a (0, k) y delimitar el recorrido.


