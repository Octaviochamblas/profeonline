semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.TRASLACION_VERTICAL
resumen_inicial: La traslación vertical desplaza la parábola $y = ax^2$ a lo largo del eje Y al sumar o restar una constante $k$, obteniendo $g(x) = ax^2 + k$.
explicacion_simple: |
  Una **traslación vertical** mueve toda la curva de la parábola hacia arriba o hacia abajo sin cambiar su forma ni su abertura:

  $$g(x) = f(x) + k = ax^2 + k$$

  - **Si $k > 0$ (Positivo)**: La parábola sube **$k$ unidades** hacia arriba.
    - El vértice se desplaza de $(0,0)$ a **$(0, k)$**.
  - **Si $k < 0$ (Negativo)**: La parábola baja **$|k|$ unidades** hacia abajo.
    - El vértice se desplaza de $(0,0)$ a **$(0, -|k|)$**.

  **Ejemplo**:
  - $g(x) = x^2 + 4$: La parábola madre $y = x^2$ sube 4 unidades (vértice en $(0, 4)$).
  - $h(x) = x^2 - 3$: La parábola madre $y = x^2$ baja 3 unidades (vértice en $(0, -3)$).
explicacion_formal: |
  Dada la función cuadrática madre $f(x) = ax^2$, la transformación geométrica de **traslación vertical** por un vector desplazamiento $\vec{v} = (0, k)$ define la nueva función $g: \mathbb{R} \to \mathbb{R}$:

  $$g(x) = f(x) + k = ax^2 + k \quad \text{con } k \in \mathbb{R}$$

  **Propiedades geométricas invariantes y variantes:**
  1. **Invariantes:** La abertura ($|a|$), la orientación de las ramas ($\text{sgn}(a)$) y el eje de simetría ($x = 0$) permanecen inalterados.
  2. **Variantes:** El vértice cambia de $V_0(0,0)$ a $V_g(0, k)$ y el recorrido pasa a ser $[k, +\infty)$ si $a > 0$ o $(-\infty, k]$ si $a < 0$.
definiciones_clave: |
  - **Traslación vertical**: Desplazamiento rígido paralelo al eje Y que transforma la función $f(x)$ en $f(x) + k$.
propiedades_relaciones: |
  - **Coincidencia con el corte en Y**: En la función trasladada verticalmente $g(x) = ax^2 + k$, el parámetro $k$ coincide exactamente con la ordenada del punto de corte $(0, k)$ con el eje Y.
ejemplo_guiado:
  enunciado: 'Describe el desplazamiento geométrico aplicado a $f(x) = x^2$ para obtener $g(x) = x^2 - 7$ e indica las coordenadas de su nuevo vértice.'
  pasos:
    - 'Paso 1: Identificar la constante agregada a la función: $k = -7$.'
    - 'Paso 2: Reconocer la dirección del movimiento: por ser $k = -7 < 0$, es una traslación vertical hacia abajo.'
    - 'Paso 3: Determinar la magnitud: el gráfico baja 7 unidades respecto al origen.'
    - 'Paso 4: Formular el nuevo vértice: el vértice pasa de $(0,0)$ a $V(0, -7)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la parábola $f(x) = 3x^2$ se traslada 5 unidades hacia arriba en el plano cartesiano, ¿cuál es la ecuación de la función resultante?'
    choices:
      - {text: '$g(x) = 3x^2 + 5$', is_correct: true}
      - {text: '$g(x) = 3(x + 5)^2$.', is_correct: false}
      - {text: '$g(x) = 3(x - 5)^2$.', is_correct: false}
      - {text: '$g(x) = 15x^2$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = 3x^2 + 5$''. La traslación vertical de $k$ unidades hacia arriba suma $k$ directamente a la función.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué elemento geométrico de la gráfica de la parábola NO cambia durante una traslación vertical $g(x) = ax^2 + k$?'
    choices:
      - {text: 'El eje de simetría de la parábola ($x = 0$)', is_correct: true}
      - {text: 'La ordenada del vértice $y_v$.', is_correct: false}
      - {text: 'El punto de corte con el eje Y.', is_correct: false}
      - {text: 'El recorrido o rango de la función.', is_correct: false}
    explanation: 'La alternativa correcta es ''El eje de simetría de la parábola ($x = 0$)''. El eje sigue siendo $x = 0$ pues el movimiento es solo vertical.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Aislar la constante $k$ sumada o restada fuera de la variable cuadrática.'
  - 'Paso 2: Si $k > 0$, declarar una traslación vertical de $k$ unidades hacia arriba.'
  - 'Paso 3: Si $k < 0$, declarar una traslación vertical de $|k|$ unidades hacia abajo.'
  - 'Paso 4: Actualizar las coordenadas del vértice a $V(0, k)$ y el recorrido de la función.'
errores_correccion: |
  - **Error común:** Confundir la traslación vertical $f(x) + k$ con la traslación horizontal $f(x + k)$.
  - **Cómo corregirlo:** Si la constante está **AFUERA DE LA VARIABLE** ($x^2 + k$), es traslación **VERTICAL**; si está dentro del paréntesis de la variable $((x+k)^2$), es traslación horizontal.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Traslación hacia arriba.
    alternativas:
      - 'Desplazamiento 6 unidades hacia arriba, V(0, 6)'
      - 'Desplazamiento 6 unidades hacia la derecha'
      - 'Desplazamiento 6 unidades hacia abajo'
    respuesta: 'Desplazamiento 6 unidades hacia arriba, V(0, 6)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Traslación hacia abajo.
    alternativas:
      - 'Desplazamiento 2 unidades hacia abajo, V(0, -2)'
      - 'Desplazamiento 2 unidades hacia la izquierda'
      - 'Desplazamiento 2 unidades hacia arriba'
    respuesta: 'Desplazamiento 2 unidades hacia abajo, V(0, -2)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $g(x) = x^2 + 3$, es correcto afirmar que la parábola se desplaza 3 unidades a la derecha.'
  - 'La adición de la constante $k$ fuera de la expresión cuadrática altera el valor del eje de simetría vertical de la parábola.'
  - 'La suposición de que traslaciones hacia arriba alteran la concavidad o la abertura de las ramas de la curva.'
  - 'Equiparar el desplazamiento vertical $k$ con una dilatación o estiramiento de la función.'
  - 'Afirmar que una traslación vertical hacia abajo con $k < 0$ exige que el discriminante sea obligatoriamente negativo.'
afirmaciones_verdaderas:
  - 'La traslación vertical $g(x) = ax^2 + k$ desplaza la gráfica $k$ unidades hacia arriba si $k > 0$ o hacia abajo si $k < 0$.'
  - 'Durante una traslación vertical estricta, el eje de simetría $x = 0$ y el parámetro de abertura $a$ se mantienen totalmente inalterados.'
al_terminar_debes_poder: |
  QUÉ: Describir y aplicar traslaciones verticales en la gráfica de una función cuadrática.
  CÓMO: Identificar la constante $k$ fuera del término cuadrático, determinar dirección y magnitud, y actualizar el vértice $V(0, k)$.
