semantic_id: MAT.ALG.FUNC_CUADR_TRANSFORMACIONES.TRASLACION_VERTICAL
resumen_inicial: 'Descripción de la traslación vertical de la parábola en el plano:
  parábola, vértice, concavidad y formas de Traslaciones y transformaciones.'
explicacion_simple: Además de deslizarse horizontalmente, la parábola puede subir
  o bajar en el plano, y este movimiento se controla con un parámetro distinto, sumado
  fuera del binomio al cuadrado.
explicacion_formal: '### Definición formal


  Dada $f(x)=x^2$, la función $g(x)=f(x)+k=x^2+k$ representa una traslación vertical
  de la gráfica de $f$ en $k$ unidades. Cada punto $(x,y)$ de la gráfica original
  se traslada a $(x,y+k)$ en la nueva gráfica.


  ### Desarrollo didáctico


  A diferencia de la traslación horizontal, el signo de $k$ se interpreta directamente:
  positivo sube la gráfica, negativo la baja, sin necesidad de reescribir nada.


  La gráfica de $g(x)=x^2-4$ es idéntica a la de $f(x)=x^2$, pero desplazada $4$ unidades
  hacia abajo, con vértice en $(0,-4)$ en vez de $(0,0)$.'
definiciones_clave: '- **Descripción de la traslación vertical de la parábola en el
  plano**: Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  descripción de la traslación vertical de la parábola en el plano.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando descripción
    de la traslación vertical de la parábola en el plano.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a descripción
    de la traslación vertical de la parábola en el plano.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
