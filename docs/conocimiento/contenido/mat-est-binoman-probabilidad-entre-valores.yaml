semantic_id: MAT.EST.BINOMIAL_ANALISIS.PROBABILIDAD_ENTRE_VALORES
titulo: Calcular la probabilidad de que X esté entre dos valores
objetivo: Calcular la probabilidad de que el número de éxitos se encuentre dentro
  de un rango específico, entre dos valores a y b.
introduccion: Muchos problemas piden la probabilidad de un rango de resultados (por
  ejemplo, 'entre 3 y 5 éxitos'), lo que requiere sumar las probabilidades puntuales
  de ese intervalo.
resumen: La probabilidad de que $X$ esté entre $a$ y $b$ (inclusive) es $P(a\leq X\leq
  b)=\sum_{i=a}^{b}P(X=i)$.
explicacion: '![Probabilidad entre dos valores](/static/img/probabilidad/binoman/binoman-probabilidad-entre-valores.svg)


  ### Definición formal


  $P(a\leq X\leq b)=P(X=a)+P(X=a+1)+\cdots+P(X=b)$, sumando todas las probabilidades
  puntuales dentro del intervalo cerrado.


  ### Desarrollo didáctico


  Si $X\sim B(5;\,0{,}4)$, la probabilidad de obtener entre 2 y 3 éxitos es $P(2\leq
  X\leq3)=P(X=2)+P(X=3)$, sumando ambos valores puntuales calculados con la fórmula
  binomial.'
procedimiento:
- 'Paso 1: Identifica los valores límite a y b del rango preguntado (ambos inclusive).'
- 'Paso 2: Calcula P(X=i) para cada valor entero i entre a y b.'
- 'Paso 3: Suma todos esos valores para obtener P(a≤X≤b).'
ejemplos:
- titulo: Calcular P(2≤X≤3) con X~B(5; 0,4)
  enunciado: n=5, p=0,4, rango de 2 a 3.
  solucion_pasos:
  - P(X=2)=C(5,2)×0,4²×0,6³=10×0,16×0,216=0,3456. P(X=3)=C(5,3)×0,4³×0,6²=10×0,064×0,36=0,2304.
    P(2≤X≤3)=0,3456+0,2304=0,576.
- titulo: Calcular P(1≤X≤2) con X~B(4; 0,25)
  enunciado: n=4, p=0,25, rango de 1 a 2.
  solucion_pasos:
  - P(X=1)=C(4,1)×0,25×0,75³=4×0,25×0,421875=0,421875. P(X=2)=C(4,2)×0,25²×0,75²=6×0,0625×0,5625≈0,2109.
    P(1≤X≤2)≈0,421875+0,2109=0,6328.
- titulo: ¿El rango a≤X≤b incluye ambos extremos a y b?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un intervalo cerrado que incluye tanto el valor a como el valor b.
- titulo: '¿Se puede calcular P(a≤X≤b) restando dos probabilidades acumuladas: P(X≤b)-P(X≤a-1)?'
  respuesta: Sí
  solucion_pasos:
  - Sí, es una forma alternativa y a veces más eficiente de calcular la probabilidad
    de un rango.
errores_frecuentes:
- Omitir incluir alguno de los extremos del rango (a o b) en la suma.
- Declarar el rango cerrado [a,b] con un rango abierto que excluye alguno de los extremos.
- Cometer errores aritméticos al sumar varias probabilidades puntuales calculadas
  por separado.
fuente: 'Elaboración propia (referencia: Moraleja 306).'
estado: publicado
