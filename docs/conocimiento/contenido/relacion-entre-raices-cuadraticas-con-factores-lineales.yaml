semantic_id: MAT.ALG.FACTOR_TRINOMIOS.RAICES_FACTORES_CUADRATICOS
resumen_inicial: La relación entre raíces cuadráticas y factores lineales (Teorema del Factor) establece que si $x = x_1$
  es una raíz de $P(x) = 0$, entonces $(x - x_1)$ es un factor lineal divisible del polinomio.
explicacion_simple: "Existe un vínculo directo e inquebrantable entre la **solución (raíz)** de una ecuación cuadrática y\
  \ sus **factores algebraicos**:\n- **TEOREMA DEL FACTOR**:\n  - Si la solución de la ecuación $x^2 - 5x + 6 = 0$ es **$x\
  \ = 2$**, al pasar el 2 restando obtienes el factor: **$(x - 2)$**.\n  - Si la otra solución es **$x = 3$**, al pasar el\
  \ 3 restando obtienes el factor: **$(x - 3)$**.\n  - ¡Unes ambos factores y tienes la expresión factorizada completa!:\n\
  \    $$x^2 - 5x + 6 = \\mathbf{(x - 2)(x - 3)}$$\n- **Fórmula General para $ax^2 + bx + c$ con raíces $x_1, x_2$**:\n  $$\\\
  mathbf{ax^2 + bx + c = a(x - x_1)(x - x_2)}$$\n- ¡Atención! No olvides incluir el coeficiente principal **$a$** delante\
  \ de las raíces.\n\n![Relación entre raíces y factores lineales](/static/img/nodos/relacion-entre-raices-cuadraticas-con-factores-lineales-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea el polinomio cuadrático $P(x) = ax^2 + bx + c \in \mathbb{C}[x]$ con $a \neq 0$. Por el **Teorema Fundamental del Álgebra**
  y el **Teorema del Factor**, $x_1, x_2 \in \mathbb{C}$ son raíces de la ecuación $P(x) = 0$ (es decir, $P(x_1) = 0$ y $P(x_2)
  = 0$) si y sólo si el polinomio se descompone en el producto de factores lineales:


  $$\mathbf{P(x) = a(x - x_1)(x - x_2)}$$


  ### Relaciones de Viète

  Las raíces $x_1$ y $x_2$ obtenidas mediante la fórmula cuadrática $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$ cumplen las identidades
  fundamentales:


  $$\begin{cases} x_1 + x_2 = -\frac{b}{a} \\ x_1 \cdot x_2 = \frac{c}{a} \end{cases}$$


  ### Síntesis didáctica

  Conocer las soluciones numéricas de una ecuación de segundo grado permite construir inmediatamente sus factores algebraicos
  sustituyendo en la fórmula $a(x - x_1)(x - x_2)$.

  '
definiciones_clave: '- **Raíz o cero de un polinomio ($x_i$)**: Valor numérico que anula la función cuadrática, satisfaciendo
  $P(x_i) = 0$.

  - **Teorema del Factor**: Teorema algebraico que afirma que un polinomio $P(x)$ es divisible por $(x - k)$ si y sólo si
  $P(k) = 0$.

  - **Relaciones de Viète**: Fórmulas que conectan la suma ($x_1+x_2 = -b/a$) y el producto ($x_1 \cdot x_2 = c/a$) de las
  raíces con los coeficientes del polinomio.

  '
propiedades_relaciones: '- **Signo opuesto en el factor**: Si la raíz es positiva ($x_1 = 4$), el factor contiene una resta
  $(x - 4)$; si la raíz es negativa ($x_1 = -3$), el factor contiene una suma $(x + 3)$.

  '
ejemplo_guiado:
  enunciado: Determina los factores lineales del polinomio $2x^2 - 10x + 12$ sabiendo que las raíces de la ecuación $2x^2
    - 10x + 12 = 0$ son $x_1 = 2$ y $x_2 = 3$.
  pasos:
  - 'Paso 1: Identificamos el coeficiente principal $a$: $a = \mathbf{2}$.'
  - 'Paso 2: Construimos los factores individuales aplicando $x - x_i$: - Para $x_1 = 2 \implies (x - 2)$. - Para $x_2 = 3
    \implies (x - 3)$.'
  - 'Paso 3: Ensamblamos la fórmula general $P(x) = a(x - x_1)(x - x_2)$: $2(x - 2)(x - 3)$.'
  - 'Conclusión: La factorización basada en raíces es **$2(x - 2)(x - 3)$**.'
  imagen: /static/img/nodos/relacion-entre-raices-cuadraticas-con-factores-lineales-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Si las raíces de una ecuación cuadrática con coeficiente principal $a = 1$ son $x_1 = -5$ y $x_2 = 4$, ¿cuál es
    la forma factorizada del polinomio?
  choices:
  - text: La forma factorizada es $(x + 5)(x - 4)$, aplicando el Teorema del Factor $(x - (-5))(x - 4) = (x + 5)(x - 4)$
    is_correct: true
  - text: La forma factorizada es $(x - 5)(x + 4)$
    is_correct: false
  - text: La forma factorizada es $(x + 5)(x + 4)$
    is_correct: false
  - text: La forma factorizada es $(x - 20)(x + 1)$
    is_correct: false
  explanation: 'La alternativa correcta es ''La forma factorizada es $(x + 5)(x - 4)$, aplicando el Teorema del Factor $(x
    - (-5))(x - 4) = (x + 5)(x - 4)$''. Inversión de signo: $x_1=-5 \to (x+5)$, $x_2=4 \to (x-4)$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la factorización del polinomio $3x^2 - 12x + 9$ cuyas raíces son $x_1 = 1$ y $x_2 = 3$ requiere incluir
    el número 3 fuera de los paréntesis ($3(x - 1)(x - 3)$)?
  choices:
  - text: Porque el coeficiente principal es $a = 3$, y por la fórmula general $a(x - x_1)(x - x_2)$ se debe multiplicar por
      $a$ para preservar el término cuadrático $3x^2$
    is_correct: true
  - text: Porque se suman las raíces $1+3=4$
    is_correct: false
  - text: Por una regla estética sin valor matemático
    is_correct: false
  - text: No es necesario incluir el 3 fuera
    is_correct: false
  explanation: La alternativa correcta es 'Porque el coeficiente principal es $a = 3$, y por la fórmula general $a(x - x_1)(x
    - x_2)$ se debe multiplicar por $a$ para preservar el término cuadrático $3x^2$'. Preservación del coeficiente principal
    $a$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver la ecuación cuadrática $ax^2 + bx + c = 0$ mediante la fórmula general para hallar las raíces $x_1$ y
  $x_2$.'
- 'Paso 2: Escribir el primer factor lineal invirtiendo el signo de la primera raíz: $(x - x_1)$.'
- 'Paso 3: Escribir el segundo factor lineal invirtiendo el signo de la segunda raíz: $(x - x_2)$.'
- 'Paso 4: Multiplicar el producto de los dos factores lineales por el coeficiente principal $a$: $a(x - x_1)(x - x_2)$.'
errores_correccion: '- **Error 1:** Excluir el coeficiente principal $a$ al armar la factorización desde las raíces (escribir
  $2x^2 - 10x + 12 = (x-2)(x-3)$). **Cómo corregirlo:** La fórmula del Teorema del Factor **REQUIERE OBLIGATORIAMENTE MULTIPLICAR
  POR EL COEFICIENTE PRINCIPAL $a$ ($a(x-x_1)(x-x_2)$)**.

  - **Error 2:** Conservar el mismo signo de la raíz en el factor lineal (escribir $(x + 3)$ para una raíz $x_1 = 3$). **Cómo
  corregirlo:** En el factor lineal **EL SIGNO DE LA RAÍZ SE INVIERTE ($(x - x_1) \implies (x - 3)$)**.

  '
ejemplos:
- titulo: Raíz positiva en factor
  enunciado: Si la raíz es $x_1 = 5$, ¿es el factor lineal $(x - 5)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x - 5 = 0 \implies x = 5$.
- titulo: Raíz negativa en factor
  enunciado: Si la raíz es $x_1 = -4$, ¿es el factor lineal $(x + 4)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x - (-4) = x + 4$.
- titulo: Coeficiente principal a
  enunciado: Para $a = 5, x_1 = 1, x_2 = 2$, ¿es el polinomio $5(x - 1)(x - 2)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5(x-1)(x-2)$.
- titulo: Raíz cero
  enunciado: Si una raíz es $x_1 = 0$, ¿es su factor lineal $(x - 0) = x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x - 0 = x$.
errores_frecuentes:
- El coeficiente principal a no es escrito delante del producto de factores lineales.
- Mantener el mismo signo de la raíz dentro del paréntesis en lugar de invertirlo.
- Intercambiar las raíces de la ecuación con los coeficientes del polinomio.
- Declarar que una raíz racional en fracción genera factores no enteros.
- Olvidar que si una raíz es cero (x=0), el factor resultante es simplemente x.
afirmaciones_verdaderas:
- Si $x_1$ y $x_2$ son las raíces de $ax^2 + bx + c = 0$, su factorización es $a(x - x_1)(x - x_2)$.
- El signo de la raíz se invierte dentro del factor lineal $(x - x_i)$.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/relacion-entre-raices-cuadraticas-con-factores-lineales-resumen.svg)


  QUÉ: Factorizar trinomios cuadráticos a partir de sus raíces resolviendo la ecuación ax²+bx+c=0 y aplicando a(x-x₁)(x-x₂).

  CÓMO: Calcular las raíces $x_1, x_2$ mediante la fórmula cuadrática $x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}$ e invertir su
  signo dentro de los factores lineales $(x - x_1)(x - x_2)$, anteponiendo el coeficiente principal $a$.

  '
