semantic_id: MAT.ALG.FACTOR_TRINOMIOS.RAICES_FACTORES_CUADRATICOS
resumen_inicial: 'Relación entre raíces cuadráticas con factores lineales: concepto,
  método de descomposición y reglas en Factorización de trinomios cuadráticos.'
explicacion_simple: ¿Alguna vez has pasado 10 minutos intentando factorizar un trinomio
  por aspa o amplificación, solo para rendirte y descubrir que era matemáticamente
  imposible? Existe una herramienta que actúa como "rayos X" y te dice de antemano
  si el polinomio tiene solución o si debes abandonarlo de inmediato.
explicacion_formal: '### Definición formal


  El valor bajo la raíz determina la existencia de soluciones reales.


  ### Desarrollo didáctico


  El discriminante, representado por la letra griega Delta ($\Delta$), es la porción
  de la fórmula cuadrática que está bajo la raíz: $b^2 - 4ac$.


  Supongamos que el profesor te pide factorizar $2x^2 + 3x + 5$.

  En vez de perder tiempo con el aspa, calculas el discriminante:

  - $a = 2, b = 3, c = 5$

  - $\Delta = (3)^2 - 4(2)(5)$

  - $\Delta = 9 - 40 = -31$


  Como el resultado es NEGATIVO, es matemáticamente imposible extraerle raíz cuadrada
  real. Esto significa categóricamente que **este polinomio no se puede factorizar**
  en el conjunto de los Números Reales.


  Si el resultado hubiera sido 0, significaba que tenías un Trinomio Cuadrado Perfecto.

  Si el resultado es un número positivo con raíz exacta (ej. 16, 25, 36), te garantiza
  que vas a encontrar dos factores bonitos y enteros con el método del aspa.'
definiciones_clave: '- **Relación entre raíces cuadráticas con factores lineales**:
