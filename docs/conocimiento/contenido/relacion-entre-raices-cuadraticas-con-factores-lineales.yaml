procedimiento:
- 'Paso 1: Identifica $a, b, c$ en tu trinomio $ax^2 + bx + c$.'
- 'Paso 2: Reemplaza en la fórmula $\Delta = b^2 - 4ac$.'
- 'Paso 3: Evalúa el resultado.'
- 'Paso 4: Si es negativo, aborta la misión (no factorizable en $\mathbb{R}$). Si
  es 0, busca un TCP. Si es cuadrado perfecto positivo, aplica el método simple o
  aspa.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en relación entre raíces cuadráticas con factores lineales.
ejemplos:
- titulo: Verifica si $x^2 - x + 6$ es factorizable
  enunciado: Verifica si $x^2 - x + 6$ es factorizable.
  solucion_pasos:
  - $a=1, b=-1, c=6$.
  - $\Delta = (-1)^2 - 4(1)(6) = 1 - 24 = -23$.
  - Como $\Delta < 0$, concluimos de inmediato que el trinomio es irreducible en los
    Reales.
- titulo: Calcula el discriminante de $x^2 - 5x + 6$ y predice.
  solucion_pasos:
  - $(-5)^2 - 4(1)(6) = 25 - 24 = 1$. Como 1 es cuadrado perfecto, tiene factorización
    exacta en enteros.
- titulo: 'Respecto de «Relación entre raíces cuadráticas con factores lineales»:
    ¿Es correcta esta car'
  enunciado: 'Respecto de «Relación entre raíces cuadráticas con factores lineales»:
    ¿Es correcta esta caracterización? «El discriminante de una ecuación cuadrática
    ($\Delta = b^2 - 4ac$) permite predecir la factorizabilidad en Reales»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El discriminante de una ecuación
    cuadrática ($\Delta = b^2 - 4ac$) permite predecir la factorizabilidad en Reales.'
- titulo: 'Respecto de «Relación entre raíces cuadráticas con factores lineales»:
    ¿Es válida esta afirm'
  enunciado: 'Respecto de «Relación entre raíces cuadráticas con factores lineales»:
    ¿Es válida esta afirmación? «Olvidar colocar los signos negativos al sustituir
    en la fórmula (especialmente la ''c'', que cambia el signo de la multiplicación
    a positivo)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El discriminante de una ecuación
    cuadrática ($\Delta = b^2 - 4ac$) permite predecir la factorizabilidad en Reales.'
errores_frecuentes:
- Olvidar colocar los signos negativos al sustituir en la fórmula (especialmente la
  'c', que cambia el signo de la multiplicación a positivo).
- Creer que un discriminante de 0 significa que no tiene solución (0 significa que
  es un Trinomio Cuadrado Perfecto).
- Para «¿Qué parte de la fórmula cuadrática corresponde al discriminante», la respuesta
  correcta es El divisor $2a$.
- La constante $-b$.
- Para «¿Qué parte de la fórmula cuadrática corresponde al discriminante», la respuesta
  correcta es El signo $\pm$.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
