resumen_inicial: La relación entre raíces cuadráticas y factores lineales establece
  que si un polinomio cuadrático posee raíces $x = x_1$ y $x = x_2$, su factorización
  en $\mathbb{R}$ es $a(x - x_1)(x - x_2)$.
explicacion_simple: 'Si resuelves la ecuación $x^2 - 5x + 6 = 0$ y encuentras que
  las soluciones (o raíces) son $x = 2$ y $x = 3$, para escribir el polinomio factorizado
  solo cambias el signo de las raíces y las pones con $x$: $(x - 2)(x - 3)$.'
explicacion_formal: 'Sea $P(x) = ax^2 + bx + c$ un polinomio cuadrático con discriminante
  $\Delta = b^2 - 4ac \ge 0$. El **Teorema del Factor para Polinomios Cuadráticos**
  establece la equivalencia fundamental entre raíces y factores lineales:


  $$P(x_1) = 0 \text{ y } P(x_2) = 0 \iff ax^2 + bx + c = a(x - x_1)(x - x_2)$$


  **Desglose simbólico:**

  - $x_1, x_2 = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$: Raíces algebraicas obtenidas
  por fórmula general.

  - $(x - x_1)$: Factor lineal asociado a la primera raíz.

  - $(x - x_2)$: Factor lineal asociado a la segunda raíz.

  - $a$: Coeficiente principal que preserva la escala cuantitativa del polinomio.


  > **Complemento didáctico:** Conecta la resolución de ecuaciones cuadráticas con
  la teoría de factorización de polinomios.'
definiciones_clave: '- **Raíz de un polinomio**: Valor $x_k$ tal que $P(x_k) = 0$.

  - **Teorema del Factor**: Afirmación $P(k) = 0 \iff (x - k)$ es un divisor exacto
  de $P(x)$.'
propiedades_relaciones: '- **Cambio de signo de la raíz**: El término independiente
  dentro del factor lineal $(x - x_k)$ es el opuesto aditivo de la raíz $-x_k$.'
ejemplo_guiado:
  enunciado: Halle los factores lineales del trinomio $x^2 - 2x - 8$ a partir de sus
    raíces algebraicas $x_1 = 4$ y $x_2 = -2$.
  pasos:
  - 'Paso 1: Identificar la primera raíz $x_1 = 4$: El factor asociado es $(x - 4)$.'
  - 'Paso 2: Identificar la segunda raíz $x_2 = -2$: El factor asociado es $(x - (-2))
    = (x + 2)$.'
  - 'Paso 3: Identificar el coeficiente principal $a$: Como el trinomio es mónico,
    $a = 1$.'
  - 'Paso 4: Ensamblar la forma factorizada $a(x - x_1)(x - x_2)$: $1 \cdot (x - 4)(x
    + 2)$.'
  - 'Conclusión: La factorización mediante raíces es $(x - 4)(x + 2)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una ecuación cuadrática tiene como raíz el valor $x = -5$, ¿cuál es
    el factor lineal correspondiente dentro de la factorización del polinomio?
  choices:
  - text: $(x + 5)$
    is_correct: true
  - text: $(x - 5)$
    is_correct: false
  - text: $(-5x)$
    is_correct: false
  - text: $(x^2 - 5)$
    is_correct: false
  explanation: La alternativa correcta es '$(x + 5)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Dado el trinomio mónico con raíces $x_1 = 4$ y $x_2 = -2$, ¿cuál es su
    producto factorizado equivalente?
  choices:
  - text: $(x - 4)(x + 2)$
    is_correct: true
  - text: $(x + 4)(x - 2)$
    is_correct: false
  - text: $(x - 4)(x - 2)$
    is_correct: false
  - text: $(4x)(2x)$
    is_correct: false
  explanation: La alternativa correcta es '$(x - 4)(x + 2)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver la ecuación cuadrática $ax^2 + bx + c = 0$ para hallar sus raíces
  $x_1$ y $x_2$.'
- 'Paso 2: Escribir los factores lineales invirtiendo el signo de las raíces: $(x
  - x_1)$ y $(x - x_2)$.'
- 'Paso 3: Anteponer el coeficiente cuadrático $a$ para obtener $a(x - x_1)(x - x_2)$.'
errores_correccion: '- **Error 1: Escribir la raíz directamente con su mismo signo
  dentro del factor resultando en $(x + x_1)$ cuando $x_1 > 0$.** **Cómo corregirlo:**
  Por el teorema del factor, la raíz $x_1$ genera el factor con signo cambiado $(x
  - x_1)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si las raíces de un polinomio mónico son $x_1 = 3$ y $x_2 = 7$, ¿cuál
    es su factorización?
  alternativas:
  - $(x - 3)(x - 7)$
  - $(x + 3)(x + 7)$
  - $(x - 3)(x + 7)$
  respuesta: $(x - 3)(x - 7)$
  solucion_pasos:
  - 1. Raíces $3$ y $7 \implies$ factores $(x - 3)$ y $(x - 7)$.
- titulo: Ejemplo 2
  enunciado: Para el trinomio no mónico $2x^2 - 5x + 2$ con raíces $x_1 = 2$ y $x_2
    = 1/2$, ¿cuál es su factorización?
  alternativas:
  - $2(x - 2)(x - 1/2) = (x - 2)(2x - 1)$
  - $(x - 2)(x - 1/2)$
  - $(2x - 2)(2x - 1)$
  respuesta: $2(x - 2)(x - 1/2) = (x - 2)(2x - 1)$
  solucion_pasos:
  - '1. Incluir $a = 2$: $2(x - 2)(x - 1/2) = (x - 2)(2x - 1)$.'
- titulo: Si un polinomio cumple $P(3) = 0$, ¿garantiza el teorema del factor que
    $(x - 3)$ es un divisor exacto de $P(x)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición exacta del teorema del factor.
- titulo: Si un trinomio posee un discriminante negativo $\Delta < 0$, ¿se puede factorizar
    en binomios lineales reales?
  respuesta: 'No'
  solucion_pasos:
  - No, si $\Delta < 0$ no existen raíces reales $x_1, x_2 \in \mathbb{R}$.
errores_frecuentes:
- Mantener el mismo signo de la raíz dentro del factor lineal resultando $(x + k)$
  para raíces positivas.
- Escribir únicamente $(x - x_1)(x - x_2)$ en trinomios no mónicos sin anteponer el
  coeficiente cuadrático $a$.
- Declarar que las raíces y los factores lineales son conceptos totalmente independientes
  sin relación algebraica.
- Igualar los factores a cero en la respuesta final de la factorización.
- Declarar que un trinomio con raíces complejas se puede factorizar en binomios lineales
  reales.
afirmaciones_verdaderas:
- Cada raíz $x = k$ de un polinomio cuadrático genera un factor lineal de la forma
  $(x - k)$.
- La factorización por raíces exige incluir el coeficiente principal $a$ en la forma
  $a(x - x_1)(x - x_2)$.
al_terminar_debes_poder: Al terminar serás capaz de construir la factorización de
  un trinomio cuadrático a partir de sus raíces algebraicas.
