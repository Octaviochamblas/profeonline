semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.DIVISION_IGUAL_BASE
resumen_inicial: 'Al dividir dos potencias de igual base $\frac{a^m}{a^n}$, se conserva
  la base común $a$ ($a \neq 0$) y se resta el exponente del divisor al del dividendo:
  $\frac{a^m}{a^n} = a^{m-n}$.'
explicacion_simple: Para dividir potencias que tienen la misma base, mantenemos la
  base igual y le restamos el exponente de abajo al exponente de arriba. Esta resta
  cancela los factores repetidos sobrantes.
explicacion_formal: 'Para toda base no nula $a \in \mathbb{R} \setminus \{0\}$ y exponentes
  $m, n \in \mathbb{R}$, el **Cociente de Potencias de Igual Base** satisface:


  $$\frac{a^m}{a^n} = a^{m-n}$$


  **Demostración por cancelación de factores:**

  $$\frac{a^m}{a^n} = a^m \cdot a^{-n} = a^{m + (-n)} = a^{m-n}$$


  > **Complemento didáctico:** Si $m = n$, la resta resulta en $a^{m-m} = a^0 = 1$,
  lo que valida consistentemente la propiedad del exponente cero.'
definiciones_clave: '- **División de potencias de igual base**: Regla $\frac{a^m}{a^n}
  = a^{m-n}$ para $a \neq 0$ donde los exponentes se restan en el orden dividendo
  menos divisor.'
propiedades_relaciones: '- **Resta de exponentes**: $a^m / a^n = a^{m-n}$ para $a
  \neq 0$.'
ejemplo_guiado:
  enunciado: Simplifique el cociente $\frac{5^8}{5^3}$.
  pasos:
  - 'Paso 1: Verificar la base común $a = 5 \neq 0$.'
  - 'Paso 2: Restar el exponente del denominador al del numerador: $8 - 3 = 5$.'
  - 'Conclusión: El resultado simplificado es $5^5 = 3125$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué se debe hacer con los exponentes al dividir potencias de igual base
    no nula (a^m / a^n)?
  choices:
  - text: Se conserva la base y se restan los exponentes (a^{m-n})
    is_correct: true
  - text: Se dividen los exponentes
    is_correct: false
  - text: Se multiplican los exponentes
    is_correct: false
  - text: Se restan las bases
    is_correct: false
  explanation: La alternativa correcta es 'Se conserva la base y se restan los exponentes
    (a^{m-n})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5^8 / 5^3, ¿cuál fue la potencia obtenida?
  choices:
  - text: 5^5
    is_correct: true
  - text: 5^{11}
    is_correct: false
  - text: 5^{24}
    is_correct: false
  - text: 1^5
    is_correct: false
  explanation: La alternativa correcta es '5^5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base común no nula en dividendo y divisor.'
- 'Paso 2: Restar el exponente del divisor al exponente del dividendo ($m - n$).'
- 'Paso 3: Escribir la potencia simplificada $a^{m-n}$.'
errores_correccion: '- **Error 1: Dividir los exponentes ($\frac{a^8}{a^2} = a^4$).**
  **Cómo corregirlo:** Los exponentes se RESTAN ($8 - 2 = 6 \implies a^6$).


  - **Error 2: Restar al revés cuando el denominador tiene mayor exponente.** **Cómo
  corregirlo:** Se resta en el orden estricto numerador menos denominador ($m-n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $2^7 / 2^4$.
  alternativas:
  - 2^3 = 8
  - 2^{11}
  - 1^3
  respuesta: 2^3 = 8
  solucion_pasos:
  - $2^{7-4} = 2^3 = 8$.
- titulo: Ejemplo 2
  enunciado: Simplifique $\frac{x^3}{x^5}$.
  alternativas:
  - x^{-2} = 1/x^2
  - x^2
  - x^{15}
  respuesta: x^{-2} = 1/x^2
  solucion_pasos:
  - $x^{3-5} = x^{-2} = 1/x^2$.
- titulo: ¿Es 10^5 / 10^2 igual a 10^3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5 - 2 = 3$.
- titulo: ¿Requiere la división de potencias de igual base que a sea distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división entre cero.
errores_frecuentes:
- Dividir los exponentes entre sí al calcular un cociente de potencias de igual base.
- Dividir las bases entre sí manteniendo la resta de exponentes en la solución.
- Restar los exponentes al revés cambiando arbitrariamente el signo del resultado.
- La división $\frac{6^8}{6^2}$ resulta en la potencia $6^4$ por división directa.
- Aplicar la regla del cociente cuando la base del denominador es igual a cero.
afirmaciones_verdaderas:
- Al dividir potencias de igual base se mantiene la base no nula y se resta el exponente
  inferior del superior.
- La regla de división de potencias de igual base se expresa como $\frac{a^m}{a^n}
  = a^{m-n}$ para $a \neq 0$.
al_terminar_debes_poder: Al terminar serás capaz de simplificar cocientes de potencias
  de igual base $\frac{a^m}{a^n} = a^{m-n}$, conservando la base común y restando
  los exponentes.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
