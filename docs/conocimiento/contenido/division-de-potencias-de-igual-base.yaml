semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.DIVISION_IGUAL_BASE
resumen_inicial: Al dividir potencias de la misma base, se conserva la base y se resta
  el exponente del divisor al del dividendo ($a^m \div a^n = a^{m-n}$ para $a \neq
  0$).
explicacion_simple: 'Cuando divides dos potencias que tienen la misma base, conservas
  esa base y **restas los exponentes** (el de arriba menos el de abajo):

  $$\frac{2^5}{2^2} = 2^{5-2} = 2^3 = 8$$

  Esto ocurre porque los factores iguales se simplifican uno a uno.'
explicacion_formal: 'Para todo $a \in \mathbb{R} \setminus \{0\}$ y $m, n \in \mathbb{R}$,
  se cumple:

  $$\frac{a^m}{a^n} = a^m \cdot a^{-n} = a^{m-n}$$'
definiciones_clave: '- **Resta de exponentes**: Operación $m - n$ entre el exponente
  del dividendo y el del divisor.'
propiedades_relaciones: '- **Origen del exponente negativo o cero**: Si $m = n$, $a^{m-m}
  = a^0 = 1$. Si $m < n$, se genera un exponente negativo.'
ejemplo_guiado:
  enunciado: Simplifica $\frac{7^8}{7^5}$.
  pasos:
  - Identificar base común $a = 7$.
  - 'Restar el exponente del denominador (5) al del numerador (8): $8 - 5 = 3$.'
  - 'Escribir la potencia simplificada: $7^3 = 343$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la cociente $\frac{x^9}{x^4}$ para $x \neq 0$?
  choices:
  - text: x^5
    is_correct: true
  - text: x^{13}
    is_correct: false
  - text: x^{9/4}
    is_correct: false
  - text: 1^5
    is_correct: false
  explanation: 'La correcta es: x^5. Restamos exponentes: $9 - 4 = 5$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el resultado de $10^3 \div 10^5$.
  choices:
  - text: 1/100
    is_correct: true
  - text: '100'
    is_correct: false
  - text: '-100'
    is_correct: false
  - text: 10^{-15}
    is_correct: false
  explanation: 'La correcta es: 1/100. Restando exponentes: $3 - 5 = -2$, y $10^{-2}
    = \frac{1}{100}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la base sea idéntica en numerador y denominador.'
- 'Paso 2: Conservar la base.'
- 'Paso 3: Restar el exponente inferior al exponente superior ($m - n$).'
- 'Paso 4: Evaluar la potencia resultante.'
errores_correccion: No restes al revés. En $\frac{x^3}{x^5}$, la resta es $3 - 5 =
  -2$, dando $x^{-2} = \frac{1}{x^2}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifica $\frac{4^6}{4^4}$.
  alternativas:
  - '16'
  - '4'
  - '64'
  respuesta: '16'
  solucion_pasos:
  - $4^{6-4} = 4^2 = 16$.
errores_frecuentes:
- Restar en orden inverso (denominador menos numerador).
afirmaciones_verdaderas:
- $\frac{a^m}{a^n} = a^{m-n}$ para $a \neq 0$.
al_terminar_debes_ponder: Simplificar divisiones de potencias de igual base.
fuente: Texto escolar MINEDUC.
estado: publicado
