semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.DIVISION_IGUAL_BASE
resumen_inicial: 'Para dividir potencias de igual base no nula, se conserva la base y se resta el exponente del divisor al del dividendo: $\frac{a^m}{a^n} = a^{m-n}$.'
explicacion_simple: '![División de potencias de igual base](/static/img/nodos/division-de-potencias-de-igual-base-intro.svg)


  Cuando divides dos potencias que tienen la misma base, los factores iguales de arriba se cancelan con los de abajo. Por eso, la regla es conservar la base y restar los exponentes: al exponente de arriba le restas el exponente de abajo ($m - n$). Por ejemplo, en $5^5 / 5^2$, tenemos cinco $5$ arriba y dos $5$ abajo; al simplificar dos de ellos, nos quedan $5 - 2 = 3$ factores, es decir, $5^3 = 125$. Si el exponente de abajo es mayor, el resultado tendrá exponente negativo.'
explicacion_formal: 'Sean $a \in \mathbb{R} \setminus \{0\}$ y $m, n \in \mathbb{R}$. El **Teorema del Cociente de Potencias de Igual Base** establece que:


  $$\frac{a^m}{a^n} = a^{m-n}$$


  **Demostración para $m > n$ con $m, n \in \mathbb{N}$:**

  $$\frac{a^m}{a^n} = \frac{\overbrace{a \cdot a \dots a}^{m \text{ factores}}}{\underbrace{a \cdot a \dots a}_{n \text{ factores}}} = \frac{\overbrace{a \cdot a \dots a}^{n \text{ factores}} \cdot \overbrace{a \cdot a \dots a}^{m-n \text{ factores}}}{\underbrace{a \cdot a \dots a}_{n \text{ factores}}} = \overbrace{a \cdot a \dots a}^{m-n \text{ factores}} = a^{m-n}$$


  **Casos especiales derivados:**

  1. **Si $m = n$:** $\frac{a^n}{a^n} = a^{n-n} = a^0 = 1$.

  2. **Si $m < n$:** $\frac{a^m}{a^n} = a^{m-n} = a^{-(n-m)} = \frac{1}{a^{n-m}}$.

  3. **División con exponente negativo en el denominador:** $\frac{a^m}{a^{-k}} = a^{m - (-k)} = a^{m+k}$.'
definiciones_clave: '- **Cociente de potencias**: División entre dos potencias con la misma base.

  - **Resta de exponentes ($m - n$)**: Sustracción obligatoria del exponente inferior respecto al superior.'
propiedades_relaciones: '- **Inverso multiplicativo directo**: $\frac{1}{a^n} = \frac{a^0}{a^n} = a^{0-n} = a^{-n}$.

  - **Condición estricta de no nulidad**: La base $a$ debe ser distinta de cero ($a \neq 0$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de división de igual base](/static/img/nodos/division-de-potencias-de-igual-base-ejemplos.svg)


    Calcule y simplifique las expresiones $\frac{7^6}{7^4}$, $\frac{4^3}{4^{-2}}$ y $\frac{a^{5/3}}{a^{2/3}}$.'
  pasos:
  - 'Paso 1: Evaluar $\frac{7^6}{7^4}$: Conservar base $7$. Restar exponentes: $6 - 4 = 2$. Resultado: $7^2 = 49$.'
  - 'Paso 2: Evaluar $\frac{4^3}{4^{-2}}$: Conservar base $4$. Restar con negativo: $3 - (-2) = 3 + 2 = 5$. Resultado: $4^5 = 1024$.'
  - 'Paso 3: Evaluar $\frac{a^{5/3}}{a^{2/3}}$: Conservar base $a$. Restar fracciones: $\frac{5}{3} - \frac{2}{3} = \frac{3}{3} = 1$. Resultado: $a^1 = a$.'
  - 'Conclusión: Los resultados son $7^2 = 49$, $4^5 = 1024$ y $a$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de simplificar $\frac{2^7}{2^3}$?
  choices:
  - text: $2^4 = 16$ (restando $7 - 3 = 4$)
    is_correct: true
  - text: $1^4 = 1$
    is_correct: false
  - text: $2^{10}$
    is_correct: false
  - text: $2^{7/3}$
    is_correct: false
  explanation: La alternativa correcta es '$2^4 = 16$ (restando $7 - 3 = 4$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\frac{4^3}{4^{-2}}$ dio como exponente $5$?
  choices:
  - text: 'Porque al restar un exponente negativo se transforma en suma: $3 - (-2) = 3 + 2 = 5$'
    is_correct: true
  - text: Porque se multiplicaron los números $3 \cdot 2$
    is_correct: false
  - text: Porque $3 - 2 = 1$
    is_correct: false
  - text: Porque la base es par
    is_correct: false
  explanation: 'La alternativa correcta es ''Porque al restar un exponente negativo se transforma en suma: $3 - (-2) = 3 + 2 = 5$''.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que el numerador y el denominador compartan la misma base no nula.'
- 'Paso 2: Mantener la base común y plantear la resta: $(\text{exp. numerador}) - (\text{exp. denominador})$.'
- 'Paso 3: Resolver la resta respetando los signos negativos y evaluar la potencia simplificada.'
errores_correccion: '- **Error 1: Dividir las bases (pensar que $6^5 / 6^3 = 1^2$).** **Cómo corregirlo:** La base se CONSERVA; los factores se cancelan algebraicamente ($6^{5-3} = 6^2 = 36$).

  - **Error 2: Error de signos con denominadores negativos ($x^4 / x^{-2} = x^2$).** **Cómo corregirlo:** Restar un negativo es sumar: $4 - (-2) = 4 + 2 = 6 \implies x^6$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\frac{5^8}{5^5}$?
  alternativas:
  - $5^3 = 125$
  - $1^3 = 1$
  - $5^{13}$
  respuesta: $5^3 = 125$
  solucion_pasos:
  - $\frac{5^8}{5^5} = 5^{8-5} = 5^3 = 125$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale la expresión $\frac{x^2}{x^5}$?
  alternativas:
  - $x^{-3} = \frac{1}{x^3}$
  - $x^3$
  - $x^{2/5}$
  respuesta: $x^{-3} = \frac{1}{x^3}$
  solucion_pasos:
  - $x^{2-5} = x^{-3} = \frac{1}{x^3}$.
- titulo: ¿Es 8⁵ / 8⁵ igual a 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $8^{5-5} = 8^0 = 1$.
  alternativas:
  - texto: Sí, todo número dividido por sí mismo es 1 ($8⁰ = 1$)
    es_correcta: true
    retroalimentacion: ¡Correcto! $\frac{a^n}{a^n} = a^0 = 1$.
  - texto: No, es igual a 0
    es_correcta: false
    retroalimentacion: Incorrecto, la división da 1, no 0.
  - texto: No, es igual a 8
    es_correcta: false
    retroalimentacion: Incorrecto, $8^0 = 1$.
- titulo: ¿Es 10⁴ / 10⁻² igual a 10⁶?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10^{4 - (-2)} = 10^{4+2} = 10^6 = 1.000.000$.
  alternativas:
  - texto: Sí, $4 - (-2) = 4 + 2 = 6 \implies 10⁶$
    es_correcta: true
    retroalimentacion: ¡Correcto! Restar un negativo equivale a sumar.
  - texto: No, es igual a 10²
    es_correcta: false
    retroalimentacion: Incorrecto, olvidaste el cambio de signo de la resta.
  - texto: No, es igual a 10⁻⁸
    es_correcta: false
    retroalimentacion: Incorrecto, los exponentes se restan.
errores_frecuentes:
- Dividir las bases obteniendo 1 ($a^n / a^m = 1^{n-m}$).
- Restar en orden invertido (denominador menos numerador).
- Cometer errores de signo al restar exponentes negativos en el denominador.
- Dividir exponentes en vez de restarlos ($x^6 / x^2 = x^3$).
- Aplicar la regla cuando las bases son distintas sin factorizar previamente.
afirmaciones_verdaderas:
- Para toda base $a \neq 0$, $\frac{a^m}{a^n} = a^{m-n}$.
- Si los exponentes son iguales, el cociente es idéntico a $a^0 = 1$.
- La división por potencias con exponente negativo se convierte en suma de exponentes.
al_terminar_debes_poder: '![Síntesis de división de igual base](/static/img/nodos/division-de-potencias-de-igual-base-resumen.svg)


  QUÉ: Dividir potencias de igual base y simplificar fracciones algebraicas.


  CÓMO: Conservando la base común no nula $a \neq 0$ y restando algebraicamente el exponente inferior del superior ($\frac{a^m}{a^n} = a^{m-n}$), aplicando correctamente la regla de doble signo $-(-k) = +k$ para denominadores con exponente negativo.'
