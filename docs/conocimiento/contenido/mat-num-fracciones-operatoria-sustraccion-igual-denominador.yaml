semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.SUSTRACCION_IGUAL_DENOMINADOR
resumen_inicial: 'La sustracción de fracciones de igual denominador resta los numeradores y conserva exactamente el mismo denominador: $\frac{a}{b} - \frac{c}{b} = \frac{a - c}{b}$.'
explicacion_simple: 'Para restar fracciones que tienen el mismo número abajo, simplemente restamos el número de arriba del primero menos el de arriba del segundo y mantenemos el número de abajo igual. Como los trozos son de igual tamaño, solo calculamos cuántos trozos nos quedan.


  ![Sustracción de fracciones de igual denominador](/static/img/nodos/sustraccion-de-fracciones-de-igual-denominador-intro.svg)'
explicacion_formal: 'Para cualesquiera dos fracciones $\frac{a}{b}, \frac{c}{b} \in \mathbb{Q}$ con $b \neq 0$, la **Leyes de Sustracción Homogénea** se define como:


  $$\frac{a}{b} - \frac{c}{b} = \frac{a - c}{b}$$


  **Desglose de la fórmula:**

  - $a - c$: Resta en $\mathbb{Z}$ del numerador del minuendo menos el del sustraendo.

  - $b$: Denominador común no nulo que permanece constante.


  > **Complemento didáctico:** La resta de fracciones es equivalente a la suma del opuesto aditivo: $\frac{a}{b} - \frac{c}{b} = \frac{a}{b} + \left(-\frac{c}{b}\right)$.'
definiciones_clave: '- **Sustracción de fracciones homogéneas**: Resta de numeradores manteniendo el denominador común $b$.'
propiedades_relaciones: '- **No conmutatividad**: $\frac{a}{b} - \frac{c}{b} \neq \frac{c}{b} - \frac{a}{b}$ en general.'
ejemplo_guiado:
  enunciado: 'Calcule la resta $\frac{8}{11} - \frac{3}{11}$.


    ![Ejemplo Sustracción de fracciones de igual denominador](/static/img/nodos/sustraccion-de-fracciones-de-igual-denominador-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el denominador común: en ambas es $11$.'
  - 'Paso 2: Restar los numeradores: $8 - 3 = 5$.'
  - 'Paso 3: Mantener el denominador común $11$: $\frac{5}{11}$.'
  - 'Conclusión: $\frac{8}{11} - \frac{3}{11} = \frac{5}{11}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se resuelve la sustracción de dos fracciones de igual denominador a/b - c/b?
  choices:
  - text: (a - c) / b (restar numeradores y mantener denominador)
    is_correct: true
  - text: (a - c) / (b - b)
    is_correct: false
  - text: a / (c - b)
    is_correct: false
  - text: (a · c) / b
    is_correct: false
  explanation: La alternativa correcta es '(a - c) / b (restar numeradores y mantener denominador)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 8/11 - 3/11, ¿cuál fue la diferencia obtenida?
  choices:
  - text: 5/11
    is_correct: true
  - text: 5/0
    is_correct: false
  - text: 11/11
    is_correct: false
  - text: 5/22
    is_correct: false
  explanation: La alternativa correcta es '5/11'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que ambas fracciones tengan el mismo denominador.'
- 'Paso 2: Restar el numerador del sustraendo del numerador del minuendo ($a - c$).'
- 'Paso 3: Escribir el resultado sobre el denominador común y simplificar si aplica.'
errores_correccion: '- **Error 1: Restar los denominadores y obtener cero abajo (ej: $\frac{8}{11} - \frac{3}{11} = \frac{5}{0}$).** **Cómo corregirlo:** El denominador se conserva intacto.


  - **Error 2: Invertir el orden de la resta (hacer $c - a$).** **Cómo corregirlo:** La resta no es conmutativa; se debe restar estrictamente minuendo menos sustraendo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule 9/10 - 4/10 y simplifique al máximo.
  alternativas:
  - 1/2 (tras simplificar 5/10)
  - 5/0
  - 5/20
  respuesta: 1/2 (tras simplificar 5/10)
  solucion_pasos:
  - $\frac{9-4}{10} = \frac{5}{10} = \frac{1}{2}$.
- titulo: Ejemplo 2
  enunciado: Calcule 2/9 - 7/9.
  alternativas:
  - -5/9
  - 5/9
  - -5/0
  respuesta: -5/9
  solucion_pasos:
  - $\frac{2-7}{9} = \frac{-5}{9}$.
- titulo: ¿Se conserva el mismo denominador en la resta de fracciones homogéneas?
  respuesta: Sí
  solucion_pasos:
  - Sí, el denominador permanece inalterado.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al cálculo de la operación con fracciones y su simplificación irreductible.
  - texto: No se puede calcular
    es_correcta: false
    retroalimentacion: Incorrecto, las operaciones en el cuerpo ℚ están bien definidas siempre que no se divida por cero.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa la suma/resta de numeradores o los productos cruzados aplicados.
- titulo: ¿Es 7/8 - 3/8 igual a 4/0?
  respuesta: 'No'
  solucion_pasos:
  - No, no se restan los denominadores; es $4/8 = 1/2$.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al cálculo de la operación con fracciones y su simplificación irreductible.
  - texto: No se puede calcular
    es_correcta: false
    retroalimentacion: Incorrecto, las operaciones en el cuerpo ℚ están bien definidas siempre que no se divida por cero.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa la suma/resta de numeradores o los productos cruzados aplicados.
errores_frecuentes:
- Restar fracciones de igual denominador requiere restar también los denominadores produciendo cero abajo.
- La resta de dos fracciones de igual denominador es una operación conmutativa que no depende del orden.
- Restar numeradores en fracciones homogéneas exige multiplicar previamente por 10.
- El resultado de restar $5/6 - 2/6$ es la fracción $3/12$.
- Restar dos fracciones de igual denominador produce siempre una fracción negativa.
afirmaciones_verdaderas:
- La resta de fracciones homogéneas resta únicamente los numeradores en $\mathbb{Z}$ conservando el denominador.
- Si el minuendo es menor que el sustraendo, el resultado de la resta es una fracción negativa.
al_terminar_debes_poder: '**QUÉ:** Restar fracciones homogéneas respetando la regla de signos de los enteros.


  **CÓMO:** Conservando el denominador común $d$ y restando los numeradores: $\frac{a}{d} - \frac{b}{d} = \frac{a-b}{d}$, interpretando la resta como la suma del inverso aditivo $\frac{a}{d} + \left(-\frac{b}{d}\right)$.


  ![Resumen Sustracción de fracciones de igual denominador](/static/img/nodos/sustraccion-de-fracciones-de-igual-denominador-resumen.svg)'
