semantic_id: MAT.NUM.FRACCIONES_OPERATORIA.SUSTRACCION_IGUAL_DENOMINADOR
resumen_inicial: Para restar fracciones con igual denominador, se restan directamente
  los numeradores y se conserva el mismo denominador común.
explicacion_simple: 'Si tienes una pizza cortada en 6 partes iguales y en el plato
  quedan 5 rebanadas ($\frac{5}{6}$), y te comes 2 rebanadas ($\frac{2}{6}$), ¿cuánta
  pizza queda? Quedan $5 - 2 = 3$ rebanadas ($\frac{3}{6}$, que simplificado es $\frac{1}{2}$).
  Como el tamaño de los trozos no cambia (siguen siendo sextos), **solo restas el
  número de arriba y mantienes el mismo número de abajo**.

  '
explicacion_formal: 'Formalmente, dadas dos fracciones $\frac{a}{c}$ y $\frac{b}{c}$
  con denominador común $c \in \mathbb{Z} \setminus \{0\}$ y numeradores $a, b \in
  \mathbb{Z}$:

  $\frac{a}{c} - \frac{b}{c} = \frac{a - b}{c}$


  Demostración algebraica mediante la propiedad de adición con el inverso aditivo
  en $\mathbb{Q}$:

  $\frac{a}{c} - \frac{b}{c} = \frac{a}{c} + \left(-\frac{b}{c}\right) = a \cdot \left(\frac{1}{c}\right)
  + (-b) \cdot \left(\frac{1}{c}\right) = (a - b) \cdot \left(\frac{1}{c}\right) =
  \frac{a - b}{c}$

  '
definiciones_clave: '- **Sustracción de igual denominador**: Resta donde se conserva
  el denominador $c$ y se calcula $a - b$.

  - **Minuendo fraccionario ($\frac{a}{c}$)**: Fracción inicial a la que se le quita
  una cantidad.

  - **Sustraendo fraccionario ($\frac{b}{c}$)**: Fracción que indica la cantidad a
  restar.

  '
propiedades_relaciones: '- **No conmutatividad**: A diferencia de la suma, la resta
  no es conmutativa: $\frac{a}{c} - \frac{b}{c} \neq \frac{b}{c} - \frac{a}{c}$ (salvo
  si $a = b$).

  - **Resultado negativo posible**: Si $a < b$, la resta genera una fracción negativa
  $\frac{a-b}{c} < 0$.

  - **Simplificación obligatoria**: El resultado $\frac{a-b}{c}$ debe reducirse a
  su fracción irreductible si existen divisores comunes entre $(a-b)$ y $c$.

  '
ejemplo_guiado:
  enunciado: Resta las fracciones $\frac{11}{12} - \frac{3}{12}$ y simplifica el resultado
    final.
  pasos:
  - 'Verificar el denominador común: $c = 12$.'
  - 'Restar los numeradores: $11 - 3 = 8$.'
  - 'Escribir la fracción remanente: $\frac{8}{12}$.'
  - 'Simplificar dividiendo numerador y denominador entre su MCD ($4$): $\frac{8 \div
    4}{12 \div 4} = \frac{2}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente a la resta $\frac{a}{c} - \frac{b}{c}$
    entre dos fracciones de igual denominador?
  choices:
  - text: \$\frac{a - b}{c}$
    is_correct: true
  - text: \$\frac{a - b}{c - c}$
    is_correct: false
  - text: \$\frac{a \\cdot b}{c}$
    is_correct: false
  - text: \$\frac{a + b}{c}$
    is_correct: false
  explanation: 'La alternativa correcta es: \$\frac{a - b}{c}$. La correcta es \frac{a
    - b}{c}: conservamos el denominador $c$ y restamos los numeradores $a - b$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al efectuar $\frac{9}{10} - \frac{4}{10}$, ¿cuál es el resultado en su
    forma simplificada?
  choices:
  - text: \$\frac{1}{2}$
    is_correct: true
  - text: \$\frac{5}{10}$
    is_correct: false
  - text: \$\frac{5}{0}$
    is_correct: false
  - text: \$\frac{1}{5}$
    is_correct: false
  explanation: 'La alternativa correcta es: \$\frac{1}{2}$. La correcta es \frac{1}{2}:
    $\frac{9-4}{10} = \frac{5}{10}$, que al simplificarse entre $5$ da $\frac{1}{2}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que ambas fracciones tengan el mismo denominador $c$.'
- 'Paso 2: Restar el segundo numerador del primero: $a - b$.'
- 'Paso 3: Formar la fracción resultante $\frac{a - b}{c}$.'
- 'Paso 4: Simplificar dividiendo por el Máximo Común Divisor de $(a - b)$ y $c$.'
errores_correccion: 'El error típico es restar los denominadores obteniendo un denominador
  igual a cero (por ejemplo, hacer $\frac{5}{6} - \frac{2}{6} = \frac{3}{0}$). ¡Recuerda
  que **la división entre cero no existe** y los denominadores iguales no se restan
  jamás!

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\frac{7}{9} - \frac{4}{9}$.
  alternativas:
  - \$\frac{3}{9}$ = \$\frac{1}{3}$
  - \$\frac{3}{0}$
  - \$\frac{11}{9}$
  respuesta: \$\frac{3}{9}$ = \$\frac{1}{3}$
  solucion_pasos:
  - 'Restamos los numeradores: $7 - 4 = 3$.'
  - 'Conservamos el denominador: $\frac{3}{9}$.'
  - 'Simplificamos por 3: $\frac{1}{3}$.'
- titulo: Ejemplo 2
  enunciado: De una cinta de $\frac{8}{5}$ metros de largo se cortan $\frac{3}{5}$
    metros. ¿Cuántos metros de cinta quedan?
  alternativas:
  - Quedan 1 metro (\$\frac{5}{5}$ m).
  - Quedan \$\frac{5}{0}$ m.
  - Quedan \$\frac{11}{5}$ m.
  respuesta: Quedan 1 metro (\$\frac{5}{5}$ m).
  solucion_pasos:
  - 'Resta: $\frac{8}{5} - \frac{3}{5} = \frac{8-3}{5} = \frac{5}{5} = 1$ metro.'
- titulo: ¿Se puede obtener un resultado negativo al restar dos fracciones con igual
    denominador si el minuendo es menor?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ejemplo $\frac{2}{7} - \frac{5}{7} = \frac{2-5}{7} = -\frac{3}{7}$.
- titulo: ¿Restar una fracción de igual denominador equivale a sumar su inverso aditivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{a}{c} - \frac{b}{c} = \frac{a}{c} + \left(-\frac{b}{c}\right) = \frac{a-b}{c}$.
errores_frecuentes:
- Restar los denominadores y provocar una indeterminación por cero.
- Invertir el orden de los numeradores alterando el signo correcto del resultado.
- Olvidar simplificar el resultado.
- Sumar en lugar de restar los numeradores.
- Asumir que la resta de fracciones de igual denominador es conmutativa.
afirmaciones_verdaderas:
- La sustracción de fracciones de igual denominador se realiza restando los numeradores
  y manteniendo el denominador común.
- La resta $\frac{a}{c} - \frac{b}{c}$ es equivalente a $\frac{a-b}{c}$.
al_terminar_debes_ponder: 'Debes ser capaz de restar fracciones con igual denominador,
  gestionar resultados negativos cuando corresponda y reducir el resultado a su forma
  irreductible.

  '
fuente: Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números
  racionales.
