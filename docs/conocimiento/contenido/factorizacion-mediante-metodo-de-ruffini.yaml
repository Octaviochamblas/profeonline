semantic_id: MAT.ALG.TEOREMA_FACTOR.METODO_RUFFINI
resumen_inicial: 'Factorización mediante método de Ruffini: concepto, método de descomposición
  y reglas en Teorema del factor y división sintética.'
explicacion_simple: 'Factorizar un polinomio de grado 3 o 4 usando solo agrupación
  es como intentar desarmar un reloj con un martillo: a veces funciona, pero usualmente
  terminas frustrado. El método de Ruffini es tu destornillador de precisión. Te permite
  adivinar una pieza, sacarla limpiamente, y ver qué queda.'
explicacion_formal: '### Definición formal


  Según el Teorema de las Raíces Racionales, cualquier raíz entera forzosamente debe
  dividir al término constante (independiente).


  ### Desarrollo didáctico


  Queremos factorizar $x^3 - 4x^2 + x + 6$.


  1. **Adivinar la raíz:** Probamos divisores del número final (6). Son: $\pm1, \pm2,
  \pm3, \pm6$.

  - Probemos $x = -1$. Evaluamos: $(-1)^3 - 4(-1)^2 + (-1) + 6 = -1 - 4 - 1 + 6 =
  0$. Es raíz.


  2. **Extraer el factor:** Sabemos que $(x - (-1)) = (x+1)$ es factor.


  3. **Aplicar Ruffini** para encontrar el otro paréntesis:

  Multiplicador: $-1$.

  Coeficientes: `1  -4   1   6`

  Ruffini nos dará una fila final: `1  -5   6  | 0`.


  4. **Armar el rompecabezas:** El polinomio original ahora es $(x + 1)(x^2 - 5x +
  6)$.


  5. **Seguir factorizando:** El trinomio $(x^2 - 5x + 6)$ lo podemos factorizar con
  el método simple de buscar dos números que multipliquen 6 y sumen -5. Son -2 y -3.
  Nos queda $(x-2)(x-3)$.


  **Factorización final:** $(x + 1)(x - 2)(x - 3)$. Hemos destrozado un polinomio
  de tercer grado en sus tres piezas lineales fundamentales.'
definiciones_clave: '- **Factorización mediante método de Ruffini**: Técnica de factorización
  para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en factorización mediante método de ruffini.'
