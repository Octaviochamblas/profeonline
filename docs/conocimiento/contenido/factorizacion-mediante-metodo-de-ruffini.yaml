resumen_inicial: El Método de Ruffini utiliza la división sintética para probar ceros
  candidatos y descomponer un polinomio de grado elevado en factores lineales e irreducibles.
explicacion_simple: Es una técnica para factorizar polinomios difíciles probando los
  divisores del término independiente. Si la división sintética da resto cero, se
  obtiene un factor lineal $(x - c)$ y se continúa reduciendo el polinomio.
explicacion_formal: 'Sea $P(x) = a_n x^n + \dots + a_0$ un polinomio con coeficientes
  enteros.


  El **Método de Ruffini para Factorización** aplica iterativamente la división sintética
  utilizando los candidatos a raíces racionales dados por el Teorema de las Raíces
  Racionales:


  $$\text{Candidatos a raíces } c = \frac{p}{q} \quad \text{donde } p \mid a_0 \text{
  y } q \mid a_n$$


  **Algoritmo de Descomposición:**

  1. Hallar un divisor $c$ tal que el resto de la división de Ruffini sea $R = 0$.

  2. Escribir $P(x) = (x - c) Q(x)$.

  3. Repetir el proceso sobre el cociente reducido $Q(x)$ hasta obtener factores lineales
  o cuadráticos irreducibles en $\mathbb{R}$.'
definiciones_clave: '- **Regla de Ruffini**: Algoritmo sintético de factorización
  iterativa basado en la búsqueda de ceros racionales.

  - **Polinomio reducido**: Cociente $Q(x)$ obtenido en cada etapa exitosa de división
  con resto nulo.'
propiedades_relaciones: '- **Criterio de los divisores**: Los posibles ceros enteros
  de un polinomio mónico $P(x)$ se encuentran exclusivamente entre los divisores positivos
  y negativos de su término independiente $a_0$.'
ejemplo_guiado:
  enunciado: Factorice el polinomio $P(x) = x^3 - 6x^2 + 11x - 6$ mediante el Método
    de Ruffini.
  pasos:
  - 'Paso 1: Listar los divisores del término independiente $a_0 = -6$: $\pm 1, \pm
    2, \pm 3, \pm 6$.'
  - 'Paso 2: Probar el candidato $c = 1$ en la tabla de Ruffini con coeficientes $[1,
    -6, 11, -6]$.'
  - 'Paso 3: Bajar $1 \implies 1 \cdot 1 = 1 \implies -6 + 1 = -5 \implies -5 \cdot
    1 = -5 \implies 11 - 5 = 6 \implies 6 \cdot 1 = 6 \implies -6 + 6 = 0$. Como $R
    = 0$, $c = 1$ es raíz y $(x - 1)$ es factor.'
  - 'Paso 4: El cociente reducido es $Q(x) = x^2 - 5x + 6$.'
  - 'Paso 5: Factorizar $Q(x) = (x - 2)(x - 3)$.'
  - 'Paso 6: Expresar la factorización final completa: $P(x) = (x - 1)(x - 2)(x -
    3)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al buscar ceros racionales para $x^3 - 3x - 2$, ¿cuáles son los posibles
    candidatos a evaluar?
  choices:
  - text: $\pm 1, \pm 2$
    is_correct: true
  - text: $\pm 1, \pm 3$
    is_correct: false
  - text: $\pm 2, \pm 3$
    is_correct: false
  - text: $\pm 1, \pm 6$
    is_correct: false
  explanation: Para un polinomio mónico, los ceros enteros posibles son los divisores
    de $-2$, correspondientes a la opción $\pm 1, \pm 2$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la regla de Ruffini entrega coeficientes $[1, 3, 2]$ con residuo $0$
    al probar $c = -1$ en un polinomio de grado 3, ¿cuál es su factorización parcial?
  choices:
  - text: $(x + 1)(x^2 + 3x + 2)$
    is_correct: true
  - text: $(x - 1)(x^2 + 3x + 2)$
    is_correct: false
  - text: $(x + 1)(x^2 - 3x + 2)$
    is_correct: false
  - text: $(x - 1)(x^2 - 3x - 2)$
    is_correct: false
  explanation: Como la raíz es $c = -1$, el factor es $(x + 1)$, formando la expresión
    $(x + 1)(x^2 + 3x + 2)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los divisores del término independiente $a_0$ como candidatos
  a raíces $c$.'
- 'Paso 2: Construir la tabla de Ruffini con los coeficientes ordenados del polinomio.'
- 'Paso 3: Ejecutar la regla de Ruffini probando candidatos hasta obtener un resto
  igual a cero ($R = 0$).'
- 'Paso 4: Escribir la factorización parcial $(x - c)Q(x)$ y continuar factorizando
  el cociente reducido $Q(x)$.'
errores_correccion: '- **Error 1: Continuar con un candidato cuyo resto $R \neq 0$.**
  **Cómo corregirlo:** Descartar de inmediato el número y probar con otro divisor
  de la lista.'
ejemplos:
- titulo: Factorización de polinomio cúbico con Ruffini
  enunciado: Factorice $x^3 - 4x^2 + x + 6$.
  respuesta: $(x + 1)(x - 2)(x - 3)$
  solucion_pasos:
  - '1. Divisores de $6$: $\pm 1, \pm 2, \pm 3, \pm 6$. Probar $c = -1$: Resto $0$,
    factor $(x + 1)$.'
  - '2. Cociente reducido: $x^2 - 5x + 6$.'
  - 3. Factorizar $x^2 - 5x + 6 = (x - 2)(x - 3)$.
  - '4. Resultado: $(x + 1)(x - 2)(x - 3)$.'
- titulo: ¿Se puede usar Ruffini si el término independiente $a_0$ es cero?
  respuesta: Sí, tras extraer factor común $x$
  solucion_pasos:
  - Sí; se extrae primero el factor común $x$ y luego se aplica el método de Ruffini
    al polinomio restante.
- titulo: ¿El método de Ruffini encuentra siempre raíces irracionales o complejas
    sencillamente?
  respuesta: 'No'
  solucion_pasos:
  - No; la prueba de divisores en Ruffini busca ceros racionales. Para raíces irracionales
    o complejas se requieren otros métodos.
errores_frecuentes:
- Evaluación de valores numéricos que no forman parte de los divisores del término
  independiente.
- Escritura del binomio $(x - c)$ manteniendo el signo original de una raíz positiva.
- Interrupción del cálculo tras hallar una sola raíz sin completar la factorización
  del cociente restante.
- Omisión de verificar la presencia de raíces de multiplicidad mayor a uno.
- Aplicación del esquema numérico sobre polinomios incompletos sin ordenar previamente.
afirmaciones_verdaderas:
- Los posibles ceros enteros de un polinomio mónico son siempre divisores de su término
  independiente.
- Una prueba de Ruffini es exitosa para factorización solo si el residuo final es
  exactamente cero.
al_terminar_debes_poder: Al terminar serás capaz de factorizar polinomios de grado
  3 o superior mediante el método iterativo de Ruffini.
