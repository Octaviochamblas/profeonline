procedimiento:
- 'Paso 1: Lista los posibles divisores enteros del término independiente (el número
  solo).'
- 'Paso 2: Evalúa el polinomio con esos números hasta encontrar uno que dé como resultado
  0 (esa es tu raíz).'
- 'Paso 3: Realiza la división sintética (Ruffini) usando esa raíz como multiplicador.'
- 'Paso 4: Comprueba que el resto sea 0. Si no es 0, te equivocaste en la suma o no
  era raíz.'
- 'Paso 5: Escribe la respuesta parcial como $(x - \text{raíz}) \cdot (\text{polinomio
  cociente})$.'
- 'Paso 6: Repite el proceso con el polinomio cociente si su grado es mayor a 2, o
  aplica métodos clásicos si es cuadrático.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en factorización mediante método de ruffini.
ejemplos:
- titulo: 'Factoriza $x^3 - 7x + 6$. (Ojo: falta $x^2$)'
  enunciado: 'Factoriza $x^3 - 7x + 6$. (Ojo: falta $x^2$).'
  solucion_pasos:
  - 'Divisores de 6: $\pm1, \pm2, \pm3, \pm6$. Probamos 1: $1^3 - 7(1) + 6 = 0$. Raíz:
    1.'
  - 'Ruffini con raíz 1. Coeficientes: `1, 0, -7, 6`.'
  - 'Fila final: `1  1  -6 | 0`. Cociente: $x^2 + x - 6$.'
  - 'Factorizamos el trinomio: $(x+3)(x-2)$.'
  - 'Resultado: $(x-1)(x+3)(x-2)$.'
- titulo: Si al hacer Ruffini en un grado 4 te da resto 0, ¿qué grado tiene el cociente?
  solucion_pasos:
  - Al extraer un factor lineal de un grado 4, el polinomio se reduce a un grado 3,
    al cual le puedes volver a aplicar Ruffini.
- titulo: 'Respecto de «Factorización mediante método de Ruffini»: ¿Describe adecuadamente
    el concepto'
  enunciado: 'Respecto de «Factorización mediante método de Ruffini»: ¿Describe adecuadamente
    el concepto esta frase? «El Método de Ruffini para factorizar consiste en: 1)
    Adivinar una raíz ''$c$'' probando divisores del término independiente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El Método de Ruffini para factorizar
    consiste en: 1) Adivinar una raíz ''$c$'' probando divisores del término independiente.'
- titulo: 'Respecto de «Factorización mediante método de Ruffini»: ¿Se puede aceptar
    esta afirmación? «'
  enunciado: 'Respecto de «Factorización mediante método de Ruffini»: ¿Se puede aceptar
    esta afirmación? «Adivinar un número que no es divisor del término independiente
    (ej. intentar probar el 5 si el término independiente es 6, lo cual es pérdida
    de tiempo en raíces enteras)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El Método de Ruffini para factorizar
    consiste en: 1) Adivinar una raíz ''$c$'' probando divisores del término independiente.'
errores_frecuentes:
- Adivinar un número que no es divisor del término independiente (ej. intentar probar
  el 5 si el término independiente es 6, lo cual es pérdida de tiempo en raíces enteras).
- Olvidar poner el factor lineal extraído en la respuesta final y entregar solo la
  factorización del cociente.
- De los múltiplos del coeficiente principal.
- Siempre probamos solo 1 y -1.
- De los números primos.
