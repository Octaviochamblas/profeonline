    is_correct: true
  - text: Modelo lineal directo
    is_correct: false
  - text: Modelo cuadrático
    is_correct: false
  - text: No se puede calcular
    is_correct: false
  explanation: La alternativa correcta es 'Modelo logarítmico (despeja el tiempo t a partir de la razón de crecimiento)'. Al buscar el tiempo donde $P(t) = 3P_0$, se aplica logaritmo para despejar el exponente.
  reinforcement_section: Explicación formal
