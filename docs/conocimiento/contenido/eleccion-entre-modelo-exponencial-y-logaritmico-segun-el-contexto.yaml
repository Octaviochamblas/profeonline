semantic_id: MAT.ALG.RELACION_EXP_LOG.ELECCION_MODELO
resumen_inicial: 'La elección entre un modelo exponencial y uno logarítmico según el contexto determina la herramienta matemática adecuada según la variable dependiente: predecir una cantidad física $y$ en función del tiempo $t$ requiere un modelo exponencial $y = y_0 b^t$, mientras que determinar el tiempo o esfuerzo $t$ necesario para alcanzar una meta o modelar saturación requiere un modelo logarítmico $t = \log_b(y / y_0)$.'
explicacion_simple: "![La elección entre un modelo exponencial y uno logarítmico según el contexto determina la herramienta matemática adecuada según la variable dependiente: predecir una cantidad física $y$ en función del tiempo $t$ requiere un modelo exponencial $y = y_0 b^t$, mientras que determinar el tiempo o esfuerzo $t$ necesario para alcanzar una meta o modelar saturación requiere un modelo logarítmico $t = \\log_b(y / y_0)$](/static/img/nodos/eleccion-entre-modelo-exponencial-y-logaritmico-segun-el-contexto-intro.svg)\n\n\n¿Cómo saber si un problema de la vida real se resuelve con un **modelo exponencial** o con un **modelo logarítmico**?\n\n- **Usa MODELO EXPONENCIAL ($y = y_0 \\cdot b^t$) cuando:**\n  - Te dan el **tiempo $t$** y te preguntan **\"¿Cuánto habrá?\"**.\n  - Crecimiento acelerado: bacterias que se multiplican, capital con interés compuesto, propagación de un virus.\n  - Decaimiento: depreciación de un auto, enfriamiento, desintegración radiactiva.\n- **Usa MODELO\
  \ LOGARÍTMICO ($t = \\log_b(y / y_0)$) cuando:**\n  - Te dan la **cantidad o meta $y$** y te preguntan **\"¿Cuánto tiempo tardará?\"**.\n  - Fenómenos con saturación o rendimientos decrecientes (curvas de aprendizaje, escalas sensoriales)."
explicacion_formal: "Sea un proceso dinámico continuo caracterizado por una tasa de variación proporcional $\\frac{dy}{dt} = k y$.\n1. **Formulación Exponencial Directa**:\n   Si la variable de salida es la cantidad de estado $y(t)$ dado el parámetro temporal $t$:\n   $$y(t) = y_0 e^{kt} \\quad (k > 0 \\text{ Crecimiento}, \\; k < 0 \\text{ Decaimiento})$$\n2. **Formulación Logarítmica Inversa (Tiempo de Tránsito / Meta)**:\n   Si la variable objetivo es el tiempo requerido $T(y)$ para alcanzar un nivel crítico de estado $y > 0$:\n   $$T(y) = \\frac{1}{k} \\ln\\left(\\frac{y}{y_0}\\right)$$\n3. **Criterio de Selección Estructural**:\n   - Si la derivada crece con la variable ($y' \\propto y$) $\\implies$ Modelo Exponencial.\n   - Si la derivada decrece con la variable ($y' \\propto 1/x$) $\\implies$ Modelo Logarítmico."
definiciones_clave: '- **Modelo directo exponencial**: Función que proyecta magnitudes futuras bajo crecimiento proporcional.

  - **Modelo inverso logarítmico**: Función que calcula tiempos de espera o comprime estímulos físicos.'
propiedades_relaciones: '- **Inversión temporal**: Despejar el tiempo en cualquier ley exponencial genera inmediatamente un modelo logarítmico.

  - **Vida media y duplicación**: $T_{\text{dup}} = \frac{\ln(2)}{k}$ y $T_{1/2} = \frac{\ln(2)}{\lambda}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La elección entre un modelo exponencial y uno logarítmico según el contexto determina la herramienta matemática adecuada según la variable dependiente: predecir una cantidad física $y$ en función del tiempo $t$ requiere un modelo exponencial $y = y_0 b^t$, mientras que determinar el tiempo o esfuerzo $t$ necesario para alcanzar una meta o modelar saturación requiere un modelo logarítmico $t = \log_b(y / y_0)$](/static/img/nodos/eleccion-entre-modelo-exponencial-y-logaritmico-segun-el-contexto-ejemplos.svg)



    Determina el modelo apropiado y resuelve en cada caso:

    1) Una inversión de $\$1.000.000\text{ pesos}$ crece al 8% anual compuesto. ¿Cuánto dinero habrá en 5 años?

    2) En la misma inversión, ¿cuántos años deben transcurrir para duplicar el capital a $\$2.000.000\text{ pesos}$?'
  pasos:
  - 'Paso 1: Para la pregunta 1:

    - Pregunta por el capital final $C(t)$ dado el tiempo $t = 5$.

    - **Modelo Exponencial**: $C(t) = 1.000.000 \cdot (1{,}08)^t$.

    - Cálculo: $C(5) = 1.000.000 \cdot (1{,}08)^5 \approx \mathbf{\$1.469.328\text{ pesos}}$.'
  - 'Paso 2: Para la pregunta 2:

    - Pregunta por el tiempo $t$ necesario para alcanzar la meta $C = 2.000.000$.

    - **Modelo Logarítmico**: $1.000.000 \cdot (1{,}08)^t = 2.000.000 \implies (1{,}08)^t = 2$.

    - Aplicar logaritmos: $t = \frac{\ln(2)}{\ln(1{,}08)} \approx \frac{0{,}6931}{0{,}07696} \approx \mathbf{9{,}01\text{ años}}$ (aproximadamente 9 años).'
