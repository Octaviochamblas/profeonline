  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar cuál es la variable de entrada dada y cuál es la incógnita pedida en el enunciado.'
- 'Paso 2: Si se busca la cantidad final tras un tiempo $t$, formular el modelo exponencial $y = y_0 b^t$.'
- 'Paso 3: Si se busca el tiempo para alcanzar una cantidad o meta $y$, formular el modelo logarítmico $t = \frac{\ln(y / y_0)}{\ln(b)}$.'
- 'Paso 4: Evaluar numéricamente e interpretar las unidades en el contexto del problema.'
errores_correccion: '- **Error común:** Intentar responder preguntas sobre tiempo usando tanteo en la calculadora en lugar de formular el modelo logarítmico exacto.

  - **Cómo corregirlo:** Plantea la ecuación $b^t = \text{meta}$ y **despeja el tiempo directamente con logaritmos**: $t = \mathbf{\frac{\ln(\text{meta})}{\ln(b)}}$.'
ejemplos:
- titulo: 'Ejemplo 1: Selección de modelo para cantidad'
  enunciado: Un cultivo bacteriano inicia con 200 bacterias y se duplica cada hora. ¿Qué modelo da la población tras $t$ horas?
  alternativas:
  - P(t) = 200 · 2ᵗ (Modelo Exponencial)
  - P(t) = log₂(200t)
  - P(t) = 200 + 2t
  - P(t) = 200 · t²
  respuesta: P(t) = 200 · 2ᵗ (Modelo Exponencial)
  solucion_pasos:
  - 'Paso 1: La cantidad crece exponencialmente: $P(t) = 200 \cdot 2^t$.'
- titulo: 'Ejemplo 2: Selección de modelo para tiempo'
  enunciado: En el mismo cultivo ($P(t) = 200 \cdot 2^t$), ¿cuántas horas tardará en llegar a 6.400 bacterias?
  alternativas:
  - t = 5 horas (log₂(32) = 5)
  - t = 32 horas
  - t = 16 horas
  - t = 6,4 horas
  respuesta: t = 5 horas (log₂(32) = 5)
  solucion_pasos:
  - 'Paso 1: $200 \cdot 2^t = 6.400 \implies 2^t = 32 \implies t = \log_2(32) = 5\text{ h}$.'
- titulo: 'Ejemplo 3: Tiempo de duplicación financiera'
  enunciado: Si una tasa de interés tiene factor $1{,}10$ anual, ¿cuántos años tarda en duplicar el dinero?
  alternativas:
  - t = ln(2) / ln(1,10) ≈ 7,27 años
  - t = 20 años
  - t = 10 años
  - t = 2 / 1,10 ≈ 1,81 años
  respuesta: t = ln(2) / ln(1,10) ≈ 7,27 años
  solucion_pasos:
  - 'Paso 1: $(1{,}10)^t = 2 \implies t = \frac{\ln(2)}{\ln(1{,}10)} \approx 7{,}27\text{ años}$.'
- titulo: 'Ejemplo 4: Modelo de vida media'
  enunciado: 'Una sustancia radiactiva decae según $N(t) = N_0 \cdot (0{,}5)^{t / 10}$. El tiempo para reducirse al 25% es:'
  alternativas:
  - t = 20 años (dos periodos de semidesintegración)
  - t = 10 años
  - t = 5 años
  - t = 40 años
  respuesta: t = 20 años (dos periodos de semidesintegración)
  solucion_pasos:
  - 'Paso 1: $(0{,}5)^{t/10} = 0{,}25 = (0{,}5)^2 \implies t/10 = 2 \implies t = 20\text{ años}$.'
errores_frecuentes:
- Usar modelos exponenciales cuando se solicita calcular tiempo sin despejar con logaritmos.
- Confundir la base del crecimiento con el tiempo transcurrido.
- Asumir que las metas financieras se alcanzan dividiendo por la tasa porcentual.
afirmaciones_verdaderas:
- El modelo exponencial predice cantidades futuras en función del tiempo transcurrido.
- El modelo logarítmico determina el tiempo requerido para que una magnitud alcance un umbral preestablecido.
al_terminar_debes_poder: '**QUÉ:** Elegir y aplicar el modelo exponencial o logarítmico según los requerimientos del contexto.


  **CÓMO:** Formulando y = y₀ bᵗ para calcular cantidades y t = log_b(y / y₀) para despejar tiempos de evolución.


