semantic_id: MAT.FUND.TABLAS_VERDAD.TAUTOLOGIA
resumen_inicial: 'Definición, identificación y propiedades de las tautologías como proposiciones universalmente verdaderas en todas sus interpretaciones.'
explicacion_simple: |
  Una **tautología** es una afirmación lógica que resulta **siempre Verdadera ($V$)**, sin importar qué valores de verdad tengan las proposiciones simples que la componen. Es una verdad universal dentro de la lógica. Cuando construyes su tabla de verdad, **todas las filas de la columna final son $V$**. Un ejemplo clásico es: "Hoy llueve o no llueve" ($p \lor \neg p$); pase lo que pase con el clima, esa frase siempre será verdadera.

  ![Infografía: Tautología](/static/img/nodos/tautologia-intro.svg)
explicacion_formal: |
  ### Definición formal
  En el cálculo proposicional, una fórmula bien formada $\Phi(p_1, \dots, p_n)$ es una **tautología** (o verdad lógica formal), denotado formalmente como:
  $$\models \Phi$$
  si y solo si para toda asignación veritativa o modelo $\mathcal{M} \in \mathbb{V}^n$, la función de verdad asigna el valor verdadero:
  $$\forall \mathcal{M}, \quad v_\mathcal{M}(\Phi) = V$$
  En términos algebraicos de Boole, el vector columna principal satisface $\mathbf{v}(\Phi) = \mathbf{1} = [V, V, \dots, V]^T$.

  ### Desglose simbólico
  - Notación: $\models \Phi$ (fórmula universalmente válida).
  - Tautología básica del tercero excluido: $\models p \lor \neg p$.
  - Tautología del principio de identidad: $\models p \to p$.
  - Tautología del Modus Ponens: $\models ((p \to q) \land p) \to q$.

  ### Síntesis didáctica
  Una tautología representa una ley lógica o teorema fundamental. Su validez descansa enteramente en la estructura sintáctica de sus conectivos y no en hechos empíricos contingentes.
definiciones_clave: |
  - **Tautología ($\models \Phi$)**: Proposición compuesta que es verdadera para todas las asignaciones posibles de su tabla de verdad.
  - **Ley lógica / Teorema proposicional**: Tautología que expresa una regla de deducción o equivalencia universal.
  - **Validez universal**: Propiedad semántica de no admitir ningún contraejemplo ($F$).
propiedades_relaciones: |
  - **Invarianza por sustitución**: Si $\Phi(p)$ es una tautología, reemplazar $p$ por cualquier fórmula compleja $\psi$ genera una nueva tautología $\Phi(\psi)$.
  - **Negación de la tautología**: La negación de cualquier tautología es una contradicción ($\neg \mathbf{1} \equiv \mathbf{0}$).
ejemplo_guiado:
  enunciado: |
    Demuestra mediante tabla de verdad que la fórmula $\Phi = (p \land (p \to q)) \to q$ es una tautología.

    ![Diagrama: Tautología](/static/img/nodos/tautologia-ejemplos.svg)

  pasos:
    - 'Paso 1: Disponer las $4$ combinaciones canónicas para $p$ y $q$.'
    - 'Paso 2: Calcular la columna auxiliar $(p \to q)$: $[V, F, V, V]^T$.'
    - 'Paso 3: Calcular la conjunción $p \land (p \to q)$:
      - Fila 1 ($V \land V$): $V$
      - Fila 2 ($V \land F$): $F$
      - Fila 3 ($F \land V$): $F$
      - Fila 4 ($F \land V$): $F$. Vector: $[V, F, F, F]^T$.'
    - 'Paso 4: Evaluar el condicional principal $[V, F, F, F]^T \to q$:
      - Fila 1: $V \to V = V$
      - Fila 2: $F \to F = V$
      - Fila 3: $F \to V = V$
      - Fila 4: $F \to F = V$'
    - 'Paso 5: Concluir que el vector resultante es $[V, V, V, V]^T$, lo que demuestra formalmente que la fórmula es una tautología (Regla del Modus Ponens).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué característica indispensable debe cumplir la columna principal de una tabla de verdad para que la fórmula sea una tautología?'
    choices:
      - {text: 'Todos los valores de la columna final deben ser estrictamente Verdaderos ($V$)', is_correct: true}
      - {text: 'Debe tener al menos un valor Verdadero y un valor Falso', is_correct: false}
      - {text: 'Todos los valores de la columna final deben ser Falsos ($F$)', is_correct: false}
      - {text: 'La primera fila debe ser Verdadera y la última Falsa', is_correct: false}
    explanation: 'La alternativa correcta es ''Todos los valores de la columna final deben ser estrictamente Verdaderos ($V$)''. Una sola fila con $F$ anula la condición de tautología.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes fórmulas proposicionales representa una tautología clásica fundamental?'
    choices:
      - {text: '$p \lor \neg p$', is_correct: true}
      - {text: '$p \land \neg p$', is_correct: false}
      - {text: '$p \to \neg p$', is_correct: false}
      - {text: '$p \land q$', is_correct: false}
    explanation: 'La alternativa correcta es ''$p \lor \neg p$''. Es el Principio del Tercero Excluido, siempre verdadero para cualquier valor de $p$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Construir la tabla de verdad completa con todas las $2^n$ filas correspondientes.'
  - 'Paso 2: Evaluar ordenadamente todas las columnas intermedias.'
  - 'Paso 3: Computar los valores de la columna principal.'
  - 'Paso 4: Inspeccionar la columna principal; si el $100\%$ de las celdas contienen $V$, clasificar la fórmula como tautología.'
errores_correccion: |
  - **Error 1:** Clasificar una fórmula como tautología si tiene 3 valores $V$ y 1 valor $F$. **Cómo corregirlo:** Una fórmula con presencia mixta de $V$ y $F$ es una contingencia; la tautología exige rigurosamente que la totalidad de las filas sean $V$.
  - **Error 2:** Confundir una proposición contingente que resulta verdadera en la realidad empírica con una tautología. **Cómo corregirlo:** Una tautología es verdadera por su pura estructura formal lógica en todos los mundos posibles, no por hechos empíricos accidentales.
ejemplos:
  - titulo: 'Principio de identidad'
    enunciado: '¿La fórmula $p \to p$ es una tautología?'
    alternativas:
      - 'Sí, su vector es $[V, V]^T$'
      - 'No, es una contingencia'
      - 'No, es una contradicción'
    respuesta: 'Sí, su vector es $[V, V]^T$'
    solucion_pasos:
      - '1. $V \to V = V$.'
      - '2. $F \to F = V$.'
      - '3. Todas las filas son $V$.'
  - titulo: 'Doble negación tautológica'
    enunciado: '¿La fórmula $\neg(\neg p) \leftrightarrow p$ es una tautología?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al ser una equivalencia lógica válida su bicondicional produce únicamente valores $V$.'
  - titulo: 'Ley del tercio excluso'
    enunciado: '¿En cuántas filas es verdadera la fórmula $p \lor \neg p$?'
    alternativas:
      - 'En todas sus filas'
      - 'En la mitad de las filas'
      - 'En ninguna'
    respuesta: 'En todas sus filas'
    solucion_pasos:
      - '1. Por definición de tautología, es verdadera en el 100% de las filas.'
  - titulo: 'Tautología en 3 variables'
    enunciado: '¿Una tautología con 3 variables tiene 8 valores verdaderos en su columna principal?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, contiene el vector $[V, V, V, V, V, V, V, V]^T$.'
errores_frecuentes:
  - 'La afirmación de que una fórmula con 3 resultados verdaderos y 1 falso se clasifica como una tautología.'
  - 'La afirmación de que la tautología depende de que las proposiciones simples hablen de hechos reales.'
  - 'La afirmación de que la fórmula $p \land \neg p$ es un ejemplo de tautología.'
  - 'La afirmación de que negar una tautología produce otra tautología equivalente.'
  - 'La afirmación de que una tautología puede volverse falsa si cambian las condiciones empíricas.'
afirmaciones_verdaderas:
  - 'Una fórmula proposicional es una tautología si y solo si su columna principal en la tabla de verdad contiene exclusivamente valores verdaderos ($V$) en todas sus interpretaciones.'
  - 'Toda tautología representa una ley lógica universalmente válida y su negación formal constituye una contradicción.'
al_terminar_debes_poder: |
  QUÉ: Identificar, demostrar y clasificar fórmulas proposicionales tautológicas ($\models \Phi$).
  CÓMO: Construir la tabla de verdad y verificar que el vector de la columna principal esté compuesto enteramente por valores $V$.

