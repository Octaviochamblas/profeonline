semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.PARAMETROS_INFINITAS_SOLUCIONES
resumen_inicial: 'Condición paramétrica para infinitas soluciones en un sistema 2x2:
  propiedades, resolución y modelamiento en Representación y clasificación de sistemas
  2x2.'
explicacion_simple: Para que sean ecuaciones dependientes, TODO debe ser proporcional.
  La división de las 'x', la división de las 'y' y la división de los números sueltos
  deben dar exactamente el mismo resultado.
explicacion_formal: '### Definición formal


  Dado un sistema $A_1x+B_1y=C_1$, $A_2x+B_2y=C_2$ con un coeficiente expresado como
  parámetro, el sistema tiene infinitas soluciones exactamente para el valor del parámetro
  que satisface la triple proporción $\frac{A_1}{A_2} = \frac{B_1}{B_2} = \frac{C_1}{C_2}$,
  condición que hace a ambas ecuaciones linealmente dependientes.


  ### Desarrollo didáctico


  Para que sean ecuaciones dependientes, TODO debe ser proporcional. La división de
  las ''x'', la división de las ''y'' y la división de los números sueltos deben dar
  exactamente el mismo resultado.


  Regla estricta de clonación: $\frac{A_1}{A_2} = \frac{B_1}{B_2} = \frac{C_1}{C_2}$.

  Igualas las fracciones que contengan a tu ''k'' con la fracción de los números conocidos,
  resuelves, y habrás encontrado el valor maestro.'
definiciones_clave: '- **Condición paramétrica para infinitas soluciones en un sistema
