procedimiento:
- 'Arma las tres fracciones usando los coeficientes de las dos ecuaciones: ''x'',
  ''y'' y números sueltos.'
- 'Plantea la igualdad triple: $\frac{A_1}{A_2} = \frac{B_1}{B_2} = \frac{C_1}{C_2}$.'
- Toma dos de las fracciones (una que contenga el parámetro y otra que tenga puros
  números) y resuélvelas con multiplicación cruzada.
