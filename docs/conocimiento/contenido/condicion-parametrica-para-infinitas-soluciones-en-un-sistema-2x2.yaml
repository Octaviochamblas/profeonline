semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.PARAMETROS_INFINITAS_SOLUCIONES
resumen_inicial: La condición paramétrica para infinitas soluciones exige la triple
  igualdad entre las razones de coeficientes y constantes.
explicacion_simple: 'Para que un sistema con un parámetro $k$ tenga **infinitas soluciones**,
  debemos forzar a que las dos ecuaciones representen exactamente la misma recta.

  Igualamos las tres razones de coeficientes (de $x$, de $y$ y de las constantes)
  y despejamos el valor exacto de $k$ que hace que las tres razones sean idénticas.'
explicacion_formal: 'Dado el sistema con parámetro $k \in \mathbb{R}$:


  $$\begin{cases} a_1(k) x + b_1(k) y = c_1(k) \\ a_2 x + b_2 y = c_2 \end{cases}$$


  La **condición de infinitas soluciones** (Compatible Indeterminado) exige la triple
  igualdad simultánea:


  $$\frac{a_1(k)}{a_2} = \frac{b_1(k)}{b_2} = \frac{c_1(k)}{c_2} = m \quad (m \in
  \mathbb{R})$$


  $$\iff \Delta = 0 \quad \land \quad \Delta_x = 0 \quad \land \quad \Delta_y = 0$$'
definiciones_clave: '- **Condición paramétrica de infinitas soluciones**: Sistema
  de ecuaciones sobre el parámetro $k$ para lograr coincidencia total entre ambas
  rectas.

  - **Proporcionalidad paramétrica de rectas**: Factor de escala $m$ que satisface
  todas las componentes del sistema.'
propiedades_relaciones: '- **Exigencia triple**: A diferencia de la solución única,
  aquí el término independiente $c_1, c_2$ SÍ DEBE ser proporcional a las demás razones.'
ejemplo_guiado:
  enunciado: Halla el valor del parámetro $k$ para el cual el sistema $\begin{cases}
    2x + ky = 6 \\ 4x + 6y = 12 \end{cases}$ posee infinitas soluciones.
  pasos:
  - 'Paso 1: Plantear la triple igualdad de razones: $\frac{2}{4} = \frac{k}{6} =
    \frac{6}{12}$.Paso 2: Simplificar la razón conocida: $\frac{2}{4} = \frac{1}{2}$
    y $\frac{6}{12} = \frac{1}{2}$.Paso 3: Igualar la razón del parámetro a $\frac{1}{2}$:
    $\frac{k}{6} = \frac{1}{2}$.Paso 4: Multiplicar por $6$: $k = 6 \cdot \frac{1}{2}
    = 3$.Paso 5: Concluir que para $k = 3$ el sistema tiene infinitas soluciones.'
checkpoints:
- placement: after_explicacion_formal
  question: Para que el sistema $\begin{cases} 2x + ky = 6 \\ 4x + 6y = 12 \end{cases}$
    tenga infinitas soluciones, ¿cuál debe ser el valor exacto de $k$?
  choices:
  - text: $k = 3$
    is_correct: true
  - text: $k = 6$
    is_correct: false
  - text: $k = 12$
    is_correct: false
  - text: $k = 0$
    is_correct: false
  explanation: La alternativa correcta es '$k = 3$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al sustituir $k = 3$ en el sistema original, ¿cuál es la relación entre
    ambas ecuaciones?
  choices:
  - text: La segunda ecuación es exactamente el doble de la primera ($2 \cdot (2x
      + 3y = 6) \implies 4x + 6y = 12$).
    is_correct: true
  - text: Las ecuaciones representan rectas perpendiculares.
    is_correct: false
  - text: Las constantes se anulan quedando $0 = 0$.
    is_correct: false
  - text: La primera ecuación carece de solución.
    is_correct: false
  explanation: La alternativa correcta es 'La segunda ecuación es exactamente el doble
    de la primera ($2 \cdot (2x + 3y = 6) \implies 4x + 6y = 12$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la triple igualdad de razones $\frac{a_1}{a_2} = \frac{b_1}{b_2}
  = \frac{c_1}{c_2}$.'
- 'Paso 2: Calcular el valor constante simplificado de la razón entre números conocidos.'
- 'Paso 3: Igualar la razón que contiene al parámetro $k$ a ese valor constante.'
- 'Paso 4: Despejar $k$ y verificar que satisfaga todas las ecuaciones.'
errores_correccion: '- **Error común:** Olvidar verificar que la razón de las constantes
  $\frac{c_1}{c_2}$ sea también igual a las otras dos razones.

  - **Cómo corregirlo:** Para tener INFINITAS soluciones, las TRES razones deben ser
  iguales. Si la tercera es diferente, el sistema no tendrá solución.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de clasificación.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de clasificación.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un sistema con solución única se representa por dos rectas secantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, se cortan en un único punto del plano.
- titulo: ¿Dos rectas paralelas representan un sistema sin solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, al no tener puntos en común no existe solución.
errores_frecuentes:
  - 'Para hallar la condición de infinitas soluciones en $\begin{cases} 2x + ky = 6 \\ 4x + 6y = 12 \end{cases}$, se iguala únicamente la razón de coeficientes $\frac{2}{4} = \frac{k}{6}$ omitiendo la constante.'
  - 'Al evaluar un sistema con infinitas soluciones, se concluye que cualquier par ordenado $(x, y) \in \mathbb{R}^2$ es solución del sistema.'
  - 'Un sistema con parámetro $k$ posee infinitas soluciones cuando las razones entre coeficientes resultan ser desiguales.'
  - 'La coincidencia de dos rectas en el plano cartesiano permite que sus ecuaciones asociadas posean pendientes distintas.'
  - 'La presencia de una razón de constantes diferente $\frac{c_1}{c_2}$ no altera la condición de infinitas soluciones del sistema.'
afirmaciones_verdaderas:
  - 'Un sistema 2x2 parametrizado admite infinitas soluciones si y solo si las tres razones de coeficientes y constantes son iguales.'
  - 'Si las tres razones paramétricas coinciden, las dos rectas se superponen formando rectas coincidentes en el plano.'
al_terminar_debes_poder: |
  QUÉ: Determinar las condiciones paramétricas para que un sistema 2x2 posea infinitas soluciones.
  CÓMO: Formular la triple igualdad de razones $\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$, despejar el parámetro $k$ e interpretar sus rectas como coincidentes.
