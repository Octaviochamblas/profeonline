procedimiento:
- 'Paso 1: Ubica al observador y traza la horizontal a la altura de sus ojos.'
- 'Paso 2: Traza la línea de mira desde el observador hasta el objeto (que está por
  encima de la horizontal).'
- 'Paso 3: El ángulo entre la horizontal y la línea de mira, medido hacia arriba,
  es el ángulo de elevación.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con concepto de ángulo de elevación medido hacia arriba desde
  la horizontal.
