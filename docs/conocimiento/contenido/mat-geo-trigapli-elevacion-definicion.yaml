semantic_id: MAT.GEO.TRIG_APLICACIONES.ELEVACION_DEFINICION
resumen_inicial: 'Concepto de ángulo de elevación medido hacia arriba desde la horizontal:
  conceptos, teoremas, propiedades geométricas y cálculo en Trigonometría en el Triángulo
  Rectángulo.'
explicacion_simple: 'Cuando alguien mira hacia un objeto que está más arriba que sus
  ojos (la cima de un edificio, un dron, la punta de un cerro), se forma un ángulo
  entre la horizontal y la línea de mira: ese es el ángulo de elevación.'
explicacion_formal: '![Ángulo de elevación](/static/img/geometria/trigonometria/trigapli-elevacion-definicion.svg)


  ### Definición formal


  Sea un observador situado en un punto y un objeto ubicado por encima del nivel de
  sus ojos. El ángulo de elevación $\theta$ es el ángulo agudo entre la recta horizontal
  que pasa por el observador y la línea de mira (recta que une al observador con el
  objeto).


  ### Desarrollo didáctico


  En la figura, el observador está en el vértice inferior derecho, mirando hacia el
  objeto ubicado arriba. La horizontal es el segmento hacia la base del objeto, y
  la línea de mira es la hipotenusa. El ángulo $\theta$ entre ambas es el ángulo de
  elevación, y junto con la distancia horizontal $d$ permite calcular la altura $h$
  mediante $\tan\theta=\dfrac{h}{d}$.'
definiciones_clave: '- **Concepto de ángulo de elevación medido hacia arriba desde
  la horizontal**: Elemento o propiedad fundamental en el estudio de trigonometría
  en el triángulo rectángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
