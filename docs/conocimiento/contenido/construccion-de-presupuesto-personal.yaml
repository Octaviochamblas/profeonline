resumen_inicial: 'Un presupuesto personal es la planificación financiera que equilibra
  los ingresos totales esperados con la distribución proyectada entre gastos fijos,
  variables, ahorro y pago de deudas: $I_{total} = G_{fijos} + G_{var} + D + Ahorro$.'
explicacion_simple: Un presupuesto es un plan escrito donde organizamos nuestro sueldo
  antes de gastarlo. Asignamos primero el dinero para los gastos obligatorios y deudas,
  dejamos un porcentaje para ahorro y destinamos el resto a nuestros consumos personales.
explicacion_formal: 'La **Ecuación de Equilibrio Presupuestario** exige la asignación
  completa de los ingresos proyectados:


  $$I_{total} = G_{fijo} + G_{variable} + C_{deudas} + A_{ahorro}$$


  **Regla técnica de salud financiera (Regla 50/30/20):**

  - $50\%$ para necesidades básicas y gastos fijos.

  - $30\%$ para gastos variables y deseos personales.

  - $20\%$ para ahorro e inversión.'
definiciones_clave: '- **Presupuesto personal**: Herramienta de planificación financiera
  $I_{total} = G_{tot} + D_{tot} + A_{ahorro}$.'
propiedades_relaciones: '- **Equilibrio financiero**: El total de ingresos asignados
  debe cubrir las obligaciones y metas de ahorro.'
ejemplo_guiado:
  enunciado: Un sueldo de \$800.000 se distribuye según la regla 50/30/20. Calcule
    los montos para Necesidades básicas, Deseos y Ahorro.
  pasos:
  - 'Paso 1: Necesidades básicas ($50\%$): $800.000 \cdot 0,50 = 400.000$.'
  - 'Paso 2: Deseos y estilo de vida ($30\%$): $800.000 \cdot 0,30 = 240.000$.'
  - 'Paso 3: Ahorro e inversión ($20\%$): $800.000 \cdot 0,20 = 160.000$.'
  - 'Conclusión: \$400.000 en necesidades, \$240.000 en deseos y \$160.000 en ahorro.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué proporción de ingresos asigna la regla presupuestaria 50/30/20 al
    ahorro e inversión?
  choices:
  - text: Asigna el 20% de los ingresos totales al ahorro
    is_correct: true
  - text: Asigna el 50% al ahorro
    is_correct: false
  - text: Asigna el 30% al ahorro
    is_correct: false
  - text: No destina nada al ahorro
    is_correct: false
  explanation: La alternativa correcta es 'Asigna el 20% de los ingresos totales al
    ahorro'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para un sueldo de $800.000 con la regla 50/30/20,
    ¿cuánto se destina a necesidades básicas?
  choices:
  - text: 400.000 $
    is_correct: true
  - text: 240.000 $
    is_correct: false
  - text: 160.000 $
    is_correct: false
  - text: 500.000 $
    is_correct: false
  explanation: La alternativa correcta es '400.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de construir un presupuesto personal
  equilibrado aplicando fórmulas de asignación porcentual como la regla 50/30/20.
semantic_id: MAT.NUM.FINANZAS_PERSONALES.PRESUPUESTO_PERSONAL
procedimiento:
- 'Paso 1: Identificar las variables financieras de ingresos, gastos, tasas de interés
  o sueldos imponibles.'
- 'Paso 2: Aplicar la fórmula financiera correspondiente ($B = I - G$, $R\%$, $r_{real}$
  o $10\% \text{ AFP}$).'
- 'Paso 3: Calcular el resultado y evaluar la estabilidad presupuestaria.'
errores_correccion: '- **Error 1: Confundir la tasa de interés nominal con la tasa
  real sin restar la inflación del IPC.** **Cómo corregirlo:** La ganancia real de
  poder adquisitivo exige descontar el IPC ($r_{real} \approx r_{nominal} - \text{IPC}$).


  - **Error 2: Calcular la cotización previsional de AFP sobre el sueldo líquido en
  vez del imponible.** **Cómo corregirlo:** El $10\%$ obligatorio se aplica estrictamente
  sobre el SUELDO IMPONIBLE (hasta el tope legal).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.FINANZAS_PERSONALES.PRESUPUESTO_PERSONAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de finanzas personales.
- titulo: Ejemplo 2
  enunciado: Verificación de equilibrio financiero.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal de balance o cotización.
- titulo: ¿Es el 10% el porcentaje obligatorio de cotización previsional a la AFP?
  respuesta: Sí
  solucion_pasos:
  - Sí, sobre el sueldo imponible hasta el tope legal.
- titulo: ¿Genera un balance B = I - G positivo capacidad de ahorro?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa un superávit mensual de caja.
errores_frecuentes:
- Calcular el porcentaje de cotización previsional a la AFP sobre el sueldo líquido
  recibido en cuenta corriente.
- Sumar directamente la tasa de interés nominal y la inflación pretendiendo obtener
  la rentabilidad real.
- Considerar los gastos variables como egresos de costo fijo que no se pueden modificar
  mensualmente.
- La tasa de inflación del IPC incrementa el poder adquisitivo del dinero depositado
  a tasa fija.
- Clasificar el dividendo pagado por acciones como un gasto imprevisto en el presupuesto
  personal.
afirmaciones_verdaderas:
- 'El balance financiero de caja se calcula restando los egresos totales a los ingresos
  recibidos: $B_{neto} = I_{total} - G_{total}$.'
- La cotización previsional obligatoria a la AFP en Chile equivale al 10% del sueldo
  imponible ajustado al tope legal.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
