semantic_id: MAT.NUM.FINANZAS_PERSONALES.PRESUPUESTO_PERSONAL
resumen_inicial: 'Construcción de presupuesto personal: concepto y propiedades fundamentales
  en Finanzas personales.'
explicacion_simple: Si no le dices a tu dinero a dónde ir, terminarás preguntándote
  a dónde se fue. El presupuesto no es para restringirte, es un plan para que el dinero
  alcance para tus metas.
explicacion_formal: 'Un **Presupuesto Personal** es un documento (o tabla Excel) donde
  planificas el mes.

  Se construye sumando todos tus **Ingresos Totales** y restando todos tus **Gastos
  (Fijos y Variables)**.


  Estructura ideal (Regla 50/30/20):

  - **50% Necesidades Básicas:** Arriendo, comida, transporte, servicios.

  - **30% Gastos Personales / Deseos:** Salidas, ropa, entretenimiento.

  - **20% Ahorro / Pago de deudas:** Dinero que se guarda para el futuro o emergencias.


  El peor error es ''ahorrar lo que sobra a fin de mes'' (porque nunca sobra). El
  ahorro debe presupuestarse como si fuera un gasto fijo al principio del mes (''Págate
  a ti mismo primero'').'
definiciones_clave: '- **Construcción de presupuesto personal**: Elemento central
  dentro del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a construcción de presupuesto personal.'
ejemplo_guiado:
  enunciado: Aplica el concepto de construcción de presupuesto personal en un ejercicio
    paso a paso.
  pasos:
  - Identificar los datos dados en el problema.
  - Aplicar la regla o fórmula correspondiente a construcción de presupuesto personal.
  - Efectuar los cálculos aritméticos necesarios.
  - Concluir con el resultado final simplificado.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con construcción de presupuesto
    personal?
  choices:
  - text: Identificar correctamente la relación de finanzas personales
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de finanzas
    personales. Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de construcción de presupuesto personal,
    ¿qué paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado.
    Paso clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Suma tus ingresos fijos del mes.'
- 'Paso 2: Define tu meta de ahorro y sepárala de inmediato.'
- 'Paso 3: Lista tus gastos fijos obligatorios.'
- 'Paso 4: Asigna el resto del dinero a tus gastos variables hasta que la cuenta llegue
  a cero ($Ingresos - Ahorro - Gastos = 0$).'
errores_correccion: Evita confundir los datos de entrada al operar con construcción
  de presupuesto personal.
ejemplos:
- titulo: Aplicando la regla 50/30/20
  enunciado: Si ganas $600.000 al mes, ¿cuánto deberías destinar al ahorro idealmente
    usando la regla 50/30/20?
  solucion_pasos:
  - El 20% debe ir a Ahorro.
  - 20% de 600.000 es $600.000 \cdot 0.20 = 120.000$.
  - Deberías ahorrar $120.000 mensuales.
errores_frecuentes:
- No incluir los gastos 'hormiga' (café, golosinas, Uber) en el presupuesto, los cuales
  terminan desequilibrándolo a fin de mes.
- Poner el ahorro al final de la lista de prioridades.
afirmaciones_verdaderas:
- La propiedad de construcción de presupuesto personal preserva la consistencia lógica.
al_terminar_debes_poder: Resolver problemas aplicados que involucren construcción
  de presupuesto personal.
fuente: Currículum Nacional MINEDUC.
estado: publicado
