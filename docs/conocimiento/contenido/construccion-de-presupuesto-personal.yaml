semantic_id: MAT.NUM.FINANZAS_PERSONALES.PRESUPUESTO_PERSONAL
resumen_inicial: 'La construcción de un presupuesto personal distribuye el ingreso líquido mensual según la regla proporcional 50-30-20: $50\%$ para necesidades básicas, $30\%$ para deseos y ocio, y $20\%$ para ahorro e inversión.'
explicacion_simple: |
  Un **presupuesto personal** es tu plan de navegación financiera para decidir adónde va tu dinero antes de que empiece el mes.
  Una de las reglas más utilizadas y efectivas es la **regla 50-30-20**:
  - **$50\%$ en Necesidades**: Lo indispensable para vivir (arriendo, servicios básicos, supermercado, transporte).
  - **$30\%$ en Deseos**: Tus gustos personales, salidas, hobbies y entretenimiento (estilo de vida).
  - **$20\%$ en Ahorro / Inversión**: Construcción de tu fondo de emergencia, ahorro para metas y pago acelerado de deudas.

  ![Construcción de presupuesto personal](/static/img/nodos/construccion-de-presupuesto-personal-intro.svg)
explicacion_formal: |
  ### Definición formal
  El **presupuesto financiero personal** es la asignación determinística del ingreso disponible líquido $I_L$ en tres conjuntos disjuntos de gasto y acumulación:
  $$I_L = N + D + A$$
  donde los coeficientes paramétricos de la regla clásica 50-30-20 establecen:
  - **Necesidades ($N$)**: $N \le 0,50 \cdot I_L$
  - **Deseos discrecionales ($D$)**: $D \le 0,30 \cdot I_L$
  - **Ahorro e inversión ($A$)**: $A \ge 0,20 \cdot I_L$

  ### Monitoreo de Desviaciones Presupuestarias
  Para cada categoría $k$, la varianza presupuestaria $V_k$ mide la fidelidad del plan:
  $$V_k = \text{Gasto Real}_k - \text{Gasto Presupuestado}_k$$
  - $V_k > 0 \implies$ Sobregiro presupuestario.
  - $V_k < 0 \implies$ Ahorro o subejecución favorable.

  ### Síntesis didáctica
  - Ecuación presupuestaria: $I_L = 0,50 I_L + 0,30 I_L + 0,20 I_L$.
  - Meta de ahorro: Al menos el $20\%$ del ingreso líquido mensual.
definiciones_clave: |
  - **Presupuesto base cero**: Método donde cada peso del ingreso tiene una asignación específica asignada previa al inicio del mes ($I_L - \sum \text{Asignaciones} = 0$).
  - **Regla 50-30-20**: Marco proporcional de distribución óptima del ingreso disponible.
  - **Pagarse a uno mismo primero**: Hábito de separar el monto de ahorro ($20\%$) inmediatamente al recibir el sueldo, antes de ejecutar cualquier otro gasto.
propiedades_relaciones: |
  - **Adaptabilidad a ingresos variables**: Las proporciones porcentuales se escalan automáticamente ante fluctuaciones del ingreso total percibido.
  - **Protección contra la inflación del estilo de vida**: Limitar los deseos al $30\%$ evita que los aumentos de sueldo sean absorbidos íntegramente por consumo innecesario.
ejemplo_guiado:
  enunciado: 'Una persona recibe un ingreso líquido mensual de $\$800.000$. Estructura su presupuesto mensual aplicando la regla 50-30-20.'
  imagen: '/static/img/nodos/construccion-de-presupuesto-personal-ejemplos.svg'
  pasos:
    - 'Paso 1: Calculamos el monto para Necesidades ($50\%$): $N = 800.000 \cdot 0,50 = $\$400.00$0$ (vivienda, comida, servicios).'
    - 'Paso 2: Calculamos el monto para Deseos ($30\%$): $D = 800.000 \cdot 0,30 = $\$240.00$0$ (salidas, ocio, entretenimiento).'
    - 'Paso 3: Calculamos el monto para Ahorro ($20\%$): $A = 800.000 \cdot 0,20 = $\$160.00$0$ (ahorro, inversión, fondo de reserva).'
    - 'Paso 4: Verificación: $400.000 + 240.000 + 160.000 = $\$800.00$0$. El ahorro mensual programado es de **$\$160.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Según la regla presupuestaria 50-30-20, ¿qué porcentaje del ingreso líquido debe destinarse como mínimo al ahorro e inversión?'
    choices:
      - {text: 'El $20\%$ del ingreso líquido mensual', is_correct: true}
      - {text: 'El $50\%$ del ingreso líquido mensual', is_correct: false}
      - {text: 'El $30\%$ del ingreso líquido mensual', is_correct: false}
      - {text: 'Únicamente lo que sobre al final del mes', is_correct: false}
    explanation: 'La alternativa correcta es ''El $20\%$ del ingreso líquido mensual''. Es la proporción mínima recomendada para construir patrimonio y seguridad financiera.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para un ingreso de $\$600.000$, ¿cuál es el monto máximo sugerido para gastos en deseos (30%)?'
    choices:
      - {text: '$\$180.000$, calculando $600.000 \cdot 0,30 = 180.000$', is_correct: true}
      - {text: '$\$300.000$, calculando el 50%', is_correct: false}
      - {text: '$\$120.000$, calculando el 20%', is_correct: false}
      - {text: '$\$60.000$, calculando el 10%', is_correct: false}
    explanation: 'La alternativa correcta es ''$\$180.000$, calculando $600.000 \cdot 0,30 = 180.000$''. Representa el $30\%$ del presupuesto.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Determinar el ingreso neto o líquido mensual total ($I_L$).'
  - 'Paso 2: Calcular el límite para necesidades básicas multiplicando $I_L \cdot 0,50$.'
  - 'Paso 3: Calcular el límite para deseos discrecionales multiplicando $I_L \cdot 0,30$.'
  - 'Paso 4: Asignar la cuota de ahorro multiplicando $I_L \cdot 0,20$ y verificar que la suma totalice $100\%$ del ingreso.'
errores_correccion: |
  - **Error 1:** Ahorrar únicamente lo que "sobra" al final del mes en lugar de apartar el $20\%$ al inicio. **Cómo corregirlo:** Aplica el principio de **pagarte a ti mismo primero**: transfiere el ahorro el día que recibes tu sueldo.
  - **Error 2:** Etiquetar compras prescindibles o salidas a restaurantes como necesidades básicas. **Cómo corregirlo:** Sé riguroso: las **necesidades son solo lo indispensable para subsistir y trabajar**.
ejemplos:
  - titulo: 'Presupuesto para sueldo de $1.000.000'
    enunciado: '¿Cuánto debe destinarse a necesidades básicas ($50\%$) con un ingreso de $\$1.000.000$?'
    alternativas:
      - '$\$500.000$'
      - '$\$300.000$'
      - '$\$200.000$'
    respuesta: '$\$500.000$'
    solucion_pasos:
      - '1. $1.000.000 \cdot 0,50 = $\$500.00$0$.'
  - titulo: 'Ahorro anual programado'
    enunciado: 'Si una persona ahorra el $20\%$ de $\$800.000$ todos los meses, ¿cuánto reúne en 1 año (12 meses)?'
    alternativas:
      - '$\$1.920.000$'
      - '$\$1.600.000$'
      - '$\$960.000$'
    respuesta: '$\$1.920.000$'
    solucion_pasos:
      - '1. Ahorro mensual: $800.000 \cdot 0,20 = $\$160.00$0$.'
      - '2. Ahorro anual: $160.000 \cdot 12 = $\$1.920.00$0$.'
  - titulo: 'Detección de sobregiro'
    enunciado: 'Si alguien gasta el $65\%$ de su ingreso en necesidades y el $30\%$ en deseos, ¿cuánto le queda para ahorrar?'
    alternativas:
      - '$5\%$, generando un déficit de ahorro respecto a la meta del 20%'
      - '$20\%$, porque el ahorro es fijo'
      - '$0\%$, porque está endeudado'
    respuesta: '$5\%$, generando un déficit de ahorro respecto a la meta del 20%'
    solucion_pasos:
      - '1. $100\% - 65\% - 30\% = 5\%$.'
  - titulo: 'Ajuste proporcional'
    enunciado: '¿Si el ingreso líquido sube de $\$500.000$ a $\$700.000$, el ahorro del $20\%$ sube de $\$100.000$ a $\$140.000$?'
    alternativas:
      - 'Sí, manteniendo constante la tasa porcentual de ahorro'
      - 'No, el ahorro debe mantenerse en $\$100.000$'
      - 'No, el ahorro baja'
    respuesta: 'Sí, manteniendo constante la tasa porcentual de ahorro'
    solucion_pasos:
      - '1. $700.000 \cdot 0,20 = $\$140.00$0$.'
errores_frecuentes:
  - 'El monto de ahorro mensual se define exclusivamente como el remanente que sobra tras realizar todos los consumos del mes.'
  - 'Los gastos en ocio y salidas nocturnas se clasifican dentro del porcentaje del cincuenta por ciento de necesidades básicas.'
  - 'La regla 50-30-20 destina el cincuenta por ciento del ingreso total a gastos de entretenimiento.'
  - 'El presupuesto personal se calcula sobre el sueldo bruto antes de aplicar los descuentos previsionales legales.'
  - 'La suma de las tres asignaciones presupuestarias supera el cien por ciento del ingreso líquido disponible.'
afirmaciones_verdaderas:
  - 'La regla 50-30-20 distribuye el ingreso líquido en $50\%$ necesidades, $30\%$ deseos y $20\%$ ahorro e inversión.'
  - 'El principio de pagarse primero consiste en separar el porcentaje de ahorro de forma automática al recibir el ingreso.'
