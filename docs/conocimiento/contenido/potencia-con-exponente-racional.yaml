semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_RACIONAL
resumen_inicial: 'Una potencia con exponente racional $a^{m/n}$ representa una raíz enésima: el numerador $m$ es la potencia y el denominador $n$ es el índice radical ($a^{m/n} = \sqrt[n]{a^m}$).'
explicacion_simple: '![Potencia con exponente racional](/static/img/nodos/potencia-con-exponente-racional-intro.svg)


  Las potencias con fracciones en el exponente son simplemente otra forma de escribir raíces. El número de arriba de la fracción (numerador) es la potencia, y el número de abajo (denominador) es el índice de la raíz. Por ejemplo, $8^{2/3}$ significa la raíz cúbica de $8$ elevada al cuadrado: $\sqrt[3]{8} = 2$, y luego $2^2 = 4$. Esto permite resolver raíces usando todas las leyes de potencias.'
explicacion_formal: 'Sea $a \in \mathbb{R}$, $m \in \mathbb{Z}$ y $n \in \mathbb{N}$ con $n \ge 2$. La **Potencia con Exponente Racional** se define mediante la equivalencia con la radicación:


  $$a^{m/n} = \sqrt[n]{a^m} = (\sqrt[n]{a})^m$$


  **Restricciones de existencia en $\mathbb{R}$:**

  1. **Índice par ($n$ par):** La base debe ser no negativa ($a \ge 0$) para que la raíz exista en $\mathbb{R}$. Expresiones como $(-4)^{1/2} = \sqrt{-4} \notin \mathbb{R}$.

  2. **Índice impar ($n$ impar):** La base puede ser cualquier número real ($a \in \mathbb{R}$), por ejemplo $(-8)^{1/3} = \sqrt[3]{-8} = -2$.


  **Exponentes racionales negativos:**

  $$a^{-m/n} = \frac{1}{a^{m/n}} = \frac{1}{\sqrt[n]{a^m}} \quad (a > 0)$$'
definiciones_clave: '- **Exponente racional ($m/n$)**: Superíndice fraccionario que unifica potencias y raíces.

  - **Numerador ($m$)**: Potencia a la que queda elevada la base.

  - **Denominador ($n$)**: Índice de la raíz a extraer.'
propiedades_relaciones: '- **Leyes de exponentes en radicales**: $\sqrt{a} \cdot \sqrt[3]{a} = a^{1/2} \cdot a^{1/3} = a^{1/2 + 1/3} = a^{5/6} = \sqrt[6]{a^5}$.

  - **Cálculo óptimo**: Conviene extraer primero la raíz y luego potenciar: $(\sqrt[n]{a})^m$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de potencias con exponente racional](/static/img/nodos/potencia-con-exponente-racional-ejemplos.svg)


    Calcule el valor de $27^{2/3}$, $16^{3/4}$ y $4^{-1/2}$.'
  pasos:
  - 'Paso 1: Evaluar $27^{2/3}$: Transformar a $(\sqrt[3]{27})^2$. Como $\sqrt[3]{27} = 3$, queda $3^2 = 9$.'
  - 'Paso 2: Evaluar $16^{3/4}$: Transformar a $(\sqrt[4]{16})^3$. Como $\sqrt[4]{16} = 2$, queda $2^3 = 8$.'
  - 'Paso 3: Evaluar $4^{-1/2}$: Aplicar exponente negativo y racional: $\frac{1}{4^{1/2}} = \frac{1}{\sqrt{4}} = \frac{1}{2}$.'
  - 'Conclusión: $27^{2/3} = 9$, $16^{3/4} = 8$ y $4^{-1/2} = \frac{1}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué raíz equivale la potencia $x^{3/5}$?
  choices:
  - text: $\sqrt[5]{x^3}$ (índice 5 y potencia 3)
    is_correct: true
  - text: $\sqrt[3]{x^5}$
    is_correct: false
  - text: $\frac{x^3}{5}$
    is_correct: false
  - text: $\frac{3}{5}x$
    is_correct: false
  explanation: La alternativa correcta es '$\sqrt[5]{x^3}$ (índice 5 y potencia 3)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el cálculo más rápido para $27^{2/3}$?
  choices:
  - text: Calcular primero $\sqrt[3]{27} = 3$ y luego elevar $3^2 = 9$
    is_correct: true
  - text: Calcular $27^2 = 729$ y luego buscar su raíz cúbica
    is_correct: false
  - text: Multiplicar $27$ por dos tercios
    is_correct: false
  - text: Dividir $27$ entre $3$
    is_correct: false
  explanation: La alternativa correcta es 'Calcular primero $\sqrt[3]{27} = 3$ y luego elevar $3^2 = 9$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el numerador $m$ (potencia) y el denominador $n$ (índice radical).'
- 'Paso 2: Reescribir la expresión en la forma $(\sqrt[n]{a})^m$.'
- 'Paso 3: Extraer primero la raíz enésima de la base para trabajar con números pequeños y luego elevar al exponente $m$.'
errores_correccion: '- **Error 1: Invertir el rol del numerador y denominador (pensar que $x^{2/3} = \sqrt{x^3}$).** **Cómo corregirlo:** El DENOMINADOR siempre es el índice de la raíz ($x^{2/3} = \sqrt[3]{x^2}$).

  - **Error 2: Multiplicar la base por la fracción ($8^{1/3} = 8/3$).** **Cómo corregirlo:** Es una raíz cúbica, no una multiplicación ($8^{1/3} = \sqrt[3]{8} = 2$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $32^{3/5}$?
  alternativas:
  - $8$
  - $6$
  - $16$
  respuesta: $8$
  solucion_pasos:
  - $(\sqrt[5]{32})^3 = 2^3 = 8$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $9^{-1/2}$?
  alternativas:
  - $\frac{1}{3}$
  - $-\frac{1}{3}$
  - $-3$
  respuesta: $\frac{1}{3}$
  solucion_pasos:
  - $\frac{1}{9^{1/2}} = \frac{1}{\sqrt{9}} = \frac{1}{3}$.
- titulo: ¿Es 25 elevado a 1/2 igual a 5?
  respuesta: Sí
  solucion_pasos:
  - Sí, $25^{1/2} = \sqrt{25} = 5$.
  alternativas:
  - texto: Sí, $25^{1/2} = \sqrt{25} = 5$
    es_correcta: true
    retroalimentacion: ¡Correcto! El exponente 1/2 es la raíz cuadrada.
  - texto: No, es 12,5
    es_correcta: false
    retroalimentacion: Incorrecto, no es la mitad de 25, es su raíz cuadrada.
  - texto: No, es 25/2
    es_correcta: false
    retroalimentacion: Incorrecto, no es división.
- titulo: ¿Pertenece (-16) elevado a 1/2 a los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, $(-16)^{1/2} = \sqrt{-16} = 4i \notin \mathbb{R}$.
  alternativas:
  - texto: No, es la raíz cuadrada de un número negativo y no es real
    es_correcta: true
    retroalimentacion: ¡Correcto! En R no existen raíces de índice par de negativos.
  - texto: Sí, es igual a -4
    es_correcta: false
    retroalimentacion: Incorrecto, $(-4)^2 = +16 \neq -16$.
  - texto: Sí, es igual a -8
    es_correcta: false
    retroalimentacion: Incorrecto, es un número imaginario.
errores_frecuentes:
- Intercambiar el índice de la raíz con la potencia.
- Multiplicar la base por la fracción del exponente.
- Olvidar que las raíces de índice par de números negativos no son reales.
- Potenciar primero generando números gigantescos antes de extraer la raíz.
- Confundir exponentes negativos con raíces negativas.
afirmaciones_verdaderas:
- La equivalencia fundamental es $a^{m/n} = \sqrt[n]{a^m} = (\sqrt[n]{a})^m$.
- El denominador del exponente fraccionario corresponde al índice de la raíz.
- Las propiedades operativas de potencias aplican de forma idéntica a exponentes racionales.
al_terminar_debes_poder: '![Síntesis de potencia con exponente racional](/static/img/nodos/potencia-con-exponente-racional-resumen.svg)


  QUÉ: Transformar y calcular potencias con exponente racional en el cuerpo real $\mathbb{R}$.


  CÓMO: Aplicando la equivalencia $a^{m/n} = \sqrt[n]{a^m} = (\sqrt[n]{a})^m$, extrayendo primero la raíz enésima y luego potenciando al exponente $m$, verificando las condiciones de existencia para índices pares e integrando exponentes negativos mediante inversión.'
fuente: Texto escolar MINEDUC — Matemática 8° Básico / 1° Medio / PAES.
