semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_RACIONAL
resumen_inicial: 'Una potencia con exponente fraccionario o racional $a^{m/n}$ representa
  un radical donde el numerador $m$ es el exponente del radicando y el denominador
  $n$ es el índice de la raíz: $a^{m/n} = \sqrt[n]{a^m}$.'
explicacion_simple: Un exponente que es una fracción conecta directamente las potencias
  con las raíces. El número de arriba de la fracción (numerador) se queda como potencia
  de la base, y el número de abajo (denominador) se convierte en el índice de la raíz.
explicacion_formal: 'Para toda base $a > 0$ (o $a \in \mathbb{R}$ con $n$ impar) y
  fracción $\frac{m}{n} \in \mathbb{Q}$ ($n \ge 2$), la **Potencia de Exponente Racional**
  se define como:


  $$a^{\frac{m}{n}} = \sqrt[n]{a^m} = \left(\sqrt[n]{a}\right)^m$$


  **Desglose de componentes:**

  - $m \in \mathbb{Z}$: Numerador del exponente $\implies$ Exponente interno del radicando.

  - $n \in \mathbb{N}_{\ge 2}$: Denominador del exponente $\implies$ Índice del radical
  $\sqrt[n]{\cdot}$.


  > **Complemento didáctico:** Caso particular: $a^{1/2} = \sqrt{a}$ y $a^{1/3} =
  \sqrt[3]{a}$.'
definiciones_clave: '- **Exponente racional**: Expresión $a^{m/n} = \sqrt[n]{a^m}$
  que formaliza la equivalencia exacta entre potenciación y radicación.'
propiedades_relaciones: '- **Equivalencia radical**: $a^{m/n} = \sqrt[n]{a^m}$.'
ejemplo_guiado:
  enunciado: Exprese como raíz y calcule el valor de las potencias $9^{1/2}$ y $8^{2/3}$.
  pasos:
  - 'Paso 1: Para $9^{1/2}$, transformar el denominador $2$ en índice de raíz cuadrada:
    $\sqrt[2]{9^1} = \sqrt{9} = 3$.'
  - 'Paso 2: Para $8^{2/3}$, transformar el denominador $3$ en raíz cúbica y el numerador
    $2$ en exponente: $(\sqrt[3]{8})^2$.'
  - 'Paso 3: Calcular la raíz cúbica $\sqrt[3]{8} = 2$ y luego elevar al cuadrado:
    $2^2 = 4$.'
  - 'Conclusión: $9^{1/2} = 3$ y $8^{2/3} = 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa el denominador n en una potencia con exponente fraccionario
    a^{m/n}?
  choices:
  - text: El índice n de la raíz enésima
    is_correct: true
  - text: La potencia a la cual se eleva el resultado
    is_correct: false
  - text: Un número a restar
    is_correct: false
  - text: La cantidad de ceros a agregar
    is_correct: false
  explanation: La alternativa correcta es 'El índice n de la raíz enésima'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 8^{2/3}, ¿cuál fue el resultado final?
  choices:
  - text: '4'
    is_correct: true
  - text: 16/3
    is_correct: false
  - text: '64'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: La alternativa correcta es '4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el numerador $m$ y el denominador $n$ del exponente fraccionario.'
- 'Paso 2: Escribir la raíz de índice $n$ con la base elevada al exponente $m$: $\sqrt[n]{a^m}$.'
- 'Paso 3: Calcular la raíz o la potencia para simplificar el valor final.'
errores_correccion: '- **Error 1: Invertir el rol de numerador y denominador (creer
  que $a^{1/2} = a^2$).** **Cómo corregirlo:** El denominador $2$ es el ÍNDICE de
  la raíz ($\sqrt{a}$), no una potencia al cuadrado.


  - **Error 2: Multiplicar la base por la fracción exponente ($8^{2/3} = 8 \cdot \frac{2}{3}
  = \frac{16}{3}$).** **Cómo corregirlo:** Los exponentes racionales representan RAÍCES,
  no multiplicaciones.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $16^{1/2}$.
  alternativas:
  - '4'
  - '8'
  - '32'
  respuesta: '4'
  solucion_pasos:
  - $16^{1/2} = \sqrt{16} = 4$.
- titulo: Ejemplo 2
  enunciado: Calcule $27^{1/3}$.
  alternativas:
  - '3'
  - '9'
  - '81'
  respuesta: '3'
  solucion_pasos:
  - $27^{1/3} = \sqrt[3]{27} = 3$.
- titulo: ¿Es a^{1/2} exactamente igual a la raíz cuadrada de a?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a^{1/2} = \sqrt{a}$.
- titulo: ¿Equivale 4^{3/2} al valor numérico 8?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(\sqrt{4})^3 = 2^3 = 8$.
errores_frecuentes:
- Un exponente fraccionario indica que se debe multiplicar la base directamente por
  dicha fracción.
- En la expresión $a^{m/n}$ el numerador $m$ representa el índice de la raíz y el
  denominador $n$ la potencia.
- La potencia de exponente fraccionario $25^{1/2}$ equivale al número $12,5$.
- Los exponentes racionales se aplican únicamente sobre números enteros negativos.
- Elevar un número a $1/3$ es idéntico a dividir ese número por 3.
afirmaciones_verdaderas:
- Toda potencia con exponente fraccionario $a^{m/n}$ es equivalente a la expresión
  radical $\sqrt[n]{a^m}$.
- El denominador $n$ del exponente actúa como el índice del radical y el numerador
  $m$ como el exponente de la base.
al_terminar_debes_poder: Al terminar serás capaz de convertir y evaluar potencias
  con exponente racional $a^{m/n} = \sqrt[n]{a^m}$, relacionando la potenciación con
  la radicación.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
