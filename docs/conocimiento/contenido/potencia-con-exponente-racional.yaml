semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_RACIONAL
resumen_inicial: Una potencia con exponente fraccionario es equivalente a una raíz
  donde el numerador es el exponente de la base y el denominador es el índice de la
  raíz ($a^{m/n} = \sqrt[n]{a^m}$).
explicacion_simple: 'Un exponente que es una fracción representa una raíz:

  - $a^{1/2} = \sqrt{a}$ (raíz cuadrada)

  - $a^{1/3} = \sqrt[3]{a}$ (raíz cúbica)

  - $8^{2/3} = \sqrt[3]{8^2} = \sqrt[3]{64} = 4$

  El número de abajo de la fracción es el índice de la raíz y el de arriba es el exponente
  interno.'
explicacion_formal: Para $a \in \mathbb{R}^+$ y $m/n \in \mathbb{Q}$ con $n \in \mathbb{Z}^+$,
  se define $a^{m/n} = \sqrt[n]{a^m} = (\sqrt[n]{a})^m$. Esta equivalencia permite
  extender todas las leyes de potencias a radicales y viceversa.
definiciones_clave: '- **Conversión potencia-radical**: $a^{m/n} = \sqrt[n]{a^m}$.

  - **Índice del radical ($n$)**: Denominador de la fracción exponente.

  - **Exponente del radicando ($m$)**: Numerador de la fracción exponente.'
propiedades_relaciones: '- **Validez de propiedades de potencia**: Las leyes de multiplicación
  y división de potencias aplican exactamente igual para exponentes fraccionarios.'
ejemplo_guiado:
  enunciado: Calcula el valor de $16^{3/4}$.
  pasos:
  - 'Escribir en forma de radical: $\sqrt[4]{16^3}$ o $(\sqrt[4]{16})^3$.'
  - 'Calcular primero la raíz cuarta: $\sqrt[4]{16} = 2$ (pues $2^4 = 16$).'
  - 'Elevar al numerador 3: $2^3 = 8$.'
  - Concluir que $16^{3/4} = 8$.
checkpoints:
- placement: after_explicacion_formal
  question: '¿A qué expresión en radical equivale la potencia $x^{2/5}$?'
  choices:
  - text: '$\sqrt[5]{x^2}$'
    is_correct: true
  - text: '$\sqrt[2]{x^5}$'
    is_correct: false
  - text: '5x^2'
    is_correct: false
  - text: 'x^{10}'
    is_correct: false
  explanation: 'La correcta es: $\sqrt[5]{x^2}$. El denominador (5) es el índice de la raíz y el numerador (2) el exponente de la base.'
  reinforcement_section: Explicación formal'
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $27^{2/3}$?
  choices:
  - text: '9'
    is_correct: true
  - text: '18'
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '81'
    is_correct: false
  explanation: 'La correcta es: 9. $\sqrt[3]{27} = 3$, y luego $3^2 = 9$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el numerador $m$ y denominador $n$ del exponente fraccionario.'
- 'Paso 2: Transformar a la forma de radical $(\sqrt[n]{a})^m$.'
- 'Paso 3: Extraer la raíz $n$-ésima de la base.'
- 'Paso 4: Elevar el resultado obtenido a la potencia $m$.'
errores_correccion: 'No inviertas el rol del numerador y denominador. En $a^{3/2}$,
  el $2$ es la raíz (cuadrada) y el $3$ la potencia: $\sqrt{a^3}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $25^{1/2}$.
  alternativas:
  - '5'
  - '12.5'
  - '50'
  respuesta: '5'
  solucion_pasos:
  - $25^{1/2} = \sqrt{25} = 5$.
errores_frecuentes:
- Confundir el índice de la raíz con el exponente interno.
afirmaciones_verdaderas:
- $a^{m/n} = \sqrt[n]{a^m}$.
al_terminar_debes_poder: Convertir fluidamente entre expresiones de potencias fraccionarias
  y radicales.
fuente: Texto escolar MINEDUC.
estado: publicado
