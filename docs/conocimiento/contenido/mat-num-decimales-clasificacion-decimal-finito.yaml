semantic_id: MAT.NUM.DECIMALES_CLASIFICACION.DECIMAL_FINITO
resumen_inicial: Un decimal finito posee una cantidad limitada de cifras decimales después de la coma. Una fracción irreductible $\frac{a}{b}$ genera un decimal finito si los únicos factores primos de $b$ son $2$ y/o $5$.
explicacion_simple: 'Un número decimal finito es aquel cuya parte decimal termina en algún momento, es decir, tiene un número exacto y contado de dígitos después de la coma (como 0,75 o 3,125). Al realizar la división entre el numerador y el denominador de su fracción, se obtiene resto cero.


  ![Identificación de decimal finito](/static/img/nodos/identificacion-de-decimal-finito-intro.svg)'
explicacion_formal: 'Sea $d \in \mathbb{Q}$, se clasifica como **Decimal Finito** si su representación posicional en base 10 es de la forma:


  $$d = a_0, a_1 a_2 a_3 \dots a_n = a_0 + \sum_{k=1}^{n} a_k \cdot 10^{-k} \quad (n \in \mathbb{N}_0, \, a_k \in \{0,1,\dots,9\})$$


  **Desglose de la fórmula:**

  - $n \in \mathbb{N}_0$: Número finito de posiciones decimales después de la coma.

  - Criterio de la fracción irreductible: $\frac{a}{b}$ con $\operatorname{MCD}(a,b)=1$ es finito $\iff b = 2^m \cdot 5^k$ para $m, k \ge 0$.


  > **Complemento didáctico:** Si el denominador simplificado tiene cualquier factor primo distinto de 2 o 5 (como 3, 7 u 11), el decimal NUNCA será finito.'
definiciones_clave: '- **Decimal finito**: Expresión decimal con un número finito $n$ de cifras a la derecha de la coma.

  - **Criterio de divisibilidad del denominador**: Condición $b = 2^m \cdot 5^k$ para fracciones irreductibles.'
propiedades_relaciones: '- **Conversión directa**: Se transforma a fracción escribiendo en el denominador la potencia $10^n$.'
ejemplo_guiado:
  enunciado: 'Determine si la fracción $\frac{7}{40}$ genera un decimal finito analizando los factores de su denominador.


    ![Ejemplo Identificación de decimal finito](/static/img/nodos/identificacion-de-decimal-finito-ejemplos.svg)'
  pasos:
  - 'Paso 1: Comprobar si $\frac{7}{40}$ es irreductible: $\operatorname{MCD}(7, 40) = 1$ (sí lo es).'
  - 'Paso 2: Descomponer el denominador $40$ en factores primos: $40 = 8 \cdot 5 = 2^3 \cdot 5^1$.'
  - 'Paso 3: Analizar los factores primos: solo contiene los primos $2$ y $5$.'
  - 'Paso 4: Realizar la división $7 : 40 = 0,175$ (resto 0).'
  - 'Conclusión: $\frac{7}{40}$ es un decimal finito con 3 cifras decimales.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición debe cumplir el denominador b de una fracción irreductible a/b para ser un decimal finito?
  choices:
  - text: Sus únicos factores primos deben ser 2 y/o 5 (b = 2^m · 5^k)
    is_correct: true
  - text: Debe ser un número impar obligatoriamente
    is_correct: false
  - text: Debe ser divisible por 3 y por 7
    is_correct: false
  - text: Debe ser menor que el numerador a
    is_correct: false
  explanation: La alternativa correcta es 'Sus únicos factores primos deben ser 2 y/o 5 (b = 2^m · 5^k)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 7/40, ¿por qué fue un decimal finito?
  choices:
  - text: Porque 40 = 2^3 · 5^1 contiene únicamente los factores primos 2 y 5
    is_correct: true
  - text: Because es un número mayor que 1
    is_correct: false
  - text: Porque dio infinitos tres
    is_correct: false
  - text: Porque 7 es impar
    is_correct: false
  explanation: La alternativa correcta es 'Porque 40 = 2^3 · 5^1 contiene únicamente los factores primos 2 y 5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar la fracción $\frac{a}{b}$ a su forma irreductible.'
- 'Paso 2: Descomponer el denominador $b$ en factores primos.'
- 'Paso 3: Si los únicos factores primos son $2$ y/o $5$, declarar la expresión como decimal finito.'
errores_correccion: '- **Error 1: Analizar la descomposición del denominador sin simplificar la fracción primero.** **Cómo corregirlo:** Se DEBE reducir la fracción antes; por ejemplo $\frac{21}{30} = \frac{7}{10}$ da decimal finito a pesar de que $30$ incluye el $3$.


  - **Error 2: Creer que un decimal finito tiene infinitas cifras repetidas.** **Cómo corregirlo:** Los decimales finitos terminan exactamente con resto cero.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $3/25$ un decimal finito?
  alternativas:
  - Sí, porque $25 = 5^2$
  - No, es un decimal periódico
  - Solo si se amplifica
  respuesta: Sí, porque $25 = 5^2$
  solucion_pasos:
  - $25 = 5^2 \implies 3/25 = 0,12$ (finito).
- titulo: Ejemplo 2
  enunciado: ¿Es $1/6$ un decimal finito?
  alternativas:
  - No, porque $6 = 2 \cdot 3$ incluye al factor primo 3
  - Sí, porque 6 es par
  - Sí, porque es menor a 1
  respuesta: No, porque $6 = 2 \cdot 3$ incluye al factor primo 3
  solucion_pasos:
  - El factor $3$ en el denominador irreductible impide que sea finito ($1/6 = 0,1666...$).
- titulo: ¿Es $0,375$ un número decimal finito?
  respuesta: Sí
  solucion_pasos:
  - Sí, tiene exactamente 3 cifras decimales post-coma.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación del número decimal y sus componentes.
  - texto: Es un número irracional
    es_correcta: false
    retroalimentacion: Incorrecto, los decimales finitos y periódicos son siempre racionales (pertenecen a ℚ).
  - texto: No se puede clasificar
    es_correcta: false
    retroalimentacion: Incorrecto, la estructura de cifras y períodos define inequívocamente su tipo decimal.
- titulo: ¿Genera la fracción $9/12$ un decimal finito?
  respuesta: Sí
  solucion_pasos:
  - Sí, simplificada es $3/4$, y $4 = 2^2 \implies 0,75$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la clasificación del número decimal y sus componentes.
  - texto: Es un número irracional
    es_correcta: false
    retroalimentacion: Incorrecto, los decimales finitos y periódicos son siempre racionales (pertenecen a ℚ).
  - texto: No se puede clasificar
    es_correcta: false
    retroalimentacion: Incorrecto, la estructura de cifras y períodos define inequívocamente su tipo decimal.
errores_frecuentes:
- Analizar los factores primos del denominador sin simplificar la fracción conduce a clasificar mal el decimal.
- Un decimal finito se caracteriza por tener infinitas cifras repetidas hacia la derecha.
- Toda fracción con un denominador par genera de forma automática un decimal periódico.
- El número $0,125$ no es un decimal finito porque contiene el dígito 5 al final.
- Las fracciones impropias jamás pueden generar decimales finitos.
afirmaciones_verdaderas:
- Una fracción irreductible $a/b$ genera un decimal finito si y solo si los factores primos de $b$ son exclusivamente 2 y/o 5.
- Los decimales finitos poseen una cantidad limitada de dígitos decimales a la derecha de la coma.
al_terminar_debes_poder: '**QUÉ:** Reconocer y clasificar números decimales finitos a partir de su representación decimal o fraccionaria.


  **CÓMO:** Verificando que la parte decimal tenga un número finito $k$ de cifras o que en su fracción generatriz irreductible $\frac{a}{b}$ el denominador sea de la forma $b = 2^n \cdot 5^m$ con $n, m \ge 0$, convirtiéndolo a $\frac{E \cdot 10^k + d_1 \dots d_k}{10^k}$.


  ![Resumen Identificación de decimal finito](/static/img/nodos/identificacion-de-decimal-finito-resumen.svg)'
