semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_ENTERO_NEGATIVO
resumen_inicial: Una potencia con exponente negativo representa el recíproco de la base elevado
  al exponente positivo equivalente ($a^{-n} = \frac{1}{a^n}$ para $a \neq 0$).
explicacion_simple: 'Un exponente negativo indica que debes **invertir (dar vuelta)** la base
  para transformar el exponente en positivo:

  - $3^{-2} = \frac{1}{3^2} = \frac{1}{9}$

  - $\left(\frac{2}{5}\right)^{-3} = \left(\frac{5}{2}\right)^3 = \frac{125}{8}$

  El signo menos del exponente NO hace que el resultado final sea un número negativo.'
explicacion_formal: Para todo $a \in \mathbb{R} \setminus \{0\}$ y $n \in \mathbb{Z}^+$, se
  define $a^{-n} = \frac{1}{a^n} = \left(\frac{1}{a}\right)^n$. Para fracciones $\left(\frac{a}{b}\right)^{-n}
  = \left(\frac{b}{a}\right)^n$ con $a, b \neq 0$.
definiciones_clave: '- **Inverso multiplicativo / Recíproco**: Transformación $a \to \frac{1}{a}$
  inducida por el signo negativo del exponente.'
propiedades_relaciones: '- **Independencia del signo final**: El signo menos del exponente
  invierte la base, no cambia por sí mismo el signo del resultado numérico.'
ejemplo_guiado:
  enunciado: Calcula A) $4^{-2}$ y B) $\left(\frac{2}{3}\right)^{-3}$.
  pasos:
  - 'Para A: $4^{-2} = \frac{1}{4^2} = \frac{1}{16}$.'
  - 'Para B: invertir la fracción y elevar a positivo: $\left(\frac{3}{2}\right)^3 = \frac{3^3}{2^3}
    = \frac{27}{8}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué es igual la expresión $5^{-3}$?
  choices:
  - text: 1/125
    is_correct: true
  - text: '-125'
    is_correct: false
  - text: '-15'
    is_correct: false
  - text: '125'
    is_correct: false
  explanation: 'La correcta es: 1/125. $5^{-3} = \frac{1}{5^3} = \frac{1}{125}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula el valor de $\left(\frac{1}{2}\right)^{-4}$.
  choices:
  - text: '16'
    is_correct: true
  - text: 1/16
    is_correct: false
  - text: '-16'
    is_correct: false
  - text: '-8'
    is_correct: false
  explanation: 'La correcta es: 16. Invertimos $\frac{1}{2} \to 2$, y elevamos a $4$: $2^4
    = 16$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el exponente sea negativo ($-n$).'
- 'Paso 2: Invertir la base (si es entero $a \to \frac{1}{a}$; si es fracción $\frac{a}{b}
  \to \frac{b}{a}$).'
- 'Paso 3: Cambiar el signo del exponente a positivo ($+n$).'
- 'Paso 4: Calcular la potencia resultante.'
errores_correccion: 'Un error muy común es pensar que $2^{-3} = -8$. ¡Falso! El menos del
  exponente **da vuelta la base**, no hace negativo al número: $2^{-3} = \frac{1}{8}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $10^{-2}$.
  alternativas:
  - 1/100
  - '-100'
  - '-20'
  respuesta: 1/100
  solucion_pasos:
  - $10^{-2} = \frac{1}{10^2} = \frac{1}{100}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de 2^{-4}?
  alternativas:
  - 1/16
  - '-16'
  - -1/16
  respuesta: 1/16
  solucion_pasos:
  - 2^{-4} = 1/2^4 = 1/16.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de (3/4)^{-2}?
  alternativas:
  - 16/9
  - 9/16
  - -16/9
  respuesta: 16/9
  solucion_pasos:
  - 'Se invierte la fracción: (4/3)^2 = 16/9.'
- titulo: ¿Es 5^{-2} un número negativo?
  respuesta: 'No'
  solucion_pasos:
  - 5^{-2} = 1/25, que es un número positivo.
errores_frecuentes:
- Confundir exponente negativo con resultado negativo.
- Pensar que el signo menos del exponente hace negativo al resultado final.
- Olvidar invertir la base antes de cambiar el signo del exponente.
- Invertir solo el numerador o solo el denominador de una fracción con exponente negativo,
  en vez de la fracción completa.
- Aplicar el exponente negativo únicamente al signo, sin transformar la base en su recíproco.
afirmaciones_verdaderas:
- $a^{-n} = \frac{1}{a^n}$ para $a \neq 0$.
- Un exponente negativo nunca hace que el resultado de la potencia sea un número negativo
  por sí solo; solo invierte la base.
al_terminar_debes_poder: Transformar y evaluar potencias con exponentes enteros negativos.
fuente: Texto escolar MINEDUC.
estado: publicado
