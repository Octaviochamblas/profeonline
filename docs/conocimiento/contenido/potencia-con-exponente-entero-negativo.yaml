semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_ENTERO_NEGATIVO
resumen_inicial: 'Un exponente entero negativo indica el inverso multiplicativo (recíproco) de la base: $a^{-n} = \frac{1}{a^n}$ y $\left(\frac{a}{b}\right)^{-n} = \left(\frac{b}{a}\right)^n$.'
explicacion_simple: '![Potencia con exponente entero negativo](/static/img/nodos/potencia-con-exponente-entero-negativo-intro.svg)


  Tener un signo menos en el exponente NO significa que el resultado sea negativo. El signo menos en el exponente funciona como un botón de ''invertir'': da vuelta la base. Si tenemos un número entero como $2^{-3}$, lo mandamos abajo como fracción: $\frac{1}{2^3} = \frac{1}{8}$. Si tenemos una fracción como $(2/5)^{-2}$, simplemente la damos vuelta: $(5/2)^2 = 25/4$.'
explicacion_formal: 'Para todo número real $a \in \mathbb{R} \setminus \{0\}$ y todo entero $n \in \mathbb{N}$, la **Potencia con Exponente Entero Negativo** se define como el inverso multiplicativo de $a^n$:


  $$a^{-n} = \frac{1}{a^n}$$


  **Demostración mediante el cociente de potencias:**

  $$a^{-n} = a^{0-n} = \frac{a^0}{a^n} = \frac{1}{a^n}$$


  **Propiedad de inversión de fracciones:**

  Para todo $a, b \in \mathbb{R} \setminus \{0\}$:

  $$\left(\frac{a}{b}\right)^{-n} = \frac{1}{\left(\frac{a}{b}\right)^n} = \frac{1}{\frac{a^n}{b^n}} = \frac{b^n}{a^n} = \left(\frac{b}{a}\right)^n$$


  **El inverso multiplicativo directo ($n = 1$):**

  $$a^{-1} = \frac{1}{a} \quad \text{y} \quad \left(\frac{a}{b}\right)^{-1} = \frac{b}{a}$$'
definiciones_clave: '- **Exponente negativo**: Operador que transforma la base en su recíproco multiplicativo.

  - **Inverso multiplicativo (recíproco)**: Número que multiplicado por el original da $1$ ($a \cdot a^{-1} = 1$).'
propiedades_relaciones: '- **Paso entre numerador y denominador**: $\frac{1}{a^{-n}} = a^n$ y $\frac{a^{-n}}{b^{-m}} = \frac{b^m}{a^n}$.

  - **Preservación de signo de la base**: Si la base es positiva, el resultado es estrictamente positivo ($3^{-2} = +1/9$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de potencias con exponente negativo](/static/img/nodos/potencia-con-exponente-entero-negativo-ejemplos.svg)


    Calcule el valor de $5^{-2}$, $\left(\frac{3}{4}\right)^{-2}$ y $(-2)^{-3}$.'
  pasos:
  - 'Paso 1: Evaluar $5^{-2}$: Invertir la base: $\frac{1}{5^2} = \frac{1}{25}$. (Resultado positivo $+1/25$).'
  - 'Paso 2: Evaluar $\left(\frac{3}{4}\right)^{-2}$: Invertir la fracción: $\left(\frac{4}{3}\right)^2 = \frac{4^2}{3^2} = \frac{16}{9}$.'
  - 'Paso 3: Evaluar $(-2)^{-3}$: Invertir la base conservando su signo: $\frac{1}{(-2)^3} = \frac{1}{-8} = -\frac{1}{8}$.'
  - 'Conclusión: $5^{-2} = \frac{1}{25}$, $\left(\frac{3}{4}\right)^{-2} = \frac{16}{9}$ y $(-2)^{-3} = -\frac{1}{8}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $3^{-3}$?
  choices:
  - text: $\frac{1}{27}$ (invirtiendo la base a $\frac{1}{3^3}$)
    is_correct: true
  - text: $-27$
    is_correct: false
  - text: $-9$
    is_correct: false
  - text: $\frac{1}{9}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{1}{27}$ (invirtiendo la base a $\frac{1}{3^3}$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cómo se calculó $\left(\frac{3}{4}\right)^{-2}$?
  choices:
  - text: Invirtiendo la fracción a $\left(\frac{4}{3}\right)^2$ y elevando a $\frac{16}{9}$
    is_correct: true
  - text: Multiplicando por $-2$
    is_correct: false
  - text: Cambiando el signo a $-\frac{9}{16}$
    is_correct: false
  - text: Restando $2$ al numerador
    is_correct: false
  explanation: La alternativa correcta es 'Invirtiendo la fracción a $\left(\frac{4}{3}\right)^2$ y elevando a $\frac{16}{9}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el signo negativo en el exponente.'
- 'Paso 2: Invertir la base (si es un entero $a$, pasa a $\frac{1}{a}$; si es una fracción $\frac{a}{b}$, pasa a $\frac{b}{a}$).'
- 'Paso 3: Cambiar el signo del exponente a positivo y calcular la potencia resultante.'
errores_correccion: '- **Error 1: Creer que el exponente negativo vuelve negativo el resultado ($2^{-3} = -8$).** **Cómo corregirlo:** El signo menos en el exponente NO cambia el signo del número, solo lo invierte ($2^{-3} = 1/2^3 = 1/8$).

  - **Error 2: Invertir la base y conservar el exponente negativo.** **Cómo corregirlo:** Al dar vuelta la base, el exponente DEBE pasar a ser positivo ($(2/3)^{-4} = (3/2)^4$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $4^{-2}$?
  alternativas:
  - $\frac{1}{16}$
  - $-16$
  - $-8$
  respuesta: $\frac{1}{16}$
  solucion_pasos:
  - $4^{-2} = \frac{1}{4^2} = \frac{1}{16}$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\left(\frac{2}{3}\right)^{-3}$?
  alternativas:
  - $\frac{27}{8}$
  - $-\frac{8}{27}$
  - $\frac{8}{27}$
  respuesta: $\frac{27}{8}$
  solucion_pasos:
  - $\left(\frac{2}{3}\right)^{-3} = \left(\frac{3}{2}\right)^3 = \frac{27}{8}$.
- titulo: ¿Es 10⁻³ igual a 0,001?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10^{-3} = \frac{1}{10^3} = \frac{1}{1000} = 0,001$.
  alternativas:
  - texto: Sí, $10^{-3} = \frac{1}{1000} = 0,001$
    es_correcta: true
    retroalimentacion: ¡Correcto! Es la base de la notación científica.
  - texto: No, es igual a -1000
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente negativo no hace negativo al número.
  - texto: No, es igual a -30
    es_correcta: false
    retroalimentacion: Incorrecto, es una potencia invertida.
- titulo: ¿Es (-3)⁻² un número positivo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-3)^{-2} = \frac{1}{(-3)^2} = \frac{1}{9} > 0$.
  alternativas:
  - texto: Sí, $(-3)^{-2} = \frac{1}{9}$ (el exponente par vuelve positiva la base)
    es_correcta: true
    retroalimentacion: ¡Correcto! $(-3)^2 = 9 \implies 1/9$.
  - texto: No, porque tiene dos signos negativos
    es_correcta: false
    retroalimentacion: Incorrecto, los signos en la base y exponente cumplen roles distintos.
  - texto: No, es igual a -1/9
    es_correcta: false
    retroalimentacion: Incorrecto, la potencia par anula el signo de la base.
errores_frecuentes:
- Confundir exponente negativo con número negativo ($2^{-4} = -16$ en vez de $1/16$).
- Multiplicar la base por el exponente ($5^{-2} = -10$).
- Olvidar cambiar el signo del exponente tras invertir la fracción.
- Aplicar exponente negativo a la base cero ($0^{-2}$ no existe).
- Pensar que $(a+b)^{-1} = a^{-1} + b^{-1}$ (la inversión no es distributiva sobre la suma).
afirmaciones_verdaderas:
- Para todo $a \neq 0$ y $n \in \mathbb{N}$, $a^{-n} = \frac{1}{a^n}$.
- Para toda fracción $\frac{a}{b}$ con $a, b \neq 0$, $(\frac{a}{b})^{-n} = (\frac{b}{a})^n$.
- Un exponente negativo nunca altera por sí mismo el signo de la base.
al_terminar_debes_poder: '![Síntesis de potencia con exponente negativo](/static/img/nodos/potencia-con-exponente-entero-negativo-resumen.svg)


  QUÉ: Calcular y simplificar potencias con exponente entero negativo.


  CÓMO: Aplicando la regla del recíproco $a^{-n} = \frac{1}{a^n}$ e invirtiendo fracciones $\left(\frac{a}{b}\right)^{-n} = \left(\frac{b}{a}\right)^n$, pasando el exponente a positivo y evitando confundir la inversión con un cambio de signo del resultado.'
