semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_ENTERO_NEGATIVO
resumen_inicial: 'Una potencia con exponente entero negativo equivale al inverso multiplicativo
  de la base elevado al exponente positivo: $a^{-n} = \frac{1}{a^n}$ (para $a \neq
  0$).'
explicacion_simple: Un exponente negativo actúa como una orden de dar vuelta o invertir
  la base. Para quitarle el signo menos al exponente, invertimos la base (si es un
  entero pasa abajo $1/a^n$, y si es una fracción se da vuelta a $b/a$).
explicacion_formal: 'Para toda base no nula $a \in \mathbb{R} \setminus \{0\}$ y $n
  \in \mathbb{N}_{\ge 1}$, la **Regla del Exponente Negativo** se define como:


  $$a^{-n} = \frac{1}{a^n} \quad \text{y para fracciones} \quad \left(\frac{a}{b}\right)^{-n}
  = \left(\frac{b}{a}\right)^n = \frac{b^n}{a^n}$$


  **Demostración por división de potencias de igual base:**

  $$a^{-n} = a^{0 - n} = \frac{a^0}{a^n} = \frac{1}{a^n}$$


  > **Complemento didáctico:** El signo negativo en el exponente NUNCA convierte la
  potencia en un número negativo por sí solo.'
definiciones_clave: '- **Exponente entero negativo**: Operación de inversión $a^{-n}
  = \frac{1}{a^n}$ que transforma el exponente en positivo.'
propiedades_relaciones: '- **Inversión multiplicativa**: $a^{-n} = \frac{1}{a^n}$
  y $\left(\frac{a}{b}\right)^{-n} = \left(\frac{b}{a}\right)^n$.'
ejemplo_guiado:
  enunciado: Calcule los valores de $2^{-3}$ y $\left(\frac{3}{4}\right)^{-2}$.
  pasos:
  - 'Paso 1: Para $2^{-3}$, aplicar la inversión $a^{-n} = \frac{1}{a^n} \implies
    \frac{1}{2^3} = \frac{1}{8}$.'
  - 'Paso 2: Para $\left(\frac{3}{4}\right)^{-2}$, invertir la fracción base $\implies
    \left(\frac{4}{3}\right)^2$.'
  - 'Paso 3: Elevar numerador y denominador al cuadrado: $\frac{4^2}{3^2} = \frac{16}{9}$.'
  - 'Conclusión: $2^{-3} = \frac{1}{8}$ y $\left(\frac{3}{4}\right)^{-2} = \frac{16}{9}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué efecto tiene un exponente negativo -n sobre la base a no nula?
  choices:
  - text: Invierte la base transformando la potencia en 1 / a^n
    is_correct: true
  - text: Hace que el resultado sea un número negativo siempre
    is_correct: false
  - text: Multiplica la base por -1
    is_correct: false
  - text: Transforma la base en cero
    is_correct: false
  explanation: La alternativa correcta es 'Invierte la base transformando la potencia
    en 1 / a^n'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 2^{-3}, ¿cuál fue el valor final obtenido?
  choices:
  - text: 1/8
    is_correct: true
  - text: '-8'
    is_correct: false
  - text: '-6'
    is_correct: false
  - text: '8'
    is_correct: false
  explanation: La alternativa correcta es '1/8'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el exponente tiene signo negativo ($-n$).'
- 'Paso 2: Invertir la base $a \to \frac{1}{a}$ (o dar vuelta la fracción $\frac{a}{b}
  \to \frac{b}{a}$).'
- 'Paso 3: Cambiar el signo del exponente a positivo ($+n$) y evaluar la potencia
  normalmente.'
errores_correccion: '- **Error 1: Creer que $2^{-3} = -8$ (transformar el resultado
  en número negativo).** **Cómo corregirlo:** El signo menos en el exponente INVIERTE
  la base, no cambia el signo del resultado ($2^{-3} = \frac{1}{8} > 0$).


  - **Error 2: Olvidar cambiar el signo del exponente al invertir la base.** **Cómo
  corregirlo:** Al invertir la base, el exponente PASA A SER POSITIVO ($a^{-n} \to
  \frac{1}{a^n}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $5^{-1}$.
  alternativas:
  - 1/5
  - '-5'
  - -1/5
  respuesta: 1/5
  solucion_pasos:
  - $5^{-1} = 1/5^1 = 1/5$.
- titulo: Ejemplo 2
  enunciado: Calcule $\left(\frac{1}{2}\right)^{-4}$.
  alternativas:
  - '16'
  - 1/16
  - '-16'
  respuesta: '16'
  solucion_pasos:
  - $\left(\frac{2}{1}\right)^4 = 2^4 = 16$.
- titulo: ¿Es 10^{-2} igual a 1/100 (o 0,01)?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10^{-2} = 1/10^2 = 1/100 = 0,01$.
- titulo: ¿Produce un exponente negativo un resultado positivo si la base es positiva?
  respuesta: Sí
  solucion_pasos:
  - Sí, invertir un número positivo mantiene su positividad ($1/a > 0$).
errores_frecuentes:
- Un exponente entero negativo convierte automáticamente el valor de la potencia en
  un número negativo.
- La potencia $3^{-2}$ equivale a multiplicar la base 3 por el exponente $-2$ dando
  $-6$.
- Invertir la base de una potencia exige cambiar también el signo de la base.
- La regla $a^{-n} = \frac{1}{a^n}$ se aplica sobre bases iguales a cero.
- Elevar una fracción a un exponente negativo da como resultado el número cero.
afirmaciones_verdaderas:
- Una potencia de exponente negativo $a^{-n}$ equivale al inverso multiplicativo $\frac{1}{a^n}$
  para $a \neq 0$.
- El signo negativo en el exponente modifica la posición de la base en la fracción
  (de numerador a denominador) sin alterar su signo numérico.
al_terminar_debes_poder: Al terminar serás capaz de transformar y evaluar potencias
  con exponente entero negativo $a^{-n} = \frac{1}{a^n}$, aplicando la inversión de
  la base.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
