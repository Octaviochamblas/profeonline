- titulo: ¿Se cumple siempre la propiedad principal de reconocimiento de la fórmula
    de distancia de un punto a una recta en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede reconocimiento de la fórmula de distancia de un punto a una recta
