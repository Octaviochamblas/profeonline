semantic_id: MAT.GEO.POSICIONES_RECTAS_CIRCUNFERENCIAS.DISTANCIA_PUNTO_RECTA_FORMULA
resumen_inicial: 'Reconocimiento de la fórmula de distancia de un punto a una recta:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: La distancia de un punto a una recta se define como la longitud
  del segmento perpendicular más corto que los une, y existe una fórmula directa para
  calcularla sin necesidad de encontrar ese punto de intersección perpendicular.
explicacion_formal: '![Fórmula de distancia de un punto a una recta](/static/img/geometria/analitica/posrc-distancia-punto-recta-formula.svg)


  ### Definición formal


  Dada la recta $Ax+By+C=0$ y el punto $(x_0,y_0)$, la distancia mínima entre ambos
  es $d=\dfrac{|Ax_0+By_0+C|}{\sqrt{A^2+B^2}}$, usando el valor absoluto para garantizar
  una distancia positiva.


  ### Desarrollo didáctico


  Para la recta $x-y-1=0$ (A=1, B=-1, C=-1) y el punto $P(-2,3)$: $d=\dfrac{|1\times(-2)+(-1)\times3-1|}{\sqrt{1+1}}=\dfrac{|-2-3-1|}{\sqrt2}=\dfrac{6}{\sqrt2}\approx4{,}24$.'
