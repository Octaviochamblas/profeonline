semantic_id: MAT.ALG.EC_CUADR_METODOS.SUSTITUCION_AUXILIAR
resumen_inicial: 'Identificación de sustitución auxiliar para reducir una ecuación
  a segundo grado: concepto, discriminante, soluciones y modelamiento en Métodos algebraicos
  de resolución.'
explicacion_simple: Algunas ecuaciones que parecen de grado 4 o superior en realidad
  esconden una estructura cuadrática, si se sabe reconocer qué expresión conviene
  "renombrar" con una nueva variable.
explicacion_formal: '### Definición formal


  Dada una ecuación donde una expresión $g(x)$ aparece elevada al cuadrado y también
  a la primera potencia (por ejemplo, $a\,[g(x)]^2+b\,g(x)+c=0$), la sustitución auxiliar
  $u=g(x)$ transforma la ecuación en $au^2+bu+c=0$, una ecuación cuadrática estándar
  en la variable $u$.


  ### Desarrollo didáctico


  Para identificar la sustitución adecuada, se busca una expresión que aparezca "duplicada"
  en grado: si $x^4$ y $x^2$ están presentes, conviene sustituir $u=x^2$; si aparecen
  $(x+1)^2$ y $(x+1)$, conviene sustituir $u=x+1$.


  En $x^4-5x^2+4=0$, la expresión $x^2$ aparece elevada al cuadrado ($x^4=(x^2)^2$)
  y a la primera potencia, por lo que conviene sustituir $u=x^2$, obteniendo $u^2-5u+4=0$.'
definiciones_clave: '- **Identificación de sustitución auxiliar para reducir una ecuación
  a segundo grado**: Elemento o técnica fundamental en la resolución de ecuaciones
  cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en identificación
  de sustitución auxiliar para reducir una ecuación a segundo grado.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando identificación de
    sustitución auxiliar para reducir una ecuación a segundo grado.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a identificación de sustitución
    auxiliar para reducir una ecuación a segundo grado.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
