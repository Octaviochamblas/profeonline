semantic_id: MAT.GEO.ANGULOS_RELACIONES_METRICAS.SUMA_PUNTO
resumen_inicial: La suma de las medidas de todos los ángulos consecutivos alrededor
  de un mismo punto en el plano es exactamente 360° (2π rad).
explicacion_simple: '![Suma de Ángulos Alrededor de un Punto](/static/img/nodos/suma-de-angulos-alrededor-de-un-punto-igual-a-360-intro.svg)


  Imagina una pizza cortada en varias rebanadas desde el centro hacia afuera. Si sumas
  las aberturas de todas las rebanadas, siempre completarás el círculo entero de 360°,
  sin importar cuántos cortes se hayan hecho.'
explicacion_formal: '### Definición formal

  Si $n$ ángulos consecutivos $\alpha_1, \alpha_2, \dots, \alpha_n$ se disponen alrededor
  de un punto común $O$ en el plano sin solaparse, cubriendo completamente la región
  angular del plano, la suma de sus medidas es igual a $360^\circ$:


  $$\sum_{i=1}^n \alpha_i = \alpha_1 + \alpha_2 + \dots + \alpha_n = 360^\circ = 2\pi
  \text{ rad}$$


  ### Desglose simbólico y geométrico

  - $O$: Punto central o nodo de concurrencia de todos los rayos.

  - Partición completa del plano: Cada rayo sirve de frontera común entre dos ángulos
  contiguos.

  - Cierre perigonal: No quedan huecos ni regiones angulares sin contabilizar.


  ### Síntesis didáctica

  El teorema de la suma completa alrededor de un punto permite calcular cualquier
  ángulo desconocido restando la suma de los ángulos conocidos a $360^\circ$.'
definiciones_clave: '- **Ángulos alrededor de un punto**: Conjunto de ángulos adyacentes
  que comparten un vértice común y cuya unión conforma el plano completo ($360^\circ$).

  - **Revolución completa**: Giro de $360^\circ$ alrededor de un punto. '
propiedades_relaciones: '- **Partición circular**: La suma es invariante respecto
  al número de rayos y a la longitud de los mismos.

  - **Ángulos congruentes**: Si $n$ ángulos alrededor de un punto son de igual medida,
  cada uno mide $\frac{360^\circ}{n}$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Suma Alrededor de un Punto](/static/img/nodos/suma-de-angulos-alrededor-de-un-punto-igual-a-360-ejemplos.svg)


    Alrededor de un punto $O$ se ubican cuatro ángulos consecutivos que miden $2x$,
    $3x$, $4x$ y $3x$. Encuentra el valor de $x$ y la medida del ángulo de mayor amplitud.'
  pasos:
  - 'Paso 1: Plantear la suma total alrededor del punto: $2x + 3x + 4x + 3x = 360^\circ$.'
  - 'Paso 2: Sumar los términos algebraicos: $12x = 360^\circ$.'
  - 'Paso 3: Despejar $x = \frac{360^\circ}{12} = 30^\circ$.'
  - 'Paso 4: Calcular el ángulo mayor ($4x$): $4(30^\circ) = 120^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuánto suman todos los ángulos consecutivos que rodean completamente
    a un punto?
  choices:
  - text: Exactamente 360° (2π rad)
    is_correct: true
  - text: Exactamente 180°
    is_correct: false
  - text: Exactamente 90°
    is_correct: false
  - text: Depende del tamaño del dibujo
    is_correct: false
  explanation: La suma angular alrededor de cualquier punto central es siempre exactamente
    360° (2π rad).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si 6 ángulos congruentes rodean completamente a un punto, ¿cuánto mide
    cada uno?
  choices:
  - text: 60° (porque 360° / 6 = 60°)
    is_correct: true
  - text: 30°
    is_correct: false
  - text: 90°
    is_correct: false
  - text: 45°
    is_correct: false
  explanation: Dividiendo el giro total entre 6 partes iguales, 360° / 6 = 60°, por
    lo que cada uno mide 60° (porque 360° / 6 = 60°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el punto central común $O$ y todos los rayos que nacen de él.'
- 'Paso 2: Formular la ecuación igualando la suma de todos los ángulos a $360^\circ$.'
- 'Paso 3: Reducir y despejar la incógnita buscada.'
- 'Paso 4: Verificar que la suma de todos los ángulos calculados sea $360^\circ$.'
errores_correccion: No confundas la suma de 360° alrededor de un punto con la suma
  de 180° a un lado de una recta.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si tres ángulos alrededor de un punto miden $120^\circ$, $140^\circ$
    y $x$, ¿cuánto vale $x$?
  alternativas:
  - $100^\circ$
  - $110^\circ$
  - $90^\circ$
  respuesta: $100^\circ$
  solucion_pasos:
  - $120^\circ + 140^\circ + x = 360^\circ \implies 260^\circ + x = 360^\circ \implies
    x = 100^\circ$.
- titulo: Ejemplo 2
  enunciado: ¿Cuántos ángulos rectos de $90^\circ$ se necesitan para rodear completamente
    un punto?
  alternativas:
  - 4 ángulos rectos
  - 2 ángulos rectos
  - 6 ángulos rectos
  respuesta: 4 ángulos rectos
  solucion_pasos:
  - $\frac{360^\circ}{90^\circ} = 4$ ángulos rectos.
- titulo: ¿La suma alrededor de un punto siempre es 360°?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición geométrica euclidiana una vuelta completa es 360°.
- titulo: ¿La suma alrededor de un punto es 180°?
  respuesta: 'No'
  solucion_pasos:
  - No, 180° es a un lado de una recta; alrededor del punto completo es 360°.
errores_frecuentes:
- Confundir la suma alrededor de un punto ($360^\circ$) con la suma sobre una recta
  ($180^\circ$).
- Omitir uno de los ángulos al realizar la suma en figuras complejas.
- Asumir que los ángulos son iguales sin indicación explícita.
- Creer que alargar las líneas de los rayos altera la suma de $360^\circ$.
- Olvidar que una vuelta completa equivale a $2\pi$ radianes.
afirmaciones_verdaderas:
- Los ángulos alrededor de un punto siempre suman $360^\circ$.
- Cuatro ángulos rectos completan exactamente la vuelta alrededor de un punto.
al_terminar_debes_poder: '**QUÉ:** Formular y resolver problemas geométricos aplicando
  la suma de ángulos alrededor de un punto ($360^\circ$).


  **CÓMO:** Igualando la suma de los sectores a $360^\circ$ ($\sum \theta_i = 360^\circ$)
  y despejando las incógnitas algebraicas.


  ![Resumen de Suma Alrededor de un Punto](/static/img/nodos/suma-de-angulos-alrededor-de-un-punto-igual-a-360-resumen.svg)'
