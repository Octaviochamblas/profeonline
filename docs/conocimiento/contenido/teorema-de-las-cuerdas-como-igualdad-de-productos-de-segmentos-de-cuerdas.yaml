semantic_id: MAT.GEO.CIRCULO_TEOREMAS.CUERDAS_PRODUCTO
resumen_inicial: 'El Teorema de las Cuerdas establece que si dos cuerdas se cortan dentro de una circunferencia, el producto de los segmentos de una cuerda es igual al producto de los segmentos de la otra: PA · PB = PC · PD.'
explicacion_simple: 'Cuando dos cuerdas se cruzan en una circunferencia en un punto $P$, ocurre una ley matemática perfecta:


  **Si multiplicas los dos trozos de la primera cuerda ($PA \cdot PB$), obtienes EXACTAMENTE el mismo número que si multiplicas los dos trozos de la segunda cuerda ($PC \cdot PD$)**.


  $$\mathbf{PA \cdot PB = PC \cdot PD}$$


  Por ejemplo, si la primera cuerda se divide en trozos de **$3\text{ cm}$** y **$8\text{ cm}$**, su producto es $3 \cdot 8 = 24$. Si la segunda cuerda tiene un trozo que mide **$4\text{ cm}$**, ¡el otro trozo obligatoriamente tiene que medir **$6\text{ cm}$**, porque $4 \cdot 6 = 24$!


  ¡Cuidado con la trampa típica: **es una MULTIPLICACIÓN, no una suma**! Nunca sumes $PA + PB = PC + PD$.


  ![Teorema de las cuerdas](/static/img/nodos/teorema-de-las-cuerdas-como-igualdad-de-productos-de-segmentos-de-cuerdas-intro.svg)

  '
explicacion_formal: '### Teorema de las cuerdas secantes

  Sean $\overline{AB}$ y $\overline{CD}$ dos cuerdas de una circunferencia $\mathcal{C}$ que se intersecan en un punto interior $P$. Entonces se verifica la igualdad de productos escalares:

  $$PA \cdot PB = PC \cdot PD$$


  ### Demostración geométrica por semejanza de triángulos

  1. Trácense los segmentos auxiliares $\overline{AC}$ y $\overline{BD}$. Se forman los triángulos $\triangle PAC$ y $\triangle PDB$.

  2. En el vértice común $P$, los ángulos son opuestos por el vértice y por tanto congruentes:

  $$\angle APC \cong \angle DPB$$

  3. Los ángulos inscritos $\angle ACD$ y $\angle ABD$ subtienden el mismo arco $\overset{\frown}{AD}$, luego son congruentes:

  $$\angle PCA \cong \angle PBD$$

  4. Por el criterio Ángulo-Ángulo (AA), los triángulos son semejantes:

  $$\triangle PAC \sim \triangle PDB$$

  5. De la proporcionalidad entre lados homólogos correspondientes:

  $$\frac{PA}{PD} = \frac{PC}{PB} \iff PA \cdot PB = PC \cdot PD$$


  > **Complemento didáctico:** Cada vez que dos cuerdas se crucen en una ''X'', di en tu mente: ''Brazo izquierdo por brazo derecho = Brazo arriba por brazo abajo''. ¡Multiplicas los dos lados de una misma línea y lo igualas a la multiplicación de la otra!

  '
definiciones_clave: '- **Teorema de las cuerdas**: Principio de conservación del producto de distancias desde el punto de cruce interior.

  - **Semejanza cruzada ($\triangle PAC \sim \triangle PDB$)**: Fundamento euclidiano de la relación métrica.

  - **Producto invariante**: Magnitud constante asociada a la potencia interior del punto $P$.

  '
propiedades_relaciones: '- **Formulación fraccionaria**: $\frac{PA}{PC} = \frac{PD}{PB}$.

  - **Independencia del centro**: Válido en cualquier punto interior $P$, concéntrico o excéntrico.

  - **Caso perpendicular con diámetro**: Si $\overline{CD}$ es un diámetro perpendicular a la cuerda $\overline{AB}$, entonces $P$ es punto medio de $\overline{AB}$ ($PA = PB$), resultando $PA^2 = PC \cdot PD$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de cálculo con teorema de cuerdas](/static/img/nodos/teorema-de-las-cuerdas-como-igualdad-de-productos-de-segmentos-de-cuerdas-ejemplos.svg)


    Dos cuerdas se intersecan en un punto interior $P$. En la primera cuerda los segmentos miden $PA = 3\text{ cm}$ y $PB = 8\text{ cm}$. En la segunda cuerda uno de los segmentos mide $PC = 4\text{ cm}$. Determina la longitud del segmento $PD$ y la longitud total de la cuerda $CD$.'
  pasos:
  - 'Paso 1: Plantear la ecuación del Teorema de las Cuerdas: $PA \cdot PB = PC \cdot PD$.'
  - 'Paso 2: Sustituir los valores conocidos: $3 \cdot 8 = 4 \cdot PD$.'
  - 'Paso 3: Realizar la multiplicación: $24 = 4 \cdot PD$.'
  - 'Paso 4: Despejar $PD$: $PD = \frac{24}{4} = 6\text{ cm}$.'
  - 'Paso 5: Calcular la longitud total de la cuerda: $CD = PC + PD = 4 + 6 = 10\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la igualdad métrica que define al Teorema de las Cuerdas?
  choices:
  - text: PA · PB = PC · PD.
    is_correct: true
  - text: PA + PB = PC + PD.
    is_correct: false
  - text: PA · PC = PB · PD.
    is_correct: false
  - text: PA / PB = PC / PD.
    is_correct: false
  explanation: La alternativa correcta es 'PA · PB = PC · PD.' El producto de los segmentos de una cuerda es igual al producto de los de la otra.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En dos cuerdas que se cruzan en P se tiene PA = 2, PB = 12 y PC = 3. ¿Cuánto mide PD?
  choices:
  - text: '8.'
    is_correct: true
  - text: '11.'
    is_correct: false
  - text: '6.'
    is_correct: false
  - text: '18.'
    is_correct: false
  explanation: 'La alternativa correcta es ''8.'' Aplicando $PA \cdot PB = PC \cdot PD$: $2 \cdot 12 = 3 \cdot PD \implies 24 = 3 \cdot PD \implies PD = 8$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar las dos cuerdas y su punto de corte $P$.

  2. Identificar los segmentos $PA, PB$ en una cuerda y $PC, PD$ en la otra.

  3. Escribir la ecuación del teorema: $PA \cdot PB = PC \cdot PD$.

  4. Sustituir los datos numéricos conocidos y despejar la incógnita.

  '
errores_correccion: '- **Error común 1:** Sumar los segmentos en lugar de multiplicarlos ($PA + PB = PC + PD$). **Corrección:** La relación métrica es estrictamente un PRODUCTO.

  - **Error común 2:** Multiplicar segmentos de cuerdas distintas ($PA \cdot PC = PB \cdot PD$). **Corrección:** Se multiplican los dos segmentos de la MISMA cuerda.

  '
ejemplos:
- tipo: A
  titulo: Cálculo de segmento desconocido
  enunciado: En dos cuerdas que se cortan en $P$, los segmentos de una miden $4\text{ cm}$ y $9\text{ cm}$. Si uno de los segmentos de la otra cuerda mide $6\text{ cm}$, ¿cuánto mide el segmento restante?
  alternativas:
  - text: $6\text{ cm}$.
    is_correct: true
  - text: $7\text{ cm}$.
    is_correct: false
  - text: $8\text{ cm}$.
    is_correct: false
  - text: $5\text{ cm}$.
    is_correct: false
  explicacion: $4 \cdot 9 = 6 \cdot x \implies 36 = 6x \implies x = 6\text{ cm}$.
- tipo: B
  titulo: Igualdad de productos
  enunciado: ¿Es el producto de los segmentos de una cuerda siempre igual al producto de los segmentos de la otra cuerda que la corta?
  respuesta: Sí
  explicacion: Sí. Por el Teorema de las Cuerdas, la igualdad $PA \cdot PB = PC \cdot PD$ se cumple de manera universal.
errores_frecuentes:
- '''Sumar los segmentos de cada cuerda en vez de multiplicarlos.'''
- '''Multiplicar segmentos pertenecientes a cuerdas distintas.'''
- '''Olvidar que las medidas deben comenzar siempre desde el punto de cruce $P$.'''
afirmaciones_verdaderas:
- '''El Teorema de las Cuerdas afirma que $PA \cdot PB = PC \cdot PD$.'''
- '''La demostración del teorema se basa en la semejanza de triángulos formados por ángulos inscritos comunes.'''
- '''Si una cuerda divide a otra perpendicularmente por su punto medio, se cumple $PA^2 = PC \cdot PD$.'''
al_terminar_debes_poder: '**QUÉ:** Aplicar el Teorema de las Cuerdas para calcular longitudes de segmentos desconocidos en cuerdas secantes.


  **CÓMO:** Planteando y resolviendo $PA \cdot PB = PC \cdot PD$.


