semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.DOMINIO_RAIZ_PAR
resumen_inicial: La determinación del dominio de funciones potencia asociadas a raíces de índice par $f(x) = a \cdot x^{p/2k} = a \sqrt[2k]{x^p}$ establece que $\operatorname{Dom}(f) = [0, +\infty[$, debido a la restricción fundamental de existencia que exige radicandos reales no negativos ($x \ge 0$).
explicacion_simple: "![La determinación del dominio de funciones potencia asociadas a raíces de índice par $f(x) = a \\cdot x^{p/2k} = a \\sqrt[2k]{x^p}$ establece que $\\operatorname{Dom}(f) = [0, +\\infty[$, debido a la restricción fundamental de existencia que exige radicandos reales no negativos ($x \\ge 0$)](/static/img/nodos/determinacion-del-dominio-de-funciones-potencia-asociadas-a-raices-de-indice-par-intro.svg)\n\n\nCuando tienes una función potencia donde el denominador del exponente es un **número par ($1/2, 1/4, 3/6, 1/8...$)**:\n\n$$\\operatorname{Dom}(f) = [0, +\\infty[ \\quad (\\text{Solo Números Positivos y Cero})$$\n\n- **¿Por qué los negativos están prohibidos?**\n  - En los números reales $\\mathbb{R}$, **no existe ninguna raíz cuadrada, cuarta o sexta de un número negativo** (ej: $\\sqrt{-9}$ no es real, es un número imaginario $3i$).\n  - Ningún número real multiplicado por sí mismo un número par de veces puede dar un resultado negativo.\n- **El cero sí está permitido:**\
  \ $\\sqrt[4]{0} = 0$, por eso el intervalo es **cerrado en cero: $[0, +\\infty[$**."
explicacion_formal: 'Sea $f(x) = a \cdot x^{p/(2k)} = a \sqrt[2k]{x^p}$ con $k, p \in \mathbb{Z}^+$ y $a \in \mathbb{R}^*$.

  Por la definición del operador radical par en el cuerpo ordenado $\mathbb{R}$:

  $$\forall t \in \mathbb{R}: \quad \sqrt[2k]{t} \in \mathbb{R} \Longleftrightarrow t \ge 0$$

  Para la función simple con $p = 1$, la condición de existencia impone:

  $$x \ge 0 \Longleftrightarrow \operatorname{Dom}(f) = [0, +\infty[ = \mathbb{R}^+_0$$


  **Comportamiento en la frontera**:

  El punto $x = 0$ es un punto de acumulación cerrado en el borde del dominio donde $f(0) = 0$.'
definiciones_clave: '- **Radicando no negativo**: Condición analítica $x \ge 0$ para garantizar la clausura en $\mathbb{R}$.

  - **Dominio unilateral cerrado**: Conjunto $[0, +\infty[$ que excluye la totalidad del semieje negativo.'
propiedades_relaciones: '- **Inexistencia de gráfica a la izquierda**: No existe ningún punto de la curva en el semiplano $x < 0$.

  - **Diferencia con potencias enteras**: Mientras que $x^2$ tiene dominio $\mathbb{R}$, su inversa $x^{1/2}$ tiene dominio $[0, +\infty[$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del dominio de funciones potencia asociadas a raíces de índice par $f(x) = a \cdot x^{p/2k} = a \sqrt[2k]{x^p}$ establece que $\operatorname{Dom}(f) = [0, +\infty[$, debido a la restricción fundamental de existencia que exige radicandos reales no negativos ($x \ge 0$)](/static/img/nodos/determinacion-del-dominio-de-funciones-potencia-asociadas-a-raices-de-indice-par-ejemplos.svg)



    Determina y fundamenta el dominio de:

    1) $f(x) = 3\sqrt[4]{x}$

    2) $g(x) = -2x^{1/6}$

    3) Explica por qué $x = -16$ no pertenece al dominio de $f(x)$.'
  pasos:
  - 'Paso 1: Para $f(x) = 3\sqrt[4]{x}$: Índice $4$ es par $\implies x \ge 0 \implies$ **$\operatorname{Dom}(f) = [0, +\infty[$**.'
  - 'Paso 2: Para $g(x) = -2x^{1/6}$: Denominador $6$ es par $\implies x \ge 0 \implies$ **$\operatorname{Dom}(g) = [0, +\infty[$**.'
  - 'Paso 3: Al evaluar $f(-16) = 3\sqrt[4]{-16}$, no existe ningún número real $r$ tal que $r^4 = -16$, demostrando que **$-16 \notin \operatorname{Dom}(f)$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función $f(x) = 8x^{3/4}$?
  choices:
  - text: '[0, +∞[ (todos los números reales no negativos)'
    is_correct: true
  - text: ℝ (todos los reales)
    is_correct: false
  - text: ']0, +∞['
    is_correct: false
  - text: '[-8, +∞['
    is_correct: false
  explanation: La alternativa correcta es '[0, +∞[ (todos los números reales no negativos)'. Como el denominador del exponente es 4 (raíz cuarta de índice par), se exige $x \ge 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el valor x = 0 está incluido en el dominio de $f(x) = \sqrt[6]{x}$?
  choices:
  - text: Porque la raíz sexta de 0 es 0, un número real perfectamente definido
    is_correct: true
  - text: Porque 6 es un número par
    is_correct: false
  - text: Solo está incluido si el coeficiente es positivo
    is_correct: false
  - text: No está incluido, el intervalo es abierto
    is_correct: false
  explanation: La alternativa correcta es 'Porque la raíz sexta de 0 es 0, un número real perfectamente definido'. $\sqrt[6]{0} = 0 \in \mathbb{R}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el denominador $q$ del exponente fraccionario $p/q$.'
- 'Paso 2: Comprobar si $q$ es un número par ($2, 4, 6, 8...$).'
- 'Paso 3: Plantear la inecuación de no negatividad del radicando $x \ge 0$.'
- 'Paso 4: Escribir el dominio como el intervalo cerrado por la izquierda $\operatorname{Dom}(f) = [0, +\infty[$.'
errores_correccion: '- **Error común:** Escribir $\operatorname{Dom} = \mathbb{R}$ en raíces cuartas o sextas.

  - **Cómo corregirlo:** Si el índice es **PAR**, los números negativos **NO TIENEN RAÍZ REAL**: el dominio es **$[0, +\infty[$**.'
ejemplos:
- titulo: 'Ejemplo 1: Raíz octava'
  enunciado: 'El dominio de $f(x) = x^{1/8}$ es:'
  alternativas:
  - '[0, +inf['
  - R
  - ']0, +inf['
  - '[8, +inf['
  respuesta: '[0, +inf['
  solucion_pasos:
  - 'Paso 1: Índice par 8 $\implies \operatorname{Dom}(f) = [0, +\infty[$.'
- titulo: 'Ejemplo 2: Coeficiente negativo con índice par'
  enunciado: ¿Cuál es el dominio de $g(x) = -10\sqrt[4]{x}$?
  alternativas:
  - '[0, +inf['
  - ']-inf, 0]'
  - R
  - '[-10, 0]'
  respuesta: '[0, +inf['
  solucion_pasos:
  - 'Paso 1: El coeficiente $-10$ afecta al recorrido, pero el radicando exige $x \ge 0 \implies [0, +\infty[$.'
- titulo: 'Ejemplo 3: Pertenencia de números negativos'
  enunciado: ¿Pertenece $x = -4$ al dominio de $h(x) = x^{1/2}$?
  alternativas:
  - No, porque las raíces pares de negativos no son reales
  - Sí, da -2
  - Sí, da +2
  - Solo en funciones pares
  respuesta: No, porque las raíces pares de negativos no son reales
  solucion_pasos:
  - 'Paso 1: $\sqrt{-4} \notin \mathbb{R} \implies -4 \notin \operatorname{Dom}$.'
- titulo: 'Ejemplo 4: Notación de corchetes'
  enunciado: 'La forma correcta de escribir el dominio de $y = \sqrt[4]{x}$ es:'
  alternativas:
  - '[0, +inf['
  - ']0, +inf['
  - '[0, +inf]'
  - ']0, +inf]'
  respuesta: '[0, +inf['
  solucion_pasos:
  - 'Paso 1: Cerrado en 0 y abierto en infinito $\implies [0, +\infty[$.'
errores_frecuentes:
- Olvidar que los índices pares no admiten números negativos.
- Confundir el signo del coeficiente exterior con la restricción del radicando.
- Escribir corchete abierto en cero.
afirmaciones_verdaderas:
- Toda función potencia asociada a una raíz de índice par tiene dominio [0, +∞[.
- Los números negativos quedan estrictamente excluidos del dominio real de raíces pares.
al_terminar_debes_poder: '**QUÉ:** Determinar el dominio de funciones potencia asociadas a raíces de índice par.


  **CÓMO:** Planteando la condición de existencia del radicando x ≥ 0 para establecer Dom(f) = [0, +∞[.


