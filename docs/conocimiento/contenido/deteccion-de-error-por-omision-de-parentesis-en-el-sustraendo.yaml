semantic_id: MAT.ALG.SUSTRACCION_POL.OMISION_PARENTESIS
resumen_inicial: 'Detección de error por omisión de paréntesis en el sustraendo: procedimiento
  y reglas en Sustracción de polinomios.'
explicacion_simple: Uno de los errores más frecuentes en álgebra es olvidar los paréntesis
  al restar un polinomio. Sin ellos, el signo menos solo afecta al primer término,
  dejando el resto sin cambio — un error silencioso pero devastador.
explicacion_formal: '### Definición formal


  Sin paréntesis, el $-$ solo afecta al $2x$. El $+3$ queda positivo cuando debería
  ser $-3$.


  ### Desarrollo didáctico


  Error clásico: Calcular $5x - 3x + 2$ creyendo que es $(5x) - (3x + 2)$.


  Sin paréntesis, la expresión es: $5x - 3x + 2 = 2x + 2$.

  Con paréntesis: $5x - (3x + 2) = 5x - 3x - 2 = 2x - 2$.


  Dos resultados distintos. La diferencia: el signo $-$ con paréntesis invierte TODOS
  los signos del polinomio restado, incluyendo el $+2$ final.'
definiciones_clave: '- **Detección de error por omisión de paréntesis en el sustraendo**:
  Operación o propiedad fundamental del cálculo algebraico.'
propiedades_relaciones: '- **Reglas operativas**: Ley de signos y propiedades de términos
  semejantes aplicadas a detección de error por omisión de paréntesis en el sustraendo.'
ejemplo_guiado:
  enunciado: Aplica detección de error por omisión de paréntesis en el sustraendo
    en una expresión algebraica.
  pasos:
  - Identificar los términos o eliminar los paréntesis según corresponda.
  - Agrupar los términos semejantes siguiendo la regla de detección de error por omisión
    de paréntesis en el sustraendo.
  - Operar los coeficientes respetando las leyes de signos.
  - Escribir la expresión final reducida y ordenada.
