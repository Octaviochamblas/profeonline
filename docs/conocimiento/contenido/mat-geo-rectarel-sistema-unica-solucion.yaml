semantic_id: MAT.GEO.RECTA_RELACIONES.SISTEMA_UNICA_SOLUCION
resumen_inicial: 'Interpretación de sistema con única solución como rectas secantes:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: La cantidad de soluciones de un sistema de dos ecuaciones lineales
  tiene una interpretación geométrica directa en términos de la posición relativa
  de las rectas que representan.
explicacion_formal: '![Sistema con única solución](/static/img/geometria/analitica/rectarel-sistema-unica-solucion.svg)


  ### Definición formal


  Si $m_1\neq m_2$, el sistema formado por $y=m_1x+b_1$ e $y=m_2x+b_2$ tiene exactamente
  una solución, correspondiente al único punto de intersección de ambas rectas.


  ### Desarrollo didáctico


  El sistema formado por $y=x$ e $y=-x+4$ tiene única solución $(2,2)$, ya que sus
  pendientes (1 y -1) son distintas.'
definiciones_clave: '- **Interpretación de sistema con única solución como rectas
  secantes**: Elemento o propiedad fundamental en el estudio de geometría analítica
  ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a interpretación de sistema con única solución
  como rectas secantes.'
