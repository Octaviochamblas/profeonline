semantic_id: MAT.ALG.FUNC_POTENCIA_ENTERA_POSITIVA.RECORRIDO_PAR_A_NEGATIVO
resumen_inicial: La determinación del recorrido para una función potencia con exponente par positivo y coeficiente negativo ($n = 2k, a < 0$) establece que $\operatorname{Rec}(f) = ]-\infty, 0]$, alcanzando un máximo absoluto global en el vértice $(0, 0)$ debido a la inversión de la desigualdad $a x^{2k} \le 0$.
explicacion_simple: "![La determinación del recorrido para una función potencia con exponente par positivo y coeficiente negativo ($n = 2k, a < 0$) establece que $\\operatorname{Rec}(f) = ]-\\infty, 0]$, alcanzando un máximo absoluto global en el vértice $(0, 0)$ debido a la inversión de la desigualdad $a x^{2k} \\le 0$](/static/img/nodos/determinacion-del-recorrido-para-exponente-par-positivo-y-a-0-1-intro.svg)\n\n\nCuando el exponente es **par positivo ($2, 4, 6...$)** pero el número de afuera es **negativo ($a < 0$)**:\n\n$$\\operatorname{Rec}(f) = ]-\\infty, 0] \\quad (\\text{Desde Menos Infinito Hasta Cero})$$\n\n- **¿Por qué nunca da números positivos?**\n  - La potencia $x^{2k}$ siempre es positiva o cero ($x^4 \\ge 0$).\n  - Al multiplicarla por un número negativo ($a = -3$), ¡el signo se da vuelta y da siempre **cero o negativo**! ($-3 \\cdot x^4 \\le 0$).\n- **El punto más alto (máximo absoluto):** Está en el vértice $(0, 0)$, donde $y = 0$.\n- **¡Atención al orden del intervalo!**\
  \ Siempre se escribe de menor a mayor: **$]-\\infty, 0]$**, con **corchete cerrado en $0]$**."
explicacion_formal: "Sea $f(x) = a \\cdot x^{2k}$ con $k \\in \\mathbb{Z}^+$ y $a \\in \\mathbb{R}^-$ ($a < 0$).\nDado que $x^{2k} \\ge 0$ para todo $x \\in \\mathbb{R}$, al multiplicar ambos miembros por la constante negativa $a < 0$, la ley de tricotomía invierte el sentido estricto de la relación de orden:\n$$a \\cdot x^{2k} \\le a \\cdot 0 = 0 \\implies f(x) \\le 0, \\; \\forall x \\in \\mathbb{R}$$\n\n**Determinación analítica del recorrido**:\n1. **Cota superior absoluta alcanzable**: $f(0) = a \\cdot 0^{2k} = 0 \\implies \\max_{x \\in \\mathbb{R}} f(x) = 0$.\n2. **Sobreyectividad en $]-\\infty, 0]$**: Para cualquier $y_0 \\le 0$, el cociente $y_0 / a \\ge 0$, permitiendo extraer preimágenes reales simétricas:\n   $$x_0 = \\pm \\sqrt[2k]{\\frac{y_0}{a}} \\in \\mathbb{R} \\implies f(x_0) = y_0$$\nPor consiguiente:\n$$\\operatorname{Rec}(f) = ]-\\infty, 0]$$"
definiciones_clave: '- **Recorrido semiacotado superiormente**: Intervalo $]-\infty, 0]$ cerrado en cero.

  - **Máximo absoluto global**: Valor $y = 0$ que constituye el techo superior infranqueable de la gráfica.'
propiedades_relaciones: '- **Simetría especular de recorridos**: El recorrido de $-a x^{2k}$ es la reflexión por $-1$ del recorrido de $a x^{2k}$.

  - **Preimágenes reales**: Para todo $y < 0$, existen dos valores simétricos $\pm x_0$ en el dominio.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del recorrido para una función potencia con exponente par positivo y coeficiente negativo ($n = 2k, a < 0$) establece que $\operatorname{Rec}(f) = ]-\infty, 0]$, alcanzando un máximo absoluto global en el vértice $(0, 0)$ debido a la inversión de la desigualdad $a x^{2k} \le 0$](/static/img/nodos/determinacion-del-recorrido-para-exponente-par-positivo-y-a-0-1-ejemplos.svg)



    Dada la función $g(x) = -2x^6$:

    1) Determina su recorrido exacto.

    2) Encuentra las preimágenes de $y = -128$.

    3) Explica por qué la ecuación $-2x^6 = 10$ no tiene solución real.'
  pasos:
  - 'Paso 1: Como $n = 6$ (par) y $a = -2 < 0$, la cota superior es $g(0) = 0$. Por lo tanto, **$\operatorname{Rec}(g) = ]-\infty, 0]$**.'
  - 'Paso 2: Resolver $-2x^6 = -128$:

    - Dividir por $-2$: $x^6 = 64$.

    - Extraer raíz sexta: $x = \pm \sqrt[6]{64} = \mathbf{\pm 2}$.'
  - 'Paso 3: Si $-2x^6 = 10 \implies x^6 = -5 < 0$, lo cual es imposible para potencias de orden par en $\mathbb{R}$, demostrando que **$10 \notin \operatorname{Rec}(g)$**.'
