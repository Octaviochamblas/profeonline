  question: ¿Cuál es el recorrido de la función $f(x) = -5x^4$?
  choices:
  - text: ']-∞, 0] (cerrado en cero)'
    is_correct: true
  - text: '[0, -∞['
    is_correct: false
  - text: '[0, +∞['
    is_correct: false
  - text: ']-∞, -5]'
    is_correct: false
  explanation: La alternativa correcta es ']-∞, 0] (cerrado en cero)'. Al ser exponente par y $a = -5 < 0$, los valores son siempre menores o iguales a cero.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor máximo que puede alcanzar la función $f(x) = -8x^2$?
  choices:
  - text: y = 0 (en x = 0)
    is_correct: true
  - text: y = -8
    is_correct: false
  - text: y = +8
    is_correct: false
  - text: No tiene máximo
    is_correct: false
  explanation: La alternativa correcta es 'y = 0 (en x = 0)'. Al abrir hacia abajo, la cúspide de la parábola está en el origen $(0, 0)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente $n = 2k$ (entero par positivo).'
- 'Paso 2: Constatar que el coeficiente $a$ sea negativo ($a < 0$).'
- 'Paso 3: Evaluar el valor máximo en el vértice $f(0) = 0$.'
- 'Paso 4: Escribir el recorrido en orden creciente como $\operatorname{Rec}(f) = ]-\infty, 0]$.'
errores_correccion: '- **Error común:** Escribir el intervalo al revés como $[0, -\infty[$ o $]-\infty, a]$.

  - **Cómo corregirlo:** Los intervalos en la recta real **SIEMPRE van de izquierda a derecha (de menor a mayor)**: el extremo izquierdo es $-\infty$ y el techo superior es $0$: **$]-\infty, 0]$**.'
ejemplos:
- titulo: 'Ejemplo 1: Recorrido negativo'
  enunciado: 'El recorrido de $f(x) = -x^8$ es:'
  alternativas:
  - ']-inf, 0]'
  - '[0, +inf['
  - R
  - ']-inf, -1]'
  respuesta: ']-inf, 0]'
  solucion_pasos:
  - 'Paso 1: Par con $a = -1 < 0 \implies \operatorname{Rec}(f) = ]-\infty, 0]$.'
- titulo: 'Ejemplo 2: Preimagen negativa'
  enunciado: 'Halla las preimágenes de $y = -32$ en $g(x) = -2x^4$:'
  alternativas:
  - x = 2 y x = -2
  - x = 2 únicamente
  - x = 4 y x = -4
  - No tiene solución
  respuesta: x = 2 y x = -2
  solucion_pasos:
  - 'Paso 1: $-2x^4 = -32 \implies x^4 = 16 \implies x = \pm 2$.'
- titulo: 'Ejemplo 3: Cota superior absoluta'
  enunciado: ¿Qué tipo de cota tiene $h(x) = -10x^6$?
  alternativas:
  - Cota superior y = 0
  - Cota inferior y = 0
  - Cota superior y = -10
  - No está acotada
  respuesta: Cota superior y = 0
  solucion_pasos:
  - 'Paso 1: Máximo global en $y = 0 \implies$ cota superior.'
- titulo: 'Ejemplo 4: Notación formal'
  enunciado: 'La forma correcta de escribir el recorrido de $y = -4x^2$ es:'
  alternativas:
  - ']-inf, 0]'
  - '[0, -inf['
  - ']-inf, 0['
  - ']-4, 0]'
  respuesta: ']-inf, 0]'
  solucion_pasos:
  - 'Paso 1: De menor a mayor con 0 incluido $\implies ]-\infty, 0]$.'
errores_frecuentes:
- Escribir [0, -inf[ invirtiendo el orden de los extremos del intervalo.
- Olvidar cerrar el corchete en el cero.
- Creer que el recorrido depende del grado par numérico específico.
afirmaciones_verdaderas:
- Toda función potencia con exponente par positivo y a < 0 tiene recorrido ]-∞, 0].
- El valor y = 0 es el máximo absoluto de la función y se alcanza en el vértice (0, 0).
al_terminar_debes_poder: '**QUÉ:** Determinar el recorrido de funciones potencia con exponente par positivo y a < 0.


  **CÓMO:** Demostrando la inversión de orden a x²ᵏ ≤ 0 y el máximo global f(0) = 0 para establecer Rec(f) = ]-∞, 0].


