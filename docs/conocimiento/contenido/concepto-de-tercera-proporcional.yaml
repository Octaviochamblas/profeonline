semantic_id: MAT.NUM.PROPORCIONES.TERCERA_PROPORCIONAL
resumen_inicial: La tercera proporcional es el término extremo desconocido $x$ en
  una proporción continua donde los medios son iguales ($\frac{a}{b} = \frac{b}{x}$).
explicacion_simple: 'Una **proporción continua** es aquella donde el término central
  se repite ($b$):

  $$\frac{a}{b} = \frac{b}{x}$$

  Al valor $x$ se le llama **tercera proporcional** entre $a$ y $b$.

  Ejemplo: La tercera proporcional entre $4$ y $6$ es $\frac{4}{6} = \frac{6}{x} \implies
  x = \frac{6^2}{4} = \frac{36}{4} = 9$.'
explicacion_formal: Dados dos números $a, b \in \mathbb{R} \setminus \{0\}$, la tercera
  proporcional entre $a$ y $b$ es el número real $x$ que satisface la proporción continua
  $\frac{a}{b} = \frac{b}{x}$, obteniéndose $x = \frac{b^2}{a}$.
definiciones_clave: '- **Tercera proporcional ($x$)**: Término extremo $x = \frac{b^2}{a}$
  en una proporción continua.'
propiedades_relaciones: '- **Proporción continua**: Proporción de la forma $\frac{a}{b}
  = \frac{b}{c}$ con medios idénticos.'
ejemplo_guiado:
  enunciado: Calcula la tercera proporcional entre $2$ y $8$.
  pasos:
  - 'Plantear la proporción continua repitiendo el término 8 en los medios: $\frac{2}{8}
    = \frac{8}{x}$.'
  - 'Aplicar la propiedad fundamental: $2 \cdot x = 8 \cdot 8$.'
  - 'Calcular el cuadrado del medio: $2x = 64$.'
  - 'Despejar $x$: $x = \frac{64}{2} = 32$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la tercera proporcional entre 3 y 6?
  choices:
  - text: '12'
    is_correct: true
  - text: '9'
    is_correct: false
  - text: '18'
    is_correct: false
  - text: '2'
    is_correct: false
  explanation: 'La correcta es: 12. $\frac{3}{6} = \frac{6}{x} \implies x = \frac{6^2}{3}
    = \frac{36}{3} = 12$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Halla la tercera proporcional entre 9 y 12.
  choices:
  - text: '16'
    is_correct: true
  - text: '15'
    is_correct: false
  - text: '108'
    is_correct: false
  - text: '24'
    is_correct: false
  explanation: 'La correcta es: 16. $\frac{9}{12} = \frac{12}{x} \implies x = \frac{144}{9}
    = 16$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la proporción continua $\frac{a}{b} = \frac{b}{x}$.'
- 'Paso 2: Elevar al cuadrado el término medio $b^2$.'
- 'Paso 3: Dividir $b^2$ entre el primer término $a$.'
errores_correccion: Recuerda que en la tercera proporcional el segundo número dado
  ($b$) se repite en ambos medios.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula la tercera proporcional entre 5 y 10.
  alternativas:
  - '20'
  - '15'
  - '25'
  respuesta: '20'
  solucion_pasos:
  - $x = \frac{10^2}{5} = \frac{100}{5} = 20$.
errores_frecuentes:
- No repetir el segundo número como medio de la proporción.
afirmaciones_verdaderas:
- La tercera proporcional satisface $x = b^2/a$.
al_terminar_debes_poder: Calcular la tercera proporcional en proporciones continuas.
fuente: Texto escolar MINEDUC.
estado: publicado
