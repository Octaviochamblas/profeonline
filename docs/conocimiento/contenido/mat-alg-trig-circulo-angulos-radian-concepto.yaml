procedimiento:
- 'Paso 1: Recuerda que un giro completo equivale a $2\pi$ radianes.'
- 'Paso 2: Relaciona fracciones del giro completo con fracciones equivalentes de $2\pi$.'
- 'Paso 3: Usa esta relación para interpretar medidas angulares en radianes.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en definición del radián
  como medida angular basada en longitud de arco.
ejemplos:
- titulo: Relación entre giro completo y radianes
  enunciado: ¿Cuántos radianes corresponden a un giro completo de $360°$?
  solucion_pasos:
  - Se aplica la relación fundamental entre grados y radianes.
  - Un giro completo corresponde a $2\pi$ radianes.
- titulo: Relación de un cuarto de giro
  enunciado: ¿Cuántos radianes corresponden a un ángulo de $90°$?
  solucion_pasos:
  - $90°$ es un cuarto de $360°$.
  - Corresponde a un cuarto de $2\pi$, es decir, $\pi/2$ radianes.
- titulo: ¿El radián depende del tamaño de la circunferencia?
  enunciado: ¿La medida de un ángulo en radianes depende del radio específico de la
    circunferencia usada?
  respuesta: 'No'
  solucion_pasos:
  - El radián es una medida relativa (arco dividido por radio), así que es la misma
    sin importar el tamaño del círculo.
- titulo: ¿Un ángulo de $2\pi$ radianes corresponde a un giro completo?
  enunciado: ¿Un ángulo de $2\pi$ radianes corresponde exactamente a un giro completo
    de $360°$?
  respuesta: Sí
  solucion_pasos:
  - Es la equivalencia fundamental entre ambas unidades de medida angular.
errores_frecuentes:
- Confundir el radián con el grado, tratándolos como si fueran la misma unidad.
- Olvidar que un giro completo equivale a $2\pi$ radianes, no a $\pi$.
- Suponer que el radián depende del radio específico del círculo usado.
- No relacionar correctamente las fracciones del giro completo con sus equivalentes
  en radianes.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  definición del radián como medida angular basada en longitud de arco.
