semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.RADIAN_CONCEPTO
resumen_inicial: 'Definición del radián como la unidad natural de medida angular basada en la longitud del arco que iguala al radio del círculo.'
explicacion_simple: |
  Medir ángulos en grados sexagesimales ($360^\circ$) es una costumbre histórica, pero en matemáticas avanzadas se prefiere la medida natural llamada **radián**. Imagina tomar una cuerda de la misma longitud que el radio del círculo y doblarla cuidadosamente sobre la frontera del círculo. El ángulo formado al abrir ese arco mide exactamente **1 radián** ($1 \text{ rad}$). Como el perímetro completo de un círculo de radio 1 mide $2\pi$, un giro completo de $360^\circ$ equivale a $2\pi \text{ radianes}$.
explicacion_formal: |
  ### Definición formal
  El **radián** es la unidad de medida del ángulo central en una circunferencia que subtiende un arco cuya longitud $s$ es exactamente igual al radio $r$ de dicha circunferencia:
  $$\theta = \frac{s}{r} \text{ rad}$$
  Cuando $s = r$, se tiene $\theta = 1 \text{ rad}$.

  ### Desglose simbólico
  - $s$: Longitud del arco de circunferencia subtendido por el ángulo.
  - $r$: Radio de la circunferencia.
  - $\theta$: Medida del ángulo central en radianes (magnitud adimensional).
  - En el círculo unitario ($r = 1$): La medida del ángulo en radianes es numéricamente igual a la longitud del arco subtendido: $\theta = s$.

  ### Síntesis didáctica
  El radián conecta directamente la geometría de los ángulos con el cálculo de distancias reales sobre una circunferencia. Al ser una relación de dos longitudes ($\text{longitud} / \text{longitud}$), el radián es una unidad adimensional pura que facilita operaciones en cálculo diferencial y física.
definiciones_clave: |
  - **Radián (rad)**: Unidad angular donde la longitud de arco recorrida es igual a la medida del radio.
  - **Ángulo central**: Ángulo cuyo vértice es el centro del círculo y cuyos lados son dos radios.
  - **Magnitud adimensional**: Propiedad de las medidas de ángulos en radianes al ser una razón escalar entre dos longitudes del mismo tipo.
propiedades_relaciones: |
  - **Equivalencia Fundamental**:
    - Un giro completo ($360^\circ$) equivale a $2\pi \text{ rad} \approx 6.28318 \text{ rad}$.
    - Medio giro ($180^\circ$) equivale a $\pi \text{ rad} \approx 3.14159 \text{ rad}$.
  - **Valor aproximado**: $1 \text{ rad} = \frac{180^\circ}{\pi} \approx 57.2958^\circ$.
ejemplo_guiado:
  enunciado: 'En una circunferencia de radio $r = 5 \text{ cm}$, se traza un ángulo central de $\theta = 2 \text{ rad}$. Calcula la longitud del arco $s$ subtendido por dicho ángulo.'
  pasos:
    - 'Paso 1: Recordar la fórmula fundamental de definición del radián: $\theta = \frac{s}{r}$.'
    - 'Paso 2: Despejar la longitud de arco $s$: $s = r \cdot \theta$.'
    - 'Paso 3: Sustituir las magnitudes conocidas: $r = 5 \text{ cm}$ y $\theta = 2 \text{ rad}$.'
    - 'Paso 4: Calcular el producto: $s = 5 \cdot 2 = 10 \text{ cm}$. La longitud del arco mide exactamente $10 \text{ cm}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se define numéricamente un ángulo de 1 radián?'
    choices:
      - {text: 'Como el ángulo central cuyo arco subtendido mide lo mismo que el radio', is_correct: true}
      - {text: 'Como la 360ª parte del perímetro del círculo', is_correct: false}
      - {text: 'Como un ángulo recto de 90 grados exactos', is_correct: false}
      - {text: 'Como el diámetro dividido entre la circunferencia', is_correct: false}
    explanation: 'La alternativa correcta es ''Como el ángulo central cuyo arco subtendido mide lo mismo que el radio''. Es la definición canónica de radián ($s = r$).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el círculo unitario ($r = 1$), ¿cuál es la longitud de arco subtendida por un ángulo de $\pi \text{ rad}$?'
    choices:
      - {text: '$\pi$ unidades de longitud', is_correct: true}
      - {text: '$180$ unidades de longitud', is_correct: false}
      - {text: '$2\pi$ unidades de longitud', is_correct: false}
      - {text: '$1$ unidad de longitud', is_correct: false}
    explanation: 'La alternativa correcta es ''$\pi$ unidades de longitud''. En el círculo unitario $r = 1$, la longitud de arco $s$ es exactamente igual al ángulo en radianes $\theta = \pi$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Medir o identificar el radio $r$ de la circunferencia.'
  - 'Paso 2: Identificar la longitud de arco $s$ recorrida por el ángulo.'
  - 'Paso 3: Aplicar el cociente de magnitudes $\theta = \frac{s}{r}$.'
  - 'Paso 4: Expresar el resultado en radianes ($\text{rad}$).'
errores_correccion: |
  - **Error 1:** Creer que $1 \text{ radián}$ equivale a $1^\circ$ sexagesimal. **Cómo corregirlo:** $1 \text{ radián}$ es una apertura mucho más grande, equivalente aproximadamente a $57.3^\circ$ (ya que $\pi \text{ rad} \approx 3.14 \text{ rad} = 180^\circ$).
  - **Error 2:** Tratamiento de los radianes como unidades físicas con dimensiones de masa o tiempo. **Cómo corregirlo:** El radián es un cociente adimensional entre dos longitudes ($\text{metros} / \text{metros}$), por lo que carece de dimensión física.
ejemplos:
  - titulo: 'Cálculo de ángulo en radianes'
    enunciado: 'Un arco de $12 \text{ cm}$ en un círculo de radio $4 \text{ cm}$ subtiende un ángulo central. ¿Cuántos radianes mide?'
    alternativas:
      - '$3 \text{ rad}$'
      - '$48 \text{ rad}$'
      - '$\frac{1}{3} \text{ rad}$'
    respuesta: '$3 \text{ rad}$'
    solucion_pasos:
      - '1. Aplicamos $\theta = \frac{s}{r}$.'
      - '2. $\theta = \frac{12 \text{ cm}}{4 \text{ cm}} = 3 \text{ rad}$.'
  - titulo: 'Giro completo en radianes'
    enunciado: '¿A cuántos radianes equivale la circunferencia completa de un círculo unitario?'
    alternativas:
      - '$2\pi \text{ rad}$'
      - '$\pi \text{ rad}$'
      - '$360\pi \text{ rad}$'
    respuesta: '$2\pi \text{ rad}$'
    solucion_pasos:
      - '1. El perímetro del círculo unitario de $r = 1$ es $P = 2\pi(1) = 2\pi$.'
      - '2. Como $\theta = s / r = 2\pi / 1 = 2\pi \text{ rad}$.'
  - titulo: 'Arco igual al radio'
    enunciado: 'Si la longitud de arco $s$ mide exactamente igual al radio $r$, ¿el ángulo central mide $1 \text{ rad}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por definición: $\theta = \frac{r}{r} = 1 \text{ rad}$.'
  - titulo: 'Adimensionalidad del radián'
    enunciado: '¿La medida de un ángulo en radianes es una cantidad adimensional?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al ser el cociente de dos magnitudes de longitud, las unidades se cancelan.'
errores_frecuentes:
  - 'La afirmación de que la medida de 1 radián es idéntica a la medida de 1 grado sexagesimal.'
  - 'La afirmación de que un giro completo a la circunferencia se mide como $\pi \text{ radianes}$.'
  - 'La afirmación de que la fórmula de longitud de arco $s = r \cdot \theta$ requiere usar el ángulo en grados sexagesimales.'
  - 'La afirmación de que el radián varía su tamaño si cambia el radio del círculo.'
  - 'La afirmación de que un ángulo en radianes no se puede expresar usando fracciones de $\pi$.'
afirmaciones_verdaderas:
  - 'El radián es la medida angular natural definida por la razón entre la longitud del arco subtendido y el radio ($s/r$).'
  - 'Un giro completo alrededor del círculo unitario equivale exactamente a $2\pi \text{ radianes}$.'
al_terminar_debes_poder: |
  QUÉ: Definir y calcular ángulos centrales en radianes a partir de la longitud del arco y el radio.
  CÓMO: Aplicar el cociente de magnitudes $\theta = \frac{s}{r}$ y utilizar la equivalencia fundamental $2\pi \text{ rad} = 360^\circ$.
