semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.RADIAN_CONCEPTO
resumen_inicial: 'Definición del radián como medida angular basada en longitud de
  arco: círculo unitario, amplitud, período y transformaciones de Círculo unitario
  y sistemas de medida.'
explicacion_simple: Además de los grados, existe otra unidad para medir ángulos que
  se relaciona directamente con la longitud del arco de circunferencia que el ángulo
  recorre.
explicacion_formal: '### Definición formal


  En una circunferencia de radio $r$, un ángulo central mide $1$ radián si el arco
  que subtiende tiene longitud exactamente $r$. En el círculo unitario ($r=1$), un
  ángulo de $1$ radián corresponde a un arco de longitud $1$.


  ### Desarrollo didáctico


  Como el perímetro completo del círculo unitario es $2\pi$, un giro completo ($360°$)
  corresponde a $2\pi$ radianes. Así, medio giro ($180°$) corresponde a $\pi$ radianes,
  y un cuarto de giro ($90°$) corresponde a $\pi/2$ radianes.'
definiciones_clave: '- **Definición del radián como medida angular basada en longitud
  de arco**: Función periódica fundamentada en las coordenadas del círculo unitario
  o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a definición del radián como medida angular basada en longitud de arco.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    definición del radián como medida angular basada en longitud de arco.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de definición del radián como medida angular basada en
    longitud de arco.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
