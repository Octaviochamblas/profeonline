procedimiento:
- 'Paso 1: Confirmar que los denominadores de las fracciones a sumar sean exactamente idénticos.'
- 'Paso 2: Escribir una barra de fracción única con el denominador común abajo.'
- 'Paso 3: Colocar la suma de los numeradores dentro de paréntesis en el numerador.'
- 'Paso 4: Eliminar paréntesis y reducir los términos semejantes en el numerador.'
- 'Paso 5: Factorizar el numerador resultante para comprobar si se puede simplificar con el denominador.'
errores_correccion: '- **Error 1:** Sumar los denominadores entre sí (escribir $\frac{A}{X} + \frac{B}{X} = \frac{A+B}{2X}$).
  **Cómo corregirlo:** El denominador **NUNCA SE SUMA EN LA ADICIÓN DE FRACCIONES; SE CONSERVA INTACTO ($X$)**.

  - **Error 2:** Omitir la reducción de términos semejantes en el numerador compuesto resultante. **Cómo corregirlo:** Se
  deben **AGRUPAR Y SUMAR LOS COEFICIENTES DE LOS TÉRMINOS CON LA MISMA PARTE LITERAL**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la suma de las fracciones $\frac{2x}{x+1} + \frac{3x}{x+1}$?
  alternativas:
  - $\frac{5x}{x+1}$
  - $\frac{5x}{2x+2}$
  - $\frac{6x^2}{x+1}$
  respuesta: $\frac{5x}{x+1}$
  solucion_pasos:
  - 1. Conservar el denominador común $x+1$.
  - '2. Sumar numeradores: $2x + 3x = 5x$.'
  - '3. Resultado: $\frac{5x}{x+1}$.'
- titulo: Ejemplo 2
  enunciado: Al sumar $\frac{x^2}{x-2} + \frac{4}{x-2}$ y restar $\frac{4x}{x-2}$, ¿cuál es el resultado simplificado?
  alternativas:
  - $x - 2$
  - $x + 2$
  - $\frac{x^2-4x+4}{x-2}$
  respuesta: $x - 2$
  solucion_pasos:
  - '1. Numerador combinado: $x^2 - 4x + 4 = (x-2)^2$.'
  - '2. Fracción: $\frac{(x-2)^2}{x-2} = x-2$.'
- titulo: Conservación del denominador
  enunciado: ¿Se conserva intacto el denominador común al sumar fracciones algebraicas homogéneas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla básica para la adición de fracciones de igual denominador.
- titulo: Suma de denominadores no válida
  enunciado: ¿Es correcto sumar los denominadores entre sí dando $D_1 + D_2$?
  respuesta: 'No'
  solucion_pasos:
  - No, sumar denominadores es un error conceptual grave.
errores_frecuentes:
- La suma de fracciones homogéneas $\frac{A}{X} + \frac{B}{X}$ equivale a $\frac{A+B}{2X}$.
- En la adición $\frac{2x+3}{D} + \frac{3x+5}{D}$, la suma unificada se expresa como el producto $\frac{(2x+3)(3x+5)}{D}$.
- Al calcular $\frac{a}{d} + \frac{b}{d}$, el resultado es idéntico a efectuar la sustracción $\frac{a-b}{d}$.
- La suma $\frac{x}{y} + \frac{z}{y}$ equivale a $\frac{xz}{y^2}$.
- Al sumar $\frac{P(x)}{D(x)} + \frac{Q(x)}{D(x)}$, el denominador $D(x)$ se simplifica dejando como resultado el entero $P(x)
  + Q(x)$.
afirmaciones_verdaderas:
- Para sumar fracciones algebraicas de igual denominador se suman los numeradores y se conserva el denominador común.
- El dominio de la suma de fracciones homogéneas mantiene la restricción $D(x) \neq 0$ del denominador común.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/adicion-de-fracciones-algebraicas-de-igual-denominador-resumen.svg)


  QUÉ: Sumar fracciones algebraicas de igual denominador.

  CÓMO: Conservar el denominador común $D(x)$ y combinar los numeradores en la expresión unificada $\frac{A(x)+B(x)}{D(x)}$
  reduciendo términos semejantes, declarando la restricción $D(x) \neq 0$.

  '
