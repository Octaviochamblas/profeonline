procedimiento:
- 'Paso 1: Confirma que los denominadores son exactamente iguales.'
- 'Paso 2: Escribe una sola fracción usando ese denominador común.'
- 'Paso 3: Coloca la suma de los numeradores en la parte superior.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en adición de fracciones algebraicas de igual denominador.
ejemplos:
- titulo: Suma $\frac{5a}{3b} + \frac{2a}{3b}$
  enunciado: Suma $\frac{5a}{3b} + \frac{2a}{3b}$.
  solucion_pasos:
  - El denominador es $3b$ para ambos.
  - 'Sumamos numeradores: $5a + 2a = 7a$.'
  - 'Resultado: $\frac{7a}{3b}$.'
- titulo: Suma $\frac{x^2}{x-2} + \frac{4}{x-2}$.
  solucion_pasos:
  - Al tener el mismo denominador, solo se juntan los términos del numerador.
- titulo: 'Respecto de «Adición de fracciones algebraicas de igual denominador»: ¿Se
    ajusta a la defini'
  enunciado: 'Respecto de «Adición de fracciones algebraicas de igual denominador»:
    ¿Se ajusta a la definición esta afirmación? «Para sumar fracciones con igual denominador,
    mantén el denominador y suma los numeradores»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para sumar fracciones con igual
    denominador, mantén el denominador y suma los numeradores.'
- titulo: 'Respecto de «Adición de fracciones algebraicas de igual denominador»: ¿Es
    compatible con el'
  enunciado: 'Respecto de «Adición de fracciones algebraicas de igual denominador»:
    ¿Es compatible con el procedimiento esta afirmación? «Sumar los denominadores
    (ej. decir que el nuevo denominador es el doble)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para sumar fracciones con igual
    denominador, mantén el denominador y suma los numeradores.'
errores_frecuentes:
- Sumar los denominadores (ej. decir que el nuevo denominador es el doble).
- Se suman entre sí.
- Para «¿Qué pasa con los denominadores cuando se suman dos fracciones que ya tienen
  el mismo denominador», la respuesta correcta es Se multiplican.
- Se cancelan, dejando solo los numeradores.
- $\frac{5m}{2m^2+2}$.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando adición
