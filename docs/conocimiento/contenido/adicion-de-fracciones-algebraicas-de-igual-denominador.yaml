semantic_id: MAT.ALG.FRACCIONES_SUMA.IGUAL_DENOMINADOR
resumen_inicial: Para sumar fracciones algebraicas que tienen el mismo denominador, se suman los numeradores y se conserva
  el denominador común.
explicacion_simple: 'Sumar fracciones algebraicas de igual denominador consiste en mantener la base común y combinar las expresiones
  superiores.


  Dado que ambas fracciones comparten la misma división o denominador, conservamos intacto dicho denominador en el resultado
  final.


  Simplemente sumamos los polinomios o monomios de los numeradores en la parte superior y reducimos los términos semejantes
  resultantes.


  ![Adición de fracciones de igual denominador](/static/img/nodos/adicion-de-fracciones-algebraicas-de-igual-denominador-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dadas dos fracciones algebraicas $\frac{A(x)}{D(x)}$ y $\frac{B(x)}{D(x)}$ con $D(x) \neq 0$, la **adición de igual denominador**
  se define formalmente como:


  $$\frac{A(x)}{D(x)} + \frac{B(x)}{D(x)} = \frac{A(x) + B(x)}{D(x)}$$


  ### Desglose de la fórmula

  - $A(x) + B(x)$: Suma polinomial de los numeradores mantenida en el dividendo resultante.

  - $D(x)$: Denominador común no nulo que se conserva sin alteración en el resultado final.


  ### Síntesis didáctica

  Sumar fracciones con denominadores idénticos exige operar exclusivamente los numeradores sobre la barra del denominador
  común.

  '
definiciones_clave: '- **Adición de igual denominador**: Operación de suma donde el denominador permanece idéntico y los numeradores
  se combinan.

  - **Conservación de denominador**: Regla fundamental que prohíbe sumar los denominadores entre sí.

  '
propiedades_relaciones: '- **Homogeneidad previa**: Si los denominadores no son iguales, se deben homogeneizar mediante m.c.m.
  antes de sumar.

  - **Dominio constante**: $\operatorname{Dom} = \{x \in \mathbb{R} \mid D(x) \neq 0\}$.

  '
ejemplo_guiado:
  enunciado: Suma las fracciones algebraicas de igual denominador $\frac{3x + 5}{x + 2} + \frac{x - 1}{x + 2}$, reduce el
    numerador y evalúa el resultado para $x = 3$.
  pasos:
  - 'Paso 1: Conservar el denominador común $(x + 2)$ y sumar los numeradores: $\frac{(3x + 5) + (x - 1)}{x + 2}$.'
  - 'Paso 2: Agrupar y reducir términos semejantes en el numerador: $3x + x = 4x$ y $5 - 1 = 4$, obteniendo $4x + 4$.'
  - 'Paso 3: Escribir la suma obtenida: $\frac{4x + 4}{x + 2} = \frac{4(x + 1)}{x + 2}$ para $x \neq -2$.'
  - 'Paso 4: Evaluar para $x = 3$: $\frac{4(3 + 1)}{3 + 2} = \frac{4(4)}{5} = \frac{16}{5}$.'
  imagen: /static/img/nodos/adicion-de-fracciones-algebraicas-de-igual-denominador-ejemplos.svg
