semantic_id: MAT.ALG.FRACCIONES_SUMA.IGUAL_DENOMINADOR
resumen_inicial: Para sumar fracciones algebraicas que tienen el mismo denominador,
  se suman los numeradores y se conserva el denominador común.
explicacion_simple: 'Sumar fracciones algebraicas de igual denominador es el caso
  más sencillo:

  Como ambas partes se dividen entre la misma cantidad o expresión, conservamos exactamente
  ese mismo denominador en el resultado.

  Simplemente sumamos los polinomios o monomios de los numeradores arriba y luego
  reducimos los términos semejantes que aparezcan.'
explicacion_formal: 'Dadas dos fracciones algebraicas $\frac{A(x)}{D(x)}$ y $\frac{B(x)}{D(x)}$
  con $D(x) \neq 0$, la **adición de igual denominador** se define formalmente como:


  $$\frac{A(x)}{D(x)} + \frac{B(x)}{D(x)} = \frac{A(x) + B(x)}{D(x)}$$


  **Desglose de la fórmula:**

  - $A(x) + B(x)$: Suma polinomial de los numeradores mantenida en el dividendo resultante.

  - $D(x)$: Denominador común no nulo que se conserva sin alteración en el resultado
  final.'
definiciones_clave: '- **Adición de igual denominador**: Operación de suma donde el
  denominador permanece idéntico y los numeradores se combinan.

  - **Conservación de denominador**: Regla fundamental que prohíbe sumar los denominadores
  entre sí.'
propiedades_relaciones: '- **Homogeneidad previa**: Si los denominadores no son iguales,
  se deben homogeneizar mediante m.c.m. antes de aplicar esta regla.

  - **Dominio constante**: $\operatorname{Dom} = \{x \in \mathbb{R} \mid D(x) \neq
  0\}$.'
ejemplo_guiado:
  enunciado: Suma las fracciones algebraicas de igual denominador $\frac{3x + 5}{x
    + 2} + \frac{x - 1}{x + 2}$, reduce el numerador y evalúa el resultado para $x
    = 3$.
  pasos:
  - 'Paso 1: Conservar el denominador común $(x + 2)$ y sumar los numeradores: $\frac{(3x
    + 5) + (x - 1)}{x + 2}$.Paso 2: Agrupar y reducir términos semejantes en el numerador:
    $3x + x = 4x$ y $5 - 1 = 4$, luego el numerador es $4x + 4$.Paso 3: Escribir la
    suma obtenida: $\frac{4x + 4}{x + 2} = \frac{4(x + 1)}{x + 2}$ para $x \neq -2$.Paso
    4: Evaluar para $x = 3$: $\frac{4(3 + 1)}{3 + 2} = \frac{4(4)}{5} = \frac{16}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de sumar $\frac{3x + 5}{x + 2} + \frac{x - 1}{x
    + 2}$?
  choices:
  - text: $\frac{4x + 4}{x + 2}$
    is_correct: true
  - text: $\frac{4x + 4}{2x + 4}$
    is_correct: false
  - text: $\frac{3x - 5}{x + 2}$
    is_correct: false
  - text: $\frac{4x}{x + 2}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{4x + 4}{x + 2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la expresión $\frac{4x + 4}{x + 2}$ para $x = 3$, ¿cuál es
    el valor obtenido?
  choices:
  - text: $\frac{16}{5}$
    is_correct: true
  - text: $\frac{12}{5}$
    is_correct: false
  - text: $\frac{16}{6}$
    is_correct: false
  - text: $3$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{16}{5}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que los denominadores de las fracciones a sumar sean exactamente
  idénticos.'
- 'Paso 2: Escribir una barra de fracción única con el denominador común abajo.'
- 'Paso 3: Colocar la suma de los numeradores dentro de paréntesis en el numerador.'
- 'Paso 4: Eliminar paréntesis y reducir los términos semejantes en el numerador.'
- 'Paso 5: Factorizar el numerador resultante para comprobar si se puede simplificar
  con el denominador.'
errores_correccion: '- **Error común:** Sumar los denominadores entre sí (por ejemplo
  decir $\frac{a}{x} + \frac{b}{x} = \frac{a+b}{2x}$).

  - **Cómo corregirlo:** El denominador NUNCA se suma al adicionar fracciones. Se
  mantiene exactamente igual en la respuesta.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de adición.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de adición.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se conserva el denominador común al sumar?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla fundamental de la adición racional.
- titulo: ¿Se pueden sumar los denominadores entre sí?
  respuesta: 'No'
  solucion_pasos:
  - No, jamás se suman los denominadores.
errores_frecuentes:
- Sumar denominadores al realizar la adición de fracciones algebraicas.
- Sumar numeradores de fracciones con distinto denominador sin homogeneizar.
- Olvidar multiplicar el numerador por el factor de amplificación correspondiente.
- Dejar paréntesis sin expandir en el numerador impidiendo la reducción de términos
  semejantes.
- No verificar si el numerador final se puede factorizar para simplificar con el denominador.
afirmaciones_verdaderas:
- Para sumar fracciones algebraicas de igual denominador se suman los numeradores
  y se conserva el denominador común.
- El uso del m.c.m. como denominador común minimiza el grado de los numeradores amplificados.
al_terminar_debes_poder: Al finalizar este recurso podrás realizar la adición de fracciones
  algebraicas de igual y distinto denominador expresando el resultado en su forma
  simplificada.
