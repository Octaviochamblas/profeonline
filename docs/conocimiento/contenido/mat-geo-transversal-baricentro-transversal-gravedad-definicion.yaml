semantic_id: MAT.GEO.TRANSVERSAL_BARICENTRO.TRANSVERSAL_GRAVEDAD_DEFINICION
resumen_inicial: 'Definición de transversal de gravedad como segmento desde un vértice
  al punto medio del lado opuesto: conceptos, teoremas, propiedades geométricas y
  cálculo en Elementos Secundarios del Triángulo.'
explicacion_simple: De los segmentos notables que parten de un vértice, la transversal
  de gravedad es el que llega exactamente al punto medio del lado opuesto, sin importar
  el ángulo que forme con él.
explicacion_formal: '![Transversal de gravedad desde un vértice](/static/img/geometria/elementos-secundarios/transversal-baricentro-transversal-gravedad-definicion.svg)


  ### Definición formal


  La transversal de gravedad desde el vértice A de un triángulo ABC es el segmento
  AM, donde M es el punto medio del lado BC.


  ### Desarrollo didáctico


  Cada triángulo tiene tres transversales de gravedad, una por cada vértice. A diferencia
  de la altura, la transversal de gravedad no exige ningún ángulo particular con el
  lado opuesto, solo llegar a su punto medio.'
definiciones_clave: '- **Definición de transversal de gravedad como segmento desde
  un vértice al punto medio del lado opuesto**: Elemento o propiedad fundamental en
  el estudio de elementos secundarios del triángulo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
