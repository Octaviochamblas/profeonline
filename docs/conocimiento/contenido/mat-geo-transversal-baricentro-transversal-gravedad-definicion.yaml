procedimiento:
- 'Paso 1: Elige un vértice del triángulo.'
- 'Paso 2: Encuentra el punto medio del lado opuesto a ese vértice.'
- 'Paso 3: Traza el segmento que une el vértice con ese punto medio: esa es la transversal
  de gravedad.'
