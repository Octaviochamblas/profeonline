procedimiento:
- 'Paso 1: Calcula la diferencia (resta) entre el segundo y el primer término, y luego entre
  el tercero y el segundo.'
- 'Paso 2: Si la diferencia es constante, la regularidad es una suma/resta.'
- 'Paso 3: Si no es constante, prueba dividiendo para ver si hay un factor multiplicativo.'
- 'Paso 4: Aplica la regla encontrada al último término para hallar el siguiente.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en identificación de regularidades en secuencias numéricas.
ejemplos:
- titulo: Buscando el eslabón perdido
  enunciado: 'Encuentra la regularidad y el siguiente número en la sucesión: 80, 40, 20, 10...'
  solucion_pasos:
  - 'Resto: 40 - 80 = -40. Resto 20 - 40 = -20. No es una resta constante.'
  - 'Divido: 40 / 80 = 0.5 (o dividir por 2). Divido 20 / 40 = 0.5.'
  - El patrón constante es 'dividir por 2' (o multiplicar por 1/2).
  - El siguiente es 10 / 2 = 5.
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la regularidad de la sucesión 2, 6, 18, 54?
  alternativas:
  - Multiplicar por 3
  - Sumar 4
  - Multiplicar por 2
  respuesta: Multiplicar por 3
  solucion_pasos:
  - 6 dividido entre 2 es 3, y 18 dividido entre 6 también es 3.
- titulo: Ejemplo 2
  enunciado: 'El siguiente término de la sucesión 100, 90, 80, 70 es:'
  alternativas:
  - '60'
  - '65'
  - '75'
  respuesta: '60'
  solucion_pasos:
  - La diferencia constante es menos 10, así que 70 menos 10 es igual a 60.
- titulo: ¿La sucesión 1, 4, 9, 16, 25 tiene una diferencia constante entre sus términos?
  respuesta: 'No'
  solucion_pasos:
  - Las diferencias son 3, 5, 7 y 9, que no son constantes; la regularidad real es que son
    los cuadrados perfectos.
- titulo: ¿Toda sucesión creciente tiene necesariamente una regularidad de suma?
  respuesta: 'No'
  solucion_pasos:
  - También puede crecer por multiplicación, como 3, 6, 12, 24, o por potencias, como 1, 4,
    9, 16.
errores_frecuentes:
- Asumir una regla comprobando solo los dos primeros números, sin verificar que se cumpla
  en el tercer y cuarto número.
- Pensar que las reglas solo pueden ser sumas simples.
- Verificar la regularidad solo con los dos primeros términos, sin confirmarla en el resto
  de la sucesión.
- Confundir una regularidad multiplicativa con una aditiva cuando los números crecen rápido.
- No considerar que la regularidad puede involucrar potencias, como los cuadrados, en vez
  de sumas o productos simples.
afirmaciones_verdaderas:
- La formulación de identificación de regularidades en secuencias numéricas mantiene la regularidad
  de la sucesión.
- Una diferencia constante entre términos consecutivos indica una regularidad de suma o resta.
