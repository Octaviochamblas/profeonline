semantic_id: MAT.NUM.SUCESIONES_BASE.REGULARIDAD_NUMERICA
resumen_inicial: 'Identificación de regularidades en secuencias numéricas: concepto y desarrollo
  dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: Si ves los números 10, 20, 30... tu cerebro automáticamente grita '¡40!'.
  Acabas de encontrar una regularidad numérica. Descubrir el patrón es como ser un detective
  matemático.
explicacion_formal: 'Para descubrir qué regla gobierna una sucesión, debes probar operaciones
  básicas entre números consecutivos:


  1. **¿Sumar o Restar?** Revisa si la diferencia entre números juntos es siempre la misma.
  Ej: $7, 10, 13, 16$ (el patrón es $+3$).

  2. **¿Multiplicar o Dividir?** Si los números crecen muy rápido, prueba dividir un término
  por el anterior. Ej: $3, 6, 12, 24$ (el patrón es $\cdot 2$).

  3. **¿Cuadrados perfectos?** Si ves $1, 4, 9, 16, 25$, no están sumando ni multiplicando
  por lo mismo. Son los números $1^2, 2^2, 3^2, 4^2\dots$


  Una vez que descubres el ''secreto'' de la sucesión, puedes calcular el siguiente término
  fácilmente.'
definiciones_clave: '- **Identificación de regularidades en secuencias numéricas**: Concepto
  fundamental dentro del estudio de Conceptos fundamentales de sucesiones.'
propiedades_relaciones: '- **Propiedades de Identificación de regularidades en secuencias
  numéricas**: Relaciones de cambio y fórmulas estructurales de conceptos fundamentales de
  sucesiones.'
ejemplo_guiado:
  enunciado: Encuentra la regularidad y el siguiente término en la sucesión 5, 11, 17, 23.
  pasos:
  - 'Calculo las diferencias entre términos consecutivos: 11 menos 5 es 6; 17 menos 11 es
    6; 23 menos 17 es 6.'
  - Como la diferencia es siempre 6, la regularidad es sumar 6 a cada término.
  - El siguiente término es 23 más 6, es decir 29.
