resumen_inicial: La regularidad numérica es la regla lógica constante o patrón algebraico
  que rige el paso entre términos consecutivos de una secuencia de números.
explicacion_simple: Descubrir la regularidad de una lista de números significa encontrar
  el patrón o truco con el que fue construida. Puede ser sumar siempre 3, multiplicar
  por 2 o elevar al cuadrado la posición.
explicacion_formal: 'La **Regularidad Numérica** identifica la diferencia o razón
  de transición entre términos $a_n$ y $a_{n+1}$:


  $$\text{Diferencia de transición: } d_n = a_{n+1} - a_n$$

  $$\text{Razón de transición: } r_n = \frac{a_{n+1}}{a_n}$$


  Si $d_n = d$ constante $\implies$ Regularidad aditiva. Si $r_n = r$ constante $\implies$
  Regularidad multiplicativa.'
definiciones_clave: '- **Regularidad numérica**: Patrón de cambio constante entre
  términos consecutivos de una lista.'
propiedades_relaciones: '- **Inducción de patrones**: Permite deducir la fórmula del
  término general $a_n$ observando diferencias o razones.'
ejemplo_guiado:
  enunciado: Descubra la regularidad y halle el término general de la lista $(5, 9,
    13, 17, 21, \dots)$.
  pasos:
  - 'Paso 1: Calcular la diferencia entre términos consecutivos: $9-5 = 4$, $13-9
    = 4$, $17-13 = 4$.'
  - 'Paso 2: La regularidad es sumar $4$ en cada paso (diferencia constante $d=4$).'
  - 'Paso 3: Armar la regla de término general: $a_n = 4n + 1$ (verificable: $a_1
    = 4(1)+1 = 5$, $a_2 = 4(2)+1 = 9$).'
  - 'Conclusión: La regularidad es $+4$ y el término general es $a_n = 4n + 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se identifica una regularidad aditiva constante en una lista de
    números?
  choices:
  - text: Verificando que la diferencia entre cada par de términos consecutivos (an+1
      - an) sea constante
    is_correct: true
  - text: Dividiendo el último término entre el primero
    is_correct: false
  - text: Sumando todos los términos de la lista
    is_correct: false
  - text: Comprobando que los números sean todos pares
    is_correct: false
  explanation: La alternativa correcta es 'Verificando que la diferencia entre cada
    par de términos consecutivos (an+1 - an) sea constante'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (5, 9, 13, 17, ...), ¿cuál fue la regularidad
    detectada?
  choices:
  - text: Sumar 4 en cada paso (diferencia constante d = 4)
    is_correct: true
  - text: Multiplicar por 2
    is_correct: false
  - text: Sumar 5
    is_correct: false
  - text: Restar 4
    is_correct: false
  explanation: La alternativa correcta es 'Sumar 4 en cada paso (diferencia constante
    d = 4)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar regularidades numéricas
  analizando diferencias o razones entre términos para deducir el término general.
semantic_id: MAT.NUM.SUCESIONES_BASE.REGULARIDAD_NUMERICA
procedimiento:
- 'Paso 1: Identificar el tipo de definición de la sucesión (término general explícito
  $a_n = f(n)$ o relación de recurrencia $a_n = g(a_{n-1})$).'
- 'Paso 2: Sustituir los índices de posición $n = 1, 2, 3, \dots$ para calcular los
  términos requeridos.'
- 'Paso 3: Verificar la consistencia de la secuencia numérica obtenida.'
errores_correccion: '- **Error 1: Sustituir $n=0$ en el término general pretendiendo
  obtener el primer término.** **Cómo corregirlo:** En el convenio escolar estándar,
  la posición del primer término empieza estrictamente en $n=1$.


  - **Error 2: Intentar calcular un término lejano en una definición recursiva sin
  conocer la condición inicial.** **Cómo corregirlo:** Una fórmula recursiva EXIGE
  conocer al menos el primer término $a_1$ para iterar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.SUCESIONES_BASE.REGULARIDAD_NUMERICA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de conceptos de sucesiones numéricas.
- titulo: Ejemplo 2
  enunciado: Verificación de la notación por subíndices.
  alternativas:
  - Cumple la notación
  - No cumple
  - Indeterminado
  respuesta: Cumple la notación
  solucion_pasos:
  - Demostración formal por $a_n = f(n)$.
- titulo: ¿Comienza la posición n del primer término en n = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, en el dominio estándar $\mathbb{N}^+$.
- titulo: ¿Altera el orden de los elementos la identidad de una sucesión?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la posición determina la asignación de cada término.
errores_frecuentes:
- Evaluar $n = 0$ para encontrar el primer término de una sucesión definida en los
  enteros positivos.
- Declarar el valor numérico del término $a_n$ con la posición ordinal $n$ en la fórmula
  general.
- Intentar una sucesión como si fuera un conjunto desordenado donde el orden de los
  elementos no importa.
- Usar una relación recursiva para calcular la posición 100 sin conocer los 99 términos
  anteriores.
- Declarar que toda secuencia gráfica responde a un crecimiento lineal simple sin
  probar la diferencia.
afirmaciones_verdaderas:
- Una sucesión numérica es una función de dominio entero positivo $\mathbb{N}^+$ a
  valores reales.
- El término general $a_n = f(n)$ permite calcular el valor de cualquier posición
  $n$ en un solo paso de evaluación.
