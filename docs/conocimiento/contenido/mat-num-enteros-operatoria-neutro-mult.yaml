semantic_id: MAT.NUM.ENTEROS_OPERATORIA.NEUTRO_MULT
resumen_inicial: "El elemento neutro de la multiplicación es el $1$: multiplicado por cualquier entero, lo deja igual."
explicacion_simple: |
  Imagina un espejo mágico: si pones un número frente a él, se refleja exactamente igual,
  sin cambiar su valor ni su signo. Ese espejo es el número $1$. Cualquier entero,
  positivo como $7$ o negativo como $-12$, al multiplicarlo por $1$ queda igual:
  $7\cdot1=7$ y $(-12)\cdot1=-12$. Por eso el $1$ es el elemento neutro de la
  multiplicación.
explicacion_formal: |
  Para todo $a \in \mathbb{Z}$: $a \cdot 1 = 1 \cdot a = a$. El $1$ es el único entero con
  esta propiedad. A diferencia de multiplicar por $-1$ (que invierte el signo), multiplicar
  por $1$ conserva tanto el valor como el signo original.
definiciones_clave: |
  **Elemento neutro multiplicativo**: el entero que, multiplicado por cualquier otro, lo
  deja sin cambios. En $\mathbb{Z}$, ese elemento es el $1$.
propiedades_relaciones: |
  El $1$ es neutro para la multiplicación, distinto del $0$ que es neutro para la
  adición. Multiplicar por $-1$ (no $1$) produce el opuesto del número.
ejemplo_guiado:
  enunciado: "Simplifica $(-37) \\cdot 1$."
  pasos:
    - "El número $-37$ está multiplicado por $1$."
    - "Por la propiedad del neutro multiplicativo, $a\\cdot1=a$."
    - "El resultado es $-37$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es el elemento neutro de la multiplicación en $\\mathbb{Z}$?"
    choices:
      - {text: "El $0$", is_correct: false}
      - {text: "El $1$", is_correct: true}
      - {text: "El $-1$", is_correct: false}
      - {text: "No existe", is_correct: false}
    explanation: "La correcta es El $1$: multiplicado por cualquier entero, lo deja sin cambios."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $1 \\cdot (-52)$?"
    choices:
      - {text: "$-52$", is_correct: true}
      - {text: "$52$", is_correct: false}
      - {text: "$0$", is_correct: false}
      - {text: "$1$", is_correct: false}
    explanation: "La correcta es $-52$: multiplicar por $1$ conserva el valor y el signo original."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identifica si en una expresión un número entero está siendo multiplicado por $1$.'
  - 'Paso 2: Aplica la propiedad del elemento neutro multiplicativo reemplazando la multiplicación $a \cdot 1$ directamente por el número original $a$.'
  - 'Paso 3: Conserva tanto el valor absoluto como el signo original del número entero.'
errores_correccion: |
  Un error frecuente es confundir el neutro multiplicativo ($1$) con el neutro aditivo
  ($0$). Otro error es creer que multiplicar un negativo por $1$ cambia su signo a
  positivo; solo multiplicar por $-1$ cambia el signo.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Simplifica la expresión $(-45) \cdot 1$ indicando la propiedad aplicada.'
    alternativas:
      - "$-45$"
      - "$45$"
      - "$0$"
    respuesta: "$-45$"
    solucion_pasos:
      - 'Paso a: Observamos que el número entero $-45$ está multiplicado por $1$.'
      - 'Paso b: Aplicamos la propiedad del elemento neutro de la multiplicación, que establece que $a \cdot 1 = a$.'
      - 'Paso c: El resultado es simplemente $-45$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve la operación $1 \cdot [(-15) + 8]$ utilizando la propiedad del elemento neutro.'
    alternativas:
      - "$-7$"
      - "$7$"
      - "$-23$"
    respuesta: "$-7$"
    solucion_pasos:
      - 'Paso a: Primero resolvemos el interior del corchete: $(-15) + 8 = -7$.'
      - 'Paso b: La expresión se reduce a $1 \cdot (-7)$.'
      - 'Paso c: Aplicando la propiedad del neutro multiplicativo ($1 \cdot a = a$), el resultado es $-7$.'
  - titulo: '¿Es el número $-1$ el elemento neutro de la multiplicación en los enteros?'
    respuesta: 'No'
    solucion_pasos:
      - 'Si multiplicamos un número entero por $-1$, por ejemplo $5 \cdot (-1) = -5$, el número cambia de signo.'
      - 'El elemento neutro debe conservar tanto el valor como el signo del número original.'
      - 'Por lo tanto, el neutro multiplicativo es el $1$ positivo, no el $-1$.'
  - titulo: '¿Se cumple la propiedad del elemento neutro multiplicativo si el número es cero?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Si multiplicamos $0 \cdot 1$, el resultado es $0$.'
      - 'Dado que se conserva el valor original ($0$), la propiedad se cumple perfectamente.'
errores_frecuentes:
  - 'Confundir el neutro de la multiplicación (1) con el neutro de la adición (0), creyendo que $a \cdot 1 = 0$ o $a + 1 = a$.'
  - 'Creer que multiplicar un número negativo por 1 cambia su signo a positivo (ej: $(-5) \cdot 1 = 5$).'
  - 'Pensar que el elemento neutro multiplicativo en Z es el $-1$.'
  - 'Asumir que la propiedad del elemento neutro no es válida para expresiones algebraicas o incógnitas (ej: $x \cdot 1 \neq x$).'
  - 'Confundir el elemento neutro con el elemento absorbente.'
afirmaciones_verdaderas:
  - "Multiplicar cualquier entero por 1 no cambia su valor."
  - "El 1 es el elemento neutro de la multiplicación."
al_terminar_debes_poder: |
  Reconocer el $1$ como elemento neutro de la multiplicación y distinguirlo claramente del
  $0$ (neutro aditivo) y del $-1$ (que invierte el signo).
fuente: "Matemática 7° Básico Tomo 1 — Enteros, p. 39"
estado: publicado
