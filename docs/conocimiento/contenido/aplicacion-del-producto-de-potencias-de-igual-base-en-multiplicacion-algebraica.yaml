semantic_id: MAT.ALG.LEYES_MULTIPLICACION.EXPONENTES_IGUAL_BASE
resumen_inicial: La aplicación del producto de potencias de igual base establece que al multiplicar expresiones algebraicas con la misma variable se conserva la base y se suman los exponentes.
explicacion_simple: "En la multiplicación algebraica, cuando multiplicas términos que tienen la **misma letra o variable**:\n- **REGLA DE LAS POTENCIAS**: **Se conserva la letra (base) y SE SUMAN SUS EXPONENTES**.\n- **Fórmula**: $x^m \\cdot x^n = x^{m + n}$.\n- **Ejemplos**:\n  - $x^3 \\cdot x^4 = x^{3 + 4} = \\mathbf{x^7}$.\n  - $a^5 \\cdot a = a^5 \\cdot a^1 = a^{5 + 1} = \\mathbf{a^6}$ (recordar que la letra sola tiene exponente $1$).\n  - $y^2 \\cdot y^3 \\cdot y^4 = y^{2 + 3 + 4} = \\mathbf{y^9}$.\n- **Diferencia clave con la suma**: En la multiplicación los exponentes **SÍ SE SUMAN**, mientras que en la suma de términos semejantes los exponentes no se cambian.\n\n![Producto de Potencias de Igual Base](/static/img/nodos/aplicacion-del-producto-de-potencias-de-igual-base-en-multiplicacion-algebraica-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $\mathbb{R}[x]$ el anillo de polinomios y $x \in \mathbb{R}$ una variable no nula. Para todo par de exponentes enteros $m, n \in \mathbb{N}_0$, el operador multiplicación entre monomios de base común satisface el **teorema del producto de potencias de igual base**:


  $$x^m \cdot x^n = \underbrace{(x \cdot x \cdots x)}_{m \text{ veces}} \cdot \underbrace{(x \cdot x \cdots x)}_{n \text{ veces}} = \underbrace{(x \cdot x \cdots x)}_{m+n \text{ veces}} = x^{m+n}$$


  ### Generalización a Múltiples Exponentes

  Para una secuencia de $k$ factores con la misma base $x$:


  $$\prod_{i=1}^k x^{a_i} = x^{\sum_{i=1}^k a_i}$$


  ### Extensión a Exponentes Cero y Negativos ($\mathbb{Z}$)

  Toda variable de exponente unitario $x^1 = x$ y exponente cero $x^0 = 1$ (para $x \neq 0$) mantiene la validez de la ley de adición de exponentes en el cuerpo de cocientes: $x^m \cdot x^{-m} = x^{m - m} = x^0 = 1$.


  ### Síntesis didáctica

  Sumar los exponentes al multiplicar potencias de igual base es la propiedad fundamental para el desarrollo de productos entre monomios y polinomios.

  '
definiciones_clave: '- **Producto de potencias de igual base**: Propiedad $x^m \cdot x^n = x^{m+n}$ por la cual la adición de los exponentes determina la nueva potencia.

  - **Exponente implícito unitario ($x = x^1$)**: Exponente 1 asignado a toda variable escrita sin potencia explícita.

  - **Base invariante**: Preservación de la letra o símbolo variable durante el proceso de multiplicación de exponentes.

  '
propiedades_relaciones: '- **Invarianza de variables distintas**: $x^m \cdot y^n$ no se simplifica adicionando exponentes por pertenecer a bases distintas ($x^m y^n$).

  - **Distribución de producto sobre bases distintas**: $(x \cdot y)^n = x^n \cdot y^n$.

  '
ejemplo_guiado:
  enunciado: Multiplica los monomios $(3x^4 y^2) \cdot (-5x^3 y^5) \cdot (2x y)$.
  pasos:
  - 'Paso 1: Multiplicamos los coeficientes numéricos respetando la ley de los signos: $(3) \cdot (-5) \cdot (2) = -30$.'
  - 'Paso 2: Aplicamos la regla para la variable $x$: Exponente en primer factor: $4$. Exponente en segundo factor: $3$. Exponente en tercer factor: $1$ (implícito). Suma de exponentes de $x$: $4 + 3 + 1 = 8 \implies x^8$.'
  - 'Paso 3: Aplicamos la regla para la variable $y$: Exponente en primer factor: $2$. Exponente en segundo factor: $5$. Exponente en tercer factor: $1$ (implícito). Suma de exponentes de $y$: $2 + 5 + 1 = 8 \implies y^8$.'
  - 'Paso 4: Consolidamos el monomio producto final: $-30x^8 y^8$.'
  - 'Conclusión: El producto de los monomios es **$-30x^8 y^8$**.'
  imagen: /static/img/nodos/aplicacion-del-producto-de-potencias-de-igual-base-en-multiplicacion-algebraica-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué operación se debe realizar entre los exponentes al multiplicar dos potencias de igual base como $a^m \cdot a^n$?
  choices:
  - text: Se conserva la base común y se suman sus exponentes ($a^{m+n}$)
    is_correct: true
  - text: Se multiplican los exponentes entre sí ($a^{m \cdot n}$)
    is_correct: false
  - text: Se restan los exponentes ($a^{m-n}$)
    is_correct: false
  - text: Se dividen los exponentes ($a^{m/n}$)
    is_correct: false
  explanation: La alternativa correcta es 'Se conserva la base común y se suman sus exponentes ($a^{m+n}$)'. Regla de potencias de igual base.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de multiplicar $x^5 \cdot x$?
  choices:
  - text: El resultado es $x^6$, recordando que $x = x^1$ y sumando $5 + 1 = 6$
    is_correct: true
  - text: El resultado es $x^5$
    is_correct: false
  - text: El resultado es $x^{10}$
    is_correct: false
  - text: El resultado es $5x$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $x^6$, recordando que $x = x^1$ y sumando $5 + 1 = 6$'. Exponente implícito 1 $\implies 5+1=6$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las variables que son comunes a los factores multiplicandos.'
- 'Paso 2: Recordar que cualquier variable escrita sin exponente posee exponente 1.'
- 'Paso 3: Escribir cada variable común una sola vez elevándola a la suma de sus exponentes.'
- 'Paso 4: Escribir las variables no comunes intactas acompañando al coeficiente numérico.'
errores_correccion: '- **Error 1:** Multiplicar los exponentes en lugar de sumarlos (escribir $x^3 \cdot x^4 = x^{12}$). **Cómo corregirlo:** Al multiplicar potencias de igual base **LOS EXPONENTES SE SUMAN ($3 + 4 = 7 \implies x^7$)**.

  - **Error 2:** Excluir el exponente 1 de una variable solitaria (escribir $a^4 \cdot a = a^4$). **Cómo corregirlo:** Una letra sin exponente **TIENE EXPONENTE 1 ($a^4 \cdot a^1 = a^{4+1} = a^5$)**.

  '
ejemplos:
- titulo: Dos potencias simples
  enunciado: ¿Cuál es el producto de $y^6 \cdot y^2$?
  alternativas:
  - $y^8$
  - $y^{12}$
  - $y^4$
  respuesta: $y^8$
  solucion_pasos:
  - '1. Suma de exponentes: $6 + 2 = 8$.'
  - '2. Resultado: $y^8$.'
- titulo: Exponente unitario
  enunciado: ¿Cuál es el producto de $m^3 \cdot m \cdot m^2$?
  alternativas:
  - $m^6$
  - $m^5$
  - $m^7$
  respuesta: $m^6$
  solucion_pasos:
  - '1. Exponentes: $3 + 1 + 2 = 6$.'
  - '2. Resultado: $m^6$.'
- titulo: Bases distintas independientes
  enunciado: En el producto $x^2 \cdot y^3$, ¿se conservan las variables separadas como $x^2 y^3$ sin sumar exponentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, por pertenecer a bases distintas no se suman los exponentes.
- titulo: Exponente cero en multiplicación
  enunciado: Para $x^4 \cdot x^0$, ¿se obtiene $x^4$ ya que $4 + 0 = 4$ y $x^0 = 1$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $x^4 \cdot 1 = x^4$.
errores_frecuentes:
- Multiplicar los exponentes entre sí en lugar de sumarlos al multiplicar potencias de igual base.
- Las variables sin número explícito no son consideradas con su exponente unitario.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Sumar los exponentes de variables distintas como x^2 \cdot y^3 = xy^5.
- Multiplicar la base por el exponente al resolver la parte literal.
afirmaciones_verdaderas:
- Al multiplicar potencias de igual base se mantiene la base común y se suman sus exponentes.
- Las letras escritas sin exponente tienen un exponente implícito igual a 1.
al_terminar_debes_poder: '![Resumen de producto de potencias de igual base](/static/img/nodos/aplicacion-del-producto-de-potencias-de-igual-base-en-multiplicacion-algebraica-resumen.svg)


  QUÉ: Multiplicar variables idénticas elevadas a exponentes enteros en una expresión algebraica.


  CÓMO: Mantener constante la base literal y sumar algebraicamente los exponentes de todos los factores $a^m \cdot a^n = a^{m+n}$, recordando que $a \equiv a^1$.'
