resumen_inicial: El producto de potencias de igual base es igual a la base conservada
  elevada a la suma de sus exponentes.
explicacion_simple: 'Cuando multiplicamos letras iguales con exponentes (como $x^3
  \cdot x^4$), mantenemos la letra $x$ y SUMAMOS los exponentes: $3 + 4 = 7$, obteniendo
  $x^7$. Si la letra no lleva exponente escrito, su exponente es $1$.'
explicacion_formal: 'Para cualquier base $a \in \mathbb{R}$ y exponentes $m, n \in
  \mathbb{R}$ (o $\mathbb{Z}$), el **Producto de Potencias de Igual Base** establece:


  $$a^m \cdot a^n = a^{m+n}$$


  $$\prod_{k=1}^p a^{e_k} = a^{\sum_{k=1}^p e_k}$$


  > **Complemento didáctico:** La ley transforma la multiplicación de potencias de
  igual base en la adición de sus exponentes en el dominio exponente.'
definiciones_clave: '- **Producto de potencias de igual base**: Regla $a^m \cdot a^n
  = a^{m+n}$.

  - **Exponente implícito**: Una variable sin exponente escrito posee exponente $1$
  ($x = x^1$).'
propiedades_relaciones: '- **Generalización**: $x^a \cdot x^b \cdot x^c = x^{a+b+c}$.'
ejemplo_guiado:
  enunciado: Multiplique los términos $x^5 \cdot x^3 \cdot x$.
  pasos:
  - 'Paso 1: Identificar la base común: $x$.

    - Paso 2: Identificar los exponentes: $5$, $3$ y el implícito $1$ en la última
    $x$.'
  - 'Paso 3: Sumar los exponentes: $5 + 3 + 1 = 9$.'
  - 'Conclusión: El producto es $x^9$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué se debe hacer con los exponentes al multiplicar potencias que tienen
    la misma base?
  choices:
  - text: Conservar la base y sumar los exponentes (a^m · a^n = a^(m+n))
    is_correct: true
  - text: Multiplicar los exponentes entre sí
    is_correct: false
  - text: Restar el menor exponente del mayor
    is_correct: false
  - text: Elevar la base al cuadrado sin cambiar los exponentes
    is_correct: false
  explanation: La alternativa correcta es 'Conservar la base y sumar los exponentes
    (a^m · a^n = a^(m+n))'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para x^5 · x^3 · x, ¿cuál fue el exponente final
    de x?
  choices:
  - text: '9'
    is_correct: true
  - text: '8'
    is_correct: false
  - text: '15'
    is_correct: false
  - text: '531'
    is_correct: false
  explanation: La alternativa correcta es '9'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base común.'
- 'Paso 2: Recordar que la variable sin exponente escrito tiene exponente $1$.'
- 'Paso 3: Sumar los exponentes y conservar la base.'
errores_correccion: '- **Error 1: Multiplicar los exponentes al multiplicar potencias
  de igual base (decir $x^3 \cdot x^4 = x^{12}$).** **Cómo corregirlo:** Los exponentes
  se SUMAN ($3 + 4 = 7 \implies x^7$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule a^4 · a^6.
  alternativas:
  - a^10
  - a^24
  - a^2
  - 2a^10
  respuesta: a^10
  solucion_pasos:
  - 1. Base común a.
  - '2. Sumar exponentes: 4 + 6 = 10.'
  - '3. Resultado: a^10.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de y^2 · y^5 · y^3?
  alternativas:
  - y^10
  - y^30
  - 3y^10
  - y^7
  respuesta: y^10
  solucion_pasos:
  - '1. Base y. Suma de exponentes: 2 + 5 + 3 = 10.'
  - '2. Resultado: y^10.'
- titulo: ¿Es m · m^4 equivalente a m^5?
  respuesta: Sí
  solucion_pasos:
  - Sí, m^1 · m^4 = m^(1+4) = m^5.
- titulo: ¿Da el producto de x^3 · x^2 un resultado igual a x^6?
  respuesta: 'No'
  solucion_pasos:
  - No, 3 + 2 = 5, por lo que el resultado correcto es x^5.
errores_frecuentes:
- Multiplicar los exponentes en lugar de sumarlos al multiplicar potencias de igual
  base.
- Omitir el exponente 1 de una variable sin exponente escrito al sumar los exponentes.
- Multiplicar las bases entre sí (decir $x^2 \cdot x^3 = x^6$ o $(2x)^5$).
- Sumar las bases reteniendo un único exponente.
- Declarar que la regla aplica para bases distintas sin convertirlas previamente.
afirmaciones_verdaderas:
- Al multiplicar potencias de igual base se mantiene la base y se suman los exponentes.
- Una variable sin exponente explícito posee exponente igual a 1.
al_terminar_debes_poder: Al terminar serás capaz de multiplicar potencias de igual
  base aplicando la adición de sus exponentes.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Multiplicación.
estado: publicado
