semantic_id: MAT.ALG.LEYES_MULTIPLICACION.EXPONENTES_IGUAL_BASE
resumen_inicial: 'Aplicación del producto de potencias de igual base en multiplicación
  algebraica: leyes, procedimiento y aplicación en Leyes fundamentales de la multiplicación
  algebraica.'
explicacion_simple: '¿Cuánto es $x^2 \cdot x^3$? Podemos pensar: $x^2 = x \cdot x$
  y $x^3 = x \cdot x \cdot x$. Juntándolos: $x \cdot x \cdot x \cdot x \cdot x = x^5$.
  Los exponentes se suman.'
explicacion_formal: '### Definición formal


  Regla: $a^m \cdot a^n = a^{m+n}$. Base idéntica → sumar exponentes.


  ### Desarrollo didáctico


  Regla formal: $a^m \cdot a^n = a^{m+n}$.


  Ejemplos:

  - $x^3 \cdot x^4 = x^{3+4} = x^7$.

  - $y^2 \cdot y = y^{2+1} = y^3$ (el exponente 1 es implícito).

  - $a^5 \cdot a^0 = a^{5+0} = a^5$ (cualquier base elevada a cero es 1).


  Importante: Esta regla solo aplica cuando las bases son idénticas. $x^3 \cdot y^4$
  NO se simplifica sumando exponentes porque las bases ($x$ e $y$) son distintas.'
definiciones_clave: '- **Aplicación del producto de potencias de igual base en multiplicación
