semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.IDENTIFICACION_RESTRICCION
resumen_inicial: 'Identificación de una restricción en un problema contextual: relaciones
  de orden, intervalos y resolución en Modelamiento con desigualdades.'
explicacion_simple: En muchos problemas reales no se busca una cantidad exacta, sino
  respetar un límite. Ese límite puede venir dado por presupuesto, capacidad, tiempo,
  temperatura o seguridad.
explicacion_formal: '### Definición formal

  Una restricción contextual es una condición que reduce el conjunto de valores admisibles
  de una variable o de una expresión algebraica. Si $f(x)$ modela una magnitud del
  problema, una restricción se representa como una desigualdad del tipo


  $$f(x) < c,\qquad f(x) \le c,\qquad f(x) > c \qquad \text{o} \qquad f(x) \ge c,$$


  según el significado verbal del enunciado. Identificar la restricción consiste en
  determinar cuál es la magnitud controlada, qué cota la limita y qué símbolo de desigualdad
  expresa correctamente esa condición.


  ### Desarrollo didáctico

  Frases como “a lo más”, “no supera”, “al menos” o “debe exceder” no son adornos:
  indican exactamente el tipo de límite que el problema impone. Antes de operar, conviene
  preguntar qué cantidad está siendo comparada con un máximo o con un mínimo. Si se
  reconoce esa relación, ya se dispone del núcleo matemático del problema.'
definiciones_clave: '- **Identificación de una restricción en un problema contextual**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a identificación de una restricción en
  un problema contextual.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de identificación
    de una restricción en un problema contextual.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de identificación de una restricción en un
    problema contextual, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
