semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.IDENTIFICACION_RESTRICCION
resumen_inicial: Identificar una restricción consiste en traducir limitaciones del mundo real (presupuestos, capacidades, tiempos) a desigualdades algebraicas.
explicacion_simple: '![Identificación de una restricción en un problema contextual](/static/img/nodos/identificacion-de-una-restriccion-en-un-problema-contextual-intro.svg)


  En los problemas reales existen límites inflexibles: "tengo un presupuesto máximo de $\$50.000$", "el ascensor soporta como máximo $500\text{ kg}$", "se necesitan al menos $10$ personas".


  Identificar la restricción consiste en reconocer estas palabras clave ("máximo", "mínimo", "no superar", "al menos") y seleccionar el símbolo de orden adecuado ($<, >, \le, \ge$).'
explicacion_formal: 'Sea una magnitud física o económica variable $M(x)$ modelada en función de $x$. Una **restricción contextual** impone la condición de acotamiento:


  $$M(x) \le K \quad \text{ó} \quad M(x) \ge K$$


  **Desglose de la fórmula:**

  - $K$: Cota fija límite impuesta por el contexto (presupuesto, capacidad de peso, tiempo límite).

  - $M(x)$: Expresión del costo o consumo de recursos en función de las unidades $x$.

  '
definiciones_clave: '- **Restricción contextual**: Límite cuantitativo impuesto por el entorno real que restringe los valores permitidos de una variable.

  - **Cota límite ($K$)**: Valor frontera que no puede superarse (en $\le$) o que debe alcanzarse como mínimo (en $\ge$).

  '
propiedades_relaciones: '- **Traducción del vocabulario**: "Como máximo" / "No más de" $\implies \le$. "Como mínimo" / "Al menos" $\implies \ge$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Identificación de una restricción en un problema contextual](/static/img/nodos/identificacion-de-una-restriccion-en-un-problema-contextual-ejemplos.svg)


    Un furgón de reparto transporta cajas de $15\text{ kg}$ cada una. Si el conductor pesa $80\text{ kg}$ y la carga máxima permitida del vehículo es $500\text{ kg}$, plantea la restricción para el número de cajas $x$.'
  pasos:
  - 'Paso 1: Definir la variable: sea $x = \text{cantidad de cajas a transportar}$.'
  - 'Paso 2: Expresar la masa total en función de $x$: $15x + 80$.'
  - 'Paso 3: Identificar la palabra clave: "máxima permitida $500\text{ kg}$" $\implies \le 500$.'
  - 'Paso 4: Escribir la desigualdad de restricción: $15x + 80 \le 500$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la inecuación de restricción para cargar $x$ cajas de $15\text{ kg}$ con un conductor de $80\text{ kg}$ si el peso máximo es $500\text{ kg}$?
  choices:
  - text: $15x + 80 \le 500$
    is_correct: true
  - text: $15x + 80 \ge 500$
    is_correct: false
  - text: $15x < 500$
    is_correct: false
  - text: $15x + 80 = 500$
    is_correct: false
  explanation: La alternativa correcta es '$15x + 80 \le 500$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el enunciado exige que el número de unidades producidas sea "al menos 50", ¿qué símbolo de orden se debe utilizar?
  choices:
  - text: $\ge$ (mayor o igual que)
    is_correct: true
  - text: $\le$ (menor o igual que)
    is_correct: false
  - text: $<$ (estrictamente menor)
    is_correct: false
  - text: $=$ (igual estricto)
    is_correct: false
  explanation: La alternativa correcta es '$\ge$ (mayor o igual que)'. "Al menos 50" permite tener 50 o más unidades.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asignar una variable a la incógnita del problema.'
- 'Paso 2: Identificar las constantes de consumo unitario y costos fijos.'
- 'Paso 3: Localizar en el texto las palabras clave de cota ("al menos", "como máximo").'
- 'Paso 4: Formular la inecuación de restricción.'
errores_correccion: '- **Error común:** Usar el signo igual ($=$) en lugar de una desigualdad al modelar restricciones de presupuesto máximo.

  - **Cómo corregirlo:** Si es un presupuesto "máximo", no estás obligado a gastarlo todo exactamente; se permite gastar menos ($\le$).

  '
ejemplos:
- titulo: 'Ejemplo 1: Presupuesto máximo'
  enunciado: Un estudiante tiene un presupuesto de $\$50.000\text{ pesos}$ para compras. ¿Cómo se modela esta restricción sobre el gasto total $G$?
  alternativas:
  - $G \leq \$50.000\text{ pesos}$
  - $G \geq \$50.000\text{ pesos}$
  - $G > \$50.000\text{ pesos}$
  - $G = \$50.000\text{ pesos}$
  respuesta: $G \leq \$50.000\text{ pesos}$
  solucion_pasos:
  - 'Paso 1: El presupuesto representa un techo que no se puede sobrepasar.'
  - 'Paso 2: La restricción es $G \le \$50.000\text{ pesos}$.'
- titulo: 'Ejemplo 2: Aforo de seguridad'
  enunciado: Un salón de eventos tiene una capacidad máxima autorizada de $120$ personas. Si asisten $p$ personas, ¿cuál es la inecuación?
  alternativas:
  - $p \leq 120$
  - $p \geq 120$
  - $p < 120$
  - $p > 120$
  respuesta: $p \leq 120$
  solucion_pasos:
  - 'Paso 1: «Capacidad máxima» significa que pueden entrar hasta $120$ personas.'
  - 'Paso 2: $p \le 120$.'
- titulo: 'Ejemplo 3: Meta mínima de ventas'
  enunciado: Un comerciante debe vender al menos $40$ unidades para no incurrir en pérdidas. ¿Cómo se expresa esta meta?
  alternativas:
  - $x \geq 40$
  - $x \leq 40$
  - $x > 40$
  - $x < 40$
  respuesta: $x \geq 40$
  solucion_pasos:
  - 'Paso 1: «Al menos» indica un piso mínimo requerido.'
  - 'Paso 2: $x \ge 40$.'
- titulo: 'Ejemplo 4: Límite estricto'
  enunciado: Una carga debe ser estrictamente menor que $500\text{ kg}$ para ser admitida en el ascensor de servicio. ¿Cuál es el modelo?
  alternativas:
  - $c < 500\text{ kg}$
  - $c \leq 500\text{ kg}$
  - $c > 500\text{ kg}$
  - $c \geq 500\text{ kg}$
  respuesta: $c < 500\text{ kg}$
  solucion_pasos:
  - 'Paso 1: La condición es «estrictamente menor».'
  - 'Paso 2: $c < 500\text{ kg}$.'
errores_frecuentes:
- En un problema de presupuesto máximo de $\$50.000$, la restricción matemática se traduce como el operador estricto $C(x) > 50000$.
- La frase "a lo menos 15 unidades" se modela mediante la desigualdad no estricta $x \le 15$.
- Las restricciones de capacidad máxima en transporte aceptan valores de carga ilimitados $+\infty$.
- Identificar una restricción exige resolver la inecuación antes de definir las variables de entrada.
- La restricción "como máximo 80 kg" se expresa algebraicamente mediante $x \ge 80$.
afirmaciones_verdaderas:
- Identificar una restricción consiste en traducir las expresiones verbales de límite ("a lo sumo", "no más de", "al menos") a desigualdades algebraicas ($<, >, \le, \ge$).
- Expresiones verbales como "como máximo" o "no excede" corresponden a desigualdades del tipo $\le$.
al_terminar_debes_poder: '**QUÉ:** Identificar y formular las restricciones cuantitativas en situaciones de la vida real.


  **CÓMO:** Distinguiendo entre condiciones de cota superior máxima ($\le$) como presupuestos o aforos, y metas mínimas requeridas ($\ge$) como ganancias o puntajes de corte.


  ![Resumen Identificación de una restricción en un problema contextual](/static/img/nodos/identificacion-de-una-restriccion-en-un-problema-contextual-resumen.svg)'
