semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES.IDENTIFICACION_RESTRICCION
resumen_inicial: Identificar una restricción consiste en traducir limitaciones del
  mundo real (presupuestos, capacidades, tiempos) a desigualdades algebraicas.
explicacion_simple: 'En los problemas reales existen límites inflexibles: ''tengo
  un presupuesto máximo de $\$50.000$'', ''el ascensor soporta como máximo $500\text{
  kg}$'', ''se necesitan al menos $10$ personas''.

  Identificar la restricción consiste en reconocer estas palabras clave (''máximo'',
  ''mínimo'', ''no superar'', ''al menos'') y seleccionar el símbolo de orden adecuado
  ($<, >, \le, \ge$).'
explicacion_formal: 'Sea una magnitud física o económica variable $M(x)$ modelada
  en función de $x$. Una **restricción contextual** impone la condición de acotamiento:


  $$M(x) \le K \quad \text{ó} \quad M(x) \ge K$$


  **Desglose de la fórmula:**

  - $K$: Cota fija límite impuesta por el contexto (presupuesto, capacidad de peso,
  tiempo límite).

  - $M(x)$: Expresión del costo o consumo de recursos en función de las unidades $x$.'
definiciones_clave: '- **Restricción contextual**: Límite cuantitativo impuesto por
  el entorno real que restringe los valores permitidos de una variable.

  - **Cota límite ($K$)**: Valor frontera que no puede superarse (en $\le$) o que
  debe alcanzarse como mínimo (en $\ge$).'
propiedades_relaciones: '- **Traducción del vocabulario**: ''Como máximo'' / ''No
  más de'' $\implies \le$. ''Como mínimo'' / ''Al menos'' $\implies \ge$.'
ejemplo_guiado:
  enunciado: Un furgón de reparto transporta cajas de $15\text{ kg}$ cada una. Si
    el conductor pesa $80\text{ kg}$ y la carga máxima permitida del vehículo es $500\text{
    kg}$, plantea la restricción para el número de cajas $x$.
  pasos:
  - 'Paso 1: Definir la variable: sea $x = \text{cantidad de cajas a transportar}$.Paso
    2: Expresar la masa total en función de $x$: $15x + 80$.Paso 3: Identificar la
    palabra clave: ''máxima permitida $500\text{ kg}$'' $\implies \le 500$.Paso 4:
    Escribir la desigualdad de restricción: $15x + 80 \le 500$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la inecuación de restricción para cargar $x$ cajas de $15\text{
    kg}$ con un conductor de $80\text{ kg}$ si el peso máximo es $500\text{ kg}$?
  choices:
  - text: $15x + 80 \le 500$
    is_correct: true
  - text: $15x + 80 \ge 500$
    is_correct: false
  - text: $15x < 500$
    is_correct: false
  - text: $15x + 80 = 500$
    is_correct: false
  explanation: La alternativa correcta es '$15x + 80 \le 500$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el enunciado exige que el número de unidades producidas sea 'al menos
    50', ¿qué símbolo de orden se debe utilizar?
  choices:
  - text: $\ge$ (mayor o igual que)
    is_correct: true
  - text: \le$ (menor o igual que)
    is_correct: false
  - text: $<$ (estrictamente menor)
    is_correct: false
  - text: $=$ (igual estricto)
    is_correct: false
  explanation: La alternativa correcta es '$\ge$ (mayor o igual que)'. 'Al menos 50'
    permite tener 50 o más unidades.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asignar una variable a la incógnita del problema.'
- 'Paso 2: Identificar las constantes de consumo unitario y costos fijos.'
- 'Paso 3: Localizar en el texto las palabras clave de cota (''al menos'', ''como
  máximo'').'
- 'Paso 4: Formular la inecuación de restricción.'
errores_correccion: '- **Error común:** Usar el signo igual ($=$) en lugar de una
  desigualdad al modelar restricciones de presupuesto máximo.

  - **Cómo corregirlo:** Si es un presupuesto ''máximo'', no estás obligado a gastarlo
  todo exactamente; se permite gastar menos ($ \le $).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de modelamiento con desigualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de modelamiento.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Frases como 'como máximo' se traducen con la desigualdad no estricta \\le?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'como máximo' fija un límite superior inclusivo ($\\le$).
- titulo: ¿Es necesario descartar soluciones negativas al modelar magnitudes físicas
    reales como masa o personas?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque el dominio físico impone restricciones de no negatividad ($x \\ge 0$).
errores_frecuentes:
- Usar el signo igual (=) en lugar de una desigualdad al modelar restricciones contextuales
  de límites máximos o mínimos.
- Sumar directamente porcentajes de concentración o aleación en lugar de calcular
  las masas de componente puro.
- Olvidar que la masa o volumen agregado afecta tanto al numerador (fino) como al
  denominador (total) de la mezcla.
- Redondear soluciones discretas en la dirección contraria a la exigida por la inecuación
  de restricción.
- Aceptar soluciones matemáticas negativas en problemas que involucran variables físicas
  reales como tiempo, masa o personas.
afirmaciones_verdaderas:
- Al modelar restricciones de presupuesto o capacidad máxima se deben emplear desigualdades
  del tipo $M(x) \le K$.
- El conjunto solución matemáticamente obtenido debe filtrarse con el dominio físico
  real descartando valores negativos o incompatibles.
al_terminar_debes_poder: Al finalizar este recurso podrás modelar problemas contextuales
  mediante inecuaciones, interpretando y descartando soluciones según la realidad
  física.
