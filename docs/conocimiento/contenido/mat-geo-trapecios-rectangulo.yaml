semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.TRAPECIO_RECTANGULO
resumen_inicial: 'Definición de trapecio rectángulo: conceptos, teoremas, propiedades
  geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Otro caso particular importante de trapecio se caracteriza por
  tener uno de sus lados laterales formando ángulos rectos con las bases.
explicacion_formal: '![Trapecio rectángulo: un lado lateral perpendicular a las bases](/static/img/geometria/poligonos-cuadrilateros/trapecios-rectangulo.svg)


  ### Definición formal


  Un trapecio $ABCD$ con $AB\parallel CD$ es rectángulo si uno de sus lados laterales
  (por ejemplo, $AD$) es perpendicular a ambas bases, generando dos ángulos rectos
  en los vértices $A$ y $D$.


  ### Desarrollo didáctico


  En un trapecio rectángulo, el lado lateral perpendicular actúa directamente como
  la altura del trapecio, simplificando el cálculo del área, ya que no es necesario
  trazar una altura adicional.'
