procedimiento:
- 'Paso 1: Identifica cuántos términos sumarás ($n$).'
- 'Paso 2: Identifica el primer término ($a_1$).'
- 'Paso 3: Identifica (o calcula usando la fórmula del término general) el último término
  que sumarás ($a_n$).'
- 'Paso 4: Suma el primero con el último, multiplica por ''$n$'', y finalmente divide por
  2.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en cálculo de la suma de los n primeros términos de una progresión aritmética.
ejemplos:
- titulo: Sumando la quincena
  enunciado: Ahorras $10 el día 1, $20 el día 2, $30 el día 3, y así sucesivamente durante
    15 días. ¿Cuánto dinero ahorraste en total?
  solucion_pasos:
  - Es una P.A. donde a1=10, d=10. Necesito sumar 15 días (n=15).
  - El último día (día 15) ahorro a15 = 10 + (14)*10 = 150.
  - 'Fórmula suma: S15 = (15 / 2) * (10 + 150)'
  - S15 = 7.5 * 160 = 1.200.
  - Ahorraste $1.200 en total.
- titulo: Ejemplo 1
  enunciado: Si a_1 es 5, a_9 es 45 y n es 9, ¿cuál es la suma de esos 9 términos?
  alternativas:
  - '225'
  - '250'
  - '200'
  respuesta: '225'
  solucion_pasos:
  - (9 dividido entre 2) por (5 más 45) es igual a 4.5 por 50, o sea 225.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la suma de los primeros 4 términos de la progresión 2, 4, 6, 8?
  alternativas:
  - '20'
  - '16'
  - '24'
  respuesta: '20'
  solucion_pasos:
  - (4 dividido entre 2) por (2 más 8) es igual a 2 por 10, o sea 20.
- titulo: ¿La fórmula de la suma requiere conocer el último término que se está sumando?
  respuesta: Sí
  solucion_pasos:
  - Es una de las tres variables de la fórmula, junto al primer término y la cantidad n.
- titulo: ¿S_n representa el valor de un solo término de la progresión?
  respuesta: 'No'
  solucion_pasos:
  - S_n es la suma acumulada de todos los primeros n términos, no el valor de uno solo.
errores_frecuentes:
- Confundir el valor del último término ($a_n$) con la suma total ($S_n$). (El último término
  es cuánto vale la casilla 15, la suma es el total acumulado en las 15 casillas).
- No tener el dato del último término y olvidar que primero hay que calcularlo con la fórmula
  $a_n = a_1 + (n-1)d$.
- Usar la fórmula de la suma sin haber calculado antes el último término a_n.
- Olvidar dividir por 2 en la fórmula de la suma.
- Confundir la cantidad de términos n con el valor del último término.
afirmaciones_verdaderas:
- La formulación de cálculo de la suma de los n primeros términos de una progresión aritmética
  mantiene la regularidad de la sucesión.
- Para calcular la suma de los primeros n términos se necesita conocer el primer término,
  el último término y la cantidad de términos.
