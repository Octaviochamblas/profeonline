resumen_inicial: 'La suma de los $n$ primeros términos de una progresión aritmética
  $S_n$ equivale al producto del número de términos por el promedio entre el primero
  y el último: $S_n = \frac{n \cdot (a_1 + a_n)}{2} = \frac{n}{2} \cdot [2a_1 + (n
  - 1)d]$.'
explicacion_simple: Para sumar todos los números de una progresión aritmética desde
  el primero hasta el lugar $n$ (como sumar los números del 1 al 100 de Gauss), sumamos
  el primer número con el último, multiplicamos por la cantidad de números y dividimos
  entre 2.
explicacion_formal: 'La **Suma de Gauss de $n$ Términos de una P.A. $S_n$** se define
  por la fórmula del promedio equidistante:


  $$S_n = \sum_{k=1}^n a_k = \frac{n \cdot (a_1 + a_n)}{2}$$


  $$\text{Sustituyendo } a_n = a_1 + (n-1)d: \quad S_n = \frac{n}{2} \cdot \left[
  2a_1 + (n - 1)d \right]$$'
definiciones_clave: '- **Suma finita $S_n$**: Suma $S_n = \frac{n(a_1 + a_n)}{2}$
  de los $n$ primeros términos.'
propiedades_relaciones: '- **Propiedad de pares equidistantes**: La suma de términos
  simétricos $a_k + a_{n-k+1}$ es siempre constante e igual a $a_1 + a_n$.'
ejemplo_guiado:
  enunciado: 'Calcule la suma de los primeros $50$ números naturales impares positivos:
    $(1, 3, 5, \dots, a_{50})$.'
  pasos:
  - 'Paso 1: Identificar $a_1 = 1$, $d = 2$ y $n = 50$.'
  - 'Paso 2: Calcular el último término $a_{50} = 1 + (50 - 1) \cdot 2 = 1 + 98 =
    99$.'
  - 'Paso 3: Aplicar la fórmula de la suma $S_{50} = \frac{50 \cdot (1 + 99)}{2} =
    25 \cdot 100 = 2.500$.'
  - 'Conclusión: La suma de los primeros $50$ impares es $2.500$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula para sumar los n primeros términos Sn de una progresión
    aritmética?
  choices:
  - text: Sn = (n · (a1 + an)) / 2
    is_correct: true
  - text: Sn = n · a1 · an
    is_correct: false
  - text: Sn = (a1 + an) / n
    is_correct: false
  - text: Sn = a1 + (n - 1)d
    is_correct: false
  explanation: La alternativa correcta es 'Sn = (n · (a1 + an)) / 2'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para sumar los primeros 50 números impares, ¿cuál
    fue el resultado Sn?
  choices:
  - text: '2.500'
    is_correct: true
  - text: '5.000'
    is_correct: false
  - text: '1.250'
    is_correct: false
  - text: '2.450'
    is_correct: false
  explanation: La alternativa correcta es '2.500'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la suma finita $S_n =
  \frac{n(a_1 + a_n)}{2}$ de los $n$ primeros términos de una P.A.
semantic_id: MAT.NUM.PROG_ARITMETICA.SUMA_FINITA
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una diferencia aditiva constante $d
  = a_{n+1} - a_n$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 + (n - 1)d$ o de la suma
  $S_n = \frac{n(a_1 + a_n)}{2}$.'
- 'Paso 3: Resolver numéricamente el parámetro solicitado ($a_n, a_1, d, n$ o $S_n$).'
errores_correccion: '- **Error 1: Multiplicar la diferencia por $n$ en lugar de $(n-1)$
  en la fórmula del término general ($a_n = a_1 + n \cdot d$).** **Cómo corregirlo:**
  La diferencia $d$ se aplica a partir de la segunda posición, por lo que se multiplica
  por $(n-1)$.


  - **Error 2: Restar los términos en orden inverso al hallar la diferencia ($d =
  a_n - a_{n+1}$).** **Cómo corregirlo:** La diferencia DEBE calcularse restando el
  término posterior menos el anterior ($a_{n+1} - a_n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_ARITMETICA.SUMA_FINITA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión aritmética.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} - a_n = d$.
- titulo: ¿Es constante la diferencia entre términos consecutivos en una P.A.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión aritmética.
- titulo: ¿Equivale la suma Sn al promedio de extremos multiplicado por el número
    de términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $S_n = \frac{n(a_1 + a_n)}{2}$.
errores_frecuentes:
- Multiplicar la diferencia común d por n en lugar de multiplicar por (n - 1) al calcular
  an.
- Restar el término posterior del término anterior al calcular el valor de la diferencia
  d.
- Sumar directamente los términos de los extremos sin dividir entre dos al calcular
  Sn.
- Declarar que una progresión con diferencia negativa es siempre invalida para el
  cálculo de índices.
- Declarar la posición ordinal n con el valor numérico del término an en la ecuación.
afirmaciones_verdaderas:
- Una progresión aritmética tiene una diferencia constante $d = a_{n+1} - a_n$ entre
  términos consecutivos.
- El término de cualquier posición $n$ se calcula mediante $a_n = a_1 + (n - 1) \cdot
  d$.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / PAES.
