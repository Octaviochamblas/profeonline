semantic_id: MAT.NUM.PROG_ARITMETICA.SUMA_FINITA
resumen_inicial: 'El cálculo de la suma de los $n$ primeros términos de una progresión aritmética $S_n$ multiplica el número de términos $n$ por el promedio entre el primer término y el último: $S_n = \frac{n(a_1 + a_n)}{2} = \frac{n [2a_1 + (n - 1)d]}{2}$.'
explicacion_simple: |
  Para sumar rápidamente todos los números de una progresión aritmética (por ejemplo, los números del $1$ al $100$):
  - El famoso matemático **Gauss** descubrió que si sumas el primer número con el último ($1 + 100 = 101$), el segundo con el penúltimo ($2 + 99 = 101$), ¡todas las parejas suman exactamente lo mismo!
  - Como hay $n$ números, se forman $\frac{n}{2}$ parejas que suman $(a_1 + a_n)$.
  - Por eso la fórmula de la suma es:
    $$S_n = \frac{n \cdot (a_1 + a_n)}{2}$$
  Para los números del 1 al 100: $S_{100} = \frac{100 \cdot (1 + 100)}{2} = \frac{100 \cdot 101}{2} = 5.050$.
explicacion_formal: |
  ### Definición formal y deducción de Gauss
  La **suma finita $S_n$** de los $n$ primeros términos de una progresión aritmética $(a_k)_{k=1}^n$ es:
  $$S_n = \sum_{k=1}^n a_k = a_1 + a_2 + a_3 + \dots + a_{n-1} + a_n$$
  Escribiendo la suma en orden inverso y sumando miembro a miembro:
  $$\begin{array}{rccccccc} S_n & = & a_1 & + & a_2 & + \dots + & a_n \\ S_n & = & a_n & + & a_{n-1} & + \dots + & a_1 \\ \hline 2S_n & = & (a_1 + a_n) & + & (a_1 + a_n) & + \dots + & (a_1 + a_n) \end{array}$$
  Como hay $n$ términos idénticos en la suma:
  $$2S_n = n(a_1 + a_n) \implies S_n = \frac{n(a_1 + a_n)}{2}$$

  ### Formulación en función de $a_1$ y $d$
  Sustituyendo el término general $a_n = a_1 + (n - 1)d$:
  $$S_n = \frac{n \cdot \left[a_1 + a_1 + (n - 1)d\right]}{2} = \frac{n \cdot \left[2a_1 + (n - 1)d\right]}{2}$$

  ### Síntesis didáctica
  - Ecuación con último término: $S_n = \frac{n(a_1 + a_n)}{2}$.
  - Ecuación con diferencia: $S_n = \frac{n[2a_1 + (n - 1)d]}{2}$.
definiciones_clave: |
  - **Serie o suma finita ($S_n$)**: Acumulación o suma de los $n$ primeros elementos consecutivos de la progresión.
  - **Pareja simétrica de Gauss**: Par de términos ubicados a igual distancia de los extremos cuya suma equivale a $(a_1 + a_n)$.
  - **Promedio de extremos ($\frac{a_1 + a_n}{2}$)**: Valor medio central de la serie aritmética.
propiedades_relaciones: |
  - **Comportamiento cuadrático respecto a $n$**: Al desarrollar la fórmula de $S_n$, se obtiene una función cuadrática pura o afín de la forma $S_n = \frac{d}{2} n^2 + \left(a_1 - \frac{d}{2}\right)n$.
  - **Diferencia de sumas consecutivas**: La resta entre dos sumas parciales consecutivas entrega el término de esa posición: $S_n - S_{n-1} = a_n$.
ejemplo_guiado:
  enunciado: 'Calcula la suma de los primeros $20$ términos de la progresión aritmética $3, 7, 11, 15, \dots$'
  pasos:
    - 'Paso 1: Identificamos $n = 20$, primer término $a_1 = 3$ y diferencia $d = 7 - 3 = 4$.'
    - 'Paso 2: Calculamos el término $a_{20}$: $a_{20} = a_1 + (20 - 1)d = 3 + 19(4) = 3 + 76 = 79$.'
    - 'Paso 3: Aplicamos la fórmula de la suma $S_{20} = \frac{20 \cdot (a_1 + a_{20})}{2}$.'
    - 'Paso 4: Sustituimos y evaluamos: $S_{20} = \frac{20 \cdot (3 + 79)}{2} = 10 \cdot 82 = 820$. La suma de los 20 primeros términos es **$820$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular la suma de los $n$ primeros términos de una P.A. cuando se conoce el primer término $a_1$ y el último término $a_n$?'
    choices:
      - {text: 'Multiplicar el número de términos $n$ por la suma de extremos y dividir entre 2 ($S_n = \frac{n(a_1 + a_n)}{2}$)', is_correct: true}
      - {text: 'Multiplicar el primer término por el último término y elevar a $n$', is_correct: false}
      - {text: 'Restar el primer término al último término y dividir por la diferencia', is_correct: false}
      - {text: 'Sumar todos los números y multiplicar por $n^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar el número de términos $n$ por la suma de extremos y dividir entre 2 ($S_n = \frac{n(a_1 + a_n)}{2}$)''. Deducción de Gauss.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en una P.A. de 10 términos el primer término es $a_1 = 2$ y el décimo término es $a_{10} = 20$, ¿cuál es la suma total $S_{10}$?'
    choices:
      - {text: '$S_{10} = 110$, calculando $\frac{10 \cdot (2 + 20)}{2} = \frac{10 \cdot 22}{2} = 110$', is_correct: true}
      - {text: '$S_{10} = 220$, omitiendo la división por 2', is_correct: false}
      - {text: '$S_{10} = 100$, multiplicando $10 \cdot 10$', is_correct: false}
      - {text: '$S_{10} = 55$, dividiendo $110$ entre 2 por error', is_correct: false}
    explanation: 'La alternativa correcta es ''$S_{10} = 110$, calculando $\frac{10 \cdot (2 + 20)}{2} = \frac{10 \cdot 22}{2} = 110$''. $10 \cdot 22 / 2 = 110$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la cantidad de términos a sumar $n$ y el primer término $a_1$.'
  - 'Paso 2: Calcular el último término $a_n = a_1 + (n - 1)d$ (o identificar la diferencia $d$).'
  - 'Paso 3: Sumar el primer y último término: $(a_1 + a_n)$.'
  - 'Paso 4: Multiplicar por $n$ y dividir la suma entre 2: $S_n = \frac{n(a_1 + a_n)}{2}$.'
errores_correccion: |
  - **Error 1:** Olvidar dividir por 2 la fórmula de la suma (calcular $n(a_1 + a_n)$). **Cómo corregirlo:** Las parejas se forman de dos en dos, por lo que **es obligatorio DIVIDIR ENTRE 2: $S_n = \frac{n(a_1 + a_n)}{2}$**.
  - **Error 2:** Reemplazar el valor de la diferencia $d$ en el lugar de $a_n$. **Cómo corregirlo:** La fórmula requiere el **VALOR DEL ÚLTIMO TÉRMINO $a_n$**, no la diferencia común.
ejemplos:
  - titulo: 'Suma de los primeros 100 enteros'
    enunciado: 'Para los enteros de 1 a 100 ($a_1 = 1, a_{100} = 100$), ¿la suma es $S_{100} = \frac{100 \cdot 101}{2} = 5.050$?'
    alternativas:
      - 'Sí, por la fórmula de Gauss'
      - 'No, la suma es 10.100'
      - 'No, la suma es 5.000'
    respuesta: 'Sí, por la fórmula de Gauss'
    solucion_pasos:
      - '1. $a_1 = 1, a_{100} = 100, n = 100$.'
      - '2. $S_{100} = \frac{100(1 + 100)}{2} = \frac{10.100}{2} = 5.050$.'
  - titulo: 'Suma de los 10 primeros números pares'
    enunciado: 'Para los pares $2, 4, 6, \dots, 20$, ¿$a_1 = 2, a_{100} = 20 \implies S_{10} = \frac{10(2 + 20)}{2} = 110$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $S_{10} = 10(22) / 2 = 110$.'
  - titulo: 'Suma con fórmula de diferencia d'
    enunciado: 'Para $n=5, a_1=3, d=2$, ¿$S_5 = \frac{5[2(3) + 4(2)]}{2} = \frac{5[6 + 8]}{2} = \frac{70}{2} = 35$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $S_5 = 35$. Comprobación: $3+5+7+9+11 = 35$.'
  - titulo: 'Suma de P.A. decreciente'
    enunciado: 'Para $10, 8, 6, 4, 2$ ($n=5, a_1=10, a_5=2$), ¿$S_5 = \frac{5(10 + 2)}{2} = \frac{60}{2} = 30$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $10+8+6+4+2 = 30$.'
errores_frecuentes:
  - 'La suma de los $n$ primeros términos equivale al producto directo $n(a_1 + a_n)$ sin dividir entre 2.'
  - 'Una progresión con diferencia negativa es siempre inválida para el cálculo de índices.'
  - 'La posición ordinal $n$ y el valor numérico del término $a_n$ son numéricamente idénticos en la ecuación.'
  - 'Sustituir la diferencia común $d$ directamente en la posición de $a_n$ en la fórmula abreviada.'
  - 'Multiplicar el número de términos por la diferencia sin considerar el valor del primer término.'
afirmaciones_verdaderas:
  - 'La suma de los $n$ primeros términos de una P.A. se calcula mediante $S_n = \frac{n(a_1 + a_n)}{2}$.'
  - 'La fórmula de la suma equivale a multiplicar la cantidad de términos $n$ por el promedio entre el primer y último término.'
