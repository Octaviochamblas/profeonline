semantic_id: MAT.NUM.PROG_ARITMETICA.SUMA_TERMINOS
resumen_inicial: 'El cálculo de la suma de los $n$ primeros términos de una PA utiliza la fórmula de Gauss $S_n = \frac{n(a_1 + a_n)}{2}$ o su equivalente $S_n = \frac{n}{2}[2a_1 + (n - 1)d]$.'
explicacion_simple: |
  Para sumar muchos términos de una progresión aritmética (por ejemplo, los primeros 50 números):
  - No necesitas sumarlos uno a uno gracias al método descubierto por el matemático Carl Friedrich Gauss:
    $$S_n = \frac{n \cdot (a_1 + a_n)}{2}$$
  - ¿Cómo funciona?
    1. Sumas el **primer término** con el **último término** ($a_1 + a_n$).
    2. Multiplicas esa suma por la **cantidad de términos** ($n$).
    3. Divides el resultado **entre 2** (porque los términos se emparejan de a dos).
  - Por ejemplo, para sumar del $1$ al $100$:
    $$S_{100} = \frac{100 \cdot (1 + 100)}{2} = 50 \cdot 101 = 5.050$$

  ![Cálculo de la suma de los n primeros términos](/static/img/nodos/calculo-de-la-suma-de-los-n-primeros-terminos-de-una-progresion-aritmetica-intro.svg)
explicacion_formal: |
  ### Deducción por el Método de Simetría de Gauss
  Escribimos la suma $S_n$ en orden directo e inverso:
  $$\begin{aligned} S_n &= a_1 + a_2 + a_3 + \dots + a_{n-1} + a_n \\ S_n &= a_n + a_{n-1} + a_{n-2} + \dots + a_2 + a_1 \end{aligned}$$
  Sumando miembro a miembro ambas identidades:
  $$2S_n = (a_1 + a_n) + (a_2 + a_{n-1}) + \dots + (a_n + a_1)$$
  Dado que en una PA la suma de términos equidistantes es invariante:
  $$a_k + a_{n-k+1} = a_1 + a_n \quad \forall k$$
  Se obtienen exactamente $n$ pares idénticos de valor $(a_1 + a_n)$:
  $$2S_n = n(a_1 + a_n) \implies S_n = \frac{n(a_1 + a_n)}{2}$$

  ### Forma Alternativa en Función de $a_1$ y $d$
  Sustituyendo el término general $a_n = a_1 + (n-1)d$ en la fórmula:
  $$S_n = \frac{n [a_1 + a_1 + (n-1)d]}{2} = \frac{n [2a_1 + (n-1)d]}{2}$$

  ### Síntesis didáctica
  - Con extremos conocidos: $S_n = \frac{n(a_1 + a_n)}{2}$.
  - Con $d$ conocida: $S_n = \frac{n}{2}[2a_1 + (n-1)d]$.
definiciones_clave: |
  - **Suma de Gauss ($S_n$)**: Total acumulado al sumar los primeros $n$ términos de una progresión aritmética.
  - **Términos equidistantes**: Parejas de términos $(a_k, a_{n-k+1})$ cuya suma es constante e igual a $(a_1 + a_n)$.
  - **Semisuma de extremos**: Promedio aritmético entre el primer y último término $(\frac{a_1 + a_n}{2})$.
propiedades_relaciones: |
  - **Crecimiento cuadrático de la suma**: La función $S_n$ es una función cuadrática de la variable $n$: $S_n = \frac{d}{2}n^2 + (a_1 - \frac{d}{2})n$.
  - **Relación con el término general**: $a_n = S_n - S_{n-1}$ para todo $n \ge 2$.
ejemplo_guiado:
  enunciado: 'Calcula la suma de los primeros 20 términos de la progresión aritmética $(3, 7, 11, 15, \dots)$.'
  imagen: '/static/img/nodos/calculo-de-la-suma-de-los-n-primeros-terminos-de-una-progresion-aritmetica-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los datos: $a_1 = 3, d = 4, n = 20$.'
    - 'Paso 2: Calculamos el término vigésimo $a_{20}$: $a_{20} = 3 + (20 - 1) \cdot 4 = 3 + 19 \cdot 4 = 3 + 76 = 79$.'
    - 'Paso 3: Aplicamos la fórmula de la suma: $S_{20} = \frac{20 \cdot (a_1 + a_{20})}{2} = \frac{20 \cdot (3 + 79)}{2}$.'
    - 'Paso 4: Realizamos las operaciones: $S_{20} = 10 \cdot 82 = **820$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula que calcula la suma de los primeros $n$ términos de una PA cuando se conocen $a_1$ y el último término $a_n$?'
    choices:
      - {text: '$S_n = \frac{n(a_1 + a_n)}{2}$', is_correct: true}
      - {text: '$S_n = n(a_1 + a_n)$', is_correct: false}
      - {text: '$S_n = \frac{a_1 + a_n}{2}$', is_correct: false}
      - {text: '$S_n = n \cdot a_1 + d$', is_correct: false}
    explanation: 'La alternativa correcta es ''$S_n = \frac{n(a_1 + a_n)}{2}$''. Es la clásica fórmula de Gauss que promedia los extremos y multiplica por la cantidad de términos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la suma de los primeros 10 términos de una PA con $a_1 = 2$ y $a_{10} = 20$?'
    choices:
      - {text: '$110$, calculando $\frac{10 \cdot (2 + 20)}{2} = 5 \cdot 22 = 110$', is_correct: true}
      - {text: '$220$, olvidando dividir por 2', is_correct: false}
      - {text: '$22$', is_correct: false}
      - {text: '$100$', is_correct: false}
    explanation: 'La alternativa correcta es ''$110$, calculando $\frac{10 \cdot (2 + 20)}{2} = 5 \cdot 22 = 110$''. Aplicando Gauss con $n=10$, $a_1=2$ y $a_{10}=20$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$, la cantidad de términos $n$ y el término final $a_n$ (o la diferencia $d$).'
  - 'Paso 2: Si no se conoce $a_n$, calcularlo mediante $a_n = a_1 + (n - 1)d$.'
  - 'Paso 3: Sumar los extremos: $a_1 + a_n$.'
  - 'Paso 4: Multiplicar por $n$ y dividir el resultado entre 2: $S_n = \frac{n(a_1 + a_n)}{2}$.'
errores_correccion: |
  - **Error 1:** Olvidar dividir por 2 en la fórmula de la suma. **Cómo corregirlo:** La fórmula siempre lleva **división por 2**: $S_n = \frac{n(a_1 + a_n)}{2}$.
  - **Error 2:** Confundir el valor del último término $a_n$ con la cantidad total de términos $n$. **Cómo corregirlo:** $n$ es la **cantidad de términos sumados** y $a_n$ es el **valor numérico del último elemento**.
ejemplos:
  - titulo: 'Suma con fórmula alternativa'
    enunciado: 'Para $a_1 = 5, d = 3, n = 10$, ¿cuál es el valor de la suma $S_{10}$?'
    alternativas:
      - '$185$'
      - '$170$'
      - '$370$'
    respuesta: '$185$'
    solucion_pasos:
      - '1. $a_{10} = 5 + 9(3) = 32$.'
      - '2. $S_{10} = 10(5 + 32)/2 = 5 \cdot 37 = 185$.'
  - titulo: 'Suma de impares consecutivos'
    enunciado: '¿La suma de los primeros 10 números impares ($1, 3, 5, \dots, 19$) es igual a $100$?'
    alternativas:
      - 'Sí, evaluando $S_{10} = 10(1 + 19)/2 = 100$'
      - 'No, es igual a 90'
      - 'No, es igual a 110'
    respuesta: 'Sí, evaluando $S_{10} = 10(1 + 19)/2 = 100$'
    solucion_pasos:
      - '1. $S_{10} = 10(20)/2 = 100$. (Coincide con $n^2$).'
  - titulo: 'Suma de números negativos'
    enunciado: '¿La suma de términos en una PA puede dar un total negativo?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Si los términos sumados son negativos, la suma resultante es negativa.'
  - titulo: 'Propiedad de Gauss'
    enunciado: '¿En toda PA la suma de los extremos $a_1 + a_n$ es igual a la suma del segundo más el penúltimo $a_2 + a_{n-1}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $a_2 + a_{n-1} = (a_1+d) + (a_n-d) = a_1 + a_n$.'
errores_frecuentes:
  - 'En la fórmula de Gauss de la suma de una PA se omite la división por dos.'
  - 'La cantidad de términos $n$ se confunde con el valor numérico del último término $a_n$.'
  - 'La suma de los primeros $n$ números impares positivos no es igual al cuadrado de la cantidad de términos.'
  - 'Al aplicar la fórmula con términos negativos, se suman los valores absolutos ignorando los signos.'
  - 'Para calcular la suma de una PA es obligatorio sumar uno por uno todos los términos intermedios.'
afirmaciones_verdaderas:
  - 'La suma de los $n$ primeros términos de una PA es $S_n = \frac{n(a_1 + a_n)}{2}$, fundamentada en la simetría de términos equidistantes.'
  - 'La suma de los primeros $n$ números impares positivos ($a_1=1, d=2$) equivale exactamente a $n^2$.'
