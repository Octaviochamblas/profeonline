semantic_id: MAT.NUM.PROG_ARITMETICA.SUMA_FINITA
resumen_inicial: 'Cálculo de la suma de los n primeros términos de una progresión
  aritmética: concepto y desarrollo dentro de Progresión aritmética.'
explicacion_simple: Cuenta la leyenda que el famoso matemático Carl Friedrich Gauss,
  a los 9 años, sumó todos los números del 1 al 100 en unos segundos. Su maestro quedó
  pasmado. Gauss no sumó uno por uno, descubrió un truco genial.
explicacion_formal: "Imagina que quieres sumar $1 + 2 + 3 + \\dots + 98 + 99 + 100$.\n\
  Gauss notó que si sumas el primero y el último ($1+100$), da $101$. El segundo con\
  \ el penúltimo ($2+99$), da $101$. El tercero con el antepenúltimo ($3+98$), da\
  \ $101$. \n\nTodas las parejas suman lo mismo. Como hay 100 números, hay 50 parejas.\
  \ Así que la suma total es $50 \\cdot 101 = 5.050$. ¡Brillante!\n\nDe ahí nace la\
  \ fórmula oficial:\n$S_n = \\frac{n}{2} \\cdot (a_1 + a_n)$\nDonde:\n- **$S_n$**:\
  \ Suma total de los $n$ números.\n- **$n$**: Cantidad de términos que estás sumando.\n\
  - **$a_1$**: El primer término de tu lista.\n- **$a_n$**: El último término de tu\
  \ lista."
definiciones_clave: '- **Cálculo de la suma de los n primeros términos de una progresión
