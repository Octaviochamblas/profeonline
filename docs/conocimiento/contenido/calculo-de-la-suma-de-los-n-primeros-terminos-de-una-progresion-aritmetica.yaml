procedimiento:
- 'Paso 1: Identifica cuántos términos sumarás ($n$).'
- 'Paso 2: Identifica el primer término ($a_1$).'
- 'Paso 3: Identifica (o calcula usando la fórmula del término general) el último
  término que sumarás ($a_n$).'
- 'Paso 4: Suma el primero con el último, multiplica por ''$n$'', y finalmente divide
  por 2.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término
  $a_n$ en cálculo de la suma de los n primeros términos de una progresión aritmética.
ejemplos:
- titulo: Sumando la quincena
  enunciado: Ahorras $10 el día 1, $20 el día 2, $30 el día 3, y así sucesivamente
    durante 15 días. ¿Cuánto dinero ahorraste en total?
  solucion_pasos:
  - Es una P.A. donde a1=10, d=10. Necesito sumar 15 días (n=15).
  - El último día (día 15) ahorro a15 = 10 + (14)*10 = 150.
  - 'Fórmula suma: S15 = (15 / 2) * (10 + 150)'
  - S15 = 7.5 * 160 = 1.200.
  - Ahorraste $1.200 en total.
errores_frecuentes:
- Confundir el valor del último término ($a_n$) con la suma total ($S_n$). (El último
  término es cuánto vale la casilla 15, la suma es el total acumulado en las 15 casillas).
- No tener el dato del último término y olvidar que primero hay que calcularlo con
  la fórmula $a_n = a_1 + (n-1)d$.
afirmaciones_verdaderas:
- La formulación de cálculo de la suma de los n primeros términos de una progresión
  aritmética mantiene la regularidad de la sucesión.
