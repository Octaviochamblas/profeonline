procedimiento:
- 'Paso 1: Reescribe la expresión en la forma $(x-h)^n$ si aparece como $(x+k)^n$.'
- 'Paso 2: Identifica el signo de $h$.'
- 'Paso 3: Si $h>0$, desplaza a la derecha; si $h<0$, desplaza a la izquierda.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en interpretación del signo de h en una función potencia trasladada
  horizontalmente.
ejemplos:
- titulo: Traslación hacia la derecha
  enunciado: ¿Hacia dónde se desplaza $f(x)=(x-6)^3$ respecto a $x^3$?
  solucion_pasos:
  - Se identifica $h=6>0$.
  - Se desplaza $6$ unidades hacia la derecha.
- titulo: Traslación hacia la izquierda
  enunciado: ¿Hacia dónde se desplaza $f(x)=(x+4)^2$ respecto a $x^2$?
  solucion_pasos:
  - Se reescribe como $(x-(-4))^2$, así que $h=-4$.
  - Se desplaza $4$ unidades hacia la izquierda.
- titulo: ¿$f(x)=(x-3)^2$ se desplaza hacia la izquierda?
  enunciado: ¿La función $f(x)=(x-3)^2$ se desplaza hacia la izquierda respecto a
    $x^2$?
  respuesta: 'No'
  solucion_pasos:
  - Con $h=3>0$, el desplazamiento es hacia la derecha, no hacia la izquierda.
- titulo: ¿El signo dentro del paréntesis coincide con la dirección visual del desplazamiento?
  enunciado: ¿Un signo "menos" dentro del paréntesis siempre produce un desplazamiento
    hacia la derecha?
  respuesta: Sí
  solucion_pasos:
  - Es la convención matemática: $(x-h)$ con $h>0$ mueve la curva a la derecha, de
      forma contraintuitiva.
errores_frecuentes:
- Invertir la dirección del desplazamiento, moviendo hacia la izquierda cuando corresponde
  a la derecha.
- No reescribir $(x+k)$ como $(x-(-k))$ antes de identificar el signo de $h$.
- Declarar esta traslación horizontal con una traslación vertical.
- Aplicar el signo del desplazamiento al valor de $y$ en vez de al de $x$.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  interpretación del signo de h en una función potencia trasladada horizontalmente.
