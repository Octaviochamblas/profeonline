semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.SIGNO_TRASLACION_HORIZONTAL
resumen_inicial: 'En la expresión de una función potencia trasladada $g(x) = a (x - h)^n$, un signo negativo $(x - c)$ desplaza la gráfica hacia la derecha, y un signo positivo $(x + c)$ la desplaza hacia la izquierda.'
explicacion_simple: |
  El signo dentro del paréntesis de una función potencia trasladada horizontalmente funciona de forma opuesta a la intuición visual inicial. Cuando vemos $(x - 3)^n$, el signo menos significa que el parámetro es $h = +3$, por lo que la gráfica se desplaza 3 unidades hacia la **derecha** (dirección positiva del eje $x$). En cambio, cuando vemos $(x + 3)^n$, significa que es $(x - (-3))^n$ con $h = -3$, por lo que la gráfica se desplaza 3 unidades hacia la **izquierda** (dirección negativa).
explicacion_formal: |
  ### Definición formal
  La **regla de los signos para la traslación horizontal** en la familia de funciones potencia $g(x) = a (x - h)^n$ con $h \in \mathbb{R}$ se rige analíticamente por la posición del cero del binomio $(x - h) = 0 \implies x = h$:

  1. **Desplazamiento a la Derecha ($h > 0$)**:
     - Estructura algebraica: $g(x) = a (x - c)^n$ con $c > 0$.
     - Regla geométrica: La gráfica se desplaza $c$ unidades hacia la **derecha** ($+x$). El vértice pasa a $(c, 0)$.

  2. **Desplazamiento a la Izquierda ($h < 0$)**:
     - Estructura algebraica: $g(x) = a (x + c)^n$ con $c > 0$ (puesto que $x - (-c) = x + c$).
     - Regla geométrica: La gráfica se desplaza $c$ unidades hacia la **izquierda** ($-x$). El vértice pasa a $(-c, 0)$.

  ### Síntesis didáctica
  Identificación rápida por anulación del paréntesis: Para saber hacia dónde y cuánto se desplazó el vértice u origen de la función potencia, basta con igualar el interior del paréntesis a cero:
  $$(x - h) = 0 \implies x = h$$
  Si $h$ resulta positivo $\implies$ traslación a la derecha. Si $h$ resulta negativo $\implies$ traslación a la izquierda.
definiciones_clave: |
  - **Forma resta $(x - c)$**: Representación de una traslación horizontal hacia la derecha ($h = c > 0$).
  - **Forma suma $(x + c)$**: Representación de una traslación horizontal hacia la izquierda ($h = -c < 0$).
  - **Raíz del paréntesis $x = h$**: Valor de abscisa que anula el argumento del binomio determinando la nueva posición del vértice.
propiedades_relaciones: |
  - **Preservación del signo del coeficiente $a$**: El signo dentro del paréntesis $(x \mp c)$ controla exclusivamente la posición horizontal y no altera la apertura ni la concavidad regidas por $a$.
  - **Relación con asíntotas verticales**: En potencias de exponente negativo $a(x - h)^{-m}$, la asíntota vertical se desplaza a la recta $x = h$.
ejemplo_guiado:
  enunciado: 'Determina la dirección, la cantidad de unidades de traslación y las coordenadas del nuevo vértice para las siguientes funciones potencia: A) $f(x) = 2(x - 5)^4$, B) $g(x) = -3(x + 2)^3$.'
  pasos:
    - 'Paso 1: Para $f(x) = 2(x - 5)^4$, igualamos el paréntesis a cero: $x - 5 = 0 \implies x = 5$.'
    - 'Paso 2: Como $h = 5 > 0$, la gráfica se desplaza **5 unidades hacia la derecha**. El nuevo vértice se ubica en $(5, 0)$.'
    - 'Paso 3: Para $g(x) = -3(x + 2)^3$, igualamos el paréntesis a cero: $x + 2 = 0 \implies x = -2$.'
    - 'Paso 4: Como $h = -2 < 0$, la gráfica se desplaza **2 unidades hacia la izquierda**. El nuevo punto de inflexión se ubica en $(-2, 0)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Hacia qué dirección y en cuántas unidades se desplaza la gráfica de la función potencia $f(x) = (x + 4)^3$ respecto a la función base $y = x^3$?'
    choices:
      - {text: 'Se desplaza 4 unidades hacia la izquierda, ubicando su punto de inflexión en $x = -4$', is_correct: true}
      - {text: 'Se desplaza 4 unidades hacia la derecha, ubicando su punto de inflexión en $x = 4$', is_correct: false}
      - {text: 'Se desplaza 4 unidades hacia arriba', is_correct: false}
      - {text: 'Se desplaza 4 unidades hacia abajo', is_correct: false}
    explanation: 'La alternativa correcta es ''Se desplaza 4 unidades hacia la izquierda, ubicando su punto de inflexión en $x = -4$''. La expresión $(x + 4)$ equivale a $(x - (-4))$, indicando un parámetro $h = -4$ (desplazamiento a la izquierda).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la función potencia $f(x) = -2(x - 7)^2$, ¿cuál es la abscisa del vértice de su parábola?'
    choices:
      - {text: 'La abscisa es $x = 7$, pues el paréntesis se anula en $x - 7 = 0 \implies x = 7$', is_correct: true}
      - {text: 'La abscisa es $x = -7$', is_correct: false}
      - {text: 'La abscisa es $x = -2$', is_correct: false}
      - {text: 'La abscisa es $x = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''La abscisa es $x = 7$, pues el paréntesis se anula en $x - 7 = 0 \implies x = 7$''. La resta $(x - 7)$ ubica el vértice a la derecha en $x = 7$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la expresión dentro de la potencia en la función $f(x) = a (x - h)^n$.'
  - 'Paso 2: Igualar el binomio a cero: $x - h = 0 \implies x = h$.'
  - 'Paso 3: Si $h > 0$ (aparece como $-h$ en el paréntesis), declarar traslación hacia la **derecha**.'
  - 'Paso 4: Si $h < 0$ (aparece como $+c$ en el paréntesis), declarar traslación hacia la **izquierda**.'
errores_correccion: |
  - **Error 1:** Interpretar $(x - 4)^n$ como una traslación hacia la izquierda por ver el signo menos. **Cómo corregirlo:** La fórmula estándar es $(x - h)$. Por ello, $(x - 4)$ significa $h = +4$, desplazando la curva hacia la derecha.
  - **Error 2:** Interpretar $(x + 4)^n$ como una traslación hacia la derecha por ver el signo más. **Cómo corregirlo:** $(x + 4)$ es idéntico a $(x - (-4))$, lo que indica que $h = -4$ desplaza la curva hacia la izquierda.
ejemplos:
  - titulo: 'Dirección en resta interna'
    enunciado: '¿La gráfica de $f(x) = (x - 6)^2$ se desplaza 6 unidades a la derecha?'
    alternativas:
      - 'Sí, a la derecha'
      - 'No, a la izquierda'
      - 'No, hacia arriba'
    respuesta: 'Sí, a la derecha'
    solucion_pasos:
      - '1. Igualamos $x - 6 = 0 \implies x = 6 > 0$.'
      - '2. Desplazamiento de 6 unidades hacia la derecha.'
  - titulo: 'Dirección en suma interna'
    enunciado: '¿La gráfica de $g(x) = (x + 3)^4$ tiene su vértice en $(-3, 0)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $x + 3 = 0 \implies x = -3$, vértice desplazado 3 unidades a la izquierda.'
  - titulo: 'Ubicación de asíntota en potencia negativa'
    enunciado: '¿La asíntota vertical de $h(x) = \frac{1}{(x - 2)^2}$ se desplaza a $x = 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El denominador se anula en $x - 2 = 0 \implies x = 2$, desplazando la asíntota 2 unidades a la derecha.'
  - titulo: 'Naturaleza del signo del paréntesis'
    enunciado: '¿El signo $+c$ dentro del paréntesis indica que $h$ es negativo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $(x + c) = (x - (-c)) \implies h = -c < 0$.'
errores_frecuentes:
  - 'La función $f(x) = (x - 5)^3$ representa un desplazamiento de 5 unidades hacia la izquierda.'
  - 'La función $f(x) = (x + 2)^2$ tiene su vértice ubicado en el punto $(2, 0)$.'
  - 'El signo positivo dentro del paréntesis $(x + 4)$ desplaza la gráfica en dirección $+x$.'
  - 'Igualar el binomio interno a cero no permite hallar la posición horizontal del vértice.'
  - 'Un desplazamiento hacia la izquierda requiere que la fórmula lleve un signo negativo explícito.'
afirmaciones_verdaderas:
  - 'En la función potencia $f(x) = a (x - h)^n$, la resta $(x - c)$ desplaza la gráfica $c$ unidades a la derecha ($h > 0$), mientras que la suma $(x + c)$ la desplaza $c$ unidades a la izquierda ($h < 0$).'
  - 'La abscisa del punto de referencia o vértice de la función potencia trasladada se obtiene resolviendo la ecuación $x - h = 0 \implies x = h$.'
al_terminar_debes_poder: 'Interpretar correctamente el signo de $h$ para determinar el sentido y magnitud de traslaciones horizontales.'
