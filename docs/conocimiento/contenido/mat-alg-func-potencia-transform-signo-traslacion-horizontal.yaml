semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.SIGNO_TRASLACION_HORIZONTAL
resumen_inicial: 'Interpretación del signo de h en una función potencia trasladada
  horizontalmente: forma general $f(x) = a x^n$, simetría, dominio y recorrido en
  Traslaciones y escalas.'
explicacion_simple: 'El signo dentro del paréntesis puede resultar contraintuitivo:
  un signo "menos" mueve la curva hacia la derecha, y un signo "más" la mueve hacia
  la izquierda.'
explicacion_formal: '### Definición formal


  Escrito en la forma $f(x)=a(x-h)^n$, un valor $h>0$ desplaza la gráfica $h$ unidades
  a la derecha. Si la expresión aparece como $f(x)=a(x+k)^n$ con $k>0$, esto equivale
  a $h=-k<0$, y la gráfica se desplaza $k$ unidades a la izquierda.


  ### Desarrollo didáctico


  $f(x)=(x-2)^2$ tiene $h=2>0$: se desplaza a la derecha, con vértice en $x=2$. En
  cambio, $f(x)=(x+2)^2$ equivale a $h=-2$: se desplaza a la izquierda, con vértice
  en $x=-2$.'
definiciones_clave: '- **Interpretación del signo de h en una función potencia trasladada
  horizontalmente**: Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a interpretación del signo de h en una función potencia trasladada
  horizontalmente.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de interpretación del signo de h en una función potencia trasladada horizontalmente.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de interpretación del signo
    de h en una función potencia trasladada horizontalmente.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
