semantic_id: MAT.FUND.CONJUNTOS_BASICOS.CARDINALIDAD_BASICA
resumen_inicial: Definición, notación ($|A|$, $n(A)$, $\#A$) y cálculo de la cardinalidad o número de elementos distintos de un conjunto finito.
explicacion_simple: '![Infografía: Notación y cálculo de cardinalidad básica](/static/img/nodos/cardinalidad-basica-de-un-conjunto-intro.svg)


  La **cardinalidad** de un conjunto es simplemente **la cantidad total de elementos distintos que tiene**. Se anota poniendo el nombre del conjunto entre dos barras verticales: **$|A|$**, o también escribiendo **$n(A)$** o **$\#A$**. Por ejemplo, si tenemos el conjunto de las vocales $V = \{a, e, i, o, u\}$, su cardinalidad es **$|V| = 5$**. La regla de oro al calcular la cardinalidad es que **los elementos repetidos se cuentan solo una vez**: para el conjunto $B = \{1, 1, 2, 3\}$, la cardinalidad es **$|B| = 3$** (los elementos distintos son el 1, el 2 y el 3).

  '
explicacion_formal: "### Definición formal\nEn la teoría de conjuntos, la **cardinalidad (o número cardinal)** de un conjunto finito $A$ es el único entero no negativo $n \\in \\mathbb{N}_0$ representativo de la clase de equivalencia bajo la relación de equipotencia (biyección):\n$$|A| = \\operatorname{Card}(A) = n \\quad \\iff \\quad A \\sim \\{1, 2, \\dots, n\\}$$\ncon la convención estricta $|\\emptyset| = 0$.\nPara conjuntos finitos disjuntos ($A \\cap B = \\emptyset$), se cumple el Principio Aditivo:\n$$|A \\cup B| = |A| + |B|$$\n\n### Desglose simbólico\n- Notaciones estándar: $|A|$, $n(A)$, $\\#A$, $\\operatorname{Card}(A)$.\n- Axioma de extensionalidad en cardinalidad:\n  $$|\\{a_1, a_2, \\dots, a_k\\}| = |\\{x \\mid \\exists i, x = a_i\\}| \\leq k$$\n- Principio de Inclusión-Exclusión para dos conjuntos:\n  $$|A \\cup B| = |A| + |B| - |A \\cap B|$$\n\n### Síntesis didáctica\nLa cardinalidad mide la magnitud discreta del conjunto abstrayendo la naturaleza o el orden de sus elementos\
  \ componentes.\n"
definiciones_clave: '- **Cardinalidad ($|A|$)**: Medida del tamaño de un conjunto que indica la cantidad de elementos únicos que contiene.

  - **Principio de inclusión-exclusión**: Fórmula de conteo que corrige la doble contabilización de elementos compartidos en la unión.

  - **Principio aditivo**: Regla fundamental de conteo para conjuntos mutuamente disjuntos.

  '
propiedades_relaciones: '- **Monotonía de la cardinalidad**: Si $A \subseteq B$ (con $B$ finito), entonces $|A| \leq |B|$.

  - **Cardinalidad del producto cartesiano**: Para conjuntos finitos, $|A \times B| = |A| \times |B|$.

  '
ejemplo_guiado:
  enunciado: '![Diagrama: Eliminación de duplicados y conteo de miembros anidados](/static/img/nodos/cardinalidad-basica-de-un-conjunto-ejemplos.svg)


    Calcula la cardinalidad del conjunto $S = \{x \in \mathbb{Z} \mid -3 \leq x < 4\}$ y la del conjunto $R = \{2, 2, 4, 4, 6, 8, 8\}$.'
  pasos:
  - 'Paso 1: Resolver el conjunto $S$ listando sus elementos enteros: - Los enteros $\geq -3$ y $< 4$ son: $-3, -2, -1, 0, 1, 2, 3$.'
  - 'Paso 2: Contar los elementos distintos de $S$: Hay $7$ números enteros en la lista.'
  - 'Paso 3: Expresar la cardinalidad de $S$: $|S| = 7$.'
  - 'Paso 4: Analizar el conjunto $R$ simplificando los elementos repetidos: - $R = \{2, 2, 4, 4, 6, 8, 8\} = \{2, 4, 6, 8\}$.'
  - 'Paso 5: Contar los elementos únicos de $R$: Hay exactamente $4$ elementos distintos, por lo que $|R| = 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la cardinalidad del conjunto $A = \{3, 3, 5, 7, 7, 7, 9\}$?
  choices:
  - text: $|A| = 4$
    is_correct: true
  - text: $|A| = 7$
    is_correct: false
  - text: $|A| = 3$
    is_correct: false
  - text: $|A| = 5$
    is_correct: false
  explanation: La alternativa correcta es '$|A| = 4$'. Los elementos distintos son $\{3, 5, 7, 9\}$, sumando 4 elementos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $|A| = 6$, $|B| = 8$ y $|A \cap B| = 2$, ¿cuál es la cardinalidad de la unión $|A \cup B|$?
  choices:
  - text: $12$
    is_correct: true
  - text: $14$
    is_correct: false
  - text: $16$
    is_correct: false
  - text: $10$
    is_correct: false
  explanation: 'La alternativa correcta es ''$12$''. Por el principio de inclusión-exclusión: $|A \cup B| = 6 + 8 - 2 = 12$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Enumerar o determinar todos los miembros del conjunto.'
- 'Paso 2: Eliminar cualquier elemento repetido o redundante.'
- 'Paso 3: Tratar los subconjuntos internos $\{\dots\}$ como un único elemento individual.'
- 'Paso 4: Contar la cantidad final de elementos únicos.'
- 'Paso 5: Escribir el resultado con la notación formal $|A| = n$.'
errores_correccion: '- **Error 1:** Contar los elementos duplicados aumentando la cardinalidad. **Cómo corregirlo:** La cardinalidad de $\{1, 1, 1\}$ es 1, no 3; en la teoría de conjuntos la multiplicidad de un elemento no añade nuevos miembros.

  - **Error 2:** Desglosar los elementos de un conjunto interior al contar. **Cómo corregirlo:** En $A = \{1, \{2, 3\}\}$, la cardinalidad es $|A| = 2$ (los elementos son el número $1$ y el bloque $\{2, 3\}$).

  '
ejemplos:
- titulo: Cardinalidad del conjunto vacío
  enunciado: ¿Cuánto vale $|\emptyset|$?
  alternativas:
  - $0$
  - $1$
  - Indeterminado
  respuesta: $0$
  solucion_pasos:
  - 1. El conjunto vacío no tiene elementos, luego $|\emptyset| = 0$.
- titulo: Conjunto con anidación
  enunciado: ¿Cuál es la cardinalidad de $M = \{a, \{b, c\}, d\}$?
  respuesta: $3$
  solucion_pasos:
  - Sus elementos son $a$, $\{b, c\}$ y $d$. Total $= 3$.
  alternativas:
  - $3$
  - $4$
  - $2$
  - $1$
- titulo: Principio aditivo
  enunciado: Si $A = \{1, 2\}$ y $B = \{3, 4\}$, ¿cuánto vale $|A \cup B|$?
  respuesta: $4$
  solucion_pasos:
  - Como $A \cap B = \emptyset$, $|A \cup B| = 2 + 2 = 4$.
  alternativas:
  - $4$
  - $2$
  - $3$
  - $8$
- titulo: Cardinalidad del conjunto potencia
  enunciado: Si $|A| = 3$, ¿cuál es la cardinalidad de su conjunto potencia $|\mathcal{P}(A)|$?
  respuesta: $8$
  solucion_pasos:
  - $|\mathcal{P}(A)| = 2^3 = 8$.
  alternativas:
  - $8$
  - $6$
  - $9$
  - $16$
errores_frecuentes:
- La afirmación de que contar elementos repetidos incrementa la cardinalidad de un conjunto.
- La afirmación de que la cardinalidad del conjunto vacío es igual a uno.
- La afirmación de que la cardinalidad de $\{1, \{2, 3\}\}$ es igual a tres.
- La afirmación de que la cardinalidad de la unión de dos conjuntos siempre es igual a la suma directa de sus cardinalidades sin la deducción de la intersección.
- La afirmación de que un conjunto finito puede tener cardinalidad negativa.
afirmaciones_verdaderas:
- La cardinalidad de un conjunto finito $|A|$ es el número entero no negativo que expresa la cantidad exacta de elementos distintos que lo componen.
- 'Para dos conjuntos finitos cualesquiera, la cardinalidad de su unión satisface el principio de inclusión-exclusión: $|A \cup B| = |A| + |B| - |A \cap B|$.'
al_terminar_debes_poder: 'QUÉ: Calcular y operar con la cardinalidad básica ($|A|$) de conjuntos finitos.

  CÓMO: Identificar elementos únicos sin duplicados, contabilizar subconjuntos anidados como unidades y aplicar el principio de inclusión-exclusión.


  ![Cuadro resumen: Cardinalidad, principio aditivo y anidación](/static/img/nodos/cardinalidad-basica-de-un-conjunto-resumen.svg)

  '
