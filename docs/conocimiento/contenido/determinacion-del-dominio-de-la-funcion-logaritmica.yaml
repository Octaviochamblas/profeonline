semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.DOMINIO
resumen_inicial: La determinación del dominio de una función logarítmica $f(x) = \log_b(g(x))$ requiere resolver la inecuación estricta $g(x) > 0$, dado que el logaritmo solo está definido en los números reales para argumentos estrictamente positivos.
explicacion_simple: "![La determinación del dominio de una función logarítmica $f(x) = \\log_b(g(x))$ requiere resolver la inecuación estricta $g(x) > 0$, dado que el logaritmo solo está definido en los números reales para argumentos estrictamente positivos](/static/img/nodos/determinacion-del-dominio-de-la-funcion-logaritmica-intro.svg)\n\n\nPara encontrar el **dominio** (todos los valores de $x$ que se pueden usar) en cualquier función con logaritmo:\n\n$$\\text{Dominio de } \\log_b(\\mathbf{g(x)}) \\quad \\Longleftrightarrow \\quad \\mathbf{g(x) > 0} \\quad (\\text{Argumento Estrictamente Positivo})$$\n\n- **Pasos a seguir:**\n  1. Toma todo lo que está dentro del paréntesis del logaritmo.\n  2. Escribe la desigualdad: **$\\text{lo de adentro} > 0$** (¡estricto, sin signo igual!).\n  3. Despeja $x$.\n  4. Escribe la respuesta con corchetes abiertos: $]h, +\\infty[$.\n- **Ejemplo rápido:** En $f(x) = \\log_2(x - 3)$, exigimos $x - 3 > 0 \\implies x > 3 \\implies \\operatorname{Dom}(f)\
  \ = ]3, +\\infty[$."
explicacion_formal: "Sea $f(x) = a \\log_b(g(x)) + k$ una función compuesta donde $g: \\mathbb{R} \\to \\mathbb{R}$ es una función continua. Por el teorema de preimagen del dominio fundamental $\\mathbb{R}^+$:\n$$\\operatorname{Dom}(f) = g^{-1}(\\mathbb{R}^+) = \\{x \\in \\operatorname{Dom}(g) \\mid g(x) > 0\\}$$\n\n**Casos canónicos de análisis**:\n1. **Argumento afín $g(x) = mx + n$ ($m > 0$)**:\n   $mx + n > 0 \\implies x > -n/m \\implies \\operatorname{Dom}(f) = ]-n/m, +\\infty[$.\n2. **Argumento afín negativo ($m < 0$)**:\n   $mx + n > 0 \\implies x < -n/m \\implies \\operatorname{Dom}(f) = ]-\\infty, -n/m[$.\n3. **Argumento cuadrático $g(x) = (x - x_1)(x - x_2)$**:\n   Resolución por tabla de signos en los intervalos exteriores o interiores según la concavidad."
definiciones_clave: '- **Dominio logarítmico**: Conjunto de preimágenes donde el argumento es estrictamente mayor que cero.

  - **Frontera asintótica**: Puntos de anulación $g(x) = 0$ que definen las asíntotas verticales de la función.'
propiedades_relaciones: '- **Exclusión estricta de fronteras**: Las fronteras donde $g(x) = 0$ siempre llevan corchete abierto $]$.

  - **Invarianza ante factores externos**: Los coeficientes $a$ y $k$ no afectan el dominio.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del dominio de una función logarítmica $f(x) = \log_b(g(x))$ requiere resolver la inecuación estricta $g(x) > 0$, dado que el logaritmo solo está definido en los números reales para argumentos estrictamente positivos](/static/img/nodos/determinacion-del-dominio-de-la-funcion-logaritmica-ejemplos.svg)



    Determina el dominio de las siguientes funciones logarítmicas:

    1) $f(x) = \log_5(4x - 12)$

    2) $g(x) = \ln(10 - 2x)$

    3) $h(x) = \log_2(x^2 - 9)$'
  pasos:
  - 'Paso 1: Para $f(x) = \log_5(4x - 12)$:

    - Plantear: $4x - 12 > 0 \implies 4x > 12 \implies x > 3$.

    - **$\operatorname{Dom}(f) = ]3, +\infty[$**.'
  - 'Paso 2: Para $g(x) = \ln(10 - 2x)$:

    - Plantear: $10 - 2x > 0 \implies 10 > 2x \implies x < 5$.

    - **$\operatorname{Dom}(g) = ]-\infty, 5[$**.'
  - 'Paso 3: Para $h(x) = \log_2(x^2 - 9)$:

    - Plantear: $x^2 - 9 > 0 \implies (x - 3)(x + 3) > 0$.

    - Positivo en los extremos: $x < -3$ o $x > 3$.

    - **$\operatorname{Dom}(h) = ]-\infty, -3[ \cup ]3, +\infty[$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de $f(x) = \log_3(2x + 8)$?
  choices:
  - text: ']-4, +∞['
    is_correct: true
  - text: '[-4, +∞['
    is_correct: false
  - text: ']4, +∞['
    is_correct: false
  - text: ℝ
    is_correct: false
  explanation: La alternativa correcta es ']-4, +∞['. $2x + 8 > 0 \implies 2x > -8 \implies x > -4$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el dominio de $g(x) = \log(6 - x)$?
  choices:
  - text: ']-∞, 6['
    is_correct: true
  - text: ']6, +∞['
    is_correct: false
  - text: '[-∞, 6]'
    is_correct: false
  - text: ℝ \ {6}
    is_correct: false
  explanation: La alternativa correcta es ']-∞, 6['. $6 - x > 0 \implies 6 > x \implies x < 6$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el argumento algebraico $g(x)$ dentro del logaritmo.'
- 'Paso 2: Plantear la inecuación estricta $g(x) > 0$.'
- 'Paso 3: Resolver algebraicamente la inecuación considerando el cambio de sentido ante coeficientes negativos.'
- 'Paso 4: Escribir el conjunto solución en notación de intervalos abiertos.'
errores_correccion: '- **Error común:** Utilizar corchetes cerrados $[$ o incluir el valor que hace $g(x) = 0$.

  - **Cómo corregirlo:** En logaritmos **el argumento nunca puede ser cero**: se usan **SIEMPRE corchetes abiertos $]$ o $[$**.'
ejemplos:
- titulo: 'Ejemplo 1: Argumento lineal básico'
  enunciado: 'Encuentra el dominio de $f(x) = \log_7(x - 9)$:'
  alternativas:
  - ']9, +inf['
  - '[9, +inf['
  - ']-9, +inf['
  - ']0, +inf['
  respuesta: ']9, +inf['
  solucion_pasos:
  - 'Paso 1: $x - 9 > 0 \implies x > 9 \implies ]9, +\infty[$.'
- titulo: 'Ejemplo 2: Argumento con coeficiente'
  enunciado: ¿Cuál es el dominio de $f(x) = \log_2(5x - 20)$?
  alternativas:
  - ']4, +inf['
  - '[4, +inf['
  - ']20, +inf['
  - ']0, +inf['
  respuesta: ']4, +inf['
  solucion_pasos:
  - 'Paso 1: $5x - 20 > 0 \implies 5x > 20 \implies x > 4$.'
- titulo: 'Ejemplo 3: Argumento con signo invertido'
  enunciado: 'Determina el dominio de $g(x) = \ln(15 - 3x)$:'
  alternativas:
  - ']-inf, 5['
  - ']5, +inf['
  - ']-inf, -5['
  - '[5, +inf['
  respuesta: ']-inf, 5['
  solucion_pasos:
  - 'Paso 1: $15 - 3x > 0 \implies 15 > 3x \implies x < 5 \implies ]-\infty, 5[$.'
- titulo: 'Ejemplo 4: Argumento con valor absoluto'
  enunciado: ¿Cuál es el dominio de $h(x) = \log|x - 2|$?
  alternativas:
  - R \ {2}
  - ']2, +inf['
  - R
  - '[2, +inf['
  respuesta: R \ {2}
  solucion_pasos:
  - 'Paso 1: $|x - 2| > 0 \iff x \neq 2 \implies \mathbb{R} \setminus \{2\}$.'
errores_frecuentes:
- Incluir el cero o usar desigualdades no estrictas >= 0.
- Olvidar invertir el signo de la desigualdad al dividir por números negativos.
- Confundir el dominio con el recorrido.
afirmaciones_verdaderas:
- El dominio de f(x) = log_b(g(x)) está determinado por la inecuación estricta g(x) > 0.
- Los valores donde g(x) = 0 definen las asíntotas verticales de la función.
al_terminar_debes_poder: '**QUÉ:** Determinar el dominio de funciones logarítmicas con argumentos variados.


  **CÓMO:** Planteando y resolviendo la desigualdad estricta Argumento > 0 expresada en intervalos abiertos.


