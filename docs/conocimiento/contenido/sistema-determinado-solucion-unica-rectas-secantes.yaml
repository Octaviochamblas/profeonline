semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SISTEMA_DETERMINADO
resumen_inicial: Un sistema es compatible determinado cuando posee una única solución, lo que geométricamente corresponde al cruce de dos rectas secantes en un punto del plano.
explicacion_simple: '![Sistema determinado: solución única (rectas secantes)](/static/img/nodos/sistema-determinado-solucion-unica-rectas-secantes-intro.svg)


  Un sistema de ecuaciones lineales $2 \times 2$ se clasifica como **compatible determinado** cuando posee **una única solución** $(x, y)$.


  Geométricamente, esto significa que las dos rectas asociadas en el plano cartesiano poseen pendientes distintas ($m_1 \neq m_2$).


  Por lo tanto, se trata de dos **rectas secantes** que se cortan en exactamente un único punto del plano $xOy$.'
explicacion_formal: '### Definición formal

  El sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$ es **compatible determinado** si y solo si la razón de sus coeficientes satisface la desigualdad:


  $$\frac{a_1}{a_2} \neq \frac{b_1}{b_2} \iff a_1 b_2 - a_2 b_1 \neq 0 \iff \Delta \neq 0$$


  $$\text{Geometría: } L_1 \text{ y } L_2 \text{ son rectas secantes } \implies |L_1 \cap L_2| = 1$$


  ### Síntesis didáctica

  La no-proporcionalidad entre los coeficientes de $x$ e $y$ garantiza la existencia de un determinante del sistema no nulo ($\Delta \neq 0$).

  '
definiciones_clave: '- **Sistema compatible determinado (SCD)**: Sistema de ecuaciones lineales que posee una solución única en $\mathbb{R}^2$.

  - **Rectas secantes**: Dos rectas coplanares que se intersecan en un único punto debido a la desigualdad de sus pendientes ($m_1 \neq m_2$).

  '
propiedades_relaciones: '- **Desigualdad de razones de coeficientes**: $\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$ es la condición necesaria y suficiente para que exista solución única.

  - **Determinante no nulo**: La matriz de coeficientes posee determinante $\Delta = a_1 b_2 - a_2 b_1 \neq 0$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo Sistema determinado: solución única (rectas secantes)](/static/img/nodos/sistema-determinado-solucion-unica-rectas-secantes-ejemplos.svg)


    Clasifica el sistema $\begin{cases} 3x + 4y = 10 \\ 2x - 5y = 7 \end{cases}$ analizando la razón de sus coeficientes y determina si es un sistema compatible determinado.'
  pasos:
  - 'Paso 1: Calcular la razón entre los coeficientes de $x$: $\frac{a_1}{a_2} = \frac{3}{2}$.'
  - 'Paso 2: Calcular la razón entre los coeficientes de $y$: $\frac{b_1}{b_2} = \frac{4}{-5} = -\frac{4}{5}$.'
  - 'Paso 3: Comparar ambas razones numéricas: $\frac{3}{2} \neq -\frac{4}{5}$.'
  - 'Paso 4: Concluir que el sistema es **compatible determinado** (SCD) y posee una solución única representada por dos rectas secantes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición algebraica sobre la razón de coeficientes $\frac{a_1}{a_2}$ y $\frac{b_1}{b_2}$ garantiza que un sistema 2x2 sea compatible determinado?
  choices:
  - text: $\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$
    is_correct: true
  - text: $\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$
    is_correct: false
  - text: $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$
    is_correct: false
  - text: $a_1 b_2 - a_2 b_1 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el sistema $\begin{cases} 3x + 4y = 10 \\ 2x - 5y = 7 \end{cases}$, ¿cómo se comportan geométricamente sus rectas asociadas?
  choices:
  - text: Son rectas secantes que se cortan en un único punto.
    is_correct: true
  - text: Son rectas paralelas disjuntas que jamás se intersecan.
    is_correct: false
  - text: Son rectas coincidentes que forman la misma línea.
    is_correct: false
  - text: Son rectas perpendiculares proyectadas en un plano tridimensional.
    is_correct: false
  explanation: La alternativa correcta es 'Son rectas secantes que se cortan en un único punto.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los coeficientes $a_1, a_2$ de $x$ y $b_1, b_2$ de $y$ en el sistema canónico.'
- 'Paso 2: Construir las razones $\frac{a_1}{a_2}$ y $\frac{b_1}{b_2}$.'
- 'Paso 3: Simplificar ambas expresiones fraccionarias a su mínima expresión.'
- 'Paso 4: Si $\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$, clasificar el sistema como Compatible Determinado (SCD).'
- 'Paso 5: Reportar que las rectas asociadas son secantes y se cortan en un único punto.'
errores_correccion: '- **Error 1:** Incluir las constantes del término independiente $c_1, c_2$ para decidir si un sistema es compatible determinado. **Cómo corregirlo:** La condición de solución única **DEPENDE EXCLUSIVAMENTE DE LA DESIGUALDAD DE LOS COEFICIENTES DE LAS VARIABLES ($\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$); LAS CONSTANTES INDEPENDIENTES NO ALTERAN LA CONDICIÓN DE SECANTES**.

  - **Error 2:** Confundir la clasificación de compatible determinado (solución única) con la de indeterminado (infinitas soluciones). **Cómo corregirlo:** En un sistema compatible determinado **LAS RAZONES DE COEFICIENTES SON DESIGUALES ($\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$), MIENTRAS QUE EN UNO INDETERMINADO TODAS LAS RAZONES SON IGUALES**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿El sistema $\begin{cases} x + 2y = 5 \\ 3x - y = 2 \end{cases}$ es compatible determinado?
  alternativas:
  - Sí, pues $\frac{1}{3} \neq -2$
  - No, pues no hay solución
  - No, pues las soluciones son infinitas
  respuesta: Sí, pues $\frac{1}{3} \neq -2$
  solucion_pasos:
  - 1. $\frac{a_1}{a_2} = \frac{1}{3}$.
  - 2. $\frac{b_1}{b_2} = \frac{2}{-1} = -2$.
  - 3. Como $\frac{1}{3} \neq -2$, es SCD.
- titulo: Ejemplo 2
  enunciado: ¿Qué valor del parámetro $k$ hace que el sistema $\begin{cases} kx + y = 3 \\ 4x + 2y = 1 \end{cases}$ sea compatible determinado?
  alternativas:
  - $k \neq 2$
  - $k = 2$
  - $k = 4$
  respuesta: $k \neq 2$
  solucion_pasos:
  - 1. Exigir $\frac{k}{4} \neq \frac{1}{2}$.
  - 2. $2k \neq 4 \implies k \neq 2$.
- titulo: Solución única y rectas secantes
  enunciado: ¿Un sistema compatible determinado se representa siempre en el plano por rectas secantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, el punto de corte de las rectas secantes representa la solución única.
- titulo: Determinante no nulo
  enunciado: ¿La condición $\Delta \neq 0$ es equivalente a que el sistema sea compatible determinado?
  respuesta: Sí
  solucion_pasos:
  - Sí, pues $\Delta = a_1 b_2 - a_2 b_1 \neq 0 \iff \frac{a_1}{a_2} \neq \frac{b_1}{b_2}$.
errores_frecuentes:
- Para verificar si un sistema es compatible determinado, se exige la igualdad de las constantes independientes $\frac{c_1}{c_2}$ junto a la de los coeficientes.
- La condición de solución única en un sistema $2 \times 2$ requiere que las razones de coeficientes sean iguales $\frac{a_1}{a_2} = \frac{b_1}{b_2}$.
- En un sistema compatible determinado, las rectas asociadas en el plano cartesiano son paralelas disjuntas que jamás se intersecan.
- El determinante del sistema $\Delta = a_1 b_2 - a_2 b_1$ en un sistema compatible determinado debe ser estrictamente igual a cero.
- Dos rectas secantes que se cortan en un punto fuera del primer cuadrante del plano cartesiano pierden la clasificación de sistema determinado.
afirmaciones_verdaderas:
- Un sistema 2x2 es compatible determinado si y solo si las razones de los coeficientes de $x$ e $y$ son distintas ($\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$).
- La representación gráfica de un sistema compatible determinado consiste en dos rectas secantes que se cortan en un único punto del plano.
al_terminar_debes_poder: '**QUÉ:** Identificar y clasificar un sistema compatible determinado (SCD).


  **CÓMO:** Comprobando que los coeficientes de las variables no son proporcionales ($\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$), lo que genera rectas secantes con solución única.


  ![Resumen Sistema determinado: solución única (rectas secantes)](/static/img/nodos/sistema-determinado-solucion-unica-rectas-secantes-resumen.svg)'
