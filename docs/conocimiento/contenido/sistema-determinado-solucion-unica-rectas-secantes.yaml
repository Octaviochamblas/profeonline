semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SISTEMA_DETERMINADO
resumen_inicial: Un sistema es compatible determinado cuando posee una única solución,
  lo que gráficamente corresponde a dos rectas secantes.
explicacion_simple: 'Un sistema de ecuaciones es **compatible determinado** cuando
  tiene UNA SOLA solución $(x, y)$.

  Geométricamente, esto significa que las dos rectas tienen pendientes distintas ($m_1
  \neq m_2$), por lo que son **rectas secantes** que se cortan en un único punto del
  plano.'
explicacion_formal: 'El sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2
  y = c_2 \end{cases}$ es **compatible determinado** si y solo si sus coeficientes
  satisfacen:


  $$\frac{a_1}{a_2} \neq \frac{b_1}{b_2} \iff a_1 b_2 - a_2 b_1 \neq 0 \iff \Delta
  \neq 0$$


  $$\text{Geometría: } L_1 \text{ y } L_2 \text{ son rectas secantes } \implies |L_1
  \cap L_2| = 1$$'
definiciones_clave: '- **Sistema compatible determinado (SCD)**: Sistema lineal que
  posee exactamente una solución única.

  - **Rectas secantes**: Dos rectas que se cortan en exactamente un punto debido a
  tener pendientes diferentes ($m_1 \neq m_2$).'
propiedades_relaciones: '- **Proporcionalidad de coeficientes**: Las razones de los
  coeficientes de $x$ e $y$ son distintas ($\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$).'
ejemplo_guiado:
  enunciado: Clasifica el sistema $\begin{cases} 3x + 4y = 10 \\ 2x - 5y = 7 \end{cases}$
    analizando la razón de sus coeficientes y determina si es un sistema compatible
    determinado.
  pasos:
  - 'Paso 1: Calcular la razón de los coeficientes de $x$: $\frac{a_1}{a_2} = \frac{3}{2}$.Paso
    2: Calcular la razón de los coeficientes de $y$: $\frac{b_1}{b_2} = \frac{4}{-5}
    = -\frac{4}{5}$.Paso 3: Comparar las razones: $\frac{3}{2} \neq -\frac{4}{5}$.Paso
    4: Concluir que el sistema es **compatible determinado** (SCD) y posee una solución
    única representada por dos rectas secantes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición sobre la razón de coeficientes $\frac{a_1}{a_2}$ y $\frac{b_1}{b_2}$
    garantiza que un sistema 2x2 sea compatible determinado?
  choices:
  - text: $\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$
    is_correct: true
  - text: $\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$
    is_correct: false
  - text: $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$
    is_correct: false
  - text: $a_1 b_2 - a_2 b_1 = 0$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para el sistema $\begin{cases} 3x + 4y = 10 \\ 2x - 5y = 7 \end{cases}$,
    ¿cómo se comportan geométricamente sus rectas asociadas?
  choices:
  - text: Son rectas secantes que se cortan en un único punto.
    is_correct: true
  - text: Son rectas paralelas que no se cortan nunca.
    is_correct: false
  - text: Son rectas coincidentes que forman la misma línea.
    is_correct: false
  - text: Son rectas curvas perpendiculares al eje $z$.
    is_correct: false
  explanation: La alternativa correcta es 'Son rectas secantes que se cortan en un
    único punto.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los coeficientes $a_1, a_2$ de $x$ y $b_1, b_2$ de $y$.'
- 'Paso 2: Formar las razones fraccionarias $\frac{a_1}{a_2}$ y $\frac{b_1}{b_2}$.'
- 'Paso 3: Simplificar ambas fracciones.'
- 'Paso 4: Si las fracciones son distintas, clasificar el sistema como Compatible
  Determinado (solución única, rectas secantes).'
errores_correccion: '- **Error común:** Confundir un sistema determinado con uno que
  no tiene solución.

  - **Cómo corregirlo:** Si la razón de coeficientes de $x$ y de $y$ son DISTINTAS,
  el sistema SIEMPRE tiene solución única.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de clasificación.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de clasificación.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un sistema con solución única se representa por dos rectas secantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, se cortan en un único punto del plano.
- titulo: ¿Dos rectas paralelas representan un sistema sin solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, al no tener puntos en común no existe solución.
errores_frecuentes:
- Confundir las condiciones de proporcionalidad para solución única y sin solución.
- Asumir que la lectura gráfica sustituye la comprobación algebraica en las ecuaciones.
- Olvidar incluir el término constante al evaluar la condición de infinitas soluciones.
- Invertir los ejes $x$ e $y$ al leer las coordenadas de intersección del gráfico.
- Confundir la igualdad de pendientes con la coincidencia total de las rectas.
afirmaciones_verdaderas:
- Un sistema 2x2 es compatible determinado si las rectas asociadas tienen pendientes
  distintas y se cortan en un único punto.
- Si las razones de los coeficientes de $x$ e $y$ son iguales pero distintas a la
  razón de las constantes, el sistema es incompatible.
al_terminar_debes_poder: Al finalizar este recurso podrás clasificar sistemas 2x2
  e interpretar sus soluciones desde la perspectiva geométrica y paramétrica.
