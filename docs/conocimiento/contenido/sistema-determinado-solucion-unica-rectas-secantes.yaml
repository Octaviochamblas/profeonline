semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SISTEMA_DETERMINADO
resumen_inicial: 'Sistema determinado: solución única (rectas secantes): propiedades,
  resolución y modelamiento en Representación y clasificación de sistemas 2x2.'
explicacion_simple: En el mundo de los dibujos, esto ocurre cuando las dos rectas
  tienen inclinaciones (pendientes) diferentes. Tarde o temprano, como si fueran dos
  espadas cruzadas, chocarán en un único punto.
explicacion_formal: '### Definición formal


  Un sistema $a_1x+b_1y=c_1$, $a_2x+b_2y=c_2$ es compatible determinado (tiene exactamente
  una solución) si y solo si sus pendientes son distintas, $\frac{a_1}{b_1} \neq \frac{a_2}{b_2}$;
  geométricamente, las rectas asociadas son secantes y se cruzan en un único punto.


  ### Desarrollo didáctico


  En el mundo de los dibujos, esto ocurre cuando las dos rectas tienen inclinaciones
  (pendientes) diferentes. Tarde o temprano, como si fueran dos espadas cruzadas,
  chocarán en un único punto.


  Algebraicamente, te das cuenta de que es determinado porque al aplicar tus métodos,
  llegas felizmente a algo como ''$x=3$, $y=4$''.'
definiciones_clave: '- **Sistema determinado: solución única (rectas secantes)**:
