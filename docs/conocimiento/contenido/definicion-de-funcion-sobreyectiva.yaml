semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.SOBREYECTIVA_DEFINICION
resumen_inicial: 'Definición de función sobreyectiva: conceptos, representación y
  propiedades en Tipos de funciones y función inversa.'
explicacion_simple: 'En algunas funciones, ningún elemento del conjunto de llegada
  queda "sin visita": todos son imagen de algo. Esa propiedad se llama sobreyectividad.'
explicacion_formal: '### Definición formal


  Una función $f\colon A \to B$ es sobreyectiva si para todo $y \in B$ existe al menos
  un $x \in A$ tal que $f(x)=y$. Esta condición es equivalente a que el recorrido
  de $f$ coincida exactamente con el codominio declarado, $\text{Rec}(f)=B$.


  ### Desarrollo didáctico


  La sobreyectividad depende crucialmente del codominio declarado: la misma fórmula
  puede ser sobreyectiva o no, según qué conjunto de llegada se elija.


  Si $f\colon \mathbb{R} \to \mathbb{R}$ con $f(x)=x^2$, no es sobreyectiva (los negativos
  del codominio nunca son imagen). Pero si se redefine como $f\colon \mathbb{R} \to
  [0,+\infty[$, la misma fórmula sí es sobreyectiva, porque ahora el codominio coincide
  exactamente con el recorrido.'
definiciones_clave: '- **Definición de función sobreyectiva**: Elemento central en
  el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a definición de función sobreyectiva.'
