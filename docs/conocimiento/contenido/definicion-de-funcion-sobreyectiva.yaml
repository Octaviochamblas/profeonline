semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.SOBREYECTIVA_DEFINICION
resumen_inicial: Una función es sobreyectiva (o epiyectiva) si su conjunto recorrido es exactamente igual a su conjunto codominio.
explicacion_simple: |
  Una **función sobreyectiva** significa que **no sobra nada en la llegada**:

  - Cada elemento del conjunto de llegada (codominio $B$) recibe **al menos una flecha**.
  - No hay ningún número "abandonado" o sin uso en el conjunto de llegada.
  - Se cumple que: **Recorrido = Codominio**.
explicacion_formal: |
  Sea $f: A \to B$ una función con dominio $A$ y codominio $B$. $f$ es **sobreyectiva** (o epiyectiva) si todo elemento del codominio es imagen de al menos un elemento del dominio:

  $$\forall y \in B, \quad \exists x \in A \quad \text{tal que} \quad f(x) = y$$

  **Condición de conjuntos equivalente:**
  $$\text{Rec}(f) = \{f(x) \mid x \in A\} = B$$
definiciones_clave: |
  - **Función sobreyectiva (epiyectiva)**: Mapeo funcional donde el conjunto de imágenes (recorrido) cubre la totalidad del conjunto de llegada (codominio).
propiedades_relaciones: |
  - **Restricción de codominio**: Cualquier función no sobreyectiva $f: A \to B$ se puede transformar en sobreyectiva redefiniendo su codominio para que coincida exactamente con su recorrido ($B' = \text{Rec}(f)$).
ejemplo_guiado:
  enunciado: 'Analiza la función $f: \mathbb{R} \to \mathbb{R}$ dada por $f(x) = 2x + 3$ y determina si es sobreyectiva.'
  pasos:
    - 'Paso 1: Identificar el codominio declarado: $B = \mathbb{R}$.'
    - 'Paso 2: Determinar el recorrido de la función afín: como $f(x) = 2x + 3$ es afín con $m \neq 0$, toma todos los valores reales $\implies \text{Rec}(f) = \mathbb{R}$.'
    - 'Paso 3: Comparar recorrido y codominio: $\text{Rec}(f) = \mathbb{R} = B$.'
    - 'Paso 4: Concluir que $f$ es sobreyectiva.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuándo una función $f: A \to B$ se clasifica formalmente como sobreyectiva?'
    choices:
      - {text: 'Cuando su recorrido es idéntico a su codominio (Rec(f) = B)', is_correct: true}
      - {text: 'Cuando no se repiten valores de salida', is_correct: false}
      - {text: 'Cuando su pendiente es igual a cero', is_correct: false}
      - {text: 'Cuando pasa por el origen $(0,0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Cuando su recorrido es idéntico a su codominio (Rec(f) = B)''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si $f: \mathbb{R} \to \mathbb{R}$ está dada por $f(x) = x^2$, ¿por qué NO es sobreyectiva sobre $\mathbb{R}$?'
    choices:
      - {text: 'Porque su recorrido es $[0, +\infty[$ y no incluye los números reales negativos de $\mathbb{R}$', is_correct: true}
      - {text: 'Porque la parábola es simétrica', is_correct: false}
      - {text: 'Porque evalúa números pares', is_correct: false}
      - {text: 'Porque su gráfica corta al eje X', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque su recorrido es $[0, +\infty[$ y no incluye los números reales negativos de $\mathbb{R}$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el conjunto codominio $B$ explícitamente dado en la definición $f: A \to B$.'
  - 'Paso 2: Calcular el conjunto recorrido $\text{Rec}(f)$ encontrando todas las imágenes posibles.'
  - 'Paso 3: Comparar los conjuntos $\text{Rec}(f)$ y $B$.'
  - 'Paso 4: Si $\text{Rec}(f) = B$, declarar la función como sobreyectiva.'
errores_correccion: |
  - **Error común:** Asumir que toda función matemática es automáticamente sobreyectiva sin revisar el codominio $B$ declarado.
  - **Cómo corregirlo:** Revisa siempre el conjunto de llegada $B$ declarado en $f: A \to B$; la sobreyectividad DEPENDE del codominio especificado.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función sobreyectiva.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función sobreyectiva.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una función es sobreyectiva cuando a cada elemento del dominio le corresponde una única imagen distinta.'
  - 'La función $f: \mathbb{R} \to \mathbb{R}$ dada por $f(x) = x^2$ es sobreyectiva porque sus resultados son positivos.'
  - 'Para que una función sea sobreyectiva, el conjunto recorrido debe ser un subconjunto estrictamente más pequeño que el codominio.'
  - 'Una función afín $f: \mathbb{R} \to \mathbb{R}$ con $m \neq 0$ nunca es sobreyectiva.'
  - 'La sobreyectividad de una función depende exclusivamente de los elementos del dominio $A$.'
afirmaciones_verdaderas:
  - 'Una función $f: A \to B$ es sobreyectiva si y solo si todo elemento $y \in B$ posee al menos una preimagen $x \in A$ tal que $f(x) = y$.'
  - 'La propiedad de sobreyectividad equivale algebraicamente a la igualdad estricta entre el conjunto recorrido y el conjunto codominio ($\text{Rec}(f) = B$).'
al_terminar_debes_poder: |
  QUÉ: Definir y verificar la propiedad de sobreyectividad en funciones.
  CÓMO: Determinar el conjunto recorrido $\text{Rec}(f)$ y comprobar su coincidencia exacta con el codominio declarado $B$.
fuente: 'Texto escolar MINEDUC — Álgebra / Tipos de Funciones y Función Inversa'
estado: publicado
