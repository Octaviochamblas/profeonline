semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.SOBREYECTIVA_DEFINICION
resumen_inicial: Una función es sobreyectiva (epiyectiva) si su recorrido es igual
  a su codominio declarado (todo elemento del codominio tiene al menos una preimagen).
explicacion_simple: 'Una **función sobreyectiva** (o ''sobre'') no deja a ningún elemento
  ''libre'' o ''sin usar'' en el conjunto de llegada $B$.

  - Todo número del codominio $B$ es alcanzado por al menos una flecha.

  - En otras palabras: el **recorrido es exactamente igual al codominio** ($\operatorname{Rec}(f)
  = \text{Cod}(f)$).'
explicacion_formal: 'Una función $f: A \to B$ es **sobreyectiva (o epiyectiva)** si
  y solo si:


  $$\forall y \in B, \quad \exists x \in A \quad \text{tal que } y = f(x)$$

  $$\text{lo que equivale a: } \operatorname{Rec}(f) = B$$


  **Desglose de la fórmula:**

  - Cobertura total del conjunto de llegada: la imagen directa $f(A)$ coincide con
  la totalidad del codominio $B$.'
definiciones_clave: '- **Función sobreyectiva (epiyectiva)**: Función cuyo recorrido
  coincide plenamente con su conjunto de llegada declarado $B$.'
propiedades_relaciones: '- **Ajuste de codominio**: Cualquier función puede convertirse
  en sobreyectiva si se redefine su codominio para que sea igual a su recorrido.'
ejemplo_guiado:
  enunciado: 'Dada la función $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = x^2$, determina
    si es sobreyectiva y propone cómo redefinir su codominio para hacerla sobreyectiva.'
  pasos:
  - 'Paso 1: Identificar el codominio declarado: $B = \mathbb{R}$.Paso 2: Calcular
    el recorrido real de $f(x) = x^2$: $\operatorname{Rec}(f) = [0, +\infty[$.Paso
    3: Comprobar que $\operatorname{Rec}(f) \neq B$ (los números negativos como $-5$
    no tienen preimagen real) $\implies$ NO es sobreyectiva.Paso 4: Redefinir el codominio
    como $B'' = [0, +\infty[$ para que $f: \mathbb{R} \to [0, +\infty[$ sea sobreyectiva.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuál es la condición necesaria y suficiente para que una función $f:
    A \to B$ sea sobreyectiva?'
  choices:
  - text: Que su recorrido sea exactamente igual a su codominio ($\operatorname{Rec}(f)
      = B$).
    is_correct: true
  - text: Que a cada elemento de A le corresponda un solo elemento de B.
    is_correct: false
  - text: Que el dominio contenga solo números positivos.
    is_correct: false
  - text: Que la gráfica sea una recta horizontal.
    is_correct: false
  explanation: La alternativa correcta es 'Que su recorrido sea exactamente igual
    a su codominio ($\operatorname{Rec}(f) = B$).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: '¿Por qué $f: \mathbb{R} \to \mathbb{R}$ dada por $f(x) = x^2$ NO es sobreyectiva
    en los reales?'
  choices:
  - text: Porque los números reales negativos del codominio no son alcanzados por
      ningún cuadrado real.
    is_correct: true
  - text: Porque la parábola sube hacia arriba.
    is_correct: false
  - text: Porque pasa por el origen $(0,0)$.
    is_correct: false
  - text: Porque $x^2$ es de grado 2.
    is_correct: false
  explanation: La alternativa correcta es 'Porque los números reales negativos del
    codominio no son alcanzados por ningún cuadrado real.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el conjunto de llegada (codominio $B$) especificado en el enunciado.'
- 'Paso 2: Calcular el conjunto recorrido de la función $\operatorname{Rec}(f)$.'
- 'Paso 3: Comparar ambos conjuntos.'
- 'Paso 4: Si $\operatorname{Rec}(f) = B$, declarar que es sobreyectiva.'
errores_correccion: '- **Error común:** Analizar la sobreyectividad sin mirar el codominio
  declarado.

  - **Cómo corregirlo:** La sobreyectividad DEPENDE del codominio $B$ que te declaren
  en la función $f: A \to B$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de tipos de funciones y función inversa.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de tipos de funciones y función inversa.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función debe ser biyectiva para admitir función inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema fundamental de invertibilidad.
- titulo: ¿Las gráficas de f y su inversa son simétricas respecto a la recta y = x?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de reflexión especular de pares ordenados (x, y) a (y, x).
errores_frecuentes:
- Confundir el criterio de la línea horizontal (para inyectividad) con el criterio
  de la línea vertical (para ser función).
- Confundir la notación de función inversa $f^{-1}(x)$ con el recíproco o potencia
  $\frac{1}{f(x)}$.
- Intentar calcular la inversa de una función que no es biyectiva en los conjuntos
  considerados.
- Olvidar intercambiar las variables $x$ e $y$ al finalizar el algoritmo de despeje
  algebraico.
- Creer que la simetría gráfica de la función inversa es respecto al eje Y en lugar
  de la recta bisectriz $y = x$.
afirmaciones_verdaderas:
- Una función admite función inversa $f^{-1}$ si y solo si es biyectiva en sus conjuntos
  de definición.
- Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas respecto a
  la recta bisectriz del primer cuadrante $y = x$.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e identificar
  funciones inyectivas, sobreyectivas y biyectivas, calculando y verificando algebraicamente
  y gráficamente la función inversa.
fuente: Texto escolar MINEDUC — Álgebra / Tipos de Funciones y Función Inversa
