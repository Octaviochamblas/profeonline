semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.SOBREYECTIVA_DEFINICION
resumen_inicial: 'Una función $f: A \to B$ es sobreyectiva (o epiyectiva) si su recorrido coincide exactamente con todo el conjunto de llegada o codominio $B$: $\text{Rec}(f) = B$.'
explicacion_simple: '![Una función $f: A \to B$ es sobreyectiva (o epiyectiva) si su recorrido coincide exactamente con todo el conjunto de llegada o codominio $B$: $\text{Rec}(f) = B$](/static/img/nodos/definicion-de-funcion-sobreyectiva-intro.svg)



  Una función es **sobreyectiva** (o *epiyectiva*) cuando **no sobra ningún elemento en el conjunto de llegada $B$**:

  - Cada elemento $y$ del codominio tiene **al menos una preimagen $x$** que le apunta.

  - Todo el conjunto de llegada es alcanzado por la función (el Recorrido es igual al Codominio).


  Por ejemplo, si el codominio declarado es $\mathbb{R}$, una función afín $f(x) = 2x + 1$ es sobreyectiva porque puede dar como resultado cualquier número real.'
explicacion_formal: 'Sea $f: A \to B$ una función entre conjuntos no vacíos. Se define formalmente que $f$ es **sobreyectiva** (o **epiyectiva**) si y solo si:

  $$\forall y \in B, \; \exists x \in A \text{ tal que } f(x) = y \Longleftrightarrow \text{Rec}(f) = B$$


  **Aspectos formales fundamentales:**

  - **Dependencia del codominio**: La sobreyectividad no es una propiedad intrínseca de la fórmula algebraica, sino de la terna $(A, B, f)$.

  - **Ajuste de sobreyectividad**: Toda función $f: A \to B$ se puede transformar en sobreyectiva redefiniendo su codominio como $B'' = \text{Rec}(f)$.'
definiciones_clave: '- **Función sobreyectiva / epiyectiva**: Función donde todo elemento del codominio es imagen de al menos una preimagen.

  - **Codominio ($B$) vs Recorrido ($\text{Rec}(f)$)**: El codominio es el conjunto de llegada declarado; el recorrido es el subconjunto de valores efectivamente alcanzados.'
propiedades_relaciones: '- **Preimágenes no vacías**: $\forall y \in B, \; f^{-1}(\{y\}) \neq \emptyset$.

  - **Composición sobreyectiva**: Si $f: A \to B$ y $g: B \to C$ son sobreyectivas, su composición $g \circ f$ es sobreyectiva.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una función $f: A \to B$ es sobreyectiva (o epiyectiva) si su recorrido coincide exactamente con todo el conjunto de llegada o codominio $B$: $\text{Rec}(f) = B$](/static/img/nodos/definicion-de-funcion-sobreyectiva-ejemplos.svg)



    Determina si la función $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = 3x - 5$ es sobreyectiva.'
  pasos:
  - 'Paso 1: Tomar un elemento arbitrario $y \in \mathbb{R}$ (del conjunto de llegada).'
  - 'Paso 2: Plantear la ecuación $f(x) = y \implies 3x - 5 = y$.'
  - 'Paso 3: Despejar la preimagen: $3x = y + 5 \implies x = \frac{y + 5}{3}$.'
  - 'Paso 4: Verificar que para todo $y \in \mathbb{R}$, el valor $x = \frac{y + 5}{3}$ es un número real perteneciente al dominio $\mathbb{R}$.'
  - 'Paso 5: Concluir que $\text{Rec}(f) = \mathbb{R} = B$, por lo que $f$ es sobreyectiva.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuál es la condición matemática exacta para que una función f: A -> B sea sobreyectiva?'
  choices:
  - text: El recorrido de f es identico a todo el conjunto de llegada B (Rec(f) = B).
    is_correct: true
  - text: La funcion pasa por el origen (0, 0).
    is_correct: false
  - text: Cada preimagen tiene una unica imagen.
    is_correct: false
  - text: El dominio de f es igual al conjunto de los enteros.
    is_correct: false
  explanation: La alternativa correcta es 'El recorrido de f es identico a todo el conjunto de llegada B (Rec(f) = B).'. Cobertura completa del codominio.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'Para $g: \mathbb{R} \to \mathbb{R}$ con $g(x) = x^2$, ¿por qué NO es sobreyectiva?'
  choices:
  - text: Porque su recorrido es [0, +inf[ y no cubre los numeros reales negativos de B.
    is_correct: true
  - text: Porque no es inyectiva.
    is_correct: false
  - text: Porque g(0) = 0.
    is_correct: false
  - text: Porque el vertice esta en el origen.
    is_correct: false
  explanation: La alternativa correcta es 'Porque su recorrido es [0, +inf[ y no cubre los numeros reales negativos de B.'. Elementos como $y = -4$ no tienen preimagen real.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el conjunto de llegada o codominio $B$ fijado en la definición de la función.'
- 'Paso 2: Igualar la regla a $y$ ($y = f(x)$) y despejar la variable $x$ en términos de $y$.'
- 'Paso 3: Analizar si para todo $y \in B$ la expresión de $x$ existe y pertenece al dominio $A$.'
- 'Paso 4: Concluir si $\text{Rec}(f) = B$ (sobreyectiva) o $\text{Rec}(f) \subset B$ (no sobreyectiva).'
errores_correccion: '- **Error común:** Analizar la sobreyectividad sin fijarse en el conjunto de llegada $B$.

  - **Cómo corregirlo:** La sobreyectividad **siempre depende de $B$**; por ejemplo, $f(x) = x^2$ es sobreyectiva si $B = [0, +\infty[$, pero **no** lo es si $B = \mathbb{R}$.'
ejemplos:
- titulo: 'Ejemplo 1: Función afín en reales'
  enunciado: '¿Es $f: \mathbb{R} \to \mathbb{R}$ dada por $f(x) = -4x + 7$ sobreyectiva?'
  alternativas:
  - Sí, porque su recorrido son todos los reales R
  - No, porque la pendiente es negativa
  - No, porque tiene coeficiente de posición
  - Solo para números pares
  respuesta: Sí, porque su recorrido son todos los reales R
  solucion_pasos:
  - 'Paso 1: $x = \frac{7 - y}{4} \in \mathbb{R}$ para todo $y \in \mathbb{R}$, luego es sobreyectiva.'
- titulo: 'Ejemplo 2: Función valor absoluto en R'
  enunciado: 'Para $h: \mathbb{R} \to \mathbb{R}$ con $h(x) = |x|$, ¿es sobreyectiva?'
  alternativas:
  - No, porque Rec(h) = [0, +inf[ y no cubre los reales negativos
  - Sí, porque cubre todos los positivos
  - Sí, porque h(0) = 0
  - Solo en el origen
  respuesta: No, porque Rec(h) = [0, +inf[ y no cubre los reales negativos
  solucion_pasos:
  - 'Paso 1: Un número negativo como $y = -5$ no tiene preimagen con $|x| = -5$.'
- titulo: 'Ejemplo 3: Redefinición de codominio'
  enunciado: 'Si $g: \mathbb{R} \to [0, +\infty[$ con $g(x) = x^2$, ¿es sobreyectiva?'
  alternativas:
  - Sí, porque ahora el codominio coincide exactamente con el recorrido [0, +inf[
  - No, sigue siendo una cuadrática
  - No, porque no es inyectiva
  - Solo para números racionales
  respuesta: Sí, porque ahora el codominio coincide exactamente con el recorrido [0, +inf[
  solucion_pasos:
  - 'Paso 1: Al definir $B = [0, +\infty[$, $\text{Rec}(g) = B$, siendo sobreyectiva.'
- titulo: 'Ejemplo 4: Función cúbica'
  enunciado: '¿Es $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = x^3 - 2$ sobreyectiva?'
  alternativas:
  - Sí, porque x = cuberoot(y + 2) existe para todo real y
  - No, porque las cúbicas no tienen inversa
  - No, porque se traslada 2 unidades
  - Solo en los enteros
  respuesta: Sí, porque x = cuberoot(y + 2) existe para todo real y
  solucion_pasos:
  - 'Paso 1: La raíz cúbica de cualquier número real está bien definida en $\mathbb{R}$.'
errores_frecuentes:
- Confundir codominio con recorrido.
- Evaluar sobreyectividad sin considerar el conjunto de llegada declarado.
- Creer que una función no sobreyectiva no es una función válida.
afirmaciones_verdaderas:
- Una función es sobreyectiva si y solo si su recorrido es igual a todo su codominio.
- Toda función afín con m != 0 definida de R en R es sobreyectiva.
