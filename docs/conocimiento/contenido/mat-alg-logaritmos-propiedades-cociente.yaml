semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.COCIENTE
resumen_inicial: 'El logaritmo de un cociente es igual a la diferencia entre el logaritmo del numerador y el logaritmo del denominador: $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$.'
explicacion_simple: |
  Así como los logaritmos convierten las multiplicaciones en sumas, también convierten las divisiones internas en restas externas. Si tenemos el logaritmo de una fracción como $\log_2\left(\frac{32}{4}\right)$, podemos resolverlo de dos formas: hacer la división dentro ($32/4 = 8 \implies \log_2(8) = 3$) o separarlo en la resta del logaritmo de arriba menos el logaritmo de abajo ($\log_2(32) - \log_2(4) = 5 - 2 = 3$). Ambas formas dan exactamente el mismo resultado.
explicacion_formal: |
  ### Definición formal
  Para toda base $b \in \mathbb{R}^+ \setminus \{1\}$ y cualesquiera argumentos estrictamente positivos $x, y \in \mathbb{R}^+$, la **propiedad del logaritmo de un cociente** establece la identidad algebraicamente isomorfa:
  $$\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$$

  ### Demostración formal
  Sean $u = \log_b(x)$ y $v = \log_b(y) \implies x = b^u$ y $y = b^v$.
  Dividiendo las potencias miembro a miembro:
  $$\frac{x}{y} = \frac{b^u}{b^v} = b^{u - v}$$
  Aplicando la definición de logaritmo a la relación $\frac{x}{y} = b^{u - v}$:
  $$\log_b\left(\frac{x}{y}\right) = u - v = \log_b(x) - \log_b(y) \quad \blacksquare$$

  ### Síntesis didáctica
  Regla de doble sentido:
  - **Expansión de cociente**: $\log_b\left(\frac{x}{y}\right) \to \log_b(x) - \log_b(y)$.
  - **Compresión de resta**: Una resta de logaritmos de igual base se comprime en la división de sus argumentos: $\log_b(x) - \log_b(y) \to \log_b\left(\frac{x}{y}\right)$.
definiciones_clave: |
  - **Propiedad del cociente $\log_b(x/y) = \log_b(x) - \log_b(y)$**: Identidad que transforma el cociente de argumentos positivos en la diferencia de logaritmos.
  - **Compresión de resta logarítmica**: Proceso de unificación de dos términos restados en un solo logaritmo fraccionario.
  - **Numerador en la resta**: Término antecedente con signo positivo que pasa al numerador del argumento.
propiedades_relaciones: |
  - **Inversión por signo negativo**: Restar un logaritmo equivale a sumar el logaritmo del recíproco: $-\log_b(y) = \log_b\left(\frac{1}{y}\right)$.
  - **Combinación de operaciones**: Expresiones con sumas y restas de logaritmos combinan productos en los numeradores y divisiones en los denominadores: $\log_b(x) + \log_b(y) - \log_b(z) = \log_b\left(\frac{x \cdot y}{z}\right)$.
ejemplo_guiado:
  enunciado: 'Aplica la propiedad del cociente en los siguientes ejercicios: A) Descompón $\log_5\left(\frac{125}{5}\right)$, B) Comprime la resta $\log_3(54) - \log_3(2)$, C) Simplifica $\ln(80) - \ln(8) + \ln(3)$.'
  pasos:
    - 'Paso 1: Para $\log_5\left(\frac{125}{5}\right)$, aplicamos expansión: $\log_5(125) - \log_5(5) = 3 - 1 = 2$.'
    - 'Paso 2: Para $\log_3(54) - \log_3(2)$, como las bases son iguales, comprimimos dividiendo los argumentos: $\log_3\left(\frac{54}{2}\right) = \log_3(27) = 3$.'
    - 'Paso 3: Para $\ln(80) - \ln(8) + \ln(3)$, agrupamos los términos positivos en el numerador y los restados en el denominador: $\ln\left(\frac{80 \cdot 3}{8}\right) = \ln(10 \cdot 3) = \ln(30)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor numérico simplificado al comprimir en un solo logaritmo la resta $\log_2(80) - \log_2(5)$?'
    choices:
      - {text: '$\log_2(16) = 4$, dividiendo los argumentos $80 / 5 = 16$', is_correct: true}
      - {text: '$\log_2(75)$, restando los argumentos $80 - 5 = 75$', is_correct: false}
      - {text: '$\log_2(400)$, multiplicando los argumentos $80 \cdot 5 = 400$', is_correct: false}
      - {text: '$\log_0(16)$, restando las bases', is_correct: false}
    explanation: 'La alternativa correcta es ''$\log_2(16) = 4$, dividiendo los argumentos $80 / 5 = 16$''. La resta de logaritmos de igual base se condensa dividiendo los argumentos.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si sabemos que $\log_b(72) = 1.85$ y $\log_b(9) = 0.95$, ¿cuál es el valor exacto de $\log_b(8)$?'
    choices:
      - {text: '$0.90$, aplicando $\log_b\left(\frac{72}{9}\right) = \log_b(72) - \log_b(9) = 1.85 - 0.95 = 0.90$', is_correct: true}
      - {text: '$2.80$, sumando $1.85 + 0.95$', is_correct: false}
      - {text: '$1.7575$, multiplicando los valores', is_correct: false}
      - {text: '$1.947$, dividiendo los valores', is_correct: false}
    explanation: 'La alternativa correcta es ''$0.90$, aplicando $\log_b\left(\frac{72}{9}\right) = \log_b(72) - \log_b(9) = 1.85 - 0.95 = 0.90$''. Puesto que $8 = 72 / 9$, el logaritmo del cociente es la resta de los logaritmos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Para expandir $\log_b\left(\frac{x}{y}\right)$, restar el logaritmo del denominador al logaritmo del numerador: $\log_b(x) - \log_b(y)$.'
  - 'Paso 2: Para comprimir $\log_b(x) - \log_b(y)$, verificar que las bases sean idénticas.'
  - 'Paso 3: Escribir un único logaritmo en esa base y colocar en el numerador el argumento del término positivo y en el denominador el argumento del término restado.'
  - 'Paso 4: Simplificar la fracción resultante dentro del argumento.'
errores_correccion: |
  - **Error 1:** Confundir el logaritmo de una resta con la resta de logaritmos (ej: escribir $\log_b(x - y) = \log_b(x) - \log_b(y)$). **Cómo corregirlo:** La propiedad del cociente actúa sobre la **división interna**: $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$. El logaritmo de una resta $\log_b(x - y)$ no se puede separar.
  - **Error 2:** Dividir los logaritmos al comprimir una resta (ej: escribir $\log_b(x) - \log_b(y) = \frac{\log_b(x)}{\log_b(y)}$). **Cómo corregirlo:** Una resta de logaritmos genera un solo logaritmo de una fracción: $\log_b\left(\frac{x}{y}\right)$. La división entre logaritmos $\frac{\log_b(x)}{\log_b(y)}$ corresponde a un cambio de base.
ejemplos:
  - titulo: 'Compresión de resta logarítmica'
    enunciado: '¿A qué equivale $\log_4(48) - \log_4(3)$?'
    alternativas:
      - '$\log_4(16) = 2$'
      - '$\log_4(45)$'
      - '$\log_4(144)$'
    respuesta: '$\log_4(16) = 2$'
    solucion_pasos:
      - '1. Comprimimos dividiendo argumentos: $\log_4\left(\frac{48}{3}\right) = \log_4(16)$.'
      - '2. Calculamos $\log_4(16) = 2$.'
  - titulo: 'Expansión de cociente'
    enunciado: '¿La expresión $\ln\left(\frac{x}{e}\right)$ se expande como $\ln(x) - 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\ln\left(\frac{x}{e}\right) = \ln(x) - \ln(e) = \ln(x) - 1$.'
  - titulo: 'Resta de logaritmo con recíproco'
    enunciado: '¿La resta $\log(1) - \log(x)$ equivale a $-\log(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $\log(1) = 0$, $0 - \log(x) = -\log(x) = \log\left(\frac{1}{x}\right)$.'
  - titulo: 'Combinación de suma y resta'
    enunciado: '¿La expresión $\log(6) + \log(5) - \log(3)$ es igual a $\log(10) = 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Agrupamos: $\log\left(\frac{6 \cdot 5}{3}\right) = \log\left(\frac{30}{3}\right) = \log(10) = 1$.'
errores_frecuentes:
  - 'La expresión $\log_b(x - y)$ se expande erróneamente como la sustracción $\log_b(x) - \log_b(y)$.'
  - 'La sustracción de logaritmos $\log_b(x) - \log_b(y)$ equivale a la división entre dos logaritmos $\frac{\log_b(x)}{\log_b(y)}$.'
  - 'Al agrupar la sustracción $\log_5(50) - \log_5(2)$, la afirmación de que las bases se alteran dando $\log_0(25)$.'
  - 'El logaritmo de un cociente $\log_b(x / y)$ equivale a calcular la diferencia entre los argumentos $x - y$.'
  - 'La afirmación de que la propiedad del cociente permite combinar logaritmos con bases distintas.'
afirmaciones_verdaderas:
  - 'La propiedad del logaritmo de un cociente establece que $\log_b\left(\frac{x}{y}\right) = \log_b(x) - \log_b(y)$ para argumentos estrictamente positivos.'
  - 'Restar el logaritmo de un argumento $y$ equivale a sumar el logaritmo de su inverso multiplicativo $\log_b\left(\frac{1}{y}\right)$.'
al_terminar_debes_poder: |
  QUÉ: Aplicar la propiedad del logaritmo de un cociente ($\log_b(x / y) = \log_b(x) - \log_b(y)$).
  CÓMO: Transformar cocientes en la sustracción de logaritmos de igual base, justificando la equivalencia mediante las leyes de exponentes.
