semantic_id: MAT.ALG.LOGARITMOS_PROPIEDADES.COCIENTE
resumen_inicial: 'Aplicación de la propiedad del logaritmo de un cociente: conceptos,
  asíntotas, propiedades e inversidad en Logaritmos y sus propiedades.'
explicacion_simple: Así como el producto se transforma en una suma de logaritmos,
  el cociente se transforma en una resta, siguiendo la misma lógica de las potencias.
explicacion_formal: '### Definición formal


  Para $b>0$, $b\neq1$, $x>0$ e $y>0$, se cumple $\log_b(x/y)=\log_b(x)-\log_b(y)$.
  Se demuestra definiendo $m=\log_b(x)$ y $n=\log_b(y)$, de modo que $b^m=x$ y $b^n=y$;
  al dividir, $x/y=b^{m-n}$, y aplicando el logaritmo se obtiene la igualdad.


  ### Desarrollo didáctico


  $\log_2(32/4)=\log_2(32)-\log_2(4)=5-2=3$, lo mismo que calcular directamente $\log_2(8)=3$.
  En álgebra, esto permite separar $\log_b(x/y^2)$ en $\log_b(x)-\log_b(y^2)$, preparando
  la expresión para simplificar el segundo término con la propiedad de la potencia.'
definiciones_clave: '- **Aplicación de la propiedad del logaritmo de un cociente**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a aplicación de la propiedad del logaritmo de un cociente.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de aplicación
    de la propiedad del logaritmo de un cociente.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de aplicación de la propiedad
    del logaritmo de un cociente.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    aplicación de la propiedad del logaritmo de un cociente?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en logaritmos y sus
      propiedades
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en logaritmos y sus propiedades. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en aplicación de la propiedad del logaritmo de un cociente?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el cociente dentro del argumento del logaritmo.'
- 'Paso 2: Separa el logaritmo en una resta de logaritmos: numerador menos denominador.'
- 'Paso 3: Verifica que tanto el numerador como el denominador sean positivos antes
  de dar por válida la separación.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en aplicación
  de la propiedad del logaritmo de un cociente.
ejemplos:
- titulo: Separación de un cociente numérico
  enunciado: Aplica la propiedad del cociente a $\log_3(81/9)$.
  solucion_pasos:
  - Se separa en $\log_3(81)-\log_3(9)$.
  - 'Se calcula: $4-2=2$, igual a $\log_3(9)=2$.'
- titulo: Separación de un cociente algebraico
  enunciado: Aplica la propiedad del cociente a $\log_4(x^3/y)$.
  solucion_pasos:
  - Se separa en $\log_4(x^3)-\log_4(y)$.
  - La expresión queda lista para simplificar $\log_4(x^3)$ con la propiedad de la
    potencia.
- titulo: ¿Se puede aplicar la propiedad del cociente si el denominador es negativo?
  enunciado: ¿Es válido separar $\log_5(x/(-y))$ como $\log_5(x)-\log_5(-y)$?
  respuesta: 'No'
  solucion_pasos:
  - El denominador debe ser positivo por separado; $-y$ no cumple esa condición si
    $y>0$.
- titulo: ¿El orden de la resta importa en la propiedad del cociente?
  enunciado: ¿Es lo mismo $\log_b(x)-\log_b(y)$ que $\log_b(y)-\log_b(x)$?
  respuesta: 'No'
  solucion_pasos:
  - El primero equivale a $\log_b(x/y)$ y el segundo a $\log_b(y/x)$, expresiones
    distintas salvo que $x=y$.
errores_frecuentes:
- Invertir el orden de la resta al separar el cociente, cambiando el resultado.
- Confundir la propiedad del cociente con una división entre logaritmos, $\log_b(x)/\log_b(y)$.
- Aplicar la separación sin verificar que numerador y denominador sean ambos positivos.
- Olvidar que la propiedad solo aplica a cocientes, no a restas dentro del argumento.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando aplicación de la propiedad del logaritmo de un cociente.
