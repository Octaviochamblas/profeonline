    considera un ángulo $\alpha = 118^\circ$ ubicado en la posición dada. Determina
    el valor de la medida asociada sabiendo que $x + 1181^\circ = 118^\circ$.
  pasos:
  - Identificar la propiedad de propiedad de ángulos congruentes en un polígono regular
    referida a $\alpha = 118^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1181 = 118 \implies x = 118 - 1181$.'
  - Concluir que la medida calculada para propiedad de ángulos congruentes en un polígono
    regular es $x = -1063^\circ$.
