semantic_id: MAT.GEO.POLIGONOS_METRICA.REGULAR_ANGULOS_CONGRUENTES
resumen_inicial: 'Propiedad de ángulos congruentes en un polígono regular: conceptos,
  teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Junto a la congruencia de lados, la otra característica esencial
  de los polígonos regulares es la uniformidad perfecta de sus ángulos.
explicacion_formal: '![Ángulos congruentes en un polígono regular](/static/img/geometria/poligonos-cuadrilateros/poligonos-regular-angulos-congruentes.svg)


  ### Definición formal


  Un polígono regular de $n$ lados tiene todos sus ángulos interiores de igual medida,
  cada uno igual a $\frac{180°(n-2)}{n}$.


  ### Desarrollo didáctico


  Un hexágono regular tiene sus 6 ángulos interiores exactamente iguales, cada uno
  midiendo $\frac{180°\times4}{6}=120°$. Un polígono podría tener todos sus lados
  iguales pero ángulos distintos (como un rombo no cuadrado), por lo que ambas condiciones
  (lados y ángulos congruentes) son necesarias para la regularidad.'
definiciones_clave: '- **Propiedad de ángulos congruentes en un polígono regular**:
