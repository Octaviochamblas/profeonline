procedimiento:
- 'Paso 1: Verifica que el polígono sea regular.'
- 'Paso 2: Si es regular, todos sus ángulos interiores tienen la misma medida.'
- 'Paso 3: Esa medida se puede calcular dividiendo la suma total de ángulos interiores
  entre el número de ángulos (n).'
