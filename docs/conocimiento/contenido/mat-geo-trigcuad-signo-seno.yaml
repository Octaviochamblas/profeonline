semantic_id: MAT.GEO.TRIG_CUADRANTES.SIGNO_SENO
resumen_inicial: 'Identificación del signo del seno según el cuadrante: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: El seno de un ángulo, definido como la coordenada y de un punto
  en el lado terminal (dividida por el radio, siempre positivo), tiene signo positivo
  cuando esa coordenada y es positiva, y negativo cuando es negativa.
explicacion_formal: '![Signo del seno por cuadrante](/static/img/geometria/trigonometria/trigcuad-signo-seno.svg)


  ### Definición formal


  Si $P=(x,y)$ es un punto sobre el lado terminal de $\theta$ a distancia $r$ del
  origen, entonces $\sin\theta=\dfrac{y}{r}$, con $r>0$ siempre. Por lo tanto, el
  signo de $\sin\theta$ coincide con el signo de $y$.


  ### Desarrollo didáctico


  En los cuadrantes I y II, la coordenada y es positiva (por encima del eje x), por
  lo que $\sin\theta>0$. En los cuadrantes III y IV, la coordenada y es negativa (por
  debajo del eje x), por lo que $\sin\theta<0$.'
definiciones_clave: '- **Identificación del signo del seno según el cuadrante**: Elemento
