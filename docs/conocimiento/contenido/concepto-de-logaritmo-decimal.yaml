resumen_inicial: 'El logaritmo decimal (o vulgar) es aquel cuya base es diez ($b =
  10$), abreviándose convencionalmente sin escribir la base: $\log(a) \equiv \log_{10}(a)$.'
explicacion_simple: Cuando veas la palabra 'log' sola sin ningún número pequeño abajo,
  significa que es un logaritmo en base 10. Por ejemplo, $\log(100) = 2$ porque 10
  elevado a 2 da 100.
explicacion_formal: 'Para todo argumento $a > 0$, el **Logaritmo Decimal** adopta
  la convención de omitir la base $10$:


  $$\log(a) = c \iff \log_{10}(a) = c \iff 10^c = a$$


  **Escala decimal:**

  - $\log(1) = 0$, $\log(10) = 1$, $\log(100) = 2$, $\log(1000) = 3$.

  - $\log(0,1) = -1$, $\log(0,01) = -2$.'
definiciones_clave: '- **Logaritmo decimal**: Notación $\log(a)$ con base implícita
  $b = 10$.'
propiedades_relaciones: '- **Base diez implícita**: $\log(a) \equiv \log_{10}(a)$.'
ejemplo_guiado:
  enunciado: Calcule el valor de los logaritmos decimales $\log(1000)$ y $\log(0,001)$.
  pasos:
  - 'Paso 1: Para $\log(1000)$, la base implícita es $10 \implies 10^c = 1000 = 10^3
    \implies c = 3$.'
  - 'Paso 2: Para $\log(0,001)$, la base implícita es $10 \implies 10^c = 0,001 =
    10^{-3} \implies c = -3$.'
  - 'Conclusión: $\log(1000) = 3$ y $\log(0,001) = -3$.'
