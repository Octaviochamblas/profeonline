semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.LOGARITMO_DECIMAL
resumen_inicial: 'El logaritmo decimal o vulgar es un logaritmo cuya base es exactamente diez ($b = 10$) y su notación omite la escritura explícita del subíndice: $\log(x) = \log_{10}(x)$.'
explicacion_simple: |
  En matemáticas y ciencias, el sistema de numeración habitual es en base 10. Por eso, el logaritmo en base 10 es tan común que por convención universal no se le escribe el número 10 abajo. Cuando ves la palabra $\log(x)$ sin ningún subíndice escrito, se entiende automáticamente que la base es 10. Por ejemplo, $\log(100)$ significa $\log_{10}(100)$, y su valor es 2 porque $10^2 = 100$.
explicacion_formal: |
  ### Definición formal
  El **logaritmo decimal** (también denominado logaritmo vulgar o de Briggs) es el sistema logarítmico cuya base fija es $b = 10$:
  $$\log(x) \equiv \log_{10}(x) \quad (x > 0)$$

  ### Propiedades y Notación Convencional
  1. **Omisión del subíndice**: La ausencia de subíndice implica formalmente la base decimal:
     $$\log(a) = c \iff 10^c = a$$
  2. **Valores exactos en potencias de 10**: Para cualquier entero $k \in \mathbb{Z}$:
     $$\log(10^k) = k$$
     - $\log(1) = \log(10^0) = 0$
     - $\log(10) = \log(10^1) = 1$
     - $\log(100) = \log(10^2) = 2$
     - $\log(0.1) = \log(10^{-1}) = -1$

  ### Síntesis didáctica
  - Base por defecto: $10$.
  - Notación estándar en calculadoras científicas: Botón `LOG`.
definiciones_clave: |
  - **Logaritmo decimal $\log(x)$**: Sistema logarítmico de base 10 con omitting del subíndice por convención universal.
  - **Logaritmo vulgar**: Denominación histórica en honor a Henry Briggs del sistema logarítmico decimal.
  - **Característica y Mantisa**: Partes entera y decimal respectivamente de la representación decimal de un logaritmo.
propiedades_relaciones: |
  - **Escalas logarítmicas en ciencia**: Es la base empleada para medir la magnitud de sismos (Escala de Richter), la acidez de soluciones (Escala de pH) y la intensidad del sonido (Decibeles).
  - **Cambio de base en calculadoras**: Permite calcular logaritmos en cualquier base $b$ mediante la fórmula $\log_b(a) = \frac{\log(a)}{\log(b)}$.
ejemplo_guiado:
  enunciado: 'Calcula el valor numérico simplificado de la expresión con logaritmos decimales $D = \log(1000) + \log(0.01)$.'
  pasos:
    - 'Paso 1: Reconocemos que la notación $\log$ omite el subíndice, indicando la base decimal $b = 10$.'
    - 'Paso 2: Evaluamos el primer término convirtiendo $1000$ a potencia de $10$: $1000 = 10^3 \implies \log(10^3) = 3$.'
    - 'Paso 3: Evaluamos el segundo término convirtiendo el decimal $0.01$ a potencia de $10$: $0.01 = 10^{-2} \implies \log(10^{-2}) = -2$.'
    - 'Paso 4: Sumamos los valores obtenidos: $D = 3 + (-2) = 1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué base numérica se asume por convención universal cuando una expresión logarítmica omite la escritura del subíndice ($\log(x)$)?'
    choices:
      - {text: 'Base 10 ($\log_{10}(x)$)', is_correct: true}
      - {text: 'Base 2 ($\log_2(x)$)', is_correct: false}
      - {text: 'Base $e$ ($\log_e(x)$)', is_correct: false}
      - {text: 'Base 1 ($\log_1(x)$)', is_correct: false}
    explanation: 'La alternativa correcta es ''Base 10 ($\log_{10}(x)$)''. Por convención matemática, la notación $\log(x)$ omite el subíndice 10 representando al logaritmo decimal.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor numérico del logaritmo decimal $\log(10000)$?'
    choices:
      - {text: '$4$, pues $10^4 = 10000$', is_correct: true}
      - {text: '$1000$, dividiendo $10000 / 10$', is_correct: false}
      - {text: '$10$, por ser la base decimal', is_correct: false}
      - {text: '$40$, multiplicando $10 \cdot 4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$4$, pues $10^4 = 10000$''. Como $10000 = 10^4$, el resultado es el exponente 4.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar que la notación $\log(x)$ carece de subíndice y corresponde a la base $10$.'
  - 'Paso 2: Expresar el argumento $x$ como una potencia de base 10 ($10^k$).'
  - 'Paso 3: Aplicar la equivalencia $\log(10^k) = k$ para extraer el exponente.'
  - 'Paso 4: Operar aritméticamente el resultado $k$ en la expresión requerida.'
errores_correccion: |
  - **Error 1:** Asumir que la falta de subíndice en $\log(x)$ significa que la base es 1 o 0. **Cómo corregirlo:** En la notación matemática estándar, cuando no hay subíndice escrito, **la base es siempre 10**: $\log(x) = \log_{10}(x)$.
  - **Error 2:** Confundir el logaritmo decimal $\log(x)$ con el logaritmo natural $\ln(x)$. **Cómo corregirlo:** La notación $\log(x)$ utiliza base 10, mientras que $\ln(x)$ utiliza el número irracional de Euler $e \approx 2.71828$.
ejemplos:
  - titulo: 'Cálculo de logaritmo decimal directo'
    enunciado: '¿El valor de $\log(100)$ es igual a $2$?'
    alternativas:
      - 'Sí, pues $10^2 = 100$'
      - 'No, es igual a 10'
      - 'No, es igual a 1'
    respuesta: 'Sí, pues $10^2 = 100$'
    solucion_pasos:
      - '1. Identificamos base 10: $\log_{10}(100)$.'
      - '2. Como $10^2 = 100 \implies \log(100) = 2$.'
  - titulo: 'Logaritmo decimal de un décimo'
    enunciado: '¿El valor de $\log(0.1)$ equivale a $-1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $0.1 = 10^{-1} \implies \log(10^{-1}) = -1$.'
  - titulo: 'Logaritmo decimal de diez'
    enunciado: '¿La expresión $\log(10)$ es igual a $1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Coincide la base decimal con el argumento: $\log_{10}(10) = 1$.'
  - titulo: 'Número de ceros en potencias de 10'
    enunciado: 'Para potencias enteras positivas como $\log(100000)$, ¿el resultado coincide con el número de ceros (5)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $100000 = 10^5 \implies \log(10^5) = 5$.'
errores_frecuentes:
  - 'La notación $\log(x)$ sin subíndice representa un logaritmo cuya base es igual a 1.'
  - 'El logaritmo decimal de un número se calcula dividiendo el argumento por el número 10.'
  - 'La notación $\log(x)$ representa un logaritmo en base $e$ equivalente a $\ln(x)$.'
  - 'El valor de $\log(100)$ es igual a 20 multiplicando $10 \cdot 2$.'
  - 'Las calculadoras científicas interpretan el botón LOG como un logaritmo en base e.'
afirmaciones_verdaderas:
  - 'El logaritmo decimal es aquel cuya base fija es diez ($b = 10$) y por notación matemática estándar omite la escritura del subíndice: $\log(x) = \log_{10}(x)$.'
  - 'El logaritmo decimal de cualquier potencia entera de diez $\log(10^k)$ es exactamente igual al exponente $k$.'
al_terminar_debes_poder: 'Calcular e interpretar logaritmos decimales reconociendo la base 10 implícita en la notación $\log(x)$.'
