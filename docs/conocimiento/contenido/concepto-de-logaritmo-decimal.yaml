semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.LOGARITMO_DECIMAL
resumen_inicial: El logaritmo decimal o común es aquel cuya base es 10; por convención internacional, el subíndice 10 se omite, escribiéndose simplemente como $\log(x) = \log_{10}(x)$.
explicacion_simple: "![Concepto de logaritmo decimal](/static/img/nodos/concepto-de-logaritmo-decimal-intro.svg)\n\nEl logaritmo más utilizado en la vida diaria y en la ciencia escolar es el **logaritmo en base 10**:\n- Como es el más común, **la base 10 no se escribe**: $\\log(x)$ significa exactamente $\\log_{10}(x)$.\n- Mide órdenes de magnitud:\n  - $\\log(10) = 1$ ($1$ cero)\n  - $\\log(100) = 2$ ($2$ ceros)\n  - $\\log(1000) = 3$ ($3$ ceros)\n  - $\\log(0,01) = -2$ ($2$ decimales)"
explicacion_formal: 'Se define el **logaritmo decimal, vulgar o de Briggs** como el logaritmo cuya base es la constante entera $10$:


  $$\log(x) \equiv \log_{10}(x) \quad (\forall x > 0)$$


  **Propiedad de Potencias de 10:**

  $$\log(10^k) = k \quad (\forall k \in \mathbb{R})$$


  **Relación con Notación Científica:**

  Todo número real positivo $N$ puede expresarse como $N = M \cdot 10^k$ con $1 \le M < 10$ y $k \in \mathbb{Z}$. Entonces:

  $$\log(N) = \log(M \cdot 10^k) = \log(M) + k$$

  donde $k$ es la **característica** entera y $\log(M) \in [0, 1[$ es la **mantisa** decimal.'
definiciones_clave: '- **Logaritmo decimal ($\log(x)$)**: Logaritmo en base 10 con subíndice omitido.

  - **Característica ($k$)**: Parte entera del logaritmo decimal, asociada a la potencia de 10.

  - **Mantisa**: Parte decimal positiva del logaritmo, asociada a los dígitos significativos.'
propiedades_relaciones: '- **Ceros decimales**: Para potencias exactas $10^k$, el logaritmo cuenta la cantidad de ceros o posiciones decimales.

  - **Escalas científicas**: Base de la escala de Richter (sismos), escala de pH (acidez) y escala de decibeles (sonido).'
ejemplo_guiado:
  enunciado: '![Ejemplos de logaritmo decimal](/static/img/nodos/concepto-de-logaritmo-decimal-ejemplos.svg)


    Calcule el valor de $\log(1000)$, $\log(0,01)$ y $\log(\sqrt{10})$.'
  pasos:
  - 'Paso 1: Para $\log(1000)$: Escribir $1000 = 10^3 \implies \log(10^3) = 3$.'
  - 'Paso 2: Para $\log(0,01)$: Escribir $0,01 = 10^{-2} \implies \log(10^{-2}) = -2$.'
  - 'Paso 3: Para $\log(\sqrt{10})$: Escribir $\sqrt{10} = 10^{1/2} \implies \log(10^{1/2}) = \frac{1}{2}$.'
  - 'Conclusión: Los valores son $3$, $-2$ y $\frac{1}{2}$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué base corresponde la expresión $\log(50)$ al no tener subíndice explícito?
  choices:
  - text: A la base 10 (por convención internacional del logaritmo decimal)
    is_correct: true
  - text: A la base 2
    is_correct: false
  - text: A la base e
    is_correct: false
  - text: A la base 1
    is_correct: false
  explanation: La alternativa correcta es 'A la base 10 (por convención internacional del logaritmo decimal)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\log(0,01) = -2$?
  choices:
  - text: Porque $0,01 = \frac{1}{100} = 10^{-2}$
    is_correct: true
  - text: Porque se divide 10 por 2
    is_correct: false
  - text: Porque tiene 2 ceros
    is_correct: false
  - text: Porque $10 \times (-2) = -20$
    is_correct: false
  explanation: La alternativa correcta es 'Porque $0,01 = \frac{1}{100} = 10^{-2}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer la notación $\log(x)$ con base 10 implícita.'
- 'Paso 2: Expresar el argumento $x$ como potencia de $10$: $x = 10^k$.'
- 'Paso 3: Obtener el logaritmo igualando directamente al exponente $k$: $\log(10^k) = k$.'
errores_correccion: '- **Error 1: Asumir que la base omitida es 0 o 1.** **Cómo corregirlo:** La notación $\log(x)$ sin subíndice representa universalmente la base 10.

  - **Error 2: Contar mal los ceros en números decimales menores a 1.** **Cómo corregirlo:** $0,001 = 10^{-3}$ (3 lugares después de la coma $\implies \log(0,001) = -3$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $\log(100000)$?
  alternativas:
  - $5$
  - $6$
  - $50$
  respuesta: $5$
  solucion_pasos:
  - $100000 = 10^5 \implies \log(100000) = 5$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale $\log(0,0001)$?
  alternativas:
  - $-4$
  - $4$
  - $-3$
  respuesta: $-4$
  solucion_pasos:
  - $0,0001 = 10^{-4} \implies \log(0,0001) = -4$.
- titulo: ¿Es log(100) = 2?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $10^2 = 100$.
  alternativas:
  - texto: Sí, 10² = 100
    es_correcta: true
    retroalimentacion: ¡Correcto! Dos ceros equivalen a logaritmo 2.
  - texto: No, es 10
    es_correcta: false
    retroalimentacion: Incorrecto, 10 es la base.
  - texto: No, es 20
    es_correcta: false
    retroalimentacion: Incorrecto, $10^2 = 100$.
- titulo: ¿Es log(∛10) = 1/3?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $\sqrt[3]{10} = 10^{1/3}$.
  alternativas:
  - texto: Sí, ∛10 = 10^(1/3)
    es_correcta: true
    retroalimentacion: ¡Correcto! Raíz cúbica como exponente 1/3.
  - texto: No, es 3
    es_correcta: false
    retroalimentacion: Incorrecto, el 3 es el índice de la raíz.
  - texto: No, es 10/3
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente es 1/3.
errores_frecuentes:
- Olvidar que $\log(x)$ tiene base 10.
- Confundir $\log(0,1) = -1$ con $\log(0,1) = 1$.
- Pensar que $\log(10) = 0$.
- No reconocer la notación científica en logaritmos decimales.
afirmaciones_verdaderas:
- El logaritmo decimal tiene base 10 y se denota habitualmente como $\log(x)$.
- Para cualquier potencia entera $10^k$, se cumple que $\log(10^k) = k$.
- Es la base estándar empleada en escalas de magnitud física y química.
al_terminar_debes_poder: '![Síntesis de logaritmo decimal](/static/img/nodos/concepto-de-logaritmo-decimal-resumen.svg)


  QUÉ: Comprender y calcular logaritmos decimales en base 10.


  CÓMO: Reconociendo la convención $\log(x) \equiv \log_{10}(x)$, descomponiendo argumentos en potencias $10^k$ y aplicando $\log(10^k) = k$.'
