semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.LOGARITMO_DECIMAL
resumen_inicial: Un logaritmo decimal es aquel cuya base es 10. Por convención, cuando
  la base es 10, no se escribe el subíndice ($\log(x) = \log_{10}(x)$).
explicacion_simple: 'Los logaritmos en base 10 son los más usados en la calculadora
  y en la ciencia. Por comodidad, se omite escribir la base 10:

  - $\log(100)$ significa $\log_{10}(100) = 2$.

  - $\log(1000) = 3$.

  - $\log(0{,}1) = -1$.

  Si ves la palabra ''log'' sin número abajo, la base es automáticamente 10.'
explicacion_formal: 'El logaritmo decimal o vulgar es la función $\log: \mathbb{R}^+
  \to \mathbb{R}$ definida por $\log(x) = \log_{10}(x)$. Es la función inversa de
  la potencia de diez $y = 10^x$.'
definiciones_clave: '- **Logaritmo decimal / vulgar**: Logaritmo en base 10 con notación
  abreviada $\log(x)$.'
propiedades_relaciones: '- **Valores característicos**: $\log(10^n) = n$ para todo
  $n \in \mathbb{Z}$.'
ejemplo_guiado:
  enunciado: Calcula A) $\log(10.000)$ y B) $\log(0{,}01)$.
  pasos:
  - Identificar que la notación $\log$ sin subíndice implica base 10.
  - 'Para A: $10.000 = 10^4 \implies \log_{10}(10^4) = 4$.'
  - 'Para B: $0{,}01 = 10^{-2} \implies \log_{10}(10^{-2}) = -2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la base implícita en la expresión $\log(50)$?
  choices:
  - text: '10'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: e
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: 'La correcta es: 10. Por convención universal, si no se especifica
    subíndice en log, la base es 10.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $\log(1000)$.
  choices:
  - text: '3'
    is_correct: true
  - text: '100'
    is_correct: false
  - text: '10'
    is_correct: false
  - text: '30'
    is_correct: false
  explanation: 'La correcta es: 3. Porque $10^3 = 1000$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer la notación $\log(x)$ como $\log_{10}(x)$.'
- 'Paso 2: Expresar el argumento como una potencia de 10 si es posible ($10^n$).'
- 'Paso 3: Retornar el exponente $n$ como resultado.'
errores_correccion: No asumas que si no hay base escrita la base es 1. La base omitida
  en logaritmos es **10**.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\log(10)$.
  alternativas:
  - '1'
  - '10'
  - '0'
  respuesta: '1'
  solucion_pasos:
  - $\log_{10}(10) = 1$.
errores_frecuentes:
- Pensar que la base omitida es 1 o e.
afirmaciones_verdaderas:
- $\log(x) = \log_{10}(x)$.
al_terminar_debes_poder: Evaluar logaritmos decimales con base 10 implícita.
fuente: Texto escolar MINEDUC.
estado: publicado
