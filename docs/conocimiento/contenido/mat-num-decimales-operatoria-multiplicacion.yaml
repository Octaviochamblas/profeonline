semantic_id: MAT.NUM.DECIMALES_OPERATORIA.MULTIPLICACION
resumen_inicial: La multiplicación de números decimales se realiza como si fuesen
  números enteros, y la coma en el resultado se ubica contando la suma total de cifras
  decimales de los factores.
explicacion_simple: Para multiplicar decimales, primero multiplicamos los números
  como si no tuvieran coma. Luego, contamos cuántas cifras decimales hay en total
  entre los dos números que multiplicamos, y esa misma cantidad de cifras contamos
  de derecha a izquierda para poner la coma en el resultado final.
explicacion_formal: 'Para dos decimales finitos $d_1 = A \cdot 10^{-m}$ y $d_2 = B
  \cdot 10^{-n}$ (donde $A, B \in \mathbb{Z}$ y $m, n \in \mathbb{N}_0$ son el número
  de cifras decimales de cada factor), el **Producto Decimal** es:


  $$d_1 \cdot d_2 = (A \cdot B) \cdot 10^{-(m + n)}$$


  **Desglose de la fórmula:**

  - $A \cdot B$: Multiplicación estándar de los enteros sin coma.

  - $10^{-(m+n)}$: Desplazamiento de la coma $m + n$ posiciones hacia la izquierda
  en el producto.


  > **Complemento didáctico:** El total de cifras decimales del resultado es la SUMA
  directa ($m + n$) de las cifras decimales de ambos factores.'
definiciones_clave: '- **Conteo de cifras decimales**: Algoritmo de ubicación de la
  coma en el producto sumando las cifras decimales de cada factor.'
propiedades_relaciones: '- **Suma de decimales**: El total de cifras decimales del
  resultado es $m + n$.'
ejemplo_guiado:
  enunciado: Calcule la multiplicación $2,35 \cdot 1,4$.
  pasos:
  - 'Paso 1: Contar las cifras decimales de los factores: $2,35$ tiene 2 decimales;
    $1,4$ tiene 1 decimal. Total = $2 + 1 = 3$ decimales.'
  - 'Paso 2: Multiplicar sin comas como enteros: $235 \cdot 14 = 3290$.'
  - 'Paso 3: Ubicar la coma contando 3 posiciones desde la derecha: $3290 \implies
    3,290 = 3,29$.'
  - 'Conclusión: $2,35 \cdot 1,4 = 3,29$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se determina el número de cifras decimales que tendrá el producto
    de dos números decimales?
  choices:
  - text: Sumando la cantidad de cifras decimales del primer factor con las del segundo
      factor
    is_correct: true
  - text: Restando los decimales
    is_correct: false
  - text: Multiplicando las cifras decimales
    is_correct: false
  - text: Es siempre 2 cifras decimales
    is_correct: false
  explanation: La alternativa correcta es 'Sumando la cantidad de cifras decimales
    del primer factor con las del segundo factor'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 2,35 · 1,4, ¿cuántos decimales en total se contaron
    para ubicar la coma?
  choices:
  - text: 3 cifras decimales (2 + 1)
    is_correct: true
  - text: 2 cifras decimales
    is_correct: false
  - text: 1 cifra decimal
    is_correct: false
  - text: 4 cifras decimales
    is_correct: false
  explanation: La alternativa correcta es '3 cifras decimales (2 + 1)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los números como si fueran enteros normales ignorando temporalmente
  las comas.'
- 'Paso 2: Sumar la cantidad de dígitos decimales que poseen ambos factores en conjunto
  ($m + n$).'
- 'Paso 3: Contar esa misma cantidad de lugares de derecha a izquierda en el producto
  final para ubicar la coma.'
errores_correccion: '- **Error 1: Alinear las comas en columna al multiplicar decimales.**
  **Cómo corregirlo:** La multiplicación NO exige alinear comas; los números se ubican
  alineados a la derecha como enteros.


  - **Error 2: Contar las cifras decimales solo del factor con más decimales.** **Cómo
  corregirlo:** La coma en el resultado debe contar la SUMA del total de decimales
  de AMBOS factores.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule 0,3 · 0,2.
  alternativas:
  - 0,06
  - 0,6
  - 0,006
  respuesta: 0,06
  solucion_pasos:
  - $3 \cdot 2 = 6$. Como hay $1 + 1 = 2$ decimales en total $\implies 0,06$.
- titulo: Ejemplo 2
  enunciado: Calcule 1,5 · 0,04.
  alternativas:
  - 0,06
  - 0,6
  - 0,006
  respuesta: 0,06
  solucion_pasos:
  - $15 \cdot 4 = 60$. Total de decimales $1 + 2 = 3 \implies 0,060 = 0,06$.
- titulo: ¿Se deben sumar los decimales de ambos factores para posicionar la coma?
  respuesta: Sí
  solucion_pasos:
  - Sí, la regla establece que $m + n$ define las posiciones decimales del producto.
- titulo: ¿Es 0,5 · 0,5 igual a 0,25?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5 \cdot 5 = 25$ con $1 + 1 = 2$ posiciones decimales $\implies 0,25$.
errores_frecuentes:
- Alinear obligatoriamente la coma decimal de los factores al momento de escribir
  la multiplicación.
- Contar únicamente las cifras decimales del primer factor para colocar la coma en
  el resultado.
- Multiplicar la parte entera con la parte entera y la parte decimal con la parte
  decimal por separado.
- Mover la coma del producto hacia la derecha en lugar de contar de derecha a izquierda.
- El producto de dos números decimales menores que 1 siempre es mayor que 1.
afirmaciones_verdaderas:
- La multiplicación decimal se realiza como producto entero y la coma cuenta la suma
  de las cifras decimales de los factores.
- El producto de dos decimales propios entre 0 y 1 es siempre menor que cada uno de
  los factores.
al_terminar_debes_poder: Al terminar serás capaz de multiplicar números decimales,
  aplicando el producto entero y posicionando la coma según la suma total de cifras
  decimales de los factores.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
