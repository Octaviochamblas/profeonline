semantic_id: MAT.GEO.RECTA_RELACIONES.RECTAS_SECANTES
resumen_inicial: 'Identificación de rectas secantes mediante pendientes distintas:
  conceptos, teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Si dos rectas no son paralelas ni coincidentes, es decir, tienen
  distinta inclinación, necesariamente se cruzan en exactamente un punto del plano.
explicacion_formal: '![Rectas secantes](/static/img/geometria/analitica/rectarel-rectas-secantes.svg)


  ### Definición formal


  Si $m_1\neq m_2$, el sistema formado por ambas ecuaciones tiene una única solución,
  correspondiente al único punto de intersección de las rectas.


  ### Desarrollo didáctico


  Las rectas $y=x$ e $y=-0{,}5x+2$ tienen pendientes distintas (1 y -0,5), por lo
  que son secantes y se cruzan en un único punto.'
