- titulo: ¿Se cumple siempre la propiedad principal de identificación de rectas secantes
    mediante pendientes distintas en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación de rectas secantes mediante pendientes distintas asumir
