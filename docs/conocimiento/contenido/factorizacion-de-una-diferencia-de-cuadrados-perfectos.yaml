semantic_id: MAT.ALG.FACTOR_CUADRADOS.FACTORIZACION_DIFERENCIA_CUADRADOS
resumen_inicial: 'Factorización de una diferencia de cuadrados perfectos: concepto,
  método de descomposición y reglas en Factorización asociada a cuadrados.'
explicacion_simple: ¿Qué sucede si en lugar de tener letras sueltas como 'x' o 'y',
  tienes paréntesis enteros elevados al cuadrado? El mismo truco funciona a una escala
  mayor. Las matemáticas no discriminan tamaños, aplican sus reglas universales.
explicacion_formal: '### Definición formal


  El signo negativo afecta a todo el bloque B, invirtiendo sus signos internos.


  ### Desarrollo didáctico


  Imagina la expresión $(x+y)^2 - a^2$.


  Sigue siendo una diferencia de cuadrados:

  1. Tenemos dos términos (el bloque paréntesis y la letra ''a'').

  2. Se están restando.

  3. Ambos están al cuadrado.


  La raíz del primero es todo el bloque $(x+y)$. La raíz del segundo es $a$.


  Aplicamos la regla de (suma) por (resta):

  $[ (x+y) + a ] \cdot [ (x+y) - a ]$


  Ahora, quitamos los paréntesis internos (con cuidado de aplicar bien los signos
  negativos, si los hay):

  $(x + y + a)(x + y - a)$.

  Ya factorizamos un caso especial. El gran cuidado debe tenerse cuando el término
  restado es un paréntesis, pues el signo negativo de la "resta de las raíces" le
  cambiará los signos internos a ese paréntesis.'
definiciones_clave: '- **Factorización de una diferencia de cuadrados perfectos**:
