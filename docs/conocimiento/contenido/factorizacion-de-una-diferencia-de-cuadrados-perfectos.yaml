semantic_id: MAT.ALG.FACTOR_CUADRADOS.FACTORIZACION_DIFERENCIA_CUADRADOS
resumen_inicial: 'La factorización de una diferencia de cuadrados perfectos establece la identidad $A^2 - B^2 = (A + B)(A - B)$ que descompone el binomio en el producto de binomios conjugados de sus raíces cuadradas.'
explicacion_simple: |
  Para **factorizar una Diferencia de Cuadrados Perfectos** (ej: $9x^2 - 16$):
  - **FÓRMULA DIRECTA DE BINOMIOS CONJUGADOS**:
    $$\mathbf{A^2 - B^2 = (A + B)(A - B)}$$
  - **PROCEDIMIENTO EN 3 PASOS**:
    1. **Saca la raíz cuadrada del 1.er término ($A$)**:
       - $\sqrt{9x^2} = \mathbf{3x}$.
    2. **Saca la raíz cuadrada del 2.º término ($B$)**:
       - $\sqrt{16} = \mathbf{4}$.
    3. **Escribe el producto de la SUMA por la DIFERENCIA**:
       $$\mathbf{(3x + 4)(3x - 4)}$$
  - ¡Es el proceso exactamente inverso a multiplicar binomios conjugados!
explicacion_formal: |
  ### Definición formal
  Sea la diferencia de dos cuadrados mónicos o ponderados $P(x, y) = A^2(x) - B^2(y) \in \mathbb{R}[x, y]$. El teorema de **factorización en binomios conjugados** establece el isomorfismo algebraico:

  $$\mathbf{A^2 - B^2 = (A + B)(A - B)}$$

  ### Demostración por Distribución Simétrica
  Aplicando la ley distributiva doble en el miembro derecho:

  $$(A + B)(A - B) = A \cdot A - A \cdot B + B \cdot A - B \cdot B = A^2 - AB + AB - B^2 = \mathbf{A^2 - B^2}$$

  donde los términos cruzados opuestos $-AB$ y $+AB$ se anulan recíprocamente por ser inverso aditivo el uno del otro.

  ### Síntesis didáctica
  Cualquier diferencia de cuadrados se convierte en el producto de dos factores: la suma de las bases cuadráticas multiplicada por la diferencia de las mismas bases.
definiciones_clave: |
  - **Binomios conjugados ($(A+B)(A-B)$)**: Pareja de binomios con los mismos términos pero con el signo de la segunda componente invertido.
  - **Anulación de productos cruzados**: Cancelación algebraica $-AB + AB = 0$ que hace desaparecer los términos de primer grado en el producto.
  - **Bases cuadráticas ($A, B$)**: Términos obtenidos al extraer la raíz cuadrada a cada componente del binomio original.
propiedades_relaciones: |
  - **Conmutatividad de los factores**: $(A + B)(A - B) = (A - B)(A + B)$. Escribir la resta antes que la suma produce la misma expresión factorizada.
  - **Factorización sucesiva**: Diferencias de cuadrados compuestas como $x^4 - y^4$ se factorizan recursivamente: $(x^2 + y^2)(x^2 - y^2) = (x^2 + y^2)(x + y)(x - y)$.
ejemplo_guiado:
  enunciado: 'Factoriza completamente la diferencia de cuadrados $25x^6 - 49y^4$.'
  pasos:
    - 'Paso 1: Extraemos la raíz cuadrada del primer término $A = \sqrt{25x^6}$:
       - $\sqrt{25} = 5$.
       - Exponente: $6 \div 2 = 3 \implies A = \mathbf{5x^3}$.'
    - 'Paso 2: Extraemos la raíz cuadrada del segundo término $B = \sqrt{49y^4}$:
       - $\sqrt{49} = 7$.
       - Exponente: $4 \div 2 = 2 \implies B = \mathbf{7y^2}$.'
    - 'Paso 3: Aplicamos la fórmula $A^2 - B^2 = (A + B)(A - B)$:
       $(5x^3 + 7y^2)(5x^3 - 7y^2)$.'
    - 'Conclusión: La factorización es **$(5x^3 + 7y^2)(5x^3 - 7y^2)$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la factorización completa de la diferencia de cuadrados $x^2 - 64$?'
    choices:
      - {text: 'La factorización es $(x + 8)(x - 8)$, aplicando la fórmula $A^2 - B^2 = (A+B)(A-B)$ con $A=x$ y $B=8$', is_correct: true}
      - {text: 'La factorización es $(x - 8)^2$', is_correct: false}
      - {text: 'La factorización es $(x + 32)(x - 32)$', is_correct: false}
      - {text: 'La factorización es $(x + 8)^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''La factorización es $(x + 8)(x - 8)$, aplicando la fórmula $A^2 - B^2 = (A+B)(A-B)$ con $A=x$ y $B=8$''. Raíces $A=x, B=8 \implies (x+8)(x-8)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si factorizamos $x^4 - 16$ en una primera etapa obtenemos $(x^2 + 4)(x^2 - 4)$. ¿Cómo queda la factorización 100% completa?'
    choices:
      - {text: 'Queda $(x^2 + 4)(x + 2)(x - 2)$, ya que el segundo factor $(x^2 - 4)$ es a su vez otra diferencia de cuadrados', is_correct: true}
      - {text: 'Queda $(x + 2)^4$', is_correct: false}
      - {text: 'Queda $(x^2 + 4)^2$', is_correct: false}
      - {text: 'Ya estaba 100% completa en la primera etapa', is_correct: false}
    explanation: 'La alternativa correcta es ''Queda $(x^2 + 4)(x + 2)(x - 2)$, ya que el segundo factor $(x^2 - 4)$ es a su vez otra diferencia de cuadrados''. Factorización sucesiva de $(x^2-4) \to (x+2)(x-2)$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer la raíz cuadrada del primer término para obtener la base $A$.'
  - 'Paso 2: Extraer la raíz cuadrada del segundo término para obtener la base $B$.'
  - 'Paso 3: Abrir dos paréntesis multiplicativos y colocar $(A + B)(A - B)$.'
  - 'Paso 4: Inspeccionar los factores resultantes para verificar si alguno permite una nueva factorización en diferencia de cuadrados.'
errores_correccion: |
  - **Error 1:** Escribir el resultado como el cuadrado de un binomio ($(A - B)^2$). **Cómo corregirlo:** La diferencia de cuadrados **FACTORIZA COMO BINOMIOS CONJUGADOS CON SIGNOS DISTINTOS ($(A+B)(A-B)$)**.
  - **Error 2:** Excluir la continuación de la factorización en factores cuadráticos resultantes (dejar $x^4 - 1 = (x^2 + 1)(x^2 - 1)$). **Cómo corregirlo:** Si un factor resultante es una diferencia de cuadrados **SE DEBE FACTORIZAR NUEVAMENTE ($(x^2+1)(x+1)(x-1)$)**.
ejemplos:
  - titulo: 'Factorización básica'
    enunciado: 'Para $a^2 - b^2$, ¿es la respuesta $(a + b)(a - b)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la fórmula fundamental.'
  - titulo: 'Constante numérica'
    enunciado: 'Para $y^2 - 9$, ¿obtenemos $(y + 3)(y - 3)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\sqrt{9} = 3$.'
  - titulo: 'Coeficiente en variable'
    enunciado: 'Para $16x^2 - 1$, ¿es $(4x + 1)(4x - 1)$ su factorización correcta?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\sqrt{16x^2} = 4x$ y $\sqrt{1} = 1$.'
  - titulo: 'Orden de binomios'
    enunciado: '¿Es $(A - B)(A + B)$ equivalente a $(A + B)(A - B)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la multiplicación es conmutativa.'
errores_frecuentes:
  - 'Escribir la diferencia de cuadrados como el cuadrado de un binomio con el mismo signo.'
  - 'La realización de la factorización sucesiva en potencias de grado 4 o superior no es aplicada.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Dividir los exponentes por el coeficiente en lugar de dividirlos por 2.'
  - 'Colocar un signo de suma entre los dos paréntesis resultantes.'
afirmaciones_verdaderas:
  - 'La diferencia de cuadrados $A^2 - B^2$ se descompone en el producto de binomios conjugados $(A + B)(A - B)$.'
  - 'Los términos cruzados se anulan por tener signos opuestos dejando únicamente la diferencia de los cuadrados.'
al_terminar_debes_poder: 'Factorizar cualquier diferencia de cuadrados en binomios conjugados ejecutando factorizaciones sucesivas si aplica.'
