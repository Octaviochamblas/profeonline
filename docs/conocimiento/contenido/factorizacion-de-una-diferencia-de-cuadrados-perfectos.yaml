resumen_inicial: La factorización de una diferencia de cuadrados perfectos descompone
  $A^2 - B^2$ en el producto de binomios conjugados $(A + B)(A - B)$, conocidos como
  producto de suma por su diferencia.
explicacion_simple: 'Una vez que identificas la base $A$ y la base $B$ en $A^2 - B^2$,
  su factorización es automática: escribes la suma de las bases en un paréntesis $(A
  + B)$ y la resta en el otro $(A - B)$. Por ejemplo, $x^2 - 16 = (x + 4)(x - 4)$.'
explicacion_formal: 'Para cualesquiera expresiones algebraicas $A, B \in \mathbb{R}[x_1,
  \dots, x_k]$, la **Factorización de una Diferencia de Cuadrados** responde al teorema
  del producto de binomios conjugados:


  $$A^2 - B^2 = (A + B)(A - B)$$


  **Desglose simbólico:**

  - $A = \sqrt{T_1}$: Primer término base.

  - $B = \sqrt{T_2}$: Segundo término base.

  - $(A + B)$: Suma de las bases directas.

  - $(A - B)$: Diferencia de las bases directas.

  - $(A + B)(A - B)$: Producto equivalente obtenido al anularse los términos cruzados
  $-AB + AB = 0$.


  > **Complemento didáctico:** Es una de las identidades algebraicas más eficientes
  y utilizadas en simplificación de fracciones y cálculo.'
definiciones_clave: '- **Binomios conjugados**: Par de binomios $(A + B)$ y $(A -
  B)$ que solo difieren en el signo del segundo término.

  - **Anulación de términos medios**: Propiedad $A(-B) + B(A) = 0$ al multiplicar
  binomios conjugados.'
propiedades_relaciones: '- **Inversidad directa**: Es la operación inversa exacta
  del producto notable de suma por su diferencia.'
ejemplo_guiado:
  enunciado: Factorice completamente la expresión $36x^2 - 49y^4$.
  pasos:
  - 'Paso 1: Obtener la primera base $A = \sqrt{36x^2} = 6x$.'
  - 'Paso 2: Obtener la segunda base $B = \sqrt{49y^4} = 7y^2$.'
  - 'Paso 3: Formar la suma de bases: $(A + B) = (6x + 7y^2)$.'
  - 'Paso 4: Formar la resta de bases: $(A - B) = (6x - 7y^2)$.'
  - 'Paso 5: Escribir el producto de ambos binomios: $(6x + 7y^2)(6x - 7y^2)$.'
  - 'Conclusión: La forma factorizada es $(6x + 7y^2)(6x - 7y^2)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la fórmula algebraica de factorización para la diferencia de
    cuadrados $A^2 - B^2$?
  choices:
  - text: $(A + B)(A - B)$
    is_correct: true
  - text: $(A - B)^2$
    is_correct: false
  - text: $(A + B)^2$
    is_correct: false
  - text: $A^2 + 2AB + B^2$
    is_correct: false
  explanation: La alternativa correcta es '$(A + B)(A - B)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la factorización de $36x^2 - 49y^4$, ¿cuál es la expresión en producto
    resultante?
  choices:
  - text: $(6x + 7y^2)(6x - 7y^2)$
    is_correct: true
  - text: $(6x - 7y^2)^2$
    is_correct: false
  - text: $(18x + 24.5y^2)(18x - 24.5y^2)$
    is_correct: false
  - text: $(36x + 49y^2)(36x - 49y^2)$
    is_correct: false
  explanation: La alternativa correcta es '$(6x + 7y^2)(6x - 7y^2)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar y extraer la raíz cuadrada $A$ y $B$ de ambos términos.'
- 'Paso 2: Escribir el primer paréntesis con la suma de las bases $(A + B)$.'
- 'Paso 3: Escribir el segundo paréntesis con la diferencia de las bases $(A - B)$
  y multiplicarlos.'
errores_correccion: '- **Error 1: Elevar al cuadrado la diferencia resultando $(A
  - B)^2$ en lugar del producto conjugado $(A + B)(A - B)$.** **Cómo corregirlo:**
  La diferencia de cuadrados NO produce un binomio al cuadrado; produce un producto
  de suma por diferencia.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice la expresión $m^2 - 100$.
  alternativas:
  - $(m + 10)(m - 10)$
  - $(m - 10)^2$
  - $(m - 50)(m + 50)$
  respuesta: $(m + 10)(m - 10)$
  solucion_pasos:
  - 1. $A = m$, $B = 10$.
  - 2. $(m + 10)(m - 10)$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la forma factorizada de $4x^2 - 1$?
  alternativas:
  - $(2x + 1)(2x - 1)$
  - $(2x - 1)^2$
  - $(4x + 1)(4x - 1)$
  respuesta: $(2x + 1)(2x - 1)$
  solucion_pasos:
  - 1. $A = 2x$, $B = 1$.
  - '2. Resultado: $(2x + 1)(2x - 1)$.'
- titulo: ¿Es $(a^2 + b^2)(a + b)(a - b)$ la factorización completa de $a^4 - b^4$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a^4 - b^4 = (a^2 + b^2)(a^2 - b^2)$, y luego $a^2 - b^2 = (a + b)(a - b)$.
- titulo: ¿Cambia el resultado final de la factorización si escribimos primero $(A
    - B)$ y después $(A + B)$?
  respuesta: 'No'
  solucion_pasos:
  - No, por la conmutatividad de la multiplicación $(A - B)(A + B) = (A + B)(A - B)$.
errores_frecuentes:
- Escribir la respuesta como el cuadrado de un binomio $(A - B)^2$ en lugar del producto
  de conjugados $(A + B)(A - B)$.
- Mantener los exponentes al cuadrado en las bases dentro de los binomios resultantes.
- Sumar las bases en ambos paréntesis produciendo $(A + B)(A + B) = (A + B)^2$.
- Declarar que el término $1$ no tiene raíz cuadrada al factorizar expresiones como
  $x^2 - 1$.
- Multiplicar por 2 las bases en lugar de sumarlas y restarlas.
afirmaciones_verdaderas:
- La factorización de $A^2 - B^2$ resulta en el producto de binomios conjugados $(A
  + B)(A - B)$.
- Al desarrollar $(A + B)(A - B)$ los términos cruzados $+AB$ y $-AB$ se anulan algebraicamente.
al_terminar_debes_poder: Al terminar serás capaz de factorizar cualquier diferencia
  de cuadrados perfectos en binomios conjugados.
