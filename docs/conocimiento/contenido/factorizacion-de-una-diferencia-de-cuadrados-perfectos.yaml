procedimiento:
- 'Paso 1: Trata cada paréntesis al cuadrado como si fuera una sola variable gigante.'
- 'Paso 2: Extrae las raíces (simplemente quítales el cuadrado a los paréntesis).'
- 'Paso 3: Abre dos corchetes, uno para la SUMA de las raíces y otro para la RESTA
  de las raíces.'
- 'Paso 4: En el corchete de la resta, asegúrate de distribuir el signo negativo a
  todos los elementos de la segunda raíz.'
- 'Paso 5: Reduce términos semejantes dentro de cada corchete si es posible.'
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en factorización de una diferencia de cuadrados perfectos.
ejemplos:
- titulo: Factoriza $(a+1)^2 - (a-2)^2$
  enunciado: Factoriza $(a+1)^2 - (a-2)^2$.
  solucion_pasos:
  - 'Raíces: $(a+1)$ y $(a-2)$.'
  - 'Corchete Suma: $[(a+1) + (a-2)] = [2a - 1]$.'
  - 'Corchete Resta: $[(a+1) - (a-2)] = [a + 1 - a + 2] = [3]$.'
  - 'Resultado final: $(2a - 1)(3) = 3(2a - 1)$.'
- titulo: Factoriza $16 - (m+n)^2$.
  solucion_pasos:
  - 'Raíces: 4 y (m+n). En la suma queda (4 + m + n). En la resta, el menos afecta
    a la m y la n, quedando (4 - m - n).'
- titulo: 'Respecto de «Factorización de una diferencia de cuadrados perfectos»: ¿La
    siguiente formulac'
  enunciado: 'Respecto de «Factorización de una diferencia de cuadrados perfectos»:
    ¿La siguiente formulación es correcta? «La diferencia de cuadrados es aplicable
    a polinomios»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La diferencia de cuadrados es
    aplicable a polinomios.'
- titulo: 'Respecto de «Factorización de una diferencia de cuadrados perfectos»: ¿La
    siguiente conclusi'
  enunciado: 'Respecto de «Factorización de una diferencia de cuadrados perfectos»:
    ¿La siguiente conclusión es correcta? «En el corchete de la resta, no distribuir
    el signo negativo al segundo bloque. (Ej: Hacer $(x) - (a+b)$ y escribir $(x -
    a + b)$ en lugar del correcto $(x - a - b)$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La diferencia de cuadrados es
    aplicable a polinomios.'
