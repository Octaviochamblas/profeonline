semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.ECUACIONES_POR_DEFINICION
resumen_inicial: La resolución de ecuaciones logarítmicas aplicando la definición transforma igualdades de la forma $\log_b(g(x)) = c$ en ecuaciones polinómicas o racionales equivalentes $g(x) = b^c$, eliminando el operador logarítmico mediante exponenciación directa.
explicacion_simple: "![La resolución de ecuaciones logarítmicas aplicando la definición transforma igualdades de la forma $\\log_b(g(x)) = c$ en ecuaciones polinómicas o racionales equivalentes $g(x) = b^c$, eliminando el operador logarítmico mediante exponenciación directa](/static/img/nodos/resolucion-de-ecuaciones-logaritmicas-aplicando-la-definicion-intro.svg)\n\n\nPara resolver una **ecuación logarítmica** donde tienes un logaritmo igualado a un número:\n\n$$\\log_{\\mathbf{b}}(\\mathbf{g(x)}) = \\mathbf{c} \\quad \\Longleftrightarrow \\quad \\mathbf{g(x) = b^c}$$\n\n- **El procedimiento en 3 pasos:**\n  1. **Aislar el logaritmo:** Asegúrate de que el logaritmo esté solo en un lado con coeficiente 1.\n  2. **Aplicar la definición (la base empuja al número):** Escribe $g(x) = b^c$.\n  3. **Resolver la ecuación algebraica normal:** Despeja la incógnita $x$.\n- **Ejemplo guiado:**\n  $$\\log_3(2x + 1) = 2 \\implies 2x + 1 = 3^2 = 9 \\implies 2x = 8 \\implies \\mathbf{x = 4}$$"
explicacion_formal: 'Sea una ecuación logarítmica elemental formulada en el cuerpo real $\mathbb{R}$:

  $$\log_b(g(x)) = c$$

  Por la biyectividad estricta de la aplicación logarítmica $\log_b: \mathbb{R}^+ \to \mathbb{R}$, aplicamos el operador inverso $\exp_b$ a ambos miembros:

  $$\exp_b(\log_b(g(x))) = \exp_b(c) \Longleftrightarrow g(x) = b^c$$


  **Condición necesaria de consistencia**:

  Dado que $b^c > 0$ para todo $c \in \mathbb{R}$, la solución algebraica resultante garantiza automáticamente la positividad del argumento $g(x) = b^c > 0$ en la igualdad puntual.'
definiciones_clave: '- **Ecuación logarítmica elemental**: Ecuación donde la incógnita se encuentra en el argumento de un logaritmo aislado.

  - **Paso a la forma exponencial**: Transformación equivalente $\log_b(g(x)) = c \iff g(x) = b^c$.'
propiedades_relaciones: '- **Linealización trascendente**: Convierte expresiones trascendentes en ecuaciones algebraicas estándar.

  - **Compatibilidad de bases**: Si hay bases variables $\log_{h(x)}(a) = c$, se resuelve $h(x)^c = a$ con $h(x) > 0, h(x) \neq 1$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de ecuaciones logarítmicas aplicando la definición transforma igualdades de la forma $\log_b(g(x)) = c$ en ecuaciones polinómicas o racionales equivalentes $g(x) = b^c$, eliminando el operador logarítmico mediante exponenciación directa](/static/img/nodos/resolucion-de-ecuaciones-logaritmicas-aplicando-la-definicion-ejemplos.svg)



    Resuelve las siguientes ecuaciones logarítmicas aplicando la definición:

    1) $\log_2(3x - 5) = 4$

    2) $5\log_3(x) + 2 = 12$

    3) $\log_4(x^2 - 9) = 2$'
  pasos:
  - 'Paso 1: Para $\log_2(3x - 5) = 4$:

    - Pasar a exponencial: $3x - 5 = 2^4 = 16$.

    - Despejar: $3x = 21 \implies \mathbf{x = 7}$.'
  - 'Paso 2: Para $5\log_3(x) + 2 = 12$:

    - Aislar el logaritmo: $5\log_3(x) = 10 \implies \log_3(x) = 2$.

    - Pasar a exponencial: $x = 3^2 = \mathbf{9}$.'
  - 'Paso 3: Para $\log_4(x^2 - 9) = 2$:

    - Pasar a exponencial: $x^2 - 9 = 4^2 = 16$.

    - Despejar: $x^2 = 25 \implies \mathbf{x = \pm 5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la solución de la ecuación $\log_5(2x - 3) = 2$?
  choices:
  - text: x = 14 (porque 2x - 3 = 5² = 25 ⟹ 2x = 28)
    is_correct: true
  - text: x = 6,5
    is_correct: false
  - text: x = 5
    is_correct: false
  - text: x = 25
    is_correct: false
  explanation: 'La alternativa correcta es ''x = 14 (porque 2x - 3 = 5² = 25 ⟹ 2x = 28)''. Al aplicar la definición exponencial: $2x - 3 = 25 \implies 2x = 28 \implies x = 14$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la ecuación $2\log_2(x) - 6 = 0$, ¿cuál es el valor de x?
  choices:
  - text: x = 8 (porque log₂(x) = 3 ⟹ x = 2³ = 8)
    is_correct: true
  - text: x = 6
    is_correct: false
  - text: x = 3
    is_correct: false
  - text: x = 16
    is_correct: false
  explanation: La alternativa correcta es 'x = 8 (porque log₂(x) = 3 ⟹ x = 2³ = 8)'. Se aisla $\log_2(x) = 3$ y se aplica la potencia $x = 2^3 = 8$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aislar completamente el término logarítmico en un miembro de la igualdad.'
- 'Paso 2: Aplicar la definición fundamental transformando $\log_b(g(x)) = c$ en $g(x) = b^c$.'
- 'Paso 3: Resolver la ecuación polinómica o racional resultante para la variable $x$.'
- 'Paso 4: Comprobar que la solución satisfaga las restricciones del argumento original.'
errores_correccion: '- **Error común:** Multiplicar la base por el resultado en lugar de calcular la potencia (ej: $g(x) = b \cdot c$).

  - **Cómo corregirlo:** Recuerda: **El resultado del logaritmo es el EXPONENTE**: $g(x) = \mathbf{b^c}$.'
ejemplos:
- titulo: 'Ejemplo 1: Ecuación lineal directa'
  enunciado: 'Resuelve $\log_2(x + 4) = 5$:'
  alternativas:
  - x = 28
  - x = 32
  - x = 6
  - x = 10
  respuesta: x = 28
  solucion_pasos:
  - 'Paso 1: $x + 4 = 2^5 = 32 \implies x = 28$.'
- titulo: 'Ejemplo 2: Ecuación con logaritmo decimal'
  enunciado: 'Resuelve $\log(3x) = 2$:'
  alternativas:
  - x = 100/3 (o 33,33...)
  - x = 2/3
  - x = 30
  - x = 20
  respuesta: x = 100/3 (o 33,33...)
  solucion_pasos:
  - 'Paso 1: $3x = 10^2 = 100 \implies x = 100/3$.'
- titulo: 'Ejemplo 3: Ecuación cuadrática'
  enunciado: 'Halla las soluciones de $\log_3(x^2) = 4$:'
  alternativas:
  - x = ±9
  - x = 9
  - x = ±81
  - x = 81
  respuesta: x = ±9
  solucion_pasos:
  - 'Paso 1: $x^2 = 3^4 = 81 \implies x = \pm 9$.'
- titulo: 'Ejemplo 4: Despeje previo necesario'
  enunciado: 'Resuelve $3\ln(x) + 6 = 12$:'
  alternativas:
  - x = e² (≈ 7,389)
  - x = 2
  - x = e⁶
  - x = 6
  respuesta: x = e² (≈ 7,389)
  solucion_pasos:
  - 'Paso 1: $3\ln(x) = 6 \implies \ln(x) = 2 \implies x = e^2$.'
errores_frecuentes:
- Multiplicar la base por el exponente (confundir bᶜ con b · c).
- Aplicar la definición sin antes haber despejado el logaritmo aislado.
- Olvidar ambas soluciones (positiva y negativa) en ecuaciones cuadráticas.
afirmaciones_verdaderas:
- Toda ecuación de la forma log_b(g(x)) = c equivale exactamente a la ecuación algebraica g(x) = b^c.
- Aislar el término logarítmico con coeficiente 1 es el primer paso indispensable para aplicar la definición.
al_terminar_debes_poder: '**QUÉ:** Resolver ecuaciones logarítmicas aplicando la definición fundamental.


  **CÓMO:** Aislando log_b(g(x)) = c y transformando a la forma exponencial equivalente g(x) = b^c.


