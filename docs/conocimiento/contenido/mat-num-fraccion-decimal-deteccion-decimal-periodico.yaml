semantic_id: MAT.NUM.FRACCION_DECIMAL.DETECCION_DECIMAL_PERIODICO
resumen_inicial: Una fracción irreductible $\frac{a}{b}$ genera un decimal periódico
  puro si $b$ carece de factores primos $2$ y $5$, y semiperiódico si $b$ combina
  factores de $\{2,5\}$ con otros primos.
explicacion_simple: Mirando los factores primos del denominador irreductible podemos
  predecir si el decimal será periódico o semiperiódico. Si el denominador no tiene
  ni al 2 ni al 5 (solo primos como 3, 7 u 11), el decimal será periódico puro. Si
  combina al 2 o al 5 junto a otros primos, será semiperiódico.
explicacion_formal: 'Dada $\frac{a}{b} \in \mathbb{Q}$ irreductible con $\operatorname{MCD}(a,
  b) = 1$, la **Detección Estructural del Decimal Infinito** establece:


  $$1. \operatorname{MCD}(b, 10) = 1 \iff \text{Decimal Infinito Periódico Puro}$$


  $$2. \exists p \in \operatorname{Primos}(b) \setminus \{2,5\} \text{ Y } \exists
  q \in \operatorname{Primos}(b) \cap \{2,5\} \iff \text{Decimal Infinito Semiperiódico}$$


  **Desglose del teorema:**

  - Sin factores 2 ni 5: Garantiza la ausencia de anteperíodo (periódico puro).

  - Factores mixtos: Los factores 2 y 5 generan las posiciones no repetitivas del
  anteperíodo, mientras que el primo extraño genera la barra del período.


  > **Complemento didáctico:** El criterio permite clasificar cualquier racional sin
  necesidad de efectuar la división de números larga.'
definiciones_clave: '- **Teorema de clasificación de expansión decimal en $\mathbb{Q}$**:
  Regla basada en los factores primos de $b$ en la fracción simplificada.'
propiedades_relaciones: '- **Discriminación completa**: Clasifica en periódico puro
  o semiperiódico según la presencia de los primos 2 o 5.'
ejemplo_guiado:
  enunciado: Clasifique sin dividir las expansiones decimales de $\frac{5}{21}$ y
    $\frac{7}{30}$.
  pasos:
  - 'Paso 1: Analizar $\frac{5}{21}$ irreductible: $21 = 3 \cdot 7$. No tiene factores
    $2$ ni $5 \implies$ **Decimal Infinito Periódico Puro**.'
  - 'Paso 2: Analizar $\frac{7}{30}$ irreductible: $30 = 2 \cdot 3 \cdot 5$. Tiene
    factores de $\{2,5\}$ Y el factor $3 \implies$ **Decimal Infinito Semiperiódico**.'
  - 'Conclusión: $\frac{5}{21}$ es periódico puro y $\frac{7}{30}$ es semiperiódico.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición en el denominador irreductible b caracteriza a un decimal
    infinito periódico puro?
  choices:
  - text: Que b no contenga ningún factor primo 2 ni 5 (MCD(b, 10) = 1)
    is_correct: true
  - text: Que b sea divisible por 10
    is_correct: false
  - text: Que b contenga únicamente el factor 2
    is_correct: false
  - text: Que a y b sean pares
    is_correct: false
  explanation: La alternativa correcta es 'Que b no contenga ningún factor primo 2
    ni 5 (MCD(b, 10) = 1)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 7/30 (con 30 = 2 · 3 · 5), ¿por qué fue clasificado
    como semiperiódico?
  choices:
  - text: Porque combina los primos 2 y 5 (que generan anteperíodo) con el primo 3
      (que genera período)
    is_correct: true
  - text: Porque 30 es un número entero par
    is_correct: false
  - text: Because es una fracción propia
    is_correct: false
  - text: No es semiperiódico
    is_correct: false
  explanation: La alternativa correcta es 'Porque combina los primos 2 y 5 (que generan
    anteperíodo) con el primo 3 (que genera período)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar la fracción al máximo hasta obtener $\frac{a}{b}$ irreductible.'
- 'Paso 2: Descomponer el denominador $b$ en sus factores primos.'
- 'Paso 3: Si no incluye $2$ ni $5$, es periódico puro. Si incluye $2$ o $5$ combinados
  con otros primos, es semiperiódico.'
errores_correccion: '- **Error 1: Clasificar $\frac{3}{15}$ como decimal periódico
  por ver el $15 = 3 \cdot 5$.** **Cómo corregirlo:** Se DEBE simplificar primero:
  $\frac{3}{15} = \frac{1}{5}$, cuyo denominador $5$ da un decimal FINITO ($0,2$).


  - **Error 2: Confundir cuál tipo de factor produce el anteperíodo.** **Cómo corregirlo:**
  Los primos $2$ y $5$ en presencia de otros primos son los responsables de crear
  la longitud del anteperíodo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Qué tipo de decimal genera 2/7?
  alternativas:
  - Decimal infinito periódico puro
  - Decimal finito
  - Decimal semiperiódico
  respuesta: Decimal infinito periódico puro
  solucion_pasos:
  - $7$ no contiene factores $2$ ni $5 \implies$ periódico puro.
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de decimal representa 5/6?
  alternativas:
  - Decimal infinito semiperiódico
  - Decimal finito
  - Decimal periódico puro
  respuesta: Decimal infinito semiperiódico
  solucion_pasos:
  - $6 = 2 \cdot 3 \implies$ combina el primo 2 y el primo 3 $\implies$ semiperiódico
    ($0,8333...$).
- titulo: ¿Genera 4/11 un decimal periódico puro?
  respuesta: Sí
  solucion_pasos:
  - Sí, $11$ no tiene ni 2 ni 5 en sus factores $\implies 0,\overline{36}$.
- titulo: ¿Es 1/12 un decimal semiperiódico?
  respuesta: Sí
  solucion_pasos:
  - Sí, $12 = 2^2 \cdot 3 \implies$ combina 2 con el primo 3 $\implies 0,08\overline{3}$.
errores_frecuentes:
- Clasificar la expansión decimal de una fracción antes de reducirla a su forma irreductible.
- Afirmar que un denominador sin factores 2 ni 5 produce un decimal finito de dos
  cifras.
- Declarar la condición del decimal periódico puro con la del decimal finito.
- Las fracciones con denominador 7 generan decimales finitos cuando el numerador es
  par.
- La presencia del factor primo 5 en un denominador impide que exista un período con
  barra.
afirmaciones_verdaderas:
- Una fracción irreductible cuyo denominador no tiene ni al 2 ni al 5 genera un decimal
  periódico puro.
- Una fracción irreductible cuyo denominador combina primos de {2,5} con otros primos
  genera un decimal semiperiódico.
al_terminar_debes_poder: Al terminar serás capaz de clasificar preventivamente si
  una fracción genera un decimal periódico puro o semiperiódico analizando la estructura
  de primos de su denominador irreductible.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
