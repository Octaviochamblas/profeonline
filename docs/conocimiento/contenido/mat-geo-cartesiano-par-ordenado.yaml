semantic_id: MAT.GEO.CARTESIANO_BASE.PAR_ORDENADO
resumen_inicial: 'Concepto de par ordenado en el plano cartesiano: conceptos, teoremas, propiedades geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: 'Un par ordenado es como una dirección postal de dos partes: primero indica cuánto avanzar horizontalmente, y luego cuánto avanzar verticalmente.


  ![par-ordenado](/static/img/nodos/par-ordenado-intro.svg)'
explicacion_formal: '![Concepto de par ordenado](/static/img/geometria/cartesiano-vectores/cartesiano-par-ordenado.svg)


  ### Definición formal


  Un par ordenado $(x,y)$ representa un punto único en el plano cartesiano: $x$ (la abscisa) indica la posición horizontal respecto del origen, e $y$ (la ordenada) indica la posición vertical. El orden importa: $(3,2)$ y $(2,3)$ representan puntos distintos.


  ### Desarrollo didáctico


  En la figura, el punto marcado corresponde al par ordenado $(3,2)$: se avanza 3 unidades horizontalmente (abscisa) y 2 unidades verticalmente (ordenada) desde el origen.'
