procedimiento:
- 'Paso 1: Identifica el primer número del par ordenado, la abscisa (x), que indica el desplazamiento horizontal desde el origen.'
- 'Paso 2: Identifica el segundo número del par ordenado, la ordenada (y), que indica el desplazamiento vertical desde el origen.'
- 'Paso 3: Recuerda que el orden de los números importa: (x,y) no es lo mismo que (y,x), salvo que sean iguales.'
