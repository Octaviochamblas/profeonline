procedimiento:
- 'Paso 1: Identifica las componentes de cada vector: u=(ux,uy) y v=(vx,vy).'
- 'Paso 2: Suma las componentes horizontales: ux+vx.'
- 'Paso 3: Suma las componentes verticales: uy+vy, obteniendo el vector suma (ux+vx,
  uy+vy).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con adición de vectores por componentes.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de adición de vectores por componentes para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando adición de vectores por componentes.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de adición de vectores por componentes
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de adición de vectores por componentes.
- titulo: ¿Se cumple siempre la propiedad principal de adición de vectores por componentes
    en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede adición de vectores por componentes asumir un valor negativo cuando
    representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en adición de vectores por componentes.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en adición de
  vectores por componentes.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en adición de vectores
  por componentes.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de adición
  de vectores por componentes.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
al_terminar_debes_poder: Identificar, calcular y aplicar las propiedades de adición
