semantic_id: MAT.GEO.VECTORES_OPERATORIA.SUMA_COMPONENTES
resumen_inicial: 'Adición de vectores por componentes: conceptos, teoremas, propiedades
  geométricas y cálculo en Sistema Cartesiano y Vectores.'
explicacion_simple: 'Sumar vectores por componentes es mucho más directo que el método
  geométrico: basta con sumar los números correspondientes de cada componente.'
explicacion_formal: '![Adición de vectores por componentes](/static/img/geometria/cartesiano-vectores/vectores-suma-componentes.svg)


  ### Definición formal


  La suma de vectores $\vec{u}=(u_x,u_y)$ y $\vec{v}=(v_x,v_y)$ es $\vec{u}+\vec{v}=(u_x+v_x,\,u_y+v_y)$:
  se suman las componentes horizontales entre sí y las componentes verticales entre
  sí.


  ### Desarrollo didáctico


  Si $\vec{u}=(3,1)$ y $\vec{v}=(1,3)$, entonces $\vec{u}+\vec{v}=(3+1,\,1+3)=(4,4)$,
  coincidiendo exactamente con el resultado obtenido mediante el método geométrico
  del triángulo.'
definiciones_clave: '- **Adición de vectores por componentes**: Elemento o propiedad
  fundamental en el estudio de sistema cartesiano y vectores.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a adición de vectores por componentes.'
ejemplo_guiado:
  enunciado: En el plano cartesiano referente a adición de vectores por componentes,
    se consideran las coordenadas $A(2, 5)$ y $B(10, 10)$. Determina la medida o vector
    resultante.
  pasos:
  - Aplicar la fórmula cartesiana de adición de vectores por componentes.
  - Sustituir las coordenadas $A(2, 5)$ y $B(10, 10)$.
  - Obtener el resultado final en el plano cartesiano.
