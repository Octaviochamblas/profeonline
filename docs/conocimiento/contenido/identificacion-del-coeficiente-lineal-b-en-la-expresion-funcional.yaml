semantic_id: MAT.ALG.FUNC_CUADR_BASE.PARAMETRO_B
resumen_inicial: 'Identificación del coeficiente lineal b en la expresión funcional:
  parábola, vértice, concavidad y formas de Definición y elementos básicos.'
explicacion_simple: El coeficiente $b$ es el número que acompaña al término con $x$
  elevado a la primera potencia, distinto del término cuadrático y del término constante.
explicacion_formal: '### Definición formal


  En $f(x)=ax^2+bx+c$, el coeficiente $b$ es el número real que multiplica al término
  de primer grado, $x$. A diferencia de $a$, no existe restricción sobre su valor:
  $b$ puede ser cualquier número real, incluido cero.


  ### Desarrollo didáctico


  Para identificar $b$, se localiza el término con $x$ elevado a la primera potencia
  y se lee el número que lo multiplica, respetando su signo. Si ese término no aparece
  explícitamente, $b=0$.


  En $f(x)=3x^2-9x+1$, el coeficiente $b$ es $-9$. En $f(x)=4x^2+7$, no hay término
  lineal, por lo que $b=0$.'
definiciones_clave: '- **Identificación del coeficiente lineal b en la expresión funcional**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  identificación del coeficiente lineal b en la expresión funcional.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando identificación
    del coeficiente lineal b en la expresión funcional.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a identificación
    del coeficiente lineal b en la expresión funcional.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
