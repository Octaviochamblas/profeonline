semantic_id: MAT.ALG.FUNC_CUADR_BASE.PARAMETRO_B
resumen_inicial: La identificación del coeficiente lineal $b$ extrae el valor numérico (con su signo) que multiplica a la variable de primer grado $x^1$.
explicacion_simple: |
  El **coeficiente lineal $b$** es el número que acompaña a la $x$ solita (elevada a exponente 1):

  - **En $f(x) = x^2 + 7x - 4$**: El número delante de la $x$ es $7 \implies b = 7$.
  - **En $f(x) = 3x^2 - x + 9$**: El signo menos antes de la $x$ representa $-1 \implies b = -1$.
  - **En $f(x) = 2x^2 + 8$**: ¡No hay término con $x$! Eso significa que el coeficiente lineal vale cero $\implies b = 0$.
  - **Función geométrica**: El coeficiente $b$ (junto con $a$) determina la posición horizontal del eje de simetría y del vértice de la parábola ($x_v = -b / (2a)$).
explicacion_formal: |
  Dada la función cuadrática $f(x) = ax^2 + bx + c$, el **coeficiente lineal $b$** es el escalar del término de grado 1:

  $$b = \left. \frac{d}{dx} [f(x) - ax^2] \right|_{x=0} = f'(0)$$

  **Interpretación geométrica del coeficiente $b$:**
  - $b$ representa la pendiente instantánea de la recta tangente a la parábola en su intersección con el eje $Y$ en el punto $(0, c)$.
  - Si $b = 0$, la curva es simétrica respecto al eje $Y$ (su eje de simetría es la recta $x = 0$).
  - La coordenada $x$ del vértice depende directamente de $b$: $x_v = -\frac{b}{2a}$.
definiciones_clave: |
  - **Coeficiente lineal ($b$)**: Factor numérico real que multiplica a la variable independiente elevada a la primera potencia $x^1$.
propiedades_relaciones: |
  - **Desplazamiento lateral del eje de simetría**:
    - Si $\text{signo}(a) = \text{signo}(b)$, el eje de simetría se desplaza hacia la izquierda del eje $Y$ ($x_v < 0$).
    - Si $\text{signo}(a) \neq \text{signo}(b)$, el eje de simetría se desplaza hacia la derecha del eje $Y$ ($x_v > 0$).
ejemplo_guiado:
  enunciado: 'Identifica el coeficiente lineal $b$ en la función $f(x) = 5 - 4x + 2x^2$.'
  pasos:
    - 'Paso 1: Localizar el término que contiene a la variable $x$ de primer grado: $-4x$.'
    - 'Paso 2: Extraer el valor numérico constante que la multiplica: $-4$.'
    - 'Paso 3: Declarar que el coeficiente lineal es $b = -4$.'
    - 'Paso 4: Verificar que el signo negativo esté incluido en la respuesta.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el valor del coeficiente lineal $b$ en la función cuadrática pura $f(x) = 3x^2 - 12$?'
    choices:
      - {text: '$b = 0$', is_correct: true}
      - {text: '$b = -12$', is_correct: false}
      - {text: '$b = 3$', is_correct: false}
      - {text: '$b = 1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$b = 0$''. Como la expresión no tiene término en $x$, $b = 0$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué coeficientes lineales $b$ corresponden a las funciones $f(x) = x^2 - x$ y $g(x) = x^2 + x$?'
    choices:
      - {text: 'En $f(x)$ es $b = -1$, y en $g(x)$ es $b = 1$', is_correct: true}
      - {text: 'En ambas funciones es $b = 0$.', is_correct: false}
      - {text: 'En $f(x)$ es $b = 1$, y en $g(x)$ es $b = -1$.', is_correct: false}
      - {text: 'En ambas funciones es $b = x$.', is_correct: false}
    explanation: 'La alternativa correcta es ''En $f(x)$ es $b = -1$, y en $g(x)$ es $b = 1$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Buscar en la función el monomio que tiene la variable $x$ con exponente 1.'
  - 'Paso 2: Si el término con $x$ no existe en la función, establecer de inmediato $b = 0$.'
  - 'Paso 3: Si el término existe, extraer el coeficiente numérico respetando su signo positivo o negativo.'
  - 'Paso 4: Declarar el valor exacto de $b$.'
errores_correccion: |
  - **Error común:** Escribir que $b = -4x$ incluyendo la letra $x$ en la respuesta.
  - **Cómo corregirlo:** Los coeficientes $a, b, c$ **SON SOLO NÚMEROS**; excluye la letra $x$ al dar el valor de $b$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Coeficiente b fraccionario.
    alternativas:
      - '$b = -1/2$'
      - '$b = 1/2$'
      - '$b = -2$'
    respuesta: '$b = -1/2$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Función sin término lineal.
    alternativas:
      - '$b = 0$'
      - '$b = 5$'
      - '$b = -9$'
    respuesta: '$b = 0$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Incluir la variable $x$ en la definición del coeficiente escribiendo $b = 7x$.'
  - 'Tomar la constante independiente $c$ como el coeficiente $b$ cuando la función carece de término lineal.'
  - 'La equiparación del coeficiente lineal $b$ con el coeficiente cuadrático $a$ en funciones desordenadas.'
  - 'La falta de inclusión del signo negativo del coeficiente lineal al extraer $b$ de la expresión $f(x) = x^2 - 6x$.'
  - 'La suposición de que el coeficiente lineal $b$ nunca puede ser igual a cero.'
afirmaciones_verdaderas:
  - 'El coeficiente lineal $b$ es el número real que multiplica a $x^1$, determinando la pendiente de la recta tangente a la parábola en $x = 0$.'
  - 'Si el término lineal no figura en la expresión funcional de segundo grado, su coeficiente correspondiente es $b = 0$.'
al_terminar_debes_poder: |
  QUÉ: Identificar y extraer el coeficiente lineal $b$ en funciones cuadráticas.
  CÓMO: Isolar el factor numérico que acompaña a la variable de primer grado $x$, considerar signos y reconocer $b = 0$ cuando falta $x$.
