procedimiento:
- 'Paso 1: Ordena la función en forma general si aún no lo está.'
- 'Paso 2: Localiza el término con $x$ elevado a la primera potencia.'
- 'Paso 3: Lee el número que lo multiplica, incluyendo su signo; si no aparece ese
  término, $b=0$.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en identificación del coeficiente lineal b en la
  expresión funcional.
ejemplos:
- titulo: Identificación directa del coeficiente b
  enunciado: Identifica el coeficiente $b$ en $f(x)=5x^2+12x-3$.
  solucion_pasos:
  - El término lineal es $12x$.
  - $b=12$.
- titulo: Identificación de coeficiente b nulo
  enunciado: Identifica el coeficiente $b$ en $f(x)=7x^2-20$.
  solucion_pasos:
  - No hay término con $x$ a la primera potencia.
  - $b=0$.
- titulo: ¿El coeficiente $b$ debe ser distinto de cero para que la función sea cuadrática?
  enunciado: ¿El coeficiente $b$ debe ser distinto de cero para que la función sea
    cuadrática?
  respuesta: 'No'
  solucion_pasos:
  - Solo se exige que $a$ sea distinto de cero; $b$ puede valer cero sin afectar el
    carácter cuadrático.
- titulo: ¿El coeficiente $b$ influye en la posición del eje de simetría de la parábola?
  enunciado: ¿El coeficiente $b$ influye en la posición del eje de simetría de la
    parábola?
  respuesta: Sí
  solucion_pasos:
  - El eje de simetría se calcula como $x=-b/(2a)$, por lo que el valor de $b$ afecta
    directamente su posición.
errores_frecuentes:
- Omitir identificar $b=0$ cuando el término lineal no aparece explícitamente en la
  función.
- Declarar el coeficiente $b$ con el coeficiente $a$ o con el término independiente
  $c$.
- Omitir el signo negativo del término lineal al leer el coeficiente $b$.
- No reordenar la función antes de identificar $b$, tomando por error otro término.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  identificación del coeficiente lineal b en la expresión funcional.
