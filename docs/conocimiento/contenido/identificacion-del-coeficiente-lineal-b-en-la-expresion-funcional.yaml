semantic_id: MAT.ALG.FUNC_CUADR_BASE.PARAMETRO_B
resumen_inicial: 'El coeficiente lineal $b$ es el escalar real que multiplica a la variable de primer grado $x$, modulando el desplazamiento horizontal del eje de simetría de la parábola.'
explicacion_simple: |
  El coeficiente lineal es el número $b$ que acompaña a la variable $x$ de exponente 1. Junto con el coeficiente cuadrático $a$, determina la posición lateral del eje de simetría y del vértice de la parábola. Si $b = 0$, la parábola queda perfectamente centrada sobre el eje $y$.
explicacion_formal: |
  ### Definición formal
  En la expresión funcional $f(x) = ax^2 + bx + c$, el **coeficiente lineal** $b$ se define como el escalar perteneciente a $\mathbb{R}$ que multiplica al término de primer grado $x^1$.

  ### Desglose simbólico
  - $b \in \mathbb{R}$: Puede ser positivo, negativo o cero.
  - $x = -\frac{b}{2a}$: Ubicación del eje de simetría de la parábola. El coeficiente $b$ entra directamente en el numerador de esta relación.
  - Si $b = 0 \implies f(x) = ax^2 + c$, por lo que el eje de simetría coincide exactamente con el eje de las ordenadas ($x = 0$).

  ### Síntesis didáctica
  El parámetro $b$ no afecta a la forma ni al ancho de la parábola, pero desplaza su vértice lateralmente. Cuando $a$ y $b$ tienen el mismo signo, el eje de simetría se ubica en el lado negativo del eje $x$; cuando tienen signos opuestos, se ubica en el lado positivo.
definiciones_clave: |
  - **Coeficiente lineal $b$**: Número real que pondera al término $x$ en la forma general $f(x) = ax^2 + bx + c$.
  - **Término lineal**: Sub-expresión de primer grado $bx$.
  - **Parábola simétrica al eje $y$**: Caso especial $b = 0$ donde la curva no presenta traslación horizontal oblicua respecto al origen.
propiedades_relaciones: |
  - **Eje de simetría y vértice**: La abscisa del vértice viene dada por $h = -\frac{b}{2a}$.
  - **Inclinación en la intersección con el eje $y$**: El coeficiente $b$ representa la pendiente de la recta tangente a la parábola en el punto de corte $(0, c)$.
ejemplo_guiado:
  enunciado: 'Dada la función cuadrática $f(x) = -4x + 3x^2 - 9$, identifica los coeficientes $a$ y $b$, y calcula la abscisa $h$ de su vértice.'
  pasos:
    - 'Paso 1: Reordenamos los términos en forma general: $f(x) = 3x^2 - 4x - 9$.'
    - 'Paso 2: Extraemos los coeficientes correspondientes: $a = 3$ (término $x^2$) y $b = -4$ (término $x$).'
    - 'Paso 3: Aplicamos la fórmula del eje de simetría $h = -\frac{b}{2a} = -\frac{-4}{2(3)} = \frac{4}{6} = \frac{2}{3}$.'
    - 'Paso 4: Concluimos que el coeficiente lineal es $b = -4$ y la abscisa del vértice es $h = \frac{2}{3}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la función cuadrática $f(x) = 5x^2 - 10x + 2$, ¿cuál es el valor del coeficiente lineal $b$ y la posición del eje de simetría?'
    choices:
      - {text: '$b = -10$ y el eje de simetría es $x = 1$', is_correct: true}
      - {text: '$b = 10$ y el eje de simetría es $x = -1$', is_correct: false}
      - {text: '$b = 5$ y el eje de simetría es $x = 2$', is_correct: false}
      - {text: '$b = 2$ y el eje de simetría es $x = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$b = -10$ y el eje de simetría es $x = 1$''. Calculamos $h = -\frac{-10}{2(5)} = \frac{10}{10} = 1$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función cuadrática $g(x) = 2x^2 + kx - 3$ tiene su eje de simetría en $x = -3$, ¿cuál es el valor del coeficiente lineal $b = k$?'
    choices:
      - {text: '$k = 12$', is_correct: true}
      - {text: '$k = -12$', is_correct: false}
      - {text: '$k = 6$', is_correct: false}
      - {text: '$k = -6$', is_correct: false}
    explanation: 'La alternativa correcta es ''$k = 12$''. Sustituimos en $h = -\frac{k}{2(2)} = -3 \implies -\frac{k}{4} = -3 \implies k = 12$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Agrupar la función en su forma polinomial desarrollada.'
  - 'Paso 2: Localizar el término que contiene la variable $x$ de exponente 1.'
  - 'Paso 3: Extraer la constante real $b$ asociada a $x$. Si no existe término en $x$, se concluye $b = 0$. Si aparece $+x$, $b = 1$; si aparece $-x$, $b = -1$.'
errores_correccion: |
  - **Error 1:** Confundir el coeficiente lineal $b$ con el coeficiente cuadrático $a$ cuando la función está desordenada (ej: en $f(x) = 6x + 2x^2$, decir que $b = 2$). **Cómo corregirlo:** $b$ es siempre el número que multiplica a la potencia de primer grado $x$, mientras que $a$ multiplica a $x^2$.
  - **Error 2:** Asumir que si $b = 0$, la función deja de ser cuadrática. **Cómo corregirlo:** La anulación de $b$ solo implica que el vértice de la parábola se ubica sobre el eje $y$. La función sigue siendo cuadrática mientras $a \neq 0$.
ejemplos:
  - titulo: 'Identificación de b en término lineal negativo'
    enunciado: '¿Cuál es el valor del coeficiente lineal $b$ en la función $f(x) = x^2 - x + 6$?'
    alternativas:
      - '$b = -1$'
      - '$b = 1$'
      - '$b = 0$'
    respuesta: '$b = -1$'
    solucion_pasos:
      - '1. El término lineal es $-x$, el cual equivale algebraicamente a $-1 \cdot x$.'
      - '2. Por lo tanto, el coeficiente lineal es $b = -1$.'
  - titulo: 'Función cuadrática con término lineal nulo'
    enunciado: '¿Cuál es el coeficiente lineal $b$ en $g(x) = 4x^2 - 25$?'
    alternativas:
      - '$b = 0$'
      - '$b = -25$'
      - '$b = 4$'
    respuesta: '$b = 0$'
    solucion_pasos:
      - '1. Expresamos la función incluyendo los términos ausentes: $g(x) = 4x^2 + 0x - 25$.'
      - '2. El coeficiente que multiplica a $x$ es $0$, por lo que $b = 0$.'
  - titulo: 'Impacto de b = 0 sobre el vértice'
    enunciado: 'Si el coeficiente lineal $b$ de una función cuadrática es igual a cero, ¿la recta $x = 0$ (eje $y$) representa el eje de simetría de la parábola?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al aplicar $h = -\frac{b}{2a}$ con $b = 0$, resulta $h = -\frac{0}{2a} = 0$, situando el eje de simetría en el eje $y$.'
  - titulo: 'Eje de simetría según signos de a y b'
    enunciado: 'En la función $f(x) = 2x^2 + 8x + 1$, ¿la abscisa del vértice $h$ se ubica en el semi-eje negativo de las $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a = 2 > 0$ y $b = 8 > 0$ tienen el mismo signo, $h = -\frac{8}{2(2)} = -2$, ubicándose en el semi-eje negativo.'
errores_frecuentes:
  - 'El coeficiente lineal $b$ es la sub-expresión completa $bx$ incluyendo la variable $x$.'
  - 'En la función $f(x) = 3x^2 - 5$, el coeficiente lineal $b$ es $-5$.'
  - 'Si el coeficiente lineal $b$ vale cero, la función pasa a ser de primer grado.'
  - 'El valor del coeficiente $b$ determina por sí solo el ancho o apertura de la parábola.'
  - 'En la función $g(x) = x^2 + x$, el coeficiente lineal $b$ vale cero porque no hay número delante de $x$.'
afirmaciones_verdaderas:
  - 'Cuando el coeficiente lineal $b$ es igual a cero, el eje de simetría de la parábola es exactamente el eje $y$ ($x = 0$).'
  - 'La abscisa del vértice de una parábola depende conjuntamente de los coeficientes $a$ y $b$ mediante la relación $h = -\frac{b}{2a}$.'
al_terminar_debes_poder: 'Identificar el coeficiente lineal $b$ en cualquier expresión cuadrática y calcular la posición del eje de simetría de la parábola.'
