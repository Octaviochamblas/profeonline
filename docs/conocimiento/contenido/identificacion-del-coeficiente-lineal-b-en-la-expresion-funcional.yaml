semantic_id: MAT.ALG.FUNC_CUADR_BASE.PARAMETRO_B
resumen_inicial: El coeficiente lineal $b$ es el factor que multiplica a la variable $x$ de primer grado y, en conjunto con $a$, determina la posición horizontal del eje de simetría y del vértice mediante la fórmula $x_v = -\frac{b}{2a}$.
explicacion_simple: "![El coeficiente lineal $b$ es el factor que multiplica a la variable $x$ de primer grado y, en conjunto con $a$, determina la posición horizontal del eje de simetría y del vértice mediante la fórmula $x_v = -\\frac{b}{2a}$](/static/img/nodos/identificacion-del-coeficiente-lineal-b-en-la-expresion-funcional-intro.svg)\n\n\nEl coeficiente **$b$** es el \"volante\" que mueve la parábola hacia los lados:\n\n- **¿Dónde queda el centro de la parábola?**\n  $$x_v = -\\frac{b}{2a}$$\n- **Casos importantes:**\n  - **Si $b = 0$:** el eje de simetría queda exactamente en el centro, sobre el **eje $Y$ ($x = 0$)**.\n  - **Si $a$ y $b$ tienen el mismo signo:** el vértice se desplaza a la **izquierda** ($x_v < 0$).\n  - **Si $a$ y $b$ tienen signos contrarios:** el vértice se desplaza a la **derecha** ($x_v > 0$).\n- Además, $b$ indica la inclinación o pendiente de la parábola cuando cruza el eje vertical $Y$."
explicacion_formal: "Sea $f(x) = ax^2 + bx + c$ con $a \\neq 0$. El coeficiente lineal $b$ representa analíticamente la primera derivada evaluada en el origen:\n$$b = f'(0)$$\n\n**Efectos geométricos y traslacionales de $b$**:\n1. **Abscisa del Vértice y Eje de Simetría**:\n   $$f'(x) = 2ax + b = 0 \\Longleftrightarrow x_v = -\\frac{b}{2a}$$\n2. **Regla de signos para la traslación horizontal del vértice**:\n   $$\\text{sgn}(x_v) = -\\text{sgn}(a) \\cdot \\text{sgn}(b)$$\n   - Si $ab > 0$ (mismo signo) $\\implies x_v < 0$ (vértice en semiplano izquierdo $X^-$).\n   - Si $ab < 0$ (signos opuestos) $\\implies x_v > 0$ (vértice en semiplano derecho $X^+$).\n   - Si $b = 0 \\implies x_v = 0$ (parábola simétrica respecto al eje de ordenadas $Y$)."
definiciones_clave: '- **Coeficiente lineal $b$**: Factor multiplicativo de $x^1$ en la forma canónica.

  - **Eje de simetría**: Recta vertical $x = -\frac{b}{2a}$ sobre la cual la parábola exhibe simetría especular reflexiva.'
propiedades_relaciones: '- **Pendiente en el corte $Y$**: Si $b > 0$, la parábola corta al eje $Y$ subiendo (creciente); si $b < 0$, corta al eje $Y$ bajando (decreciente).

  - **Vértice centrado**: $b = 0 \iff$ la función es par ($f(-x) = f(x)$).'
ejemplo_guiado:
  enunciado: '![Ejemplo El coeficiente lineal $b$ es el factor que multiplica a la variable $x$ de primer grado y, en conjunto con $a$, determina la posición horizontal del eje de simetría y del vértice mediante la fórmula $x_v = -\frac{b}{2a}$](/static/img/nodos/identificacion-del-coeficiente-lineal-b-en-la-expresion-funcional-ejemplos.svg)



    Identifica el coeficiente lineal $b$ y calcula la posición del eje de simetría para las funciones:

    1) $f(x) = 2x^2 - 12x + 5$

    2) $g(x) = -3x^2 + 8$'
  pasos:
  - 'Paso 1: Para $f(x) = 2x^2 - 12x + 5$:

    - $a = 2, b = -12, c = 5$.

    - Eje de simetría: $x_v = -\frac{b}{2a} = -\frac{-12}{2(2)} = \frac{12}{4} = 3$.

    - Conclusión: El eje de simetría es la recta vertical $x = 3$ (desplazada a la derecha).'
  - 'Paso 2: Para $g(x) = -3x^2 + 8$:

    - $a = -3, b = 0, c = 8$.

    - Eje de simetría: $x_v = -\frac{0}{2(-3)} = 0$.

    - Conclusión: El eje de simetría es la recta $x = 0$ (el propio eje $Y$).'
checkpoints:
- placement: after_explicacion_formal
  question: En la función $f(x) = -x^2 + 6x - 2$, ¿cuál es la ecuación del eje de simetría?
  choices:
  - text: x = 3
    is_correct: true
  - text: x = -3
    is_correct: false
  - text: x = 6
    is_correct: false
  - text: y = 3
    is_correct: false
  explanation: La alternativa correcta es 'x = 3'. $x_v = -b/(2a) = -6/(2(-1)) = -6/(-2) = 3$, por lo que la recta es $x = 3$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una parábola tiene $b = 0$, ¿qué propiedad geométrica posee con total certeza?
  choices:
  - text: Su eje de simetría es el eje Y (x = 0).
    is_correct: true
  - text: Pasa por el origen (0, 0).
    is_correct: false
  - text: Abre hacia arriba.
    is_correct: false
  - text: No tiene vértice.
    is_correct: false
  explanation: La alternativa correcta es 'Su eje de simetría es el eje Y (x = 0).'. $b = 0 \implies x_v = 0$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la función en forma general $f(x) = ax^2 + bx + c$.'
- 'Paso 2: Extraer el coeficiente lineal $b$ correspondiente al término con $x^1$.'
- 'Paso 3: Sustituir $a$ y $b$ en la fórmula del vértice $x_v = -\frac{b}{2a}$.'
- 'Paso 4: Resolver la división para determinar la abscisa del vértice y la ecuación del eje de simetría $x = x_v$.'
errores_correccion: '- **Error común:** Olvidar el signo menos de la fórmula del vértice y calcular $b/(2a)$.

  - **Cómo corregirlo:** La fórmula lleva **siempre signo menos**: **$x_v = -\frac{b}{2a}$**.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficiente b negativo'
  enunciado: En $f(x) = 3x^2 - 18x + 1$, ¿dónde está el eje de simetría?
  alternativas:
  - x = 3
  - x = -3
  - x = 6
  - x = -18
  respuesta: x = 3
  solucion_pasos:
  - 'Paso 1: $x = -(-18)/(2(3)) = 18/6 = 3$.'
- titulo: 'Ejemplo 2: Coeficiente b positivo con a negativo'
  enunciado: En $g(x) = -2x^2 + 8x - 3$, ¿cuál es la abscisa del vértice?
  alternativas:
  - x = 2
  - x = -2
  - x = 4
  - x = -4
  respuesta: x = 2
  solucion_pasos:
  - 'Paso 1: $x = -8/(2(-2)) = -8/(-4) = 2$.'
- titulo: 'Ejemplo 3: Función sin término lineal'
  enunciado: ¿Cuál es el valor de b en $h(x) = 7x^2 - 14$?
  alternativas:
  - b = 0
  - b = -14
  - b = 7
  - b = 1
  respuesta: b = 0
  solucion_pasos:
  - 'Paso 1: No hay término con $x$, por ende $b = 0$.'
- titulo: 'Ejemplo 4: Fracción en el eje de simetría'
  enunciado: En $f(x) = 2x^2 - 5x + 3$, ¿dónde está el eje de simetría?
  alternativas:
  - x = 5/4
  - x = -5/4
  - x = 5/2
  - x = 3/2
  respuesta: x = 5/4
  solucion_pasos:
  - 'Paso 1: $x = -(-5)/(2(2)) = 5/4$.'
errores_frecuentes:
- Omitir el signo negativo exterior en la fórmula del eje de simetría.
- Confundir el coeficiente lineal b con el término independiente c.
- Asumir que el eje de simetría es una coordenada y en lugar de la recta vertical x.
afirmaciones_verdaderas:
- El coeficiente lineal b determina junto con a la posición del eje de simetría x = -b/(2a).
- Si b = 0, el eje de simetría coincide exactamente con el eje vertical Y.
al_terminar_debes_poder: '**QUÉ:** Identificar el coeficiente lineal b y calcular el eje de simetría de una parábola.


  **CÓMO:** Extrayendo b de la forma general y aplicando la relación del eje de simetría x = -b/(2a).


