semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.FORMA_GENERAL_COSENO
resumen_inicial: 'Reconocimiento y descomposición de la forma general de la función coseno $f(x) = A\cos(Bx + C) + D$.'
explicacion_simple: |
  De la misma manera que con el seno, una onda cosenoidal real puede estirarse, comprimirse, trasladarse de lado o elevarse sobre el plano. La **forma general de la función coseno** es $f(x) = A\cos(Bx + C) + D$. La diferencia principal radica en que, antes de aplicar los desplazamientos, la curva del coseno arranca en su cresta máxima superior $(0, A+D)$, a diferencia del seno que arranca en la línea media. Cada letra controla un aspecto específico de la onda.
explicacion_formal: |
  ### Definición formal
  La **forma general canónica de la función cosenoidal** es la expresión algebraica real dada por:
  $$f(x) = A\cos(Bx + C) + D$$
  o en su estructura factorizada de desfase:
  $$f(x) = A\cos\left(B\left(x + \frac{C}{B}\right)\right) + D$$
  donde $A, B, C, D \in \mathbb{R}$ con $A \neq 0$ y $B \neq 0$.

  ### Desglose simbólico
  - $|A|$: Amplitud de la oscilación cosenoidal.
  - $B$: Frecuencia angular que define el período $T = \frac{2\pi}{|B|}$.
  - $-\frac{C}{B}$: Desfase o traslación horizontal.
  - $D$: Desplazamiento vertical que define la recta de equilibrio (línea media $y = D$).

  ### Síntesis didáctica
  En $f(x) = A\cos(Bx + C) + D$, el valor máximo de la función es $y_{\max} = D + |A|$ y el valor mínimo es $y_{\min} = D - |A|$. Para $x = -\frac{C}{B}$ (inicio del ciclo), la función alcanza su cresta máxima $D + A$ (si $A > 0$).
definiciones_clave: |
  - **Forma general $A\cos(Bx+C)+D$**: Modelo algebraico estándar para funciones periódicas cosenoidales.
  - **Punto de cresta inicial desfasado**: Punto supremo alcanzado en la abscisa del desfase horizontal $x_0 = -\frac{C}{B}$.
  - **Línea media ($y=D$)**: Eje horizontal alrededor del cual oscila la onda del coseno.
propiedades_relaciones: |
  - **Equivalencia de desfase entre seno y coseno**: La función $f(x) = A\cos(Bx + C) + D$ puede convertirse exactamente a una función senoidal aplicando el desfase $\cos(\theta) = \sin\left(\theta + \frac{\pi}{2}\right)$.
  - **Recorrido cerrado**: El conjunto imagen es $[\min, \max] = [D - |A|, D + |A|]$.
ejemplo_guiado:
  enunciado: 'Dada la función $f(x) = -2\cos(4x + \pi) - 1$, identifica los cuatro parámetros fundamentales $A, B, C, D$.'
  pasos:
    - 'Paso 1: Comparar con la plantilla estándar $A\cos(Bx + C) + D$.'
    - 'Paso 2: Identificar el coeficiente del coseno: $A = -2$.'
    - 'Paso 3: Identificar el coeficiente de la variable $x$: $B = 4$.'
    - 'Paso 4: Identificar la constante interna: $C = \pi$.'
    - 'Paso 5: Identificar la constante externa: $D = -1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la forma general $f(x) = A\cos(Bx + C) + D$, ¿cuál es la fórmula para calcular el valor máximo $y_{\max}$ de la gráfica?'
    choices:
      - {text: '$y_{\max} = D + |A|$', is_correct: true}
      - {text: '$y_{\max} = A + B$', is_correct: false}
      - {text: '$y_{\max} = \frac{C}{B}$', is_correct: false}
      - {text: '$y_{\max} = |A| - D$', is_correct: false}
    explanation: 'La alternativa correcta es ''$y_{\max} = D + |A|$''. El valor máximo es la suma de la línea media $D$ más la amplitud $|A|$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para la función $f(x) = 3\cos(2x - \pi) + 5$, ¿cuál es el valor del parámetro $D$?'
    choices:
      - {text: '$5$', is_correct: true}
      - {text: '$3$', is_correct: false}
      - {text: '$2$', is_correct: false}
      - {text: '$-\pi$', is_correct: false}
    explanation: 'La alternativa correcta es ''$5$''. En la plantilla $A\cos(Bx + C) + D$, el término independiente constante fuera del coseno es $D = 5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Ordenar la función dada en la forma estándar $A\cos(Bx + C) + D$.'
  - 'Paso 2: Extraer el parámetro $A$ (coeficiente multiplicativo).'
  - 'Paso 3: Extraer el parámetro $B$ (frecuencia horizontal multiplicativa).'
  - 'Paso 4: Extraer la constante de desfase $C$ y el término de desplazamiento vertical $D$.'
errores_correccion: |
  - **Error 1:** Creer que la cresta inicial del coseno siempre se ubica sobre el eje Y ($x=0$) en funciones transformadas. **Cómo corregirlo:** Si $C \neq 0$, la cresta se traslada horizontalmente a la abscisa del desfase $x_0 = -\frac{C}{B}$.
  - **Error 2:** Confundir la fórmula del período del coseno con $T = \frac{\pi}{|B|}$. **Cómo corregirlo:** El período fundamental del coseno base es $2\pi$, por lo que la fórmula general es $T = \frac{2\pi}{|B|}$.
ejemplos:
  - titulo: 'Coseno con amplitud y desplazamiento'
    enunciado: 'En $f(x) = 6\cos(x) - 4$, ¿cuál es la línea media de la onda?'
    alternativas:
      - 'La recta $y = -4$'
      - 'La recta $y = 6$'
      - 'La recta $y = 2$'
    respuesta: 'La recta $y = -4$'
    solucion_pasos:
      - '1. El término independiente es $D = -4$.'
      - '2. La línea media es $y = -4$.'
  - titulo: 'Parámetro B en coseno'
    enunciado: '¿Cuál es el valor de $B$ en $f(x) = \cos\left(\frac{x}{2}\right)$?'
    alternativas:
      - '$B = \frac{1}{2}$'
      - '$B = 2$'
      - '$B = 1$'
    respuesta: '$B = \frac{1}{2}$'
    solucion_pasos:
      - '1. Reescribimos $\frac{x}{2} = \frac{1}{2}x$.'
      - '2. El coeficiente de $x$ es $B = \frac{1}{2}$.'
  - titulo: 'Recorrido de la forma general'
    enunciado: '¿El recorrido de $f(x) = 2\cos(x) + 3$ es $[1, 5]$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $y_{\min} = 3 - 2 = 1$ e $y_{\max} = 3 + 2 = 5$.'
  - titulo: 'Amplitud negativa en el parámetro A'
    enunciado: 'En la función $f(x) = -5\cos(x)$, ¿la amplitud es $5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues la amplitud equivale al valor absoluto $|A| = |-5| = 5$.'
errores_frecuentes:
  - 'La afirmación de que en $f(x) = A\cos(Bx + C) + D$ la constante $C$ es el valor del desplazamiento horizontal directo.'
  - 'La afirmación de que el parámetro $A$ altera la distancia entre dos ceros consecutivos de la cosenoidal.'
  - 'La afirmación de que la línea media de una función cosenoidal es siempre el eje horizontal $X = 0$.'
  - 'La afirmación de que el período de la función cosenoidal general viene dado por $\frac{\pi}{|B|}$.'
  - 'La afirmación de que si $A < 0$, la amplitud de la función resulta ser un número negativo.'
afirmaciones_verdaderas:
  - 'En la forma general $f(x) = A\cos(Bx + C) + D$, el parámetro $|A|$ determina la amplitud y el término independiente $D$ define la recta de equilibrio u oscilación media $y = D$.'
  - 'El período fundamental de la función cosenoidal general $f(x) = A\cos(Bx + C) + D$ viene determinado por la relación $T = \frac{2\pi}{|B|}$.'
al_terminar_debes_poder: |
  QUÉ: Descomponer e interpretar los cuatro parámetros de la forma general cosenoidal $f(x) = A\cos(Bx + C) + D$.
  CÓMO: Asociar $A$ a la amplitud, $B$ a la frecuencia/período, $C$ a la constante de desfase y $D$ a la recta media de equilibrio.
