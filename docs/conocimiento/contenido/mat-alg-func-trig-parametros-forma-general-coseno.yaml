semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.FORMA_GENERAL_COSENO
resumen_inicial: 'Reconocimiento de la forma general A·cos(B(x - C)) + D: círculo
  unitario, amplitud, período y transformaciones de Parámetros y transformaciones
  de funciones periódicas.'
explicacion_simple: Igual que el seno, la función coseno básica se transforma con
  los mismos cuatro parámetros, con el mismo significado en cada caso.
explicacion_formal: '### Definición formal


  En $f(x)=a\cos(b(x-c))+d$: $|a|$ es la amplitud, $2\pi/|b|$ es el periodo, $c$ es
  el desplazamiento horizontal, y $d$ es el desplazamiento vertical. Los parámetros
  funcionan exactamente igual que en la función seno transformada.


  ### Desarrollo didáctico


  En $f(x)=2\cos(4(x+1))-3$: $a=2$ (amplitud), $b=4$ (afecta el periodo), $c=-1$ (desplazamiento
  horizontal, ya que $x+1=x-(-1)$), $d=-3$ (línea media en $y=-3$).'
definiciones_clave: '- **Reconocimiento de la forma general A·cos(B(x - C)) + D**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a reconocimiento de la forma general a·cos(b(x - c)) + d.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    reconocimiento de la forma general a·cos(b(x - c)) + d.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de reconocimiento de la forma general a·cos(b(x - c))
    + d.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
