semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.TRAPECIO_ANGULOS_COLATERALES
resumen_inicial: En todo trapecio, los dos ángulos interiores adyacentes a cada lado no paralelo son suplementarios (suman 180°).
explicacion_simple: 'Como las bases del trapecio (arriba y abajo) son líneas paralelas, cada lado lateral actúa como una línea secante que las corta. Por las leyes de los ángulos entre paralelas, los dos ángulos que se encuentran en el **mismo lado lateral** (uno abajo y otro arriba) deben sumar exactamente **$180^\circ$**.


  Si en la esquina inferior izquierda el ángulo mide $70^\circ$, el ángulo de la esquina superior izquierda medirá obligatoriamente $180^\circ - 70^\circ = 110^\circ$. ¡Pero ten mucho cuidado!: los dos ángulos de la base de abajo NO tienen por qué sumar $180^\circ$; los que suman $180^\circ$ son el de arriba con el de abajo del mismo costado.


  ![Ángulos colaterales suplementarios en el trapecio](/static/img/nodos/suplementariedad-de-angulos-colaterales-en-un-trapecio-intro.svg)

  '
explicacion_formal: '### Teorema de los ángulos colaterales en el trapecio

  Sea $\mathcal{ABCD}$ un trapecio con bases $\overline{AB} \parallel \overline{CD}$. Los ángulos interiores adyacentes a cada uno de los lados no paralelos $\overline{AD}$ y $\overline{BC}$ son ángulos colaterales internos entre paralelas y, por tanto, suplementarios:

  $$\angle A + \angle D = 180^\circ \quad \wedge \quad \angle B + \angle C = 180^\circ$$


  ### Demostración geométrica

  1. Considérense las rectas paralelas $\overleftrightarrow{AB}$ y $\overleftrightarrow{CD}$.

  2. La recta secante $\overleftrightarrow{AD}$ corta a ambas paralelas.

  3. Por el postulado de los ángulos entre paralelas de Euclides, los ángulos internos situados en el mismo semiplano respecto a la transversal (colaterales internos) son suplementarios: $\angle DAB + \angle CDA = 180^\circ$.

  4. Idéntico razonamiento aplica a la secante $\overleftrightarrow{BC}$, concluyendo que $\angle ABC + \angle BCD = 180^\circ$.

  5. Suma total de los 4 ángulos: $(\angle A + \angle D) + (\angle B + \angle C) = 180^\circ + 180^\circ = 360^\circ$.


  > **Complemento didáctico:** La regla de oro en el trapecio es sumar verticalmente: ''el de arriba más el de abajo del mismo lado suman 180°''. Nunca sumes los dos de abajo buscando 180°, porque en general los ángulos basales no tienen ninguna relación entre sí (salvo en el isósceles donde son iguales).

  '
definiciones_clave: '- **Ángulos colaterales internos**: Pares de ángulos situados al mismo lado de una transversal entre dos rectas paralelas.

  - **Ángulos suplementarios**: Par de ángulos cuya suma de medidas sexagesimales es exactamente $180^\circ$.

  - **Transversal lateral**: Lado no paralelo del trapecio que intersecta a ambas bases paralelas.

  '
propiedades_relaciones: '- **Independencia entre lados**: El valor de $\angle A + \angle D = 180^\circ$ es completamente independiente del valor de $\angle B$ y $\angle C$.

  - **Trapecio rectángulo**: Si $\angle A = 90^\circ$, entonces $\angle D = 180^\circ - 90^\circ = 90^\circ$.

  - **Trapecio isósceles**: Si $\angle A = \angle B = \alpha$, entonces $\angle C = \angle D = 180^\circ - \alpha$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulos colaterales](/static/img/nodos/suplementariedad-de-angulos-colaterales-en-un-trapecio-ejemplos.svg)


    En un trapecio $ABCD$ con $AB \parallel CD$, el ángulo en el vértice $A$ mide $3x + 15^\circ$ y el ángulo en el vértice $D$ mide $2x + 40^\circ$. Asimismo, el ángulo en el vértice $B$ mide $65^\circ$. Calcula el valor de $x$ y las medidas de los ángulos $\angle D$ y $\angle C$.'
  pasos:
  - 'Paso 1: Aplicar la suplementariedad colateral al lado izquierdo: $\angle A + \angle D = 180^\circ$.'
  - 'Paso 2: Plantear y resolver la ecuación: $(3x + 15^\circ) + (2x + 40^\circ) = 180^\circ \implies 5x + 55^\circ = 180^\circ \implies 5x = 125^\circ \implies x = 25^\circ$.'
  - 'Paso 3: Calcular la medida de $\angle D$: $\angle D = 2(25^\circ) + 40^\circ = 50^\circ + 40^\circ = 90^\circ$.'
  - 'Paso 4: Calcular la medida de $\angle C$ usando el lado derecho: $\angle B + \angle C = 180^\circ \implies 65^\circ + \angle C = 180^\circ \implies \angle C = 115^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: En un trapecio con bases paralelas horizontales, si el ángulo inferior izquierdo mide 80°, ¿cuánto mide el ángulo superior izquierdo?
  choices:
  - text: 100°.
    is_correct: true
  - text: 80°.
    is_correct: false
  - text: 10°.
    is_correct: false
  - text: 280°.
    is_correct: false
  explanation: 'La alternativa correcta es ''100°.'' Por suplementariedad de ángulos colaterales en el mismo lado lateral: $180^\circ - 80^\circ = 100^\circ$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué los dos ángulos adyacentes a la misma base inferior de un trapecio escaleno no suman 180°?
  choices:
  - text: Porque las bases son paralelas entre sí y los ángulos colaterales se forman a lo largo de los lados laterales transversales.
    is_correct: true
  - text: Porque los ángulos inferiores de cualquier polígono siempre suman 360°.
    is_correct: false
  - text: Porque los trapecios no cumplen el postulado de las paralelas de Euclides.
    is_correct: false
  - text: Porque uno de los ángulos siempre debe ser recto.
    is_correct: false
  explanation: La alternativa correcta es 'Porque las bases son paralelas entre sí y los ángulos colaterales se forman a lo largo de los lados laterales transversales.' La suplementariedad ocurre entre los dos extremos del mismo lado secante.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar las bases paralelas del trapecio ($b_1 \parallel b_2$).

  2. Identificar el lado lateral transversal que contiene al ángulo conocido y al desconocido.

  3. Plantear la ecuación de suplementariedad colateral: $\angle_{\text{inferior}} + \angle_{\text{superior}} = 180^\circ$.

  4. Despejar la incógnita y verificar que la suma de los 4 ángulos interiores resulte $360^\circ$.

  '
errores_correccion: '- **Error común 1:** Sumar los dos ángulos de la base inferior buscando que den $180^\circ$. **Corrección:** Suman $180^\circ$ el de abajo con el de arriba del MISMO lado lateral.

  - **Error común 2:** Asumir que los ángulos opuestos son iguales como en el paralelogramo. **Corrección:** En el trapecio los ángulos opuestos no son congruentes.

  '
ejemplos:
- tipo: A
  titulo: Ángulo adyacente al lado lateral
  enunciado: En un trapecio con bases horizontales, un ángulo en la base superior mide $135^\circ$. ¿Cuánto mide el ángulo en la base inferior situado en ese mismo lado lateral?
  alternativas:
  - text: $45^\circ$.
    is_correct: true
  - text: $135^\circ$.
    is_correct: false
  - text: $90^\circ$.
    is_correct: false
  - text: $55^\circ$.
    is_correct: false
  explicacion: 'Por suplementariedad colateral: $180^\circ - 135^\circ = 45^\circ$.'
- tipo: B
  titulo: Suma de ángulos colaterales
  enunciado: ¿Suman siempre 180° los ángulos colaterales internos de cada lado lateral en cualquier trapecio?
  respuesta: Sí
  explicacion: Sí. Al ser las bases paralelas, los ángulos colaterales internos en cada transversal lateral suman invariablemente $180^\circ$.
errores_frecuentes:
- '''Sumar ángulos de la misma base creyendo erróneamente que son suplementarios.'''
- '''Creer que los ángulos opuestos del trapecio son iguales.'''
- '''Restar de $90^\circ$ en lugar de $180^\circ$ al despejar el ángulo colateral.'''
afirmaciones_verdaderas:
- '''En todo trapecio, los ángulos adyacentes a cada lado no paralelo suman $180^\circ$.'''
- '''La suma total de los cuatro ángulos interiores de un trapecio es $360^\circ$.'''
- '''Si un trapecio tiene un ángulo recto en una base, obligatoriamente tiene otro ángulo recto en la otra base sobre el mismo lado.'''
al_terminar_debes_poder: '**QUÉ:** Determinar medidas angulares en trapecios aplicando la suplementariedad colateral.


  **CÓMO:** Planteando relaciones $\alpha + \delta = 180^\circ$ y $\beta + \gamma = 180^\circ$ derivadas del paralelismo entre bases.


  ![Síntesis de ángulos colaterales](/static/img/nodos/suplementariedad-de-angulos-colaterales-en-un-trapecio-resumen.svg)

  '
