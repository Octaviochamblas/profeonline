resumen_inicial: El concepto de traducción al lenguaje algebraico asigna símbolos
  variables a cantidades desconocidas y operadores matemáticos a los enunciados verbales.
explicacion_simple: 'Traducir al lenguaje algebraico es como traducir un idioma: convertimos
  palabras como ''un número'', ''aumentado en'' o ''el triple de'' en letras y símbolos
  como $x$, $+$, o $3 \cdot x$. Esto nos permite escribir ideas matemáticas de forma
  clara y corta.'
explicacion_formal: 'Sea $V = \{x, y, z, \dots\}$ el conjunto de variables algebraicas
  que representan elementos no determinados en $\mathbb{R}$. La **Traducción Algebraica
  Directa** es la función $T: \mathcal{L}_{verbal} \to \mathcal{E}_{algebraica}$ que
  asocia la semántica verbal con expresiones simbólicas:


  $$T(\text{"un número } x \text{ aumentado en } k \text{"}) = x + k$$

  $$T(\text{"el triple de un número } x \text{"}) = 3x$$


  > **Complemento didáctico:** La traducción directa establece el puente fundamental
  entre el razonamiento verbal coloquial y el rigor analítico del lenguaje simbólico.'
definiciones_clave: '- **Variable**: Símbolo literal que representa un número no especificado.

  - **Traducción algebraica**: Proceso de codificación de enunciados verbales en expresiones
  compuestas por constantes, variables y operadores.'
propiedades_relaciones: '- **Invarianza semántica**: La expresión algebraica $T(e)$
  debe conservar exactamente el mismo valor cualitativo que el enunciado verbal $e$.'
ejemplo_guiado:
  enunciado: 'Traduzca la frase: ''El cuádruple de un número $n$ disminuido en $7$
    unidades''.'
  pasos:
  - 'Paso 1: Identificar la variable principal: ''un número'' $\to n$.'
  - 'Paso 2: Traducir la operación multiplicativa: ''El cuádruple de un número'' $\to
    4n$.'
  - 'Paso 3: Traducir la sustracción: ''disminuido en 7 unidades'' $\to - 7$.'
  - 'Paso 4: Unir las operaciones completas: $4n - 7$.'
  - 'Conclusión: La expresión algebraica exacta es $4n - 7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión algebraica que traduce 'el triple de un número x
    aumentado en 5 unidades'?
  choices:
  - text: 3x + 5
    is_correct: true
  - text: x^3 + 5
    is_correct: false
  - text: 3(x + 5)
    is_correct: false
  - text: 3x - 5
    is_correct: false
  explanation: La alternativa correcta es '3x + 5'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'El cuádruple de un número n disminuido en 7',
    ¿cuál fue el resultado?
  choices:
  - text: 4n - 7
    is_correct: true
  - text: n^4 - 7
    is_correct: false
  - text: 4(n - 7)
    is_correct: false
  - text: 4n + 7
    is_correct: false
  explanation: La alternativa correcta es '4n - 7'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar y nombrar la o las variables desconocidas con letras (por ejemplo
  $x$, $y$, $n$).'
- 'Paso 2: Identificar las palabras clave operacionales (suma, resta, producto, cociente,
  potencia).'
- 'Paso 3: Ensamblar la expresión respetando la prioridad de operaciones.'
errores_correccion: '- **Error 1: Escribir $3(x+5)$ al traducir ''el triple de un
  número aumentado en 5'' sin coma.** **Cómo corregirlo:** La frase directa ''el triple
  de un número aumentado en 5'' se traduce como $3x + 5$.


  - **Error 2: Invertir la sustracción en ''un número disminuido en 8'' escribiendo
  $8 - x$.** **Cómo corregirlo:** El minuendo es la variable $x$, dando $x - 8$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la traducción al lenguaje algebraico de 'el quíntuple de un
    número y disminuido en 12'?
  alternativas:
  - 5y - 12
  - y^5 - 12
  - 5(y - 12)
  - 5y + 12
  respuesta: 5y - 12
  solucion_pasos:
  - '1. Identificar la variable: y.'
  - '2. El quíntuple de y: 5y.'
  - '3. Disminuido en 12: 5y - 12.'
- titulo: Ejemplo 2
  enunciado: ¿Qué expresión representa 'la mitad de un número x aumentada en el triple
    del mismo número'?
  alternativas:
  - (1/2)x + 3x
  - x/2 + x^3
  - 2x + 3x
  - (x + 3x)/2
  respuesta: (1/2)x + 3x
  solucion_pasos:
  - '1. La mitad de x: (1/2)x.'
  - '2. El triple de x: 3x.'
  - '3. Aumentada indica suma: (1/2)x + 3x.'
- titulo: ¿Es la frase 'un número n aumentado en 10' equivalente a n + 10?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'aumentado en' representa la adición de 10 unidades a la variable n.
- titulo: ¿Es la expresión 3(x + 4) equivalente a 'el triple de un número aumentado
    en 4' sin signos de puntuación?
  respuesta: 'No'
  solucion_pasos:
  - No, 'el triple de un número aumentado en 4' es 3x + 4; 3(x + 4) requiere una coma
    explicativa.
errores_frecuentes:
- Traducir 'un número disminuido en 5' como la expresión invertida 5 - x.
- Traducir 'el doble de un número aumentado en 3' como 2(x + 3) expresando la falta
  de distinción con 2x + 3.
- Reemplazar una variable desconocida por un número arbitrario específico en la traducción
  inicial.
- Representar 'el cuadrado de un número' mediante la multiplicación por dos 2x en
  lugar de elevar a potencia x^2.
- Descartar el signo de adición al traducir palabras como 'ganancia', 'exceso' o 'incremento'.
afirmaciones_verdaderas:
- La palabra 'disminuido en k unidades' indica restar k al valor de la variable de
  origen.
- La expresión 2n representa un múltiplo de dos o número par para todo entero n.
