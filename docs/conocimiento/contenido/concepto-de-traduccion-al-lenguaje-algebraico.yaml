- placement: after_ejemplo_guiado
  question: ¿Cómo se traduce al lenguaje algebraico la frase verbal "El cuádruple de una cantidad disminuido en tres unidades"?
  choices:
  - text: Se traduce como la expresión $4n - 3$
    is_correct: true
  - text: Se traduce como la expresión $\frac{n}{4} + 3$
    is_correct: false
  - text: Se traduce como la expresión $n^4 - 3$
    is_correct: false
  - text: Se traduce como la expresión $4(n - 3)$
    is_correct: false
  explanation: La alternativa correcta es 'Se traduce como la expresión $4n - 3$'. El cuádruple es $4n$ y disminuido en 3 es $-3$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer atentamente el enunciado verbal e identificar las letras que representarán a las cantidades desconocidas.'
- 'Paso 2: Subrayar las palabras clave que denotan operaciones ("suma", "diferencia", "producto", "cociente", "cuadrado").'
- 'Paso 3: Escribir la estructura matemática respetando el orden de las palabras y el uso de paréntesis seguidos de la puntuación.'
- 'Paso 4: Verificar la traducción sustituyendo valores de prueba numéricos para comprobar la coherencia semántica.'
errores_correccion: '- **Error 1:** Escribir la potencia al cuadrado $x^2$ al traducir la frase "el doble de un número" en lugar de $2x$. **Cómo corregirlo:** "El doble" **multiplica por 2** ($2x$); "al cuadrado" eleva a la potencia 2 ($x^2$).

  - **Error 2:** Excluir los paréntesis en expresiones compuestas (ej: traducir "el triple de la suma entre un número y 4" como $3x + 4$ en vez de $3(x + 4)$). **Cómo corregirlo:** Si la operación afecta a toda la suma, **debe encerrarse entre paréntesis** para garantizar la equivalencia formal.

  '
ejemplos:
- titulo: Traducción directa de suma
  enunciado: ¿Cuál es la traducción de "Un número $a$ aumentado en siete"?
  alternativas:
  - $a + 7$
  - $7a$
  - $a - 7$
  respuesta: $a + 7$
  solucion_pasos:
  - 1. "Un número $a$" es la variable $a$.
  - 2. "Aumentado en siete" suma 7.
  - '3. Traducción: $a + 7$.'
- titulo: Traducción con paréntesis
  enunciado: ¿Cuál es la traducción de "El doble de la diferencia entre un número $x$ y cinco"?
  alternativas:
  - $2(x - 5)$
  - $2x - 5$
  - $x^2 - 5$
  respuesta: $2(x - 5)$
  solucion_pasos:
  - 1. La diferencia es $(x - 5)$.
  - 2. El doble de esa diferencia es $2(x - 5)$.
- titulo: Asignación de variables
  enunciado: Al traducir "La suma de dos números distintos", ¿debemos utilizar dos letras diferentes como $x + y$?
  respuesta: Sí
  solucion_pasos:
  - Sí, cantidades desconocidas distintas requieren letras variables distintas.
- titulo: Equivalencia verbal
  enunciado: ¿Traduce el signo $=$ las palabras "equivale", "es igual a" o "da como resultado"?
  respuesta: Sí
  solucion_pasos:
  - Sí, señalan la relación de igualdad.
errores_frecuentes:
- Escribir la potencia al cuadrado x^2 al traducir el enunciado el doble de un número.
- Los paréntesis no son incluidos al traducir el producto de un número por una suma compuesta.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Utilizar la misma letra variable para representar dos cantidades desconocidas que son distintas.
- Invertir el orden de los términos en la resta al traducir un número disminuido en cinco.
afirmaciones_verdaderas:
- La traducción al lenguaje algebraico convierte palabras del lenguaje verbal en símbolos, constantes y variables matemáticos.
- El uso de paréntesis es obligatorio al aplicar un multiplicador sobre la suma o resta de varias cantidades.
al_terminar_debes_poder: '![Resumen de traducción al lenguaje algebraico](/static/img/nodos/concepto-de-traduccion-al-lenguaje-algebraico-resumen.svg)


  QUÉ: Traducir enunciados verbales cotidianos a expresiones algebraicas simbólicas con constantes, variables y operadores.


  CÓMO: Asignar variables literales ($x, y, n$) a cantidades desconocidas y mapear operadores verbales ($+$ adición, $-$ sustracción, $\cdot$ producto, $/$ cociente) preservando la jerarquía mediante paréntesis $(\dots)$.'
