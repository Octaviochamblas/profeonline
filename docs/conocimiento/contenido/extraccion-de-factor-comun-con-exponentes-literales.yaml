semantic_id: MAT.ALG.FACTOR_COMUN.EXPONENTES_LITERALES
resumen_inicial: 'Extracción de factor común con exponentes literales: concepto, método
  de descomposición y reglas en Factor común.'
explicacion_simple: Para hallar el factor literal común se analiza cada variable por
  separado. Solo se incluyen las letras compartidas y, para cada una, se selecciona
  el menor exponente.
explicacion_formal: '### Definición formal


  Para una variable $x$ presente en todos los términos con exponentes $e_1, \dots,
  e_n$, extraer $x^{\min(e_1,\dots,e_n)}$ garantiza que cada cociente $x^{e_i - \min(e_1,\dots,e_n)}$
  tenga exponente no negativo, es decir, que la división sea exacta en todos los términos.


  ### Desarrollo didáctico


  El exponente más pequeño de la x presente en todos los términos es el 2.


  Ambas letras aparecen en todos los términos de la expresión.


  $m^5/m^3 = m^2$ y $m^3/m^3 = 1$. Todo factor dividido por sí mismo da 1.'
definiciones_clave: '- **Extracción de factor común con exponentes literales**: Técnica
  de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en extracción de factor común con exponentes
  literales.'
ejemplo_guiado:
