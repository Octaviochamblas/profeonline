resumen_inicial: La extracción de factor común con exponentes literales rige la factorización
  de expresiones cuyos exponentes contienen variables como $x^{n+2} + x^{n+1} + x^n$.
explicacion_simple: 'Cuando los exponentes son letras como en $x^{n+2} + x^n$, la
  parte común del exponente es $x^n$. Si extraes $x^n$, restas $n$ a cada exponente:
  $(n+2) - n = 2$ y $n - n = 0$. La factorización queda $x^n(x^2 + 1)$.'
explicacion_formal: 'Para cualesquiera $n, k \in \mathbb{N}$ y $a \neq 0$, la **Extracción
  de Factor Común con Exponentes Literales** sobre expresiones de la forma $P(a) =
  c_1 a^{n+k_1} + c_2 a^{n+k_2} + \dots + c_m a^{n+k_m}$ responde a:


  $$P(a) = a^n \cdot \sum_{i=1}^m c_i a^{k_i} \quad \text{donde } k_i = (n + k_i)
  - n$$


  **Desglose simbólico:**

  - $a^n$: Factor literal común de exponente variable continuo.

  - $a^{n+k_i} = a^n \cdot a^{k_i}$: Aplicación de la ley de producto de potencias
  de igual base $a^{u+v} = a^u \cdot a^v$.

  - Los residuos dentro del paréntesis reducen la presencia del parámetro $n$.


  > **Complemento didáctico:** Técnica esencial en demostraciones algebraicas e inducción
  matemática para simplificar expresiones exponenciales compuestas.'
definiciones_clave: '- **Exponente literal variable**: Exponente que contiene una
  variable indeterminada (ej. $n+1, 2n, n-3$).

  - **Descomposición de potencia de suma**: Ley $a^{n+k} = a^n \cdot a^k$ aplicada
  en sentido inverso.'
propiedades_relaciones: '- **Simplicidad de residuos**: Extraer el término $a^n$ transforma
  exponentes algebraicos paramétricos en constantes numéricas simples.'
ejemplo_guiado:
  enunciado: Factorice la expresión $x^{n+3} + x^{n+2} - x^{n+1}$ mediante extracción
    de factor común con exponente literal.
  pasos:
  - 'Paso 1: Identificar la parte común de los exponentes: Todos contienen $n+1$ como
    menor exponente literal compuesto.'
  - 'Paso 2: Seleccionar el menor exponente literal: $x^{n+1}$.'
  - 'Paso 3: Restar $(n+1)$ a cada exponente:'
  - '  - Primer término: $(n+3) - (n+1) = 2 \implies x^2$.'
  - '  - Segundo término: $(n+2) - (n+1) = 1 \implies x^1 = x$.'
  - '  - Tercer término: $(n+1) - (n+1) = 0 \implies x^0 = 1$.'
  - 'Paso 4: Escribir el producto: $x^{n+1}(x^2 + x - 1)$.'
  - 'Conclusión: El polinomio factorizado es $x^{n+1}(x^2 + x - 1)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál propiedad de las potencias justifica la descomposición $a^{n+k}
    = a^n \cdot a^k$ al extraer factor común con exponentes literales?
  choices:
  - text: El producto de potencias de igual base
    is_correct: true
  - text: La potencia de una potencia
    is_correct: false
  - text: El cociente de potencias de distinta base
    is_correct: false
  - text: La distributividad del exponente sobre la adición
    is_correct: false
  explanation: La alternativa correcta es 'El producto de potencias de igual base'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la factorización de $x^{n+3} + x^{n+2} - x^{n+1}$, ¿cuál es el menor
    exponente literal extraído como factor común?
  choices:
  - text: $x^{n+1}$
    is_correct: true
  - text: $x^n$
    is_correct: false
  - text: $x^{n+2}$
    is_correct: false
  - text: $x^3$
    is_correct: false
  explanation: La alternativa correcta es '$x^{n+1}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente literal común mínimo (ej. $x^n$ o $x^{n+1}$).'
- 'Paso 2: Aplicar la ley $a^{n+k} / a^n = a^k$ restando la expresión literal común.'
- 'Paso 3: Escribir el factor común literal antepuesto al paréntesis de términos simplificados.'
errores_correccion: '- **Error 1: Multiplicar los exponentes literales en lugar de
  restarlos al extraer el factor.** **Cómo corregirlo:** La división de potencias
  de igual base exige RESTAR los exponentes: $(n+k) - n = k$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice $2^{n+2} + 2^n$.
  alternativas:
  - $2^n(5)$
  - $2^n(4)$
  - $2^n(2)$
  respuesta: $2^n(5)$
  solucion_pasos:
  - '1. Factor común: $2^n$.'
  - '2. Dividiendo: $2^{n+2}/2^n = 2^2 = 4$ y $2^n/2^n = 1$.'
  - 3. $2^n(4 + 1) = 2^n(5)$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la factorización de $a^{2n} + a^n$?
  alternativas:
  - $a^n(a^n + 1)$
  - $a^n(a^2 + 1)$
  - $a(a^n + 1)$
  respuesta: $a^n(a^n + 1)$
  solucion_pasos:
  - '1. Factor común: $a^n$.'
  - '2. Restando exponentes: $2n - n = n$ y $n - n = 0$.'
  - '3. Resultado: $a^n(a^n + 1)$.'
- titulo: ¿Es $y^n(y^3 - y + 1)$ la forma factorizada de $y^{n+3} - y^{n+1} + y^n$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(n+3)-n=3$, $(n+1)-n=1$, $n-n=0 \implies y^n(y^3 - y + 1)$.
- titulo: ¿El término constante resultante de $(n+k) - (n+k)$ dentro del paréntesis
    equivale a 0?
  respuesta: 'No'
  solucion_pasos:
  - No, $x^0 = 1$, el residuo multiplicativo es $1$.
errores_frecuentes:
- Multiplicar los exponentes literales en lugar de restarlos al dividir potencias
  de igual base.
- Declarar que los exponentes con letras no se pueden restar algebraicamente.
- Reemplazar por 0 el residuo multiplicativo cuando el exponente del término coincide
  con el extraído.
- Declarar que $2^{n+2} + 2^n$ es igual a $2^{2n+2}$ sumando directamente los exponentes.
- Dividir las bases numéricas en lugar de conservar la base al factorizar potencias
  de igual base.
afirmaciones_verdaderas:
- La división de potencias de igual base con exponentes literales aplica la resta
  $(n+k) - n = k$.
- La descomposición de potencias de suma $a^{n+k} = a^n \cdot a^k$ respalda la extracción
  del factor común literal.
al_terminar_debes_poder: Al terminar serás capaz de factorizar expresiones algebraicas
  complejas con exponentes literales y paramétricos.
