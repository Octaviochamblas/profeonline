semantic_id: MAT.ALG.FACTOR_COMUN.EXPONENTES_LITERALES
resumen_inicial: 'La extracción de factor común con exponentes literales consiste en factorizar polinomios cuyos exponentes
  contienen variables algebraicas (ej: $x^{n+2} + x^{n+1}$) aplicando la resta de expresiones algebraicas en los exponentes.'
explicacion_simple: "Cuando los exponentes de un polinomio contienen letras (como $n+3, n+1, n+2$):\n- **REGLA DE LOS EXPONENTES\
  \ LITERALES**:\n  1. **Busca el menor exponente literal**:\n     - Entre $x^{n+3}$ y $x^{n+1}$, la menor potencia es **$x^{n+1}$**\
  \ (¡porque $n+1$ es más pequeño que $n+3$!).\n  2. **Resta los exponentes algebraicos al dividir**:\n     - Exponente primer\
  \ término: $(n + 3) - (n + 1) = n + 3 - n - 1 = \\mathbf{2} \\implies \\mathbf{x^2}$.\n     - Exponente segundo término:\
  \ $(n + 1) - (n + 1) = \\mathbf{0} \\implies \\mathbf{1}$.\n  3. **Resultado factorizado**:\n     $$x^{n+3} + x^{n+1} =\
  \ \\mathbf{x^{n+1} (x^2 + 1)}$$\n\n![Factor común con exponentes literales](/static/img/nodos/extraccion-de-factor-comun-con-exponentes-literales-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la familia de monomios con exponente paramétrico $T_i = c_i x^{a_i n + b_i} \in \mathbb{R}[x]$ con $n \in \mathbb{N}$
  y $a_i, b_i \in \mathbb{Z}$. La **extracción de factor común con exponentes literales** define el mapa de reducción:


  $$P(x) = \sum_{i=1}^k c_i x^{a n + b_i} = x^{a n + \min_i(b_i)} \cdot \left( \sum_{i=1}^k c_i x^{b_i - \min_i(b_i)} \right)$$


  donde $x^{a n + \min_i(b_i)}$ representa el factor común de exponente paramétrico minimal.


  ### Álgebra de Exponentes en la División

  Para cada término $T_i = c_i x^{an + b_i}$ dividido entre el factor común $M = x^{an + b_{\min}}$:


  $$\frac{T_i}{M} = c_i x^{(an + b_i) - (an + b_{\min})} = c_i x^{an - an + b_i - b_{\min}} = c_i x^{b_i - b_{\min}}$$


  Notarás que la variable $n$ **se cancela por completo en la resta de exponentes**, dejando en el paréntesis cociente únicamente
  exponentes numéricos constantes $b_i - b_{\min} \ge 0$.


  ### Síntesis didáctica

  Restar expresiones algebraicas en los exponentes elimina el parámetro variable $n$ de los términos dentro del paréntesis
  factorizado.

  '
definiciones_clave: '- **Exponente literal ($an + b$)**: Expresión algebraica paramétrica que figura en la posición del exponente
  de una variable.

  - **Cancelación de la componente literal ($an - an = 0$)**: Anulación del término paramétrico en la resta de exponentes
  al realizar la división.

  - **Factor común paramétrico ($x^{an + b_{\min}}$)**: Monomio divisor cuyo exponente contiene la parte variable común $an$
  más la constante mínima.

  '
propiedades_relaciones: '- **Simplificación del cociente**: Los términos dentro del paréntesis $Q(x)$ se convierten en potencias
  simples con exponentes numéricos enteros constantes.

  '
ejemplo_guiado:
  enunciado: Extrae el factor común y factoriza completamente la expresión $x^{2n+3} + x^{2n+1} - x^{2n+2}$.
  pasos:
  - 'Paso 1: Examinamos los exponentes de la variable $x$: $2n+3, 2n+1, 2n+2$.'
  - 'Paso 2: Identificamos el menor exponente constante: $\min(3, 1, 2) = 1 \implies \text{Factor común: } \mathbf{x^{2n+1}}$.'
  - 'Paso 3: Restamos el exponente común a cada término: - Término 1: $(2n + 3) - (2n + 1) = 2n + 3 - 2n - 1 = \mathbf{2}
    \implies \mathbf{x^2}$. - Término 2: $(2n + 1) - (2n + 1) = \mathbf{0} \implies \mathbf{+1}$. - Término 3: $(2n + 2) -
    (2n + 1) = 2n + 2 - 2n - 1 = \mathbf{1} \implies \mathbf{-x^1 = -x}$.'
  - 'Paso 4: Unimos el factor común con el cociente dentro del paréntesis: $x^{2n+1} (x^2 + 1 - x)$.'
  - 'Conclusión: La expresión factorizada es **$x^{2n+1} (x^2 - x + 1)$**.'
  imagen: /static/img/nodos/extraccion-de-factor-comun-con-exponentes-literales-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Al dividir el término $x^{n+5}$ entre el factor común de exponente literal $x^{n+2}$, ¿cuál es el exponente resultante
    de la variable $x$ dentro del paréntesis?
  choices:
  - text: El exponente es 3, calculando la resta algebraica $(n+5) - (n+2) = n + 5 - n - 2 = 3 \implies x^3$
    is_correct: true
  - text: El exponente es $2n + 7$
    is_correct: false
  - text: El exponente es $n + 3$
    is_correct: false
  - text: El exponente es $10$
    is_correct: false
  explanation: 'La alternativa correcta es ''El exponente es 3, calculando la resta algebraica $(n+5) - (n+2) = n + 5 - n
    - 2 = 3 \implies x^3$''. Cancelación de $n$: $(n+5)-(n+2)=3 \implies x^3$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la factorización de $a^{m+2} + a^{m+1}$?
  choices:
  - text: La factorización es $a^{m+1}(a + 1)$, extrayendo el menor exponente $a^{m+1}$
    is_correct: true
  - text: La factorización es $a^m(a^2 + a)$
    is_correct: false
  - text: La factorización es $a^{2m+3}$
    is_correct: false
  - text: La factorización es $a^{m+2}(a + 1)$
    is_correct: false
  explanation: La alternativa correcta es 'La factorización es $a^{m+1}(a + 1)$, extrayendo el menor exponente $a^{m+1}$'.
    $a^{m+1}(a^{(m+2)-(m+1)} + 1) = a^{m+1}(a^1 + 1) = a^{m+1}(a+1)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la parte variable común $an$ en los exponentes de la expresión.'
- 'Paso 2: Determinar la constante mínima de los exponentes y escribir el factor común $x^{an + b_{\min}}$.'
- 'Paso 3: Restar algebraicamente $(an + b_i) - (an + b_{\min})$ eliminando el parámetro $n$.'
- 'Paso 4: Escribir las potencias resultantes con sus exponentes numéricos reducidos dentro del paréntesis.'
errores_correccion: '- **Error 1:** Excluir la inversión de signos al restar un exponente entre paréntesis (escribir $(n+3)
  - (n+1) = n+3-n+1 = 4$). **Cómo corregirlo:** Al restar exponentes con paréntesis **EL SIGNO MENOS CAMBIA TODOS LOS SIGNOS
  INTERNOS ($(n+3) - (n+1) = n+3-n-1 = 2$)**.

  - **Error 2:** Multiplicar los exponentes literales en lugar de restarlos al realizar la división monomial. **Cómo corregirlo:**
  En la división de potencias **LOS EXPONENTES ALGEBRAICOS SE RESTAN**.

  '
ejemplos:
- titulo: Resta de exponente con paréntesis
  enunciado: Para $(n+4) - (n+1)$, ¿es el resultado de la resta igual a $3$?
  respuesta: Sí
  solucion_pasos:
  - 1. $n + 4 - n - 1 = 3$.
- titulo: Extracción de menor constante
  enunciado: Entre $x^{n+5}$ y $x^{n+2}$, ¿es $x^{n+2}$ el menor exponente común?
  respuesta: Sí
  solucion_pasos:
  - Sí, 2 es menor que 5.
- titulo: Cancelación del parámetro n
  enunciado: ¿Se cancela la variable $n$ en la división $\frac{x^{n+3}}{x^{n+1}} = x^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(n+3) - (n+1) = 2$.
- titulo: Factorización de expresión binómica
  enunciado: ¿Es $y^a (y^2 - 1)$ la factorización de $y^{a+2} - y^a$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $y^a$ es el común y $y^a/y^a = 1$.
errores_frecuentes:
- La distribución del signo negativo al restar expresiones algebraicas en los exponentes no se realiza.
- Multiplicar los exponentes literales en lugar de restarlos al dividir por el factor común.
- Dejar la variable paramétrica n flotando dentro de los exponentes del paréntesis factorizado.
- Elegir la constante máxima del exponente literal en lugar de la mínima.
- Olvidar colocar 1 cuando el exponente del término coincide exactamente con el del factor común.
afirmaciones_verdaderas:
- La extracción de factor común con exponentes literales requiere restar algebraicamente los exponentes desfasados.
- La componente paramétrica $an$ se cancela en la resta de exponentes dejando potencias numéricas en el paréntesis.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/extraccion-de-factor-comun-con-exponentes-literales-resumen.svg)


  QUÉ: Extraer el factor común con exponentes literales restando expresiones algebraicas en los exponentes.

  CÓMO: Extraer $x^{an + b_{\min}}$ y restar algebraicamente $(an + b_i) - (an + b_{\min}) = b_i - b_{\min}$ cancelando la
  variable paramétrica $n$ en los exponentes del paréntesis cociente.

  '
