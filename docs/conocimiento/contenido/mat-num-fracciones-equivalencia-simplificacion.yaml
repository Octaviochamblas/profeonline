semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.SIMPLIFICACION
resumen_inicial: "La simplificación es el proceso de dividir tanto el numerador como el denominador por un mismo divisor común distinto de cero, obteniendo una fracción equivalente más sencilla."
explicacion_simple: |
  Simplificar una fracción es lo contrario de amplificar: es agrupar los trozos pequeños para formar trozos más grandes sin cambiar la cantidad total. Si tienes $\frac{4}{8}$ de una pizza, puedes dividir tanto el 4 como el 8 por 4, y descubres que te queda $\frac{1}{2}$. En matemática, **simplificar** significa dividir el número de arriba y el de abajo por un divisor común. Esto hace que la fracción sea mucho más fácil de leer y calcular.
explicacion_formal: |
  Formalmente, dada la fracción $\frac{a}{b}$ (con $b \neq 0$) y un divisor común $d \in \mathbb{Z} \setminus \{0\}$ de $a$ y $b$ (tal que $d \mid a$ y $d \mid b$), la **simplificación por $d$** se expresa como:
  $\frac{a}{b} \xrightarrow{\text{simplificar por } d} \frac{a \div d}{b \div d}$

  Su validez algebraica se fundamenta en la propiedad del elemento neutro multiplicativo $1 = \frac{1/d}{1/d}$:
  $\frac{a \div d}{b \div d} = \frac{a \cdot$ \frac{1}{d}$}{b \cdot$ \frac{1}{d}$} = \frac{a}{b} \cdot \left(\frac{1/d}{1/d}\right) = \frac{a}{b} \cdot 1 = \frac{a}{b}$
  Si se simplifica utilizando el Máximo Común Divisor $d = \text{MCD}(a, b)$, la fracción resultante es **irreductible**.
definiciones_clave: |
  - **Simplificación**: División simultánea del numerador y del denominador por un divisor común no nulo.
  - **Divisor común ($d$)**: Número entero que divide de manera exacta tanto a $a$ como a $b$.
  - **Simplificación máxima**: Reducción directa utilizando $d = \text{MCD}(a, b)$ para obtener la fracción irreductible.
propiedades_relaciones: |
  - **Unicidad de la forma irreductible**: Toda fracción puede simplificarse sucesivamente hasta llegar a una única representación irreductible canónica.
  - **Conservación de equivalencia**: La simplificación no altera la posición del número racional en la recta numérica.
  - **Relación inversa con la amplificación**: La simplificación por $d$ es el proceso inverso exacto de la amplificación por $d$.
ejemplo_guiado:
  enunciado: "Simplifica la fracción $\\frac{24}{36}$ paso a paso utilizando divisores comunes y halla su forma irreductible usando el MCD."
  pasos:
    - 'Paso a paso (divisores sucesivos): dividir numerador y denominador entre $2$: $\frac{24 \div 2}{36 \div 2} = \frac{12}{18}$.'
    - 'Continuar dividiendo entre $6$: $\frac{12 \div 6}{18 \div 6} = \frac{2}{3}$.'
    - 'Paso directo usando el MCD: hallar $\text{MCD}(24, 36) = 12$.'
    - 'Dividir directamente por $12$: $\frac{24 \div 12}{36 \div 12} = \frac{2}{3}$.'
    - 'Conclusión: la fracción simplificada equivalente es $\frac{2}{3}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué condición matemática debe cumplir el número $d$ para poder simplificar la fracción $\\frac{a}{b}$ mediante la división $\\frac{a \\div d}{b \\div d}$?"
    choices:
      - {text: "El número $d$ debe ser un divisor común exacto de ambos términos ($d \\mid a$ y $d \\mid b$) y distinto de cero.", is_correct: true}
      - {text: "El número $d$ debe ser mayor que el numerador $a$.", is_correct: false}
      - {text: "El número $d$ debe ser un número primo impar obligatoriamente.", is_correct: false}
      - {text: "El número $d$ debe ser igual a la suma de $a$ y $b$.", is_correct: false}
    explanation: "La correcta es El número $d$ debe ser un divisor común exacto de ambos términos ($d \\mid a$ y $d \\mid b$) y distinto de cero.: la simplificación requiere divisibilidad exacta en numerador y denominador."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Si simplificas la fracción $\\frac{45}{60}$ por su Máximo Común Divisor ($15$), ¿cuál es el resultado obtenido?"
    choices:
      - {text: '\$\frac{3}{4}$', is_correct: true}
      - {text: '\$\frac{9}{12}$', is_correct: false}
      - {text: '\$\frac{5}{4}$', is_correct: false}
      - {text: '\$\frac{1}{2}$', is_correct: false}
    explanation: 'La correcta es$ \frac{3}{4}$: dividimos ambos términos por $15$ ($45 \div 15 = 3$ y $60 \div 15 = 4$).'
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identificar un divisor común $d > 1$ entre el numerador $a$ y el denominador $b$ (o calcular $\text{MCD}(a, b)$).'
  - 'Paso 2: Dividir el numerador por $d$: $a \div d$.'
  - 'Paso 3: Dividir el denominador por $d$: $b \div d$.'
  - 'Paso 4: Escribir la nueva fracción $\frac{a \div d}{b \div d}$ y repetir si aún poseen divisores comunes.'
errores_correccion: |
  El error más común es dividir el numerador por un número y el denominador por otro distinto (por ejemplo, dividir el de arriba por 2 y el de abajo por 3). Ambos números **deben dividirse por el mismo factor exacto**.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Simplifica la fracción $\\frac{18}{24}$ a su forma más sencilla."
    alternativas:
      - '\$\frac{3}{4}$'
      - '\$\frac{9}{12}$'
      - '\$\frac{6}{8}$'
    respuesta: '\$\frac{3}{4}$'
    solucion_pasos:
      - "El Máximo Común Divisor de 18 y 24 es 6."
      - 'Dividimos ambos términos por 6: $18 \div 6 = 3$ y $24 \div 6 = 4$.'
      - 'Obtenemos la fracción irreductible $\frac{3}{4}$.'
  - titulo: "Ejemplo 2"
    enunciado: "Un estanque contiene 80 litros de un total de 100 litros de capacidad. ¿Cómo se expresa la fracción de capacidad ocupada en su forma simplificada?"
    alternativas:
      - '\$\frac{4}{5}$'
      - '\$\frac{8}{10}$'
      - '\$\frac{2}{5}$'
    respuesta: '\$\frac{4}{5}$'
    solucion_pasos:
      - 'La fracción inicial es $\frac{80}{100}$.'
      - 'Dividimos numerador y denominador por 20: $\frac{80 \div 20}{100 \div 20} = \frac{4}{5}$.'
  - titulo: "¿Se puede simplificar una fracción dividiendo ambos términos por 1?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, aunque al dividir por 1 la fracción se mantiene exactamente igual (operación identidad)."
  - titulo: "¿Si una fracción ya no tiene divisores comunes mayores que 1 se dice que es irreductible?"
    respuesta: "Sí"
    solucion_pasos:
      - 'Sí, cuando $\text{MCD}(a, b) = 1$, la fracción no se puede simplificar más y es irreductible.'
errores_frecuentes:
  - "Dividir el numerador y el denominador por números diferentes."
  - "Restar un número en lugar de dividir al intentar simplificar."
  - "Detener el proceso de simplificación antes de llegar a la fracción irreductible."
  - "Intentar simplificar dividiendo entre cero."
  - "Creer que la fracción simplificada representa una cantidad menor que la original."
afirmaciones_verdaderas:
  - "Simplificar una fracción consiste en dividir su numerador y denominador por un mismo divisor común."
  - "Al simplificar una fracción por el Máximo Común Divisor de sus términos se obtiene su versión irreductible."
al_terminar_debes_ponder: |
  Debes ser capaz de simplificar fracciones mediante divisores sucesivos o mediante el MCD, reconociendo la equivalencia en todo momento.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
