semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.SIMPLIFICACION
resumen_inicial: 'Simplificar una fracción consiste en dividir simultáneamente su numerador y su denominador entre un divisor común distinto de cero: $\frac{a : d}{b : d}$.'
explicacion_simple: 'Simplificar una fracción es el proceso inverso a amplificar. Consiste en dividir el número de arriba y el de abajo entre el mismo número divisor para obtener una fracción con términos más pequeños y fáciles de entender, manteniendo exactamente el mismo valor original.


  ![Simplificación de fracciones](/static/img/nodos/simplificacion-de-fracciones-intro.svg)'
explicacion_formal: 'Dada la fracción $\frac{a}{b} \in \mathbb{Q}$ y un divisor común $d \in D^+(a) \cap D^+(b)$ con $d > 1$, la **Operación de Simplificación** se define como:


  $$\operatorname{Simp}_d\left(\frac{a}{b}\right) = \frac{a : d}{b : d} \quad \text{donde } \frac{a : d}{b : d} \sim \frac{a}{b}$$


  **Desglose de la fórmula:**

  - $d \mid a$ y $d \mid b$: Divisor entero común de ambos términos.

  - $\frac{d}{d} = 1$: Propiedad de neutro multiplicativo que conserva el valor exacto del racional.


  > **Complemento didáctico:** Para simplificar una fracción de un solo paso hasta su expresión irreducible, se debe dividir arriba y abajo entre el $\operatorname{MCD}(a, b)$.'
definiciones_clave: '- **Simplificación de fracciones**: División exacta de numerador y denominador por un divisor común $d > 1$.

  - **Reducción directa por M.C.D.**: Simplificación máxima alcanzada al dividir por el máximo común divisor.'
propiedades_relaciones: '- **Simplificación por M.C.D.**: Dividir por el $\operatorname{MCD}(a, b)$ produce en un único paso la fracción irreductible.'
ejemplo_guiado:
  enunciado: 'Simplifique la fracción $\frac{18}{24}$ hasta llevarla a su forma más simple.


    ![Ejemplo Simplificación de fracciones](/static/img/nodos/simplificacion-de-fracciones-ejemplos.svg)'
  pasos:
  - 'Paso 1: Hallar divisores comunes de 18 y 24: son divisibles por 2, 3 y 6.'
  - 'Paso 2: Opción A (sucesiva): Dividir entre 2 $\implies \frac{18:2}{24:2} = \frac{9}{12}$. Luego dividir entre 3 $\implies \frac{9:3}{12:3} = \frac{3}{4}$.'
  - 'Paso 3: Opción B (directa): Calcular $\operatorname{MCD}(18, 24) = 6$ y dividir entre 6 $\implies \frac{18:6}{24:6} = \frac{3}{4}$.'
  - 'Conclusión: La fracción simplificada es $\frac{3}{4}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué consiste la operación de simplificar una fracción?
  choices:
  - text: En dividir el numerador y el denominador entre un divisor común positivo
    is_correct: true
  - text: En restar el mismo número a ambos términos
    is_correct: false
  - text: En multiplicar por dos el denominador
    is_correct: false
  - text: En eliminar el denominador
    is_correct: false
  explanation: La alternativa correcta es 'En dividir el numerador y el denominador entre un divisor común positivo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 18/24, ¿cuál fue la fracción simplificada resultante?
  choices:
  - text: 3/4
    is_correct: true
  - text: 9/12
    is_correct: false
  - text: 1/2
    is_correct: false
  - text: 6/8
    is_correct: false
  explanation: La alternativa correcta es '3/4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar un divisor común $d > 1$ del numerador y del denominador.'
- 'Paso 2: Dividir el numerador por $d$ y el denominador por $d$.'
- 'Paso 3: Repetir el proceso con el resultado hasta que no existan más divisores comunes (fracción irreductible).'
errores_correccion: '- **Error 1: Dividir entre números que no son divisores exactos (dando decimales).** **Cómo corregirlo:** La simplificación exige divisores ENTEROS exactos con resto cero.


  - **Error 2: Dividir el numerador por un número y el denominador por otro diferente.** **Cómo corregirlo:** El divisor $d$ debe ser ESTRICTAMENTE EL MISMO para ambos términos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifique la fracción 20/30 dividiendo entre 10.
  alternativas:
  - 2/3
  - 10/15
  - 4/6
  respuesta: 2/3
  solucion_pasos:
  - $\frac{20:10}{30:10} = \frac{2}{3}$.
- titulo: Ejemplo 2
  enunciado: ¿Se puede simplificar la fracción 7/11?
  alternativas:
  - No, porque 7 y 11 son primos entre sí (MCD = 1)
  - Sí, dividiendo entre 2
  - Sí, restando 1
  respuesta: No, porque 7 y 11 son primos entre sí (MCD = 1)
  solucion_pasos:
  - $\operatorname{MCD}(7, 11) = 1$, por ende es irreductible y no se simplifica más.
- titulo: ¿Dividir por el M.C.D. de numerador y denominador simplifica la fracción al máximo de un solo paso?
  respuesta: Sí
  solucion_pasos:
  - Sí, la división por el M.C.D. produce inmediatamente la fracción irreductible.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde con precisión a las reglas de equivalencia, simplificación o conversión analizadas.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el algoritmo matemático entrega un resultado único y bien definido.
  - texto: No es posible determinar la equivalencia
    es_correcta: false
    retroalimentacion: Incorrecto, los teoremas y algoritmos de fracciones permiten resolver unívocamente.
- titulo: ¿Al simplificar una fracción cambia su valor numérico?
  respuesta: 'No'
  solucion_pasos:
  - No, la simplificación conserva el mismo valor cuantitativo equivalente.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde con precisión a las reglas de equivalencia, simplificación o conversión analizadas.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el algoritmo matemático entrega un resultado único y bien definido.
  - texto: No es posible determinar la equivalencia
    es_correcta: false
    retroalimentacion: Incorrecto, los teoremas y algoritmos de fracciones permiten resolver unívocamente.
errores_frecuentes:
- Simplificar una fracción requiere restar una misma cifra al numerador y al denominador.
- Es válido simplificar dividiendo el numerador por 2 y el denominador por 5.
- Al simplificar una fracción su valor numérico en la recta se reduce a la mitad.
- Se puede simplificar una fracción dividiendo por un número decimal que deje residuo.
- Todas las fracciones racionales se pueden simplificar infinitas veces.
afirmaciones_verdaderas:
- Simplificar una fracción consiste en dividir el numerador y el denominador por un mismo divisor común exacto.
- Dividir el numerador y el denominador por su M.C.D. transforma la fracción en su forma irreductible.
al_terminar_debes_ponder: Al terminar serás capaz de simplificar cualquier fracción, dividiendo numerador y denominador entre sus divisores comunes hasta obtener una fracción equivalente más sencilla.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
al_terminar_debes_poder: '**QUÉ:** Simplificar fracciones a su expresión reducida facilitando operaciones aritméticas y algebraicas.


  **CÓMO:** Dividiendo sucesivamente numerador y denominador por divisores comunes $d > 1$ o dividiendo directamente en un solo paso por el máximo común divisor $d = \text{mcd}(a, b)$.


  ![Resumen Simplificación de fracciones](/static/img/nodos/simplificacion-de-fracciones-resumen.svg)'
