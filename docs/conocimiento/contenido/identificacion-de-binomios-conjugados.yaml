resumen_inicial: La identificación de binomios conjugados consiste en reconocer pares
  de expresiones algebraicas donde un término mantiene su signo y el otro lo invierte.
explicacion_simple: Para saber si dos binomios se pueden multiplicar con la regla
  de suma por diferencia, busca que compartan exactamente los mismos elementos, pero
  uno de ellos aparezca con signo positivo en un lado y con signo negativo en el otro,
  como $(-2x + 3y)$ y $(2x + 3y)$. El término común es $+3y$ y el término conjugado
  es $2x$.
explicacion_formal: 'Dos binomios $B_1$ y $B_2$ son **Conjugados** si y solo si existen
  monomios $u, v$ tales que:


  $$B_1 = u + v \quad \text{y} \quad B_2 = u - v$$


  **Criterio formal de descomposición:**

  - $u$: Término invariante de signo (término principal de la diferencia $u^2$).

  - $v$: Término variante de signo (término secundario restado $-v^2$).


  $$B_1 \cdot B_2 = (u + v)(u - v) = u^2 - v^2$$


  > **Complemento didáctico:** Permite reordenar la adición internamente para aplicar
  la propiedad sin confundir qué término resta en el resultado final.'
definiciones_clave: '- **Término invariante ($u$)**: Elemento del binomio que conserva
  idéntico signo en ambos factores.

  - **Término variante ($v$)**: Elemento del binomio que cambia de signo entre factores.'
propiedades_relaciones: '- **Reordenamiento conmutativo**: La reordenación aditiva
  $(-a + b)(a + b) = (b - a)(b + a) = b^2 - a^2$ preserva la validez de la regla.'
ejemplo_guiado:
  enunciado: Identifique el término invariante $u$ y el término variante $v$ en la
    multiplicación $(-3x + 5y)(3x + 5y)$ y determine su desarrollo.
  pasos:
  - 'Paso 1: Observar los signos de los términos: $5y$ es positivo en ambos factores
    $\to u = 5y$.'
  - 'Paso 2: Observar el término que cambia de signo: $-3x$ en el primero y $+3x$
    en el segundo $\to v = 3x$.'
  - 'Paso 3: Reescribir como $(5y - 3x)(5y + 3x)$.'
  - 'Paso 4: Aplicar diferencia de cuadrados $u^2 - v^2 = (5y)^2 - (3x)^2 = 25y^2
    - 9x^2$.'
  - 'Conclusión: El producto ordenado resulta $25y^2 - 9x^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: En los binomios $(-a + b)$ y $(a + b)$, ¿cuál es el término invariante
    $u$?
  choices:
  - text: $b$, porque es positivo en ambos binomios
    is_correct: true
  - text: $a$, porque es el primer término
    is_correct: false
  - text: $-a$, porque lleva el signo menos
    is_correct: false
  - text: Ninguno de los dos
    is_correct: false
  explanation: La alternativa correcta es '$b$, porque es positivo en ambos binomios'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de $(-3x + 5y)(3x + 5y)$, ¿cuál es el resultado correcto?
  choices:
  - text: $25y^2 - 9x^2$
    is_correct: true
  - text: $9x^2 - 25y^2$
    is_correct: false
  - text: $25y^2 + 9x^2$
    is_correct: false
  - text: $-9x^2 - 25y^2$
    is_correct: false
  explanation: La alternativa correcta es '$25y^2 - 9x^2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comparar los signos de los componentes de ambos factores.'
- 'Paso 2: Asignar $u$ al término que mantiene su signo y $v$ al término que cambia
  de signo.'
- 'Paso 3: Calcular el desarrollo ordenado $u^2 - v^2$.'
errores_correccion: '- **Error 1: Restar el término equivocado en $(-a + b)(a + b)$
  escribiendo $a^2 - b^2$.** **Cómo corregirlo:** El término que se resta es SIEMPRE
  el que cambia de signo ($a$), dando $b^2 - a^2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle $(-x + 2y)(x + 2y)$.
  alternativas:
  - $4y^2 - x^2$
  - $x^2 - 4y^2$
  - $4y^2 + x^2$
  respuesta: $4y^2 - x^2$
  solucion_pasos:
  - '1. Término invariante: $2y$. Término variante: $x$.'
  - 2. $(2y)^2 - x^2 = 4y^2 - x^2$.
- titulo: Ejemplo 2
  enunciado: ¿Son conjugados los binomios $(4m - 3n)$ y $(3n + 4m)$?
  alternativas:
  - Sí, son conjugados y su producto es $16m^2 - 9n^2$
  - No, porque están desordenados
  - Sí, pero su producto es $9n^2 - 16m^2$
  respuesta: Sí, son conjugados y su producto es $16m^2 - 9n^2$
  solucion_pasos:
  - '1. Ordenando: $(4m - 3n)(4m + 3n)$.'
  - '2. Resultado: $(4m)^2 - (3n)^2 = 16m^2 - 9n^2$.'
- titulo: ¿El producto $(-a - b)(a - b)$ equivale a $b^2 - a^2$?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, reordenando: $(-b - a)(-b + a) = (-b)^2 - a^2 = b^2 - a^2$.'
- titulo: ¿Son conjugados dos binomios cuando los dos términos cambian de signo simultáneamente?
  respuesta: 'No'
  solucion_pasos:
  - 'No, si ambos cambian de signo son binomios opuestos: $-(a+b)$, no conjugados.'
errores_frecuentes:
- Restar el término invariante en lugar del término variante al aplicar la diferencia
  de cuadrados.
- Declarar que el orden de los sumando en el primer binomio altera el término que
  resta.
- Declarar que $(-x + y)(x + y)$ equivale a $x^2 - y^2$.
- Afirmar que binomios con ambos signos opuestos son conjugados.
- Asignar signo negativo a ambos cuadrados en el desarrollo final.
afirmaciones_verdaderas:
- En la multiplicación de binomios conjugados, el término que se resta es aquel que
  posee signos opuestos en ambos factores.
- La conmutatividad de la adición permite reordenar los binomios para identificar
  claramente el término invariante.
al_terminar_debes_poder: Al terminar serás capaz de identificar con precisión el término
  invariante y el variante en binomios conjugados desordenados.
