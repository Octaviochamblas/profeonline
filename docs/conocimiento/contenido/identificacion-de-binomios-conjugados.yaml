procedimiento:
- 'Paso 1: Al enfrentarte a un producto de binomios:'
- 'Paso 2: Revisa el primer término del primer binomio. ¿Aparece exactamente igual
  en el segundo binomio?'
- 'Paso 3: Revisa el segundo término del primer binomio. ¿Aparece su inverso aditivo
  (con el signo cambiado) en el segundo binomio?'
- 'Paso 4: Si la respuesta es sí a ambas, estás frente a una suma por su diferencia.'
- 'Paso 5: Nota: el orden no importa por conmutatividad. $(x-4)(x+4)$ es lo mismo
  que $(x+4)(x-4)$ o $(4+x)(x-4)$.'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en identificación de binomios conjugados.
ejemplos:
- titulo: Conjugados desordenados
  enunciado: ¿Es $(2a + 5)(5 - 2a)$ un producto de suma por diferencia?
  solucion_pasos:
  - 'Identificamos términos: En el primero están $2a$ y $5$.'
  - En el segundo están $-2a$ y $5$.
  - El término idéntico es $5$. El término opuesto es $2a$ y $-2a$.
  - Sí lo es. Puede reescribirse como $(5 + 2a)(5 - 2a)$.
- titulo: Para que $(ax + b)(cx - d)$ sea resoluble usando la fórmula de suma por
    diferencia, asumiend
  enunciado: 'Para que $(ax + b)(cx - d)$ sea resoluble usando la fórmula de suma
    por diferencia, asumiendo $a,b,c,d > 0$, ¿qué condición necesaria deben cumplir
    las constantes?


    Opciones: A) $a = c$ y $b = d$. · B) $a = d$ y $b = c$. · C) $ac = bd$. · D) $a+c
    = 0$.'
  solucion_pasos:
  - 'Deben ser los mismos términos exactos: el estable $ax$ debe igualar a $cx$ ($a=c$),
    y el opuesto $b$ debe igualar a $d$ ($b=d$).'
  - 'Respuesta: $a = c$ y $b = d$.'
- titulo: 'Respecto de «Identificación de binomios conjugados»: ¿Es correcta esta
    caracterización? «Dos'
  enunciado: 'Respecto de «Identificación de binomios conjugados»: ¿Es correcta esta
    caracterización? «Dos binomios son **conjugados** si tienen exactamente los mismos
    términos, pero difieren únicamente en el signo que los separa»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Dos binomios son **conjugados**
    si tienen exactamente los mismos términos, pero difieren únicamente en el signo
    que los separa.'
- titulo: 'Respecto de «Identificación de binomios conjugados»: ¿Es válida esta afirmación?
    «Creer que'
  enunciado: 'Respecto de «Identificación de binomios conjugados»: ¿Es válida esta
    afirmación? «Creer que $(x-y)(y-x)$ es suma por diferencia. ¡No lo es! El término
    $x$ y el término $y$ cambian de signo en ambos»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Dos binomios son **conjugados**
    si tienen exactamente los mismos términos, pero difieren únicamente en el signo
    que los separa.'
errores_frecuentes:
- Creer que $(x-y)(y-x)$ es suma por diferencia. ¡No lo es! El término $x$ y el término
  $y$ cambian de signo en ambos.
- Para «Para que dos binomios sean considerados 'conjugados' (o suma por su diferencia),
  es necesario y suficiente que:», la respuesta correcta es Tengan variables distintas.
- Ambos sean sumas de números positivos.
- Tengan un solo término común.
- $(5x - 3)(5x - 3)$.
afirmaciones_verdaderas:
- Los productos notables permiten obtener desarrollos algebraicos sin multiplicar
  término a término.
al_terminar_debes_poder: Reconocer y expandir expresiones utilizando identificación
  de binomios conjugados.
