semantic_id: MAT.ALG.SUMA_DIFERENCIA.IDENTIFICACION_CONJUGADOS
resumen_inicial: La identificación de binomios conjugados consiste en examinar un par de binomios para verificar si comparten
  un término exactamente igual (mismo signo) y un término opuesto (signos cambiados).
explicacion_simple: "Para saber si dos binomios son **conjugados** y aplicar el truco rápido de la diferencia de cuadrados,\
  \ debes revisar sus términos con esta regla visual:\n- **CRITERIO DE RECONOCIMIENTO**:\n  1. **Término Igual (Idéntico)**:\
  \ Debe estar en ambos binomios con **el mismo signo**.\n  2. **Término Opuesto**: Debe estar en un binomio con **signo $+$**\
  \ y en el otro con **signo $-$**.\n- **Ejemplos de Binomios Conjugados**:\n  - $(x + 4)$ y $(x - 4) \\implies$ Término igual:\
  \ $x$; Término opuesto: $+4$ y $-4$.\n  - $(-3a + 2b)$ y $(-3a - 2b) \\implies$ Término igual: $-3a$; Término opuesto: $+2b$\
  \ y $-2b$.\n  - $(5 - y)$ y $(5 + y) \\implies$ Término igual: $5$; Término opuesto: $-y$ y $+y$.\n- **REGLA DEL RESULTADO**:\n\
  \  $$\\text{Resultado} = (\\text{Término Igual})^2 - (\\text{Término Opuesto})^2$$\n\n![Identificación de binomios conjugados](/static/img/nodos/identificacion-de-binomios-conjugados-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sean dos binomios generales en $\mathbb{R}[x,y]$ expresados como $B_1 = (t_1 + t_2)$ y $B_2 = (t_3 + t_4)$. Se define la
  relación de **conjugación algebraica** $\mathcal{C}(B_1, B_2)$ si y sólo si existe una permutación de componentes tal que:


  $$\operatorname{sgn}(t_1) = \operatorname{sgn}(t_3) \land |t_1| = |t_3| \quad \text{(Término invariante } u\text{)}$$

  $$\operatorname{sgn}(t_2) = -\operatorname{sgn}(t_4) \land |t_2| = |t_4| \quad \text{(Término anti-invariante } v\text{)}$$


  En cuyo caso la representación binómica canónica es $B_1 = (u + v)$ y $B_2 = (u - v)$.


  ### Invarianza por Reordenamiento

  La identificación exige abstraer el orden de escritura posicional de los términos. Por ejemplo, en $(b + a)(a - b)$, el
  término $a$ posee el mismo signo positivo en ambos binomios ($u = a$), mientras que $b$ cambia de $+b$ a $-b$ ($v = b$),
  determinando que el producto es $(a+b)(a-b) = a^2 - b^2$.


  ### Síntesis didáctica

  Identificar cuál es el término igual y cuál es el término opuesto evita cometer errores de signos al restar los cuadrados
  en el orden equivocado.

  '
definiciones_clave: '- **Término invariante ($u$)**: Componente del binomio que preserva su magnitud y signo en ambos factores
  multiplicandos.

  - **Término anti-invariante ($v$)**: Componente del binomio que preserva su magnitud pero invierte estrictamente su signatura
  de $+$ a $-$.

  - **Reconocimiento de estructura conjugada**: Proceso de inspección de dos binomios para clasificar si admiten la forma
  $(u+v)(u-v)$.

  '
propiedades_relaciones: '- **Orden de la diferencia de cuadrados**: El resultado es siempre $(\text{Término igual})^2 - (\text{Término
  opuesto})^2$.

  - **Diferencia con binomios opuestos**: Los binomios opuestos $(-a-b)$ y $(a+b)$ cambian los signos de AMBOS términos; los
  conjugados cambian el signo de UNO SOLO.

  '
ejemplo_guiado:
  enunciado: Identifica si los binomios $(3y - 5x)$ y $(5x + 3y)$ son conjugados y determina su producto.
  pasos:
  - 'Paso 1: Examinamos los términos del primer binomio: $+3y$ y $-5x$.'
  - 'Paso 2: Examinamos los términos del segundo binomio: $+5x$ y $+3y$.'
  - 'Paso 3: Identificamos el **término igual (mismo signo)**: $+3y$ está positivo en ambos $\implies u = 3y$.'
  - 'Paso 4: Identificamos el **término opuesto (signo cambiado)**: $-5x$ en el primero y $+5x$ en el segundo $\implies v
    = 5x$.'
  - 'Paso 5: Confirmamos que son conjugados de la forma $(3y - 5x)(3y + 5x)$.'
  - 'Paso 6: Calculamos el producto $(\text{igual})^2 - (\text{opuesto})^2$: $(3y)^2 - (5x)^2 = \mathbf{9y^2 - 25x^2}$.'
  - 'Conclusión: Son binomios conjugados y su producto es **$9y^2 - 25x^2$**.'
  imagen: /static/img/nodos/identificacion-de-binomios-conjugados-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Al inspeccionar los binomios $(-2a + 3b)$ y $(2a + 3b)$, ¿cuál es el término igual (invariante) y cuál el opuesto
    (anti-invariante)?
  choices:
  - text: El término igual es $+3b$ (positivo en ambos) y el término opuesto es $2a$ (cambia de $-2a$ a $+2a$)
    is_correct: true
  - text: El término igual es $2a$ y el opuesto es $3b$
    is_correct: false
  - text: Ambos términos son iguales
    is_correct: false
  - text: Ningún término es igual
    is_correct: false
  explanation: La alternativa correcta es 'El término igual es $+3b$ (positivo en ambos) y el término opuesto es $2a$ (cambia
    de $-2a$ a $+2a$)'. Término invariante $+3b$ y anti-invariante $2a$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de multiplicar los binomios conjugados desordenados $(4 - x) \cdot (x + 4)$?
  choices:
  - text: El resultado es $16 - x^2$, identificando que el término igual es $4$ y el opuesto es $x$ ($4^2 - x^2 = 16 - x^2$)
    is_correct: true
  - text: El resultado es $x^2 - 16$
    is_correct: false
  - text: El resultado es $16 + x^2$
    is_correct: false
  - text: El resultado es $x^2 - 8x + 16$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $16 - x^2$, identificando que el término igual es $4$ y el opuesto
    es $x$ ($4^2 - x^2 = 16 - x^2$)'. Término igual $4 \implies 4^2 - x^2 = 16 - x^2$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comparar los signos de los primeros y segundos términos de ambos binomios.'
- 'Paso 2: Marcar como término igual ($u$) aquel que conserva el mismo signo en ambos paréntesis.'
- 'Paso 3: Marcar como término opuesto ($v$) aquel que invierte su signo de $+$ a $-$.'
- 'Paso 4: Aplicar la fórmula $u^2 - v^2$ asegurando colocar primero el cuadrado del término igual.'
errores_correccion: '- **Error 1:** Colocar en primer lugar el cuadrado del término opuesto (escribir $(4-x)(4+x) = x^2 -
  16$). **Cómo corregirlo:** En primer lugar **VA EL CUADRADO DEL TÉRMINO IGUAL ($4^2 - x^2 = 16 - x^2$)**.

  - **Error 2:** Declarar que binomios con signos cambiados en ambos términos son conjugados (clasificar $(-a-b)$ y $(a+b)$
  como conjugados). **Cómo corregirlo:** Los conjugados **CAMBIAN EL SIGNO DE UN SOLO TÉRMINO, NO DE LOS DOS**.

  '
ejemplos:
- titulo: Identificación básica
  enunciado: En el par $(x + 7)$ y $(x - 7)$, ¿cuál es el término igual?
  alternativas:
  - $x$
  - $7$
  - $-7$
  respuesta: $x$
  solucion_pasos:
  - 1. El término $x$ es positivo en ambos binomios.
  - 2. El 7 cambia de signo.
  - '3. Término igual: $x$.'
- titulo: Desorden posicional
  enunciado: Para $(a + b) \cdot (b - a)$, ¿cuál es el término igual?
  alternativas:
  - $b$
  - $a$
  - Ambos son iguales
  respuesta: $b$
  solucion_pasos:
  - 1. $+b$ en ambos.
  - 2. $+a$ en el primero, $-a$ en el segundo.
  - '3. Resultado: $b^2 - a^2$.'
- titulo: Diferencia con binomios opuestos
  enunciado: Si cambiamos los signos a ambos términos $(-x - 3)$ y $(x + 3)$, ¿son binomios opuestos y NO conjugados?
  respuesta: Sí
  solucion_pasos:
  - Sí, cambiar ambos signos produce el opuesto aditivo.
- titulo: Orden del resultado
  enunciado: En $(5 - x)(5 + x)$, ¿es el resultado $25 - x^2$ por ser 5 el término de igual signo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(\text{igual})^2 - (\text{opuesto})^2 = 5^2 - x^2 = 25 - x^2$.
errores_frecuentes:
- Restar los cuadrados en el orden inverso por no identificar correctamente el término de igual signo.
- Clasificar binomios opuestos (que cambian ambos signos) como si fuesen binomios conjugados.
- Intercambiar el término invariante cuando los binomios están escritos en orden posicional desordenado.
- Elevar al cuadrado la suma de las variables ignorando la estructura de signos.
- Olvidar que los binomios conjugados difieren en el signo de exactamente un término.
afirmaciones_verdaderas:
- Los binomios conjugados se caracterizan por tener un término con el mismo signo y otro término con signos opuestos.
- El resultado de multiplicar binomios conjugados es siempre el cuadrado del término igual menos el cuadrado del término opuesto.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/identificacion-de-binomios-conjugados-resumen.svg)


  QUÉ: Identificar el término igual y el opuesto en binomios conjugados desordenados para calcular $u^2 - v^2$.

  CÓMO: Reconocer el término con signo invariable $u$ y el término con signos contrarios $v$ para plantear $(\text{igual})^2
  - (\text{opuesto})^2 = u^2 - v^2$.

  '
