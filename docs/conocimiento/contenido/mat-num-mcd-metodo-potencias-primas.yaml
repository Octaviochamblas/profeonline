semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.METODO_POTENCIAS_PRIMAS
resumen_inicial: El M.C.D. mediante factores primos es el producto de las bases primas
  COMUNES elevadas a su MENOR exponente.
explicacion_simple: Para calcular el M.C.D. con la descomposición prima, escribimos
  cada número como producto de potencias de primos. Seleccionamos únicamente las bases
  primas que aparezcan en TODOS los números y le asignamos a cada una el exponente
  más pequeño con el que figure.
explicacion_formal: 'Dadas las descomposiciones canónicas de $a$ y $b$ sobre las bases
  primas comunes $p_i \in \operatorname{Bases}(a) \cap \operatorname{Bases}(b)$:


  $$a = \prod p_i^{\alpha_i}, \quad b = \prod p_i^{\beta_i} \implies \operatorname{MCD}(a,
  b) = \prod_{p_i \text{ común}} p_i^{\min(\alpha_i, \beta_i)}$$


  **Desglose de la fórmula:**

  - $p_i \text{ común}$: Solo se incluyen las bases primas presentes simultáneamente
  en todas las descomposiciones.

  - $\min(\alpha_i, \beta_i)$: Selección del MENOR exponente entre las potencias correspondientes.


  > **Complemento didáctico:** Para $24 = 2^3 \cdot 3^1$ y $36 = 2^2 \cdot 3^2$, las
  bases comunes son 2 y 3. Tomamos $2^{\min(3,2)} = 2^2$ y $3^{\min(1,2)} = 3^1$,
  dando $\operatorname{MCD}(24,36) = 2^2 \cdot 3^1 = 12$.'
definiciones_clave: '- **Regla del menor exponente común**: Criterio del M.C.D. que
  multiplica únicamente primos compartidos con su exponente mínimo.'
ejemplo_guiado:
  enunciado: Calcule el $\operatorname{MCD}(40, 60)$ usando la descomposición prima
    y la regla del menor exponente.
  pasos:
  - 'Paso 1: Descomposición de 40: $40 = 2^3 \cdot 5^1$.'
  - 'Paso 2: Descomposición de 60: $60 = 2^2 \cdot 3^1 \cdot 5^1$.'
  - 'Paso 3: Identificar bases primas comunes a ambos: el 2 y el 5 (el 3 no es común).'
  - 'Paso 4: Seleccionar el menor exponente para la base 2: $\min(3, 2) = 2 \implies
    2^2$.'
  - 'Paso 5: Seleccionar el menor exponente para la base 5: $\min(1, 1) = 1 \implies
    5^1$.'
  - 'Paso 6: Multiplicar las potencias seleccionadas: $2^2 \cdot 5^1 = 4 \cdot 5 =
    20$.'
  - 'Conclusión: $\operatorname{MCD}(40, 60) = 20$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué bases y exponentes se seleccionan para el M.C.D. a partir de las
    descomposiciones primas?
  choices:
  - text: Solo las bases primas COMUNES elevadas a su MENOR exponente
    is_correct: true
  - text: Todas las bases primas elevadas a su mayor exponente
    is_correct: false
  - text: Todas las bases comunes y no comunes al cuadrado
    is_correct: false
  - text: Solo la base prima más grande
    is_correct: false
  explanation: La alternativa correcta es 'Solo las bases primas COMUNES elevadas
    a su MENOR exponente'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 40 y 60, ¿por qué se descartó la base prima
    3?
  choices:
  - text: Porque el 3 no es una base prima común a ambos números
    is_correct: true
  - text: Porque 3 es un número impar
    is_correct: false
  - text: Because 3 es mayor que 2
    is_correct: false
  - text: Por error de cálculo
    is_correct: false
  explanation: La alternativa correcta es 'Porque el 3 no es una base prima común
    a ambos números'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la descomposición prima canónica de todos los números.'
- 'Paso 2: Seleccionar únicamente las bases primas que aparezcan en todas las descomposiciones.'
- 'Paso 3: Asignar a cada base prima común el menor exponente y multiplicar los resultados.'
errores_correccion: '- **Error 1: Incluir primos que no son comunes a todos los números.**
  **Cómo corregirlo:** Para el M.C.D. se descartan las bases que no estén compartidas
  por TODOS.


  - **Error 2: Tomar el mayor exponente en lugar del menor.** **Cómo corregirlo:**
  El M.C.D. utiliza el MENOR exponente ($\min(\alpha_i, \beta_i)$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $a = 2^3 \cdot 3^2$ y $b = 2^2 \cdot 3^4 \cdot 5$, halle $\operatorname{MCD}(a,
    b)$.
  alternativas:
  - 2^2 · 3^2 = 36
  - 2^3 · 3^4 · 5 = 3240
  - 2 · 3 = 6
  respuesta: 2^2 · 3^2 = 36
  solucion_pasos:
  - 'Bases comunes: 2 y 3. Menores exponentes: $2^2$ y $3^2$. MCD $= 4 \cdot 9 = 36$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el M.C.D. entre $2^5 \cdot 7$ y $3^2 \cdot 11$?
  alternativas:
  - 1 (no tienen bases primas comunes)
  - '0'
  - 2^5 · 3^2
  respuesta: 1 (no tienen bases primas comunes)
  solucion_pasos:
  - Al no compartir ninguna base prima, su M.C.D. es 1 (son coprimos).
- titulo: ¿Se descartan las bases primas no comunes en el cálculo del M.C.D.?
  respuesta: Sí
  solucion_pasos:
  - Sí, el M.C.D. exige trabajar únicamente con las bases primas comunes.
- titulo: ¿Es el M.C.D.(2^3, 2^5) igual a 2^3?
  respuesta: Sí
  solucion_pasos:
  - Sí, se elige el menor exponente $\min(3, 5) = 3$.
errores_frecuentes:
- Al calcular el M.C.D. por potencias se deben elegir los mayores exponentes de cada
  base prima.
- Las bases primas no comunes deben incluirse siempre en el cálculo del M.C.D.
- El M.C.D. de dos descomposiciones primas es la suma de todas las bases elevadas
  a 1.
- Si dos números no comparten bases primas comunes se concluye que su M.C.D. es cero.
- La regla de los menores exponentes se aplica únicamente a los números pares.
afirmaciones_verdaderas:
- El M.C.D. se obtiene multiplicando las bases primas comunes elevadas a su menor
  exponente.
- Si no existen bases primas comunes entre dos números, su M.C.D. es igual a 1.
al_terminar_debes_poder: Al terminar serás capaz de calcular el M.C.D. mediante las
  descomposiciones primas, seleccionando las bases primas comunes elevadas a su menor
  exponente.
