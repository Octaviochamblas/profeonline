semantic_id: MAT.NUM.MAXIMO_COMUN_DIVISOR.METODO_POTENCIAS_PRIMAS
resumen_inicial: "El MCD se calcula tomando solo los factores primos comunes de las descomposiciones, elevados a su menor exponente, y multiplicándolos."
explicacion_simple: |
  ¿Sabías que todos los números enteros mayores que 1 se pueden desarmar en piezas
  básicas llamadas números primos, como bloques de Lego? Si desarmamos dos números y
  miramos cuáles bloques tienen en común, podemos encontrar su MCD: comparamos los
  bloques compartidos y nos quedamos con la menor cantidad de cada uno.
explicacion_formal: |
  Para calcular el MCD por **potencias primas**: se descompone cada número en factores
  primos, se identifican las bases comunes a todas las descomposiciones, y para cada una
  se toma el **menor exponente**. Multiplicando esas potencias se obtiene el MCD. Para
  $72=2^3\cdot3^2$ y $120=2^3\cdot3^1\cdot5^1$: factores comunes $2$ y $3$ (el 5 no es
  común), $\text{MCD}(72,120)=2^3\cdot3^1=24$.
definiciones_clave: |
  **Factor primo común**: base que aparece en la descomposición de todos los números
  comparados; solo estos se incluyen en el cálculo del MCD.
propiedades_relaciones: |
  A diferencia del MCM (que usa todos los factores con el mayor exponente), el MCD solo
  usa los factores comunes con el menor exponente, descartando los no comunes.
ejemplo_guiado:
  enunciado: "Calcula el MCD de 48 y 60 por potencias primas."
  pasos:
    - "Descomposición: $48=2^4\\cdot3^1$, $60=2^2\\cdot3^1\\cdot5^1$."
    - "Factores comunes: $2$ y $3$. Menor exponente: $2^2$ y $3^1$."
    - "Conclusión: $\\text{MCD}(48,60)=2^2\\cdot3=12$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué exponente se elige para cada factor primo común al calcular el MCD por este método?"
    choices:
      - {text: "El menor exponente entre las descomposiciones", is_correct: true}
      - {text: "El mayor exponente entre las descomposiciones", is_correct: false}
      - {text: "La suma de los exponentes", is_correct: false}
      - {text: "Siempre el exponente 1", is_correct: false}
    explanation: "La correcta es El menor exponente entre las descomposiciones: eso asegura que el resultado divida exactamente a todos los números."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el MCD de 18 ($2\\cdot3^2$) y 24 ($2^3\\cdot3$)?"
    choices:
      - {text: "6", is_correct: true}
      - {text: "2", is_correct: false}
      - {text: "72", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 6: factor común 2 (menor exponente 1) y 3 (menor exponente 1), $2\\cdot3=6$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Realiza la descomposición factorial en números primos de cada uno de los números por separado.'
  - 'Paso 2: Escribe la descomposición de cada número expresada como producto de potencias de bases primas.'
  - 'Paso 3: Identifica los factores primos que sean comunes a todas las descomposiciones.'
  - 'Paso 4: Para cada factor primo común, elige la potencia que tenga el menor exponente.'
  - 'Paso 5: Multiplica los factores primos comunes con sus menores exponentes obtenidos en el Paso 4 para hallar el MCD.'
errores_correccion: |
  Un error frecuente es tomar los mayores exponentes en lugar de los menores (eso calcula
  el MCM, no el MCD). Otro error es incluir factores primos no comunes en el producto
  final.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Halla el MCD de $36$ y $90$ usando descomposiciones en factores primos.
    alternativas:
      - "18"
      - "6"
      - "180"
    respuesta: "18"
    solucion_pasos:
      - 'Paso a: Descomponemos $36$: $36 = 2^2 \cdot 3^2$.'
      - 'Paso b: Descomponemos $90$: $90 = 2^1 \cdot 3^2 \cdot 5^1$.'
      - 'Paso c: Los factores primos comunes son $2$ y $3$.'
      - 'Paso d: Tomamos los menores exponentes: para el $2$ es $1$ ($2^1$) y para el $3$ es $2$ ($3^2$).'
      - 'Paso e: Multiplicamos: $\text{MCD}(36, 90) = 2^1 \cdot 3^2 = 2 \cdot 9 = 18$.'
  - titulo: Ejemplo 2
    enunciado: Calcula el MCD de $40$ y $56$ mediante el método de potencias primas.
    alternativas:
      - "8"
      - "4"
      - "280"
    respuesta: "8"
    solucion_pasos:
      - 'Paso a: Descomponemos $40$: $40 = 2^3 \cdot 5^1$.'
      - 'Paso b: Descomponemos $56$: $56 = 2^3 \cdot 7^1$.'
      - 'Paso c: El único factor primo en común es el $2$.'
      - 'Paso d: El menor exponente para el factor $2$ es $3$, por lo que tomamos $2^3$.'
      - 'Paso e: Por lo tanto, el MCD es $2^3 = 8$.'
  - titulo: 'Si $A = 2^3 \cdot 3^2 \cdot 5^1$ y $B = 2^2 \cdot 3^4$, ¿es el $\text{MCD}(A, B) = 2^2 \cdot 3^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Los factores primos comunes a $A$ y $B$ son $2$ y $3$.'
      - 'El menor exponente de la base $2$ es $\min(3, 2) = 2$, es decir, $2^2$.'
      - 'El menor exponente de la base $3$ es $\min(2, 4) = 2$, es decir, $3^2$.'
      - 'Multiplicamos los factores comunes con su menor exponente: $2^2 \cdot 3^2$. La afirmación es correcta.'
  - titulo: '¿Debemos incluir el factor $5$ en el cálculo del MCD entre $2^2 \cdot 5$ y $2^3 \cdot 3$?'
    respuesta: 'No'
    solucion_pasos:
      - 'El factor primo $5$ solo aparece en la descomposición del primer número, mientras que el factor $3$ solo aparece en el segundo.'
      - 'El cálculo del MCD solo contempla los factores primos comunes (en este caso, solo el $2$).'
errores_frecuentes:
  - Tomar los mayores exponentes de los factores en lugar de los menores (esta acción calcula el MCM, no el MCD).
  - Incluir factores primos no comunes en el producto final (por ejemplo, agregar factores que solo están en un número).
  - Multiplicar las bases sin considerar sus exponentes correspondientes en la fórmula.
  - Realizar una descomposición incorrecta de los números originales en factores que no son primos (por ejemplo, descomponer $12 = 4 \cdot 3$ y usar el 4 como base prima).
  - Confundir la base con el exponente al momento de realizar la comparación de potencias menores.
afirmaciones_verdaderas:
  - "Para calcular el MCD por potencias primas, se toma cada factor común con su menor exponente."
  - "El MCD solo incluye los factores primos comunes, nunca los no comunes."
al_terminar_debes_poder: |
  Calcular el MCD de dos o más números mediante el método de factores primos con menor
  exponente.
fuente: Teoría de Números
estado: publicado
