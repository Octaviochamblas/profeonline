semantic_id: MAT.GEO.TRIANGULOS_METRICA.LADO_MAYOR_ANGULO_MAYOR
resumen_inicial: En todo triángulo euclidiano, al lado de mayor longitud se opone
  el ángulo interior de mayor medida, permitiendo deducir la ordenación de los ángulos
  a partir de las medidas de sus lados.
explicacion_simple: '![Mayor Lado a Mayor Ángulo](/static/img/nodos/correspondencia-entre-mayor-lado-y-mayor-angulo-opuesto-en-un-triangulo-intro.svg)


  Si sabes cuánto miden los tres lados de un triángulo pero no tienes un transportador
  para medir los ángulos, puedes saber cuál es el ángulo más grande con una regla
  sencilla: **el ángulo de mayor medida es siempre el que está justo al frente del
  lado más largo**.'
explicacion_formal: '### Teorema formal (Recíproco de Euclides I.18)

  En cualquier triángulo $\Delta ABC$, al lado de mayor longitud se opone estrictamente
  el ángulo interior de mayor medida:


  $$a > b \iff \alpha > \beta$$


  $$a > b > c \iff \alpha > \beta > \gamma$$


  ### Desglose simbólico y geométrico

  - $\max(a, b, c) = a \iff \max(\alpha, \beta, \gamma) = \alpha$.

  - Aplicación en triángulos rectángulos: Como la hipotenusa $c$ es el lado mayor
  ($c > a, c > b$), el ángulo opuesto $\gamma = 90^\circ$ es necesariamente el ángulo
  mayor del triángulo.


  ### Síntesis didáctica

  Permite localizar de forma inmediata el ángulo más amplio de cualquier figura triangular
  a partir de las longitudes de sus lados.'
definiciones_clave: '- **Teorema recíproco lado-ángulo**: Al mayor lado se opone el
  mayor ángulo interior.

  - **Vértice opuesto al lado**: El punto que no pertenece al segmento considerado.

  - **Criterio de ordenación angular**: Ordenar $a \ge b \ge c \implies \alpha \ge
  \beta \ge \gamma$. '
propiedades_relaciones: '- **Identificación del ángulo obtuso o recto**: En un triángulo
  rectángulo u obtusángulo, el ángulo de $90^\circ$ o $> 90^\circ$ se ubica forzosamente
  frente al lado más largo.

  - **Triángulo equilátero como caso de igualdad**: Si $a = b = c \implies \alpha
  = \beta = \gamma = 60^\circ$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Correspondencia Lado-Ángulo](/static/img/nodos/correspondencia-entre-mayor-lado-y-mayor-angulo-opuesto-en-un-triangulo-ejemplos.svg)


    En un triángulo $\triangle ABC$, los lados miden $\overline{AB} = 7\text{ cm}$,
    $\overline{BC} = 11\text{ cm}$ y $\overline{AC} = 9\text{ cm}$. Ordena los ángulos
    interiores del triángulo de menor a mayor.'
  pasos:
  - 'Paso 1: Identificar las medidas de los lados y ordenarlos de menor a mayor: $\overline{AB}
    (7\text{ cm}) < \overline{AC} (9\text{ cm}) < \overline{BC} (11\text{ cm})$.'
  - 'Paso 2: Localizar el ángulo opuesto a cada lado: frente a $\overline{AB}$ está
    el vértice $C$ ($\angle C$); frente a $\overline{AC}$ está el vértice $B$ ($\angle
    B$); frente a $\overline{BC}$ está el vértice $A$ ($\angle A$).'
  - 'Paso 3: Aplicar el teorema recíproco de correspondencia: como $\overline{AB}
    < \overline{AC} < \overline{BC}$, entonces $\angle C < \angle B < \angle A$.'
  - 'Paso 4: Concluir que el orden de menor a mayor de los ángulos es $\angle C <
    \angle B < \angle A$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si en un triángulo los lados miden a = 6 cm, b = 10 cm y c = 8 cm, ¿cuál
    es el ángulo interior de mayor medida?
  choices:
  - text: El ángulo alfa en el vértice B (opuesto al lado mayor b = 10 cm)
    is_correct: true
  - text: El ángulo opuesto al lado a = 6 cm
    is_correct: false
  - text: El ángulo opuesto al lado c = 8 cm
    is_correct: false
  - text: Los tres ángulos miden 60°
    is_correct: false
  explanation: Como b = 10 cm es el lado mayor, su ángulo opuesto es el ángulo alfa
    en el vértice B (opuesto al lado mayor b = 10 cm).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el triángulo KLM con KL = 12 cm, LM = 5 cm y KM = 13 cm, ¿cuál es el
    ángulo más pequeño?
  choices:
  - text: El ángulo en el vértice K (opuesto al lado menor LM = 5 cm)
    is_correct: true
  - text: El ángulo en el vértice L (opuesto a KM = 13 cm)
    is_correct: false
  - text: El ángulo en el vértice M (opuesto a KL = 12 cm)
    is_correct: false
  - text: No se puede saber sin un transportador
    is_correct: false
  explanation: Al lado menor LM = 5 cm se opone el ángulo en el vértice K (opuesto
    al lado menor LM = 5 cm).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las longitudes de los 3 lados del triángulo.'
- 'Paso 2: Ordenar los lados de mayor a menor (o de menor a mayor).'
- 'Paso 3: Hallar el vértice opuesto a cada lado.'
- 'Paso 4: Asignar el mismo orden a los ángulos interiores opuestos.'
errores_correccion: 'No elijas los ángulos que tocan el lado: el ángulo correspondiente
  es siempre el que está enfrente (opuesto).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si los lados de un triángulo son $4\text{ cm}, 7\text{ cm}$ y $9\text{
    cm}$, ¿cuál es el orden de los ángulos opuestos $\alpha, \beta, \gamma$?
  alternativas:
  - $\alpha < \beta < \gamma$
  - $\gamma < \beta < \alpha$
  - $\beta < \alpha < \gamma$
  respuesta: $\alpha < \beta < \gamma$
  solucion_pasos:
  - Como los lados están en orden $4 < 7 < 9$, los ángulos opuestos siguen estrictamente
    $\alpha < \beta < \gamma$.
- titulo: Ejemplo 2
  enunciado: En un triángulo escaleno de lados $8\text{ cm}, 14\text{ cm}$ y $10\text{
    cm}$, ¿frente a cuál lado se ubica el ángulo de mayor medida?
  alternativas:
  - Frente al lado de 14 cm
  - Frente al lado de 8 cm
  - Frente al lado de 10 cm
  respuesta: Frente al lado de 14 cm
  solucion_pasos:
  - El lado más largo es $14\text{ cm}$, por lo que el ángulo mayor está en el vértice
    opuesto a él.
- titulo: ¿Al lado más corto de un triángulo se le opone siempre el ángulo interior
    más pequeño?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema recíproco de correspondencia.
- titulo: ¿Un lado de 15 cm puede tener enfrente un ángulo menor que un lado de 8
    cm en el mismo triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, violaría la relación monótona lado-ángulo.
errores_frecuentes:
- Confundir el vértice opuesto con los vértices adyacentes del segmento.
- Pensar que se requiere trigonometría para determinar cuál ángulo es el mayor.
- Asumir que los ángulos crecen linealmente en proporción exacta a los lados ($a =
  2b \implies \alpha = 2\beta$ es falso).
- Olvidar verificar que los lados dados cumplan la desigualdad triangular.
- Confundir el lado mayor con la altura del triángulo.
afirmaciones_verdaderas:
- Al lado de mayor longitud en un triángulo siempre se le opone el ángulo interior
  de mayor medida.
- Conociendo las longitudes de los tres lados se puede determinar el orden exacto
  de los tres ángulos interiores.
al_terminar_debes_poder: '**QUÉ:** Determinar el orden de los ángulos interiores de
  un triángulo a partir de las medidas de sus lados.


  **CÓMO:** Aplicando el teorema recíproco al emparejar cada lado con su ángulo opuesto
  ($a > b \implies \alpha > \beta$).


  ![Resumen de Correspondencia Lado-Ángulo](/static/img/nodos/correspondencia-entre-mayor-lado-y-mayor-angulo-opuesto-en-un-triangulo-resumen.svg)'
