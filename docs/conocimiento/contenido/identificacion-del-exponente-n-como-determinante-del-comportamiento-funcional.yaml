semantic_id: MAT.ALG.FUNC_POTENCIA_BASE.EXPONENTE_N
resumen_inicial: 'La identificación del exponente $n$ como determinante del comportamiento funcional clasifica las funciones potencia según la combinación de signo y paridad de $n$: continuas en todo $\mathbb{R}$ con paso por el origen para $n > 0$, o discontinuas asintóticas en $x = 0$ para $n < 0$.'
explicacion_simple: '![La identificación del exponente $n$ como determinante del comportamiento funcional clasifica las funciones potencia según la combinación de signo y paridad de $n$: continuas en todo $\mathbb{R}$ con paso por el origen para $n > 0$, o discontinuas asintóticas en $x = 0$ para $n < 0$](/static/img/nodos/identificacion-del-exponente-n-como-determinante-del-comportamiento-funcional-intro.svg)



  El **exponente $n$** es el verdadero ADN de la función potencia: define la forma general de la curva en 4 grandes familias:


  1. **$n > 0$ Par ($x^2, x^4, x^6$):** Forma de copa **U** (parábola simétrica al eje $Y$).

  2. **$n > 0$ Impar ($x^1, x^3, x^5$):** Forma de silla **S** (curva que sube cruzando el origen $(0, 0)$).

  3. **$n < 0$ Par ($x^{-2} = 1/x^2$):** Forma de **volcán** (dos ramas que suben pegadas a la asíntota $x = 0$).

  4. **$n < 0$ Impar ($x^{-1} = 1/x$):** Forma de **hipérbola** (dos ramas opuestas en cuadrantes I y III).

  - **Regla rápida:** Si $n > 0$, pasa por $(0, 0)$ de forma continua; si $n < 0$, tiene asíntota vertical en $x = 0$ y horizontal en $y = 0$.'
explicacion_formal: 'Sea $f(x) = a \cdot x^n$ con $a \in \mathbb{R}^*$ y $n \in \mathbb{Z}^*$.


  **Taxonomía analítica según $(n, \operatorname{paridad})$**:

  $$\begin{array}{|c|c|c|c|c|} \hline \text{Tipo} & \text{Dominio} & \text{Recorrido } (a>0) & \text{Asíntotas} & \text{Simetría} \\ \hline n > 0 \text{ Par} & \mathbb{R} & [0, +\infty[ & \text{Ninguna} & \text{Eje } Y \\ \hline n > 0 \text{ Impar} & \mathbb{R} & \mathbb{R} & \text{Ninguna} & \text{Origen } (0, 0) \\ \hline n < 0 \text{ Par} & \mathbb{R} \setminus \{0\} & ]0, +\infty[ & x=0, \; y=0 & \text{Eje } Y \\ \hline n < 0 \text{ Impar} & \mathbb{R} \setminus \{0\} & \mathbb{R} \setminus \{0\} & x=0, \; y=0 & \text{Origen } (0, 0) \\ \hline \end{array}$$'
definiciones_clave: '- **Determinante morfológico ($n$)**: Exponente que fija la familia de curvas y su comportamiento en el infinito.

  - **Aplanamiento central**: Mayor curvatura plana en $]-1, 1[$ a medida que el grado par $n$ aumenta.'
propiedades_relaciones: '- **Punto común de intersección**: Para $a = 1$, todas las curvas con $n > 0$ pasan por $(0, 0)$ y $(1, 1)$.

  - **Comportamiento asintótico**: Para $n < 0$, $\lim_{x \to \pm\infty} x^n = 0$ produciendo la asíntota $\mathcal{A}_H: y = 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La identificación del exponente $n$ como determinante del comportamiento funcional clasifica las funciones potencia según la combinación de signo y paridad de $n$: continuas en todo $\mathbb{R}$ con paso por el origen para $n > 0$, o discontinuas asintóticas en $x = 0$ para $n < 0$](/static/img/nodos/identificacion-del-exponente-n-como-determinante-del-comportamiento-funcional-ejemplos.svg)



    Clasifica las siguientes funciones según su familia morfológica e indica si poseen asíntotas:

    1) $f(x) = 2x^4$

    2) $g(x) = -x^5$

    3) $h(x) = \frac{4}{x^2}$

    4) $p(x) = \frac{1}{x^3}$'
  pasos:
  - 'Paso 1: Para $f(x) = 2x^4$: $n = 4$ (positivo par) $\implies$ **Forma U (parábola generalizada), sin asíntotas**.'
  - 'Paso 2: Para $g(x) = -x^5$: $n = 5$ (positivo impar) $\implies$ **Forma S (cúbica generalizada decreciente), sin asíntotas**.'
  - 'Paso 3: Para $h(x) = 4x^{-2}$: $n = -2$ (negativo par) $\implies$ **Forma de volcán, con asíntotas $x = 0, y = 0$**.'
  - 'Paso 4: Para $p(x) = x^{-3}$: $n = -3$ (negativo impar) $\implies$ **Hipérbola generalizada, con asíntotas $x = 0, y = 0$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué tipo de gráfica tiene la función $f(x) = \frac{3}{x^4}$?
  choices:
  - text: Forma tipo volcán simétrica al eje Y con asíntotas en x = 0 e y = 0
    is_correct: true
  - text: Parábola continua que pasa por (0, 0)
    is_correct: false
  - text: Hipérbola en cuadrantes I y III
    is_correct: false
  - text: Línea recta
    is_correct: false
  explanation: La alternativa correcta es 'Forma tipo volcán simétrica al eje Y con asíntotas en x = 0 e y = 0'. Como $n = -4$ es par negativo, las dos ramas suben simétricamente hacia $+\infty$ pegadas a $x = 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: A medida que el exponente par $n$ crece ($x^2, x^4, x^6$), ¿qué le ocurre a la gráfica cerca de x = 0?
  choices:
  - text: Se aplana más en la base formando una copa con fondo plano
    is_correct: true
  - text: Se vuelve más puntiaguda hacia arriba
    is_correct: false
  - text: Se traslada a la derecha
    is_correct: false
  - text: Se convierte en una recta vertical
    is_correct: false
  explanation: La alternativa correcta es 'Se aplana más en la base formando una copa con fondo plano'. Para $|x| < 1$, potencias mayores producen números más cercanos a cero ($0{,}5^6 = 0{,}0156$ vs $0{,}5^2 = 0{,}25$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Determinar el signo del exponente $n$ ($n > 0$ o $n < 0$).'
- 'Paso 2: Determinar la paridad de $n$ (par o impar).'
- 'Paso 3: Clasificar en una de las 4 familias fundamentales (U, S, Volcán, Hipérbola).'
- 'Paso 4: Declarar la existencia de asíntotas ($x = 0, y = 0$ si $n < 0$) y la continuidad.'
errores_correccion: '- **Error común:** Asumir que todas las potencias negativas tienen la misma gráfica que $1/x$.

  - **Cómo corregirlo:** Si el exponente negativo es **PAR ($1/x^2$)**, ambas ramas son **POSITIVAS (tipo volcán)**; si es **IMPAR ($1/x$)**, están en **cuadrantes opuestos (hipérbola)**.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de familia impar positiva'
  enunciado: ¿Qué forma tiene $f(x) = x^7$?
  alternativas:
  - Forma de silla S continua que pasa por (0, 0)
  - Forma de copa U
  - Hipérbola asintótica
  - Volcán
  respuesta: Forma de silla S continua que pasa por (0, 0)
  solucion_pasos:
  - 'Paso 1: $n = 7 > 0$ impar $\implies$ forma S.'
- titulo: 'Ejemplo 2: Presencia de asíntotas'
  enunciado: ¿Tiene asíntotas la función $g(x) = 5x^{-3}$?
  alternativas:
  - Sí, asíntota vertical x = 0 y horizontal y = 0
  - No, es continua en todo R
  - Solo asíntota vertical x = 5
  - Solo asíntota horizontal y = 5
  respuesta: Sí, asíntota vertical x = 0 y horizontal y = 0
  solucion_pasos:
  - 'Paso 1: Como $n = -3 < 0$, posee asíntotas $\mathcal{A}_V: x = 0$ y $\mathcal{A}_H: y = 0$.'
- titulo: 'Ejemplo 3: Comparación de curvatura par'
  enunciado: 'En el intervalo $]-1, 1[$, ¿cuál curva está más cerca del eje X: $y = x^2$ o $y = x^4$?'
  alternativas:
  - y = x⁴
  - y = x²
  - Están a la misma distancia
  - Depende del signo de x
  respuesta: y = x⁴
  solucion_pasos:
  - 'Paso 1: Para $|x| < 1$, $x^4 < x^2 \implies x^4$ está más aplanada y cercana al eje X.'
- titulo: 'Ejemplo 4: Familia par negativa'
  enunciado: 'La función $h(x) = \frac{2}{x^2}$ pertenece a la familia de:'
  alternativas:
  - Exponente negativo par (tipo volcán)
  - Exponente negativo impar (hipérbola)
  - Exponente positivo par
  - Exponente fraccionario
  respuesta: Exponente negativo par (tipo volcán)
  solucion_pasos:
  - 'Paso 1: $h(x) = 2x^{-2} \implies n = -2$ par negativo.'
errores_frecuentes:
- Confundir la forma de potencias pares e impares negativas.
- Olvidar que las potencias positivas no tienen asíntotas.
- Creer que x⁴ crece más lento que x² para números mayores que 1.
afirmaciones_verdaderas:
- El exponente n clasifica las funciones potencia en 4 familias morfológicas bien definidas.
- Las potencias con exponente negativo n < 0 poseen asíntotas canónicas en x = 0 e y = 0.
al_terminar_debes_poder: '**QUÉ:** Identificar y clasificar el comportamiento funcional según el exponente n.


  **CÓMO:** Categorizando por signo y paridad de n para determinar simetría, continuidad y existencia de asíntotas.


