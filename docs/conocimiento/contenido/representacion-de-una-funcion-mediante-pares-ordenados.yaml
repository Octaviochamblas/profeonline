semantic_id: MAT.ALG.FUNCION_REPRESENTACION.PARES_ORDENADOS
resumen_inicial: Una función puede expresarse como un conjunto de pares ordenados
  de la forma $(x, f(x))$ donde no se repiten primeras componentes.
explicacion_simple: 'Un **par ordenado** se escribe $(x, y)$, donde la primera componente
  $x$ es la entrada y la segunda componente $y$ es la salida.

  Podemos presentar toda la función como un conjunto de pares encerrado entre llaves:
  $f = \{(1, 4), (2, 7), (3, 10)\}$.

  Para ser función, ningún valor $x$ del lado izquierdo puede aparecer repetido con
  un valor $y$ distinto.'
explicacion_formal: 'Una **representación por extensión** de una función $f$ es el
  subconjunto del producto cartesiano $A \times B$:


  $$f = \{(x, y) \in A \times B \mid y = f(x)\}$$


  **Desglose de la fórmula:**

  - Estructura de pares ordenados donde $x \in \operatorname{Dom}(f)$ e $y \in \operatorname{Rec}(f)$.'
definiciones_clave: '- **Par ordenado $(x, y)$**: Tupla de dos elementos ordenados
  donde $x$ es la preimagen e $y$ es la imagen.'
propiedades_relaciones: '- **Unicidad en pares**: Si $(x, y_1) \in f$ y $(x, y_2)
  \in f \implies y_1 = y_2$.'
ejemplo_guiado:
  enunciado: Expresa la función $f(x) = x^2$ para el dominio $A = \{-2, -1, 0, 3\}$
    en notación de conjunto de pares ordenados.
  pasos:
  - 'Paso 1: Evaluar $x = -2$: $f(-2) = (-2)^2 = 4 \implies (-2, 4)$.Paso 2: Evaluar
    $x = -1$: $f(-1) = (-1)^2 = 1 \implies (-1, 1)$.Paso 3: Evaluar $x = 0$: $f(0)
    = 0^2 = 0 \implies (0, 0)$.Paso 4: Evaluar $x = 3$: $f(3) = 3^2 = 9 \implies (3,
    9)$.Paso 5: Escribir el conjunto final de pares: $f = \{(-2, 4), (-1, 1), (0,
    0), (3, 9)\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al expresar $f(x) = x^2$ para el dominio $\{-2, -1, 0, 3\}$, ¿cuál es
    el conjunto de pares ordenados obtenido?
  choices:
  - text: $f = \{(-2, 4), (-1, 1), (0, 0), (3, 9)\}$
    is_correct: true
  - text: $f = \{(4, -2), (1, -1), (0, 0), (9, 3)\}$
    is_correct: false
  - text: $f = \{(-2, -4), (-1, -2), (0, 0), (3, 6)\}$
    is_correct: false
  - text: $f = \{(-2, 2), (-1, 1), (0, 0), (3, 3)\}$
    is_correct: false
  explanation: La alternativa correcta es '$f = \{(-2, 4), (-1, 1), (0, 0), (3, 9)\}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un par ordenado $(x, y)$, ¿qué representa la primera posición $x$?
  choices:
  - text: La preimagen o elemento del dominio.
    is_correct: true
  - text: La imagen o elemento del recorrido.
    is_correct: false
  - text: El codominio completo.
    is_correct: false
  - text: La pendiente de la curva.
    is_correct: false
  explanation: La alternativa correcta es 'La preimagen o elemento del dominio.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular la imagen $y$ para cada elemento $x$ del dominio.'
- 'Paso 2: Escribir cada pareja entre paréntesis $(x, y)$.'
- 'Paso 3: Reunir todos los pares entre llaves $\{ \dots \}$ separándolos por comas.'
errores_correccion: '- **Error común:** Invertir el orden de las componentes y escribir
  $(y, x)$ en lugar de $(x, y)$.

  - **Cómo corregirlo:** Por convención universal, la primera componente es SIEMPRE
  la preimagen $x$ y la segunda es la imagen $y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de representación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de representación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El criterio de la línea vertical sirve para identificar si un gráfico representa
    a una función?
  respuesta: Sí
  solucion_pasos:
  - Sí, si ninguna recta vertical corta al gráfico en más de un punto, es función.
- titulo: ¿El dominio de una función se lee sobre el eje horizontal X en su gráfica?
  respuesta: Sí
  solucion_pasos:
  - Sí, el dominio es el ancho continuo proyectado en el eje X.
errores_frecuentes:
- Invertir el orden de las componentes en los pares ordenados escribiendo $(y, x)$
  en vez de $(x, y)$.
- Trazar las flechas en un diagrama sagital en sentido contrario, del codominio al
  dominio.
- Confundir el criterio de la línea vertical (usado para probar funciones) con el
  de la línea horizontal (usado para inyectividad).
- Leer los valores del eje vertical $Y$ para determinar el dominio o los del eje $X$
  para hallar el recorrido.
- Usar la coordenada $x$ de un vértice en lugar de la coordenada $y$ para determinar
  el mínimo del recorrido en una gráfica.
afirmaciones_verdaderas:
- Una relación representada gráficamente es una función si y solo si cualquier línea
  vertical corta a su gráfico a lo sumo en un punto.
- El dominio se determina en el gráfico proyectando el trazo sobre el eje horizontal
  $X$, mientras que el recorrido se obtiene proyectándolo sobre el eje vertical $Y$.
al_terminar_debes_poder: Al finalizar este recurso podrás representar funciones mediante
  tablas, pares ordenados, diagramas sagitales y gráficos en el plano cartesiano,
  identificando dominio y recorrido.
fuente: Texto escolar MINEDUC — Álgebra / Representación de Funciones
estado: publicado
