semantic_id: MAT.ALG.FUNCION_REPRESENTACION.PARES_ORDENADOS
resumen_inicial: 'Representación de una función mediante pares ordenados: conceptos,
  representación y propiedades en Representación de funciones.'
explicacion_simple: 'Un conjunto de pares ordenados es la forma más directa de mostrar
  una función: cada par $(x,y)$ dice exactamente qué entrada produce qué salida.'
explicacion_formal: '### Definición formal


  Formalmente, una función $f: A \to B$ puede identificarse con el conjunto de pares
  ordenados $\{(x, f(x)) : x \in A\} \subseteq A \times B$. Esta representación es
  válida como función si y solo si ningún valor de $x$ se repite asociado a distintos
  valores de $y$.


  ### Desarrollo didáctico


  Cuando el dominio es finito, listar todos los pares ordenados es una representación
  completa y exacta de la función, sin necesidad de fórmula ni gráfico.


  El conjunto $\{(1,3), (2,5), (3,7)\}$ representa una función: cada primer componente
  aparece una sola vez, con una única imagen asociada.'
definiciones_clave: '- **Representación de una función mediante pares ordenados**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a representación de una función mediante
  pares ordenados.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a representación de
    una función mediante pares ordenados.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a representación de una función
    mediante pares ordenados.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    representación de una función mediante pares ordenados?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en representación de funciones
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en representación de funciones. Es la condición
    de existencia y unicidad en representación de una función mediante pares ordenados.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en representación de una
    función mediante pares ordenados, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Lista todos los pares ordenados que definen la correspondencia.'
- 'Paso 2: Verifica que cada valor de $x$ aparezca a lo más una vez con cada imagen.'
- 'Paso 3: Si se cumple, el conjunto de pares representa una función válida.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar representación de una función mediante pares ordenados.
ejemplos:
- titulo: Verificación de pares ordenados válidos
  enunciado: Determina si $\{(1,4), (2,4), (3,6)\}$ representa una función.
  solucion_pasos:
  - Cada valor de x (1, 2, 3) aparece una sola vez.
  - No importa que dos imágenes coincidan (4 se repite), eso no afecta la definición.
  - Es una función.
- titulo: Conjunto que no representa función
  enunciado: Determina si $\{(2,5), (2,9), (3,1)\}$ representa una función.
  solucion_pasos:
  - El valor x=2 aparece dos veces con imágenes distintas (5 y 9).
  - No es una función.
- titulo: ¿El orden en que se listan los pares ordenados afecta si representan una
    función?
  enunciado: ¿El orden en que se listan los pares ordenados afecta si representan
    una función?
  respuesta: 'No'
  solucion_pasos:
  - Lo que importa es la unicidad de imagen para cada x, no el orden de la lista.
- titulo: ¿Dos pares ordenados con la misma segunda componente pueden coexistir en
    una función?
  enunciado: ¿Dos pares ordenados con la misma segunda componente pueden coexistir
    en una función?
  respuesta: Sí
  solucion_pasos:
  - La unicidad exige una sola imagen por cada x, pero no prohíbe compartir imágenes
    entre distintos x.
errores_frecuentes:
- Confundir la repetición de una imagen (permitida) con la repetición de un valor
  de $x$ (prohibida).
- No verificar cuidadosamente todos los pares al buscar valores de $x$ repetidos en
  listas extensas.
- Asumir que el conjunto debe estar ordenado numéricamente para ser función.
- Ignorar pares con componentes iguales, como $(3,3)$, pensando que no son válidos.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando representación
  de una función mediante pares ordenados.
