semantic_id: MAT.ALG.FUNCION_REPRESENTACION.PARES_ORDENADOS
resumen_inicial: La representación por pares ordenados expresa una función como un conjunto de parejas $(x, y)$ donde cada entrada $x$ posee una única salida $y$.
explicacion_simple: |
  Un **par ordenado** se escribe como $(x, y)$:
  - El primer número $x$ es la entrada (preimagen).
  - El segundo número $y$ es la salida (imagen).

  Para que un conjunto de pares sea una función:
  - **No puede repetirse el primer número con una salida distinta**. Por ejemplo, el conjunto $\{(1, 2), (1, 5)\}$ **NO es una función** porque el 1 se ramifica en dos respuestas.
explicacion_formal: |
  Sea $f \subseteq A \times B$ una relación entre los conjuntos $A$ y $B$. $f$ es una función expresada por pares ordenados si y solo si:

  $$f = \{(x, y) \in A \times B \mid y = f(x)\}$$

  satisface la propiedad de unicidad:

  $$(x, y_1) \in f \ \land \ (x, y_2) \in f \implies y_1 = y_2$$

  **Desglose de la notación:**
  - $\text{Dom}(f) = \{x \in A \mid \exists y \in B, (x, y) \in f\}$
  - $\text{Rec}(f) = \{y \in B \mid \exists x \in A, (x, y) \in f\}$
definiciones_clave: |
  - **Par ordenado $(x, y)$**: Estructura de dos elementos donde el orden importa ($x$ es entrada e $y$ es salida).
propiedades_relaciones: |
  - **Unicidad de la primera componente**: Un conjunto de pares ordenados es función si todas las primeras componentes son distintas entre sí o se asocian al mismo valor idéntico.
ejemplo_guiado:
  enunciado: "Analiza los siguientes conjuntos de pares ordenados y determina cuál es una función: $F = \\{(1, 3), (2, 4), (3, 4)\\}$ y $G = \\{(1, 3), (2, 4), (1, 5)\\}$."
  pasos:
    - 'Paso 1: Examinar $F$: las primeras componentes son $1, 2, 3$ (todas distintas). Que $(2,4)$ y $(3,4)$ compartan la salida $4$ es totalmente válido.'
    - 'Paso 2: Concluir que $F$ SÍ es una función.'
    - 'Paso 3: Examinar $G$: la primera componente $1$ aparece en $(1, 3)$ y en $(1, 5)$ con salidas distintas ($3$ y $5$).'
    - 'Paso 4: Concluir que $G$ NO es una función.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Por qué el conjunto de pares $G = \\{(1, 3), (2, 4), (1, 5)\\}$ no es una función?"
    choices:
      - {text: "Porque la primera componente 1 tiene dos imágenes distintas (3 y 5)", is_correct: true}
      - {text: "Porque el número 4 es par", is_correct: false}
      - {text: "Porque no incluye al cero", is_correct: false}
      - {text: "Porque tiene tres pares ordenados", is_correct: false}
    explanation: "La alternativa correcta es 'Porque la primera componente 1 tiene dos imágenes distintas (3 y 5)'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "En el conjunto de pares ordenados de una función $F$, ¿cómo se obtiene el conjunto recorrido?"
    choices:
      - {text: "Reuniendo todas las segundas componentes de los pares sin repetir", is_correct: true}
      - {text: "Reuniendo todas las primeras componentes de los pares", is_correct: false}
      - {text: "Sumando las dos componentes de cada par", is_correct: false}
      - {text: "Multiplicando las componentes entre sí", is_correct: false}
    explanation: "La alternativa correcta es 'Reuniendo todas las segundas componentes de los pares sin repetir'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer la lista de todas las primeras componentes de los pares ordenados.'
  - 'Paso 2: Verificar si alguna primera componente se repite asociada a diferentes segundas componentes.'
  - 'Paso 3: Si no hay repeticiones ambiguas, declarar que el conjunto representa una función.'
  - 'Paso 4: Determinar el dominio (primeras componentes) y el recorrido (segundas componentes).'
errores_correccion: |
  - **Error común:** Pensar que si dos pares tienen la misma segunda componente (como $(2, 4)$ y $(3, 4)$), no es función.
  - **Cómo corregirlo:** La repetición de la SEGUNDA componente SÍ está permitida; lo que invalida la función es que se repita la PRIMERA componente con distinta salida.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de representación de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de representación de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El conjunto de pares ordenados $\{(1, 2), (1, 3), (2, 4)\}$ representa una función real válida.'
  - 'En el par ordenado $(a, b)$, el primer componente $a$ representa la imagen $f(b)$ calculada.'
  - 'Un conjunto de pares ordenados puede ser función aunque existan elementos del dominio sin par asignado.'
  - 'El orden de las componentes en el par ordenado $(x, y)$ se puede invertir libremente como $(y, x)$ sin alterar la función.'
  - 'Dos pares ordenados con igual primera componente y distinta segunda componente garantizan la existencia de una función inyectiva.'
afirmaciones_verdaderas:
  - 'Una función representada por pares ordenados $f = \{(x_1, y_1), (x_2, y_2), \dots\}$ exige que no existan dos pares con la misma primera componente y distinta segunda componente.'
  - 'En cada par ordenado $(x, y)$, el elemento $x$ pertenece al dominio y el elemento $y = f(x)$ pertenece al recorrido.'
al_terminar_debes_poder: |
  QUÉ: Representar y analizar funciones mediante conjuntos de pares ordenados.
  CÓMO: Formar las parejas $(x, f(x))$ a partir del dominio y verificar que ninguna primera componente aparezca repetida con diferente segunda componente.
fuente: 'Texto escolar MINEDUC — Álgebra / Representación de Funciones'
estado: publicado
