semantic_id: MAT.GEO.PARALELOGRAMOS.ROMBOIDE_LADOS_OPUESTOS_PARALELOS
resumen_inicial: El romboide es el paralelogramo oblicuo cuyos lados contiguos son desiguales y sus ángulos interiores no son rectos.
explicacion_simple: 'Cuando la gente dice la palabra ''paralelogramo'', casi siempre se está imaginando un **romboide**. Es un paralelogramo clásico e inclinado: parece un rectángulo que fue empujado hacia un lado.


  Tiene dos pares de lados paralelos, pero cumple que: 1) Los lados contiguos son desiguales ($a \neq b$), y 2) Sus ángulos no son rectos ($\alpha \neq 90^\circ$). Por ende, sus diagonales tienen distinta longitud y no se cortan en ángulo recto, pero sí conservan la regla de oro: se cortan en su punto medio.


  ![Propiedad de lados opuestos en el romboide](/static/img/nodos/propiedad-de-lados-opuestos-paralelos-en-el-romboide-intro.svg)

  '
explicacion_formal: "### Definición formal del romboide\nEn la nomenclatura geométrica escolar chilena y estándar PAES, un **romboide** es un paralelogramo que no es cuadrado, ni rectángulo, ni rombo. Satisface formalmente:\n$$\\mathcal{ABCD} \\text{ es romboide} \\iff \\overline{AB} \\parallel \\overline{CD} \\ \\wedge \\ \\overline{BC} \\parallel \\overline{DA} \\ \\wedge \\ a \\neq b \\ \\wedge \\ \\alpha \\neq 90^\\circ$$\n\n### Propiedades métricas y estructurales\n- **Lados:** Los lados opuestos son paralelos y congruentes ($AB = CD = a$, $BC = DA = b$), pero $a \\neq b$.\n- **Ángulos:** Los ángulos opuestos son congruentes (dos agudos $\\alpha < 90^\\circ$ y dos obtusos $\\beta > 90^\\circ$), cumpliendo $\\alpha + \\beta = 180^\\circ$.\n- **Diagonales:**\n  1. Tienen distinta longitud: $d_1 \\neq d_2$.\n  2. No son perpendiculares: $d_1 \\not\\perp d_2$.\n  3. No son bisectrices de los ángulos interiores.\n  4. Se dimidian mutuamente en el punto medio $M$.\n\n> **Complemento didáctico:**\
  \ El romboide es el paralelogramo 'sin coronas ni privilegios especiales': no tiene los 4 lados iguales (como el rombo o cuadrado) ni tiene ángulos de 90° (como el rectángulo o cuadrado). Solo cumple las propiedades generales de la familia de paralelogramos.\n"
definiciones_clave: '- **Romboide**: Paralelogramo común oblicuo no equilátero y no equiángulo.

  - **Lados contiguos**: Lados que comparten un vértice en común y tienen longitudes distintas en el romboide.

  - **Ángulos oblicuos**: Ángulos que difieren de $90^\circ$ y $180^\circ$ (agudos u obtusos).

  '
propiedades_relaciones: '- **Perímetro:** $P = 2(a + b)$.

  - **Área:** $A = b \cdot h = a \cdot b \cdot \sin(\alpha)$.

  - **Invarianza de bisección:** El corte de sus diagonales sigue siendo su centro de simetría.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de romboide](/static/img/nodos/propiedad-de-lados-opuestos-paralelos-en-el-romboide-ejemplos.svg)


    En un romboide $ABCD$, sus lados contiguos miden $a = 10$ cm y $b = 6$ cm, y uno de sus ángulos agudos mide $40^\circ$. Determina el perímetro de la figura y la medida de todos sus ángulos interiores.'
  pasos:
  - 'Paso 1: Calcular el perímetro: $P = 2(a + b) = 2(10 + 6) = 2(16) = 32$ cm.'
  - 'Paso 2: Determinar el ángulo opuesto: Como el ángulo dado mide $40^\circ$, su ángulo opuesto mide también $40^\circ$.'
  - 'Paso 3: Calcular los ángulos consecutivos suplementarios: $\beta = 180^\circ - 40^\circ = 140^\circ$.'
  - 'Paso 4: Concluir las medidas angulares: Los cuatro ángulos interiores son $40^\circ$, $140^\circ$, $40^\circ$ y $140^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes afirmaciones describe exactamente a un romboide?
  choices:
  - text: Es un paralelogramo con lados contiguos desiguales y ángulos interiores no rectos.
    is_correct: true
  - text: Es un cuadrilátero con cuatro lados de la misma medida y diagonales perpendiculares.
    is_correct: false
  - text: Es una figura de cuatro lados con un solo par de lados paralelos.
    is_correct: false
  - text: Es un paralelogramo que tiene sus cuatro ángulos de 90°.
    is_correct: false
  explanation: La alternativa correcta es 'Es un paralelogramo con lados contiguos desiguales y ángulos interiores no rectos.' Esta es la definición formal de romboide en el currículo chileno.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un romboide, ¿son sus diagonales perpendiculares o de igual longitud?
  choices:
  - text: No, las diagonales son de distinta longitud y no son perpendiculares.
    is_correct: true
  - text: Sí, son obligatoriamente perpendiculares y congruentes.
    is_correct: false
  - text: Son de igual longitud pero no perpendiculares.
    is_correct: false
  - text: Son perpendiculares pero de distinta longitud.
    is_correct: false
  explanation: La alternativa correcta es 'No, las diagonales son de distinta longitud y no son perpendiculares.' En el romboide general $d_1 \neq d_2$ y $d_1 \not\perp d_2$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar si el paralelogramo es un romboide comprobando que $a \neq b$ y $\alpha \neq 90^\circ$.

  2. Aplicar $P = 2(a + b)$ para el perímetro.

  3. Aplicar $\alpha + \beta = 180^\circ$ para los ángulos adyacentes.

  4. Utilizar que las diagonales se dimidian en su punto medio $M$.

  '
errores_correccion: '- **Error común 1:** Confundir romboide con rombo. **Corrección:** El rombo tiene 4 lados iguales; el romboide tiene lados contiguos desiguales ($a \neq b$).

  - **Error común 2:** Intentar usar $A = a \cdot b$ directamente para el área. **Corrección:** El área es base por altura ($b \cdot h$), no base por lado inclinado.

  '
ejemplos:
- tipo: A
  titulo: Ángulo obtuso en romboide
  enunciado: Si un romboide tiene un ángulo de $62^\circ$, ¿cuánto mide su ángulo obtuso?
  alternativas:
  - text: $118^\circ$.
    is_correct: true
  - text: $62^\circ$.
    is_correct: false
  - text: $128^\circ$.
    is_correct: false
  - text: $28^\circ$.
    is_correct: false
  explicacion: 'Por suplementariedad: $180^\circ - 62^\circ = 118^\circ$.'
- tipo: B
  titulo: Lados del romboide
  enunciado: ¿Tiene el romboide sus cuatro lados de igual medida?
  respuesta: 'No'
  explicacion: No. En el romboide los lados contiguos son desiguales ($a \neq b$); si fueran iguales sería un rombo.
errores_frecuentes:
- '''Confundir los términos rombo y romboide en enunciados de preguntas.'''
- '''Asumir que las diagonales del romboide son perpendiculares.'''
- '''Creer que las diagonales del romboide bisecan a los ángulos interiores.'''
afirmaciones_verdaderas:
- '''El romboide tiene dos pares de lados opuestos paralelos y congruentes.'''
- '''En un romboide, los lados contiguos tienen longitudes diferentes.'''
- '''Las diagonales de un romboide se dimidian pero no son congruentes ni perpendiculares.'''
al_terminar_debes_poder: '**QUÉ:** Identificar al romboide y aplicar sus propiedades geométricas para calcular ángulos, lados y perímetros.


  **CÓMO:** Distinguiéndolo del rombo y del rectángulo mediante las condiciones $a \neq b$ y $\alpha \neq 90^\circ$.


