semantic_id: MAT.ALG.DESIG_PROPIEDADES.DIVISION_POSITIVA
resumen_inicial: Dividir ambos miembros de una desigualdad por un número estrictamente positivo mantiene el sentido de la desigualdad.
explicacion_simple: '![División de una desigualdad por una cantidad positiva](/static/img/nodos/division-de-una-desigualdad-por-una-cantidad-positiva-intro.svg)


  Dividir una desigualdad entre un número positivo (como dividir entre $+2$ o $+4$) reduce proporcionalmente ambas cantidades sin alterar su relación de orden.

  La cantidad que era mayor sigue siendo mayor al dividirla entre el mismo número positivo.'
explicacion_formal: 'Para todas las constantes $a, b, c \in \mathbb{R}$ con $c > 0$:


  $$a < b \iff \frac{a}{c} < \frac{b}{c} \quad (c > 0)$$

  $$a \ge b \iff \frac{a}{c} \ge \frac{b}{c} \quad (c > 0)$$


  **Desglose de la fórmula:**

  - Dividir por $c > 0$ equivale a multiplicar por el recíproco positivo $\frac{1}{c} > 0$, preservando el sentido.'
definiciones_clave: '- **Divisor positivo ($c > 0$)**: Escalar divisor mayor que cero que mantiene el sentido del orden.'
propiedades_relaciones: '- **Equivalencia con recíprocos**: Dividir entre $c$ es equivalente a multiplicar por $\frac{1}{c}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo División de una desigualdad por una cantidad positiva](/static/img/nodos/division-de-una-desigualdad-por-una-cantidad-positiva-ejemplos.svg)


    Dada la desigualdad $12 > -8$, divide ambos miembros entre el escalar positivo $c = 4$ y comprueba el resultado.'
  pasos:
  - 'Paso 1: Escribir la desigualdad inicial: $12 > -8$.Paso 2: Dividir el primer miembro entre $4$: $\frac{12}{4} = 3$.Paso 3: Dividir el segundo miembro entre $4$: $\frac{-8}{4} = -2$.Paso 4: Comparar los resultados: $3 > -2$.Paso 5: Concluir que la relación $>$ permanece inalterada.'
checkpoints:
- placement: after_explicacion_formal
  question: Al dividir la desigualdad $12 > -8$ entre $4$, ¿cuál es el resultado obtenido?
  choices:
  - text: $3 > -2$
    is_correct: true
  - text: $3 < -2$
    is_correct: false
  - text: $-3 > 2$
    is_correct: false
  - text: $3 = -2$
    is_correct: false
  explanation: La alternativa correcta es '$3 > -2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué le sucede al sentido del operador de orden cuando se divide por una constante positiva $c > 0$?
  choices:
  - text: Conserva su orientación original.
    is_correct: true
  - text: Se invierte obligatoriamente al sentido contrario.
    is_correct: false
  - text: Se vuelve una igualdad.
    is_correct: false
  - text: Se invalida la desigualdad.
    is_correct: false
  explanation: La alternativa correcta es 'Conserva su orientación original.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que el divisor $c$ sea estrictamente positivo ($c > 0$).'
- 'Paso 2: Dividir el primer miembro entre $c$.'
- 'Paso 3: Dividir el segundo miembro entre $c$.'
- 'Paso 4: Mantener el símbolo de la desigualdad exactamente en la misma dirección.'
errores_correccion: '- **Error común:** Cambiar el sentido de la desigualdad al dividir un número negativo que está en el numerador.

  - **Cómo corregirlo:** El signo del divisor determina si cambia el sentido. Si el DIVISOR es positivo, el sentido NO cambia.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
- Al dividir la desigualdad $12 > -8$ por la constante positiva $c = 4$, el símbolo se invierte resultando en $3 < -2$.
- La división de una desigualdad por un escalar positivo $c > 0$ altera la orientación del operador de orden.
- Si el dividendo en una inecuación es negativo como $-8$, la división por un escalar positivo $4$ obliga a invertir la desigualdad.
- La propiedad de división por una cantidad positiva $c > 0$ genera un cambio de signo en la variable de la inecuación.
- Dividir ambos miembros de $4x \le 20$ por $4$ da como resultado la inecuación invertida $x \ge 5$.
afirmaciones_verdaderas:
- Dividir ambos miembros de una desigualdad por un número estrictamente positivo $c > 0$ conserva la dirección original del símbolo.
- Si $a < b$ y $c > 0$, entonces se cumple rigurosamente la desigualdad $\frac{a}{c} < \frac{b}{c}$.
al_terminar_debes_poder: '**QUÉ:** Dividir una desigualdad entre un divisor positivo $c > 0$.


  **CÓMO:** Dividiendo ambos miembros entre $c > 0$ y conservando la orientación del signo de comparación ($\frac{a}{c} < \frac{b}{c}$).


  ![Resumen División de una desigualdad por una cantidad positiva](/static/img/nodos/division-de-una-desigualdad-por-una-cantidad-positiva-resumen.svg)'
