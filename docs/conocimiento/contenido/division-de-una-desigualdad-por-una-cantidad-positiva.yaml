semantic_id: MAT.ALG.DESIG_PROPIEDADES.DIVISION_POSITIVA
resumen_inicial: 'División de una desigualdad por una cantidad positiva: relaciones
  de orden, intervalos y resolución en Propiedades de las desigualdades.'
explicacion_simple: Para despejar coeficientes que multiplican a una incógnita, es
  necesario dividir. Cuando el divisor es positivo, el proceso mantiene el orden de
  la desigualdad de forma natural.
explicacion_formal: '### Definición formal

  Sean $a, b, c \in \mathbb{R}$, con $c > 0$. Si $a > b$, entonces $\frac{a}{c} >
  \frac{b}{c}$. Análogo para $<, \leq$ y $\geq$.


  ### Desarrollo didáctico

  La división por un número positivo es equivalente a multiplicar por su inverso multiplicativo
  (que también es positivo), por lo que se comporta igual que la multiplicación positiva.'
definiciones_clave: '- **División de una desigualdad por una cantidad positiva**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a división de una desigualdad por una cantidad
  positiva.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de división de una
    desigualdad por una cantidad positiva.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de división de una desigualdad por una cantidad
    positiva, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla de oro al multiplicar o dividir una desigualdad por
    un número negativo en división de una desigualdad por una cantidad positiva?
  choices:
  - text: Invertir el sentido de la desigualdad al multiplicar o dividir por un número
      negativo en propiedades de las desigualdades
    is_correct: true
  - text: Mantener el mismo sentido de la desigualdad sin cambios
    is_correct: false
  - text: Cambiar la variable por cero
    is_correct: false
  - text: Transformar la inecuación en una igualdad exacta
    is_correct: false
  explanation: 'La alternativa correcta es: Invertir el sentido de la desigualdad
    al multiplicar o dividir por un número negativo en propiedades de las desigualdades.
    Es la propiedad fundamental de orden en división de una desigualdad por una cantidad
    positiva.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver una inecuación y obtener su conjunto solución en división
    de una desigualdad por una cantidad positiva, ¿cómo se debe expresar el resultado?
  choices:
  - text: Representar el conjunto solución mediante notación de intervalo o gráficamente
      en la recta real
    is_correct: true
  - text: Como un único número aislado obligatoriamente
    is_correct: false
  - text: Igualando la variable a la constante
    is_correct: false
  - text: Eliminando los símbolos de desigualdad del resultado
    is_correct: false
  explanation: 'La alternativa correcta es: Representar el conjunto solución mediante
    notación de intervalo o gráficamente en la recta real. Forma estándar de representar
    conjuntos soluciones de inecuaciones.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Identificar el coeficiente o número positivo por el cual se va a dividir.
- Dividir el miembro izquierdo de la desigualdad entre dicho número.
- Dividir el miembro derecho entre el mismo número.
- Simplificar las fracciones y mantener el sentido de la desigualdad original.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en división de una desigualdad
  por una cantidad positiva.
ejemplos:
- titulo: Despeje con coeficiente entero
  enunciado: Resuelva la inecuación $4x < 20$.
  solucion_pasos:
  - Dividir ambos lados entre $4$, un número positivo.
  - $\frac{4x}{4} < \frac{20}{4}$.
  - 'Simplificar: $x < 5$.'
- titulo: Desigualdad con variables negativas
  enunciado: Resuelva $2y \geq -10$.
  solucion_pasos:
  - 'Dividir por $2$ a ambos lados: $\frac{2y}{2} \geq \frac{-10}{2}$.'
  - Simplificar obteniendo $y \geq -5$.
- titulo: Si $10 > 6$, ¿es correcto afirmar que $\frac{10}{2} > \frac{6}{2}$?
  respuesta: Sí
  solucion_pasos:
  - Dividimos entre $2$, que es un número mayor a cero.
  - La relación se simplifica a $5 > 3$, la cual es correcta.
- titulo: ¿El sentido de la desigualdad se invierte si el dividendo es negativo pero
    el divisor es positivo?
  respuesta: 'No'
  solucion_pasos:
  - El único factor que determina si la desigualdad se invierte o no, es el signo
    del divisor.
  - Si el divisor es positivo, la desigualdad no se invierte.
errores_frecuentes:
- Dividir por un número positivo cambia el signo de la desigualdad.
- No se puede dividir si el numerador es negativo.
- Dividir por una fracción positiva invierte la desigualdad.
- Si $x > y$ y $c > 0$, entonces $\frac{x}{c} < \frac{y}{c}$.
- Al dividir entre un número decimal positivo se debe cambiar el sentido.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  división de una desigualdad por una cantidad positiva.
