procedimiento:
- 'Paso 1: Convierte la medida de la Realidad a la unidad de la medida del Plano (ej. de km
  a cm).'
- 'Paso 2: Divide la Realidad por el Plano.'
- 'Paso 3: El número resultante es el factor $E$. La escala se escribe $1:E$.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de escala desconocida.
ejemplos:
- titulo: Descifrando la escala
  enunciado: Un parque de 200 metros de largo está dibujado en un papel con una longitud de
    10 cm. ¿Qué escala se usó?
  solucion_pasos:
  - 'Convertimos la realidad a cm: $200 \text{ m} = 20.000$ cm.'
  - 'Dividimos realidad entre plano: $20.000 / 10 = 2.000$.'
  - El factor $E$ es 2.000. La escala del dibujo es 1:2.000.
- titulo: Ejemplo 2
  enunciado: Un parque de 400 m se dibuja con 20 cm de longitud. ¿Qué escala se usó?
  alternativas:
  - '1:2.000'
  - '1:20'
  - 1:400
  respuesta: '1:2.000'
  solucion_pasos:
  - 400 por 100 es igual a 40.000 cm; 40.000 dividido entre 20 es igual a 2.000.
- titulo: Ejemplo 3
  enunciado: Una calle de 60 m se dibuja con 30 cm. ¿Qué escala se usó?
  alternativas:
  - 1:200
  - '1:2'
  - 1:60
  respuesta: 1:200
  solucion_pasos:
  - 60 por 100 es igual a 6.000 cm; 6.000 dividido entre 30 es igual a 200.
- titulo: ¿El factor E de la escala se calcula dividiendo la realidad entre el plano?
  respuesta: Sí
  solucion_pasos:
  - Esa es la fórmula para hallar una escala desconocida.
errores_frecuentes:
- Dividir el plano por la realidad (obteniendo un número decimal absurdo como 0.0005).
- Hacer la división sin haber igualado las unidades de medida (ej. dividir 200 metros / 10
  cm = 20 $\rightarrow$ escala 1:20 es incorrecto).
- Dividir el plano por la realidad en vez de la realidad por el plano, obteniendo un número
  decimal absurdo.
- Hacer la división sin haber igualado antes las unidades de medida.
- Confundir el factor E de la escala con la medida real del objeto.
afirmaciones_verdaderas:
- La propiedad de cálculo de escala desconocida preserva la consistencia lógica.
- Para calcular una escala desconocida, ambas medidas, plano y realidad, deben expresarse
  primero en la misma unidad.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de escala desconocida.
