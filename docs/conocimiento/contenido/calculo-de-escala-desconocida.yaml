  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Convertir la distancia real a centímetros ($D_{\text{real}} \cdot 100$ para metros o $\cdot 100.000$ para kilómetros).'
- 'Paso 2: Efectuar la división $N = \frac{D_{\text{real (cm)}}}{D_{\text{plano (cm)}}}$.'
- 'Paso 3: Redactar la escala resultante en formato $1 : N$ (adimensional).'
errores_correccion: '- **Error 1: Dividir medidas en unidades distintas (ej: $25\text{ km} / 5\text{ cm} = 5$).** **Cómo corregirlo:** Convertir OBLIGATORIAMENTE la distancia real a centímetros antes de dividir.

  - **Error 2: No dejar el numerador en 1.** **Cómo corregirlo:** Simplificar la razón hasta obtener la forma canónica $1 : N$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $3\text{ cm}$ en un plano representan $150\text{ metros}$ en la realidad, ¿cuál es la escala?
  alternativas:
  - '$1 : 5.000$'
  - '$1 : 500$'
  - '$1 : 50.000$'
  respuesta: '$1 : 5.000$'
  solucion_pasos:
  - '$150\text{ m} = 15.000\text{ cm} \implies N = \frac{15000}{3} = 5000 \implies 1 : 5.000$.'
- titulo: Ejemplo 2
  enunciado: Un trayecto de $60\text{ km}$ mide $12\text{ cm}$ en un mapa. ¿Cuál es su escala?
  alternativas:
  - '$1 : 500.000$'
  - '$1 : 50.000$'
  - '$1 : 5.000.000$'
  respuesta: '$1 : 500.000$'
  solucion_pasos:
  - '$60\text{ km} = 6.000.000\text{ cm} \implies N = \frac{6000000}{12} = 500.000 \implies 1 : 500.000$.'
- titulo: ¿Se deben expresar ambas medidas en centímetros para deducir la escala?
  respuesta: Sí
  solucion_pasos:
  - Sí, la homogeneidad de unidades es necesaria para que las dimensiones se cancelen.
  alternativas:
  - texto: Sí, es el requisito indispensable para obtener una escala adimensional
    es_correcta: true
    retroalimentacion: ¡Correcto! Homogeneización obligatoria.
  - texto: No, se divide directamente en kilómetros
    es_correcta: false
    retroalimentacion: Incorrecto, arrojaría un valor falso sin sentido de escala.
  - texto: No, se usan pulgadas
    es_correcta: false
    retroalimentacion: Incorrecto, el sistema métrico usa centímetros.
- titulo: '¿Debe expresarse la escala siempre en el formato normalizado 1 : N?'
  respuesta: Sí
  solucion_pasos:
  - Sí, el estándar técnico y cartográfico exige simplificar hasta la unidad en el antecedente.
  alternativas:
  - texto: Sí, es el estándar internacional de representación cartográfica
    es_correcta: true
    retroalimentacion: '¡Correcto! Formato canónico $1 : N$.'
  - texto: 'No, se puede dejar como 3 : 15.000'
    es_correcta: false
    retroalimentacion: Incorrecto, debe simplificarse completamente.
  - texto: No, se expresa en porcentaje
    es_correcta: false
    retroalimentacion: Incorrecto, la escala no se expresa en tanto por ciento.
errores_frecuentes:
- 'Dividir distancias en unidades diferentes (ej: kilómetros entre centímetros).'
- No simplificar la fracción para dejar el antecedente en 1.
- 'Agregar unidades de medida a la escala resultante (ej: $1\text{ cm} : 500\text{ m}$).'
- Invertir el orden dividiendo la medida del plano entre la real.
afirmaciones_verdaderas:
- La escala se calcula mediante $N = \frac{D_{\text{real (cm)}}}{D_{\text{plano (cm)}}}$.
- Ambas medidas deben estar en centímetros para que la razón sea adimensional.
- 'La escala normalizada adopta la forma $1 : N$ para reducción.'
al_terminar_debes_poder: '![Síntesis de cálculo de escala desconocida](/static/img/nodos/calculo-de-escala-desconocida-resumen.svg)


  QUÉ: Determinar la escala numérica $1 : N$ a partir de dimensiones emparejadas en el dibujo y en la realidad.


  CÓMO: Homogeneizando ambas medidas a centímetros ($D_{\text{real}} \cdot 10^5$ o $\cdot 10^2$), calculando el factor $N = \frac{D_{\text{real (cm)}}}{D_{\text{plano (cm)}}}$ y estructurando la escala normalizada $1 : N$.'
