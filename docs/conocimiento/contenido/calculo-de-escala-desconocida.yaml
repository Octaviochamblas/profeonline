semantic_id: MAT.NUM.REPARTO_ESCALAS.ESCALA_DESCONOCIDA
resumen_inicial: 'El cálculo de una escala desconocida determina el factor $N$ dividiendo la medida real $R$ expresada en centímetros entre la medida dibujada en el plano $d$: $N = \frac{R_{\text{cm}}}{d_{\text{cm}}}$.'
explicacion_simple: |
  Si tienes un dibujo y una medida real pero no sabes a qué escala fue hecho el plano:
  1. Conviertes la medida real a centímetros.
  2. Divides esos centímetros reales por los centímetros que mide el dibujo en el papel ($N = \frac{\text{Real en cm}}{\text{Dibujo en cm}}$).
  3. El resultado $N$ es el denominador de la escala, por lo que escribes $1 : N$.
  Por ejemplo, si una pared de $500\text{ cm}$ real mide $10\text{ cm}$ en el plano, la escala es $N = 500 \div 10 = 50$, es decir, escala $1 : 50$.
explicacion_formal: |
  ### Definición formal
  Dadas las magnitudes pareadas de una representación $d$ y de la realidad $R$, el **denominador de la escala de reducción $N$** es el cociente de magnitudes expresadas en unidades homogéneas:
  $$N = \frac{R}{d} \quad \iff \quad E = \frac{d}{R} = \frac{1}{N} = 1 : N$$

  ### Algoritmo de determinación de escala
  1. **Homogeneizar unidades**: Convertir $R$ a las mismas unidades de medida que $d$ (usualmente $\text{cm}$).
  2. **Calcular el factor divisor $N$**:
     $$N = \frac{R_{\text{cm}}}{d_{\text{cm}}}$$
  3. **Expresar en formato estándar de reducción $1 : N$** o simplificar la fracción $\frac{d}{R}$.

  ### Determinación de escala a partir de superficies o áreas
  Si se conocen las áreas en el plano $A_d$ y en la realidad $A_R$:
  $$E^2 = \frac{A_d}{A_R} \implies E = \sqrt{\frac{A_d}{A_R}} = \frac{1}{N} \implies N = \sqrt{\frac{A_R}{A_d}}$$

  ### Síntesis didáctica
  - Ecuación del factor: $N = \frac{R_{\text{real en cm}}}{d_{\text{plano en cm}}}$.
  - Formato final: $1 : N$.
definiciones_clave: |
  - **Construcción de escala**: Proceso analítico para deducir la razón $1 : N$ a partir de dos mediciones conocidas.
  - **Factor divisor $N$**: Cociente numérico $\frac{R}{d}$ que especifica la proporción de reducción.
  - **Homogeneización previa**: Igualación obligatoria de las unidades métricas antes de calcular el cociente $N$.
propiedades_relaciones: |
  - **Unicidad de la escala**: Cualquier par de puntos correspondientes $(d_i, R_i)$ del mismo plano debe arrojar exactamente el mismo denominador $N = \frac{R_i}{d_i}$.
  - **Sensibilidad a errores de medición**: Un error de $1\text{ mm}$ en la lectura de $d$ produce variaciones significativas en el cálculo de $N$ si el objeto es muy grande.
ejemplo_guiado:
  enunciado: 'Un puente que mide $150\text{ metros}$ de largo en la realidad aparece representado en un mapa con una longitud de $3\text{ centímetros}$. Determina la escala a la cual fue confeccionado el mapa.'
  pasos:
    - 'Paso 1: Identificamos la medida del mapa $d = 3\text{ cm}$ y la medida real $R = 150\text{ m}$.'
    - 'Paso 2: Convertimos la medida real a centímetros: $R = 150\text{ m} \cdot 100 = 15.000\text{ cm}$.'
    - 'Paso 3: Calculamos el denominador de la escala $N$ dividiendo la realidad entre el dibujo: $N = \frac{15.000}{3} = 5.000$.'
    - 'Paso 4: Escribimos la escala en formato normalizado $1 : N$: **Escala $1 : 5.000$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se calcula el denominador de la escala $N$ en un mapa si se conoce la medida dibujada $d$ y la medida real $R$ en centímetros?'
    choices:
      - {text: 'Dividiendo la medida real $R$ entre la medida dibujada $d$ ($N = \frac{R}{d}$)', is_correct: true}
      - {text: 'Multiplicando la medida real $R$ por la medida dibujada $d$', is_correct: false}
      - {text: 'Restando la medida dibujada $d$ a la medida real $R$', is_correct: false}
      - {text: 'Dividiendo la medida dibujada $d$ entre la medida real $R$', is_correct: false}
    explanation: 'La alternativa correcta es ''Dividiendo la medida real $R$ entre la medida dibujada $d$ ($N = \frac{R}{d}$)''. El denominador es $N = R / d$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una cancha de fútbol de $100\text{ metros}$ de largo ($10.000\text{ cm}$) mide $20\text{ cm}$ en un plano, ¿cuál es la escala empleada?'
    choices:
      - {text: 'Escala $1 : 500$, calculando $N = 10.000 / 20 = 500$', is_correct: true}
      - {text: 'Escala $1 : 50$, dividiendo $1.000 / 20$', is_correct: false}
      - {text: 'Escala $1 : 200$, restando ceros', is_correct: false}
      - {text: '$1 : 2.000$, multiplicando $100 \cdot 20$', is_correct: false}
    explanation: 'La alternativa correcta es ''Escala $1 : 500$, calculando $N = 10.000 / 20 = 500$''. $N = 10.000\text{ cm} / 20\text{ cm} = 500 \implies$ Escala $1 : 500$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Medir o identificar la longitud $d$ en el plano (usualmente en centímetros).'
  - 'Paso 2: Identificar la longitud real $R$ y convertira a la misma unidad ($\text{cm}$).'
  - 'Paso 3: Calcular el cociente $N = \frac{R_{\text{cm}}}{d_{\text{cm}}}$.'
  - 'Paso 4: Formular la escala final en formato $1 : N$.'
errores_correccion: |
  - **Error 1:** Dividir los metros reales entre los centímetros del plano sin convertir a centímetros. **Cómo corregirlo:** La división **$N = \frac{R}{d}$ exige que ambas medidas estén en la MISMA unidad ($\text{cm}$)**.
  - **Error 2:** Escribir el resultado como un número entero solo $N$ en lugar de poner el formato $1 : N$. **Cómo corregirlo:** La escala es una razón matemática; exprésala siempre como **$1 : N$**.
ejemplos:
  - titulo: 'Deducción de escala en maqueta'
    enunciado: 'Un edificio real de $40\text{ metros}$ ($4.000\text{ cm}$) mide $20\text{ cm}$ en la maqueta. ¿La escala es $1 : 200$?'
    alternativas:
      - 'Sí, pues $N = 4.000 / 20 = 200 \implies 1 : 200$'
      - 'No, es 1:20'
      - 'No, es 1:2.000'
    respuesta: 'Sí, pues $N = 4.000 / 20 = 200 \implies 1 : 200$'
    solucion_pasos:
      - '1. Conversión: $40\text{ m} = 4.000\text{ cm}$.'
      - '2. División: $N = 4.000 / 20 = 200$.'
      - '3. Formato: Escala $1 : 200$.'
  - titulo: 'Escala a partir de mapa rutero'
    enunciado: 'Una distancia real de $50\text{ km}$ ($5.000.000\text{ cm}$) mide $5\text{ cm}$ en el mapa. ¿La escala es $1 : 1.000.000$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $N = 5.000.000 / 5 = 1.000.000 \implies 1 : 1.000.000$.'
  - titulo: 'Escala de ampliación en dibujo microscópico'
    enunciado: 'Una fibra de $0.2\text{ mm}$ mide $20\text{ mm}$ en la lámina. ¿La escala es $100 : 1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ampliación: $20 / 0.2 = 100 \implies 100 : 1$.'
  - titulo: 'Comprobación con un segundo punto'
    enunciado: 'En el mismo mapa a escala $1:200$, ¿otra pared real de $10\text{ m}$ debe medir $5\text{ cm}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1.000\text{ cm} / 200 = 5\text{ cm}$. Se mantiene la constante $N=200$.'
errores_frecuentes:
  - 'Dividir los metros reales entre los centímetros del papel sin realizar la conversión previa a centímetros.'
  - 'Multiplicar la medida del dibujo por la medida real en lugar de dividirlas.'
  - 'Escribir la escala invertida poniendo el número mayor a la izquierda en una escala de reducción.'
  - 'La escala desconocida se expresa simplemente como un número entero $N$ sin el prefijo $1 :$.'
  - 'La escala de un plano uniforme varía según la región del dibujo que se esté midiendo.'
afirmaciones_verdaderas:
  - 'El denominador de la escala $N$ se calcula dividiendo la dimensión real expresada en centímetros entre la dimensión dibujada en centímetros ($N = \frac{R_{\text{cm}}}{d_{\text{cm}}}$).'
  - 'Toda medición en un plano bien elaborado debe arrojar el mismo valor de denominador de escala $N = \frac{R}{d}$.'
al_terminar_debes_poder: 'Calcular la escala desconocida $1 : N$ de un mapa o plano comparando mediciones homogéneas $N = \frac{R}{d}$.'
