semantic_id: MAT.NUM.RAZONES_PROPORCIONES.ESCALA_CALCULO_ESCALA
resumen_inicial: 'El cálculo de una escala desconocida deduce el factor $N$ mediante el cociente de magnitudes homogéneas $N = \frac{D_{\text{real (cm)}}}{D_{\text{plano (cm)}}}$, formulando la escala resultante en el formato canónico $1 : N$.'
explicacion_simple: "![Cálculo de escala desconocida](/static/img/nodos/calculo-de-escala-desconocida-intro.svg)\n\nPara averiguar **a qué escala está dibujado un plano o mapa** cuando conocemos una distancia en el papel y su correspondiente distancia real:\n\n1. **Paso 1: Convertir la distancia real a centímetros** (para que ambas medidas estén en la misma unidad).\n2. **Paso 2: Dividir la distancia real en cm entre la distancia en el plano**:\n$$N = \\frac{D_{\\text{real (en cm)}}}{D_{\\text{plano (en cm)}}}$$\n3. **Paso 3: Escribir la escala en formato $1 : N$**:\n- **Ejemplo:** Si $5\\text{ cm}$ en el mapa representan $25\\text{ km}$ en el terreno:\n  - Pasamos $25\\text{ km}$ a cm $\\implies 2.500.000\\text{ cm}$.\n  - $N = \\frac{2.500.000}{5} = 500.000$.\n  - La escala es **$1 : 500.000$**."
explicacion_formal: 'Sean los pares observados $(D_{\text{plano}}, D_{\text{real}}) \in \mathbb{R}^+ \times \mathbb{R}^+$.


  **Deducción Formal de la Homotecia:**

  Se busca la constante $N \in \mathbb{R}^+$ tal que:


  $$E = \frac{D_{\text{plano}}^{[\text{cm}]}}{D_{\text{real}}^{[\text{cm}]}} = \frac{1}{N}$$


  Despejando el factor de escala:


  $$N = \frac{D_{\text{real}}^{[\text{cm}]}}{D_{\text{plano}}^{[\text{cm}]}} = \frac{D_{\text{real}}^{[\text{km}]} \cdot 10^5}{D_{\text{plano}}^{[\text{cm}]}}$$


  expresando el resultado en la forma normalizada $1 : N$.'
definiciones_clave: '- **Denominador de escala ($N$)**: Razón $\frac{D_{\text{real}}}{D_{\text{plano}}}$ calculada en unidades idénticas.

  - **Formato normalizado ($1 : N$)**: Expresión canónica con numerador unitario.

  - **Cancelación dimensional**: Eliminación de unidades al dividir $\text{cm} / \text{cm}$.'
propiedades_relaciones: '- **Invarianza de escala**: Con cualquier par de puntos del mismo plano se obtendrá exactamente el mismo valor de $N$.

  - **Adimensionalidad**: La escala carece de símbolos de unidad de medida.'
ejemplo_guiado:
  enunciado: '![Ejemplos de cálculo de escala](/static/img/nodos/calculo-de-escala-desconocida-ejemplos.svg)


    Halle la escala de un mapa si $5\text{ cm}$ en el papel representan $25\text{ km}$ de carretera, y determine la escala de un plano de vivienda donde un muro de $8\text{ metros}$ mide $4\text{ cm}$.'
  pasos:
  - 'Paso 1: Para el mapa: Pasar $25\text{ km}$ a $\text{cm} \implies 2.500.000\text{ cm}$.'
  - 'Paso 2: Calcular $N = \frac{2.500.000}{5} = 500.000 \implies$ Escala $1 : 500.000$.'
  - 'Paso 3: Para la vivienda: Pasar $8\text{ m}$ a $\text{cm} \implies 800\text{ cm}$.'
  - 'Paso 4: Calcular $N = \frac{800}{4} = 200 \implies$ Escala $1 : 200$.'
