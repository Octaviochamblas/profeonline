resumen_inicial: 'El cálculo de una escala desconocida $1 : n$ consiste en determinar
  la constante $n$ dividiendo la distancia real $R$ entre la distancia del plano $d$
  en idéntica unidad de medida: $n = \frac{R}{d}$.'
explicacion_simple: Si tenemos un objeto real y su dibujo, pero no sabemos a qué escala
  se hizo, convertimos ambas medidas a la misma unidad (como centímetros) y dividimos
  el tamaño real entre el tamaño del dibujo para hallar el número $n$ de la escala
  $1:n$.
explicacion_formal: 'Dada la medida en el dibujo $d$ y la medida real $R$ convertidas
  a las mismas unidades, el **Factor Denominador de Escala $n$** de la razón $E =
  1 : n$ es:


  $$n = \frac{R}{d} \implies \text{Escala } E = 1 : \left( \frac{R}{d} \right)$$


  **Verificación:**

  - $n > 1$ indica escala de reducción y $n < 1$ escala de ampliación.'
definiciones_clave: '- **Cálculo de escala desconocida**: Obtención de $n = \frac{R}{d}$
  para expresar la razón $1 : n$.'
propiedades_relaciones: '- **Razón dimensional única**: $n = \frac{\text{Distancia
  Real}}{\text{Distancia Dibujada}}$.'
ejemplo_guiado:
  enunciado: Un edificio de $45\text{ metros}$ de altura está representado en una
    maqueta con una altura de $15\text{ cm}$. ¿A qué escala se construyó la maqueta?
  pasos:
  - 'Paso 1: Convertir la altura real a centímetros: $R = 45\text{ m} = 4.500\text{
    cm}$.'
  - 'Paso 2: Calcular el denominador de escala $n = \frac{R}{d} = \frac{4.500\text{
    cm}}{15\text{ cm}} = 300$.'
  - 'Conclusión: La maqueta fue construida a una escala de $1 : 300$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cómo se determina el factor n de una escala desconocida 1 : n?'
  choices:
  - text: Dividiendo la distancia real entre la distancia dibujada en la misma unidad
      (n = R / d)
    is_correct: true
  - text: Multiplicando n = R · d
    is_correct: false
  - text: Restando n = R - d
    is_correct: false
  - text: Sumando ambas medidas
    is_correct: false
  explanation: La alternativa correcta es 'Dividiendo la distancia real entre la distancia
    dibujada en la misma unidad (n = R / d)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el edificio de 45 m dibujado con 15 cm, ¿cuál
    fue la escala resultante?
  choices:
  - text: '1 : 300'
    is_correct: true
  - text: '1 : 30'
    is_correct: false
  - text: '1 : 3.000'
    is_correct: false
  - text: '1 : 150'
    is_correct: false
  explanation: 'La alternativa correcta es ''1 : 300''.'
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: 'Al terminar serás capaz de determinar una escala desconocida
  $1 : n$ dividiendo la medida real entre la medida del dibujo $n = \frac{R}{d}$.'
semantic_id: MAT.NUM.REPARTO_ESCALAS.ESCALA_DESCONOCIDA
procedimiento:
- 'Paso 1: Identificar el tipo de problema (reparto proporcional directo/inverso o
  cálculo de escalas).'
- 'Paso 2: Convertir unidades de medida a un sistema homogéneo común (en el caso de
  escalas).'
- 'Paso 3: Calcular la constante de proporcionalidad $k$ o la escala $E$ y resolver
  la incógnita solicitada.'
errores_correccion: '- **Error 1: Calcular la escala dividiendo medidas en distintas
  unidades (ej: metros entre centímetros directamente).** **Cómo corregirlo:** Se
  DEBEN convertir ambas distancias a la MISMA unidad de medida antes de calcular $n
  = R / d$.


  - **Error 2: Tratar un reparto inverso como si fuera directo dividiendo el total
  por los índices sin invertirlos.** **Cómo corregirlo:** En el reparto inverso se
  DEBEN invertir previamente los coeficientes ($1/a_i$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.REPARTO_ESCALAS.ESCALA_DESCONOCIDA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del reparto proporcional o escalas.
- titulo: Ejemplo 2
  enunciado: Verificación de la constante k o escala E.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal de equivalencia proporcional.
- titulo: ¿Conserva el reparto proporcional la suma del total T?
  respuesta: Sí
  solucion_pasos:
  - Sí, la suma de las partes repartidas equivale a $T$.
- titulo: ¿Exige la escala expresarse en las mismas unidades de medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, para obtener una razón adimensional $1:n$.
errores_frecuentes:
- Calcular una escala dividiendo la distancia en metros entre los centímetros del
  plano sin convertir unidades.
- Realizar un reparto proporcional inverso sumando los coeficientes directamente como
  si fuera un reparto directo.
- Invertir el orden de la escala dividiendo la medida del plano por la medida real
  ($d / R$) para la constante $n$.
- Omitir multiplicar la constante de reparto $k$ por cada uno de los coeficientes
  individuales al finalizar.
- Restar los coeficientes al calcular el total repartido en una serie de razones.
afirmaciones_verdaderas:
- El reparto proporcional directo distribuye un total multiplicando la constante $k
  = \frac{T}{\sum a_i}$ por cada índice.
- 'La escala de un plano $E = \frac{d}{R} = 1 : n$ relaciona la distancia dibujada
  y la real expresadas en idéntica unidad.'
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
