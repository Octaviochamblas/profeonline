semantic_id: MAT.NUM.REPARTO_ESCALAS.ESCALA_DESCONOCIDA
resumen_inicial: 'Cálculo de escala desconocida: concepto y propiedades fundamentales en Reparto
  proporcional y escalas.'
explicacion_simple: Imagina que encuentras un mapa viejo sin leyenda, pero logras identificar
  la distancia entre dos ciudades conocidas. Con esa simple información, puedes 'desencriptar'
  la escala que usó el cartógrafo.
explicacion_formal: 'Si tenemos la medida en el **Plano** y la medida en la **Realidad**,
  encontrar la escala $1:E$ se reduce a despejar $E$ de la fórmula:


  $E = \frac{\text{Realidad}}{\text{Plano}}$


  **Regla de oro:** Ambas medidas deben estar forzosamente en la **misma unidad** (sugerimos
  centímetros) antes de hacer la división. El resultado $E$ te dirá que la escala es $1:E$.'
definiciones_clave: '- **Cálculo de escala desconocida**: Elemento central dentro del estudio
  de Reparto proporcional y escalas.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo de escala desconocida.'
ejemplo_guiado:
  enunciado: Un edificio real de 30 metros de altura aparece dibujado con 15 cm de altura
    en un plano. ¿Qué escala se usó?
  pasos:
  - 'Convierto la realidad a centímetros: 30 por 100 es igual a 3.000 centímetros.'
  - 'Divido la realidad entre el plano: 3.000 dividido entre 15 es igual a 200.'
  - Concluyo que la escala usada es 1:200.
