semantic_id: MAT.NUM.DIVISIBILIDAD.CRITERIO_9
resumen_inicial: "Un número es divisible por 9 si la suma de sus cifras es un múltiplo de 9."
explicacion_simple: |
  Tienes un montón de caramelos y quieres repartirlos en grupos de 9 sin que sobre
  ninguno. Existe un truco: suma las cifras del número. Si el resultado es múltiplo de 9,
  ¡el número completo también lo es! Es como un detective que con solo mirar las cifras
  te dice si es múltiplo de 9, sin necesidad de dividir.
explicacion_formal: |
  Para $N=100a+10b+c$: se reescribe como $N=(99a+9b)+(a+b+c)$. Como $99$ y $9$ son
  múltiplos de 9, el término $(99a+9b)$ siempre lo es. Por lo tanto, $N$ es divisible por
  9 si y solo si la suma de sus cifras $(a+b+c)$ lo es. Se extiende a cualquier cantidad
  de cifras.
definiciones_clave: |
  **Suma de cifras**: sumar todos los dígitos. Para el criterio del 9, esa suma debe ser
  múltiplo de 9 (no basta con múltiplo de 3).
propiedades_relaciones: |
  Todo número divisible por 9 también es divisible por 3 (porque 9 es múltiplo de 3), pero
  no todo número divisible por 3 es divisible por 9.
ejemplo_guiado:
  enunciado: "Determina si 4.923 es divisible por 9."
  pasos:
    - "Se suman las cifras: $4+9+2+3=18$."
    - "$18$ es múltiplo de 9 ($9\\times2=18$)."
    - "Conclusión: 4.923 es divisible por 9."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Todo número divisible por 3 es también divisible por 9?"
    choices:
      - {text: "No, la suma debe ser múltiplo de 9, no solo de 3", is_correct: true}
      - {text: "Sí, siempre", is_correct: false}
      - {text: "Solo si es par", is_correct: false}
      - {text: "Solo si termina en 9", is_correct: false}
    explanation: "La correcta es No, la suma debe ser múltiplo de 9, no solo de 3: por ejemplo, 12 es divisible por 3 pero no por 9."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿es 3.150 divisible por 9?"
    choices:
      - {text: "Sí, la suma de cifras es 9", is_correct: true}
      - {text: "No, la suma de cifras es 9", is_correct: false}
      - {text: "Sí, porque termina en 0", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es Sí, la suma de cifras es 9: $3+1+5+0=9$, que es múltiplo de 9."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Escribe el número que quieres verificar."
  - "Paso 2: Suma todas las cifras del número."
  - "Paso 3: Verifica si la suma obtenida en el Paso 2 es un múltiplo de 9. Si lo es, el número original es divisible por 9. Si no lo es, el número original no es divisible por 9. Si la suma es muy grande, puedes repetir el Paso 2 con la suma obtenida."
errores_correccion: |
  Un error frecuente es confundir este criterio con el del 3: para el 9, la suma debe ser
  múltiplo de 9, no solo de 3. Otro error es pensar que basta con que el número termine
  en 9 o contenga un 9 en alguna cifra.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "Determina si el número $342$ es divisible por $9$."
    alternativas:
      - "Sí, la suma de cifras es 9"
      - "No, la suma de cifras es 8"
      - "No se puede determinar"
    respuesta: "Sí, la suma de cifras es 9"
    solucion_pasos:
      - "Paso a: Sumamos las cifras del número $342$: $3 + 4 + 2 = 9$."
      - "Paso b: La suma, $9$, es un múltiplo de $9$ ($9 \\cdot 1 = 9$). Por lo tanto, $342$ es divisible por $9$."
  - titulo: "Ejemplo 2"
    enunciado: "Calcula si el número $7857$ es divisible por $9$."
    alternativas:
      - "Sí, la suma de cifras es 27"
      - "No, la suma de cifras es 25"
      - "No se puede determinar"
    respuesta: "Sí, la suma de cifras es 27"
    solucion_pasos:
      - "Paso a: Sumamos las cifras del número $7857$: $7 + 8 + 5 + 7 = 27$."
      - "Paso b: La suma, $27$, es un múltiplo de $9$ ($9 \\cdot 3 = 27$). Por lo tanto, $7857$ es divisible por $9$."
  - titulo: "¿Es el número $12345$ divisible por $9$?"
    respuesta: "No"
    solucion_pasos:
      - "Sumamos las cifras de $12345$: $1 + 2 + 3 + 4 + 5 = 15$."
      - "El número $15$ no es un múltiplo de $9$ (los múltiplos de $9$ son $9, 18, 27, \\ldots$). Por lo tanto, $12345$ no es divisible por $9$."
  - titulo: "¿Es el número $987654321$ divisible por $9$?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sumamos las cifras de $987654321$: $9 + 8 + 7 + 6 + 5 + 4 + 3 + 2 + 1 = 45$."
      - "El número $45$ es un múltiplo de $9$ ($9 \\cdot 5 = 45$). Por lo tanto, $987654321$ es divisible por $9$."
errores_frecuentes:
  - "Confundir el criterio de divisibilidad por 9 con el de 3. Aunque ambos se basan en la suma de las cifras, para el 9 la suma debe ser múltiplo de 9, no solo de 3."
  - "Sumar incorrectamente las cifras del número, lo que lleva a una conclusión errónea."
  - "Pensar que si un número termina en 9, es divisible por 9 (ej: 19 no es divisible por 9, $1+9=10$)."
  - "Creer que si un número contiene un 9, es divisible por 9 (ej: 129 no es divisible por 9, $1+2+9=12$)."
  - "No saber qué hacer si la suma de las cifras es un número grande; se debe volver a aplicar el criterio a esa suma."
al_terminar_debes_poder: |
  Determinar la divisibilidad por 9 de cualquier número sumando sus cifras, y explicar
  la diferencia con el criterio del 3.
fuente: "Matemática 7° Básico Tomo 1 — Teoría de Números"
estado: publicado
