procedimiento:
- 'Paso 1: Verifica que el cuerpo tenga exactamente 6 caras cuadradas.'
- 'Paso 2: Verifica que las 6 caras sean congruentes entre sí (mismo tamaño de lado).'
- 'Paso 3: Confirma que en cada uno de los 8 vértices concurran exactamente 3 caras.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con identificación del cubo como hexaedro regular.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de identificación del cubo como hexaedro regular
    para determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
