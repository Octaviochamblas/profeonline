semantic_id: MAT.GEO.POLIEDROS_PRISMAS.HEXAEDRO_REGULAR
resumen_inicial: 'Identificación del cubo como hexaedro regular: conceptos, teoremas,
  propiedades geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: 'El cubo, el cuerpo geométrico más conocido de todos (como un
  dado), es en realidad el hexaedro regular: el poliedro regular de 6 caras.'
explicacion_formal: '![Hexaedro regular (cubo)](/static/img/geometria/espacio-cuerpos/hexaedro-regular.svg)


  ### Definición formal


  El hexaedro regular, más conocido como cubo, es uno de los cinco sólidos platónicos.
  Tiene 6 caras (todas cuadrados congruentes), 8 vértices y 12 aristas. En cada vértice
  concurren exactamente 3 caras.


  ### Desarrollo didáctico


  En la figura, el cubo tiene sus 6 caras cuadradas, todas del mismo tamaño: 2 bases
  (superior e inferior) y 4 caras laterales, todas idénticas entre sí. Es, además
  de un poliedro regular, un caso particular de prisma recto (con bases cuadradas
  y altura igual al lado de la base).'
definiciones_clave: '- **Identificación del cubo como hexaedro regular**: Elemento
  o propiedad fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del cubo como hexaedro regular.'
