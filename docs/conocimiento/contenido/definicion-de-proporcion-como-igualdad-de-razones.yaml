semantic_id: MAT.NUM.PROPORCIONES.DEFINICION_IGUALDAD_RAZONES
resumen_inicial: Una proporción es la igualdad entre dos razones ($\frac{a}{b} = \frac{c}{d}$
  con $b, d \neq 0$). Se lee '$a$ es a $b$ como $c$ es a $d$'.
explicacion_simple: 'Una proporción indica que dos comparaciones por cociente son
  exactamente equivalentes:

  - Si $2:3$ y $4:6$ tienen el mismo valor ($0{,}666...$), entonces forman la proporción
  $\frac{2}{3} = \frac{4}{6}$.'
explicacion_formal: Dadas dos razones $\frac{a}{b}$ y $\frac{c}{d}$ con $b, d \neq
  0$, la igualdad $\frac{a}{b} = \frac{c}{d}$ constituye una proporción geométrica.
  Las cantidades $a, b, c, d$ reciben el nombre de términos de la proporción.
definiciones_clave: '- **Proporción**: Igualdad de dos razones equivalentes $\frac{a}{b}
  = \frac{c}{d}$.'
propiedades_relaciones: '- **Valor de razón común**: $\frac{a}{b} = k$ y $\frac{c}{d}
  = k \implies \frac{a}{b} = \frac{c}{d}$.'
ejemplo_guiado:
  enunciado: Verifica si las razones $\frac{3}{5}$ y $\frac{12}{20}$ forman una proporción.
  pasos:
  - 'Calcular el valor de la primera razón: $3 \div 5 = 0{,}6$.'
  - 'Calcular el valor de la segunda razón: $12 \div 20 = 0{,}6$.'
  - Como ambos valores coinciden ($0{,}6 = 0{,}6$), las razones son iguales.
  - Concluir que $\frac{3}{5} = \frac{12}{20}$ SÍ forman una proporción.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué es una proporción en matemáticas?
  choices:
  - text: La igualdad de dos razones
    is_correct: true
  - text: La suma de dos fracciones
    is_correct: false
  - text: La resta de dos enteros
    is_correct: false
  - text: La multiplicación de dos decimales
    is_correct: false
  explanation: 'La correcta es: La igualdad de dos razones. Por definición de proporción
    $\frac{a}{b} = \frac{c}{d}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Forman las razones $2/3$ y $8/12$ una proporción?
  choices:
  - text: Sí, porque ambas equivalen a 0,666...
    is_correct: true
  - text: No, porque tienen distintos números
    is_correct: false
  - text: Sí, porque 2 + 3 = 5
    is_correct: false
  - text: No se puede saber
    is_correct: false
  explanation: 'La correcta es: Sí, porque ambas equivalen a 0,666... Puesto que $8/12$
    simplificado es $2/3$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular o simplificar el valor de cada razón por separado.'
- 'Paso 2: Comprobar la igualdad entre ambos resultados.'
- 'Paso 3: Escribir la proporción $\frac{a}{b} = \frac{c}{d}$.'
errores_correccion: No sumes los términos para verificar si son iguales. Compara sus
  cocientes o multiplica cruzado.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\frac{1}{2} = \frac{5}{10}$ una proporción?
  alternativas:
  - Sí
  - 'No'
  respuesta: Sí
  solucion_pasos:
  - Ambas razones valen 0,5.
errores_frecuentes:
- Confundir una suma de fracciones con una proporción.
afirmaciones_verdaderas:
- Una proporción es la igualdad entre dos razones.
al_terminar_debes_ponder: Definir e identificar proporciones numéricas.
fuente: Texto escolar MINEDUC.
estado: publicado
