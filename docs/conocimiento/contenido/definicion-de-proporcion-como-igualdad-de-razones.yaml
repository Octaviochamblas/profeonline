semantic_id: MAT.NUM.RAZONES_PROPORCIONES.PROPORCION_DEFINICION
resumen_inicial: 'Una proporción es la igualdad entre dos razones que poseen el mismo valor numérico $k$: $\frac{a}{b} = \frac{c}{d}$ (con $b, d \neq 0$), denotada también como $a : b = c : d$ («a es a b como c es a d»).'
explicacion_simple: '![Definición de proporción](/static/img/nodos/definicion-de-proporcion-como-igualdad-de-razones-intro.svg)


  Una **proporción** es simplemente una **igualdad entre dos razones que valen lo mismo**:

  - Se escribe $\frac{a}{b} = \frac{c}{d}$ o bien $a : b = c : d$.

  - Se lee: **«$a$ es a $b$ como $c$ es a $d$»**.

  - Por ejemplo, las razones $\frac{6}{8}$ y $\frac{15}{20}$ forman una proporción porque ambas equivalen a $0,75$ (o $\frac{3}{4}$).

  - Para que exista una proporción, los dos cocientes deben dar **exactamente el mismo valor $k$**.'
explicacion_formal: "Sean $a, b, c, d \\in \\mathbb{R}$ con $b \\neq 0$ y $d \\neq 0$. Se define una **proporción geométrica** como la igualdad entre dos razones:\n\n$$\\frac{a}{b} = \\frac{c}{d} = k \\iff a : b = c : d$$\n\ndonde:\n- $a, d$: son los **términos extremos** (primero y cuarto término).\n- $b, c$: son los **términos medios** (segundo y tercer término).\n- $k$: es la **constante de proporcionalidad** común ($k \\in \\mathbb{R}$).\n\n**Tipos de Proporciones:**\n1. **Proporción discreta**: Los cuatro términos son distintos entre sí ($a \\neq b \\neq c \\neq d$).\n2. **Proporción continua**: Los términos medios son iguales entre sí ($\frac{a}{b} = \frac{b}{c}$)."
definiciones_clave: "- **Proporción ($\frac{a}{b} = \frac{c}{d}$)**: Igualdad de dos razones equivalentes.\n- **Términos de la proporción**: $a$ (1°), $b$ (2°), $c$ (3°), $d$ (4°).\n- **Proporción discreta**: Proporción con 4 términos diferentes.\n- **Proporción continua**: Proporción con términos medios iguales ($\frac{a}{b} = \frac{b}{c}$)."
propiedades_relaciones: '- **Existencia de constante**: $\frac{a}{b} = k$ y $\frac{c}{d} = k$.

  - **Inversión**: Si $\frac{a}{b} = \frac{c}{d}$, entonces $\frac{b}{a} = \frac{d}{c}$ ($a, c \neq 0$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de definición de proporción](/static/img/nodos/definicion-de-proporcion-como-igualdad-de-razones-ejemplos.svg)


    Compruebe si las razones $\frac{6}{8}$ y $\frac{15}{20}$ forman una proporción, y determine si $\frac{4}{6}$ y $\frac{5}{7}$ constituyen una proporción válida.'
  pasos:
  - 'Paso 1: Para el primer par: Calcular $k_1 = \frac{6}{8} = \frac{3}{4} = 0,75$.'
  - 'Paso 2: Calcular $k_2 = \frac{15}{20} = \frac{3}{4} = 0,75$. Como $k_1 = k_2 = 0,75$, sí forman una proporción.'
  - 'Paso 3: Para el segundo par: $k_1 = \frac{4}{6} = 0,\overline{6}$ y $k_2 = \frac{5}{7} \approx 0,714$.'
  - 'Paso 4: Como $k_1 \neq k_2$, no forman una proporción.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cómo se lee formalmente la proporción $2 : 3 = 8 : 12$?'
  choices:
  - text: «2 es a 3 como 8 es a 12»
    is_correct: true
  - text: «2 por 3 es igual a 8 por 12»
    is_correct: false
  - text: «2 dividido en 3 más 8 dividido en 12»
    is_correct: false
  - text: «3 es a 2 como 12 es a 8»
    is_correct: false
  explanation: La alternativa correcta es '«2 es a 3 como 8 es a 12»'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\frac{6}{8} = \frac{15}{20}$ es una proporción verdadera?
  choices:
  - text: Porque ambas razones tienen exactamente el mismo valor de la razón k = 0,75
    is_correct: true
  - text: Porque todos los números involucrados son pares
    is_correct: false
  - text: Porque la suma de los numeradores es igual a 21
    is_correct: false
  - text: Porque 20 es múltiplo de 8
    is_correct: false
  explanation: La alternativa correcta es 'Porque ambas razones tienen exactamente el mismo valor de la razón k = 0,75'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el valor numérico $k_1 = a \div b$ de la primera razón.'
- 'Paso 2: Calcular el valor numérico $k_2 = c \div d$ de la segunda razón.'
- 'Paso 3: Comparar ambos resultados: si $k_1 = k_2$, la igualdad $\frac{a}{b} = \frac{c}{d}$ es una proporción legítima.'
errores_correccion: '- **Error 1: Afirmar que es proporción solo porque los números se ven parecidos.** **Cómo corregirlo:** Se DEBEN simplificar ambas fracciones o verificar la igualdad de sus cocientes decimales.

  - **Error 2: Cambiar el orden de los términos.** **Cómo corregirlo:** La igualdad exige respetar la correspondencia entre antecedentes y consecuentes.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Forman una proporción las razones $\frac{10}{15}$ y $\frac{14}{21}$?
  alternativas:
  - Sí, ambas simplifican a 2/3
  - No, los números son distintos
  - No, una tiene números pares y otra impares
  respuesta: Sí, ambas simplifican a 2/3
  solucion_pasos:
  - $\frac{10}{15} = \frac{2}{3}$ y $\frac{14}{21} = \frac{2}{3}$. Como $k_1 = k_2 = \frac{2}{3}$, sí forman proporción.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de las siguientes igualdades es una proporción verdadera?
  alternativas:
  - '$3 : 4 = 9 : 12$'
  - '$2 : 5 = 4 : 15$'
  - '$1 : 3 = 3 : 6$'
  respuesta: '$3 : 4 = 9 : 12$'
  solucion_pasos:
  - $\frac{3}{4} = 0,75$ y $\frac{9}{12} = 0,75$.
- titulo: ¿Es una proporción la igualdad entre dos razones con igual valor k?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición matemática de proporción geométrica.
  alternativas:
  - texto: Sí, la igualdad de dos razones equivalentes define una proporción
    es_correcta: true
    retroalimentacion: ¡Correcto! Definición fundamental.
  - texto: No, debe ser una suma
    es_correcta: false
    retroalimentacion: Incorrecto, la proporción iguala razones (cocientes).
  - texto: No, requiere que todos los términos sean primos
    es_correcta: false
    retroalimentacion: Incorrecto, no existe restricción de primalidad.
- titulo: '¿Es 2 : 3 = 4 : 5 una proporción verdadera?'
  respuesta: 'No'
  solucion_pasos:
  - No, $2/3 = 0,\overline{6} \neq 4/5 = 0,8$.
  alternativas:
  - texto: No, porque 2/3 no es igual a 4/5
    es_correcta: true
    retroalimentacion: ¡Correcto! Los valores de razón no coinciden.
  - texto: Sí, porque 4 es el doble de 2
    es_correcta: false
    retroalimentacion: Incorrecto, el consecuente 5 no es el doble de 3.
  - texto: Sí, porque todos son enteros positivos
    es_correcta: false
    retroalimentacion: Incorrecto, la igualdad es matemáticamente falsa.
errores_frecuentes:
- Confundir una proporción con una simple fracción.
- Asumir que una igualdad de razones es cierta sin calcular su constante $k$.
- Permitir denominadores iguales a cero en la proporción.
- Invertir una sola razón manteniendo la otra sin invertir.
afirmaciones_verdaderas:
- Una proporción es la igualdad entre dos razones que poseen el mismo valor $k$.
- En la proporción $\frac{a}{b} = \frac{c}{d}$, los términos $b$ y $d$ deben ser no nulos.
- La proporción se lee formalmente «$a$ es a $b$ como $c$ es a $d$».
al_terminar_debes_poder: '![Síntesis de proporción](/static/img/nodos/definicion-de-proporcion-como-igualdad-de-razones-resumen.svg)


  QUÉ: Comprender y formular proporciones matemáticas como igualdad de dos razones equivalentes.


  CÓMO: Verificando la igualdad de los cocientes $\frac{a}{b} = \frac{c}{d} = k$ o expresándola en notación verbal $a : b = c : d$ con denominadores no nulos.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
estado: publicado
