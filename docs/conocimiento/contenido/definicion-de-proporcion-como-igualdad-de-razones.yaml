semantic_id: MAT.NUM.PROPORCIONES.DEFINICION_IGUALDAD_RAZONES
resumen_inicial: 'Una proporción es la igualdad matemática entre dos razones equivalentes, expresada como $\frac{a}{b} = \frac{c}{d}$ o $a : b = c : d$ ($b, d \neq 0$).'
explicacion_simple: |
  Una proporción se forma cuando dos razones distintas tienen exactamente el mismo valor de la razón. Se lee *" $a$ es a $b$ como $c$ es a $d$ "*. Por ejemplo, la razón $\frac{2}{4}$ da $0.5$ y la razón $\frac{5}{10}$ también da $0.5$. Al igualarlas, creas la proporción $\frac{2}{4} = \frac{5}{10}$. Esto indica que las dos parejas de cantidades se comportan exactamente bajo la misma relación de escala.
explicacion_formal: |
  ### Definición formal
  Una **proporción geométrica** es una igualdad formal establecida entre dos razones geométricas $\frac{a}{b}$ y $\frac{c}{d}$:
  $$\frac{a}{b} = \frac{c}{d} \quad \iff \quad a : b = c : d \quad (b, d \neq 0)$$

  ### Componentes de una proporción
  - **Términos extremos**: Las cantidades del primer y último lugar ($a$ y $d$).
  - **Términos medios**: Las cantidades de los lugares intermedios ($b$ y $c$).
  - **Constante de proporcionalidad ($k$)**: El valor cociente común $k = \frac{a}{b} = \frac{c}{d}$.

  ### Teorema Fundamental de las Proporciones (Producto cruzado)
  Dos razones forman una proporción si y solo si el producto de sus extremos es igual al producto de sus medios:
  $$\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$$

  ### Síntesis didáctica
  - Igualdad de razones: $\frac{a}{b} = \frac{c}{d}$.
  - Condición de validez: $a \cdot d = b \cdot c$.
definiciones_clave: |
  - **Proporción matemática**: Igualdad formal entre dos razones equivalentes $\frac{a}{b} = \frac{c}{d}$.
  - **Lectura "$a$ es a $b$ como $c$ es a $d$"**: Verbalización canónica de la igualdad de razones $a : b = c : d$.
  - **Constante de la proporción $k$**: Escalar real $k$ común que satisface $\frac{a}{b} = k$ y $\frac{c}{d} = k$.
propiedades_relaciones: |
  - **Inversión de razones**: Si $\frac{a}{b} = \frac{c}{d}$, entonces $\frac{b}{a} = \frac{d}{c}$.
  - **Permutación de términos**:
    - Permutación de medios: $\frac{a}{c} = \frac{b}{d}$.
    - Permutación de extremos: $\frac{d}{b} = \frac{c}{a}$.
ejemplo_guiado:
  enunciado: 'Verifica mediante la regla de los valores de razón si la pareja de fracciones $\frac{6}{8}$ y $\frac{15}{20}$ forma una proporción verdadera.'
  pasos:
    - 'Paso 1: Calculamos el valor de la primera razón dividiendo el antecedente por el consecuente: $k_1 = 6 \div 8 = 0.75$.'
    - 'Paso 2: Calculamos el valor de la segunda razón dividiendo sus componentes: $k_2 = 15 \div 20 = 0.75$.'
    - 'Paso 3: Comparamos ambos valores obtenidos: Como $k_1 = k_2 = 0.75$, ambas razones poseen el mismo valor.'
    - 'Paso 4: Conclusión: La igualdad $\frac{6}{8} = \frac{15}{20}$ es una **proporción verdadera**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la condición matemática fundamental para que dos razones $\frac{a}{b}$ y $\frac{c}{d}$ formen una proporción?'
    choices:
      - {text: 'Que el producto de los extremos sea igual al producto de los medios ($a \cdot d = b \cdot c$)', is_correct: true}
      - {text: 'Que las cuatro cantidades sumadas den un número par', is_correct: false}
      - {text: 'Que los numeradores sean iguales entre sí ($a = c$)', is_correct: false}
      - {text: 'Que la resta de las fracciones sea igual a 1', is_correct: false}
    explanation: 'La alternativa correcta es ''Que el producto de los extremos sea igual al producto de los medios ($a \cdot d = b \cdot c$)''. Es el Teorema Fundamental de las Proporciones.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál de los siguientes pares de razones constituye una proporción verdadera?'
    choices:
      - {text: '$\frac{3}{5} = \frac{12}{20}$, pues $3 \cdot 20 = 5 \cdot 12 = 60$', is_correct: true}
      - {text: '$\frac{2}{3} = \frac{4}{9}$, porque $2 \cdot 9 \neq 3 \cdot 4$', is_correct: false}
      - {text: '$\frac{1}{2} = \frac{3}{8}$, porque las sumas dan diferente', is_correct: false}
      - {text: '$\frac{5}{10} = \frac{2}{5}$, por multiplicar por dos', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{3}{5} = \frac{12}{20}$, pues $3 \cdot 20 = 5 \cdot 12 = 60$''. Verificamos el producto cruzado $3 \cdot 20 = 60$ y $5 \cdot 12 = 60$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos razones $\frac{a}{b}$ y $\frac{c}{d}$ que se desean evaluar.'
  - 'Paso 2: Calcular el valor de la primera razón $k_1 = \frac{a}{b}$ y de la segunda $k_2 = \frac{c}{d}$.'
  - 'Paso 3: Multiplicar en cruz los términos extremos $a \cdot d$ y los términos medios $b \cdot c$.'
  - 'Paso 4: Confirmar la igualdad $a \cdot d = b \cdot c$ para declarar la existencia de la proporción.'
errores_correccion: |
  - **Error 1:** Afirmar que dos razones forman una proporción porque sus numeradores o denominadores son iguales sin verificar la igualdad del cociente. **Cómo corregirlo:** La proporción exige la **igualdad de los cocientes** $a/b = c/d$ o la igualdad de los **productos cruzados** $a \cdot d = b \cdot c$.
  - **Error 2:** Sumar en cruz en lugar de multiplicar en cruz para verificar la proporción (ej: $a + d = b + c$). **Cómo corregirlo:** La regla fundamental exige la **multiplicación de extremos e iguales**: $a \cdot d = b \cdot c$.
ejemplos:
  - titulo: 'Verificación por producto cruzado'
    enunciado: '¿La igualdad $\frac{4}{10} = \frac{10}{25}$ es una proporción verdadera?'
    alternativas:
      - 'Sí, pues $4 \cdot 25 = 10 \cdot 10 = 100$'
      - 'No, es falsa'
      - 'No, las fracciones son distintas'
    respuesta: 'Sí, pues $4 \cdot 25 = 10 \cdot 10 = 100$'
    solucion_pasos:
      - '1. Extremos: $4 \cdot 25 = 100$.'
      - '2. Medios: $10 \cdot 10 = 100 \implies$ Proporción verdadera.'
  - titulo: 'Constante común de razón'
    enunciado: '¿Las razones $\frac{8}{12}$ y $\frac{10}{15}$ forman una proporción con constante $k = 2/3$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Ambas razones se simplifican a $2/3$.'
  - titulo: 'Inversión de proporción'
    enunciado: 'Si $\frac{a}{b} = \frac{c}{d}$ es una proporción, ¿la igualdad $\frac{b}{a} = \frac{d}{c}$ también es una proporción válida?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por la propiedad de inversión de razones.'
  - titulo: 'Proporción no válida'
    enunciado: '¿La relación $\frac{2}{5} = \frac{4}{8}$ forma una proporción?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. $2 \cdot 8 = 16 \neq 5 \cdot 4 = 20$.'
errores_frecuentes:
  - 'Sumar en cruz los términos de las razones en lugar de aplicar el producto de extremos y medios.'
  - 'Declarar que dos razones forman una proporción evaluando únicamente la diferencia entre términos.'
  - 'Invertir la posición de un solo miembro de la igualdad desajustando la proporción.'
  - 'Las cuatro cantidades $a, b, c, d$ de una proporción deben ser estrictamente números enteros del mismo signo.'
  - 'Utilizar denominadores nulos al construir expresiones proporcionales.'
afirmaciones_verdaderas:
  - 'Una proporción es la igualdad matemática entre dos razones equivalentes $\frac{a}{b} = \frac{c}{d}$ con $b, d \neq 0$.'
  - 'El Teorema Fundamental de las Proporciones establece que dos razones forman una proporción si y solo si el producto de sus extremos es igual al producto de sus medios ($a \cdot d = b \cdot c$).'
al_terminar_debes_poder: 'Definir e identificar proporciones equivalentes aplicando el criterio de producto cruzado $a \cdot d = b \cdot c$.'
