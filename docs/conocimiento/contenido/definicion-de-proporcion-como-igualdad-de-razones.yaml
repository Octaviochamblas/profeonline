resumen_inicial: 'Una proporción es la igualdad entre dos razones: $\frac{a}{b} =
  \frac{c}{d}$ o $a : b = c : d$, expresando que ambas razones tienen el mismo valor
  escalar $k$.'
explicacion_simple: Una proporción se forma cuando dos razones distintas dan exactamente
  el mismo resultado al dividirse. Por ejemplo, $2/4$ es igual a $3/6$ porque ambas
  simplificadas dan $1/2$, formando una proporción perfecta que se lee 'a es a b como
  c es a d'.
explicacion_formal: 'Para todo $a, c \in \mathbb{R}$ y $b, d \in \mathbb{R} \setminus
  \{0\}$, la **Proporción Fundamental** se define mediante la equivalencia entre dos
  razones:


  $$\frac{a}{b} = \frac{c}{d} \iff a : b = c : d = k$$


  **Criterio de existencia de proporción:**

  Cuatro cantidades forman una proporción si y solo si la constante de la primera
  razón $k_1 = \frac{a}{b}$ coincide exactamente con la constante de la segunda razón
  $k_2 = \frac{c}{d}$.'
definiciones_clave: '- **Proporción**: Igualdad de razones $\frac{a}{b} = \frac{c}{d}$
  con $b, d \neq 0$.'
propiedades_relaciones: '- **Equivalencia de cocientes**: $\frac{a}{b} = \frac{c}{d}
  = k$.'
ejemplo_guiado:
  enunciado: Verifique si las razones $\frac{6}{8}$ y $\frac{15}{20}$ forman una proporción
    válida.
  pasos:
  - 'Paso 1: Simplificar la primera razón: $\frac{6:2}{8:2} = \frac{3}{4} = 0,75$.'
  - 'Paso 2: Simplificar la segunda razón: $\frac{15:5}{20:5} = \frac{3}{4} = 0,75$.'
  - 'Paso 3: Comparar valores: como $0,75 = 0,75$, forman una proporción.'
  - 'Conclusión: La igualdad $\frac{6}{8} = \frac{15}{20}$ es una proporción válida.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se define formalmente una proporción a/b = c/d?
  choices:
  - text: Como la igualdad entre dos razones que poseen el mismo valor de la razón
      k
    is_correct: true
  - text: Como la resta a - b = c - d
    is_correct: false
  - text: Como el producto a · b = c · d
    is_correct: false
  - text: Como la suma de cuatro números
    is_correct: false
  explanation: La alternativa correcta es 'Como la igualdad entre dos razones que
    poseen el mismo valor de la razón k'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 6/8 y 15/20, ¿cuál fue la constante k que confirmó
    la proporción?
  choices:
  - text: 0,75 (o 3/4)
    is_correct: true
  - text: 1,5
    is_correct: false
  - text: '2'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: La alternativa correcta es '0,75 (o 3/4)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir e identificar proporciones
  $\frac{a}{b} = \frac{c}{d}$, verificando la igualdad del valor escalar de ambas
  razones.
semantic_id: MAT.NUM.PROPORCIONES.DEFINICION_IGUALDAD_RAZONES
procedimiento:
- 'Paso 1: Identificar los términos extremos $(a, d)$ y medios $(b, c)$ en la proporción
  $a/b = c/d$.'
- 'Paso 2: Aplicar la propiedad o regla requerida (producto cruzado, cuarta/media/tercera
  proporcional o composición/descomposición).'
- 'Paso 3: Resolver algebraicamente y verificar la igualdad de las razones resultantes.'
errores_correccion: '- **Error 1: Multiplicar numeradores con numeradores en lugar
  del producto cruzado ($a \cdot c = b \cdot d$).** **Cómo corregirlo:** El producto
  cruzado combina EXTREMOS con MEDIOS ($a \cdot d = b \cdot c$).


  - **Error 2: Confundir la media proporcional con la media aritmética (promedio).**
  **Cómo corregirlo:** La media proporcional es una media GEOMÉTRICA ($x = \sqrt{ab}$),
  no un promedio sumar/dividir.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROPORCIONES.DEFINICION_IGUALDAD_RAZONES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de proporciones.
- titulo: Ejemplo 2
  enunciado: Verificación de igualdad cruzada.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración por producto cruzado a · d = b · c.
- titulo: ¿Es a · d = b · c válido para toda proporción?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema Fundamental de las Proporciones.
- titulo: ¿Permite la composición mantener la equivalencia de razones?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(a+b)/b = (c+d)/d$ conserva la razón equivalente.
errores_frecuentes:
- Multiplicar los numeradores entre sí al aplicar la prueba del producto cruzado en
  una proporción.
- Declarar la posición de los términos medios con los términos extremos en una proporción
  escrita en fila.
- Calcular la media proporcional utilizando el promedio aritmético sumar y dividir
  entre dos.
- Invertir únicamente uno de los dos lados de la igualdad al aplicar la composición
  proporcional.
- Restar los términos extremos en lugar de despejar la cuarta proporcional por división.
afirmaciones_verdaderas:
- Una proporción es la igualdad entre dos razones $\frac{a}{b} = \frac{c}{d}$ que
  satisface el producto cruzado $a \cdot d = b \cdot c$.
- La media proporcional entre dos números positivos $a$ y $b$ equivale a su media
  geométrica $x = \sqrt{a \cdot b}$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
