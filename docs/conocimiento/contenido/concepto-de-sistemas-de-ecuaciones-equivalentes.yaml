semantic_id: MAT.ALG.SISTEMAS_2X2.SISTEMAS_EQUIVALENTES
resumen_inicial: Dos sistemas de ecuaciones son equivalentes si poseen exactamente el mismo conjunto solución.
explicacion_simple: |
  Decimos que dos sistemas de ecuaciones $2 \times 2$ son **equivalentes** cuando comparten de forma idéntica las mismas respuestas o pares ordenados $(x, y)$.

  Podemos generar un sistema equivalente a otro aplicando transformaciones válidas: multiplicando una ecuación completa por un número no nulo (por ejemplo, duplicar todos los términos de la primera ecuación) o sumando una ecuación con un múltiplo de la otra.

  Todas las técnicas algebraicas de resolución (reducción, sustitución e igualación) consisten en transformar un sistema complejo en un sistema equivalente más simple.
explicacion_formal: |
  ### Definición formal
  Sean dos sistemas lineales $S_1$ y $S_2$. Se define la relación de **equivalencia entre sistemas** ($S_1 \sim S_2$) si y solo si sus conjuntos solución coinciden:

  $$\operatorname{CS}(S_1) = \operatorname{CS}(S_2)$$

  ### Operaciones de equivalencia permitidas (Transformaciones de Gauss)
  1. Multiplicar o dividir ambos miembros de una ecuación por un escalar constante no nulo $k \neq 0$.
  2. Intercambiar el orden de las ecuaciones dentro del sistema.
  3. Reemplazar una ecuación por la suma de ella misma con un múltiplo constante de la otra ecuación.

  ### Síntesis didáctica
  Las transformaciones equivalentes modifican la apariencia formal de los coeficientes pero preservan inalterado el punto de intersección $(x_0, y_0)$.
definiciones_clave: |
  - **Sistemas de ecuaciones equivalentes**: Estructuras algebraicas de ecuaciones que comparten rigurosamente el mismo conjunto solución $\operatorname{CS}$.
  - **Transformaciones equivalentes**: Operaciones algebraicas elementales que no introducen ni eliminan soluciones en el sistema.
propiedades_relaciones: |
  - **Fundamento del álgebra lineal**: El proceso de resolución mediante reducción transforma un sistema general en uno triangular equivalente de fácil resolución.
  - **Preservación del punto de intersección**: Gráficamente, multiplicar las ecuaciones por escalares genera las mismas rectas cartesianas.
ejemplo_guiado:
  enunciado: 'Demuestra que el sistema $S_1: \begin{cases} x + y = 5 \\ x - y = 1 \end{cases}$ y el sistema $S_2: \begin{cases} 2x + 2y = 10 \\ x - y = 1 \end{cases}$ son equivalentes verificando el conjunto solución de ambos.'
  pasos:
    - 'Paso 1: Notar que la primera ecuación de $S_2$ proviene de multiplicar por $2$ ambos miembros de la primera ecuación de $S_1$: $2(x+y) = 2(5) \implies 2x + 2y = 10$.'
    - 'Paso 2: Resolver $S_1$ sumando ambas ecuaciones: $(x + y) + (x - y) = 5 + 1 \implies 2x = 6 \implies x = 3$.'
    - 'Paso 3: Sustituir $x = 3$ en $x + y = 5 \implies 3 + y = 5 \implies y = 2$, obteniendo la solución $(3, 2)$.'
    - 'Paso 4: Comprobar el par $(3, 2)$ en $S_2$: $2(3) + 2(2) = 6 + 4 = 10$ y $3 - 2 = 1$, confirmando $\operatorname{CS}(S_1) = \operatorname{CS}(S_2) = \{(3, 2)\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición matemática define a dos sistemas de ecuaciones lineales como equivalentes?'
    choices:
      - {text: 'Que ambos poseen exactamente el mismo conjunto solución $\operatorname{CS}$.', is_correct: true}
      - {text: 'Que todos sus coeficientes numéricos son números primos iguales.', is_correct: false}
      - {text: 'Que ambos sistemas entregan exclusivamente soluciones negativas.', is_correct: false}
      - {text: 'Que la suma de los términos constantes del segundo miembro da cero.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que ambos poseen exactamente el mismo conjunto solución $\operatorname{CS}$.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al amplificar la ecuación $x + y = 5$ por $2$ se obtiene $2x + 2y = 10$. ¿Se altera el conjunto solución del sistema?'
    choices:
      - {text: 'No, genera un sistema totalmente equivalente con la misma solución $(3, 2)$.', is_correct: true}
      - {text: 'Sí, la solución se duplica numéricamente a $(6, 4)$.', is_correct: false}
      - {text: 'Sí, el sistema se transforma en una estructura sin solución.', is_correct: false}
      - {text: 'Sí, la solución se desplaza al origen $(0, 0)$.', is_correct: false}
    explanation: 'La alternativa correcta es ''No, genera un sistema totalmente equivalente con la misma solución $(3, 2)$.''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Resolver el sistema de ecuaciones original $S_1$ para determinar su conjunto solución $\operatorname{CS}(S_1)$.'
  - 'Paso 2: Aplicar una transformación equivalente (amplificación por escalar $k \neq 0$ o combinación lineal).'
  - 'Paso 3: Estructurar el nuevo sistema transformado $S_2$.'
  - 'Paso 4: Resolver o verificar el par ordenado en $S_2$ comprobando que $\operatorname{CS}(S_1) = \operatorname{CS}(S_2)$.'
errores_correccion: |
  - **Error 1:** Multiplicar únicamente los coeficientes de las variables en el primer miembro y olvidar multiplicar la constante del segundo miembro. **Cómo corregirlo:** Para mantener la equivalencia, **DEBEN MULTIPLICARSE AMBOS MIEMBROS DE LA ECUACIÓN POR EL ESCALAR $k$ ($k(a x + b y) = k \cdot c$)**.
  - **Error 2:** Multiplicar una ecuación por cero ($k = 0$) para eliminarla. **Cómo corregirlo:** La amplificación **EXIGE UN ESCALAR ESTRICTAMENTE DISTINTO DE CERO ($k \neq 0$) PARA NO PERDER INFORMACIÓN DEL SISTEMA**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿El sistema $\begin{cases} 3x + 3y = 15 \\ x - y = 1 \end{cases}$ es equivalente a $\begin{cases} x + y = 5 \\ x - y = 1 \end{cases}$?'
    alternativas:
      - 'Sí, pues la primera ecuación fue dividida por 3 conservando la solución $(3, 2)$'
      - 'No, las soluciones cambian al dividir por 3'
      - 'No, el conjunto solución queda indeterminado'
    respuesta: 'Sí, pues la primera ecuación fue dividida por 3 conservando la solución $(3, 2)$'
    solucion_pasos:
      - '1. Dividir la primera por 3: $x + y = 5$.'
      - '2. El sistema resultante es idéntico al original, por lo que son equivalentes.'
  - titulo: 'Ejemplo 2'
    enunciado: '¿Qué operación transforma $x - y = 4$ en la ecuación equivalente $3x - 3y = 12$?'
    alternativas:
      - 'Multiplicar ambos miembros por 3'
      - 'Sumar 3 a ambos miembros'
      - 'Dividir por 3 ambos miembros'
    respuesta: 'Multiplicar ambos miembros por 3'
    solucion_pasos:
      - '1. $3 \cdot (x - y) = 3 \cdot 4 \implies 3x - 3y = 12$.'
  - titulo: 'Operaciones de Gauss'
    enunciado: '¿Sumar a una ecuación el múltiplo constante de otra genera un sistema equivalente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la base del método de reducción.'
  - titulo: 'Escalar no nulo'
    enunciado: '¿Multiplicar una ecuación por un escalar $k \neq 0$ preserva las soluciones del sistema?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la propiedad de equivalencia de ecuaciones.'
errores_frecuentes:
  - 'Multiplicar los coeficientes del primer miembro sin multiplicar la constante del segundo miembro.'
  - 'Multiplicar una ecuación por cero destruyendo la relación algebraica.'
  - 'Asumir que si los coeficientes cambian de número la solución también debe cambiar.'
  - 'Confundir sistemas equivalentes con ecuaciones dependientes coincidentes.'
  - 'Olvidar la restricción $k \neq 0$ al amplificar o simplificar ecuaciones.'
afirmaciones_verdaderas:
  - 'Dos sistemas de ecuaciones son equivalentes cuando comparten de forma idéntica su conjunto solución.'
  - 'Multiplicar ambos miembros de una ecuación lineal por una constante distinta de cero produce una ecuación equivalente.'
al_terminar_debes_poder: |
  QUÉ: Reconocer y construir sistemas de ecuaciones lineales 2x2 equivalentes.
  CÓMO: Aplicar transformaciones equivalentes (amplificación por $k \neq 0$, combinación lineal) y verificar que ambos sistemas comparten el mismo conjunto solución $\operatorname{CS}$.
