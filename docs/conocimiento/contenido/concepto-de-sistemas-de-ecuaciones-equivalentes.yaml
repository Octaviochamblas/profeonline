semantic_id: MAT.ALG.SISTEMAS_2X2.SISTEMAS_EQUIVALENTES
resumen_inicial: Dos sistemas son equivalentes si poseen exactamente el mismo conjunto
  solución.
explicacion_simple: 'Decimos que dos sistemas de ecuaciones son **equivalentes** si
  tienen exactamente las mismas respuestas para $(x, y)$.

  Podemos obtener un sistema equivalente multiplicando una ecuación completa por un
  número (por ejemplo, duplicar toda la primera ecuación) o sumando una ecuación con
  otra.'
explicacion_formal: 'Sean los sistemas $S_1$ y $S_2$. Son **sistemas equivalentes**
  ($S_1 \sim S_2$) si y solo si:


  $$\operatorname{CS}(S_1) = \operatorname{CS}(S_2)$$


  **Operaciones de equivalencia permitidas:**

  1. Multiplicar o dividir una ecuación por un escalar $k \neq 0$.

  2. Intercambiar la posición de las ecuaciones.

  3. Sumar a una ecuación el múltiplo de otra ecuación.'
definiciones_clave: '- **Sistemas equivalentes**: Sistemas que comparten el mismo
  conjunto solución.

  - **Transformaciones equivalentes**: Operaciones algebraicas que preservan el conjunto
  solución.'
propiedades_relaciones: '- **Fundamento de los métodos algebraicos**: La reducción,
  sustitución e igualación se basan en construir sistemas equivalentes más sencillos.'
ejemplo_guiado:
  enunciado: 'Demuestra que el sistema $S_1: \begin{cases} x + y = 5 \\ x - y = 1
    \end{cases}$ y el sistema $S_2: \begin{cases} 2x + 2y = 10 \\ x - y = 1 \end{cases}$
    son equivalentes hallando el conjunto solución de ambos.'
  pasos:
  - 'Paso 1: Notar que la primera ecuación de $S_2$ es la primera ecuación de $S_1$
    multiplicada por $2$ ($2(x+y) = 2(5) \implies 2x + 2y = 10$).'
  - 'Paso 2: Sumar las ecuaciones de $S_1$: $(x + y) + (x - y) = 5 + 1 \implies 2x
    = 6 \implies x = 3$.Paso 3: Sustituir $x = 3$ en $x + y = 5 \implies 3 + y = 5
    \implies y = 2$.Paso 4: Verificar que el conjunto solución para ambos sistemas
    es el mismo par $S = \{(3, 2)\}$, demostrando que $S_1 \sim S_2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué propiedad define a dos sistemas de ecuaciones como equivalentes?
  choices:
  - text: Que comparten exactamente el mismo conjunto solución $S$.
    is_correct: true
  - text: Que sus coeficientes son todos números primos.
    is_correct: false
  - text: Que ambos tienen soluciones negativas.
    is_correct: false
  - text: Que la suma de sus constantes es cero.
    is_correct: false
  explanation: La alternativa correcta es 'Que comparten exactamente el mismo conjunto
    solución $S$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al multiplicar la ecuación $x + y = 5$ por $2$, se obtiene $2x + 2y =
    10$. ¿Cambia esto el conjunto solución del sistema?
  choices:
  - text: No, produce un sistema totalmente equivalente con la misma solución $(3,
      2)$.
    is_correct: true
  - text: Sí, la solución se duplica a $(6, 4)$.
    is_correct: false
  - text: Sí, el sistema se vuelve indeterminado.
    is_correct: false
  - text: Sí, la solución pasa a ser $(0, 0)$.
    is_correct: false
  explanation: La alternativa correcta es 'No, produce un sistema totalmente equivalente
    con la misma solución $(3, 2)$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver el primer sistema de ecuaciones $S_1$.'
- 'Paso 2: Resolver el segundo sistema de ecuaciones $S_2$.'
- 'Paso 3: Comparar los conjuntos solución obtendidos.'
- 'Paso 4: Si $\operatorname{CS}(S_1) = \operatorname{CS}(S_2)$, declarar los sistemas
  como equivalentes.'
errores_correccion: '- **Error común:** Multiplicar solo las variables de una ecuación
  y olvidar multiplicar el término constante del segundo miembro.

  - **Cómo corregirlo:** Al multiplicar una ecuación por $k$, DEBES multiplicar el
  primer y el segundo miembro.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas 2x2.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas 2x2.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución de un sistema 2x2 debe satisfacer ambas ecuaciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la definición de solución de un sistema de ecuaciones.
- titulo: ¿La regla de Cramer requiere que el determinante del sistema sea distinto
    de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división entre cero.
errores_frecuentes:
- Verificar la solución $(x, y)$ únicamente en la primera ecuación del sistema.
- Sustituir la expresión despejada en la misma ecuación de donde fue extraída al usar
  sustitución.
- Despejar variables distintas en cada ecuación antes de aplicar el método de igualación.
- Multiplicar solo el primer miembro al aplicar reducción olvidando el término constante.
- Calcular el determinante $2 \times 2$ sumando las diagonales en lugar de restarlas.
afirmaciones_verdaderas:
- Un sistema de ecuaciones 2x2 tiene como solución el par ordenado que satisface simultáneamente
  ambas ecuaciones.
- El método de reducción elimina una de las variables sumando combinaciones lineales
  de las ecuaciones.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver, verificar y modelar
  sistemas de ecuaciones lineales 2x2 mediante los métodos algebraicos y matriciales.
