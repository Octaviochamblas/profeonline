procedimiento:
- Elige una ecuación del sistema.
- Multiplica cada término (lado izquierdo y lado derecho) por la misma constante.
- La nueva ecuación es matemáticamente equivalente a la original y puedes usarla para
  reemplazarla en el sistema.
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en concepto de sistemas de ecuaciones equivalentes.
ejemplos:
- titulo: $2x + y = 5$ y $6x + 3y = 15$
  enunciado: Justifica el procedimiento adecuado para el caso $2x + y = 5$ y $6x +
    3y = 15$.
  solucion_pasos:
  - 'Imagina una ecuación como una receta: ''2 manzanas y 1 pera cuestan 5 dólares''
    ($2x + y = 5$).

    Si multiplicas toda la receta por 3: ''6 manzanas y 3 peras cuestan 15 dólares''
    ($6x + 3y = 15$).'
  - Elige una ecuación del sistema.
- titulo: $2x + y = 5$ y $6x + 3y = 15$
  enunciado: Determina qué debe hacerse en $2x + y = 5$ y $6x + 3y = 15$ y fundamenta
    cada transformación.
  solucion_pasos:
  - 'Imagina una ecuación como una receta: ''2 manzanas y 1 pera cuestan 5 dólares''
    ($2x + y = 5$).

    Si multiplicas toda la receta por 3: ''6 manzanas y 3 peras cuestan 15 dólares''
    ($6x + 3y = 15$).'
  - Multiplica cada término (lado izquierdo y lado derecho) por la misma constante.
