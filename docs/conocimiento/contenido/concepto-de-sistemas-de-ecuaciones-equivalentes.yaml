semantic_id: MAT.ALG.SISTEMAS_2X2.SISTEMAS_EQUIVALENTES
resumen_inicial: 'Concepto de sistemas de ecuaciones equivalentes: propiedades, resolución
  y modelamiento en Sistemas de ecuaciones lineales 2x2.'
explicacion_simple: Es exactamente la misma información, solo amplificada. A esto
  se le llama una ecuación equivalente.
explicacion_formal: '### Definición formal


  Dos sistemas de ecuaciones son equivalentes si tienen exactamente el mismo conjunto
  solución. En símbolos, si $S$ y $S''$ son sistemas, entonces

  $$S\equiv S'' \iff \operatorname{Sol}(S)=\operatorname{Sol}(S'').$$

  Cualquier transformación que conserve todas y solo las soluciones del sistema original
  produce un sistema equivalente. Entre ellas están reordenar ecuaciones, multiplicar
  una ecuación por una constante no nula o reemplazar una ecuación por una combinación
  lineal equivalente de las ecuaciones del sistema.


  ### Desarrollo didáctico


  Es exactamente la misma información, solo amplificada. A esto se le llama una ecuación
  equivalente.

  En los sistemas de ecuaciones, puedes tomar cualquiera de las ecuaciones, multiplicar
  todos sus términos por cualquier número (distinto de cero), y el sistema no cambiará
  sus soluciones. Esta es la base de casi todos los métodos de resolución.'
definiciones_clave: '- **Concepto de sistemas de ecuaciones equivalentes**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a concepto de sistemas de ecuaciones equivalentes.'
ejemplo_guiado:
