semantic_id: MAT.NUM.FACTORIZACION_PRIMA.METODO_TABLA
resumen_inicial: El método de la tabla realiza divisiones sucesivas entre primos hasta reducir el número a la unidad.
explicacion_simple: 'El método de la tabla es un procedimiento organizado en columnas para descomponer un número en primos. Escribimos el número a la izquierda, dividimos por el menor primo posible a la derecha, anotamos el cociente abajo y repetimos el proceso hasta llegar a 1.


  ![Factorización prima mediante tabla](/static/img/nodos/factorizacion-prima-mediante-tabla-intro.svg)'
explicacion_formal: 'El **Algoritmo de Divisiones Sucesivas en Tabla** genera la secuencia de cocientes $n_0, n_1, \dots, n_k$ y divisores primos $p_1, p_2, \dots, p_k$ tal que:


  $$n_0 = n, \quad n_i = \frac{n_{i-1}}{p_i} \quad \text{con } p_i = \min \{ p \in \text{Primos} \mid p \mid n_{i-1} \}$$


  **Desglose de la fórmula:**

  - Condición de parada: $n_k = 1$.

  - Reconstrucción de la descomposición: $n = \prod_{i=1}^k p_i$.


  > **Complemento didáctico:** La columna de la derecha contiene la lista completa de factores primos que al multiplicarse forman el número original.'
definiciones_clave: '- **Método de la tabla (divisiones sucesivas)**: Algoritmo vertical de división por primos menores hasta llegar al cociente 1.'
propiedades_relaciones: '- **Estructura algorítmica**: Garantiza no saltarse ningún factor primo al probar siempre desde el menor primo $2, 3, 5, \dots$'
ejemplo_guiado:
  enunciado: 'Descomponga el número $36$ en factores primos utilizando el método de la tabla.


    ![Ejemplo Factorización prima mediante tabla](/static/img/nodos/factorizacion-prima-mediante-tabla-ejemplos.svg)'
  pasos:
  - 'Paso 1: $36$ es divisible por 2: $36 : 2 = 18$ (anotar 2 a la derecha, 18 abajo).'
  - 'Paso 2: $18$ es divisible por 2: $18 : 2 = 9$ (anotar 2 a la derecha, 9 abajo).'
  - 'Paso 3: $9$ es divisible por 3: $9 : 3 = 3$ (anotar 3 a la derecha, 3 abajo).'
  - 'Paso 4: $3$ es divisible por 3: $3 : 3 = 1$ (anotar 3 a la derecha, 1 abajo). Proceso finalizado.'
  - 'Conclusión: La multiplicación de la columna derecha da $36 = 2 \cdot 2 \cdot 3 \cdot 3 = 2^2 \cdot 3^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuándo finaliza el procedimiento del método de la tabla de división por primos?
  choices:
  - text: Cuando el cociente de la izquierda llega a 1
    is_correct: true
  - text: Cuando se llega al número 0
    is_correct: false
  - text: Cuando se hacen 10 divisiones
    is_correct: false
  - text: Cuando se dividió por un número par
    is_correct: false
  explanation: La alternativa correcta es 'Cuando el cociente de la izquierda llega a 1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado con 36, ¿cuál fue la descomposición prima obtenida?
  choices:
  - text: 2^2 · 3^2
    is_correct: true
  - text: 2 · 3
    is_correct: false
  - text: 4 · 9
    is_correct: false
  - text: 6^2
    is_correct: false
  explanation: La alternativa correcta es '2^2 · 3^2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el número en la columna izquierda de la tabla.'
- 'Paso 2: Dividir por el menor primo que lo divida exactamente y anotar el primo a la derecha y el cociente abajo.'
- 'Paso 3: Repetir el proceso con los cocientes sucesivos hasta llegar al cociente final 1.'
errores_correccion: '- **Error 1: Dividir por números compuestos en la columna derecha (ej: poner un 4 o un 9).** **Cómo corregirlo:** La columna derecha debe contener ÚNICAMENTE números primos.


  - **Error 2: Detener la tabla antes de llegar al cociente 1.** **Cómo corregirlo:** La tabla finaliza obligatoriamente cuando el cociente izquierdo llega a 1.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Descomponga el número 40 usando el método de la tabla.
  alternativas:
  - 2^3 · 5
  - 4 · 10
  - 2^2 · 10
  respuesta: 2^3 · 5
  solucion_pasos:
  - '$40 : 2 = 20$, $20 : 2 = 10$, $10 : 2 = 5$, $5 : 5 = 1$. Resultado: $2^3 \cdot 5$.'
- titulo: Ejemplo 2
  enunciado: ¿Qué números se deben colocar en la columna de la derecha en el método de la tabla?
  alternativas:
  - Únicamente números primos
  - Cualquier número entero
  - Solo números pares
  respuesta: Únicamente números primos
  solucion_pasos:
  - La descomposición exige usar exclusivamente factores primos.
- titulo: ¿Finaliza el método de la tabla cuando el cociente obtenido es 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, el 1 indica la detención del algoritmo.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple rigurosamente con los teoremas de factorización prima y exponentes.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la descomposición prima canónica proporciona un valor exacto e irreductible.
  - texto: No es posible determinarlo sin conocer todos los divisores
    es_correcta: false
    retroalimentacion: Incorrecto, la factorización canónica permite calcular directamente todas las propiedades.
- titulo: ¿Se puede usar el número 6 en la columna derecha de la tabla?
  respuesta: 'No'
  solucion_pasos:
  - No, el 6 es un número compuesto.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple rigurosamente con los teoremas de factorización prima y exponentes.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la descomposición prima canónica proporciona un valor exacto e irreductible.
  - texto: No es posible determinarlo sin conocer todos los divisores
    es_correcta: false
    retroalimentacion: Incorrecto, la factorización canónica permite calcular directamente todas las propiedades.
errores_frecuentes:
- En la columna de la derecha del método de la tabla se pueden usar números compuestos como 4 u 8.
- El algoritmo de la tabla finaliza cuando el cociente resultante llega a cero.
- Realizar las divisiones en la tabla exige dividir siempre por el primo más grande en primer lugar.
- Multiplicar los cocientes de la columna izquierda entrega la descomposición prima del número.
- La tabla de descomposición no se puede aplicar a números impares.
afirmaciones_verdaderas:
- El método de la tabla realiza divisiones sucesivas por factores primos hasta obtener el cociente 1.
- Todos los divisores colocados en la columna derecha de la tabla deben ser estrictamente números primos.
al_terminar_debes_ponder: Al terminar serás capaz de factorizar cualquier número usando el método de la tabla de divisiones sucesivas por primos hasta reducir la cantidad a 1.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
al_terminar_debes_poder: '**QUÉ:** Factorizar números naturales de cualquier magnitud mediante el método de divisiones sucesivas (tabla vertical).


  **CÓMO:** Dividiendo sucesivamente por el menor factor primo disponible $2 \to 3 \to 5 \to \dots$ hasta obtener cociente 1, y agrupando los factores en potencias.


  ![Resumen Factorización prima mediante tabla](/static/img/nodos/factorizacion-prima-mediante-tabla-resumen.svg)'
