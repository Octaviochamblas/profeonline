errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en interpretación geométrica del cuadrado de binomio mediante
  área.
ejemplos:
- titulo: Cálculo de área seccionada
  enunciado: Si el lado de un cuadrado se divide en $x$ y $3$, expresa el área total
    del cuadrado sumando sus partes.
  solucion_pasos:
  - El lado total es $(x+3)$.
  - 'Las piezas interiores son: un cuadrado de $x \\\\\\cdot x = x^2$.'
  - Un cuadrado de $3 \\\\\\cdot 3 = 9$.
  - Dos rectángulos de $x \\\\\\cdot 3 = 3x$.
  - La suma de las áreas es $x^2 + 3x + 3x + 9 = x^2 + 6x + 9$.
- titulo: A un cuadrado de lado $a$ se le aumenta el lado en $b$ unidades. ¿En cuánto
    aumenta su área
  enunciado: 'A un cuadrado de lado $a$ se le aumenta el lado en $b$ unidades. ¿En
    cuánto aumenta su área total?


    Opciones: A) En $b(2a + b)$ · B) En $b^2$ · C) En $a^2 + b^2$ · D) En $2ab$'
  solucion_pasos:
  - 'Área nueva: $(a+b)^2 = a^2 + 2ab + b^2$. Área vieja: $a^2$. Aumento: $2ab + b^2
    = b(2a+b)$.'
  - 'Respuesta: En $b(2a + b)$'
- titulo: 'Respecto de «Interpretación geométrica del cuadrado de binomio mediante
    área»: ¿Describe ade'
  enunciado: 'Respecto de «Interpretación geométrica del cuadrado de binomio mediante
    área»: ¿Describe adecuadamente el concepto esta frase? «El área de un cuadrado
    de lado $(a+b)$ se puede calcular de dos formas: 1»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El área de un cuadrado de lado
    $(a+b)$ se puede calcular de dos formas: 1.'
- titulo: 'Respecto de «Interpretación geométrica del cuadrado de binomio mediante
    área»: ¿Se puede ace'
  enunciado: 'Respecto de «Interpretación geométrica del cuadrado de binomio mediante
    área»: ¿Se puede aceptar esta afirmación? «Creer que el cuadrado de lado $(a+b)$
    solo contiene un cuadrado de $a^2$ y uno de $b^2$, omitiendo por completo los
    dos rectángulos de área $ab$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El área de un cuadrado de lado
    $(a+b)$ se puede calcular de dos formas: 1.'
errores_frecuentes:
- Creer que el cuadrado de lado $(a+b)$ solo contiene un cuadrado de $a^2$ y uno de
  $b^2$, omitiendo por completo los dos rectángulos de área $ab$.
- $a^2 + b^2$.
- Para «En la representación geométrica de $(a+b)^2$, las figuras interiores rectangulares
  que NO son cuadrados tienen como área conjunta:», la respuesta correcta es $ab$.
- Para «En la representación geométrica de $(a+b)^2$, las figuras interiores rectangulares
  que NO son cuadrados tienen como área conjunta:», la respuesta correcta es $a^2$.
- Porque el área de un cuadrado siempre es un trinomio.
