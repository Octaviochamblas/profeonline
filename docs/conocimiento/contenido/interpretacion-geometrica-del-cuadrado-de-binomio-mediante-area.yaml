resumen_inicial: La representación geométrica del cuadrado de binomio demuestra que
  el área de un cuadrado de lado $(a + b)$ se compone de dos cuadrados y dos rectángulos.
explicacion_simple: 'Si dibujas un cuadrado grande cuyo lado mide $(a + b)$ y lo divides
  con una línea horizontal y una vertical en las medidas $a$ y $b$, obtendrás 4 figuras:
  un cuadrado de área $a^2$, otro cuadrado de área $b^2$, y dos rectángulos iguales
  de área $a \cdot b$ cada uno. La suma de todas las partes es $a^2 + 2ab + b^2$.'
explicacion_formal: 'Sea $\mathcal{C}$ un cuadrado en el plano euclidiano $\mathbb{R}^2$
  de longitud de lado $L = a + b$, donde $a, b > 0$. El área total $A_{total}$ se
  calcula como:


  $$A_{total} = L^2 = (a + b)^2$$


  Por partición geométrica del dominio en subregiones disjuntas:

  $$A_{total} = A_1 + A_2 + A_3 + A_4 = a^2 + ab + ba + b^2 = a^2 + 2ab + b^2$$


  **Desglose simbólico:**

  - $a^2$: Área de la región cuadrada principal de lado $a$.

  - $ab$ y $ba$: Áreas de las dos regiones rectangulares congruentes de lados $a$
  y $b$.

  - $b^2$: Área de la región cuadrada secundaria de lado $b$.


  > **Complemento didáctico:** Esta prueba visual sustenta geométricamente por qué
  la potencia de una suma no se limita a la suma de las potencias de sus componentes.'
definiciones_clave: '- **Partición de área**: Descomposición de una superficie en
  polígonos no superpuestos cuya suma de áreas equivale al área total.

  - **Rectángulos congruentes**: Las dos regiones de área $ab$ que forman el doble
  producto $2ab$.'
propiedades_relaciones: '- **Demostración euclidiana**: Conecta la aritmética de polinomios
  con la geometría del plano de Euclides.'
ejemplo_guiado:
  enunciado: Calcule el área total de un terreno cuadrado de lado $(x + 3)$ metros
    dividiéndolo en sus 4 regiones geométricas componentes.
  pasos:
  - 'Paso 1: Identificar la región del cuadrado mayor de lado $x$: Área $A_1 = x^2$.'
  - 'Paso 2: Identificar los dos rectángulos de lados $x$ y $3$: Área $A_2 + A_3 =
    3x + 3x = 6x$.'
  - 'Paso 3: Identificar la región del cuadrado menor de lado $3$: Área $A_4 = 3^2
    = 9$.'
  - 'Paso 4: Sumar las áreas de las 4 regiones: $x^2 + 6x + 9$.'
  - 'Conclusión: El área total del terreno es $(x^2 + 6x + 9)\text{ m}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuántas regiones geométricas individuales componen la subdivisión del
    cuadrado de lado $(a + b)$?
  choices:
  - text: $4$ regiones ($2$ cuadrados y $2$ rectángulos)
    is_correct: true
  - text: $2$ regiones ($2$ cuadrados)
    is_correct: false
  - text: $3$ regiones ($3$ rectángulos)
    is_correct: false
  - text: $1$ sola región
    is_correct: false
  explanation: La alternativa correcta es '$4$ regiones ($2$ cuadrados y $2$ rectángulos)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo del terreno de lado $(x + 3)$, ¿cuál es el área sumada de
    los dos rectángulos congruentes?
  choices:
  - text: $6x$
    is_correct: true
  - text: $3x$
    is_correct: false
  - text: $9x$
    is_correct: false
  - text: $x^2$
    is_correct: false
  explanation: La alternativa correcta es '$6x$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar un cuadrado de lado $a + b$ y dividir cada lado en los segmentos
  $a$ y $b$.'
- 'Paso 2: Trazar las líneas divisoras formando un cuadrado de área $a^2$, dos rectángulos
  de área $ab$ y un cuadrado de área $b^2$.'
- 'Paso 3: Sumar las cuatro áreas para obtener $a^2 + 2ab + b^2$.'
errores_correccion: '- **Error 1: Omitir el área de los dos rectángulos al calcular
  la superficie total.** **Cómo corregirlo:** La superficie total incluye los rectángulos
  de lados $a$ y $b$, que representan el doble producto $2ab$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un cuadrado tiene lado $(y + 4)$, ¿cuáles son las áreas de las 4 figuras
    que lo componen?
  alternativas:
  - Un cuadrado de $y^2$, dos rectángulos de $4y$ y un cuadrado de $16$
  - Dos cuadrados de $y^2$ y dos rectángulos de $16$
  - Un cuadrado de $y^2$ y un cuadrado de $16$
  respuesta: Un cuadrado de $y^2$, dos rectángulos de $4y$ y un cuadrado de $16$
  solucion_pasos:
  - '1. Cuadrado principal: $y^2$.'
  - '2. Rectángulos: $4y + 4y = 8y$.'
  - '3. Cuadrado menor: $4^2 = $16$. Total: $y^2 + 8y$ + $16$.'
- titulo: Ejemplo 2
  enunciado: ¿Qué representa algebraicamente la suma de las áreas de los dos rectángulos
    $ab$ en el gráfico?
  alternativas:
  - El doble producto $2ab$
  - La suma de los lados $2a + 2b$
  - El cuadrado $b^2$
  respuesta: El doble producto $2ab$
  solucion_pasos:
  - 1. Cada rectángulo tiene área $a \cdot b$.
  - 2. Al haber 2 rectángulos congruentes, la suma es $ab + ab = $2ab$.
- titulo: ¿Representan los dos rectángulos del modelo geométrico áreas de igual medida?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos tienen dimensiones $a \times b$, por lo que sus áreas son congruentes
    e iguales a $ab$.
- titulo: ¿La superficie de un cuadrado de lado $(a + b)$ es igual únicamente a la
    suma de dos cuadrados $a^2 + b^2$?
  respuesta: 'No'
  solucion_pasos:
  - No, faltaría incluir las superficies de los dos rectángulos centrales que suman
    $2ab$.
errores_frecuentes:
- Considerar que el área de un cuadrado de lado $(a + b)$ consiste únicamente en dos
  regiones cuadradas $a^2 + b^2$.
- Declarar que los rectángulos centrales tienen un área de $a + b$ en lugar de $a
  \cdot b$.
- El área de la superficie cuadrada de lado $(a + b)$ equivale a $4(a + b)$.
- Declarar que los dos rectángulos intermedios tienen áreas distintas cuando los lados
  $a$ y $b$ son fijos.
- Asignar unidades lineales al resultado del área expresada en metros cuadrados.
afirmaciones_verdaderas:
- La interpretación geométrica del cuadrado de binomio descompone la superficie total
  en 4 subregiones.
- Los dos rectángulos centrales del modelo tienen área $ab$ cada uno, sumando $2ab$
  en total.
al_terminar_debes_poder: Al terminar serás capaz de justificar geométricamente la
  regla del cuadrado de binomio asociando cada término a su superficie correspondiente.
