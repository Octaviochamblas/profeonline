semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULOS_INSCRITOS_MISMO_ARCO
resumen_inicial: Todos los ángulos inscritos en una circunferencia que subtienden el mismo arco (o arcos congruentes) tienen exactamente la misma medida angular.
explicacion_simple: 'Imagina dos personas sentadas en asientos distintos de la tribuna curva de un teatro redondo, pero ambas mirando al mismo escenario (el arco $\overset{\frown}{AB}$). ¿Quién tiene una apertura visual más grande? **¡Ninguna de las dos, ambas ven el escenario bajo exactamente el mismo ángulo!**


  Esto se debe a que no importa en qué punto de la circunferencia coloques el vértice $V_1, V_2$ o $V_3$: mientras todos estén mirando al mismo arco $\overset{\frown}{AB}$, cada uno de ellos medirá **la mitad de ese arco**: **$\angle V_1 = \angle V_2 = \frac{\overset{\frown}{AB}}{2}$**.


  Esta fabulosa propiedad es la herramienta secreta para encontrar triángulos semejantes y resolver problemas de cuadriláteros en segundos.


  ![Igualdad de ángulos inscritos](/static/img/nodos/igualdad-de-angulos-inscritos-que-subtienden-el-mismo-arco-intro.svg)

  '
explicacion_formal: '### Teorema de los ángulos inscritos congruentes

  Sean $V_1, V_2 \in \mathcal{C}$ dos puntos distintos sobre el arco mayor determinado por $A$ y $B$. Sean $\angle AV_1B$ y $\angle AV_2B$ dos ángulos inscritos que subtienden el mismo arco $\overset{\frown}{AB}$. Entonces:

  $$\angle AV_1B \cong \angle AV_2B \iff \angle AV_1B = \angle AV_2B = \frac{\text{med}(\overset{\frown}{AB})}{2}$$


  ### Corolario del Arco Capaz

  El lugar geométrico de los puntos del plano desde los cuales un segmento fijo $\overline{AB}$ se observa bajo un ángulo constante $\beta$ está formado por dos arcos de circunferencia simétricos que tienen a $\overline{AB}$ como cuerda común. Cualquier punto $P$ perteneciente a dicho arco satisface $\angle APB = \beta$.


  ### Aplicación en Cuadriláteros Cíclicos y Semejanza

  Al trazar las dos diagonales de un cuadrilátero inscrito $ABCD$, los ángulos que subtienden un mismo lado son congruentes:

  $$\angle BAC = \angle BDC, \quad \angle ABD = \angle ACD, \quad \angle CBD = \angle CAD, \quad \angle BCA = \angle BDA$$

  Esto genera inmediatamente pares de triángulos semejantes por criterio Ángulo-Ángulo (AA).


  > **Complemento didáctico:** Cada vez que veas un cuadrilátero inscrito con sus dos diagonales cruzadas (la típica forma de ''pajarita'' o ''mariposa''), busca los ángulos inscritos que apoyan sus pies en el mismo lado: ¡esos dos ángulos son automáticamente iguales!

  '
definiciones_clave: '- **Ángulos inscritos homotópicos**: Ángulos inscritos cuyos vértices yacen sobre el mismo arco conjugado y subtienden la misma cuerda.

  - **Arco capaz**: Lugar geométrico de puntos que observan un segmento bajo un ángulo constante dado.

  - **Cuadrilátero cíclico**: Cuadrilátero cuyos cuatro vértices pertenecen a una misma circunferencia.

  '
propiedades_relaciones: '- **Congruencia por transitividad**: $\angle V_1 = \frac{\overset{\frown}{AB}}{2} \wedge \angle V_2 = \frac{\overset{\frown}{AB}}{2} \implies \angle V_1 = \angle V_2$.

  - **Arcos congruentes implican ángulos iguales**: Si $\overset{\frown}{AB} \cong \overset{\frown}{CD}$, entonces $\angle V_1 = \angle V_2$.

  - **Independencia de la forma**: La figura puede parecer asimétrica o deformada, pero la medida angular se preserva rigurosamente.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de igualdad de ángulos inscritos](/static/img/nodos/igualdad-de-angulos-inscritos-que-subtienden-el-mismo-arco-ejemplos.svg)


    En una circunferencia, los puntos $A$ y $B$ delimitan un arco de $96^\circ$. Se eligen dos puntos distintos $V_1$ y $V_2$ sobre la circunferencia para formar los ángulos inscritos $\angle AV_1B$ y $\angle AV_2B$. Calcula la medida de ambos ángulos y verifica su congruencia.'
  pasos:
  - 'Paso 1: Identificar el arco común que subtienden ambos ángulos: $\overset{\frown}{AB} = 96^\circ$.'
  - 'Paso 2: Calcular la medida del primer ángulo inscrito: $\angle AV_1B = \frac{\overset{\frown}{AB}}{2} = \frac{96^\circ}{2} = 48^\circ$.'
  - 'Paso 3: Calcular la medida del segundo ángulo inscrito: $\angle AV_2B = \frac{\overset{\frown}{AB}}{2} = \frac{96^\circ}{2} = 48^\circ$.'
  - 'Paso 4: Concluir congruencia: Ambos miden exactamente $48^\circ$, verificando que $\angle AV_1B = \angle AV_2B$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si dos ángulos inscritos subtienden exactamente el mismo arco de circunferencia, ¿cuál es la relación entre sus medidas?
  choices:
  - text: Tienen exactamente la misma medida angular (son congruentes).
    is_correct: true
  - text: Uno mide el doble que el otro.
    is_correct: false
  - text: Son suplementarios y suman 180°.
    is_correct: false
  - text: Depende de la distancia entre sus vértices.
    is_correct: false
  explanation: La alternativa correcta es 'Tienen exactamente la misma medida angular (son congruentes).' Como ambos miden la mitad del mismo arco, son necesariamente iguales entre sí.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En una circunferencia, el ángulo inscrito ∠AV₁B mide 37°. Si V₂ es otro punto de la circunferencia sobre el mismo arco, ¿cuánto mide ∠AV₂B?
  choices:
  - text: 37°.
    is_correct: true
  - text: 74°.
    is_correct: false
  - text: 18,5°.
    is_correct: false
  - text: 143°.
    is_correct: false
  explanation: La alternativa correcta es '37°.' Por el teorema de ángulos inscritos en el mismo arco, $\angle AV_2B = \angle AV_1B = 37^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar en la figura los ángulos inscritos involucrados.

  2. Rastrear los lados de cada ángulo hasta sus puntos de corte en la circunferencia.

  3. Confirmar que ambos ángulos subtienden los mismos puntos extremos $A$ y $B$.

  4. Igualar directamente sus medidas angulares: $\angle V_1 = \angle V_2$.

  '
errores_correccion: '- **Error común 1:** Creer que un ángulo es más grande que otro porque su vértice está ''más cerca'' de un extremo. **Corrección:** La curvatura de la circunferencia compensa exactamente la distancia, manteniendo la medida constante.

  - **Error común 2:** Igualar ángulos que subtienden arcos diferentes. **Corrección:** Deben compartir estrictamente los mismos puntos extremos del arco.

  '
ejemplos:
- tipo: A
  titulo: Ángulos inscritos iguales en cuadrilátero
  enunciado: En un cuadrilátero inscrito $ABCD$, el ángulo $\angle BAC$ mide $52^\circ$. ¿Cuánto mide el ángulo $\angle BDC$?
  alternativas:
  - text: $52^\circ$.
    is_correct: true
  - text: $26^\circ$.
    is_correct: false
  - text: $104^\circ$.
    is_correct: false
  - text: $128^\circ$.
    is_correct: false
  explicacion: Ambos son ángulos inscritos que subtienden el mismo arco $\overset{\frown}{BC}$, luego $\angle BDC = \angle BAC = 52^\circ$.
- tipo: B
  titulo: Independencia de posición
  enunciado: ¿Se mantiene constante la medida de un ángulo inscrito al desplazar su vértice sobre el arco mayor que no contiene al arco subtendido?
  respuesta: Sí
  explicacion: Sí. Todos los puntos de ese arco forman parte del arco capaz y observan el arco $\overset{\frown}{AB}$ bajo el mismo ángulo.
errores_frecuentes:
- '''Asumir que la medida del ángulo inscrito depende de la posición relativa de su vértice.'''
- '''Olvidar que los dos ángulos deben subtienden los mismos extremos del arco para ser iguales.'''
- '''Confundir ángulos inscritos en el mismo arco con ángulos opuestos en un cuadrilátero inscrito.'''
afirmaciones_verdaderas:
- '''Todos los ángulos inscritos que subtienden el mismo arco son congruentes entre sí.'''
- '''Si dos ángulos inscritos subtienden arcos de igual medida angular, entonces miden lo mismo.'''
- '''En un cuadrilátero cíclico con diagonales, los pares de ángulos que miran a un mismo lado son congruentes.'''
al_terminar_debes_poder: '**QUÉ:** Aplicar la congruencia de ángulos inscritos que subtienden un mismo arco para resolver problemas de ángulos y semejanza.


  **CÓMO:** Verificando arcos comunes e igualando $\angle V_1 = \angle V_2 = \frac{\overset{\frown}{AB}}{2}$.


  ![Síntesis de ángulos inscritos en mismo arco](/static/img/nodos/igualdad-de-angulos-inscritos-que-subtienden-el-mismo-arco-resumen.svg)

  '
