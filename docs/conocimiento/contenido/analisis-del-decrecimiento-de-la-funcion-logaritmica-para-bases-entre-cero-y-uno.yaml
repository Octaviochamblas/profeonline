semantic_id: MAT.ALG.FUNC_LOGARITMICA_BASE.DECRECIMIENTO_BASE_ENTRE_CERO_UNO
resumen_inicial: El análisis del decrecimiento de la función logarítmica para bases entre cero y uno ($0 < b < 1$) establece que $f(x) = \log_b(x)$ es estrictamente decreciente en todo su dominio $]0, +\infty[$, siendo positiva en $]0, 1[$, nula en $(1, 0)$ y negativa en $]1, +\infty[$.
explicacion_simple: "![El análisis del decrecimiento de la función logarítmica para bases entre cero y uno ($0 < b < 1$) establece que $f(x) = \\log_b(x)$ es estrictamente decreciente en todo su dominio $]0, +\\infty[$, siendo positiva en $]0, 1[$, nula en $(1, 0)$ y negativa en $]1, +\\infty[$](/static/img/nodos/analisis-del-decrecimiento-de-la-funcion-logaritmica-para-bases-entre-cero-y-uno-intro.svg)\n\n\nCuando la base es una **fracción propia o decimal entre 0 y 1** ($0 < b < 1$, como $1/2, 0,2, 1/3$):\n\n$$\\mathbf{0 < b < 1} \\quad \\implies \\quad f(x) = \\log_b(x) \\quad \\text{es } \\mathbf{\\text{ESTRICTAMENTE DECRECIENTE (\\searrow)}}$$\n\n- **El comportamiento de la curva invertida:**\n  1. **En $]0, 1[$ (valores pequeños):** La curva proviene desde lo más alto ($+\\infty$) con valores positivos pegada a la asíntota $x = 0$.\n  2. **En $x = 1$:** Cruza el eje horizontal en el punto canónico **$(1, 0)$**.\n  3. **En $]1, +\\infty[$ (valores grandes):** Se vuelve negativa y sigue\
  \ cayendo hacia $-\\infty$.\n- **El truco de la reflexión:** $\\log_{1/b}(x) = -\\log_b(x)$. Por ejemplo, $\\log_{1/2}(x) = -\\log_2(x)$, ¡es el reflejo de cabeza de la base 2!"
explicacion_formal: "Sea $f: \\mathbb{R}^+ \\to \\mathbb{R}$ con $f(x) = \\log_b(x)$ y $0 < b < 1$.\n\n**Propiedades diferenciales y de monotonía**:\n1. **Derivada estrictamente negativa**: Como $0 < b < 1 \\implies \\ln(b) < 0$. Para todo $x > 0$:\n   $$f'(x) = \\frac{1}{x \\ln(b)} < 0$$\n   Por el criterio de monotonía, $f$ es **estrictamente decreciente** en $]0, +\\infty[$.\n2. **Convexidad**: La segunda derivada es estrictamente positiva:\n   $$f''(x) = -\\frac{1}{x^2 \\ln(b)} > 0$$\n   Por tanto, la función es **convexa hacia arriba**.\n3. **Signos de la función**:\n   - $x \\in ]0, 1[ \\implies f(x) > 0$.\n   - $x = 1 \\implies f(1) = 0$.\n   - $x \\in ]1, +\\infty[ \\implies f(x) < 0$."
definiciones_clave: '- **Monotonía decreciente**: Condición $x_1 < x_2 \implies \log_b(x_1) > \log_b(x_2)$ para $0 < b < 1$.

  - **Identidad de base recíproca**: $\log_{1/b}(x) = -\log_b(x)$, que representa una reflexión geométrica respecto al eje $X$.'
propiedades_relaciones: '- **Comportamiento asintótico**: $\lim_{x \to 0^+} \log_b(x) = +\infty$ y $\lim_{x \to +\infty} \log_b(x) = -\infty$.

  - **Simetría especular con base inversa**: La gráfica de $\log_{1/2}(x)$ es idéntica a la de $\log_2(x)$ reflejada verticalmente.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis del decrecimiento de la función logarítmica para bases entre cero y uno ($0 < b < 1$) establece que $f(x) = \log_b(x)$ es estrictamente decreciente en todo su dominio $]0, +\infty[$, siendo positiva en $]0, 1[$, nula en $(1, 0)$ y negativa en $]1, +\infty[$](/static/img/nodos/analisis-del-decrecimiento-de-la-funcion-logaritmica-para-bases-entre-cero-y-uno-ejemplos.svg)



    Dada la función $f(x) = \log_{1/3}(x)$:

    1) Demuestra su monotonía decreciente.

    2) Evalúa $f(1/9)$, $f(1)$ y $f(27)$.

    3) Describe su comportamiento en los extremos del dominio.'
  pasos:
  - 'Paso 1: Como la base $b = 1/3 \in ]0, 1[$, la función es estrictamente decreciente.'
  - 'Paso 2: Evaluaciones puntuales:

    - $f(1/9) = \log_{1/3}((1/3)^2) = \mathbf{2 > 0}$ (positivo en $]0, 1[$).

    - $f(1) = \log_{1/3}(1) = \mathbf{0}$ (cero en $x = 1$).

    - $f(27) = \log_{1/3}((1/3)^{-3}) = \mathbf{-3 < 0}$ (negativo en $]1, +\infty[$).'
  - 'Paso 3: Extremos del dominio:

    - Cuando $x \to 0^+$, $f(x) \to +\infty$ (asciende pegada al eje $Y$).

    - Cuando $x \to +\infty$, $f(x) \to -\infty$ (desciende sin cota inferior).'
checkpoints:
- placement: after_explicacion_formal
  question: Si $0 < b < 1$, ¿qué signo tiene $\log_b(x)$ cuando $x > 1$?
  choices:
  - text: Negativo (la curva está por debajo del eje X)
    is_correct: true
  - text: Positivo
    is_correct: false
  - text: Cero
    is_correct: false
  - text: Indefinido
    is_correct: false
  explanation: La alternativa correcta es 'Negativo (la curva está por debajo del eje X)'. Para bases entre 0 y 1 con argumentos mayores que 1, el resultado del logaritmo es negativo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué función es idéntica $f(x) = \log_{0,5}(x)$?
  choices:
  - text: -log₂(x) (la reflexión de log₂(x) respecto al eje X)
    is_correct: true
  - text: log₂(x)
    is_correct: false
  - text: log₂(1/x) · 2
    is_correct: false
  - text: 0,5 · log₂(x)
    is_correct: false
  explanation: La alternativa correcta es '-log₂(x) (la reflexión de log₂(x) respecto al eje X)'. $\log_{1/2}(x) = \log_{2^{-1}}(x) = -\log_2(x)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que la base $b$ cumpla la condición $0 < b < 1$.'
- 'Paso 2: Declarar la función como estrictamente decreciente en todo su dominio $]0, +\infty[$.'
- 'Paso 3: Identificar valores positivos en $]0, 1[$, corte en $(1, 0)$ y valores negativos en $]1, +\infty[$.'
- 'Paso 4: Trazar la curva convexa descendiendo desde $+\infty$ hacia $-\infty$.'
errores_correccion: '- **Error común:** Creer que porque la base es una fracción, la función no puede dar valores positivos.

  - **Cómo corregirlo:** Para $x \in ]0, 1[$, **el logaritmo con base fraccionaria es estrictamente POSITIVO**: $\log_{1/2}(0,25) = \mathbf{+2}$.'
ejemplos:
- titulo: 'Ejemplo 1: Monotonía de base fraccionaria'
  enunciado: ¿Cómo es la gráfica de $f(x) = \log_{0{,}4}(x)$?
  alternativas:
  - Estrictamente decreciente
  - Estrictamente creciente
  - Constante
  - Cóncava hacia abajo
  respuesta: Estrictamente decreciente
  solucion_pasos:
  - 'Paso 1: $0{,}4 \in ]0, 1[ \implies$ estrictamente decreciente.'
- titulo: 'Ejemplo 2: Evaluación con base 1/2'
  enunciado: 'Calcula $\log_{1/2}(16)$:'
  alternativas:
  - '-4'
  - '4'
  - '-8'
  - 1/4
  respuesta: '-4'
  solucion_pasos:
  - 'Paso 1: $(1/2)^{-4} = 2^4 = 16 \implies -4$.'
- titulo: 'Ejemplo 3: Argumento fraccionario con base fraccionaria'
  enunciado: ¿Cuánto vale $\log_{1/5}(1/125)$?
  alternativas:
  - '3'
  - '-3'
  - '25'
  - 1/3
  respuesta: '3'
  solucion_pasos:
  - 'Paso 1: $(1/5)^3 = 1/125 \implies 3$.'
- titulo: 'Ejemplo 4: Límite en el origen'
  enunciado: Para $f(x) = \log_{0{,}1}(x)$, ¿cuál es el valor de $\lim_{x \to 0^+} f(x)$?
  alternativas:
  - +infinito
  - -infinito
  - '0'
  - '-1'
  respuesta: +infinito
  solucion_pasos:
  - 'Paso 1: La curva diverge hacia $+\infty$ cuando $x \to 0^+$.'
errores_frecuentes:
- Confundir las ramas de signos asumiendo que siempre es negativa para números grandes.
- Olvidar que log_(1/b)(x) es igual a -log_b(x).
- Pensar que la curva corta al eje Y en bases decrecientes.
afirmaciones_verdaderas:
- Para 0 < b < 1, la función logarítmica f(x) = log_b(x) es estrictamente decreciente en todo su dominio.
- La curva logarítmica con 0 < b < 1 es positiva en ]0, 1[ y negativa en ]1, +∞[.
al_terminar_debes_poder: '**QUÉ:** Analizar y fundamentar el decrecimiento de la función logarítmica para bases entre cero y uno.


  **CÓMO:** Utilizando la condición 0 < b < 1 para explicar su monotonía decreciente y su simetría con -log_(1/b)(x).


