semantic_id: MAT.ALG.FACTOR_CUADRADOS.RECONOCIMIENTO_DIFERENCIA_CUADRADOS
resumen_inicial: 'Reconocimiento de diferencia de cuadrados perfectos: concepto, método
  de descomposición y reglas en Factorización asociada a cuadrados.'
explicacion_simple: 'Si has estudiado los productos notables, recordarás que la multiplicación
  de "Suma por su diferencia" creaba un resultado muy limpio: dos cuadrados restándose.
  Ahora haremos exactamente lo opuesto: tomaremos esa resta limpia y descubriremos
  los gemelos (uno positivo y uno negativo) que le dieron origen.'
explicacion_formal: '### Definición formal


  El producto de dos binomios conjugados (suma por su diferencia).


  ### Desarrollo didáctico


  El caso de $a^2 - b^2$ es posiblemente la factorización más famosa del álgebra.


  Para que este método sea aplicable, la expresión debe cumplir dos condiciones inflexibles:

  1. Tienen que ser exactamente dos términos.

  2. Uno de los términos debe ser positivo y el otro negativo (están restándose).

  3. Ambos términos deben ser ''cuadrados perfectos'', lo que significa que puedes
  extraerles su raíz cuadrada de forma exacta.


  Por ejemplo: $25x^2 - 9$.

  - ¿Son dos términos restándose? Sí.

  - ¿Raíz cuadrada de $25x^2$? Es $5x$.

  - ¿Raíz cuadrada de $9$? Es $3$.


  Las raíces son $5x$ y $3$.

  Formamos los gemelos conjugados: $(5x + 3)(5x - 3)$.

  Y listo. Ya está factorizado.'
definiciones_clave: '- **Reconocimiento de diferencia de cuadrados perfectos**: Técnica
  de factorización para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en reconocimiento de diferencia de cuadrados
  perfectos.'
