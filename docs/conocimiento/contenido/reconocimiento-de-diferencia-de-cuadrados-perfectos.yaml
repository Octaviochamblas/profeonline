resumen_inicial: El reconocimiento de diferencia de cuadrados perfectos identifica
  binomios de la forma $A^2 - B^2$, compuestos por dos términos cuadrados perfectos
  separados strictly por un signo de resta.
explicacion_simple: 'Para saber si un binomio es una diferencia de cuadrados como
  $x^2 - 9$, debes comprobar dos cosas: 1) Que sean solo dos términos restándose,
  y 2) Que a ambos se les pueda extraer raíz cuadrada exacta ($\sqrt{x^2} = x$ y $\sqrt{9}
  = 3$).'
explicacion_formal: 'Sea $P(x, y)$ un binomio en $\mathbb{R}[x, y]$. El **Reconocimiento
  de Diferencia de Cuadrados Perfectos** exige la verificación de la identidad estructural:


  $$P(x, y) = A^2 - B^2 \quad \text{donde } A = \sqrt{T_1} \in \mathbb{R}[x, y] \quad
  \text{y} \quad B = \sqrt{T_2} \in \mathbb{R}[x, y]$$


  **Desglose simbólico:**

  - $T_1 = A^2$: Primer término con coeficiente positivo y exponentes pares en sus
  variables.

  - $T_2 = B^2$: Segundo término precedido por el signo de resta con coeficientes
  y exponentes pares.

  - Signo de resta obligatorio: Expresiones de la forma $A^2 + B^2$ NO constituyen
  una diferencia de cuadrados en $\mathbb{R}$.


  > **Complemento didáctico:** Exige que los exponentes de todas las variables involucradas
  sean números pares divisibles por 2.'
definiciones_clave: '- **Diferencia de cuadrados**: Binomio $A^2 - B^2$ de dos términos
  cuadrados perfectos restados.

  - **Término cuadrado perfecto**: Monomio cuya raíz cuadrada es exacta con exponente
  entero.'
propiedades_relaciones: '- **Criterio de paridad de exponentes**: Todo término de
  la forma $c x^{2k}$ con $c = d^2 > 0$ es un cuadrado perfecto.'
ejemplo_guiado:
  enunciado: Verifique si el binomio $25x^4 - 49y^6$ representa una diferencia de
    cuadrados perfectos.
  pasos:
  - 'Paso 1: Verificar el signo entre términos: Es una resta ($-$ ).'
  - 'Paso 2: Evaluar el primer término $25x^4$: $\sqrt{25} = 5$ y exponente $4/2 =
    2 \implies A = 5x^2$. Es cuadrado perfecto.'
  - 'Paso 3: Evaluar el segundo término $49y^6$: $\sqrt{49} = 7$ y exponente $6/2
    = 3 \implies B = 7y^3$. Es cuadrado perfecto.'
  - 'Paso 4: Comprobar la forma estructural: $(5x^2)^2 - (7y^3)^2$.'
  - 'Conclusión: El binomio es efectivamente una diferencia de cuadrados perfectos
    con $A = 5x^2$ y $B = 7y^3$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las dos condiciones obligatorias que definen a una diferencia
    de cuadrados perfectos en el campo real?
  choices:
  - text: Dos términos cuadrados perfectos separados estrictamente por un signo de
      resta
    is_correct: true
  - text: Tres términos positivos con coeficientes impares
    is_correct: false
  - text: Dos términos cuadrados perfectos separados por un signo de suma
    is_correct: false
  - text: Cualquier binomio que contenga una variable $x^2$
    is_correct: false
  explanation: La alternativa correcta es 'Dos términos cuadrados perfectos separados
    estrictamente por un signo de resta'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expresión $25x^4 - 49y^6$, ¿cuáles son las bases $A$ y $B$ correspondientes
    a $A^2 - B^2$?
  choices:
  - text: $A = 5x^2$ y $B = 7y^3$
    is_correct: true
  - text: $A = 25x^2$ y $B = 49y^3$
    is_correct: false
  - text: $A = 5x^4$ y $B = 7y^6$
    is_correct: false
  - text: $A = 5x$ y $B = 7y$
    is_correct: false
  explanation: La alternativa correcta es '$A = 5x^2$ y $B = 7y^3$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que el binomio esté compuesto por dos sumandos con signo opuesto
  (una resta).'
- 'Paso 2: Calcular la raíz cuadrada del coeficiente numérico de cada término.'
- 'Paso 3: Dividir entre 2 el exponente de cada variable para obtener las bases $A$
  y $B$.'
errores_correccion: '- **Error 1: Clasificar la suma de cuadrados $x^2 + y^2$ como
  una diferencia de cuadrados en el campo real.** **Cómo corregirlo:** La diferencia
  de cuadrados requiere OBLIGATORIAMENTE un signo menos entre los términos ($A^2 -
  B^2$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es el binomio $16a^2 - 81$ una diferencia de cuadrados perfectos?
  alternativas:
  - Sí, con $A = 4a$ y $B = 9$
  - No, porque 81 no tiene variable
  - No, porque falta el término central
  respuesta: Sí, con $A = 4a$ y $B = 9$
  solucion_pasos:
  - 1. $\sqrt{16a^2} = 4a$ y $\sqrt{81} = 9$.
  - 2. Signo menos intermedio $\to (4a)^2 - 9^2$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de las siguientes expresiones NO representa una diferencia de cuadrados
    en $\mathbb{R}$?
  alternativas:
  - $x^2 + 4$
  - $x^2 - 4$
  - $4 - x^2$
  respuesta: $x^2 + 4$
  solucion_pasos:
  - 1. $x^2 + 4$ es una suma de cuadrados, irreducible en los números reales.
- titulo: ¿Es $m^6 - n^4$ una diferencia de cuadrados perfectos con $A = m^3$ y $B
    = n^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(m^3)^2 - (n^2)^2 = m^6 - n^4$.
- titulo: En el campo de los números reales $\mathbb{R}$, ¿es posible factorizar una
    suma de cuadrados $x^2 + 9$ como producto de binomios lineales reales?
  respuesta: 'No'
  solucion_pasos:
  - No, la suma de cuadrados es irreducible en $\mathbb{R}$.
errores_frecuentes:
- Clasificar una suma de cuadrados $A^2 + B^2$ como factorizable por producto de suma
  por diferencia en $\mathbb{R}$.
- Dividir entre 2 el coeficiente numérico en lugar de extraer su raíz cuadrada.
- Declarar que las variables deben tener exponente 2 estrictamente en lugar de cualquier
  exponente par.
- Declarar que los términos de una diferencia de cuadrados deben tener coeficientes
  iguales.
- Declarar que la diferencia de cuadrados $A^2 - B^2$ equivale algebraicamente al
  cuadrado de binomio $(A - B)^2$.
afirmaciones_verdaderas:
- Una diferencia de cuadrados consta de dos términos cuadrados perfectos restados
  entre sí.
- Las bases $A$ y $B$ de $A^2 - B^2$ se obtienen extrayendo la raíz cuadrada a los
  coeficientes y dividiendo por 2 los exponentes.
al_terminar_debes_poder: Al terminar serás capaz de reconocer diferencias de cuadrados
  perfectos identificando sus bases en los números reales.
