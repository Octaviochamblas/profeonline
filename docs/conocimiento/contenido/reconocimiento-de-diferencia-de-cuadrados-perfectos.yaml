procedimiento:
- 'Paso 1: Confirma que tienes un binomio separado por un signo de resta ($-$).'
- 'Paso 2: Extrae la raíz cuadrada exacta del primer término.'
- 'Paso 3: Extrae la raíz cuadrada exacta del segundo término (sin tomar el signo
  negativo).'
- 'Paso 4: Escribe tu respuesta como dos binomios multiplicándose: en uno pones la
  suma de las raíces, y en el otro, la resta.'
- La forma es (A+B)(A-B).
errores_correccion: Evita dejar la factorización incompleta; extrae siempre el máximo
  factor común en reconocimiento de diferencia de cuadrados perfectos.
ejemplos:
- titulo: Factoriza $49m^2 - 16$
  enunciado: Factoriza $49m^2 - 16$.
  solucion_pasos:
  - 'Raíz del primero: $\sqrt{49m^2} = 7m$.'
  - 'Raíz del segundo: $\sqrt{16} = 4$.'
  - Multiplicamos la suma por la resta de ambas raíces.
  - 'Resultado: $(7m + 4)(7m - 4)$.'
- titulo: ¿Cuál es la factorización de $y^6 - 100$?
  solucion_pasos:
  - La raíz cuadrada de $y^6$ es $y^3$ (se divide el exponente entre 2). La raíz de
    100 es 10.
- titulo: 'Respecto de «Reconocimiento de diferencia de cuadrados perfectos»: ¿Es
    correcta esta caracte'
  enunciado: 'Respecto de «Reconocimiento de diferencia de cuadrados perfectos»: ¿Es
    correcta esta caracterización? «La diferencia de cuadrados se factoriza en el
    producto de dos binomios conjugados: la suma de las raíces de los cuadrados por
    su diferencia: $a^2 - b^2 = (a+b)(a-b)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: La diferencia de cuadrados se
    factoriza en el producto de dos binomios conjugados: la suma de las raíces de
    los cuadrados por su diferencia: $a^2 - b^2 = (a+b)(a-b)$.'
- titulo: 'Respecto de «Reconocimiento de diferencia de cuadrados perfectos»: ¿Es
    válida esta afirmació'
  enunciado: 'Respecto de «Reconocimiento de diferencia de cuadrados perfectos»: ¿Es
    válida esta afirmación? «Dividir el exponente entre 4 en lugar de 2 al sacar raíz
    cuadrada de exponentes mayores»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: La diferencia de cuadrados se
    factoriza en el producto de dos binomios conjugados: la suma de las raíces de
    los cuadrados por su diferencia: $a^2 - b^2 = (a+b)(a-b)$.'
errores_frecuentes:
- Dividir el exponente entre 4 en lugar de 2 al sacar raíz cuadrada de exponentes
  mayores.
- Pensar que la factorización de $(a^2 - b^2)$ es $(a-b)^2$.
- Intentar aplicar el método si hay un signo '+$' en medio (ej. $x^2 + 4$).
- Para «¿Cuál es el resultado general de factorizar una diferencia de cuadrados»,
  la respuesta correcta es Un trinomio.
- Para «¿Cuál es el resultado general de factorizar una diferencia de cuadrados»,
  la respuesta correcta es Un binomio al cuadrado.
afirmaciones_verdaderas:
- Factorizar consiste en transformar una suma algebraica en un producto de factores.
al_terminar_debes_poder: Descomponer en factores irreducibles expresiones algebraicas
  aplicando reconocimiento de diferencia de cuadrados perfectos.
