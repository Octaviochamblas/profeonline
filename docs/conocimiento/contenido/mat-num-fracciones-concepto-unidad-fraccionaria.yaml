semantic_id: MAT.NUM.FRACCIONES_CONCEPTO.UNIDAD_FRACCIONARIA
resumen_inicial: La unidad fraccionaria es cada una de las partes iguales de la forma $\frac{1}{b}$ en que se divide la unidad entera.
explicacion_simple: 'Una unidad fraccionaria es el trozo básico o ladrillo fundamental de construcción de cualquier fracción. Se forma tomando una sola parte ($1$) del total de divisiones ($b$), representándose como $\frac{1}{b}$. Cualquier otra fracción se construye sumando varias de estas unidades fraccionarias.


  ![Concepto de unidad fraccionaria](/static/img/nodos/concepto-de-unidad-fraccionaria-intro.svg)'
explicacion_formal: 'Para un denominador $b \in \mathbb{N}$, la **Unidad Fraccionaria Fundamental** $u_b$ se define formalmente como el racional con numerador unitario:


  $$u_b = \frac{1}{b} \quad \text{tal que } \sum_{i=1}^b u_b = b \cdot \left(\frac{1}{b}\right) = 1$$


  **Desglose de la fórmula:**

  - $\frac{1}{b}$: Elemento base irreducible de medida para un denominador $b$.

  - Reconstrucción de la fracción: $\frac{a}{b} = \underbrace{\frac{1}{b} + \frac{1}{b} + \dots + \frac{1}{b}}_{a \text{ veces}}$.


  > **Complemento didáctico:** La unidad fraccionaria de los quintos es $\frac{1}{5}$, de los octavos es $\frac{1}{8}$ y de los tercios es $\frac{1}{3}$.'
definiciones_clave: '- **Unidad fraccionaria**: Fracción de la forma $\frac{1}{b}$ que representa un único trozo elemental de la partición.'
propiedades_relaciones: '- **Composición multiplicativa**: Cualquier fracción $\frac{a}{b} = a \cdot \left(\frac{1}{b}\right)$ es un múltiplo entero de su unidad fraccionaria.'
ejemplo_guiado:
  enunciado: 'Identifique la unidad fraccionaria de la fracción $\frac{5}{6}$ y exprese $\frac{5}{6}$ como suma de sus unidades fraccionarias.


    ![Ejemplo Concepto de unidad fraccionaria](/static/img/nodos/concepto-de-unidad-fraccionaria-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar el denominador de la fracción: $b = 6$.'
  - 'Paso 2: Formar la unidad fraccionaria asignando $1$ al numerador: $\frac{1}{6}$.'
  - 'Paso 3: Expresar como suma de $5$ unidades fraccionarias: $\frac{5}{6} = \frac{1}{6} + \frac{1}{6} + \frac{1}{6} + \frac{1}{6} + \frac{1}{6}$.'
  - 'Conclusión: La unidad fraccionaria es $\frac{1}{6}$.'
checkpoints:
