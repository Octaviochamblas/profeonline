    is_correct: false
  - text: La fracción 0/b
    is_correct: false
  explanation: La alternativa correcta es 'La fracción 1/b con numerador igual a 1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5/6, ¿cuál es su unidad fraccionaria?
  choices:
  - text: 1/6
    is_correct: true
  - text: 5/6
    is_correct: false
  - text: 6/1
    is_correct: false
  - text: 1/5
    is_correct: false
  explanation: La alternativa correcta es '1/6'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar el denominador $b$ de la fracción dada.'
- 'Paso 2: Reemplazar el numerador por el número $1$ para construir $\frac{1}{b}$.'
- 'Paso 3: Declarar $\frac{1}{b}$ como la unidad fraccionaria base de la expresión.'
errores_correccion: '- **Error 1: Creer que la unidad fraccionaria cambia si el numerador aumenta.** **Cómo corregirlo:** La unidad fraccionaria depende ÚNICAMENTE del denominador (siempre tiene numerador 1).


  - **Error 2: Confundir la unidad fraccionaria $\frac{1}{b}$ con el número entero $1$.** **Cómo corregirlo:** $\frac{1}{b}$ es un trozo individual, mientras que $1$ representa el todo completo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la unidad fraccionaria de 4/9?
  alternativas:
  - 1/9
  - 4/1
  - 1/4
  respuesta: 1/9
  solucion_pasos:
  - 'Se toma el denominador 9 y se pone 1 en el numerador: 1/9.'
- titulo: Ejemplo 2
  enunciado: ¿Cuántas unidades fraccionarias de 1/8 se necesitan para formar 7/8?
  alternativas:
  - 7 unidades fraccionarias
  - 8 unidades fraccionarias
  - 1 unidad fraccionaria
  respuesta: 7 unidades fraccionarias
  solucion_pasos:
  - $7 \cdot \frac{1}{8} = \frac{7}{8}$.
- titulo: ¿Es 1/10 la unidad fraccionaria de 3/10?
  respuesta: Sí
  solucion_pasos:
  - Sí, la unidad fraccionaria para un denominador 10 es 1/10.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la interpretación y cálculo analizado.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la identificación analítica de términos y modelos fraccionarios arroja una respuesta única y precisa.
  - texto: No es posible representarlo como fracción
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del ejercicio permiten modelar y extraer el numerador y denominador con exactitud.
- titulo: ¿Es la unidad fraccionaria de 2/5 igual a 2/1?
  respuesta: 'No'
  solucion_pasos:
  - No, la unidad fraccionaria tiene numerador 1, siendo 1/5.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente a la interpretación y cálculo analizado.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la identificación analítica de términos y modelos fraccionarios arroja una respuesta única y precisa.
  - texto: No es posible representarlo como fracción
    es_correcta: false
    retroalimentacion: Incorrecto, los datos del ejercicio permiten modelar y extraer el numerador y denominador con exactitud.
errores_frecuentes:
- La unidad fraccionaria de una fracción adopta el mismo numerador que la fracción original.
- Sumar $b$ veces la unidad fraccionaria $1/b$ da como resultado un número infinito.
- La unidad fraccionaria es un término que aplica únicamente a denominadores pares.
- La fracción $1/b$ representa la unidad entera completa en lugar de una porción.
- Multiplicar una unidad fraccionaria por cero produce el denominador original.
afirmaciones_verdaderas:
- La unidad fraccionaria es cada una de las partes de la forma $\frac{1}{b}$ en que se ha dividido el entero.
- Cualquier fracción $\frac{a}{b}$ equivale a la suma o multiplicación de $a$ unidades fraccionarias $\frac{1}{b}$.
al_terminar_debes_poder: '**QUÉ:** Comprender, calcular y descomponer números racionales en términos de su unidad fraccionaria base.


  **CÓMO:** Definiendo la unidad fraccionaria como $u_b = \frac{1}{b}$ ($b \in \mathbb{N}$), expresando toda fracción como suma o producto de unidades $\frac{a}{b} = a \cdot \frac{1}{b}$ y calculando el complemento aditivo para reconstruir la unidad entera $1 - \frac{a}{b}$.


  ![Resumen Concepto de unidad fraccionaria](/static/img/nodos/concepto-de-unidad-fraccionaria-resumen.svg)'
