semantic_id: MAT.NUM.FRACCIONES_CONCEPTO.UNIDAD_FRACCIONARIA
resumen_inicial: "Una unidad fraccionaria es una fracción que tiene como numerador exactamente $1$, representando cada una de las partes individuales en que se dividió el entero."
explicacion_simple: |
  Piensa en la unidad fraccionaria como si fuera el 'ladrillo básico' para construir cualquier fracción. Si cortas una tarta en 6 partes iguales, cada una de esas partes por separado vale $\frac{1}{6}$. Esa porción individual es la unidad fraccionaria. Si quieres formar $\frac{5}{6}$, simplemente juntas 5 de esos ladrillos de $\frac{1}{6}$. Todo entero dividido en $b$ partes iguales se construye juntando $b$ unidades fraccionarias.
explicacion_formal: |
  Algebraicamente, se denomina **unidad fraccionaria** a toda fracción de la forma:
  $$\frac{1}{b} \quad \text{con } b \in \mathbb{Z}^+$$
  que representa exactamente $1$ de las $b$ partes iguales en que se subdivide la unidad de referencia.

  Toda fracción $\frac{a}{b}$ con $a \in \mathbb{Z}$ es una combinación lineal o múltiplo entero de su respectiva unidad fraccionaria:
  $$\frac{a}{b} = \sum_{k=1}^a \frac{1}{b} = a \cdot \left(\frac{1}{b}\right)$$
  Asimismo, la suma de $b$ unidades fraccionarias idénticas reconstruye de manera exacta la unidad entera:
  $$\underbrace{\frac{1}{b} + \frac{1}{b} + \dots + \frac{1}{b}}_{b\text{ veces}} = \frac{b}{b} = 1$$
definiciones_clave: |
  - **Unidad fraccionaria**: Fracción que tiene por numerador la unidad ($1$) y por denominador un entero positivo $b$.
  - **Base fraccionaria**: Rol generador de $\frac{1}{b}$ como unidad de medida para construir cualquier otra fracción de denominador $b$.
  - **Reconstrucción del entero**: Propiedad por la cual sumar $b$ veces la unidad fraccionaria $\frac{1}{b}$ da como resultado exactamente $1$.
propiedades_relaciones: |
  - **Generación multiplicativa**: Cualquier fracción $\frac{a}{b}$ se obtiene multiplicando el numerador $a$ por la unidad fraccionaria $\frac{1}{b}$.
  - **Inverso multiplicativo del entero**: La unidad fraccionaria $\frac{1}{b}$ coincide exactamente con el recíproco o inverso multiplicativo del entero $b$ ($b \cdot \frac{1}{b} = 1$).
  - **Orden de unidades fraccionarias**: Entre dos unidades fraccionarias distintas $\frac{1}{b_1}$ y $\frac{1}{b_2}$, es mayor aquella que tiene menor denominador ($b_1 < b_2 \implies \frac{1}{b_1} > \frac{1}{b_2}$).
ejemplo_guiado:
  enunciado: "Identifica la unidad fraccionaria asociada a un entero dividido en $10$ partes iguales, expresa la fracción $\\frac{7}{10}$ mediante su unidad fraccionaria y calcula cuántas unidades fraccionarias faltan para completar $1$ entero."
  pasos:
    - "Determinar la unidad fraccionaria: dado que el entero se divide en $10$ partes iguales, su unidad fraccionaria es $\\frac{1}{10}$."
    - "Expresar $\\frac{7}{10}$ en función de la unidad fraccionaria: $\\frac{7}{10} = 7 \\cdot \\left(\\frac{1}{10}\\right)$ (es decir, $7$ unidades fraccionarias)."
    - "Calcular las unidades faltantes para la unidad completa: un entero requiere $10$ unidades fraccionarias de $\\frac{1}{10}$. Si se tienen $7$, faltan $10 - 7 = 3$ unidades fraccionarias de $\\frac{1}{10}$ (equivalente a $\\frac{3}{10}$)."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué relación matemática existe entre la unidad fraccionaria $\\frac{1}{b}$ y el entero $b$?"
    choices:
      - {text: "La unidad fraccionaria \\frac{1}{b} es el inverso multiplicativo del entero $b$, cumpliendo que $b \\cdot \\frac{1}{b} = 1$.", is_correct: true}
      - {text: "La unidad fraccionaria \\frac{1}{b} es el opuesto o inverso aditivo del entero $b$.", is_correct: false}
      - {text: "La unidad fraccionaria \\frac{1}{b} es siempre el doble del entero $b$.", is_correct: false}
      - {text: "No existe ninguna relación matemática entre $\\frac{1}{b}$ y el entero $b$.", is_correct: false}
    explanation: "La correcta es La unidad fraccionaria \\frac{1}{b} es el inverso multiplicativo del entero $b$, cumpliendo que $b \\cdot \\frac{1}{b} = 1$.: al multiplicar el entero $b$ por su parte unitaria $\\frac{1}{b}$ se obtiene la unidad $1$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Si se reúnen $9$ unidades fraccionarias de $\\frac{1}{5}$, ¿cuál es el resultado expresado como fracción e interpretación?"
    choices:
      - {text: "\\frac{9}{5}, que representa $1$ entero completo más $4$ unidades fraccionarias de $\\frac{1}{5}$.", is_correct: true}
      - {text: "\\frac{5}{9}, que representa menos de medio entero.", is_correct: false}
      - {text: "\\frac{1}{45}, que representa una fracción muy pequeña.", is_correct: false}
      - {text: "$9$ enteros completos sin fraccionar.", is_correct: false}
    explanation: "La correcta es \\frac{9}{5}, que representa $1$ entero completo más $4$ unidades fraccionarias de $\\frac{1}{5}$.: $9 \\cdot \\frac{1}{5} = \\frac{9}{5} = 1 + \\frac{4}{5}$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el denominador $b$ que indica en cuántas partes iguales se dividió el entero."
  - "Paso 2: Escribir la unidad fraccionaria anteponiendo el número $1$ como numerador: $\\frac{1}{b}$."
  - "Paso 3: Expresar cualquier fracción $\\frac{a}{b}$ sumando o multiplicando $a$ por $\\frac{1}{b}$."
errores_correccion: |
  Un error común es creer que la unidad fraccionaria cambia su numerador según las partes tomadas (por ejemplo, pensar que en $\frac{3}{8}$ la unidad fraccionaria es $\frac{3}{8}$). La unidad fraccionaria **siempre** tiene numerador $1$; el $3$ indica cuántas de esas unidades fraccionarias se han agrupado.
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál es la unidad fraccionaria de una pizza dividida en 8 porciones iguales y cuántas de ellas se necesitan para formar $\\frac{5}{8}$?"
    alternativas:
      - "La unidad fraccionaria es \\frac{1}{8} y se necesitan 5 de ellas."
      - "La unidad fraccionaria es \\frac{5}{8} y se necesita 1 de ella."
      - "La unidad fraccionaria es \\frac{1}{5} y se necesitan 8 de ellas."
    respuesta: "La unidad fraccionaria es \\frac{1}{8} y se necesitan 5 de ellas."
    solucion_pasos:
      - "Cada porción individual representa la unidad fraccionaria $\\frac{1}{8}$."
      - "Para construir $\\frac{5}{8}$ se toman $5$ partes individuales de $\\frac{1}{8}$."
  - titulo: "Ejemplo 2"
    enunciado: "Compara las unidades fraccionarias $\\frac{1}{3}$ y $\\frac{1}{7}$. ¿Cuál de ellas representa una porción más grande del entero?"
    alternativas:
      - "\\frac{1}{3} es mayor que \\frac{1}{7} porque dividir en 3 partes genera trozos más grandes que dividir en 7."
      - "\\frac{1}{7} es mayor que \\frac{1}{3} porque 7 es un número mayor que 3."
      - "Ambas unidades fraccionarias son exactamente iguales porque ambas tienen numerador 1."
    respuesta: "\\frac{1}{3} es mayor que \\frac{1}{7} porque dividir en 3 partes genera trozos más grandes que dividir en 7."
    solucion_pasos:
      - "Comparando unidades fraccionarias: $\\frac{1}{3} > \\frac{1}{7}$."
      - "Al dividir un entero en menos partes ($3$), el tamaño de cada unidad fraccionaria es mayor."
  - titulo: "¿Cualquier fracción $\\frac{a}{b}$ se puede descomponer como la suma repetida de la unidad fraccionaria $\\frac{1}{b}$?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, por definición $\\frac{a}{b} = \\frac{1}{b} + \\frac{1}{b} + \\dots + \\frac{1}{b}$ ($a$ veces)."
  - titulo: "¿Es $\\frac{1}{1}$ una unidad fraccionaria que representa el entero completo sin dividir?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, con $b=1$, la unidad fraccionaria es $\\frac{1}{1} = 1$, que corresponde al entero completo."
errores_frecuentes:
  - "Creer que la unidad fraccionaria de $\\frac{a}{b}$ varía su numerador según el valor de $a$."
  - "Pensar que las unidades fraccionarias con denominadores más grandes representan trozos más grandes."
  - "Confundir la unidad fraccionaria $\\frac{1}{b}$ con el entero $b$ sin la barra de fracción."
  - "Olvidar que para reconstruir la unidad entera se deben sumar exactamente $b$ unidades fraccionarias."
  - "Considerar que $\\frac{1}{0}$ es una unidad fraccionaria válida (ignorando la restricción de denominador no nulo)."
afirmaciones_verdaderas:
  - "Toda unidad fraccionaria tiene por numerador el número 1 y por denominador un entero positivo $b$."
  - "Al sumar $b$ veces la unidad fraccionaria $\\frac{1}{b}$ se obtiene exactamente la unidad entera $1$."
al_terminar_debes_ponder: |
  Debes ser capaz de identificar la unidad fraccionaria $\frac{1}{b}$ de cualquier contexto, descomponer fracciones como múltiplos de su unidad fraccionaria y comparar el tamaño relativo de distintas unidades fraccionarias.
