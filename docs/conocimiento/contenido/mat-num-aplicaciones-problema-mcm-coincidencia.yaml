semantic_id: MAT.NUM.APLICACIONES_MCM_MCD.PROBLEMA_MCM_COINCIDENCIA
resumen_inicial: Los problemas de coincidencia periódica o repetición en el tiempo
  se resuelven calculando el m.c.m. de las frecuencias.
explicacion_simple: Cuando enfrentamos un problema verbal que involucra eventos que
  se repiten periódicamente a distintos intervalos de tiempo (como buses que salen
  cada ciertos minutos, luces que parpadean o fármacos tomados cada ciertas horas),
  la clave para hallar el momento en que coincidirán es calcular el mínimo común múltiplo.
explicacion_formal: 'En la **Modelación de Coincidencia Periódica**, si $k$ procesos
  poseen ciclos de período $t_1, t_2, \dots, t_k$, el **Intervalo de Coincidencia
  Simultánea** $T_{\text{coincidencia}}$ se define por:


  $$T_{\text{coincidencia}} = \operatorname{mcm}(t_1, t_2, \dots, t_k)$$


  **Desglose de la fórmula:**

  - $t_i$: Período del ciclo $i$.

  - $T_{\text{coincidencia}}$: Tiempo transcurrido hasta la primera coincidencia simultánea
  desde el origen común $t=0$.


  > **Complemento didáctico:** Palabras clave en el enunciado como ''coincidir'',
  ''volver a encontrarse'', ''juntos al mismo tiempo'' o ''repetición simultánea''
  señalan el uso del m.c.m.'
definiciones_clave: '- **Problema de coincidencia**: Contexto de aplicación donde
  varios ciclos de distinta frecuencia se sincronizan.

  - **Sincronización periódica**: Momento en que dos o más eventos periódicos ocurren
  simultáneamente.'
ejemplo_guiado:
  enunciado: Un medicamento A se toma cada 6 horas y un medicamento B cada 8 horas.
    Si se toman juntos a las 8:00 AM, ¿en cuántas horas volverán a tomarse juntos?
  pasos:
  - 'Paso 1: Identificar que es un problema de coincidencia periódica en el tiempo.'
  - 'Paso 2: Calcular el mínimo común múltiplo de las frecuencias: $\operatorname{mcm}(6,
    8)$.'
  - 'Paso 3: Obtenemos $6 = 2 \cdot 3$ y $8 = 2^3 \implies \operatorname{mcm}(6, 8)
    = 2^3 \cdot 3 = 24$.'
  - 'Conclusión: Volverán a tomarse juntos dentro de $24$ horas (a las 8:00 AM del
    día siguiente).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué herramienta matemática se utiliza para resolver problemas de coincidencia
    periódica en el tiempo?
  choices:
  - text: El mínimo común múltiplo (m.c.m.)
    is_correct: true
  - text: El máximo común divisor (M.C.D.)
    is_correct: false
  - text: La suma directa de los tiempos
    is_correct: false
  - text: La resta de las frecuencias
    is_correct: false
  explanation: La alternativa correcta es 'El mínimo común múltiplo (m.c.m.)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado de los medicamentos tomados cada 6 y 8 horas, ¿cuál
    fue el tiempo de coincidencia?
  choices:
  - text: 24 horas
    is_correct: true
  - text: 48 horas
    is_correct: false
  - text: 14 horas
    is_correct: false
  - text: 2 horas
    is_correct: false
  explanation: La alternativa correcta es '24 horas'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los períodos o frecuencias numéricas del enunciado.'
- 'Paso 2: Calcular el mínimo común múltiplo de dichos períodos.'
- 'Paso 3: Interpretar el resultado obtenido como el tiempo o la distancia hasta la
  coincidencia.'
errores_correccion: '- **Error 1: Calcular el M.C.D. en lugar del m.c.m. en problemas
  de coincidencia.** **Cómo corregirlo:** Si los eventos se repiten hacia adelante
  en el tiempo, el resultado debe ser mayor (m.c.m.).


  - **Error 2: Sumar los períodos en lugar de calcular el m.c.m.** **Cómo corregirlo:**
  La coincidencia exige divisibilidad común de las frecuencias.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Tres buses salen de una terminal cada 10, 15 y 20 minutos. Si coinciden
    a las 12:00, ¿a qué hora coinciden de nuevo?
  alternativas:
  - A las 13:00 (60 minutos)
  - A las 12:45
  - A las 14:00
  respuesta: A las 13:00 (60 minutos)
  solucion_pasos:
  - $\operatorname{mcm}(10, 15, 20) = 60$ minutos = 1 hora. Coinciden a las 13:00.
- titulo: Ejemplo 2
  enunciado: Dos atletas corren en una pista circular tardando 40 y 60 segundos por
    vuelta. ¿Cuándo se cruzan en la meta?
  alternativas:
  - A los 120 segundos
  - A los 240 segundos
  - A los 20 segundos
  respuesta: A los 120 segundos
  solucion_pasos:
  - $\operatorname{mcm}(40, 60) = 120$ segundos.
- titulo: ¿Se utiliza el m.c.m. para calcular el momento en que varios eventos periódicos
    coinciden?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la aplicación clásica del m.c.m.
- titulo: ¿Se usa el M.C.D. para saber cuándo coincidirán dos buses que salen a diferentes
    horas?
  respuesta: 'No'
  solucion_pasos:
  - No, para coincidencias futuras se aplica el m.c.m.
errores_frecuentes:
- Los problemas de coincidencia periódica en el tiempo se resuelven usando el máximo
  común divisor.
- Para saber cuándo se cruzan dos eventos basta con multiplicar directamente sus tiempos
  y sumarlos.
- El tiempo de coincidencia de dos ciclos periódicos es siempre menor que ambos períodos.
- Tres eventos con distintas frecuencias no pueden volver a coincidir nunca en el
  tiempo.
- La coincidencia de dos frecuencias exige calcular la resta entre el tiempo mayor
  y el menor.
afirmaciones_verdaderas:
- Los problemas de encuentro o coincidencia simultánea se resuelven mediante el mínimo
  común múltiplo.
- El m.c.m. entrega el menor tiempo futuro donde coinciden dos o más ciclos periódicos.
al_terminar_debes_poder: Al terminar serás capaz de resolver problemas verbales de
  coincidencia periódica, aplicando el m.c.m. sobre las frecuencias para hallar la
  primera repetición simultánea.
