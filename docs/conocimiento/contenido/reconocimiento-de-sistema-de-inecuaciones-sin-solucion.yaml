semantic_id: MAT.ALG.SISTEMAS_INECUACIONES.SISTEMA_SIN_SOLUCION
resumen_inicial: Un sistema de inecuaciones no tiene solución ($S = \emptyset$) si
  los intervalos individuales no tienen ningún punto en común (su intersección es
  vacía).
explicacion_simple: 'Si al resolver las inecuaciones obtenemos por ejemplo $x < 2$
  (números menores a 2) y $x > 5$ (números mayores a 5):

  No existe ningún número real en todo el universo que sea menor que 2 y mayor que
  5 al mismo tiempo.

  En la recta numérica, los dos rayados van en direcciones opuestas y jamás se cruzan.

  Por lo tanto, la intersección es vacía y el sistema **NO TIENE SOLUCIÓN** ($S =
  \emptyset$).'
explicacion_formal: 'Dado un sistema de inecuaciones con soluciones individuales $S_1$
  y $S_2$, la **condición de inconsistencia del sistema** se define como:


  $$S_1 \cap S_2 = \emptyset$$


  **Desglose de la fórmula:**

  - $S = \emptyset$: Conjunto vacío. Ausencia total de traslape espacial sobre la
  recta real.'
definiciones_clave: '- **Sistema de inecuaciones inconsistente / incompatible**: Sistema
  cuyo conjunto solución es el conjunto vacío ($S = \emptyset$).

  - **Intersección vacía ($S_1 \cap S_2 = \emptyset$)**: Situación matemática donde
  los intervalos no comparten ningún elemento común.'
propiedades_relaciones: '- **Disyunción de conjuntos**: $S_1$ y $S_2$ son conjuntos
  disjuntos.'
ejemplo_guiado:
  enunciado: Resuelve el sistema $\begin{cases} x < 1 \\ x \ge 4 \end{cases}$, grafica
    los intervalos y determina su conjunto solución global $S$.
  pasos:
  - 'Paso 1: Identificar $S_1 = ]-\infty, 1[$ (números menores que 1).Paso 2: Identificar
    $S_2 = [4, +\infty[$ (números mayores o iguales a 4).Paso 3: Graficar en la recta
    real: el primer rayado va a la izquierda de $1$ y el segundo a la derecha de $4$.Paso
    4: Notar que no existe ningún punto de cruce entre ambos rayados ($S_1 \cap S_2
    = \emptyset$).Paso 5: Declarar que el sistema NO TIENE SOLUCIÓN ($S = \emptyset$).'
checkpoints:
- placement: after_explicacion_formal
  question: Al resolver el sistema $\begin{cases} x < 1 \\ x \ge 4 \end{cases}$, ¿cuál
    es su conjunto solución $S$?
  choices:
  - text: $S = \emptyset$ (conjunto vacío, no tiene solución)
    is_correct: true
  - text: $S = ]1, 4]$
    is_correct: false
  - text: $S = ]-\infty, +\infty[$
    is_correct: false
  - text: $S = \{1, 4\}$
    is_correct: false
  explanation: La alternativa correcta es '$S = \emptyset$ (conjunto vacío, no tiene
    solución)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se reconoce visualmente en la recta numérica que un sistema de inecuaciones
    no tiene solución?
  choices:
  - text: Porque los sombreados de los intervalos van en direcciones opuestas y no
      existe ninguna zona de doble rayado.
    is_correct: true
  - text: Porque la recta numérica se borra.
    is_correct: false
  - text: Porque todos los círculos son negros.
    is_correct: false
  - text: Porque hay dos respuestas numéricas.
    is_correct: false
  explanation: La alternativa correcta es 'Porque los sombreados de los intervalos
    van en direcciones opuestas y no existe ninguna zona de doble rayado.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver individualmente las inecuaciones obteniendo $S_1$ y $S_2$.'
- 'Paso 2: Dibujar los rayados de $S_1$ y $S_2$ en la recta numérica.'
- 'Paso 3: Verificar si existe al menos un punto donde ambos rayados se crucen.'
- 'Paso 4: Si no hay traslape, concluir $S = \emptyset$.'
errores_correccion: '- **Error común:** Inventar un intervalo arbitrario como $]1,
  4]$ cuando los rayados van hacia afuera sin cruzarse.

  - **Cómo corregirlo:** Si no hay cruzamiento de líneas, NO hay intervalo solución;
  la respuesta correcta es el conjunto vacío $\emptyset$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de un sistema de inecuaciones requiere calcular la intersección
    de soluciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se exige la simultaneidad de todas las desigualdades.
- titulo: ¿Si dos intervalos no se cruzan en la recta numérica el sistema no tiene
    solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, la intersección es vacía ($S = \\emptyset$).
errores_frecuentes:
  - 'Un sistema formado por las inecuaciones $x < 2$ y $x > 5$ tiene como solución el intervalo $]2, 5[$.'
  - 'Reconocer que un sistema no tiene solución ($S = \emptyset$) implica que el despeje algebraico individual fue erróneo.'
  - 'Si la intersección gráfica de dos inecuaciones no muestra solapamiento de líneas, la solución es el número cero ($x = 0$).'
  - 'El sistema $x \le 1$ y $x \ge 4$ posee soluciones reales dentro de los números negativos.'
  - 'Un sistema de inecuaciones sin solución equivale a una inecuación con solución real total $S = \mathbb{R}$.'
afirmaciones_verdaderas:
  - 'Un sistema de inecuaciones carece de solución ($S = \emptyset$) cuando las regiones solución de sus inecuaciones individuales no tienen ningún punto en común.'
  - 'La ausencia de solapamiento gráfico entre los tramos sombreados de las inecuaciones confirma que el conjunto solución es el conjunto vacío.'
al_terminar_debes_poder: |
  QUÉ: Reconocer e identificar sistemas de inecuaciones lineales que carecen de solución en $\mathbb{R}$.
  CÓMO: Resolver cada inecuación por separado, graficar las soluciones en una misma recta real, verificar la falta de solapamiento y declarar $S = \emptyset$.
