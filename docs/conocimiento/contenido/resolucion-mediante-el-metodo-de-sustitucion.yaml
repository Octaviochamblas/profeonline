semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_SUSTITUCION
resumen_inicial: El método de sustitución consiste en despejar una de las incógnitas en una de las ecuaciones del sistema y reemplazar su expresión algebraica en la otra ecuación.
explicacion_simple: |
  Para resolver un sistema $2 \times 2$ mediante el método de **sustitución**:

  1. Seleccionamos la variable que resulte más sencilla de aislar en cualquiera de las dos ecuaciones.
  2. Despejamos esa variable expresándola en función de la otra (por ejemplo $y = 7 - 2x$).
  3. Reemplazamos entre paréntesis esa expresión en la **otra** ecuación del sistema.
  4. Resolvemos la ecuación lineal de una sola variable resultante y finalmente sustituimos ese valor para hallar la segunda variable.
explicacion_formal: |
  ### Definición formal
  Dado el sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$, el **algoritmo algebraico de sustitución** ejecuta la secuencia:

  $$\text{1. Despeje de } y \text{ en Ecuación 1: } y = \frac{c_1 - a_1 x}{b_1} \quad (b_1 \neq 0)$$

  $$\text{2. Sustitución en Ecuación 2: } a_2 x + b_2 \left(\frac{c_1 - a_1 x}{b_1}\right) = c_2$$

  $$\text{3. Resolución de la ecuación lineal en } x \implies x = x_0 \quad \text{y sustitución en el despeje: } y_0 = \frac{c_1 - a_1 x_0}{b_1}$$

  ### Síntesis didáctica
  Este método resulta especialmente eficiente cuando al menos uno de los coeficientes de las variables del sistema es igual a $1$ o $-1$.
definiciones_clave: |
  - **Método de sustitución**: Técnica algebraica de resolución basada en reemplazar el despeje de una variable en la ecuación complementaria.
  - **Expresión despejada auxiliar**: Expresión equivalente que relaciona las dos incógnitas y permite la eliminación temporal de una de ellas.
propiedades_relaciones: |
  - **Selección de la variable conveniente**: Aislar una incógnita con coeficiente $1$ evita trabajar con fracciones algebraicas intermedias.
  - **Preservación del conjunto solución**: Las transformaciones algebraicas por sustitución conservan exactamente la misma solución $(x_0, y_0)$.
ejemplo_guiado:
  enunciado: 'Resuelve por el método de sustitución el sistema $\begin{cases} 2x + y = 7 \\ 3x - 2y = 7 \end{cases}$ y evalúa el par solución $(x, y)$.'
  pasos:
    - 'Paso 1: Despejar la variable $y$ en la primera ecuación por tener coeficiente 1: $y = 7 - 2x$.'
    - 'Paso 2: Sustituir la expresión de $y$ entre paréntesis en la segunda ecuación: $3x - 2(7 - 2x) = 7$.'
    - 'Paso 3: Aplicar la propiedad distributiva y reducir términos semejantes: $3x - 14 + 4x = 7 \implies 7x - 14 = 7$.'
    - 'Paso 4: Trasponer $-14$ sumando y despejar $x$: $7x = 21 \implies x = 3$.'
    - 'Paso 5: Reemplazar $x = 3$ en la expresión despejada de $y$: $y = 7 - 2(3) = 7 - 6 = 1$.'
    - 'Paso 6: Concluir que el par ordenado solución es $(x, y) = (3, 1)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al sustituir la expresión $y = 7 - 2x$ en la segunda ecuación $3x - 2y = 7$, ¿cuál es la ecuación lineal resultante en una sola variable?'
    choices:
      - {text: '$3x - 2(7 - 2x) = 7$', is_correct: true}
      - {text: '$3x - 2(7 + 2x) = 7$', is_correct: false}
      - {text: '$3(7 - 2x) - 2y = 7$', is_correct: false}
      - {text: '$3x - 14 - 2x = 7$', is_correct: false}
    explanation: 'La alternativa correcta es ''$3x - 2(7 - 2x) = 7$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al finalizar la resolución del sistema por sustitución, ¿cuál es el par ordenado solución $(x, y)$?'
    choices:
      - {text: '$(3, 1)$', is_correct: true}
      - {text: '$(1, 3)$', is_correct: false}
      - {text: '$(2, 3)$', is_correct: false}
      - {text: '$(3, 7)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(3, 1)$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la variable con el coeficiente numérico más simple ($1$ o $-1$) en cualquiera de las ecuaciones.'
  - 'Paso 2: Despejar dicha variable en la ecuación elegida en función de la otra incógnita.'
  - 'Paso 3: Sustituir la expresión despejada entre paréntesis en la otra ecuación del sistema.'
  - 'Paso 4: Resolver la ecuación lineal de una sola variable para hallar la primera coordenada.'
  - 'Paso 5: Sustituir el valor hallado en la expresión despejada del Paso 2 para calcular la segunda coordenada.'
errores_correccion: |
  - **Error 1:** Sustituir la expresión despejada en la MISMA ecuación de donde fue extraída (obteniendo una identidad no informativa como $7 = 7$). **Cómo corregirlo:** La expresión despejada de la Ecuación 1 **DEBE SUSTITUIRSE OBLIGATORIAMENTE EN LA ECUACIÓN 2 (LA ECUACIÓN COMPLEMENTARIA)**.
  - **Error 2:** Omitir paréntesis al multiplicar el coeficiente por la expresión despejada compuesta. **Cómo corregirlo:** Toda expresión compuesta que se sustituye **DEBE ENCERRARSE ENTRE PARÉNTESIS AL SER MULTIPLICADA POR EL COEFICIENTE DE ESA VARIABLE (ESCRIBIR $-2(7 - 2x)$)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Resuelve por sustitución el sistema $\begin{cases} x = y + 2 \\ 2x + y = 10 \end{cases}$.'
    alternativas:
      - '$(4, 2)$'
      - '$(2, 4)$'
      - '$(6, 4)$'
    respuesta: '$(4, 2)$'
    solucion_pasos:
      - '1. Sustituir $x = y + 2$ en la segunda ecuación: $2(y + 2) + y = 10$.'
      - '2. $2y + 4 + y = 10 \implies 3y = 6 \implies y = 2$.'
      - '3. $x = 2 + 2 = 4$. Solución: $(4, 2)$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'En el sistema $\begin{cases} y = 3x \\ x + y = 12 \end{cases}$, determina el valor de $x$.'
    alternativas:
      - '$x = 3$'
      - '$x = 4$'
      - '$x = 9$'
    respuesta: '$x = 3$'
    solucion_pasos:
      - '1. Sustituir $y = 3x$ en la segunda: $x + 3x = 12$.'
      - '2. $4x = 12 \implies x = 3$.'
  - titulo: 'Elección de ecuación'
    enunciado: '¿Es correcto despejar la variable en cualquiera de las dos ecuaciones del sistema?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, siempre que se sustituya en la ecuación contraria.'
  - titulo: 'Uso de paréntesis en sustitución'
    enunciado: '¿Reemplazar una suma o resta despejada exige colocar paréntesis?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, asegura la correcta aplicación de la propiedad distributiva.'
errores_frecuentes:
  - 'Al despejar $y = 7 - 2x$ en la primera ecuación del sistema, la expresión se sustituye en la misma primera ecuación produciendo la identidad $7 = 7$.'
  - 'Al sustituir la expresión despejada $y = 7 - 2x$ en la segunda ecuación $3x - 2y = 7$, se omiten los paréntesis resultando en $3x - 14 - 2x = 7$.'
  - 'Al resolver el sistema por sustitución y obtener $x = 3$, el proceso se concluye omitiendo el cálculo de la coordenada $y$.'
  - 'Al aplicar la propiedad distributiva en el término $-2(7 - 2x)$, el signo negativo no invierte el segundo sumando produciendo $-14 - 4x$.'
  - 'En el método de sustitución, el despeje inicial debe efectuarse obligatoriamente sobre la variable con el coeficiente numérico mayor.'
afirmaciones_verdaderas:
  - 'El método de sustitución consiste en aislar una incógnita en una ecuación y reemplazar su expresión en la otra.'
  - 'La sustitución de una expresión compuesta exige el uso de paréntesis para aplicar la propiedad distributiva del coeficiente.'
al_terminar_debes_poder: |
  QUÉ: Resolver sistemas de ecuaciones lineales 2x2 mediante el método de sustitución.
  CÓMO: Aislar una variable en una ecuación, sustituir su expresión entre paréntesis en la otra, despejar la primera incógnita y calcular la segunda.
