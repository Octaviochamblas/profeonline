semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_SUSTITUCION
resumen_inicial: 'Resolución mediante el método de sustitución: propiedades, resolución
  y modelamiento en Sistemas de ecuaciones lineales 2x2.'
explicacion_simple: relación algebraica. La Ecuación B ahora solo tiene letras 'x'.
  Se convirtió en una ecuación lineal de primer grado normal. La resuelves, descubres
  quién es 'x', y luego usas ese valor para descubrir finalmente quién era 'y'.
explicacion_formal: '### Definición formal


  El método de sustitución transforma un sistema $2\times2$ en una ecuación de una
  variable mediante equivalencias algebraicas. Si una de las ecuaciones permite escribir
  una incógnita como función de la otra, por ejemplo $x=\varphi(y)$ o $y=\psi(x)$,
  entonces esa expresión se reemplaza en la segunda ecuación.

  El sistema

  $$\begin{cases} E_1(x,y)=0,\\ E_2(x,y)=0 \end{cases}$$

  queda reducido a una ecuación en una sola variable. La solución obtenida se retrotrae
  luego a la expresión despejada para recuperar la otra incógnita.


  ### Desarrollo didáctico


  relación algebraica. La Ecuación B ahora solo tiene letras ''x''. Se convirtió en
  una ecuación lineal de primer grado normal. La resuelves, descubres quién es ''x'',
  y luego usas ese valor para descubrir finalmente quién era ''y''.'
definiciones_clave: '- **Resolución mediante el método de sustitución**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a resolución mediante el método de sustitución.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando resolución mediante
    el método de sustitución.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de resolución mediante
    el método de sustitución.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
