semantic_id: MAT.ALG.SISTEMAS_2X2.METODO_SUSTITUCION
resumen_inicial: El método de sustitución consiste en despejar una variable en una
  ecuación y reemplazar su expresión en la otra.
explicacion_simple: 'Para resolver un sistema 2x2 por **sustitución**:

  1. Elegimos la letra que sea más fácil de despejar en cualquiera de las dos ecuaciones.

  2. La despejamos (por ejemplo $y = 8 - 2x$).

  3. ''Sustituimos'' (reemplazamos) esa expresión en lugar de $y$ en la OTRA ecuación.

  4. Resolvemos la ecuación de una sola variable resultante y luego hallamos la otra
  letra.'
explicacion_formal: 'Dado el sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x +
  b_2 y = c_2 \end{cases}$, el **algoritmo de sustitución** ejecuta:


  $$\text{1. Despeje de } y: y = \frac{c_1 - a_1 x}{b_1} \quad (b_1 \neq 0)$$

  $$\text{2. Sustitución en Eq 2: } a_2 x + b_2 \left(\frac{c_1 - a_1 x}{b_1}\right)
  = c_2$$

  $$\text{3. Resolver la ecuación lineal en } x \text{ e ingresar } x \text{ para
  hallar } y.$$'
definiciones_clave: '- **Método de sustitución**: Técnica de resolución basada en
  reemplazar el despeje de una incógnita en la ecuación complementaria.

  - **Ecuación auxiliar de reemplazo**: Expresión despejada utilizada para efectuar
  la sustitución.'
propiedades_relaciones: '- **Eficiencia cuando hay coeficiente 1**: Es ideal cuando
  una de las variables tiene coeficiente $1$ o $-1$.'
ejemplo_guiado:
  enunciado: Resuelve por el método de sustitución el sistema $\begin{cases} 2x +
    y = 7 \\ 3x - 2y = 7 \end{cases}$ y evalúa el par solución $(x, y)$.
  pasos:
  - 'Paso 1: Despejar $y$ en la primera ecuación: $y = 7 - 2x$.Paso 2: Sustituir la
    expresión de $y$ en la segunda ecuación: $3x - 2(7 - 2x) = 7$.Paso 3: Aplicar
    la distributiva: $3x - 14 + 4x = 7 \implies 7x - 14 = 7$.Paso 4: Trasponer $-14$
    sumando: $7x = 21 \implies x = 3$.Paso 5: Reemplazar $x = 3$ en el despeje de
    $y$: $y = 7 - 2(3) = 7 - 6 = 1$.Paso 6: Concluir la solución $(x, y) = (3, 1)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al sustituir $y = 7 - 2x$ en la segunda ecuación $3x - 2y = 7$, ¿cuál
    es la ecuación obtenida en la variable $x$?
  choices:
  - text: $3x - 2(7 - 2x) = 7$
    is_correct: true
  - text: $3x - 2(7 + 2x) = 7$
    is_correct: false
  - text: $3(7 - 2x) - 2y = 7$
    is_correct: false
  - text: $3x - 14 - 2x = 7$
    is_correct: false
  explanation: La alternativa correcta es '$3x - 2(7 - 2x) = 7$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver el sistema por sustitución, ¿cuál es la solución del par $(x,
    y)$?
  choices:
  - text: $(3, 1)$
    is_correct: true
  - text: $(1, 3)$
    is_correct: false
  - text: $(2, 3)$
    is_correct: false
  - text: $(3, 7)$
    is_correct: false
  explanation: La alternativa correcta es '$(3, 1)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Seleccionar la variable y la ecuación más sencillas para despejar.'
- 'Paso 2: Escribir el despeje de esa variable en términos de la otra.'
- 'Paso 3: Reemplazar entre paréntesis esa expresión en la OTRA ecuación.'
- 'Paso 4: Resolver la ecuación lineal de una sola variable resultante.'
- 'Paso 5: Sustituir el valor encontrado en la expresión despejada inicial para hallar
  la otra variable.'
errores_correccion: '- **Error común:** Sustituir la expresión despejada en la MISMA
  ecuación de donde se extrajo (esto conduce a la identidad $7 = 7$ sin resolver nada).

  - **Cómo corregirlo:** La expresión despejada de la ecuación 1 DEBE sustituirse
  en la ECUACIÓN 2.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sistemas 2x2.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sistemas 2x2.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución de un sistema 2x2 debe satisfacer ambas ecuaciones?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la definición de solución de un sistema de ecuaciones.
- titulo: ¿La regla de Cramer requiere que el determinante del sistema sea distinto
    de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la división entre cero.
errores_frecuentes:
- Verificar la solución $(x, y)$ únicamente en la primera ecuación del sistema.
- Sustituir la expresión despejada en la misma ecuación de donde fue extraída al usar
  sustitución.
- Despejar variables distintas en cada ecuación antes de aplicar el método de igualación.
- Multiplicar solo el primer miembro al aplicar reducción olvidando el término constante.
- Calcular el determinante $2 \times 2$ sumando las diagonales en lugar de restarlas.
afirmaciones_verdaderas:
- Un sistema de ecuaciones 2x2 tiene como solución el par ordenado que satisface simultáneamente
  ambas ecuaciones.
- El método de reducción elimina una de las variables sumando combinaciones lineales
  de las ecuaciones.
al_terminar_debes_poder: Al finalizar este recurso podrás resolver, verificar y modelar
  sistemas de ecuaciones lineales 2x2 mediante los métodos algebraicos y matriciales.
