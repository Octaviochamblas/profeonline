semantic_id: MAT.ALG.MODELAMIENTO_DESIGUALDADES
resumen_inicial: El modelamiento con desigualdades permite traducir problemas contextuales con límites a modelos matemáticos basados en inecuaciones.
explicacion_simple: |
  Modelar con desigualdades consiste en traducir situaciones del mundo real donde hay un límite o restricción a lenguaje matemático.

  Si un problema dice "el gasto no puede superar los $\$24.000$", en lugar de una igualdad ($=$) planteamos una inecuación con operador de menor o igual ($\le$).
explicacion_formal: |
  Dada una situación contextual que involucra una magnitud desconocida $x \in \mathbb{R}$, el **modelamiento por desigualdades** expresa las condiciones de acotamiento como:

  $$C(x) \le K \quad \text{o} \quad C(x) \ge K$$

  **Desglose de la fórmula:**
  - $x$: Variable representativa de la cantidad desconocida.
  - $C(x)$: Expresión algebraica que modela la cantidad física o económica en función de $x$.
  - $K$: Cota fija límite dada por el enunciado.
definiciones_clave: |
  - **Modelamiento con desigualdades**: Proceso de representación algebraica de restricciones de límite mediante inecuaciones.
  - **Variable del modelo**: Letra (usualmente $x$ o $n$) que representa la cantidad incógnita objeto de análisis.
propiedades_relaciones: |
  - **Traducción de límites**: "No superar $K$" $\implies \le K$. "Exceder $K$" $\implies > K$. "Por lo menos $K$" $\implies \ge K$.
ejemplo_guiado:
  enunciado: Una persona dispone de $\$24.000$ para comprar cuadernos de $\$1.500$ cada uno. Modele la situación y determine cuántos cuadernos puede comprar como máximo.
  pasos:
    - 'Paso 1: Definir la variable: sea $x = \text{cantidad de cuadernos}$.'
    - 'Paso 2: Expresar el costo total: $1500x$.'
    - 'Paso 3: Formular la inecuación con la cota de dinero: $1500x \le 24000$.'
    - 'Paso 4: Despejar $x$: $x \le \frac{24000}{1500} \implies x \le 16$.'
    - 'Paso 5: Concluir que puede comprar como máximo 16 cuadernos.'
checkpoints:
  - placement: after_explicacion_formal
    question: Si dispone de $\$24.000$ para cuadernos de $\$1.500$, ¿cuál es la inecuación de costo correcta?
    choices:
      - {text: '$1500x \le 24000$', is_correct: true}
      - {text: '$1500x \ge 24000$', is_correct: false}
      - {text: '$1500x > 24000$', is_correct: false}
      - {text: '$1500x = 24000$', is_correct: false}
    explanation: La alternativa correcta es '$1500x \le 24000$'. El gasto no puede superar el dinero disponible.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: ¿Cuál es el número máximo de cuadernos de $\$1.500$ que puede comprar con $\$24.000$?
    choices:
      - {text: 16 cuadernos., is_correct: true}
      - {text: 17 cuadernos., is_correct: false}
      - {text: 15 cuadernos., is_correct: false}
      - {text: 20 cuadernos., is_correct: false}
    explanation: La alternativa correcta es '16 cuadernos.'. $16 \cdot 1500 = 24000$.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Definir la variable incógnita del problema.'
  - 'Paso 2: Identificar las relaciones numéricas y costos del enunciado.'
  - 'Paso 3: Seleccionar el operador de desigualdad adecuado.'
  - 'Paso 4: Resolver la inecuación resultante y comprobar en el contexto real.'
errores_correccion: |
  - **Error común:** Usar una ecuación con signo igual ($=$) ignorando la flexibilidad de gastar menos del máximo disponible.
  - **Cómo corregirlo:** Si el dinero disponible es un presupuesto máximo, se utiliza el operador de menor o igual ($\le$).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de modelamiento con desigualdades.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de modelamiento.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El modelamiento mediante desigualdades reemplaza la variable desconocida por un valor fijo sin definir una expresión algebraica en $x$.'
  - 'Modelar un problema con costos fijos y variables exige utilizar una ecuación de igualdad estricta sin margen de tolerancia.'
  - 'La expresión verbal "el doble de un número aumentado en 5 es menor que 20" se traduce algebraicamente como $2(x + 5) < 20$.'
  - 'En el modelamiento de inecuaciones, la elección del operador de desigualdad no altera el resultado final del conjunto solución.'
  - 'Modelar restricciones de almacenamiento omite la condición implícita de no negatividad de las cantidades.'
afirmaciones_verdaderas:
  - 'Modelar con desigualdades consiste en construir inecuaciones algebraicas a partir de enunciados verbales para determinar rangos o límites de validez.'
  - 'Un modelo algebraico riguroso includes la definición de variables, las relaciones operatorias y la restricción de orden correspondiente.'
al_terminar_debes_poder: |
  QUÉ: Formular modelos algebraicos basados en inecuaciones a partir de situaciones verbales.
  CÓMO: Definir la variable incógnita $x$, escribir las expresiones operatorias del problema, vincular el operador de orden adecuado ($<, >, \le, \ge$) y resolver.
