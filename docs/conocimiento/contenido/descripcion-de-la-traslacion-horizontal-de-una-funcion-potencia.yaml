semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.TRASLACION_HORIZONTAL
resumen_inicial: La traslación horizontal de una función potencia $g(x) = a(x - h)^n$ desplaza rígidamente la gráfica de $f(x) = ax^n$ en $h$ unidades a lo largo del eje $X$, moviendo el centro o vértice desde $(0, 0)$ hasta $(h, 0)$.
explicacion_simple: '![La traslación horizontal de una función potencia $g(x) = a(x - h)^n$ desplaza rígidamente la gráfica de $f(x) = ax^n$ en $h$ unidades a lo largo del eje $X$, moviendo el centro o vértice desde $(0, 0)$ hasta $(h, 0)$](/static/img/nodos/descripcion-de-la-traslacion-horizontal-de-una-funcion-potencia-intro.svg)



  Cuando modificas directamente la $x$ dentro del paréntesis $(x - h)^n$, la gráfica completa **se desliza hacia los lados a lo largo del eje $X$** sin cambiar su forma ni su tamaño:


  - **Hacia la DERECHA:** Si tienes $(x - \mathbf{3})^n$, la curva se mueve $3$ unidades a la **derecha** (su centro queda en $x = +3$).

  - **Hacia la IZQUIERDA:** Si tienes $(x + \mathbf{4})^n$, la curva se mueve $4$ unidades a la **izquierda** (su centro queda en $x = -4$).

  - **Punto de referencia:** Si era una función par ($x^4$), el vértice se traslada de $(0, 0)$ a **$(h, 0)$**. Si era impar ($x^3$), el punto de inflexión se mueve a **$(h, 0)$**.'
explicacion_formal: 'Sea $f(x) = ax^n$ con $a \in \mathbb{R}^*$ y $n \in \mathbb{Z}^*$. La transformación geométrica de traslación por el vector $\vec{v} = (h, 0)$ se define como la aplicación:

  $$\mathcal{T}_{(h, 0)}: \operatorname{Gr}(f) \to \operatorname{Gr}(g), \quad (x, y) \mapsto (x + h, y)$$

  La ecuación cartesiana de la curva transformada satisface:

  $$y = g(x) = f(x - h) = a(x - h)^n$$


  **Eje de simetría y centro invariante**:

  - Para $n$ par: El eje de simetría axial se traslada desde $x = 0$ a la recta vertical $x = h$.

  - Para $n$ impar: El centro de simetría puntual se traslada desde $(0, 0)$ al punto $(h, 0)$.'
definiciones_clave: '- **Traslación horizontal**: Isometría rígida paralela al eje de abscisas descrita por $f(x - h)$.

  - **Argumento desplazado**: Sustitución de la variable $x$ por el binomio $(x - h)$.'
propiedades_relaciones: '- **Invarianza de forma**: La apertura, concavidad y derivadas de orden superior se conservan idénticas salvo un cambio de origen.

  - **Conservación de recorrido**: En potencias pares con $a > 0$, $\operatorname{Rec}(g) = [0, +\infty[$ se mantiene inalterado.'
ejemplo_guiado:
  enunciado: '![Ejemplo La traslación horizontal de una función potencia $g(x) = a(x - h)^n$ desplaza rígidamente la gráfica de $f(x) = ax^n$ en $h$ unidades a lo largo del eje $X$, moviendo el centro o vértice desde $(0, 0)$ hasta $(h, 0)$](/static/img/nodos/descripcion-de-la-traslacion-horizontal-de-una-funcion-potencia-ejemplos.svg)



    Describe la traslación y halla las coordenadas del nuevo vértice / centro para:

    1) $f(x) = (x - 6)^4$

    2) $g(x) = -2(x + 3)^3$'
  pasos:
  - 'Paso 1: Para $f(x) = (x - 6)^4$: Se tiene $h = 6 > 0$. Desplazamiento de **6 unidades a la derecha** $\implies$ Vértice trasladado a **$(6, 0)$**.'
  - 'Paso 2: Para $g(x) = -2(x + 3)^3$: Escribir como $(x - (-3))^3 \implies h = -3 < 0$. Desplazamiento de **3 unidades a la izquierda** $\implies$ Punto de inflexión en **$(-3, 0)$**.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Hacia dónde y cuántas unidades se traslada la gráfica de $f(x) = 5(x - 7)^2$ respecto a $y = 5x^2$?
  choices:
  - text: 7 unidades hacia la derecha
    is_correct: true
  - text: 7 unidades hacia la izquierda
    is_correct: false
  - text: 7 unidades hacia arriba
    is_correct: false
  - text: 7 unidades hacia abajo
    is_correct: false
  explanation: La alternativa correcta es '7 unidades hacia la derecha'. El binomio $(x - 7)$ indica $h = +7$, lo que traslada la gráfica hacia las $x$ positivas.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el vértice de la función potencia par $f(x) = (x + 2)^6$?
  choices:
  - text: (-2, 0)
    is_correct: true
  - text: (2, 0)
    is_correct: false
  - text: (0, -2)
    is_correct: false
  - text: (0, 2)
    is_correct: false
  explanation: La alternativa correcta es '(-2, 0)'. Al anular el binomio $x + 2 = 0 \implies x = -2$, el nuevo vértice es $(-2, 0)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el binomio $(x - h)$ dentro de la potencia.'
- 'Paso 2: Igualar el binomio a cero para resolver la coordenada horizontal del centro: $x - h = 0 \implies x = h$.'
- 'Paso 3: Si $h > 0$, trasladar la gráfica $h$ unidades a la derecha; si $h < 0$, trasladar $|h|$ unidades a la izquierda.'
- 'Paso 4: Trazar la misma forma geométrica original con su centro ubicado en $(h, 0)$.'
errores_correccion: '- **Error común:** Mover la gráfica a la izquierda cuando ven $(x - 5)^4$.

  - **Cómo corregirlo:** En el eje X los signos actúan de manera contra-intuitiva: $(x - h)$ con signo menos **MUEVE A LA DERECHA** ($x = +h$).'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de traslación derecha'
  enunciado: 'La gráfica de $f(x) = (x - 8)^4$ está trasladada:'
  alternativas:
  - 8 unidades a la derecha
  - 8 unidades a la izquierda
  - 8 unidades arriba
  - 8 unidades abajo
  respuesta: 8 unidades a la derecha
  solucion_pasos:
  - 'Paso 1: $h = +8 \implies$ 8 unidades a la derecha.'
- titulo: 'Ejemplo 2: Identificación de traslación izquierda'
  enunciado: 'La gráfica de $g(x) = 3(x + 1)^5$ está trasladada:'
  alternativas:
  - 1 unidad a la izquierda
  - 1 unidad a la derecha
  - 1 unidad arriba
  - 3 unidades a la izquierda
  respuesta: 1 unidad a la izquierda
  solucion_pasos:
  - 'Paso 1: $x + 1 = 0 \implies x = -1 \implies$ 1 unidad a la izquierda.'
- titulo: 'Ejemplo 3: Eje de simetría'
  enunciado: ¿Cuál es el eje de simetría de $f(x) = -4(x - 5)^6$?
  alternativas:
  - x = 5
  - x = -5
  - y = 5
  - x = 0
  respuesta: x = 5
  solucion_pasos:
  - 'Paso 1: El eje de simetría pasa por $x = h = 5$.'
- titulo: 'Ejemplo 4: Centro de simetría impar'
  enunciado: 'El punto de inflexión de $y = (x + 9)^3$ es:'
  alternativas:
  - (-9, 0)
  - (9, 0)
  - (0, -9)
  - (0, 9)
  respuesta: (-9, 0)
  solucion_pasos:
  - 'Paso 1: $(h, 0) = (-9, 0)$.'
errores_frecuentes:
- Confundir el sentido de desplazamiento invirtiendo izquierda y derecha.
- Asumir que la traslación horizontal altera el recorrido.
- Olvidar trasladar el eje de simetría.
afirmaciones_verdaderas:
- La transformación f(x - h) desplaza rígidamente la gráfica en h unidades sobre el eje X.
- El vértice o centro de simetría se traslada exactamente a las coordenadas (h, 0).
al_terminar_debes_poder: '**QUÉ:** Describir y graficar la traslación horizontal de una función potencia.


  **CÓMO:** Identificando el valor de h en a(x - h)ⁿ y trasladando el vértice o inflexión a (h, 0).


