semantic_id: MAT.ALG.ECUACIONES_LITERALES.PARAMETRO_NO_NULO
resumen_inicial: Al despejar dividiendo entre un parámetro, se debe establecer explícitamente
  que dicho parámetro no puede ser cero.
explicacion_simple: 'Cuando despejamos una ecuación literal como $a x = b$ dividiendo
  entre el parámetro $a$ ($x = \frac{b}{a}$), estamos realizando una división algebraica.

  Dado que la división por cero no existe en los números reales, debemos declarar
  siempre la restricción de que ese parámetro es distinto de cero ($a \neq 0$).

  Si el parámetro valiera cero, la ecuación original perdería su carácter de primer
  grado o se volvería indeterminada.'
explicacion_formal: 'Sea el despeje de la ecuación literal $A(p) \cdot x = B(p)$ donde
  $A(p)$ es una expresión paramétrica. El **criterio de validez del despeje** exige:


  $$x = \frac{B(p)}{A(p)} \quad \iff \quad A(p) \neq 0$$


  **Desglose de la fórmula:**

  - $A(p) \neq 0$: Condición obligatoria sobre los parámetros para garantizar que
  la solución paramétrica pertenezca a $\mathbb{R}$.'
definiciones_clave: '- **Condición de parámetro no nulo**: Declaración explícita $A(p)
  \neq 0$ al pasar a dividir un parámetro en un despeje.

  - **Indefinición paramétrica**: Situación donde un conjunto de parámetros anula
  el divisor de la solución.'
propiedades_relaciones: '- **Discusión de casos**: Si $a = 0$ y $b = 0$, la ecuación
  $0x = 0$ tiene infinitas soluciones. Si $a = 0$ y $b \neq 0$, $0x = b$ no tiene
  solución.'
ejemplo_guiado:
  enunciado: Despeja la variable $x$ en la ecuación $(k - 3)x = 12$ y establece la
    condición exacta que debe cumplir el parámetro $k$.
  pasos:
  - 'Paso 1: Identificar el parámetro coeficiente que multiplica a $x$: $(k - 3)$.Paso
    2: Exigir la condición de parámetro no nulo: $k - 3 \neq 0 \implies k \neq 3$.Paso
    3: Trasponer $(k - 3)$ dividiendo: $x = \frac{12}{k - 3}$.Paso 4: Concluir que
    la solución es $x = \frac{12}{k - 3}$ para todo $k \in \mathbb{R} \setminus \{3\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición exige el despeje $x = \frac{12}{k - 3}$ sobre el parámetro
    $k$?
  choices:
  - text: Que $k \neq 3$, para evitar la división entre cero.
    is_correct: true
  - text: Que $k = 3$, para que el numerador sea cero.
    is_correct: false
  - text: Que $k > 12$.
    is_correct: false
  - text: Que $k$ sea un número negativo.
    is_correct: false
  explanation: La alternativa correcta es 'Que $k \neq 3$, para evitar la división
    entre cero.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en la ecuación $(k - 3)x = 12$ el parámetro valiera $k = 3$, ¿qué sucede
    con la ecuación?
  choices:
  - text: Se convierte en $0x = 12$, la cual carece de solución en $\mathbb{R}$.
    is_correct: true
  - text: La solución es $x = 0$.
    is_correct: false
  - text: La solución es $x = 12$.
    is_correct: false
  - text: Se convierte en una identidad.
    is_correct: false
  explanation: La alternativa correcta es 'Se convierte en $0x = 12$, la cual carece
    de solución en $\mathbb{R}$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el grupo paramétrico que multiplica a la variable a despejar.'
- 'Paso 2: Escribir la restricción de que dicho grupo paramétrico debe ser distinto
  de cero.'
- 'Paso 3: Pasar a dividir el grupo paramétrico.'
- 'Paso 4: Declarar la solución paramétrica acompañada de su restricción.'
errores_correccion: '- **Error común:** Dividir entre un parámetro sin aclarar que
  debe ser distinto de cero.

  - **Cómo corregirlo:** Acostúmbrate a escribir la nota $a \neq 0$ o $k \neq c$ al
  lado del despeje final.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de despeje.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de despeje.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Se pueden usar las reglas comunes de transposición en ecuaciones literales?
  respuesta: Sí
  solucion_pasos:
  - Sí, los parámetros se comportan exactamente igual que los números.
- titulo: ¿Dividir entre un parámetro exige la condición de ser distinto de cero?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar la indefinición por cero.
errores_frecuentes:
- Confundir la incógnita a despejar con las letras que actúan como parámetros.
- Olvidar factorizar la incógnita cuando aparece en más de un término.
- Sumar o trasponer parámetros cambiando su operación equivocadamente.
- Dividir entre un parámetro sin aclarar la restricción de ser no nulo.
- Tratar las variables físicas con subíndices como si fueran términos idénticos.
afirmaciones_verdaderas:
- Una ecuación literal expresa la incógnita en función de constantes simbólicas o
  parámetros.
- Si la incógnita figura en múltiples términos, debe agruparse y factorizarse para
  realizar su despeje.
al_terminar_debes_poder: Al finalizar este recurso podrás despejar cualquier variable
  en ecuaciones literales y fórmulas científicas indicando sus restricciones.
