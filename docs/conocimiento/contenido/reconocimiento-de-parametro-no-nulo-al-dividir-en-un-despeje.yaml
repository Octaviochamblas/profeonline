    del otro.
  - Aplicar el procedimiento de despeje o método de solución de reconocimiento de
    parámetro no nulo al dividir en un despeje.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
