semantic_id: MAT.ALG.ECUACIONES_LITERALES.PARAMETRO_NO_NULO
resumen_inicial: Al despejar dividiendo entre un parámetro o expresión paramétrica, se debe establecer explícitamente la restricción
  de que dicho divisor no puede ser cero.
explicacion_simple: 'Cuando despejamos una ecuación literal como $a x = b$ dividiendo entre el parámetro $a$ (obteniendo $x
  = \frac{b}{a}$), estamos efectuando una división algebraica.


  Puesto que la división entre cero no existe en el conjunto de los números reales, debemos declarar explícitamente la restricción
  de que ese parámetro es distinto de cero ($a \neq 0$).


  Si el parámetro asumiera el valor cero, la ecuación original perdería su naturaleza de primer grado o se transformaría en
  un sistema inconsistente o indeterminado.


  ![Parámetro no nulo al dividir](/static/img/nodos/reconocimiento-de-parametro-no-nulo-al-dividir-en-un-despeje-intro.svg)

  '
explicacion_formal: '### Definición formal

  Sea el despeje de la ecuación literal $A(p) \cdot x = B(p)$ donde $A(p)$ representa una expresión paramétrica. El **criterio
  de validez del despeje paramétrico** exige:


  $$x = \frac{B(p)}{A(p)} \quad \iff \quad A(p) \neq 0$$


  ### Desglose de la fórmula

  - $A(p) \neq 0$: Restricción de existencia necesaria sobre los parámetros para garantizar que la solución paramétrica pertenezca
  a $\mathbb{R}$.

  - $x = \frac{B(p)}{A(p)}$: Solución paramétrica formal definida exclusivamente sobre el dominio de parámetros donde $A(p)
  \neq 0$.


  ### Síntesis didáctica

  Analizar el comportamiento cuando el divisor paramétrico se anula ($A(p) = 0$) permite clasificar la ecuación en incompatible
  o indeterminada.

  '
definiciones_clave: '- **Condición de parámetro no nulo**: Declaración explícita $A(p) \neq 0$ requerida al trasponer una
  expresión paramétrica como divisor.

  - **Indefinición paramétrica**: Situación donde una combinación de valores numéricos asignados a los parámetros anula el
  denominador del despeje.

  '
propiedades_relaciones: '- **Análisis de casos de indeterminación**: Si $A(p) = 0$ y $B(p) = 0$, la ecuación $0x = 0$ posee
  infinitas soluciones. Si $A(p) = 0$ y $B(p) \neq 0$, la ecuación $0x = b$ carece de solución.

  - **Preservación del grado**: Exigir $a \neq 0$ en $a x + b = c$ asegura que la ecuación permanezca como una ecuación lineal
  de primer grado.

  '
ejemplo_guiado:
  enunciado: Despeja la variable $x$ en la ecuación literal $(k - 3)x = 12$ y establece la condición exacta que debe cumplir
    el parámetro $k$.
  pasos:
  - 'Paso 1: Identificar la expresión paramétrica coeficiente que multiplica a $x$: $(k - 3)$.'
  - 'Paso 2: Exigir la condición de parámetro no nulo sobre el divisor: $k - 3 \neq 0 \implies k \neq 3$.'
  - 'Paso 3: Trasponer el factor $(k - 3)$ dividiendo al segundo miembro: $x = \frac{12}{k - 3}$.'
  - 'Paso 4: Concluir que la solución paramétrica es $x = \frac{12}{k - 3}$ válida para todo $k \in \mathbb{R} \setminus \{3\}$.'
  imagen: /static/img/nodos/reconocimiento-de-parametro-no-nulo-al-dividir-en-un-despeje-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición exige el despeje paramétrico $x = \frac{12}{k - 3}$ sobre el parámetro $k$?
  choices:
  - text: Que $k \neq 3$, para evitar la división entre cero.
    is_correct: true
  - text: Que $k = 3$, para anular el numerador.
    is_correct: false
  - text: Que $k > 12$.
    is_correct: false
  - text: Que $k$ sea un número entero negativo.
    is_correct: false
  explanation: La alternativa correcta es 'Que $k \neq 3$, para evitar la división entre cero.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en la ecuación $(k - 3)x = 12$ el parámetro asumiera el valor $k = 3$, ¿qué ocurre con la ecuación?
  choices:
  - text: Se transforma en $0x = 12$, la cual carece de solución en $\mathbb{R}$.
    is_correct: true
  - text: La solución se convierte en $x = 0$.
    is_correct: false
  - text: La solución se convierte en $x = 12$.
    is_correct: false
  - text: Se convierte en una identidad matemática.
    is_correct: false
  explanation: La alternativa correcta es 'Se transforma en $0x = 12$, la cual carece de solución en $\mathbb{R}$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión paramétrica que multiplica a la variable a despejar.'
- 'Paso 2: Formular la condición de no-nulidad igualando la expresión paramétrica a distinto de cero ($A(p) \neq 0$).'
- 'Paso 3: Resolver la inecuación de no-nulidad para hallar los valores restringidos del parámetro.'
- 'Paso 4: Trasponer la expresión paramétrica dividiendo y acompañar la respuesta de su restricción.'
errores_correccion: '- **Error 1:** Omitir la declaración de la restricción $a \neq 0$ al pasar a dividir el parámetro $a$
  en $x = \frac{b}{a}$. **Cómo corregirlo:** Al trasponer un parámetro a dividir, **ES OBLIGATORIO ACOMPAÑAR LA SOLUCIÓN CON
  LA DECLARACIÓN PARÁMETRO NO NULO ($a \neq 0$)**.

  - **Error 2:** Exigir restricciones de no-nulidad sobre expresiones paramétricas ubicadas en los numeradores ($B(p) \neq
  0$). **Cómo corregirlo:** Las restricciones de no-nulidad **SE APLICAN EXCLUSIVAMENTE A LOS DIVISORES O DENOMINADORES, NO
  A LOS NUMERADORES ($B(p)$ PUEDE SER CERO)**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al despejar $x$ en $(a + 2)x = 5$, ¿cuál es la restricción sobre el parámetro $a$?
  alternativas:
  - $a \neq -2$
  - $a \neq 2$
  - $a \neq 5$
  respuesta: $a \neq -2$
  solucion_pasos:
  - '1. Divisor: $a + 2 \neq 0$.'
  - '2. Despejar: $a \neq -2$. Solución: $x = \frac{5}{a + 2}$.'
- titulo: Ejemplo 2
  enunciado: En la ecuación $m x = n$, ¿qué ocurre si $m = 0$ y $n = 0$?
  alternativas:
  - Existen infinitas soluciones (identidad $0x = 0$)
  - No existe solución
  - La única solución es $x = 0$
  respuesta: Existen infinitas soluciones (identidad $0x = 0$)
  solucion_pasos:
  - '1. Sustituir $m = 0$ y $n = 0$: $0 \cdot x = 0$.'
  - 2. Cualquier número $x \in \mathbb{R}$ satisface la igualdad.
- titulo: Declaración mandatoria
  enunciado: ¿Es obligatorio acompañar todo despeje con divisor paramétrico de su respectiva condición de no-nulidad?
  respuesta: Sí
  solucion_pasos:
  - Sí, previene la división por cero en las soluciones paramétricas.
- titulo: Numeradores nulos
  enunciado: ¿Un numerador paramétrico $B(p) = 0$ anula la solución $x = 0$ sin causar indefinición?
  respuesta: Sí
  solucion_pasos:
  - Sí, $0 / A(p) = 0$ siempre que $A(p) \neq 0$.
errores_frecuentes:
- Dividir entre un parámetro literal sin declarar formalmente la restricción de que debe ser estrictamente distinto de cero.
- Confundir la condición de parámetro no nulo ($k \neq 0$) con el valor numérico de la solución ($x = 0$).
- Afirmar que una ecuación con parámetro nulo divisor $k = 0$ siempre carece de solución sin analizar el término independiente.
- Invertir el signo del parámetro al pasarlo dividiendo al miembro opuesto.
- Asumir que un parámetro no nulo restringe los valores admisibles de la incógnita en el numerador.
afirmaciones_verdaderas:
- Pasar a dividir una expresión paramétrica requiere declarar explícitamente que dicha expresión es distinta de cero.
- Si el coeficiente paramétrico de la incógnita se anula, la ecuación deja de ser de primer grado y requiere discusión de
  casos.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/reconocimiento-de-parametro-no-nulo-al-dividir-en-un-despeje-resumen.svg)


  QUÉ: Reconocer y formalizar la condición de parámetro no nulo al despejar variables literales.

  CÓMO: Establecer la restricción explícita $k \neq 0$ en toda división paramétrica ($k \cdot x = B \implies x = \frac{B}{k}$)
  y analizar los casos particulares cuando el parámetro se anula ($k = 0$).

  '
