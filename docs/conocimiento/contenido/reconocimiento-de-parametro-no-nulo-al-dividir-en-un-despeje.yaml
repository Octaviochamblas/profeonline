procedimiento:
- Realiza el despeje normalmente.
- Al momento de dividir ambos lados por una expresión que contenga parámetros literales,
  detente.
- 'Añade una condición explícita al final de tu respuesta: indicando que la expresión
  en el denominador debe ser $\neq 0$.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en reconocimiento de parámetro no nulo al dividir en un despeje.
ejemplos:
- titulo: $a \neq 0$
  enunciado: Determina qué debe hacerse en $a \neq 0$ y fundamenta cada transformación.
  solucion_pasos:
  - "Debes declarar que el parámetro que pasaste dividiendo NO es cero ($a \\neq 0$).\
    \ \n¿Por qué? Porque si en el universo de posibilidades esa letra 'a' resultara\
    \ valer 0, el despeje que acabas de hacer sería inválido y crearía una expresión\
    \ no definida."
  - Realiza el despeje normalmente.
- titulo: $ax = b \rightarrow x = \frac{b}{a}$
  enunciado: Analiza el caso $ax = b \rightarrow x = \frac{b}{a}$ y explica cómo se
    aplica el criterio estudiado.
  solucion_pasos:
  - Cuando llegas al último paso de un despeje literal y debes pasar una letra dividiendo,
    por ejemplo $ax = b \rightarrow x = \frac{b}{a}$, la matemática te exige una garantía.
  - Al momento de dividir ambos lados por una expresión que contenga parámetros literales,
    detente.
