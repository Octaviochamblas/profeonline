semantic_id: MAT.ALG.ECUACIONES_LITERALES.PARAMETRO_NO_NULO
resumen_inicial: 'Reconocimiento de parámetro no nulo al dividir en un despeje: propiedades,
  resolución y modelamiento en Ecuaciones literales y despeje.'
explicacion_simple: Debes declarar que el parámetro que pasaste dividiendo NO es cero
  ($a \neq 0$).
explicacion_formal: "### Definición formal\n\nAl despejar $x$ en una ecuación literal\
  \ $ax=b$, la división $x=\\frac{b}{a}$ solo está definida si $a \\neq 0$; esta condición\
  \ debe declararse explícitamente como restricción del parámetro, ya que la división\
  \ por cero no está definida en los números reales.\n\n### Desarrollo didáctico\n\
  \nDebes declarar que el parámetro que pasaste dividiendo NO es cero ($a \\neq 0$).\
  \ \n¿Por qué? Porque si en el universo de posibilidades esa letra 'a' resultara\
  \ valer 0, el despeje que acabas de hacer sería inválido y crearía una expresión\
  \ no definida.\n\nEn pruebas avanzadas, el despeje correcto no es solo 'x=b/a',\
  \ sino: 'x=b/a, siempre y cuando a sea distinto de cero'."
definiciones_clave: '- **Reconocimiento de parámetro no nulo al dividir en un despeje**:
  Herramienta matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a reconocimiento de parámetro no nulo al dividir
  en un despeje.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando reconocimiento
    de parámetro no nulo al dividir en un despeje.
  pasos:
