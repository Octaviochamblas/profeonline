semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.LOGARITMO_DE_UNO
resumen_inicial: El logaritmo de uno en cualquier base válida es siempre igual a cero ($\log_b(1)
  = 0$ para $b > 0, b \neq 1$).
explicacion_simple: 'Como todo número no nulo elevado al exponente cero da como resultado
  1 ($b^0 = 1$), se concluye que el logaritmo de 1 en cualquier base es siempre cero:

  - $\log_2(1) = 0$

  - $\log_{10}(1) = 0$

  - $\log_{45}(1) = 0$'
explicacion_formal: Para todo $b > 0, b \neq 1$, la propiedad del exponente cero establece
  que $b^0 = 1$. Aplicando la definición de logaritmo, se deduce inmediatamente que $\log_b(1)
  = 0$.
definiciones_clave: '- **Propiedad del logaritmo de la unidad**: $\log_b(1) = 0$ para toda
  base $b$ permitida.'
propiedades_relaciones: '- **Intersección con el eje X**: La gráfica de toda función logarítmica
  $y = \log_b(x)$ pasa por el punto $(1, 0)$.'
ejemplo_guiado:
  enunciado: Calcula el valor de la expresión $E = \log_5(1) + \log_8(1) - \log_3(1)$.
  pasos:
  - 'Aplicar la propiedad del logaritmo de uno a cada término:'
  - $\log_5(1) = 0$
  - $\log_8(1) = 0$
  - $\log_3(1) = 0$
  - 'Calcular la suma: $0 + 0 - 0 = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\log_{99}(1)$?
  choices:
  - text: '0'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '99'
    is_correct: false
  - text: Indefinido
    is_correct: false
  explanation: 'La correcta es: 0. El logaritmo de 1 en cualquier base válida es 0.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Evalúa $\ln(1)$.
  choices:
  - text: '0'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: e
    is_correct: false
  - text: '-1'
    is_correct: false
  explanation: 'La correcta es: 0. El logaritmo natural de 1 es 0 porque $e^0 = 1$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si el argumento del logaritmo es igual a 1.'
- 'Paso 2: Comprobar que la base sea válida ($b > 0, b \neq 1$).'
- 'Paso 3: Sustituir la expresión logarítmica por el valor 0.'
errores_correccion: No confundas el logaritmo de 1 con el logaritmo de la base. $\log_b(1)
  = 0$, mientras que $\log_b(b) = 1$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\log_7(1)$.
  alternativas:
  - '0'
  - '1'
  - '7'
  respuesta: '0'
  solucion_pasos:
  - $\log_7(1) = 0$ pues $7^0 = 1$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de log base 12 de 1?
  alternativas:
  - '0'
  - '1'
  - '12'
  respuesta: '0'
  solucion_pasos:
  - Todo logaritmo de 1 es igual a 0, sin importar la base.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de log(1), con base 10 implícita?
  alternativas:
  - '0'
  - '1'
  - '10'
  respuesta: '0'
  solucion_pasos:
  - log base 10 de 1 es igual a 0.
- titulo: ¿Es correcto que log base 7 de 1 es igual a 7?
  respuesta: 'No'
  solucion_pasos:
  - log base 7 de 1 es igual a 0, no a 7.
errores_frecuentes:
- Confundir el resultado 0 con 1.
- Confundir el resultado 0 de log base b de 1 con el resultado 1 de log base b de b.
- Pensar que el logaritmo de 1 depende del valor de la base.
- Aplicar la propiedad log base b de 1 a un argumento distinto de 1.
- Olvidar verificar que la base sea válida antes de aplicar esta propiedad.
afirmaciones_verdaderas:
- $\log_b(1) = 0$ para todo $b > 0, b \neq 1$.
- La propiedad log base b de 1 es igual a 0 se cumple para cualquier base válida, sin importar
  su valor.
al_terminar_debes_poder: Evaluar de forma inmediata el logaritmo de 1 en cualquier base.
fuente: Texto escolar MINEDUC.
estado: publicado
