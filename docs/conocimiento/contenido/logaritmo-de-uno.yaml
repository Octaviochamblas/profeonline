semantic_id: MAT.NUM.LOGARITMOS_CONCEPTO.LOGARITMO_DE_UNO
resumen_inicial: 'El logaritmo de 1 en cualquier base admisible es siempre igual a cero: $\log_b(1) = 0$, porque cualquier base positiva elevada a 0 da como resultado 1 ($b^0 = 1$).'
explicacion_simple: '![Logaritmo de uno](/static/img/nodos/logaritmo-de-uno-intro.svg)


  Una de las reglas más importantes de los logaritmos es:

  - ¿A qué exponente debes elevar cualquier número para que el resultado sea $1$?

  - ¡A cero! Porque $2^0 = 1$, $5^0 = 1$, $10^0 = 1$ y $e^0 = 1$.

  - Por lo tanto, sin importar la base, **el logaritmo de 1 siempre vale 0**: $\log_b(1) = 0$.'
explicacion_formal: 'Sea $b \in \mathbb{R}^+ \setminus \{1\}$. Por el axioma de la potencia con exponente nulo en el cuerpo de los números reales, se cumple que:


  $$b^0 = 1$$


  Aplicando la definición de logaritmo, se deduce la **propiedad fundamental del logaritmo de uno**:


  $$\log_b(1) = 0$$


  **Propiedad Geométrica:**

  La gráfica de cualquier función logarítmica $f(x) = \log_b(x)$ interseca obligatoriamente al eje de las abscisas en el punto coordenado $(1, 0)$.'
definiciones_clave: '- **Logaritmo de uno**: Identidad $\log_b(1) = 0$ válida para toda base admisible.

  - **Raíz o cero de la función**: Punto $x = 1$ donde la función logarítmica toma el valor 0.

  - **Intersección horizontal**: Punto $(1, 0)$ en el plano cartesiano.'
propiedades_relaciones: '- **Universalidad**: Es independiente del valor particular de la base $b$.

  - **Anulación de sumandos**: En expresiones algebraicas, cualquier término $\log_b(1)$ se reemplaza inmediatamente por 0.'
ejemplo_guiado:
  enunciado: '![Ejemplos de logaritmo de uno](/static/img/nodos/logaritmo-de-uno-ejemplos.svg)


    Calcule el valor de $\log_2(1)$, $\log(1)$ y $\ln(1)$.'
  pasos:
  - 'Paso 1: Para $\log_2(1)$: Como $2^0 = 1$, se tiene $\log_2(1) = 0$.'
  - 'Paso 2: Para $\log(1)$: Como $10^0 = 1$, se tiene $\log(1) = 0$.'
  - 'Paso 3: Para $\ln(1)$: Como $e^0 = 1$, se tiene $\ln(1) = 0$.'
  - 'Conclusión: El logaritmo de 1 es siempre 0 en todas las bases.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de $\log_{2026}(1)$?
  choices:
  - text: $0$ (porque $2026^0 = 1$)
    is_correct: true
  - text: $1$
    is_correct: false
  - text: $2026$
    is_correct: false
  - text: Indefinido
    is_correct: false
  explanation: La alternativa correcta es '$0$ (porque $2026^0 = 1$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expresión $E = \log_3(9) + \log_5(1) - \log_2(8)$, ¿a qué se reduce el término $\log_5(1)$?
  choices:
  - text: A $0$, por lo que $E = 2 + 0 - 3 = -1$
    is_correct: true
  - text: A $1$
    is_correct: false
  - text: A $5$
    is_correct: false
  - text: A $-1$
    is_correct: false
  explanation: La alternativa correcta es 'A $0$, por lo que $E = 2 + 0 - 3 = -1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si el argumento del logaritmo es igual a 1.'
- 'Paso 2: Verificar que la base cumpla $b > 0, b \neq 1$.'
- 'Paso 3: Sustituir directamente el valor $\log_b(1) = 0$ en el cálculo algebraico.'
errores_correccion: '- **Error 1: Pensar que $\log_b(1) = 1$.** **Cómo corregirlo:** La potencia que da 1 es el exponente 0 ($b^0 = 1$), por lo que el logaritmo es 0.

  - **Error 2: Confundir $\log_b(1) = 0$ con $\log_b(b) = 1$.** **Cómo corregirlo:** El logaritmo de la base da 1; el logaritmo de 1 da 0.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿A qué equivale $\log_8(1)$?
  alternativas:
  - $0$
  - $1$
  - $8$
  respuesta: $0$
  solucion_pasos:
  - $8^0 = 1 \implies \log_8(1) = 0$.
- titulo: Ejemplo 2
  enunciado: 'Calcule el valor de $E = 4 \cdot \log_7(1) + 5$:'
  alternativas:
  - $5$
  - $9$
  - $4$
  respuesta: $5$
  solucion_pasos:
  - $E = 4(0) + 5 = 0 + 5 = 5$.
- titulo: ¿Es ln(1) = 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $e^0 = 1$.
  alternativas:
  - texto: Sí, e⁰ = 1
    es_correcta: true
    retroalimentacion: ¡Correcto! Logaritmo natural de 1 es 0.
  - texto: No, es 1
    es_correcta: false
    retroalimentacion: Incorrecto, $\ln(e) = 1$, no $\ln(1)$.
  - texto: No, es e
    es_correcta: false
    retroalimentacion: Incorrecto, $e^0 = 1$.
- titulo: ¿Pasa la gráfica de y = log(x) por el punto (1, 0)?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque para $x = 1$, $y = \log(1) = 0$.
  alternativas:
  - texto: Sí, siempre pasa por (1, 0)
    es_correcta: true
    retroalimentacion: ¡Correcto! Intersección con el eje X.
  - texto: No, pasa por (0, 1)
    es_correcta: false
    retroalimentacion: Incorrecto, $(0, 1)$ es el punto de la función exponencial.
  - texto: No, pasa por (0, 0)
    es_correcta: false
    retroalimentacion: Incorrecto, $\log(0)$ no está definido.
errores_frecuentes:
- Creer que $\log_b(1) = 1$.
- Confundir la intersección $(1, 0)$ con $(0, 1)$.
- Intentar aplicar logaritmo de uno con base 1.
- Olvidar que el término se anula a 0 en sumatorias.
afirmaciones_verdaderas:
- El logaritmo de 1 en cualquier base válida es siempre igual a cero.
- La propiedad $\log_b(1) = 0$ se fundamenta en que $b^0 = 1$.
- Todas las gráficas de funciones logarítmicas intersecan al eje X en el punto $(1, 0)$.
al_terminar_debes_poder: '![Síntesis de logaritmo de uno](/static/img/nodos/logaritmo-de-uno-resumen.svg)


  QUÉ: Comprender y aplicar la propiedad universal $\log_b(1) = 0$.


  CÓMO: Reconociendo que $b^0 = 1$ para toda base válida y simplificando inmediatamente a cero cualquier término con argumento igual a 1.'
