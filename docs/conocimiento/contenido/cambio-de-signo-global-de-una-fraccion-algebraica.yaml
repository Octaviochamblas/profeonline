semantic_id: MAT.ALG.FRACCIONES_BASE.SIGNO_FRACCION
resumen_inicial: 'Cambio de signo global de una fracción algebraica: concepto, reglas
  operativas y simplificación en Fracciones algebraicas base.'
explicacion_simple: 'Una fracción tiene tres lugares donde puede llevar un signo negativo:
  arriba (numerador), abajo (denominador) o justo al frente (el signo de la fracción).
  ¿Cómo interactúan entre ellos? Con la vieja y confiable regla de los signos de la
  multiplicación.'
explicacion_formal: '### Definición formal


  Menos entre menos da más, por lo que el valor global no se altera.


  ### Desarrollo didáctico


  Toda fracción posee tres posiciones donde se puede colocar un signo (positivo o
  negativo):

  1. El signo del Numerador.

  2. El signo del Denominador.

  3. El signo Global (delante de la línea fraccionaria).


  La regla de oro de los signos en fracciones dicta que **puedes cambiar dos signos
  simultáneamente** sin alterar el valor real de la fracción (porque menos por menos
  da más).


  Por ejemplo, la fracción $-\frac{A}{B}$ es exactamente igual a $\frac{-A}{B}$ (signo
  al numerador) y también es igual a $\frac{A}{-B}$ (signo al denominador).


  Sin embargo, por pura estética y convención matemática mundial, los matemáticos
  odian tener signos negativos en el denominador o colgando solos. El estándar de
  oro es **subir el signo negativo al numerador**, o **dejarlo justo al nivel de la
  línea de fracción**.'
definiciones_clave: '- **Cambio de signo global de una fracción algebraica**: Procedimiento
  o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a cambio de signo global de una fracción
  algebraica.'
