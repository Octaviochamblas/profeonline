semantic_id: MAT.ALG.FRACCIONES_BASE.SIGNO_FRACCION
resumen_inicial: El signo global de una fracción algebraica se puede desplazar libremente
  al numerador o al denominador según convenga.
explicacion_simple: 'Una fracción algebraica tiene tres lugares donde puede figurar
  un signo menos (-):

  1. Delante de la fracción entera.

  2. En el numerador.

  3. En el denominador.

  La regla fundamental de los signos establece que tener un signo menos delante de
  la fracción equivale a aplicárselo al numerador O aplicárselo al denominador, pero
  NUNCA a los dos a la vez.'
explicacion_formal: 'Para toda fracción algebraica $\frac{P(x)}{Q(x)}$, las tres formas
  de representación con signo negativo cumplen la **triple identidad de signos**:


  $$-\frac{P(x)}{Q(x)} = \frac{-P(x)}{Q(x)} = \frac{P(x)}{-Q(x)}$$


  **Desglose de la fórmula:**

  - $-\frac{P(x)}{Q(x)}$: Signo negativo global afectando a la operación racional
  entera.

  - \frac{-P(x)}{Q(x)}: Signo negativo absorbido por el polinomio numerador.

  - \frac{P(x)}{-Q(x)}: Signo negativo absorbido por el polinomio denominador.


  > **Complemento didáctico:** Esta triple igualdad proviene directamente de la ley
  de los signos de la división $(-1) \cdot \frac{A}{B} = \frac{-A}{B} = \frac{A}{-B}$.'
definiciones_clave: '- **Signo global de la fracción**: Signo ubicado inmediatamente
  antes de la barra principal de división.

  - **Triple equivalencia de signo**: Propiedad que permite transferir el signo negativo
  entre la posición global, el numerador o el denominador.'
propiedades_relaciones: '- **Neutralización de doble signo**: $-\left(-\frac{A}{B}\right)
  = \frac{A}{B}$.

  - **Inversión simultánea**: $\frac{-P(x)}{-Q(x)} = \frac{P(x)}{Q(x)}$.'
ejemplo_guiado:
  enunciado: Verifica la triple equivalencia para la fracción con signo global $-\frac{x
    - 2}{x + 5}$, expresándola con el signo dentro del numerador y dentro del denominador,
    y evalúa las tres formas para $x = 1$.
  pasos:
  - 'Paso 1: Aplicar el signo menos al numerador: $\frac{-(x - 2)}{x + 5} = \frac{2
    - x}{x + 5}$.Paso 2: Aplicar el signo menos al denominador: $\frac{x - 2}{-(x
    + 5)} = \frac{x - 2}{-x - 5}$.Paso 3: Evaluar la forma global en $x = 1$: -\frac{1
    - 2}{1 + 5} = -\frac{-1}{6} = \frac{1}{6}$.Paso 4: Evaluar la forma en numerador
    en $x = 1$: \frac{2 - 1}{1 + 5} = \frac{1}{6}$.Paso 5: Evaluar la forma en denominador
    en $x = 1$: \frac{1 - 2}{-1 - 5} = \frac{-1}{-6} = \frac{1}{6}$ (se comprueba
    la triple identidad).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes relaciones de signos es correcta para cualquier
    fracción algebraica?
  choices:
  - text: $-\frac{P(x)}{Q(x)} = \frac{-P(x)}{Q(x)} = \frac{P(x)}{-Q(x)}$
    is_correct: true
  - text: $-\frac{P(x)}{Q(x)} = \frac{-P(x)}{-Q(x)}$
    is_correct: false
  - text: $-\frac{P(x)}{Q(x)} = -\frac{-P(x)}{-Q(x)}$
    is_correct: false
  - text: $\frac{-P(x)}{Q(x)} = \frac{P(x)}{Q(x)}$
    is_correct: false
  explanation: La alternativa correcta es '$-\frac{P(x)}{Q(x)} = \frac{-P(x)}{Q(x)}
    = \frac{P(x)}{-Q(x)}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al aplicar el signo negativo de $-\frac{x - 2}{x + 5}$ al numerador, ¿cuál
    es la expresión obtenida?
  choices:
  - text: $\frac{2 - x}{x + 5}$
    is_correct: true
  - text: $\frac{x - 2}{x + 5}$
    is_correct: false
  - text: $\frac{x + 2}{x + 5}$
    is_correct: false
  - text: $\frac{2 - x}{-x - 5}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{2 - x}{x + 5}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la posición actual del signo negativo en la fracción.'
- 'Paso 2: Si el signo es global, moverlo afectando a TODOS los términos del numerador
  O a TODOS los términos del denominador.'
- 'Paso 3: Si el signo está en el numerador o denominador, se puede extraer como signo
  negativo global antes de la barra.'
- 'Paso 4: Comprobar que no se haya aplicado el signo a ambas partes al mismo tiempo.'
errores_correccion: '- **Error común:** Distribuir el signo negativo global al numerador
  Y al denominador a la vez.

  - **Cómo corregirlo:** Un signo menos global se aplica a UNO de los dos componentes
  (numerador O denominador), nunca a ambos simultáneamente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de $x$.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración de $x^2$.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Es válida esta regla?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición.
- titulo: ¿Es válida la división por cero?
  respuesta: 'No'
  solucion_pasos:
  - No, está indefinida.
errores_frecuentes:
- Omitir el signo negativo global al transferirlo al numerador.
- Multiplicar numerador y denominador por signos distintos.
- Asumir que cambiar el signo de la fracción no requiere modificar sus términos.
- Sumar numeradores antes de homogenizar denominadores.
- Cancelar términos sueltos en fracciones algebraicas.
afirmaciones_verdaderas:
- El signo menos de una fracción puede aplicarse indistintamente al numerador o al
  denominador.
- La ley de los signos de la división rige las equivalencias globales en fracciones
  algebraicas.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar y manipular las
  propiedades fundamentales de las fracciones algebraicas.
