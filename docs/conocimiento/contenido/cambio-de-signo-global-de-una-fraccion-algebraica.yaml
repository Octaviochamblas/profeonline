procedimiento:
- 'Paso 1: Identifica el signo global de la fracción (frente a la línea fraccionaria).'
- 'Paso 2: Identifica el signo del numerador y el del denominador.'
- 'Paso 3: Para que la fracción siga valiendo lo mismo, solo puedes multiplicar por
  -1 (cambiar el signo) a DOS de esos tres elementos simultáneamente.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en cambio de signo global de una fracción algebraica.
ejemplos:
- titulo: Muestra dos formas alternativas de escribir $-\frac{x}{y}$
  enunciado: Muestra dos formas alternativas de escribir $-\frac{x}{y}$.
  solucion_pasos:
  - 'Cambiamos el global y el de arriba: $\frac{-x}{y}$.'
  - 'Cambiamos el global y el de abajo: $\frac{x}{-y}$.'
  - Ambas son completamente válidas.
- titulo: ¿Es $-\frac{-a}{-b}$ igual a $\frac{a}{b}$ o a $-\frac{a}{b}$?
  solucion_pasos:
  - 'Tres signos negativos: dos de ellos se cancelan (- / - = +), pero queda el tercero
    flotando al frente, así que es negativo.'
- titulo: 'Respecto de «Cambio de signo global de una fracción algebraica»: ¿Se ajusta
    a la definición'
  enunciado: 'Respecto de «Cambio de signo global de una fracción algebraica»: ¿Se
    ajusta a la definición esta afirmación? «Toda fracción tiene tres signos (numerador,
    denominador y el de la fracción misma)»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Toda fracción tiene tres signos
    (numerador, denominador y el de la fracción misma).'
- titulo: 'Respecto de «Cambio de signo global de una fracción algebraica»: ¿Es compatible
    con el proce'
  enunciado: 'Respecto de «Cambio de signo global de una fracción algebraica»: ¿Es
    compatible con el procedimiento esta afirmación? «Creer que $-\frac{x}{y}$ es
    lo mismo que $\frac{-x}{-y}$ (en el primero hay un solo negativo, en el segundo
    hay dos que se vuelven positivo)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Toda fracción tiene tres signos
    (numerador, denominador y el de la fracción misma).'
errores_frecuentes:
- Creer que $-\frac{x}{y}$ es lo mismo que $\frac{-x}{-y}$ (en el primero hay un solo
  negativo, en el segundo hay dos que se vuelven positivo).
- Poner el signo negativo al numerador y además dejarlo al frente de la fracción doblemente.
- $-\frac{x}{y}$.
- Para «Si en la fracción $\frac{x}{y}$ cambiamos el signo del numerador y del denominador
  simultáneamente, obtenemos:», la respuesta correcta es $\frac{y}{x}$.
- Para «Si en la fracción $\frac{x}{y}$ cambiamos el signo del numerador y del denominador
  simultáneamente, obtenemos:», la respuesta correcta es 1.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando cambio
