semantic_id: MAT.ALG.FRACCIONES_BASE.SIGNO_FRACCION
resumen_inicial: El cambio de signo global de una fracción algebraica consiste en aplicar la ley de los tres signos para transferir
  la negatividad entre la barra principal, el numerador o el denominador sin alterar el valor numérico.
explicacion_simple: "Toda fracción algebraica tiene **TRES SIGNOS** que interactúan entre sí:\n1. **El signo de la barra principal**\
  \ (frente a la fracción).\n2. **El signo del numerador**.\n3. **El signo del denominador**.\n- **REGLA DE EQUIVALENCIA DE\
  \ LOS TRES SIGNOS**:\n  $$\\mathbf{+\\frac{+A}{+B} = -\\frac{-A}{+B} = -\\frac{+A}{-B} = +\\frac{-A}{-B}}$$\n- **Regla Práctica\
  \ en 2 Líneas**:\n  - Si cambias **UN solo signo** (de los tres), ¡la fracción cambia de valor!\n  - Si cambias **DOS signos\
  \ a la vez**, ¡el valor de la fracción **SE MANTIENE EXACTAMENTE IGUAL**!\n- **Ejemplo en $-\\frac{x - 3}{x + 2}$**:\n \
  \ - Puedes meter el signo menos al numerador: $\\mathbf{\\frac{-(x - 3)}{x + 2}} = \\mathbf{\\frac{3 - x}{x + 2}}$.\n  -\
  \ O puedes meter el signo menos al denominador: $\\mathbf{\\frac{x - 3}{-(x + 2)}} = \\mathbf{\\frac{x - 3}{-x - 2}}$.\n\
  \n![Cambio de signo global de una fracción algebraica](/static/img/nodos/cambio-de-signo-global-de-una-fraccion-algebraica-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la función racional $f(x) = \frac{P(x)}{Q(x)}$ sobre el cuerpo de funciones $\mathbb{R}(x)$. La **Ley de Invariancia
  por Doble Negación Fraccionaria** establece las cuatro representaciones canónicas del conjunto cociente:


  $$\mathbf{+\frac{P(x)}{Q(x)} = -\frac{-P(x)}{Q(x)} = -\frac{P(x)}{-Q(x)} = +\frac{-P(x)}{-Q(x)}}$$


  ### Demostración por Estructura de Cuerpo

  Dado que $-1 \cdot -1 = 1$, en la operación de multiplicación por el neutro $1$:


  $$\frac{P(x)}{Q(x)} = 1 \cdot \frac{P(x)}{Q(x)} = (-1) \cdot (-1) \cdot \frac{P(x)}{Q(x)} = (-1) \cdot \left(\frac{-P(x)}{Q(x)}\right)
  = -\frac{-P(x)}{Q(x)}$$


  ### Síntesis didáctica

  Cambiar simultáneamente dos de los tres signos de una fracción (barra, numerador o denominador) preserva de forma idéntica
  su valor algebraico.

  '
definiciones_clave: '- **Signo global de la fracción**: Operador positivo o negativo situado inmediatamente a la izquierda
  de la barra de división principal.

  - **Ley de los tres signos**: Teorema que establece la invariancia de una fracción al cambiar simultáneamente dos de sus
  tres signos.

  - **Representación canónica negativa**: Traslado del signo opuesto al numerador o al margen frontal para simplificar operaciones.

  '
propiedades_relaciones: '- **Paridad en el cambio de signos**: Un número PAR de cambios de signo (2 cambios) mantiene la expresión;
  un número IMPAR (1 o 3 cambios) invierte el signo de la expresión.

  '
ejemplo_guiado:
  enunciado: Expresa la fracción $-\frac{2x - 5}{3x + 4}$ de dos formas equivalentes eliminando el signo negativo frontal.
  pasos:
  - 'Paso 1: Aplicamos la Ley de los Tres Signos para transferir el signo menos al **numerador**: $-\frac{2x - 5}{3x + 4}
    = \frac{-(2x - 5)}{3x + 4} = \mathbf{\frac{5 - 2x}{3x + 4}}$.'
  - 'Paso 2: Aplicamos la Ley de los Tres Signos para transferir el signo menos al **denominador**: $-\frac{2x - 5}{3x + 4}
    = \frac{2x - 5}{-(3x + 4)} = \mathbf{\frac{2x - 5}{-3x - 4}}$.'
  - 'Conclusión: Las dos formas equivalentes sin signo frontal son **$\frac{5 - 2x}{3x + 4}$** y **$\frac{2x - 5}{-3x - 4}$**.'
  imagen: /static/img/nodos/cambio-de-signo-global-de-una-fraccion-algebraica-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: De acuerdo con la Ley de los Tres Signos, ¿cuál de las siguientes expresiones es equivalente a $-\frac{a}{b}$?
  choices:
  - text: Es equivalente a $\frac{-a}{b}$ y a $\frac{a}{-b}$
    is_correct: true
  - text: Es equivalente a $\frac{-a}{-b}$
    is_correct: false
  - text: Es equivalente a $+\frac{a}{b}$
    is_correct: false
  - text: Es equivalente a $-\frac{-a}{-b}$
    is_correct: false
  explanation: 'La alternativa correcta es ''Es equivalente a $\frac{-a}{b}$ y a $\frac{a}{-b}$''. Ley de los tres signos:
    cambiar dos signos simultáneamente preserva la equivalencia ($-\frac{a}{b} = \frac{-a}{b} = \frac{a}{-b}$).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si introducimos un signo negativo del frente de la fracción al numerador $x - 7$, ¿cómo queda el numerador resultante?
  choices:
  - text: Queda $-(x - 7) = 7 - x$, invirtiendo los signos de ambos términos
    is_correct: true
  - text: Queda $-x - 7$
    is_correct: false
  - text: Queda $x + 7$
    is_correct: false
  - text: Queda $x - 7$
    is_correct: false
  explanation: 'La alternativa correcta es ''Queda $-(x - 7) = 7 - x$, invirtiendo los signos de ambos términos''. Distribución
    del signo menos: $-(x - 7) = -x + 7 = 7 - x$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los tres signos de la fracción: el frontal, el del numerador y el del denominador.'
- 'Paso 2: Elegir dos de los tres signos que se desean modificar.'
- 'Paso 3: Cambiar el estado de los dos signos seleccionados (de positivo a negativo o de negativo a positivo).'
- 'Paso 4: Distribuir correctamente el signo menos dentro del polinomio (numerador o denominador) si aplica.'
errores_correccion: '- **Error 1:** Cambiar los tres signos a la vez (escribir $+\frac{A}{B} \to -\frac{-A}{-B}$). **Cómo
  corregirlo:** Cambiar 3 signos equivale a un número impar de cambios, lo que **INVIERTE EL VALOR DE LA FRACCIÓN ($-\frac{-A}{-B}
  = -\frac{A}{B} \neq \frac{A}{B}$)**.

  - **Error 2:** Distribuir el signo menos a un solo término del numerador al meterlo desde el frente (escribir $-(x - 4)
  \to -x - 4$). **Cómo corregirlo:** El signo menos **DEBE MULTIPLICAR Y CAMBIAR EL SIGNO A TODOS LOS TÉRMINOS DEL POLINOMIO
  ($-x + 4 = 4 - x$)**.

  '
ejemplos:
- titulo: Ingreso al numerador
  enunciado: Para $-\frac{x - 2}{3}$, ¿es equivalente a $\frac{2 - x}{3}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-(x-2) = 2-x$.
- titulo: Ingreso al denominador
  enunciado: Para $-\frac{5}{x - 1}$, ¿es equivalente a $\frac{5}{1 - x}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-(x-1) = 1-x$.
- titulo: Cambio de 3 signos
  enunciado: ¿Es $\frac{a}{b} = -\frac{-a}{-b}$?
  respuesta: 'No'
  solucion_pasos:
  - No, 3 cambios invierten el signo final.
- titulo: Extracción al frente
  enunciado: De $\frac{x - y}{-z}$, ¿obtenemos $-\frac{x - y}{z}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la ley de signos.
errores_frecuentes:
- Cambiar los tres signos de la fracción simultáneamente alterando su valor numérico.
- Distribuir mal el signo menos al ingresarlo a un polinomio del numerador o denominador.
- Olvidar que un número par de cambios de signo (2 cambios) preserva la equivalencia de la fracción.
- "Intercambiar $-\frac{A}{B}$ con $\frac{-A}{-B}$."
- Modificar un único signo creyendo que la fracción no cambia de valor.
afirmaciones_verdaderas:
- Cambiar exactamente dos de los tres signos de una fracción mantiene inalterado su valor algebraico.
- El signo negativo frontal se puede incorporar al numerador o al denominador invirtiendo todos sus términos.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/cambio-de-signo-global-de-una-fraccion-algebraica-resumen.svg)


  QUÉ: Manipular el signo global de una fracción algebraica aplicando la Ley de los Tres Signos.

  CÓMO: Aplicar la regla de paridad donde un número par de cambios de signo mantiene la igualdad ($\pm \frac{\pm A}{\pm B}$)
  y transferir el signo menos frontal al numerador o al denominador invirtiendo todos sus términos.

  '
