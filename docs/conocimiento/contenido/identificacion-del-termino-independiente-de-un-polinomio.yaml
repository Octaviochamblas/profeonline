procedimiento:
- 'Paso 1: Recorre el polinomio buscando un término que no esté acompañado de ninguna
  letra.'
- 'Paso 2: Si lo encuentras, recuerda incluir el signo que lo antecede. Ese es el
  término independiente.'
- 'Paso 3: Si todos los términos tienen letras, el término independiente es cero.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar identificación del término independiente de un polinomio.
ejemplos:
- titulo: El lobo solitario
  enunciado: Encuentra el término independiente en el polinomio 4x^3 - 9x^2 + x +
    15.
  solucion_pasos:
  - Buscamos el término sin letras.
  - Es el 15.
  - Como tiene un más adelante, el término independiente es +15.
- titulo: Una empresa modela sus ingresos usando $I(x) = 1500x - 2x^2 + 5000$, donde
    $x$ es la cantida
  enunciado: 'Una empresa modela sus ingresos usando $I(x) = 1500x - 2x^2 + 5000$,
    donde $x$ es la cantidad de clientes. Un economista explica que, incluso si no
    entra ningún cliente ($x = 0$), la empresa asegura un monto base garantizado.
    ¿A qué componente del polinomio corresponde este monto base? (v1)


    Opciones: A) Al término independiente ($+5000$). · B) Al coeficiente del término
    principal ($-2$). · C) Al grado absoluto del polinomio ($2$). · D) A la variable
    $x$ evaluada en cero.'
  solucion_pasos:
  - Si x=0, todos los términos con x se anulan ($1500(0) - 2(0)^2 = 0$). Solo sobrevive
    el término independiente (5000), representando el valor inicial.
  - 'Respuesta: Al término independiente ($+5000$).'
- titulo: 'Respecto de «Identificación del término independiente de un polinomio»:
    ¿La siguiente formul'
  enunciado: 'Respecto de «Identificación del término independiente de un polinomio»:
    ¿La siguiente formulación es correcta? «El **Término Independiente** de un polinomio
    es aquel término que **no tiene ninguna variable (letra)** visible»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El **Término Independiente**
    de un polinomio es aquel término que **no tiene ninguna variable (letra)** visible.'
- titulo: 'Respecto de «Identificación del término independiente de un polinomio»:
    ¿La siguiente conclu'
  enunciado: 'Respecto de «Identificación del término independiente de un polinomio»:
    ¿La siguiente conclusión es correcta? «Olvidar el signo del término independiente
    (ej. en $x^2 - 4$, decir que el independiente es 4 en lugar de -4)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El **Término Independiente**
    de un polinomio es aquel término que **no tiene ninguna variable (letra)** visible.'
errores_frecuentes:
- Olvidar el signo del término independiente (ej. en $x^2 - 4$, decir que el independiente
  es 4 en lugar de -4).
- Creer que el coeficiente del término de mayor grado es el término independiente.
- Que se encuentra al inicio del polinomio, independientemente de su orden.
- Que siempre es un número positivo.
- Para «¿Qué propiedad fundamental le otorga el nombre de 'Término Independiente'
  a una constante dentro de un polinomio? (v1)», la respuesta correcta es Que su grado
  absoluto es infinito.
afirmaciones_verdaderas:
- La notación de identificación del término independiente de un polinomio sigue las
  convenciones del lenguaje algebraico.
