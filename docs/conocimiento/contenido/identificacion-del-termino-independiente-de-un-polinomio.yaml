resumen_inicial: El término independiente de un polinomio es el término numérico constante
  que no contiene variables en su parte literal (o donde el exponente de la variable
  es 0).
explicacion_simple: En un polinomio como $3x^2 - 5x + 8$, el término independiente
  es el número $+8$. Es el único término que no lleva ninguna letra pegada y cuyo
  valor no cambia sin importar qué número le asignemos a $x$.
explicacion_formal: 'Dado un polinomio $P(x) = a_n x^n + a_{n-1} x^{n-1} + \dots +
  a_1 x + a_0$, el **Término Independiente** es la constante $a_0$, que satisface
  la evaluación polinómica en el origen:


  $$P(0) = a_n(0)^n + \dots + a_1(0) + a_0 = a_0$$


  > **Complemento didáctico:** El término independiente representa la intersección
  del polinomio con el eje de las ordenadas en su representación gráfica.'
definiciones_clave: '- **Término independiente $a_0$**: Término constante de grado
  0 que no depende de ninguna variable del polinomio.'
propiedades_relaciones: '- **Evaluación en cero**: $P(0) = a_0$ para todo polinomio
  $P(x)$.'
ejemplo_guiado:
  enunciado: Encuentre el término independiente del polinomio $P(x) = 7x^4 - 2x^3
    + 9x - 15$.
  pasos:
  - 'Paso 1: Evaluar el polinomio en $x = 0$: $P(0) = 7(0)^4 - 2(0)^3 + 9(0) - 15$.'
  - 'Paso 2: Los términos con $x$ se anulan: $0 - 0 + 0 - 15 = -15$.'
  - 'Conclusión: El término independiente es $-15$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se puede obtener algebraicamente el término independiente de cualquier
    polinomio P(x)?
  choices:
  - text: Evaluando el polinomio en x = 0 (calculando P(0))
    is_correct: true
  - text: Sumando los coeficientes de los términos de grado impar
    is_correct: false
  - text: Multiplicando por el grado mayor del polinomio
    is_correct: false
  - text: Restando los exponentes
    is_correct: false
  explanation: La alternativa correcta es 'Evaluando el polinomio en x = 0 (calculando
    P(0))'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 7x^4 - 2x^3 + 9x - 15, ¿cuál fue el término
    independiente?
  choices:
  - text: '-15'
    is_correct: true
  - text: '15'
    is_correct: false
  - text: '9'
    is_correct: false
  - text: '7'
    is_correct: false
  explanation: La alternativa correcta es '-15'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Buscar el término que no contiene letras en la expresión.'
- 'Paso 2: Incluir el signo positivo o negativo que precede a dicho número constante.'
- 'Paso 3: Si todos los términos contienen variables, declarar que el término independiente
  es igual a 0.'
errores_correccion: '- **Error 1: Omitir el signo negativo al declarar el término
  independiente de $x^2 - 8$ como $8$.** **Cómo corregirlo:** El término constante
  conserva su signo original (es $-8$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el término independiente del polinomio P(x) = 5x^3 - 4x^2 +
    12?
  alternativas:
  - '12'
  - '-4'
  - '5'
  - '0'
  respuesta: '12'
  solucion_pasos:
  - '1. Identificar el término sin variable x: +12.'
  - 2. El término independiente es 12.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el término independiente de Q(x) = 2x^4 - 7x^2 + 3x?
  alternativas:
  - '0'
  - '3'
  - '-7'
  - '2'
  respuesta: '0'
  solucion_pasos:
  - 1. Todos los términos contienen la variable x.
  - 2. Por lo tanto, el término independiente constante es 0.
- titulo: ¿Es el término independiente de P(x) = x^2 - 9 igual a -9?
  respuesta: Sí
  solucion_pasos:
  - Sí, evaluando P(0) obtenemos 0^2 - 9 = -9.
- titulo: ¿Tiene todo polinomio un término independiente distinto de cero?
  respuesta: 'No'
  solucion_pasos:
  - No, si todos los términos del polinomio poseen variables, su término independiente
    es 0.
errores_frecuentes:
- Omitir el signo negativo que precede al número constante del término independiente.
- Declarar el primer término del polinomio como término independiente sin revisar
  la presencia de letras.
- Declarar que el término independiente es 1 cuando el polinomio no contiene un número
  solo en lugar de 0.
- Declarar el término independiente con el coeficiente del término de mayor grado.
- Multiplicar el término independiente por el grado del polinomio.
afirmaciones_verdaderas:
- El término independiente de P(x) es idéntico al valor obtenido al calcular P(0).
- Si un polinomio no posee término numérico constante escrito, su término independiente
  es 0.
al_terminar_debes_poder: Al terminar serás capaz de identificar el término independiente
  de un polinomio calculando la evaluación constante en cero o ubicando el número
  sin variables.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Polinomios.
