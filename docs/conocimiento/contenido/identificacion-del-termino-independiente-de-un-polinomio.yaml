semantic_id: MAT.ALG.POLINOMIOS.TERMINO_INDEPENDIENTE
resumen_inicial: 'La identificación del término independiente de un polinomio consiste en determinar el término numérico constante que no contiene variables literales o cuyo grado relativo respecto a las variables es cero.'
explicacion_simple: |
  El **término independiente** es el "número suelto" de un polinomio:
  - Es el único término que **no lleva ninguna letra acompañándolo**.
  - Ejemplo 1: En el polinomio $P(x) = 3x^2 - 7x + 5$, el término independiente es **$+5$** (o simplemente $5$).
  - Ejemplo 2: En $Q(y) = 4y^3 - 12$, el término independiente es **$-12$** (incluye su signo negativo).
  - **¿Y si no hay ningún número suelto?** En polinomios como $R(x) = 2x^3 - 5x$, el término independiente es **$0$** (cero implícito).
  - En un gráfico de función $y = P(x)$, el término independiente señala el punto exacto donde la curva corta al eje vertical $Y$ (intersección en el origen $x=0$).
explicacion_formal: |
  ### Definición formal
  Dado un polinomio en una variable $P(x) = a_n x^n + a_{n-1} x^{n-1} + \dots + a_1 x + a_0 \in \mathbb{R}[x]$, el **término independiente** es el coeficiente escalar $a_0 \in \mathbb{R}$ asociado a la potencia de grado cero $x^0 = 1$:

  $$\operatorname{TermIndep}(P) = a_0 = P(0)$$

  ### Evaluación Funcional en el Origen
  El valor del término independiente coincide numéricamente con evaluar el polinomio en la raíz del origen $x = 0$:

  $$P(0) = a_n(0)^n + \dots + a_1(0) + a_0 = a_0$$

  ### Interpretación Geométrica
  En la representación cartesiana de la función $y = P(x)$, la pareja ordenada $(0, a_0)$ define las coordenadas del intercepto o intersección de la gráfica con el eje de las ordenadas (eje $Y$).

  ### Síntesis didáctica
  El término independiente es la constante de desplazamiento vertical del polinomio. Permite determinar el estado inicial en modelos aplicados de física y economía.
definiciones_clave: |
  - **Término independiente**: Término constante escalar $a_0$ de un polinomio que no está acompañado por variables (grado $0$).
  - **Intercepto en el eje Y**: Punto cartesiano $(0, a_0)$ donde la gráfica de la función polinómica cruza el eje vertical.
  - **Evaluación en cero ($P(0)$)**: Operación de sustitución $x=0$ que aísla el valor del término independiente.
propiedades_relaciones: |
  - **Término independiente nulo**: Si $a_0 = 0$, el polinomio no posee término independiente constante explícito y su gráfica pasa exactamente por el origen $(0,0)$.
  - **Producto de términos independientes**: El término independiente del producto de dos polinomios es igual al producto de sus términos independientes individuales ($\operatorname{TermIndep}(P \cdot Q) = a_0 \cdot b_0$).
ejemplo_guiado:
  enunciado: 'Dado el polinomio $P(x) = -5x^4 + 2x^2 - 9$, identifica el término independiente, evalúa $P(0)$ y determina las coordenadas de su intercepto con el eje Y.'
  pasos:
    - 'Paso 1: Buscamos el término constante sin letra en $P(x)$: Corresponde a **$-9$**.'
    - 'Paso 2: Evaluamos la función en $x = 0$: $P(0) = -5(0)^4 + 2(0)^2 - 9 = 0 + 0 - 9 = -9$.'
    - 'Paso 3: Formamos la pareja ordenada del intercepto en el eje Y: $(0, P(0)) = (0, -9)$.'
    - 'Conclusión: El término independiente es **$-9$**, $P(0) = \mathbf{-9}$ y el intercepto en el eje Y es **$(0, -9)$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿A qué equivale numéricamente evaluar un polinomio $P(x)$ en el valor $x = 0$?'
    choices:
      - {text: 'Equivale exactamente al valor del término independiente del polinomio ($a_0$)', is_correct: true}
      - {text: 'Equivale al coeficiente principal $a_n$', is_correct: false}
      - {text: 'Equivale al grado absoluto del polinomio', is_correct: false}
      - {text: 'Equivale siempre al valor 1', is_correct: false}
    explanation: 'La alternativa correcta es ''Equivale exactamente al valor del término independiente del polinomio ($a_0$)''. $P(0) = a_0$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el polinomio $Q(x) = 7x^3 - 4x^2 + 6x$, ¿cuál es el valor de su término independiente?'
    choices:
      - {text: 'El término independiente es $0$, porque todos los términos contienen la variable $x$', is_correct: true}
      - {text: 'El término independiente es $6$', is_correct: false}
      - {text: 'El término independiente es $7$', is_correct: false}
      - {text: 'El término independiente es $-4$', is_correct: false}
    explanation: 'La alternativa correcta es ''El término independiente es $0$, porque todos los términos contienen la variable $x$''. Al evaluar $Q(0) = 0$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar los términos que componen el polinomio.'
  - 'Paso 2: Localizar aquel término que no contenga variables literales (o evaluar $x=0$).'
  - 'Paso 3: Extraer la cifra constante incluyendo su signo positivo o negativo.'
  - 'Paso 4: Si todos los términos contienen letras, declarar que el término independiente es $0$.'
errores_correccion: |
  - **Error 1:** Excluir el signo negativo del término independiente (ej: decir que en $x^2 - 8$ el término independiente es $8$). **Cómo corregirlo:** El signo negativo **forma parte del término independiente** (es $-8$).
  - **Error 2:** Tomar como término independiente al último término escrito cuando el polinomio está desordenado. **Cómo corregirlo:** El término independiente **es el número constante sin letras**, no importa la posición donde se ubique.
ejemplos:
  - titulo: 'Identificación directa'
    enunciado: '¿Cuál es el término independiente del polinomio $P(x) = -2x^3 + 5x^2 - 13$?'
    alternativas:
      - '$-13$'
      - '$5$'
      - '$-2$'
    respuesta: '$-13$'
    solucion_pasos:
      - '1. El término constante sin variable es $-13$.'
      - '2. El término independiente es $-13$.'
  - titulo: 'Término independiente en polinomio desordenado'
    enunciado: 'En el polinomio $Q(x) = 15 - 4x^2 + 9x$, ¿cuál es el término independiente?'
    alternativas:
      - '$15$'
      - '$9$'
      - '$-4$'
    respuesta: '$15$'
    solucion_pasos:
      - '1. El número suelto sin letra es $15$.'
      - '2. Su término independiente es $15$.'
  - titulo: 'Intersección con el eje Y'
    enunciado: 'En la función cuadrática $f(x) = x^2 - 6x + 8$, ¿corta la parábola al eje Y en el punto $(0, 8)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el término independiente $8$ define el intercepto $(0,8)$.'
  - titulo: 'Término independiente de un producto'
    enunciado: 'Si multiplicamos $(x + 3)(x - 5)$, ¿el término independiente resultante es $3 \cdot (-5) = -15$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(3)(-5) = -15$ es el producto de sus constantes.'
errores_frecuentes:
  - 'El término independiente de un polinomio es siempre el primer término escrito a la izquierda.'
  - 'Un polinomio en el que todos sus términos llevan variables no posee término independiente en su evaluación.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'El signo negativo del término independiente no debe incluirse al evaluar el intercepto.'
  - 'El término independiente cambia de valor si se multiplica el polinomio por una variable x.'
afirmaciones_verdaderas:
  - 'El término independiente de un polinomio es la constante escalar que no lleva variables acompañantes.'
  - 'El valor del término independiente coincide numéricamente con evaluar el polinomio en la variable igual a cero ($P(0)$).'
al_terminar_debes_poder: 'Identificar el término independiente de cualquier polinomio evaluando $P(0)$ y determinando el intercepto de su gráfica con el eje Y.'
