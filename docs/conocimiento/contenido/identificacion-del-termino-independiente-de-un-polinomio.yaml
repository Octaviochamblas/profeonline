semantic_id: MAT.ALG.POLINOMIOS.TERMINO_INDEPENDIENTE
resumen_inicial: 'Identificación del término independiente de un polinomio: concepto
  y propiedades en Grado, ordenamiento e igualdad de polinomios.'
explicacion_simple: 'En una fiesta llena de letras mutantes, siempre hay un invitado
  que se niega a usar disfraz: el número puro. Ese es el término independiente.'
explicacion_formal: '### Definición formal


  Al no estar multiplicado por variables, su valor es inmutable y no ''depende'' de
  los valores de x, y, etc.


  ### Desarrollo didáctico


  Su nombre se debe a que su valor *no depende* de las letras.

  En $P(x) = 2x^2 + 5x - 7$:

  - $2x^2$ y $5x$ cambiarán de valor dependiendo del número que metamos en $x$.

  - El $-7$ siempre valdrá $-7$. Es independiente del valor de $x$.


  Matemáticamente, el término independiente tiene a la variable elevada a la potencia
  cero ($x^0 = 1$). Por eso decimos que es el término de ''grado cero''.


  Si un polinomio no tiene ningún número suelto (ej. $x^3 + 5x$), su término independiente
  es igual a $0$.'
definiciones_clave: '- **Identificación del término independiente de un polinomio**:
  Elemento fundamental del lenguaje algebraico.'
propiedades_relaciones: '- **Propiedades de Identificación del término independiente
  de un polinomio**: Reglas de notación y clasificación en grado, ordenamiento e igualdad
  de polinomios.'
