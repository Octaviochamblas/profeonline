semantic_id: MAT.ALG.POLINOMIOS.TERMINO_INDEPENDIENTE
resumen_inicial: 'El término independiente de un polinomio es el término constante que no contiene variables literales, equivalente al valor numérico del polinomio evaluado en cero.'
explicacion_simple: |
  - El **término independiente (T.I.)** es el número "suelto" que no está multiplicado por ninguna letra (es de grado $0$).
  - En $P(x) = 4x^3 - 5x^2 + 7x - 9$, el término independiente es **$-9$** (¡siempre con su signo negativo!).
  - **Método infalible para hallarlo:**
    - Se reemplazan todas las variables por cero ($x = 0$).
    - $P(0) = 4(0)^3 - 5(0)^2 + 7(0) - 9 = -9$.
  - Si todos los términos tienen letras (como en $2x^2 + 3x$), el término independiente es **$0$**.

  ![Término Independiente](/static/img/nodos/identificacion-del-termino-independiente-de-un-polinomio-intro.svg)
explicacion_formal: |
  ### Definición formal
  Sea $P(x) = \sum_{i=0}^n a_i x^i \in \mathbb{K}[x]$. El **término independiente** de $P$, denotado $\operatorname{TI}(P)$ o $a_0$, es el coeficiente escalar correspondiente al monomio de grado cero ($x^0$):

  $$\operatorname{TI}(P) = a_0 = P(0)$$

  ### Propiedad funcional multivariable
  Para un polinomio en varias variables $P(x_1, \dots, x_n)$, el término independiente es el valor numérico obtenido al anular todas las variables simultáneamente:
  $$\operatorname{TI}(P) = P(0, 0, \dots, 0)$$

  ### Álgebra de términos independientes
  1. **T.I. de la suma:** $\operatorname{TI}(P + Q) = \operatorname{TI}(P) + \operatorname{TI}(Q)$.
  2. **T.I. del producto:** $\operatorname{TI}(P \cdot Q) = \operatorname{TI}(P) \cdot \operatorname{TI}(Q)$.
  3. **T.I. de potencias:** $\operatorname{TI}(P^k) = [\operatorname{TI}(P)]^k$.
definiciones_clave: |
  - **Término independiente**: Término constante sin factores variables ($GA = 0$).
  - **Evaluación en cero**: Propiedad fundamental $\operatorname{TI}(P) = P(0)$.
  - **Término nulo**: Condición en que $\operatorname{TI}(P) = 0$ debido a que todas las componentes contienen factores literales.
propiedades_relaciones: |
  - **Intersección con el eje Y**: En la gráfica de una función polinomial $y = P(x)$, el punto de corte con el eje vertical es exactamente $(0, \operatorname{TI}(P))$.
  - **Cálculo directo en expresiones factorizadas**: En $P(x) = (2x - 3)(x + 4)$, el término independiente se obtiene evaluando $P(0) = (-3)(4) = -12$.
ejemplo_guiado:
  enunciado: 'Determina el término independiente del polinomio factorizado $P(x) = (2x - 3)^3 (x + 2) + 5(x - 1) + 8$ sin necesidad de expandir todos los productos.'
  imagen: '/static/img/nodos/identificacion-del-termino-independiente-de-un-polinomio-ejemplos.svg'
  pasos:
    - 'Paso 1: Aplicamos el teorema del término independiente: evaluamos $P(0)$.'
    - 'Paso 2: Sustituimos $x = 0$ en el primer bloque: $(2(0) - 3)^3 (0 + 2) = (-3)^3 (2) = (-27)(2) = -54$.'
    - 'Paso 3: Sustituimos $x = 0$ en el segundo bloque: $5(0 - 1) = 5(-1) = -5$.'
    - 'Paso 4: Sumamos la constante final: $-54 - 5 + 8 = **-51$**.'
    - 'Paso 5: Conclusión: El término independiente del polinomio es **$-51$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el término independiente del polinomio $P(x) = 7x^4 - 3x^2 + 5x - 14$?'
    choices:
      - text: '$-14$, incluyendo su signo negativo'
        is_correct: true
      - text: '$14$, porque los términos independientes son siempre positivos'
        is_correct: false
      - text: '$7$, porque es el coeficiente principal'
        is_correct: false
      - text: '$0$, porque tiene grado 4'
        is_correct: false
    explanation: 'La alternativa correcta es ''$-14$, incluyendo su signo negativo''. El término independiente conserva el signo del monomio constante.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el polinomio $P(x) = (3x - 2)(2x + 5)$, ¿cuál es el término independiente calculado como $P(0)$?'
    choices:
      - text: '$-10$, porque $(-2) \cdot (5) = -10$'
        is_correct: true
      - text: '$10$'
        is_correct: false
      - text: '$6$'
        is_correct: false
      - text: '$3$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$-10$, porque $(-2) \cdot (5) = -10$''. $P(0) = (3(0) - 2)(2(0) + 5) = (-2)(5) = -10$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Si el polinomio está en forma desarrollada, localizar el término que carece de variables.'
  - 'Paso 2: Si el polinomio está factorizado o desordenado, sustituir todas las variables por cero ($x = 0$).'
  - 'Paso 3: Realizar las operaciones aritméticas de constantes resultantes.'
  - 'Paso 4: Conservar el signo obtenido como el término independiente.'
errores_correccion: |
  - **Error 1:** Omitir el signo negativo del término independiente. **Cómo corregirlo:** En $2x - 7$, el término independiente es **$-7$**, no $7$.
  - **Error 2:** Desarrollar productos largos innecesariamente para hallar el T.I. **Cómo corregirlo:** Evaluar directamente **$P(0)$** para ahorrar tiempo y evitar errores algebraicos.
ejemplos:
  - titulo: 'Término independiente en binomio al cubo'
    enunciado: '¿Cuál es el término independiente del polinomio $P(x) = (2x - 3)^3$?'
    alternativas:
      - '$-27$'
      - '$27$'
      - '$-9$'
    respuesta: '$-27$'
    solucion_pasos:
      - '1. Evaluamos $P(0) = (2(0) - 3)^3 = (-3)^3$.'
      - '2. $(-3)^3 = -27$.'
      - '3. El término independiente es $-27$.'
  - titulo: 'Polinomio sin término constante'
    enunciado: 'En $Q(x) = 4x^3 - 8x^2 + 6x$, ¿cuál es el valor del término independiente?'
    alternativas:
      - '$0$'
      - '$6$'
      - '$4$'
    respuesta: '$0$'
    solucion_pasos:
      - '1. $Q(0) = 4(0) - 8(0) + 6(0) = 0$.'
      - '2. El término independiente es 0.'
  - titulo: 'Equivalencia funcional en cero'
    enunciado: '¿Es el término independiente de cualquier polinomio igual al valor de la función evaluada en $x = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Todos los términos con $x$ se anulan al multiplicar por 0.'
      - '2. Solo subsiste el término constante $a_0 = P(0)$.'
  - titulo: 'Dependencia de variables'
    enunciado: '¿Cambia el valor del término independiente cuando varía el valor de $x$?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Por definición, el término independiente es constante.'
      - '2. No depende del valor que adopte la variable $x$.'
errores_frecuentes:
  - 'Olvidar el signo negativo al enunciar el término independiente.'
  - 'Asumir que el término independiente es siempre el último término de un polinomio desordenado.'
  - 'Expandir polinomios factorizados complejos en vez de evaluar directamente en cero ($P(0)$).'
  - 'Creer que un polinomio sin término constante explícito no tiene término independiente (su valor es cero).'
  - 'Confundir el coeficiente principal con el término independiente.'
afirmaciones_verdaderas:
  - 'El término independiente de un polinomio es el coeficiente constante correspondiente al monomio de grado cero.'
  - 'Para cualquier polinomio $P(x)$, su término independiente es idéntico al valor numérico $P(0)$.'
al_terminar_debes_poder: |
  ![Resumen de Término Independiente](/static/img/nodos/identificacion-del-termino-independiente-de-un-polinomio-resumen.svg)

  QUÉ: Identificar y calcular el término independiente de polinomios desarrollados o factorizados reconociendo su grado cero y evaluando $P(0)$.
  CÓMO: Aislando la constante no nula con su signo o evaluando la función polinomial en cero ($P(0, \dots, 0) = a_0$).
