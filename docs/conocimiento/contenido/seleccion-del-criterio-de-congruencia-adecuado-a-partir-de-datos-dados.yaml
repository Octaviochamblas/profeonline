semantic_id: MAT.GEO.CONGRUENCIA_TRIANGULOS.USO_CRITERIOS
resumen_inicial: 'La selección del criterio de congruencia adecuado consiste en analizar la naturaleza y posición relativa de los tres datos conocidos en ambos triángulos para aplicar LLL, LAL, ALA o $LLA_>$.'
explicacion_simple: |
  ![Selección y Aplicación de Criterios de Congruencia](/static/img/nodos/seleccion-del-criterio-de-congruencia-adecuado-a-partir-de-datos-dados-intro.svg)

  Miras qué datos tienes: si son 3 lados usas LLL; si son 2 lados con el ángulo en medio usas LAL; si son 2 ángulos y un lado usas ALA; y si el ángulo está frente al lado más largo usas LLA>.
explicacion_formal: |
  ### Algoritmo formal de selección
  Dado un par de triángulos $\Delta_1$ y $\Delta_2$ con tres pares de elementos homólogos congruentes:

  1. **Identificar la composición del conjunto de datos**:
     - **Caso 3L (Tres lados)**: Aplicar **Criterio LLL**.
     - **Caso 2L + 1A (Dos lados y un ángulo)**:
       - Si el ángulo está comprendido entre los dos lados: Aplicar **Criterio LAL**.
       - Si el ángulo se opone al lado de mayor longitud: Aplicar **Criterio $LLA_>$**.
       - Si el ángulo se opone al lado menor: *Datos insuficientes (caso ambiguo)*.
     - **Caso 1L + 2A (Un lado y dos ángulos)**:
       - Si el lado une los dos ángulos: Aplicar **Criterio ALA**.
       - Si el lado es opuesto a uno de los ángulos: Usar $\sum = 180^\circ$ y aplicar **Criterio LAA/ALA**.
     - **Caso 3A (Tres ángulos)**: *No garantiza congruencia* (solo semejanza $\sim$).

  2. **Formular la congruencia**: Establecer $\Delta ABC \cong \Delta DEF$ respetando la correspondencia de vértices.

  ### Síntesis didáctica
  Este árbol de decisión algorítmico sistematiza la resolución de problemas geométricos en pruebas estandarizadas y olimpiadas.
definiciones_clave: |
  - **Congruencia de figuras ($\cong$)**: Relación geométrica donde dos figuras tienen idéntica forma y tamaño.
  - **Isometría**: Transformación del plano (traslación, rotación o reflexión) que conserva distancias y ángulos.
  - **Vértices homólogos**: Vértices que ocupan la misma posición relativa en figuras congruentes.
  - **Lados y ángulos homólogos**: Elementos correspondientes que tienen exactamente la misma medida.
propiedades_relaciones: |
  - **CPCTC**: Las partes correspondientes de triángulos congruentes son congruentes entre sí.
  - **Invarianza métrica**: Si $\Delta ABC \cong \Delta DEF$, entonces $P(\Delta ABC) = P(\Delta DEF)$ y $\text{Área}(\Delta ABC) = \text{Área}(\Delta DEF)$.
  - **Cuatro Criterios Básicos**: LLL, LAL, ALA y $\text{LLA}_{>}$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Selección y Aplicación de Criterios de Congruencia](/static/img/nodos/seleccion-del-criterio-de-congruencia-adecuado-a-partir-de-datos-dados-ejemplos.svg)

    Identifica la correspondencia de vértices y aplica los criterios de congruencia para deducir las medidas y relaciones solicitadas.
  pasos:
  - 'Paso 1: Analizar los datos geométricos dados (lados, ángulos y su posición relativa).'
  - 'Paso 2: Establecer la correspondencia de vértices homólogos entre ambos triángulos.'
  - 'Paso 3: Verificar qué criterio de congruencia (LLL, LAL, ALA o $\text{LLA}_{>}$) se cumple.'
  - 'Paso 4: Concluir formalmente $\Delta ABC \cong \Delta DEF$.'
  - 'Paso 5: Transferir las medidas incógnitas mediante el principio CPCTC.'
