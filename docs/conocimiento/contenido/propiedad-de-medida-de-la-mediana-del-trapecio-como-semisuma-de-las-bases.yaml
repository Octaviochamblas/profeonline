semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.MEDIANA_TRAPECIO_MEDIDA
resumen_inicial: 'La longitud de la mediana de un trapecio es igual a la semisuma de sus bases: M = (B + b) / 2.'
explicacion_simple: '¿Cuánto mide de largo la mediana de un trapecio? La respuesta es facilísima: **mide el promedio exacto de las dos bases**.


  Solo tienes que sumar la base mayor ($B$) con la base menor ($b$) y **dividir el resultado por 2**: **$M = \frac{B + b}{2}$**. Por ejemplo, si la base de abajo mide 14 cm y la de arriba mide 6 cm, la mediana medirá $\frac{14 + 6}{2} = \frac{20}{2} = 10\text{ cm}$. ¡Queda exactamente al medio de ambas medidas!


  ![Medida de la mediana como semisuma de las bases](/static/img/nodos/propiedad-de-medida-de-la-mediana-del-trapecio-como-semisuma-de-las-bases-intro.svg)

  '
explicacion_formal: '### Teorema de la medida de la mediana

  Sea $\mathcal{ABCD}$ un trapecio con base mayor $B$ y base menor $b$. La longitud métrica de la mediana $\overline{MN}$, denotada por $M$, es la media aritmética de las longitudes de las bases:

  $$M = \frac{B + b}{2} \iff 2M = B + b$$


  ### Deducción algebraica

  Retomando la demostración del paralelismo, al prolongar $\overline{DN}$ hasta cortar la prolongación de la base mayor en $E$, se demostró que $\triangle CND \cong \triangle BNE$.

  1. Por congruencia de triángulos: $BE = CD = b$.

  2. La base total del triángulo $\triangle ADE$ es $AE = AB + BE = B + b$.

  3. Como $\overline{MN}$ es la base media del triángulo $\triangle ADE$, por el teorema de la base media su longitud es exactamente la mitad de la base sobre la que se apoya:

  $$MN = \frac{AE}{2} = \frac{B + b}{2}$$


  ### Despeje de bases

  Conociendo la mediana $M$ y una de las bases, la otra se despeja de inmediato:

  $$B = 2M - b \quad \wedge \quad b = 2M - B$$


  > **Complemento didáctico:** No confundas la fórmula de la mediana con la del segmento entre las diagonales: la mediana es la SUMA partida en dos ($M = \frac{B+b}{2}$), mientras que el pequeño segmento que une los puntos medios de las diagonales es la RESTA partida en dos ($P = \frac{B-b}{2}$).

  '
definiciones_clave: '- **Semisuma**: Suma de dos cantidades dividida por dos (promedio o media aritmética).

  - **Mediana ($M$)**: Longitud del segmento medio del trapecio dada por $M = \frac{B + b}{2}$.

  - **Segmento entre diagonales**: Segmento que une los puntos medios de las diagonales con medida $P_d = \frac{B - b}{2}$.

  '
propiedades_relaciones: '- **Equivalencia de área**: El área del trapecio puede calcularse directamente como base media por altura: $A = M \cdot h$.

  - **Progresión aritmética**: Las longitudes de la base menor $b$, la mediana $M$ y la base mayor $B$ forman una progresión aritmética estricta con diferencia $d = \frac{B - b}{2}$.

  - **Invarianza de lados laterales**: La longitud de la mediana depende ÚNICAMENTE de las bases, sin importar las longitudes de los lados laterales.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de medida de la mediana](/static/img/nodos/propiedad-de-medida-de-la-mediana-del-trapecio-como-semisuma-de-las-bases-ejemplos.svg)


    La mediana de un trapecio mide $12$ cm y la base mayor mide $17$ cm. Calcula la longitud de la base menor.'
  pasos:
  - 'Paso 1: Plantear la ecuación fundamental de la mediana: $M = \frac{B + b}{2} \implies 12 = \frac{17 + b}{2}$.'
  - 'Paso 2: Multiplicar por 2 a ambos lados: $24 = 17 + b$.'
  - 'Paso 3: Despejar la base menor $b$: $b = 24 - 17 = 7$ cm.'
  - 'Paso 4: Comprobar el resultado: $\frac{17 + 7}{2} = \frac{24}{2} = 12$ cm.'
checkpoints:
- placement: after_explicacion_formal
  question: Si las bases de un trapecio miden 18 cm y 10 cm, ¿cuánto mide su mediana?
  choices:
  - text: 14 cm.
    is_correct: true
  - text: 28 cm.
    is_correct: false
  - text: 8 cm.
    is_correct: false
  - text: 4 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''14 cm.'' Aplicando la semisuma: $M = \frac{B + b}{2} = \frac{18 + 10}{2} = \frac{28}{2} = 14$ cm.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si la mediana de un trapecio mide 15 cm y la base menor mide 9 cm, ¿cuánto mide la base mayor?
  choices:
  - text: 21 cm.
    is_correct: true
  - text: 12 cm.
    is_correct: false
  - text: 24 cm.
    is_correct: false
  - text: 30 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''21 cm.'' Despejando: $B = 2M - b = 2(15) - 9 = 30 - 9 = 21$ cm.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar las longitudes de las bases mayor $B$ y menor $b$.

  2. Sumar ambas bases: $B + b$.

  3. Dividir el resultado entre 2: $M = (B + b) / 2$.

  4. Si se conoce la mediana y una base, aplicar $B = 2M - b$ o $b = 2M - B$.

  '
errores_correccion: '- **Error común 1:** Restar las bases en lugar de sumarlas. **Corrección:** La mediana es el promedio (suma dividida en 2); la resta $(B - b)/2$ es el segmento entre diagonales.

  - **Error común 2:** Olvidar dividir por 2 y responder $B + b$. **Corrección:** $B + b$ es la suma total, la mediana es la mitad.

  '
ejemplos:
- tipo: A
  titulo: Cálculo directo de mediana
  enunciado: Las bases de un trapecio miden $22\text{ cm}$ y $14\text{ cm}$. ¿Cuál es la medida de su mediana?
  alternativas:
  - text: $18\text{ cm}$.
    is_correct: true
  - text: $36\text{ cm}$.
    is_correct: false
  - text: $8\text{ cm}$.
    is_correct: false
  - text: $4\text{ cm}$.
    is_correct: false
  explicacion: $M = \frac{22 + 14}{2} = \frac{36}{2} = 18\text{ cm}$.
- tipo: B
  titulo: Mediana mayor que la base menor
  enunciado: ¿Es la mediana de un trapecio siempre estrictamente mayor que su base menor?
  respuesta: Sí
  explicacion: Sí. Al ser el promedio entre dos números positivos distintos ($B > b$), siempre se cumple $b < M < B$.
errores_frecuentes:
- '''Restar las bases en vez de sumarlas al calcular la mediana.'''
- '''Confundir la semisuma con el producto de las bases.'''
- '''Promediar los lados laterales en lugar de las bases paralelas.'''
afirmaciones_verdaderas:
- '''La mediana de un trapecio mide exactamente la semisuma de sus bases ($M = \frac{B + b}{2}$).'''
- '''La longitud de la mediana se ubica estrictamente entre la medida de la base menor y la base mayor ($b < M < B$).'''
- '''El área de un trapecio equivale al producto de su mediana por su altura ($A = M \cdot h$).'''
al_terminar_debes_poder: '**QUÉ:** Calcular la medida de la mediana de un trapecio y despejar longitudes de bases desconocidas.


  **CÓMO:** Empleando la relación algebraica $M = \frac{B + b}{2}$ y sus despejes lineales $2M = B + b$.


  ![Síntesis de medida de mediana](/static/img/nodos/propiedad-de-medida-de-la-mediana-del-trapecio-como-semisuma-de-las-bases-resumen.svg)

  '
