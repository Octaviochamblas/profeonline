semantic_id: MAT.ALG.FRACCIONES_RESTA.IGUAL_DENOMINADOR
resumen_inicial: Para restar fracciones algebraicas de igual denominador, se restan
  los numeradores protegiendo el segundo con paréntesis y se conserva el denominador
  común.
explicacion_simple: 'La resta de fracciones de igual denominador sigue la misma base
  que la suma: el denominador no cambia.

  Sin embargo, la resta exige un cuidado muy especial:

  El signo menos (-) que está entre las fracciones debe restar a TODO el numerador
  de la segunda fracción. Por eso, siempre debemos encerrar el segundo numerador entre
  paréntesis antes de restar.'
explicacion_formal: 'Dadas dos fracciones algebraicas $\frac{A(x)}{D(x)}$ y $\frac{B(x)}{D(x)}$
  con $D(x) \neq 0$, la **sustracción de igual denominador** se define formalmente
  como:


  $$\frac{A(x)}{D(x)} - \frac{B(x)}{D(x)} = \frac{A(x) - (B(x))}{D(x)}$$


  **Desglose de la fórmula:**

  - $A(x) - (B(x))$: Resta polinomial de los numeradores donde el paréntesis del segundo
  término $B(x)$ asegura que el signo menos afecte a todos sus componentes.

  - $D(x)$: Denominador común no nulo que permanece inalterado.'
definiciones_clave: '- **Sustracción de igual denominador**: Operación donde los numeradores
  se restan respetando el paréntesis en el sustraendo y el denominador se conserva.

  - **Protección del sustraendo**: Uso obligatorio de paréntesis en $B(x)$ para evitar
  errores en la distribución de signos.'
propiedades_relaciones: '- **Asimetría de la resta**: La sustracción no es conmutativa
  $\frac{A}{D} - \frac{B}{D} \neq \frac{B}{D} - \frac{A}{D}$.

  - **Dominio**: $\operatorname{Dom} = \{x \in \mathbb{R} \mid D(x) \neq 0\}$.'
ejemplo_guiado:
  enunciado: Resta las fracciones algebraicas de igual denominador $\frac{5x + 3}{x
    - 2} - \frac{2x - 1}{x - 2}$, reduce el numerador y evalúa el resultado para $x
    = 4$.
  pasos:
  - 'Paso 1: Conservar el denominador $(x - 2)$ y escribir la resta de numeradores
    protegiendo el segundo: $\frac{(5x + 3) - (2x - 1)}{x - 2}$.Paso 2: Distribuir
    el signo menos en el segundo paréntesis: $5x + 3 - 2x + 1$.Paso 3: Reducir los
    términos semejantes: $5x - 2x = 3x$ y $3 + 1 = 4$, obteniendo $\frac{3x + 4}{x
    - 2}$ para $x \neq 2$.Paso 4: Evaluar para $x = 4$: $\frac{3(4) + 4}{4 - 2} =
    \frac{12 + 4}{2} = \frac{16}{2} = 8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión equivalente correcta al restar $\frac{5x + 3}{x
    - 2} - \frac{2x - 1}{x - 2}$?
  choices:
  - text: $\frac{3x + 4}{x - 2}$
    is_correct: true
  - text: $\frac{3x + 2}{x - 2}$
    is_correct: false
  - text: $\frac{7x + 4}{x - 2}$
    is_correct: false
  - text: $\frac{3x + 4}{0}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{3x + 4}{x - 2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la resta simplificada $\frac{3x + 4}{x - 2}$ para $x = 4$,
    ¿cuál es el valor obtenido?
  choices:
  - text: $8$
    is_correct: true
  - text: $16$
    is_correct: false
  - text: $4$
    is_correct: false
  - text: $12$
    is_correct: false
  explanation: La alternativa correcta es '$8$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que los denominadores sean exactamente iguales.'
- 'Paso 2: Escribir una única barra de fracción con el denominador común.'
- 'Paso 3: Colocar el primer numerador menos el segundo numerador encerrado entre
  paréntesis.'
- 'Paso 4: Distribuir el signo negativo cambiando el signo a cada término dentro del
  paréntesis.'
- 'Paso 5: Reducir los términos semejantes del numerador.'
errores_correccion: '- **Error común:** Cambiar únicamente el signo del primer término
  del segundo numerador.

  - **Cómo corregirlo:** Pon SIEMPRE el segundo numerador entre paréntesis $-(2x -
  1) = -2x + 1$ para cambiar el signo de TODOS sus términos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sustracción.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sustracción.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El signo menos afecta a todo el segundo numerador?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la ley distributiva de la resta.
- titulo: ¿Es conmutativa la sustracción de fracciones?
  respuesta: 'No'
  solucion_pasos:
  - No, restar $A - B$ da un resultado opuesto a $B - A$.
errores_frecuentes:
- Restar los denominadores al realizar la sustracción de fracciones algebraicas.
- Olvidar colocar paréntesis en el segundo numerador al restar.
- Cambiar solo el signo del primer término del sustraendo.
- Restar numeradores de fracciones de distinto denominador sin homogeneizar.
- Confundir el m.c.m. con el producto simple de los denominadores.
afirmaciones_verdaderas:
- Al restar fracciones algebraicas se conserva el denominador común y se restan los
  numeradores.
- El signo negativo de la sustracción invierte el signo de todos los términos del
  segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás efectuar sustracciones de
  fracciones algebraicas aplicando correctamente la distribución de signos y simplificación
  del resultado.
