semantic_id: MAT.ALG.FRACCIONES_RESTA.IGUAL_DENOMINADOR
resumen_inicial: Para restar fracciones algebraicas de igual denominador, se restan los numeradores protegiendo el segundo con paréntesis y se conserva el denominador común.
explicacion_simple: |
  La resta de fracciones de igual denominador mantiene intacto el denominador común en el resultado final.

  Sin embargo, la sustracción exige una precaución fundamental: el signo negativo ($-$) ubicado entre las fracciones resta a la totalidad del polinomio del segundo numerador.

  Por ello, debemos encerrar obligatoriamente el segundo numerador entre paréntesis antes de restar para distribuir la inversión de signos a todos sus términos.
explicacion_formal: |
  ### Definición formal
  Dadas dos fracciones algebraicas $\frac{A(x)}{D(x)}$ y $\frac{B(x)}{D(x)}$ con $D(x) \neq 0$, la **sustracción de igual denominador** se define formalmente como:

  $$\frac{A(x)}{D(x)} - \frac{B(x)}{D(x)} = \frac{A(x) - (B(x))}{D(x)}$$

  ### Desglose de la fórmula
  - $A(x) - (B(x))$: Resta polinomial de los numeradores donde el paréntesis del segundo término $B(x)$ asegura que el signo menos afecte a todos sus componentes.
  - $D(x)$: Denominador común no nulo que permanece inalterado.

  ### Síntesis didáctica
  Restar fracciones homogéneas requiere mantener la expresión del denominador y distribuir la negación a cada uno de los términos del segundo numerador.
definiciones_clave: |
  - **Sustracción de igual denominador**: Operación donde los numeradores se restan respetando el paréntesis en el sustraendo y el denominador se conserva.
  - **Protección del sustraendo**: Uso obligatorio de paréntesis en $B(x)$ para evitar errores en la distribución de signos.
propiedades_relaciones: |
  - **Asimetría de la resta**: La sustracción no es conmutativa ($\frac{A}{D} - \frac{B}{D} \neq \frac{B}{D} - \frac{A}{D}$).
  - **Dominio**: $\operatorname{Dom} = \{x \in \mathbb{R} \mid D(x) \neq 0\}$.
ejemplo_guiado:
  enunciado: 'Resta las fracciones algebraicas de igual denominador $\frac{5x + 3}{x - 2} - \frac{2x - 1}{x - 2}$, reduce el numerador y evalúa el resultado para $x = 4$.'
  pasos:
    - 'Paso 1: Conservar el denominador $(x - 2)$ y escribir la resta de numeradores protegiendo el segundo: $\frac{(5x + 3) - (2x - 1)}{x - 2}$.'
    - 'Paso 2: Distribuir el signo menos en el segundo paréntesis: $5x + 3 - 2x + 1$.'
    - 'Paso 3: Reducir los términos semejantes: $5x - 2x = 3x$ y $3 + 1 = 4$, obteniendo $\frac{3x + 4}{x - 2}$ para $x \neq 2$.'
    - 'Paso 4: Evaluar para $x = 4$: $\frac{3(4) + 4}{4 - 2} = \frac{12 + 4}{2} = \frac{16}{2} = 8$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la expresión equivalente correcta al restar $\frac{5x + 3}{x - 2} - \frac{2x - 1}{x - 2}$?'
    choices:
      - {text: '$\frac{3x + 4}{x - 2}$', is_correct: true}
      - {text: '$\frac{3x + 2}{x - 2}$', is_correct: false}
      - {text: '$\frac{7x + 4}{x - 2}$', is_correct: false}
      - {text: '$\frac{3x + 4}{0}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{3x + 4}{x - 2}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar la resta simplificada $\frac{3x + 4}{x - 2}$ para $x = 4$, ¿cuál es el valor obtenido?'
    choices:
      - {text: '$8$', is_correct: true}
      - {text: '$16$', is_correct: false}
      - {text: '$4$', is_correct: false}
      - {text: '$12$', is_correct: false}
    explanation: 'La alternativa correcta es ''$8$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Confirmar que los denominadores de las fracciones a restar sean idénticos.'
  - 'Paso 2: Escribir una única barra de fracción conservando el denominador común.'
  - 'Paso 3: Colocar el primer numerador menos el segundo numerador encerrado entre paréntesis.'
  - 'Paso 4: Distribuir el signo negativo cambiando el signo a cada uno de los términos dentro del paréntesis.'
  - 'Paso 5: Reducir los términos semejantes del numerador y simplificar si aplica.'
errores_correccion: |
  - **Error 1:** Cambiar únicamente el signo del primer término del segundo numerador (escribir $-(2x - 1) = -2x - 1$). **Cómo corregirlo:** El signo menos **AFECTA A TODOS LOS TÉRMINOS DEL SEGUNDO NUMERADOR: $-(2x - 1) = -2x + 1$**.
  - **Error 2:** Restar los denominadores comunes entre sí obteniendo un denominador nulo. **Cómo corregirlo:** El denominador común **SE MANTIENEN INTACTO EN LA RESPUESTA FINAL; NUNCA SE RESTAN LOS DENOMINADORES**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es el resultado de restar $\frac{4x}{x+1} - \frac{x-2}{x+1}$?'
    alternativas:
      - '$\frac{3x+2}{x+1}$'
      - '$\frac{3x-2}{x+1}$'
      - '$\frac{5x-2}{x+1}$'
    respuesta: '$\frac{3x+2}{x+1}$'
    solucion_pasos:
      - '1. Numerador: $4x - (x - 2) = 4x - x + 2 = 3x + 2$.'
      - '2. Denominador común: $x+1$.'
      - '3. Resultado: $\frac{3x+2}{x+1}$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al restar $\frac{x^2+5}{x-3} - \frac{x+5}{x-3}$, ¿cuál es el numerador reducido?'
    alternativas:
      - '$x^2 - x$'
      - '$x^2 - x + 10$'
      - '$x^2 + x$'
    respuesta: '$x^2 - x$'
    solucion_pasos:
      - '1. Distribuir el menos: $x^2 + 5 - x - 5$.'
      - '2. Cancelar $5 - 5 = 0$: resulta $x^2 - x$.'
  - titulo: 'Efecto del signo menos'
    enunciado: '¿El signo menos entre dos fracciones cambia el signo de todos los términos del sustraendo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la ley de distribución del signo negativo.'
  - titulo: 'Conmutatividad en la resta'
    enunciado: '¿Restar $\frac{A}{D} - \frac{B}{D}$ es equivalente a $\frac{B}{D} - \frac{A}{D}$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, la sustracción no es conmutativa y altera el signo del resultado.'
errores_frecuentes:
  - 'Cambiar el signo solo del primer término del segundo numerador al sustraer.'
  - 'Restar los denominadores comunes entre sí en lugar de conservarlos.'
  - 'Omitir los paréntesis al escribir el segundo numerador tras el signo de resta.'
  - 'Restar numeradores de fracciones con distinto denominador sin haber homogeneizado previamente.'
  - 'Sumar los términos semejantes en lugar de restarlos tras la distribución de signos.'
afirmaciones_verdaderas:
  - 'Al restar fracciones algebraicas homogéneas se conserva el denominador común y se restan los numeradores.'
  - 'El signo negativo de la sustracción invierte el signo de todos los términos del segundo numerador.'
al_terminar_debes_poder: |
  Efectuar sustracciones de fracciones algebraicas de igual denominador distribuyendo el signo negativo a todos los términos del sustraendo y reduciendo el numerador resultante.
