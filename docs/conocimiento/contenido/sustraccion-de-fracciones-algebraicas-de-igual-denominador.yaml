procedimiento:
- 'Paso 1: Confirma denominadores iguales.'
- 'Paso 2: Escribe la única fracción.'
- 'Paso 3: Coloca el primer numerador, luego un signo MENOS, y luego el segundo numerador
  (preferiblemente entre paréntesis.).'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en sustracción de fracciones algebraicas de igual denominador.
ejemplos:
- titulo: Resta $\frac{9m}{4} - \frac{2m}{4}$
  enunciado: Resta $\frac{9m}{4} - \frac{2m}{4}$.
  solucion_pasos:
  - 'Denominador común: 4.'
  - 'Numeradores: $9m - 2m = 7m$.'
  - 'Resultado: $\frac{7m}{4}$.'
- titulo: Calcula $\frac{y^2}{y-1} - \frac{1}{y-1}$.
  solucion_pasos:
  - Numerador es y^2-1. Se factoriza a (y-1)(y+1). Se cancela (y-1).
- titulo: 'Respecto de «Sustracción de fracciones algebraicas de igual denominador»:
    ¿Es correcta esta'
  enunciado: 'Respecto de «Sustracción de fracciones algebraicas de igual denominador»:
    ¿Es correcta esta caracterización? «Para restar fracciones con igual denominador,
    mantén el denominador y resta los numeradores»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para restar fracciones con igual
    denominador, mantén el denominador y resta los numeradores.'
- titulo: 'Respecto de «Sustracción de fracciones algebraicas de igual denominador»:
    ¿Es válida esta af'
  enunciado: 'Respecto de «Sustracción de fracciones algebraicas de igual denominador»:
    ¿Es válida esta afirmación? «Confundir las reglas y tratar de voltear alguna fracción
    (eso es para división)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para restar fracciones con igual
    denominador, mantén el denominador y resta los numeradores.'
errores_frecuentes:
- Confundir las reglas y tratar de voltear alguna fracción (eso es para división).
- Para «Al restar dos fracciones algebraicas con el mismo denominador:», la respuesta
  correcta es Los denominadores se restan y dan 0.
- Se invierte la segunda fracción.
- Para «Al restar dos fracciones algebraicas con el mismo denominador:», la respuesta
  correcta es Se multiplican los numeradores cruzados.
- Para «Calcula $\frac{7a}{2} - \frac{5a}{2}$.», la respuesta correcta es $\frac{2a}{0}$.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando sustracción
