semantic_id: MAT.ALG.FRACCIONES_RESTA.IGUAL_DENOMINADOR
resumen_inicial: Para restar fracciones algebraicas de igual denominador, se restan los numeradores distribuyendo el signo
  negativo y se conserva el denominador común.
explicacion_simple: 'En la resta de fracciones algebraicas con igual denominador mantenemos la base común y restamos los numeradores.


  Es fundamental recordar que el signo de resta (menos) situado antes del segundo numerador afecta a todos los términos de
  esa segunda expresión.


  Por ello, escribimos el segundo numerador dentro de un paréntesis para cambiar correctamente los signos de cada uno de sus
  términos al eliminarlo.


  ![Sustracción de fracciones de igual denominador](/static/img/nodos/sustraccion-de-fracciones-algebraicas-de-igual-denominador-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dadas dos fracciones algebraicas $\frac{A(x)}{D(x)}$ y $\frac{B(x)}{D(x)}$ con $D(x) \neq 0$, la **sustracción de igual
  denominador** se define como:


  $$\frac{A(x)}{D(x)} - \frac{B(x)}{D(x)} = \frac{A(x) - B(x)}{D(x)} = \frac{A(x) - (b_1 x^k + \dots + b_0)}{D(x)}$$


  ### Desglose de la fórmula

  - $A(x) - B(x)$: Resta del polinomio sustraendo donde el signo negativo invierte a cada coeficiente de $B(x)$.

  - $D(x)$: Denominador común no nulo que se conserva sin alteración.


  ### Síntesis didáctica

  Restar fracciones homogéneas exige distribuir el signo negativo sobre todos los términos del segundo numerador.

  '
definiciones_clave: '- **Sustraendo algebraico**: Segundo numerador cuyo polinomio cambia de signo al efectuar la resta.

  - **Distribución de negación**: Regla por la cual el operador $-$ altera el signo de cada término dentro del paréntesis.

  '
propiedades_relaciones: '- **No conmutatividad**: $\frac{A(x)}{D(x)} - \frac{B(x)}{D(x)} \neq \frac{B(x)}{D(x)} - \frac{A(x)}{D(x)}$.

  - **Dominio inalterado**: $\operatorname{Dom} = \{x \in \mathbb{R} \mid D(x) \neq 0\}$.

  '
ejemplo_guiado:
  enunciado: Resta las fracciones algebraicas $\frac{5x + 3}{x + 1} - \frac{2x - 4}{x + 1}$, distribuye el signo menos en
    el numerador y evalúa el resultado para $x = 2$.
  pasos:
  - 'Paso 1: Escribir la resta de los numeradores sobre el denominador común $(x + 1)$ protegiendo el sustraendo: $\frac{(5x
    + 3) - (2x - 4)}{x + 1}$.'
  - 'Paso 2: Eliminar paréntesis invirtiendo los signos del segundo numerador: $5x + 3 - 2x + 4$.'
  - 'Paso 3: Reducir términos semejantes: $5x - 2x = 3x$ y $3 + 4 = 7$, obteniendo $\frac{3x + 7}{x + 1}$ para $x \neq -1$.'
  - 'Paso 4: Evaluar para $x = 2$: $\frac{3(2) + 7}{2 + 1} = \frac{6 + 7}{3} = \frac{13}{3}$.'
  imagen: /static/img/nodos/sustraccion-de-fracciones-algebraicas-de-igual-denominador-ejemplos.svg
checkpoints:
