procedimiento:
- 'Paso 1: Conservar el denominador común.'
- 'Paso 2: Escribir el primer numerador.'
- 'Paso 3: Escribir el signo menos y abrir paréntesis para el segundo numerador.'
- 'Paso 4: Distribuir el signo menos invirtiendo los signos de cada término del sustraendo.'
- 'Paso 5: Reducir los términos semejantes en el numerador.'
errores_correccion: '- **Error 1:** Cambiar el signo solo del primer término del segundo numerador: $-(2x - 4) = -2x - 4$.
  **Corrección:** El signo menos se aplica a todos los términos: $-(2x - 4) = -2x + 4$.

  - **Error 2:** Restar los denominadores comunes entre sí. **Corrección:** El denominador común permanece inalterado.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la resta de $\frac{4x}{x-2} - \frac{x+5}{x-2}$?
  alternativas:
  - $\frac{3x - 5}{x-2}$
  - $\frac{3x + 5}{x-2}$
  - $\frac{3x - 5}{0}$
  respuesta: $\frac{3x - 5}{x-2}$
  solucion_pasos:
  - '1. Numerador: $4x - (x+5) = 4x - x - 5$.'
  - '2. Reducir: $3x - 5$.'
  - '3. Resultado: $\frac{3x - 5}{x-2}$.'
- titulo: Ejemplo 2
  enunciado: Al calcular $\frac{x^2}{x+3} - \frac{9}{x+3}$, ¿cuál es la resta simplificada?
  alternativas:
  - $x - 3$
  - $x + 3$
  - $\frac{x^2-9}{x+3}$
  respuesta: $x - 3$
  solucion_pasos:
  - '1. Numerador: $x^2 - 9 = (x-3)(x+3)$.'
  - '2. Fracción: $\frac{(x-3)(x+3)}{x+3} = x-3$ para $x \neq -3$.'
- titulo: Propiedad conmutativa en resta
  enunciado: ¿Restar $\frac{A}{D} - \frac{B}{D}$ es equivalente a $\frac{B}{D} - \frac{A}{D}$?
  respuesta: 'No'
  solucion_pasos:
  - No, la resta de fracciones algebraicas no es conmutativa.
- titulo: Conservación del denominador
  enunciado: ¿El denominador común se conserva intacto al restar fracciones algebraicas homogéneas?
  respuesta: Sí
  solucion_pasos:
  - Sí, el denominador común nunca se resta ni se altera.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.
estado: publicado
afirmaciones_verdaderas:
- Para restar fracciones algebraicas de igual denominador se restan los numeradores distribuyendo el signo negativo y se conserva
  el denominador común.
- El signo menos de la resta exige cambiar el signo a todos y cada uno de los términos del segundo numerador.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/sustraccion-de-fracciones-algebraicas-de-igual-denominador-resumen.svg)


  QUÉ: Restar fracciones algebraicas de igual denominador.

  CÓMO: Conservar el denominador común $D(x)$ y restar los numeradores distribuyendo el signo menos a todos los términos del
  sustraendo ($\frac{A(x) - (B(x))}{D(x)} = \frac{A(x) - B(x)}{D(x)}$), declarando la restricción $D(x) \neq 0$.

  '
errores_frecuentes:
- Restar los denominadores comunes entre sí produciendo una división por cero o alterando el denominador común.
- Cambiar el signo únicamente al primer término del segundo numerador al suprimir los paréntesis.
- Asumir que la resta de fracciones algebraicas cumple con la propiedad conmutativa.
- Omitir la reducción de términos semejantes en el numerador unificado resultante.
- Eliminar el denominador común tras efectuar la resta de numeradores.
