semantic_id: MAT.ALG.FRACCIONES_RESTA.IGUAL_DENOMINADOR
resumen_inicial: 'Sustracción de fracciones algebraicas de igual denominador: concepto,
  reglas operativas y simplificación en Sustracción de fracciones algebraicas.'
explicacion_simple: 'La resta es igual de sencilla que la suma cuando los pisos son
  idénticos. Pero la resta tiene veneno: el signo negativo.'
explicacion_formal: '### Definición formal


  Es el mismo principio que la suma, el denominador es inmutable en este paso.


  ### Desarrollo didáctico


  La resta con igual denominador opera exactamente igual que la suma con igual denominador:
  mantienes el piso intacto y restas los techos.


  Ejemplo: $\frac{5x}{2a} - \frac{3x}{2a}$

  1. Se conserva el denominador: $2a$.

  2. Restas los numeradores: $5x - 3x = 2x$.

  3. Tienes el resultado base: $\frac{2x}{2a}$.

  4. (Paso de limpieza): Tacha el 2 con el 2. Respuesta final: $\frac{x}{a}$.


  Pero, mucho ojo: esta tranquilidad es peligrosa. Si el segundo numerador (el que
  está siendo restado) fuera un polinomio entero (ej: $3x + 1$), el signo menos va
  a intentar atacarlo completo. Veremos ese peligro en el siguiente tema.'
definiciones_clave: '- **Sustracción de fracciones algebraicas de igual denominador**:
