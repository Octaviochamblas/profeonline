  question: Al evaluar la expresión $\frac{3x + 7}{x + 1}$ para $x = 2$, ¿cuál es el valor obtenido?
  choices:
  - text: $\frac{13}{3}$
    is_correct: true
  - text: $\frac{11}{3}$
    is_correct: false
  - text: $4$
    is_correct: false
  - text: $\frac{13}{2}$
    is_correct: false
  explanation: La alternativa correcta es $\frac{13}{3}$.
