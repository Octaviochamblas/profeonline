semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNCENTRO_INTERSECCION
resumen_inicial: El circuncentro ($O$) es el punto notable donde se intersectan las
  tres simetrales (mediatrices) de los lados de un triángulo.
explicacion_simple: '![Circuncentro de un Triángulo](/static/img/nodos/definicion-de-circuncentro-como-punto-de-interseccion-de-las-simetrales-intro.svg)


  Si trazas las simetrales de los tres lados de un triángulo:


  - **Se cruzan en un solo punto**: Las tres líneas perpendiculares coinciden exactamente
  en un punto común llamado **circuncentro** ($O$).

  - **Bastan dos simetrales**: Con trazar dos de ellas ya encuentras el punto $O$,
  porque la tercera pasa obligatoriamente por ahí.

  - **Su posición cambia**: Puede quedar adentro del triángulo, justo sobre el borde
  (en la hipotenusa) o afuera, según el tipo de triángulo.

  '
explicacion_formal: '### Definición formal y teorema de concurrencia

  En todo triángulo $\Delta ABC$, las tres simetrales de los lados se intersectan
  en un único punto $O$, denominado **circuncentro**:


  $$\{O\} = S_a \cap S_b \cap S_c$$


  ### Desglose simbólico y geométrico

  - $O$: Circuncentro del triángulo.

  - Concurrencia euclidiana: Al pertenecer $O$ a $S_a \implies d(O, B) = d(O, C)$,
  y al pertenecer a $S_b \implies d(O, A) = d(O, C)$, por transitividad $d(O, A) =
  d(O, B)$, perteneciendo automáticamente a $S_c$.


  ### Síntesis didáctica

  El circuncentro es el centro de equilibrio métrico respecto a los vértices y el
  origen de la circunferencia envolvente exterior.'
definiciones_clave: '- **Circuncentro ($O$)**: Punto de concurrencia de las tres simetrales
  de un triángulo.

  - **Puntos notables del triángulo**: Puntos singulares de concurrencia de elementos
  secundarios ($O, I, H, G$).

  - **Concurrencia de mediatrices**: Teorema euclidiano que demuestra que las tres
  simetrales siempre se cortan en un punto.

  '
propiedades_relaciones: '- **Intersección**: $S_a \cap S_b \cap S_c = \{O\}$.

  - **Transitivad de distancias**: $OA = OB = OC = R$.

  - **Posición según ángulos**: Interior si es acutángulo, sobre la hipotenusa si
  es rectángulo, exterior si es obtusángulo.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Circuncentro](/static/img/nodos/definicion-de-circuncentro-como-punto-de-interseccion-de-las-simetrales-ejemplos.svg)


    En un triángulo $ABC$, se traza la simetral del lado $AB$ y la simetral del lado
    $BC$, cortándose en el punto $O$. Si la distancia de $O$ al vértice $A$ es $6\text{
    cm}$, ¿a qué distancia se encuentra $O$ del vértice $C$?

    '
  pasos:
  - 'Paso 1: Identificar el punto de corte: la intersección de dos simetrales es el
    circuncentro $O$.'
  - 'Paso 2: Aplicar la propiedad de concurrencia y equidistancia: el circuncentro
    equidista de todos los vértices ($OA = OB = OC$).'
  - 'Paso 3: Igualar las distancias: $OC = OA = 6\text{ cm}$.'
  - 'Paso 4: Concluir que la distancia de $O$ al vértice $C$ es exactamente $6\text{
    cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué líneas notables se intersectan en el circuncentro?
  choices:
  - text: Las tres simetrales (mediatrices) de los lados
    is_correct: true
  - text: Las tres alturas del triángulo
    is_correct: false
  - text: Las tres bisectrices interiores
    is_correct: false
  - text: Las tres transversales de gravedad
    is_correct: false
  explanation: En el circuncentro se intersectan las tres simetrales (mediatrices)
    de los lados del triángulo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si dos simetrales de un triángulo se cortan en un punto O, ¿qué ocurre
    con la tercera simetral?
  choices:
  - text: Pasa obligatoriamente por el punto O
    is_correct: true
  - text: Es paralela a las otras dos
    is_correct: false
  - text: Corta en un punto diferente
    is_correct: false
  - text: No se puede determinar
    is_correct: false
  explanation: Pasa obligatoriamente por el punto O, ya que las tres simetrales son
    concurrentes en el circuncentro.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Encontrar los puntos medios de al menos dos lados del triángulo.'
- 'Paso 2: Trazar las rectas perpendiculares ($90^\circ$) por dichos puntos medios.'
- 'Paso 3: Marcar el punto de intersección de ambas rectas como el circuncentro $O$.'
- 'Paso 4: Trazar la tercera simetral para verificar la concurrencia exacta.'
errores_correccion: No confundas el circuncentro (simetrales) con el incentro (bisectrices)
  ni con el ortocentro (alturas).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuántas simetrales es necesario trazar como mínimo para encontrar el
    circuncentro de un triángulo?
  alternativas:
  - $2\text{ simetrales}$
  - $3\text{ simetrales}$
  - $1\text{ simetral}$
  respuesta: $2\text{ simetrales}$
  solucion_pasos:
  - La intersección de 2 simetrales determina unívocamente el punto $O$, por el cual
    pasará también la tercera.
- titulo: Ejemplo 2
  enunciado: Si el circuncentro $O$ coincide con el ortocentro $H$ y el incentro $I$,
    ¿qué tipo de triángulo es?
  alternativas:
  - Triángulo equilátero
  - Triángulo rectángulo
  - Triángulo escaleno
  respuesta: Triángulo equilátero
  solucion_pasos:
  - En el triángulo equilátero los cuatro puntos notables ($O, I, H, G$) coinciden
    exactamente en el centro.
- titulo: ¿El circuncentro es el punto donde se intersectan las alturas de un triángulo?
  respuesta: 'No'
  solucion_pasos:
  - No, el punto donde se intersectan las alturas es el ortocentro ($H$). En el circuncentro
    se intersectan las simetrales.
- titulo: ¿Las tres simetrales de un triángulo se intersectan siempre en un único
    punto común?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental de la geometría euclidiana.
errores_frecuentes:
- Confundir circuncentro con baricentro o incentro.
- Trazar simetrales uniendo los vértices con los puntos medios (eso son medianas).
- Creer que el circuncentro no existe si el triángulo es obtusángulo.
- Olvidar que el circuncentro equidista de los vértices y no de los lados.
- Asumir que las simetrales siempre se cortan dentro del triángulo.
afirmaciones_verdaderas:
- El circuncentro es el punto de concurrencia de las tres simetrales de un triángulo.
- Basta con trazar dos simetrales para localizar con exactitud el circuncentro.
al_terminar_debes_poder: '**QUÉ:** Definir, ubicar y justificar el circuncentro como
  punto de intersección de las simetrales.


  **CÓMO:** Trazando las perpendiculares en los puntos medios de los lados y determinando
  su punto de concurrencia $O = S_a \cap S_b \cap S_c$.


  ![Resumen de Circuncentro](/static/img/nodos/definicion-de-circuncentro-como-punto-de-interseccion-de-las-simetrales-resumen.svg)

  '
