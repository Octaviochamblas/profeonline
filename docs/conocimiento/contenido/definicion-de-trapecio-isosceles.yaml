semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.TRAPECIO_ISOSCELES
resumen_inicial: El trapecio isósceles es aquel cuyos lados no paralelos son congruentes, teniendo ángulos basales iguales y diagonales congruentes.
explicacion_simple: 'Un **trapecio isósceles** es perfectamente simétrico, como una falda clásica de corte recto. Sus dos lados inclinados (los laterales) **miden exactamente lo mismo** ($c_1 = c_2 = c$).


  Gracias a esta hermosa simetría, se cumplen tres propiedades automáticas: 1) Las dos esquinas de abajo tienen el mismo ángulo ($\alpha = \alpha$), 2) Las dos esquinas de arriba tienen el mismo ángulo ($\beta = \beta$), y 3) Si trazas sus dos diagonales cruzadas, **ambas diagonales miden exactamente lo mismo** ($d_1 = d_2$).


  ![Definición de trapecio isósceles](/static/img/nodos/definicion-de-trapecio-isosceles-intro.svg)

  '
explicacion_formal: '### Definición formal

  Un trapecio $\mathcal{ABCD}$ con bases $\overline{AB} \parallel \overline{CD}$ es **isósceles** si y solo si sus lados no paralelos son congruentes:

  $$\mathcal{ABCD} \text{ es trapecio isósceles} \iff \overline{AD} \cong \overline{BC} \iff c_1 = c_2 = c$$


  ### Teoremas de equivalencia y simetría

  En todo trapecio $\mathcal{ABCD}$, las siguientes proposiciones son lógicamente equivalentes:

  1. Los lados laterales son congruentes: $\overline{AD} \cong \overline{BC}$.

  2. Los ángulos basales inferiores son congruentes: $\angle A \cong \angle B$.

  3. Los ángulos basales superiores son congruentes: $\angle D \cong \angle C$.

  4. Las diagonales son congruentes: $\overline{AC} \cong \overline{BD} \ (d_1 = d_2)$.

  5. El trapecio es inscriptible en una circunferencia (cuadrilátero cíclico).


  ### Descomposición pitagórica canónica

  Al trazar las dos alturas desde los extremos de la base menor hacia la base mayor, la base mayor queda dividida en $B = b + 2x$, donde la proyección lateral es:

  $$x = \frac{B - b}{2}$$

  Aplicando el Teorema de Pitágoras en cualquiera de los triángulos rectángulos laterales congruentes:

  $$c^2 = h^2 + x^2 = h^2 + \left(\frac{B - b}{2}\right)^2 \implies h = \sqrt{c^2 - \left(\frac{B - b}{2}\right)^2}$$


  > **Complemento didáctico:** ¡Memoriza la fórmula de la pestaña $x = \frac{B - b}{2}$! Es el truco clave en la PAES para trapecios isósceles: restas la base menor de la mayor, divides entre 2 y ya tienes el cateto de abajo para aplicar Pitágoras con el lado inclinado $c$ y hallar la altura $h$.

  '
definiciones_clave: '- **Trapecio isósceles**: Trapecio cuyos lados laterales no paralelos son de igual medida.

  - **Ángulos basales**: Ángulos apoyados sobre una misma base, que resultan congruentes en el trapecio isósceles.

  - **Proyección lateral ($x$)**: Segmento basal exterior dado por $x = \frac{B - b}{2}$.

  '
propiedades_relaciones: '- **Eje de simetría**: Posee un eje de simetría axial perpendicular a las bases que pasa por sus puntos medios.

  - **Diagonales congruentes**: Es el único trapecio cuyas diagonales tienen la misma longitud métrica ($d_1 = d_2$).

  - **Inscriptibilidad**: Todo trapecio isósceles es cíclico (admite circunferencia circunscrita).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de trapecio isósceles](/static/img/nodos/definicion-de-trapecio-isosceles-ejemplos.svg)


    Un trapecio isósceles tiene base mayor $B = 16$ cm, base menor $b = 6$ cm y lados no paralelos de $c = 13$ cm. Calcula la longitud de la proyección lateral $x$, la altura $h$ y el área del trapecio.'
  pasos:
  - 'Paso 1: Calcular la proyección lateral $x$: $x = \frac{B - b}{2} = \frac{16 - 6}{2} = \frac{10}{2} = 5$ cm.'
  - 'Paso 2: Aplicar el Teorema de Pitágoras en el triángulo lateral: $h = \sqrt{c^2 - x^2} = \sqrt{13^2 - 5^2} = \sqrt{169 - 25} = \sqrt{144} = 12$ cm.'
  - 'Paso 3: Calcular la mediana: $M = \frac{B + b}{2} = \frac{16 + 6}{2} = 11$ cm.'
  - 'Paso 4: Calcular el área: $A = M \cdot h = 11 \cdot 12 = 132\text{ cm}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes propiedades es exclusiva del trapecio isósceles dentro de la familia de los trapecios?
  choices:
  - text: Sus dos diagonales son congruentes entre sí.
    is_correct: true
  - text: Sus ángulos colaterales suman 180°.
    is_correct: false
  - text: Tiene un par de lados paralelos llamados bases.
    is_correct: false
  - text: Su mediana mide la semisuma de las bases.
    is_correct: false
  explanation: La alternativa correcta es 'Sus dos diagonales son congruentes entre sí.' En trapecios escalenos o rectángulos las diagonales son desiguales; solo en el isósceles son congruentes.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un trapecio isósceles con base mayor 20 cm y base menor 8 cm, ¿cuánto mide la base del triángulo rectángulo lateral?
  choices:
  - text: 6 cm.
    is_correct: true
  - text: 12 cm.
    is_correct: false
  - text: 14 cm.
    is_correct: false
  - text: 28 cm.
    is_correct: false
  explanation: 'La alternativa correcta es ''6 cm.'' Aplicando la fórmula de proyección: $x = \frac{B - b}{2} = \frac{20 - 8}{2} = \frac{12}{2} = 6$ cm.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Reconocer la igualdad de lados laterales ($c_1 = c_2$) o la igualdad de ángulos basales.

  2. Calcular la proyección lateral $x = (B - b) / 2$.

  3. Hallar la altura mediante Pitágoras: $h = \sqrt{c^2 - x^2}$.

  4. Utilizar la igualdad de diagonales ($d_1 = d_2$) si el problema involucra segmentos cruzados.

  '
errores_correccion: '- **Error común 1:** Calcular $x = B - b$ sin dividir entre 2. **Corrección:** La diferencia $(B - b)$ se reparte en dos pestañas iguales a la izquierda y derecha, luego $x = (B - b)/2$.

  - **Error común 2:** Creer que las diagonales son perpendiculares. **Corrección:** Son congruentes, pero generalmente no son perpendiculares.

  '
ejemplos:
- tipo: A
  titulo: Ángulos basales en trapecio isósceles
  enunciado: En un trapecio isósceles, uno de sus ángulos en la base mayor mide $55^\circ$. ¿Cuánto mide cada uno de los ángulos de la base menor?
  alternativas:
  - text: $125^\circ$.
    is_correct: true
  - text: $55^\circ$.
    is_correct: false
  - text: $145^\circ$.
    is_correct: false
  - text: $35^\circ$.
    is_correct: false
  explicacion: 'Por suplementariedad colateral: $180^\circ - 55^\circ = 125^\circ$. Al ser isósceles, ambos ángulos superiores miden $125^\circ$.'
- tipo: B
  titulo: Diagonales en trapecio isósceles
  enunciado: ¿Son las dos diagonales de un trapecio isósceles siempre de la misma longitud?
  respuesta: Sí
  explicacion: Sí. Por congruencia de triángulos, las diagonales de todo trapecio isósceles son rigurosamente congruentes ($d_1 = d_2$).
errores_frecuentes:
- '''Olvidar dividir entre 2 al calcular la proyección lateral $x = (B - b) / 2$.'''
- '''Asumir que las diagonales de cualquier trapecio son iguales sin comprobar que sea isósceles.'''
- '''Confundir los ángulos basales iguales con los ángulos suplementarios colaterales.'''
afirmaciones_verdaderas:
- '''En un trapecio isósceles, los lados no paralelos son congruentes.'''
- '''Los ángulos basales adyacentes a una misma base en el trapecio isósceles son iguales.'''
- '''Las dos diagonales de un trapecio isósceles son estrictamente congruentes.'''
al_terminar_debes_poder: '**QUÉ:** Resolver problemas métricos y trigonométricos en trapecios isósceles aplicando sus propiedades de simetría.


  **CÓMO:** Utilizando $x = \frac{B - b}{2}$, $h = \sqrt{c^2 - x^2}$ y $d_1 = d_2$.


  ![Síntesis de trapecio isósceles](/static/img/nodos/definicion-de-trapecio-isosceles-resumen.svg)

  '
