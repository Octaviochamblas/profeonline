semantic_id: MAT.GEO.ALTURA_ORTOCENTRO.ALTURA_DEFINICION
resumen_inicial: La altura de un triángulo es el segmento perpendicular trazado desde
  un vértice hasta la recta que contiene al lado opuesto. Todo triángulo posee exactamente
  tres alturas ($h_a, h_b, h_c$), fundamentales para el cálculo del área ($A = \frac{b
  \cdot h}{2}$).
explicacion_simple: '![Definición de Altura](/static/img/nodos/definicion-de-altura-como-segmento-perpendicular-desde-un-vertice-al-lado-opuesto-o-a-su-prolongacion-intro.svg)


  La **altura** de un triángulo es una línea recta perpendicular que baja desde una
  esquina (vértice) hasta la base opuesta formando un **ángulo recto de $90^\circ$**:


  - **Es perpendicular**: Siempre forma una escuadra perfecta de $90^\circ$ con el
  lado opuesto.

  - **Hay 3 alturas**: Cada uno de los 3 vértices tiene su propia altura hacia su
  respectivo lado opuesto.

  - **Sirve para calcular el área**: La superficie de cualquier triángulo es $\text{Área}
  = \frac{\text{base} \times \text{altura}}{2}$.

  '
explicacion_formal: '### Definición formal

  Dado un triángulo $\Delta ABC$, la **altura** correspondiente al vértice $A$ ($h_a$)
  es el segmento rectilíneo $\overline{AH_a}$ trazado desde el vértice $A$ perpendicular
  a la recta soporte del lado opuesto $\overleftrightarrow{BC}$:


  $$h_a = \overline{AH_a} \quad \text{donde} \quad \overleftrightarrow{AH_a} \perp
  \overleftrightarrow{BC} \quad \land \quad H_a \in \overleftrightarrow{BC}$$


  $$\operatorname{Área}(\Delta ABC) = \frac{1}{2} a \cdot h_a = \frac{1}{2} b \cdot
  h_b = \frac{1}{2} c \cdot h_c$$


  ### Desglose simbólico y geométrico

  - $A$: Vértice origen del segmento de altura.

  - $H_a$: Pie de la altura, punto de intersección perpendicular sobre la recta $\overleftrightarrow{BC}$.

  - $\overleftrightarrow{BC}$: Recta soporte que contiene al lado basal $\overline{BC}$.

  - Tres alturas: Todo triángulo posee exactamente tres alturas $\{h_a, h_b, h_c\}$.


  ### Síntesis didáctica

  La altura es la distancia euclidiana ortogonal más corta entre un vértice y la recta
  que contiene al lado opuesto, siendo el elemento clave para el cálculo del área.'
definiciones_clave: '- **Altura ($h$)**: Segmento perpendicular trazado desde un vértice
  a la recta que contiene al lado opuesto.

  - **Pie de la altura ($H_a$)**: Punto de intersección entre la altura y la recta
  soporte del lado opuesto.

  - **Base ($b$)**: Lado del triángulo sobre el cual se proyecta perpendicularmente
  la altura.

  '
propiedades_relaciones: '- **Perpendicularidad estricta**: $h_a \perp \overline{BC}
  \iff \angle AH_aB = \angle AH_aC = 90^\circ$.

  - **Invarianza del área**: $a \cdot h_a = b \cdot h_b = c \cdot h_c = 2A$.

  - **Altura en triángulo equilátero**: $h = \frac{L\sqrt{3}}{2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Altura](/static/img/nodos/definicion-de-altura-como-segmento-perpendicular-desde-un-vertice-al-lado-opuesto-o-a-su-prolongacion-ejemplos.svg)


    En un triángulo $ABC$, la base $\overline{BC}$ mide $14\text{ cm}$ y la altura
    $h_a$ relativa a dicha base mide $9\text{ cm}$. Calcula el área del triángulo
    y determina la longitud de la altura $h_b$ si el lado $\overline{AC}$ mide $18\text{
    cm}$.

    '
  pasos:
  - 'Paso 1: Aplicar la fórmula del área con la base $a = 14\text{ cm}$ y la altura
    $h_a = 9\text{ cm}$: $A = \frac{a \cdot h_a}{2}$.'
  - 'Paso 2: Calcular el área: $A = \frac{14 \cdot 9}{2} = 63\text{ cm}^2$.'
  - 'Paso 3: Igualar el área utilizando la base $b = 18\text{ cm}$ y la altura incógnita
    $h_b$: $A = \frac{b \cdot h_b}{2} = 63\text{ cm}^2$.'
  - 'Paso 4: Despejar $h_b$: $18 \cdot h_b = 126 \implies h_b = \frac{126}{18} = 7\text{
    cm}$.'
  - 'Paso 5: Concluir que el área es $63\text{ cm}^2$ y la altura $h_b$ mide $7\text{
    cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición geométrica obligatoria define a la altura de un triángulo
    respecto a su base opuesta?
  choices:
  - text: Debe ser perpendicular formando un ángulo de $90^\circ$ con el lado opuesto
      o su prolongación
    is_correct: true
  - text: Debe dividir al lado opuesto exactamente en dos partes iguales
    is_correct: false
  - text: Debe dividir al ángulo del vértice en dos ángulos iguales
    is_correct: false
  - text: Debe medir siempre lo mismo que el lado adyacente
    is_correct: false
  explanation: La respuesta correcta es que debe ser perpendicular formando un ángulo
    de $90^\circ$ con el lado opuesto o su prolongación, lo cual define estrictamente
    a la altura.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un triángulo tiene un área de 40 cm² y su base mide 10 cm, ¿cuánto
    mide su altura correspondiente?
  choices:
  - text: $8\text{ cm}$
    is_correct: true
  - text: $4\text{ cm}$
    is_correct: false
  - text: $16\text{ cm}$
    is_correct: false
  - text: $20\text{ cm}$
    is_correct: false
  explanation: La altura mide $8\text{ cm}$, ya que despejando de $A = \frac{b \cdot
    h}{2}$ se tiene $40 = \frac{10 \cdot h}{2} = 5h \implies h = 8\text{ cm}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el vértice desde el cual se traza la altura y el lado opuesto
  que actúa como base.'
- 'Paso 2: Trazar o proyectar el segmento perpendicular ($90^\circ$) desde dicho vértice
  hasta el lado opuesto.'
- 'Paso 3: Marcar el pie de la altura en el punto de intersección perpendicular.'
- 'Paso 4: Utilizar la longitud de la altura en el cálculo de área ($A = \frac{b \cdot
  h}{2}$) o en relaciones métricas.'
errores_correccion: 'No confundas la altura con la transversal de gravedad: la altura
  garantiza un ángulo de $90^\circ$, mientras que la transversal llega al punto medio
  pero no necesariamente perpendicular.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo equilátero de lado $6\text{ cm}$, ¿cuánto mide su altura
    exacta?
  alternativas:
  - $3\sqrt{3}\text{ cm}$
  - $6\sqrt{3}\text{ cm}$
  - $3\text{ cm}$
  respuesta: $3\sqrt{3}\text{ cm}$
  solucion_pasos:
  - En el triángulo equilátero $h = \frac{L\sqrt{3}}{2} = \frac{6\sqrt{3}}{2} = 3\sqrt{3}\text{
    cm}$.
- titulo: Ejemplo 2
  enunciado: Si las bases de un triángulo miden $a = 8\text{ cm}$ y $b = 12\text{
    cm}$, y la altura $h_a = 6\text{ cm}$, ¿cuánto mide $h_b$?
  alternativas:
  - $4\text{ cm}$
  - $9\text{ cm}$
  - $8\text{ cm}$
  respuesta: $4\text{ cm}$
  solucion_pasos:
  - 'Por conservación del área: $a \cdot h_a = b \cdot h_b \implies 8 \cdot 6 = 12
    \cdot h_b \implies 48 = 12h_b \implies h_b = 4\text{ cm}$.'
- titulo: ¿Un triángulo tiene siempre exactamente tres alturas?
  respuesta: Sí
  solucion_pasos:
  - Sí, una por cada uno de sus tres vértices.
- titulo: ¿La altura de un triángulo divide siempre la base en dos segmentos iguales?
  respuesta: 'No'
  solucion_pasos:
  - No, solo lo hace en triángulos isósceles (respecto a la base) y equiláteros. En
    triángulos escalenos divide la base en segmentos desiguales.
errores_frecuentes:
- Confundir altura con transversal de gravedad (creer que siempre biseca la base).
- Asumir que la altura siempre debe dibujarse vertical (depende de qué lado se elija
  como base).
- Olvidar multiplicar el área por 2 al despejar la altura ($h = \frac{2A}{b}$).
- Creer que en triángulos obtusángulos la altura no existe porque cae fuera.
- Confundir la altura con la bisectriz interior del vértice.
afirmaciones_verdaderas:
- La altura de un triángulo es perpendicular a la recta que contiene al lado opuesto.
- El producto de cualquier base por su respectiva altura es constante e igual al doble
  del área ($b \cdot h = 2A$).
al_terminar_debes_poder: '**QUÉ:** Identificar, trazar y calcular alturas en cualquier
  tipo de triángulo.


  **CÓMO:** Aplicando la condición de perpendicularidad ($90^\circ$) y la relación
  métrica de área $A = \frac{b \cdot h}{2}$.


