semantic_id: MAT.GEO.RELACIONES_TR.CATETO_MEDIA_GEOMETRICA
resumen_inicial: 'Propiedad: cada cateto es media geométrica entre la hipotenusa y
  su proyección sobre ella: conceptos, teoremas, propiedades geométricas y cálculo
  en Perímetros, Áreas y Teoremas.'
explicacion_simple: 'Gracias a la semejanza entre los triángulos formados por la altura
  sobre la hipotenusa, existe una relación exacta entre cada cateto, la hipotenusa
  y su proyección: el cateto es la media geométrica de esos dos valores.'
explicacion_formal: '![Cateto como media geométrica](/static/img/geometria/areas-pitagoras/relaciones-tr-cateto-media-geometrica.svg)


  ### Definición formal


  Si $c$ es la hipotenusa y $m$ es la proyección del cateto $b$ sobre ella, entonces
  $b^2=c\cdot m$ (equivalentemente, $b=\sqrt{c\cdot m}$).


  ### Desarrollo didáctico


  Si la hipotenusa mide 25 y la proyección de un cateto es 9, ese cateto mide $b=\sqrt{25\cdot9}=\sqrt{225}=15$.'
definiciones_clave: '- **Propiedad: cada cateto es media geométrica entre la hipotenusa
  y su proyección sobre ella**: Elemento o propiedad fundamental en el estudio de
  perímetros, áreas y teoremas.'
