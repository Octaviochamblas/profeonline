semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.AGUDO
resumen_inicial: Los ángulos agudos son aberturas cerradas comprendidas entre 0° y
  90°, fundamentales en la formación de triángulos acutángulos y estructuras rígidas.
explicacion_simple: Piensa en la punta de una tijera parcialmente abierta o en la
  forma del pico de un pájaro. Su abertura es cerrada y afilada, midiendo menos que
  una esquina recta de 90°.
explicacion_formal: 'Un ángulo $\alpha$ se clasifica como **agudo** si su medida en
  grados sexagesimales cumple la doble desigualdad estricta:


  $$0^\circ < \alpha < 90^\circ$$


  Todos los ángulos interiores de un triángulo equilátero ($60^\circ$) y los dos ángulos
  no rectos de un triángulo rectángulo son siempre agudos.'
definiciones_clave: '- **Ángulo agudo**: Ángulo de abertura estrictamente entre $0^\circ$
  y $90^\circ$.

  - **Triángulo acutángulo**: Triángulo que tiene sus tres ángulos interiores agudos.'
propiedades_relaciones: '- **Complementariedad**: Dos ángulos agudos pueden ser complementarios
  si su suma es $90^\circ$.

  - **En triángulos rectángulos**: Los dos ángulos no rectos de un triángulo rectángulo
  son siempre agudos.'
ejemplo_guiado:
  enunciado: La rampa de acceso a un edificio forma un ángulo de elevación $\alpha
    = 4x - 10^\circ$ con el suelo horizontal. Si el ángulo mide $18^\circ$, calcula
    $x$ y verifica que es un ángulo agudo.
  pasos:
  - 'Paso 1: Igualar la expresión al ángulo medido: $4x - 10 = 18$.'
  - 'Paso 2: Despejar $x$: $4x = 28 \implies x = 7^\circ$.'
  - 'Paso 3: Comprobar que $18^\circ$ es agudo porque cumple $0^\circ < 18^\circ <
    90^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el rango exacto de medida en grados para que un ángulo sea clasificado
    como agudo?
  choices:
  - text: Mayor que 0° y menor que 90°
    is_correct: true
  - text: Exactamente igual a 90°
    is_correct: false
  - text: Mayor que 90° y menor que 180°
    is_correct: false
  - text: Exactamente igual a 180°
    is_correct: false
  explanation: La alternativa correcta es 'Mayor que 0° y menor que 90°', correspondiente
    a la definición de ángulo agudo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una rampa tiene una inclinación de 18° con el suelo, ¿por qué se clasifica
    como ángulo agudo?
  choices:
  - text: Porque su medida es mayor que 0° y menor que 90°
    is_correct: true
  - text: Porque es exactamente igual a 90°
    is_correct: false
  - text: Porque es mayor que 90° y menor que 180°
    is_correct: false
  - text: Porque sus lados forman una línea recta
    is_correct: false
  explanation: La alternativa correcta es 'Porque su medida es mayor que 0° y menor
    que 90°'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener la medida del ángulo en grados.'
- 'Paso 2: Comprobar que sea estrictamente mayor que $0^\circ$ y menor que $90^\circ$.'
- 'Paso 3: Clasificar el ángulo como agudo.'
errores_correccion: Recuerda que un ángulo de exactamente 90° no es agudo (es recto)
  y un ángulo de 0° tampoco es agudo (es nulo).
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes ángulos es agudo?
  alternativas:
  - 45°
  - 90°
  - 120°
  respuesta: 45°
  solucion_pasos:
  - 45° es agudo porque es mayor que 0° y menor que 90°.
- titulo: Ejemplo 2
  enunciado: Si $\alpha = 72^\circ$, ¿cómo se clasifica según su medida?
  alternativas:
  - Ángulo agudo
  - Ángulo obtuso
  - Ángulo recto
  respuesta: Ángulo agudo
  solucion_pasos:
  - 72° está comprendido entre 0° y 90°, luego es un ángulo agudo.
- titulo: ¿Un ángulo de 89° es un ángulo agudo?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque 89° es menor que 90°.
- titulo: ¿Un ángulo de 90° es considerado agudo?
  respuesta: 'No'
  solucion_pasos:
  - No, 90° es un ángulo recto.
errores_frecuentes:
- Incluir el ángulo de 90° dentro de los ángulos agudos.
- Declarar un ángulo agudo (menor a 90°) con un ángulo obtuso (mayor a 90°).
- Declarar que todos los ángulos agudos miden 45°.
- Afirmar que un ángulo agudo puede tener medida negativa.
- Declarar que en un triángulo todos los ángulos son siempre agudos.
afirmaciones_verdaderas:
- Todo ángulo agudo tiene una medida menor a 90° y mayor a 0°.
- Los dos ángulos agudos de un triángulo rectángulo suman 90°.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, calcular y
  clasificar cualquier ángulo agudo dentro del rango de 0° a 90°.
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
estado: publicado
