semantic_id: MAT.GEO.ANGULOS_CLASIFICACION.AGUDO
resumen_inicial: Un ángulo agudo es aquel cuya medida es estrictamente mayor que 0°
  y menor que 90°, caracterizado por una abertura cerrada menor a la de un ángulo
  recto.
explicacion_simple: '![Ángulo Agudo](/static/img/nodos/angulo-agudo-con-medida-mayor-que-0-y-menor-que-90-intro.svg)


  Piensa en una porción delgada de pizza o la punta afilada de una tijera entreabierta.
  Cuando la abertura entre los dos lados es más pequeña que la esquina de un cuadrado
  perfecto (90°), decimos que el ángulo es agudo.'
explicacion_formal: '### Definición formal

  Un ángulo $\angle AOB$ es **agudo** si su medida angular $\alpha$ está estrictamente
  comprendida entre el ángulo nulo ($0^\circ$) y el ángulo recto ($90^\circ$):


  $$0^\circ < \mu(\angle AOB) < 90^\circ \iff 0 < \alpha < \frac{\pi}{2} \text{ rad}$$


  ### Desglose simbólico y geométrico

  - $\alpha \in (0^\circ, 90^\circ)$: Intervalo abierto de medidas angulares agudas.

  - Seno y Coseno: $\sin \alpha > 0$ y $\cos \alpha > 0$ (primer cuadrante estricto).

  - Existencia de complemento: Todo ángulo agudo posee un complemento positivo $\beta
  = 90^\circ - \alpha > 0$.


  ### Síntesis didáctica

  Los ángulos agudos son los bloques fundamentales de los triángulos acutángulos y
  los ángulos agudos interiores de los triángulos rectángulos.'
definiciones_clave: '- **Ángulo agudo**: Ángulo con medida en el intervalo abierto
  $(0^\circ, 90^\circ)$.

  - **Ángulos complementarios**: Pareja de ángulos agudos cuya suma es exactamente
  $90^\circ$. '
propiedades_relaciones: '- **Convexidad**: Todo ángulo agudo es también un ángulo
  convexo.

  - **Complementariedad**: El complemento de un ángulo agudo $\alpha$ es siempre otro
  ángulo agudo ($90^\circ - \alpha$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulo Agudo](/static/img/nodos/angulo-agudo-con-medida-mayor-que-0-y-menor-que-90-ejemplos.svg)


    En un triángulo rectángulo, uno de los ángulos agudos mide $\alpha = 38^\circ$.
    Clasifica este ángulo y determina la medida de su ángulo agudo complementario
    $\beta$.'
  pasos:
  - 'Paso 1: Verificar que $0^\circ < 38^\circ < 90^\circ$, por lo que $\alpha$ se
    clasifica como ángulo agudo.'
  - 'Paso 2: Plantear la suma de ángulos complementarios: $\alpha + \beta = 90^\circ$.'
  - 'Paso 3: Despejar $\beta = 90^\circ - 38^\circ = 52^\circ$.'
  - 'Paso 4: Concluir que $\beta = 52^\circ$, el cual también es un ángulo agudo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes medidas corresponde estrictamente a un ángulo
    agudo?
  choices:
  - text: Un ángulo de 65°
    is_correct: true
  - text: Un ángulo de 90°
    is_correct: false
  - text: Un ángulo de 120°
    is_correct: false
  - text: Un ángulo de 0°
    is_correct: false
  explanation: Por cumplir 0° < 65° < 90°, un ángulo de 65° es un ángulo agudo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si un ángulo mide 89.5°, ¿cómo se clasifica según su medida?
  choices:
  - text: Ángulo agudo (por ser menor que 90°)
    is_correct: true
  - text: Ángulo recto
    is_correct: false
  - text: Ángulo obtuso
    is_correct: false
  - text: Ángulo extendido
    is_correct: false
  explanation: Al ser estrictamente menor que 90° (89.5° < 90°), es un ángulo agudo
    (por ser menor que 90°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Medir o calcular el valor numérico del ángulo en grados.'
- 'Paso 2: Comparar el valor con los límites $0^\circ$ y $90^\circ$.'
- 'Paso 3: Clasificar como agudo si cumple $0^\circ < \theta < 90^\circ$.'
errores_correccion: Recuerda que 90° exactos no es agudo sino recto, y 0° exactos
  es nulo.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes ángulos es agudo?
  alternativas:
  - $45^\circ$
  - $90^\circ$
  - $135^\circ$
  respuesta: $45^\circ$
  solucion_pasos:
  - $45^\circ$ está entre $0^\circ$ y $90^\circ$, por lo tanto es agudo.
- titulo: Ejemplo 2
  enunciado: Si $\alpha = 2x$ es un ángulo agudo, ¿cuál es el rango de valores posibles
    para $x$?
  alternativas:
  - $0^\circ < x < 45^\circ$
  - $0^\circ < x < 90^\circ$
  - $45^\circ < x < 90^\circ$
  respuesta: $0^\circ < x < 45^\circ$
  solucion_pasos:
  - $0^\circ < 2x < 90^\circ \implies 0^\circ < x < 45^\circ$.
- titulo: ¿Un triángulo puede tener tres ángulos agudos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los triángulos acutángulos (como el equilátero de 60°, 60°, 60°) tienen 3
    ángulos agudos.
- titulo: ¿Un ángulo de 90° es agudo?
  respuesta: 'No'
  solucion_pasos:
  - No, 90° exactos corresponde a un ángulo recto.
errores_frecuentes:
- Incluir el valor de $90^\circ$ dentro de la categoría de ángulos agudos.
- Incluir el valor de $0^\circ$ como si fuera agudo.
- Confundir ángulos agudos con ángulos obtusos ($>90^\circ$).
- Afirmar que al alargar los lados el ángulo agudo se transforma en recto.
- Olvidar que los tres ángulos interiores de un triángulo equilátero son agudos.
afirmaciones_verdaderas:
- Un ángulo agudo mide más de $0^\circ$ y menos de $90^\circ$.
- El complemento de cualquier ángulo agudo es siempre otro ángulo agudo.
al_terminar_debes_poder: '**QUÉ:** Identificar, clasificar y operar con ángulos agudos
  en problemas geométricos.


  **CÓMO:** Verificando la condición $0^\circ < \theta < 90^\circ$ y aplicando relaciones
  de complementariedad.


  ![Resumen de Ángulo Agudo](/static/img/nodos/angulo-agudo-con-medida-mayor-que-0-y-menor-que-90-resumen.svg)'
