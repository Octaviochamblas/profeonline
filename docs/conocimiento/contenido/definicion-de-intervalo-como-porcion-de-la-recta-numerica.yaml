semantic_id: MAT.ALG.INTERVALOS.DEFINICION_INTERVALO
resumen_inicial: Un intervalo real es el conjunto de todos los números reales comprendidos
  entre dos extremos dados, pudiendo incluir o no a dichos extremos.
explicacion_simple: 'Un **intervalo** es un trozo o segmento de la recta numérica
  que encierra a infinitos números reales continuos.

  Los valores numéricos donde empieza y termina el trozo se llaman **extremos** (inferior
  $a$ y superior $b$).

  Dependiendo de si se incluyen o se excluyen los bordes, el intervalo puede ser abierto,
  cerrado o semiabierto.'
explicacion_formal: 'Un **intervalo real acotado** $I \subset \mathbb{R}$ definido
  entre los extremos $a, b \in \mathbb{R}$ ($a < b$) se expresa mediante notación
  de conjuntos como:


  $$I = \{x \in \mathbb{R} \mid a < x < b\} \quad \text{o} \quad \{x \in \mathbb{R}
  \mid a \le x \le b\}$$


  **Desglose de la fórmula:**

  - $a$: Extremo inferior o límite izquierdo del intervalo.

  - $b$: Extremo superior o límite derecho del intervalo.

  - $x \in \mathbb{R}$: Infinitos números reales pertenecientes a la porción continua.'
definiciones_clave: '- **Intervalo real**: Subconjunto continuo de los números reales
  limitado por dos extremos $a$ y $b$.

  - **Extremos del intervalo**: Números $a$ y $b$ que delimitan la porción izquierda
  y derecha del segmento.'
propiedades_relaciones: '- **Densidad real**: Entre cualesquiera extremos $a < b$,
  el intervalo contiene una cantidad innumerablemente infinita de números reales.'
ejemplo_guiado:
  enunciado: Define el conjunto de todos los números reales comprendidos estrictamente
    entre $2$ y $7$, exprésalo mediante compresión y verifica la pertenencia de $x
    = 5$ y $x = 2$.
  pasos:
  - 'Paso 1: Escribir por comprensión el subconjunto real: $I = \{x \in \mathbb{R}
    \mid 2 < x < 7\}$.Paso 2: Comprobar $x = 5$: como $2 < 5 < 7$ es verdadero, $5
    \in I$.Paso 3: Comprobar $x = 2$: como $2 < 2$ es falso, $2 \notin I$.Paso 4:
    Concluir que el intervalo representa la porción continua abierta entre $2$ y $7$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa un intervalo en el conjunto de los números reales $\mathbb{R}$?
  choices:
  - text: El conjunto continuo de todos los números reales comprendidos entre dos
      extremos.
    is_correct: true
  - text: Un conjunto formado únicamente por dos números enteros.
    is_correct: false
  - text: La suma algebraica de dos números primos.
    is_correct: false
  - text: Una ecuación cuadrática sin solución.
    is_correct: false
  explanation: La alternativa correcta es 'El conjunto continuo de todos los números
    reales comprendidos entre dos extremos.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para el intervalo estricto $I = \{x \in \mathbb{R} \mid 2 < x < 7\}$,
    ¿cuál de los siguientes números SI pertenece a $I$?
  choices:
  - text: $x = 5$
    is_correct: true
  - text: $x = 2$
    is_correct: false
  - text: $x = 7$
    is_correct: false
  - text: $x = 9$
    is_correct: false
  explanation: La alternativa correcta es '$x = 5$'. (2 y 7 están excluidos por ser
    la desigualdad estricta).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el extremo inferior $a$ y el extremo superior $b$.'
- 'Paso 2: Identificar si los extremos se incluyen (desigualdad no estricta) o se
  excluyen (desigualdad estricta).'
- 'Paso 3: Redactar la expresión de conjuntos $\{x \in \mathbb{R} \mid a < x < b\}$.'
errores_correccion: '- **Error común:** Creer que un intervalo como $2 < x < 7$ solo
  contiene los enteros $3, 4, 5, 6$.

  - **Cómo corregirlo:** Un intervalo contiene INFINITOS números reales (incluyendo
  decimales como $2{,}001$, $3{,}1415$, etc.).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
  - 'El intervalo abierto $]2, 7[$ está formado únicamente por los cuatro números enteros $\{3, 4, 5, 6\}$.'
  - 'En el intervalo real $I = \{x \in \mathbb{R} \mid 2 < x < 7\}$, el extremo inferior $x = 2$ pertenece al conjunto.'
  - 'La representación de un intervalo en $\mathbb{R}$ consiste en un conjunto finito de puntos aislados sobre la recta.'
  - 'Escribir las fronteras de un intervalo en la notación $]b, a[$ con $a < b$ es una expresión matemáticamente válida.'
  - 'El número decimal $2{,}0001$ no pertenece al intervalo real $]2, 7[$.'
afirmaciones_verdaderas:
  - 'Un intervalo real representa un subconjunto continuo e infinito de números reales delimitado por dos extremos $a$ y $b$.'
  - 'Un intervalo abierto $]a, b[$ excluye a sus extremos del conjunto solución.'
al_terminar_debes_poder: |
  QUÉ: Definir y caracterizar un intervalo como porción continua de la recta real.
  CÓMO: Identificar los extremos $a$ y $b$, determinar la inclusión o exclusión de los bordes y verificar la pertenencia de elementos en $\mathbb{R}$.
fuente: 'Texto escolar MINEDUC — Álgebra / Intervalos Reales'
