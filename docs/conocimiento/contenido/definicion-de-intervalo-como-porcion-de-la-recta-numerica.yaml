semantic_id: MAT.ALG.INTERVALOS.DEFINICION_INTERVALO
resumen_inicial: 'Definición de intervalo como porción de la recta numérica: relaciones
  de orden, intervalos y resolución en Intervalos reales y su representación.'
explicacion_simple: Un intervalo es un conjunto continuo de números reales.
explicacion_formal: '### Definición formal

  Un intervalo es un subconjunto $I \subseteq \mathbb{R}$ tal que para cualquier $a,
  b \in I$ y $c \in \mathbb{R}$ con $a < c < b$, se cumple que $c \in I$.


  ### Desarrollo didáctico

  Podemos visualizar un intervalo como un segmento o rayo en la recta numérica real.'
definiciones_clave: '- **Definición de intervalo como porción de la recta numérica**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a definición de intervalo como porción
  de la recta numérica.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de definición de
    intervalo como porción de la recta numérica.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de definición de intervalo como porción de
    la recta numérica, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla de oro al multiplicar o dividir una desigualdad por
    un número negativo en definición de intervalo como porción de la recta numérica?
  choices:
  - text: Invertir el sentido de la desigualdad al multiplicar o dividir por un número
      negativo en intervalos reales y su representación
    is_correct: true
  - text: Mantener el mismo sentido de la desigualdad sin cambios
    is_correct: false
  - text: Cambiar la variable por cero
    is_correct: false
  - text: Transformar la inecuación en una igualdad exacta
    is_correct: false
  explanation: 'La alternativa correcta es: Invertir el sentido de la desigualdad
    al multiplicar o dividir por un número negativo en intervalos reales y su representación.
    Es la propiedad fundamental de orden en definición de intervalo como porción de
    la recta numérica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver una inecuación y obtener su conjunto solución en definición
    de intervalo como porción de la recta numérica, ¿cómo se debe expresar el resultado?
  choices:
  - text: Representar el conjunto solución mediante notación de intervalo o gráficamente
      en la recta real
    is_correct: true
  - text: Como un único número aislado obligatoriamente
    is_correct: false
  - text: Igualando la variable a la constante
    is_correct: false
  - text: Eliminando los símbolos de desigualdad del resultado
    is_correct: false
  explanation: 'La alternativa correcta es: Representar el conjunto solución mediante
    notación de intervalo o gráficamente en la recta real. Forma estándar de representar
    conjuntos soluciones de inecuaciones.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Identificar los valores extremos $a$ y $b$.
- Determinar mediante la notación de corchetes si los extremos se incluyen en el conjunto.
- Trazar el segmento sobre una recta numérica desde $a$ hasta $b$.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en definición de intervalo
  como porción de la recta numérica.
ejemplos:
- titulo: Análisis en un escenario práctico
  enunciado: Considera el contexto de MAT.ALG.INTERVALOS.DEFINICION_INTERVALO. Determina
    las implicancias.
  solucion_pasos:
  - Establecer los límites.
  - Analizar el tipo de extremo.
  - Concluir.
- titulo: Evaluación de condición general
  enunciado: Dada la estructura del conjunto para MAT.ALG.INTERVALOS.DEFINICION_INTERVALO,
    plantea la desigualdad.
  solucion_pasos:
  - Identificar la variable.
  - Aplicar la definición.
  - Escribir el intervalo.
- titulo: ¿Es cierto que todos los elementos de un conjunto finito pueden formar un
    intervalo denso?
  respuesta: 'No'
  solucion_pasos:
  - Recordar la definición de intervalo en $\mathbb{R}$.
  - Concluir que un conjunto finito no contiene todos los números reales entre dos
    puntos.
- titulo: ¿El uso de MAT.ALG.INTERVALOS.DEFINICION_INTERVALO es adecuado para expresar
    desigualdades lineales simples?
  respuesta: Sí
  solucion_pasos:
  - Analizar el resultado de una desigualdad simple.
  - Verificar que su conjunto solución puede representarse como intervalo.
errores_frecuentes:
- Un intervalo solo contiene números enteros.
- Todo intervalo debe estar acotado por ambos lados.
- Un intervalo puede tener 'agujeros' en su interior.
- El símbolo de infinito puede incluirse como un número real dentro de un intervalo
  cerrado.
- Los intervalos que van de $1$ a $3$ y de $2$ a $4$ no comparten elementos reales.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  definición de intervalo como porción de la recta numérica.
