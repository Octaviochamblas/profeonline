semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.SIMBOLO_MENOR
resumen_inicial: El símbolo de desigualdad menor que ($<$) indica estrictamente que
  la cantidad de la izquierda es inferior a la de la derecha.
explicacion_simple: 'El símbolo **menor que** ($<$) apunta con su vértice cerrado
  hacia el número más pequeño situado a la izquierda y abre sus dos puntas hacia el
  número más grande de la derecha.

  Escribir $a < b$ se lee ''$a$ es menor que $b$'' y significa que en la recta numérica
  $a$ está a la izquierda de $b$.'
explicacion_formal: 'Para toda pareja de números reales $a, b \in \mathbb{R}$, la
  proposición **estrictamente menor que** se define como:


  $$a < b \iff a - b < 0$$


  **Desglose de la fórmula:**

  - $a < b$: La diferencia del primer término menos el segundo resulta ser un número
  estrictamente negativo.'
definiciones_clave: '- **Símbolo menor que ($<$)**: Operador de orden estricto que
  indica que el término izquierdo es estrictamente menor que el derecho.'
propiedades_relaciones: '- **Transitividad del menor que**: Si $a < b$ y $b < c \implies
  a < c$.'
ejemplo_guiado:
  enunciado: Verifica si la desigualdad $-7 < -2$ es verdadera evaluando la diferencia
    $(-7) - (-2)$ y grafica su posición en la recta.
  pasos:
  - 'Paso 1: Calcular la diferencia: $-7 - (-2) = -7 + 2 = -5$.Paso 2: Comprobar que
    $-5 < 0$ es un número estrictamente negativo.Paso 3: Ubicar en la recta numérica:
    $-7$ está $5$ unidades a la izquierda de $-2$.Paso 4: Concluir que la desigualdad
    $-7 < -2$ es VERDADERA.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición sobre la resta $a - b$ garantiza que $a < b$ sea verdadero?
  choices:
  - text: La diferencia $a - b < 0$ es estrictamente negativa.
    is_correct: true
  - text: La diferencia $a - b > 0$ es positiva.
    is_correct: false
  - text: El producto $a \cdot b = 0$.
    is_correct: false
  - text: La suma $a + b > 0$.
    is_correct: false
  explanation: La alternativa correcta es 'La diferencia $a - b < 0$ es estrictamente
    negativa.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comprobar la relación $-7 < -2$, ¿cuál es el resultado de la sustracción
    $-7 - (-2)$?
  choices:
  - text: $-5$
    is_correct: true
  - text: $5$
    is_correct: false
  - text: $-9$
    is_correct: false
  - text: $0$
    is_correct: false
  explanation: La alternativa correcta es '$-5$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el número de menor valor numérico a la izquierda del símbolo $<$.'
- 'Paso 2: Escribir el número de mayor valor numérico a la derecha del símbolo $<$.'
- 'Paso 3: Verificar que la diferencia $a - b$ sea negativa.'
errores_correccion: '- **Error común:** Confundir los símbolos $>$ y $<$ al trabajar
  con números negativos.

  - **Cómo corregirlo:** Recuerda que el vértice pequeño en punta del símbolo SIEMPRE
  apunta al número menor.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de orden.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de orden.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El conjunto de los números reales es un conjunto ordenado?
  respuesta: Sí
  solucion_pasos:
  - Sí, permite comparar cualquier par de números reales.
- titulo: ¿La frase 'a lo sumo' se traduce con el símbolo menor o igual que?
  respuesta: Sí
  solucion_pasos:
  - Sí, 'a lo sumo' establece una cota superior inclusiva ($\\le$).
errores_frecuentes:
- Creer que el número con mayor valor absoluto negativo es el número mayor.
- Confundir la orientación de los símbolos mayor que ($>$) y menor que ($<$).
- Pensar que las desigualdades no estrictas ($\ge, \le$) prohíben la igualdad exacta.
- Traducir frases de cota como 'al menos' excluyendo el número límite.
- Tratar una desigualdad numérica cerrada como si tuviera una variable por despejar.
afirmaciones_verdaderas:
- 'La ley de tricotomía garantiza que para dos números reales $a$ y $b$ se cumple
  una y solo una de las tres opciones: $a < b$, $a = b$ o $a > b$.'
- La expresión 'como máximo $k$' se traduce mediante la desigualdad no estricta $x
  \le k$.
al_terminar_debes_poder: Al finalizar este recurso podrás aplicar la relación de orden
  en $\mathbb{R}$, emplear los símbolos de desigualdad e interpretar restricciones
  verbales.
fuente: Texto escolar MINEDUC — Álgebra / Desigualdades e Inecuaciones
estado: publicado
