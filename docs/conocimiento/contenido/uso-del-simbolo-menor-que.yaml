semantic_id: MAT.ALG.ORDEN_FUNDAMENTOS.SIMBOLO_MENOR
resumen_inicial: 'Uso del símbolo menor que: relaciones de orden, intervalos y resolución
  en Relación de orden y símbolos de desigualdad.'
explicacion_simple: Para expresar que una cantidad es inferior a otra, empleamos el
  símbolo de menor que.
explicacion_formal: '### Definición formal

  Para $a, b \\in \\mathbb{R}$, $a < b$ si y solo si $b - a > 0$, lo que implica que
  la diferencia $b - a$ es un real positivo.


  ### Desarrollo didáctico

  Geométricamente, escribir $a < b$ indica que el punto $a$ se encuentra a la izquierda
  del punto $b$ en la recta real.'
definiciones_clave: '- **Uso del símbolo menor que**: Concepto fundamental de relaciones
  de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a uso del símbolo menor que.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de uso del símbolo
    menor que.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de uso del símbolo menor que, invirtiendo
    el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la regla de oro al multiplicar o dividir una desigualdad por
    un número negativo en uso del símbolo menor que?
  choices:
  - text: Invertir el sentido de la desigualdad al multiplicar o dividir por un número
      negativo en relación de orden y símbolos de desigualdad
    is_correct: true
  - text: Mantener el mismo sentido de la desigualdad sin cambios
    is_correct: false
  - text: Cambiar la variable por cero
    is_correct: false
  - text: Transformar la inecuación en una igualdad exacta
    is_correct: false
  explanation: 'La alternativa correcta es: Invertir el sentido de la desigualdad
    al multiplicar o dividir por un número negativo en relación de orden y símbolos
    de desigualdad. Es la propiedad fundamental de orden en uso del símbolo menor
    que.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al resolver una inecuación y obtener su conjunto solución en uso del símbolo
    menor que, ¿cómo se debe expresar el resultado?
  choices:
  - text: Representar el conjunto solución mediante notación de intervalo o gráficamente
      en la recta real
    is_correct: true
  - text: Como un único número aislado obligatoriamente
    is_correct: false
  - text: Igualando la variable a la constante
    is_correct: false
  - text: Eliminando los símbolos de desigualdad del resultado
    is_correct: false
  explanation: 'La alternativa correcta es: Representar el conjunto solución mediante
    notación de intervalo o gráficamente en la recta real. Forma estándar de representar
    conjuntos soluciones de inecuaciones.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- Extraer las cantidades a comparar.
- Escribir el símbolo $<$ entre ambas cantidades.
- Comprobar que el valor de la izquierda es estrictamente inferior.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en uso del símbolo menor que.
