procedimiento:
- 'Paso 1: Identifica el punto exterior P, el punto de tangencia T y los dos puntos
  de corte de la secante (A cercano, B lejano).'
- 'Paso 2: Reconoce el segmento tangente PT (desde P hasta el único punto de contacto
  T).'
- 'Paso 3: Reconoce los segmentos de la secante: PA (exterior) y PB (total, desde
  P hasta el punto lejano B).'
