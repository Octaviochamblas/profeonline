semantic_id: MAT.GEO.CIRCULO_TEOREMAS.TANGENTE_SECANTE_SEGMENTOS
resumen_inicial: 'Identificación del segmento tangente y los segmentos de la secante
  trazados desde un punto exterior: conceptos, teoremas, propiedades geométricas y
  cálculo en Circunferencia y Círculo.'
explicacion_simple: Cuando desde un punto exterior se traza una tangente y también
  una secante, hay que distinguir con precisión el segmento tangente de los dos segmentos
  que genera la secante.
explicacion_formal: '![Segmentos de una tangente y una secante](/static/img/geometria/circunferencia-circulo/circulo-teorema-tangente-secante-segmentos.svg)


  ### Definición formal


  Desde un punto exterior $P$ se traza una tangente que toca la circunferencia en
  un único punto $T$ (segmento tangente $PT$) y una secante que la corta en dos puntos,
  $A$ (cercano) y $B$ (lejano), determinando el segmento exterior $PA$ y el segmento
  total $PB$.


  ### Desarrollo didáctico


  En la figura, $PT$ es el segmento tangente (un solo punto de contacto), mientras
  que $PA$ y $PB$ son, respectivamente, el segmento exterior y el segmento total de
  la secante. Estos tres segmentos son la base para aplicar el teorema de la tangente
  y la secante.'
definiciones_clave: '- **Identificación del segmento tangente y los segmentos de la
