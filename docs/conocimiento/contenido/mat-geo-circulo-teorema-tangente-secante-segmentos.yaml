- titulo: ¿Se cumple siempre la propiedad principal de identificación del segmento
    tangente y los segmentos de la secante trazados desde un punto exterior en figuras
    congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación del segmento tangente y los segmentos de la secante
    trazados desde un punto exterior asumir un valor negativo cuando representa una
    longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en identificación del segmento tangente
  y los segmentos de la secante trazados desde un punto exterior.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en identificación
  del segmento tangente y los segmentos de la secante trazados desde un punto exterior.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en identificación
  del segmento tangente y los segmentos de la secante trazados desde un punto exterior.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de identificación
  del segmento tangente y los segmentos de la secante trazados desde un punto exterior.
afirmaciones_verdaderas:
