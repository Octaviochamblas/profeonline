semantic_id: MAT.GEO.AREAS_TRIANGULOS.UNIDADES
resumen_inicial: 'Unidades de medida de área: cm², m², km²: conceptos, teoremas, propiedades
  geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: Así como la longitud se mide en cm, m o km, el área tiene sus
  propias unidades, todas elevadas al cuadrado, y las conversiones entre ellas no
  son tan directas como podría parecer.
explicacion_formal: '![Unidades de área: cm², m², km²](/static/img/geometria/areas-pitagoras/areas-triangulos-unidades.svg)


  ### Definición formal


  Si 1 m = 100 cm, entonces 1 m² = (100 cm)² = 10000 cm², no simplemente 100 cm²,
  porque el factor de conversión se eleva al cuadrado al pasar de unidades lineales
  a unidades de área.


  ### Desarrollo didáctico


  Un error común es pensar que 1 m² = 100 cm² (usando el mismo factor 100 que para
  longitud); en realidad, como cada lado se multiplica por 100, el área se multiplica
  por 100×100=10000.'
