ejemplo_guiado:
  enunciado: 'Para analizar unidades de medida de área: cm², m², km², considera un
    ángulo $\alpha = 48^\circ$ ubicado en la posición dada. Determina el valor de
    la medida asociada sabiendo que $x + 1011^\circ = 48^\circ$.'
  pasos:
  - 'Identificar la propiedad de unidades de medida de área: cm², m², km² referida
    a $\alpha = 48^\circ$.'
  - 'Plantear la ecuación de cálculo: $x + 1011 = 48 \implies x = 48 - 1011$.'
  - 'Concluir que la medida calculada para unidades de medida de área: cm², m², km²
    es $x = -963^\circ$.'
