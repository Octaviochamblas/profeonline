resumen_inicial: El modelamiento exponencial del interés compuesto analiza la función
  $y = C \cdot a^x$ (donde $a = 1 + i > 1$), demostrando que la curva de crecimiento
  se acelera en el tiempo respecto a la recta de interés simple.
explicacion_simple: El interés compuesto se grafica como una curva curva ascendente
  que cada vez se empina más (función exponencial). Al principio parece crecer despacio
  como el interés simple, pero con los años se dispara hacia arriba gracias al interés
  acumulado.
explicacion_formal: 'La función de capitalización compuesta $M(t)$ se clasifica como
  una **Función Exponencial Estricta** de la forma:


  $$f(t) = C \cdot (1 + i)^t \quad \text{con base } a = (1 + i) > 1$$


  **Comportamiento asintótico y de concavidad:**

  - Para todo $t > 0$, la curva exponencial $C(1+i)^t$ es estrictamente convexa y
  supera a la recta lineal de interés simple $C(1 + i \cdot t)$ para todo $t > 1$.'
definiciones_clave: '- **Modelo exponencial**: Función $f(t) = C \cdot (1+i)^t$ que
  representa la trayectoria curva del crecimiento financiero.'
propiedades_relaciones: '- **Dominancia exponencial**: $C(1+i)^t > C(1+i \cdot t)$
  para todo período $t > 1$.'
ejemplo_guiado:
  enunciado: Compare los valores de $M(t) = 100.000 \cdot 1,10^t$ para $t=0, 1, 2,
    3$ años y verifique el carácter convexo de la curva.
  pasos:
  - 'Paso 1: $t=0 \implies 100.000$. $t=1 \implies 110.000$ (incremento de \$10.000).'
  - 'Paso 2: $t=2 \implies 121.000$ (incremento de \$11.000).'
  - 'Paso 3: $t=3 \implies 133.100$ (incremento de \$12.100).'
  - 'Conclusión: Los incrementos son crecientes ($\$10.000 < \$11.000 < \$12.100$),
    confirmando la concavidad convexa de la función exponencial.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué tipo de función matemática representa el crecimiento del dinero en
    interés compuesto?
  choices:
  - text: Una función exponencial de la forma f(t) = C · (1 + i)^t con base mayor
      a 1
    is_correct: true
  - text: Una función lineal f(t) = m · t + b
    is_correct: false
  - text: Una función cuadrática f(t) = a · t^2
    is_correct: false
  - text: Una función constante
    is_correct: false
  explanation: La alternativa correcta es 'Una función exponencial de la forma f(t)
    = C · (1 + i)^t con base mayor a 1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué los incrementos anuales crecieron de $10.000
    a $11.000 y luego a $12.100?
  choices:
  - text: Porque la curva exponencial se acelera al calcular el 10% sobre montos cada
      vez mayores
    is_correct: true
  - text: Porque se modificó la tasa de interés
    is_correct: false
  - text: Because es un interés simple
    is_correct: false
  - text: Por error de cálculo
    is_correct: false
  explanation: La alternativa correcta es 'Porque la curva exponencial se acelera
    al calcular el 10% sobre montos cada vez mayores'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de graficar y analizar la función
  exponencial $f(t) = C \cdot (1 + i)^t$ demostrando su aceleración sobre la función
  lineal.
semantic_id: MAT.NUM.INTERES_COMPUESTO.MODELO_EXPONENCIAL
procedimiento:
- 'Paso 1: Identificar las variables financieras ($C, i, n, M, I, R$) e igualar la
  tasa al período de capitalización.'
- 'Paso 2: Aplicar la fórmula exponencial de capitalización $M = C \cdot (1 + i)^n$
  o su variante correspondiente.'
- 'Paso 3: Resolver numéricamente o mediante logaritmos y verificar la coherencia
  económica.'
errores_correccion: '- **Error 1: Calcular el interés compuesto multiplicando el tiempo
  por la tasa en forma lineal ($C \cdot i \cdot n$).** **Cómo corregirlo:** En régimen
  compuesto el factor es exponencial $(1 + i)^n$, NO lineal.


  - **Error 2: No ajustar la tasa de interés a la frecuencia de capitalización (ej:
  usar tasa anual en capitalización mensual).** **Cómo corregirlo:** La tasa DEBE
  dividirse entre el número de períodos del año ($i = r / m$) y el tiempo multiplicarse
  ($n = m \cdot t$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_COMPUESTO.MODELO_EXPONENCIAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés compuesto.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización exponencial.
  alternativas:
  - Cumple el modelo
  - No cumple
  - Indeterminado
  respuesta: Cumple el modelo
  solucion_pasos:
  - Demostración formal por $M = C(1+i)^n$.
- titulo: ¿Supera el interés compuesto al simple para t > 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, debido al efecto acumulativo de la capitalización de intereses.
- titulo: ¿Se requiere logaritmo para despejar el número de períodos n?
  respuesta: Sí
  solucion_pasos:
  - Sí, para bajar el exponente $n$ mediante la propiedad logarítmica.
errores_frecuentes:
- Usar la fórmula lineal del interés simple $C \cdot i \cdot t$ para resolver problemas
  de capitalización compuesta.
- No dividir la tasa de interés anual entre 12 cuando el período de capitalización
  es mensual.
- Omitir restar el capital inicial $C$ al monto acumulado final $M$ al calcular únicamente
  el interés ganado.
- Declarar que dos cuotas de interés compuesto acumulado crecen en forma de progresión
  aritmética constante.
- Sumar directamente las cuotas de amortización sin descontar la tasa de interés en
  el valor presente.
afirmaciones_verdaderas:
- El interés compuesto se caracteriza porque los intereses de cada período se suman
  al capital para generar nuevos intereses.
- El monto acumulado en régimen compuesto sigue un modelo de función exponencial $M
  = C \cdot (1 + i)^n$.
