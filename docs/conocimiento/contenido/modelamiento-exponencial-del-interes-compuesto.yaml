  QUÉ: Modelar situaciones financieras de capitalización compuesta mediante funciones exponenciales $f(t) = C \cdot a^t$.
  CÓMO: Determinar el intercepto $(0, C)$ y la base de crecimiento $a = (1 + i)$, interpretando algebraicamente la tasa porcentual periódica y la concavidad de la curva.
