procedimiento:
- 'Paso 1: Identifica si el problema describe un crecimiento donde los intereses se
  capitalizan.'
- 'Paso 2: Si hay capitalización, asocia inmediatamente la situación a un modelo exponencial.'
- 'Paso 3: Construye la función: $f(x) = Capital \cdot (Factor)^x$.'
errores_correccion: Evita confundir los datos de entrada al operar con modelamiento
  exponencial del interés compuesto.
ejemplos:
- titulo: Deuda de tarjeta
  enunciado: Una persona debe $100.000 en su tarjeta, la cual cobra 3% de interés
    compuesto mensual. Modela su deuda total en función de los meses 'x'.
  solucion_pasos:
  - Capital = 100.000. Tasa = 0.03. Factor = 1.03.
  - La variable tiempo es 'x'.
  - La función exponencial es $f(x) = 100.000 \cdot (1.03)^x$.
errores_frecuentes:
- Creer que la función es cuadrática porque tiene un exponente (las cuadráticas tienen
  el 2 fijo como exponente, las exponenciales tienen la variable 'x' en el exponente).
- Asignar un modelo lineal al interés compuesto.
afirmaciones_verdaderas:
- La propiedad de modelamiento exponencial del interés compuesto preserva la consistencia
  lógica.
al_terminar_debes_poder: Resolver problemas aplicados que involucren modelamiento
  exponencial del interés compuesto.
