semantic_id: MAT.NUM.INTERES_COMPUESTO.MODELO_EXPONENCIAL
resumen_inicial: 'El modelamiento exponencial del interés compuesto expresa la evolución temporal del capital mediante la función exponencial $f(x) = C \cdot b^x$, donde $C$ es el valor inicial y $b = (1 + i) > 1$ es la base de crecimiento.'
explicacion_simple: |
  En matemáticas, el crecimiento del dinero a interés compuesto es un ejemplo clásico de **función exponencial**.
  Si graficas el tiempo en el eje horizontal ($x$) y el dinero en el eje vertical ($y$):
  - No obtienes una línea recta (como en el interés simple).
  - Obtienes una **curva que se va inclinando hacia arriba cada vez más rápido**, del tipo $y = C \cdot b^x$.
  La base de la función es $b = 1 + i$. Si la tasa es del $8\%$ ($0,08$), la función es $f(x) = C \cdot (1,08)^x$.
explicacion_formal: |
  ### Definición formal
  El valor futuro a interés compuesto se modela mediante la **función exponencial continua de dominio real positivo** $f: \mathbb{R}^+ \to \mathbb{R}^+$:
  $$f(x) = C \cdot b^x \quad \text{con} \quad b = 1 + i > 1$$
  donde:
  - $x \ge 0$ representa la variable continua de tiempo.
  - $C = f(0)$ representa la ordenada al origen (capital inicial).
  - $b = 1 + i$ es el **factor base de crecimiento por período**.

  ### Propiedades del Modelo Exponencial
  1. **Invarianza del tiempo de duplicación ($T_2$)**:
     El tiempo necesario para que cualquier capital se duplique depende únicamente de la base $b$:
     $$b^{T_2} = 2 \implies T_2 = \frac{\ln(2)}{\ln(1 + i)} \approx \frac{72}{r\%} \quad (\text{Regla del 72})$$
  2. **Derivada y Tasa Instantánea de Crecimiento**:
     $$f'(x) = C \cdot \ln(b) \cdot b^x = \ln(1 + i) \cdot f(x)$$
     La velocidad de crecimiento instantáneo es directamente proporcional al valor acumulado en dicho instante.

  ### Síntesis didáctica
  - Ecuación del modelo: $f(x) = C \cdot (1 + i)^x$.
  - Intercepto: $(0, C)$.
  - Comportamiento gráfico: Curva estrictamente convexa con crecimiento acelerado.
definiciones_clave: |
  - **Función exponencial ($f(x) = C \cdot b^x$)**: Modelo matemático donde la variable independiente figura como exponente.
  - **Factor base de crecimiento ($b = 1 + i$)**: Razón constante entre dos valores consecutivos del capital ($M_{k+1} / M_k = b$).
  - **Regla del 72**: Estimación práctica del tiempo de duplicación dividiendo 72 entre la tasa de interés porcentual ($T_2 \approx 72 / r$).
propiedades_relaciones: |
  - **Concavidad positiva**: La curva $f(x)$ es convexa ($f''(x) > 0$), reflejando el fenómeno de aceleración en la acumulación de ganancias.
  - **Continuidad de dominios**: Permite evaluar montos para tiempos no enteros (ej: $x = 2,5$ años) mediante exponentes fraccionarios $b^{5/2} = \sqrt{b^5}$.
ejemplo_guiado:
  enunciado: 'Determina la función exponencial que modela la evolución de un capital inicial de $\$800.000$ colocado a una tasa de interés compuesto del $6\%$ anual, y estima en cuántos años aproximadamente se duplica ese dinero usando la Regla del 72.'
  pasos:
    - 'Paso 1: Identificamos la ordenada al origen $C = 800.000$ y la tasa $i = 0,06$.'
    - 'Paso 2: Formamos la base $b = 1 + i = 1 + 0,06 = 1,06$.'
    - 'Paso 3: Escribimos la función exponencial modelada: $f(x) = 800.000 \cdot (1,06)^x$.'
    - 'Paso 4: Aplicamos la Regla del 72 para el tiempo de duplicación: $T_2 \approx \frac{72}{6} = 12\text{ años}$. El dinero se duplica en **apróximadamente 12 años**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la función exponencial de interés compuesto $f(x) = C \cdot b^x$, ¿qué representa la base $b$?'
    choices:
      - {text: 'El factor base de crecimiento por período ($b = 1 + i$)', is_correct: true}
      - {text: 'El capital inicial depositado en el banco', is_correct: false}
      - {text: 'El número total de días transcurridos', is_correct: false}
      - {text: 'La resta de la tasa menos el tiempo', is_correct: false}
    explanation: 'La alternativa correcta es ''El factor base de crecimiento por período ($b = 1 + i$)''. Es la razón constante $1 + i$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Usando la Regla del 72, ¿cuántos años aproximadamente tardará un capital en duplicarse si la tasa de interés compuesto es del $9\%$ anual?'
    choices:
      - {text: 'Aproximadamente $8$ años, dividiendo $72 / 9 = 8$', is_correct: true}
      - {text: 'Aproximadamente $18$ años, multiplicando $9 \cdot 2$', is_correct: false}
      - {text: 'Aproximadamente $72$ años, manteniendo el número', is_correct: false}
      - {text: 'Aproximadamente $4$ años, dividiendo $36 / 9$', is_correct: false}
    explanation: 'La alternativa correcta es ''Aproximadamente $8$ años, dividiendo $72 / 9 = 8$''. Regla del 72: $T_2 \approx 72 / 9 = 8$ años.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la suma inicial $C$ (intercepto $y$).'
  - 'Paso 2: Determinar la tasa decimal $i$ y construir la base $b = 1 + i$.'
  - 'Paso 3: Formular la ecuación exponencial $f(x) = C \cdot b^x$.'
  - 'Paso 4: Evaluar la función para cualquier valor del tiempo $x$ o estimar el tiempo de duplicación con $72/r$.'
errores_correccion: |
  - **Error 1:** Confundir la gráfica del modelo exponencial con una recta lineal de interés simple. **Cómo corregirlo:** El gráfico del modelo de interés compuesto es una **curva curva hacia arriba (convexa)** debido al factor $b^x$.
  - **Error 2:** Usar la tasa porcentual entera en la base (ej: escribir $b = 1 + 6 = 7$ para el 6%). **Cómo corregirlo:** La tasa debe convertirse a decimal antes de sumar 1: **$b = 1 + 0,06 = 1,06$**.
ejemplos:
  - titulo: 'Modelo exponencial básico'
    enunciado: 'Para $C = \$100.000$ e $i = 5\%$, ¿la función es $f(x) = 100.000 \cdot (1,05)^x$?'
    alternativas:
      - 'Sí, pues $b = 1 + 0,05 = 1,05$'
      - 'No, es $f(x) = 100.000 + 1,05x$'
      - 'No, es $f(x) = 5.000^x$'
    respuesta: 'Sí, pues $b = 1 + 0,05 = 1,05$'
    solucion_pasos:
      - '1. Base $b = 1 + 0,05 = 1,05$.'
      - '2. Función: $f(x) = 100.000 \cdot (1,05)^x$.'
  - titulo: 'Estimación por Regla del 72 al 12%'
    enunciado: 'Al $12\%$ anual, ¿el dinero se duplica en aproximadamente 6 años ($72 / 12 = 6$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $T_2 \approx 72 / 12 = 6\text{ años}$.'
  - titulo: 'Valor de la función en t=0'
    enunciado: '¿El valor de $f(0) = C \cdot b^0 = C \cdot 1 = C$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En el instante inicial el monto equivale exactamente al capital depositado.'
  - titulo: 'Razón entre valores consecutivos'
    enunciado: '¿El cociente $\frac{f(x+1)}{f(x)}$ es igual a la constante $b = 1+i$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $\frac{C b^{x+1}}{C b^x} = b$.'
errores_frecuentes:
  - 'Representar el crecimiento del dinero a interés compuesto con una función lineal del tipo $y = mx + b$.'
  - 'Ingresar el porcentaje entero dentro de la base sin dividir previamente entre 100.'
  - 'La Regla del 72 entrega el valor exacto del interés en lugar del tiempo aproximado de duplicación.'
  - 'Considerar que la curva del modelo de crecimiento se aplana asintóticamente hacia abajo.'
  - 'Invertir la variable colocando el tiempo en la base y el factor en el exponente.'
afirmaciones_verdaderas:
  - 'El crecimiento del dinero a interés compuesto sigue una función exponencial $f(x) = C \cdot b^x$ con base $b = 1 + i > 1$.'
  - 'La Regla del 72 permite estimar el tiempo de duplicación de un capital dividiendo 72 por la tasa de interés porcentual ($T_2 \approx 72 / r$).'
al_terminar_debes_poder: 'Modelar el interés compuesto mediante funciones exponenciales $f(x) = C \cdot b^x$ y estimar tiempos de duplicación con la Regla del 72.'
