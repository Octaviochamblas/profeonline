procedimiento:
- 'Paso 1: Identifica si el problema describe un crecimiento donde los intereses se capitalizan.'
- 'Paso 2: Si hay capitalización, asocia inmediatamente la situación a un modelo exponencial.'
- 'Paso 3: Construye la función: $f(x) = Capital \cdot (Factor)^x$.'
errores_correccion: Evita confundir los datos de entrada al operar con modelamiento exponencial
  del interés compuesto.
ejemplos:
- titulo: Deuda de tarjeta
  enunciado: Una persona debe $100.000 en su tarjeta, la cual cobra 3% de interés compuesto
    mensual. Modela su deuda total en función de los meses 'x'.
  solucion_pasos:
  - Capital = 100.000. Tasa = 0.03. Factor = 1.03.
  - La variable tiempo es 'x'.
  - La función exponencial es $f(x) = 100.000 \cdot (1.03)^x$.
- titulo: Ejemplo 2
  enunciado: Un capital de 30.000 pesos crece al 3% mensual compuesto. ¿Cuál es su función
    en términos de x meses?
  alternativas:
  - f(x) = 30.000 por 1,03 elevado a x
  - f(x) = 30.000 por 1,03 por x
  - f(x) = 30.000 más 1,03x
  respuesta: f(x) = 30.000 por 1,03 elevado a x
  solucion_pasos:
  - El factor 1,03 se eleva a x, no se multiplica por x.
- titulo: ¿Una función exponencial de crecimiento siempre tiene base mayor que 1?
  respuesta: Sí
  solucion_pasos:
  - Si la base fuera menor que 1, representaría un decrecimiento.
- titulo: ¿El modelo del interés compuesto es un modelo lineal?
  respuesta: 'No'
  solucion_pasos:
  - Es un modelo exponencial, porque el tiempo está en el exponente.
errores_frecuentes:
- Creer que la función es cuadrática porque tiene un exponente (las cuadráticas tienen el
  2 fijo como exponente, las exponenciales tienen la variable 'x' en el exponente).
- Asignar un modelo lineal al interés compuesto.
- Creer que la función es cuadrática solo porque tiene un exponente, confundiéndola con f(x)
  igual a ax al cuadrado.
- Asignar un modelo lineal al interés compuesto, cuando en realidad es exponencial.
- Olvidar que la base del modelo exponencial debe ser mayor que 1 para representar un crecimiento.
afirmaciones_verdaderas:
- La propiedad de modelamiento exponencial del interés compuesto preserva la consistencia
  lógica.
- En el modelo exponencial del interés compuesto, la variable tiempo siempre aparece en el
  exponente, nunca multiplicando a la base.
al_terminar_debes_poder: Resolver problemas aplicados que involucren modelamiento exponencial
  del interés compuesto.
