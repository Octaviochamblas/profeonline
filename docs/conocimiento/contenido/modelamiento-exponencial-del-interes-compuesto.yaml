semantic_id: MAT.NUM.INTERES_COMPUESTO.MODELO_EXPONENCIAL
resumen_inicial: 'El modelamiento exponencial del interés compuesto representa el valor acumulado en el tiempo mediante la función $f(t) = C \cdot a^t$ con base de crecimiento $a = (1 + i) > 1$.'
explicacion_simple: |
  El interés compuesto se comporta exactamente como una **función exponencial**:
  - En el tiempo $t = 0$, el dinero es el capital inicial $C$.
  - Con cada año que pasa, el dinero se multiplica por el factor constante $a = (1 + i)$.
  - Al graficarlo, en lugar de una línea recta plana, se forma una curva que se empina cada vez más hacia arriba (crecimiento acelerado).

  ![Modelamiento exponencial del interés compuesto](/static/img/nodos/modelamiento-exponencial-del-interes-compuesto-intro.svg)
explicacion_formal: |
  ### Definición formal
  El valor de un capital $C$ sometido a capitalización compuesta continua o periódica como función del tiempo $t \ge 0$ se modela mediante la **función exponencial**:
  $$f(t) = C \cdot a^t = C \cdot (1 + i)^t$$
  donde:
  - $C = f(0) > 0$ es el **coeficiente de escala** (capital inicial / intercepto vertical con el eje de ordenadas).
  - $a = 1 + i > 1$ es la **base del modelo exponencial** (factor de crecimiento por unidad de tiempo).
  - $t \in \mathbb{R}^+_0$ es la variable temporal continua o discreta.

  ### Propiedades del Modelo Exponencial
  1. **Monotonía estricta**: Como $a > 1$, la función $f(t)$ es estrictamente creciente en todo su dominio $[0, +\infty)$.
  2. **Tasa de crecimiento instantáneo**: La derivada $f'(t) = C \cdot \ln(a) \cdot a^t = \ln(1+i) \cdot f(t)$ es proporcional al valor acumulado en cada instante.
  3. **Tiempo de duplicación ($t_d$)**: Período requerido para que $f(t) = 2C$:
     $$2C = C \cdot (1 + i)^{t_d} \implies t_d = \frac{\ln 2}{\ln(1 + i)}$$

  ### Síntesis didáctica
  - Ecuación exponencial: $f(t) = C \cdot (1 + i)^t$.
  - Intercepto con el eje $y$: Punto $(0, C)$.
  - Concavidad: Hacia arriba (crecimiento acelerado).
definiciones_clave: |
  - **Base de crecimiento ($a$)**: Razón multiplicativa constante por unidad de tiempo ($a = 1 + i$).
  - **Tiempo de duplicación**: Intervalo de tiempo constante en el que cualquier suma invertida se multiplica exactamente por dos.
  - **Crecimiento geométrico**: Progresión donde cada término se obtiene multiplicando el anterior por una razón fija.
propiedades_relaciones: |
  - **Regla del 72**: Aproximación financiera clásica que estima el tiempo de duplicación en años como $t_d \approx 72 / r$ (para tasas $r\%$ moderadas).
  - **Divergencia con el modelo lineal**: Para plazos largos, la distancia vertical entre la curva exponencial y la recta simple tiende a infinito.
ejemplo_guiado:
  enunciado: 'Un fondo de inversión se modela mediante la función $M(t) = 100.000 \cdot (1,08)^t$, donde $t$ está en años. Determina el capital inicial, la tasa anual compuesta y el valor del fondo al cabo de $2$ años.'
  imagen: '/static/img/nodos/modelamiento-exponencial-del-interes-compuesto-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos el capital inicial en $t = 0$: $M(0) = 100.000 \cdot (1,08)^0 = $\$100.00$0$.'
    - 'Paso 2: La base es $a = 1 + i = 1,08 \implies i = 0,08$, lo que corresponde a una tasa anual del **$8\%$**.'
    - 'Paso 3: Evaluamos para $t = 2$: $M(2) = 100.000 \cdot (1,08)^2 = 100.000 \cdot 1,1664$.'
    - 'Paso 4: Calculamos: $M(2) = 116.640$. El valor del fondo es de **$\$116.640$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el modelo exponencial financiero $f(t) = C \cdot a^t$, ¿qué representa el parámetro $C$ y qué condición cumple la base $a$ para representar crecimiento?'
    choices:
      - {text: 'El capital inicial $C = f(0)$ y la base debe ser estrictamente mayor que 1 ($a > 1$)', is_correct: true}
      - {text: 'La tasa de interés y la base debe ser menor que 1', is_correct: false}
      - {text: 'El tiempo total y la base debe ser igual a cero', is_correct: false}
      - {text: 'El interés ganado y la base debe ser negativa', is_correct: false}
    explanation: 'La alternativa correcta es ''El capital inicial $C = f(0)$ y la base debe ser estrictamente mayor que 1 ($a > 1$)''. Para $t=0$, $f(0)=C$, y si $a>1$ la función crece exponencialmente.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la función de capitalización $f(t) = 50.000 \cdot (1,06)^t$, ¿cuál es la tasa anual de interés?'
    choices:
      - {text: 'El $6\%$ anual, pues $a = 1 + i = 1,06 \implies i = 0,06$', is_correct: true}
      - {text: 'El $60\%$ anual', is_correct: false}
      - {text: 'El $0,6\%$ anual', is_correct: false}
      - {text: 'El $1,06\%$ anual', is_correct: false}
    explanation: 'La alternativa correcta es ''El $6\%$ anual, pues $a = 1 + i = 1,06 \implies i = 0,06$''. Restando 1 a la base obtenemos $i = 0,06 = 6\%$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el modelo en la forma canónica $f(t) = C \cdot (1 + i)^t$.'
  - 'Paso 2: Reconocer el coeficiente $C$ como el valor inicial en $t = 0$.'
  - 'Paso 3: Determinar la tasa periódica despejando $i = a - 1$.'
  - 'Paso 4: Evaluar la función en valores específicos de $t$ o resolver ecuaciones exponenciales para determinar el tiempo.'
errores_correccion: |
  - **Error 1:** Confundir la base exponencial $a = 1 + i$ con la tasa de interés directa (creer que la tasa es $108\%$ cuando la base es $1,08$). **Cómo corregirlo:** La tasa porcentual es el **excedente sobre la unidad**: $i = a - 1 \implies 1,08 - 1 = 0,08 = 8\%$.
  - **Error 2:** Tratar la función exponencial como una función lineal multiplicando $C \cdot a \cdot t$. **Cómo corregirlo:** La variable temporal $t$ se encuentra en el **EXPONENTE**, no como factor multiplicativo.
ejemplos:
  - titulo: 'Identificación de parámetros'
    enunciado: 'En la función $f(t) = 80.000 \cdot (1,05)^t$, ¿cuál es el capital inicial y la tasa anual?'
    alternativas:
      - '$C = $\$80.00$0$ y tasa $5\%$ anual'
      - '$C = $\$80.00$0$ y tasa $105\%$ anual'
      - '$C = $\$1,0$5$ y tasa $80.000\%$ anual'
    respuesta: '$C = $\$80.00$0$ y tasa $5\%$ anual'
    solucion_pasos:
      - '1. Coeficiente inicial $C = 80.000$.'
      - '2. Tasa $i = 1,05 - 1 = 0,05 = 5\%$.'
  - titulo: 'Evaluación a 2 años'
    enunciado: 'Si $f(t) = 100.000 \cdot (1,10)^t$, ¿cuál es el valor en $t = 2$?'
    alternativas:
      - '$\$121.000$'
      - '$\$120.000$'
      - '$\$220.000$'
    respuesta: '$\$121.000$'
    solucion_pasos:
      - '1. $f(2) = 100.000 \cdot (1,10)^2 = 100.000 \cdot 1,21 = $\$121.00$0$.'
  - titulo: 'Propiedad de concavidad'
    enunciado: '¿La gráfica de una función exponencial de interés compuesto $f(t) = C(1+i)^t$ con $i > 0$ es cóncava hacia arriba?'
    alternativas:
      - 'Sí, su pendiente es estrictamente creciente'
      - 'No, es una línea recta con pendiente constante'
      - 'No, es cóncava hacia abajo'
    respuesta: 'Sí, su pendiente es estrictamente creciente'
    solucion_pasos:
      - '1. La segunda derivada $f''(t) > 0$, lo que confirma la concavidad positiva.'
  - titulo: 'Tiempo de duplicación aproximado'
    enunciado: 'Para una tasa del $7,2\%$ anual compuesta, ¿el capital se duplica aproximadamente en 10 años?'
    alternativas:
      - 'Sí, aplicando la regla del 72 ($72 / 7,2 = 10\text{ años}$)'
      - 'No, se duplica en 5 años'
      - 'No, se duplica en 20 años'
    respuesta: 'Sí, aplicando la regla del 72 ($72 / 7,2 = 10\text{ años}$)'
    solucion_pasos:
      - '1. $t_d \approx 72 / 7,2 = 10\text{ años}$.'
errores_frecuentes:
  - 'La base de la función exponencial $a = 1 + i$ se interpreta directamente como la tasa porcentual sin restar la unidad.'
  - 'La función exponencial de interés compuesto se grafica como una línea recta de pendiente fija.'
  - 'El coeficiente $C$ representa el monto final en lugar del capital inicial en $t = 0$.'
  - 'La tasa de crecimiento porcentual periódica varía continuamente en lugar de mantenerse constante.'
  - 'El modelo exponencial financiero decrece cuando la tasa de interés $i$ es positiva.'
afirmaciones_verdaderas:
  - 'El modelo exponencial de interés compuesto tiene la forma $f(t) = C \cdot (1 + i)^t$, con intercepto vertical en $(0, C)$.'
  - 'La base del modelo exponencial $a = 1 + i$ es estrictamente mayor que 1 para cualquier tasa de interés positiva.'
