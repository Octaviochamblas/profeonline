semantic_id: MAT.NUM.INTERES_COMPUESTO.MODELO_EXPONENCIAL
resumen_inicial: 'Modelamiento exponencial del interés compuesto: concepto y propiedades fundamentales
  en Interés compuesto.'
explicacion_simple: Las matemáticas tienen patrones. Cuando sumas lo mismo cada vez, haces
  una escalera recta (lineal). Cuando multiplicas por lo mismo cada vez, construyes un cohete
  hacia el cielo (exponencial). Así crece el interés compuesto.
explicacion_formal: "En la PAES a menudo no te piden calcular dinero, sino **identificar el\
  \ tipo de modelo matemático**.\n\n- Interés Simple $\\rightarrow$ Suma constante $\\rightarrow$\
  \ **Modelo Lineal** (Línea recta).\n- Interés Compuesto $\\rightarrow$ Multiplicación constante\
  \ por $(1+i)$ $\\rightarrow$ **Modelo Exponencial** (Curva).\n\nSi analizamos la fórmula\
  \ $M(t) = C \\cdot (1+i)^t$ como una función:\n- La variable independiente (la $x$) es el\
  \ tiempo $t$, y está ubicada en el **exponente**.\n- Por lo tanto, el dinero crece de forma\
  \ exponencial. \n- Como la base $(1+i)$ siempre es mayor que $1$ (porque la tasa es positiva),\
  \ es una función exponencial de **crecimiento** (la curva va hacia arriba)."
definiciones_clave: '- **Modelamiento exponencial del interés compuesto**: Elemento central
  dentro del estudio de Interés compuesto.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a modelamiento exponencial del interés compuesto.'
ejemplo_guiado:
  enunciado: Una deuda de 50.000 pesos en tarjeta de crédito cobra 4% de interés compuesto
    mensual. Modela la deuda total en función de los meses x.
  pasos:
  - Identifico el capital, 50.000, y la tasa, 4%, es decir factor 1,04.
  - Reconozco que la variable tiempo, x, está en el exponente, lo que indica un modelo exponencial.
  - 'Escribo la función: f(x) igual a 50.000 por 1,04 elevado a x.'
