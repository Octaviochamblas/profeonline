semantic_id: MAT.ALG.FUNCION_EVALUACION.VALORIZACION_FUNCIONAL
resumen_inicial: La sustitución numérica consiste en calcular el valor escalar de salida de una función reemplazando la variable independiente por un número real concreto.
explicacion_simple: |
  Para valorizar numéricamente una función:

  1. Reemplazas la variable $x$ por el número asignado.
  2. Resolviendo primero los paréntesis y las potencias.
  3. Luego las multiplicaciones y divisiones.
  4. Finalmente las sumas y restas.

  Por ejemplo, en $f(x) = 5 - 2x$, evaluamos en $x = -4$:
  $$f(-4) = 5 - 2(-4) = 5 + 8 = 13$$
explicacion_formal: |
  Sea $f: \text{Dom}(f) \to \mathbb{R}$ una función real. La **valorización numérica** en $x = x_0 \in \text{Dom}(f)$ se define como la obtención del número escalar $y_0$:

  $$y_0 = f(x_0) \in \mathbb{R}$$

  **Desglose del orden de operaciones:**
  - Potencias y raíces.
  - Multiplicaciones y divisiones de izquierda a derecha.
  - Adiciones y sustracciones.
definiciones_clave: |
  - **Valorización funcional**: Proceso aritmético para determinar la imagen exacta de un número real dado.
propiedades_relaciones: |
  - **Regla de signos**: Multiplicar o dividir dos números de igual signo da resultado positivo; de distinto signo da resultado negativo.
ejemplo_guiado:
  enunciado: "Valoriza la función $f(x) = \frac{x^2 - 4}{2x + 1}$ en el valor $x = -3$."
  pasos:
    - 'Paso 1: Reemplazar $x$ por $(-3)$ en numerador y denominador: $f(-3) = \frac{(-3)^2 - 4}{2(-3) + 1}$.'
    - 'Paso 2: Desarrollar el numerador: $(-3)^2 - 4 = 9 - 4 = 5$.'
    - 'Paso 3: Desarrollar el denominador: $2(-3) + 1 = -6 + 1 = -5$.'
    - 'Paso 4: Realizar la división de las expresiones: $\frac{5}{-5} = -1$.'
    - 'Paso 5: Concluir que $f(-3) = -1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "Al valorizar la función $f(x) = \frac{x^2 - 4}{2x + 1}$ en $x = -3$, ¿cuál es el resultado final?"
    choices:
      - {text: "$-1$", is_correct: true}
      - {text: "$1$", is_correct: false}
      - {text: "$-5$", is_correct: false}
      - {text: "$5/7$", is_correct: false}
    explanation: "La alternativa correcta es '$-1$'. Numerador: $(-3)^2 - 4 = 5$; Denominador: $2(-3)+1 = -5$; $5/(-5) = -1$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Al evaluar $f(x) = 5 - 2x$ en $x = -4$, ¿cuál es el valor de $f(-4)$?"
    choices:
      - {text: "$13$", is_correct: true}
      - {text: "$-3$", is_correct: false}
      - {text: "$-13$", is_correct: false}
      - {text: "$3$", is_correct: false}
    explanation: "La alternativa correcta es '$13$'. $5 - 2(-4) = 5 + 8 = 13$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir la expresión original de la función.'
  - 'Paso 2: Sustituir la incógnita $x$ por el número real $x_0$ entre paréntesis.'
  - 'Paso 3: Efectuar las potencias y productos respetando reglas de signos.'
  - 'Paso 4: Reducir las sumas/restas y simplificar la fracción si corresponde.'
errores_correccion: |
  - **Error común:** Realizar la resta antes que la multiplicación en expresiones del tipo $5 - 2(-4)$.
  - **Cómo corregirlo:** La multiplicación $-2(-4) = +8$ tiene prioridad absoluta sobre la suma con $5$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de evaluación funcional.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de evaluación funcional.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Al valorizar $f(x) = 5 - 2x$ en $x = -3$, la operación resulta en $5 - 6 = -1$.'
  - 'Sustituir $x = 0$ en $f(x) = \frac{x + 4}{2x - 6}$ genera una indeterminación por división por cero.'
  - 'Valorizar una función con un número entero exige transformar previamente el número en una fracción algebraica.'
  - 'La sustitución numérica en $f(x) = x^3$ con $x = -2$ produce el valor positivo $8$.'
  - 'En la valorización funcional, el orden de las operaciones puede alterarse sin afectar el resultado numérico final.'
afirmaciones_verdaderas:
  - 'La sustitución numérica en una función consiste en reemplazar la variable $x$ por un número real concreto y realizar la aritmética resultante.'
  - 'Respetar la regla de los signos y la jerarquía de las operaciones (potencias, multiplicaciones, sumas) es indispensable para una valorización correcta.'
al_terminar_debes_poder: |
  QUÉ: Efectuar valorizaciones numéricas en funciones de variable real.
  CÓMO: Sustituir la incógnita por el número asignado, aplicar jerarquía de operaciones y reglas de signos, y obtener el valor escalar $y$.
fuente: 'Texto escolar MINEDUC — Álgebra / Evaluación de Funciones'
estado: publicado
