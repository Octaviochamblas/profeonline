procedimiento:
- 'Paso 1: Escribe la regla de la función completa.'
- 'Paso 2: Reemplaza cada aparición de la variable por el valor dado, usando paréntesis
  para evitar errores de signo.'
- 'Paso 3: Resuelve las potencias, luego las multiplicaciones y divisiones, y finalmente
  sumas y restas.'
- 'Paso 4: El número resultante es el valor de la función evaluada.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar evaluación de una función por sustitución numérica.
ejemplos:
- titulo: Evaluación con potencia
  enunciado: Si $f(x) = 2x^2 + 5$, calcula $f(3)$.
  solucion_pasos:
  - Sustituimos x por 3 con paréntesis.
  - $f(3) = 2(3)^2 + 5 = 2(9) + 5 = 18 + 5 = 23$.
- titulo: Evaluación con argumento negativo
  enunciado: Si $f(x) = -x^2 + 4x$, calcula $f(-2)$.
  solucion_pasos:
  - Sustituimos x por -2, cuidando el signo del cuadrado.
  - $f(-2) = -(-2)^2 + 4(-2) = -(4) - 8 = -4 - 8 = -12$.
- titulo: ¿Al evaluar $f(-3)$ en $f(x) = x^2$, el resultado es negativo?
  enunciado: ¿Al evaluar $f(-3)$ en $f(x) = x^2$, el resultado es negativo?
  respuesta: 'No'
  solucion_pasos:
  - $f(-3) = (-3)^2 = 9$, un número positivo.
- titulo: ¿El orden de las operaciones importa al evaluar una función?
  enunciado: ¿El orden de las operaciones importa al evaluar una función?
  respuesta: Sí
  solucion_pasos:
  - Se debe respetar la jerarquía de operaciones (potencias, luego productos, luego
    sumas) para obtener el resultado correcto.
errores_frecuentes:
- Olvidar usar paréntesis al sustituir valores negativos, calculando $-3^2=-9$ en
  vez de $(-3)^2=9$.
- Sumar antes de resolver las potencias o multiplicaciones.
- Sustituir el valor solo en parte de la expresión cuando la variable aparece varias
  veces.
- Confundir evaluar $f(a)$ con resolver la ecuación $f(x)=a$.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando evaluación
  de una función por sustitución numérica.
