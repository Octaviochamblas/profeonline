semantic_id: MAT.ALG.FUNCION_EVALUACION.VALORIZACION_FUNCIONAL
resumen_inicial: Evaluar una función por sustitución numérica consiste en reemplazar la variable por un número dado y calcular el resultado aritmético.
explicacion_simple: '![Evaluar una función por sustitución numérica consiste en reemplazar la variable por un número dado y calcular el resultado aritmético](/static/img/nodos/evaluacion-de-una-funcion-por-sustitucion-numerica-intro.svg)



  Para evaluar una función $f(x)$ en un valor numérico específico, simplemente reemplazas cada letra $x$ por ese número, protegiéndolo con **paréntesis**.


  Por ejemplo, si $f(x) = 2x^2 - 3x + 1$ y quieres calcular $f(-2)$:

  $$f(-2) = 2(-2)^2 - 3(-2) + 1 = 2(4) + 6 + 1 = 15$$


  El uso de paréntesis evita errores graves de signo como confundir $(-2)^2 = 4$ con $-2^2 = -4$.'
explicacion_formal: 'Dada una función real $f: \text{Dom}(f) \to \mathbb{R}$ definida mediante una expresión algebraica $y = f(x)$, la **evaluación numérica** en $x = a \in \text{Dom}(f)$ se define formalmente como el valor obtenido tras sustituir la variable libre por la constante $a$:

  $$f(a) = \big. f(x) \big|_{x=a}$$


  **Jerarquía obligatoria de operaciones:**

  1. Paréntesis y agrupaciones.

  2. Potencias y raíces.

  3. Multiplicaciones y divisiones (de izquierda a derecha).

  4. Adiciones y sustracciones.'
definiciones_clave: '- **Sustitución numérica**: Reemplazo directo de la variable independiente por una constante real.

  - **Valor numérico de la función**: Número real resultante de realizar todas las operaciones indicadas en la regla.'
propiedades_relaciones: '- **Par ordenado asociado**: La evaluación $f(a) = b$ genera el punto de coordenadas $(a, b)$ en el plano cartesiano.

  - **Unicidad de resultado**: Cada sustitución válida en el dominio produce una única imagen.'
ejemplo_guiado:
  enunciado: '![Ejemplo Evaluar una función por sustitución numérica consiste en reemplazar la variable por un número dado y calcular el resultado aritmético](/static/img/nodos/evaluacion-de-una-funcion-por-sustitucion-numerica-ejemplos.svg)



    Dada la función $f(x) = 3x^2 - 5x - 2$, calcula el valor numérico de $f(-3)$.'
  pasos:
  - 'Paso 1: Escribir la estructura de la función usando paréntesis para el argumento: $f(-3) = 3(-3)^2 - 5(-3) - 2$.'
  - 'Paso 2: Calcular la potencia: $(-3)^2 = 9$, luego $3(9) = 27$.'
  - 'Paso 3: Calcular el producto con signo: $-5(-3) = +15$.'
  - 'Paso 4: Realizar la suma algebraica: $27 + 15 - 2 = 42 - 2 = 40$.'
  - 'Paso 5: Concluir que $f(-3) = 40$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si $f(x) = 4 - x^2$, ¿cuál es el valor de $f(-3)$?
  choices:
  - text: '-5'
    is_correct: true
  - text: '13'
    is_correct: false
  - text: '-13'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: 'La alternativa correcta es ''-5''. Al sustituir: $f(-3) = 4 - (-3)^2 = 4 - 9 = -5$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Dada $g(x) = \frac{2x + 6}{x - 1}$, ¿cuál es el valor de $g(3)$?
  choices:
  - text: '6'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: 'La alternativa correcta es ''6''. Sustituyendo: $g(3) = \frac{2(3) + 6}{3 - 1} = \frac{12}{2} = 6$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar que el valor a evaluar pertenezca al dominio de la función.'
- 'Paso 2: Sustituir la variable $x$ por el número dado colocando paréntesis protectores.'
- 'Paso 3: Resolver potencias respetando las reglas de signos para bases negativas.'
- 'Paso 4: Efectuar multiplicaciones y divisiones.'
- 'Paso 5: Reducir adiciones y sustracciones para obtener el resultado final.'
errores_correccion: '- **Error común:** Omitir los paréntesis al sustituir números negativos, calculando $-3^2 = -9$ en vez de $(-3)^2 = 9$.

  - **Cómo corregirlo:** Toda sustitución de número negativo en una potencia de exponente par debe llevar paréntesis: $(-a)^2 = a^2$.'
ejemplos:
- titulo: 'Ejemplo 1: Polinomio cúbico'
  enunciado: Si $f(x) = x^3 - 2x^2 + 5$, ¿cuál es el valor de $f(-1)$?
  alternativas:
  - '2'
  - '4'
  - '-4'
  - '6'
  respuesta: '2'
  solucion_pasos:
  - 'Paso 1: Sustituir con paréntesis: $f(-1) = (-1)^3 - 2(-1)^2 + 5$.'
  - 'Paso 2: Calcular potencias: $(-1)^3 = -1$ y $(-1)^2 = 1$.'
  - 'Paso 3: Realizar operaciones: $-1 - 2(1) + 5 = -1 - 2 + 5 = 2$.'
- titulo: 'Ejemplo 2: Expresión con fracción y raíz'
  enunciado: Halla $g(4)$ para $g(x) = \sqrt{3x + 4} - \frac{x}{2}$.
  alternativas:
  - '2'
  - '4'
  - '0'
  - '6'
  respuesta: '2'
  solucion_pasos:
  - 'Paso 1: Sustituir $x = 4$: $g(4) = \sqrt{3(4) + 4} - \frac{4}{2}$.'
  - 'Paso 2: Calcular dentro del radical: $\sqrt{12 + 4} = \sqrt{16} = 4$.'
  - 'Paso 3: Restar: $4 - 2 = 2$.'
- titulo: 'Ejemplo 3: Función valor absoluto'
  enunciado: Determina $h(-5)$ en $h(x) = |2x + 3| - 4$.
  alternativas:
  - '3'
  - '-11'
  - '11'
  - '-3'
  respuesta: '3'
  solucion_pasos:
  - 'Paso 1: Evaluar el interior: $2(-5) + 3 = -10 + 3 = -7$.'
  - 'Paso 2: Aplicar valor absoluto: $|-7| = 7$.'
  - 'Paso 3: Restar: $7 - 4 = 3$.'
- titulo: 'Ejemplo 4: Fracción algebraica con signo'
  enunciado: Calcula $f(-2)$ para $f(x) = \frac{6 - x}{x - 2}$.
  alternativas:
  - '-2'
  - '2'
  - '-1'
  - '4'
  respuesta: '-2'
  solucion_pasos:
  - 'Paso 1: Numerador: $6 - (-2) = 6 + 2 = 8$.'
  - 'Paso 2: Denominador: $-2 - 2 = -4$.'
  - 'Paso 3: Cociente: $\frac{8}{-4} = -2$.'
errores_frecuentes:
- Confundir la regla de signos de la suma con la regla de la multiplicación.
- Multiplicar antes de resolver las potencias.
- Olvidar simplificar las fracciones resultantes a su forma irreductible.
afirmaciones_verdaderas:
- Evaluar una función consiste en calcular la imagen correspondiente a una preimagen específica mediante sustitución aritmética.
- La sustitución de números negativos en potencias debe realizarse siempre entre paréntesis para preservar el signo correcto.
al_terminar_debes_poder: '**QUÉ:** Evaluar funciones algebraicas mediante sustitución numérica directa.


  **CÓMO:** Reemplazando la variable por constantes reales con paréntesis y aplicando la jerarquía formal de operaciones.


