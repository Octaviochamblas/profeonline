semantic_id: MAT.ALG.FUNCION_EVALUACION.VALORIZACION_FUNCIONAL
resumen_inicial: 'Evaluación de una función por sustitución numérica: conceptos, representación
  y propiedades en Evaluación de funciones.'
explicacion_simple: 'Evaluar una función es como seguir una receta: sustituyes el
  ingrediente (el número) en cada lugar donde aparece la variable, y sigues los pasos
  hasta obtener el resultado.'
explicacion_formal: '### Definición formal


  Sea $f$ una función dada por una expresión algebraica en la variable $x$. Evaluar
  $f$ en $x=a$ (con $a \in \text{Dom}(f)$) consiste en construir la expresión que
  resulta de reemplazar cada ocurrencia de $x$ por $a$ y simplificar aplicando las
  operaciones aritméticas en su orden jerárquico, obteniendo el número $f(a)$.


  ### Desarrollo didáctico


  El proceso tiene tres etapas: sustituir, aplicar jerarquía de operaciones, y simplificar.


  Si $f(x) = 3x^2 - 2x + 1$ y quieres $f(2)$: sustituyes $x$ por $2$ en cada lugar,
  obteniendo $3(2)^2 - 2(2) + 1$. Resuelves las potencias primero ($3(4)$), luego
  las multiplicaciones ($12 - 4$), y finalmente sumas: $12 - 4 + 1 = 9$.'
definiciones_clave: '- **Evaluación de una función por sustitución numérica**: Elemento
  central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a evaluación de una función por sustitución
  numérica.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a evaluación de una
    función por sustitución numérica.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a evaluación de una función por
    sustitución numérica.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
