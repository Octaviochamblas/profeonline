semantic_id: MAT.ALG.FUNCION_EVALUACION.VALORIZACION_FUNCIONAL
resumen_inicial: Evaluar una función por sustitución numérica consiste en reemplazar
  la variable independiente por un número dado y calcular el resultado.
explicacion_simple: 'Para evaluar una función $f(x)$ en un número particular (por
  ejemplo en $x = 3$):

  1. Tomamos la expresión de la función $f(x) = 4x - 5$.

  2. Reemplazamos cada letra $x$ por el número $3$ (usando paréntesis si es un número
  negativo o una fracción).

  3. Realizamos las operaciones aritméticas para encontrar el resultado final $f(3)
  = 4(3) - 5 = 12 - 5 = 7$.'
explicacion_formal: 'Dada la función $f: A \to B$ definida por la regla $f(x)$ y una
  constante $a \in \operatorname{Dom}(f)$, la **evaluación por sustitución** es la
  operación:


  $$f(a) = \left. f(x) \right|_{x = a} \in B$$


  **Desglose de la fórmula:**

  - Asignación puntual de la constante $a$ en lugar de la variable libre $x$, respetando
  la jerarquía de las operaciones algebraicas.'
definiciones_clave: '- **Evaluación / Valorización de funciones**: Sustitución directa
  de la variable $x$ por un valor constante para obtener la imagen asociada.

  - **Jerarquía de operaciones**: Orden correcto de cálculo (paréntesis, potencias,
  multiplicaciones/divisiones, sumas/restas).'
propiedades_relaciones: '- **Resultado único**: Por definición de función, sustituir
  un mismo valor $a$ entrega siempre la misma imagen $f(a)$.'
ejemplo_guiado:
  enunciado: Dada la función cuadrática $f(x) = 2x^2 - 3x + 1$, evalúa su valor numérico
    para $x = -2$.
  pasos:
  - 'Paso 1: Reemplazar cada ocurrencia de $x$ por el número $-2$ entre paréntesis:
    $f(-2) = 2(-2)^2 - 3(-2) + 1$.Paso 2: Resolver las potencias: $(-2)^2 = 4 \implies
    2(4) = 8$.Paso 3: Resolver las multiplicaciones respetando la regla de signos:
    $-3(-2) = +6$.Paso 4: Sumar los términos: $f(-2) = 8 + 6 + 1 = 15$.Paso 5: Concluir
    que para la preimagen $-2$, la imagen es $f(-2) = 15$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar la función $f(x) = 2x^2 - 3x + 1$ en $x = -2$, ¿cuál es el
    resultado numérico obtenido?
  choices:
  - text: $f(-2) = 15$
    is_correct: true
  - text: $f(-2) = 3$
    is_correct: false
  - text: $f(-2) = -1$
    is_correct: false
  - text: $f(-2) = 13$
    is_correct: false
  explanation: La alternativa correcta es '$f(-2) = 15$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué es indispensable utilizar paréntesis al sustituir el número negativo
    $-2$ en $x^2$?
  choices:
  - text: Porque $(-2)^2 = +4$ es positivo, mientras que sin paréntesis $-2^2 = -4$
      daría un resultado erróneo.
    is_correct: true
  - text: Porque los paréntesis transforman el número en una fracción.
    is_correct: false
  - text: Es solo un detalle estético sin impacto en el cálculo.
    is_correct: false
  - text: Porque la variable $x$ siempre debe ser positiva.
    is_correct: false
  explanation: La alternativa correcta es 'Porque $(-2)^2 = +4$ es positivo, mientras
    que sin paréntesis $-2^2 = -4$ daría un resultado erróneo.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la fórmula de la función sustituyendo la variable $x$ por un paréntesis
  vacío $(\cdot)$.'
- 'Paso 2: Colocar el número a evaluar dentro de cada paréntesis.'
- 'Paso 3: Calcular primero las potencias y raíces.'
- 'Paso 4: Calcular las multiplicaciones y divisiones respetando la ley de signos.'
- 'Paso 5: Realizar la suma o resta final.'
errores_correccion: '- **Error común:** Escribir $-2^2 = -4$ al evaluar $(-2)^2$.

  - **Cómo corregirlo:** La potencia par de un número negativo encerrado entre paréntesis
  es SIEMPRE positiva: $(-2)^2 = 4$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de evaluación de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de evaluación de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Evaluar una función consiste en reemplazar la preimagen x en la fórmula
    y calcular y?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de valorización funcional.
- titulo: ¿Se debe verificar que el número pertenezca al dominio antes de evaluar
    una raíz par?
  respuesta: Sí
  solucion_pasos:
  - Sí, para evitar raíces de números negativos en $\\mathbb{R}$.
errores_frecuentes:
- Olvidar usar paréntesis al sustituir números negativos al elevar a potencias pares.
- Confundir la búsqueda de una imagen (evaluar $f(a)$) con la búsqueda de una preimagen
  (igualar $f(x) = b$).
- Pensar que la notación $f(x+3)$ equivale simplemente a sumar $3$ al resultado final
  de $f(x)$.
- Intentar evaluar valores que no pertenecen al dominio provocando divisiones por
  cero o raíces pares negativas.
- Buscar preimágenes en el eje vertical $Y$ o imágenes en el eje horizontal $X$ al
  interpretar un gráfico.
afirmaciones_verdaderas:
- Para evaluar una función $f(x)$ se reemplaza la variable $x$ por el valor dado respetando
  la jerarquía operacional.
- Para hallar la preimagen $x$ correspondiente a una imagen $y_0$ se debe resolver
  la ecuación $f(x) = y_0$.
al_terminar_debes_poder: Al finalizar este recurso podrás evaluar funciones a partir
  de fórmulas, tablas o gráficos, y determinar preimágenes respetando las restricciones
  del dominio.
