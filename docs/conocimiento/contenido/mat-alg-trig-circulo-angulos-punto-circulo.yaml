semantic_id: MAT.ALG.TRIG_CIRCULO_ANGULOS.PUNTO_CIRCULO
resumen_inicial: 'Representación de cualquier punto $(x,y)$ sobre el círculo unitario mediante coordenadas cartesianas y su relación trigonométrica.'
explicacion_simple: |
  Cada punto $P(x,y)$ dibujado sobre la circunferencia del círculo unitario tiene dos coordenadas: una abscisa $x$ que indica cuánto se avanza a la izquierda o derecha, y una ordenada $y$ que indica cuánto se sube o baja. Si conectamos el origen $(0,0)$ con ese punto mediante una línea recta de longitud 1, el ángulo $\theta$ formado con el eje positivo de las $x$ determina de forma única la posición del punto. Por esta razón, la abscisa $x$ coincide exactamente con el coseno del ángulo ($\cos \theta$) y la ordenada $y$ con el seno ($\sin \theta$).
explicacion_formal: |
  ### Definición formal
  Todo punto $P(x,y)$ perteneciente al círculo unitario $\mathcal{C}$ en posición estándar asociada al ángulo orientado $\theta$ se representa biunívocamente en forma cartesiana y trigonométrica como:
  $$P(x,y) = (\cos \theta, \sin \theta)$$
  cumpliendo para todo $\theta \in \mathbb{R}$ la identidad pitagórica:
  $$x^2 + y^2 = (\cos \theta)^2 + (\sin \theta)^2 = 1$$

  ### Desglose simbólico
  - $\theta$: Ángulo de rotación medido desde el semieje positivo $X$.
  - $x = \cos \theta$: Proyección horizontal del segmento del radio unitario sobre el eje $X$.
  - $y = \sin \theta$: Proyección vertical del segmento del radio unitario sobre el eje $Y$.
  - $P(x,y)$: Par ordenado de números reales acotados por $-1 \le x \le 1$ y $-1 \le y \le 1$.

  ### Síntesis didáctica
  La representación $P(x,y) = (\cos \theta, \sin \theta)$ convierte las coordenadas del plano cartesiano en valores funcionales trigonométricos. Permite hallar el seno o el coseno observando directamente la ordenada o la abscisa del punto sobre la circunferencia unitaria.
definiciones_clave: |
  - **Coordenadas trigonométricas**: Expresión de un punto sobre el círculo unitario como $P(\cos \theta, \sin \theta)$.
  - **Proyección cartesiana**: Longitud con signo del cateto horizontal ($x$) o vertical ($y$) del triángulo rectángulo de hipotenusa $1$.
  - **Cotas de coordenadas**: Restricción $[-1, 1]$ que limita los valores posibles de $x$ e $y$ en el círculo unitario.
propiedades_relaciones: |
  - **Signos por cuadrante**:
    - Cuadrante I: $x > 0$, $y > 0 \implies \cos \theta > 0$, $\sin \theta > 0$.
    - Cuadrante II: $x < 0$, $y > 0 \implies \cos \theta < 0$, $\sin \theta > 0$.
    - Cuadrante III: $x < 0$, $y < 0 \implies \cos \theta < 0$, $\sin \theta < 0$.
    - Cuadrante IV: $x > 0$, $y < 0 \implies \cos \theta > 0$, $\sin \theta < 0$.
ejemplo_guiado:
  enunciado: 'Dado el ángulo $\theta = 120^\circ$ ubicado en el II cuadrante, sabiendo que $\cos(120^\circ) = -\frac{1}{2}$ y $\sin(120^\circ) = \frac{\sqrt{3}}{2}$, escribe las coordenadas del punto $P$ en el círculo unitario y verifica la condición de radio.'
  pasos:
    - 'Paso 1: Asignar la abscisa $x = \cos(120^\circ) = -\frac{1}{2}$ y la ordenada $y = \sin(120^\circ) = \frac{\sqrt{3}}{2}$.'
    - 'Paso 2: Escribir el par ordenado: $P\left(-\frac{1}{2}, \frac{\sqrt{3}}{2}\right)$.'
    - 'Paso 3: Elevar al cuadrado ambas coordenadas: $x^2 = \left(-\frac{1}{2}\right)^2 = \frac{1}{4}$ e $y^2 = \left(\frac{\sqrt{3}}{2}\right)^2 = \frac{3}{4}$.'
    - 'Paso 4: Sumar los resultados: $x^2 + y^2 = \frac{1}{4} + \frac{3}{4} = 1$. Se confirma que $P$ es un punto válido del círculo unitario.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el círculo unitario, ¿cómo se relacionan las coordenadas $(x,y)$ de un punto con el ángulo $\theta$?'
    choices:
      - {text: '$x = \cos \theta$ e $y = \sin \theta$', is_correct: true}
      - {text: '$x = \sin \theta$ e $y = \cos \theta$', is_correct: false}
      - {text: '$x = \tan \theta$ e $y = \sin \theta$', is_correct: false}
      - {text: '$x = 1 + \cos \theta$ e $y = 1 + \sin \theta$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \cos \theta$ e $y = \sin \theta$''. Por definición goniométrica, la abscisa es el coseno y la ordenada es el seno.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si un punto en el círculo unitario tiene coordenadas $P\left(-\frac{\sqrt{2}}{2}, \frac{\sqrt{2}}{2}\right)$, ¿cuál es el valor del coseno del ángulo correspondiente?'
    choices:
      - {text: '$-\frac{\sqrt{2}}{2}$', is_correct: true}
      - {text: '$\frac{\sqrt{2}}{2}$', is_correct: false}
      - {text: '1', is_correct: false}
      - {text: '$-1$', is_correct: false}
    explanation: 'La alternativa correcta es ''$-\frac{\sqrt{2}}{2}$''. El coseno corresponde directamente a la coordenada horizontal $x$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el ángulo $\theta$ en posición estándar.'
  - 'Paso 2: Calcular o consultar el valor del coseno ($\cos \theta$) y del seno ($\sin \theta$).'
  - 'Paso 3: Asignar la abscisa $x = \cos \theta$ y la ordenada $y = \sin \theta$.'
  - 'Paso 4: Formar el par ordenado cartesiano $P(x,y) = (\cos \theta, \sin \theta)$.'
errores_correccion: |
  - **Error 1:** Invertir los roles asignando $x = \sin \theta$ e $y = \cos \theta$. **Cómo corregirlo:** La proyección horizontal adyacente corresponde siempre al coseno ($x = \cos \theta$) y la proyección vertical opuesta corresponde al seno ($y = \sin \theta$).
  - **Error 2:** Asignar coordenadas mayores a $1$ o menores a $-1$ a un punto sobre el círculo unitario. **Cómo corregirlo:** Al ser el radio constante $r = 1$, las coordenadas están acotadas dentro del intervalo $[-1, 1]$.
ejemplos:
  - titulo: 'Coordenadas del ángulo de 0 grados'
    enunciado: '¿Cuáles son las coordenadas del punto sobre el círculo unitario para un ángulo de $\theta = 0^\circ$?'
    alternativas:
      - 'El punto $P(1, 0)$'
      - 'El punto $P(0, 1)$'
      - 'El punto $P(0, 0)$'
    respuesta: 'El punto $P(1, 0)$'
    solucion_pasos:
      - '1. Para $\theta = 0^\circ$, $\cos(0^\circ) = 1$ y $\sin(0^\circ) = 0$.'
      - '2. El par ordenado es $(\cos 0^\circ, \sin 0^\circ) = (1, 0)$.'
  - titulo: 'Coordenadas para 90 grados'
    enunciado: '¿Cuáles son las coordenadas del punto en el círculo unitario para $\theta = 90^\circ$?'
    alternativas:
      - 'El punto $P(0, 1)$'
      - 'El punto $P(1, 0)$'
      - 'El punto $P(-1, 0)$'
    respuesta: 'El punto $P(0, 1)$'
    solucion_pasos:
      - '1. Evaluamos $\cos(90^\circ) = 0$ y $\sin(90^\circ) = 1$.'
      - '2. El punto resulta $(\cos 90^\circ, \sin 90^\circ) = (0, 1)$.'
  - titulo: 'Ordenada negativa en el cuarto cuadrante'
    enunciado: 'Si un ángulo está en el IV cuadrante, ¿su ordenada $y = \sin \theta$ es negativa?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en el IV cuadrante las ordenadas se ubican por debajo del eje X, por lo que $y < 0$.'
  - titulo: 'Abscisa negativa en el segundo cuadrante'
    enunciado: 'Para un ángulo del II cuadrante, ¿su abscisa $x = \cos \theta$ es negativa?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en el II cuadrante las abscisas se ubican a la izquierda del eje Y, resultando $x < 0$.'
errores_frecuentes:
  - 'La afirmación de que la ordenada $y$ en el círculo unitario representa al coseno del ángulo.'
  - 'La afirmación de que la abscisa $x$ en el círculo unitario puede tomar el valor de $1.5$.'
  - 'La afirmación de que un ángulo del tercer cuadrante tiene ambas coordenadas $(x,y)$ positivas.'
  - 'La afirmación de que las coordenadas del punto dependen de la longitud del radio cuando este varía.'
  - 'La afirmación de que la suma de coordenadas $x + y$ de cualquier punto del círculo unitario siempre da $1$.'
afirmaciones_verdaderas:
  - 'Todo punto $P(x,y)$ del círculo unitario se expresa de forma única como $P(\cos \theta, \sin \theta)$.'
  - 'Las coordenadas $(x,y)$ de cualquier punto sobre el círculo unitario satisfacen la restricción $-1 \le x \le 1$ y $-1 \le y \le 1$.'
al_terminar_debes_poder: |
  QUÉ: Representar e interpretar cualquier punto del círculo unitario mediante sus componentes trigonométricas $(\cos \theta, \sin \theta)$.
  CÓMO: Asociar la abscisa $x$ al coseno y la ordenada $y$ al seno del ángulo en posición estándar.
