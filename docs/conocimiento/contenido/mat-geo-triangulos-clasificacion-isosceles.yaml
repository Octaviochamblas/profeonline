semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.ISOSCELES
resumen_inicial: El triángulo isósceles tiene dos lados de igual medida llamados lados
  congruentes y dos ángulos basales iguales opuestos a dichos lados.
explicacion_simple: Imagina la fachada del techo de una casa de dos aguas. Las dos
  caídas del techo miden lo mismo y los dos ángulos en la base del suelo son idénticos.
explicacion_formal: 'Un triángulo $\triangle ABC$ es **isósceles** si posee al menos
  dos lados congruentes ($a = b$). El lado desigual $c$ se denomina **base**, y los
  ángulos opuestos a los lados iguales son congruentes: $\alpha = \beta$.'
definiciones_clave: '- **Lados congruentes**: Los dos lados de igual medida en el
  triángulo isósceles.

  - **Ángulos basales**: Los dos ángulos de igual medida ubicados sobre la base del
  triángulo.'
propiedades_relaciones: '- **Igualdad de ángulos basales**: A lados iguales se oponen
  ángulos iguales (Teorema del Triángulo Isósceles).

  - **Eje de simetría**: La altura trazada a la base es simultáneamente bisectriz,
  mediatriz y mediana.'
ejemplo_guiado:
  enunciado: El techo de una vivienda forma un triángulo isósceles donde los dos ángulos
    en la base del suelo miden $59^\circ$ cada uno. Calcula la medida del ángulo superior
    en la cumbrera $\theta$.
  pasos:
  - 'Paso 1: Usar la propiedad de ángulos basales: los dos ángulos de la base son
    iguales a $59^\circ$.'
  - 'Paso 2: Sumar los dos ángulos basales: $59^\circ + 59^\circ = 118^\circ$.'
  - 'Paso 3: Restar a $180^\circ$ para despejar el ángulo superior: $\theta = 180^\circ
    - 118^\circ = 62^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: En un triángulo isósceles, ¿cuáles ángulos poseen exactamente la misma
    medida?
  choices:
  - text: Los dos ángulos basales opuestos a los lados iguales
    is_correct: true
  - text: Los tres ángulos interiores
    is_correct: false
  - text: El ángulo superior con uno de la base
    is_correct: false
  - text: Ninguno, todos son distintos
    is_correct: false
  explanation: La alternativa correcta es 'Los dos ángulos basales opuestos a los
    lados iguales'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si cada ángulo basal mide 59°, ¿cuánto mide el ángulo de la cumbrera θ?
  choices:
  - text: 62°
    is_correct: true
  - text: 59°
    is_correct: false
  - text: 118°
    is_correct: false
  - text: 90°
    is_correct: false
  explanation: La alternativa correcta es '62°', pues $180 - 2(59) = 62^\circ$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados y el teorema geométrico del concepto.'
- 'Paso 2: Plantear la ecuación algebraica o relación correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar su coherencia geométrica.'
errores_correccion: Evita confundir las propiedades de los lados con las de los ángulos
  interiores al clasificar la figura.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo dos ángulos interiores miden 59° y 42°, ¿cuánto mide
    el tercero?
  alternativas:
  - 79°
  - 101°
  - 90°
  respuesta: 79°
  solucion_pasos:
  - Despejar $x = 180 - (59 + 42) = 79^\circ$.
- titulo: Ejemplo 2
  enunciado: Si dos lados de un triángulo miden 46 cm y 63 cm, ¿cuál puede ser la
    medida del tercer lado?
  alternativas:
  - 107 cm
  - 114 cm
  - 0 cm
  respuesta: 107 cm
  solucion_pasos:
  - Por Desigualdad Triangular, el tercer lado debe ser menor que 109 cm.
- titulo: ¿La suma de los tres ángulos interiores de cualquier triángulo en el plano
    es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental e invariante de la geometría euclidiana.
- titulo: ¿Un triángulo puede tener dos ángulos rectos de 90° en su interior?
  respuesta: 'No'
  solucion_pasos:
  - No, porque 90° + 90° = 180°, dejando 0° para el tercer ángulo, lo cual imposibilita
    cerrar la figura.
errores_frecuentes:
- Declarar la suma de ángulos interiores (180°) con la suma de ángulos exteriores
  (360°).
- Afirmar que un triángulo isósceles tiene sus tres lados iguales (eso corresponde
  al equilátero).
- Declarar que cualquier trío de medidas de varillas puede formar un triángulo sin
  verificar la Desigualdad Triangular.
- Declarar los catetos con la hipotenusa en triángulos rectángulos orientados en distintas
  posiciones.
- Omitir que en un triángulo equilátero cada uno de sus tres ángulos interiores mide
  exactamente 60°.
afirmaciones_verdaderas:
- La suma de los ángulos interiores de todo triángulo en el plano es siempre igual
  a 180°.
- En todo triángulo rectángulo, la hipotenusa es el lado de mayor longitud opuesto
  al ángulo recto.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar y calcular las
  propiedades de triángulo isósceles como triángulo con dos lados de igual medida
  resolviendo problemas geométricos con rigurosidad.
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Propiedades de Triángulos.
estado: publicado
