semantic_id: MAT.ALG.EXPRESIONES.IDENTIFICACION_BINOMIO
resumen_inicial: 'Identificación de binomio: concepto y propiedades en Expresiones
  algebraicas y polinomios básicos.'
explicacion_simple: Si 'mono' es uno, 'bi' es dos. Bicicleta, binocular, bilingüe.
  y en álgebra, Binomio. Es el tren más corto posible que no viaja solo.
explicacion_formal: '### Definición formal


  Si fueran semejantes (ej: $2x + 3x$), se fusionarían en $5x$, siendo un monomio
  y perdiendo la categoría bi.


  ### Desarrollo didáctico


  Todo binomio tiene un único ''puente'' o separador principal (un signo $+$ o un
  signo $-$) libre en la mitad de la expresión, separando dos grandes bloques.

  - $a + b$ es un binomio.

  - $5x^3 - 8y^2$ es un binomio (el menos es el puente).

  - $\frac{x}{2} + 4$ es un binomio.


  *La trampa mortal:* ¿Es $3x + 5x$ un binomio? Visualmente tiene dos términos y un
  puente en medio. Pero CUIDADO. Los términos son semejantes. Antes de clasificar,
  hay que sumar: $3x + 5x = 8x$. En realidad es un **monomio** disfrazado. Para que
  sea un binomio real, los dos términos deben ser de especies diferentes.'
definiciones_clave: '- **Identificación de binomio**: Elemento fundamental del lenguaje
  algebraico.'
propiedades_relaciones: '- **Propiedades de Identificación de binomio**: Reglas de
  notación y clasificación en expresiones algebraicas y polinomios básicos.'
ejemplo_guiado:
  enunciado: Identifica o calcula los elementos correspondientes a identificación
    de binomio en una expresión dada.
  pasos:
  - Analizar la expresión algebraica dada.
  - Aplicar los criterios de identificación de binomio.
  - Efectuar la clasificación o cálculo de grados/coeficientes según corresponda.
  - Escribir la respuesta final de forma ordenada.
