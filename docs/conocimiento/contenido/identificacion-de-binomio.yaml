resumen_inicial: Un binomio es un polinomio compuesto estrictamente por exactamente
  dos términos monómicos no semejantes unidos por suma o resta.
explicacion_simple: Un binomio es un polinomio de 'dos partes' o dos términos (como
  $a + b$, $3x^2 - 5$ o $7xy - 2y^3$). Los dos términos deben ser distintos (no semejantes)
  para que no se puedan juntar en uno solo.
explicacion_formal: 'Un **Binomio** $B$ es la suma o resta de dos monomios no semejantes
  $T_1$ y $T_2$:


  $$B = T_1 + T_2 \quad \text{con } \text{Lit}(T_1) \neq \text{Lit}(T_2)$$


  > **Complemento didáctico:** El binomio es la estructura base para los productos
  notables como el cuadrado de binomio $(a+b)^2$ y la suma por diferencia.'
definiciones_clave: '- **Binomio**: Polinomio formado por exactamente 2 términos no
  semejantes.'
propiedades_relaciones: '- **Productos notables**: Estructura de origen para $(a+b)^2
  = a^2 + 2ab + b^2$.'
ejemplo_guiado:
  enunciado: Verifique si $P(x) = 5x^3 - 2x^3$ y $Q(x) = 4x^2 - 9$ son binomios.
  pasos:
  - 'Paso 1: Analizar $P(x) = 5x^3 - 2x^3$: sus términos son semejantes $\to$ se reducen
    a $3x^3$ (1 solo término $\to$ monomio).'
  - 'Paso 2: Analizar $Q(x) = 4x^2 - 9$: posee 2 términos no semejantes ($4x^2$ y
    $-9$) $\to$ binomio.'
  - 'Conclusión: $P(x)$ se reduce a monomio; únicamente $Q(x)$ es un binomio auténtico.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición deben cumplir los dos términos de un binomio?
  choices:
  - text: Deben ser términos monómicos no semejantes para no poder reducirse a un
      solo término
    is_correct: true
  - text: Deben tener el mismo coeficiente numérico
    is_correct: false
  - text: Deben ser ambos positivos
    is_correct: false
  - text: Deben ser números impares
    is_correct: false
  explanation: La alternativa correcta es 'Deben ser términos monómicos no semejantes
    para no poder reducirse a un solo término'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué 5x^3 - 2x^3 NO fue considerado un binomio?
  choices:
  - text: Porque al ser términos semejantes se reducen a un solo término (3x^3)
    is_correct: true
  - text: Porque el exponente es 3
    is_correct: false
  - text: Porque tiene coeficientes 5 y -2
    is_correct: false
  - text: Porque carece de constante
    is_correct: false
  explanation: La alternativa correcta es 'Porque al ser términos semejantes se reducen
    a un solo término (3x^3)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Simplificar y reducir los términos semejantes si existieran.'
- 'Paso 2: Contar los términos resultantes.'
- 'Paso 3: Si quedan exactamente 2 términos, declarar la expresión como binomio.'
errores_correccion: '- **Error 1: Afirmar que $3x + 2x$ es un binomio.** **Cómo corregirlo:**
  Al sumar $3x + 2x = 5x$, la expresión se reduce a un monomio de 1 solo término.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes expresiones es un binomio?
  alternativas:
  - x^2 - 25
  - 4x^3
  - a + b + c
  - 2x + 3x
  respuesta: x^2 - 25
  solucion_pasos:
  - 1. x^2 - 25 posee 2 términos no semejantes. Es un binomio.
- titulo: Ejemplo 2
  enunciado: ¿Es 7ab + 3a^2b un binomio?
  alternativas:
  - Sí, porque tiene 2 términos no semejantes
  - No, es un monomio
  - No, es un trinomio
  - Indeterminado
  respuesta: Sí, porque tiene 2 términos no semejantes
  solucion_pasos:
  - 1. 7ab y 3a^2b tienen distintas partes literales. Al no poder sumarse, forman
    un binomio.
- titulo: ¿Es la diferencia de cuadrados a^2 - b^2 un binomio?
  respuesta: Sí
  solucion_pasos:
  - Sí, consta de 2 términos monómicos no semejantes.
- titulo: ¿Es la expresión 8y - 3y un binomio?
  respuesta: 'No'
  solucion_pasos:
  - No, al reducir 8y - 3y = 5y se convierte en un monomio.
errores_frecuentes:
- Declarar como binomio a expresiones de dos términos semejantes sin reducirlos previamente.
- Declarar un binomio de dos términos con un trinomio de tres términos.
- Declarar que los dos términos de un binomio deben llevar obligatoriamente el mismo
  signo.
- Declarar que una multiplicación de dos factores (como 2x) es un binomio.
- Declarar los componentes de un monomio fraccionario con dos términos de un binomio.
afirmaciones_verdaderas:
- Un binomio es un polinomio formado por exactamente dos términos no semejantes.
- Al reducir términos semejantes en un binomio no debe ser posible fusionarlos en
  un monomio.
al_terminar_debes_poder: Al terminar serás capaz de identificar un binomio reduciendo
  previamente cualquier término semejante y contando exactamente dos términos resultantes.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Polinomios.
