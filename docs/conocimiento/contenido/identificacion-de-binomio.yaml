semantic_id: MAT.ALG.POLINOMIOS.IDENTIFICACION_BINOMIO
resumen_inicial: 'Un binomio es un polinomio compuesto por la suma o sustracción de exactamente dos términos algebraicos no semejantes.'
explicacion_simple: |
  - Un **binomio** es un polinomio de **exactamente $2$ términos** que no se pueden simplificar más.
  - Ejemplos clásicos:
    - $2x + 5$ (binomio lineal).
    - $x^2 - y^2$ (diferencia de cuadrados).
    - $3a^3b - 7ab^2$.
  - **Cuidado con los términos semejantes:**
    - Si tenemos $4x + 3x$, parece tener $2$ términos, pero al sumarlos queda $7x$, que es un **monomio**, ¡no un binomio!
    - Para ser binomio, sus dos partes deben ser **no semejantes** (no se pueden juntar en un solo término).

  ![Identificación de Binomio](/static/img/nodos/identificacion-de-binomio-intro.svg)
explicacion_formal: |
  ### Definición formal
  Un **binomio** es un elemento $B \in \mathbb{K}[x_1, \dots, x_n]$ expresable de manera irreducible como la suma de exactamente dos monomios no nulos no semejantes:

  $$B = T_1 + T_2 = c_1 X_1 + c_2 X_2, \quad c_1, c_2 \neq 0, \; X_1 \not\equiv X_2$$

  ### Estructuras binomiales notables
  1. **Binomio lineal canónico:** $P(x) = ax + b$ ($a \neq 0$).
  2. **Diferencia de cuadrados:** $x^2 - a^2 = (x - a)(x + a)$.
  3. **Binomio de Newton:** $(a + b)^n = \sum_{k=0}^n \binom{n}{k} a^{n-k} b^k$.
definiciones_clave: |
  - **Binomio**: Polinomio formado por exactamente dos términos irreducibles no semejantes.
  - **Términos no semejantes**: Monomios que difieren en sus variables o en sus exponentes.
  - **Binomio homogéneo**: Binomio donde ambos términos poseen exactamente el mismo grado absoluto.
propiedades_relaciones: |
  - **Producto de binomios conjugados**: $(a + b)(a - b) = a^2 - b^2$ (origina una diferencia de dos cuadrados).
  - **Cuadrado de un binomio**: $(a \pm b)^2 = a^2 \pm 2ab + b^2$ (origina un trinomio cuadrado perfecto).
ejemplo_guiado:
  enunciado: 'Determina si la expresión $E = 5x^2y - 2xy + 3x^2y$ es un binomio tras reducir sus términos semejantes.'
  imagen: '/static/img/nodos/identificacion-de-binomio-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los términos semejantes presentes: $5x^2y$ y $3x^2y$ tienen la misma parte literal $x^2y$.'
    - 'Paso 2: Sumamos los coeficientes semejantes: $5x^2y + 3x^2y = 8x^2y$.'
    - 'Paso 3: Reescribimos la expresión reducida completa: **$8x^2y - 2xy$**.'
    - 'Paso 4: Contamos los términos irreducibles finales: quedan exactamente 2 términos no semejantes ($8x^2y$ y $-2xy$).'
    - 'Paso 5: Conclusión: La expresión reducida es **estrictamente un binomio**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes expresiones es formalmente un binomio?'
    choices:
      - text: '$3x^4 - 7y^2$'
        is_correct: true
      - text: '$4x^2 + 5x^2$'
        is_correct: false
      - text: '$x^3 - 2x + 1$'
        is_correct: false
      - text: '$9a^2b^3$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$3x^4 - 7y^2$''. Contiene exactamente dos monomios no semejantes.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al simplificar la expresión $6a + 4b - 2a - 4b$, ¿se obtiene un binomio?'
    choices:
      - text: 'No, porque al reducir queda $4a$, que es un monomio de un solo término'
        is_correct: true
      - text: 'Sí, porque originalmente tenía 4 términos'
        is_correct: false
      - text: 'Sí, porque quedan las variables a y b'
        is_correct: false
      - text: 'Se transforma en un trinomio'
        is_correct: false
    explanation: 'La alternativa correcta es ''No, porque al reducir queda $4a$, que es un monomio de un solo término''. $4b - 4b = 0$, por lo que solo subsiste $4a$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar la expresión y agrupar todos los términos que posean idéntica parte literal.'
  - 'Paso 2: Reducir los términos semejantes sumando o restando sus coeficientes numéricos.'
  - 'Paso 3: Contar el número de términos no nulos resultantes.'
  - 'Paso 4: Si el total de términos irreducibles es exactamente dos, clasificar como binomio.'
errores_correccion: |
  - **Error 1:** Contar términos antes de reducir semejantes ($5x + 3x$ clasificado erróneamente como binomio). **Cómo corregirlo:** La clasificación se realiza **siempre sobre la forma reducida**: $5x + 3x = 8x$ (monomio).
  - **Error 2:** Clasificar $\frac{a+b}{c}$ como binomio. **Cómo corregirlo:** Es una fracción algebraica que equivale a $\frac{a}{c} + \frac{b}{c}$ solo si $c$ es constante no nula.
ejemplos:
  - titulo: 'Reducción a binomio'
    enunciado: '¿Cuál es la forma reducida de $7x^2 - 3x + 2x^2$ y a qué tipo de polinomio corresponde?'
    alternativas:
      - '$9x^2 - 3x$, correspondiente a un binomio'
      - '$6x^3$, correspondiente a un monomio'
      - '$9x^2 - 3x + 1$, correspondiente a un trinomio'
    respuesta: '$9x^2 - 3x$, correspondiente a un binomio'
    solucion_pasos:
      - '1. Se agrupan semejantes: $7x^2 + 2x^2 = 9x^2$.'
      - '2. La expresión reducida es $9x^2 - 3x$.'
      - '3. Tiene 2 términos no semejantes $\implies$ es un binomio.'
  - titulo: 'Binomio cuadrático homogéneo'
    enunciado: '¿Es $4x^2 - 9y^2$ un binomio homogéneo de segundo grado?'
    alternativas:
      - 'Sí, porque tiene 2 términos y ambos tienen grado 2'
      - 'No, porque las variables son distintas'
      - 'No, es un monomio'
    respuesta: 'Sí, porque tiene 2 términos y ambos tienen grado 2'
    solucion_pasos:
      - '1. Tiene 2 términos no semejantes: $4x^2$ y $-9y^2$.'
      - '2. Grado de $4x^2 = 2$ y grado de $-9y^2 = 2$.'
      - '3. Es un binomio homogéneo de grado 2.'
  - titulo: 'Binomio con término constante'
    enunciado: '¿Es la expresión $3x + 8$ un binomio algebraico lineal?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Tiene un término variable ($3x$) y un término constante ($8$).'
      - '2. Son 2 términos no semejantes de grado 1.'
  - titulo: 'Anulación de términos'
    enunciado: '¿Es la expresión $x^2 + 5 - x^2$ un binomio?'
    respuesta: 'No'
    solucion_pasos:
      - '1. $x^2 - x^2 = 0$.'
      - '2. La expresión se reduce al número constante $5$ (un monomio).'
errores_frecuentes:
  - 'Contar los términos de la expresión sin haber reducido previamente los términos semejantes.'
  - 'Confundir el cuadrado de un binomio $(a+b)^2$ con un binomio de 2 términos (su desarrollo es un trinomio).'
  - 'Creer que un binomio no puede tener términos independientes constantes.'
  - 'Clasificar expresiones racionales con denominadores variables como binomios estándar.'
  - 'Suponer que los dos términos de un binomio deben tener obligatoriamente el mismo grado.'
afirmaciones_verdaderas:
  - 'Un binomio es un polinomio compuesto por exactamente dos términos algebraicos no semejantes.'
  - 'Todo binomio de la forma $ax + b$ con $a \neq 0$ representa un polinomio lineal de primer grado.'
al_terminar_debes_poder: |
  ![Resumen de Binomio](/static/img/nodos/identificacion-de-binomio-resumen.svg)

  QUÉ: Identificar, simplificar y clasificar binomios algebraicos en una o más variables tras la reducción completa de términos semejantes.
  CÓMO: Reduciendo monomios semejantes y verificando la presencia de exactamente dos términos irreducibles ($B = T_1 + T_2$).
