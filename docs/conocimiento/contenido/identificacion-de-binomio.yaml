procedimiento:
- 'Paso 1: Simplifica la expresión sumando todos los términos semejantes si los hay.'
- 'Paso 2: Cuenta cuántos términos distintos te quedan en la versión final irreductible.'
- 'Paso 3: Si te quedan exactamente dos, y están unidos por un +, o por un -, es un
  binomio.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar identificación de binomio.
ejemplos:
- titulo: El puente
  enunciado: Clasifica la expresión 4a^2b + 5ab^2
  solucion_pasos:
  - Verificamos si son semejantes. El primero es especie a^2b, el segundo es ab^2.
    No se pueden sumar.
  - Contamos los términos separados por el '+'. Hay 1 y 2.
  - La clasificación es Binomio.
- titulo: En una evaluación, se pide dar un ejemplo de binomio de grado cinco. Un
    estudiante escribe $
  enunciado: 'En una evaluación, se pide dar un ejemplo de binomio de grado cinco.
    Un estudiante escribe $3x^5y^5 + 2x^5y^5$. El profesor tacha la respuesta e indica
    puntaje cero. ¿Por qué la respuesta es conceptualmente errónea para la pregunta?
    (v1)


    Opciones: A) Porque la expresión del estudiante es reducible a $5x^5y^5$, lo cual
    es un monomio, no un binomio. · B) Porque el grado absoluto es diez ($5+5$), no
    cinco. · C) Ambas razones A y B contribuyen a que el ejemplo sea incorrecto. ·
    D) El profesor se equivocó, el estudiante escribió un binomio válido.'
  solucion_pasos:
  - 'A: Es un monomio disfrazado ($5x^5y^5$). B: El grado de ese monomio es 10, no
    5. Doble error.'
  - 'Respuesta: Ambas razones A y B contribuyen a que el ejemplo sea incorrecto.'
- titulo: 'Respecto de «Identificación de binomio»: ¿La siguiente formulación es correcta?
    «Un **Binomi'
  enunciado: 'Respecto de «Identificación de binomio»: ¿La siguiente formulación es
    correcta? «Un **Binomio** es un polinomio formado por la suma o diferencia de
    **exactamente dos términos** algebraicos que no son semejantes entre sí»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un **Binomio** es un polinomio
    formado por la suma o diferencia de **exactamente dos términos** algebraicos que
    no son semejantes entre sí.'
- titulo: 'Respecto de «Identificación de binomio»: ¿La siguiente conclusión es correcta?
    «Llamar binom'
  enunciado: 'Respecto de «Identificación de binomio»: ¿La siguiente conclusión es
    correcta? «Llamar binomio a expresiones reducibles como $x + x$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un **Binomio** es un polinomio
    formado por la suma o diferencia de **exactamente dos términos** algebraicos que
    no son semejantes entre sí.'
errores_frecuentes:
- Llamar binomio a expresiones reducibles como $x + x$.
- Creer que una división separa términos y decir que $\frac{a}{b}$ es un binomio (es
  un monomio).
- Para «¿Qué exigencia fundamental, más allá del conteo visual, debe cumplir una expresión
  de dos componentes separados por una adición para ser clasificada definitivamente
  como un Binomio algebraico? (v1)», la respuesta correcta es Ambos componentes deben
  ser positivos.
- Ambos componentes deben tener distintas letras, no importa el exponente.
- El primer término debe tener un grado mayor que el segundo.
afirmaciones_verdaderas:
- La notación de identificación de binomio sigue las convenciones del lenguaje algebraico.
al_terminar_debes_ponder: Identificar y operar con conceptos relativos a identificación
