resumen_inicial: 'Identificación de un triángulo notable 30°-60°-90° a partir de sus
  ángulos: conceptos, teoremas, propiedades geométricas y cálculo en Perímetros, Áreas
  y Teoremas.'
explicacion_simple: El segundo triángulo notable más usado es el 30°-60°-90°, que
  a diferencia del 45-45-90, tiene sus tres ángulos distintos entre sí.
explicacion_formal: '![Triángulo notable 30°-60°-90°](/static/img/geometria/areas-pitagoras/notables-identificacion-30-60-90.svg)


  ### Definición formal


  Un triángulo 30°-60°-90° tiene un ángulo recto (90°) y sus dos ángulos agudos son
  de 30° y 60°, distintos entre sí (a diferencia del 45-45-90).


  ### Desarrollo didáctico


  Este triángulo se obtiene, por ejemplo, al trazar la altura de un triángulo equilátero:
  se forman dos triángulos rectángulos con ángulos 30°, 60° y 90°.'
