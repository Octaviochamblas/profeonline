ejemplo_guiado:
  enunciado: Para analizar identificación de un triángulo notable 30°-60°-90° a partir
    de sus ángulos, considera un ángulo $\alpha = 130^\circ$ ubicado en la posición
    dada. Determina el valor de la medida asociada sabiendo que $x + 1137^\circ =
    130^\circ$.
  pasos:
  - Identificar la propiedad de identificación de un triángulo notable 30°-60°-90°
    a partir de sus ángulos referida a $\alpha = 130^\circ$.
  - 'Plantear la ecuación de cálculo: $x + 1137 = 130 \implies x = 130 - 1137$.'
  - Concluir que la medida calculada para identificación de un triángulo notable 30°-60°-90°
    a partir de sus ángulos es $x = -1007^\circ$.
