semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.CRECIMIENTO_BASE_MAYOR_UNO
resumen_inicial: El análisis del crecimiento exponencial para bases mayores que uno ($b > 1$) demuestra que la función $f(x) = b^x$ es estrictamente creciente y convexa en todo $\mathbb{R}$, con asíntota horizontal $y = 0$ hacia $-\infty$ y crecimiento superlineal divergente hacia $+\infty$.
explicacion_simple: "![El análisis del crecimiento exponencial para bases mayores que uno ($b > 1$) demuestra que la función $f(x) = b^x$ es estrictamente creciente y convexa en todo $\\mathbb{R}$, con asíntota horizontal $y = 0$ hacia $-\\infty$ y crecimiento superlineal divergente hacia $+\\infty$](/static/img/nodos/analisis-del-crecimiento-exponencial-para-bases-mayores-que-uno-intro.svg)\n\n\nCuando la base es **mayor que 1** (como $2^x, 3^x, (1,5)^x$), la función describe un **crecimiento acelerado**:\n\n- **¿Cómo es su forma de izquierda a derecha?**\n  - A la **izquierda** ($x$ muy negativo): La curva roza el suelo ($y = 0$), pegada al eje $X$ como una asíntota horizontal.\n  - En el **centro** ($x = 0$): Cruza obligatoriamente por el punto **$(0, 1)$**.\n  - A la **derecha** ($x$ positivo): Se dispara hacia arriba verticalmente cada vez más rápido ($\\nearrow$), superando a cualquier recta o polinomio."
explicacion_formal: "Sea $f: \\mathbb{R} \\to \\mathbb{R}^+$ con $f(x) = b^x$ y $b > 1$. El comportamiento analítico global se rige por:\n\n1. **Monotonía estricta**: Como $\\ln(b) > 0$, la primera derivada $f'(x) = b^x \\ln(b) > 0$ para todo $x \\in \\mathbb{R}$, garantizando que $x_1 < x_2 \\implies b^{x_1} < b^{x_2}$.\n2. **Convexidad estricta**: La segunda derivada $f''(x) = b^x (\\ln(b))^2 > 0$ en todo $\\mathbb{R}$, asegurando que la curva siempre es cóncava hacia arriba (convexa).\n3. **Límites en el infinito**:\n   $$\\lim_{x \\to -\\infty} b^x = 0 \\implies \\mathcal{A}_H: y = 0 \\quad \\land \\quad \\lim_{x \\to +\\infty} b^x = +\\infty$$"
definiciones_clave: '- **Crecimiento superlineal**: Crecimiento cuya tasa relativa porcentual es constante y cuya derivada crece proporcionalmente a la propia función.

  - **Convexidad global**: Propiedad geométrica donde cualquier cuerda secante se ubica por encima de la curva.'
propiedades_relaciones: '- **Jerarquía de crecimiento**: Si $b_2 > b_1 > 1$, entonces $b_2^x > b_1^x$ para $x > 0$, y $b_2^x < b_1^x$ para $x < 0$.

  - **Inyectividad y biyectividad**: Al ser estrictamente monótona, es una biyección continua de $\mathbb{R}$ en $]0, +\infty[$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis del crecimiento exponencial para bases mayores que uno ($b > 1$) demuestra que la función $f(x) = b^x$ es estrictamente creciente y convexa en todo $\mathbb{R}$, con asíntota horizontal $y = 0$ hacia $-\infty$ y crecimiento superlineal divergente hacia $+\infty$](/static/img/nodos/analisis-del-crecimiento-exponencial-para-bases-mayores-que-uno-ejemplos.svg)



    Compara analítica y gráficamente las funciones $f(x) = 2^x$ y $g(x) = 4^x$ evaluando en $x = -1, 0, 1, 2$.'
  pasos:
  - 'Paso 1: Evaluar $f(x) = 2^x$:

    - $f(-1) = 0{,}5, \; f(0) = 1, \; f(1) = 2, \; f(2) = 4$.'
  - 'Paso 2: Evaluar $g(x) = 4^x$:

    - $g(-1) = 0{,}25, \; g(0) = 1, \; g(1) = 4, \; g(2) = 16$.'
  - 'Paso 3: Analizar la comparación:

    - Ambas pasan por $(0, 1)$ y tienen asíntota horizontal $y = 0$ hacia $-\infty$.

    - Para $x > 0$, $4^x > 2^x$ (la base 4 crece 4 veces más empinada).

    - Para $x < 0$, $4^{-1} < 2^{-1}$ ($4^x$ se aproxima más rápido al eje $X$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Hacia qué extremo del eje X la función f(x) = 3ˣ se aproxima asintóticamente a la recta y = 0?
  choices:
  - text: Hacia el infinito negativo (x → -∞)
    is_correct: true
  - text: Hacia el infinito positivo (x → +∞)
    is_correct: false
  - text: En ambos extremos
    is_correct: false
  - text: Nunca se aproxima
    is_correct: false
  explanation: La alternativa correcta es 'Hacia el infinito negativo (x → -∞)'. Cuando $x \to -\infty$, $3^x \to 0$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para x > 0, si comparamos f(x) = 5ˣ y g(x) = 2ˣ, ¿cuál de las dos gráficas se encuentra más arriba?
  choices:
  - text: f(x) = 5ˣ (a mayor base b > 1, mayor rapidez de crecimiento)
    is_correct: true
  - text: g(x) = 2ˣ
    is_correct: false
  - text: Son idénticas
    is_correct: false
  - text: Depende de si x es entero
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = 5ˣ (a mayor base b > 1, mayor rapidez de crecimiento)'. Para $x = 2$, $5^2 = 25 > 2^2 = 4$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que la base cumpla $b > 1$.'
- 'Paso 2: Confirmar que la función es estrictamente creciente ($\nearrow$) en todo $\mathbb{R}$.'
- 'Paso 3: Trazar el intercepto canónico en $(0, 1)$.'
- 'Paso 4: Dibujar la aproximación asintótica a $y = 0$ hacia la izquierda y el despegue exponencial hacia la derecha.'
errores_correccion: '- **Error común:** Creer que la gráfica toca el eje $X$ para valores muy negativos de $x$.

  - **Cómo corregirlo:** La distancia se hace infinitesimalmente pequeña pero **nunca llega a valer cero ($b^x > 0$)**.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de crecimiento'
  enunciado: ¿Cuál de las siguientes funciones es estrictamente creciente?
  alternativas:
  - f(x) = (1,8)ˣ
  - f(x) = (0,8)ˣ
  - f(x) = (1/3)ˣ
  - f(x) = (0,99)ˣ
  respuesta: f(x) = (1,8)ˣ
  solucion_pasos:
  - 'Paso 1: $b = 1{,}8 > 1 \implies$ estrictamente creciente.'
- titulo: 'Ejemplo 2: Límite hacia -infinito'
  enunciado: En $f(x) = 7^x$, ¿cuánto vale el límite cuando $x \to -\infty$?
  alternativas:
  - '0'
  - -infinito
  - +infinito
  - '1'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $\lim_{x \to -\infty} 7^x = 0$.'
- titulo: 'Ejemplo 3: Comparación en x negativo'
  enunciado: 'Si $x = -2$, ¿cuál es mayor: $2^x$ o $5^x$?'
  alternativas:
  - 2ˣ (porque 2⁻² = 1/4 > 5⁻² = 1/25)
  - 5ˣ
  - Son iguales
  - Ninguna
  respuesta: 2ˣ (porque 2⁻² = 1/4 > 5⁻² = 1/25)
  solucion_pasos:
  - 'Paso 1: $1/4 = 0{,}25 > 1/25 = 0{,}04 \implies 2^{-2} > 5^{-2}$.'
- titulo: 'Ejemplo 4: Punto de cruce universal'
  enunciado: ¿En qué punto se cruzan todas las funciones crecientes del tipo $y = b^x$ con $b > 1$?
  alternativas:
  - (0, 1)
  - (1, 0)
  - (0, 0)
  - (1, b)
  respuesta: (0, 1)
  solucion_pasos:
  - 'Paso 1: $b^0 = 1$ para toda base $b \implies (0, 1)$.'
errores_frecuentes:
- Confundir la asíntota en -infinito con una asíntota en +infinito.
- Asumir que mayor base significa siempre mayor valor en todo ℝ (en x < 0 es menor).
- Creer que la función exponencial creciente tiene un punto de inflexión.
afirmaciones_verdaderas:
- Para b > 1, la función f(x) = bˣ es estrictamente creciente en todo su dominio real.
- La gráfica de una exponencial con b > 1 tiene asíntota horizontal y = 0 cuando x tiende a -∞.
al_terminar_debes_poder: '**QUÉ:** Analizar y caracterizar el crecimiento exponencial para bases b > 1.


  **CÓMO:** Demostrando su monotonía creciente, convexidad y comportamiento asintótico hacia -∞.


