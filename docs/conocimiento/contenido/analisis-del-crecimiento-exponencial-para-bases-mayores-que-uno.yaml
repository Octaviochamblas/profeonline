semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.CRECIMIENTO_BASE_MAYOR_UNO
resumen_inicial: El crecimiento exponencial ocurre cuando la base cumple $b > 1$, provocando que la curva aumente con aceleración hacia $+\infty$.
explicacion_simple: |
  Cuando la base de una función exponencial es **mayor que uno ($b > 1$)**, como $b = 2$, $b = 3$ o $b = 1.5$, la función experimenta un **crecimiento acelerado**:

  - **Por la izquierda ($x \to -\infty$)**: La gráfica viene casi horizontal pegada al eje X (aproximándose a $y = 0$).
  - **En el centro ($x = 0$)**: Pasa por el punto $(0, a)$.
  - **Por la derecha ($x \to +\infty$)**: La curva **se dispara muy rápidamente hacia arriba**, creciendo más rápido que cualquier función polinómica o cuadrática.
explicacion_formal: |
  Dada la función exponencial $f(x) = a \cdot b^x$ sobre $\mathbb{R}$ con $a > 0$ y $b > 1$, la condición $b > 1$ garantiza la **estricta monotonía creciente y la concavidad positiva** de la curva sobre todo el eje real:

  **Propiedades analíticas del crecimiento exponencial ($b > 1$):**
  1. **Monotonía Creciente:**
     $$\forall x_1, x_2 \in \mathbb{R}, \, x_1 < x_2 \implies b^{x_1} < b^{x_2}$$
  2. **Comportamiento Asintótico y Limítrofe:**
     $$\lim_{x \to -\infty} f(x) = 0^+ \quad \text{y} \quad \lim_{x \to +\infty} f(x) = +\infty$$
  3. **Tasa de Variación Acelerada:** La derivada primera $f'(x) = a \cdot \ln(b) \cdot b^x > 0$ crece exponencialmente con $x$.
definiciones_clave: |
  - **Crecimiento exponencial**: Comportamiento de una función $f(x) = a \cdot b^x$ con $b > 1$ caracterizado por un incremento multiplicativo acelerado a medida que $x$ aumenta.
propiedades_relaciones: |
  - **Dominancia asintótica**: Para $b > 1$, la función exponencial $b^x$ termina superando eventualmente a cualquier potencia de la forma $x^n$ para valores suficientemente grandes de $x$.
ejemplo_guiado:
  enunciado: 'Analiza el crecimiento de la función $f(x) = 4^x$ evaluando en $x = -1$, $x = 0$, $x = 1$ y $x = 3$.'
  pasos:
    - 'Paso 1: Identificar la base $b = 4$. Como $4 > 1$, la función es estrictamente creciente.'
    - 'Paso 2: Evaluar en $x = -1 \implies f(-1) = 4^{-1} = 0.25$.'
    - 'Paso 3: Evaluar en $x = 0 \implies f(0) = 4^0 = 1$.'
    - 'Paso 4: Evaluar en $x = 1 \implies f(1) = 4^1 = 4$ y en $x = 3 \implies f(3) = 4^3 = 64$. Observar el salto acelerado de 1 a 4 y luego a 64.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Para una función exponencial $f(x) = b^x$ con base $b = 2.5$, ¿qué ocurre con el valor de $y$ a medida que $x$ tiende hacia $+\infty$?'
    choices:
      - {text: 'El valor de $y$ crece sin límite hacia el infinito positivo ($+\infty$)', is_correct: true}
      - {text: 'El valor de $y$ se aproxima asintóticamente a cero.', is_correct: false}
      - {text: 'El valor de $y$ se estabiliza en $y = 2.5$.', is_correct: false}
      - {text: 'El valor de $y$ decrece hacia $-\infty$.', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor de $y$ crece sin límite hacia el infinito positivo ($+\infty$)''. Al ser $b > 1$, $\lim_{x \to +\infty} b^x = +\infty$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes expresiones representa una función exponencial de crecimiento acelerado?'
    choices:
      - {text: '$f(x) = (7/5)^x$', is_correct: true}
      - {text: '$f(x) = (5/7)^x$.', is_correct: false}
      - {text: '$f(x) = (0.9)^x$.', is_correct: false}
      - {text: '$f(x) = 1^x$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = (7/5)^x$''. $7/5 = 1.4 > 1$, lo que genera crecimiento exponencial.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la constante de la base $b$ en la función $f(x) = a \cdot b^x$.'
  - 'Paso 2: Comprobar la condición $b > 1$.'
  - 'Paso 3: Verificar que el coeficiente $a > 0$ mantenga la concavidad positiva.'
  - 'Paso 4: Trazar o describir la curva viniendo asintóticamente de $y = 0$ por la izquierda y subiendo velozmente a $+\infty$ por la derecha.'
errores_correccion: |
  - **Error común:** Pensar que la curva crece a ritmo constante como una recta.
  - **Cómo corregirlo:** En la función exponencial el crecimiento **SE ACELERA EN CADA PASO**: no suma una cantidad fija, sino que **MULTIPLICA** por la base $b$ en cada incremento de $x$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Crecimiento en base 5.
    alternativas:
      - 'Función estrictamente creciente, b = 5 > 1'
      - 'Función decreciente'
      - 'Función acotada superiormente'
    respuesta: 'Función estrictamente creciente, b = 5 > 1'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Crecimiento en base 1.1.
    alternativas:
      - 'Función creciente (1.1 > 1)'
      - 'Función constante'
      - 'Función decreciente por ser decimal'
    respuesta: 'Función creciente (1.1 > 1)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 3^x$, la afirmación de que para valores grandes de $x$ la curva se vuelve horizontal.'
  - 'La confusión entre el crecimiento exponencial ($b > 1$) y el crecimiento lineal de pendiente positiva.'
  - 'La afirmación de que cuando la base es cercana a 1 (ej. $b = 1.01$), la función pierde su carácter exponencial.'
  - 'La omisión del comportamiento asintótico hacia $y = 0$ en el extremo izquierdo $x \to -\infty$.'
  - 'La consideración de que el crecimiento exponencial se detiene al cruzar el eje Y.'
afirmaciones_verdaderas:
  - 'Si la base satisface $b > 1$, la función exponencial $f(x) = b^x$ es estrictamente creciente en todo su dominio real.'
  - 'En el crecimiento exponencial ($b > 1$), la curva tiene como asíntota horizontal al eje X ($y = 0$) cuando $x \to -\infty$.'
al_terminar_debes_poder: |
  QUÉ: Caracterizar y graficar el crecimiento exponencial para bases $b > 1$.
  CÓMO: Verificar $b > 1$, describir el límite $y \to 0^+$ hacia $-\infty$ y la aceleración exponencial hacia $+\infty$.
