semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.PRODUCTO_RAICES
resumen_inicial: El cálculo del producto de las raíces de una ecuación cuadrática utiliza la segunda relación de Vieta $x_1 \cdot x_2 = c / a$ sin necesidad de resolver la ecuación.
explicacion_simple: |
  La segunda relación fundamental de Vieta te entrega de inmediato la **multiplicación o producto de las dos soluciones** ($x_1 \cdot x_2$):

  - Para la ecuación $ax^2 + bx + c = 0$, el producto de sus raíces viene dado por:
    $$x_1 \cdot x_2 = \frac{c}{a}$$

  - **Ejemplo**: En la ecuación $4x^2 - 11x + 12 = 0$:
    - Identificas $a = 4$ y $c = 12$.
    - El producto de sus raíces es:
      $$x_1 \cdot x_2 = \frac{12}{4} = 3$$
  - ¡Sabes que $x_1 \cdot x_2 = 3$ sin haber encontrado ninguna de las dos raíces individualmente!
explicacion_formal: |
  Dada la ecuación cuadrática $ax^2 + bx + c = 0$ con $a, b, c \in \mathbb{R}$ y $a \neq 0$, y raíces $x_1, x_2 \in \mathbb{C}$, el **Segundo Teorema de Vieta** establece la relación de producto multiplicativo de las raíces:

  $$x_1 \cdot x_2 = \frac{c}{a}$$

  **Demostración por producto de raíces de la fórmula general:**
  $$x_1 \cdot x_2 = \left(\frac{-b + \sqrt{b^2 - 4ac}}{2a}\right) \left(\frac{-b - \sqrt{b^2 - 4ac}}{2a}\right) = \frac{(-b)^2 - (b^2 - 4ac)}{4a^2} = \frac{4ac}{4a^2} = \frac{c}{a}$$
definiciones_clave: |
  - **Relaciones de Vieta (Producto de raíces)**: Teorema algebraico que vincula la constante independiente y el coeficiente cuadrático con el producto de sus soluciones.
propiedades_relaciones: |
  - **Raíces Inversas o Recíprocas**: Si $c = a$, el producto de las soluciones vale $x_1 \cdot x_2 = \frac{a}{a} = 1$, lo que significa que las raíces son inversas multiplicativas ($x_2 = \frac{1}{x_1}$).
ejemplo_guiado:
  enunciado: 'Calcula el producto de las soluciones de la ecuación cuadrática $2x^2 + 7x - 10 = 0$ aplicando la relación de Vieta.'
  pasos:
    - 'Paso 1: Extraer los coeficientes $a = 2$ y $c = -10$.'
    - 'Paso 2: Aplicar la fórmula de Vieta para el producto: $x_1 \cdot x_2 = \frac{c}{a}$.'
    - 'Paso 3: Sustituir los valores: $x_1 \cdot x_2 = \frac{-10}{2} = -5$.'
    - 'Paso 4: Concluir que el producto exacto de las raíces es $-5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula para calcular el producto de las raíces $x_1 \cdot x_2$ en $ax^2 + bx + c = 0$?'
    choices:
      - {text: '$x_1 \cdot x_2 = \frac{c}{a}$', is_correct: true}
      - {text: '$x_1 \cdot x_2 = -\frac{c}{a}$', is_correct: false}
      - {text: '$x_1 \cdot x_2 = \frac{b}{a}$', is_correct: false}
      - {text: '$x_1 \cdot x_2 = \sqrt{\frac{c}{a}}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 \cdot x_2 = \frac{c}{a}$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuánto vale el producto de las raíces de la ecuación cuadrática $3x^2 - 2x + 15 = 0$?'
    choices:
      - {text: '$x_1 \cdot x_2 = 5$', is_correct: true}
      - {text: '$x_1 \cdot x_2 = -5$', is_correct: false}
      - {text: '$x_1 \cdot x_2 = 2/3$', is_correct: false}
      - {text: '$x_1 \cdot x_2 = 15$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x_1 \cdot x_2 = 5$''. Calculando $x_1 \cdot x_2 = \frac{15}{3} = 5$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Escribir la ecuación en forma canónica igualada a cero para extraer $a$ y $c$.'
  - 'Paso 2: Reemplazar los coeficientes en la fórmula del producto $x_1 \cdot x_2 = c / a$.'
  - 'Paso 3: Conservar los signos originales de $c$ y de $a$ (la fórmula del producto no añade signo negativo explícito).'
  - 'Paso 4: Simplificar la fracción resultante para obtener el valor del producto.'
errores_correccion: |
  - **Error común:** Agregar un signo negativo a la fórmula del producto por confusión con la fórmula de la suma.
  - **Cómo corregirlo:** La fórmula del producto **MANTIENE EL SIGNO POSITIVO**: $x_1 \cdot x_2 = +\frac{c}{a}$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Producto con c negativo.
    alternativas:
      - '$x_1 \cdot x_2 = -6$'
      - '$x_1 \cdot x_2 = 6$'
      - '$x_1 \cdot x_2 = -1/6$'
    respuesta: '$x_1 \cdot x_2 = -6$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Raíces recíprocas (c = a).
    alternativas:
      - '$x_1 \cdot x_2 = 1$'
      - '$x_1 \cdot x_2 = -1$'
      - '$x_1 \cdot x_2 = 5$'
    respuesta: '$x_1 \cdot x_2 = 1$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Agregar un signo negativo erróneo a la relación del producto escribiendo $x_1 \cdot x_2 = -c / a$.'
  - 'Dividir el coeficiente lineal entre el término independiente $b / c$ en lugar de dividir $c$ entre $a$.'
  - 'La creencia de que si la constante $c$ es negativa, el producto de las raíces debe ser positivo.'
  - 'Resolver la fórmula general para multiplicar decimales aproximados en lugar de evaluar la fracción $c / a$.'
  - 'Aplicar la relación $x_1 \cdot x_2 = c / a$ sobre una ecuación incompleta sin considerar $b = 0$.'
afirmaciones_verdaderas:
  - 'El producto de las soluciones de la ecuación $ax^2 + bx + c = 0$ viene dado directamente por el cociente $x_1 \cdot x_2 = c / a$.'
  - 'Si el término independiente $c = a$, el producto de las soluciones es igual a 1, demostrando que las raíces son inversas recíprocas.'
al_terminar_debes_poder: |
  QUÉ: Calcular el producto de las raíces de una ecuación cuadrática mediante la segunda relación de Vieta.
  CÓMO: Identificar $a$ y $c$, aplicar la fórmula $x_1 \cdot x_2 = c/a$ con signos originales y simplificar.
