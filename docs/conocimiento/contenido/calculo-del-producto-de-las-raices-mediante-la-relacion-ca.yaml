semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.PRODUCTO_RAICES
resumen_inicial: 'El producto de las dos raíces de una ecuación cuadrática $ax^2 + bx + c = 0$ ($a \neq 0$) se determina directamente mediante la segunda relación de Vieta: $P = x_1 \cdot x_2 = \frac{c}{a}$.'
explicacion_simple: "![El producto de las dos raíces de una ecuación cuadrática $ax^2 + bx + c = 0$ ($a \\neq 0$) se determina directamente mediante la segunda relación de Vieta: $P = x_1 \\cdot x_2 = \\frac{c}{a}$](/static/img/nodos/calculo-del-producto-de-las-raices-mediante-la-relacion-ca-intro.svg)\n\n\nAsí como puedes sumar las soluciones al instante, también puedes **multiplicarlas directamente sin resolver la ecuación**:\n\n- **La fórmula de Vieta para el producto:**\n  $$x_1 \\cdot x_2 = \\frac{c}{a}$$\n- Solo divides el número suelto del final ($c$) entre el número que acompaña a $x^2$ ($a$).\n- **¡Atención!** Esta fórmula **NO lleva signo menos** (conserva el signo exacto de la división).\n- *Ejemplo:* En $4x^2 - 7x - 12 = 0$, $a = 4$ y $c = -12$.\n  $$\\text{Producto} = \\frac{-12}{4} = -3$$\n- El producto de las dos raíces es exactamente $-3$."
explicacion_formal: 'Dada la identidad polinomial $ax^2 + bx + c = a(x - x_1)(x - x_2) = ax^2 - a(x_1 + x_2)x + a(x_1 x_2)$, la igualación del término independiente produce:

  $$a(x_1 x_2) = c \Longleftrightarrow x_1 \cdot x_2 = \frac{c}{a}$$


  **Demostración analítica por diferencia de cuadrados**:

  $$x_1 \cdot x_2 = \left(\frac{-b + \sqrt{\Delta}}{2a}\right)\left(\frac{-b - \sqrt{\Delta}}{2a}\right) = \frac{(-b)^2 - (\sqrt{\Delta})^2}{4a^2} = \frac{b^2 - (b^2 - 4ac)}{4a^2} = \frac{4ac}{4a^2} = \frac{c}{a}$$'
definiciones_clave: '- **Segunda relación de Vieta**: Teorema que establece que el determinante del producto de las raíces es el cociente escalar $c/a$.

  - **Signo de las raíces**: Regla que deduce si las raíces tienen igual signo ($c/a > 0$) o signos opuestos ($c/a < 0$).'
propiedades_relaciones: '- **Raíces inversas / recíprocas**: Si $c = a$, entonces $x_1 \cdot x_2 = 1$, lo que significa que una raíz es el recíproco multiplicativo de la otra ($x_2 = 1/x_1$).

  - **Raíz nula**: Si $c = 0$, entonces $P = 0$, asegurando que al menos una raíz es $x = 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El producto de las dos raíces de una ecuación cuadrática $ax^2 + bx + c = 0$ ($a \neq 0$) se determina directamente mediante la segunda relación de Vieta: $P = x_1 \cdot x_2 = \frac{c}{a}$](/static/img/nodos/calculo-del-producto-de-las-raices-mediante-la-relacion-ca-ejemplos.svg)



    Calcula el producto de las raíces de la ecuación $5x^2 - 11x - 30 = 0$ y determina los signos relativos de ambas soluciones.'
  pasos:
  - 'Paso 1: Identificar los coeficientes: $a = 5, b = -11, c = -30$.'
  - 'Paso 2: Escribir la relación de Vieta para el producto: $P = x_1 \cdot x_2 = \frac{c}{a}$.'
  - 'Paso 3: Sustituir los valores: $P = \frac{-30}{5} = -6$.'
  - 'Paso 4: Interpretar el signo: Como $P = -6 < 0$, las dos soluciones tienen necesariamente signos contrarios (una positiva y una negativa).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el producto de las raíces de la ecuación $3x^2 + 8x - 15 = 0$?
  choices:
  - text: '-5'
    is_correct: true
  - text: '5'
    is_correct: false
  - text: -8/3
    is_correct: false
  - text: '-15'
    is_correct: false
  explanation: La alternativa correcta es '-5'. $P = c/a = -15/3 = -5$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el producto de las raíces de una ecuación cuadrática es c/a = -8, ¿qué se puede afirmar con seguridad sobre las dos raíces?
  choices:
  - text: Tienen signos contrarios (una es positiva y la otra es negativa).
    is_correct: true
  - text: Ambas son negativas.
    is_correct: false
  - text: Ambas son positivas.
    is_correct: false
  - text: Una de ellas es cero.
    is_correct: false
  explanation: La alternativa correcta es 'Tienen signos contrarios (una es positiva y la otra es negativa).'. Un producto negativo solo resulta al multiplicar signos distintos.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la ecuación en la forma canónica $ax^2 + bx + c = 0$.'
- 'Paso 2: Identificar los coeficientes $a$ y $c$.'
- 'Paso 3: Evaluar el cociente $P = \frac{c}{a}$.'
- 'Paso 4: Simplificar la fracción resultante respetando los signos algebraicos.'
errores_correccion: '- **Error común:** Agregar un signo menos innecesario y calcular $-c/a$.

  - **Cómo corregirlo:** La fórmula del producto **es positiva**: $P = +\frac{c}{a}$ (la única que lleva menos es la suma).'
ejemplos:
- titulo: 'Ejemplo 1: Producto entero positivo'
  enunciado: En $2x^2 - 5x + 18 = 0$, ¿cuál es el producto de sus raíces?
  alternativas:
  - '9'
  - '-9'
  - 5/2
  - '18'
  respuesta: '9'
  solucion_pasos:
  - 'Paso 1: $P = 18/2 = 9$.'
- titulo: 'Ejemplo 2: Producto fraccionario negativo'
  enunciado: En $7x^2 + 3x - 4 = 0$, ¿cuánto vale x1 · x2?
  alternativas:
  - -4/7
  - 4/7
  - -3/7
  - 3/7
  respuesta: -4/7
  solucion_pasos:
  - 'Paso 1: $P = -4/7$.'
- titulo: 'Ejemplo 3: Raíz nula'
  enunciado: En $6x^2 - 13x = 0$, ¿cuánto vale el producto de las soluciones?
  alternativas:
  - '0'
  - 13/6
  - -13/6
  - '6'
  respuesta: '0'
  solucion_pasos:
  - 'Paso 1: $c = 0 \implies P = 0/6 = 0$.'
- titulo: 'Ejemplo 4: Raíces recíprocas'
  enunciado: En $5x^2 - 14x + 5 = 0$, ¿cuál es el producto de sus raíces?
  alternativas:
  - '1'
  - '5'
  - 14/5
  - '-1'
  respuesta: '1'
  solucion_pasos:
  - 'Paso 1: $P = 5/5 = 1$ (raíces recíprocas).'
errores_frecuentes:
- Confundir la fórmula del producto con la de la suma.
- Poner signo negativo a c/a.
- Olvidar dividir c entre el coeficiente a.
afirmaciones_verdaderas:
- El producto de las raíces de una ecuación ax² + bx + c = 0 es exactamente igual a c/a.
- Si c/a < 0, las raíces tienen signos contrarios.
al_terminar_debes_poder: '**QUÉ:** Calcular directamente el producto de las raíces de cualquier ecuación cuadrática.


  **CÓMO:** Aplicando la segunda relación de Vieta P = c/a a partir de los coeficientes de la ecuación.


  ![Resumen El producto de las dos raíces de una ecuación cuadrática $ax^2 + bx + c = 0$ ($a \neq 0$) se determina directamente mediante la segunda relación de Vieta: $P = x_1 \cdot x_2 = \frac{c}{a}$](/static/img/nodos/calculo-del-producto-de-las-raices-mediante-la-relacion-ca-resumen.svg)'
