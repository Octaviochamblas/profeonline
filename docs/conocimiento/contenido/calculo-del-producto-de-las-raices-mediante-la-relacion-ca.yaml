procedimiento:
- 'Paso 1: Identifica los coeficientes $a$ y $c$ de la ecuación en forma general.'
- 'Paso 2: Calcula $\dfrac{c}{a}$.'
- 'Paso 3: Ese resultado es el producto de las dos raíces, sin necesidad de calcularlas
  individualmente.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en cálculo del producto de las raíces mediante la relación c/a.
ejemplos:
- titulo: Cálculo directo del producto de raíces
  enunciado: Calcula el producto de las raíces de $x^2-5x+6=0$ sin resolver la ecuación.
  solucion_pasos:
  - $a=1$, $c=6$.
  - $x_1 \cdot x_2=\dfrac{6}{1}=6$.
- titulo: Cálculo con coeficiente a distinto de 1
  enunciado: Calcula el producto de las raíces de $2x^2+6x-8=0$ sin resolver la ecuación.
  solucion_pasos:
  - $a=2$, $c=-8$.
  - $x_1 \cdot x_2=\dfrac{-8}{2}=-4$.
- titulo: ¿El producto de las raíces depende del valor de $b$?
  enunciado: ¿El producto de las raíces depende del valor de $b$?
  respuesta: 'No'
  solucion_pasos:
  - La fórmula $c/a$ no involucra a $b$; el coeficiente lineal no afecta el producto
    de las raíces.
- titulo: ¿Un producto de raíces negativo implica que las raíces tienen signos opuestos?
  enunciado: ¿Un producto de raíces negativo implica que las raíces tienen signos
    opuestos?
  respuesta: Sí
  solucion_pasos:
  - Un producto negativo solo se obtiene multiplicando un número positivo por uno
    negativo.
errores_frecuentes:
- Confundir el producto de las raíces con la suma de las raíces.
- Usar el valor de $b$ en vez de $c$ al calcular el producto.
- Olvidar dividir por $a$ cuando $a\neq1$.
- Aplicar la fórmula a una ecuación que no está en su forma general, usando coeficientes
  incorrectos.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_poder: Resolver y analizar ecuaciones cuadráticas utilizando cálculo
  del producto de las raíces mediante la relación c/a.
