semantic_id: MAT.ALG.EC_CUADR_PROPIEDADES.PRODUCTO_RAICES
resumen_inicial: 'Cálculo del producto de las raíces mediante la relación c/a: concepto,
  discriminante, soluciones y modelamiento en Propiedades de las raíces y relaciones
  de Vieta.'
explicacion_simple: Así como existe un atajo para la suma de las raíces, existe otro
  para su producto, que también se obtiene directamente de los coeficientes de la
  ecuación.
explicacion_formal: '### Definición formal


  Si $x_1$ y $x_2$ son las raíces de $ax^2+bx+c=0$ con $a\neq0$, entonces $x_1 \cdot
  x_2=\dfrac{c}{a}$. Esta relación se obtiene multiplicando las dos soluciones de
  la fórmula general, donde aparece una diferencia de cuadrados que involucra el discriminante.


  ### Desarrollo didáctico


  Junto con la suma de las raíces, esta propiedad permite reconstruir información
  sobre las soluciones sin resolver la ecuación, o verificar un par de soluciones
  ya encontradas.


  Para $x^2-7x+10=0$: $a=1$, $c=10$, por lo que $x_1 \cdot x_2=\dfrac{10}{1}=10$.
  En efecto, las raíces son $2$ y $5$, y $2 \cdot 5=10$.'
definiciones_clave: '- **Cálculo del producto de las raíces mediante la relación c/a**:
  Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en cálculo
  del producto de las raíces mediante la relación c/a.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando cálculo del producto
    de las raíces mediante la relación c/a.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a cálculo del producto
    de las raíces mediante la relación c/a.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
