semantic_id: MAT.GEO.ANGULOS_RECTAS_TRANSVERSALES.CORRESPONDIENTES_IDENTIFICACION
resumen_inicial: Los ángulos correspondientes son aquellos situados al mismo lado
  de la transversal, uno en la región exterior y el otro en la región interior.
explicacion_simple: '![Identificación de Ángulos Correspondientes](/static/img/nodos/identificacion-de-angulos-correspondientes-entre-paralelas-intro.svg)


  Si te imaginas que tomas el cruce de arriba y lo deslizas hacia abajo sobre la línea
  secante, los ángulos que caen exactamente en la misma posición (por ejemplo, arriba
  a la derecha en ambos cruces) son los ángulos correspondientes. Forman una figura
  parecida a una letra "F".'
explicacion_formal: '### Definición formal

  Dadas dos rectas paralelas $L_1 \parallel L_2$ y una transversal $T$, los **ángulos
  correspondientes** son aquellos situados en el mismo lado de la transversal (mismo
  semiplano) y en la misma posición relativa respecto a cada paralela (uno interno
  y otro externo):


  $$\operatorname{Corresp}(L_1, L_2, T) = \{(\alpha, \beta) \mid \text{mismo semiplano
  de } T \land \text{misma posición relativa a } L_1, L_2\}$$


  ### Desglose simbólico y geométrico

  - Misma orientación espacial: Ambos arriba a la derecha, arriba a la izquierda,
  abajo a la derecha o abajo a la izquierda en sus respectivos vértices.

  - Forma visual ''F'': Los lados de los ángulos correspondientes delinean la forma
  de una letra ''F''.


  ### Síntesis didáctica

  Los ángulos correspondientes reflejan una traslación pura a lo largo de la recta
  transversal, conservando exactamente la misma postura geométrica.'
definiciones_clave: '- **Ángulos correspondientes**: Parejas de ángulos homólogos
  situados en la misma posición relativa en cada vértice.

  - **Patrón en F**: Disposición geométrica característica de los ángulos correspondientes. '
propiedades_relaciones: '- **Cuatro pares de correspondientes**: $(\angle 1, \angle
  5)$, $(\angle 2, \angle 6)$, $(\angle 3, \angle 7)$ y $(\angle 4, \angle 8)$.

  - **Invariancia por traslación**: Un ángulo correspondiente es la traslación pura
  del otro a lo largo de la secante $T$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Correspondientes](/static/img/nodos/identificacion-de-angulos-correspondientes-entre-paralelas-ejemplos.svg)


    En una figura de paralelas cortadas por una transversal, se numeran los ángulos
    del 1 al 4 en la recta superior y del 5 al 8 en la inferior. Identifica los cuatro
    pares de ángulos correspondientes.'
  pasos:
  - 'Paso 1: Identificar la posición arriba-derecha: $\angle 1$ y $\angle 5$.'
  - 'Paso 2: Identificar la posición arriba-izquierda: $\angle 2$ y $\angle 6$.'
  - 'Paso 3: Identificar la posición abajo-izquierda: $\angle 3$ y $\angle 7$.'
  - 'Paso 4: Identificar la posición abajo-derecha: $\angle 4$ y $\angle 8$.'
  - 'Paso 5: Concluir que existen exactamente 4 parejas correspondientes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué caracteriza a una pareja de ángulos correspondientes?
  choices:
  - text: Están al mismo lado de la transversal, uno interior y otro exterior
    is_correct: true
  - text: Están en lados opuestos de la transversal y ambos son interiores
    is_correct: false
  - text: Comparten el mismo vértice y suman 180°
    is_correct: false
  - text: Ambos son exteriores en lados opuestos
    is_correct: false
  explanation: Están al mismo lado de la transversal, uno interior y otro exterior.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el ángulo correspondiente al ángulo 4 (abajo a la derecha en
    la recta superior)?
  choices:
  - text: El ángulo 8 (abajo a la derecha en la recta inferior)
    is_correct: true
  - text: El ángulo 6 (arriba a la izquierda)
    is_correct: false
  - text: El ángulo 5 (arriba a la derecha)
    is_correct: false
  - text: El ángulo 2 (arriba a la izquierda)
    is_correct: false
  explanation: El ángulo correspondiente que ocupa la misma posición abajo a la derecha
    es el ángulo 8 (abajo a la derecha en la recta inferior).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar las dos intersecciones de la transversal $T$ con las rectas $L_1$
  y $L_2$.'
- 'Paso 2: Elegir un cuadrante de referencia en la primera intersección (ej. arriba
  a la derecha).'
- 'Paso 3: Seleccionar el mismo cuadrante homólogo en la segunda intersección.'
- 'Paso 4: Clasificar el par como ángulos correspondientes.'
errores_correccion: No confundas correspondientes (mismo lado de T) con alternos (lados
  opuestos de T).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $\angle 2$ está ubicado arriba a la izquierda en la recta superior,
    ¿cuál es su ángulo correspondiente?
  alternativas:
  - $\angle 6$ (arriba a la izquierda en la recta inferior)
  - $\angle 8$ (abajo a la derecha)
  - $\angle 5$ (arriba a la derecha)
  respuesta: $\angle 6$ (arriba a la izquierda en la recta inferior)
  solucion_pasos:
  - El ángulo correspondiente debe estar en la misma posición (arriba-izquierda): $\angle
      6$.
- titulo: Ejemplo 2
  enunciado: ¿Cuántos pares de ángulos correspondientes se generan en total?
  alternativas:
  - 4 pares
  - 2 pares
  - 8 pares
  respuesta: 4 pares
  solucion_pasos:
  - Hay 4 posiciones relativas en cada vértice, formando exactamente 4 pares de ángulos
    correspondientes.
- titulo: ¿Los ángulos correspondientes forman una figura parecida a una letra F?
  respuesta: Sí
  solucion_pasos:
  - Sí, el patrón visual mnemotécnico clásico es la letra F.
- titulo: ¿Dos ángulos correspondientes pueden ser ambos interiores?
  respuesta: 'No'
  solucion_pasos:
  - No, obligatoriamente uno debe ser interior y el otro exterior.
errores_frecuentes:
- Confundir ángulos correspondientes con ángulos alternos internos.
- Seleccionar dos ángulos interiores en vez de uno interior y uno exterior.
- Confundir el patrón en F con el patrón en Z.
- Asumir que comparten vértice.
- Emparejar ángulos de posiciones relativas distintas.
afirmaciones_verdaderas:
- Los ángulos correspondientes ocupan posiciones relativas idénticas en cada cruce.
- Existen exactamente 4 pares de ángulos correspondientes.
al_terminar_debes_poder: '**QUÉ:** Identificar y clasificar las cuatro parejas de
  ángulos correspondientes en rectas cortadas por una secante.


  **CÓMO:** Verificando la homología de posición en cada intersección y la presencia
  al mismo lado de la secante $T$ (patrón en F).


  ![Resumen de Identificación de Correspondientes](/static/img/nodos/identificacion-de-angulos-correspondientes-entre-paralelas-resumen.svg)'
fuente: Texto escolar MINEDUC — Geometría 7° Básico.
