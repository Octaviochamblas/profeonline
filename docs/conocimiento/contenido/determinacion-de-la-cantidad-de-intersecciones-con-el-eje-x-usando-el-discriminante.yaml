semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CANTIDAD_INTERSECCIONES_X
resumen_inicial: 'La cantidad de intersecciones de la parábola con el eje $X$ se determina mediante el discriminante $\Delta = b^2 - 4ac$: si $\Delta > 0$ hay 2 cortes distintos (secante), si $\Delta = 0$ hay 1 corte (tangente en el vértice), y si $\Delta < 0$ hay 0 cortes reales (disjunta).'
explicacion_simple: "![La cantidad de intersecciones de la parábola con el eje $X$ se determina mediante el discriminante $\\Delta = b^2 - 4ac$: si $\\Delta > 0$ hay 2 cortes distintos (secante), si $\\Delta = 0$ hay 1 corte (tangente en el vértice), y si $\\Delta < 0$ hay 0 cortes reales (disjunta)](/static/img/nodos/determinacion-de-la-cantidad-de-intersecciones-con-el-eje-x-usando-el-discriminante-intro.svg)\n\n\nEl **discriminante ($\\Delta$)** es un detector mágico que te dice cuántas veces la parábola corta al eje $X$ **sin tener que resolver la ecuación ni graficarla**:\n$$\\Delta = b^2 - 4ac$$\n\n- **Si $\\Delta > 0$ (Positivo):**\n  - Hay **2 cortes reales** con el eje $X$ (la parábola cruza el eje).\n- **Si $\\Delta = 0$ (Cero):**\n  - Hay **1 solo corte** con el eje $X$ (la parábola solo apoya su vértice en el eje, es tangente).\n- **Si $\\Delta < 0$ (Negativo):**\n  - Hay **0 cortes reales** (la parábola flota por encima o por debajo sin tocar el eje $X$)."
explicacion_formal: 'Sea $f(x) = ax^2 + bx + c$ con $a \in \mathbb{R} \setminus \{0\}$ y $b, c \in \mathbb{R}$. La cantidad de elementos del conjunto de intersección $\mathcal{I}_X = \text{Gr}(f) \cap (\text{Eje } X)$ está determinada por la cardinalidad del espectro real del discriminante polinómico $\Delta = b^2 - 4ac$:


  $$\#(\mathcal{I}_X) = \begin{cases} 2 & \text{si } \Delta > 0 \quad (\text{Intersección secante transversal}) \\ 1 & \text{si } \Delta = 0 \quad (\text{Contacto de orden 2 / Tangencia en } V(x_v, 0)) \\ 0 & \text{si } \Delta < 0 \quad (\text{Topología disjunta en } \mathbb{R}^2) \end{cases}$$


  **Interacción analítica con la posición del vértice**:

  - $y_v = -\frac{\Delta}{4a}$.

  - Si $\Delta > 0 \implies y_v$ y $a$ tienen signos opuestos ($a \cdot y_v < 0$), garantizando que la curva cruza el eje $X$.

  - Si $\Delta < 0 \implies y_v$ y $a$ tienen el mismo signo ($a \cdot y_v > 0$), garantizando que la curva nunca alcanza el eje $X$.'
definiciones_clave: '- **Discriminante $\Delta$**: Expresión algebraica $\Delta = b^2 - 4ac$ que clasifica la naturaleza de las raíces y cortes.

  - **Tangencia parabólica**: Contacto en un único punto cuando el vértice de la parábola pertenece al eje de abscisas.'
propiedades_relaciones: '- **Positividad estricta de la función**: Si $\Delta < 0$ y $a > 0 \implies f(x) > 0, \; \forall x \in \mathbb{R}$.

  - **Negatividad estricta de la función**: Si $\Delta < 0$ y $a < 0 \implies f(x) < 0, \; \forall x \in \mathbb{R}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La cantidad de intersecciones de la parábola con el eje $X$ se determina mediante el discriminante $\Delta = b^2 - 4ac$: si $\Delta > 0$ hay 2 cortes distintos (secante), si $\Delta = 0$ hay 1 corte (tangente en el vértice), y si $\Delta < 0$ hay 0 cortes reales (disjunta)](/static/img/nodos/determinacion-de-la-cantidad-de-intersecciones-con-el-eje-x-usando-el-discriminante-ejemplos.svg)



    Determina cuántas veces corta al eje X la gráfica de cada función calculando su discriminante:

    1) $f(x) = 3x^2 - 2x + 1$

    2) $g(x) = x^2 - 6x + 9$

    3) $h(x) = -2x^2 + 4x + 1$'
  pasos:
  - 'Paso 1: Para $f(x) = 3x^2 - 2x + 1$:

    $\Delta = (-2)^2 - 4(3)(1) = 4 - 12 = -8 < 0$.

    - Conclusión: **0 intersecciones con el eje X** (parábola flotante).'
  - 'Paso 2: Para $g(x) = x^2 - 6x + 9$:

    $\Delta = (-6)^2 - 4(1)(9) = 36 - 36 = 0$.

    - Conclusión: **1 intersección con el eje X** (tangente en su vértice $(3, 0)$).'
  - 'Paso 3: Para $h(x) = -2x^2 + 4x + 1$:

    $\Delta = 4^2 - 4(-2)(1) = 16 + 8 = 24 > 0$.

    - Conclusión: **2 intersecciones con el eje X** (cruza en dos puntos distintos).'
checkpoints:
- placement: after_explicacion_formal
  question: Si una parábola tiene discriminante Δ = 49, ¿cuántos puntos de intersección tiene con el eje X?
  choices:
  - text: 2 puntos de intersección distintos
    is_correct: true
  - text: 1 punto de intersección
    is_correct: false
  - text: 0 puntos de intersección
    is_correct: false
  - text: 7 puntos de intersección
    is_correct: false
  explanation: La alternativa correcta es '2 puntos de intersección distintos'. Como $\Delta = 49 > 0$, la parábola corta al eje $X$ en dos puntos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Para qué valor de k la parábola $f(x) = x^2 - 4x + k$ es TANGENTE al eje X (1 corte)?
  choices:
  - text: k = 4 (para que Δ = 16 - 4k = 0)
    is_correct: true
  - text: k = 0
    is_correct: false
  - text: k = -4
    is_correct: false
  - text: k = 16
    is_correct: false
  explanation: La alternativa correcta es 'k = 4 (para que Δ = 16 - 4k = 0)'. Tangencia requiere $\Delta = 0 \implies 16 - 4k = 0 \implies k = 4$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer los coeficientes $a, b, c$ de la función.'
- 'Paso 2: Evaluar la fórmula del discriminante $\Delta = b^2 - 4ac$.'
- 'Paso 3: Si $\Delta > 0$, concluir 2 cortes con el eje $X$.'
- 'Paso 4: Si $\Delta = 0$, concluir 1 corte con el eje $X$ (tangente).'
- 'Paso 5: Si $\Delta < 0$, concluir 0 cortes con el eje $X$.'
errores_correccion: '- **Error común:** Pensar que si $\Delta < 0$ la función no se puede graficar.

  - **Cómo corregirlo:** La función existe y **se grafica perfectamente**; simplemente su parábola no toca la línea del eje $X$.'
ejemplos:
- titulo: 'Ejemplo 1: Discriminante positivo'
  enunciado: En $f(x) = x^2 - 5x - 6$, ¿cuántos cortes hay con el eje X?
  alternativas:
  - 2 cortes (Δ = 49 > 0)
  - 1 corte
  - 0 cortes
  - 6 cortes
  respuesta: 2 cortes (Δ = 49 > 0)
  solucion_pasos:
  - 'Paso 1: $\Delta = 25 - 4(1)(-6) = 49 > 0 \implies 2$ cortes.'
- titulo: 'Ejemplo 2: Discriminante negativo'
  enunciado: ¿Cuántas veces corta al eje X la parábola $g(x) = 2x^2 - 3x + 5$?
  alternativas:
  - 0 veces (Δ = -31 < 0)
  - 2 veces
  - 1 vez
  - 5 veces
  respuesta: 0 veces (Δ = -31 < 0)
  solucion_pasos:
  - 'Paso 1: $\Delta = 9 - 4(2)(5) = 9 - 40 = -31 < 0 \implies 0$ cortes.'
- titulo: 'Ejemplo 3: Discriminante nulo'
  enunciado: ¿Cuántos ceros reales tiene $h(x) = 4x^2 - 12x + 9$?
  alternativas:
  - 1 cero real (tangente en vértice)
  - 2 ceros reales
  - 0 ceros reales
  - 3 ceros reales
  respuesta: 1 cero real (tangente en vértice)
  solucion_pasos:
  - 'Paso 1: $\Delta = 144 - 4(4)(9) = 144 - 144 = 0 \implies 1$ cero.'
- titulo: 'Ejemplo 4: Parámetro para no cortar al eje X'
  enunciado: En $f(x) = x^2 + 6x + c$, ¿para qué valores de c la parábola NO toca el eje X?
  alternativas:
  - c > 9
  - c < 9
  - c = 9
  - c = 0
  respuesta: c > 9
  solucion_pasos:
  - 'Paso 1: $\Delta = 36 - 4c < 0 \implies 4c > 36 \implies c > 9$.'
errores_frecuentes:
- Calcular (-b)² como número negativo al evaluar el discriminante.
- Confundir la cantidad de cortes en el eje X con el corte en el eje Y.
- Asumir que si Δ = 0 no hay solución.
afirmaciones_verdaderas:
- El signo del discriminante Δ = b² - 4ac determina si la parábola corta al eje X en 2, 1 o 0 puntos.
- Si Δ = 0, el vértice de la parábola es el único punto de contacto con el eje X.
al_terminar_debes_poder: '**QUÉ:** Determinar la cantidad de intersecciones de una parábola con el eje X usando el discriminante.


  **CÓMO:** Calculando Δ = b² - 4ac y clasificando el resultado en 2 cortes (Δ > 0), 1 corte (Δ = 0) o 0 cortes (Δ < 0).


  ![Resumen La cantidad de intersecciones de la parábola con el eje $X$ se determina mediante el discriminante $\Delta = b^2 - 4ac$: si $\Delta > 0$ hay 2 cortes distintos (secante), si $\Delta = 0$ hay 1 corte (tangente en el vértice), y si $\Delta < 0$ hay 0 cortes reales (disjunta)](/static/img/nodos/determinacion-de-la-cantidad-de-intersecciones-con-el-eje-x-usando-el-discriminante-resumen.svg)'
