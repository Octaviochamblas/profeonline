semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CANTIDAD_INTERSECCIONES_X
resumen_inicial: 'El discriminante $\Delta = b^2 - 4ac$ predice exactamente la cantidad de puntos de intersección entre la parábola y el eje $x$ sin necesidad de graficar.'
explicacion_simple: |
  El discriminante es la parte que está dentro de la raíz en la fórmula cuadrática ($\Delta = b^2 - 4ac$). Su valor nos dice cuántas veces la parábola toca o cruza la línea del suelo (eje $x$): si es positivo, la curva cruza el eje en dos puntos; si es exactamente cero, la curva roza al eje en un solo punto (el vértice); y si es negativo, la parábola flota por encima o por debajo sin tocar al eje $x$.
explicacion_formal: |
  ### Definición formal
  En la función cuadrática $f(x) = ax^2 + bx + c$, el **discriminante** se define como el valor escalar:
  $$\Delta = b^2 - 4ac$$
  La cantidad de intersecciones en el plano cartesiano real $\mathbb{R}^2$ entre la curva $y = f(x)$ y el eje de las abscisas $y = 0$ viene determinada por el trinomio discriminante:

  ### Desglose simbólico
  - **$\Delta > 0$**: La función posee **dos ceros reales distintos** ($x_1 \neq x_2$). La parábola interseca al eje $x$ en **dos puntos** $(x_1, 0)$ y $(x_2, 0)$.
  - **$\Delta = 0$**: La función posee **un cero real doble** ($x_1 = x_2 = h$). La parábola es tangente al eje $x$ en **un único punto** $(h, 0)$, que coincide con el vértice.
  - **$\Delta < 0$**: La función posee **ceros complejos no reales**. La parábola presenta **cero intersecciones** con el eje $x$ (no toca ni cruza el eje $x$).

  ### Síntesis didáctica
  El discriminante actúa como un semáforo geométrico: $\Delta > 0$ corta 2 veces, $\Delta = 0$ apoya en 1 punto, $\Delta < 0$ no toca el eje $x$.
definiciones_clave: |
  - **Discriminante $\Delta$**: Expresión $b^2 - 4ac$ de la ecuación asociada a una función cuadrática.
  - **Intersección doble (secante)**: Caso $\Delta > 0$ donde la parábola atraviesa el eje $x$ en dos coordenadas distintas.
  - **Intersección tangente**: Caso $\Delta = 0$ donde la parábola toca el eje $x$ exclusivamente en su vértice.
  - **Parábola flotante**: Caso $\Delta < 0$ donde toda la parábola yace en un mismo semiplano superior ($y > 0$) o inferior ($y < 0$).
propiedades_relaciones: |
  - **Condición de positividad estricta**: Si $a > 0$ y $\Delta < 0$, entonces $f(x) > 0$ para todo $x \in \mathbb{R}$ (la parábola es strictly positiva).
  - **Condición de negatividad estricta**: Si $a < 0$ y $\Delta < 0$, entonces $f(x) < 0$ para todo $x \in \mathbb{R}$ (la parábola es estrictamente negativa).
ejemplo_guiado:
  enunciado: 'Determina el valor del discriminante $\Delta$ y especifica el número exacto de intersecciones reales con el eje $x$ para las funciones cuadráticas $f(x) = x^2 - 6x + 9$, $g(x) = 2x^2 - 3x + 5$ y $h(x) = -x^2 + 4x - 1$.'
  pasos:
    - 'Paso 1: Para $f(x)$, coeficientes $a = 1$, $b = -6$, $c = 9$. $\Delta_f = (-6)^2 - 4(1)(9) = 36 - 36 = 0$. Como $\Delta = 0$, presenta exactamente 1 intersección con el eje $x$ (tangente en su vértice $(3,0)$).'
    - 'Paso 2: Para $g(x)$, coeficientes $a = 2$, $b = -3$, $c = 5$. $\Delta_g = (-3)^2 - 4(2)(5) = 9 - 40 = -31$. Como $\Delta < 0$, presenta 0 intersecciones con el eje $x$ (flota por encima del eje $x$).'
    - 'Paso 3: Para $h(x)$, coeficientes $a = -1$, $b = 4$, $c = -1$. $\Delta_h = (4)^2 - 4(-1)(-1) = 16 - 4 = 12$. Como $\Delta > 0$, presenta exactamente 2 intersecciones reales con el eje $x$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la parábola de la función cuadrática $g(x) = 3x^2 + kx + 3$ debe ser tangente al eje $x$ en un solo punto, ¿qué valor puede tomar el parámetro $k$?'
    choices:
      - {text: '$k = 6$ o $k = -6$', is_correct: true}
      - {text: '$k = 0$', is_correct: false}
      - {text: '$k = 9$ o $k = -9$', is_correct: false}
      - {text: '$k = 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$k = 6$ o $k = -6$''. Para ser tangente exigimos $\Delta = 0 \implies k^2 - 4(3)(3) = 0 \implies k^2 - 36 = 0 \implies k = \pm 6$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuántos puntos de intersección con el eje $x$ presenta la función cuadrática $p(x) = -4x^2 + 5x - 2$?'
    choices:
      - {text: 'Ningún punto de intersección (0 intersecciones reales)', is_correct: true}
      - {text: 'Exactamente un punto de intersección', is_correct: false}
      - {text: 'Dos puntos de intersección distintos', is_correct: false}
      - {text: 'Infinitos puntos de intersección', is_correct: false}
    explanation: 'La alternativa correcta es ''Ningún punto de intersección (0 intersecciones reales)''. Calculamos $\Delta = 5^2 - 4(-4)(-2) = 25 - 32 = -7 < 0$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer los coeficientes $a$, $b$ y $c$ de la función cuadrática en forma general.'
  - 'Paso 2: Calcular el valor del discriminante mediante la fórmula $\Delta = b^2 - 4ac$.'
  - 'Paso 3: Comparar el valor de $\Delta$ con cero: si $\Delta > 0 \implies 2$ cortes; si $\Delta = 0 \implies 1$ corte (vértice); si $\Delta < 0 \implies 0$ cortes reales.'
errores_correccion: |
  - **Error 1:** Confundir el discriminante $\Delta = b^2 - 4ac$ con la raíz del discriminante $\sqrt{b^2 - 4ac}$. **Cómo corregirlo:** El discriminante es el número escalar $b^2 - 4ac$. Su signo analiza la cantidad de soluciones sin necesidad de extraer la raíz cuadrada.
  - **Error 2:** Creer que $\Delta < 0$ significa que la función no se puede evaluar. **Cómo corregirlo:** La función se puede evaluar para todos los reales ($\operatorname{Dom} = \mathbb{R}$). $\Delta < 0$ solo significa que las imágenes $y$ nunca toman el valor cero en los números reales.
ejemplos:
  - titulo: 'Análisis de discriminante positivo'
    enunciado: '¿Cuántas intersecciones con el eje $x$ tiene $f(x) = x^2 - 5x + 4$?'
    alternativas:
      - '2 intersecciones distintas'
      - '1 intersección tangente'
      - '0 intersecciones reales'
    respuesta: '2 intersecciones distintas'
    solucion_pasos:
      - '1. $\Delta = (-5)^2 - 4(1)(4) = 25 - 16 = 9$.'
      - '2. Como $\Delta = 9 > 0$, la curva presenta 2 intersecciones reales distintas con el eje $x$.'
  - titulo: 'Análisis de discriminante nulo'
    enunciado: '¿En cuántos puntos toca la parábola $g(x) = 4x^2 - 12x + 9$ al eje de las abscisas?'
    alternativas:
      - 'En exactamente 1 punto (tangente)'
      - 'En 2 puntos'
      - 'En ningún punto'
    respuesta: 'En exactamente 1 punto (tangente)'
    solucion_pasos:
      - '1. $\Delta = (-12)^2 - 4(4)(9) = 144 - 144 = 0$.'
      - '2. Al ser $\Delta = 0$, la parábola apoya su vértice sobre el eje $x$ en un único punto tangente.'
  - titulo: 'Parábola estrictamente positiva'
    enunciado: 'Si en $f(x) = ax^2 + bx + c$ se tiene $a = 2 > 0$ y $\Delta = -8 < 0$, ¿todos los puntos de la parábola se encuentran por encima del eje $x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Como $a > 0$ abre hacia arriba y al ser $\Delta < 0$ no corta al eje $x$, todas sus ordenadas satisfacen $f(x) > 0$ para todo $x \in \mathbb{R}$.'
  - titulo: 'Discriminante en cuadrática incompleta c = 0'
    enunciado: 'Para toda función cuadrática con $c = 0$ y $b \neq 0$, ¿el discriminante es siempre estrictamente positivo ($\Delta > 0$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Si $c = 0$, $\Delta = b^2 - 4a(0) = b^2$. Puesto que $b \neq 0$, $b^2$ es siempre estrictamente positivo, garantizando 2 cortes.'
errores_frecuentes:
  - 'El discriminante de una función cuadrática se calcula mediante la fórmula $\Delta = a^2 - 4bc$.'
  - 'Un discriminante negativo $\Delta < 0$ indica que la parábola es una línea recta.'
  - 'Si $\Delta = 0$, la parábola posee dos vértices en el plano cartesiano.'
  - 'Una función cuadrática con $\Delta > 0$ sólo puede tener coeficientes $a > 0$.'
  - 'El valor del discriminante $\Delta$ cambia según el punto $(x, y)$ que se elija en la gráfica.'
afirmaciones_verdaderas:
  - 'El signo del discriminante $\Delta = b^2 - 4ac$ determina unívocamente si la parábola interseca al eje $x$ en dos puntos ($\Delta > 0$), un punto ($\Delta = 0$) o ningún punto ($\Delta < 0$).'
  - 'Cuando el discriminante es cero ($\Delta = 0$), el vértice de la parábola pertenece exactamente al eje de las abscisas.'
al_terminar_debes_poder: 'Calcular el discriminante $\Delta = b^2 - 4ac$ de cualquier función cuadrática y predecir el número exacto de intersecciones reales con el eje $x$.'
