semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CANTIDAD_INTERSECCIONES_X
resumen_inicial: La determinación del número de intersecciones con el eje X evalúa el discriminante $\Delta = b^2 - 4ac$ para predecir si hay 2, 1 o 0 cortes.
explicacion_simple: |
  Sin necesidad de resolver la ecuación completa ni hacer el gráfico, puedes saber **CUÁNTAS VECES LA PARÁBOLA CORTA AL EJE X** calculando el **discriminante ($\Delta$)**:

  $$\Delta = b^2 - 4ac$$

  - **Si $\Delta > 0$ (Positivo)**: La parábola corta al eje X en **2 puntos distintos**.
  - **Si $\Delta = 0$ (Cero)**: La parábola toca al eje X en **1 solo punto** (su vértice).
  - **Si $\Delta < 0$ (Negativo)**: La parábola **NO corta al eje X en ningún punto** (flota arriba o abajo).
explicacion_formal: |
  Sea la función cuadrática $f(x) = ax^2 + bx + c$. El número de intersecciones reales de su parábola con el eje $X$ se encuentra determinado por la cardinalidad del conjunto de ceros reales $|Z(f)|$, regulada por la expresión del **discriminante polinómico**:

  $$\Delta = b^2 - 4ac$$

  **Teorema de la cantidad de intersecciones reales:**
  1. $\Delta > 0 \iff |Z(f)| = 2$: La parábola interseca al eje $X$ en dos puntos reales distintos $(x_1, 0)$ y $(x_2, 0)$.
  2. $\Delta = 0 \iff |Z(f)| = 1$: La parábola es tangente al eje $X$ en un único punto $(x_v, 0)$ coincidente con el vértice.
  3. $\Delta < 0 \iff |Z(f)| = 0$: La parábola no posee puntos de intersección reales con el eje $X$.
definiciones_clave: |
  - **Discriminante ($\Delta = b^2 - 4ac$)**: Indicador numérico que determina la cantidad de soluciones reales y de cortes cartesianos con el eje X.
propiedades_relaciones: |
  - **Parábolas strictly positivas o negativas**: Si $\Delta < 0$, la parábola se ubica completamente por encima del eje X ($f(x) > 0, \forall x$ si $a > 0$) o por debajo ($f(x) < 0, \forall x$ si $a < 0$).
ejemplo_guiado:
  enunciado: 'Determina cuántos puntos de corte con el eje X tiene la gráfica de $f(x) = 3x^2 - 4x + 2$.'
  pasos:
    - 'Paso 1: Identificar coeficientes: $a = 3, b = -4, c = 2$.'
    - 'Paso 2: Calcular el discriminante: $\Delta = b^2 - 4ac = (-4)^2 - 4(3)(2)$.'
    - 'Paso 3: Operar numéricamente: $\Delta = 16 - 24 = -8$.'
    - 'Paso 4: Como $\Delta = -8 < 0$, concluir que la gráfica NO interseca al eje X en ningún punto.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué ocurre con la gráfica de una función cuadrática si su discriminante vale cero ($\Delta = 0$)?'
    choices:
      - {text: 'Interseca al eje X en exactamente un punto de tangencia', is_correct: true}
      - {text: 'Interseca al eje X en dos puntos distintos.', is_correct: false}
      - {text: 'No interseca al eje X en ningún punto.', is_correct: false}
      - {text: 'Interseca al eje Y en dos puntos.', is_correct: false}
    explanation: 'La alternativa correcta es ''Interseca al eje X en exactamente un punto de tangencia''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Para la función $f(x) = x^2 - 6x + 9$, ¿cuántos puntos de intersección con el eje X presenta su parábola?'
    choices:
      - {text: 'Exactamente 1 punto porque $\Delta = (-6)^2 - 4(1)(9) = 0$', is_correct: true}
      - {text: '2 puntos distintos porque $a = 1 > 0$.', is_correct: false}
      - {text: '0 puntos porque $c = 9 > 0$.', is_correct: false}
      - {text: 'Infinitos puntos de corte.', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente 1 punto porque $\Delta = (-6)^2 - 4(1)(9) = 0$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer los coeficientes $a, b, c$ de la función $f(x) = ax^2 + bx + c$.'
  - 'Paso 2: Sustituir los valores en la fórmula $\Delta = b^2 - 4ac$.'
  - 'Paso 3: Calcular el resultado numérico del discriminante.'
  - 'Paso 4: Declarar 2 intersecciones si $\Delta > 0$, 1 intersección si $\Delta = 0$, o 0 intersecciones si $\Delta < 0$.'
errores_correccion: |
  - **Error común:** Calcular $(-4)^2$ como $-16$ obteniendo un discriminante con signo equivocado.
  - **Cómo corregirlo:** Todo número elevado a la potencia 2 resulta **POSITIVO** ($(-4)^2 = +16$). Usa siempre paréntesis.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Discriminante positivo.
    alternativas:
      - '2 intersecciones distintas'
      - '1 intersección única'
      - '0 intersecciones'
    respuesta: '2 intersecciones distintas'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Discriminante negativo.
    alternativas:
      - '0 intersecciones reales'
      - '2 intersecciones'
      - '1 intersección'
    respuesta: '0 intersecciones reales'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Evaluar el cuadrado de un número negativo sin paréntesis obteniendo resultados erróneos de $\Delta$.'
  - 'La creencia de que si $\Delta < 0$, la función no se puede graficar en el plano cartesiano.'
  - 'La equivalencia errónea entre el signo del discriminante $\Delta$ y el signo del coeficiente cuadrático $a$.'
  - 'Afirmar que un discriminante positivo implica que los ceros deben ser números positivos.'
  - 'La suposición de que la intersección con el eje Y también depende del signo del discriminante.'
afirmaciones_verdaderas:
  - 'El valor del discriminante $\Delta = b^2 - 4ac$ determina estrictamente si la parábola corta al eje X en dos puntos ($\Delta > 0$), en uno ($\Delta = 0$) o en ninguno ($\Delta < 0$).'
  - 'Si $\Delta < 0$, la parábola se encuentra ubicada en su totalidad sobre o debajo del eje X sin llegar a tocarlo jamás.'
al_terminar_debes_poder: |
  QUÉ: Determinar la cantidad de intersecciones de una parábola con el eje X usando el discriminante.
  CÓMO: Calcular $\Delta = b^2 - 4ac$, comparar con cero ($\Delta > 0, = 0, < 0$) e indicar si hay 2, 1 o 0 cortes.
