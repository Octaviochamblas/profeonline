procedimiento:
- 'Paso 1: Calcula el discriminante $\Delta=b^2-4ac$ de la función.'
- 'Paso 2: Si $\Delta>0$, concluye que hay dos intersecciones con el eje $x$.'
- 'Paso 3: Si $\Delta=0$, concluye que hay una única intersección (tangencia).'
- 'Paso 4: Si $\Delta<0$, concluye que no hay ninguna intersección real con el eje
  $x$.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en determinación de la cantidad de intersecciones
  con el eje x usando el discriminante.
ejemplos:
- titulo: Determinación con discriminante positivo
  enunciado: Sin graficar, determina cuántas veces $f(x)=x^2-5x+6$ interseca al eje
    $x$.
  solucion_pasos:
  - $\Delta=25-24=1>0$.
  - Interseca al eje $x$ en dos puntos distintos.
- titulo: Determinación con discriminante negativo
  enunciado: Sin graficar, determina cuántas veces $f(x)=x^2+2x+5$ interseca al eje
    $x$.
  solucion_pasos:
  - $\Delta=4-20=-16<0$.
  - No interseca al eje $x$ en ningún punto.
- titulo: ¿Un discriminante igual a cero implica que la parábola es tangente al eje
    $x$?
  enunciado: ¿Un discriminante igual a cero implica que la parábola es tangente al
    eje $x$?
  respuesta: Sí
  solucion_pasos:
  - La parábola toca al eje $x$ en exactamente un punto, que coincide con el vértice.
- titulo: ¿Una parábola con $\Delta<0$ sigue teniendo gráfica?
  enunciado: ¿Una parábola con $\Delta<0$ sigue teniendo gráfica?
  respuesta: Sí
  solucion_pasos:
  - La parábola existe y se puede graficar; simplemente permanece completamente por
    encima o por debajo del eje $x$.
errores_frecuentes:
- Confundir el signo del discriminante que da dos intersecciones con el que da ninguna.
- Calcular los ceros explícitamente cuando solo se pide la cantidad de intersecciones.
- Confundir "no interseca el eje $x$" con "no tiene gráfica".
- Olvidar que el caso $\Delta=0$ corresponde a tangencia, no a ausencia de intersección.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  determinación de la cantidad de intersecciones con el eje x usando el discriminante.
