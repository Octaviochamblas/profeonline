procedimiento:
- 'Paso 1: Lee la fórmula algebraica.'
- 'Paso 2: Asume que las letras del final (x, y, z) son las incógnitas que debes despejar
  o calcular.'
- 'Paso 3: Asume que las primeras letras (a, b, c) son constantes o números dados.'
errores_correccion: Evita confundir el coeficiente numérico con el exponente de las
  variables al analizar convención de letras para cantidades conocidas y desconocidas.
ejemplos:
- titulo: Despejando al culpable correcto
  enunciado: En la fórmula general $ax^2 + bx + c = 0$, ¿qué letras representan números
    dados y cuál es la incógnita a buscar?
  solucion_pasos:
  - 'a, b y c son las primeras letras: Representan constantes numéricas (ej. 3, -5,
    1).'
  - 'x es una de las últimas letras: Representa la incógnita que la fórmula busca
    resolver.'
- titulo: Un problema de modelamiento presenta la función de costos $C = p \cdot x
    + k$, donde represe
  enunciado: 'Un problema de modelamiento presenta la función de costos $C = p \cdot
    x + k$, donde representa un proceso fabril real. ¿Cuál de las siguientes afirmaciones
    describe de mejor forma el rol convencional de las letras en este contexto matemático?
    (v1)


    Opciones: A) ''$p$'' y ''$k$'' actúan como parámetros fijos del problema, mientras
    que ''$x$'' es la variable independiente (cantidad de producto). · B) Todas las
    letras cambian de valor al mismo tiempo. · C) ''$x$'' es un parámetro fijo y ''$k$''
    es la incógnita principal. · D) Es imposible saber cuál es cuál sin que nos den
    los números.'
  solucion_pasos:
  - En el estándar matemático, p y k (o m, b, c) son parámetros fijos (precio, costo
    fijo), y la x es la variable del problema.
  - 'Respuesta: ''$p$'' y ''$k$'' actúan como parámetros fijos del problema, mientras
    que ''$x$'' es la variable independiente (cantidad de producto).'
- titulo: 'Respecto de «Convención de letras para cantidades conocidas y desconocidas»:
    ¿Es correcta es'
  enunciado: 'Respecto de «Convención de letras para cantidades conocidas y desconocidas»:
    ¿Es correcta esta caracterización? «Por convención (y gracias a René Descartes):
    - Las **primeras letras del alfabeto** ($a, b, c, d \dots$) se usan para cantidades
    **conocidas** o parámetros fijos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Por convención (y gracias a
    René Descartes): - Las **primeras letras del alfabeto** ($a, b, c, d \dots$) se
    usan para cantidades **conocidas** o parámetros fijos.'
- titulo: 'Respecto de «Convención de letras para cantidades conocidas y desconocidas»:
    ¿Es válida esta'
  enunciado: 'Respecto de «Convención de letras para cantidades conocidas y desconocidas»:
    ¿Es válida esta afirmación? «Intentar ''despejar la a'' en lugar de la ''x'' en
    un problema estándar, confundiendo la incógnita real con un parámetro»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Por convención (y gracias a
    René Descartes): - Las **primeras letras del alfabeto** ($a, b, c, d \dots$) se
    usan para cantidades **conocidas** o parámetros fijos.'
errores_frecuentes:
- Intentar 'despejar la a' en lugar de la 'x' en un problema estándar, confundiendo
  la incógnita real con un parámetro.
- Creer que es una ley matemática inquebrantable, bloqueándose en física si les piden
  despejar la aceleración 'a' (que ahí sí es incógnita).
- Las principales incógnitas que deben ser despejadas obligatoriamente.
- Para «Según la convención algebraica clásica, cuando se presenta la ecuación genérica
  $ax + b = 0$, ¿qué representan usualmente las letras $a$ y $b$? (v1)», la respuesta
  correcta es Variables que pueden tomar infinitos valores a la vez.
- Números exclusivamente irracionales.
afirmaciones_verdaderas:
- La notación de convención de letras para cantidades conocidas y desconocidas sigue
  las convenciones del lenguaje algebraico.
