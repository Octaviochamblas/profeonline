resumen_inicial: 'La distinción entre progresión aritmética (P.A.) y progresión geométrica
  (P.G.) radica en la naturaleza de su tasa de cambio: la P.A. suma/resta una diferencia
  constante $d$, mientras que la P.G. multiplica/divide por una razón constante $r$.'
explicacion_simple: Para distinguir entre una progresión aritmética y una geométrica,
  observamos cómo pasa la secuencia de un número al siguiente. Si siempre sumamos
  o restamos la misma cantidad constante es aritmética; si multiplicamos o dividimos
  siempre por el mismo número es geométrica.
explicacion_formal: 'Dadas las sucesiones $(a_n)$ y $(b_n)$, la **Diferenciación Estructural
  P.A. vs. P.G.** se define por las ecuaciones en diferencias:


  $$\text{Progresión Aritmética (P.A.): } a_{n+1} - a_n = d \implies a_n = a_1 + (n
  - 1)d$$

  $$\text{Progresión Geométrica (P.G.): } \frac{b_{n+1}}{b_n} = r \implies b_n = b_1
  \cdot r^{n-1}$$


  **Comparación de crecimiento:**

  - P.A. responde a un patrón lineal discreto de pendiente $d$.

  - P.G. responde a un patrón exponencial discreto de base $r$.'
definiciones_clave: '- **P.A. vs. P.G.**: Contraste entre el modelo aditivo de diferencia
  $d$ y el modelo multiplicativo de razón $r$.'
propiedades_relaciones: '- **Naturaleza de cambio**: Adición constante frente a multiplicación
  constante.'
ejemplo_guiado:
  enunciado: Clasifique las sucesiones $S_1 = (5, 8, 11, 14)$ y $S_2 = (5, 10, 20,
    40)$.
  pasos:
  - 'Paso 1: Evaluar $S_1$: las diferencias son $8-5 = 3$, $11-8 = 3$, $14-11 = 3
    \implies$ P.A. con $d = 3$.'
  - 'Paso 2: Evaluar $S_2$: los cocientes son $10/5 = 2$, $20/10 = 2$, $40/20 = 2
    \implies$ P.G. con $r = 2$.'
  - 'Conclusión: $S_1$ es una Progresión Aritmética y $S_2$ es una Progresión Geométrica.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la diferencia fundamental entre una progresión aritmética y una
    progresión geométrica?
  choices:
  - text: La P.A. incrementa sumando una diferencia constante d, mientras que la P.G.
      incrementa multiplicando por una razón constante r
    is_correct: true
  - text: La P.A. es siempre finita y la P.G. es siempre infinita
    is_correct: false
  - text: Ambas usan la misma fórmula de suma
    is_correct: false
  - text: La P.G. no utiliza números reales
    is_correct: false
  explanation: La alternativa correcta es 'La P.A. incrementa sumando una diferencia
    constante d, mientras que la P.G. incrementa multiplicando por una razón constante
    r'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué la sucesión S2 = (5, 10, 20, 40) se clasificó
    como P.G.?
  choices:
  - text: Porque el cociente entre términos consecutivos es constante e igual a 2
      (10/5 = 20/10 = 40/20 = 2)
    is_correct: true
  - text: Porque sumó 5 en cada paso
    is_correct: false
  - text: Because es una resta
    is_correct: false
  - text: Porque comenzó en 5
    is_correct: false
  explanation: La alternativa correcta es 'Porque el cociente entre términos consecutivos
    es constante e igual a 2 (10/5 = 20/10 = 40/20 = 2)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de clasificar sucesiones en aritméticas
  o geométricas evaluando si la relación consecutiva es aditiva ($a_{n+1}-a_n=d$)
  o multiplicativa ($b_{n+1}/b_n=r$).
semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.PA_VS_PG
procedimiento:
- 'Paso 1: Analizar la dinámica de cambio de la sucesión (aditiva vs multiplicativa).'
- 'Paso 2: Formular las ecuaciones de P.A. ($a_n = a_1 + (n-1)d$) o P.G. ($b_n = b_1
  \cdot r^{n-1}$) según corresponda.'
- 'Paso 3: Resolver numéricamente los parámetros despejados o interpolados y verificar
  la consistencia.'
errores_correccion: '- **Error 1: Dividir entre $m$ en lugar de $(m+1)$ al calcular
  la diferencia o razón de interpolación.** **Cómo corregirlo:** Para insertar $m$
  medios intermedios, la distancia se divide en $(m+1)$ intervalos.


  - **Error 2: Usar un modelo aritmético para un problema con crecimiento de tasa
  porcentual constante.** **Cómo corregirlo:** Las tasas de variación porcentual constante
  DEBEN modelarse obligatoriamente con progresiones geométricas.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROGRESIONES_COMPARACION.PA_VS_PG.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del modelo de progresiones.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia o razón de interpolación.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por interpolación.
- titulo: ¿Dividen m medios de interpolación el intervalo en m + 1 partes?
  respuesta: Sí
  solucion_pasos:
  - Sí, $m$ términos intermedios generan $m+1$ saltos.
- titulo: ¿Supera el modelo geométrico al aritmético en el largo plazo?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la dominancia del crecimiento exponencial sobre el lineal.
errores_frecuentes:
- Dividir el intervalo entre m en lugar de (m + 1) al calcular la diferencia de interpolación
  de m medios.
- Modelar un incremento porcentual constante utilizando una progresión aritmética
  de suma fija.
- Declarar la razón multiplicativa r con la diferencia aditiva d al formular el término
  general.
- Declarar que la interpolación de medios geométricos exige que los extremos tengan
  signos opuestos.
- Restar los extremos en lugar de dividirlos al calcular la razón de interpolación
  geométrica.
afirmaciones_verdaderas:
- La progresión aritmética modela cambios aditivos constantes y la geométrica modela
  cambios multiplicativos constantes.
- Para interpolar $m$ medios entre $A$ y $B$, se divide el intervalo entre $(m+1)$
  saltos.
