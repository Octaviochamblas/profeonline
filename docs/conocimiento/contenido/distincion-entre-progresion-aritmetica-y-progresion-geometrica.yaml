semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.PA_VS_PG
resumen_inicial: 'La distinción entre progresión aritmética (P.A.) y progresión geométrica (P.G.) contrasta la ley de formación aditiva constante ($a_n = a_{n-1} + d$) frente a la ley de formación multiplicativa constante ($a_n = a_{n-1} \cdot r$).'
explicacion_simple: |
  Para comparar rápidamente una P.A. y una P.G.:
  - **Progresión Aritmética (P.A.)**: Se construye **SUMANDO** siempre la misma cantidad ($d$).
    - Ejemplo: $5, 8, 11, 14, 17, \dots$ ($+3$ cada vez). Su crecimiento es una **recta (lineal)**.
  - **Progresión Geométrica (P.G.)**: Se construye **MULTIPLICANDO** siempre por la misma cantidad ($r$).
    - Ejemplo: $5, 10, 20, 40, 80, \dots$ ($\cdot 2$ cada vez). Su crecimiento es una **curva acelerada (exponencial)**.
  - **Prueba diferencial**: Restas constantes $\implies$ P.A. | Divisiones constantes $\implies$ P.G.
explicacion_formal: |
  ### Definición formal y cuadro comparativo

  | Criterio | Progresión Aritmética (P.A.) | Progresión Geométrica (P.G.) |
  | :--- | :--- | :--- |
  | **Operación Generadora** | Adición o Sustracción constante ($d$) | Multiplicación o División constante ($r$) |
  | **Constante Característica** | Diferencia común: $d = a_{n+1} - a_n$ | Razón geométrica: $r = \frac{a_{n+1}}{a_n}$ |
  | **Término General ($a_n$)** | $a_n = a_1 + (n - 1)d$ | $a_n = a_1 \cdot r^{n-1}$ |
  | **Naturaleza del Crecimiento** | Función lineal discreta: $f(n) = dn + c$ | Función exponencial discreta: $g(n) = a_1 \cdot r^{n-1}$ |
  | **Suma Finita de $n$ Términos** | $S_n = \frac{n(a_1 + a_n)}{2}$ | $S_n = a_1 \cdot \frac{r^n - 1}{r - 1} \quad (r \neq 1)$ |

  ### Criterio analítico de clasificación
  Dada la muestra $(a_1, a_2, a_3, a_4)$:
  1. Si $a_2 - a_1 = a_3 - a_2 = a_4 - a_3 = d \implies$ **Progresión Aritmética**.
  2. Si $\frac{a_2}{a_1} = \frac{a_3}{a_2} = \frac{a_4}{a_3} = r \implies$ **Progresión Geométrica**.

  ### Síntesis didáctica
  - Test de Resta: $a_{n+1} - a_n = d \implies$ P.A. (Lineal).
  - Test de División: $\frac{a_{n+1}}{a_n} = r \implies$ P.G. (Exponencial).
definiciones_clave: |
  - **Cambio aditivo (P.A.)**: Variación de magnitud constante que se adiciona periodo a periodo.
  - **Cambio multiplicativo (P.G.)**: Variación proporcional constante que escala la cantidad acumulada.
  - **Tasa de crecimiento lineal vs exponencial**: Ritmo de incremento constante (recta) vs ritmo de incremento acelerado (potencia).
propiedades_relaciones: |
  - **Dominancia exponencial a largo plazo**: Para valores grandes de $n$, cualquier P.G. con $r > 1$ superará a cualquier P.A. positiva.
  - **Transformación logarítmica**: Al aplicar logaritmos a los términos de una P.G. de números positivos, se obtiene una P.A. de diferencia $d = \log(r)$.
ejemplo_guiado:
  enunciado: 'Dada la secuencia $4, 12, 36, 108, \dots$, clasifícala como P.A. o P.G., calcula su constante característica y halla la fórmula de su término general.'
  pasos:
    - 'Paso 1: Evaluamos las restas: $12 - 4 = 8$ y $36 - 12 = 24$. Como las restas cambian ($8 \neq 24$), **no es una P.A.**'
    - 'Paso 2: Evaluamos los cocientes: $\frac{12}{4} = 3$, $\frac{36}{12} = 3$ y $\frac{108}{36} = 3$. Como el cociente es constante ($3$), **es una P.G. con $r = 3$**.'
    - 'Paso 3: Identificamos $a_1 = 4$ y la razón $r = 3$.'
    - 'Paso 4: Escribimos la fórmula del término general: $a_n = 4 \cdot 3^{n-1}$. La secuencia es una **P.G. de razón $r=3$ y $a_n = 4 \cdot 3^{n-1}$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué prueba matemática permite distinguir de forma categórica si una secuencia numérica es una P.A. o una P.G.?'
    choices:
      - {text: 'Calcular las restas entre términos consecutivos (constantes en P.A.) y los cocientes entre términos consecutivos (constantes en P.G.)', is_correct: true}
      - {text: 'Contar si la cantidad de números es par o impar', is_correct: false}
      - {text: 'Multiplicar el primer término por 100', is_correct: false}
      - {text: 'Sumar todos los números y dividirlos por la mitad', is_correct: false}
    explanation: 'La alternativa correcta es ''Calcular las restas entre términos consecutivos (constantes en P.A.) y los cocientes entre términos consecutivos (constantes en P.G.)''. Test de resta vs cociente.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la secuencia $10, 20, 30, 40, 50$, ¿cómo se clasifica y cuál es su constante?'
    choices:
      - {text: 'Es una Progresión Aritmética (P.A.) de diferencia constante $d = 10$', is_correct: true}
      - {text: 'Es una Progresión Geométrica (P.G.) de razón constante $r = 2$', is_correct: false}
      - {text: 'Es una serie geométrica infinita convergente', is_correct: false}
      - {text: 'Es una función cuadrática de vértice en $(0,0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Es una Progresión Aritmética (P.A.) de diferencia constante $d = 10$''. $20-10=10, 30-20=10$. Sus restas son constantes.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular la diferencia entre pares consecutivos: $a_2 - a_1$ y $a_3 - a_2$.'
  - 'Paso 2: Calcular el cociente entre pares consecutivos: $\frac{a_2}{a_1}$ y $\frac{a_3}{a_2}$.'
  - 'Paso 3: Si las restas son constantes, clasificar como P.A. ($d = a_{n+1} - a_n$); si los cocientes son constantes, clasificar como P.G. ($r = \frac{a_{n+1}}{a_n}$).'
  - 'Paso 4: Escribir la fórmula del término general correspondiente ($a_1 + (n-1)d$ para P.A. o $a_1 \cdot r^{n-1}$ para P.G.).'
errores_correccion: |
  - **Error 1:** Tratar a una progresión geométrica como si aumentara por una diferencia constante. **Cómo corregirlo:** La P.G. avanza multiplicando por $r$; **su término general usa potencias $a_1 \cdot r^{n-1}$**.
  - **Error 2:** Creer que una P.A. con diferencia grande crecerá más rápido a largo plazo que una P.G. **Cómo corregirlo:** A largo plazo, el **crecimiento exponencial de la P.G. siempre supera al lineal de la P.A.**.
ejemplos:
  - titulo: 'Clasificación de secuencia aditiva'
    enunciado: 'Para $7, 12, 17, 22$, ¿es una P.A. con $d = 5$?'
    alternativas:
      - 'Sí, pues $12 - 7 = 5$ y $17 - 12 = 5$'
      - 'No, es una P.G.'
      - 'No, la diferencia es 7'
    respuesta: 'Sí, pues $12 - 7 = 5$ y $17 - 12 = 5$'
    solucion_pasos:
      - '1. Restas: $12-7=5, 17-12=5, 22-17=5$.'
      - '2. Restas constantes $\implies$ P.A. con $d=5$.'
  - titulo: 'Clasificación de secuencia multiplicativa'
    enunciado: 'Para $3, 6, 12, 24$, ¿es una P.G. con $r = 2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cocientes: $6/3=2, 12/6=2, 24/12=2 \implies$ P.G. con $r=2$.'
  - titulo: 'Comparación a largo plazo'
    enunciado: 'Para $n=10$, ¿qué término es mayor: la P.A. $a_n = 100 + 10(n-1)$ o la P.G. $b_n = 2 \cdot 2^{n-1}$?'
    respuesta: 'La P.G. bn'
    solucion_pasos:
      - 'P.A.: $a_{10} = 100 + 90 = 190$.'
      - 'P.G.: $b_{10} = 2 \cdot 2^9 = 2 \cdot 512 = 1.024$. La P.G. es mayor.'
  - titulo: 'Secuencia constante'
    enunciado: 'La secuencia $5, 5, 5, 5$ ¿puede considerarse P.A. con $d=0$ y P.G. con $r=1$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Cumple $5-5=0$ y $5/5=1$.'
errores_frecuentes:
  - 'La razón multiplicativa r equivale numéricamente a la diferencia aditiva d al formular el término general.'
  - 'Una progresión aritmética con diferencia positiva supera a largo plazo a cualquier progresión geométrica.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Clasificar una progresión como geométrica evaluando únicamente las restas de los primeros dos términos.'
  - 'Las progresiones geométricas no pueden tener términos con signos alternados.'
afirmaciones_verdaderas:
  - 'Una progresión es aritmética si la diferencia entre términos consecutivos es constante ($d = a_{n+1} - a_n$) y geométrica si el cociente es constante ($r = \frac{a_{n+1}}{a_n}$).'
  - 'El crecimiento de una progresión aritmética es lineal ($dn + c$), mientras que el de una progresión geométrica es exponencial ($a_1 \cdot r^{n-1}$).'
al_terminar_debes_poder: 'Distinguir entre una progresión aritmética y una progresión geométrica mediante el test de restas y cocientes.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
estado: publicado
