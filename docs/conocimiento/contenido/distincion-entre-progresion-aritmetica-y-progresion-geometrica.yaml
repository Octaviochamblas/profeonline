semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.PA_VS_PG
resumen_inicial: 'Distinción entre progresión aritmética y progresión geométrica: concepto
  y desarrollo dentro de Comparación y modelamiento con progresiones.'
explicacion_simple: En el examen PAES, casi nunca te dicen 'hola, soy una progresión aritmética'.
  Te entregan un problema con números crudos. Si te equivocas al clasificarlos, aplicarás
  la fórmula equivocada. Es vital saber qué bestia enfrentamos.
explicacion_formal: "El test de paternidad de las sucesiones:\nTe dan la lista: $3, 12, 21,\
  \ 30$\n- **Prueba A (Restar):** $12-3=9$. $21-12=9$. $30-21=9$. \n- ¡Bingo! Pasa la prueba\
  \ aritmética. Su diferencia es $d=9$.\n\nTe dan la lista: $3, 12, 48, 192$\n- **Prueba A\
  \ (Restar):** $12-3=9$. $48-12=36$. \n- ¡Fallo! No es aritmética. Vamos al plan B.\n- **Prueba\
  \ B (Dividir):** $12/3=4$. $48/12=4$. $192/48=4$.\n- ¡Bingo! Es una geométrica con razón\
  \ $r=4$.\n\nCuidado con las 'trampas PAES': Secuencias como $1, 4, 9, 16, 25$. Si haces\
  \ la prueba de restar da $3, 5, 7, 9$. Si haces la de dividir da $4, 2.25, 1.77$. ¡No pasa\
  \ ninguna! No te asustes, no todo en la vida es P.A. o P.G. (estas son los cuadrados perfectos)."
definiciones_clave: '- **Distinción entre progresión aritmética y progresión geométrica**:
  Concepto fundamental dentro del estudio de Comparación y modelamiento con progresiones.'
propiedades_relaciones: '- **Propiedades de Distinción entre progresión aritmética y progresión
  geométrica**: Relaciones de cambio y fórmulas estructurales de comparación y modelamiento
  con progresiones.'
ejemplo_guiado:
  enunciado: Clasifica la sucesión 7, 21, 63, 189 como aritmética, geométrica o ninguna de
    las dos.
  pasos:
  - 'Aplico la prueba de resta: 21 menos 7 es 14; 63 menos 21 es 42. Como son distintos, no
    es aritmética.'
  - 'Aplico la prueba de división: 21 dividido entre 7 es 3; 63 dividido entre 21 es 3; 189
    dividido entre 63 es 3.'
  - Como las tres divisiones dan el mismo resultado, concluyo que es una progresión geométrica
    con razón 3.
