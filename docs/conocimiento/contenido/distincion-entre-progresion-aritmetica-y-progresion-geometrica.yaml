procedimiento:
- 'Paso 1: Toma el 2do y 1er término. Réstalos. Luego divide el 2do entre el 1ro.'
- 'Paso 2: Haz lo mismo con el 3er y 2do término.'
- 'Paso 3: Si las RESTAS dieron igual, usa fórmulas de P.A.'
- 'Paso 4: Si las DIVISIONES dieron igual, usa fórmulas de P.G.'
- 'Paso 5: Si ninguna da igual, detente, el problema se resuelve con otra lógica.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en distinción entre progresión aritmética y progresión geométrica.
ejemplos:
- titulo: Clasificando la deuda
  enunciado: 'Tus cuotas a pagar son: mes 1 = $500, mes 2 = $550, mes 3 = $605, mes 4 = $665.5.
    ¿Qué tipo de sucesión es?'
  solucion_pasos:
  - 'Prueba A: 550 - 500 = 50. 605 - 550 = 55. Fallo, no es Aritmética.'
  - 'Prueba B: 550 / 500 = 1.1. 605 / 550 = 1.1. 665.5 / 605 = 1.1.'
  - 'Conclusión: Es Geométrica (aumenta un 10% mensual).'
- titulo: Ejemplo 1
  enunciado: ¿Qué tipo de progresión es 8, 8, 8, 8?
  alternativas:
  - Aritmética con d igual a 0 (también geométrica con r igual a 1)
  - Solo geométrica
  - Ninguna de las dos
  respuesta: Aritmética con d igual a 0 (también geométrica con r igual a 1)
  solucion_pasos:
  - Una sucesión constante cumple ambas pruebas al mismo tiempo.
- titulo: Ejemplo 2
  enunciado: ¿Qué tipo de sucesión es 1, 8, 27, 64?
  alternativas:
  - Ninguna de las dos, son cubos perfectos
  - Aritmética
  - Geométrica
  respuesta: Ninguna de las dos, son cubos perfectos
  solucion_pasos:
  - Ni la resta ni la división entre términos consecutivos dan un resultado constante.
- titulo: ¿Una sucesión puede no ser ni aritmética ni geométrica?
  respuesta: Sí
  solucion_pasos:
  - Muchas sucesiones, como los cuadrados o cubos perfectos, no cumplen ninguna de las dos
    pruebas.
- titulo: ¿Basta con comprobar los dos primeros términos para clasificar una sucesión?
  respuesta: 'No'
  solucion_pasos:
  - Hay que comprobar todos los pares consecutivos disponibles antes de concluir.
errores_frecuentes:
- 'Detener la verificación en el segundo término asumiendo que el patrón se mantiene (Ej:
  $2, 4, 8, 10$ parece geométrica al principio porque $4/2=2$ y $8/4=2$, pero el 10 la arruina).'
- Confundir P.A. con P.G. al trabajar con fracciones.
- Aplicar solo la prueba de resta y concluir que la sucesión 'no es progresión' sin probar
  la división.
- Detener la verificación tras comprobar solo el primer par de términos.
- Confundir una sucesión de cuadrados o cubos perfectos con una progresión aritmética o geométrica.
afirmaciones_verdaderas:
- La formulación de distinción entre progresión aritmética y progresión geométrica mantiene
  la regularidad de la sucesión.
- Para clasificar una sucesión conviene aplicar la prueba de resta y luego la de división,
  ya que son independientes entre sí.
al_terminar_debes_poder: Resolver problemas prácticos utilizando distinción entre progresión
  aritmética y progresión geométrica.
