semantic_id: MAT.NUM.PROGRESIONES_COMPARACION.PA_VS_PG
resumen_inicial: 'La distinción entre progresión aritmética (PA) y progresión geométrica (PG) radica en el operador generador: la PA aplica adición constante ($a_{n+1} - a_n = d$, crecimiento lineal) mientras que la PG aplica multiplicación constante ($\frac{a_{n+1}}{a_n} = r$, crecimiento exponencial).'
explicacion_simple: |
  Para saber si una sucesión es una **progresión aritmética (PA)** o una **progresión geométrica (PG)**, analiza cómo se pasa de un término al siguiente:
  - **Progresión Aritmética (PA)**:
    - Se **suma o resta** un número fijo (diferencia común $d$).
    - Ejemplo: $3, 6, 9, 12, 15 \dots$ ($+3$ en cada paso).
    - Crecimiento en línea recta (**lineal**).
  - **Progresión Geométrica (PG)**:
    - Se **multiplica** por un número fijo (razón geométrica $r$).
    - Ejemplo: $3, 6, 12, 24, 48 \dots$ ($\cdot 2$ en cada paso).
    - Crecimiento acelerado en curva (**exponencial**).
  - Aunque empiecen con los mismos primeros números ($3$ y $6$), a largo plazo la progresión geométrica crece a una velocidad inmensamente mayor.

  ![Distinción entre PA y PG](/static/img/nodos/distincion-entre-progresion-aritmetica-y-progresion-geometrica-intro.svg)
explicacion_formal: |
  ### Tabla Comparativa Estructural y Analítica
  | Propiedad | Progresión Aritmética (PA) | Progresión Geométrica (PG) |
  | :--- | :--- | :--- |
  | **Operador base** | Adición / Sustracción | Multiplicación / División |
  | **Invariante característico** | Diferencia: $a_{k+1} - a_k = d$ | Cociente: $\frac{a_{k+1}}{a_k} = r$ |
  | **Término general** | $a_n = a_1 + (n - 1)d$ | $a_n = a_1 \cdot r^{n-1}$ |
  | **Naturaleza funcional** | Función afín/lineal $f(n) = dn + c$ | Función exponencial $f(n) = c \cdot r^n$ |
  | **Media local** | Aritmética: $a_k = \frac{a_{k-1} + a_{k+1}}{2}$ | Geométrica: $(a_k)^2 = a_{k-1} \cdot a_{k+1}$ |
  | **Suma de $n$ términos** | $S_n = \frac{n(a_1 + a_n)}{2}$ | $S_n = \frac{a_1(r^n - 1)}{r - 1}$ |

  ### Teorema de Dominancia Asintótica
  Para cualesquiera $a_1 > 0$, $d > 0$ y $r > 1$:
  $$\lim_{n \to \infty} \frac{a_1 + (n-1)d}{a_1 \cdot r^{n-1}} = 0$$
  Toda progresión geométrica creciente eventualmente supera en magnitud a cualquier progresión aritmética, independientemente de cuán grande sea la diferencia $d$ de la PA.

  ### Síntesis didáctica
  - PA: $a_{n+1} - a_n = d$ (adición constante).
  - PG: $\frac{a_{n+1}}{a_n} = r$ (multiplicación constante).
definiciones_clave: |
  - **Diferencia común ($d$)**: Constante aditiva que define una progresión aritmética.
  - **Razón geométrica ($r$)**: Constante multiplicativa que define una progresión geométrica.
  - **Dominancia asintótica**: Principio por el cual el crecimiento exponencial supera a todo crecimiento polinomial o lineal.
propiedades_relaciones: |
  - **Isomorfismo logarítmico**: Si $(a_n)$ es una PG con términos positivos y razón $r$, entonces $(\log a_n)$ es una PA con diferencia $d = \log r$.
  - **Puntos de coincidencia inicial**: Dos progresiones pueden compartir sus dos primeros términos ($a_1, a_2$) y discrepar drásticamente a partir del tercer término ($a_3$).
ejemplo_guiado:
  enunciado: 'Se tienen dos sucesiones con $a_1 = 4$ y $a_2 = 12$. Determina el valor del término $a_5$ si la sucesión es: a) una progresión aritmética, y b) una progresión geométrica.'
  imagen: '/static/img/nodos/distincion-entre-progresion-aritmetica-y-progresion-geometrica-ejemplos.svg'
  pasos:
    - 'Paso 1: Si es una **PA**, la diferencia es $d = a_2 - a_1 = 12 - 4 = 8$.'
    - 'Paso 2: Calculamos el término $a_5$ en la PA: $a_5 = a_1 + 4d = 4 + 4(8) = 4 + 32 = **36$**.'
    - 'Paso 3: Si es una **PG**, la razón es $r = \frac{a_2}{a_1} = \frac{12}{4} = 3$.'
    - 'Paso 4: Calculamos el término $a_5$ en la PG: $a_5 = a_1 \cdot r^4 = 4 \cdot 3^4 = 4 \cdot 81 = **324$**.'
    - 'Paso 5: Conclusión: En la posición $n=5$, el término de la PG ($324$) es nueve veces mayor que el de la PA ($36$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la prueba matemática para distinguir si una sucesión es aritmética o geométrica?'
    choices:
      - {text: 'Calcular si las diferencias consecutivas son constantes ($a_{n+1} - a_n = d$) o si los cocientes consecutivos son constantes ($\frac{a_{n+1}}{a_n} = r$)', is_correct: true}
      - {text: 'Comprobar si los números son pares o impares', is_correct: false}
      - {text: 'Multiplicar el primer término por el último', is_correct: false}
      - {text: 'Calcular únicamente la raíz cuadrada del primer término', is_correct: false}
    explanation: 'La alternativa correcta es ''Calcular si las diferencias consecutivas son constantes ($a_{n+1} - a_n = d$) o si los cocientes consecutivos son constantes ($\frac{a_{n+1}}{a_n} = r$)''. Es el criterio definitorio entre crecimiento aditivo y multiplicativo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la sucesión $(5, 10, 20, 40, \dots)$, ¿qué tipo de progresión es?'
    choices:
      - {text: 'Progresión geométrica con razón $r = 2$', is_correct: true}
      - {text: 'Progresión aritmética con diferencia $d = 5$', is_correct: false}
      - {text: 'Progresión aritmética con diferencia $d = 10$', is_correct: false}
      - {text: 'Ninguna de las dos', is_correct: false}
    explanation: 'La alternativa correcta es ''Progresión geométrica con razón $r = 2$''. Los cocientes son constantes: $10/5 = 2, 20/10 = 2, 40/20 = 2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Calcular las diferencias consecutivas $\Delta_k = a_{k+1} - a_k$ para los términos disponibles.'
  - 'Paso 2: Calcular los cocientes consecutivos $R_k = \frac{a_{k+1}}{a_k}$.'
  - 'Paso 3: Si todos los $\Delta_k$ son iguales a una constante $d$, clasificar como PA.'
  - 'Paso 4: Si todos los $R_k$ son iguales a una constante $r$, clasificar como PG.'
  - 'Paso 5: Aplicar la fórmula correspondiente de término general o suma según la clasificación.'
errores_correccion: |
  - **Error 1:** Clasificar una sucesión mirando solo los dos primeros términos ($a_1, a_2$). **Cómo corregirlo:** Se requieren **al menos tres términos** ($a_1, a_2, a_3$) para comparar si la relación constante es aditiva o multiplicativa.
  - **Error 2:** Aplicar la fórmula de Gauss de la PA para sumar términos de una PG. **Cómo corregirlo:** La PG requiere la **fórmula telescópica exponencial**: $S_n = \frac{a_1(r^n - 1)}{r - 1}$.
ejemplos:
  - titulo: 'Clasificación de sucesión por restas'
    enunciado: '¿La sucesión $7, 12, 17, 22, 27$ es una PA o una PG?'
    alternativas:
      - 'Es una PA con diferencia común $d = 5$'
      - 'Es una PG con razón $r = 5$'
      - 'Es una PG con razón $r = 1,7$'
    respuesta: 'Es una PA con diferencia común $d = 5$'
    solucion_pasos:
      - '1. $12-7=5, 17-12=5, 22-17=5$. Restas constantes $\implies$ PA.'
  - titulo: 'Clasificación de sucesión por cocientes'
    enunciado: '¿La sucesión $2, 6, 18, 54, 162$ es una PA o una PG?'
    alternativas:
      - 'Es una PG con razón geométrica $r = 3$'
      - 'Es una PA con diferencia común $d = 4$'
      - 'Es una PA con diferencia común $d = 12$'
    respuesta: 'Es una PG con razón geométrica $r = 3$'
    solucion_pasos:
      - '1. $6/2=3, 18/6=3, 54/18=3$. Cocientes constantes $\implies$ PG.'
  - titulo: 'Comparación asintótica'
    enunciado: '¿A partir de un número $n$ suficientemente grande, una PG con $r > 1$ siempre supera a una PA con $d > 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Por el teorema de dominancia exponencial sobre el crecimiento lineal.'
  - titulo: 'Sucesión constante compartida'
    enunciado: '¿La sucesión constante $5, 5, 5, 5, \dots$ puede considerarse simultáneamente una PA (con $d=0$) y una PG (con $r=1$)?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $5-5=0$ (PA con $d=0$) y $5/5=1$ (PG con $r=1$).'
errores_frecuentes:
  - 'Determinar si una progresión es aritmética o geométrica considerando únicamente dos términos iniciales.'
  - 'Aplicar la fórmula de la media aritmética a los extremos de una progresión geométrica.'
  - 'Asumir que toda progresión aritmética termina superando a una geométrica si la diferencia inicial es muy grande.'
  - 'Utilizar la fórmula de la suma de Gauss $S_n = \frac{n(a_1+a_n)}{2}$ para calcular la suma de una PG.'
  - 'Confundir la razón geométrica $r$ con la diferencia común $d$ en problemas de enunciados verbales.'
afirmaciones_verdaderas:
  - 'En una progresión aritmética la diferencia entre términos consecutivos es constante ($a_{n+1} - a_n = d$), mientras que en una geométrica el cociente es constante ($\frac{a_{n+1}}{a_n} = r$).'
  - 'Para términos positivos y $r > 1$, una progresión geométrica supera asintóticamente a cualquier progresión aritmética para valores de $n$ suficientemente grandes.'
al_terminar_debes_poder: |
