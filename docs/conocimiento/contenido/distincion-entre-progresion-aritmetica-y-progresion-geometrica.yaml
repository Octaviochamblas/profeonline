  QUÉ: Distinguir rigurosamente entre progresiones aritméticas y progresiones geométricas según sus propiedades estructurales y funcionales.
  CÓMO: Comparar invariantes consecutivos ($a_{n+1} - a_n = d$ vs $\frac{a_{n+1}}{a_n} = r$) y seleccionar las fórmulas canónicas de término general y suma.
