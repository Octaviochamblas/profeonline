semantic_id: MAT.ALG.MCD_ALGEBRAICO.COEFICIENTE_MONOMIOS
resumen_inicial: El M.C.D. numérico de un grupo de monomios es el entero positivo
  más grande que divide exactamente a todos sus coeficientes.
explicacion_simple: 'Para hallar la parte numérica del M.C.D. entre monomios, nos
  enfocamos exclusivamente en los coeficientes (los números que multiplican a las
  letras) e ignoramos temporalmente las variables.

  El objetivo es encontrar el entero positivo más grande que pueda dividir a cada
  uno de esos coeficientes numéricos sin dejar resto.

  Este número corresponde al Máximo Común Divisor aritmético tradicional entre los
  valores absolutos de los coeficientes.'
explicacion_formal: 'Dado un conjunto de monomios con coeficientes enteros $\{c_1,
  c_2, \dots, c_k\}$, el **M.C.D. numérico** $C_{\text{MCD}}$ se define como el Gran
  Divisor Común sobre sus valores absolutos:


  $$C_{\text{MCD}} = \operatorname{gcd}(|c_1|, |c_2|, \dots, |c_k|) = \prod_{p} p^{\min_i(v_p(|c_i|))}$$


  **Desglose de la fórmula:**

  - $\operatorname{gcd}(|c_1|, \dots, |c_k|)$: Denota la función M.C.D. sobre los
  valores absolutos, asegurando un resultado entero positivo.

  - $\prod_p p^{\dots}$: Expresa la multiplicación de todos los factores primos $p$
  que dividen a todos los coeficientes.

  - $v_p(|c_i|)$: Representa el exponente del primo $p$ en la descomposición de $|c_i|$,
  tomando el valor mínimo $\min_i$ entre los monomios para garantizar divisibilidad
  exacta simultánea.


  > **Complemento didáctico:** El M.C.D. numérico extrae la mayor constante entera
  escalar que se puede factorizar de cada uno de los términos de la expresión.'
definiciones_clave: '- **M.C.D. de coeficientes**: El mayor número entero positivo
  que divide exactamente a todos los coeficientes numéricos de un conjunto de monomios.

  - **Descomposición en factores primos**: Expresión de un número entero como producto
  de factores primos para calcular divisores comunes.'
propiedades_relaciones: '- **Invarianza por signo**: El M.C.D. numérico se toma siempre
  como un entero positivo, sin importar si los coeficientes originales son positivos
  o negativos.

  - **Independencia literal**: El cálculo del M.C.D. numérico es totalmente independiente
  de las variables o exponentes presentes en la parte literal de los monomios.'
ejemplo_guiado:
  enunciado: Tres servidores informáticos procesan cargas de datos representadas por
    $24a^3$, $36a^2b$ y $60a^4$ gigabytes. Determina el M.C.D. numérico entre sus
    coeficientes y evalúa el término común $12a^2$ para $a = 3$.
  pasos:
  - 'Paso 1: Descomponer los coeficientes numéricos en factores primos: $24 = 2^3
    \cdot 3$, $36 = 2^2 \cdot 3^2$ y $60 = 2^2 \cdot 3 \cdot 5$.'
  - 'Paso 2: Tomar los factores primos comunes elevados a su menor exponente: $2^2
    \cdot 3^1 = 4 \cdot 3 = 12$. El M.C.D. numérico es $12$.'
  - 'Paso 3: Evaluar la expresión $12a^2$ para $a = 3$: $12 \cdot (3)^2 = 12 \cdot
    9 = 108\text{ GB}$.'
