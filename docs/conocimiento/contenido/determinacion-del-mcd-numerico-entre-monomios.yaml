semantic_id: MAT.ALG.MCD_ALGEBRAICO.COEFICIENTE_MONOMIOS
resumen_inicial: 'Determinación del M.C.D. numérico entre monomios: concepto, reglas
  operativas y simplificación en M.C.D. algebraico.'
explicacion_simple: Antes de lidiar con las letras, debemos limpiar el terreno de
  los números. Todo monomio tiene un coeficiente (el número que va adelante). Extraer
  el MCD algebraico siempre empieza por encontrar el MCD tradicional de estos coeficientes.
explicacion_formal: '### Definición formal


  El MCD algebraico utiliza el MCD aritmético estándar para su parte numérica.


  ### Desarrollo didáctico


  Para los coeficientes numéricos (los números grandes al inicio de cada término),
  el MCD se calcula exactamente igual que en aritmética básica.


  Debes buscar el número más grande que divida a todos los coeficientes a la vez.


  Por ejemplo, para los términos $12x$, $18y$ y $24z$:

  - Los divisores de 12 son: 1, 2, 3, 4, 6, 12.

  - Los divisores de 18 son: 1, 2, 3, 6, 9, 18.

  - Los divisores de 24 son: 1, 2, 3, 4, 6, 8, 12, 24.


  El número más grande que aparece en las tres listas es el **6**. Por lo tanto, el
  MCD de los coeficientes es 6. Es fundamental calcular esto correctamente porque
  es el primer paso (y la mitad del trabajo) para factorizar por factor común.'
definiciones_clave: '- **Determinación del M.C.D. numérico entre monomios**: Procedimiento
  o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a determinación del m.c.d. numérico
  entre monomios.'
ejemplo_guiado:
