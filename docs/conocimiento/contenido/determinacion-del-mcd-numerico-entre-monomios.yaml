procedimiento:
- 'Paso 1: Extraer los coeficientes numéricos de cada monomio y tomar sus valores
  absolutos.'
- 'Paso 2: Realizar la descomposición en factores primos de cada uno de los números.'
- 'Paso 3: Identificar los factores primos compartidos por todos los coeficientes.'
- 'Paso 4: Multiplicar dichos factores primos elevados a su menor exponente para obtener
  el M.C.D. numérico.'
errores_correccion: '- **Error común:** Confundir el M.C.D. numérico (mayor divisor
  común) con el m.c.m. numérico (mínimo común múltiplo) al calcular los coeficientes.

  - **Cómo corregirlo:** Para el M.C.D., toma únicamente los factores primos comunes
  con el MENOR exponente. Para el m.c.m., tomarías comunes y no comunes al mayor exponente.'
ejemplos:
- titulo: 'Ejemplo 1: M.C.D. con coeficientes enteros positivos'
  enunciado: ¿Cuál es el M.C.D. numérico entre los monomios $15x^2$, $30x^3$ y $45x$?
  alternativas:
  - $15$
  - $5$
  - $90$
  respuesta: $15$
  solucion_pasos:
  - 1. Los coeficientes son $15$, $30$ y $45$.
  - '2. Descomposición: $15 = 3 \cdot 5$, $30 = 2 \cdot 3 \cdot 5$, $45 = 3^2 \cdot
    5$.'
  - '3. Factores comunes con menor exponente: $3^1 \cdot 5^1 = 15$.'
- titulo: 'Ejemplo 2: Coeficientes con signos negativos'
  enunciado: Determina el M.C.D. numérico entre $-16a^3b$ y $24ab^2$.
  alternativas:
  - $8$
  - $-8$
  - $48$
  respuesta: $8$
  solucion_pasos:
  - '1. Tomar los valores absolutos de los coeficientes: $|-16| = 16$ y $|24| = 24$.'
  - 2. $16 = 2^4$ y $24 = 2^3 \cdot 3$.
  - '3. Factor común: $2^3 = 8$. Por convención, el M.C.D. numérico es un entero positivo
    ($8$).'
- titulo: ¿El M.C.D. numérico entre coeficientes primos entre sí (como 7 y 10) es
    igual a 1?
  respuesta: Sí
  solucion_pasos:
  - Sí. Cuando dos o más coeficientes no comparten factores primos comunes aparte
    del 1, su M.C.D. numérico es 1.
- titulo: ¿El M.C.D. numérico puede ser un número negativo si todos los coeficientes
    de los monomios son negativos?
  respuesta: 'No'
  solucion_pasos:
  - No. Por definición estándar en álgebra, el M.C.D. numérico se define siempre como
    un entero positivo.
errores_frecuentes:
- El M.C.D. numérico de $12x^2$ y $18x^3$ es $36$.
- El M.C.D. numérico de $-14a$ y $21b$ es $-7$.
- Si los coeficientes de dos monomios son $8$ y $12$, su M.C.D. numérico es $2$ porque
  es un número par divisor.
- El M.C.D. numérico de dos monomios se obtiene multiplicando todos los coeficientes.
- Para hallar el M.C.D. numérico entre $15$ y $25$ se deben sumar sus valores absolutos.
afirmaciones_verdaderas:
- El M.C.D. numérico entre monomios se calcula aplicando la función M.C.D. estándar
  a los valores absolutos de sus coeficientes.
- El M.C.D. numérico de dos monomios siempre es mayor que cero.
al_terminar_debes_poder: Al finalizar este recurso podrás determinar con precisión
  el M.C.D. numérico de cualquier conjunto de monomios mediante factorización prima.
