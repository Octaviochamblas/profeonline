  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica un par de valores $(x, y)$ que correspondan entre sí.'
- 'Paso 2: Multiplica ambas magnitudes ($x \cdot y$).'
- 'Paso 3: El resultado de esa multiplicación es la constante $k$.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de la constante
  de proporcionalidad inversa.
ejemplos:
- titulo: Hallando k inversa
  enunciado: Si $4$ tractores aran un campo en $6$ horas, ¿cuál es la constante de proporcionalidad
    inversa?
  solucion_pasos:
  - El par de valores es $x=4$ tractores, $y=6$ horas.
  - Multiplicamos $x \cdot y = 4 \cdot 6 = 24$.
  - La constante es $k=24$. (Se requieren 24 horas-tractor para arar el campo).
- titulo: ¿Qué pasa si divido?
  respuesta: Obtienes un número sin sentido constante.
  solucion_pasos:
  - Si haces $6/4 = 1.5$. Si ahora usas 8 tractores (demorarán 3 horas), el cociente sería
    $3/8 = 0.375$. La división no es constante, el producto sí ($4\cdot6=24$ y $8\cdot3=24$).
- titulo: Ejemplo 2
  enunciado: Si 5 grifos llenan un estanque en 12 horas, ¿cuál es la constante de proporcionalidad
    inversa?
  alternativas:
  - '60'
  - '17'
  - 2,4
  respuesta: '60'
  solucion_pasos:
  - 5 por 12 es igual a 60.
- titulo: ¿La constante de proporcionalidad inversa puede cambiar según el par de valores
    usado, si la relación es realmente inversa?
  respuesta: 'No'
  solucion_pasos:
  - En una proporción inversa verdadera, el producto es el mismo sin importar qué par de valores
    correspondientes se use.
errores_frecuentes:
- Dividir los valores en lugar de multiplicarlos (confundir con proporción directa).
- Sumar $x+y$ para hallar la constante.
- Creer que la constante cambia si se agregan decimales.
- Dividir los dos valores en vez de multiplicarlos al calcular la constante.
- Calcular la constante con pares de datos que no corresponden entre sí.
afirmaciones_verdaderas:
- La propiedad de cálculo de la constante de proporcionalidad inversa preserva la consistencia
  lógica.
- La constante de proporcionalidad inversa k representa el trabajo total o cantidad fija que
  se reparte entre las dos magnitudes.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de la constante
  de proporcionalidad inversa.
