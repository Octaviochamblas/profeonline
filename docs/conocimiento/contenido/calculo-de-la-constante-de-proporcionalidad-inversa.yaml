  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar un par conocido de valores emparejados $(x_0, y_0)$.'
- 'Paso 2: Multiplicar ambos valores para obtener la constante: $k = x_0 \cdot y_0$.'
- 'Paso 3: Emplear $y = \frac{k}{x}$ o $x = \frac{k}{y}$ para calcular cualquier valor solicitado.'
errores_correccion: "- **Error 1: Dividir en lugar de multiplicar ($k = \frac{y}{x}$).** **Cómo corregirlo:** La división es la constante directa; en la INVERSA se MULTIPLICA $k = x \\cdot y$.\n- **Error 2: Olvidar poner $k$ en el numerador al despejar.** **Cómo corregirlo:** La fórmula de despeje es $y = \\frac{k}{x}$ (con $k$ arriba)."
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x = 15$ e $y = 4$ son inversamente proporcionales, ¿cuánto vale la constante $k$?
  alternativas:
  - $60$
  - $3,75$
  - $19$
  respuesta: $60$
  solucion_pasos:
  - $k = x \cdot y = 15 \cdot 4 = 60$.
- titulo: Ejemplo 2
  enunciado: Con $k = 72$, ¿cuál es el valor de $y$ cuando $x = 8$?
  alternativas:
  - $9$
  - $576$
  - $64$
  respuesta: $9$
  solucion_pasos:
  - $y = \frac{72}{8} = 9$.
- titulo: ¿Es k = 24 si x = 3 e y = 8 en proporción inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, $k = 3 \cdot 8 = 24$.
  alternativas:
  - texto: Sí, el producto 3 · 8 = 24 define la constante
    es_correcta: true
    retroalimentacion: ¡Correcto! Producto exacto.
  - texto: No, k es 8 / 3
    es_correcta: false
    retroalimentacion: Incorrecto, la constante inversa es el producto.
  - texto: No, k es 11
    es_correcta: false
    retroalimentacion: Incorrecto, 11 es la suma.
- titulo: ¿Permite la constante k calcular cualquiera de las dos variables?
  respuesta: Sí
  solucion_pasos:
  - Sí, $y = \frac{k}{x}$ y $x = \frac{k}{y}$.
  alternativas:
  - texto: Sí, conociendo k y una variable se despeja la otra dividiendo
    es_correcta: true
    retroalimentacion: ¡Correcto! Despeje simétrico.
  - texto: No, solo permite despejar y
    es_correcta: false
    retroalimentacion: Incorrecto, la relación es completamente simétrica.
  - texto: No, se necesita una segunda constante
    es_correcta: false
    retroalimentacion: Incorrecto, una sola constante $k$ define todo el sistema.
errores_frecuentes:
- Dividir las variables en vez de multiplicarlas.
- Invertir la fracción al despejar ($x/k$ en vez de $k/x$).
- 'Omitir las unidades dimensionales compuestas (ej: $\text{km}$, $\text{obrero-días}$).'
- Cambiar el valor de $k$ para diferentes puntos de la misma situación.
afirmaciones_verdaderas:
- La constante de proporcionalidad inversa es $k = x \cdot y$.
- Representa la magnitud acumulada total del sistema.
- Permite calcular valores desconocidos mediante $y = \frac{k}{x}$ o $x = \frac{k}{y}$.
al_terminar_debes_poder: '![Síntesis de constante inversa](/static/img/nodos/calculo-de-la-constante-de-proporcionalidad-inversa-resumen.svg)


  QUÉ: Calcular e interpretar la constante de proporcionalidad inversa $k$.


  CÓMO: Efectuando la multiplicación $k = x \cdot y$ a partir de un par conocido de datos y empleándola para despejar incógnitas mediante $y = \frac{k}{x}$ o $x = \frac{k}{y}$.'
