semantic_id: MAT.NUM.PROP_INVERSA.CONSTANTE_PROPORCIONALIDAD
resumen_inicial: 'Cálculo de la constante de proporcionalidad inversa: concepto y
  propiedades fundamentales en Proporcionalidad inversa.'
explicacion_simple: Si contratas a 3 pintores y demoran 4 días, el 'esfuerzo total'
  de la obra es de 12 días-pintor. Ese número global que engloba el trabajo o el tamaño
  total del problema no cambia por más que varíes a los trabajadores. Es nuestra nueva
  constante.
explicacion_formal: "En una **proporcionalidad inversa**, el comportamiento matemático\
  \ central es que el área del rectángulo formado por $x$ e $y$ siempre es la misma.\
  \ \n\nSi multiplicas cualquier valor de $y$ por su correspondiente $x$, siempre\
  \ obtendrás el mismo número.\n\nA este número inalterable lo llamamos **constante\
  \ de proporcionalidad inversa ($k$)**.\n$$k = x \\cdot y$$"
definiciones_clave: '- **Cálculo de la constante de proporcionalidad inversa**: Elemento
  central dentro del estudio de Proporcionalidad inversa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo de la constante de proporcionalidad inversa.'
ejemplo_guiado:
