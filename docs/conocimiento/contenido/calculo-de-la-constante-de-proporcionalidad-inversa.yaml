procedimiento:
- 'Paso 1: Identifica un par de valores $(x, y)$ que correspondan entre sí.'
- 'Paso 2: Multiplica ambas magnitudes ($x \cdot y$).'
- 'Paso 3: El resultado de esa multiplicación es la constante $k$.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de
  la constante de proporcionalidad inversa.
ejemplos:
- titulo: Hallando k inversa
  enunciado: Si $4$ tractores aran un campo en $6$ horas, ¿cuál es la constante de
    proporcionalidad inversa?
  solucion_pasos:
  - El par de valores es $x=4$ tractores, $y=6$ horas.
  - Multiplicamos $x \cdot y = 4 \cdot 6 = 24$.
  - La constante es $k=24$. (Se requieren 24 horas-tractor para arar el campo).
- titulo: ¿Qué pasa si divido?
  respuesta: Obtienes un número sin sentido constante.
  solucion_pasos:
  - Si haces $6/4 = 1.5$. Si ahora usas 8 tractores (demorarán 3 horas), el cociente
    sería $3/8 = 0.375$. La división no es constante, el producto sí ($4\cdot6=24$
    y $8\cdot3=24$).
errores_frecuentes:
- Dividir los valores en lugar de multiplicarlos (confundir con proporción directa).
- Sumar $x+y$ para hallar la constante.
- Creer que la constante cambia si se agregan decimales.
afirmaciones_verdaderas:
- La propiedad de cálculo de la constante de proporcionalidad inversa preserva la
  consistencia lógica.
al_terminar_debes_ponder: Resolver problemas aplicados que involucren cálculo de la
