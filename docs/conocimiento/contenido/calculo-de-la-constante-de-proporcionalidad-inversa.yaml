resumen_inicial: 'La constante de proporcionalidad inversa $k$ es el producto fijo
  obtenido al multiplicar los valores correspondientes de las dos variables: $k =
  x \cdot y$.'
explicacion_simple: La constante de proporcionalidad inversa es el valor total que
  no cambia cuando multiplicamos el dato de la primera columna por el de la segunda
  (como el total de horas de trabajo necesarias para completar una obra).
explicacion_formal: 'Para una relación de proporcionalidad inversa $y = \frac{k}{x}$,
  la **Constante de Proporcionalidad Inversa $k$** se calcula como:


  $$k = x \cdot y \in \mathbb{R}^+ \quad (x, y > 0)$$


  **Interpretación de la constante:**

  - Representa el valor acumulado del trabajo o recurso total requerido por el sistema.'
definiciones_clave: '- **Constante de proporcionalidad inversa $k$**: Producto constante
  $k = x \cdot y$.'
propiedades_relaciones: '- **Producto invariante**: Multiplicación fija para todo
  par de valores correspondientes.'
ejemplo_guiado:
  enunciado: Un grifo con caudal de $6\text{ L/min}$ llena una piscina en $20\text{
    minutos}$. Calcule la constante $k$.
  pasos:
  - 'Paso 1: Identificar las variables $x = 6\text{ L/min}$ e $y = 20\text{ min}$.'
  - 'Paso 2: Calcular el producto $k = x \cdot y = 6 \cdot 20 = 120$.'
  - 'Conclusión: La constante de proporcionalidad es $k = 120\text{ Litros}$ (la capacidad
    total de la piscina).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se obtiene la constante de proporcionalidad inversa k para un par
    de variables (x, y)?
  choices:
  - text: Multiplicando la variable independiente por la dependiente (k = x · y)
    is_correct: true
  - text: Dividiendo k = y / x
    is_correct: false
  - text: Restando k = y - x
    is_correct: false
  - text: Sumando k = x + y
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando la variable independiente
    por la dependiente (k = x · y)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado del grifo y la piscina, ¿cuál fue la constante k
    obtenida?
  choices:
  - text: 120 Litros
    is_correct: true
  - text: 3,33 Litros
    is_correct: false
  - text: 26 Litros
    is_correct: false
  - text: 240 Litros
    is_correct: false
  explanation: La alternativa correcta es '120 Litros'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la constante de proporcionalidad
  inversa $k = x \cdot y$, interpretando su significado físico o económico.
semantic_id: MAT.NUM.PROP_INVERSA.CONSTANTE_PROPORCIONALIDAD
procedimiento:
- 'Paso 1: Verificar que el producto $x \cdot y = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = \frac{k}{x}$ o la hipérbola decreciente.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Aplicar la regla de tres directa multiplicando cruzado
  en un problema inverso.** **Cómo corregirlo:** En la proporción inversa se multiplican
  los datos de la misma fila ($x_1 \cdot y_1 = x_2 \cdot y_2$).


  - **Error 2: Usar el cociente $y / x$ en lugar del producto $x \cdot y$ para calcular
  $k$.** **Cómo corregirlo:** La proporcionalidad inversa conserva el PRODUCTO $k
  = x \cdot y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_INVERSA.CONSTANTE_PROPORCIONALIDAD.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad inversa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de producto.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por producto constante x · y.
- titulo: ¿Es la gráfica de una proporción inversa una recta?
  respuesta: 'No'
  solucion_pasos:
  - No, es una curva suave llamada rama de hipérbola.
- titulo: ¿Permite la constante k = x · y resolver ecuaciones inversas?
  respuesta: Sí
  solucion_pasos:
  - Sí, despejando $y = k / x$ o $x = k / y$.
errores_frecuentes:
- Aplicar la regla de tres directa para resolver problemas cuya naturaleza es inversamente
  proporcional.
- Dividir la variable dependiente entre la independiente ($y / x$) pretendiendo obtener
  la constante de proporción inversa.
- Graficar una proporcionalidad inversa mediante una línea recta que toca el origen
  $(0,0)$.
- Declarar que si una variable disminuye al aumentar otra, siempre son inversamente
  proporcionales sin comprobar $x \cdot y = k$.
- Omitir que el producto de los datos $x_1 \cdot y_1$ debe ser igual al producto $x_2
  \cdot y_2$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son inversamente proporcionales si su producto es constante:
  $x \cdot y = k$.'
- El gráfico de una relación de proporcionalidad inversa en el primer cuadrante es
  una rama de hipérbola decreciente.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
