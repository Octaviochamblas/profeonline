semantic_id: MAT.NUM.RAZONES_PROPORCIONES.CONSTANTE_PROP_INVERSA
resumen_inicial: 'La constante de proporcionalidad inversa $k$ es el producto invariante entre las dos variables: $k = x \cdot y$, que representa el valor global acumulado del sistema (como área, volumen o trabajo total).'
explicacion_simple: "![Cálculo de constante inversa](/static/img/nodos/calculo-de-la-constante-de-proporcionalidad-inversa-intro.svg)\n\nLa **constante de proporcionalidad inversa ($k$)** es el producto fijo de la relación:\n- Se calcula simplemente **multiplicando cualquier pareja de valores correspondientes**:\n$$k = x \\cdot y$$\n- **¿Qué representa?** Suele representar el **total global fijo**:\n  - La distancia total de un viaje ($k = v \\cdot t = 240\\text{ km}$).\n  - El área fija de un rectángulo ($k = \\text{base} \\cdot \\text{altura} = 48\\text{ cm}^2$).\n  - La cantidad total de trabajo ($k = \\text{obreros} \\cdot \\text{días} = 24\\text{ obrero-días}$).\n- **Para despejar cualquier incógnita:** Se divide la constante $k$ entre la variable conocida:\n$$y = \\frac{k}{x} \\quad \\text{o bien} \\quad x = \\frac{k}{y}$$"
explicacion_formal: 'Sea el par de variables inversamente proporcionales $(x, y) \in \mathbb{R}^+ \times \mathbb{R}^+$. Se define la **constante de proporcionalidad inversa** $k$ como el producto invariante:


  $$k = x \cdot y \in \mathbb{R}^+ \quad (\forall (x, y) \text{ pertenecientes a la relación})$$


  **Propiedades Algebraicas:**

  1. **Despeje de $y$:** $y = \frac{k}{x}$.

  2. **Despeje de $x$:** $x = \frac{k}{y}$.

  3. **Interpretación Geométrica:** En el plano cartesiano, $k$ representa el área del rectángulo delimitado por los ejes coordenados y las proyecciones del punto $(x, y)$.'
definiciones_clave: '- **Constante inversa ($k$)**: Escalar $k = x \cdot y$.

  - **Invariante de producto**: Identidad $x_1 \cdot y_1 = x_2 \cdot y_2 = k$.

  - **Área constante**: Región rectangular bajo cada punto de la curva hiperbólica.'
propiedades_relaciones: '- **Homogeneidad de producto**: $n \cdot x \cdot \frac{y}{n} = x \cdot y = k$.

  - **Inversión**: Conocer $k$ desacopla completamente el cálculo de cualquier variable.'
ejemplo_guiado:
  enunciado: '![Ejemplos de cálculo de constante inversa](/static/img/nodos/calculo-de-la-constante-de-proporcionalidad-inversa-ejemplos.svg)


    Calcule la constante $k$ para un viaje donde a $60\text{ km/h}$ se tardan $4\text{ horas}$, y halle la altura de un rectángulo de área constante cuya base es $12\text{ cm}$ si cuando la base era $8\text{ cm}$ su altura medía $6\text{ cm}$.'
  pasos:
  - 'Paso 1: Para el viaje: Multiplicar rapidez y tiempo $\implies k = 60 \cdot 4 = 240\text{ km}$ (distancia fija).'
  - 'Paso 2: A $80\text{ km/h}$: $t = \frac{240}{80} = 3\text{ horas}$.'
  - 'Paso 3: Para el rectángulo: Calcular constante $k$ (área) $\implies k = 8 \cdot 6 = 48\text{ cm}^2$.'
  - 'Paso 4: Para base $= 12\text{ cm}$: Despejar altura $h = \frac{48}{12} = 4\text{ cm}$.'
