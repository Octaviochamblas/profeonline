    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de proporcionalidad
    inversa. Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de cálculo de la constante de proporcionalidad
    inversa, ¿qué paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
