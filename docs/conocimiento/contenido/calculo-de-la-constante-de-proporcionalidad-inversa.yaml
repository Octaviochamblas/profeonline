semantic_id: MAT.NUM.PROP_INVERSA.CONSTANTE_PROPORCIONALIDAD
resumen_inicial: 'La constante de proporcionalidad inversa $k$ es el producto invariantemente obtenido al multiplicar cualquier valor de la variable independiente $x$ por su correspondiente valor dependiente $y$: $k = x \cdot y$.'
explicacion_simple: |
  En la proporcionalidad inversa, la constante $k$ representa el "trabajo total" o la "capacidad total acumulada" que requiere un proceso. Se calcula multiplicando los dos valores de cada pareja ($k = x \cdot y$). Por ejemplo, si 5 trabajadores necesitan 4 días para construir una barda, la constante es $k = 5 \cdot 4 = 20$ días-trabajador. Con esa constante $k = 20$, puedes calcular los días necesarios para cualquier número de trabajadores dividiendo $20 \div \text{trabajadores}$.
explicacion_formal: |
  ### Definición formal
  La **constante de proporcionalidad inversa** $k \in \mathbb{R}^+$ es el valor numérico constante resultante del producto de dos magnitudes inversamente proporcionales:
  $$k = x \cdot y \quad (x, y > 0)$$

  ### Interpretación física e industrial
  La constante $k$ se expresa mediante unidades compuestas acumuladas ($\text{Unidad de } x \cdot \text{Unidad de } y$):
  - **Trabajo acumulado**: $k = \text{Número de obreros} \cdot \text{Días de trabajo}$ (días-hombre).
  - **Capacidad de flujo**: $k = \text{Número de llaves} \cdot \text{Horas de llenado}$ (horas-llave).
  - **Energía o producto constante**: $k = \text{Presión} \cdot \text{Volumen}$ ($P \cdot V$).

  ### Ecuación de predicción a partir de $k$
  Conocida la constante $k$, el valor de la variable dependiente $y$ para cualquier $x$ dado se determina mediante:
  $$y = \frac{k}{x} \quad \text{y de forma análoga} \quad x = \frac{k}{y}$$

  ### Síntesis didáctica
  - Operación: Multiplicar $x \cdot y$.
  - Unidades: Expresa el esfuerzo o producto total acumulado del sistema.
definiciones_clave: |
  - **Constante de proporcionalidad inversa $k$**: Producto fijo $k = x \cdot y$ que relaciona dos variables en proporción inversa.
  - **Trabajo acumulado (Días-hombre / Horas-máquina)**: Magnitud total constante requerida para completar una tarea.
  - **Ley de producto constante**: Principio que establece que el área bajo la curva hiperbólica es numéricamente igual a $k$.
propiedades_relaciones: |
  - **Invariancia multiplicativa**: Si se multiplica $x$ por un escalar $c$, la variable $y$ debe multiplicarse por $\frac{1}{c}$ para mantener $k$ inalterado: $(c \cdot x) \cdot \left(\frac{y}{c}\right) = k$.
  - **Área de rectángulos inscritos**: En la gráfica hiperbólica $y = \frac{k}{x}$, el área del rectángulo formado por las coordenadas $(x, y)$ con los ejes cartesianos es siempre constante e igual a $k$.
ejemplo_guiado:
  enunciado: 'Un camión que circula a $80\text{ km/h}$ tarda $3\text{ horas}$ en recorrer un trayecto. Calcula la constante de proporcionalidad inversa $k$ e interpreta su significado.'
  pasos:
    - 'Paso 1: Identificamos la velocidad $x = 80\text{ km/h}$ y el tiempo $y = 3\text{ horas}$.'
    - 'Paso 2: Formulamos la multiplicación para hallar la constante $k = x \cdot y = 80 \cdot 3$.'
    - 'Paso 3: Efectuamos el producto: $k = 240$.'
    - 'Paso 4: Asignamos unidades e interpretamos: $k = 240\text{ km}$. La constante representa la **distancia total recorrida en el trayecto (240 km)**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se calcula la constante de proporcionalidad inversa $k$ a partir de un par de valores $(x, y)$?'
    choices:
      - {text: 'Multiplicando el valor de la variable $x$ por el valor de la variable $y$ ($k = x \cdot y$)', is_correct: true}
      - {text: 'Dividiendo la variable $y$ entre la variable $x$ ($k = \frac{y}{x}$)', is_correct: false}
      - {text: 'Restando la variable $x$ a la variable $y$ ($k = y - x$)', is_correct: false}
      - {text: 'Sumando ambas variables y multiplicando por dos', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicando el valor de la variable $x$ por el valor de la variable $y$ ($k = x \cdot y$)''. La constante inversa se obtiene del producto $x \cdot y$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si $4$ bombas de agua vacían un pozo en $18\text{ horas}$, ¿cuál es el valor de la constante $k$ y cuántas horas tardarán $9$ bombas?'
    choices:
      - {text: '$k = 72$ bombas-hora, y $9$ bombas tardarán $8\text{ horas}$ ($72 \div 9 = 8$)', is_correct: true}
      - {text: '$k = 4.5$, y tardarán $40.5\text{ horas}$', is_correct: false}
      - {text: '$k = 22$, y tardarán $13\text{ horas}$', is_correct: false}
      - {text: '$k = 162$, y tardarán $18\text{ horas}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$k = 72$ bombas-hora, y $9$ bombas tardarán $8\text{ horas}$ ($72 \div 9 = 8$)''. $k = 4 \cdot 18 = 72$; tiempo para 9 bombas: $72 / 9 = 8\text{ h}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos variables $x$ e $y$ en el enunciado del problema de proporción inversa.'
  - 'Paso 2: Escribir la fórmula de la constante de proporcionalidad inversa $k = x \cdot y$.'
  - 'Paso 3: Multiplicar los valores numéricos de un par conocido $(x_1, y_1)$ para determinar $k$.'
  - 'Paso 4: Expresar la constante $k$ acompañada de sus unidades acumuladas y utilizarla para despejar $y = \frac{k}{x}$.'
errores_correccion: |
  - **Error 1:** Dividir $y$ entre $x$ al calcular la constante en una relación inversamente proporcional. **Cómo corregirlo:** La división $y / x$ es para proporción directa; en la **proporción inversa la constante es el PRODUCTO**: $k = x \cdot y$.
  - **Error 2:** Creer que la constante $k$ cambia cuando se eligen diferentes pares de valores de la misma tabla inversa. **Cómo corregirlo:** En toda proporción inversa válida, **el producto $x \cdot y$ da exactamente el mismo resultado $k$** para cada par.
ejemplos:
  - titulo: 'Cálculo de trabajo en días-hombre'
    enunciado: 'Si $10$ obreros hacen una obra en $6$ días, ¿la constante de trabajo es $k = 60\text{ días-hombre}$?'
    alternativas:
      - 'Sí, pues $10 \cdot 6 = 60$'
      - 'No, es 1.66'
      - 'No, es 16'
    respuesta: 'Sí, pues $10 \cdot 6 = 60$'
    solucion_pasos:
      - '1. Formulamos $k = x \cdot y = 10 \cdot 6$.'
      - '2. Multiplicamos: $k = 60\text{ días-hombre}$.'
  - titulo: 'Constante en flujo de cañerías'
    enunciado: 'Si $2$ cañerías llenan un estanque en $12\text{ horas}$, ¿la constante es $k = 24\text{ horas-cañería}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $k = 2 \cdot 12 = 24$.'
  - titulo: 'Predicción usando $k$'
    enunciado: 'Si $k = 36$ y la variable independiente es $x = 4$, ¿la variable dependiente es $y = 9$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $y = k / x = 36 / 4 = 9$.'
  - titulo: 'Constante en engranajes'
    enunciado: 'Un engranaje de $20$ dientes da $30$ vueltas ($k = 600$). ¿El producto permanece en $600$ para otro engranaje acoplado?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En engranajes acoplados, el producto Dientes $\cdot$ Vueltas $= k$ es constante.'
errores_frecuentes:
  - 'Dividir la variable dependiente $y$ entre la independiente $x$ al buscar la constante inversa.'
  - 'Restar las variables para intentar determinar el trabajo total acumulado.'
  - 'Considerar que la constante $k$ debe variar cuando aumenta el valor de la variable $x$.'
  - 'La constante $k$ en la proporcionalidad inversa carece de dimensiones o unidades de medida.'
  - 'Multiplicar por la constante $k$ en lugar de dividir al calcular el valor dependiente $y = k / x$.'
afirmaciones_verdaderas:
  - 'La constante de proporcionalidad inversa $k$ es el producto constante $k = x \cdot y$ entre la variable independiente y dependiente.'
  - 'El valor de la variable dependiente se calcula dividiendo la constante $k$ entre la independiente: $y = \frac{k}{x}$.'
al_terminar_debes_poder: 'Calcular la constante de proporcionalidad inversa $k = x \cdot y$ e interpretar su significado cuantitativo en problemas aplicados.'
