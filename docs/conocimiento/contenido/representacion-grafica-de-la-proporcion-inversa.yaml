semantic_id: MAT.NUM.PROP_INVERSA.GRAFICO_HIPERBOLA
resumen_inicial: 'Representación gráfica de la proporción inversa: concepto y propiedades
  fundamentales en Proporcionalidad inversa.'
explicacion_simple: A diferencia de la proporción directa que es una flecha recta y firme
  que cruza el plano, la proporción inversa traza una curva suave y elegante que se acerca
  a las paredes del plano pero jamás las toca.
explicacion_formal: "Una **proporcionalidad inversa** ($y = k/x$) jamás será una línea recta.\
  \ Su representación gráfica es una curva que desciende de izquierda a derecha de forma pronunciada\
  \ al principio y luego se aplana. \n\nEsta curva se llama rama de **hipérbola equilátera**.\
  \ Sus características clave son:\n1. Es decreciente: si $x$ avanza, $y$ baja.\n2. **Nunca\
  \ toca el origen $(0,0)$** ni los ejes. Esto se debe a que no se puede dividir por cero\
  \ ($k/0$ no existe), y si $x=0$, $y$ no tiene valor; si $y=0$, $x$ no tiene valor."
definiciones_clave: '- **Representación gráfica de la proporción inversa**: Elemento central
  dentro del estudio de Proporcionalidad inversa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a representación gráfica de la proporción inversa.'
ejemplo_guiado:
  enunciado: Una gráfica muestra una curva que pasa por los puntos (2,18) y (6,6). ¿Puede
    representar una proporción inversa?
  pasos:
  - Verifico si la figura es una curva decreciente, no una línea recta.
  - 'Compruebo el producto en ambos puntos: 2 por 18 es igual a 36, y 6 por 6 también es igual
    a 36.'
  - Como la curva es decreciente y el producto se mantiene constante en 36, sí representa
    una proporción inversa, una hipérbola.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con representación gráfica de la proporción
    inversa?
  choices:
  - text: Identificar correctamente la relación de proporcionalidad inversa
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de proporcionalidad
    inversa. Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de representación gráfica de la proporción inversa,
    ¿qué paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
