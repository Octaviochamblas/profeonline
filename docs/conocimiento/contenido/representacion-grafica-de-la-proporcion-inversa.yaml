semantic_id: MAT.NUM.RAZONES_PROPORCIONES.GRAFICO_PROP_INVERSA
resumen_inicial: La representación gráfica de una proporcionalidad inversa en el primer cuadrante es una rama de hipérbola equilátera asintótica a los ejes coordenados, cuya ecuación es $y = \frac{k}{x}$ ($k > 0$).
explicacion_simple: '![Gráfico de proporción inversa](/static/img/nodos/representacion-grafica-de-la-proporcion-inversa-intro.svg)


  El gráfico de una **proporcionalidad inversa** tiene una forma visual única:

  1. **Es una CURVA SUAVE llamada hipérbola** (una rama en el 1° cuadrante).

  2. **NUNCA TOCA NI CRUZA LOS EJES $X$ e $Y$** (los ejes son *asíntotas*).

  3. **NO PASA POR EL ORIGEN $(0, 0)$** (porque la división por cero no existe: $\frac{k}{0}$ es indefinida).

  4. Es **estrictamente decreciente**: a medida que $x$ crece hacia la derecha, la curva desciende y se aplasta contra el eje $X$, pero sin tocarlo jamás.

  - **Geometría del área:** Si tomas cualquier punto $(x, y)$ sobre la curva, el rectángulo formado con los ejes tiene siempre la **misma área fija $k = x \cdot y$**.'
explicacion_formal: 'Sea la función de proporcionalidad inversa $f: \mathbb{R}^+ \to \mathbb{R}^+$ definida por $y = f(x) = \frac{k}{x}$ con $k > 0$.


  **Geometría Analítica de la Curva:**

  1. **Lugar Geométrico:** Corresponde a la rama del primer cuadrante de una **hipérbola equilátera**:

  $$\mathcal{H} = \left\{(x, y) \in \mathbb{R}^+ \times \mathbb{R}^+ \;\middle|\; x \cdot y = k\right\}$$

  2. **Comportamiento Asintótico:**

  $$\lim_{x \to 0^+} \frac{k}{x} = +\infty \quad (\text{asíntota vertical: } x = 0)$$

  $$\lim_{x \to +\infty} \frac{k}{x} = 0^+ \quad (\text{asíntota horizontal: } y = 0)$$

  3. **Derivada y Pendiente:** $f''(x) = -\frac{k}{x^2} < 0$ para todo $x > 0$, demostrando que la función es monótona estrictamente decreciente y convexa ($f''''(x) = \frac{2k}{x^3} > 0$).'
definiciones_clave: '- **Hipérbola equilátera**: Curva cónica simétrica respecto a la bisectriz $y = x$.

  - **Asíntota**: Recta a la cual la curva se aproxima indefinidamente sin llegar a intersectarla.

  - **Área bajo el punto**: Propiedad $A(x, y) = x \cdot y = k$ constante.'
propiedades_relaciones: '- **No intersección**: $\mathcal{H} \cap \text{Eje } X = \emptyset$ y $\mathcal{H} \cap \text{Eje } Y = \emptyset$.

  - **Simetría axial**: Invariante bajo la reflexión en la recta $y = x$ ($x \cdot y = y \cdot x = k$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de gráfico inverso](/static/img/nodos/representacion-grafica-de-la-proporcion-inversa-ejemplos.svg)


    Obtenga la constante $k$ y la ecuación de la hipérbola que pasa por el punto $(5, 12)$, y explique por qué una línea recta decreciente que une $(0, 20)$ con $(10, 0)$ no representa una proporcionalidad inversa.'
  pasos:
  - 'Paso 1: Para el punto $(5, 12)$: Multiplicar coordenadas $k = 5 \cdot 12 = 60$.'
  - 'Paso 2: Ecuación funcional de la hipérbola: $y = \frac{60}{x}$.'
  - 'Paso 3: Para la recta decreciente: Pasa por $(0, 20)$ y $(10, 0)$ (toca los ejes).'
  - 'Paso 4: Como toca los ejes ($x=0$ e $y=0$), su producto en los cortes es $0 \cdot 20 = 0 \neq k$. Es una función afín ($y = -2x + 20$), no inversa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma gráfica de una relación de proporcionalidad inversa en el primer cuadrante?
  choices:
  - text: Una rama de hipérbola que no toca los ejes coordenados ni pasa por el origen (0, 0)
    is_correct: true
  - text: Una línea recta decreciente que corta ambos ejes
    is_correct: false
  - text: Una semirrecta que nace en el origen (0, 0)
    is_correct: false
  - text: Una parábola orientada hacia la derecha
    is_correct: false
  explanation: La alternativa correcta es 'Una rama de hipérbola que no toca los ejes coordenados ni pasa por el origen (0, 0)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué una recta decreciente que corta los ejes no es una proporción inversa?
  choices:
  - text: Porque al cortar los ejes en x=0 o y=0 el producto se hace cero, rompiendo la constante k
    is_correct: true
  - text: Porque las rectas decrecientes no existen
    is_correct: false
  - text: Porque la pendiente es positiva
    is_correct: false
  - text: Porque 20 es mayor que 10
    is_correct: false
  explanation: La alternativa correcta es 'Porque al cortar los ejes en x=0 o y=0 el producto se hace cero, rompiendo la constante k'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar los puntos $(x_i, y_i)$ en el primer cuadrante del plano cartesiano.'
- 'Paso 2: Trazar una curva suave (hipérbola) que decrezca asintóticamente hacia los ejes sin cruzarlos.'
- 'Paso 3: Calcular la constante $k = x \cdot y$ multiplicando las coordenadas de cualquier punto para estructurar $y = \frac{k}{x}$.'
errores_correccion: '- **Error 1: Creer que una línea recta decreciente representa proporción inversa.** **Cómo corregirlo:** Las rectas decrecientes son funciones afines ($y = -mx + n$); la proporción inversa es obligatoriamente una HIPÉRBOLA curva ($y = \frac{k}{x}$).

  - **Error 2: Dibujar la hipérbola tocando el origen $(0,0)$ o los ejes.** **Cómo corregirlo:** Los ejes son asíntotas inalcanzables ya que la división por cero no está definida.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Una hipérbola de proporción inversa pasa por el punto $(4, 15)$. ¿Cuál es su constante $k$?
  alternativas:
  - $60$
  - $3,75$
  - $19$
  respuesta: $60$
  solucion_pasos:
  - $k = 4 \cdot 15 = 60$.
- titulo: Ejemplo 2
  enunciado: ¿Qué punto pertenece a la gráfica de la proporción inversa $y = \frac{36}{x}$?
  alternativas:
  - $(6, 6)$
  - $(6, 30)$
  - $(0, 36)$
  respuesta: $(6, 6)$
  solucion_pasos:
  - $x \cdot y = 6 \cdot 6 = 36$.
- titulo: ¿Toca alguna vez los ejes coordenados la gráfica de la proporción inversa?
  respuesta: 'No'
  solucion_pasos:
  - No, los ejes $X$ e $Y$ son asíntotas que la curva nunca intersecta.
  alternativas:
  - texto: No, los ejes son asíntotas y la curva se aproxima sin tocarlos jamás
    es_correcta: true
    retroalimentacion: ¡Correcto! Comportamiento asintótico.
  - texto: Sí, corta al eje Y en k
    es_correcta: false
    retroalimentacion: Incorrecto, para $x = 0$ la función está indefinida.
  - texto: Sí, cruza al eje X en el infinito
    es_correcta: false
    retroalimentacion: Incorrecto, el límite es 0 pero nunca intersecta.
- titulo: ¿Tiene todo punto sobre la hipérbola la misma área rectangular x · y?
  respuesta: Sí
  solucion_pasos:
  - Sí, el área del rectángulo proyectado a los ejes es exactamente $k$.
  alternativas:
  - texto: Sí, es la propiedad geométrica fundamental de la hipérbola equilátera
    es_correcta: true
    retroalimentacion: ¡Correcto! Área constante $A = k$.
  - texto: No, el área va disminuyendo
    es_correcta: false
    retroalimentacion: Incorrecto, el área es invariante.
  - texto: No, depende del ángulo
    es_correcta: false
    retroalimentacion: Incorrecto, se mantiene constante en toda la curva.
errores_frecuentes:
- Confundir la curva hiperbólica con una recta decreciente.
- Trazar la gráfica cruzando los ejes o pasando por el origen.
- Calcular la pendiente como si fuera una función lineal.
- Olvidar que el producto de las coordenadas en cualquier punto de la curva debe ser $k$.
afirmaciones_verdaderas:
- La representación gráfica de una proporción inversa es una rama de hipérbola en el primer cuadrante.
- Los ejes coordenados actúan como asíntotas de la curva.
- Cualquier punto sobre la hipérbola satisface que el producto de sus coordenadas es la constante $k$.
al_terminar_debes_poder: '![Síntesis de gráfico inverso](/static/img/nodos/representacion-grafica-de-la-proporcion-inversa-resumen.svg)


  QUÉ: Interpretar, graficar y analizar la representación cartesiana de una proporción inversa.


  CÓMO: Trazando la curva hiperbólica asintótica a los ejes en el primer cuadrante y verificando que cada punto $(x, y)$ satisfaga el producto constante $x \cdot y = k$ ($y = \frac{k}{x}$).'
