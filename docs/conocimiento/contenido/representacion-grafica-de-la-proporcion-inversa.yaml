resumen_inicial: La representación gráfica de una proporcionalidad directa en el primer
  cuadrante del plano cartesiano es una curva asintótica decreciente llamada rama
  de hipérbola.
explicacion_simple: Cuando graficamos una relación inversamente proporcional, los
  puntos forman una curva suave descendente llamada hipérbola. A medida que avanzamos
  a la derecha en el eje $X$, la curva baja acercándose al eje pero sin tocarlo nunca.
explicacion_formal: 'La **Gráfica de Proporcionalidad Inversa** es la hipérbola equilátera
  en el primer cuadrante definida por:


  $$G = \left\{(x, y) \in \mathbb{R}^+ \times \mathbb{R}^+ \mid y = \frac{k}{x}, \,
  k > 0\right\}$$


  **Propiedades asintóticas:**

  - Asíntota horizontal: $\lim_{x \to +\infty} y = 0$ (se aproxima al eje $X$ sin
  tocarlo).

  - Asíntota vertical: $\lim_{x \to 0^+} y = +\infty$ (se eleva paralelo al eje $Y$
  sin tocarlo).'
definiciones_clave: '- **Gráfico de proporción inversa**: Rama de hipérbola asintótica
  decreciente a los ejes $X$ e $Y$.'
propiedades_relaciones: '- **Comportamiento asintótico**: Nunca intersecta los ejes
  cartesianos para $x, y > 0$.'
ejemplo_guiado:
  enunciado: Identifique las características de la curva que pasa por los puntos $(1,
    12)$, $(2, 6)$ y $(4, 3)$.
  pasos:
  - 'Paso 1: Calcular $x \cdot y$ para los puntos: $1 \cdot 12 = 12$, $2 \cdot 6 =
    12$, $4 \cdot 3 = 12$.'
  - 'Paso 2: Observar la forma gráfica: es una curva suave que desciende de izquierda
    a derecha.'
  - 'Conclusión: Corresponde a una rama de hipérbola de ecuación $y = \frac{12}{x}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué curva geométrica representa la gráfica de una proporcionalidad inversa
    en el primer cuadrante?
  choices:
  - text: Una curva descendente llamada rama de hipérbola
    is_correct: true
  - text: Una línea recta que pasa por el origen
    is_correct: false
  - text: Una parábola vertical con vértice en el origen
    is_correct: false
  - text: Una circunferencia centrada en el origen
    is_correct: false
  explanation: La alternativa correcta es 'Una curva descendente llamada rama de hipérbola'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para los puntos (1,12), (2,6) y (4,3), ¿cuál es la
    ecuación de la hipérbola?
  choices:
  - text: y = 12 / x
    is_correct: true
  - text: y = 12x
    is_correct: false
  - text: y = x / 12
    is_correct: false
  - text: y = 12 - x
    is_correct: false
  explanation: La alternativa correcta es 'y = 12 / x'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar e interpretar el gráfico
  de una proporcionalidad inversa como una rama de hipérbola decreciente asintótica
  a los ejes.
semantic_id: MAT.NUM.PROP_INVERSA.GRAFICO_HIPERBOLA
procedimiento:
- 'Paso 1: Verificar que el producto $x \cdot y = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = \frac{k}{x}$ o la hipérbola decreciente.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Aplicar la regla de tres directa multiplicando cruzado
  en un problema inverso.** **Cómo corregirlo:** En la proporción inversa se multiplican
  los datos de la misma fila ($x_1 \cdot y_1 = x_2 \cdot y_2$).


  - **Error 2: Usar el cociente $y / x$ en lugar del producto $x \cdot y$ para calcular
  $k$.** **Cómo corregirlo:** La proporcionalidad inversa conserva el PRODUCTO $k
  = x \cdot y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_INVERSA.GRAFICO_HIPERBOLA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad inversa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de producto.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por producto constante x · y.
- titulo: ¿Es la gráfica de una proporción inversa una recta?
  respuesta: 'No'
  solucion_pasos:
  - No, es una curva suave llamada rama de hipérbola.
- titulo: ¿Permite la constante k = x · y resolver ecuaciones inversas?
  respuesta: Sí
  solucion_pasos:
  - Sí, despejando $y = k / x$ o $x = k / y$.
errores_frecuentes:
- Aplicar la regla de tres directa para resolver problemas cuya naturaleza es inversamente
  proporcional.
- Dividir la variable dependiente entre la independiente ($y / x$) pretendiendo obtener
  la constante de proporción inversa.
- Graficar una proporcionalidad inversa mediante una línea recta que toca el origen
  $(0,0)$.
- Declarar que si una variable disminuye al aumentar otra, siempre son inversamente
  proporcionales sin comprobar $x \cdot y = k$.
- Omitir que el producto de los datos $x_1 \cdot y_1$ debe ser igual al producto $x_2
  \cdot y_2$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son inversamente proporcionales si su producto es constante:
  $x \cdot y = k$.'
- El gráfico de una relación de proporcionalidad inversa en el primer cuadrante es
  una rama de hipérbola decreciente.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
