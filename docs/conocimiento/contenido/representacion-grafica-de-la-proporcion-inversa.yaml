procedimiento:
- 'Paso 1: Observa el plano cartesiano.'
- 'Paso 2: Comprueba que sea una curva que baja hacia la derecha (decreciente).'
- 'Paso 3: Verifica que la curva no cruce los ejes X ni Y en el cuadrante positivo.'
errores_correccion: Evita confundir los datos de entrada al operar con representación
  gráfica de la proporción inversa.
ejemplos:
- titulo: Evaluando gráficos inversos
  enunciado: Una gráfica muestra una línea recta diagonal que baja de $(0,10)$ a $(10,0)$.
    ¿Es proporción inversa?
  solucion_pasos:
  - La forma es de línea recta, no curva.
  - Toca los ejes (X=10 y Y=10).
  - Por lo tanto, NO es proporción inversa. Es una función afín decreciente.
errores_frecuentes:
- Confundir una recta decreciente ($y = -mx+n$) con una hipérbola.
- Creer que la curva sí toca el cero si se le da suficiente tiempo.
- No asociar el nombre 'hipérbola' a este fenómeno y creer que es una parábola.
- Graficar puntos de proporción inversa y unirlos con líneas rectas creando un polígono,
  en vez de una curva suavizada.
afirmaciones_verdaderas:
- La propiedad de representación gráfica de la proporción inversa preserva la consistencia
  lógica.
al_terminar_debes_poder: Resolver problemas aplicados que involucren representación
  gráfica de la proporción inversa.
