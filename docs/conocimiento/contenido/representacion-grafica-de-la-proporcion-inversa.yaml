  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observa el plano cartesiano.'
- 'Paso 2: Comprueba que sea una curva que baja hacia la derecha (decreciente).'
- 'Paso 3: Verifica que la curva no cruce los ejes X ni Y en el cuadrante positivo.'
errores_correccion: Evita confundir los datos de entrada al operar con representación gráfica
  de la proporción inversa.
ejemplos:
- titulo: Evaluando gráficos inversos
  enunciado: Una gráfica muestra una línea recta diagonal que baja de $(0,10)$ a $(10,0)$.
    ¿Es proporción inversa?
  solucion_pasos:
  - La forma es de línea recta, no curva.
  - Toca los ejes (X=10 y Y=10).
  - Por lo tanto, NO es proporción inversa. Es una función afín decreciente.
- titulo: Ejemplo 1
  enunciado: ¿Cuál gráfico representa una proporción inversa?
  alternativas:
  - Una curva decreciente que no toca los ejes
  - Una recta que pasa por el origen
  - Una curva creciente
  respuesta: Una curva decreciente que no toca los ejes
  solucion_pasos:
  - Esa es la forma característica de la hipérbola de proporción inversa.
- titulo: Ejemplo 2
  enunciado: Una curva pasa por (3,8) y (4,6). ¿Cuál es su constante k?
  alternativas:
  - '24'
  - '2'
  - '14'
  respuesta: '24'
  solucion_pasos:
  - 3 por 8 es igual a 24, y 4 por 6 también es igual a 24.
- titulo: ¿La gráfica de una proporción inversa puede tocar el punto (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - En ese punto una de las variables sería cero, lo cual no está permitido en una proporción
    inversa.
errores_frecuentes:
- Confundir una recta decreciente ($y = -mx+n$) con una hipérbola.
- Creer que la curva sí toca el cero si se le da suficiente tiempo.
- No asociar el nombre 'hipérbola' a este fenómeno y creer que es una parábola.
- Graficar puntos de proporción inversa y unirlos con líneas rectas creando un polígono, en
  vez de una curva suavizada.
- Confundir una curva decreciente cualquiera con una hipérbola sin comprobar que el producto
  x por y sea constante.
afirmaciones_verdaderas:
- La propiedad de representación gráfica de la proporción inversa preserva la consistencia
  lógica.
- La curva de una proporción inversa nunca toca los ejes X ni Y, porque ninguna de las dos
  variables puede valer cero.
al_terminar_debes_poder: Resolver problemas aplicados que involucren representación gráfica
  de la proporción inversa.
fuente: Currículum Nacional MINEDUC.
