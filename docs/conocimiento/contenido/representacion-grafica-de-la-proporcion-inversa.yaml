semantic_id: MAT.NUM.PROP_INVERSA.GRAFICO_HIPERBOLA
resumen_inicial: 'Representación gráfica de la proporción inversa: concepto y propiedades
  fundamentales en Proporcionalidad inversa.'
explicacion_simple: A diferencia de la proporción directa que es una flecha recta
  y firme que cruza el plano, la proporción inversa traza una curva suave y elegante
  que se acerca a las paredes del plano pero jamás las toca.
explicacion_formal: "Una **proporcionalidad inversa** ($y = k/x$) jamás será una línea\
  \ recta. Su representación gráfica es una curva que desciende de izquierda a derecha\
  \ de forma pronunciada al principio y luego se aplana. \n\nEsta curva se llama rama\
  \ de **hipérbola equilátera**. Sus características clave son:\n1. Es decreciente:\
  \ si $x$ avanza, $y$ baja.\n2. **Nunca toca el origen $(0,0)$** ni los ejes. Esto\
  \ se debe a que no se puede dividir por cero ($k/0$ no existe), y si $x=0$, $y$\
  \ no tiene valor; si $y=0$, $x$ no tiene valor."
definiciones_clave: '- **Representación gráfica de la proporción inversa**: Elemento
  central dentro del estudio de Proporcionalidad inversa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a representación gráfica de la proporción inversa.'
ejemplo_guiado:
