semantic_id: MAT.NUM.PROP_INVERSA.GRAFICO_HIPERBOLA
resumen_inicial: 'La representación gráfica de una relación de proporcionalidad inversa en el primer cuadrante del plano cartesiano es una curva suave decreciente denominada rama de hipérbola.'
explicacion_simple: |
  Si dibujas en el plano cartesiano los puntos de una proporcionalidad inversa y los uniendo suavemente, obtendrás una curva característica llamada **rama de hipérbola**. Esta curva tiene tres rasgos únicos:
  1. Es **curva y decreciente** (va bajando de izquierda a derecha).
  2. **Nunca toca el eje X ni el eje Y** (se acerca mucho a ellos, pero jamás los toca).
  3. **No pasa por el origen $(0,0)$**.
explicacion_formal: |
  ### Definición formal
  El gráfico de una relación de proporcionalidad inversa $y = \frac{k}{x}$ ($k > 0$) para valores reales positivos $x > 0$ es la representación geométrica del conjunto:
  $$\mathcal{G} = \left\{(x, y) \in \mathbb{R}^+ \times \mathbb{R}^+ : y = \frac{k}{x}\right\}$$
  que corresponde formalmente a una **rama de hipérbola equilátera** situada en el primer cuadrante.

  ### Propiedades geométricas y analíticas
  1. **Comportamiento decreciente**: Conforme $x \to +\infty$, el valor de $y \to 0^+$ (decrecimiento estricto).
  2. **Comportamiento asintótico**:
     - Asíntota horizontal: Eje X (línea $y = 0$).
     - Asíntota vertical: Eje Y (línea $x = 0$).
  3. **Intersecciones nulas**: La curva no corta a ningún eje cartesiano y no contiene al origen $(0, 0)$.
  4. **Invariancia de área inscrita**: El área del rectángulo delimitado por los ejes y cualquier punto de la curva $(x, y)$ es siempre constante e igual a $A = x \cdot y = k$.

  ### Síntesis didáctica
  - Forma: Curva decreciente (rama de hipérbola).
  - Condición de asíntota: Se aproxima a los ejes sin tocarlos.
definiciones_clave: |
  - **Rama de hipérbola**: Curva abierta decreciente que constituye el gráfico característico de la proporcionalidad inversa.
  - **Asíntota cartesiana**: Recta a la cual la curva hiperbólica se aproxima indefinidamente sin llegar a tocarla.
  - **Área constante bajo la curva**: Propiedad geométrica donde el área del rectángulo $A = x \cdot y$ es igual a $k$.
propiedades_relaciones: |
  - **Desplazamiento por constante $k$**: A mayor valor de la constante $k$, la curva hiperbólica se ubica más alejada del origen $(0,0)$.
  - **Simetría respecto a la diagonal**: La curva es estrictamente simétrica respecto a la recta bisectriz del primer cuadrante $y = x$.
ejemplo_guiado:
  enunciado: 'Dado el gráfico de una relación entre dos magnitudes $x$ e $y$ formado por una curva hiperbólica decreciente que pasa por el punto $(3, 8)$, confirma si es proporcionalidad inversa y halla la constante $k$.'
  pasos:
    - 'Paso 1: Observamos la forma del gráfico: al ser una curva decreciente con asíntotas en los ejes, corresponde a una **rama de hipérbola**.'
    - 'Paso 2: Concluimos que el gráfico representa una relación de **proporcionalidad inversa**.'
    - 'Paso 3: Calculamos la constante $k$ multiplicando las coordenadas del punto conocido $(3, 8)$: $k = x \cdot y = 3 \cdot 8 = 24$.'
    - 'Paso 4: Escribimos la ecuación del gráfico hiperbólico: $y = \frac{24}{x}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué curva geométrica representa gráficamente a una proporcionalidad inversa en el primer cuadrante?'
    choices:
      - {text: 'Una curva decreciente llamada rama de hipérbola que se aproxima a los ejes sin tocarlos', is_correct: true}
      - {text: 'Una línea recta que pasa por el origen $(0, 0)$', is_correct: false}
      - {text: 'Una parábola vertical con vértice en el origen', is_correct: false}
      - {text: 'Una línea recta horizontal fija', is_correct: false}
    explanation: 'La alternativa correcta es ''Una curva decreciente llamada rama de hipérbola que se aproxima a los ejes sin tocarlos''. Es la gráfica característica de $y = k/x$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una curva hiperbólica de proporción inversa pasa por el punto $(5, 6)$, ¿cuál es el valor del área del rectángulo formado por dicho punto y los ejes?'
    choices:
      - {text: 'Área $= 30$, que coincide con la constante $k = 5 \cdot 6 = 30$', is_correct: true}
      - {text: 'Área $= 1.2$, dividiendo $6 / 5$', is_correct: false}
      - {text: 'Área $= 11$, sumando $5 + 6$', is_correct: false}
      - {text: 'Área $= 0$, porque la curva toca el origen', is_correct: false}
    explanation: 'La alternativa correcta es ''Área $= 30$, que coincide con la constante $k = 5 \cdot 6 = 30$''. El área inscrita es $A = x \cdot y = k = 30$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Construir los ejes cartesianos en el primer cuadrante (valores de $x > 0$ e $y > 0$).'
  - 'Paso 2: Calcular y graficar varios puntos $(x_i, y_i)$ que cumplan $x \cdot y = k$.'
  - 'Paso 3: Unir los puntos trazando una curva suave decreciente (rama de hipérbola).'
  - 'Paso 4: Verificar que la curva se aproxime a los ejes como asíntotas sin tocarlos ni pasar por el origen.'
errores_correccion: |
  - **Error 1:** Dibujar una línea recta que baja al representar la proporcionalidad inversa. **Cómo corregirlo:** La proporcionalidad inversa **jamás es una recta**; es siempre una **curva hiperbólica decreciente** ($y = k/x$).
  - **Error 2:** Dibujar la curva tocando o cruzando los ejes X e Y. **Cómo corregirlo:** Los ejes actúan como **asíntotas**; la curva se aproxima infinitamente pero **nunca toca los ejes** porque no se puede dividir entre cero ($x \neq 0$ y $y \neq 0$).
ejemplos:
  - titulo: 'Forma de la curva de proporción inversa'
    enunciado: '¿La gráfica de $y = \frac{12}{x}$ es una curva suave decreciente en el primer cuadrante?'
    alternativas:
      - 'Sí, es una rama de hipérbola'
      - 'No, es una línea recta'
      - 'No, es una parábola'
    respuesta: 'Sí, es una rama de hipérbola'
    solucion_pasos:
      - '1. Evaluamos la ecuación $y = 12/x$.'
      - '2. Genera una curva hiperbólica decreciente.'
  - titulo: 'Asímptotas en los ejes'
    enunciado: '¿La curva de la proporción inversa toca en algún punto al origen $(0,0)$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Como $x \neq 0$ e $y \neq 0$, jamás toca al origen.'
  - titulo: 'Área bajo la curva'
    enunciado: 'Para la hipérbola de $k=20$, ¿el rectángulo de coordenadas $(4,5)$ tiene área igual a $20$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Área $A = 4 \cdot 5 = 20$.'
  - titulo: 'Alejamiento del origen según $k$'
    enunciado: '¿La curva de $y = \frac{100}{x}$ está más alejada del origen que la curva de $y = \frac{10}{x}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. A mayor constante $k$, más se aleja la hipérbola del origen.'
errores_frecuentes:
  - 'Trazar líneas rectas decrecientes en lugar de curvas hiperbólicas al representar la proporción inversa.'
  - 'Hacer que la curva toque o cruce los ejes cartesianos violando la propiedad de asíntota.'
  - 'El gráfico de la proporcionalidad inversa pasa exactamente por el origen de coordenadas $(0, 0)$.'
  - 'El gráfico hiperbólico de la proporción inversa es numéricamente idéntico al rectilíneo de la proporción directa.'
  - 'El área de los rectángulos delimitados bajo la curva varía al seleccionar diferentes puntos.'
afirmaciones_verdaderas:
  - 'El gráfico de una relación de proporcionalidad inversa es una curva suave decreciente llamada rama de hipérbola.'
  - 'Los ejes cartesianos actúan como asíntotas de la curva hiperbólica, por lo que la gráfica nunca toca al eje X ni al eje Y.'
al_terminar_debes_poder: 'Identificar y graficar relaciones de proporcionalidad inversa como curvas hiperbólicas decrecientes con asíntotas en los ejes.'
