semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_INSCRITO_DEFINICION
resumen_inicial: Un ángulo inscrito es aquel cuyo vértice se encuentra sobre la circunferencia y sus dos lados son cuerdas (o secantes) de la misma.
explicacion_simple: 'Imagina una linterna apoyada justo en la pared curva de una habitación redonda, apuntando hacia el otro lado: el haz de luz sale desde la pared y corta la curva en dos puntos opuestos. Ese es un **ángulo inscrito**.


  Para que un ángulo sea inscrito, debe cumplir dos requisitos muy concretos:

  1. Su vértice $V$ está **apoyado sobre la circunferencia** ($V \in \mathcal{C}$).

  2. Sus dos lados son **cuerdas** de la circunferencia (los segmentos $\overline{VA}$ y $\overline{VB}$).


  A diferencia del ángulo del centro (que está en el corazón del círculo), el ángulo inscrito está en la orilla, y por eso mira a su arco desde lejos, abriéndose con una amplitud menor.


  ![Definición de ángulo inscrito](/static/img/nodos/definicion-de-angulo-inscrito-en-una-circunferencia-intro.svg)

  '
explicacion_formal: '### Definición formal del ángulo inscrito

  Sea $\mathcal{C}(O, r)$ una circunferencia en $\mathbb{R}^2$. Un ángulo $\angle AVB$ se define como **ángulo inscrito** en $\mathcal{C}$ si y solo si:

  1. El vértice $V$ pertenece a la circunferencia: $V \in \mathcal{C}$.

  2. Los puntos $A$ y $B$ pertenecen a la circunferencia con $A \neq V$ y $B \neq V$: $A, B \in \mathcal{C}$.

  3. Las semirrectas $\vec{VA}$ y $\vec{VB}$ contienen a las cuerdas secantes $\overline{VA}$ y $\overline{VB}$:

  $$\angle AVB = \text{Ángulo inscrito} \iff V \in \mathcal{C} \quad \wedge \quad \overline{VA}, \overline{VB} \subset \text{Cuerdas}(\mathcal{C})$$


  ### Arco interceptado

  El ángulo inscrito interseca a la curva delimitando el arco $\overset{\frown}{AB}$ en el semiplano opuesto al vértice $V$. El vértice $V$ pertenece obligatoriamente al arco complementario (el arco que no está interceptado por el ángulo).


  > **Complemento didáctico:** La forma más fácil de reconocer un ángulo inscrito en cualquier figura compleja de la PAES es mirar su ''vértice'' o ''punta'': si la punta toca la circunferencia, ¡es inscrito! Si la punta está en el centro $O$, es central. Y si la punta está flotando adentro sin ser el centro, es un ángulo interior.

  '
definiciones_clave: '- **Ángulo inscrito**: Ángulo con vértice en el borde de la circunferencia y lados secantes que forman cuerdas.

  - **Vértice periférico ($V \in \mathcal{C}$)**: Punto del contorno circular que sirve de vértice al ángulo.

  - **Cuerdas secantes**: Segmentos $\overline{VA}$ y $\overline{VB}$ que forman los lados del ángulo.

  '
propiedades_relaciones: '- **Rango angular**: $0^\circ < \beta < 180^\circ$.

  - **Posición relativa del centro**: El centro $O$ puede estar sobre uno de los lados de $\angle AVB$, en su región interior, o en su región exterior.

  - **Generador de polígonos inscritos**: Los ángulos interiores de cualquier polígono inscrito son ángulos inscritos de la circunferencia.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulo inscrito](/static/img/nodos/definicion-de-angulo-inscrito-en-una-circunferencia-ejemplos.svg)


    En una circunferencia se tienen los puntos $A, B, V$ sobre su contorno. Se trazan los segmentos $VA$ y $VB$. Clasifica el ángulo $\angle AVB$ e indica cuál es su arco interceptado.'
  pasos:
  - 'Paso 1: Verificar la posición del vértice: El vértice $V$ está sobre la circunferencia ($V \in \mathcal{C}$).'
  - 'Paso 2: Verificar los lados: Los segmentos $VA$ y $VB$ unen puntos de la circunferencia, por lo que son cuerdas.'
  - 'Paso 3: Clasificar: Cumple rigurosamente la definición de ángulo inscrito.'
  - 'Paso 4: Identificar el arco interceptado: Es el arco $\overset{\frown}{AB}$ comprendido entre los extremos de sus cuerdas.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la característica distintiva del vértice de un ángulo inscrito en una circunferencia?
  choices:
  - text: Se encuentra ubicado sobre la línea de la circunferencia.
    is_correct: true
  - text: Coincide con el centro de la circunferencia.
    is_correct: false
  - text: Está ubicado estrictamente en el exterior del círculo.
    is_correct: false
  - text: Es el punto medio del radio.
    is_correct: false
  explanation: La alternativa correcta es 'Se encuentra ubicado sobre la línea de la circunferencia.' El vértice de un ángulo inscrito pertenece al conjunto de puntos de la circunferencia.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué tipo de segmentos forman los lados de un ángulo inscrito?
  choices:
  - text: Dos cuerdas de la circunferencia.
    is_correct: true
  - text: Dos radios de la circunferencia.
    is_correct: false
  - text: Dos rectas tangentes exteriores.
    is_correct: false
  - text: Dos apotemas.
    is_correct: false
  explanation: La alternativa correcta es 'Dos cuerdas de la circunferencia.' Los lados unen el vértice con otros dos puntos de la circunferencia.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Localizar el vértice $V$ del ángulo en la figura.

  2. Confirmar que $V$ pertenezca al borde de la circunferencia.

  3. Verificar que los lados corten a la circunferencia formando dos cuerdas.

  4. Concluir que se trata de un ángulo inscrito e identificar el arco $\overset{\frown}{AB}$ que subtiende.

  '
errores_correccion: '- **Error común 1:** Creer que un ángulo con vértice en el interior del círculo es inscrito. **Corrección:** El vértice DEBE estar sobre el borde; si está adentro es ángulo interior.

  - **Error común 2:** Confundir ángulo inscrito con semiinscrito. **Corrección:** El inscrito tiene dos cuerdas; el semiinscrito tiene una cuerda y una tangente.

  '
ejemplos:
- tipo: A
  titulo: Reconocimiento de ángulo inscrito
  enunciado: Tres puntos $P, Q, R$ están sobre una circunferencia. ¿Qué tipo de ángulo es $\angle PQR$?
  alternativas:
  - text: Ángulo inscrito.
    is_correct: true
  - text: Ángulo del centro.
    is_correct: false
  - text: Ángulo semiinscrito.
    is_correct: false
  - text: Ángulo exterior.
    is_correct: false
  explicacion: Al tener su vértice $Q$ y sus lados en la circunferencia, es un ángulo inscrito.
- tipo: B
  titulo: Vértice periférico
  enunciado: ¿Debe el vértice de un ángulo inscrito pertenecer a la circunferencia?
  respuesta: Sí
  explicacion: Sí. La pertenencia del vértice a la circunferencia es el criterio definitorio de todo ángulo inscrito.
errores_frecuentes:
- '''Confundir el vértice sobre la circunferencia con el centro del círculo.'''
- '''Llamar ángulo inscrito a un ángulo cuyo vértice está fuera del círculo.'''
- '''Creer que los lados del ángulo inscrito son radios en lugar de cuerdas.'''
afirmaciones_verdaderas:
- '''El vértice de un ángulo inscrito pertenece obligatoriamente a la circunferencia.'''
- '''Los lados de un ángulo inscrito son cuerdas que conectan el vértice con otros puntos de la curva.'''
- '''Un triángulo inscrito en una circunferencia tiene sus tres ángulos interiores como ángulos inscritos.'''
al_terminar_debes_poder: '**QUÉ:** Reconocer y definir ángulos inscritos en la circunferencia.


  **CÓMO:** Verificando la condición $V \in \mathcal{C}$ y lados como cuerdas $\overline{VA}, \overline{VB}$.


  ![Síntesis de ángulo inscrito](/static/img/nodos/definicion-de-angulo-inscrito-en-una-circunferencia-resumen.svg)

  '
