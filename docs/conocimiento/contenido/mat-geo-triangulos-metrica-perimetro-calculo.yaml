semantic_id: MAT.GEO.TRIANGULOS_METRICA.PERIMETRO_CALCULO
resumen_inicial: El perímetro de un triángulo es el contorno continuo o la suma total
  de las longitudes de sus tres lados.
explicacion_simple: Imagina colocar un cerco o una cerca alrededor de un jardín triangular.
  La cantidad total de metros de alambre que necesitas es su perímetro.
explicacion_formal: 'El **perímetro** $P$ de un triángulo $\triangle ABC$ de lados
  $a, b, c$ es la magnitud escalar correspondiente a la suma aditiva de las longitudes
  de sus lados:


  $$P = a + b + c$$'
definiciones_clave: '- **Perímetro**: Longitud total del contorno del triángulo.

  - **Semiperímetro**: La mitad del perímetro, $s = \frac{a + b + c}{2}$.'
propiedades_relaciones: "- **Magnitud lineal**: Se mide en unidades de longitud ($\t\
  ext{m}, \text{cm}, \text{km}$).\n- **Independiente de los ángulos**: El perímetro\
  \ depende exclusivamente de la medida de sus lados."
ejemplo_guiado:
  enunciado: Un cantero de flores triangular tiene bordes que miden $a = 96\text{
    m}$, $b = 130\text{ m}$ y $c = 164\text{ m}$. Calcula cuántos metros de madera
    se necesitan para cercar todo su contorno.
  pasos:
  - 'Paso 1: Identificar las medidas de los 3 lados del triángulo: 96 m, 130 m y 164
    m.'
  - 'Paso 2: Sumar los tres lados: $P = 96 + 130 + 164$.'
  - 'Paso 3: Obtener el resultado final: $P = 390\text{ m}$ de madera para el cerco.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula el perímetro de cualquier triángulo?
  choices:
  - text: Sumando la longitud de sus tres lados
    is_correct: true
  - text: Multiplicando la base por la altura dividida por dos
    is_correct: false
  - text: Sumando sus tres ángulos interiores
    is_correct: false
  - text: Elevando al cuadrado su lado mayor
    is_correct: false
  explanation: La alternativa correcta es 'Sumando la longitud de sus tres lados'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los lados del cantero miden 96 m, 130 m y 164 m, ¿cuál es su perímetro
    total?
  choices:
  - text: 390 m
    is_correct: true
  - text: 288 m
    is_correct: false
  - text: 294 m
    is_correct: false
  - text: 180 m
    is_correct: false
  explanation: La alternativa correcta es '390 m', por la suma directa de los lados.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados y el teorema geométrico del concepto.'
- 'Paso 2: Plantear la ecuación algebraica o relación correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar su coherencia geométrica.'
errores_correccion: Evita confundir las propiedades de los lados con las de los ángulos
  interiores al clasificar la figura.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo dos ángulos interiores miden 71° y 68°, ¿cuánto mide
    el tercero?
  alternativas:
  - 41°
  - 139°
  - 90°
  respuesta: 41°
  solucion_pasos:
  - Despejar $x = 180 - (71 + 68) = 41^\circ$.
- titulo: Ejemplo 2
  enunciado: Si dos lados de un triángulo miden 94 cm y 127 cm, ¿cuál puede ser la
    medida del tercer lado?
  alternativas:
  - 219 cm
  - 226 cm
  - 0 cm
  respuesta: 219 cm
  solucion_pasos:
  - Por Desigualdad Triangular, el tercer lado debe ser menor que 221 cm.
- titulo: ¿La suma de los tres ángulos interiores de cualquier triángulo en el plano
    es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental e invariante de la geometría euclidiana.
- titulo: ¿Un triángulo puede tener dos ángulos rectos de 90° en su interior?
  respuesta: 'No'
  solucion_pasos:
  - No, porque 90° + 90° = 180°, dejando 0° para el tercer ángulo, lo cual imposibilita
    cerrar la figura.
errores_frecuentes:
- Declarar la suma de ángulos interiores (180°) con la suma de ángulos exteriores
  (360°).
- Afirmar que un triángulo isósceles tiene sus tres lados iguales (eso corresponde
  al equilátero).
- Declarar que cualquier trío de medidas de varillas puede formar un triángulo sin
  verificar la Desigualdad Triangular.
- Declarar los catetos con la hipotenusa en triángulos rectángulos orientados en distintas
  posiciones.
- Omitir que en un triángulo equilátero cada uno de sus tres ángulos interiores mide
  exactamente 60°.
afirmaciones_verdaderas:
- La suma de los ángulos interiores de todo triángulo en el plano es siempre igual
  a 180°.
- En todo triángulo rectángulo, la hipotenusa es el lado de mayor longitud opuesto
  al ángulo recto.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar y calcular las
  propiedades de cálculo del perímetro de un triángulo sumando sus tres lados resolviendo
  problemas geométricos con rigurosidad.
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Propiedades de Triángulos.
estado: publicado
