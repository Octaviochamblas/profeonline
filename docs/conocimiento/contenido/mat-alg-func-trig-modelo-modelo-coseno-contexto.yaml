semantic_id: MAT.ALG.FUNC_TRIG_MODELO.MODELO_COSENO_CONTEXTO
resumen_inicial: 'Modelamiento de fenómenos periódicos mediante función coseno: círculo
  unitario, amplitud, período y transformaciones de Modelamiento trigonométrico y
  extensiones.'
explicacion_simple: Cuando un fenómeno comienza en su punto más alto (o más bajo)
  en el instante de referencia, conviene usar la función coseno como base del modelo.
explicacion_formal: '### Definición formal


  El coseno básico comienza en su valor máximo. Si el fenómeno tiene ese comportamiento
  en el instante de referencia, conviene modelarlo con $f(t)=a\cos(b(t-c))+d$, ajustando
  amplitud, periodo, desfase y línea media según los datos observados.


  ### Desarrollo didáctico


  La temperatura de un lugar, si se mide a partir del mediodía (momento de mayor calor),
  comienza en su valor máximo; esto sugiere un modelo tipo coseno: $T(t)=a\cos(bt)+d$,
  donde $a$ es la variación de temperatura y $d$ la temperatura promedio.'
definiciones_clave: '- **Modelamiento de fenómenos periódicos mediante función coseno**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a modelamiento de fenómenos periódicos mediante función coseno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    modelamiento de fenómenos periódicos mediante función coseno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de modelamiento de fenómenos periódicos mediante función
    coseno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
