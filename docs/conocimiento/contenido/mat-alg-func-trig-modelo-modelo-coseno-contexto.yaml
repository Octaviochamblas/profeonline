semantic_id: MAT.ALG.FUNC_TRIG_MODELO.MODELO_COSENO_CONTEXTO
resumen_inicial: 'Construcción e interpretación de modelos contextuados mediante la función coseno $y(t) = A\cos(Bt + C) + D$.'
explicacion_simple: |
  Para construir un modelo matemático utilizando la función **coseno**, empleamos la ecuación $y(t) = A\cos(Bt + C) + D$. El coseno es la herramienta perfecta cuando el fenómeno que estamos estudiando comienza en el tiempo inicial ($t = 0$) en su punto extremo (por ejemplo, en su pico máximo o en su punto mínimo). La amplitud $A$ representa cuánto se aleja del centro, el término $D$ representa el valor promedio y la constante $B$ ajusta la velocidad del tiempo para que complete una vuelta en el período $T$.
explicacion_formal: |
  ### Definición formal
  El **modelo cosenoidal de un fenómeno contextual** es la función real $y: \mathbb{R} \to [y_{\min}, y_{\max}]$ que describe la magnitud $y$ en función del tiempo $t$ mediante:
  $$y(t) = A\cos(Bt + C) + D$$
  donde los coeficientes se calculan como:
  1. Línea media de equilibrio: $D = \frac{y_{\max} + y_{\min}}{2}$
  2. Amplitud de oscilación: $A = \frac{y_{\max} - y_{\min}}{2}$
  3. Frecuencia angular: $B = \frac{2\pi}{T}$
  4. Desfase $C$: Se ajusta según la ubicación del pico máximo inicial.

  ### Desglose simbólico
  - $y(0) = D + A$ (si $C = 0$ y $A > 0$): La función arranca en su valor máximo en $t = 0$.
  - $y(0) = D - A$ (si $C = 0$ y $A < 0$): La función arranca en su valor mínimo en $t = 0$.
  - $y\left(\frac{T}{2}\right) = D - A$: Alcanza el extremo opuesto en la mitad del período.

  ### Síntesis didáctica
  La función coseno sin desfase ($C=0$) es la opción de modelamiento estándar cuando el fenómeno se encuentra en su valor máximo o mínimo absoluto justo en el instante de inicio de la medición ($t=0$).
definiciones_clave: |
  - **Modelo cosenoidal**: Representación matemática periódica de procesos que inician en un extremo relativo.
  - **Condición de inicio en el extremo**: Propiedad por la cual en $t=0$ la función toma el valor $D + A$ o $D - A$.
  - **Tiempo de ciclo ($T$)**: Intervalo necesario para que el fenómeno vuelva a su pico máximo inicial.
propiedades_relaciones: |
  - **Modelamiento de temperaturas estacionales**: Muy utilizado para representar temperaturas mensuales donde el pico máximo (verano) o mínimo (invierno) ocurre en un mes de referencia.
  - **Modelamiento de ruedas y péndulos**: Ideal para registrar alturas soltando un objeto desde su punto más alto.
ejemplo_guiado:
  enunciado: 'La temperatura media de una ciudad oscila periódicamente a lo largo de $12$ meses entre un mínimo de $6^\circ\text{C}$ en invierno y un máximo de $26^\circ\text{C}$ en verano. Si el máximo ocurre en el mes $t = 0$ (enero), construye el modelo cosenoidal $T(t)$.'
  pasos:
    - 'Paso 1: Calcular la línea media: $D = \frac{26 + 6}{2} = \frac{32}{2} = 16^\circ\text{C}$.'
    - 'Paso 2: Calcular la amplitud: $A = \frac{26 - 6}{2} = \frac{20}{2} = 10^\circ\text{C}$.'
    - 'Paso 3: Calcular la frecuencia angular para $T = 12$ meses: $B = \frac{2\pi}{12} = \frac{\pi}{6}$.'
    - 'Paso 4: Como en $t = 0$ se alcanza el máximo de $26^\circ\text{C}$ ($16 + 10 = 26$), no requiere desfase ($C = 0$).'
    - 'Paso 5: Escribir el modelo final: $T(t) = 10\cos\left(\frac{\pi}{6}t\right) + 16$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En un modelo cosenoidal sin desfase $y(t) = A\cos(Bt) + D$ (con $A > 0$), ¿qué valor toma la variable en $t = 0$?'
    choices:
      - {text: 'El valor máximo absoluto $y(0) = D + A$', is_correct: true}
      - {text: 'El valor de la línea media $y(0) = D$', is_correct: false}
      - {text: 'El valor mínimo absoluto $y(0) = D - A$', is_correct: false}
      - {text: 'El valor nulo $y(0) = 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor máximo absoluto $y(0) = D + A$''. Como $\cos(0) = 1$, resulta $y(0) = A(1) + D = D + A$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para la temperatura $T(t) = 10\cos\left(\frac{\pi}{6}t\right) + 16$, ¿cuál es la temperatura prevista a los $t = 6$ meses (julio)?'
    choices:
      - {text: '$6^\circ\text{C}$', is_correct: true}
      - {text: '$16^\circ\text{C}$', is_correct: false}
      - {text: '$26^\circ\text{C}$', is_correct: false}
      - {text: '$10^\circ\text{C}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$6^\circ\text{C}$''. Evaluando: $T(6) = 10\cos(\pi) + 16 = 10(-1) + 16 = 6^\circ\text{C}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las cotas máxima $y_{\max}$ y mínima $y_{\min}$ del proceso.'
  - 'Paso 2: Obtener la amplitud $A = \frac{y_{\max} - y_{\min}}{2}$ y la línea media $D = \frac{y_{\max} + y_{\min}}{2}$.'
  - 'Paso 3: Determinar el período $T$ en unidades temporales y calcular $B = \frac{2\pi}{T}$.'
  - 'Paso 4: Comprobar el comportamiento en $t = 0$: usar $A>0$ si parte en la cresta o $A<0$ si parte en el valle para escribir $y(t) = A\cos(Bt)+D$.'
errores_correccion: |
  - **Error 1:** Usar el modelo senoidal en lugar del cosenoidal cuando el proceso arranca en un pico máximo. **Cómo corregirlo:** Si en $t=0$ la variable se encuentra en su altura máxima $y_{\max}$, la función coseno pura es la más directa y libre de desfases.
  - **Error 2:** Asumir que la constante $B$ es igual al número de meses o segundos del período. **Cómo corregirlo:** El parámetro $B$ se debe calcular siempre dividiendo $2\pi$ por la duración del ciclo ($B = \frac{2\pi}{T}$).
ejemplos:
  - titulo: 'Modelo de masa colgada de un resorte'
    enunciado: 'Un resorte se estira hacia abajo hasta $y = -5$ cm y se suelta en $t = 0$. Si su posición de equilibrio es $y = 0$ y su período es de $2$ segundos, ¿cuál es el modelo $y(t)$?'
    alternativas:
      - '$y(t) = -5\cos(\pi t)$'
      - '$y(t) = 5\sin(\pi t)$'
      - '$y(t) = 5\cos(2\pi t)$'
    respuesta: '$y(t) = -5\cos(\pi t)$'
    solucion_pasos:
      - '1. Inicia en el valle $-5$, por lo que $A = -5$ con coseno.'
      - '2. $B = \frac{2\pi}{2} = \pi$.'
      - '3. El modelo es $y(t) = -5\cos(\pi t)$.'
  - titulo: 'Evaluación del modelo cosenoidal'
    enunciado: '¿En el modelo $y(t) = -5\cos(\pi t)$ cuál es la posición en $t = 1$ segundo?'
    alternativas:
      - '$5$ cm'
      - '$-5$ cm'
      - '$0$ cm'
    respuesta: '$5$ cm'
    solucion_pasos:
      - '1. $y(1) = -5\cos(\pi) = -5(-1) = 5$ cm.'
      - '2. A la mitad del período la masa alcanza la cresta máxima.'
  - titulo: 'Pila de agua en el puerto'
    enunciado: 'Si una marea arranca en su pleamar (máximo) de $12$ metros en $t = 0$, ¿es óptimo usar la función coseno?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues la función coseno inicia en el valor máximo para $t = 0$.'
  - titulo: 'Amplitud de oscilación estacional'
    enunciado: 'En la temperatura $T(t) = 10\cos\left(\frac{\pi}{6}t\right) + 16$, ¿la amplitud de la variación es de $10^\circ\text{C}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, la oscilación varía $10^\circ\text{C}$ arriba y abajo de la media de $16^\circ\text{C}$.'
errores_frecuentes:
  - 'La afirmación de que el modelo cosenoidal $y(t) = A\cos(Bt) + D$ siempre da como resultado cero cuando $t = 0$.'
  - 'La afirmación de que en un modelo de temperatura la amplitud equivale al valor máximo $y_{\max}$.'
  - 'La afirmación de que la función coseno no se puede utilizar si el fenómeno inicia en su valor mínimo.'
  - 'La afirmación de que la constante de frecuencia $B$ equivale a la duración del período en meses directamente.'
  - 'La afirmación de que el término $D$ en un modelo físico puede eliminarse si no es un número entero.'
afirmaciones_verdaderas:
  - 'El modelo cosenoidal $y(t) = A\cos(Bt) + D$ es la herramienta matemática ideal para representar fenómenos periódicos que inician en un extremo (máximo o mínimo) en el tiempo $t = 0$.'
  - 'En un modelo cosenoidal de oscilación, la variable $y(t)$ alcanza su valor máximo $D + |A|$ y su valor mínimo $D - |A|$ separados por un tiempo igual a la mitad del período $\frac{T}{2}$.'
al_terminar_debes_poder: |
  QUÉ: Construir e interpretar un modelo matemático cosenoidal $y(t) = A\cos(Bt + C) + D$ en situaciones prácticas.
  CÓMO: Ajustar la amplitud $A$, la frecuencia $B$ y la línea media $D$ asociando la condición inicial en $t=0$ a un extremo del fenómeno.
