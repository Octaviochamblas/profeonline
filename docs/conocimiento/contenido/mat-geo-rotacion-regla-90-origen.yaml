semantic_id: MAT.GEO.ROTACION_PLANO.REGLA_90_ORIGEN
resumen_inicial: 'Regla de rotación de 90° en torno al origen: conceptos, teoremas,
  propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: 'Rotar un punto 90° alrededor del origen sigue una regla simple:
  la nueva ordenada es la antigua abscisa, y la nueva abscisa es el opuesto de la
  antigua ordenada.'
explicacion_formal: '![Regla de rotación de 90° en torno al origen](/static/img/geometria/isometrias/rotacion-regla-90-origen.svg)


  ### Definición formal


  La rotación de $90°$ (antihoraria) en torno al origen transforma $P(x,y)$ en $P''(-y,x)$:
  la abscisa de la imagen es el opuesto de la ordenada original, y la ordenada de
  la imagen es la abscisa original.


  ### Desarrollo didáctico


  En la figura, el punto $P(3,2)$ rotado 90° alrededor del origen se transforma en
  $P''(-2,3)$: se aplica directamente la regla $(x,y)\to(-y,x)$.'
definiciones_clave: '- **Regla de rotación de 90° en torno al origen**: Elemento o
  propiedad fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a regla de rotación de 90° en torno al origen.'
ejemplo_guiado:
