procedimiento:
- 'Paso 1: Identifica las coordenadas del punto P(x,y) que se desea rotar 90° alrededor
  del origen.'
- 'Paso 2: Calcula la nueva abscisa como el opuesto de la ordenada original: -y.'
- 'Paso 3: Calcula la nueva ordenada como la abscisa original: x, obteniendo P''(-y,x).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con regla de rotación de 90° en torno al origen.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de regla de rotación de 90° en torno al origen para
    determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
