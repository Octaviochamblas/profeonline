- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de regla de rotación de 90° en torno
    al origen y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
