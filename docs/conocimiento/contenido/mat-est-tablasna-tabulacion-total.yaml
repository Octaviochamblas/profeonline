semantic_id: MAT.EST.TABLAS_NO_AGRUPADAS.TABULACION_TOTAL
titulo: Construir una tabla de frecuencia completa para datos no agrupados
objetivo: Aplicar el procedimiento completo de tabulación, integrando frecuencia absoluta,
  acumulada, relativa y relativa acumulada en una sola tabla.
introduccion: Este recurso integra todos los conceptos previos del tema en un único
  procedimiento aplicado a un conjunto de datos real.
resumen: La tabulación completa consiste en organizar un conjunto de datos no agrupados
  en una tabla con las columnas x, f, F, fr y Fr, calculadas de forma consistente
  entre sí.
explicacion: '![Procedimiento completo de tabulación](/static/img/estadistica/tablasna/tablasna-tabulacion-total.svg)


  ### Definición formal


  Una tabla de frecuencia completa contiene, para cada valor $x_i$: su frecuencia
  absoluta $f_i$, acumulada $F_i$, relativa $fr_i=f_i/n$ y relativa acumulada $Fr_i=F_i/n$.


  ### Desarrollo didáctico


  Con datos {4,5,5,6,6,6,7} (n=7): x=4,f=1,F=1,fr≈0,14,Fr≈0,14; x=5,f=2,F=3,fr≈0,29,Fr≈0,43;
  x=6,f=3,F=6,fr≈0,43,Fr≈0,86; x=7,f=1,F=7,fr≈0,14,Fr=1.'
procedimiento:
- 'Paso 1: Ordena los valores distintos del conjunto de datos y cuenta su frecuencia
  absoluta (f).'
- 'Paso 2: Calcula la frecuencia absoluta acumulada (F) sumando progresivamente las
  frecuencias.'
- 'Paso 3: Calcula la frecuencia relativa (fr=f/n) y la relativa acumulada (Fr=F/n)
  para completar la tabla.'
ejemplos:
- titulo: Construir la tabla completa para {4,5,5,6,6,6,7}
  enunciado: n=7.
  solucion_pasos:
  - 'x=4: f=1,F=1,fr≈0,14,Fr≈0,14. x=5: f=2,F=3,fr≈0,29,Fr≈0,43. x=6: f=3,F=6,fr≈0,43,Fr≈0,86.
    x=7: f=1,F=7,fr≈0,14,Fr=1.'
- titulo: Construir la tabla completa para {1,1,2,3,3,3}
  enunciado: n=6.
  solucion_pasos:
  - 'x=1: f=2,F=2,fr≈0,33,Fr≈0,33. x=2: f=1,F=3,fr≈0,17,Fr=0,5. x=3: f=3,F=6,fr=0,5,Fr=1.'
- titulo: ¿La columna F siempre termina en el total de datos (n)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la propiedad de la frecuencia acumulada, que suma todas las frecuencias
    absolutas.
- titulo: ¿La columna Fr siempre termina en 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, ya que la última F es igual a n, dando Fr=n/n=1.
errores_frecuentes:
- Calcular una columna sin verificar su consistencia con las demás (por ejemplo, fr
  que no coincide con f/n).
- No verificar que la última F sea igual a n y la última Fr sea igual a 1, como control
  de calidad de la tabla.
- Declarar el orden de las columnas o mezclar los valores entre distintas filas.
fuente: 'Elaboración propia (referencia: Moraleja 198, 351).'
estado: publicado
