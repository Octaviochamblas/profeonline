semantic_id: MAT.GEO.PITAGORAS.ENUNCIADO
resumen_inicial: 'Enunciado del teorema de Pitágoras: el cuadrado de la hipotenusa
  es igual a la suma de los cuadrados de los catetos: conceptos, teoremas, propiedades
  geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: 'El teorema de Pitágoras es una de las relaciones más usadas en
  geometría: conecta la medida de la hipotenusa con la de los dos catetos de cualquier
  triángulo rectángulo.'
explicacion_formal: '![Teorema de Pitágoras: catetos e hipotenusa](/static/img/geometria/areas-pitagoras/pitagoras-enunciado.svg)


  ### Definición formal


  En un triángulo rectángulo de catetos $a$ y $b$ e hipotenusa $c$, se cumple $c^2=a^2+b^2$.


  ### Desarrollo didáctico


  En el triángulo rectángulo de catetos 3 y 4, la hipotenusa cumple $c^2=3^2+4^2=9+16=25$,
  por lo que $c=5$: es la conocida terna pitagórica 3-4-5.'
