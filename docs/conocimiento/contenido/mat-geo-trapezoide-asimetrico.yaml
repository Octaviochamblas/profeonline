semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.TRAPEZOIDE_ASIMETRICO
resumen_inicial: 'Características del trapezoide asimétrico: conceptos, teoremas,
  propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: 'Existe una última categoría de cuadrilátero, la más general de
  todas: aquella que no cumple ninguna condición especial de paralelismo o simetría.'
explicacion_formal: '![Trapezoide asimétrico: sin lados paralelos ni ejes de simetría](/static/img/geometria/poligonos-cuadrilateros/trapezoide-asimetrico.svg)


  ### Definición formal


  Un trapezoide asimétrico es un cuadrilátero $ABCD$ en el que ningún par de lados
  opuestos es paralelo ($AB\nparallel CD$ y $BC\nparallel AD$), y que no posee ningún
  eje de simetría.


  ### Desarrollo didáctico


  A diferencia de todos los demás cuadriláteros estudiados (paralelogramos y trapecios,
  que tienen al menos un par de lados paralelos), el trapezoide asimétrico es el caso
  más ''irregular'': sus cuatro lados y ángulos pueden ser completamente distintos
  entre sí, sin ninguna relación especial.'
definiciones_clave: '- **Características del trapezoide asimétrico**: Elemento o propiedad
