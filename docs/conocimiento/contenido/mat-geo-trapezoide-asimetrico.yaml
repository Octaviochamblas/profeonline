procedimiento:
- 'Paso 1: Verifica si el cuadrilátero tiene algún par de lados paralelos.'
- 'Paso 2: Verifica si tiene algún eje de simetría.'
- 'Paso 3: Si no cumple ninguna de las dos condiciones, es un trapezoide asimétrico.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con características del trapezoide asimétrico.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de características del trapezoide asimétrico para
    determinar la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
