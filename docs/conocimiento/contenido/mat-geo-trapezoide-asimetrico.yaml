- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de características del trapezoide asimétrico
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
