errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en definición de cuadrado de binomio suma.
ejemplos:
- titulo: Expansión conceptual
  enunciado: Expresa conceptualmente qué significa $(3x + 5y)^2$.
  solucion_pasos:
  - Identificamos que la base es $3x + 5y$.
  - Significa $(3x + 5y)(3x + 5y)$.
- titulo: Si $(x + y)^2 = 100$ y se sabe que $x^2 + y^2 = 68$, ¿cuál es el valor del
    producto $xy$
  enunciado: 'Si $(x + y)^2 = 100$ y se sabe que $x^2 + y^2 = 68$, ¿cuál es el valor
    del producto $xy$?


    Opciones: A) $16$ · B) $32$ · C) $10$ · D) $8$'
  solucion_pasos:
  - $(x+y)^2 = x^2 + 2xy + y^2 = 100$. Sabemos $x^2 + y^2 = 68$. $68 + 2xy = 100 \Rightarrow
    2xy = 32 \Rightarrow xy = 16$.
  - 'Respuesta: $16$'
- titulo: 'Respecto de «Definición de cuadrado de binomio suma»: ¿Es correcta esta
    caracterización? «El'
  enunciado: 'Respecto de «Definición de cuadrado de binomio suma»: ¿Es correcta esta
    caracterización? «El cuadrado de un binomio suma se define como la multiplicación
    del binomio por sí mismo: $(a+b)^2 = (a+b)(a+b)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El cuadrado de un binomio suma
    se define como la multiplicación del binomio por sí mismo: $(a+b)^2 = (a+b)(a+b)$.'
- titulo: 'Respecto de «Definición de cuadrado de binomio suma»: ¿Es válida esta afirmación?
    «Pensar qu'
  enunciado: 'Respecto de «Definición de cuadrado de binomio suma»: ¿Es válida esta
    afirmación? «Pensar que el exponente se distribuye sobre la suma: $(a+b)^2 = a^2
    + b^2$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El cuadrado de un binomio suma
    se define como la multiplicación del binomio por sí mismo: $(a+b)^2 = (a+b)(a+b)$.'
errores_frecuentes:
- 'Pensar que el exponente se distribuye sobre la suma: $(a+b)^2 = a^2 + b^2$.'
- $m^2 + n^2$.
- $2(m + n)$.
- $m^2 + m + n + n^2$.
- Para «¿Por qué $(a+b)^2$ no es igual a $a^2+b^2$ en general (para $a,b \neq 0$)»,
  la respuesta correcta es Porque el exponente $2$ solo afecta a la primera variable.
afirmaciones_verdaderas:
- Los productos notables permiten obtener desarrollos algebraicos sin multiplicar
