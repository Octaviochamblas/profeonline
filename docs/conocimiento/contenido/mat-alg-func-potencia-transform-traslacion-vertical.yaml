semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.TRASLACION_VERTICAL
resumen_inicial: 'Descripción de la traslación vertical de una función potencia: forma
  general $f(x) = a x^n$, simetría, dominio y recorrido en Traslaciones y escalas.'
explicacion_simple: Sumar una constante fuera de la potencia mueve toda la curva hacia
  arriba o hacia abajo, sin alterar su forma horizontal.
explicacion_formal: '### Definición formal


  Dada $g(x)=a\cdot x^n$, la función $f(x)=g(x)+k=a\cdot x^n+k$ tiene la misma forma
  que $g$, pero cada punto $(x_0,y_0)$ de $g$ se traslada al punto $(x_0,y_0+k)$ en
  $f$. El valor de referencia, antes en $y=0$, pasa a estar en $y=k$.


  ### Desarrollo didáctico


  $f(x)=x^2+3$ tiene la misma forma de copa que $x^2$, pero su vértice está en $(0,3)$
  en vez de $(0,0)$. Evaluar $f(0)=3$ confirma el desplazamiento vertical.'
definiciones_clave: '- **Descripción de la traslación vertical de una función potencia**:
  Función de la forma $f(x) = a x^n$ con $a \neq 0$ y $n \in \mathbb{R}$.'
propiedades_relaciones: '- **Simetría y asíntotas**: Paridad del exponente $n$ (simetría
  par en eje $Y$, impar en el origen) y comportamiento de asíntotas en exponentes
  negativos aplicados a descripción de la traslación vertical de una función potencia.'
ejemplo_guiado:
  enunciado: Analiza la función potencia $f(x) = a x^n$ y determina las características
    de descripción de la traslación vertical de una función potencia.
  pasos:
  - Identificar el signo y magnitud del coeficiente $a$, y la naturaleza del exponente
    $n$ (par/impar, positivo/negativo).
  - Aplicar los criterios de gráfica, simetría y monotonía de descripción de la traslación
    vertical de una función potencia.
  - Determinar el dominio y recorrido de la función.
  - Esbozar la gráfica o interpretar el resultado en su contexto.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los parámetros determinantes en la forma general $f(x) = a
    x^n$ al estudiar descripción de la traslación vertical de una función potencia?
  choices:
  - text: Analizar la paridad y el signo del exponente n junto con el signo del coeficiente
      a en traslaciones y escalas
    is_correct: true
  - text: Sumar los coeficientes sin considerar el exponente
    is_correct: false
  - text: Fijar siempre el exponente n en cero
    is_correct: false
  - text: Ignorar el signo del coeficiente a
    is_correct: false
  explanation: 'La alternativa correcta es: Analizar la paridad y el signo del exponente
    n junto con el signo del coeficiente a en traslaciones y escalas. El exponente
    n y el coeficiente a determinan la forma de la gráfica.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo influye la paridad del exponente positivo n en la simetría de la
    función potencia en descripción de la traslación vertical de una función potencia?
  choices:
  - text: Identificar que si n es par positivo, la gráfica es simétrica respecto al
      eje Y, y si es impar positivo, respecto al origen
    is_correct: true
  - text: Todas las funciones potencia carecen de simetría
    is_correct: false
  - text: Si n es par, la función se invierte horizontalmente
    is_correct: false
  - text: Si n es impar, la gráfica es una recta horizontal
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar que si n es par positivo,
    la gráfica es simétrica respecto al eje Y, y si es impar positivo, respecto al
    origen. Regla de simetría fundamental en funciones potencia.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica el valor de $k$ sumado fuera de la potencia.'
- 'Paso 2: Reconoce que el valor de referencia se traslada a $y=k$.'
- 'Paso 3: Traza la gráfica básica y desplázala verticalmente según el valor de $k$.'
errores_correccion: Evita considerar $x = 0$ en el dominio cuando el exponente es
  entero negativo en descripción de la traslación vertical de una función potencia.
ejemplos:
- titulo: Identificación del desplazamiento en $x^2+5$
  enunciado: ¿Cuál es el desplazamiento vertical de $f(x)=x^2+5$?
  solucion_pasos:
  - Se identifica $k=5$.
  - La gráfica se desplaza $5$ unidades hacia arriba respecto a $x^2$.
- titulo: Cálculo del nuevo vértice
  enunciado: ¿En qué punto se ubica el vértice de $f(x)=x^4-2$?
  solucion_pasos:
  - Se identifica $k=-2$.
  - El vértice se ubica en $(0,-2)$.
- titulo: ¿La traslación vertical cambia el dominio de la función?
  enunciado: ¿Una traslación vertical afecta el dominio de una función potencia?
  respuesta: 'No'
  solucion_pasos:
  - Solo afecta la posición vertical y el recorrido; el dominio permanece igual.
- titulo: ¿La traslación vertical afecta el recorrido de la función?
  enunciado: ¿Una traslación vertical modifica el recorrido de la función?
  respuesta: Sí
  solucion_pasos:
  - Todo el recorrido se desplaza $k$ unidades en la misma dirección que la traslación.
errores_frecuentes:
- Declarar la traslación vertical con la horizontal, aplicándola sobre $x$ en vez
  de sobre $y$.
- Suponer que la traslación vertical afecta el dominio de la función.
- No identificar correctamente el valor de $k$ cuando aparece con signo negativo.
- Omitir actualizar el recorrido tras aplicar el desplazamiento.
afirmaciones_verdaderas:
- Para exponente entero positivo par, el recorrido de $f(x) = a x^n$ con $a > 0$ es
  $[0, +\infty)$.
al_terminar_debes_poder: Analizar, graficar y evaluar funciones potencia aplicando
  descripción de la traslación vertical de una función potencia.
