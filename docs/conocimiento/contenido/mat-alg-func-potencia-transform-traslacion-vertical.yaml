semantic_id: MAT.ALG.FUNC_POTENCIA_TRANSFORM.TRASLACION_VERTICAL
resumen_inicial: 'La traslación vertical de una función potencia $f(x) = a x^n$ por $|k|$ unidades desplaza la gráfica paralelamente al eje de las ordenadas, adoptando la forma $g(x) = a x^n + k$.'
explicacion_simple: |
  La traslación vertical consiste en subir o bajar toda la gráfica de una función potencia hacia arriba o hacia abajo sin alterar su forma ni su apertura. Para lograr este desplazamiento vertical, sumamos o restamos una constante $k$ por fuera de la potencia. El punto central o vértice de la curva pasa de estar en el origen $(0, 0)$ a ubicarse en la nueva ordenada $(0, k)$.
explicacion_formal: |
  ### Definición formal
  La **traslación vertical de la función potencia** $f(x) = a x^n$ mediante el vector de desplazamiento vertical $\vec{v} = (0, k)$ es la transformación geométrica descrita por la función:
  $$g(x) = f(x) + k = a x^n + k$$

  ### Mapeo de pares ordenados
  - Para todo punto de la curva canónica $(x_0, y_0) \in \operatorname{Graf}(f)$, el punto transformado correspondiente es $(x_0, y_0 + k) \in \operatorname{Graf}(g)$.
  - **Invariancia de Abscisas**: Las posiciones horizontales $x$ se conservan idénticas, pero sufren una alteración uniforme de $k$ unidades en las ordenadas de salida $y$.

  ### Síntesis didáctica
  Traslación del punto de inflexión o vértice: El origen de coordenadas $(0, 0)$ de la función potencia canónica se desplaza exactamente al punto cartesiano $(0, k)$.
definiciones_clave: |
  - **Traslación vertical $g(x) = f(x) + k$**: Transformación isométrica que desplaza la curva paralelamente al eje $y$.
  - **Parámetro de desplazamiento vertical $k$**: Constante aditiva externa que determina la cantidad de unidades de desplazamiento vertical.
  - **Vértice trasladado $(0, k)$**: Nueva posición cartesiana del centro de referencia de la función.
propiedades_relaciones: |
  - **Modificación del Recorrido**: La traslación vertical traslada las cotas y el conjunto recorrido de la función.
    - Para exponente par y $a > 0$: El recorrido cambia de $[0, +\infty[$ al nuevo intervalo $[k, +\infty[$.
    - Para exponente par y $a < 0$: El recorrido cambia de $]-\infty, 0]$ al nuevo intervalo $]-\infty, k]$.
  - **Isometría rígida**: No altera la curvatura ni la velocidad de crecimiento de la gráfica original.
ejemplo_guiado:
  enunciado: 'Aplica una traslación vertical de $k = 4$ unidades hacia arriba a la función potencia $f(x) = 3x^2$, escribe la fórmula resultante $g(x)$, y determina las nuevas coordenadas del vértice y el nuevo conjunto recorrido.'
  pasos:
    - 'Paso 1: Para traslación vertical de $k = 4$, sumamos $4$ por fuera de la potencia. Fórmula: $g(x) = 3x^2 + 4$.'
    - 'Paso 2: El vértice de $f(x)$ que estaba en $(0, 0)$ se desplaza a la nueva ordenada $y = 4 \implies (0, 4)$.'
    - 'Paso 3: El mínimo absoluto original $y = 0$ pasa a ser $y = 4$.'
    - 'Paso 4: El nuevo conjunto recorrido es el intervalo cerrado $\operatorname{Rec}(g) = [4, +\infty[$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la fórmula algebraica de la función resultante de aplicar una traslación vertical de $k = -6$ unidades a la función potencia $f(x) = 2x^3$?'
    choices:
      - {text: '$g(x) = 2x^3 - 6$', is_correct: true}
      - {text: '$g(x) = 2(x - 6)^3$', is_correct: false}
      - {text: '$g(x) = 2(x + 6)^3$', is_correct: false}
      - {text: '$g(x) = -12x^3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = 2x^3 - 6$''. La traslación vertical resta el término constante $6$ por fuera de la potencia $f(x) + k$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el conjunto recorrido de la función potencia de exponente par $g(x) = x^4 + 5$?'
    choices:
      - {text: 'El intervalo cerrado de reales $\operatorname{Rec}(g) = [5, +\infty[$', is_correct: true}
      - {text: 'El intervalo de reales no negativos $[0, +\infty[$', is_correct: false}
      - {text: 'El conjunto completo de los números reales $\mathbb{R}$', is_correct: false}
      - {text: 'El intervalo de reales no positivos $]-\infty, 5]$', is_correct: false}
    explanation: 'La alternativa correcta es ''El intervalo cerrado de reales $\operatorname{Rec}(g) = [5, +\infty[$''. La constante aditiva $k = 5$ traslada la cota mínima de $y = 0$ a $y = 5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la función potencia base $f(x) = a x^n$ y la cantidad de unidades de traslación $k$.'
  - 'Paso 2: Sumar o restar la constante $k$ por fuera de la expresión de la potencia.'
  - 'Paso 3: Escribir la nueva función en forma canónica $g(x) = a x^n + k$.'
  - 'Paso 4: Actualizar las coordenadas de los puntos clave $y_0 \to y_0 + k$ y redefinir el conjunto recorrido.'
errores_correccion: |
  - **Error 1:** Sumar la constante $k$ dentro del paréntesis de la variable (ej: escribir $a(x + k)^n$). **Cómo corregirlo:** La suma dentro de la base representa una traslación **horizontal**. La traslación **vertical** exige sumar $k$ por fuera de la potencia: $a x^n + k$.
  - **Error 2:** Creer que la traslación vertical no modifica el recorrido de funciones de exponente par. **Cómo corregirlo:** Sumar $k$ por fuera desfasar la cota mínima o máxima de la función, modificando el recorrido de $[0, +\infty[$ a $[k, +\infty[$ (o de $]-\infty, 0]$ a $]-\infty, k]$).
ejemplos:
  - titulo: 'Formulación de traslación vertical'
    enunciado: '¿La traslación de $f(x) = x^3$ en $k = 7$ unidades hacia arriba es $g(x) = x^3 + 7$?'
    alternativas:
      - 'Sí, $g(x) = x^3 + 7$'
      - 'No, $g(x) = (x + 7)^3$'
      - 'No, $g(x) = 7x^3$'
    respuesta: 'Sí, $g(x) = x^3 + 7$'
    solucion_pasos:
      - '1. Sumamos 7 por fuera de la potencia.'
      - '2. La función trasladada es $g(x) = x^3 + 7$.'
  - titulo: 'Vértice en parábola desfasada verticalmente'
    enunciado: '¿El vértice de $f(x) = 2x^2 - 3$ está en $(0, -3)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En $x = 0$, $f(0) = 2(0)^2 - 3 = -3$. Vértice en $(0, -3)$.'
  - titulo: 'Recorrido modificado'
    enunciado: '¿El recorrido de $g(x) = x^2 - 8$ es $[-8, +\infty[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El mínimo valor posible es $y = -8 \implies \operatorname{Rec}(g) = [-8, +\infty[$.'
  - titulo: 'Evaluación de punto trasladado'
    enunciado: 'Si $f(x) = x^4$ pasa por $(1, 1)$, ¿$g(x) = x^4 + 5$ pasa por $(1, 6)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $g(1) = 1^4 + 5 = 6$. Ordenada trasladada $1 + 5 = 6$.'
errores_frecuentes:
  - 'La traslación vertical de $f(x) = x^2$ por $k = 4$ se escribe $g(x) = (x + 4)^2$.'
  - 'Un desplazamiento vertical no altera el valor mínimo del recorrido en una función potencia par.'
  - 'Sumar una constante por fuera de la potencia modifica la abscisa del vértice.'
  - 'El vértice de la función $f(x) = x^3 - 5$ permanece en el punto $(0, 0)$.'
  - 'La traslación vertical altera el exponente $n$ de la función potencia.'
afirmaciones_verdaderas:
  - 'La traslación vertical de una función potencia $f(x) = a x^n$ suma la constante $k$ por fuera de la potencia, resultando en la función $g(x) = a x^n + k$.'
  - 'Las traslaciones verticales mueven la gráfica $k$ unidades paralelamente al eje $y$, modificando el vértice a $(0, k)$ y desplazando el conjunto recorrido de la función.'
