resumen_inicial: Una expresión algebraica entera es aquella en la que ninguna de sus
  variables literales figura en el denominador ni está elevada a exponentes negativos.
explicacion_simple: Decimos que una expresión es 'entera' cuando sus letras no están
  atrapadas en la parte de abajo de una fracción (en el denominador). Pueden tener
  números fraccionarios como coeficientes (como $\frac{1}{2}x^2$), pero las letras
  nunca deben estar abajo.
explicacion_formal: 'Se define la **Expresión Algebraica Entera** $E(x_1, \dots, x_m)$
  como aquella suma finita de monomios donde el exponente $e_{k,j}$ de cada variable
  $x_j$ es un número entero no negativo:


  $$E(x_1, \dots, x_m) = \sum_{k=1}^n c_k \prod_{j=1}^m x_j^{e_{k,j}} \quad \text{con
  } c_k \in \mathbb{R}, \quad e_{k,j} \in \mathbb{N}_0$$


  > **Complemento didáctico:** La expresión entera coincide con la definición clásica
  de polinomio sobre el cuerpo de los números reales.'
definiciones_clave: '- **Expresión entera**: Expresión algebraica sin variables en
  los denominadores.

  - **Polinomio entero**: Denominación equivalente a una expresión algebraica entera.'
propiedades_relaciones: '- **Permisividad de coeficientes**: El coeficiente numérico
  puede ser cualquier número real (fraccionario, irracional o entero).'
ejemplo_guiado:
  enunciado: Verifique si $E(x) = \frac{3}{5}x^3 - 4x^2 + 7$ es una expresión algebraica
    entera.
  pasos:
  - 'Paso 1: Identificar las variables presentes: $x^3, x^2$.'
  - 'Paso 2: Comprobar la ubicación de las variables: están en los numeradores con
    exponentes $3$ y $2$ enteros no negativos.'
  - 'Paso 3: Observar la fracción $\frac{3}{5}$: afecta solo al coeficiente numérico,
    no a las letras.'
  - 'Conclusión: SÍ es una expresión algebraica entera.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición define formalmente a una expresión algebraica entera respecto
    a sus variables?
  choices:
  - text: Que ninguna de sus variables literales se encuentre en un denominador ni
      tenga exponente negativo
    is_correct: true
  - text: Que todos sus coeficientes numéricos sean enteros no fraccionarios
    is_correct: false
  - text: Que su grado sea exactamente 1
    is_correct: false
  - text: Que no contenga signos menos
    is_correct: false
  explanation: La alternativa correcta es 'Que ninguna de sus variables literales
    se encuentre en un denominador ni tenga exponente negativo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (3/5)x^3 - 4x^2 + 7, ¿por qué fue clasificada
    como expresión entera?
  choices:
  - text: Porque la fracción 3/5 pertenece al coeficiente numérico y no a las variables
    is_correct: true
  - text: Porque no contiene números impares
    is_correct: false
  - text: Porque tiene 3 variables en total
    is_correct: false
  - text: Porque se puede simplificar a cero
    is_correct: false
  explanation: La alternativa correcta es 'Porque la fracción 3/5 pertenece al coeficiente
    numérico y no a las variables'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar la ubicación de cada variable en la expresión.'
- 'Paso 2: Comprobar que no existan letras en denominadores ni con exponentes negativos.'
- 'Paso 3: Confirmar la clasificación como expresión algebraica entera.'
errores_correccion: '- **Error 1: Confundir un coeficiente fraccionario con una expresión
  fraccionaria.** **Cómo corregirlo:** La expresión $\frac{1}{2}x$ es entera porque
  la variable $x$ está en el numerador.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes es una expresión algebraica entera?
  alternativas:
  - (1/4)x^2 - 7x + 2
  - 5/x^2
  - x^(1/2) + 3
  - 2x + 1/x
  respuesta: (1/4)x^2 - 7x + 2
  solucion_pasos:
  - 1. En (1/4)x^2 - 7x + 2 las variables no están en denominadores. Es entera.
- titulo: Ejemplo 2
  enunciado: ¿Por qué 8x^2 + 3/y no es una expresión entera?
  alternativas:
  - Porque la variable y se encuentra en el denominador (exponente -1)
  - Porque el número 8 es par
  - Porque el exponente es 2
  - Porque falta la constante 0
  respuesta: Porque la variable y se encuentra en el denominador (exponente -1)
  solucion_pasos:
  - 1. 3/y ubica la variable en el denominador. Esto rompe el criterio de expresión
    entera.
- titulo: ¿Es la expresión -9x^4y^3 una expresión algebraica entera?
  respuesta: Sí
  solucion_pasos:
  - Sí, sus variables están en numerador con exponentes enteros positivos.
- titulo: ¿Es 4x^3 - 2/x una expresión entera?
  respuesta: 'No'
  solucion_pasos:
  - No, el término -2/x contiene la variable x en el denominador.
errores_frecuentes:
- Declarar que las expresiones con coeficientes fraccionarios (como 1/2 x) no son
  expresiones enteras.
- Clasificar expresiones con letras en el denominador como expresiones algebraicas
  enteras.
- Declarar que la presencia de términos independientes negativos anula el carácter
  entero de la expresión.
- Declarar la definición de expresión entera con la de número entero.
- Declarar que las expresiones enteras deben tener obligatoriamente una sola variable.
afirmaciones_verdaderas:
- Una expresión es entera si sus variables no se ubican en denominadores ni poseen
  exponentes negativos.
- Los coeficientes numéricos de una expresión entera pueden ser números reales cualesquiera.
al_terminar_debes_poder: Al terminar serás capaz de identificar una expresión algebraica
  entera verificando que sus variables no aparezcan en denominadores ni con exponentes
  negativos.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Clasificación de Expresiones.
estado: publicado
