semantic_id: MAT.ALG.CLASIFICACION.EXPRESION_ENTERA
resumen_inicial: 'Una expresión algebraica es entera cuando ninguna de sus variables figura en denominadores ni posee exponentes negativos o fraccionarios.'
explicacion_simple: |
  - Una expresión algebraica es **entera** cuando las letras solo tienen **exponentes enteros positivos o cero** ($0, 1, 2, 3, \dots$).
  - **Condiciones indispensables:**
    - No puede haber letras en la parte de abajo de una fracción (en el denominador).
    - No puede haber letras dentro de raíces (como $\sqrt{x}$).
    - No puede haber letras con potencias negativas (como $x^{-2}$).
  - **¡Cuidado con los números!** Los números (coeficientes) sí pueden ser fracciones o raíces, por ejemplo:
    - $\frac{1}{2}x^3 - \frac{3}{4}x + \sqrt{5}$ **es entera**, porque las letras ($x$) solo tienen exponentes enteros $3$, $1$ y $0$.

  ![Expresión Algebraica Entera](/static/img/nodos/identificacion-de-expresion-algebraica-entera-intro.svg)
explicacion_formal: |
  ### Definición formal
  Una expresión algebraica $E(x_1, \dots, x_n)$ en el cuerpo $\mathbb{K}$ es **entera** si pertenece formalmente al anillo de polinomios $\mathbb{K}[x_1, \dots, x_n]$.
  Es decir, puede escribirse como una combinación lineal finita de monomios:

  $$E(x_1, \dots, x_n) = \sum_{j=1}^m c_j x_1^{e_{j,1}} x_2^{e_{j,2}} \cdots x_n^{e_{j,n}}, \quad \text{con } c_j \in \mathbb{K} \quad \text{y} \quad e_{j,i} \in \mathbb{N}_0 = \{0, 1, 2, \dots\}$$

  ### Dominio de definición
  El dominio de cualquier expresión algebraica entera multivariable es todo el espacio cartesiano:
  $$\operatorname{Dom}(E) = \mathbb{R}^n$$
  No presenta restricciones de indeterminación por división por cero ni por raíces de índice par.
definiciones_clave: |
  - **Expresión algebraica entera**: Expresión perteneciente a $\mathbb{K}[x_1, \dots, x_n]$, equivalente a un polinomio.
  - **Exponente en $\mathbb{N}_0$**: Potencia entera no negativa que afecta a cada variable.
  - **Dominio irrestricto**: Conjunto $\mathbb{R}^n$ donde la expresión está definida sin puntos singulares.
propiedades_relaciones: |
  - **Equivalencia con polinomio**: Toda expresión algebraica entera es un polinomio (o monomio), y recíprocamente todo polinomio es una expresión algebraica entera.
  - **Cierre algebraico**: La suma, resta y multiplicación de expresiones algebraicas enteras produce siempre otra expresión algebraica entera.
ejemplo_guiado:
  enunciado: 'Determina si la expresión $E(x, y) = \frac{3}{5}x^4y^2 - \frac{\sqrt{7}}{2}xy^3 + 8$ es una expresión algebraica entera justificando tu respuesta.'
  imagen: '/static/img/nodos/identificacion-de-expresion-algebraica-entera-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos los exponentes de las variables en el primer término $\frac{3}{5}x^4y^2$: $x$ tiene exponente 4 e $y$ tiene exponente 2 (ambos en $\mathbb{N}_0$).'
    - 'Paso 2: Identificamos los exponentes en el segundo término $-\frac{\sqrt{7}}{2}xy^3$: $x$ tiene exponente 1 e $y$ tiene exponente 3 (ambos en $\mathbb{N}_0$).'
    - 'Paso 3: Analizamos los coeficientes: $\frac{3}{5}$ y $-\frac{\sqrt{7}}{2}$ son números reales escalares válidos.'
    - 'Paso 4: Verificamos que ninguna variable esté en el denominador ni bajo radicales.'
    - 'Paso 5: Conclusión: $E(x, y)$ **es una expresión algebraica entera** (polinomio en $\mathbb{R}[x, y]$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la expresión $\frac{x^3 - 5x + 2}{4}$ es una expresión algebraica entera?'
    choices:
      - text: 'Porque el denominador es un número constante ($4$) y todas las potencias de la variable $x$ son enteras no negativas'
        is_correct: true
      - text: 'Porque tiene una fracción'
        is_correct: false
      - text: 'Porque tiene 3 términos'
        is_correct: false
      - text: 'Porque su grado es 3'
        is_correct: false
    explanation: 'La alternativa correcta es ''Porque el denominador es un número constante ($4$) y todas las potencias de la variable $x$ son enteras no negativas''. Dividir por una constante equivale a multiplicar por el coeficiente escalar $\frac{1}{4}$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál de las siguientes expresiones NO es una expresión algebraica entera?'
    choices:
      - text: '$3x^2 + 5x^{-1} - 7$'
        is_correct: true
      - text: '$\frac{2}{3}x^4 - x + 9$'
        is_correct: false
      - text: '$\sqrt{2}x^3 + 4x^2$'
        is_correct: false
      - text: '$5x^2y - 2xy + 1$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$3x^2 + 5x^{-1} - 7$''. El exponente negativo $-1$ indica una variable en el denominador ($5/x$), haciéndola fraccionaria.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar cada término de la expresión algebraica de forma individual.'
  - 'Paso 2: Comprobar que todas las variables tengan exponentes pertenecientes a $\mathbb{N}_0 = \{0, 1, 2, \dots\}$.'
  - 'Paso 3: Asegurarse de que ninguna variable figure en denominadores ni bajo signos de raíz.'
  - 'Paso 4: Confirmar la clasificación como expresión entera (polinomial).'
errores_correccion: |
  - **Error 1:** Confundir coeficientes fraccionarios con expresiones fraccionarias. **Cómo corregirlo:** $\frac{x}{3} = \frac{1}{3}x$ es **entera** porque el 3 es un número; si la $x$ estuviera abajo ($\frac{3}{x}$), sería fraccionaria.
  - **Error 2:** Creer que la presencia de $\sqrt{2}$ hace irracional a la expresión. **Cómo corregirlo:** La raíz solo afecta al número escalar constante; la variable tiene **potencia entera**, por lo que es entera.
ejemplos:
  - titulo: 'Expresión con coeficiente fraccionario'
    enunciado: '¿Es la expresión $P(x) = \frac{1}{4}x^3 - \frac{2}{5}x^2 + 7$ una expresión algebraica entera?'
    alternativas:
      - 'Sí, porque las variables solo tienen exponentes enteros no negativos'
      - 'No, porque tiene fracciones numéricas'
      - 'Es una expresión fraccionaria'
    respuesta: 'Sí, porque las variables solo tienen exponentes enteros no negativos'
    solucion_pasos:
      - '1. Los coeficientes son $\frac{1}{4}, -\frac{2}{5}, 7$.'
      - '2. Los exponentes de $x$ son 3, 2, 0 $\in \mathbb{N}_0$.'
      - '3. Es una expresión entera.'
  - titulo: 'Presencia de variable en denominador'
    enunciado: '¿Es la expresión $4x^2 + \frac{3}{x}$ entera?'
    alternativas:
      - 'No, porque la variable $x$ divide en el segundo término'
      - 'Sí, porque el primer término tiene grado 2'
      - 'Sí, porque los coeficientes son enteros'
    respuesta: 'No, porque la variable $x$ divide en el segundo término'
    solucion_pasos:
      - '1. $\frac{3}{x} = 3x^{-1}$.'
      - '2. El exponente $-1 \notin \mathbb{N}_0$.'
      - '3. No es entera (es fraccionaria).'
  - titulo: 'Dominio irrestricto'
    enunciado: '¿Está una expresión algebraica entera definida para todos los números reales $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. No hay denominadores con variables que puedan anularse.'
      - '2. Su dominio es $\mathbb{R}$.'
  - titulo: 'Exponente negativo en variable'
    enunciado: '¿Puede una expresión algebraica entera contener el término $2x^{-3}$?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Los exponentes de las variables deben ser $\ge 0$.'
      - '2. $-3 < 0$, lo que viola la definición de expresión entera.'
errores_frecuentes:
  - 'Clasificar una expresión como fraccionaria solo porque contiene coeficientes escalares en fracción.'
  - 'Confundir una raíz que afecta a una constante numérica (ej: $\sqrt{3}$) con una expresión irracional.'
  - 'Olvidar que los exponentes negativos en las variables convierten a la expresión en fraccionaria.'
  - 'Creer que un monomio simple no es una expresión algebraica entera.'
  - 'Suponer que una expresión entera tiene restricciones en su dominio real.'
afirmaciones_verdaderas:
  - 'Una expresión algebraica es entera si y solo si todas sus variables tienen exponentes enteros no negativos.'
  - 'El conjunto de expresiones algebraicas enteras en $n$ variables coincide con el anillo de polinomios $\mathbb{R}[x_1, \dots, x_n]$.'
al_terminar_debes_poder: |
  ![Resumen de Expresión Entera](/static/img/nodos/identificacion-de-expresion-algebraica-entera-resumen.svg)

  QUÉ: Identificar expresiones algebraicas enteras distinguiendo rigurosamente entre coeficientes numéricos fraccionarios y variables en denominadores.
  CÓMO: Comprobando que todas las potencias literales pertenezcan a $\mathbb{N}_0$ ($e_i \ge 0$) y que no existan variables en divisores ni bajo radicales.
