semantic_id: MAT.ALG.CLASIFICACION_TECNICA.EXPRESION_ENTERA
resumen_inicial: 'La identificación de expresión algebraica entera consiste en reconocer aquellas expresiones compuestas por la suma de monomios cuyas variables poseen exponentes enteros no negativos y no figuran en ningún denominador.'
explicacion_simple: |
  Una **expresión algebraica entera** (o polinomio entero) es una expresión limpia y sin denominadores literales:
  - **Condición clave**: **Ninguna letra está en el denominador** y **ninguna letra tiene exponente negativo o fraccionario**.
  - Ejemplo: $4x^3 - 7x^2 + \frac{1}{2}x - 9$.
    - ¡Ojo! Tener un coeficiente numérico fraccionario como $\frac{1}{2}$ **SÍ es permitido**; lo que está estrictamente prohibido para ser entera es tener **letras en el denominador** (como en $\frac{5}{x}$).
  - Todas las variables tienen exponentes enteros positivos o cero ($1, 2, 3...$).
explicacion_formal: |
  ### Definición formal
  Una expresión algebraica es **entera** respecto a las variables $x_1, \dots, x_k$ si y solo si es un elemento del anillo polinómico $\mathbb{R}[x_1, \dots, x_k]$ de la forma:

  $$E(x_1, \dots, x_k) = \sum_{i=1}^n c_i \cdot x_1^{\alpha_{i,1}} \cdots x_k^{\alpha_{i,k}} \quad (\text{con } \alpha_{i,j} \in \mathbb{N}_0, \quad c_i \in \mathbb{R})$$

  ### Criterio de Distinción entre Coeficiente y Variable
  - **Fracción en Coeficiente**: $\frac{3}{4} x^2 \implies$ Expresión Entera (el escalar $\frac{3}{4} \in \mathbb{R}$).
  - **Fracción en Variable**: $\frac{3}{4x^2} = \frac{3}{4} x^{-2} \implies$ Expresión Fraccionaria (no entera).

  ### Síntesis didáctica
  Las expresiones enteras son aquellas que se comportan como polinomios puros. Gozan de continuidad en todo $\mathbb{R}$ y no sufren indefiniciones por división por cero.
definiciones_clave: |
  - **Expresión algebraica entera**: Expresión formada por sumas de monomios sin variables en el denominador ni bajo radicales.
  - **Anillo de polinomios ($\mathbb{R}[x]$)**: Dominio algebraico constituido por todas las expresiones enteras de coeficientes reales.
  - **Coeficiente real arbitrario**: Cifra constante (entera, decimal o fraccionaria) que no afecta la categoría de expresión entera.
propiedades_relaciones: |
  - **Dominio completo en $\mathbb{R}$**: Toda expresión entera tiene un dominio de definición igual a todos los números reales $\mathbb{R}$.
  - **Cierre bajo operaciones enteras**: La suma, resta y multiplicación de expresiones algebraicas enteras produce siempre otra expresión algebraica entera.
ejemplo_guiado:
  enunciado: 'Clasifica las siguientes expresiones algebraicas indicando si son enteras o no: a) $5x^4 - 2x^2 + \frac{3}{8}$, b) $\frac{4x + 1}{x - 5}$, c) $-9a^3 b^2 + 11$.'
  pasos:
    - 'Paso 1: Analizamos a) $5x^4 - 2x^2 + \frac{3}{8}$: Las letras tienen exponentes enteros ($4, 2$) y no hay letras en denominadores $\implies$ **Es una expresión entera**.'
    - 'Paso 2: Analizamos b) $\frac{4x + 1}{x - 5}$: Existe la variable $x$ en el denominador ($x - 5$) $\implies$ **No es entera** (es fraccionaria).'
    - 'Paso 3: Analizamos c) $-9a^3 b^2 + 11$: Las variables $a$ y $b$ tienen exponentes $3$ y $2$ sin denominadores $\implies$ **Es una expresión entera**.'
    - 'Conclusión: Únicamente **a) y c) son expresiones algebraicas enteras**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición debe cumplirse respecto a las variables para que una expresión sea clasificada como algebraica entera?'
    choices:
      - {text: 'Ninguna variable debe figurar en un denominador ni poseer exponentes negativos o fraccionarios', is_correct: true}
      - {text: 'Todos los coeficientes numéricos deben ser números enteros positivos', is_correct: false}
      - {text: 'Debe contener un signo de división entre sus variables', is_correct: false}
      - {text: 'Debe tener exactamente una variable', is_correct: false}
    explanation: 'La alternativa correcta es ''Ninguna variable debe figurar en un denominador ni poseer exponentes negativos o fraccionarios''. Criterio de expresión entera.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'La expresión algebraica $\frac{2}{5} x^3 - 7x$, ¿se clasifica como una expresión entera?'
    choices:
      - {text: 'Sí, porque el denominador 5 es una constante numérica y la variable $x^3$ está en el numerador', is_correct: true}
      - {text: 'No, porque tiene la fracción $\frac{2}{5}$', is_correct: false}
      - {text: 'No, porque el término $-7x$ es negativo', is_correct: false}
      - {text: 'Se clasifica como expresión irracional', is_correct: false}
    explanation: 'La alternativa correcta es ''Sí, porque el denominador 5 es una constante numérica y la variable $x^3$ está en el numerador''. Las constantes fraccionarias no impiden ser entera.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Examinar los denominadores de todas las fracciones que aparezcan en la expresión.'
  - 'Paso 2: Comprobar que en ningún denominador figure una letra o variable.'
  - 'Paso 3: Verificar que los exponentes de todas las variables literales sean números enteros no negativos ($0, 1, 2, 3...$).'
  - 'Paso 4: Confirmar la ausencia de variables bajo signos radicales para clasificar como expresión entera.'
errores_correccion: |
  - **Error 1:** Descartar como entera a una expresión por tener un coeficiente fraccionario como $\frac{1}{3}x^2$. **Cómo corregirlo:** La condición de entera se refiere **a las VARIABLES**, las constantes sí pueden ser fraccionarias.
  - **Error 2:** Considerar que $\frac{5}{x}$ es una expresión entera por tener el número $5$ arriba. **Cómo corregirlo:** Si la variable $x$ está en el denominador, **la expresión NO es entera** (es fraccionaria).
ejemplos:
  - titulo: 'Expresión entera con fracciones escalares'
    enunciado: '¿Es $\frac{3}{7}a^2 b - 4b + 1$ una expresión algebraica entera?'
    alternativas:
      - 'Sí, las variables $a$ y $b$ no están en denominadores'
      - 'No, por el coeficiente $\frac{3}{7}$'
      - 'No, es fraccionaria'
    respuesta: 'Sí, las variables $a$ y $b$ no están en denominadores'
    solucion_pasos:
      - '1. Denominador $7$ es constante numérica.'
      - '2. Variables en numerador con exponentes enteros.'
      - '3. Es una expresión entera.'
  - titulo: 'Descarte de expresión no entera'
    enunciado: '¿Es $x^2 + \frac{4}{x}$ una expresión algebraica entera?'
    alternativas:
      - 'No, la variable $x$ está en el denominador'
      - 'Sí, porque $x^2$ es entero'
      - 'Sí, es un trinomio'
    respuesta: 'No, la variable $x$ está en el denominador'
    solucion_pasos:
      - '1. Contiene $\frac{4}{x} = 4x^{-1}$.'
      - '2. La variable en el denominador impide ser entera.'
  - titulo: 'Monomio entero'
    enunciado: '¿Es el monomio $-18m^5 n^2$ una expresión algebraica entera?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es un monomio con exponentes enteros en el numerador.'
  - titulo: 'Dominio de definición'
    enunciado: '¿Tiene la expresión entera $x^3 - 6x + 2$ un dominio de definición válido para todo $\mathbb{R}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, las expresiones enteras están definidas para cualquier valor de $\mathbb{R}$.'
errores_frecuentes:
  - 'Una expresión algebraica con coeficientes numéricos fraccionarios deja de ser clasificada como expresión entera.'
  - 'Las expresiones con variables en el denominador son expresiones enteras si su numerador es constante.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Las expresiones enteras tienen exponentes negativos en sus variables principales.'
  - 'Una expresión entera tiene restricciones de dominio por división por cero.'
afirmaciones_verdaderas:
  - 'Una expresión algebraica es entera si sus variables no figuran en denominadores ni poseen exponentes negativos o fraccionarios.'
  - 'La presencia de coeficientes constantes fraccionarios no altera la condición de expresión entera.'
al_terminar_debes_poder: 'Identificar expresiones algebraicas enteras verificando la ausencia de variables en denominadores o exponentes negativos.'
