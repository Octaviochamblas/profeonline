semantic_id: MAT.GEO.ESPACIO_FUNDAMENTOS.RECTA_ESPACIO
resumen_inicial: 'Concepto de recta en el espacio: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: Así como en el plano, en el espacio una recta sigue siendo un
  conjunto infinito de puntos alineados, pero ahora puede orientarse en cualquier
  dirección de las tres dimensiones.
explicacion_formal: '![Recta en el espacio](/static/img/geometria/espacio-cuerpos/espacio-recta.svg)


  ### Definición formal


  Una recta $L$ en el espacio es un conjunto infinito de puntos alineados que se extiende
  sin límite en ambos sentidos. A diferencia del plano, en el espacio una recta puede
  tener cualquier orientación tridimensional, no solo estar contenida en una hoja
  plana.


  ### Desarrollo didáctico


  En la figura, la recta $L$ pasa por los puntos $A$ y $B$ (dos vértices de un cuerpo
  geométrico) y se extiende más allá de ambos, representando su naturaleza infinita.
  Dos puntos distintos determinan siempre una única recta que pasa por ambos.'
definiciones_clave: '- **Concepto de recta en el espacio**: Elemento o propiedad fundamental
