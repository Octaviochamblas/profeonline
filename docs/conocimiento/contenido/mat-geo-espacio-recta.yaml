procedimiento:
- 'Paso 1: Identifica dos puntos distintos por los que debe pasar la recta.'
- 'Paso 2: Reconoce que la recta se extiende infinitamente en ambos sentidos más allá
  de esos dos puntos.'
- 'Paso 3: Denota la recta con una letra minúscula o mediante los dos puntos que la
  determinan (por ejemplo, recta AB).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
