semantic_id: MAT.GEO.HOMOTECIA.AMPLIACION
resumen_inicial: 'Homotecia y transformaciones de escala: Efecto de Ampliación (|k| > 1).'
explicacion_simple: |
  ![Efecto de Ampliación (|k| > 1)](/static/img/nodos/efecto-de-ampliacion-en-una-homotecia-con-valor-absoluto-de-la-razon-mayor-que-1-intro.svg)

  El efecto de ampliación ocurre cuando el valor absoluto de la razón es estrictamente mayor que 1 ($|k| > 1$), produciendo una figura homotética cuyas longitudes son mayores que las de la figura original.
explicacion_formal: |
  ### Teorema de dilatación métrica
  Sea $H_{(O, k)}$ con $|k| > 1$. Para todo par de puntos $A, B \in \mathbb{R}^2$:

  $$d(A', B') = |k| \cdot d(A, B) > d(A, B)$$

  ### Consecuencias topológicas y métricas
  1. Factor de escala lineal: $\lambda = |k| > 1$.
  2. Factor de escala superficial: $\lambda_{\text{área}} = k^2 > 1$.
  3. Distancia al centro: $d(O, P') > d(O, P)$ para todo $P \neq O$.

  ### Síntesis didáctica
  Toda homotecia con $|k| > 1$ dilata las figuras alejándolas proporcionalmente del centro.
definiciones_clave: |
  - **Homotecia $H(O, k)$**: Transformación afín que dilata o contrae figuras desde un centro fijo $O$ mediante un factor de escala $k$.
  - **Centro de homotecia (O)**: Punto fijo invariante donde concurren todas las rectas que unen puntos homólogos.
  - **Razón de homotecia (k)**: Escalar real no nulo que determina el factor de escala lineal y la orientación relativa.
  - **Efectos dimensionales**: Escalamiento métrico: magnitudes lineales escalan con $|k|$, áreas con $k^2$.
propiedades_relaciones: |
  - **Ecuación vectorial**: $\vec{OP^\prime} = k \cdot \vec{OP}$.
  - **Paralelismo homólogo**: $\overline{AB} \parallel \overline{A^\prime B^\prime} \quad \forall A \neq B$.
  - **Razón de áreas**: $\frac{\text{Área}^\prime}{\text{Área}} = k^2$.
  - **Simetría central**: $H(O, -1) \equiv S_O \equiv R(O, 180^\circ)$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Efecto de Ampliación (|k| > 1)](/static/img/nodos/efecto-de-ampliacion-en-una-homotecia-con-valor-absoluto-de-la-razon-mayor-que-1-ejemplos.svg)

    Aplica las propiedades y definiciones de homotecia para determinar las coordenadas, longitudes y justificaciones geométricas requeridas.
  pasos:
  - 'Paso 1: Identificar el centro $O$ y la razón $k$ de la homotecia.'
  - 'Paso 2: Determinar si la transformación es directa ($k > 0$) o inversa ($k < 0$).'
  - 'Paso 3: Aplicar la fórmula correspondiente: vectorial, por coordenadas o de escalamiento métrico.'
  - 'Paso 4: Calcular la magnitud lineal multiplicando por $|k|$ o el área multiplicando por $k^2$.'
  - 'Paso 5: Verificar el paralelismo y la coherencia espacial de la figura homotética resultante.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Qué ocurre con el tamaño de una figura si se le aplica una homotecia con $k = -3$?'
  choices:
  - text: 'Se amplía al triple de su tamaño y queda invertida'
    is_correct: true
  - text: Opción distractora de prueba A
    is_correct: false
  - text: Opción distractora de prueba B
    is_correct: false
  - text: Opción distractora de prueba C
    is_correct: false
  explanation: 'Se amplía al triple de su tamaño y queda invertida, dado que $|-3| = 3 > 1$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'Si el perímetro de un polígono es $14\text{ cm}$ y se aplica $k = 2{,}5$, ¿cuál es el nuevo perímetro?'
  choices:
  - text: '$35\text{ cm}$'
    is_correct: true
  - text: Opción distractora secundaria 1
    is_correct: false
  - text: Opción distractora secundaria 2
    is_correct: false
  - text: Opción distractora secundaria 3
    is_correct: false
  explanation: 'El nuevo perímetro es $35\text{ cm}$, pues $P'' = 2{,}5 \cdot 14 = 35\text{ cm}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el centro de homotecia $O$ y el valor numérico de la razón $k$.'
- 'Paso 2: Trazar los rayos desde $O$ a través de cada vértice de la figura original.'
- 'Paso 3: Multiplicar las distancias desde $O$ por $|k|$ (en el mismo sentido si $k > 0$, en sentido opuesto si $k < 0$).'
- 'Paso 4: Unir los vértices homotéticos resultantes verificando el paralelismo con los lados originales.'
- 'Paso 5: Calcular perímetros ($|k| \cdot P$) o áreas ($k^2 \cdot A$) según lo solicitado.'
errores_correccion: 'Recuerda que si $k < 0$, las longitudes y perímetros son siempre positivos y se multiplican por $|k|$, mientras que la figura queda invertida 180° al otro lado del centro $O$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor o resultado geométrico obtenido al aplicar la homotecia?
  alternativas:
  - '$35\text{ cm}$'
  - 'Valor alternativo no equivalente 1'
  - 'Valor alternativo no equivalente 2'
  respuesta: '$35\text{ cm}$'
  solucion_pasos:
  - 'El nuevo perímetro es $35\text{ cm}$, pues $P'' = 2{,}5 \cdot 14 = 35\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: Si una figura se transforma mediante una homotecia con razón k = -2, ¿por cuánto se multiplica su área?
  alternativas:
  - Se multiplica por 4 ($(-2)^2 = 4$)
  - Se multiplica por -2
  - Se multiplica por 2
  respuesta: Se multiplica por 4 ($(-2)^2 = 4$)
  solucion_pasos:
  - 'El área es una magnitud bidimensional que escala con el cuadrado de la razón de homotecia: $k^2 = (-2)^2 = 4$. El área siempre es positiva.'
- titulo: ¿Una homotecia con k = -1 cambia el tamaño de una figura?
  respuesta: 'No'
  solucion_pasos:
  - 'No, porque $|-1| = 1$, por lo que conserva exactamente todas las distancias y áreas originales, siendo equivalente a una simetría central o giro en 180°.'
- titulo: ¿Los lados homólogos de dos figuras homotéticas son siempre paralelos?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, por propiedad fundamental de las homotecias, todo segmento de la figura original es estrictamente paralelo a su segmento homólogo en la figura transformada ($\overline{AB} \parallel \overline{A^\prime B^\prime}$).'
errores_frecuentes:
- error: 'Olvidar que las longitudes y perímetros deben multiplicarse por el valor absoluto |k|, asignando valores negativos a las distancias.'
  correccion: 'Toda longitud y perímetro es una magnitud estrictamente positiva: $L^\prime = |k| \cdot L$. El signo negativo de $k$ solo indica inversión espacial.'
- error: 'Multiplicar el área por k en lugar de k².'
  correccion: 'El área es una magnitud superficial bidimensional y siempre escala con el cuadrado de la razón: $\text{Área}^\prime = k^2 \cdot \text{Área}$.'
- error: 'Olvidar restar el centro de homotecia antes de multiplicar por k cuando el centro no es el origen.'
  correccion: 'Usa siempre la fórmula afín correcta: $P^\prime = C + k(P - C)$, es decir, $x^\prime = x_0 + k(x - x_0)$ e $y^\prime = y_0 + k(y - y_0)$.'
