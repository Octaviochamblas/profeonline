semantic_id: MAT.GEO.TRIANGULOS_CLASIFICACION.EQUILATERO_ANGULOS_60
resumen_inicial: En todo triángulo equilátero euclidiano, la igualdad de sus tres
  lados implica necesariamente que sus tres ángulos interiores sean congruentes e
  iguales a exactamente 60°.
explicacion_simple: '![Ángulos de 60° en Triángulo Equilátero](/static/img/nodos/propiedad-de-los-tres-angulos-interiores-de-60-en-un-triangulo-equilatero-intro.svg)


  Como un triángulo equilátero tiene sus tres lados perfectamente iguales, sus tres
  esquinas se abren exactamente en la misma cantidad. Para que los tres ángulos iguales
  sumen $180^\circ$, la única posibilidad matemática es que **cada ángulo mida exactamente
  $60^\circ$** ($180^\circ / 3 = 60^\circ$).'
explicacion_formal: '### Teorema formal

  En todo triángulo equilátero, los tres ángulos interiores son estrictamente **congruentes
  y equiangulares**, midiendo cada uno exactamente $60^\circ$ (o $\frac{\pi}{3} \text{
  rad}$):


  $$a = b = c \implies \alpha = \beta = \gamma = \frac{180^\circ}{3} = 60^\circ =
  \frac{\pi}{3} \text{ rad}$$


  ### Desglose simbólico y geométrico

  - Demostración por simetría: $a = b \implies \alpha = \beta$ y $b = c \implies \beta
  = \gamma$, luego $\alpha = \beta = \gamma$.

  - Sustitución: $3\alpha = 180^\circ \implies \alpha = 60^\circ$.

  - Ángulos exteriores congruentes: Cada ángulo exterior mide $\alpha'' = 180^\circ
  - 60^\circ = 120^\circ$.


  ### Síntesis didáctica

  Todo triángulo equilátero es necesariamente equiángulo, fijando sus ángulos interiores
  a $60^\circ$ de forma universal independientemente del tamaño de sus lados.'
definiciones_clave: '- **Teorema de equiangularidad**: Todo triángulo equilátero es
  equiangular con $\alpha = 60^\circ$.

  - **Constante angular**: La medida de $60^\circ$ no depende del tamaño ni de la
  longitud de los lados.

  - **Ángulo exterior constante**: Cada ángulo exterior mide exactamente $180^\circ
  - 60^\circ = 120^\circ$. '
propiedades_relaciones: '- **Carácter acutángulo**: Al ser $60^\circ < 90^\circ$,
  todo triángulo equilátero es un triángulo acutángulo regular.

  - **Teselación del plano**: Como $60^\circ$ divide a $360^\circ$ ($360 / 60 = 6$),
  se pueden juntar 6 triángulos equiláteros en un vértice para teselar el plano (formando
  un hexágono regular). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Ángulos de 60°](/static/img/nodos/propiedad-de-los-tres-angulos-interiores-de-60-en-un-triangulo-equilatero-ejemplos.svg)


    En un triángulo equilátero, uno de los ángulos exteriores está representado por
    la expresión algebraíca $2x + 20^\circ$. Determina el valor de $x$ y comprueba
    la medida del ángulo interior correspondiente.'
  pasos:
  - 'Paso 1: Recordar que en todo triángulo equilátero cada ángulo interior mide $60^\circ$.'
  - 'Paso 2: Calcular el valor del ángulo exterior: $\text{Ext} = 180^\circ - 60^\circ
    = 120^\circ$.'
  - 'Paso 3: Plantear la ecuación lineal: $2x + 20^\circ = 120^\circ$.'
  - 'Paso 4: Despejar $x$: $2x = 120^\circ - 20^\circ = 100^\circ \implies x = 50^\circ$.'
  - 'Paso 5: Comprobar: $2(50^\circ) + 20^\circ = 120^\circ$, y su interior suplementario
    es $180^\circ - 120^\circ = 60^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué en un triángulo equilátero cada ángulo interior mide exactamente
    60°?
  choices:
  - text: Porque al ser los 3 ángulos iguales deben repartir equitativamente los 180°
      (180° / 3 = 60°)
    is_correct: true
  - text: Porque todos los triángulos tienen ángulos de 60°
    is_correct: false
  - text: Porque depende de la longitud de los lados
    is_correct: false
  - text: Porque 60° es el ángulo recto euclidiano
    is_correct: false
  explanation: Porque al ser los 3 ángulos iguales deben repartir equitativamente
    los 180° (180° / 3 = 60°).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuánto mide cada uno de los tres ángulos exteriores de un triángulo equilátero?
  choices:
  - text: Exactamente 120° (porque 180° - 60° = 120°)
    is_correct: true
  - text: 60° cada uno
    is_correct: false
  - text: 90° cada uno
    is_correct: false
  - text: 360° cada uno
    is_correct: false
  explanation: Por suplemento directo, cada exterior mide exactamente 120° (porque
    180° - 60° = 120°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer la condición de triángulo equilátero.'
- 'Paso 2: Asignar directamente $60^\circ$ a cada uno de sus tres ángulos interiores.'
- 'Paso 3: Para ángulos exteriores, asignar directamente $120^\circ$.'
errores_correccion: 'No intentes calcular ángulos distintos: en un equilátero los
  3 ángulos interiores son obligatoriamente 60°.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un triángulo tiene sus tres lados iguales a $15\text{ cm}$, ¿cuánto
    mide su ángulo interior en el vértice $B$?
  alternativas:
  - $60^\circ$
  - $45^\circ$
  - $90^\circ$
  respuesta: $60^\circ$
  solucion_pasos:
  - Por ser equilátero, cada ángulo interior mide invariablemente $60^\circ$.
- titulo: Ejemplo 2
  enunciado: Si los tres ángulos interiores de un triángulo miden $x$, $x$ y $x$,
    ¿cuál es el valor de $x$?
  alternativas:
  - $60^\circ$
  - $180^\circ$
  - $90^\circ$
  respuesta: $60^\circ$
  solucion_pasos:
  - $x + x + x = 180^\circ \implies 3x = 180^\circ \implies x = 60^\circ$.
- titulo: ¿Los tres ángulos interiores de un triángulo equilátero son siempre iguales
    a 60°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una propiedad invariante de la geometría euclidiana plana.
- titulo: ¿Un triángulo equilátero puede tener un ángulo interior de 70°?
  respuesta: 'No'
  solucion_pasos:
  - No, violaría la igualdad de lados y la suma de $180^\circ$.
errores_frecuentes:
- Creer que al duplicar el tamaño del triángulo los ángulos de 60° se duplican a 120°.
- Confundir ángulo interior (60°) con exterior (120°).
- Pensar que existe algún triángulo equilátero que no sea acutángulo.
- Olvidar que $60^\circ + 60^\circ + 60^\circ = 180^\circ$.
- Resolver ecuaciones asumiendo ángulos distintos a 60° en figuras equiláteras.
afirmaciones_verdaderas:
- Todo triángulo equilátero es equiangular con ángulos interiores de $60^\circ$.
- Los tres ángulos exteriores de un triángulo equilátero miden $120^\circ$ cada uno.
al_terminar_debes_poder: '**QUÉ:** Aplicar la propiedad de equiangularidad ($60^\circ$)
  en triángulos equiláteros.


  **CÓMO:** Utilizando el valor constante de $60^\circ$ para sus ángulos interiores
  y $120^\circ$ para sus ángulos exteriores en cálculos geométricos.


  ![Resumen de Ángulos de 60°](/static/img/nodos/propiedad-de-los-tres-angulos-interiores-de-60-en-un-triangulo-equilatero-resumen.svg)'
