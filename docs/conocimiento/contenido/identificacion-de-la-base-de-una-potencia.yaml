semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.BASE_IDENTIFICACION
resumen_inicial: La base de una potencia es el término o expresión que se multiplica
  repetidamente por sí mismo según indique el exponente.
explicacion_simple: 'Para identificar la base de una potencia, debes buscar el número
  o expresión sobre la cual recae el exponente:

  - En $5^3$, la base es $5$.

  - En $(-3)^4$, los paréntesis indican que la base es todo el entero $-3$.

  - En $-3^4$, el exponente $4$ solo afecta al $3$, por lo que la base es $3$ y el
  signo negativo se mantiene afuera (-81).'
explicacion_formal: En una expresión de la forma $a^n$ o $(expr)^n$, la base es el
  elemento $a \in \mathbb{R}$ o el bloque entre paréntesis $(expr)$ al que se aplica
  el operador exponente $n$. Sin paréntesis, el operador potencia tiene mayor prioridad
  jerárquica que la negación $(-)$, de modo que $-x^n = -(x^n)$ con base $x$.
definiciones_clave: '- **Base numérica**: Número real individual afectado directamente
  por el exponente.

  - **Base agrupada entre paréntesis**: Expresión completa (incluyendo su signo) encerrada
  entre paréntesis sobre la que actúa el exponente.

  - **Precedencia de operadores**: La potenciación se efectúa antes que la multiplicación
  por $-1$ (signo menos no agrupado).'
propiedades_relaciones: '- **Impacto de paréntesis**: $(-a)^n \neq -a^n$ en general
  para $n$ par.

  - **Base algebraica**: En $(ab)^n$, la base compuesta es el producto $ab$.'
ejemplo_guiado:
  enunciado: 'Distingue la base en las siguientes expresiones: A) $(-4)^2$ y B) $-4^2$.'
  pasos:
  - 'Analizar la expresión A: $(-4)^2$. Los paréntesis encierran a $-4$, luego la
    base es $-4$. Su valor es $(-4)(-4) = 16$.'
  - 'Analizar la expresión B: $-4^2$. No hay paréntesis alrededor del signo, luego
    la base es únicamente $4$. Su valor es $-(4 \cdot 4) = -16$.'
  - Concluir la diferencia de bases y de resultados finales.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la base de la potencia en la expresión $-7^2$?
  choices:
  - text: '7'
    is_correct: true
  - text: '-7'
    is_correct: false
  - text: '2'
    is_correct: false
  - text: '-49'
    is_correct: false
  explanation: 'La correcta es: 7. Al no haber paréntesis, el signo negativo no forma
    parte de la base.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la base en la expresión $(-5)^3$?
  choices:
  - text: '-5'
    is_correct: true
  - text: '5'
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '-125'
    is_correct: false
  explanation: 'La correcta es: -5. Los paréntesis indican que el signo menos está
    incluido dentro de la base.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar si existen paréntesis agrupando a la expresión.'
- 'Paso 2: Si hay paréntesis inmediatamente antes del exponente, todo el contenido
  de los paréntesis es la base.'
- 'Paso 3: Si no hay paréntesis y hay un signo negativo adelante, la base es solo
  el número o variable positivo contiguo al exponente.'
errores_correccion: 'El error más habitual es asumir que $-3^2$ es igual a $9$. Al
  no llevar paréntesis, **el signo negativo NO es parte de la base**: $-3^2 = -(3
  \cdot 3) = -9$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la base en la potencia $(-2)^4$?
  alternativas:
  - '-2'
  - '2'
  - '4'
  respuesta: '-2'
  solucion_pasos:
  - Los paréntesis encierran al $-2$. Por lo tanto, la base es $-2$.
- titulo: Ejemplo 2
  enunciado: Calcula el valor de $-5^2$.
  alternativas:
  - '-25'
  - '25'
  - '-10'
  respuesta: '-25'
  solucion_pasos:
  - 'La base es $5$. El signo se mantiene: $-(5 \cdot 5) = -25$.'
errores_frecuentes:
- Incluir el signo negativo en la base cuando no hay paréntesis.
- Confundir la base con el exponente.
afirmaciones_verdaderas:
- Los paréntesis modifican qué elementos forman parte de la base de una potencia.
- En $-x^n$, la base es $x$ y no $-x$.
al_terminar_debes_ponder: Identificar con precisión la base de cualquier potencia
  numérica o algebraica evaluando la presencia de paréntesis.
fuente: Texto escolar MINEDUC — Matemática 8° Básico.
estado: publicado
