semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.BASE_IDENTIFICACION
resumen_inicial: La base de una potencia es el elemento matemático que se repite como factor multiplicativo, cuyo alcance exacto está determinado por los paréntesis y la jerarquía de operaciones.
explicacion_simple: '![Identificación de la base de una potencia](/static/img/nodos/identificacion-de-la-base-de-una-potencia-intro.svg)


  La base es la parte principal de la potencia, es decir, el número o expresión que se multiplica por sí mismo. Para reconocerla correctamente hay una regla de oro: el exponente solo afecta a lo que está inmediatamente a su izquierda. Si hay paréntesis como $(-3)^2$, la base es $-3$; pero si no hay paréntesis como en $-3^2$, la base es solo el $3$ y el signo negativo espera afuera.'
explicacion_formal: "En la estructura de una potencia $a^n$, la **Base** es la entidad matemática (constante numérica, variable o expresión compuesta) que experimenta la multiplicación iterativa.\n\n**Criterios formales de delimitación de la base:**\n1. **Regla de contigüidad:** En ausencia de signos de agrupación, el exponente $n$ se vincula con la máxima prioridad sintáctica al símbolo alfanumérico inmediatamente adyacente a su izquierda.\n2. **Impacto de los paréntesis:**\n   - En $(-a)^n$: Los paréntesis agrupan al signo y al valor, estableciendo que la base es $(-a)$.\n   - En $-a^n$: La base es exclusivamente $a$. La expresión equivale a $-(a^n) = (-1) \\cdot a^n$.\n3. **Expresiones fraccionarias y algebraicas:**\n   - En $\\left(\\frac{a}{b}\\right)^n$, la base es $\\frac{a}{b}$. En $\\frac{a^n}{b}$, la base es solo $a$.\n   - En $(kx)^n$, la base es $kx$. En $kx^n$, la base es solo $x$."
definiciones_clave: '- **Base**: Factor sobre el cual opera directamente el exponente.

  - **Paréntesis delimitador**: Símbolo de agrupación que define los límites exactos de la base.

  - **Coeficiente externo**: Número que multiplica a la potencia pero no forma parte de su base.'
propiedades_relaciones: '- **Jerarquía de operaciones**: La potencia se evalúa antes que el producto por coeficientes o signos exteriores ($-3^2 = -(3^2) = -9$).

  - **Distinción entre $(-a)^2$ y $-a^2$**: $(-a)^2 = a^2 > 0$ mientras que $-a^2 = -a^2 < 0$ para todo $a \neq 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de identificación de la base](/static/img/nodos/identificacion-de-la-base-de-una-potencia-ejemplos.svg)


    Identifique la base y calcule el valor de las expresiones $(-5)^3$, $-7^2$ y $\left(\frac{2}{3}\right)^4$.'
  pasos:
  - 'Paso 1: Analizar $(-5)^3$: El paréntesis encierra a $-5$. La base es $-5$. Desarrollo: $(-5) \cdot (-5) \cdot (-5) = -125$.'
  - 'Paso 2: Analizar $-7^2$: No hay paréntesis. El exponente $2$ solo afecta a $7$. La base es $7$. Desarrollo: $-(7 \cdot 7) = -49$.'
  - 'Paso 3: Analizar $\left(\frac{2}{3}\right)^4$: El paréntesis abarca la fracción completa. La base es $\frac{2}{3}$. Desarrollo: $\frac{2^4}{3^4} = \frac{16}{81}$.'
  - 'Conclusión: Las bases son $-5$, $7$ y $\frac{2}{3}$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la base en la expresión $-6^2$?
  choices:
  - text: $6$ (el signo negativo no forma parte de la base)
    is_correct: true
  - text: $-6$
    is_correct: false
  - text: $-36$
    is_correct: false
  - text: $2$
    is_correct: false
  explanation: La alternativa correcta es '$6$ (el signo negativo no forma parte de la base)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué el resultado de $-7^2$ es $-49$ y no $+49$?
  choices:
  - text: Porque al no tener paréntesis, la base es $7$ y el signo negativo queda fuera de la potencia
    is_correct: true
  - text: Porque los números impares siempre dan negativo
    is_correct: false
  - text: Porque se multiplica $-7$ por $2$
    is_correct: false
  - text: Porque el exponente es par
    is_correct: false
  explanation: La alternativa correcta es 'Porque al no tener paréntesis, la base es $7$ y el signo negativo queda fuera de la potencia'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar la presencia o ausencia de paréntesis alrededor del término contiguo al exponente.'
- 'Paso 2: Si hay paréntesis, la base es todo lo contenido dentro de ellos.'
- 'Paso 3: Si no hay paréntesis, la base es exclusivamente el número o variable inmediatamente adyacente al exponente a su izquierda.'
errores_correccion: '- **Error 1: Asumir que en $-4^2$ la base es $-4$.** **Cómo corregirlo:** Sin paréntesis, el signo es un operador externo $-1 \cdot 4^2 = -16$. Para que la base sea $-4$, DEBE escribirse $(-4)^2 = +16$.

  - **Error 2: Pensar que en $3x^2$ la base es $3x$.** **Cómo corregirlo:** La base es solo $x$. Para que la base sea $3x$, debe escribirse $(3x)^2 = 9x^2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la base en la expresión $4x^3$?
  alternativas:
  - $x$
  - $4x$
  - $4$
  respuesta: $x$
  solucion_pasos:
  - El exponente $3$ solo afecta a la variable contigua $x$. La base es $x$ y $4$ es el coeficiente.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor numérico de $(-3)^4$?
  alternativas:
  - $+81$
  - $-81$
  - $-12$
  respuesta: $+81$
  solucion_pasos:
  - La base es $-3$. $(-3) \cdot (-3) \cdot (-3) \cdot (-3) = +81$.
- titulo: ¿Es -2 la base de la expresión -2⁴?
  respuesta: 'No'
  solucion_pasos:
  - No, al no tener paréntesis la base es 2 y el signo negativo es externo ($-2^4 = -16$).
  alternativas:
  - texto: No, la base es 2 y el signo negativo está afuera
    es_correcta: true
    retroalimentacion: ¡Correcto! Sin paréntesis, el exponente solo eleva al 2.
  - texto: Sí, el signo siempre pertenece a la base
    es_correcta: false
    retroalimentacion: Incorrecto, requiere paréntesis para pertenecer a la base.
  - texto: Sí, porque el número es negativo
    es_correcta: false
    retroalimentacion: Incorrecto, la sintaxis algebraica aísla el signo.
- titulo: ¿Es (5/7) la base de (5/7)³?
  respuesta: Sí
  solucion_pasos:
  - Sí, los paréntesis abarcan toda la fracción $\frac{5}{7}$.
  alternativas:
  - texto: Sí, el paréntesis abarca a toda la fracción 5/7
    es_correcta: true
    retroalimentacion: ¡Correcto! El exponente 3 eleva al numerador y al denominador.
  - texto: No, la base es solo el 5
    es_correcta: false
    retroalimentacion: Incorrecto, eso ocurriría solo si estuviera escrito $5^3 / 7$.
  - texto: No, la base es 15/7
    es_correcta: false
    retroalimentacion: Incorrecto, la base es la fracción 5/7.
errores_frecuentes:
- Creer que $-a^2$ da un resultado positivo.
- Confundir la base de una fracción con y sin paréntesis ($\frac{a^2}{b}$ vs $(\frac{a}{b})^2$).
- Elevar coeficientes que no están dentro del paréntesis en monomios algebraicos.
- Asumir que los signos menos se cancelan antes de evaluar la potencia.
- Olvidar que en una suma como $(x+y)^2$, la base es el binomio completo $(x+y)$.
afirmaciones_verdaderas:
- En $(-a)^n$ la base es $(-a)$, mientras que en $-a^n$ la base es $a$.
- El exponente afecta únicamente al elemento situado a su izquierda inmediata salvo agrupación con paréntesis.
- En monomios de la forma $ax^n$, la base de la potencia es exclusivamente $x$.
al_terminar_debes_poder: '![Síntesis de identificación de la base](/static/img/nodos/identificacion-de-la-base-de-una-potencia-resumen.svg)


  QUÉ: Identificar inequívocamente la base de cualquier potencia numérica o algebraica.


  CÓMO: Reconociendo el alcance de los paréntesis delimitadores, distinguiendo expresiones con base negativa $(-a)^n$ de opuestos de potencias $-a^n$, y separando coeficientes externos de la base efectiva.'
