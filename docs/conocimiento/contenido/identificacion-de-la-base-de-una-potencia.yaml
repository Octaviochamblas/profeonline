semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.BASE_IDENTIFICACION
resumen_inicial: La base de una potencia es la expresión o cantidad numérica sobre
  la cual actúa directamente el exponente y que se reitera como factor en la multiplicación.
explicacion_simple: La base es el número principal o expresión que se va a repetir
  en la multiplicación. Es fundamental mirar con cuidado si hay paréntesis, ya que
  el paréntesis define si un signo negativo o una fracción completa forman parte de
  la base.
explicacion_formal: 'En la expresión $a^n$ o $(expr)^n$, la **Base** se define como
  el operando estructural sobre el cual recae el operador de elevación $n$:


  $$\text{Base} = \begin{cases} a & \text{en } a^n \\ (b + c) & \text{en } (b + c)^n
  \\ -x & \text{en } (-x)^n \\ x & \text{en } -x^n \end{cases}$$


  **Desglose de la notación:**

  - Alcance de los paréntesis: En $(-3)^2$, la base es $(-3)$. En $-3^2$, la base
  es únicamente $3$ y el signo negativo antecede a la potencia.


  > **Complemento didáctico:** La correcta identificación de la base es el paso crítico
  para aplicar las leyes de los signos y las propiedades de las potencias.'
definiciones_clave: '- **Base de una potencia**: Factor recurrente delimitado por
  la notación previa al exponente superior.'
propiedades_relaciones: '- **Dependencia de la notación**: El uso de paréntesis delimita
  el alcance real de la base.'
ejemplo_guiado:
  enunciado: Identifique la base en las expresiones $(-5)^2$, $-5^2$ y $\left(\frac{3}{4}\right)^3$.
  pasos:
  - 'Paso 1: Analizar $(-5)^2$: al estar encerrado en paréntesis, la base es el número
    entero negativo $(-5)$.'
  - 'Paso 2: Analizar $-5^2$: al NO tener paréntesis, el exponente $2$ afecta solo
    al $5$. La base es $5$ y el signo negativo antepone a la potencia.'
  - 'Paso 3: Analizar $\left(\frac{3}{4}\right)^3$: el paréntesis abarca toda la fracción,
    por lo que la base es $\frac{3}{4}$.'
  - 'Conclusión: Las bases son $(-5)$, $5$ y $\frac{3}{4}$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la base en la expresión -4^2 sin paréntesis?
  choices:
  - text: Es el número 4 (el signo negativo no forma parte de la base)
    is_correct: true
  - text: Es el número -4 completo
    is_correct: false
  - text: Es el número 2
    is_correct: false
  - text: Es el número 16
    is_correct: false
  explanation: La alternativa correcta es 'Es el número 4 (el signo negativo no forma
    parte de la base)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (-5)^2 con paréntesis, ¿cuál es la base?
  choices:
  - text: La base es (-5) completo
    is_correct: true
  - text: La base es solo 5
    is_correct: false
  - text: La base es 2
    is_correct: false
  - text: La base es 25
    is_correct: false
  explanation: La alternativa correcta es 'La base es (-5) completo'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el exponente de la expresión.'
- 'Paso 2: Observar si la expresión inmediatamente a su izquierda está encerrada en
  paréntesis.'
- 'Paso 3: Determinar como base únicamente lo que se encuentra bajo el dominio directo
  del exponente.'
errores_correccion: '- **Error 1: Incluir el signo menos como parte de la base cuando
  no hay paréntesis ($-5^2$).** **Cómo corregirlo:** Sin paréntesis, la base es $5$
  y el resultado es $-(5 \cdot 5) = -25$.


  - **Error 2: Considerar que la base de $\frac{a^n}{b}$ es la fracción completa.**
  **Cómo corregirlo:** Sin paréntesis en la fracción, la base del exponente $n$ es
  solo el numerador $a$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la base en $(-7)^3$?
  alternativas:
  - '-7'
  - '7'
  - '3'
  respuesta: '-7'
  solucion_pasos:
  - Por los paréntesis, la base es $-7$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la base en $-7^3$?
  alternativas:
  - '7'
  - '-7'
  - '3'
  respuesta: '7'
  solucion_pasos:
  - Sin paréntesis, la base es solo $7$ y la expresión es $-(7^3)$.
- titulo: ¿Es la base en (a+b)^2 la expresión completa (a+b)?
  respuesta: Sí
  solucion_pasos:
  - Sí, los paréntesis agrupan la suma como una única base.
- titulo: ¿Son idénticas las bases de (-2)^4 y -2^4?
  respuesta: 'No'
  solucion_pasos:
  - No, la primera tiene base $-2$ y la segunda tiene base $2$.
errores_frecuentes:
- En la expresión $-6^2$ la base de la potencia se define como el número entero negativo
  $-6$.
- La presencia de paréntesis alrededor de una potencia no modifica la identificación
  de su base.
- En la fracción $\frac{4^3}{5}$ la base de la potencia es la fracción completa $\frac{4}{5}$.
- La base de la potencia $x^y$ es la letra pequeña superíndice $y$.
- Los signos negativos se incluyen siempre en la base de la potencia sin importar
  la notación.
afirmaciones_verdaderas:
- La base es el número o cantidad delimitada sobre la cual recae el exponente.
- En la expresión $-a^n$, la base es solo $a$, mientras que en $(-a)^n$ la base es
  $(-a)$.
al_terminar_debes_poder: Al terminar serás capaz de identificar correctamente la base
  de cualquier potencia, analizando la presencia de paréntesis y signos de agrupación.
