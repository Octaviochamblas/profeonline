semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_COMO_INVERSA_POTENCIA
resumen_inicial: 'La radicación es la operación inversa de la potenciación: si la
  potencia eleva una base a un exponente $b^n = a$, la raíz deshace la operación obteniendo
  la base original $\sqrt[n]{a} = b$.'
explicacion_simple: La potencia y la raíz son dos caras de la misma moneda. Si elevar
  un número al cubo lo hace crecer ($2^3 = 8$), sacarle la raíz cúbica desace el proceso
  y nos devuelve al número 2 original.
explicacion_formal: 'Para todo $a \ge 0$ y $n \in \mathbb{N}_{\ge 2}$, las funciones
  $f(x) = x^n$ y $g(x) = \sqrt[n]{x}$ son **Inversas Algebraicas Mutuas** sobre $\mathbb{R}^+$:


  $$(g \circ f)(x) = \sqrt[n]{x^n} = x \quad (x \ge 0) \quad \text{y} \quad (f \circ
  g)(x) = \left(\sqrt[n]{x}\right)^n = x$$


  **Desglose de la cancelación:**

  - Operador inverso: $\sqrt[n]{\cdot}$ cancela la elevación al exponente $n$.

  - Atención al valor absoluto: Si $n$ es par y $x \in \mathbb{R}$, $\sqrt[n]{x^n}
  = |x|$.'
definiciones_clave: '- **Operación inversa**: Relación estructural donde la raíz $n$-ésima
  cancela el exponente $n$ de una potencia.'
propiedades_relaciones: '- **Cancelación funcional**: $(\sqrt[n]{a})^n = a$ y $\sqrt[n]{a^n}
  = a$ para $a \ge 0$.'
ejemplo_guiado:
  enunciado: Verifique la cancelación reciproca en $(\sqrt[3]{8})^3$ y $\sqrt[3]{2^3}$.
  pasos:
  - 'Paso 1: Para $(\sqrt[3]{8})^3$: calcular la raíz interna $\sqrt[3]{8} = 2$. Elevar
    al cubo $2^3 = 8$.'
  - 'Paso 2: Para $\sqrt[3]{2^3}$: calcular la potencia interna $2^3 = 8$. Extraer
    la raíz $\sqrt[3]{8} = 2$.'
  - 'Conclusión: La radicación y la potenciación cancelan mutuamente sus efectos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre al elevar la raíz enésima (sqrt[n]{a})^n a la potencia n para
    a >= 0?
  choices:
  - text: La potencia cancela la raíz devolviendo el radicando a
    is_correct: true
  - text: Se multiplica a por n
    is_correct: false
  - text: Da cero siempre
    is_correct: false
  - text: Se convierte en una fracción
    is_correct: false
  explanation: La alternativa correcta es 'La potencia cancela la raíz devolviendo
    el radicando a'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (sqrt[3]{8})^3, ¿cuál fue el resultado de la
    cancelación?
  choices:
  - text: '8'
    is_correct: true
  - text: '2'
    is_correct: false
  - text: '24'
    is_correct: false
  - text: '64'
    is_correct: false
  explanation: La alternativa correcta es '8'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la potencia de igual exponente que el índice de la raíz.'
- 'Paso 2: Cancelar el operador raíz con el exponente correspondiente.'
- 'Paso 3: Obtener el valor de la base libre del radical.'
errores_correccion: '- **Error 1: Decir que $\sqrt{x^2} = x$ para todo $x \in \mathbb{R}$.**
  **Cómo corregirlo:** Si $x$ puede ser negativo, $\sqrt{x^2} = |x|$ (ej: $\sqrt{(-3)^2}
  = \sqrt{9} = +3$).


  - **Error 2: Intentar cancelar una raíz con un exponente distinto de su índice.**
  **Cómo corregirlo:** La cancelación exige que el exponente sea IGUAL al índice de
  la raíz.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(\sqrt{5})^2$.
  alternativas:
  - '5'
  - '25'
  - sqrt(10)
  respuesta: '5'
  solucion_pasos:
  - $(\sqrt{5})^2 = 5$ por cancelación.
- titulo: Ejemplo 2
  enunciado: Calcule $\sqrt[4]{3^4}$.
  alternativas:
  - '3'
  - '12'
  - '81'
  respuesta: '3'
  solucion_pasos:
  - $\sqrt[4]{81} = 3$.
- titulo: ¿Es la radicación la operación inversa de la potenciación?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt[n]{b^n} = b$ para $b \ge 0$.
- titulo: ¿Es (sqrt[3]{x})^3 igual a x para cualquier real x?
  respuesta: Sí
  solucion_pasos:
  - Sí, las raíces de índice impar conservan el valor exacto de $x$.
errores_frecuentes:
- La radicación es una operación independiente que no guarda relación con la potenciación.
- La expresión $\sqrt{(-4)^2}$ resulta en el número negativo $-4$ por cancelación
  directa sin valor absoluto.
- Elevar una raíz cuadrada al cuadrado multiplica por dos el valor del radicando.
- Las funciones de raíz $n$-ésima y potencia $n$-ésima se suman para dar cero.
- La potencia cancella la raíz únicamente si la base es un entero impar.
afirmaciones_verdaderas:
- La radicación actúa como la operación inversa de la potenciación sobre sus dominios
  de existencia.
- 'Para todo $a \ge 0$, la elevación a la potencia $n$ y la extracción de raíz $n$-ésima
  se anulan mutuamente: $(\sqrt[n]{a})^n = a$.'
al_terminar_debes_poder: Al terminar serás capaz de aplicar la inversión entre radicación
  y potenciación $(\sqrt[n]{a})^n = a$, simplificando expresiones radicales.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
