semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_COMO_INVERSA_POTENCIA
resumen_inicial: 'La radicación es la operación inversa de la potenciación: si la
  potencia calcula el resultado $b^n = a$, la raíz determina la base $b = \sqrt[n]{a}$.'
explicacion_simple: 'Las operaciones matemáticas vienen en parejas inversas (suma/resta,
  multiplicación/división). En las potencias:

  - Si te dan la base y el exponente ($2^4$), calculas el resultado ($16$).

  - Si te dan el resultado y el exponente ($\sqrt[4]{16}$), la raíz te devuelve la
  base original ($2$).'
explicacion_formal: La función $f(x) = x^n$ restringida a $[0, \infty[$ para $n$ par
  (o todo $\mathbb{R}$ para $n$ impar) posee función inversa $f^{-1}(x) = \sqrt[n]{x}$.
  Se cumple $(\sqrt[n]{x})^n = x$ y $\sqrt[n]{x^n} = x$ (para $x \ge 0$).
definiciones_clave: '- **Operación inversa**: Proceso matemático que revierte el efecto
  de la potenciación.'
propiedades_relaciones: '- **Cancelación de operadores**: $(\sqrt[n]{a})^n = a$ para
  todo $a \ge 0$.'
ejemplo_guiado:
  enunciado: Si $7^3 = 343$, expresa dicha igualdad utilizando notación de radical.
  pasos:
  - Identificar la base $7$, el exponente $3$ y el resultado $343$.
  - 'Revertir la operación: el resultado $343$ pasa a ser el radicando, el exponente
    $3$ el índice.'
  - 'Escribir la igualdad equivalente en raíz: $\sqrt[3]{343} = 7$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si sabemos que $6^4 = 1296$, ¿cuál es el valor de $\sqrt[4]{1296}$?
  choices:
  - text: '6'
    is_correct: true
  - text: '324'
    is_correct: false
  - text: '4'
    is_correct: false
  - text: '24'
    is_correct: false
  explanation: 'La correcta es: 6. Por ser la radicación la operación inversa de la
    potencia.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué es igual la expresión $(\sqrt[5]{18})^5$?
  choices:
  - text: '18'
    is_correct: true
  - text: '90'
    is_correct: false
  - text: 18^5
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: 'La correcta es: 18. Al elevar la raíz 5-ésima a la potencia 5, ambas
    operaciones se cancelan.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la ecuación de potencia $b^n = a$.'
- 'Paso 2: Despejar la base $b$ aplicando raíz $n$-ésima: $b = \sqrt[n]{a}$.'
errores_correccion: No olvides que la raíz busca la base, no el exponente.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $x^3 = 64$, halla $x$.
  alternativas:
  - '4'
  - '8'
  - '16'
  respuesta: '4'
  solucion_pasos:
  - $x = \sqrt[3]{64} = 4$.
errores_frecuentes:
- Confundir el despiece de la raíz con una división.
afirmaciones_verdaderas:
- $\sqrt[n]{x^n} = x$ para $x \ge 0$.
al_terminar_debes_ponder: Relacionar la radicación y la potenciación como operaciones
  mutuamente inversas.
fuente: Texto escolar MINEDUC.
estado: publicado
