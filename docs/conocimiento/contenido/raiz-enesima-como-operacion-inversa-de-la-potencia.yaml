semantic_id: MAT.NUM.RAICES_CONCEPTO.RAIZ_COMO_INVERSA_POTENCIA
resumen_inicial: 'La radicación y la potenciación son operaciones inversas: $(\sqrt[n]{a})^n = a$ y $\sqrt[n]{a^n} = a$ para $n$ impar (o $|a|$ para $n$ par).'
explicacion_simple: '![Raíz enésima como operación inversa](/static/img/nodos/raiz-enesima-como-operacion-inversa-de-la-potencia-intro.svg)


  La radicación y la potenciación se ''deshacen'' mutuamente:

  - Si tomas un número positivo, le extraes la raíz y luego lo elevas a la misma potencia, obtienes el número original: $(\sqrt{7})^2 = 7$.

  - **¡Cuidado con los signos en índices pares!** Si elevas $-5$ al cuadrado obtienes $+25$, y su raíz cuadrada es $+5$. Por eso, $\sqrt{(-5)^2} = |-5| = +5$, no $-5$.'
explicacion_formal: "Sean $a \\in \\mathbb{R}$ y $n \\in \\mathbb{N}$ con $n \\ge 2$. La **Propiedad de Composición Inversa** establece:\n\n**1. Cancelación Externa:**\nPara todo $a$ tal que $\\sqrt[n]{a} \\in \\mathbb{R}$:\n$$(\\sqrt[n]{a})^n = a$$\n\n**2. Cancelación Interna (Teorema del Valor Absoluto):**\n- **Si $n$ es par ($n = 2k$):**\n  $$\\sqrt[2k]{a^{2k}} = |a| = \\begin{cases} a & \\text{si } a \\ge 0 \\\\ -a & \\text{si } a < 0 \\end{cases}$$\n- **Si $n$ es impar ($n = 2k+1$):**\n  $$\\sqrt[2k+1]{a^{2k+1}} = a \\quad (\\forall a \\in \\mathbb{R})$$"
definiciones_clave: '- **Inversa funcional**: Operador que restituye la variable independiente original.

  - **Cancelación interna**: Evaluación de la raíz de una potencia $\sqrt[n]{a^n}$.

  - **Valor absoluto en raíz par**: Garantía de que $\sqrt{x^2} = |x| \ge 0$.'
propiedades_relaciones: '- **No linealidad con negativos en par**: $\sqrt{x^2} \neq x$ si $x < 0$.

  - **Identidad en impares**: $\sqrt[3]{x^3} = x$ para todo $x \in \mathbb{R}$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de raíz como operación inversa](/static/img/nodos/raiz-enesima-como-operacion-inversa-de-la-potencia-ejemplos.svg)


    Simplifique las expresiones $(\sqrt{11})^2$, $\sqrt{(-5)^2}$ y $\sqrt[3]{(-2)^3}$ aplicando las propiedades de inversa.'
  pasos:
  - 'Paso 1: Evaluar $(\sqrt{11})^2$: Cancelación externa directa sobre radicando positivo $\implies 11$.'
  - 'Paso 2: Evaluar $\sqrt{(-5)^2}$: Cancelación interna de índice par. Se aplica valor absoluto: $\sqrt{(-5)^2} = |-5| = +5$.'
  - 'Paso 3: Evaluar $\sqrt[3]{(-2)^3}$: Cancelación interna de índice impar. Conserva signo: $\sqrt[3]{(-2)^3} = -2$.'
  - 'Conclusión: Los resultados son $11$, $+5$ y $-2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor exacto de $\sqrt{(-7)^2}$?
  choices:
  - text: $+7$ (porque $\sqrt{a^2} = |a| = |-7| = 7$)
    is_correct: true
  - text: $-7$
    is_correct: false
  - text: $\pm 7$
    is_correct: false
  - text: No existe en $\mathbb{R}$
    is_correct: false
  explanation: La alternativa correcta es '$+7$ (porque $\sqrt{a^2} = |a| = |-7| = 7$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $(\sqrt{11})^2$ da exactamente $11$?
  choices:
  - text: Porque elevar al cuadrado una raíz cuadrada restituye directamente el radicando original
    is_correct: true
  - text: Porque $11$ es primo
    is_correct: false
  - text: Porque se multiplica $11 \times 2$
    is_correct: false
  - text: Porque el exponente se cancela a cero
    is_correct: false
  explanation: La alternativa correcta es 'Porque elevar al cuadrado una raíz cuadrada restituye directamente el radicando original'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si la operación es una cancelación externa $(\sqrt[n]{a})^n$ o interna $\sqrt[n]{a^n}$.'
- 'Paso 2: Verificar la paridad del índice $n$.'
- 'Paso 3: Si es par, aplicar valor absoluto $|a|$; si es impar, conservar el valor algebraico directo $a$.'
errores_correccion: '- **Error 1: Cancelar $\sqrt{x^2} = x$ sin considerar que $x$ puede ser negativo.** **Cómo corregirlo:** La fórmula rigurosa es $\sqrt{x^2} = |x|$.

  - **Error 2: Creer que $(\sqrt{a})^2$ puede dar un número negativo.** **Cómo corregirlo:** Para que $\sqrt{a} \in \mathbb{R}$ se exige $a \ge 0$, luego $(\sqrt{a})^2 = a \ge 0$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $(\sqrt{13})^2$?
  alternativas:
  - $13$
  - $169$
  - $\sqrt{13}$
  respuesta: $13$
  solucion_pasos:
  - $(\sqrt{13})^2 = 13$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\sqrt[3]{5^3}$?
  alternativas:
  - $5$
  - $125$
  - $15$
  respuesta: $5$
  solucion_pasos:
  - $\sqrt[3]{5^3} = 5$.
- titulo: ¿Es √((-9)²) igual a 9?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(-9)^2 = 81 \implies \sqrt{81} = +9 = |-9|$.
  alternativas:
  - texto: Sí, √((-9)²) = |-9| = 9
    es_correcta: true
    retroalimentacion: ¡Correcto! La raíz cuadrada principal es siempre positiva.
  - texto: No, es igual a -9
    es_correcta: false
    retroalimentacion: Incorrecto, la raíz cuadrada de un número real no puede ser negativa.
  - texto: No, no existe en ℝ
    es_correcta: false
    retroalimentacion: Incorrecto, $(-9)^2 = +81 \ge 0$.
- titulo: ¿Es ∛((-4)³) igual a -4?
  respuesta: Sí
  solucion_pasos:
  - Sí, en índice impar $\sqrt[3]{a^3} = a \implies -4$.
  alternativas:
  - texto: Sí, ∛((-4)³) = -4
    es_correcta: true
    retroalimentacion: ¡Correcto! El índice impar preserva el signo del radicando.
  - texto: No, debe ser positivo (+4)
    es_correcta: false
    retroalimentacion: Incorrecto, solo los índices pares aplican valor absoluto.
  - texto: No, es igual a -64
    es_correcta: false
    retroalimentacion: Incorrecto, la raíz cúbica cancela la potencia.
errores_frecuentes:
- Omitir el valor absoluto en $\sqrt{x^2} = |x|$.
- Cambiar de signo el resultado en índices impares con radicando negativo.
- Confundir $(\sqrt{x})^2$ con $\sqrt{x^2}$ en dominios reales.
- Multiplicar exponente por índice en vez de cancelarlos.
- Creer que la radicación no tiene inversa en números negativos.
afirmaciones_verdaderas:
- La radicación cancela a la potenciación cuando comparten la misma base y grado.
- La identidad $\sqrt{x^2} = |x|$ es válida para todo número real $x$.
- Para índices impares, $\sqrt[n]{x^n} = x$ para todo $x \in \mathbb{R}$.
al_terminar_debes_poder: '![Síntesis de operación inversa](/static/img/nodos/raiz-enesima-como-operacion-inversa-de-la-potencia-resumen.svg)


  QUÉ: Aplicar las propiedades de cancelación e inversa entre la radicación y la potenciación.


  CÓMO: Utilizando las identidades $(\sqrt[n]{a})^n = a$, $\sqrt[2k]{a^{2k}} = |a|$ y $\sqrt[2k+1]{a^{2k+1}} = a$ según la paridad del índice $n$.'
