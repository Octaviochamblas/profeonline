semantic_id: MAT.NUM.RAICES_CONCEPTO.EXISTENCIA_INDICE_PAR
resumen_inicial: 'Una raíz de índice par $\sqrt[2k]{a}$ existe en el conjunto de los
  números reales $\mathbb{R}$ si y solo si el radicando es no negativo: $a \ge 0$.'
explicacion_simple: No se puede calcular en los números reales la raíz cuadrada o
  cualquier raíz de índice par de un número negativo (como $\sqrt{-9}$), porque ningún
  número multiplicado por sí mismo un número par de veces puede dar un resultado negativo.
explicacion_formal: 'Para todo orden par $n = 2k$ ($k \in \mathbb{N}_{\ge 1}$), la
  **Condición de Existencia Real** es:


  $$\sqrt[2k]{a} \in \mathbb{R} \iff a \ge 0$$


  **Demostración de no existencia para $a < 0$:**

  $$\forall b \in \mathbb{R}, \, b^{2k} \ge 0 \implies b^{2k} \neq a < 0 \implies
  \sqrt[2k]{a} \notin \mathbb{R} \quad (\in \mathbb{C})$$'
definiciones_clave: '- **Condición de existencia índice par**: Restricción $a \ge
  0$ indispensable para que $\sqrt[2k]{a}$ sea un número real.'
propiedades_relaciones: '- **Restricción de dominio real**: $\sqrt[2k]{a} \in \mathbb{R}
  \iff a \ge 0$.'
ejemplo_guiado:
  enunciado: Determine si las expresiones $\sqrt{-16}$ y $\sqrt[4]{81}$ pertenecen
    al conjunto de los números reales.
  pasos:
  - 'Paso 1: Analizar $\sqrt{-16}$: el índice es par ($2$) y el radicando es negativo
    ($-16 < 0$). No existe en $\mathbb{R}$.'
  - 'Paso 2: Analizar $\sqrt[4]{81}$: el índice es par ($4$) y el radicando es positivo
    ($81 > 0$). Pertenece a $\mathbb{R}$ y vale $3$.'
  - 'Conclusión: $\sqrt{-16} \notin \mathbb{R}$, mientras $\sqrt[4]{81} = 3 \in \mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición sobre el radicando a garantiza que la raíz con índice par
    sqrt[2k]{a} pertenezca a los reales R?
  choices:
  - text: Que el radicando sea mayor o igual a cero (a >= 0)
    is_correct: true
  - text: Que el radicando sea un entero negativo
    is_correct: false
  - text: Que el radicando sea igual a -1
    is_correct: false
  - text: No requiere ninguna condición
    is_correct: false
  explanation: La alternativa correcta es 'Que el radicando sea mayor o igual a cero
    (a >= 0)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué sqrt{-16} no pertenece a R?
  choices:
  - text: Porque su índice es par (2) y el radicando es negativo (-16 < 0)
    is_correct: true
  - text: Porque 16 es un cuadrado perfecto
    is_correct: false
  - text: Because es igual a -4
    is_correct: false
  - text: Sí pertenece a R
    is_correct: false
  explanation: La alternativa correcta es 'Porque su índice es par (2) y el radicando
    es negativo (-16 < 0)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar si el índice de la raíz es un número par ($2, 4, 6, 8, \dots$).'
- 'Paso 2: Comprobar el signo del radicando $a$.'
- 'Paso 3: Si $a \ge 0$, calcular la raíz en $\mathbb{R}$. Si $a < 0$, declarar que
  la expresión no pertenece a $\mathbb{R}$.'
errores_correccion: '- **Error 1: Afirmar que $\sqrt{-9} = -3$.** **Cómo corregirlo:**
  $(-3)^2 = +9 \neq -9$. En los números reales la raíz cuadrada de un negativo NO
  EXISTE.


  - **Error 2: Aplicar la restricción $a \ge 0$ a raíces de índice impar.** **Cómo
  corregirlo:** La restricción de no negatividad rige ÚNICAMENTE para raíces de índice
  PAR.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Pertenece $\sqrt{-25}$ al conjunto de los números reales?
  alternativas:
  - No pertenece a R (no existe raíz real de radicando negativo e índice par)
  - Sí, es igual a -5
  - Sí, es igual a 5
  respuesta: No pertenece a R (no existe raíz real de radicando negativo e índice
    par)
  solucion_pasos:
  - $\sqrt{-25} \notin \mathbb{R}$ por tener índice par y radicando negativo.
- titulo: Ejemplo 2
  enunciado: ¿Existe en $\mathbb{R}$ la raíz cuarta $\sqrt[4]{16}$?
  alternativas:
  - Sí, es igual a 2
  - No existe
  - Es igual a -2
  respuesta: Sí, es igual a 2
  solucion_pasos:
  - $16 \ge 0 \implies \sqrt[4]{16} = 2 \in \mathbb{R}$.
- titulo: ¿Existe la raíz cuadrada de cero en los números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\sqrt{0} = 0 \in \mathbb{R}$ (cumple $0 \ge 0$).
- titulo: ¿Es sqrt{-1} un número real?
  respuesta: 'No'
  solucion_pasos:
  - No, $\sqrt{-1} = i \notin \mathbb{R}$ (es la unidad imaginaria).
errores_frecuentes:
- Las raíces cuadradas de números enteros negativos entregan resultados reales negativos.
- Cualquier número elevado al cuadrado produce un número negativo en el conjunto real.
- La expresión $\sqrt{-4}$ equivale al número entero $-2$.
- Las raíces de índice par aceptan cualquier radicando negativo dentro de los números
  reales.
- La condición $a \ge 0$ para raíces de índice par aplica también a las raíces cúbicas.
afirmaciones_verdaderas:
- Las raíces de índice par $\sqrt[2k]{a}$ están definidas en los reales si y solo
  si el radicando es mayor o igual a cero ($a \ge 0$).
- La elevación a una potencia par en $\mathbb{R}$ produce siempre un resultado no
  negativo ($b^{2k} \ge 0$).
al_terminar_debes_poder: Al terminar serás capaz de verificar la condición de existencia
  real $a \ge 0$ para raíces de índice par, determinando cuándo una expresión pertenece
  a $\mathbb{R}$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
