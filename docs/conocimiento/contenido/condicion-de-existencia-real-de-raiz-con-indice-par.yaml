semantic_id: MAT.NUM.RAICES_CONCEPTO.EXISTENCIA_INDICE_PAR
resumen_inicial: 'Una raíz con índice par solo existe en el conjunto de los números reales si y solo si su radicando es mayor o igual a cero: $\sqrt[2k]{a} \in \mathbb{R} \iff a \ge 0$.'
explicacion_simple: '![Existencia con índice par en ℝ](/static/img/nodos/condicion-de-existencia-real-de-raiz-con-indice-par-intro.svg)


  En los números reales no existe ningún número que al elevarse al cuadrado (o a cualquier potencia par como $4, 6, 8$) dé un resultado negativo. Por ejemplo, $(+3)^2 = +9$ y $(-3)^2 = +9$. Por esta razón, **las raíces con índice par de números negativos no tienen solución en los números reales** ($\sqrt{-25} \notin \mathbb{R}$). Para que una raíz par exista en $\mathbb{R}$, lo de adentro (el radicando) debe ser obligatoriamente **mayor o igual a cero**.'
explicacion_formal: 'Sean $a \in \mathbb{R}$ y $n = 2k$ con $k \in \mathbb{N}$ un número natural par ($n \in \{2, 4, 6, 8, \dots\}$). El **Criterio de Existencia en el Cuerpo Real** establece:


  $$\sqrt[2k]{a} \in \mathbb{R} \iff a \ge 0$$


  **Demostración analítica:**

  Por el axioma de orden en $\mathbb{R}$, para todo $b \in \mathbb{R}$ se cumple $b^2 \ge 0$, y por inducción:

  $$b^{2k} = (b^2)^k \ge 0 \quad (\forall b \in \mathbb{R})$$

  Si $a < 0$, no existe ningún $b \in \mathbb{R}$ tal que $b^{2k} = a$. Por tanto:

  $$\sqrt[2k]{a} \notin \mathbb{R} \quad (\text{para todo } a < 0)$$


  > **Determinación de Dominio Real:** Dada la expresión $\sqrt[2k]{f(x)}$, la condición de existencia exige resolver la inecuación $f(x) \ge 0$.'
definiciones_clave: '- **Condición de no negatividad**: Exigencia $a \ge 0$ para índices pares.

  - **Dominio de definición real**: Subconjunto de $\mathbb{R}$ donde el radicando es no negativo.

  - **Número no real**: Expresión radical que carece de pertenencia al cuerpo $\mathbb{R}$.'
propiedades_relaciones: '- **Cero permitido**: $\sqrt[2k]{0} = 0 \in \mathbb{R}$.

  - **Extensión a complejos**: $\sqrt{-1} = i \notin \mathbb{R}$ (pertenece al cuerpo $\mathbb{C}$, fuera del temario de números reales PAES).'
ejemplo_guiado:
  enunciado: '![Ejemplos de existencia con índice par](/static/img/nodos/condicion-de-existencia-real-de-raiz-con-indice-par-ejemplos.svg)


    Determine el dominio de existencia real para la expresión $\sqrt{x - 3}$, analice la existencia de $\sqrt[4]{-81}$ y evalúe $\sqrt[6]{0}$.'
  pasos:
  - 'Paso 1: Analizar $\sqrt{x - 3}$: Índice $2$ (par). Exigir radicando no negativo: $x - 3 \ge 0 \implies x \ge 3$. Dominio: $[3, +\infty)$.'
  - 'Paso 2: Analizar $\sqrt[4]{-81}$: Índice $4$ (par) y radicando $-81 < 0$. No existe $b \in \mathbb{R}$ con $b^4 = -81 \implies \sqrt[4]{-81} \notin \mathbb{R}$.'
  - 'Paso 3: Analizar $\sqrt[6]{0}$: Índice $6$ (par) y radicando $0 \ge 0$. Como $0^6 = 0$, existe y vale $0 \in \mathbb{R}$.'
  - 'Conclusión: $\sqrt{x-3} \in \mathbb{R}$ para $x \ge 3$; $\sqrt[4]{-81}$ no es real y $\sqrt[6]{0} = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Para qué valores de $x$ la expresión $\sqrt{5 - x}$ representa un número real?
  choices:
  - text: $x \le 5$ (porque $5 - x \ge 0 \implies x \le 5$)
    is_correct: true
  - text: $x \ge 5$
    is_correct: false
  - text: $x > 0$
    is_correct: false
  - text: Para todo $x \in \mathbb{R}$
    is_correct: false
  explanation: La alternativa correcta es '$x \le 5$ (porque $5 - x \ge 0 \implies x \le 5$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $\sqrt[4]{-81}$ no pertenece a $\mathbb{R}$?
  choices:
  - text: Porque el índice $4$ es par y ningún número real elevado a una potencia par da un valor negativo
    is_correct: true
  - text: Porque $81$ es impar
    is_correct: false
  - text: Porque falta dividir por $4$
    is_correct: false
  - text: Porque la raíz de $81$ es $9$
    is_correct: false
  explanation: La alternativa correcta es 'Porque el índice $4$ es par y ningún número real elevado a una potencia par da un valor negativo'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el índice $n$ y verificar si es un número par ($2, 4, 6, \dots$).'
- 'Paso 2: Plantear la inecuación de no negatividad: $\text{Radicando} \ge 0$.'
- 'Paso 3: Resolver la inecuación para determinar el intervalo de valores reales válidos.'
errores_correccion: '- **Error 1: Afirmar que $\sqrt{-16} = -4$.** **Cómo corregirlo:** Comprobar: $(-4)^2 = +16 \neq -16$. Las raíces de índice par de negativos NO son números reales.

  - **Error 2: Excluir el cero del dominio de raíces pares.** **Cómo corregirlo:** $\sqrt[n]{0} = 0 \in \mathbb{R}$, por lo que el cero está perfectamente permitido ($a \ge 0$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Para qué valores de $x$ existe $\sqrt{x + 7}$ en $\mathbb{R}$?
  alternativas:
  - $x \ge -7$
  - $x > 7$
  - $x \le -7$
  respuesta: $x \ge -7$
  solucion_pasos:
  - $x + 7 \ge 0 \implies x \ge -7$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de las siguientes raíces NO pertenece a los números reales?
  alternativas:
  - $\sqrt{-25}$
  - $\sqrt[3]{-27}$
  - $\sqrt{0}$
  respuesta: $\sqrt{-25}$
  solucion_pasos:
  - Índice 2 par con radicando $-25 < 0 \implies \notin \mathbb{R}$.
- titulo: ¿Existe ⁴√(-16) en los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, el índice 4 es par y el radicando es negativo ($\sqrt[4]{-16} \notin \mathbb{R}$).
  alternativas:
  - texto: No, porque el índice es par y el radicando es negativo
    es_correcta: true
    retroalimentacion: ¡Correcto! No existe en ℝ.
  - texto: Sí, es igual a -2
    es_correcta: false
    retroalimentacion: Incorrecto, $(-2)^4 = +16 \neq -16$.
  - texto: Sí, es igual a 2
    es_correcta: false
    retroalimentacion: Incorrecto, $2^4 = +16 \neq -16$.
- titulo: ¿Es √0 un número real?
  respuesta: Sí
  solucion_pasos:
  - Sí, $0 \ge 0$ y $\sqrt{0} = 0 \in \mathbb{R}$.
  alternativas:
  - texto: Sí, √0 = 0 ∈ ℝ
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple la condición $a \ge 0$.
  - texto: No, el radicando debe ser estrictamente positivo
    es_correcta: false
    retroalimentacion: Incorrecto, el cero está incluido.
  - texto: No, es indeterminado
    es_correcta: false
    retroalimentacion: Incorrecto, es igual a 0.
errores_frecuentes:
- Creer que $\sqrt{-a} = -\sqrt{a}$ para índices pares.
- Olvidar invertir el sentido de la desigualdad al multiplicar por negativos en inecuaciones.
- Excluir el valor cero del dominio de existencia.
- Confundir la condición de paridad par con la de paridad impar.
- Afirmar que $\sqrt{-9} = -3$.
afirmaciones_verdaderas:
- Toda raíz con índice par exige un radicando mayor o igual a cero para existir en $\mathbb{R}$.
- El valor cero es un radicando válido para cualquier índice radical.
- Las raíces de índice par de cantidades negativas no pertenecen al conjunto de los números reales.
al_terminar_debes_poder: '![Síntesis de existencia con índice par](/static/img/nodos/condicion-de-existencia-real-de-raiz-con-indice-par-resumen.svg)


  QUÉ: Determinar la condición y el dominio de existencia real para raíces con índice par.


  CÓMO: Planteando y resolviendo la inecuación $\text{Radicando} \ge 0$ para cualquier radical $\sqrt[2k]{f(x)}$ y reconociendo que los radicandos negativos producen valores fuera de $\mathbb{R}$.'
