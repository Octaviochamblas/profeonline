semantic_id: MAT.NUM.RAICES_CONCEPTO.EXISTENCIA_INDICE_PAR
resumen_inicial: Una raíz de índice par (como la raíz cuadrada $\sqrt{}$ o cuarta
  $\sqrt[4]{}$) existe en los números reales si y solo si el radicando es mayor o
  igual a cero ($a \ge 0$).
explicacion_simple: 'No existe ningún número real que al elevarse a un exponente par
  (2, 4, 6) dé como resultado un número negativo (porque positivo por positivo es
  positivo, y negativo por negativo también es positivo).

  Por eso, **las raíces de índice par de números negativos NO existen en $\mathbb{R}$**:

  - $\sqrt{16} = 4$ (Existe en $\mathbb{R}$)

  - $\sqrt{-16}$ (NO existe en $\mathbb{R}$; es un número complejo $4i$).'
explicacion_formal: Sea $n = 2k$ con $k \in \mathbb{N}$ (índice par). La expresión
  $\sqrt[2k]{a} \in \mathbb{R} \iff a \ge 0$. Para $a < 0$, $\sqrt[2k]{a} \notin \mathbb{R}$.
definiciones_clave: '- **Condición de existencia en $\mathbb{R}$**: Restricción del
  dominio $a \ge 0$ para raíces de índice par.'
propiedades_relaciones: '- **Dominio de funciones radicales**: Para $f(x) = \sqrt{g(x)}$,
  el dominio exige $g(x) \ge 0$.'
ejemplo_guiado:
  enunciado: Determina si las raíces A) $\sqrt{25}$ y B) $\sqrt{-25}$ pertenecen a
    $\mathbb{R}$.
  pasos:
  - 'Para A: Índice 2 (par) y radicando $25 \ge 0$. Pertenece a $\mathbb{R}$ (vale
    5).'
  - 'Para B: Índice 2 (par) y radicando $-25 < 0$. No tiene solución real ($\notin
    \mathbb{R}$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál de las siguientes raíces NO pertenece al conjunto de los números
    reales $\mathbb{R}$?
  choices:
  - text: $\sqrt{-9}$
    is_correct: true
  - text: $\sqrt[3]{-8}$
    is_correct: false
  - text: $\sqrt{0}$
    is_correct: false
  - text: $\sqrt[4]{16}$
    is_correct: false
  explanation: 'La correcta es: $\sqrt{-9}$. Es una raíz de índice par (2) con radicando
    negativo (-9), por lo que no es un número real.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para que la expresión $\sqrt{x - 3}$ sea un número real, ¿qué condición
    debe cumplir $x$?
  choices:
  - text: x ≥ 3
    is_correct: true
  - text: x > 0
    is_correct: false
  - text: x ≤ 3
    is_correct: false
  - text: x ≠ 3
    is_correct: false
  explanation: 'La correcta es: x ≥ 3. Exigimos radicando no negativo: $x - 3 \ge
    0 \implies x \ge 3$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar el índice $n$ de la raíz.'
- 'Paso 2: Si $n$ es par, evaluar el signo del radicando $a$.'
- 'Paso 3: Si $a \ge 0$, la raíz existe en $\mathbb{R}$. Si $a < 0$, la raíz no pertenece
  a $\mathbb{R}$.'
errores_correccion: 'No digas que $\sqrt{-4} = -2$. Comprueba: $(-2)^2 = +4 \neq -4$.
  Las raíces pares de negativos **no son reales**.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Existe $\sqrt[4]{-16}$ en los números reales?
  alternativas:
  - 'No'
  - Sí, es -2
  - Sí, es 2
  respuesta: 'No'
  solucion_pasos:
  - Índice 4 es par y radicando es negativo. No pertenece a $\mathbb{R}$.
errores_frecuentes:
- Asignar valores negativos reales a raíces cuadradas de números negativos.
afirmaciones_verdaderas:
- $\sqrt[n]{a} \in \mathbb{R}$ para $n$ par requiere $a \ge 0$.
al_terminar_debes_poder: Determinar la existencia real de raíces con índice par.
fuente: Texto escolar MINEDUC.
estado: publicado
