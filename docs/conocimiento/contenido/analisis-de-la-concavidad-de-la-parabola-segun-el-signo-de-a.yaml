semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CONCAVIDAD_SIGNO_A
resumen_inicial: 'El análisis de la concavidad establece que el signo del coeficiente principal $a$ rige exclusivamente la orientación de apertura de la parábola: si $a > 0$ es cóncava hacia arriba (ramas hacia $+\infty$, vértice mínimo), y si $a < 0$ es cóncava hacia abajo (ramas hacia $-\infty$, vértice máximo).'
explicacion_simple: "![El análisis de la concavidad establece que el signo del coeficiente principal $a$ rige exclusivamente la orientación de apertura de la parábola: si $a > 0$ es cóncava hacia arriba (ramas hacia $+\\infty$, vértice mínimo), y si $a < 0$ es cóncava hacia abajo (ramas hacia $-\\infty$, vértice máximo)](/static/img/nodos/analisis-de-la-concavidad-de-la-parabola-segun-el-signo-de-a-intro.svg)\n\n\nEl signo del número **$a$** define la \"emoción\" de la parábola:\n\n- **Si $a > 0$ (Positivo):**\n  - La parábola **\"sonríe\" $\\cup$** (cóncava hacia arriba).\n  - Sus ramas crecen hacia arriba hasta el infinito positivo.\n  - El vértice es el piso más hondo: un **mínimo**.\n- **Si $a < 0$ (Negativo):**\n  - La parábola **\"está triste\" $\\cap$** (cóncava hacia abajo).\n  - Sus ramas caen hacia abajo hasta el infinito negativo.\n  - El vértice es la cima más alta: un **máximo**.\n- **Importante:** Ni el coeficiente $b$ ni el término $c$ pueden cambiar jamás la concavidad; ¡solo\
  \ manda el signo de $a$!"
explicacion_formal: "Sea $f(x) = ax^2 + bx + c$ con $a \\in \\mathbb{R} \\setminus \\{0\\}$. El signo de la segunda derivada clasifica la convexidad local y global en todo el dominio $\\mathbb{R}$:\n$$f''(x) = 2a$$\n\n**Teorema de Clasificación de Concavidad**:\n1. **Caso $a > 0 \\implies f''(x) > 0, \\; \\forall x \\in \\mathbb{R}$**:\n   - $f$ es **estrictamente convexa** (cóncava hacia arriba $\\cup$).\n   - El gradiente $f'(x) = 2ax + b$ es estrictamente monótono creciente.\n   - En $x_v$, $f$ alcanza su **mínimo global estricto**: $f(x) \\ge f(x_v), \\; \\forall x \\in \\mathbb{R}$.\n2. **Caso $a < 0 \\implies f''(x) < 0, \\; \\forall x \\in \\mathbb{R}$**:\n   - $f$ es **estrictamente cóncava** (cóncava hacia abajo $\\cap$).\n   - El gradiente $f'(x) = 2ax + b$ es estrictamente monótono decreciente.\n   - En $x_v$, $f$ alcanza su **máximo global estricto**: $f(x) \\le f(x_v), \\; \\forall x \\in \\mathbb{R}$."
definiciones_clave: '- **Concavidad hacia arriba (convexa $\cup$)**: Orientación donde todas las rectas tangentes se sitúan por debajo de la curva.

  - **Concavidad hacia abajo (cóncava $\cap$)**: Orientación donde todas las rectas tangentes se sitúan por encima de la curva.'
propiedades_relaciones: '- **Invarianza de concavidad**: La concavidad de una parábola es idéntica en todos los puntos de su dominio (no cambia de signo jamás).

  - **Relación con el recorrido**: Si $a > 0 \implies \text{Rec}(f) = [y_v, +\infty[$; si $a < 0 \implies \text{Rec}(f) = ]-\infty, y_v]$.'
ejemplo_guiado:
  enunciado: '![Ejemplo El análisis de la concavidad establece que el signo del coeficiente principal $a$ rige exclusivamente la orientación de apertura de la parábola: si $a > 0$ es cóncava hacia arriba (ramas hacia $+\infty$, vértice mínimo), y si $a < 0$ es cóncava hacia abajo (ramas hacia $-\infty$, vértice máximo)](/static/img/nodos/analisis-de-la-concavidad-de-la-parabola-segun-el-signo-de-a-ejemplos.svg)



    Analiza la concavidad y determina la naturaleza del vértice para:

    1) $f(x) = 5 - 2x - 3x^2$

    2) $g(x) = \frac{1}{4}x^2 + 3x$'
  pasos:
  - 'Paso 1: Para $f(x) = -3x^2 - 2x + 5$:

    - $a = -3$.

    - Como $a = -3 < 0$, la parábola es **cóncava hacia abajo** ($\cap$).

    - Por abrir hacia abajo, su vértice es un **punto máximo absoluto**.'
  - 'Paso 2: Para $g(x) = \frac{1}{4}x^2 + 3x$:

    - $a = \frac{1}{4}$.

    - Como $a = \frac{1}{4} > 0$, la parábola es **cóncava hacia arriba** ($\cup$).

    - Por abrir hacia arriba, su vértice es un **punto mínimo absoluto**.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una función cuadrática tiene a = -0,5, ¿cómo abren sus ramas y qué representa su vértice?
  choices:
  - text: Abren hacia abajo (∩) y su vértice es un máximo absoluto.
    is_correct: true
  - text: Abren hacia arriba (∪) y su vértice es un mínimo absoluto.
    is_correct: false
  - text: Abren hacia abajo y su vértice es un mínimo.
    is_correct: false
  - text: Abren horizontalmente.
    is_correct: false
  explanation: La alternativa correcta es 'Abren hacia abajo (∩) y su vértice es un máximo absoluto.'. Al ser $a < 0$, la parábola es cóncava hacia abajo y el vértice es el punto más alto (máximo).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Puede una parábola cambiar de concavidad en algún tramo de su gráfica?
  choices:
  - text: No, una parábola mantiene siempre la misma concavidad en todo su dominio ℝ.
    is_correct: true
  - text: Sí, cambia de concavidad al cruzar el eje X.
    is_correct: false
  - text: Sí, cambia de concavidad en el vértice.
    is_correct: false
  - text: Depende del signo de c.
    is_correct: false
  explanation: La alternativa correcta es 'No, una parábola mantiene siempre la misma concavidad en todo su dominio ℝ.'. Como $f''(x) = 2a$ es constante, la concavidad nunca cambia.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el coeficiente cuadrático $a$ multiplicando a $x^2$.'
- 'Paso 2: Evaluar el signo algebraico de $a$.'
- 'Paso 3: Si $a > 0$, clasificar como cóncava hacia arriba $\cup$ con vértice mínimo.'
- 'Paso 4: Si $a < 0$, clasificar como cóncava hacia abajo $\cap$ con vértice máximo.'
errores_correccion: '- **Error común:** Pensar que si el vértice tiene coordenadas negativas, la parábola abre hacia abajo.

  - **Cómo corregirlo:** La orientación depende **únicamente del signo de $a$**, no de la posición del vértice.'
ejemplos:
- titulo: 'Ejemplo 1: Coeficiente implícito negativo'
  enunciado: En $f(x) = 10 - x^2$, ¿cuál es el sentido de la concavidad?
  alternativas:
  - Cóncava hacia abajo (a = -1 < 0)
  - Cóncava hacia arriba
  - No tiene concavidad
  - Lineal
  respuesta: Cóncava hacia abajo (a = -1 < 0)
  solucion_pasos:
  - 'Paso 1: $a = -1 < 0 \implies$ cóncava hacia abajo.'
- titulo: 'Ejemplo 2: Vértice mínimo'
  enunciado: Para que la parábola $f(x) = kx^2 - 4x + 1$ tenga un mínimo en su vértice, ¿cómo debe ser k?
  alternativas:
  - k > 0
  - k < 0
  - k = 0
  - k = 4
  respuesta: k > 0
  solucion_pasos:
  - 'Paso 1: Mínimo $\implies$ ramas hacia arriba $\implies a > 0 \implies k > 0$.'
- titulo: 'Ejemplo 3: Apertura según concavidad'
  enunciado: Si una parábola modela la trayectoria de una pelota lanzada al aire ($h(t) = -5t^2 + 20t$), ¿cuál es su concavidad?
  alternativas:
  - Cóncava hacia abajo (a = -5 < 0)
  - Cóncava hacia arriba
  - Constante
  - Lineal
  respuesta: Cóncava hacia abajo (a = -5 < 0)
  solucion_pasos:
  - 'Paso 1: $a = -5 < 0 \implies$ curva de campana con altura máxima en el vértice.'
- titulo: 'Ejemplo 4: Signo con fracciones'
  enunciado: En $g(x) = -\frac{3}{7}x^2 + 2$, ¿qué tipo de extremo hay en el vértice?
  alternativas:
  - Un valor máximo absoluto
  - Un valor mínimo absoluto
  - Un punto de inflexión
  - No tiene extremo
  respuesta: Un valor máximo absoluto
  solucion_pasos:
  - 'Paso 1: $a = -3/7 < 0 \implies$ cóncava hacia abajo $\implies$ máximo.'
errores_frecuentes:
- Asociar signo positivo con tener vértice máximo.
- Mirar el signo del término independiente c en vez de a para determinar la concavidad.
- Creer que el signo de b influye en la concavidad.
afirmaciones_verdaderas:
- El coeficiente 'a' determina unívocamente la concavidad de la parábola en todo su dominio.
- Si a > 0 la función alcanza un valor mínimo absoluto, y si a < 0 alcanza un valor máximo absoluto.
al_terminar_debes_poder: '**QUÉ:** Analizar y clasificar la concavidad de una parábola según el signo de a.


  **CÓMO:** Evaluando el signo de a para determinar la orientación (arriba/abajo) y la naturaleza extremal del vértice.


