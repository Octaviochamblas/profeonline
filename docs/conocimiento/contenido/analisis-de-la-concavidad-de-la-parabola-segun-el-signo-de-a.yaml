semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CONCAVIDAD_SIGNO_A
resumen_inicial: El análisis de la concavidad determina la orientación de las ramas de la parábola a través del signo del coeficiente cuadrático $a$.
explicacion_simple: |
  La orientación hacia donde se abren las ramas de una parábola depende **ÚNICAMENTE DEL SIGNO DE LA LETRA $a$**:

  - **Si $a > 0$ (Positivo)**: La parábola es **cóncava hacia arriba** (forma de copa o carita feliz $\cup$).
    - Sus ramas suben hacia $+\infty$.
    - Su punto más bajo es un **mínimo**.
  - **Si $a < 0$ (Negativo)**: La parábola es **cóncava hacia abajo** (forma de montaña o carita triste $\cap$).
    - Sus ramas bajan hacia $-\infty$.
    - Su punto más alto es un **máximo**.
explicacion_formal: |
  Sea la función $f(x) = ax^2 + bx + c$. La segunda derivada de la función es una constante dependiente exclusivamente de $a$:

  $$f''(x) = 2a$$

  **Criterio de concavidad por derivada segunda:**
  - **Concavidad Positiva (Convexa):** Si $a > 0 \implies f''(x) > 0$. Las ramas apuntan hacia $+\infty$ y la función posee un mínimo global en el vértice.
  - **Concavidad Negativa (Cóncava):** Si $a < 0 \implies f''(x) < 0$. Las ramas apuntan hacia $-\infty$ y la función posee un máximo global en el vértice.
definiciones_clave: |
  - **Concavidad de la parábola**: Orientación geométrica de la abertura de la curva determinada por el signo del coeficiente principal $a$.
propiedades_relaciones: |
  - **Monotonía de la abertura**: El valor absoluto $|a|$ determina el nivel de compresión o dilatación de la parábola, independientemente de su signo.
ejemplo_guiado:
  enunciado: 'Determina la concavidad y la presencia de un máximo o mínimo en la función $f(x) = -3x^2 + 12x - 5$.'
  pasos:
    - 'Paso 1: Identificar el coeficiente cuadrático $a$: en la función $a = -3$.'
    - 'Paso 2: Evaluar el signo de $a$: $-3 < 0$, luego el signo es negativo.'
    - 'Paso 3: Determinar la concavidad: es cóncava hacia abajo.'
    - 'Paso 4: Concluir que al abrirse hacia abajo, su vértice representa un punto máximo.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si una función cuadrática tiene coeficiente principal $a = 0.5$, ¿cuál es la concavidad de su parábola?'
    choices:
      - {text: 'Cóncava hacia arriba porque $a > 0$', is_correct: true}
      - {text: 'Cóncava hacia abajo porque $a < 1$.', is_correct: false}
      - {text: 'Línea recta horizontal.', is_correct: false}
      - {text: 'Sin concavidad definida.', is_correct: false}
    explanation: 'La alternativa correcta es ''Cóncava hacia arriba porque $a > 0$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Dada $g(x) = 7 - 4x - x^2$, ¿qué tipo de valor alcanza en su vértice?'
    choices:
      - {text: 'Un valor máximo global porque $a = -1 < 0$', is_correct: true}
      - {text: 'Un valor mínimo global porque $a = 7 > 0$.', is_correct: false}
      - {text: 'Un punto de inflexión con pendiente nula.', is_correct: false}
      - {text: 'No es posible determinar el valor en el vértice.', is_correct: false}
    explanation: 'La alternativa correcta es ''Un valor máximo global porque $a = -1 < 0$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer el coeficiente numérico $a$ que acompaña a $x^2$.'
  - 'Paso 2: Comprobar si $a > 0$ o $a < 0$.'
  - 'Paso 3: Si $a > 0$, declarar la parábola cóncava hacia arriba (ramas hacia $+\infty$, vértice como mínimo).'
  - 'Paso 4: Si $a < 0$, declarar la parábola cóncava hacia abajo (ramas hacia $-\infty$, vértice como máximo).'
errores_correccion: |
  - **Error común:** Guiarse por el signo de $b$ o $c$ para determinar la concavidad de la parábola.
  - **Cómo corregirlo:** La concavidad **DEPENDE EXCLUSIVAMENTE DEL SIGNO DE $a$**; ignora los signos de $b$ y $c$ para este análisis.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Concavidad positiva.
    alternativas:
      - 'Cóncava hacia arriba (Posee mínimo)'
      - 'Cóncava hacia abajo (Posee máximo)'
      - 'Sin concavidad'
    respuesta: 'Cóncava hacia arriba (Posee mínimo)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Concavidad negativa.
    alternativas:
      - 'Cóncava hacia abajo (Posee máximo)'
      - 'Cóncava hacia arriba (Posee mínimo)'
      - 'Línea horizontal'
    respuesta: 'Cóncava hacia abajo (Posee máximo)'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Evaluar la concavidad a partir del signo del término independiente $c$ en lugar del coeficiente $a$.'
  - 'La idea de que las parábolas con $a > 0$ poseen un valor máximo en su vértice.'
  - 'La suposición de que si el coeficiente $b$ es negativo, la parábola necesariamente se abre hacia abajo.'
  - 'La equivalencia errónea entre la abertura de las ramas y el desplazamiento horizontal del eje de simetría.'
  - 'Afirmar que un coeficiente cuadrático menor a 1 implica concavidad negativa.'
afirmaciones_verdaderas:
  - 'El signo del coeficiente cuadrático $a$ determina si la parábola se abre hacia arriba ($a > 0$) o hacia abajo ($a < 0$).'
  - 'Toda parábola cóncava hacia arriba ($a > 0$) tiene un punto mínimo en su vértice, mientras que si $a < 0$ posee un punto máximo.'
al_terminar_debes_poder: |
  QUÉ: Analizar y clasificar la concavidad de la parábola según el signo de $a$.
  CÓMO: Aislar $a$, evaluar $a > 0$ o $a < 0$, determinar si se abre hacia arriba o abajo y asociar el vértice a un mínimo o máximo.
