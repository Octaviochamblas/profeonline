procedimiento:
- 'Paso 1: Identifica el coeficiente $a$ de la función.'
- 'Paso 2: Si $a>0$, concluye que la parábola es cóncava hacia arriba (abre hacia
  arriba).'
- 'Paso 3: Si $a<0$, concluye que la parábola es cóncava hacia abajo (abre hacia abajo).'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en análisis de la concavidad de la parábola según
  el signo de a.
ejemplos:
- titulo: Determinación de concavidad hacia arriba
  enunciado: ¿Cuál es la concavidad de $f(x)=4x^2-7x+2$?
  solucion_pasos:
  - $a=4>0$.
  - La parábola es cóncava hacia arriba.
- titulo: Determinación de concavidad hacia abajo
  enunciado: ¿Cuál es la concavidad de $f(x)=-x^2+3x$?
  solucion_pasos:
  - $a=-1<0$.
  - La parábola es cóncava hacia abajo.
- titulo: ¿El signo de $b$ o $c$ afecta la concavidad de la parábola?
  enunciado: ¿El signo de $b$ o $c$ afecta la concavidad de la parábola?
  respuesta: 'No'
  solucion_pasos:
  - La concavidad depende exclusivamente del signo del coeficiente $a$, no de $b$
    ni de $c$.
- titulo: ¿Una parábola cóncava hacia arriba tiene un valor máximo?
  enunciado: ¿Una parábola cóncava hacia arriba tiene un valor máximo?
  respuesta: 'No'
  solucion_pasos:
  - Una parábola cóncava hacia arriba tiene un valor mínimo (en su vértice), pero
    no un valor máximo, ya que crece indefinidamente hacia ambos lados.
errores_frecuentes:
- Confundir la concavidad hacia arriba con hacia abajo, invirtiendo la interpretación
  del signo de $a$.
- Determinar la concavidad usando el signo de $b$ o $c$ en vez del signo de $a$.
- Asumir que $|a|$ (el valor absoluto) determina la concavidad, cuando en realidad
  solo importa el signo.
- Confundir "cóncava hacia arriba" con "creciente en todo su dominio", cuando en realidad
  decrece antes del vértice y crece después.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  análisis de la concavidad de la parábola según el signo de a.
