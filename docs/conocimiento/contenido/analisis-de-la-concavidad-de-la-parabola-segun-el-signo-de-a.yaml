semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CONCAVIDAD_SIGNO_A
resumen_inicial: 'El signo del coeficiente cuadrático $a$ rige la concavidad de la parábola: si $a > 0$ abre hacia arriba (vértice mínimo) y si $a < 0$ abre hacia abajo (vértice máximo).'
explicacion_simple: |
  La concavidad indica hacia qué dirección se abren los brazos de la parábola. Si el número $a$ que multiplica a $x^2$ es positivo ($a > 0$), las ramas de la curva apuntan hacia arriba, como una sonrisa o contenedor, haciendo que el punto del vértice esté en el fondo (mínimo). Si $a$ es negativo ($a < 0$), las ramas apuntan hacia abajo y el vértice se ubica en el tope de la curva (máximo).
explicacion_formal: |
  ### Definición formal
  La **concavidad** de la función cuadrática $f(x) = ax^2 + bx + c$ se clasifica algebraicamente según el signo del parámetro $a \in \mathbb{R} \setminus \{0\}$:
  - **Cóncava hacia arriba (o convexa)**: $\iff a > 0$.
  - **Cóncava hacia abajo (o cóncava)**: $\iff a < 0$.

  ### Desglose simbólico
  - Para $a > 0$: $\lim_{x \to \pm\infty} f(x) = +\infty$. El vértice $V(h, k)$ es el **mínimo global** de la función. El recorrido es $\operatorname{Rec}(f) = [k, +\infty[$.
  - Para $a < 0$: $\lim_{x \to \pm\infty} f(x) = -\infty$. El vértice $V(h, k)$ es el **máximo global** de la función. El recorrido es $\operatorname{Rec}(f) = ]-\infty, k]$.

  ### Síntesis didáctica
  La concavidad es independiente de los coeficientes $b$ y $c$, los cuales únicamente trasladan la parábola en el plano sin alterar la dirección de sus ramas. El signo del único coeficiente principal $a$ fija definitivamente la orientación de la curva.
definiciones_clave: |
  - **Concavidad hacia arriba**: Parábola con ramas dirigidas hacia el semi-eje positivo de las ordenadas ($a > 0$).
  - **Concavidad hacia abajo**: Parábola con ramas dirigidas hacia el semi-eje negativo de las ordenadas ($a < 0$).
  - **Punto mínimo/máximo absoluto**: Carácter del vértice $V(h, k)$ condicionado unívocamente por el signo de $a$.
propiedades_relaciones: |
  - **Monotonía por intervalos**:
    - Si $a > 0$, la función es estrictamente decreciente en $]-\infty, h]$ y estrictamente creciente en $[h, +\infty[$.
    - Si $a < 0$, la función es estrictamente creciente en $]-\infty, h]$ y estrictamente decreciente en $[h, +\infty[$.
  - **Estabilidad bajo traslación**: Sumar o restar constantes a la función no altera el signo de $a$ ni su concavidad.
ejemplo_guiado:
  enunciado: 'Dadas las funciones $f(x) = 4 - 3x + 5x^2$ y $g(x) = -2(x + 1)^2 + 8$, determina la concavidad de cada una y clasifica la naturaleza de sus vértices en términos de máximos o mínimos.'
  pasos:
    - 'Paso 1: Para $f(x)$, ordenamos sus términos: $f(x) = 5x^2 - 3x + 4$. Extraemos $a = 5$.'
    - 'Paso 2: Como $a = 5 > 0$, la parábola de $f(x)$ es cóncava hacia arriba, por lo que su vértice representa un punto mínimo absoluto.'
    - 'Paso 3: Para $g(x)$, observamos la forma canónica $-2(x + 1)^2 + 8$, identificando directamente $a = -2$.'
    - 'Paso 4: Como $a = -2 < 0$, la parábola de $g(x)$ es cóncava hacia abajo, por lo que su vértice representa un punto máximo absoluto.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si la trayectoria cuadrática de un proyectil viene dada por $h(t) = -4.9t^2 + 20t + 2$, ¿qué indica el signo de $a = -4.9$ respecto a su altura?'
    choices:
      - {text: 'Que la parábola es cóncava hacia abajo y posee un punto de altura máxima', is_correct: true}
      - {text: 'Que la parábola es cóncava hacia arriba y el proyectil cae a una profundidad mínima', is_correct: false}
      - {text: 'Que la parábola no tiene vértice en el plano real', is_correct: false}
      - {text: 'Que la velocidad inicial es negativa', is_correct: false}
    explanation: 'La alternativa correcta es ''Que la parábola es cóncava hacia abajo y posee un punto de altura máxima''. Al ser $a = -4.9 < 0$, las ramas abren hacia abajo y el vértice es un máximo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Para qué valores del parámetro $k$ la función $p(x) = (3 - k)x^2 + 2x - 1$ abre sus ramas hacia arriba en el plano cartesiano?'
    choices:
      - {text: '$k < 3$', is_correct: true}
      - {text: '$k > 3$', is_correct: false}
      - {text: '$k = 3$', is_correct: false}
      - {text: '$k > 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$k < 3$''. Para que abra hacia arriba se exige $a > 0 \implies 3 - k > 0 \implies 3 > k \implies k < 3$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar el coeficiente cuadrático $a$ multiplicando al término de grado 2.'
  - 'Paso 2: Evaluar la desigualdad del signo de $a$ ($a > 0$ o $a < 0$).'
  - 'Paso 3: Concluir la dirección de la abertura (hacia arriba si $a > 0$, hacia abajo si $a < 0$) y la naturaleza del vértice (mínimo si $a > 0$, máximo si $a < 0$).'
errores_correccion: |
  - **Error 1:** Juzgar la concavidad según el signo del término independiente $c$ o del coeficiente lineal $b$. **Cómo corregirlo:** Únicamente el signo de $a$ determina la concavidad. Los términos $b$ y $c$ solo trasladan la gráfica.
  - **Error 2:** Asociar el signo positivo de $a$ con un valor máximo. **Cómo corregirlo:** Si $a > 0$, las ramas suben indefinidamente hacia $+\infty$, por lo que el vértice se sitúa abajo (mínimo).
ejemplos:
  - titulo: 'Concavidad en función cuadrática pura'
    enunciado: '¿Cuál es la concavidad de la parábola $f(x) = -x^2$?'
    alternativas:
      - 'Cóncava hacia abajo'
      - 'Cóncava hacia arriba'
      - 'Sin concavidad definida'
    respuesta: 'Cóncava hacia abajo'
    solucion_pasos:
      - '1. El coeficiente cuadrático es $a = -1$.'
      - '2. Como $a = -1 < 0$, las ramas abren hacia abajo.'
  - titulo: 'Análisis de mínimo en función cuadrática'
    enunciado: 'En la función $g(x) = 0.5x^2 - 4x + 10$, ¿el vértice es un máximo o un mínimo?'
    alternativas:
      - 'Un mínimo absoluto'
      - 'Un máximo absoluto'
      - 'Un punto de inflexión neutro'
    respuesta: 'Un mínimo absoluto'
    solucion_pasos:
      - '1. Extraemos el coeficiente $a = 0.5 > 0$.'
      - '2. Al ser $a > 0$, las ramas abren hacia arriba y la curva alcanza su cota más baja en el vértice (mínimo).'
  - titulo: 'Impacto del coeficiente b sobre la concavidad'
    enunciado: 'Si en $f(x) = 2x^2 + bx + 1$ cambiamos $b = 5$ por $b = -50$, ¿cambia la concavidad de la parábola?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. El coeficiente $a = 2 > 0$ se mantiene idéntico, por lo que la parábola sigue siendo cóncava hacia arriba.'
  - titulo: 'Relación entre concavidad y recorrido'
    enunciado: 'Si una función cuadrática tiene $a < 0$ y vértice $(1, 6)$, ¿su recorrido es $]-\infty, 6]$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al abrir hacia abajo ($a < 0$), los valores de $y$ abarcan desde $-\infty$ hasta la altura máxima del vértice $k = 6$.'
errores_frecuentes:
  - 'Una función cuadrática con coeficiente $a = 3$ abre sus ramas hacia abajo porque 3 es un número entero.'
  - 'El signo del término independiente $c$ decide si la parábola es cóncava hacia arriba o hacia abajo.'
  - 'Cuando $a > 0$, la parábola alcanza un valor máximo absoluto en su vértice.'
  - 'Si una parábola se traslada al tercer cuadrante del plano, su coeficiente $a$ se vuelve automáticamente negativo.'
  - 'La concavidad de una parábola cambia de orientación a mitad de camino entre sus dos raíces.'
afirmaciones_verdaderas:
  - 'Si el coeficiente cuadrático es positivo ($a > 0$), la parábola abre hacia arriba y su vértice es el punto mínimo absoluto.'
  - 'Si el coeficiente cuadrático es negativo ($a < 0$), la parábola abre hacia abajo y su vértice es el punto máximo absoluto.'
al_terminar_debes_poder: 'Determinar la concavidad de cualquier función cuadrática y deducir la naturaleza máxima o mínima de su vértice según el signo de $a$.'
