semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.CONCAVIDAD_SIGNO_A
resumen_inicial: 'Análisis de la concavidad de la parábola según el signo de a: parábola,
  vértice, concavidad y formas de Análisis gráfico: parábola, concavidad e intersecciones.'
explicacion_simple: Sin necesidad de graficar ni calcular ningún punto, el simple
  signo del coeficiente $a$ ya revela si la parábola abre "como una copa" o "como
  un paraguas".
explicacion_formal: '### Definición formal


  Dada $f(x)=ax^2+bx+c$: si $a>0$, la función tiene un mínimo global en su vértice
  y su gráfica es cóncava hacia arriba; si $a<0$, la función tiene un máximo global
  en su vértice y su gráfica es cóncava hacia abajo.


  ### Desarrollo didáctico


  Basta con leer el signo del coeficiente $a$, sin necesidad de más información, para
  anticipar la orientación general de la parábola antes de graficarla.


  Para $f(x)=3x^2-2x+1$, con $a=3>0$: la parábola es cóncava hacia arriba. Para $g(x)=-5x^2+x$,
  con $a=-5<0$: la parábola es cóncava hacia abajo.'
definiciones_clave: '- **Análisis de la concavidad de la parábola según el signo de
  a**: Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  análisis de la concavidad de la parábola según el signo de a.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando análisis de
    la concavidad de la parábola según el signo de a.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a análisis
    de la concavidad de la parábola según el signo de a.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
