semantic_id: MAT.ALG.INTERVALOS.INTERVALO_CERRADO
resumen_inicial: Un intervalo cerrado incluye a sus dos extremos y se denota entre corchetes cerrados $[a, b]$.
explicacion_simple: '![Notación de intervalo cerrado](/static/img/nodos/notacion-de-intervalo-cerrado-intro.svg)


  Un **intervalo cerrado** comprende a todos los números reales situados entre $a$ y $b$, **INCLUYENDO TAMBIÉN** a los bordes $a$ y $b$.

  Se denota mediante corchetes cerrados apuntando hacia adentro $[a, b]$ y se relaciona con desigualdades no estrictas del tipo $a \le x \le b$.'
explicacion_formal: 'El **intervalo cerrado** $[a, b]$ sobre $\mathbb{R}$ con $a < b$ se define formalmente como:


  $$[a, b] = \{x \in \mathbb{R} \mid a \le x \le b\}$$


  **Desglose de la fórmula:**

  - $[a$ y $b]$: Corchetes orientados hacia el interior del conjunto que indican que $a \in [a, b]$ y $b \in [a, b]$.'
definiciones_clave: '- **Intervalo cerrado $[a, b]$**: Subconjunto real que contiene a todos sus puntos límite incluyendo $a$ y $b$.

  - **Corchete cerrado ($[ $ ó $ ]$)**: Símbolo que denota la inclusión formal del valor extremo.'
propiedades_relaciones: '- **Desigualdad no estricta asociada**: Corresponde a la relación $a \le x \le b$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Notación de intervalo cerrado](/static/img/nodos/notacion-de-intervalo-cerrado-ejemplos.svg)


    Expresa en notación de intervalo la desigualdad $1 \le x \le 6$, y comprueba si $x = 1$ y $x = 6$ forman parte del conjunto.'
  pasos:
  - 'Paso 1: Identificar los extremos $a = 1$ y $b = 6$.Paso 2: Escribir la notación entre corchetes cerrados: $[1, 6]$.Paso 3: Comprobar el extremo $x = 1$: por ser cerrado, $1 \in [1, 6]$.Paso 4: Comprobar el extremo $x = 6$: por ser cerrado, $6 \in [1, 6]$.Paso 5: Concluir que los bordes $1$ y $6$ pertenecen al intervalo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se escribe en notación de intervalo el conjunto $\{x \in \mathbb{R} \mid 1 \le x \le 6\}$?
  choices:
  - text: $[1, 6]$
    is_correct: true
  - text: $]1, 6[$
    is_correct: false
  - text: $[1, 6[$
    is_correct: false
  - text: $]1, 6]$
    is_correct: false
  explanation: La alternativa correcta es '$[1, 6]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el intervalo cerrado $[1, 6]$, ¿los números bordes $1$ y $6$ están incluidos?
  choices:
  - text: Sí, ambos extremos forman parte del conjunto solución.
    is_correct: true
  - text: No, se excluyen por ser límites.
    is_correct: false
  - text: Solo el número 1 está incluido.
    is_correct: false
  - text: Solo el número 6 está incluido.
    is_correct: false
  explanation: La alternativa correcta es 'Sí, ambos extremos forman parte del conjunto solución.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los extremos $a$ y $b$.'
- 'Paso 2: Escribir el corchete cerrado izquierdo $[$.'
- 'Paso 3: Escribir los valores $a, b$.'
- 'Paso 4: Escribir el corchete cerrado derecho $]$ para formar $[a, b]$.'
errores_correccion: '- **Error común:** Escribir $]1, 6[$ al traducir una desigualdad que tiene el signo igual $\le$.

  - **Cómo corregirlo:** Si la desigualdad tiene el signo igual ($\le$), el corchete debe ir CERRADO hacia adentro $[ ]$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
- La notación de intervalo cerrado $[a, b]$ excluye a sus extremos $a$ y $b$ del conjunto de soluciones.
- La desigualdad doble que define al intervalo cerrado $[2, 9]$ se escribe mediante operadores estrictos $2 < x < 9$.
- El extremo $x = 2$ no pertenece al intervalo cerrado $[2, 9]$.
- La representación gráfica de un intervalo cerrado usa círculos vacíos no rellenados en ambos extremos.
- El corchete orientativo hacia adentro $[$ en notación de conjuntos indica que el extremo no se incluye.
afirmaciones_verdaderas:
- Un intervalo cerrado $[a, b]$ incluye a ambos extremos $a$ y $b$ dentro del conjunto de soluciones.
- La notación $[a, b]$ equivale rigurosamente a la desigualdad no estricta doble $a \le x \le b$.
al_terminar_debes_poder: '**QUÉ:** Expresar e interpretar intervalos reales cerrados $[a, b]$.


  **CÓMO:** Empleando corchetes normales hacia adentro para indicar la inclusión explícita de ambos valores límite ($a \le x \le b$, donde $a, b \in I$).


  ![Resumen Notación de intervalo cerrado](/static/img/nodos/notacion-de-intervalo-cerrado-resumen.svg)'
