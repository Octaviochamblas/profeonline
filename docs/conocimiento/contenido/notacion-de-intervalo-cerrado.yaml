semantic_id: MAT.ALG.INTERVALOS.INTERVALO_CERRADO
resumen_inicial: 'Notación de intervalo cerrado: relaciones de orden, intervalos y
  resolución en Intervalos reales y su representación.'
explicacion_simple: A diferencia del intervalo abierto, un intervalo cerrado incorpora
  los valores límite en el conjunto.
explicacion_formal: '### Definición formal

  El intervalo cerrado se define como $[a, b] = \{ x \in \mathbb{R} \mid a \le x \le
  b \}$.


  ### Desarrollo didáctico

  En la recta numérica, marcamos los extremos con círculos sólidos o rellenados, demostrando
  que estos números pertenecen a la solución.'
definiciones_clave: '- **Notación de intervalo cerrado**: Concepto fundamental de
  relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a notación de intervalo cerrado.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de notación de intervalo
    cerrado.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de notación de intervalo cerrado, invirtiendo
    el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
