semantic_id: MAT.ALG.INTERVALOS.INTERVALO_CERRADO
resumen_inicial: Un intervalo cerrado incluye a sus dos extremos y se denota entre
  corchetes cerrados $[a, b]$.
explicacion_simple: 'Un **intervalo cerrado** comprende a todos los números reales
  situados entre $a$ y $b$, **INCLUYENDO TAMBIÉN** a los bordes $a$ y $b$.

  Se denota mediante corchetes cerrados apuntando hacia adentro $[a, b]$ y se relaciona
  con desigualdades no estrictas del tipo $a \le x \le b$.'
explicacion_formal: 'El **intervalo cerrado** $[a, b]$ sobre $\mathbb{R}$ con $a <
  b$ se define formalmente como:


  $$[a, b] = \{x \in \mathbb{R} \mid a \le x \le b\}$$


  **Desglose de la fórmula:**

  - $[a$ y $b]$: Corchetes orientados hacia el interior del conjunto que indican que
  $a \in [a, b]$ y $b \in [a, b]$.'
definiciones_clave: '- **Intervalo cerrado $[a, b]$**: Subconjunto real que contiene
  a todos sus puntos límite incluyendo $a$ y $b$.

  - **Corchete cerrado ($[ $ ó $ ]$)**: Símbolo que denota la inclusión formal del
  valor extremo.'
propiedades_relaciones: '- **Desigualdad no estricta asociada**: Corresponde a la
  relación $a \le x \le b$.'
ejemplo_guiado:
  enunciado: Expresa en notación de intervalo la desigualdad $1 \le x \le 6$, y comprueba
    si $x = 1$ y $x = 6$ forman parte del conjunto.
  pasos:
  - 'Paso 1: Identificar los extremos $a = 1$ y $b = 6$.Paso 2: Escribir la notación
    entre corchetes cerrados: $[1, 6]$.Paso 3: Comprobar el extremo $x = 1$: por ser
    cerrado, $1 \in [1, 6]$.Paso 4: Comprobar el extremo $x = 6$: por ser cerrado,
    $6 \in [1, 6]$.Paso 5: Concluir que los bordes $1$ y $6$ pertenecen al intervalo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se escribe en notación de intervalo el conjunto $\{x \in \mathbb{R}
    \mid 1 \le x \le 6\}$?
  choices:
  - text: $[1, 6]$
    is_correct: true
  - text: $]1, 6[$
    is_correct: false
  - text: $[1, 6[$
    is_correct: false
  - text: $]1, 6]$
    is_correct: false
  explanation: La alternativa correcta es '$[1, 6]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el intervalo cerrado $[1, 6]$, ¿los números bordes $1$ y $6$ están
    incluidos?
  choices:
  - text: Sí, ambos extremos forman parte del conjunto solución.
    is_correct: true
  - text: No, se excluyen por ser límites.
    is_correct: false
  - text: Solo el número 1 está incluido.
    is_correct: false
  - text: Solo el número 6 está incluido.
    is_correct: false
  explanation: La alternativa correcta es 'Sí, ambos extremos forman parte del conjunto
    solución.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los extremos $a$ y $b$.'
- 'Paso 2: Escribir el corchete cerrado izquierdo $[$.'
- 'Paso 3: Escribir los valores $a, b$.'
- 'Paso 4: Escribir el corchete cerrado derecho $]$ para formar $[a, b]$.'
errores_correccion: '- **Error común:** Escribir $]1, 6[$ al traducir una desigualdad
  que tiene el signo igual $\le$.

  - **Cómo corregirlo:** Si la desigualdad tiene el signo igual ($\le$), el corchete
  debe ir CERRADO hacia adentro $[ ]$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de intervalos.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de intervalos.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un intervalo abierto excluye a sus dos extremos?
  respuesta: Sí
  solucion_pasos:
  - Sí, los extremos no pertenecen al conjunto.
- titulo: ¿El símbolo de infinito siempre lleva corchete abierto?
  respuesta: Sí
  solucion_pasos:
  - Sí, por ser un concepto de crecimiento ilimitado.
errores_frecuentes:
- Usar corchetes cerrados $[ ]$ para traducir desigualdades estrictas que no incluyen
  el signo igual.
- Colocar un corchete cerrado en los símbolos de infinito $+ \infty$ o $-\infty$.
- Escribir las fronteras del intervalo al revés colocando el número mayor a la izquierda.
- Creer que un intervalo real solo contiene a los números enteros de la zona.
- Olvidar sombrear la línea continua al dibujar la gráfica en la recta numérica.
afirmaciones_verdaderas:
- Un intervalo cerrado $[a, b]$ incluye a ambos extremos $a$ y $b$ dentro del conjunto
  de soluciones.
- El símbolo de infinito siempre lleva corchete abierto ya que representa una cota
  ilimitada no alcanzable.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, traducir y representar
  gráficamente intervalos reales abiertos, cerrados e infinitos.
fuente: Texto escolar MINEDUC — Álgebra / Intervalos Reales
