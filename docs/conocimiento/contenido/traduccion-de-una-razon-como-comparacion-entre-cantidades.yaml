semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.RAZON_COMPARACION
resumen_inicial: 'Traducción de una razón como comparación entre cantidades: traducción,
  reglas y aplicación práctica en Lenguaje algebraico: operaciones y múltiplos.'
explicacion_simple: Si en un salón hay 2 niños por cada 3 niñas, no sabemos cuántos
  alumnos hay en total. Solo sabemos la proporción o el 'ritmo' de la mezcla. Esa
  es la relación algebraica de la razón.
explicacion_formal: '### Definición formal


  La palabra ''razón'' en este contexto significa proporción geométrica, es decir,
  un cociente que compara dos tamaños.


  ### Desarrollo didáctico


  Palabras clave:

  - La razón entre

  - La relación entre

  - Está en proporción de

  - Es a (ej: ''x es a y'')


  Ejemplos:

  - ''La razón entre hombres y mujeres es de 2 a 3'': Se traduce como $\frac{H}{M}
  = \frac{2}{3}$

  - ''El peso de A y el peso de B están en razón de 5 a 1'': $\frac{A}{B} = \frac{5}{1}$


  El orden de aparición en el enunciado dicta estrictamente el orden en la fracción.
  El primero nombrado va al numerador (arriba), y el segundo al denominador (abajo).'
definiciones_clave: '- **Traducción de una razón como comparación entre cantidades**:
  Herramienta clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de una razón como comparación entre cantidades.'
ejemplo_guiado:
  enunciado: Traduce o evalúa una expresión aplicando los conceptos de traducción
    de una razón como comparación entre cantidades.
  pasos:
  - Identificar la frase verbal o las variables con sus valores numéricos asignados.
  - Escribir la expresión algebraica correspondiente a traducción de una razón como
    comparación entre cantidades.
  - Sustituir los valores numéricos respetando el uso de paréntesis en números negativos.
  - Efectuar las operaciones siguiendo la jerarquía y simplificar la respuesta.
