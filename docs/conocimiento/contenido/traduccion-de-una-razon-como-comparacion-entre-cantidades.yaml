resumen_inicial: La traducción de una razón como comparación entre cantidades en lenguaje
  algebraico vincula enunciados verbales con expresiones matemáticas precisas.
explicacion_simple: Para expresar una razón como comparación entre cantidades, identificamos
  las letras que representan los números y usamos el símbolo matemático adecuado.
explicacion_formal: 'Sea $x, y \in \mathbb{R}$. La **Traducción de Una razón como
  comparación entre cantidades** establece la asignación:


  $$\text{"la razón entre la masa m y el volumen v"} \implies m / v$$


  > **Complemento didáctico:** Esta traducción permite formalizar algebraicamente
  enunciados verbales en el dominio real.'
definiciones_clave: '- **Una razón como comparación entre cantidades**: Representación
  simbólica en lenguaje algebraico.'
propiedades_relaciones: '- **Coherencia operacional**: m / v conserva el significado
  semántico del enunciado.'
ejemplo_guiado:
  enunciado: 'Traduzca a lenguaje algebraico: ''la razón entre la masa m y el volumen
    v''.'
  pasos:
  - 'Paso 1: Identificar las cantidades y variables.'
  - 'Paso 2: Aplicar la operación correspondiente.'
  - 'Conclusión: La expresión exacta es m / v.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la representación algebraica de 'la razón entre la masa m y el
    volumen v'?
  choices:
  - text: m / v
    is_correct: true
  - text: m * v
    is_correct: false
  - text: m + v
    is_correct: false
  - text: m - v
    is_correct: false
  explanation: La alternativa correcta es 'm / v'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'la razón entre la masa m y el volumen v', ¿cuál
    fue la expresión obtenida?
  choices:
  - text: m / v
    is_correct: true
  - text: m * v
    is_correct: false
  - text: m + v
    is_correct: false
  - text: m - v
    is_correct: false
  explanation: La alternativa correcta es 'm / v'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado identificando variables.'
- 'Paso 2: Escribir los operadores correspondientes.'
- 'Paso 3: Verificar el resultado.'
errores_correccion: '- **Error 1: Invertir términos al traducir una razón como comparación
  entre cantidades.** **Cómo corregirlo:** Mantener el orden sintáctico adecuado de
  los operandos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se expresa algebraicamente 'la razón entre la masa m y el volumen
    v'?
  alternativas:
  - m / v
  - m * v
  - m + v
  - m - v
  respuesta: m / v
  solucion_pasos:
  - 1. Analizar las variables.
  - 2. Traducir al símbolo m / v.
- titulo: Ejemplo 2
  enunciado: ¿Qué expresión traduce de forma correcta el enunciado de una razón como
    comparación entre cantidades 'la razón entre la masa m y el volumen v'?
  alternativas:
  - m / v
  - m * v
  - m + v
  - m - v
  respuesta: m / v
  solucion_pasos:
  - 1. Revisar la operación principal.
  - 2. Confirmar que la opción correcta es m / v.
- titulo: ¿Representa m / v el enunciado 'la razón entre la masa m y el volumen v'?
  respuesta: Sí
  solucion_pasos:
  - Sí, coincide exactamente con el enunciado verbal.
- titulo: ¿Es la suma directa equivalente a m / v?
  respuesta: 'No'
  solucion_pasos:
  - No, cada operador matemático tiene un significado único.
errores_frecuentes:
- Invertir el orden de los elementos al traducir la frase de una razón como comparación
  entre cantidades.
- Multiplicar en lugar de dividir o restar según corresponda en una razón como comparación
  entre cantidades.
- Representar la adición de términos mediante la elevación a exponentes en una razón
  como comparación entre cantidades.
- Reemplazar variables por valores constantes específicos sin razón lógica.
- Omitir delimitadores de agrupamiento en expresiones compuestas de una razón como
  comparación entre cantidades.
afirmaciones_verdaderas:
- La expresión m / v representa la traducción fiel de una razón como comparación entre
  cantidades.
- Las variables permiten modelar cualquier caso en una razón como comparación entre
  cantidades.
al_terminar_debes_poder: Al terminar serás capaz de traducir enunciados sobre una
  razón como comparación entre cantidades construyendo la expresión algebraica m /
  v de manera correcta.
