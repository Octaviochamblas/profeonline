semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.RAZON_COMPARACION
resumen_inicial: 'La traducción de una razón como comparación entre cantidades consiste en expresar la relación matemática por cociente o resta entre dos magnitudes mediante la estructura proporcional $a : b$ o $\frac{a}{b}$.'
explicacion_simple: "Una **razón** en matemáticas es una forma de **comparar dos cantidades** para ver cuántas veces contiene una a la otra:\n- **Razón geométrica (la más usada)**: Compara dos números mediante una **división / fracción**:\n  - Frases verbales: *\"La razón entre $A$ y $B$\"*, *\"La relación entre las cantidades $a$ y $b$\"*, *\"$A$ es a $B$\"*.\n  - Traducción: **$\\frac{A}{B}$** (o $A : B$).\n  - Ejemplo: \"La razón entre niños ($n$) y niñas ($m$) es de 2 a 3\" $\\implies **\\frac{n}{m} = \\frac{2}{3}**$ (lo que implica que $n = 2k$ y $m = 3k$).\n- **Razón aritmética**: Compara dos números mediante una **resta**:\n  - Frases verbales: *\"La diferencia de razón entre $A$ y $B$\"*.\n  - Traducción: **$A - B$**.\n\n![Razón como Comparación entre Cantidades](/static/img/nodos/traduccion-de-una-razon-como-comparacion-entre-cantidades-intro.svg)\n"
explicacion_formal: '### Definición formal

  La **razón geométrica** es una función de comparación escalar $R: \mathbb{R} \times (\mathbb{R} \setminus \{0\}) \to \mathbb{R}$ que expresa la relación cociente entre un antecedente $a$ y un consecuente $b$:


  $$R(a, b) = \frac{a}{b} \quad \text{o bien} \quad a : b \quad (b \neq 0)$$


  donde $a$ es el antecedente y $b$ es el consecuente de la razón.


  ### Propiedad del Factor de Proporcionalidad Constante ($k$)

  Cuando una razón geométrica $\frac{a}{b}$ se iguala a un valor simplificado $\frac{p}{q}$, se deduce que las cantidades reales están parametrizadas por una constante de proporcionalidad común $k \in \mathbb{R}^+$:


  $$\frac{a}{b} = \frac{p}{q} \iff \begin{cases} a = p \cdot k \\ b = q \cdot k \end{cases}$$


  ### Síntesis didáctica

  La razón es la base de las proporciones, escalas en mapas, velocidades relativas y semejanza de figuras en geometría.

  '
definiciones_clave: '- **Razón geométrica**: Comparación por cociente $\frac{a}{b}$ entre un antecedente $a$ y un consecuente $b$.

  - **Antecedente ($a$)**: Primera cantidad comparada que se ubica en el numerador.

  - **Consecuente ($b$)**: Segunda cantidad comparada que se ubica en el denominador.

  - **Constante de proporcionalidad ($k$)**: Factor multiplicativo común que relaciona los valores reales con los términos de la razón simplificada.

  '
propiedades_relaciones: '- **Invarianza por amplificación**: Multiplicar el antecedente y consecuente por una constante $k \neq 0$ no altera la razón ($\frac{a \cdot k}{b \cdot k} = \frac{a}{b}$).

  - **Proporción**: Igualdad formal entre dos razones equivalentes ($\frac{a}{b} = \frac{c}{d}$).

  '
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "La razón entre la masa de un cuerpo $m$ y su volumen $V$ equivale a la densidad $d$".'
  pasos:
  - 'Paso 1: Identificamos el antecedente (1.er término): "La masa $m$".'
  - 'Paso 2: Identificamos el consecuente (2.º término): "El volumen $V$".'
  - 'Paso 3: Formamos la razón por cociente: $\frac{m}{V}$.'
  - 'Paso 4: Igualamos a la constante "densidad $d$": $\frac{m}{V} = d$.'
  - 'Conclusión: La expresión algebraica traducida es **$\frac{m}{V} = d$**.'
  imagen: /static/img/nodos/traduccion-de-una-razon-como-comparacion-entre-cantidades-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: En la traducción de la frase "La razón entre $x$ e $y$ es de 4 a 5", ¿qué relación parametrizada por la constante $k$ se establece para cada variable?
  choices:
  - text: Se establece la fracción $\frac{x}{y} = \frac{4}{5}$, lo que significa que $x = 4k$ e $y = 5k$
    is_correct: true
  - text: Se establece que $x = 4 + k$ e $y = 5 + k$
    is_correct: false
  - text: Se establece que $x + y = 9k$
    is_correct: false
  - text: Se establece la multiplicación $x \cdot y = 20k$
    is_correct: false
  explanation: La alternativa correcta es 'Se establece la fracción $\frac{x}{y} = \frac{4}{5}$, lo que significa que $x = 4k$ e $y = 5k$'. Razón parametrizada con constante $k$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se llaman los términos $a$ y $b$ en la estructura algebraica de la razón $\frac{a}{b}$?
  choices:
  - text: $a$ se denomina antecedente e $y$ (o $b$) se denomina consecuente
    is_correct: true
  - text: $a$ se denomina dividendo e $y$ (o $b$) se denomina residuo
    is_correct: false
  - text: $a$ se denomina potencia e $y$ (o $b$) se denomina base
    is_correct: false
  - text: $a$ se denomina minuendo e $y$ (o $b$) se denomina sustraendo
    is_correct: false
  explanation: La alternativa correcta es '$a$ se denomina antecedente e $y$ (o $b$) se denomina consecuente'. Nomenclatura formal de una razón.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las dos cantidades que se comparan en el enunciado verbal.'
- 'Paso 2: Reconocer la primera cantidad expresada como el antecedente y la segunda como el consecuente.'
- 'Paso 3: Escribir la estructura fraccionaria $\frac{\text{Antecedente}}{\text{Consecuente}}$ o los dos puntos $\text{Antecedente} : \text{Consecuente}$.'
- 'Paso 4: Si se proporciona una razón numérica simplificada $\frac{p}{q}$, parametrizar las variables como $p \cdot k$ y $q \cdot k$.'
errores_correccion: '- **Error 1:** Invertir la posición del antecedente y el consecuente al escribir la razón (poner el consecuente arriba). **Cómo corregirlo:** La primera cantidad mencionada en "la razón entre A y B" **va SIEMPRE en el numerador $A$ ($\frac{A}{B}$)**.

  - **Error 2:** Sumar la constante de proporcionalidad $k$ en lugar de multiplicarla ($4+k$ en vez de $4k$). **Cómo corregirlo:** Las cantidades de una razón geométrica **se multiplican por la constante $k$ ($4k, 5k$)**.

  '
ejemplos:
- titulo: Razón directa
  enunciado: ¿Cuál es la traducción de "La razón entre el precio $p$ y la cantidad $q$"?
  alternativas:
  - $\frac{p}{q}$
  - $\frac{q}{p}$
  - $p \cdot q$
  respuesta: $\frac{p}{q}$
  solucion_pasos:
  - '1. Antecedente: $p$. Consecuente: $q$.'
  - '2. Razón: $\frac{p}{q}$.'
- titulo: Parametrización con k
  enunciado: 'Si dos números $a$ y $b$ están en la razón $3 : 7$, ¿podemos expresarlos como $a = 3k$ y $b = 7k$?'
  alternativas:
  - Sí, $k$ es la constante de proporcionalidad
  - No, deben expresarse como $3+k$ y $7+k$
  - No, $a=3$ y $b=7$ obligatoriamente
  respuesta: Sí, $k$ es la constante de proporcionalidad
  solucion_pasos:
  - 1. $\frac{a}{b} = \frac{3}{7}$.
  - '2. Despejando con constante $k$: $a = 3k, b = 7k$.'
- titulo: Razón de 1 a 1
  enunciado: 'Si dos cantidades $x$ e $y$ están en la razón $1 : 1$, ¿significa que $x = y$?'
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{x}{y} = 1 \implies x = y$.
- titulo: Frase es a
  enunciado: La frase "La cantidad $A$ es a la cantidad $B$", ¿se traduce como $\frac{A}{B}$?
  respuesta: Sí
  solucion_pasos:
  - Sí, "A es a B" es la locución verbal tradicional para una razón.
errores_frecuentes:
- Invertir la posición del antecedente y consecuente ubicando a B en el numerador al traducir la razón entre A y B.
- Sumar la constante de proporcionalidad k en lugar de multiplicarla por los términos de la razón.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Representar la razón geométrica por cociente como una suma de cantidades.
- La constante de proporcionalidad k no se incluye al resolver problemas de sistemas basados en razones.
afirmaciones_verdaderas:
- La traducción de una razón geométrica entre dos cantidades se expresa como el cociente entre el antecedente y el consecuente.
- La parametrización de una razón a:b como ak y bk permite resolver problemas mediante ecuaciones con constante de proporcionalidad k.
al_terminar_debes_poder: '![Resumen de razón como comparación](/static/img/nodos/traduccion-de-una-razon-como-comparacion-entre-cantidades-resumen.svg)


  QUÉ: Traducir una razón geométrica como comparación relativa por cociente entre dos magnitudes.


  CÓMO: Formular la igualdad $\frac{a}{b} = \frac{p}{q}$ y parametrizar las magnitudes respecto a una constante de proporcionalidad $k$ ($a = pk, \; b = qk$).'
