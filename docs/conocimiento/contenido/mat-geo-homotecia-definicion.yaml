semantic_id: MAT.GEO.HOMOTECIA.DEFINICION
resumen_inicial: 'Definición de homotecia como transformación determinada por un centro
  y una razón: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia,
  Semejanza y Homotecia.'
explicacion_simple: 'Existe una transformación geométrica especial que produce figuras
  semejantes a la original, ampliándolas o reduciéndolas desde un punto fijo: la homotecia.'
explicacion_formal: '![Definición de homotecia](/static/img/geometria/congruencia-semejanza/homotecia-definicion.svg)


  ### Definición formal


  Una homotecia de centro $O$ y razón $k$ (con $k\neq0$) es la transformación que
  envía cada punto $P$ al punto $P''=O+k(P-O)$.


  ### Desarrollo didáctico


  A diferencia de otras transformaciones (como traslaciones o rotaciones), la homotecia
  SÍ cambia el tamaño de la figura (salvo que $k=\pm1$), mientras conserva su forma:
  la figura imagen es siempre semejante a la original.'
definiciones_clave: '- **Definición de homotecia como transformación determinada por
  un centro y una razón**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a definición de homotecia como transformación
  determinada por un centro y una razón.'
ejemplo_guiado:
  enunciado: En la aplicación de definición de homotecia como transformación determinada
    por un centro y una razón, se establece una razón $k = 3.6$ entre dos figuras
    homólogas de longitud original $L = 20\text{ cm}$. Calcula la longitud transformada
    $L'$.
  pasos:
  - Aplicar el criterio o teorema de definición de homotecia como transformación determinada
    por un centro y una razón.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 3.6 \cdot 20$.'
  - Concluir que la medida obtenida en definición de homotecia como transformación
    determinada por un centro y una razón es $L' = 72.0\text{ cm}$.
