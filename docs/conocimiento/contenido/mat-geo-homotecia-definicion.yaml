procedimiento:
- 'Paso 1: Identifica el centro de homotecia O y la razón k dados.'
- 'Paso 2: Para cada punto P de la figura original, traza la recta que pasa por O
  y P.'
- 'Paso 3: Ubica el punto imagen P'' sobre esa recta, a una distancia k veces OP desde
  O.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con definición de homotecia como transformación determinada
  por un centro y una razón.
