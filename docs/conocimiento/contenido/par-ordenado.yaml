semantic_id: MAT.FUND.PRODUCTO_CARTESIANO.PAR_ORDENADO
resumen_inicial: Definición, formalización de Kuratowski, componentes (primera y segunda coordenada) y asimetría del par ordenado $(a, b)$.
explicacion_simple: 'Un **par ordenado** es una pareja de dos elementos colocados entre paréntesis redondos y separados por una coma: **$(a, b)$**, donde **el orden importa estrictamente**. El primer elemento $a$ se llama **primera componente** (o abscisa) y el segundo elemento $b$ se llama **segunda componente** (o ordenada). A diferencia de un conjunto con llaves donde $\{1, 2\} = \{2, 1\}$, en los pares ordenados **$(1, 2) \neq (2, 1)$**. Por ejemplo, en un mapa o en un videojuego, la coordenada $(3, 5)$ no es la misma ubicación que $(5, 3)$.


  ![Par ordenado](/static/img/nodos/par-ordenado-intro.svg)'
explicacion_formal: '### Definición formal

  En la teoría axiomática de conjuntos ($\text{ZFC}$), el **par ordenado** se define canónicamente mediante la **construcción de Kuratowski (1921)**:

  $$(a, b) = \{\{a\}, \{a, b\}\}$$

  Esta definición reduce la noción primitiva de orden espacial a la pertenencia de conjuntos puros, satisfaciendo la **Propiedad Fundamental del Par Ordenado**:

  $$(a, b) = (c, d) \quad \iff \quad (a = c \land b = d)$$


  ### Desglose simbólico

  - Primera componente (proyección $\pi_1$): $\pi_1(a, b) = a$.

  - Segunda componente (proyección $\pi_2$): $\pi_2(a, b) = b$.

  - Asimetría fundamental: $a \neq b \implies (a, b) \neq (b, a)$.

  - Par reflexivo: $(a, a) = \{\{a\}, \{a, a\}\} = \{\{a\}\}$.


  > **Complemento didáctico:** El par ordenado transforma dos objetos no orientados en una entidad direccional estructurada, sirviendo de fundamento para relaciones, funciones y geometría analítica.

  '
definiciones_clave: '- **Par ordenado ($(a, b)$)**: Objeto matemático constituido por dos componentes dispuestas en un orden posicional estricto.

  - **Construcción de Kuratowski**: Representación formal $\{\{a\}, \{a, b\}\}$ en la teoría de conjuntos.

  - **Proyecciones canónicas**: Funciones $\pi_1(a, b) = a$ y $\pi_2(a, b) = b$.

  '
propiedades_relaciones: '- **Diferenciación con conjuntos no ordenados**: $\{a, b\} = \{b, a\}$, pero $(a, b) \neq (b, a)$ si $a \neq b$.

  - **Generalización a $n$-tuplas**: $(a_1, a_2, \dots, a_n) = ((a_1, \dots, a_{n-1}), a_n)$.

  '
ejemplo_guiado:
  enunciado: 'Dado el par ordenado $P = (3, 7)$, identifica sus componentes, construye su representación formal de Kuratowski y determina si es igual al par $Q = (7, 3)$.


    ![Ejemplo Par ordenado](/static/img/nodos/par-ordenado-ejemplos.svg)'
  pasos:
  - 'Paso 1: Identificar las componentes del par $P = (3, 7)$: - Primera componente: $a = 3$. - Segunda componente: $b = 7$.'
  - 'Paso 2: Construir la representación de Kuratowski para $P$: - $(3, 7) = \{\{3\}, \{3, 7\}\}$.'
  - 'Paso 3: Construir la representación de Kuratowski para $Q = (7, 3)$: - $(7, 3) = \{\{7\}, \{7, 3\}\}$.'
  - 'Paso 4: Comparar ambos conjuntos: - En $P$, el conjunto unitario es $\{3\}$; en $Q$, el conjunto unitario es $\{7\}$. - Como $\{3\} \neq \{7\}$, se concluye que $\{\{3\}, \{3, 7\}\} \neq \{\{7\}, \{7, 3\}\}$.'
  - 'Paso 5: Concluir que $(3, 7) \neq (7, 3)$, demostrando la asimetría posicional del par ordenado.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la definición formal de par ordenado $(a, b)$ según la construcción axiomática de Kuratowski?
  choices:
  - text: $(a, b) = \{\{a\}, \{a, b\}\}$
    is_correct: true
  - text: $(a, b) = \{a, b\}$
    is_correct: false
  - text: $(a, b) = \{a\} \cup \{b\}$
    is_correct: false
  - text: $(a, b) = (a + b, a - b)$
    is_correct: false
  explanation: La alternativa correcta es '$(a, b) = \{\{a\}, \{a, b\}\}$'. Es la definición canónica de Kuratowski que permite distinguir el primer elemento.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $a \neq b$, ¿cuál es la relación correcta entre el par ordenado $(a, b)$ y el par ordenado $(b, a)$?
  choices:
  - text: $(a, b) \neq (b, a)$
    is_correct: true
  - text: $(a, b) = (b, a)$
    is_correct: false
  - text: $(a, b) \subseteq (b, a)$
    is_correct: false
  - text: $(a, b) = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$(a, b) \neq (b, a)$'. El orden de las componentes es determinante en un par ordenado.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la primera componente $a$ y la segunda componente $b$ dentro de los paréntesis redondos $(a, b)$.'
- 'Paso 2: Respetar rigurosamente la posición de cada elemento.'
- 'Paso 3: Si se requiere expresar formalmente en ZFC, aplicar la estructura $\{\{a\}, \{a, b\}\}$.'
- 'Paso 4: Comparar pares verificando la igualdad componente a componente.'
errores_correccion: '- **Error 1:** Usar llaves $\{a, b\}$ para representar un par ordenado. **Cómo corregirlo:** Las llaves definen un conjunto sin orden ($\{a, b\} = \{b, a\}$); los pares ordenados deben escribirse con paréntesis redondos: $(a, b)$.

  - **Error 2:** Creer que $(a, b) = (b, a)$ cuando $a \neq b$. **Cómo corregirlo:** En un par ordenado la posición $1$ y la posición $2$ son asimétricas y distintas.

  '
ejemplos:
- titulo: Identificación de componentes
  enunciado: ¿Cuáles son las componentes del par $(-4, 9)$?
  alternativas:
  - 'Primera: -4, Segunda: 9'
  - 'Primera: 9, Segunda: -4'
  - Conjunto {-4, 9}
  respuesta: 'Primera: -4, Segunda: 9'
  solucion_pasos:
  - 1. La primera componente es la que precede a la coma (-4) y la segunda la que le sigue (9).
- titulo: Par con elementos iguales
  enunciado: ¿A qué es igual la forma de Kuratowski para $(5, 5)$?
  respuesta: $\{\{5\}\}$
  solucion_pasos:
  - $\{\{5\}, \{5, 5\}\} = \{\{5\}, \{5\}\} = \{\{5\}\}$.
  alternativas:
  - texto: $\{\{5\}\}$
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple exactamente con la definición y propiedades del producto cartesiano.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y emparejamiento cartesiano genera un valor exacto y determinado.
  - texto: No se puede determinar
    es_correcta: false
    retroalimentacion: Incorrecto, los elementos y dimensiones provistos son suficientes para resolverlo.
