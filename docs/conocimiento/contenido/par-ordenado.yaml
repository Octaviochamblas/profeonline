errores_frecuentes:
- La afirmación de que el par ordenado $(a, b)$ es idéntico al conjunto no ordenado $\{a, b\}$.
- La afirmación de que el orden de los elementos en un par ordenado no altera su identidad matemática.
- La afirmación de que el par $(3, 8)$ y el par $(8, 3)$ representan el mismo punto en el plano cartesiano.
- La afirmación de que un par ordenado no puede tener sus dos componentes iguales ($(a, a)$).
- La afirmación de que la notación de corchetes $[a, b]$ es la forma estándar de escribir un par ordenado discreto.
afirmaciones_verdaderas:
- Un par ordenado $(a, b)$ es una estructura posicional donde el orden de los elementos es estricto y asimétrico cuando $a \neq b$.
- La construcción axiomática de Kuratowski define formalmente el par ordenado como el conjunto $\{\{a\}, \{a, b\}\}$.
al_terminar_debes_poder: 'QUÉ: Definir, identificar y construir pares ordenados $(a, b)$.

  CÓMO: Reconocer la primera y segunda componente, aplicar la definición de Kuratowski $\{\{a\}, \{a, b\}\}$ y distinguirlos de conjuntos no ordenados.


