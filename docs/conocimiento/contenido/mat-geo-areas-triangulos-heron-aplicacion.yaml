semantic_id: MAT.GEO.AREAS_TRIANGULOS.HERON_APLICACION
resumen_inicial: 'Cálculo del área de un triángulo usando la fórmula de Herón dados
  los tres lados: conceptos, teoremas, propiedades geométricas y cálculo en Perímetros,
  Áreas y Teoremas.'
explicacion_simple: Con los tres lados de un triángulo y la fórmula de Herón, calcular
  el área es solo cuestión de seguir un procedimiento ordenado, sin necesitar la altura.
explicacion_formal: '![Aplicación de la fórmula de Herón](/static/img/geometria/areas-pitagoras/areas-triangulos-heron-aplicacion.svg)


  ### Definición formal


  Para un triángulo de lados $a$, $b$, $c$, se calcula $s=\frac{a+b+c}{2}$ y luego
  se evalúa

  $A=\sqrt{s(s-a)(s-b)(s-c)}$.


  ### Desarrollo didáctico


  Por ejemplo, para un triángulo de lados 5, 6 y 7: el semiperímetro es $s=9$, por
  lo que

  $A=\sqrt{9(9-5)(9-6)(9-7)}=\sqrt{9\cdot 4\cdot 3\cdot 2}=\sqrt{216}\approx 14{,}7$.'
definiciones_clave: '- **Cálculo del área de un triángulo usando la fórmula de Herón
  dados los tres lados**: Elemento o propiedad fundamental en el estudio de perímetros,
  áreas y teoremas.'
