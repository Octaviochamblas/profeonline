procedimiento:
- 'Paso 1: Identifica las coordenadas de todos los vértices de la figura original.'
- 'Paso 2: Aplica el vector traslación a cada vértice por separado, sumando sus componentes.'
- 'Paso 3: Conecta los vértices imagen en el mismo orden que en la figura original,
  obteniendo la figura trasladada completa.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con procedimiento de traslación de figuras en el plano.
