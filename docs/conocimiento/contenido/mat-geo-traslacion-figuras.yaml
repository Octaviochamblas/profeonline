semantic_id: MAT.GEO.ISOMETRIA_TRASLACION.TRASLACION_FIGURAS
resumen_inicial: 'Procedimiento de traslación de figuras en el plano: conceptos, teoremas,
  propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: Trasladar una figura completa es simplemente trasladar cada uno
  de sus vértices por separado, todos con el mismo vector.
explicacion_formal: '![Procedimiento de traslación de figuras](/static/img/geometria/isometrias/traslacion-figuras.svg)


  ### Definición formal


  Para trasladar un polígono con vértices $P_1,P_2,\ldots,P_n$ mediante un vector
  $\vec{v}=(a,b)$, se calcula la imagen $P_i''(x_i+a,\,y_i+b)$ de cada vértice, y
  se conectan los vértices imagen respetando el mismo orden que en la figura original.


  ### Desarrollo didáctico


  En la figura, el triángulo original y su imagen están unidos por segmentos paralelos
  (líneas punteadas), todos con la misma longitud y dirección, ya que cada vértice
  se trasladó con el mismo vector.'
definiciones_clave: '- **Procedimiento de traslación de figuras en el plano**: Elemento
  o propiedad fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a procedimiento de traslación de figuras en
  el plano.'
