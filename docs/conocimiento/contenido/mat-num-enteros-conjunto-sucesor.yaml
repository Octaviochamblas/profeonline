semantic_id: MAT.NUM.ENTEROS_CONJUNTO.SUCESOR
resumen_inicial: 'El sucesor de un entero $n$ es el número inmediatamente siguiente a su derecha: $S(n) = n + 1$.'
explicacion_simple: 'El sucesor de un número entero es el número consecutivo que se encuentra ubicado inmediatamente a su derecha en la recta numérica. Para hallarlo, simplemente sumamos una unidad ($n + 1$), sin importar si el número original es positivo, negativo o cero.


  ![Concepto de sucesor de un número (n + 1)](/static/img/nodos/concepto-de-sucesor-de-un-numero-n-1-intro.svg)'
explicacion_formal: 'Dado un número entero $n \in \mathbb{Z}$, la **Función Sucesor** $S: \mathbb{Z} \to \mathbb{Z}$ se define algebraicamente como:


  $$S(n) = n + 1$$


  **Desglose de la fórmula:**

  - $S(n)$: Valor entero del sucesor inmediato de $n$.

  - $+ 1$: Adición de una unidad discreta en el sentido positivo de la recta orientada.

  - $\forall n \in \mathbb{Z}, \quad S(n) > n$ (el sucesor es estrictamente mayor que el número original).


  > **Complemento didáctico:** En los enteros negativos, sumar 1 acerca el resultado al cero (ej: el sucesor de $-5$ es $-4$).'
definiciones_clave: '- **Sucesor**: Entero contiguo $n+1$ ubicado inmediatamente a la derecha de $n$ en la recta numérica.

  - **Consecutivo posterior**: Término que sigue inmediatamente en el orden de conteo.'
propiedades_relaciones: '- **Orden estricto**: $S(n) > n$ para todo entero $n \in \mathbb{Z}$.'
ejemplo_guiado:
  enunciado: 'Calcule el sucesor del número entero negativo $-9$ aplicando la fórmula $n + 1$.


    ![Ejemplo Concepto de sucesor de un número (n + 1)](/static/img/nodos/concepto-de-sucesor-de-un-numero-n-1-ejemplos.svg)'
  pasos:
  - 'Paso 1: Tomar el número dado: $n = -9$.'
  - 'Paso 2: Sumar una unidad: $S(-9) = -9 + 1$.'
  - 'Paso 3: Resolver la suma de enteros: $-9 + 1 = -8$.'
  - 'Conclusión: El sucesor de $-9$ es $-8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el sucesor del número entero -5?
  choices:
  - text: '-4'
    is_correct: true
  - text: '-6'
    is_correct: false
  - text: '5'
    is_correct: false
  - text: '-5'
    is_correct: false
  explanation: La alternativa correcta es '-4', calculando $-5 + 1 = -4$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué el sucesor de -9 es -8 y no -10?
  choices:
  - text: Porque para hallar el sucesor se suma 1, desplazándose a la derecha (-9 + 1 = -8)
    is_correct: true
  - text: Porque se resta 1 al número
    is_correct: false
  - text: Es un error del texto, debería ser -10
    is_correct: false
  - text: Porque se multiplica por -1
    is_correct: false
  explanation: La alternativa correcta es 'Porque para hallar el sucesor se suma 1, desplazándose a la derecha (-9 + 1 = -8)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el número entero base $n$.'
- 'Paso 2: Sumar 1 unidad a dicha cantidad ($n + 1$).'
- 'Paso 3: Resolver la operación respetando las reglas de signos.'
errores_correccion: '- **Error 1: Creer que el sucesor de $-5$ es $-6$.** **Cómo corregirlo:** El sucesor avanza a la derecha sumando 1: $-5 + 1 = -4$.


  - **Error 2: Confundir el sucesor ($n+1$) con el doble de un número ($2n$).** **Cómo corregirlo:** El sucesor añade una unidad ($n+1$), no multiplica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el sucesor del entero 0?
  alternativas:
  - '1'
  - '-1'
  - '0'
  respuesta: '1'
  solucion_pasos:
  - $0 + 1 = 1$.
- titulo: Ejemplo 2
  enunciado: Calcule el sucesor del sucesor de $-4$.
  alternativas:
  - '-2'
  - '-3'
  - '-6'
  respuesta: '-2'
  solucion_pasos:
  - Sucesor de $-4$ es $-3$; sucesor de $-3$ es $-2$.
- titulo: ¿El sucesor de -1 es el número 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-1 + 1 = 0$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
- titulo: ¿Es el sucesor de un entero negativo siempre menor que el número original?
  respuesta: 'No'
  solucion_pasos:
  - No, el sucesor es siempre mayor que el número original ($S(n) > n$).
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple con la definición formal y propiedades de los números enteros.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo y propiedades algebraicas en ℤ dan un resultado determinado.
  - texto: No pertenece al conjunto ℤ
    es_correcta: false
    retroalimentacion: Incorrecto, el valor obtenido es un elemento perfectamente definido en los enteros.
errores_frecuentes:
- El sucesor del número entero $-10$ es el número entero $-11$.
- El número cero carece de un sucesor en el conjunto de los números enteros $\mathbb{Z}$.
- El sucesor de un número entero es siempre menor que el número original.
- El sucesor de un número par es obligatoriamente otro número par.
- Para obtener el sucesor de un número entero se debe multiplicar la cantidad por 2.
afirmaciones_verdaderas:
- El sucesor de cualquier número entero $n$ se obtiene sumando una unidad ($n + 1$).
- El sucesor de un número en la recta numérica se encuentra ubicado inmediatamente a su derecha.
al_terminar_debes_poder: '**QUÉ:** Calcular e interpretar el sucesor de cualquier número entero $n \in \mathbb{Z}$.


  **CÓMO:** Aplicando la fórmula $\text{suc}(n) = n + 1$, desplazándose un salto a la derecha y evitando errores en enteros negativos.


  ![Resumen Concepto de sucesor de un número (n + 1)](/static/img/nodos/concepto-de-sucesor-de-un-numero-n-1-resumen.svg)'
