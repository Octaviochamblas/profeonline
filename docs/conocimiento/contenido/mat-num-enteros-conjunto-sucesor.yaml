semantic_id: MAT.NUM.ENTEROS_CONJUNTO.SUCESOR
resumen_inicial: "El sucesor de un entero $n$ es el número que viene justo después, calculado como $n+1$: un paso a la derecha en la recta numérica."
explicacion_simple: |
  El sucesor de un número es simplemente el número que viene justo después. El sucesor de 4 es 5.
  El sucesor de -3 es -2. El sucesor de 0 es 1. Es como dar un paso a la derecha en la recta
  numérica. Todo número entero tiene un sucesor, sin excepción.
explicacion_formal: |
  El sucesor de un entero $n$ se define como $\text{sucesor}(n) = n + 1$: el número exactamente una
  unidad a su derecha en la recta numérica. Como $\mathbb{Z}$ es infinito a la derecha, todo entero
  tiene un sucesor único.
definiciones_clave: |
  **Sucesor**: el número inmediatamente siguiente a $n$, calculado como $n+1$. **Enteros
  consecutivos**: dos enteros donde uno es sucesor del otro.
propiedades_relaciones: |
  El sucesor de un negativo tiene menor valor absoluto que el número original (ej. sucesor de $-12$
  es $-11$). El sucesor no debe confundirse con "un número mayor": hay infinitos números mayores,
  pero solo un sucesor inmediato.
ejemplo_guiado:
  enunciado: "¿Cuál es el sucesor de $-8$?"
  pasos:
    - "Tomar el número inicial: $-8$."
    - "Aplicar la fórmula: $-8 + 1 = -7$."
    - "El sucesor de $-8$ es $-7$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál es la fórmula correcta para calcular el sucesor de un entero $n$?"
    choices:
      - {text: "$n - 1$", is_correct: false}
      - {text: "$n + 1$", is_correct: true}
      - {text: "$2n$", is_correct: false}
      - {text: "$-n$", is_correct: false}
    explanation: "La correcta es $n + 1$: el sucesor siempre se obtiene sumando una unidad al número."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el sucesor de $-15$?"
    choices:
      - {text: "$-16$", is_correct: false}
      - {text: "$-14$", is_correct: true}
      - {text: "$15$", is_correct: false}
      - {text: "$-15$", is_correct: false}
    explanation: "La correcta es $-14$, porque $-15 + 1 = -14$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el número entero inicial $n$."
  - "Paso 2: Sumar algebraicamente $1$ unidad al número dado ($n + 1$)."
  - "Paso 3: Ubicar el resultado en la recta numérica para verificar que se encuentra inmediatamente a la derecha."
errores_correccion: |
  Un error frecuente es pensar que el sucesor de un negativo es otro negativo de mayor valor
  absoluto: en realidad el sucesor siempre está más a la derecha, así que su valor absoluto
  disminuye o cambia de signo. Otro error es creer que el cero no tiene sucesor; su sucesor es $1$,
  igual que cualquier otro entero.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál es el sucesor de $-1$?"
    alternativas:
      - "$0$"
      - "$-2$"
      - "$1$"
    respuesta: "$0$"
    solucion_pasos:
      - "Tomar el número inicial: $-1$."
      - "Aplicar la fórmula: $-1 + 1 = 0$."
      - "Resultado: El sucesor de $-1$ es $0$."
  - titulo: "Ejemplo 2"
    enunciado: "Si $P + 3$ es el sucesor de $10$, ¿cuál es el valor de $P$?"
    alternativas:
      - "$P = 8$"
      - "$P = 11$"
      - "$P = 14$"
    respuesta: "$P = 8$"
    solucion_pasos:
      - "Identificar el sucesor de $10$: $10 + 1 = 11$."
      - "Plantear la ecuación: $P + 3 = 11$."
      - "Resolver para $P$: $P = 11 - 3 = 8$."
      - "Resultado: $P = 8$."
  - titulo: "¿Es $-4$ el sucesor de $-5$?"
    respuesta: "Sí"
    solucion_pasos:
      - "Aplicar la fórmula: sucesor de $-5$ es $-5 + 1 = -4$."
      - "$-4$ se ubica exactamente una unidad a la derecha de $-5$ en la recta numérica."
      - "Por lo tanto, $-4$ sí es el sucesor de $-5$."
  - titulo: '¿Tiene el número $1000$ un sucesor en $\mathbb{Z}$?'
    respuesta: "Sí"
    solucion_pasos:
      - 'El conjunto $\mathbb{Z}$ es infinito a la derecha: siempre existe un número mayor.'
      - "El sucesor de $1000$ es $1000 + 1 = 1001$."
      - 'Por lo tanto, $1000$ sí tiene sucesor en $\mathbb{Z}$.'
errores_frecuentes:
  - "El sucesor de un número negativo es siempre otro número negativo de mayor valor absoluto."
  - "El sucesor de $0$ no existe porque el cero no tiene siguiente."
  - "El sucesor de $-1$ es $-2$ porque los negativos 'crecen' hacia el lado negativo."
  - "Un número puede tener más de un sucesor."
  - "Sumar $1$ al valor absoluto de un negativo da su sucesor."
afirmaciones_verdaderas:
  - "El sucesor de 7 es 8."
  - "Para hallar el sucesor de un número, se suma 1."
al_terminar_debes_poder: |
  Calcular el sucesor de cualquier entero (positivo, negativo o cero) aplicando $n+1$, y explicar
  por qué todo entero tiene exactamente un sucesor.

fuente: "Matemática 7º Básico Tomo 1 p.145"
estado: publicado
