semantic_id: MAT.ALG.FRACCIONES_RESTA.SIMPLIFICACION_FINAL
resumen_inicial: Una vez reducido el numerador de la resta, se intenta factorizar para simplificar factores comunes con el denominador.
explicacion_simple: |
  Tras restar los numeradores amplificados y reducir los términos semejantes, el paso final consiste en verificar si el resultado se puede simplificar aún más.

  Factorizamos el polinomio resultante en el numerador utilizando factor común, diferencia de cuadrados o trinomios.

  Si comparte algún factor con el denominador común m.c.m., los cancelamos para presentar la resta de fracciones en su forma irreducible más simple.
explicacion_formal: |
  ### Definición formal
  Dada la resta reducida $\frac{N(x)}{M(x)}$, se factorizan numerador y denominador $N(x) = P(x) \cdot C(x)$ y $M(x) = Q(x) \cdot C(x)$:

  $$\frac{N(x)}{M(x)} = \frac{P(x) \cdot C(x)}{Q(x) \cdot C(x)} = \frac{P(x)}{Q(x)} \quad \text{para } C(x) \neq 0$$

  ### Desglose de la fórmula
  - $C(x)$: Factor común cancelable entre el numerador sustraído reducido $N(x)$ y el m.c.m. $M(x)$.
  - $\frac{P(x)}{Q(x)}$: Fracción resta irreducible final.

  ### Síntesis didáctica
  La simplificación final posterior a la sustracción requiere la factorización del numerador para eliminar factores compartidos con el denominador.
definiciones_clave: |
  - **Simplificación final de resta**: Cancelación de factores comunes entre el numerador sustraído reducido y el denominador común.
propiedades_relaciones: |
  - **Irreductibilidad**: $\operatorname{MCD}(P(x), Q(x)) = 1$.
  - **Preservación de dominio**: Las restricciones del dominio original aplican también a los factores cancelados en la sustracción.
ejemplo_guiado:
  enunciado: 'Resuelve la resta $\frac{x^2}{x - 3} - \frac{9}{x - 3}$, factoriza el numerador, simplifica la fracción y evalúa para $x = 7$.'
  pasos:
    - 'Paso 1: Conservar el denominador común $(x - 3)$: $\frac{x^2 - 9}{x - 3}$.'
    - 'Paso 2: Factorizar el numerador por diferencia de cuadrados: $x^2 - 9 = (x - 3)(x + 3)$.'
    - 'Paso 3: Sustituir y cancelar $(x - 3)$: $\frac{(x - 3)(x + 3)}{x - 3} = x + 3$ para $x \neq 3$.'
    - 'Paso 4: Evaluar para $x = 7$: $7 + 3 = 10$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la expresión reducida simplificada de $\frac{x^2}{x - 3} - \frac{9}{x - 3}$?'
    choices:
      - {text: '$x + 3$', is_correct: true}
      - {text: '$x - 3$', is_correct: false}
      - {text: '$\frac{x + 3}{x - 3}$', is_correct: false}
      - {text: '$x^2 - 9$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x + 3$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al evaluar la resta simplificada $x + 3$ para $x = 7$, ¿cuál es el resultado?'
    choices:
      - {text: '$10$', is_correct: true}
      - {text: '$4$', is_correct: false}
      - {text: '$14$', is_correct: false}
      - {text: '$21$', is_correct: false}
    explanation: 'La alternativa correcta es ''$10$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Restar numeradores sobre el denominador común m.c.m.'
  - 'Paso 2: Reducir los términos semejantes en el numerador unificado.'
  - 'Paso 3: Factorizar completamente el numerador resultante.'
  - 'Paso 4: Cancelar factores comunes entre el numerador y el denominador.'
  - 'Paso 5: Escribir la expresión resta final indicando las restricciones del dominio.'
errores_correccion: |
  - **Error 1:** Dar por finalizada la resta sin haber factorizado el numerador para verificar cancelaciones (escribir $\frac{x^2 - 9}{x - 3}$ como respuesta final). **Cómo corregirlo:** Se debe **FACTORIZAR EL NUMERADOR RESULTANTE Y CANCELAR LOS FACTORES COMUNES CON EL DENOMINADOR: $(x-3)(x+3)/(x-3) = x+3$**.
  - **Error 2:** Omitir las restricciones del dominio para valores que anulan factores cancelados en la resta. **Cómo corregirlo:** Las restricciones **CONTINÚAN VIGENTES PARA MANTENER LA EQUIVALENCIA DE LA EXPRESIÓN DE LA RESTA**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál es el resultado irreducible de la resta $\frac{x}{x-2} - \frac{2}{x-2}$?'
    alternativas:
      - '$1$'
      - '$\frac{x-2}{x-2}$'
      - '$0$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. Restar: $\frac{x-2}{x-2}$.'
      - '2. Cancelar factor común $(x-2) \implies 1$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al simplificar $\frac{x^2+3x}{x(x+3)} - \frac{0}{x(x+3)}$, ¿cuál es el valor resultante?'
    alternativas:
      - '$1$'
      - '$x$'
      - '$\frac{x+3}{x}$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. Factorizar numerador: $x(x+3)$.'
      - '2. Cancelar $x(x+3)$ con el denominador: $\frac{x(x+3)}{x(x+3)} = 1$.'
  - titulo: 'Factorización final'
    enunciado: '¿Es necesario intentar factorizar el numerador sustraído reducido en la última etapa?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, permite encontrar y cancelar factores compartidos con el denominador.'
  - titulo: 'Resultado simplificado'
    enunciado: '¿Una resta de fracciones puede dar como resultado un polinomio o constante entera?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, si el denominador se cancela completamente por un factor del numerador.'
errores_frecuentes:
  - 'Entregar la fracción resta en su forma expandida no simplificada sin haber factorizado el numerador.'
  - 'Eliminar las restricciones del dominio asociadas a factores que fueron cancelados.'
  - 'Tachar sumandos individuales en el numerador final sin haberlos factorizado previamente.'
  - 'Responder 0 en lugar de 1 al simplificar completamente una resta donde numerador y denominador coinciden.'
  - 'Omitir la comprobación de irreductibilidad al finalizar la operación.'
afirmaciones_verdaderas:
  - 'La simplificación final de la resta requiere factorizar el numerador reducido para eliminar factores con el m.c.m.'
  - 'El resultado de la sustracción de fracciones algebraicas se expresa siempre en su forma irreducible equivalente.'
al_terminar_debes_poder: |
  Simplificar al mínimo el resultado de cualquier sustracción de fracciones algebraicas factorizando el numerador sustraído reducido y cancelando factores comunes con el denominador m.c.m.
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Operaciones Algebraicas.'
