procedimiento:
- 'Paso 1: Restar numeradores sobre el denominador común m.c.m.'
- 'Paso 2: Reducir los términos semejantes en el numerador unificado.'
- 'Paso 3: Factorizar completamente el polinomio resultante.'
- 'Paso 4: Cancelar factores comunes entre el numerador y el denominador.'
- 'Paso 5: Escribir la expresión resta final indicando las restricciones del dominio.'
errores_correccion: '- **Error 1:** Considerar la expresión $\frac{x^2 - 9}{x - 3}$ como resultado final. **Cómo corregirlo:**
  Factorizar el numerador resultante para cancelar factores comunes: $\frac{(x-3)(x+3)}{x-3} = x+3$.

  - **Error 2:** Omitir restricciones del dominio tras la simplificación. **Cómo corregirlo:** Mantener las restricciones
  originales incluso cuando se cancelan factores en la fracción.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado irreducible de la resta $\frac{x}{x-2} - \frac{2}{x-2}$?
  alternativas:
  - $1$
  - $\frac{x-2}{x-2}$
  - $0$
  respuesta: $1$
  solucion_pasos:
  - '1. Restar: $\frac{x-2}{x-2}$.'
  - 2. Cancelar factor común $(x-2) \implies 1$.
- titulo: Ejemplo 2
  enunciado: Al simplificar $\frac{x^2+3x}{x(x+3)} - \frac{0}{x(x+3)}$, ¿cuál es el valor resultante?
  alternativas:
  - $1$
  - $x$
  - $\frac{x+3}{x}$
  respuesta: $1$
  solucion_pasos:
  - '1. Factorizar numerador: $x(x+3)$.'
  - '2. Cancelar $x(x+3)$ con el denominador: $\frac{x(x+3)}{x(x+3)} = 1$.'
- titulo: Factorización final
  enunciado: ¿Es necesario intentar factorizar el numerador sustraído reducido en la última etapa?
  respuesta: Sí
  solucion_pasos:
  - Sí, permite encontrar y cancelar factores compartidos con el denominador.
- titulo: Resultado simplificado
  enunciado: ¿Una resta de fracciones puede dar como resultado un polinomio o constante entera?
  respuesta: Sí
  solucion_pasos:
  - Sí, si el denominador se cancela completamente por un factor del numerador.
errores_frecuentes:
- La fracción resta $\frac{x^2-9}{x-3}$ se considera irreducible en esa forma sin requerir mayor simplificación.
- Al cancelar totalmente el numerador con el denominador en $\frac{x-2}{x-2}$, el resultado obtenido es $0$.
- La cancelación del factor $(x-3)$ en $\frac{(x-3)(x+3)}{x-3}$ elimina a $x=3$ del conjunto de restricciones del dominio.
- En la resta $\frac{x^2+3x}{x(x+3)}$, se pueden cancelar términos sumandos individuales dejando $x$.
- La simplificación final de la resta permite omitir la comprobación de factores comunes entre el numerador reducido y el
  m.c.m.
afirmaciones_verdaderas:
- La simplificación final de la resta requiere factorizar el numerador reducido para eliminar factores con el m.c.m.
- El resultado de la sustracción de fracciones algebraicas se expresa siempre en su forma irreducible equivalente.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/simplificacion-final-de-una-resta-de-fracciones-algebraicas-resumen.svg)


  QUÉ: Simplificar al máximo el resultado de una sustracción de fracciones algebraicas.

  CÓMO: Factorizar el polinomio del numerador sustraído reducido y cancelar los factores comunes con el denominador m.c.m.
  ($\frac{P(x) \cdot C(x)}{Q(x) \cdot C(x)} = \frac{P(x)}{Q(x)}$) para presentar una expresión irreducible.

  '
