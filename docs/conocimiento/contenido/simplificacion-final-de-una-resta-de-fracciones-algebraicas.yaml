semantic_id: MAT.ALG.FRACCIONES_RESTA.SIMPLIFICACION_FINAL
resumen_inicial: Una vez reducido el numerador de la resta, se intenta factorizar para simplificar factores comunes con el
  denominador.
explicacion_simple: 'Tras restar los numeradores amplificados y reducir los términos semejantes, el paso final consiste en
  verificar si el resultado se puede simplificar aún más.


  Factorizamos el polinomio resultante en el numerador utilizando factor común, diferencia de cuadrados o trinomios.


  Si comparte algún factor con el denominador común m.c.m., los cancelamos para presentar la resta de fracciones en su forma
  irreducible más simple.


  ![Simplificación final de una resta de fracciones](/static/img/nodos/simplificacion-final-de-una-resta-de-fracciones-algebraicas-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la resta reducida $\frac{N(x)}{M(x)}$, se factorizan numerador y denominador $N(x) = P(x) \cdot C(x)$ y $M(x) = Q(x)
  \cdot C(x)$:


  $$\frac{N(x)}{M(x)} = \frac{P(x) \cdot C(x)}{Q(x) \cdot C(x)} = \frac{P(x)}{Q(x)} \quad \text{para } C(x) \neq 0$$


  ### Desglose de la fórmula

  - $C(x)$: Factor común cancelable entre el numerador sustraído reducido $N(x)$ y el m.c.m. $M(x)$.

  - $\frac{P(x)}{Q(x)}$: Fracción resta irreducible final.


  ### Síntesis didáctica

  La simplificación final posterior a la sustracción requiere la factorización del numerador para eliminar factores compartidos
  con el denominador.

  '
definiciones_clave: '- **Simplificación final de resta**: Cancelación de factores comunes entre el numerador sustraído reducido
  y el denominador común.

  '
propiedades_relaciones: '- **Irreductibilidad**: $\operatorname{MCD}(P(x), Q(x)) = 1$.

  - **Preservación de dominio**: Las restricciones del dominio original aplican también a los factores cancelados en la sustracción.

  '
ejemplo_guiado:
  enunciado: Resuelve la resta $\frac{x^2}{x - 3} - \frac{9}{x - 3}$, factoriza el numerador, simplifica la fracción y evalúa
    para $x = 7$.
  pasos:
  - 'Paso 1: Conservar el denominador común $(x - 3)$: $\frac{x^2 - 9}{x - 3}$.'
  - 'Paso 2: Factorizar el numerador por diferencia de cuadrados: $x^2 - 9 = (x - 3)(x + 3)$.'
  - 'Paso 3: Sustituir y cancelar $(x - 3)$: $\frac{(x - 3)(x + 3)}{x - 3} = x + 3$ para $x \neq 3$.'
  - 'Paso 4: Evaluar para $x = 7$: $7 + 3 = 10$.'
  imagen: /static/img/nodos/simplificacion-final-de-una-resta-de-fracciones-algebraicas-ejemplos.svg
checkpoints:
