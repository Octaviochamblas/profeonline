semantic_id: MAT.ALG.FRACCIONES_RESTA.SIMPLIFICACION_FINAL
resumen_inicial: Una vez reducido el numerador de la resta, se intenta factorizar
  para simplificar factores comunes con el denominador.
explicacion_simple: 'Tras restar los numeradores y reducir los términos semejantes,
  el paso final consiste en verificar si el resultado se puede simplificar.

  Factorizamos el polinomio resultante en el numerador.

  Si comparte algún factor o paréntesis con el denominador común m.c.m., lo cancelamos
  para presentar la resta en su forma irreducible más simple.'
explicacion_formal: 'Dada la resta reducida $\frac{N(x)}{M(x)}$, se factorizan numerador
  y denominador $N(x) = P(x) \cdot C(x)$ y $M(x) = Q(x) \cdot C(x)$:


  $$\frac{N(x)}{M(x)} = \frac{P(x) \cdot C(x)}{Q(x) \cdot C(x)} = \frac{P(x)}{Q(x)}
  \quad \text{para } C(x) \neq 0$$


  **Desglose de la fórmula:**

  - $\frac{P(x)}{Q(x)}$: Fracción resta irreducible final.'
definiciones_clave: '- **Simplificación final de resta**: Cancelación de factores
  comunes entre el numerador sustraído reducido y el denominador común.'
propiedades_relaciones: '- **Irreductibilidad**: $\operatorname{gcd}(P(x), Q(x)) =
  1$.'
ejemplo_guiado:
  enunciado: Resuelve la resta $\frac{x^2}{x - 3} - \frac{9}{x - 3}$, factoriza el
    numerador, simplifica la fracción y evalúa para $x = 7$.
  pasos:
  - 'Paso 1: Conservar el denominador común $(x - 3)$: $\frac{x^2 - 9}{x - 3}$.Paso
    2: Factorizar el numerador por diferencia de cuadrados: $x^2 - 9 = (x - 3)(x +
    3)$.Paso 3: Sustituir y cancelar $(x - 3)$: $\frac{(x - 3)(x + 3)}{x - 3} = x
    + 3$ para $x \neq 3$.Paso 4: Evaluar para $x = 7$: $7 + 3 = 10$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión reducida simplificada de $\frac{x^2}{x - 3} - \frac{9}{x
    - 3}$?
  choices:
  - text: $x + 3$
    is_correct: true
  - text: $x - 3$
    is_correct: false
  - text: $\frac{x + 3}{x - 3}$
    is_correct: false
  - text: $x^2 - 9$
    is_correct: false
  explanation: La alternativa correcta es '$x + 3$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la resta simplificada $x + 3$ para $x = 7$, ¿cuál es el resultado?
  choices:
  - text: $10$
    is_correct: true
  - text: $4$
    is_correct: false
  - text: $14$
    is_correct: false
  - text: $21$
    is_correct: false
  explanation: La alternativa correcta es '$10$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Restar numeradores sobre el denominador común.'
- 'Paso 2: Reducir términos semejantes.'
- 'Paso 3: Factorizar completamente el numerador resultante.'
- 'Paso 4: Cancelar factores comunes con el denominador.'
errores_correccion: '- **Error común:** Entregar $x^2 - 9 / x - 3$ sin haber factorizado
  ni cancelado el factor común $(x - 3)$.

  - **Cómo corregirlo:** Revisa siempre si el numerador reducido se puede factorizar
  para simplificar la fracción.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sustracción.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sustracción.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El signo menos afecta a todo el segundo numerador?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la ley distributiva de la resta.
- titulo: ¿Es conmutativa la sustracción de fracciones?
  respuesta: 'No'
  solucion_pasos:
  - No, restar $A - B$ da un resultado opuesto a $B - A$.
errores_frecuentes:
- Restar los denominadores al realizar la sustracción de fracciones algebraicas.
- Olvidar colocar paréntesis en el segundo numerador al restar.
- Cambiar solo el signo del primer término del sustraendo.
- Restar numeradores de fracciones de distinto denominador sin homogeneizar.
- Confundir el m.c.m. con el producto simple de los denominadores.
afirmaciones_verdaderas:
- Al restar fracciones algebraicas se conserva el denominador común y se restan los
  numeradores.
- El signo negativo de la sustracción invierte el signo de todos los términos del
  segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás efectuar sustracciones de
  fracciones algebraicas aplicando correctamente la distribución de signos y simplificación
  del resultado.
fuente: Texto escolar MINEDUC — Álgebra / Fracciones Algebraicas
