semantic_id: MAT.ALG.FRACCIONES_RESTA.SIMPLIFICACION_FINAL
resumen_inicial: 'Simplificación final de una resta de fracciones algebraicas: concepto,
  reglas operativas y simplificación en Sustracción de fracciones algebraicas.'
explicacion_simple: Al igual que con la suma, no celebres hasta ver si la fracción
  resultante se puede reducir.
explicacion_formal: '### Definición formal


  Ese es el instinto clave: siempre revisar si hay una simplificación oculta al final.


  ### Desarrollo didáctico


  La etapa de cierre de la resta es idéntica a la suma. Has domado los signos, distribuido,
  y reducido tu numerador gigante a algo compacto.


  Antes de cantar victoria, la revisión de estilo es obligatoria:

  1. Toma tu numerador compactado y obsérvalo. ¿Se puede factorizar? (Busca factor
  común o fíjate si es un trinomio factorizable).

  2. Si se factoriza, colócalo en paréntesis.

  3. Si alguno de esos nuevos paréntesis del numerador es exactamente igual a los
  paréntesis que dejaste descansando pacíficamente en el denominador, aplícales la
  simplificación asesina (táchalos).


  El resultado sobreviviente, con sus restricciones de dominio heredadas, es tu respuesta
  gloriosa final.'
