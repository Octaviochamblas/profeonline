procedimiento:
- 'Paso 1: Identifica qué información se necesita obtener de la función (vértice,
  ceros, o coeficientes).'
- 'Paso 2: Si se necesita el vértice, prioriza la forma canónica.'
- 'Paso 3: Si se necesitan los ceros, prioriza la forma factorizada.'
- 'Paso 4: Si se necesita evaluar la función o identificar coeficientes rápidamente,
  usa la forma general.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en elección de la forma más conveniente de la función
  según la información disponible.
ejemplos:
- titulo: Elección de forma para hallar el vértice
  enunciado: Se necesita el vértice de una parábola que modela la altura de un objeto.
    ¿Qué forma conviene usar?
  solucion_pasos:
  - La forma canónica expone directamente las coordenadas del vértice.
  - Conviene usar la forma canónica.
- titulo: Elección de forma para hallar los ceros
  enunciado: Se necesita saber en qué instantes un objeto toca el suelo (altura cero).
    ¿Qué forma conviene usar?
  solucion_pasos:
  - La forma factorizada expone directamente los ceros de la función.
  - Conviene usar la forma factorizada.
- titulo: ¿La forma general es siempre la más útil para cualquier cálculo?
  enunciado: ¿La forma general es siempre la más útil para cualquier cálculo?
  respuesta: 'No'
  solucion_pasos:
  - Depende de qué información se busque; la canónica y la factorizada son más directas
    para el vértice y los ceros respectivamente.
- titulo: ¿Se puede convertir libremente entre las tres formas de una misma función?
  enunciado: ¿Se puede convertir libremente entre las tres formas de una misma función?
  respuesta: Sí
  solucion_pasos:
  - Las tres formas son algebraicamente equivalentes, por lo que siempre es posible
    convertir entre ellas.
errores_frecuentes:
- Intentar leer el vértice directamente de la forma general sin convertir a la forma
  canónica.
- Intentar leer los ceros directamente de la forma canónica sin resolver la ecuación
  correspondiente.
- Elegir siempre la forma general por costumbre, incluso cuando otra forma sería más
  directa para el problema.
- Suponer que la forma factorizada siempre existe, sin verificar si la función tiene
  ceros reales.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  elección de la forma más conveniente de la función según la información disponible.
