semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.ELECCION_FORMA
resumen_inicial: 'Elección de la forma más conveniente de la función según la información
  disponible: parábola, vértice, concavidad y formas de Formas de la función cuadrática.'
explicacion_simple: Ninguna de las tres formas de la función cuadrática es "la mejor"
  en términos absolutos; cada una resulta más útil dependiendo de qué información
  se busque.
explicacion_formal: '### Definición formal


  Las tres formas de una función cuadrática ($ax^2+bx+c$, $a(x-h)^2+k$, $a(x-r_1)(x-r_2)$)
  son algebraicamente equivalentes, pero cada una expone directamente distinta información:
  la general expone $c=f(0)$; la canónica expone el vértice $(h,k)$; la factorizada
  expone los ceros $r_1, r_2$ (cuando existen).


  ### Desarrollo didáctico


  Antes de elegir una forma, conviene preguntarse qué información se necesita: si
  es el vértice, usar la forma canónica; si son los ceros, la factorizada; si es evaluar
  rápidamente o identificar coeficientes, la general.


  Para determinar el máximo de una función que modela una trayectoria, conviene usar
  la forma canónica, ya que expone directamente el vértice, que corresponde a ese
  máximo.'
definiciones_clave: '- **Elección de la forma más conveniente de la función según
  la información disponible**: Elemento o parámetro esencial en la representación
  de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  elección de la forma más conveniente de la función según la información disponible.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando elección de
    la forma más conveniente de la función según la información disponible.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a elección
    de la forma más conveniente de la función según la información disponible.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
