semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.ELECCION_FORMA
resumen_inicial: La elección de la forma más conveniente selecciona entre general, canónica o factorizada optimizando el trabajo según los datos disponibles.
explicacion_simple: |
  Dependiendo de los datos que te entregue un problema o de lo que te pidan calcular, conviene elegir la presentación estratégica de la función:

  1. **Usas la FORMA CANÓNICA $f(x) = a(x - h)^2 + k$ si**:
     - Te dan el **vértice $V(h, k)$** o el **máximo/mínimo**.
     - Quieres hallar la altura máxima/mínima o el eje de simetría de inmediato.
  2. **Usas la FORMA FACTORIZADA $f(x) = a(x - x_1)(x - x_2)$ si**:
     - Te dan las **raíces o cortes con el eje X ($x_1, x_2$)**.
     - Quieres encontrar los ceros de la función directamente.
  3. **Usas la FORMA GENERAL $f(x) = ax^2 + bx + c$ si**:
     - Conoces el **corte con el eje Y $(0, c)$** o tres puntos genéricos del plano.
explicacion_formal: |
  Sea el problema de modelamiento o análisis de una función cuadrática $f$. El **criterio de elección óptima de la forma funcional** selecciona la representación isomórfica que minimiza la complejidad operacional según la estructura de los datos iniciales $D$:

  $$\text{Forma Óptima}(D) = \begin{cases} \text{Forma Canónica } a(x - h)^2 + k & \text{si } V(h, k) \in D \\ \text{Forma Factorizada } a(x - x_1)(x - x_2) & \text{si } Z(f) = \{x_1, x_2\} \subset D \\ \text{Forma General } ax^2 + bx + c & \text{si } (0, c) \in D \lor |D| = 3 \text{ puntos cartesiano} \end{cases}$$

  **Matriz de conveniencia operativa:**
  - Canónica $\implies$ Optimización, trayectorias máximas, transformaciones geométricas.
  - Factorizada $\implies$ Estudio de ceros, intervalos de signo, intersecciones con el eje horizontal.
  - General $\implies$ Sistemas de ecuaciones lineales $3 \times 3$, derivación e integración polinómica.
definiciones_clave: |
  - **Elección estratégica de la forma**: Selección consciente de la presentación matemática de la función cuadrática que reduce los pasos algebraicos según el contexto.
propiedades_relaciones: |
  - **Equivalencia tripartita completa**: Toda función cuadrática con $\Delta \ge 0$ puede transitar libremente entre sus tres representaciones (General, Canónica y Factorizada) mediante transformaciones equivalentes.
ejemplo_guiado:
  enunciado: 'Un problema te informa que una parábola tiene su vértice en $V(3, -4)$ y pasa por el punto $(1, 0)$. ¿Qué forma conviene usar para hallar la ecuación de la función?'
  pasos:
    - 'Paso 1: Analizar la información dada: el dato principal es el vértice $V(3, -4)$.'
    - 'Paso 2: Elegir la forma conveniente: la **Forma Canónica** $f(x) = a(x - h)^2 + k$.'
    - 'Paso 3: Reemplazar $h = 3$ y $k = -4$: $f(x) = a(x - 3)^2 - 4$.'
    - 'Paso 4: Sustituir el punto $(1, 0)$ para despejar el parámetro $a$: $0 = a(1 - 3)^2 - 4 \implies 4a = 4 \implies a = 1$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si un problema de física indica que un proyectil se lanza desde el suelo y toca tierra nuevamente en los segundos $t = 0$ y $t = 6$, ¿qué forma de la función cuadrática conviene utilizar?'
    choices:
      - {text: 'La forma factorizada $h(t) = a(t - 0)(t - 6)$', is_correct: true}
      - {text: 'La forma general $h(t) = at^2 + bt + c$.', is_correct: false}
      - {text: 'La forma canónica $h(t) = a(t - 3)^2 + 9$.', is_correct: false}
      - {text: 'Una forma lineal $h(t) = mt + b$.', is_correct: false}
    explanation: 'La alternativa correcta es ''La forma factorizada $h(t) = a(t - 0)(t - 6)$''. Al conocer las raíces (instantes de impacto en el suelo), la forma factorizada es la más directa.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué información específica permite escribir de forma directa la forma canónica de una función cuadrática?'
    choices:
      - {text: 'Las coordenadas del vértice $V(h, k)$ y un punto adicional', is_correct: true}
      - {text: 'El corte con el eje Y únicamente.', is_correct: false}
      - {text: 'El valor del discriminante únicamente.', is_correct: false}
      - {text: 'El grado máximo de la variable.', is_correct: false}
    explanation: 'La alternativa correcta es ''Las coordenadas del vértice $V(h, k)$ y un punto adicional''. Con el vértice se arman $h$ y $k$, y con el punto se despeja $a$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar los datos iniciales conocidos del problema (vértice, raíces, punto de corte en Y o puntos cartesiano).'
  - 'Paso 2: Si el dato clave es el vértice $V(h, k)$, seleccionar la forma canónica $f(x) = a(x - h)^2 + k$.'
  - 'Paso 3: Si los datos clave son las raíces $x_1, x_2$, seleccionar la forma factorizada $f(x) = a(x - x_1)(x - x_2)$.'
  - 'Paso 4: Sustituir los valores conocidos y utilizar un punto adicional para calcular el valor del coeficiente $a$.'
errores_correccion: |
  - **Error común:** Forzar el uso de la forma general en problemas donde se entrega el vértice, generando sistemas de ecuaciones largos e innecesarios.
  - **Cómo corregirlo:** Si tienes el vértice **USA LA FORMA CANÓNICA DE INMEDIATO**; te ahorrarás resolver sistemas algebraicos complejos.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Elección por datos de raíces.
    alternativas:
      - 'Forma factorizada f(x) = a(x + 1)(x - 4)'
      - 'Forma general con c = 0'
      - 'Forma canónica con V(0,0)'
    respuesta: 'Forma factorizada f(x) = a(x + 1)(x - 4)'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Elección por datos de vértice.
    alternativas:
      - 'Forma canónica f(x) = a(x - 2)^2 + 5'
      - 'Forma factorizada'
      - 'Forma general directamente'
    respuesta: 'Forma canónica f(x) = a(x - 2)^2 + 5'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Usar la forma general planteando un sistema $3 \times 3$ en problemas donde el vértice ya está explícitamente dado.'
  - 'El uso de la forma factorizada en funciones con discriminante negativo que no cortan al eje X en los reales.'
  - 'La creencia de que las tres formas de la función cuadrática entregan resultados numéricos distintos al ser evaluadas en el mismo punto.'
  - 'La falta de aprovechamiento del corte con el eje Y para fijar el valor de $c$ de forma instantánea en la forma general.'
  - 'La falta de despeje del parámetro $a$ con un punto adicional tras reemplazar el vértice o las raíces.'
afirmaciones_verdaderas:
  - 'La elección de la forma funcional depende de los datos conocidos: la canónica requiere el vértice $V(h, k)$, la factorizada requiere los ceros $x_1, x_2$ y la general usa tres puntos o el corte en Y.'
  - 'Las tres formas de una misma función cuadrática (general, canónica y factorizada) son algebraicamente equivalentes y producen la misma gráfica cartesiana.'
al_terminar_debes_poder: |
  QUÉ: Elegir la forma funcional (canónica, factorizada o general) más eficiente según la información disponible.
  CÓMO: Evaluar si se cuenta con vértice, raíces o puntos de corte, seleccionar la forma idónea y despejar $a$ con un punto adicional.
