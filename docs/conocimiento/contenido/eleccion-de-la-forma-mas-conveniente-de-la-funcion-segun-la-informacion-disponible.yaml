semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.ELECCION_FORMA
resumen_inicial: 'La elección de la forma más conveniente de una función cuadrática depende de los datos conocidos (vértice, ceros o punto de corte $y$) y del objetivo de análisis perseguido.'
explicacion_simple: |
  Las tres formas de la función cuadrática expresan exactamente la misma parábola, pero cada una resalta una característica distinta. Si conocemos o buscamos el vértice y el valor máximo o mínimo, la **forma canónica** es la mejor opción. Si conocemos los puntos donde la curva corta al suelo (eje $x$), la **forma factorizada** es la ideal. Si conocemos el corte con el eje vertical $y$ o queremos trabajar con polinomios estándar, usamos la **forma general**.
explicacion_formal: |
  ### Definición formal
  La **selección estratégica del modelo cuadrático** asigna la forma algebraica óptima $f(x)$ según la estructura de los datos iniciales o la propiedad geométrica a determinar:
  1. **Forma Canónica $f(x) = a(x - h)^2 + k$**: Conveniente cuando se conoce o busca el vértice $V(h, k)$, el eje de simetría $x = h$, la cota extrema o el recorrido de la función.
  2. **Forma Factorizada $f(x) = a(x - x_1)(x - x_2)$**: Conveniente cuando se conocen los ceros reales $x_1, x_2$, las intersecciones con el eje $x$, o los intervalos de positividad y negatividad.
  3. **Forma General $f(x) = ax^2 + bx + c$**: Conveniente cuando se conoce el corte con el eje $y$ en $(0, c)$, cuando se efectúan operaciones algebraicas entre funciones, o al aplicar sistemas de ecuaciones con tres puntos cualesquiera.

  ### Desglose simbólico
  - Datos $\{V(h, k), P(x_0, y_0)\} \implies$ Usar $y = a(x - h)^2 + k$ para despejar $a$.
  - Datos $\{x_1, x_2, P(x_0, y_0)\} \implies$ Usar $y = a(x - x_1)(x - x_2)$ para despejar $a$.
  - Datos $\{(0, c), P_1, P_2\} \implies$ Usar $y = ax^2 + bx + c$ para armar un sistema lineal en $a$ y $b$.

  ### Síntesis didáctica
  Saber elegir la forma adecuada ahorra tiempo en exámenes y reduce pasos de cálculo. Usar la forma canónica cuando el problema da el vértice permite hallar la función con una sola ecuación simple.
definiciones_clave: |
  - **Forma canónica (vértice)**: Expresión $a(x - h)^2 + k$ óptima para problemas centrados en vértices y extremos.
  - **Forma factorizada (raíces)**: Expresión $a(x - x_1)(x - x_2)$ óptima para problemas centrados en raíces y cortes con el eje $x$.
  - **Forma general (polinomial)**: Expresión $ax^2 + bx + c$ óptima para operaciones algebraicas y sistemas de tres puntos.
propiedades_relaciones: |
  - **Constancia de $a$**: En las tres formas, el coeficiente $a$ es exactamente el mismo número real. Conocer $a$ en una forma determina $a$ para las demás.
  - **Determinación unívoca con 3 datos**: Toda parábola queda determinada de manera única al conocer 3 condiciones independientes (ej: 3 puntos, o el vértice y un punto, o 2 raíces y un punto).
ejemplo_guiado:
  enunciado: 'Determina la función cuadrática $f(x)$ que pasa por el punto $P(2, 12)$ sabiendo que su vértice es $V(1, 3)$, eligiendo la forma más conveniente.'
  pasos:
    - 'Paso 1: Evaluamos la información: conocemos el vértice $V(1, 3) = (h, k)$ y un punto $P(2, 12)$. La forma más conveniente es la forma canónica $f(x) = a(x - h)^2 + k$.'
    - 'Paso 2: Sustituimos $h = 1$ y $k = 3$ en la estructura: $f(x) = a(x - 1)^2 + 3$.'
    - 'Paso 3: Reemplazamos las coordenadas del punto $P(2, 12)$ para despejar $a$: $12 = a(2 - 1)^2 + 3 \implies 12 = a(1)^2 + 3 \implies 12 = a + 3 \implies a = 9$.'
    - 'Paso 4: Escribimos la función en forma canónica: $f(x) = 9(x - 1)^2 + 3$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Si un problema nos da como datos las raíces de una parábola $x_1 = -2$ y $x_2 = 4$, junto con un punto adicional $(0, -16)$, ¿cuál es la forma algebraica más conveniente para hallar la regla de la función?'
    choices:
      - {text: 'La forma factorizada $f(x) = a(x - x_1)(x - x_2)$', is_correct: true}
      - {text: 'La forma canónica $f(x) = a(x - h)^2 + k$', is_correct: false}
      - {text: 'La forma general $f(x) = ax^2 + bx + c$', is_correct: false}
      - {text: 'Una función lineal $f(x) = mx + n$', is_correct: false}
    explanation: 'La alternativa correcta es ''La forma factorizada $f(x) = a(x - x_1)(x - x_2)$''. Al disponer directamente de las raíces $x_1$ y $x_2$, la forma factorizada permite despejar $a$ de inmediato.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué forma de la función cuadrática conviene utilizar si el objetivo del problema es encontrar de forma inmediata el corte de la parábola con el eje $y$?'
    choices:
      - {text: 'La forma general $f(x) = ax^2 + bx + c$', is_correct: true}
      - {text: 'La forma factorizada $f(x) = a(x - x_1)(x - x_2)$', is_correct: false}
      - {text: 'La forma canónica $f(x) = a(x - h)^2 + k$', is_correct: false}
      - {text: 'La forma implícita $x = ay^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''La forma general $f(x) = ax^2 + bx + c$''. En la forma general, la constante $c$ expone directamente el punto de corte $(0, c)$ sin realizar cálculos.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Analizar la información de entrada disponible en el problema (vértice, ceros, corte con el eje $y$ o puntos arbitrarios).'
  - 'Paso 2: Seleccionar la forma canónica si se conoce el vértice $V(h, k)$, la forma factorizada si se conocen los ceros $x_1, x_2$, o la forma general si se conocen $c$ o puntos arbitrarios.'
  - 'Paso 3: Sustituir los datos conocidos en la plantilla seleccionada y resolver para despejar el coeficiente principal $a$ o los coeficientes restantes.'
errores_correccion: |
  - **Error 1:** Tratar de usar la forma factorizada cuando la parábola no posee ceros reales ($\Delta < 0$). **Cómo corregirlo:** La forma factorizada real sólo existe si $\Delta \ge 0$. Para parábolas flotantes sin corte con el eje $x$, se debe emplear la forma canónica o la forma general.
  - **Error 2:** Forzar un sistema de 3 ecuaciones con 3 incógnitas en forma general cuando se conoce el vértice. **Cómo corregirlo:** Si se conoce el vértice $V(h, k)$, usar la forma canónica $a(x - h)^2 + k$ reduce el problema a una sola ecuación simple para hallar $a$.
ejemplos:
  - titulo: 'Selección de forma ante datos de ceros'
    enunciado: 'Se conocen los ceros $x_1 = 3$ y $x_2 = 7$, y que la parábola abre hacia abajo con $a = -1$. ¿Cuál es su expresión en la forma más conveniente?'
    alternativas:
      - '$f(x) = -(x - 3)(x - 7)$'
      - '$f(x) = -(x - 3)^2 + 7$'
      - '$f(x) = -x^2 + 3x + 7$'
    respuesta: '$f(x) = -(x - 3)(x - 7)$'
    solucion_pasos:
      - '1. Al tener las raíces $x_1 = 3$ y $x_2 = 7$, seleccionamos la forma factorizada $a(x - x_1)(x - x_2)$.'
      - '2. Reemplazamos $a = -1$, $x_1 = 3$, $x_2 = 7$: $f(x) = -(x - 3)(x - 7)$.'
  - titulo: 'Selección ante datos de vértice'
    enunciado: 'Se sabe que una función alcanza su valor mínimo $y = -4$ en $x = 2$, y que $a = 3$. ¿Cuál es su expresión más directa?'
    alternativas:
      - '$f(x) = 3(x - 2)^2 - 4$'
      - '$f(x) = 3(x - 2)(x + 4)$'
      - '$f(x) = 3x^2 - 2x - 4$'
    respuesta: '$f(x) = 3(x - 2)^2 - 4$'
    solucion_pasos:
      - '1. El enunciado entrega el vértice $V(2, -4)$, por lo que usamos la forma canónica.'
      - '2. Sustituimos $a = 3$, $h = 2$, $k = -4$: $f(x) = 3(x - 2)^2 - 4$.'
  - titulo: 'Unicidad de la función elegida'
    enunciado: '¿Representar una misma parábola en forma canónica, factorizada o general altera sus valores numéricos al evaluar en un mismo $x$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Las tres formas son algebraicamente equivalentes y producen exactamente la misma salida $y$ para cualquier $x$.'
  - titulo: 'Uso de la forma general con corte y'
    enunciado: 'Si conocemos el corte con el eje $y$ en $(0, 5)$, ¿la forma general $f(x) = ax^2 + bx + 5$ ya tiene incorporado el valor $c = 5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La ordenada al origen $c = 5$ se ubica directamente como el término independiente de la forma general.'
errores_frecuentes:
  - 'La forma factorizada es la mejor opción para construir funciones cuadráticas sin ceros reales.'
  - 'Usar la forma canónica cuando se conoce el vértice requiere armar un sistema de tres ecuaciones con tres incógnitas.'
  - 'El coeficiente principal $a$ en la forma factorizada tiene un valor diferente al de la forma canónica.'
  - 'Para leer el punto de corte con el eje $y$ es obligatorio transformar la función a forma factorizada.'
  - 'La forma general de una función cuadrática no permite calcular la abscisa del vértice.'
afirmaciones_verdaderas:
  - 'La elección de la forma de la función cuadrática debe guiarse por los datos disponibles: forma canónica para vértices, factorizada para ceros, o general para el corte en $y$.'
  - 'Las tres formas de la función cuadrática (general, canónica y factorizada) representan la misma parábola y son mutuamente convertibles entre sí.'
al_terminar_debes_poder: 'Seleccionar e implementar la forma más conveniente de una función cuadrática según la información dada y el objetivo del problema.'
