semantic_id: MAT.ALG.LENGUAJE_RELACIONES.SEMISUMA_NUMEROS
resumen_inicial: 'Traducción de la semisuma entre dos números: traducción, reglas
  y aplicación práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: Si tú tienes 10 dulces y yo 4, y queremos ser justos, juntamos
  todos en una bolsa (14) y los dividimos a la mitad. Cada uno se lleva 7. Acabamos
  de hacer una semisuma.
explicacion_formal: '### Definición formal


  Sumar dos números y dividir el resultado entre dos (semisuma) es la fórmula exacta
  para obtener su promedio.


  ### Desarrollo didáctico


  Anatomía de la expresión:

  - Suma: $x + y$

  - Semi (mitad): Dividido por 2.

  - Semisuma: $\frac{x + y}{2}$


  *Conexión de Oro:* La semisuma de dos variables es exactamente el mismo concepto
  que el **promedio** (o media aritmética) de dos datos. Si un problema dice ''el
  promedio de dos números'', escribe de inmediato su semisuma.'
definiciones_clave: '- **Traducción de la semisuma entre dos números**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de traducción de la semisuma entre dos números.'
