semantic_id: MAT.ALG.LENGUAJE_RELACIONES.SEMISUMA_NUMEROS
resumen_inicial: 'La traducción de la semisuma entre dos números consiste en representar simbólicamente la suma de dos expresiones dividida por dos $\frac{a + b}{2}$, que equivale algebraicamente a su promedio o media aritmética.'
explicacion_simple: |
  En matemáticas, el prefijo **"semi-"** significa **"mitad"** o **"dividido entre 2"**:
  - Por lo tanto, la **semisuma entre dos números** es la **mitad de su suma**:
    - Frases verbales: *"La semisuma entre $a$ y $b$"*, *"La mitad de la suma de $a$ y $b$"*, *"La media aritmética de $a$ y $b$"*.
    - Traducción: **$\frac{a + b}{2}$** (o $\frac{1}{2}(a + b)$).
  - Ejemplo: La semisuma entre $10$ y $4 \implies \frac{10 + 4}{2} = \frac{14}{2} = 7$.
  - **Propiedad**: Como la suma es conmutativa, la semisuma entre $a$ y $b$ es exactamente igual a la semisuma entre $b$ y $a$ ($\frac{a + b}{2} = \frac{b + a}{2}$).
explicacion_formal: |
  ### Definición formal
  La **semisuma** es un operador funcional $\operatorname{semi}^+: \mathbb{R} \times \mathbb{R} \to \mathbb{R}$ que asigna a un par de expresiones $(A, B)$ el valor medio aritmético de su adición:

  $$\operatorname{semi}^+(A, B) = \frac{A + B}{2} = \frac{1}{2}(A + B)$$

  ### Identidad con la Media Aritmética
  La semisuma entre dos cantidades $A$ y $B$ coincide con la definición de la media aritmética $\bar{x}$ para $n = 2$ observaciones:

  $$\bar{x} = \frac{\sum_{i=1}^2 x_i}{2} = \frac{A + B}{2}$$

  ### Interpretación Geométrica en el Plano y Recta Numérica
  En la recta numérica real, el valor de la semisuma $\frac{a + b}{2}$ representa exactamente las coordenadas del **punto medio** del segmento que une las posiciones $a$ y $b$.

  ### Síntesis didáctica
  La semisuma es la herramienta fundamental para calcular promedios de notas, puntos medios en geometría analítica y centros de masa en física.
definiciones_clave: |
  - **Semisuma ($\frac{a+b}{2}$)**: Expresión algebraica que representa la mitad de la suma de dos cantidades.
  - **Prefijo semi-**: Elemento léxico que indica la división por la constante $2$.
  - **Punto medio**: Posición equidistante en la recta numérica que coincide con el valor de la semisuma.
propiedades_relaciones: |
  - **Conmutatividad de la semisuma**: $\frac{a + b}{2} = \frac{b + a}{2}$.
  - **Equidistancia**: La distancia desde $a$ hasta la semisuma es igual a la distancia desde la semisuma hasta $b$: $\left|\frac{a+b}{2} - a\right| = \left|b - \frac{a+b}{2}\right| = \frac{|b-a|}{2}$.
ejemplo_guiado:
  enunciado: 'Traduce al lenguaje algebraico la siguiente frase: "La semisuma entre el doble de $x$ y el cuádruple de $y$ equivale a quince".'
  pasos:
    - 'Paso 1: Identificamos las dos cantidades que se van a sumar: "El doble de $x$" ($2x$) y "el cuádruple de $y$" ($4y$).'
    - 'Paso 2: Formamos su suma: $(2x + 4n)$.'
    - 'Paso 3: Aplicamos la semisuma dividiendo toda la suma entre 2: $\frac{2x + 4y}{2}$.'
    - 'Paso 4: Simplificamos dividiendo cada término entre 2: $\frac{2x}{2} + \frac{4y}{2} = x + 2y$.'
    - 'Paso 5: Igualamos a 15: $x + 2y = 15$.'
    - 'Conclusión: La ecuación traducida y simplificada es **$x + 2y = 15$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué notación algebraica expresa la semisuma entre dos cantidades $a$ y $b$?'
    choices:
      - {text: 'Se expresa como la suma dividida entre dos: $\frac{a + b}{2}$ (o $\frac{1}{2}(a + b)$)', is_correct: true}
      - {text: 'Se expresa multiplicando la suma por dos: $2(a + b)$', is_correct: false}
      - {text: 'Se expresa como la resta dividida entre dos: $\frac{a - b}{2}$', is_correct: false}
      - {text: 'Se expresa elevando la suma al cuadrado: $(a + b)^2$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se expresa como la suma dividida entre dos: $\frac{a + b}{2}$ (o $\frac{1}{2}(a + b)$)''. Definición de semisuma.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿A qué concepto estadístico y geométrico equivale el valor de la semisuma $\frac{a + b}{2}$ en la recta real?'
    choices:
      - {text: 'Equivale exactamente al promedio o media aritmética y a las coordenadas del punto medio del segmento entre $a$ y $b$', is_correct: true}
      - {text: 'Equivale a la distancia total entre $a$ y $b$', is_correct: false}
      - {text: 'Equivale al producto de ambas variables', is_correct: false}
      - {text: 'Equivale al resto de la división entre $a$ y $b$', is_correct: false}
    explanation: 'La alternativa correcta es ''Equivale exactamente al promedio o media aritmética y a las coordenadas del punto medio del segmento entre $a$ y $b$''. Punto medio / Promedio.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las dos cantidades que se van a sumar en la frase verbal.'
  - 'Paso 2: Escribir la suma de ambas cantidades entre paréntesis o en el numerador de una fracción.'
  - 'Paso 3: Colocar el número $2$ en el denominador de la fracción ($\frac{A + B}{2}$).'
  - 'Paso 4: Simplificar la fracción si todos los términos del numerador son divisibles por 2.'
errores_correccion: |
  - **Error 1:** Escribir el producto $2(a + b)$ al traducir la semisuma en vez de $\frac{a + b}{2}$. **Cómo corregirlo:** El prefijo "semi-" **DIVIDE por 2 ($\frac{a + b}{2}$)**; no multiplica por 2.
  - **Error 2:** Dividir por 2 sólo a una de las variables (escribir $a + \frac{b}{2}$). **Cómo corregirlo:** La semisuma se aplica sobre **TODA LA SUMA ($\frac{a + b}{2}$)**; exige envolver el numerador completo.
ejemplos:
  - titulo: 'Semisuma de variables'
    enunciado: '¿Cuál es la traducción de "La semisuma entre $x$ e $y$"?'
    alternativas:
      - '$\frac{x + y}{2}$'
      - '$2(x + y)$'
      - '$\frac{x - y}{2}$'
    respuesta: '$\frac{x + y}{2}$'
    solucion_pasos:
      - '1. Suma: $(x + y)$.'
      - '2. Semisuma divide entre 2: $\frac{x + y}{2}$.'
  - titulo: 'Semisuma de números'
    enunciado: '¿Cuál es la semisuma entre 8 y 12?'
    alternativas:
      - '10'
      - '20'
      - '40'
    respuesta: '10'
    solucion_pasos:
      - '1. Suma: $8 + 12 = 20$.'
      - '2. Semisuma: $\frac{20}{2} = 10$.'
  - titulo: 'Conmutatividad'
    enunciado: '¿Es la semisuma entre $a$ y $b$ igual a la semisuma entre $b$ y $a$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{a + b}{2} = \frac{b + a}{2}$ por la conmutatividad aditiva.'
  - titulo: 'Simplificación de semisuma'
    enunciado: 'La semisuma entre $2a$ y $6b$, ¿se simplifica como $a + 3b$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{2a + 6b}{2} = \frac{2a}{2} + \frac{6b}{2} = a + 3b$.'
errores_frecuentes:
  - 'Multiplicar la suma por dos escribiendo 2(a + b) al traducir la semisuma.'
  - 'Dividir entre dos únicamente al segundo término escribiendo a + b/2 en lugar de la fracción completa.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intercambiar la semisuma con la semidiferencia utilizando un signo menos.'
  - 'Declarar que la semisuma de dos números es igual a su producto dividido por dos.'
afirmaciones_verdaderas:
  - 'La semisuma entre dos cantidades se representa algebraicamente como la suma de las expresiones dividida por dos.'
  - 'La semisuma entre dos números coincide con su promedio o media aritmética y con el punto medio de su segmento.'
al_terminar_debes_poder: 'Traducir la semisuma entre dos cantidades dividiendo su suma completa entre dos de forma simplificada.'
