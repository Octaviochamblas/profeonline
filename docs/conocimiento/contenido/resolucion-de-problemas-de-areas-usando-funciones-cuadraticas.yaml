procedimiento:
- 'Paso 1: Plantea la función de área $A(x)$ en términos de una variable adecuada.'
- 'Paso 2: Identifica qué se pregunta: un valor específico, el máximo, o el comportamiento
  general.'
- 'Paso 3: Aplica la herramienta correspondiente (evaluación, vértice, o resolución
  de ecuación).'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en resolución de problemas de áreas usando funciones
  cuadráticas.
ejemplos:
- titulo: Planteamiento de función de área con perímetro fijo
  enunciado: Con $40$ m de cerca para un corral rectangular, si $x$ es un lado, plantea
    el área en función de $x$.
  solucion_pasos:
  - El otro lado es $20-x$ (la mitad del perímetro menos $x$).
  - $A(x)=x(20-x)=-x^2+20x$.
- titulo: Evaluación de la función de área en un valor específico
  enunciado: Con $A(x)=-x^2+20x$, ¿cuál es el área si $x=6$?
  solucion_pasos:
  - $A(6)=-36+120=84$.
  - El área es $84 \text{ m}^2$.
- titulo: ¿Tratar el área como función permite analizar su comportamiento completo?
  enunciado: ¿Tratar el área como función permite analizar su comportamiento completo?
  respuesta: Sí
  solucion_pasos:
  - A diferencia de resolver para un solo valor, la función permite estudiar el área
    para cualquier valor de la variable, incluyendo su máximo.
- titulo: ¿El dominio de la función de área en un problema aplicado siempre es todo
    $\mathbb{R}$?
  enunciado: ¿El dominio de la función de área en un problema aplicado siempre es
    todo $\mathbb{R}$?
  respuesta: 'No'
  solucion_pasos:
  - El contexto impone restricciones (por ejemplo, que ambas dimensiones sean positivas),
    acotando el dominio real del problema.
errores_frecuentes:
- Plantear incorrectamente la relación entre las dos dimensiones de la figura a partir
  del perímetro dado.
- Confundir la función de área con la función de perímetro al plantear el modelo.
- No considerar las restricciones del contexto (dimensiones positivas) al analizar
  la función.
- Evaluar la función en un valor fuera del dominio razonable del problema, sin advertirlo.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  resolución de problemas de áreas usando funciones cuadráticas.
