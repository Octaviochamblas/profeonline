semantic_id: MAT.ALG.FUNC_CUADR_MODELO.PROBLEMAS_AREAS
resumen_inicial: La resolución de problemas de áreas usando funciones cuadráticas modela superficies geométricas ligadas por perímetros constantes mediante funciones $\mathcal{A}(x) = -ax^2 + bx$, hallando las dimensiones óptimas que maximizan el área en el vértice.
explicacion_simple: "![La resolución de problemas de áreas usando funciones cuadráticas modela superficies geométricas ligadas por perímetros constantes mediante funciones $\\mathcal{A}(x) = -ax^2 + bx$, hallando las dimensiones óptimas que maximizan el área en el vértice](/static/img/nodos/resolucion-de-problemas-de-areas-usando-funciones-cuadraticas-intro.svg)\n\n\nOptimizar un área es responder la pregunta: **\"¿Cómo aprovecho al máximo mi alambre o cerca para encerrar el terreno más grande posible?\"**\n\n- **El secreto del área rectangular:**\n  - Si tienes un perímetro fijo (ej: 40 metros de cerco para los 4 lados), el área es $\\mathcal{A}(x) = x(20 - x) = -x^2 + 20x$.\n  - El vértice ocurre en $x = 10\\text{ m}$.\n  - Como el ancho es 10 m, el largo es $20 - 10 = 10\\text{ m}$.\n  - **¡El rectángulo de área máxima es siempre un CUADRADO!** ($10 \\times 10 = 100\\text{ m}^2$).\n- Si uno de los lados no lleva cerca (por ejemplo, porque hay un río o una pared), el largo óptimo será\
  \ el doble del ancho."
explicacion_formal: 'Sea un dominio convexo rectangular en $\mathbb{R}^2$ acotado por un perímetro perimetral lineal de coste uniforme $L$: $\alpha x + \beta y = L$ ($\{\alpha, \beta\} \subset \mathbb{N}^+$). El **problema de optimización isoperimétrica restringida** es:

  $$\max_{x > 0} \mathcal{A}(x) = x \left( \frac{L - \alpha x}{\beta} \right) = -\frac{\alpha}{\beta}x^2 + \frac{L}{\beta}x$$


  **Solución óptima analítica**:

  $$x^* = -\frac{b}{2a} = -\frac{L/\beta}{2(-\alpha/\beta)} = \frac{L}{2\alpha}$$

  $$y^* = \frac{L - \alpha(L/2\alpha)}{\beta} = \frac{L}{2\beta}$$


  **Principio de equipartición perimetral**: El área máxima se alcanza cuando la cantidad de alambre invertida en la dimensión $X$ ($\alpha x^* = L/2$) es exactamente igual a la invertida en la dimensión $Y$ ($\beta y^* = L/2$).'
definiciones_clave: '- **Área máxima cuadrática**: Máximo global alcanzado por la función $\mathcal{A}(x) = -ax^2 + bx$.

  - **Equipartición de perímetro**: Asignación equitativa de recurso lineal entre las dos direcciones ortogonales.'
propiedades_relaciones: '- **Cuadrado isoperimétrico**: Con 4 lados iguales ($\alpha = \beta = 2$), $x^* = y^* = L/4$.

  - **Cerco contra pared**: Con 3 lados ($\alpha = 2, \beta = 1$), $x^* = L/4$ y $y^* = L/2$ ($y^* = 2x^*$).'
ejemplo_guiado:
  enunciado: '![Ejemplo La resolución de problemas de áreas usando funciones cuadráticas modela superficies geométricas ligadas por perímetros constantes mediante funciones $\mathcal{A}(x) = -ax^2 + bx$, hallando las dimensiones óptimas que maximizan el área en el vértice](/static/img/nodos/resolucion-de-problemas-de-areas-usando-funciones-cuadraticas-ejemplos.svg)



    Se dispone de 160 metros de alambre para cercar un terreno rectangular contra un río recto (el lado del río no requiere cerca). Determina las dimensiones que maximizan el área y el área máxima obtenida.'
  pasos:
  - 'Paso 1: Plantear la ecuación del cerco (3 lados: 2 anchos $x$ y 1 largo $y$):

    $2x + y = 160 \implies y = 160 - 2x$.'
  - 'Paso 2: Formular la función del área:

    $\mathcal{A}(x) = x(160 - 2x) = -2x^2 + 160x$.'
  - 'Paso 3: Calcular el ancho óptimo en el vértice:

    $x_v = -\frac{b}{2a} = -\frac{160}{2(-2)} = \frac{160}{4} = 40\text{ metros}$.'
  - 'Paso 4: Calcular el largo correspondiente:

    $y = 160 - 2(40) = 160 - 80 = 80\text{ metros}$.'
  - 'Paso 5: Calcular el área máxima:

    $\mathcal{A}_{\text{máx}} = 40 \times 80 = 3.200\text{ m}^2$ (o $\mathcal{A}(40) = -2(1600) + 6400 = 3.200\text{ m}^2$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué forma geométrica tiene el rectángulo que encierra la mayor área posible cuando se cercan sus 4 lados con un perímetro fijo?
  choices:
  - text: Un cuadrado perfecto (largo = ancho = P/4)
    is_correct: true
  - text: Un rectángulo muy alargado
    is_correct: false
  - text: Un rombo
    is_correct: false
  - text: Depende del tamaño del perímetro
    is_correct: false
  explanation: La alternativa correcta es 'Un cuadrado perfecto (largo = ancho = P/4)'. Por el principio isoperimétrico, el cuadrado maximiza el área con perímetro constante.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Con 200 m de cerca para 3 lados contra una pared ($2x + y = 200$), ¿cuál es el ancho x óptimo?
  choices:
  - text: x = 50 m
    is_correct: true
  - text: x = 100 m
    is_correct: false
  - text: x = 25 m
    is_correct: false
  - text: x = 40 m
    is_correct: false
  explanation: La alternativa correcta es 'x = 50 m'. $\mathcal{A}(x) = x(200 - 2x) = -2x^2 + 200x \implies x_v = -200/(2(-2)) = 50\text{ m}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar cuántos lados llevan cerco y escribir la ecuación del perímetro.'
- 'Paso 2: Despejar una dimensión en términos de la otra ($y = f(x)$).'
- 'Paso 3: Construir la función del área $\mathcal{A}(x) = x \cdot y$.'
- 'Paso 4: Calcular la abscisa del vértice $x_v = -\frac{b}{2a}$ para obtener la dimensión óptima.'
- 'Paso 5: Evaluar $\mathcal{A}(x_v)$ para obtener el área máxima en unidades cuadradas.'
errores_correccion: '- **Error común:** Suponer que siempre es un cuadrado incluso cuando hay paredes o divisiones internas.

  - **Cómo corregirlo:** Si hay paredes existentes o divisiones interiores, **debes plantear la ligadura específica y calcular el vértice $x_v = -b/(2a)$**.'
ejemplos:
- titulo: 'Ejemplo 1: Cuadrado isoperimétrico'
  enunciado: Con 60 m para cercar los 4 lados de un jardín, ¿cuál es el área máxima?
  alternativas:
  - 225 m²
  - 900 m²
  - 300 m²
  - 150 m²
  respuesta: 225 m²
  solucion_pasos:
  - 'Paso 1: $x = 60/4 = 15\text{ m} \implies \mathcal{A} = 15^2 = 225\text{ m}^2$.'
- titulo: 'Ejemplo 2: Cerco contra pared'
  enunciado: Con 100 m para 3 lados ($2x + y = 100$), ¿cuál es el área máxima?
  alternativas:
  - 1.250 m²
  - 2.500 m²
  - 625 m²
  - 1.000 m²
  respuesta: 1.250 m²
  solucion_pasos:
  - 'Paso 1: $x = 25\text{ m}, y = 50\text{ m} \implies \mathcal{A} = 25 \times 50 = 1.250\text{ m}^2$.'
- titulo: 'Ejemplo 3: Dimensiones de corral dividido'
  enunciado: 'Con 120 m para 3 cercas paralelas y 2 exteriores ($3x + 2y = 120$):'
  alternativas:
  - x = 20 m, y = 30 m
  - x = 30 m, y = 20 m
  - x = 25 m, y = 25 m
  - x = 40 m, y = 20 m
  respuesta: x = 20 m, y = 30 m
  solucion_pasos:
  - 'Paso 1: $x_v = 120/(2 \cdot 3) = 20\text{ m} \implies y = 30\text{ m}$.'
- titulo: 'Ejemplo 4: Área máxima con corral dividido'
  enunciado: En el corral anterior ($x = 20\text{ m}, y = 30\text{ m}$), ¿cuál es el área total?
  alternativas:
  - 600 m²
  - 1.200 m²
  - 400 m²
  - 900 m²
  respuesta: 600 m²
  solucion_pasos:
  - 'Paso 1: $\mathcal{A} = 20 \times 30 = 600\text{ m}^2$.'
errores_frecuentes:
- Olvidar que las unidades de área son siempre cuadradas (m²).
- Confundir el valor del ancho óptimo con el área máxima.
- Asumir que 3 lados se dividen en partes iguales de longitud.
afirmaciones_verdaderas:
- El área de un rectángulo con perímetro fijo se maximiza en el vértice de su función cuadrática.
- Para un perímetro cerrado de 4 lados, el área máxima siempre la alcanza el cuadrado.
al_terminar_debes_poder: '**QUÉ:** Resolver problemas de optimización geométrica de áreas mediante funciones cuadráticas.


  **CÓMO:** Modelando el área A(x) = x(P_semi - x) y hallando el vértice x_v = -b/(2a) para maximizar la superficie.


  ![Resumen La resolución de problemas de áreas usando funciones cuadráticas modela superficies geométricas ligadas por perímetros constantes mediante funciones $\mathcal{A}(x) = -ax^2 + bx$, hallando las dimensiones óptimas que maximizan el área en el vértice](/static/img/nodos/resolucion-de-problemas-de-areas-usando-funciones-cuadraticas-resumen.svg)'
