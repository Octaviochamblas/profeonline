semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.DOMINIO_RESULTANTE
resumen_inicial: El dominio de la composición $(f \circ g)(x)$ consiste en todos los
  $x$ del dominio de $g$ tales que su imagen $g(x)$ pertenece al dominio de $f$.
explicacion_simple: 'Para que un número $x$ pueda entrar en la composición $(f \circ
  g)(x)$, debe superar **DOS FILTROS DE SEGURIDAD**:

  1. **Filtro 1:** El número $x$ debe ser una entrada válida para la primera función
  $g$ ($x \in \operatorname{Dom}(g)$).

  2. **Filtro 2:** El resultado que produce $g(x)$ debe ser una entrada válida para
  la segunda función $f$ ($g(x) \in \operatorname{Dom}(f)$).'
explicacion_formal: 'El **dominio de la función compuesta** $f \circ g$ es el conjunto
  intersecado de restricciones:


  $$\operatorname{Dom}(f \circ g) = \{x \in \mathbb{R} \mid x \in \operatorname{Dom}(g)
  \quad \land \quad g(x) \in \operatorname{Dom}(f)\}$$


  **Desglose de la fórmula:**

  - Doble condición de existencia real: 1) Validez de la entrada $x$ en la función
  interna $g$, 2) Validez de la imagen intermedia $g(x)$ en la función externa $f$.'
definiciones_clave: '- **Dominio de la composición ($\operatorname{Dom}(f \circ g)$)**:
  Subconjunto de entradas que garantizan que tanto la evaluación interna como la externa
  existen en $\mathbb{R}$.'
propiedades_relaciones: '- **Inclusión en el dominio interno**: $\operatorname{Dom}(f
  \circ g) \subset \operatorname{Dom}(g)$ siempre.'
ejemplo_guiado:
  enunciado: Determina el dominio de $(f \circ g)(x)$ para $g(x) = x - 2$ y $f(u)
    = \frac{1}{u - 5}$.
  pasos:
  - 'Paso 1: Determinar el dominio de la función interna $g(x) = x - 2$: por ser lineal,
    $\operatorname{Dom}(g) = \mathbb{R}$.Paso 2: Determinar la restricción de la función
    externa $f(u)$: requiere $u \neq 5$.Paso 3: Imponer que la salida $g(x)$ no sea
    igual a $5$: $g(x) \neq 5 \implies x - 2 \neq 5 \implies x \neq 7$.Paso 4: Intersecar
    las condiciones: $x \in \mathbb{R}$ e $x \neq 7$.Paso 5: Concluir que $\operatorname{Dom}(f
    \circ g) = \mathbb{R} \setminus \{7\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al determinar el dominio de $(f \circ g)(x)$ para $g(x) = x - 2$ y $f(u)
    = \frac{1}{u - 5}$, ¿cuál es el conjunto solución?
  choices:
  - text: $\operatorname{Dom}(f \circ g) = \mathbb{R} \setminus \{7\}$
    is_correct: true
  - text: $\operatorname{Dom}(f \circ g) = \mathbb{R} \setminus \{5\}$
    is_correct: false
  - text: $\operatorname{Dom}(f \circ g) = \mathbb{R} \setminus \{2\}$
    is_correct: false
  - text: $\operatorname{Dom}(f \circ g) = \mathbb{R}$
    is_correct: false
  explanation: La alternativa correcta es '$\operatorname{Dom}(f \circ g) = \mathbb{R}
    \setminus \{7\}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el valor $x = 7$ debe ser excluido del dominio de la composición
    $(f \circ g)(x)$?
  choices:
  - text: Porque al evaluar $g(7) = 5$, la salida es 5, lo que anula el denominador
      de la función externa $f$.
    is_correct: true
  - text: Porque 7 es un número primo.
    is_correct: false
  - text: Porque $g(7) = 0$.
    is_correct: false
  - text: Porque la función interna se destruye.
    is_correct: false
  explanation: La alternativa correcta es 'Porque al evaluar $g(7) = 5$, la salida
    es 5, lo que anula el denominador de la función externa $f$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Hallar el dominio de la función interna $\operatorname{Dom}(g)$.'
- 'Paso 2: Hallar las restricciones sobre la función externa $\operatorname{Dom}(f)$.'
- 'Paso 3: Plantear la inecuación o ecuación de restricción imponiendo que $g(x)$
  cumpla las restricciones de $f$.'
- 'Paso 4: Excluir los valores no válidos de la variable $x$.'
errores_correccion: '- **Error común:** Calcular el dominio observando únicamente
  la fórmula simplificada final de la composición.

  - **Cómo corregirlo:** La simplificación algebraica puede ''esconder'' restricciones;
  debes analizar las restricciones del proceso paso a paso.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de composición de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de composición de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La composición de funciones (f o g)(x) equivale a f(g(x))?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición notacional de composición de funciones.
- titulo: ¿La composición de funciones es conmutativa en general?
  respuesta: 'No'
  solucion_pasos:
  - No, en general (f o g)(x) != (g o f)(x).
errores_frecuentes:
- Confundir la composición de funciones $(f \circ g)(x)$ con la multiplicación de
  funciones $(f \cdot g)(x)$.
- Evaluar primero la función externa de la izquierda en lugar de la función interna
  de la derecha.
- Asumir falsamente que la composición de funciones es conmutativa ($(f \circ g)(x)
  = (g \circ f)(x)$).
- Olvidar distribuir coeficientes al sustituir expresiones compuestas en el cálculo
  algebraico.
- Determinar el dominio únicamente desde la fórmula reducida final ignorando las restricciones
  del proceso intermedio.
afirmaciones_verdaderas:
- La composición de funciones $(f \circ g)(x) = f(g(x))$ consiste en evaluar la función
  externa $f$ en el resultado de la función interna $g(x)$.
- El dominio de la composición $\operatorname{Dom}(f \circ g)$ hereda todas las restricciones
  de la función interna $g(x)$ y exige que $g(x) \in \operatorname{Dom}(f)$.
al_terminar_debes_poder: Al finalizar este recurso podrás comprender, evaluar numéricamente
  y calcular algebraicamente composiciones de funciones, reconociendo la no conmutatividad
  y analizando sus dominios resultantes.
