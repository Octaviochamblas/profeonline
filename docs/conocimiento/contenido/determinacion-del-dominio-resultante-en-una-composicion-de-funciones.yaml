semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.DOMINIO_RESULTANTE
resumen_inicial: La determinación del dominio resultante en una composición combina el filtro del dominio interno con la restricción de las imágenes intermedias.
explicacion_simple: |
  El **dominio de la composición $(f \circ g)(x)$** es el grupo de números $x$ que logran pasar exitosamente **dos aduanas o filtros**:

  1. **Filtro 1**: El número $x$ debe ser aceptado por la función de adentro $g$ ($x \in \text{Dom}(g)$).
  2. **Filtro 2**: La respuesta que produce $g(x)$ debe ser aceptada por la función de afuera $f$ ($g(x) \in \text{Dom}(f)$).
  3. **Resultado**: El dominio de $(f \circ g)$ es la intersección de ambas condiciones.
explicacion_formal: |
  El **dominio de la función compuesta** $(f \circ g)$ se define mediante la intersección lógica de conjuntos de restricción:

  $$\text{Dom}(f \circ g) = \{x \in \mathbb{R} \mid x \in \text{Dom}(g) \quad \land \quad g(x) \in \text{Dom}(f)\}$$

  **Procedimiento analítico de construcción:**
  1. Hallar $D_g = \text{Dom}(g)$.
  2. Hallar $D_f = \text{Dom}(f)$.
  3. Resolver el sistema de inecuaciones/ecuaciones para $x$:
     $$x \in D_g \quad \text{y} \quad g(x) \in D_f$$
definiciones_clave: |
  - **Dominio de la función compuesta**: Conjunto de todos los valores reales de $x$ para los cuales la expresión de evaluación encadenada $f(g(x))$ está formalmente definida en $\mathbb{R}$.
propiedades_relaciones: |
  - **Inclusión estricta**: $\text{Dom}(f \circ g) \subseteq \text{Dom}(g)$. Nunca un elemento ajeno a $\text{Dom}(g)$ puede pertenecer al dominio compuesto.
ejemplo_guiado:
  enunciado: 'Determina el dominio resultante de $(f \circ g)(x)$ para $g(x) = \sqrt{x}$ y $f(u) = \frac{1}{u - 3}$.'
  pasos:
    - 'Paso 1: Dominio de la función interna $g(x) = \sqrt{x}$: $x \ge 0 \implies D_g = [0, +\infty[$.'
    - 'Paso 2: Dominio de la función externa $f(u) = \frac{1}{u - 3}$: $u \neq 3 \implies D_f = \mathbb{R} \setminus \{3\}$.'
    - 'Paso 3: Exigir $g(x) \in D_f \implies \sqrt{x} \neq 3 \implies x \neq 9$.'
    - 'Paso 4: Intersectar condiciones: $x \ge 0$ e $x \neq 9 \implies \text{Dom}(f \circ g) = [0, 9[ \ \cup \ ]9, +\infty[ = [0, +\infty[ \setminus \{9\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cómo se define formalmente el conjunto dominio de la composición $(f \\circ g)(x)$?"
    choices:
      - {text: "$\\text{Dom}(f \\circ g) = \\{x \\in \\text{Dom}(g) \\mid g(x) \\in \\text{Dom}(f)\\}$", is_correct: true}
      - {text: "$\\text{Dom}(f \\circ g) = \\text{Dom}(f) \\cup \\text{Dom}(g)$", is_correct: false}
      - {text: "$\\text{Dom}(f \\circ g) = \\text{Rec}(f) \\cap \\text{Rec}(g)$", is_correct: false}
      - {text: "$\\text{Dom}(f \\circ g) = \\mathbb{R}$ en todos los casos.", is_correct: false}
    explanation: "La alternativa correcta es '$\\text{Dom}(f \\circ g) = \\{x \\in \\text{Dom}(g) \\mid g(x) \\in \\text{Dom}(f)\\}$'."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "Si $g(x) = \\sqrt{x}$ y $f(u) = \\frac{1}{u - 3}$, ¿qué valor no negativo queda excluido del dominio de $(f \\circ g)$?"
    choices:
      - {text: "$x = 9$", is_correct: true}
      - {text: "$x = 3$", is_correct: false}
      - {text: "$x = 0$", is_correct: false}
      - {text: "$x = 1$", is_correct: false}
    explanation: "La alternativa correcta es '$x = 9$'. Para $x = 9 \\implies g(9) = 3$, produciendo división por cero en $f(3)$."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Determinar el dominio de la función interna $D_g$.'
  - 'Paso 2: Determinar el dominio de la función externa $D_f$.'
  - 'Paso 3: Plantear la restricción $g(x) \in D_f$ y despejar $x$.'
  - 'Paso 4: Intersectar el conjunto solución del paso 3 con el dominio $D_g$ para obtener el dominio final.'
errores_correccion: |
  - **Error común:** Determinar el dominio observando únicamente la fórmula simplificada de $(f \circ g)(x)$.
  - **Cómo corregirlo:** La simplificación algebraica puede **OCULTAR INDEFINICIONES** intermedias; el dominio debe calcularse evaluando las dos restricciones originales de $g(x)$ y $f(g(x))$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de composición de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de composición de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El dominio resultante de $(f \circ g)$ se obtiene uniendo sin restricción los dominios de $f$ y $g$.'
  - 'Si la fórmula simplificada de $(f \circ g)(x)$ es un polinomio, su dominio es $\mathbb{R}$ sin importar las restricciones iniciales de $g$.'
  - 'Un valor $x$ que no pertenece al dominio de la función interna $g$ puede incluirse en el dominio de $(f \circ g)$ si $f$ es continua.'
  - 'El dominio de la composición equivale al recorrido de la función externa $f$.'
  - 'Determinar el dominio compuesto exige calcular derivadas de primer orden de ambas funciones.'
afirmaciones_verdaderas:
  - 'El dominio resultante de una composición $(f \circ g)$ es el conjunto de valores $x \in \text{Dom}(g)$ tales que su imagen $g(x)$ pertenece al dominio de $f$.'
  - 'Simplificar algebraicamente la regla de $(f \circ g)(x)$ no elimina las restricciones de dominio heredadas por las funciones componentes.'
al_terminar_debes_poder: |
  QUÉ: Determinar rigurosamente el dominio de una función compuesta $(f \circ g)(x)$.
  CÓMO: Hallar $\text{Dom}(g)$, imponer la condición $g(x) \in \text{Dom}(f)$ e intersectar los conjuntos de restricciones.
