semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.DOMINIO_RESULTANTE
resumen_inicial: 'Determinación del dominio resultante en una composición de funciones:
  conceptos, representación y propiedades en Composición de funciones.'
explicacion_simple: 'El dominio de una composición no es tan simple como el de cada
  función por separado: hay que asegurarse de que el resultado intermedio "encaje"
  en la siguiente función.'
explicacion_formal: '### Definición formal


  Formalmente, $\text{Dom}(f\circ g) = \{x \in \text{Dom}(g) : g(x) \in \text{Dom}(f)\}$.
  Esta definición exige cumplir dos condiciones simultáneas: que $x$ sea válido para
  $g$, y que el resultado $g(x)$ sea a su vez válido como entrada de $f$.


  ### Desarrollo didáctico


  El error más común es calcular solo el dominio de $g$, olvidando verificar si su
  resultado cae dentro del dominio permitido de $f$.


  Si $g(x)=x-5$ (dominio $\mathbb{R}$) y $f(x)=\sqrt{x}$ (dominio $[0,+\infty[$):
  para que $(f\circ g)(x)=\sqrt{x-5}$ esté definida, se necesita $x-5\geq0$, es decir
  $x\geq5$. Aunque $g$ acepta todo $\mathbb{R}$, la composición exige la restricción
  adicional impuesta por $f$.'
definiciones_clave: '- **Determinación del dominio resultante en una composición de
  funciones**: Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a determinación del dominio resultante en
  una composición de funciones.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a determinación del
    dominio resultante en una composición de funciones.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a determinación del dominio resultante
    en una composición de funciones.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
