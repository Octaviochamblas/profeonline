semantic_id: MAT.NUM.ENTEROS_CONJUNTO.CARDINALES
resumen_inicial: "Los números cardinales son los naturales más el cero: $\\mathbb{N}_0=\\{0,1,2,3,\\ldots\\}$. Sirven para responder '¿cuántos hay?', incluso cuando la respuesta es ninguno."
explicacion_simple: |
  Piensa en una caja vacía: adentro hay cero manzanas. Eso también es una cantidad válida. Los
  cardinales son los naturales (1, 2, 3…) más el cero, porque el cero también responde a la
  pregunta "¿cuántos hay?" cuando la respuesta es "ninguno".
explicacion_formal: |
  El conjunto de los números cardinales, $\mathbb{N}_0$, se define como la unión de los naturales
  con el cero: $\mathbb{N}_0 = \mathbb{N} \cup \{0\} = \{0, 1, 2, 3, \ldots\}$. Es infinito y posee
  primer elemento $0$, que actúa como neutro aditivo.
definiciones_clave: |
  **Número cardinal**: elemento de $\mathbb{N}_0 = \{0, 1, 2, 3, \ldots\}$, es decir, un natural o el
  cero. **Neutro aditivo**: el cero, porque sumarlo no cambia el valor de otro número.
propiedades_relaciones: |
  $\mathbb{N} \subset \mathbb{N}_0$: todo natural es cardinal, pero el cero es cardinal sin ser
  natural (bajo la convención sin cero de este curso). $\mathbb{N}_0$ tiene primer elemento ($0$) y
  es infinito hacia arriba, igual que $\mathbb{N}$.
ejemplo_guiado:
  enunciado: "¿A qué conjunto pertenece el resultado de $8 - 8$: a $\\mathbb{N}$, a $\\mathbb{N}_0$ o a ambos?"
  pasos:
    - "Se calcula la resta: $8 - 8 = 0$."
    - 'Se verifica que $0 \notin \mathbb{N}$ (los naturales de este curso empiezan en $1$).'
    - 'Se verifica que $0 \in \mathbb{N}_0$.'
    - "Conclusión: el resultado pertenece solo a los cardinales, no a los naturales."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Cuál de estos números pertenece a $\\mathbb{N}_0$ pero NO a $\\mathbb{N}$ (con la convención sin cero)?"
    choices:
      - {text: "$1$", is_correct: false}
      - {text: "$0$", is_correct: true}
      - {text: "$5$", is_correct: false}
      - {text: "$-1$", is_correct: false}
    explanation: "La correcta es $0$: pertenece a $\\mathbb{N}_0$ pero no a $\\mathbb{N}$ bajo la convención sin cero."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo razonamiento del ejemplo guiado, ¿a qué conjunto pertenece el resultado de $6 - 6$?"
    choices:
      - {text: "Solo a $\\mathbb{N}$", is_correct: false}
      - {text: "Solo a $\\mathbb{N}_0$", is_correct: true}
      - {text: "A ambos", is_correct: false}
      - {text: "A ninguno", is_correct: false}
    explanation: "La correcta es Solo a $\\mathbb{N}_0$, porque $6-6=0$ y el cero no pertenece a $\\mathbb{N}$ en este curso."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar si el conjunto de estudio comienza desde el valor $1$ (Naturales) o el valor $0$ (Cardinales)."
  - 'Paso 2: Verificar la pertenencia de un número dado al conjunto $\mathbb{N}_0$ comprobando que sea un entero no negativo.'
  - "Paso 3: Aplicar la propiedad del primer elemento para determinar el origen de la secuencia en la recta numérica."
errores_correccion: |
  Un error frecuente es pensar que $\mathbb{N}$ y $\mathbb{N}_0$ son el mismo conjunto: la diferencia
  es exactamente el cero. Antes de responder, revisa si el problema pide naturales (sin cero, en este
  curso) o cardinales (con cero). Otro error es creer que el cero "no representa una cantidad real";
  representa la ausencia de cantidad, que también es información válida.

ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: '¿A qué conjunto numérico pertenece el resultado de la operación $5 - 5$ si consideramos los conjuntos $\mathbb{N}$ y $\mathbb{N}_0$?'
    alternativas:
      - 'Solo a $\mathbb{N}_0$'
      - 'Solo a $\mathbb{N}$'
      - 'A ambos'
    respuesta: 'Solo a $\mathbb{N}_0$'
    solucion_pasos:
      - "Se realiza la resta: $5 - 5 = 0$."
      - 'Se verifica que $0 \notin \mathbb{N}$ (el conjunto de los naturales comienza en 1).'
      - 'Se verifica que $0 \in \mathbb{N}_0$.'
      - "Conclusión: El resultado pertenece al conjunto de los Números Cardinales."
  - titulo: "Ejemplo 2"
    enunciado: 'Determine los tres primeros elementos del conjunto $\mathbb{N}_0$.'
    alternativas:
      - '$\{0, 1, 2\}$'
      - '$\{1, 2, 3\}$'
      - '$\{0, 1, 3\}$'
    respuesta: '$\{0, 1, 2\}$'
    solucion_pasos:
      - 'Se identifica la definición de números cardinales como $\mathbb{N} \cup \{0\}$.'
      - "Se establece el primer elemento como el $0$."
      - "Se identifican los sucesores inmediatos: $1$ y $2$."
      - 'Conclusión: Los tres primeros elementos son $\{0, 1, 2\}$.'
  - titulo: '¿Pertenece el número $3$ al conjunto $\mathbb{N}_0$?'
    respuesta: "Sí"
    solucion_pasos:
      - '$3$ es un entero positivo, por lo tanto $3 \in \mathbb{N}$.'
      - 'Como $\mathbb{N} \subset \mathbb{N}_0$, también se cumple $3 \in \mathbb{N}_0$.'
      - "Por lo tanto, $3$ sí pertenece a los Números Cardinales."
  - titulo: '¿Pertenece el número $-2$ al conjunto $\mathbb{N}_0$?'
    respuesta: "No"
    solucion_pasos:
      - "$-2$ es un número entero negativo."
      - '$\mathbb{N}_0 = \{0, 1, 2, 3, \ldots\}$ contiene solo enteros no negativos.'
      - 'Por lo tanto, $-2 \notin \mathbb{N}_0$.'
errores_frecuentes:
  - "El cero no pertenece a ningún conjunto numérico porque no representa una cantidad real."
  - 'Los conjuntos $\mathbb{N}$ y $\mathbb{N}_0$ son idénticos.'
  - "El cero es el número más pequeño que existe."
  - "Los números cardinales incluyen a los números negativos."
  - '$\mathbb{N}_0$ tiene infinitos elementos, pero $\mathbb{N}$ es finito.'
afirmaciones_verdaderas:
  - "El 0 pertenece al conjunto de los números cardinales."
  - "0, 1, 2 y 3 son todos números cardinales."
al_terminar_debes_poder: |
  Distinguir si un número o el resultado de una operación pertenece a $\mathbb{N}$, a $\mathbb{N}_0$
  o a ambos, aplicando correctamente la diferencia de un solo elemento (el cero) entre los dos
  conjuntos.

fuente: "Matemática Moraleja Tomo 1 p.21"
estado: publicado
