semantic_id: MAT.GEO.CUERPOS_REDONDOS_BASE.ESFERA_POR_ROTACION
resumen_inicial: 'Generación de la esfera como sólido de revolución: conceptos, teoremas,
  propiedades geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: Si tomas un semicírculo (como una medialuna) y lo giras alrededor
  de su lado recto (el diámetro), el barrido que genera forma una esfera perfecta.
explicacion_formal: '![Generación de la esfera por rotación](/static/img/geometria/espacio-cuerpos/esfera-por-rotacion.svg)


  ### Definición formal


  Al rotar un semicírculo de radio $r$ 360° alrededor de su diámetro (que actúa como
  eje), se genera una esfera de radio $r$, idéntico al del semicírculo original.


  ### Desarrollo didáctico


  En la figura, el semicírculo resaltado gira alrededor del eje vertical (su diámetro),
  generando la esfera mostrada a la derecha. A diferencia del cilindro y el cono,
  la esfera tiene una única medida (el radio), que coincide exactamente con el radio
  del semicírculo generador.'
definiciones_clave: '- **Generación de la esfera como sólido de revolución**: Elemento
  o propiedad fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a generación de la esfera como sólido de revolución.'
