procedimiento:
- 'Paso 1: Identifica el semicírculo generador y su diámetro (el lado recto, que actúa
  como eje).'
- 'Paso 2: Reconoce que el radio del semicírculo es igual al radio de la esfera resultante.'
- 'Paso 3: Confirma que el giro completo de 360° genera la esfera cerrada en su totalidad.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
