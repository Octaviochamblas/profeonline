semantic_id: MAT.ALG.DESIG_PROPIEDADES.INVERSO_MULTIPLICATIVO
resumen_inicial: Tomar recíprocos en ambos lados de una desigualdad de números del
  mismo signo invierte el sentido de la desigualdad.
explicacion_simple: 'Si dos números tienen el mismo signo (ambos positivos o ambos
  negativos) y se les toma el recíproco o inverso multiplicativo (es decir, dar vuelta
  a las fracciones $\frac{1}{a}$ y $\frac{1}{b}$), **EL SENTIDO DE LA DESIGUALDAD
  SE INVIERTE**.

  Por ejemplo, como $2 < 5$, al tomar recíprocos resulta que $\frac{1}{2} > \frac{1}{5}$
  ($0{,}5 > 0{,}2$).'
explicacion_formal: 'Para constantes $a, b \in \mathbb{R}$ no nulas con el **mismo
  signo** ($a \cdot b > 0$):


  $$a < b \iff \frac{1}{a} > \frac{1}{b} \quad (a \cdot b > 0)$$

  $$a > b \iff \frac{1}{a} < \frac{1}{b} \quad (a \cdot b > 0)$$


  **Desglose de la fórmula:**

  - $a \cdot b > 0$: Exige que ambos números compartan el mismo signo para que la
  función recíproca $f(x) = \frac{1}{x}$ sea monótona decreciente.'
definiciones_clave: '- **Propiedad de los recíprocos / inversos**: Inversión del sentido
  de orden al aplicar la función $\frac{1}{x}$ sobre números del mismo signo.'
propiedades_relaciones: '- **Números de distinto signo**: Si los números tienen distinto
  signo ($a < 0 < b$), tomar recíprocos NO invierte el sentido: $\frac{1}{a} < \frac{1}{b}$
  ya que el negativo sigue siendo menor que el positivo.'
ejemplo_guiado:
  enunciado: Aplica la propiedad de los recíprocos a la desigualdad de números positivos
    $4 < 10$ y comprueba la validez numérica de $\frac{1}{4}$ y $\frac{1}{10}$.
  pasos:
  - 'Paso 1: Escribir la desigualdad inicial: $4 < 10$.Paso 2: Calcular el recíproco
    del primer miembro: $\frac{1}{4} = 0{,}25$.Paso 3: Calcular el recíproco del segundo
    miembro: $\frac{1}{10} = 0{,}10$.Paso 4: Invertir el sentido del símbolo $<$ a
    $>$: $\frac{1}{4} > \frac{1}{10}$.Paso 5: Comprobar numéricamente: $0{,}25 > 0{,}10$
    es VERDADERO.'
checkpoints:
- placement: after_explicacion_formal
  question: Al tomar recíprocos en la desigualdad $4 < 10$ entre números del mismo
    signo, ¿cuál es el resultado correcto?
  choices:
  - text: $\frac{1}{4} > \frac{1}{10}$
    is_correct: true
  - text: $\frac{1}{4} < \frac{1}{10}$
    is_correct: false
  - text: $\frac{1}{4} = \frac{1}{10}$
    is_correct: false
  - text: $-4 > -10$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{1}{4} > \frac{1}{10}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué condición deben cumplir dos números $a$ y $b$ para que al tomar recíprocos
    $\frac{1}{a}$ y $\frac{1}{b}$ se invierta la desigualdad?
  choices:
  - text: Deben tener estrictamente el mismo signo ($a \cdot b > 0$).
    is_correct: true
  - text: Deben tener distinto signo.
    is_correct: false
  - text: Ambos deben ser igual a cero.
    is_correct: false
  - text: Uno debe ser un número imaginario.
    is_correct: false
  explanation: La alternativa correcta es 'Deben tener estrictamente el mismo signo
    ($a \cdot b > 0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que ambos números de la desigualdad tengan el mismo signo.'
- 'Paso 2: Calcular el recíproco $\frac{1}{a}$ y $\frac{1}{b}$.'
- 'Paso 3: Invertir el sentido del símbolo de desigualdad.'
errores_correccion: '- **Error común:** Tomar recíprocos de números con distinto signo
  e invertir el símbolo (ejemplo: si $-2 < 5$, decir que $-\frac{1}{2} > \frac{1}{5}$,
  lo cual es falso).

  - **Cómo corregirlo:** Si tienen distinto signo, el recíproco negativo seguirá siendo
  menor que el positivo, por lo que el símbolo NO cambia.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de propiedades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de propiedades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar un número a ambos lados de una desigualdad conserva el sentido?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Multiplicar por un número negativo invierte el sentido de una desigualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la regla de inversión con escalares negativos.
errores_frecuentes:
  - 'Al tomar recíprocos en la desigualdad entre números positivos $3 < 7$, la relación conserva el sentido obteniendo $\frac{1}{3} < \frac{1}{7}$.'
  - 'Tomar recíprocos en una desigualdad entre números de distinto signo $-2 < 5$ invierte el símbolo produciendo $-\frac{1}{2} > \frac{1}{5}$.'
  - 'La regla de inversión de recíprocos $\frac{1}{a} > \frac{1}{b}$ se aplica de forma idéntica sin importar los signos de $a$ y $b$.'
  - 'Al despejar $\frac{1}{x} > \frac{1}{4}$ con $x > 0$, la inecuación resultante es $x > 4$.'
  - 'El inverso multiplicativo de un número real negativo resulta en una constante strictly positiva.'
afirmaciones_verdaderas:
  - 'Tomar recíprocos entre dos números reales del mismo signo invierte la dirección del símbolo de la desigualdad.'
  - 'Tomar recíprocos entre dos números reales de distinto signo ($a < 0 < b$) conserva el sentido original del símbolo.'
al_terminar_debes_poder: |
  QUÉ: Aplicar la propiedad de recíprocos o inversos multiplicativos en desigualdades.
  CÓMO: Evaluar si los miembros poseen el mismo signo (para invertir el símbolo) o distinto signo (para conservar el símbolo) al calcular $\frac{1}{a}$ y $\frac{1}{b}$.
fuente: 'Texto escolar MINEDUC — Álgebra / Propiedades de Desigualdades'
