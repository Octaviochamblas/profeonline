procedimiento:
- Verificar que ambos términos de la desigualdad sean estrictamente del mismo signo
  (ambos positivos o ambos negativos).
- Tomar el inverso multiplicativo (recíproco) de cada término.
- Invertir el sentido del símbolo de desigualdad.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en uso de recíprocos en desigualdades.
ejemplos:
- titulo: Inverso de números positivos
  enunciado: Compara los inversos multiplicativos de $2$ y $5$, sabiendo que $2 <
    5$.
  solucion_pasos:
  - Ambos números son positivos y $2 < 5$.
  - 'Se toman los inversos: $\frac{1}{2}$ y $\frac{1}{5}$.'
  - 'Como tienen el mismo signo, se invierte el sentido: $\frac{1}{2} > \frac{1}{5}$.'
- titulo: Inverso de variables
  enunciado: Si $x > 3$, ¿qué se puede afirmar sobre $\frac{1}{x}$?
  solucion_pasos:
  - Dado que $x > 3$, ambos valores son positivos.
  - Se toma el inverso multiplicativo de ambos lados.
  - Se invierte la desigualdad obteniendo $\frac{1}{x} < \frac{1}{3}$.
  - Además, al ser positivos, se tiene $0 < \frac{1}{x} < \frac{1}{3}$.
- titulo: ¿Se invierte la desigualdad al tomar inversos si un número es negativo y
    otro positivo?
  respuesta: 'No'
  solucion_pasos:
  - Si $a < 0$ y $b > 0$, entonces $\frac{1}{a}$ es negativo y $\frac{1}{b}$ es positivo.
  - Un número negativo siempre es menor que uno positivo, por lo que $\frac{1}{a}
    < \frac{1}{b}$ y el sentido se mantiene.
- titulo: ¿Es correcta la implicación si $a < b < 0$, entonces $\frac{1}{a} > \frac{1}{b}$?
  respuesta: Sí
  solucion_pasos:
  - Como $a$ y $b$ son ambos negativos, tienen el mismo signo.
  - Al tomar el inverso multiplicativo, la propiedad indica que se debe invertir el
    sentido de la desigualdad.
errores_frecuentes:
- Si $a < b$, entonces siempre se cumple que $\frac{1}{a} < \frac{1}{b}$ independientemente
  de los signos.
- El inverso multiplicativo de un número cambia el signo del número original.
- Si $a < 0 < b$, al aplicar el inverso se obtiene $\frac{1}{a} > \frac{1}{b}$.
- El cero tiene inverso multiplicativo y mantiene la relación de orden.
- Si $x > y$, el inverso $\frac{1}{x}$ siempre será igual al inverso de $y$.
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_ponder: Resolver e interpretar inecuaciones e intervalos utilizando
  uso de recíprocos en desigualdades.
