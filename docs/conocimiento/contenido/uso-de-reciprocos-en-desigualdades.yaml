semantic_id: MAT.ALG.DESIG_PROPIEDADES.INVERSO_MULTIPLICATIVO
resumen_inicial: 'Uso de recíprocos en desigualdades: relaciones de orden, intervalos
  y resolución en Propiedades de las desigualdades.'
explicacion_simple: Cuando se toman los inversos multiplicativos de ambos miembros
  de una desigualdad, el sentido de la desigualdad puede cambiar dependiendo de los
  signos de los números involucrados.
explicacion_formal: '### Definición formal

  Si $0 < a < b$, entonces $\frac{1}{a} > \frac{1}{b}$.

  Si $a < b < 0$, entonces $\frac{1}{a} > \frac{1}{b}$.


  ### Desarrollo didáctico

  Esta propiedad se cumple porque, al dividir la unidad entre una cantidad mayor,
  el resultado es una fracción más pequeña. Sin embargo, es vital asegurar que ambos
  valores tengan el mismo signo. Si tienen signos opuestos (por ejemplo, $a < 0 <
  b$), un número negativo siempre será menor que uno positivo, por lo que el inverso
  del negativo también será menor que el inverso del positivo, y el sentido no se
  invierte.'
definiciones_clave: '- **Uso de recíprocos en desigualdades**: Concepto fundamental
  de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a uso de recíprocos en desigualdades.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de uso de recíprocos
    en desigualdades.
  pasos:
  - Identificar el tipo de desigualdad o inecuación dada.
  - Aplicar las propiedades algebraicas de uso de recíprocos en desigualdades, invirtiendo
    el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
checkpoints:
