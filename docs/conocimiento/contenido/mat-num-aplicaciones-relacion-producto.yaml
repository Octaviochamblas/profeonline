semantic_id: MAT.NUM.APLICACIONES_MCM_MCD.RELACION_PRODUCTO
resumen_inicial: 'Para dos enteros positivos $a$ y $b$, el producto de su m.c.m. por
  su M.C.D. es igual al producto de los números: $\operatorname{mcm}(a,b) \cdot \operatorname{MCD}(a,b)
  = a \cdot b$.'
explicacion_simple: Existe una hermosa relación directa que conecta al m.c.m., al
  M.C.D. y al producto de dos números enteros. Al multiplicar el máximo común divisor
  por el mínimo común múltiplo de dos números, obtenemos exactamente el mismo resultado
  que multiplicar directamente los dos números entre sí.
explicacion_formal: 'Para cualesquiera dos enteros positivos $a, b \in \mathbb{N}$,
  la **Teorema de la Identidad del Producto** establece la igualdad matemática:


  $$\operatorname{mcm}(a, b) \cdot \operatorname{MCD}(a, b) = a \cdot b$$


  **Desglose de la fórmula:**

  - $\operatorname{mcm}(a, b)$: Mínimo común múltiplo de $a$ y $b$.

  - $\operatorname{MCD}(a, b)$: Máximo común divisor de $a$ y $b$.

  - $a \cdot b$: Producto directo de los dos enteros originales.


  > **Complemento didáctico:** Esta fórmula es válida ÚNICAMENTE para dos números
  ($k=2$). No se cumple en general para tres o más números.'
definiciones_clave: '- **Identidad del producto m.c.m.-M.C.D.**: Ecuación $\operatorname{mcm}(a,
  b) \cdot \operatorname{MCD}(a, b) = a \cdot b$.

  - **Restricción de dimensión**: Validez exclusiva para pares de números ($k=2$).'
propiedades_relaciones: '- **Cálculo despejado del m.c.m.**: $\operatorname{mcm}(a,b)
  = \frac{a \cdot b}{\operatorname{MCD}(a,b)}$.'
ejemplo_guiado:
  enunciado: Verifique la identidad del producto entre los números $a = 12$ y $b =
    18$ sabiendo que $\operatorname{MCD}(12, 18) = 6$ y $\operatorname{mcm}(12, 18)
    = 36$.
  pasos:
  - 'Paso 1: Calcular el producto de los números: $a \cdot b = 12 \cdot 18 = 216$.'
  - 'Paso 2: Calcular el producto de $\operatorname{mcm} \cdot \operatorname{MCD}$:
    $36 \cdot 6 = 216$.'
  - 'Conclusión: Como $216 = 216$, la identidad $\operatorname{mcm}(a,b) \cdot \operatorname{MCD}(a,b)
    = a \cdot b$ se cumple exactamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la relación matemática correcta entre mcm(a,b), MCD(a,b) y el
    producto a · b para dos números?
  choices:
  - text: mcm(a,b) · MCD(a,b) = a · b
    is_correct: true
  - text: mcm(a,b) + MCD(a,b) = a + b
    is_correct: false
  - text: mcm(a,b) / MCD(a,b) = a · b
    is_correct: false
  - text: mcm(a,b) · MCD(a,b) = a + b
    is_correct: false
  explanation: La alternativa correcta es 'mcm(a,b) · MCD(a,b) = a · b'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 12 y 18, ¿cuál fue el valor idéntico del producto
    obtenido en ambos lados?
  choices:
  - text: '216'
    is_correct: true
  - text: '42'
    is_correct: false
  - text: '108'
    is_correct: false
  - text: '36'
    is_correct: false
  explanation: La alternativa correcta es '216'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el producto directo de las dos cantidades $a \cdot b$.'
- 'Paso 2: Calcular el producto del $\operatorname{mcm}(a,b)$ por el $\operatorname{MCD}(a,b)$.'
- 'Paso 3: Comprobar la igualdad exacta de ambos valores o despejar una incógnita.'
errores_correccion: '- **Error 1: Aplicar la identidad a tres números ($a \cdot b
  \cdot c = \operatorname{mcm} \cdot \operatorname{MCD}$).** **Cómo corregirlo:**
  La fórmula vale ÚNICAMENTE para dos números.


  - **Error 2: Sumar el m.c.m y el M.C.D. en lugar de multiplicarlos.** **Cómo corregirlo:**
  La relación es MULTIPLICATIVA: $\operatorname{mcm} \cdot \operatorname{MCD} = a
  \cdot b$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el producto de dos números es 180 y su MCD es 3, ¿cuál es su mcm?
  alternativas:
  - '60'
  - '540'
  - '183'
  respuesta: '60'
  solucion_pasos:
  - $\operatorname{mcm} = \frac{a \cdot b}{\operatorname{MCD}} = \frac{180}{3} = 60$.
- titulo: Ejemplo 2
  enunciado: Si dos números son coprimos (MCD = 1), ¿a qué es igual su mcm?
  alternativas:
  - Al producto directo de los números (a · b)
  - A 1
  - A 0
  respuesta: Al producto directo de los números (a · b)
  solucion_pasos:
  - $\operatorname{mcm} \cdot 1 = a \cdot b \implies \operatorname{mcm} = a \cdot
    b$.
- titulo: ¿Se cumple que mcm(a, b) · MCD(a, b) = a · b para cualquier par de enteros
    positivos?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental en aritmética.
- titulo: ¿Aplica esta fórmula de multiplicación para un trío de tres números a, b,
    c?
  respuesta: 'No'
  solucion_pasos:
  - No, en tres números no se cumple en general.
errores_frecuentes:
- La identidad de multiplicidad aplica exactamente igual para tres o más enteros.
- Sumar el m.c.m. y el M.C.D. de dos números da como resultado el producto de los
  números.
- Si dos números son coprimos su mínimo común múltiplo es idéntico a cero.
- Multiplicar el m.c.m. por el M.C.D. produce siempre un número primo.
- Despejar el m.c.m. exige restar el M.C.D. al producto de los enteros.
afirmaciones_verdaderas:
- Para dos enteros positivos $a$ y $b$, se cumple $\operatorname{mcm}(a,b) \cdot \operatorname{MCD}(a,b)
  = a \cdot b$.
- Si dos enteros son coprimos (MCD = 1), su m.c.m. es igual a su producto directo
  $a \cdot b$.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la relación $\operatorname{mcm}(a,b)
  \cdot \operatorname{MCD}(a,b) = a \cdot b$, despejando el m.c.m., el M.C.D. o el
  producto de dos números.
