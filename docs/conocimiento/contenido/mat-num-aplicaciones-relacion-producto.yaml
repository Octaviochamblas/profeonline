semantic_id: MAT.NUM.APLICACIONES_MCM_MCD.RELACION_PRODUCTO
resumen_inicial: "Para dos números naturales, el producto de su MCM y su MCD es igual al producto de los números: MCM(a,b)·MCD(a,b) = a·b."
explicacion_simple: |
  ¿Sabías que los números tienen conexiones secretas? Si tomas el 4 y el 6, calculas su
  MCM (12) y su MCD (2), y los multiplicas, obtienes $12\times2=24$. ¡Y resulta que 24 es
  exactamente el producto de los números originales ($4\times6=24$)! Esta propiedad no es
  coincidencia: funciona para cualquier par de números naturales.
explicacion_formal: |
  Para dos números naturales $a$ y $b$: $\text{MCM}(a,b)\cdot\text{MCD}(a,b)=a\cdot b$. Esto
  ocurre porque el MCD toma cada factor primo con su menor exponente ($\min(e_i,f_i)$) y
  el MCM con su mayor exponente ($\max(e_i,f_i)$), y siempre se cumple
  $\min(e_i,f_i)+\max(e_i,f_i)=e_i+f_i$. La relación permite despejar cualquier variable si
  se conocen las otras tres, pero solo es válida para **dos** números, no para tres o más.
definiciones_clave: |
  **Relación producto-MCM-MCD**: identidad algebraica que conecta las cuatro cantidades
  $a$, $b$, $\text{MCM}(a,b)$ y $\text{MCD}(a,b)$, válida únicamente para pares de números.
propiedades_relaciones: |
  De la fórmula se derivan $\text{MCM}(a,b)=\frac{a\cdot b}{\text{MCD}(a,b)}$ y
  $\text{MCD}(a,b)=\frac{a\cdot b}{\text{MCM}(a,b)}$, útiles cuando ya se conoce uno de los
  dos valores.
ejemplo_guiado:
  enunciado: "Si el MCD de dos números es 5 y su producto es 150, calcula su MCM."
  pasos:
    - 'Aplicamos la fórmula: $\text{MCM}\cdot\text{MCD}=a\cdot b$.'
    - 'Sustituimos: $\text{MCM}\cdot5=150$.'
    - 'Conclusión: $\text{MCM}=150\div5=30$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Para cuántos números es válida la relación MCM(a,b)·MCD(a,b) = a·b?"
    choices:
      - {text: "Solo para dos números", is_correct: true}
      - {text: "Para cualquier cantidad de números", is_correct: false}
      - {text: "Solo para tres números", is_correct: false}
      - {text: "Solo para números primos", is_correct: false}
    explanation: "La correcta es Solo para dos números: la identidad no se cumple en general para conjuntos de tres o más."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, si el MCM de dos números es 24 y su producto es 96, ¿cuál es su MCD?"
    choices:
      - {text: "4", is_correct: true}
      - {text: "2", is_correct: false}
      - {text: "2304", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 4: $\\text{MCD}=96\\div24=4$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Escribe la fórmula fundamental de la relación: $\text{MCM}(a, b) \cdot \text{MCD}(a, b) = a \cdot b$.'
  - 'Paso 2: Identifica cuáles son los valores conocidos en el problema (los números $a$ y $b$, el MCM, o el MCD).'
  - 'Paso 3: Sustituye los valores conocidos en la fórmula.'
  - 'Paso 4: Despeja la variable desconocida realizando las operaciones algebraicas correspondientes (multiplicación o división).'
errores_correccion: |
  Un error frecuente es intentar aplicar esta propiedad para tres o más números, donde no
  se cumple. Otro error es despejar incorrectamente la fórmula (multiplicar en lugar de
  dividir, o viceversa).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Si el MCD de dos números es $6$ y su producto es $360$, calcula su MCM.
    alternativas:
      - "60"
      - "2160"
      - "6"
    respuesta: "60"
    solucion_pasos:
      - 'Paso a: Planteamos la fórmula: $\text{MCM}(a, b) \cdot \text{MCD}(a, b) = a \cdot b$.'
      - 'Paso b: Reemplazamos los datos conocidos: $\text{MCM}(a, b) \cdot 6 = 360$.'
      - 'Paso c: Despejamos el MCM dividiendo el producto por el MCD: $\text{MCM}(a, b) = \frac{360}{6}$.'
      - 'Paso d: Resolvemos la división: $\text{MCM}(a, b) = 60$.'
  - titulo: Ejemplo 2
    enunciado: El MCM de $12$ y $18$ es $36$. Calcula su MCD usando la propiedad del producto.
    alternativas:
      - "6"
      - "18"
      - "216"
    respuesta: "6"
    solucion_pasos:
      - 'Paso a: Los números son $a = 12$ y $b = 18$. Calculamos su producto: $12 \cdot 18 = 216$.'
      - 'Paso b: Usamos la fórmula: $36 \cdot \text{MCD}(12, 18) = 216$.'
      - 'Paso c: Despejamos el MCD: $\text{MCD}(12, 18) = \frac{216}{36}$.'
      - 'Paso d: Realizamos la división: $\text{MCD}(12, 18) = 6$.'
  - titulo: 'Si el MCD de dos números es $4$ y su MCM es $48$, ¿es el producto de estos números igual a $192$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'La propiedad establece que el producto de los números $a \cdot b$ es igual a $\text{MCM}(a, b) \cdot \text{MCD}(a, b)$.'
      - 'Multiplicamos el MCM y el MCD: $48 \cdot 4 = 192$.'
      - 'Por lo tanto, el producto de los números es efectivamente $192$.'
  - titulo: '¿Se puede aplicar directamente la fórmula $\text{MCM}(a, b, c) \cdot \text{MCD}(a, b, c) = a \cdot b \cdot c$ para tres números?'
    respuesta: 'No'
    solucion_pasos:
      - 'La relación del producto solo es válida estrictamente para parejas de números ($2$ números).'
      - 'Para tres o más números, la identidad no se cumple en general (por ejemplo, para $2, 4$ y $8$, su MCM es $8$, su MCD es $2$, el producto del MCM y MCD es $16$, pero el producto de los números es $64$).'
errores_frecuentes:
  - Intentar aplicar esta propiedad para un conjunto de tres o más números, donde no se cumple.
  - Confundir la operación y sumar los números o el MCM/MCD en lugar de multiplicarlos.
  - Despejar incorrectamente la fórmula, por ejemplo, multiplicando el producto de los números por el MCD para obtener el MCM en lugar de dividir.
  - Pensar que la relación es $\text{MCM} + \text{MCD} = a \cdot b$.
  - Calcular mal el producto de los dos números, arrastrando el error al calcular el MCM o MCD.
afirmaciones_verdaderas:
  - "MCM(a,b)·MCD(a,b) es igual al producto a·b."
  - "Esta relación producto solo es válida para dos números."
al_terminar_debes_poder: |
  Aplicar la relación MCM(a,b)·MCD(a,b)=a·b para despejar cualquiera de las cuatro
  cantidades conociendo las otras tres.
fuente: Teoría de Números
estado: publicado
