procedimiento:
- 'Paso 1: Calcular el producto directo de las dos cantidades $a \cdot b$.'
- 'Paso 2: Calcular el producto del $\operatorname{mcm}(a,b)$ por el $\operatorname{MCD}(a,b)$.'
- 'Paso 3: Comprobar la igualdad exacta de ambos valores o despejar una incógnita.'
errores_correccion: '- **Error 1: Aplicar la identidad a tres números ($a \cdot b \cdot c = \operatorname{mcm} \cdot \operatorname{MCD}$).** **Cómo corregirlo:** La fórmula vale ÚNICAMENTE para dos números.


  - **Error 2: Sumar el m.c.m y el M.C.D. en lugar de multiplicarlos.** **Cómo corregirlo:** La relación es MULTIPLICATIVA: $\operatorname{mcm} \cdot \operatorname{MCD} = a \cdot b$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si el producto de dos números es 180 y su MCD es 3, ¿cuál es su mcm?
  alternativas:
  - '60'
  - '540'
  - '183'
  respuesta: '60'
  solucion_pasos:
  - $\operatorname{mcm} = \frac{a \cdot b}{\operatorname{MCD}} = \frac{180}{3} = 60$.
- titulo: Ejemplo 2
  enunciado: Si dos números son coprimos (MCD = 1), ¿a qué es igual su mcm?
  alternativas:
  - Al producto directo de los números (a · b)
  - A 1
  - A 0
  respuesta: Al producto directo de los números (a · b)
  solucion_pasos:
  - $\operatorname{mcm} \cdot 1 = a \cdot b \implies \operatorname{mcm} = a \cdot b$.
- titulo: ¿Se cumple que mcm(a, b) · MCD(a, b) = a · b para cualquier par de enteros positivos?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental en aritmética.
  alternativas:
