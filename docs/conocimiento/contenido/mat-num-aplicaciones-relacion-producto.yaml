    is_correct: true
  - text: mcm(a,b) + MCD(a,b) = a + b
    is_correct: false
  - text: mcm(a,b) / MCD(a,b) = a · b
    is_correct: false
  - text: mcm(a,b) · MCD(a,b) = a + b
    is_correct: false
  explanation: La alternativa correcta es 'mcm(a,b) · MCD(a,b) = a · b'.
  reinforcement_section: Explicación formal
