semantic_id: MAT.NUM.APLICACIONES_MCM_MCD.RELACION_PRODUCTO
resumen_inicial: 'Para dos enteros positivos $a$ y $b$, el producto de su m.c.m. por su M.C.D. es igual al producto de los números: $\operatorname{mcm}(a,b) \cdot \operatorname{MCD}(a,b) = a \cdot b$.'
explicacion_simple: 'Existe una hermosa relación directa que conecta al m.c.m., al M.C.D. y al producto de dos números enteros. Al multiplicar el máximo común divisor por el mínimo común múltiplo de dos números, obtenemos exactamente el mismo resultado que multiplicar directamente los dos números entre sí.


  ![Relación entre m.c.m., M.C.D. y el producto de dos números](/static/img/nodos/relacion-entre-mcm-mcd-y-el-producto-de-dos-numeros-intro.svg)'
explicacion_formal: 'Para cualesquiera dos enteros positivos $a, b \in \mathbb{N}$, la **Teorema de la Identidad del Producto** establece la igualdad matemática:


  $$\operatorname{mcm}(a, b) \cdot \operatorname{MCD}(a, b) = a \cdot b$$


  **Desglose de la fórmula:**

  - $\operatorname{mcm}(a, b)$: Mínimo común múltiplo de $a$ y $b$.

  - $\operatorname{MCD}(a, b)$: Máximo común divisor de $a$ y $b$.

  - $a \cdot b$: Producto directo de los dos enteros originales.


  > **Complemento didáctico:** Esta fórmula es válida ÚNICAMENTE para dos números ($k=2$). No se cumple en general para tres o más números.'
definiciones_clave: '- **Identidad del producto m.c.m.-M.C.D.**: Ecuación $\operatorname{mcm}(a, b) \cdot \operatorname{MCD}(a, b) = a \cdot b$.

  - **Restricción de dimensión**: Validez exclusiva para pares de números ($k=2$).'
propiedades_relaciones: '- **Cálculo despejado del m.c.m.**: $\operatorname{mcm}(a,b) = \frac{a \cdot b}{\operatorname{MCD}(a,b)}$.'
ejemplo_guiado:
  enunciado: 'Verifique la identidad del producto entre los números $a = 12$ y $b = 18$ sabiendo que $\operatorname{MCD}(12, 18) = 6$ y $\operatorname{mcm}(12, 18) = 36$.


    ![Ejemplo Relación entre m.c.m., M.C.D. y el producto de dos números](/static/img/nodos/relacion-entre-mcm-mcd-y-el-producto-de-dos-numeros-ejemplos.svg)'
  pasos:
  - 'Paso 1: Calcular el producto de los números: $a \cdot b = 12 \cdot 18 = 216$.'
  - 'Paso 2: Calcular el producto de $\operatorname{mcm} \cdot \operatorname{MCD}$: $36 \cdot 6 = 216$.'
  - 'Conclusión: Como $216 = 216$, la identidad $\operatorname{mcm}(a,b) \cdot \operatorname{MCD}(a,b) = a \cdot b$ se cumple exactamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la relación matemática correcta entre mcm(a,b), MCD(a,b) y el producto a · b para dos números?
  choices:
