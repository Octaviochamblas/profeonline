errores_frecuentes:
- La identidad de multiplicidad aplica exactamente igual para tres o más enteros.
- Sumar el m.c.m. y el M.C.D. de dos números da como resultado el producto de los números.
- Si dos números son coprimos su mínimo común múltiplo es idéntico a cero.
- Multiplicar el m.c.m. por el M.C.D. produce siempre un número primo.
- Despejar el m.c.m. exige restar el M.C.D. al producto de los enteros.
afirmaciones_verdaderas:
- Para dos enteros positivos $a$ y $b$, se cumple $\operatorname{mcm}(a,b) \cdot \operatorname{MCD}(a,b) = a \cdot b$.
- Si dos enteros son coprimos (MCD = 1), su m.c.m. es igual a su producto directo $a \cdot b$.
al_terminar_debes_poder: "**QUÉ:** Aplicar y verificar la relación analítica fundamental entre el mínimo común múltiplo, el máximo común divisor y el producto de dos números naturales.\n\n**CÓMO:** Utilizando la identidad $\text{mcm}(a, b) \\cdot \text{mcd}(a, b) = a \\cdot b$ para despejar términos desconocidos ($\text{mcm} = \frac{a \\cdot b}{\text{mcd}}$) y reconociendo su validez exclusiva para pares de números naturales.\n\n![Resumen Relación entre m.c.m., M.C.D. y el producto de dos números](/static/img/nodos/relacion-entre-mcm-mcd-y-el-producto-de-dos-numeros-resumen.svg)"
