semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.RESTRICCIONES
resumen_inicial: Los valores que anulan el denominador de cualquier fracción en una ecuación deben ser excluidos estrictamente de su dominio de definición.
explicacion_simple: |
  Antes de iniciar la resolución de una ecuación fraccionaria, debemos llevar a cabo una auditoría de restricciones.

  Revisamos cada uno de los denominadores que contienen la variable $x$ e igualamos a cero cada expresión.

  Los valores numéricos resultantes son los denominados "valores prohibidos", los cuales deben anotarse e identificarse de inmediato, pues la división por cero no está definida en los números reales.
explicacion_formal: |
  ### Definición formal
  Dada una ecuación fraccionaria compuesta por términos de la forma $\sum_{i=1}^k \frac{P_i(x)}{Q_i(x)} = 0$, el **conjunto de valores prohibidos** $V_p$ y el **dominio permitido** $\operatorname{Dom}$ se definen como:

  $$V_p = \{x \in \mathbb{R} \mid \exists i \in \{1, \dots, k\} : Q_i(x) = 0\}$$

  $$\operatorname{Dom} = \mathbb{R} \setminus V_p$$

  ### Desglose de la fórmula
  - $V_p$: Conjunto formado por la unión de todos los ceros o raíces de los denominadores $Q_i(x)$.
  - $\operatorname{Dom}$: Dominio de validez real formado por todos los números reales excepto los valores de $V_p$.

  ### Síntesis didáctica
  Toda solución candidata obtenida al despejar la ecuación que coincida con un elemento de $V_p$ resulta ser una solución extraña y debe ser excluida del conjunto solución.
definiciones_clave: |
  - **Valores prohibidos ($V_p$)**: Números reales que provocan la anulación de al menos un denominador en la ecuación original.
  - **Dominio de definición ($\operatorname{Dom}$)**: Subconjunto real $\mathbb{R} \setminus V_p$ donde todas las fracciones están bien definidas.
propiedades_relaciones: |
  - **Indeterminación por división entre cero**: El cero en un denominador convierte el término en una expresión matemática no definida.
  - **Prioridad de análisis**: Las restricciones de dominio deben determinarse sobre la ecuación original antes de simplificar o cancelar denominadores.
ejemplo_guiado:
  enunciado: 'Dada la ecuación fraccionaria $\frac{5}{x - 3} + \frac{2}{x + 4} = \frac{1}{x^2 - 16}$, determina todos los valores que indefinen la ecuación.'
  pasos:
    - 'Paso 1: Analizar el primer denominador: $x - 3 = 0 \implies x = 3$.'
    - 'Paso 2: Analizar el segundo denominador: $x + 4 = 0 \implies x = -4$.'
    - 'Paso 3: Factorizar y analizar el tercer denominador: $x^2 - 16 = (x - 4)(x + 4) = 0 \implies x = 4 \text{ y } x = -4$.'
    - 'Paso 4: Reunir los valores prohibidos: $V_p = \{-4, 3, 4\}$.'
    - 'Paso 5: Declarar las restricciones del dominio: $x \neq -4$, $x \neq 3$ y $x \neq 4$, es decir, $\operatorname{Dom} = \mathbb{R} \setminus \{-4, 3, 4\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuáles son los valores prohibidos que indefinen la ecuación $\frac{5}{x - 3} + \frac{2}{x + 4} = \frac{1}{x^2 - 16}$?'
    choices:
      - {text: '$x = -4$, $x = 3$ y $x = 4$.', is_correct: true}
      - {text: 'Solo $x = 3$.', is_correct: false}
      - {text: '$x = 0$ y $x = 16$.', is_correct: false}
      - {text: '$x = 5$ y $x = 2$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = -4$, $x = 3$ y $x = 4$.''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al declarar el dominio de definición permitido para la ecuación dada, ¿cuál es la notación de conjuntos apropiada?'
    choices:
      - {text: '$\operatorname{Dom} = \mathbb{R} \setminus \{-4, 3, 4\}$', is_correct: true}
      - {text: '$\operatorname{Dom} = \{-4, 3, 4\}$', is_correct: false}
      - {text: '$\operatorname{Dom} = \mathbb{R} \setminus \{0\}$', is_correct: false}
      - {text: '$\operatorname{Dom} = \emptyset$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\operatorname{Dom} = \mathbb{R} \setminus \{-4, 3, 4\}$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Factorizar todos los denominadores con variable presentes en la ecuación fraccionaria original.'
  - 'Paso 2: Igualar a cero cada uno de los factores de los denominadores.'
  - 'Paso 3: Resolver las ecuaciones sencillas resultantes para hallar las raíces que anulan los denominadores.'
  - 'Paso 4: Conformar el conjunto de valores prohibidos $V_p = \{k_1, k_2, \dots\}$.'
  - 'Paso 5: Definir el dominio permitido como $\operatorname{Dom} = \mathbb{R} \setminus V_p$.'
errores_correccion: |
  - **Error 1:** Buscar los valores prohibidos igualando los numeradores a cero en lugar de los denominadores. **Cómo corregirlo:** Las restricciones de indeclinación provienen **ÚNICAMENTE DE LOS DENOMINADORES; UN NUMERADOR IGUAL A CERO ES TOTALMENTE VÁLIDO ($0/k = 0$)**.
  - **Error 2:** Buscar valores prohibidos en denominadores reducidos o cancelados tras simplificar la fracción. **Cómo corregirlo:** Las restricciones **DEBEN EXTRAERSE OBLIGATORIAMENTE DE LA ECUACIÓN INICIAL ANTES DE REALIZAR CUALQUIER SIMPLIFICACIÓN**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Qué valor inde fine a la ecuación $\frac{7}{2x - 10} = 4$?'
    alternativas:
      - '$x = 5$'
      - '$x = 10$'
      - '$x = 0$'
    respuesta: '$x = 5$'
    solucion_pasos:
      - '1. Igualar denominador a cero: $2x - 10 = 0 \implies 2x = 10$.'
      - '2. Despejar: $x = 5$. Restricción: $x \neq 5$.'
  - titulo: 'Ejemplo 2'
    enunciado: '¿Cuáles son los valores restringidos para la ecuación $\frac{1}{x} + \frac{1}{x - 1} = 2$?'
    alternativas:
      - '$x = 0$ y $x = 1$'
      - '$x = 1$ y $x = 2$'
      - 'Solo $x = 0$'
    respuesta: '$x = 0$ y $x = 1$'
    solucion_pasos:
      - '1. Denominador 1: $x = 0$.'
      - '2. Denominador 2: $x - 1 = 0 \implies x = 1$.'
      - '3. Valores prohibidos: $V_p = \{0, 1\}$.'
  - titulo: 'Numerador nulo'
    enunciado: '¿El valor $x = 0$ inde fine a la ecuación $\frac{x}{5} = 0$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el denominador es la constante $5 \neq 0$ y la igualdad se cumple.'
  - titulo: 'Denominador no nulo'
    enunciado: '¿La expresión $x^2 + 1$ en un denominador genera restricciones en los números reales $\mathbb{R}$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, pues $x^2 + 1 \ge 1 > 0$ para todo $x \in \mathbb{R}$.'
errores_frecuentes:
  - 'Las restricciones de indeclinación de la ecuación $\frac{5}{x - 3} = 2$ se obtienen igualando el numerador $5$ a cero.'
  - 'Las restricciones de dominio de la ecuación $\frac{6}{x - 2} = 3$ se calculan sobre la ecuación simplificada posterior a eliminar el denominador.'
  - 'Al analizar la ecuación $\frac{5}{x^2 - 16} = 1$, el denominador cuadrático entrega únicamente el valor prohibido $x = 4$ omitiendo el valor $x = -4$.'
  - 'El valor prohibido $x = 3$ obtenido al igualar el denominador de $\frac{5}{x - 3} = 0$ coincide con la solución del numerador.'
  - 'La división por cero generada al sustituir una restricción en un denominador produce como resultado numérico la constante cero.'
afirmaciones_verdaderas:
  - 'Los valores que anulan cualquier denominador de una ecuación fraccionaria quedan excluidos de su dominio en $\mathbb{R}$.'
  - 'Determinar las restricciones de dominio $Q(x) \neq 0$ debe realizarse sobre la ecuación original previa a simplificaciones.'
al_terminar_debes_poder: |
  QUÉ: Identificar los valores que indefinen una ecuación fraccionaria.
  CÓMO: Factorizar los denominadores de la ecuación original, igualar a cero cada uno de ellos y construir el dominio de definición $\operatorname{Dom} = \mathbb{R} \setminus V_p$.
fuente: 'Texto escolar MINEDUC — Álgebra 1° Medio / Ecuaciones Fraccionarias.'
