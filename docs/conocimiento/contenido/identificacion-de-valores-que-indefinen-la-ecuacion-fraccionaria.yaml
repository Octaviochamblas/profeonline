semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.RESTRICCIONES
resumen_inicial: Los valores que anulan el denominador de cualquier fracción en una
  ecuación deben ser excluidos estrictamente de su dominio.
explicacion_simple: 'Antes de empezar a resolver una ecuación fraccionaria, debemos
  hacer un control de seguridad:

  Revisamos cada denominador que contenga la variable $x$ e igualamos a cero esas
  expresiones.

  Los valores numéricos que resulten de esa igualdad son los ''valores prohibidos''.
  Debemos anotarlos de inmediato, ya que la división por cero no existe en los números
  reales.'
explicacion_formal: 'Dada una ecuación fraccionaria $\sum_{i=1}^k \frac{P_i(x)}{Q_i(x)}
  = 0$, el **conjunto de valores prohibidos** $V_p$ y el **dominio permitido** $\operatorname{Dom}$
  se definen como:


  $$V_p = \{x \in \mathbb{R} \mid \exists i \in \{1, \dots, k\} : Q_i(x) = 0\}$$

  $$\operatorname{Dom} = \mathbb{R} \setminus V_p$$


  **Desglose de la fórmula:**

  - $V_p$: Unión de todas las raíces o ceros de los denominadores presentes en la
  ecuación.'
definiciones_clave: '- **Valores prohibidos**: Números reales que anulan al menos
  un denominador en la ecuación fraccionaria original.

  - **Dominio de definición**: Conjunto de números reales válidos $\mathbb{R} \setminus
  V_p$ donde la ecuación está bien definida.'
propiedades_relaciones: '- **Indeterminación matemática**: Si un valor prohibido aparece
  como posible solución al resolver la ecuación, debe desecharse inmediatamente.'
ejemplo_guiado:
  enunciado: Dada la ecuación fraccionaria $\frac{5}{x - 3} + \frac{2}{x + 4} = \frac{1}{x^2
    - 16}$, determina todos los valores que indefinen la ecuación.
  pasos:
  - 'Paso 1: Analizar el primer denominador $x - 3 = 0 \implies x = 3$.Paso 2: Analizar
    el segundo denominador $x + 4 = 0 \implies x = -4$.Paso 3: Analizar el tercer
    denominador $x^2 - 16 = (x - 4)(x + 4) = 0 \implies x = 4$ y $x = -4$.Paso 4:
    Reunir los valores prohibidos: $V_p = \{-4, 3, 4\}$.Paso 5: Declarar las restricciones
    del dominio: $x \neq -4$, $x \neq 3$ y $x \neq 4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los valores que indefinen la ecuación $\frac{5}{x - 3} + \frac{2}{x
    + 4} = \frac{1}{x^2 - 16}$?
  choices:
  - text: $x = -4$, $x = 3$ y $x = 4$.
    is_correct: true
  - text: Solo $x = 3$.
    is_correct: false
  - text: $x = 0$ y $x = 16$.
    is_correct: false
  - text: $x = 5$ y $x = 2$.
    is_correct: false
  explanation: La alternativa correcta es '$x = -4$, $x = 3$ y $x = 4$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al declarar el dominio permitido para la ecuación dada, ¿qué notación
    expresa las restricciones?
  choices:
  - text: $\operatorname{Dom} = \mathbb{R} \setminus \{-4, 3, 4\}$
    is_correct: true
  - text: $\operatorname{Dom} = \{-4, 3, 4\}$
    is_correct: false
  - text: $\operatorname{Dom} = \mathbb{R} \setminus \{0\}$
    is_correct: false
  - text: $\operatorname{Dom} = \emptyset$
    is_correct: false
  explanation: La alternativa correcta es '$\operatorname{Dom} = \mathbb{R} \setminus
    \{-4, 3, 4\}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Factorizar todos los denominadores de las fracciones presentes en la ecuación.'
- 'Paso 2: Igualar a cero cada uno de los factores de los denominadores.'
- 'Paso 3: Resolver las ecuaciones simples resultantes para hallar las raíces de los
  denominadores.'
- 'Paso 4: Declarar explícitamente los valores prohibidos que la variable no puede
  tomar.'
errores_correccion: '- **Error común:** Buscar las restricciones igualando los numeradores
  a cero en lugar de los denominadores.

  - **Cómo corregirlo:** Las restricciones provienen ÚNICAMENTE de los DENOMINADORES.
  El numerador sí puede ser cero.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de ecuaciones fraccionarias.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de ecuaciones fraccionarias.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una solución que anula el denominador debe ser descartada?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una solución extraña fuera del dominio.
- titulo: ¿Multiplicar por el m.c.m. elimina los denominadores de la ecuación?
  respuesta: Sí
  solucion_pasos:
  - Sí, convierte la ecuación fraccionaria en una entera equivalente.
errores_frecuentes:
- Confundir una ecuación con coeficientes fraccionarios con una ecuación fraccionaria
  con la variable en el denominador.
- Olvidar restringir del dominio los valores que anulan el denominador antes de despejar.
- Multiplicar por el m.c.m. solo los términos con fracción omitiendo los números independientes
  enteros.
- Aceptar soluciones extrañas que anulan el denominador original de la ecuación.
- Olvidar colocar paréntesis en los numeradores al eliminar los denominadores.
afirmaciones_verdaderas:
- En las ecuaciones fraccionarias la variable incógnita aparece en el denominador
  de al menos una fracción.
- Multiplicar una ecuación fraccionaria por el m.c.m. de sus denominadores la transforma
  en una ecuación entera equivalente en el dominio permitido.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar, despejar y
  verificar ecuaciones fraccionarias de primer grado descartando soluciones extrañas
  no permitidas.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Primer Grado
