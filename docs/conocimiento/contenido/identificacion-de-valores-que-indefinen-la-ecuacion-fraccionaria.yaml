semantic_id: MAT.ALG.ECUACIONES_FRACCIONARIAS.RESTRICCIONES
resumen_inicial: 'Identificación de valores que indefinen la ecuación fraccionaria:
  propiedades, resolución y modelamiento en Ecuaciones fraccionarias de primer grado.'
explicacion_simple: 'Antes de siquiera intentar resolver la ecuación, debes hacer
  un chequeo de seguridad: observar todos los denominadores que tengan ''x'' y preguntar
  ''¿Qué valor de x haría que esto sea cero?''.'
explicacion_formal: '### Definición formal


  En una ecuación fraccionaria, el dominio de la incógnita $x$ excluye todo valor
  que anule algún denominador $q(x)$ que la contenga: $x \notin \{c \in \mathbb{R}
  : q(c) = 0\}$. Una solución algebraica que coincida con un valor excluido debe rechazarse
  por indefinir la ecuación original.


  ### Desarrollo didáctico


  Antes de siquiera intentar resolver la ecuación, debes hacer un chequeo de seguridad:
  observar todos los denominadores que tengan ''x'' y preguntar ''¿Qué valor de x
  haría que esto sea cero?''.


  En $\frac{5}{x-2}$, si $x$ valiera 2, el denominador sería $2-2=0$. Peligro. Debes
  escribir en piedra: **Restricción: $x \neq 2$**. Si al resolver la ecuación, la
  respuesta adecuado resulta ser 2, tendrás que rechazarla.'
definiciones_clave: '- **Identificación de valores que indefinen la ecuación fraccionaria**:
  Herramienta matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a identificación de valores que indefinen
  la ecuación fraccionaria.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando identificación
    de valores que indefinen la ecuación fraccionaria.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de identificación de
    valores que indefinen la ecuación fraccionaria.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
checkpoints:
