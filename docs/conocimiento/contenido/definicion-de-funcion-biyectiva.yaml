semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.BIYECTIVA_DEFINICION
resumen_inicial: Una función es biyectiva si cumple simultáneamente las propiedades de ser inyectiva (uno a uno) y sobreyectiva (cubre todo el codominio).
explicacion_simple: |
  Una **función biyectiva** es el emparejamiento perfecto de dos conjuntos:

  - **Es inyectiva**: A diferentes entradas les corresponden diferentes salidas (nadie comparte respuesta).
  - **Es sobreyectiva**: No sobra ningún elemento en el conjunto de llegada (el recorrido es igual al codominio).
  - **Resultado**: Cada elemento del primer conjunto tiene su pareja única y exclusiva en el segundo conjunto.
explicacion_formal: |
  Sea $f: A \to B$ una función entre los conjuntos $A$ y $B$. $f$ es una **función biyectiva** si y solo si es inyectiva y sobreyectiva de forma simultánea:

  $$\forall y \in B, \quad \exists! x \in A \quad \text{tal que} \quad f(x) = y$$

  donde $\exists!$ denota "existe un único".

  **Consecuencia lógica:**
  $$f \text{ es biyectiva} \iff f \text{ es invertible}$$
definiciones_clave: |
  - **Función biyectiva**: Correspondencia biunívoca perfecta donde existe exactamente una preimagen para cada elemento del codominio.
propiedades_relaciones: |
  - **Condición necesaria y suficiente para tener inversa**: Una función $f$ posee función inversa $f^{-1}$ si y solo si $f$ es biyectiva.
ejemplo_guiado:
  enunciado: 'Demuestra que la función afín $f: \mathbb{R} \to \mathbb{R}$ dada por $f(x) = 4x - 1$ es biyectiva.'
  pasos:
    - 'Paso 1: Probar inyectividad: $f(a) = f(b) \implies 4a - 1 = 4b - 1 \implies 4a = 4b \implies a = b \implies$ es inyectiva.'
    - 'Paso 2: Probar sobreyectividad: para cualquier $y \in \mathbb{R}$, existe $x = \frac{y + 1}{4} \in \mathbb{R}$ tal que $f(x) = y \implies \text{Rec}(f) = \mathbb{R} \implies$ es sobreyectiva.'
    - 'Paso 3: Al cumplir ambas condiciones simultáneamente, se concluye que $f(x) = 4x - 1$ es biyectiva.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué dos condiciones deben cumplirse al mismo tiempo para que una función sea biyectiva?'
    choices:
      - {text: 'Debe ser inyectiva y sobreyectiva.', is_correct: true}
      - {text: 'Debe ser constante y creciente.', is_correct: false}
      - {text: 'Debe pasar por el origen y ser lineal.', is_correct: false}
      - {text: 'Debe tener dominio finito y codominio infinito.', is_correct: false}
    explanation: 'La alternativa correcta es ''Debe ser inyectiva y sobreyectiva.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Qué propiedad fundamental garantiza que una función sea biyectiva?'
    choices:
      - {text: 'Que la función posea una función inversa bien definida.', is_correct: true}
      - {text: 'Que su gráfica sea una parábola.', is_correct: false}
      - {text: 'Que la pendiente sea mayor que 10.', is_correct: false}
      - {text: 'Que no tenga ceros reales.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que la función posea una función inversa bien definida.''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Demostrar que la función es inyectiva ($f(a) = f(b) \implies a = b$).'
  - 'Paso 2: Demostrar que la función es sobreyectiva ($\text{Rec}(f) = \text{Codom}(f)$).'
  - 'Paso 3: Concluir que la función establece una correspondencia biunívoca (biyectiva).'
  - 'Paso 4: Declarar la existencia de su función inversa $f^{-1}$.'
errores_correccion: |
  - **Error común:** Creer que basta con probar inyectividad para declarar que una función es biyectiva.
  - **Cómo corregirlo:** Para ser BIYECTIVA se deben cumplir **AMBAS** condiciones: ser inyectiva Y ser sobreyectiva.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función biyectiva.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función biyectiva.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una función es biyectiva si es inyectiva aunque existan elementos del codominio sin preimagen asignada.'
  - 'La función cuadrática $f(x) = x^2$ definida de $\mathbb{R} \to \mathbb{R}$ es una función biyectiva.'
  - 'Toda función sobreyectiva es automáticamente biyectiva sin necesidad de comprobar inyectividad.'
  - 'Una función afín definida de $\mathbb{R} \to \mathbb{R}$ no puede ser nunca biyectiva.'
  - 'Para que una función sea biyectiva, el número de elementos del dominio debe ser el doble del codominio.'
afirmaciones_verdaderas:
  - 'Una función $f: A \to B$ es biyectiva si y solo si es inyectiva y sobreyectiva simultáneamente, lo que garantiza una correspondencia uno a uno perfecta.'
  - 'La biyectividad de una función es la condición necesaria y suficiente para que exista su función inversa $f^{-1}: B \to A$.'
al_terminar_debes_poder: |
  QUÉ: Definir y verificar la propiedad de biyectividad en funciones de variable real.
  CÓMO: Probar conjuntamente que $f$ es inyectiva ($f(a)=f(b)\implies a=b$) y sobreyectiva ($\text{Rec}(f)=\text{Codom}(f)$).
