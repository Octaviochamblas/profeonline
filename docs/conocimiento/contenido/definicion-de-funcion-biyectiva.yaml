semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.BIYECTIVA_DEFINICION
resumen_inicial: Una función es biyectiva si es simultáneamente inyectiva (uno a uno) y sobreyectiva (sobre todo el codominio), estableciendo una correspondencia biunívoca perfecta.
explicacion_simple: '![Una función es biyectiva si es simultáneamente inyectiva (uno a uno) y sobreyectiva (sobre todo el codominio), estableciendo una correspondencia biunívoca perfecta](/static/img/nodos/definicion-de-funcion-biyectiva-intro.svg)



  Una función es **biyectiva** cuando cumple **las dos condiciones al mismo tiempo**:

  1. **Es inyectiva:** A entradas distintas corresponden salidas distintas (no hay repeticiones).

  2. **Es sobreyectiva:** Todo el conjunto de llegada está cubierto (no sobra nada).


  Esto significa que **cada elemento de entrada tiene una pareja única en la salida, y cada elemento de salida tiene una pareja única en la entrada** (un emparejamiento perfecto uno a uno).'
explicacion_formal: 'Sea $f: A \to B$ una función. Se define formalmente que $f$ es **biyectiva** si y solo si es inyectiva y sobreyectiva simultáneamente:

  $$f \text{ es biyectiva} \Longleftrightarrow (\forall x_1, x_2 \in A, \, f(x_1) = f(x_2) \implies x_1 = x_2) \;\land\; (\text{Rec}(f) = B)$$


  **Propiedad de existencia y unicidad:**

  $$f \text{ es biyectiva} \Longleftrightarrow \forall y \in B, \; \exists! x \in A \text{ tal que } f(x) = y$$


  Donde $\exists!$ denota *existe un único* elemento preimagen.'
definiciones_clave: '- **Función biyectiva**: Aplicación que establece una biyección o correspondencia biunívoca entre dos conjuntos.

  - **Unicidad global**: Cada elemento del codominio posee exactamente una única preimagen en el dominio.'
propiedades_relaciones: '- **Condición de invertibilidad**: $f$ posee función inversa $f^{-1}: B \to A$ si y solo si $f$ es biyectiva.

  - **Cardinalidad**: Si $A$ y $B$ son finitos, $f: A \to B$ biyectiva implica $|A| = |B|$.'
ejemplo_guiado:
  enunciado: '![Ejemplo Una función es biyectiva si es simultáneamente inyectiva (uno a uno) y sobreyectiva (sobre todo el codominio), estableciendo una correspondencia biunívoca perfecta](/static/img/nodos/definicion-de-funcion-biyectiva-ejemplos.svg)



    Demuestra que la función afín $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = 5x - 4$ es biyectiva.'
  pasos:
  - 'Paso 1: Demostrar inyectividad: suponer $f(a) = f(b) \implies 5a - 4 = 5b - 4 \implies 5a = 5b \implies a = b$ (es inyectiva).'
  - 'Paso 2: Demostrar sobreyectividad: para todo $y \in \mathbb{R}$, $y = 5x - 4 \implies x = \frac{y + 4}{5} \in \mathbb{R}$ (es sobreyectiva).'
  - 'Paso 3: Como cumple ambas propiedades de forma simultánea, concluir que $f$ es biyectiva en $\mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las dos condiciones simultáneas que definen a una función biyectiva?
  choices:
  - text: Debe ser inyectiva (uno a uno) y sobreyectiva (cubrir todo el codominio).
    is_correct: true
  - text: Debe ser creciente y continua.
    is_correct: false
  - text: Debe pasar por el origen y tener pendiente positiva.
    is_correct: false
  - text: Debe ser par e impar.
    is_correct: false
  explanation: La alternativa correcta es 'Debe ser inyectiva (uno a uno) y sobreyectiva (cubrir todo el codominio).'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: 'Toda función afín $f(x) = mx + n$ con $m \neq 0$ definida de $\mathbb{R}$ en $\mathbb{R}$ es:'
  choices:
  - text: Biyectiva en todos los numeros reales.
    is_correct: true
  - text: Solo inyectiva pero no sobreyectiva.
    is_correct: false
  - text: Solo sobreyectiva pero no inyectiva.
    is_correct: false
  - text: Constante.
    is_correct: false
  explanation: La alternativa correcta es 'Biyectiva en todos los numeros reales.'. Cumple inyectividad y sobreyectividad en $\mathbb{R}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Probar analíticamente la inyectividad ($f(a) = f(b) \implies a = b$).'
- 'Paso 2: Probar analíticamente la sobreyectividad (despejar $x$ y verificar $\text{Rec}(f) = B$).'
- 'Paso 3: Si ambas pruebas son afirmativas, declarar la función como biyectiva.'
- 'Paso 4: Si falla al menos una de las dos condiciones, no es biyectiva.'
errores_correccion: '- **Error común:** Concluir que una función es biyectiva verificando solo que es inyectiva.

  - **Cómo corregirlo:** La biyectividad **exige obligatoriamente ambas pruebas**: inyectividad Y sobreyectividad.'
ejemplos:
- titulo: 'Ejemplo 1: Función afín decreciente'
  enunciado: '¿Es $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = -3x + 8$ biyectiva?'
  alternativas:
  - Sí, es inyectiva y sobreyectiva en R
  - No, porque la pendiente es negativa
  - Solo es inyectiva
  - Solo es sobreyectiva
  respuesta: Sí, es inyectiva y sobreyectiva en R
  solucion_pasos:
  - 'Paso 1: Al tener $m = -3 \neq 0$, es biyección de $\mathbb{R}$ en $\mathbb{R}$.'
- titulo: 'Ejemplo 2: Función cuadrática en R'
  enunciado: '¿Es $g: \mathbb{R} \to \mathbb{R}$ con $g(x) = x^2 + 1$ biyectiva?'
  alternativas:
  - No, falla tanto la inyectividad como la sobreyectividad
  - Sí, porque es simétrica
  - Solo es sobreyectiva
  - Solo es inyectiva
  respuesta: No, falla tanto la inyectividad como la sobreyectividad
  solucion_pasos:
  - 'Paso 1: No es inyectiva ($g(-1)=g(1)=2$) ni sobreyectiva (no toma valores $< 1$).'
- titulo: 'Ejemplo 3: Cuadrática con dominio y codominio restringidos'
  enunciado: 'Para $h: [0, +\infty[ \to [1, +\infty[$ con $h(x) = x^2 + 1$, ¿es biyectiva?'
  alternativas:
  - Sí, en estos intervalos restringidos es inyectiva y sobreyectiva
  - No, las parábolas nunca son biyectivas
  - Solo es inyectiva
  - Solo es sobreyectiva
  respuesta: Sí, en estos intervalos restringidos es inyectiva y sobreyectiva
  solucion_pasos:
  - 'Paso 1: En $[0, +\infty[$ es inyectiva y su recorrido es $[1, +\infty[ = B$.'
- titulo: 'Ejemplo 4: Función identidad'
  enunciado: ¿Es la función identidad $f(x) = x$ biyectiva en $\mathbb{R}$?
  alternativas:
  - Sí, es la biyección canónica de R en R
  - No, porque su pendiente es 1
  - Solo es sobreyectiva
  - Solo es inyectiva
  respuesta: Sí, es la biyección canónica de R en R
  solucion_pasos:
  - 'Paso 1: Cumple trivially $a = b$ y $\text{Rec}(f) = \mathbb{R}$.'
errores_frecuentes:
- Omitir la prueba de sobreyectividad.
- Asumir que funciones curvas nunca pueden ser biyectivas.
- Olvidar que la biyectividad es el requisito para la existencia de función inversa.
afirmaciones_verdaderas:
- Una función es biyectiva si y solo si es inyectiva y sobreyectiva a la vez.
- Toda biyección admite una función inversa f^(-1) perfectamente definida.
al_terminar_debes_poder: '**QUÉ:** Definir, clasificar y demostrar la biyectividad de funciones reales.


  **CÓMO:** Comprobando simultáneamente las condiciones de inyectividad y sobreyectividad analítica o gráfica.


  ![Resumen Una función es biyectiva si es simultáneamente inyectiva (uno a uno) y sobreyectiva (sobre todo el codominio), estableciendo una correspondencia biunívoca perfecta](/static/img/nodos/definicion-de-funcion-biyectiva-resumen.svg)'
