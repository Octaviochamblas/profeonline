semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.BIYECTIVA_DEFINICION
resumen_inicial: 'Definición de función biyectiva: conceptos, representación y propiedades
  en Tipos de funciones y función inversa.'
explicacion_simple: Cuando una función cumple las dos propiedades más exigentes al
  mismo tiempo, cada elemento del dominio y cada elemento del codominio quedan emparejados
  en una correspondencia perfecta, uno a uno.
explicacion_formal: '### Definición formal


  Una función $f\colon A \to B$ es biyectiva si cumple ambas condiciones: inyectividad
  ($f(x_1)=f(x_2) \implies x_1=x_2$) y sobreyectividad ($\text{Rec}(f)=B$). Equivalentemente,
  para todo $y \in B$ existe un único $x \in A$ tal que $f(x)=y$.


  ### Desarrollo didáctico


  Piensa en una biyección como un "emparejamiento perfecto" entre dos conjuntos: cada
  elemento de un lado tiene exactamente una pareja del otro lado, sin sobrar ni faltar
  nadie.


  $f\colon \mathbb{R} \to \mathbb{R}$, $f(x)=2x+3$ es biyectiva: es inyectiva (por
  ser lineal con $m\neq0$) y sobreyectiva (su recorrido es todo $\mathbb{R}$, igual
  al codominio).'
definiciones_clave: '- **Definición de función biyectiva**: Elemento central en el
  estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a definición de función biyectiva.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a definición de función
    biyectiva.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a definición de función biyectiva.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    definición de función biyectiva?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en tipos de funciones y función inversa
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en tipos de funciones y función inversa. Es la
    condición de existencia y unicidad en definición de función biyectiva.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en definición de función
    biyectiva, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica la inyectividad de la función (que elementos distintos tengan
  imágenes distintas).'
- 'Paso 2: Verifica la sobreyectividad (que el recorrido coincida con el codominio).'
- 'Paso 3: Si ambas condiciones se cumplen simultáneamente, la función es biyectiva.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar definición de función biyectiva.
ejemplos:
- titulo: Verificación de biyectividad en función afín
  enunciado: Determina si $f\colon \mathbb{R} \to \mathbb{R}$, $f(x)=-4x+7$, es biyectiva.
  solucion_pasos:
  - Es inyectiva, por ser una función afín con pendiente distinta de cero.
  - Es sobreyectiva, pues su recorrido es todo $\mathbb{R}$, igual al codominio.
  - Cumple ambas condiciones, es biyectiva.
- titulo: Función que no es biyectiva
  enunciado: Determina si $f\colon \mathbb{R} \to \mathbb{R}$, $f(x)=x^2$, es biyectiva.
  solucion_pasos:
  - No es inyectiva (por ejemplo, $f(2)=f(-2)=4$).
  - Al fallar una de las dos condiciones, no es biyectiva.
- titulo: ¿Una función biyectiva debe ser inyectiva y sobreyectiva al mismo tiempo?
  enunciado: ¿Una función biyectiva debe ser inyectiva y sobreyectiva al mismo tiempo?
  respuesta: Sí
  solucion_pasos:
  - Ambas condiciones deben cumplirse simultáneamente para hablar de biyectividad.
- titulo: ¿Toda función inyectiva es automáticamente biyectiva?
  enunciado: ¿Toda función inyectiva es automáticamente biyectiva?
  respuesta: 'No'
  solucion_pasos:
  - También debe ser sobreyectiva; una función puede ser inyectiva sin serlo sobreyectiva.
errores_frecuentes:
- Confirmar solo una de las dos condiciones (inyectividad o sobreyectividad) y concluir
  biyectividad.
- Confundir biyectividad con la existencia de inversa, sin verificar ambas propiedades
  explícitamente.
- No considerar que la biyectividad depende del codominio declarado, igual que la
  sobreyectividad.
- Suponer que toda función afín es automáticamente biyectiva sin especificar dominio
  y codominio.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando definición
  de función biyectiva.
