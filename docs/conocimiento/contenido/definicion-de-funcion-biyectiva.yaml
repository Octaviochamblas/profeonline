semantic_id: MAT.ALG.FUNCION_TIPOS_INVERSA.BIYECTIVA_DEFINICION
resumen_inicial: Una función es biyectiva si cumple simultáneamente las propiedades
  de ser inyectiva (uno a uno) y sobreyectiva (recorrido igual a codominio).
explicacion_simple: 'Una **función biyectiva** es la combinación perfecta:

  1. Es **inyectiva**: a preimágenes distintas les corresponden imágenes distintas
  (no hay salidas repetidas).

  2. Es **sobreyectiva**: el recorrido cubre completamente el codominio (no quedan
  salidas sueltas).

  Esta doble condición es el **REQUISITO OBLIGATORIO** para que una función posea
  función inversa $f^{-1}$.'
explicacion_formal: 'Una función $f: A \to B$ es **biyectiva** si y solo si:


  $$f \text{ es inyectiva } \quad \land \quad f \text{ es sobreyectiva}$$

  $$\iff \forall y \in B, \quad \exists! x \in A \quad \text{tal que } f(x) = y$$


  **Desglose de la fórmula:**

  - Correspondencia uno a uno perfecta: cada elemento del conjunto de llegada proviene
  de exactamente una preimagen única del conjunto de partida.'
definiciones_clave: '- **Función biyectiva**: Mapeo que establece una biyección o
  correspondencia biunívoca perfecta entre los conjuntos $A$ y $B$.'
propiedades_relaciones: '- **Condición necesaria de invertibilidad**: Una función
  admite función inversa $f^{-1}$ si y solo si es biyectiva.'
ejemplo_guiado:
  enunciado: 'Verifica que la función afín $f: \mathbb{R} \to \mathbb{R}$ dada por
    $f(x) = 2x + 1$ es biyectiva.'
  pasos:
  - 'Paso 1: Probar inyectividad: $f(x_1) = f(x_2) \implies 2x_1 + 1 = 2x_2 + 1 \implies
    2x_1 = 2x_2 \implies x_1 = x_2$ (INYECTIVA).Paso 2: Probar sobreyectividad: despejar
    $x = \frac{y - 1}{2}$. Como para todo $y \in \mathbb{R}$ existe $x \in \mathbb{R}$,
    $\operatorname{Rec}(f) = \mathbb{R}$ (SOBREYECTIVA).Paso 3: Como cumple ambas
    condiciones, concluir que $f(x) = 2x + 1$ es BIYECTIVA.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuáles son las dos condiciones simultáneas que debe cumplir una función
    $f: A \to B$ para ser clasificada como biyectiva?'
  choices:
  - text: Ser inyectiva y sobreyectiva al mismo tiempo.
    is_correct: true
  - text: Ser constante y par.
    is_correct: false
  - text: Tener pendiente cero e intersección en el origen.
    is_correct: false
  - text: Ser discontinua y cuadrática.
    is_correct: false
  explanation: La alternativa correcta es 'Ser inyectiva y sobreyectiva al mismo tiempo.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué es crucial la biyectividad en el estudio de las funciones avanzadas?
  choices:
  - text: Porque es la condición indispensable para que exista la función inversa
      $f^{-1}$.
    is_correct: true
  - text: Porque impide que la función tenga gráfica en el plano.
    is_correct: false
  - text: Porque transforma todas las funciones en rectas horizontales.
    is_correct: false
  - text: Porque anula el dominio de la función.
    is_correct: false
  explanation: La alternativa correcta es 'Porque es la condición indispensable para
    que exista la función inversa $f^{-1}$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Demostrar o verificar que la función es inyectiva.'
- 'Paso 2: Demostrar o verificar que la función es sobreyectiva.'
- 'Paso 3: Si ambas pruebas son afirmativas, declarar que la función es biyectiva.'
errores_correccion: '- **Error común:** Declarar que una función es biyectiva probando
  solo una de las dos condiciones.

  - **Cómo corregirlo:** Debes comprobar SIEMPRE ambas propiedades (inyectividad Y
  sobreyectividad) por separado.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de tipos de funciones y función inversa.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de tipos de funciones y función inversa.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función debe ser biyectiva para admitir función inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el teorema fundamental de invertibilidad.
- titulo: ¿Las gráficas de f y su inversa son simétricas respecto a la recta y = x?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad de reflexión especular de pares ordenados (x, y) a (y, x).
errores_frecuentes:
- Confundir el criterio de la línea horizontal (para inyectividad) con el criterio
  de la línea vertical (para ser función).
- Confundir la notación de función inversa $f^{-1}(x)$ con el recíproco o potencia
  $\frac{1}{f(x)}$.
- Intentar calcular la inversa de una función que no es biyectiva en los conjuntos
  considerados.
- Olvidar intercambiar las variables $x$ e $y$ al finalizar el algoritmo de despeje
  algebraico.
- Creer que la simetría gráfica de la función inversa es respecto al eje Y en lugar
  de la recta bisectriz $y = x$.
afirmaciones_verdaderas:
- Una función admite función inversa $f^{-1}$ si y solo si es biyectiva en sus conjuntos
  de definición.
- Las gráficas de una función $f$ y su inversa $f^{-1}$ son simétricas respecto a
  la recta bisectriz del primer cuadrante $y = x$.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e identificar
  funciones inyectivas, sobreyectivas y biyectivas, calculando y verificando algebraicamente
  y gráficamente la función inversa.
fuente: Texto escolar MINEDUC — Álgebra / Tipos de Funciones y Función Inversa
