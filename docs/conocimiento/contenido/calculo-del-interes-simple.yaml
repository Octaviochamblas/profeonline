semantic_id: MAT.NUM.INTERES_SIMPLE.CALCULO_INTERES
resumen_inicial: 'Cálculo del interés simple: concepto y propiedades fundamentales en Interés
  simple.'
explicacion_simple: ¿Cómo calculamos rápidamente la deuda si pasan 5 años en un modelo lineal?
  Simplemente multiplicamos el interés de un año por cinco.
explicacion_formal: "La matemática del Interés Simple requiere tres variables:\n- **$C$:**\
  \ Capital Inicial prestado.\n- **$i$:** Tasa de interés (escrita como decimal. Ej: $5\\\
  % \\rightarrow 0.05$).\n- **$t$:** Tiempo o cantidad de periodos.\n\n**1. Fórmula de Ganancia\
  \ (solo los intereses):**\n$$I = C \\cdot i \\cdot t$$\n*(Calcula la ganancia de 1 mes y\
  \ la multiplica por los meses que pasaron).* \n\n**2. Fórmula del Capital Final (Monto Total\
  \ a pagar):**\n$$C_f = C + (C \\cdot i \\cdot t) = C(1 + i \\cdot t)$$\n\n**¡Regla de Oro!**\
  \ El tiempo $t$ y la tasa $i$ deben estar en el mismo 'idioma'. Si la tasa es anual y te\
  \ dan el tiempo en meses, debes convertir el tiempo a años dividiendo por 12."
definiciones_clave: '- **Cálculo del interés simple**: Elemento central dentro del estudio
  de Interés simple.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a cálculo del interés simple.'
ejemplo_guiado:
  enunciado: Se invierten 8.000 pesos al 5% de interés simple anual durante 4 años. Calcula
    el interés ganado.
  pasos:
  - 'Identifico los datos: C igual a 8.000, i igual a 0,05, t igual a 4.'
  - 'Aplico la fórmula: I igual a C por i por t, es decir 8.000 por 0,05 por 4.'
  - 'Calculo: 8.000 por 0,05 es 400, y 400 por 4 es igual a 1.600. Se ganaron 1.600 pesos
    de interés.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con cálculo del interés simple?
  choices:
  - text: Identificar correctamente la relación de interés simple
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de interés simple. Fundamento
    conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de cálculo del interés simple, ¿qué paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
    clave en la resolución de problemas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Convierte la tasa a decimal (divide por 100).'
- 'Paso 2: Asegúrate que tiempo y tasa usen la misma unidad de medida (ej. ambos en años o
  ambos en meses).'
- 'Paso 3: Multiplica $Capital \times Tasa \times Tiempo$ para hallar la ganancia.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo del interés
  simple.
ejemplos:
- titulo: Cálculo directo
  enunciado: Se invierten $5.000 al 4% de interés simple anual durante 3 años. ¿Cuánto interés
    se ganó?
  solucion_pasos:
  - C = 5000, i = 0.04 (anual), t = 3 (años).
  - $I = 5000 \cdot 0.04 \cdot 3$.
  - $I = 200 \cdot 3 = 600$.
  - Se ganaron $600 de interés.
- titulo: Ejemplo 2
  enunciado: Con capital 10.000, tasa 0,03 y tiempo 5 años, ¿cuál es el interés generado?
  alternativas:
  - '1.500'
  - '1.300'
  - '500'
  respuesta: '1.500'
  solucion_pasos:
  - 10.000 por 0,03 por 5 es igual a 1.500.
- titulo: Ejemplo 3
  enunciado: Se invierten 6.000 pesos al 4% anual durante 2 años. ¿Cuál es el interés?
  alternativas:
  - '480'
  - '240'
  - '24'
  respuesta: '480'
  solucion_pasos:
  - 6.000 por 0,04 por 2 es igual a 480.
- titulo: ¿La tasa de interés debe convertirse a decimal antes de aplicar la fórmula?
  respuesta: Sí
  solucion_pasos:
  - Por ejemplo, 4% se convierte en 0,04 antes de multiplicar.
errores_frecuentes:
- Olvidar pasar la tasa a decimal (multiplicar por 4 en vez de 0.04).
- Mezclar tasa mensual con tiempo en años sin hacer la conversión.
- Olvidar pasar la tasa a decimal, multiplicando por el número entero del porcentaje en vez
  de por su forma decimal.
- Mezclar una tasa mensual con un tiempo expresado en años sin hacer la conversión correspondiente.
- Multiplicar solo dos de las tres variables de la fórmula, omitiendo el capital, la tasa
  o el tiempo.
afirmaciones_verdaderas:
- La propiedad de cálculo del interés simple preserva la consistencia lógica.
- La fórmula del interés simple, I igual a C por i por t, requiere que la tasa i esté expresada
  en decimal y que el tiempo t esté en la misma unidad que la tasa.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo del interés simple.
