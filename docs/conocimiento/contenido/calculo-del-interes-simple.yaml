resumen_inicial: 'El cálculo del interés simple $I$ multiplica el capital inicial
  $C$, la tasa de interés en decimal $i$ y el número de períodos de tiempo $t$: $I
  = C \cdot i \cdot t$.'
explicacion_simple: Para calcular cuánta plata de ganancia genera un préstamo o depósito
  en interés simple, multiplicamos el capital invertido por la tasa de interés dividida
  entre 100 y por la cantidad de períodos de tiempo.
explicacion_formal: 'La **Fórmula del Interés Simple Ganado $I$** establece la multiplicación
  directa de los tres parámetros financieros:


  $$I = C \cdot \left(\frac{r}{100}\right) \cdot t$$


  **Homogeneidad temporal estricta:**

  - Si la tasa $r$ es anual, el tiempo $t$ DEBE ingresarse obligatoriamente en años.

  - Si la tasa $r$ es mensual, el tiempo $t$ DEBE ingresarse obligatoriamente en meses.'
definiciones_clave: '- **Cálculo de interés $I$**: Producto $I = C \cdot i \cdot t$
  expresado en unidades monetarias.'
propiedades_relaciones: '- **Homogeneidad de unidades de tiempo**: La unidad de $t$
  debe coincidir con el período de la tasa $i$.'
ejemplo_guiado:
  enunciado: Calcule el interés generado por un capital de \$400.000 colocado al $6\%$
    anual de interés simple durante $2,5$ años.
  pasos:
  - 'Paso 1: Convertir la tasa a decimal: $i = 6/100 = 0,06$ (anual).'
  - 'Paso 2: Verificar tiempo en años: $t = 2,5$ años.'
  - 'Paso 3: Multiplicar $I = 400.000 \cdot 0,06 \cdot 2,5 = 24.000 \cdot 2,5 = 60.000$.'
  - 'Conclusión: El interés generado es \$60.000.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición fundamental debe cumplirse respecto a la unidad del tiempo
    t y la tasa de interés i?
  choices:
  - text: La unidad del tiempo t debe ser exactamente idéntica al período de la tasa
      de interés i
    is_correct: true
  - text: El tiempo siempre debe estar en días
    is_correct: false
  - text: La tasa siempre debe dividirse entre 12
    is_correct: false
  - text: No importa la unidad del tiempo
    is_correct: false
  explanation: La alternativa correcta es 'La unidad del tiempo t debe ser exactamente
    idéntica al período de la tasa de interés i'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $400.000 al 6% anual durante 2,5 años, ¿cuál
    fue el interés generado?
  choices:
  - text: 60.000 $
    is_correct: true
  - text: 24.000 $
    is_correct: false
  - text: 100.000 $
    is_correct: false
  - text: 460.000 $
    is_correct: false
  explanation: La alternativa correcta es '60.000 $'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular el interés acumulado
  $I = C \cdot i \cdot t$ garantizando la coincidencia de unidades de tiempo entre
  $i$ y $t$.
semantic_id: MAT.NUM.INTERES_SIMPLE.CALCULO_INTERES
procedimiento:
- 'Paso 1: Identificar los parámetros conocidos ($C, i, t, I, M$) e igualar las unidades
  de tiempo de la tasa y el plazo.'
- 'Paso 2: Sustituir en la fórmula fundamental del interés simple $I = C \cdot i \cdot
  t$ o del monto $M = C \cdot (1 + i \cdot t)$.'
- 'Paso 3: Despejar algebraicamente la variable buscada y comprobar el resultado numérico.'
errores_correccion: '- **Error 1: Ingresar el tiempo en meses cuando la tasa de interés
  es anual sin convertir unidades.** **Cómo corregirlo:** Se DEBE convertir el tiempo
  a años dividiendo entre 12 ($18\text{ meses} = 1,5\text{ años}$) o convertir la
  tasa anual a mensual dividiendo entre 12.


  - **Error 2: Sumar los intereses acumulados al capital inicial en cada período (tratarlo
  como interés compuesto).** **Cómo corregirlo:** En el interés simple el capital
  inicial $C$ permanece CONSTANTE en todos los períodos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.INTERES_SIMPLE.CALCULO_INTERES.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la fórmula de interés simple.
- titulo: Ejemplo 2
  enunciado: Verificación de la función de capitalización lineal.
  alternativas:
  - Cumple la fórmula
  - No cumple
  - Indeterminado
  respuesta: Cumple la fórmula
  solucion_pasos:
  - Demostración formal por $M = C(1 + it)$.
- titulo: ¿Son idénticos los intereses ganados en cada período en el interés simple?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque se calculan siempre sobre el mismo capital inicial $C$.
- titulo: ¿Debe coincidir la unidad de tiempo del plazo t con la unidad de la tasa
    de interés i?
  respuesta: Sí
  solucion_pasos:
  - Sí, para mantener la homogeneidad dimensional temporal.
errores_frecuentes:
- Ingresar el tiempo en meses manteniendo una tasa de interés expresada en términos
  anuales.
- Recapitalizar los intereses ganados al final de cada período sobre el capital inicial
  en régimen simple.
- Multiplicar por el número entero de la tasa de interés sin dividir previamente por
  cien.
- Declarar el valor del interés ganado $I$ con el monto final total acumulado $M$.
- Dividir el capital entre el tiempo sin incorporar la tasa de interés en el cálculo
  del saldo.
afirmaciones_verdaderas:
- El interés simple se caracteriza por generar ganancias periódicas constantes calculadas
  sobre el capital inicial $C$.
- El monto acumulado final en interés simple es una función lineal del tiempo $M =
  C \cdot (1 + i \cdot t)$.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
