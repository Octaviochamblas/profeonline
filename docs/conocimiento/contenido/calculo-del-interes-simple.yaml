semantic_id: MAT.NUM.INTERES_SIMPLE.CALCULO_INTERES
resumen_inicial: 'Cálculo del interés simple: concepto y propiedades fundamentales
  en Interés simple.'
explicacion_simple: ¿Cómo calculamos rápidamente la deuda si pasan 5 años en un modelo
  lineal? Simplemente multiplicamos el interés de un año por cinco.
explicacion_formal: "La matemática del Interés Simple requiere tres variables:\n-\
  \ **$C$:** Capital Inicial prestado.\n- **$i$:** Tasa de interés (escrita como decimal.\
  \ Ej: $5\\% \\rightarrow 0.05$).\n- **$t$:** Tiempo o cantidad de periodos.\n\n\
  **1. Fórmula de Ganancia (solo los intereses):**\n$$I = C \\cdot i \\cdot t$$\n\
  *(Calcula la ganancia de 1 mes y la multiplica por los meses que pasaron).* \n\n\
  **2. Fórmula del Capital Final (Monto Total a pagar):**\n$$C_f = C + (C \\cdot i\
  \ \\cdot t) = C(1 + i \\cdot t)$$\n\n**¡Regla de Oro!** El tiempo $t$ y la tasa\
  \ $i$ deben estar en el mismo 'idioma'. Si la tasa es anual y te dan el tiempo en\
  \ meses, debes convertir el tiempo a años dividiendo por 12."
definiciones_clave: '- **Cálculo del interés simple**: Elemento central dentro del
  estudio de Interés simple.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
