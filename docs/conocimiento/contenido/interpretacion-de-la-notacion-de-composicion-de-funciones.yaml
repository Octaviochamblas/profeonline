semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.NOTACION
resumen_inicial: 'Interpretación de la notación de composición de funciones: conceptos,
  representación y propiedades en Composición de funciones.'
explicacion_simple: 'El pequeño círculo entre dos letras de función no es un punto
  de multiplicación disimulado: es un símbolo con significado propio, el de composición.'
explicacion_formal: '### Definición formal


  El símbolo $\circ$ denota la operación de composición de funciones: $(f \circ g)(x)
  := f(g(x))$. Esta notación distingue claramente la composición del producto ordinario
  $f(x) \cdot g(x)$, que es una operación diferente.


  ### Desarrollo didáctico


  Leer $(f \circ g)$ de derecha a izquierda ayuda a recordar el orden de aplicación:
  primero $g$ (la más cercana a la $x$), después $f$.


  $(f \circ g)(3)$ significa: evalúa primero $g$ en $3$, y luego evalúa $f$ en ese
  resultado. Nunca significa multiplicar $f(3)$ por $g(3)$.'
definiciones_clave: '- **Interpretación de la notación de composición de funciones**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a interpretación de la notación de composición
  de funciones.'
