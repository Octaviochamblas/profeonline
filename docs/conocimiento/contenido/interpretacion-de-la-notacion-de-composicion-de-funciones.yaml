semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.NOTACION
resumen_inicial: La notación $(f \circ g)(x)$ representa formalmente la función $f$ evaluada en el valor $g(x)$, indicando que $g$ opera primero sobre $x$ y $f$ opera después sobre $g(x)$.
explicacion_simple: '![La notación $(f \circ g)(x)$ representa formalmente la función $f$ evaluada en el valor $g(x)$, indicando que $g$ opera primero sobre $x$ y $f$ opera después sobre $g(x)$](/static/img/nodos/interpretacion-de-la-notacion-de-composicion-de-funciones-intro.svg)



  Cuando veas el símbolo de circulito $\circ$:

  - **$(f \circ g)(x)$** se lee: *"$f$ compuesto con $g$ de $x$"* o *"$f$ de $g$ de $x$"*.

  - **Regla de oro:** Siempre reescríbelo con paréntesis: **$f(g(x))$**.

  - La función que está a la derecha (más cerca de la $x$) es la que se calcula **primero**.

  - La función que está a la izquierda es la que se calcula **después**.'
explicacion_formal: 'La expresión simbólica $(f \circ g)(x)$ es una notación compacta para la evaluación anidada:

  $$(f \circ g)(x) \equiv f(g(x))$$


  **Convenciones y reglas de precedencia:**

  - **Orden de evaluación**: De derecha a izquierda en la notación de operador ($(f \circ g)(x)$ significa que $g$ precede a $f$).

  - **Composición múltiple**: $(f \circ g \circ h)(x) = f(g(h(x)))$, donde $h$ actúa primero, luego $g$, y finalmente $f$.

  - **Símbolos distintos**: No confundir $\circ$ (composición) con $\cdot$ (multiplicación escalar o puntual).'
definiciones_clave: '- **Operador de composición $\circ$**: Símbolo algebraico que denota la aplicación sucesiva de funciones.

  - **Evaluación anidada**: Expresión $f(g(x))$ donde la variable independiente de $f$ es sustituida por $g(x)$.'
propiedades_relaciones: '- **Equivalencia sintáctica**: $(f \circ g)(x) = f(g(x))$.

  - **Potencias funcionales**: $f^n(x) = (\underbrace{f \circ f \circ \dots \circ f}_{n \text{ veces}})(x)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La notación $(f \circ g)(x)$ representa formalmente la función $f$ evaluada en el valor $g(x)$, indicando que $g$ opera primero sobre $x$ y $f$ opera después sobre $g(x)$](/static/img/nodos/interpretacion-de-la-notacion-de-composicion-de-funciones-ejemplos.svg)



    Reescribe en notación de paréntesis las siguientes expresiones y determina el orden exacto de ejecución:

    1) $(h \circ f)(x)$

    2) $(p \circ q \circ r)(t)$'
  pasos:
  - 'Paso 1: Para $(h \circ f)(x)$: reescribir como $h(f(x))$. La función $f$ actúa primero y $h$ actúa en segundo lugar.'
  - 'Paso 2: Para $(p \circ q \circ r)(t)$: reescribir como $p(q(r(t)))$.'
  - 'Paso 3: Orden de ejecución: $1^\circ) \ r(t)$, luego $2^\circ) \ q(r(t))$, y finalmente $3^\circ) \ p(q(r(t)))$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la traducción exacta en notación de paréntesis de $(g \circ f)(x)$?
  choices:
  - text: g(f(x))
    is_correct: true
  - text: f(g(x))
    is_correct: false
  - text: g(x) * f(x)
    is_correct: false
  - text: g(x) + f(x)
    is_correct: false
  explanation: La alternativa correcta es 'g(f(x))'. La función $f$ está a la derecha y queda dentro de $g$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la expresión $(f \circ g \circ h)(x)$, ¿cuál es la primera función que se aplica a $x$?
  choices:
  - text: La funcion h.
    is_correct: true
  - text: La funcion f.
    is_correct: false
  - text: La funcion g.
    is_correct: false
  - text: Se aplican las tres juntas.
    is_correct: false
  explanation: 'La alternativa correcta es ''La funcion h.''. Se evalúa de derecha a izquierda: $f(g(h(x)))$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la expresión de composición $(f \circ g)(x)$.'
- 'Paso 2: Traducirla inmediatamente a la notación de paréntesis $f(g(x))$.'
- 'Paso 3: Identificar la función más interna como el primer paso de cálculo.'
- 'Paso 4: Ejecutar las evaluaciones sucesivamente de adentro hacia afuera.'
errores_correccion: '- **Error común:** Escribir $(f \circ g)(x)$ como $g(f(x))$.

  - **Cómo corregirlo:** La función de la izquierda ($f$) queda **afuera**; la función de la derecha ($g$) queda **adentro**: $(f \circ g)(x) = f(g(x))$.'
ejemplos:
- titulo: 'Ejemplo 1: Traducción directa'
  enunciado: ¿A qué equivale $(r \circ s)(5)$?
  alternativas:
  - r(s(5))
  - s(r(5))
  - r(5) * s(5)
  - r(5) + s(5)
  respuesta: r(s(5))
  solucion_pasos:
  - 'Paso 1: Por definición, $(r \circ s)(5) = r(s(5))$.'
- titulo: 'Ejemplo 2: Notación con funciones específicas'
  enunciado: Si $f(x) = x + 1$ y $g(x) = 3x$, ¿cómo se expresa $(g \circ f)(x)$?
  alternativas:
  - g(f(x)) = 3(x + 1)
  - f(g(x)) = 3x + 1
  - g(x) * f(x) = 3x(x + 1)
  - g(x) + f(x) = 4x + 1
  respuesta: g(f(x)) = 3(x + 1)
  solucion_pasos:
  - 'Paso 1: $(g \circ f)(x) = g(f(x)) = g(x + 1) = 3(x + 1)$.'
- titulo: 'Ejemplo 3: Cadena de tres funciones'
  enunciado: ¿Cómo se escribe $(f \circ f \circ f)(x)$?
  alternativas:
  - f(f(f(x)))
  - 3f(x)
  - (f(x))^3
  - f(3x)
  respuesta: f(f(f(x)))
  solucion_pasos:
  - 'Paso 1: Triple anidación: $f(f(f(x)))$.'
- titulo: 'Ejemplo 4: Lectura verbal'
  enunciado: ¿Cómo se lee formalmente la expresión $(f \circ g)$?
  alternativas:
  - f compuesto con g
  - f por g
  - f sobre g
  - f más g
  respuesta: f compuesto con g
  solucion_pasos:
  - 'Paso 1: La lectura formal en español es ''f compuesto con g''.'
errores_frecuentes:
- Invertir el orden de las funciones al traducir a paréntesis.
- Confundir el símbolo circ con multiplicación.
- Interpretar f^2(x) como f(x)^2 en lugar de f(f(x)) en contextos de operadores.
afirmaciones_verdaderas:
- La notación (f o g)(x) es idéntica a f(g(x)).
- En la composición (f o g), la función g es la primera en actuar sobre la variable independiente.
al_terminar_debes_poder: '**QUÉ:** Interpretar, traducir y utilizar con precisión la notación formal de composición de funciones.


  **CÓMO:** Reescribiendo (f ∘ g)(x) en la forma equivalente f(g(x)) y determinando el orden de cálculo de derecha a izquierda.


