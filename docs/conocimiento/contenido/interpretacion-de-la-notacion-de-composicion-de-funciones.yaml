semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.NOTACION
resumen_inicial: La interpretación de la notación de composición de funciones aclara el significado y lectura de los símbolos $(f \circ g)(x)$ y $f(g(x))$.
explicacion_simple: |
  En la notación matemática de composición existen **dos formas equivalentes de escribir lo mismo**:

  1. **Notación con círculo**: **$(f \circ g)(x)$** $\implies$ se lee "$f$ compuesta con $g$ de $x$".
  2. **Notación con paréntesis anidados**: **$f(g(x))$** $\implies$ se lee "$f$ evaluada en $g$ de $x$".

  **Regla visual de orden**: En ambas notaciones, la función que está **más cerca de la $x$** (en este caso $g$) es la que **actúa primero**.
explicacion_formal: |
  Sean $f$ y $g$ dos funciones de variable real. La equivalencia operacional entre los símbolos de composición se define formalmente como:

  $$(f \circ g)(x) \equiv f\big(g(x)\big)$$

  **Análisis sintáctico del símbolo $\circ$:**
  - El operador infijo $\circ$ denota la operación binaria de composición en el álgebra de funciones.
  - La expresión $(f \circ g)$ denota por sí misma una **nueva función resultado**, cuya regla de asignación sobre un elemento $x$ se explicita mediante la notación anidada $f(g(x))$.
definiciones_clave: |
  - **Notación de composición**: Convención simbólica estándar $(f \circ g)(x) = f(g(x))$ que indica el encadenamiento de dos reglas de correspondencia.
propiedades_relaciones: |
  - **Identidad de notación**: $(f \circ g)(x)$ representa la aplicación de la función de la izquierda $f$ sobre el valor de salida producido por la función de la derecha $g$.
ejemplo_guiado:
  enunciado: 'Escribe la expresión $h(x) = \sqrt{2x + 5}$ como la composición de dos funciones simples $f(u)$ y $g(x)$ usando ambas notaciones.'
  pasos:
    - 'Paso 1: Identificar la operación interna: $g(x) = 2x + 5$.'
    - 'Paso 2: Identificar la operación externa que envuelve el resultado: $f(u) = \sqrt{u}$.'
    - 'Paso 3: Expresar mediante paréntesis anidados: $h(x) = f(g(x)) = f(2x + 5) = \sqrt{2x + 5}$.'
    - 'Paso 4: Expresar mediante el operador símbolo de composición: $h = f \circ g \implies h(x) = (f \circ g)(x)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué significa exactamente la notación $(f \circ g)(x)$?'
    choices:
      - {text: 'Que la función f se evalúa en el resultado de g(x), siendo equivalente a f(g(x)).', is_correct: true}
      - {text: 'Que la función f se multiplica por la función g y por x.', is_correct: false}
      - {text: 'Que la función g se evalúa en el resultado de f(x).', is_correct: false}
      - {text: 'Que ambas funciones se dividen entre x.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que la función f se evalúa en el resultado de g(x), siendo equivalente a f(g(x)).''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si $g(x) = 2x + 5$ y $f(u) = \sqrt{u}$, ¿cuál es la notación equivalente de $h(x) = \sqrt{2x + 5}$?'
    choices:
      - {text: '$h(x) = (f \circ g)(x) = f(g(x))$', is_correct: true}
      - {text: '$h(x) = (g \circ f)(x) = g(f(x))$', is_correct: false}
      - {text: '$h(x) = f(x) \cdot g(x)$', is_correct: false}
      - {text: '$h(x) = f(x) + g(x)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$h(x) = (f \circ g)(x) = f(g(x))$''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Reconocer la equivalencia $(f \circ g)(x) \iff f(g(x))$.'
  - 'Paso 2: Identificar la función de la derecha o interna como la primera en aplicarse.'
  - 'Paso 3: Identificar la función de la izquierda o externa como la segunda en aplicarse.'
  - 'Paso 4: Redactar o interpretar correctamente las instrucciones de evaluación del símbolo.'
errores_correccion: |
  - **Error común:** Confundir el símbolo de composición $\circ$ (círculo pequeño) con la multiplicación de números o funciones $\cdot$.
  - **Cómo corregirlo:** El símbolo $\circ$ significa **COMPOSICIÓN DE FUNCIONES** ($f(g(x))$), no producto ni multiplicación algebraica.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de composición de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de composición de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'El símbolo $\circ$ en $(f \circ g)(x)$ representa la multiplicación de los valores de las funciones $f(x) \cdot g(x)$.'
  - 'La expresión $(f \circ g)(x)$ indica que se debe calcular el grado del polinomio dividiendo $f$ entre $g$.'
  - 'En la notación $f(g(x))$, los paréntesis externos indican que $f$ es una constante multiplicativa.'
  - 'Escribir $(f \circ g)$ sin la variable $x$ es una notación matemáticamente incorrecta que no representa una función.'
  - 'El orden de lectura en la notación $(f \circ g)(x)$ exige evaluar primero la función $f$ por estar escrita a la izquierda.'
afirmaciones_verdaderas:
  - 'La notación $(f \circ g)(x)$ es equivalente por definición a la notación de paréntesis anidados $f(g(x))$.'
  - 'El símbolo $\circ$ representa la operación binaria de composición entre funciones y no debe confundirse con la multiplicación algebraica.'
al_terminar_debes_poder: |
  QUÉ: Interpretar y utilizar adecuadamente las notaciones compuestas $(f \circ g)(x)$ y $f(g(x))$.
  CÓMO: Reconocer la equivalencia simbólica, identificar el orden de aplicación de las funciones y evitar confusiones con la multiplicación.
fuente: 'Texto escolar MINEDUC — Álgebra / Composición de Funciones'
