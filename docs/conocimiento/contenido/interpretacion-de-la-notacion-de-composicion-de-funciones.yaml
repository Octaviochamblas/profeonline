semantic_id: MAT.ALG.COMPOSICION_FUNCIONES.NOTACION
resumen_inicial: La notación $(f \circ g)(x)$ se lee '$f$ compuesta con $g$' y equivale
  exactamente a la expresión parentizada $f(g(x))$.
explicacion_simple: 'Existen dos formas equivalentes de escribir una función compuesta:

  - La notación con el círculo pequeño: **$(f \circ g)(x)$**.

  - La notación parentizada directa: **$f(g(x))$**.

  Ambas indican exactamente lo mismo: toma la función $f$ y donde veas la variable
  $x$, reemplázala por toda la expresión de $g(x)$.'
explicacion_formal: 'La equivalencia notacional entre el operador de composición ''$\circ$''
  y los paréntesis anidados se define como:


  $$(f \circ g)(x) \equiv f(g(x))$$


  **Desglose de la fórmula:**

  - Identidad operacional que establece que el símbolo $\circ$ denota la sustitución
  del argumento de $f$ por el cuerpo de la función $g(x)$.'
definiciones_clave: '- **Operador de composición ($\circ$)**: Símbolo matemático que
  vincula dos funciones en secuencia ejecutable de derecha a izquierda.'
propiedades_relaciones: '- **Lectura de derecha a izquierda**: En $(f \circ g)(x)$,
  la ejecución va desde la derecha ($g$) hacia la izquierda ($f$).'
ejemplo_guiado:
  enunciado: Reescribe la expresión $(h \circ p)(t)$ en notación parentizada e indica
    cuál es la función interna y cuál es la externa.
  pasos:
  - 'Paso 1: Aplicar la equivalencia de notación: $(h \circ p)(t) = h(p(t))$.Paso
    2: Identificar la función encerrada entre los paréntesis internos: $p(t)$ es la
    función interna.Paso 3: Identificar la función que envuelve exteriormente: $h$
    es la función externa.Paso 4: Concluir que $p$ actúa primero sobre $t$ e inmediatamente
    $h$ actúa sobre $p(t)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la representación equivalente parentizada correcta de la notación
    $(h \circ p)(t)$?
  choices:
  - text: $h(p(t))$
    is_correct: true
  - text: $p(h(t))$
    is_correct: false
  - text: $h(t) \cdot p(t)$
    is_correct: false
  - text: $h(t) + p(t)$
    is_correct: false
  explanation: La alternativa correcta es '$h(p(t))$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la notación parentizada $h(p(t))$, ¿qué representa la expresión $p(t)$?
  choices:
  - text: El argumento de entrada de la función externa $h$.
    is_correct: true
  - text: La multiplicación de h por p.
    is_correct: false
  - text: La derivada de la función h.
    is_correct: false
  - text: Un valor constante independiente.
    is_correct: false
  explanation: La alternativa correcta es 'El argumento de entrada de la función externa
    $h$.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar la expresión $(f \circ g)(x)$.'
- 'Paso 2: Transformarla a $f(g(x))$ colocando la función de la derecha entre paréntesis
  dentro de la de la izquierda.'
- 'Paso 3: Utilizar la forma parentizada para realizar sustituciones o evaluaciones
  algebraicas.'
errores_correccion: '- **Error común:** Confundir la notación $(f \circ g)(x)$ con
  la notación de producto de funciones $(f \cdot g)(x)$.

  - **Cómo corregirlo:** El círculo pequeño $\circ$ indica sustitución de funciones
  (composición), mientras que un punto $\cdot$ o espacio indica multiplicación algebraica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de composición de funciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de composición de funciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La composición de funciones (f o g)(x) equivale a f(g(x))?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición notacional de composición de funciones.
- titulo: ¿La composición de funciones es conmutativa en general?
  respuesta: 'No'
  solucion_pasos:
  - No, en general (f o g)(x) != (g o f)(x).
errores_frecuentes:
- Confundir la composición de funciones $(f \circ g)(x)$ con la multiplicación de
  funciones $(f \cdot g)(x)$.
- Evaluar primero la función externa de la izquierda en lugar de la función interna
  de la derecha.
- Asumir falsamente que la composición de funciones es conmutativa ($(f \circ g)(x)
  = (g \circ f)(x)$).
- Olvidar distribuir coeficientes al sustituir expresiones compuestas en el cálculo
  algebraico.
- Determinar el dominio únicamente desde la fórmula reducida final ignorando las restricciones
  del proceso intermedio.
afirmaciones_verdaderas:
- La composición de funciones $(f \circ g)(x) = f(g(x))$ consiste en evaluar la función
  externa $f$ en el resultado de la función interna $g(x)$.
- El dominio de la composición $\operatorname{Dom}(f \circ g)$ hereda todas las restricciones
  de la función interna $g(x)$ y exige que $g(x) \in \operatorname{Dom}(f)$.
al_terminar_debes_poder: Al finalizar este recurso podrás comprender, evaluar numéricamente
  y calcular algebraicamente composiciones de funciones, reconociendo la no conmutatividad
  y analizando sus dominios resultantes.
