semantic_id: MAT.NUM.RAZONES_PROPORCIONES.PROBLEMAS_PROP_INVERSA
resumen_inicial: 'La resolución de problemas de proporcionalidad inversa consiste en igualar los productos horizontales de las magnitudes involucradas: $A_1 \cdot B_1 = A_2 \cdot x$ y despejar la incógnita: $x = \frac{A_1 \cdot B_1}{A_2}$.'
explicacion_simple: "![Resolución de problemas inversos](/static/img/nodos/resolucion-de-problemas-de-proporcion-inversa-intro.svg)\n\nPara resolver cualquier problema de **proporcionalidad inversa**, sigue este método infalible en 3 pasos:\n\n1. **Paso 1: Validar el comportamiento inverso**\n   - Pregúntate: *«¿Si aumentamos los recursos (obreros, velocidad, bombas), el tiempo disminuye?»*\n   - Si la respuesta es SÍ, es proporción inversa.\n2. **Paso 2: Plantear la multiplicación HORIZONTAL (de lado)**\n   - ¡NO multipliques en cruz! En proporción inversa se multiplica de lado:\n   $$A_1 \\cdot B_1 = A_2 \\cdot x$$\n3. **Paso 3: Despejar la incógnita**\n   $$x = \\frac{A_1 \\cdot B_1}{A_2}$$\n\n- **Ejemplo:** Si $8$ obreros tardan $15$ días en terminar una obra, ¿cuánto tardarán $12$ obreros?\n  - Planteamos la igualdad horizontal: $8 \\cdot 15 = 12 \\cdot x$.\n  - $120 = 12x \\implies x = \\frac{120}{12} = 10\\text{ días}$."
explicacion_formal: 'Sea un problema en contexto con magnitudes $A$ y $B$ tales que $A \cdot B = k = \text{cte} > 0$.


  **Algoritmo Formal de Solución:**

  1. **Verificación de la Hipótesis Inversa:** Comprobar que $B \propto \frac{1}{A}$.

  2. **Igualdad de Productos Invariantes:**

  $$A_1 \cdot B_1 = A_2 \cdot B_2$$

  3. **Despeje de la Incógnita:**

  $$B_2 = \frac{A_1 \cdot B_1}{A_2} \quad (A_2 > 0)$$

  4. **Análisis Dimensional:**

  $$[B_2] = \frac{[A_1] \cdot [B_1]}{[A_2]} = [B_1] \quad (\text{dado que } [A_1] = [A_2])$$'
definiciones_clave: '- **Problema de proporción inversa**: Situación donde el producto de magnitudes es constante.

  - **Multiplicación horizontal**: Técnica $A_1 \cdot B_1 = A_2 \cdot x$ (opuesta al producto cruzado).

  - **Validación contextual**: Comprobación lógica de que más recursos implican menor tiempo o esfuerzo.'
propiedades_relaciones: '- **Regla de tres inversa**: Formulación algorítmica donde $x = \frac{A_1 \cdot B_1}{A_2}$.

  - **Conservación de trabajo total**: $W = A_1 B_1 = A_2 B_2$ permanece constante.'
ejemplo_guiado:
  enunciado: '![Ejemplos de problemas inversos](/static/img/nodos/resolucion-de-problemas-de-proporcion-inversa-ejemplos.svg)


    Si $8$ obreros tardan $15\text{ días}$ en pavimentar una calle, ¿cuánto tardarán $12$ obreros? Además, si $4$ grifos llenan una piscina en $6\text{ horas}$, ¿cuántos grifos se necesitan para llenarla en $2\text{ horas}$?'
  pasos:
  - 'Paso 1: Para los obreros: Plantear producto horizontal $8 \cdot 15 = 12 \cdot x \implies 120 = 12x$.'
  - 'Paso 2: Despejar $x$: $x = \frac{120}{12} = 10\text{ días}$.'
  - 'Paso 3: Para los grifos: Plantear producto constante $4 \cdot 6 = n \cdot 2 \implies 24 = 2n$.'
  - 'Paso 4: Despejar número de grifos $n$: $n = \frac{24}{2} = 12\text{ grifos}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se plantea la ecuación en una regla de tres inversamente proporcional?
  choices:
  - text: Multiplicando horizontalmente $A_1 \cdot B_1 = A_2 \cdot x$
    is_correct: true
  - text: Multiplicando en cruz $A_1 \cdot x = B_1 \cdot A_2$
    is_correct: false
  - text: Sumando todas las magnitudes
    is_correct: false
  - text: Dividiendo $A_1$ entre $A_2$ directamente
    is_correct: false
  explanation: La alternativa correcta es 'Multiplicando horizontalmente $A_1 \cdot B_1 = A_2 \cdot x$'.
  reinforcement_section: Explicación formal
