semantic_id: MAT.NUM.PROP_INVERSA.PROBLEMAS_CONTEXTO
resumen_inicial: 'La resolución de problemas de proporción inversa consiste en utilizar la constante de producto $k = x \cdot y$ o el producto recto $x_1 \cdot y_1 = x_2 \cdot y_2$ para calcular valores desconocidos.'
explicacion_simple: |
  Los problemas de proporción inversa ocurren cuando más de una cosa reduce el esfuerzo de la otra: si contratas más obreros se tardan menos días; si aumentas la velocidad llegas en menos tiempo; si abres más llaves el estanque se llena en menos minutos. Para resolverlos, usas la **regla de tres simple inversa**: multiplicas los dos números que están juntos en la misma fila ($x_1 \cdot y_1$) y divides entre el número restante ($x_2$).
explicacion_formal: |
  ### Definición formal
  Un **problema de proporción inversa en contexto real** es aquel en el que dos magnitudes $X$ e $Y$ satisfacen la ley de compensación de producto $x \cdot y = k$. Dado un par de datos de referencia $(x_1, y_1)$ y un nuevo valor $x_2$, el valor buscado $y_2$ cumple:
  $$x_1 \cdot y_1 = x_2 \cdot y_2 \implies y_2 = \frac{x_1 \cdot y_1}{x_2}$$

  ### Algoritmo de la Regla de Tres Simple Inversa
  1. **Disposición tabular de datos**:
     $$\begin{array}{ccc} \text{Magnitud } X & & \text{Magnitud } Y \\ x_1 & \longrightarrow & y_1 \\ x_2 & \longrightarrow & y_2 \end{array}$$
  2. **Multiplicación horizontal recta y división**:
     $$y_2 = \frac{x_1 \cdot y_1}{x_2}$$

  ### Principales ámbitos de aplicación
  - **Rendimiento y personal**: Número de obreros vs. tiempo de construcción.
  - **Velocidad y tiempo**: Velocidad de desplazamiento vs. tiempo de recorrido.
  - **Caudal de llenado**: Número de bombas / cañerías vs. tiempo de llenado.
  - **Geometría de área constante**: Base vs. altura de un rectángulo de área fija ($A = b \cdot h$).

  ### Síntesis didáctica
  - Algoritmo práctico: $y_{\text{buscado}} = \frac{\text{Producto horizontal conocido}}{\text{Dato restante}}$.
definiciones_clave: |
  - **Regla de tres simple inversa**: Algoritmo para resolver problemas donde el producto de dos magnitudes es constante ($x_1 \cdot y_1 = x_2 \cdot y_2$).
  - **Multiplicación en línea recta**: Técnica operativa de la regla inversa que multiplica los valores de la misma fila horizontal.
  - **Magnitudes de compensación**: Pareja de variables donde el incremento de una genera la disminución de la otra bajo la misma proporción.
propiedades_relaciones: |
  - **Diferencia operativa con la regla directa**: Mientras que la regla directa multiplica en diagonal ($x_2 \cdot y_1$), la regla inversa multiplica en **línea recta horizontal ($x_1 \cdot y_1$)**.
  - **Verificación de sentido inverso**: Si la cantidad independiente aumenta, la cantidad dependiente calculada debe ser estrictamente menor que la inicial.
ejemplo_guiado:
  enunciado: 'Un equipo de $6$ pintores tarda $10\text{ días}$ en pintar un edificio. ¿Cuántos días tardarán $15$ pintores con el mismo rendimiento?'
  pasos:
    - 'Paso 1: Planteamos los datos verificando que es proporción inversa (a más pintores, menos días): 6 pintores $\to$ 10 días ; 15 pintores $\to y_2$ días.'
    - 'Paso 2: Formulamos la igualdad de productos horizontales: $6 \cdot 10 = 15 \cdot y_2$.'
    - 'Paso 3: Calculamos la constante de trabajo: $k = 60\text{ días-pintor}$.'
    - 'Paso 4: Despejamos $y_2$ dividiendo entre 15: $y_2 = \frac{60}{15} = 4\text{ días}$. Tardarán **4 días**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el procedimiento de la regla de tres simple inversa para calcular la incógnita $y_2$ en la tabla $x_1 \to y_1$ y $x_2 \to y_2$?'
    choices:
      - {text: 'Multiplicar en línea recta horizontal los datos de la primera fila $x_1 \cdot y_1$ y dividir por $x_2$ ($y_2 = \frac{x_1 \cdot y_1}{x_2}$)', is_correct: true}
      - {text: 'Multiplicar en diagonal $x_2 \cdot y_1$ y dividir entre $x_1$', is_correct: false}
      - {text: 'Sumar las dos filas de la tabla', is_correct: false}
      - {text: 'Dividir $x_1$ entre $y_1$ y multiplicar por $x_2$', is_correct: false}
    explanation: 'La alternativa correcta es ''Multiplicar en línea recta horizontal los datos de la primera fila $x_1 \cdot y_1$ y dividir por $x_2$ ($y_2 = \frac{x_1 \cdot y_1}{x_2}$)''. Es el algoritmo de la regla de tres inversa.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'A una velocidad de $90\text{ km/h}$, un tren tarda $4\text{ horas}$ en completar un viaje. ¿A qué velocidad debe viajar para completar el mismo recorrido en $3\text{ horas}$?'
    choices:
      - {text: '$120\text{ km/h}$, calculando la constante de distancia $360\text{ km}$ y dividiendo entre $3$', is_correct: true}
      - {text: '$67.5\text{ km/h}$, aplicando regla directa por error', is_correct: false}
      - {text: '$100\text{ km/h}$, sumando $10\text{ km/h}$', is_correct: false}
      - {text: '$270\text{ km/h}$, multiplicando $90 \cdot 3$', is_correct: false}
    explanation: 'La alternativa correcta es ''$120\text{ km/h}$, calculando la constante de distancia $360\text{ km}$ y dividiendo entre $3$''. Distancia total: $90 \cdot 4 = 360\text{ km}$; nueva velocidad: $360 / 3 = 120\text{ km/h}$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Leer el problema e identificar las dos magnitudes que se relacionan.'
  - 'Paso 2: Confirmar que son inversamente proporcionales (si una aumenta, la otra disminuye en la misma proporción).'
  - 'Paso 3: Organizar la tabla de datos en dos filas horizontales.'
  - 'Paso 4: Multiplicar los dos datos de la fila completa ($x_1 \cdot y_1$) y dividir por el dato de la fila incompleta.'
errores_correccion: |
  - **Error 1:** Multiplicar en diagonal (usar la regla directa) en un problema de proporción inversa. **Cómo corregirlo:** En la proporción inversa la constante es el producto de cada fila ($x_1 \cdot y_1 = x_2 \cdot y_2$), por lo que debes **multiplicar HORIZONTALMENTE en línea recta**.
  - **Error 2:** No verificar la coherencia del resultado en contexto. **Cómo corregirlo:** Si aumentas el número de trabajadores o la velocidad, el tiempo obtenido **debe ser menor al tiempo original**. Si resulta mayor, aplicaste la fórmula equivocada.
ejemplos:
  - titulo: 'Problema de ración de alimento'
    enunciado: 'Un alimento rinde para $20$ animales durante $15$ días. Si el grupo aumenta a $30$ animales, ¿el alimento durará $10$ días?'
    alternativas:
      - 'Sí, pues $(20 \cdot 15) / 30 = 300 / 30 = 10\text{ días}$'
      - 'No, durará 22.5 días'
      - 'No, durará 5 días'
    respuesta: 'Sí, pues $(20 \cdot 15) / 30 = 300 / 30 = 10\text{ días}$'
    solucion_pasos:
      - '1. Constante de alimento: $k = 20 \cdot 15 = 300\text{ raciones}$.'
      - '2. Días para 30 animales: $300 / 30 = 10\text{ días}$.'
  - titulo: 'Problema de vaciado de estanque'
    enunciado: 'Si $2$ bombas vacían un depósito en $6\text{ horas}$, ¿$4$ bombas tardarán $3\text{ horas}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $k = 2 \cdot 6 = 12 \implies 12 / 4 = 3\text{ horas}$.'
  - titulo: 'Problema de dimensiones de rectángulo'
    enunciado: 'Un rectángulo de base $12\text{ cm}$ y altura $5\text{ cm}$ tiene área $60\text{ cm}^2$. Si su base cambia a $15\text{ cm}$, ¿su altura debe ser $4\text{ cm}$ para conservar el área?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $h = 60 / 15 = 4\text{ cm}$.'
  - titulo: 'Problema de engranajes acoplados'
    enunciado: 'Un engranaje de $10$ dientes gira a $120\text{ rpm}$. Si se acopla a uno de $30$ dientes, ¿el segundo girará a $40\text{ rpm}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $10 \cdot 120 = 1.200 \implies 1.200 / 30 = 40\text{ rpm}$.'
errores_frecuentes:
  - 'Aplicar la regla de tres simple directa multiplicando en diagonal en problemas de proporción inversa.'
  - 'Cualquier problema donde una variable disminuye cuando la otra aumenta es de proporcionalidad inversa.'
  - 'El producto de los pares de datos iniciales y finales puede variar entre diferentes estados.'
  - 'No es necesario verificar la constante de producto si los números parecen encajar.'
  - 'En un problema con dos magnitudes cambiantes, se considera por defecto la existencia de una proporción inversa.'
afirmaciones_verdaderas:
  - 'En los problemas de proporcionalidad inversa, el producto de los valores de cada estado permanece constante: $x_1 \cdot y_1 = x_2 \cdot y_2$.'
  - 'La regla de tres simple inversa se resuelve mediante la fórmula $y_2 = \frac{x_1 \cdot y_1}{x_2}$.'
al_terminar_debes_poder: 'Resolver problemas en contexto real aplicando la regla de tres simple inversa y la constante de producto $k = x \cdot y$.'
