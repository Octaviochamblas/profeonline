    is_correct: false
  explanation: La alternativa correcta es 'Porque al haber más trabajadores el tiempo total necesario se reduce proporcionalmente para mantener el trabajo constante'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Leer el enunciado e identificar las magnitudes y sus unidades.'
- 'Paso 2: Confirmar que la relación es inversa (más produce menos en tiempo o consumo).'
- 'Paso 3: Plantear la ecuación horizontal $A_1 \cdot B_1 = A_2 \cdot x$ y despejar $x = \frac{A_1 \cdot B_1}{A_2}$.'
errores_correccion: '- **Error 1: Aplicar producto cruzado por inercia.** **Cómo corregirlo:** En la proporción inversa la multiplicación es HORIZONTAL ($A_1 \cdot B_1 = A_2 \cdot x$).

  - **Error 2: No verificar el sentido común de la respuesta.** **Cómo corregirlo:** Si más obreros resultan tardando más días, se cometió un error de planteamiento directo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Un tren a $90\text{ km/h}$ tarda $4\text{ horas}$ en completar un trayecto. ¿Cuánto tardará a $120\text{ km/h}$?
  alternativas:
  - $3\text{ horas}$
  - $5,33\text{ horas}$
  - $2,5\text{ horas}$
  respuesta: $3\text{ horas}$
  solucion_pasos:
  - $90 \cdot 4 = 120 \cdot t \implies 360 = 120t \implies t = \frac{360}{120} = 3\text{ horas}$.
- titulo: Ejemplo 2
  enunciado: Para envasar una partida de aceite se necesitan $60$ botellas de $2\text{ litros}$. ¿Cuántas botellas de $0,5\text{ litros}$ se necesitarán?
  alternativas:
  - $240\text{ botellas}$
  - $15\text{ botellas}$
  - $120\text{ botellas}$
  respuesta: $240\text{ botellas}$
  solucion_pasos:
  - $60 \cdot 2 = n \cdot 0,5 \implies 120 = 0,5n \implies n = \frac{120}{0,5} = 240\text{ botellas}$.
- titulo: ¿Se multiplica horizontalmente en problemas de proporción inversa?
  respuesta: Sí
  solucion_pasos:
  - Sí, la regla práctica iguala los productos horizontales de cada situación.
  alternativas:
  - texto: Sí, la multiplicación horizontal refleja la conservación del producto constante
    es_correcta: true
    retroalimentacion: ¡Correcto! Conservación de $k$.
  - texto: No, se multiplica en cruz
    es_correcta: false
    retroalimentacion: Incorrecto, la multiplicación en cruz es para proporción directa.
  - texto: No, se multiplican las diagonales
    es_correcta: false
    retroalimentacion: Incorrecto, se multiplica en paralelo horizontal.
- titulo: ¿Es inversamente proporcional la cantidad de comida disponible por persona según el número de comensales?
  respuesta: Sí
  solucion_pasos:
  - Sí, con una cantidad fija de víveres, a más comensales corresponde menor ración por persona.
  alternativas:
  - texto: Sí, la ración unitaria disminuye proporcionalmente al aumentar los comensales
    es_correcta: true
    retroalimentacion: ¡Correcto! Reparto inversamente proporcional.
  - texto: No, es proporcional directa
    es_correcta: false
    retroalimentacion: Incorrecto, no aumenta la ración al haber más gente.
  - texto: No, no existe relación matemática
    es_correcta: false
    retroalimentacion: Incorrecto, la relación es exactamente $R = V / n$.
errores_frecuentes:
- Aplicar regla de tres directa multiplicando en cruz.
- No convertir unidades heterogéneas antes de plantear los productos.
- Olvidar comprobar que la respuesta sea coherente con el sentido inverso.
- Cometer errores al dividir por decimales.
afirmaciones_verdaderas:
- En la proporcionalidad inversa, el producto de las magnitudes permanece constante.
- El problema se resuelve planteando $A_1 \cdot B_1 = A_2 \cdot x$.
- Al aumentar una magnitud, la otra disminuye en el mismo factor multiplicativo.
al_terminar_debes_poder: '![Síntesis de resolución de problemas inversos](/static/img/nodos/resolucion-de-problemas-de-proporcion-inversa-resumen.svg)


  QUÉ: Resolver problemas contextuales aplicando el modelo y las propiedades de la proporcionalidad inversa.


  CÓMO: Validando la naturaleza inversa de las variables, planteando la ecuación de producto horizontal $A_1 \cdot B_1 = A_2 \cdot x$ y despejando la incógnita $x = \frac{A_1 \cdot B_1}{A_2}$.'
