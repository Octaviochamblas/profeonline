semantic_id: MAT.NUM.PROP_INVERSA.PROBLEMAS_CONTEXTO
resumen_inicial: 'Resolución de problemas de proporción inversa: concepto y propiedades fundamentales
  en Proporcionalidad inversa.'
explicacion_simple: ¿Cómo calculas a qué velocidad debes manejar para llegar a tiempo si saliste
  tarde? Este tipo de cálculos, donde apurar el paso reduce la demora, se resuelven utilizando
  proporcionalidad inversa.
explicacion_formal: 'En la vida diaria, las proporciones inversas aparecen típicamente en
  tres contextos: tiempo y velocidad, tiempo y cantidad de trabajadores, o reparto equitativo
  de un recurso fijo.


  Para resolverlos, el método más seguro no es la regla de tres cruzada (que se usa en directa),
  sino **igualar los productos** (regla de tres inversa). Si la situación inicial tiene valores
  $x_1$ e $y_1$, y la situación final tiene $x_2$ e $y_2$, se cumple que:

  $$x_1 \cdot y_1 = x_2 \cdot y_2$$

  De aquí simplemente despejas el valor desconocido.'
definiciones_clave: '- **Resolución de problemas de proporción inversa**: Elemento central
  dentro del estudio de Proporcionalidad inversa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas aplicables
  a resolución de problemas de proporción inversa.'
ejemplo_guiado:
  enunciado: Si 5 pintores terminan un mural en 18 días, ¿cuántos días demorarán 9 pintores,
    manteniendo el mismo ritmo de trabajo?
  pasos:
  - 'Confirmo que la relación es inversa: más pintores trabajando significa menos días para
    terminar.'
  - 'Calculo el trabajo total: k igual a 5 por 18, o sea 90 días-pintor.'
  - 'Calculo el tiempo con 9 pintores: 90 dividido entre 9 es igual a 10 días.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el aspecto fundamental al trabajar con resolución de problemas de proporción
    inversa?
  choices:
  - text: Identificar correctamente la relación de proporcionalidad inversa
    is_correct: true
  - text: Sumar arbitrariamente los datos
    is_correct: false
  - text: Ignorar las unidades de medida
    is_correct: false
  - text: Multiplicar siempre por cero
    is_correct: false
  explanation: 'La correcta es: Identificar correctamente la relación de proporcionalidad
    inversa. Fundamento conceptual básico.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el desarrollo de un ejercicio de resolución de problemas de proporción inversa,
    ¿qué paso es indispensable?
  choices:
  - text: Verificar la coherencia del resultado con el enunciado
    is_correct: true
  - text: Omitir el procedimiento de cálculo
    is_correct: false
  - text: Cambiar el orden de los datos al azar
    is_correct: false
  - text: Dividir siempre entre 100 sin justificación
    is_correct: false
  explanation: 'La correcta es: Verificar la coherencia del resultado con el enunciado. Paso
