  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirma que la relación es inversa (más trabajadores = menos días).'
- 'Paso 2: Multiplica los dos datos de la situación inicial conocida para obtener $k$.'
- 'Paso 3: Divide esa constante $k$ por el único dato conocido de la situación final para
  hallar la incógnita.'
errores_correccion: Evita confundir los datos de entrada al operar con resolución de problemas
  de proporción inversa.
ejemplos:
- titulo: Pintores y días
  enunciado: Si 3 pintores pintan una casa en 12 días, ¿cuántos días demorarán 4 pintores?
  solucion_pasos:
  - Es inversa (más pintores, menos días).
  - 'Calculamos el trabajo total: $3 \text{ pintores} \cdot 12 \text{ días} = 36$ días-pintor
    ($k$).'
  - 'Dividimos por la nueva cantidad: $36 / 4 \text{ pintores} = 9$ días.'
- titulo: Ejemplo 2
  enunciado: Si 3 grifos llenan una piscina en 20 horas, ¿cuánto demorarán 4 grifos?
  alternativas:
  - '15'
  - 26,7
  - '24'
  respuesta: '15'
  solucion_pasos:
  - k es igual a 3 por 20, o sea 60; 60 dividido entre 4 es igual a 15.
- titulo: ¿La relación entre el número de kilos comprados y el precio total pagado es una
    proporción inversa?
  respuesta: 'No'
  solucion_pasos:
  - 'Es una proporción directa: a más kilos, más dinero se paga, en la misma proporción.'
- titulo: Ejemplo 3
  enunciado: Un viaje a 60 km/h demora 5 horas. ¿Cuánto demorará el mismo viaje a 100 km/h?
  alternativas:
  - '3'
  - 8,3
  - 1,7
  respuesta: '3'
  solucion_pasos:
  - k es igual a 60 por 5, o sea 300, la distancia recorrida; 300 dividido entre 100 es igual
    a 3 horas.
errores_frecuentes:
- Aplicar la regla de tres simple cruzada ($x = 4\cdot12/3 = 16$), obteniendo absurdamente
  que más pintores demoran más.
- 'No verificar lógicamente el resultado (preguntarse: ¿tiene sentido que demoren más si son
  más?).'
- Aplicar el modelo de proporción inversa a una situación que en realidad es de proporcionalidad
  directa.
- Usar la regla de tres directa, con multiplicación cruzada, en un problema que en realidad
  es de proporción inversa.
- No verificar si el resultado tiene sentido lógico, por ejemplo que más trabajadores demoren
  más tiempo.
afirmaciones_verdaderas:
- La propiedad de resolución de problemas de proporción inversa preserva la consistencia lógica.
- Antes de aplicar una proporción inversa a un problema, hay que confirmar que al aumentar
  una magnitud, la otra efectivamente disminuye en la misma proporción.
al_terminar_debes_poder: Resolver problemas aplicados que involucren resolución de problemas
  de proporción inversa.
fuente: Currículum Nacional MINEDUC.
estado: publicado
