resumen_inicial: La resolución de problemas de proporción inversa en contexto utiliza
  la regla de tres inversa $x_1 \cdot y_1 = x_2 \cdot y_2$ para hallar valores desconocidos
  despejando $y_2 = \frac{x_1 \cdot y_1}{x_2}$.
explicacion_simple: Para resolver problemas cotidianos inversos (como tiempo y velocidad
  o trabajadores y días de obra), multiplicamos los dos datos conocidos que corresponden
  a la primera situación y dividimos entre el dato de la segunda situación.
explicacion_formal: 'Dado un problema en contexto con magnitudes inversas $\{(x_1,
  y_1), (x_2, y_2)\}$, el **Procedimiento de Regla de Tres Inversa** establece:


  $$x_1 \cdot y_1 = x_2 \cdot y_2 \implies y_2 = \frac{x_1 \cdot y_1}{x_2}$$


  **Verificación de hipótesis:**

  - Confirmar que un aumento en $x$ implique una disminución proporcional estricta
  en $y$.'
definiciones_clave: '- **Resolución de proporción inversa**: Aplicación de $x_1 \cdot
  y_1 = x_2 \cdot y_2$ en problemas cotidianos.'
propiedades_relaciones: '- **Regla de tres inversa**: Despeje $y_2 = \frac{x_1 \cdot
  y_1}{x_2}$.'
ejemplo_guiado:
  enunciado: Un camión tarda $6\text{ horas}$ a $80\text{ km/h}$ en completar una
    ruta. ¿Cuánto tardará a $100\text{ km/h}$?
  pasos:
  - 'Paso 1: Identificar las variables: velocidad ($x$) y tiempo ($y$). Verificar
    proporción inversa.'
  - 'Paso 2: Plantear el producto constante: $x_1 \cdot y_1 = 80 \cdot 6 = 480\text{
    km}$.'
  - 'Paso 3: Despejar el nuevo tiempo $y_2 = \frac{480}{100} = 4,8\text{ horas}$.'
  - 'Paso 4: Convertir $4,8\text{ horas}$ a horas y minutos: $4\text{ h } + 0,8 \cdot
    60\text{ min} = 4\text{ h } 48\text{ min}$.'
  - 'Conclusión: Tardará $4\text{ horas y } 48\text{ minutos}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué fórmula de regla de tres inversa permite calcular el valor desconocido
    y2?
  choices:
  - text: y2 = (x1 · y1) / x2 (multiplicando la pareja conocida e igualando productos)
    is_correct: true
  - text: y2 = (y1 · x2) / x1
    is_correct: false
  - text: y2 = x1 · y1 · x2
    is_correct: false
  - text: y2 = x1 + y1 - x2
    is_correct: false
  explanation: La alternativa correcta es 'y2 = (x1 · y1) / x2 (multiplicando la pareja
    conocida e igualando productos)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado del viaje a 100 km/h, ¿cuál fue el tiempo obtenido?
  choices:
  - text: 4,8 horas (o 4 h 48 min)
    is_correct: true
  - text: 7,5 horas
    is_correct: false
  - text: 5 horas
    is_correct: false
  - text: 6 horas
    is_correct: false
  explanation: La alternativa correcta es '4,8 horas (o 4 h 48 min)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de resolver problemas reales de proporcionalidad
  inversa utilizando la constante $k = x \cdot y$ o la regla de tres inversa $y_2
  = \frac{x_1 \cdot y_1}{x_2}$.
semantic_id: MAT.NUM.PROP_INVERSA.PROBLEMAS_CONTEXTO
procedimiento:
- 'Paso 1: Verificar que el producto $x \cdot y = k$ se mantenga constante entre todas
  las variables.'
- 'Paso 2: Construir el modelo $y = \frac{k}{x}$ o la hipérbola decreciente.'
- 'Paso 3: Calcular el valor incógnito despejando según la constante $k$.'
errores_correccion: '- **Error 1: Aplicar la regla de tres directa multiplicando cruzado
  en un problema inverso.** **Cómo corregirlo:** En la proporción inversa se multiplican
  los datos de la misma fila ($x_1 \cdot y_1 = x_2 \cdot y_2$).


  - **Error 2: Usar el cociente $y / x$ en lugar del producto $x \cdot y$ para calcular
  $k$.** **Cómo corregirlo:** La proporcionalidad inversa conserva el PRODUCTO $k
  = x \cdot y$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROP_INVERSA.PROBLEMAS_CONTEXTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de la proporcionalidad inversa.
- titulo: Ejemplo 2
  enunciado: Verificación de constante de producto.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por producto constante x · y.
- titulo: ¿Es la gráfica de una proporción inversa una recta?
  respuesta: 'No'
  solucion_pasos:
  - No, es una curva suave llamada rama de hipérbola.
- titulo: ¿Permite la constante k = x · y resolver ecuaciones inversas?
  respuesta: Sí
  solucion_pasos:
  - Sí, despejando $y = k / x$ o $x = k / y$.
errores_frecuentes:
- Aplicar la regla de tres directa para resolver problemas cuya naturaleza es inversamente
  proporcional.
- Dividir la variable dependiente entre la independiente ($y / x$) pretendiendo obtener
  la constante de proporción inversa.
- Graficar una proporcionalidad inversa mediante una línea recta que toca el origen
  $(0,0)$.
- Declarar que si una variable disminuye al aumentar otra, siempre son inversamente
  proporcionales sin comprobar $x \cdot y = k$.
- Omitir que el producto de los datos $x_1 \cdot y_1$ debe ser igual al producto $x_2
  \cdot y_2$.
afirmaciones_verdaderas:
- 'Dos variables $x$ e $y$ son inversamente proporcionales si su producto es constante:
  $x \cdot y = k$.'
- El gráfico de una relación de proporcionalidad inversa en el primer cuadrante es
  una rama de hipérbola decreciente.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
