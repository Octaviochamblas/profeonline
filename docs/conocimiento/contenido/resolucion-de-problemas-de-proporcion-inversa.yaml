semantic_id: MAT.NUM.PROP_INVERSA.PROBLEMAS_CONTEXTO
resumen_inicial: 'Resolución de problemas de proporción inversa: concepto y propiedades
  fundamentales en Proporcionalidad inversa.'
explicacion_simple: ¿Cómo calculas a qué velocidad debes manejar para llegar a tiempo
  si saliste tarde? Este tipo de cálculos, donde apurar el paso reduce la demora,
  se resuelven utilizando proporcionalidad inversa.
explicacion_formal: 'En la vida diaria, las proporciones inversas aparecen típicamente
  en tres contextos: tiempo y velocidad, tiempo y cantidad de trabajadores, o reparto
  equitativo de un recurso fijo.


  Para resolverlos, el método más seguro no es la regla de tres cruzada (que se usa
  en directa), sino **igualar los productos** (regla de tres inversa). Si la situación
  inicial tiene valores $x_1$ e $y_1$, y la situación final tiene $x_2$ e $y_2$, se
  cumple que:

  $$x_1 \cdot y_1 = x_2 \cdot y_2$$

  De aquí simplemente despejas el valor desconocido.'
definiciones_clave: '- **Resolución de problemas de proporción inversa**: Elemento
  central dentro del estudio de Proporcionalidad inversa.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a resolución de problemas de proporción inversa.'
ejemplo_guiado:
