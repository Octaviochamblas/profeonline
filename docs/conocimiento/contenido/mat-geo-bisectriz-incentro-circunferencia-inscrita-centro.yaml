- titulo: ¿Se cumple siempre la propiedad principal de propiedad del incentro como
    centro de la circunferencia inscrita en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede propiedad del incentro como centro de la circunferencia inscrita
    asumir un valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en propiedad del incentro como centro
