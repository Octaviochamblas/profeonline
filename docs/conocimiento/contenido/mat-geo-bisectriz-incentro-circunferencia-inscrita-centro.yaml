semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.CIRCUNFERENCIA_INSCRITA_CENTRO
resumen_inicial: 'Propiedad del incentro como centro de la circunferencia inscrita:
  conceptos, teoremas, propiedades geométricas y cálculo en Elementos Secundarios
  del Triángulo.'
explicacion_simple: Gracias a la equidistancia del incentro respecto a los tres lados,
  es posible trazar una única circunferencia centrada en él que toca (sin cruzar)
  cada uno de los tres lados.
explicacion_formal: '![Circunferencia inscrita, centro en el incentro](/static/img/geometria/elementos-secundarios/bisectriz-incentro-circunferencia-inscrita-centro.svg)


  ### Definición formal


  La circunferencia inscrita de un triángulo ABC tiene centro en el incentro I y radio
  igual al inradio r (la distancia común de I a los tres lados); es tangente a AB,
  BC y CA.


  ### Desarrollo didáctico


  Como I está a la misma distancia r de los tres lados, una circunferencia de centro
  I y radio r toca exactamente cada lado en un solo punto, sin cruzarlo: es tangente
  a los tres.'
