procedimiento:
- 'Paso 1: Identifica el punto exterior P y las dos secantes trazadas desde él.'
- 'Paso 2: En cada secante, identifica el punto de corte más cercano a P (segmento
  exterior) y el más lejano (segmento total).'
- 'Paso 3: Verifica que el segmento total siempre sea mayor que el segmento exterior
  correspondiente, pues lo contiene.'
