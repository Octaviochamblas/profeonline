semantic_id: MAT.GEO.CIRCULO_TEOREMAS.SECANTES_SEGMENTOS
resumen_inicial: 'Identificación de segmentos exteriores y segmentos totales en dos
  secantes trazadas desde un punto exterior: conceptos, teoremas, propiedades geométricas
  y cálculo en Circunferencia y Círculo.'
explicacion_simple: Cuando desde un punto fuera de un círculo se trazan dos rectas
  secantes, cada una determina un segmento 'corto' (exterior) y un segmento 'largo'
  (total) que hay que distinguir con precisión.
explicacion_formal: '![Segmentos exteriores y totales de dos secantes](/static/img/geometria/circunferencia-circulo/circulo-teorema-secantes-segmentos.svg)


  ### Definición formal


  Si desde un punto exterior $P$ se traza una secante que corta a la circunferencia
  en dos puntos, el más cercano a $P$ (llamado $A$) determina el segmento exterior
  $PA$, mientras que el punto más lejano (llamado $B$) determina el segmento total
  $PB$ (que incluye tanto la parte exterior como la cuerda interior).


  ### Desarrollo didáctico


  En la figura, desde el punto $P$ se trazan dos secantes: una corta en $A$ (cercano)
  y $B$ (lejano); la otra corta en $C$ (cercano) y $D$ (lejano). Los segmentos exteriores
  son $PA$ y $PC$; los segmentos totales son $PB$ y $PD$.'
definiciones_clave: '- **Identificación de segmentos exteriores y segmentos totales
  en dos secantes trazadas desde un punto exterior**: Elemento o propiedad fundamental
  en el estudio de circunferencia y círculo.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
