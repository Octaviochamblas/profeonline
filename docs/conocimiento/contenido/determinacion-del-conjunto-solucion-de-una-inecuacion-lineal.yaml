semantic_id: MAT.ALG.INECUACIONES_LINEALES.CONJUNTO_SOLUCION
resumen_inicial: El conjunto solución $S$ de una inecuación agrupa a la totalidad
  de los números reales que hacen verdadera la desigualdad.
explicacion_simple: 'El **conjunto solución** (denotado $S$) es la reunión formal
  de todas las respuestas válidas de la inecuación.

  Se puede expresar de tres formas equivalentes:

  1. Como desigualdad despejada ($x \le 3$).

  2. Como intervalo entre corchetes ($]-\infty, 3]$).

  3. Como gráfica sombreada en la recta numérica.'
explicacion_formal: 'El **conjunto solución** $S$ para la inecuación $P(x) \ R \ Q(x)$
  sobre $\mathbb{R}$ se formaliza mediante la notación de conjuntos por comprensión
  como:


  $$S = \{x \in \mathbb{R} \mid P(x) \ R \ Q(x)\} \subset \mathbb{R}$$


  **Desglose de la fórmula:**

  - $S$: Subconjunto real (intervalo acotado o no acotado, conjunto vacío $\emptyset$
  o todo $\mathbb{R}$).'
definiciones_clave: '- **Conjunto solución ($S$)**: Conjunto de números reales que
  satisfacen la inecuación lineal.

  - **Representaciones equivalentes**: Formas simbólicas (desigualdad, intervalo y
  gráfica) de comunicar el mismo conjunto $S$.'
propiedades_relaciones: '- **Densidad del conjunto**: Todo intervalo solución no vacío
  contiene infinitos elementos reales.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución $S$ de la inecuación $-2x + 6 \ge 0$ y
    exprésalo en notación de intervalo.
  pasos:
  - 'Paso 1: Trasponer $+6$ restando: $-2x \ge -6$.Paso 2: Dividir entre $-2$ e INVERTIMOS
    el símbolo $\ge$ a $\le$: $x \le \frac{-6}{-2}$.Paso 3: Calcular la división:
    $x \le 3$.Paso 4: Escribir el conjunto solución en notación de intervalo: $S =
    ]-\infty, 3]$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al despejar $-2x + 6 \ge 0$, ¿cuál es el conjunto solución $S$ expresado
    como intervalo?
  choices:
  - text: $S = ]-\infty, 3]$
    is_correct: true
  - text: $S = [3, +\infty[$
    is_correct: false
  - text: $S = ]-\infty, 3[$
    is_correct: false
  - text: $S = \{3\}$
    is_correct: false
  explanation: La alternativa correcta es '$S = ]-\infty, 3]$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el conjunto solución $S = ]-\infty, 3]$, ¿el número $3$ pertenece a
    las soluciones válidas?
  choices:
  - text: Sí, porque el corchete es cerrado por la derecha e incluye al 3.
    is_correct: true
  - text: No, porque es un número positivo.
    is_correct: false
  - text: No, se excluye de todas las inecuaciones.
    is_correct: false
  - text: Depende de si $x$ es cero.
    is_correct: false
  explanation: La alternativa correcta es 'Sí, porque el corchete es cerrado por la
    derecha e incluye al 3.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Despejar totalmente la variable $x$ de la inecuación.'
- 'Paso 2: Escribir la notación por comprensión $\{x \in \mathbb{R} \mid x \dots\}$.'
- 'Paso 3: Convertir la relación a notación de intervalo con corchetes.'
- 'Paso 4: Graficar en la recta real si el problema lo solicita.'
errores_correccion: '- **Error común:** Olvidar incluir el $-\infty$ al escribir el
  intervalo de una solución tipo $x \le 3$.

  - **Cómo corregirlo:** Las soluciones ''menores o iguales que 3'' vienen desde el
  infinito negativo: $]-\infty, 3]$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de inecuaciones.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de inecuaciones.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿La solución de una inecuación lineal suele ser un conjunto continuo de
    números reales?
  respuesta: Sí
  solucion_pasos:
  - Sí, a diferencia de las ecuaciones que tienen soluciones puntuales.
- titulo: ¿Invertir el símbolo al dividir entre un negativo es obligatorio?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la regla de oro del despeje en inecuaciones.
errores_frecuentes:
  - 'El conjunto solución de la inecuación $2x - 6 > 0$ incluye únicamente a los números enteros mayores que $3$.'
  - 'Al despejar $x - 4 \ge 1$, la solución consiste en el único valor frontera $x = 5$.'
  - 'Un número candidato $k$ pertenece al conjunto solución de una inecuación si al reemplazarlo transforma la expresión en una falsedad.'
  - 'El conjunto solución de una inecuación lineal de primer grado siempre se compone de un número finito de elementos.'
  - 'Probar que $x = 0$ satisface $3x < 9$ demuestra que $x = 0$ es la única solución del ejercicio.'
afirmaciones_verdaderas:
  - 'El conjunto solución de una inecuación lineal está formado por todos los valores reales que hacen verdadera la desigualdad.'
  - 'Un conjunto solución infinito se puede expresar mediante comprensión, notación de intervalos o representación gráfica.'
al_terminar_debes_poder: |
  QUÉ: Determinar y describir el conjunto solución de una inecuación lineal.
  CÓMO: Resolver la desigualdad mediante propiedades algebraicas, comprobar soluciones particulares y estructurar el conjunto resultante en $\mathbb{R}$.
