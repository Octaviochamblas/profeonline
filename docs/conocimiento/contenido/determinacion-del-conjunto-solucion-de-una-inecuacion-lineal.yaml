procedimiento:
- Agrupar los términos con la variable en un lado de la desigualdad y las constantes
  en el otro.
- Simplificar ambos lados sumando o restando términos semejantes.
- Despejar la variable dividiendo o multiplicando por su coeficiente. Recordar que
  si el coeficiente es negativo, se debe invertir el signo de la desigualdad.
- Expresar la solución final usando notación de intervalo, conjunto o representación
  gráfica según sea requerido.
errores_correccion: Evita olvidar invertir el símbolo de desigualdad ($<$ a $>$ o
  $\le$ a $\ge$) al multiplicar por un número negativo en determinación del conjunto
  solución de una inecuación lineal.
ejemplos:
- titulo: Inecuación básica
  enunciado: Encuentra el conjunto solución de la inecuación $2x - 4 > 6$.
  solucion_pasos:
  - Sumamos 4 a ambos lados - $2x > 6 + 4$.
  - Simplificamos - $2x > 10$.
  - Dividimos por 2 (positivo, por lo que no cambia el signo) - $x > 5$.
  - El conjunto solución en intervalo es $(5, \infty)$.
- titulo: Coeficiente negativo
  enunciado: Resuelve la inecuación $-3x + 1 \\geq 10$.
  solucion_pasos:
  - Restamos 1 a ambos lados - $-3x \geq 9$.
  - Dividimos por $-3$. Como es negativo, invertimos el signo de la desigualdad -
    $x \leq -3$.
  - El conjunto solución es $(-\infty, -3]$.
- titulo: Comprobación de un intervalo solución
  respuesta: Verdadero
  solucion_pasos:
  - Consideramos la inecuación $x + 2 < 5$.
  - Restando 2, obtenemos $x < 3$.
  - El intervalo correspondiente a los números estrictamente menores a 3 es $(-\infty,
    3)$.
  - Por tanto, el conjunto solución está correctamente expresado.
- titulo: Análisis de extremo incluido
  respuesta: Falso
  solucion_pasos:
  - Observamos la inecuación $4x \geq 8$.
  - Al dividir por 4, resulta $x \geq 2$.
  - Como es mayor o igual, el 2 debe estar incluido (corchete cerrado), es decir,
    $[2, \infty)$.
  - Expresar la solución como $(2, \infty)$ sería incorrecto al omitir el 2.
errores_frecuentes:
- Olvidar invertir el signo de la desigualdad al multiplicar o dividir por un número
  negativo.
- Confundir los corchetes abiertos y cerrados al escribir la notación de intervalos.
- Representar gráficamente un intervalo cerrado con un círculo sin pintar (hueco).
- Creer que el conjunto solución siempre está acotado por ambos lados.
- Sumar o restar un número negativo y erróneamente invertir el signo de la desigualdad
  (solo aplica a multiplicación/división).
afirmaciones_verdaderas:
- Multiplicar una desigualdad por un número negativo invierte su sentido de orden.
al_terminar_debes_poder: Resolver e interpretar inecuaciones e intervalos utilizando
  determinación del conjunto solución de una inecuación lineal.
