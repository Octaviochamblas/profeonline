  - Aplicar las propiedades algebraicas de determinación del conjunto solución de
    una inecuación lineal, invirtiendo el sentido si se multiplica por un negativo.
  - Expresar el conjunto solución en notación de intervalo o representación en la
    recta numérica.
  - Verificar probando valores dentro y fuera del intervalo solución.
