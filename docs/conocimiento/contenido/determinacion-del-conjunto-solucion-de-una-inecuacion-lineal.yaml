semantic_id: MAT.ALG.INECUACIONES_LINEALES.CONJUNTO_SOLUCION
resumen_inicial: 'Determinación del conjunto solución de una inecuación lineal: relaciones
  de orden, intervalos y resolución en Resolución de inecuaciones lineales.'
explicacion_simple: A diferencia de las ecuaciones lineales, que suelen tener una
  única solución, las inecuaciones lineales generalmente tienen infinitas soluciones.
  Estas soluciones conforman un conjunto que representa todos los valores posibles
  que satisfacen la desigualdad y se pueden visualizar en la recta numérica o expresar
  mediante intervalos.
explicacion_formal: '### Definición formal

  Sea una inecuación de la forma $ax + b < 0$ (o con $\\leq, >, \\geq$), con $a, b
  \\in \\mathbb{R}$ y $a \\neq 0$. El conjunto solución $S$ es el subconjunto de $\\mathbb{R}$
  dado por $S = \\{ x \\in \\mathbb{R} \\mid ax + b < 0 \\}$. Dependiendo del signo
  de la desigualdad, el conjunto solución corresponde a intervalos de la forma $(-\\infty,
  c)$, $(-\\infty, c]$, $(c, \\infty)$ o $[c, \\infty)$.


  ### Desarrollo didáctico

  Encontrar el conjunto solución requiere despejar la incógnita de la misma manera
  que en una ecuación, prestando especial atención a una regla fundamental: si se
  multiplica o divide la inecuación por un número negativo, el sentido de la desigualdad
  debe invertirse. Una vez aislada la variable (por ejemplo, $x \\geq 3$), se interpreta
  el resultado. En la recta numérica, se usaría un punto relleno en el 3 y una flecha
  hacia la derecha. En notación de intervalos, se escribiría como $[3, \\infty)$.'
definiciones_clave: '- **Determinación del conjunto solución de una inecuación lineal**:
  Concepto fundamental de relaciones de orden e inecuaciones.'
propiedades_relaciones: '- **Propiedades de orden**: Inversión de sentido al multiplicar
  o dividir por números negativos aplicada a determinación del conjunto solución de
  una inecuación lineal.'
ejemplo_guiado:
  enunciado: Determina el conjunto solución aplicando las reglas de determinación
