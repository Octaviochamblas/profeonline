procedimiento:
- 'Paso 1: Observa todas las letras en los monomios dados.'
- 'Paso 2: Selecciona SÓLO aquellas letras que aparecen en todos y cada uno de los
  monomios.'
- 'Paso 3: Para cada letra seleccionada, busca en los monomios cuál es su exponente
  más pequeño.'
- 'Paso 4: Eleva la letra a ese menor exponente. Ese es el resultado.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en determinación del m.c.d. literal entre monomios.
ejemplos:
- titulo: Halla el MCD literal de $a^4 b^2 c$, $a^3 b^5$ y $a^6 b^3 c^2$
  enunciado: Halla el MCD literal de $a^4 b^2 c$, $a^3 b^5$ y $a^6 b^3 c^2$.
  solucion_pasos:
  - 'Letras en los 3 monomios: ''a'' y ''b''. (La ''c'' no está en el segundo, se
    descarta).'
  - 'Menor exponente para ''a'': está $a^4, a^3, a^6$. El menor es 3 $\rightarrow
    a^3$.'
  - 'Menor exponente para ''b'': está $b^2, b^5, b^3$. El menor es 2 $\rightarrow
    b^2$.'
  - El MCD literal es $a^3 b^2$.
- titulo: MCD literal de $x^2 y$ y $w^3 z$.
  solucion_pasos:
  - No hay ninguna letra en común entre ambos monomios. El MCD no tiene parte literal
    (es 1).
- titulo: 'Respecto de «Determinación del M.C.D. literal entre monomios»: ¿Es correcta
    esta caracteriza'
  enunciado: 'Respecto de «Determinación del M.C.D. literal entre monomios»: ¿Es correcta
    esta caracterización? «Para obtener la parte literal del MCD, se deben escribir
    únicamente las bases (letras) que sean comunes a TODOS los monomios, y elevar
    cada una a su menor exponente presente»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Para obtener la parte literal
    del MCD, se deben escribir únicamente las bases (letras) que sean comunes a TODOS
    los monomios, y elevar cada una a su menor exponente presente.'
- titulo: 'Respecto de «Determinación del M.C.D. literal entre monomios»: ¿Es válida
    esta afirmación? «'
  enunciado: 'Respecto de «Determinación del M.C.D. literal entre monomios»: ¿Es válida
    esta afirmación? «Incluir letras que no están en todos los términos»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Para obtener la parte literal
    del MCD, se deben escribir únicamente las bases (letras) que sean comunes a TODOS
    los monomios, y elevar cada una a su menor exponente presente.'
errores_frecuentes:
- Incluir letras que no están en todos los términos.
- Elegir el exponente más alto (confusión clásica con el MCM).
- Para «La regla de oro para el MCD literal indica que se escogen:», la respuesta
  correcta es Las letras comunes con el mayor exponente.
- Para «La regla de oro para el MCD literal indica que se escogen:», la respuesta
  correcta es Las letras comunes y no comunes con el menor exponente.
- Todas las letras que aparezcan, sin importar el exponente.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_ponder: Operar y simplificar expresiones racionales aplicando determinación
  del m.c.d. literal entre monomios.
