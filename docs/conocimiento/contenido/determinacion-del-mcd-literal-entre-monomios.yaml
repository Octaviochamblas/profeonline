semantic_id: MAT.ALG.MCD_ALGEBRAICO.PARTE_LITERAL_MONOMIOS
resumen_inicial: El M.C.D. de la parte literal entre monomios se obtiene multiplicando
  las variables compartidas por todos los términos, elevadas a su menor exponente.
explicacion_simple: 'Para determinar únicamente la parte literal (las letras) del
  M.C.D. entre varios monomios, seguimos dos pasos clave:

  1. Identificamos solo aquellas variables que aparezcan en TODOS y cada uno de los
  monomios analizados. Si una letra falta en al menos un término, queda descartada.

  2. A cada letra común seleccionada le asignamos el menor exponente con el que figure
  entre todos los monomios.

  Esto garantiza que la expresión resultante sea capaz de dividir a cada monomio sin
  dejar variables en el denominador.'
explicacion_formal: 'Dadas las partes literales de un conjunto de monomios $M_1, M_2,
  \dots, M_k$, expresadas en factorización de variables como $L_i = \prod_j x_j^{e_{i,j}}$,
  el **M.C.D. literal** se define formalmente como:


  $$\text{M.C.D.}_{\text{literal}} = \prod_{x_j \text{ común}} x_j^{\min_i(e_{i,j})}$$


  **Desglose de la fórmula:**

  - $\prod_{x_j \text{ común}}$: Indica que el producto se realiza exclusivamente
  sobre las variables $x_j$ que pertenecen a la intersección de los conjuntos de variables
  de todos los monomios.

  - $\min_i(e_{i,j})$: Señala que para cada variable común $x_j$, el exponente seleccionado
  corresponde al valor mínimo entre los exponentes $e_{i,j}$ presentes en cada monomio
  $i$.


  > **Complemento didáctico:** La condición de exponente mínimo asegura que al dividir
  cualquier monomio original por el M.C.D. literal, el exponente de la variable resultante
  sea siempre mayor o igual a cero ($e_{i,j} - \min_i(e_{i,j}) \ge 0$).'
definiciones_clave: '- **Variable común**: Letra que figura explícitamente en la parte
  literal de la totalidad de los monomios considerados.

  - **Exponente mínimo común**: La potencia más pequeña asignada a una determinada
  variable entre todos los monomios analizados.'
propiedades_relaciones: '- **Exclusión de variables no comunes**: Si una variable
  no está presente en la totalidad de los términos, su exponente implícito común es
  $0$ ($x^0 = 1$), por lo que no figura en el producto final.

  - **Grado literal del M.C.D.**: El grado de la parte literal del M.C.D. es la suma
  de los exponentes mínimos de las variables comunes.'
ejemplo_guiado:
  enunciado: Dos tuberías industriales transportan caudales de fluido representados
    por $8x^4y^3z^2$ y $12x^2y^5z^4$. Identifica la parte literal del M.C.D. entre
    ambas expresiones ($x^2y^3z^2$) y evalúa su valor numérico para $x = 2$, $y =
    1$ y $z = 3$.
  pasos:
  - 'Paso 1: Identificar las variables comunes a ambos términos. Las letras $x$, $y$
    y $z$ figuran en los dos monomios.'
  - 'Paso 2: Determinar los menores exponentes para cada variable. Para $x$: $\min(4,
    2) = 2$; para $y$: $\min(3, 5) = 3$; para $z$: $\min(2, 4) = 2$. La parte literal
    del M.C.D. es $x^2y^3z^2$.'
  - 'Paso 3: Sustituir $x = 2$, $y = 1$ y $z = 3$ en la parte literal obtenida: $(2)^2
    \cdot (1)^3 \cdot (3)^2 = 4 \cdot 1 \cdot 9 = 36\text{ m}^3/\text{s}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se seleccionan los exponentes de las variables comunes al calcular
    el M.C.D. literal entre varios monomios?
  choices:
  - text: Se toma el menor exponente con el que figura la variable en todos los monomios.
    is_correct: true
  - text: Se toma el mayor exponente presente entre todos los monomios.
    is_correct: false
  - text: Se suman los exponentes de cada monomio.
    is_correct: false
  - text: Se promedian los exponentes de las expresiones.
    is_correct: false
  explanation: La alternativa correcta es 'Se toma el menor exponente con el que figura
    la variable en todos los monomios.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para la parte literal del M.C.D. igual a $x^2y^3z^2$, ¿cuál es su valor
    numérico cuando $x = 2$, $y = 1$ y $z = 3$?
  choices:
  - text: $36$
    is_correct: true
  - text: $18$
    is_correct: false
  - text: $72$
    is_correct: false
  - text: $24$
    is_correct: false
  explanation: La alternativa correcta es '$36$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Listar las variables presentes en la parte literal de cada uno de los monomios.'
- 'Paso 2: Filtrar la lista conservando únicamente las variables que pertenezcan a
  TODOS los monomios.'
- 'Paso 3: Para cada variable conservada, comparar sus exponentes y seleccionar el
  valor mínimo.'
- 'Paso 4: Escribir el producto de las variables comunes elevadas a sus respectivos
  exponentes mínimos.'
errores_correccion: '- **Error común:** Incluir una variable en el M.C.D. literal
  porque aparece con un exponente muy alto en uno de los términos, ignorando que falta
  en los otros.

  - **Cómo corregirlo:** Si una letra falta en tan solo uno de los monomios del grupo,
  no es común y por ende su menor exponente disponible en el grupo es $0$.'
ejemplos:
- titulo: 'Ejemplo 1: M.C.D. literal con tres monomios'
  enunciado: Determina el M.C.D. literal de $x^3y^4$, $x^5y^2z$ y $x^2y^3w$.
  alternativas:
  - $x^2y^2$
  - $x^5y^4z w$
  - $x^3y^3$
  respuesta: $x^2y^2$
  solucion_pasos:
  - 1. Las variables comunes a los tres monomios son solo $x$ e $y$ ($z$ y $w$ se
    descartan por no ser comunes a todos).
  - '2. Menor exponente de $x$: $\min(3, 5, 2) = 2$.'
  - '3. Menor exponente de $y$: $\min(4, 2, 3) = 2$.'
  - 4. El M.C.D. literal es $x^2y^2$.
- titulo: 'Ejemplo 2: Monomios con exponentes iguales'
  enunciado: ¿Cuál es el M.C.D. literal entre $a^4b^2$ y $a^4b^5$?
  alternativas:
  - $a^4b^2$
  - $a^8b^7$
  - $a^4b^5$
  respuesta: $a^4b^2$
  solucion_pasos:
  - 1. Para la variable $a$, la menor potencia entre $4$ y $4$ es $a^4$.
  - 2. Para la variable $b$, la menor potencia entre $2$ y $5$ es $b^2$.
  - 3. El M.C.D. literal es $a^4b^2$.
- titulo: ¿Si dos monomios no comparten ninguna variable en común, su M.C.D. literal
    es igual a $1$?
  respuesta: Sí
  solucion_pasos:
  - Sí. Al no existir variables comunes, el producto de variables elevadas a la menor
    potencia resulta en $x^0 = 1$.
- titulo: ¿La variable $z$ forma parte del M.C.D. literal de $x^2y^3z$ y $x^4y^2$?
  respuesta: 'No'
  solucion_pasos:
  - No, la variable $z$ no está presente en $x^4y^2$, por lo que no es una variable
    común.
errores_frecuentes:
- El M.C.D. literal de $a^3b^2$ y $a^2b^4$ es $a^3b^4$ porque toma los exponentes
  mayores.
- En el M.C.D. literal de $x^3y$ y $x^2z$, la variable $z$ se incluye con exponente
  $1$.
- El M.C.D. literal de $m^4n^2$ y $m^2n^5$ es $m^6n^7$ al sumar los exponentes.
- Las variables que no aparecen en todos los monomios se agregan con exponente negativo
  al M.C.D. literal.
- El M.C.D. literal entre $x^2$ e $y^2$ es $xy$.
afirmaciones_verdaderas:
- La parte literal del M.C.D. se forma únicamente con el producto de las variables
  que están presentes en todos los monomios.
- El exponente de cada variable en el M.C.D. literal es siempre el menor exponente
  con el que dicha variable figura en los monomios dados.
al_terminar_debes_poder: Al finalizar este recurso podrás determinar la parte literal
  del M.C.D. entre monomios identificando correctamente las variables comunes y sus
  menores potencias.
