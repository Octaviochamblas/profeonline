semantic_id: MAT.ALG.MCD_ALGEBRAICO.PARTE_LITERAL_MONOMIOS
resumen_inicial: 'Determinación del M.C.D. literal entre monomios: concepto, reglas
  operativas y simplificación en M.C.D. algebraico.'
explicacion_simple: '¿Qué pasa con las letras? Las variables en álgebra siguen una
  regla implacable para el MCD: solo sobreviven las letras que están en TODOS los
  términos, y siempre se escogen en su versión más ''débil'' (el menor exponente).'
explicacion_formal: '### Definición formal


  Solo lo que todos comparten, restringido al nivel del que menos tiene.


  ### Desarrollo didáctico


  La parte literal (las letras) es donde el álgebra brilla. Para encontrar el MCD
  de las letras, debes seguir una regla de oro estricta:


  **Regla del MCD Literal:** Selecciona ÚNICAMENTE las bases (letras) que se repiten
  en TODOS los monomios, y asígnales el MENOR exponente con el que aparecen.


  Veamos un ejemplo paso a paso. Tenemos $A = x^3 y^2$ y $B = x^2 y^4 z$.

  - **Paso 1 (Letras comunes):** ¿Qué letras están en A y en B? La $x$ y la $y$. (La
  $z$ solo está en B, así que la descartamos. No es común).

  - **Paso 2 (Menor exponente para $x$):** En A tenemos $x^3$ y en B tenemos $x^2$.
  El menor es 2. Tomamos $x^2$.

  - **Paso 3 (Menor exponente para $y$):** En A tenemos $y^2$ y en B tenemos $y^4$.
  El menor es 2. Tomamos $y^2$.


  Resultado: El MCD es $x^2 y^2$.'
definiciones_clave: '- **Determinación del M.C.D. literal entre monomios**: Procedimiento
  o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a determinación del m.c.d. literal
  entre monomios.'
