semantic_id: MAT.NUM.MINIMO_COMUN_MULTIPLO.CONCEPTO
resumen_inicial: El mínimo común múltiplo (m.c.m.) de dos o más enteros es el menor entero positivo divisible exactamente por cada uno de ellos.
explicacion_simple: 'El mínimo común múltiplo es el menor número positivo donde coinciden los saltos o múltiplos de dos o más números. Si dos eventos ocurren con diferentes frecuencias periódicas, el m.c.m. nos indica el primer momento futuro en que ambos volverán a suceder al mismo tiempo.


  ![Concepto de mínimo común múltiplo](/static/img/nodos/concepto-de-minimo-comun-multiplo-intro.svg)'
explicacion_formal: 'Para un conjunto de enteros $a_1, a_2, \ldots, a_k \in \mathbb{Z} \setminus \{0\}$, el **Mínimo Común Múltiplo** $\operatorname{mcm}(a_1, \dots, a_k)$ se define formalmente como:


  $$\operatorname{mcm}(a_1, \dots, a_k) = \min \left( \bigcap_{i=1}^k M^+(a_i) \right)$$


  **Desglose de la fórmula:**

  - $M^+(a_i)$: Conjunto de los múltiplos enteros estrictamente positivos del número $a_i$.

  - $\bigcap_{i=1}^k$: Intersección de los conjuntos de múltiplos (múltiplo común a todos).

  - $\min(\dots)$: Selección del menor elemento entero positivo de dicha intersección.


  > **Complemento didáctico:** El cero es un múltiplo común de todos los enteros, pero el m.c.m. exige ser un número estrictamente positivo ($m > 0$).'
definiciones_clave: '- **Mínimo común múltiplo (m.c.m.)**: El menor entero positivo que contiene a varios números de forma exacta.

  - **Intersección de múltiplos**: Conjunto de valores donde se traslapan las tablas de multiplicar de los números.'
propiedades_relaciones: '- **Cota inferior**: $\operatorname{mcm}(a, b) \ge \max(|a|, |b|)$.

  - **Divisibilidad del m.c.m.**: Todo múltiplo común de $a$ y $b$ es múltiplo de su $\operatorname{mcm}(a, b)$.'
ejemplo_guiado:
  enunciado: 'Halle el mínimo común múltiplo entre $4$ y $6$ analizando sus múltiplos comunes positivos.


    ![Ejemplo Concepto de mínimo común múltiplo](/static/img/nodos/concepto-de-minimo-comun-multiplo-ejemplos.svg)'
  pasos:
  - 'Paso 1: Listar múltiplos de 4: $M^+(4) = \{4, 8, 12, 16, 20, 24, 28, 32, 36, \dots\}$.'
  - 'Paso 2: Listar múltiplos de 6: $M^+(6) = \{6, 12, 18, 24, 30, 36, \dots\}$.'
  - 'Paso 3: Obtener la intersección de múltiplos comunes: $M^+(4) \cap M^+(6) = \{12, 24, 36, \dots\}$.'
  - 'Paso 4: Seleccionar el menor valor positivo: $\min(\{12, 24, 36, \dots\}) = 12$.'
  - 'Conclusión: $\operatorname{mcm}(4, 6) = 12$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa el mínimo común múltiplo de dos enteros positive a y b?
  choices:
  - text: El menor número entero positivo que es divisible por a y por b
    is_correct: true
  - text: El resultado de multiplicar a · b
    is_correct: false
  - text: El mayor divisor que comparten a y b
    is_correct: false
  - text: El número 0 siempre
    is_correct: false
  explanation: La alternativa correcta es 'El menor número entero positivo que es divisible por a y por b'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado entre 4 y 6, ¿cuál fue el menor múltiplo común obtenido?
  choices:
  - text: '12'
    is_correct: true
  - text: '24'
    is_correct: false
  - text: '4'
    is_correct: false
  - text: '6'
    is_correct: false
  explanation: La alternativa correcta es '12'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Generar la lista de múltiplos positivos de cada uno de los números dados.'
- 'Paso 2: Encontrar los múltiplos comunes en los que coinciden todas las listas.'
- 'Paso 3: Seleccionar el menor de esos múltiplos comunes como el $\operatorname{mcm}$.'
errores_correccion: '- **Error 1: Elegir el cero como el m.c.m. de dos números.** **Cómo corregirlo:** El m.c.m. exige ser un número estrictamente POSITIVO ($> 0$).


  - **Error 2: Confundir el m.c.m. con el producto directo $a \cdot b$.** **Cómo corregirlo:** El producto $a \cdot b$ es un múltiplo común, pero no siempre es el MENOR (ej: para 4 y 6, el producto es 24 pero el mcm es 12).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el m.c.m. entre 3 y 5?
  alternativas:
  - '15'
  - '30'
  - '5'
  respuesta: '15'
  solucion_pasos:
  - $M^+(3) \cap M^+(5) = \{15, 30, 45, \dots\}$, el menor es 15.
- titulo: Ejemplo 2
  enunciado: Dos luces parpadean cada 8 y 12 segundos. ¿A los cuántos segundos vuelven a parpadear juntas?
  alternativas:
  - A los 24 segundos
  - A los 96 segundos
  - A los 4 segundos
  respuesta: A los 24 segundos
  solucion_pasos:
  - $\operatorname{mcm}(8, 12) = 24$ segundos.
- titulo: ¿Es el m.c.m. de dos números primos igual al producto entre ellos?
  respuesta: Sí
  solucion_pasos:
  - Sí, para primos distintos $a$ y $b$, $\operatorname{mcm}(a,b) = a \cdot b$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al menor múltiplo común obtenido mediante el algoritmo correspondiente.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo del MCM entrega un valor entero único bien definido.
  - texto: No es posible calcularlo con los métodos estándar
    es_correcta: false
    retroalimentacion: Incorrecto, los métodos de listas, tabla simultánea y potencias primas son deterministas y exactos.
- titulo: ¿Puede el m.c.m. de dos números ser menor que el número más grande?
  respuesta: 'No'
  solucion_pasos:
  - No, el m.c.m. debe ser al menos igual o mayor que el número más grande.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde exactamente al menor múltiplo común obtenido mediante el algoritmo correspondiente.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el cálculo del MCM entrega un valor entero único bien definido.
  - texto: No es posible calcularlo con los métodos estándar
    es_correcta: false
    retroalimentacion: Incorrecto, los métodos de listas, tabla simultánea y potencias primas son deterministas y exactos.
errores_frecuentes:
- El número cero se clasifica como el mínimo común múltiplo de cualquier pareja de enteros.
- El mínimo común múltiplo es siempre equivalente a multiplicar directamente ambos números entre sí.
- El mínimo común múltiplo de dos enteros puede ser un número menor que ambos dados.
- Calcular el m.c.m. requiere sumar los divisores comunes de los dos números.
- Dos números impares no poseen un mínimo común múltiplo en los enteros.
afirmaciones_verdaderas:
- El mínimo común múltiplo es el menor entero estrictamente positivo divisible por cada uno de los números.
- Si dos números son primos relativos, su m.c.m. es igual a su producto directo.
al_terminar_debes_poder: "**QUÉ:** Definir rigurosamente y comprender el concepto de mínimo común múltiplo de dos o más números naturales.\n\n**CÓMO:** Identificando el menor entero positivo que es múltiplo de todos los números dados simultáneamente ($\text{mcm}(a, b) = \\min(M(a) \\cap M(b))$) y aplicando la identidad dual $\text{mcm}(a, b) \\cdot \text{mcd}(a, b) = a \\cdot b$.\n\n![Resumen Concepto de mínimo común múltiplo](/static/img/nodos/concepto-de-minimo-comun-multiplo-resumen.svg)"
