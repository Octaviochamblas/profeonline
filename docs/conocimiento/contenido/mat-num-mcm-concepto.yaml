semantic_id: MAT.NUM.MINIMO_COMUN_MULTIPLO.CONCEPTO
resumen_inicial: "El Mínimo Común Múltiplo (MCM) de dos o más números es el menor múltiplo positivo común a todos ellos."
explicacion_simple: |
  Imagina que dos faros en la costa parpadean en intervalos distintos: el faro A cada 4
  segundos y el faro B cada 6 segundos. Si ambos parpadean juntos ahora, ¿cuántos segundos
  pasarán para que vuelvan a coincidir? La matemática nos da una herramienta genial para
  resolver esto: el Mínimo Común Múltiplo (MCM), el número más pequeño que es múltiplo de
  ambos a la vez.
explicacion_formal: |
  El MCM de dos o más números es el número entero positivo más pequeño que es múltiplo de
  cada uno de ellos. Se construye a partir de tres ideas: **múltiplo** (resultado de
  multiplicar un número por un entero), **común** (que aplica a varios números a la vez) y
  **mínimo** (el más pequeño de ellos). El MCM es clave para encontrar el mínimo común
  denominador al sumar o restar fracciones.
definiciones_clave: |
  **Múltiplo común**: número que aparece en las listas de múltiplos de todos los números
  dados. El MCM es el menor de ellos, distinto de cero.
propiedades_relaciones: |
  El MCM nunca puede ser menor que el mayor de los números dados; como mínimo, es igual a
  ese mayor número (cuando uno es múltiplo del otro).
ejemplo_guiado:
  enunciado: "Determina el MCM entre 4 y 6 analizando sus múltiplos."
  pasos:
    - 'Múltiplos de 4: $\{4,8,12,16,20,24,\ldots\}$. Múltiplos de 6: $\{6,12,18,24,\ldots\}$.'
    - "Múltiplos comunes: $12$ y $24$."
    - 'Conclusión: el menor es $12$, por lo que $\text{MCM}(4,6)=12$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué representa el MCM de dos números?"
    choices:
      - {text: "El menor múltiplo positivo común a ambos números", is_correct: true}
      - {text: "El mayor divisor común a ambos números", is_correct: false}
      - {text: "La suma de ambos números", is_correct: false}
      - {text: "El producto de ambos números siempre", is_correct: false}
    explanation: "La correcta es El menor múltiplo positivo común a ambos números: esa es la definición del MCM."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuál es el MCM entre 3 y 9?"
    choices:
      - {text: "9, porque 9 es múltiplo de 3", is_correct: true}
      - {text: "27, el producto de ambos", is_correct: false}
      - {text: "3, el menor de los números", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 9, porque 9 es múltiplo de 3: cuando un número es múltiplo del otro, el mayor es directamente el MCM."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Comprende los ciclos o períodos de los números involucrados en el problema.'
  - 'Paso 2: Escribe la lista de los primeros múltiplos positivos de cada número.'
  - 'Paso 3: Identifica los múltiplos que aparecen en todas las listas (múltiplos comunes).'
  - 'Paso 4: Selecciona el menor de estos múltiplos comunes (excluyendo al cero). Este es el MCM.'
errores_correccion: |
  Un error frecuente es confundir el MCM con el M.C.D. Otro error es considerar al 0 como
  posible MCM, o creer que el MCM siempre es igual al producto de los números.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Identifica el MCM entre $3$ y $5$ analizando sus primeros múltiplos comunes.'
    alternativas:
      - "15"
      - "8"
      - "30"
    respuesta: "15"
    solucion_pasos:
      - 'Paso a: Listamos los múltiplos de $3$: $\{3, 6, 9, 12, 15, 18, 21, 24, 27, 30, \dots\}$.'
      - 'Paso b: Listamos los múltiplos de $5$: $\{5, 10, 15, 20, 25, 30, 35, \dots\}$.'
      - 'Paso c: Buscamos múltiplos en común: el $15$ y el $30$ se repiten.'
      - 'Paso d: Seleccionamos el menor de ellos, que es $15$. Por lo tanto, $\text{MCM}(3, 5) = 15$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Encuentra el MCM entre $6$ y $8$.'
    alternativas:
      - "24"
      - "48"
      - "14"
    respuesta: "24"
    solucion_pasos:
      - 'Paso a: Múltiplos de $6$: $\{6, 12, 18, 24, 30, 36, 42, 48, \dots\}$.'
      - 'Paso b: Múltiplos de $8$: $\{8, 16, 24, 32, 40, 48, 56, \dots\}$.'
      - 'Paso c: Los múltiplos comunes que vemos son $24$ y $48$.'
      - 'Paso d: El menor de ellos es $24$. Así, $\text{MCM}(6, 8) = 24$.'
  - titulo: '¿Es el número $10$ el MCM entre $2$ y $10$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Los múltiplos de $2$ son $2, 4, 6, 8, 10, 12, \dots$.'
      - 'Los múltiplos de $10$ son $10, 20, 30, \dots$.'
      - 'El menor múltiplo común positivo que aparece en ambas listas es exactamente el $10$.'
      - 'Por lo tanto, el MCM es $10$ (cuando un número es múltiplo de otro, el mayor es el MCM).'
  - titulo: '¿Puede el MCM de dos números ser menor que ambos números?'
    respuesta: 'No'
    solucion_pasos:
      - 'Por definición, el MCM es un múltiplo positivo de los números.'
      - 'Los múltiplos positivos de un número entero positivo siempre son mayores o iguales a dicho número.'
      - 'Por lo tanto, el MCM nunca puede ser menor que los números originales. Como mínimo, será igual al mayor de ellos.'
errores_frecuentes:
  - 'Confundir el mínimo común múltiplo (MCM) con el máximo común divisor (MCD).'
  - 'Considerar al número 0 como el MCM.'
  - 'Creer que el MCM siempre es igual al producto de los números.'
  - 'No listar suficientes múltiplos para encontrar el primero en común.'
  - 'Realizar sumas en lugar de multiplicaciones para buscar múltiplos.'
afirmaciones_verdaderas:
  - "El MCM nunca puede ser menor que los números originales."
  - "El MCM entre 4 y 6 es 12."
al_terminar_debes_poder: |
  Definir el concepto de Mínimo Común Múltiplo y determinarlo por comparación de listas
  de múltiplos.
fuente: 'Teoría de Números'
estado: publicado
