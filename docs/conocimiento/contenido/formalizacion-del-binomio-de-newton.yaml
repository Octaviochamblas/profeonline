semantic_id: MAT.ALG.GENERALIZACIONES_PRODUCTOS.BINOMIO_NEWTON
resumen_inicial: 'Formalización del Binomio de Newton: fórmula, regla de expansión
  y aplicaciones en Generalizaciones de productos notables.'
explicacion_simple: El triángulo de Pascal es genial, pero si te piden $(x+y)^{50}$,
  ¿dibujarás 50 filas? Isaac Newton ideó una fórmula mejor.
explicacion_formal: '### Definición formal


  Para todo entero $n \geq 0$ y todo $a, b$, el Teorema del Binomio establece que
  $(a+b)^n = \sum_{k=0}^{n} \binom{n}{k} a^{n-k} b^k$, donde $\binom{n}{k} = \frac{n!}{k!(n-k)!}$
  es el número combinatorio. Cada sumando corresponde a un término del desarrollo,
  y la sucesión de coeficientes $\binom{n}{0}, \binom{n}{1}, \dots, \binom{n}{n}$
  coincide con la fila $n$ del Triángulo de Pascal.


  ### Desarrollo didáctico


  El Teorema del Binomio de Newton es la generalización definitiva. Nos ofrece una
  fórmula maestra para desarrollar un binomio elevado a cualquier número entero positivo
  $n$, es decir: $(a+b)^n$.


  Imagina tener que calcular $(a+b)^7$ multiplicando paso a paso. Sería eterno y abrumador.
  El Teorema de Newton sistematiza este proceso utilizando combinatoria matemática
  (coeficientes binomiales).


  **La Fórmula General:**

  $(a+b)^n = \sum_{k=0}^{n} \binom{n}{k} a^{n-k}b^k$


  **Traducción del comportamiento estructural:**

  Si despliegas la sumatoria, notarás tres patrones en cada término:

  1. **Los exponentes bailan:** En el primer término, ''''$a$'''' tiene exponente
  $n$ y ''''$b$'''' tiene exponente $0$. A medida que avanzas en la suma, el exponente
  de ''''$a$'''' disminuye en $1$, mientras que el de ''''$b$'''' aumenta en $1$.
  Al final, ''''$a$'''' llega a $0$ y ''''$b$'''' llega a $n$. La suma de ambos siempre
  es $n$.

  2. **Los coeficientes:** El número grande que multiplica cada término se calcula
  resolviendo combinatorias $\binom{n}{k}$, las cuales pueden ser extraídas fácilmente
  del Triángulo de Pascal.

  3. **Cantidad de términos:** El polinomio desarrollado siempre tendrá $(n+1)$ términos
  totales.'
