- titulo: 'Respecto de «Formalización del Binomio de Newton»: ¿Es válida esta afirmación?
    «Olvidar que'
  enunciado: 'Respecto de «Formalización del Binomio de Newton»: ¿Es válida esta afirmación?
    «Olvidar que $k$ empieza en 0, por lo que el ''término $m$'' corresponde a $k
    = m-1$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El Teorema del Binomio establece
    que: $(a+b)^n = \\\\sum_{k=0}^{n} \binom{n}{k} a^{n-k} b^k$ Donde $\binom{n}{k}
    = \frac{n.}{k.(n-k).}$ es el número combinatorio (o coeficiente binomial), que
    calcula el mismo valor que aparece en el Triángulo de Pascal.'
errores_frecuentes:
- Olvidar que $k$ empieza en 0, por lo que el 'término $m$' corresponde a $k = m-1$.
- $n!$.
- Para «De acuerdo con el Teorema del Binomio, la suma de todos los coeficientes del
  desarrollo de $(1+1)^n$ es:», la respuesta correcta es $0$.
- Para «De acuerdo con el Teorema del Binomio, la suma de todos los coeficientes del
  desarrollo de $(1+1)^n$ es:», la respuesta correcta es $n^2$.
- La afirmación «$2^n$» no es válida en este contenido.
