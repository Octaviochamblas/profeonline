errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en formalización del binomio de newton.
ejemplos:
- titulo: Coeficiente directo
  enunciado: Encuentra el coeficiente del segundo término en el desarrollo de $(x+y)^{10}$.
  solucion_pasos:
  - El primer término es $k=0$, el segundo es $k=1$.
  - 'Coeficiente: $\binom{10}{1} = \\\crac{10!}{1!9!} = 10$.'
  - El término completo es $10x^9y$.
- titulo: De acuerdo con el Teorema del Binomio, la suma de todos los coeficientes
    del desarrollo de $
  enunciado: 'De acuerdo con el Teorema del Binomio, la suma de todos los coeficientes
    del desarrollo de $(1+1)^n$ es:


    Opciones: A) $2^n$ · B) $n!$ · C) $0$ · D) $n^2$'
  solucion_pasos:
  - $(1+1)^n = 2^n$. Y por la fórmula, esto es la suma de los combinatorios $\binom{n}{k}$.
  - 'Respuesta: $2^n$'
