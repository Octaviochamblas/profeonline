resumen_inicial: La formalización del Binomio de Newton proporciona la fórmula algebraica
  general para expandir $(a + b)^n$ para cualquier exponente entero positivo $n$ mediante
  sumatorias combinatorias.
explicacion_simple: El Teorema del Binomio de Newton es la regla maestra para elevar
  $(a + b)$ a cualquier potencia $n$. Dice que $(a + b)^n$ es la suma de términos
  donde cada coeficiente es el número combinatorio $\binom{n}{k}$, la potencia de
  $a$ va bajando de $n$ a $0$, y la potencia de $b$ va subiendo de $0$ a $n$.
explicacion_formal: 'Para cualquier $n \in \mathbb{N}_0$ y cualesquiera $a, b \in
  \mathbb{R}$, el **Teorema del Binomio de Newton** establece que:


  $$(a + b)^n = \sum_{k=0}^n \binom{n}{k} a^{n-k} b^k$$


  **Desglose simbólico:**

  - $\binom{n}{k} = \frac{n!}{k!(n-k)!}$: Coeficiente binomial calculado con factoriales.

  - $a^{n-k}$: Potencia de la primera variable cuyo exponente decrece desde $n$ hasta
  $0$.

  - $b^k$: Potencia de la segunda variable cuyo exponente crece desde $0$ hasta $n$.

  - $\sum_{k=0}^n$: Notación de sumatoria que agrupa los $n+1$ términos de la expansión.


  > **Complemento didáctico:** Constituye el puente entre el álgebra polinomial básica
  y el análisis matemático (series de Taylor y cálculo infinitesimal).'
definiciones_clave: '- **Teorema del Binomio**: Fórmula sumatoria $(a+b)^n = \sum_{k=0}^n
  \binom{n}{k} a^{n-k} b^k$.

  - **Coeficiente binomial factorial**: $\binom{n}{k} = \frac{n!}{k!(n-k)!}$.'
propiedades_relaciones: '- **Homogeneidad de grado**: La suma de los exponentes en
  cada término $T_k$ es siempre constante e igual a $(n-k) + k = n$.'
ejemplo_guiado:
  enunciado: Calcule el coeficiente binomial $\binom{5}{2}$ mediante factoriales e
    interprete su significado en el desarrollo de $(a + b)^5$.
  pasos:
  - 'Paso 1: Aplicar la fórmula de combinatoria: $\binom{5}{2} = \frac{5!}{2!(5-2)!}
    = \frac{5!}{2!3!}$.'
  - 'Paso 2: Desarrollar factoriales: $\frac{5 \cdot 4 \cdot 3!}{2 \cdot 1 \cdot 3!}
    = \frac{20}{2} = 10$.'
  - 'Paso 3: Identificar la potencia asociada: Corresponde a $k=2 \implies a^{5-2}b^2
    = a^3b^2$.'
  - 'Conclusión: El término de la expansión asociado a $k=2$ es $10a^3b^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión por definición para el coeficiente binomial $\binom{n}{k}$?
  choices:
  - text: $\frac{n!}{k!(n-k)!}$
    is_correct: true
  - text: $\frac{n!}{k!}$
    is_correct: false
  - text: $\frac{n}{(n-k)!}$
    is_correct: false
  - text: $n! \cdot k!$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{n!}{k!(n-k)!}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el valor del coeficiente $\binom{5}{2}$?
  choices:
  - text: $10$
    is_correct: true
  - text: $5$
    is_correct: false
  - text: $20$
    is_correct: false
  - text: $15$
    is_correct: false
  explanation: La alternativa correcta es '$10$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la notación de sumatoria desde $k=0$ hasta $n$.'
- 'Paso 2: Calcular cada coeficiente binomial $\binom{n}{k} = \frac{n!}{k!(n-k)!}$.'
- 'Paso 3: Acompañar cada coeficiente de $a^{n-k}b^k$ y sumar los $n+1$ términos.'
errores_correccion: '- **Error 1: Calcular los coeficientes binomiales mediante resta
  de factoriales en lugar de división.** **Cómo corregirlo:** La fórmula requiere
  la división de factoriales $\frac{n!}{k!(n-k)!}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $\binom{4}{3}$.
  alternativas:
  - $4$
  - $12$
  - $6$
  respuesta: $4$
  solucion_pasos:
  - 1. $\frac{4!}{3!1!} = \frac{24}{6 \cdot 1} = 4$.
- titulo: Ejemplo 2
  enunciado: En la expansión de $(x + y)^6$, ¿cuál es la suma de los exponentes de
    $x$ e $y$ en cualquier término?
  alternativas:
  - $6$
  - $12$
  - $5$
  respuesta: $6$
  solucion_pasos:
  - 1. Por homogeneidad, $(6-k) + k = 6$ en todos los términos.
- titulo: ¿Es $\binom{n}{0} = 1$ para cualquier número entero $n \ge 0$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\frac{n!}{0!n!} = \frac{n!}{1 \cdot n!} = 1$ por definición de $0! = 1$.
- titulo: ¿El desarrollo de $(a - b)^n$ según el Binomio de Newton genera términos
    con signos alternados?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $(-b)^k = (-1)^k b^k$, lo que alterna los signos según la paridad de
    $k$.
errores_frecuentes:
- Declarar que $0! = 0$ en el cálculo de coeficientes binomiales.
- Declarar que la suma de exponentes en los términos de $(a+b)^n$ varía entre términos.
- Calcular $\binom{n}{k}$ como $n \cdot k$ en lugar de usar la fórmula de factoriales.
- Declarar que el Teorema del Binomio solo se aplica cuando $n=2$ o $n=3$.
- Declarar que la expansión de $(a - b)^n$ produce únicamente términos positivos.
afirmaciones_verdaderas:
- El Teorema del Binomio de Newton permite expandir $(a + b)^n$ para todo entero positivo
  $n$.
- La suma de los exponentes de las dos variables en cualquier término de la expansión
  es idéntica a $n$.
al_terminar_debes_poder: Al terminar serás capaz de formalizar la expansión de $(a
  + b)^n$ mediante la fórmula sumatoria del Binomio de Newton.
