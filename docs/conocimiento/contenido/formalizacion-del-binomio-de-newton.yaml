semantic_id: MAT.ALG.GENERALIZACIONES_PRODUCTOS.BINOMIO_NEWTON
resumen_inicial: 'La formalización del Binomio de Newton establece la ecuación general de expansión $(a+b)^n = \sum_{k=0}^{n} \binom{n}{k} a^{n-k} b^k$ expresando cualquier potencia entera positiva como la suma de $n+1$ términos ponderados combinatoriamente.'
explicacion_simple: |
  El **Teorema del Binomio de Newton** es la regla maestra que te permite elevar cualquier binomio $(a + b)$ a cualquier exponente entero positivo $n$ sin tener que multiplicar paréntesis a mano:
  - **FÓRMULA MAESTRA CON SUMATORIA**:
    $$(a + b)^n = \mathbf{\sum_{k=0}^{n} \binom{n}{k} a^{n-k} b^k}$$
  - **Componentes de cada término**:
    1. **Coeficiente Binomial $\binom{n}{k}$**: Se calcula con combinatoria $\frac{n!}{k!(n-k)!}$ (o se busca en la fila $n$ de Pascal).
    2. **Exponente del primer término ($a$)**: Empieza en $n$ y **baja de 1 en 1** hasta $0$ ($a^n, a^{n-1}, \dots, a^0$).
    3. **Exponente del segundo término ($b$)**: Empieza en $0$ y **sube de 1 en 1** hasta $n$ ($b^0, b^1, \dots, b^n$).
  - **Ejemplo**: Para $n=3 \implies (a+b)^3$:
    - $\binom{3}{0}a^3 b^0 + \binom{3}{1}a^2 b^1 + \binom{3}{2}a^1 b^2 + \binom{3}{3}a^0 b^3 = \mathbf{a^3 + 3a^2b + 3ab^2 + b^3}$.
explicacion_formal: |
  ### Definición formal
  Sean $a, b \in \mathbb{R}$ dos elementos de un cuerpo conmutativo y $n \in \mathbb{N}_0$. El **Teorema del Binomio de Newton** formaliza la expansión de la $n$-ésima potencia del polinomio mónico mediante la sumatoria:

  $$(a + b)^n = \sum_{k=0}^{n} \binom{n}{k} a^{n-k} b^k = \binom{n}{0} a^n + \binom{n}{1} a^{n-1} b + \dots + \binom{n}{n} b^n$$

  donde los coeficientes binomiales se definen como la función combinatoria de subconjuntos de tamaño $k$ elegidos de un conjunto de $n$ elementos:

  $$\binom{n}{k} = \frac{n!}{k!(n-k)!} = \frac{n(n-1)\dots(n-k+1)}{k!}$$

  ### Homogeneidad Polinómica
  El polinomio resultante es estrictamente homogéneo de grado $n$. Para cada término el grado combinado es $(n-k) + k = n$.

  ### Síntesis didáctica
  El Binomio de Newton proporciona el algoritmo algebraico universal que unifica el cuadrado de binomio ($n=2$), el cubo de binomio ($n=3$) y cualquier potencia superior.
definiciones_clave: |
  - **Teorema del Binomio de Newton**: Identidad algebraica universal que expresa $(a+b)^n$ como la combinación lineal de monomios homogéneos ponderados por $\binom{n}{k}$.
  - **Coeficiente binomial ($\binom{n}{k} = \frac{n!}{k!(n-k)!}$)**: Número combinatorio que contabiliza las selecciones no ordenadas de $k$ elementos a partir de $n$.
  - **Grado de homogeneidad ($n$)**: Condición por la cual la suma de los exponentes de $a$ y $b$ en cualquier término de la expansión es idénticamente igual a $n$.
propiedades_relaciones: |
  - **Número de términos de la expansión**: La expansión de $(a+b)^n$ posee exactamente $n+1$ términos.
  - **Alternancia de signos en resta**: Para $(a-b)^n$, la sumatoria adopta la forma $\sum_{k=0}^n (-1)^k \binom{n}{k} a^{n-k} b^k$, alternando signos según la paridad de $k$.
ejemplo_guiado:
  enunciado: 'Aplica la fórmula del Binomio de Newton para expandir $(2x + 1)^4$.'
  pasos:
    - 'Paso 1: Identificamos $a = 2x$, $b = 1$, $n = 4$. La expansión tendrá $n+1 = 5$ términos.'
    - 'Paso 2: Calculamos los 5 coeficientes binomiales para $n=4$:
       $\binom{4}{0}=1, \binom{4}{1}=4, \binom{4}{2}=6, \binom{4}{3}=4, \binom{4}{4}=1$.'
    - 'Paso 3: Evaluamos los 5 términos monómicos:
       - $T_0 = 1 \cdot (2x)^4 \cdot (1)^0 = 1 \cdot 16x^4 \cdot 1 = \mathbf{16x^4}$.
       - $T_1 = 4 \cdot (2x)^3 \cdot (1)^1 = 4 \cdot 8x^3 \cdot 1 = \mathbf{32x^3}$.
       - $T_2 = 6 \cdot (2x)^2 \cdot (1)^2 = 6 \cdot 4x^2 \cdot 1 = \mathbf{24x^2}$.
       - $T_3 = 4 \cdot (2x)^1 \cdot (1)^3 = 4 \cdot 2x \cdot 1 = \mathbf{8x}$.
       - $T_4 = 1 \cdot (2x)^0 \cdot (1)^4 = 1 \cdot 1 \cdot 1 = \mathbf{1}$.'
    - 'Paso 4: Sumamos los términos: $16x^4 + 32x^3 + 24x^2 + 8x + 1$.'
    - 'Conclusión: La expansión reducida es **$16x^4 + 32x^3 + 24x^2 + 8x + 1$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la fórmula del Binomio de Newton $(a+b)^n = \sum_{k=0}^{n} \binom{n}{k} a^{n-k} b^k$, ¿cuántos términos posee la expansión y cuál es la relación entre los exponentes de $a$ y $b$?'
    choices:
      - {text: 'Posee $n+1$ términos y para cada término la suma de sus exponentes es constante e igual a $n$ ($(n-k) + k = n$)', is_correct: true}
      - {text: 'Posee $n$ términos y sus exponentes suman $2n$', is_correct: false}
      - {text: 'Posee $n+2$ términos y los exponentes son independientes', is_correct: false}
      - {text: 'Posee $2^n$ términos', is_correct: false}
    explanation: 'La alternativa correcta es ''Posee $n+1$ términos y para cada término la suma de sus exponentes es constante e igual a $n$ ($(n-k) + k = n$)''. $n+1$ términos y conservación del grado homogéneo $n$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor del coeficiente binomial $\binom{5}{2}$ utilizado en la expansión del Binomio de Newton para $n=5$?'
    choices:
      - {text: 'El valor es $\frac{5!}{2! 3!} = \frac{120}{2 \cdot 6} = 10$', is_correct: true}
      - {text: 'El valor es 5', is_correct: false}
      - {text: 'El valor es 20', is_correct: false}
      - {text: 'El valor es 15', is_correct: false}
    explanation: 'La alternativa correcta es ''El valor es $\frac{5!}{2! 3!} = \frac{120}{2 \cdot 6} = 10$''. Cálculo combinatorio $\binom{5}{2} = 10$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los términos $a$ y $b$ del binomio y el exponente $n$.'
  - 'Paso 2: Calcular los $n+1$ coeficientes binomiales $\binom{n}{k}$ desde $k=0$ hasta $k=n$.'
  - 'Paso 3: Escribir para cada $k$ la potencia $a^{n-k}$ disminuyendo y $b^k$ aumentando.'
  - 'Paso 4: Multiplicar los coeficientes, resolver las potencias y sumar todos los términos.'
errores_correccion: |
  - **Error 1:** Afirmar que la expansión de $(a+b)^n$ posee $n$ términos. **Cómo corregirlo:** La expansión **POSYE STRICTAMENTE $n+1$ TÉRMINOS (desde $k=0$ hasta $k=n$)**.
  - **Error 2:** Alterar el grado homogéneo en los términos sumando mal los exponentes. **Cómo corregirlo:** La suma de los exponentes de $a$ y $b$ **ES SIEMPRE IGUAL A $n$ ($(n-k)+k=n$)**.
ejemplos:
  - titulo: 'Número de términos'
    enunciado: 'Para $(a+b)^6$, ¿posee la expansión exactamente $6+1 = 7$ términos?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $n = 6 \implies n+1 = 7$ términos.'
  - titulo: 'Cálculo de combinación'
    enunciado: '¿Es el coeficiente binomial $\binom{4}{1} = 4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\frac{4!}{1! 3!} = 4$.'
  - titulo: 'Homogeneidad de grado'
    enunciado: 'En el término $a^3 b^2$ de $(a+b)^5$, ¿es la suma de exponentes $3+2=5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, consreva el grado $n=5$.'
  - titulo: 'Extremos siempre 1'
    enunciado: '¿Valen los coeficientes binomiales extremos $\binom{n}{0}$ y $\binom{n}{n}$ siempre 1?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $\binom{n}{0} = \binom{n}{n} = 1$.'
errores_frecuentes:
  - 'Contabilizar n términos en lugar de los n+1 términos presentes en la expansión.'
  - 'Alterar la suma de los exponentes en los términos monómicos rompiendo el grado homogéneo n.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Intercambiar los factores en la fórmula del factorial n! / (k!(n-k)!) al calcular los coeficientes binomiales.'
  - 'Las potencias de los coeficientes numéricos de los términos monómicos no son aplicadas.'
afirmaciones_verdaderas:
  - 'El Teorema del Binomio de Newton expresa $(a+b)^n$ como una sumatoria de $n+1$ términos de grado homogéneo $n$.'
  - 'Los coeficientes de la expansión están dados por la combinación $\binom{n}{k} = \frac{n!}{k!(n-k)!}$.'
