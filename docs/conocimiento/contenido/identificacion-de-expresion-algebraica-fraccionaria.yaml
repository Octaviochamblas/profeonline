semantic_id: MAT.ALG.CLASIFICACION.EXPRESION_FRACCIONARIA
resumen_inicial: 'Una expresión algebraica es fraccionaria cuando contiene al menos una variable en el denominador o afectada por un exponente entero negativo.'
explicacion_simple: |
  - Una expresión algebraica es **fraccionaria** cuando tiene **letras en el denominador** (dividiendo).
  - Ejemplos típicos:
    - $\frac{3x + 1}{x - 2}$ (la $x$ está en el denominador).
    - $5x^2 + \frac{4}{y}$ (la $y$ divide).
    - $2x^{-3} + 7$ (porque $x^{-3} = \frac{1}{x^3}$, la letra está dividiendo).
  - **Consecuencia fundamental:** Las expresiones fraccionarias **tienen restricciones en su dominio**, porque el denominador nunca puede valer cero (no se puede dividir por $0$).

  ![Expresión Algebraica Fraccionaria](/static/img/nodos/identificacion-de-expresion-algebraica-fraccionaria-intro.svg)
explicacion_formal: |
  ### Definición formal
  Una expresión algebraica racional $E(x_1, \dots, x_n)$ es **fraccionaria** si pertenece al cuerpo de fracciones racionales $\mathbb{K}(x_1, \dots, x_n) \setminus \mathbb{K}[x_1, \dots, x_n]$.
  En su forma irreducible canónica:

  $$E(x) = \frac{P(x)}{Q(x)}, \quad \text{con } P, Q \in \mathbb{K}[x], \quad \operatorname{gr}(Q) \ge 1 \quad \text{y} \quad \gcd(P, Q) = 1$$

  ### Restricciones de dominio (Valores no admisibles)
  El dominio real de una expresión algebraica fraccionaria excluye los ceros del polinomio denominador:
  $$\operatorname{Dom}(E) = \{x \in \mathbb{R} : Q(x) \neq 0\} = \mathbb{R} \setminus \mathcal{Z}(Q)$$
definiciones_clave: |
  - **Expresión algebraica fraccionaria**: Cociente irreducible de polinomios donde el divisor tiene grado $\ge 1$.
  - **Valores no admisibles / Polos**: Puntos donde el denominador se anula ($Q(x) = 0$), produciendo asíntotas o discontinuidades.
  - **Fracción algebraica irreducible**: Expresión fraccionaria donde $\gcd(P, Q) = 1$.
propiedades_relaciones: |
  - **Equivalencia de potencias negativas**: Cualquier término con exponente entero estrictamente negativo ($c \cdot x^{-k}$ con $k \in \mathbb{N}$) es una expresión fraccionaria ($c / x^k$).
  - **Simplificación condicionada**: $\frac{x^2 - 1}{x - 1} = x + 1$ es válida exclusivamente bajo la restricción de dominio $x \neq 1$.
ejemplo_guiado:
  enunciado: 'Identifica si la expresión $E(x) = 3x^2 - \frac{5}{x - 4} + 2$ es fraccionaria y determina sus valores no admisibles en $\mathbb{R}$.'
  imagen: '/static/img/nodos/identificacion-de-expresion-algebraica-fraccionaria-ejemplos.svg'
  pasos:
    - 'Paso 1: Examinamos los términos de la expresión: $3x^2$ (entero), $-\frac{5}{x-4}$ (fraccionario), $+2$ (constante).'
    - 'Paso 2: Observamos que el segundo término posee la variable $x$ en el denominador ($x - 4$).'
    - 'Paso 3: Por tener una variable en el divisor, **$E(x)$ es una expresión algebraica fraccionaria**.'
    - 'Paso 4: Hallamos los valores no admisibles igualando el denominador a cero: $x - 4 = 0 \implies **x = 4$**.'
    - 'Paso 5: Conclusión: La expresión es fraccionaria y su dominio es $\operatorname{Dom}(E) = \mathbb{R} \setminus \{4\}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál de las siguientes expresiones es una expresión algebraica fraccionaria?'
    choices:
      - text: '$\frac{2x - 3}{x + 5}$'
        is_correct: true
      - text: '$\frac{x^2 - 7}{3}$'
        is_correct: false
      - text: '$\frac{1}{2}x^3 + 5x$'
        is_correct: false
      - text: '$\sqrt{5}x^2 - 1$'
        is_correct: false
    explanation: 'La alternativa correcta es ''$\frac{2x - 3}{x + 5}$''. Tiene la variable $x$ en el denominador ($x+5$), a diferencia de $\frac{x^2-7}{3}$ cuyo divisor es una constante numérica.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Por qué la expresión $4x^3 + 7x^{-2}$ se clasifica como fraccionaria?'
    choices:
      - text: 'Porque el exponente negativo $-2$ equivale al término $\frac{7}{x^2}$, colocando a la variable en el denominador'
        is_correct: true
      - text: 'Porque el coeficiente 4 es entero'
        is_correct: false
      - text: 'Porque tiene dos términos'
        is_correct: false
      - text: 'Porque es irracional'
        is_correct: false
    explanation: 'La alternativa correcta es ''Porque el exponente negativo $-2$ equivale al término $\frac{7}{x^2}$, colocando a la variable en el denominador''. Toda potencia negativa representa una división por variable.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar si alguna variable figura en el denominador de algún término.'
  - 'Paso 2: Verificar si existen variables con exponentes enteros negativos ($x^{-k}$).'
  - 'Paso 3: Si se cumple al menos una de estas condiciones y no hay raíces en variables, clasificar como expresión fraccionaria.'
  - 'Paso 4: Determinar las restricciones igualando los denominadores a cero.'
errores_correccion: |
  - **Error 1:** Clasificar $\frac{x}{5}$ como fraccionaria. **Cómo corregirlo:** El denominador es el **número 5** (constante), por lo que es una expresión **entera**.
  - **Error 2:** Olvidar que $x^{-1}$ es una fracción. **Cómo corregirlo:** Aplicar la ley $x^{-k} = \frac{1}{x^k}$ para reconocer la **variable en el divisor**.
ejemplos:
  - titulo: 'Fracción algebraica con dos variables'
    enunciado: '¿Es la expresión $E(x, y) = \frac{x + y}{x - y}$ una expresión algebraica fraccionaria?'
    alternativas:
      - 'Sí, porque el denominador $x - y$ contiene variables'
      - 'No, porque el numerador es un binomio'
      - 'Es una expresión entera'
    respuesta: 'Sí, porque el denominador $x - y$ contiene variables'
    solucion_pasos:
      - '1. El divisor $x - y$ depende de las variables.'
      - '2. Requiere la restricción $x \neq y$.'
      - '3. Es fraccionaria.'
  - titulo: 'Exponente negativo en monomio'
    enunciado: '¿Es el monomio $6a^{-3}b^2$ una expresión fraccionaria?'
    alternativas:
      - 'Sí, equivale a $\frac{6b^2}{a^3}$'
      - 'No, es un monomio entero'
      - 'Es irracional'
    respuesta: 'Sí, equivale a $\frac{6b^2}{a^3}$'
    solucion_pasos:
      - '1. $a^{-3} = \frac{1}{a^3}$.'
      - '2. Reescribiendo: $\frac{6b^2}{a^3}$.'
      - '3. Es fraccionaria.'
  - titulo: 'Restricción de división por cero'
    enunciado: '¿Tienen las expresiones algebraicas fraccionarias restricciones en su dominio real?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. El denominador no puede anularse.'
      - '2. Los valores donde $Q(x)=0$ no pertenecen al dominio.'
  - titulo: 'Denominador constante'
    enunciado: '¿Es la expresión $\frac{3x^2 - 1}{7}$ una expresión algebraica fraccionaria?'
    respuesta: 'No'
    solucion_pasos:
      - '1. El divisor es el número constante 7.'
      - '2. Es una expresión algebraica entera.'
errores_frecuentes:
  - 'Confundir denominadores numéricos constantes con denominadores algebraicos que contienen variables.'
  - 'No reconocer que los exponentes enteros negativos representan variables en el denominador.'
  - 'Suponer que una expresión fraccionaria está definida para todo número real sin calcular valores no admisibles.'
  - 'Simplificar términos cancelando variables en denominadores sin declarar las restricciones de dominio previas.'
  - 'Clasificar expresiones fraccionarias como irracionales por tener divisiones complejas.'
afirmaciones_verdaderas:
  - 'Una expresión algebraica es fraccionaria si posee al menos una variable en el denominador o con exponente entero negativo.'
  - 'El dominio de una expresión fraccionaria excluye todos los valores que anulan su polinomio denominador.'
al_terminar_debes_poder: |
  ![Resumen de Expresión Fraccionaria](/static/img/nodos/identificacion-de-expresion-algebraica-fraccionaria-resumen.svg)

  QUÉ: Reconocer expresiones algebraicas fraccionarias, interpretar potencias negativas como divisores y calcular valores no admisibles en el dominio.
  CÓMO: Identificando la presencia de variables en el denominador ($Q(x) \neq \text{cte}$) o exponentes negativos ($x^{-k} = 1/x^k$) estableciendo $Q(x) \neq 0$.
