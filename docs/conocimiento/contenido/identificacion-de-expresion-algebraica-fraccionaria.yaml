resumen_inicial: Una expresión algebraica fraccionaria es aquella en la que al menos
  una de sus variables literales figura en el denominador (exponente negativo).
explicacion_simple: Una expresión es 'fraccionaria' cuando vemos letras abajo en el
  denominador, como en $\frac{5}{x}$ o $\frac{x + 2}{x - 3}$. Esto significa que el
  valor de la expresión depende de dividir por una variable, lo cual exige cuidar
  que esa letra no valga cero.
explicacion_formal: 'Se define la **Expresión Algebraica Fraccionaria** $F(x_1, \dots,
  x_m)$ como la división de dos polinomios $P$ y $Q$ con $Q \neq 0$ y $\text{deg}(Q)
  \ge 1$:


  $$F(x_1, \dots, x_m) = \frac{P(x_1, \dots, x_m)}{Q(x_1, \dots, x_m)} \quad \text{con
  } \exists j \quad / \quad x_j \text{ en el denominador de } Q$$


  > **Complemento didáctico:** Las expresiones fraccionarias definen el dominio de
  las funciones racionales excluyendo los ceros del denominador.'
definiciones_clave: '- **Expresión fraccionaria**: Expresión con una o más variables
  presentes en el denominador.

  - **Restricción de dominio**: $Q(X) \neq 0$.'
propiedades_relaciones: '- **Transformación de exponentes**: $\frac{1}{x^n} = x^{-n}$,
  relacionando expresiones fraccionarias con exponentes negativos.'
ejemplo_guiado:
  enunciado: Verifique si $E(x) = 4x^2 - \frac{7}{x - 2}$ es fraccionaria.
  pasos:
  - 'Paso 1: Inspeccionar los denominadores de los términos.'
  - 'Paso 2: En el término $-\frac{7}{x - 2}$, el denominador contiene la variable
    $x$.'
  - 'Paso 3: Identificar la restricción de dominio: $x - 2 \neq 0 \implies x \neq
    2$.'
  - 'Conclusión: Dado que la variable está en el denominador, SÍ es una expresión
    fraccionaria.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición define a una expresión algebraica fraccionaria?
  choices:
  - text: La presencia de al menos una variable en el denominador de alguno de sus
      términos
    is_correct: true
  - text: Que todos los coeficientes sean números enteros
    is_correct: false
  - text: Que el grado del numerador sea 10
    is_correct: false
  - text: Que no tenga variables en la expresión
    is_correct: false
  explanation: La alternativa correcta es 'La presencia de al menos una variable en
    el denominador de alguno de sus términos'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4x^2 - 7/(x - 2), ¿qué valor debe excluirse
    del dominio?
  choices:
  - text: x = 2
    is_correct: true
  - text: x = 0
    is_correct: false
  - text: x = 4
    is_correct: false
  - text: x = -7
    is_correct: false
  explanation: La alternativa correcta es 'x = 2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Examinar los denominadores de la expresión.'
- 'Paso 2: Comprobar la presencia de al menos una letra en el denominador.'
- 'Paso 3: Confirmar la clasificación como expresión algebraica fraccionaria.'
errores_correccion: '- **Error 1: Declarar que $\frac{x}{3}$ es fraccionaria.** **Cómo
  corregirlo:** En $\frac{x}{3}$ el denominador es el número 3, no una variable; por
  ende es entera, no fraccionaria.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes es una expresión algebraica fraccionaria?
  alternativas:
  - (3x + 1)/(x - 5)
  - x/4 + y/2
  - 5x^3 - 2x
  - sqrt(x) + 1
  respuesta: (3x + 1)/(x - 5)
  solucion_pasos:
  - 1. En (3x + 1)/(x - 5) la variable x figura en el denominador x-5. Es fraccionaria.
- titulo: Ejemplo 2
  enunciado: ¿Es la expresión 2x^2 + 8/y fraccionaria?
  alternativas:
  - Sí, porque la variable y está en el denominador
  - No, porque es entera
  - No, porque tiene 2 términos
  - Indeterminado
  respuesta: Sí, porque la variable y está en el denominador
  solucion_pasos:
  - 1. La presencia de 8/y incluye la letra y abajo en el denominador, haciéndola
    fraccionaria.
- titulo: ¿Es la expresión 1/x^2 una expresión fraccionaria?
  respuesta: Sí
  solucion_pasos:
  - Sí, x^2 está en el denominador.
- titulo: ¿Es la expresión (x^2 + 4)/5 una expresión fraccionaria?
  respuesta: 'No'
  solucion_pasos:
  - No, el denominador es la constante 5, por lo que es una expresión entera.
errores_frecuentes:
- Declarar que la presencia de un número constante en el denominador (como x/2) hace
  fraccionaria a la expresión.
- Omitir las restricciones de dominio donde el denominador se anula.
- Declarar que una expresión fraccionaria no se puede simplificar o evaluar.
- Declarar las expresiones fraccionarias con expresiones irracionales (raíces).
- Declarar que las expresiones fraccionarias siempre son iguales a cero.
afirmaciones_verdaderas:
- Una expresión es fraccionaria si contiene al menos una variable en el denominador.
- Las expresiones fraccionarias exigen restringir los valores de las variables que
  anulan el denominador.
al_terminar_debes_poder: Al terminar serás capaz de identificar una expresión algebraica
  fraccionaria constatando la presencia de variables en el denominador.
