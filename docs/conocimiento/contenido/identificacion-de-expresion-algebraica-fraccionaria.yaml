semantic_id: MAT.ALG.CLASIFICACION_TECNICA.EXPRESION_FRACCIONARIA
resumen_inicial: 'La identificación de expresión algebraica fraccionaria consiste en reconocer aquellas expresiones racionales que contienen al menos una variable o letra en su denominador.'
explicacion_simple: |
  Una **expresión algebraica fraccionaria** es una fracción que **lleva letras abajo en el denominador**:
  - **Condición clave**: Al menos una variable o letra debe estar dividiendo en el denominador.
  - Ejemplos: $\frac{5}{x}$, $\frac{3x + 1}{x - 2}$, $\frac{a}{b^2 + 1}$.
  - **Consecuencia importante (Restricción de Dominio)**: Como en matemáticas **NUNCA se puede dividir entre cero**, el denominador de una expresión fraccionaria no puede valer cero.
    - En $\frac{5}{x - 3}$, la variable $x$ no puede tomar el valor $3$, porque $3 - 3 = 0$ (indefinición).
  - **¡Cuidado con la trampa!** La expresión $\frac{x}{5}$ **NO es fraccionaria**, porque abajo sólo hay un número ($5$), no una letra.
explicacion_formal: |
  ### Definición formal
  Una expresión algebraica $E(x_1, \dots, x_k)$ es **fraccionaria** si es un elemento del cuerpo de fracciones racionales $\mathbb{R}(x_1, \dots, x_k) \setminus \mathbb{R}[x_1, \dots, x_k]$ representable como el cociente de dos polinomios $P$ y $Q$:

  $$E(x_1, \dots, x_k) = \frac{P(x_1, \dots, x_k)}{Q(x_1, \dots, x_k)} \quad \text{donde } \deg(Q) \ge 1$$

  es decir, el denominador $Q(x_1, \dots, x_k)$ es un polinomio no constante que contiene al menos una variable de referencia.

  ### Restricción de Dominio (Valores Prohibidos)
  El dominio de definición de una expresión fraccionaria excluye todas las raíces del polinomio denominador:

  $$\operatorname{Dom}(E) = \{(x_1, \dots, x_k) \in \mathbb{R}^k \mid Q(x_1, \dots, x_k) \neq 0\}$$

  ### Síntesis didáctica
  Las expresiones fraccionarias introducen asíntotas y puntos de discontinuidad por indefinición aditiva. Exigen calcular el MCD o MCM de denominadores para su adición o simplificación.
definiciones_clave: |
  - **Expresión algebraica fraccionaria**: Cociente polinómico $\frac{P(x)}{Q(x)}$ donde el denominador $Q(x)$ contiene al menos una variable.
  - **Restricción de dominio**: Exclusión de los valores de las variables que hacen que el denominador sea igual a cero.
  - **Asíntota vertical**: Recta a la cual la gráfica se aproxima indefinidamente en las cercanías de una raíz del denominador.
propiedades_relaciones: |
  - **Inversión de potencias**: Toda variable en el denominador equivale a una potencia con exponente negativo ($x^{-n} = \frac{1}{x^n}$).
  - **Simplificación de fracciones algebraicas**: Para simplificar una expresión fraccionaria se factorizan numerador y denominador y se cancelan los factores comunes no nulos.
ejemplo_guiado:
  enunciado: 'Dado el objeto algebraico $E(x) = \frac{7x - 2}{x - 4}$, justifica por qué es una expresión fraccionaria y determina su restricción de dominio.'
  pasos:
    - 'Paso 1: Examinamos el denominador: Corresponde al binomio $x - 4$, el cual contiene la variable $x$ $\implies$ **Es una expresión fraccionaria**.'
    - 'Paso 2: Buscamos el valor prohibido igualando el denominador a cero: $x - 4 = 0 \implies x = 4$.'
    - 'Paso 3: Excluimos el valor $4$ del conjunto de los números reales.'
    - 'Conclusión: Es una **expresión fraccionaria** cuyo dominio es **$\operatorname{Dom}(E) = \mathbb{R} \setminus \{4\}$** (la variable $x$ no puede valer $4$).'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué característica indispensable convierte a una expresión racional en fraccionaria?'
    choices:
      - {text: 'Tener al menos una variable o letra en el denominador de la fracción', is_correct: true}
      - {text: 'Tener un número impar en el numerador', is_correct: false}
      - {text: 'Estar formada exclusivamente por números negativos', is_correct: false}
      - {text: 'Carecer de coeficientes numéricos constantes', is_correct: false}
    explanation: 'La alternativa correcta es ''Tener al menos una variable o letra en el denominador de la fracción''. Definición de expresión fraccionaria.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la expresión algebraica fraccionaria $\frac{9}{x + 6}$, ¿cuál es la restricción de dominio para la variable $x$?'
    choices:
      - {text: 'La variable $x$ no puede ser igual a $-6$ ($x \neq -6$)', is_correct: true}
      - {text: 'La variable $x$ no puede ser igual a $0$', is_correct: false}
      - {text: 'La variable $x$ no puede ser un número positivo', is_correct: false}
      - {text: 'No tiene restricciones de dominio', is_correct: false}
    explanation: 'La alternativa correcta es ''La variable $x$ no puede ser igual a $-6$ ($x \neq -6$)''. $-6 + 6 = 0$ anula el denominador.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Inspeccionar el denominador de la expresión algebraica.'
  - 'Paso 2: Confirmar la presencia de al menos una letra o variable en dicho denominador.'
  - 'Paso 3: Igualar el denominador a cero para hallar las raíces o valores prohibidos.'
  - 'Paso 4: Declarar la expresión como fraccionaria y establecer la restricción de su dominio ($\mathbb{R} \setminus \{\text{raíces}\}$).'
errores_correccion: |
  - **Error 1:** Clasificar expresiones con denominador numérico como $\frac{x}{3}$ como si fueran fraccionarias. **Cómo corregirlo:** Si el denominador es sólo un número ($3$), **la expresión es ENTERA**, no fraccionaria.
  - **Error 2:** Evaluar una expresión fraccionaria en un valor que anula su denominador (ej: $x=2$ en $\frac{5}{x-2}$). **Cómo corregirlo:** Las raíces del denominador **están PROHIBIDAS** en el dominio por indefinición.
ejemplos:
  - titulo: 'Identificación de expresión fraccionaria'
    enunciado: '¿Cuál de las siguientes expresiones es fraccionaria?'
    alternativas:
      - '$\frac{8}{x - 1}$'
      - '$\frac{x - 1}{8}$'
      - '$8x - 1$'
    respuesta: '$\frac{8}{x - 1}$'
    solucion_pasos:
      - '1. $\frac{8}{x-1}$ tiene la variable $x$ en el denominador.'
      - '2. Es una expresión fraccionaria.'
  - titulo: 'Restricción de dominio'
    enunciado: 'En la expresión $\frac{x^2}{2x - 10}$, ¿cuál es el valor prohibido de $x$?'
    alternativas:
      - '$x = 5$'
      - '$x = 0$'
      - '$x = 10$'
    respuesta: '$x = 5$'
    solucion_pasos:
      - '1. Igualamos $2x - 10 = 0 \implies 2x = 10 \implies x = 5$.'
      - '2. La variable no puede tomar el valor $5$.'
  - titulo: 'Equivalencia de potencia negativa'
    enunciado: 'La expresión $4x^{-3}$, ¿equivale a la expresión fraccionaria $\frac{4}{x^3}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por propiedad de potencias de exponente negativo $x^{-n} = \frac{1}{x^n}$.'
  - titulo: 'Descarte de expresión fraccionaria'
    enunciado: 'La expresión $\frac{3x + 7}{2}$, ¿es una expresión fraccionaria?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, el denominador es el número constante $2$ sin variables $\implies$ es una expresión entera.'
errores_frecuentes:
  - 'Una expresión con un denominador numérico constante como x/5 es una expresión fraccionaria.'
  - 'Las expresiones fraccionarias no tienen restricciones de dominio y están definidas para todo x real.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Multiplicar el numerador por cero elimina la condición de expresión fraccionaria.'
  - 'El valor x=0 anula siempre el denominador de cualquier expresión fraccionaria.'
afirmaciones_verdaderas:
  - 'Una expresión algebraica es fraccionaria si contiene al menos una variable en su denominador.'
  - 'El dominio de definición de una expresión fraccionaria excluye todos los valores que anulan su denominador.'
al_terminar_debes_poder: 'Identificar expresiones algebraicas fraccionarias verificando la existencia de variables en el denominador y calculando sus restricciones de dominio.'
