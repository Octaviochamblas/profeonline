semantic_id: MAT.NUM.SUCESIONES_BASE.ORDEN_TERMINOS
resumen_inicial: 'Reconocimiento del orden de los términos en una sucesión: concepto
  y desarrollo dentro de Conceptos fundamentales de sucesiones.'
explicacion_simple: En una carrera de atletismo, no solo importa quiénes corrieron,
  sino quién llegó primero, segundo y tercero. En las sucesiones, cada número tiene
  una 'medalla' que indica su posición.
explicacion_formal: 'Para no perdernos en la fila de números, asignamos una etiqueta
  a la posición de cada uno, usando los números de contar (los Naturales: $1, 2, 3,
  4\dots$).


  Dada la sucesión: $10, 20, 30, 40, \dots$

  - El número $10$ está en la **posición 1** (es el primer término).

  - El número $20$ está en la **posición 2**.

  - El número $40$ está en la **posición 4**.


  Es fundamental **NO confundir el valor del número con su posición**. En el ejemplo,
  el valor es $40$, pero su posición es $4$. La letra ''$n$'' se utiliza casi universalmente
  en matemáticas para representar esta posición.'
definiciones_clave: '- **Reconocimiento del orden de los términos en una sucesión**:
  Concepto fundamental dentro del estudio de Conceptos fundamentales de sucesiones.'
propiedades_relaciones: '- **Propiedades de Reconocimiento del orden de los términos
  en una sucesión**: Relaciones de cambio y fórmulas estructurales de conceptos fundamentales
  de sucesiones.'
ejemplo_guiado:
