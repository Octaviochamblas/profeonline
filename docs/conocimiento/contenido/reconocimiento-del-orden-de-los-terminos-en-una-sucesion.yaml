resumen_inicial: El orden de los términos en una sucesión asigna de manera unívoca
  a cada posición natural $n$ un término $a_n$, diferenciando secuencias con los mismos
  números ordenados de distinta forma.
explicacion_simple: En las sucesiones el orden lo es todo. La lista $(1, 2, 3)$ no
  es lo mismo que $(3, 2, 1)$ aunque tengan los mismos números, porque el primer lugar
  lo ocupan elementos distintos.
explicacion_formal: 'Para dos listas $(a_n)$ y $(b_n)$, la **Igualdad de Sucesiones**
  exige la coincidencia término a término en cada posición $n \in \mathbb{N}^+$:


  $$(a_n) = (b_n) \iff a_n = b_n \quad \forall n \in \mathbb{N}^+$$


  **Diferencia funcional con conjuntos:**

  - A diferencia de los conjuntos $\{1, 2, 3\} = \{3, 2, 1\}$, en sucesiones el orden
  altera el objeto: $(1, 2, 3) \neq (3, 2, 1)$.'
definiciones_clave: '- **Orden de términos**: Asignación posicional ordenada única
  $(a_1, a_2, a_3, \dots)$.'
propiedades_relaciones: '- **Sensibilidad de posición**: Intercambiar dos términos
  genera una sucesión matemáticamente distinta.'
ejemplo_guiado:
  enunciado: Compare las sucesiones $S_1 = (3, 6, 9, 12)$ y $S_2 = (6, 3, 9, 12)$
    y determine si son idénticas.
  pasos:
  - 'Paso 1: Evaluar primer término: en $S_1$ es $a_1 = 3$ y en $S_2$ es $b_1 = 6$.'
  - 'Paso 2: Como $a_1 \neq b_1$, la igualdad término a término no se cumple.'
  - 'Conclusión: $S_1 \neq S_2$, demostrando que el orden altera la identidad de la
    sucesión.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre si intercambiamos el orden de dos términos en una sucesión
    numérica?
  choices:
  - text: Se genera una sucesión completamente distinta porque la posición determina
      la identidad del término
    is_correct: true
  - text: La sucesión permanece idéntica en todo momento
    is_correct: false
  - text: Se transforma en un número negativo
    is_correct: false
  - text: Se borran los términos
    is_correct: false
  explanation: La alternativa correcta es 'Se genera una sucesión completamente distinta
    porque la posición determina la identidad del término'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado entre S1 = (3, 6, 9, 12) y S2 = (6, 3, 9, 12), ¿son
    iguales las sucesiones?
  choices:
  - text: No, porque sus primeros términos no coinciden (3 != 6)
    is_correct: true
  - text: Sí, porque contienen los mismos cuatro números
    is_correct: false
  - text: Sí, porque suman lo mismo
    is_correct: false
  - text: No se puede determinar
    is_correct: false
  explanation: La alternativa correcta es 'No, porque sus primeros términos no coinciden
    (3 != 6)'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de reconocer la importancia del orden
  estricto de posición $n$ para establecer la identidad de una sucesión.
semantic_id: MAT.NUM.SUCESIONES_BASE.ORDEN_TERMINOS
procedimiento:
- 'Paso 1: Identificar el tipo de definición de la sucesión (término general explícito
  $a_n = f(n)$ o relación de recurrencia $a_n = g(a_{n-1})$).'
- 'Paso 2: Sustituir los índices de posición $n = 1, 2, 3, \dots$ para calcular los
  términos requeridos.'
- 'Paso 3: Verificar la consistencia de la secuencia numérica obtenida.'
errores_correccion: '- **Error 1: Sustituir $n=0$ en el término general pretendiendo
  obtener el primer término.** **Cómo corregirlo:** En el convenio escolar estándar,
  la posición del primer término empieza estrictamente en $n=1$.


  - **Error 2: Intentar calcular un término lejano en una definición recursiva sin
  conocer la condición inicial.** **Cómo corregirlo:** Una fórmula recursiva EXIGE
  conocer al menos el primer término $a_1$ para iterar.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.SUCESIONES_BASE.ORDEN_TERMINOS.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de conceptos de sucesiones numéricas.
- titulo: Ejemplo 2
  enunciado: Verificación de la notación por subíndices.
  alternativas:
  - Cumple la notación
  - No cumple
  - Indeterminado
  respuesta: Cumple la notación
  solucion_pasos:
  - Demostración formal por $a_n = f(n)$.
- titulo: ¿Comienza la posición n del primer término en n = 1?
  respuesta: Sí
  solucion_pasos:
  - Sí, en el dominio estándar $\mathbb{N}^+$.
- titulo: ¿Altera el orden de los elementos la identidad de una sucesión?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque la posición determina la asignación de cada término.
errores_frecuentes:
- Evaluar $n = 0$ para encontrar el primer término de una sucesión definida en los
  enteros positivos.
- Declarar el valor numérico del término $a_n$ con la posición ordinal $n$ en la fórmula
  general.
- Intentar una sucesión como si fuera un conjunto desordenado donde el orden de los
  elementos no importa.
- Usar una relación recursiva para calcular la posición 100 sin conocer los 99 términos
  anteriores.
- Declarar que toda secuencia gráfica responde a un crecimiento lineal simple sin
  probar la diferencia.
afirmaciones_verdaderas:
- Una sucesión numérica es una función de dominio entero positivo $\mathbb{N}^+$ a
  valores reales.
- El término general $a_n = f(n)$ permite calcular el valor de cualquier posición
  $n$ en un solo paso de evaluación.
