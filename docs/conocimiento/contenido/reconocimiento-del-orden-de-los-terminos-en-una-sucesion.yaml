semantic_id: MAT.NUM.SUCESIONES_BASE.ORDEN_TERMINOS
resumen_inicial: 'El reconocimiento del orden de los términos establece la distinción estricta entre la posición ordinal $n$ (índice) y el valor numérico asignado $a_n$ en la secuencia.'
explicacion_simple: |
  Es fundamental no confundir **el lugar del término** con **el valor del término**:
  - En la fila del cine, una persona puede ser la **tercera persona** ($n=3$) y llamarse **Carlos** ($a_3 = \text{Carlos}$).
  - En la sucesión de números impares $1, 3, 5, 7, 9, \dots$:
    - La posición $n=1$ tiene el valor $a_1 = 1$.
    - La posición $n=2$ tiene el valor $a_2 = 3$.
    - La posición $n=3$ tiene el valor $a_3 = 5$.
  Aunque el índice $n$ siempre va aumentando de uno en uno ($1, 2, 3, 4, \dots$), los valores $a_n$ pueden subir, bajar, repetirse o cambiar de signo.
explicacion_formal: |
  ### Definición formal
  El **orden de los términos** en una sucesión $(a_n)_{n \in \mathbb{N}}$ se rige por el mapa biyectivo entre el conjunto ordenado de índices de posición $\mathbb{N}$ y el conjunto de términos del recorrido $\mathbb{R}$:
  $$\text{Posición Ordinal } (n) \quad \overset{f}{\longmapsto} \quad \text{Valor Real del Término } (a_n)$$

  ### Distinción fundamental entre $n$ y $a_n$
  - **Índice $n \in \mathbb{N}$**: Variable discreta que indica el lugar o turno ($n = 1$ primero, $n = 2$ segundo, $n = k$ $k$-ésimo).
  - **Término $a_n \in \mathbb{R}$**: Cifra o magnitud numérica asignada que ocupa la posición $n$.

  ### Notación ordinalizada
  - $a_1$: Primer término (término inicial).
  - $a_2$: Segundo término.
  - $a_k$: $k$-ésimo término.
  - $a_{n-1}$: Término inmediatamente anterior (antecesor posicional).
  - $a_{n+1}$: Término inmediatamente posterior (sucesor posicional).

  ### Síntesis didáctica
  - Posición ordinal: $n \in \{1, 2, 3, \dots\}$.
  - Valor asignado: $a_n = f(n)$.
definiciones_clave: |
  - **Índice de posición ($n$)**: Número natural ordenado que marca la casilla que ocupa el elemento.
  - **Antecesor posicional ($a_{n-1}$)**: Término que precede inmediatamente a la posición $n$.
  - **Sucesor posicional ($a_{n+1}$)**: Término que sigue inmediatamente a la posición $n$.
propiedades_relaciones: |
  - **Independencia de magnitud**: El valor del término $a_n$ no tiene por qué guardar una relación de orden mayor o menor con su índice $n$ (ej: $a_n = \frac{1}{n} \implies a_5 = 0,2 < 5$).
  - **Invariancia posicional del índice**: El índice $n$ siempre avanza de forma estrictamente creciente en pasos de a uno ($\Delta n = +1$).
ejemplo_guiado:
  enunciado: 'En la sucesión $a_n = 50 - 4n$, identifica la posición $n$ y el valor del término para el cuarto y el décimo término de la lista.'
  pasos:
    - 'Paso 1: Para el cuarto término, la posición ordinal es $n = 4$.'
    - 'Paso 2: Evaluamos el valor: $a_4 = 50 - 4(4) = 50 - 16 = 34$. Posición $n=4$, valor $a_4 = 34$.'
    - 'Paso 3: Para el décimo término, la posición ordinal es $n = 10$.'
    - 'Paso 4: Evaluamos el valor: $a_{10} = 50 - 4(10) = 50 - 40 = 10$. Posición $n=10$, valor $a_{10} = 10$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la expresión de una sucesión $a_n = f(n)$, ¿qué representa la variable $n$?'
    choices:
      - {text: 'La posición ordinal o índice del término en la lista ($n = 1, 2, 3, \dots$)', is_correct: true}
      - {text: 'El valor numérico final del resultado de la sucesión', is_correct: false}
      - {text: 'La suma de todos los términos acumulados', is_correct: false}
      - {text: 'La cantidad total de términos negativos de la lista', is_correct: false}
    explanation: 'La alternativa correcta es ''La posición ordinal o índice del término en la lista ($n = 1, 2, 3, \dots$)''. $n$ es el número de lugar.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la sucesión de números primos $2, 3, 5, 7, 11, 13, \dots$, ¿cuál es el valor del término en la posición $n=4$?'
    choices:
      - {text: 'El número $7$, que es el cuarto número primo de la secuencia', is_correct: true}
      - {text: 'El número $4$, por ser la posición', is_correct: false}
      - {text: 'El número $5$, que ocupa la tercera casilla', is_correct: false}
      - {text: 'El número $11$, que es el quinto primo', is_correct: false}
    explanation: 'La alternativa correcta es ''El número $7$, que es el cuarto número primo de la secuencia''. $a_1=2, a_2=3, a_3=5, a_4=7$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar si se solicita una posición $n$ o un valor $a_n$.'
  - 'Paso 2: Para hallar el valor de la posición $k$, reemplazar $n=k$ en la fórmula funcional.'
  - 'Paso 3: Para hallar qué posición ocupa un valor dado $V$, igualar la fórmula $a_n = V$ y despejar $n$.'
  - 'Paso 4: Verificar que el valor de $n$ resultante sea un número entero positivo ($\mathbb{N}$).'
errores_correccion: |
  - **Error 1:** Confundir el valor del término $a_n$ con su número de posición $n$ (ej: pensar que en $a_5 = 20$, la posición es $20$). **Cómo corregirlo:** La **posición es el subíndice $n=5$**; la cifra $20$ es el valor que está guardado en esa posición.
  - **Error 2:** Obtener un valor de posición $n$ decimal o negativo. **Cómo corregirlo:** Las posiciones sólo pueden ser **números enteros positivos** ($n = 1, 2, 3, \dots$).
ejemplos:
  - titulo: 'Distinción entre posición y valor'
    enunciado: 'En la sucesión $10, 20, 30, 40$, ¿el valor $a_3 = 30$ está en la posición $n=3$?'
    alternativas:
      - 'Sí, $n=3$ es el lugar y $a_3=30$ es el valor'
      - 'No, la posición es 30'
      - 'No, el valor es 3'
    respuesta: 'Sí, $n=3$ es el lugar y $a_3=30$ es el valor'
    solucion_pasos:
      - '1. Primer lugar $n=1 \implies 10$.'
      - '2. Segundo lugar $n=2 \implies 20$.'
      - '3. Tercer lugar $n=3 \implies 30$.'
  - titulo: 'Despeje de posición ordinal'
    enunciado: 'En $a_n = 4n + 2$, ¿el valor $a_n = 22$ ocupa la posición $n=5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Igualamos $4n + 2 = 22 \implies 4n = 20 \implies n = 5$.'
  - titulo: 'Término antecesor'
    enunciado: 'Si $a_n = 15$ en la posición $n=6$, ¿su antecesor posicional es $a_5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El antecesor directo de la posición 6 es la posición $6-1 = 5$.'
  - titulo: 'Término sucesor'
    enunciado: 'En cualquier sucesión, ¿el término que le sigue inmediatamente a $a_n$ se denota $a_{n+1}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $a_{n+1}$ representa la casilla posicional siguiente.'
errores_frecuentes:
  - 'Intercambiar el número de posición $n$ con el valor numérico resultante del término $a_n$.'
  - 'Aceptar valores decimales o fraccionarios como índices de posición ordinales válidos.'
  - 'El valor numérico de un término debe ser siempre mayor que su número de posición.'
  - 'Restar 1 al índice de posición pensando que el primer término corresponde a $n=0$.'
  - 'La notación del antecesor posicional $a_{n-1}$ equivale numéricamente al resultado de restar 1 al valor $a_n - 1$.'
afirmaciones_verdaderas:
  - 'La variable $n$ representa la posición u orden ordinal ($1, 2, 3, \dots$) y $a_n$ representa el valor del término en esa posición.'
  - 'El antecesor posicional de $a_n$ es $a_{n-1}$ y el sucesor posicional es $a_{n+1}$.'
al_terminar_debes_poder: 'Reconocer y diferenciar la posición ordinal $n$ del valor del término $a_n$ en cualquier sucesión numérica.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
estado: publicado
