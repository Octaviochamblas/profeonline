semantic_id: MAT.NUM.SUCESIONES_BASE.ORDEN_TERMINOS
resumen_inicial: 'El reconocimiento del orden de los términos en una sucesión distingue entre el índice ordinal de posición $n \in \mathbb{N}$ y el valor numérico del término $a_n \in \mathbb{R}$.'
explicacion_simple: |
  En una sucesión es fundamental no confundir **el lugar** donde está un número con **el valor** de ese número:
  - La **posición** ($n$) es el número de turno: $1^{\circ}, 2^{\circ}, 3^{\circ}, 4^{\circ}, \dots$
  - El **término** ($a_n$) es el valor real que está en esa posición.
  - Por ejemplo, en la sucesión de números primos $(2, 3, 5, 7, 11)$, el $4^{\circ}$ término ($n=4$) es el número $7$. Aquí $n=4$ es la posición y $a_4=7$ es el valor.

  ![Reconocimiento del orden de los términos](/static/img/nodos/reconocimiento-del-orden-de-los-terminos-en-una-sucesion-intro.svg)
explicacion_formal: |
  ### Definición formal
  Dada una sucesión $(a_n)_{n \ge 1}$, se establece una relación unívoca entre el índice de orden $n$ perteneciente al conjunto bien ordenado $(\mathbb{N}, \le)$ y el elemento imagen $a_n$:
  $$(n, a_n) \in \mathbb{N} \times \mathbb{R}$$
  - **Índice ordinal ($n$)**: Representa el orden cronológico o secuencial ($n = 1, 2, 3, \dots$).
  - **Valor del término ($a_n$)**: Elemento numérico asignado a la posición $n$.

  ### Distinción fundamental: Posición vs Valor
  - $n$ siempre es un número entero positivo ($n \in \{1, 2, 3, \dots\}$).
  - $a_n$ puede ser cualquier número real: negativo ($a_n < 0$), decimal, nulo ($a_n = 0$) o fraccionario.

  ### Síntesis didáctica
  - Posición ordinal: $n \in \mathbb{N}$.
  - Valor del término: $a_n \in \mathbb{R}$.
definiciones_clave: |
  - **Índice ordinal ($n$)**: Número natural que cuantifica el lugar que ocupa un término dentro de la lista.
  - **Primer término ($a_1$)**: Elemento ubicado en la posición inicial $n=1$.
  - **Término $k$-ésimo ($a_k$)**: Valor ubicado exactamente en la posición $n=k$.
propiedades_relaciones: |
  - **Invarianza posicional**: El valor del término $a_n$ no modifica su posición $n$; por ejemplo, $a_1 = 100$ sigue siendo el primer término.
  - **Sucesiones monótonas**: Si $a_{n+1} > a_n$ para todo $n$, la sucesión es estrictamente creciente.
ejemplo_guiado:
  enunciado: 'En la sucesión $(-4, -1, 2, 5, 8, 11)$, identifica la posición del término $5$, el valor del término en la posición $n=2$ y el primer término.'
  imagen: '/static/img/nodos/reconocimiento-del-orden-de-los-terminos-en-una-sucesion-ejemplos.svg'
  pasos:
    - 'Paso 1: Listamos las posiciones ordenadas: $a_1 = -4, a_2 = -1, a_3 = 2, a_4 = 5, a_5 = 8, a_6 = 11$.'
    - 'Paso 2: El valor $5$ se encuentra en el cuarto lugar, por lo tanto su posición es **$n = 4$**.'
    - 'Paso 3: El término en la posición $n = 2$ corresponde a **$a_2 = -1$**.'
    - 'Paso 4: El primer término ($n=1$) es **$a_1 = -4$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué tipo de número representa siempre la posición o índice $n$ de una sucesión?'
    choices:
      - {text: 'Un número entero positivo ($n \in \mathbb{N}$)', is_correct: true}
      - {text: 'Cualquier número real negativo o decimal', is_correct: false}
      - {text: 'Únicamente números racionales fraccionarios', is_correct: false}
      - {text: 'Un número irracional', is_correct: false}
    explanation: 'La alternativa correcta es ''Un número entero positivo ($n \in \mathbb{N}$)''. La posición de un elemento en una lista corresponde a un entero positivo ordinal ($1, 2, 3, \dots$).'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En la sucesión $(10, 20, 30, 40, 50)$, ¿cuál es el valor del término en la posición $n=4$?'
    choices:
      - {text: '$40$, que ocupa el cuarto lugar de la lista', is_correct: true}
      - {text: '$4$, confundiéndolo con la posición', is_correct: false}
      - {text: '$50$, por ser el último término', is_correct: false}
      - {text: '$10$, por ser el término inicial', is_correct: false}
    explanation: 'La alternativa correcta es ''$40$, que ocupa el cuarto lugar de la lista''. En $n=4$, el elemento correspondiente es $a_4 = 40$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Enumerar correlativamente cada elemento de la secuencia comenzando desde $n=1$.'
  - 'Paso 2: Asociar a cada posición su valor numérico correspondiente ($a_1, a_2, \dots, a_n$).'
  - 'Paso 3: Distinguir con claridad si la pregunta solicita el índice $n$ o el valor $a_n$.'
errores_correccion: |
  - **Error 1:** Confundir el número de posición $n$ con el valor numérico $a_n$ (ej: creer que en $a_3 = 15$, la posición es 15). **Cómo corregirlo:** Recordar que **$n$ es el lugar ordinal** y **$a_n$ es el número que está en ese lugar**.
  - **Error 2:** Creer que el primer término $a_1$ siempre debe valer 1. **Cómo corregirlo:** El primer término **puede tomar cualquier valor real** (ej: $a_1 = -20$ o $a_1 = 0,5$).
ejemplos:
  - titulo: 'Identificación de término en posición dada'
    enunciado: 'En la sucesión $(7, 14, 21, 28, 35)$, ¿cuál es el término en la posición $n=3$?'
    alternativas:
      - '$21$'
      - '$3$'
      - '$14$'
    respuesta: '$21$'
    solucion_pasos:
      - '1. $a_1 = 7, a_2 = 14, a_3 = 21$.'
  - titulo: 'Identificación de posición de un término'
    enunciado: 'En la sucesión $(100, 90, 80, 70, 60)$, ¿qué posición ocupa el valor $70$?'
    alternativas:
      - '$n = 4$'
      - '$n = 70$'
      - '$n = 3$'
    respuesta: '$n = 4$'
    solucion_pasos:
      - '1. $a_1=100, a_2=90, a_3=80, a_4=70 \implies n=4$.'
  - titulo: 'Primer término negativo'
    enunciado: '¿Una sucesión puede tener como primer término $a_1$ un número negativo como $-15$?'
    alternativas:
      - 'Sí, los valores de los términos pueden ser cualquier número real'
      - 'No, los términos deben ser enteros positivos'
      - 'No, el primer término siempre es mayor que cero'
    respuesta: 'Sí, los valores de los términos pueden ser cualquier número real'
    solucion_pasos:
      - '1. El codominio de la sucesión es $\mathbb{R}$.'
  - titulo: 'Distinción entre posición y valor'
    enunciado: '¿El índice de posición $n=5$ es idéntico al valor del término $a_5$?'
    alternativas:
      - 'No, $n=5$ indica la ubicación y $a_5$ indica el valor en dicha ubicación'
      - 'Sí, siempre representan exactamente el mismo número'
      - 'Sí, en todas las sucesiones matemáticas'
    respuesta: 'No, $n=5$ indica la ubicación y $a_5$ indica el valor en dicha ubicación'
    solucion_pasos:
      - '1. La posición $n$ y el valor $a_n$ son entidades matemáticas distintas.'
errores_frecuentes:
  - 'El índice de posición $n$ es idéntico al valor numérico $a_n$ del término en esa ubicación.'
  - 'El primer término $a_1$ de cualquier sucesión debe ser obligatoriamente igual al número uno.'
  - 'La posición $n$ de un término puede ser un número decimal como dos coma cinco.'
  - 'Una sucesión no puede contener números negativos ni fracciones como términos.'
  - 'Alterar el orden de los elementos conserva la misma sucesión numérica.'
afirmaciones_verdaderas:
  - 'El índice $n$ representa la posición ordinal entera positiva de un término en la secuencia ($n \in \mathbb{N}$).'
  - 'El valor numérico $a_n$ de un término puede ser cualquier número real positivo, negativo, entero o fraccionario.'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/reconocimiento-del-orden-de-los-terminos-en-una-sucesion-resumen.svg)

  QUÉ: Reconocer y distinguir la posición ordinal $n$ del valor numérico del término $a_n$ en sucesiones.
  CÓMO: Indexar ordenadamente cada elemento mediante $(n, a_n)$ determinando el lugar relativo de cada término en la secuencia.
