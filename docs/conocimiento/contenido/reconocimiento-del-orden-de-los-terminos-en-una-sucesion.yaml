  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Lee la sucesión de izquierda a derecha.'
- 'Paso 2: Asigna el número 1 al primer valor que leas, el 2 al segundo, etc.'
- 'Paso 3: Si te preguntan por la posición ''n=3'', busca el tercer número escrito.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en reconocimiento del orden de los términos en una sucesión.
ejemplos:
- titulo: Ubicando al infiltrado
  enunciado: 'En la sucesión: 2, 4, 8, 16, 32... ¿qué valor ocupa la cuarta posición (n=4)?'
  solucion_pasos:
  - 'Posición 1: 2'
  - 'Posición 2: 4'
  - 'Posición 3: 8'
  - 'Posición 4: 16.'
  - El valor en la cuarta posición es 16.
- titulo: Ejemplo 1
  enunciado: En la sucesión 9, 18, 27, 36, ¿qué valor ocupa la segunda posición?
  alternativas:
  - '18'
  - '9'
  - '27'
  respuesta: '18'
  solucion_pasos:
  - 'Cuento desde el inicio: posición 1 es 9, posición 2 es 18.'
- titulo: Ejemplo 2
  enunciado: ¿Qué posición ocupa el término 36 en la sucesión 9, 18, 27, 36?
  alternativas:
  - La posición 4
  - La posición 3
  - La posición 36
  respuesta: La posición 4
  solucion_pasos:
  - 'Cuento los términos en orden hasta llegar a 36: 9, 18, 27, 36 son las posiciones 1, 2,
    3 y 4.'
- titulo: ¿El primer término de una sucesión siempre ocupa la posición 1?
  respuesta: Sí
  solucion_pasos:
  - Las posiciones de una sucesión son números naturales que comienzan en 1, nunca en 0.
- titulo: ¿Es correcto decir que 'el término 5' significa 'el valor 5'?
  respuesta: 'No'
  solucion_pasos:
  - '''El término 5'' se refiere al valor que está en la posición 5, no al número 5 en sí
    mismo.'
errores_frecuentes:
- Confundir el valor del término con el número de su posición (Ej. decir que el término en
  la posición 16 es el número 4, leyendo al revés).
- Pensar que existe la posición 'cero' o posiciones negativas (las posiciones empiezan siempre
  en 1).
- Empezar a contar las posiciones desde 0 en vez de desde 1.
- Contar las posiciones de derecha a izquierda en vez de izquierda a derecha.
- Confundir 'el tercer término' con 'el término que vale 3'.
afirmaciones_verdaderas:
- La formulación de reconocimiento del orden de los términos en una sucesión mantiene la regularidad
  de la sucesión.
- La posición de un término en una sucesión siempre se indica con un número natural, comenzando
  en 1.
al_terminar_debes_poder: Resolver problemas prácticos utilizando reconocimiento del orden
  de los términos en una sucesión.
