semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.RECORRIDO_BASE
resumen_inicial: 'El recorrido de una función exponencial básica es el conjunto de reales estrictamente positivos $]0, +\infty[$ si $a > 0$, o de reales estrictamente negativos $]-\infty, 0[$ si $a < 0$.'
explicacion_simple: |
  El recorrido representa todos los valores de salida o resultados de $y$ que puede producir una función. Al elevar una base positiva $b > 0$ a cualquier exponente real $x$, la potencia $b^x$ siempre da como resultado un número estrictamente mayor que cero (nunca da cero y nunca da negativo). Si el coeficiente $a$ es positivo, todas las salidas son números positivos ($y > 0$). Si $a$ es negativo, todas las salidas son números negativos ($y < 0$).
explicacion_formal: |
  ### Definición formal
  Para la función exponencial no trasladada $f: \mathbb{R} \to \mathbb{R}$ definida por $f(x) = a \cdot b^x$, con $a \neq 0$ y $b > 0, b \neq 1$, el **conjunto recorrido o imagen** $\operatorname{Rec}(f) = \{y \in \mathbb{R} \mid \exists x \in \mathbb{R}, f(x) = y\}$ se determina analíticamente mediante la propiedad del positivismo estricto de la potencia exponencial:
  $$\forall x \in \mathbb{R}, \quad b^x > 0$$
  por lo tanto:
  - **Si $a > 0$**: $\operatorname{Rec}(f) = ]0, +\infty[ = \mathbb{R}^+$.
  - **Si $a < 0$**: $\operatorname{Rec}(f) = ]-\infty, 0[ = \mathbb{R}^-$.

  ### Desglose simbólico
  - Cero inaccesible ($y \neq 0$): La ecuación $a \cdot b^x = 0$ no posee solución real ($b^x = 0$ es imposible).
  - Cota inferior/superior asintótica: Para $a > 0$, $\lim_{x \to \pm\infty} a \cdot b^x = 0^+$, lo que significa que los valores se aproximan infinitamente a cero sin llegar a tocar el valor $0$.

  ### Síntesis didáctica
  Reconocer la diferencia entre corchete abierto y cerrado: El número cero NO forma parte del recorrido de la función exponencial básica $a \cdot b^x$. Por ello, el intervalo se escribe obligatoriamente abierto en cero $]0, +\infty[$ o $]-\infty, 0[$.
definiciones_clave: |
  - **Conjunto recorrido / imagen**: Conjunto de todos los valores de salida $y = f(x)$ que genera la función.
  - **Positivismo estricto $b^x > 0$**: Propiedad algebraica que impide que una potencia de base positiva se anule o sea negativa.
  - **Intervalo abierto en cero**: Representación $]0, +\infty[$ que excluye explícitamente el valor $y = 0$.
propiedades_relaciones: |
  - **Ausencia de intersección con el eje $x$**: Puesto que $y = 0 \notin \operatorname{Rec}(f)$, la gráfica de la función exponencial básica jamás corta al eje de las abscisas.
  - **Efecto de traslaciones verticales**: Si se agrega una constante $k$ a la función ($f(x) = a \cdot b^x + k$), el recorrido se desplaza a $]k, +\infty[$ (si $a > 0$) o $]-\infty, k[$ (si $a < 0$).
ejemplo_guiado:
  enunciado: 'Determina el conjunto recorrido de las funciones exponenciales $f(x) = 6 \cdot 4^x$ y $g(x) = -3 \cdot \left(\frac{1}{2}\right)^x$, indicando en cada caso si la gráfica posee intersecciones con el eje $x$.'
  pasos:
    - 'Paso 1: Para $f(x) = 6 \cdot 4^x$, identificamos $a = 6 > 0$ y $b = 4 > 0$.'
    - 'Paso 2: Como $a > 0$ y $4^x > 0$, todas las imágenes son positivas. El recorrido es $\operatorname{Rec}(f) = ]0, +\infty[$. No corta al eje $x$ pues $y = 0$ no pertenece al recorrido.'
    - 'Paso 3: Para $g(x) = -3 \cdot \left(\frac{1}{2}\right)^x$, identificamos $a = -3 < 0$ y $b = \frac{1}{2} > 0$.'
    - 'Paso 4: Como $a < 0$ y $\left(\frac{1}{2}\right)^x > 0$, el producto por $-3$ hace que todas las imágenes sean negativas. El recorrido es $\operatorname{Rec}(g) = ]-\infty, 0[$. Tampoco corta al eje $x$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el conjunto recorrido de la función exponencial básica $f(x) = 12 \cdot 5^x$?'
    choices:
      - {text: 'El conjunto de los números reales estrictamente positivos $\operatorname{Rec}(f) = ]0, +\infty[$', is_correct: true}
      - {text: 'El conjunto de todos los números reales $\operatorname{Rec}(f) = \mathbb{R}$', is_correct: false}
      - {text: 'El conjunto cerrado $[0, +\infty[$ incluyendo al cero', is_correct: false}
      - {text: 'El intervalo acotado $[12, +\infty[$', is_correct: false}
    explanation: 'La alternativa correcta es ''El conjunto de los números reales estrictamente positivos $\operatorname{Rec}(f) = ]0, +\infty[$''. Al ser $a = 12 > 0$, la función toma todos los valores reales positivos excluyendo al cero.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una función exponencial se expresa como $g(x) = -4 \cdot 2^x$, ¿cuál es la razón por la cual su recorrido es $]-\infty, 0[$?'
    choices:
      - {text: 'Porque $2^x$ es siempre estrictamente positivo, y al multiplicarse por $a = -4 < 0$, todos los resultados se vuelven estrictamente negativos', is_correct: true}
      - {text: 'Porque la base $2$ es un número par', is_correct: false}
      - {text: 'Porque la función no está definida para números positivos', is_correct: false}
      - {text: 'Porque la gráfica es una recta vertical', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque $2^x$ es siempre estrictamente positivo, y al multiplicarse por $a = -4 < 0$, todos los resultados se vuelven estrictamente negativos''. El signo del coeficiente $a$ determina la orientación del recorrido.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Extraer el coeficiente multiplicativo de escala $a$ de la función exponencial $f(x) = a \cdot b^x$.'
  - 'Paso 2: Recordar que la potencia $b^x > 0$ para todo $x \in \mathbb{R}$.'
  - 'Paso 3: Si $a > 0$, declarar el recorrido como el intervalo abierto $\operatorname{Rec}(f) = ]0, +\infty[$.'
  - 'Paso 4: Si $a < 0$, declarar el recorrido como el intervalo abierto $\operatorname{Rec}(f) = ]-\infty, 0[$.'
errores_correccion: |
  - **Error 1:** Incluir el número cero en el recorrido escribiendo el intervalo cerrado $[0, +\infty[$. **Cómo corregirlo:** La potencia de base positiva $b^x$ se aproxima infinitamente a cero pero nunca se anula. El recorrido debe escribirse con corchete abierto en cero $]0, +\infty[$.
  - **Error 2:** Creer que la función exponencial básica puede tomar cualquier valor real ($\operatorname{Rec} = \mathbb{R}$). **Cómo corregirlo:** A diferencia de una recta inclinada, la función exponencial básica no trasladada posee una cota en $y = 0$, por lo que sus imágenes nunca cubren todo $\mathbb{R}$.
ejemplos:
  - titulo: 'Recorrido de función exponencial mónica'
    enunciado: '¿Cuál es el recorrido de $f(x) = 3^x$?'
    alternativas:
      - '$]0, +\infty[$'
      - '$[0, +\infty[$'
      - '$\mathbb{R}$'
    respuesta: '$]0, +\infty[$'
    solucion_pasos:
      - '1. El coeficiente es $a = 1 > 0$.'
      - '2. La potencia $3^x > 0$ para todo $x \in \mathbb{R}$.'
      - '3. El recorrido es $\operatorname{Rec}(f) = ]0, +\infty[$.'
  - titulo: 'Cero fuera del recorrido'
    enunciado: '¿Existe algún valor de $x$ tal que $2^x = 0$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Para cualquier $x \in \mathbb{R}$, $2^x > 0$. La función nunca alcanza el valor cero.'
  - titulo: 'Recorrido con coeficiente negativo'
    enunciado: '¿El recorrido de $g(x) = -5 \cdot 2^x$ es $]-\infty, 0[$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser $a = -5 < 0$, las imágenes son todas negativas, luego $\operatorname{Rec}(g) = ]-\infty, 0[$.'
  - titulo: 'Imposibilidad de cortes en x'
    enunciado: '¿La función $f(x) = 8 \cdot 3^x$ interseca al eje $x$ en algún punto?'
    respuesta: 'No'
    solucion_pasos:
      - 'No. Para cortar al eje $x$ se requiere $y = 0$, pero $y = 0 \notin \operatorname{Rec}(f) = ]0, +\infty[$.'
errores_frecuentes:
  - 'El recorrido de la función exponencial básica $f(x) = 2^x$ incluye al número cero en el intervalo $[0, +\infty[$.'
  - 'Una función exponencial básica $f(x) = a \cdot b^x$ corta al eje $x$ en el origen $(0, 0)$.'
  - 'El recorrido de la función exponencial básica $f(x) = a \cdot b^x$ es el conjunto de todos los números reales $\mathbb{R}$.'
  - 'Si el coeficiente $a$ es negativo, el recorrido de $f(x) = a \cdot b^x$ es $]0, +\infty[$.'
  - 'El valor de la base $b$ altera la cota asintótica $y = 0$ del recorrido de la función básica.'
afirmaciones_verdaderas:
  - 'El recorrido de una función exponencial básica $f(x) = a \cdot b^x$ es $]0, +\infty[$ si $a > 0$, excluyendo estrictamente el valor cero.'
  - 'La propiedad $b^x > 0$ garantiza que la gráfica de una función exponencial básica jamás toque ni atraviese el eje $x$.'
