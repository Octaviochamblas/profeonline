semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.RECORRIDO_BASE
resumen_inicial: 'Determinación del recorrido de la función exponencial básica: conceptos,
  asíntotas, propiedades e inversidad en Conceptos de la función exponencial.'
explicacion_simple: Sin importar qué tan grande o pequeño sea el exponente, una potencia
  con base positiva nunca produce cero ni un valor negativo; ese hecho determina completamente
  el recorrido.
explicacion_formal: '### Definición formal


  Dada $f(x)=a\cdot b^x$ con $b>0$, $b\neq1$: como $b^x>0$ para todo $x$ real, si
  $a>0$ entonces $f(x)>0$ para todo $x$, dando $\text{Rec}(f)=]0,+\infty[$; si $a<0$,
  entonces $f(x)<0$ para todo $x$, dando $\text{Rec}(f)=]-\infty,0[$.


  ### Desarrollo didáctico


  El valor cero nunca se alcanza porque ninguna potencia con base positiva puede dar
  exactamente cero, sin importar cuán negativo sea el exponente; la función solo se
  acerca infinitamente a cero sin tocarlo.


  Para $f(x)=3\cdot2^x$: como $a=3>0$, el recorrido es $]0,+\infty[$; la función nunca
  es cero ni negativa.'
definiciones_clave: '- **Determinación del recorrido de la función exponencial básica**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a determinación del recorrido de la función exponencial básica.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de determinación
    del recorrido de la función exponencial básica.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de determinación del recorrido
    de la función exponencial básica.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    determinación del recorrido de la función exponencial básica?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en conceptos de la
      función exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en conceptos de la función exponencial. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en determinación del recorrido de la función exponencial básica?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verifica el signo del coeficiente $a$.'
- 'Paso 2: Si $a>0$, concluye que el recorrido es $]0,+\infty[$.'
- 'Paso 3: Si $a<0$, concluye que el recorrido es $]-\infty,0[$.'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en determinación
  del recorrido de la función exponencial básica.
ejemplos:
- titulo: Determinación de recorrido con a positivo
  enunciado: Determina el recorrido de $f(x)=5\cdot3^x$.
  solucion_pasos:
  - $a=5>0$.
  - $\text{Rec}(f)=]0,+\infty[$.
- titulo: Determinación de recorrido con a negativo
  enunciado: Determina el recorrido de $f(x)=-2\cdot4^x$.
  solucion_pasos:
  - $a=-2<0$.
  - $\text{Rec}(f)=]-\infty,0[$.
- titulo: ¿Una función exponencial básica puede tomar el valor cero?
  enunciado: ¿Una función exponencial básica puede tomar el valor cero?
  respuesta: 'No'
  solucion_pasos:
  - Ninguna potencia con base positiva puede ser exactamente cero, sin importar el
    exponente.
- titulo: ¿El recorrido de una función exponencial básica incluye siempre los extremos
    del intervalo?
  enunciado: ¿El recorrido de una función exponencial básica incluye siempre los extremos
    del intervalo?
  respuesta: 'No'
  solucion_pasos:
  - El intervalo es abierto en cero (nunca se alcanza) y no tiene un límite superior
    o inferior finito que se alcance.
errores_frecuentes:
- Incluir el cero en el recorrido de la función exponencial básica.
- Confundir el recorrido con el dominio, que siempre es $\mathbb{R}$.
- No verificar el signo de $a$ antes de determinar el recorrido.
- Usar corchetes en vez de paréntesis en el extremo correspondiente al valor cero,
  que nunca se alcanza.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando determinación del recorrido de la función exponencial básica.
