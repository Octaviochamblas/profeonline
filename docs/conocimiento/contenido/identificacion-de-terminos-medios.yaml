semantic_id: MAT.NUM.PROPORCIONES.TERMINOS_MEDIOS
resumen_inicial: 'En una proporción $a : b = c : d$ o $\frac{a}{b} = \frac{c}{d}$, los términos medios son el segundo y el tercer término: $b$ y $c$, ubicados en la posición central alrededor del signo de igualdad.'
explicacion_simple: '![Términos medios](/static/img/nodos/identificacion-de-terminos-medios-intro.svg)


  En una proporción $a : b = c : d$:

  - Los **medios** son los dos números del **centro**: **$b$ y $c$**.

  - En la forma de fracciones $\frac{a}{b} = \frac{c}{d}$, forman la **diagonal secundaria ascendente** (el denominador izquierdo $b$ y el numerador derecho $c$).

  - Ejemplo: En $2 : 7 = 6 : 21$, los medios son **$7$ y $6$**.

  - Su producto ($7 \cdot 6 = 42$) es igual al producto de los extremos ($2 \cdot 21 = 42$).

  - En una **proporción continua** $\frac{a}{x} = \frac{x}{c}$, ambos medios son iguales ($x$).'
explicacion_formal: 'Dada la proporción geométrica $\frac{a}{b} = \frac{c}{d}$ con $b, d \neq 0$, se definen formalmente los **términos medios** como el par:


  $$\operatorname{Med}(\mathcal{P}) = (b, c)$$


  donde $b$ es el segundo término (consecuente de la 1ª razón) y $c$ es el tercer término (antecedente de la 2ª razón).


  **Producto de Medios:**

  El escalar $P_{\text{med}} = b \cdot c$ debe coincidir idénticamente con el producto de extremos:

  $$b \cdot c = a \cdot d$$'
definiciones_clave: '- **Términos medios**: $b$ (2° término) y $c$ (3° término).

  - **Posición diagonal secundaria**: Denominador del 1° miembro y numerador del 2° miembro.

  - **Proporción continua**: Proporción donde $b = c = x$.'
propiedades_relaciones: '- **Transposición de medios**: Los medios pueden permutarse sin alterar la proporción: $\frac{a}{c} = \frac{b}{d}$.

  - **Media geométrica**: Si $b = c = x$, entonces $x^2 = a \cdot d$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de términos medios](/static/img/nodos/identificacion-de-terminos-medios-ejemplos.svg)


    Identifique los términos medios en $2 : 7 = 6 : 21$ y en la proporción continua $\frac{4}{x} = \frac{x}{9}$, y determine su producto.'
  pasos:
  - 'Paso 1: En $2 : 7 = 6 : 21$: Los números interiores en el centro son $7$ y $6$ $\implies$ Medios = $7$ y $6$.'
  - 'Paso 2: Calcular producto de medios: $7 \cdot 6 = 42$.'
  - 'Paso 3: En $\frac{4}{x} = \frac{x}{9}$: Ambos términos medios son la incógnita $x$.'
  - 'Paso 4: Producto de medios: $x \cdot x = x^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los términos medios en la proporción $\frac{5}{9} = \frac{10}{18}$?
  choices:
  - text: $9$ y $10$
    is_correct: true
  - text: $5$ y $18$
    is_correct: false
  - text: $5$ y $9$
    is_correct: false
  - text: $10$ y $18$
    is_correct: false
  explanation: La alternativa correcta es '$9$ y $10$'. Denominador izquierdo y numerador derecho.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿qué ocurre en una proporción continua como $\frac{4}{x} = \frac{x}{9}$ con los términos medios?
  choices:
  - text: Ambos términos medios son exactamente iguales entre sí (x = x)
    is_correct: true
  - text: Uno de los medios vale cero
    is_correct: false
  - text: Los medios son números negativos
    is_correct: false
  - text: No existen términos medios
    is_correct: false
  explanation: La alternativa correcta es 'Ambos términos medios son exactamente iguales entre sí (x = x)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la proporción en formato estándar $a : b = c : d$ o $\frac{a}{b} = \frac{c}{d}$.'
- 'Paso 2: Identificar los dos términos centrales: el consecuente de la primera razón ($b$) y el antecedente de la segunda ($c$).'
- 'Paso 3: Calcular el producto de medios $b \cdot c$ para verificar o despejar ecuaciones.'
errores_correccion: '- **Error 1: Tomar los dos denominadores como medios ($b$ y $d$).** **Cómo corregirlo:** Los medios son $b$ y $c$ (denominador de la 1ª y numerador de la 2ª).

  - **Error 2: Confundir medios con extremos.** **Cómo corregirlo:** Los extremos están en las orillas ($a, d$); los medios están en el centro ($b, c$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: '¿Cuáles son los términos medios en la proporción $4 : 6 = 10 : 15$?'
  alternativas:
  - $6$ y $10$
  - $4$ y $15$
  - $4$ y $6$
  respuesta: $6$ y $10$
  solucion_pasos:
  - Los términos centrales son $6$ y $10$.
- titulo: Ejemplo 2
  enunciado: Si los medios de una proporción son $8$ y $3$, ¿cuánto vale su producto?
  alternativas:
  - $24$
  - $11$
  - $5$
  respuesta: $24$
  solucion_pasos:
  - $8 \cdot 3 = 24$.
- titulo: '¿Son 5 y 12 los medios en 3 : 5 = 12 : 20?'
  respuesta: Sí
  solucion_pasos:
  - Sí, son los términos interiores que rodean al signo igual.
  alternativas:
  - texto: Sí, corresponden al segundo y tercer término
    es_correcta: true
    retroalimentacion: ¡Correcto! Posición central.
  - texto: No, son 3 y 20
    es_correcta: false
    retroalimentacion: Incorrecto, 3 y 20 son los extremos.
  - texto: No, son 3 y 12
    es_correcta: false
    retroalimentacion: Incorrecto, esos son los numeradores.
- titulo: ¿Puede permutarse el orden de los medios sin alterar la proporción?
  respuesta: Sí
  solucion_pasos:
  - Sí, si $\frac{a}{b} = \frac{c}{d}$, entonces $\frac{a}{c} = \frac{b}{d}$.
  alternativas:
  - texto: Sí, por la propiedad de transposición de medios
    es_correcta: true
    retroalimentacion: ¡Correcto! Propiedad de alternancia de medios.
  - texto: No, la proporción se destruye
    es_correcta: false
    retroalimentacion: Incorrecto, el producto cruzado $a \cdot d = b \cdot c$ sigue siendo idéntico.
  - texto: No, solo los extremos se pueden permutar
    es_correcta: false
    retroalimentacion: Incorrecto, tanto medios como extremos pueden permutarse entre sí.
errores_frecuentes:
- Tomar ambos denominadores como términos medios.
- Confundir la posición de medios y extremos.
- Olvidar que en proporciones continuas el término medio se repite.
- Invertir la multiplicación en el producto cruzado.
afirmaciones_verdaderas:
- Los términos medios son el segundo término ($b$) y el tercer término ($c$) de la proporción.
- En la forma fraccionaria $\frac{a}{b} = \frac{c}{d}$, forman la diagonal ascendente.
- El producto de los medios $b \cdot c$ es idéntico al producto de los extremos $a \cdot d$.
al_terminar_debes_poder: '![Síntesis de términos medios](/static/img/nodos/identificacion-de-terminos-medios-resumen.svg)


  QUÉ: Identificar y operar con los términos medios de una proporción matemática.


  CÓMO: Localizando el segundo ($b$) y tercer ($c$) término en $a : b = c : d$, o la diagonal ascendente en $\frac{a}{b} = \frac{c}{d}$, y calculando su producto $b \cdot c$.'
fuente: Texto escolar MINEDUC — Matemática 7° Básico / 1° Medio.
