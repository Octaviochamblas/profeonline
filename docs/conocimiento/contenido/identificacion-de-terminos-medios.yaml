semantic_id: MAT.NUM.PROPORCIONES.TERMINOS_MEDIOS
resumen_inicial: 'Los términos medios de una proporción son los números situados al centro de la notación horizontal $a : b = c : d$, correspondiendo al segundo término $b$ y al tercer término $c$.'
explicacion_simple: |
  En una proporción escrita en fila como $a : b = c : d$, hay cuatro números. Los dos números que están encerrados al centro de la fila (el segundo $b$ y el tercero $c$) se llaman **términos medios**. Por ejemplo, en la proporción $3 : 5 = 6 : 10$, los medios son el 5 y el 6. En una fracción $\frac{a}{b} = \frac{c}{d}$, el consecuente de la primera ($b$) y el antecedente de la segunda ($c$) forman la pareja de medios.
explicacion_formal: |
  ### Definición formal
  En una proporción geométrica $a : b = c : d$ o $\frac{a}{b} = \frac{c}{d}$:
  - Los **términos medios** son la pareja de elementos compuesta por el consecuente de la primera razón ($b$) y el antecedente de la segunda razón ($c$):
    $$\text{Términos Medios} = \{b, c\}$$

  ### Ubicación estructural según la representación
  1. **Notación en fila $a : b = c : d$**:
     - Segundo término ($b$): Medio izquierdo.
     - Tercer término ($c$): Medio derecho.
  2. **Notación en fracción $\frac{a}{b} = \frac{c}{d}$**:
     - Denominador de la primera fracción ($b$).
     - Numerador de la segunda fracción ($c$).

  ### Rol en el Teorema Fundamental
  Los medios definen el producto de medios en la igualdad fundamental:
  $$\text{Producto de Medios} = b \cdot c$$

  ### Síntesis didáctica
  - Posición visual: El centro o interior de la igualdad $a : b = c : d$.
  - Integrantes: El 2.º y el 3.º número de la lista en orden de lectura.
definiciones_clave: |
  - **Términos medios $\{b, c\}$**: Pareja de elementos centrales que ocupan las posiciones intermedias de una proporción.
  - **Producto de medios $b \cdot c$**: Resultado multiplicativo entre el segundo y tercer término de la proporción.
  - **Segundo y tercer término**: Posición numérica correlativa asignada en la secuencia de lectura $a : b = c : d$.
propiedades_relaciones: |
  - **Igualdad con producto de extremos**: En toda proporción válida, el producto de los términos medios es idéntico al producto de los términos extremos ($b \cdot c = a \cdot d$).
  - **Permutación de medios**: Intercambiar la posición de los dos medios entre sí ($a : c = b : d$) conserva la validez de la proporción.
ejemplo_guiado:
  enunciado: 'Dada la proporción escrita en forma fraccionaria $\frac{3}{8} = \frac{9}{24}$, identifica los términos medios y calcula su producto.'
  pasos:
    - 'Paso 1: Escribimos la proporción en su notación de fila para visualizar el centro: $3 : 8 = 9 : 24$.'
    - 'Paso 2: Identificamos el segundo número escrito ($b = 8$) y el tercer número escrito ($c = 9$).'
    - 'Paso 3: Concluimos que los **términos medios son 8 y 9**.'
    - 'Paso 4: Calculamos su producto multiplicando ambos valores: $8 \cdot 9 = 72$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué elementos forman los términos medios en la proporción $a : b = c : d$?'
    choices:
      - {text: 'El segundo término $b$ y el tercer término $c$, situados en el centro interior de la expresión', is_correct: true}
      - {text: 'El primer término $a$ y el cuarto término $d$, situados en los bordes', is_correct: false}
      - {text: 'Los dos numeradores $a$ y $c$', is_correct: false}
      - {text: 'Los dos denominadores $b$ y $d$', is_correct: false}
    explanation: 'La alternativa correcta es ''El segundo término $b$ y el tercer término $c$, situados en el centro interior de la expresión''. Los medios son el 2.º y 3.º término.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuáles son los términos medios en la proporción $\frac{6}{11} = \frac{18}{33}$?'
    choices:
      - {text: '$11$ y $18$', is_correct: true}
      - {text: '$6$ y $33$', is_correct: false}
      - {text: '$6$ y $18$', is_correct: false}
      - {text: '$11$ y $33$', is_correct: false}
    explanation: 'La alternativa correcta es ''$11$ y $18$''. El denominador de la primera ($11$) y el numerador de la segunda ($18$) son los medios.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la proporción en el orden de lectura $a : b = c : d$ o $\frac{a}{b} = \frac{c}{d}$.'
  - 'Paso 2: Ubicar el segundo número escrito en la expresión ($b$).'
  - 'Paso 3: Ubicar el tercer número escrito en la expresión ($c$).'
  - 'Paso 4: Declarar al par de números $\{b, c\}$ como los términos medios.'
errores_correccion: |
  - **Error 1:** Confundir los términos medios con los términos extremos (ej: en $4 : 5 = 12 : 15$, decir que los medios son 4 y 15). **Cómo corregirlo:** Los **medios son los números del CENTRO** (5 y 12). Las puntas exteriores (4 y 15) son los extremos.
  - **Error 2:** Creer que los medios son las dos componentes de la segunda razón (ej: decir que los medios de $\frac{a}{b} = \frac{c}{d}$ son $c$ y $d$). **Cómo corregirlo:** Un medio pertenece a la **primera razón ($b$)** y el otro a la **segunda razón ($c$)**.
ejemplos:
  - titulo: 'Identificación en notación de puntos'
    enunciado: 'En la proporción $1 : 6 = 4 : 24$, ¿los términos medios son $6$ y $4$?'
    alternativas:
      - 'Sí, por estar situados al centro de la relación'
      - 'No, son 1 y 24'
      - 'No, son 1 y 4'
    respuesta: 'Sí, por estar situados al centro de la relación'
    solucion_pasos:
      - '1. Leemos en orden: 2.º es 6, 3.º es 4.'
      - '2. Concluimos que los medios son 6 y 4.'
  - titulo: 'Cálculo de producto de medios'
    enunciado: 'Para la proporción $\frac{2}{7} = \frac{6}{21}$, ¿el producto de sus medios es $7 \cdot 6 = 42$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Medios 7 y 6 $\implies 7 \cdot 6 = 42$.'
  - titulo: 'Permutación de medios'
    enunciado: 'Si los medios de $a : b = c : d$ se permutan como $a : c = b : d$, ¿el producto de medios sigue siendo $b \cdot c$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El producto conmutativo $c \cdot b = b \cdot c$.'
  - titulo: 'Medios en proporciones continuas'
    enunciado: 'En una proporción continua de la forma $a : b = b : c$, ¿ambos términos medios son iguales al mismo valor $b$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El segundo y tercer término son idénticos a $b$.'
errores_frecuentes:
  - 'Tomar los dos términos exteriores de la igualdad como si fueran los términos medios.'
  - 'Considerar los dos denominadores de la proporción como los términos medios.'
  - 'El producto de medios $b \cdot c$ equivale a la suma escalar $b + c$.'
  - 'Los términos medios deben ser obligatoriamente números enteros pares.'
  - 'En una proporción en fila se considera que la primera y tercera cantidad constituyen los medios.'
afirmaciones_verdaderas:
  - 'Los términos medios de una proporción $a : b = c : d$ son el segundo término $b$ y el tercer término $c$.'
  - 'En toda proporción geométrica verdadera, el producto de los términos medios es igual al producto de los términos extremos ($b \cdot c = a \cdot d$).'
al_terminar_debes_poder: 'Identificar los términos medios $\{b, c\}$ de cualquier proporción $a : b = c : d$ y calcular su producto $b \cdot c$.'
