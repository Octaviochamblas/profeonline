semantic_id: MAT.NUM.PROPORCIONES.TERMINOS_MEDIOS
resumen_inicial: En la proporción $a:b = c:d$ (o $\frac{a}{b} = \frac{c}{d}$), los medios
  son el segundo término $b$ y el tercer término $c$.
explicacion_simple: 'Si escribes la proporción en una sola línea ($a:b = c:d$), los **medios**
  son los números que están al centro o en el medio: el segundo ($b$) y el tercero ($c$).

  Ejemplo: En $2:5 = 6:15$, los medios son $5$ y $6$.'
explicacion_formal: En la proporción $a:b = c:d$, la pareja $(b, c)$ recibe el nombre de medios
  de la proporción, donde $b$ es el segundo término y $c$ es el tercer término.
definiciones_clave: '- **Medios ($b, c$)**: Términos central segundo y tercero de la proporción.'
propiedades_relaciones: '- **Producto de medios**: $b \cdot c$ en la propiedad fundamental.'
ejemplo_guiado:
  enunciado: Identifica los medios en la proporción $\frac{5}{9} = \frac{15}{27}$.
  pasos:
  - 'Escribir en notación continua: $5 : 9 = 15 : 27$.'
  - Localizar los números del centro ($9$ y $15$).
  - Concluir que los medios son $9$ y $15$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los medios en la proporción $4:7 = 8:14$?
  choices:
  - text: 7 y 8
    is_correct: true
  - text: 4 y 14
    is_correct: false
  - text: 4 y 8
    is_correct: false
  - text: 7 y 14
    is_correct: false
  explanation: 'La correcta es: 7 y 8. El segundo término (7) y el tercero (8) son los medios.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la proporción $\frac{2}{3} = \frac{10}{15}$, ¿cuál es el producto de los medios?
  choices:
  - text: '30'
    is_correct: true
  - text: '15'
    is_correct: false
  - text: '20'
    is_correct: false
  - text: '45'
    is_correct: false
  explanation: 'La correcta es: 30. Medios son 3 y 10 $\implies 3 \cdot 10 = 30$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir la proporción en el orden $a:b = c:d$.'
- 'Paso 2: Tomar el segundo término $b$ y el tercer término $c$.'
errores_correccion: No confundas los medios con los extremos.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuáles son los medios en $3:5 = 6:10$?
  alternativas:
  - 5 y 6
  - 3 y 10
  - 3 y 5
  respuesta: 5 y 6
  solucion_pasos:
  - Los términos centrales son 5 y 6.
- titulo: Ejemplo 2
  enunciado: ¿Cuáles son los medios en 8:6 = 12:9?
  alternativas:
  - 6 y 12
  - 8 y 9
  - 8 y 12
  respuesta: 6 y 12
  solucion_pasos:
  - El segundo y el tercer término son los medios.
- titulo: ¿Los medios de una proporción pueden ser el primero y el cuarto término?
  respuesta: 'No'
  solucion_pasos:
  - Los medios siempre son el segundo y el tercer término.
- titulo: ¿El producto de los medios puede ser distinto del producto de los extremos en una
    proporción válida?
  respuesta: 'No'
  solucion_pasos:
  - En toda proporción válida ambos productos son iguales.
errores_frecuentes:
- Confundir los medios con los extremos.
- Confundir los medios con los extremos al leer la proporción.
- Identificar los medios usando solo la fracción sin pasar a la notación continua.
- Pensar que los medios son siempre los números más pequeños de la proporción.
- Invertir el orden de los medios al escribirlos como respuesta.
afirmaciones_verdaderas:
- Los medios son el segundo y tercer término de la proporción.
- En la notación a:b = c:d, los medios son b y c, sin importar los valores numéricos que tomen.
al_terminar_debes_poder: Identificar los medios de una proporción.
fuente: Texto escolar MINEDUC.
estado: publicado
