resumen_inicial: 'En la proporción $a : b = c : d$ o $\frac{a}{b} = \frac{c}{d}$,
  los términos medios son el segundo término $b$ y el tercer término $c$.'
explicacion_simple: 'Al escribir la proporción en fila $a : b = c : d$, los términos
  medios son los dos números centrales que quedan al centro del signo igual: el segundo
  ($b$) y el tercero ($c$).'
explicacion_formal: 'Dada la proporción $a : b = c : d$, los **Términos Medios** son
  las cantidades ubicadas al centro de la expresión:


  $$\text{Medios} = \{b, c\}$$


  **En notación fraccionaria $\frac{a}{b} = \frac{c}{d}$:**

  - $b$: Denominador de la primera razón.

  - $c$: Numerador de la segunda razón.'
definiciones_clave: '- **Términos medios**: Elementos $b$ y $c$ en la proporción $a
  : b = c : d$.'
propiedades_relaciones: '- **Posiciones centrales**: Segundo y tercer término de la
  proporción.'
ejemplo_guiado:
  enunciado: En la proporción $\frac{4}{7} = \frac{8}{14}$, identifique los términos
    medios.
  pasos:
  - 'Paso 1: Escribir en notación de línea: $4 : 7 = 8 : 14$.'
  - 'Paso 2: Identificar los dos números del centro: el segundo ($7$) y el tercero
    ($8$).'
  - 'Conclusión: Los términos medios son $7$ y $8$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Cuáles son los términos medios en la proporción a : b = c : d?'
  choices:
  - text: El segundo término b y el tercer término c
    is_correct: true
  - text: El primer término a y el cuarto término d
    is_correct: false
  - text: Los dos numeradores a y c
    is_correct: false
  - text: Únicamente el resultado k
    is_correct: false
  explanation: La alternativa correcta es 'El segundo término b y el tercer término
    c'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 4/7 = 8/14, ¿cuáles son los medios?
  choices:
  - text: 7 y 8
    is_correct: true
  - text: 4 y 14
    is_correct: false
  - text: 4 y 7
    is_correct: false
  - text: 8 y 14
    is_correct: false
  explanation: La alternativa correcta me es '7 y 8'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar los términos medios
  $b$ y $c$ en cualquier proporción $\frac{a}{b} = \frac{c}{d}$.
semantic_id: MAT.NUM.PROPORCIONES.TERMINOS_MEDIOS
procedimiento:
- 'Paso 1: Identificar los términos extremos $(a, d)$ y medios $(b, c)$ en la proporción
  $a/b = c/d$.'
- 'Paso 2: Aplicar la propiedad o regla requerida (producto cruzado, cuarta/media/tercera
  proporcional o composición/descomposición).'
- 'Paso 3: Resolver algebraicamente y verificar la igualdad de las razones resultantes.'
errores_correccion: '- **Error 1: Multiplicar numeradores con numeradores en lugar
  del producto cruzado ($a \cdot c = b \cdot d$).** **Cómo corregirlo:** El producto
  cruzado combina EXTREMOS con MEDIOS ($a \cdot d = b \cdot c$).


  - **Error 2: Confundir la media proporcional con la media aritmética (promedio).**
  **Cómo corregirlo:** La media proporcional es una media GEOMÉTRICA ($x = \sqrt{ab}$),
  no un promedio sumar/dividir.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROPORCIONES.TERMINOS_MEDIOS.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las propiedades de proporciones.
- titulo: Ejemplo 2
  enunciado: Verificación de igualdad cruzada.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración por producto cruzado a · d = b · c.
- titulo: ¿Es a · d = b · c válido para toda proporción?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el Teorema Fundamental de las Proporciones.
- titulo: ¿Permite la composición mantener la equivalencia de razones?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(a+b)/b = (c+d)/d$ conserva la razón equivalente.
errores_frecuentes:
- Multiplicar los numeradores entre sí al aplicar la prueba del producto cruzado en
  una proporción.
- Declarar la posición de los términos medios con los términos extremos en una proporción
  escrita en fila.
- Calcular la media proporcional utilizando el promedio aritmético sumar y dividir
  entre dos.
- Invertir únicamente uno de los dos lados de la igualdad al aplicar la composición
  proporcional.
- Restar los términos extremos en lugar de despejar la cuarta proporcional por división.
afirmaciones_verdaderas:
- Una proporción es la igualdad entre dos razones $\frac{a}{b} = \frac{c}{d}$ que
  satisface el producto cruzado $a \cdot d = b \cdot c$.
- La media proporcional entre dos números positivos $a$ y $b$ equivale a su media
  geométrica $x = \sqrt{a \cdot b}$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
