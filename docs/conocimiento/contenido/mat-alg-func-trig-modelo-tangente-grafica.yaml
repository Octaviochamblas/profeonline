semantic_id: MAT.ALG.FUNC_TRIG_MODELO.TANGENTE_GRAFICA
resumen_inicial: 'Construcción de la gráfica de la función tangente: círculo unitario,
  amplitud, período y transformaciones de Modelamiento trigonométrico y extensiones.'
explicacion_simple: A diferencia del seno y el coseno, que son curvas onduladas acotadas,
  la tangente presenta un patrón muy distinto, con ramas que crecen sin límite.
explicacion_formal: '### Definición formal


  En cada intervalo entre dos asíntotas consecutivas (de longitud $\pi$), la función
  $f(x)=\tan(x)$ es estrictamente creciente, pasando de $-\infty$ a $+\infty$. El
  patrón se repite exactamente cada $\pi$ unidades, por lo que el periodo de la tangente
  es $\pi$, no $2\pi$.


  ### Desarrollo didáctico


  En el intervalo $(-\pi/2,\pi/2)$: $\tan(-\pi/4)=-1$, $\tan(0)=0$, $\tan(\pi/4)=1$.
  La curva pasa por el origen creciendo, y se acerca a $-\infty$ cerca de $-\pi/2$
  y a $+\infty$ cerca de $\pi/2$.'
definiciones_clave: '- **Construcción de la gráfica de la función tangente**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a construcción de la gráfica de la función tangente.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    construcción de la gráfica de la función tangente.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de construcción de la gráfica de la función tangente.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se definen analíticamente el seno y el coseno en el círculo unitario
    para construcción de la gráfica de la función tangente?
  choices:
  - text: Identificar las coordenadas (cos x, sen x) en el círculo unitario para definir
      modelamiento trigonométrico y extensiones
    is_correct: true
  - text: Como la suma de los catetos en cualquier triángulo rectángulo no unitario
    is_correct: false
  - text: Igualando la variable del ángulo a cero siempre
    is_correct: false
  - text: Multiplicando el radio por pi elevado a x
    is_correct: false
  explanation: 'La alternativa correcta es: Identificar las coordenadas (cos x, sen
    x) en el círculo unitario para definir modelamiento trigonométrico y extensiones.
    Definición canónica de las funciones trigonométricas en el círculo unitario.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se determinan el período T y la amplitud A de una función de la
    forma f(x) = A sen(Bx + C) + D en construcción de la gráfica de la función tangente?
  choices:
  - text: Calcular el período como T = 2pi / |B| y la amplitud como |A|
    is_correct: true
  - text: Sumando A + B + C + D independientemente
    is_correct: false
  - text: Igualando la amplitud a 2pi y el período a 1
    is_correct: false
  - text: Dividiendo A entre 2pi sin considerar B
    is_correct: false
  explanation: 'La alternativa correcta es: Calcular el período como T = 2pi / |B|
    y la amplitud como |A|. Fórmulas estándar para amplitud y período en funciones
    sinusoidales.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica las asíntotas verticales, ubicadas en $x=\pi/2+n\pi$.'
- 'Paso 2: Dentro de cada intervalo entre asíntotas, traza una rama creciente que
  pasa por un punto de la forma $(n\pi,0)$.'
- 'Paso 3: Repite el patrón en cada intervalo de longitud $\pi$.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en construcción de la gráfica
  de la función tangente.
ejemplos:
- titulo: Descripción de una rama de la tangente
  enunciado: Describe el comportamiento de $f(x)=\tan(x)$ en el intervalo $(-\pi/2,\pi/2)$.
  solucion_pasos:
  - La función es estrictamente creciente en todo el intervalo.
  - Pasa por $(0,0)$ y se acerca a $-\infty$ y $+\infty$ en los extremos del intervalo.
- titulo: Identificación del periodo de la tangente
  enunciado: ¿Cuál es el periodo de $f(x)=\tan(x)$?
  solucion_pasos:
  - El patrón se repite cada $\pi$ unidades, no cada $2\pi$.
  - El periodo es $\pi$.
- titulo: ¿La gráfica de la tangente está acotada, como el seno y el coseno?
  enunciado: ¿La gráfica de $f(x)=\tan(x)$ está acotada entre un valor máximo y uno
    mínimo, como el seno y el coseno?
  respuesta: 'No'
  solucion_pasos:
  - Cada rama de la tangente crece sin límite, sin un máximo ni un mínimo absoluto.
- titulo: ¿La tangente es una función creciente en cada intervalo entre asíntotas?
  enunciado: ¿La función tangente es estrictamente creciente dentro de cada intervalo
    entre dos asíntotas consecutivas?
  respuesta: Sí
  solucion_pasos:
  - Es una propiedad característica de la tangente en toda su gráfica.
errores_frecuentes:
- Confundir el periodo de la tangente ($\pi$) con el del seno o coseno ($2\pi$).
- Suponer que la tangente está acotada como el seno y el coseno.
- Trazar la curva sin marcar correctamente las asíntotas verticales.
- Suponer que la tangente decrece en algún tramo de su dominio.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_ponder: Analizar, graficar y modelar fenómenos periódicos aplicando
  construcción de la gráfica de la función tangente.
