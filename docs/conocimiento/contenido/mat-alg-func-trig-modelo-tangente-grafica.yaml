semantic_id: MAT.ALG.FUNC_TRIG_MODELO.TANGENTE_GRAFICA
resumen_inicial: 'Construcción y propiedades visuales de la gráfica de la función tangente $y = \tan(x)$ formada por ramas crecientes infinitas.'
explicacion_simple: |
  La gráfica de la función **tangente** ($y = \tan(x)$) es completamente distinta a las ondas continuas del seno o coseno. No es una onda que sube y baja entre dos techos. La gráfica de la tangente está dividida en **ramas verticales infinitas** separadas por paredes invisibles llamadas asíntotas. En el centro de cada rama ($x = 0$), la curva cruza el eje horizontal en el punto $(0,0)$. Hacia la derecha, la curva sube muy rápido buscando el infinito positivo $+\infty$; hacia la izquierda, la curva cae rápidamente hacia el infinito negativo $-\infty$.
explicacion_formal: |
  ### Definición formal
  La **gráfica de la función tangente base** es el lugar geométrico del plano cartesiano compuesto por el conjunto de puntos:
  $$\mathcal{G}_{\tan} = \left\{(x,y) \in \mathbb{R}^2 : y = \tan(x), x \neq \frac{\pi}{2} + k\pi, k \in \mathbb{Z}\right\}$$
  Se caracteriza por ser una sucesión infinita de ramas separadas, estrictamente crecientes en cada intervalo de su dominio, con puntos de inflexión en $(k\pi, 0)$ y período fundamental $T = \pi$.

  ### Desglose simbólico
  - Cero central de la rama principal: $(0,0)$.
  - Punto característico a $45^\circ$: $\left(\frac{\pi}{4}, 1\right)$.
  - Punto característico a $-45^\circ$: $\left(-\frac{\pi}{4}, -1\right)$.
  - Tendencia al acercarse a la asíntota derecha ($x \to \frac{\pi}{2}^-$): $y \to +\infty$.
  - Tendencia al acercarse a la asíntota izquierda ($x \to -\frac{\pi}{2}^+$): $y \to -\infty$.

  ### Síntesis didáctica
  Cada rama de la tangente está encajonada en una franja vertical de ancho $\pi$. Dentro de cada franja, la curva se eleva continuamente de izquierda a derecha desde $-\infty$ hasta $+\infty$.
definiciones_clave: |
  - **Rama de la tangente**: Curva suave en forma de "S" alargada que se extiende verticalmente entre dos asíntotas consecutivas.
  - **Monotonía estrictamente creciente**: Propiedad por la cual la gráfica sube de forma continua dentro de cada intervalo de su dominio.
  - **Punto de inflexión en la línea media**: Punto $(k\pi, 0)$ donde la concavidad de la curva cambia de cóncava hacia abajo a cóncava hacia arriba.
propiedades_relaciones: |
  - **Espaciamiento de ramas**: La distancia horizontal entre el centro de una rama $(0,0)$ y el centro de la siguiente $(\pi, 0)$ es exactamente el período $T = \pi$.
  - **Simetría respecto al origen**: Cada rama es simétrica con respecto a su punto central de intersección con el eje X.
ejemplo_guiado:
  enunciado: 'Describe el comportamiento de la rama principal de $y = \tan(x)$ en el intervalo abierto $\left]-\frac{\pi}{2}, \frac{\pi}{2}\right[$.'
  pasos:
    - 'Paso 1: Identificar las asíntotas límite que encajonan a la rama principal: $x = -\frac{\pi}{2}$ y $x = \frac{\pi}{2}$.'
    - 'Paso 2: Ubicar el punto central sobre el eje X: la curva pasa por el origen $(0,0)$.'
    - 'Paso 3: Analizar el comportamiento para $x > 0$: pasa por $\left(\frac{\pi}{4}, 1\right)$ y se dispara hacia $+\infty$ cuando $x \to \frac{\pi}{2}^-$.'
    - 'Paso 4: Analizar el comportamiento para $x < 0$: pasa por $\left(-\frac{\pi}{4}, -1\right)$ y cae hacia $-\infty$ cuando $x \to -\frac{\pi}{2}^+$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por cuál de los siguientes puntos interseca la rama principal de la función tangente $y = \tan(x)$ al eje cartesiano?'
    choices:
      - {text: 'Por el origen de coordenadas $(0,0)$', is_correct: true}
      - {text: 'Por el punto de coordenadas $(0,1)$', is_correct: false}
      - {text: 'Por el punto de coordenadas $\left(\frac{\pi}{2}, 0\right)$', is_correct: false}
      - {text: 'Por el punto de coordenadas $(1,0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Por el origen de coordenadas $(0,0)$''. Puesto que $\tan(0) = 0$, la curva cruza por $(0,0)$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cómo es la monotonía de la gráfica de la función tangente dentro de cada una de sus ramas continuas?'
    choices:
      - {text: 'Es estrictamente creciente de izquierda a derecha', is_correct: true}
      - {text: 'Es estrictamente decreciente de izquierda a derecha', is_correct: false}
      - {text: 'Es constante en una línea horizontal', is_correct: false}
      - {text: 'Primero sube a $1$ y luego cae a $-1$', is_correct: false}
    explanation: 'La alternativa correcta es ''Es estrictamente creciente de izquierda a derecha''. En cada rama la tangente sube sin cesar desde $-\infty$ a $+\infty$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Trazar las asíntotas verticales en $x = \frac{\pi}{2} + k\pi$.'
  - 'Paso 2: Marcar los ceros de la función en $x = k\pi$ sobre el eje X.'
  - 'Paso 3: Ubicar los puntos guía a $45^\circ$: $\left(k\pi + \frac{\pi}{4}, 1\right)$ y $\left(k\pi - \frac{\pi}{4}, -1\right)$.'
  - 'Paso 4: Trazar la curva suave en forma de "S" alargada creciente aproximándose a las asíntotas.'
errores_correccion: |
  - **Error 1:** Dibujar la gráfica de la tangente como una curva continua unida sin interrupciones. **Cómo corregirlo:** La gráfica de la tangente está dividida en infinitas ramas discontinuas separadas por asíntotas verticales.
  - **Error 2:** Dibujar las ramas de la tangente decreciendo hacia abajo a la derecha. **Cómo corregirlo:** La función tangente base $y = \tan(x)$ es estrictamente creciente; a medida que $x$ avanza a la derecha, la curva sube hacia $+\infty$.
ejemplos:
  - titulo: 'Punto a cuarenta y cinco grados'
    enunciado: '¿Cuál es el par ordenado $(x,y)$ de la tangente en $x = \frac{\pi}{4}$?'
    alternativas:
      - '$\left(\frac{\pi}{4}, 1\right)$'
      - '$\left(\frac{\pi}{4}, 0\right)$'
      - '$\left(\frac{\pi}{4}, \sqrt{3}\right)$'
    respuesta: '$\left(\frac{\pi}{4}, 1\right)$'
    solucion_pasos:
      - '1. $\tan\left(\frac{\pi}{4}\right) = 1$.'
      - '2. Pasa por $\left(\frac{\pi}{4}, 1\right)$.'
  - titulo: 'Intersección con el eje Y'
    enunciado: '¿La gráfica de $y = \tan(x)$ corta al eje Y en $y = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el punto sobre el eje Y es el origen $(0,0)$.'
  - titulo: 'Crecimiento hacia infinito'
    enunciado: '¿A medida que $x$ se aproxima a $\frac{\pi}{2}$ por la izquierda los valores de $\tan(x)$ tienden a $+\infty$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es el comportamiento asintótico vertical hacia $+\infty$.'
  - titulo: 'Ramas idénticas'
    enunciado: '¿Todas las ramas infinitas de la tangente tienen exactamente la misma forma geométrica repetida cada $\pi$ unidades?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la propiedad de periodicidad de período $T = \pi$.'
errores_frecuentes:
  - 'La afirmación de que la gráfica de la función tangente pasa por el punto $(0,1)$ sobre el eje Y.'
  - 'La afirmación de que las ramas de la función tangente son curvas decrecientes que caen hacia $-\infty$ a la derecha.'
  - 'La afirmación de que la gráfica de la tangente se conecta de forma continua cruzando por las asíntotas.'
  - 'La afirmación de que la función tangente tiene un pico máximo en $y = 1$.'
  - 'La afirmación de que la distancia entre los ceros consecutivos de la tangente es igual a $2\pi$.'
afirmaciones_verdaderas:
  - 'La gráfica de la función tangente base $y = \tan(x)$ consiste en infinitas ramas verticales crecientes separadas por asíntotas verticales en los puntos donde el coseno se anula.'
  - 'Cada rama de la función tangente interseca al eje X en el punto $(k\pi, 0)$ y se extiende desde $-\infty$ hasta $+\infty$ en un intervalo de ancho $\pi$.'
al_terminar_debes_poder: |
  QUÉ: Reconocer y construir la gráfica de la función tangente base $y = \tan(x)$.
  CÓMO: Ubicar las asíntotas verticales en $\frac{\pi}{2}+k\pi$, los ceros en $k\pi$ y trazar ramas suavemente crecientes de $-\infty$ a $+\infty$.
