semantic_id: MAT.ALG.SUMA_DIFERENCIA.REPRESENTACION_AREA
resumen_inicial: 'Interpretación geométrica del producto de suma por diferencia: fórmula,
  regla de expansión y aplicaciones en Producto de suma por diferencia.'
explicacion_simple: ¿Cómo se ve $a^2 - b^2$ geométricamente? Imagina un cuadrado grande
  al que le muerdes una esquina.
explicacion_formal: "### Definición formal\n\nAl trasladar esa pieza, se completa\
  \ el rectángulo de base $a+b$ y altura $a-b$.\n\n### Desarrollo didáctico\n\nPodemos\
  \ visualizar algebraicamente por qué $(a+b)(a-b) = a^2 - b^2$ utilizando el concepto\
  \ de áreas geométricas. \n\n1. Empecemos imaginando un cuadrado grande de lado $a$.\
  \ Su área original es $a^2$.\n2. De una esquina de este cuadrado, recortemos (quitemos)\
  \ un cuadrado más pequeño de lado $b$. El área restante es ahora exactamente **$a^2\
  \ - b^2$**.\n3. Nuestra figura sobrante tiene forma de \"L\". Si tomamos el rectángulo\
  \ vertical que forma una de las patas de la \"L\" y lo reacomodamos junto a la pata\
  \ horizontal, se forma un único rectángulo continuo.\n4. Las dimensiones de este\
  \ nuevo rectángulo serán exactamente $(a+b)$ de base y $(a-b)$ de altura. Por lo\
  \ tanto, el área de este rectángulo se calcula multiplicando su base por su altura:\
  \ $(a+b)(a-b)$.\n\nDado que el área de la \"L\" es la misma que la del nuevo rectángulo,\
  \ concluimos geométricamente que:\n**$(a+b)(a-b) = a^2 - b^2$**."
