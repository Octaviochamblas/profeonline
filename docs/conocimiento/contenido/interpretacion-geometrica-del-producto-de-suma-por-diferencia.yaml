procedimiento:
- 'Paso 1: Si te piden justificar geométricamente:'
- 'Paso 2: Dibuja el cuadrado mayor $a^2$.'
- 'Paso 3: Resta la esquina $b^2$.'
- 'Paso 4: Muestra cómo las dos franjas restantes (de anchos $a-b$) se unen.'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en interpretación geométrica del producto de suma por diferencia.
ejemplos:
- titulo: Cálculo visual numérico
  enunciado: Un terreno cuadrado de lado $10$ m pierde un área cuadrada de lado $3$
    m. ¿Qué dimensiones tendrá el rectángulo equivalente construido con el resto del
    terreno?
  solucion_pasos:
  - Lado inicial $a = 10$, lado recortado $b = 3$.
  - El rectángulo equivalente tendrá dimensiones $(10+3)$ y $(10-3)$.
  - Es decir, $13$ m por $7$ m.
  - 'Verificamos: $13 \times 7 = 91$. Y $100 - 9 = 91$.'
- titulo: Un arquitecto tiene una lámina de cartón cuadrada de lado $L$. Debe cortar
    un cuadrado en un
  enunciado: 'Un arquitecto tiene una lámina de cartón cuadrada de lado $L$. Debe
    cortar un cuadrado en una esquina de lado $x$. Para calcular el área restante,
    decide medir los lados del cartón restante y multiplicarlos usando $(L-x)(L+x)$.
    ¿Es correcto este procedimiento geométricamente?


    Opciones: A) Sí, el área restante $L^2 - x^2$ puede ser reordenada como un rectángulo
    de lados $L-x$ y $L+x$. · B) No, el área es solo $L^2 - x^2$, no se puede factorizar.
    · C) Sí, porque $(L-x)(L+x)$ es el área de un círculo. · D) No, el área sería
    $(L-x)^2$.'
  solucion_pasos:
  - Esa es justamente la justificación geométrica de la diferencia de cuadrados.
  - 'Respuesta: Sí, el área restante $L^2 - x^2$ puede ser reordenada como un rectángulo
    de lados $L-x$ y $L+x$.'
- titulo: 'Respecto de «Interpretación geométrica del producto de suma por diferencia»:
    ¿Describe adecu'
  enunciado: 'Respecto de «Interpretación geométrica del producto de suma por diferencia»:
    ¿Describe adecuadamente el concepto esta frase? «Geométricamente, $a^2 - b^2$
    representa el área de un cuadrado de lado $a$, al cual se le ha recortado un cuadrado
    menor de lado $b$ en una de sus esquinas»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Geométricamente, $a^2 - b^2$
    representa el área de un cuadrado de lado $a$, al cual se le ha recortado un cuadrado
    menor de lado $b$ en una de sus esquinas.'
- titulo: 'Respecto de «Interpretación geométrica del producto de suma por diferencia»:
    ¿Se puede acept'
  enunciado: 'Respecto de «Interpretación geométrica del producto de suma por diferencia»:
    ¿Se puede aceptar esta afirmación? «No entender que la figura en forma de ''L''
    (gnomon) y el rectángulo largo tienen exactamente la misma área, solo están reordenados»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Geométricamente, $a^2 - b^2$
    representa el área de un cuadrado de lado $a$, al cual se le ha recortado un cuadrado
    menor de lado $b$ en una de sus esquinas.'
errores_frecuentes:
- No entender que la figura en forma de 'L' (gnomon) y el rectángulo largo tienen
  exactamente la misma área, solo están reordenados.
- Para «En la representación geométrica de $a^2 - b^2$, la figura que queda tras restar
  el cuadrado $b^2$ tiene forma de 'L'. ¿Cómo se forma el rectángulo de $(a+b)(a-b)$
  a partir de esta 'L'», la respuesta correcta es Se le suma un cuadrado de $b^2$.
- Para «En la representación geométrica de $a^2 - b^2$, la figura que queda tras restar
  el cuadrado $b^2$ tiene forma de 'L'. ¿Cómo se forma el rectángulo de $(a+b)(a-b)$
  a partir de esta 'L'», la respuesta correcta es Se divide a la mitad.
- Es imposible formar un rectángulo perfecto con una L.
- $x^2 + 4$, es $4$ m$^2$ mayor.
