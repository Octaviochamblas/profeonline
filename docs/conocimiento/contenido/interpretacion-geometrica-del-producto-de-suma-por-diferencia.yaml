resumen_inicial: La representación geométrica del producto de suma por diferencia
  demuestra cómo cortar y reordenar un rectángulo de lados $(a + b)$ y $(a - b)$ genera
  la diferencia de áreas $a^2 - b^2$.
explicacion_simple: Si tienes un rectángulo de base $(a + b)$ y altura $(a - b)$,
  su área se puede visualizar tomando un cuadrado grande de lado $a$ (área $a^2$)
  y recortándole un cuadrado pequeño de lado $b$ (área $b^2$). Las piezas restantes
  se reordenan perfectamente para formar el rectángulo original.
explicacion_formal: 'Sea $\mathcal{R}$ un rectángulo de dimensiones $L_1 = a + b$
  y $L_2 = a - b$ con $a > b > 0$. El área $A$ de la región es:


  $$A = (a + b)(a - b)$$


  Por disección geométrica y conservación de superficie:

  Un cuadrado de lado $a$ tiene área $a^2$. Si se remueve una esquina cuadrada de
  lado $b$ (área $b^2$), la figura en ''L'' resultante tiene área $a^2 - b^2$.

  Al cortar la pestaña rectangular sobrante de dimensiones $b \times (a - b)$ y trasladarla
  al lado adyacente, se reconstruye exactamente el rectángulo $(a + b) \times (a -
  b)$.


  $$A = a^2 - b^2$$


  > **Complemento didáctico:** Muestra geométricamente el principio de conservación
  de área bajo transformaciones por traslación rígida de subregiones.'
definiciones_clave: '- **Disección geométrica**: Técnica de cortar una superficie
  en piezas congruentes y reensamblarlas en otra forma de igual área.

  - **Figura en L**: Región intermedia de superficie $a^2 - b^2$ obtenida al quitar
  un cuadrado menor de otro mayor.'
propiedades_relaciones: '- **Equivalencia de superficies**: Justifica geométricamente
  por qué $(a+b)(a-b)$ no posee término central al restar áreas.'
ejemplo_guiado:
  enunciado: Un terreno rectangular mide $(x + 2)$ metros de largo y $(x - 2)$ metros
    de ancho. Calcule su área total comparando un cuadrado de lado $x$ al que se le
    remueve una porción cuadrada de lado $2$.
  pasos:
  - 'Paso 1: Área del cuadrado base de lado $x$: $A_1 = x^2$.'
  - 'Paso 2: Área del cuadrado menor removido de lado $2$: $A_2 = 2^2 = 4$.'
  - 'Paso 3: Restar la porción removida al área base: $x^2 - 4$.'
  - 'Paso 4: Verificar por producto directo: $(x + 2)(x - 2) = x^2 - 4$.'
  - 'Conclusión: El área total del terreno es $(x^2 - 4)\text{ m}^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué figura geométrica base se utiliza para iniciar la disección en la
    representación de $(a + b)(a - b)$?
  choices:
  - text: Un cuadrado grande de lado $a$ al que se le resta un cuadrado de lado $b$
    is_correct: true
  - text: Dos rectángulos de dimensiones iguales
    is_correct: false
  - text: Un triángulo rectángulo de base $a+b$
    is_correct: false
  - text: Un círculo de radio $a-b$
    is_correct: false
  explanation: La alternativa correcta es 'Un cuadrado grande de lado $a$ al que se
    le resta un cuadrado de lado $b$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo del terreno de $(x + 2) \times (x - 2)$, ¿cuál es la superficie
    del cuadrado menor que se resta?
  choices:
  - text: $4\text{ m}^2$
    is_correct: true
  - text: $2\text{ m}^2$
    is_correct: false
  - text: $x^2\text{ m}^2$
    is_correct: false
  - text: $8\text{ m}^2$
    is_correct: false
  explanation: La alternativa correcta es '$4\text{ m}^2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar un cuadrado principal de lado $a$ (superficie $a^2$).'
- 'Paso 2: Cortar una esquina cuadrada de lado $b$ (superficie $b^2$).'
- 'Paso 3: Reordenar la pestaña restante para formar un rectángulo de lados $(a +
  b)$ y $(a - b)$ de área $a^2 - b^2$.'
errores_correccion: '- **Error 1: Sumar las áreas de los dos cuadrados en lugar de
  restarlas al representar $(a + b)(a - b)$.** **Cómo corregirlo:** La figura se construye
  retirando el cuadrado menor $b^2$ del cuadrado mayor $a^2$, lo que implica una RESTA
  $a^2 - b^2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Un rectángulo tiene dimensiones $(y + 5)$ y $(y - 5)$. ¿Cómo se expresa
    su superficie geométricamente?
  alternativas:
  - Como el área de un cuadrado de lado $y$ menos el área de un cuadrado de lado $5$
  - Como la suma de dos cuadrados de lado $y$ y $5$
  - Como un rectángulo de área $10y$
  respuesta: Como el área de un cuadrado de lado $y$ menos el área de un cuadrado
    de lado $5$
  solucion_pasos:
  - '1. Área total: $y^2 - 5^2 = y^2 - 25$.'
  - 2. Representa la diferencia entre el cuadrado mayor y el menor.
- titulo: Ejemplo 2
  enunciado: ¿Qué ocurre con el área si $a = b$ en el modelo geométrico de $(a + b)(a
    - b)$?
  alternativas:
  - El área es $0$, porque la altura $(a - b) = 0$
  - El área es $2a^2$
  - El área es $a^2$
  respuesta: El área es $0$, porque la altura $(a - b) = 0$
  solucion_pasos:
  - 1. Si $a = b$, $(a + a)(a - a) = (2a)(0) = 0$.
  - 2. Coincide geométricamente con $a^2 - a^2 = 0$.
- titulo: ¿Conserva la disección geométrica la superficie total al transformar la
    figura en 'L' en el rectángulo $(a + b)(a - b)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, por el principio de conservación de área bajo cortes y traslaciones rígidas.
- titulo: ¿Es el modelo geométrico de suma por diferencia idéntico al del cuadrado
    de binomio?
  respuesta: 'No'
  solucion_pasos:
  - No, el cuadrado de binomio suma regiones ($a^2 + 2ab + b^2$), mientras que este
    modelo restringe una esquina ($a^2 - b^2$).
errores_frecuentes:
- Declarar que la superficie del rectángulo $(a + b)(a - b)$ se obtiene sumando las
  dos regiones cuadradas $a^2 + b^2$.
- Declarar que la traslación de la pestaña rectangular altera el área total de la
  figura.
- La dimensión de la altura $(a - b)$ es equivalente a la longitud total de un cuadrado
  completo $a$.
- Declarar que el modelo geométrico genera dos rectángulos centrales adicionales.
- Asignar un valor negativo al área total cuando $a > b$.
afirmaciones_verdaderas:
- La disección geométrica de $(a + b)(a - b)$ demuestra la equivalencia de áreas por
  reordenamiento de piezas.
- El área del rectángulo resulta de restar la superficie del cuadrado menor $b^2$
  a la del cuadrado mayor $a^2$.
al_terminar_debes_poder: Al terminar serás capaz de explicar visualmente el producto
  de suma por diferencia mediante el corte y reordenamiento de áreas cuadradas.
