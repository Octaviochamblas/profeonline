semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.COMPLEMENTARIOS_SENO_COSENO
resumen_inicial: 'Relación entre seno y coseno de ángulos complementarios: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Dos ángulos son complementarios si su suma es 90°. En un triángulo
  rectángulo, el cateto opuesto a un ángulo agudo es el cateto adyacente al otro,
  lo que explica esta relación entre seno y coseno.
explicacion_formal: '![Seno y coseno de ángulos complementarios](/static/img/geometria/trigonometria/trigid-complementarios-seno-coseno.svg)


  ### Definición formal


  Para cualquier ángulo $x$, se cumple $\sin(90°-x)=\cos x$ y $\cos(90°-x)=\sin x$,
  ya que $90°-x$ es el ángulo complementario de $x$.


  ### Desarrollo didáctico


  En la figura, θ=30° y su complementario 90°-θ=60°. Se cumple que sin30°=cos60°=0,5
  y cos30°=sin60°=√3/2, verificando la relación de complementariedad.'
definiciones_clave: '- **Relación entre seno y coseno de ángulos complementarios**:
  Elemento o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación entre seno y coseno de ángulos complementarios.'
ejemplo_guiado:
