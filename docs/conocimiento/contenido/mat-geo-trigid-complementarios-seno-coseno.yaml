procedimiento:
- 'Paso 1: Verifica que los dos ángulos sumen 90° (sean complementarios).'
- 'Paso 2: Aplica sin(90°-x)=cosx, o de forma equivalente cos(90°-x)=sinx.'
- 'Paso 3: Usa esta relación para obtener el valor de una razón a partir de la otra,
  sin necesidad de calcularla directamente.'
