- titulo: ¿Se cumple siempre la propiedad principal de relación entre seno y coseno
    de ángulos complementarios en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede relación entre seno y coseno de ángulos complementarios asumir un
    valor negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
