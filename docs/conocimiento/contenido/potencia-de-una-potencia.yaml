semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.POTENCIA_DE_POTENCIA
resumen_inicial: 'Una potencia elevada a otro exponente $(a^m)^n$ conserva la base
  original $a$ y multiplica sus exponentes: $(a^m)^n = a^{m \cdot n}$.'
explicacion_simple: Cuando una potencia completa está encerrada entre paréntesis y
  se vuelve a elevar a otro exponente, los dos exponentes se multiplican entre sí.
  Por ejemplo, si elevamos al cuadrado y luego al cubo, multiplicamos $2 \cdot 3 =
  6$.
explicacion_formal: 'Para todo $a \in \mathbb{R}$ y exponentes $m, n \in \mathbb{R}$,
  la **Potencia de una Potencia** cumple la propiedad asociativa exponencial:


  $$\left(a^m\right)^n = a^{m \cdot n}$$


  **Demostración para $n \in \mathbb{N}$:**

  $$\left(a^m\right)^n = \underbrace{a^m \cdot a^m \dots a^m}_{n \text{ veces}} =
  a^{\underbrace{m + m + \dots + m}_{n \text{ veces}}} = a^{m \cdot n}$$


  > **Complemento didáctico:** Atención con las potencias en torre sin paréntesis
  $a^{m^n}$, las cuales se evalúan de arriba hacia abajo y NO corresponden a potencia
  de potencia.'
definiciones_clave: '- **Potencia de una potencia**: Regla $(a^m)^n = a^{m \cdot n}$
  donde la base se conserva y los exponentes se multiplican.'
propiedades_relaciones: '- **Producto de exponentes**: $(a^m)^n = a^{m \cdot n}$.'
ejemplo_guiado:
  enunciado: Simplifique la expresión $(3^2)^4$.
  pasos:
  - 'Paso 1: Identificar la base $3$ y los exponentes $m=2$ y $n=4$.'
  - 'Paso 2: Multiplicar los exponentes: $2 \cdot 4 = 8$.'
  - 'Conclusión: $(3^2)^4 = 3^8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué operación se realiza entre los exponentes en la potencia de una potencia
    (a^m)^n?
  choices:
  - text: Se conserva la base y se multiplican los exponentes (a^{m · n})
    is_correct: true
  - text: Se suman los exponentes
    is_correct: false
  - text: Se restan las bases
    is_correct: false
  - text: Se dividen los exponentes
    is_correct: false
  explanation: La alternativa correcta es 'Se conserva la base y se multiplican los
    exponentes (a^{m · n})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (3^2)^4, ¿cuál fue el resultado simplificado?
  choices:
  - text: 3^8
    is_correct: true
  - text: 3^6
    is_correct: false
  - text: 9^4
    is_correct: false
  - text: 3^{16}
    is_correct: false
  explanation: La alternativa correcta es '3^8'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Mantener la base original $a$.'
- 'Paso 2: Multiplicar los exponentes exterior e interior ($m \cdot n$).'
- 'Paso 3: Escribir la potencia simplificada $a^{m \cdot n}$.'
errores_correccion: '- **Error 1: Sumar los exponentes en lugar de multiplicarlos
  ($(2^3)^4 = 2^7$).** **Cómo corregirlo:** En potencia de potencia los exponentes
  se MULTIPLICAN ($3 \cdot 4 = 12 \implies 2^{12}$).


  - **Error 2: Confundir $(a^m)^n$ con $a^{m^n}$.** **Cómo corregirlo:** $(2^3)^2
  = 2^6 = 64$, mientras $2^{3^2} = 2^9 = 512$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifique $(x^5)^3$.
  alternativas:
  - x^{15}
  - x^8
  - x^{125}
  respuesta: x^{15}
  solucion_pasos:
  - $x^{5 \cdot 3} = x^{15}$.
- titulo: Ejemplo 2
  enunciado: Simplifique $((2^2)^3)^2$.
  alternativas:
  - 2^{12}
  - 2^7
  - 2^{16}
  respuesta: 2^{12}
  solucion_pasos:
  - $2^{2 \cdot 3 \cdot 2} = 2^{12}$.
- titulo: ¿Es (10^3)^2 igual a 10^6?
  respuesta: Sí
  solucion_pasos:
  - Sí, $3 \cdot 2 = 6$.
- titulo: ¿Se multiplican los exponentes al calcular la potencia de una potencia?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la definición de potencia de potencia.
errores_frecuentes:
- Sumar los exponentes al resolver una potencia de potencia de la forma $(a^m)^n$.
- Elevar el exponente interior a la potencia del exponente exterior como si fuera
  $a^{m^n}$.
- Multiplicar la base por los exponentes resultantes en lugar de conservarla.
- La expresión $(4^2)^3$ equivale numéricamente a $4^5$ por suma de exponentes.
- Las potencias de potencias no permiten exponentes enteros negativos.
afirmaciones_verdaderas:
- En la potencia de una potencia $(a^m)^n$ se conserva la base y se multiplican los
  exponentes ($a^{m \cdot n}$).
- La presencia del paréntesis diferencia a $(a^m)^n$ de la torre exponencial $a^{m^n}$.
al_terminar_debes_poder: Al terminar serás capaz de simplificar potencias de potencias
  $(a^m)^n = a^{m \cdot n}$, multiplicando los exponentes y conservando la base intacta.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
