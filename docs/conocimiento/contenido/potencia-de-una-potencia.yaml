semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.POTENCIA_DE_POTENCIA
resumen_inicial: 'Para elevar una potencia a otro exponente, se conserva la base y se multiplican todos los exponentes entre sí: $(a^m)^n = a^{m \cdot n}$.'
explicacion_simple: '![Potencia de una potencia](/static/img/nodos/potencia-de-una-potencia-intro.svg)


  Cuando tienes una potencia encerrada entre paréntesis y elevada a otro exponente, la base se conserva intacta y los exponentes se **multiplican**. Por ejemplo, $(2^3)^2$ significa tomar el paquete $(2^3)$ dos veces: $(2 \cdot 2 \cdot 2) \cdot (2 \cdot 2 \cdot 2) = 2^6 = 64$. Como puedes ver, $3 \cdot 2 = 6$. ¡Mucho cuidado con no sumar los exponentes por error y con no confundir $(a^m)^n$ con una torre sin paréntesis $a^{m^n}$!'
explicacion_formal: "Sean $a \\in \\mathbb{R}$ y $m, n \\in \\mathbb{R}$ (con restricciones de existencia en $\\mathbb{R}$ para bases negativas con exponentes fraccionarios). El **Teorema de Potencia de una Potencia** establece que:\n\n$$(a^m)^n = a^{m \\cdot n}$$\n\n**Demostración para $m, n \\in \\mathbb{N}$:**\n$$(a^m)^n = \\underbrace{a^m \\cdot a^m \\cdot \\dots \\cdot a^m}_{n \\text{ veces}}$$\nAplicando reiteradamente el producto de potencias de igual base:\n$$(a^m)^n = a^{\\overbrace{m + m + \\dots + m}^{n \\text{ sumandos}}} = a^{m \\cdot n}$$\n\n**Propiedades fundamentales:**\n1. **Conmutatividad de exponentes:**\n   $$(a^m)^n = (a^n)^m = a^{m \\cdot n}$$\n2. **Encadenamiento múltiple:**\n   $$\\left([(a^p)^q]\\right)^r = a^{p \\cdot q \\cdot r}$$\n3. **Diferencia crítica con la torre exponencial:**\n   $$(a^m)^n \\neq a^{m^n} \\quad \\text{(En } a^{m^n} \\text{ se evalúa primero } m^n\\text{)}$$"
definiciones_clave: '- **Potencia de una potencia**: Operación donde una expresión potencial actúa como base de un nuevo exponente.

  - **Producto de exponentes ($m \cdot n$)**: Multiplicación directa de los órdenes exponenciales.'
propiedades_relaciones: '- **Cálculo de raíces óptimo**: $(8^2)^{1/3} = (8^{1/3})^2 = 2^2 = 4$.

  - **Paridad y signos**: $[(-a)^2]^3 = (a^2)^3 = a^6$, mientras que $[(-a)^3]^2 = (-a^3)^2 = +a^6$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de potencia de una potencia](/static/img/nodos/potencia-de-una-potencia-ejemplos.svg)


    Calcule y reduzca las expresiones $(3^2)^3$, $[(2^{-1})]^{-3}$ y $(x^{2/3})^{3/4}$.'
  pasos:
  - 'Paso 1: Evaluar $(3^2)^3$: Conservar base $3$. Multiplicar exponentes: $2 \cdot 3 = 6$. Resultado: $3^6 = 729$. (Advertencia: $2 + 3 = 5$ es incorrecto).'
  - 'Paso 2: Evaluar $[(2^{-1})]^{-3}$: Conservar base $2$. Multiplicar exponentes: $(-1) \cdot (-3) = +3$. Resultado: $2^3 = 8$.'
  - 'Paso 3: Evaluar $(x^{2/3})^{3/4}$: Conservar base $x$. Multiplicar fracciones: $\frac{2}{3} \cdot \frac{3}{4} = \frac{6}{12} = \frac{1}{2}$. Resultado: $x^{1/2} = \sqrt{x}$.'
  - 'Conclusión: Los resultados son $3^6 = 729$, $2^3 = 8$ y $\sqrt{x}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de simplificar $(2^3)^2$?
  choices:
  - text: $2^6 = 64$ (multiplicando exponentes $3 \cdot 2 = 6$)
    is_correct: true
  - text: $2^5 = 32$
    is_correct: false
  - text: $2^9 = 512$
    is_correct: false
  - text: $12$
    is_correct: false
  explanation: La alternativa correcta es '$2^6 = 64$ (multiplicando exponentes $3 \cdot 2 = 6$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es la diferencia entre $(2^3)^2$ y la torre $2^{3^2}$?
  choices:
  - text: $(2^3)^2 = 2^6 = 64$, mientras que $2^{3^2} = 2^9 = 512$
    is_correct: true
  - text: Son exactamente iguales a $64$
    is_correct: false
  - text: Son exactamente iguales a $512$
    is_correct: false
  - text: La torre siempre da cero
    is_correct: false
  explanation: La alternativa correcta es '$(2^3)^2 = 2^6 = 64$, mientras que $2^{3^2} = 2^9 = 512$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base principal y los exponentes anidados separados por signos de agrupación.'
- 'Paso 2: Conservar la base y calcular el producto de todos los exponentes: $m \cdot n \cdot \dots$'
- 'Paso 3: Elevar la base al exponente final obtenido.'
errores_correccion: '- **Error 1: Sumar los exponentes (pensar que $(x^3)^4 = x^7$).** **Cómo corregirlo:** Los exponentes se MULTIPLICAN ($(x^3)^4 = x^{3 \cdot 4} = x^{12}$). La suma solo ocurre al multiplicar bases separadas ($x^3 \cdot x^4 = x^7$).

  - **Error 2: Confundir con torre exponencial ($2^{3^2}$).** **Cómo corregirlo:** En $(2^3)^2 = 2^6 = 64$. En $2^{3^2}$, primero se calcula $3^2 = 9 \implies 2^9 = 512$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $(5^2)^3$?
  alternativas:
  - $5^6 = 15625$
  - $5^5$
  - $5^8$
  respuesta: $5^6 = 15625$
  solucion_pasos:
  - $(5^2)^3 = 5^{2 \cdot 3} = 5^6 = 15625$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $[(3^{-2})]^{-1}$?
  alternativas:
  - $3^2 = 9$
  - $3^{-3}$
  - $\frac{1}{9}$
  respuesta: $3^2 = 9$
  solucion_pasos:
  - $(-2) \cdot (-1) = +2 \implies 3^2 = 9$.
- titulo: ¿Es (a⁴)⁵ igual a (a⁵)⁴?
  respuesta: Sí
  solucion_pasos:
  - Sí, $4 \cdot 5 = 20$ y $5 \cdot 4 = 20$, ambos dan $a^{20}$.
  alternativas:
  - texto: Sí, el producto de exponentes es conmutativo ($a²⁰$)
    es_correcta: true
    retroalimentacion: ¡Correcto! $(a^m)^n = (a^n)^m = a^{m \cdot n}$.
  - texto: No, el orden de los paréntesis altera el resultado
    es_correcta: false
    retroalimentacion: Incorrecto, la multiplicación es conmutativa.
  - texto: Solo si 'a' es positivo
    es_correcta: false
    retroalimentacion: Incorrecto, aplica para todo real.
- titulo: ¿Es (2²)³ igual a 2⁸?
  respuesta: 'No'
  solucion_pasos:
  - No, $(2^2)^3 = 2^{2 \cdot 3} = 2^6 = 64$, mientras que $2^8 = 256$.
  alternativas:
  - texto: No, es igual a 2⁶ = 64
    es_correcta: true
    retroalimentacion: ¡Correcto! Se multiplican $2 \cdot 3 = 6$.
  - texto: Sí, porque 2 elevado a 3 es 8
    es_correcta: false
    retroalimentacion: Incorrecto, eso sería la torre $2^{2^3}$ sin paréntesis.
  - texto: No, es igual a 2⁵
    es_correcta: false
    retroalimentacion: Incorrecto, no se suman los exponentes.
errores_frecuentes:
- Sumar exponentes en lugar de multiplicarlos ($(a^4)^3 = a^7$).
- Elevar el exponente a la potencia sin paréntesis ($2^{3^2}$ vs $(2^3)^2$).
- Olvidar multiplicar signos negativos al anidar potencias inversas.
- Elevar también la base al exponente exterior antes de multiplicar.
- Asumir que $(x+y)^n = x^n + y^n$ por confusión con propiedades potenciales.
afirmaciones_verdaderas:
- Para toda base real $a$, $(a^m)^n = a^{m \cdot n}$.
- 'La operación de potencia de potencia es conmutativa en sus exponentes: $(a^m)^n = (a^n)^m$.'
- La expresión $(a^m)^n$ no equivale sintácticamente a la torre $a^{m^n}$.
al_terminar_debes_poder: '![Síntesis de potencia de una potencia](/static/img/nodos/potencia-de-una-potencia-resumen.svg)


  QUÉ: Calcular y reducir potencias de potencias en expresiones numéricas y algebraicas.


  CÓMO: Conservando la base $a$ y multiplicando sucesivamente los exponentes ($(a^m)^n = a^{m \cdot n}$), utilizando la conmutatividad para simplificar raíces y distinguiendo el uso de paréntesis frente a torres de potencias.'
