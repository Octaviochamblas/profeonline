semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.POTENCIA_DE_POTENCIA
resumen_inicial: Para elevar una potencia a otra potencia, se conserva la base y se MULTIPLICAN
  los exponentes ($(a^m)^n = a^{m \cdot n}$).
explicacion_simple: 'Cuando tienes una potencia dentro de otra potencia separada por paréntesis,
  **multiplicas ambos exponentes**:

  $$(2^3)^2 = 2^{3 \cdot 2} = 2^6 = 64$$

  Esto ocurre porque la expresión $(2^3)^2$ significa repetir la base $(2^3)$ dos veces: $2^3
  \cdot 2^3 = 2^{3+3} = 2^6$.'
explicacion_formal: 'Para todo $a \in \mathbb{R}$ y $m, n \in \mathbb{R}$, se cumple:

  $$(a^m)^n = a^{m \cdot n}$$

  Es fundamental distinguir $(a^m)^n = a^{m \cdot n}$ de $a^{m^n}$ (donde el exponente $m$
  se eleva a la potencia $n$).'
definiciones_clave: '- **Multiplicación de exponentes**: Operación $m \cdot n$ ejecutada al
  aplicar una potencia sobre otra.'
propiedades_relaciones: '- **Conmutatividad de exponentes**: $(a^m)^n = (a^n)^m = a^{m \cdot
  n}$.'
ejemplo_guiado:
  enunciado: Simplifica la expresión $[(5^2)^3]^{-1}$.
  pasos:
  - 'Identificar la base común $a = 5$ y la cadena de tres exponentes: $2, 3, -1$.'
  - 'Multiplicar todos los exponentes en cadena: $2 \cdot 3 \cdot (-1) = -6$.'
  - 'Escribir la potencia simplificada: $5^{-6} = \frac{1}{5^6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la expresión $(x^4)^3$?
  choices:
  - text: x^{12}
    is_correct: true
  - text: x^7
    is_correct: false
  - text: x^{64}
    is_correct: false
  - text: 3x^4
    is_correct: false
  explanation: 'La correcta es: x^{12}. En potencia de una potencia los exponentes se multiplican:
    $4 \cdot 3 = 12$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $(2^2)^3$?
  choices:
  - text: '64'
    is_correct: true
  - text: '32'
    is_correct: false
  - text: '16'
    is_correct: false
  - text: '128'
    is_correct: false
  explanation: 'La correcta es: 64. Multiplicamos exponentes: $2 \cdot 3 = 6$, y $2^6 = 64$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base principal.'
- 'Paso 2: Identificar los exponentes separados por paréntesis, corchetes o llaves.'
- 'Paso 3: Multiplicar todos los exponentes entre sí.'
- 'Paso 4: Elevar la base al exponente producto resultante.'
errores_correccion: No sumes los exponentes en potencia de una potencia. $(x^3)^4$ NO es $x^{3+4}
  = x^7$, sino $x^{3 \cdot 4} = x^{12}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifica $(3^2)^4$.
  alternativas:
  - 3^8
  - 3^6
  - 3^{16}
  respuesta: 3^8
  solucion_pasos:
  - $3^{2 \cdot 4} = 3^8$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale (x^5)^2?
  alternativas:
  - x^{10}
  - x^7
  - x^{25}
  respuesta: x^{10}
  solucion_pasos:
  - 'Se multiplican los exponentes: 5·2=10.'
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de (2^3)^0?
  alternativas:
  - '1'
  - '0'
  - '8'
  respuesta: '1'
  solucion_pasos:
  - 3·0=0, entonces 2^0=1.
- titulo: ¿Es (x^2)^3 igual a x^5?
  respuesta: 'No'
  solucion_pasos:
  - 'En potencia de potencia los exponentes se multiplican, no se suman: (x^2)^3 = x^6.'
errores_frecuentes:
- Sumar los exponentes en lugar de multiplicarlos.
- Sumar los exponentes en vez de multiplicarlos al calcular una potencia de una potencia.
- Confundir (a^m)^n con a^{m^n}, que corresponde a una torre de potencias distinta.
- Olvidar aplicar la multiplicación de exponentes a cada uno de los factores dentro de un
  paréntesis con varios términos.
- Multiplicar el exponente exterior solo por uno de los exponentes en una cadena de varias
  potencias anidadas.
afirmaciones_verdaderas:
- $(a^m)^n = a^{m \cdot n}$.
- La propiedad (a^m)^n=a^{m·n} se aplica solo cuando hay una potencia elevada a otra potencia,
  no cuando se multiplican dos potencias distintas.
al_terminar_debes_poder: Simplificar expresiones con potencia de una potencia.
fuente: Texto escolar MINEDUC.
estado: publicado
