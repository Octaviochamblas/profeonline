semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.POTENCIA_DE_POTENCIA
resumen_inicial: Para elevar una potencia a otra potencia, se conserva la base y se
  MULTIPLICAN los exponentes ($(a^m)^n = a^{m \cdot n}$).
explicacion_simple: 'Cuando tienes una potencia dentro de otra potencia separada por
  paréntesis, **multiplicas ambos exponentes**:

  $$(2^3)^2 = 2^{3 \cdot 2} = 2^6 = 64$$

  Esto ocurre porque la expresión $(2^3)^2$ significa repetir la base $(2^3)$ dos
  veces: $2^3 \cdot 2^3 = 2^{3+3} = 2^6$.'
explicacion_formal: 'Para todo $a \in \mathbb{R}$ y $m, n \in \mathbb{R}$, se cumple:

  $$(a^m)^n = a^{m \cdot n}$$

  Es fundamental distinguir $(a^m)^n = a^{m \cdot n}$ de $a^{m^n}$ (donde el exponente
  $m$ se eleva a la potencia $n$).'
definiciones_clave: '- **Multiplicación de exponentes**: Operación $m \cdot n$ ejecutada
  al aplicar una potencia sobre otra.'
propiedades_relaciones: '- **Conmutatividad de exponentes**: $(a^m)^n = (a^n)^m =
  a^{m \cdot n}$.'
ejemplo_guiado:
  enunciado: Simplifica la expresión $[(5^2)^3]^{-1}$.
  pasos:
  - 'Identificar la base común $a = 5$ y la cadena de tres exponentes: $2, 3, -1$.'
  - 'Multiplicar todos los exponentes en cadena: $2 \cdot 3 \cdot (-1) = -6$.'
  - 'Escribir la potencia simplificada: $5^{-6} = \frac{1}{5^6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué equivale la expresión $(x^4)^3$?
  choices:
  - text: x^{12}
    is_correct: true
  - text: x^7
    is_correct: false
  - text: x^{64}
    is_correct: false
  - text: 3x^4
    is_correct: false
  explanation: 'La correcta es: x^{12}. En potencia de una potencia los exponentes
    se multiplican: $4 \cdot 3 = 12$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de $(2^2)^3$?
  choices:
  - text: '64'
    is_correct: true
  - text: '32'
    is_correct: false
  - text: '16'
    is_correct: false
  - text: '128'
    is_correct: false
  explanation: 'La correcta es: 64. Multiplicamos exponentes: $2 \cdot 3 = 6$, y $2^6
    = 64$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la base principal.'
- 'Paso 2: Identificar los exponentes separados por paréntesis, corchetes o llaves.'
- 'Paso 3: Multiplicar todos los exponentes entre sí.'
- 'Paso 4: Elevar la base al exponente producto resultante.'
errores_correccion: No sumes los exponentes en potencia de una potencia. $(x^3)^4$
  NO es $x^{3+4} = x^7$, sino $x^{3 \cdot 4} = x^{12}$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifica $(3^2)^4$.
  alternativas:
  - 3^8
  - 3^6
  - 3^{16}
  respuesta: 3^8
  solucion_pasos:
  - $3^{2 \cdot 4} = 3^8$.
errores_frecuentes:
- Sumar los exponentes en lugar de multiplicarlos.
afirmaciones_verdaderas:
- $(a^m)^n = a^{m \cdot n}$.
al_terminar_debes_poder: Simplificar expresiones con potencia de una potencia.
fuente: Texto escolar MINEDUC.
estado: publicado
