semantic_id: MAT.GEO.BISECTRIZ_INCENTRO.RADIO_INSCRITO_DISTANCIA_LADOS
resumen_inicial: 'Radio de la circunferencia inscrita como distancia del incentro
  a los lados: conceptos, teoremas, propiedades geométricas y cálculo en Elementos
  Secundarios del Triángulo.'
explicacion_simple: 'El radio de la circunferencia inscrita no solo se define geométricamente
  como distancia del incentro a los lados: también puede calcularse numéricamente
  a partir del área y el semiperímetro del triángulo.'
explicacion_formal: '![Radio inscrito como distancia del incentro a los lados](/static/img/geometria/elementos-secundarios/bisectriz-incentro-radio-inscrito-distancia-lados.svg)


  ### Definición formal


  Si un triángulo tiene área $A$ y semiperímetro $s=\frac{a+b+c}{2}$, su radio inscrito
  es $r=\frac{A}{s}$.


  ### Desarrollo didáctico


  Un triángulo de lados 3, 4 y 5 tiene semiperímetro $s=\frac{3+4+5}{2}=6$ y área
  $A=\frac{3\cdot4}{2}=6$ (es rectángulo); su radio inscrito es $r=\frac{6}{6}=1$.'
