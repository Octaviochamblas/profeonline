semantic_id: MAT.GEO.AREAS_TRIANGULOS.SEMIPERIM
resumen_inicial: 'El semiperímetro $s$ es la mitad del perímetro total de un triángulo: $s = \frac{a+b+c}{2}$. Es la variable clave para usar la fórmula de Herón.'
explicacion_simple: |
  ![Semiperímetro del Triángulo: s = (a + b + c) / 2](/static/img/nodos/calculo-del-semiperimetro-de-un-triangulo-s-a-b-c-2-intro.svg)

  Sumas los tres lados del triángulo y divides el total en 2.
explicacion_formal: |
  ### Definición formal
  En un triángulo $\Delta ABC$ con lados de longitudes $a, b, c \in \mathbb{R}^+$, se define el **semiperímetro** $s$ como la mitad del perímetro euclidiano total $P$:

  $$s = \frac{P}{2} = \frac{a + b + c}{2}$$

  ### Desglose simbólico y geométrico
  - $a, b, c$: Longitudes métricas escalares de los tres lados.
  - Factores de exceso métrico: $(s - a) = \frac{b+c-a}{2} > 0$, $(s - b) = \frac{a+c-b}{2} > 0$, $(s - c) = \frac{a+b-c}{2} > 0$ por la Desigualdad Triangular.
  - Relación con el inradio: $\operatorname{Área}(\Delta ABC) = r \cdot s \implies r = \frac{A}{s}$.

  ### Síntesis didáctica
  El semiperímetro actúa como el pivote algebraico que conecta el perímetro con el área en la fórmula de Herón y la geometría del incírculo.
definiciones_clave: |
  - **Área**: Medida bidimensional de la superficie encerrada por un polígono o curva cerrada.
  - **Base ($b$)**: Lado de referencia sobre el cual se mide la altura perpendicular.
  - **Altura ($h$)**: Distancia ortogonal más corta entre el vértice y la recta que contiene a la base.
propiedades_relaciones: |
  - **Invarianza**: El área de una figura es la misma sin importar el método o base utilizada.
  - **Aditividad**: El área de una región compuesta es la suma de las áreas de sus partes disjuntas.
  - **Unidades cuadradas**: Toda área se expresa en unidades de longitud elevadas al cuadrado ($[L]^2$).
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Semiperímetro del Triángulo: s = (a + b + c) / 2](/static/img/nodos/calculo-del-semiperimetro-de-un-triangulo-s-a-b-c-2-ejemplos.svg)

    Aplica el procedimiento geométrico para resolver y verificar el cálculo del área correspondiente a este concepto.
  pasos:
  - 'Paso 1: Identificar las magnitudes lineales dadas y verificar que compartan la misma unidad de medida.'
  - 'Paso 2: Seleccionar la fórmula geométrica adecuada según los datos disponibles.'
  - 'Paso 3: Sustituir los valores numéricos en la expresión algebraica.'
  - 'Paso 4: Realizar las operaciones aritméticas y simplificar el resultado.'
  - 'Paso 5: Registrar el resultado final acompañado de sus unidades cuadradas ($[L]^2$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula el semiperímetro s de un triángulo de lados a, b y c?
  choices:
  - text: $s = \frac{a + b + c}{2}$
    is_correct: true
  - text: Opción incorrecta de prueba A
    is_correct: false
  - text: Opción incorrecta de prueba B
    is_correct: false
  - text: Opción incorrecta de prueba C
    is_correct: false
  explanation: 'El semiperímetro se calcula sumando los tres lados y dividiendo por 2: $s = \frac{a + b + c}{2}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los lados de un triángulo miden 7 cm, 8 cm y 9 cm, ¿cuál es su semiperímetro?
  choices:
  - text: $12\text{ cm}$
    is_correct: true
  - text: $10\text{ cm}^2$
    is_correct: false
  - text: $100\text{ cm}^2$
    is_correct: false
  - text: $5\text{ cm}^2$
    is_correct: false
  explanation: 'El semiperímetro es $12\text{ cm}$, ya que $s = \frac{7 + 8 + 9}{2} = \frac{24}{2} = 12\text{ cm}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos geométricos disponibles (base y altura, tres lados, dos lados y ángulo, o coordenadas).'
- 'Paso 2: Seleccionar la fórmula correspondiente ($b h / 2$, Herón, trigonométrica o determinante).'
- 'Paso 3: Homogeneizar todas las unidades de longitud a la misma escala métrica.'
- 'Paso 4: Evaluar algebraicamente la fórmula y simplificar radicales o fracciones.'
- 'Paso 5: Expresar la respuesta con su unidad de superficie al cuadrado.'
errores_correccion: 'Verifica siempre que la altura utilizada sea perpendicular a la base elegida y no olvides dividir por 2 en las fórmulas de área triangular.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de aplicar la fórmula de área correspondiente con los datos dados?
  alternativas:
  - '$12\text{ cm}$'
  - 'Valor alternativo incorrecto 1'
  - 'Valor alternativo incorrecto 2'
  respuesta: '$12\text{ cm}$'
  solucion_pasos:
  - 'El semiperímetro es $12\text{ cm}$, ya que $s = \frac{7 + 8 + 9}{2} = \frac{24}{2} = 12\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: ¿El área de un triángulo se expresa en unidades lineales simples (como cm o m) o en unidades cuadradas (como cm² o m²)?
  alternativas:
  - En unidades cuadradas (como cm² o m²)
  - En unidades lineales simples
  - En unidades cúbicas
  respuesta: En unidades cuadradas (como cm² o m²)
  solucion_pasos:
  - 'El área es una magnitud bidimensional que se mide siempre en unidades cuadradas.'
- titulo: ¿El área de un triángulo depende de la base que se elija?
  respuesta: 'No'
  solucion_pasos:
  - 'No, el área es invariante: cualquier par de base y su altura homóloga entrega exactamente la misma área.'
- titulo: ¿Dos triángulos con igual base y altura tienen la misma área aunque tengan formas diferentes?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, porque $A = (b \cdot h)/2$, dependiendo únicamente de las magnitudes numéricas de la base y la altura.'
errores_frecuentes:
- 'Olvidar dividir por 2 al calcular el área de un triángulo ($b \times h$).'
- 'Multiplicar bases y alturas que no son perpendiculares entre sí.'
- 'Mezclar unidades métricas sin convertir previamente (ej: sumar cm con metros).'
- 'Confundir el perímetro (longitud del contorno) con el área (superficie encerrada).'
- 'Olvidar el valor absoluto en la fórmula de Gauss por coordenadas.'
afirmaciones_verdaderas:
- 'El área de un triángulo es igual al semiproducto de la base por su altura relativa ($A = \frac{b \cdot h}{2}$).'
- 'El área es una magnitud escalar bidimensional estrictamente no negativa.'
al_terminar_debes_poder: |
  **QUÉ:** Calcular y analizar el área de triángulos y regiones poligonales mediante diversas fórmulas geométricas y analíticas.

  **CÓMO:** Aplicando las fórmulas $A = \frac{bh}{2}$, $A = \frac{L^2\sqrt{3}}{4}$, Herón $A = \sqrt{s(s-a)(s-b)(s-c)}$, $A = \frac{1}{2}ab\sin\gamma$ y determinante cartesiano.

  ![Resumen de Áreas de Triángulos](/static/img/nodos/calculo-del-semiperimetro-de-un-triangulo-s-a-b-c-2-resumen.svg)
