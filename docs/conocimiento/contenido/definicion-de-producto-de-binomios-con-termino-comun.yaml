semantic_id: MAT.ALG.TERMINO_COMUN.DEFINICION
resumen_inicial: 'Definición de producto de binomios con término común: fórmula, regla
  de expansión y aplicaciones en Producto de binomios con término común.'
explicacion_simple: 'Ya vimos qué pasa si multiplicamos dos binomios iguales (cuadrado)
  y dos conjugados. ¿Qué pasa si comparten solo la mitad de la estructura? Por ejemplo:
  $(x+5)(x+3)$.'
explicacion_formal: "### Definición formal\n\nComo su nombre indica, comparten solo\
  \ un término (ej: la variable) mientras que los números libres varían.\n\n### Desarrollo\
  \ didáctico\n\nEl producto de dos binomios con un término en común ocurre cuando\
  \ multiplicamos dos expresiones que comparten exactamente un sumando idéntico, pero\
  \ el otro sumando es diferente. \n\nSu estructura general se representa como: **$(x+a)(x+b)$**\n\
  Aquí, ''$x$'' representa el término que se repite en ambos paréntesis (el término\
  \ común), mientras que ''$a$'' y ''$b$'' son términos distintos (los términos no\
  \ comunes).\n\n**¿De dónde sale la regla?**\nSi multiplicamos $(x+a)(x+b)$ usando\
  \ distributividad completa, tenemos:\n$x(x) + x(b) + a(x) + a(b)$\n$= x^2 + bx +\
  \ ax + ab$\n\nSi agrupamos los dos términos centrales (que contienen la variable\
  \ $x$) factorizando esa $x$, obtenemos:\n$= x^2 + (a+b)x + ab$\n\nEsta estructura\
  \ es el origen del **Trinomio de la forma $x^2 + px + q$**, que es fundamental para\
  \ factorizar más adelante."
definiciones_clave: '- **Definición de producto de binomios con término común**: Producto
  notable con estructura fija de desarrollo directo.'
propiedades_relaciones: '- **Reglas de expansión**: Fórmulas de productos notables
