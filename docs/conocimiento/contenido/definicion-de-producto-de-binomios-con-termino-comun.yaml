resumen_inicial: El producto de binomios con término común $(x + a)(x + b)$ es la
  multiplicación de dos binomios que comparten una misma variable o término $x$, equivalente
  a $x^2 + (a + b)x + ab$.
explicacion_simple: 'Cuando multiplicas dos binomios que empiezan por la misma variable
  como $(x + 3)(x + 5)$, obtendrás un trinomio de tres partes: el cuadrado del término
  común ($x^2$), la suma de los números multiplicada por la variable ($(3 + 5)x =
  8x$), y el producto de los dos números ($3 \cdot 5 = 15$). El resultado es $x^2
  + 8x + 15$.'
explicacion_formal: 'Para cualquier término común $x \in \mathbb{R}$ y constantes
  no comunes $a, b \in \mathbb{R}$, el **Producto de Binomios con Término Común**
  $(x + a)(x + b)$ se define como la expansión trinómica cuadrática de Stevin:


  $$(x + a)(x + b) = x^2 + bx + ax + ab = x^2 + (a + b)x + ab$$


  **Desglose simbólico:**

  - $x^2$: Cuadrado del término común $x$.

  - $(a + b)x$: Término lineal cuyo coeficiente es la suma algebraica de los términos
  no comunes $(a + b)$.

  - $ab$: Término independiente resultante del producto de los términos no comunes
  $a \cdot b$.


  > **Complemento didáctico:** Esta identidad conecta la suma y el producto de las
  raíces en ecuaciones cuadráticas $x^2 + Sx + P = 0$, donde $S = a+b$ y $P = ab$.'
definiciones_clave: '- **Término común ($x$)**: Elemento idéntico presente en ambos
  binomios multiplicados.

  - **Términos no comunes ($a, b$)**: Constantes numéricas o algebraicas que acompañan
  al término común.'
propiedades_relaciones: '- **Estructura $x^2 + Sx + P$**: La forma expandida presenta
  la suma $S = a+b$ en el término lineal y el producto $P = ab$ en el término independiente.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(x + 4)(x + 2)$ aplicando la definición de producto
    de binomios con término común.
  pasos:
  - 'Paso 1: Identificar el término común $x$, y los términos no comunes $a = 4$ y
    $b = 2$.'
  - 'Paso 2: Calcular el cuadrado del término común: $x^2$.'
  - 'Paso 3: Sumar los términos no comunes y multiplicar por $x$: $(4 + 2)x = 6x$.'
  - 'Paso 4: Multiplicar los términos no comunes entre sí: $4 \cdot 2 = 8$.'
  - 'Paso 5: Ensamblar los tres términos: $x^2 + 6x + 8$.'
  - 'Conclusión: El desarrollo final es $x^2 + 6x + 8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión algebraica equivalente al desarrollo de $(x + a)(x
    + b)$?
  choices:
  - text: $x^2 + (a + b)x + ab$
    is_correct: true
  - text: $x^2 + abx + (a + b)$
    is_correct: false
  - text: $x^2 + a^2 + b^2$
    is_correct: false
  - text: $2x + a + b$
    is_correct: false
  explanation: La alternativa correcta es '$x^2 + (a + b)x + ab$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $(x + 4)(x + 2)$, ¿cuál fue el coeficiente obtenido
    para el término lineal en $x$?
  choices:
  - text: $6$, resultante de la suma $4 + 2$
    is_correct: true
  - text: $8$, resultante del producto $4 \cdot 2$
    is_correct: false
  - text: $4$
    is_correct: false
  - text: $2$
    is_correct: false
  explanation: La alternativa correcta es '$6$, resultante de la suma $4 + 2$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar al cuadrado el término común $x \to x^2$.'
- 'Paso 2: Sumar los términos no comunes $(a + b)$ y multiplicar por $x \to (a + b)x$.'
- 'Paso 3: Multiplicar los términos no comunes $a \cdot b \to ab$ y sumar los tres
  componentes.'
errores_correccion: '- **Error 1: Multiplicar los términos no comunes en lugar de
  sumarlos para obtener el coeficiente lineal.** **Cómo corregirlo:** El coeficiente
  central es la SUMA $(a + b)$, mientras que el producto $ab$ corresponde al último
  término.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle el producto $(m + 6)(m + 3)$.
  alternativas:
  - $m^2 + 9m + 18$
  - $m^2 + 18m + 9$
  - $m^2 + 9m + 9$
  respuesta: $m^2 + 9m + 18$
  solucion_pasos:
  - '1. Término común al cuadrado: $m^2$.'
  - '2. Suma no comunes: $(6 + 3)m = 9m$.'
  - '3. Producto no comunes: $6 \cdot 3 = 18$. Resultado: $m^2 + 9m + 18$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(y + 1)(y + 7)$?
  alternativas:
  - $y^2 + 8y + 7$
  - $y^2 + 7y + 8$
  - $y^2 + 8y + 8$
  respuesta: $y^2 + 8y + 7$
  solucion_pasos:
  - 1. $y^2$.
  - 2. $(1 + 7)y = 8y$.
  - '3. $1 \cdot 7 = 7$. Resultado: $y^2 + 8y + 7$.'
- titulo: ¿Es la expresión $x^2 + 10x + 21$ el desarrollo correcto de $(x + 7)(x +
    3)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $7 + 3 = 10$ y $7 \cdot 3 = 21$, dando $x^2 + 10x + 21$.
- titulo: ¿El término independiente en $(x + a)(x + b)$ es igual a la suma $a + b$?
  respuesta: 'No'
  solucion_pasos:
  - No, el término independiente es el producto $ab$; la suma $a + b$ multiplica a
    $x$.
errores_frecuentes:
- El coeficiente del término lineal en $(x + a)(x + b)$ equivale al producto $ab$
  en lugar de la suma $a + b$.
- Declarar que $(x + 3)(x + 5)$ es igual a $x^2 + 15$ omitiendo el término lineal
  $8x$.
- Multiplicar la variable común $x$ por sí misma obteniendo $2x$ en lugar de $x^2$.
- Declarar que el desarrollo de binomios con término común resulta en un binomio.
- Asignar exponente cuadrático a los términos no comunes al expandir el producto.
afirmaciones_verdaderas:
- El desarrollo de binomios con término común forma un trinomio de la forma $x^2 +
  Sx + P$.
- El coeficiente del término central es la suma algebraica de las constantes no comunes.
al_terminar_debes_poder: Al terminar serás capaz de expandir cualquier producto de
  binomios con término común $(x + a)(x + b)$ aplicando la regla $x^2 + (a + b)x +
  ab$.
