semantic_id: MAT.ALG.TERMINO_COMUN.DEFINICION
resumen_inicial: 'La definición de producto de binomios con término común establece que multiplicar $(x+a)(x+b)$ equivale al trinomio $x^2 + (a+b)x + ab$, donde el coeficiente lineal es la suma de los términos no comunes y la constante es su producto.'
explicacion_simple: |
  El **producto de binomios con término común** $(x + a)(x + b)$ es una regla rápida para multiplicar dos binomios que comparten la misma variable inicial:
  - **FÓRMULA ALGORÍTMICA**:
    $$(x + a)(x + b) = \mathbf{x^2 + (a + b)x + ab}$$
  - **Traducción en tres términos del resultado**:
    1. **Cuadrado del término común**: $x^2$.
    2. **SUMA de los no comunes por el término común**: $(a + b)x$.
    3. **PRODUCTO de los no comunes**: $+a \cdot b$.
  - **Ejemplo**: $(x + 3) \cdot (x + 5)$:
    - Cuadrado del común: $x^2$.
    - Suma de no comunes por el común: $(3 + 5)x = \mathbf{+8x}$.
    - Producto de no comunes: $3 \cdot 5 = \mathbf{+15}$.
    - Resultado expandido: **$x^2 + 8x + 15$**.
explicacion_formal: |
  ### Definición formal
  Sean $x \in \mathbb{R}[t]$ un monomio mónico y $a, b \in \mathbb{R}$ dos términos escalares constantes (términos no comunes). Se define el **producto de binomios con término común** como la expansión distributiva reducida sobre el espacio cuadrático:

  $$(x + a)(x + b) = x \cdot x + x \cdot b + a \cdot x + a \cdot b = x^2 + (a + b)x + ab$$

  ### Relación entre Coeficientes y Raíces (Teorema de Vieta)
  El trinomio mónico resultante $P(x) = x^2 + S x + P$ posee:
  - Coeficiente del término lineal $S = a + b$ igual a la suma algebraica de los términos no comunes.
  - Término independiente $P = a \cdot b$ igual al producto numérico de los términos no comunes.

  Las raíces del polinomio $P(x) = 0$ son exactamente $x_1 = -a$ y $x_2 = -b$.

  ### Síntesis didáctica
  Este producto notable conecta directamente la multiplicación de binomios con la factorización de trinomios cuadráticos mónicos de la forma $x^2 + Sx + P$.
definiciones_clave: |
  - **Término común ($x$)**: Variable o monomio idéntico presente como primer sumando en ambos binomios.
  - **Términos no comunes ($a, b$)**: Valores numéricos o expresiones algebraicas distintas presentes como segundos sumandos en cada binomio.
  - **Trinomio cuadrático mónico ($x^2 + Sx + P$)**: Polinomio de grado 2 con coeficiente principal 1 generado por el producto.
propiedades_relaciones: |
  - **Generalización de otros productos notables**:
    - Si $a = b$, se convierte en el cuadrado de binomio $(x+a)^2 = x^2 + 2ax + a^2$.
    - Si $a = -b$, se convierte en la suma por diferencia $(x+a)(x-a) = x^2 - a^2$.
ejemplo_guiado:
  enunciado: 'Aplica la definición de producto de binomios con término común para expandir $(m + 4) \cdot (m + 6)$.'
  pasos:
    - 'Paso 1: Identificamos el término común $x = m$ y los términos no comunes $a = 4$ y $b = 6$.'
    - 'Paso 2: Calculamos el cuadrado del término común:
       m^2 = \mathbf{m^2}$.'
    - 'Paso 3: Calculamos la suma de los términos no comunes multiplicada por el común:
       (4 + 6)m = 10m = \mathbf{+10m}$.'
    - 'Paso 4: Calculamos el producto de los términos no comunes:
       4 \cdot 6 = \mathbf{+24}$.'
    - 'Paso 5: Consolidamos el trinomio: $m^2 + 10m + 24$.'
    - 'Conclusión: La expansión completa es **$m^2 + 10m + 24$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la fórmula del producto de binomios con término común $(x+a)(x+b) = x^2 + (a+b)x + ab$, ¿cómo se obtiene el coeficiente del término lineal $x$?'
    choices:
      - {text: 'Sumando algebraicamente los dos términos no comunes ($a + b$)', is_correct: true}
      - {text: 'Multiplicando los dos términos no comunes ($a \cdot b$)', is_correct: false}
      - {text: 'Restando los dos términos no comunes ($a - b$)', is_correct: false}
      - {text: 'Elevando al cuadrado los términos no comunes', is_correct: false}
    explanation: 'La alternativa correcta es ''Sumando algebraicamente los dos términos no comunes ($a + b$)''. Coeficiente lineal $S = a + b$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el trinomio resultante de expandir $(x + 2) \cdot (x + 7)$?'
    choices:
      - {text: 'El resultado es $x^2 + 9x + 14$, calculando $x^2$, la suma $(2+7)x = 9x$ y el producto $2 \cdot 7 = 14$', is_correct: true}
      - {text: 'El resultado es $x^2 + 14x + 9$', is_correct: false}
      - {text: 'El resultado es $x^2 + 14$', is_correct: false}
      - {text: 'El resultado es $x^2 + 9x + 9$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $x^2 + 9x + 14$, calculando $x^2$, la suma $(2+7)x = 9x$ y el producto $2 \cdot 7 = 14$''. $x^2 + (2+7)x + (2 \cdot 7) = x^2 + 9x + 14$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el término común ($x$) y los términos no comunes ($a$ y $b$).'
  - 'Paso 2: Elevar el término común al cuadrado ($x^2$).'
  - 'Paso 3: Sumar algebraicamente los términos no comunes y multiplicar el resultado por el término común ($(a+b)x$).'
  - 'Paso 4: Multiplicar los términos no comunes ($ab$) y escribir el trinomio $x^2 + (a+b)x + ab$.'
errores_correccion: |
  - **Error 1:** Multiplicar los términos no comunes para el coeficiente central en lugar de sumarlos (escribir $(x+3)(x+4) = x^2 + 12x + 12$). **Cómo corregirlo:** El coeficiente central **ES LA SUMA DE LOS NO COMUNES ($3+4=7 \implies 7x$)**.
  - **Error 2:** Sumar los términos no comunes para el término constante en lugar de multiplicarlos (escribir $(x+3)(x+4) = x^2 + 7x + 7$). **Cómo corregirlo:** El término constante **ES EL PRODUCTO DE LOS NO COMUNES ($3 \cdot 4 = 12$)**.
ejemplos:
  - titulo: 'Término común básico'
    enunciado: '¿Cuál es el trinomio resultante de $(x + 1) \cdot (x + 8)$?'
    alternativas:
      - '$x^2 + 9x + 8$'
      - '$x^2 + 8x + 9$'
      - '$x^2 + 9$'
    respuesta: '$x^2 + 9x + 8$'
    solucion_pasos:
      - '1. $x^2$.'
      - '2. Suma no comunes: $(1+8)x = 9x$.'
      - '3. Producto no comunes: $1 \cdot 8 = 8$.'
      - '4. Resultado: $x^2 + 9x + 8$.'
  - titulo: 'Término común con variable m'
    enunciado: '¿Cuál es el desarrollo de $(a + 5) \cdot (a + 2)$?'
    alternativas:
      - '$a^2 + 7a + 10$'
      - '$a^2 + 10a + 7$'
      - '$a^2 + 10$'
    respuesta: '$a^2 + 7a + 10$'
    solucion_pasos:
      - '1. $a^2 + (5+2)a + (5 \cdot 2) = a^2 + 7a + 10$.'
  - titulo: 'Relación con cuadrado de binomio'
    enunciado: 'Si los no comunes son iguales ($a=b$), ¿coincide la fórmula $x^2 + (a+a)x + a^2$ con el cuadrado de binomio?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, produce $x^2 + 2ax + a^2$.'
  - titulo: 'Trinomio mónico'
    enunciado: 'En el producto $(x+a)(x+b)$, ¿es siempre $1$ el coeficiente principal de $x^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, porque $x \cdot x = 1x^2$.'
