  enunciado: 'Respecto de «Definición de producto de binomios con término común»:
    ¿Se ajusta a la definición esta afirmación? «Un par de binomios con un ''término
    común'' tienen la forma $(x+a)(x+b)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Un par de binomios con un ''término
    común'' tienen la forma $(x+a)(x+b)$.'
- titulo: 'Respecto de «Definición de producto de binomios con término común»: ¿Es
    compatible con el pr'
  enunciado: 'Respecto de «Definición de producto de binomios con término común»:
    ¿Es compatible con el procedimiento esta afirmación? «Creer que $(x+a)(x+b) =
    x^2 + ab$, ignorando por completo la suma cruzada $(a+b)x$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Un par de binomios con un ''término
