procedimiento:
- 'Paso 1: Para reconocer este producto notable:'
- 'Paso 2: Revisa el primer término de ambos binomios. ¿Son idénticos? Ese es el término
  común.'
- 'Paso 3: Revisa los segundos términos. ¿Son diferentes numéricamente? Esos son los
  no comunes.'
- 'Paso 4: Entiende que el desarrollo ordenará los términos según las potencias del
  término común.'
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en definición de producto de binomios con término común.
ejemplos:
- titulo: Identificando las partes
  enunciado: En el producto $(y - 4)(y + 7)$, identifica el término común y los no
    comunes.
  solucion_pasos:
  - El término común es $y$.
  - Los términos no comunes son $-4$ y $+7$.
- titulo: Si el término libre (independiente) de $(x+k)(x-5)$ es $-40$, ¿cuál es el
    coeficiente de $x$
  enunciado: 'Si el término libre (independiente) de $(x+k)(x-5)$ es $-40$, ¿cuál
    es el coeficiente de $x$ en el resultado?


    Opciones: A) $3$ · B) $8$ · C) $-13$ · D) $13$'
  solucion_pasos:
  - 'Producto libres: $k(-5) = -40 \Rightarrow k=8$. Suma de libres (coef. lineal):
    $8 + (-5) = 3$.'
  - 'Respuesta: $3$'
