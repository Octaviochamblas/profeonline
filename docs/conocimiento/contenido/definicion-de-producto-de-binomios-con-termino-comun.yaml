errores_frecuentes:
- Creer que $(x+a)(x+b) = x^2 + ab$, ignorando por completo la suma cruzada $(a+b)x$.
- Para «¿Qué caracteriza a un producto de binomios con un término común», la respuesta
  correcta es Ambos binomios son iguales.
- Tienen los mismos términos con signo distinto.
- Tienen una variable en común pero coeficientes diferentes.
- De multiplicar los términos no comunes.
afirmaciones_verdaderas:
- Los productos notables permiten obtener desarrollos algebraicos sin multiplicar
  término a término.
