semantic_id: MAT.ALG.CUADRADO_BINOMIO.DIFERENCIA_DEFINICION
resumen_inicial: 'La definición de cuadrado de binomio diferencia establece que elevar al cuadrado la resta de dos términos $(a-b)^2$ equivale al producto $(a-b)(a-b)$, resultando en el trinomio $a^2 - 2ab + b^2$.'
explicacion_simple: |
  El **cuadrado de binomio diferencia** $(a - b)^2$ representa la multiplicación de una resta por sí misma:
  - **Identidad**: $(a - b)^2 = (a - b) \cdot (a - b)$.
  - **Fórmula directa (Trinomio Cuadrado Perfecto con resta)**:
    $$(a - b)^2 = \mathbf{a^2 - 2ab + b^2}$$
  - **Traducción en tres pasos sencillos**:
    1. **El primer término al cuadrado**: $a^2$.
    2. **MENOS el doble del primero por el segundo**: $\mathbf{-2ab}$.
    3. **MÁS el segundo término al cuadrado**: $\mathbf{+b^2}$ (¡Atención: este último SIEMPRE es positivo!).
  - **Ejemplo**: $(x - 4)^2$:
    - Primer término al cuadrado: $x^2$.
    - Menos el doble del primero por el segundo: $-2 \cdot x \cdot 4 = \mathbf{-8x}$.
    - Segundo término al cuadrado: $(-4)^2 = \mathbf{+16}$.
    - Resultado expandido: **$x^2 - 8x + 16$**.
explicacion_formal: |
  ### Definición formal
  Sea la diferencia algebraica $(a - b) \in \mathbb{R}[x,y]$. Se define el **cuadrado de binomio diferencia** como la potencia cuadrática de la resta binaria:

  $$(a - b)^2 = (a - b)(a - b) = a(a - b) - b(a - b) = a^2 - ab - ba + (-b)^2$$

  Por la regla de signos $(-b)(-b) = +b^2$ y la conmutatividad aditiva de los términos negativos $(-ab - ba = -2ab)$, se obtiene la estructura canónica:

  $$(a - b)^2 = a^2 - 2ab + b^2$$

  ### Positividad Estricta del Último Término
  Independientemente de la signatura de la resta, el término $(-b)^2 = +b^2$ es estrictamente no negativo para todo $b \in \mathbb{R}$, garantizando que la única diferencia entre la expansión de la suma $(a+b)^2$ y de la resta $(a-b)^2$ radica exclusivamente en el signo del término central $2ab$.

  ### Síntesis didáctica
  El cuadrado de un binomio resta es un trinomio cuyo término central lleva signo menos y cuyo término constante es siempre positivo.
definiciones_clave: |
  - **Cuadrado de binomio diferencia**: Producto notable de una resta por sí misma: $(a-b)^2$.
  - **Término central negativo ($-2ab$)**: Producto cruzado negativo generado por la interacción entre el término positivo $a$ y el término negativo $-b$.
  - **Positividad del término cuadrático posterior ($+b^2$)**: Resultado positivo obtenido de elevar cualquier número real negativo al cuadrado: $(-b)^2 = +b^2$.
propiedades_relaciones: |
  - **Identidad de simetría**: $(a - b)^2 = (b - a)^2$ para todo $a, b \in \mathbb{R}$.
  - **Comparación de signaturas**: $(a - b)^2$ difiere de $(a + b)^2$ únicamente en el signo del término medio ($-2ab$ en lugar de $+2ab$).
ejemplo_guiado:
  enunciado: 'Aplica la definición de cuadrado de binomio diferencia para expandir $(2x - 5)^2$.'
  pasos:
    - 'Paso 1: Identificamos los términos: el primer término es $a = 2x$ y el segundo es $b = 5$ (con signo menos antecedente).'
    - 'Paso 2: Calculamos el cuadrado del primer término:
       $(2x)^2 = \mathbf{4x^2}$.'
    - 'Paso 3: Calculamos MENOS el doble del primero por el segundo:
       $-2 \cdot (2x) \cdot (5) = \mathbf{-20x}$.'
    - 'Paso 4: Calculamos el cuadrado del segundo término:
       (+5)^2 \text{ o } (-5)^2 = \mathbf{+25}$.'
    - 'Paso 5: Consolidamos el trinomio: $4x^2 - 20x + 25$.'
    - 'Conclusión: La expansión de $(2x - 5)^2$ es **$4x^2 - 20x + 25$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué el último término de la expansión de $(a-b)^2$ lleva signo positivo ($+b^2$) y no negativo?'
    choices:
      - {text: 'Porque al multiplicar el segundo término por sí mismo, la regla de signos establece que $(-b) \cdot (-b) = +b^2$', is_correct: true}
      - {text: 'Porque se elimina el término $b$ antes de elevar', is_correct: false}
      - {text: 'Porque el exponente 2 se le resta a $b$', is_correct: false}
      - {text: 'Porque $a$ siempre es mayor que $b$', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque al multiplicar el segundo término por sí mismo, la regla de signos establece que $(-b) \cdot (-b) = +b^2$''. Regla de signos en potencias pares.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la expansión reducida del cuadrado de binomio $(x - 6)^2$?'
    choices:
      - {text: 'El resultado es $x^2 - 12x + 36$, calculando $x^2$, $-2 \cdot x \cdot 6 = -12x$ y $(-6)^2 = +36$', is_correct: true}
      - {text: 'El resultado es $x^2 - 36$', is_correct: false}
      - {text: 'El resultado es $x^2 - 12x - 36$', is_correct: false}
      - {text: 'El resultado es $x^2 - 6x + 36$', is_correct: false}
    explanation: 'La alternativa correcta es ''El resultado es $x^2 - 12x + 36$, calculando $x^2$, $-2 \cdot x \cdot 6 = -12x$ y $(-6)^2 = +36$''. $x^2 - 2(6)x + 6^2 = x^2 - 12x + 36$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar las magnitudes del primer término ($a$) y del segundo término ($b$) en la resta $(a-b)$.'
  - 'Paso 2: Elevar el primer término al cuadrado: $a^2$.'
  - 'Paso 3: Calcular el término medio anteponiendo un signo menos al doble producto: $-2 \cdot a \cdot b$.'
  - 'Paso 4: Elevar el segundo término al cuadrado asignándole signo positivo: $+b^2$ y unir los términos en $a^2 - 2ab + b^2$.'
errores_correccion: |
  - **Error 1:** Colocar signo negativo al último término (escribir $(a-b)^2 = a^2 - 2ab - b^2$). **Cómo corregirlo:** El último término **SIEMPRE ES POSITIVO ($(-b)^2 = +b^2$)**.
  - **Error 2:** Escribir $(a-b)^2 = a^2 - b^2$ omitiendo el término medio. **Cómo corregirlo:** La resta al cuadrado **GENERA EL TRINOMIO $a^2 - 2ab + b^2$**.
ejemplos:
  - titulo: 'Cuadrado de diferencia básico'
    enunciado: '¿Cuál es el trinomio resultante de $(m - 3)^2$?'
    alternativas:
      - '$m^2 - 6m + 9$'
      - '$m^2 - 9$'
      - '$m^2 - 6m - 9$'
    respuesta: '$m^2 - 6m + 9$'
    solucion_pasos:
      - '1. $m^2$.'
      - '2. $-2 \cdot m \cdot 3 = -6m$.'
      - '3. $(-3)^2 = +9$.'
      - '4. Resultado: $m^2 - 6m + 9$.'
  - titulo: 'Diferencia con variables'
    enunciado: '¿Cuál es la expansión de $(x - y)^2$?'
    alternativas:
      - '$x^2 - 2xy + y^2$'
      - '$x^2 - y^2$'
      - '$x^2 + 2xy + y^2$'
    respuesta: '$x^2 - 2xy + y^2$'
    solucion_pasos:
      - '1. $x^2 - 2xy + y^2$.'
  - titulo: 'Simetría de resultado'
    enunciado: '¿Es el desarrollo de $(3 - x)^2$ idéntico al desarrollo de $(x - 3)^2 = x^2 - 6x + 9$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(3-x)^2 = 9 - 6x + x^2 = x^2 - 6x + 9$.'
  - titulo: 'Signo positivo del término constante'
    enunciado: 'En el desarrollo de $(a - 7)^2 = a^2 - 14a + 49$, ¿es el número $+49$ estrictamente positivo?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $(-7)^2 = +49$.'
errores_frecuentes:
  - 'Asignar signo negativo al último término del trinomio resultante.'
  - 'El término central en la expansión de la resta cuadrática no es incluido.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Cambiar de signo el primer término al elevarlo al cuadrado.'
  - 'Multiplicar el término central por $-2$ dos veces seguidas.'
afirmaciones_verdaderas:
  - 'El cuadrado de un binomio diferencia $(a-b)^2$ se expande como $a^2 - 2ab + b^2$.'
  - 'El último término del trinomio cuadrado perfecto es siempre positivo independientemente de si el binomio es una suma o una resta.'
al_terminar_debes_poder: 'Expandir el cuadrado de un binomio diferencia aplicando el signo menos exclusivamente al doble producto central.'
