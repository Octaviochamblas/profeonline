semantic_id: MAT.ALG.CUADRADO_BINOMIO.DIFERENCIA_DEFINICION
resumen_inicial: 'Definición de cuadrado de binomio diferencia: fórmula, regla de
  expansión y aplicaciones en Cuadrado de binomio.'
explicacion_simple: Al igual que con la suma, podemos elevar una resta o diferencia
  al cuadrado. ¿Crees que el resultado es muy distinto al de la suma?
explicacion_formal: '### Definición formal


  El exponente $2$ indica multiplicar la base, que es el binomio completo $(x-y)$,
  por sí misma.


  ### Desarrollo didáctico


  El cuadrado de un binomio con una resta (diferencia) se expresa como $(a-b)^2$.
  Igual que en la suma, esto significa multiplicar el binomio por sí mismo: $(a-b)(a-b)$.


  Aplicando la propiedad distributiva término a término, pero teniendo mucho cuidado
  con los signos:

  $(a-b)(a-b) = a(a) + a(-b) + (-b)(a) + (-b)(-b)$

  $= a^2 - ab - ba + b^2$


  Como la multiplicación es conmutativa, $-ab$ y $-ba$ son términos semejantes. Al
  juntarlos, obtenemos un solo término negativo: $-2ab$. El último término, $(-b)(-b)$,
  se vuelve positivo ($+b^2$) porque negativo por negativo es positivo.


  **Fórmula:** $(a-b)^2 = a^2 - 2ab + b^2$


  **Conclusión:** La única diferencia respecto al cuadrado de una suma es el signo
  negativo del término central o "doble producto". Los extremos ($a^2$ y $b^2$) siempre
  serán positivos.'
definiciones_clave: '- **Definición de cuadrado de binomio diferencia**: Producto
