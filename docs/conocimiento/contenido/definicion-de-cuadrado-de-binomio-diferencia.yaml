resumen_inicial: El cuadrado de un binomio diferencia es un producto notable equivalente
  al cuadrado del primer término, menos el doble producto del primero por el segundo,
  más el cuadrado del segundo término.
explicacion_simple: Para calcular $(a - b)^2$, multiplicamos $(a - b)(a - b)$. Al
  hacerlo, el primer término queda positivo ($a^2$), el término del medio queda negativo
  ($-2ab$), y el último término queda SIEMPRE positivo ($+b^2$, porque menos por menos
  es más). La fórmula es $a^2 - 2ab + b^2$.
explicacion_formal: 'Para cualesquiera $a, b \in \mathbb{R}$, el **Cuadrado del Binomio
  Diferencia** $(a - b)^2$ se define como la expansión trinómica:


  $$(a - b)^2 = (a - b)(a - b) = a^2 - ab - ba + (-b)^2 = a^2 - 2ab + b^2$$


  **Desglose simbólico:**

  - $a^2$: Primer término al cuadrado.

  - $-2ab$: Doble producto del primer término por el segundo con signo negativo por
  la resta del binomio.

  - $+b^2$: Segundo término elevado al cuadrado, estrictamente no negativo pues $(-b)^2
  = +b^2$.


  > **Complemento didáctico:** El signo negativo del segundo término invierte la polaridad
  del doble producto manteniendo la positividad del segundo cuadrado $(-b)^2 = +b^2$.'
definiciones_clave: '- **Cuadrado de binomio diferencia**: Identidad $(a-b)^2 = a^2
  - 2ab + b^2$.

  - **Positividad de cuadrados**: Los términos extremales $a^2$ y $b^2$ son estrictamente
  no negativos en $\mathbb{R}$.'
propiedades_relaciones: '- **Simetría cuadrática**: $(a - b)^2 = (b - a)^2$.'
ejemplo_guiado:
  enunciado: Desarrolle la expresión $(3x - 4)^2$ aplicando la definición de cuadrado
    de binomio diferencia.
  pasos:
  - 'Paso 1: Identificar $a = 3x$ y $b = 4$.'
  - 'Paso 2: Calcular el cuadrado del primer término: $(3x)^2 = 9x^2$.'
  - 'Paso 3: Calcular el doble producto negativo: $-2 \cdot (3x) \cdot (4) = -24x$.'
  - 'Paso 4: Calcular el cuadrado del segundo término: $(4)^2 = 16$.'
  - 'Paso 5: Unir los términos: $9x^2 - 24x + 16$.'
  - 'Conclusión: El desarrollo de $(3x - 4)^2$ es $9x^2 - 24x + 16$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la forma desarrollada del cuadrado de un binomio diferencia $(a
    - b)^2$?
  choices:
  - text: $a^2 - $2ab$ + b^2$
    is_correct: true
  - text: $a^2 - b^2$
    is_correct: false
  - text: $a^2 - $2ab$ - b^2$
    is_correct: false
  - text: $a^2 + $2ab$ - b^2$
    is_correct: false
  explanation: La alternativa correcta es '$a^2 - $2ab$ + b^2$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $(3x - 4)^2$, ¿cuál fue el signo del término
    constante $16$?
  choices:
  - text: Positivo ($+16$), porque $(-4)^2 = $+16$
    is_correct: true
  - text: Negativo ($-16$)
    is_correct: false
  - text: Cero
    is_correct: false
  - text: Indeterminado
    is_correct: false
  explanation: La alternativa correcta es 'Positivo ($+16$), porque $(-4)^2 = $+16$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Elevar al cuadrado el primer término $a \to a^2$.'
- 'Paso 2: Calcular el doble producto restando $2ab$.'
- 'Paso 3: Elevar al cuadrado el segundo término sumando $+b^2$.'
errores_correccion: '- **Error 1: Asignar signo negativo al último término escribiendo
  $(a - b)^2 = a^2 - 2ab - b^2$.** **Cómo corregirlo:** El último término es $(-b)^2
  = +b^2$, siempre POSITIVO.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle la expresión $(x - 6)^2$.
  alternativas:
  - $x^2 - 12x + $36$
  - $x^2 - $36$
  - $x^2 - 12x - $36$
  respuesta: $x^2 - 12x + $36$
  solucion_pasos:
  - '1. Primer cuadrado: $x^2$.'
  - '2. Doble producto negativo: $-2(x)(6) = -12x$.'
  - '3. Segundo cuadrado: $(+36)$. Resultado: $x^2 - 12x + $36$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el desarrollo de $(2a - 5b)^2$?
  alternativas:
  - $4a^2 - 20ab + 25b^2$
  - $4a^2 - 25b^2$
  - $4a^2 - 10ab + 25b^2$
  respuesta: $4a^2 - 20ab + 25b^2$
  solucion_pasos:
  - 1. $(2a)^2 = 4a^2$.
  - 2. $-2(2a)(5b) = -20ab$.
  - '3. $(5b)^2 = 25b^2$. Resultado: $4a^2 - 20ab + 25b^2$.'
- titulo: ¿Es el desarrollo de $(y - 3)^2$ igual a $y^2 - 6y + $9$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $y^2 - 2(3)y + 3^2 = $y^2 - 6y$ + $9$.
- titulo: ¿El último término del desarrollo de $(a - b)^2$ puede ser negativo?
  respuesta: 'No'
  solucion_pasos:
  - No, al elevar al cuadrado cualquier número real el resultado es no negativo ($+b^2$).
errores_frecuentes:
- Asignar signo negativo al término $b^2$ al final de la expresión desarrollada.
- El desarrollo de $(a - b)^2$ genera únicamente dos términos extremales $a^2 - b^2$.
- Declarar que $(a - b)^2$ es idéntico a $a^2 - b^2$.
- Multiplicar por $-2$ el exponente en lugar de multiplicar el coeficiente.
- Declarar que el desarrollo de $(a - b)^2$ no es un trinomio.
afirmaciones_verdaderas:
- El desarrollo de $(a - b)^2$ produce un trinomio con signo negativo en el doble
  producto y positivo en los extremos.
- Los términos extremos $a^2$ y $b^2$ son siempre positivos en los números reales.
al_terminar_debes_poder: Al terminar serás capaz de desarrollar el cuadrado de cualquier
  binomio diferencia aplicando la regla $a^2 - 2ab + b^2$.
