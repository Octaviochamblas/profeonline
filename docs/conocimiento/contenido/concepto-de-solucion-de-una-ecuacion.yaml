semantic_id: MAT.ALG.ECUACION_BASE.CONCEPTO_SOLUCION
resumen_inicial: 'Concepto de solución de una ecuación: propiedades, resolución y
  modelamiento en Ecuación de primer grado: conceptos y propiedades.'
explicacion_simple: El objetivo final de cualquier ecuación es 'resolverla'. Pero
  ¿qué es exactamente lo que estamos buscando? Buscamos el valor desconocido que equilibra
  la balanza.
explicacion_formal: '### Definición formal


  La verificación empírica sustituyendo el valor es infalible y te asegura el puntaje.


  ### Desarrollo didáctico


  Resolver una ecuación es un proceso de análisis.

  Si te dan la ecuación $2x - 1 = 7$, te están diciendo: ''El doble de un número secreto,
  menos uno, es igual a siete. ¿Quién es el número?''.


  Si alguien te dice ''Creo que la solución es 5.'' ¿Cómo lo compruebas?

  Reemplazas la ''x'' por el 5:

  Lado izquierdo: $2(5) - 1 = 10 - 1 = 9$.

  Lado derecho: $7$.

  ¿Es $9 = 7$? No. Entonces 5 **no es la solución**.


  Si alguien te dice ''Es 4.'':

  Reemplazas: $2(4) - 1 = 8 - 1 = 7$.

  Lado derecho: $7$.

  ¿Es $7 = 7$? Sí. Perfecto equilibrio.

  Entonces decimos que **$x = 4$ es la solución**.'
definiciones_clave: '- **Concepto de solución de una ecuación**: Herramienta matemática
  para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a concepto de solución de una ecuación.'
