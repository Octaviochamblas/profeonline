semantic_id: MAT.ALG.ECUACION_BASE.CONCEPTO_SOLUCION
resumen_inicial: La solución de una ecuación es el valor de la incógnita que transforma la ecuación en una igualdad numérica verdadera.
explicacion_simple: |
  Resolver una ecuación consiste en encontrar el valor numérico exacto de la incógnita.

  La **solución** es aquel número preciso que, al ser sustituido en el lugar de la variable $x$, hace que la expresión del primer miembro adquiera un valor exactamente igual a la del segundo miembro.

  Si al reemplazar un valor los dos lados no resultan numéricamente iguales, dicho número no es solución de la ecuación.
explicacion_formal: |
  ### Definición formal
  Dada la ecuación $A(x) = B(x)$, un valor numérico constante $c \in \mathbb{R}$ es **solución de la ecuación** si y solo si:

  $$A(c) = B(c) \quad \text{constituye una proposición verdadera en } \mathbb{R}$$

  ### Desglose de la fórmula
  - $c$: Valor numérico asignado a la variable $x$.
  - $A(c) = B(c)$: Identidad numérica verificada tras la sustitución del valor $c$.

  ### Síntesis didáctica
  En una ecuación lineal de primer grado $ax + b = 0$ con $a \neq 0$, existe una única solución real dada por $x = -\frac{b}{a}$.
definiciones_clave: |
  - **Solución de una ecuación**: Valor numérico de la incógnita que satisface la igualdad matemática.
  - **Verificación de solución**: Proceso de sustituir un número candidato en ambos miembros para comprobar si la igualdad es verdadera.
propiedades_relaciones: |
  - **Unicidad en primer grado**: Una ecuación lineal de primer grado no trivial posee exactamente una solución en el conjunto de los números reales.
  - **Veracidad condicional**: La ecuación se comporta como una proposición abierta que solo resulta verdadera al evaluar su solución.
ejemplo_guiado:
  enunciado: 'Verifica si el valor candidato $x = 5$ constituye la solución de la ecuación lineal $3x - 4 = 2x + 1$.'
  pasos:
    - 'Paso 1: Sustituir $x = 5$ en el primer miembro: $3(5) - 4 = 15 - 4 = 11$.'
    - 'Paso 2: Sustituir $x = 5$ en el segundo miembro: $2(5) + 1 = 10 + 1 = 11$.'
    - 'Paso 3: Comparar los resultados numéricos obtenidos en ambos miembros: $11 = 11$.'
    - 'Paso 4: Concluir que $x = 5$ es la solución de la ecuación por transformar la igualdad en una proposición verdadera.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición matemática exige la definición de solución para un número candidato $c$ en una ecuación $A(x) = B(x)$?'
    choices:
      - {text: 'Que al evaluar $x = c$, ambos miembros adopten exactamente el mismo valor numérico ($A(c) = B(c)$).', is_correct: true}
      - {text: 'Que al evaluar $x = c$, el primer miembro sea estrictamente igual a cero sin importar el segundo miembro.', is_correct: false}
      - {text: 'Que el número $c$ sea siempre un entero positivo no nulo.', is_correct: false}
      - {text: 'Que la variable $x$ se cancele sin requerir operaciones aritméticas.', is_correct: false}
    explanation: 'La alternativa correcta es ''Que al evaluar $x = c$, ambos miembros adopten exactamente el mismo valor numérico ($A(c) = B(c)$).''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al verificar que $x = 5$ satisface $3x - 4 = 2x + 1$, ¿cuál es el valor numérico idéntico alcanzado a ambos lados?'
    choices:
      - {text: '$11$', is_correct: true}
      - {text: '$15$', is_correct: false}
      - {text: '$10$', is_correct: false}
      - {text: '$5$', is_correct: false}
    explanation: 'La alternativa correcta es ''$11$''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Tomar el valor numérico candidato a solución.'
  - 'Paso 2: Sustituir la variable $x$ por dicho valor en la expresión del primer miembro y calcular su valor.'
  - 'Paso 3: Sustituir la variable $x$ por el mismo valor en la expresión del segundo miembro y calcular su valor.'
  - 'Paso 4: Comprobar la igualdad: si los resultados numéricos coinciden, el valor es solución; si difieren, no lo es.'
errores_correccion: |
  - **Error 1:** Declarar que un valor es solución evaluando solo uno de los dos miembros de la ecuación. **Cómo corregirlo:** La comprobación **EXIGE SUSTITUIR EL VALOR Y EVALUAR AMBOS MIEMBROS HASTA COMPROBAR LA EQUIVALENCIA NUMÉRICA GLOBAL**.
  - **Error 2:** Sustituir valores distintos para la misma incógnita en el primer y segundo miembro. **Cómo corregirlo:** Toda ocurrencia de la variable $x$ en la ecuación **DEBE SUSTITUIRSE POR EL MISMO VALOR NUMÉRICO EN UNA MISMA COMPROBACIÓN**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿Cuál de los siguientes números es la solución de la ecuación $2x + 3 = 11$?'
    alternativas:
      - '$x = 4$'
      - '$x = 3$'
      - '$x = 5$'
    respuesta: '$x = 4$'
    solucion_pasos:
      - '1. Evaluar $x = 4$: $2(4) + 3 = 8 + 3 = 11$.'
      - '2. Puesto que $11 = 11$, el valor $x = 4$ es la solución.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Al verificar $x = -2$ en la ecuación $x + 8 = 3x + 12$, ¿es $x = -2$ una solución válida?'
    alternativas:
      - 'Sí, es solución porque $-2 + 8 = 6$ y $3(-2) + 12 = 6$'
      - 'No, porque el resultado es negativo'
      - 'No, porque produce una contradicción $6 = 0$'
    respuesta: 'Sí, es solución porque $-2 + 8 = 6$ y $3(-2) + 12 = 6$'
    solucion_pasos:
      - '1. Primer miembro: $-2 + 8 = 6$.'
      - '2. Segundo miembro: $3(-2) + 12 = -6 + 12 = 6$.'
      - '3. Como $6 = 6$, $x = -2$ es solución.'
  - titulo: 'Verificación de candidato'
    enunciado: '¿Sustituir $x = 0$ en la ecuación $5x = 0$ confirma que $0$ es solución?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, pues $5(0) = 0$, obteniendo la igualdad verdadera $0 = 0$.'
  - titulo: 'Soluciones múltiples'
    enunciado: '¿Una ecuación de primer grado estándar como $x + 2 = 5$ puede tener dos soluciones numéricas distintas?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, por el teorema de unicidad de soluciones de primer grado.'
errores_frecuentes:
  - 'Considerar que la solución es el valor del miembro derecho en lugar del valor de la variable.'
  - 'Sustituir la incógnita solo en el primer miembro y asumir la igualdad sin calcular el segundo.'
  - 'Cambiar de signo el candidato a solución durante la sustitución previa a la evaluación.'
  - 'Afirmar que un número negativo no puede ser solución de una ecuación lineal.'
  - 'Confundir el valor de la solución $x$ con la evaluación final que verifica la igualdad.'
afirmaciones_verdaderas:
  - 'La solución de una ecuación es el valor de la incógnita que satisface la igualdad numérica de ambos miembros.'
  - 'Sustituir la solución en la ecuación transforma la expresión abierta en una proposición verdadera.'
al_terminar_debes_poder: |
  QUÉ: Comprender y verificar la solución de una ecuación de primer grado.
  CÓMO: Sustituir el valor candidato en ambos miembros de la ecuación y verificar la equivalencia numérica entre ellos.
fuente: 'Texto escolar MINEDUC — Álgebra 7° Básico / Ecuaciones Lineales.'
