semantic_id: MAT.ALG.ECUACION_BASE.CONCEPTO_SOLUCION
resumen_inicial: La solución de una ecuación es el valor de la incógnita que transforma
  la ecuación en una igualdad numérica verdadera.
explicacion_simple: 'Resolver una ecuación es como encontrar la llave exacta que abre
  un candado.

  La **solución** es ese número preciso que, al sustituirlo en lugar de la incógnita
  $x$, hace que el valor del primer miembro sea exactamente igual al valor del segundo
  miembro.'
explicacion_formal: 'Dado $A(x) = B(x)$, un número $c \in \mathbb{R}$ es **solución
  de la ecuación** si y solo si:


  $$A(c) = B(c) \quad \text{es una proposición verdadera en } \mathbb{R}$$


  **Desglose de la fórmula:**

  - $c$: Valor numérico constante asignado a la variable $x$.

  - $A(c) = B(c)$: Identidad numérica resultante tras la sustitución.'
definiciones_clave: '- **Solución de una ecuación**: Valor de la incógnita que satisface
  la igualdad numérica.

  - **Verificación de solución**: Proceso de sustituir el valor en la ecuación para
  comprobar que ambos miembros sean iguales.'
propiedades_relaciones: '- **Unicidad en primer grado**: Una ecuación lineal de primer
  grado no trivial $ax + b = 0$ con $a \neq 0$ posee una única solución $x = -\frac{b}{a}$.'
ejemplo_guiado:
  enunciado: Verifica si el valor $x = 5$ es solución de la ecuación $3x - 4 = 2x
    + 1$.
  pasos:
  - 'Paso 1: Sustituir $x = 5$ en el primer miembro: $3(5) - 4 = 15 - 4 = 11$.Paso
    2: Sustituir $x = 5$ en el segundo miembro: $2(5) + 1 = 10 + 1 = 11$.Paso 3: Comparar
    los resultados de ambos miembros: $11 = 11$.Paso 4: Concluir que $x = 5$ SI es
    solución de la ecuación por transformar la ecuación en una igualdad verdadera.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición debe cumplir un número $c$ para ser considerado solución
    de una ecuación?
  choices:
  - text: Al sustituir $x = c$, ambos miembros adquieren el mismo valor numérico.
    is_correct: true
  - text: Que al sustituir $x = c$, la ecuación sea igual a cero independientemente
      del segundo miembro.
    is_correct: false
  - text: Que $c$ sea siempre un número entero positivo.
    is_correct: false
  - text: Que elimine los términos independientes de la ecuación.
    is_correct: false
  explanation: La alternativa correcta es 'Al sustituir $x = c$, ambos miembros adquieren
    el mismo valor numérico.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al comprobar que $x = 5$ satisface $3x - 4 = 2x + 1$, ¿cuál es el valor
    numérico obtenido a ambos lados?
  choices:
  - text: $11$
    is_correct: true
  - text: $15$
    is_correct: false
  - text: $10$
    is_correct: false
  - text: $5$
    is_correct: false
  explanation: La alternativa correcta es '$11$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar cada ocurrencia de la incógnita $x$ por el número candidato.'
- 'Paso 2: Calcular por separado el valor numérico del primer miembro.'
- 'Paso 3: Calcular por separado el valor numérico del segundo miembro.'
- 'Paso 4: Comprobar si ambos valores son idénticos.'
errores_correccion: '- **Error común:** Afirmar que un número es solución sin haber
  evaluado AMBOS miembros de la ecuación.

  - **Cómo corregirlo:** La solución debe satisfacer la igualdad COMPLETA entre el
  lado izquierdo y el derecho.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de igualdades.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de igualdades.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Sumar la misma cantidad en ambos miembros preserva la igualdad?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad aditiva.
- titulo: ¿Una ecuación se cumple para todos los números reales?
  respuesta: 'No'
  solucion_pasos:
  - No, una ecuación condicional solo se cumple para valores específicos.
errores_frecuentes:
- Confundir la definición de una igualdad numérica con la de una expresión algebraica.
- Asumir que las identidades solo son válidas para números enteros positivos.
- Confundir los miembros de una ecuación con sus términos individuales.
- Sumar o restar una cantidad en un solo lado de la ecuación al intentar despejar.
- Dividir ambos miembros de la ecuación entre cero.
afirmaciones_verdaderas:
- Una ecuación es una igualdad condicionada que se verifica solo para determinados
  valores de la incógnita.
- Aplicar las propiedades aditiva y multiplicativa en ambos miembros de una ecuación
  genera ecuaciones equivalentes.
al_terminar_debes_poder: Al finalizar este recurso podrás definir conceptos fundamentales
  de ecuaciones de primer grado y aplicar las propiedades de la igualdad.
fuente: Texto escolar MINEDUC — Álgebra / Ecuaciones de Primer Grado
estado: publicado
