procedimiento:
- 'Paso 1: Toma el valor candidato que crees que es la solución.'
- 'Paso 2: Sustituye todas las apariciones de la incógnita en la ecuación por ese
  número (usa paréntesis).'
- 'Paso 3: Calcula el valor numérico del Primer Miembro.'
- 'Paso 4: Calcula el valor numérico del Segundo Miembro.'
- 'Paso 5: Si ambos valores son idénticos, es la solución.'
errores_correccion: Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en concepto de solución de una ecuación.
