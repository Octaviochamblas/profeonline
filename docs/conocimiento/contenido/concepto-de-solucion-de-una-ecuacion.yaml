errores_frecuentes:
- Creer que la 'solución' son los pasos intermedios.
- Equivocarse en los signos al verificar la solución (ej. al reemplazar un número
  negativo).
- Para «La forma definitiva y más confiable de saber si has encontrado la solución
  correcta de una ecuación es:», la respuesta correcta es Preguntarle al profesor.
- Repasar los pasos de álgebra para ver si no hay errores.
- Para «La forma definitiva y más confiable de saber si has encontrado la solución
  correcta de una ecuación es:», la respuesta correcta es Usar otra letra diferente.
