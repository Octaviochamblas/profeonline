semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNCENTRO_OBTUSANGULO
resumen_inicial: En todo triángulo obtusángulo (aquel que posee un ángulo interior
  mayor a $90^\circ$), las simetrales se intersectan en la región exterior. Por lo
  tanto, el circuncentro ($O$) se ubica estrictamente en el exterior del triángulo,
  del lado opuesto al vértice del ángulo obtuso.
explicacion_simple: '![Circuncentro en Obtusángulo](/static/img/nodos/ubicacion-exterior-del-circuncentro-en-un-triangulo-obtusangulo-intro.svg)


  Cuando un triángulo tiene un ángulo **obtuso** (muy abierto, mayor que $90^\circ$):


  - **El centro se sale hacia afuera**: Las tres simetrales se cruzan en el **exterior**
  del triángulo.

  - **Del lado de la base**: El punto $O$ queda flotando afuera, al frente del lado
  más largo (opuesto a la esquina obtusa).

  - **El círculo sigue pasando por los vértices**: Aunque el centro $O$ esté afuera,
  el compás sigue pasando perfectamente por las 3 esquinas $A, B$ y $C$.

  '
explicacion_formal: '### Teorema formal

  En todo triángulo obtusángulo $\Delta ABC$ con ángulo obtuso en $\alpha > 90^\circ$,
  el circuncentro $O$ se ubica estrictamente en el **exterior** del triángulo:


  $$\alpha > 90^\circ \implies O \in \operatorname{Ext}(\Delta ABC)$$


  ### Desglose simbólico y geométrico

  - Ángulo central cóncavo: El ángulo central que subtiende el lado mayor es cóncavo
  ($2\alpha > 180^\circ$), empujando al centro $O$ fuera de la región poligonal.

  - Ubicación exterior: Se ubica en el semiplano opuesto al vértice obtuso respecto
  al lado mayor.


  ### Síntesis didáctica

  En triángulos obtusángulos la circunferencia circunscrita es amplia y su centro
  queda forzosamente en el exterior del triángulo.'
definiciones_clave: '- **Triángulo obtusángulo**: Triángulo que posee un ángulo interior
  estrictamente mayor que $90^\circ$ y menor que $180^\circ$.

  - **Circuncentro exterior**: Ubicación de $O$ fuera de la superficie o región poligonal
  del triángulo.

  - **Arco mayor**: Arco de circunferencia cuya medida angular es estrictamente mayor
  a $180^\circ$.

  '
propiedades_relaciones: '- **Existencia de ángulo obtuso**: $\exists \theta > 90^\circ
  \iff O \in \text{Ext}(\Delta ABC)$.

  - **Posición relativa**: $O$ se sitúa en el semiplano opuesto al vértice del ángulo
  obtuso respecto al lado mayor.

  - **Comparación con ortocentro**: En el obtusángulo, tanto $O$ como $H$ son exteriores,
  pero $H$ queda detrás del vértice obtuso mientras que $O$ queda del lado del lado
  mayor.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Circuncentro en Obtusángulo](/static/img/nodos/ubicacion-exterior-del-circuncentro-en-un-triangulo-obtusangulo-ejemplos.svg)


    Un triángulo tiene ángulos interiores que miden $20^\circ$, $35^\circ$ y $125^\circ$.
    Determina el tipo de triángulo según sus ángulos y deduce la posición del circuncentro
    $O$ respecto a la región triangular.

    '
  pasos:
  - 'Paso 1: Evaluar los ángulos dados: uno de los ángulos mide $125^\circ > 90^\circ$.'
  - 'Paso 2: Clasificar el triángulo: al tener un ángulo mayor a $90^\circ$, es un
    triángulo obtusángulo.'
  - 'Paso 3: Aplicar el teorema de localización del circuncentro: en todo triángulo
    obtusángulo, el circuncentro $O$ se ubica estrictamente en el exterior.'
  - 'Paso 4: Concluir que el circuncentro $O$ está ubicado en el exterior del triángulo,
    del lado opuesto al ángulo de $125^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubica el circuncentro en un triángulo con ángulos de 30°, 40°
    y 110°?
  choices:
  - text: En el exterior del triángulo, porque tiene un ángulo obtuso ($110^\circ$)
    is_correct: true
  - text: En el interior del triángulo
    is_correct: false
  - text: En el vértice del ángulo de 110°
    is_correct: false
  - text: En el punto medio del lado menor
    is_correct: false
  explanation: El circuncentro se ubica en el exterior del triángulo, porque tiene
    un ángulo obtuso ($110^\circ$), opuesto a dicho vértice.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué posición relativa se sitúa el circuncentro exterior de un triángulo
    obtusángulo?
  choices:
  - text: Del lado opuesto al vértice del ángulo obtuso
    is_correct: true
  - text: Detrás del vértice del ángulo obtuso
    is_correct: false
  - text: Sobre el cateto menor
    is_correct: false
  - text: En el baricentro
    is_correct: false
  explanation: El circuncentro se ubica del lado opuesto al vértice del ángulo obtuso,
    frente al lado de mayor longitud.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el vértice que posee el ángulo obtuso ($> 90^\circ$).'
- 'Paso 2: Trazar las simetrales de los tres lados del triángulo.'
- 'Paso 3: Prolongar las simetrales hacia afuera del triángulo por el lado opuesto
  al ángulo obtuso.'
- 'Paso 4: Marcar el punto de intersección $O$ en la región exterior.'
errores_correccion: No confundas la posición del circuncentro exterior (frente al
  lado mayor) con la del ortocentro exterior (detrás del vértice obtuso).
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si un triángulo tiene ángulos de $15^\circ$, $25^\circ$ y $140^\circ$,
    ¿dónde se ubica su circuncentro?
  alternativas:
  - En el exterior del triángulo
  - En el interior del triángulo
  - Sobre uno de sus lados
  respuesta: En el exterior del triángulo
  solucion_pasos:
  - Al tener un ángulo de $140^\circ > 90^\circ$, el triángulo es obtusángulo y su
    circuncentro es necesariamente exterior.
- titulo: Ejemplo 2
  enunciado: ¿Qué puntos notables de un triángulo obtusángulo quedan situados en el
    exterior?
  alternativas:
  - El ortocentro y el circuncentro
  - Solo el incentro
  - El baricentro y el incentro
  respuesta: El ortocentro y el circuncentro
  solucion_pasos:
  - En el triángulo obtusángulo, tanto el ortocentro ($H$) como el circuncentro ($O$)
    son exteriores, mientras que el baricentro ($G$) y el incentro ($I$) siempre son
    interiores.
- titulo: ¿El circuncentro de un triángulo obtusángulo está siempre en el exterior
    del triángulo?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una propiedad invariable de todos los triángulos obtusángulos.
- titulo: ¿Un triángulo obtusángulo puede tener su circuncentro en el interior?
  respuesta: 'No'
  solucion_pasos:
  - No, el circuncentro solo es interior en triángulos acutángulos.
errores_frecuentes:
- Intentar forzar el trazado del circuncentro dentro del triángulo obtusángulo.
- Confundir el circuncentro exterior con el ortocentro exterior.
- Creer que si $O$ está afuera no se puede trazar la circunferencia circunscrita.
- Pensar que el incentro también puede ser exterior en el triángulo obtusángulo.
- Olvidar prolongar las simetrales hacia afuera para encontrar la intersección.
afirmaciones_verdaderas:
- En todo triángulo obtusángulo el circuncentro se ubica estrictamente en el exterior
  del triángulo.
- El circuncentro de un triángulo obtusángulo se sitúa del lado opuesto al vértice
  del ángulo obtuso.
al_terminar_debes_poder: '**QUÉ:** Identificar, trazar y justificar la ubicación exterior
  del circuncentro en triángulos obtusángulos.


  **CÓMO:** Prolongando las simetrales hacia el semiplano exterior opuesto al ángulo
  obtuso y determinando su punto de intersección $O \in \text{Exterior}$.


  ![Resumen de Circuncentro en Obtusángulo](/static/img/nodos/ubicacion-exterior-del-circuncentro-en-un-triangulo-obtusangulo-resumen.svg)

  '
