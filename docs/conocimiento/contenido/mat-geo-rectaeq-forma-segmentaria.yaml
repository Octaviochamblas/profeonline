semantic_id: MAT.GEO.RECTA_ECUACIONES.FORMA_SEGMENTARIA
resumen_inicial: 'Reconocimiento de la ecuación segmentaria de la recta: conceptos,
  teoremas, propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: Cuando interesa mostrar directamente dónde una recta corta ambos
  ejes coordenados, conviene expresarla en su forma segmentaria en vez de la principal
  o general.
explicacion_formal: '![Ecuación segmentaria de la recta](/static/img/geometria/analitica/rectaeq-forma-segmentaria.svg)


  ### Definición formal


  Una recta que corta al eje x en $(a,0)$ y al eje y en $(0,b)$ (con $a,b\neq0$) se
  escribe en forma segmentaria como $\dfrac{x}{a}+\dfrac{y}{b}=1$.


  ### Desarrollo didáctico


  En la figura, la recta corta el eje x en $(4,0)$ y el eje y en $(0,3)$, por lo que
  su ecuación segmentaria es $\dfrac{x}{4}+\dfrac{y}{3}=1$.'
definiciones_clave: '- **Reconocimiento de la ecuación segmentaria de la recta**:
  Elemento o propiedad fundamental en el estudio de geometría analítica ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a reconocimiento de la ecuación segmentaria
  de la recta.'
