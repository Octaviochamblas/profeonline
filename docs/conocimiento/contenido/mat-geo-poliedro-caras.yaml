semantic_id: MAT.GEO.POLIEDROS_PRISMAS.CARAS
resumen_inicial: 'Identificación de las caras de un poliedro: conceptos, teoremas,
  propiedades geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: Cada 'lado plano' visible de un poliedro (como cada cara de un
  dado) es lo que en geometría se llama una cara.
explicacion_formal: '![Caras de un poliedro](/static/img/geometria/espacio-cuerpos/poliedro-caras.svg)


  ### Definición formal


  Las caras de un poliedro son los polígonos planos que forman su superficie. Cada
  cara está delimitada por un conjunto de aristas que forman un polígono cerrado.


  ### Desarrollo didáctico


  En la figura, la región ABCD (uno de los rectángulos que forman la superficie del
  prisma) es una cara del poliedro. Un prisma rectangular tiene en total 6 caras:
  2 bases y 4 caras laterales.'
definiciones_clave: '- **Identificación de las caras de un poliedro**: Elemento o
  propiedad fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación de las caras de un poliedro.'
