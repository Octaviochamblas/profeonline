procedimiento:
- 'Paso 1: Observa la superficie del poliedro e identifica cada región poligonal plana
  individual.'
- 'Paso 2: Verifica que cada una de esas regiones esté delimitada por aristas que
  forman un polígono cerrado.'
- 'Paso 3: Cuenta el total de caras identificadas para caracterizar el poliedro.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
