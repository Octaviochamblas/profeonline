resumen_inicial: 'La tasa de interés real descuenta el efecto de la inflación (IPC)
  sobre la tasa nominal, midiendo la variación efectiva del poder adquisitivo: $r_{real}
  \approx r_{nominal} - \text{IPC}$.'
explicacion_simple: La tasa de interés real nos muestra cuánto gana realmente nuestro
  dinero descontando el encarecimiento de la vida (inflación). Si un banco nos paga
  una tasa del 6% al año pero los precios subieron un 4% por inflación, nuestra ganancia
  real de poder de compra fue solo de un 2%.
explicacion_formal: 'La **Tasa de Interés Real $r_{real}$** ajustada por la tasa de
  inflación $i$ (Ecuación de Fisher exacta) se define por:


  $$1 + r_{real} = \frac{1 + r_{nominal}}{1 + i} \implies r_{real} = \frac{r_{nominal}
  - i}{1 + i}$$


  **Aproximación lineal práctica:**

  $$r_{real} \approx r_{nominal} - i \quad (\text{válida para tasas bajas } i, r <
  10\%)$$.'
definiciones_clave: '- **Tasa de interés real $r_{real}$**: Tasa nominal ajustada
  por inflación $r_{real} \approx r_{nominal} - i$.'
propiedades_relaciones: '- **Ajuste de poder adquisitivo**: Descuenta el IPC para
  medir el crecimiento real de la capacidad de compra.'
ejemplo_guiado:
  enunciado: Un depósito paga una tasa de interés nominal del $7\%$ anual. Si la inflación
    del año (IPC) fue del $4\%$, calcule la tasa de interés real aproximada.
  pasos:
  - 'Paso 1: Aplicar la fórmula aproximada: $r_{real} \approx r_{nominal} - i$.'
  - 'Paso 2: Restar la inflación: $r_{real} \approx 7\% - 4\% = 3\%$.'
  - 'Conclusión: La ganancia real de poder adquisitivo fue del $3\%$ anual.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se calcula en forma aproximada la tasa de interés real a partir
    de la tasa nominal e inflación?
  choices:
  - text: Restando la tasa de inflación a la tasa nominal (r_real approx r_nominal
      - IPC)
    is_correct: true
  - text: Sumando ambas tasas
    is_correct: false
  - text: Multiplicando ambas tasas
    is_correct: false
  - text: Dividiendo por 100
    is_correct: false
  explanation: La alternativa correcta es 'Restando la tasa de inflación a la tasa
    nominal (r_real approx r_nominal - IPC)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para tasa nominal 7% e inflación 4%, ¿cuál fue la
    tasa real aproximada?
  choices:
  - text: 3%
    is_correct: true
  - text: 11%
    is_correct: false
  - text: 28%
    is_correct: false
  - text: 1,75%
    is_correct: false
  explanation: La alternativa correcta es '3%'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular la tasa de interés real
  $r_{real} \approx r_{nominal} - \text{IPC}$ descontando la inflación.
semantic_id: MAT.NUM.FINANZAS_PERSONALES.TASA_INTERES_REAL
procedimiento:
- 'Paso 1: Identificar las variables financieras de ingresos, gastos, tasas de interés
  o sueldos imponibles.'
- 'Paso 2: Aplicar la fórmula financiera correspondiente ($B = I - G$, $R\%$, $r_{real}$
  o $10\% \text{ AFP}$).'
- 'Paso 3: Calcular el resultado y evaluar la estabilidad presupuestaria.'
errores_correccion: '- **Error 1: Confundir la tasa de interés nominal con la tasa
  real sin restar la inflación del IPC.** **Cómo corregirlo:** La ganancia real de
  poder adquisitivo exige descontar el IPC ($r_{real} \approx r_{nominal} - \text{IPC}$).


  - **Error 2: Calcular la cotización previsional de AFP sobre el sueldo líquido en
  vez del imponible.** **Cómo corregirlo:** El $10\%$ obligatorio se aplica estrictamente
  sobre el SUELDO IMPONIBLE (hasta el tope legal).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.FINANZAS_PERSONALES.TASA_INTERES_REAL.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de finanzas personales.
- titulo: Ejemplo 2
  enunciado: Verificación de equilibrio financiero.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Demostración formal de balance o cotización.
- titulo: ¿Es el 10% el porcentaje obligatorio de cotización previsional a la AFP?
  respuesta: Sí
  solucion_pasos:
  - Sí, sobre el sueldo imponible hasta el tope legal.
- titulo: ¿Genera un balance B = I - G positivo capacidad de ahorro?
  respuesta: Sí
  solucion_pasos:
  - Sí, representa un superávit mensual de caja.
errores_frecuentes:
- Calcular el porcentaje de cotización previsional a la AFP sobre el sueldo líquido
  recibido en cuenta corriente.
- Sumar directamente la tasa de interés nominal y la inflación pretendiendo obtener
  la rentabilidad real.
- Considerar los gastos variables como egresos de costo fijo que no se pueden modificar
  mensualmente.
- La tasa de inflación del IPC incrementa el poder adquisitivo del dinero depositado
  a tasa fija.
- Clasificar el dividendo pagado por acciones como un gasto imprevisto en el presupuesto
  personal.
afirmaciones_verdaderas:
- 'El balance financiero de caja se calcula restando los egresos totales a los ingresos
  recibidos: $B_{neto} = I_{total} - G_{total}$.'
- La cotización previsional obligatoria a la AFP en Chile equivale al 10% del sueldo
  imponible ajustado al tope legal.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
estado: publicado
