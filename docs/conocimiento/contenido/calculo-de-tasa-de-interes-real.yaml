procedimiento:
- 'Paso 1: Identifica la Tasa Nominal (lo que te pagan).'
- 'Paso 2: Identifica la Inflación del mismo período.'
- 'Paso 3: Resta $Nominal - Inflacion$ para conocer la Tasa Real.'
errores_correccion: Evita confundir los datos de entrada al operar con cálculo de tasa de
  interés real.
ejemplos:
- titulo: Rentabilidad engañosa
  enunciado: Un fondo mutuo rinde 8% en el año, pero la inflación fue del 10%. ¿Cuál fue la
    tasa real aproximada?
  solucion_pasos:
  - Tasa Nominal = $8\%$.
  - Inflación = $10\%$.
  - Tasa Real = $8\% - 10\% = -2\%$.
  - En realidad, perdió un 2% de poder de compra.
- titulo: Ejemplo 2
  enunciado: Con tasa nominal de 9% e inflación de 5%, ¿cuál es la tasa real aproximada?
  alternativas:
  - 4%
  - 14%
  - 5%
  respuesta: 4%
  solucion_pasos:
  - 9% menos 5% es igual a 4%.
- titulo: Ejemplo 3
  enunciado: Con tasa nominal de 3% e inflación de 7%, ¿cuál es la tasa real aproximada?
  alternativas:
  - -4%
  - 4%
  - 10%
  respuesta: -4%
  solucion_pasos:
  - 3% menos 7% es igual a -4%.
- titulo: ¿Una tasa de interés real negativa significa que se pierde poder adquisitivo al
    invertir?
  respuesta: Sí
  solucion_pasos:
  - Aunque se reciban más billetes, esos billetes compran menos que antes.
errores_frecuentes:
- Creer que mientras la tasa del banco sea mayor a 0, siempre se está ganando dinero de verdad.
- Restar al revés (Inflación menos Nominal).
- Creer que mientras la tasa del banco sea mayor a 0, siempre se está ganando dinero de verdad.
- Restar al revés, calculando Inflación menos Nominal en vez de Nominal menos Inflación.
- Olvidar que la fórmula de resta simple es solo una aproximación válida para tasas pequeñas.
afirmaciones_verdaderas:
- La propiedad de cálculo de tasa de interés real preserva la consistencia lógica.
- Si la inflación es mayor que la tasa nominal de una inversión, la tasa de interés real resulta
  negativa.
al_terminar_debes_poder: Resolver problemas aplicados que involucren cálculo de tasa de interés
  real.
