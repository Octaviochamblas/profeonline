semantic_id: MAT.NUM.FINANZAS_PERSONALES.TASA_INTERES_REAL
resumen_inicial: 'Cálculo de tasa de interés real: concepto y propiedades fundamentales
  en Finanzas personales.'
explicacion_simple: Si el banco te da un 5% de premio por guardar tu plata, pero el
  supermercado sube sus precios un 6% ese mismo año, en realidad perdiste dinero.
  El banco te dio más billetes, pero ahora esos billetes compran menos.
explicacion_formal: 'Al evaluar una inversión, debes diferenciar:


  - **Tasa Nominal:** Es el porcentaje bruto que el banco o institución te promete
  pagar (Ej: $7\%$ al año).

  - **Inflación (IPC):** Es la pérdida de poder adquisitivo del dinero (Ej: $4\%$
  al año).

  - **Tasa de Interés Real:** Es el aumento real de tu capacidad de compra.


  La fórmula rápida (y aproximada para tasas pequeñas) es:

  $$\text{Tasa Real} \approx \text{Tasa Nominal} - \text{Inflación}$$


  Si inviertes a una tasa del $7\%$ nominal y la inflación es del $4\%$, tu rentabilidad
  real es solo del $3\%$. Si la inflación fuera mayor a la tasa del banco, tu tasa
  real sería negativa.'
definiciones_clave: '- **Cálculo de tasa de interés real**: Elemento central dentro
  del estudio de Finanzas personales.'
propiedades_relaciones: '- **Propiedad principal**: Relaciones y condiciones numéricas
  aplicables a cálculo de tasa de interés real.'
