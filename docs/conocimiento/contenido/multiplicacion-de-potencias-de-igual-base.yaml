semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.MULTIPLICACION_IGUAL_BASE
resumen_inicial: Al multiplicar potencias de la misma base, se conserva la base y se suman
  los exponentes ($a^m \cdot a^n = a^{m+n}$).
explicacion_simple: 'Cuando multiplicas dos potencias que tienen el mismo número de base,
  no necesitas calcular cada una por separado. Simplemente mantienes esa misma base y **sumas
  sus exponentes**:

  - $2^3 \cdot 2^4 = 2^{3+4} = 2^7 = 128$

  Esto ocurre porque estás juntando $3$ factores de $2$ con otros $4$ factores de $2$, logrando
  $7$ factores en total.'
explicacion_formal: 'Para todo $a \in \mathbb{R}$ y $m, n \in \mathbb{R}$, se cumple la propiedad
  de multiplicación de potencias de igual base:

  $$a^m \cdot a^n = a^{m+n}$$

  Esta regla se fundamenta en la asociatividad de la multiplicación.'
definiciones_clave: '- **Suma de exponentes**: Operación aplicada a los exponentes $m$ y $n$
  al multiplicar potencias de base idéntica.'
propiedades_relaciones: '- **Mantenimiento de la base**: La base se conserva exactamente igual,
  sin multiplicarla entre sí.'
ejemplo_guiado:
  enunciado: Simplifica la expresión $5^2 \cdot 5^4 \cdot 5^{-1}$.
  pasos:
  - 'Verificar que las tres potencias tengan la misma base: $a = 5$.'
  - 'Conservar la base y sumar los tres exponentes: $2 + 4 + (-1)$.'
  - 'Calcular la suma de exponentes: $2 + 4 - 1 = 5$.'
  - Expresar el resultado final como $5^5 = 3125$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué expresión equivale el producto $x^5 \cdot x^3$?
  choices:
  - text: x^8
    is_correct: true
  - text: x^{15}
    is_correct: false
  - text: 2x^8
    is_correct: false
  - text: x^2
    is_correct: false
  explanation: 'La correcta es: x^8. Al multiplicar potencias de igual base, se suman los
    exponentes: $5 + 3 = 8$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de $3^4 \cdot 3^{-2}$?
  choices:
  - text: '9'
    is_correct: true
  - text: '81'
    is_correct: false
  - text: 1/9
    is_correct: false
  - text: 3^{-8}
    is_correct: false
  explanation: 'La correcta es: 9. Sumamos exponentes: $4 + (-2) = 2$, luego $3^2 = 9$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Confirmar que todas las potencias que se multiplican tengan exactamente la misma
  base.'
- 'Paso 2: Conservar la base común.'
- 'Paso 3: Sumar algebraicamente todos los exponentes.'
- 'Paso 4: Escribir la base elevada al resultado de la suma y calcular su valor si es necesario.'
errores_correccion: 'No multipliques las bases. Escribir $2^3 \cdot 2^4 = 4^7$ es un error
  común; la regla exige **conservar la base**: $2^3 \cdot 2^4 = 2^7$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifica $a^3 \cdot a^7$.
  alternativas:
  - a^{10}
  - a^{21}
  - 2a^{10}
  respuesta: a^{10}
  solucion_pasos:
  - $a^{3+7} = a^{10}$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale 7^2 · 7^5?
  alternativas:
  - 7^7
  - 7^10
  - 14^7
  respuesta: 7^7
  solucion_pasos:
  - 'Se conserva la base y se suman los exponentes: 2+5=7.'
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el resultado de x^4 · x^{-1}?
  alternativas:
  - x^3
  - x^{-4}
  - x^5
  respuesta: x^3
  solucion_pasos:
  - 4 + (-1) = 3.
- titulo: ¿Es correcto simplificar 3^2 · 5^2 como 3^4?
  respuesta: 'No'
  solucion_pasos:
  - Las bases 3 y 5 son distintas, por lo que no se pueden sumar los exponentes de esta forma.
errores_frecuentes:
- Multiplicar las bases además de sumar los exponentes.
- Sumar los exponentes de potencias que tienen bases distintas.
- Multiplicar las bases en lugar de conservarlas al sumar los exponentes.
- Olvidar incluir el signo del exponente al sumarlo, especialmente cuando alguno es negativo.
- Aplicar la propiedad a una suma de potencias en vez de a un producto (confundir 2^3+2^4
  con 2^3·2^4).
afirmaciones_verdaderas:
- $a^m \cdot a^n = a^{m+n}$.
- La propiedad de multiplicación de potencias de igual base solo suma los exponentes cuando
  las bases son idénticas.
al_terminar_debes_poder: Aplicar la propiedad de multiplicación de potencias de igual base.
fuente: Texto escolar MINEDUC.
estado: publicado
