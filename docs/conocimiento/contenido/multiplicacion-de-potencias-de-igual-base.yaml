semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.MULTIPLICACION_IGUAL_BASE
resumen_inicial: 'Para multiplicar potencias de igual base, se conserva la base común y se suman algebraicamente sus exponentes: $a^m \cdot a^n = a^{m+n}$.'
explicacion_simple: '![Multiplicación de potencias de igual base](/static/img/nodos/multiplicacion-de-potencias-de-igual-base-intro.svg)


  Cuando multiplicas potencias que tienen exactamente el mismo número abajo (la misma base), no necesitas calcular cada potencia por separado. La regla es muy simple: mantienes la base tal como está y sumas los números pequeños de arriba (los exponentes). Por ejemplo, en $2^3 \cdot 2^4$, tenemos $3$ dos multiplicándose por un lado y otros $4$ dos por el otro; en total son $3 + 4 = 7$ dos multiplicándose, así que el resultado es $2^7 = 128$. ¡Nunca debes multiplicar las bases!'
explicacion_formal: 'Sean $a \in \mathbb{R}$ y $m, n \in \mathbb{R}$ (con $a \neq 0$ si alguno de los exponentes es menor o igual a cero). El **Teorema del Producto de Potencias de Igual Base** establece formalmente que:


  $$a^m \cdot a^n = a^{m+n}$$


  **Demostración para $m, n \in \mathbb{N}$:**

  Por la definición de potencia como producto iterado:

  $$a^m = \underbrace{a \cdot a \cdot \dots \cdot a}_{m \text{ factores}} \quad \text{y} \quad a^n = \underbrace{a \cdot a \cdot \dots \cdot a}_{n \text{ factores}}$$

  Al efectuar la multiplicación de ambas expresiones:

  $$a^m \cdot a^n = \left(\underbrace{a \cdot a \dots a}_{m \text{ factores}}\right) \cdot \left(\underbrace{a \cdot a \dots a}_{n \text{ factores}}\right) = \underbrace{a \cdot a \dots a}_{m+n \text{ factores}} = a^{m+n}$$


  **Generalización a múltiples factores:**

  $$a^{p} \cdot a^{q} \cdot a^{r} = a^{p+q+r}$$'
definiciones_clave: '- **Base común ($a$)**: Número o término algebraico idéntico que se conserva inalterado durante la operación.

  - **Suma de exponentes ($m+n$)**: Adición algebraica de los grados de las potencias multiplicadas.'
propiedades_relaciones: '- **Término con exponente implícito**: $a \cdot a^n = a^1 \cdot a^n = a^{1+n}$.

  - **Exponente negativo**: $a^m \cdot a^{-n} = a^{m+(-n)} = a^{m-n}$.

  - **Incompatibilidad con la suma**: $a^m + a^n \neq a^{m+n}$ (solo se pueden sumar como términos semejantes si $m = n$).'
ejemplo_guiado:
  enunciado: '![Ejemplos de multiplicación de igual base](/static/img/nodos/multiplicacion-de-potencias-de-igual-base-ejemplos.svg)


    Calcule y exprese como una única potencia irreducible las expresiones $3^2 \cdot 3^3$, $5^4 \cdot 5^{-2}$ y $x^{1/2} \cdot x^{3/2}$.'
  pasos:
  - 'Paso 1: Evaluar $3^2 \cdot 3^3$: La base común es $3$. Se suman los exponentes: $2 + 3 = 5$. Resultado: $3^5 = 243$. (Advertencia: $3 \cdot 3 = 9 \implies 9^5$ es incorrecto).'
  - 'Paso 2: Evaluar $5^4 \cdot 5^{-2}$: La base común es $5$. Se suman algebraicamente los exponentes: $4 + (-2) = 2$. Resultado: $5^2 = 25$.'
  - 'Paso 3: Evaluar $x^{1/2} \cdot x^{3/2}$: La base común es $x$. Se suman las fracciones: $\frac{1}{2} + \frac{3}{2} = \frac{4}{2} = 2$. Resultado: $x^2$.'
  - 'Conclusión: Los resultados simplificados son $3^5 = 243$, $5^2 = 25$ y $x^2$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de simplificar $2^4 \cdot 2^3$?
  choices:
  - text: $2^7 = 128$ (conservando la base $2$ y sumando exponentes $4+3=7$)
    is_correct: true
  - text: $4^7$
    is_correct: false
  - text: $4^{12}$
    is_correct: false
  - text: $2^{12}$
    is_correct: false
  explanation: La alternativa correcta es '$2^7 = 128$ (conservando la base $2$ y sumando exponentes $4+3=7$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el resultado de operar $x^{1/2} \cdot x^{3/2}$?
  choices:
  - text: $x^2$ (porque $\frac{1}{2} + \frac{3}{2} = \frac{4}{2} = 2$)
    is_correct: true
  - text: $x^{3/4}$
    is_correct: false
  - text: $x^1$
    is_correct: false
  - text: $2x$
    is_correct: false
  explanation: La alternativa correcta es '$x^2$ (porque $\frac{1}{2} + \frac{3}{2} = \frac{4}{2} = 2$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que todas las potencias en la multiplicación compartan exactamente la misma base.'
- 'Paso 2: Conservar la base idéntica y sumar algebraicamente todos los exponentes ($m + n + \dots$).'
- 'Paso 3: Calcular o simplificar la potencia resultante según sea requerido.'
errores_correccion: '- **Error 1: Multiplicar las bases (pensar que $2^3 \cdot 2^2 = 4^5$).** **Cómo corregirlo:** La base representa el factor que se repite, no una cantidad a multiplicar entre sí. Se MANTIENE la base ($2^{3+2} = 2^5 = 32$).

  - **Error 2: Multiplicar los exponentes en lugar de sumarlos ($a^3 \cdot a^4 = a^{12}$).** **Cómo corregirlo:** En el producto de igual base los exponentes se SUMAN ($a^{3+4} = a^7$). La multiplicación de exponentes solo ocurre en potencia de potencia $((a^3)^4 = a^{12})$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de simplificar $4^3 \cdot 4^2$?
  alternativas:
  - $4^5 = 1024$
  - $16^5$
  - $4^6$
  respuesta: $4^5 = 1024$
  solucion_pasos:
  - Se conserva la base $4$ y se suman los exponentes $3+2=5 \implies 4^5 = 1024$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale la expresión $y \cdot y^5$?
  alternativas:
  - $y^6$
  - $y^5$
  - $2y^5$
  respuesta: $y^6$
  solucion_pasos:
  - $y = y^1 \implies y^1 \cdot y^5 = y^{1+5} = y^6$.
- titulo: ¿Es 2³ · 2³ igual a 2⁶?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2^3 \cdot 2^3 = 2^{3+3} = 2^6 = 64$.
  alternativas:
  - texto: Sí, se conserva la base 2 y se suman exponentes 3+3=6
    es_correcta: true
    retroalimentacion: ¡Correcto! $a^m \cdot a^n = a^{m+n}$.
  - texto: No, es igual a 4⁶
    es_correcta: false
    retroalimentacion: Incorrecto, las bases no se multiplican.
  - texto: No, es igual a 2⁹
    es_correcta: false
    retroalimentacion: Incorrecto, los exponentes no se multiplican.
- titulo: ¿Es 3² + 3³ igual a 3⁵?
  respuesta: 'No'
  solucion_pasos:
  - 'No, la propiedad aplica al producto, no a la suma: $3^2 + 3^3 = 9 + 27 = 36 \neq 3^5 = 243$.'
  alternativas:
  - texto: No, la propiedad de sumar exponentes no aplica a la suma de potencias
    es_correcta: true
    retroalimentacion: ¡Correcto! $3^2 + 3^3 = 36$ mientras que $3^5 = 243$.
  - texto: Sí, se suman los exponentes normalmente
    es_correcta: false
    retroalimentacion: Incorrecto, la suma de potencias no suma exponentes.
  - texto: Sí, porque la base es 3
    es_correcta: false
    retroalimentacion: Incorrecto, solo aplica a la multiplicación.
errores_frecuentes:
- Multiplicar las bases en vez de conservarlas ($2^3 \cdot 2^2 = 4^5$).
- Multiplicar los exponentes en lugar de sumarlos ($x^3 \cdot x^4 = x^{12}$).
- Olvidar el exponente 1 implícito en factores simples ($x \cdot x^3 = x^3$ en vez de $x^4$).
- Aplicar la regla a sumas de potencias ($a^2 + a^3 = a^5$).
- Intentar sumar exponentes cuando las bases son diferentes sin transformarlas ($2^3 \cdot 3^2$ no se suma).
afirmaciones_verdaderas:
- Para toda base real $a$ y exponentes $m, n$, $a^m \cdot a^n = a^{m+n}$.
- Al multiplicar potencias de igual base, la base permanece constante.
- Cualquier factor sin exponente explícito participa con exponente $1$ en la suma.
al_terminar_debes_poder: '![Síntesis de multiplicación de igual base](/static/img/nodos/multiplicacion-de-potencias-de-igual-base-resumen.svg)


  QUÉ: Multiplicar potencias de igual base en expresiones numéricas y algebraicas.


  CÓMO: Conservando la base común $a$ y sumando algebraicamente sus exponentes ($a^m \cdot a^n = a^{m+n}$), reconociendo exponentes implícitos iguales a $1$ y evitando multiplicar las bases o sumar exponentes en adiciones.'
