semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.MULTIPLICACION_IGUAL_BASE
resumen_inicial: 'Al multiplicar dos o más potencias de igual base $a^m \cdot a^n$,
  se mantiene la base común $a$ y se suman sus exponentes: $a^m \cdot a^n = a^{m+n}$.'
explicacion_simple: Cuando multiplicamos potencias que tienen exactamente la misma
  base, no hace falta calcular cada una por separado. Simplemente conservamos la misma
  base y sumamos las cantidades de los exponentes para saber cuántos factores hay
  en total.
explicacion_formal: 'Para todo $a \in \mathbb{R}$ y exponentes $m, n \in \mathbb{R}$,
  el **Producto de Potencias de Igual Base** cumple la ley algebraica:


  $$a^m \cdot a^n = a^{m+n}$$


  **Demostración para $m, n \in \mathbb{N}$:**

  $$a^m \cdot a^n = \underbrace{(a \cdot a \dots a)}_{m \text{ factores}} \cdot \underbrace{(a
  \cdot a \dots a)}_{n \text{ factores}} = \underbrace{a \cdot a \dots a}_{m+n \text{
  factores}} = a^{m+n}$$


  > **Complemento didáctico:** Esta propiedad exige que la base sea exactamente la
  misma en todos los factores multiplicados.'
definiciones_clave: '- **Multiplicación de potencias de igual base**: Regla $a^m \cdot
  a^n = a^{m+n}$ donde la base se conserva y los exponentes se suman.'
propiedades_relaciones: '- **Suma de exponentes**: Transforma el producto de potencias
  en una adición escalar de sus exponentes.'
ejemplo_guiado:
  enunciado: Simplifique a una sola potencia el producto $2^3 \cdot 2^4 \cdot 2^{-2}$.
  pasos:
  - 'Paso 1: Verificar que la base sea idéntica en todos los términos: la base común
    es $2$.'
  - 'Paso 2: Conservar la base y sumar los exponentes: $3 + 4 + (-2)$.'
  - 'Paso 3: Realizar la suma de exponentes: $3 + 4 - 2 = 5$.'
  - 'Conclusión: El producto simplificado es $2^5 = 32$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué se hace con los exponentes al multiplicar potencias que tienen la
    misma base?
  choices:
  - text: Se conserva la misma base y se suman sus exponentes (a^{m+n})
    is_correct: true
  - text: Se multiplican los exponentes (a^{m · n})
    is_correct: false
  - text: Se restan los exponentes
    is_correct: false
  - text: Se dividen las bases
    is_correct: false
  explanation: La alternativa correcta es 'Se conserva la misma base y se suman sus
    exponentes (a^{m+n})'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 2^3 · 2^4 · 2^{-2}, ¿cuál fue la potencia resultante?
  choices:
  - text: 2^5
    is_correct: true
  - text: 2^{24}
    is_correct: false
  - text: 8^5
    is_correct: false
  - text: 2^9
    is_correct: false
  explanation: La alternativa correcta es '2^5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que los términos de la multiplicación tengan exactamente la misma
  base.'
- 'Paso 2: Conservar la base común en la expresión resultante.'
- 'Paso 3: Sumar algebraicamente todos los exponentes dados ($m + n + \dots$).'
errores_correccion: '- **Error 1: Multiplicar las bases en lugar de conservarlas ($2^3
  \cdot 2^4 = 4^7$).** **Cómo corregirlo:** La base NO se multiplica entre sí; se
  MANTIENE intacta ($2^3 \cdot 2^4 = 2^7$).


  - **Error 2: Multiplicar los exponentes ($2^3 \cdot 2^4 = 2^{12}$).** **Cómo corregirlo:**
  En la multiplicación de igual base los exponentes se SUMAN ($3 + 4 = 7$), no se
  multiplican.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Simplifique $5^2 \cdot 5^6$.
  alternativas:
  - 5^8
  - 25^8
  - 5^{12}
  respuesta: 5^8
  solucion_pasos:
  - $5^{2+6} = 5^8$.
- titulo: Ejemplo 2
  enunciado: Simplifique $x^4 \cdot x^{-1}$.
  alternativas:
  - x^3
  - x^{-4}
  - x^5
  respuesta: x^3
  solucion_pasos:
  - $x^{4 + (-1)} = x^3$.
- titulo: ¿Es 3^2 · 3^3 igual a 3^5?
  respuesta: Sí
  solucion_pasos:
  - Sí, $2+3 = 5$.
- titulo: ¿Aplica la regla de sumar exponentes a la suma de potencias (a^m + a^n)?
  respuesta: 'No'
  solucion_pasos:
  - No, la regla aplica ÚNICAMENTE a la multiplicación ($a^m \cdot a^n$).
errores_frecuentes:
- Multiplicar las bases entre sí al resolver un producto de potencias de igual base.
- Multiplicar los exponentes al realizar la multiplicación de potencias de igual base.
- Aplicar la regla de sumar exponentes sobre una suma de potencias $a^m + a^n$.
- La multiplicación $3^2 \cdot 3^4$ da como resultado la potencia $9^6$.
- Sumar las bases y restar los exponentes al multiplicar potencias iguales.
afirmaciones_verdaderas:
- Al multiplicar potencias de igual base se mantiene la base y se suman los exponentes
  ($a^m \cdot a^n = a^{m+n}$).
- Esta propiedad no es aplicable a la adición ni a la sustracción de potencias.
al_terminar_debes_poder: Al terminar serás capaz de simplificar productos de potencias
  de igual base $a^m \cdot a^n = a^{m+n}$, conservando la base común y sumando sus
  exponentes.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
