semantic_id: MAT.GEO.TEOREMA_COSENOS.APLICACION
resumen_inicial: 'El Teorema del Coseno se aplica en el caso LAL para calcular el tercer lado mediante $a = \sqrt{b^2 + c^2 - 2bc\cos(\alpha)}$ y en el caso LLL para calcular cualquier ángulo mediante $\cos(\alpha) = \frac{b^2 + c^2 - a^2}{2bc}$.'
explicacion_simple: |
  ![Aplicación del Teorema del Coseno: Casos LAL y LLL](/static/img/nodos/aplicacion-del-teorema-del-coseno-para-calcular-el-tercer-lado-o-un-angulo-de-un-triangulo-cualquiera-intro.svg)

  Si tienes dos lados y el ángulo del medio (LAL), hallas el tercer lado con la raíz cuadrada. Si tienes los tres lados (LLL), despejas el coseno para descubrir el ángulo.
explicacion_formal: |
  ### Algoritmo formal de resolución
  Dado un triángulo oblicuángulo $\Delta ABC$:

  1. **Caso LAL (Calcular el tercer lado $a$)**:
     - Dados $b, c$ y $\alpha$:
       $$a = \sqrt{b^2 + c^2 - 2bc\cos(\alpha)}$$

  2. **Caso LLL (Calcular un ángulo interior $\alpha$)**:
     - Dados $a, b, c$:
       $$\cos(\alpha) = \frac{b^2 + c^2 - a^2}{2bc} \implies \alpha = \arccos\left(\frac{b^2 + c^2 - a^2}{2bc}\right)$$

  ### Desglose simbólico y geométrico
  - Condición de existencia: Por la desigualdad triangular, $|b - c| < a < b + c$, lo que garantiza que $-1 < \frac{b^2 + c^2 - a^2}{2bc} < 1$.
  - Clasificación angular:
    - Si $b^2 + c^2 - a^2 > 0 \implies \cos(\alpha) > 0 \implies \alpha < 90^\circ$ (Agudo).
    - Si $b^2 + c^2 - a^2 = 0 \implies \cos(\alpha) = 0 \implies \alpha = 90^\circ$ (Recto).
    - Si $b^2 + c^2 - a^2 < 0 \implies \cos(\alpha) < 0 \implies \alpha > 90^\circ$ (Obtuso).

  ### Síntesis didáctica
  Esta dualidad LAL/LLL convierte al Teorema del Coseno en el método universal para resolver poligonales en topografía, navegación y física de fuerzas.
definiciones_clave: |
  - **Teorema del Coseno**: Relación métrica que generaliza el Teorema de Pitágoras a cualquier triángulo plano.
  - **Caso LAL**: Configuración geométrica donde se conocen dos lados y el ángulo comprendido entre ellos.
  - **Caso LLL**: Configuración geométrica donde se conocen las tres longitudes de los lados.
  - **Término de corrección**: Término $-2bc\cos(\alpha)$ que ajusta la métrica según la apertura angular.
propiedades_relaciones: |
  - **Forma estándar**: $a^2 = b^2 + c^2 - 2bc\cos(\alpha)$.
  - **Despeje angular**: $\cos(\alpha) = \frac{b^2 + c^2 - a^2}{2bc}$.
  - **Conexión con Pitágoras**: Para $\alpha = 90^\circ$, $\cos(90^\circ) = 0 \implies a^2 = b^2 + c^2$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Aplicación del Teorema del Coseno: Casos LAL y LLL](/static/img/nodos/aplicacion-del-teorema-del-coseno-para-calcular-el-tercer-lado-o-un-angulo-de-un-triangulo-cualquiera-ejemplos.svg)

    Aplica el Teorema del Coseno para calcular el elemento métrico o angular solicitado en el triángulo oblicuángulo.
  pasos:
  - 'Paso 1: Identificar los datos dados (caso LAL o caso LLL).'
  - 'Paso 2: Plantear la ecuación del Teorema del Coseno correspondiente al elemento incógnita.'
  - 'Paso 3: Sustituir las longitudes y el valor del coseno del ángulo.'
  - 'Paso 4: Efectuar las operaciones aritméticas respetando la jerarquía de las multiplicaciones.'
  - 'Paso 5: Extraer la raíz cuadrada positiva para hallar el lado o calcular la función inversa arccos para el ángulo.'
checkpoints:
- placement: after_explicacion_formal
  question: En un triángulo de lados a = 7 cm, b = 5 cm y c = 8 cm, ¿cuánto vale cos(α)?
  choices:
  - text: $\cos(\alpha) = \frac{5^2 + 8^2 - 7^2}{2 \cdot 5 \cdot 8} = \frac{40}{80} = 0{,}5$
    is_correct: true
  - text: Opción incorrecta de prueba A
    is_correct: false
  - text: Opción incorrecta de prueba B
    is_correct: false
  - text: Opción incorrecta de prueba C
    is_correct: false
  explanation: 'Vale $\cos(\alpha) = \frac{5^2 + 8^2 - 7^2}{2 \cdot 5 \cdot 8} = \frac{40}{80} = 0{,}5$ (lo que corresponde a un ángulo $\alpha = 60^\circ$).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si b = 6 cm, c = 10 cm y α = 60° (cos(60°) = 0,5), ¿cuánto mide el lado a?
  choices:
  - text: $2\sqrt{19}\text{ cm} \approx 8{,}72\text{ cm}$
    is_correct: true
  - text: $20\text{ cm}$
    is_correct: false
  - text: $100\text{ cm}$
    is_correct: false
  - text: $5\text{ cm}$
    is_correct: false
  explanation: 'Mide $2\sqrt{19}\text{ cm} \approx 8{,}72\text{ cm}$, ya que $a = \sqrt{6^2 + 10^2 - 2(6)(10)(0{,}5)} = \sqrt{36 + 100 - 60} = \sqrt{76} = 2\sqrt{19}\text{ cm}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Dibujar el triángulo y etiquetar los vértices $A, B, C$ y lados opuestos $a, b, c$.'
- 'Paso 2: Verificar si se dispone de LAL (dos lados y ángulo entre ellos) o LLL (tres lados).'
- 'Paso 3: Usar $a^2 = b^2 + c^2 - 2bc\cos(\alpha)$ o $\cos(\alpha) = (b^2 + c^2 - a^2)/(2bc)$.'
- 'Paso 4: Realizar los cálculos numéricos con precisión.'
- 'Paso 5: Comprobar que el lado resultante cumpla la desigualdad triangular $|b - c| < a < b + c$.'
errores_correccion: 'No olvides la jerarquía de operaciones: nunca restes $b^2 + c^2 - 2bc$ antes de multiplicar por $\cos(\alpha)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor correspondiente calculado con el Teorema del Coseno?
  alternativas:
  - '$2\sqrt{19}\text{ cm} \approx 8{,}72\text{ cm}$'
  - 'Valor incorrecto 1'
  - 'Valor incorrecto 2'
  respuesta: '$2\sqrt{19}\text{ cm} \approx 8{,}72\text{ cm}$'
  solucion_pasos:
  - 'Mide $2\sqrt{19}\text{ cm} \approx 8{,}72\text{ cm}$, ya que $a = \sqrt{6^2 + 10^2 - 2(6)(10)(0{,}5)} = \sqrt{36 + 100 - 60} = \sqrt{76} = 2\sqrt{19}\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: ¿El Teorema del Coseno se puede aplicar en cualquier triángulo, no solo en rectángulos?
  alternativas:
  - Sí, es válido para todo triángulo plano (acutángulo, rectángulo u obtusángulo)
  - No, solo funciona en triángulos equiláteros
  - Solo si el triángulo tiene un ángulo de 60°
  respuesta: Sí, es válido para todo triángulo plano (acutángulo, rectángulo u obtusángulo)
  solucion_pasos:
  - 'El Teorema del Coseno es una ley métrica general válida para cualquier configuración triangular en el plano euclidiano.'
- titulo: ¿Si el ángulo α es de 90°, el Teorema del Coseno coincide con el Teorema de Pitágoras?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, como $\cos(90^\circ) = 0$, el término $-2bc\cos(90^\circ)$ se anula y queda $a^2 = b^2 + c^2$.'
- titulo: ¿En un triángulo oblicuángulo el término de corrección es siempre positivo?
  respuesta: 'No'
  solucion_pasos:
  - 'No, el signo depende del coseno: si el ángulo es agudo $\cos(\alpha) > 0$ (el término resta), pero si es obtuso $\cos(\alpha) < 0$ (el término se vuelve positivo al multiplicar dos signos negativos).'
errores_frecuentes:
- 'Restar $b^2 + c^2 - 2bc$ antes de multiplicar por el coseno (error de prioridad de operadores).'
- 'Usar un ángulo que no sea el comprendido entre los dos lados conocidos en el caso LAL.'
- 'Olvidar cambiar de signo cuando el ángulo es obtuso ($\cos(\alpha) < 0$).'
- 'Restar el lado incorrecto en la fórmula de despeje de LLL.'
- 'Olvidar sacar la raíz cuadrada final al calcular el lado $a$.'
afirmaciones_verdaderas:
- 'El Teorema del Coseno establece que $a^2 = b^2 + c^2 - 2bc\cos(\alpha)$ en todo triángulo plano.'
- 'Si el ángulo comprendido es recto ($90^\circ$), el Teorema del Coseno se reduce exactamente al Teorema de Pitágoras.'
al_terminar_debes_poder: |
  **QUÉ:** Enunciar y aplicar el Teorema del Coseno para calcular lados y ángulos en triángulos oblicuángulos.

  **CÓMO:** Usando $a = \sqrt{b^2 + c^2 - 2bc\cos\alpha}$ en el caso LAL y $\cos\alpha = \frac{b^2 + c^2 - a^2}{2bc}$ en el caso LLL.

  ![Resumen del Teorema del Coseno](/static/img/nodos/aplicacion-del-teorema-del-coseno-para-calcular-el-tercer-lado-o-un-angulo-de-un-triangulo-cualquiera-resumen.svg)
