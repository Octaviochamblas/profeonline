semantic_id: MAT.NUM.FACTORIZACION_PRIMA.FACTOR_PRIMO_CONCEPTO
resumen_inicial: "Un factor primo es un número primo que divide exactamente a otro número entero."
explicacion_simple: |
  Imagina que tienes una caja de bloques de Lego. Con ellos puedes armar cualquier
  juguete. En el mundo de los números, los primos son como esos bloques básicos e
  indivisibles. Si desarmas cualquier número compuesto (como el 12), encontrarás que está
  construido multiplicando números primos (en este caso, 2 y 3). A cada uno de estos
  bloques primos los llamamos factores primos.
explicacion_formal: |
  Un **factor primo** de un número $N$ es un número que es a la vez **primo** y
  **divisor** de $N$. Por ejemplo, los divisores de $20$ son $\{1,2,4,5,10,20\}$; de
  ellos, solo $2$ y $5$ son primos. Por lo tanto, los factores primos de $20$ son $2$ y
  $5$.
definiciones_clave: |
  **Factor primo**: divisor de un número que además es primo. No es lo mismo que "divisor"
  (que incluye también los compuestos).
propiedades_relaciones: |
  Todo número compuesto tiene al menos dos factores primos combinados (posiblemente
  repetidos); los números primos solo tienen un factor primo: ellos mismos.
ejemplo_guiado:
  enunciado: "Encuentra los factores primos de 30."
  pasos:
    - 'Los divisores de 30 son $\{1,2,3,5,6,10,15,30\}$.'
    - "De esa lista, los primos son $2$, $3$ y $5$."
    - "Conclusión: los factores primos de 30 son 2, 3 y 5."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué diferencia a un factor primo de un divisor cualquiera?"
    choices:
      - {text: "El factor primo, además de ser divisor, debe ser un número primo", is_correct: true}
      - {text: "El factor primo es siempre el número más pequeño de la lista", is_correct: false}
      - {text: "No hay diferencia, son lo mismo", is_correct: false}
      - {text: "El factor primo es el divisor más grande", is_correct: false}
    explanation: "La correcta es El factor primo, además de ser divisor, debe ser un número primo: un divisor compuesto (como 4 o 6) no cuenta como factor primo."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuáles son los factores primos de 42?"
    choices:
      - {text: "2, 3 y 7", is_correct: true}
      - {text: "1, 2, 3, 6, 7, 14, 21, 42", is_correct: false}
      - {text: "6 y 7", is_correct: false}
      - {text: "No se puede saber", is_correct: false}
    explanation: "La correcta es 2, 3 y 7: de los divisores de 42, solo esos tres son números primos."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identifica todos los divisores enteros del número dado.'
  - 'Paso 2: Revisa la lista de divisores y selecciona únicamente aquellos que sean números primos (recuerda que el 1 no es primo).'
  - 'Paso 3: Escribe los factores primos seleccionados sin repetirlos.'
errores_correccion: |
  Un error frecuente es considerar al 1 como factor primo, cuando en realidad no es
  primo. Otro error es incluir divisores compuestos (como decir que 6 es factor primo de
  18) sin verificar que sean primos.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Encuentra los factores primos de $15$.'
    alternativas:
      - "3 y 5"
      - "1, 3, 5 y 15"
      - "5 y 15"
    respuesta: "3 y 5"
    solucion_pasos:
      - 'Paso a: Encontramos los divisores de $15$, que son: $\{1, 3, 5, 15\}$.'
      - 'Paso b: Identificamos cuáles de estos divisores son números primos. Estos son el $3$ y el $5$.'
      - 'Paso c: Concluimos que los factores primos de $15$ son $3$ y $5$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Determina cuáles son los factores primos de $8$.'
    alternativas:
      - "Solo el 2"
      - "2 y 4"
      - "1, 2, 4 y 8"
    respuesta: "Solo el 2"
    solucion_pasos:
      - 'Paso a: Encontramos todos los divisores de $8$, que son: $\{1, 2, 4, 8\}$.'
      - 'Paso b: Filtramos los que son primos. El único número primo en este conjunto es el $2$.'
      - 'Paso c: Por lo tanto, el único factor primo de $8$ es el $2$.'
  - titulo: '¿Es el número $5$ un factor primo de $35$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'El número $5$ es un número primo porque solo tiene como divisores a $1$ y a $5$.'
      - 'Además, $5$ divide de forma exacta a $35$ ($35 \div 5 = 7$, residuo $0$).'
      - 'Por lo tanto, $5$ sí es un factor primo de $35$.'
  - titulo: '¿Es el número $4$ un factor primo de $12$?'
    respuesta: 'No'
    solucion_pasos:
      - 'Aunque $4$ es un divisor de $12$ ($12 \div 4 = 3$), el número $4$ no es un número primo (tiene como divisores a $1$, $2$ y $4$).'
      - 'Como no es primo, no puede ser un factor primo de $12$.'
errores_frecuentes:
  - 'Considerar al número 1 como un factor primo de cualquier número, cuando en realidad el 1 no es un número primo.'
  - 'Incluir números compuestos como factores primos solo porque son divisores del número dado (por ejemplo, decir que 6 es un factor primo de 18).'
  - 'Pensar que un número impar no puede tener factores primos pares, olvidando que el 2 es el único primo par.'
  - 'Confundir la lista de todos los divisores con la lista de factores primos.'
  - 'Creer que la cantidad de factores primos de un número compuesto siempre debe ser mayor a 2.'
afirmaciones_verdaderas:
  - "Un factor primo debe ser a la vez divisor y número primo."
  - "2 y 5 son los factores primos de 20."
al_terminar_debes_poder: |
  Definir qué es un factor primo e identificar todos los factores primos de un número
  dado.
fuente: 'Teoría de Números'
estado: publicado
