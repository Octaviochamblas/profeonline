semantic_id: MAT.NUM.FACTORIZACION_PRIMA.FACTOR_PRIMO_CONCEPTO
resumen_inicial: Un factor primo de $n$ es un número que satisface simultáneamente
  ser un divisor exacto de $n$ y ser un número primo.
explicacion_simple: Un factor primo es un número divisor que además posee la propiedad
  de ser primo. Representa cada uno de los bloques atómicos o piezas fundamentales
  con los que se construye un número compuesto al multiplicarlos entre sí.
explicacion_formal: 'Para un entero $n > 1$, un número $p \in \mathbb{N}$ se define
  como un **Factor Primo** de $n$ si cumple la conjunción:


  $$p \mid n \quad \land \quad p \in \text{Primos}$$


  **Desglose de la fórmula:**

  - $p \mid n$: La división $n : p$ es exacta con residuo cero ($n = p \cdot k$).

  - $p \in \text{Primos}$: El divisor $p$ posee exactamente dos divisores positivos
  ($|D(p)| = 2$).


  > **Complemento didáctico:** Los divisores de 12 son $\{1, 2, 3, 4, 6, 12\}$, pero
  únicamente el 2 y el 3 son sus factores primos.'
definiciones_clave: '- **Factor primo**: Divisor exacto que pertenece al conjunto
  de los números primos.

  - **Divisores no primos**: Divisores que son compuestos (como 4 u 6) o la unidad
  (1).'
propiedades_relaciones: '- **Menor factor primo**: El menor divisor propio de todo
  compuesto $n > 1$ es siempre un número primo.'
ejemplo_guiado:
  enunciado: Identifique cuáles de los divisores del número $20$ son factores primos.
  pasos:
  - 'Paso 1: Obtener todos los divisores positivos de 20: $D(20) = \{1, 2, 4, 5, 10,
    20\}$.'
  - 'Paso 2: Filtrar los divisores comprobando cuáles son primos: 1 es unidad (no
    primo), 4, 10 y 20 son compuestos.'
  - 'Paso 3: Seleccionar los elementos primos: el 2 y el 5 son primos.'
  - 'Conclusión: Los factores primos de 20 son $\{2, 5\}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición debe cumplir un número p para ser factor primo de n?
  choices:
  - text: Ser divisor exacto de n y ser un número primo
    is_correct: true
  - text: Ser un número par mayor que n
    is_correct: false
  - text: Ser el resultado de sumar n + 1
    is_correct: false
  - text: Tener más de 4 divisores
    is_correct: false
  explanation: La alternativa correcta es 'Ser divisor exacto de n y ser un número
    primo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado con 20, ¿cuáles de sus divisores son sus factores
    primos?
  choices:
  - text: 2 y 5
    is_correct: true
  - text: 4 y 10
    is_correct: false
  - text: 1 y 20
    is_correct: false
  - text: Todos sus divisores
    is_correct: false
  explanation: La alternativa correcta es '2 y 5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Encontrar todos los divisores del número entero $n$.'
- 'Paso 2: Evaluar la primalidad de cada uno de los divisores de la lista.'
- 'Paso 3: Conservar únicamente aquellos divisores que tengan exactamente dos divisores
  positivos.'
errores_correccion: '- **Error 1: Confundir divisores generales con factores primos.**
  Incluir al 4 o al 6 como factores primos de 12. **Cómo corregirlo:** 4 y 6 son divisores
  compuestos, no factores primos.


  - **Error 2: Incluir al 1 como factor primo de un número.** **Cómo corregirlo:**
  El 1 es la unidad y no se considera factor primo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuáles son los factores primos de 18?
  alternativas:
  - 2 y 3
  - 2, 3 y 9
  - 1, 2, 3 y 6
  respuesta: 2 y 3
  solucion_pasos:
  - 'Divisores: $\{1, 2, 3, 6, 9, 18\}$. Primos en la lista: 2 y 3.'
- titulo: Ejemplo 2
  enunciado: ¿Es el número 5 un factor primo de 30?
  alternativas:
  - Sí, porque 5 es primo y divide exactamente a 30
  - No, porque 30 es par
  - No, porque 5 es impar
  respuesta: Sí, porque 5 es primo y divide exactamente a 30
  solucion_pasos:
  - '$30 : 5 = 6$ exacto y 5 es primo, por lo tanto es factor primo.'
- titulo: ¿Es todo factor primo un divisor del número?
  respuesta: Sí
  solucion_pasos:
  - Sí, ser divisor es un requisito indispensable de la definición.
- titulo: ¿Es el número 8 un factor primo de 24?
  respuesta: 'No'
  solucion_pasos:
  - No, 8 es un divisor pero es compuesto ($8 = 2^3$).
errores_frecuentes:
- Todos los divisores de un número entero son automáticamente factores primos.
- El número 1 es el primer factor primo de cualquier número entero.
- Un número entero compuesto puede tener un factor primo mayor que el propio número.
- Los factores primos de un número impar son siempre números impares pares.
- Los factores primos de un número son las partes obtenidas al restarle 2.
afirmaciones_verdaderas:
- Un factor primo de $n$ es un divisor exacto de $n$ que además es un número primo.
- Los números compuestos pueden tener divisores que no son factores primos (como los
  divisores compuestos).
al_terminar_debes_poder: Al terminar serás capaz de identificar los factores primos
  de cualquier entero, filtrando sus divisores exactos y seleccionando únicamente
  aquellos que son números primos.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
