semantic_id: MAT.GEO.PITAGORAS.CALCULO_HIPOTENUSA
resumen_inicial: 'Para calcular la longitud de la hipotenusa $c$ en un triángulo rectángulo con catetos conocidos $a$ y $b$, se extrae la raíz cuadrada de la suma de sus cuadrados: $c = \sqrt{a^2 + b^2}$.'
explicacion_simple: |
  ![Cálculo de la Hipotenusa](/static/img/nodos/calculo-de-la-hipotenusa-dados-los-dos-catetos-intro.svg)

  Cuando conoces las medidas de los dos catetos y quieres saber cuánto mide el lado largo (hipotenusa):

  - **Paso 1**: Elevas al cuadrado cada cateto ($a \times a$ y $b \times b$).
  - **Paso 2**: Sumas ambos resultados ($a^2 + b^2$).
  - **Paso 3**: Le sacas la raíz cuadrada al total ($\sqrt{a^2 + b^2}$).
explicacion_formal: |
  ### Algoritmo formal
  Dado un triángulo rectángulo $\Delta ABC$ con catetos de longitudes conocidas $a, b \in \mathbb{R}^+$, la longitud de la hipotenusa $c$ es la solución positiva única de la ecuación cuadrática de Pitágoras:

  $$c^2 = a^2 + b^2 \implies c = \sqrt{a^2 + b^2}$$

  ### Desglose simbólico y geométrico
  - $a, b$: Longitudes dadas de los catetos perpendiculares ($a, b > 0$).
  - $a^2 + b^2$: Radicando escalar estrictamente positivo.
  - $c = \sqrt{a^2 + b^2}$: Raíz aritmética principal positiva (se descarta la solución negativa $-c$ por ser una distancia física).
  - Cota métrica: $\max(a, b) < c < a + b$.

  ### Síntesis didáctica
  Este algoritmo proporciona la solución directa e inequívoca para calcular la distancia en línea recta entre dos puntos ortogonales en el plano euclidiano.
definiciones_clave: |
  - **Fórmula de la hipotenusa**: Expresión algebraica $c = \sqrt{a^2 + b^2}$.
  - **Radicando pitagórico**: Valor numérico obtenido de la suma $a^2 + b^2$.
  - **Raíz aritmética principal**: Valor real no negativo que resuelve la ecuación $x^2 = k$.
propiedades_relaciones: |
  - **Monotonía**: A mayores catetos, mayor es la hipotenusa resultante.
  - **Radicales inexactos**: Si $a^2 + b^2$ no es un cuadrado perfecto, el resultado se expresa como radical simplificado (ej. $\sqrt{50} = 5\sqrt{2}$) o aproximación decimal.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Cálculo de Hipotenusa](/static/img/nodos/calculo-de-la-hipotenusa-dados-los-dos-catetos-ejemplos.svg)

    Un triángulo rectángulo tiene catetos que miden $a = 9\text{ cm}$ y $b = 12\text{ cm}$. Calcula la longitud exacta de la hipotenusa $c$.
  pasos:
  - 'Paso 1: Identificar los catetos: $a = 9\text{ cm}$ y $b = 12\text{ cm}$.'
  - 'Paso 2: Elevar al cuadrado cada cateto: $a^2 = 9^2 = 81$ y $b^2 = 12^2 = 144$.'
  - 'Paso 3: Sumar los cuadrados: $a^2 + b^2 = 81 + 144 = 225$.'
  - 'Paso 4: Extraer la raíz cuadrada del resultado: $c = \sqrt{225} = 15\text{ cm}$.'
  - 'Paso 5: Concluir que la hipotenusa mide exactamente $15\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se despeja la hipotenusa c en función de los catetos a y b?
  choices:
  - text: $c = \sqrt{a^2 + b^2}$
    is_correct: true
  - text: $c = \sqrt{a^2 - b^2}$
    is_correct: false
  - text: $c = a + b$
    is_correct: false
  - text: $c = (a + b)^2$
    is_correct: false
  explanation: 'La hipotenusa se calcula extrayendo la raíz cuadrada de la suma de los cuadrados de los catetos ($c = \sqrt{a^2 + b^2}$).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si los catetos de un triángulo rectángulo miden 8 cm y 15 cm, ¿cuánto mide la hipotenusa?
  choices:
  - text: $17\text{ cm}$
    is_correct: true
  - text: $23\text{ cm}$
    is_correct: false
  - text: $13\text{ cm}$
    is_correct: false
  - text: $16\text{ cm}$
    is_correct: false
  explanation: 'Mide $17\text{ cm}$, ya que $c = \sqrt{8^2 + 15^2} = \sqrt{64 + 225} = \sqrt{289} = 17\text{ cm}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los valores numéricos de los dos catetos $a$ y $b$.'
- 'Paso 2: Calcular $a^2$ y $b^2$.'
- 'Paso 3: Sumar ambos valores: $S = a^2 + b^2$.'
- 'Paso 4: Extraer la raíz cuadrada: $c = \sqrt{S}$.'
- 'Paso 5: Simplificar el radical o calcular la raíz exacta y adjuntar las unidades.'
errores_correccion: 'No cometas el error algebraico de simplificar $\sqrt{a^2 + b^2}$ como $a + b$. La raíz de una suma NO es la suma de las raíces.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo rectángulo los catetos miden $1\text{ cm}$ y $1\text{ cm}$. ¿Cuánto mide su hipotenusa?
  alternativas:
  - $\sqrt{2}\text{ cm}$
  - $2\text{ cm}$
  - $1.5\text{ cm}$
  respuesta: $\sqrt{2}\text{ cm}$
  solucion_pasos:
  - '$c = \sqrt{1^2 + 1^2} = \sqrt{1 + 1} = \sqrt{2}\text{ cm}$.'
- titulo: Ejemplo 2
  enunciado: Si los catetos miden $20\text{ cm}$ y $21\text{ cm}$, ¿cuál es la longitud de la hipotenusa?
  alternativas:
  - $29\text{ cm}$
  - $41\text{ cm}$
  - $31\text{ cm}$
  respuesta: $29\text{ cm}$
  solucion_pasos:
  - '$c = \sqrt{20^2 + 21^2} = \sqrt{400 + 441} = \sqrt{841} = 29\text{ cm}$.'
- titulo: ¿La hipotenusa de un triángulo rectángulo con catetos de 3 cm y 4 cm mide 5 cm?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $\sqrt{3^2 + 4^2} = \sqrt{9 + 16} = \sqrt{25} = 5\text{ cm}$.'
- titulo: ¿La hipotenusa se calcula restando los cuadrados de los catetos?
  respuesta: 'No'
  solucion_pasos:
  - 'No, para la hipotenusa se SUMAN los cuadrados: $c = \sqrt{a^2 + b^2}$.'
errores_frecuentes:
- 'Cancelar la raíz con los exponentes: $\sqrt{a^2 + b^2} \to a + b$.'
- 'Restar en lugar de sumar dentro de la raíz.'
- 'Olvidar aplicar la raíz cuadrada al valor final de la suma.'
- 'Multiplicar los catetos por 2 en vez de elevarlos al cuadrado.'
- 'No verificar que la hipotenusa obtenida sea mayor que ambos catetos.'
afirmaciones_verdaderas:
- 'La hipotenusa de un triángulo rectángulo se calcula mediante la fórmula $c = \sqrt{a^2 + b^2}$.'
- 'La longitud de la hipotenusa es siempre estrictamente mayor que la de cualquiera de sus catetos.'
al_terminar_debes_poder: |
  **QUÉ:** Calcular la hipotenusa de un triángulo rectángulo conociendo las medidas de sus catetos.

  **CÓMO:** Aplicando el algoritmo $c = \sqrt{a^2 + b^2}$, operando la suma de cuadrados y simplificando el radical resultante.

  ![Resumen de Cálculo de Hipotenusa](/static/img/nodos/calculo-de-la-hipotenusa-dados-los-dos-catetos-resumen.svg)
