semantic_id: MAT.NUM.COMPLEJOS.PARTE_IMAGINARIA
resumen_inicial: 'La parte imaginaria de un número complejo $z = a + bi$ es el coeficiente real $b$ que multiplica a la unidad imaginaria $i$, denotada por $\operatorname{Im}(z) = b$.'
explicacion_simple: |
  En un número complejo como $z = 5 + 7i$, la parte imaginaria es solo el número que acompaña a la $i$, que en este caso es el 7. ¡Ojo! La parte imaginaria es SOLAMENTE el número 7, NUNCA incluye a la letra $i$. Los matemáticos usan el símbolo $\operatorname{Im}(z)$ para indicar la parte imaginaria, escribiendo $\operatorname{Im}(5 + 7i) = 7$. Si el número es un real puro (como $z = 10$), su parte imaginaria es 0.
explicacion_formal: |
  ### Definición formal
  La **función parte imaginaria** $\operatorname{Im}: \mathbb{C} \to \mathbb{R}$ asigna a cada número complejo $z = a + bi$ su segunda componente escalar real:
  $$\operatorname{Im}(z) = b \quad (b \in \mathbb{R})$$

  ### Casos particulares de evaluación de $\operatorname{Im}(z)$
  1. **Para un número real $x \in \mathbb{R}$**: $\operatorname{Im}(x) = 0$ (puesto que $x = x + 0i$).
  2. **Para un número imaginario puro $bi \in \mathbb{I}$**: $\operatorname{Im}(bi) = b$ (puesto que $bi = 0 + bi$).
  3. **Mediante la fórmula del conjugado**: $\operatorname{Im}(z) = \frac{z - \bar{z}}{2i}$.

  ### Propiedad de linealidad
  Para cualesquiera números complejos $z_1, z_2 \in \mathbb{C}$ y constante real $k \in \mathbb{R}$:
  $$\operatorname{Im}(z_1 + z_2) = \operatorname{Im}(z_1) + \operatorname{Im}(z_2) \quad \text{y} \quad \operatorname{Im}(k \cdot z) = k \cdot \operatorname{Im}(z)$$

  ### Síntesis didáctica
  - Operador matemático: $\operatorname{Im}(z)$ o $\operatorname{Im}(a + bi) = b$.
  - Regla de oro: La parte imaginaria es un **número real escalar $b \in \mathbb{R}$** (la letra $i$ no forma parte de la respuesta).
definiciones_clave: |
  - **Parte imaginaria $\operatorname{Im}(z)$**: Coeficiente real $b$ que pondera a la unidad imaginaria en el binomio.
  - **Operador $\operatorname{Im}(\cdot)$**: Función que proyecta un punto del plano complejo sobre el eje imaginario vertical.
  - **Eje imaginario**: Eje vertical $Y$ del plano de Argand donde se representa gráficamente la componente $\operatorname{Im}(z)$.
propiedades_relaciones: |
  - **Representación gráfica**: $\operatorname{Im}(z)$ corresponde a la ordenada $y$ en las coordenadas cartesianas $(x, y)$ del número complejo.
  - **Cero de la parte imaginaria**: Si $\operatorname{Im}(z) = 0$, el número complejo $z$ se reduce a un número real puro perteneciente al eje $X$.
ejemplo_guiado:
  enunciado: 'Dado el número complejo $z = 4 - 9i$, determina el valor exacto de su parte imaginaria $\operatorname{Im}(z)$.'
  pasos:
    - 'Paso 1: Comparamos el número $z = 4 - 9i$ con la estructura estándar $z = a + bi$.'
    - 'Paso 2: Identificamos la unidad imaginaria $i$ y observamos qué coeficiente real la acompaña.'
    - 'Paso 3: Extraemos el coeficiente escalar conservando su signo negativo: $b = -9$.'
    - 'Paso 4: Aplicamos la notación formal para concluir: $\operatorname{Im}(z) = -9$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por qué la letra $i$ NUNCA forma parte de la respuesta al calcular la parte imaginaria $\operatorname{Im}(z)$?'
    choices:
      - {text: 'Porque la parte imaginaria es un coeficiente real escalar $b \in \mathbb{R}$ que indica la cantidad de unidades imaginarias', is_correct: true}
      - {text: 'Porque la letra i se cancela con la parte real', is_correct: false}
      - {text: 'Porque la parte imaginaria se define siempre como un número complejo', is_correct: false}
      - {text: 'Porque el operador Im transforma las letras en ceros', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque la parte imaginaria es un coeficiente real escalar $b \in \mathbb{R}$ que indica la cantidad de unidades imaginarias''. La función $\operatorname{Im}(a+bi) = b$ devuelve exclusivamente el escalar $b$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Cuál es el valor de la parte imaginaria $\operatorname{Im}(z)$ para el número complejo $z = 12 - i$?'
    choices:
      - {text: '$-1$, pues el coeficiente que acompaña a $i$ es $-1$', is_correct: true}
      - {text: '$-i$, incluyendo la letra', is_correct: false}
      - {text: '$12$, tomando la parte real', is_correct: false}
      - {text: '$1$, ignorando el signo menos', is_correct: false}
    explanation: 'La alternativa correcta es ''$-1$, pues el coeficiente que acompaña a $i$ es $-1$''. El término $-i$ equivale a $-1 \cdot i$, por ende $\operatorname{Im}(z) = -1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir la expresión en la forma canónica $z = a + bi$.'
  - 'Paso 2: Localizar el término que contiene a la unidad imaginaria $i$.'
  - 'Paso 3: Aislar el coeficiente real $b$ que multiplica a $i$, asegurando incluir su signo algebraico.'
  - 'Paso 4: Escribir la respuesta escalar mediante la expresión $\operatorname{Im}(z) = b$ (excluyendo la letra $i$).'
errores_correccion: |
  - **Error 1:** Escribir la parte imaginaria incluyendo a la unidad $i$ (ej: responder $\operatorname{Im}(3 + 4i) = 4i$). **Cómo corregirlo:** La parte imaginaria es únicamente el **número real** $4$. Escribir $4i$ es un error conceptual grave.
  - **Error 2:** Olvidar el coeficiente implícito 1 o -1 en expresiones como $z = 5 + i$ o $z = 3 - i$. **Cómo corregirlo:** El término $+i$ tiene coeficiente $+1$ ($\operatorname{Im}(z) = 1$) y el término $-i$ tiene coeficiente $-1$ ($\operatorname{Im}(z) = -1$).
ejemplos:
  - titulo: 'Parte imaginaria con coeficiente unitario negativo'
    enunciado: 'Para $z = 8 - i$, ¿el valor de $\operatorname{Im}(z)$ es igual a $-1$?'
    alternativas:
      - 'Sí, pues el coeficiente real de -i es -1'
      - 'No, es igual a -i'
      - 'No, es igual a 8'
    respuesta: 'Sí, pues el coeficiente real de -i es -1'
    solucion_pasos:
      - '1. Identificamos el término imaginario: $-1 \cdot i$.'
      - '2. Extraemos el escalar: $\operatorname{Im}(z) = -1$.'
  - titulo: 'Parte imaginaria de un número real'
    enunciado: 'Para el número real $z = 25$, ¿se cumple que $\operatorname{Im}(25) = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Todo número real tiene parte imaginaria igual a cero.'
  - titulo: 'Parte imaginaria en complejo desordenado'
    enunciado: '¿La parte imaginaria de $z = -6i + 10$ es igual a $-6$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Es el coeficiente real que acompaña a $i$, $\operatorname{Im}(z) = -6$.'
  - titulo: 'Suma de partes imaginarias'
    enunciado: 'Si $z_1 = 4 + 3i$ y $z_2 = 1 + 5i$, ¿se cumple $\operatorname{Im}(z_1 + z_2) = 8$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por la propiedad de linealidad $3 + 5 = 8$.'
errores_frecuentes:
  - 'Escribir la letra $i$ como parte del valor numérico de la parte imaginaria $\operatorname{Im}(z) = bi$.'
  - 'Ignorar el coeficiente 1 o -1 cuando el término imaginario se escribe únicamente como $+i$ o $-i$.'
  - 'Tomar la parte real como si fuera la parte imaginaria cuando el número complejo está desordenado.'
  - 'Afirmar que un número real puro carece de parte imaginaria en lugar de responder que es igual a cero.'
  - 'Invertir los signos de la parte imaginaria al extraer el coeficiente de un número complejo.'
afirmaciones_verdaderas:
  - 'La parte imaginaria de un número complejo $z = a + bi$ es el coeficiente real $b \in \mathbb{R}$ denotado por $\operatorname{Im}(z) = b$.'
  - 'La parte imaginaria de cualquier número real puro es estrictamente igual a cero ($\operatorname{Im}(x) = 0$).'
al_terminar_debes_poder: 'Identificar y calcular la parte imaginaria $\operatorname{Im}(z) = b$ de cualquier número complejo aislando el escalar real que multiplica a $i$.'
