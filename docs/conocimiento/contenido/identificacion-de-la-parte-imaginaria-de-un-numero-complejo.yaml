resumen_inicial: La parte imaginaria de un número complejo $z = a + bi$ es el coeficiente
  real $b$ que multiplica a la unidad imaginaria $i$, denotándose como $\text{Im}(z)
  = b$.
explicacion_simple: La parte imaginaria es el número real que acompaña a la letra
  $i$. Es muy importante notar que la parte imaginaria es solo el número de adelante,
  SIN incluir la letra $i$.
explicacion_formal: 'Para todo $z = a + bi \in \mathbb{C}$, la **Función Parte Imaginaria
  $\text{Im}(z)$** asigna el escalar real:


  $$\text{Im}(z) = b \in \mathbb{R}$$


  **Atención notacional estricta:**

  - $\text{Im}(z) = b$, NUNCA es $bi$. La parte imaginaria es un número real puro.'
definiciones_clave: '- **Parte imaginaria $\text{Im}(z)$**: Coeficiente real $b$ en
  $z = a + bi$.'
propiedades_relaciones: '- **Proyección vertical**: Representa la coordenada del eje
  imaginario $Y$.'
ejemplo_guiado:
  enunciado: Determine la parte imaginaria $\text{Im}(z)$ en $z_1 = 3 - 5i$ y $z_2
    = 12$.
  pasos:
  - 'Paso 1: Para $z_1 = 3 - 5i$, el coeficiente que multiplica a $i$ es $-5 \implies
    \text{Im}(z_1) = -5$.'
  - 'Paso 2: Para $z_2 = 12$, se escribe $12 + 0i \implies \text{Im}(z_2) = 0$.'
  - 'Conclusión: $\text{Im}(z_1) = -5$ y $\text{Im}(z_2) = 0$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa Im(z) en el número complejo z = a + bi?
  choices:
  - text: El coeficiente real b (sin incluir la letra i)
    is_correct: true
  - text: El término completo bi
    is_correct: false
  - text: El coeficiente a
    is_correct: false
  - text: El número 1
    is_correct: false
  explanation: La alternativa correcta es 'El coeficiente real b (sin incluir la letra
    i)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para z_1 = 3 - 5i, ¿cuál fue la parte imaginaria
    Im(z)?
  choices:
  - text: '-5'
    is_correct: true
  - text: -5i
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '5'
    is_correct: false
  explanation: La alternativa correcta es '-5'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de identificar la parte imaginaria
  $\text{Im}(z) = b$ de un número complejo, reconociendo que es un valor escalar real.
semantic_id: MAT.NUM.COMPLEJOS.PARTE_IMAGINARIA
procedimiento:
- 'Paso 1: Identificar los componentes $a = \text{Re}(z)$ y $b = \text{Im}(z)$.'
- 'Paso 2: Aplicar la definición o fórmula requerida (binomial, cartesiana, conjugado
  o módulo).'
- 'Paso 3: Simplificar y expresar el resultado final en el conjunto $\mathbb{C}$ o
  $\mathbb{R}$.'
errores_correccion: '- **Error 1: Incluir la letra $i$ dentro de la parte imaginaria
  (escribir $\text{Im}(3+4i) = 4i$).** **Cómo corregirlo:** La parte imaginaria es
  solo el coeficiente escalar real ($\text{Im}(z) = 4$).


  - **Error 2: Cambiar el signo de la parte real al calcular el conjugado.** **Cómo
  corregirlo:** El conjugado invierte ÚNICAMENTE el signo de la parte imaginaria ($\bar{z}
  = a - bi$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.COMPLEJOS.PARTE_IMAGINARIA.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa del concepto de números complejos.
- titulo: Ejemplo 2
  enunciado: Verificación formal en el plano de Argand.
  alternativas:
  - Cumple la regla
  - No cumple
  - Indeterminado
  respuesta: Cumple la regla
  solucion_pasos:
  - Evaluación formal en C.
- titulo: ¿Es el módulo de un número complejo un valor siempre no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $|z| = \sqrt{a^2+b^2} \ge 0$ por ser una distancia.
- titulo: ¿Es z · bar{z} un número real no negativo?
  respuesta: Sí
  solucion_pasos:
  - Sí, $z \cdot \bar{z} = a^2 + b^2 \in \mathbb{R}^+_{0}$.
errores_frecuentes:
- Incluir la unidad imaginaria $i$ como parte integrante del coeficiente de la parte
  imaginaria $\text{Im}(z)$.
- Invertir el signo de la parte real al calcular el conjugado de un número complejo.
- Establecer relaciones de orden de mayor o menor ($z_1 > z_2$) entre números complejos
  en $\mathbb{C}$.
- El módulo de un número complejo $z = a + bi$ da como resultado un número imaginario
  negativo.
- Restar los términos reales e imaginarios al calcular la distancia al origen.
afirmaciones_verdaderas:
- Todo número complejo $z = a + bi$ combina una parte real $\text{Re}(z) = a$ y una
  parte imaginaria escalar $\text{Im}(z) = b$.
- 'El producto de un número complejo por su conjugado da como resultado su módulo
  al cuadrado: $z \cdot \bar{z} = |z|^2 = a^2 + b^2$.'
fuente: Texto escolar MINEDUC — Números 3° Medio / PAES.
estado: publicado
