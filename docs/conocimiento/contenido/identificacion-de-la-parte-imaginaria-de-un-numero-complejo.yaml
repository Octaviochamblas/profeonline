semantic_id: MAT.NUM.NUMEROS_COMPLEJOS.PARTE_IMAGINARIA
resumen_inicial: La parte imaginaria de un número complejo $z = a + bi$ es el coeficiente real $b$, denotado por $\operatorname{Im}(z) = b$; es un número real que NUNCA incluye a la unidad $i$.
explicacion_simple: '![Identificación de la parte imaginaria](/static/img/nodos/identificacion-de-la-parte-imaginaria-de-un-numero-complejo-intro.svg)


  Para identificar la **parte imaginaria** de un número complejo:

  - Buscas el número real que acompaña multiplicando a la letra $i$.

  - Se escribe como $\operatorname{Im}(z)$.

  - **¡La parte imaginaria es SOLO el número, NO incluye la ''i''!**

  - En $z = 4 - 9i$, la parte imaginaria es $\operatorname{Im}(z) = -9$.

  - En $z = 8 + i$, el coeficiente tácito es $1$: $\operatorname{Im}(z) = 1$.

  - En un número real como $z = 15$, la parte imaginaria es $\operatorname{Im}(z) = 0$.'
explicacion_formal: 'Sea $z = a + bi \in \mathbb{C}$ con $a, b \in \mathbb{R}$. Se define el operador de **proyección imaginaria** $\operatorname{Im}: \mathbb{C} \to \mathbb{R}$ mediante:


  $$\operatorname{Im}(z) = b = \frac{z - \overline{z}}{2i}$$


  **Propiedades Analíticas:**

  1. $\operatorname{Im}(z) \in \mathbb{R}$ (la parte imaginaria pertenece estrictamente a los números reales).

  2. $z \in \mathbb{I} \iff \operatorname{Re}(z) = 0$ y $\operatorname{Im}(z) \neq 0$.

  3. $|\operatorname{Im}(z)| \le |z|$ para todo $z \in \mathbb{C}$.'
definiciones_clave: '- **Parte imaginaria ($\operatorname{Im}(z)$)**: Coeficiente escalar real $b \in \mathbb{R}$ que multiplica a $i$.

  - **Operador de proyección imaginaria**: Transformación $\operatorname{Im}(z) = \frac{z - \overline{z}}{2i}$.

  - **Coeficiente unitario tácito**: Valor $b = 1$ en $+i$ o $b = -1$ en $-i$.'
propiedades_relaciones: '- **Eje vertical (Eje Imaginario)**: Define la coordenada $Y$ en el plano complejo.

  - **Desigualdad básica**: $-|z| \le \operatorname{Im}(z) \le |z|$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de parte imaginaria](/static/img/nodos/identificacion-de-la-parte-imaginaria-de-un-numero-complejo-ejemplos.svg)


    Determine la parte imaginaria $\operatorname{Im}(z)$ para $z_1 = 8 + i$ y $z_2 = -3 - i$.'
  pasos:
  - 'Paso 1: Para $z_1 = 8 + i$: Reescribir el coeficiente implícito como $8 + 1 \cdot i$.'
  - 'Paso 2: Extraer el coeficiente real: $\operatorname{Im}(z_1) = 1$.'
  - 'Paso 3: Para $z_2 = -3 - i$: Reescribir como $-3 + (-1) \cdot i$.'
  - 'Paso 4: Extraer el coeficiente real: $\operatorname{Im}(z_2) = -1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la parte imaginaria de $z = 12 - 5i$?
  choices:
  - text: $-5$ (el número real que acompaña a $i$, sin incluir la letra $i$)
    is_correct: true
  - text: $-5i$
    is_correct: false
  - text: $5$
    is_correct: false
  - text: $12$
    is_correct: false
  explanation: La alternativa correcta es '$-5$ (el número real que acompaña a $i$, sin incluir la letra $i$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es la parte imaginaria de $z_1 = 8 + i$?
  choices:
  - text: $1$
    is_correct: true
  - text: $i$
    is_correct: false
  - text: $8$
    is_correct: false
  - text: $0$
    is_correct: false
  explanation: La alternativa correcta es '$1$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Localizar el término que contiene la unidad imaginaria $i$.'
- 'Paso 2: Extraer el factor numérico real $b$ que la multiplica con su signo respectivo.'
- 'Paso 3: Escribir $\operatorname{Im}(z) = b$ asegurándose de omitir completamente la letra $i$.'
errores_correccion: '- **Error 1: Incluir la ''i'' en la respuesta ($\operatorname{Im}(z) = -5i$).** **Cómo corregirlo:** La parte imaginaria es **estrictamente un número real**: $\operatorname{Im}(z) = -5$.

  - **Error 2: Creer que si solo dice ''+i'', la parte imaginaria es 0.** **Cómo corregirlo:** El coeficiente tácito es $1$: $\operatorname{Im}(a + i) = 1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la parte imaginaria de $z = 42$?
  alternativas:
  - $0$
  - $42$
  - $1$
  respuesta: $0$
  solucion_pasos:
  - $z = 42 + 0i \implies \operatorname{Im}(z) = 0$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el valor de $\operatorname{Im}(z)$ en $z = \frac{1 - 7i}{3}$?
  alternativas:
  - $-7/3$
  - $-7/3 i$
  - $1/3$
  respuesta: $-7/3$
  solucion_pasos:
  - $z = \frac{1}{3} - \frac{7}{3}i \implies \operatorname{Im}(z) = -\frac{7}{3}$.
- titulo: ¿Es Im(z) siempre un número perteneciente a los reales ℝ?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\operatorname{Im}(z) = b \in \mathbb{R}$ por definición.
  alternativas:
  - texto: Sí, es siempre un número real
    es_correcta: true
    retroalimentacion: ¡Correcto! Es un escalar real.
  - texto: No, es un número imaginario puro
    es_correcta: false
    retroalimentacion: Incorrecto, el término imaginario es $bi$, pero la parte imaginaria es solo $b$.
  - texto: No, depende de si z es positivo o negativo
    es_correcta: false
    retroalimentacion: Incorrecto, siempre pertenece a $\mathbb{R}$.
- titulo: ¿Es la parte imaginaria de z = 5 - i igual a -1?
  respuesta: Sí
  solucion_pasos:
  - Sí, $z = 5 + (-1)i \implies \operatorname{Im}(z) = -1$.
  alternativas:
  - texto: Sí, coeficiente -1 tácito
    es_correcta: true
    retroalimentacion: ¡Correcto! Signo menos con $i$ representa $-1$.
  - texto: No, es -i
    es_correcta: false
    retroalimentacion: Incorrecto, no se incluye la $i$.
  - texto: No, es 5
    es_correcta: false
    retroalimentacion: Incorrecto, 5 es la parte real.
errores_frecuentes:
- Escribir la letra $i$ en la respuesta final de $\operatorname{Im}(z)$.
- Asignar 0 en vez de 1 a expresiones con $+i$.
- Olvidar el signo negativo en expresiones con $-bi$.
- Confundir $\operatorname{Im}(z)$ con el término imaginario completo $bi$.
afirmaciones_verdaderas:
- La parte imaginaria de $z = a + bi$ es el escalar real $b = \operatorname{Im}(z)$.
- La parte imaginaria nunca incluye la letra $i$ en su valor.
- Para cualquier número real puro, la parte imaginaria es idénticamente cero.
al_terminar_debes_poder: '![Síntesis de parte imaginaria](/static/img/nodos/identificacion-de-la-parte-imaginaria-de-un-numero-complejo-resumen.svg)


  QUÉ: Identificar y extraer correctamente la parte imaginaria $\operatorname{Im}(z)$ de cualquier número complejo.


  CÓMO: Localizando el coeficiente real multiplicativo de la unidad imaginaria $b \in \mathbb{R}$, respetando su signo y omitiendo estrictamente la letra $i$.'
fuente: Texto escolar MINEDUC — Matemática 3° Medio / Álgebra Superior.
