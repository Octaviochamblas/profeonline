semantic_id: MAT.NUM.COMPLEJOS.PARTE_IMAGINARIA
resumen_inicial: La parte imaginaria de un número complejo $z = a + bi$ es el coeficiente
  real $b$, denotado por $\text{Im}(z) = b$ (sin incluir la $i$).
explicacion_simple: 'La parte imaginaria es **solo el número** que multiplica a la $i$ (no
  incluye la letra $i$):

  - En $z = 3 + 5i$, $\text{Im}(z) = 5$.

  - En $z = 4 - i$, $\text{Im}(z) = -1$.

  - En $z = 8$, $\text{Im}(z) = 0$.'
explicacion_formal: 'Dada la representación binomial $z = a + bi$, el operador parte imaginaria
  $\text{Im}: \mathbb{C} \to \mathbb{R}$ asigna $\text{Im}(a + bi) = b \in \mathbb{R}$. Se
  relaciona mediante $\text{Im}(z) = \frac{z - \bar{z}}{2i}$.'
definiciones_clave: '- **Parte imaginaria ($\text{Im}(z)$)**: Coeficiente escalar real que
  multiplica a la unidad imaginaria.'
propiedades_relaciones: '- **Fórmula mediante conjugado**: $\text{Im}(z) = \frac{z - \bar{z}}{2i}$.'
ejemplo_guiado:
  enunciado: Identifica la parte imaginaria de A) $z_1 = 2 - 7i$ y B) $z_2 = 5 + i$.
  pasos:
  - 'Para $z_1 = 2 - 7i$: el coeficiente de $i$ es $-7$, luego $\text{Im}(z_1) = -7$.'
  - 'Para $z_2 = 5 + i = 5 + 1i$: el coeficiente de $i$ es $1$, luego $\text{Im}(z_2) = 1$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la parte imaginaria de $z = 9 - 4i$?
  choices:
  - text: '-4'
    is_correct: true
  - text: -4i
    is_correct: false
  - text: '9'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: 'La correcta es: -4. La parte imaginaria es el coeficiente real $-4$ (sin incluir
    $i$).'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Calcula $\text{Im}(12)$.
  choices:
  - text: '0'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '1'
    is_correct: false
  - text: 12i
    is_correct: false
  explanation: 'La correcta es: 0. Un número real no tiene componente imaginaria ($12 = 12
    + 0i$).'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el complejo en forma $a + bi$.'
- 'Paso 2: Localizar el término que contiene a $i$.'
- 'Paso 3: Extraer su coeficiente numérico real $b$ omitiendo la letra $i$.'
errores_correccion: ¡Cuidado! La parte imaginaria es un número REAL. En $z = 3 + 2i$, $\text{Im}(z)
  = 2$, NUNCA $2i$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\text{Im}(4 - 6i)$.
  alternativas:
  - '-6'
  - -6i
  - '4'
  respuesta: '-6'
  solucion_pasos:
  - El coeficiente de $i$ es $-6$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la parte imaginaria de z=8-5i?
  alternativas:
  - '-5'
  - '8'
  - -5i
  respuesta: '-5'
  solucion_pasos:
  - El coeficiente de i es -5.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es la parte imaginaria de z=-9?
  alternativas:
  - '0'
  - '-9'
  - 9i
  respuesta: '0'
  solucion_pasos:
  - Un número real no tiene componente imaginaria.
- titulo: ¿Es correcto escribir Im(z)=3i en vez de Im(z)=3?
  respuesta: 'No'
  solucion_pasos:
  - La parte imaginaria es el coeficiente real, sin incluir la letra i.
errores_frecuentes:
- Incluir la unidad imaginaria $i$ como parte del resultado.
- Confundir la parte imaginaria con el término completo bi, incluyendo la letra i en la respuesta.
- Asumir que la parte imaginaria siempre es positiva.
- Olvidar que un número real tiene parte imaginaria igual a 0.
- Extraer mal el coeficiente cuando el complejo está escrito en orden invertido, como bi+a.
afirmaciones_verdaderas:
- $\text{Im}(a+bi) = b \in \mathbb{R}$.
- La parte imaginaria de un número complejo siempre es un número real, aunque acompañe a la
  unidad imaginaria i en la escritura del complejo.
al_terminar_debes_poder: Identificar la parte imaginaria de cualquier número complejo.
fuente: Texto escolar MINEDUC.
estado: publicado
