resumen_inicial: La extracción del factor común polinomio es el procedimiento que
  reordena y factoriza signos o términos para aislar binomios o trinomios idénticos
  $F_{poly}$.
explicacion_simple: A veces los paréntesis parecen distintos solo por un signo, como
  $(x - y)$ y $(y - x)$. Si le cambias el signo al segundo bloque, $-(y - x)$ se convierte
  en $(x - y)$, permitiendo extraer $(x - y)$ como factor común.
explicacion_formal: 'Dada la expresión $P = M_1(a - b) + M_2(b - a)$, la **Extracción
  del Factor Común Polinomio con Inversión de Signo** se basa en la identidad de simetría
  aditiva:


  $$(b - a) = -(a - b)$$

  $$P = M_1(a - b) - M_2(a - b) = (a - b)(M_1 - M_2)$$


  **Desglose simbólico:**

  - $(b - a) \to -(a - b)$: Extracción del factor $-1$ para homogenizar el binomio
  común.

  - Ajuste de signo operativo: El signo del coeficiente $M_2$ cambia para compensar
  la inversión del paréntesis.


  > **Complemento didáctico:** Muestra cómo la manipulación de signos algebraicos
  amplía el alcance de la factorización por factor común polinomio.'
definiciones_clave: '- **Inversión de signo binomial**: Identidad $(b - a) = -(a -
  b)$.

  - **Homogenización de factores**: Técnica de equiparación de binomios opuestos.'
propiedades_relaciones: '- **Negación de factores opuestos**: Si dos binomios difieren
  por un signo global, son opuestos $A = -B$.'
ejemplo_guiado:
  enunciado: Factorice la expresión $2x(a - b) + 5y(b - a)$ invirtiendo el signo del
    segundo paréntesis.
  pasos:
  - 'Paso 1: Observar que $(b - a)$ es el opuesto de $(a - b)$.'
  - 'Paso 2: Escribir $(b - a) = -(a - b)$.'
  - 'Paso 3: Sustituir en la expresión: $2x(a - b) + 5y[-(a - b)] = 2x(a - b) - 5y(a
    - b)$.'
  - 'Paso 4: Identificar el factor común polinomio homogenizado: $(a - b)$.'
  - 'Paso 5: Agrupar los residuos externos: $(a - b)(2x - 5y)$.'
  - 'Conclusión: La expresión factorizada es $(a - b)(2x - 5y)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué es equivalente la expresión $(y - x)$ al extraer el factor $-1$?
  choices:
  - text: $-(x - y)$
    is_correct: true
  - text: $(x - y)$
    is_correct: false
  - text: $-(x + y)$
    is_correct: false
  - text: $(x + y)$
    is_correct: false
  explanation: La alternativa correcta es '$-(x - y)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al factorizar $2x(a - b) + 5y(b - a)$, ¿cuál es el resultado correcto
    tras ajustar los signos?
  choices:
  - text: $(a - b)(2x - 5y)$
    is_correct: true
  - text: $(a - b)(2x + 5y)$
    is_correct: false
  - text: $(b - a)(2x + 5y)$
    is_correct: false
  - text: $(a + b)(2x - 5y)$
    is_correct: false
  explanation: La alternativa correcta es '$(a - b)(2x - 5y)$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comparar los paréntesis del polinomio para detectar binomios opuestos.'
- 'Paso 2: Extraer el signo negativo de los binomios opuestos y cambiar el signo del
  coeficiente exterior.'
- 'Paso 3: Extraer el factor común polinomio ya homogenizado y agrupar los residuos.'
errores_correccion: '- **Error 1: Cambiar el orden de las letras dentro del paréntesis
  sin cambiar el signo del coeficiente exterior.** **Cómo corregirlo:** Al transformar
  $(b - a)$ en $(a - b)$, se DEBE cambiar el signo del término que lo multiplica.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Factorice $m(x - 1) - n(1 - x)$.
  alternativas:
  - $(x - 1)(m + n)$
  - $(x - 1)(m - n)$
  - $(1 - x)(m + n)$
  respuesta: $(x - 1)(m + n)$
  solucion_pasos:
  - 1. $(1 - x) = -(x - 1)$.
  - '2. Sustituyendo: $m(x - 1) - n[-(x - 1)] = m(x - 1) + n(x - 1)$.'
  - '3. Resultado: $(x - 1)(m + n)$.'
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la forma factorizada de $p(a - 3) + 4(3 - a)$?
  alternativas:
  - $(a - 3)(p - 4)$
  - $(a - 3)(p + 4)$
  - $(3 - a)(p - 4)$
  respuesta: $(a - 3)(p - 4)$
  solucion_pasos:
  - 1. $(3 - a) = -(a - 3)$.
  - '2. Expresión: $p(a - 3) - 4(a - 3) = (a - 3)(p - 4)$.'
- titulo: ¿Es la expresión $(x - y)(a - b)$ la factorización de $a(x - y) + b(y -
    x)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $+b(y - x) = -b(x - y)$, resultando $(x - y)(a - b)$.
- titulo: ¿Se altera el valor algebraico de un binomio si se cambia el orden de una
    resta sin extraer un signo menos?
  respuesta: Sí
  solucion_pasos:
  - Sí, la resta no es conmutativa ($b - a \neq a - b$).
errores_frecuentes:
- Invertir el orden de los términos en una resta sin modificar el signo operativo
  exterior.
- Declarar que $(a - b)$ y $(b - a)$ son factores idénticos sin necesidad de cambiar
  signos.
- Mantener el mismo signo en el coeficiente exterior al transformar el binomio opuesto.
- Declarar que no se puede extraer un factor común polinomio cuando los binomios son
  opuestos.
- Multiplicar por $-1$ ambos paréntesis simultáneamente al intentar homogenizar el
  factor común.
afirmaciones_verdaderas:
- La resta no es conmutativa, pero satisface la identidad $(b - a) = -(a - b)$.
- Invertir el signo de un binomio opuesto permite homogenizar los términos para la
  extracción del factor común.
al_terminar_debes_poder: Al terminar serás capaz de extraer factores comunes polinomiales
  aplicando inversiones de signo en binomios opuestos.
