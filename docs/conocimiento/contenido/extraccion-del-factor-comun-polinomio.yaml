semantic_id: MAT.ALG.FACTOR_COMUN.EXTRACCION_POLINOMIO
resumen_inicial: La extracción del factor común polinomio consiste en escribir la expresión como el producto del paréntesis
  común por un segundo paréntesis compuesto por los coeficientes o términos exteriores reunidos.
explicacion_simple: "Para **extraer un factor común polinomio** y completar la factorización (ej: $3x\\mathbf{(a + b)} + 2y\\\
  mathbf{(a + b)}$):\n- **PROCEDIMIENTO EN 2 PASOS**:\n  1. **Escribe el Paréntesis Común una sola vez**: $\\mathbf{(a + b)}$.\n\
  \  2. **Reúne todos los términos exteriores en un segundo paréntesis**:\n     - Término exterior del primero: $3x$.\n  \
  \   - Término exterior del segundo: $+2y$.\n     - Segundo paréntesis reunido: $\\mathbf{(3x + 2y)}$.\n- **Resultado factorizado\
  \ unificado**:\n  $$\\mathbf{(a + b)(3x + 2y)}$$\n- **Caso Especial con el número 1**: $m(x - 4) + (x - 4)$:\n  - Paréntesis\
  \ común: $(x - 4)$.\n  - Exteriores: $m$ y $+1 \\implies \\mathbf{(m + 1)}$.\n  - Resultado: **$(x - 4)(m + 1)$**.\n\n![Extracción\
  \ del factor común polinomio](/static/img/nodos/extraccion-del-factor-comun-polinomio-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea la expresión $E = \sum_{i=1}^k M_i \cdot B \in \mathbb{R}[x_1, \dots, x_m]$ donde $B$ representa el factor común polinomio
  idéntico y $M_i$ son los coeficientes monómicos exteriores. La **extracción del factor común polinomio** es la factorización
  distributiva simétrica dada por:


  $$E = B \cdot \left( \sum_{i=1}^k M_i \right) = B \cdot (M_1 + M_2 + \dots + M_k)$$


  ### Justificación por Sustitución de Macro-Variable

  Definiendo el cambio de variable $u = B$, la expresión se reduce a la suma de monomios $\sum_{i=1}^k M_i u$. Aplicando la
  extracción estándar de factor común monomio:


  $$\sum_{i=1}^k M_i u = u \cdot \left( \sum_{i=1}^k M_i \right)$$


  Restituyendo $u = B$, se obtiene la forma factorizada binómica final $B \cdot (M_1 + \dots + M_k)$.


  ### Síntesis didáctica

  Extraer un factor común polinomio transforma la suma de productos en la multiplicación de dos paréntesis: el paréntesis
  común original y el paréntesis de coeficientes exteriores.

  '
definiciones_clave: '- **Extracción de factor común polinomio**: Operación que factoriza $M_1 B + M_2 B$ en la forma producto
  $B(M_1 + M_2)$.

  - **Paréntesis de términos exteriores ($(M_1 + M_2 + \dots)$)**: Segundo factor formado por la adición algebraica de todas
  las componentes externas.

  - **Restitución por cambio de variable**: Demostración matemática por la cual se trata el paréntesis común como un bloque
  indivisible $u$.

  '
propiedades_relaciones: '- **Conmutatividad de los paréntesis factores**: $B(M_1 + M_2) = (M_1 + M_2)B$. El orden de los dos
  paréntesis en la respuesta final no altera el producto.

  - **Preservación de signos exteriores**: Los signos de los términos exteriores ($+, -$) deben conservarse exactamente en
  el segundo paréntesis.

  '
ejemplo_guiado:
  enunciado: Extrae el factor común polinomio y factoriza completamente $5a(2x - 3y) - 4b(2x - 3y) + (2x - 3y)$.
  pasos:
  - 'Paso 1: Identificamos el paréntesis común: $B = (2x - 3y)$.'
  - 'Paso 2: Identificamos las componentes exteriores que multiplican a $B$: - Primer exterior: $5a$. - Segundo exterior:
    $-4b$. - Tercer exterior (implícito): $+1$.'
  - 'Paso 3: Formamos el segundo paréntesis con la suma de los exteriores: $(5a - 4b + 1)$.'
  - 'Paso 4: Multiplicamos ambos paréntesis: $(2x - 3y)(5a - 4b + 1)$.'
  - 'Conclusión: La expresión factorizada es **$(2x - 3y)(5a - 4b + 1)$**.'
  imagen: /static/img/nodos/extraccion-del-factor-comun-polinomio-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: Al extraer el factor común polinomio en $7x(a + 2b) - 3y(a + 2b)$, ¿cuál es el resultado factorizado?
  choices:
  - text: El resultado es $(a + 2b)(7x - 3y)$, multiplicando el paréntesis común por la reunión de los coeficientes exteriores
    is_correct: true
  - text: El resultado es $(a + 2b) + (7x - 3y)$
    is_correct: false
  - text: El resultado es $21xy(a + 2b)$
    is_correct: false
  - text: El resultado es $(7x + 3y)(a - 2b)$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $(a + 2b)(7x - 3y)$, multiplicando el paréntesis común por la reunión
    de los coeficientes exteriores'. $B \cdot (M_1 + M_2) \implies (a+2b)(7x-3y)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es la factorización completa de $k(x - 5) + (x - 5)$?
  choices:
  - text: La factorización es $(x - 5)(k + 1)$, recordando que el segundo paréntesis tiene como exterior el número $+1$
    is_correct: true
  - text: La factorización es $(x - 5)(k)$
    is_correct: false
  - text: La factorización es $(x - 5)(k + 0)$
    is_correct: false
  - text: La factorización es $k(x - 5)$
    is_correct: false
  explanation: La alternativa correcta es 'La factorización es $(x - 5)(k + 1)$, recordando que el segundo paréntesis tiene
    como exterior el número $+1$'. Factor exterior implícito $+1 \implies (x-5)(k+1)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir el paréntesis común $B$ como el primer factor de la respuesta.'
- 'Paso 2: Abrir un segundo paréntesis al lado del primero.'
- 'Paso 3: Colocar dentro del segundo paréntesis cada uno de los términos o coeficientes que multiplicaban al paréntesis común
  en la expresión original.'
- 'Paso 4: Asegurar la inclusión del número $+1$ o $-1$ si algún paréntesis común aparecía solo.'
errores_correccion: '- **Error 1:** Colocar un signo más o menos entre los dos paréntesis finales (escribir $(a+b) + (x+y)$).
  **Cómo corregirlo:** La factorización **DEBE PRODUCIR UNA MULTIPLICACIÓN DE PARÉNTESIS SIN SIGNOS INTERMEDIOS ($(a+b)(x+y)$)**.

  - **Error 2:** Excluir el $+1$ al extraer el factor común en expresiones con un paréntesis suelto (escribir $m(x-2) + (x-2)
  = (x-2)(m)$). **Cómo corregirlo:** El paréntesis suelto **APORTA UN $+1$ AL SEGUNDO FACTOR ($(x-2)(m+1)$)**.

  '
ejemplos:
- titulo: Extracción básica
  enunciado: ¿Es $(x + 1)(a + b)$ la factorización correcta de $a(x + 1) + b(x + 1)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(x+1)$ es el común y $(a+b)$ los exteriores.
- titulo: Inclusión de +1
  enunciado: En $y(a - 3) + (a - 3)$, ¿obtenemos $(a - 3)(y + 1)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el exterior implícito es $+1$.
- titulo: Inclusión de -1
  enunciado: En $z(m + 4) - (m + 4)$, ¿obtenemos $(m + 4)(z - 1)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el signo menos aporta $-1$.
- titulo: Orden de paréntesis
  enunciado: ¿Es $(3x + 2y)(a + b)$ equivalente a $(a + b)(3x + 2y)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la multiplicación es conmutativa.
errores_frecuentes:
- Escribir una suma o resta entre los dos paréntesis finales en lugar de su producto multiplicativo.
- El número 1 no es incluido al reunir los términos exteriores de un paréntesis que no tiene coeficiente explícito.
- Cambiar los signos de las componentes exteriores al colocarlas dentro del segundo paréntesis.
- Duplicar el paréntesis común en la respuesta final.
- Olvidar simplificar los términos semejantes dentro del segundo paréntesis si existen.
afirmaciones_verdaderas:
- 'La extracción del factor común polinomio produce el producto de dos paréntesis: el factor común y la suma de los exteriores.'
- Si un paréntesis común no posee coeficiente explícito, aporta $+1$ o $-1$ al paréntesis de términos exteriores.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/extraccion-del-factor-comun-polinomio-resumen.svg)


  QUÉ: Extraer el factor común polinomio reuniendo los términos exteriores en un segundo paréntesis multiplicativo.

  CÓMO: Expresar la suma $\sum M_i B = B(M_1 + M_2 + \dots + M_k)$ colocando el paréntesis común $B$ como primer factor y
  sumando algebraicamente los términos externos en el segundo paréntesis.

  '
