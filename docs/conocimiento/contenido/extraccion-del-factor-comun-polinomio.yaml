semantic_id: MAT.ALG.FACTOR_COMUN.EXTRACCION_POLINOMIO
resumen_inicial: 'Extracción del factor común polinomio: concepto, método de descomposición
  y reglas en Factor común.'
explicacion_simple: Cuando un mismo polinomio multiplica a varios términos, puede
  escribirse una sola vez como factor. Los multiplicadores restantes forman el segundo
  factor del producto.
explicacion_formal: '### Definición formal


  Si un polinomio $Q$ multiplica íntegramente a cada término de una suma $c_1Q + c_2Q
  + \dots + c_kQ$, se extrae como factor común escribiendo $Q(c_1+c_2+\dots+c_k)$,
  aplicando la propiedad distributiva en sentido inverso.


  ### Desarrollo didáctico


  Es el bloque entero que se repite.


  El término solitario (x+1) equivale a +1(x+1). Al sacarlo queda ''a+1''.


  Se saca (m-n) y se juntan los factores externos 5 y -p.'
definiciones_clave: '- **Extracción del factor común polinomio**: Técnica de factorización
  para expresar polinomios en forma irreducible de producto.'
propiedades_relaciones: '- **Proceso inverso**: La factorización revierte la multiplicación
  o expansión de polinomios aplicada en extracción del factor común polinomio.'
ejemplo_guiado:
