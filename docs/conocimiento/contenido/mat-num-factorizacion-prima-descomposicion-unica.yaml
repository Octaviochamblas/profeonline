semantic_id: MAT.NUM.FACTORIZACION_PRIMA.DESCOMPOSICION_UNICA
resumen_inicial: El Teorema Fundamental de la Aritmética establece que la descomposición prima de todo compuesto es única salvo el orden.
explicacion_simple: 'Cualquier número entero compuesto tiene una ''huella dactilar'' numérica única dada por sus factores primos. No importa qué método utilicemos para desarmarlo, al final del proceso obtendremos exactamente los mismos factores primos con los mismos exponentes.


  ![Unicidad de la descomposición prima](/static/img/nodos/unicidad-de-la-descomposicion-prima-intro.svg)'
explicacion_formal: 'El **Teorema Fundamental de la Aritmética** afirma que todo entero $n > 1$ admite una representación en factores primos que es **única** salvo el orden de los factores:


  $$\text{Si } n = p_1 \cdot p_2 \cdots p_r = q_1 \cdot q_2 \cdots q_s \implies r = s \quad \land \quad p_i = q_{\pi(i)}$$


  **Desglose de la fórmula:**

  - $r = s$: La cantidad total de factores primos en cualquier descomposición es exactamente la misma.

  - $p_i = q_{\pi(i)}$: Los factores primos son idénticos uno a uno bajo una permutación $\pi$ de ordenamiento.


  > **Complemento didáctico:** Escribir $12 = 2 \cdot 2 \cdot 3$ o $12 = 3 \cdot 2 \cdot 2$ es la misma descomposición prima; la conmutatividad del producto no afecta la unicidad estructural.'
definiciones_clave: '- **Teorema Fundamental de la Aritmética**: Garantía matemática de unicidad en la factorización de enteros.

  - **Permutación de orden**: Invarianza del resultado frente al orden en que se presenten los factores primos.'
propiedades_relaciones: '- **Huella dactilar numérica**: La descomposición prima caracteriza unívocamente a cada número natural.'
ejemplo_guiado:
  enunciado: 'Verifique que las expresiones $2^2 \cdot 3 \cdot 5$ y $5 \cdot 2 \cdot 3 \cdot 2$ representan la misma descomposición prima del número $60$.


    ![Ejemplo Unicidad de la descomposición prima](/static/img/nodos/unicidad-de-la-descomposicion-prima-ejemplos.svg)'
  pasos:
  - 'Paso 1: Ordenar la segunda expresión de menor a mayor primo: $2 \cdot 2 \cdot 3 \cdot 5 = 2^2 \cdot 3 \cdot 5$.'
  - 'Paso 2: Comparar los factores primos y exponentes de ambas listas: ambas contienen $2^2$, $3^1$ y $5^1$.'
  - 'Conclusión: Son exactamente la misma descomposición prima por el Teorema Fundamental de la Aritmética.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué garantiza el Teorema Fundamental de la Aritmética?
  choices:
  - text: Que la descomposición prima de un número mayor que 1 es única salvo el orden de los factores
    is_correct: true
  - text: Que todos los números tienen 2 divisores
    is_correct: false
  - text: Que la suma de dos primos es un número primo
    is_correct: false
  - text: Que los números impares se descomponen solo por 3
    is_correct: false
  explanation: La alternativa correcta es 'Que la descomposición prima de un número mayor que 1 es única salvo el orden de los factores'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué 2^2 · 3 · 5 y 5 · 2 · 3 · 2 son la misma descomposición de 60?
  choices:
  - text: Porque al ordenarlos contienen exactamente los mismos factores primos con los mismos exponentes
    is_correct: true
  - text: Porque ambos dan resultado negativo
    is_correct: false
  - text: Porque se sumaron los números
    is_correct: false
  - text: Es una coincidencia
    is_correct: false
  explanation: La alternativa correcta es 'Porque al ordenarlos contienen exactamente los mismos factores primos con los mismos exponentes'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Obtener la lista de factores primos del número.'
- 'Paso 2: Ordenar los primos de menor a mayor agrupando repeticiones como potencias.'
- 'Paso 3: Concluir que la representación en potencias es la única descomposición canónica del número.'
errores_correccion: '- **Error 1: Creer que escribir los factores en distinto orden genera dos factorizaciones distintas.** **Cómo corregirlo:** El orden no altera el producto por conmutatividad; la descomposición es única.


  - **Error 2: Pensar que incluir el factor 1 no altera la unicidad ($6 = 1 \cdot 2 \cdot 3 = 1 \cdot 1 \cdot 2 \cdot 3$).** **Cómo corregirlo:** Precisamente por esto el 1 NO se considera primo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es posible que un número compuesto tenga dos factorizaciones primas completamente diferentes?
  alternativas:
  - No, el Teorema Fundamental lo prohíbe
  - Sí, según el método usado
  - Solo si es un número par
  respuesta: No, el Teorema Fundamental lo prohíbe
  solucion_pasos:
  - La descomposición prima es única salvo el orden.
- titulo: Ejemplo 2
  enunciado: Ordene la descomposición prima $3 \cdot 7 \cdot 2^3$.
  alternativas:
  - 2^3 · 3 · 7
  - 7 · 3 · 2^3
  - 2 · 3 · 7^3
  respuesta: 2^3 · 3 · 7
  solucion_pasos:
  - 'Se ordenan las bases primas de menor a mayor: $2^3 \cdot 3 \cdot 7$.'
- titulo: ¿Garantiza el Teorema Fundamental de la Aritmética la unicidad de la factorización?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el principio básico de unicidad en los enteros.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple rigurosamente con los teoremas de factorización prima y exponentes.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la descomposición prima canónica proporciona un valor exacto e irreductible.
  - texto: No es posible determinarlo sin conocer todos los divisores
    es_correcta: false
    retroalimentacion: Incorrecto, la factorización canónica permite calcular directamente todas las propiedades.
- titulo: ¿Cambia la descomposición prima de un número si se resuelve mediante árbol en vez de tabla?
  respuesta: 'No'
  solucion_pasos:
  - No, todos los métodos válidos conducen a la misma descomposición única.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple rigurosamente con los teoremas de factorización prima y exponentes.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la descomposición prima canónica proporciona un valor exacto e irreductible.
  - texto: No es posible determinarlo sin conocer todos los divisores
    es_correcta: false
    retroalimentacion: Incorrecto, la factorización canónica permite calcular directamente todas las propiedades.
errores_frecuentes:
- Un número entero compuesto se puede expresar con dos conjuntos distintos de factores primos.
- Cambiar la secuencia de colocación de los factores primos modifica el número original obtenido.
- El Teorema Fundamental de la Aritmética aplica únicamente a los números primos.
- La unicidad de la factorización prima se rompe cuando el número es un cuadrado perfecto.
- Incluir el número 1 en la descomposición conserva la propiedad de unicidad del teorema.
afirmaciones_verdaderas:
- El Teorema Fundamental de la Aritmética afirma la unicidad de la descomposición prima salvo el orden de los factores.
- Cualquier método correcto de factorización prima llega exactamente al mismo conjunto de factores primos.
al_terminar_debes_poder: '**QUÉ:** Comprender y justificar la unicidad de la factorización prima establecida por el Teorema Fundamental de la Aritmética.


  **CÓMO:** Demostrando que cualquier método de descomposición converge a las mismas bases primas y exponentes, justificando la exclusión del número 1 para evitar infinitas factorizaciones.


  ![Resumen Unicidad de la descomposición prima](/static/img/nodos/unicidad-de-la-descomposicion-prima-resumen.svg)'
