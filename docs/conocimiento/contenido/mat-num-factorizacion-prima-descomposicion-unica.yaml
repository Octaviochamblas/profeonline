semantic_id: MAT.NUM.FACTORIZACION_PRIMA.DESCOMPOSICION_UNICA
resumen_inicial: "El Teorema Fundamental de la Aritmética establece que todo número entero mayor que 1 tiene una única descomposición en factores primos, salvo el orden."
explicacion_simple: |
  Imagina que tienes una receta secreta de cocina. No importa cuántas veces la hagas o en
  qué orden mezcles los ingredientes esenciales, al final el resultado es el mismo plato
  único. En matemáticas pasa algo parecido: cada número entero mayor que 1 tiene una única
  combinación de "ingredientes" primos, sin importar el método que uses para desarmarlo.
explicacion_formal: |
  El **Teorema Fundamental de la Aritmética** establece que cualquier número entero mayor
  que $1$ es primo o puede expresarse como producto de números primos de manera **única**,
  salvo por el orden de los factores. Por ejemplo, para $N=60$: sin importar el camino
  intermedio ($6\cdot10$, $4\cdot15$ o $2\cdot30$), la descomposición final siempre es
  $2^2\cdot3\cdot5$.
definiciones_clave: |
  **Unicidad**: propiedad de que la descomposición prima de un número es exclusiva; no
  existen dos conjuntos distintos de factores primos que den el mismo producto.
propiedades_relaciones: |
  La unicidad de la factorización prima es lo que permite comparar números, calcular m.c.m.
  y M.C.D. con total certeza, sin importar el método usado para llegar a ella.
ejemplo_guiado:
  enunciado: "Verifica que dos caminos distintos para descomponer 40 llegan al mismo resultado."
  pasos:
    - 'Camino A: $40=4\cdot10=(2\cdot2)\cdot(2\cdot5)=2^3\cdot5$.'
    - 'Camino B: $40=8\cdot5=(2\cdot2\cdot2)\cdot5=2^3\cdot5$.'
    - 'Conclusión: ambos caminos llegan a $40=2^3\cdot5$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué garantiza el Teorema Fundamental de la Aritmética?"
    choices:
      - {text: "Que la descomposición prima de un número es única, salvo el orden", is_correct: true}
      - {text: "Que todos los números son primos", is_correct: false}
      - {text: "Que la descomposición depende del método usado", is_correct: false}
      - {text: "Que solo los números pares tienen descomposición prima", is_correct: false}
    explanation: "La correcta es Que la descomposición prima de un número es única, salvo el orden: no existen dos conjuntos distintos de factores primos para el mismo número."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo razonamiento del ejemplo guiado, ¿pueden dos estudiantes obtener descomposiciones primas distintas para 100 usando métodos diferentes?"
    choices:
      - {text: "No, ambos deben llegar a $2^2\\cdot5^2$", is_correct: true}
      - {text: "Sí, depende del método elegido", is_correct: false}
      - {text: "Sí, si empiezan con factores distintos", is_correct: false}
      - {text: "No se puede saber sin más información", is_correct: false}
    explanation: "La correcta es No, ambos deben llegar a $2^2\\cdot5^2$: la unicidad del teorema lo garantiza."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Descompón el número usando cualquier método disponible (árbol de factores o tabla de divisiones).'
  - 'Paso 2: Ordena los factores primos obtenidos de menor a mayor.'
  - 'Paso 3: Escribe el producto final en forma de potencias. Esta representación es la única y definitiva para dicho número.'
errores_correccion: |
  Un error frecuente es creer que dos caminos distintos de descomposición dan factores
  primos diferentes. Otro error es pensar que $2^3\cdot3$ y $2\cdot3^3$ son la misma
  descomposición, ignorando los exponentes.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Un estudiante descompuso el número $40$ como $2^3 \cdot 5$. Otro estudiante lo descompuso como $5 \cdot 2^3$. ¿Quién de los dos tiene la razón según el Teorema Fundamental de la Aritmética?'
    alternativas:
      - "Ambos, solo cambia el orden"
      - "Solo el primero"
      - "Ninguno, la descomposición correcta es distinta"
    respuesta: "Ambos, solo cambia el orden"
    solucion_pasos:
      - 'Paso a: Analizamos las descomposiciones. Ambas contienen los mismos factores primos: tres factores $2$ y un factor $5$.'
      - 'Paso b: El Teorema Fundamental de la Aritmética afirma que la descomposición es única "salvo el orden de los factores".'
      - 'Paso c: Dado que $2^3 \cdot 5 = 5 \cdot 2^3 = 40$, ambos estudiantes tienen la razón; simplemente los escribieron en orden diferente.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Determina si existe alguna otra combinación de números primos cuyo producto sea exactamente $14$ diferente de $2 \cdot 7$.'
    alternativas:
      - "No, la descomposición es única"
      - "Sí, existe otra combinación"
      - "No se puede determinar"
    respuesta: "No, la descomposición es única"
    solucion_pasos:
      - 'Paso a: El número $14$ se descompone en los factores primos $2$ y $7$ ($2 \cdot 7 = 14$).'
      - 'Paso b: Aplicando el Teorema Fundamental de la Aritmética, sabemos que la descomposición prima de cualquier número entero es única.'
      - 'Paso c: Por lo tanto, no existe ninguna otra combinación de números primos que dé como resultado $14$.'
  - titulo: '¿Se puede expresar el número compuesto $21$ como el producto de dos números primos distintos de $3$ y $7$?'
    respuesta: 'No'
    solucion_pasos:
      - 'El Teorema Fundamental de la Aritmética garantiza que la descomposición de $21$ en factores primos es única.'
      - 'La única descomposición en primos para $21$ es $3 \cdot 7$.'
      - 'Por lo tanto, es imposible encontrar otros factores primos diferentes para expresararlo.'
  - titulo: '¿Cambia la descomposición prima de un número si usamos el método del árbol en lugar del método de la tabla?'
    respuesta: 'No'
    solucion_pasos:
      - 'Los métodos del árbol y de la tabla son solo herramientas o caminos diferentes para llegar a la descomposición.'
      - 'Debido a la propiedad de unicidad del Teorema Fundamental de la Aritmética, el resultado final siempre será idéntico en ambos métodos.'
errores_frecuentes:
  - 'Creer que si dos personas usan caminos diferentes para descomponer un número, obtendrán factores primos distintos.'
  - 'Olvidar la condición de que el teorema aplica para números mayores que 1.'
  - 'Pensar que $2^3 \cdot 3$ y $2 \cdot 3^3$ son la misma descomposición porque tienen los mismos números primos de base, ignorando los exponentes.'
  - 'Creer que la unicidad prohíbe cambiar el orden de los factores.'
  - 'Asociar la unicidad con que el número de factores primos deba ser único para todos los números.'
afirmaciones_verdaderas:
  - "La descomposición prima de un número es única, sin importar el método usado."
  - "El Teorema Fundamental de la Aritmética garantiza esta unicidad."
al_terminar_debes_poder: |
  Enunciar el Teorema Fundamental de la Aritmética y aplicarlo para justificar que la
  descomposición prima de un número es única.
fuente: 'Teoría de Números'
estado: publicado
