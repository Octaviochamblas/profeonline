semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.DEFINICION
resumen_inicial: 'Una potencia es la forma abreviada de escribir una multiplicación de factores
  iguales: la base es el número que se multiplica y el exponente indica cuántas veces se repite.'
explicacion_simple: 'Cuando multiplicas el mismo número varias veces (por ejemplo $3 \cdot
  3 \cdot 3 \cdot 3$), la expresión se vuelve muy larga.

  Para simplificarlo, usas una **potencia**: $3^4$.

  - **Base ($3$)**: Es el número que se multiplica por sí mismo.

  - **Exponente ($4$)**: Es el número pequeño que indica cuántas veces se multiplica la base.

  - **Valor de la potencia ($81$)**: Es el resultado de multiplicar $3 \cdot 3 \cdot 3 \cdot
  3 = 81$.

  '
explicacion_formal: 'Dado un número real $a \in \mathbb{R}$ (base) y un número natural $n
  \in \mathbb{N}$ (exponente), la potencia $a^n$ se define como el producto de $n$ factores
  iguales a $a$:

  $$a^n = \underbrace{a \cdot a \cdot a \cdots a}_{n \text{ factores}}$$

  Donde $a^n$ representa el valor numérico obtenido al realizar dicha multiplicación.

  '
definiciones_clave: '- **Base ($a$)**: Número real que actúa como el factor repetido en la
  multiplicación.

  - **Exponente ($n$)**: Número que indica la cantidad de veces que la base se multiplica
  por sí misma.

  - **Potenciación**: Operación matemática que asocia a un par $(a, n)$ el valor $a^n$.

  '
propiedades_relaciones: '- **Diferencia entre producto y potencia**: $a \cdot n \neq a^n$
  (salvo casos particulares como $2^2 = 2 \cdot 2$).

  - **Base uno**: $1^n = 1$ para cualquier exponente $n$.

  - **Base cero**: $0^n = 0$ para todo exponente $n \in \mathbb{Z}^+$.

  '
ejemplo_guiado:
  enunciado: Calcula el valor numérico de la potencia $2^5$ detallando la base, el exponente
    y la multiplicación iterada.
  pasos:
  - 'Identificar la base: $a = 2$.'
  - 'Identificar el exponente: $n = 5$.'
  - 'Escribir la multiplicación de $5$ factores iguales a $2$: $2^5 = 2 \cdot 2 \cdot 2 \cdot
    2 \cdot 2$.'
  - 'Multiplicar de izquierda a derecha:'
  - '   $2 \cdot 2 = 4$'
  - '   $4 \cdot 2 = 8$'
  - '   $8 \cdot 2 = 16$'
  - '   $16 \cdot 2 = 32$'
  - Concluir que el valor de la potencia es $32$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa el exponente $n$ en la expresión de una potencia $a^n$ cuando
    $n$ es un número natural?
  choices:
  - text: La cantidad de veces que la base $a$ se multiplica por sí misma.
    is_correct: true
  - text: El número por el cual se debe sumar la base $a$.
    is_correct: false
  - text: El resultado de multiplicar la base $a$ por $n$.
    is_correct: false
  - text: El número de ceros que se agregan a la derecha de la base.
    is_correct: false
  explanation: 'La correcta es: La cantidad de veces que la base $a$ se multiplica por sí
    misma. Por definición formal de potencia $a^n$ con $n \in \mathbb{N}$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de la potencia $3^4$?
  choices:
  - text: '81'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '27'
    is_correct: false
  - text: '64'
    is_correct: false
  explanation: 'La correcta es: 81. Puesto que $3^4 = 3 \cdot 3 \cdot 3 \cdot 3 = 81$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el número base ($a$) y el exponente ($n$).'
- 'Paso 2: Escribir la base $a$ como un producto repetido $n$ veces.'
- 'Paso 3: Multiplicar los factores ordenadamente de izquierda a derecha.'
- 'Paso 4: Comprobar que no se haya multiplicado la base por el exponente.'
errores_correccion: 'Un error clásico es confundir la potencia con una multiplicación simple
  (por ejemplo, decir $5^3 = 15$). **La potencia significa multiplicar la base por sí misma**:
  $5^3 = 5 \cdot 5 \cdot 5 = 125$.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $4^3$.
  alternativas:
  - '64'
  - '12'
  - '16'
  respuesta: '64'
  solucion_pasos:
  - 'Base: $4$, Exponente: $3$.'
  - 'Desarrollo: $4 \cdot 4 \cdot 4$.'
  - 'Cálculo: $4 \cdot 4 = 16$, luego $16 \cdot 4 = 64$.'
- titulo: Ejemplo 2
  enunciado: ¿Cómo se escribe el producto $6 \cdot 6 \cdot 6 \cdot 6 \cdot 6$ en forma de
    potencia?
  alternativas:
  - $6^5$
  - $5^6$
  - $6 \cdot 5$
  respuesta: $6^5$
  solucion_pasos:
  - El número que se repite es $6$ (base).
  - Se repite $5$ veces (exponente).
  - 'Resultado: $6^5$.'
- titulo: ¿Es lo mismo $2^3$ que $3^2$?
  respuesta: 'No'
  solucion_pasos:
  - $2^3 = 2 \cdot 2 \cdot 2 = 8$.
  - $3^2 = 3 \cdot 3 = 9$.
  - Como $8 \neq 9$, la potenciación no es conmutativa.
- titulo: ¿Es correcto decir que 2^3 es lo mismo que 2·3?
  respuesta: 'No'
  solucion_pasos:
  - 2^3 = 2·2·2 = 8, mientras que 2·3 = 6; son operaciones distintas.
errores_frecuentes:
- Multiplicar la base por el exponente ($a \cdot n$).
- Invertir la base y el exponente.
- Sumar la base $n$ veces en lugar de multiplicarla.
- Escribir el resultado de la potencia como si fuera el mismo valor que la multiplicación
  de la base por el exponente (confundir 3^4 con 3·4=12).
- Olvidar que a^0 y a^1 son casos particulares dentro de la definición general de potencia.
afirmaciones_verdaderas:
- En una potencia $a^n$, el número $a$ es la base y $n$ es el exponente.
- La potenciación no cumple con la propiedad conmutativa en general.
al_terminar_debes_poder: 'Debes ser capaz de interpretar y calcular el valor de cualquier
  potencia con base real y exponente natural, diferenciando la potenciación de una multiplicación
  directa.

  '
fuente: Texto escolar MINEDUC — Matemática 8° Básico / 1° Medio.
