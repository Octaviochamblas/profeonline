semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.DEFINICION
resumen_inicial: Una potencia es una operación matemática que representa la multiplicación abreviada de factores iguales, compuesta por una base que se multiplica y un exponente que indica cuántas veces se repite.
explicacion_simple: '![Concepto de potencia](/static/img/nodos/concepto-de-potencia-intro.svg)


  Una potencia es una forma rápida y ordenada de escribir una multiplicación donde el mismo número se repite varias veces. En lugar de escribir $2 \cdot 2 \cdot 2 \cdot 2 \cdot 2$, escribimos $2^5$. El número de abajo ($2$) se llama **base** y es el que se repite; el número pequeño de arriba ($5$) se llama **exponente** y cuenta cuántas veces se multiplica.'
explicacion_formal: 'Sea $a \in \mathbb{R}$ un número real y $n \in \mathbb{N}$ un número natural. La **potencia de base $a$ y exponente $n$**, denotada $a^n$, se define formalmente como el producto de $n$ factores iguales a $a$:


  $$a^n = \underbrace{a \cdot a \cdot a \cdot \dots \cdot a}_{n \text{ factores}}$$


  **Elementos constitutivos:**

  - **Base ($a$):** Número o expresión algebraica real que actúa como factor multiplicativo reiterado.

  - **Exponente ($n$):** Número que cuantifica las repeticiones del factor base.

  - **Potencia ($a^n$):** El resultado numérico exacto de la operación.


  > **Distinción operativa esencial:** La multiplicación $n \cdot a$ abrevia sumas repetidas ($a + a + \dots + a$), mientras que la potencia $a^n$ abrevia multiplicaciones repetidas ($a \cdot a \cdot \dots \cdot a$).'
definiciones_clave: '- **Potencia**: Operación que abrevia el producto de factores idénticos.

  - **Base ($a$)**: Factor constante que se multiplica reiteradamente.

  - **Exponente ($n$)**: Indicador del número de veces que se repite la base como factor.'
propiedades_relaciones: '- **Diferencia producto vs potencia**: $3 \cdot 4 = 12$ mientras que $4^3 = 64$ y $3^4 = 81$.

  - **Crecimiento exponencial**: Para bases enteras $|a| > 1$, la potencia crece a una tasa multiplicativa mucho más acelerada que la función lineal.'
ejemplo_guiado:
  enunciado: '![Ejemplos de concepto de potencia](/static/img/nodos/concepto-de-potencia-ejemplos.svg)


    Calcule el valor de las potencias $2^4$, $3^3$ y $5^2$, identificando explícitamente en cada caso su base, su exponente y el desarrollo del producto.'
  pasos:
  - 'Paso 1: Evaluar $2^4$: Base = $2$, Exponente = $4$. Desarrollo: $2 \cdot 2 \cdot 2 \cdot 2 = 16$. (Advertencia: $2 \cdot 4 = 8 \neq 16$).'
  - 'Paso 2: Evaluar $3^3$: Base = $3$, Exponente = $3$. Desarrollo: $3 \cdot 3 \cdot 3 = 9 \cdot 3 = 27$. (Advertencia: $3 \cdot 3 = 9 \neq 27$).'
  - 'Paso 3: Evaluar $5^2$: Base = $5$, Exponente = $2$. Desarrollo: $5 \cdot 5 = 25$. (Advertencia: $5 \cdot 2 = 10 \neq 25$).'
  - 'Conclusión: $2^4 = 16$, $3^3 = 27$ y $5^2 = 25$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la diferencia fundamental entre $3 \cdot 4$ y $3^4$?
  choices:
  - text: $3 \cdot 4$ suma cuatro veces el tres ($12$), mientras que $3^4$ multiplica cuatro veces el tres ($81$)
    is_correct: true
  - text: Son exactamente iguales a $12$
    is_correct: false
  - text: $3^4$ significa sumar tres más cuatro
    is_correct: false
  - text: $3 \cdot 4$ es mayor que $3^4$
    is_correct: false
  explanation: La alternativa correcta es '$3 \cdot 4$ suma cuatro veces el tres ($12$), mientras que $3^4$ multiplica cuatro veces el tres ($81$)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál es el desarrollo y resultado correcto de $2^4$?
  choices:
  - text: $2 \cdot 2 \cdot 2 \cdot 2 = 16$
    is_correct: true
  - text: $2 \cdot 4 = 8$
    is_correct: false
  - text: $4 \cdot 4 = 16$, pero la base es $4$
    is_correct: false
  - text: $2 + 2 + 2 + 2 = 8$
    is_correct: false
  explanation: La alternativa correcta es '$2 \cdot 2 \cdot 2 \cdot 2 = 16$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar con precisión la base $a$ y el exponente $n$.'
- 'Paso 2: Expandir la expresión como una cadena de $n$ factores iguales a la base $a$.'
- 'Paso 3: Multiplicar sucesivamente los factores de izquierda a derecha para obtener el valor final.'
errores_correccion: '- **Error 1: Multiplicar la base por el exponente (pensar que $2^3 = 6$).** **Cómo corregirlo:** La base se multiplica POR SÍ MISMA tantas veces como diga el exponente ($2^3 = 2 \cdot 2 \cdot 2 = 8$).

  - **Error 2: Confundir suma reiterada con potencia.** **Cómo corregirlo:** $x + x + x = 3x$ (tres veces $x$ sumado), mientras que $x \cdot x \cdot x = x^3$ (tres factores $x$ multiplicados).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor de $4^3$?
  alternativas:
  - $64$
  - $12$
  - $16$
  respuesta: $64$
  solucion_pasos:
  - $4^3 = 4 \cdot 4 \cdot 4 = 16 \cdot 4 = 64$.
- titulo: Ejemplo 2
  enunciado: ¿Cómo se escribe como potencia el producto $7 \cdot 7 \cdot 7 \cdot 7 \cdot 7$?
  alternativas:
  - $7^5$
  - $5^7$
  - $35$
  respuesta: $7^5$
  solucion_pasos:
  - La base es $7$ y se repite $5$ veces $\implies 7^5$.
- titulo: ¿Es 3 elevado a 2 igual a 6?
  respuesta: 'No'
  solucion_pasos:
  - No, $3^2 = 3 \cdot 3 = 9$, mientras que $3 \cdot 2 = 6$.
  alternativas:
  - texto: No, 3 elevado a 2 es 9 ($3 \cdot 3$)
    es_correcta: true
    retroalimentacion: ¡Correcto! La base se multiplica por sí misma, no por el exponente.
  - texto: Sí, porque 3 por 2 es 6
    es_correcta: false
    retroalimentacion: Incorrecto, eso corresponde a una multiplicación simple.
  - texto: No, es igual a 8
    es_correcta: false
    retroalimentacion: Incorrecto, $3 \cdot 3 = 9$.
- titulo: ¿Representa a * a * a la potencia a³?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición $a \cdot a \cdot a = a^3$.
  alternativas:
  - texto: Sí, es el producto de tres factores iguales a 'a'
    es_correcta: true
    retroalimentacion: ¡Correcto! Es la definición de potencia con exponente 3.
  - texto: No, representa 3a
    es_correcta: false
    retroalimentacion: Incorrecto, $3a = a + a + a$.
  - texto: Solo si 'a' es un número positivo
    es_correcta: false
    retroalimentacion: Incorrecto, aplica para cualquier número real 'a'.
errores_frecuentes:
- Multiplicar la base por el exponente ($3^4 = 12$ en lugar de $81$).
- Confundir la base con el exponente ($2^5$ calculado como $5^2$).
- Pensar que sumar números iguales genera una potencia ($4 + 4 + 4 = 4^3$ en lugar de $3 \cdot 4$).
- Olvidar que el exponente indica la cantidad de factores, no cuántos signos de multiplicación se escriben.
- Asumir que potencias con bases distintas se pueden multiplicar sumando exponentes.
afirmaciones_verdaderas:
- Una potencia $a^n$ representa el producto de $n$ factores iguales a la base $a$.
- La base es el factor repetido y el exponente es el contador de repeticiones.
- El cálculo de una potencia $a^n$ con $n \in \mathbb{N}$ no equivale a la multiplicación simple $a \cdot n$.
al_terminar_debes_poder: '![Síntesis de concepto de potencia](/static/img/nodos/concepto-de-potencia-resumen.svg)


  QUÉ: Definir, interpretar y calcular potencias elementales en $\mathbb{R}$.


  CÓMO: Identificando la base $a$ como el factor que se multiplica y el exponente $n$ como la cantidad de repeticiones, expandiendo el producto iterado $a^n = a \cdot a \dots a$ y evitando el error de multiplicar la base por el exponente.'
