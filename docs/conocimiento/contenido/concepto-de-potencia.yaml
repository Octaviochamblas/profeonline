semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.DEFINICION
resumen_inicial: Una potencia $a^n$ es la expresión matemática abreviada de multiplicar
  una base $a$ por sí misma tantas veces como indique el exponente $n$.
explicacion_simple: Una potencia es una forma rápida de escribir una multiplicación
  repetida del mismo número. El número grande que se multiplica se llama base, y el
  número pequeño que está arriba se llama exponente, el cual indica cuántos factores
  de la base debemos multiplicar.
explicacion_formal: 'Sea $a \in \mathbb{R}$ y $n \in \mathbb{N}$, la **Potencia $a^n$**
  se define inductivamente como el producto de $n$ factores iguales:


  $$a^n = \underbrace{a \cdot a \cdot a \dots a}_{n \text{ factores}}$$


  **Desglose de términos:**

  - $a \in \mathbb{R}$: Base de la potencia (número que se multiplica por sí mismo).

  - $n \in \mathbb{N}$: Exponente de la potencia (cantidad de factores repetidos).

  - $a^n$: Valor numérico de la potencia (resultado del producto abreviado).


  > **Complemento didáctico:** La potenciación es una operación no conmutativa ($a^b
  \neq b^a$ en general, por ejemplo $2^3 = 8 \neq 3^2 = 9$).'
definiciones_clave: '- **Potencia $a^n$**: Expresión abreviada del producto iterado
  de $n$ factores iguales a la base $a$.'
propiedades_relaciones: '- **No conmutatividad**: $a^b \neq b^a$ salvo excepciones
  como $2^4 = 4^2 = 16$.'
ejemplo_guiado:
  enunciado: Exprese como multiplicación reiterada y calcule el valor de la potencia
    $3^4$.
  pasos:
  - 'Paso 1: Identificar la base ($a = 3$) y el exponente ($n = 4$).'
  - 'Paso 2: Escribir $3^4$ como el producto de $4$ factores iguales a $3$: $3 \cdot
    3 \cdot 3 \cdot 3$.'
  - 'Paso 3: Calcular el producto paso a paso: $3 \cdot 3 = 9 \implies 9 \cdot 3 =
    27 \implies 27 \cdot 3 = 81$.'
  - 'Conclusión: El valor de la potencia $3^4$ es $81$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué representa el exponente n en la potencia a^n para un número natural
    n?
  choices:
  - text: La cantidad de veces que la base a se multiplica por sí misma
    is_correct: true
  - text: El número que se suma a la base a
    is_correct: false
  - text: La división entre a y n
    is_correct: false
  - text: La raíz cuadrada de a
    is_correct: false
  explanation: La alternativa correcta es 'La cantidad de veces que la base a se multiplica
    por sí misma'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3^4, ¿cuál fue el resultado final del cálculo?
  choices:
  - text: '81'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '64'
    is_correct: false
  - text: '27'
    is_correct: false
  explanation: La alternativa correcta es '81'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar claramente el valor de la base $a$ y del exponente $n$.'
- 'Paso 2: Desarrollar el producto reiterado escribiendo $n$ factores de la base $a$.'
- 'Paso 3: Realizar las multiplicaciones sucesivas para obtener el resultado de la
  potencia.'
errores_correccion: '- **Error 1: Multiplicar la base por el exponente ($3^4 = 3 \cdot
  4 = 12$).** **Cómo corregirlo:** Una potencia NUNCA se calcula multiplicando base
  por exponente; se multiplica la base por SÍ MISMA ($3 \cdot 3 \cdot 3 \cdot 3 =
  81$).


  - **Error 2: Sumar la base $n$ veces ($3^4 = 3 + 3 + 3 + 3 = 12$).** **Cómo corregirlo:**
  La potenciación abrevia la MULTIPLICACIÓN, no la suma.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $2^5$.
  alternativas:
  - '32'
  - '10'
  - '25'
  respuesta: '32'
  solucion_pasos:
  - $2^5 = 2 \cdot 2 \cdot 2 \cdot 2 \cdot 2 = 32$.
- titulo: Ejemplo 2
  enunciado: ¿Es $5^3$ equivalente a $3^5$?
  alternativas:
  - No, 5^3 = 125 y 3^5 = 243 (la potenciación no es conmutativa)
  - Sí, dan lo mismo
  - Sí, ambos dan 15
  respuesta: No, 5^3 = 125 y 3^5 = 243 (la potenciación no es conmutativa)
  solucion_pasos:
  - $5^3 = 125 \neq 3^5 = 243$.
- titulo: ¿Es 10^2 igual a 100?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10 \cdot 10 = 100$.
- titulo: ¿Representa a^3 el producto a · a · a?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de potencia natural.
errores_frecuentes:
- Calcular una potencia $a^n$ mediante la multiplicación simple entre la base $a$
  y el exponente $n$.
- La potenciación es una operación conmutativa donde $a^b$ da el mismo valor que $b^a$
  para todo par de números.
- Sumar la base por sí misma $n$ veces para evaluar la potencia $a^n$.
- La potencia $2^3$ equivale numéricamente a la multiplicación $2 \cdot 3 = 6$.
- El valor de una potencia depende del orden en que se escriban los factores multiplicados.
afirmaciones_verdaderas:
- Una potencia $a^n$ representa el producto de $n$ factores iguales a la base $a$.
- La potenciación no es una operación conmutativa, por lo que $a^b \neq b^a$ en general.
al_terminar_debes_poder: Al terminar serás capaz de evaluar y desarrollar potencias
  $a^n$, diferenciando la multiplicación reiterada del producto simple entre base
  y exponente.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
