semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.DISTRIBUTIVA_RESTA
resumen_inicial: La propiedad distributiva de la multiplicación respecto de la resta establece que $q_1 \cdot (q_2 - q_3) = (q_1 \cdot q_2) - (q_1 \cdot q_3)$.
explicacion_simple: 'De la misma forma que con la suma, podemos distribuir la multiplicación de una fracción sobre una resta dentro de un paréntesis. Multiplicar el factor exterior por una resta equivale a multiplicar el factor por el minuendo, restarle el producto del factor por el sustraendo.


  ![Propiedad distributiva del producto respecto de la resta](/static/img/nodos/propiedad-distributiva-del-producto-respecto-de-la-resta-intro.svg)'
explicacion_formal: 'Para cualesquiera tres racionales $q_1, q_2, q_3 \in \mathbb{Q}$, la **Distributividad del Producto respecto a la Sustracción** establece:


  $$q_1 \cdot (q_2 - q_3) = (q_1 \cdot q_2) - (q_1 \cdot q_3)$$


  **Desglose de la fórmula:**

  - Aplicación de signo: Mantiene el operador de diferencia en medio de los productos distribuidos.

  - Factorización de resta: $(q_1 \cdot q_2) - (q_1 \cdot q_3) = q_1 \cdot (q_2 - q_3)$.


  > **Complemento didáctico:** Surge directamente de combinar la distributividad aditiva con el inverso aditivo: $q_1 \cdot (q_2 + (-q_3)) = q_1 q_2 + q_1 (-q_3)$.'
definiciones_clave: '- **Propiedad distributiva respecto a la resta**: Regla $q_1 \cdot (q_2 - q_3) = q_1 q_2 - q_1 q_3$ aplicada sobre diferencias.'
propiedades_relaciones: '- **Extensión a la diferencia**: Conserva el operador de resta en el desarrollo distribuido.'
ejemplo_guiado:
  enunciado: 'Verifique la propiedad distributiva evaluando $\frac{3}{4} \cdot \left(\frac{2}{3} - \frac{1}{3}\right)$ de dos formas distintas.


    ![Ejemplo Propiedad distributiva del producto respecto de la resta](/static/img/nodos/propiedad-distributiva-del-producto-respecto-de-la-resta-ejemplos.svg)'
  pasos:
  - 'Paso 1: Vía paréntesis directo: $\frac{2}{3} - \frac{1}{3} = \frac{1}{3} \implies \frac{3}{4} \cdot \frac{1}{3} = \frac{1}{4}$.'
  - 'Paso 2: Vía distribución: $\left(\frac{3}{4} \cdot \frac{2}{3}\right) - \left(\frac{3}{4} \cdot \frac{1}{3}\right) = \frac{6}{12} - \frac{3}{12} = \frac{3}{12} = \frac{1}{4}$.'
  - 'Paso 3: Comparar ambos resultados: $\frac{1}{4} = \frac{1}{4}$.'
  - 'Conclusión: La distributividad sobre la resta se cumple exactamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión de la propiedad distributiva del producto respecto de la resta?
  choices:
  - text: q1 · (q2 - q3) = q1 · q2 - q1 · q3
    is_correct: true
  - text: q1 - (q2 · q3) = (q1 - q2) · (q1 - q3)
    is_correct: false
  - text: q1 · (q2 - q3) = q2 - q3
    is_correct: false
  - text: q1 · (q2 - q3) = q1 · q2 + q1 · q3
    is_correct: false
  explanation: La alternativa correcta es 'q1 · (q2 - q3) = q1 · q2 - q1 · q3'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3/4 · (2/3 - 1/3), ¿cuál fue el valor idéntico obtenido por ambos caminos?
  choices:
  - text: 1/4
    is_correct: true
  - text: 3/12
    is_correct: false
  - text: 1/2
    is_correct: false
  - text: 1/12
    is_correct: false
  explanation: La alternativa correcta es '1/4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar el factor $q_1$ por el minuendo $q_2$ ($q_1 \cdot q_2$).'
- 'Paso 2: Multiplicar el factor $q_1$ por el sustraendo $q_3$ ($q_1 \cdot q_3$).'
- 'Paso 3: Restar el segundo producto del primero para obtener $(q_1 \cdot q_2) - (q_1 \cdot q_3)$.'
errores_correccion: '- **Error 1: Cambiar el signo menos por más al distribuir sobre la resta.** **Cómo corregirlo:** La distributividad preserva el signo menos del paréntesis ($(q_1 q_2) - (q_1 q_3)$).


  - **Error 2: Invertir el orden de los productos en la resta distribuida.** **Cómo corregirlo:** Se debe restar estrictamente el producto del minuendo menos el producto del sustraendo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $5 \cdot (1/2 - 1/5)$ aplicando la propiedad distributiva.
  alternativas:
  - 3/2 (tras hacer 5/2 - 1 = 3/2)
  - 3/10
  - 5/2
  respuesta: 3/2 (tras hacer 5/2 - 1 = 3/2)
  solucion_pasos:
  - $5 \cdot 1/2 - 5 \cdot 1/5 = 5/2 - 1 = 5/2 - 2/2 = 3/2$.
- titulo: Ejemplo 2
  enunciado: Exprese $(4/7 \cdot 5/3) - (4/7 \cdot 2/3)$ usando factor común.
  alternativas:
  - 4/7 · (5/3 - 2/3) = 4/7 · 1 = 4/7
  - 4/7 · 3/3 = 1
  - '0'
  respuesta: 4/7 · (5/3 - 2/3) = 4/7 · 1 = 4/7
  solucion_pasos:
  - 'Factor común 4/7: $4/7 \cdot (5/3 - 2/3) = 4/7 \cdot 1 = 4/7$.'
- titulo: ¿Se cumple q1 · (q2 - q3) = q1 · q2 - q1 · q3 para cualesquiera tres racionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, la multiplicación es distributiva respecto a la sustracción en $\mathbb{Q}$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde a la aplicación rigurosa de las propiedades algebraicas en el cuerpo ℚ.
  - texto: No se cumple en ℚ
    es_correcta: false
    retroalimentacion: Incorrecto, el conjunto de los racionales cumple estrictamente esta propiedad axiomática.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa el desarrollo algebraico y los términos involucrados.
- titulo: ¿Es 2 · (3/2 - 1/2) igual a 2 · 3/2 - 2 · 1/2?
  respuesta: Sí
  solucion_pasos:
  - Sí, ambos lados evalúan exactamente a 2.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde a la aplicación rigurosa de las propiedades algebraicas en el cuerpo ℚ.
  - texto: No se cumple en ℚ
    es_correcta: false
    retroalimentacion: Incorrecto, el conjunto de los racionales cumple estrictamente esta propiedad axiomática.
  - texto: '0'
    es_correcta: false
    retroalimentacion: Incorrecto, revisa el desarrollo algebraico y los términos involucrados.
errores_frecuentes:
- La multiplicación no se puede distribuir cuando el paréntesis contiene una resta de fracciones.
- Distribuir la multiplicación sobre una resta convierte el signo de resta en un signo de división.
- El producto del factor exterior por el sustraendo se debe sumar al producto del minuendo.
- La propiedad distributiva sobre la resta requiere que los denominadores sean múltiplos de 10.
- Factorizar una diferencia de productos racionales genera una suma de fracciones.
afirmaciones_verdaderas:
- 'La multiplicación en $\mathbb{Q}$ es distributiva respecto a la sustracción: $q_1 \cdot (q_2 - q_3) = q_1 q_2 - q_1 q_3$.'
- La regla de distributividad sobre la diferencia preserva el signo de resta en el desarrollo numérico.
al_terminar_debes_poder: '**QUÉ:** Resolver y simplificar operaciones combinadas aplicando la distributividad del producto sobre la sustracción.


  **CÓMO:** Aplicando $a \cdot (b - c) = a \cdot b - a \cdot c$, prestando especial atención a la regla de signos cuando el factor exterior o los términos interiores son negativos: $-k \cdot (b - c) = -kb + kc$.


  ![Resumen Propiedad distributiva del producto respecto de la resta](/static/img/nodos/propiedad-distributiva-del-producto-respecto-de-la-resta-resumen.svg)'
