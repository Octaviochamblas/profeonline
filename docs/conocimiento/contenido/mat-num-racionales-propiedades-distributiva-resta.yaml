semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.DISTRIBUTIVA_RESTA
resumen_inicial: La propiedad distributiva del producto respecto de la resta establece
  que multiplicar un número racional por una resta equivale a multiplicar dicho número
  por el minuendo y el sustraendo y luego restar los productos.
explicacion_simple: 'Igual que con la suma, la multiplicación también se ''distribuye''
  sobre la resta. Si tienes que resolver $\frac{3}{4} \times \left(\frac{1}{2} - \frac{1}{3}\right)$,
  puedes hacerlo de dos formas:

  1. O restas primero lo de adentro $(\frac{1}{2} - \frac{1}{3} = \frac{1}{6})$ y
  luego multiplicas $\frac{3}{4} \times \frac{1}{6} = \frac{3}{24} = \frac{1}{8}$.

  2. O distribuyes la multiplicación: multiplicas $\frac{3}{4} \times \frac{1}{2}$
  y le restas $\frac{3}{4} \times \frac{1}{3}$, obteniendo $\frac{3}{8} - \frac{3}{12}
  = \frac{9}{24} - \frac{6}{24} = \frac{3}{24} = \frac{1}{8}$.

  ¡Ambos caminos entregan la misma respuesta exacta!

  '
explicacion_formal: 'Formalmente, el conjunto de los números racionales $\mathbb{Q}$
  satisface la **propiedad distributiva del producto respecto de la sustracción**:

  $$\forall q_1, q_2, q_3 \in \mathbb{Q}, \quad q_1 \cdot (q_2 - q_3) = q_1 \cdot
  q_2 - q_1 \cdot q_3$$


  Demostración basada en la distributividad sobre la adición y la definición de resta
  en $\mathbb{Q}$:

  $$q_1 \cdot (q_2 - q_3) = q_1 \cdot (q_2 + (-q_3)) = q_1 \cdot q_2 + q_1 \cdot (-q_3)
  = q_1 \cdot q_2 - q_1 \cdot q_3$$


  Factorización por Factor Común en Restas:

  $$q_1 \cdot q_2 - q_1 \cdot q_3 = q_1 \cdot (q_2 - q_3)$$

  '
definiciones_clave: '- **Propiedad distributiva del producto respecto a la resta**:
  Ley algebraico-operacional $q_1 \cdot (q_2 - q_3) = q_1 \cdot q_2 - q_1 \cdot q_3$.

  - **Factorización por factor común en restas**: Extracción de un multiplicador común
  $q_1$ fuera de una diferencia.

  - **Preservación del signo de resta**: Invarianza del operador negativo principal
  tras la distribución del factor $q_1$.

  '
propiedades_relaciones: '- **Distribución de factores negativos**: Si el factor $q_1$
  es negativo, aplica la regla de signos invirtiendo los signos de la resta: $-a \cdot
  (b - c) = -a \cdot b + a \cdot c$.

  - **Desarrollo de expresiones algebraicas**: Permite eliminar paréntesis en ecuaciones
  racionales con restas.

  - **Compatibilidad estructural en $\mathbb{Q}$**: Se deriva directamente del hecho
  de que la resta es la adición del inverso aditivo.

  '
ejemplo_guiado:
  enunciado: Demuestra la distributividad respecto a la resta calculando de dos maneras
    $\frac{4}{5} \cdot \left(\frac{3}{4} - \frac{1}{2}\right)$.
  pasos:
  - 'Camino 1 (Paréntesis primero): calcular $\frac{3}{4} - \frac{1}{2} = \frac{3
    - 2}{4} = \frac{1}{4}$.'
  - 'Multiplicar por $\frac{4}{5}$: $\frac{4}{5} \cdot \frac{1}{4} = \frac{4}{20}
    = \frac{1}{5}$.'
  - 'Camino 2 (Distributivo): calcular $\frac{4}{5} \cdot \frac{3}{4} - \frac{4}{5}
    \cdot \frac{1}{2}$.'
  - 'Productos parciales: $\frac{12}{20} - \frac{4}{10} = \frac{3}{5} - \frac{2}{5}
    = \frac{1}{5}$.'
  - 'Concluir: en ambos caminos se obtiene $\frac{1}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué es equivalente la expresión $q_1 \cdot (q_2 - q_3)$ según la propiedad
    distributiva?
  choices:
  - text: $q_1 \cdot q_2 - q_1 \cdot q_3$
    is_correct: true
  - text: $q_1 - q_2 \cdot q_3$
    is_correct: false
  - text: $(q_1 - q_2) \cdot (q_1 - q_3)$
    is_correct: false
  - text: $q_1 \cdot q_2 + q_3$
    is_correct: false
  explanation: 'La correcta es $q_1 \cdot q_2 - q_1 \cdot q_3$: la multiplicación
    se distribuye entre el minuendo y el sustraendo conservando la resta.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se simplifica el cálculo de $\frac{8}{11} \cdot \frac{9}{10} - \frac{8}{11}
    \cdot \frac{4}{10}$ usando factor común?
  choices:
  - text: \$\frac{8}{11}$ \\cdot \\left(\$\frac{9}{10}$ - \$\frac{4}{10}$\\right)
      = \$\frac{8}{11}$ \\cdot \$\frac{5}{10}$ = \$\frac{8}{11}$ \\cdot \$\frac{1}{2}$
      = \$\frac{4}{11}$
    is_correct: true
  - text: \$\frac{72}{110}$ - \$\frac{32}{110}$ = \$\frac{40}{110}$ = \$\frac{4}{11}$
    is_correct: false
  - text: \$\frac{8}{11}$ - \$\frac{5}{10}$
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: 'La alternativa correcta es: \$\frac{8}{11}$ \\cdot \\left(\$\frac{9}{10}$
    - \$\frac{4}{10}$\\right) = \$\frac{8}{11}$ \\cdot \$\frac{5}{10}$ = \$\frac{8}{11}$
    \\cdot \$\frac{1}{2}$ = \$\frac{4}{11}$. La correcta es \frac{8}{11} \cdot \left(\frac{9}{10}
    - \frac{4}{10}\right) = \frac{8}{11} \cdot \frac{5}{10} = \frac{8}{11} \cdot \frac{1}{2}
    = \frac{4}{11}: la extracción del factor común $\frac{8}{11}$ simplifica la resta
    interna a $\frac{1}{2}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el factor multiplicativo $q_1$ y la resta entre paréntesis
  $(q_2 - q_3)$.'
- 'Paso 2: Multiplicar $q_1$ por el minuendo $q_2$: $q_1 \cdot q_2$.'
- 'Paso 3: Multiplicar $q_1$ por el sustraendo $q_3$: $q_1 \cdot q_3$.'
- 'Paso 4: Restar el segundo producto del primero: $q_1 \cdot q_2 - q_1 \cdot q_3$.'
- 'Paso 5: Simplificar la fracción resultante a su forma irreductible.'
errores_correccion: 'Un error frecuente al distribuir un factor negativo sobre una
  resta es cometer errores de signos (por ejemplo hacer $-a \cdot (b - c) = -a \cdot
  b - a \cdot c$). Recuerda la regla de signos: **un número negativo por una resta
  da $-a \cdot b + a \cdot c$** (el segundo término se vuelve positivo por $- \times
  - = +$).

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $-\frac{1}{2} \cdot \left(\frac{4}{5} - \frac{2}{3}\right)$ distribuyendo
    el signo negativo.
  alternativas:
  - -\$\frac{1}{15}$
  - \$\frac{1}{15}$
  - -\$\frac{2}{15}$
  respuesta: -\$\frac{1}{15}$
  solucion_pasos:
  - 'Distribución: $\left(-\frac{1}{2} \cdot \frac{4}{5}\right) - \left(-\frac{1}{2}
    \cdot \frac{2}{3}\right)$.'
  - 'Productos: $-\frac{4}{10} - \left(-\frac{2}{6}\right) = -\frac{2}{5} + \frac{1}{3}$.'
  - 'Suma homogenizada a 15: $-\frac{6}{15} + \frac{5}{15} = -\frac{1}{15}$.'
- titulo: Ejemplo 2
  enunciado: Factoriza $\frac{7}{12} \cdot 5 - \frac{7}{12} \cdot 2$.
  alternativas:
  - 1\$\frac{3}{4}$ (o \$\frac{7}{4}$).
  - \$\frac{21}{12}$ = \$\frac{7}{4}$.
  - \$\frac{7}{12}$.
  respuesta: 1\$\frac{3}{4}$ (o \$\frac{7}{4}$).
  solucion_pasos:
  - 'Factor común $\frac{7}{12}$: $\frac{7}{12} \cdot (5 - 2) = \frac{7}{12} \cdot
    3$.'
  - 'Simplificamos 3 con 12: $\frac{7}{4} = 1\frac{3}{4}$.'
- titulo: ¿Se aplica la distributividad del producto sobre la sustracción en números
    racionales negativos?
  respuesta: Sí
  solucion_pasos:
  - Sí, se cumple universalmente para todos los elementos de $\mathbb{Q}$.
- titulo: ¿Es la sustracción de fracciones distributiva respecto del producto?
  respuesta: 'No'
  solucion_pasos:
  - No, $a - (b \cdot c) \neq (a - b) \cdot (a - c)$.
errores_frecuentes:
- Olvidar cambiar el signo del segundo término al distribuir un factor negativo sobre
  la resta.
- Multiplicar el factor solo por el minuendo y restar el sustraendo sin multiplicar.
- Confundir minuendo y sustraendo al restar los productos parciales.
- No utilizar el factor común para simplificar restas compuestas con factores repetidos.
- Creer que la sustracción es conmutativa dentro de la distributividad.
afirmaciones_verdaderas:
- 'La multiplicación de números racionales es distributiva respecto de la sustracción:
  $q_1 \cdot (q_2 - q_3) = q_1 \cdot q_2 - q_1 \cdot q_3$.'
- La extracción de factor común en restas de racionales es la operación inversa directa
  de la distributividad sobre la sustracción.
al_terminar_debes_poder: 'Debes ser capaz de aplicar la propiedad distributiva del
  producto respecto de la sustracción tanto en la expansión de paréntesis como en
  la factorización por factor común.

  '
fuente: Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números
  racionales.
