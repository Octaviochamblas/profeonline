procedimiento:
- 'Paso 1: Identifica los dos pares de lados opuestos del paralelogramo.'
- 'Paso 2: Recuerda que, por ser un paralelogramo, cada par de lados opuestos es congruente.'
- 'Paso 3: Si conoces la longitud de un lado, ya conoces la de su lado opuesto (son
  iguales).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con propiedad de lados opuestos congruentes en paralelogramos.
