semantic_id: MAT.GEO.PARALELOGRAMOS.LADOS_OPUESTOS_CONGRUENTES
resumen_inicial: 'Propiedad de lados opuestos congruentes en paralelogramos: conceptos,
  teoremas, propiedades geométricas y cálculo en Polígonos y Cuadriláteros.'
explicacion_simple: Además del paralelismo, los paralelogramos tienen una segunda
  propiedad muy útil relacionada con la longitud de sus lados.
explicacion_formal: '![Lados opuestos congruentes en un paralelogramo](/static/img/geometria/poligonos-cuadrilateros/paralelogramos-lados-opuestos-congruentes.svg)


  ### Definición formal


  En un paralelogramo $ABCD$, se cumple $AB=CD$ y $BC=AD$. Esta propiedad se puede
  demostrar trazando la diagonal AC, que forma dos triángulos congruentes por el criterio
  ALA.


  ### Desarrollo didáctico


  Esta propiedad es consecuencia directa del paralelismo: al trazar una diagonal,
  se forman dos triángulos congruentes que comparten esa diagonal, lo cual obliga
  a que los lados opuestos correspondientes sean iguales.'
definiciones_clave: '- **Propiedad de lados opuestos congruentes en paralelogramos**:
