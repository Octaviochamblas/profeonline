semantic_id: MAT.ALG.LENGUAJE_OPERACIONES.SUMA_CANTIDADES
resumen_inicial: 'Traducción de la suma entre dos cantidades: traducción, reglas y
  aplicación práctica en Lenguaje algebraico: operaciones y múltiplos.'
explicacion_simple: ¿Cómo escribes matemáticamente que tienes manzanas y además naranjas,
  sin saber cuántas hay de cada una? Usas la suma algebraica.
explicacion_formal: '### Definición formal


  Al no especificar que los números son iguales, lo general (y por lo tanto lo matemáticamente
  riguroso) es tratarlos como variables independientes usando letras distintas.


  ### Desarrollo didáctico


  Palabras clave que indican suma:

  - Más

  - Sumado con

  - Añadido a

  - Agregado a

  - El total de

  - Excedido en


  Ejemplos de traducción:

  - ''La suma de dos números distintos'': $x + y$

  - ''Un número sumado a otro número diferente'': $a + b$

  - ''El total de la edad de Juan y la edad de María'': $J + M$


  *Nota vital:* Si el enunciado dice ''la suma de dos números'' (sin especificar si
  son iguales o distintos), por convención rigurosa asumimos que **son distintos**
  y usamos letras diferentes ($x+y$). Si fueran el mismo número, diría ''la suma de
  un número con sí mismo'' ($x+x$).'
definiciones_clave: '- **Traducción de la suma entre dos cantidades**: Herramienta
