resumen_inicial: La traducción de la suma entre dos cantidades expresa relaciones
  de adición, incremento o agregación entre variables y constantes.
explicacion_simple: Cuando sumamos dos cantidades $a$ y $b$, usamos palabras como
  'la suma de', 'aumentado en', 'más' o 'incrementado por'. El orden al sumar no altera
  el resultado ($a + b = b + a$).
explicacion_formal: 'Para dos expresiones $a, b \in \mathbb{R}$, la **Adición de Cantidades**
  se formaliza por:


  $$S(a,b) = a + b$$


  **Propiedad Conmutativa:**

  $$a + b = b + a$$


  > **Complemento didáctico:** La adición es una operación cerrada y conmutativa que
  modela la unión de conjuntos disjuntos de elementos.'
definiciones_clave: '- **Suma**: Operación algebraica que combina dos o más sumandos
  en un total único.'
propiedades_relaciones: '- **Conmutatividad aditiva**: $a + b = b + a$.'
ejemplo_guiado:
  enunciado: 'Traduzca: ''La suma entre el doble de $x$ y el triple de $y$''.'
  pasos:
  - 'Paso 1: Identificar el primer sumando (''el doble de $x$''): $2x$.'
  - 'Paso 2: Identificar el segundo sumando (''el triple de $y$''): $3y$.'
  - 'Paso 3: Unir con el operador de adición: $2x + 3y$.'
  - 'Conclusión: La expresión exacta es $2x + 3y$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión algebraica para 'la suma entre el doble de x y 9'?
  choices:
  - text: 2x + 9
    is_correct: true
  - text: x^2 + 9
    is_correct: false
  - text: 2(x + 9)
    is_correct: false
  - text: 2x - 9
    is_correct: false
  explanation: La alternativa correcta es '2x + 9'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'La suma entre el doble de x y el triple de
    y', ¿cuál fue el resultado?
  choices:
  - text: 2x + 3y
    is_correct: true
  - text: (2x)(3y)
    is_correct: false
  - text: 2x - 3y
    is_correct: false
  - text: 6xy
    is_correct: false
  explanation: La alternativa correcta es '2x + 3y'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar cada uno de los sumandos.'
- 'Paso 2: Colocar el signo $+$ entre ellos.'
- 'Paso 3: Agrupar términos semejantes si fuera necesario.'
errores_correccion: '- **Error 1: Multiplicar los términos al leer ''la suma de a
  y b'' escribiendo $ab$.** **Cómo corregirlo:** La palabra ''suma'' exige el operador
  $+$ ($a + b$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Qué expresión representa 'la suma entre un número p y 15'?
  alternativas:
  - p + 15
  - 15p
  - p - 15
  - p / 15
  respuesta: p + 15
  solucion_pasos:
  - '1. Variable: p.'
  - '2. Operación suma con 15: p + 15.'
- titulo: Ejemplo 2
  enunciado: Si agregamos 8 unidades a la suma de a y b, ¿cuál es la expresión?
  alternativas:
  - a + b + 8
  - 8(a + b)
  - ab + 8
  - a + 8b
  respuesta: a + b + 8
  solucion_pasos:
  - '1. Suma de a y b: a + b.'
  - '2. Agregar 8 unidades: a + b + 8.'
- titulo: ¿Es la suma entre a y b equivalente a b + a?
  respuesta: Sí
  solucion_pasos:
  - Sí, la adición de números reales es conmutativa.
- titulo: ¿Es la suma entre x e y equivalente a x * y?
  respuesta: 'No'
  solucion_pasos:
  - No, la adición junta valores mientras que el producto los multiplica.
errores_frecuentes:
- Multiplicar los términos en lugar de sumarlos al leer la palabra 'suma'.
- Escribir x^2 en lugar de 2x al sumar una variable consigo misma (x + x).
- Cambiar el signo de adición por sustracción al traducir la palabra 'incremento'.
- Omitir uno de los sumandos al traducir enunciados de tres cantidades.
- Declarar la suma de dos cuadrados x^2 + y^2 como equivalente al cuadrado de la suma
  (x + y)^2.
afirmaciones_verdaderas:
- 'La suma de dos cantidades a y b es conmutativa: a + b = b + a.'
- La adición de una variable x consigo misma tres veces resulta en 3x.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Lenguaje Algebraico.
