resumen_inicial: La números impares consecutivos permite representar estructuras matemáticas
  de sucesiones y desigualdades en notación simbólica.
explicacion_simple: Al trabajar con números impares consecutivos, transformamos frases
  sobre números y relaciones algebraicas en expresiones exactas.
explicacion_formal: 'Sea $x \in \mathbb{R}$. La relación formal para **Números impares
  consecutivos** viene dada por:


  $$\text{"dos números impares consecutivos a partir de 2k+1"} \implies 2k+1, 2k+3$$


  > **Complemento didáctico:** Esta estructura fija las reglas formales de planteamiento
  para expresiones algebraicas de orden y sucesiones.'
definiciones_clave: '- **Números impares consecutivos**: Representación simbólica
  en el lenguaje algebraico de relaciones.'
propiedades_relaciones: '- **Consistencia de notación**: 2k+1, 2k+3 define la estructura
  requerida.'
