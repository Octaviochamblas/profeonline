semantic_id: MAT.ALG.LENGUAJE_RELACIONES.IMPARES_CONSECUTIVOS
resumen_inicial: 'La representación de números impares consecutivos consiste en expresar algebraicamente una secuencia de números impares contiguos mediante el incremento constante de 2 unidades $2n+1, 2n+3, 2n+5, \dots$'
explicacion_simple: |
  Los **números impares consecutivos** son números impares que se siguen uno inmediatamente después del otro en la recta numérica (de 2 en 2):
  - Ejemplos numéricos: $(1, 3, 5)$, $(11, 13, 15)$, $(-3, -1, 1, 3)$.
  - En álgebra, al igual que los pares, la diferencia entre dos impares contiguos es **$2$**:
    - **Dos impares consecutivos**: **$2n + 1$** y **$2n + 3$** (o bien $x$ y $x + 2$ si asumimos que $x$ es impar).
    - **Tres impares consecutivos**: **$2n + 1$**, **$2n + 3$** y **$2n + 5$**.
    - **Cuatro impares consecutivos**: **$2n + 1$**, **$2n + 3$**, **$2n + 5$** y **$2n + 7$**.
  - **Suma de impares consecutivos**:
    - La suma de 3 impares consecutivos: $(2n + 1) + (2n + 3) + (2n + 5) = \mathbf{6n + 9} = 3(2n + 3)$.
explicacion_formal: |
  ### Definición formal
  Una secuencia de $k$ números **impares consecutivos** generada a partir del primer entero impar $(2n+1) \in (2\mathbb{Z}+1)$ es una tupla finita en $(2\mathbb{Z}+1)^k$ definida por la adición de saltos de razón $r = 2$:

  $$\mathcal{I}_k(n) = (2n+1, \quad 2n+3, \quad 2n+5, \quad \dots, \quad 2n + (2k-1))$$

  ### Suma de $k$ Impares Consecutivos (Progresión Aritmética)
  La suma de $k$ impares consecutivos constituye la suma de una progresión aritmética con término inicial $a_1 = 2n + 1$ y razón $r = 2$:

  $$\sum_{i=0}^{k-1} (2n + 1 + 2i) = k \cdot (2n + 1) + 2 \cdot \frac{k(k-1)}{2} = 2k \cdot n + k^2$$

  Para $k = 3$: $\sum = 6n + 9 = 3(2n + 3)$. ¡Atención! La suma de 3 impares consecutivos es siempre un múltiplo de $3$ y de paridad impar.

  ### Suma de los Primeros $n$ Impares desde 1
  Un resultado clásico de teoría de números afirma que la suma de los primeros $n$ números impares consecutivos empezando desde 1 es un cuadrado perfecto exacto:

  $$1 + 3 + 5 + \dots + (2n - 1) = n^2$$

  ### Síntesis didáctica
  La progresión de impares consecutivos requiere el incremento escalar $+2$ partiendo de una base impar $2n+1$ para evitar la alternancia hacia números pares.
definiciones_clave: |
  - **Impares consecutivos**: Secuencia de enteros impares cuya diferencia entre términos contiguos es de $2$ unidades.
  - **Base impar ($2n+1$)**: Expresión canónica inicial a partir de la cual se aplican los incrementos pares de 2 unidades.
  - **Divisibilidad por 3 en 3 impares**: Propiedad aritmética por la cual la suma de tres impares consecutivos es siempre divisible por $3$.
propiedades_relaciones: |
  - **Diferencia entre impares contiguos**: $(2n + 3) - (2n + 1) = 2$.
  - **Alternativa simplificada**: Si se define la primera variable $x$ como impar ($x \in 2\mathbb{Z}+1$), la secuencia se representa como $x, x+2, x+4$.
ejemplo_guiado:
  enunciado: 'Traduce y resuelve el siguiente problema: "La suma de tres números impares consecutivos es igual a ochenta y uno. Halla los tres números".'
  pasos:
    - 'Paso 1: Planteamos los tres números impares consecutivos: $2n + 1$, $2n + 3$ y $2n + 5$.'
    - 'Paso 2: Expresamos su suma igualada a $81$: $(2n + 1) + (2n + 3) + (2n + 5) = 81$.'
    - 'Paso 3: Reducimos términos semejantes: $6n + 9 = 81$.'
    - 'Paso 4: Despejamos $n$: $6n = 81 - 9 \implies 6n = 72 \implies n = 12$.'
    - 'Paso 5: Calculamos los impares: $2(12) + 1 = 25$, $2(12) + 3 = 27$, $2(12) + 5 = 29$.'
    - 'Conclusión: Los tres números impares consecutivos son **$25, 27$ y $29$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la representación algebraica canónica de tres números impares consecutivos expresados en función de una variable entera $n$?'
    choices:
      - {text: 'Se representan sumando de dos en dos a partir de la base impar: $2n + 1$, $2n + 3$ y $2n + 5$', is_correct: true}
      - {text: 'Se representan sumando de uno en uno: $2n + 1$, $2n + 2$ y $2n + 3$', is_correct: false}
      - {text: 'Se representan como $n$, $n + 3$ y $n + 5$', is_correct: false}
      - {text: 'Se representan mediante la multiplicación $3n, 5n, 7n$', is_correct: false}
    explanation: 'La alternativa correcta es ''Se representan sumando de dos en dos a partir de la base impar: $2n + 1$, $2n + 3$ y $2n + 5$''. Salto de $+2$ sobre la base impar.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué propiedad cumple la suma de los primeros $n$ números impares consecutivos comenzando desde el 1 ($1 + 3 + 5 + \dots + 2n - 1$)?'
    choices:
      - {text: 'Es siempre igual a un cuadrado perfecto exacto dado por la expresión $n^2$', is_correct: true}
      - {text: 'Es siempre igual a un número primo', is_correct: false}
      - {text: 'Es siempre igual a un número negativo', is_correct: false}
      - {text: 'Es igual a la suma de los pares de 1 a n', is_correct: false}
    explanation: 'La alternativa correcta es ''Es siempre igual a un cuadrado perfecto exacto dado por la expresión $n^2$''. Suma de impares desde 1 = $n^2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Definir el primer número impar como $2n + 1$ (o como $x$, especificando que $x$ es impar).'
  - 'Paso 2: Sumar $+ 2$ para obtener el siguiente impar $(2n + 3)$, $+ 4$ para el tercero $(2n + 5)$, $+ 6$ para el cuarto, etc.'
  - 'Paso 3: Si el enunciado solicita la suma, sumar los términos igualando al total dado.'
  - 'Paso 4: Reducir términos semejantes y despejar la variable $n$ para hallar el valor de cada impar.'
errores_correccion: |
  - **Error 1:** Incrementar de 1 en 1 al representar impares consecutivos (escribir $2n+1, 2n+2, 2n+3$). **Cómo corregirlo:** Sumar 1 alteraría la paridad a par ($2n+2$); los impares consecutivos **SE INCREMENTAN DE 2 EN 2 ($2n+1, 2n+3, 2n+5$)**.
  - **Error 2:** Declarar que por ser impares se debe sumar de 3 en 3. **Cómo corregirlo:** La distancia entre dos impares contiguos en la recta numérica es de **2 unidades** ($3 - 1 = 2$, $5 - 3 = 2$).
ejemplos:
  - titulo: 'Dos impares consecutivos'
    enunciado: '¿Cuáles son las expresiones que representan dos impares consecutivos?'
    alternativas:
      - '$2n + 1$ y $2n + 3$'
      - '$2n + 1$ y $2n + 2$'
      - '$n + 1$ y $n + 3$'
    respuesta: '$2n + 1$ y $2n + 3$'
    solucion_pasos:
      - '1. Primer impar: $2n + 1$.'
      - '2. Segundo impar: $2n + 3$.'
  - titulo: 'Suma de tres impares'
    enunciado: '¿Cuál es la expresión reducida de la suma de tres impares consecutivos?'
    alternativas:
      - '$6n + 9$'
      - '$6n + 6$'
      - '$3n + 9$'
    respuesta: '$6n + 9$'
    solucion_pasos:
      - '1. Suma: $(2n+1) + (2n+3) + (2n+5)$.'
      - '2. Reduciendo: $6n + 9$.'
  - titulo: 'Suma desde el 1'
    enunciado: '¿Es la suma $1 + 3 + 5 + 7 = 16$ igual a $4^2$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, son los 4 primeros impares consecutivos $\implies 4^2 = 16$.'
  - titulo: 'Verificación de salto'
    enunciado: 'Para $n = 3$, ¿son los impares consecutivos $2n+1, 2n+3, 2n+5$ iguales a $7, 9, 11$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $2(3)+1=7, 7+2=9, 7+4=11$.'
errores_frecuentes:
  - 'Incrementar de uno en uno los términos 2n+1, 2n+2, 2n+3 al representar impares consecutivos.'
  - 'Sumar de tres en tres los términos al igualar la paridad impar con los múltiplos de tres.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'Declarar que la suma de dos números impares consecutivos produce un resultado impar.'
  - 'Utilizar variables distintas independientes en lugar de expresarlas en función de n.'
afirmaciones_verdaderas:
  - 'Una secuencia de números impares consecutivos se representa algebraicamente incrementando en 2 unidades cada término a partir de una base impar (2n+1, 2n+3, 2n+5...).'
  - 'La suma de los primeros n números impares consecutivos comenzando desde el 1 es igual al cuadrado perfecto n^2.'
al_terminar_debes_poder: 'Representar algebraicamente secuencias de números impares consecutivos mediante el incremento constante de 2 unidades sobre una base impar.'
