errores_frecuentes:
- Omitir el operador de desigualdad estricta o no estricta al traducir números impares
  consecutivos.
- Invertir el orden de las variables al construir la expresión de números impares
  consecutivos.
- Usar una suma cuando el enunciado de números impares consecutivos exige una resta
  o división.
- Omitir paréntesis al multiplicar expresiones en números impares consecutivos.
- Declarar que la expresión de números impares consecutivos es válida sólo para números
  pares.
afirmaciones_verdaderas:
- La traducción simbólica de números impares consecutivos preserva la relación de
  orden o sucesión entre cantidades.
- La notación algebraica permite expresar relaciones numéricas complejas de forma
  compacta.
al_terminar_debes_poder: Al terminar serás capaz de traducir expresiones de números
