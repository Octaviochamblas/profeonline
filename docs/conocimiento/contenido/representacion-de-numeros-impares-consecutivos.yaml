semantic_id: MAT.ALG.LENGUAJE_RELACIONES.IMPARES_CONSECUTIVOS
resumen_inicial: 'Representación de números impares consecutivos: traducción, reglas
  y aplicación práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: ¿A qué distancia está el 5 del 7? A dos unidades. Curiosamente,
  la distancia entre impares es exactamente la misma que la distancia entre pares.
explicacion_formal: '### Definición formal


  La paridad se conserva sumando números pares. Impar + Par = Impar. Si sumas un impar,
  te cambias de bando (Impar + Impar = Par).


  ### Desarrollo didáctico


  Análisis del salto:

  1. Base impar garantizada: $2n+1$.

  2. Si a un impar le sumo 1, me vuelvo par. Prohibido.

  3. Si le sumo 2, vuelvo a caer en la casilla impar: $(2n+1) + 2 = 2n+3$.

  4. El siguiente será $(2n+3) + 2 = 2n+5$.


  Cuidado con la trampa psicológica. Muchos estudiantes creen que como son ''impares'',
  deben sumar números impares ($+1, +3, +5$). Eso es un error letal. Para mantener
  la imparidad, debes dar saltos pares ($+2, +4$). Impar + Par = Impar.'
definiciones_clave: '- **Representación de números impares consecutivos**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
