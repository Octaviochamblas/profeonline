procedimiento:
- 'Paso 1: Constatar que el índice de la raíz sea un entero par ($2, 4, 6...$).'
- 'Paso 2: Evaluar el signo del coeficiente exterior $a$.'
- 'Paso 3: Si $a > 0$, formular $\operatorname{Rec}(f) = [0, +\infty[$ con mínimo en $(0, 0)$.'
- 'Paso 4: Si $a < 0$, formular $\operatorname{Rec}(f) = ]-\infty, 0]$ con máximo en $(0, 0)$.'
errores_correccion: '- **Error común:** Pensar que $f(x) = \sqrt{x}$ tiene recorrido $\mathbb{R}$ porque las raíces tienen dos signos $(\pm)$.

  - **Cómo corregirlo:** La **función matemática** raíz cuadrada se define **exclusivamente con el signo positivo principal**: $\operatorname{Rec} = \mathbf{[0, +\infty[}$.'
ejemplos:
- titulo: 'Ejemplo 1: Recorrido raíz cuarta positiva'
  enunciado: 'El recorrido de $f(x) = 12\sqrt[4]{x}$ es:'
  alternativas:
  - '[0, +inf['
  - ']-inf, 0]'
  - R
  - '[12, +inf['
  respuesta: '[0, +inf['
  solucion_pasos:
  - 'Paso 1: Índice par con $a = 12 > 0 \implies \operatorname{Rec}(f) = [0, +\infty[$.'
- titulo: 'Ejemplo 2: Recorrido raíz par negativa'
  enunciado: 'El recorrido de $g(x) = -\sqrt{x}$ es:'
  alternativas:
  - ']-inf, 0]'
  - '[0, +inf['
  - R
  - ']-inf, -1]'
  respuesta: ']-inf, 0]'
  solucion_pasos:
  - 'Paso 1: $a = -1 < 0 \implies \operatorname{Rec}(g) = ]-\infty, 0]$.'
- titulo: 'Ejemplo 3: Preimagen en raíz par'
  enunciado: 'Halla la preimagen de $y = 6$ en $f(x) = 3\sqrt{x}$:'
  alternativas:
  - x = 4
  - x = 2
  - x = 36
  - No existe
  respuesta: x = 4
  solucion_pasos:
  - 'Paso 1: $3\sqrt{x} = 6 \implies \sqrt{x} = 2 \implies x = 4$.'
- titulo: 'Ejemplo 4: Cota de raíz par'
  enunciado: 'En $f(x) = 8\sqrt[6]{x}$, el valor $y = 0$ representa:'
  alternativas:
  - El mínimo absoluto de la función
  - El máximo absoluto de la función
  - Una asíntota
  - Un punto de inflexión
  respuesta: El mínimo absoluto de la función
  solucion_pasos:
  - 'Paso 1: Con $a > 0$, el origen es la cota inferior mínima.'
errores_frecuentes:
- Asumir que las raíces cuadradas como función entregan dos signos ± simultáneos.
- Escribir [0, -inf[ en lugar de ]-inf, 0] para coeficientes negativos.
- Olvidar incluir el cero en el recorrido.
afirmaciones_verdaderas:
- El recorrido de una función potencia asociada a una raíz de índice par es [0, +∞[ para a > 0 y ]-∞, 0] para a < 0.
- Por definición de función, el radical par toma exclusivamente la rama principal no negativa.
al_terminar_debes_poder: '**QUÉ:** Determinar el recorrido de funciones potencia asociadas a raíces de índice par.


  **CÓMO:** Aplicando la no negatividad del radical principal y evaluando el signo del coeficiente a para formular [0, +∞[ o ]-∞, 0].


