semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.RECORRIDO_RAIZ_PAR
resumen_inicial: La determinación del recorrido de funciones potencia asociadas a raíces de índice par $f(x) = a \sqrt[2k]{x}$ establece que $\operatorname{Rec}(f) = [0, +\infty[$ si $a > 0$ y $\operatorname{Rec}(f) = ]-\infty, 0]$ si $a < 0$, debido a la no negatividad intrínseca del operador radical principal $\sqrt[2k]{x} \ge 0$.
explicacion_simple: "![La determinación del recorrido de funciones potencia asociadas a raíces de índice par $f(x) = a \\sqrt[2k]{x}$ establece que $\\operatorname{Rec}(f) = [0, +\\infty[$ si $a > 0$ y $\\operatorname{Rec}(f) = ]-\\infty, 0]$ si $a < 0$, debido a la no negatividad intrínseca del operador radical principal $\\sqrt[2k]{x} \\ge 0$](/static/img/nodos/determinacion-del-recorrido-de-funciones-potencia-asociadas-a-raices-de-indice-par-intro.svg)\n\n\nPor definición universal de función matemática, la raíz de índice par **siempre entrega el resultado positivo o cero** ($\\\\sqrt[2k]{x} \\ge 0$):\n\n- **Si $a > 0$ (como $f(x) = 3\\sqrt{x}$):**\n  - El resultado de la raíz $(\\ge 0)$ se multiplica por un positivo.\n  - **$\\operatorname{Rec}(f) = [0, +\\infty[$** (la curva vive en el **primer cuadrante**, desde $y = 0$ hacia arriba).\n- **Si $a < 0$ (como $g(x) = -2\\sqrt{x}$):**\n  - El resultado de la raíz $(\\ge 0)$ se multiplica por un negativo, dando siempre cero o negativo.\n\
  \  - **$\\operatorname{Rec}(g) = ]-\\infty, 0]$** (la curva vive en el **cuarto cuadrante**, desde $y = 0$ hacia abajo).\n- **El vértice:** En ambos casos, el punto de inicio es el origen $(0, 0)$, por lo que **el cero SIEMPRE está incluido con corchete cerrado $[0$ ó $0]$**."
explicacion_formal: "Sea $f: [0, +\\infty[ \\to \\mathbb{R}$ definida por $f(x) = a \\sqrt[2k]{x}$ con $k \\in \\mathbb{Z}^+$ y $a \\in \\mathbb{R}^*$.\nPor la definición canónica del radical aritmético principal en $\\mathbb{R}$:\n$$\\forall x \\in [0, +\\infty[: \\quad \\sqrt[2k]{x} \\ge 0 \\quad \\land \\quad \\sqrt[2k]{x} = 0 \\iff x = 0$$\n\n**Análisis del conjunto imagen según el signo de $a$**:\n1. **Para $a > 0$**:\n   $$a \\cdot \\sqrt[2k]{x} \\ge 0, \\; \\forall x \\ge 0 \\implies \\operatorname{Rec}(f) = [0, +\\infty[$$\n   Para cada $y_0 \\ge 0$, existe una única preimagen $x_0 = (y_0 / a)^{2k} \\in [0, +\\infty[$.\n2. **Para $a < 0$**:\n   $$a \\cdot \\sqrt[2k]{x} \\le 0, \\; \\forall x \\ge 0 \\implies \\operatorname{Rec}(f) = ]-\\infty, 0]$$\n   Para cada $y_0 \\le 0$, existe una única preimagen $x_0 = (y_0 / a)^{2k} \\in [0, +\\infty[$."
definiciones_clave: '- **Radical aritmético principal**: Convenio funcional que asigna exclusivamente la raíz no negativa $\ge 0$.

  - **Recorrido semiacotado en el origen**: Intervalo $[0, +\infty[$ o $]-\infty, 0]$ con frontera fija en $y = 0$.'
propiedades_relaciones: '- **Inyectividad en el dominio**: A diferencia de las potencias pares $x^{2k}$ (que tienen 2 preimágenes), las raíces pares son **estrictamente inyectivas** en $[0, +\infty[$.

  - **Cota extrema**: $y = 0$ es mínimo absoluto si $a > 0$ y máximo absoluto si $a < 0$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del recorrido de funciones potencia asociadas a raíces de índice par $f(x) = a \sqrt[2k]{x}$ establece que $\operatorname{Rec}(f) = [0, +\infty[$ si $a > 0$ y $\operatorname{Rec}(f) = ]-\infty, 0]$ si $a < 0$, debido a la no negatividad intrínseca del operador radical principal $\sqrt[2k]{x} \ge 0$](/static/img/nodos/determinacion-del-recorrido-de-funciones-potencia-asociadas-a-raices-de-indice-par-ejemplos.svg)



    Determina el recorrido y halla la preimagen correspondiente para:

    1) $f(x) = 5\sqrt{x}$ para $y = 20$

    2) $g(x) = -3\sqrt[4]{x}$ para $y = -6$'
  pasos:
  - 'Paso 1: Para $f(x) = 5\sqrt{x}$ ($a = 5 > 0$):

    - **$\operatorname{Rec}(f) = [0, +\infty[$**.

    - Preimagen: $5\sqrt{x} = 20 \implies \sqrt{x} = 4 \implies x = 4^2 = \mathbf{16}$.'
  - 'Paso 2: Para $g(x) = -3\sqrt[4]{x}$ ($a = -3 < 0$):

    - **$\operatorname{Rec}(g) = ]-\infty, 0]$**.

    - Preimagen: $-3\sqrt[4]{x} = -6 \implies \sqrt[4]{x} = 2 \implies x = 2^4 = \mathbf{16}$.'
