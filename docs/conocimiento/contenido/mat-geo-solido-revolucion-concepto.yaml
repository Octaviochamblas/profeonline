semantic_id: MAT.GEO.CUERPOS_REDONDOS_BASE.SOLIDOS_REVOLUCION_CONCEPTO
resumen_inicial: 'Concepto de sólido de revolución: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: Si giras rápidamente una figura plana (como un rectángulo) alrededor
  de una línea fija, el 'barrido' que genera en el espacio es un sólido de revolución.
explicacion_formal: '![Concepto de sólido de revolución](/static/img/geometria/espacio-cuerpos/solido-revolucion-concepto.svg)


  ### Definición formal


  Un sólido de revolución se obtiene al girar una región plana 360° alrededor de una
  recta fija (el eje de rotación), que generalmente es uno de los lados o un eje de
  simetría de la figura original.


  ### Desarrollo didáctico


  En la figura, un rectángulo gira alrededor de uno de sus lados (el eje vertical),
  generando un cilindro. Según la figura plana que se haga girar (rectángulo, triángulo
  rectángulo, semicírculo), se obtienen distintos cuerpos redondos: cilindro, cono
  o esfera respectivamente.'
definiciones_clave: '- **Concepto de sólido de revolución**: Elemento o propiedad
