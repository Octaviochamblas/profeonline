procedimiento:
- 'Paso 1: Identifica la figura plana que se hará girar y el eje de rotación (una
  recta fija).'
- 'Paso 2: Imagina el giro de 360° completo de la figura alrededor del eje.'
- 'Paso 3: Reconoce el cuerpo geométrico tridimensional que ''barre'' ese giro completo.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con concepto de sólido de revolución.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de concepto de sólido de revolución para determinar
