semantic_id: MAT.GEO.HOMOTECIA.AMPLIACION
resumen_inicial: 'Efecto de ampliación en una homotecia con valor absoluto de la razón
  mayor que 1: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia,
  Semejanza y Homotecia.'
explicacion_simple: 'Independientemente de si una homotecia es directa o inversa,
  existe un factor separado que determina si la figura se agranda o se achica: el
  valor absoluto de la razón.'
explicacion_formal: '![Homotecia de ampliación](/static/img/geometria/congruencia-semejanza/homotecia-ampliacion.svg)


  ### Definición formal


  Si $|k|>1$, cada distancia en la figura imagen es $|k|$ veces la distancia correspondiente
  en la figura original, produciendo una figura más grande, sin importar si $k$ es
  positivo (directa) o negativo (inversa).


  ### Desarrollo didáctico


  Tanto k=3 como k=-3 producen una ampliación (el triple del tamaño), pero con orientación
  distinta: k=3 mantiene la orientación (directa), mientras que k=-3 la invierte respecto
  al centro (inversa).'
definiciones_clave: '- **Efecto de ampliación en una homotecia con valor absoluto
  de la razón mayor que 1**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a efecto de ampliación en una homotecia con
  valor absoluto de la razón mayor que 1.'
ejemplo_guiado:
  enunciado: En la aplicación de efecto de ampliación en una homotecia con valor absoluto
    de la razón mayor que 1, se establece una razón $k = 2.0$ entre dos figuras homólogas
    de longitud original $L = 45\text{ cm}$. Calcula la longitud transformada $L'$.
  pasos:
  - Aplicar el criterio o teorema de efecto de ampliación en una homotecia con valor
    absoluto de la razón mayor que 1.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 2.0 \cdot 45$.'
  - Concluir que la medida obtenida en efecto de ampliación en una homotecia con valor
    absoluto de la razón mayor que 1 es $L' = 90.0\text{ cm}$.
