semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.POTENCIA_DE_PRODUCTO
resumen_inicial: La potencia de un producto es igual al producto de las potencias de cada
  uno de sus factores ($(a \cdot b)^n = a^n \cdot b^n$).
explicacion_simple: 'El exponente se distribuye hacia cada uno de los factores que se están
  multiplicando dentro del paréntesis:

  $$(2 \cdot 3)^3 = 2^3 \cdot 3^3 = 8 \cdot 27 = 216$$

  Comprobando de forma directa: $(2 \cdot 3)^3 = 6^3 = 216$. Da exactamente lo mismo.'
explicacion_formal: 'Para todo $a, b \in \mathbb{R}$ y $n \in \mathbb{R}$, se cumple la distributividad
  de la potencia sobre la multiplicación:

  $$(a \cdot b)^n = a^n \cdot b^n$$'
definiciones_clave: '- **Distributividad sobre el producto**: Propiedad que permite repartir
  el exponente a cada factor de una multiplicación.'
propiedades_relaciones: '- **Inaplicabilidad en suma/resta**: $(a + b)^n \neq a^n + b^n$ (¡jamás
  distribuyas en sumas o restas!).'
ejemplo_guiado:
  enunciado: Desarrolla y simplifica $(2x^3)^4$.
  pasos:
  - 'Distribuir el exponente $4$ a cada factor dentro del paréntesis: $(2)^4 \cdot (x^3)^4$.'
  - 'Calcular la potencia del coeficiente: $2^4 = 16$.'
  - 'Aplicar potencia de potencia en la variable: $(x^3)^4 = x^{3 \cdot 4} = x^{12}$.'
  - 'Combinar ambos resultados: $16x^{12}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué es igual la expresión $(3ab)^2$?
  choices:
  - text: 9a^2 b^2
    is_correct: true
  - text: 3a^2 b^2
    is_correct: false
  - text: 9ab
    is_correct: false
  - text: 6a^2 b^2
    is_correct: false
  explanation: 'La correcta es: 9a^2 b^2. Distribuimos el exponente 2 a cada factor: $3^2
    \cdot a^2 \cdot b^2 = 9a^2 b^2$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Simplifica $(5x^2)^3$.
  choices:
  - text: 125x^6
    is_correct: true
  - text: 15x^6
    is_correct: false
  - text: 125x^5
    is_correct: false
  - text: 15x^5
    is_correct: false
  explanation: 'La correcta es: 125x^6. $(5)^3 \cdot (x^2)^3 = 125x^{2 \cdot 3} = 125x^6$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar todos los factores que se multiplican dentro del paréntesis.'
- 'Paso 2: Aplicar el exponente exterior a cada uno de los factores individualmente.'
- 'Paso 3: Calcular o simplificar las potencias resultantes.'
errores_correccion: No intentes distribuir la potencia en una suma. $(a + b)^2 \neq a^2 +
  b^2$. La distributividad es **exclusiva de la multiplicación y división**.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $(2 \cdot 5)^2$.
  alternativas:
  - '100'
  - '20'
  - '50'
  respuesta: '100'
  solucion_pasos:
  - $2^2 \cdot 5^2 = 4 \cdot 25 = 100$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale (4a)^2?
  alternativas:
  - 16a^2
  - 4a^2
  - 8a^2
  respuesta: 16a^2
  solucion_pasos:
  - 'Se distribuye el exponente: 4^2·a^2 = 16a^2.'
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor de (2·3·5)^2?
  alternativas:
  - '900'
  - '30'
  - '60'
  respuesta: '900'
  solucion_pasos:
  - (2·3·5)^2 = 30^2 = 900, o bien 2^2·3^2·5^2 = 4·9·25 = 900.
- titulo: ¿Es (a+b)^2 igual a a^2+b^2?
  respuesta: 'No'
  solucion_pasos:
  - La distributividad de la potencia aplica solo a productos, no a sumas.
errores_frecuentes:
- Distribuir el exponente sobre sumas o restas.
- Aplicar la distributividad de la potencia a una suma o resta, como si (a+b)^n fuera a^n+b^n.
- Olvidar distribuir el exponente a un coeficiente numérico, dejándolo sin elevar.
- Distribuir el exponente solo a una parte de los factores del producto.
- Confundir la potencia de un producto con el producto de dos potencias de distinta base.
afirmaciones_verdaderas:
- $(a \cdot b)^n = a^n \cdot b^n$.
- La propiedad (a·b)^n=a^n·b^n se cumple para cualquier cantidad de factores multiplicados
  dentro del paréntesis.
al_terminar_debes_poder: Aplicar la propiedad distributiva de potencias sobre productos.
fuente: Texto escolar MINEDUC.
estado: publicado
