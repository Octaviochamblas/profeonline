semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.POTENCIA_DE_PRODUCTO
resumen_inicial: 'La potencia de un producto distribuye el exponente sobre cada uno de los factores multiplicativos: $(a \cdot b)^n = a^n \cdot b^n$.'
explicacion_simple: '![Potencia de un producto](/static/img/nodos/potencia-de-un-producto-intro.svg)


  Cuando tienes una multiplicación adentro de un paréntesis elevada a un exponente, ese exponente se reparte (se distribuye) a cada uno de los factores que se están multiplicando. Por ejemplo, $(2 \cdot 5)^3 = 2^3 \cdot 5^3 = 8 \cdot 125 = 1000$ (que es exactamente lo mismo que $10^3 = 1000$). Esta propiedad es clave en álgebra para monomios como $(3x)^2 = 3^2 \cdot x^2 = 9x^2$. ¡Cuidado: esto NUNCA se puede hacer con sumas!'
explicacion_formal: 'Sean $a, b \in \mathbb{R}$ y $n \in \mathbb{R}$. El **Teorema de Distributividad de la Potenciación sobre el Producto** establece que:


  $$(a \cdot b)^n = a^n \cdot b^n$$


  **Demostración para $n \in \mathbb{N}$:**

  $$(a \cdot b)^n = \underbrace{(a \cdot b) \cdot (a \cdot b) \cdot \dots \cdot (a \cdot b)}_{n \text{ factores}}$$

  Por las propiedades conmutativa y asociativa del producto en $\mathbb{R}$:

  $$(a \cdot b)^n = \left(\underbrace{a \cdot a \dots a}_{n \text{ factores}}\right) \cdot \left(\underbrace{b \cdot b \dots b}_{n \text{ factores}}\right) = a^n \cdot b^n$$


  **Aplicación a monomios compuestos:**

  $$(k \cdot a^p \cdot b^q)^n = k^n \cdot a^{p \cdot n} \cdot b^{q \cdot n}$$


  > **Principio de exclusividad operativa:** La potenciación es distributiva respecto a la multiplicación y división, pero **NO es distributiva respecto a la adición o sustracción**: $(a+b)^n \neq a^n + b^n$.'
definiciones_clave: '- **Distributividad exponencial**: Propiedad que permite aplicar el exponente a cada factor individual.

  - **Factorización potencial inversa**: Reagrupación $a^n \cdot b^n = (a \cdot b)^n$.'
propiedades_relaciones: '- **Monomios algebraicos**: $(4x^3)^2 = 4^2 \cdot (x^3)^2 = 16x^6$.

  - **Bases negativas con coeficientes**: $(-2a)^4 = (-2)^4 \cdot a^4 = 16a^4$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de potencia de un producto](/static/img/nodos/potencia-de-un-producto-ejemplos.svg)


    Calcule y exprese en forma simplificada las expresiones $(2 \cdot 3)^3$, $(4x^2)^3$ y $(-2a)^4$.'
  pasos:
  - 'Paso 1: Evaluar $(2 \cdot 3)^3$: Distribuir exponente $3$: $2^3 \cdot 3^3 = 8 \cdot 27 = 216$. (Equivale a $6^3 = 216$).'
  - 'Paso 2: Evaluar $(4x^2)^3$: Distribuir exponente $3$ al coeficiente y a la variable: $4^3 \cdot (x^2)^3 = 64 \cdot x^{2 \cdot 3} = 64x^6$.'
  - 'Paso 3: Evaluar $(-2a)^4$: Distribuir exponente par $4$: $(-2)^4 \cdot a^4 = 16a^4$.'
  - 'Conclusión: Los resultados son $216$, $64x^6$ y $16a^4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el desarrollo correcto de $(3x)^2$?
  choices:
  - text: $9x^2$ (elevando tanto el $3$ como la $x$ al cuadrado)
    is_correct: true
  - text: $3x^2$
    is_correct: false
  - text: $6x^2$
    is_correct: false
  - text: $9x$
    is_correct: false
  explanation: La alternativa correcta es '$9x^2$ (elevando tanto el $3$ como la $x$ al cuadrado)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué $(-2a)^4 = 16a^4$ con signo positivo?
  choices:
  - text: Porque el exponente $4$ es par y $(-2)^4 = +16$
    is_correct: true
  - text: Porque se eliminó el signo negativo
    is_correct: false
  - text: Porque $a$ es positivo
    is_correct: false
  - text: Porque $4 \cdot (-2) = -8$
    is_correct: false
  explanation: La alternativa correcta es 'Porque el exponente $4$ es par y $(-2)^4 = +16$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar cada uno de los factores dentro del paréntesis (números, coeficientes y variables).'
- 'Paso 2: Aplicar el exponente exterior a cada factor de manera individual: $a^n \cdot b^n$.'
- 'Paso 3: Resolver las potencias numéricas y aplicar potencia de potencia en las variables con exponente previo.'
errores_correccion: '- **Error 1: No elevar el coeficiente numérico ($(2x)^3 = 2x^3$).** **Cómo corregirlo:** El paréntesis exige elevar el número también: $2^3 \cdot x^3 = 8x^3$.

  - **Error 2: Distribuir la potencia en sumas ($(a+b)^2 = a^2 + b^2$).** **Cómo corregirlo:** En la suma se desarrolla un producto notable: $(a+b)^2 = a^2 + 2ab + b^2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el desarrollo de $(5y)^3$?
  alternativas:
  - $125y^3$
  - $5y^3$
  - $15y^3$
  respuesta: $125y^3$
  solucion_pasos:
  - $(5y)^3 = 5^3 \cdot y^3 = 125y^3$.
- titulo: Ejemplo 2
  enunciado: ¿A qué equivale $2^4 \cdot 5^4$ agrupado en una sola potencia?
  alternativas:
  - $10^4 = 10000$
  - $10^8$
  - $1000$
  respuesta: $10^4 = 10000$
  solucion_pasos:
  - $2^4 \cdot 5^4 = (2 \cdot 5)^4 = 10^4 = 10000$.
- titulo: ¿Es (2 · 3)⁴ igual a 2⁴ · 3⁴?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(2 \cdot 3)^4 = 2^4 \cdot 3^4 = 16 \cdot 81 = 1296$.
  alternativas:
  - texto: Sí, el exponente se distribuye a cada factor multiplicativo
    es_correcta: true
    retroalimentacion: ¡Correcto! $(a \cdot b)^n = a^n \cdot b^n$.
  - texto: No, es igual a 6⁸
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente no se duplica.
  - texto: No, es igual a 24
    es_correcta: false
    retroalimentacion: Incorrecto, es una potencia.
- titulo: ¿Es (x + y)² igual a x² + y²?
  respuesta: 'No'
  solucion_pasos:
  - 'No, la potencia no es distributiva sobre la suma: $(x+y)^2 = x^2 + 2xy + y^2$.'
  alternativas:
  - texto: No, la potencia NO se distribuye sobre sumas (falta el doble producto 2xy)
    es_correcta: true
    retroalimentacion: ¡Correcto! Solo se distribuye sobre productos y divisiones.
  - texto: Sí, se eleva cada término
    es_correcta: false
    retroalimentacion: Incorrecto, es el error clásico de álgebra.
  - texto: Solo si x e y son iguales a 1
    es_correcta: false
    retroalimentacion: Incorrecto, $(1+1)^2 = 4 \neq 1+1=2$.
errores_frecuentes:
- Elevar solo las variables y olvidar elevar los coeficientes numéricos ($(3x)^2 = 3x^2$).
- Intentar distribuir la potencia sobre sumas o restas ($(a+b)^n = a^n + b^n$).
- Multiplicar el exponente por los factores en vez de potenciarlos ($(2x)^3 = 6x$).
- Olvidar aplicar la regla de signos al elevar coeficientes negativos entre paréntesis.
- Confundir la distributividad de potencias con la propiedad distributiva de la multiplicación.
afirmaciones_verdaderas:
- Para todos los números reales $a, b$, $(a \cdot b)^n = a^n \cdot b^n$.
- La potencia se distribuye estrictamente sobre multiplicaciones y divisiones, nunca sobre adiciones.
- En monomios algebraicos, los coeficientes numéricos se potencian al exponente exterior.
al_terminar_debes_poder: '![Síntesis de potencia de un producto](/static/img/nodos/potencia-de-un-producto-resumen.svg)


  QUÉ: Aplicar la ley distributiva de la potencia sobre productos en álgebra y aritmética.


  CÓMO: Distribuyendo el exponente a cada factor numérico y literal ($(a \cdot b)^n = a^n \cdot b^n$), calculando las potencias de coeficientes, y recordando que la potenciación jamás se distribuye sobre sumas o restas.'
