semantic_id: MAT.NUM.POTENCIAS_PROPIEDADES.POTENCIA_DE_PRODUCTO
resumen_inicial: 'La potencia de un producto $(a \cdot b)^n$ es igual al producto
  de las potencias de cada factor: $(a \cdot b)^n = a^n \cdot b^n$.'
explicacion_simple: El exponente afuera de una multiplicación encerrada en paréntesis
  se reparte o distribuye afectando individualmente a cada uno de los números que
  se están multiplicando en su interior.
explicacion_formal: 'Para todo $a, b \in \mathbb{R}$ y exponente $n \in \mathbb{R}$,
  la **Distributividad sobre la Multiplicación** establece:


  $$\left(a \cdot b\right)^n = a^n \cdot b^n$$


  **Demostración por conmutatividad:**

  $$\left(a \cdot b\right)^n = \underbrace{(a \cdot b) \dots (a \cdot b)}_{n \text{
  veces}} = (a \dots a) \cdot (b \dots b) = a^n \cdot b^n$$


  > **Complemento didáctico:** La potenciación NUNCA se distribuye sobre la suma o
  resta: $(a + b)^n \neq a^n + b^n$.'
definiciones_clave: '- **Potencia de un producto**: Regla $(a \cdot b)^n = a^n \cdot
  b^n$ de distribución del exponente sobre los factores de una multiplicación.'
propiedades_relaciones: '- **Distributividad sobre producto**: $(a \cdot b)^n = a^n
  \cdot b^n$.'
ejemplo_guiado:
  enunciado: Desarrolle y simplifique $(2 \cdot 3)^3$.
  pasos:
  - 'Paso 1: Aplicar la propiedad distributiva del exponente $3$: $2^3 \cdot 3^3$.'
  - 'Paso 2: Calcular cada potencia: $2^3 = 8$ y $3^3 = 27$.'
  - 'Paso 3: Multiplicar los resultados: $8 \cdot 27 = 216$.'
  - 'Conclusión: $(2 \cdot 3)^3 = 216$ (verificable haciendo $6^3 = 216$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cómo se distribuye el exponente n en la potencia de un producto (a ·
    b)^n?
  choices:
  - text: Se aplica como exponente a cada uno de los factores (a^n · b^n)
    is_correct: true
  - text: Se aplica solo al primer factor
    is_correct: false
  - text: Se suman los factores
    is_correct: false
  - text: Se cancela el exponente
    is_correct: false
  explanation: La alternativa correcta es 'Se aplica como exponente a cada uno de
    los factores (a^n · b^n)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (2 · 3)^3, ¿cuál fue el resultado final?
  choices:
  - text: '216'
    is_correct: true
  - text: '18'
    is_correct: false
  - text: '36'
    is_correct: false
  - text: '54'
    is_correct: false
  explanation: La alternativa correcta es '216'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los factores dentro del paréntesis.'
- 'Paso 2: Distribuir el exponente elevando cada factor por separado.'
- 'Paso 3: Efectuar las multiplicaciones parciales.'
errores_correccion: '- **Error 1: Distribuir el exponente sobre una suma ($(a+b)^n
  = a^n + b^n$).** **Cómo corregirlo:** La distributividad aplica ÚNICAMENTE a la
  multiplicación ($(a \cdot b)^n = a^n \cdot b^n$).


  - **Error 2: Elevar solo el primer factor ($(2x)^3 = 2x^3$).** **Cómo corregirlo:**
  El exponente afecta a TODO el producto dentro del paréntesis ($(2x)^3 = 2^3 x^3
  = 8x^3$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Desarrolle $(3x)^2$.
  alternativas:
  - 9x^2
  - 3x^2
  - 6x^2
  respuesta: 9x^2
  solucion_pasos:
  - $3^2 \cdot x^2 = 9x^2$.
- titulo: Ejemplo 2
  enunciado: Simplifique $(5 \cdot 10)^3$.
  alternativas:
  - 125 · 1000 = 125.000
  - '150'
  - '15.000'
  respuesta: 125 · 1000 = 125.000
  solucion_pasos:
  - $5^3 \cdot 10^3 = 125 \cdot 1000 = 125.000$.
- titulo: ¿Es (a · b)^2 igual a a^2 · b^2?
  respuesta: Sí
  solucion_pasos:
  - Sí, por propiedad de potencia de un producto.
- titulo: ¿Se aplica la distributividad de potencias sobre la adición (a+b)^n?
  respuesta: 'No'
  solucion_pasos:
  - No, la potencia NO es distributiva respecto a la suma.
errores_frecuentes:
- Distribuir el exponente sobre los términos de una suma $(a+b)^n = a^n + b^n$.
- Elevar únicamente el primer coeficiente ignorando a las variables dentro del paréntesis.
- Multiplicar los factores por el exponente sin efectuar la potenciación.
- La expresión $(2x)^3$ equivale a $2x^3$ sin elevar el número 2.
- La potencia de un producto requiere restar los exponentes de los factores.
afirmaciones_verdaderas:
- 'El exponente se distribuye sobre cada factor en la potencia de un producto: $(a
  \cdot b)^n = a^n \cdot b^n$.'
- La potenciación se distribuye sobre la multiplicación y división, pero jamás sobre
  la suma o resta.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la distributividad del
  exponente sobre el producto $(a \cdot b)^n = a^n \cdot b^n$, simplificando expresiones
  algebraicas y numéricas.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
