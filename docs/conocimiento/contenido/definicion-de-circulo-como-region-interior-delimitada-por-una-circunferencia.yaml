semantic_id: MAT.GEO.CIRCULO_ELEMENTOS.CIRCULO_DEFINICION
resumen_inicial: El círculo es la región del plano formada por una circunferencia y todos los puntos interiores delimitados por ella.
explicacion_simple: 'Si la circunferencia es el aro exterior de una rueda de bicicleta, el **círculo** es la rueda sólida completa con todo su relleno interior (como una moneda o una tapa de frasco).


  El círculo incluye absolutamente todos los puntos que están **dentro o sobre** la circunferencia. Al ser una superficie sólida y rellena de dos dimensiones (2D), el círculo sí tiene **área**, la cual se calcula multiplicando el número $\pi$ por el radio al cuadrado: **$A = \pi r^2$**. Se mide siempre en unidades cuadradas como centímetros cuadrados ($\text{cm}^2$) o metros cuadrados ($\text{m}^2$).


  ![Definición de círculo](/static/img/nodos/definicion-de-circulo-como-region-interior-delimitada-por-una-circunferencia-intro.svg)

  '
explicacion_formal: '### Definición formal del disco o círculo

  Sea $O \in \mathbb{R}^2$ el centro y $r \in \mathbb{R}^+$ el radio. Se define el **círculo cerrado** (o disco euclidiano) $\mathcal{K}(O, r)$ como el conjunto de todos los puntos coplanares cuya distancia euclidiana al centro $O$ es menor o igual al radio:

  $$\mathcal{K}(O, r) = \{ P \in \mathbb{R}^2 \mid d(P, O) \le r \}$$


  ### Descomposición topológica

  El círculo cerrado $\mathcal{K}$ es la unión de la región interior abierta y su frontera conexa:

  $$\mathcal{K} = \text{Int}(\mathcal{K}) \cup \partial\mathcal{K} = \{ P \mid d(P, O) < r \} \cup \mathcal{C}(O, r)$$


  ### Propiedades métricas y convexidad

  - **Medida superficial (Área):** La integral doble de superficie euclidiana produce la fórmula clásica:

  $$A = \iint_{\mathcal{K}} dx\,dy = \pi r^2 = \frac{\pi d^2}{4}$$

  - **Convexidad estricta:** Si $A, B \in \mathcal{K}$, entonces todo el segmento lineal $\overline{AB} \subset \mathcal{K}$.

  - **Frontera perimetral:** El perímetro del círculo equivale a la longitud de su circunferencia frontera: $P = 2\pi r$.


  > **Complemento didáctico:** Regla nemotécnica infalible para no confundir fórmulas en la PAES: el área tiene unidades al cuadrado ($\text{cm}^2$), por lo tanto lleva el radio elevado al cuadrado ($A = \pi r^2$). El perímetro es una longitud lineal ($\text{cm}$), por lo tanto lleva el 2 multiplicando al frente ($P = 2\pi r$).

  '
definiciones_clave: '- **Círculo**: Superficie plana bidimensional delimitada por una circunferencia.

  - **Área del círculo ($A$)**: Extensión superficial de la región circular dada por $A = \pi r^2$.

  - **Disco cerrado**: Conjunto geométrico de puntos que satisfacen $d(P, O) \le r$.

  - **Frontera del círculo**: La circunferencia perimetral que delimita el borde exterior.

  '
propiedades_relaciones: '- **Conjunto acotado y compacto**: El círculo euclidiano en $\mathbb{R}^2$ es cerrado y acotado.

  - **Dependencia cuadrática del área**: Si el radio se duplica ($2r$), el área se cuadruplica ($4A$).

  - **Figura isoperimétrica**: Para un perímetro fijo dado, el círculo es la figura plana que encierra la mayor área posible en el universo.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos guiados de círculo](/static/img/nodos/definicion-de-circulo-como-region-interior-delimitada-por-una-circunferencia-ejemplos.svg)


    Un disco circular tiene un radio de $r = 6\text{ cm}$. Calcula su área superficial exacta y determina si un punto $T$ ubicado a $5\text{ cm}$ del centro pertenece a dicho círculo.'
  pasos:
  - 'Paso 1: Aplicar la fórmula del área superficial: $A = \pi r^2 = \pi (6)^2$.'
  - 'Paso 2: Calcular el valor cuadrático: $6^2 = 36$, luego $A = 36\pi\text{ cm}^2$.'
  - 'Paso 3: Evaluar la pertenencia del punto $T$: Se compara su distancia al centro con el radio: $d(T, O) = 5\text{ cm}$ frente a $r = 6\text{ cm}$.'
  - 'Paso 4: Concluir por definición: Como $5 \le 6$ ($d \le r$), el punto $T$ pertenece rigurosamente al círculo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la relación matemática que define a todos los puntos P pertenecientes a un círculo cerrado de centro O y radio r?
  choices:
  - text: d(P, O) ≤ r.
    is_correct: true
  - text: d(P, O) = r estrictamente.
    is_correct: false
  - text: d(P, O) > r.
    is_correct: false
  - text: d(P, O) = 2r.
    is_correct: false
  explanation: La alternativa correcta es 'd(P, O) ≤ r.' El círculo cerrado comprende tanto a los puntos interiores ($d < r$) como a los de la frontera ($d = r$).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el radio de un círculo se triplica (de r a 3r), ¿qué ocurre con su área superficial?
  choices:
  - text: Se multiplica por 9 (se nonuplica).
    is_correct: true
  - text: Se triplica (se multiplica por 3).
    is_correct: false
  - text: Se multiplica por 6.
    is_correct: false
  - text: Permanece constante.
    is_correct: false
  explanation: 'La alternativa correcta es ''Se multiplica por 9 (se nonuplica).'' Al estar el radio al cuadrado: $A_{\text{nuevo}} = \pi (3r)^2 = 9\pi r^2 = 9A$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el radio $r$ o deducirlo dividiendo el diámetro entre 2 ($r = d / 2$).

  2. Elevar el radio al cuadrado: $r^2$.

  3. Multiplicar por la constante $\pi$: $A = \pi r^2$.

  4. Expresar el resultado en unidades de área correspondientes ($\text{cm}^2, \text{m}^2$).

  '
errores_correccion: '- **Error común 1:** Calcular $2\pi r$ cuando se pide el área. **Corrección:** $2\pi r$ es la longitud lineal del contorno; el área es $\pi r^2$.

  - **Error común 2:** Elevar $\pi$ al cuadrado en lugar del radio. **Corrección:** El exponente 2 afecta únicamente a la medida del radio $r$.

  '
ejemplos:
- tipo: A
  titulo: Área con diámetro
  enunciado: Una pizza circular tiene un diámetro de $20\text{ cm}$. ¿Cuál es su área superficial en términos de $\pi$?
  alternativas:
  - text: $100\pi\text{ cm}^2$.
    is_correct: true
  - text: $400\pi\text{ cm}^2$.
    is_correct: false
  - text: $20\pi\text{ cm}^2$.
    is_correct: false
  - text: $50\pi\text{ cm}^2$.
    is_correct: false
  explicacion: El radio es $r = 20 / 2 = 10\text{ cm}$. Luego $A = \pi (10)^2 = 100\pi\text{ cm}^2$.
- tipo: B
  titulo: Punto central y círculo
  enunciado: ¿Pertenece el centro O al círculo delimitado por una circunferencia de radio r?
  respuesta: Sí
  explicacion: Sí. Como la distancia del centro a sí mismo es $d(O, O) = 0 \le r$, el centro pertenece al círculo.
errores_frecuentes:
- '''Confundir la fórmula del área ($A = \pi r^2$) con la del perímetro ($P = 2\pi r$).'''
- '''Usar directamente el diámetro en lugar del radio al calcular el área.'''
- '''Creer que el círculo y la circunferencia son exactamente el mismo objeto matemático.'''
afirmaciones_verdaderas:
- '''El círculo es la región bidimensional interior que incluye a la circunferencia frontera.'''
- '''El área de un círculo de radio $r$ equivale a $A = \pi r^2$.'''
- '''Todo círculo es una región convexa del plano.'''
al_terminar_debes_poder: '**QUÉ:** Definir el círculo, distinguir su naturaleza bidimensional y calcular su área superficial.


  **CÓMO:** Aplicando la condición de inclusión $d(P, O) \le r$ y la fórmula de área $A = \pi r^2$.


  ![Síntesis de círculo](/static/img/nodos/definicion-de-circulo-como-region-interior-delimitada-por-una-circunferencia-resumen.svg)

  '
