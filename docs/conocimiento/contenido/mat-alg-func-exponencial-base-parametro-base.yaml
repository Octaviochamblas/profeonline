semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.PARAMETRO_BASE
resumen_inicial: 'La base $b$ es la razón constante de cambio multiplicativo de la función exponencial, determinando su crecimiento ($b > 1$) o su decrecimiento ($0 < b < 1$).'
explicacion_simple: |
  La base $b$ indica por cuánto se multiplica el valor de la función cada vez que avanzamos un paso a la derecha en el eje $x$. Si la base es mayor que 1 (como $b = 2$ o $b = 3$), los números van duplicándose o triplicándose, haciendo que la gráfica suba velozmente (crecimiento). Si la base es una fracción entre 0 y 1 (como $b = \frac{1}{2} = 0.5$), los números se van reduciendo a la mitad en cada paso, haciendo que la gráfica baje progresivamente hacia el suelo (decrecimiento).
explicacion_formal: |
  ### Definición formal
  En la función exponencial $f(x) = a \cdot b^x$, la **base $b \in \mathbb{R}^+ \setminus \{1\}$** constituye el operador multiplicativo discreto y continuo que fija la razón instantánea de cambio y la monotonía estricta de la función:
  - **Crecimiento exponencial (con $a > 0$)**: $\iff b > 1$. La función es estrictamente creciente ($\forall x_1 < x_2 \implies f(x_1) < f(x_2)$).
  - **Decaimiento exponencial (con $a > 0$)**: $\iff 0 < b < 1$. La función es estrictamente decreciente ($\forall x_1 < x_2 \implies f(x_1) > f(x_2)$).

  ### Desglose simbólico
  - Tasa multiplicativa $b = \frac{f(x+1)}{f(x)}$.
  - Relación recíproca: Si $g(x) = b^x$ y $h(x) = \left(\frac{1}{b}\right)^x = b^{-x}$, entonces $h(x) = g(-x)$, representando una reflexión horizontal respecto al eje $y$.
  - Rapidez de variación: Para $b > 1$, a mayor valor de $b$, mayor velocidad de crecimiento. Para $0 < b < 1$, a menor valor de $b$, mayor rapidez de decaimiento.

  ### Síntesis didáctica
  Identificar el comportamiento observando el tamaño de la base: Comparar la base $b$ con el valor 1. Si $b$ supera la unidad, la función amplifica los valores; si $b$ está comprimido entre 0 y 1, los reduce.
definiciones_clave: |
  - **Base $b$**: Constante multiplicativa de la potencia que rige el tipo y velocidad de monotonía.
  - **Crecimiento exponencial**: Comportamiento ascedente caracterizado por bases $b > 1$.
  - **Decaimiento / Decrecimiento exponencial**: Comportamiento descendente caracterizado por bases $0 < b < 1$.
propiedades_relaciones: |
  - **Simetría axial por base recíproca**: Las gráficas de $f(x) = 2^x$ y $g(x) = (0.5)^x = 2^{-x}$ son simétricas reflejadas respecto al eje $y$.
  - **Invariancia del valor inicial**: Modificar el valor de la base $b$ cambia la inclinación de la curva, pero todas las funciones mónicas $f(x) = b^x$ continúan pasando obligatoriamente por el punto $(0, 1)$.
ejemplo_guiado:
  enunciado: 'Clasifica la monotonía (creciente o decreciente) de las siguientes funciones exponenciales justificando según el valor de su base $b$: A) $f(x) = 4 \cdot 5^x$, B) $g(x) = 2 \cdot (0.3)^x$, C) $h(x) = \left(\frac{7}{4}\right)^x$.'
  pasos:
    - 'Paso 1: Para $f(x) = 4 \cdot 5^x$, la base es $b = 5$. Como $b = 5 > 1$ y $a = 4 > 0$, la función es **estrictamente creciente**.'
    - 'Paso 2: Para $g(x) = 2 \cdot (0.3)^x$, la base es $b = 0.3$. Como $0 < 0.3 < 1$ y $a = 2 > 0$, la función es **estrictamente decreciente**.'
    - 'Paso 3: Para $h(x) = \left(\frac{7}{4}\right)^x$, la base es $b = \frac{7}{4} = 1.75$. Como $1.75 > 1$ y $a = 1 > 0$, la función es **estrictamente creciente**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Dada la función exponencial $f(x) = 3 \cdot \left(\frac{2}{5}\right)^x$, ¿cuál es el comportamiento de su gráfica a medida que $x$ aumenta?'
    choices:
      - {text: 'Es estrictamente decreciente, porque su base $b = \frac{2}{5} = 0.4$ cumple $0 < 0.4 < 1$', is_correct: true}
      - {text: 'Es estrictamente creciente, porque el coeficiente $a = 3$ es positivo', is_correct: false}
      - {text: 'Es una recta horizontal constante en $y = 3$', is_correct: false}
      - {text: 'Es una parábola que abre hacia abajo', is_correct: false}
    explanation: 'La alternativa correcta es ''Es estrictamente decreciente, porque su base $b = \frac{2}{5} = 0.4$ cumple $0 < 0.4 < 1$''. Con $a > 0$, una base entre 0 y 1 determina un decrecimiento exponencial.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si comparamos la velocidad de crecimiento de $f(x) = 2^x$ y $g(x) = 6^x$ para valores positivos de $x$, ¿cuál de las dos curvas crece más rápidamente hacia $+\infty$?'
    choices:
      - {text: '$g(x) = 6^x$, porque posee una base mayor $b = 6 > 2$', is_correct: true}
      - {text: '$f(x) = 2^x$, porque posee una base menor', is_correct: false}
      - {text: 'Ambas crecen a la misma velocidad exacta', is_correct: false}
      - {text: 'Depende únicamente de la intersección con el eje $y$', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = 6^x$, porque posee una base mayor $b = 6 > 2$''. A mayor magnitud de la base $b > 1$, mayor es la tasa de crecimiento exponencial.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la base $b$ de la potencia exponencial.'
  - 'Paso 2: Comparar el valor de la base $b$ con el número 1.'
  - 'Paso 3: Si $b > 1$ (con $a > 0$), declarar la función como estrictamente creciente.'
  - 'Paso 4: Si $0 < b < 1$ (con $a > 0$), declarar la función como estrictamente decreciente.'
errores_correccion: |
  - **Error 1:** Afirmar que la función con base fraccionaria como $b = \frac{9}{4}$ es decreciente por ser una fracción. **Cómo corregirlo:** La fracción $\frac{9}{4} = 2.25 > 1$ es una fracción impropia. Al ser mayor que 1, genera un modelo creciente.
  - **Error 2:** Creer que una base pequeña pero positiva como $b = 0.001$ genera valores de salida negativos. **Cómo corregirlo:** Toda potencia $b^x$ con base positiva $b > 0$ genera siempre valores estrictamente positivos ($b^x > 0$), sin importar cuán pequeña sea la base.
ejemplos:
  - titulo: 'Clasificación de fracción propia'
    enunciado: '¿La función $f(x) = \left(\frac{1}{4}\right)^x$ es creciente o decreciente?'
    alternativas:
      - 'Estrictamente decreciente'
      - 'Estrictamente creciente'
      - 'Constante'
    respuesta: 'Estrictamente decreciente'
    solucion_pasos:
      - '1. La base es $b = \frac{1}{4} = 0.25$.'
      - '2. Como $0 < 0.25 < 1$, es una función estrictamente decreciente.'
  - titulo: 'Efecto de base decimal mayor a 1'
    enunciado: '¿La función $g(x) = (1.05)^x$ representa un modelo de crecimiento?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. La base $b = 1.05 > 1$ (representa un crecimiento constante del $5\%$ por unidad de $x$).'
  - titulo: 'Paso por el punto (0, 1)'
    enunciado: '¿Las gráficas de $f(x) = 3^x$ y $g(x) = (0.2)^x$ se cruzan ambas en el punto $(0, 1)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. En ambas funciones $a = 1$, por lo que $3^0 = 1$ y $(0.2)^0 = 1$, compartiendo el corte $(0, 1)$.'
  - titulo: 'Reflexión por base recíproca'
    enunciado: '¿La gráfica de $h(x) = 4^{-x}$ es idéntica a la gráfica de $p(x) = \left(\frac{1}{4}\right)^x$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Por propiedades de potencias, $4^{-x} = \left(4^{-1}\right)^x = \left(\frac{1}{4}\right)^x$.'
errores_frecuentes:
  - 'Una función exponencial con base fraccionaria $\frac{5}{2}$ es estrictamente decreciente.'
  - 'Si la base $b = 0.1$, los valores de salida de la función exponencial son números negativos.'
  - 'Aumentar el valor de la base $b > 1$ hace que la gráfica exponencial crezca más lentamente.'
  - 'La monotonía de la función exponencial $f(x) = b^x$ cambia de creciente a decreciente en $x = 0$.'
  - 'Las funciones exponenciales con bases recíprocas $b$ y $\frac{1}{b}$ se cruzan en el eje $x$.'
afirmaciones_verdaderas:
  - 'Para $a > 0$, una base $b > 1$ determina una función exponencial estrictamente creciente, mientras que $0 < b < 1$ determina una función estrictamente decreciente.'
  - 'La expresión de base negativa en el exponente $b^{-x}$ equivale a la función exponencial con la base recíproca $\left(\frac{1}{b}\right)^x$.'
al_terminar_debes_poder: 'Evaluar el parámetro de la base $b$ para determinar la monotonía y velocidad de variación de la función exponencial.'
