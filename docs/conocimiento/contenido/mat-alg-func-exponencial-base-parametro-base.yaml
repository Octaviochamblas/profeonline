semantic_id: MAT.ALG.FUNC_EXPONENCIAL_BASE.PARAMETRO_BASE
resumen_inicial: 'Identificación de la base b en la función exponencial: conceptos,
  asíntotas, propiedades e inversidad en Conceptos de la función exponencial.'
explicacion_simple: 'La base $b$ es el verdadero "motor" del comportamiento exponencial:
  determina si la función crece o decrece, y qué tan rápido lo hace.'
explicacion_formal: '### Definición formal


  En $f(x)=a\cdot b^x$, la base $b$ es el número real positivo y distinto de 1 que
  se eleva a la potencia $x$. Si $b>1$, la función es creciente; si $0<b<1$, la función
  es decreciente.


  ### Desarrollo didáctico


  Para identificar $b$, se localiza el número que está elevado a la potencia $x$,
  distinguiéndolo del coeficiente $a$ que lo multiplica.


  En $f(x)=6\cdot1{,}5^x$, la base es $1{,}5$, un valor mayor que 1, por lo que la
  función es creciente.'
definiciones_clave: '- **Identificación de la base b en la función exponencial**:
  Concepto fundamental en el estudio del crecimiento/decaimiento exponencial y logarítmico.'
propiedades_relaciones: '- **Relación de inversidad y asíntotas**: $y = b^x \iff x
  = \log_b(y)$, asíntota horizontal $y=0$ (exponencial) y vertical $x=0$ (logarítmica)
  aplicadas a identificación de la base b en la función exponencial.'
ejemplo_guiado:
  enunciado: Evalúa o resuelve la expresión aplicando las propiedades de identificación
    de la base b en la función exponencial.
  pasos:
  - Identificar la base $b > 0, b \neq 1$ y las restricciones del argumento o exponente.
  - Aplicar las propiedades operatorias o definición de identificación de la base
    b en la función exponencial.
  - Efectuar la conversión entre forma exponencial y logarítmica si es necesario.
  - Verificar que la solución cumpla las restricciones del dominio.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición indispensable respecto a la base b al trabajar con
    identificación de la base b en la función exponencial?
  choices:
  - text: Garantizar que la base sea positiva y distinta de uno en conceptos de la
      función exponencial
    is_correct: true
  - text: Permitir bases negativas para cualquier exponente
    is_correct: false
  - text: Fijar la base siempre igual a cero
    is_correct: false
  - text: Ignorar la restricción del argumento logarítmico
    is_correct: false
  explanation: 'La alternativa correcta es: Garantizar que la base sea positiva y
    distinta de uno en conceptos de la función exponencial. Es la condición de existencia
    para funciones exponenciales y logarítmicas.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cómo se relacionan funcionalmente las expresiones exponenciales y logarítmicas
    en identificación de la base b en la función exponencial?
  choices:
  - text: Utilizar la equivalencia y = b^x <=> x = log_b(y) para convertir entre ambas
      formas
    is_correct: true
  - text: Multiplicando la base por el exponente sin usar logaritmos
    is_correct: false
  - text: Restando la base de la variable
    is_correct: false
  - text: Igualando siempre el exponente a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Utilizar la equivalencia y = b^x <=> x
    = log_b(y) para convertir entre ambas formas. Las funciones exponencial y logarítmica
    son mutuamente inversas.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ordena la función para identificar claramente la potencia con exponente
  variable.'
- 'Paso 2: Identifica el número elevado a la potencia $x$; ese es el valor de $b$.'
- 'Paso 3: Determina si $b>1$ (creciente) o $0<b<1$ (decreciente).'
errores_correccion: Evita evaluar un logaritmo con argumento negativo o nulo en identificación
  de la base b en la función exponencial.
ejemplos:
- titulo: Identificación de base mayor que uno
  enunciado: Identifica la base $b$ en $f(x)=4\cdot5^x$.
  solucion_pasos:
  - El número elevado a $x$ es $5$.
  - $b=5$, y como $5>1$, la función es creciente.
- titulo: Identificación de base entre cero y uno
  enunciado: Identifica la base $b$ en $f(x)=10\cdot0{,}2^x$.
  solucion_pasos:
  - El número elevado a $x$ es $0{,}2$.
  - $b=0{,}2$, y como $0<0{,}2<1$, la función es decreciente.
- titulo: ¿Se puede determinar si una función exponencial crece o decrece observando
    solo la base?
  enunciado: ¿Se puede determinar si una función exponencial crece o decrece observando
    solo la base?
  respuesta: Sí
  solucion_pasos:
  - $b>1$ indica crecimiento; $0<b<1$ indica decrecimiento, sin importar el valor
    de $a$ (siempre que $a>0$).
- titulo: ¿La base puede ser un número negativo?
  enunciado: ¿La base puede ser un número negativo?
  respuesta: 'No'
  solucion_pasos:
  - La base debe ser positiva para que la función esté definida en todo $\mathbb{R}$.
errores_frecuentes:
- Confundir la base $b$ con el coeficiente $a$ que la multiplica.
- Invertir la interpretación de $b>1$ y $0<b<1$ respecto a crecimiento y decrecimiento.
- Aceptar como válida una base negativa o igual a 1.
- No verificar el efecto combinado del signo de $a$ junto con el valor de $b$ al describir
  el comportamiento completo.
afirmaciones_verdaderas:
- La función logarítmica de base $b$ es la función inversa de la función exponencial
  de base $b$.
al_terminar_debes_poder: Resolver y modelar problemas exponenciales y logarítmicos
  aplicando identificación de la base b en la función exponencial.
