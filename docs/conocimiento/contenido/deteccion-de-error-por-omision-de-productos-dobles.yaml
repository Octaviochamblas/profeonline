resumen_inicial: La detección de error por falta de productos dobles es el análisis
  crítico que evita reducir $(a + b + c)^2$ a la falacia de tres cuadrados $a^2 +
  b^2 + c^2$.
explicacion_simple: 'Un error común en pruebas de álgebra es responder que $(x + y
  + 2)^2 = x^2 + y^2 + 4$, olvidando poner los 3 productos dobles. Faltan $+2xy$,
  $+4x$ y $+4y$. La expresión correcta debe tener 6 términos: $x^2 + y^2 + 2xy + 4x
  + 4y + 4$.'
explicacion_formal: 'Sea la falacia distributiva del exponente cuadrático sobre una
  suma de tres términos:


  $$(a + b + c)^2 \neq a^2 + b^2 + c^2 \quad \forall a, b, c \in \mathbb{R} \setminus
  \{0\}$$


  **Análisis de la discrepancia algebraica:**

  $$(a + b + c)^2 - (a^2 + b^2 + c^2) = 2ab + 2ac + 2bc = 2(ab + ac + bc)$$


  **Desglose simbólico:**

  - $(a + b + c)^2$: Polinomio completo de 6 términos.

  - $a^2 + b^2 + c^2$: Trinomio incompleto de cuadrados.

  - $2(ab + ac + bc)$: Términos cruzados omitidos en la falacia distributiva.


  > **Complemento didáctico:** Evaluar con $a=1, b=1, c=1$ da $(1+1+1)^2 = 9$, mientras
  $1^2 + 1^2 + 1^2 = 3$, revelando un error de 6 unidades equivalente a $2(1+1+1)
  = 6$.'
definiciones_clave: '- **Falacia distributiva trinómica**: Error de aplicar la potencia
  2 a cada término de una suma de tres elementos.

  - **Discrepancia $2(ab + ac + bc)$**: Valor exacto de la omisión cometida.'
propiedades_relaciones: '- **Detección en evaluaciones PAES**: Identificación de alternativas
  incompletas en ítems de desarrollo polinomial.'
ejemplo_guiado:
  enunciado: Un estudiante afirmó que $(x + 2y + 3)^2 = x^2 + 4y^2 + 9$. Identifique
    la omisión cometida, calcule los términos faltantes y escriba el desarrollo verdadero.
  pasos:
  - 'Paso 1: Analizar la respuesta del estudiante: Presenta solo los 3 cuadrados $x^2
    + 4y^2 + 9$.'
  - 'Paso 2: Identificar la omisión: Faltan los 3 dobles productos cruzados.'
  - 'Paso 3: Calcular primer doble faltante: $2(x)(2y) = 4xy$.'
  - 'Paso 4: Calcular segundo doble faltante: $2(x)(3) = 6x$.'
  - 'Paso 5: Calcular tercer doble faltante: $2(2y)(3) = 12y$.'
  - 'Paso 6: Reescribir el desarrollo verdadero completo: $x^2 + 4y^2 + 4xy + 6x +
    12y + 9$.'
  - 'Conclusión: El error fue no incluir $+4xy + 6x + 12y$. La expresión correcta
    tiene 6 términos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión exacta que se omite al escribir $(a + b + c)^2 =
    a^2 + b^2 + c^2$?
  choices:
  - text: $2ab + 2ac + 2bc$, o $2(ab + ac + bc)$
    is_correct: true
  - text: $ab + ac + bc$
    is_correct: false
  - text: $3abc$
    is_correct: false
  - text: $6abc$
    is_correct: false
  explanation: La alternativa correcta es '$2ab + 2ac + 2bc$, o $2(ab + ac + bc)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el valor del primer doble producto cruzado
    omitido por el estudiante?
  choices:
  - text: $4xy$, obtenido de $2 \cdot x \cdot 2y$
    is_correct: true
  - text: $2xy$
    is_correct: false
  - text: $6x$
    is_correct: false
  - text: $12y$
    is_correct: false
  explanation: La alternativa correcta es '$4xy$, obtenido de $2 \cdot x \cdot 2y$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar si una potencia de trinomio fue desarrollada con solo 3 términos
  en lugar de 6.'
- 'Paso 2: Calcular los tres dobles productos cruzados $2ab, 2ac, 2bc$.'
- 'Paso 3: Sumar los dobles productos a la suma de cuadrados para obtener el polinomio
  completo.'
errores_correccion: '- **Error 1: Distribuir el exponente cuadrático sobre los tres
  sumandos obteniendo $a^2 + b^2 + c^2$.** **Cómo corregirlo:** La potencia no se
  distribuye sobre la adición; se DEBEN incorporar los tres dobles productos cruzados
  $2ab + 2ac + 2bc$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al corregir el desarrollo incompletamente resuelto $(m + n + 4)^2 = m^2
    + n^2 + 16$, ¿cuáles términos deben agregarse?
  alternativas:
  - $+2mn + 8m + 8n$
  - $+mn + 4m + 4n$
  - $+4mn + 8m + 8n$
  respuesta: $+2mn + 8m + 8n$
  solucion_pasos:
  - '1. Doble 1: $2mn$.'
  - '2. Doble 2: $2(m)(4) = 8m$.'
  - '3. Doble 3: $2(n)(4) = 8n$. Forma correcta con 6 términos: $m^2 + n^2 + 2mn +
    8m + 8n + 16$.'
- titulo: Ejemplo 2
  enunciado: ¿Es numéricamente verdadera la igualdad $(1 + 2 + 3)^2 = 1^2 + 2^2 +
    3^2$?
  alternativas:
  - Falsa, porque $36 \neq 14$
  - Verdadera, porque $6^2 = 36$
  - Falsa, porque $36 \neq 18$
  respuesta: Falsa, porque $36 \neq 14$
  solucion_pasos:
  - '1. Izquierda: $(6)^2 = 36$.'
  - '2. Derecha: $1 + 4 + 9 = 14$. Faltan $2(2 + 3 + 6) = 22$ unidades.'
- titulo: ¿Es la falta de dobles productos la razón por la que $(a - b + c)^2 \neq
    a^2 + b^2 + c^2$?
  respuesta: Sí
  solucion_pasos:
  - Sí, se omiten los dobles productos $-2ab, +2ac, -2bc$.
- titulo: ¿La igualdad $(a + b + c)^2 = a^2 + b^2 + c^2$ se cumple para $a=1, b=1,
    c=1$?
  respuesta: 'No'
  solucion_pasos:
  - No, $9 \neq 3$, difieren en las 6 unidades de los dobles productos.
errores_frecuentes:
- Declarar que la suma de tres cuadrados $a^2 + b^2 + c^2$ representa el desarrollo
  completo de $(a + b + c)^2$.
- Declarar que la potencia cuadrática es distributiva sobre la adición de tres términos.
- Declarar que $(x + y + 1)^2$ es igual a $x^2 + y^2 + 1$ omitiendo todos los productos
  cruzados.
- Declarar que los productos cruzados son innecesarios en trinomios con constantes
  numéricas.
- Declarar que el desarrollo del cuadrado de trinomio contiene 4 términos en lugar
  de 6.
afirmaciones_verdaderas:
- Para cualesquiera números reales no nulos, $(a + b + c)^2$ es estrictamente diferente
  de $a^2 + b^2 + c^2$.
- La corrección de desarrollos incompletos consiste en añadir los tres dobles productos
  $2ab + 2ac + 2bc$.
al_terminar_debes_poder: Al terminar serás capaz de detectar e identificar inmediatamente
  la omisión de productos dobles en desarrollos erróneos de cuadrado de trinomio.
