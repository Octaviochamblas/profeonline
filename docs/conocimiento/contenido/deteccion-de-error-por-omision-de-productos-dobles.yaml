semantic_id: MAT.ALG.CUADRADO_TRINOMIO.OMISION_PRODUCTOS_DOBLES
resumen_inicial: 'Detección de error por omisión de productos dobles: fórmula, regla
  de expansión y aplicaciones en Cuadrado de trinomio.'
explicacion_simple: Si el error de omisión era malo con binomios, con trinomios omites
  3 términos completos.
explicacion_formal: '### Definición formal


  La potenciación no se distribuye sobre una suma: en general $(x_1+x_2+\dots+x_k)^n
  \neq x_1^n+x_2^n+\dots+x_k^n$ para $n \geq 2$; la distribución de exponentes solo
  es válida sobre productos, $(xy)^n = x^ny^n$. Por eso el desarrollo de $(a+b+c)^2$
  conserva sus $6$ sumandos ($3$ cuadrados más $3$ dobles productos) y no se reduce
  a $a^2+b^2+c^2$.


  ### Desarrollo didáctico


  El error algebraico más crítico al enfrentar un cuadrado de un trinomio $(a+b+c)^2$
  es asumir, por falta de rigor o prisa, que el exponente se puede repartir directamente
  sobre cada sumando.


  **El error en cuestión:**

  $(a+b+c)^2 \neq a^2 + b^2 + c^2$


  **Por qué es incorrecto:**

  Distribuir potencias solo es matemáticamente válido a través de multiplicaciones
  o divisiones (ej. $(abc)^2 = a^2b^2c^2$), nunca a través de sumas o restas. Si omites
  los dobles productos ($2ab+2ac+2bc$), estás ignorando deliberadamente seis de los
  nueve términos que se originan de la distributividad real $(a+b+c)(a+b+c)$.


  Si un estudiante comete este error calculando áreas o valores numéricos, estaría
  perdiendo gran parte del valor total. Para recordarlo, asimila que las sumas "generan
  puentes" (términos cruzados) entre las variables al elevarse a una potencia.'
