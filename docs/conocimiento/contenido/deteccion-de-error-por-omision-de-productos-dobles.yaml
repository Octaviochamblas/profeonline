procedimiento:
- 'Paso 1: Al auditar cálculos ajenos, cuenta cuántos términos se generaron al desarrollar
  un trinomio al cuadrado. Deben ser 6 antes de reducir términos semejantes.'
- Faltan los 3 dobles productos ($2xy, 2xz, 2yz$).
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en detección de error por omisión de productos dobles.
ejemplos:
- titulo: Auditoría
  enunciado: 'Detecta el error en: $(x-y-1)^2 = x^2 - y^2 + 1$.'
  solucion_pasos:
  - Primero, el cuadrado de $-y$ debe ser $+y^2$.
  - 'Segundo, faltan todos los productos cruzados: $-2xy$, $-2x$, $+2y$.'
- titulo: Cuántos términos omite el estudiante que asume que $(x+y+z)^2 = x^2+y^2+z^2$
  enunciado: '¿Cuántos términos omite el estudiante que asume que $(x+y+z)^2 = x^2+y^2+z^2$?


    Opciones: A) Omite $3$ términos. · B) Omite $1$ término. · C) Omite $6$ términos.
    · D) No omite ninguno.'
  solucion_pasos:
  - Faltan los 3 dobles productos ($2xy, 2xz, 2yz$).
  - 'Respuesta: Omite $3$ términos.'
- titulo: 'Respecto de «Detección de error por omisión de productos dobles»: ¿Se ajusta
    a la definición'
  enunciado: 'Respecto de «Detección de error por omisión de productos dobles»: ¿Se
    ajusta a la definición esta afirmación? «El desarrollo correcto tiene $6$ sumandos»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El desarrollo correcto tiene
    $6$ sumandos.'
- titulo: 'Respecto de «Detección de error por omisión de productos dobles»: ¿Es compatible
    con el proc'
  enunciado: 'Respecto de «Detección de error por omisión de productos dobles»: ¿Es
    compatible con el procedimiento esta afirmación? «Olvidar los productos cruzados»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El desarrollo correcto tiene
    $6$ sumandos.'
errores_frecuentes:
- Olvidar los productos cruzados.
- Omite $1$ término.
- Omite $6$ términos.
- Para «¿Cuántos términos omite el estudiante que asume que $(x+y+z)^2 = x^2+y^2+z^2$»,
  la respuesta correcta es No omite ninguno.
- La afirmación «Omite $3$ términos» no es válida en este contenido.
afirmaciones_verdaderas:
- Los productos notables permiten obtener desarrollos algebraicos sin multiplicar
  término a término.
