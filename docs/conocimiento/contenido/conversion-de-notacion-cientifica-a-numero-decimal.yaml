semantic_id: MAT.NUM.NOTACION_CIENTIFICA.CONVERSION_A_DECIMAL
resumen_inicial: 'Para pasar de notación científica a forma decimal, se desplaza la coma del
  coeficiente tantas posiciones como indique el exponente: a la derecha si es positivo, a
  la izquierda si es negativo.'
explicacion_simple: 'Para expandir un número de notación científica a su forma habitual:

  - Si el exponente es positivo (ej: $3{,}2 \cdot 10^4$), mueves la coma **a la derecha**
  4 lugares $\implies 32.000$.

  - Si el exponente es negativo (ej: $5{,}1 \cdot 10^{-3}$), mueves la coma **a la izquierda**
  3 lugares $\implies 0{,}0051$.'
explicacion_formal: 'La conversión de $k \cdot 10^n$ a forma estándar consiste en efectuar
  la multiplicación por $10^n$:

  - Si $n > 0$, equivale a multiplicar por $10^n$ (desplazamiento a la derecha).

  - Si $n < 0$, equivale a dividir por $10^{|n|}$ (desplazamiento a la izquierda).'
definiciones_clave: '- **Desplazamiento según el signo del exponente**: $+n \to \text{derecha}$;
  $-n \to \text{izquierda}$.'
propiedades_relaciones: '- **Relleno de ceros**: Las posiciones vacías generadas por el desplazamiento
  se completan con ceros.'
ejemplo_guiado:
  enunciado: Convierte a número decimal A) $4{,}8 \cdot 10^5$ y B) $2{,}7 \cdot 10^{-4}$.
  pasos:
  - 'Para A: exponente $+5$. Mover la coma de $4{,}8$ cinco lugares a la derecha $\implies
    480.000$.'
  - 'Para B: exponente $-4$. Mover la coma de $2{,}7$ cuatro lugares a la izquierda $\implies
    0{,}00027$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor decimal de $6{,}3 \cdot 10^{-3}$?
  choices:
  - text: 0,0063
    is_correct: true
  - text: 0,063
    is_correct: false
  - text: '6300'
    is_correct: false
  - text: 0,00063
    is_correct: false
  explanation: 'La correcta es: 0,0063. Desplazamos la coma 3 lugares a la izquierda desde
    6,3.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿A qué número equivale $9{,}1 \cdot 10^3$?
  choices:
  - text: '9100'
    is_correct: true
  - text: '91000'
    is_correct: false
  - text: '910'
    is_correct: false
  - text: 0,0091
    is_correct: false
  explanation: 'La correcta es: 9100. Desplazamos la coma 3 lugares a la derecha desde 9,1.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar el valor y signo del exponente $n$.'
- 'Paso 2: Si $n > 0$, mover la coma $n$ lugares hacia la derecha llenando con ceros.'
- 'Paso 3: Si $n < 0$, mover la coma $|n|$ lugares hacia la izquierda agregando $0,$ si corresponde.'
errores_correccion: No confundas la dirección. Exponente positivo empuja la coma a la **derecha**;
  exponente negativo a la **izquierda**.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Expresa $1{,}5 \cdot 10^2$ en forma decimal.
  alternativas:
  - '150'
  - '1500'
  - '15'
  respuesta: '150'
  solucion_pasos:
  - 'Mover coma 2 lugares a la derecha: $150$.'
- titulo: Ejemplo 2
  enunciado: ¿A qué número equivale 3,4 · 10^4?
  alternativas:
  - '34000'
  - '3400'
  - '340000'
  respuesta: '34000'
  solucion_pasos:
  - Se desplaza la coma 4 lugares a la derecha.
- titulo: Ejemplo 3
  enunciado: ¿A qué número equivale 7,2 · 10^{-3}?
  alternativas:
  - 0,0072
  - 0,072
  - '7200'
  respuesta: 0,0072
  solucion_pasos:
  - Se desplaza la coma 3 lugares a la izquierda.
- titulo: ¿Es 2,5 · 10^0 igual a 2,5?
  respuesta: Sí
  solucion_pasos:
  - Un exponente 0 no desplaza la coma.
errores_frecuentes:
- Mover la coma en dirección contraria al signo del exponente.
- Mover la coma hacia la izquierda cuando el exponente es positivo.
- Mover la coma hacia la derecha cuando el exponente es negativo.
- Contar mal la cantidad de posiciones que debe desplazarse la coma.
- Olvidar completar con ceros las posiciones vacías generadas por el desplazamiento.
afirmaciones_verdaderas:
- $k \cdot 10^n$ se expande moviendo la coma según el signo de $n$.
- Al convertir a decimal, la cantidad de ceros agregados coincide con el valor absoluto del
  exponente, descontando los dígitos ya disponibles en el coeficiente.
al_terminar_debes_poder: Convertir fluidamente de notación científica a desarrollo decimal
  estándar.
fuente: Texto escolar MINEDUC.
estado: publicado
