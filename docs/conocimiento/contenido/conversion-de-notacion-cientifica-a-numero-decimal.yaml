semantic_id: MAT.NUM.NOTACION_CIENTIFICA.CONVERSION_A_DECIMAL
resumen_inicial: Para convertir $k \cdot 10^n$ a forma decimal estándar, la coma se
  desplaza $n$ posiciones a la derecha si $n > 0$, o $n$ posiciones a la izquierda
  si $n < 0$.
explicacion_simple: 'Para pasar de notación científica a número común decimal, nos
  guiamos por el signo del exponente: si el exponente es positivo, corremos la coma
  hacia la derecha agrandando el número; si el exponente es negativo, corremos la
  coma hacia la izquierda achicándolo.'
explicacion_formal: 'La conversión de $k \cdot 10^n$ a forma decimal estándar $x$
  se rige por la regla de desplazamiento opuesto:


  $$x = \begin{cases} k \text{ desplazando coma } n \text{ lugares a la derecha} &
  \text{si } n > 0 \\ k \text{ desplazando coma } |n| \text{ lugares a la izquierda}
  & \text{si } n < 0 \end{cases}$$


  **Desglose de la expansión:**

  - Relleno con ceros: Si faltan cifras al correr la coma, se añaden ceros suplementarios.


  > **Complemento didáctico:** Ejemplo: $4,2 \cdot 10^4 = 42.000$ y $4,2 \cdot 10^{-3}
  = 0,0042$.'
definiciones_clave: '- **Conversión a decimal estándar**: Proceso inverso de desplazar
  la coma según el valor y signo del exponente $n$.'
propiedades_relaciones: '- **Desplazamiento por signo**: Exponente positivo desplaza
  a la derecha; exponente negativo desplaza a la izquierda.'
ejemplo_guiado:
  enunciado: Convierta a número decimal estándar las expresiones $5,6 \cdot 10^4$
    y $3,1 \cdot 10^{-3}$.
  pasos:
  - 'Paso 1: Para $5,6 \cdot 10^4$, exponente $+4 \implies$ mover coma $4$ posiciones
    a la derecha: $56.000$.'
  - 'Paso 2: Para $3,1 \cdot 10^{-3}$, exponente $-3 \implies$ mover coma $3$ posiciones
    a la izquierda: $0,0031$.'
  - 'Conclusión: $5,6 \cdot 10^4 = 56.000$ y $3,1 \cdot 10^{-3} = 0,0031$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Hacia qué lado se desplaza la coma al convertir k · 10^n a decimal cuando
    el exponente n es positivo?
  choices:
  - text: Hacia la derecha (agrandando el número)
    is_correct: true
  - text: Hacia la izquierda
    is_correct: false
  - text: No se desplaza
    is_correct: false
  - text: Se elimina la coma
    is_correct: false
  explanation: La alternativa correcta es 'Hacia la derecha (agrandando el número)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 3,1 · 10^{-3}, ¿cuál fue el número decimal obtenido?
  choices:
  - text: 0,0031
    is_correct: true
  - text: '3100'
    is_correct: false
  - text: 0,031
    is_correct: false
  - text: '31.000'
    is_correct: false
  explanation: La alternativa correcta es '0,0031'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar el signo del exponente $n$ de la potencia de diez.'
- 'Paso 2: Si $n > 0$, desplazar la coma $n$ lugares a la derecha. Si $n < 0$, desplazar
  $|n|$ lugares a la izquierda.'
- 'Paso 3: Completar con ceros en las posiciones donde sea necesario.'
errores_correccion: '- **Error 1: Mover la coma a la izquierda cuando el exponente
  es positivo.** **Cómo corregirlo:** Exponente positivo amplifica el número, la coma
  se mueve a la DERECHA.


  - **Error 2: Agregar exactamente $n$ ceros sin contar los dígitos decimales existentes.**
  **Cómo corregirlo:** La coma se traslada por POSICIONES decimales, no por cantidad
  fija de ceros.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Convierta $2,5 \cdot 10^3$ a decimal.
  alternativas:
  - '2500'
  - '250'
  - 0,0025
  respuesta: '2500'
  solucion_pasos:
  - $2,5 \cdot 1000 = 2500$.
- titulo: Ejemplo 2
  enunciado: Convierta $7 \cdot 10^{-4}$ a decimal.
  alternativas:
  - 0,0007
  - 0,007
  - '70.000'
  respuesta: 0,0007
  solucion_pasos:
  - $7 / 10.000 = 0,0007$.
- titulo: ¿Es 1,2 · 10^2 igual a 120?
  respuesta: Sí
  solucion_pasos:
  - Sí, $1,2 \cdot 100 = 120$.
- titulo: ¿Requiere un exponente negativo mover la coma hacia la izquierda?
  respuesta: Sí
  solucion_pasos:
  - Sí, reduce la magnitud creando ceros a la izquierda.
errores_frecuentes:
- Mover la coma decimal a la izquierda al convertir expresiones con exponentes positivos.
- Agregar ceros directamente al final del coeficiente ignorando los decimales existentes.
- Eliminar la coma decimal de forma inmediata sin modificar la posición del coeficiente.
- La expresión $4,5 \cdot 10^3$ equivale al número decimal $0,0045$.
- Mover la coma a la derecha cuando el exponente de diez es un número negativo.
afirmaciones_verdaderas:
- Para pasar de notación científica a decimal, un exponente $+n$ desplaza la coma
  a la derecha y un exponente $-n$ a la izquierda.
- Las posiciones vacías creadas durante el desplazamiento de la coma se rellenan con
  ceros suplementarios.
al_terminar_debes_poder: Al terminar serás capaz de convertir números en notación
  científica $k \cdot 10^n$ a su representación decimal estándar, desplazando la coma
  según el signo del exponente.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
