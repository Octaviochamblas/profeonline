semantic_id: MAT.GEO.AREAS_TRIANGULOS.FORMULA_BASE_ALTURA
resumen_inicial: 'Fórmula del área del triángulo: A = base × altura / 2: conceptos,
  teoremas, propiedades geométricas y cálculo en Perímetros, Áreas y Teoremas.'
explicacion_simple: El área de cualquier triángulo, sin importar su forma, puede calcularse
  con una sola fórmula sencilla que combina la medida de un lado (base) y su altura
  correspondiente.
explicacion_formal: '![Fórmula del área: base por altura sobre 2](/static/img/geometria/areas-pitagoras/areas-triangulos-formula-base-altura.svg)


  ### Definición formal


  Si $b$ es la base de un triángulo y $h$ es la altura correspondiente a esa base,
  su área es $A=\frac{b\cdot h}{2}$.


  ### Desarrollo didáctico


  Un triángulo con base 8 cm y altura 5 cm tiene área $A=\frac{8\times5}{2}=\frac{40}{2}=20$
  cm². Esta fórmula surge de que el triángulo es exactamente la mitad de un paralelogramo
  de igual base y altura.'
