procedimiento:
- 'Paso 1: Identifica las coordenadas del punto P(x,y) y las componentes del vector
  traslación v=(a,b).'
- 'Paso 2: Suma la componente a a la abscisa: x+a.'
- 'Paso 3: Suma la componente b a la ordenada: y+b, obteniendo el punto imagen P''(x+a,
  y+b).'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con procedimiento de traslación de puntos en el plano.
ejemplos:
