semantic_id: MAT.GEO.ISOMETRIA_TRASLACION.TRASLACION_PUNTOS
resumen_inicial: 'Procedimiento de traslación de puntos en el plano: conceptos, teoremas,
  propiedades geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: Trasladar un punto es tan simple como sumarle las componentes
  del vector traslación a sus propias coordenadas.
explicacion_formal: '![Procedimiento de traslación de puntos](/static/img/geometria/isometrias/traslacion-puntos.svg)


  ### Definición formal


  Si $P(x,y)$ es un punto y $\vec{v}=(a,b)$ es el vector traslación, el punto imagen
  es $P''(x+a,\,y+b)$: se suma la componente $a$ a la abscisa y la componente $b$
  a la ordenada.


  ### Desarrollo didáctico


  En la figura, el punto $P(-3,-2)$ se traslada mediante el vector $\vec{v}=(4,3)$,
  obteniendo $P''(-3+4,\,-2+3)=(1,1)$.'
definiciones_clave: '- **Procedimiento de traslación de puntos en el plano**: Elemento
  o propiedad fundamental en el estudio de transformaciones isométricas.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a procedimiento de traslación de puntos en el
  plano.'
