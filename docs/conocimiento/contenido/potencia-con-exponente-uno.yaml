semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_UNO
resumen_inicial: 'Cualquier número o expresión real elevada al exponente 1 es exactamente
  igual al mismo número base: $a^1 = a$.'
explicacion_simple: Elevar un número a 1 significa tomar únicamente un factor de ese
  número, por lo que no se realiza ninguna multiplicación. El resultado es simplemente
  el mismo número original.
explicacion_formal: 'Para todo número real $a \in \mathbb{R}$, el **Axioma del Exponente
  Unitario** establece:


  $$a^1 = a$$


  **Desglose formal:**

  - Elemento neutro del exponente: El número $1$ en el exponente actúa como la identidad
  funcional de la potenciación.

  - Notación implícita: Todo número $x$ sin exponente visible tiene implícitamente
  un exponente $1$ ($x = x^1$).


  > **Complemento didáctico:** Recordar que $x = x^1$ es fundamental al agrupar potencias
  de igual base en álgebra (ej: $x \cdot x^2 = x^1 \cdot x^2 = x^3$).'
definiciones_clave: '- **Propiedad del exponente 1**: Regla $a^1 = a$ donde elevar
  a la unidad preserva la base intacta.'
propiedades_relaciones: '- **Elemento neutro del exponente**: $a^1 = a$ para todo
  real $a$.'
ejemplo_guiado:
  enunciado: Evalúe las potencias $7^1$, $(-9)^1$ y $\left(\frac{5}{2}\right)^1$.
  pasos:
  - 'Paso 1: Aplicar la regla del exponente unitario a $7^1$: resulta $7$.'
  - 'Paso 2: Aplicar la regla a $(-9)^1$: la base se conserva con su signo $\implies
    -9$.'
  - 'Paso 3: Aplicar la regla a $\left(\frac{5}{2}\right)^1$: resulta la fracción
    $\frac{5}{2}$.'
  - 'Conclusión: Los resultados son $7$, $-9$ y $\frac{5}{2}$ respectivamente.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué es igual cualquier número real a elevado al exponente 1 (a^1)?
  choices:
  - text: Al mismo número base a
    is_correct: true
  - text: Al número 1 siempre
    is_correct: false
  - text: Al número 0
    is_correct: false
  - text: Al doble de la base 2a
    is_correct: false
  explanation: La alternativa correcta es 'Al mismo número base a'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (-9)^1, ¿cuál fue el resultado?
  choices:
  - text: '-9'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '9'
    is_correct: false
  - text: '0'
    is_correct: false
  explanation: La alternativa correcta es '-9'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el exponente de la potencia es $1$.'
- 'Paso 2: Aplicar la regla $a^1 = a$ sin alterar la base.'
- 'Paso 3: Escribir la base como el resultado numérico directo.'
errores_correccion: '- **Error 1: Creer que $a^1 = 1$ para cualquier base.** **Cómo
  corregirlo:** La potencia que da $1$ es la de exponente CERO ($a^0 = 1$); con exponente
  $1$ el resultado es la BASE ($a^1 = a$).


  - **Error 2: Pensar que $(-x)^1 = x$ (cambiar el signo).** **Cómo corregirlo:**
  El exponente $1$ conserva la base exactamente como está, incluyendo su signo.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $15^1$.
  alternativas:
  - '15'
  - '1'
  - '0'
  respuesta: '15'
  solucion_pasos:
  - $15^1 = 15$.
- titulo: Ejemplo 2
  enunciado: Calcule $(-100)^1$.
  alternativas:
  - '-100'
  - '1'
  - '100'
  respuesta: '-100'
  solucion_pasos:
  - $(-100)^1 = -100$.
- titulo: ¿Es pi^1 exactamente igual a pi?
  respuesta: Sí
  solucion_pasos:
  - Sí, toda base real elevada a $1$ da la misma base.
- titulo: ¿Es 0^1 igual a 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, $0^1 = 0$.
errores_frecuentes:
- Afirmar que elevar cualquier número al exponente 1 da como resultado el número 1.
- Elevar un número negativo al exponente 1 elimina su signo transformándolo en positivo.
- El exponente 1 exige multiplicar la base por el entero 2.
- Un número que no tiene exponente explícito posee exponente cero.
- La potencia $0^1$ es una expresión matemática no definida.
afirmaciones_verdaderas:
- Toda base real elevada al exponente 1 conserva intacto su valor original ($a^1 =
  a$).
- El exponente 1 actúa como el elemento neutro de la potenciación.
al_terminar_debes_poder: Al terminar serás capaz de simplificar potencias con exponente
  1, reconociendo que $a^1 = a$ preserva la base intacta.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
