semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_UNO
resumen_inicial: Todo número elevado al exponente 1 es igual al mismo número ($a^1
  = a$).
explicacion_simple: 'Elevar a $1$ significa que el número aparece una sola vez como
  factor, por lo que no se realiza ninguna multiplicación adicional:

  - $7^1 = 7$

  - $(-12)^1 = -12$

  - $\left(\frac{3}{5}\right)^1 = \frac{3}{5}$'
explicacion_formal: Por definición de la notación de potencia en $\mathbb{R}$, para
  cualquier $a \in \mathbb{R}$, se cumple la identidad $a^1 = a$. El exponente 1 es
  el elemento neutro en la posición de exponente respecto a la base.
definiciones_clave: '- **Identidad de exponente unitario**: $a^1 = a$ para todo $a
  \in \mathbb{R}$.'
propiedades_relaciones: '- **Conservación de valor y signo**: El resultado conserva
  exactamente el valor y signo de la base.'
ejemplo_guiado:
  enunciado: Evalúa las expresiones $15^1$ y $(-8)^1$.
  pasos:
  - 'Para $15^1$: como el exponente es 1, el resultado es la base misma: $15$.'
  - 'Para $(-8)^1$: el resultado es la base misma con su signo: $-8$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿A qué es igual la potencia $(-45)^1$?
  choices:
  - text: '-45'
    is_correct: true
  - text: '45'
    is_correct: false
  - text: '1'
    is_correct: false
  - text: '-1'
    is_correct: false
  explanation: 'La correcta es: -45. Todo número elevado a 1 es igual a sí mismo.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si $x^1 = 99$, ¿cuál es el valor de $x$?
  choices:
  - text: '99'
    is_correct: true
  - text: '1'
    is_correct: false
  - text: '0'
    is_correct: false
  - text: '9.9'
    is_correct: false
  explanation: 'La correcta es: 99. Como $x^1 = x$, $x = 99$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar que el exponente sea 1.'
- 'Paso 2: Escribir como resultado exactamente el valor de la base.'
errores_correccion: No confundir el exponente 1 con el resultado 1. $a^1 = a$, mientras
  que $a^0 = 1$.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $0^1$.
  alternativas:
  - '0'
  - '1'
  - Indefinido
  respuesta: '0'
  solucion_pasos:
  - $0^1 = 0$.
errores_frecuentes:
- Creer que cualquier número elevado a 1 da 1.
afirmaciones_verdaderas:
- $a^1 = a$ para cualquier número real $a$.
al_terminar_debes_ponder: Aplicar la propiedad del exponente 1 de forma inmediata.
fuente: Texto escolar MINEDUC.
estado: publicado
