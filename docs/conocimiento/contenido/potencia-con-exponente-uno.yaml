semantic_id: MAT.NUM.POTENCIAS_CONCEPTO.EXPONENTE_UNO
resumen_inicial: Todo número real elevado al exponente uno es idéntico a sí mismo ($a^1 = a$), actuando como el elemento neutro de la exponenciación.
explicacion_simple: '![Potencia con exponente uno](/static/img/nodos/potencia-con-exponente-uno-intro.svg)


  Elevar cualquier número al exponente $1$ significa tomar ese número una sola vez como factor. Por eso, el resultado es exactamente el mismo número inicial: $7^1 = 7$, $(-4)^1 = -4$ y $(\sqrt{2})^1 = \sqrt{2}$. En matemáticas, cuando una letra o número no lleva exponente, siempre se asume que su exponente es $1$.'
explicacion_formal: "Para todo número real $a \\in \\mathbb{R}$, la **Potencia con Exponente Uno** se define axiomáticamente como:\n\n$$a^1 = a$$\n\n**Consecuencias formales:**\n1. **Preservación de identidad:** La aplicación de exponente $1$ es la transformación identidad en $(\\mathbb{R}, \\cdot)$.\n2. **Propiedad de cociente idéntico:**\n   $$\\frac{a^{n+1}}{a^n} = a^{(n+1)-n} = a^1 = a \\quad (\\text{para } a \\neq 0)$$\n3. **Exponente tácito en monomios:** En cualquier término algebraico, la ausencia de superíndice equivale a $x \\equiv x^1$."
definiciones_clave: '- **Identidad exponencial**: Propiedad que establece que $a^1 = a$.

  - **Superíndice unitario**: Notación explícita del exponente 1.'
propiedades_relaciones: '- **Cálculo de productos monomios**: $x \cdot x^n = x^1 \cdot x^n = x^{1+n}$.

  - **Conserva valor y signo**: $(-k)^1 = -k$ y $-k^1 = -k$.'
ejemplo_guiado:
  enunciado: '![Ejemplos de potencias con exponente uno](/static/img/nodos/potencia-con-exponente-uno-ejemplos.svg)


    Evalúe las potencias $(-9)^1$, $\left(\frac{3}{5}\right)^1$ y $(\sqrt{2})^1$.'
  pasos:
  - 'Paso 1: Evaluar $(-9)^1$: Por la propiedad de exponente $1$, $(-9)^1 = -9$.'
  - 'Paso 2: Evaluar $\left(\frac{3}{5}\right)^1$: Por la misma propiedad, $\left(\frac{3}{5}\right)^1 = \frac{3}{5}$.'
  - 'Paso 3: Evaluar $(\sqrt{2})^1$: Se preserva el número real irracional, $(\sqrt{2})^1 = \sqrt{2}$.'
  - 'Conclusión: El exponente $1$ mantiene inalterada la base en los tres casos.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el valor de simplificar $\frac{x^5}{x^4}$ para $x \neq 0$?
  choices:
  - text: $x^1 = x$
    is_correct: true
  - text: $x^9$
    is_correct: false
  - text: $1$
    is_correct: false
  - text: $x^0$
    is_correct: false
  explanation: La alternativa correcta es '$x^1 = x$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿qué efecto tuvo el exponente $1$ sobre la base $(-9)$?
  choices:
  - text: Mantuvo su valor y su signo exactamente iguales ($-9$)
    is_correct: true
  - text: Transformó el número en positivo ($+9$)
    is_correct: false
  - text: Lo convirtió en $1$
    is_correct: false
  - text: Lo convirtió en $0$
    is_correct: false
  explanation: La alternativa correcta es 'Mantuvo su valor y su signo exactamente iguales ($-9$)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el exponente $1$ en la expresión.'
- 'Paso 2: Aplicar la identidad $a^1 = a$ retirando el superíndice sin modificar la base.'
- 'Paso 3: Conservar estrictamente el signo y valor numérico original de la base.'
errores_correccion: '- **Error 1: Creer que $a^1 = 1$.** **Cómo corregirlo:** Confusión con $a^0 = 1$. Todo número elevado a $1$ es el MISMO número ($a^1 = a$).

  - **Error 2: Olvidar el exponente 1 al sumar exponentes.** **Cómo corregirlo:** En $3 \cdot 3^4$, escribir $3^1 \cdot 3^4 = 3^{1+4} = 3^5 = 243$ (no omitir el $1$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuánto es $(-15)^1$?
  alternativas:
  - $-15$
  - $+15$
  - $1$
  respuesta: $-15$
  solucion_pasos:
  - $(-15)^1 = -15$.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es el resultado de $5 \cdot 5^3$?
  alternativas:
  - $5^4 = 625$
  - $5^3$
  - $25^3$
  respuesta: $5^4 = 625$
  solucion_pasos:
  - $5^1 \cdot 5^3 = 5^{1+3} = 5^4 = 625$.
- titulo: ¿Es todo número elevado a 1 igual al mismo número?
  respuesta: Sí
  solucion_pasos:
  - Sí, $a^1 = a$ para todo número real.
  alternativas:
  - texto: Sí, es la propiedad de identidad del exponente 1
    es_correcta: true
    retroalimentacion: ¡Correcto! $a^1 = a$ universalmente.
  - texto: No, siempre es igual a 1
    es_correcta: false
    retroalimentacion: Incorrecto, eso ocurre con el exponente cero ($a^0 = 1$).
  - texto: Solo para números enteros
    es_correcta: false
    retroalimentacion: Incorrecto, aplica a fracciones, raíces y decimales.
- titulo: ¿Es (-1)¹ igual a +1?
  respuesta: 'No'
  solucion_pasos:
  - No, $(-1)^1 = -1$, el exponente 1 conserva el signo.
  alternativas:
  - texto: No, $(-1)^1 = -1$
    es_correcta: true
    retroalimentacion: ¡Correcto! El exponente 1 preserva el valor y el signo original.
  - texto: Sí, porque el exponente es positivo
    es_correcta: false
    retroalimentacion: Incorrecto, el exponente no cambia el signo de la base.
  - texto: Sí, porque 1 es neutro
    es_correcta: false
    retroalimentacion: Incorrecto, ser neutro significa dejar el número tal como está ($-1$).
errores_frecuentes:
- Confundir $a^1 = a$ con $a^0 = 1$.
- Cambiar el signo de bases negativas elevadas a 1.
- Omitir el exponente 1 al reducir productos de potencias de igual base.
- Pensar que $0^1$ no está definido ($0^1 = 0$).
- Creer que el exponente 1 multiplica la base por 1 y altera la jerarquía.
afirmaciones_verdaderas:
- Para todo número real $a$, $a^1 = a$.
- El exponente $1$ actúa como elemento neutro en la exponenciación.
- Cualquier término sin superíndice explícito posee un exponente $1$ tácito.
al_terminar_debes_poder: '![Síntesis de potencia con exponente uno](/static/img/nodos/potencia-con-exponente-uno-resumen.svg)


  QUÉ: Aplicar la propiedad de potencia con exponente uno en expresiones numéricas y algebraicas.


  CÓMO: Reconociendo la identidad $a^1 = a$, haciendo explícito el superíndice $1$ en términos sin exponente al operar productos o cocientes de igual base, y conservando inalterados el valor y signo de la base.'
fuente: Texto escolar MINEDUC — Matemática 7° y 8° Básico / 1° Medio / PAES.
