  explanation: La alternativa correcta es '$5x + 5$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la resta correcta $\frac{5x + 5}{x - 3}$ para $x = 4$, ¿cuál
