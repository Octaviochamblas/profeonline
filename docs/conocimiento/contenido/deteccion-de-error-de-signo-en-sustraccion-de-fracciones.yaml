semantic_id: MAT.ALG.FRACCIONES_RESTA.ERROR_SIGNO
resumen_inicial: Omitir los paréntesis en el segundo numerador conduce a errores graves
  de signo al restar fracciones algebraicas.
explicacion_simple: 'El error más frecuente en todo el álgebra al restar fracciones
  ocurre al omitir los paréntesis en el segundo numerador.

  Por ejemplo, al resolver $\frac{A}{D} - \frac{x - 4}{D}$, escribir $A - x - 4$ en
  vez de $A - (x - 4) = A - x + 4$ cambia por completo el resultado.

  Detectar este error exige revisar siempre que el signo negativo haya alterado el
  signo de TODOS los términos del sustraendo.'
explicacion_formal: 'Sea la resta $\frac{P(x)}{D(x)} - \frac{Q(x)}{D(x)}$. La **detección
  del error de signo** contrapone la expresión errónea y la correcta:


  $$\text{Incorrecto: } \frac{P(x) - Q_1 x + Q_0}{D(x)} \quad \text{vs} \quad \text{Correcto:
  } \frac{P(x) - Q_1 x - Q_0}{D(x)}$$


  **Desglose de la fórmula:**

  - La negación del polinomio $Q(x) = Q_1 x + Q_0$ exige que $-(Q_1 x + Q_0) = -Q_1
  x - Q_0$. Omitir la negación del término independiente $Q_0$ destruye la equivalencia
  algebraica.'
definiciones_clave: '- **Error de signo en sustracción**: Fallo por no invertir el
  signo del término independiente o secundario del sustraendo.

  - **Verificación de distribución**: Comprobación paso a paso de la eliminación del
  paréntesis con cambio de signo.'
propiedades_relaciones: '- **Impacto en ecuaciones**: Un error de signo al restar
  fracciones conduce a falsas soluciones o inecuaciones con sentido equivocado.

  - **Técnica del paréntesis protector**: Estrategia de prevención que consiste en
  poner paréntesis antes de restar cualquier polinomio.'
ejemplo_guiado:
  enunciado: Analiza la operación $\frac{7x}{x - 3} - \frac{2x - 5}{x - 3}$. Detecta
    el error en la propuesta $\frac{7x - 2x - 5}{x - 3} = \frac{5x - 5}{x - 3}$, corrígela
    y evalúa para $x = 4$.
  pasos:
  - 'Paso 1: Identificar el error: En la propuesta no se aplicó el signo menos al
    término $-5$, escribiendo $-5$ en lugar de $+5$.Paso 2: Corregir aplicando paréntesis:
    $\frac{7x - (2x - 5)}{x - 3} = \frac{7x - 2x + 5}{x - 3}$.Paso 3: Reducir términos
    semejantes: el numerador correcto es $5x + 5$.Paso 4: Escribir la resta correcta:
    $\frac{5x + 5}{x - 3}$ para $x \neq 3$.Paso 5: Evaluar para $x = 4$: $\frac{5(4)
    + 5}{4 - 3} = \frac{20 + 5}{1} = 25$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el numerador reducido correcto al realizar la resta $\frac{7x}{x
