semantic_id: MAT.ALG.FUNC_POTENCIA_NEG_FRAC.DOMINIO_RAIZ_IMPAR
resumen_inicial: La determinación del dominio de funciones potencia asociadas a raíces de índice impar $f(x) = a \cdot x^{p/(2k+1)} = a \sqrt[2k+1]{x^p}$ establece que $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$, debido a la existencia universal de raíces impares reales para cualquier número real positivo, nulo o negativo.
explicacion_simple: "![La determinación del dominio de funciones potencia asociadas a raíces de índice impar $f(x) = a \\cdot x^{p/(2k+1)} = a \\sqrt[2k+1]{x^p}$ establece que $\\operatorname{Dom}(f) = \\mathbb{R} = ]-\\infty, +\\infty[$, debido a la existencia universal de raíces impares reales para cualquier número real positivo, nulo o negativo](/static/img/nodos/determinacion-del-dominio-de-funciones-potencia-asociadas-a-raices-de-indice-impar-intro.svg)\n\n\nCuando el denominador del exponente es un **número IMPAR ($1/3, 1/5, 2/7...$)**:\n\n$$\\operatorname{Dom}(f) = \\mathbb{R} = ]-\\infty, +\\infty[ \\quad (\\text{¡TODOS los Números Reales!})$$\n\n- **¿Por qué los números negativos SÍ están permitidos?**\n  - Porque elevar un número negativo a una potencia impar da resultado negativo, por lo que **su raíz impar SÍ existe y es un número real**:\n    $$\\sqrt[3]{-8} = -2 \\quad (\\text{porque } (-2)^3 = -8)$$\n    $$\\sqrt[5]{-32} = -2 \\quad (\\text{porque } (-2)^5 = -32)$$\n- **Conclusión:**\
  \ A diferencia de la raíz cuadrada, la **raíz cúbica o quinta no tiene ninguna restricción de signo**: su gráfica se extiende por toda la recta real de izquierda a derecha."
explicacion_formal: 'Sea $f(x) = a \cdot x^{p/(2k+1)} = a \sqrt[2k+1]{x^p}$ con $k, p \in \mathbb{Z}^+$ y $a \in \mathbb{R}^*$.

  Por el teorema fundamental de la radicación en el cuerpo real $(\mathbb{R}, +, \cdot)$, para cualquier orden impar $2k+1$, la aplicación $t \mapsto t^{2k+1}$ es un automorfismo continuo, biyectivo y estrictamente monótono de $\mathbb{R}$ sobre $\mathbb{R}$.

  Por lo tanto, su función inversa radical está universalmente definida en todo el espacio real:

  $$\forall x \in \mathbb{R}: \quad \sqrt[2k+1]{x} \in \mathbb{R} \Longleftrightarrow \operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$$'
definiciones_clave: '- **Clausura universal de raíces impares**: Propiedad por la cual la raíz de orden impar está unívocamente definida para cualquier radicando real.

  - **Dominio no acotado**: Extensión completa sobre toda la recta $\mathbb{R}$ sin asíntotas ni restricciones.'
propiedades_relaciones: '- **Conservación de signo**: $\operatorname{sgn}(\sqrt[2k+1]{x}) = \operatorname{sgn}(x)$ para todo $x \in \mathbb{R}$.

  - **Contraste con índices pares**: En $x^{1/2}$ el dominio es $[0, +\infty[$; en $x^{1/3}$ el dominio es $\mathbb{R}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación del dominio de funciones potencia asociadas a raíces de índice impar $f(x) = a \cdot x^{p/(2k+1)} = a \sqrt[2k+1]{x^p}$ establece que $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$, debido a la existencia universal de raíces impares reales para cualquier número real positivo, nulo o negativo](/static/img/nodos/determinacion-del-dominio-de-funciones-potencia-asociadas-a-raices-de-indice-impar-ejemplos.svg)



    Determina y fundamenta el dominio de:

    1) $f(x) = 4\sqrt[3]{x}$

    2) $g(x) = -x^{2/5}$

    3) Calcula $f(-27)$ y $g(-32)$.'
  pasos:
  - 'Paso 1: Para $f(x) = 4\sqrt[3]{x}$: Índice 3 es impar $\implies$ **$\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$**.'
  - 'Paso 2: Para $g(x) = -x^{2/5}$: Denominador 5 es impar $\implies$ **$\operatorname{Dom}(g) = \mathbb{R} = ]-\infty, +\infty[$**.'
  - 'Paso 3: Evaluaciones numéricas:

    - $f(-27) = 4\sqrt[3]{-27} = 4(-3) = \mathbf{-12} \in \mathbb{R}$.

    - $g(-32) = -(\sqrt[5]{-32})^2 = -(-2)^2 = -(4) = \mathbf{-4} \in \mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el dominio de la función $f(x) = -2\sqrt[5]{x}$?
  choices:
  - text: ℝ (todos los números reales)
    is_correct: true
  - text: '[0, +∞['
    is_correct: false
  - text: ']-∞, 0]'
    is_correct: false
  - text: ℝ \ {0}
    is_correct: false
  explanation: La alternativa correcta es 'ℝ (todos los números reales)'. Las raíces de índice impar admiten cualquier número real positivo, negativo o nulo.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el valor x = -64 pertenece al dominio de $f(x) = \sqrt[3]{x}$?
  choices:
  - text: Porque ³√(-64) = -4, un número real bien definido
    is_correct: true
  - text: Porque -64 es divisible por 3
    is_correct: false
  - text: Porque el signo negativo se transforma en positivo
    is_correct: false
  - text: Solo pertenece si el resultado es imaginario
    is_correct: false
  explanation: La alternativa correcta es 'Porque ³√(-64) = -4, un número real bien definido'. Como $(-4)^3 = -64$, la raíz cúbica real de $-64$ es $-4$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el denominador $q$ del exponente fraccionario $p/q$.'
- 'Paso 2: Comprobar que $q$ sea un número impar ($3, 5, 7, 9...$).'
- 'Paso 3: Constatar que no existen restricciones algebraicas en el radicando.'
- 'Paso 4: Declarar inmediatamente $\operatorname{Dom}(f) = \mathbb{R} = ]-\infty, +\infty[$.'
errores_correccion: '- **Error común:** Restringir el dominio a $[0, +\infty[$ tratando a la raíz cúbica como si fuera cuadrada.

  - **Cómo corregirlo:** Las raíces de índice **IMPAR SÍ admiten números negativos**: su dominio es **TODO $\mathbb{R}$**.'
ejemplos:
- titulo: 'Ejemplo 1: Raíz séptima'
  enunciado: 'El dominio de $f(x) = x^{1/7}$ es:'
  alternativas:
  - R
  - '[0, +inf['
  - ']-inf, 0]'
  - R \ {0}
  respuesta: R
  solucion_pasos:
  - 'Paso 1: Índice impar 7 $\implies \operatorname{Dom}(f) = \mathbb{R}$.'
- titulo: 'Ejemplo 2: Evaluación negativa impar'
  enunciado: ¿Cuánto vale $\sqrt[3]{-125}$?
  alternativas:
  - '-5'
  - '5'
  - No existe en R
  - '-25'
  respuesta: '-5'
  solucion_pasos:
  - 'Paso 1: $(-5)^3 = -125 \implies \sqrt[3]{-125} = -5$.'
- titulo: 'Ejemplo 3: Potencia fraccionaria impar compuesta'
  enunciado: 'El dominio de $g(x) = 6x^{4/3}$ es:'
  alternativas:
  - ']-inf, +inf['
  - '[0, +inf['
  - ']-inf, 0]'
  - R \ {3}
  respuesta: ']-inf, +inf['
  solucion_pasos:
  - 'Paso 1: Denominador 3 es impar $\implies \operatorname{Dom}(g) = \mathbb{R}$.'
- titulo: 'Ejemplo 4: Comparación de dominios'
  enunciado: ¿Qué diferencia existe entre el dominio de $y = x^{1/2}$ e $y = x^{1/3}$?
  alternativas:
  - x^(1/2) tiene dominio [0, +inf[ y x^(1/3) tiene dominio R
  - Ambas tienen dominio R
  - Ambas tienen dominio [0, +inf[
  - x^(1/3) no está definida en x = 0
  respuesta: x^(1/2) tiene dominio [0, +inf[ y x^(1/3) tiene dominio R
  solucion_pasos:
  - 'Paso 1: Índice par $\implies [0, +\infty[$; índice impar $\implies \mathbb{R}$.'
errores_frecuentes:
- Tratar a las raíces impares como si tuvieran la restricción de las raíces pares.
- Pensar que las raíces cúbicas de números negativos dan números imaginarios.
- Excluir el cero del dominio.
afirmaciones_verdaderas:
- Toda función potencia asociada a una raíz de índice impar tiene dominio igual a todo ℝ.
- Las raíces impares de números negativos son números reales negativos bien definidos.
al_terminar_debes_poder: '**QUÉ:** Determinar el dominio de funciones potencia asociadas a raíces de índice impar.


  **CÓMO:** Argumentando la existencia universal de raíces impares en ℝ para establecer Dom(f) = ℝ.


