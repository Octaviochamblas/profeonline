semantic_id: MAT.ALG.FUNCION_AFIN.INTERSECCION_EJE_Y
resumen_inicial: La intersección con el eje de las ordenadas (eje Y) es el punto cartesiano $(0, n)$ obtenido al evaluar la función en $x = 0$.
explicacion_simple: '![La intersección con el eje de las ordenadas (eje Y) es el punto cartesiano $(0, n)$ obtenido al evaluar la función en $x = 0$](/static/img/nodos/determinacion-de-la-interseccion-con-el-eje-de-las-ordenadas-intro.svg)



  Para encontrar dónde corta la recta al **eje vertical $Y$**:

  1. Haces que la entrada sea cero ($x = 0$).

  2. Calculas $y = f(0) = m(0) + n = n$.

  3. Escribes el punto completo con sus dos coordenadas: **$(0, n)$**.


  Este punto siempre tiene un $0$ en la primera posición.'
explicacion_formal: 'Dada una función afín $f(x) = mx + n$, su intersección con el eje de ordenadas $Y = \{(0, y) \in \mathbb{R}^2 \mid y \in \mathbb{R}\}$ es el conjunto unitario:

  $$\text{Graf}(f) \cap \text{Eje } Y = \{(0, f(0))\} = \{(0, n)\}$$


  **Propiedades del punto de corte vertical:**

  - **Existencia y unicidad**: Toda función real definida en $x = 0$ posee exactamente un punto de intersección con el eje $Y$.

  - **Signo de la ordenada**: Si $n > 0$ corta en el semieje superior; si $n < 0$ corta en el semieje inferior.'
definiciones_clave: '- **Intersección con eje Y**: Par ordenado $(0, n)$ donde la curva cruza la recta vertical $x = 0$.

  - **Abscisa nula**: Condición geométrica obligatoria ($x = 0$) de todo punto sobre el eje $Y$.'
propiedades_relaciones: '- **Punto de partida de graficación**: Es el punto base más cómodo para iniciar el trazado de una recta afín.

  - **Relación con la función afín inversa**: El corte con el eje Y de $f$ se convierte en el corte con el eje X de $f^{-1}$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La intersección con el eje de las ordenadas (eje Y) es el punto cartesiano $(0, n)$ obtenido al evaluar la función en $x = 0$](/static/img/nodos/determinacion-de-la-interseccion-con-el-eje-de-las-ordenadas-ejemplos.svg)



    Determina las coordenadas del punto de corte con el eje de las ordenadas para la recta $3x - 5y = 15$.'
  pasos:
  - 'Paso 1: Aplicar la condición de corte con el eje Y sustituyendo $x = 0$: $3(0) - 5y = 15$.'
  - 'Paso 2: Simplificar la ecuación: $-5y = 15$.'
  - 'Paso 3: Despejar la ordenada: $y = \frac{15}{-5} = -3$.'
  - 'Paso 4: Escribir el par ordenado resultante: $(0, -3)$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿En qué punto corta al eje Y la función $f(x) = -6x + 8$?
  choices:
  - text: (0, 8)
    is_correct: true
  - text: (8, 0)
    is_correct: false
  - text: (0, -6)
    is_correct: false
  - text: (4/3, 0)
    is_correct: false
  explanation: La alternativa correcta es '(0, 8)'. Al evaluar en $x = 0$, $f(0) = 8$, luego el punto es $(0, 8)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una recta afín pasa por $(0, -5)$, ¿cuál es el valor de su coeficiente de posición?
  choices:
  - text: n = -5
    is_correct: true
  - text: n = 5
    is_correct: false
  - text: n = 0
    is_correct: false
  - text: m = -5
    is_correct: false
  explanation: La alternativa correcta es 'n = -5'. La segunda coordenada del corte con el eje Y es directamente $n$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Sustituir la variable independiente $x = 0$ en la fórmula de la función.'
- 'Paso 2: Calcular el valor numérico resultante de $y = f(0)$.'
- 'Paso 3: Formar el par de coordenadas colocando $0$ en la abscisa e $y$ en la ordenada.'
- 'Paso 4: Escribir la respuesta final en la notación de punto cartesiano $(0, n)$.'
errores_correccion: '- **Error común:** Escribir el punto de corte con el eje Y como $(n, 0)$ en lugar de $(0, n)$.

  - **Cómo corregirlo:** Sobre el eje vertical $Y$, **el valor de $X$ siempre es cero**, por lo que el cero va en primer lugar: $(0, n)$.'
ejemplos:
- titulo: 'Ejemplo 1: Corte negativo'
  enunciado: Halla el punto de intersección con el eje Y de $f(x) = 2x - 11$.
  alternativas:
  - (0, -11)
  - (-11, 0)
  - (0, 11)
  - (11/2, 0)
  respuesta: (0, -11)
  solucion_pasos:
  - 'Paso 1: $f(0) = 2(0) - 11 = -11$.'
  - 'Paso 2: El punto es $(0, -11)$.'
- titulo: 'Ejemplo 2: Desde tabla de valores'
  enunciado: Una tabla de valores tiene el par $(0, 7)$. ¿Qué representa este dato geométricamente?
  alternativas:
  - El corte con el eje Y en (0, 7)
  - El corte con el eje X en (0, 7)
  - La pendiente m = 7
  - El vértice de la parábola
  respuesta: El corte con el eje Y en (0, 7)
  solucion_pasos:
  - 'Paso 1: Al tener abscisa $0$, corresponde exactamente al intercepto con el eje Y.'
- titulo: 'Ejemplo 3: Ecuación implícita'
  enunciado: ¿En qué punto intersecta al eje Y la recta $x - 2y = 6$?
  alternativas:
  - (0, -3)
  - (0, 3)
  - (6, 0)
  - (0, 6)
  respuesta: (0, -3)
  solucion_pasos:
  - 'Paso 1: $0 - 2y = 6 \implies y = -3 \implies (0, -3)$.'
- titulo: 'Ejemplo 4: Función afín fraccionaria'
  enunciado: Calcula el corte con el eje Y de $f(x) = \frac{5x + 9}{3}$.
  alternativas:
  - (0, 3)
  - (0, 9)
  - (3, 0)
  - (-9/5, 0)
  respuesta: (0, 3)
  solucion_pasos:
  - 'Paso 1: $f(0) = \frac{5(0) + 9}{3} = \frac{9}{3} = 3 \implies (0, 3)$.'
errores_frecuentes:
- Invertir el orden de las coordenadas escribiendo (n, 0).
- Dar solo el número n sin expresar el par ordenado (0, n).
- Confundir el eje de las ordenadas (Y) con el eje de las abscisas (X).
afirmaciones_verdaderas:
- La intersección con el eje Y es el punto (0, n) donde la recta corta al eje vertical.
- Toda función afín tiene un único punto de corte con el eje de las ordenadas.
al_terminar_debes_poder: '**QUÉ:** Determinar el punto exacto de intersección con el eje de las ordenadas en funciones afines.


  **CÓMO:** Evaluando x = 0 en la regla funcional y expresando el resultado formalmente como el par cartesiano (0, n).


  ![Resumen La intersección con el eje de las ordenadas (eje Y) es el punto cartesiano $(0, n)$ obtenido al evaluar la función en $x = 0$](/static/img/nodos/determinacion-de-la-interseccion-con-el-eje-de-las-ordenadas-resumen.svg)'
