semantic_id: MAT.ALG.FUNCION_AFIN.INTERSECCION_EJE_Y
resumen_inicial: La intersección con el eje $Y$ de una función afín se calcula haciendo
  $x = 0$, obteniendo siempre el punto $(0, n)$.
explicacion_simple: 'El **eje de las ordenadas** es el eje vertical $Y$.

  Para hallar el punto exacto donde la gráfica de una función afín $f(x) = m x + n$
  corta a este eje:

  1. Sustituimos $x = 0$ en la función.

  2. Calculamos $f(0) = m(0) + n = n$.

  3. Escribimos las coordenadas completas del punto de corte: $(0, n)$.'
explicacion_formal: 'La **intersección gráfica con el eje de las ordenadas $Y$** es
  el conjunto intersección:


  $$G(f) \cap \{(0, y) \in \mathbb{R}^2 \mid y \in \mathbb{R}\} = \{(0, n)\}$$


  **Desglose de la fórmula:**

  - Evaluación puntual $f(0) = n$ que confirma que la abscisa del corte es siempre
  cero.'
definiciones_clave: '- **Intersección eje Y (ordenada al origen)**: Punto cartesiano
  del formato $(0, n)$ donde el gráfico atraviesa el eje vertical.'
propiedades_relaciones: '- **Unicidad de corte**: Por ser función, toda recta no vertical
  corta al eje $Y$ en exactamente UN punto.'
ejemplo_guiado:
  enunciado: Determina las coordenadas exactas del punto de intersección con el eje
    $Y$ para la función afín $f(x) = -6x + 11$.
  pasos:
  - 'Paso 1: Evaluar la función en $x = 0$: $f(0) = -6(0) + 11$.Paso 2: Multiplicar
    $-6 \cdot 0 = 0$.Paso 3: Obtener la ordenada: $f(0) = 11$.Paso 4: Formar el par
    ordenado de intersección: $(0, 11)$.'
checkpoints:
- placement: after_explicacion_formal
  question: Al evaluar $x = 0$ en $f(x) = -6x + 11$, ¿cuál es el punto de intersección
    con el eje Y?
  choices:
  - text: $(0, 11)$
    is_correct: true
  - text: $(11, 0)$
    is_correct: false
  - text: $(-6, 0)$
    is_correct: false
  - text: $(0, -6)$
    is_correct: false
  explanation: La alternativa correcta es '$(0, 11)$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de la primera coordenada (abscisa $x$) en la intersección
    con el eje de las ordenadas?
  choices:
  - text: Siempre vale cero ($x = 0$).
    is_correct: true
  - text: Vale lo mismo que la pendiente $m$.
    is_correct: false
  - text: Vale 1.
    is_correct: false
  - text: Depende de la función.
    is_correct: false
  explanation: La alternativa correcta es 'Siempre vale cero ($x = 0$).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reemplazar $x$ por $0$ en la fórmula de la función afín.'
- 'Paso 2: Calcular el resultado $y = f(0) = n$.'
- 'Paso 3: Escribir la respuesta final como el par ordenado $(0, n)$.'
errores_correccion: '- **Error común:** Responder entregando solo el número $n$ sin
  formato de punto $(0, n)$.

  - **Cómo corregirlo:** La intersección con un eje es un PUNTO en el plano cartesiano
  y debe expresarse como par ordenado $(0, n)$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de función afín.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de función afín.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función afín f(x) = mx + n con n != 0 pasa por el origen (0,0)?
  respuesta: 'No'
  solucion_pasos:
  - No, porque f(0) = n != 0.
- titulo: ¿El coeficiente de posición n indica la ordenada de corte con el eje Y?
  respuesta: Sí
  solucion_pasos:
  - Sí, la recta corta al eje Y en el punto (0, n).
errores_frecuentes:
- Confundir el coeficiente de posición $n$ (corte con el eje $Y$) con la intersección
  con el eje $X$.
- Asumir que la pendiente es siempre el primer número escrito en la fórmula sin verificar
  si acompaña a la variable $x$.
- Responder la intersección con un eje entregando solo un número suelto en lugar del
  par ordenado correspondiente.
- Confundir 'el cero de una función' (resolver $f(x)=0$) con 'evaluar en cero' (calcular
  $f(0)$).
- Cometer errores de signo al restar coordenadas negativas al aplicar la fórmula punto-pendiente.
afirmaciones_verdaderas:
- La función afín $f(x) = m x + n$ corta al eje vertical $Y$ en el punto $(0, n)$
  y al eje horizontal $X$ en $\left(-\frac{n}{m}, 0\right)$.
- La gráfica de una función afín es paralela a la gráfica de la función lineal $g(x)
  = m x$ trasladada verticalmente $n$ unidades.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y graficar
  funciones afines, identificando pendiente, coeficiente de posición, intersecciones
  con los ejes, ceros y fórmulas desde dos puntos.
