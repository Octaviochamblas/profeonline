semantic_id: MAT.ALG.FUNCION_AFIN.INTERSECCION_EJE_Y
resumen_inicial: La intersección con el eje de las ordenadas ($Y$) se obtiene al evaluar la función afín en $x = 0$, resultando en el punto $(0, b)$.
explicacion_simple: |
  El **eje de las ordenadas** es el eje vertical $Y$:

  - Para encontrar dónde la recta cruza la Pared Vertical (eje $Y$), haces la entrada **$x = 0$**.
  - Evalúas $f(0) = m(0) + b = b$.
  - El punto de corte es **SIEMPRE $(0, b)$**.
  - La altura $b$ es precisamente el **coeficiente de posición**.
explicacion_formal: |
  Sea $f(x) = mx + b$ una función afín. El conjunto intersección de su gráfica $\text{Graf}(f)$ con el eje de las ordenadas $Y = \{(0, y) \mid y \in \mathbb{R}\}$ es el par ordenado único:

  $$\text{Graf}(f) \cap Y = \{(0, f(0))\} = \{(0, b)\}$$

  **Desglose analítico:**
  - $x = 0 \implies y = m \cdot 0 + b = b \implies P = (0, b)$
definiciones_clave: |
  - **Intersección con eje $Y$**: Punto cartesiano de coordenadas $(0, b)$ donde la recta afín cruza el eje vertical de las ordenadas.
propiedades_relaciones: |
  - **Identidad con $b$**: La ordenada del punto de corte vertical equivale de forma directa al término independiente o coeficiente de posición $b$.
ejemplo_guiado:
  enunciado: "Determina el punto de intersección con el eje de las ordenadas para la función afín $f(x) = -5x + 7$."
  pasos:
    - 'Paso 1: Evaluar la función en $x = 0$: $f(0) = -5(0) + 7$.'
    - 'Paso 2: Calcular el resultado: $f(0) = 0 + 7 = 7$.'
    - 'Paso 3: Identificar que la ordenada al origen es $b = 7$.'
    - 'Paso 4: Escribir el punto de intersección cartesiano: $(0, 7)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿En qué punto corta al eje de las ordenadas ($Y$) la función afín $f(x) = -5x + 7$?"
    choices:
      - {text: "$(0, 7)$", is_correct: true}
      - {text: "$(7, 0)$", is_correct: false}
      - {text: "$(-5, 0)$", is_correct: false}
      - {text: "$(0, -5)$", is_correct: false}
    explanation: "La alternativa correcta es '$(0, 7)$'. $f(0) = -5(0) + 7 = 7$, por lo tanto el punto es $(0, 7)$."
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: "¿Qué coordenada de todo punto situado sobre el eje de las ordenadas es siempre igual a cero?"
    choices:
      - {text: "La abscisa $x = 0$.", is_correct: true}
      - {text: "La ordenada $y = 0$.", is_correct: false}
      - {text: "La pendiente $m = 0$.", is_correct: false}
      - {text: "La constante $b = 0$.", is_correct: false}
    explanation: "La alternativa correcta es 'La abscisa $x = 0$.'."
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar el coeficiente de posición $b$ en la fórmula $f(x) = mx + b$.'
  - 'Paso 2: Evaluar formalmente la función en $x = 0 \implies f(0) = b$.'
  - 'Paso 3: Formar el par ordenado asignando $0$ como abscisa y $b$ como ordenada.'
  - 'Paso 4: Escribir la coordenada cartesiana final $(0, b)$.'
errores_correccion: |
  - **Error común:** Escribir el punto de corte con el eje $Y$ como $(b, 0)$ en lugar de $(0, b)$.
  - **Cómo corregirlo:** En el eje de las **ordenadas $Y$**, la primera componente (abscisa $x$) es SIEMPRE CERO: $(0, b)$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de función afín.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de función afín.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'La intersección de la función afín $f(x) = mx + b$ con el eje de las ordenadas ocurre en el punto $(b, 0)$.'
  - 'Para determinar el corte con el eje $Y$ se debe igualar la función a cero $f(x) = 0$.'
  - 'La recta de la función afín $f(x) = 4x - 8$ cruza al eje de las ordenadas en el punto $(4, 0)$.'
  - 'Si la pendiente $m$ es negativa, la intersección con el eje $Y$ es siempre un número negativo.'
  - 'La intersección con el eje $Y$ de una función afín coincide siempre con el origen de coordenadas $(0, 0)$.'
afirmaciones_verdaderas:
  - 'El punto de intersección de una función afín $f(x) = mx + b$ con el eje de las ordenadas ($Y$) es siempre $(0, b)$.'
  - 'Todo punto situado sobre el eje de las ordenadas tiene su abscisa igual a cero ($x = 0$).'
al_terminar_debes_poder: |
  QUÉ: Determinar las coordenadas exactas del punto de intersección de una función afín con el eje $Y$.
  CÓMO: Evaluar $f(0) = b$ y escribir el par ordenado $(0, b)$.
