semantic_id: MAT.ALG.FUNCION_AFIN.INTERSECCION_EJE_Y
resumen_inicial: 'Determinación de la intersección con el eje de las ordenadas: conceptos,
  representación y propiedades en Función afín.'
explicacion_simple: Toda recta no vertical corta al eje $y$ en algún punto, y ese
  punto tiene una relación directa con la fórmula de la función.
explicacion_formal: '### Definición formal


  Dada $f(x) = mx + n$, su gráfica corta al eje $y$ (eje de las ordenadas) exactamente
  en el punto $(0, f(0)) = (0, n)$, ya que el eje $y$ corresponde a todos los puntos
  con abscisa cero.


  ### Desarrollo didáctico


  Encontrar este punto es tan simple como leer el coeficiente de posición $n$ directamente
  de la fórmula, sin necesidad de resolver ninguna ecuación.


  Si $f(x) = -3x + 8$, la intersección con el eje $y$ es el punto $(0, 8)$, obtenido
  evaluando $f(0) = -3(0)+8 = 8$.'
definiciones_clave: '- **Determinación de la intersección con el eje de las ordenadas**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a determinación de la intersección con el
  eje de las ordenadas.'
