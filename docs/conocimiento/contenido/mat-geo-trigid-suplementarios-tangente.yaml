- titulo: ¿Se cumple siempre la propiedad principal de relación de la tangente entre
    ángulos suplementarios en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede relación de la tangente entre ángulos suplementarios asumir un valor
    negativo cuando representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
