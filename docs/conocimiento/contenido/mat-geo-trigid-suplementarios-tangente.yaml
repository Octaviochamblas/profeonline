semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.SUPLEMENTARIOS_TANGENTE
resumen_inicial: 'Relación de la tangente entre ángulos suplementarios: conceptos,
  teoremas, propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: Como la tangente es el cociente entre seno y coseno, y el seno
  no cambia de signo entre suplementarios mientras que el coseno sí, la tangente hereda
  ese cambio de signo del coseno.
explicacion_formal: '![Tangente de ángulos suplementarios](/static/img/geometria/trigonometria/trigid-suplementarios-tangente.svg)


  ### Definición formal


  Como $\tan(180°-x)=\dfrac{\sin(180°-x)}{\cos(180°-x)}=\dfrac{\sin x}{-\cos x}=-\tan
  x$, se obtiene la identidad de suplementariedad de la tangente.


  ### Desarrollo didáctico


  En la figura, θ=25° y su suplementario 180°-θ=155°. Se cumple que tan155°=-tan25°,
  consecuencia directa de que el seno se mantiene igual y el coseno cambia de signo
  entre ambos ángulos.'
definiciones_clave: '- **Relación de la tangente entre ángulos suplementarios**: Elemento
  o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación de la tangente entre ángulos suplementarios.'
