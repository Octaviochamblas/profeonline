semantic_id: MAT.GEO.TRAPECIOS_TRAPEZOIDES.DELTOIDE_DEFINICION
resumen_inicial: El deltoide (o trapezoide simétrico) es un cuadrilátero con dos pares de lados consecutivos congruentes, con forma de cometa o volantín.
explicacion_simple: 'El **deltoide** es la típica cometa o volantín tradicional. A diferencia del paralelogramo (donde los lados iguales están frente a frente), en el deltoide **los lados iguales son vecinos (consecutivos)**: los dos lados de arriba son cortitos e iguales ($a = a$), y los dos lados de abajo son largos e iguales ($b = b$).


  Tiene un eje de simetría perfecto que pasa de arriba a abajo por su diagonal principal. Gracias a esto, los dos ángulos laterales que quedan a los costados **miden exactamente lo mismo** ($\alpha = \alpha$).


  ![Definición de deltoide](/static/img/nodos/definicion-de-deltoide-como-trapezoide-simetrico-intro.svg)

  '
explicacion_formal: '### Definición formal

  Un cuadrilátero simple $\mathcal{ABCD}$ es un **deltoide** (o trapezoide simétrico) si y solo si posee dos pares disjuntos de lados consecutivos congruentes:

  $$\mathcal{ABCD} \text{ es deltoide} \iff \overline{AB} \cong \overline{AD} = a \quad \wedge \quad \overline{BC} \cong \overline{CD} = b \quad (a \neq b)$$


  ### Propiedades estructurales y angulares

  1. **Eje de simetría axial:** La recta que contiene a la diagonal principal $\overleftrightarrow{AC}$ es eje de simetría reflexiva de la figura.

  2. **Congruencia del par de ángulos laterales:** Los ángulos comprendidos entre lados no congruentes son congruentes entre sí:

  $$\angle B \cong \angle D$$

  3. **Ángulos principales desiguales:** En el caso general ($a \neq b$), los ángulos en los vértices del eje principal son distintos: $\angle A \neq \angle C$.

  4. **Perímetro del deltoide:**

  $$P = a + a + b + b = 2a + 2b = 2(a + b)$$


  > **Complemento didáctico:** ¡Atención a la posición de los lados iguales! En el paralelogramo los lados iguales son OPUESTOS (frente a frente). En el deltoide los lados iguales son CONSECUTIVOS (vecinos pegados). Con esta regla jamás los confundirás.

  '
definiciones_clave: '- **Deltoide**: Cuadrilátero convexo con dos pares de lados consecutivos congruentes.

  - **Lados consecutivos**: Pares de lados que comparten un vértice en común.

  - **Diagonal principal**: Segmento que une los vértices donde concurren lados congruentes, actuando como eje de simetría.

  '
propiedades_relaciones: '- **Relación con el rombo**: El rombo es un deltoide especial en el que $a = b$ (los cuatro lados son congruentes).

  - **Circunferencia inscrita**: Todo deltoide convexo posee una circunferencia inscrita tangente a sus cuatro lados.

  - **Suma de ángulos laterales**: Como $\angle B = \angle D$, se deduce que $\angle B = \frac{360^\circ - (\angle A + \angle C)}{2}$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de deltoide](/static/img/nodos/definicion-de-deltoide-como-trapezoide-simetrico-ejemplos.svg)


    En un deltoide $ABCD$, los lados superiores miden $a = 6$ cm y los lados inferiores miden $b = 10$ cm. Si el ángulo en el vértice superior mide $\angle A = 80^\circ$ y el ángulo en el vértice inferior mide $\angle C = 40^\circ$, calcula su perímetro y la medida de los ángulos laterales $\angle B$ y $\angle D$.'
  pasos:
  - 'Paso 1: Calcular el perímetro: $P = 2(a + b) = 2(6 + 10) = 2(16) = 32$ cm.'
  - 'Paso 2: Sumar los dos ángulos principales conocidos: $\angle A + \angle C = 80^\circ + 40^\circ = 120^\circ$.'
  - 'Paso 3: Restar de la suma total de $360^\circ$: $360^\circ - 120^\circ = 240^\circ$.'
  - 'Paso 4: Dividir entre 2 para los dos ángulos laterales iguales: $\angle B = \angle D = \frac{240^\circ}{2} = 120^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la disposición de los lados congruentes en un deltoide no rombo?
  choices:
  - text: Dos pares de lados consecutivos congruentes.
    is_correct: true
  - text: Dos pares de lados opuestos congruentes.
    is_correct: false
  - text: Cuatro lados de distinta longitud.
    is_correct: false
  - text: Tres lados iguales y uno desigual.
    is_correct: false
  explanation: La alternativa correcta es 'Dos pares de lados consecutivos congruentes.' En el deltoide los lados congruentes son vecinos adyacentes.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un deltoide, si los ángulos del eje de simetría miden 70° y 50°, ¿cuánto mide cada uno de los otros dos ángulos?
  choices:
  - text: 120°.
    is_correct: true
  - text: 60°.
    is_correct: false
  - text: 140°.
    is_correct: false
  - text: 240°.
    is_correct: false
  explanation: 'La alternativa correcta es ''120°.'' La suma restante es $360^\circ - (70^\circ + 50^\circ) = 240^\circ$. Como los dos laterales son iguales: $240^\circ / 2 = 120^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Reconocer la presencia de dos pares de lados consecutivos iguales ($a = a$ y $b = b$).

  2. Identificar el eje de simetría en la diagonal principal.

  3. Igualar los dos ángulos laterales no pertenecientes al eje: $\angle B = \angle D$.

  4. Para el perímetro, aplicar $P = 2(a + b)$.

  '
errores_correccion: '- **Error común 1:** Asumir que los lados iguales son opuestos como en el paralelogramo. **Corrección:** En el deltoide son consecutivos.

  - **Error común 2:** Creer que los cuatro ángulos son distintos. **Corrección:** Los dos ángulos comprendidos entre lados desiguales son estrictamente iguales.

  '
ejemplos:
- tipo: A
  titulo: Perímetro de cometa
  enunciado: Un volantín con forma de deltoide tiene lados de $12\text{ cm}$ y $18\text{ cm}$. ¿Cuál es su perímetro?
  alternativas:
  - text: $60\text{ cm}$.
    is_correct: true
  - text: $30\text{ cm}$.
    is_correct: false
  - text: $48\text{ cm}$.
    is_correct: false
  - text: $72\text{ cm}$.
    is_correct: false
  explicacion: $P = 2(12 + 18) = 2(30) = 60\text{ cm}$.
- tipo: B
  titulo: Ángulos laterales iguales
  enunciado: ¿Tiene el deltoide un par de ángulos opuestos congruentes?
  respuesta: Sí
  explicacion: Sí. Los dos ángulos laterales ubicados fuera del eje de simetría son congruentes entre sí.
errores_frecuentes:
- '''Confundir lados consecutivos congruentes con lados opuestos congruentes.'''
- '''Asumir que el deltoide es un paralelogramo.'''
- '''Creer que los cuatro ángulos del deltoide son iguales.'''
afirmaciones_verdaderas:
- '''El deltoide posee dos pares de lados consecutivos congruentes.'''
- '''En todo deltoide, los dos ángulos opuestos comprendidos entre lados desiguales son congruentes.'''
- '''El perímetro de un deltoide de lados $a$ y $b$ es $P = 2(a + b)$.'''
al_terminar_debes_poder: '**QUÉ:** Identificar al deltoide y aplicar sus propiedades de simetría para calcular lados, perímetros y ángulos.


  **CÓMO:** Utilizando las relaciones $a_1 = a_2$, $b_1 = b_2$ y $\angle B \cong \angle D$.


  ![Síntesis de deltoide](/static/img/nodos/definicion-de-deltoide-como-trapezoide-simetrico-resumen.svg)

  '
