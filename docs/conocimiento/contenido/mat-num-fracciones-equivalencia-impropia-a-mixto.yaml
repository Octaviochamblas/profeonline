semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.IMPROPIA_A_MIXTO
resumen_inicial: 'Para convertir una fracción impropia $\frac{a}{b}$ a número mixto, se divide $a$ entre $b$: el cociente es el entero $C$ y el residuo es el numerador $r$.'
explicacion_simple: 'Para pasar una fracción impropia a un número mixto, realizamos la división entera del número de arriba entre el de abajo. El resultado entero de la división será nuestro número grande, el residuo que sobra será el numerador de la fracción y conservamos el denominador original.


  ![Conversión de fracción impropia a número mixto](/static/img/nodos/conversion-de-fraccion-impropia-a-numero-mixto-intro.svg)'
explicacion_formal: 'Dada la fracción impropia $\frac{a}{b}$ con $a > b > 0$, el **Algoritmo de la División Euclidiana** $a = b \cdot C + r$ con $0 \le r < b$ genera la representación mixta:


  $$\frac{a}{b} = \frac{b \cdot C + r}{b} = C + \frac{r}{b} = C \frac{r}{b}$$


  **Desglose de la fórmula:**

  - $C = \lfloor a/b \rfloor$: Parte entera (cociente de la división).

  - $r = a \bmod b$: Residuo de la división ($0 \le r < b$).

  - $b$: Denominador de la fracción propia remanente.


  > **Complemento didáctico:** Para $\frac{19}{4}$, calculamos $19 : 4 = 4$ con residuo $3$, dando el mixto $4 \frac{3}{4}$.'
definiciones_clave: '- **Algoritmo de impropia a mixto**: División $a = b \cdot C + r$ para descomponer en parte entera $C$ y remanente $\frac{r}{b}$.'
propiedades_relaciones: '- **Reciprocidad algorítmica**: Es la operación inversa de transformar un número mixto en fracción impropia.'
ejemplo_guiado:
  enunciado: 'Convierta la fracción impropia $\frac{23}{5}$ a número mixto mediante la división entera.


    ![Ejemplo Conversión de fracción impropia a número mixto](/static/img/nodos/conversion-de-fraccion-impropia-a-numero-mixto-ejemplos.svg)'
  pasos:
  - 'Paso 1: Dividir $23$ entre $5$: $23 : 5 = 4$ con residuo $3$ (pues $5 \cdot 4 = 20$).'
  - 'Paso 2: Identificar los componentes: cociente $C = 4$, residuo $r = 3$ y denominador $b = 5$.'
  - 'Paso 3: Armar el número mixto: entero $4$ y fracción propia $\frac{3}{5} \implies 4 \frac{3}{5}$.'
  - 'Conclusión: $\frac{23}{5} = 4 \frac{3}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: '¿Qué rol juegan el cociente y el residuo de la división a : b al convertir a/b en mixto?'
  choices:
  - text: El cociente es la parte entera y el residuo es el numerador de la fracción propia
    is_correct: true
  - text: El residuo es la parte entera y el cociente es el denominador
    is_correct: false
  - text: Ambos se multiplican para formar el entero
    is_correct: false
  - text: No se realiza división
    is_correct: false
  explanation: La alternativa correcta es 'El cociente es la parte entera y el residuo es el numerador de la fracción propia'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 23/5, ¿cuál fue el número mixto resultante?
  choices:
  - text: 4 3/5
    is_correct: true
  - text: 5 3/4
    is_correct: false
  - text: 3 4/5
    is_correct: false
  - text: 4 5/3
    is_correct: false
  explanation: La alternativa correcta es '4 3/5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Realizar la división entera del numerador entre el denominador ($a : b$).'
- 'Paso 2: Tomar el cociente entero $C$ como el número grande de la parte entera.'
- 'Paso 3: Tomar el residuo $r$ como nuevo numerador y conservar el denominador original $b$.'
errores_correccion: '- **Error 1: Usar la parte decimal del cociente en lugar del resto entero.** **Cómo corregirlo:** La conversión a mixto requiere el RESIDUO ENTERO $r = a \bmod b$, no decimales.


  - **Error 2: Invertir el cociente y el residuo en la estructura del mixto.** **Cómo corregirlo:** El cociente $C$ es el entero principal; el residuo $r$ va en el numerador superior de la fracción remanente.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Convierta 17/3 a número mixto.
  alternativas:
  - 5 2/3
  - 3 2/5
  - 5 3/2
  respuesta: 5 2/3
  solucion_pasos:
  - '$17 : 3 = 5$ resto $2 \implies 5 \frac{2}{3}$.'
- titulo: Ejemplo 2
  enunciado: ¿Qué número mixto representa a 31/6?
  alternativas:
  - 5 1/6
  - 6 1/5
  - 5 6/1
  respuesta: 5 1/6
  solucion_pasos:
  - '$31 : 6 = 5$ resto $1 \implies 5 \frac{1}{6}$.'
- titulo: ¿Se pueden convertir las fracciones aparentes en números mixtos con fracción propia?
  respuesta: 'No'
  solucion_pasos:
  - No, al dar residuo cero las fracciones aparentes se convierten en enteros puros.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde con precisión a las reglas de equivalencia, simplificación o conversión analizadas.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el algoritmo matemático entrega un resultado único y bien definido.
  - texto: No es posible determinar la equivalencia
    es_correcta: false
    retroalimentacion: Incorrecto, los teoremas y algoritmos de fracciones permiten resolver unívocamente.
- titulo: ¿Es 13/4 equivalente a 3 1/4?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, $13 : 4 = 3$ resto $1 \implies 3 \frac{1}{4}$.'
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde con precisión a las reglas de equivalencia, simplificación o conversión analizadas.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el algoritmo matemático entrega un resultado único y bien definido.
  - texto: No es posible determinar la equivalencia
    es_correcta: false
    retroalimentacion: Incorrecto, los teoremas y algoritmos de fracciones permiten resolver unívocamente.
errores_frecuentes:
- El residuo de la división del numerador entre el denominador representa la parte entera del número mixto.
- Si una fracción impropia tiene residuo cero se debe colocar el residuo cero como numerador del mixto.
- Convertir una fracción impropia a número mixto modifica la posición decimal del número.
- El cociente de la división entera se debe colocar como denominador de la parte fraccionaria.
- Las fracciones impropias negativas no admiten conversión a representación mixta.
afirmaciones_verdaderas:
- La conversión de $\frac{a}{b}$ a número mixto utiliza el cociente $C = \lfloor a/b \rfloor$ y el residuo $r = a \bmod b$.
- Una fracción impropia no aparente se expresa como $C \frac{r}{b}$ con parte fraccionaria estrictamente propia.
al_terminar_debes_poder: '**QUÉ:** Transformar fracciones impropias a números mixtos para interpretar magnitudes e intervalos en problemas contextualizados.


  **CÓMO:** Aplicando el algoritmo de la división euclídea $a = b \cdot q + r$ ($0 \le r < b$), asignando el cociente $q$ a la parte entera y el residuo $r$ como numerador de la fracción propia remanente $q \frac{r}{b}$.


  ![Resumen Conversión de fracción impropia a número mixto](/static/img/nodos/conversion-de-fraccion-impropia-a-numero-mixto-resumen.svg)'
