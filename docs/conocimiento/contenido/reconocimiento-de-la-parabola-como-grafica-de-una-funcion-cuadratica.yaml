semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.PARABOLA
resumen_inicial: La curva curva simétrica que representa gráficamente a cualquier función cuadrática en el plano cartesiano se denomina parábola.
explicacion_simple: |
  La **parábola** es la forma visual de una función cuadrática $f(x) = ax^2 + bx + c$ al graficarla en el plano cartesiano:

  - Es una **curva en forma de U** (hacia arriba o hacia abajo).
  - Es **perfectamente simétrica**: si la cortas por el centro con una línea vertical (eje de simetría), ambos lados son idénticos como un espejo.
  - Tiene un punto extremo donde gira la curva llamado **vértice**.
  - **Diferencia clave**: Una función lineal produce una línea recta; una función cuadrática produce **SIEMPRE UNA PARÁBOLA**.
explicacion_formal: |
  Sea el lugar geométrico definido por el grafo de la función $f(x) = ax^2 + bx + c$ en $\mathbb{R}^2$. La curva obtenida es una **parábola de eje vertical** $\mathcal{P}$ con la ecuación canónica:

  $$\mathcal{P}: y = ax^2 + bx + c \quad \text{con } a \neq 0$$

  **Propiedades geométricas universales de la parábola funcional:**
  1. **Eje de simetría vertical:** La recta $x = -\frac{b}{2a}$ es un eje de simetría axial continuo.
  2. **Continuidad suave:** Es una curva diferenciable sin picos ni esquinas compuestas.
  3. **Ramas ilimitadas:** Ambas ramas se extienden al infinito en el eje vertical $Y$.
definiciones_clave: |
  - **Parábola**: Curva plana, abierta y simétrica formada por el conjunto de puntos $(x, f(x))$ que satisfacen una función de segundo grado.
propiedades_relaciones: |
  - **Criterio de la recta vertical**: Cualquier recta vertical interseca a la parábola en exactamente un punto del plano.
ejemplo_guiado:
  enunciado: 'Identifica cuál de las siguientes opciones describe la gráfica de la función $f(x) = -2x^2 + 8x - 3$.'
  pasos:
    - 'Paso 1: Identificar el grado de la función: el exponente máximo de $x$ es 2, por lo que es una función cuadrática.'
    - 'Paso 2: Reconocer la curva geométrica asociada: toda función cuadrática tiene como gráfica una parábola.'
    - 'Paso 3: Analizar la concavidad: como $a = -2 < 0$, es una parábola que se abre hacia abajo.'
    - 'Paso 4: Concluir que la gráfica es una parábola con concavidad negativa.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué tipo de gráfica corresponde universalmente a una función cuadrática $f(x) = ax^2 + bx + c$ con $a \neq 0$?'
    choices:
      - {text: 'Una curva continua y simétrica llamada parábola', is_correct: true}
      - {text: 'Una línea recta inclinada.', is_correct: false}
      - {text: 'Una circunferencia cerrada.', is_correct: false}
      - {text: 'Una curva en forma de S de tercer grado.', is_correct: false}
    explanation: 'La alternativa correcta es ''Una curva continua y simétrica llamada parábola''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Por qué la gráfica de $f(x) = x^2 - 4$ posee un eje de simetría vertical?'
    choices:
      - {text: 'Porque toda parábola posee un eje de simetría axial que pasa por su vértice', is_correct: true}
      - {text: 'Porque se trata de una recta que pasa por el origen.', is_correct: false}
      - {text: 'Porque sus ramas se cortan en dos puntos sobre el eje Y.', is_correct: false}
      - {text: 'Porque es una función exponencial creciente.', is_correct: false}
    explanation: 'La alternativa correcta es ''Porque toda parábola posee un eje de simetría axial que pasa por su vértice''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Comprobar que la expresión matemática tenga la forma cuadrática $ax^2 + bx + c$.'
  - 'Paso 2: Reconocer que su representación cartesiana $(x, y)$ forma una curva en forma de U.'
  - 'Paso 3: Localizar el eje de simetría y el vértice de la parábola.'
  - 'Paso 4: Trazar o identificar las ramas ascendentes o descendentes de la parábola.'
errores_correccion: |
  - **Error común:** Pensar que la gráfica de una función cuadrática puede ser una línea recta o un círculo.
  - **Cómo corregirlo:** La gráfica de una función de segundo grado **ES SIEMPRE UNA PARÁBOLA** abierta hacia arriba o hacia abajo.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Reconocimiento de gráfica cuadrática.
    alternativas:
      - 'Parábola abierta hacia arriba'
      - 'Línea recta'
      - 'Circunferencia'
    respuesta: 'Parábola abierta hacia arriba'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Simetría parabólica.
    alternativas:
      - 'Eje de simetría en x = 0'
      - 'Sin simetría'
      - 'Eje horizontal'
    respuesta: 'Eje de simetría en x = 0'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función cuadrática $f(x) = 3x^2 + 1$, es correcto afirmar que su representación gráfica es una línea recta.'
  - 'La gráfica de una función de segundo grado forma una figura geométrica cerrada simétrica respecto al origen.'
  - 'Trazar la gráfica de una parábola mediante segmentos rectos con esquinas en los puntos calculados.'
  - 'La suposición de que las dos ramas de una parábola pueden abrirse hacia lados opuestos en el plano.'
  - 'La equiparación del eje de simetría vertical de la parábola con una asíntota vertical que impide el dominio real.'
afirmaciones_verdaderas:
  - 'La representación gráfica de cualquier función cuadrática en el plano cartesiano es una parábola continua y simétrica.'
  - 'El eje de simetría de una parábola funcional es siempre una recta vertical de ecuación $x = -b / (2a)$.'
al_terminar_debes_poder: |
  QUÉ: Reconocer la parábola como la representación gráfica propia de la función cuadrática.
  CÓMO: Identificar la forma de U, verificar su continuidad, simetría axial y distinguirla de rectas o curvas de otro grado.
