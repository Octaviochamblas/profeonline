semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.PARABOLA
resumen_inicial: 'La representación gráfica de cualquier función cuadrática en el plano cartesiano es una curva suave y simétrica denominada parábola, caracterizada por un eje de simetría vertical y un único punto extremo llamado vértice.'
explicacion_simple: |
  Cuando dibujamos los pares ordenados $(x, f(x))$ de una función cuadrática en el plano cartesiano, la figura resultante no es una recta continua ni una curva irregular, sino una curva en forma de "U" o de "∩" llamada parábola. Esta figura posee una línea vertical invisible llamada eje de simetría que divide la curva en dos ramas idénticas reflejadas como frente a un espejo.
explicacion_formal: |
  ### Definición formal
  La **parábola** es el lugar geométrico de los puntos del plano $P(x, y)$ que satisfacen la ecuación cuadrática $y = ax^2 + bx + c$, con $a \neq 0$.

  ### Desglose simbólico
  - $V(h, k)$: **Vértice**. Punto de inflexión donde la función cambia su comportamiento de creciente a decreciente (o viceversa).
  - $x = h = -\frac{b}{2a}$: **Eje de simetría**. Recta vertical que actúa como espejo axial de la parábola.
  - Ramas de la curva: Las dos curvas infinitas que se alejan lateral y verticalmente desde el vértice.

  ### Síntesis didáctica
  A diferencia de una recta cuya inclinación es uniforme, la parábola modifica la pendiente de sus tangentes de forma continua. La curva es perfectamente simétrica: cualquier punto de la parábola a una distancia $d$ a la izquierda del eje de simetría tiene exactamente la misma altura $y$ que el punto ubicado a la misma distancia $d$ a la derecha.
definiciones_clave: |
  - **Parábola**: Curva abierta de segundo grado simétrica respecto a un eje.
  - **Eje de simetría**: Recta vertical de ecuación $x = -\frac{b}{2a}$ que divide a la parábola en dos partes congruentes.
  - **Vértice**: Punto extremo $(h, k)$ donde la parábola alcanza su altura máxima o mínima.
propiedades_relaciones: |
  - **Simetría axial de puntos**: Si $(h - d, y_1)$ pertenece a la parábola, entonces $(h + d, y_1)$ también pertenece a la parábola.
  - **Diferencia con curvas de grado superior**: Una parábola cuadrática posee exactamente una curva de giro (un vértice), a diferencia de polinomios de grado 3 o superior que pueden presentar múltiples inflexiones.
ejemplo_guiado:
  enunciado: 'Para la parábola dada por la función $f(x) = x^2 - 4x + 3$, verifica la simetría de las alturas de los puntos $P_1(1, y_1)$ y $P_2(3, y_2)$ ubicados a distancia $d = 1$ del eje de simetría $x = 2$.'
  pasos:
    - 'Paso 1: Calculamos la abscisa del eje de simetría: $h = -\frac{b}{2a} = -\frac{-4}{2(1)} = 2$.'
    - 'Paso 2: Evaluamos la función en $x = 1$ (un punto a la izquierda del eje): $f(1) = (1)^2 - 4(1) + 3 = 1 - 4 + 3 = 0$, obteniendo $P_1(1, 0)$.'
    - 'Paso 3: Evaluamos la función en $x = 3$ (un punto a la derecha del eje): $f(3) = (3)^2 - 4(3) + 3 = 9 - 12 + 3 = 0$, obteniendo $P_2(3, 0)$.'
    - 'Paso 4: Comprobamos que $f(1) = f(3) = 0$, confirmando la simetría de la gráfica respecto a la recta $x = 2$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué elemento geométrico divide a la parábola en dos ramas congruentes reflejadas espectralmente?'
    choices:
      - {text: 'La recta vertical de ecuación $x = -\frac{b}{2a}$ llamada eje de simetría', is_correct: true}
      - {text: 'El eje de las abscisas (eje $x$)', is_correct: false}
      - {text: 'La recta horizontal que pasa por el origen $(0,0)$', is_correct: false}
      - {text: 'La bisectriz del primer cuadrante', is_correct: false}
    explanation: 'La alternativa correcta es ''La recta vertical de ecuación $x = -\frac{b}{2a}$ llamada eje de simetría''. Esta recta actúa como espejo vertical de la parábola.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la parábola con eje de simetría en $x = -1$, si el punto $(-3, 5)$ pertenece a la curva, ¿qué otro punto pertenece obligatoriamente a la parábola por simetría?'
    choices:
      - {text: '$(1, 5)$', is_correct: true}
      - {text: '$(-1, 5)$', is_correct: false}
      - {text: '$(3, 5)$', is_correct: false}
      - {text: '$(1, -5)$', is_correct: false}
    explanation: 'La alternativa correcta es ''$(1, 5)$''. El punto $x = -3$ dista 2 unidades a la izquierda de $x = -1$. El punto a 2 unidades a la derecha es $x = -1 + 2 = 1$, manteniendo la ordenada $y = 5$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los coeficientes $a$, $b$ y $c$ de la función cuadrática.'
  - 'Paso 2: Calcular el eje de simetría $x = -\frac{b}{2a}$ para ubicar la línea vertical de simetría.'
  - 'Paso 3: Determinar pares de puntos equidistantemente alejados del eje de simetría para trazar la curva suave en forma de parábola.'
errores_correccion: |
  - **Error 1:** Dibujar las ramas de la parábola con trazos rectos en forma de "V". **Cómo corregirlo:** La función cuadrática cambia su pendiente de forma continua debido al término $x^2$, por lo que la gráfica es redondeada en el vértice y forma una curva suave "U".
  - **Error 2:** Suponer que el eje de simetría es siempre el eje $y$ ($x = 0$). **Cómo corregirlo:** El eje de simetría solo coincide con el eje $y$ cuando $b = 0$. En general se ubica en $x = -\frac{b}{2a}$.
ejemplos:
  - titulo: 'Identificación de simetría gráfica'
    enunciado: 'Si $f(x) = x^2 - 6x + 8$ tiene eje de simetría en $x = 3$, ¿cuál es el valor de $f(5)$ sabiendo que $f(1) = 3$?'
    alternativas:
      - '$f(5) = 3$'
      - '$f(5) = -3$'
      - '$f(5) = 0$'
    respuesta: '$f(5) = 3$'
    solucion_pasos:
      - '1. La distancia de $x = 1$ al eje $x = 3$ es de $|1 - 3| = 2$ unidades.'
      - '2. La distancia de $x = 5$ al eje $x = 3$ es también de $|5 - 3| = 2$ unidades.'
      - '3. Por simetría axial, $f(5) = f(1) = 3$.'
  - titulo: 'Forma geométrica de la gráfica'
    enunciado: '¿Cuál es la figura geométrica que representa la función $g(x) = -3x^2 + 2$ en el plano cartesiano?'
    alternativas:
      - 'Una parábola cóncava hacia abajo'
      - 'Una línea recta descendente'
      - 'Una circunferencia centrada en el origen'
    respuesta: 'Una parábola cóncava hacia abajo'
    solucion_pasos:
      - '1. La expresión es de segundo grado con $a = -3 < 0$.'
      - '2. La representación de toda función cuadrática es una parábola, y al ser $a < 0$, abre hacia abajo.'
  - titulo: 'Unicidad del vértice'
    enunciado: '¿Una parábola cuadrática en el plano real posee exactamente un solo vértice?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al ser un polinomio de segundo grado, la función presenta un único cambio de monotonía en el punto $V(h, k)$.'
  - titulo: 'Eje de simetría vertical'
    enunciado: '¿El eje de simetría de la gráfica de una función cuadrática de la forma $y = ax^2 + bx + c$ es siempre una recta vertical?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Al tratarse de una función en $x$, la simetría es siempre respecto a la recta vertical $x = -\frac{b}{2a}$.'
errores_frecuentes:
  - 'La gráfica de la función $f(x) = x^2$ está formada por dos segmentos rectilíneos inclinados que se unen en el origen.'
  - 'El eje de simetría de una parábola es una recta horizontal de ecuación $y = -\frac{b}{2a}$.'
  - 'Una parábola puede tener dos vértices si interseca dos veces al eje de las ordenadas.'
  - 'Las ramas de una parábola se cierran formando un óvalo cerrado en valores muy grandes de $x$.'
  - 'La distancia horizontal desde el eje de simetría hasta dos puntos de igual altura en la parábola es siempre diferente.'
afirmaciones_verdaderas:
  - 'Toda parábola correspondiente a una función cuadrática es simétrica respecto a una recta vertical que pasa por su vértice.'
  - 'Los puntos de una parábola situados a la misma distancia horizontal del eje de simetría poseen exactamente la misma ordenada $y$.'
al_terminar_debes_poder: 'Reconocer la estructura curva simétrica de la parábola e identificar la posición de su eje de simetría vertical en el plano cartesiano.'
