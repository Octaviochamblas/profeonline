semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.PARABOLA
resumen_inicial: 'Reconocimiento de la parábola como gráfica de una función cuadrática:
  parábola, vértice, concavidad y formas de Análisis gráfico: parábola, concavidad
  e intersecciones.'
explicacion_simple: A diferencia de la recta que representa a una función afín, toda
  función cuadrática se grafica siempre como una curva suave con forma de "U" (o "U"
  invertida).
explicacion_formal: '### Definición formal


  La gráfica de $f(x)=ax^2+bx+c$ (con $a\neq0$) es siempre una parábola: el lugar
  geométrico de los puntos $(x,f(x))$ para todo $x \in \mathbb{R}$. Esta curva es
  simétrica respecto a una recta vertical llamada eje de simetría, que pasa por su
  único punto extremo, el vértice.


  ### Desarrollo didáctico


  Reconocer que la gráfica siempre es una parábola permite anticipar su forma general
  antes de calcular puntos específicos: una curva suave, sin esquinas, simétrica,
  con un solo punto más alto o más bajo.


  La gráfica de $f(x)=x^2$ es la parábola más simple: una "U" con vértice en el origen
  $(0,0)$, simétrica respecto al eje $y$.'
definiciones_clave: '- **Reconocimiento de la parábola como gráfica de una función
  cuadrática**: Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  reconocimiento de la parábola como gráfica de una función cuadrática.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando reconocimiento
    de la parábola como gráfica de una función cuadrática.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a reconocimiento
    de la parábola como gráfica de una función cuadrática.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
