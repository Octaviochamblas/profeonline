semantic_id: MAT.ALG.FUNC_CUADR_GRAFICA.PARABOLA
resumen_inicial: La parábola es el lugar geométrico y representación gráfica en el plano cartesiano de toda función cuadrática $f(x) = ax^2 + bx + c$ ($a \neq 0$), caracterizada por una curvatura suave y simetría bilateral respecto a un eje vertical.
explicacion_simple: '![La parábola es el lugar geométrico y representación gráfica en el plano cartesiano de toda función cuadrática $f(x) = ax^2 + bx + c$ ($a \neq 0$), caracterizada por una curvatura suave y simetría bilateral respecto a un eje vertical](/static/img/nodos/reconocimiento-de-la-parabola-como-grafica-de-una-funcion-cuadratica-intro.svg)



  Cuando graficas cualquier función que tenga $x^2$, el dibujo que obtienes se llama **parábola**:


  - **¿Qué forma tiene?** Es una curva suave y continua con forma de "U" o de copa.

  - **Simetría perfecta:** Si doblas la hoja por la mitad verticalmente (por su eje de simetría), ambos lados coinciden como un espejo.

  - **El vértice:** Es la punta o cúspide de la curva (el punto más bajo o más alto).

  - **Sin esquinas:** La parábola no tiene puntas afiladas como una "V"; es completamente redondeada en su base.'
explicacion_formal: 'Sea $f: \mathbb{R} \to \mathbb{R}$ con $f(x) = ax^2 + bx + c$ ($a \neq 0$). Su gráfica cartesiana $\text{Gr}(f) = \{(x, y) \in \mathbb{R}^2 \mid y = f(x)\}$ define una sección cónica no degenerada denominada **parábola euclidiana** con directriz horizontal y eje focal vertical.


  **Elementos canónicos fundamentales**:

  1. **Vértice $V(x_v, y_v)$**: Punto singular extremal donde la derivada se anula ($f''(x_v) = 0$).

  2. **Eje de simetría**: Recta vertical invariante $\mathcal{L}: x = x_v = -\frac{b}{2a}$.

  3. **Curvatura constante**: Segunda derivada $\frac{d^2y}{dx^2} = 2a$ invariante en todo $\mathbb{R}$.'
definiciones_clave: '- **Parábola**: Curva abierta simétrica respecto a un eje vertical resultante de la gráfica de una función cuadrática.

  - **Vértice**: Punto extremo (máximo o mínimo) de la parábola donde cambia el sentido de crecimiento.'
propiedades_relaciones: '- **Unicidad de intersección vertical**: La parábola corta al eje $Y$ exactamente una vez.

  - **Simetría axial reflexiva**: Si $(x_v + h, y) \in \text{Gr}(f)$, entonces $(x_v - h, y) \in \text{Gr}(f)$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La parábola es el lugar geométrico y representación gráfica en el plano cartesiano de toda función cuadrática $f(x) = ax^2 + bx + c$ ($a \neq 0$), caracterizada por una curvatura suave y simetría bilateral respecto a un eje vertical](/static/img/nodos/reconocimiento-de-la-parabola-como-grafica-de-una-funcion-cuadratica-ejemplos.svg)



    Verifica si la curva dada por los puntos $(-1, 1)$, $(0, 0)$, $(1, 1)$, $(2, 4)$ corresponde a la parábola canónica $f(x) = x^2$.'
  pasos:
  - 'Paso 1: Evaluar cada abscisa en $f(x) = x^2$:

    - $f(-1) = (-1)^2 = 1 \implies (-1, 1)$.

    - $f(0) = 0^2 = 0 \implies (0, 0)$ (vértice en el origen).

    - $f(1) = 1^2 = 1 \implies (1, 1)$ (punto simétrico de $(-1, 1)$).

    - $f(2) = 2^2 = 4 \implies (2, 4)$.'
  - 'Paso 2: Concluir: Todos los puntos satisfacen la ecuación cuadrática $y = x^2$, describiendo una parábola con vértice en $(0, 0)$ y simetría respecto al eje $Y$ ($x = 0$).'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la figura geométrica que resulta siempre de graficar una función cuadrática en el plano cartesiano?
  choices:
  - text: Una parábola
    is_correct: true
  - text: Una línea recta
    is_correct: false
  - text: Una hipérbola
    is_correct: false
  - text: Una elipse
    is_correct: false
  explanation: La alternativa correcta es 'Una parábola'. La gráfica de toda función polinómica de grado 2 es una parábola.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Qué propiedad geométrica divide a la parábola en dos ramas perfectamente simétricas?
  choices:
  - text: El eje de simetría vertical x = -b/(2a)
    is_correct: true
  - text: El eje horizontal X
    is_correct: false
  - text: La recta tangente en el origen
    is_correct: false
  - text: El discriminante
    is_correct: false
  explanation: La alternativa correcta es 'El eje de simetría vertical x = -b/(2a)'. La recta vertical que pasa por el vértice es el eje de simetría especular de la parábola.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la función como cuadrática $f(x) = ax^2 + bx + c$ con $a \neq 0$.'
- 'Paso 2: Reconocer que su gráfica es una curva parabólica.'
- 'Paso 3: Determinar la concavidad según el signo de $a$.'
- 'Paso 4: Localizar el vértice y el eje de simetría vertical.'
- 'Paso 5: Trazar las ramas con curvatura uniforme.'
errores_correccion: '- **Error común:** Dibujar la parábola con trazos rectos en forma de "V" puntiaguda.

  - **Cómo corregirlo:** La base del vértice es **redondeada y suave**, nunca en ángulo agudo.'
ejemplos:
- titulo: 'Ejemplo 1: Identificación de curva gráfica'
  enunciado: ¿Qué curva geométrica representa la función $f(x) = -3x^2 + 5x$?
  alternativas:
  - Una parábola que abre hacia abajo
  - Una parábola que abre hacia arriba
  - Una recta descendente
  - Una hipérbola
  respuesta: Una parábola que abre hacia abajo
  solucion_pasos:
  - 'Paso 1: Grado 2 con $a = -3 < 0 \implies$ parábola cóncava hacia abajo.'
- titulo: 'Ejemplo 2: Simetría respecto al vértice'
  enunciado: Si una parábola tiene vértice en $x = 2$ y pasa por $(0, 5)$, ¿por qué otro punto pasa simétricamente?
  alternativas:
  - (4, 5)
  - (2, 5)
  - (-2, 5)
  - (0, -5)
  respuesta: (4, 5)
  solucion_pasos:
  - 'Paso 1: La distancia de 0 a 2 es 2 unidades. A la derecha: $2 + 2 = 4 \implies (4, 5)$.'
- titulo: 'Ejemplo 3: Parábola canónica invertida'
  enunciado: ¿Qué características tiene la gráfica de $f(x) = -x^2$?
  alternativas:
  - Parábola con vértice en (0,0) y ramas hacia abajo
  - Parábola con vértice en (0,0) y ramas hacia arriba
  - Recta horizontal
  - Circunferencia
  respuesta: Parábola con vértice en (0,0) y ramas hacia abajo
  solucion_pasos:
  - 'Paso 1: $a = -1 < 0, b = 0, c = 0 \implies V(0,0)$ con apertura hacia abajo.'
- titulo: 'Ejemplo 4: Continuidad en todo R'
  enunciado: ¿En qué puntos del plano se corta o interrumpe la gráfica de una parábola?
  alternativas:
  - En ningún punto, es continua en todo R
  - En el vértice
  - En los cortes con el eje X
  - En x = 0
  respuesta: En ningún punto, es continua en todo R
  solucion_pasos:
  - 'Paso 1: Toda función polinómica cuadrática es continua en todo $\mathbb{R}$.'
errores_frecuentes:
- Dibujar vértices en punta como valor absoluto.
- Asumir que las ramas se cierran o vuelven a juntarse.
- Confundir parábolas verticales con parábolas horizontales (que no son funciones de x).
afirmaciones_verdaderas:
- La gráfica cartesiana de toda función cuadrática real es una parábola.
- La parábola posee simetría axial respecto a la recta vertical x = -b/(2a).
al_terminar_debes_poder: '**QUÉ:** Reconocer la parábola como la gráfica representativa de una función cuadrática.


  **CÓMO:** Identificando sus elementos estructurales: curvatura suave, vértice extremal y eje de simetría vertical.


