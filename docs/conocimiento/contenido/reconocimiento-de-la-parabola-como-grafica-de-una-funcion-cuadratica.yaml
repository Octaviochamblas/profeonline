procedimiento:
- 'Paso 1: Verifica que la función sea cuadrática (con $a\neq0$).'
- 'Paso 2: Reconoce que su gráfica será necesariamente una parábola, sin importar
  los valores específicos de los coeficientes.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en reconocimiento de la parábola como gráfica de
  una función cuadrática.
ejemplos:
- titulo: Reconocimiento de la forma parabólica
  enunciado: ¿Qué forma tiene la gráfica de $f(x)=-2x^2+3x-1$?
  solucion_pasos:
  - Es una función cuadrática, con $a=-2 \neq 0$.
  - Su gráfica es una parábola.
- titulo: Comparación con una función afín
  enunciado: ¿La gráfica de $g(x)=4x-7$ es una parábola?
  solucion_pasos:
  - No es una función cuadrática, sino afín (de primer grado).
  - Su gráfica es una recta, no una parábola.
- titulo: ¿Toda parábola tiene exactamente un punto extremo?
  enunciado: ¿Toda parábola tiene exactamente un punto extremo?
  respuesta: Sí
  solucion_pasos:
  - Ese punto extremo es el vértice, que puede ser un máximo o un mínimo según la
    concavidad.
- titulo: ¿Puede la gráfica de una función cuadrática tener esquinas o quiebres?
  enunciado: ¿Puede la gráfica de una función cuadrática tener esquinas o quiebres?
  respuesta: 'No'
  solucion_pasos:
  - La parábola es una curva suave y continua en todos sus puntos, sin ningún quiebre
    ni esquina.
errores_frecuentes:
- Confundir la gráfica de una función cuadrática con la de una función afín (recta)
  o con otras curvas.
- Dibujar la parábola con esquinas en vez de una curva suave.
- Asumir que toda parábola tiene su vértice en el origen del plano.
- No reconocer que la simetría de la gráfica es una propiedad esencial de toda parábola.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  reconocimiento de la parábola como gráfica de una función cuadrática.
