semantic_id: MAT.FUND.TABLAS_VERDAD.TABLA_CONJUNCION
resumen_inicial: 'Estructura canónica de la tabla de verdad de la conjunción ($p \land q$), que contiene una única fila verdadera y tres filas falsas.'
explicacion_simple: |
  La **tabla de verdad de la conjunción** ($p \land q$) muestra todas las combinaciones posibles para dos afirmaciones unidas con "y". Como hay dos variables ($p$ y $q$), existen $4$ combinaciones posibles ($2^2 = 4$ filas). La columna del resultado solo tiene una fila con **Verdadero ($V$)**: la primera fila, donde tanto $p$ como $q$ son verdaderos. En las otras tres filas, como hay al menos un Falso, el resultado final es siempre **Falso ($F$)**.

  ![Infografía: Tabla de Verdad de la Conjunción](/static/img/nodos/tabla-de-verdad-de-la-conjuncion-intro.svg)
explicacion_formal: |
  ### Definición formal
  La **tabla de verdad de la conjunción binaria** es la matriz veritativo-funcional exhaustiva del operador $\land: \{V, F\}^2 \to \{V, F\}$:
  $$\begin{array}{|c|c|c|} \hline p & q & p \land q \\ \hline V & V & V \\ V & F & F \\ F & V & F \\ F & F & F \\ \hline \end{array}$$
  donde el vector columna de salida es $\mathbf{v}(p \land q) = [V, F, F, F]^T$.

  ### Desglose simbólico
  - Fila 1 ($V, V$): $V \land V = V$ (simultaneidad de verdad).
  - Fila 2 ($V, F$): $V \land F = F$ (segundo operando falso).
  - Fila 3 ($F, V$): $F \land V = F$ (primer operando falso).
  - Fila 4 ($F, F$): $F \land F = F$ (ambos operandos falsos).

  > **Complemento didáctico:** La conjunción posee una firma veritativa asimétrica con una tasa de éxito del $25\%$ ($1$ de $4$ filas), caracterizándose por ser altamente restrictiva.
definiciones_clave: |
  - **Tabla de verdad de la conjunción**: Matriz de 4 filas que detalla los valores de verdad del operador $\land$.
  - **Fila de verdad exclusiva**: Única fila (Fila 1) donde la conjunción produce el valor $V$.
  - **Vector de salida booleano**: Vector binario $[1, 0, 0, 0]$ asociado a la operación de conjunción.
propiedades_relaciones: |
  - **Simetría conmutativa en la tabla**: Las filas 2 ($V, F \mapsto F$) y 3 ($F, V \mapsto F$) arrojan resultados idénticos, reflejando que $p \land q \equiv q \land p$.
  - **Submatriz de evaluación**: Sirve como bloque fundamental para construir tablas de verdad complejas de orden $n \geq 2$.
ejemplo_guiado:
  enunciado: |
    Construye la tabla de verdad de la fórmula $(p \land q) \land \neg q$ y determina su vector de salida.

    ![Diagrama: Tabla de Verdad de la Conjunción](/static/img/nodos/tabla-de-verdad-de-la-conjuncion-ejemplos.svg)

  pasos:
    - 'Paso 1: Configurar las columnas de entrada para $p$ y $q$ ($4$ filas canónicas).'
    - 'Paso 2: Calcular la subcolumna $p \land q$: $[V, F, F, F]^T$.'
    - 'Paso 3: Calcular la subcolumna $\neg q$: Invertir la columna de $q$, obteniendo $[F, V, F, V]^T$.'
    - 'Paso 4: Evaluar la conjunción final $(p \land q) \land \neg q$:
      - Fila 1: $V \land F = F$
      - Fila 2: $F \land V = F$
      - Fila 3: $F \land F = F$
      - Fila 4: $F \land V = F$'
    - 'Paso 5: Concluir que el vector de salida es $[F, F, F, F]^T$, demostrando que la fórmula es una contradicción.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En la tabla de verdad canónica de $p \land q$, ¿cuántas filas tienen el valor Verdadero ($V$) en la columna de salida?'
    choices:
      - {text: 'Exactamente $1$ fila de las $4$ posibles', is_correct: true}
      - {text: 'Exactamente $2$ filas', is_correct: false}
      - {text: 'Exactamente $3$ filas', is_correct: false}
      - {text: 'Las $4$ filas completas', is_correct: false}
    explanation: 'La alternativa correcta es ''Exactamente $1$ fila de las $4$ posibles''. La conjunción solo es $V$ en la fila donde $p=V$ y $q=V$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿Qué valor de verdad tiene la tercera fila de la tabla de verdad canónica para $p \land q$ (donde $p=F$ y $q=V$)?'
    choices:
      - {text: 'Falso ($F$)', is_correct: true}
      - {text: 'Verdadero ($V$)', is_correct: false}
      - {text: 'Indefinido', is_correct: false}
      - {text: 'Tautológico', is_correct: false}
    explanation: 'La alternativa correcta es ''Falso ($F$)''. Al ser $p=F$, la conjunción resulta inmediatamente $F \land V = F$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Escribir las combinaciones canónicas de entrada para $p$ ($V, V, F, F$) y $q$ ($V, F, V, F$).'
  - 'Paso 2: Crear la columna de salida con el encabezado $p \land q$.'
  - 'Paso 3: Asignar $V$ únicamente en la fila donde ambas entradas sean $V$.'
  - 'Paso 4: Asignar $F$ en las tres filas restantes donde figure al menos un $F$.'
errores_correccion: |
  - **Error 1:** Llenar la columna de salida con tres $V$ y un $F$. **Cómo corregirlo:** La conjunción solo tiene un $V$ (en la primera fila) y tres $F$. La tabla que tiene tres $V$ corresponde a la disyunción inclusiva ($\lor$).
  - **Error 2:** Desordenar las combinaciones de entrada de $p$ y $q$. **Cómo corregirlo:** Mantener siempre el orden estándar: $p = (V, V, F, F)$ y $q = (V, F, V, F)$ para facilitar la lectura y corrección.
ejemplos:
  - titulo: 'Fila de verdad'
    enunciado: '¿En qué fila de la tabla canónica $p \land q$ es verdadero?'
    alternativas:
      - 'En la fila $1$ ($p=V, q=V$)'
      - 'En la fila $2$ ($p=V, q=F$)'
      - 'En la fila $4$ ($p=F, q=F$)'
    respuesta: 'En la fila $1$ ($p=V, q=V$)'
    solucion_pasos:
      - '1. La fila 1 contiene $V \land V = V$.'
  - titulo: 'Fila de doble falsedad'
    enunciado: '¿Cuánto vale $p \land q$ en la fila donde $p=F$ y $q=F$?'
    alternativas:
      - '$F$'
      - '$V$'
      - 'Indeterminado'
    respuesta: '$F$'
    solucion_pasos:
      - '1. $F \land F = F$.'
  - titulo: 'Porcentaje de verdad'
    enunciado: '¿El porcentaje de combinaciones verdaderas en la tabla de la conjunción es del 25%?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, 1 de cada 4 combinaciones es verdadera (25%).'
  - titulo: 'Invarianza conmutativa'
    enunciado: '¿La columna de $q \land p$ es exactamente igual a la columna de $p \land q$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, ambas generan el vector $[V, F, F, F]^T$.'
errores_frecuentes:
  - 'La afirmación de que la tabla de verdad de la conjunción presenta tres combinaciones verdaderas.'
  - 'La afirmación de que en la combinación $p=V$ y $q=F$ la conjunción resulta en valor verdadero.'
  - 'La afirmación de que la tabla de verdad de dos variables contiene $2$ filas en lugar de $4$.'
  - 'La afirmación de que la columna de salida de la conjunción es idéntica a la de la disyunción inclusiva.'
  - 'La afirmación de que en la fila $p=F$ y $q=F$ la conjunción produce una tautología.'
afirmaciones_verdaderas:
  - 'La tabla de verdad de la conjunción $p \land q$ consta de $4$ filas y genera el vector de salida canónico $[V, F, F, F]^T$.'
  - 'En la tabla de verdad de la conjunción, existe una única fila con resultado verdadero correspondiente a la asignación simultánea $p=V$ y $q=V$.'
al_terminar_debes_poder: |
  QUÉ: Construir y evaluar la tabla de verdad canónica de la conjunción ($p \land q$).
  CÓMO: Organizar las $4$ combinaciones de entrada y aplicar la regla de asignación restrictiva $[V, F, F, F]^T$.

  ![Cuadro resumen: Tabla de Verdad de la Conjunción](/static/img/nodos/tabla-de-verdad-de-la-conjuncion-resumen.svg)
