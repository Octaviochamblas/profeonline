semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNCENTRO_ACUTANGULO
resumen_inicial: En todo triángulo acutángulo (aquel cuyos tres ángulos interiores
  son menores que $90^\circ$), el circuncentro ($O$) se ubica estrictamente en el
  interior del triángulo.
explicacion_simple: '![Circuncentro en Acutángulo](/static/img/nodos/ubicacion-interior-del-circuncentro-en-un-triangulo-acutangulo-intro.svg)


  Cuando un triángulo tiene todas sus esquinas agudas (cerradas, menores de $90^\circ$):


  - **El centro queda adentro**: El punto $O$ donde se cruzan las 3 simetrales queda
  encerrado en el **interior** del triángulo.

  - **Ángulo central doble**: El ángulo que se forma en $O$ mirando hacia un lado
  mide el **doble** del ángulo del vértice de al frente ($\angle BOC = 2\angle A$).

  - **En el equilátero**: Los 4 puntos notables ($O, I, H, G$) se unen en el mismo
  punto central.

  '
explicacion_formal: '### Teorema formal

  En todo triángulo acutángulo $\Delta ABC$, el circuncentro $O$ se ubica estrictamente
  en el **interior** del triángulo:


  $$\max(\alpha, \beta, \gamma) < 90^\circ \implies O \in \operatorname{Int}(\Delta
  ABC)$$


  ### Desglose simbólico y geométrico

  - Ángulos centrales convexos: Cada lado subtiende un ángulo central $\angle BOC
  = 2\alpha < 180^\circ$, manteniendo al centro en el interior.

  - Simetría: Todas las distancias a los lados son positivas hacia el interior.


  ### Síntesis didáctica

  En triángulos acutángulos el centro de la circunferencia circunscrita reside confortablemente
  dentro del polígono.'
definiciones_clave: '- **Triángulo acutángulo**: Triángulo con tres ángulos interiores
  estrictamente agudos ($< 90^\circ$).

  - **Circuncentro interior**: Pertenencia del punto $O$ al interior de la región
  convexa del triángulo.

  - **Ángulo central**: Ángulo cuyo vértice es el centro $O$ y sus lados contienen
  a dos vértices del triángulo.

  '
propiedades_relaciones: '- **Pertenencia interior**: $\alpha, \beta, \gamma < 90^\circ
  \iff O \in \text{Int}(\Delta ABC)$.

  - **Ángulo central doble**: $\angle BOC = 2\alpha$, $\angle AOC = 2\beta$, $\angle
  AOB = 2\gamma$.

  - **Equilátero**: Si $\alpha = \beta = \gamma = 60^\circ$, $O = I = H = G$ y $R
  = 2r$.

  '
ejemplo_guiado:
  enunciado: '![Ejemplo de Circuncentro en Acutángulo](/static/img/nodos/ubicacion-interior-del-circuncentro-en-un-triangulo-acutangulo-ejemplos.svg)


    En un triángulo acutángulo $ABC$, el ángulo en el vértice $A$ mide $65^\circ$.
    Determina la ubicación del circuncentro $O$ y calcula la medida del ángulo central
    $\angle BOC$.

    '
  pasos:
  - 'Paso 1: Identificar el tipo de triángulo: al ser acutángulo, el circuncentro
    $O$ se ubica en el interior.'
  - 'Paso 2: Aplicar el teorema del ángulo central: $\angle BOC = 2 \cdot \angle A$.'
  - 'Paso 3: Calcular el valor: $\angle BOC = 2 \times 65^\circ = 130^\circ$.'
  - 'Paso 4: Concluir que $O$ es interior y el ángulo $\angle BOC$ mide $130^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubica el circuncentro de un triángulo cuyos ángulos interiores
    miden 50°, 60° y 70°?
  choices:
  - text: En el interior del triángulo, porque es un triángulo acutángulo
    is_correct: true
  - text: En el exterior del triángulo
    is_correct: false
  - text: En el punto medio del lado mayor
    is_correct: false
  - text: En el vértice del ángulo de 70°
    is_correct: false
  explanation: El circuncentro se ubica en el interior del triángulo, porque es un
    triángulo acutángulo con todos sus ángulos menores a 90°.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si en un triángulo acutángulo el ángulo en el vértice A mide 40°, ¿cuánto
    mide el ángulo central ∠BOC en el circuncentro?
  choices:
  - text: $80^\circ$
    is_correct: true
  - text: $40^\circ$
    is_correct: false
  - text: $110^\circ$
    is_correct: false
  - text: $140^\circ$
    is_correct: false
  explanation: 'El ángulo central mide $80^\circ$, ya que es el doble del ángulo inscrito
    en el vértice A: $\angle BOC = 2 \times 40^\circ = 80^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que los tres ángulos interiores del triángulo sean menores a
  $90^\circ$.'
- 'Paso 2: Trazar las simetrales de los lados.'
- 'Paso 3: Marcar el circuncentro $O$ en el interior del triángulo.'
- 'Paso 4: Si se solicitan ángulos centrales, aplicar $\angle BOC = 2\angle A$.'
errores_correccion: No confundas el ángulo en el circuncentro ($2\alpha$) con el ángulo
  en el incentro ($90^\circ + \alpha/2$).
ejemplos:
- titulo: Ejemplo 1
  enunciado: En un triángulo acutángulo, el ángulo central $\angle AOB = 140^\circ$.
    ¿Cuánto mide el ángulo interior $\angle C$?
  alternativas:
  - $70^\circ$
  - $140^\circ$
  - $35^\circ$
  respuesta: $70^\circ$
  solucion_pasos:
  - $\angle C = \frac{\angle AOB}{2} = \frac{140^\circ}{2} = 70^\circ$.
- titulo: Ejemplo 2
  enunciado: En un triángulo equilátero de lado $6\text{ cm}$, ¿dónde se ubica el
    circuncentro $O$?
  alternativas:
  - En el centro exacto del triángulo, coincidiendo con $I, H$ y $G$
  - En el punto medio de la base
  - En el exterior del triángulo
  respuesta: En el centro exacto del triángulo, coincidiendo con $I, H$ y $G$
  solucion_pasos:
  - El equilátero es un polígono regular donde baricentro, ortocentro, incentro y
    circuncentro coinciden en un único centro.
- titulo: ¿El circuncentro de un triángulo acutángulo está siempre en el interior?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una propiedad geométrica estricta de todos los triángulos acutángulos.
- titulo: ¿En un triángulo acutángulo el ángulo en el circuncentro mide 90° + α/2?
  respuesta: 'No'
  solucion_pasos:
  - No, esa es la fórmula del incentro. En el circuncentro el ángulo central mide
    exactamente el doble ($2\alpha$).
errores_frecuentes:
- Confundir la fórmula del ángulo central ($2\alpha$) con la del incentro ($90^\circ
  + \alpha/2$).
- Creer que si un triángulo tiene ángulos cercanos a 90° el circuncentro se sale.
- Asumir que solo los triángulos equiláteros tienen circuncentro interior.
- Olvidar que los tres ángulos interiores deben sumar estrictamente 180°.
- Confundir circuncentro interior con baricentro.
afirmaciones_verdaderas:
- En todo triángulo acutángulo el circuncentro se ubica estrictamente en el interior.
- 'El ángulo central subtendido desde el circuncentro es igual al doble del ángulo
  del vértice opuesto: $\angle BOC = 2\angle A$.'
al_terminar_debes_poder: '**QUÉ:** Identificar y calcular propiedades del circuncentro
  en triángulos acutángulos.


  **CÓMO:** Verificando la condición de ángulos agudos ($\alpha, \beta, \gamma < 90^\circ$),
  situando $O \in \text{Interior}$ y aplicando el teorema del ángulo central ($\angle
  BOC = 2\angle A$).


  ![Resumen de Circuncentro en Acutángulo](/static/img/nodos/ubicacion-interior-del-circuncentro-en-un-triangulo-acutangulo-resumen.svg)

  '
