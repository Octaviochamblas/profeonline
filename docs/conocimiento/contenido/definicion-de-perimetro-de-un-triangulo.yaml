semantic_id: MAT.GEO.TRIANGULOS_METRICA.PERIMETRO_DEFINICION
resumen_inicial: 'El perímetro de un triángulo es la medida métrica de su contorno
  cerrado, equivalente a la suma escalar de las longitudes de sus tres lados: P =
  a + b + c.'
explicacion_simple: '![Definición de Perímetro](/static/img/nodos/definicion-de-perimetro-de-un-triangulo-intro.svg)


  El **perímetro** de un triángulo es como poner una cuerda alrededor de toda la figura:
  es **la distancia total que recorres si caminas por las tres orillas**. Para calcularlo,
  simplemente **sumas las medidas de sus tres lados** ($P = a + b + c$). Como es una
  distancia recta, se mide en centímetros ($\text{cm}$) o metros ($\text{m}$), ¡nunca
  en centímetros cuadrados!'
explicacion_formal: '### Definición formal

  El **perímetro** $P$ de un triángulo $\Delta ABC$ es la medida escalar lineal total
  de su contorno cerrado, definida como la suma de las longitudes de sus tres lados:


  $$P = a + b + c = AB + BC + CA$$


  $$s = \frac{P}{2} = \frac{a + b + c}{2} \quad (\text{Semiperímetro})$$


  ### Desglose simbólico y geométrico

  - $P$: Perímetro total en unidades lineales de longitud ($[L]$).

  - $s$: Semiperímetro del triángulo, variable central en la fórmula de Herón para
  el área ($A = \sqrt{s(s-a)(s-b)(s-c)}$) y en el radio inscrito ($A = r \cdot s$).


  ### Síntesis didáctica

  El perímetro cuantifica la longitud total necesaria para rodear o cercar el triángulo
  y es la magnitud base para calcular el semiperímetro.'
definiciones_clave: '- **Perímetro**: Longitud total de la frontera de un polígono
  ($P = a + b + c$).

  - **Magnitud unidimensional**: Medida de longitud lineal expresada en unidades simples
  ($\text{m}, \text{cm}, \text{mm}$).

  - **Semiperímetro**: La mitad del perímetro, $s = P/2 = \frac{a+b+c}{2}$, fundamental
  en la fórmula de Herón. '
propiedades_relaciones: '- **Diferencia con el área**: El perímetro mide la frontera
  exterior (cerca), mientras que el área mide la superficie interior encerrada (terreno).

  - **Semiperímetro y radio inscrito**: El área del triángulo se relaciona con el
  perímetro mediante $A = r \cdot s$, donde $r$ es el inradio y $s = P/2$. '
ejemplo_guiado:
  enunciado: '![Ejemplo de Perímetro](/static/img/nodos/definicion-de-perimetro-de-un-triangulo-ejemplos.svg)


    Un parque tiene forma triangular con lados que miden $15\text{ m}$, $22\text{
    m}$ y $19\text{ m}$. Si se desea colocar una reja protectora alrededor de todo
    su perímetro, ¿cuántos metros de reja se necesitan?'
  pasos:
  - 'Paso 1: Identificar las longitudes de los tres lados: $a = 15\text{ m}$, $b =
    22\text{ m}$, $c = 19\text{ m}$.'
  - 'Paso 2: Comprobar que todas las medidas están en la misma unidad ($\text{m}$).'
  - 'Paso 3: Plantear la fórmula del perímetro: $P = a + b + c$.'
  - 'Paso 4: Sumar las tres cantidades: $P = 15 + 22 + 19 = 56\text{ m}$.'
  - 'Paso 5: Concluir que se necesitan exactamente $56\text{ metros}$ lineales de
    reja.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la definición métrica del perímetro de un triángulo?
  choices:
  - text: La suma de las longitudes de sus tres lados (longitud del contorno)
    is_correct: true
  - text: La multiplicación de la base por la altura
    is_correct: false
  - text: La superficie total interior en centímetros cuadrados
    is_correct: false
  - text: La suma de sus tres ángulos interiores
    is_correct: false
  explanation: Por definición geométrica, el perímetro es la suma de las longitudes
    de sus tres lados (longitud del contorno).
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué unidades se expresa correctamente el perímetro de un triángulo?
  choices:
  - text: En unidades lineales como centímetros (cm) o metros (m)
    is_correct: true
  - text: En unidades cuadradas como cm^2 o m^2
    is_correct: false
  - text: En grados sexagesimales (°)
    is_correct: false
  - text: En unidades cúbicas como cm^3
    is_correct: false
  explanation: Al ser una longitud unidimensional, se expresa en unidades lineales
    como centímetros (cm) o metros (m).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Medir o registrar las longitudes de los 3 lados del triángulo.'
- 'Paso 2: Convertir todas las medidas a una misma unidad si fuera necesario.'
- 'Paso 3: Sumar las tres medidas: $P = a + b + c$.'
- 'Paso 4: Acompañar el resultado numérico con la unidad de longitud correspondiente.'
errores_correccion: 'No confundas perímetro con área: el perímetro es la longitud
  del borde y se expresa en unidades simples (cm, m), no al cuadrado.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si los lados de un triángulo miden $8\text{ cm}, 11\text{ cm}$ y $13\text{
    cm}$, ¿cuál es su perímetro?
  alternativas:
  - $32\text{ cm}$
  - $32\text{ cm}^2$
  - $1144\text{ cm}$
  respuesta: $32\text{ cm}$
  solucion_pasos:
  - $P = 8 + 11 + 13 = 32\text{ cm}$.
- titulo: Ejemplo 2
  enunciado: ¿Qué representa físicamente el perímetro de un terreno triangular?
  alternativas:
  - La cantidad de alambre necesaria para cercar todo el borde del terreno
  - La cantidad de pasto necesaria para cubrir toda la superficie
  - La altura del cerro más alto
  respuesta: La cantidad de alambre necesaria para cercar todo el borde del terreno
  solucion_pasos:
  - El cerco recorre el contorno exterior, lo cual corresponde a la definición de
    perímetro.
- titulo: ¿El perímetro de un triángulo con lados 5 cm, 5 cm y 5 cm es 15 cm?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5 + 5 + 5 = 15\text{ cm}$.
- titulo: ¿El perímetro de un triángulo se mide en centímetros cuadrados?
  respuesta: 'No'
  solucion_pasos:
  - No, se mide en centímetros lineales ($\text{cm}$).
errores_frecuentes:
- Confundir perímetro con área.
- Escribir unidades cuadradas ($\text{cm}^2$) para el perímetro.
- Multiplicar los lados ($a \cdot b \cdot c$) en vez de sumarlos.
- Sumar medidas que están en unidades diferentes sin convertirlas previamente ($5\text{
  cm} + 2\text{ m}$).
- Confundir semiperímetro ($s = P/2$) con perímetro ($P$).
afirmaciones_verdaderas:
- El perímetro de un triángulo es la suma de las longitudes de sus tres lados.
- El perímetro es una magnitud unidimensional que se expresa en unidades lineales.
al_terminar_debes_poder: '**QUÉ:** Definir y comprender el concepto métrico de perímetro
  en triángulos.


  **CÓMO:** Identificando el contorno cerrado del triángulo y expresándolo en unidades
  lineales mediante la suma $P = a + b + c$.


  ![Resumen de Definición de Perímetro](/static/img/nodos/definicion-de-perimetro-de-un-triangulo-resumen.svg)'
