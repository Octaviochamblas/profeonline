semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.COMPARACION_BASE_TRANSFORMADA
resumen_inicial: 'Comparación integral entre las funciones trigonométricas base $y = \sin(x)$ / $y = \cos(x)$ y sus transformadas generales.'
explicacion_simple: |
  Para dominar el análisis de ondas, debemos comparar la **función base** limpia (como $y = \sin(x)$) con la **función transformada** (como $y = -3\sin(2x - \pi) + 4$). Al ponerlas lado a lado, evaluamos los 4 cambios: 1) ¿Se estiró o aplastó verticalmente? (Amplitud $|A|$ vs 1), 2) ¿Se invirtió de cabeza? (Signo de $A$), 3) ¿Se apretó o estiró horizontalmente? (Período $T = \frac{2\pi}{|B|}$ vs $2\pi$), 4) ¿Se corrió de lado o subió de nivel? (Desfase $-\frac{C}{B}$ y Línea media $y = D$).
explicacion_formal: |
  ### Definición formal
  La **comparación analítica y geométrica** entre la función armónica base $f_0(x) = \sin(x)$ (o $\cos(x)$) y su versión general transformada $f(x) = A\sin(Bx + C) + D$ se sistematiza mediante la matriz de parámetros de transformación:

  $$\begin{array}{|c|c|c|}
  \hline
  \text{Propiedad} & \text{Función Base } y = \sin(x) & \text{Función Transformada } y = A\sin(Bx+C)+D \\
  \hline
  \text{Amplitud} & 1 & |A| \\
  \hline
  \text{Período } T & 2\pi & \frac{2\pi}{|B|} \\
  \hline
  \text{Frecuencia relativa} & 1 \text{ ciclo en } 2\pi & |B| \text{ ciclos en } 2\pi \\
  \hline
  \text{Desfase horizontal} & 0 \text{ (origen en } 0) & x_0 = -\frac{C}{B} \\
  \hline
  \text{Línea media} & y = 0 \text{ (eje X)} & y = D \\
  \hline
  \text{Recorrido} & [-1, 1] & [D - |A|, D + |A|] \\
  \hline
  \end{array}$$

  ### Desglose simbólico
  - Transformaciones en Y (verticales): Afectan a la amplitud ($|A|$) y al desplazamiento de línea media ($D$).
  - Transformaciones en X (horizontales): Afectan a la frecuencia/período ($B$) y al desfase de origen ($C$).

  ### Síntesis didáctica
  Comparar término a término permite descomponer problemas complejos en pasos independientes: ajustar primero la altura vertical, escalar la frecuencia horizontal y finalmente trasladar el punto de origen al nuevo centro cartesiano.
definiciones_clave: |
  - **Función base / Canónica**: Representación simple fundamental $y = \sin(x)$ o $y = \cos(x)$ sin transformaciones.
  - **Transformación de funciones**: Proceso algebraico de aplicar escalamientos y traslaciones mediante constantes $A, B, C, D$.
  - **Matriz de propiedades**: Cuadro comparativo que relaciona los atributos de la curva original y de la curva modificada.
propiedades_relaciones: |
  - **Conservación topológica**: A pesar de los estiramientos y traslaciones, la sinusoide mantiene su suavidad continua y oscilación periódica.
  - **Reversibilidad algebraica**: Dada una gráfica cartesiana transformada, es posible deducir de forma única los parámetros $A, B, C, D$ para reconstruir su ecuación.
ejemplo_guiado:
  enunciado: 'Compara la función base $y = \cos(x)$ con la función transformada $g(x) = -2\cos\left(3x - \frac{\pi}{2}\right) + 1$ e indica los cuatro cambios clave.'
  pasos:
    - 'Paso 1: Cambio de Amplitud y Orientación: $A = -2 \implies$ Amplitud estirada al doble ($|A| = 2$) e **invertida verticalmente** ($A < 0$).'
    - 'Paso 2: Cambio de Período: $B = 3 \implies$ Período comprimido a $T = \frac{2\pi}{3}$ (3 ciclos completos en $2\pi$).'
    - 'Paso 3: Desfase Horizontal: $x_0 = -\frac{-\pi/2}{3} = \frac{\pi}{6} \implies$ Trasladada $\frac{\pi}{6}$ unidades a la **derecha**.'
    - 'Paso 4: Desplazamiento Vertical: $D = 1 \implies$ Línea media elevada a $y = 1$, con recorrido en $[-1, 3]$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al comparar $y = \sin(x)$ con $y = 3\sin(2x)$, ¿cuáles son los cambios exactos en amplitud y período?'
    choices:
      - {text: 'La amplitud se triplica ($3$) y el período se reduce a la mitad ($\pi$)', is_correct: true}
      - {text: 'La amplitud se reduce a un tercio y el período se duplica ($4\pi$)', is_correct: false}
      - {text: 'La amplitud pasa a ser $2$ y el período pasa a ser $3\pi$', is_correct: false}
      - {text: 'Ambos atributos permanecen exactamente iguales a la función base', is_correct: false}
    explanation: 'La alternativa correcta es ''La amplitud se triplica ($3$) y el período se reduce a la mitad ($\pi$)''. $|A|=3$ estira la altura al triple y $B=2$ comprime el período a $T=\frac{2\pi}{2}=\pi$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al comparar la función base $y = \cos(x)$ con $y = \cos(x) - 4$, ¿qué atributo de la gráfica se ha modificado?'
    choices:
      - {text: 'Únicamente el desplazamiento vertical y el recorrido, bajando $4$ unidades', is_correct: true}
      - {text: 'Únicamente el período horizontal, acortándolo en $4$ unidades', is_correct: false}
      - {text: 'La amplitud, multiplicándose por $4$', is_correct: false}
      - {text: 'El desfase horizontal, moviéndola $4$ unidades a la izquierda', is_correct: false}
    explanation: 'La alternativa correcta es ''Únicamente el desplazamiento vertical y el recorrido, bajando $4$ unidades''. La constante $D = -4$ desplaza toda la curva hacia abajo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar la función base de referencia ($\sin x$ o $\cos x$).'
  - 'Paso 2: Extraer los 4 parámetros de la función transformada ($A, B, C, D$).'
  - 'Paso 3: Calcular los valores numéricos correspondientes: Amplitud $|A|$, Período $T = \frac{2\pi}{|B|}$, Desfase $x_0 = -\frac{C}{B}$ y Línea media $y = D$.'
  - 'Paso 4: Describir cualitativamente los cambios respecto a la función base (estiramientos, reflexiones y traslaciones).'
errores_correccion: |
  - **Error 1:** Evaluar las transformaciones en un orden erróneo sin considerar la multiplicación del parámetro $B$. **Cómo corregirlo:** Para hallar el desfase real se debe considerar el factor $B$ en la división $x_0 = -\frac{C}{B}$, o factorizar $B(x - x_0)$.
  - **Error 2:** Creer que las transformaciones horizontales y verticales se afectan mutuamente. **Cómo corregirlo:** Las transformaciones horizontales ($B, C$) actúan de forma independiente sobre el eje X, mientras que las verticales ($A, D$) actúan independientemente sobre el eje Y.
ejemplos:
  - titulo: 'Comparación de amplitudes'
    enunciado: '¿En qué se diferencian las gráficas de $y = \sin(x)$ e $y = 5\sin(x)$?'
    alternativas:
      - 'En la altura vertical: la segunda alcanza crestas de $5$ y valles de $-5$'
      - 'En la longitud horizontal: la segunda es 5 veces más larga'
      - 'En la línea media: la segunda está elevada $5$ unidades'
    respuesta: 'En la altura vertical: la segunda alcanza crestas de $5$ y valles de $-5$'
    solucion_pasos:
      - '1. Tienen el mismo período $2\pi$ y la misma línea media $y = 0$.'
      - '2. La diferencia es la amplitud: $1$ frente a $5$.'
  - titulo: 'Comparación de frecuencias'
    enunciado: '¿En el espacio donde $\sin(x)$ realiza $1$ ciclo, cuántos ciclos realiza $\sin(4x)$?'
    alternativas:
      - '4 ciclos completos'
      - '2 ciclos completos'
      - '1/4 de ciclo'
    respuesta: '4 ciclos completos'
    solucion_pasos:
      - '1. El coeficiente $B = 4$.'
      - '2. La función transformada realiza 4 ciclos en $2\pi$.'
  - titulo: 'Reflexión y elevación'
    enunciado: '¿La función $y = -\cos(x) + 2$ está invertida y elevada 2 unidades respecto a $\cos(x)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, $A = -1$ invierte la curva y $D = 2$ la eleva 2 unidades.'
  - titulo: 'Independencia de ejes'
    enunciado: '¿Alterar la amplitud $A$ modifica en algo la posición horizontal del desfase $x_0$?'
    respuesta: 'No'
    solucion_pasos:
      - 'No, las transformaciones en Y y en X son geométricamente independientes.'
errores_frecuentes:
  - 'La afirmación de que en $y = A\sin(Bx + C) + D$ las transformaciones verticales modifican la longitud del período horizontal.'
  - 'La afirmación de que la función $y = 2\sin(x)$ se mueve 2 unidades hacia arriba sobre el eje Y.'
  - 'La afirmación de que la función $y = \sin(x + \pi)$ tiene un período distinto al de la función base $y = \sin(x)$.'
  - 'La afirmación de que al comparar $y = \cos(x)$ con $y = -\cos(x)$ ambas gráficas lucen exactamente iguales.'
  - 'La afirmación de que el parámetro $B$ modifica el valor numérico de la línea media.'
afirmaciones_verdaderas:
  - 'La comparación entre la función trigonométrica base y su versión transformada $A\sin(Bx + C) + D$ permite separar las modificaciones en estiramientos/compresiones ($A, B$) y traslaciones rígidas ($C, D$).'
  - 'Las transformaciones aplicadas sobre el eje vertical Y (amplitud $|A|$ y línea media $D$) son rigurosamente independientes de las transformaciones aplicadas sobre el eje horizontal X (período $T$ y desfase $x_0$).'
al_terminar_debes_poder: |
  QUÉ: Comparar integradamente una función trigonométrica base con su versión transformada $A\sin(Bx + C) + D$.
  CÓMO: Contrastar ordenadamente la amplitud $|A|$, el período $T = \frac{2\pi}{|B|}$, el desfase $x_0 = -\frac{C}{B}$ y la línea media $y = D$.
