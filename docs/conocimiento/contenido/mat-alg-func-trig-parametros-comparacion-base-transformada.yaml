procedimiento:
- 'Paso 1: Identifica los cuatro parámetros $a$, $b$, $c$ y $d$ en la forma general.'
- 'Paso 2: Calcula la amplitud, el periodo, el desfase y la línea media.'
- 'Paso 3: Describe la combinación completa de transformaciones respecto a la función
  básica.'
errores_correccion: Evita usar la calculadora en grados sexagesimales cuando el argumento
  de la función trigonométrica está expresado en radianes en comparación entre una
  función trigonométrica base y su transformación gráfica.
ejemplos:
- titulo: Descripción integral de una transformación del seno
  enunciado: Describe todas las transformaciones de $f(x)=4\sin(2(x-\pi/4))-3$ respecto
    a $\sin(x)$.
  solucion_pasos:
  - Amplitud $4$, sin reflexión ($a>0$), periodo $2\pi/2=\pi$.
  - Desfase $\pi/4$ a la derecha, línea media $y=-3$.
- titulo: Descripción integral con reflexión
  enunciado: Describe todas las transformaciones de $f(x)=-0{,}5\cos(4x)+2$ respecto
    a $\cos(x)$.
  solucion_pasos:
  - Amplitud $0{,}5$, con reflexión ($a<0$), periodo $2\pi/4=\pi/2$.
  - Sin desfase horizontal ($c=0$), línea media $y=2$.
- titulo: ¿Es posible que una función trigonométrica tenga los cuatro parámetros distintos
    de sus valores básicos?
  enunciado: ¿Puede una función trigonométrica transformada tener simultáneamente
    amplitud, periodo, desplazamiento horizontal y vertical distintos de los valores
    básicos?
  respuesta: Sí
  solucion_pasos:
  - Los cuatro parámetros son independientes entre sí y pueden combinarse libremente.
- titulo: ¿El orden en que se analizan los parámetros afecta el resultado final de
    la gráfica?
  enunciado: ¿Cambia la gráfica final según el orden en que se analicen los parámetros
    $a$, $b$, $c$, $d$?
  respuesta: 'No'
  solucion_pasos:
  - La forma estándar combina los cuatro parámetros de manera consistente, sin importar
    el orden de análisis.
errores_frecuentes:
- Analizar solo algunos parámetros y omitir otros al describir la transformación completa.
- Declarar el efecto de cada parámetro entre sí.
- No factorizar correctamente antes de identificar $b$ y $c$.
- No verificar el resultado final evaluando la función en un punto de referencia.
afirmaciones_verdaderas:
- Las funciones seno y coseno tienen un recorrido $[-1, 1]$ y un período fundamental
  de $2\pi$.
al_terminar_debes_poder: Analizar, graficar y modelar fenómenos periódicos aplicando
  comparación entre una función trigonométrica base y su transformación gráfica.
