semantic_id: MAT.ALG.FUNC_TRIG_PARAMETROS.COMPARACION_BASE_TRANSFORMADA
resumen_inicial: 'Comparación entre una función trigonométrica base y su transformación
  gráfica: círculo unitario, amplitud, período y transformaciones de Parámetros y
  transformaciones de funciones periódicas.'
explicacion_simple: Ya conoces cada parámetro por separado; ahora se combinan todos
  para describir completamente cómo se transforma la función trigonométrica básica.
explicacion_formal: '### Definición formal


  La descripción completa de una función trigonométrica transformada requiere indicar:
  (1) la amplitud $|a|$; (2) si hay reflexión, cuando $a<0$; (3) el periodo $2\pi/|b|$;
  (4) el desplazamiento horizontal $c$; (5) la línea media $y=d$.


  ### Desarrollo didáctico


  Para $f(x)=-2\sin(3(x-\pi/6))+1$: amplitud $2$, reflexión (por $a<0$), periodo $2\pi/3$,
  desfase $\pi/6$ a la derecha, línea media $y=1$. Con esta información completa se
  puede trazar la gráfica sin necesidad de una tabla de valores extensa.'
definiciones_clave: '- **Comparación entre una función trigonométrica base y su transformación
  gráfica**: Función periódica fundamentada en las coordenadas del círculo unitario
  o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a comparación entre una función trigonométrica base y su transformación
  gráfica.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    comparación entre una función trigonométrica base y su transformación gráfica.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de comparación entre una función trigonométrica base y
    su transformación gráfica.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
