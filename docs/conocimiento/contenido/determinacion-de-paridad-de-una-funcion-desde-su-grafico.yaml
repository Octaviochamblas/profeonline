semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARIDAD_DESDE_GRAFICO
resumen_inicial: La determinación de paridad desde su gráfico reconoce patrones visuales de simetría axial respecto a $Y$ o puntual respecto a $(0,0)$.
explicacion_simple: |
  Para identificar la paridad de una función **mirando su gráfica en el plano cartesiano**:

  1. **Simetría de espejo respecto al eje vertical $Y$**: Si doblas la gráfica por la línea del eje $Y$ y ambas mitades coinciden perfectamente $\implies$ es una **FUNCIÓN PAR**.
  2. **Simetría de giro respecto al origen $(0,0)$**: Si giras la gráfica $180^\circ$ manteniendo fijo el centro $(0,0)$ y la forma queda idéntica $\implies$ es una **FUNCIÓN IMPAR**.
  3. **Sin simetría especial**: Si no cumple ninguna de las dos simetrías $\implies$ **NO TIENE PARIDAD**.
explicacion_formal: |
  El análisis visual de la paridad en la gráfica $G_f \subset \mathbb{R}^2$ de una función se rige por dos criterios geométricos fundamentales de transformaciones isométricas:

  1. **Criterio de Reflexión Axial (Función Par):**
     $$G_f = R_Y(G_f) \iff (x, y) \in G_f \implies (-x, y) \in G_f$$
     donde $R_Y$ es la reflexión respecto al eje de las ordenadas $x = 0$.

  2. **Criterio de Rotación Puntual (Función Impar):**
     $$G_f = R_{(0,0)}(G_f) \iff (x, y) \in G_f \implies (-x, -y) \in G_f$$
     donde $R_{(0,0)}$ es la simetría central respecto al origen de coordenadas.
definiciones_clave: |
  - **Reconocimiento gráfico de paridad**: Identificación visual de la paridad de una función observando sus propiedades de simetría geométrica en el plano.
propiedades_relaciones: |
  - **Asimetría respecto al eje X**: La gráfica de una función bien definida (no nula) NO puede ser jamás simétrica respecto al eje horizontal $X$, ya que violaría la prueba de la línea vertical.
ejemplo_guiado:
  enunciado: 'Observa un gráfico que pasa por los puntos $(-3, 9)$, $(0, 0)$ y $(3, 9)$. Determina qué tipo de simetría presenta y clasifica su paridad.'
  pasos:
    - 'Paso 1: Analizar las coordenadas de los puntos: para $x = 3 \implies y = 9$ y para $x = -3 \implies y = 9$.'
    - 'Paso 2: Observar la relación de puntos: se cumple la forma $(x, y) \to (-x, y)$.'
    - 'Paso 3: Identificar la simetría: las imágenes son idénticas ante cambios de signo de la entrada $\implies$ simetría axial respecto al eje $Y$.'
    - 'Paso 4: Concluir que el gráfico corresponde a una función PAR.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué tipo de simetría geométrica caracteriza visualmente a la gráfica de una función PAR?'
    choices:
      - {text: 'Simetría especular respecto al eje vertical Y.', is_correct: true}
      - {text: 'Simetría puntual respecto al origen $(0,0)$.', is_correct: false}
      - {text: 'Simetría respecto al eje horizontal X.', is_correct: false}
      - {text: 'Simetría respecto a la recta $y = 10$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Simetría especular respecto al eje vertical Y.''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'Si la gráfica de una función pasa por $(-2, 8)$ y por $(2, -8)$, ¿qué tipo de simetría se observa?'
    choices:
      - {text: 'Simetría respecto al origen $(0,0)$ (función IMPAR).', is_correct: true}
      - {text: 'Simetría respecto al eje Y (función PAR).', is_correct: false}
      - {text: 'Sin simetría cartesiana.', is_correct: false}
      - {text: 'Simetría respecto a la recta $y = x$.', is_correct: false}
    explanation: 'La alternativa correcta es ''Simetría respecto al origen $(0,0)$ (función IMPAR).''.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Seleccionar puntos $(x_1, y_1)$ de la gráfica en el primer cuadrante.'
  - 'Paso 2: Verificar la existencia del punto $(-x_1, y_1)$ para probar paridad (espejo en eje $Y$).'
  - 'Paso 3: Verificar la existencia del punto $(-x_1, -y_1)$ para probar imparidad (giro en origen).'
  - 'Paso 4: Declarar la paridad observada en el gráfico.'
errores_correccion: |
  - **Error común:** Confundir la simetría respecto al origen (impar) con la simetría respecto al eje $X$.
  - **Cómo corregirlo:** Ninguna función puede tener simetría respecto al eje $X$ porque **DEJARÍA DE SER FUNCIÓN** (una línea vertical la tocaría en 2 puntos).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones especiales.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones especiales.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Una función es par si su gráfica es simétrica respecto al eje horizontal de las abscisas (eje X).'
  - 'La gráfica de una función impar se refleja únicamente como un espejo horizontal sobre el eje X.'
  - 'Cualquier gráfica de una recta que pasa por el origen representa una función par.'
  - 'Una parábola desplazada horizontalmente con vértice en $(3,0)$ mantiene su simetría respecto al eje Y.'
  - 'Las gráficas de funciones sin paridad no pueden dibujarse en el plano cartesiano.'
afirmaciones_verdaderas:
  - 'La simetría respecto al eje de las ordenadas (eje $Y$) identifica gráficamente a las funciones pares.'
  - 'La simetría central o puntual respecto al origen de coordenadas $(0,0)$ identifica gráficamente a las funciones impares.'
al_terminar_debes_poder: |
  QUÉ: Determinar la paridad de una función observando su representación gráfica en el plano cartesiano.
  CÓMO: Identificar si existe simetría respecto al eje $Y$ (Par), al origen $(0,0)$ (Impar) o ausencia de simetría.
