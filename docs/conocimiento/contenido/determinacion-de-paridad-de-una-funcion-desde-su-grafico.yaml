semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARIDAD_DESDE_GRAFICO
resumen_inicial: 'Determinar la paridad desde un gráfico exige inspeccionar las simetrías
  visuales: eje $Y$ para paridad, origen $(0,0)$ para imparidad, o ninguna.'
explicacion_simple: 'Para saber la paridad mirando un gráfico en el plano cartesiano:

  - **Eje Y como espejo:** si la parte izquierda es idéntica a la derecha $\implies$
  **PAR**.

  - **Giro de $180^\circ$ alrededor del centro:** si al dar vuelta el gráfico queda
  igual $\implies$ **IMPAR**.

  - **Si no tiene ninguna de esas dos simetrías:** $\implies$ **SIN PARIDAD**.'
explicacion_formal: 'Dada la curva $G(f) \subset \mathbb{R}^2$, la **evaluación geométrica
  de paridad** aplica la prueba de transformaciones en $\mathbb{R}^2$:


  $$\text{Gráfico } G(f) = \begin{cases} R_{Y}(G(f)) & \implies \text{Función PAR}
  \\ R_{O}(G(f)) & \implies \text{Función IMPAR} \\ \text{Ninguna} & \implies \text{Sin
  Paridad} \end{cases}$$


  **Desglose de la fórmula:**

  - $R_Y$: Reflexión axial respecto al eje de ordenadas.

  - $R_O$: Inversión central respecto al origen de coordenadas.'
definiciones_clave: '- **Inspección geométrica de paridad**: Determinación visual
  inmediata del comportamiento simétrico de una curva en $\mathbb{R}^2$.'
propiedades_relaciones: '- **Desplazamiento horizontal**: Trasladar horizontalmente
  una función par elimina inmediatamente su paridad.'
ejemplo_guiado:
  enunciado: Un gráfico muestra una parábola con vértice en el punto $(3, 0)$. Determina
    su paridad geométrica.
  pasos:
  - 'Paso 1: Observar el eje de simetría de la parábola: pasa por la recta vertical
    $x = 3$.Paso 2: Verificar simetría con el eje $Y$ ($x = 0$): al estar desfasada
    a $x = 3$, el eje $Y$ NO es su espejo $\implies$ NO ES PAR.Paso 3: Verificar simetría
    con el origen $(0,0)$: girarla $180^\circ$ no la deja igual $\implies$ NO ES IMPAR.Paso
    4: Concluir que la parábola $y = (x - 3)^2$ es SIN PARIDAD.'
checkpoints:
- placement: after_explicacion_formal
  question: A partir del gráfico de la parábola con vértice en $(3, 0)$, ¿cuál es
    la paridad observada?
  choices:
  - text: Es una gráfica SIN PARIDAD.
    is_correct: true
  - text: Es una gráfica par.
    is_correct: false
  - text: Es una gráfica impar.
    is_correct: false
  - text: Es una línea constante.
    is_correct: false
  explanation: La alternativa correcta es 'Es una gráfica SIN PARIDAD.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué desplazar una parábola $y = x^2$ horizontalmente hacia la derecha
    rompe su paridad par?
  choices:
  - text: Porque su eje de simetría se aleja del eje Y.
    is_correct: true
  - text: Porque cambia la forma de la curva.
    is_correct: false
  - text: Porque se convierte en una función impar.
    is_correct: false
  - text: Porque deja de ser una función.
    is_correct: false
  explanation: La alternativa correcta es 'Porque su eje de simetría se aleja del
    eje Y.'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Comprobar si el eje $Y$ funciona como espejo reflejado idéntico.'
- 'Paso 2: Comprobar si al rotar el gráfico $180^\circ$ sobre $(0,0)$ la curva se
  superpone.'
- 'Paso 3: Clasificar la función en función del resultado visual.'
errores_correccion: '- **Error común:** Creer que toda parábola es una función par.

  - **Cómo corregirlo:** Una parábola es función par únicamente si su vértice está
  ubicado sobre el eje $Y$ (ejemplo: $y = x^2 + c$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de simetrías y funciones especiales.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de simetrías y funciones especiales.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función par cumple la identidad de simetría f(-x) = f(x)?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de función par con simetría en el eje Y.
- titulo: ¿La función parte entera [x] devuelve el mayor entero menor o igual a x?
  respuesta: Sí
  solucion_pasos:
  - Sí, es la definición de la función piso o parte entera.
errores_frecuentes:
- Confundir las funciones pares (simetría eje Y) con las funciones impares (simetría
  respecto al origen).
- Asumir que toda función real debe ser obligatoriamente par o impar, ignorando el
  caso sin paridad.
- Creer que una función impar o par debe tener coeficientes pares o impares respectivamente.
- 'Calcular la parte entera de números negativos truncando decimales en lugar de redondear
  al entero menor (ej: $[-1{,}2] = -2$).'
- Unir los escalones horizontales de la función parte entera con líneas verticales
  en lugar de dejarlos discontinuos.
afirmaciones_verdaderas:
- Una función es par si $f(-x) = f(x)$ (simétrica respecto al eje $Y$) e impar si
  $f(-x) = -f(x)$ (simétrica respecto al origen $(0,0)$).
- La función parte entera $f(x) = [x]$ asigna a cada real el mayor entero menor o
  igual a $x$, generando una gráfica escalonada discontinua.
al_terminar_debes_poder: Al finalizar este recurso podrás definir, analizar y clasificar
  simetrías de funciones pares e impares, así como graficar y aplicar la función parte
  entera en contextos de cobro por tramos y finanzas.
