semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARIDAD_DESDE_GRAFICO
resumen_inicial: 'Determinación de paridad de una función desde su gráfico: conceptos,
  representación y propiedades en Simetrías y funciones especiales.'
explicacion_simple: Con solo mirar el dibujo de una curva, puedes saber si es par
  (simetría de espejo), impar (simetría de giro) o ninguna de las dos (sin patrón
  de simetría especial).
explicacion_formal: '### Definición formal


  La simetría respecto al eje $y$ corresponde geométricamente a $f(-x)=f(x)$ (función
  par); la simetría respecto al origen corresponde a $f(-x)=-f(x)$ (función impar).
  Una gráfica que no exhibe ninguna de estas dos simetrías no representa una función
  par ni impar.


  ### Desarrollo didáctico


  El truco visual es comparar el lado izquierdo de la curva ($x<0$) con el lado derecho
  ($x>0$): si son un reflejo de espejo vertical, es par; si son un giro de $180°$,
  es impar; si no coinciden con ninguno de esos dos patrones, no es ninguna de las
  dos.


  El gráfico de $f(x)=x^2-2x$ no es simétrico respecto al eje $y$ ni respecto al origen:
  su vértice está desplazado del eje $y$, así que no es ni par ni impar.'
definiciones_clave: '- **Determinación de paridad de una función desde su gráfico**:
  Elemento central en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a determinación de paridad de una función
  desde su gráfico.'
