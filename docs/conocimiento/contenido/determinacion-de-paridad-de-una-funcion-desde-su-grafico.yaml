semantic_id: MAT.ALG.FUNCIONES_ESPECIALES.PARIDAD_DESDE_GRAFICO
resumen_inicial: La determinación de la paridad desde el gráfico consiste en identificar visualmente si la curva presenta simetría axial respecto al eje $Y$ (función par), simetría central respecto al origen (función impar) o ninguna de ellas.
explicacion_simple: '![La determinación de la paridad desde el gráfico consiste en identificar visualmente si la curva presenta simetría axial respecto al eje $Y$ (función par), simetría central respecto al origen (función impar) o ninguna de ellas](/static/img/nodos/determinacion-de-paridad-de-una-funcion-desde-su-grafico-intro.svg)



  Para determinar la paridad de una función mirando su gráfica:

  1. **Prueba 1 (¿Es Par?):** ¿El eje vertical $Y$ actúa como un espejo exacto? Si doblas la gráfica por el eje $Y$ y coincide $\implies$ **Es PAR**.

  2. **Prueba 2 (¿Es Impar?):** ¿Al girar la imagen $180^\circ$ boca abajo queda igual? ¿Pasa por $(0, 0)$ y se refleja cruzado? $\implies$ **Es IMPAR**.

  3. **Prueba 3 (¿Ninguna?):** Si no cumple ninguna de las dos simetrías $\implies$ **NO TIENE PARIDAD**.'
explicacion_formal: 'Sea $\Gamma = \text{Graf}(f) \subset \mathbb{R}^2$ la gráfica de una función real. La clasificación geométrica de paridad se define formalmente como:


  $$\text{Tipo} = \begin{cases} \text{Par} & \iff (x, y) \in \Gamma \iff (-x, y) \in \Gamma \quad (\text{Simetría axial eje } Y) \\ \text{Impar} & \iff (x, y) \in \Gamma \iff (-x, -y) \in \Gamma \quad (\text{Simetría central origen}) \\ \text{Sin paridad} & \iff \text{No satisface ninguna de las anteriores} \end{cases}$$


  **Pruebas rápidas de descarte:**

  - Si la curva corta al eje Y en un punto $(0, b)$ con $b \neq 0$, **no puede ser impar**.

  - Si la curva tiene un corte en el eje X en $(a, 0)$ y no tiene corte en $(-a, 0)$, **no puede ser ni par ni impar**.'
definiciones_clave: '- **Simetría par gráfica**: Reflejo especular respecto a la recta vertical $x = 0$.

  - **Simetría impar gráfica**: Invarianza bajo rotación de media vuelta en torno a $(0, 0)$.'
propiedades_relaciones: '- **Puntos simétricos**: Guía para trazar gráficas estudiando solo el semieje positivo $[0, +\infty[$ y reflejando.

  - **Conservación de áreas**: Las simetrías gráficas simplifican el cálculo de integrales y áreas en cálculo superior.'
ejemplo_guiado:
  enunciado: '![Ejemplo La determinación de la paridad desde el gráfico consiste en identificar visualmente si la curva presenta simetría axial respecto al eje $Y$ (función par), simetría central respecto al origen (función impar) o ninguna de ellas](/static/img/nodos/determinacion-de-paridad-de-una-funcion-desde-su-grafico-ejemplos.svg)



    Analiza la paridad de una gráfica que pasa por los puntos $(-3, 5)$, $(0, 0)$, $(3, -5)$, $(1, -2)$ y $(-1, 2)$.'
  pasos:
  - 'Paso 1: Observar el paso por el origen: contiene a $(0, 0)$.'
  - 'Paso 2: Comparar los pares opuestos:

    - Para $x = 3$: $(3, -5)$ y $(-3, 5)$ $\to$ coordenadas opuestas $(-x, -y)$.

    - Para $x = 1$: $(1, -2)$ y $(-1, 2)$ $\to$ coordenadas opuestas $(-x, -y)$.'
  - 'Paso 3: Descartar simetría par: $(3, -5)$ requeriría $(-3, -5)$, lo cual no se cumple.'
  - 'Paso 4: Confirmar simetría central respecto a $(0, 0)$.'
  - 'Paso 5: Concluir que la gráfica corresponde a una función impar.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una gráfica cartesiana es simétrica respecto al eje Y, ¿qué paridad tiene la función?
  choices:
  - text: Es una funcion par.
    is_correct: true
  - text: Es una funcion impar.
    is_correct: false
  - text: No tiene paridad.
    is_correct: false
  - text: Es biyectiva.
    is_correct: false
  explanation: La alternativa correcta es 'Es una funcion par.'. La simetría axial respecto a $x = 0$ define gráficamente a las funciones pares.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Una gráfica corta al eje Y en $(0, 4)$ y tiene simetría central respecto al origen. ¿Es esto posible?
  choices:
  - text: No, porque toda funcion impar definida en x = 0 debe pasar obligatoriamente por (0, 0).
    is_correct: true
  - text: Si, todas las funciones impares cortan en (0, 4).
    is_correct: false
  - text: Si, si corta tambien en (0, -4).
    is_correct: false
  - text: Depende de la pendiente.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque toda funcion impar definida en x = 0 debe pasar obligatoriamente por (0, 0).'. Cortar en $(0, 4)$ y $(0, -4)$ violaría la unicidad de imagen de función.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Observar si el gráfico tiene simetría de espejo respecto al eje vertical $Y$ (si la tiene, es par).'
- 'Paso 2: Observar si el gráfico pasa por $(0, 0)$ y al girarlo $180^\circ$ se superpone consigo mismo (si lo hace, es impar).'
- 'Paso 3: Si no satisface ninguna de las dos simetrías visuales, clasificar como sin paridad.'
- 'Paso 4: Confirmar la decisión verificando puntos de coordenadas explícitas.'
errores_correccion: '- **Error común:** Pensar que una recta oblicua trasladada (ej: $y = 2x + 3$) es impar porque es una recta.

  - **Cómo corregirlo:** Al no pasar por $(0, 0)$, una rotación de $180^\circ$ mueve la recta a $y = 2x - 3$, por lo que **no tiene paridad**.'
ejemplos:
- titulo: 'Ejemplo 1: Parábola con vértice en el origen'
  enunciado: La gráfica de $y = -x^2$ tiene vértice en $(0, 0)$ y ramas hacia abajo. ¿Cuál es su paridad?
  alternativas:
  - Función Par
  - Función Impar
  - Sin Paridad
  - Función Lineal
  respuesta: Función Par
  solucion_pasos:
  - 'Paso 1: Es simétrica respecto al eje Y, luego es función par.'
- titulo: 'Ejemplo 2: Recta que pasa por el origen'
  enunciado: ¿Qué paridad tiene la gráfica de la recta $y = -4x$?
  alternativas:
  - Función Impar
  - Función Par
  - Sin Paridad
  - Función Constante
  respuesta: Función Impar
  solucion_pasos:
  - 'Paso 1: Pasa por $(0, 0)$ y tiene simetría central de $180^\circ$, es impar.'
- titulo: 'Ejemplo 3: Parábola trasladada'
  enunciado: La gráfica de $y = (x + 3)^2$ tiene vértice en $(-3, 0)$. ¿Cuál es su paridad?
  alternativas:
  - Sin Paridad
  - Función Par
  - Función Impar
  - Biyectiva
  respuesta: Sin Paridad
  solucion_pasos:
  - 'Paso 1: No tiene simetría con el eje Y ni con el origen, no posee paridad.'
- titulo: 'Ejemplo 4: Curva senoidal'
  enunciado: Una onda que pasa por $(0, 0)$ con cresta en $(\pi/2, 1)$ y valle en $(-\pi/2, -1)$, ¿qué paridad tiene?
  alternativas:
  - Función Impar
  - Función Par
  - Sin Paridad
  - Función Cuadrática
  respuesta: Función Impar
  solucion_pasos:
  - 'Paso 1: Cresta y valle son opuestos exactos respecto al origen, es impar.'
errores_frecuentes:
- Declarar paridad impar en funciones que no pasan por (0, 0).
- Confundir simetría axial desplazada con simetría par.
- Asumir que toda gráfica suave y simétrica debe ser par.
afirmaciones_verdaderas:
- Una función es par si su gráfica es simétrica respecto al eje Y, e impar si es simétrica respecto al origen.
- La ausencia de ambas simetrías determina que la función carece de paridad.
al_terminar_debes_poder: '**QUÉ:** Determinar la paridad de funciones a partir de su representación gráfica cartesiana.


  **CÓMO:** Identificando simetría axial respecto a x = 0 (par) o simetría central respecto a (0, 0) (impar).


