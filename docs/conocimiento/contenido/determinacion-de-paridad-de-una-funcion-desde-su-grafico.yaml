procedimiento:
- 'Paso 1: Observa si la gráfica es simétrica respecto al eje $y$ (espejo vertical).'
- 'Paso 2: Si no lo es, observa si es simétrica respecto al origen (rotación de $180°$).'
- 'Paso 3: Si no cumple ninguna de las dos, concluye que no es par ni impar.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar determinación de paridad de una función desde su gráfico.
ejemplos:
- titulo: Reconocimiento de simetría par en gráfico
  enunciado: El gráfico de $f(x)=|x|$ es simétrico respecto al eje $y$. ¿Qué tipo
    de función es?
  solucion_pasos:
  - La simetría respecto al eje $y$ corresponde a función par.
  - Es una función par.
- titulo: Reconocimiento de ausencia de simetría especial
  enunciado: El gráfico de $f(x)=x^2+2x+1$ no es simétrico ni respecto al eje $y$
    ni respecto al origen. ¿Qué se concluye?
  solucion_pasos:
  - No cumple ninguno de los dos tipos de simetría.
  - No es ni par ni impar.
- titulo: ¿Un gráfico puede ser simétrico respecto al eje $y$ y al origen simultáneamente?
  enunciado: ¿Un gráfico puede ser simétrico respecto al eje $y$ y al origen simultáneamente?
  respuesta: Sí
  solucion_pasos:
  - Esto ocurre únicamente para la función $f(x)=0$ (la función nula), que es simultáneamente
    par e impar.
- titulo: ¿Toda gráfica que pasa por el origen es impar?
  enunciado: ¿Toda gráfica que pasa por el origen es impar?
  respuesta: 'No'
  solucion_pasos:
  - Pasar por el origen es necesario pero no suficiente para ser impar; se requiere
    además la simetría rotacional completa.
errores_frecuentes:
- Confundir simetría respecto al eje $y$ con simetría respecto al origen al observar
  el gráfico.
- Concluir paridad observando solo una parte pequeña de la curva sin considerar todo
  el dominio visible.
- Asumir que toda curva que pasa por el origen es impar sin verificar la simetría
  rotacional completa.
- No considerar la posibilidad de que la función no sea ni par ni impar.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_poder: Evaluar, graficar e interpretar funciones aplicando determinación
  de paridad de una función desde su gráfico.
