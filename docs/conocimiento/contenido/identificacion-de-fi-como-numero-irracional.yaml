guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.01.06'
  title: 'Identificación de fi como número irracional'
  description: 'Conoce el número áureo (Phi, φ), su origen algebraico y geométrico, y demuestra por qué es un número irracional.'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'identificacion-de-fi-como-numero-irracional'
semantic_id: 'MAT.NUM.IRRACIONALES.NUMERO_AUREO'
titulo: 'Identificación de fi como número irracional'
objetivo: 'Reconocer y utilizar la expresión algebraica exacta del número áureo $\phi = \frac{1 + \sqrt{5}}{2}$ y explicar su irracionalidad a través de la presencia de $\sqrt{5}$.'
introduccion: 'Una proporción se denomina áurea o dorada cuando la razón entre la totalidad de un segmento y su parte mayor equivale a la razón entre la parte mayor y la parte menor. Esta relación de armonía geométrica, presente en el arte, la arquitectura y la naturaleza, conduce algebraicamente a la ecuación cuadrática $x^2 - x - 1 = 0$, cuya solución positiva es la famosa constante llamada número áureo: $\phi = \frac{1 + \sqrt{5}}{2} \approx 1{,}6180339887\dots$'
resumen: 'El número áureo (representado por la letra griega $\phi$ o $\varphi$) es el número irracional definido exactamente como $\phi = \frac{1 + \sqrt{5}}{2}$. Es un número irracional porque contiene la raíz cuadrada no exacta $\sqrt{5}$. Cumple la propiedad algebraica única $\phi^2 = \phi + 1$ (es decir, $\phi^2 \approx 2{,}618\dots$).'
requisitos:
  - 'Ecuaciones cuadráticas y fórmula general de resolución.'
  - 'Identificación de raíces no exactas como números irracionales.'
objetivos:
  - 'Reconocer la expresión algebraica exacta del número áureo $\phi = \frac{1 + \sqrt{5}}{2}$.'
  - 'Demostrar que $\phi$ es irracional mediante la irracionalidad de $\sqrt{5}$.'
que_aprenderas:
  - 'El origen del número áureo desde la división de un segmento en media y extrema razón.'
  - 'La propiedad algebraica fundamental $\phi^2 = \phi + 1$ y $\frac{1}{\phi} = \phi - 1$.'
  - 'La diferencia entre la representación algebraica exacta de $\phi$ y su aproximación $1{,}618$.'
al_terminar_debes_poder:
  - 'Calcular potencias de $\phi$ utilizando su relación cuadrática $\phi^2 = \phi + 1$.'
  - 'Explicar rigurosamente por qué $\phi$ pertenece al conjunto $\mathbb{I}$.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: '¿Cuál es la expresión algebraica EXACTA del número áureo $\phi$?'
    choices:
      - {text: '$\frac{1 + \sqrt{3}}{2}$', is_correct: false}
      - {text: '$\frac{1 + \sqrt{5}}{2}$', is_correct: true}
      - {text: '$1{,}618$', is_correct: false}
      - {text: '$\frac{5 + \sqrt{1}}{2}$', is_correct: false}
    explanation: 'La correcta es: $\frac{1 + \sqrt{5}}{2}$. Esta es la solución exacta de la ecuación $x^2 - x - 1 = 0$. El valor $1{,}618$ es solo su aproximación decimal.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: '¿Por qué el número áureo $\phi = \frac{1 + \sqrt{5}}{2}$ es un número IRRACIONAL?'
    choices:
      - {text: 'Porque está escrito como una fracción.', is_correct: false}
      - {text: 'Porque el numerador contiene la raíz cuadrada no exacta $\sqrt{5}$, que es irracional.', is_correct: true}
      - {text: 'Porque es un número negativo.', is_correct: false}
      - {text: 'Porque la suma $1 + 5 = 6$ es par.', is_correct: false}
    explanation: 'La correcta es: Porque el numerador contiene la raíz cuadrada no exacta $\sqrt{5}$, que es irracional. Sumar $1$ a $\sqrt{5}$ y dividir por $2$ (operaciones racionales) conserva la irracionalidad del número.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Recordar o derivar la definición exacta del número áureo $\phi = \frac{1 + \sqrt{5}}{2}$.'
  - 'Paso 2: Utilizar la identidad cuadrática $\phi^2 = \phi + 1$ para simplificar potencias o expresiones elevadas de $\phi$ sin necesidad de desarrollar decimales.'
  - 'Paso 3: Si se requiere una estimación cuantitativa, utilizar la aproximación $\phi \approx 1{,}618$ únicamente al final.'
errores_frecuentes:
  - 'Pensar que $\phi$ es un número racional por el hecho de tener una línea divisoria de fracción (olvidando que el numerador $1 + \sqrt{5}$ no es un número entero).'
  - 'Confundir $\phi = \frac{1 + \sqrt{5}}{2}$ con $\frac{1 + \sqrt{3}}{2}$ o con $\frac{1 - \sqrt{5}}{2}$ (que es su conjugado negativo).'
errores_correccion: 'Un error recurrente es decir: $\phi$ es una fracción, por lo tanto es racional. Recuerda la definición estricta de número racional: debe ser de la forma $\frac{a}{b}$ donde $a$ y $b$ son números enteros. En $\phi = \frac{1 + \sqrt{5}}{2}$, el numerador $a = 1 + \sqrt{5}$ no es entero, sino un número irracional. Por ende, la fracción completa representa un número irracional.'
ejemplos:
  - titulo: 'Propiedades algebraicas del número áureo'
    enunciado: 'Sabiendo que $\phi^2 = \phi + 1$, expresa $\phi^3$ en términos de $\phi$ en su forma más simple.'
    alternativas:
      - '$\phi^3 = 2\phi + 1$'
      - '$\phi^3 = \phi + 2$'
      - '$\phi^3 = 3\phi$'
      - '$\phi^3 = \phi^2 + 2$'
    respuesta: '$\phi^3 = 2\phi + 1$'
    solucion_pasos:
      - 'Multiplicamos ambos lados de la identidad $\phi^2 = \phi + 1$ por $\phi$:'
      - '$\phi^3 = \phi \cdot \phi^2 = \phi(\phi + 1) = \phi^2 + \phi$.'
      - 'Sustituimos nuevamente $\phi^2$ por $\phi + 1$:'
      - '$\phi^3 = (\phi + 1) + \phi = 2\phi + 1$.'
  - titulo: 'Recíproco del número áureo'
    enunciado: 'Calcula el valor exacto de $\frac{1}{\phi}$ racionalizando el denominador de $\frac{2}{1 + \sqrt{5}}$.'
    alternativas:
      - '$\frac{\sqrt{5} - 1}{2}$ (que es igual a $\phi - 1$)'
      - '$\frac{\sqrt{5} + 1}{2}$'
      - '$\frac{1 - \sqrt{5}}{2}$'
      - '$\sqrt{5} - 2$'
    respuesta: '$\frac{\sqrt{5} - 1}{2}$ (que es igual a $\phi - 1$)'
    solucion_pasos:
      - 'Racionalizamos $\frac{1}{\phi} = \frac{2}{\sqrt{5} + 1}$ multiplicando por el conjugado $(\sqrt{5} - 1)$:'
      - '$\frac{2(\sqrt{5} - 1)}{(\sqrt{5} + 1)(\sqrt{5} - 1)} = \frac{2(\sqrt{5} - 1)}{5 - 1} = \frac{2(\sqrt{5} - 1)}{4} = \frac{\sqrt{5} - 1}{2}$.'
      - 'Observamos que $\frac{\sqrt{5} - 1}{2} = \frac{1 + \sqrt{5}}{2} - 1 = \phi - 1 \approx 0{,}618033\dots$'
comprobacion_rapida:
  - afirmacion: 'El número áureo $\phi = \frac{1+\sqrt{5}}{2}$ es un número irracional.'
    respuesta: true
    explicacion: 'Correcto. Contiene la raíz no exacta $\sqrt{5}$ en el numerador.'
  - afirmacion: 'El cuadrado del número áureo es exactamente igual al número áureo más uno ($\phi^2 = \phi + 1$).'
    respuesta: true
    explicacion: 'Correcto. Es la propiedad característica del número áureo.'
  - afirmacion: 'El número $1{,}618$ es el valor exacto del número áureo.'
    respuesta: false
    explicacion: 'Falso. $1{,}618$ es una aproximación racional truncada. El valor exacto es $\frac{1+\sqrt{5}}{2}$.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales e irracionales.'
estado: 'publicado'
