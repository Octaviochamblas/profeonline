  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el número áureo mediante su fórmula exacta $\phi = \frac{1+\sqrt{5}}{2}$.'
- 'Paso 2: Reconocer su valor como un número irracional algebraico ($\mathbb{I}$) por contener la raíz no exacta $\sqrt{5}$.'
- 'Paso 3: Aplicar las propiedades algebraicas $\phi^2 = \phi + 1$ y $\frac{1}{\phi} = \phi - 1$ para simplificar expresiones.'
errores_correccion: '- **Error 1: Creer que $\phi$ es un número trascendente como $\pi$ o $e$.** **Cómo corregirlo:** $\phi$ proviene de $\sqrt{5}$, por lo que es una raíz de una ecuación polinómica cuadrática ($x^2 - x - 1 = 0$) y se clasifica como IRRACIONAL ALGEBRAICO.

  - **Error 2: Confundir $\phi$ con $\pi$.** **Cómo corregirlo:** $\phi \approx 1,618$ (proporción áurea) mientras que $\pi \approx 3,1416$ (razón circular).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el valor de $\phi^2 - \phi$.
  alternativas:
  - $1$
  - $0$
  - $\phi$
  respuesta: $1$
  solucion_pasos:
  - Como $\phi^2 = \phi + 1$, al restar $\phi$ queda $\phi^2 - \phi = 1$.
- titulo: Ejemplo 2
  enunciado: ¿A qué valor converge la razón entre términos consecutivos de Fibonacci $F_{n+1} / F_n$?
  alternativas:
  - Al número áureo fi aprox 1,618...
  - Al número pi aprox 3,14...
  - Al número de Euler e aprox 2,718...
  respuesta: Al número áureo fi aprox 1,618...
  solucion_pasos:
  - El límite de los cocientes de la sucesión de Fibonacci es exactamente $\phi$.
- titulo: ¿Es el número áureo fi una constante irracional?
  respuesta: Sí
  solucion_pasos:
  - Sí, contiene la raíz no exacta $\sqrt{5}$, siendo un irracional algebraico.
  alternativas:
  - texto: Sí, es un número irracional algebraico
    es_correcta: true
    retroalimentacion: ¡Correcto! $\phi = \frac{1+\sqrt{5}}{2} \in \mathbb{I}$.
  - texto: No, es un número racional
    es_correcta: false
    retroalimentacion: Incorrecto, la raíz $\sqrt{5}$ no puede expresarse como fracción de enteros.
  - texto: Solo cuando se aplica en geometría
    es_correcta: false
    retroalimentacion: Incorrecto, su valor numérico es intrínsecamente irracional.
- titulo: ¿Es fi aproximadamente igual a 1,618?
  respuesta: Sí
  solucion_pasos:
  - Sí, su valor truncado a tres decimales es $1,618$.
  alternativas:
  - texto: Sí, es aproximadamente 1,618
    es_correcta: true
    retroalimentacion: ¡Correcto! $\phi \approx 1,618033...$.
  - texto: No, es mayor que 2
    es_correcta: false
    retroalimentacion: Incorrecto, $\phi < 2$.
  - texto: No, es igual a 0,618
    es_correcta: false
    retroalimentacion: Incorrecto, $0,618$ corresponde a su inverso $1/\phi$.
errores_frecuentes:
- Confundir el símbolo $\phi$ (fi) con $\pi$ (pi).
- Considerar que el número áureo es trascendente cuando en realidad es algebraico.
- Olvidar que $1/\phi$ tiene exactamente la misma parte decimal que $\phi$ ($0,618...$).
- Creer que la sucesión de Fibonacci solo genera números enteros y no se relaciona con irracionales.
- Asumir que $\phi$ es igual a la fracción 8/5.
afirmaciones_verdaderas:
- El número áureo $\phi = \frac{1+\sqrt{5}}{2}$ es un número irracional algebraico.
- El cuadrado del número áureo es igual a sí mismo más uno ($\phi^2 = \phi + 1$).
- El límite del cociente de términos consecutivos de la sucesión de Fibonacci converge exactamente al número áureo.
al_terminar_debes_poder: '![Síntesis del número áureo](/static/img/nodos/identificacion-de-fi-como-numero-irracional-resumen.svg)


  QUÉ: Identificar y operar con el número áureo $\phi$ (phi) como un número irracional algebraico.


  CÓMO: Expresándolo mediante su fórmula radical exacta ($\phi = \frac{1+\sqrt{5}}{2} \approx 1,618...$), aplicando sus identidades cuadráticas autorreferenciales ($\phi^2 = \phi + 1$) y reconociéndolo como el límite universal de la sucesión de Fibonacci.'
