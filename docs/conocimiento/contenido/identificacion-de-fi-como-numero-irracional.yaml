semantic_id: MAT.NUM.IRRACIONALES.NUMERO_AUREO
resumen_inicial: El número áureo o proporción divina $\phi$ (fi) es una constante
  irracional algebraica dada por $\phi = \frac{1 + \sqrt{5}}{2} \approx 1,61803398...$
explicacion_simple: El número áureo $\phi$ es una proporción geométrica especial presente
  en el arte, la arquitectura y los patrones de la naturaleza (como las caracolas
  o los girasoles). Se obtiene de la solución de la ecuación de división proporcional
  en media y extrema razón.
explicacion_formal: 'El **Número Áureo $\phi$ (Fi)** se define algebraicamente como
  la solución positiva de la ecuación cuadrática $x^2 - x - 1 = 0$:


  $$\phi = \frac{1 + \sqrt{5}}{2} = 1 + \frac{1}{1 + \frac{1}{1 + \dots}} \approx
  1,6180339887...$$


  **Desglose de la fórmula:**

  - Irracional algebraico: A diferencia de $\pi$ y $e$, $\phi$ es un irracional *algebraico*
  por ser raíz del polinomio $x^2 - x - 1$.

  - Límite de Fibonacci: $\phi = \lim_{n \to \infty} \frac{F_{n+1}}{F_n}$ donde $F_n$
  representa la Sucesión de Fibonacci.


  > **Complemento didáctico:** Posee la propiedad única de que su cuadrado se obtiene
  sumándole un uno: $\phi^2 = \phi + 1$.'
definiciones_clave: '- **Número áureo $\phi$**: Constante irracional algebraica $\phi
  = \frac{1 + \sqrt{5}}{2}$ que rige la proporción armónica y el límite de Fibonacci.'
propiedades_relaciones: '- **Relación cuadrática única**: $\phi^2 = \phi + 1$ y $\frac{1}{\phi}
  = \phi - 1$.'
ejemplo_guiado:
  enunciado: Demuestre la irracionalidad de la proporción áurea $\phi = \frac{1 +
    \sqrt{5}}{2}$.
  pasos:
  - 'Paso 1: Analizar la estructura del número: $\phi = \frac{1}{2} + \frac{\sqrt{5}}{2}$.'
  - 'Paso 2: Evaluar la naturaleza de $\sqrt{5}$: como $5$ no es un cuadrado perfecto,
    $\sqrt{5}$ es un número irracional ($\sqrt{5} \in \mathbb{I}$).'
  - 'Paso 3: Aplicar la propiedad de combinación: la suma y división por enteros de
    un número irracional preserva su naturaleza irracional.'
  - 'Conclusión: $\phi = \frac{1 + \sqrt{5}}{2} \in \mathbb{I}$ es un número irracional
    algebraico.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión exacta del número áureo fi?
  choices:
  - text: fi = (1 + sqrt(5)) / 2
    is_correct: true
  - text: fi = 1 + sqrt(2)
    is_correct: false
  - text: fi = pi / 2
    is_correct: false
  - text: fi = 3/2
    is_correct: false
  explanation: La alternativa correcta es 'fi = (1 + sqrt(5)) / 2'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué fi es un número irracional?
  choices:
  - text: Porque contiene a sqrt(5), que es una raíz no exacta irracional
    is_correct: true
  - text: Porque está dividido por 2
    is_correct: false
  - text: Because es mayor que 1
    is_correct: false
  - text: No es irracional
    is_correct: false
  explanation: La alternativa correcta es 'Porque contiene a sqrt(5), que es una raíz
    no exacta irracional'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer la constante áurea $\phi = \frac{1 + \sqrt{5}}{2} \approx 1,618...$
  como un irracional algebraico.'
- 'Paso 2: Utilizar la propiedad $\phi^2 = \phi + 1$ para simplificar potencias del
  número áureo.'
- 'Paso 3: Relacionar $\phi$ con los cocientes sucesivos de la Sucesión de Fibonacci.'
errores_correccion: '- **Error 1: Confundir el número áureo $\phi$ con un irracional
  trascendente como $\pi$.** **Cómo corregirlo:** $\phi$ es un irracional *algebraico*
  porque es solución exacta de la ecuación $x^2 - x - 1 = 0$.


  - **Error 2: Pensar que $\phi$ es una fracción porque se escribe como $\frac{1+\sqrt{5}}{2}$.**
  **Cómo corregirlo:** Contiene la raíz $\sqrt{5}$, que no es entera; no es una fracción
  de enteros $a/b$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule el valor exacto de $\phi^2 - \phi$.
  alternativas:
  - '1'
  - '0'
  - sqrt(5)
  respuesta: '1'
  solucion_pasos:
  - Como $\phi^2 = \phi + 1 \implies \phi^2 - \phi = 1$.
- titulo: Ejemplo 2
  enunciado: ¿A qué valor tiende la razón $F_{n+1} / F_n$ entre dos términos consecutivos
    de Fibonacci?
  alternativas:
  - Al número áureo fi approx 1,618...
  - Al número pi
  - Al número e
  respuesta: Al número áureo fi approx 1,618...
  solucion_pasos:
  - $\lim_{n \to \infty} \frac{F_{n+1}}{F_n} = \phi = \frac{1+\sqrt{5}}{2}$.
- titulo: ¿Es el número áureo fi una constante irracional?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\phi = \frac{1+\sqrt{5}}{2} \in \mathbb{I}$.
- titulo: ¿Es fi aproximadamente igual a 1,618?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\phi \approx 1,61803398...$
errores_frecuentes:
- El número áureo fi es un número trascendente incompatible con las ecuaciones cuadráticas.
- Expresar el número áureo como $(1+\sqrt{5})/2$ prueba que es un número racional
  en Q.
- El cuadrado del número áureo se obtiene multiplicando su valor decimal por 10.
- La Sucesión de Fibonacci tiende en sus cocientes límite al número entero 2.
- El número áureo posee un período decimal de tres dígitos repetitivos.
afirmaciones_verdaderas:
- El número áureo $\phi = \frac{1+\sqrt{5}}{2} \approx 1,618...$ es un número irracional
  algebraico.
- Satisface la relación algebraica única $\phi^2 = \phi + 1$ y es el límite de los
  cocientes de la Sucesión de Fibonacci.
al_terminar_debes_poder: Al terminar serás capaz de identificar el número áureo $\phi
  = \frac{1+\sqrt{5}}{2}$ como una constante irracional algebraica, aplicando sus
  propiedades numéricas y su relación con la Sucesión de Fibonacci.
