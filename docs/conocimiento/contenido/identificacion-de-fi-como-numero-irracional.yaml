semantic_id: MAT.NUM.IRRACIONALES.NUMERO_AUREO
resumen_inicial: El número áureo o número de oro, denotado por $\phi$ (phi), es una constante
  irracional dada por $\phi = \frac{1 + \sqrt{5}}{2} \approx 1{,}618033...$
explicacion_simple: 'El número de oro $\phi$ (fi) es una proporción famosa presente en el
  arte, la naturaleza y la arquitectura:

  $$\phi = \frac{1 + \sqrt{5}}{2} \approx 1{,}6180339887...$$

  Como incluye a $\sqrt{5}$ (una raíz no exacta), $\phi$ es un **número irracional**.'
explicacion_formal: El número áureo $\phi = \frac{1 + \sqrt{5}}{2} \in \mathbb{I}$ es la solución
  positiva de la ecuación cuadrática $x^2 - x - 1 = 0$. Su irracionalidad se deduce directamente
  de la irracionalidad de $\sqrt{5}$.
definiciones_clave: '- **Número Áureo / Proporción Divina ($\phi$)**: Valor irracional $\frac{1
  + \sqrt{5}}{2}$.'
propiedades_relaciones: '- **Ecuación característica**: $\phi^2 = \phi + 1$.'
ejemplo_guiado:
  enunciado: Demuestra por qué $\phi = \frac{1 + \sqrt{5}}{2}$ es un número irracional.
  pasos:
  - Identificar la presencia de la raíz no exacta $\sqrt{5}$, que es irracional.
  - 'Sumar el número entero $1$ a $\sqrt{5}$: la suma sigue siendo irracional.'
  - 'Dividir entre $2$: la mitad de un irracional sigue siendo un número irracional.'
  - Concluir que $\phi \in \mathbb{I}$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión exacta del número áureo $\phi$?
  choices:
  - text: (1 + \sqrt{5}) / 2
    is_correct: true
  - text: \sqrt{2} + 1
    is_correct: false
  - text: 1,618
    is_correct: false
  - text: \pi / 2
    is_correct: false
  explanation: 'La correcta es: (1 + \sqrt{5}) / 2. Esa es la fórmula algebraica exacta de
    $\phi$.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué el número áureo $\phi$ es un número irracional?
  choices:
  - text: Porque contiene a la raíz no exacta \sqrt{5}
    is_correct: true
  - text: Porque se divide entre 2
    is_correct: false
  - text: Porque es mayor que 1
    is_correct: false
  - text: Porque es la solución de una ecuación cuadrática
    is_correct: false
  explanation: 'La correcta es: Porque contiene a la raíz no exacta \sqrt{5}. La irracionalidad
    de $\sqrt{5}$ se transmite a $\phi$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el número áureo $\phi = \frac{1 + \sqrt{5}}{2}$.'
- 'Paso 2: Reconocer su valor aproximado $1{,}618... \in \mathbb{I}$.'
errores_correccion: No pienses que por tener una división por 2 es racional; el numerador
  $1+\sqrt{5}$ no es entero.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\phi$ irracional?
  alternativas:
  - Sí
  - 'No'
  respuesta: Sí
  solucion_pasos:
  - $\phi = \frac{1+\sqrt{5}}{2} \in \mathbb{I}$.
- titulo: Ejemplo 2
  enunciado: ¿φ es racional o irracional?
  alternativas:
  - Irracional
  - Racional
  - No es un número real
  respuesta: Irracional
  solucion_pasos:
  - Contiene la raíz no exacta √5.
- titulo: Ejemplo 3
  enunciado: ¿Cuál es el valor aproximado del número áureo?
  alternativas:
  - 1,618...
  - 1,414...
  - 2,718...
  respuesta: 1,618...
  solucion_pasos:
  - Esa es la aproximación de φ.
- titulo: ¿φ es la solución positiva de la ecuación x al cuadrado menos x menos 1 igual a
    0?
  respuesta: Sí
  solucion_pasos:
  - Esa es su definición algebraica característica.
errores_frecuentes:
- Creer que la división por 2 convierte a $\phi$ en racional.
- Creer que dividir un número entre 2 siempre da como resultado un número racional, olvidando
  que el numerador puede ser irracional.
- Pensar que φ es un número entero por aparecer en proporciones geométricas simples.
- Confundir el número áureo con la razón simple 1,5 o con otras proporciones comunes.
- Olvidar que la irracionalidad de √5 se transmite directamente a φ.
afirmaciones_verdaderas:
- $\phi = \frac{1+\sqrt{5}}{2} \in \mathbb{I}$.
- El número áureo cumple la propiedad φ al cuadrado igual a φ más 1, y aunque es solución
  de una ecuación cuadrática con coeficientes racionales, eso no lo hace racional.
al_terminar_debes_poder: Identificar el número áureo $\phi$ como una constante irracional.
fuente: Texto escolar MINEDUC.
estado: publicado
