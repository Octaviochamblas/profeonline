procedimiento:
- 'Paso 1: Colocar paréntesis alrededor de cada constante negativa antes de insertarla en la expresión.'
- 'Paso 2: Evaluar las potencias determinando si el signo negativo dentro del paréntesis se convierte en positivo (par) o negativo (impar).'
- 'Paso 3: Aplicar la multiplicación de signos en los productos de coeficientes por números negativos.'
- 'Paso 4: Consolidar las sumas y restas de números enteros de manera secuencial.'
errores_correccion: '- **Error 1:** Excluir los paréntesis al elevar un número negativo al cuadrado (escribir $-3^2 = -9$ en vez de $(-3)^2 = +9$). **Cómo corregirlo:** La variable completa $x = -3$ **debe ir entre paréntesis $(-3)^2 = 9$** para elevar la base negativa.

  - **Error 2:** Reemplazar $x = -4$ en $5 - x$ escribiendo $5 - 4 = 1$. **Cómo corregirlo:** La resta del negativo **exige paréntesis $5 - (-4) = 5 + 4 = 9$**.

  '
ejemplos:
- titulo: Sustitución con paréntesis
  enunciado: ¿Cuál es el valor de $x^2$ para $x = -6$?
  alternativas:
  - $36$
  - $-36$
  - $12$
  respuesta: $36$
  solucion_pasos:
  - '1. Sustitución entre paréntesis: $(-6)^2$.'
  - '2. Potencia: $(-6)(-6) = +36$.'
- titulo: Resta de un valor negativo
  enunciado: ¿Cuál es el valor de $10 - y$ para $y = -8$?
  alternativas:
  - $18$
  - $2$
  - $-18$
  respuesta: $18$
  solucion_pasos:
  - '1. Sustitución: $10 - (-8)$.'
  - '2. Doble negación: $10 + 8 = 18$.'
- titulo: Diferencia sintáctica
  enunciado: ¿Es el resultado de $(-5)^2 = 25$ diferente del resultado de $-5^2 = -25$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el paréntesis incluye al signo negativo dentro de la potencia.
- titulo: Producto con negativo
  enunciado: Para $a = -3$ y $b = -2$, ¿es el producto $-4a b$ igual a $-4(-3)(-2) = -24$?
  respuesta: Sí
  solucion_pasos:
  - Sí, tres signos menos dan como resultado un número negativo.
errores_frecuentes:
- Los paréntesis no son incluidos al sustituir una variable por un valor negativo en una potencia de grado par.
- Escribir una sola resta a - b al sustituir b por un valor negativo en lugar de a - (-b).
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Declarar que las expresiones (-x)^2 y -x^2 producen el mismo resultado numérico.
- Multiplicar los signos negativos omitiendo las leyes del álgebra de signos.
afirmaciones_verdaderas:
- El uso de paréntesis al sustituir un valor negativo garantiza que el signo sea afectado por el exponente correspondiente.
- La evaluación de (-z)^2 da siempre un resultado positivo, mientras que -z^2 mantiene el signo negativo fuera de la potencia.
al_terminar_debes_poder: '![Resumen de uso de paréntesis con valores negativos](/static/img/nodos/uso-de-parentesis-al-sustituir-valores-negativos-resumen.svg)


  QUÉ: Sustituir valores negativos en expresiones algebraicas sin cometer errores de signo.


  CÓMO: Proteger obligatoriamente la base negativa con paréntesis $(-k)^n$, distinguiendo $(-k)^2 = +k^2$ de $-k^2 = -(k^2)$.'
