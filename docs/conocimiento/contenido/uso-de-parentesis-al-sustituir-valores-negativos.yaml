semantic_id: MAT.ALG.VALORIZACION.PARENTESIS_VALORES_NEGATIVOS
resumen_inicial: El uso de paréntesis al sustituir valores negativos es una regla técnica fundamental para preservar la estructura de la base en potencias y evitar la colisión del signo menos operacional.
explicacion_simple: "Cuando sustituyes una variable por un **número negativo** (ej: $x = -3$), **SIEMPRE debes envolver el número entre paréntesis $(-3)$**:\n- **¿Por qué es indispensable?**\n  1. **En potencias**:\n     - Con paréntesis: $(-3)^2 = (-3) \\cdot (-3) = \\mathbf{+9}$ (el signo negativo se eleva a la potencia).\n     - Sin paréntesis: $-3^2 = -(3 \\cdot 3) = \\mathbf{-9}$ (el signo negativo NO se eleva, queda fuera).\n  2. **En restas**:\n     - Si la expresión es $a - b$ con $b = -5$:\n     - Escribir $a - (-5) = a + 5$ es **correcto** (menos por menos da más).\n     - Escribir $a - 5$ es un **error grave**.\n\n![Uso de Paréntesis con Valores Negativos](/static/img/nodos/uso-de-parentesis-al-sustituir-valores-negativos-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea $(-z) \in \mathbb{R}^-$ una constante negativa sustituida en la expresión $E(x) = c x^n$. La distinción formal entre la evaluación con y sin envolvente parental radica en el alcance de la operación de potencia sobre el grupo aditivo:


  $$\operatorname{ev}_{x = -z}(c x^n) = c \cdot (-z)^n \quad \neq \quad - c \cdot z^n \quad (\text{para } n \text{ par})$$


  ### Álgebra de Signos con Paréntesis

  1. **Doble negación aditiva**: $-(-z) = +z$.

  2. **Multiplicación de coeficientes negativos**: $-c \cdot (-z) = +(c z)$.

  3. **Base negativa elevada a potencia par**: $(-z)^{2k} = +z^{2k}$.

  4. **Base negativa elevada a potencia impar**: $(-z)^{2k+1} = -z^{2k+1}$.


  ### Síntesis didáctica

  El uso sistemático de paréntesis al sustituir variables negativas elimina la ambigüedad sintáctica y garantiza la precisión en cálculos matriciales y financieros.

  '
definiciones_clave: '- **Envolvente parental**: Uso de paréntesis $( -z )$ para encerrar una constante negativa al realizar la sustitución de una variable.

  - **Alcance del exponente**: Propiedad por la cual la potencia afecta únicamente a lo encerrado dentro de su paréntesis inmediato.

  - **Doble signo negativo ($-(-z)$)**: Transformación del producto de signos negativos adyacentes en una adición positiva.

  '
propiedades_relaciones: '- **Distinción de signo en pares**: $(-z)^2 = +z^2$, mientras que $-z^2 = -(z^2)$ permanece negativo.

  - **Invarianza en impares**: $(-z)^3 = -z^3$, donde el signo negativo resulta idéntico con o sin envolvente pero exige mantener la coherencia operatoria.

  '
ejemplo_guiado:
  enunciado: Calcula el valor numérico de $3 - x^2 - 4x$ para $x = -5$.
  pasos:
  - 'Paso 1: Sustituimos $x = -5$ envolviendo cada valor entre paréntesis: $3 - (-5)^2 - 4(-5)$.'
  - 'Paso 2: Evaluamos $(-5)^2$: Como está entre paréntesis, $(-5)(-5) = +25 \implies 3 - (25) - 4(-5)$.'
  - 'Paso 3: Evaluamos el producto $-4(-5)$: Menos por menos da más $\implies +20$.'
  - 'Paso 4: Unimos los términos resultantes: $3 - 25 + 20$.'
  - 'Paso 5: Resolvemos de izquierda a derecha: $3 - 25 = -22 \implies -22 + 20 = -2$.'
  - 'Conclusión: El valor numérico final es **$-2$**.'
  imagen: /static/img/nodos/uso-de-parentesis-al-sustituir-valores-negativos-ejemplos.svg
