resumen_inicial: El uso explícito de paréntesis al sustituir valores negativos es
  imprescindible para garantizar la correcta aplicación de la ley de los signos y
  las potencias.
explicacion_simple: 'Cuando reemplazamos un número negativo en una letra (como $x
  = -3$), SIEMPRE debemos envolverlo entre paréntesis: escribir $(-3)^2$. Si no usamos
  paréntesis y escribimos $-3^2$, la calculadora o el álgebra entenderá que el signo
  menos no se eleva al cuadrado y dará $-9$ en lugar de $+9$.'
explicacion_formal: 'Dada la potencia $x^n$ y el valor negativo $v = -a < 0$, la **Distinción
  Operacional de Paréntesis** establece:


  $$(-a)^n \neq -a^n \quad \text{para } n \text{ par}$$


  $$\text{Con paréntesis: } (-a)^2 = (-a)(-a) = +a^2$$

  $$\text{Sin paréntesis: } -a^2 = -(a \cdot a) = -a^2$$


  > **Complemento didáctico:** El paréntesis delimita el alcance de la potencia incluyendo
  el signo negativo dentro de la base escalar.'
definiciones_clave: '- **Uso de paréntesis**: Notación $(-v)^n$ que incluye la polaridad
  negativa en la base de la potencia.

  - **Alcance del exponente**: Sin paréntesis el exponente afecta únicamente al módulo
  numérico.'
propiedades_relaciones: '- **Diferencia para exponente par**: $(-3)^2 = +9$, mientras
  que $-3^2 = -9$.'
ejemplo_guiado:
  enunciado: Calcule la diferencia entre evaluar $E_1 = x^2$ y $E_2 = -x^2$ para $x
    = -4$.
  pasos:
  - 'Paso 1: Evaluar $E_1 = x^2$: encubrir con paréntesis $(-4)^2 = (-4)(-4) = +16$.'
  - 'Paso 2: Evaluar $E_2 = -x^2$: aplicar el menos exterior a $(-4)^2 \to -((-4)^2)
    = -(16) = -16$.'
  - 'Conclusión: $E_1 = +16$ y $E_2 = -16$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué es obligatorio encerrar entre paréntesis los valores negativos
    al sustituirlos en una potencia par?
  choices:
  - text: Para asegurar que el signo negativo forme parte de la base y se eleve al
      cuadrado resultando positivo
    is_correct: true
  - text: Para convertir el número en una fracción
    is_correct: false
  - text: Para eliminar la variable de la expresión
    is_correct: false
  - text: Para cambiar la operación a una división
    is_correct: false
  explanation: La alternativa correcta es 'Para asegurar que el signo negativo forme
    parte de la base y se eleve al cuadrado resultando positivo'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el valor de x^2 para x = -4 al usar paréntesis?
  choices:
  - text: '+16'
    is_correct: true
  - text: '-16'
    is_correct: false
  - text: '-8'
    is_correct: false
  - text: '+8'
    is_correct: false
  explanation: La alternativa correcta es '+16'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Envolver cada valor negativo entre paréntesis antes de la sustitución.'
- 'Paso 2: Aplicar la potencia sobre todo el contenido del paréntesis (base y signo).'
- 'Paso 3: Operar los signos exteriores sobrantes.'
errores_correccion: '- **Error 1: Escribir $-3^2 = 9$ sin paréntesis.** **Cómo corregirlo:**
  La expresión $-3^2$ significa $-(3 \cdot 3) = -9$; para obtener $+9$ se debe escribir
  obligatoriamente $(-3)^2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Al valorizar la expresión -x^2 para x = -5, ¿qué resultado numérico se
    obtiene?
  alternativas:
  - '-25'
  - '25'
  - '-10'
  - '10'
  respuesta: '-25'
  solucion_pasos:
  - '1. Sustituir con paréntesis: -(-5)^2.'
  - 2. (-5)^2 = 25.
  - '3. Aplicar menos exterior: -(25) = -25.'
- titulo: Ejemplo 2
  enunciado: ¿Es (-2)^4 equivalente a -2^4?
  alternativas:
  - No, (-2)^4 es +16 y -2^4 es -16
  - Sí, ambos dan +16
  - Sí, ambos dan -16
  - Indeterminado
  respuesta: No, (-2)^4 es +16 y -2^4 es -16
  solucion_pasos:
  - 1. (-2)^4 = +16.
  - 2. -2^4 = -(2^4) = -16. No son equivalentes.
- titulo: ¿Es (-3)^3 igual a -3^3 para exponentes impares?
  respuesta: Sí
  solucion_pasos:
  - Sí, para exponentes impares ambos dan -27, pero el uso de paréntesis sigue siendo
    metodológicamente obligatorio.
- titulo: ¿Da la evaluación de x^2 para x = -6 un valor de -36?
  respuesta: 'No'
  solucion_pasos:
  - No, (-6)^2 = +36 por elevar el signo negativo a potencia par.
errores_frecuentes:
- Omitir los paréntesis al sustituir números negativos elevándolos a potencias pares.
- Declarar que (-a)^2 y -a^2 producen exactamente el mismo resultado numérico.
- Multiplicar el signo exterior por el signo de la base antes de resolver la potencia.
- Declarar que los paréntesis sólo se usan cuando hay fracciones.
- Declarar la ley de signos de la adición con la ley de signos de la potenciación.
afirmaciones_verdaderas:
- Al sustituir un número negativo en una variable elevada a potencia debe usarse paréntesis.
- La notación (-a)^n incluye el signo menos dentro del cálculo de la potencia.
al_terminar_debes_poder: Al terminar serás capaz de utilizar paréntesis rigurosamente
  al sustituir valores negativos para calcular potencias sin errores de signo.
fuente: Texto escolar MINEDUC — Álgebra 8° Básico / Valorización.
estado: publicado
