procedimiento:
- 'Paso 1: Coloca la variable original entre paréntesis vacíos en la expresión.'
- 'Paso 2: Introduce el número negativo junto con su signo dentro de ese paréntesis.'
- 'Paso 3: Si hay una potencia exterior, recuerda la regla de los signos (base negativa
  a exponente par = positivo, a impar = negativo).'
- 'Paso 4: Si hay un signo menos delante del paréntesis, haz chocar los signos (-
  por - da +).'
errores_correccion: Evita omitir los paréntesis al sustituir números negativos en
  uso de paréntesis al sustituir valores negativos.
ejemplos:
- titulo: Doble negatividad
  enunciado: Valora la expresión -x^2 - x, cuando x = -4.
  solucion_pasos:
  - 'Colocamos paréntesis vacíos: -( )^2 - ( ).'
  - 'Rellenamos con -4: -(-4)^2 - (-4).'
  - 'Resolvemos la potencia de adentro: (-4)^2 = +16.'
  - 'Reescribimos: -(16) - (-4).'
  - 'Chocamos signos: -16 + 4.'
  - 'Resultado final: -12.'
- titulo: Una función de transferencia en un circuito electrónico se define por $V
    = a^2 - ab$. Si el
  enunciado: 'Una función de transferencia en un circuito electrónico se define por
    $V = a^2 - ab$. Si el voltaje $a$ es de $-3$ voltios y la corriente $b$ es de
    $-2$ amperios, ¿cuál es el valor de $V$ procesado correctamente por el sistema?
    (v1)


    Opciones: A) $3$ · B) $15$ · C) $-3$ · D) $9$'
  solucion_pasos:
  - 'Sustitución con chalecos: $V = (-3)^2 - (-3)(-2)$. Calculamos la potencia: $(-3)^2
    = 9$. Calculamos el bloque derecho: $(-3)(-2) = +6$. Reconstruimos: $9 - (+6)
    = 9 - 6 = 3$.'
  - 'Respuesta: $3$'
- titulo: 'Respecto de «Uso de paréntesis al sustituir valores negativos»: ¿Describe
    adecuadamente el c'
  enunciado: 'Respecto de «Uso de paréntesis al sustituir valores negativos»: ¿Describe
    adecuadamente el concepto esta frase? «Al sustituir un **Valor Negativo**, es
    absolutamente obligatorio **encerrarlo entre paréntesis**»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al sustituir un **Valor Negativo**,
    es absolutamente obligatorio **encerrarlo entre paréntesis**.'
- titulo: 'Respecto de «Uso de paréntesis al sustituir valores negativos»: ¿Se puede
    aceptar esta afirm'
  enunciado: 'Respecto de «Uso de paréntesis al sustituir valores negativos»: ¿Se
    puede aceptar esta afirmación? «No usar paréntesis y que una potencia par no elimine
    el signo negativo (ej. decir que $x^2 = -16$ cuando $x=-4$)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al sustituir un **Valor Negativo**,
    es absolutamente obligatorio **encerrarlo entre paréntesis**.'
errores_frecuentes:
- No usar paréntesis y que una potencia par no elimine el signo negativo (ej. decir
  que $x^2 = -16$ cuando $x=-4$).
- Olvidar chocar los signos cuando la variable tenía un signo negativo previo (ej.
  $2 - x$, con $x=-3$, escribir $2 - 3$ en lugar de $2 - (-3)$).
- Porque los paréntesis sirven para recordar que el número es negativo, aunque el
  resultado matemático sería el mismo de todas formas.
- Porque los números negativos no pueden existir sin paréntesis en matemáticas.
- Porque el paréntesis indica que se debe multiplicar por dos.
afirmaciones_verdaderas:
- La traducción de uso de paréntesis al sustituir valores negativos preserva el significado
  matemático del enunciado.
al_terminar_debes_poder: Traducir y evaluar expresiones que involucren uso de paréntesis
