semantic_id: MAT.ALG.VALORIZACION.PARENTESIS_VALORES_NEGATIVOS
resumen_inicial: 'Uso de paréntesis al sustituir valores negativos: traducción, reglas
  y aplicación práctica en Valorización de expresiones algebraicas.'
explicacion_simple: Si hay un 'asesino silencioso' en las pruebas de álgebra, es el
  número negativo. Si lo valorizas sin ponerle su 'chaleco antibalas' (el paréntesis),
  morirá a manos de las potencias o alterará los signos de toda la ecuación.
explicacion_formal: '### Definición formal


  El exponente opera inmediatamente sobre su base izquierda. En $-5^2$, la base es
  5. En $(-5)^2$, la base es -5.


  ### Desarrollo didáctico


  Veamos la tragedia de valorizar $x^2$ cuando $x = -3$.

  - Forma INCORRECTA (sin chaleco): $-3^2 = -9$. Mortal. El cuadrado elevó solo al
  3, dejando el menos intacto.

  - Forma CORRECTA (con chaleco): $(-3)^2 = (-3)(-3) = +9$. Salvado. El cuadrado elevó
  también al signo menos, volviéndolo positivo.


  El uso del paréntesis también salva vidas en restas. Valoremos $5 - x$ con $x =
  -2$.

  - Incorrecto: $5 - 2 = 3$. (Se perdió un signo).

  - Correcto: $5 - (-2) = 5 + 2 = 7$.'
definiciones_clave: '- **Uso de paréntesis al sustituir valores negativos**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de uso de paréntesis al sustituir valores negativos.'
