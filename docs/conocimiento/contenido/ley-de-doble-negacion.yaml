procedimiento:
- 'Paso 1: Identificar la presencia de dos símbolos de negación consecutivos sobre la misma variable o subfórmula: $\neg(\neg A)$.'
- 'Paso 2: Aplicar la ley de involución cancelando el par de negaciones: $\neg\neg A \mapsto A$.'
- 'Paso 3: Si hay una cadena de negaciones, contar el número total $k$; si es par simplificar a $A$, si es impar a $\neg A$.'
- 'Paso 4: Reemplazar el bloque simplificado en la fórmula principal.'
errores_correccion: '- **Error 1:** Afirmar que tres negaciones consecutivas ($\neg\neg\neg p$) se cancelan por completo. **Cómo corregirlo:** Dos negaciones se cancelan entre sí ($\neg\neg p \equiv p$), quedando todavía una tercera negación activa: $\neg\neg\neg p \equiv \neg p$.

  - **Error 2:** Creer que $\neg(\neg p \land q)$ equivale a $p \land q$. **Cómo corregirlo:** La negación exterior afecta a todo el paréntesis; para simplificar deben aplicarse las Leyes de De Morgan: $\neg(\neg p \land q) \equiv p \lor \neg q$.

  '
ejemplos:
- titulo: Doble negación de proposición verdadera
  enunciado: Si $p$ es verdadera, ¿cuál es el valor de $\neg\neg p$?
  alternativas:
  - Verdadero ($V$)
  - Falso ($F$)
  - Indeterminado
  respuesta: Verdadero ($V$)
  solucion_pasos:
  - 1. $\neg p = F$.
  - 2. $\neg(\neg p) = \neg F = V$.
- titulo: Tres negaciones consecutivas
  enunciado: ¿A qué equivale la expresión $\neg\neg\neg q$?
  alternativas:
  - $\neg q$
  - $q$
  - $\bot$
  respuesta: $\neg q$
  solucion_pasos:
  - '1. Cancelamos el primer par: $\neg\neg(\neg q) \equiv \neg q$.'
- titulo: Involución de fórmulas compuestas
  enunciado: ¿Es $\neg\neg(p \to q)$ equivalente a $p \to q$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la ley de doble negación aplica a cualquier fórmula bien formada.
- titulo: Tautología de equivalencia
  enunciado: ¿La fórmula $\neg\neg p \leftrightarrow p$ tiene vector $[V, V]^T$?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una equivalencia tautológica universal.
errores_frecuentes:
- La afirmación de que un número impar de negaciones consecutivas equivale a la proposición afirmativa sin negar.
- La afirmación de que la doble negación $\neg\neg p$ produce una fórmula de valor veritativo inverso a $p$.
- La afirmación de que la expresión $\neg(\neg p \lor q)$ se simplifica eliminando directamente los dos signos de negación.
- La afirmación de que la ley de doble negación solo se cumple si $p$ es verdadera.
- La afirmación de que dos negaciones consecutivas se combinan multiplicativamente para dar una contradicción.
afirmaciones_verdaderas:
- La ley de doble negación establece que una proposición negada dos veces consecutivas $\neg(\neg p)$ es lógicamente equivalente a la proposición original $p$.
- Una cadena de $k$ negaciones sobre una proposición $p$ se reduce a $p$ si $k$ es un entero par, y a $\neg p$ si $k$ es impar.
al_terminar_debes_poder: '![Cuadro resumen: Ley de Doble Negación](/static/img/nodos/ley-de-doble-negacion-resumen.svg)


  QUÉ: Conocer, demostrar y aplicar la ley de doble negación ($\neg\neg p \equiv p$).

  CÓMO: Simplificar pares de negaciones consecutivas en fórmulas algebraicas y evaluar su tabla de verdad tautológica.'
