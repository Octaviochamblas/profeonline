semantic_id: MAT.FUND.RAZONAMIENTO_LOGICO.DOBLE_NEGACION
resumen_inicial: Definición, demostración y aplicaciones de la ley de doble negación ($\neg\neg p \equiv p$), que establece que dos negaciones consecutivas se anulan mutuamente.
explicacion_simple: 'La **ley de doble negación** establece que negar una afirmación dos veces equivale a dejar la afirmación original tal como estaba al principio. En el lenguaje cotidiano, si alguien dice "No es verdad que no comí pastel", en el fondo está afirmando "Comí pastel". En la lógica matemática se escribe formalmente como **$\neg(\neg p) \equiv p$**. Cada par de negaciones consecutivas se cancela exactamente como dos signos menos en aritmética: $-(-x) = x$.


  ![Infografía: Ley de Doble Negación](/static/img/nodos/ley-de-doble-negacion-intro.svg)'
explicacion_formal: "### Definición formal\nEn el cálculo proposicional clásico, la **ley de doble negación (o principio de involución)** establece la equivalencia semántica entre una proposición $p$ y su doble complemento lógico:\n$$\\neg(\\neg p) \\equiv p \\quad \\iff \\quad \\models \\neg(\\neg p) \\leftrightarrow p$$\nEn el álgebra de Boole $(\\{0, 1\\}, \\land, \\lor, \\neg)$, se formula como la involución aritmética:\n$$1 - (1 - v(p)) = v(p)$$\n\n### Desglose simbólico\n- Evaluación fila 1 ($p = V$): $\\neg(\\neg V) = \\neg(F) = V$.\n- Evaluación fila 2 ($p = F$): $\\neg(\\neg F) = \\neg(V) = F$.\n- Regla de simplificación para $k$ negaciones consecutivas $\\neg^k p$:\n  $$\\neg^k p \\equiv \\begin{cases} p & \\text{si } k \\text{ es par} \\\\ \\neg p & \\text{si } k \\text{ es impar} \\end{cases}$$\n\n### Síntesis didáctica\nLa doble negación permite limpiar y simplificar fórmulas extensas eliminando parejas de negaciones sucesivas sin alterar la validez del razonamiento.\n"
definiciones_clave: '- **Ley de doble negación ($\neg\neg p \equiv p$)**: Regla lógica que afirma que la doble aplicación del operador de negación reproduce la fórmula original.

  - **Involución booleana**: Propiedad de una función matemática que es su propia inversa ($f(f(x)) = x$).

  - **Cancelación de paridad**: Principio por el cual un número par de negaciones sucesivas equivale a la afirmación directa.

  '
propiedades_relaciones: '- **Distinción con lógicas no clásicas**: En la lógica intuicionista solo se acepta $p \to \neg\neg p$, pero no el recíproco $\neg\neg p \to p$. En la lógica clásica ambas implicaciones son válidas.

  - **Aplicación en simplificación algebraica**: Permite reducir expresiones como $\neg\neg(p \land q) \equiv p \land q$.

  '
ejemplo_guiado:
  enunciado: 'Demuestra mediante tabla de verdad que la fórmula $\neg(\neg p) \leftrightarrow p$ es una tautología.


    ![Diagrama: Ley de Doble Negación](/static/img/nodos/ley-de-doble-negacion-ejemplos.svg)'
  pasos:
  - 'Paso 1: Colocar la columna base para $p$: Fila 1 = $V$, Fila 2 = $F$.'
  - 'Paso 2: Calcular la primera negación $\neg p$: Fila 1 $\neg V = F$, Fila 2 $\neg F = V$. Columna: $[F, V]^T$.'
  - 'Paso 3: Calcular la segunda negación $\neg(\neg p)$: Fila 1 $\neg F = V$, Fila 2 $\neg V = F$. Columna: $[V, F]^T$.'
  - 'Paso 4: Evaluar el bicondicional $\neg(\neg p) \leftrightarrow p$: - Fila 1 ($V \leftrightarrow V$): $V$ - Fila 2 ($F \leftrightarrow F$): $V$'
  - 'Paso 5: Concluir que el vector resultante es $[V, V]^T$, lo que demuestra formalmente que la doble negación es una tautología.'
