semantic_id: MAT.ALG.FRACCIONES_RESTA.CAMBIO_SIGNOS_NUMERADOR
resumen_inicial: 'Cambio de signos en el numerador sustraído: concepto, reglas operativas
  y simplificación en Sustracción de fracciones algebraicas.'
explicacion_simple: El trabajo no termina al plantear la resta con su paréntesis protector.
  Hay que abrir las puertas y dejar que el signo negativo haga su trabajo destructivo/constructivo.
explicacion_formal: '### Definición formal


  Es la definición de la distribución de un signo negativo.


  ### Desarrollo didáctico


  La mecánica del cambio de signos es tu escudo protector al operar el numerador de
  una resta.


  Veámoslo en cámara lenta:

  Tienes la expresión en el numerador: $x^2 - 3x - (2x^2 - 5x + 1)$.


  El signo menos actúa como un ''inversor universal'' multiplicando por $-1$.

  - El $2x^2$ positivo se voltea a $-2x^2$.

  - El $-5x$ negativo se voltea a $+5x$.

  - El $+1$ positivo se voltea a $-1$.


  El numerador sin paréntesis queda: $x^2 - 3x - 2x^2 + 5x - 1$.

  Ahora puedes reducir términos semejantes tranquilo. Si dominas esto sistemáticamente
  sin saltarte pasos, serás invulnerable en las restas algebraicas.'
definiciones_clave: '- **Cambio de signos en el numerador sustraído**: Procedimiento
  o concepto clave en el cálculo de fracciones algebraicas.'
propiedades_relaciones: '- **Propiedades de fracciones y divisibilidad**: Restricciones
  de dominio, factorización y MCD/MCM aplicados a cambio de signos en el numerador
  sustraído.'
ejemplo_guiado:
  enunciado: Simplifica o resuelve la expresión aplicando cambio de signos en el numerador
    sustraído.
  pasos:
  - Factorizar los numeradores y denominadores involucrados.
  - Identificar restricciones del dominio (denominador no nulo).
  - Aplicar la regla o procedimiento correspondiente a cambio de signos en el numerador
    sustraído.
  - Simplificar los factores comunes y escribir el resultado final irreducible.
