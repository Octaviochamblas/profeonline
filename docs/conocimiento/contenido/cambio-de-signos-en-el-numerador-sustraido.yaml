semantic_id: MAT.ALG.FRACCIONES_RESTA.CAMBIO_SIGNOS_NUMERADOR
resumen_inicial: Al restar un polinomio numerador, el signo negativo antecedente cambia
  obligatoriamente el signo de todos sus términos.
explicacion_simple: 'Cuando tenemos una resta como $A - (2x - 5)$, debemos aplicar
  la propiedad del cambio de signo:

  El término $+2x$ pasa a ser $-2x$, y el término $-5$ pasa a ser $+5$.

  Si olvidamos cambiar el signo de alguno de los términos, toda la suma de términos
  semejantes del numerador quedará descompensada.'
explicacion_formal: 'Dada la resta $A(x) - (B_1 x + B_0)$, la **regla de inversión
  de signos del sustraendo** exige:


  $$-(B_1 x + B_0) = -B_1 x - B_0 \quad \text{y} \quad -(B_1 x - B_0) = -B_1 x + B_0$$


  **Desglose de la fórmula:**

  - Inversión total de los coeficientes del polinomio ubicado en el numerador sustraído.'
definiciones_clave: '- **Inversión de signos del sustraendo**: Transformación de todos
  los signos positivos a negativos y negativos a positivos al quitar el paréntesis.'
propiedades_relaciones: '- **Consistencia algebraica**: Garantiza que la resta mantenga
  el mismo valor numérico al evaluar la variable.'
ejemplo_guiado:
  enunciado: Aplica el cambio de signos al restar $\frac{4x + 1}{x + 2} - \frac{x
    - 3}{x + 2}$ y evalúa para $x = 3$.
  pasos:
  - 'Paso 1: Escribir la resta de numeradores: $\frac{(4x + 1) - (x - 3)}{x + 2}$.Paso
    2: Cambiar el signo a ambos términos del segundo numerador: $4x + 1 - x + 3$.Paso
    3: Reducir términos semejantes: $4x - x = 3x$ y $1 + 3 = 4 \implies \frac{3x +
    4}{x + 2}$.Paso 4: Evaluar para $x = 3$: $\frac{3(3) + 4}{3 + 2} = \frac{9 + 4}{5}
    = \frac{13}{5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión reducida correcta al restar $\frac{4x + 1}{x + 2}
    - \frac{x - 3}{x + 2}$?
  choices:
  - text: $\frac{3x + 4}{x + 2}$
    is_correct: true
  - text: $\frac{3x - 2}{x + 2}$
    is_correct: false
  - text: $\frac{5x + 4}{x + 2}$
    is_correct: false
  - text: $\frac{3x - 4}{x + 2}$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{3x + 4}{x + 2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la resta reducida $\frac{3x + 4}{x + 2}$ para $x = 3$, ¿cuál
    es el resultado?
  choices:
  - text: $\frac{13}{5}$
    is_correct: true
  - text: $\frac{7}{5}$
    is_correct: false
  - text: $\frac{13}{6}$
    is_correct: false
  - text: $3$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{13}{5}$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar paréntesis al polinomio del segundo numerador.'
- 'Paso 2: Quitar el paréntesis invirtiendo el signo de cada término.'
- 'Paso 3: Sumar/restar términos semejantes en el numerador.'
errores_correccion: '- **Error común:** Dejar el término independiente con el signo
  equivocado.

  - **Cómo corregirlo:** Recuerda que el signo menos invierte TODOS los signos dentro
  del paréntesis.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de sustracción.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de sustracción.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿El signo menos afecta a todo el segundo numerador?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la ley distributiva de la resta.
- titulo: ¿Es conmutativa la sustracción de fracciones?
  respuesta: 'No'
  solucion_pasos:
  - No, restar $A - B$ da un resultado opuesto a $B - A$.
errores_frecuentes:
- Restar los denominadores al realizar la sustracción de fracciones algebraicas.
- Olvidar colocar paréntesis en el segundo numerador al restar.
- Cambiar solo el signo del primer término del sustraendo.
- Restar numeradores de fracciones de distinto denominador sin homogeneizar.
- Confundir el m.c.m. con el producto simple de los denominadores.
afirmaciones_verdaderas:
- Al restar fracciones algebraicas se conserva el denominador común y se restan los
  numeradores.
- El signo negativo de la sustracción invierte el signo de todos los términos del
  segundo numerador.
al_terminar_debes_poder: Al finalizar este recurso podrás efectuar sustracciones de
  fracciones algebraicas aplicando correctamente la distribución de signos y simplificación
  del resultado.
fuente: Texto escolar MINEDUC — Álgebra / Fracciones Algebraicas
estado: publicado
