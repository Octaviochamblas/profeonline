semantic_id: MAT.ALG.FRACCIONES_RESTA.CAMBIO_SIGNOS_NUMERADOR
resumen_inicial: Al restar un polinomio numerador, el signo negativo antecedente cambia obligatoriamente el signo de todos
  sus términos.
explicacion_simple: 'Cuando realizamos una sustracción como $A - (2x - 5)$, debemos aplicar la propiedad del cambio de signo.


  El término $+2x$ pasa a ser $-2x$, mientras que el término $-5$ se transforma en $+5$.


  Si se omite la inversión de signo en cualquier término del sustraendo, el polinomio total resultante en el numerador quedará
  alterado de forma incorrecta.


  ![Cambio de signos en el numerador sustraído](/static/img/nodos/cambio-de-signos-en-el-numerador-sustraido-intro.svg)

  '
explicacion_formal: '### Definición formal

  Dada la resta $A(x) - (B_1 x + B_0)$, la **regla de inversión de signos del sustraendo** exige:


  $$-(B_1 x + B_0) = -B_1 x - B_0 \quad \text{y} \quad -(B_1 x - B_0) = -B_1 x + B_0$$


  ### Desglose de la fórmula

  - Inversión total de los coeficientes del polinomio ubicado en el numerador sustraído.


  ### Síntesis didáctica

  Distribuir el signo negativo antecedente transforma cada término positivo en negativo y viceversa dentro del sustraendo.

  '
definiciones_clave: '- **Inversión de signos del sustraendo**: Transformación de todos los signos positivos a negativos y
  negativos a positivos al quitar el paréntesis.

  '
propiedades_relaciones: '- **Consistencia algebraica**: Garantiza que la resta mantenga el mismo valor numérico al evaluar
  la variable en cualquier punto del dominio.

  '
ejemplo_guiado:
  enunciado: Aplica el cambio de signos al restar $\frac{4x + 1}{x + 2} - \frac{x - 3}{x + 2}$ y evalúa para $x = 3$.
  pasos:
  - 'Paso 1: Escribir la resta de numeradores: $\frac{(4x + 1) - (x - 3)}{x + 2}$.'
  - 'Paso 2: Cambiar el signo a ambos términos del segundo numerador: $4x + 1 - x + 3$.'
  - 'Paso 3: Reducir términos semejantes: $4x - x = 3x$ y $1 + 3 = 4 \implies \frac{3x + 4}{x + 2}$.'
  - 'Paso 4: Evaluar para $x = 3$: $\frac{3(3) + 4}{3 + 2} = \frac{9 + 4}{5} = \frac{13}{5}$.'
  imagen: /static/img/nodos/cambio-de-signos-en-el-numerador-sustraido-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la expresión reducida correcta al restar $\frac{4x + 1}{x + 2} - \frac{x - 3}{x + 2}$?
  choices:
  - text: $\frac{3x + 4}{x + 2}$
    is_correct: true
  - text: $\frac{3x - 2}{x + 2}$
    is_correct: false
  - text: $\frac{5x + 4}{x + 2}$
    is_correct: false
  - text: $\frac{3x - 4}{x + 2}$
    is_correct: false
  explanation: La alternativa correcta es $\frac{3x + 4}{x + 2}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar la resta reducida $\frac{3x + 4}{x + 2}$ para $x = 3$, ¿cuál es el resultado?
  choices:
  - text: $\frac{13}{5}$
    is_correct: true
  - text: $\frac{7}{5}$
    is_correct: false
  - text: $\frac{13}{6}$
    is_correct: false
  - text: $3$
    is_correct: false
  explanation: La alternativa correcta es $\frac{13}{5}$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Colocar paréntesis al polinomio del segundo numerador.'
- 'Paso 2: Quitar el paréntesis invirtiendo el signo de cada término.'
- 'Paso 3: Sumar/restar términos semejantes en el numerador.'
errores_correccion: '- **Error 1:** $-(x - 3) = -x - 3$. **Corrección:** $-(x - 3) = -x + 3$.

  - **Error 2:** Alterar los signos del minuendo al restar. **Corrección:** El minuendo mantiene su estructura original; la
  inversión solo afecta al sustraendo.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo queda el sustraendo $-(3x - 8)$ tras aplicar la regla de cambio de signo?
  alternativas:
  - $-3x + 8$
  - $-3x - 8$
  - $3x + 8$
  respuesta: $-3x + 8$
  solucion_pasos:
  - 1. Invertir $+3x \implies -3x$.
  - 2. Invertir $-8 \implies +8$.
  - '3. Resultado: $-3x + 8$.'
- titulo: Ejemplo 2
  enunciado: Al simplificar el numerador $2x - (4 - x)$, ¿cuál es la expresión reducida?
  alternativas:
  - $3x - 4$
  - $x - 4$
  - $3x + 4$
  respuesta: $3x - 4$
  solucion_pasos:
  - '1. Invertir signos: $2x - 4 + x$.'
  - '2. Sumar términos semejantes: $2x + x = 3x \implies 3x - 4$.'
- titulo: Inversión de signo en constante
  enunciado: ¿Un término independiente negativo pasa a ser positivo tras la negación del paréntesis?
  respuesta: Sí
  solucion_pasos:
  - Sí, el signo negativo antecedente multiplica por $-1$ a la constante.
- titulo: Conservación del minuendo
  enunciado: ¿Los términos del primer numerador sufren cambios de signo durante la resta?
  respuesta: 'No'
  solucion_pasos:
  - No, el minuendo conserva intactos todos sus signos.
errores_frecuentes:
- Al retirar el paréntesis en la expresión $-(x-3)$, el resultado reducido es $-x-3$.
- En la resta $\frac{4x+1}{x+2} - \frac{x-3}{x+2}$, la inversión de signo afecta solo al primer término produciendo $4x+1-x-3$.
- El signo menos que antecede al sustraendo invierte también los signos del numerador minuendo.
- Al simplificar $2x - (4-x)$, la distribución de la negación resulta en $x-4$.
- Al negar un término independiente negativo como $-(-5)$, el signo resultante permanece negativo $-5$.
afirmaciones_verdaderas:
- La negación de un paréntesis sustraendo invierte el signo de cada uno de sus componentes polinomiales.
- El cambio de signo en el sustraendo preserva la equivalencia funcional de la expresión racional.
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/cambio-de-signos-en-el-numerador-sustraido-resumen.svg)


  QUÉ: Efectuar la inversión de signos en el numerador sustraído.

  CÓMO: Invertir la totalidad de los signos del polinomio sustraendo al retirar los paréntesis ($-(B_1 x^k + \dots + B_0)
  = -B_1 x^k - \dots - B_0$) para agrupar términos semejantes sin errores de signo.

  '
