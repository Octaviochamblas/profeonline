procedimiento:
- 'Paso 1: Observa el polinomio que está precedido por el signo menos (o por un número
  negativo).'
- 'Paso 2: Reescribe el polinomio completo, cambiando los + por - y los - por +.'
- 'Paso 3: Si había un número multiplicando (ej. $-4(x+2)$), distribuye el número
  con todo y su signo negativo.'
errores_correccion: Evita 'cancelar' términos que se están sumando; solo se pueden
  simplificar factores en cambio de signos en el numerador sustraído.
ejemplos:
- titulo: 'Limpia el numerador: $5x - (3x^2 - 4x + 1)$'
  enunciado: 'Limpia el numerador: $5x - (3x^2 - 4x + 1)$.'
  solucion_pasos:
  - El $3x^2$ sale como $-3x^2$.
  - El $-4x$ sale como $+4x$.
  - El $+1$ sale como $-1$.
  - 'Resultado: $5x - 3x^2 + 4x - 1 = -3x^2 + 9x - 1$.'
- titulo: Distribuye el menos en $- ( -2a - 3b )$.
  solucion_pasos:
  - Menos por menos da más en ambos casos.
- titulo: 'Respecto de «Cambio de signos en el numerador sustraído»: ¿Es correcta
    esta caracterización?'
  enunciado: 'Respecto de «Cambio de signos en el numerador sustraído»: ¿Es correcta
    esta caracterización? «Al quitar el paréntesis del segundo numerador en una resta,
    todos y cada uno de los términos dentro del paréntesis deben invertir su signo
    matemático»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: Al quitar el paréntesis del
    segundo numerador en una resta, todos y cada uno de los términos dentro del paréntesis
    deben invertir su signo matemático.'
- titulo: 'Respecto de «Cambio de signos en el numerador sustraído»: ¿Es válida esta
    afirmación? «Inver'
  enunciado: 'Respecto de «Cambio de signos en el numerador sustraído»: ¿Es válida
    esta afirmación? «Invertir el signo solo del primer término y copiar el resto
    igual (el error clásico)»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: Al quitar el paréntesis del
    segundo numerador en una resta, todos y cada uno de los términos dentro del paréntesis
    deben invertir su signo matemático.'
errores_frecuentes:
- Invertir el signo solo del primer término y copiar el resto igual (el error clásico).
- Restando solo el primer término.
- Para «Cuando tienes un signo de resta delante de un polinomio entre paréntesis,
  matemáticamente estás:», la respuesta correcta es Dividiendo el polinomio entre
  1.
- Elevando todo a -1.
- $x^2 - 5x$.
afirmaciones_verdaderas:
- La simplificación de fracciones algebraicas requiere que los términos estén expresados
  como producto de factores.
al_terminar_debes_poder: Operar y simplificar expresiones racionales aplicando cambio
  de signos en el numerador sustraído.
