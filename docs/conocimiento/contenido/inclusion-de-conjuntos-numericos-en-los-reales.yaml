guide:
  profile: 'teorico-interactivo-v1'
meta:
  code: '02.04.02.03'
  title: 'Inclusión de conjuntos numéricos en los reales'
  description: 'Comprende las relaciones de inclusión entre los conjuntos numéricos N, Z, Q, I y R (N ⊂ Z ⊂ Q ⊂ R y I ⊂ R).'
  subject: 'Matemática'
  axis: 'Números'
  level: 'M1-M2'
  slug: 'inclusion-de-conjuntos-numericos-en-los-reales'
semantic_id: 'MAT.NUM.REALES.INCLUSION_CONJUNTOS_NUMERICOS'
titulo: 'Inclusión de conjuntos numéricos en los reales'
objetivo: 'Identificar y justificar las relaciones de inclusión entre los conjuntos de los números naturales ($\mathbb{N}$), enteros ($\mathbb{Z}$), racionales ($\mathbb{Q}$), irracionales ($\mathbb{I}$) y reales ($\mathbb{R}$).'
introduccion: 'A lo largo de la historia de las matemáticas, los conjuntos numéricos se han ido ampliando para resolver ecuaciones que no tenían solución en el conjunto anterior. Empezamos contando con los naturales ($\mathbb{N}$), agregamos los negativos y el cero para formar los enteros ($\mathbb{Z}$), incluimos las divisiones no exactas para obtener los racionales ($\mathbb{Q}$), y finalmente unimos los irracionales ($\mathbb{I}$) para completar los números reales ($\mathbb{R}$). Esta jerarquía se expresa mediante la cadena de inclusiones contiguas.'
resumen: 'La jerarquía de inclusión entre los conjuntos numéricos está dada por: $$\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$$ Además, los irracionales forman un subconjunto disjunto de los racionales dentro de los reales: $\mathbb{I} \subset \mathbb{R}$, con $\mathbb{Q} \cap \mathbb{I} = \emptyset$.'
requisitos:
  - 'Definición de subconjunto e inclusión ($\subset$).'
  - 'Conocimiento de los conjuntos $\mathbb{N}, \mathbb{Z}, \mathbb{Q}, \mathbb{I}, \mathbb{R}$.'
objetivos:
  - 'Representar la inclusión de conjuntos numéricos mediante diagramas de Venn.'
  - 'Determinar la verdad o falsedad de proposiciones de pertenencia e inclusión.'
que_aprenderas:
  - 'La relación jerárquica de inclusión $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$.'
  - 'Por qué todo número natural es automáticamente entero, racional y real.'
  - 'La ubicación del conjunto de los irracionales $\mathbb{I}$ dentro de $\mathbb{R}$.'
al_terminar_debes_poder:
  - 'Evaluar correctamente proposiciones como $\mathbb{Z} \subset \mathbb{Q}$ o $\sqrt{3} \in \mathbb{R}$.'
  - 'Ubicar cualquier número en su conjunto numérico más restringido y en sus conjuntos contenedores.'
checkpoints:
  - placement: 'after_explicacion_formal'
    question: '¿Cuál de las siguientes relaciones de inclusión entre conjuntos numéricos es CORRECTA?'
    choices:
      - {text: '$\mathbb{R} \subset \mathbb{Q} \subset \mathbb{Z} \subset \mathbb{N}$', is_correct: false}
      - {text: '$\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$', is_correct: true}
      - {text: '$\mathbb{Q} \subset \mathbb{I} \subset \mathbb{R}$', is_correct: false}
      - {text: '$\mathbb{Z} \subset \mathbb{N} \subset \mathbb{R}$', is_correct: false}
    explanation: 'La correcta es: $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$. Los naturales están contenidos en los enteros, estos en los racionales, y todos ellos en los números reales.'
    reinforcement_section: 'Explicación formal'
  - placement: 'after_ejemplo_guiado'
    question: 'Si un número $n$ pertenece al conjunto de los números naturales ($n \in \mathbb{N}$), ¿cuál de las siguientes afirmaciones es FALSA?'
    choices:
      - {text: '$n$ pertenece a los números enteros ($n \in \mathbb{Z}$).', is_correct: false}
      - {text: '$n$ pertenece a los números racionales ($n \in \mathbb{Q}$).', is_correct: false}
      - {text: '$n$ pertenece a los números irracionales ($n \in \mathbb{I}$).', is_correct: true}
      - {text: '$n$ pertenece a los números reales ($n \in \mathbb{R}$).', is_correct: false}
    explanation: 'La correcta es: $n$ pertenece a los números irracionales ($n \in \mathbb{I}$). Puesto que $\mathbb{N} \subset \mathbb{Q}$ y $\mathbb{Q} \cap \mathbb{I} = \emptyset$, ningún número natural puede ser irracional.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el conjunto más específico o restringido al que pertenece el número.'
  - 'Paso 2: Aplicar la cadena de inclusión $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$ (o la vía de los irracionales $\mathbb{I} \subset \mathbb{R}$).'
  - 'Paso 3: Concluir que el número pertenece a ese conjunto específico y a todos los conjuntos que lo contienen en la jerarquía superior.'
errores_frecuentes:
  - 'Creer que un número solo pertenece a un único conjunto (por ejemplo, pensar que $5$ solo es natural y no es racional ni real).'
  - 'Invertir el sentido del símbolo de inclusión (confundir $\mathbb{N} \subset \mathbb{Z}$ con $\mathbb{Z} \subset \mathbb{N}$).'
errores_correccion: 'Es un error común olvidar que los conjuntos numéricos están anidados. El número $7$ es natural ($7 \in \mathbb{N}$), pero al estar $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$, el $7$ **también es entero, es racional ($7 = \frac{7}{1}$) y es real**.'
ejemplos:
  - titulo: 'Pertenencia múltiple de un número'
    enunciado: '¿A cuáles de los siguientes conjuntos numéricos pertenece el número $-4$?'
    alternativas:
      - 'Solo a $\mathbb{Z}$'
      - 'A $\mathbb{Z}$, $\mathbb{Q}$ y $\mathbb{R}$'
      - 'A $\mathbb{N}$, $\mathbb{Z}$ y $\mathbb{Q}$'
      - 'A $\mathbb{Z}$ e $\mathbb{I}$'
    respuesta: 'A $\mathbb{Z}$, $\mathbb{Q}$ y $\mathbb{R}$'
    solucion_pasos:
      - '$-4$ es un número entero negativo, por lo que $-4 \in \mathbb{Z}$.'
      - 'Como $\mathbb{Z} \subset \mathbb{Q}$, $-4 = -\frac{4}{1} \in \mathbb{Q}$.'
      - 'Como $\mathbb{Q} \subset \mathbb{R}$, $-4 \in \mathbb{R}$.'
      - 'Por ende, $-4$ pertenece a $\mathbb{Z}$, a $\mathbb{Q}$ y a $\mathbb{R}$. No es natural ($\notin \mathbb{N}$) ni irracional ($\notin \mathbb{I}$).'
  - titulo: 'Veracidad de inclusiones'
    enunciado: '¿Cuál de las siguientes afirmaciones de teoría de conjuntos es VERDADERA?'
    alternativas:
      - '$\\mathbb{Q} \\cap \\mathbb{Z} = \\emptyset$'
      - '$\\mathbb{Z} \\cup \\mathbb{N} = \\mathbb{Q}$'
      - '$\\mathbb{N} \\subset \\mathbb{Q}$'
      - '$\\mathbb{I} \\subset \\mathbb{Q}$'
    respuesta: '$\\mathbb{N} \\subset \\mathbb{Q}$'
    solucion_pasos:
      - 'Dado que $\mathbb{N} \subset \mathbb{Z}$ y $\mathbb{Z} \subset \mathbb{Q}$, por transitividad todo número natural es un número racional, de modo que $\mathbb{N} \subset \mathbb{Q}$ es verdadera.'
      - '$\mathbb{Q} \cap \mathbb{Z} = \mathbb{Z}$ (no vacío).'
      - '$\mathbb{I} \subset \mathbb{Q}$ es falsa pues son disjuntos.'
comprobacion_rapida:
  - afirmacion: 'El conjunto de los números enteros $\mathbb{Z}$ es un subconjunto de los números racionales $\mathbb{Q}$.'
    respuesta: true
    explicacion: 'Correcto. Todo entero $z$ se escribe como $\frac{z}{1}$, luego $\mathbb{Z} \subset \mathbb{Q}$.'
  - afirmacion: 'El número $\sqrt{3}$ pertenece tanto a $\mathbb{I}$ como a $\mathbb{R}$.'
    respuesta: true
    explicacion: 'Correcto. $\sqrt{3}$ es un irracional y dado que $\mathbb{I} \subset \mathbb{R}$, también es real.'
  - afirmacion: 'Existen números enteros que son irracionales.'
    respuesta: false
    explicacion: 'Falso. Ningún entero es irracional. $\mathbb{Z} \subset \mathbb{Q}$ e $\mathbb{I}$ es totalmente disjunto de $\mathbb{Q}$.'
fuente: 'Currículum Nacional MINEDUC — Matemática M1-M2, números reales.'
estado: 'publicado'
