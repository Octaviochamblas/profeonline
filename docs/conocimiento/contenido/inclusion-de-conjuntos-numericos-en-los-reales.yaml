semantic_id: MAT.NUM.REALES.INCLUSION_CONJUNTOS_NUMERICOS
resumen_inicial: 'Los conjuntos numéricos estándar cumplen la cadena de inclusiones
  contiguas: $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$.'
explicacion_simple: Los conjuntos numéricos se organizan como muñecas rusas (muñecas
  matrioska) donde cada uno está guardado dentro del siguiente. Los naturales están
  dentro de los enteros, los enteros están dentro de los racionales, y todos los racionales
  e irracionales están guardados dentro del gran conjunto de los números reales.
explicacion_formal: 'La **Jerarquía de Inclusión Numérica** establece la cadena estricta
  de contenencia en $\mathbb{R}$:


  $$\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R} \quad \text{y}
  \quad \mathbb{I} \subset \mathbb{R}$$


  **Desglose de la jerarquía:**

  - $\mathbb{N} = \{1, 2, 3, \dots\}$: Números naturales para contar.

  - $\mathbb{Z} = \{\dots, -2, -1, 0, 1, 2, \dots\}$: Enteros positivos, negativos
  y cero.

  - $\mathbb{Q} = \left\{ \frac{a}{b} \mid a,b \in \mathbb{Z}, b \neq 0 \right\}$:
  Racionales fraccionarios.

  - $\mathbb{R} = \mathbb{Q} \cup \mathbb{I}$: Universo continuo de los reales.


  > **Complemento didáctico:** Todo número entero es automáticamente un número racional
  ($z = \frac{z}{1}$) y a su vez un número real.'
definiciones_clave: '- **Cadena de inclusión numérica**: Relación $\mathbb{N} \subset
  \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$ que jerarquiza las familias de
  números.'
propiedades_relaciones: '- **Cadena jerárquica**: $\mathbb{N} \subset \mathbb{Z} \subset
  \mathbb{Q} \subset \mathbb{R}$.'
ejemplo_guiado:
  enunciado: Verifique la inclusión del número natural $5$ en todos los conjuntos
    de la cadena $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$.
  pasos:
  - 'Paso 1: Comprobar pertenencia a $\mathbb{N}$: $5 \in \mathbb{N}$ (número natural
    de conteo).'
  - 'Paso 2: Comprobar pertenencia a $\mathbb{Z}$: como $\mathbb{N} \subset \mathbb{Z}$,
    entonces $5 \in \mathbb{Z}$ (entero positivo).'
  - 'Paso 3: Comprobar pertenencia a $\mathbb{Q}$: $5 = \frac{5}{1} \implies 5 \in
    \mathbb{Q}$ (racional).'
  - 'Paso 4: Comprobar pertenencia a $\mathbb{R}$: como $\mathbb{Q} \subset \mathbb{R}$,
    entonces $5 \in \mathbb{R}$ (real).'
  - 'Conclusión: El número 5 pertenece simultáneamente a $\mathbb{N}, \mathbb{Z},
    \mathbb{Q}$ y $\mathbb{R}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la cadena de inclusión correcta entre los conjuntos N, Z, Q y
    R?
  choices:
  - text: N subconjunto de Z subconjunto de Q subconjunto de R
    is_correct: true
  - text: R subconjunto de Q subconjunto de Z subconjunto de N
    is_correct: false
  - text: Z subconjunto de N subconjunto de R
    is_correct: false
  - text: Q subconjunto de N
    is_correct: false
  explanation: La alternativa correcta es 'N subconjunto de Z subconjunto de Q subconjunto
    de R'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para el número 5, ¿por qué pertenece también a Q
    y R?
  choices:
  - text: Porque 5 = 5/1 es racional y por inclusión N subconjunto de Z subconjunto
      de Q subconjunto de R
    is_correct: true
  - text: Porque 5 es un decimal infinito no periódico
    is_correct: false
  - text: Because es irracional
    is_correct: false
  - text: No pertenece a R
    is_correct: false
  explanation: La alternativa correcta es 'Porque 5 = 5/1 es racional y por inclusión
    N subconjunto de Z subconjunto de Q subconjunto de R'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el conjunto más específico al que pertenece el número (ej:
  $\mathbb{N}$).'
- 'Paso 2: Aplicar la propiedad transitiva de la inclusión de conjuntos.'
- 'Paso 3: Declarar la pertenencia del número a todos los conjuntos contenedores superiores
  en la jerarquía.'
errores_correccion: '- **Error 1: Invertir el sentido de inclusión (decir que $\mathbb{R}
  \subset \mathbb{N}$).** **Cómo corregirlo:** El conjunto más pequeño está contenido
  en el más grande ($\mathbb{N} \subset \mathbb{R}$).


  - **Error 2: Pensar que los números irracionales están contenidos en $\mathbb{Q}$.**
  **Cómo corregirlo:** $\mathbb{I}$ es disjunto con $\mathbb{Q}$, pero AMBOS están
  contenidos en $\mathbb{R}$ ($\mathbb{I} \subset \mathbb{R}$ y $\mathbb{Q} \subset
  \mathbb{R}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si $-3 \in \mathbb{Z}$, ¿pertenece $-3$ a los conjuntos $\mathbb{Q}$
    y $\mathbb{R}$?
  alternativas:
  - Sí, porque Z subconjunto de Q subconjunto de R
  - Solo a Q
  - No, solo a Z
  respuesta: Sí, porque Z subconjunto de Q subconjunto de R
  solucion_pasos:
  - $-3 = -3/1 \in \mathbb{Q} \subset \mathbb{R}$.
- titulo: Ejemplo 2
  enunciado: ¿Es el conjunto de los enteros Z un subconjunto de los irracionales I?
  alternativas:
  - No, Z es subconjunto de Q y Q es disjunto con I
  - Sí, son iguales
  - Solo los enteros negativos
  respuesta: No, Z es subconjunto de Q y Q es disjunto con I
  solucion_pasos:
  - $\mathbb{Z} \subset \mathbb{Q}$ y $\mathbb{Q} \cap \mathbb{I} = \emptyset$.
- titulo: ¿Está el conjunto N de los naturales totalmente contenido en los reales
    R?
  respuesta: Sí
  solucion_pasos:
  - Sí, $\mathbb{N} \subset \mathbb{R}$.
- titulo: ¿Es todo número natural un número real?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la inclusión de conjuntos numéricos.
errores_frecuentes:
- El conjunto de los números reales es un subconjunto propio del conjunto de los números
  naturales.
- Los números enteros negativos no pertenecen al conjunto de los números racionales.
- El conjunto de los irracionales contiene totalmente al conjunto de los números enteros.
- Un número que pertenece a los naturales no forma parte del conjunto de los reales.
- La inclusión de conjuntos indica que los racionales son un subconjunto de los enteros.
afirmaciones_verdaderas:
- La cadena de inclusión de los conjuntos numéricos es $\mathbb{N} \subset \mathbb{Z}
  \subset \mathbb{Q} \subset \mathbb{R}$.
- Tanto los números racionales $\mathbb{Q}$ como los irracionales $\mathbb{I}$ están
  contenidos en el conjunto de los reales $\mathbb{R}$.
al_terminar_debes_poder: Al terminar serás capaz de justificar la jerarquía de inclusión
  de los conjuntos numéricos ($\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset
  \mathbb{R}$), determinando la pertenencia múltiple de cualquier número.
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES.
