semantic_id: MAT.NUM.REALES.INCLUSION_CONJUNTOS_NUMERICOS
resumen_inicial: 'Existe una jerarquía de inclusión entre los conjuntos numéricos
  principales: $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$.'
explicacion_simple: 'Los conjuntos numéricos se contienen unos dentro de otros como
  muñecas rusas:

  1. **Naturales ($\mathbb{N}$)**: $1, 2, 3...$

  2. **Enteros ($\mathbb{Z}$)**: Contiene a los naturales, el cero y los negativos
  ($-2, -1, 0, 1, 2...$).

  3. **Racionales ($\mathbb{Q}$)**: Contiene a los enteros y a las fracciones/decimales.

  4. **Reales ($\mathbb{R}$)**: Contiene a los racionales y a los irracionales ($\mathbb{I}$).'
explicacion_formal: La relación de inclusión de conjuntos numéricos establece la cadena
  estricta $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$.
  Asimismo $\mathbb{I} \subset \mathbb{R}$, de modo que $\mathbb{R}$ contiene a todos
  los subsistemas numéricos reales.
definiciones_clave: '- **Cadena de inclusión**: $\mathbb{N} \subset \mathbb{Z} \subset
  \mathbb{Q} \subset \mathbb{R}$.'
propiedades_relaciones: '- **Pertenencia heredada**: Todo número natural es también
  entero, racional y real.'
ejemplo_guiado:
  enunciado: Clasifica el número $5$ en todos los conjuntos numéricos a los que pertenece.
  pasos:
  - $5$ es un número de conteo positivo $\implies 5 \in \mathbb{N}$.
  - Como $\mathbb{N} \subset \mathbb{Z}$, también $5 \in \mathbb{Z}$.
  - Como $\mathbb{Z} \subset \mathbb{Q}$ (se escribe $5/1$), también $5 \in \mathbb{Q}$.
  - Como $\mathbb{Q} \subset \mathbb{R}$, también $5 \in \mathbb{R}$.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la cadena de inclusión correcta de los conjuntos numéricos?
  choices:
  - text: N ⊂ Z ⊂ Q ⊂ R
    is_correct: true
  - text: R ⊂ Q ⊂ Z ⊂ N
    is_correct: false
  - text: N ⊂ Q ⊂ Z ⊂ R
    is_correct: false
  - text: Z ⊂ N ⊂ Q ⊂ R
    is_correct: false
  explanation: 'La correcta es: N ⊂ Z ⊂ Q ⊂ R. Los Naturales están contenidos en los
    Enteros, estos en los Racionales y todos en los Reales.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Es el número $-8$ un número racional?
  choices:
  - text: Sí, porque es entero (Z ⊂ Q) y se puede escribir como -8/1
    is_correct: true
  - text: No, porque es negativo y solo los positivos son racionales
    is_correct: false
  - text: No, es un número irracional
    is_correct: false
  - text: Sí, pero no es un número real
    is_correct: false
  explanation: 'La correcta es: Sí, porque es entero (Z ⊂ Q) y se puede escribir como
    -8/1. Todo entero es racional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el conjunto más restrictivo al que pertenece el número (ej:
  $\mathbb{N}$).'
- 'Paso 2: Aplicar la cadena de inclusión $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q}
  \subset \mathbb{R}$ para determinar todos los conjuntos contenedores.'
errores_correccion: No digas que un entero no es racional. Todo número entero $z$
  se puede escribir como la fracción $z/1$, por lo que **sí es racional**.
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Es $\mathbb{Z} \subset \mathbb{R}$?
  alternativas:
  - Verdadero
  - Falso
  respuesta: Verdadero
  solucion_pasos:
  - Todos los enteros forman parte de los números reales.
errores_frecuentes:
- Creer que los números enteros no son racionales.
afirmaciones_verdaderas:
- $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$.
al_terminar_debes_poder: Ubicar números en la jerarquía de inclusión de conjuntos
  numéricos.
fuente: Texto escolar MINEDUC.
estado: publicado
