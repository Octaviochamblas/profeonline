semantic_id: MAT.GEO.CIRCULO_RECTAS.TANGENTES_PUNTO_EXTERIOR_CONGRUENTES
resumen_inicial: Los dos segmentos tangentes trazados desde un mismo punto exterior hacia una circunferencia son congruentes entre sí (PA = PB).
explicacion_simple: 'Imagina una circunferencia con un punto exterior $P$ arriba, como una persona con un gorro en punta: desde ese punto $P$ puedes trazar exactamente **dos rectas tangentes** que abrazan a la circunferencia por los costados, tocándola en los puntos $A$ y $B$.


  Este famoso resultado se conoce en matemáticas como el **Teorema del Sombrero**: **los dos brazos de la tangente miden exactamente lo mismo ($PA = PB$)**. Además, la línea que une el punto exterior con el centro ($OP$) es un eje de simetría perfecto: corta por la mitad al ángulo exterior $\angle APB$ y al ángulo central $\angle AOB$. ¡Y una regla de oro extra: el ángulo del centro y el ángulo exterior suman siempre $180^\circ$!


  ![Tangentes desde un punto exterior](/static/img/nodos/propiedad-de-congruencia-de-segmentos-tangentes-trazados-desde-un-mismo-punto-exterior-intro.svg)

  '
explicacion_formal: "### Teorema de los segmentos tangentes (Teorema del sombrero)\nSea $\\mathcal{C}(O, r)$ una circunferencia y sea $P$ un punto coplanar exterior ($d(P, O) > r$). Si $\\overline{PA}$ y $\\overline{PB}$ son los dos segmentos de tangencia trazados desde $P$ con puntos de contacto $A, B \\in \\mathcal{C}$, entonces:\n$$\\overline{PA} \\cong \\overline{PB} \\iff PA = PB$$\n\n### Demostración por congruencia de triángulos rectángulos\n1. Trácense los radios $\\overline{OA}$ y $\\overline{OB}$ y el segmento común $\\overline{OP}$.\n2. Por el teorema de perpendicularidad radio-tangente: $\\angle OAP = 90^\\circ$ y $\\angle OBP = 90^\\circ$.\n3. En los triángulos rectángulos $\\triangle OAP$ y $\\triangle OBP$:\n   - Comparten la misma hipotenusa: $\\overline{OP} \\cong \\overline{OP}$.\n   - Tienen catetos radiales congruentes: $OA = OB = r$.\n4. Por el criterio de congruencia Hipotenusa-Cateto (o LLR), los triángulos son congruentes:\n$$\\triangle OAP \\cong \\triangle OBP$$\n\
  5. En consecuencia, sus lados homólogos son congruentes: $PA = PB$.\n\n### Propiedad de suplementariedad angular\nEn el cuadrilátero $OAPB$, los ángulos en $A$ y $B$ son de $90^\\circ$, sumando $180^\\circ$. Como la suma interior de un cuadrilátero es $360^\\circ$:\n$$\\angle AOB + \\angle APB = 180^\\circ$$\n\n> **Complemento didáctico:** ¡Memoriza las dos consecuencias del sombrero! 1) Las dos tangentes miden igual ($PA = PB$), y 2) El ángulo del centro y el ángulo de la punta del sombrero son suplementarios ($\angle AOB + \angle APB = 180^\\circ$). En la PAES esta relación resuelve ejercicios en 5 segundos sin necesidad de trazar ecuaciones.\n"
definiciones_clave: '- **Teorema del sombrero**: Propiedad de congruencia estricta entre dos segmentos tangentes que parten de un mismo punto.

  - **Eje de simetría de tangencias**: Segmento $\overline{OP}$ que biseca al ángulo exterior $\angle APB$ y al ángulo central $\angle AOB$.

  - **Ángulo circunscrito**: Ángulo exterior $\angle APB$ formado por las dos rectas tangentes que convergen en $P$.

  '
propiedades_relaciones: '- **Bisección simultánea**: $\angle APO = \angle BPO = \frac{\angle APB}{2}$ y $\angle AOP = \angle BOP = \frac{\angle AOB}{2}$.

  - **Cuerda de contacto**: El segmento $\overline{AB}$ que une los puntos de tangencia es perpendicular a $\overline{OP}$ ($\overline{AB} \perp \overline{OP}$).

  - **Cuadrilátero inscriptible**: El cuadrilátero $OAPB$ es cíclico (inscriptible en una circunferencia de diámetro $OP$).

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de tangentes desde un punto exterior](/static/img/nodos/propiedad-de-congruencia-de-segmentos-tangentes-trazados-desde-un-mismo-punto-exterior-ejemplos.svg)


    Desde un punto exterior $P$ se trazan dos tangentes $PA$ y $PB$ a una circunferencia. Las longitudes vienen dadas algebraicamente por $PA = 4x - 5$ y $PB = 2x + 9$. Asimismo, el ángulo central correspondiente mide $\angle AOB = 110^\circ$. Calcula el valor de $x$, la longitud de los segmentos tangentes y la medida del ángulo exterior $\angle APB$.'
  pasos:
  - 'Paso 1: Aplicar el Teorema de congruencia de tangentes: $PA = PB$.'
  - 'Paso 2: Igualar las expresiones y despejar $x$: $4x - 5 = 2x + 9 \implies 2x = 14 \implies x = 7$.'
  - 'Paso 3: Calcular la longitud de las tangentes: $PA = 4(7) - 5 = 28 - 5 = 23\text{ cm}$.'
  - 'Paso 4: Aplicar la suplementariedad angular: $\angle AOB + \angle APB = 180^\circ \implies 110^\circ + \angle APB = 180^\circ \implies \angle APB = 70^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si desde un punto exterior P se trazan dos segmentos tangentes PA y PB a una circunferencia, ¿cuál es la relación métrica entre ellos?
  choices:
  - text: Son congruentes (PA = PB).
    is_correct: true
  - text: PA es el doble de PB.
    is_correct: false
  - text: Su suma es igual al radio.
    is_correct: false
  - text: Son perpendiculares entre sí en todos los casos.
    is_correct: false
  explanation: La alternativa correcta es 'Son congruentes (PA = PB).' Por el Teorema del Sombrero, los dos segmentos tangentes trazados desde un mismo punto exterior tienen idéntica longitud.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si el ángulo exterior formado por dos tangentes trazadas desde un punto P mide 40°, ¿cuánto mide el ángulo central correspondiente ∠AOB?
  choices:
  - text: 140°.
    is_correct: true
  - text: 40°.
    is_correct: false
  - text: 80°.
    is_correct: false
  - text: 50°.
    is_correct: false
  explanation: 'La alternativa correcta es ''140°.'' Por la suplementariedad entre el ángulo central y el exterior: $\angle AOB = 180^\circ - 40^\circ = 140^\circ$.'
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Identificar el punto exterior $P$ y los puntos de contacto $A$ y $B$.

  2. Igualar las longitudes de los segmentos tangentes: $PA = PB$.

  3. Utilizar la bisectriz $\overline{OP}$ para dividir el ángulo exterior y el central en dos partes iguales.

  4. Aplicar la relación de suplementariedad angular: $\angle AOB + \angle APB = 180^\circ$.

  '
errores_correccion: '- **Error común 1:** Asumir que las dos tangentes son distintas si están inclinadas en el plano. **Corrección:** Por congruencia de triángulos, siempre tienen la misma longitud $PA = PB$.

  - **Error común 2:** Creer que el ángulo central es igual al ángulo exterior. **Corrección:** Son suplementarios, suman $180^\circ$.

  '
ejemplos:
- tipo: A
  titulo: Tangentes congruentes algebraicas
  enunciado: Desde un punto $P$ exterior, $PA = 5y - 3$ y $PB = 3y + 7$. ¿Cuánto mide cada segmento tangente?
  alternativas:
  - text: $22\text{ cm}$.
    is_correct: true
  - text: $5\text{ cm}$.
    is_correct: false
  - text: $11\text{ cm}$.
    is_correct: false
  - text: $17\text{ cm}$.
    is_correct: false
  explicacion: $5y - 3 = 3y + 7 \implies 2y = 10 \implies y = 5$. Luego $PA = 5(5) - 3 = 22\text{ cm}$.
- tipo: B
  titulo: Bisectriz de la recta al centro
  enunciado: ¿Es el segmento que une el centro con el punto exterior siempre la bisectriz del ángulo formado por las dos tangentes?
  respuesta: Sí
  explicacion: Sí. Por la congruencia de los triángulos $\triangle OAP \cong \triangle OBP$, el segmento $\overline{OP}$ biseca a $\angle APB$.
errores_frecuentes:
- '''Olvidar que los dos segmentos tangentes desde un mismo punto exterior son iguales.'''
- '''Restar de $90^\circ$ en lugar de $180^\circ$ al relacionar el ángulo central y el exterior.'''
- '''Creer que se pueden trazar tres rectas tangentes desde un punto exterior.'''
afirmaciones_verdaderas:
- '''Los dos segmentos tangentes trazados desde un mismo punto exterior son congruentes ($PA = PB$).'''
- '''El segmento $\overline{OP}$ es bisectriz del ángulo exterior $\angle APB$ y del ángulo central $\angle AOB$.'''
- "'El ángulo central subtendido por los puntos de tangencia y el ángulo exterior son suplementarios ($\angle AOB + \angle APB = 180^\\circ$).'"
al_terminar_debes_poder: '**QUÉ:** Resolver problemas de geometría aplicando la congruencia de tangentes y relaciones angulares de simetría.


  **CÓMO:** Utilizando $PA = PB$, $\triangle OAP \cong \triangle OBP$ y $\angle AOB + \angle APB = 180^\circ$.


