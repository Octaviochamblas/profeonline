semantic_id: MAT.GEO.TRIANGULOS_RECTANGULOS.HIPOTENUSA
resumen_inicial: La hipotenusa es el lado de mayor longitud de un triángulo rectángulo,
  situado exactamente frente al ángulo recto de 90°.
explicacion_simple: Imagina colocar un panel solar inclinado entre el suelo y una
  pared. El panel inclinado (el lado más largo de todos) es la hipotenusa.
explicacion_formal: En todo triángulo rectángulo $\triangle ABC$, la **hipotenusa**
  $c$ es el lado opuesto al ángulo recto ($90^\circ$). Cumple $c > a$ y $c > b$, siendo
  la longitud máxima del polígono.
definiciones_clave: '- **Hipotenusa**: Lado opuesto al ángulo de $90^\circ$.

  - **Ángulo recto opuesto**: Ángulo de $90^\circ$ que determina la posición de la
  hipotenusa.'
propiedades_relaciones: '- **Mayor longitud**: La hipotenusa es estrictamente mayor
  que cualquiera de los dos catetos ($c > a, c > b$).

  - **Diámetro circunscrito**: En una circunferencia circunscrita al triángulo rectángulo,
  la hipotenusa coincide con el diámetro.'
ejemplo_guiado:
  enunciado: Un panel solar inclinado se apoya formando un triángulo rectángulo con
    una altura vertical de $3\text{ m}$ y una base horizontal de $4\text{ m}$. Si
    la longitud del panel es de $5\text{ m}$, identifica cuál de los tres lados representa
    la hipotenusa y justifica tu elección.
  pasos:
  - 'Paso 1: Identificar la intersección perpendicular de la pared y el suelo que
    forma el ángulo recto de $90^\circ$.'
  - 'Paso 2: Observar el lado inclinado del panel de $5\text{ m}$ situado exactamente
    al frente del ángulo recto.'
  - 'Paso 3: Concluir que la hipotenusa es el panel de $5\text{ m}$, por ser el lado
    de mayor longitud opuesto a los $90^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Dónde se ubica siempre la hipotenusa en un triángulo rectángulo?
  choices:
  - text: Exactamente al frente del ángulo recto de 90°
    is_correct: true
  - text: Entre los dos ángulos agudos únicamente
    is_correct: false
  - text: Al lado de la base horizontal solamente
    is_correct: false
  - text: En la bisectriz exterior
    is_correct: false
  explanation: La alternativa correcta es 'Exactamente al frente del ángulo recto
    de 90°'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el panel solar de 5 m, 4 m y 3 m, ¿cuál de las tres medidas representa
    la hipotenusa?
  choices:
  - text: El panel inclinado de 5 m
    is_correct: true
  - text: La base horizontal de 4 m
    is_correct: false
  - text: La altura vertical de 3 m
    is_correct: false
  - text: La suma 4 + 3 = 7 m
    is_correct: false
  explanation: La alternativa correcta es 'El panel inclinado de 5 m', por ser el
    lado opuesto al ángulo recto.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar los datos dados y el teorema geométrico del concepto.'
- 'Paso 2: Plantear la ecuación algebraica o relación correspondiente.'
- 'Paso 3: Despejar la incógnita y verificar su coherencia geométrica.'
errores_correccion: Evita confundir las propiedades de los lados con las de los ángulos
  interiores al clasificar la figura.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Si en un triángulo dos ángulos interiores miden 78° y 79°, ¿cuánto mide
    el tercero?
  alternativas:
  - 23°
  - 157°
  - 90°
  respuesta: 23°
  solucion_pasos:
  - Despejar $x = 180 - (78 + 79) = 23^\circ$.
- titulo: Ejemplo 2
  enunciado: Si dos lados de un triángulo miden 97 cm y 131 cm, ¿cuál puede ser la
    medida del tercer lado?
  alternativas:
  - 226 cm
  - 233 cm
  - 0 cm
  respuesta: 226 cm
  solucion_pasos:
  - Por Desigualdad Triangular, el tercer lado debe ser menor que 228 cm.
- titulo: ¿La suma de los tres ángulos interiores de cualquier triángulo en el plano
    es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un teorema fundamental e invariante de la geometría euclidiana.
- titulo: ¿Un triángulo puede tener dos ángulos rectos de 90° en su interior?
  respuesta: 'No'
  solucion_pasos:
  - No, porque 90° + 90° = 180°, dejando 0° para el tercer ángulo, lo cual imposibilita
    cerrar la figura.
errores_frecuentes:
- Declarar la suma de ángulos interiores (180°) con la suma de ángulos exteriores
  (360°).
- Afirmar que un triángulo isósceles tiene sus tres lados iguales (eso corresponde
  al equilátero).
- Declarar que cualquier trío de medidas de varillas puede formar un triángulo sin
  verificar la Desigualdad Triangular.
- Declarar los catetos con la hipotenusa en triángulos rectángulos orientados en distintas
  posiciones.
- Omitir que en un triángulo equilátero cada uno de sus tres ángulos interiores mide
  exactamente 60°.
afirmaciones_verdaderas:
- La suma de los ángulos interiores de todo triángulo en el plano es siempre igual
  a 180°.
- En todo triángulo rectángulo, la hipotenusa es el lado de mayor longitud opuesto
  al ángulo recto.
al_terminar_debes_poder: Al finalizar este recurso podrás identificar y calcular las
  propiedades de identificación de la hipotenusa como lado opuesto al ángulo recto
  resolviendo problemas geométricos con rigurosidad.
fuente: Texto escolar MINEDUC — Geometría 7° Básico / Propiedades de Triángulos.
estado: publicado
