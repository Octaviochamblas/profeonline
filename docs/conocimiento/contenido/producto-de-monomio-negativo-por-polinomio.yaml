resumen_inicial: La producto de monomio negativo por polinomio aplica rigurosamente
  las leyes distributivas, de signos y de potencias en expresiones algebraicas.
explicacion_simple: Al trabajar con producto de monomio negativo por polinomio, multiplicamos
  los coeficientes numéricos, aplicamos la regla de signos y sumamos los exponentes
  de las letras iguales.
explicacion_formal: 'Dadas expresiones algebraicas, la **Producto de monomio negativo
  por polinomio** viene dada por:


  $$\text{"el producto -3x^2(2x^2 - 4x + 5)"} \implies -6x^4 + 12x^3 - 15x^2$$


  > **Complemento didáctico:** La multiplicación preserva la estructura de anillo
  de los polinomios reales mediante la distributividad.'
definiciones_clave: '- **Producto de monomio negativo por polinomio**: Operación de
  multiplicación sobre expresiones algebraicas.'
propiedades_relaciones: '- **Grado del producto**: El grado del producto de dos polinomios
  no nulos es la suma de sus grados individuales.'
ejemplo_guiado:
  enunciado: 'Calcule producto de monomio negativo por polinomio para: ''el producto
    -3x^2(2x^2 - 4x + 5)''.'
  pasos:
  - 'Paso 1: Multiplicar coeficientes y aplicar ley de signos.'
  - 'Paso 2: Sumar exponentes de variables iguales.'
  - 'Paso 3: Reducir términos semejantes si existen.'
  - 'Conclusión: El resultado final es -6x^4 + 12x^3 - 15x^2.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el resultado de aplicar producto de monomio negativo por polinomio
    a 'el producto -3x^2(2x^2 - 4x + 5)'?
  choices:
  - text: -6x^4 + 12x^3 - 15x^2
    is_correct: true
  - text: -6x^4 - 12x^3 - 15x^2
    is_correct: false
  - text: 6x^4 - 12x^3 + 15x^2
    is_correct: false
  - text: -6x^4 + 4x - 15
    is_correct: false
  explanation: La alternativa correcta es '-6x^4 + 12x^3 - 15x^2'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 'el producto -3x^2(2x^2 - 4x + 5)', ¿qué expresión
    resultante se obtuvo?
  choices:
  - text: -6x^4 + 12x^3 - 15x^2
    is_correct: true
  - text: -6x^4 - 12x^3 - 15x^2
    is_correct: false
  - text: 6x^4 - 12x^3 + 15x^2
    is_correct: false
  - text: -6x^4 + 4x - 15
    is_correct: false
  explanation: La alternativa correcta es '-6x^4 + 12x^3 - 15x^2'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Aplicar la propiedad distributiva multiplicando cada término.'
- 'Paso 2: Operar coeficientes numéricos y ley de signos.'
- 'Paso 3: Sumar exponentes de bases iguales y reducir semejantes.'
errores_correccion: '- **Error 1: Multiplicar los exponentes en lugar de sumarlos
  durante producto de monomio negativo por polinomio.** **Cómo corregirlo:** Al multiplicar
  potencias de igual base los exponentes se SUMAN.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el resultado de producto de monomio negativo por polinomio en
    'el producto -3x^2(2x^2 - 4x + 5)'?
  alternativas:
  - -6x^4 + 12x^3 - 15x^2
  - -6x^4 - 12x^3 - 15x^2
  - 6x^4 - 12x^3 + 15x^2
  - -6x^4 + 4x - 15
  respuesta: -6x^4 + 12x^3 - 15x^2
  solucion_pasos:
  - 1. Desarrollar la multiplicación.
  - 2. Obtener -6x^4 + 12x^3 - 15x^2.
- titulo: Ejemplo 2
  enunciado: Al calcular 'el producto -3x^2(2x^2 - 4x + 5)' por producto de monomio
    negativo por polinomio, ¿qué expresión resulta?
  alternativas:
  - -6x^4 + 12x^3 - 15x^2
  - -6x^4 - 12x^3 - 15x^2
  - 6x^4 - 12x^3 + 15x^2
  - -6x^4 + 4x - 15
  respuesta: -6x^4 + 12x^3 - 15x^2
  solucion_pasos:
  - 1. Operar coeficientes y exponentes.
  - 2. Concluir -6x^4 + 12x^3 - 15x^2.
- titulo: ¿Es la multiplicación en 'el producto -3x^2(2x^2 - 4x + 5)' equivalente
    a -6x^4 + 12x^3 - 15x^2?
  respuesta: Sí
  solucion_pasos:
  - Sí, aplicando las reglas algebraicas se obtiene -6x^4 + 12x^3 - 15x^2.
- titulo: ¿Da el producto de 'el producto -3x^2(2x^2 - 4x + 5)' un resultado igual
    a -6x^4 - 12x^3 - 15x^2?
  respuesta: 'No'
  solucion_pasos:
  - No, el resultado correcto es -6x^4 + 12x^3 - 15x^2.
errores_frecuentes:
- Multiplicar los exponentes de variables iguales al efectuar producto de monomio
  negativo por polinomio.
- Omitir distribuir el monomio o término sobre todos los sumandos en producto de monomio
  negativo por polinomio.
- Omitir aplicar la regla de los signos en coeficientes negativos.
- Sumar los coeficientes en lugar de multiplicarlos.
- Declarar que el producto de dos polinomios no nulos da un polinomio nulo.
afirmaciones_verdaderas:
- La producto de monomio negativo por polinomio requiere sumar los exponentes de las
  variables que tienen la misma base.
- La propiedad distributiva garantiza que cada término del primer factor multiplique
  a cada término del segundo.
al_terminar_debes_poder: Al terminar serás capaz de ejecutar la producto de monomio
  negativo por polinomio aplicando distributividad, ley de signos y suma de exponentes.
