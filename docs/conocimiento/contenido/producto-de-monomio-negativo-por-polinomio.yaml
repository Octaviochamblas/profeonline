semantic_id: MAT.ALG.MULT_MON_POL.MONOMIO_NEGATIVO
resumen_inicial: 'Producto de monomio negativo por polinomio: leyes, procedimiento
  y aplicación en Multiplicación de monomio por polinomio.'
explicacion_simple: Cuando el monomio que multiplica al polinomio es negativo, no
  solo cambian los números y las letras, también cambian todos los signos del polinomio.
  Es como si el signo menos se 'repartiera' a cada término.
explicacion_formal: '### Definición formal


  Sea $M=cX^{\alpha}$ un monomio con $c<0$ y sea $P=\sum_{i=1}^{n}d_iX^{\beta_i}$
  un polinomio. Por la propiedad distributiva,

  $$M\cdot P=\sum_{i=1}^{n}(cd_i)X^{\alpha+\beta_i}.$$

  El coeficiente negativo de $M$ interviene en cada producto parcial. En consecuencia,
  el signo de cada término resultante es el signo del producto $cd_i$: cambia respecto
  de $d_i$ cuando $d_i\neq0$. La regla afecta a todos los términos del polinomio,
  no al polinomio considerado como un bloque sin distribuir.


  ### Desarrollo didáctico


  La multiplicación de un monomio negativo por un polinomio sigue el mismo principio
  de la propiedad distributiva, con una atención especial a los signos.


  Si tenemos $-a(b - c)$, el monomio negativo $-a$ se distribuye:

  $(-a) \cdot b + (-a) \cdot (-c)$


  Aplicando la ley de los signos, obtenemos:

  $-ab + ac$


  Es fundamental recordar que multiplicar por un negativo invierte todos los signos
  originales de los términos dentro del paréntesis.'
definiciones_clave: '- **Producto de monomio negativo por polinomio**: Propiedad o
  regla fundamental del producto algebraico.'
propiedades_relaciones: '- **Leyes de exponentes y signos**: Suma de exponentes e
  igualdades de signos aplicadas a producto de monomio negativo por polinomio.'
ejemplo_guiado:
  enunciado: Calcula el producto aplicando los conceptos de producto de monomio negativo
    por polinomio.
  pasos:
  - Multiplicar los coeficientes numéricos respetando la ley de signos.
  - Multiplicar los factores literales sumando los exponentes de las variables iguales.
  - Distribuir si corresponde a la regla de producto de monomio negativo por polinomio.
  - Reducir términos semejantes y escribir el resultado en forma ordenada.
