semantic_id: MAT.ALG.MULT_MON_POL.MONOMIO_NEGATIVO
resumen_inicial: El producto de monomio negativo por polinomio consiste en distribuir el monomio invirtiendo obligatoriamente los signos de todos y cada uno de los términos del polinomio.
explicacion_simple: "Cuando el **monomio de afuera tiene signo negativo ($-$)** (ej: $-3x \\cdot (2x^2 - 5x + 4)$):\n- **EFECTO DE LA REGLA DE SIGNOS**: **El signo negativo de afuera INVIERTE TODOS LOS SIGNOS del polinomio de adentro**.\n  - Lo que era positivo $(+)$ pasa a ser **NEGATIVO ($-$)**.\n  - Lo que era negativo $(-)$ pasa a ser **POSITIVO ($+$)**.\n- **Ejemplo**: $-3x \\cdot (2x^2 - 5x + 4)$:\n  - Término 1 ($+2x^2$): $(-3x) \\cdot (+2x^2) = \\mathbf{-6x^3}$ (¡cambió de $+ \\to -$!).\n  - Término 2 ($-5x$): $(-3x) \\cdot (-5x) = \\mathbf{+15x^2}$ (¡cambió de $- \\to +$!).\n  - Término 3 ($+4$): $(-3x) \\cdot (+4) = \\mathbf{-12x}$ (¡cambió de $+ \\to -$!).\n- **Polinomio final expandido**: **$-6x^3 + 15x^2 - 12x$**.\n\n![Producto de Monomio Negativo por Polinomio](/static/img/nodos/producto-de-monomio-negativo-por-polinomio-intro.svg)\n"
explicacion_formal: '### Definición formal

  Sea un monomio estrictamente negativo $M = -c x^\alpha \in \mathbb{R}[x]$ con $c > 0$ y un polinomio $P(x) = \sum_{j=1}^m a_j x^{\beta_j}$. El **operador producto por monomio negativo** distribuye la inversión aditiva global sobre la familia de sumandos:


  $$M \cdot P(x) = -c x^\alpha \cdot \left( \sum_{j=1}^m a_j x^{\beta_j} \right) = \sum_{j=1}^m \left( - \operatorname{sgn}(a_j) \cdot c |a_j| \right) x^{\alpha + \beta_j}$$


  ### Teorema de Inversión Completa de Signatura

  Para todo $j \in \{1, \dots, m\}$, el signo del producto parcial $P_j$ satisface:


  $$\operatorname{sgn}(P_j) = \operatorname{sgn}(-c) \cdot \operatorname{sgn}(a_j) = -\operatorname{sgn}(a_j)$$


  Demostrando que la signatura del término $j$ en el polinomio expandido es estrictamente opuesta a la signatura original del sumando $j$ en $P(x)$.


  ### Síntesis didáctica

  Multiplicar por un monomio negativo combina la adición de potencias con la inversión sistemática de todos los signos antecedentes del polinomio.

  '
definiciones_clave: '- **Monomio multiplicador negativo**: Término antecedente precedido por el signo menos que actúa como factor distributivo.

  - **Inversión completa de signatura**: Modificación obligatoria del signo de cada término del polinomio ($\operatorname{sgn}(P_j) = -\operatorname{sgn}(a_j)$).

  - **Distribución de negación escalada**: Combinación simultánea del escalamiento numérico con la transformación de signos.

  '
propiedades_relaciones: '- **Isomorfismo con supresión de paréntesis negativos**: Multiplicar por $-1 \cdot x^0$ equivale exactamente a la regla de supresión de paréntesis precedidos por signo menos.

  - **Invarianza de los exponentes**: El signo menos del monomio altera únicamente los signos de los coeficientes, manteniendo intactas las potencias.

  '
ejemplo_guiado:
  enunciado: Multiplica el monomio negativo $-5a^3$ por el trinomio $(-2a^2 + 4a - 3)$.
  pasos:
  - 'Paso 1: Observamos el signo del monomio exterior: Es **negativo ($-5a^3$)**, por lo que **todos los signos del trinomio cambiarán**.'
  - 'Paso 2: Multiplicamos por el término 1 ($-2a^2$): $(-5a^3) \cdot (-2a^2) = +10a^{3+2} = \mathbf{+10a^5}$.'
  - 'Paso 3: Multiplicamos por el término 2 ($+4a$): $(-5a^3) \cdot (+4a) = -20a^{3+1} = \mathbf{-20a^4}$.'
  - 'Paso 4: Multiplicamos por el término 3 ($-3$): $(-5a^3) \cdot (-3) = +15a^3 = \mathbf{+15a^3}$.'
  - 'Paso 5: Consolidamos el polinomio expandido: $+10a^5 - 20a^4 + 15a^3$.'
  - 'Conclusión: El producto resuelto es **$10a^5 - 20a^4 + 15a^3$**.'
  imagen: /static/img/nodos/producto-de-monomio-negativo-por-polinomio-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué ocurre con los signos de cada uno de los términos de un polinomio cuando se multiplican por un monomio con coeficiente negativo?
  choices:
  - text: Todos los signos de los términos del polinomio se invierten ($+$ pasa a $-$ y viceversa)
    is_correct: true
  - text: Todos los signos del polinomio se convierten en positivos
    is_correct: false
  - text: Los signos del polinomio se mantienen exactamente iguales
    is_correct: false
  - text: Sólo cambia el signo del primer término del polinomio
    is_correct: false
  explanation: La alternativa correcta es 'Todos los signos de los términos del polinomio se invierten ($+$ pasa a $-$ y viceversa)'. Teorema de inversión completa de signatura $\operatorname{sgn}(P_j) = -\operatorname{sgn}(a_j)$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de multiplicar $-2x \cdot (3x - 5)$?
  choices:
  - text: El resultado es $-6x^2 + 10x$, invirtiendo los signos a $-6x^2$ y $+10x$
    is_correct: true
  - text: El resultado es $-6x^2 - 10x$
    is_correct: false
  - text: El resultado es $6x^2 - 10x$
    is_correct: false
  - text: El resultado es $-6x + 10$
    is_correct: false
  explanation: La alternativa correcta es 'El resultado es $-6x^2 + 10x$, invirtiendo los signos a $-6x^2$ y $+10x$'. $-2x(3x)=-6x^2$, $-2x(-5)=+10x$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Notar el signo negativo ($-$) del monomio exterior multiplicador.'
- 'Paso 2: Para el primer término del polinomio, cambiar su signo e integrar el producto de coeficientes y potencias.'
- 'Paso 3: Para el segundo término y subsecuentes, invertir obligatoriamente sus signos e integrar coeficientes y potencias.'
- 'Paso 4: Comprobar que ningún término liberado mantenga la misma signatura que tenía dentro del paréntesis.'
errores_correccion: '- **Error 1:** Cambiar el signo únicamente al primer término del polinomio y mantener los signos originales en los demás (escribir $-2x(x - 3) = -2x^2 - 6x$). **Cómo corregirlo:** El monomio negativo **INVIERTE TODOS LOS SIGNOS ($-2x^2 + 6x$)**.

  - **Error 2:** Cambiar los signos de los exponentes por causa del signo negativo del monomio (escribir $-3x^2(x^3) = -3x^{-5}$). **Cómo corregirlo:** El signo menos **INVIERTE LOS COEFICIENTES; los exponentes de variables comunes SE SUMAN NORMLEMENTE ($2+3=5 \implies -3x^5$)**.

  '
ejemplos:
- titulo: Monomio negativo por binomio
  enunciado: ¿Cuál es el producto de $-4a \cdot (2a - 3)$?
  alternativas:
  - $-8a^2 + 12a$
  - $-8a^2 - 12a$
  - $8a^2 - 12a$
  respuesta: $-8a^2 + 12a$
  solucion_pasos:
  - 1. $(-4a) \cdot 2a = -8a^2$.
  - 2. $(-4a) \cdot (-3) = +12a$.
  - '3. Resultado: $-8a^2 + 12a$.'
- titulo: Monomio negativo por trinomio
  enunciado: ¿Cuál es el producto de $-x^2 \cdot (x^2 - 4x + 6)$?
  alternativas:
  - $-x^4 + 4x^3 - 6x^2$
  - $-x^4 - 4x^3 + 6x^2$
  - $x^4 - 4x^3 + 6x^2$
  respuesta: $-x^4 + 4x^3 - 6x^2$
  solucion_pasos:
  - 1. $(-x^2) \cdot x^2 = -x^4$.
  - 2. $(-x^2) \cdot (-4x) = +4x^3$.
  - 3. $(-x^2) \cdot 6 = -6x^2$.
  - '4. Resultado: $-x^4 + 4x^3 - 6x^2$.'
- titulo: Comprobación de inversión total
  enunciado: En el trinomio $(+a - b + c)$ multiplicado por $-1$, ¿se invierten los tres signos a $(-a + b - c)$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el $-1$ invierte exactamente todas las signaturas.
- titulo: Invarianza del grado
  enunciado: ¿Posee el producto $-3x(2x^2 + 5) = -6x^3 - 15x$ el mismo grado $3$ que si el monomio hubiese sido positivo $+3x$?
  respuesta: Sí
  solucion_pasos:
  - Sí, el signo no altera el grado absoluto del polinomio.
errores_frecuentes:
- Invertir el signo únicamente del primer término del polinomio dentro del paréntesis.
- Alterar los signos de los exponentes de las variables al distribuir el monomio negativo.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Mantener el signo negativo en los términos que originalmente eran negativos dentro del paréntesis.
- Multiplicar los coeficientes omitiendo la inversión de los signos.
afirmaciones_verdaderas:
- Multiplicar un polinomio por un monomio negativo invierte el signo de todos y cada uno de sus términos.
- El signo negativo del monomio actúa sobre los coeficientes numéricos sin alterar la regla de adición de exponentes.
al_terminar_debes_poder: '![Resumen de monomio negativo por polinomio](/static/img/nodos/producto-de-monomio-negativo-por-polinomio-resumen.svg)


  QUÉ: Multiplicar un monomio con coeficiente negativo por un polinomio sin cometer errores de signo.


  CÓMO: Invertir el signo de todos los términos del polinomio $-M(A - B + C) = -MA + MB - MC$, operando normalmente los valores absolutos y las potencias literales.'
