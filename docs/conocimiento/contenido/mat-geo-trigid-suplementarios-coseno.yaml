semantic_id: MAT.GEO.TRIG_IDENTIDADES_AMP.SUPLEMENTARIOS_COSENO
resumen_inicial: 'Relación del coseno entre ángulos suplementarios: conceptos, teoremas,
  propiedades geométricas y cálculo en Trigonometría Ampliada.'
explicacion_simple: A diferencia del seno, el coseno sí cambia de signo entre ángulos
  suplementarios, porque los puntos correspondientes en la circunferencia unitaria
  son reflejos horizontales entre sí, con coordenadas x opuestas.
explicacion_formal: '![Coseno de ángulos suplementarios](/static/img/geometria/trigonometria/trigid-suplementarios-coseno.svg)


  ### Definición formal


  Para cualquier ángulo $x$, se cumple $\cos(180°-x)=-\cos x$, ya que el punto correspondiente
  a $180°-x$ en la circunferencia unitaria tiene la misma coordenada y pero coordenada
  x opuesta a la del punto correspondiente a $x$.


  ### Desarrollo didáctico


  En la figura, θ=35° y su suplementario 180°-θ=145°. Se cumple que cos145°=-cos35°,
  ya que ambos ángulos comparten la misma altura (mismo seno) pero están reflejados
  horizontalmente (coseno de signo opuesto).'
definiciones_clave: '- **Relación del coseno entre ángulos suplementarios**: Elemento
  o propiedad fundamental en el estudio de trigonometría ampliada.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a relación del coseno entre ángulos suplementarios.'
