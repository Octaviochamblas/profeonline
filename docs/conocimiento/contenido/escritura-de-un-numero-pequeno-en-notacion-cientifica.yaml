semantic_id: MAT.NUM.NOTACION_CIENTIFICA.ESCRITURA_NUMERO_PEQUENO
resumen_inicial: Para escribir un número pequeño ($0 < |x| < 1$) en notación científica,
  la coma se desplaza $n$ posiciones hacia la derecha hasta encontrar la primera cifra
  no nula, asignando un exponente entero negativo $-n$.
explicacion_simple: Al convertir un número muy pequeño (como $0,00045$) a notación
  científica, corremos la coma hacia la derecha hasta sobrepasar la primera cifra
  distinta de cero. El número de pasos dados a la derecha será el exponente negativo
  de la potencia de diez.
explicacion_formal: 'Sea $0 < x < 1$, la representación $x = k \cdot 10^{-n}$ se construye
  mediante:


  $$x = 0,\underbrace{00\dots0}_{n-1 \text{ ceros}} a_1 a_2 \dots \implies k = a_1,
  a_2 \dots \quad \text{con exponente } -n < 0$$


  **Desglose del algoritmo:**

  - Dirección de desplazamiento: Derecha $\implies$ Exponente negativo $-n$.

  - Orden de magnitud: $-n$ indica la posición decimal donde aparece el primer dígito
  significativo no nulo.


  > **Complemento didáctico:** Ejemplo: $0,000072 = 7,2 \cdot 10^{-5}$ (la coma avanzó
  $5$ lugares a la derecha).'
definiciones_clave: '- **Escritura de números pequeños**: Conversión con traslación
  de coma a la derecha y exponente negativo $-n$.'
propiedades_relaciones: '- **Exponente negativo**: Indica la cantidad de traslaciones
  a la derecha para un número $|x| < 1$.'
ejemplo_guiado:
  enunciado: Escriba el número decimal pequeño $0,000038$ en notación científica.
  pasos:
  - 'Paso 1: Identificar el primer dígito diferente de cero: $3$. Colocar la coma
    a su derecha: $3,8$.'
  - 'Paso 2: Contar los lugares que avanzó la coma hacia la derecha: $5$ posiciones.'
  - 'Paso 3: Asignar exponente negativo $-5$ a la potencia de diez: $10^{-5}$.'
  - 'Conclusión: $0,000038 = 3,8 \cdot 10^{-5}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué signo tiene el exponente al convertir un número menor a 1 (0 < |x|
    < 1) a notación científica?
  choices:
  - text: Signo negativo (-n)
    is_correct: true
  - text: Signo positivo (+n)
    is_correct: false
  - text: Es siempre cero
    is_correct: false
  - text: Es indeterminado
    is_correct: false
  explanation: La alternativa correcta es 'Signo negativo (-n)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 0,000038, ¿cuál fue el resultado?
  choices:
  - text: 3,8 · 10^{-5}
    is_correct: true
  - text: 3,8 · 10^5
    is_correct: false
  - text: 38 · 10^{-6}
    is_correct: false
  - text: 0,38 · 10^{-4}
    is_correct: false
  explanation: La alternativa correcta es '3,8 · 10^{-5}'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Mover la coma hacia la derecha hasta situarla inmediatamente después de
  la primera cifra no nula.'
- 'Paso 2: Contar las posiciones $n$ recorridas a la derecha.'
- 'Paso 3: Multiplicar la mantisa por la potencia $10^{-n}$ con exponente negativo
  $-n$.'
errores_correccion: '- **Error 1: Asignar exponente positivo a un decimal pequeño
  ($0,005 = 5 \cdot 10^3$).** **Cómo corregirlo:** Los números menores a 1 llevan
  exponente NEGATIVO ($5 \cdot 10^{-3}$).


  - **Error 2: Dejar la coma antes de la primera cifra no nula ($0,005 = 0,5 \cdot
  10^{-2}$).** **Cómo corregirlo:** El coeficiente debe ser $\ge 1$, por lo que la
  coma debe pasar la primera cifra no nula ($5 \cdot 10^{-3}$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Escriba $0,0009$ en notación científica.
  alternativas:
  - 9 · 10^{-4}
  - 9 · 10^4
  - 0,9 · 10^{-3}
  respuesta: 9 · 10^{-4}
  solucion_pasos:
  - $0,0009 = 9 \cdot 10^{-4}$.
- titulo: Ejemplo 2
  enunciado: Escriba $0,0000012$ en notación científica.
  alternativas:
  - 1,2 · 10^{-6}
  - 1,2 · 10^6
  - 12 · 10^{-7}
  respuesta: 1,2 · 10^{-6}
  solucion_pasos:
  - $0,0000012 = 1,2 \cdot 10^{-6}$.
- titulo: ¿Es 0,01 igual a 1 · 10^{-2}?
  respuesta: Sí
  solucion_pasos:
  - Sí, $1 / 100 = 10^{-2}$.
- titulo: ¿Requiere un número pequeño mover la coma hacia la derecha?
  respuesta: Sí
  solucion_pasos:
  - Sí, para dejar una cifra entera entre 1 y 9.
errores_frecuentes:
- Usar exponentes positivos al representar números decimales pequeños menores a 1.
- Dejar ceros a la izquierda de la coma al expresar un decimal pequeño en notación
  científica.
- Contar las posiciones ignorando la primera cifra distinta de cero.
- El decimal $0,007$ en notación científica equivale a $7 \cdot 10^3$.
- Invertir los signos de la mantisa al mover la coma hacia la derecha.
afirmaciones_verdaderas:
- Para expresar un número pequeño ($0 < |x| < 1$) en notación científica se desplaza
  la coma a la derecha y se usa un exponente negativo $-n$.
- El exponente negativo refleja la división por potencias de diez necesarias para
  reconstruir el decimal pequeño.
al_terminar_debes_poder: Al terminar serás capaz de convertir números pequeños a notación
  científica $k \cdot 10^{-n}$, desplazando la coma hacia la derecha y asignando un
  exponente negativo $-n$.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
