  question: ¿Por qué es obligatorio rellenar con ceros a la derecha en el minuendo al restar $15,4 - 6,28$?
  choices:
  - text: Para poder realizar el canje posicional al restar 0 menos 8 en las centésimas
    is_correct: true
  - text: Porque el resultado siempre debe tener tres ceros
    is_correct: false
  - text: Para convertir el número en un entero
    is_correct: false
  - text: No es obligatorio
    is_correct: false
  explanation: La alternativa correcta es 'Para poder realizar el canje posicional al restar 0 menos 8 en las centésimas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para $15,4 - 6,28$, ¿cuál fue la diferencia obtenida?
  choices:
  - text: $9,12$
    is_correct: true
  - text: $9,18$
    is_correct: false
  - text: $9,22$
    is_correct: false
  - text: $15,12$
    is_correct: false
  explanation: La alternativa correcta es '$9,12$'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir minuendo y sustraendo en columna con las comas en una misma vertical.'
- 'Paso 2: Rellenar con ceros los espacios decimales vacíos a la derecha en el minuendo.'
- 'Paso 3: Efectuar la resta con reserva/canje de derecha a izquierda y colocar la coma en la misma columna.'
errores_correccion: '- **Error 1: Bajar directamente el dígito del sustraendo sin restar de un cero ($15,4 - 6,28 = 9,18$).** **Cómo corregirlo:** Se debe agregar el cero ($15,40$) y restar $10 - 8 = 2$ en las centésimas con reserva.

  - **Error 2: Alinear las últimas cifras sin respetar las comas.** **Cómo corregirlo:** La coma marca el centro invariable de alineación posicional.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $8,5 - 3,24$.
  alternativas:
  - $5,26$
  - $5,36$
  - $5,24$
  respuesta: $5,26$
  solucion_pasos:
  - $8,50 - 3,24 = 5,26$.
- titulo: Ejemplo 2
  enunciado: Calcule $10 - 4,75$.
  alternativas:
  - $5,25$
  - $6,25$
  - $5,75$
  respuesta: $5,25$
  solucion_pasos:
  - $10,00 - 4,75 = 5,25$.
- titulo: ¿Es necesario transformar 10 a $10,00$ para restar $10 - 4,75$?
  respuesta: Sí
  solucion_pasos:
  - Sí, la alineación con ceros $10,00$ es fundamental para restar centésimas con canje.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Escribir $10,00$ permite realizar el préstamo sucesivo desde las unidades hacia décimos y centésimos.
  - texto: No, se resta directo dando 6,75
    es_correcta: false
    retroalimentacion: Incorrecto, no se puede restar sin igualar el orden posicional decimal.
  - texto: Solo si el resultado es negativo
    es_correcta: false
    retroalimentacion: Incorrecto, aplica siempre que el sustraendo tenga cifras decimales.
- titulo: ¿Es $5,4 - 2,1$ igual a $3,3$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5,4 - 2,1 = 3,3$.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Restando décimos ($4-1=3$) y unidades ($5-2=3$) se obtiene $3,3$.
  - texto: No, es 3,5
    es_correcta: false
    retroalimentacion: Incorrecto, $4-1=3$ en las décimas.
  - texto: No, es 3,1
    es_correcta: false
    retroalimentacion: Incorrecto, $5-2=3$ en las unidades.
errores_frecuentes:
- Al restar decimales cuando el minuendo tiene menos cifras decimales, se 'baja' la cifra del sustraendo.
- Alinear minuendo y sustraendo a la derecha ignorando la coma decimal produce la resta correcta.
- Rellenar con ceros a la derecha modifica el valor intrínseco del minuendo.
- La sustracción de decimales es una operación conmutativa donde el orden no altera la diferencia.
- Restar una cifra decimal de cero entrega como resultado esa misma cifra positiva sin reserva.
afirmaciones_verdaderas:
- La sustracción de decimales exige alinear las comas verticalmente y rellenar con ceros las vacantes del minuendo.
- El canje o reserva posicional en la resta decimal funciona de manera idéntica a los números enteros.
- Comprobar la resta sumando sustraendo y diferencia debe reconstruir exactamente el minuendo.
al_terminar_debes_poder: '![Síntesis de sustracción de decimales](/static/img/nodos/sustraccion-de-decimales-mediante-alineacion-de-coma-resumen.svg)


  QUÉ: Restar números decimales finitos y enteros mediante canje o reagrupación posicional.


  CÓMO: Alineando minuendo y sustraendo por la coma decimal, agregando ceros obligatorios en las vacantes del minuendo ($15 = 15,00$) y efectuando la resta de derecha a izquierda con reserva.'
