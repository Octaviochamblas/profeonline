semantic_id: MAT.NUM.DECIMALES_OPERATORIA.SUSTRACCION
resumen_inicial: La sustracción de números decimales alinea verticalmente minuendo y sustraendo según sus comas, completando obligatoriamente los ceros faltantes en el minuendo.
explicacion_simple: '![Sustracción de decimales mediante alineación de coma](/static/img/nodos/sustraccion-de-decimales-mediante-alineacion-de-coma-intro.svg)


  Para restar números decimales, alineamos las comas de ambos números en una misma columna. Si el minuendo (número de arriba) tiene menos cifras decimales que el sustraendo (número de abajo), es indispensable rellenar con ceros a la derecha para poder reagrupar y restar correctamente.'
explicacion_formal: 'Dada la sustracción de números decimales finitos $d_1 = \sum_{i=-k_1}^{m_1} a_i \cdot 10^i$ (minuendo) y $d_2 = \sum_{j=-k_2}^{m_2} b_j \cdot 10^j$ (sustraendo) en $\mathbb{Q}$ con $d_1 \ge d_2$, la **Sustracción Posicional Decimal** se define mediante:


  $$d_1 - d_2 = \sum_{i=-\max(k_1, k_2)}^{\max(m_1, m_2)} (a_i - b_i - c_i) \cdot 10^i$$


  **Desglose formal de la fórmula:**

  - **Relleno de ceros obligatorio:** Si $k_1 < k_2$, se imponen ceros explícitos en el minuendo ($a_i = 0$ para $i < -k_1$) para posibilitar el canje posicional.

  - **Canje posicional ($c_i$):** Si $a_i < b_i$, se toma $1$ unidad del orden inmediato superior ($10^{i+1} = 10 \cdot 10^i$) aumentando $a_i$ en $10$ y restando $1$ en la columna izquierda.

  - **Alineación vertical:** Las comas decimales ocupan la misma columna vertical en toda la operación.


  > **Complemento didáctico:** Sin el relleno con ceros en el minuendo, es muy frecuente cometer el grave error de ''bajar'' la cifra del sustraendo sin restar.'
definiciones_clave: '- **Minuendo**: Cantidad de la cual se resta otra (término superior).

  - **Sustraendo**: Cantidad que se resta (término inferior).

  - **Relleno de ceros en minuendo**: Adición de ceros a la derecha para habilitar el canje de unidades decimales.'
propiedades_relaciones: '- **No conmutativa**: $a - b \neq b - a$.

  - **Comprobación de la resta**: Minuendo $=$ Diferencia $+$ Sustraendo.

  - **Invarianza por traslación**: $(a + c) - (b + c) = a - b$.'
ejemplo_guiado:
  enunciado: Calcule la resta decimal $15,4 - 6,28$.
  pasos:
  - 'Paso 1: Alinear minuendo y sustraendo verticalmente por su coma decimal.'
  - 'Paso 2: Rellenar obligatoriamente con cero el minuendo para igualar centésimos: $15,4 \implies 15,40$.'
  - "Paso 3: Restar en columna con canje posicional ($10 - 8 = 2$, $3 - 2 = 1$, $15 - 6 = 9$):\n  15,40\n-  6,28\n------\n   9,12"
  - 'Conclusión: $15,4 - 6,28 = 9,12$.'
checkpoints:
