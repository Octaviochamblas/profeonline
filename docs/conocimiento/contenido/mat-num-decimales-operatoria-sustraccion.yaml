semantic_id: MAT.NUM.DECIMALES_OPERATORIA.SUSTRACCION
resumen_inicial: La sustracción de números decimales alinea verticalmente minuendo
  y sustraendo según sus comas, completando obligatoriamente los ceros faltantes en
  el minuendo.
explicacion_simple: Para restar números decimales, alineamos las comas de ambos números
  en una misma columna. Si el número de arriba (minuendo) tiene menos cifras decimales
  que el de abajo (sustraendo), es absolutamente necesario agregar ceros a la derecha
  del de arriba para poder pedir prestado y restar correctamente.
explicacion_formal: 'Dada la resta $d_1 - d_2$ en $\mathbb{Q}$, la **Sustracción Posicional
  Decimal** exige:


  $$d_1 - d_2 = \sum_{i=-k}^{m} (a_i - b_i) \cdot 10^i$$


  **Desglose de la fórmula:**

  - Relleno de ceros obligatorio: Si $d_1$ tiene menor precisión decimal que $d_2$,
  se imponen ceros explícitos ($a_i = 0$) para permitir el canje o reserva posicional
  en $\mathbb{Z}$.

  - Alineación vertical: Las comas decimales deben ocupar la misma columna.


  > **Complemento didáctico:** Sin el relleno con ceros a la derecha en el minuendo,
  es muy frecuente cometer el error de ''bajar el número'' directamente sin restar.'
definiciones_clave: '- **Sustracción de decimales**: Operación en columna alineada
  por la coma con relleno de ceros a la derecha en las vacantes decimales.'
propiedades_relaciones: '- **Invarianza de alineación**: Preserva las columnas posicionales
  mediante ceros auxiliares.'
ejemplo_guiado:
  enunciado: Calcule la resta decimal $15,4 - 6,28$.
  pasos:
  - 'Paso 1: Alinear por la coma decimal verticalmente.'
  - 'Paso 2: Rellenar obligatoriamente con cero el minuendo $15,4 \implies 15,40$.'
  - "Paso 3: Restar verticalmente con canje posicional:\n  15,40\n-  6,28\n------\n\
    \   9,12"
  - 'Conclusión: $15,4 - 6,28 = 9,12$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué es obligatorio rellenar con ceros a la derecha en el minuendo
    al restar 15,4 - 6,28?
  choices:
  - text: Para poder realizar el canje posicional al restar 0 menos 8 en las centésimas
    is_correct: true
  - text: Porque el resultado siempre debe tener tres ceros
    is_correct: false
  - text: Para convertir el número en un entero
    is_correct: false
  - text: No es obligatorio
    is_correct: false
  explanation: La alternativa correcta es 'Para poder realizar el canje posicional
    al restar 0 menos 8 en las centésimas'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 15,4 - 6,28, ¿cuál fue la resta correcta?
  choices:
  - text: 9,12
    is_correct: true
  - text: 9,18
    is_correct: false
  - text: 9,22
    is_correct: false
  - text: 15,12
    is_correct: false
  explanation: La alternativa correcta es '9,12'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Escribir minuendo y sustraendo en columna con las comas en una misma vertical.'
- 'Paso 2: Rellenar con ceros los espacios decimales vacíos a la derecha en el minuendo.'
- 'Paso 3: Efectuar la resta con reserva/canje de derecha a izquierda y colocar la
  coma en la misma columna.'
errores_correccion: '- **Error 1: Bajar directamente el dígito del sustraendo sin
  restar de un cero ($15,4 - 6,28 = 9,18$).** **Cómo corregirlo:** Se debe agregar
  el cero ($15,40$) y restar $10 - 8 = 2$ en las centésimas con reserva.


  - **Error 2: Alinear las últimas cifras sin respetar las comas.** **Cómo corregirlo:**
  La coma marca el centro invariable de alineación posicional.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule 8,5 - 3,24.
  alternativas:
  - 5,26
  - 5,36
  - 5,24
  respuesta: 5,26
  solucion_pasos:
  - $8,50 - 3,24 = 5,26$.
- titulo: Ejemplo 2
  enunciado: Calcule 10 - 4,75.
  alternativas:
  - 5,25
  - 6,25
  - 5,75
  respuesta: 5,25
  solucion_pasos:
  - $10,00 - 4,75 = 5,25$.
- titulo: ¿Es necesario transformar 10 a 10,00 para restar 10 - 4,75?
  respuesta: Sí
  solucion_pasos:
  - Sí, la alineación con ceros $10,00$ es fundamental para restar centésimas.
- titulo: ¿Es 5,4 - 2,1 igual a 3,3?
  respuesta: Sí
  solucion_pasos:
  - Sí, $5,4 - 2,1 = 3,3$.
errores_frecuentes:
- Al restar decimales cuando el minuendo tiene menos cifras decimales, se 'baja' la
  cifra del sustraendo.
- Alinear minuendo y sustraendo a la derecha ignorando la coma decimal produce la
  resta correcta.
- Rellenar con ceros a la derecha modifica el valor intrínseco del minuendo.
- La sustracción de decimales es una operación conmutativa donde el orden no altera
  la diferencia.
- Restar una cifra decimal de cero entrega como resultado esa misma cifra positiva
  sin reserva.
afirmaciones_verdaderas:
- La sustracción de decimales exige alinear las comas verticalmente y rellenar con
  ceros las vacantes del minuendo.
- El canje o reserva posicional en la resta decimal funciona de manera idéntica a
  los números enteros.
al_terminar_debes_poder: Al terminar serás capaz de restar números decimales mediante
  la alineación por coma y el relleno obligatorio de ceros a la derecha en el minuendo.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
