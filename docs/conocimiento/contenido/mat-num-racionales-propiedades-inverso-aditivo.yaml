semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.INVERSO_ADITIVO
resumen_inicial: "El inverso aditivo u opuesto de un número racional es aquel número que tiene su mismo valor absoluto pero signo contrario, tal que su suma es cero."
explicacion_simple: |
  El **inverso aditivo** (también llamado opuesto) de una fracción es su 'gemelo con signo cambiado'. Si tienes la fracción $\frac{3}{5}$, su inverso aditivo es $-\frac{3}{5}$. ¿Por qué se llama inverso aditivo? Porque si los sumas a los dos ($\frac{3}{5} + \left(-\frac{3}{5}\right)$), se anulan mutuamente y el resultado es exactamente **0**. En la recta numérica, el inverso aditivo de una fracción está ubicado a la misma distancia del cero pero en el lado contrario.
explicacion_formal: |
  Formalmente, para todo número racional $q = \frac{a}{b} \in \mathbb{Q}$, existe un único elemento llamado **inverso aditivo** u **opuesto**, denotado por $-q = -\frac{a}{b} = \frac{-a}{b}$, tal que:
  $$q + (-q) = (-q) + q = 0$$

  Geométricamente, $-q$ es la simetría especular del punto $q$ respecto al origen $0$ en la recta numérica real, cumpliendo $|q| = |-q|$.
definiciones_clave: |
  - **Inverso aditivo (Opuesto)**: Elemento $-q \in \mathbb{Q}$ que anula a $q$ bajo la adición: $q + (-q) = 0$.
  - **Simetría especular**: Propiedad geométrica por la cual $q$ y $-q$ equidistan del origen cero en la recta.
  - **Propiedad del elemento opuesto**: Axioma que garantiza que todo racional posee un único inverso aditivo en $\mathbb{Q}$.
propiedades_relaciones: |
  - **Involución del opuesto**: El inverso aditivo del inverso aditivo de un número devuelve el número original: $-(-q) = q$.
  - **Inverso del cero**: El cero es el único número racional que es su propio inverso aditivo: $-0 = 0$.
  - **Fundamento de la resta**: La sustracción $q_1 - q_2$ se define algebraicamente como la suma de $q_1$ con el inverso aditivo de $q_2$: $q_1 + (-q_2)$.
ejemplo_guiado:
  enunciado: "Halla el inverso aditivo de $q = -\\frac{5}{8}$, demuestra que la suma de ambos da cero y ubica ambos números conceptualmente en la recta."
  pasos:
    - "Cambiar el signo de $q$: el opuesto de $q = -\\frac{5}{8}$ es $-q = +\\frac{5}{8}$."
    - "Verificar la propiedad sumando ambos: $\\left(-\\frac{5}{8}\\right) + \\left(+\\frac{5}{8}\\right) = \\frac{-5 + 5}{8} = \\frac{0}{8} = 0$."
    - "Comprobar involución: $-\\left(-\\frac{5}{8}\\right) = +\\frac{5}{8}$."
    - "Ubicación en la recta: $-\\frac{5}{8}$ está $5$ octavos a la izquierda del $0$, y $+\\frac{5}{8}$ está $5$ octavos a la derecha del $0$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué resultado se obtiene siempre al sumar un número racional $q$ con su inverso aditivo $-q$?"
    choices:
      - {text: "Se obtiene siempre cero ($0$).", is_correct: true}
      - {text: "Se obtiene siempre 1.", is_correct: false}
      - {text: "Se obtiene el doble del número original.", is_correct: false}
      - {text: "Se obtiene una fracción irreductible positiva.", is_correct: false}
    explanation: "La correcta es Se obtiene siempre cero ($0$).: por definición, el opuesto aditivo anula al número produciendo el neutro aditivo $0$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cuál es el inverso aditivo del número racional expresado como decimal $-0.75$?"
    choices:
      - {text: "$+0.75 (o \\frac{3}{4})$", is_correct: true}
      - {text: "$-\\frac{4}{3}$", is_correct: false}
      - {text: "0", is_correct: false}
      - {text: "$\\frac{1}{0.75}$", is_correct: false}
    explanation: "$La correcta es +0.75 (o \\frac{3}{4}): el inverso aditivo mantiene el valor numérico y cambia el signo negativo a positivo.$"
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el número racional de partida $q$ y registrar su signo."
  - "Paso 2: Cambiar el signo del número (si era positivo pasa a negativo, si era negativo pasa a positivo)."
  - "Paso 3: Conservar exactamente el mismo valor absoluto (mismo numerador y mismo denominador)."
  - "Paso 4: Sumar el número original y su nuevo opuesto para verificar que el resultado sea $0$."
errores_correccion: |
  El error más común es dar vuelta la fracción (dar vuelta numerador y denominador) al pedir el inverso aditivo. Recuerda: **el inverso ADITIVO solo cambia el SIGNO**, no da vuelta la fracción (eso es el inverso multiplicativo).
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Cuál es el inverso aditivo de $\\frac{9}{4}$?"
    alternativas:
      - "$-\\frac{9}{4}$"
      - "$\\frac{4}{9}$"
      - "$-\\frac{4}{9}$"
    respuesta: "$-\\frac{9}{4}$"
    solucion_pasos:
      - "Cambiamos el signo a negativo manteniendo la fracción: $-\\frac{9}{4}$."
      - "Verificamos: $\\frac{9}{4} + \\left(-\\frac{9}{4}\\right) = 0$."
  - titulo: "Ejemplo 2"
    enunciado: "Expresa la resta $\\frac{3}{5} - \\frac{2}{3}$ como una suma con el inverso aditivo."
    alternativas:
      - "$\\frac{3}{5} + \\left(-\\frac{2}{3}\\right)$"
      - "$\\frac{3}{5} + \\frac{3}{2}$"
      - "$-\\frac{3}{5} + \\frac{2}{3}$"
    respuesta: "$\\frac{3}{5} + \\left(-\\frac{2}{3}\\right)$"
    solucion_pasos:
      - "Restar $\\frac{2}{3}$ equivale a sumar su opuesto $-\\frac{2}{3}$."
      - "La expresión es $\\frac{3}{5} + \\left(-\\frac{2}{3}\\right)$."
  - titulo: "¿Tiene el número cero ($0$) un inverso aditivo distinto de sí mismo?"
    respuesta: "No"
    solucion_pasos:
      - "No, el cero es el único número racional neutro cuyo opuesto es el mismo cero ($-0 = 0$)."
  - titulo: "¿El inverso aditivo del número mixto $1\\frac{1}{2}$ es $-1\\frac{1}{2}$?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, $-1\\frac{1}{2} = -\\frac{3}{2}$, y $\\frac{3}{2} + \\left(-\\frac{3}{2}\\right) = 0$."
errores_frecuentes:
  - "Confundir el inverso aditivo (opuesto de signo) con el inverso multiplicativo (dar vuelta la fracción)."
  - "Dar vuelta la fracción y además cambiarle el signo al pedir el inverso aditivo."
  - "Creer que el inverso aditivo de una fracción negativa sigue siendo negativo."
  - "Pensar que las fracciones impropias no tienen inverso aditivo."
  - "Olvidar que $q$ y $-q$ están a la misma distancia del cero en la recta numérica."
afirmaciones_verdaderas:
  - "El inverso aditivo de cualquier número racional $q$ es $-q$, y cumple que $q + (-q) = 0$."
  - "Todo número racional posee un único inverso aditivo en $\\mathbb{Q}$ ubicado simétricamente en la recta numérica respecto del cero."
al_terminar_debes_ponder: |
  Debes ser capaz de hallar el inverso aditivo de cualquier número racional, representarlo en la recta numérica y aplicarlo en la transformación de restas a sumas.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
