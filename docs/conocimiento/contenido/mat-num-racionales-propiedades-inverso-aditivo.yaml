semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.INVERSO_ADITIVO
resumen_inicial: 'Todo racional $q = \frac{a}{b}$ posee un único inverso aditivo (u
  opuesto) $-q = -\frac{a}{b}$ tal que su suma es igual a cero: $q + (-q) = 0$.'
explicacion_simple: El inverso aditivo u opuesto de un número racional es la misma
  fracción pero con el signo cambiado. Al sumar una fracción con su opuesto aditivo,
  ambos se anulan entre sí dando como resultado el número cero.
explicacion_formal: 'Para todo racional $q = \frac{a}{b} \in \mathbb{Q}$, existe un
  único **Inverso Aditivo** (u Opuesto) $-q = \frac{-a}{b} \in \mathbb{Q}$ tal que:


  $$q + (-q) = \frac{a}{b} + \frac{-a}{b} = \frac{a + (-a)}{b} = \frac{0}{b} = 0$$


  **Desglose de la fórmula:**

  - $-q = -\frac{a}{b} = \frac{-a}{b} = \frac{a}{-b}$: Mismo valor absoluto pero con
  polaridad invertida en la recta.

  - Simetría al cero: Se ubican a la misma distancia del cero en lados opuestos de
  la recta numérica.


  > **Complemento didáctico:** El opuesto aditivo de $\frac{3}{4}$ es $-\frac{3}{4}$,
  y el opuesto aditivo de $-\frac{5}{2}$ es $+\frac{5}{2}$.'
definiciones_clave: '- **Inverso aditivo (opuesto)**: El elemento $-q$ que al sumarse
  con $q$ produce el neutro aditivo $0$.'
propiedades_relaciones: '- **Propiedad de anulación aditiva**: $q + (-q) = 0$ para
  todo $q \in \mathbb{Q}$.'
ejemplo_guiado:
  enunciado: Halle el inverso aditivo de $\frac{5}{6}$ y demuestre que su suma es
    $0$.
  pasos:
  - 'Paso 1: Cambiar el signo de $\frac{5}{6}$ para obtener su opuesto: $-\frac{5}{6}$.'
  - 'Paso 2: Sumar ambas fracciones: $\frac{5}{6} + \left(-\frac{5}{6}\right) = \frac{5
    - 5}{6} = \frac{0}{6}$.'
  - 'Paso 3: Calcular el resultado: $\frac{0}{6} = 0$.'
  - 'Conclusión: El inverso aditivo de $\frac{5}{6}$ es $-\frac{5}{6}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el inverso aditivo (u opuesto) de la fracción a/b?
  choices:
  - text: -a/b (la misma fracción con signo contrario)
    is_correct: true
  - text: b/a (la fracción invertida)
    is_correct: false
  - text: '0'
    is_correct: false
  - text: '1'
    is_correct: false
  explanation: La alternativa correcta es '-a/b (la misma fracción con signo contrario)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 5/6, ¿cuál es su inverso aditivo?
  choices:
  - text: -5/6
    is_correct: true
  - text: 6/5
    is_correct: false
  - text: '0'
    is_correct: false
  - text: 5/6
    is_correct: false
  explanation: La alternativa correcta es '-5/6'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Tomar la fracción dada $q$.'
- 'Paso 2: Invertir el signo de la fracción obteniendo $-q$.'
- 'Paso 3: Verificar que la suma $q + (-q) = 0$ sea igual al neutro aditivo.'
errores_correccion: '- **Error 1: Confundir inverso aditivo (opuesto) con inverso
  multiplicativo (recíproco).** **Cómo corregirlo:** Inverso aditivo de $\frac{a}{b}$
  es $-\frac{a}{b}$ (cambia de signo); el recíproco es $\frac{b}{a}$ (da vuelta la
  fracción).


  - **Error 2: Pensar que el inverso aditivo del cero no existe.** **Cómo corregirlo:**
  El inverso aditivo de $0$ es $-0 = 0$ (sí existe).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el inverso aditivo de -3/4?
  alternativas:
  - 3/4
  - -4/3
  - 4/3
  respuesta: 3/4
  solucion_pasos:
  - $-(-3/4) = +3/4$.
- titulo: Ejemplo 2
  enunciado: Calcule la suma de 8/13 más su inverso aditivo.
  alternativas:
  - '0'
  - '1'
  - 16/13
  respuesta: '0'
  solucion_pasos:
  - $8/13 + (-8/13) = 0$ por propiedad del inverso aditivo.
- titulo: ¿Es el inverso aditivo de cualquier número racional único?
  respuesta: Sí
  solucion_pasos:
  - Sí, todo número racional tiene un único opuesto aditivo.
- titulo: ¿Es el inverso aditivo de 0 igual a 0?
  respuesta: Sí
  solucion_pasos:
  - Sí, $-0 = 0$.
errores_frecuentes:
- El inverso aditivo de una fracción se calcula dando vuelta el numerador y el denominador.
- Sumar un número racional con su inverso aditivo produce siempre el entero 1.
- Las fracciones negativas no poseen inverso aditivo en el conjunto de los racionales.
- El inverso aditivo de $2/5$ es la fracción $5/2$.
- El opuesto aditivo del número cero está indeterminado en los números racionales.
afirmaciones_verdaderas:
- Todo racional $q$ posee un único inverso aditivo $-q$ tal que $q + (-q) = 0$.
- El inverso aditivo de $\frac{a}{b}$ es $-\frac{a}{b}$, ubicado simétricamente al
  otro lado del cero en la recta.
al_terminar_debes_poder: Al terminar serás capaz de identificar y hallar el inverso
  aditivo (opuesto) de cualquier número racional, comprobando que su suma con la fracción
  original resulta igual a cero.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
