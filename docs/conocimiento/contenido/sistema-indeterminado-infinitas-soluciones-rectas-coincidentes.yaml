semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SISTEMA_INDETERMINADO
resumen_inicial: Un sistema es compatible indeterminado cuando posee infinitas soluciones,
  lo que corresponde a dos rectas coincidentes.
explicacion_simple: 'Un sistema es **compatible indeterminado** cuando la segunda
  ecuación es en realidad la misma primera ecuación multiplicada por un número.

  Geométricamente, las dos rectas están dibujadas exactamente una encima de la otra
  (**rectas coincidentes**).

  Como cada punto de la recta es una solución, el sistema posee infinitas soluciones.'
explicacion_formal: 'El sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2
  y = c_2 \end{cases}$ es **compatible indeterminado** si y solo si existe una constante
  proporcional $k \neq 0$ tal que:


  $$\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2} = k$$


  $$\text{Geometría: } L_1 = L_2 \text{ son rectas coincidentes } \implies |L_1 \cap
  L_2| = \infty$$


  $$\text{Conjunto solución: } S = \{(x, y) \in \mathbb{R}^2 \mid a_1 x + b_1 y =
  c_1\}$$'
definiciones_clave: '- **Sistema compatible indeterminado (SCI)**: Sistema lineal
  que posee un número infinito de soluciones.

  - **Rectas coincidentes**: Rectas que comparten absolutamente todos sus puntos por
  representar la misma ecuación lineal.'
propiedades_relaciones: '- **Proporcionalidad total de coeficientes**: Las tres razones
  entre los coeficientes de $x$, de $y$ y los términos constantes son idénticas.'
ejemplo_guiado:
  enunciado: Clasifica el sistema $\begin{cases} 2x + 3y = 6 \\ 4x + 6y = 12 \end{cases}$
    comparando las tres razones de sus coeficientes y determina la cantidad de soluciones
    que posee.
  pasos:
  - 'Paso 1: Calcular la razón de los coeficientes de $x$: $\frac{a_1}{a_2} = \frac{2}{4}
    = \frac{1}{2}$.Paso 2: Calcular la razón de los coeficientes de $y$: $\frac{b_1}{b_2}
    = \frac{3}{6} = \frac{1}{2}$.Paso 3: Calcular la razón de las constantes: $\frac{c_1}{c_2}
    = \frac{6}{12} = \frac{1}{2}$.Paso 4: Comprobar que $\frac{1}{2} = \frac{1}{2}
    = \frac{1}{2}$ (proporcionalidad total).Paso 5: Concluir que el sistema es **compatible
    indeterminado** (SCI) y posee infinitas soluciones representadas por rectas coincidentes.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué relación de proporcionalidad entre coeficientes caracteriza a un
    sistema compatible indeterminado?
  choices:
  - text: $\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$
    is_correct: true
  - text: $\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$
    is_correct: false
  - text: $\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$
    is_correct: false
  - text: $a_1 b_2 - a_2 b_1 \neq 0$
    is_correct: false
  explanation: La alternativa correcta es '$\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Para el sistema $\begin{cases} 2x + 3y = 6 \\ 4x + 6y = 12 \end{cases}$,
    ¿cuántas soluciones posee en el plano cartesiano?
  choices:
  - text: Infinitas soluciones (rectas coincidentes).
    is_correct: true
  - text: Una única solución (rectas secantes).
    is_correct: false
  - text: Ninguna solución (rectas paralelas).
    is_correct: false
  - text: Exactamente dos soluciones.
    is_correct: false
  explanation: La alternativa correcta es 'Infinitas soluciones (rectas coincidentes).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Formar la fracción de coeficientes de $x$: $\frac{a_1}{a_2}$.'
- 'Paso 2: Formar la fracción de coeficientes de $y$: $\frac{b_1}{b_2}$.'
- 'Paso 3: Formar la fracción de las constantes: $\frac{c_1}{c_2}$.'
- 'Paso 4: Si las tres fracciones simplificadas son exactamente iguales, clasificar
  como Compatible Indeterminado (infinitas soluciones, rectas coincidentes).'
errores_correccion: '- **Error común:** Creer que infinitas soluciones significa que
  cualquier par numérico inventado es solución.

  - **Cómo corregirlo:** Infinitas soluciones significa que todos los puntos pertenecientes
  a esa RECTA son soluciones, no cualquier par del espacio.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de clasificación.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de clasificación.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Un sistema con solución única se representa por dos rectas secantes?
  respuesta: Sí
  solucion_pasos:
  - Sí, se cortan en un único punto del plano.
- titulo: ¿Dos rectas paralelas representan un sistema sin solución?
  respuesta: Sí
  solucion_pasos:
  - Sí, al no tener puntos en común no existe solución.
errores_frecuentes:
- Confundir las condiciones de proporcionalidad para solución única y sin solución.
- Asumir que la lectura gráfica sustituye la comprobación algebraica en las ecuaciones.
- Olvidar incluir el término constante al evaluar la condición de infinitas soluciones.
- Invertir los ejes $x$ e $y$ al leer las coordenadas de intersección del gráfico.
- Confundir la igualdad de pendientes con la coincidencia total de las rectas.
afirmaciones_verdaderas:
- Un sistema 2x2 es compatible determinado si las rectas asociadas tienen pendientes
  distintas y se cortan en un único punto.
- Si las razones de los coeficientes de $x$ e $y$ son iguales pero distintas a la
  razón de las constantes, el sistema es incompatible.
al_terminar_debes_poder: Al finalizar este recurso podrás clasificar sistemas 2x2
  e interpretar sus soluciones desde la perspectiva geométrica y paramétrica.
fuente: Texto escolar MINEDUC — Álgebra / Clasificación de Sistemas 2x2
