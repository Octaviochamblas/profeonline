semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SISTEMA_INDETERMINADO
resumen_inicial: Un sistema es compatible indeterminado cuando posee infinitas soluciones, lo que geométricamente corresponde a dos rectas coincidentes que se superponen en el plano cartesiano.
explicacion_simple: |
  Un sistema de ecuaciones lineales $2 \times 2$ se clasifica como **compatible indeterminado** cuando una de las ecuaciones es equivalente a la otra (es decir, proviene de amplificar o simplificar la primera por un escalar).

  Geométricamente, al graficar ambas ecuaciones en el plano cartesiano, obtenemos dos **rectas coincidentes** que se superponen exactamente una sobre la otra.

  Dado que las dos rectas comparten todos sus puntos, el sistema posee **infinitas soluciones** que corresponden a cada par ordenado perteneciente a dicha recta.
explicacion_formal: |
  ### Definición formal
  El sistema $\begin{cases} a_1 x + b_1 y = c_1 \\ a_2 x + b_2 y = c_2 \end{cases}$ es **compatible indeterminado** (SCI) si y solo si los coeficientes de las variables y las constantes independientes son rigurosamente proporcionales:

  $$\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2} = k \quad (k \neq 0)$$

  $$\text{Geometría: } L_1 = L_2 \text{ son rectas coincidentes } \implies |L_1 \cap L_2| = \infty$$

  $$\text{Conjunto solución: } S = \{(x, y) \in \mathbb{R}^2 \mid a_1 x + b_1 y = c_1\}$$

  ### Síntesis didáctica
  Las dos ecuaciones no aportan información independiente; representan exactamente la misma restricción geométrica en la recta cartesiana.
definiciones_clave: |
  - **Sistema compatible indeterminado (SCI)**: Sistema lineal que admite un conjunto infinito de soluciones continuas sobre la misma recta.
  - **Rectas coincidentes**: Rectas en el plano cartesiano que comparten el 100% de sus puntos por ser representaciones afines equivalentes.
propiedades_relaciones: |
  - **Proporcionalidad total de coeficientes**: Las tres razones $\frac{a_1}{a_2}$, $\frac{b_1}{b_2}$ y $\frac{c_1}{c_2}$ coinciden numéricamente.
  - **Igualdad de pendiente e intersección**: Las rectas asociadas poseen la misma pendiente $m_1 = m_2$ y el mismo coeficiente de posición $n_1 = n_2$.
ejemplo_guiado:
  enunciado: 'Clasifica el sistema $\begin{cases} 2x + 3y = 6 \\ 4x + 6y = 12 \end{cases}$ comparando las tres razones de sus coeficientes y determina la cantidad de soluciones que posee.'
  pasos:
    - 'Paso 1: Calcular la razón entre los coeficientes de $x$: $\frac{a_1}{a_2} = \frac{2}{4} = \frac{1}{2}$.'
    - 'Paso 2: Calcular la razón entre los coeficientes de $y$: $\frac{b_1}{b_2} = \frac{3}{6} = \frac{1}{2}$.'
    - 'Paso 3: Calcular la razón entre los términos independientes: $\frac{c_1}{c_2} = \frac{6}{12} = \frac{1}{2}$.'
    - 'Paso 4: Comprobar la proporcionalidad total: $\frac{1}{2} = \frac{1}{2} = \frac{1}{2}$.'
    - 'Paso 5: Concluir que el sistema es **compatible indeterminado** (SCI) y posee infinitas soluciones representadas por dos rectas coincidentes.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué relación de proporcionalidad entre coeficientes y constantes caracteriza a un sistema compatible indeterminado?'
    choices:
      - {text: '$\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$', is_correct: true}
      - {text: '$\frac{a_1}{a_2} = \frac{b_1}{b_2} \neq \frac{c_1}{c_2}$', is_correct: false}
      - {text: '$\frac{a_1}{a_2} \neq \frac{b_1}{b_2}$', is_correct: false}
      - {text: '$a_1 b_2 - a_2 b_1 \neq 0$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$''.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Para el sistema $\begin{cases} 2x + 3y = 6 \\ 4x + 6y = 12 \end{cases}$, ¿cuántas soluciones posee en el plano cartesiano?'
    choices:
      - {text: 'Infinitas soluciones (rectas coincidentes).', is_correct: true}
      - {text: 'Una única solución (rectas secantes).', is_correct: false}
      - {text: 'Ninguna solución (rectas paralelas).', is_correct: false}
      - {text: 'Exactamente dos soluciones.', is_correct: false}
    explanation: 'La alternativa correcta es ''Infinitas soluciones (rectas coincidentes).''.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar los coeficientes $a_1, a_2$ de $x$, $b_1, b_2$ de $y$ y las constantes $c_1, c_2$.'
  - 'Paso 2: Formar las tres razones fraccionarias $\frac{a_1}{a_2}$, $\frac{b_1}{b_2}$ y $\frac{c_1}{c_2}$.'
  - 'Paso 3: Simplificar cada una de las fracciones a su expresión irreductible.'
  - 'Paso 4: Si las tres fracciones son exactamente iguales, clasificar como Compatible Indeterminado (SCI).'
  - 'Paso 5: Reportar que el sistema posee infinitas soluciones correspondientes a rectas coincidentes.'
errores_correccion: |
  - **Error 1:** Confundir "infinitas soluciones" con admitir cualquier par ordenado arbitrario del plano como solución. **Cómo corregirlo:** Infinitas soluciones **SIGNIFICA QUE TODOS Y CADA UNO DE LOS PUNTOS QUE PERTENECEN A ESA RECTA ESPECÍFICA SON SOLUCIÓN, NO CUALQUIER PAR $(x, y)$ ARBITRARIO DE TODO EL PLANO $\mathbb{R}^2$**.
  - **Error 2:** Omitir la comprobación del término independiente $\frac{c_1}{c_2}$ y declarar el sistema como indeterminado evaluando solo $\frac{a_1}{a_2} = \frac{b_1}{b_2}$. **Cómo corregirlo:** La condición de infinitas soluciones **EXIGE RIGUROSAMENTE QUE LA TERCERA RAZÓN TAMBIÉN SEA IGUAL ($\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$); SI $\frac{c_1}{c_2}$ ES DISTINTA, EL SISTEMA ES INCONSISTENTE (SIN SOLUCIÓN)**.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: '¿El sistema $\begin{cases} x - y = 3 \\ 2x - 2y = 6 \end{cases}$ es compatible indeterminado?'
    alternativas:
      - 'Sí, pues $\frac{1}{2} = \frac{-1}{-2} = \frac{3}{6} = \frac{1}{2}$'
      - 'No, el sistema no tiene solución'
      - 'No, el sistema tiene solución única $(3, 0)$'
    respuesta: 'Sí, pues $\frac{1}{2} = \frac{-1}{-2} = \frac{3}{6} = \frac{1}{2}$'
    solucion_pasos:
      - '1. $\frac{a_1}{a_2} = \frac{1}{2}$.'
      - '2. $\frac{b_1}{b_2} = \frac{-1}{-2} = \frac{1}{2}$.'
      - '3. $\frac{c_1}{c_2} = \frac{3}{6} = \frac{1}{2}$. Como son iguales, es SCI.'
  - titulo: 'Ejemplo 2'
    enunciado: '¿Para qué valor de $m$ el sistema $\begin{cases} 3x + y = 4 \\ 6x + 2y = m \end{cases}$ posee infinitas soluciones?'
    alternativas:
      - '$m = 8$'
      - '$m = 4$'
      - '$m = 12$'
    respuesta: '$m = 8$'
    solucion_pasos:
      - '1. Exigir $\frac{3}{6} = \frac{1}{2} = \frac{4}{m}$.'
      - '2. $\frac{1}{2} = \frac{4}{m} \implies m = 8$.'
  - titulo: 'Rectas coincidentes'
    enunciado: '¿Un sistema compatible indeterminado se representa mediante dos rectas coincidentes?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, al superponerse comparten la totalidad de sus puntos.'
  - titulo: 'Proporcionalidad total'
    enunciado: '¿La igualdad de las tres razones de coeficientes y constantes caracteriza las infinitas soluciones?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por el criterio de proporcionalidad total.'
errores_frecuentes:
  - 'Creer que infinitas soluciones permite aceptar cualquier par de números aleatorio como respuesta.'
  - 'Omitir la comprobación de las constantes independientes $\frac{c_1}{c_2}$.'
  - 'Confundir un sistema indeterminado (rectas coincidentes) con uno inconsistente (rectas paralelas).'
  - 'Dividir con signos opuestos obteniendo una razón inconsistente.'
  - 'Afirmar que un sistema indeterminado no se puede graficar en el plano.'
afirmaciones_verdaderas:
  - 'Un sistema 2x2 es compatible indeterminado si y solo si las tres razones de coeficientes y constantes son iguales ($\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$).'
  - 'Geométricamente, un sistema compatible indeterminado representa dos rectas coincidentes que comparten infinitos puntos de contacto.'
al_terminar_debes_poder: |
  QUÉ: Identificar y clasificar un sistema de ecuaciones 2x2 como compatible indeterminado.
  CÓMO: Comprobar la igualdad de las tres razones $\frac{a_1}{a_2} = \frac{b_1}{b_2} = \frac{c_1}{c_2}$ e interpretar sus rectas como coincidentes con infinitas soluciones.
