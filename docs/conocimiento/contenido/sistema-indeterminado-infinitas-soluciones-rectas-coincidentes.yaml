procedimiento:
- Observa si una ecuación es exactamente un múltiplo directo de la otra (en todos
  sus términos, incluyendo el resultado).
- Si es así, las rectas son coincidentes (están superpuestas).
- Concluye que el sistema tiene infinitas soluciones.
- Si lo resuelves algebraicamente, llegarás a una identidad verdadera como $0=0$ o
  $5=5$.
errores_correccion: 'Evita cambiar el signo del coeficiente que pasa dividiendo al
  despejar en sistema indeterminado: infinitas soluciones (rectas coincidentes).'
ejemplos:
- titulo: $x+y=2$ y $2x+2y=4$
  enunciado: Justifica el procedimiento adecuado para el caso $x+y=2$ y $2x+2y=4$.
  solucion_pasos:
  - 'A veces, el sistema te intenta engañar. Te da dos ecuaciones, pero una es simplemente
    el doble de la otra (ej: $x+y=2$ y $2x+2y=4$).'
  - Observa si una ecuación es exactamente un múltiplo directo de la otra (en todos
    sus términos, incluyendo el resultado).
- titulo: $0 = 0$
  enunciado: Determina qué debe hacerse en $0 = 0$ y fundamenta cada transformación.
  solucion_pasos:
  - Si intentas resolverlo con álgebra, las letras se eliminarán y llegarás a una
    verdad obvia como $0 = 0$.
  - Si es así, las rectas son coincidentes (están superpuestas).
