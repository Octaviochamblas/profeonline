semantic_id: MAT.ALG.SISTEMAS_REPRESENTACION.SISTEMA_INDETERMINADO
resumen_inicial: 'Sistema indeterminado: infinitas soluciones (rectas coincidentes):
  propiedades, resolución y modelamiento en Representación y clasificación de sistemas
  2x2.'
explicacion_simple: Al graficarlas, dibujas la primera línea, y cuando intentas dibujar
  la segunda, te das cuenta de que cae exactamente encima de la primera. Son la misma
  recta.
explicacion_formal: '### Definición formal


  Un sistema $a_1x+b_1y=c_1$, $a_2x+b_2y=c_2$ es compatible indeterminado (infinitas
  soluciones) si y solo si sus tres razones coinciden, $\frac{a_1}{a_2} = \frac{b_1}{b_2}
  = \frac{c_1}{c_2}$: ambas ecuaciones describen la misma recta, por lo que todo punto
  de una satisface también a la otra.


  ### Desarrollo didáctico


  Al graficarlas, dibujas la primera línea, y cuando intentas dibujar la segunda,
  te das cuenta de que cae exactamente encima de la primera. Son la misma recta.

  ¿En cuántos puntos se tocan dos rectas que están montadas una sobre la otra? En
  todos. Tienen **infinitos puntos de contacto**. Por eso es ''Indeterminado'', porque
  no puedes determinar una sola solución. Todas sirven.


  Si intentas resolverlo con álgebra, las letras se eliminarán y llegarás a una verdad
  obvia como $0 = 0$.'
