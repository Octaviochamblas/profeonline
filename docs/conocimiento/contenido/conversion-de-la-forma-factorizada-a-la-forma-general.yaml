semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FACTORIZADA_A_GENERAL
resumen_inicial: 'La conversión de la forma factorizada a la forma general se logra multiplicando los binomios $(x - x_1)(x - x_2)$, distribuyendo el coeficiente principal $a$ y reduciendo los coeficientes.'
explicacion_simple: |
  Para transformar una función dada en forma factorizada $a(x - x_1)(x - x_2)$ a la forma general $ax^2 + bx + c$, aplicamos la propiedad distributiva para multiplicar los dos paréntesis entre sí. Luego, multiplicamos cada término resultante por el coeficiente $a$ y agrupamos los números hasta obtener el trinomio ordenado.
explicacion_formal: |
  ### Definición formal
  El procedimiento algebraico de **conversión factorizada a general** transforma la regla $f(x) = a(x - x_1)(x - x_2)$ en el polinomio trinomio $f(x) = ax^2 + bx + c$ aplicando la propiedad distributiva del producto sobre la suma:

  ### Desglose simbólico
  1. Multiplicación de factores lineales: $(x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + x_1 x_2$.
  2. Distribución del coeficiente principal $a$: $f(x) = a [x^2 - (x_1 + x_2)x + x_1 x_2] = ax^2 - a(x_1 + x_2)x + a x_1 x_2$.
  3. Coincidencia con relaciones de Vieta:
     - Coeficiente cuadrático: $a = a$.
     - Coeficiente lineal: $b = -a(x_1 + x_2) \implies x_1 + x_2 = -\frac{b}{a}$.
     - Coeficiente independiente: $c = a x_1 x_2 \implies x_1 x_2 = \frac{c}{a}$.

  ### Síntesis didáctica
  Este desarrollo valida de forma directa las fórmulas de Vieta: el producto de los ceros multiplicado por $a$ resulta exactamente la constante de corte $c = a x_1 x_2$.
definiciones_clave: |
  - **Multiplicación de binomios**: Aplicación de la propiedad distributiva $(x - p)(x - q) = x^2 - (p+q)x + pq$.
  - **Relaciones de Vieta**: Conexión algebraica entre las raíces $x_1, x_2$ y los coeficientes $a, b, c$.
  - **Producto de raíces de corte**: Término constante $c = a x_1 x_2$ derivado del valor en $x = 0$.
propiedades_relaciones: |
  - **Conservación de ceros**: El desarrollo multiplicativo mantiene intactos los puntos donde $f(x) = 0$.
  - **Determinación del corte en $y$**: La constante independiente final $c = a x_1 x_2$ da directamente el punto de intersección $(0, c)$ con el eje vertical.
ejemplo_guiado:
  enunciado: 'Convierte la función cuadrática en forma factorizada $f(x) = 2(x - 3)(x + 5)$ a su correspondiente forma general $f(x) = ax^2 + bx + c$ especificando los coeficientes $a$, $b$ y $c$.'
  pasos:
    - 'Paso 1: Multiplicamos los binomios mediante distributividad: $(x - 3)(x + 5) = x^2 + 5x - 3x - 15 = x^2 + 2x - 15$.'
    - 'Paso 2: Sustituimos el trinomio en la función y distribuimos el factor $2$: $f(x) = 2(x^2 + 2x - 15) = 2x^2 + 4x - 30$.'
    - 'Paso 3: Comparamos con $ax^2 + bx + c$, concluyendo que la forma general es $f(x) = 2x^2 + 4x - 30$, con $a = 2$, $b = 4$ y $c = -30$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la forma general obtenida al desarrollar la función en forma factorizada $g(x) = -3(x - 1)(x - 4)$?'
    choices:
      - {text: '$g(x) = -3x^2 + 15x - 12$', is_correct: true}
      - {text: '$g(x) = -3x^2 - 15x - 12$', is_correct: false}
      - {text: '$g(x) = -3x^2 + 5x - 4$', is_correct: false}
      - {text: '$g(x) = -3x^2 + 15x + 12$', is_correct: false}
    explanation: 'La alternativa correcta es ''$g(x) = -3x^2 + 15x - 12$''. Desarrollamos $(x - 1)(x - 4) = x^2 - 5x + 4$. Multiplicamos por $-3$: $-3(x^2 - 5x + 4) = -3x^2 + 15x - 12$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Al convertir $p(x) = -(x + 2)(x - 6)$ a su forma general, ¿cuál es el término independiente $c$?'
    choices:
      - {text: '$c = 12$', is_correct: true}
      - {text: '$c = -12$', is_correct: false}
      - {text: '$c = 4$', is_correct: false}
      - {text: '$c = -4$', is_correct: false}
    explanation: 'La alternativa correcta es ''$c = 12$''. Multiplicamos $(x + 2)(x - 6) = x^2 - 4x - 12$. Aplicamos el signo menos exterior: $-x^2 + 4x + 12$, obteniendo $c = 12$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Multiplicar los dos binomios entre sí aplicando la regla de doble distribución $(x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + x_1 x_2$.'
  - 'Paso 2: Multiplicar cada término del resultado por el coeficiente multiplicativo $a$.'
  - 'Paso 3: Ordenar los términos en grado decreciente $ax^2 + bx + c$.'
errores_correccion: |
  - **Error 1:** Multiplicar el factor $a$ por ambos binomios a la vez (ej: en $2(x - 1)(x + 3)$ escribir $(2x - 2)(2x + 6)$). **Cómo corregirlo:** La multiplicación es asociativa. Se debe multiplicar el factor $a$ únicamente una vez (por el producto de los dos binomios o por uno solo de los binomios).
  - **Error 2:** Errar los signos al multiplicar números negativos dentro de los binomios. **Cómo corregirlo:** Recordar que el producto de dos números negativos es positivo: $(-x_1) \cdot (-x_2) = +x_1 x_2$.
ejemplos:
  - titulo: 'Conversión con a = 1'
    enunciado: '¿Cuál es la forma general de $f(x) = (x - 2)(x - 7)$?'
    alternativas:
      - '$f(x) = x^2 - 9x + 14$'
      - '$f(x) = x^2 + 9x + 14$'
      - '$f(x) = x^2 - 9x - 14$'
    respuesta: '$f(x) = x^2 - 9x + 14$'
    solucion_pasos:
      - '1. Aplicamos distributividad: $x \cdot x - 7x - 2x + (-2)(-7)$.'
      - '2. Agrupamos: $x^2 - 9x + 14$.'
  - titulo: 'Conversión con raíces de signos opuestos'
    enunciado: '¿Cuál es la forma general de $g(x) = -4(x + 3)(x - 3)$?'
    alternativas:
      - '$g(x) = -4x^2 + 36$'
      - '$g(x) = -4x^2 - 36$'
      - '$g(x) = -4x^2 + 24x$'
    respuesta: '$g(x) = -4x^2 + 36$'
    solucion_pasos:
      - '1. El producto $(x + 3)(x - 3) = x^2 - 9$ es una diferencia de cuadrados.'
      - '2. Multiplicamos por $-4$: $-4(x^2 - 9) = -4x^2 + 36$.'
  - titulo: 'Verificación del producto de raíces'
    enunciado: 'Dada $f(x) = 3(x - 1)(x - 2)$, ¿el término independiente resultante $c$ vale $6$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. Aplicando $c = a x_1 x_2 = 3(1)(2) = 6$.'
  - titulo: 'Constancia del coeficiente principal'
    enunciado: '¿El valor de $a$ al convertir $a(x - x_1)(x - x_2)$ a forma general sigue siendo $a$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. El coeficiente del término $x^2$ permanece inalterado como $a$.'
errores_frecuentes:
  - 'Al desarrollar $2(x - 3)(x + 4)$, se multiplica el 2 por el primer binomio y también por el segundo binomio obteniendo $(2x - 6)(2x + 8)$.'
  - 'El producto de binomios $(x - 5)(x + 5)$ produce el trinomio $x^2 - 10x + 25$.'
  - 'Al convertir de forma factorizada a forma general, los ceros de la función cambian de valor.'
  - 'En la función factorizada $f(x) = -x(x - 6)$, la constante independiente de la forma general es $c = -6$.'
  - 'La conversión de factorizada a general requiere resolver la fórmula general cuadrática.'
afirmaciones_verdaderas:
  - 'Para convertir una función desde su forma factorizada a su forma general se multiplican los binomios y se distribuye el coeficiente principal $a$.'
  - 'El término independiente $c$ de la forma general resultante es igual al producto de los ceros multiplicado por $a$ ($c = a x_1 x_2$).'
al_terminar_debes_poder: 'Convertir cualquier función cuadrática desde su forma factorizada a su forma general mediante operaciones de multiplicación distributiva y reducción.'
