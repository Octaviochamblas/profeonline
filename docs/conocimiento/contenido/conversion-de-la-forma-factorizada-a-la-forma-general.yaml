semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FACTORIZADA_A_GENERAL
resumen_inicial: La conversión de la forma factorizada $f(x) = a(x - x_1)(x - x_2)$ a la forma general $f(x) = ax^2 + bx + c$ se realiza multiplicando los binomios lineales con término común $(x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + x_1 x_2$ y distribuyendo el coeficiente principal $a$.
explicacion_simple: "![La conversión de la forma factorizada $f(x) = a(x - x_1)(x - x_2)$ a la forma general $f(x) = ax^2 + bx + c$ se realiza multiplicando los binomios lineales con término común $(x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + x_1 x_2$ y distribuyendo el coeficiente principal $a$](/static/img/nodos/conversion-de-la-forma-factorizada-a-la-forma-general-intro.svg)\n\n\nPara pasar de la forma factorizada a la forma general:\n\n**Paso a paso:**\n1. Multiplica los dos paréntesis entre sí aplicando la propiedad distributiva:\n   $$(x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + x_1 x_2$$\n2. Multiplica cada uno de los tres términos resultantes por el número $a$ que está afuera.\n3. ¡Listo! Ya tienes la función en su forma estándar **$ax^2 + bx + c$**.\n\n*Ejemplo:* $f(x) = 2(x - 3)(x + 4)$\n- Multiplicar paréntesis: $(x - 3)(x + 4) = x^2 + 4x - 3x - 12 = x^2 + x - 12$.\n- Multiplicar por 2: $2(x^2 + x - 12) = \\mathbf{2x^2 + 2x - 24}$."
explicacion_formal: 'Sea $f(x) = a(x - x_1)(x - x_2)$ con $a \neq 0$ y ceros reales $x_1, x_2$. La **expansión polinómica de Vieta** establece:

  $$(x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + x_1 x_2$$


  Multiplicando por el escalar $a$:

  $$f(x) = ax^2 - a(x_1 + x_2)x + a(x_1 x_2)$$


  **Relación con los coeficientes generales**:

  $$\begin{cases} a = a \\ b = -a(x_1 + x_2) \\ c = a x_1 x_2 \end{cases}$$'
definiciones_clave: '- **Producto de binomios con término común**: Regla $(x + p)(x + q) = x^2 + (p + q)x + pq$.

  - **Distribución de escala**: Multiplicación del coeficiente $a$ sobre todos los monomios resultantes.'
propiedades_relaciones: '- **Cálculo directo de la constante c**: $c = a \cdot x_1 \cdot x_2$.

  - **Cálculo directo del coeficiente lineal b**: $b = -a(x_1 + x_2) = -2a x_v$.'
ejemplo_guiado:
  enunciado: '![Ejemplo La conversión de la forma factorizada $f(x) = a(x - x_1)(x - x_2)$ a la forma general $f(x) = ax^2 + bx + c$ se realiza multiplicando los binomios lineales con término común $(x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + x_1 x_2$ y distribuyendo el coeficiente principal $a$](/static/img/nodos/conversion-de-la-forma-factorizada-a-la-forma-general-ejemplos.svg)



    Convierte la función factorizada $f(x) = -3(x - 2)(x + 5)$ a su forma general canónica $ax^2 + bx + c$.'
  pasos:
  - 'Paso 1: Multiplicar los binomios lineales $(x - 2)(x + 5)$:

    $(x - 2)(x + 5) = x^2 + 5x - 2x - 10 = x^2 + 3x - 10$.'
  - 'Paso 2: Distribuir el coeficiente principal $a = -3$ sobre el trinomio:

    $f(x) = -3(x^2 + 3x - 10) = -3(x^2) - 3(3x) - 3(-10)$.'
  - 'Paso 3: Realizar los productos numéricos:

    $f(x) = -3x^2 - 9x + 30$.'
  - 'Paso 4: Conclusión: La forma general es $f(x) = -3x^2 - 9x + 30$ ($a = -3, b = -9, c = 30$).'
checkpoints:
- placement: after_explicacion_formal
  question: Al convertir $f(x) = (x - 6)(x - 2)$ a forma general, ¿cuál es el resultado?
  choices:
  - text: f(x) = x² - 8x + 12
    is_correct: true
  - text: f(x) = x² + 8x + 12
    is_correct: false
  - text: f(x) = x² - 8x - 12
    is_correct: false
  - text: f(x) = x² - 12x + 8
    is_correct: false
  explanation: La alternativa correcta es 'f(x) = x² - 8x + 12'. $x^2 - (6 + 2)x + (6)(2) = x^2 - 8x + 12$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el valor de c al expandir $f(x) = -4(x + 2)(x - 3)$?
  choices:
  - text: c = 24 (porque -4 · (2) · (-3) = 24)
    is_correct: true
  - text: c = -24
    is_correct: false
  - text: c = -6
    is_correct: false
  - text: c = 12
    is_correct: false
  explanation: La alternativa correcta es 'c = 24 (porque -4 · (2) · (-3) = 24)'. $(2)(-3) = -6$, y multiplicado por $-4$ da $+24$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar los dos binomios lineales entre sí aplicando término común.'
- 'Paso 2: Reducir los términos semejantes de primer grado.'
- 'Paso 3: Distribuir el coeficiente principal $a$ sobre el trinomio.'
- 'Paso 4: Escribir el polinomio ordenado $ax^2 + bx + c$.'
errores_correccion: '- **Error común:** Olvidar multiplicar el último término numérico por $a$.

  - **Cómo corregirlo:** El coeficiente $a$ **multiplica a los TRES términos** del trinomio: **$ax^2 + bx + c$**.'
ejemplos:
- titulo: 'Ejemplo 1: Conversión con ceros de signos opuestos'
  enunciado: Expande $f(x) = (x - 5)(x + 3)$.
  alternativas:
  - x^2 - 2x - 15
  - x^2 + 2x - 15
  - x^2 - 8x - 15
  - x^2 - 15
  respuesta: x^2 - 2x - 15
  solucion_pasos:
  - 'Paso 1: $x^2 + 3x - 5x - 15 = x^2 - 2x - 15$.'
- titulo: 'Ejemplo 2: Conversión con factor a = -2'
  enunciado: Convierte $g(x) = -2(x - 1)(x - 4)$ a forma general.
  alternativas:
  - -2x^2 + 10x - 8
  - -2x^2 - 10x - 8
  - -2x^2 + 10x + 8
  - -2x^2 - 5x + 4
  respuesta: -2x^2 + 10x - 8
  solucion_pasos:
  - 'Paso 1: $-2(x^2 - 5x + 4) = -2x^2 + 10x - 8$.'
- titulo: 'Ejemplo 3: Conversión con raíz en el origen'
  enunciado: Expande $h(x) = 5x(x - 6)$.
  alternativas:
  - 5x^2 - 30x
  - 5x^2 - 6x
  - 5x^2 - 30
  - x^2 - 30x
  respuesta: 5x^2 - 30x
  solucion_pasos:
  - 'Paso 1: $5x(x) - 5x(6) = 5x^2 - 30x$.'
- titulo: 'Ejemplo 4: Suma por su diferencia'
  enunciado: Convierte $f(x) = 3(x - 4)(x + 4)$ a forma general.
  alternativas:
  - 3x^2 - 48
  - 3x^2 - 16
  - 3x^2 - 24x - 48
  - 3x^2 + 48
  respuesta: 3x^2 - 48
  solucion_pasos:
  - 'Paso 1: $3(x^2 - 16) = 3x^2 - 48$.'
errores_frecuentes:
- Cometer errores de signos al multiplicar números negativos.
- Olvidar distribuir el factor a al término constante.
- Sumar en lugar de multiplicar los términos lineales.
afirmaciones_verdaderas:
- La forma general resultante de expandir a(x - x₁)(x - x₂) tiene término constante c = a x₁ x₂.
- El coeficiente lineal b resultante equivale a -a(x₁ + x₂).
al_terminar_debes_poder: '**QUÉ:** Convertir una función cuadrática de forma factorizada a forma general.


  **CÓMO:** Multiplicando los binomios lineales y distribuyendo el factor a sobre el trinomio cuadrático resultante.


  ![Resumen La conversión de la forma factorizada $f(x) = a(x - x_1)(x - x_2)$ a la forma general $f(x) = ax^2 + bx + c$ se realiza multiplicando los binomios lineales con término común $(x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + x_1 x_2$ y distribuyendo el coeficiente principal $a$](/static/img/nodos/conversion-de-la-forma-factorizada-a-la-forma-general-resumen.svg)'
