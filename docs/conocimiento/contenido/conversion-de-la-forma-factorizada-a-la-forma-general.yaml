  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Desarrolla el producto de los dos binomios $(x-r_1)(x-r_2)$ mediante distribución.'
- 'Paso 2: Reduce los términos semejantes del desarrollo.'
- 'Paso 3: Distribuye el coeficiente $a$ en cada término.'
errores_correccion: Evita confundir la ordenada del vértice $k = f(h)$ con el intercepto
  en el eje $y$ dado por $(0, c)$ en conversión de la forma factorizada a la forma
  general.
ejemplos:
- titulo: Conversión con coeficiente a igual a 1
  enunciado: Convierte a forma general $f(x)=(x-3)(x-7)$.
  solucion_pasos:
  - 'Desarrollando: $x^2-7x-3x+21=x^2-10x+21$.'
  - $f(x)=x^2-10x+21$.
- titulo: Conversión con coeficiente a distinto de 1
  enunciado: Convierte a forma general $f(x)=2(x+1)(x-5)$.
  solucion_pasos:
  - 'Desarrollando: $(x+1)(x-5)=x^2-5x+x-5=x^2-4x-5$.'
  - 'Multiplicando por $2$: $f(x)=2x^2-8x-10$.'
- titulo: ¿Convertir de forma factorizada a forma general cambia los ceros de la función?
  enunciado: ¿Convertir de forma factorizada a forma general cambia los ceros de la
    función?
  respuesta: 'No'
  solucion_pasos:
  - Son la misma función expresada de dos maneras equivalentes; los ceros siguen siendo
    exactamente los mismos.
- titulo: ¿El término independiente $c$ de la forma general es igual al producto $a
    \cdot r_1 \cdot r_2$?
  enunciado: ¿El término independiente $c$ de la forma general es igual al producto
    $a \cdot r_1 \cdot r_2$?
  respuesta: Sí
  solucion_pasos:
  - Al desarrollar $a(x-r_1)(x-r_2)$, el término constante resultante es exactamente
    $a \cdot r_1 \cdot r_2$.
errores_frecuentes:
- Cometer errores de signo al desarrollar el producto de binomios con raíces negativas.
- Olvidar distribuir el coeficiente $a$ en todos los términos del desarrollo.
- No reducir correctamente los términos semejantes al multiplicar los binomios.
- Confundir el desarrollo del producto de binomios con el cuadrado de un binomio.
afirmaciones_verdaderas:
- Toda gráfica de una función cuadrática es una parábola simétrica respecto a una
  recta vertical.
al_terminar_debes_poder: Analizar, graficar y optimizar funciones cuadráticas aplicando
  conversión de la forma factorizada a la forma general.
