semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FACTORIZADA_A_GENERAL
resumen_inicial: La conversión de forma factorizada a general multiplica los binomios $a(x - x_1)(x - x_2)$ para expandirlos al formato $ax^2 + bx + c$.
explicacion_simple: |
  Para transformar una función cuadrática de forma factorizada $f(x) = a(x - x_1)(x - x_2)$ a forma general $f(x) = ax^2 + bx + c$:

  1. **Multiplicas los dos paréntesis entre sí** usando la propiedad distributiva:
     $$(x - x_1)(x - x_2) = x^2 - (x_1 + x_2)x + x_1 x_2$$
  2. **Multiplicas el resultado por el coeficiente $a$**:
     $$a[x^2 - (x_1 + x_2)x + x_1 x_2] = ax^2 - a(x_1 + x_2)x + a x_1 x_2$$

  **Ejemplo**: Pasar $f(x) = 2(x - 3)(x - 5)$ a forma general:
  - Multiplicar paréntesis: $(x - 3)(x - 5) = x^2 - 5x - 3x + 15 = x^2 - 8x + 15$.
  - Multiplicar por $2$: $2(x^2 - 8x + 15) = 2x^2 - 16x + 30$.
  - ¡La forma general es **$f(x) = 2x^2 - 16x + 30$**!
explicacion_formal: |
  Dada la función cuadrática expresada en forma factorizada $f(x) = a(x - x_1)(x - x_2)$, la aplicación del **algoritmo de multiplicación polinómica distributiva** la convierte al formato polinómico canónico $f(x) = ax^2 + bx + c$:

  $$f(x) = a[x^2 - (x_1 + x_2)x + x_1 x_2] = ax^2 + [-a(x_1 + x_2)]x + [a x_1 x_2]$$

  **Relación directa con los teoremas de Vieta:**
  - Coeficiente cuadrático: $a_{gen} = a_{fact}$
  - Coeficiente lineal: $b = -a(x_1 + x_2)$
  - Coeficiente independiente: $c = a \cdot x_1 \cdot x_2$
definiciones_clave: |
  - **Conversión factorizada a general**: Proceso de expansión distributiva que elimina la estructura de factores lineales para obtener el polinomio ordenado de segundo grado.
propiedades_relaciones: |
  - **Cálculo directo del corte en Y desde las raíces**: En la conversión, el término independiente $c = f(0)$ se obtiene directamente multiplicando el coeficiente principal por el producto de las dos raíces: $c = a x_1 x_2$.
ejemplo_guiado:
  enunciado: 'Convierte la función $f(x) = -3(x + 1)(x - 4)$ a su forma general e identifica el punto de corte con el eje Y.'
  pasos:
    - 'Paso 1: Multiplicar los binomios: $(x + 1)(x - 4) = x^2 - 4x + x - 4 = x^2 - 3x - 4$.'
    - 'Paso 2: Distribuir el coeficiente $a = -3$: $-3(x^2 - 3x - 4) = -3x^2 + 9x + 12$.'
    - 'Paso 3: Formular la forma general: $f(x) = -3x^2 + 9x + 12$.'
    - 'Paso 4: Extraer el término independiente $c = 12$ y concluir que el corte en Y es $(0, 12)$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'Al convertir $f(x) = (x - 2)(x - 6)$ a forma general, ¿cuáles son los coeficientes $b$ y $c$ de la expresión resultante?'
    choices:
      - {text: '$b = -8$ y $c = 12$', is_correct: true}
      - {text: '$b = 8$ y $c = -12$.', is_correct: false}
      - {text: '$b = -12$ y $c = 8$.', is_correct: false}
      - {text: '$b = -4$ y $c = 12$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$b = -8$ y $c = 12$''. Desarrollando $x^2 - 6x - 2x + 12 = x^2 - 8x + 12$.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la forma general de la función cuadrática factorizada $f(x) = 5(x + 2)(x - 2)$?'
    choices:
      - {text: '$f(x) = 5x^2 - 20$', is_correct: true}
      - {text: '$f(x) = 5x^2 - 4$.', is_correct: false}
      - {text: '$f(x) = 5x^2 + 20x - 20$.', is_correct: false}
      - {text: '$f(x) = 25x^2 - 20$.', is_correct: false}
    explanation: 'La alternativa correcta es ''$f(x) = 5x^2 - 20$''. $(x+2)(x-2) = x^2 - 4$, y $5(x^2 - 4) = 5x^2 - 20$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Multiplicar los binomios $(x - x_1)(x - x_2)$ mediante la regla del producto. FOIL (Primero, Exterior, Interior, Último).'
  - 'Paso 2: Reducir los dos términos semejantes centrales de primer grado.'
  - 'Paso 3: Multiplicar todo el trinomio entre paréntesis por el coeficiente externo $a$.'
  - 'Paso 4: Escribir el resultado ordenado $ax^2 + bx + c$.'
errores_correccion: |
  - **Error común:** Olvidar multiplicar el término constante $x_1 x_2$ por el coeficiente $a$ al final de la distribución.
  - **Cómo corregirlo:** Recuerda que $a$ **MULTIPLICA A LOS TRES TÉRMINOS**: a $x^2$, al término de $x$ y al término constante $c = a x_1 x_2$.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Expansión de raíces mixtas.
    alternativas:
      - 'f(x) = x^2 - x - 12'
      - 'f(x) = x^2 + x - 12'
      - 'f(x) = x^2 - 7x + 12'
    respuesta: 'f(x) = x^2 - x - 12'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Expansión con coeficiente no unitario.
    alternativas:
      - 'f(x) = 4x^2 - 24x + 32'
      - 'f(x) = 4x^2 - 6x + 8'
      - 'f(x) = 4x^2 - 24x + 8'
    respuesta: 'f(x) = 4x^2 - 24x + 32'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada la función $f(x) = 2(x - 1)(x - 3)$, es correcto afirmar que su término independiente es $c = 3$.'
  - 'La distribución del factor $a$ sobre el primer paréntesis únicamente y su posterior redistribución sobre el segundo paréntesis.'
  - 'Cometer errores de signo en la suma algebraica de los términos centrales $-x_1 x - x_2 x$.'
  - 'La suposición de que al convertir a forma general se alteran los ceros originales de la función.'
  - 'La ausencia de paréntesis de agrupación antes de distribuir el coeficiente cuadrático $a$.'
afirmaciones_verdaderas:
  - 'Convertir la forma factorizada $a(x - x_1)(x - x_2)$ a forma general requiere expandir el producto de binomios y distribuir el factor $a$.'
  - 'El coeficiente independiente $c$ de la forma general equivale exactamente al producto del coeficiente cuadrático por las dos raíces $c = a x_1 x_2$.'
al_terminar_debes_poder: |
  QUÉ: Convertir una función cuadrática de forma factorizada a forma general $ax^2 + bx + c$.
  CÓMO: Multiplicar los binomios $(x - x_1)(x - x_2)$, agrupar términos en $x$, distribuir $a$ y verificar $c = a x_1 x_2$.
