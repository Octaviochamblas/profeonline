semantic_id: MAT.ALG.FUNC_CUADR_FORMAS.FACTORIZADA_A_GENERAL
resumen_inicial: 'Conversión de la forma factorizada a la forma general: parábola,
  vértice, concavidad y formas de Formas de la función cuadrática.'
explicacion_simple: Al igual que con la forma canónica, a veces es necesario volver
  a la forma general desde la forma factorizada, por ejemplo para comparar dos funciones
  o identificar sus coeficientes.
explicacion_formal: '### Definición formal


  Dada $f(x)=a(x-r_1)(x-r_2)$, desarrollando el producto: $(x-r_1)(x-r_2)=x^2-(r_1+r_2)x+r_1r_2$.
  Multiplicando por $a$: $f(x)=ax^2-a(r_1+r_2)x+a(r_1r_2)$, que es la forma general.


  ### Desarrollo didáctico


  El procedimiento consiste en multiplicar los dos binomios término a término (usando
  distribución), y luego multiplicar todo el resultado por el coeficiente $a$.


  Para $f(x)=3(x-2)(x+4)$: desarrollando, $(x-2)(x+4)=x^2+2x-8$; multiplicando por
  $3$: $f(x)=3x^2+6x-24$.'
definiciones_clave: '- **Conversión de la forma factorizada a la forma general**:
  Elemento o parámetro esencial en la representación de la función cuadrática.'
propiedades_relaciones: '- **Vértice y simetría**: Vértice $V(h, k)$ con $h = -b/(2a)$,
  eje de simetría $x = h$ y concavidad determinada por el signo de $a$ aplicados a
  conversión de la forma factorizada a la forma general.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la parábola aplicando conversión
    de la forma factorizada a la forma general.
  pasos:
  - Identificar la forma dada de la función cuadrática (general, canónica o factorizada).
  - Calcular el vértice, eje de simetría o intersecciones según corresponda a conversión
    de la forma factorizada a la forma general.
  - Determinar la concavidad (hacia arriba si $a > 0$, hacia abajo si $a < 0$).
  - Graficar la parábola o interpretar el máximo/mínimo en el contexto.
