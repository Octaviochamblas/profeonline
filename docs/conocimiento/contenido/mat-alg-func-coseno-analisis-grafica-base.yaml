semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.GRAFICA_BASE
resumen_inicial: 'Construcción y propiedades visuales de la gráfica base de la función coseno $y = \cos(x)$ (la onda cosenoidal).'
explicacion_simple: |
  La representación gráfica de $y = \cos(x)$ es una curva continua y suave en forma de "V" redondeada u onda acopada. Inicia en su punto más alto $(0,1)$ sobre el eje vertical, desciende cruzando el eje horizontal en $x = \frac{\pi}{2}$, cae hasta su valle más profundo de $-1$ en $x = \pi$, vuelve a subir cruzando el eje horizontal en $x = \frac{3\pi}{2}$ y regresa a la cima de $1$ en $x = 2\pi$. A partir de allí, este patrón idéntico se repite indefinidamente en ambas direcciones.
explicacion_formal: |
  ### Definición formal
  La **gráfica de la función coseno base** es el lugar geométrico del plano cartesiano compuesto por el conjunto continuo de puntos:
  $$\mathcal{G}_{\cos} = \{(x,y) \in \mathbb{R}^2 : y = \cos(x)\}$$
  Se caracteriza por ser una curva trascendente plana, acotada, periódica de período $T = 2\pi$ y simétrica respecto al eje de las ordenadas (eje Y).

  ### Desglose simbólico
  - Máximo inicial (cresta): $(0,1)$
  - Cero inicial: $\left(\frac{\pi}{2}, 0\right)$
  - Mínimo principal (valle): $(\pi, -1)$
  - Cero secundario: $\left(\frac{3\pi}{2}, 0\right)$
  - Máximo final del ciclo: $(2\pi, 1)$

  ### Síntesis didáctica
  La gráfica del coseno es congruente a la gráfica del seno; la única diferencia visual radica en que la onda del coseno está desplazada $\frac{\pi}{2}$ unidades hacia la izquierda respecto a la del seno. Presenta simetría especular (de espejo) con respecto al eje vertical Y.
definiciones_clave: |
  - **Onda cosenoidal**: Nombre de la gráfica continua y periódica producida por la función $y = \cos x$.
  - **Cresta inicial**: Punto más alto $(0,1)$ donde la gráfica corta al eje Y.
  - **Valle principal**: Punto más bajo $(\pi, -1)$ alcanzado en la mitad del ciclo base.
propiedades_relaciones: |
  - **Simetría con el eje Y**: Al reflejar la curva respecto al eje Y, la gráfica coincide exactamente consigo misma (propiedad de función par $\cos(-x) = \cos x$).
  - **Continuidad global**: Carece de discontinuidades, saltos o asíntotas.
ejemplo_guiado:
  enunciado: 'Identifica los intervalos de monotonía (donde la función crece o decrece) para la gráfica de $y = \cos(x)$ dentro de un ciclo básico $[0, 2\pi]$.'
  pasos:
    - 'Paso 1: Observar el comportamiento desde $x = 0$ hasta $x = \pi$: la gráfica parte en la cima $1$ y cae hasta el valle $-1$.'
    - 'Paso 2: Concluir que en el intervalo $[0, \pi]$ la función coseno es **estrictamente decreciente**.'
    - 'Paso 3: Observar el comportamiento desde $x = \pi$ hasta $x = 2\pi$: la gráfica parte del valle $-1$ y sube hasta la cima $1$.'
    - 'Paso 4: Concluir que en el intervalo $[\pi, 2\pi]$ la función coseno es **estrictamente creciente**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Por cuál de los siguientes puntos interseca la gráfica de la función coseno base $y = \cos(x)$ al eje vertical Y?'
    choices:
      - {text: 'Por el punto de coordenadas $(0, 1)$', is_correct: true}
      - {text: 'Por el origen de coordenadas $(0, 0)$', is_correct: false}
      - {text: 'Por el punto de coordenadas $(0, -1)$', is_correct: false}
      - {text: 'Por el punto de coordenadas $(1, 0)$', is_correct: false}
    explanation: 'La alternativa correcta es ''Por el punto de coordenadas $(0, 1)$''. Puesto que $\cos(0) = 1$, la curva corta al eje Y en su valor máximo.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: '¿En qué valor de $x$ alcanza la onda cosenoidal base $y = \cos(x)$ su punto mínimo (valle) más bajo?'
    choices:
      - {text: '$x = \pi$', is_correct: true}
      - {text: '$x = \frac{\pi}{2}$', is_correct: false}
      - {text: '$x = \frac{3\pi}{2}$', is_correct: false}
      - {text: '$x = 2\pi$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = \pi$''. En $x = \pi$ ($180^\circ$), el coseno alcanza su valor mínimo absoluto de $-1$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Trazar el eje horizontal graduado en múltiplos de $\frac{\pi}{2}$ y el eje vertical entre $-1$ y $1$.'
  - 'Paso 2: Marcar los cinco puntos clave del ciclo: $(0,1)$, $\left(\frac{\pi}{2}, 0\right)$, $(\pi, -1)$, $\left(\frac{3\pi}{2}, 0\right)$ y $(2\pi, 1)$.'
  - 'Paso 3: Unir los puntos mediante una curva suave redondeada en forma de cuenco.'
  - 'Paso 4: Repetir el patrón cosenoidal periódicamente a lo largo de todo el eje horizontal.'
errores_correccion: |
  - **Error 1:** Dibujar la gráfica del coseno pasando por el origen $(0,0)$ como la función seno. **Cómo corregirlo:** La curva del coseno comienza en la cresta $(0,1)$ sobre el eje Y; no pasa por $(0,0)$.
  - **Error 2:** Dibujar la curva con esquinas puntiagudas o rectilíneas. **Cómo corregirlo:** La onda cosenoidal es una curva continua infinitamente suave con derivadas nulas en sus cresta y valles.
ejemplos:
  - titulo: 'Intersección con el eje Y'
    enunciado: '¿En qué valor del eje Y corta la gráfica de $y = \cos(x)$ al eje vertical?'
    alternativas:
      - 'En $y = 1$'
      - 'En $y = 0$'
      - 'En $y = -1$'
    respuesta: 'En $y = 1$'
    solucion_pasos:
      - '1. Para el eje Y, $x = 0$.'
      - '2. $y = \cos(0) = 1$.'
      - '3. Corta en $(0,1)$.'
  - titulo: 'Comportamiento en pi medios'
    enunciado: '¿La gráfica del coseno cruza el eje X en el punto $\left(\frac{\pi}{2}, 0\right)$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, en $x = \frac{\pi}{2}$ la función se anula: $\cos\left(\frac{\pi}{2}\right) = 0$.'
  - titulo: 'Forma de onda repetitiva'
    enunciado: '¿La forma gráfica del coseno entre $0$ y $2\pi$ se repite idénticamente entre $2\pi$ y $4\pi$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, por la propiedad de periodicidad de período $T = 2\pi$.'
  - titulo: 'Simetría de espejo respecto al eje Y'
    enunciado: '¿La gráfica del coseno a la izquierda del eje Y es el reflejo exacto de la gráfica a la derecha?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, es la propiedad gráfica de las funciones par ($\cos(-x) = \cos x$).'
errores_frecuentes:
  - 'La afirmación de que la gráfica de la función coseno base interseca al eje Y en el origen $(0,0)$.'
  - 'La afirmación de que la onda cosenoidal posee picos rectos triangulares.'
  - 'La afirmación de que la gráfica del coseno se detiene al llegar a $x = 2\pi$.'
  - 'La afirmación de que el valle inferior del coseno se ubica en $x = \frac{\pi}{2}$.'
  - 'La afirmación de que la gráfica del coseno es simétrica con respecto al origen $(0,0)$.'
afirmaciones_verdaderas:
  - 'La gráfica de la función coseno base $y = \cos(x)$ es una curva suave y continua que interseca al eje Y en el punto $(0,1)$.'
  - 'Un ciclo completo del coseno se extiende en el intervalo $[0, 2\pi]$, alcanzando su valle en $(\pi, -1)$ y retornando a la cima en $(2\pi, 1)$.'
al_terminar_debes_poder: |
  QUÉ: Reconocer y graficar la onda cosenoidal base de la función coseno $y = \cos(x)$.
  CÓMO: Identificar y ubicar los puntos clave $(0,1)$, $\left(\frac{\pi}{2}, 0\right)$, $(\pi, -1)$, $\left(\frac{3\pi}{2}, 0\right)$ y $(2\pi, 1)$ sobre el plano cartesiano.
