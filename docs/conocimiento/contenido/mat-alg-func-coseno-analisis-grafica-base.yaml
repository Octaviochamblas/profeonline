semantic_id: MAT.ALG.FUNC_COSENO_ANALISIS.GRAFICA_BASE
resumen_inicial: 'Construcción de la gráfica base f(x) = cos(x): círculo unitario,
  amplitud, período y transformaciones de Análisis de la función coseno.'
explicacion_simple: La gráfica del coseno tiene la misma forma general que la del
  seno, pero desplazada, comenzando en su punto más alto en vez de en cero.
explicacion_formal: '### Definición formal


  La gráfica de $f(x)=\cos(x)$ es el conjunto de puntos $(x,\cos(x))$ para todo $x\in\mathbb{R}$.
  Es una curva continua y suave, idéntica en forma a la del seno pero desplazada horizontalmente
  $\pi/2$ unidades hacia la izquierda.


  ### Desarrollo didáctico


  Partiendo de $(0,1)$, la curva desciende cruzando el eje $x$ en $(\pi/2,0)$, sigue
  bajando hasta el mínimo $(\pi,-1)$, sube cruzando el eje $x$ en $(3\pi/2,0)$, y
  vuelve a subir hasta $(2\pi,1)$, completando un ciclo.'
definiciones_clave: '- **Construcción de la gráfica base f(x) = cos(x)**: Función
  periódica fundamentada en las coordenadas del círculo unitario o relaciones trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a construcción de la gráfica base f(x) = cos(x).'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    construcción de la gráfica base f(x) = cos(x).
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de construcción de la gráfica base f(x) = cos(x).
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
