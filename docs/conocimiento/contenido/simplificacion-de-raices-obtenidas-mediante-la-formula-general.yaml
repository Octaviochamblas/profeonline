semantic_id: MAT.ALG.EC_CUADR_METODOS.SIMPLIFICACION_RADICAL
resumen_inicial: 'Simplificación de raíces obtenidas mediante la fórmula general:
  concepto, discriminante, soluciones y modelamiento en Métodos algebraicos de resolución.'
explicacion_simple: Después de sustituir en la fórmula general, casi siempre queda
  una expresión con raíz cuadrada y una fracción que todavía se puede reducir a una
  forma más simple.
explicacion_formal: '### Definición formal


  Tras calcular $\Delta$ y obtener $\sqrt{\Delta}$, esta raíz debe simplificarse extrayendo
  el mayor factor cuadrado perfecto posible: si $\Delta=k^2 \cdot m$ con $m$ libre
  de cuadrados, entonces $\sqrt{\Delta}=k\sqrt{m}$. Finalmente, la fracción $\dfrac{-b\pm\sqrt{\Delta}}{2a}$
  debe reducirse dividiendo todos sus términos por su máximo común divisor, si existe.


  ### Desarrollo didáctico


  Simplificar una raíz consiste en descomponer el número en factores, identificar
  el mayor cuadrado perfecto que lo divide, y extraer su raíz fuera del radical.


  Para $\Delta=72$: $72=36 \cdot 2$, y $36$ es cuadrado perfecto, por lo que $\sqrt{72}=6\sqrt{2}$.'
definiciones_clave: '- **Simplificación de raíces obtenidas mediante la fórmula general**:
  Elemento o técnica fundamental en la resolución de ecuaciones cuadráticas.'
propiedades_relaciones: '- **Fórmula general y relaciones de Vieta**: Discriminante
  $\Delta = b^2 - 4ac$, raíces $x_{1,2}$ y propiedades de suma/producto en simplificación
  de raíces obtenidas mediante la fórmula general.'
ejemplo_guiado:
  enunciado: Resuelve o analiza la ecuación cuadrática aplicando simplificación de
    raíces obtenidas mediante la fórmula general.
  pasos:
  - Escribir la ecuación en su forma general $ax^2 + bx + c = 0$ e identificar los
    coeficientes $a, b, c$.
  - Aplicar la regla o método de resolución correspondiente a simplificación de raíces
    obtenidas mediante la fórmula general.
  - Calcular el discriminante o factorizar el trinomio para obtener las raíces $x_1,
    x_2$.
  - Verificar las soluciones obtenidas en el contexto o en la ecuación original.
