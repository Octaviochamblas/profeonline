semantic_id: MAT.ALG.EC_CUADR_METODOS.SIMPLIFICACION_RADICAL
resumen_inicial: La simplificación de raíces obtenidas mediante la fórmula general requiere descomponer el radical $\sqrt{\Delta} = k\sqrt{m}$, factorizar el máximo común divisor en el numerador y simplificar la fracción resultante.
explicacion_simple: "![La simplificación de raíces obtenidas mediante la fórmula general requiere descomponer el radical $\\sqrt{\\Delta} = k\\sqrt{m}$, factorizar el máximo común divisor en el numerador y simplificar la fracción resultante](/static/img/nodos/simplificacion-de-raices-obtenidas-mediante-la-formula-general-intro.svg)\n\n\nMuchas veces, al aplicar la fórmula cuadrática, el resultado queda como una fracción con una raíz:\n$$x = \\frac{4 \\pm \\sqrt{20}}{2}$$\n\n**Para simplificar correctamente sin cometer errores:**\n1. **Descompón la raíz:** $\\sqrt{20} = \\sqrt{4 \\cdot 5} = 2\\sqrt{5}$.\n2. **Reemplaza en la fracción:** $x = \\frac{4 \\pm 2\\sqrt{5}}{2}$.\n3. **¡REGLA DE ORO: Factoriza arriba antes de tachar!**\n   - Saca el $2$ como factor común en el numerador: $x = \\frac{2(2 \\pm \\sqrt{5})}{2}$.\n   - Ahora sí cancelas el $2$ de arriba con el $2$ de abajo: **$x = 2 \\pm \\sqrt{5}$**.\n4. **¡NUNCA taches solo un número del numerador!**"
explicacion_formal: "Dada una solución exacta expresada en forma radical $x = \\frac{p \\pm \\sqrt{\\Delta}}{q}$ con $\\Delta \\in \\mathbb{N}$ no cuadrado perfecto:\n\n**Protocolo riguroso de simplificación en tres etapas**:\n1. **Extracción de factores cuadrados del radical**:\n   $$\\Delta = k^2 \\cdot m \\implies \\sqrt{\\Delta} = k\\sqrt{m}, \\quad m \\text{ libre de cuadrados}$$\n2. **Cálculo del Máximo Común Divisor (MCD) del numerador**:\n   $$g = \\gcd(|p|, k)$$\n3. **Factorización y simplificación con el denominador $q$**:\n   $$x = \\frac{g \\cdot (p' \\pm k'\\sqrt{m})}{q} = \\frac{p' \\pm k'\\sqrt{m}}{q'} \\quad \\text{donde } q' = \\frac{q}{\\gcd(g, q)}$$"
definiciones_clave: '- **Radical simplificado**: Expresión $k\sqrt{m}$ donde el radicando $m$ no contiene divisores cuadrados perfectos mayores que 1.

  - **Cancelación distributiva válida**: Simplificación de una fracción que cancela un factor común a TODOS los sumandos del numerador.'
propiedades_relaciones: '- **Prohibición de cancelación parcial**: $\frac{a + b}{c} \neq \frac{a}{c} + b$; no se puede simplificar solo un término de la suma.

  - **Conjugados cuadráticos**: Las dos raíces $p'' + k''\sqrt{m}$ y $p'' - k''\sqrt{m}$ son números irracionales conjugados.'
ejemplo_guiado:
  enunciado: '![Ejemplo La simplificación de raíces obtenidas mediante la fórmula general requiere descomponer el radical $\sqrt{\Delta} = k\sqrt{m}$, factorizar el máximo común divisor en el numerador y simplificar la fracción resultante](/static/img/nodos/simplificacion-de-raices-obtenidas-mediante-la-formula-general-ejemplos.svg)



    Simplifica completamente las raíces de la ecuación cuadrática $x = \frac{-6 \pm \sqrt{48}}{4}$.'
  pasos:
  - 'Paso 1: Descomponer el radical $\sqrt{48}$: $48 = 16 \times 3 \implies \sqrt{48} = 4\sqrt{3}$.'
  - 'Paso 2: Escribir la expresión: $x = \frac{-6 \pm 4\sqrt{3}}{4}$.'
  - 'Paso 3: Identificar el factor común en el numerador: $\gcd(6, 4) = 2$.'
  - 'Paso 4: Factorizar el 2 en el numerador: $x = \frac{2(-3 \pm 2\sqrt{3})}{4}$.'
  - 'Paso 5: Simplificar el factor 2 con el denominador 4: $x = \frac{-3 \pm 2\sqrt{3}}{2}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la simplificación correcta de $x = \frac{8 \pm \sqrt{32}}{4}$?
  choices:
  - text: 2 ± √2
    is_correct: true
  - text: 2 ± √32
    is_correct: false
  - text: 2 ± 4√2
    is_correct: false
  - text: 8 ± √2
    is_correct: false
  explanation: La alternativa correcta es '2 ± √2'. $\sqrt{32} = 4\sqrt{2} \implies \frac{8 \pm 4\sqrt{2}}{4} = \frac{4(2 \pm \sqrt{2})}{4} = 2 \pm \sqrt{2}$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En la fracción $\frac{6 + \sqrt{5}}{2}$, ¿se puede simplificar el 6 con el 2 para obtener $3 + \sqrt{5}$?
  choices:
  - text: No, porque el 2 divide a todo el numerador y √5 no es divisible por 2.
    is_correct: true
  - text: Si, siempre se simplifican los numeros enteros.
    is_correct: false
  - text: Si, queda 3 + √5/2.
    is_correct: false
  - text: Solo si se eleva al cuadrado.
    is_correct: false
  explanation: La alternativa correcta es 'No, porque el 2 divide a todo el numerador y √5 no es divisible por 2.'. No se puede cancelar parcialmente.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Extraer todos los factores cuadrados del radicando $\sqrt{\Delta} = k\sqrt{m}$.'
- 'Paso 2: Sustituir el radical simplificado en la fracción de la solución.'
- 'Paso 3: Extraer el factor común numérico del numerador $g = \gcd(p, k)$.'
- 'Paso 4: Dividir numerador y denominador por el factor común para simplificar la fracción.'
- 'Paso 5: Escribir las dos soluciones conjugadas simplificadas.'
errores_correccion: '- **Error común:** Simplificar solo el primer término (ej: $\frac{4 + \sqrt{6}}{2} = 2 + \sqrt{6}$).

  - **Cómo corregirlo:** La división es **distributiva**: el denominador divide a **ambos términos**: $\frac{4}{2} + \frac{\sqrt{6}}{2} = 2 + \frac{\sqrt{6}}{2}$.'
ejemplos:
- titulo: 'Ejemplo 1: Extracción de factor 2'
  enunciado: Simplifica $x = \frac{2 \pm \sqrt{12}}{2}$.
  alternativas:
  - 1 ± sqrt(3)
  - 1 ± sqrt(12)
  - 2 ± sqrt(3)
  - 1 ± 2sqrt(3)
  respuesta: 1 ± sqrt(3)
  solucion_pasos:
  - 'Paso 1: $\sqrt{12} = 2\sqrt{3} \implies \frac{2(1 \pm \sqrt{3})}{2} = 1 \pm \sqrt{3}$.'
- titulo: 'Ejemplo 2: Simplificación con denominador compuesto'
  enunciado: Simplifica $x = \frac{-10 \pm \sqrt{20}}{6}$.
  alternativas:
  - (-5 ± sqrt(5))/3
  - -5 ± sqrt(5)
  - (-5 ± 2sqrt(5))/3
  - -5/3 ± sqrt(20)
  respuesta: (-5 ± sqrt(5))/3
  solucion_pasos:
  - 'Paso 1: $\sqrt{20} = 2\sqrt{5} \implies \frac{2(-5 \pm \sqrt{5})}{6} = \frac{-5 \pm \sqrt{5}}{3}$.'
- titulo: 'Ejemplo 3: Radical no simplificable'
  enunciado: En $x = \frac{3 \pm \sqrt{7}}{2}$, ¿se puede simplificar más?
  alternativas:
  - No, ya está en su forma irreductible exacta
  - Sí, queda 1.5 ± sqrt(7)
  - Sí, queda 3 ± sqrt(3.5)
  - Sí, da 5
  respuesta: No, ya está en su forma irreductible exacta
  solucion_pasos:
  - 'Paso 1: $\gcd(3, 1) = 1$, no comparte factores con $2$.'
- titulo: 'Ejemplo 4: Denominador simplificado a 1'
  enunciado: Simplifica $x = \frac{6 \pm \sqrt{72}}{6}$.
  alternativas:
  - 1 ± sqrt(2)
  - 1 ± 6sqrt(2)
  - 6 ± sqrt(2)
  - 1 ± sqrt(72)
  respuesta: 1 ± sqrt(2)
  solucion_pasos:
  - 'Paso 1: $\sqrt{72} = 6\sqrt{2} \implies \frac{6(1 \pm \sqrt{2})}{6} = 1 \pm \sqrt{2}$.'
errores_frecuentes:
- Cancelar parcialmente un término del numerador con el denominador.
- Olvidar extraer factores cuadrados del radicando.
- Dividir el número dentro de la raíz por el denominador exterior.
afirmaciones_verdaderas:
- Para simplificar una solución radical se debe factorizar todo el numerador antes de cancelar con el denominador.
- Las raíces irracionales de ecuaciones cuadráticas con coeficientes racionales siempre se presentan en pares conjugados.
al_terminar_debes_poder: '**QUÉ:** Simplificar rigurosamente expresiones radicales provenientes de la resolvente cuadrática.


  **CÓMO:** Extrayendo factores cuadrados de la raíz, factorizando el MCD del numerador y simplificando con el denominador.


