procedimiento:
- 'Paso 1: Descompón el valor del discriminante en factores, buscando el mayor cuadrado
  perfecto posible.'
- 'Paso 2: Extrae la raíz del factor cuadrado perfecto fuera del radical.'
- 'Paso 3: Reescribe la fracción completa con la raíz simplificada.'
- 'Paso 4: Reduce la fracción dividiendo numerador y denominador por su máximo común
  divisor, si corresponde.'
errores_correccion: Evita confundir $-b$ en la fórmula general cuando $b$ ya es negativo
  en simplificación de raíces obtenidas mediante la fórmula general.
ejemplos:
- titulo: Simplificación de una raíz no perfecta
  enunciado: Simplifica $\sqrt{50}$.
  solucion_pasos:
  - $50=25 \cdot 2$, y $25$ es cuadrado perfecto.
  - $\sqrt{50}=5\sqrt{2}$.
- titulo: Simplificación de la fracción final
  enunciado: Simplifica $x=\dfrac{4\pm\sqrt{8}}{2}$.
  solucion_pasos:
  - $\sqrt{8}=2\sqrt{2}$.
  - $x=\dfrac{4\pm2\sqrt{2}}{2}=2\pm\sqrt{2}$, dividiendo todos los términos por 2.
- titulo: ¿Toda raíz cuadrada de un entero se puede simplificar?
  enunciado: ¿Toda raíz cuadrada de un entero se puede simplificar?
  respuesta: 'No'
  solucion_pasos:
  - Solo se puede simplificar si el número bajo la raíz tiene un factor cuadrado perfecto
    mayor que 1; de lo contrario ya está en su forma más simple.
- titulo: ¿Se puede simplificar una fracción dividiendo solo el numerador y dejando
    el denominador igual?
  enunciado: ¿Se puede simplificar una fracción dividiendo solo el numerador y dejando
    el denominador igual?
  respuesta: 'No'
  solucion_pasos:
  - Para que la fracción siga representando el mismo valor, se debe dividir tanto
    el numerador como el denominador por el mismo factor.
errores_frecuentes:
- Simplificar la raíz solo parcialmente, sin extraer el mayor cuadrado perfecto posible.
- Reducir la fracción dividiendo únicamente el término con la raíz y no también el
  término $-b$ y el denominador.
- Confundir $\sqrt{a}+\sqrt{b}$ con $\sqrt{a+b}$ al intentar simplificar una suma
  bajo la raíz.
- Olvidar simplificar la fracción final cuando todos sus términos comparten un divisor
  común.
afirmaciones_verdaderas:
- Si el discriminante es positivo, la ecuación cuadrática tiene dos soluciones reales
  distintas.
al_terminar_debes_ponder: Resolver y analizar ecuaciones cuadráticas utilizando simplificación
  de raíces obtenidas mediante la fórmula general.
