semantic_id: MAT.ALG.EC_CUADR_METODOS.SIMPLIFICACION_RADICAL
resumen_inicial: La simplificación de raíces simplifica radicales y simplifica factores comunes en la fórmula general $x = \frac{-b \pm \sqrt{\Delta}}{2a}$.
explicacion_simple: |
  Al aplicar la fórmula general, muchas veces obtienes soluciones con raíces radicales que se pueden simplificar:

  - **Ejemplo**: Obtienes $x = \frac{4 \pm \sqrt{12}}{2}$.
  - **Paso 1 (Descomponer la raíz)**: $\sqrt{12} = \sqrt{4 \cdot 3} = 2\sqrt{3}$.
  - **Paso 2 (Reemplazar la raíz simplificada)**:
    $$x = \frac{4 \pm 2\sqrt{3}}{2}$$
  - **Paso 3 (Factorizar y simplificar el denominador)**: Sacas factor común $2$ en el numerador:
    $$x = \frac{2(2 \pm \sqrt{3})}{2} = 2 \pm \sqrt{3}$$
  - **Las dos soluciones finales simplificadas**: $x_1 = 2 + \sqrt{3}$ y $x_2 = 2 - \sqrt{3}$.
explicacion_formal: |
  Dada la solución de una ecuación cuadrática en la forma de fracción radical $x = \frac{-b \pm \sqrt{\Delta}}{2a}$, la **simplificación del resultado radical** exige dos transformaciones algebraicas exactas:

  1. **Simplificación del radical:**
     $$\sqrt{\Delta} = \sqrt{k^2 \cdot m} = k\sqrt{m} \quad \text{donde } k^2 \text{ es el mayor cuadrado perfecto divisor de } \Delta$$

  2. **Cancelación de factores comunes numéricos:**
     $$x = \frac{-b \pm k\sqrt{m}}{2a} = \frac{g \cdot (-b' \pm k'\sqrt{m})}{g \cdot (2a')} = \frac{-b' \pm k'\sqrt{m}}{2a'}$$
     donde $g = \text{M.C.D.}(-b, k, 2a)$.
definiciones_clave: |
  - **Simplificación radical de soluciones**: Proceso de descomposición de cuadrados perfectos en el radicando y simplificación del factor común numérico entre el numerador y el denominador.
propiedades_relaciones: |
  - **Forma irracional exacta**: Expresar el resultado como $2 \pm \sqrt{3}$ conserva el 100% del valor matemático exacto de la raíz, a diferencia de los valores aproximados con decimales.
ejemplo_guiado:
  enunciado: 'Simplifica la expresión radical $x = \frac{6 \pm \sqrt{20}}{2}$ obtenida al aplicar la fórmula general.'
  pasos:
    - 'Paso 1: Descomponer el radicando $\sqrt{20}$: como $20 = 4 \cdot 5 \implies \sqrt{20} = \sqrt{4} \cdot \sqrt{5} = 2\sqrt{5}$.'
    - 'Paso 2: Sustituir la raíz en la expresión: $x = \frac{6 \pm 2\sqrt{5}}{2}$.'
    - 'Paso 3: Extraer factor común 2 en el numerador: $x = \frac{2(3 \pm \sqrt{5})}{2}$.'
    - 'Paso 4: Cancelar el factor 2 en numerador y denominador: $x = 3 \pm \sqrt{5}$. Soluciones: $x_1 = 3 + \sqrt{5}$ y $x_2 = 3 - \sqrt{5}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cómo se simplifica correctamente la raíz cuadrada $\sqrt{75}$ extraída del discriminante?'
    choices:
      - {text: '$\sqrt{75} = \sqrt{25 \cdot 3} = 5\sqrt{3}$', is_correct: true}
      - {text: '$\sqrt{75} = 25\sqrt{3}$', is_correct: false}
      - {text: '$\sqrt{75} = 15\sqrt{5}$', is_correct: false}
      - {text: '$\sqrt{75} = 3\sqrt{5}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$\sqrt{75} = \sqrt{25 \cdot 3} = 5\sqrt{3}$''.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: '¿Cuál es la forma totalmente simplificada de la solución $x = \frac{8 \pm \sqrt{32}}{4}$?'
    choices:
      - {text: '$x = 2 \pm \sqrt{2}$', is_correct: true}
      - {text: '$x = 2 \pm \sqrt{32}$', is_correct: false}
      - {text: '$x = 4 \pm 2\sqrt{2}$', is_correct: false}
      - {text: '$x = 8 \pm \sqrt{2}$', is_correct: false}
    explanation: 'La alternativa correcta es ''$x = 2 \pm \sqrt{2}$''. Como $\sqrt{32} = 4\sqrt{2}$, se simplifica $\frac{8 \pm 4\sqrt{2}}{4} = 2 \pm \sqrt{2}$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Descomponer el número bajo la raíz ($\Delta$) en el producto de un cuadrado perfecto por un residuo ($\Delta = k^2 \cdot m$).'
  - 'Paso 2: Extraer la raíz cuadrada del cuadrado perfecto fuera del radical ($\sqrt{\Delta} = k\sqrt{m}$).'
  - 'Paso 3: Identificar el Máximo Común Divisor ($\text{M.C.D.}$) entre el término $-b$, el coeficiente del radical $k$ y el denominador $2a$.'
  - 'Paso 4: Factorizar el $\text{M.C.D.}$ en el numerador y simplificarlo con el denominador.'
errores_correccion: |
  - **Error común:** Cancelar el denominador dividiendo solo por un término del numerador (ej. de $\frac{6 \pm 2\sqrt{3}}{2}$ decir $3 \pm 2\sqrt{3}$ dividiendo solo el 6).
  - **Cómo corregirlo:** La simplificación exige **FACTORIZAR PRIMERO EL FACTOR COMÚN** del numerador completo antes de cancelar con el denominador.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Simplificación con raíz de 12.
    alternativas:
      - '$x = 1 \pm \sqrt{3}$'
      - '$x = 2 \pm \sqrt{3}$'
      - '$x = 1 \pm 2\sqrt{3}$'
    respuesta: '$x = 1 \pm \sqrt{3}$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Simplificación con raíz de 8.
    alternativas:
      - '$x = -1 \pm \sqrt{2}$'
      - '$x = -2 \pm \sqrt{2}$'
      - '$x = -1 \pm 2\sqrt{2}$'
    respuesta: '$x = -1 \pm \sqrt{2}$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dividir el denominador únicamente por el término $-b$ del numerador conservando inalterado el término radical.'
  - 'Simplificar la expresión $\frac{4 + \sqrt{5}}{2}$ como $2 + \sqrt{5}$ cancelando individualmente el número 4.'
  - 'Extraer la raíz cuadrada de una suma bajo el radical $\sqrt{a^2 + b^2}$ como la suma individual $a + b$.'
  - 'Reemplazar las raíces irracionales exactas por aproximaciones decimales redondeadas destruye la exactitud de la solución.'
  - 'Descomponer el radical $\sqrt{50}$ como $10\sqrt{5}$ por una mala extracción de factores primos.'
afirmaciones_verdaderas:
  - 'Para simplificar $\frac{-b \pm \sqrt{\Delta}}{2a}$, se extrae el cuadrado perfecto de $\Delta$ y se simplifica el M.C.D. de todos los términos del numerador con el denominador.'
  - 'La simplificación del denominador exige que el factor simplificador sea compartido simultáneamente por $-b$ y por el coeficiente del radical.'
al_terminar_debes_poder: |
  QUÉ: Simplificar los resultados radicales obtenidos mediante la fórmula general de ecuaciones de segundo grado.
  CÓMO: Extraer cuadrados perfectos de $\sqrt{\Delta}$, factorizar el M.C.D. en el numerador y simplificar el denominador.
