semantic_id: MAT.GEO.TEOREMA_TALES.SEGMENTOS_PROPORCIONALES
resumen_inicial: 'Identificación de segmentos proporcionales determinados por paralelas
  y transversales: conceptos, teoremas, propiedades geométricas y cálculo en Congruencia,
  Semejanza y Homotecia.'
explicacion_simple: Antes de poder calcular longitudes desconocidas usando el teorema
  de Tales, es fundamental saber identificar con precisión qué segmentos corresponden
  entre sí y forman la proporción correcta.
explicacion_formal: '![Segmentos proporcionales por Tales](/static/img/geometria/congruencia-semejanza/tales-segmentos-proporcionales.svg)


  ### Definición formal


  Si las paralelas $L_1$, $L_2$, $L_3$ cortan a las transversales en A, B, C y A'',
  B'', C'' respectivamente, el segmento AB (entre $L_1$ y $L_2$) es proporcional a
  A''B'' (entre las mismas dos paralelas), y BC es proporcional a B''C''.


  ### Desarrollo didáctico


  El error más común en este tema es identificar mal la correspondencia: por ejemplo,
  comparar AB con B''C'' en vez de con A''B''. Siempre se debe verificar que ambos
  segmentos estén delimitados por el mismo par de rectas paralelas.'
definiciones_clave: '- **Identificación de segmentos proporcionales determinados por
  paralelas y transversales**: Elemento o propiedad fundamental en el estudio de congruencia,
  semejanza y homotecia.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
