    por paralelas y transversales.
  - 'Multiplicar la longitud original por la razón $k$: $L'' = 3.6 \cdot 35$.'
  - Concluir que la medida obtenida en identificación de segmentos proporcionales
    determinados por paralelas y transversales es $L' = 126.0\text{ cm}$.
