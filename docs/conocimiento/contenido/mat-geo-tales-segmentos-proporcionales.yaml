procedimiento:
- 'Paso 1: Identifica las dos rectas paralelas que delimitan el segmento en la primera
  transversal.'
- 'Paso 2: Busca el segmento delimitado por esas mismas dos paralelas en la segunda
  transversal.'
- 'Paso 3: Esos dos segmentos son los proporcionales entre sí.'
