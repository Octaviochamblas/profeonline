semantic_id: MAT.ALG.LENGUAJE_RELACIONES.ENTEROS_CONSECUTIVOS
resumen_inicial: La representación de números enteros consecutivos consiste en expresar algebraicamente una secuencia de números enteros contiguos mediante el incremento de una unidad consecutiva $n, n+1, n+2, \dots$
explicacion_simple: "Los **números enteros consecutivos** son aquellos números que se siguen uno inmediatamente después del otro en orden creciente (de 1 en 1):\n- Ejemplos numéricos: $(7, 8, 9)$, $(14, 15)$, $(-2, -1, 0)$.\n- En álgebra, para expresar varios enteros consecutivos dependientes de una variable $n$:\n  - **Dos enteros consecutivos**: **$n$** y **$n + 1$**.\n  - **Tres enteros consecutivos**: **$n$**, **$n + 1$** y **$n + 2$**.\n  - **Cuatro enteros consecutivos**: **$n$**, **$n + 1$**, **$n + 2$** y **$n + 3$**.\n- **Suma de enteros consecutivos**:\n  - La suma de 3 enteros consecutivos: $n + (n + 1) + (n + 2) = \\mathbf{3n + 3}$.\n\n![Enteros Consecutivos](/static/img/nodos/representacion-de-numeros-enteros-consecutivos-intro.svg)\n"
explicacion_formal: '### Definición formal

  Una secuencia de $k$ números **enteros consecutivos** generada a partir de un entero inicial $n \in \mathbb{Z}$ es una tupla finita de elementos en $\mathbb{Z}^k$ definida recursivamente por la aplicación iterada de la función sucesor $S(x) = x + 1$:


  $$\mathcal{C}_k(n) = (n, \quad n+1, \quad n+2, \quad \dots, \quad n + (k-1))$$


  ### Suma de $k$ Enteros Consecutivos (Progresión Aritmética)

  La suma de la secuencia de $k$ enteros consecutivos constituye la suma de una progresión aritmética de razón $r = 1$:


  $$\sum_{i=0}^{k-1} (n + i) = k \cdot n + \frac{k(k-1)}{2}$$


  Para $k = 3$: $\sum = 3n + 3 = 3(n + 1)$. ¡Atención! La suma de 3 enteros consecutivos es siempre divisible por $3$.


  ### Síntesis didáctica

  La propiedad de consecutividad entera es el modelo básico para resolver acertijos numéricos, ecuaciones de conteo lineal y propiedades divisibles en teoría de números.

  '
definiciones_clave: '- **Enteros consecutivos**: Secuencia de números enteros cuya diferencia entre dos términos adyacentes es exactamente igual a $1$.

  - **Variable generadora ($n$)**: Primer número entero que sirve como punto de partida de la secuencia consecutiva.

  - **Razón de consecutividad ($r=1$)**: Incremento unitario entre términos contiguos.

  '
propiedades_relaciones: '- **Divisibilidad de la suma**: La suma de 3 enteros consecutivos es siempre un múltiplo exacto de $3$ ($3n+3 = 3(n+1)$).

  - **Alternancia de paridad**: En cualquier secuencia de enteros consecutivos, los números alternan estrictamente entre par e impar ($P, I, P, I...$).

  '
ejemplo_guiado:
  enunciado: 'Traduce y resuelve el siguiente problema: "La suma de tres números enteros consecutivos es igual a sesenta y nueve. Halla los tres números".'
  pasos:
  - 'Paso 1: Definimos los tres enteros consecutivos: $n$, $n + 1$ y $n + 2$.'
  - 'Paso 2: Planteamos la ecuación sumándolos: $n + (n + 1) + (n + 2) = 69$.'
  - 'Paso 3: Reducimos términos semejantes: $3n + 3 = 69$.'
  - 'Paso 4: Despejamos $n$: $3n = 69 - 3 \implies 3n = 66 \implies n = 22$.'
  - 'Paso 5: Calculamos los números consecutivos: $n = 22$, $n + 1 = 23$, $n + 2 = 24$.'
  - 'Conclusión: Los tres números enteros consecutivos son **$22, 23$ y $24$**.'
  imagen: /static/img/nodos/representacion-de-numeros-enteros-consecutivos-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la representación algebraica reducida de la suma de tres números enteros consecutivos expresados en función del menor de ellos ($n$)?
  choices:
  - text: La expresión reducida es $3n + 3$, correspondiente a $n + (n + 1) + (n + 2)$
    is_correct: true
  - text: La expresión reducida es $n^3 + 3$
    is_correct: false
  - text: La expresión reducida es $3n + 6$
    is_correct: false
  - text: La expresión reducida es $n + 3$
    is_correct: false
  explanation: La alternativa correcta es 'La expresión reducida es $3n + 3$, correspondiente a $n + (n + 1) + (n + 2)$'. Suma de términos contiguos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Por qué la suma de tres enteros consecutivos $n + (n+1) + (n+2) = 3(n+1)$ es siempre divisible por $3$?
  choices:
  - text: Porque al factorizar $3n + 3$ se obtiene $3(n + 1)$, demostrando que el resultado es un múltiplo exacto de 3
    is_correct: true
  - text: Porque todos los números enteros son impares
    is_correct: false
  - text: Porque el número 3 es un número primo
    is_correct: false
  - text: Porque se multiplican las tres variables
    is_correct: false
  explanation: La alternativa correcta es 'Porque al factorizar $3n + 3$ se obtiene $3(n + 1)$, demostrando que el resultado es un múltiplo exacto de 3'. Factorización $3(n+1)$.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Asignar una variable (ej: $n$) al primer número entero de la secuencia.'
- 'Paso 2: Sumar $+ 1$ para obtener el segundo entero $(n + 1)$, $+ 2$ para el tercero $(n + 2)$, $+ 3$ para el cuarto $(n + 3)$, etc.'
- 'Paso 3: Si el enunciado solicita la suma, sumar todas las expresiones planteando la ecuación.'
- 'Paso 4: Reducir los términos semejantes agrupando las variables y sumando las constantes.'
errores_correccion: '- **Error 1:** Incrementar de 2 en 2 al representar enteros consecutivos (escribir $n, n+2, n+4$). **Cómo corregirlo:** Los enteros consecutivos se incrementan de **1 en 1 ($n, n+1, n+2$)**; incrementar de 2 en 2 es para números pares o impares consecutivos.

  - **Error 2:** Usar variables distintas como $x, y, z$ al traducir "tres enteros consecutivos". **Cómo corregirlo:** Los enteros consecutivos **deben depender de una sola variable ($n, n+1, n+2$)** para poder resolver la ecuación.

  '
ejemplos:
- titulo: Dos enteros consecutivos
  enunciado: ¿Cuáles son las expresiones que representan dos enteros consecutivos?
  alternativas:
  - $n$ y $n + 1$
  - $n$ y $n + 2$
  - $n$ y $2n$
  respuesta: $n$ y $n + 1$
  solucion_pasos:
  - '1. Primer entero: $n$.'
  - '2. Segundo entero: $n + 1$.'
- titulo: Suma de cuatro consecutivos
  enunciado: ¿Cuál es la expresión reducida de la suma de cuatro enteros consecutivos?
  alternativas:
  - $4n + 6$
  - $4n + 4$
  - $n^4 + 6$
  respuesta: $4n + 6$
  solucion_pasos:
  - '1. Suma: $n + (n+1) + (n+2) + (n+3)$.'
  - '2. Reduciendo: $4n + 6$.'
- titulo: Paridad alternada
  enunciado: Si $n$ es par, ¿es el consecutivo $n+1$ un número impar?
  respuesta: Sí
  solucion_pasos:
  - Sí, los enteros consecutivos alternan estrictamente par e impar.
- titulo: Verificación numérica
  enunciado: Para $n = 10$, ¿corresponden los consecutivos $n, n+1, n+2$ a los números $10, 11, 12$?
  respuesta: Sí
  solucion_pasos:
  - Sí, $10, 10+1=11, 10+2=12$.
errores_frecuentes:
- Incrementar de dos en dos los términos n, n+2, n+4 al representar enteros consecutivos.
- Utilizar tres variables distintas x, y, z en lugar de expresarlas en función de una sola variable n.
- La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.
- Escribir la multiplicación de los términos al traducir una frase de suma de consecutivos.
- Declarar que la suma de dos enteros consecutivos produce siempre un número par.
afirmaciones_verdaderas:
- Una secuencia de enteros consecutivos se representa algebraicamente incrementando en una unidad cada término (n, n+1, n+2...).
- La suma de tres números enteros consecutivos es siempre divisible por 3.
al_terminar_debes_poder: '![Resumen de enteros consecutivos](/static/img/nodos/representacion-de-numeros-enteros-consecutivos-resumen.svg)


  QUÉ: Expresar algebraicamente listas de números enteros consecutivos con una sola variable.


  CÓMO: Generar la secuencia $\{n, \; n+1, \; n+2, \; \dots\}$ con paso $\Delta = 1$, o la forma simétrica $\{n-1, \; n, \; n+1\}$ para simplificar sumas.'
