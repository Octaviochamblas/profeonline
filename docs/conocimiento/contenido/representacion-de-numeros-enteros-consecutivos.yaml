  choices:
  - text: n, n+1, n+2
    is_correct: true
  - text: n, 2n, 3n
    is_correct: false
  - text: n, n+2, n+4
    is_correct: false
  - text: n-1, n, n-2
    is_correct: false
  explanation: La alternativa correcta es 'n, n+1, n+2'.
