semantic_id: MAT.ALG.LENGUAJE_RELACIONES.ENTEROS_CONSECUTIVOS
resumen_inicial: 'Representación de números enteros consecutivos: traducción, reglas
  y aplicación práctica en Lenguaje algebraico: relaciones, sucesiones y desigualdades.'
explicacion_simple: Ya sabemos encontrar al que sigue en la fila, pero ¿qué pasa si
  necesitamos a los tres siguientes, o a una familia entera de consecutivos? Necesitamos
  encadenar la lógica del sucesor.
explicacion_formal: '### Definición formal


  La clave de la palabra ''consecutivos'' es que reduce todas las incógnitas a una
  sola variable base, aprovechando el espaciado conocido (+1).


  ### Desarrollo didáctico


  Al modelar problemas verbales con tres o más números consecutivos, tienes libertad
  para elegir el punto de partida, pero la progresión debe mantenerse intacta.

  - Modelo clásico: El menor es $x$. Los tres consecutivos son $x$, $x+1$, $x+2$.

  - Modelo centrado (muy útil para simplificar ecuaciones): El del medio es $x$. Los
  tres consecutivos son $x-1$, $x$, $x+1$.


  Ambos modelos son correctos, pero si el problema te pide ''el número menor'' y usaste
  el modelo centrado, recuerda que el menor era $x-1$, no $x$.'
definiciones_clave: '- **Representación de números enteros consecutivos**: Herramienta
  clave para pasar del lenguaje natural al lenguaje algebraico.'
propiedades_relaciones: '- **Regla de traducción / sustitución**: Equivalencias verbales
  y numéricas de representación de números enteros consecutivos.'
ejemplo_guiado:
