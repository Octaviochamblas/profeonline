- 'Paso 1: Identificar los términos o variables involucradas.'
- 'Paso 2: Aplicar el operador o símbolo de relación adecuado.'
- 'Paso 3: Formular la expresión algebraica final.'
errores_correccion: '- **Error 1: Invertir o alterar el operador al traducir números
  enteros consecutivos.** **Cómo corregirlo:** Aplicar de forma estricta el operador
  correspondiente a la relación enunciada.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cómo se expresa algebraicamente 'tres números enteros consecutivos a
    partir de n'?
  alternativas:
  - n, n+1, n+2
  - n, 2n, 3n
  - n, n+2, n+4
  - n-1, n, n-2
  respuesta: n, n+1, n+2
  solucion_pasos:
  - 1. Analizar el enunciado.
  - 2. La traducción exacta es n, n+1, n+2.
- titulo: Ejemplo 2
  enunciado: ¿Cuál es la representación correcta para números enteros consecutivos
    en 'tres números enteros consecutivos a partir de n'?
  alternativas:
  - n, n+1, n+2
  - n, 2n, 3n
  - n, n+2, n+4
  - n-1, n, n-2
  respuesta: n, n+1, n+2
  solucion_pasos:
  - 1. Identificar la variable y los operadores.
  - 2. Obtener n, n+1, n+2.
- titulo: ¿Es la traducción dada para 'tres números enteros consecutivos a partir
    de n' equivalente a n, n+1, n+2?
  respuesta: Sí
  solucion_pasos:
  - Sí, satisface exactamente la regla de números enteros consecutivos.
- titulo: ¿Representa n, 2n, 3n la traducción correcta de 'tres números enteros consecutivos
    a partir de n'?
  respuesta: 'No'
  solucion_pasos:
  - No, la traducción correcta es n, n+1, n+2.
errores_frecuentes:
- Omitir el operador de desigualdad estricta o no estricta al traducir números enteros
  consecutivos.
- Invertir el orden de las variables al construir la expresión de números enteros
  consecutivos.
- Usar una suma cuando el enunciado de números enteros consecutivos exige una resta
  o división.
- Omitir paréntesis al multiplicar expresiones en números enteros consecutivos.
- Declarar que la expresión de números enteros consecutivos es válida sólo para números
  pares.
afirmaciones_verdaderas:
- La traducción simbólica de números enteros consecutivos preserva la relación de
  orden o sucesión entre cantidades.
- La notación algebraica permite expresar relaciones numéricas complejas de forma
  compacta.
al_terminar_debes_poder: Al terminar serás capaz de traducir expresiones de números
