resumen_inicial: La números enteros consecutivos permite representar estructuras matemáticas
  de sucesiones y desigualdades en notación simbólica.
explicacion_simple: Al trabajar con números enteros consecutivos, transformamos frases
  sobre números y relaciones algebraicas en expresiones exactas.
explicacion_formal: 'Sea $x \in \mathbb{R}$. La relación formal para **Números enteros
  consecutivos** viene dada por:


  $$\text{"tres números enteros consecutivos a partir de n"} \implies n, n+1, n+2$$


  > **Complemento didáctico:** Esta estructura fija las reglas formales de planteamiento
  para expresiones algebraicas de orden y sucesiones.'
definiciones_clave: '- **Números enteros consecutivos**: Representación simbólica
  en el lenguaje algebraico de relaciones.'
propiedades_relaciones: '- **Consistencia de notación**: n, n+1, n+2 define la estructura
  requerida.'
ejemplo_guiado:
  enunciado: 'Traduzca o exprese según números enteros consecutivos: ''tres números
    enteros consecutivos a partir de n''.'
  pasos:
  - 'Paso 1: Identificar las variables o parámetros del enunciado.'
  - 'Paso 2: Aplicar la regla de traducción correspondiente a números enteros consecutivos.'
  - 'Conclusión: La expresión resultante es n, n+1, n+2.'
