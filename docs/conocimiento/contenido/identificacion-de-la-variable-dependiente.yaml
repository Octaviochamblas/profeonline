semantic_id: MAT.ALG.FUNCION_CONCEPTOS.VARIABLE_DEPENDIENTE
resumen_inicial: La variable dependiente (usualmente $y$ o $f(x)$) es el valor de
  salida que cambia en función de la entrada.
explicacion_simple: 'En una función $y = f(x)$, la **variable dependiente** es la
  $y$.

  Se llama ''dependiente'' porque su valor numérico **depende directamente** del valor
  que le hayamos asignado a la $x$.

  Gráficamente se ubica siempre en el eje vertical $Y$.'
explicacion_formal: 'En la relación funcional $y = f(x)$ sobre $A \times B$:


  $$y = f(x) \in \operatorname{Rec}(f) \quad \text{es la variable dependiente}$$


  **Desglose de la fórmula:**

  - Magnitud de salida cuyo valor queda determinado de forma unívoca por la transformación
  $f$ sobre $x$.'
definiciones_clave: '- **Variable dependiente ($y$)**: Magnitud cuyo valor se calcula
  subordinado al valor atribuido a la variable independiente.'
propiedades_relaciones: '- **Eje de ordenadas**: En el plano cartesiano se representa
  sobre el eje vertical $Y$.'
ejemplo_guiado:
  enunciado: En la función de costo de combustible $C(g) = 1.100 \cdot g$, identifica
    la variable dependiente.
  pasos:
  - 'Paso 1: Observar que el costo total $C$ se calcula multiplicando $1.100$ por
    los galones $g$.Paso 2: Razonar: el costo total $C$ cambia según cuántos galones
    $g$ carguemos.Paso 3: Concluir que el costo total $C$ es la variable dependiente
    (salida).'
checkpoints:
- placement: after_explicacion_formal
  question: En el modelo de costo $C(g) = 1.100 \cdot g$, ¿cuál es la variable dependiente?
  choices:
  - text: El costo total $C$.
    is_correct: true
  - text: La cantidad de galones $g$.
    is_correct: false
  - text: El precio unitario $1.100$.
    is_correct: false
  - text: El número de autos.
    is_correct: false
  explanation: La alternativa correcta es 'El costo total $C$.'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué eje del plano cartesiano se representa la variable dependiente?
  choices:
  - text: En el eje vertical $Y$ (eje de ordenadas).
    is_correct: true
  - text: En el eje horizontal $X$ (eje de abscisas).
    is_correct: false
  - text: En el origen $(0,0)$.
    is_correct: false
  - text: En la bisectriz exterior.
    is_correct: false
  explanation: La alternativa correcta es 'En el eje vertical $Y$ (eje de ordenadas).'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar las magnitudes del modelo.'
- 'Paso 2: Preguntarse: ¿cuál de las dos magnitudes es el resultado calculado?'
- 'Paso 3: Declarar esa magnitud como la variable dependiente.'
errores_correccion: '- **Error común:** Pensar que la variable dependiente es la que
  está dentro del paréntesis de la función.

  - **Cómo corregirlo:** La variable dentro del paréntesis es la independiente (causa);
  la variable dependiente es el resultado completo fuera o a la izquierda del signo
  igual (efecto).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Demostración básica de conceptos de función.
  alternativas:
  - $1$
  - $0$
  - $-1$
  respuesta: $1$
  solucion_pasos:
  - Pasos de solución.
- titulo: Ejemplo 2
  enunciado: Demostración algebraica de conceptos de función.
  alternativas:
  - $x$
  - $x^2$
  - $1$
  respuesta: $x$
  solucion_pasos:
  - Pasos de solución.
- titulo: ¿Una función asigna a cada elemento del dominio una única imagen?
  respuesta: Sí
  solucion_pasos:
  - Sí, por la propiedad fundamental de unicidad.
- titulo: ¿El dominio corresponde al conjunto de todas las preimágenes válidas?
  respuesta: Sí
  solucion_pasos:
  - Sí, es el conjunto de valores de entrada del dominio real.
errores_frecuentes:
- Confundir la notación funcional $f(x)$ con una multiplicación algebraica de $f$
  por $x$.
- Creer que dos preimágenes distintas no pueden compartir la misma imagen.
- Confundir el codominio (conjunto de llegada declarado) con el recorrido (imágenes
  efectivamente alcanzadas).
- Olvidar buscar restricciones de división por cero o raíces pares al determinar el
  dominio.
- Intercambiar la variable independiente ($x$) con la variable dependiente ($y$).
afirmaciones_verdaderas:
- Una función asigna a cada elemento de su dominio una única imagen bien definida
  en su conjunto de llegada.
- El recorrido de una función es siempre un subconjunto de su codominio ($\operatorname{Rec}(f)
  \subset \text{Cod}(f)$).
al_terminar_debes_poder: Al finalizar este recurso podrás definir, distinguir e interpretar
  los conceptos fundamentales de función, dominio, codominio, recorrido, preimagen
  e imagen.
fuente: Texto escolar MINEDUC — Álgebra / Conceptos Base de Función
