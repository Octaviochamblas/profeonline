semantic_id: MAT.ALG.FUNCION_CONCEPTOS.VARIABLE_DEPENDIENTE
resumen_inicial: 'Identificación de la variable dependiente: conceptos, representación
  y propiedades en Conceptos base de función.'
explicacion_simple: 'Una vez que eliges el valor de $x$, el valor de $y$ ya no es
  una elección libre: queda completamente determinado por la regla de la función.'
explicacion_formal: '### Definición formal


  En $y=f(x)$, la variable $y$ toma el valor que la función asigna a cada $x$ del
  dominio; su valor no se elige libremente, sino que queda unívocamente determinado
  por $x$ y la regla $f$. Por eso $y$ recibe el nombre de variable dependiente.


  ### Desarrollo didáctico


  Retomando el ejemplo de la planta: tú eliges cuánta agua darle ($x$), pero cuánto
  crece ($y$) no lo eliges directamente, es una consecuencia de tu elección y de la
  biología de la planta (la regla $f$).


  En $y = 3x+2$, si eliges $x=4$, el valor $y=14$ queda forzado; no puedes elegir
  $y=20$ para ese mismo $x$ sin contradecir la función.'
definiciones_clave: '- **Identificación de la variable dependiente**: Elemento central
  en el estudio de funciones y modelos algebraicos.'
propiedades_relaciones: '- **Propiedades funcionales**: Dominio, recorrido, gráfica
  y parámetros característicos aplicados a identificación de la variable dependiente.'
ejemplo_guiado:
  enunciado: Evalúa o determina la propiedad funcional asociada a identificación de
    la variable dependiente.
  pasos:
  - Identificar la expresión o representación de la función.
  - Aplicar la definición o regla correspondiente a identificación de la variable
    dependiente.
  - Sustituir los valores de entrada o analizar la gráfica.
  - Escribir la respuesta indicando la preimagen, imagen o modelo resultante.
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la condición fundamental que define una función al trabajar con
    identificación de la variable dependiente?
  choices:
  - text: Verificar que a cada elemento del dominio le corresponda una única imagen
      en conceptos base de función
    is_correct: true
  - text: Asignar múltiples imágenes a una misma preimagen
    is_correct: false
  - text: Ignorar los valores negativos del dominio
    is_correct: false
  - text: Multiplicar todas las entradas por cero
    is_correct: false
  explanation: 'La alternativa correcta es: Verificar que a cada elemento del dominio
    le corresponda una única imagen en conceptos base de función. Es la condición
    de existencia y unicidad en identificación de la variable dependiente.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Al evaluar una función en un punto específico en identificación de la
    variable dependiente, ¿qué procedimiento se debe seguir?
  choices:
  - text: Sustituir el valor de x en la regla de correspondencia f(x) respetando el
      dominio
    is_correct: true
  - text: Reemplazar la variable por la constante deseada sin evaluar
    is_correct: false
  - text: Dividir el resultado entre el nombre de la función
    is_correct: false
  - text: Igualar siempre la función a cero
    is_correct: false
  explanation: 'La alternativa correcta es: Sustituir el valor de x en la regla de
    correspondencia f(x) respetando el dominio. Procedimiento estándar de evaluación
    funcional.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identifica cuál cantidad resulta o se calcula a partir de otra en el contexto
  o la fórmula.'
- 'Paso 2: Esa cantidad, generalmente denotada $y$, es la variable dependiente.'
- 'Paso 3: Confirma que su valor se obtiene evaluando la función en la variable independiente.'
errores_correccion: Evita confundir la preimagen $x$ con la imagen $f(x)$ al interpretar
  o evaluar identificación de la variable dependiente.
ejemplos:
- titulo: Identificación en una fórmula
  enunciado: En $y = 5x - 2$, ¿cuál es la variable dependiente?
  solucion_pasos:
  - El valor de $y$ se calcula a partir del valor elegido para $x$.
  - 'Variable dependiente: $y$.'
- titulo: Identificación en un contexto verbal
  enunciado: El costo de un taxi depende de los kilómetros recorridos. ¿Cuál es la
    variable dependiente?
  solucion_pasos:
  - El costo es el resultado que se obtiene a partir de los kilómetros recorridos.
  - 'Variable dependiente: el costo del viaje.'
- titulo: ¿El valor de la variable dependiente se elige libremente?
  enunciado: ¿El valor de la variable dependiente se elige libremente?
  respuesta: Falso
  solucion_pasos:
  - El valor de la variable dependiente queda determinado por la variable independiente
    a través de la función.
- titulo: ¿En $y=f(x)$, la letra $y$ representa la variable independiente?
  enunciado: ¿En $y=f(x)$, la letra $y$ representa la variable independiente?
  respuesta: Falso
  solucion_pasos:
  - $y$ es el resultado calculado a partir de $x$, es decir, la variable dependiente.
errores_frecuentes:
- Creer que la variable dependiente puede tomar cualquier valor sin relación con $x$.
- Confundir la variable dependiente con el nombre de la función misma.
- Invertir los roles de $x$ e $y$ al leer un contexto verbal.
- Suponer que la variable dependiente es siempre positiva o siempre entera sin analizar
  el contexto.
afirmaciones_verdaderas:
- En toda función, cada preimagen posee una única imagen en el codominio.
al_terminar_debes_ponder: Evaluar, graficar e interpretar funciones aplicando identificación
  de la variable dependiente.
