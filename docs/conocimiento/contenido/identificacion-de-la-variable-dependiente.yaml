semantic_id: MAT.ALG.FUNCION_CONCEPTOS.VARIABLE_DEPENDIENTE
resumen_inicial: La variable dependiente es la magnitud de salida cuyo valor queda determinado automáticamente por la variable independiente.
explicacion_simple: '![La variable dependiente es la magnitud de salida cuyo valor queda determinado automáticamente por la variable independiente](/static/img/nodos/identificacion-de-la-variable-dependiente-intro.svg)



  En una relación funcional:

  - La **variable dependiente** es el **efecto** o resultado final.

  - Su valor no se elige libremente, sino que depende del número de entrada introducido y de la fórmula de la función.


  Se suele representar con la letra $y$ o con la notación $f(x)$, y se grafica en el **eje vertical** del plano cartesiano.'
explicacion_formal: 'En la relación $y = f(x)$:

  - La variable $y$ se denomina **variable dependiente** o valor de la función.

  - El conjunto de todos sus valores alcanzados conforma el **recorrido** de la función ($\text{Rec}(f)$).

  - En modelos aplicados, representa la respuesta o consecuencia que se desea predecir o calcular (ingresos totales, temperatura resultante, distancia alcanzada).'
definiciones_clave: '- **Variable dependiente**: Magnitud de salida condicionada por el valor de la variable independiente.

  - **Eje de ordenadas**: Eje vertical $Y$ donde se representan sus valores.'
propiedades_relaciones: '- **Subordinación**: Cambia de valor como respuesta directa a los cambios en la variable independiente.

  - **Recorrido**: Sus valores forman parte del conjunto de llegada o codominio.'
ejemplo_guiado:
  enunciado: '![Ejemplo La variable dependiente es la magnitud de salida cuyo valor queda determinado automáticamente por la variable independiente](/static/img/nodos/identificacion-de-la-variable-dependiente-ejemplos.svg)



    Una empresa de arriendo de bicicletas cobra según la función $P(t) = 2000 + 1500t$, donde $t$ es el tiempo en horas y $P$ es el precio final a pagar. Identifica la variable dependiente y justifica la respuesta.'
  pasos:
  - 'Paso 1: Identificar las dos variables: tiempo $t$ y precio $P$.'
  - 'Paso 2: Analizar la dependencia: el precio final $P$ depende de cuántas horas $t$ se use la bicicleta.'
  - 'Paso 3: Observar que $P$ es el resultado de la evaluación de la función $P(t)$.'
  - 'Paso 4: Concluir que la variable dependiente es el precio a pagar $P$ (en pesos).'
checkpoints:
- placement: after_explicacion_formal
  question: En la función $A(r) = \pi r^2$ que calcula el área de un círculo según su radio, ¿cuál es la variable dependiente?
  choices:
  - text: El área A
    is_correct: true
  - text: El radio r
    is_correct: false
  - text: La constante pi
    is_correct: false
  - text: El exponente 2
    is_correct: false
  explanation: La alternativa correcta es 'El área A'. El área es el resultado obtenido que depende de la medida del radio.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿En qué eje del plano cartesiano se representa habitualmente la variable dependiente?
  choices:
  - text: Eje vertical Y (ordenadas)
    is_correct: true
  - text: Eje horizontal X (abscisas)
    is_correct: false
  - text: Eje diagonal
    is_correct: false
  - text: En el centro del plano
    is_correct: false
  explanation: La alternativa correcta es 'Eje vertical Y (ordenadas)'. Las salidas o valores dependientes se leen en el eje vertical.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar en el enunciado cuál es la magnitud resultante o efecto que se calcula.'
- 'Paso 2: En la fórmula $y = f(x)$, reconocer la variable aislada en el primer miembro ($y$).'
- 'Paso 3: Verificar que su valor cambie en función de las entradas.'
- 'Paso 4: Declarar la variable dependiente y sus unidades correspondientes.'
errores_correccion: '- **Error común:** Pensar que la variable dependiente siempre debe llamarse obligatoriamente $y$.

  - **Cómo corregirlo:** Puede tener cualquier letra representativa (como $C$ de costo, $h$ de altura o $G$ de ganancia); lo importante es su rol de salida en el modelo.'
ejemplos:
- titulo: 'Ejemplo 1: Física del movimiento'
  enunciado: En $d(t) = 60t$, donde $t$ es el tiempo en horas y $d$ es la distancia en km, ¿cuál es la variable dependiente?
  alternativas:
  - La distancia d
  - El tiempo t
  - La velocidad 60
  - Ninguna
  respuesta: La distancia d
  solucion_pasos:
  - 'Paso 1: La distancia recorrida $d$ depende del tiempo transcurrido $t$.'
  - 'Paso 2: $d$ es la variable dependiente.'
- titulo: 'Ejemplo 2: Salario mensual'
  enunciado: El sueldo de un vendedor es $S(v) = 400000 + 0.05v$, según sus ventas $v$. ¿Cuál es la variable dependiente?
  alternativas:
  - El sueldo total S
  - Las ventas v
  - El sueldo base 400000
  - La comisión del 5%
  respuesta: El sueldo total S
  solucion_pasos:
  - 'Paso 1: El sueldo $S$ es el resultado condicionado a las ventas $v$.'
- titulo: 'Ejemplo 3: Gráfico cartesiano'
  enunciado: En un gráfico de temperatura versus hora del día, con la temperatura en el eje vertical y la hora en el horizontal, ¿cuál es la variable dependiente?
  alternativas:
  - La temperatura
  - La hora del día
  - El día del año
  - El origen (0,0)
  respuesta: La temperatura
  solucion_pasos:
  - 'Paso 1: La magnitud en el eje vertical (temperatura) es la variable dependiente.'
- titulo: 'Ejemplo 4: Llenado de estanque'
  enunciado: El volumen de agua en un estanque es $V(t) = 500 - 20t$ litros tras $t$ minutos. ¿Cuál es la variable dependiente?
  alternativas:
  - El volumen de agua V
  - El tiempo t
  - La capacidad inicial 500
  - El caudal de vaciado 20
  respuesta: El volumen de agua V
  solucion_pasos:
  - 'Paso 1: El volumen restante $V$ depende de los minutos $t$ transcurridos.'
errores_frecuentes:
- Confundir la variable dependiente con la constante de proporcionalidad.
- Asumir que la variable dependiente puede fijarse arbitrariamente.
- Intercambiar los ejes en la representación gráfica de modelos reales.
afirmaciones_verdaderas:
- La variable dependiente es la magnitud de salida cuyo valor resulta de aplicar la regla funcional a la entrada.
- En el plano cartesiano se representa habitualmente sobre el eje vertical Y.
al_terminar_debes_poder: '**QUÉ:** Identificar e interpretar la variable dependiente en modelos y funciones matemáticas.


  **CÓMO:** Reconociendo la magnitud de salida subordinada a la entrada y ubicándola en el eje de las ordenadas.


  ![Resumen La variable dependiente es la magnitud de salida cuyo valor queda determinado automáticamente por la variable independiente](/static/img/nodos/identificacion-de-la-variable-dependiente-resumen.svg)'
