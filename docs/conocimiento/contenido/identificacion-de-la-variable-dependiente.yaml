semantic_id: MAT.ALG.FUNCION_CONCEPTOS.VARIABLE_DEPENDIENTE
resumen_inicial: La variable dependiente es aquella cuyo valor numérico cambia según los valores asignados a la variable independiente.
explicacion_simple: |
  En una función, la **variable dependiente** representa el resultado o consecuencia.

  Por ejemplo, en la relación "el costo del agua $C$ depende de los metros cúbicos consumidos $m$":
  - El costo $C$ es la **variable dependiente** (cambia según cuánto consumas).
  - Se ubica en el eje vertical $Y$ de los gráficos.
explicacion_formal: |
  Dada una función $f: A \to B$ definida por la relación $y = f(x)$, el símbolo $y$ recibe el nombre de **variable dependiente** porque su valor se calcula en función del valor asignado a la variable independiente $x$.

  $$\text{Variable Dependiente } y = f(x) \in B$$

  **Desglose de la fórmula:**
  - $x$: Variable independiente (causa).
  - $y$: Variable dependiente (efecto/resultado).
definiciones_clave: |
  - **Variable dependiente**: Magnitud de salida cuyos valores están supeditados a la regla funcional y a los valores de entrada.
propiedades_relaciones: |
  - **Ubicación en el gráfico cartesiano**: Se grafica de manera estándar en el eje de las ordenadas ($Y$).
ejemplo_guiado:
  enunciado: En el modelo de cobro de un taxi $P(d) = 300d + 500$, donde $d$ es la distancia en kilómetros y $P$ es el precio en pesos, identifica la variable dependiente.
  pasos:
    - 'Paso 1: Analizar la situación física: el precio del viaje cambia según la distancia recorrida.'
    - 'Paso 2: Identificar la magnitud resultado: el precio en pesos $P$.'
    - 'Paso 3: Observar la notación $P(d)$: $P$ es el resultado de procesar la distancia $d$.'
    - 'Paso 4: Concluir que la variable dependiente es el precio $P$.'
checkpoints:
  - placement: after_explicacion_formal
    question: En el modelo $P(d) = 300d + 500$, ¿cuál es la variable dependiente?
    choices:
      - {text: El precio $P$., is_correct: true}
      - {text: La distancia $d$., is_correct: false}
      - {text: La constante $300$., is_correct: false}
      - {text: El valor $500$., is_correct: false}
    explanation: La alternativa correcta es 'El precio $P$.'. Su valor depende de la distancia $d$.
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: ¿En qué eje del plano cartesiano se representa habitualmente la variable dependiente?
    choices:
      - {text: En el eje vertical de las ordenadas ($Y$)., is_correct: true}
      - {text: En el eje horizontal de las abscisas ($X$)., is_correct: false}
      - {text: En el origen de coordenadas $(0, 0)$., is_correct: false}
      - {text: En la bisectriz del primer cuadrante., is_correct: false}
    explanation: La alternativa correcta es 'En el eje vertical de las ordenadas ($Y$).'.
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Identificar la expresión funcional $y = f(x)$ o la situación del problema.'
  - 'Paso 2: Determinar cuál magnitud actúa como el resultado o efecto producido.'
  - 'Paso 3: Asociar dicha magnitud a la variable de salida (eje $Y$).'
  - 'Paso 4: Declararla formalmente como la variable dependiente.'
errores_correccion: |
  - **Error común:** Confundir cuál variable manda (independiente) y cuál obedece (dependiente).
  - **Cómo corregirlo:** Pregúntate: "¿Qué depende de qué?". Por ejemplo, la nota depende de las horas de estudio (nota = dependiente).
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Demostración básica de funciones.
    alternativas:
      - '$1$'
      - '$0$'
      - '$-1$'
    respuesta: '$1$'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Demostración algebraica de funciones.
    alternativas:
      - '$x$'
      - '$x^2$'
      - '$1$'
    respuesta: '$x$'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'En la función $y = f(x)$, la variable $x$ es la variable dependiente porque se encuentra a la derecha.'
  - 'La variable dependiente es aquella a la que se le asignan valores arbitrarios de entrada de forma libre.'
  - 'El valor de la variable dependiente no cambia al modificar los valores de la variable independiente.'
  - 'En un problema contextual de costo total $C(n) = 500n + 1000$, la cantidad de artículos $n$ es la variable dependiente.'
  - 'La variable dependiente se grafica habitualmente sobre el eje horizontal de las abscisas ($X$).'
afirmaciones_verdaderas:
  - 'La variable dependiente (habitualmente $y$ o $f(x)$) es aquella cuyo valor queda determinado por el valor que adopta la variable independiente.'
  - 'En el plano cartesiano, la variable dependiente se representa geométricamente en el eje vertical de las ordenadas ($Y$).'
al_terminar_debes_poder: |
  QUÉ: Identificar la variable dependiente en expresiones algebraicas y problemas contextuales.
  CÓMO: Analizar la relación causa-efecto del enunciado o fórmula, ubicar el valor de salida determinado y asociarlo al eje vertical $Y$.
