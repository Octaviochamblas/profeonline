semantic_id: MAT.GEO.SIMETRAL_CIRCUNCENTRO.CIRCUNFERENCIA_CIRCUNSCRITA_CENTRO
resumen_inicial: 'Propiedad del circuncentro como centro de la circunferencia circunscrita:
  conceptos, teoremas, propiedades geométricas y cálculo en Elementos Secundarios
  del Triángulo.'
explicacion_simple: Gracias a la equidistancia del circuncentro respecto a los tres
  vértices, es posible trazar una única circunferencia centrada en él que pasa exactamente
  por los tres.
explicacion_formal: '![Circunferencia circunscrita, centro en el circuncentro](/static/img/geometria/elementos-secundarios/simetral-circuncentro-circunferencia-circunscrita-centro.svg)


  ### Definición formal


  La circunferencia circunscrita de un triángulo ABC tiene centro en el circuncentro
  O y radio igual al circunradio R (la distancia común de O a los tres vértices);
  pasa por A, B y C.


  ### Desarrollo didáctico


  Como O está a la misma distancia R de los tres vértices, una circunferencia de centro
  O y radio R pasa exactamente por A, B y C, sin importar la forma del triángulo.'
definiciones_clave: '- **Propiedad del circuncentro como centro de la circunferencia
