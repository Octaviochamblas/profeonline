semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MODELO_DECRECIMIENTO
resumen_inicial: El modelamiento de decaimiento representa procesos de pérdida continua (desintegración radiactiva, depreciación) con $N(t) = N_0 \cdot (1 - d)^t$.
explicacion_simple: |
  Cuando un fenómeno físico o económico **pierde una fracción constante $d$** en cada unidad de tiempo $t$:

  - Usamos el **modelo de decaimiento o decrecimiento exponencial**:

  $$N(t) = N_0 \cdot (1 - d)^t$$

  - **$N_0$ es la cantidad inicial**: Masa o valor presente en $t = 0$.
  - **$d$ es la tasa de pérdida o depreciación**: En decimal (ej. $10\% \implies d = 0.10$).
  - **$b = 1 - d$ es la base de retención**: Como $d > 0$, la base cumple $0 < b < 1$, por lo que la cantidad **disminuye hacia cero**.
  - **Vida media ($T_{1/2}$)**: Tiempo en que la cantidad se reduce exactamente a la mitad: $N(t) = N_0 \cdot (1/2)^{t / T_{1/2}}$.
explicacion_formal: |
  Sea $N: \mathbb{R}^+ \cup \{0\} \to \mathbb{R}^+$ la variable de estado de un sistema con desintegración o devaluación continua. El **modelo de decaimiento exponencial** satisface la ecuación diferencial autónoma:

  $$\frac{dN}{dt} = -\lambda \cdot N \quad \text{con } \lambda > 0$$

  **Formulaciones analíticas de decaimiento:**
  1. **Forma Continua (Constante de Desintegración $\lambda$):**
     $$N(t) = N_0 \cdot e^{-\lambda \cdot t}$$
  2. **Forma Discreta por Tasa Periódica $d$:**
     $$N(t) = N_0 \cdot (1 - d)^t \quad \text{con base } b = 1 - d \in ]0, 1[$$
  3. **Forma de Vida Media / Semidesintegración ($T_{1/2}$):**
     $$N(t) = N_0 \cdot \left(\frac{1}{2}\right)^{\frac{t}{T_{1/2}}}$$
definiciones_clave: |
  - **Decaimiento exponencial**: Proceso dinámico modelado por $N(t) = N_0 \cdot b^t$ con $0 < b < 1$ donde una magnitud física o económica se reduce de forma desacelerada hacia cero.
propiedades_relaciones: |
  - **Vida media ($T_{1/2}$)**: Período de tiempo constante requerido para que cualquier cantidad inicial $N_0$ se reduzca a la mitad $N_0/2$, dado por $T_{1/2} = \frac{\ln(2)}{\lambda}$.
ejemplo_guiado:
  enunciado: 'Un automóvil nuevo cuesta $\$12.000.000$ y su valor se deprecia un $10\%$ cada año. Escribe la función $V(t)$ y calcula su valor a los $2$ años.'
  pasos:
    - 'Paso 1: Identificar el valor inicial $V_0 = 12.000.000$ y la tasa de depreciación $d = 10\% = 0.10$.'
    - 'Paso 2: Calcular la base del modelo: $b = 1 - d = 1 - 0.10 = 0.90$.'
    - 'Paso 3: Formular la función exponencial: $V(t) = 12.000.000 \cdot (0.9)^t$.'
    - 'Paso 4: Evaluar para $t = 2 \implies V(2) = 12.000.000 \cdot (0.9)^2 = 12.000.000 \cdot 0.81 = $\$9.720.00$0$.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'La masa de una sustancia radiactiva de $800$ gramos tiene una vida media de $10$ horas. ¿Qué cantidad de sustancia queda al cabo de $30$ horas?'
    choices:
      - {text: 'Quedan $100$ gramos de sustancia', is_correct: true}
      - {text: 'Quedan $400$ gramos de sustancia.', is_correct: false}
      - {text: 'Quedan $200$ gramos de sustancia.', is_correct: false}
      - {text: 'Quedan $0$ gramos de sustancia.', is_correct: false}
    explanation: 'La alternativa correcta es ''Quedan $100$ gramos de sustancia''. $N(30) = 800 \cdot (1/2)^{30/10} = 800 \cdot (1/2)^3 = 800 / 8 = 100$ g.'
    reinforcement_section: Explicación formal
  - placement: after_ejemplo_guiado
    question: 'En el modelo de depreciación de una maquinaria $V(t) = 50000 \cdot (0.85)^t$, ¿cuál es el porcentaje de desvalorización por año?'
    choices:
      - {text: 'La desvalorización es del 15% anual', is_correct: true}
      - {text: 'La desvalorización es del 85% anual.', is_correct: false}
      - {text: 'La desvalorización es del 8.5% anual.', is_correct: false}
      - {text: 'La desvalorización es del 50% anual.', is_correct: false}
    explanation: 'La alternativa correcta es ''La desvalorización es del 15% anual''. $b = 1 - d = 0.85 \implies d = 0.15 = 15\%$.'
    reinforcement_section: Ejemplo guiado
procedimiento:
  - 'Paso 1: Extraer del enunciado la cantidad o valor inicial $N_0 = N(0)$.'
  - 'Paso 2: Convertir la tasa porcentual de pérdida $d\%$ a su forma decimal $d = \text{porcentaje}/100$.'
  - 'Paso 3: Calcular la base de retención $b = 1 - d$ o armar $(1/2)^{t/T_{1/2}}$ si involucra vida media.'
  - 'Paso 4: Sustituir el tiempo $t$ y calcular la cantidad remanente $N(t)$.'
errores_correccion: |
  - **Error común:** Confundir la tasa de pérdida $d$ con la base retenida $b$ (ej. poner $b = 0.10$ en lugar de $b = 0.90$ para un $10\%$ de caída).
  - **Cómo corregirlo:** La base que retenemos es **$b = 1 - d$** ($1 - 0.10 = 0.90$). Si usaras $0.10$, estarías diciendo que la sustancia pierde el $90\%$ en un paso.
ejemplos:
  - titulo: Ejemplo 1
    enunciado: Depreciación anual del 20%.
    alternativas:
      - 'V(t) = 1.000.000 \cdot (0.8)^t, V(1) = $800.000'
      - 'V(t) = 1.000.000 \cdot (0.2)^t'
      - 'V(t) = $200.000'
    respuesta: 'V(t) = 1.000.000 \cdot (0.8)^t, V(1) = $800.000'
    solucion_pasos:
      - Pasos de solución.
  - titulo: Ejemplo 2
    enunciado: Vida media de 5 días.
    alternativas:
      - 'N(t) = 64 \cdot (1/2)^{t/5}, N(15) = 8'
      - 'N(15) = 32'
      - 'N(15) = 0'
    respuesta: 'N(t) = 64 \cdot (1/2)^{t/5}, N(15) = 8'
    solucion_pasos:
      - Pasos de solución.
errores_frecuentes:
  - 'Dada una tasa de pérdida del $25\%$, la afirmación de que la base del modelo es $0.25$ en vez del complemento $0.75$.'
  - 'La confusión entre la reducción continua por decaimiento exponencial y la pérdida lineal constante.'
  - 'La afirmación de que tras un número finito de vidas medias la cantidad radiactiva se anula a cero exacto.'
  - 'La omisión del exponente de periodo $t/T_{1/2}$ en problemas de vida media.'
  - 'La afirmación de que la constante de decaimiento hace que las ordenadas resultantes sean números negativos.'
afirmaciones_verdaderas:
  - 'En los modelos de decaimiento exponencial $N(t) = N_0 \cdot (1 - d)^t$, la base satisface estrictamente $0 < 1 - d < 1$.'
  - 'El concepto de vida media $T_{1/2}$ representa el lapso constante en el que cualquier masa inicial disminuye a su 50%.'
al_terminar_debes_poder: |
  QUÉ: Modelar y resolver problemas de decaimiento exponencial y vida media mediante $N(t) = N_0 \cdot (1 - d)^t$.
  CÓMO: Identificar $N_0$, calcular la base de retención $b = 1 - d$ o $(1/2)^{t/T_{1/2}}$ y evaluar la cantidad remanente $N(t)$.
