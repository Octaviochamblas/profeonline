semantic_id: MAT.ALG.FUNC_EXPONENCIAL_GRAFICA.MODELO_DECRECIMIENTO
resumen_inicial: El modelamiento de fenómenos de decaimiento mediante funciones exponenciales proyecta la desintegración radiactiva, la absorción de fármacos o la depreciación de activos mediante la ley $N(t) = N_0 \cdot (1 - d)^t = N_0 \cdot \left(\frac{1}{2}\right)^{t/t_{1/2}}$ ($0 < b < 1$).
explicacion_simple: "![El modelamiento de fenómenos de decaimiento mediante funciones exponenciales proyecta la desintegración radiactiva, la absorción de fármacos o la depreciación de activos mediante la ley $N(t) = N_0 \\cdot (1 - d)^t = N_0 \\cdot \\left(\\frac{1}{2}\\right)^{t/t_{1/2}}$ ($0 < b < 1$)](/static/img/nodos/modelamiento-de-fenomenos-de-decaimiento-mediante-funciones-exponenciales-intro.svg)\n\n\nCuando algo pierde una fracción fija de su valor con el paso del tiempo (radiactividad, el valor de un auto, la cafeína en tu cuerpo), sigue una **fórmula de decaimiento exponencial**:\n\n- **1. Pérdida porcentual periódica (Depreciación):**\n  - Si un auto nuevo de $\\$10.000.000\\text{ pesos}$ pierde el 15% de su valor cada año:\n    - Su base es lo que **le queda**: $b = 1 - 0,15 = \\mathbf{0,85}$.\n    - Fórmula: $V(t) = 10.000.000 \\cdot (0,85)^t$.\n- **2. Vida Media o Semivida ($t_{1/2}$ en Física):**\n  - Es el tiempo que tarda una sustancia en reducirse a la **mitad exacta**\
  \ ($1/2$):\n    $$N(t) = N_0 \\cdot \\left(\\frac{1}{2}\\right)^{t/t_{1/2}}$$\n  - Cada período que pasa, queda la mitad de lo que había."
explicacion_formal: 'Sea $N(t)$ la cantidad de sustancia presente en el instante $t \ge 0$. La **ley de decaimiento natural de Rutherford-Soddy** establece:

  $$\frac{dN}{dt} = -\lambda N(t), \quad \lambda > 0, \; N(0) = N_0$$


  **Solución diferencial y semivida**:

  $$N(t) = N_0 e^{-\lambda t} = N_0 \left(\frac{1}{2}\right)^{t/t_{1/2}}, \quad \text{donde } t_{1/2} = \frac{\ln(2)}{\lambda}$$


  **Propiedades asintóticas**:

  1. **Asíntota horizontal**: $\lim_{t \to +\infty} N(t) = 0 \implies$ la sustancia nunca desaparece formalmente en tiempo finito.

  2. **Conservación de tasa de pérdida relativa**: $\frac{N(t) - N(t+\Delta t)}{N(t)} = 1 - b^{\Delta t} = \text{Constante}$.'
definiciones_clave: '- **Vida media (Semivida $t_{1/2}$)**: Período característico en el que la cantidad remanente se reduce al 50% de su valor.

  - **Factor de retención ($1 - d$)**: Porcentaje complementario que permanece tras la depreciación periódica.'
propiedades_relaciones: '- **Escala de potencias de $1/2$**: Tras $k$ vidas medias ($t = k \cdot t_{1/2}$), la cantidad remanente es $N(k \cdot t_{1/2}) = N_0 \left(\frac{1}{2}\right)^k = \frac{N_0}{2^k}$.

  - **Invarianza de semivida**: La vida media no depende de la masa inicial de la muestra.'
ejemplo_guiado:
  enunciado: '![Ejemplo El modelamiento de fenómenos de decaimiento mediante funciones exponenciales proyecta la desintegración radiactiva, la absorción de fármacos o la depreciación de activos mediante la ley $N(t) = N_0 \cdot (1 - d)^t = N_0 \cdot \left(\frac{1}{2}\right)^{t/t_{1/2}}$ ($0 < b < 1$)](/static/img/nodos/modelamiento-de-fenomenos-de-decaimiento-mediante-funciones-exponenciales-ejemplos.svg)



    Un isótopo radiactivo tiene una masa inicial de 160 gramos y una vida media de 4 horas. Modela la función de masa remanente $M(t)$ y calcula cuántos gramos quedarán tras 12 horas.'
  pasos:
  - 'Paso 1: Identificar datos: $N_0 = 160\text{ g}$, vida media $t_{1/2} = 4\text{ horas}$.'
  - 'Paso 2: Formular la función de decaimiento exponencial:

    $M(t) = 160 \cdot \left(\frac{1}{2}\right)^{t/4}$.'
  - 'Paso 3: Calcular el número de vidas medias para $t = 12\text{ horas}$:

    $k = \frac{12}{4} = 3\text{ vidas medias transcurridas}$.'
  - 'Paso 4: Evaluar la masa remanente:

    $M(12) = 160 \cdot \left(\frac{1}{2}\right)^3 = 160 \cdot \frac{1}{8} = 20\text{ gramos}$.'
  - 'Paso 5: Conclusión: Tras 12 horas quedarán **20 gramos** de isótopo radiactivo.'
checkpoints:
- placement: after_explicacion_formal
  question: Si una máquina de $6.000.000 se deprecia un 20% anual, ¿cuál es la base b de su modelo exponencial?
  choices:
  - text: b = 0,80 (1 - 0,20 = 0,80)
    is_correct: true
  - text: b = 0,20
    is_correct: false
  - text: b = 1,20
    is_correct: false
  - text: b = -0,20
    is_correct: false
  explanation: La alternativa correcta es 'b = 0,80 (1 - 0,20 = 0,80)'. Si pierde el 20%, conserva el 80% de su valor cada año.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una sustancia con masa inicial de 80 g tiene una vida media de 5 días, ¿cuánta masa queda tras 10 días (2 vidas medias)?
  choices:
  - text: 20 gramos (80 / 4)
    is_correct: true
  - text: 40 gramos
    is_correct: false
  - text: 0 gramos
    is_correct: false
  - text: 10 gramos
    is_correct: false
  explanation: La alternativa correcta es '20 gramos (80 / 4)'. Tras la primera vida media quedan 40 g; tras la segunda vida media quedan 20 g ($80 / 2^2 = 20\text{ g}$).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar la cantidad inicial $N_0$ en el instante $t = 0$.'
- 'Paso 2: Si el problema da una tasa de pérdida $d$, calcular la base de retención $b = 1 - d$.'
- 'Paso 3: Si da una vida media $t_{1/2}$, formular la base como $\left(\frac{1}{2}\right)^{t/t_{1/2}}$.'
- 'Paso 4: Evaluar la función para el tiempo dado y expresar la respuesta con sus unidades físicas.'
errores_correccion: '- **Error común:** Usar la pérdida $d$ en lugar de lo que queda ($1 - d$) como base.

  - **Cómo corregirlo:** La función modela lo que **permanece**: si pierde 10%, la base es **$1 - 0,10 = 0,90$**.'
ejemplos:
- titulo: 'Ejemplo 1: Semivida de fármaco'
  enunciado: 'Un fármaco con 200 mg iniciales y vida media de 2 horas ($D(t) = 200 \cdot (0,5)^{t/2}$): ¿cuánto queda en 6 horas?'
  alternativas:
  - 25 mg
  - 50 mg
  - 100 mg
  - 12,5 mg
  respuesta: 25 mg
  solucion_pasos:
  - 'Paso 1: $t/2 = 6/2 = 3 \implies D(6) = 200 \cdot (0{,}5)^3 = 200/8 = 25\text{ mg}$.'
- titulo: 'Ejemplo 2: Depreciación de maquinaria'
  enunciado: 'Un equipo de $\$5.000.000\text{ pesos}$ pierde 10% anual ($b = 0,90$). En 2 años vale:'
  alternativas:
  - $\$4.050.000\text{ pesos}$
  - $\$4.000.000\text{ pesos}$
  - $\$4.500.000\text{ pesos}$
  - $\$3.500.000\text{ pesos}$
  respuesta: $\$4.050.000\text{ pesos}$
  solucion_pasos:
  - 'Paso 1: $V(2) = 5.000.000 \cdot (0{,}9)^2 = 5.000.000 \cdot 0{,}81 = \$4.050.000$.'
- titulo: 'Ejemplo 3: Fracción remanente'
  enunciado: ¿Qué porcentaje de masa radiactiva queda tras 4 vidas medias?
  alternativas:
  - 6,25% (1/16)
  - 12,5%
  - 25%
  - 0%
  respuesta: 6,25% (1/16)
  solucion_pasos:
  - 'Paso 1: $(1/2)^4 = 1/16 = 0{,}0625 = 6{,}25\%$.'
- titulo: 'Ejemplo 4: Límite a largo plazo'
  enunciado: En un modelo de decaimiento radiactivo, ¿a qué valor tiende la masa remanente cuando $t \to +\infty$?
  alternativas:
  - 0 gramos (asíntota horizontal y = 0)
  - -infinito
  - 1 gramo
  - La mitad
  respuesta: 0 gramos (asíntota horizontal y = 0)
  solucion_pasos:
  - 'Paso 1: $\lim_{t \to +\infty} N_0 \cdot b^t = 0$ para $0 < b < 1$.'
errores_frecuentes:
- Asumir que tras dos vidas medias la sustancia se extingue al 100% (queda el 25%).
- Restar la pérdida de forma lineal fija año a año.
- Olvidar elevar la fracción de vida media a la potencia t/t₁/₂.
afirmaciones_verdaderas:
- Los modelos de decaimiento exponencial utilizan bases que satisfacen 0 < b < 1.
- Tras k vidas medias, la cantidad remanente de sustancia es exactamente N₀ / 2ᵏ.
al_terminar_debes_poder: '**QUÉ:** Modelar y resolver problemas de decaimiento exponencial y semivida.


  **CÓMO:** Formulando N(t) = N₀ · (1 - d)ᵗ o N(t) = N₀ · (1/2)^(t/t₁/₂) para predecir cantidades remanentes.


