semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.FRACCION_IRREDUCTIBLE
resumen_inicial: Una fracción $\frac{a}{b}$ es irreductible cuando su numerador y su denominador son coprimos, es decir, $\operatorname{MCD}(a, b) = 1$.
explicacion_simple: 'Una fracción irreductible es aquella que ya no se puede simplificar más porque el número de arriba y el número de abajo no comparten ningún divisor en común aparte del 1. Representa la forma más simple y limpia de escribir esa cantidad racional.


  ![Identificación de fracción irreductible](/static/img/nodos/identificacion-de-fraccion-irreductible-intro.svg)'
explicacion_formal: 'Una fracción $\frac{a}{b} \in \mathbb{Q}$ se define como **Irreductible** (o Canónica) si y solo si sus términos verifican la condición de ser coprimos:


  $$\operatorname{MCD}(|a|, |b|) = 1 \iff D^+(|a|) \cap D^+(|b|) = \{1\}$$


  **Desglose de la fórmula:**

  - $\operatorname{MCD}(|a|, |b|) = 1$: Ausencia de divisores primos comunes entre numerador y denominador.

  - Representante canónico: Cada clase de equivalencia contiene un único representante irreductible con $b > 0$.


  > **Complemento didáctico:** La fracción $\frac{3}{4}$ es irreductible porque $\operatorname{MCD}(3, 4) = 1$, mientras que $\frac{6}{8}$ no lo es porque $\operatorname{MCD}(6, 8) = 2$.'
definiciones_clave: '- **Fracción irreductible (canónica)**: Expresión racional simplificada al máximo donde $\operatorname{MCD}(a, b) = 1$.'
propiedades_relaciones: '- **Representante de clase**: Toda clase de equivalencia posee una única representación irreductible canónica.'
ejemplo_guiado:
  enunciado: 'Determine si la fracción $\frac{8}{15}$ es una fracción irreductible calculando su $\operatorname{MCD}$.


    ![Ejemplo Identificación de fracción irreductible](/static/img/nodos/identificacion-de-fraccion-irreductible-ejemplos.svg)'
  pasos:
  - 'Paso 1: Obtener los divisores de 8: $D^+(8) = \{1, 2, 4, 8\}$.'
  - 'Paso 2: Obtener los divisores de 15: $D^+(15) = \{1, 3, 5, 15\}$.'
  - 'Paso 3: Calcular la intersección: $D^+(8) \cap D^+(15) = \{1\} \implies \operatorname{MCD}(8, 15) = 1$.'
  - 'Conclusión: Como el M.C.D. es igual a $1$, $\frac{8}{15}$ es una fracción irreductible.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición deben cumplir el numerador y el denominador para que una fracción sea irreductible?
  choices:
  - text: Deben ser números coprimos, es decir, MCD(a, b) = 1
    is_correct: true
  - text: Deben ser números pares ambos
    is_correct: false
  - text: El numerador debe ser igual a cero
    is_correct: false
  - text: La resta de ambos debe dar cero
    is_correct: false
  explanation: La alternativa correcta es 'Deben ser números coprimos, es decir, MCD(a, b) = 1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 8/15, ¿por qué es irreductible si 8 y 15 son números compuestos?
  choices:
  - text: Porque no comparten divisores en común excepto el 1 (MCD = 1)
    is_correct: true
  - text: Porque 8 es par y 15 es impar
    is_correct: false
  - text: Because se sumaron las cifras
    is_correct: false
  - text: No es irreductible
    is_correct: false
  explanation: La alternativa correcta es 'Porque no comparten divisores en común excepto el 1 (MCD = 1)'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Calcular el máximo común divisor entre el numerador y el denominador.'
- 'Paso 2: Verificar si $\operatorname{MCD}(|a|, |b|) = 1$.'
- 'Paso 3: Declarar la fracción como irreductible si no se pueden aplicar más divisiones exactas.'
errores_correccion: '- **Error 1: Creer que para ser irreductible el numerador y denominador deben ser primos.** **Cómo corregirlo:** Fracciones como $\frac{8}{9}$ son irreductibles porque $\operatorname{MCD}(8, 9) = 1$, aunque 8 y 9 sean compuestos.


  - **Error 2: Detener la simplificación antes de llegar a la irreductible (dejar $\frac{6}{8}$).** **Cómo corregirlo:** $\frac{6}{8}$ se puede seguir dividiendo por 2 hasta llegar a $\frac{3}{4}$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de las siguientes fracciones es irreductible?
  alternativas:
  - 5/9
  - 6/10
  - 4/12
  respuesta: 5/9
  solucion_pasos:
  - $\operatorname{MCD}(5, 9) = 1 \implies$ 5/9 es irreductible.
- titulo: Ejemplo 2
  enunciado: ¿Es 14/21 una fracción irreductible?
  alternativas:
  - No, porque se puede simplificar dividiendo entre 7 (da 2/3)
  - Sí, porque 21 es impar
  - Sí, no tiene divisores
  respuesta: No, porque se puede simplificar dividiendo entre 7 (da 2/3)
  solucion_pasos:
  - $\operatorname{MCD}(14, 21) = 7 \neq 1$, por lo que se simplifica a 2/3.
- titulo: ¿Toda fracción propia con numerador 1 es automáticamente irreductible?
  respuesta: Sí
  solucion_pasos:
  - Sí, para cualquier $1/b$, el $\operatorname{MCD}(1, b) = 1$ siempre.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde con precisión a las reglas de equivalencia, simplificación o conversión analizadas.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el algoritmo matemático entrega un resultado único y bien definido.
  - texto: No es posible determinar la equivalencia
    es_correcta: false
    retroalimentacion: Incorrecto, los teoremas y algoritmos de fracciones permiten resolver unívocamente.
- titulo: ¿Es 10/25 una fracción irreductible?
  respuesta: 'No'
  solucion_pasos:
  - No, se puede simplificar entre 5 dando 2/5.
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Corresponde con precisión a las reglas de equivalencia, simplificación o conversión analizadas.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, el algoritmo matemático entrega un resultado único y bien definido.
  - texto: No es posible determinar la equivalencia
    es_correcta: false
    retroalimentacion: Incorrecto, los teoremas y algoritmos de fracciones permiten resolver unívocamente.
errores_frecuentes:
- Una fracción es irreductible solo cuando su numerador y su denominador son números primos.
- Las fracciones irreductibles se pueden seguir simplificando dividiendo por el número 2.
- Cualquier fracción impropia se clasifica automáticamente como fracción irreductible.
- La fracción $4/8$ es una fracción irreductible en los números racionales.
- Para verificar si es irreductible se deben sumar numerador y denominador.
afirmaciones_verdaderas:
- Una fracción $\frac{a}{b}$ es irreductible si y solo si $\operatorname{MCD}(|a|, |b|) = 1$.
- Cada número racional posee una única representación en forma de fracción irreductible canónica.
al_terminar_debes_poder: '**QUÉ:** Identificar y obtener la fracción irreductible como representante canónico de una clase de equivalencia.


  **CÓMO:** Verificando la condición de coprimalidad $\text{mcd}(|a|, |b|) = 1$ asegurando que no existen factores comunes mayores que 1 entre numerador y denominador.


  ![Resumen Identificación de fracción irreductible](/static/img/nodos/identificacion-de-fraccion-irreductible-resumen.svg)'
