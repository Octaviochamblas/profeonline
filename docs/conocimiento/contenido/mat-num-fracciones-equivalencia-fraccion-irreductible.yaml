semantic_id: MAT.NUM.FRACCIONES_EQUIVALENCIA.FRACCION_IRREDUCTIBLE
resumen_inicial: "Una fracción irreductible es aquella cuyos numerador y denominador son primos entre sí, por lo que no se puede simplificar más."
explicacion_simple: |
  Piensa en una fracción irreductible como la forma 'más limpia' o 'final' de escribir una fracción. Si tienes $\frac{12}{18}$ y la simplificas dividiendo por 6, llegas a $\frac{2}{3}$. Como los números 2 y 3 no tienen ningún divisor común aparte del 1, ya no puedes achicarlos más. La fracción $\frac{2}{3}$ es **irreductible**. En matemática, siempre preferimos dar las respuestas finales como fracciones irreductibles.
explicacion_formal: |
  Formalmente, una fracción $\frac{a}{b}$ con $a \in \mathbb{Z}$ y $b \in \mathbb{Z}^+$ se define como **fracción irreductible** si el Máximo Común Divisor entre su numerador y su denominador es igual a $1$:
  $$\gcd(a, b) = 1$$

  Esto implica que $a$ y $b$ son números **co-primos** o primos entre sí. Toda fracción racional representa a una única fracción irreductible canónica en su clase de equivalencia, donde no existe ningún entero $d > 1$ que divida simultáneamente a $a$ y a $b$.
definiciones_clave: |
  - **Fracción irreductible**: Fracción simplificada al máximo donde $\gcd(a, b) = 1$.
  - **Números co-primos (primos entre sí)**: Par de enteros cuyo único divisor común positivo es el $1$.
  - **Representante canónico**: La fracción irreductible como la forma estándar de escribir un número racional.
propiedades_relaciones: |
  - **Unicidad del representante**: Cada número racional positivo posee una única representación como fracción irreductible $\frac{a}{b}$ con $a, b \in \mathbb{Z}^+$ y $\gcd(a, b) = 1$.
  - **Numerador primo o denominador primo**: Si el numerador y el denominador son números primos distintos, la fracción es automáticamente irreductible.
  - **Unidades fraccionarias**: Toda unidad fraccionaria de la forma $\frac{1}{b}$ con $b \in \mathbb{Z}^+$ es siempre una fracción irreductible.
ejemplo_guiado:
  enunciado: "Determina si la fracción $\\frac{14}{25}$ es irreductible calculando el MCD de sus términos y explica la diferencia con $\\frac{14}{21}$."
  pasos:
    - 'Hallar los divisores de $14$: $\{1, 2, 7, 14\}$.'
    - 'Hallar los divisores de $25$: $\{1, 5, 25\}$.'
    - 'Calcular el MCD: el único divisor común es $1$, por lo que $\gcd(14, 25) = 1$.'
    - 'Concluir para $\frac{14}{25}$: como $14$ y $25$ son co-primos, $\frac{14}{25}$ es una fracción **irreductible**.'
    - 'Comparar con $\frac{14}{21}$: $\gcd(14, 21) = 7 > 1$, por lo que $\frac{14}{21}$ no es irreductible y se puede simplificar a $\frac{2}{3}$.'
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Qué condición matemática sobre el Máximo Común Divisor entre el numerador $a$ y el denominador $b$ define a una fracción irreductible?"
    choices:
      - {text: "El Máximo Común Divisor de $a$ y $b$ debe ser exactamente igual a 1 ($\\gcd(a, b) = 1$).", is_correct: true}
      - {text: "El Máximo Común Divisor de $a$ y $b$ debe ser mayor que el denominador.", is_correct: false}
      - {text: "El numerador $a$ debe ser siempre igual a 1.", is_correct: false}
      - {text: "Ambos números deben ser números pares obligatoriamente.", is_correct: false}
    explanation: "La correcta es El Máximo Común Divisor de $a$ y $b$ debe ser exactamente igual a 1 ($\\gcd(a, b) = 1$).: los números co-primos no poseen divisores comunes mayores que 1."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "¿Cuál de las siguientes fracciones se encuentra ya en su forma irreductible?"
    choices:
      - {text: "\\frac{8}{15}", is_correct: true}
      - {text: "\\frac{8}{16}", is_correct: false}
      - {text: "\\frac{9}{15}", is_correct: false}
      - {text: "\\frac{12}{18}", is_correct: false}
    explanation: "La correcta es \\frac{8}{15}: los divisores de 8 son {1,2,4,8} y de 15 son {1,3,5,15}; su único divisor común es 1."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - "Paso 1: Identificar el numerador $a$ y el denominador $b$ de la fracción."
  - 'Paso 2: Calcular el Máximo Común Divisor de $a$ y $b$: $\gcd(a, b)$.'
  - 'Paso 3: Si $\gcd(a, b) = 1$, declarar que la fracción es irreductible.'
  - 'Paso 4: Si $\gcd(a, b) > 1$, dividir ambos términos entre el MCD para obtener la versión irreductible.'
errores_correccion: |
  Un error común es asumir que para ser irreductible tanto el numerador como el denominador deben ser números primos. No es necesario que sean primos individualmente; basta con que sean **primos entre sí** (co-primos), como $\frac{8}{9}$ (ni 8 ni 9 son primos, pero $\frac{8}{9}$ es irreductible).
ejemplos:
  - titulo: "Ejemplo 1"
    enunciado: "¿Por qué la fracción $\\frac{9}{10}$ es una fracción irreductible a pesar de que ni 9 ni 10 son números primos?"
    alternativas:
      - "Porque 9 y 10 no tienen divisores comunes mayores que 1 (son co-primos)."
      - "Porque el 9 es un número impar."
      - "Porque el 10 es un número par."
    respuesta: "Porque 9 y 10 no tienen divisores comunes mayores que 1 (son co-primos)."
    solucion_pasos:
      - "Divisores de 9: {1, 3, 9}. Divisores de 10: {1, 2, 5, 10}."
      - "El único divisor en común es 1, lo que hace que $\\gcd(9, 10) = 1$."
  - titulo: "Ejemplo 2"
    enunciado: "Encuentra la fracción irreductible equivalente a $\\frac{42}{70}$."
    alternativas:
      - "\\frac{3}{5}"
      - "\\frac{6}{10}"
      - "\\frac{21}{35}"
    respuesta: "\\frac{3}{5}"
    solucion_pasos:
      - "Calculamos $\\gcd(42, 70) = 14$."
      - "Dividimos numerador y denominador por 14: $\\frac{42 \\div 14}{70 \\div 14} = \\frac{3}{5}$."
      - "Como $\\gcd(3, 5) = 1$, $\\frac{3}{5}$ es la versión irreductible."
  - titulo: "¿Toda unidad fraccionaria $\\frac{1}{b}$ ($b > 0$) es una fracción irreductible?"
    respuesta: "Sí"
    solucion_pasos:
      - "Sí, el 1 solo tiene como divisor al 1, por lo que $\\gcd(1, b) = 1$ para cualquier $b$."
  - titulo: "¿Se puede simplificar aún más una fracción irreductible utilizando números enteros?"
    respuesta: "No"
    solucion_pasos:
      - "No, por definición no existen divisores enteros comunes mayores que 1 para reducir sus términos."
errores_frecuentes:
  - "Creer que los términos de una fracción irreductible deben ser números primos individuales."
  - "Confundir fracción irreductible con número primo."
  - "Asumir que si los dos números son impares la fracción es automáticamente irreductible (ejemplo: $\\frac{9}{15}$ es reductible)."
  - "Detener la simplificación en una fracción equivalente que todavía no es irreductible."
  - "Pensar que una fracción con numerador 1 no se considera irreductible."
afirmaciones_verdaderas:
  - "Una fracción es irreductible cuando su numerador y denominador son números co-primos, es decir, $\\gcd(a, b) = 1$."
  - "Cada número racional tiene una representación única como fracción irreductible canónica."
al_terminar_debes_ponder: |
  Debes ser capaz de verificar si una fracción dada es irreductible y llevar cualquier fracción a su forma irreductible canónica.
fuente: "Texto escolar MINEDUC — Matemática 7° Básico, unidad de fracciones y números racionales."
