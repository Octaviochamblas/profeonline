- titulo: ¿Se cumple siempre la propiedad principal de simetría axial respecto del
    eje y en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
