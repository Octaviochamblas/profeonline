semantic_id: MAT.GEO.SIMETRIAS.AXIAL_EJE_Y
resumen_inicial: 'Simetría axial respecto del eje y: conceptos, teoremas, propiedades
  geométricas y cálculo en Transformaciones Isométricas.'
explicacion_simple: Reflejar un punto respecto del eje Y es como 'voltear' su posición
  horizontal, manteniendo igual la posición vertical.
explicacion_formal: '![Simetría axial respecto del eje Y](/static/img/geometria/isometrias/simetria-axial-eje-y.svg)


  ### Definición formal


  Si el eje Y es la recta de simetría, cada punto $P(x,y)$ se transforma en $P''(-x,y)$:
  la coordenada $y$ permanece igual, y la coordenada $x$ cambia de signo.


  ### Desarrollo didáctico


  En la figura, el punto $P(3,3)$ tiene como imagen respecto del eje Y el punto $P''(-3,3)$:
  la ordenada se mantiene igual, y la abscisa se invierte.'
