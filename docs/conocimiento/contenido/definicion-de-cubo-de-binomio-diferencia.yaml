procedimiento:
- 'Paso 1: Para entender la definición:'
- 'Paso 2: Reconoce que $(A-B)^3$ significa un factor $(A-B)$ repetido 3 veces.'
- 'Paso 3: El desarrollo produce $4$ términos con signos que se alternan: $+ - + -$.'
- Definición básica de potencia.
errores_correccion: Evita el error $(a+b)^2 = a^2 + b^2$; recuerda incluir siempre
  el doble producto $2ab$ en definición de cubo de binomio diferencia.
ejemplos:
- titulo: Expansión conceptual
  enunciado: Expresa conceptualmente qué significa $(2x - 3)^3$.
  solucion_pasos:
  - Significa $(2x - 3)(2x - 3)(2x - 3)$.
- titulo: Qué indica el exponente $3$ en la expresión $(x-y)^3$
  enunciado: '¿Qué indica el exponente $3$ en la expresión $(x-y)^3$?


    Opciones: A) Que el binomio $(x-y)$ se multiplica por sí mismo tres veces. · B)
    Que cada término debe elevarse al cubo por separado. · C) Que el resultado tendrá
    siempre 3 términos. · D) Que es el triple del binomio.'
  solucion_pasos:
  - Definición básica de potencia.
  - 'Respuesta: Que el binomio $(x-y)$ se multiplica por sí mismo tres veces.'
- titulo: 'Respecto de «Definición de cubo de binomio diferencia»: ¿La siguiente formulación
    es correct'
  enunciado: 'Respecto de «Definición de cubo de binomio diferencia»: ¿La siguiente
    formulación es correcta? «El cubo de un binomio diferencia se define como la multiplicación
    del binomio por sí mismo tres veces: $(a-b)^3 = (a-b)(a-b)(a-b)$»'
  respuesta: Sí
  solucion_pasos:
  - 'La afirmación coincide con la definición formal: El cubo de un binomio diferencia
    se define como la multiplicación del binomio por sí mismo tres veces: $(a-b)^3
    = (a-b)(a-b)(a-b)$.'
- titulo: 'Respecto de «Definición de cubo de binomio diferencia»: ¿La siguiente conclusión
    es correcta'
  enunciado: 'Respecto de «Definición de cubo de binomio diferencia»: ¿La siguiente
    conclusión es correcta? «Pensar que $(a-b)^3 = a^3 - b^3$»'
  respuesta: 'No'
  solucion_pasos:
  - 'La afirmación es falsa. El criterio correcto es: El cubo de un binomio diferencia
    se define como la multiplicación del binomio por sí mismo tres veces: $(a-b)^3
    = (a-b)(a-b)(a-b)$.'
errores_frecuentes:
- Pensar que $(a-b)^3 = a^3 - b^3$.
- Que cada término debe elevarse al cubo por separado.
- Que el resultado tendrá siempre 3 términos.
- Para «¿Qué indica el exponente $3$ en la expresión $(x-y)^3$», la respuesta correcta
  es Que es el triple del binomio.
- La afirmación «Que el binomio $(x-y)$ se multiplica por sí mismo tres veces» no
  es válida en este contenido.
afirmaciones_verdaderas:
- Los productos notables permiten obtener desarrollos algebraicos sin multiplicar
  término a término.
al_terminar_debes_poder: Reconocer y expandir expresiones utilizando definición de
