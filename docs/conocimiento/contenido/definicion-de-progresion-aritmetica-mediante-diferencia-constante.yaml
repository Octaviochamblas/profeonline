semantic_id: MAT.NUM.PROG_ARITMETICA.DEFINICION
resumen_inicial: 'Una progresión aritmética (P.A.) es una sucesión numérica en la que cada término, a partir del segundo, se obtiene sumando al anterior una constante fija denominada diferencia común $d$: $a_n = a_{n-1} + d$.'
explicacion_simple: |
  Una **progresión aritmética** es una secuencia de números donde el salto o paso entre un número y el siguiente **siempre es exactamente la misma cantidad**:
  - Si empiezas en $5$ y sumas $3$ cada vez: $5, 8, 11, 14, 17, \dots$
  - Esa cantidad fija ($+3$) se llama **diferencia común ($d$)**.
  - Si la diferencia es positiva ($d > 0$), la sucesión es creciente.
  - Si la diferencia es negativa ($d < 0$), por ejemplo restar $4$: $20, 16, 12, 8, \dots$, la sucesión es decreciente.
explicacion_formal: |
  ### Definición formal
  Una sucesión de números reales $(a_n)_{n \ge 1}$ es una **progresión aritmética** si existe un número real constante $d \in \mathbb{R}$ tal que:
  $$a_n - a_{n-1} = d \quad (\forall n \ge 2)$$
  o equivalentemente mediante la relación por recurrencia de primer orden:
  $$a_n = a_{n-1} + d$$

  ### Clasificación según el signo de la diferencia común ($d$)
  - **Progresión Aritmética Creciente**: $d > 0 \implies a_1 < a_2 < a_3 < \dots < a_n$.
  - **Progresión Aritmética Decreciente**: $d < 0 \implies a_1 > a_2 > a_3 > \dots > a_n$.
  - **Progresión Aritmética Constante o Trivial**: $d = 0 \implies a_1 = a_2 = a_3 = \dots = a_n$.

  ### Síntesis didáctica
  - Ecuación recurrente básica: $a_n = a_{n-1} + d$.
  - Condición suficiente: La resta entre dos términos consecutivos cualesquiera debe arrojar siempre la constante $d$.
definiciones_clave: |
  - **Progresión Aritmética (P.A.)**: Sucesión numérica construida mediante la adición sucesiva de un valor constante.
  - **Diferencia común ($d$)**: Constante aditiva fija definida por $d = a_{n+1} - a_n$.
  - **Primer término ($a_1$)**: Valor inicial que establece el origen numérico de la progresión.
propiedades_relaciones: |
  - **Modelo aditivo constante**: A diferencia de las sucesiones geométricas (que se multiplican), la progresión aritmética avanza únicamente por adición o sustracción de una constante.
  - **Crecimiento de pendiente fija**: Al graficar los puntos $(n, a_n)$ en el plano cartesiano, se alinean sobre una recta de pendiente $m = d$.
ejemplo_guiado:
  enunciado: 'Verifica si la sucesión $7, 12, 17, 22, 27, \dots$ es una progresión aritmética, identifica su primer término $a_1$ y el valor de la diferencia común $d$.'
  pasos:
    - 'Paso 1: Identificamos el primer término de la secuencia: $a_1 = 7$.'
    - 'Paso 2: Restamos el segundo término menos el primero: $12 - 7 = 5$.'
    - 'Paso 3: Restamos el tercer término menos el segundo: $17 - 12 = 5$, y el cuarto menos el tercero: $22 - 17 = 5$.'
    - 'Paso 4: Como la diferencia entre términos consecutivos es constante e igual a $5$, la sucesión **es una progresión aritmética con $a_1 = 7$ y $d = 5$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Qué condición debe cumplirse para que una sucesión numérica se clasifique como progresión aritmética?'
    choices:
      - {text: 'La diferencia entre cualquier término y su antecesor inmediato debe ser siempre una constante fija $d$', is_correct: true}
      - {text: 'El cociente entre términos consecutivos debe ser una constante multiplicativa', is_correct: false}
      - {text: 'Todos los términos deben ser números primos positivos', is_correct: false}
      - {text: 'Cada término debe ser el cuadrado perfecto del término anterior', is_correct: false}
    explanation: 'La alternativa correcta es ''La diferencia entre cualquier término y su antecesor inmediato debe ser siempre una constante fija $d$''. Es la definición formal de P.A.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Dada la sucesión $15, 11, 7, 3, -1, \dots$, ¿cuál es el valor del primer término $a_1$ y de la diferencia común $d$?'
    choices:
      - {text: 'Primer término $a_1 = 15$ y diferencia común $d = -4$', is_correct: true}
      - {text: 'Primer término $a_1 = 15$ y diferencia común $d = +4$', is_correct: false}
      - {text: 'Primer término $a_1 = -1$ y diferencia común $d = 4$', is_correct: false}
      - {text: 'Primer término $a_1 = 11$ y diferencia común $d = -15$', is_correct: false}
    explanation: 'La alternativa correcta es ''Primer término $a_1 = 15$ y diferencia común $d = -4$''. $a_1 = 15$ y $11 - 15 = -4$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el valor del primer elemento de la secuencia como $a_1$.'
  - 'Paso 2: Restar cada término menos el término inmediatamente anterior ($a_2 - a_1, a_3 - a_2, a_4 - a_3$).'
  - 'Paso 3: Verificar que los resultados de las restas arrojen el mismo valor numérico constante $d$.'
  - 'Paso 4: Concluir que es una P.A. de diferencia $d$ e indicar si es creciente ($d>0$) o decreciente ($d<0$).'
errores_correccion: |
  - **Error 1:** Restar al revés al calcular la diferencia (hacer $a_1 - a_2$ en lugar de $a_2 - a_1$). **Cómo corregirlo:** La diferencia siempre se calcula restando el **término posterior menos el anterior: $d = a_{n+1} - a_n$**.
  - **Error 2:** Creer que una progresión con números negativos no puede ser aritmética. **Cómo corregirlo:** La diferencia $d$ puede ser **positiva, negativa o cero**, perteneciendo a cualquier número real $\mathbb{R}$.
ejemplos:
  - titulo: 'P.A. creciente simple'
    enunciado: 'Para la sucesión $3, 7, 11, 15, \dots$, ¿el primer término es $a_1 = 3$ y la diferencia $d = 4$?'
    alternativas:
      - 'Sí, pues $7 - 3 = 4$ y $11 - 7 = 4$'
      - 'No, la diferencia es 3'
      - 'No, el primer término es 4'
    respuesta: 'Sí, pues $7 - 3 = 4$ y $11 - 7 = 4$'
    solucion_pasos:
      - '1. Primer término: $a_1 = 3$.'
      - '2. Diferencia: $7 - 3 = 4$.'
  - titulo: 'P.A. decreciente'
    enunciado: 'Para $10, 6, 2, -2, -6, \dots$, ¿la diferencia es $d = -4$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $6 - 10 = -4$, $2 - 6 = -4$. Es una P.A. decreciente.'
  - titulo: 'P.A. con números fraccionarios'
    enunciado: 'Para $\frac{1}{2}, 1, \frac{3}{2}, 2, \dots$, ¿la diferencia es $d = \frac{1}{2}$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $1 - 1/2 = 1/2$.'
  - titulo: 'P.A. constante'
    enunciado: 'Para la sucesión $8, 8, 8, 8, \dots$, ¿es una P.A. de diferencia $d = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí. $8 - 8 = 0$. Es una progresión constante.'
errores_frecuentes:
  - 'Restar el término anterior menos el posterior al calcular la diferencia común $d$.'
  - 'Una progresión con diferencia negativa es siempre inválida para el cálculo de índices.'
  - 'La posición ordinal $n$ y el valor numérico del término $a_n$ son numéricamente idénticos en la ecuación.'
  - 'Considerar que las progresiones aritméticas se construyen mediante multiplicación constante.'
  - 'Evaluar únicamente la diferencia del primer par de términos para declarar que toda la sucesión es aritmética.'
afirmaciones_verdaderas:
  - 'En una progresión aritmética, la diferencia $d = a_{n+1} - a_n$ permanece constante para todo $n \ge 1$.'
  - 'Si la diferencia común es positiva ($d > 0$), la progresión aritmética es estrictamente creciente.'
al_terminar_debes_poder: 'Definir una progresión aritmética $a_n = a_{n-1} + d$ e identificar su primer término $a_1$ y diferencia común $d$.'
fuente: 'Currículum Nacional MINEDUC y elaboración pedagógica ProfeOnline.'
estado: publicado
