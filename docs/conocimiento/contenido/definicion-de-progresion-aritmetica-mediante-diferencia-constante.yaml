semantic_id: MAT.NUM.PROG_ARITMETICA.DEFINICION
resumen_inicial: 'Definición de progresión aritmética mediante diferencia constante: concepto
  y desarrollo dentro de Progresión aritmética.'
explicacion_simple: 'Imagina una escalera donde todos los peldaños miden exactamente lo mismo.
  Subes a un ritmo perfectamente constante. En matemáticas, esa escalera tan predecible y
  ordenada tiene nombre y apellido: Progresión Aritmética.'
explicacion_formal: "De todas las sucesiones numéricas posibles, la **Progresión Aritmética**\
  \ es la más sencilla de todas. Corresponde a crecimientos lineales.\n\n- **La Prueba de\
  \ Ácido:** Para saber si una sucesión es aritmética, debes restar cualquier número con su\
  \ vecino anterior (Ej: $a_2 - a_1$). Si repites esto en toda la lista y **siempre te da\
  \ el mismo resultado**, ¡es una P.A.!\n- **La Diferencia ($d$):** Ese número constante que\
  \ siempre se suma o se resta. \n  - Si $d > 0$, la progresión es *Creciente* (Ej: $2, 5,\
  \ 8, 11\\dots$ aquí $d=3$).\n  - Si $d < 0$, la progresión es *Decreciente* (Ej: $20, 15,\
  \ 10, 5\\dots$ aquí $d=-5$).\n  - Si $d = 0$, la progresión es *Constante* (Ej: $7, 7, 7,\
  \ 7\\dots$)."
definiciones_clave: '- **Definición de progresión aritmética mediante diferencia constante**:
  Concepto fundamental dentro del estudio de Progresión aritmética.'
propiedades_relaciones: '- **Propiedades de Definición de progresión aritmética mediante diferencia
  constante**: Relaciones de cambio y fórmulas estructurales de progresión aritmética.'
ejemplo_guiado:
  enunciado: Verifica si la secuencia 6, 11, 16, 21 es una progresión aritmética y, si lo
    es, indica su diferencia.
  pasos:
  - 'Resto el segundo término menos el primero: 11 menos 6 es igual a 5.'
  - 'Resto el tercer término menos el segundo: 16 menos 11 es igual a 5. Resto el cuarto menos
    el tercero: 21 menos 16 también es igual a 5.'
  - Como las tres restas dan el mismo resultado, sí es una progresión aritmética con diferencia
    d igual a 5.
