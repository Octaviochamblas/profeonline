resumen_inicial: 'Una progresión aritmética (P.A.) es una sucesión numérica en la
  que cada término se obtiene sumando una cantidad constante fija $d$ (llamada diferencia
  común) al término inmediatamente anterior: $a_{n} = a_{n-1} + d$.'
explicacion_simple: Una progresión aritmética es como dar pasos de igual tamaño en
  una recta numérica. Empiezas en un número inicial y para avanzar al siguiente número
  siempre sumas o restas la misma cantidad fija.
explicacion_formal: 'Una sucesión $(a_n)_{n \in \mathbb{N}^+}$ es una **Progresión
  Aritmética (P.A.)** si y solo si la diferencia entre cualquier término y su antecedente
  es constante para todo $n \ge 1$:


  $$a_{n+1} - a_n = d = cst \quad \forall n \in \mathbb{N}^+$$


  **Clasificación según la diferencia $d$:**

  - Creciente: $d > 0$.

  - Decreciente: $d < 0$.

  - Constante: $d = 0$.'
definiciones_clave: '- **Progresión aritmética**: Sucesión con diferencia constante
  $a_{n+1} - a_n = d$.'
propiedades_relaciones: '- **Diferencia constante $d$**: Invariante aditiva entre
  dos términos consecutivos.'
ejemplo_guiado:
  enunciado: Verifique si la sucesión $(7, 11, 15, 19, 23)$ es una progresión aritmética
    e identifique $d$.
  pasos:
  - 'Paso 1: Calcular $a_2 - a_1 = 11 - 7 = 4$.'
  - 'Paso 2: Calcular $a_3 - a_2 = 15 - 11 = 4$.'
  - 'Paso 3: Calcular $a_4 - a_3 = 19 - 15 = 4$.'
  - 'Conclusión: Como todas las diferencias son igual a $4$, es una P.A. con diferencia
    $d=4$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué condición debe cumplirse entre términos consecutivos para que una
    sucesión sea una progresión aritmética?
  choices:
  - text: La diferencia entre cualquier término y su anterior (an+1 - an) debe ser
      una constante fija d
    is_correct: true
  - text: El cociente entre términos debe ser constante
    is_correct: false
  - text: La suma de los términos debe dar cien
    is_correct: false
  - text: Los términos deben multiplicarse por dos
    is_correct: false
  explanation: La alternativa correcta es 'La diferencia entre cualquier término y
    su anterior (an+1 - an) debe ser una constante fija d'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para (7, 11, 15, 19, 23), ¿cuál fue la diferencia
    común d obtenida?
  choices:
  - text: d = 4
    is_correct: true
  - text: d = 7
    is_correct: false
  - text: d = 11
    is_correct: false
  - text: d = 3
    is_correct: false
  explanation: La alternativa correcta es 'd = 4'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de definir una progresión aritmética
  comprobando que la diferencia consecutiva $a_{n+1} - a_n = d$ permanezca constante.
semantic_id: MAT.NUM.PROG_ARITMETICA.DEFINICION
procedimiento:
- 'Paso 1: Verificar que la secuencia mantenga una diferencia aditiva constante $d
  = a_{n+1} - a_n$.'
- 'Paso 2: Aplicar la fórmula del término general $a_n = a_1 + (n - 1)d$ o de la suma
  $S_n = \frac{n(a_1 + a_n)}{2}$.'
- 'Paso 3: Resolver numéricamente el parámetro solicitado ($a_n, a_1, d, n$ o $S_n$).'
errores_correccion: '- **Error 1: Multiplicar la diferencia por $n$ en lugar de $(n-1)$
  en la fórmula del término general ($a_n = a_1 + n \cdot d$).** **Cómo corregirlo:**
  La diferencia $d$ se aplica a partir de la segunda posición, por lo que se multiplica
  por $(n-1)$.


  - **Error 2: Restar los términos en orden inverso al hallar la diferencia ($d =
  a_n - a_{n+1}$).** **Cómo corregirlo:** La diferencia DEBE calcularse restando el
  término posterior menos el anterior ($a_{n+1} - a_n$).'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.PROG_ARITMETICA.DEFINICION.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de las fórmulas de progresión aritmética.
- titulo: Ejemplo 2
  enunciado: Verificación de la diferencia constante.
  alternativas:
  - Cumple la constante
  - No cumple
  - Indeterminado
  respuesta: Cumple la constante
  solucion_pasos:
  - Demostración formal por $a_{n+1} - a_n = d$.
- titulo: ¿Es constante la diferencia entre términos consecutivos en una P.A.?
  respuesta: Sí
  solucion_pasos:
  - Sí, por definición de progresión aritmética.
- titulo: ¿Equivale la suma Sn al promedio de extremos multiplicado por el número
    de términos?
  respuesta: Sí
  solucion_pasos:
  - Sí, $S_n = \frac{n(a_1 + a_n)}{2}$.
errores_frecuentes:
- Multiplicar la diferencia común d por n en lugar de multiplicar por (n - 1) al calcular
  an.
- Restar el término posterior del término anterior al calcular el valor de la diferencia
  d.
- Sumar directamente los términos de los extremos sin dividir entre dos al calcular
  Sn.
- Declarar que una progresión con diferencia negativa es siempre invalida para el
  cálculo de índices.
- Declarar la posición ordinal n con el valor numérico del término an en la ecuación.
afirmaciones_verdaderas:
- Una progresión aritmética tiene una diferencia constante $d = a_{n+1} - a_n$ entre
  términos consecutivos.
- El término de cualquier posición $n$ se calcula mediante $a_n = a_1 + (n - 1) \cdot
  d$.
fuente: Texto escolar MINEDUC — Álgebra 1° Medio / PAES.
