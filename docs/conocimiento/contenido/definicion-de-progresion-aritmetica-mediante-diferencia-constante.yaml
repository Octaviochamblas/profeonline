semantic_id: MAT.NUM.PROG_ARITMETICA.DEFINICION
resumen_inicial: 'Una progresión aritmética (PA) es una sucesión de números reales donde la diferencia entre cualquier término y su predecesor es constante: $a_{n+1} - a_n = d$.'
explicacion_simple: |
  Una **progresión aritmética** es una secuencia donde siempre das "pasos" del mismo tamaño sumando (o restando) un número fijo llamado **diferencia común** ($d$):
  - Si empiezas en $2$ y sumas $3$ en cada paso:
    $$2, 5, 8, 11, 14, 17, \dots \quad (d = +3, \text{creciente})$$
  - Si empiezas en $20$ y restas $4$ en cada paso:
    $$20, 16, 12, 8, 4, 0, \dots \quad (d = -4, \text{decreciente})$$
  - La clave es que el cambio entre término y término es **siempre constante**.

  ![Definición de progresión aritmética](/static/img/nodos/definicion-de-progresion-aritmetica-mediante-diferencia-constante-intro.svg)
explicacion_formal: |
  ### Definición formal
  Una sucesión $(a_n)_{n \in \mathbb{N}}$ es una **progresión aritmética (PA)** si y solo si existe una constante real $d \in \mathbb{R}$, denominada **diferencia común**, tal que:
  $$a_{n+1} = a_n + d \quad \forall n \ge 1 \iff a_{n+1} - a_n = d$$

  ### Clasificación según la Diferencia Común ($d$)
  - **PA estrictamente creciente**: $d > 0 \implies a_1 < a_2 < a_3 < \dots$
  - **PA constante**: $d = 0 \implies a_1 = a_2 = a_3 = \dots$
  - **PA estrictamente decreciente**: $d < 0 \implies a_1 > a_2 > a_3 > \dots$

  ### Término General
  A partir de la definición inductiva, el término general explícito de la progresión es:
  $$a_n = a_1 + (n - 1)d = d \cdot n + (a_1 - d)$$

  ### Síntesis didáctica
  - Ecuación de recurrencia: $a_{n+1} = a_n + d$.
  - Comportamiento: Modelo de crecimiento o decrecimiento lineal discreto.
definiciones_clave: |
  - **Progresión Aritmética (PA)**: Sucesión donde cada término se obtiene sumando una constante $d$ al término anterior.
  - **Diferencia común ($d$)**: Constante aditiva que representa la resta entre dos términos consecutivos ($a_{n+1} - a_n$).
  - **Primer término ($a_1$)**: Valor inicial que ancla la progresión en $n=1$.
propiedades_relaciones: |
  - **Isomorfismo con la función lineal**: Una PA es la restricción a $\mathbb{N}$ de una función afín $f(x) = dx + c$, donde la pendiente es exactamente la diferencia común $d$.
  - **Equidistancia de términos**: Para cualquier trío consecutivo, el término central es la media aritmética de los extremos: $a_k = \frac{a_{k-1} + a_{k+1}}{2}$.
ejemplo_guiado:
  enunciado: 'Dada la progresión aritmética con primer término $a_1 = 7$ y diferencia común $d = 4$, escribe los primeros cinco términos y determina si es creciente o decreciente.'
  imagen: '/static/img/nodos/definicion-de-progresion-aritmetica-mediante-diferencia-constante-ejemplos.svg'
  pasos:
    - 'Paso 1: Identificamos el término inicial: $a_1 = 7$.'
    - 'Paso 2: Sumamos la diferencia $d = 4$ sucesivamente:'
    - '  - $a_2 = 7 + 4 = 11$'
    - '  - $a_3 = 11 + 4 = 15$'
    - '  - $a_4 = 15 + 4 = 19$'
    - '  - $a_5 = 19 + 4 = 23$'
    - 'Paso 3: Como $d = 4 > 0$, la progresión es **estrictamente creciente**.'
    - 'Conclusión: Los cinco primeros términos son **$7, 11, 15, 19, 23$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es la condición necesaria y suficiente para que una sucesión sea una progresión aritmética?'
    choices:
      - {text: 'Que la diferencia entre cualquier término y su predecesor sea constante ($a_{n+1} - a_n = d$)', is_correct: true}
      - {text: 'Que el cociente entre términos consecutivos sea constante ($a_{n+1} / a_n = r$)', is_correct: false}
      - {text: 'Que todos los términos sean números primos', is_correct: false}
      - {text: 'Que la suma de los términos sea igual a cero', is_correct: false}
    explanation: 'La alternativa correcta es ''Que la diferencia entre cualquier término y su predecesor sea constante ($a_{n+1} - a_n = d$)''. Es la propiedad definitoria de las progresiones aritméticas.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si una progresión aritmética tiene $a_1 = 15$ y diferencia $d = -3$, ¿cuál es el valor de $a_3$?'
    choices:
      - {text: '$9$, calculando $a_2 = 12$ y $a_3 = 9$', is_correct: true}
      - {text: '$21$, sumando 3 en lugar de restar', is_correct: false}
      - {text: '$12$, calculando solo el segundo término', is_correct: false}
      - {text: '$6$, restando 3 tres veces', is_correct: false}
    explanation: 'La alternativa correcta es ''$9$, calculando $a_2 = 12$ y $a_3 = 9$''. Partiendo de 15: $15 - 3 = 12$, luego $12 - 3 = 9$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Identificar el primer término $a_1$ y el valor de la diferencia común $d$.'
  - 'Paso 2: Sumar la diferencia $d$ al término anterior para obtener cada nuevo término ($a_{n+1} = a_n + d$).'
  - 'Paso 3: Analizar el signo de $d$ para clasificar la progresión como creciente ($d > 0$), decreciente ($d < 0$) o constante ($d = 0$).'
errores_correccion: |
  - **Error 1:** Confundir la progresión aritmética con una progresión geométrica (multiplicar en vez de sumar). **Cómo corregirlo:** En la PA **se suma una cantidad constante $d$**, no se multiplica.
  - **Error 2:** Restar en orden invertido al verificar la diferencia ($a_n - a_{n+1}$). **Cómo corregirlo:** La diferencia es siempre **término posterior menos término anterior**: $d = a_{n+1} - a_n$.
ejemplos:
  - titulo: 'PA con diferencia positiva'
    enunciado: 'Para $a_1 = 3$ y $d = 5$, ¿cuáles son los tres primeros términos?'
    alternativas:
      - '$3, 8, 13$'
      - '$3, 15, 75$'
      - '$3, 6, 9$'
    respuesta: '$3, 8, 13$'
    solucion_pasos:
      - '1. $a_1 = 3, a_2 = 3 + 5 = 8, a_3 = 8 + 5 = 13$.'
  - titulo: 'PA decreciente'
    enunciado: 'Para $a_1 = 10$ y $d = -2$, ¿cuál es el cuarto término $a_4$?'
    alternativas:
      - '$4$'
      - '$2$'
      - '$6$'
    respuesta: '$4$'
    solucion_pasos:
      - '1. $a_1 = 10, a_2 = 8, a_3 = 6, a_4 = 4$.'
  - titulo: 'Monotonía de la PA'
    enunciado: '¿Una progresión aritmética con diferencia $d = -5$ es estrictamente decreciente?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Toda PA con $d < 0$ es estrictamente decreciente.'
  - titulo: 'Diferencia nula'
    enunciado: '¿La sucesión constante $8, 8, 8, 8, \dots$ es una progresión aritmética con $d = 0$?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. $8 - 8 = 0$ en todos los pasos.'
errores_frecuentes:
  - 'En una progresión aritmética cada término se obtiene multiplicando el término anterior por una constante fija.'
  - 'La diferencia común $d$ de una PA se calcula restando el primer término al término general sin importar la posición.'
  - 'Una progresión aritmética con diferencia común negativa genera términos estrictamente crecientes.'
  - 'El valor de la diferencia común $d$ debe ser obligatoriamente un número entero positivo.'
  - 'Una sucesión constante no constituye una progresión aritmética.'
afirmaciones_verdaderas:
  - 'En una progresión aritmética la diferencia entre cualquier término y su predecesor inmediato es constante ($a_{n+1} - a_n = d$).'
  - 'Una progresión aritmética es estrictamente creciente si y solo si su diferencia común es estrictamente positiva ($d > 0$).'
al_terminar_debes_poder: |
  ![Resumen visual](/static/img/nodos/definicion-de-progresion-aritmetica-mediante-diferencia-constante-resumen.svg)

  QUÉ: Definir, clasificar y construir progresiones aritméticas mediante el uso de la diferencia común.
  CÓMO: Aplicar la relación de recurrencia aditiva $a_{n+1} = a_n + d$ evaluando la monotonía según el signo de $d \in \mathbb{R}$.
