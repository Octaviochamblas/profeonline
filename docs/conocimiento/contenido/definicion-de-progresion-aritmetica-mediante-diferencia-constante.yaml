procedimiento:
- 'Paso 1: Toma el segundo término y réstale el primero ($a_2 - a_1$). Anota el resultado.'
- 'Paso 2: Toma el tercer término y réstale el segundo ($a_3 - a_2$). Anota el resultado.'
- 'Paso 3: Si ambos resultados son idénticos, es altamente probable que sea una Progresión
  Aritmética de diferencia ''d'' igual a tu resultado.'
errores_correccion: Evita confundir la posición del término $n$ con el valor del término $a_n$
  en definición de progresión aritmética mediante diferencia constante.
ejemplos:
- titulo: Comprobando la escalera
  enunciado: ¿Es la secuencia 10, 14, 18, 22 una progresión aritmética? Si es así, ¿cuál es
    su diferencia 'd'?
  solucion_pasos:
  - 'Restamos: $14 - 10 = 4$.'
  - 'Restamos: $18 - 14 = 4$.'
  - 'Restamos: $22 - 18 = 4$.'
  - La resta siempre da lo mismo. Sí es una P.A. y su diferencia es $d = 4$.
- titulo: Ejemplo 1
  enunciado: ¿Cuál es la diferencia d de la progresión aritmética 30, 24, 18, 12?
  alternativas:
  - '-6'
  - '6'
  - '-4'
  respuesta: '-6'
  solucion_pasos:
  - 24 menos 30 es igual a -6, y esa misma resta se repite entre los siguientes términos.
- titulo: Ejemplo 2
  enunciado: ¿Cuál de las siguientes sucesiones es una progresión aritmética?
  alternativas:
  - 3, 6, 9, 12
  - 2, 4, 8, 16
  - 1, 4, 9, 16
  respuesta: 3, 6, 9, 12
  solucion_pasos:
  - Solo en esta la diferencia entre términos consecutivos es siempre 3.
- titulo: ¿La sucesión 7, 7, 7, 7 es una progresión aritmética con diferencia 0?
  respuesta: Sí
  solucion_pasos:
  - Una diferencia constante igual a 0 también corresponde a una progresión aritmética, en
    este caso constante.
- titulo: ¿La sucesión 2, 4, 8, 16 es una progresión aritmética?
  respuesta: 'No'
  solucion_pasos:
  - Las diferencias son 2, 4 y 8; no son constantes. Esta es una progresión geométrica.
errores_frecuentes:
- Restar al revés (restar el primer término menos el segundo), lo cual da un signo equivocado
  a la diferencia 'd'. ¡Siempre es el de la derecha menos el de la izquierda!
- Creer que la sucesión $2, 4, 8, 16$ es aritmética (¡No lo es! $4-2=2$, pero $8-4=4$. Esa
  es geométrica).
- Pensar que una progresión aritmética siempre debe ser creciente.
- Creer que la diferencia d se calcula dividiendo un término por el anterior, en vez de restando.
- Confundir una progresión aritmética con una geométrica cuando los números crecen rápido.
afirmaciones_verdaderas:
- La formulación de definición de progresión aritmética mediante diferencia constante mantiene
  la regularidad de la sucesión.
- En una progresión aritmética decreciente, la diferencia d es un número negativo.
al_terminar_debes_poder: Resolver problemas prácticos utilizando definición de progresión
  aritmética mediante diferencia constante.
