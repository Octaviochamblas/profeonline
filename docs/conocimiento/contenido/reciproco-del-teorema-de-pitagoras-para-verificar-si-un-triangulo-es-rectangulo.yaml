semantic_id: MAT.GEO.PITAGORAS.RECIPROCO
resumen_inicial: 'El recíproco del teorema de Pitágoras afirma que si en un triángulo con lado mayor $c$ se cumple $c^2 = a^2 + b^2$, entonces el triángulo es estrictamente rectángulo en el vértice opuesto a $c$.'
explicacion_simple: |
  ![Recíproco de Pitágoras](/static/img/nodos/reciproco-del-teorema-de-pitagoras-para-verificar-si-un-triangulo-es-rectangulo-intro.svg)

  El recíproco de Pitágoras sirve como un "detector de ángulos rectos":

  - **Tomas el lado más largo**: Lo llamas $c$ y lo elevas al cuadrado ($c^2$).
  - **Tomas los dos lados chicos**: Los elevas al cuadrado y los sumas ($a^2 + b^2$).
  - **Comparas**:
    - Si son **iguales** ($c^2 = a^2 + b^2$): Es un **triángulo rectángulo** ($90^\circ$).
    - Si $c^2$ es **menor** ($c^2 < a^2 + b^2$): Es un **triángulo acutángulo** ($<90^\circ$).
    - Si $c^2$ es **mayor** ($c^2 > a^2 + b^2$): Es un **triángulo obtusángulo** ($>90^\circ$).
explicacion_formal: |
  ### Teorema formal (Recíproco de Euclides I.48)
  Sea un triángulo $\Delta ABC$ con lados de longitudes $a, b, c$ ordenados de modo que $c = \max(a, b, c)$. Entonces:

  $$c^2 = a^2 + b^2 \iff \gamma = 90^\circ \quad (\Delta ABC \text{ es rectángulo})$$

  Generalización por la Ley del Coseno ($c^2 = a^2 + b^2 - 2ab \cos \gamma$):

  $$\operatorname{Tipo\\_Angular}(\Delta ABC) = \begin{cases} \text{Rectángulo:} & c^2 = a^2 + b^2 \iff \cos \gamma = 0 \iff \gamma = 90^\circ \\ \text{Acutángulo:} & c^2 < a^2 + b^2 \iff \cos \gamma > 0 \iff \gamma < 90^\circ \\ \text{Obtusángulo:} & c^2 > a^2 + b^2 \iff \cos \gamma < 0 \iff \gamma > 90^\circ \end{cases}$$

  ### Desglose simbólico y geométrico
  - $c$: Lado de máxima longitud del triángulo.
  - $a, b$: Lados menores.
  - $\gamma$: Ángulo interior opuesto al lado mayor $c$.
  - Criterio de equivalencia: Permite clasificar la naturaleza angular de cualquier triángulo sin necesidad de medir sus ángulos con transportador.

  ### Síntesis didáctica
  El recíproco de Pitágoras proporciona un test algebraico exacto y concluyente para diagnosticar la ortogonalidad y clasificar ángulos en topografía y construcción.
definiciones_clave: |
  - **Recíproco de Pitágoras**: Teorema inverso que deduce la existencia del ángulo recto a partir de la igualdad de áreas $c^2 = a^2 + b^2$.
  - **Ley de cosenos**: Teorema métrico generalizado que justifica la clasificación angular según el signo de $c^2 - (a^2 + b^2)$.
  - **Test de ortogonalidad**: Procedimiento de comprobación de $90^\circ$ mediante medidas de lados.
propiedades_relaciones: |
  - **Doble implicación ($\iff$)**: $c^2 = a^2 + b^2$ es condición necesaria y suficiente para que el triángulo sea rectángulo.
  - **Trazado de escuadras**: En construcción se usa la cuerda de 12 nudos (proporción 3-4-5) para garantizar esquinas de $90^\circ$ en cimientos.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Recíproco de Pitágoras](/static/img/nodos/reciproco-del-teorema-de-pitagoras-para-verificar-si-un-triangulo-es-rectangulo-ejemplos.svg)

    Determina si un triángulo cuyos lados miden $7\text{ cm}$, $24\text{ cm}$ y $25\text{ cm}$ es rectángulo, acutángulo u obtusángulo.
  pasos:
  - 'Paso 1: Identificar el lado mayor: $c = 25\text{ cm}$, y los dos lados menores: $a = 7\text{ cm}, b = 24\text{ cm}$.'
  - 'Paso 2: Calcular el cuadrado del lado mayor: $c^2 = 25^2 = 625$.'
  - 'Paso 3: Calcular la suma de los cuadrados de los lados menores: $a^2 + b^2 = 7^2 + 24^2 = 49 + 576 = 625$.'
  - 'Paso 4: Comparar ambos resultados: $625 = 625 \implies c^2 = a^2 + b^2$.'
  - 'Paso 5: Concluir que el triángulo es estrictamente rectángulo, con su ángulo recto opuesto al lado de $25\text{ cm}$.'
checkpoints:
- placement: after_explicacion_formal
  question: Si en un triángulo con lado mayor c se cumple que c² > a² + b², ¿qué tipo de triángulo es?
  choices:
  - text: Triángulo obtusángulo
    is_correct: true
  - text: Triángulo rectángulo
    is_correct: false
  - text: Triángulo acutángulo
    is_correct: false
  - text: Triángulo equilátero
    is_correct: false
  explanation: 'Si $c^2 > a^2 + b^2$, el ángulo opuesto al lado mayor es obtuso ($>90^\circ$), por lo que el triángulo es un triángulo obtusángulo.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Un triángulo tiene lados de 6 cm, 8 cm y 9 cm. ¿Qué tipo de triángulo es?
  choices:
  - text: Triángulo acutángulo
    is_correct: true
  - text: Triángulo rectángulo
    is_correct: false
  - text: Triángulo obtusángulo
    is_correct: false
  - text: No es un triángulo
    is_correct: false
  explanation: 'Es un Triángulo acutángulo porque $c^2 = 9^2 = 81$ y $a^2 + b^2 = 6^2 + 8^2 = 36 + 64 = 100$. Como $81 < 100$ ($c^2 < a^2 + b^2$), el triángulo es un Triángulo acutángulo.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Identificar el lado de mayor longitud de la terna y asignarlo como $c$.'
- 'Paso 2: Asignar los otros dos lados como $a$ y $b$.'
- 'Paso 3: Calcular $c^2$ por separado.'
- 'Paso 4: Calcular $a^2 + b^2$ y sumar ambos valores.'
- 'Paso 5: Comparar: si $c^2 = a^2 + b^2 \implies$ Rectángulo; si $c^2 < a^2 + b^2 \implies$ Acutángulo; si $c^2 > a^2 + b^2 \implies$ Obtusángulo.'
errores_correccion: 'Asegúrate de asignar siempre el valor mayor a $c$. Si comparas con un lado que no es el mayor, la conclusión será totalmente incorrecta.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿El triángulo de lados $9\text{ cm}$, $12\text{ cm}$ y $15\text{ cm}$ es rectángulo?
  alternativas:
  - Sí, porque 15² = 9² + 12² (225 = 81 + 144)
  - No, es obtusángulo
  - Es acutángulo
  respuesta: Sí, porque 15² = 9² + 12² (225 = 81 + 144)
  solucion_pasos:
  - '$15^2 = 225$, y $9^2 + 12^2 = 81 + 144 = 225$. Al ser iguales, es rectángulo.'
- titulo: Ejemplo 2
  enunciado: Si los lados de un triángulo son $4$, $6$ y $8$, ¿qué clase de triángulo es según sus ángulos?
  alternativas:
  - Obtusángulo (8² = 64 > 4² + 6² = 52)
  - Rectángulo
  - Acutángulo
  respuesta: Obtusángulo (8² = 64 > 4² + 6² = 52)
  solucion_pasos:
  - '$8^2 = 64$, $4^2 + 6^2 = 16 + 36 = 52$. Como $64 > 52$, es obtusángulo.'
- titulo: ¿Si c² = a² + b² entonces el triángulo tiene un ángulo de 90°?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, es la tesis formal del recíproco del teorema de Pitágoras.'
- titulo: ¿Si c² < a² + b² el triángulo es rectángulo?
  respuesta: 'No'
  solucion_pasos:
  - 'No, cuando $c^2 < a^2 + b^2$ el triángulo es acutángulo.'
errores_frecuentes:
- 'No elegir el lado mayor como $c$.'
- 'Confundir el criterio de acutángulo ($<$) con el de obtusángulo ($>$).'
- 'Comparar los lados sumándolos directamente en lugar de sumar sus cuadrados.'
- 'Olvidar chequear que la terna forme un triángulo ($a+b > c$).'
- 'Asumir que si los lados son enteros el triángulo siempre es rectángulo.'
afirmaciones_verdaderas:
- 'Si en un triángulo el cuadrado del lado mayor es igual a la suma de los cuadrados de los otros dos lados, el triángulo es rectángulo.'
- 'El recíproco de Pitágoras permite clasificar cualquier triángulo como acutángulo, rectángulo u obtusángulo.'
al_terminar_debes_poder: |
  **QUÉ:** Verificar si un triángulo es rectángulo, acutángulo u obtusángulo a partir de las medidas de sus lados.

  **CÓMO:** Evaluando el recíproco de Pitágoras ($c^2$ vs $a^2 + b^2$) sobre el lado mayor $c$.

  ![Resumen de Recíproco de Pitágoras](/static/img/nodos/reciproco-del-teorema-de-pitagoras-para-verificar-si-un-triangulo-es-rectangulo-resumen.svg)
