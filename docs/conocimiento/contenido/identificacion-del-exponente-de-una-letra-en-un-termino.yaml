semantic_id: MAT.ALG.TERMINO.EXPONENTE_LITERAL
resumen_inicial: 'La identificación del exponente de una letra en un término consiste en determinar la potencia entera a la que está elevada una variable específica dentro de la parte literal.'
explicacion_simple: |
  El **exponente de una letra** es el número pequeño escrito arriba a la derecha de esa letra:
  - Indica **cuántas veces se multiplica la letra por sí misma**.
  - En el término $5x^4$, el exponente de la letra $x$ es **$4$** ($x^4 = x \cdot x \cdot x \cdot x$).
  - **¡La regla del 1 invisible!** Si una letra no tiene ningún número arriba (como la $y$ en $3x^2 y$), su exponente **NUNCA es cero, sino $1$** ($y = y^1$).
  - Si el exponente fuera cero ($y^0 = 1$), la letra desaparecería del término.
explicacion_formal: |
  ### Definición formal
  En un término algebraico $M = c \cdot x_1^{\alpha_1} x_2^{\alpha_2} \cdots x_k^{\alpha_k}$, el **exponente de la variable $x_i$** es el entero no negativo $\alpha_i \in \mathbb{N}_0$ que define la potencia de la base $x_i$.

  ### Regla de la Potencia Unitaria Implícita
  Por las propiedades de la exponenciación en la estructura de cuerpo de $\mathbb{R}$:

  $$x^1 = x \quad \implies \quad \operatorname{exp}(x) = 1$$
  $$x^0 = 1 \quad (x \neq 0) \quad \implies \quad c \cdot x^0 = c \quad (\text{La variable no figura})$$

  ### Síntesis didáctica
  El exponente determina el grado de variación o crecimiento de la variable dentro del término. Una letra sin exponente explícito posee exponente $1$.
definiciones_clave: |
  - **Exponente literal**: Número entero no negativo situado como superíndice de una variable que indica la potencia de esa base.
  - **Exponente implícito ($1$)**: Ausencia de superíndice escrito sobre una variable, cuyo valor matemático es siempre $1$.
  - **Exponente cero ($0$)**: Valor de potencia que transforma cualquier base distinta de cero en $1$, eliminando visualmente la variable del término.
propiedades_relaciones: |
  - **Identificación de grado relativo**: El exponente de una letra específica coincide exactamente con el **grado relativo** del término respecto a esa variable.
  - **Suma de exponentes en el producto**: Al multiplicar términos con bases iguales, los exponentes de esa variable se suman ($x^a \cdot x^b = x^{a+b}$).
ejemplo_guiado:
  enunciado: 'En el término algebraico $-6a^5 b c^3$, identifica el exponente de cada una de las variables $a$, $b$ y $c$.'
  pasos:
    - 'Paso 1: Para la letra $a$, observamos su superíndice explícito: el exponente es **$5$**.'
    - 'Paso 2: Para la letra $b$, no hay superíndice escrito $\implies$ aplicamos la regla del exponente unitario: el exponente es **$1$**.'
    - 'Paso 3: Para la letra $c$, observamos su superíndice explícito: el exponente es **$3$**.'
    - 'Conclusión: El exponente de $a$ es **$5$**, el de $b$ es **$1$** y el de $c$ es **$3$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: '¿Cuál es el exponente de una letra que aparece en un término algebraico sin ningún número superíndice escrito, como la letra $y$ en $-4x^3 y$?'
    choices:
      - {text: 'El exponente es $1$', is_correct: true}
      - {text: 'El exponente es $0$', is_correct: false}
      - {text: 'El exponente es $-4$', is_correct: false}
      - {text: 'La letra carece de exponente', is_correct: false}
    explanation: 'La alternativa correcta es ''El exponente es $1$''. Por definición de potencia unitaria $y^1 = y$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'En el término algebraico $9x^8 y z^2$, ¿cuál es el exponente de la variable $z$?'
    choices:
      - {text: 'El exponente de $z$ es $2$', is_correct: true}
      - {text: 'El exponente de $z$ es $8$', is_correct: false}
      - {text: 'El exponente de $z$ es $1$', is_correct: false}
      - {text: 'El exponente de $z$ es $9$', is_correct: false}
    explanation: 'La alternativa correcta es ''El exponente de $z$ es $2$''. Es el superíndice de $z^2$.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar la variable de interés dentro de la parte literal del término.'
  - 'Paso 2: Observar el número escrito en el superíndice superior derecho de dicha letra.'
  - 'Paso 3: Si tiene un superíndice escrito (ej: $x^4$), ese número es su exponente.'
  - 'Paso 4: Si la letra no tiene ningún número escrito encima (ej: $x$), declarar que su exponente es $1$.'
errores_correccion: |
  - **Error 1:** Afirmar que una letra sin superíndice tiene exponente cero. **Cómo corregirlo:** Si el exponente fuera cero, la letra valdría $1$ y desaparecería; una letra simple **posee exponente $1$ ($x = x^1$)**.
  - **Error 2:** Tomar el coeficiente numérico como si fuera el exponente de la primera letra (ej: en $3x^2$ declarar que el exponente de $x$ es $3$). **Cómo corregirlo:** $3$ es el **coeficiente que multiplica** y $2$ es el **exponente superíndice**.
ejemplos:
  - titulo: 'Exponente de variable explícita'
    enunciado: '¿Cuál es el exponente de la variable $m$ en el término $-11m^7 n^2$?'
    alternativas:
      - '$7$'
      - '$2$'
      - '$-11$'
    respuesta: '$7$'
    solucion_pasos:
      - '1. El superíndice de $m$ es $7$.'
      - '2. El exponente de $m$ es $7$.'
  - titulo: 'Exponente de variable sin superíndice'
    enunciado: 'En el término $15a b^6$, ¿cuál es el exponente de la letra $a$?'
    alternativas:
      - '$1$'
      - '$0$'
      - '$6$'
    respuesta: '$1$'
    solucion_pasos:
      - '1. $a$ no tiene superíndice escrito.'
      - '2. Su exponente es $1$.'
  - titulo: 'Variables con exponentes iguales'
    enunciado: 'En el término $x^3 y^3$, ¿tienen las variables $x$ e $y$ exactamente el mismo exponente?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, ambas tienen el superíndice $3$.'
  - titulo: 'Exponente en término negativo'
    enunciado: 'En el término $-p^5$, ¿el exponente de la variable $p$ es igual a $5$?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Sí, el signo negativo afecta al coeficiente $-1$, mientras que el exponente de $p$ es $5$.'
errores_frecuentes:
  - 'Una letra sin exponente escrito posee un exponente igual a cero.'
  - 'El coeficiente numérico que multiplica al término se confunde con el exponente de su primera letra.'
  - 'La razón porcentual P% equivale numéricamente al factor multiplicativo r en la ecuación.'
  - 'El exponente de una letra cambia de signo si el término algebraico es negativo.'
  - 'Sumar dos términos algebraicos requiere sumar los exponentes de las letras iguales.'
afirmaciones_verdaderas:
  - 'El exponente de una letra es el superíndice que indica la potencia a la que está elevada dicha variable.'
  - 'Toda variable que figura en un término sin exponente explícito posee un exponente implícito igual a $1$.'
al_terminar_debes_poder: 'Identificar el exponente de cualquier variable dentro de un término algebraico reconociendo los exponentes implícitos iguales a $1$.'
fuente: 'Texto escolar MINEDUC — Álgebra 8° Básico / Nomenclatura.'
