resumen_inicial: El exponente de una letra en un término algebraico es el número o
  expresión ubicado como superíndice que indica cuántas veces se multiplica dicha
  base literal por sí misma.
explicacion_simple: El exponente de una letra es el numerito pequeño que flota arriba
  a la derecha de esa letra. En $5x^4$, el exponente de $x$ es $4$. Si una letra aparece
  sola (como en $7y$), su exponente es implícitamente $1$, aunque no se escriba.
explicacion_formal: 'En la potencia $x_j^{e_j}$ contenida en el término $T = c \prod_{k=1}^m
  x_k^{e_k}$, el **Exponente de la Variable** $x_j$ es el número $e_j \in \mathbb{N}_0$:


  $$e_j = \text{Exp}(x_j, T)$$


  $$\text{Si } x_j \text{ no lleva superíndice escrito} \implies e_j = 1$$


  > **Complemento didáctico:** El exponente determina la dimensión de variación de
  la variable individual en el término.'
definiciones_clave: '- **Exponente de una variable**: Valor numérico superíndice que
  indica la potencia de esa variable específica.'
propiedades_relaciones: '- **Exponente unitario implícito**: $x = x^1$ para toda variable
  $x$.'
ejemplo_guiado:
  enunciado: Determine el exponente de $a$, $b$ y $c$ en el término $T = -3a^5b^2c$.
  pasos:
  - 'Paso 1: Exponente de la variable $a$: se observa el superíndice $5 \to \text{Exp}(a)
    = 5$.'
  - 'Paso 2: Exponente de la variable $b$: se observa el superíndice $2 \to \text{Exp}(b)
    = 2$.'
  - 'Paso 3: Exponente de la variable $c$: no lleva número escrito $\to \text{Exp}(c)
    = 1$.'
  - 'Conclusión: Los exponentes son $5$ para $a$, $2$ para $b$, y $1$ para $c$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el exponente de la variable y en el término algebraico 4x^3y?
  choices:
  - text: '1'
    is_correct: true
  - text: '0'
    is_correct: false
  - text: '3'
    is_correct: false
  - text: '4'
    is_correct: false
  explanation: La alternativa correcta es '1'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para -3a^5b^2c, ¿cuál fue el exponente de la variable
    a?
  choices:
  - text: '5'
    is_correct: true
  - text: '2'
    is_correct: false
  - text: '1'
    is_correct: false
  - text: '-3'
    is_correct: false
  explanation: La alternativa correcta es '5'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Ubicar la variable de interés dentro de la parte literal.'
- 'Paso 2: Leer el número pequeño colocado en el superíndice superior derecho.'
- 'Paso 3: Si no lleva número escrito, declarar que el exponente es $1$.'
errores_correccion: '- **Error 1: Declarar que el exponente de $x$ en el término $5x$
  es cero.** **Cómo corregirlo:** Si fuera cero, $x^0 = 1$ y la variable desaparecería
  ($5 \cdot 1 = 5$); una variable escrita sin exponente tiene exponente $1$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el exponente de la letra m en el término -9m^6n^2?
  alternativas:
  - '6'
  - '2'
  - '-9'
  - '8'
  respuesta: '6'
  solucion_pasos:
  - 1. Ubicar la letra m.
  - 2. Su superíndice es 6.
- titulo: Ejemplo 2
  enunciado: En el término 14x^2yz^4, ¿cuál es el exponente de la variable y?
  alternativas:
  - '1'
  - '0'
  - '2'
  - '4'
  respuesta: '1'
  solucion_pasos:
  - 1. La variable y no tiene exponente escrito.
  - 2. Por convención, su exponente es 1.
- titulo: ¿Es el exponente de z en 3x^2y^4z^8 igual a 8?
  respuesta: Sí
  solucion_pasos:
  - Sí, el superíndice de z es 8.
- titulo: ¿Es el exponente de a en el término 7a igual a cero?
  respuesta: 'No'
  solucion_pasos:
  - No, a equivale a a^1, por lo que su exponente es 1.
errores_frecuentes:
- Declarar que el exponente de una letra sin superíndice escrito es 0 en lugar de
  1.
- Declarar el coeficiente numérico de adelante con el exponente de la variable.
- Sumar los exponentes de letras distintas al responder por el exponente de una sola
  variable.
- Multiplicar el exponente por el coeficiente numérico del término.
- Declarar que el signo negativo del coeficiente afecta el valor del exponente positivo.
afirmaciones_verdaderas:
- Toda variable presente en un término sin exponente visible posee exponente igual
  a 1.
- El exponente indica el grado de la potencia correspondiente a esa variable específica.
al_terminar_debes_poder: Al terminar serás capaz de identificar el exponente implícito
  o explícito de cualquier variable en un término algebraico.
