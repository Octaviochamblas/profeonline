semantic_id: MAT.ALG.TERMINO.EXPONENTE_LITERAL
resumen_inicial: 'El exponente de una letra en un término algebraico indica la potencia a la que está elevada dicha variable, siendo 1 cuando no figura ningún número explícito.'
explicacion_simple: |
  - El **exponente de una letra** es el número pequeño situado en la esquina superior derecha de la variable.
  - Indica **cuántas veces se multiplica esa letra por sí misma**:
    - En $x^4$, el exponente de $x$ es **$4$** ($x \cdot x \cdot x \cdot x$).
    - En $y^3$, el exponente de $y$ es **$3$**.
  - **Regla crucial del exponente 1 tácito:**
    - Si una letra aparece escrita sin exponente visible, como la $y$ en $5x^2y$, su exponente es **$1$** ($y^1 = y$).
    - **¡Nunca es 0!** (si fuera 0, $y^0 = 1$ y la letra no aparecería).

  ![Exponente de una Letra](/static/img/nodos/identificacion-del-exponente-de-una-letra-en-un-termino-intro.svg)
explicacion_formal: |
  ### Fundamento exponencial en monomios
  En la estructura de un término $T = c \cdot x_1^{e_1} x_2^{e_2} \cdots x_k^{e_k}$, el valor $e_j \in \mathbb{R}$ es el **exponente formal** de la variable $x_j$.

  ### Propiedades del exponente tácito
  1. **Potencia unitaria:** $\forall x \in \mathbb{R}, \; x^1 = x$. Por economía de notación, el exponente $1$ se omite en la escritura.
  2. **Potencia nula:** $\forall x \in \mathbb{R} \setminus \{0\}, \; x^0 = 1$. Si una variable tiene exponente $0$, no figura en la parte literal del término.
  3. **Exponentes enteros negativos:** $x^{-n} = \frac{1}{x^n}$, representa la variable en el denominador.
definiciones_clave: |
  - **Exponente literal**: Número que indica la potencia a la que está elevada una variable en un monomio.
  - **Exponente tácito (1)**: Valor exponencial implícito en toda variable que no lleva superíndice escrito.
  - **Grado relativo de la letra**: Valor del exponente de una variable específica en el término algebraico.
propiedades_relaciones: |
  - **Producto de potencias de igual base**: Al multiplicar dos términos con la misma variable, los exponentes de dicha letra se suman: $x^a \cdot x^b = x^{a+b}$.
  - **Cociente de potencias de igual base**: Al dividir términos, los exponentes se restan: $\frac{x^a}{x^b} = x^{a-b}$.
ejemplo_guiado:
  enunciado: 'En el término algebraico $-6a^5bc^3$, determina el exponente individual de cada una de las tres letras: $a$, $b$ y $c$.'
  imagen: '/static/img/nodos/identificacion-del-exponente-de-una-letra-en-un-termino-ejemplos.svg'
  pasos:
    - 'Paso 1: Para la letra $a$, observamos el superíndice escrito: su exponente es **$5$**.'
    - 'Paso 2: Para la letra $b$, no hay superíndice escrito; aplicamos la regla del exponente tácito: su exponente es **$1$**.'
    - 'Paso 3: Para la letra $c$, observamos el superíndice escrito: su exponente es **$3$**.'
    - 'Paso 4: Conclusión: Los exponentes respectivos de $a, b, c$ son **$5$**, **$1$** y **$3$**.'
checkpoints:
  - placement: after_explicacion_formal
    question: 'En el término algebraico $8x^3y$, ¿cuál es el exponente de la variable $y$?'
    choices:
      - text: '$1$, porque toda letra sin exponente escrito está elevada a la primera potencia'
        is_correct: true
      - text: '$0$, porque no tiene ningún número escrito'
        is_correct: false
      - text: '$3$, porque comparte el exponente de la $x$'
        is_correct: false
      - text: '$8$, porque es el coeficiente'
        is_correct: false
    explanation: 'La alternativa correcta es ''$1$, porque toda letra sin exponente escrito está elevada a la primera potencia''. $y^1 = y$.'
    reinforcement_section: 'Explicación formal'
  - placement: after_ejemplo_guiado
    question: 'Si en un término una variable tuviera exponente 0 ($x^0$ con $x \neq 0$), ¿qué ocurre con esa letra en el término?'
    choices:
      - text: 'Se convierte en 1 y no figura en la parte literal escrita'
        is_correct: true
      - text: 'Vuelve negativo al término completo'
        is_correct: false
      - text: 'Hace que todo el término valga 0'
        is_correct: false
      - text: 'Se transforma en el coeficiente numérico'
        is_correct: false
    explanation: 'La alternativa correcta es ''Se convierte en 1 y no figura en la parte literal escrita''. $x^0 = 1$, por lo que actúa como neutro multiplicativo.'
    reinforcement_section: 'Ejemplo guiado'
procedimiento:
  - 'Paso 1: Localizar la variable de interés dentro del término algebraico.'
  - 'Paso 2: Leer el número superíndice situado a la derecha de la letra.'
  - 'Paso 3: Si no figura ningún superíndice, asignar inmediatamente el valor $1$.'
  - 'Paso 4: Registrar el exponente identificado para su uso en cálculos de grado o productos.'
errores_correccion: |
  - **Error 1:** Decir que el exponente de $y$ en $3xy$ es 0. **Cómo corregirlo:** Si fuera 0, $y^0 = 1$ y la $y$ no aparecería. Como la letra está escrita, su exponente es **$1$**.
  - **Error 2:** Atribuir el exponente de una letra a las demás variables del término. **Cómo corregirlo:** Cada variable tiene su **propio exponente individual**. En $x^3y$, el $3$ solo pertenece a $x$.
ejemplos:
  - titulo: 'Exponente de variables combinadas'
    enunciado: 'En el monomio $-4u^7vw^2$, ¿cuál es la terna de exponentes $(u, v, w)$?'
    alternativas:
      - '$(7, 1, 2)$'
      - '$(7, 0, 2)$'
      - '$(7, 7, 2)$'
    respuesta: '$(7, 1, 2)$'
    solucion_pasos:
      - '1. $u$ tiene exponente 7.'
      - '2. $v$ no tiene exponente visible $\implies$ exponente 1.'
      - '3. $w$ tiene exponente 2.'
      - '4. La terna es $(7, 1, 2)$.'
  - titulo: 'Multiplicación con exponente 1'
    enunciado: '¿Cuál es el resultado de multiplicar $x^3 \cdot x$?'
    alternativas:
      - '$x^4$'
      - '$x^3$'
      - '$x^0$'
    respuesta: '$x^4$'
    solucion_pasos:
      - '1. Se reconoce el exponente 1 en la segunda variable: $x = x^1$.'
      - '2. Se suman los exponentes: $3 + 1 = 4$.'
      - '3. El producto es $x^4$.'
  - titulo: 'Existencia de exponente tácito'
    enunciado: '¿Toda letra presente en un término algebraico sin superíndice escrito tiene exponente 1?'
    respuesta: 'Sí'
    solucion_pasos:
      - '1. Por la propiedad $x^1 = x$, la ausencia de exponente denota potencia 1.'
      - '2. Es una convención universal.'
  - titulo: 'Exponente nulo'
    enunciado: '¿Tiene la variable $a$ exponente 0 en el término $5a$?'
    respuesta: 'No'
    solucion_pasos:
      - '1. Si $a$ tuviera exponente 0, $5a^0 = 5(1) = 5$ (sin letra).'
      - '2. En $5a$, el exponente de $a$ es 1.'
errores_frecuentes:
  - 'Asignar exponente 0 a letras que no llevan número escrito en vez del valor correcto 1.'
  - 'Olvidar sumar el exponente 1 al calcular el producto de potencias de igual base ($x^2 \cdot x = x^2$).'
  - 'Creer que el exponente de una letra aplica a todas las demás variables del monomio.'
  - 'Confundir el exponente de una variable con el coeficiente que multiplica al término.'
  - 'Afirmar que una letra con exponente negativo vuelve negativo al término completo.'
afirmaciones_verdaderas:
  - 'Toda variable escrita en un término algebraico sin superíndice tiene exponente igual a 1.'
  - 'El exponente de una letra indica la cantidad de veces que dicha variable actúa como factor multiplicador.'
al_terminar_debes_poder: |
  ![Resumen de Exponente de una Letra](/static/img/nodos/identificacion-del-exponente-de-una-letra-en-un-termino-resumen.svg)

  QUÉ: Identificar el exponente exacto de cada variable en un término algebraico, reconociendo exponentes explícitos y la regla del exponente 1 tácito.
  CÓMO: Leyendo el superíndice de cada letra y asignando el valor $1$ a variables sin superíndice escrito ($x \equiv x^1$) en monomios como $5x^4y$.
