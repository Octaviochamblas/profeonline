semantic_id: MAT.GEO.CIRCULO_METRICA.LONGITUD_CIRCUNFERENCIA_RADIO
resumen_inicial: 'Cálculo de la longitud de la circunferencia usando 2πr: conceptos,
  teoremas, propiedades geométricas y cálculo en Circunferencia y Círculo.'
explicacion_simple: Toda circunferencia tiene una longitud total (la medida de su
  contorno completo), que se relaciona de forma directa y constante con su radio.
explicacion_formal: '![Longitud de la circunferencia: 2πr](/static/img/geometria/circunferencia-circulo/circulo-longitud-circunferencia-radio.svg)


  ### Definición formal


  La longitud (perímetro) de una circunferencia de radio $r$ es $L=2\pi r$, donde
  $\pi\approx3,1416$ es una constante matemática que relaciona la longitud de cualquier
  circunferencia con su diámetro.


  ### Desarrollo didáctico


  Una circunferencia de radio 5 cm tiene longitud $L=2\times\pi\times5=10\pi\approx31,42$
  cm. Esta fórmula es universal: aplica a cualquier circunferencia, sin importar su
  tamaño, siempre que se use el mismo valor de $r$.'
definiciones_clave: '- **Cálculo de la longitud de la circunferencia usando 2πr**:
