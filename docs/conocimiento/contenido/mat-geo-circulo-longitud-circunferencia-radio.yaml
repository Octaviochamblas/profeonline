procedimiento:
- 'Paso 1: Identifica el radio r de la circunferencia.'
- 'Paso 2: Multiplica el radio por 2.'
- 'Paso 3: Multiplica ese resultado por π (usando 3,14 o 3,1416 como aproximación)
  para obtener la longitud.'
