semantic_id: MAT.GEO.CIRCULO_ANGULOS.ANGULO_SEMIINSCRITO_DEFINICION
resumen_inicial: Un ángulo semiinscrito es aquel cuyo vértice es el punto de tangencia de una recta y sus lados están formados por dicha recta tangente y una cuerda que nace en el contacto.
explicacion_simple: 'Imagina una regla apoyada tocando el borde de una moneda redonda en un solo punto $T$ (recta tangente). Ahora dibuja una línea recta sobre la moneda que vaya desde ese mismo punto $T$ hacia otro punto del borde $A$ (una cuerda). El ángulo que queda atrapado entre la regla y la línea interior es un **ángulo semiinscrito**.


  Se llama ''semi-inscrito'' (medio inscrito) porque está a mitad de camino: su vértice está en la orilla ($T$), pero **un lado está afuera (la recta tangente)** y **el otro lado está adentro (la cuerda)**.


  ![Definición de ángulo semiinscrito](/static/img/nodos/definicion-de-angulo-semiinscrito-formado-por-una-tangente-y-una-cuerda-intro.svg)

  '
explicacion_formal: '### Definición geométrica formal

  Sea $\mathcal{C}(O, r)$ una circunferencia y sea $\mathcal{L}_T$ una recta tangente a $\mathcal{C}$ en el punto de tangencia $T \in \mathcal{C}$. Sea $A \in \mathcal{C}$ un punto de la circunferencia distinto de $T$ ($A \neq T$) que define la cuerda $\overline{TA}$. Se define el **ángulo semiinscrito** como el ángulo formado por una de las semirrectas de la recta tangente con origen en $T$ y la semirrecta secante $\vec{TA}$:

  $$\angle(\mathcal{L}_T, \overline{TA}) = \text{Ángulo semiinscrito} \iff V = T \in \mathcal{L}_T \cap \mathcal{C} \quad \wedge \quad \overline{TA} \subset \text{Cuerda}(\mathcal{C})$$


  ### Arco subtendido

  El ángulo semiinscrito delimita un arco $\overset{\frown}{TA}$ en la región angular comprendida entre la tangente y la cuerda. Cada punto de contacto $T$ y cuerda $\overline{TA}$ determina dos ángulos semiinscritos adyacentes y suplementarios (que suman $180^\circ$ sobre la recta tangente).


  > **Complemento didáctico:** El ángulo semiinscrito es un híbrido fascinante: tiene un pie en el exterior (la tangente) y un pie en el interior (la cuerda). Lo fundamental para identificarlo es confirmar que el vértice es EXACTAMENTE el punto de contacto de la tangente.

  '
definiciones_clave: '- **Ángulo semiinscrito**: Ángulo con vértice en el punto de tangencia, formado por una recta tangente y una cuerda.

  - **Punto de tangencia ($T$)**: Vértice común donde la recta roza a la circunferencia.

  - **Cuerda de tangencia ($\overline{TA}$)**: Lado interior del ángulo que une $T$ con otro punto de la curva.

  '
propiedades_relaciones: '- **Vértice en contacto único**: $V = T$.

  - **Suplementariedad**: Los dos ángulos semiinscritos que comparten la cuerda $\overline{TA}$ suman $180^\circ$ a lo largo de la recta tangente.

  - **Caso particular perpendicular**: Si la cuerda $\overline{TA}$ es un diámetro, el ángulo semiinscrito mide exactamente $90^\circ$ por perpendicularidad radio-tangente.

  '
ejemplo_guiado:
  enunciado: '![Ejemplos de ángulo semiinscrito](/static/img/nodos/definicion-de-angulo-semiinscrito-formado-por-una-tangente-y-una-cuerda-ejemplos.svg)


    Una recta $\mathcal{L}$ es tangente a una circunferencia en el punto $T$. Desde $T$ se traza la cuerda $\overline{TA}$. Identifica los elementos del ángulo formado por la recta y la cuerda y clasifícalo formalmente.'
  pasos:
  - 'Paso 1: Localizar el vértice: El vértice se encuentra en el punto de contacto $T$.'
  - 'Paso 2: Identificar los lados: Un lado es la recta tangente $\mathcal{L}$ y el otro es el segmento secante interior $\overline{TA}$.'
  - 'Paso 3: Concluir por definición: Al estar formado por una tangente y una cuerda con vértice en el punto de tangencia, es un ángulo semiinscrito.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son los dos elementos lineales que forman los lados de un ángulo semiinscrito?
  choices:
  - text: Una recta tangente y una cuerda con vértice común en el punto de tangencia.
    is_correct: true
  - text: Dos rectas tangentes exteriores.
    is_correct: false
  - text: Dos cuerdas secantes interiores.
    is_correct: false
  - text: Un radio y un diámetro perpendicular.
    is_correct: false
  explanation: La alternativa correcta es 'Una recta tangente y una cuerda con vértice común en el punto de tangencia.' Esta combinación mixta define al ángulo semiinscrito.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Dónde se ubica necesariamente el vértice de un ángulo semiinscrito?
  choices:
  - text: En el punto de tangencia de la recta con la circunferencia.
    is_correct: true
  - text: En el centro de la circunferencia.
    is_correct: false
  - text: En el punto medio de la cuerda.
    is_correct: false
  - text: En cualquier punto exterior a la circunferencia.
    is_correct: false
  explanation: La alternativa correcta es 'En el punto de tangencia de la recta con la circunferencia.' El vértice $T$ es el punto de contacto único de la recta tangente.
  reinforcement_section: Ejemplo guiado
procedimiento: '1. Ubicar la recta tangente y su punto de contacto $T$.

  2. Verificar si el vértice del ángulo coincide con el punto de tangencia $T$.

  3. Verificar que el segundo lado sea una cuerda que una $T$ con otro punto $A$ de la circunferencia.

  4. Clasificar el ángulo resultante como semiinscrito.

  '
errores_correccion: '- **Error común 1:** Confundir ángulo semiinscrito con ángulo circunscrito. **Corrección:** El circunscrito está formado por DOS tangentes exteriores; el semiinscrito por UNA tangente y UNA cuerda.

  - **Error común 2:** Creer que el vértice puede estar en cualquier lugar de la recta tangente. **Corrección:** El vértice debe estar OBLIGATORIAMENTE en el punto de tangencia $T$.

  '
ejemplos:
- tipo: A
  titulo: Clasificación de ángulo tangente-cuerda
  enunciado: 'El ángulo formado por una recta tangente a una circunferencia en $T$ y una cuerda que nace en $T$ se clasifica como:'
  alternativas:
  - text: Ángulo semiinscrito.
    is_correct: true
  - text: Ángulo inscrito.
    is_correct: false
  - text: Ángulo del centro.
    is_correct: false
  - text: Ángulo interior.
    is_correct: false
  explicacion: Por definición, la unión de una tangente y una cuerda en el punto de contacto forma un ángulo semiinscrito.
- tipo: B
  titulo: Vértice de contacto
  enunciado: ¿Es el vértice de un ángulo semiinscrito el punto de tangencia entre la recta y la circunferencia?
  respuesta: Sí
  explicacion: Sí. El punto de tangencia es el vértice donde convergen la recta tangente y la cuerda.
errores_frecuentes:
- '''Confundir el ángulo semiinscrito con un ángulo inscrito corriente.'''
- '''Asumir que ambos lados del ángulo semiinscrito son cuerdas.'''
- '''Ubicar el vértice fuera del punto de tangencia $T$.'''
afirmaciones_verdaderas:
- '''El ángulo semiinscrito tiene su vértice ubicado en el punto de tangencia.'''
- '''Los lados de un ángulo semiinscrito están conformados por una recta tangente y una cuerda.'''
- '''Los dos ángulos semiinscritos adyacentes determinados por una cuerda y la recta tangente suman $180^\circ$.'''
al_terminar_debes_poder: '**QUÉ:** Identificar y definir ángulos semiinscritos en figuras con rectas tangentes.


  **CÓMO:** Verificando vértice en $T$ y lados como tangente $\mathcal{L}_T$ y cuerda $\overline{TA}$.


