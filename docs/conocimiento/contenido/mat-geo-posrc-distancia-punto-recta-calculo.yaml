semantic_id: MAT.GEO.POSICIONES_RECTAS_CIRCUNFERENCIAS.DISTANCIA_PUNTO_RECTA_CALCULO
resumen_inicial: 'Cálculo de la distancia de un punto a una recta: conceptos, teoremas,
  propiedades geométricas y cálculo en Geometría Analítica Ampliada.'
explicacion_simple: En la práctica, la recta puede estar dada en forma principal o
  segmentaria, por lo que a menudo se necesita convertirla primero a forma general
  antes de aplicar la fórmula de distancia.
explicacion_formal: '![Cálculo de la distancia de un punto a una recta](/static/img/geometria/analitica/posrc-distancia-punto-recta-calculo.svg)


  ### Definición formal


  Si la recta está dada como $y=mx+b$, se convierte primero a forma general: $mx-y+b=0$,
  con $A=m$, $B=-1$, $C=b$, y luego se aplica la fórmula de distancia.


  ### Desarrollo didáctico


  Para la recta $y=-0{,}75x+2$ (forma general: $0{,}75x+y-2=0$) y el punto $P(3,3)$:
  $d=\dfrac{|0{,}75\times3+3-2|}{\sqrt{0{,}75^2+1^2}}=\dfrac{|2{,}25+1|}{\sqrt{1{,}5625}}=\dfrac{3{,}25}{1{,}25}=2{,}6$.'
