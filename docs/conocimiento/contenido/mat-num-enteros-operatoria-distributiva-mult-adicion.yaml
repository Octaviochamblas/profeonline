semantic_id: MAT.NUM.ENTEROS_OPERATORIA.DISTRIBUTIVA_MULT_ADICION
resumen_inicial: "La propiedad distributiva dice que multiplicar por una suma equivale a multiplicar por cada sumando y luego sumar: $a\\cdot(b+c)=a\\cdot b+a\\cdot c$."
explicacion_simple: |
  Eres cartero y debes entregar dos cartas: una a Ana y otra a Beto. Puedes juntarlos en el
  parque y entregar ambas a la vez, o ir primero a la casa de Ana y luego a la de Beto: en
  ambos casos entregaste las mismas cartas. Igual pasa con $2\cdot(3+5)$: puedes resolver
  la suma primero ($2\cdot8=16$) o "repartir" la multiplicación a cada término
  ($2\cdot3+2\cdot5=6+10=16$). ¡El resultado siempre es el mismo!
explicacion_formal: |
  Para $a, b, c \in \mathbb{Z}$: $a \cdot (b + c) = a \cdot b + a \cdot c$, y también
  $a \cdot (b - c) = a \cdot b - a \cdot c$. Se puede aplicar de izquierda a derecha
  (desarrollo) o de derecha a izquierda (factor común).
definiciones_clave: |
  **Propiedad distributiva**: vincula la multiplicación con la adición/sustracción,
  permitiendo desarrollar o factorizar expresiones. **Factor común**: el término que se
  repite y puede extraerse de una suma de productos.
propiedades_relaciones: |
  La distributiva se aplica sobre sumas y restas, no sobre otra multiplicación (no es
  correcto distribuir $a\cdot(b\cdot c)$). Es la base del desarrollo de binomios y la
  factorización en álgebra.
ejemplo_guiado:
  enunciado: "Calcula $(-4) \\cdot [7 + (-3)]$ aplicando la propiedad distributiva."
  pasos:
    - 'Se distribuye: $(-4)\cdot7 + (-4)\cdot(-3)$.'
    - "Se calcula cada producto: $-28$ y $+12$."
    - "Se suman: $-28+12=-16$."
checkpoints:
  - placement: after_explicacion_formal
    question: "¿Sobre qué operaciones se aplica la propiedad distributiva de la multiplicación?"
    choices:
      - {text: "Sobre la adición y sustracción", is_correct: true}
      - {text: "Sobre otra multiplicación", is_correct: false}
      - {text: "Sobre la división únicamente", is_correct: false}
      - {text: "No se aplica sobre ninguna operación", is_correct: false}
    explanation: "La correcta es Sobre la adición y sustracción: $a\\cdot(b+c)=a\\cdot b+a\\cdot c$."
    reinforcement_section: "Explicación formal"
  - placement: after_ejemplo_guiado
    question: "Con el mismo procedimiento del ejemplo guiado, ¿cuánto es $(-5) \\cdot [4 + (-2)]$?"
    choices:
      - {text: "$-10$", is_correct: true}
      - {text: "$10$", is_correct: false}
      - {text: "$-30$", is_correct: false}
      - {text: "$-20$", is_correct: false}
    explanation: "La correcta es $-10$: distribuyendo, $(-5)\\cdot4+(-5)\\cdot(-2)=-20+10=-10$."
    reinforcement_section: "Ejemplo guiado"
procedimiento:
  - 'Paso 1: Identifica una expresión de la forma $a \cdot (b + c)$ o de la forma $a \cdot b + a \cdot c$.'
  - 'Paso 2: Si desarrollas, multiplica el factor de afuera ($a$) por cada término dentro del paréntesis ($b$ y $c$), respetando las reglas de multiplicación y signos.'
  - 'Paso 3: Si factorizas, identifica el factor común ($a$), colócalo fuera del paréntesis y agrupa los términos restantes ($b + c$) dentro de él.'
  - 'Paso 4: Realiza las operaciones finales para obtener el resultado.'
errores_correccion: |
  Un error frecuente es multiplicar el factor exterior solo por el primer término del
  paréntesis, olvidando el segundo. Otro error es no aplicar bien la regla de signos al
  distribuir un factor negativo sobre una resta.
ejemplos:
  - titulo: 'Ejemplo 1'
    enunciado: 'Calcula el valor de la expresión $(-3) \cdot [10 + (-2)]$ aplicando la propiedad distributiva.'
    alternativas:
      - "$-24$"
      - "$24$"
      - "$-36$"
    respuesta: "$-24$"
    solucion_pasos:
      - 'Paso a: Identificamos que el factor $-3$ multiplica a la suma dentro del corchete.'
      - 'Paso b: Distribuimos la multiplicación: $(-3) \cdot 10 + (-3) \cdot (-2)$.'
      - 'Paso c: Calculamos cada producto por separado: $(-3) \cdot 10 = -30$ y $(-3) \cdot (-2) = 6$.'
      - 'Paso d: Sumamos los productos obtenidos: $-30 + 6 = -24$.'
  - titulo: 'Ejemplo 2'
    enunciado: 'Resuelve de forma rápida $15 \cdot 8 + 15 \cdot 2$ aplicando la propiedad distributiva a la inversa (factor común).'
    alternativas:
      - "$150$"
      - "$130$"
      - "$170$"
    respuesta: "$150$"
    solucion_pasos:
      - 'Paso a: Vemos que el número $15$ se repite como factor en ambos sumandos.'
      - 'Paso b: Expresamos la suma como el producto del factor común por la suma de los otros términos: $15 \cdot (8 + 2)$.'
      - 'Paso c: Resolvemos el paréntesis primero: $8 + 2 = 10$.'
      - 'Paso d: Multiplicamos el resultado: $15 \cdot 10 = 150$.'
  - titulo: '¿Es la expresión $2 \cdot (3 \cdot 4)$ equivalente a $(2 \cdot 3) + (2 \cdot 4)$ según la distributividad?'
    respuesta: 'No'
    solucion_pasos:
      - 'La propiedad distributiva se aplica a la multiplicación respecto a la **adición** o **sustracción** ($a \cdot (b + c)$).'
      - 'En la expresión $2 \cdot (3 \cdot 4)$ solo hay multiplicaciones, por lo que aplica la propiedad asociativa ($2 \cdot 12 = 24$).'
      - 'El desarrollo $(2 \cdot 3) + (2 \cdot 4)$ daría $6 + 8 = 14$, lo cual es incorrecto.'
  - titulo: '¿Da el mismo resultado resolver $(-5) \cdot [6 - 2]$ restando primero que aplicando la propiedad distributiva?'
    respuesta: 'Sí'
    solucion_pasos:
      - 'Restando primero: $(-5) \cdot [4] = -20$.'
      - 'Distribuyendo: $(-5) \cdot 6 - (-5) \cdot 2 = -30 - (-10) = -30 + 10 = -20$.'
      - 'Ambos métodos dan $-20$, confirmando la validez de la propiedad distributiva.'
errores_frecuentes:
  - 'Multiplicar el factor exterior solo por el primer término del paréntesis (ej: $3 \cdot (5 + 2) = 15 + 2$).'
  - 'No aplicar la regla de los signos correctamente al distribuir un factor negativo (ej: $-2 \cdot (3 - 4) = -6 - 8$ en lugar de $-6 + 8$).'
  - 'Intentar distribuir la multiplicación sobre otra multiplicación (ej: $a \cdot (b \cdot c) = (a \cdot b) \cdot (a \cdot c)$).'
  - 'Creer que la adición es distributiva respecto a la multiplicación (ej: $a + (b \cdot c) = (a + b) \cdot (a + c)$).'
  - 'Confundir la sustracción en la distribución y cambiar el signo del segundo término de forma incorrecta.'
afirmaciones_verdaderas:
  - "2·(3+5) es igual a 2·3+2·5."
  - "La propiedad distributiva permite repartir una multiplicación sobre una suma."
al_terminar_debes_poder: |
  Desarrollar y factorizar expresiones aplicando correctamente la propiedad distributiva
  con las reglas de signos de la multiplicación.
fuente: "Matemática 7° Básico Tomo 1 — Enteros, p. 40"
estado: publicado
