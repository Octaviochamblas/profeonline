semantic_id: MAT.NUM.ENTEROS_OPERATORIA.DISTRIBUTIVA_MULT_ADICION
resumen_inicial: 'La multiplicación se distribuye sobre la adición: $a \cdot (b +
  c) = a \cdot b + a \cdot c$.'
explicacion_simple: 'La propiedad distributiva nos permite multiplicar un número por
  una suma de dos formas distintas: podemos sumar primero los números del paréntesis
  y luego multiplicar, o bien multiplicar el número por cada uno de los sumandos por
  separado y luego sumar los resultados.'
explicacion_formal: 'Para cualesquiera tres enteros $a, b, c \in \mathbb{Z}$, la **Propiedad
  Distributiva de la Multiplicación sobre la Adición** establece que:


  $$a \cdot \left(b + c\right) = a \cdot b + a \cdot c$$


  **Desglose de la fórmula:**

  - $a \cdot (b + c)$: Multiplicación del factor exterior $a$ por la suma interior
  $(b + c)$.

  - $a \cdot b + a \cdot c$: Distribución del factor $a$ a cada sumando por separado.


  > **Complemento didáctico:** $(-3) \cdot (4 + (-2)) = (-3) \cdot (2) = -6$, o distribuyendo:
  $(-3) \cdot 4 + (-3) \cdot (-2) = -12 + 6 = -6$.'
definiciones_clave: '- **Propiedad distributiva**: Factorización o expansión que conecta
  la multiplicación con la adición.'
propiedades_relaciones: '- **Factor común**: Proceso inverso a la distributividad
  ($a \cdot b + a \cdot c = a(b + c)$).'
ejemplo_guiado:
  enunciado: Calcule $(-4) \cdot (5 + (-2))$ aplicando la propiedad distributiva.
  pasos:
  - 'Paso 1: Distribuir el factor exterior $-4$ a cada sumando: $(-4) \cdot 5 + (-4)
    \cdot (-2)$.'
  - 'Paso 2: Calcular los productos parciales: $(-20) + 8$.'
  - 'Paso 3: Sumar los resultados parciales: $(-20) + 8 = -12$.'
  - 'Conclusión: $(-4) \cdot (5 + (-2)) = -12$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la propiedad distributiva de la multiplicación sobre la
    adición?
  choices:
  - text: Que a · (b + c) = a · b + a · c
    is_correct: true
  - text: Que a + (b · c) = (a + b) · (a + c)
    is_correct: false
  - text: Que a · b = b · a
    is_correct: false
  - text: Que el cero anula la suma
    is_correct: false
  explanation: La alternativa correcta es 'Que a · (b + c) = a · b + a · c'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿cuál fue el resultado final de (-4) · (5 + (-2))?
  choices:
  - text: '-12'
    is_correct: true
  - text: '12'
    is_correct: false
  - text: '-28'
    is_correct: false
  - text: '28'
    is_correct: false
  explanation: La alternativa correcta es '-12'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Multiplicar el factor exterior por el primer sumando dentro del paréntesis.'
- 'Paso 2: Multiplicar el factor exterior por el segundo sumando dentro del paréntesis.'
- 'Paso 3: Sumar los dos productos parciales respetando sus signos.'
errores_correccion: '- **Error 1: Multiplicar el factor exterior solo por el primer
  término del paréntesis.** En $3(x + 4)$, escribir $3x + 4$. **Cómo corregirlo:**
  El factor exterior debe multiplicar a TODOS los términos dentro del paréntesis ($3x
  + 12$).


  - **Error 2: Errar el signo al distribuir un factor negativo.** En $-2(4 - 5)$,
  no cambiar el signo del segundo término. **Cómo corregirlo:** $(-2) \cdot 4 + (-2)
  \cdot (-5) = -8 + 10 = 2$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $5 \cdot (10 - 4)$ distribuyendo el factor 5.
  alternativas:
  - '30'
  - '46'
  - '50'
  respuesta: '30'
  solucion_pasos:
  - $5 \cdot 10 - 5 \cdot 4 = 50 - 20 = 30$.
- titulo: Ejemplo 2
  enunciado: Factorice extrayendo factor común en $(-6) \cdot 8 + (-6) \cdot 2$.
  alternativas:
  - '-60'
  - '60'
  - '-36'
  respuesta: '-60'
  solucion_pasos:
  - $(-6) \cdot (8 + 2) = (-6) \cdot 10 = -60$.
- titulo: ¿Se cumple que a · (b - c) = a · b - a · c para todo entero?
  respuesta: Sí
  solucion_pasos:
  - Sí, la distributividad aplica tanto a la suma como a la resta.
- titulo: ¿Es cierto que 2 · (3 · 4) = 2 · 3 + 2 · 4?
  respuesta: 'No'
  solucion_pasos:
  - No, la distributividad aplica sobre la adición, no sobre la multiplicación.
errores_frecuentes:
- Multiplicar el factor exterior únicamente por el primer término dentro del paréntesis.
- La propiedad distributiva aplica de la misma forma al distribuir una adición sobre
  una multiplicación.
- Distribuir un factor negativo no altera el signo del segundo término dentro del
  paréntesis.
- La propiedad distributiva solo se puede aplicar si todos los términos son enteros
  positivos.
- Extraer factor común en $a \cdot b + a \cdot c$ resulta en la multiplicación $(a
  + a) \cdot (b + c)$.
afirmaciones_verdaderas:
- 'La multiplicación es distributiva respecto de la adición: $a(b + c) = ab + ac$.'
- El proceso inverso a la propiedad distributiva es la factorización por factor común.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la propiedad distributiva
  de la multiplicación sobre la adición $a(b + c) = ab + ac$, multiplicando el factor
  exterior por cada término y sumando los productos parciales.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
estado: publicado
