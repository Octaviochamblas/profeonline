semantic_id: MAT.GEO.TRIANGULOS_ANGULOS.SUMA_INTERIORES
resumen_inicial: El teorema fundamental de la geometría euclidiana establece que la
  suma de las medidas de los tres ángulos interiores de cualquier triángulo plano
  es estrictamente igual a 180°.
explicacion_simple: '![Teorema de Suma Interior](/static/img/nodos/teorema-de-la-suma-de-angulos-interiores-de-un-triangulo-igual-a-180-intro.svg)


  Si tomas cualquier triángulo dibujado en una hoja de papel y recortas sus tres esquinas
  para juntarlas una al lado de la otra, siempre formarán una línea recta perfecta
  (un ángulo llano de **$180^\circ$**). No importa si el triángulo es delgado, equilátero
  o rectángulo.'
explicacion_formal: '### Teorema fundamental de Euclides

  En cualquier triángulo en el plano euclidiano $\mathbb{R}^2$, la suma de las medidas
  de sus tres ángulos interiores es constante e idéntica a la medida de un ángulo
  extendido ($180^\circ$ o $\pi \text{ rad}$):


  $$\alpha + \beta + \gamma = 180^\circ \iff \sum_{i=1}^3 \angle_i = \pi \text{ rad}$$


  ### Desglose simbólico y geométrico

  - $\alpha, \beta, \gamma$: Medidas de los ángulos interiores en los vértices $A,
  B, C$.

  - Demostración de Euclides: Al trazar una recta paralela a $\overline{BC}$ por el
  vértice $A$, los ángulos alternos internos forman un par lineal en $A$: $\beta +
  \alpha + \gamma = 180^\circ$.

  - V Postulado: Este teorema es equivalente al postulado de las paralelas de Euclides.


  ### Síntesis didáctica

  La invariante de $180^\circ$ es la ley angular cardinal de la geometría plana, permitiendo
  calcular cualquier ángulo interior conociendo los otros dos.'
definiciones_clave: '- **Teorema de Euclides**: $\alpha + \beta + \gamma = 180^\circ$.

  - **Recta auxiliar paralela**: Línea de apoyo trazada por un vértice paralela al
  lado opuesto para demostrar la propiedad.

  - **Ángulo llano**: Ángulo de $180^\circ$ formado por la unión continua de los 3
  ángulos en la recta paralela. '
propiedades_relaciones: '- **Consecuencia en triángulos equiláteros**: Cada ángulo
  mide exactamente $180^\circ / 3 = 60^\circ$.

  - **Consecuencia en triángulos rectángulos**: Como un ángulo mide $90^\circ$, los
  otros dos agudos son complementarios ($\alpha + \beta = 90^\circ$). '
ejemplo_guiado:
  enunciado: '![Ejemplo de Suma Interior](/static/img/nodos/teorema-de-la-suma-de-angulos-interiores-de-un-triangulo-igual-a-180-ejemplos.svg)


    En un triángulo $\triangle ABC$, el ángulo en $A$ mide el doble que el ángulo
    en $B$, y el ángulo en $C$ mide $30^\circ$. Determina las medidas de los ángulos
    $\alpha$ y $\beta$.'
  pasos:
  - 'Paso 1: Plantear las variables según el enunciado: $\beta = x$, $\alpha = 2x$,
    $\gamma = 30^\circ$.'
  - 'Paso 2: Aplicar el teorema fundamental: $\alpha + \beta + \gamma = 180^\circ$.'
  - 'Paso 3: Sustituir las expresiones algebraicas: $2x + x + 30^\circ = 180^\circ$.'
  - 'Paso 4: Resolver la ecuación lineal: $3x = 180^\circ - 30^\circ = 150^\circ \implies
    x = 50^\circ$.'
  - 'Paso 5: Calcular cada ángulo: $\beta = 50^\circ$, $\alpha = 2(50^\circ) = 100^\circ$.'
  - 'Paso 6: Comprobar: $100^\circ + 50^\circ + 30^\circ = 180^\circ$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Por qué la suma de los tres ángulos interiores de un triángulo es exactamente
    180°?
  choices:
  - text: Porque al trazar una paralela a un lado se forma un ángulo llano con los
      alternos internos
    is_correct: true
  - text: Porque todos los polígonos suman 180°
    is_correct: false
  - text: Porque se define arbitrariamente sin demostración
    is_correct: false
  - text: Solo ocurre en triángulos equiláteros
    is_correct: false
  explanation: Porque al trazar una paralela a un lado se forma un ángulo llano con
    los alternos internos.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En un triángulo rectángulo isósceles, ¿cuánto miden sus dos ángulos agudos?
  choices:
  - text: 45° cada uno (porque 90° / 2 = 45°)
    is_correct: true
  - text: 60° y 30°
    is_correct: false
  - text: 50° y 40°
    is_correct: false
  - text: 90° cada uno
    is_correct: false
  explanation: Como los dos agudos son iguales y suman 90°, miden 45° cada uno (porque
    90° / 2 = 45°).
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Plantear la ecuación $\alpha + \beta + \gamma = 180^\circ$.'
- 'Paso 2: Sustituir los ángulos numéricos conocidos o las expresiones en función
  de $x$.'
- 'Paso 3: Despejar la incógnita y verificar que todos los ángulos resultantes sean
  mayores a $0^\circ$ y menores a $180^\circ$.'
errores_correccion: 'No supongas que la suma angular cambia con el tamaño del triángulo:
  en el plano euclidiano siempre es exactamente 180°.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: 'Si los ángulos de un triángulo están en la razón $1 : 2 : 3$, ¿cuánto
    mide el ángulo mayor?'
  alternativas:
  - $90^\circ$
  - $60^\circ$
  - $120^\circ$
  respuesta: $90^\circ$
  solucion_pasos:
  - $x + 2x + 3x = 180^\circ \implies 6x = 180^\circ \implies x = 30^\circ$. El mayor
    es $3(30^\circ) = 90^\circ$.
- titulo: Ejemplo 2
  enunciado: ¿Puede un triángulo tener ángulos de $55^\circ$, $65^\circ$ y $60^\circ$?
  alternativas:
  - Sí, porque 55° + 65° + 60° = 180°
  - No, porque deben ser todos menores a 50°
  - No, porque dos ángulos deben ser iguales
  respuesta: Sí, porque 55° + 65° + 60° = 180°
  solucion_pasos:
  - La suma es $55^\circ + 65^\circ + 60^\circ = 180^\circ$, cumpliendo exactamente
    el teorema.
- titulo: ¿La suma de los tres ángulos interiores de cualquier triángulo es 180°?
  respuesta: Sí
  solucion_pasos:
  - Sí, es una constante universal en geometría euclidiana plana.
- titulo: ¿Un triángulo puede tener ángulos interiores que sumen 200° en el plano?
  respuesta: 'No'
  solucion_pasos:
  - No, violaría el postulado de las paralelas de Euclides.
errores_frecuentes:
- Igualar la suma de ángulos interiores a 360°.
- Creer que la suma varía si los lados son muy grandes o muy pequeños.
- Olvidar que en un triángulo rectángulo los ángulos agudos suman 90°.
- Despejar la incógnita cometiendo errores de signo en la resta de 180°.
- No verificar que los tres ángulos calculados sumen exactamente $180^\circ$.
afirmaciones_verdaderas:
- La suma de los tres ángulos interiores de cualquier triángulo es $180^\circ$.
- En un triángulo equilátero cada ángulo interior mide $60^\circ$.
al_terminar_debes_poder: '**QUÉ:** Comprender, enunciar y aplicar el teorema de la
  suma de ángulos interiores de un triángulo ($180^\circ$).


  **CÓMO:** Utilizando la relación $\alpha + \beta + \gamma = 180^\circ$ para resolver
  problemas geométricos y algebraicos.


  ![Resumen del Teorema de Suma Interior](/static/img/nodos/teorema-de-la-suma-de-angulos-interiores-de-un-triangulo-igual-a-180-resumen.svg)'
