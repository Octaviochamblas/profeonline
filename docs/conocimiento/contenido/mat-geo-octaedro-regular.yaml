procedimiento:
- 'Paso 1: Verifica que el cuerpo tenga exactamente 8 caras triangulares.'
- 'Paso 2: Verifica que las 8 caras sean triángulos equiláteros congruentes entre
  sí.'
- 'Paso 3: Confirma que en cada uno de los 6 vértices concurran exactamente 4 caras.'
errores_correccion: Evita confundir las unidades de medida (longitud vs. área vs.
  volumen) al trabajar con identificación del octaedro regular.
ejemplos:
- titulo: Ejemplo 1
  enunciado: Aplica los conceptos de identificación del octaedro regular para determinar
    la medida solicitada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Desarrollo paso a paso aplicando identificación del octaedro regular.
- titulo: Ejemplo 2
  enunciado: Analiza la propiedad geométrica de identificación del octaedro regular
    y elige la respuesta adecuada.
  alternativas:
  - Resultado correcto
  - Distractor 1
  - Distractor 2
  respuesta: Resultado correcto
  solucion_pasos:
  - Verificación de las condiciones de identificación del octaedro regular.
- titulo: ¿Se cumple siempre la propiedad principal de identificación del octaedro
    regular en figuras congruentes?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque las figuras congruentes conservan todas sus medidas y ángulos.
- titulo: ¿Puede identificación del octaedro regular asumir un valor negativo cuando
    representa una longitud geométrica?
  respuesta: 'No'
  solucion_pasos:
  - No, las longitudes y distancias geométricas en el espacio real son siempre valores
    no negativos.
errores_frecuentes:
- Declarar un ángulo agudo con un ángulo obtuso en identificación del octaedro regular.
- Omitir elevar al cuadrado la razón de semejanza al comparar áreas en identificación
  del octaedro regular.
- Sumar longitudes y áreas como si tuvieran las mismas dimensiones en identificación
  del octaedro regular.
- Declarar la altura con la mediana o la bisectriz en un triángulo arbitrario.
- Usar la fórmula de perímetro en lugar de la de área al resolver problemas de identificación
  del octaedro regular.
afirmaciones_verdaderas:
- En todo triángulo la suma de las medidas de los ángulos interiores es siempre $180^\circ$.
- Las transformaciones isométricas (traslación, rotación, reflexión) conservan la
  forma y el tamaño de la figura original.
