semantic_id: MAT.GEO.POLIEDROS_PRISMAS.OCTAEDRO_REGULAR
resumen_inicial: 'Identificación del octaedro regular: conceptos, teoremas, propiedades
  geométricas y cálculo en Geometría del Espacio y Cuerpos Geométricos.'
explicacion_simple: El octaedro regular se puede imaginar como dos pirámides cuadradas
  idénticas pegadas por su base, formando un cuerpo con 8 caras triangulares.
explicacion_formal: '![Octaedro regular](/static/img/geometria/espacio-cuerpos/octaedro-regular.svg)


  ### Definición formal


  El octaedro regular es uno de los cinco sólidos platónicos. Tiene 8 caras (todas
  triángulos equiláteros congruentes), 6 vértices y 12 aristas. En cada vértice concurren
  exactamente 4 caras.


  ### Desarrollo didáctico


  En la figura, el octaedro puede visualizarse como dos pirámides de base cuadrada
  unidas por esa base: 4 vértices forman el ''ecuador'' cuadrado, y los otros 2 vértices
  son las puntas superior e inferior. Cada una de las 8 caras triangulares conecta
  un lado del ecuador con una de las dos puntas.'
definiciones_clave: '- **Identificación del octaedro regular**: Elemento o propiedad
  fundamental en el estudio de geometría del espacio y cuerpos geométricos.'
propiedades_relaciones: '- **Relaciones geométricas**: Conexión entre vértices, lados,
  ángulos o trasformaciones asociadas a identificación del octaedro regular.'
