semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.ASOCIATIVA_MULTIPLICACION
resumen_inicial: La propiedad asociativa de la multiplicación establece que al multiplicar
  tres o más números racionales, la forma de agrupar los factores no altera el producto
  final.
explicacion_simple: 'Si tienes que multiplicar tres fracciones como $\frac{1}{2} \times
  \frac{3}{4} \times \frac{2}{5}$, la **propiedad asociativa** te da permiso para
  agrupar los factores como te sea más conveniente. Puedes multiplicar primero las
  dos primeras $(\frac{1}{2} \times \frac{3}{4}) \times \frac{2}{5} = \frac{3}{8}
  \times \frac{2}{5} = \frac{6}{40} = \frac{3}{20}$, o agrupar las dos últimas $\frac{1}{2}
  \times (\frac{3}{4} \times \frac{2}{5}) = \frac{1}{2} \times \frac{6}{20} = \frac{6}{40}
  = \frac{3}{20}$. En ambos caminos obtienes la misma respuesta.

  '
explicacion_formal: 'Formalmente, la multiplicación sobre el conjunto de los números
  racionales $\mathbb{Q}$ satisface la **propiedad asociativa**:

  $$\forall q_1, q_2, q_3 \in \mathbb{Q}, \quad (q_1 \cdot q_2) \cdot q_3 = q_1 \cdot
  (q_2 \cdot q_3)$$


  Demostración: sean $q_1 = \frac{a}{b}$, $q_2 = \frac{c}{d}$ y $q_3 = \frac{e}{f}$
  con $b, d, f \in \mathbb{Z} \setminus \{0\}$.

  1. Lado izquierdo: $(q_1 \cdot q_2) \cdot q_3 = \left(\frac{a \cdot c}{b \cdot d}\right)
  \cdot \frac{e}{f} = \frac{(a \cdot c) \cdot e}{(b \cdot d) \cdot f}$.

  2. Lado derecho: $q_1 \cdot (q_2 \cdot q_3) = \frac{a}{b} \cdot \left(\frac{c \cdot
  e}{d \cdot f}\right) = \frac{a \cdot (c \cdot e)}{b \cdot (d \cdot f)}$.

  Dado que los enteros $\mathbb{Z}$ cumplen la asociatividad del producto ($(a \cdot
  c) \cdot e = a \cdot (c \cdot e)$ y $(b \cdot d) \cdot f = b \cdot (d \cdot f)$),
  ambos agrupamientos son algebraicamente idénticos.

  '
definiciones_clave: '- **Propiedad asociativa multiplicativa**: Invarianza del producto
  de tres o más racionales ante cambios de agrupamiento: $(q_1 \cdot q_2) \cdot q_3
  = q_1 \cdot (q_2 \cdot q_3)$.

  - **Agrupamiento mediante paréntesis**: Asignación de prioridad operacional interna
  en expresiones compuestas.

  - **Simplificación cruzada previa global**: Facilidad para cancelar numeradores
  y denominadores de cualquier factor de la cadena gracias a la combinación de asociatividad
  y conmutatividad.

  '
propiedades_relaciones: '- **Optimización de cálculos**: Permite multiplicar parejas
  de fracciones que produzcan simplificaciones inmediatas o números enteros fáciles.

  - **Ausencia de asociatividad en la división**: La división en $\mathbb{Q}$ NO es
  asociativa ($(q_1 \div q_2) \div q_3 \neq q_1 \div (q_2 \div q_3)$).

  - **Axioma de Cuerpo**: Es un requerimiento esencial para que $(\mathbb{Q}, +, \cdot)$
  sea un cuerpo algebraico.

  '
ejemplo_guiado:
  enunciado: Demuestra la asociatividad multiplicativa resolviendo de dos maneras
    el producto $q_1 = \frac{4}{5}$, $q_2 = \frac{5}{8}$ y $q_3 = \frac{2}{3}$.
  pasos:
  - 'Agrupamiento 1: calcular $\left(\frac{4}{5} \cdot \frac{5}{8}\right) \cdot \frac{2}{3}$.'
  - 'Resolver el paréntesis (cancelando $5$): $\frac{4}{8} \cdot \frac{2}{3} = \frac{1}{2}
    \cdot \frac{2}{3} = \frac{2}{6} = \frac{1}{3}$.'
  - 'Agrupamiento 2: calcular $\frac{4}{5} \cdot \left(\frac{5}{8} \cdot \frac{2}{3}\right)$.'
  - 'Resolver el paréntesis: $\frac{4}{5} \cdot \frac{10}{24} = \frac{4}{5} \cdot
    \frac{5}{12}$.'
  - 'Multiplicar y simplificar (cancelando $5$): $\frac{4}{12} = \frac{1}{3}$.'
  - 'Concluir: en ambos agrupamientos se obtiene $\frac{1}{3}$.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué postula la propiedad asociativa de la multiplicación en el conjunto
    $\mathbb{Q}$?
  choices:
  - text: 'Que la forma de agrupar los factores mediante paréntesis no altera el producto
      final: $(q_1 \cdot q_2) \cdot q_3 = q_1 \cdot (q_2 \cdot q_3)$.'
    is_correct: true
  - text: Que multiplicar tres números siempre da 1.
    is_correct: false
  - text: Que se deben sumar las fracciones antes de multiplicar.
    is_correct: false
  - text: Que la división entre fracciones es asociativa.
    is_correct: false
  explanation: 'La correcta es Que la forma de agrupar los factores mediante paréntesis
    no altera el producto final: $(q_1 \cdot q_2) \cdot q_3 = q_1 \cdot (q_2 \cdot
    q_3)$.: garantiza la invariancia del producto total.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: ¿Cuál es el resultado de calcular $\frac{7}{9} \cdot \left(\frac{9}{7}
    \cdot \frac{4}{5}\right)$ utilizando asociatividad?
  choices:
  - text: \$\frac{4}{5}$
    is_correct: true
  - text: \$\frac{28}{35}$
    is_correct: false
  - text: \$\frac{63}{45}$
    is_correct: false
  - text: \$\frac{1}{5}$
    is_correct: false
  explanation: 'La alternativa correcta es: \$\frac{4}{5}$. La correcta es \frac{4}{5}:
    asociando $\left(\frac{7}{9} \cdot \frac{9}{7}\right) \cdot \frac{4}{5} = 1 \cdot
    \frac{4}{5} = \frac{4}{5}$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Disponer los tres factores a multiplicar $q_1 \cdot q_2 \cdot q_3$.'
- 'Paso 2: Evaluar la primera agrupación $(q_1 \cdot q_2) \cdot q_3$.'
- 'Paso 3: Evaluar la segunda agrupación $q_1 \cdot (q_2 \cdot q_3)$.'
- 'Paso 4: Comprobar la igualdad entre ambos valores simplificados.'
errores_correccion: 'Un error de concepto es asumir que la división de fracciones
  también es asociativa. Verifiquemos: $(8 \div 4) \div 2 = 2 \div 2 = 1$, mientras
  que $8 \div (4 \div 2) = 8 \div 2 = 4$. ¡Son distintos! **La división NO cumple
  la propiedad asociativa**.

  '
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcula $\left(\frac{2}{3} \cdot \frac{3}{4}\right) \cdot \frac{4}{5}$.
  alternativas:
  - \$\frac{2}{5}$
  - \$\frac{24}{60}$ = \$\frac{1}{5}$
  - \$\frac{9}{20}$
  respuesta: \$\frac{2}{5}$
  solucion_pasos:
  - 'Paréntesis: $\frac{2}{3} \cdot \frac{3}{4} = \frac{2}{4} = \frac{1}{2}$.'
  - 'Multiplicación final: $\frac{1}{2} \cdot \frac{4}{5} = \frac{4}{10} = \frac{2}{5}$.'
- titulo: Ejemplo 2
  enunciado: ¿Demuestra la igualdad $\frac{1}{3} \cdot \left(3 \cdot \frac{5}{7}\right)
    = \frac{5}{7}$ la propiedad asociativa?
  alternativas:
  - Sí, porque agrupa primero $\frac{1}{3} \cdot 3 = 1$ y luego multiplica por $\frac{5}{7}$.
  - No, porque interviene un entero.
  - No, es una propiedad conmutativa pura.
  respuesta: Sí, porque agrupa primero $\frac{1}{3} \cdot 3 = 1$ y luego multiplica
    por $\frac{5}{7}$.
  solucion_pasos:
  - 'Por asociatividad: $\left(\frac{1}{3} \cdot 3\right) \cdot \frac{5}{7} = 1 \cdot
    \frac{5}{7} = \frac{5}{7}$.'
- titulo: ¿Se puede aplicar la propiedad asociativa a la multiplicación de números
    mixtos previa conversión a impropias?
  respuesta: Sí
  solucion_pasos:
  - Sí, transformados a impropias son números en $\mathbb{Q}$ que cumplen todos sus
    axiomas.
- titulo: ¿Permite la asociatividad eliminar completamente los paréntesis en cadenas
    de multiplicación pura?
  respuesta: Sí
  solucion_pasos:
  - Sí, en una cadena de productos se puede escribir $q_1 \cdot q_2 \cdot q_3$ sin
    ningún paréntesis.
errores_frecuentes:
- Intentar aplicar la propiedad asociativa a la división de fracciones.
- Confundir la propiedad asociativa (agrupar) con la conmutativa (ordenar).
- No respetar el orden interno de los paréntesis al verificar paso a paso.
- Creer que la asociatividad no se cumple si intervienen números racionales negativos.
- Multiplicar los numeradores y sumar los denominadores.
afirmaciones_verdaderas:
- 'La multiplicación de números racionales es asociativa: $(q_1 \cdot q_2) \cdot q_3
  = q_1 \cdot (q_2 \cdot q_3)$.'
- La forma de agrupar los factores en un producto de tres o más racionales no altera
  el producto final.
al_terminar_debes_poder: 'Debes ser capaz de aplicar la propiedad asociativa de la
  multiplicación para simplificar cadenas de productos racionales.

  '
