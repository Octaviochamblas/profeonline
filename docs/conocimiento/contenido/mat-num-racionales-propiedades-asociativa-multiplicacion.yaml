semantic_id: MAT.NUM.RACIONALES_PROPIEDADES.ASOCIATIVA_MULTIPLICACION
resumen_inicial: 'La propiedad asociativa de la multiplicación establece que al multiplicar
  tres o más racionales, la forma de agruparlos no altera el producto: $(q_1 \cdot
  q_2) \cdot q_3 = q_1 \cdot (q_2 \cdot q_3)$.'
explicacion_simple: Al multiplicar tres fracciones juntas, podemos agruparlas de la
  forma que nos resulte más fácil. Podemos multiplicar primero las dos primeras y
  luego el resultado por la tercera, o multiplicar las dos últimas primero; el producto
  final será exactamente el mismo.
explicacion_formal: 'Para cualesquiera tres racionales $q_1, q_2, q_3 \in \mathbb{Q}$,
  la **Asociatividad Multiplicativa** exige:


  $$(q_1 \cdot q_2) \cdot q_3 = q_1 \cdot (q_2 \cdot q_3)$$


  **Desglose de la fórmula:**

  - Invarianza del agrupamiento: Permite simplificar factores compartidos entre cualquier
  par de fracciones en una cadena de multiplicación.


  > **Complemento didáctico:** Facilita la simplificación cruzada encadenada al multiplicar
  tres o más fracciones.'
definiciones_clave: '- **Asociatividad multiplicativa**: Libertad para agrupar factores
  en la multiplicación sin modificar el resultado.'
propiedades_relaciones: '- **Invarianza de agrupación multiplicativa**: $(q_1 \cdot
  q_2) \cdot q_3 = q_1 \cdot (q_2 \cdot q_3)$.'
ejemplo_guiado:
  enunciado: Verifique la asociatividad multiplicativa con $\left(\frac{1}{2} \cdot
    \frac{2}{3}\right) \cdot \frac{3}{4}$ y $\frac{1}{2} \cdot \left(\frac{2}{3} \cdot
    \frac{3}{4}\right)$.
  pasos:
  - 'Paso 1: Agrupación A: $\left(\frac{1}{2} \cdot \frac{2}{3}\right) \cdot \frac{3}{4}
    = \frac{1}{3} \cdot \frac{3}{4} = \frac{1}{4}$.'
  - 'Paso 2: Agrupación B: $\frac{1}{2} \cdot \left(\frac{2}{3} \cdot \frac{3}{4}\right)
    = \frac{1}{2} \cdot \frac{1}{2} = \frac{1}{4}$.'
  - 'Paso 3: Comparar ambos productos: $\frac{1}{4} = \frac{1}{4}$.'
  - 'Conclusión: Se cumple la asociatividad multiplicativa.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Qué establece la propiedad asociativa de la multiplicación en Q?
  choices:
  - text: (q1 · q2) · q3 = q1 · (q2 · q3) (la forma de agrupar los factores no altera
      el producto)
    is_correct: true
  - text: (q1 · q2) · q3 = q1 + q2 + q3
    is_correct: false
  - text: '(q1 : q2) : q3 = q1 : (q2 : q3)'
    is_correct: false
  - text: No se pueden multiplicar tres números
    is_correct: false
  explanation: La alternativa correcta es '(q1 · q2) · q3 = q1 · (q2 · q3) (la forma
    de agrupar los factores no altera el producto)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para la multiplicación de 1/2, 2/3 y 3/4, ¿cuál fue
    el producto final?
  choices:
  - text: 1/4
    is_correct: true
  - text: 6/24
    is_correct: false
  - text: 1/2
    is_correct: false
  - text: 3/4
    is_correct: false
  explanation: La alternativa correcta es '1/4'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Resolver el producto dentro del primer paréntesis $(q_1 \cdot q_2)$ y luego
  por $q_3$.'
- 'Paso 2: Resolver el producto dentro del segundo paréntesis $(q_2 \cdot q_3)$ y
  luego por $q_1$.'
- 'Paso 3: Verificar que ambos productos globales sean idénticos.'
errores_correccion: '- **Error 1: Intentar aplicar asociatividad a divisiones sucesivas
  ($(a:b):c = a:(b:c)$).** **Cómo corregirlo:** La división NO es asociativa ($(8:4):2
  = 1$, pero $8:(4:2) = 4$).


  - **Error 2: Distribuir la multiplicación sobre otra multiplicación ($a \cdot (b
  \cdot c) = (a \cdot b) \cdot (a \cdot c)$).** **Cómo corregirlo:** La distributividad
  aplica sobre SUMAS o RESTAS, no sobre multiplicaciones.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Calcule $(2/5 \cdot 3/4) \cdot 5/3$.
  alternativas:
  - 1/2
  - 30/60
  - 2/4
  respuesta: 1/2
  solucion_pasos:
  - 'Agrupando inteligentemente: $2/5 \cdot (3/4 \cdot 5/3) = 2/5 \cdot 5/4 = 2/4
    = 1/2$.'
- titulo: Ejemplo 2
  enunciado: ¿Es asociativa la división de fracciones?
  alternativas:
  - No, alterar los paréntesis modifica el cociente resultante
  - Sí, siempre
  - Solo para fracciones impropias
  respuesta: No, alterar los paréntesis modifica el cociente resultante
  solucion_pasos:
  - $(a:b):c \neq a:(b:c)$ en general.
- titulo: ¿Se cumple (q1 · q2) · q3 = q1 · (q2 · q3) para cualesquiera racionales?
  respuesta: Sí
  solucion_pasos:
  - Sí, es un axioma de la multiplicación en $\mathbb{Q}$.
- titulo: ¿Es (1/3 · 3/5) · 5/7 igual a 1/7?
  respuesta: Sí
  solucion_pasos:
  - Sí, $(1/5) \cdot 5/7 = 1/7$.
errores_frecuentes:
- Modificar los paréntesis de agrupación en la multiplicación de fracciones altera
  el producto.
- La propiedad asociativa permite cambiar los paréntesis en cadenas de divisiones
  consecutivas.
- Multiplicar $a \cdot (b \cdot c)$ exige duplicar $a$ como $(a \cdot b) \cdot (a
  \cdot c)$.
- La asociatividad multiplicativa es válida únicamente si todos los factores son enteros.
- Agrupar factores racionales invierte el signo positivo del producto.
afirmaciones_verdaderas:
- 'La multiplicación en $\mathbb{Q}$ cumple la propiedad asociativa: $(q_1 \cdot q_2)
  \cdot q_3 = q_1 \cdot (q_2 \cdot q_3)$.'
- La división en $\mathbb{Q}$ no cumple la propiedad asociativa.
al_terminar_debes_poder: Al terminar serás capaz de aplicar la propiedad asociativa
  multiplicativa en $\mathbb{Q}$, agrupando conveniente y libremente tres o más factores
  racionales.
fuente: Texto escolar MINEDUC — Números 7° Básico / PAES.
