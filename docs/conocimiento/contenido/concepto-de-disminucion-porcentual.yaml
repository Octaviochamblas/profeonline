resumen_inicial: La disminución porcentual resta una fracción equivalente $(1 - p)$
  al valor inicial $V_i$, reduciendo su magnitud a un nuevo valor final $V_f = V_i
  \cdot (1 - p)$ ($p = P/100$).
explicacion_simple: Una disminución porcentual ocurre cuando una cantidad pierde una
  parte proporcional de su valor. Para calcular el nuevo valor en un solo paso, multiplicamos
  la cantidad inicial por $1$ menos el porcentaje en decimal (por ejemplo, restar
  el 20% equivale a multiplicar por $0,80$).
explicacion_formal: 'Para un valor inicial $V_i > 0$ y una tasa de reducción $P\%$,
  la **Disminución Porcentual** se define mediante el factor de decrecimiento $F_{dec}
  = 1 - \frac{P}{100}$:


  $$V_f = V_i - \left(\frac{P}{100} \cdot V_i\right) = V_i \cdot \left(1 - \frac{P}{100}\right)
  = V_i \cdot (1 - p)$$


  **Factor multiplicativo:**

  - Para $P\% = 25\% \implies F_{dec} = 1 - 0,25 = 0,75$ (el valor final es el $75\%$
  del inicial).'
definiciones_clave: '- **Disminución porcentual**: Reducción proporcional expresada
  por el factor $F_{dec} = 1 - \frac{P}{100}$.'
propiedades_relaciones: '- **Factor de decrecimiento**: $0 < F_{dec} < 1$ para toda
  reducción con $0 < P < 100$.'
ejemplo_guiado:
  enunciado: La población de una especie de $1.200$ ejemplares disminuyó en un $15\%$.
    Calcule la nueva población.
  pasos:
  - 'Paso 1: Determinar el factor de decrecimiento: $F = 1 - 0,15 = 0,85$.'
  - 'Paso 2: Multiplicar la población inicial por el factor: $V_f = 1.200 \cdot 0,85$.'
  - 'Paso 3: Resolver el producto: $1.200 \cdot 0,85 = 1.020$.'
  - 'Conclusión: La nueva población es de $1.020$ ejemplares.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el factor multiplicativo Fdec para calcular el valor final con
    una disminución del P%?
  choices:
  - text: Fdec = 1 - (P / 100)
    is_correct: true
  - text: Fdec = 1 + (P / 100)
    is_correct: false
  - text: Fdec = P / 100
    is_correct: false
  - text: Fdec = 100 - P
    is_correct: false
  explanation: La alternativa correcta es 'Fdec = 1 - (P / 100)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado para 1.200 ejemplares con disminución del 15%, ¿cuál
    fue la nueva población?
  choices:
  - text: 1.020 ejemplares
    is_correct: true
  - text: 1.000 ejemplares
    is_correct: false
  - text: 1.050 ejemplares
    is_correct: false
  - text: 980 ejemplares
    is_correct: false
  explanation: La alternativa correcta es '1.020 ejemplares'.
  reinforcement_section: Ejemplo guiado
al_terminar_debes_poder: Al terminar serás capaz de calcular una disminución porcentual
  multiplicando el valor inicial por el factor de decrecimiento $F_{dec} = 1 - \frac{P}{100}$.
semantic_id: MAT.NUM.VARIACION_PORCENTUAL.DISMINUCION_CONCEPTO
procedimiento:
- 'Paso 1: Identificar la tasa de variación $P\%$ y determinar si es aumento ($1 +
  p$) o descuento ($1 - p$).'
- 'Paso 2: Multiplicar el valor inicial por el factor multiplicativo correspondiente.'
- 'Paso 3: Resolver numéricamente y verificar que el resultado final responda a la
  situación planteada.'
errores_correccion: '- **Error 1: Sumar o restar porcentajes sucesivos directamente
  (pensar que $-20\%$ y $-10\%$ dan $-30\%$).** **Cómo corregirlo:** Los porcentajes
  sucesivos se MULTIPLICAN por sus factores decimales ($0,80 \cdot 0,90 = 0,72 \implies
  -28\%$).


  - **Error 2: Usar el valor final como denominador al calcular la variación porcentual.**
  **Cómo corregirlo:** El denominador para el cambio relativo es SIEMPRE el valor
  inicial $V_i$.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: Ejemplo de MAT.NUM.VARIACION_PORCENTUAL.DISMINUCION_CONCEPTO.
  alternativas:
  - Resultado correcto
  - Incorrecto A
  - Incorrecto B
  respuesta: Resultado correcto
  solucion_pasos:
  - Aplicación directa de factores de variación porcentual.
- titulo: Ejemplo 2
  enunciado: Verificación de factor multiplicativo.
  alternativas:
  - Cumple el factor
  - No cumple
  - Indeterminado
  respuesta: Cumple el factor
  solucion_pasos:
  - Demostración formal por $1 \pm p$.
- titulo: ¿Equivale el IVA en Chile a multiplicar el neto por 1,19?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $1 + 0,19 = 1,19$.
- titulo: ¿Altera el orden en que se aplican dos descuentos sucesivos el precio final?
  respuesta: 'No'
  solucion_pasos:
  - No, por la propiedad conmutativa del producto de factores.
errores_frecuentes:
- Sumar directamente dos porcentajes de descuento sucesivos aplicados sobre un mismo
  producto.
- Utilizar el precio final como el denominador de referencia al calcular la variación
  porcentual relativa.
- Dividir por 0,19 para extraer el Impuesto al Valor Agregado (IVA) de un precio Bruto.
- Un descuento del $20\%$ seguido de un aumento del $20\%$ devuelve el producto a
  su precio original.
- Restar el número entero del porcentaje al precio sin convertirlo a su factor decimal
  $1 - d$.
afirmaciones_verdaderas:
- El aumento o descuento porcentual se calcula directamente multiplicando el valor
  inicial por el factor $(1 \pm p)$.
- Dos descuentos sucesivos del $a\%$ y $b\%$ equivalen al factor acumulado $(1 - a/100)(1
  - b/100)$.
