semantic_id: MAT.NUM.VARIACION_PORCENTUAL.DISMINUCION_CONCEPTO
estado: publicado
fuente: Texto escolar MINEDUC — Números 1° Medio / PAES
resumen_inicial: La disminución porcentual consiste en reducir una cantidad base $V_i$
  restando un porcentaje de sí misma, lo que equivale a multiplicar por el factor
  de reducción $F = 1 - \frac{d}{100}$.
explicacion_simple: 'Cuando una cantidad disminuye porcentualmente, el valor final
  es menor que el inicial porque se le descuenta una proporción de sí misma. Por ejemplo,
  si un estanque de $500$ litros pierde el $20\%$ de su agua, no pierde 20 litros,
  sino $500 \cdot 0,20 = 100$ litros, quedando $400$ litros. En un solo paso, multiplicamos
  por $1 - 0,20 = 0,80$.


  ![concepto-de-disminucion-porcentual](/static/img/nodos/concepto-de-disminucion-porcentual-intro.svg)

  '
explicacion_formal: 'Para un valor inicial $V_i > 0$ y una tasa de reducción $d >
  0$ (con $d \le 100$), la **Disminución Porcentual** se define como el valor final
  $V_f$ obtenido tras restar la variación absoluta $\Delta V = \left(\frac{d}{100}\right)
  \cdot V_i$:


  $$V_f = V_i - \left(\frac{d}{100} \cdot V_i\right) = V_i \cdot \left(1 - \frac{d}{100}\right)
  = V_i \cdot F_{\text{dis}}$$


  Donde $F_{\text{dis}} = 1 - d_{\text{dec}} < 1$ es el **factor multiplicador de
  reducción**.'
definiciones_clave: '- **Disminución porcentual**: Pérdida o merma proporcional a
  la cantidad base mediante el factor $F = 1 - \frac{d}{100}$.

  - **Factor de reducción**: Número decimal en el intervalo $[0, 1)$ que expresa la
  fracción complementaria que se conserva de la cantidad original.'
propiedades_relaciones: '- **Magnitud final**: $V_f < V_i$ siempre que la tasa de
  disminución $0 < d < 100$.

  - **Límite de anulación**: Si $d = 100\%$, entonces $F = 0$ y $V_f = 0$.'
al_terminar_debes_poder: '![Resumen visual](/static/img/nodos/concepto-de-disminucion-porcentual-resumen.svg)


  QUÉ: Definir y calcular disminuciones porcentuales sobre cantidades base. CÓMO:
  Multiplicando el valor inicial $V_i$ por el factor complementario $F = 1 - \frac{d}{100}$
  para obtener directamente el valor final $V_f = V_i \cdot (1 - d_{\text{dec}})$.'
