procedimiento:
- 'Paso 1: Identificar el valor inicial $V_i$ y la tasa de disminución porcentual
  $d\%$.'
- 'Paso 2: Calcular el factor decimal complementario $F = 1 - \frac{d}{100}$.'
- 'Paso 3: Multiplicar $V_f = V_i \cdot F$ para obtener el valor remanente tras la
  reducción.'
ejemplo_guiado:
  enunciado: Una bodega almacena $600\text{ kg}$ de fruta. Por evaporación, la masa
    disminuye un $15\%$. ¿Cuántos kilogramos de fruta quedan?
  pasos:
  - 'Paso 1: Identificar la masa inicial $V_i = 600\text{ kg}$ y la tasa de reducción
    $d = 15\%$.'
  - 'Paso 2: Determinar el factor complementario: $F = 1 - 0,15 = 0,85$.'
  - 'Paso 3: Multiplicar la masa por el factor: $V_f = 600 \cdot 0,85 = 510\text{
    kg}$.'
  - 'Conclusión: Quedan $510\text{ kg}$ de fruta en la bodega.'
  imagen: /static/img/nodos/concepto-de-disminucion-porcentual-ejemplos.svg
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es el factor multiplicador correspondiente a una disminución del
    $35\%$?
  choices:
  - text: $0,65$
    is_correct: true
  - text: $0,35$
    is_correct: false
  - text: $1,35$
    is_correct: false
  - text: $0,75$
    is_correct: false
  explanation: El factor de disminución es $F = 1 - \frac{35}{100} = 1 - 0,35 = 0,65$.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si una deuda de $\$80.000$ disminuye un $25\%$, ¿cuál es el saldo restante?
  choices:
  - text: $\$60.000$
    is_correct: true
  - text: $\$20.000$
    is_correct: false
  - text: $\$65.000$
    is_correct: false
  - text: $\$75.000$
    is_correct: false
  explanation: $V_f = 80.000 \cdot (1 - 0,25) = 80.000 \cdot 0,75 = 60.000$.
  reinforcement_section: Ejemplo guiado
errores_correccion: '- **Error 1: Confundir la cantidad perdida con la cantidad restante.**
  **Cómo corregirlo:** La cantidad perdida es $V_i \cdot d_{\text{dec}}$, mientras
  que la cantidad final que queda es $V_i \cdot (1 - d_{\text{dec}})$.

  - **Error 2: Usar factores mayores a 1 en disminuciones.** **Cómo corregirlo:**
  Una disminución siempre tiene factor $F < 1$.'
ejemplos:
- titulo: Reducción de consumo eléctrico
  enunciado: Un hogar reduce su consumo eléctrico de $450\text{ kWh}$ en un $20\%$
    durante el invierno. ¿Cuál es su nuevo consumo?
  alternativas:
  - $360\text{ kWh}$
  - $380\text{ kWh}$
  - $350\text{ kWh}$
  - $400\text{ kWh}$
  respuesta: $360\text{ kWh}$
  solucion_pasos:
  - Identificar la base $V_i = 450\text{ kWh}$ y la tasa $d = 20\%$.
  - 'Factor complementario: $1 - 0,20 = 0,80$.'
  - 'Multiplicar: $V_f = 450 \cdot 0,80 = 360\text{ kWh}$.'
- titulo: Merma en producción industrial
  enunciado: De un lote de $1.200$ piezas, se descarta el $5\%$ por defectos de fabricación.
    ¿Cuántas piezas útiles se obtienen?
  alternativas:
  - $1.140$ piezas
  - $1.150$ piezas
  - $1.100$ piezas
  - $1.180$ piezas
  respuesta: $1.140$ piezas
  solucion_pasos:
  - 'Factor de piezas útiles: $1 - 0,05 = 0,95$.'
  - 'Multiplicar: $1.200 \cdot 0,95 = 1.140$ piezas.'
- titulo: ¿Una disminución del $50\%$ reduce la cantidad a la mitad?
  respuesta: Sí
  solucion_pasos:
  - Sí, porque $F = 1 - 0,50 = 0,50 = \frac{1}{2}$.
- titulo: ¿Una disminución del $100\%$ deja la mitad del valor inicial?
  respuesta: 'No'
  solucion_pasos:
  - No, porque $F = 1 - 1 = 0$, dejando el valor final en cero.
errores_frecuentes:
- Quedarse con el monto restado creyendo que es la respuesta final pedida.
- Restar directamente el porcentaje en números absolutos sin multiplicar por la base.
- Aplicar factores mayores a 1 para disminuciones.
afirmaciones_verdaderas:
- El factor multiplicativo de una disminución porcentual siempre es menor a 1.
- Una disminución del $d\%$ deja como remanente el $(100 - d)\%$ de la cantidad inicial.
