semantic_id: MAT.GEO.TEOREMA_TALES.SEGMENTOS_PROPORCIONALES
resumen_inicial: 'La identificación de segmentos proporcionales consiste en establecer correctamente la igualdad de razones $\frac{a}{b} = \frac{c}{d}$ entre los segmentos homólogos delimitados por paralelas, verificando que el producto cruzado $a \cdot d = b \cdot c$ se mantenga constante.'
explicacion_simple: |
  ![Segmentos Proporcionales y Producto Cruzado](/static/img/nodos/identificacion-de-segmentos-proporcionales-determinados-por-paralelas-y-transversales-intro.svg)

  Tomas un trozo de arriba y lo divides por el de abajo en una línea; eso debe ser igual al trozo de arriba dividido por el de abajo en la otra línea.
explicacion_formal: |
  ### Definición y propiedades formales
  Dadas dos transversales $T_1$ y $T_2$ cortadas por un haz de rectas paralelas que determinan los segmentos $a, b \in T_1$ y $c, d \in T_2$:

  1. **Proporción elemental**: $\frac{a}{b} = \frac{c}{d}$
  2. **Propiedad fundamental**: $a \cdot d = b \cdot c$
  3. **Proporciones alternadas y compuestas**:
     $$\frac{a}{c} = \frac{b}{d}, \quad \frac{a + b}{b} = \frac{c + d}{d}, \quad \frac{a}{a + b} = \frac{c}{c + d}$$

  ### Desglose simbólico y geométrico
  - $a, b, c, d \in \mathbb{R}^+$: Medidas lineales estrictamente positivas.
  - Invarianza de escala: La razón $\frac{a}{b}$ es adimensional y coincide con la razón de semejanza entre las secciones correspondientes.

  ### Síntesis didáctica
  Dominar las proporciones compuestas permite resolver problemas donde se conoce la longitud total del segmento en vez de sus partes individuales.
definiciones_clave: |
  - **Teorema de Tales**: Teorema de proporcionalidad geométrica determinado por un haz de rectas paralelas cortadas por secantes.
  - **Segmentos homólogos**: Segmentos correspondientes delimitados por las mismas rectas paralelas en distintas transversales.
  - **Recíproco de Tales**: Teorema que demuestra el paralelismo de dos rectas a partir de la igualdad de razones entre segmentos.
  - **Modelamiento de sombras**: Aplicación geométrica para calcular alturas inaccesibles mediante la sombra solar proyectada.
propiedades_relaciones: |
  - **Proporcionalidad directa**: $\frac{a}{b} = \frac{c}{d} \iff a \cdot d = b \cdot c$.
  - **Semejanza en triángulos**: Si $DE \parallel BC \implies \Delta ADE \sim \Delta ABC \implies \frac{AD}{AB} = \frac{DE}{BC}$.
  - **Ecuación de sombras**: $\frac{H}{h} = \frac{S}{s} \implies H = h \cdot \frac{S}{s}$.
ejemplo_guiado:
  enunciado: |
    ![Ejemplo de Segmentos Proporcionales y Producto Cruzado](/static/img/nodos/identificacion-de-segmentos-proporcionales-determinados-por-paralelas-y-transversales-ejemplos.svg)

    Aplica el Teorema de Tales o su recíproco para determinar la medida desconocida o justificar la relación de paralelismo.
  pasos:
  - 'Paso 1: Identificar las rectas paralelas y las rectas transversales en la figura.'
  - 'Paso 2: Plantear la proporción geométrica emparejando correctamente los segmentos homólogos.'
  - 'Paso 3: Sustituir los valores numéricos conocidos en la ecuación de proporcionalidad.'
  - 'Paso 4: Resolver mediante producto cruzado y despejar la incógnita algebraica.'
  - 'Paso 5: Registrar la solución final acompañada de su correspondiente unidad métrica.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuál es la relación algebraica equivalente a la proporción a/b = c/d?
  choices:
  - text: $a \cdot d = b \cdot c$
    is_correct: true
  - text: Opción incorrecta de prueba A
    is_correct: false
  - text: Opción incorrecta de prueba B
    is_correct: false
  - text: Opción incorrecta de prueba C
    is_correct: false
  explanation: 'La relación equivalente es $a \cdot d = b \cdot c$, conocida como la propiedad del producto cruzado.'
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: Si a = 3, b = 5 y c = 6, ¿cuál es el valor de d para que los segmentos sean proporcionales?
  choices:
  - text: $d = 10$
    is_correct: true
  - text: Opción incorrecta secundaria 1
    is_correct: false
  - text: Opción incorrecta secundaria 2
    is_correct: false
  - text: Opción incorrecta secundaria 3
    is_correct: false
  explanation: 'El valor es $d = 10$, obtenido mediante $d = \frac{b \cdot c}{a} = \frac{5 \cdot 6}{3} = 10$.'
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Reconocer las rectas paralelas dadas o por demostrar en la configuración geométrica.'
- 'Paso 2: Identificar los segmentos correspondientes determinados en cada una de las transversales.'
- 'Paso 3: Formular la igualdad de razones $\frac{a}{b} = \frac{c}{d}$ o $\frac{AD}{AB} = \frac{DE}{BC}$.'
- 'Paso 4: Efectuar el producto cruzado para despejar la incógnita $x$.'
- 'Paso 5: Comprobar la coherencia del resultado con el orden de magnitud de la figura.'
errores_correccion: 'En triángulos, recuerda que para relacionar las bases paralelas DE y BC debes usar la longitud del lado total AB ($AD/AB$), nunca el segmento parcial inferior DB.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál es el valor correspondiente calculado mediante el Teorema de Tales?
  alternativas:
  - '$d = 10$'
  - 'Valor incorrecto 1'
  - 'Valor incorrecto 2'
  respuesta: '$d = 10$'
  solucion_pasos:
  - 'El valor es $d = 10$, obtenido mediante $d = \frac{b \cdot c}{a} = \frac{5 \cdot 6}{3} = 10$.'
- titulo: Ejemplo 2
  enunciado: ¿En un triángulo con DE || BC se puede afirmar que AD/DB = DE/BC?
  alternativas:
  - No, para relacionar las bases DE y BC se debe usar el lado completo AD/AB
  - Sí, siempre es correcto usar AD/DB con las bases
  - Solo si el triángulo es equilátero
  respuesta: No, para relacionar las bases DE y BC se debe usar el lado completo AD/AB
  solucion_pasos:
  - 'La razón entre las bases paralelas $DE/BC$ proviene de la semejanza de triángulos $\Delta ADE \sim \Delta ABC$, por lo que la proporción correcta es $DE/BC = AD/AB$.'
- titulo: ¿El Recíproco del Teorema de Tales permite demostrar que dos rectas son paralelas?
  respuesta: Sí
  solucion_pasos:
  - 'Sí, si se comprueba que los segmentos determinados están en la misma proporción, el recíproco garantiza que las rectas son estrictamente paralelas.'
- titulo: ¿Las sombras para medir una altura con el Teorema de Tales pueden medirse a distintas horas del día?
  respuesta: 'No'
  solucion_pasos:
  - 'No, deben medirse estrictamente a la misma hora para que el ángulo de inclinación solar sea exactamente el mismo y los rayos sean paralelos.'
errores_frecuentes:
- 'Usar el segmento inferior DB en vez del lado total AB al calcular las bases paralelas DE y BC.'
- 'Invertir el orden de los segmentos al plantear la proporción (ej: mezclar arriba/abajo con abajo/arriba).'
- 'Olvidar sumar los segmentos parciales cuando el problema proporciona la longitud total.'
- 'Medir las sombras a diferentes horas del día al modelar alturas con rayos solares.'
- 'No verificar el paralelismo antes de aplicar el Teorema directo de Tales.'
afirmaciones_verdaderas:
- 'Tres o más rectas paralelas cortadas por transversales determinan segmentos correspondientes proporcionales.'
- 'Si una recta corta dos lados de un triángulo en segmentos proporcionales, entonces es paralela al tercer lado.'
al_terminar_debes_poder: |
  **QUÉ:** Enunciar, aplicar y justificar problemas geométricos usando el Teorema de Tales y su recíproco.

  **CÓMO:** Planteando proporciones entre segmentos homólogos ($\frac{a}{b} = \frac{c}{d}$), resolviendo con producto cruzado y modelando sombras solares.

