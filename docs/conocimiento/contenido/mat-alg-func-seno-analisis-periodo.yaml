semantic_id: MAT.ALG.FUNC_SENO_ANALISIS.PERIODO
resumen_inicial: 'Identificación del período fundamental de la función seno: círculo
  unitario, amplitud, período y transformaciones de Análisis de la función seno.'
explicacion_simple: La forma ondulada de la función seno se debe a que su patrón de
  valores se repite exactamente cada cierta distancia a lo largo del eje $x$.
explicacion_formal: '### Definición formal


  Una función $f$ es periódica con periodo $T>0$ si $f(x+T)=f(x)$ para todo $x$, y
  $T$ es el menor valor positivo que cumple esa condición. Para $f(x)=\sin(x)$, el
  periodo es $T=2\pi$, ya que sumar $2\pi$ al ángulo corresponde a dar una vuelta
  completa en el círculo unitario, regresando al mismo punto.


  ### Desarrollo didáctico


  $\sin(0)=0$ y $\sin(0+2\pi)=\sin(2\pi)=0$: coinciden. Lo mismo ocurre en cualquier
  punto: $\sin(\pi/2)=1$ y $\sin(\pi/2+2\pi)=\sin(5\pi/2)=1$.'
definiciones_clave: '- **Identificación del período fundamental de la función seno**:
  Función periódica fundamentada en las coordenadas del círculo unitario o relaciones
  trigonométricas.'
propiedades_relaciones: '- **Propiedades periódicas**: $\sin^2(x) + \cos^2(x) = 1$,
  período $T = 2\pi / |B|$, amplitud $A = |A|$ y simetrías (seno impar, coseno par)
  aplicadas a identificación del período fundamental de la función seno.'
ejemplo_guiado:
  enunciado: Analiza o calcula los parámetros de la función trigonométrica aplicando
    identificación del período fundamental de la función seno.
  pasos:
  - Identificar el ángulo en radianes o grados y su posición en el círculo unitario.
  - Calcular las coordenadas del punto $(x, y) = (\cos \theta, \sin \theta)$ o los
    parámetros $A, B, C, D$ de identificación del período fundamental de la función
    seno.
  - Determinar la amplitud, período $T = 2\pi / B$ y desplazamiento vertical/horizontal.
  - Esbozar la onda trigonométrica o interpretar el valor resultante.
