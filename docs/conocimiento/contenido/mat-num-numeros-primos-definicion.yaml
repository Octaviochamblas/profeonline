semantic_id: MAT.NUM.NUMEROS_PRIMOS.PRIMO_DEFINICION
resumen_inicial: 'Un número primo es un entero mayor que 1 que tiene exactamente dos divisores positivos distintos: el 1 y sí mismo.'
explicacion_simple: 'Los números primos son los bloques fundamentales o ''átomos'' con los que se construyen todos los demás números enteros mediante la multiplicación. Un número es primo cuando es imposible descomponerlo o armarlo arreglando objetos en forma de rectángulo lleno que no sea una sola fila de largo unitario.


  ![Definición de número primo](/static/img/nodos/definicion-de-numero-primo-intro.svg)'
explicacion_formal: 'Un entero $p \in \mathbb{N}$ se define formalmente como un **Número Primo** si cumple simultáneamente:


  $$p > 1 \quad \land \quad D(p) = \{1, p\}$$


  **Desglose de la fórmula:**

  - $p > 1$: Condición de magnitud estricta que excluye al $1$, a los negativos y al cero.

  - $D(p)$: Conjunto de divisores positivos de $p$.

  - $|D(p)| = 2$: Existencia unívoca y exacta de dos divisores distintos (el $1$ y el propio $p$).


  > **Complemento didáctico:** El número 2 es el único número primo que también es par. Todos los demás números primos son impares.'
definiciones_clave: '- **Número primo**: Entero $p > 1$ cuyos únicos divisores positivos son el $1$ y $p$.

  - **Primalidad**: Propiedad indivisible de un número en la multiplicación.'
propiedades_relaciones: '- **Infinitud de primos**: Existen infinitos números primos (Teorema de Euclides).

  - **Único primo par**: El número $2$ es el primer y único primo par.'
ejemplo_guiado:
  enunciado: 'Verifique si el número $13$ cumple la definición formal de número primo evaluando su conjunto de divisores.


    ![Ejemplo Definición de número primo](/static/img/nodos/definicion-de-numero-primo-ejemplos.svg)'
  pasos:
  - 'Paso 1: Comprobar la restricción inicial: $13 > 1$ (cumplido).'
  - 'Paso 2: Encontrar todos los divisores positivos de 13: $D(13) = \{1, 13\}$.'
  - 'Paso 3: Contar la cantidad de divisores: $|D(13)| = 2$.'
  - 'Conclusión: Como $13 > 1$ y sus únicos divisores son 1 y 13, $13$ es un número primo.'
checkpoints:
- placement: after_explicacion_formal
  question: ¿Cuáles son las condiciones necesarias para que un número p sea considerado primo?
  choices:
  - text: Que sea mayor que 1 y tenga exactamente dos divisores distintos (1 y p)
    is_correct: true
  - text: Que sea un número impar mayor que 0
    is_correct: false
  - text: Que se pueda dividir entre 2 y 3 al mismo tiempo
    is_correct: false
  - text: Que tenga infinitos divisores
    is_correct: false
  explanation: La alternativa correcta es 'Que sea mayor que 1 y tenga exactamente dos divisores distintos (1 y p)'.
  reinforcement_section: Explicación formal
- placement: after_ejemplo_guiado
  question: En el ejemplo guiado, ¿por qué el 13 es un número primo?
  choices:
  - text: Porque es mayor que 1 y sus únicos divisores positivos son el 1 y el 13
    is_correct: true
  - text: Porque es un número par
    is_correct: false
  - text: Porque termina en 3
    is_correct: false
  - text: Porque es un múltiplo de 5
    is_correct: false
  explanation: La alternativa correcta es 'Porque es mayor que 1 y sus únicos divisores positivos son el 1 y el 13'.
  reinforcement_section: Ejemplo guiado
procedimiento:
- 'Paso 1: Verificar que el número sea mayor que 1.'
- 'Paso 2: Calcular el conjunto de divisores positivos del número.'
- 'Paso 3: Concluir que es primo si el conjunto contiene exactamente dos elementos ($1$ y el número).'
errores_correccion: '- **Error 1: Considerar al número 1 como un número primo.** **Cómo corregirlo:** El 1 tiene un solo divisor ($D(1)=\{1\}$); la definición exige EXACTAMENTE dos divisores distintos.


  - **Error 2: Pensar que todos los números impares son primos (ej: creer que 9 u 15 son primos).** **Cómo corregirlo:** 9 es divisible por 3 y 15 por 5, por lo que no son primos.'
ejemplos:
- titulo: Ejemplo 1
  enunciado: ¿Cuál de los siguientes números es un número primo?
  alternativas:
  - '17'
  - '15'
  - '9'
  respuesta: '17'
  solucion_pasos:
  - $D(17) = \{1, 17\}$ (exactamente 2 divisores), por ende 17 es primo.
- titulo: Ejemplo 2
  enunciado: Indique cuál es el único número primo que es de paridad par.
  alternativas:
  - '2'
  - '4'
  - '0'
  respuesta: '2'
  solucion_pasos:
  - El 2 es el único entero par cuyo conjunto de divisores es $\{1, 2\}$.
- titulo: ¿Es el número 23 un número primo?
  respuesta: Sí
  solucion_pasos:
  - Sí, sus únicos divisores positivos son 1 y 23.
  alternativas:
  - texto: Sí
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple rigurosamente con las definiciones de primalidad, compuestos y cantidad de divisores.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la clasificación formal de divisores en ℕ entrega un resultado unívoco.
  - texto: El número pertenece a ambas categorías
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos de números primos y compuestos son estrictamente disjuntos.
- titulo: ¿Es el número 21 un número primo?
  respuesta: 'No'
  solucion_pasos:
  - No, 21 es divisible por 3 y por 7 ($D(21)=\{1, 3, 7, 21\}$).
  alternativas:
  - texto: 'No'
    es_correcta: true
    retroalimentacion: ¡Correcto! Cumple rigurosamente con las definiciones de primalidad, compuestos y cantidad de divisores.
  - texto: Ninguna de las anteriores
    es_correcta: false
    retroalimentacion: Incorrecto, la clasificación formal de divisores en ℕ entrega un resultado unívoco.
  - texto: El número pertenece a ambas categorías
    es_correcta: false
    retroalimentacion: Incorrecto, los conjuntos de números primos y compuestos son estrictamente disjuntos.
errores_frecuentes:
- El número 1 es el primer y menor número primo que existe en los enteros.
- Todos los números impares positivos son números primos.
- Existen varios números pares que se clasifican como números primos.
- El conjunto de los números primos es un conjunto finito que termina en 100.
- Un número primo se puede dividir de forma exacta por cualquier número impar.
afirmaciones_verdaderas:
- Un número primo es un entero mayor que 1 que tiene exactamente dos divisores positivos distintos.
- El 2 es el único número par que pertenece al conjunto de los números primos.
al_terminar_debes_poder: '**QUÉ:** Definir rigurosamente y reconocer un número primo en el conjunto de los números naturales.


  **CÓMO:** Verificando que $p > 1$ y que su conjunto de divisores positivos sea exactamente de dos elementos distintos $D(p) = \{1, p\}$, reconociendo al 2 como el único primo par.


  ![Resumen Definición de número primo](/static/img/nodos/definicion-de-numero-primo-resumen.svg)'
