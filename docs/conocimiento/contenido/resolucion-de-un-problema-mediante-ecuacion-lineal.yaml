semantic_id: MAT.ALG.MODELAMIENTO_LINEAL.RESOLUCION_PROBLEMA
resumen_inicial: 'Resolución de un problema mediante ecuación lineal: propiedades,
  resolución y modelamiento en Modelamiento con ecuaciones lineales.'
explicacion_simple: 'Te concentras puramente en el álgebra: reduces términos semejantes
  ($3x = 30$) y despejas ($x = 10$).'
explicacion_formal: '### Definición formal


  Una vez planteada la ecuación $E_1(x)=E_2(x)$ que modela el problema, resolverla
  consiste en aplicar únicamente las reglas algebraicas de transposición y reducción
  de términos semejantes hasta obtener $x=k$ para algún valor numérico $k$, con independencia
  del contexto verbal que dio origen a la ecuación.


  ### Desarrollo didáctico


  Te concentras puramente en el álgebra: reduces términos semejantes ($3x = 30$) y
  despejas ($x = 10$).


  Aquí aplicas todo lo que has aprendido en los módulos anteriores: transposición,
  uso del MCM si hay fracciones, o distribución de signos negativos si hay restas.'
definiciones_clave: '- **Resolución de un problema mediante ecuación lineal**: Herramienta
  matemática para determinar valores desconocidos que satisfacen la igualdad.'
propiedades_relaciones: '- **Propiedades de la igualdad**: Adición, multiplicación
  y transposición de términos aplicados a resolución de un problema mediante ecuación
  lineal.'
ejemplo_guiado:
  enunciado: Resuelve el problema o despeja la incógnita aplicando resolución de un
    problema mediante ecuación lineal.
  pasos:
  - Identificar la incógnita y agrupar los términos lineales de un lado y constantes
    del otro.
  - Aplicar el procedimiento de despeje o método de solución de resolución de un problema
    mediante ecuación lineal.
  - Calcular la solución o par ordenado $(x, y)$.
  - Sustituir la solución en la ecuación original para verificar la igualdad.
checkpoints:
